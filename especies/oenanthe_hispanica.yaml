id: oenanthe_hispanica
nombre_cientifico: Oenanthe hispanica
nombre:
  es: Collalba rubia
  en: Western black-eared wheatear
  fr: Traquet oreillard
  de: Mittelmeersteinschmätzer
  it: Monachella
  pt: Chasco-ruivo
descripcion:
  es: >-
    Pequeña ave migratoria de medios mediterráneos abiertos y pedregosos del suroeste europeo. La IUCN la
    clasifica globalmente como preocupación menor (LC). En primavera y verano, obsérvala desde caminos con
    prismáticos sin usar reclamos ni acercarte a nidos.
  en: >-
    Small migratory bird of open, stony Mediterranean habitats in south-western Europe. The IUCN classifies it
    globally as Least Concern (LC). In spring and summer, watch it from tracks with binoculars without using
    playback or approaching nests.
  fr: >-
    Petit oiseau migrateur des milieux méditerranéens ouverts et pierreux du sud-ouest de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). Au printemps et en été, observez-le depuis les chemins
    aux jumelles sans utiliser d'appeaux ni vous approcher des nids.
  de: >-
    Kleiner Zugvogel offener, steiniger Mittelmeerlebensräume im Südwesten Europas. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn im Frühjahr und Sommer von Wegen aus mit dem
    Fernglas, ohne Klangattrappen zu nutzen oder sich Nestern zu nähern.
  it: >-
    Piccolo uccello migratore di ambienti mediterranei aperti e pietrosi dell'Europa sud-occidentale. La IUCN
    la classifica a livello globale come a rischio minimo (LC). In primavera e in estate, osservala dai
    sentieri con il binocolo senza usare richiami né avvicinarti ai nidi.
  pt: >-
    Pequena ave migratória de meios mediterrânicos abertos e pedregosos do sudoeste europeu. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Na primavera e no verão, observe-a a partir dos
    caminhos com binóculos sem usar chamarizes nem se aproximar de ninhos.
