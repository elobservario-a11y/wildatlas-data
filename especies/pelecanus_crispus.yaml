id: pelecanus_crispus
nombre_cientifico: Pelecanus crispus
nombre:
  es: Pelícano ceñudo
  en: Dalmatian pelican
  fr: Pélican frisé
  de: Krauskopfpelikan
  it: Pellicano riccio
  pt: Pelicano-crespo
descripcion:
  es: >-
    Gran ave acuática de lagos, deltas y marismas del sureste europeo y del Mediterráneo oriental. La IUCN la
    clasifica globalmente como casi amenazada (NT). Observa sus grupos cuando pesquen con telescopio desde la
    orilla, sin acercarte en embarcaciones a las colonias.
  en: >-
    Large waterbird of lakes, deltas and marshes in south-eastern Europe and the eastern Mediterranean. The
    IUCN classifies it globally as Near Threatened (NT). Watch groups fishing through a scope from the shore,
    without approaching colonies in boats.
  fr: >-
    Grand oiseau aquatique des lacs, deltas et marais du sud-est de l'Europe et de Méditerranée orientale.
    L'UICN le classe globalement quasi menacé (NT). Observez ses groupes pêcher à la longue-vue depuis la
    rive, sans vous approcher des colonies en embarcation.
  de: >-
    Großer Wasservogel von Seen, Flussdeltas und Sümpfen Südosteuropas und des östlichen Mittelmeers. Die IUCN
    stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie Trupps beim Fischen mit dem Spektiv
    vom Ufer aus, ohne sich Kolonien mit Booten zu nähern.
  it: >-
    Grande uccello acquatico di laghi, delta e paludi dell'Europa sud-orientale e del Mediterraneo orientale.
    La IUCN lo classifica a livello globale come prossimo alla minaccia (NT). Osserva i gruppi mentre pescano
    con il cannocchiale dalla riva, senza avvicinarti alle colonie in barca.
  pt: >-
    Grande ave aquática de lagos, deltas e sapais do sudeste europeu e do Mediterrâneo oriental. A IUCN
    classifica-o globalmente como quase ameaçado (NT). Observe os seus grupos quando pescam com telescópio a
    partir da margem, sem se aproximar de embarcação das colónias.
