id: pelagodroma_marina
nombre_cientifico: Pelagodroma marina
nombre:
  es: Paíño pechialbo
  en: White-faced storm petrel
  fr: Océanite frégate
  de: Fregattensturmschwalbe
  it: Uccello delle tempeste facciabianca
  pt: Painho-de-ventre-branco
descripcion:
  es: >-
    Pequeña ave pelágica que cría en islas del Atlántico, incluidas Canarias y otras islas macaronésicas. La
    IUCN la clasifica globalmente como preocupación menor (LC). Durante su estancia reproductora, prioriza
    observarla sobre el mar desde salidas responsables sin desembarcar en colonias ni usar luces.
  en: >-
    Small pelagic bird breeding on Atlantic islands, including the Canary Islands and other Macaronesian
    islands. The IUCN classifies it globally as Least Concern (LC). During its breeding stay, favour watching
    it over the sea on responsible trips without landing on colonies or using lights.
  fr: >-
    Petit oiseau pélagique qui niche sur des îles de l'Atlantique, notamment aux Canaries et dans d'autres
    îles macaronésiennes. L'UICN le classe globalement en préoccupation mineure (LC). Pendant son séjour
    reproducteur, privilégiez l'observation en mer lors de sorties responsables sans débarquer dans les
    colonies ni utiliser de lumières.
  de: >-
    Kleiner Hochseevogel, der auf Atlantikinseln brütet, darunter den Kanaren und weiteren makaronesischen
    Inseln. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Bevorzugen Sie zur Brutzeit die
    Beobachtung auf See mit verantwortungsvollen Anbietern, ohne Kolonien zu betreten oder Licht einzusetzen.
  it: >-
    Piccolo uccello pelagico che nidifica su isole dell'Atlantico, incluse le Canarie e altre isole
    macaronesiche. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante il periodo
    riproduttivo, prediligi l'osservazione in mare con uscite responsabili senza sbarcare nelle colonie né
    usare luci.
  pt: >-
    Pequena ave pelágica que nidifica em ilhas do Atlântico, incluindo as Canárias e outras ilhas
    macaronésicas. A IUCN classifica-a globalmente como pouco preocupante (LC). Durante a sua estadia
    reprodutora, dê preferência à observação no mar em saídas responsáveis sem desembarcar em colónias nem
    usar luzes.
