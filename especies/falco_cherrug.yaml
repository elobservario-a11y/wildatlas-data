id: falco_cherrug
nombre_cientifico: Falco cherrug
nombre:
  es: Halcón sacre
  en: Saker falcon
  fr: Faucon sacre
  de: Sakerfalke
  it: Sacro
  pt: Falcão-sacre
descripcion:
  es: >-
    Halcón de estepas, pastizales y campos abiertos, con poblaciones europeas en el centro y este del
    continente. La IUCN la clasifica globalmente como en peligro (EN). Obsérvalo de día desde caminos con
    telescopio, sin acercarte a nidos ni intentar atraerlo.
  en: >-
    Falcon of steppes, grasslands and open fields, with European populations in the centre and east of the
    continent. The IUCN classifies it globally as Endangered (EN). Watch it during the day from tracks with a
    scope, without approaching nests or trying to lure it.
  fr: >-
    Faucon des steppes, prairies et champs ouverts, avec des populations européennes dans le centre et l'est
    du continent. L'UICN le classe globalement en danger (EN). Observez-le de jour depuis les chemins à la
    longue-vue, sans vous approcher des nids ni tenter de l'attirer.
  de: >-
    Falke der Steppen, Grasländer und offenen Felder mit europäischen Vorkommen in Mittel- und Osteuropa. Die
    IUCN stuft ihn weltweit als stark gefährdet (EN) ein. Beobachten Sie ihn tagsüber von Wegen aus mit dem
    Spektiv, ohne sich Nestern zu nähern oder ihn anzulocken.
  it: >-
    Falco di steppe, praterie e campi aperti, con popolazioni europee nel centro e nell'est del continente. La
    IUCN lo classifica a livello globale come in pericolo (EN). Osservalo di giorno dai sentieri con il
    cannocchiale, senza avvicinarti ai nidi né tentare di attirarlo.
  pt: >-
    Falcão de estepes, pastagens e campos abertos, com populações europeias no centro e leste do continente. A
    IUCN classifica-o globalmente como em perigo (EN). Observe-o de dia a partir dos caminhos com telescópio,
    sem se aproximar de ninhos nem tentar atraí-lo.
