id: canis_aureus
nombre_cientifico: Canis aureus
nombre:
  es: Chacal dorado
  en: Golden jackal
  fr: Chacal doré
  de: Goldschakal
  it: Sciacallo dorato
  pt: Chacal-dourado
descripcion:
  es: >-
    Cánido adaptable de valles, humedales y mosaicos abiertos, extendido por el sureste europeo y otras
    regiones del continente. La IUCN la clasifica globalmente como preocupación menor (LC). Cuando salga a
    espacios abiertos, obsérvalo a distancia sin usar cebos, reproducir aullidos ni acercarte a madrigueras.
  en: >-
    Adaptable canid of valleys, wetlands and open mosaics, widespread across south-eastern Europe and other
    parts of the continent. The IUCN classifies it globally as Least Concern (LC). When it ventures into open
    ground, watch from a distance without using bait, playing back howls or approaching dens.
  fr: >-
    Canidé adaptable des vallées, zones humides et mosaïques ouvertes, répandu dans le sud-est européen et
    d'autres régions du continent. L'UICN le classe globalement en préoccupation mineure (LC). Lorsqu'il sort
    en milieu ouvert, observez-le à distance sans utiliser d'appâts, diffuser de hurlements ni vous approcher
    des terriers.
  de: >-
    Anpassungsfähiger Wildhund von Tälern, Feuchtgebieten und offenen Mosaiklandschaften, der in Südosteuropa
    und weiteren Regionen des Kontinents verbreitet ist. Die IUCN stuft ihn weltweit als nicht gefährdet (LC)
    ein. Wenn er offene Flächen aufsucht, beobachten Sie ihn aus der Ferne, ohne Köder auszulegen, Heulen
    abzuspielen oder sich Bauen zu nähern.
  it: >-
    Canide adattabile di valli, zone umide e mosaici aperti, diffuso nell'Europa sud-orientale e in altre
    regioni del continente. La IUCN lo classifica a livello globale come a rischio minimo (LC). Quando esce
    negli spazi aperti, osservalo a distanza senza usare esche, riprodurre ululati né avvicinarti alle tane.
  pt: >-
    Canídeo adaptável de vales, zonas húmidas e mosaicos abertos, distribuído pelo sudeste europeu e outras
    regiões do continente. A IUCN classifica-o globalmente como pouco preocupante (LC). Quando sair para
    espaços abertos, observe-o à distância sem usar iscos, reproduzir uivos nem se aproximar de tocas.
