id: equus_hemionus
nombre_cientifico: Equus hemionus
nombre:
  es: Hemión
  en: Onager
  fr: Hémione
  de: Asiatischer Esel
  pt: Hemíono
descripcion:
  es: >-
    Équido de estepas, semidesiertos y llanuras áridas de Asia, sin área natural europea actual documentada en
    la fuente consultada. La IUCN la clasifica globalmente como casi amenazada (NT). En poblaciones
    gestionadas visitables, obsérvalo al amanecer o al atardecer desde recorridos autorizados sin acercarte ni
    alimentarlo.
  en: >-
    Equid of Asian steppes, semi-deserts and arid plains, with no current natural European range documented in
    the consulted source. The IUCN classifies it globally as Near Threatened (NT). In visitable managed
    populations, watch it at dawn or dusk from authorised routes without approaching or feeding it.
  fr: >-
    Équidé des steppes, semi-déserts et plaines arides d'Asie, sans aire naturelle européenne actuelle
    documentée dans la source consultée. L'UICN le classe globalement quasi menacé (NT). Dans les populations
    gérées visitables, observez-le à l'aube ou au crépuscule depuis les parcours autorisés sans vous approcher
    ni le nourrir.
  de: >-
    Equide asiatischer Steppen, Halbwüsten und Trockenebenen ohne aktuelles natürliches europäisches
    Verbreitungsgebiet laut herangezogener Quelle. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT)
    ein. In zugänglichen betreuten Beständen beobachten Sie ihn in der Morgen- oder Abenddämmerung von
    erlaubten Wegen aus, ohne sich zu nähern oder zu füttern.
  pt: >-
    Equídeo de estepes, semidesertos e planícies áridas da Ásia, sem área natural europeia atual documentada
    na fonte consultada. A IUCN classifica-o globalmente como quase ameaçado (NT). Em populações geridas
    visitáveis, observe-o ao amanhecer ou ao entardecer a partir de percursos autorizados sem se aproximar nem
    o alimentar.
