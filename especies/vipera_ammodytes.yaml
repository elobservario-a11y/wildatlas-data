id: vipera_ammodytes
nombre_cientifico: Vipera ammodytes
nombre:
  es: Víbora cornuda
  en: Nose-horned viper
  de: Europäische Hornotter
descripcion:
  es: >-
    Víbora de laderas secas y pedregosas del sur y sureste europeo, con vegetación dispersa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante la estación activa, obsérvala desde el sendero
    sin tocarla, acorralarla ni levantar piedras para buscarla.
  en: >-
    Viper of dry, stony slopes in southern and south-eastern Europe, with sparse vegetation. The IUCN
    classifies it globally as Least Concern (LC). During the active season, watch from the trail without
    touching, cornering it or lifting stones to look for it.
  de: >-
    Viper trockener, steiniger Hänge Süd- und Südosteuropas mit lückiger Vegetation. Die IUCN stuft sie
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie sie während der aktiven Jahreszeit vom Weg aus, ohne
    sie zu berühren, in die Enge zu treiben oder auf der Suche Steine anzuheben.
