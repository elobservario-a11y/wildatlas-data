id: calonectris_diomedea
nombre_cientifico: Calonectris diomedea
nombre:
  es: Pardela cenicienta
  en: Scopoli's shearwater
  fr: Puffin cendré
  de: Gelbschnabel-Sturmtaucher
  it: Berta maggiore mediterranea
  pt: Cagarra
descripcion:
  es: >-
    Ave marina que se reproduce en islas mediterráneas y pasa la estación no reproductora en el Atlántico. La
    IUCN la clasifica globalmente como preocupación menor (LC). Durante la temporada de cría, obsérvala
    volando sobre el mar desde la costa, sin visitar madrigueras ni iluminar colonias.
  en: >-
    Seabird that breeds on Mediterranean islands and spends the non-breeding season in the Atlantic. The IUCN
    classifies it globally as Least Concern (LC). During the breeding season, watch it flying over the sea
    from the coast, without visiting burrows or shining lights on colonies.
  fr: >-
    Oiseau marin qui niche sur les îles méditerranéennes et passe la saison non reproductrice dans
    l'Atlantique. L'UICN le classe globalement en préoccupation mineure (LC). Pendant la période de
    nidification, observez-le en vol au-dessus de la mer depuis la côte, sans visiter les terriers ni éclairer
    les colonies.
  de: >-
    Seevogel, der auf Mittelmeerinseln brütet und die Zeit außerhalb der Brutzeit im Atlantik verbringt. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn zur Brutzeit von der Küste aus im
    Flug über dem Meer, ohne Bruthöhlen aufzusuchen oder Kolonien anzuleuchten.
  it: >-
    Uccello marino che nidifica sulle isole mediterranee e trascorre la stagione non riproduttiva
    nell'Atlantico. La IUCN la classifica a livello globale come a rischio minimo (LC). Durante la stagione
    riproduttiva, osservala in volo sul mare dalla costa, senza visitare le tane né illuminare le colonie.
  pt: >-
    Ave marinha que se reproduz em ilhas mediterrânicas e passa a época não reprodutora no Atlântico. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Durante a época de reprodução, observe-a a voar
    sobre o mar a partir da costa, sem visitar tocas nem iluminar colónias.
