id: salmo_trutta
nombre_cientifico: Salmo trutta
nombre:
  es: Trucha común
  en: Sea trout
  fr: Truite fario
  de: Forelle
  it: Trota atlantica
descripcion:
  es: >-
    Salmónido nativo de buena parte de Europa, con poblaciones de ríos, lagos y formas migratorias marinas. La
    IUCN la clasifica globalmente como preocupación menor (LC). Obsérvalo cuando sea visible en aguas claras
    desde la orilla, sin entrar en frezaderos ni aportar alimento.
  en: >-
    Salmonid native to much of Europe, with river, lake and migratory sea-trout forms. The IUCN classifies it
    globally as Least Concern (LC). Watch it when visible in clear water from the bank, without entering
    spawning beds or offering food.
  fr: >-
    Salmonidé indigène d'une grande partie de l'Europe, avec des populations de rivière, de lac et des formes
    migratrices marines. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le lorsqu'il est
    visible en eau claire depuis la berge, sans entrer dans les frayères ni apporter de nourriture.
  de: >-
    In weiten Teilen Europas heimischer Lachsfisch mit Fluss-, See- und marinen Wanderformen. Die IUCN stuft
    sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie sie, wenn sie in klarem Wasser sichtbar ist, vom
    Ufer aus, ohne Laichgründe zu betreten oder zu füttern.
  it: >-
    Salmonide nativo di gran parte d'Europa, con popolazioni di fiume, lago e forme migratrici marine. La IUCN
    la classifica a livello globale come a rischio minimo (LC). Osservala quando è visibile in acque limpide
    dalla riva, senza entrare nei siti di frega né dare cibo.
