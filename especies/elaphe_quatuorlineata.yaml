id: elaphe_quatuorlineata
nombre_cientifico: Elaphe quatuorlineata
nombre:
  es: Culebra de cuatro rayas
  en: Four-lined snake
  de: Vierstreifennatter
descripcion:
  es: >-
    Culebra de bosques claros, matorrales y lindes mediterráneos de Italia y la península balcánica. La IUCN
    la clasifica globalmente como preocupación menor (LC). Durante la estación cálida, obsérvala desde caminos
    sin capturarla, acorralarla ni levantar piedras o refugios.
  en: >-
    Snake of open woodlands, scrubland and Mediterranean edges in Italy and the Balkan Peninsula. The IUCN
    classifies it globally as Least Concern (LC). During the warm season, watch it from tracks without
    catching, cornering it or lifting stones and shelters.
  de: >-
    Natter lichter Wälder, Buschländer und mediterraner Säume in Italien und auf der Balkanhalbinsel. Die IUCN
    stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie sie in der warmen Jahreszeit von Wegen
    aus, ohne sie zu fangen, in die Enge zu treiben oder Steine und Verstecke anzuheben.
