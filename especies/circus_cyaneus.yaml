id: circus_cyaneus
nombre_cientifico: Circus cyaneus
nombre:
  es: Aguilucho pálido
  en: Hen harrier
  fr: Busard Saint-Martin
  de: Kornweihe
  it: Albanella reale
  pt: Tartaranhão-azulado
descripcion:
  es: >-
    Rapaz de marismas, brezales y pastizales europeos, con poblaciones migratorias y residentes. La IUCN la
    clasifica globalmente como preocupación menor (LC). En invierno, observa sus vuelos rasantes desde
    miradores sin acercarte a dormideros ni penetrar en la vegetación.
  en: >-
    Raptor of marshes, heathlands and European grasslands, with migratory and resident populations. The IUCN
    classifies it globally as Least Concern (LC). In winter, watch its low flights from viewpoints without
    approaching roosts or entering vegetation.
  fr: >-
    Rapace des marais, landes et prairies européennes, avec des populations migratrices et sédentaires. L'UICN
    le classe globalement en préoccupation mineure (LC). En hiver, observez ses vols rasants depuis les
    belvédères sans vous approcher des dortoirs ni pénétrer dans la végétation.
  de: >-
    Greifvogel europäischer Sümpfe, Heiden und Grasländer mit Zug- und Standvogelpopulationen. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie im Winter seine bodennahen Flüge von
    Aussichtspunkten aus, ohne sich Schlafplätzen zu nähern oder die Vegetation zu betreten.
  it: >-
    Rapace di paludi, brughiere e praterie europee, con popolazioni migratrici e stanziali. La IUCN la
    classifica a livello globale come a rischio minimo (LC). In inverno, osserva i suoi voli radenti dai punti
    panoramici senza avvicinarti ai dormitori né penetrare nella vegetazione.
  pt: >-
    Ave de rapina de sapais, urzais e pastagens europeias, com populações migratórias e residentes. A IUCN
    classifica-a globalmente como pouco preocupante (LC). No inverno, observe os seus voos rasantes a partir
    de miradouros sem se aproximar de dormitórios nem entrar na vegetação.
