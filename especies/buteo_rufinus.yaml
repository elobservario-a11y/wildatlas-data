id: buteo_rufinus
nombre_cientifico: Buteo rufinus
nombre:
  es: Busardo moro
  en: Long-legged buzzard
  fr: Buse féroce
  de: Adlerbussard
  it: Poiana codabianca
  pt: Bútio-rabo-canela
descripcion:
  es: >-
    Rapaz de terrenos áridos y abiertos, con presencia europea principalmente en el sureste del continente. La
    IUCN la clasifica globalmente como preocupación menor (LC). Obsérvala de día planeando o posada desde
    caminos con prismáticos, sin acercarte a nidos ni utilizar cebos.
  en: >-
    Raptor of arid, open terrain, occurring in Europe mainly in the south-east of the continent. The IUCN
    classifies it globally as Least Concern (LC). Watch it during the day soaring or perched from tracks with
    binoculars, without approaching nests or using bait.
  fr: >-
    Rapace des terrains arides et ouverts, présent en Europe principalement dans le sud-est du continent.
    L'UICN le classe globalement en préoccupation mineure (LC). Observez-le de jour en vol plané ou posé
    depuis les chemins aux jumelles, sans vous approcher des nids ni utiliser d'appâts.
  de: >-
    Greifvogel trockener, offener Landschaften mit europäischem Vorkommen vor allem im Südosten des
    Kontinents. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn tagsüber kreisend
    oder sitzend von Wegen aus mit dem Fernglas, ohne sich Nestern zu nähern oder Köder auszulegen.
  it: >-
    Rapace di terreni aridi e aperti, presente in Europa principalmente nel sud-est del continente. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Osservala di giorno in volo planato o posata dai
    sentieri con il binocolo, senza avvicinarti ai nidi né usare esche.
  pt: >-
    Ave de rapina de terrenos áridos e abertos, com presença europeia sobretudo no sudeste do continente. A
    IUCN classifica-a globalmente como pouco preocupante (LC). Observe-a de dia a planar ou pousada a partir
    dos caminhos com binóculos, sem se aproximar de ninhos nem usar iscos.
