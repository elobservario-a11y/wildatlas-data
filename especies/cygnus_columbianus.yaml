id: cygnus_columbianus
nombre_cientifico: Cygnus columbianus
nombre:
  es: Cisne chico
  en: Bewick's swan
  fr: Cygne siffleur
  de: Pfeifschwan
  it: Cigno minore
  pt: Cisne-pequeno
descripcion:
  es: >-
    Pequeño cisne de humedales árticos, cuyas poblaciones euroasiáticas utilizan regiones europeas para pasar
    el invierno. La IUCN la clasifica globalmente como preocupación menor (LC). En invierno, observa los
    grupos en aguas abiertas y campos desde miradores sin acercarte a dormideros ni alimentarlos.
  en: >-
    Small swan of Arctic wetlands, whose Eurasian populations use European regions to winter. The IUCN
    classifies it globally as Least Concern (LC). In winter, watch groups on open water and fields from
    viewpoints without approaching roosts or feeding them.
  fr: >-
    Petit cygne des zones humides arctiques, dont les populations eurasiatiques utilisent des régions
    européennes pour hiverner. L'UICN le classe globalement en préoccupation mineure (LC). En hiver, observez
    les groupes sur les eaux libres et les champs depuis les belvédères sans vous approcher des dortoirs ni
    les nourrir.
  de: >-
    Kleiner Schwan arktischer Feuchtgebiete, dessen eurasische Populationen europäische Regionen zur
    Überwinterung nutzen. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Gruppen im
    Winter auf offenen Gewässern und Feldern von Aussichtspunkten aus, ohne sich Schlafplätzen zu nähern oder
    sie zu füttern.
  it: >-
    Piccolo cigno delle zone umide artiche, le cui popolazioni eurasiatiche utilizzano regioni europee per
    svernare. La IUCN lo classifica a livello globale come a rischio minimo (LC). In inverno, osserva i gruppi
    su acque aperte e campi dai punti panoramici senza avvicinarti ai dormitori né nutrirli.
  pt: >-
    Pequeno cisne de zonas húmidas árticas, cujas populações euro-asiáticas utilizam regiões europeias para
    passar o inverno. A IUCN classifica-o globalmente como pouco preocupante (LC). No inverno, observe os
    grupos em águas abertas e campos a partir de miradouros sem se aproximar de dormitórios nem os alimentar.
