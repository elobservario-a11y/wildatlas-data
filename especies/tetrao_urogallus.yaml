id: tetrao_urogallus
nombre_cientifico: Tetrao urogallus
nombre:
  es: Urogallo
  en: Western capercaillie
  fr: Grand tétras
  de: Auerhuhn
  it: Urogallo
  pt: Tetraz-grande
descripcion:
  es: >-
    Galliforme de bosques boreales y montanos europeos, con poblaciones meridionales fragmentadas. La IUCN la
    clasifica globalmente como preocupación menor (LC). Prioriza encuentros casuales desde senderos durante el
    día, sin buscar cantaderos ni usar reclamos o acercarte a las crías.
  en: >-
    Grouse of European boreal and montane forests, with fragmented southern populations. The IUCN classifies
    it globally as Least Concern (LC). Favour chance encounters from trails during the day, without searching
    for leks, using playback or approaching chicks.
  fr: >-
    Galliforme des forêts boréales et montagnardes européennes, avec des populations méridionales fragmentées.
    L'UICN le classe globalement en préoccupation mineure (LC). Privilégiez les rencontres fortuites depuis
    les sentiers de jour, sans chercher de places de chant, utiliser d'appeaux ni vous approcher des jeunes.
  de: >-
    Raufußhuhn borealer und montaner Wälder Europas mit lückenhaften südlichen Beständen. Die IUCN stuft es
    weltweit als nicht gefährdet (LC) ein. Bevorzugen Sie zufällige Begegnungen von Wegen aus tagsüber, ohne
    Balzplätze zu suchen, Klangattrappen zu nutzen oder sich Küken zu nähern.
  it: >-
    Galliforme di foreste boreali e montane europee, con popolazioni meridionali frammentate. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Privilegia incontri casuali dai sentieri durante
    il giorno, senza cercare arene di canto, usare richiami né avvicinarti ai piccoli.
  pt: >-
    Galiforme de florestas boreais e montanas europeias, com populações meridionais fragmentadas. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Dê preferência a encontros casuais a partir dos
    trilhos durante o dia, sem procurar locais de cortejo, usar chamarizes nem se aproximar das crias.
