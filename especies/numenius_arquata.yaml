id: numenius_arquata
nombre_cientifico: Numenius arquata
nombre:
  es: Zarapito real
  en: Eurasian curlew
  fr: Courlis cendré
  de: Großer Brachvogel
  it: Chiurlo maggiore
  pt: Maçarico-real
descripcion:
  es: >-
    Limícola de pico largo curvado que cría en prados y otros medios abiertos europeos e inverna en costas y
    humedales. La IUCN la clasifica globalmente como casi amenazada (NT). Durante el paso y la invernada,
    observa desde miradores sin entrar en prados de cría ni levantar bandos.
  en: >-
    Long-billed curved wader breeding on European meadows and open ground and wintering on coasts and
    wetlands. The IUCN classifies it globally as Near Threatened (NT). During passage and wintering, watch
    from viewpoints without entering breeding meadows or flushing flocks.
  fr: >-
    Limicole au long bec arqué qui niche dans les prairies et autres milieux ouverts européens et hiverne sur
    les côtes et zones humides. L'UICN le classe globalement quasi menacé (NT). Lors du passage et de
    l'hivernage, observez depuis les belvédères sans entrer dans les prairies de nidification ni faire
    décoller les groupes.
  de: >-
    Watvogel mit langem, gebogenem Schnabel, der auf europäischen Wiesen und offenen Flächen brütet und an
    Küsten und Feuchtgebieten überwintert. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein.
    Beobachten Sie ihn während des Zugs und im Winter von Aussichtspunkten aus, ohne Brutwiesen zu betreten
    oder Trupps aufzuscheuchen.
  it: >-
    Limicolo dal lungo becco ricurvo che nidifica in prati e altri ambienti aperti europei e sverna lungo
    coste e zone umide. La IUCN lo classifica a livello globale come prossimo alla minaccia (NT). Durante il
    passo e lo svernamento, osserva dai punti panoramici senza entrare nei prati di nidificazione né far
    involare gli stormi.
  pt: >-
    Limícola de bico longo encurvado que nidifica em prados e outros meios abertos europeus e passa o inverno
    em costas e zonas húmidas. A IUCN classifica-o globalmente como quase ameaçado (NT). Durante a passagem e
    a invernada, observe a partir de miradouros sem entrar em prados de criação nem levantar bandos.
