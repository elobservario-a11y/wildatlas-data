id: tetrao_tetrix
nombre_cientifico: Tetrao tetrix
nombre:
  es: Gallo lira
  en: Black grouse
  fr: Tétras lyre
  de: Birkhuhn
descripcion:
  es: >-
    Galliforme de brezales, praderas y bordes de bosque de distintas regiones europeas. La IUCN la clasifica
    globalmente como preocupación menor (LC). Prioriza encuentros desde senderos durante recorridos diurnos,
    sin buscar cantaderos ni utilizar reclamos o acercarte a polladas.
  en: >-
    Grouse of heathlands, grasslands and forest edges across several European regions. The IUCN classifies it
    globally as Least Concern (LC). Favour encounters from trails during daytime walks, without searching for
    leks, using playback or approaching broods.
  fr: >-
    Galliforme des landes, prairies et lisières forestières de différentes régions européennes. L'UICN le
    classe globalement en préoccupation mineure (LC). Privilégiez les rencontres depuis les sentiers lors de
    randonnées diurnes, sans chercher de places de chant, utiliser d'appeaux ni vous approcher des nichées.
  de: >-
    Raufußhuhn von Heiden, Wiesen und Waldrändern verschiedener europäischer Regionen. Die IUCN stuft es
    weltweit als nicht gefährdet (LC) ein. Bevorzugen Sie zufällige Sichtungen von Wegen aus bei
    Tageswanderungen, ohne Balzplätze zu suchen, Klangattrappen zu nutzen oder sich Gesperren zu nähern.
