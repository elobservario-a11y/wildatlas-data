id: romanogobio_kesslerii
nombre_cientifico: Romanogobio kesslerii
nombre:
  es: Gobio de Kessler
  en: Kessler's gudgeon
  de: Kesslers Gründling
  pt: Gobio kessleri
descripcion:
  es: >-
    Pequeño pez de ríos y arroyos de las cuencas del Danubio y Vístula, ligado a corrientes y fondos arenosos.
    La IUCN la clasifica globalmente como preocupación menor (LC). Cuando resulte visible en aguas someras,
    obsérvalo desde la orilla sin entrar en el cauce ni alterar los fondos.
  en: >-
    Small fish of rivers and streams in the Danube and Vistula basins, linked to currents and sandy beds. The
    IUCN classifies it globally as Least Concern (LC). When visible in shallow water, observe from the bank
    without entering the riverbed or disturbing substrates.
  de: >-
    Kleiner Fisch von Flüssen und Bächen der Einzugsgebiete von Donau und Weichsel, gebunden an Strömung und
    sandigen Grund. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Wenn er im Flachwasser sichtbar
    ist, beobachten Sie ihn vom Ufer aus, ohne ins Flussbett zu steigen oder den Grund zu stören.
  pt: >-
    Pequeno peixe de rios e ribeiros das bacias do Danúbio e Vístula, ligado a correntes e fundos arenosos. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Quando for visível em águas rasas, observe-o a
    partir da margem sem entrar no leito nem alterar os fundos.
