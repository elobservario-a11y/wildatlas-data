id: otis_tarda
nombre_cientifico: Otis tarda
nombre:
  es: Avutarda común
  en: Great bustard
  fr: Grande outarde
  de: Großtrappe
  it: Otarda
  pt: Abetarda-comum
descripcion:
  es: >-
    Gran ave terrestre de pastizales y cultivos abiertos del sur y centro de Europa, especialmente de la
    península ibérica. La IUCN la clasifica globalmente como en peligro (EN). Observa los grupos durante sus
    actividades diurnas con telescopio desde caminos, sin entrar en campos ni acercarte al cortejo.
  en: >-
    Large terrestrial bird of grasslands and open farmland of southern and central Europe, especially the
    Iberian Peninsula. The IUCN classifies it globally as Endangered (EN). Watch flocks during daytime
    activity with a scope from tracks, without entering fields or approaching displays.
  fr: >-
    Grand oiseau terrestre des prairies et cultures ouvertes du sud et du centre de l'Europe, en particulier
    de la péninsule Ibérique. L'UICN la classe globalement en danger (EN). Observez les groupes lors de leurs
    activités diurnes à la longue-vue depuis les chemins, sans entrer dans les champs ni vous approcher des
    parades.
  de: >-
    Großer Bodenvogel offener Grasländer und Felder Süd- und Mitteleuropas, insbesondere der Iberischen
    Halbinsel. Die IUCN stuft sie weltweit als stark gefährdet (EN) ein. Beobachten Sie Trupps bei ihren
    Tagesaktivitäten mit dem Spektiv von Wegen aus, ohne Felder zu betreten oder sich Balzplätzen zu nähern.
  it: >-
    Grande uccello terricolo di praterie e coltivi aperti dell'Europa meridionale e centrale, in particolare
    della penisola iberica. La IUCN la classifica a livello globale come in pericolo (EN). Osserva i gruppi
    durante l'attività diurna con il cannocchiale dai sentieri, senza entrare nei campi né avvicinarti alle
    parate.
  pt: >-
    Grande ave terrestre de pastagens e culturas abertas do sul e centro da Europa, especialmente da Península
    Ibérica. A IUCN classifica-a globalmente como em perigo (EN). Observe os bandos durante a atividade diurna
    com telescópio a partir dos caminhos, sem entrar em campos nem se aproximar das exibições.
