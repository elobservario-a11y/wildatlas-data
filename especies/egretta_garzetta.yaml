id: egretta_garzetta
nombre_cientifico: Egretta garzetta
nombre:
  es: Garceta común
  en: Little egret
  fr: Aigrette garzette
  de: Seidenreiher
  it: Garzetta
  pt: Garcinha-branca
descripcion:
  es: >-
    Garza blanca de humedales, riberas y costas europeas, especialmente extendida por las regiones
    meridionales. La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvala cuando busque
    alimento en aguas someras desde caminos, sin entrar en colonias ni seguirla por las orillas.
  en: >-
    White heron of European wetlands, riverbanks and coasts, especially widespread in southern regions. The
    IUCN classifies it globally as Least Concern (LC). Watch it foraging in shallow water from tracks, without
    entering colonies or following it along banks.
  fr: >-
    Héron blanc des zones humides, rives et côtes européennes, particulièrement répandu dans les régions
    méridionales. L'UICN le classe globalement en préoccupation mineure (LC). Observez-la chercher sa
    nourriture en eaux peu profondes depuis les chemins, sans entrer dans les colonies ni la suivre le long
    des berges.
  de: >-
    Weißer Reiher europäischer Feuchtgebiete, Ufer und Küsten, besonders verbreitet in den südlichen Regionen.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn bei der Nahrungssuche im
    Flachwasser von Wegen aus, ohne Kolonien zu betreten oder ihm am Ufer zu folgen.
  it: >-
    Airone bianco di zone umide, rive e coste europee, particolarmente diffuso nelle regioni meridionali. La
    IUCN la classifica a livello globale come a rischio minimo (LC). Osservala mentre cerca cibo in acque
    basse dai sentieri, senza entrare nelle colonie né seguirla lungo le sponde.
  pt: >-
    Garça branca de zonas húmidas, margens e costas europeias, especialmente distribuída pelas regiões
    meridionais. A IUCN classifica-a globalmente como pouco preocupante (LC). Observe-a quando procura
    alimento em águas rasas a partir dos caminhos, sem entrar em colónias nem a seguir pelas margens.
