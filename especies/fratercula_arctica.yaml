id: fratercula_arctica
nombre_cientifico: Fratercula arctica
nombre:
  es: Frailecillo atlántico
  en: Atlantic puffin
  fr: Macareux moine
  de: Papageitaucher
  it: Pulcinella di mare
  pt: Fradinho
descripcion:
  es: >-
    Ave marina que cría en islas y acantilados del Atlántico norte europeo y pasa el invierno en mar abierto.
    La IUCN la clasifica globalmente como vulnerable (VU). En primavera y verano, utiliza miradores y senderos
    señalizados sin acercarte a madrigueras ni bloquear sus accesos.
  en: >-
    Seabird breeding on islands and cliffs of the European North Atlantic and wintering in open sea. The IUCN
    classifies it globally as Vulnerable (VU). In spring and summer, use marked viewpoints and trails without
    approaching burrows or blocking access.
  fr: >-
    Oiseau marin qui niche sur les îles et falaises de l'Atlantique Nord européen et hiverne en pleine mer.
    L'UICN le classe globalement comme vulnérable (VU). Au printemps et en été, utilisez les belvédères et
    sentiers balisés sans vous approcher des terriers ni bloquer leurs accès.
  de: >-
    Seevogel, der auf Inseln und Klippen des europäischen Nordatlantiks brütet und auf offener See
    überwintert. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Nutzen Sie im Frühjahr und Sommer
    markierte Aussichtspunkte und Wege, ohne sich Bruthöhlen zu nähern oder Zugänge zu blockieren.
  it: >-
    Uccello marino che nidifica su isole e scogliere dell'Atlantico settentrionale europeo e sverna in mare
    aperto. La IUCN lo classifica a livello globale come vulnerabile (VU). In primavera e in estate, utilizza
    punti panoramici e sentieri segnalati senza avvicinarti alle tane né bloccarne gli accessi.
  pt: >-
    Ave marinha que nidifica em ilhas e falésias do Atlântico Norte europeu e passa o inverno em mar aberto. A
    IUCN classifica-a globalmente como vulnerável (VU). Na primavera e no verão, utilize miradouros e trilhos
    sinalizados sem se aproximar de tocas nem bloquear os seus acessos.
