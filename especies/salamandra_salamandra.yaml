id: salamandra_salamandra
nombre_cientifico: Salamandra salamandra
nombre:
  es: Salamandra común
  en: Fire salamander
  fr: Salamandre tachetée
  de: Feuersalamander
  pt: Salamandra-de-fogo
descripcion:
  es: >-
    Anfibio de bosques y otros ambientes húmedos de Europa central y meridional, reconocible por su coloración
    amarilla y negra. La IUCN la clasifica globalmente como vulnerable (VU). Durante sus salidas en
    condiciones húmedas, obsérvalo desde caminos sin manipularlo ni alterar refugios o puntos de reproducción.
  en: >-
    Amphibian of forests and other damp habitats in central and southern Europe, recognisable by its
    yellow-and-black pattern. The IUCN classifies it globally as Vulnerable (VU). When it emerges in damp
    conditions, watch from tracks without handling it or disturbing shelters or breeding sites.
  fr: >-
    Amphibien des forêts et autres milieux humides d'Europe centrale et méridionale, reconnaissable à sa
    livrée jaune et noire. L'UICN la classe globalement comme vulnérable (VU). Lors de ses sorties par temps
    humide, observez-la depuis les chemins sans la manipuler ni perturber les abris ou points de reproduction.
  de: >-
    Lurch der Wälder und anderer feuchter Lebensräume Mittel- und Südeuropas, erkennbar an seiner
    gelb-schwarzen Zeichnung. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie ihn bei
    feuchten Bedingungen von Wegen aus, ohne ihn anzufassen oder Verstecke und Fortpflanzungsgewässer zu
    stören.
  pt: >-
    Anfíbio de florestas e outros ambientes húmidos da Europa central e meridional, reconhecível pela
    coloração amarela e preta. A IUCN classifica-a globalmente como vulnerável (VU). Durante as suas saídas em
    condições húmidas, observe-a a partir dos caminhos sem a manipular nem alterar abrigos ou pontos de
    reprodução.
