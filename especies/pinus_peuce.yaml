id: pinus_peuce
nombre_cientifico: Pinus peuce
nombre:
  es: Pino de los Balcanes (molika)
  en: Macedonian pine
  fr: Pin de Macédoine
  de: Rumelische Kiefer
  pt: Pinheiro-da-Macedónia
descripcion:
  es: >-
    Conífera de bosques montanos balcánicos, presente en distintas cordilleras del sureste de Europa. La IUCN
    la clasifica globalmente como casi amenazada (NT). Puede observarse durante todo el año desde rutas
    señalizadas, sin recoger piñas, arrancar ramas ni dañar raíces.
  en: >-
    Conifer of Balkan montane forests, present across several mountain ranges of south-eastern Europe. The
    IUCN classifies it globally as Near Threatened (NT). It can be seen year-round from marked trails, without
    collecting cones, breaking branches or damaging roots.
  fr: >-
    Conifère des forêts montagnardes balkaniques, présent dans différents massifs du sud-est de l'Europe.
    L'UICN le classe globalement quasi menacé (NT). Il peut être observé toute l'année depuis les itinéraires
    balisés, sans ramasser de cônes, casser de branches ni abîmer les racines.
  de: >-
    Nadelbaum montaner Wälder des Balkans, der in verschiedenen Gebirgen Südosteuropas vorkommt. Die IUCN
    stuft sie weltweit als potenziell gefährdet (NT) ein. Sie lässt sich ganzjährig von markierten Wegen aus
    beobachten, ohne Zapfen zu sammeln, Äste abzubrechen oder Wurzeln zu schädigen.
  pt: >-
    Conífera de florestas montanhosas balcânicas, presente em várias cordilheiras do sudeste da Europa. A IUCN
    classifica-o globalmente como quase ameaçado (NT). Pode ser observado durante todo o ano a partir de
    percursos sinalizados, sem recolher pinhas, partir ramos nem danificar raízes.
