id: nycticorax_nycticorax
nombre_cientifico: Nycticorax nycticorax
nombre:
  es: Martinete común
  en: Black-crowned night heron
  fr: Bihoreau gris
  de: Nachtreiher
  it: Nitticora
  pt: Savacu
descripcion:
  es: >-
    Garza de humedales arbolados de distintas regiones de Europa, con poblaciones migratorias. La IUCN la
    clasifica globalmente como preocupación menor (LC). Al anochecer, espera sus salidas de alimentación desde
    observatorios sin iluminar aves ni aproximarte a colonias.
  en: >-
    Heron of wooded wetlands across several regions of Europe, with migratory populations. The IUCN classifies
    it globally as Least Concern (LC). At dusk, wait for it to fly out to feed from hides without shining
    lights on birds or approaching colonies.
  fr: >-
    Héron des zones humides boisées de différentes régions d'Europe, avec des populations migratrices. L'UICN
    le classe globalement en préoccupation mineure (LC). À la tombée du jour, attendez ses sorties de
    nourrissage depuis les observatoires sans éclairer les oiseaux ni vous approcher des colonies.
  de: >-
    Reiher gehölzreicher Feuchtgebiete verschiedener Regionen Europas mit Zugvogelpopulationen. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Warten Sie in der Dämmerung von Beobachtungshütten aus auf
    seine Nahrungsflüge, ohne Vögel anzuleuchten oder sich Kolonien zu nähern.
  it: >-
    Airone di zone umide alberate di diverse regioni d'Europa, con popolazioni migratrici. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Al tramonto, attendi le sue uscite per nutrirsi
    dagli appostamenti senza illuminare gli uccelli né avvicinarti alle colonie.
  pt: >-
    Garça de zonas húmidas arborizadas de várias regiões da Europa, com populações migratórias. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Ao anoitecer, aguarde as suas saídas de alimentação
    a partir de observatórios sem iluminar aves nem se aproximar de colónias.
