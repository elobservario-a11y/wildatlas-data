id: puffinus_griseus
nombre_cientifico: Puffinus griseus
nombre:
  es: Pardela sombría
  en: Sooty shearwater
  fr: Puffin fuligineux
  de: Dunkler Sturmtaucher
descripcion:
  es: >-
    Pardela de reproducción austral que recorre grandes distancias y aparece en el Atlántico europeo. La IUCN
    la clasifica globalmente como casi amenazada (NT). Durante el paso de finales de verano y otoño, obsérvala
    desde miradores costeros sin intentar atraerla ni seguirla en barco.
  en: >-
    Southern-breeding shearwater that covers vast distances and appears in the European Atlantic. The IUCN
    classifies it globally as Near Threatened (NT). During late-summer and autumn passage, watch from coastal
    viewpoints without trying to attract it or following it by boat.
  fr: >-
    Puffin à reproduction australe qui parcourt de grandes distances et apparaît dans l'Atlantique européen.
    L'UICN le classe globalement quasi menacé (NT). Lors du passage de fin d'été et d'automne, observez-le
    depuis les belvédères côtiers sans tenter de l'attirer ni le suivre en bateau.
  de: >-
    Auf der Südhalbkugel brütender Sturmtaucher, der weite Strecken zurücklegt und im europäischen Atlantik
    erscheint. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie ihn während des
    Spätsommer- und Herbstzugs von Küsten-Aussichtspunkten aus, ohne ihn anzulocken oder im Boot zu verfolgen.
