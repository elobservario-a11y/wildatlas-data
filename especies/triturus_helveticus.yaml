id: triturus_helveticus
nombre_cientifico: Triturus helveticus
nombre:
  es: Tritón palmeado
  en: Palmate newt
  fr: Triton palmé
  de: Fadenmolch
descripcion:
  es: >-
    Pequeño tritón de bosques, pastos y humedales de Europa occidental, que se reproduce en aguas quietas. La
    IUCN la clasifica globalmente como preocupación menor (LC). En primavera, obsérvalo desde la orilla sin
    coger ejemplares, mover plantas acuáticas ni entrar en las charcas.
  en: >-
    Small newt of forests, pastures and wetlands in western Europe, breeding in still waters. The IUCN
    classifies it globally as Least Concern (LC). In spring, watch from the bank without picking up
    individuals, moving aquatic plants or entering ponds.
  fr: >-
    Petit triton des forêts, pâturages et zones humides d'Europe occidentale, qui se reproduit en eaux calmes.
    L'UICN le classe globalement en préoccupation mineure (LC). Au printemps, observez-le depuis la rive sans
    saisir d'individus, déplacer de plantes aquatiques ni entrer dans les mares.
  de: >-
    Kleiner Molch von Wäldern, Weiden und Feuchtgebieten Westeuropas, der in Stillgewässern laicht. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn im Frühjahr vom Ufer aus, ohne Tiere
    aufzunehmen, Wasserpflanzen zu bewegen oder Tümpel zu betreten.
