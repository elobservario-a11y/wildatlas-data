id: posidonia_oceanica
nombre_cientifico: Posidonia oceanica
nombre:
  es: Posidonia
descripcion:
  es: >-
    Planta marina endémica del Mediterráneo que forma praderas sumergidas y ofrece refugio a numerosos
    organismos. La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvala con luz diurna desde
    la superficie o buceando, sin arrancar hojas, pisar las praderas ni fondear sobre ellas.
