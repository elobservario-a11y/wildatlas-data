id: neophron_percnopterus
nombre_cientifico: Neophron percnopterus
nombre:
  es: Alimoche común
  en: Egyptian vulture
  fr: Percnoptère
  de: Schmutzgeier
  it: Capovaccaio
  pt: Abutre-do-egito
descripcion:
  es: >-
    Pequeño buitre de campos abiertos y roquedos del sur europeo, con poblaciones migratorias. La IUCN la
    clasifica globalmente como en peligro (EN). Búscalo en época estival en vuelo diurno con prismáticos, sin
    aproximarte a nidos ni ofrecer alimento.
  en: >-
    Small vulture of open country and crags in southern Europe, with migratory populations. The IUCN
    classifies it globally as Endangered (EN). Look for it in summer soaring during the day with binoculars,
    without approaching nests or offering food.
  fr: >-
    Petit vautour des espaces ouverts et falaises du sud de l'Europe, avec des populations migratrices. L'UICN
    le classe globalement en danger (EN). Recherchez-le en été en vol diurne aux jumelles, sans vous approcher
    des nids ni donner de nourriture.
  de: >-
    Kleiner Geier offener Landschaften und Felswände Südeuropas mit Zugvogelpopulationen. Die IUCN stuft ihn
    weltweit als stark gefährdet (EN) ein. Suchen Sie ihn im Sommer tagsüber im Flug mit dem Fernglas, ohne
    sich Nestern zu nähern oder Futter anzubieten.
  it: >-
    Piccolo avvoltoio di campi aperti e pareti rocciose dell'Europa meridionale, con popolazioni migratrici.
    La IUCN lo classifica a livello globale come in pericolo (EN). Cercalo nella stagione estiva in volo
    diurno con il binocolo, senza avvicinarti ai nidi né offrire cibo.
  pt: >-
    Pequeno abutre de campos abertos e rochedos do sul europeu, com populações migratórias. A IUCN
    classifica-o globalmente como em perigo (EN). Procure-o no verão em voo diurno com binóculos, sem se
    aproximar de ninhos nem oferecer alimento.
