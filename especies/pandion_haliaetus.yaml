id: pandion_haliaetus
nombre_cientifico: Pandion haliaetus
nombre:
  es: Águila pescadora
  en: Osprey
  fr: Balbuzard pêcheur
  de: Fischadler
  it: Falco pescatore
  pt: Águia pescadora
descripcion:
  es: >-
    Rapaz pescadora de costas, lagos y ríos, presente en distintas regiones europeas como reproductora o
    migrante. La IUCN la clasifica globalmente como preocupación menor (LC). De día y durante los pasos
    migratorios, observa sus vuelos desde miradores sin acercarte a nidos ni posaderos.
  en: >-
    Fish-eating raptor of coasts, lakes and rivers, present in several European regions as a breeder or
    migrant. The IUCN classifies it globally as Least Concern (LC). By day and during migration, watch its
    flights from viewpoints without approaching nests or perches.
  fr: >-
    Rapace pêcheur des côtes, lacs et rivières, présent dans différentes régions européennes comme nicheur ou
    migrateur. L'UICN le classe globalement en préoccupation mineure (LC). De jour et lors des passages
    migratoires, observez ses vols depuis les belvédères sans vous approcher des nids ni des perchoirs.
  de: >-
    Fischfressender Greifvogel von Küsten, Seen und Flüssen, der in verschiedenen Regionen Europas als
    Brutvogel oder Durchzügler vorkommt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten
    Sie tagsüber und während der Zugzeit seine Flüge von Aussichtspunkten aus, ohne sich Nestern oder
    Sitzwarten zu nähern.
  it: >-
    Rapace pescatore di coste, laghi e fiumi, presente in diverse regioni europee come nidificante o
    migratore. La IUCN lo classifica a livello globale come a rischio minimo (LC). Di giorno e durante i passi
    migratori, osserva i suoi voli dai punti panoramici senza avvicinarti ai nidi né ai posatoi.
  pt: >-
    Ave de rapina piscívora de costas, lagos e rios, presente em várias regiões europeias como reprodutora ou
    migradora. A IUCN classifica-a globalmente como pouco preocupante (LC). De dia e durante as passagens
    migratórias, observe os seus voos a partir de miradouros sem se aproximar de ninhos nem poleiros.
