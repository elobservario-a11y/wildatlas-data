id: picoides_lilfordi
nombre_cientifico: Picoides lilfordi
nombre:
  es: Pico dorsiblanco de Lilford
descripcion:
  es: >-
    Forma meridional del pico dorsiblanco, asociada a bosques maduros con madera muerta desde los Pirineos
    hasta regiones balcánicas. La IUCN clasifica globalmente a Dendrocopos leucotos como preocupación menor
    (LC), sin categoría independiente verificada para lilfordi. Obsérvala de día desde senderos sin usar
    reclamos ni acercarte a cavidades de cría.
