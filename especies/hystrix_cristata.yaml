id: hystrix_cristata
nombre_cientifico: Hystrix cristata
nombre:
  es: Puercoespín crestado
  en: Crested porcupine
  fr: Porc-épic du Nord de l'Afrique
  de: Gewöhnliches Stachelschwein
descripcion:
  es: >-
    Gran roedor de púas presente en Italia y Sicilia, además de distintas regiones africanas, que utiliza
    refugios terrestres. La IUCN la clasifica globalmente como preocupación menor (LC). De hábitos nocturnos,
    obsérvalo solo en encuentros a distancia sin perseguirlo, acorralarlo ni introducir luces en refugios.
  en: >-
    Large quill-bearing rodent present in Italy and Sicily as well as parts of Africa, using underground dens.
    The IUCN classifies it globally as Least Concern (LC). Nocturnal in habit, watch it only in distant
    encounters without chasing, cornering it or shining lights into dens.
  fr: >-
    Grand rongeur à piquants présent en Italie et en Sicile, ainsi que dans plusieurs régions africaines, qui
    utilise des terriers. L'UICN le classe globalement en préoccupation mineure (LC). D'habitudes nocturnes,
    observez-le uniquement lors de rencontres à distance sans le poursuivre, l'acculer ni diriger de lumière
    dans les terriers.
  de: >-
    Großes Stacheltier, das in Italien und Sizilien sowie in Teilen Afrikas vorkommt und Erdbauten nutzt. Die
    IUCN stuft es weltweit als nicht gefährdet (LC) ein. Aufgrund seiner nachtaktiven Lebensweise beobachten
    Sie es nur aus der Ferne, ohne es zu verfolgen, in die Enge zu treiben oder Bauten auszuleuchten.
