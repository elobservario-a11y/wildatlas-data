id: bufo_calamita
nombre_cientifico: Bufo calamita
nombre:
  es: Sapo corredor
  en: Natterjack, natterjack toad
  fr: Crapaud calamite
  de: Kreuzkröte
descripcion:
  es: >-
    Sapo de terrenos arenosos, brezales y otros espacios abiertos europeos que utiliza charcas someras para
    reproducirse. La IUCN la clasifica globalmente como preocupación menor (LC). Durante su actividad nocturna
    en la estación templada, escucha desde caminos sin capturarlo ni entrar en charcas.
  en: >-
    Toad of sandy ground, heathland and other European open spaces that uses shallow ponds for breeding. The
    IUCN classifies it globally as Least Concern (LC). During its nocturnal activity in the mild season,
    listen from tracks without catching it or entering ponds.
  fr: >-
    Crapaud des terrains sableux, landes et autres espaces ouverts européens qui utilise des mares peu
    profondes pour se reproduire. L'UICN le classe globalement en préoccupation mineure (LC). Lors de son
    activité nocturne à la belle saison, écoutez depuis les chemins sans le capturer ni entrer dans les mares.
  de: >-
    Kröte sandiger Böden, Heiden und anderer offener Lebensräume Europas, die flache Tümpel zur Fortpflanzung
    nutzt. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Lauschen Sie während ihrer nächtlichen
    Aktivität in der warmen Jahreszeit von Wegen aus, ohne sie zu fangen oder Tümpel zu betreten.
