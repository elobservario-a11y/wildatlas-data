id: recurvirostra_avosetta
nombre_cientifico: Recurvirostra avosetta
nombre:
  es: Avoceta común
  en: Pied avocet
  fr: Avocette élégante
  de: Säbelschnäbler
  it: Avocetta
  pt: Alfaiate
descripcion:
  es: >-
    Limícola de pico curvado hacia arriba que ocupa lagunas someras, salinas y estuarios europeos. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvala mientras se alimente en aguas poco profundas
    desde observatorios, sin entrar en colonias ni provocar vuelos.
  en: >-
    Upcurved-billed wader occupying European shallow lagoons, saltpans and estuaries. The IUCN classifies it
    globally as Least Concern (LC). Watch it feeding in shallow water from hides, without entering colonies or
    flushing birds.
  fr: >-
    Limicole au bec recourbé vers le haut qui fréquente lagunes peu profondes, salines et estuaires européens.
    L'UICN la classe globalement en préoccupation mineure (LC). Observez-la s'alimenter en eaux peu profondes
    depuis les observatoires, sans entrer dans les colonies ni provoquer d'envols.
  de: >-
    Watvogel mit aufwärts gebogenem Schnabel, der flache Lagunen, Salinen und Flussmündungen Europas
    besiedelt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn bei der
    Nahrungssuche im Flachwasser von Beobachtungshütten aus, ohne Kolonien zu betreten oder Vögel
    aufzuscheuchen.
  it: >-
    Limicolo dal becco ricurvo verso l'alto che frequenta lagune basse, saline ed estuari europei. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Osservala mentre si nutre in acque basse dagli
    appostamenti, senza entrare nelle colonie né provocare involi.
  pt: >-
    Limícola de bico encurvado para cima que ocupa lagoas rasas, salinas e estuários europeus. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Observe-o quando se alimenta em águas rasas a partir
    de observatórios, sem entrar em colónias nem provocar levantamentos de voo.
