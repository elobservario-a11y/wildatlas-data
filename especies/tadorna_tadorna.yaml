id: tadorna_tadorna
nombre_cientifico: Tadorna tadorna
nombre:
  es: Tarro blanco
  en: Common shelduck
  fr: Tadorne de Belon
  de: Brandgans
  it: Volpoca
  pt: Pato-branco
descripcion:
  es: >-
    Anátida de costas, estuarios y humedales interiores europeos, frecuentemente ligada a aguas salobres. La
    IUCN la clasifica globalmente como preocupación menor (LC). Durante la invernada y los pasos migratorios,
    observa los bandos desde miradores sin acercarte a nidos ni levantar aves.
  en: >-
    Waterfowl of European coasts, estuaries and inland wetlands, often associated with brackish waters. The
    IUCN classifies it globally as Least Concern (LC). During wintering and migration, watch flocks from
    viewpoints without approaching nests or flushing birds.
  fr: >-
    Anatidé des côtes, estuaires et zones humides intérieures d'Europe, souvent lié aux eaux saumâtres. L'UICN
    le classe globalement en préoccupation mineure (LC). Pendant l'hivernage et les passages migratoires,
    observez les groupes depuis les belvédères sans vous approcher des nids ni faire lever les oiseaux.
  de: >-
    Entenvogel europäischer Küsten, Flussmündungen und Binnenfeuchtgebiete, häufig an Brackwasser gebunden.
    Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps im Winter und auf dem Zug
    von Aussichtspunkten aus, ohne sich Nestern zu nähern oder Vögel aufzuscheuchen.
  it: >-
    Anatide di coste, estuari e zone umide interne europee, spesso legato ad acque salmastre. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Durante lo svernamento e i passi migratori,
    osserva gli stormi dai punti panoramici senza avvicinarti ai nidi né far involare gli uccelli.
  pt: >-
    Anatídeo de costas, estuários e zonas húmidas interiores europeias, frequentemente ligado a águas
    salobras. A IUCN classifica-o globalmente como pouco preocupante (LC). Durante a invernada e as passagens
    migratórias, observe os bandos a partir de miradouros sem se aproximar de ninhos nem levantar aves.
