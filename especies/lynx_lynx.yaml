id: lynx_lynx
nombre_cientifico: Lynx lynx
nombre:
  es: Lince boreal
  en: Eurasian lynx
  fr: Lynx boréal
  de: Eurasischer Luchs
  pt: Lince-euroasiático
descripcion:
  es: >-
    Felino solitario de bosques templados y boreales del norte, centro y este de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Su actividad crepuscular aconseja esperar con prismáticos desde
    caminos, sin perseguirlo ni buscar refugios.
  en: >-
    Solitary felid of temperate and boreal forests of northern, central and eastern Europe. The IUCN
    classifies it globally as Least Concern (LC). Its crepuscular activity makes it best to wait with
    binoculars from tracks, without chasing it or searching for dens.
  fr: >-
    Félin solitaire des forêts tempérées et boréales du nord, du centre et de l'est de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). Son activité crépusculaire invite à attendre aux
    jumelles depuis les chemins, sans le poursuivre ni chercher de gîtes.
  de: >-
    Einzelgängerische Katze der gemäßigten und borealen Wälder Nord-, Mittel- und Osteuropas. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Seine dämmerungsaktive Lebensweise legt es nahe, mit dem
    Fernglas von Wegen aus zu warten, ohne ihn zu verfolgen oder Verstecke zu suchen.
  pt: >-
    Felino solitário de florestas temperadas e boreais do norte, centro e leste da Europa. A IUCN classifica-o
    globalmente como pouco preocupante (LC). A sua atividade crepuscular aconselha aguardar com binóculos a
    partir dos caminhos, sem o perseguir nem procurar abrigos.
