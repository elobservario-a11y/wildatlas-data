id: emys_orbicularis
nombre_cientifico: Emys orbicularis
nombre:
  es: Galápago europeo
descripcion:
  es: >-
    Tortuga de aguas continentales y orillas con vegetación del sur, centro y este de Europa. La IUCN la
    clasifica globalmente como casi amenazada (NT). Obsérvala cuando tome el sol desde miradores distantes,
    sin acercarte a troncos de descanso ni manipular animales.
