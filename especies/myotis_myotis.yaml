id: myotis_myotis
nombre_cientifico: Myotis myotis
nombre:
  es: Murciélago ratonero grande
  en: Greater mouse-eared bat
  fr: Grand murin
  de: Großes Mausohr
descripcion:
  es: >-
    Murciélago europeo ligado a paisajes con bosques y espacios abiertos, que utiliza edificios y cavidades
    como refugio. La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvalo al salir al
    anochecer desde el exterior, sin entrar en refugios ni utilizar luces o flash.
  en: >-
    European bat linked to landscapes with forests and open spaces, using buildings and caves as roosts. The
    IUCN classifies it globally as Least Concern (LC). Watch it emerging at dusk from outside, without
    entering roosts or using lights or flash.
  fr: >-
    Chauve-souris européenne liée aux paysages mêlant forêts et espaces ouverts, qui utilise bâtiments et
    cavités comme gîtes. L'UICN la classe globalement en préoccupation mineure (LC). Observez sa sortie au
    crépuscule depuis l'extérieur, sans entrer dans les gîtes ni utiliser de lampes ou de flash.
  de: >-
    Europäische Fledermaus von Landschaften mit Wäldern und offenen Flächen, die Gebäude und Höhlen als
    Quartiere nutzt. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihren Ausflug in
    der Dämmerung von außen, ohne Quartiere zu betreten oder Licht oder Blitz zu verwenden.
