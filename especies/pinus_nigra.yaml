id: pinus_nigra
nombre_cientifico: Pinus nigra
nombre:
  es: Pino laricio
  en: European black pine
  fr: Pin noir
  de: Schwarzkiefer
  it: Pino nero
  pt: Pinheiro-larício
descripcion:
  es: >-
    Conífera de montañas del sur europeo y regiones próximas, que forma pinares bajo distintas condiciones
    climáticas. La IUCN la clasifica globalmente como preocupación menor (LC). Puede observarse durante todo
    el año desde senderos, sin arrancar ramas, recoger piñas ni dañar raíces.
  en: >-
    Conifer of southern European mountains and adjacent regions, forming pine forests under varied climatic
    conditions. The IUCN classifies it globally as Least Concern (LC). It can be seen year-round from trails,
    without breaking branches, collecting cones or damaging roots.
  fr: >-
    Conifère des montagnes du sud européen et régions voisines, qui forme des pinèdes sous différentes
    conditions climatiques. L'UICN le classe globalement en préoccupation mineure (LC). Il peut être observé
    toute l'année depuis les sentiers, sans casser de branches, ramasser de cônes ni abîmer les racines.
  de: >-
    Nadelbaum südeuropäischer Gebirge und angrenzender Regionen, der unter verschiedenen Klimabedingungen
    Kiefernwälder bildet. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Sie lässt sich ganzjährig
    von Wegen aus beobachten, ohne Äste abzubrechen, Zapfen zu sammeln oder Wurzeln zu beschädigen.
  it: >-
    Conifera delle montagne dell'Europa meridionale e regioni vicine, che forma pinete in diverse condizioni
    climatiche. La IUCN la classifica a livello globale come a rischio minimo (LC). Può essere osservato tutto
    l'anno dai sentieri, senza spezzare rami, raccogliere pigne né danneggiare le radici.
  pt: >-
    Conífera de montanhas do sul europeu e regiões próximas, que forma pinhais sob diferentes condições
    climáticas. A IUCN classifica-o globalmente como pouco preocupante (LC). Pode ser observado durante todo o
    ano a partir dos trilhos, sem partir ramos, recolher pinhas nem danificar raízes.
