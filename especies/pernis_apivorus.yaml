id: pernis_apivorus
nombre_cientifico: Pernis apivorus
nombre:
  es: Abejero europeo
  en: European honey buzzard
  fr: Bondrée apivore
  de: Wespenbussard
  it: Falco pecchiaiolo
  pt: Tartaranhão-apívoro
descripcion:
  es: >-
    Rapaz migratoria de bosques europeos que pasa el invierno en África. La IUCN la clasifica globalmente como
    preocupación menor (LC). En los pasos migratorios, observa sus vuelos diurnos desde miradores sin
    acercarte a nidos ni reproducir reclamos.
  en: >-
    Migratory raptor of European forests that winters in Africa. The IUCN classifies it globally as Least
    Concern (LC). During migration, watch its daytime flights from viewpoints without approaching nests or
    playing back calls.
  fr: >-
    Rapace migrateur des forêts européennes qui hiverne en Afrique. L'UICN le classe globalement en
    préoccupation mineure (LC). Lors des passages migratoires, observez ses vols diurnes depuis les belvédères
    sans vous approcher des nids ni diffuser d'appeaux.
  de: >-
    Zuggreifvogel europäischer Wälder, der in Afrika überwintert. Die IUCN stuft ihn weltweit als nicht
    gefährdet (LC) ein. Beobachten Sie auf dem Vogelzug seine Tagesflüge von Aussichtspunkten aus, ohne sich
    Nestern zu nähern oder Rufe abzuspielen.
  it: >-
    Rapace migratore delle foreste europee che sverna in Africa. La IUCN lo classifica a livello globale come
    a rischio minimo (LC). Durante i passi migratori, osserva i suoi voli diurni dai punti panoramici senza
    avvicinarti ai nidi né riprodurre richiami.
  pt: >-
    Ave de rapina migratória de florestas europeias que passa o inverno em África. A IUCN classifica-a
    globalmente como pouco preocupante (LC). Nas passagens migratórias, observe os seus voos diurnos a partir
    de miradouros sem se aproximar de ninhos nem reproduzir chamarizes.
