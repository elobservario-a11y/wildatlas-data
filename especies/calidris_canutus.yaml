id: calidris_canutus
nombre_cientifico: Calidris canutus
nombre:
  es: Correlimos gordo
  en: Red knot
  fr: Bécasseau maubèche
  de: Knutt
  it: Piovanello maggiore
  pt: Seixoeira
descripcion:
  es: >-
    Limícola migratoria que utiliza costas, estuarios y marismas de Europa durante sus desplazamientos e
    invernada. La IUCN la clasifica globalmente como casi amenazada (NT). Observa los bandos alimentándose en
    bajamar desde puntos distantes, sin cortarles el paso ni hacerlos levantar.
  en: >-
    Migratory wader that uses European coasts, estuaries and marshes during passage and wintering. The IUCN
    classifies it globally as Near Threatened (NT). Watch flocks feeding at low tide from distant vantage
    points, without cutting them off or flushing them.
  fr: >-
    Limicole migrateur qui fréquente côtes, estuaires et marais d'Europe lors de ses déplacements et en
    hivernage. L'UICN le classe globalement quasi menacé (NT). Observez les groupes s'alimentant à marée basse
    depuis des points éloignés, sans leur couper la route ni les faire décoller.
  de: >-
    Ziehender Watvogel, der Küsten, Flussmündungen und Marschen Europas auf dem Zug und im Winter nutzt. Die
    IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie Trupps bei Ebbe aus der Ferne,
    ohne ihnen den Weg abzuschneiden oder sie aufzuscheuchen.
  it: >-
    Limicolo migratore che utilizza coste, estuari e paludi d'Europa durante gli spostamenti e lo svernamento.
    La IUCN lo classifica a livello globale come prossimo alla minaccia (NT). Osserva gli stormi mentre si
    nutrono con la bassa marea da punti distanti, senza tagliare loro la strada né farli involare.
  pt: >-
    Limícola migratória que utiliza costas, estuários e sapais da Europa durante as suas deslocações e
    invernada. A IUCN classifica-a globalmente como quase ameaçada (NT). Observe os bandos a alimentar-se na
    maré baixa a partir de pontos distantes, sem lhes cortar a passagem nem os fazer levantar voo.
