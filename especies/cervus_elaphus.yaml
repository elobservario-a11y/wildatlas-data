id: cervus_elaphus
nombre_cientifico: Cervus elaphus
nombre:
  es: Ciervo común
  en: Red deer
  fr: Cerf élaphe
  de: Rothirsch
  pt: Veado-vermelho
descripcion:
  es: >-
    Gran cérvido extendido por bosques, claros y brezales de buena parte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). La berrea otoñal permite escucharlo y observarlo a distancia,
    sin imitar reclamos ni entrar entre los grupos.
  en: >-
    Large deer widespread across forests, clearings and heathlands in much of Europe. The IUCN classifies it
    globally as Least Concern (LC). The autumn rut lets you hear and watch it from a distance, without
    imitating calls or stepping between groups.
  fr: >-
    Grand cervidé répandu dans les forêts, clairières et landes d'une grande partie de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). Le brame automnal permet de l'écouter et de l'observer à
    distance, sans imiter les cris ni pénétrer entre les hardes.
  de: >-
    Großer Hirsch, der in Wäldern, Lichtungen und Heiden weiter Teile Europas verbreitet ist. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Während der Herbstbrunft lässt er sich aus der Ferne hören und
    beobachten, ohne Rufe nachzuahmen oder zwischen Rudel zu geraten.
  pt: >-
    Grande cervídeo distribuído por florestas, clareiras e urzais de grande parte da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). A brama outonal permite escutá-lo e observá-lo à
    distância, sem imitar chamarizes nem entrar entre os grupos.
