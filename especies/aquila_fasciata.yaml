id: aquila_fasciata
nombre_cientifico: Aquila fasciata
nombre:
  es: Águila perdicera
  en: Bonelli's eagle
  fr: Aigle de Bonelli
  de: Habichtsadler
  it: Aquila di Bonelli
  pt: Águia-de-bonelli
descripcion:
  es: >-
    Rapaz de sierras rocosas y paisajes mediterráneos abiertos, presente de forma dispersa en el sur de
    Europa. La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvala de día planeando desde
    miradores, sin acercarte a paredes de cría ni utilizar cebos.
  en: >-
    Raptor of rocky ranges and open Mediterranean landscapes, scattered across southern Europe. The IUCN
    classifies it globally as Least Concern (LC). Watch it soaring during the day from viewpoints, without
    approaching nesting cliffs or using bait.
  fr: >-
    Rapace des massifs rocheux et paysages méditerranéens ouverts, présent de façon dispersée dans le sud de
    l'Europe. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le en vol plané de jour
    depuis les belvédères, sans vous approcher des parois de nidification ni utiliser d'appâts.
  de: >-
    Greifvogel felsiger Gebirge und offener mediterraner Landschaften mit verstreutem Vorkommen in Südeuropa.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn tagsüber kreisend von
    Aussichtspunkten aus, ohne sich Brutwänden zu nähern oder Köder auszulegen.
  it: >-
    Rapace di rilievi rocciosi e paesaggi mediterranei aperti, presente in modo sparso nell'Europa
    meridionale. La IUCN la classifica a livello globale come a rischio minimo (LC). Osservala di giorno in
    volo planato dai punti panoramici, senza avvicinarti alle pareti di nidificazione né usare esche.
  pt: >-
    Ave de rapina de serras rochosas e paisagens mediterrânicas abertas, presente de forma dispersa no sul da
    Europa. A IUCN classifica-a globalmente como pouco preocupante (LC). Observe-a de dia a planar a partir de
    miradouros, sem se aproximar de paredes de nidificação nem utilizar iscos.
