id: ciconia_ciconia
nombre_cientifico: Ciconia ciconia
nombre:
  es: Cigüeña blanca
  en: White stork
  fr: Cigogne blanche
  de: Weißstorch
  it: Cicogna bianca
  pt: Cegonha-branca
descripcion:
  es: >-
    Gran zancuda de praderas, cultivos y humedales someros de amplias regiones de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Obsérvala de día buscando alimento desde caminos, sin
    aproximarte a nidos ni ofrecer comida.
  en: >-
    Large wading bird of meadows, farmland and shallow wetlands across wide parts of Europe. The IUCN
    classifies it globally as Least Concern (LC). Watch it foraging during the day from tracks, without
    approaching nests or offering food.
  fr: >-
    Grand échassier des prairies, cultures et zones humides peu profondes de vastes régions d'Europe. L'UICN
    le classe globalement en préoccupation mineure (LC). Observez-le chercher sa nourriture de jour depuis les
    chemins, sans vous approcher des nids ni donner de nourriture.
  de: >-
    Großer Schreitvogel von Wiesen, Feldern und flachen Feuchtgebieten weiter Teile Europas. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn tagsüber bei der Nahrungssuche von Wegen
    aus, ohne sich Nestern zu nähern oder Futter anzubieten.
  it: >-
    Grande trampoliere di praterie, coltivi e zone umide basse di ampie regioni d'Europa. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Osservala di giorno mentre cerca cibo dai
    sentieri, senza avvicinarti ai nidi né offrire alimento.
  pt: >-
    Grande ave pernalta de prados, culturas e zonas húmidas rasas de amplas regiões da Europa. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Observe-a de dia à procura de alimento a partir dos
    caminhos, sem se aproximar de ninhos nem oferecer comida.
