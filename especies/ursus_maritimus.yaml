id: ursus_maritimus
nombre_cientifico: Ursus maritimus
nombre:
  es: Oso polar
  en: Polar bear
  fr: Ours blanc
  de: Eisbär
  pt: Urso-polar
descripcion:
  es: >-
    Gran carnívoro dependiente del hielo marino ártico, presente en Svalbard y el norte de Rusia. La IUCN la
    clasifica globalmente como vulnerable (VU). Cuando sea visible en costa o hielo, obsérvalo con guías
    autorizados desde lejos, sin perseguirlo ni intentar atraerlo.
  en: >-
    Large carnivore dependent on Arctic sea ice, present in Svalbard and northern Russia. The IUCN classifies
    it globally as Vulnerable (VU). When visible on coast or ice, watch with authorised guides from afar,
    without chasing it or trying to attract it.
  fr: >-
    Grand carnivore dépendant de la banquise arctique, présent au Svalbard et dans le nord de la Russie.
    L'UICN le classe globalement comme vulnérable (VU). Lorsqu'il est visible sur la côte ou la glace,
    observez-le avec des guides autorisés depuis une grande distance, sans le poursuivre ni tenter de
    l'attirer.
  de: >-
    Großer Beutegreifer, der vom arktischen Meereis abhängt und auf Spitzbergen sowie in Nordrussland
    vorkommt. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Wenn er an der Küste oder auf dem Eis
    sichtbar ist, beobachten Sie ihn mit zugelassenen Führern aus der Ferne, ohne ihn zu verfolgen oder
    anzulocken.
  pt: >-
    Grande carnívoro dependente do gelo marinho ártico, presente em Svalbard e no norte da Rússia. A IUCN
    classifica-o globalmente como vulnerável (VU). Quando for visível em costa ou gelo, observe-o com guias
    autorizados à distância, sem o perseguir nem tentar atraí-lo.
