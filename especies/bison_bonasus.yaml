id: bison_bonasus
nombre_cientifico: Bison bonasus
nombre:
  es: Bisonte europeo
  en: European bison
  fr: Bison d'Europe
  de: Wisent
  it: Bisonte europeo
  pt: Bisonte-europeu
descripcion:
  es: >-
    Gran herbívoro recuperado mediante reintroducciones, presente en bosques y claros de Europa central y
    oriental. La IUCN la clasifica globalmente como casi amenazada (NT). Observa las manadas cuando salgan a
    pastar, desde caminos y sin rodearlas ni aproximarte a las crías.
  en: >-
    Large herbivore recovered through reintroductions, present in forests and clearings of central and eastern
    Europe. The IUCN classifies it globally as Near Threatened (NT). Watch herds when they come out to graze,
    from tracks and without surrounding them or approaching calves.
  fr: >-
    Grand herbivore rétabli par des réintroductions, présent dans les forêts et clairières d'Europe centrale
    et orientale. L'UICN le classe globalement quasi menacé (NT). Observez les hardes lorsqu'elles sortent
    pâturer, depuis les chemins et sans les encercler ni vous approcher des jeunes.
  de: >-
    Großer Pflanzenfresser, der durch Wiederansiedlungen in Wäldern und Lichtungen Mittel- und Osteuropas
    zurückgekehrt ist. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie Herden
    beim Grasen von Wegen aus, ohne sie einzukreisen oder sich Kälbern zu nähern.
  it: >-
    Grande erbivoro recuperato tramite reintroduzioni, presente in foreste e radure dell'Europa centrale e
    orientale. La IUCN lo classifica a livello globale come prossimo alla minaccia (NT). Osserva le mandrie
    quando escono a pascolare, dai sentieri e senza circondarle né avvicinarti ai piccoli.
  pt: >-
    Grande herbívoro recuperado através de reintroduções, presente em florestas e clareiras da Europa central
    e oriental. A IUCN classifica-o globalmente como quase ameaçado (NT). Observe as manadas quando saem para
    pastar, a partir dos caminhos e sem as rodear nem se aproximar das crias.
