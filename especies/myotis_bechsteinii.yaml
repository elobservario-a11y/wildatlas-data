id: myotis_bechsteinii
nombre_cientifico: Myotis bechsteinii
nombre:
  es: Murciélago ratonero forestal
  en: Bechstein's bat
  fr: Murin de Bechstein
  de: Bechsteinfledermaus
  it: Myotis bechsteini
descripcion:
  es: >-
    Murciélago europeo ligado a bosques extensos y cavidades de árboles, que también utiliza refugios
    subterráneos. La IUCN la clasifica globalmente como casi amenazada (NT). Al anochecer, observa vuelos
    desde senderos sin abrir cajas, iluminar cavidades ni entrar en refugios de hibernación.
  en: >-
    European bat linked to extensive forests and tree cavities, also using underground roosts. The IUCN
    classifies it globally as Near Threatened (NT). At dusk, watch flights from trails without opening boxes,
    shining lights into cavities or entering hibernation roosts.
  fr: >-
    Chauve-souris européenne liée aux vastes forêts et cavités d'arbres, qui utilise aussi des gîtes
    souterrains. L'UICN la classe globalement quasi menacée (NT). À la tombée du jour, observez les vols
    depuis les sentiers sans ouvrir de nichoirs, éclairer les cavités ni entrer dans les gîtes d'hibernation.
  de: >-
    Europäische Fledermaus, die an ausgedehnte Wälder und Baumhöhlen gebunden ist und auch unterirdische
    Quartiere nutzt. Die IUCN stuft sie weltweit als potenziell gefährdet (NT) ein. Beobachten Sie Flüge in
    der Dämmerung von Wegen aus, ohne Kästen zu öffnen, Höhlen auszuleuchten oder Winterquartiere zu betreten.
  it: >-
    Pipistrello europeo legato a foreste estese e cavità degli alberi, che utilizza anche rifugi sotterranei.
    La IUCN lo classifica a livello globale come prossimo alla minaccia (NT). Al tramonto, osserva i voli dai
    sentieri senza aprire cassette, illuminare cavità né entrare nei rifugi di ibernazione.
