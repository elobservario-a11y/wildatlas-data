id: columba_junoniae
nombre_cientifico: Columba junoniae
nombre:
  es: Paloma rabiche
  en: Laurel pigeon
  fr: Pigeon des lauriers
  de: Lorbeertaube
  it: Colomba dei lauri
  pt: Pombo-rabil
descripcion:
  es: >-
    Paloma endémica de Canarias que ocupa bosques, barrancos y ambientes ligados a la laurisilva. La IUCN la
    clasifica globalmente como casi amenazada (NT). Obsérvala durante el día desde caminos y miradores sin
    abandonar las rutas ni buscar nidos entre rocas.
  en: >-
    Pigeon endemic to the Canary Islands inhabiting forests, ravines and laurel-forest habitats. The IUCN
    classifies it globally as Near Threatened (NT). Watch it during the day from tracks and viewpoints without
    leaving trails or searching for nests among rocks.
  fr: >-
    Pigeon endémique des Canaries occupant forêts, ravins et milieux liés à la laurisylve. L'UICN le classe
    globalement quasi menacé (NT). Observez-le de jour depuis les chemins et belvédères sans quitter les
    itinéraires ni chercher de nids dans les rochers.
  de: >-
    Auf den Kanaren endemische Taube, die Wälder, Schluchten und Lebensräume des Lorbeerwaldes besiedelt. Die
    IUCN stuft sie weltweit als potenziell gefährdet (NT) ein. Beobachten Sie sie tagsüber von Wegen und
    Aussichtspunkten aus, ohne die Pfade zu verlassen oder in Felsen nach Nestern zu suchen.
  it: >-
    Colombo endemico delle Canarie che occupa boschi, gole e ambienti legati alla laurisilva. La IUCN la
    classifica a livello globale come prossima alla minaccia (NT). Osservala di giorno da sentieri e punti
    panoramici senza abbandonare i percorsi né cercare nidi tra le rocce.
  pt: >-
    Pombo endémico das Canárias que ocupa florestas, barrancos e ambientes ligados à laurissilva. A IUCN
    classifica-o globalmente como quase ameaçado (NT). Observe-o durante o dia a partir de caminhos e
    miradouros sem sair dos percursos nem procurar ninhos entre as rochas.
