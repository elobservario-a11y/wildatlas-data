id: morus_bassanus
nombre_cientifico: Morus bassanus
nombre:
  es: Alcatraz atlántico
  en: Northern gannet
  fr: Fou de Bassan
  de: Basstölpel
  it: Sula
  pt: Ganso-patola
descripcion:
  es: >-
    Ave marina del Atlántico norte que cría en islas y acantilados de Europa occidental y pesca mediante
    picados. La IUCN la clasifica globalmente como preocupación menor (LC). Observa vuelos y zambullidas
    durante el día desde la costa, sin aproximarte a colonias ni desembarcar en ellas.
  en: >-
    North Atlantic seabird breeding on islands and cliffs of western Europe and fishing by plunge-diving. The
    IUCN classifies it globally as Least Concern (LC). Watch flights and dives during the day from the coast,
    without approaching or landing on colonies.
  fr: >-
    Oiseau marin de l'Atlantique Nord qui niche sur les îles et falaises d'Europe occidentale et pêche en
    plongeant. L'UICN le classe globalement en préoccupation mineure (LC). Observez vols et plongeons de jour
    depuis la côte, sans vous approcher des colonies ni y débarquer.
  de: >-
    Seevogel des Nordatlantiks, der auf Inseln und an Klippen Westeuropas brütet und im Sturzflug fischt. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Flüge und Sturzflüge tagsüber von der
    Küste aus, ohne sich Kolonien zu nähern oder dort anzulanden.
  it: >-
    Uccello marino dell'Atlantico settentrionale che nidifica su isole e scogliere dell'Europa occidentale e
    pesca tuffandosi. La IUCN lo classifica a livello globale come a rischio minimo (LC). Osserva voli e tuffi
    di giorno dalla costa, senza avvicinarti alle colonie né sbarcarvi.
  pt: >-
    Ave marinha do Atlântico Norte que nidifica em ilhas e falésias da Europa ocidental e pesca em mergulho
    picado. A IUCN classifica-a globalmente como pouco preocupante (LC). Observe voos e mergulhos durante o
    dia a partir da costa, sem se aproximar de colónias nem desembarcar nelas.
