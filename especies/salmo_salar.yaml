id: salmo_salar
nombre_cientifico: Salmo salar
nombre:
  es: Salmón atlántico
  en: Atlantic salmon
  fr: Saumon atlantique
  de: Atlantischer Lachs
  pt: Salmão atlântico
descripcion:
  es: >-
    Pez del Atlántico norte y de ríos europeos que comunican con él, con poblaciones migratorias y lacustres.
    La IUCN la clasifica globalmente como casi amenazada (NT). Durante los remontes, observa desde puentes y
    orillas autorizadas sin entrar en frezaderos ni obstaculizar el paso.
  en: >-
    Fish of the North Atlantic and European rivers connected to it, with migratory and lake-dwelling
    populations. The IUCN classifies it globally as Near Threatened (NT). During upstream runs, watch from
    bridges and authorised banks without entering spawning beds or obstructing passage.
  fr: >-
    Poisson de l'Atlantique Nord et des rivières européennes qui y communiquent, avec des populations
    migratrices et lacustres. L'UICN le classe globalement quasi menacé (NT). Lors des remontées, observez
    depuis les ponts et rives autorisées sans entrer dans les frayères ni gêner le passage.
  de: >-
    Fisch des Nordatlantiks und der damit verbundenen europäischen Flüsse mit wandernden und Seen bewohnenden
    Beständen. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie während des
    Aufstiegs von Brücken und zugelassenen Ufern aus, ohne Laichplätze zu betreten oder den Zug zu behindern.
  pt: >-
    Peixe do Atlântico Norte e de rios europeus ligados a ele, com populações migratórias e lacustres. A IUCN
    classifica-o globalmente como quase ameaçado (NT). Durante as subidas, observe a partir de pontes e
    margens autorizadas sem entrar em zonas de desova nem dificultar a passagem.
