id: proteus_anguinus
nombre_cientifico: Proteus anguinus
nombre:
  es: Proteo
  en: Olm
  fr: Protée anguillard
  de: Grottenolm
  it: Proteo
descripcion:
  es: >-
    Anfibio acuático de aguas subterráneas kársticas de la región dinárica, tratado tradicionalmente como una
    única especie. La evaluación IUCN del taxón tradicional lo clasifica como vulnerable (VU). Obsérvalo solo
    en instalaciones o recorridos autorizados cuando sea visible, sin manipularlo ni iluminar directamente sus
    refugios.
  en: >-
    Aquatic amphibian of karst subterranean waters in the Dinaric region, traditionally treated as a single
    species. The IUCN assessment of the traditional taxon classifies it as Vulnerable (VU). Watch it only in
    authorised facilities or tours when visible, without handling it or shining lights directly on shelters.
  fr: >-
    Amphibien aquatique des eaux souterraines karstiques de la région dinarique, traditionnellement considéré
    comme une seule espèce. L'évaluation UICN du taxon traditionnel le classe comme vulnérable (VU).
    Observez-le uniquement dans des installations ou visites autorisées lorsqu'il est visible, sans le
    manipuler ni éclairer directement ses refuges.
  de: >-
    Aquatischer Lurch unterirdischer Karstgewässer der dinarischen Region, traditionell als eine einzige Art
    geführt. Die IUCN-Bewertung des traditionellen Taxons stuft ihn als gefährdet (VU) ein. Beobachten Sie ihn
    nur in zugelassenen Einrichtungen oder Führungen, ohne ihn anzufassen oder Verstecke direkt anzuleuchten.
  it: >-
    Anfibio acquatico delle acque sotterranee carsiche della regione dinarica, trattato tradizionalmente come
    un'unica specie. La valutazione IUCN del taxon tradizionale lo classifica come vulnerabile (VU). Osservalo
    solo in strutture o percorsi autorizzati quando è visibile, senza manipolarlo né illuminare direttamente i
    rifugi.
