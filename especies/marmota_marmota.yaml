id: marmota_marmota
nombre_cientifico: Marmota marmota
nombre:
  es: Marmota alpina
  en: Alpine marmot
  fr: Marmotte des Alpes
  de: Alpenmurmeltier
descripcion:
  es: >-
    Roedor social de praderas alpinas de Europa central y meridional, introducido también en otras
    cordilleras. La IUCN la clasifica globalmente como preocupación menor (LC). Tras la hibernación y durante
    la estación cálida, obsérvalo desde senderos sin alimentarlo ni acercarte a madrigueras.
  en: >-
    Social rodent of alpine meadows of central and southern Europe, also introduced into other mountain
    ranges. The IUCN classifies it globally as Least Concern (LC). After hibernation and during the warm
    season, watch it from trails without feeding it or approaching burrows.
  fr: >-
    Rongeur social des pelouses alpines d'Europe centrale et méridionale, également introduit dans d'autres
    massifs. L'UICN la classe globalement en préoccupation mineure (LC). Après l'hibernation et à la belle
    saison, observez-la depuis les sentiers sans la nourrir ni vous approcher des terriers.
  de: >-
    Geselliges Nagetier alpiner Matten Mittel- und Südeuropas, das auch in andere Gebirge eingeführt wurde.
    Die IUCN stuft es weltweit als nicht gefährdet (LC) ein. Beobachten Sie es nach dem Winterschlaf und in
    der warmen Jahreszeit von Wegen aus, ohne zu füttern oder sich Bauen zu nähern.
