id: burhinus_oedicnemus
nombre_cientifico: Burhinus oedicnemus
nombre:
  es: Alcaraván común
  en: Eurasian stone-curlew
  fr: Œdicnème criard
  de: Triel
  it: Occhione
  pt: Alcaravão
descripcion:
  es: >-
    Ave terrestre de terrenos secos y abiertos con suelo desnudo, presente en distintas regiones europeas. La
    IUCN la clasifica globalmente como preocupación menor (LC). Al atardecer, observa desde caminos con
    prismáticos sin usar reclamos, focos ni entrar en áreas de cría.
  en: >-
    Ground-dwelling bird of dry, open habitats with bare earth, present in several European regions. The IUCN
    classifies it globally as Least Concern (LC). At dusk, watch from tracks with binoculars without using
    playback, spotlights or entering breeding areas.
  fr: >-
    Oiseau terrestre des terrains secs et ouverts à sol nu, présent dans différentes régions européennes.
    L'UICN le classe globalement en préoccupation mineure (LC). À la tombée du jour, observez depuis les
    chemins aux jumelles sans utiliser d'appeaux, de phares ni entrer dans les zones de nidification.
  de: >-
    Bodenlebender Vogel trockener, offener Flächen mit offenem Boden, der in verschiedenen europäischen
    Regionen vorkommt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie in der
    Dämmerung mit dem Fernglas von Wegen aus, ohne Klangattrappen oder Scheinwerfer zu nutzen und ohne
    Brutflächen zu betreten.
  it: >-
    Uccello terricolo di terreni aridi e aperti con suolo nudo, presente in diverse regioni europee. La IUCN
    lo classifica a livello globale come a rischio minimo (LC). Al tramonto, osserva dai sentieri con il
    binocolo senza usare richiami, fari né entrare nelle aree riproduttive.
  pt: >-
    Ave terrestre de terrenos secos e abertos com solo nu, presente em várias regiões europeias. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Ao entardecer, observe a partir dos caminhos com
    binóculos sem usar chamarizes, focos nem entrar em áreas de criação.
