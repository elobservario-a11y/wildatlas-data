id: hippocampus_guttulatus
nombre_cientifico: Hippocampus guttulatus
nombre:
  es: Caballito de mar narigudo
  en: Long-snouted seahorse
  fr: Hippocampe moucheté
  de: Langschnäuzige Seepferdchen
descripcion:
  es: >-
    Pez marino de aguas costeras del Atlántico nororiental y Mediterráneo, ligado a vegetación y otros
    soportes sumergidos. La IUCN la clasifica globalmente como datos insuficientes (DD). Cuando sea visible
    durante una inmersión autorizada, obsérvalo sin tocarlo, moverlo ni dañar la vegetación.
  en: >-
    Marine fish of coastal waters of the north-east Atlantic and Mediterranean, linked to seagrass and other
    submerged supports. The IUCN classifies it globally as Data Deficient (DD). When visible on an authorised
    dive, observe it without touching, moving it or damaging vegetation.
  fr: >-
    Poisson marin des eaux côtières de l'Atlantique Nord-Est et de Méditerranée, lié à la végétation et aux
    supports immergés. L'UICN le classe globalement données insuffisantes (DD). Lorsqu'il est visible en
    plongée autorisée, observez-le sans le toucher, le déplacer ni endommager la végétation.
  de: >-
    Meeresfisch der Küstengewässer des Nordostatlantiks und Mittelmeers, gebunden an Seegras und andere
    untergetauchte Strukturen. Die IUCN stuft ihn weltweit als unzureichende Datenlage (DD) ein. Wenn er bei
    einem zugelassenen Tauchgang sichtbar ist, beobachten Sie ihn, ohne ihn zu berühren, zu versetzen oder
    Pflanzen zu beschädigen.
