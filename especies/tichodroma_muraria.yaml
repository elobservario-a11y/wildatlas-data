id: tichodroma_muraria
nombre_cientifico: Tichodroma muraria
nombre:
  es: Treparriscos
  en: Wallcreeper
  fr: Tichodrome échelette
  de: Mauerläufer
  it: Picchio muraiolo
  pt: Trepadeira-dos-muros
descripcion:
  es: >-
    Ave de paredes rocosas de montañas europeas, que puede descender a cotas bajas en invierno. La IUCN la
    clasifica globalmente como preocupación menor (LC). En invierno, revisa cortados desde miradores con
    prismáticos sin acercarte al ave ni utilizar reclamos.
  en: >-
    Bird of rocky faces in European mountains, which may descend to lower elevations in winter. The IUCN
    classifies it globally as Least Concern (LC). In winter, scan cliffs from viewpoints with binoculars
    without approaching the bird or using playback.
  fr: >-
    Oiseau des parois rocheuses des montagnes européennes, qui peut descendre à plus basse altitude en hiver.
    L'UICN le classe globalement en préoccupation mineure (LC). En hiver, scrutez les falaises depuis les
    belvédères aux jumelles sans vous approcher de l'oiseau ni utiliser d'appeaux.
  de: >-
    Vogel von Felswänden europäischer Gebirge, der im Winter auch in tiefere Lagen absteigen kann. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Suchen Sie im Winter Felswände von Aussichtspunkten aus
    mit dem Fernglas ab, ohne sich dem Vogel zu nähern oder Klangattrappen zu nutzen.
  it: >-
    Uccello di pareti rocciose delle montagne europee, che può scendere a quote inferiori in inverno. La IUCN
    lo classifica a livello globale come a rischio minimo (LC). In inverno, controlla le pareti dai punti
    panoramici con il binocolo senza avvicinarti all'uccello né usare richiami.
  pt: >-
    Ave de paredes rochosas de montanhas europeias, que pode descer a cotas mais baixas no inverno. A IUCN
    classifica-a globalmente como pouco preocupante (LC). No inverno, observe escarpas a partir de miradouros
    com binóculos sem se aproximar da ave nem utilizar chamarizes.
