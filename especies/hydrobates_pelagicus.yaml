id: hydrobates_pelagicus
nombre_cientifico: Hydrobates pelagicus
nombre:
  es: Paíño europeo
  en: European storm petrel
  fr: Océanite tempête
  de: Sturmschwalbe
  it: Uccello delle tempeste europeo
  pt: Painho-de-cauda-quadrada
descripcion:
  es: >-
    Pequeña ave pelágica que cría en islas europeas y visita sus refugios terrestres principalmente de noche.
    La IUCN la clasifica globalmente como preocupación menor (LC). Durante su estancia reproductora, prioriza
    observarla sobre el mar en salidas responsables sin desembarcar en colonias ni usar luces.
  en: >-
    Small pelagic bird that breeds on European islands and visits its land burrows mainly at night. The IUCN
    classifies it globally as Least Concern (LC). During the breeding season, favour watching it at sea on
    responsible boat trips without landing on colonies or using lights.
  fr: >-
    Petit oiseau pélagique qui niche sur les îles européennes et rejoint ses abris terrestres surtout de nuit.
    L'UICN le classe globalement en préoccupation mineure (LC). En période de reproduction, privilégiez
    l'observation en mer lors de sorties responsables sans débarquer dans les colonies ni utiliser de
    lumières.
  de: >-
    Kleiner Hochseevogel, der auf europäischen Inseln brütet und seine Landverstecke vorwiegend nachts
    aufsucht. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Bevorzugen Sie zur Brutzeit die
    Beobachtung auf See mit verantwortungsvollen Anbietern, ohne Kolonien zu betreten oder Licht einzusetzen.
  it: >-
    Piccolo uccello pelagico che nidifica su isole europee e raggiunge i rifugi terrestri soprattutto di
    notte. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante la stagione
    riproduttiva, prediligi l'osservazione in mare con uscite responsabili senza sbarcare nelle colonie né
    usare luci.
  pt: >-
    Pequena ave pelágica que nidifica em ilhas europeias e visita os seus abrigos terrestres sobretudo de
    noite. A IUCN classifica-a globalmente como pouco preocupante (LC). Durante a época reprodutora, dê
    preferência à observação no mar em saídas responsáveis sem desembarcar em colónias nem usar luzes.
