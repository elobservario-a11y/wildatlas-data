id: calluna_vulgaris
nombre_cientifico: Calluna vulgaris
nombre:
  es: Brecina
  en: Heather
  fr: Callune
  de: Besenheide
  pt: Calluna
descripcion:
  es: >-
    Pequeño arbusto de brezales y terrenos ácidos, nativo de gran parte de Europa y de islas atlánticas. La
    fuente consultada no aporta una categoría global IUCN para este taxón. Su floración estival permite
    reconocerlo desde senderos sin recoger ramas, pisar matas ni abrir nuevos pasos.
  en: >-
    Small shrub of heathlands and acidic soils, native to much of Europe and Atlantic islands. The consulted
    source provides no global IUCN category for this taxon. Its summer flowering makes it easy to recognise
    from trails without picking branches, trampling bushes or making new paths.
  fr: >-
    Petit arbrisseau des landes et sols acides, indigène d'une grande partie de l'Europe et des îles
    atlantiques. La source consultée ne fournit pas de catégorie mondiale UICN pour ce taxon. Sa floraison
    estivale permet de la reconnaître depuis les sentiers sans cueillir de rameaux, piétiner les touffes ni
    ouvrir de nouveaux passages.
  de: >-
    Kleiner Strauch der Heiden und sauren Böden, heimisch in weiten Teilen Europas und auf atlantischen
    Inseln. Die herangezogene Quelle nennt keine globale IUCN-Kategorie für dieses Taxon. Seine Sommerblüte
    macht ihn von Wegen aus leicht erkennbar, ohne Zweige abzubrechen, Sträucher zu zertreten oder neue Pfade
    anzulegen.
  pt: >-
    Pequeno arbusto de urzais e terrenos ácidos, nativo de grande parte da Europa e de ilhas atlânticas. A
    fonte consultada não apresenta uma categoria global IUCN para este táxon. A sua floração estival permite
    reconhecê-lo a partir dos trilhos sem recolher ramos, pisar matos nem abrir novos caminhos.
