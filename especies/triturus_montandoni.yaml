id: triturus_montandoni
nombre_cientifico: Triturus montandoni
nombre:
  es: Tritón de los Cárpatos
descripcion:
  es: >-
    Anfibio de bosques y humedales de los Cárpatos y Sudetes orientales, que utiliza pequeñas masas de agua
    para criar. La IUCN la clasifica globalmente como preocupación menor (LC). En primavera, observa las
    charcas desde el borde sin capturar animales, mover refugios ni alterar la vegetación.
