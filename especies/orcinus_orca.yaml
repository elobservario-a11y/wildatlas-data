id: orcinus_orca
nombre_cientifico: Orcinus orca
nombre:
  es: Orca
  en: Killer whale
  fr: Orque
  de: Schwertwal
  pt: Orca
descripcion:
  es: >-
    Cetáceo social presente en aguas europeas, incluidas las costas de Noruega e Islandia y el estrecho de
    Gibraltar. La IUCN la clasifica globalmente como datos insuficientes (DD). Cuando aparezca en superficie,
    obsérvalo desde tierra o con operadores responsables, sin perseguirlo ni intentar tocarlo.
  en: >-
    Social cetacean present in European waters, including the coasts of Norway and Iceland and the Strait of
    Gibraltar. The IUCN classifies it globally as Data Deficient (DD). When it surfaces, watch from land or
    with responsible operators, without chasing it or trying to touch it.
  fr: >-
    Cétacé social présent dans les eaux européennes, notamment sur les côtes de Norvège et d'Islande ainsi que
    dans le détroit de Gibraltar. L'UICN le classe globalement données insuffisantes (DD). Lorsqu'elle
    apparaît en surface, observez-la depuis la terre ou avec des opérateurs responsables, sans la poursuivre
    ni tenter de la toucher.
  de: >-
    Sozial lebender Wal in europäischen Gewässern, darunter vor den Küsten Norwegens und Islands sowie in der
    Straße von Gibraltar. Die IUCN stuft ihn weltweit als unzureichende Datenlage (DD) ein. Wenn er an der
    Oberfläche erscheint, beobachten Sie ihn von Land oder mit verantwortungsvollen Anbietern aus, ohne ihn zu
    verfolgen oder zu berühren.
  pt: >-
    Cetáceo social presente em águas europeias, incluindo as costas da Noruega e da Islândia e o estreito de
    Gibraltar. A IUCN classifica-o globalmente como dados insuficientes (DD). Quando aparecer à superfície,
    observe-o a partir de terra ou com operadores responsáveis, sem o perseguir nem tentar tocar-lhe.
