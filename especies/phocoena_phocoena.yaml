id: phocoena_phocoena
nombre_cientifico: Phocoena phocoena
nombre:
  es: Marsopa común
  en: Common porpoise
  fr: Marsouin commun
  de: Gewöhnlicher Schweinswal
  pt: Toninha-comum
descripcion:
  es: >-
    Pequeño cetáceo de aguas costeras frías, presente en el Atlántico europeo y el mar Negro. La IUCN la
    clasifica globalmente como preocupación menor (LC). Cuando aflore para respirar, obsérvalo desde tierra o
    embarcaciones responsables sin perseguirlo ni intentar atraerlo.
  en: >-
    Small cetacean of cold coastal waters, present in the European Atlantic and the Black Sea. The IUCN
    classifies it globally as Least Concern (LC). When it surfaces to breathe, watch from land or responsible
    boats without chasing it or trying to attract it.
  fr: >-
    Petit cétacé des eaux côtières froides, présent dans l'Atlantique européen et en mer Noire. L'UICN le
    classe globalement en préoccupation mineure (LC). Lorsqu'il fait surface pour respirer, observez-le depuis
    la terre ou des embarcations responsables sans le poursuivre ni tenter de l'attirer.
  de: >-
    Kleiner Wal kalter Küstengewässer, der im europäischen Atlantik und im Schwarzen Meer vorkommt. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Wenn er zum Atmen auftaucht, beobachten Sie ihn von Land
    oder von verantwortungsvollen Booten aus, ohne ihn zu verfolgen oder anzulocken.
  pt: >-
    Pequeno cetáceo de águas costeiras frias, presente no Atlântico europeu e no mar Negro. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Quando vier à superfície para respirar, observe-a a
    partir de terra ou de embarcações responsáveis sem a perseguir nem tentar atraí-la.
