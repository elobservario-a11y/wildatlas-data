id: equus_caballus
nombre_cientifico: Equus caballus
nombre:
  es: Caballo
  en: Feral horse
descripcion:
  es: >-
    Équido doméstico extendido por Europa, con razas y poblaciones mantenidas en pastizales y otros espacios
    abiertos. Es un taxón doméstico y la fuente no le asigna una categoría global de amenaza IUCN. Obsérvalo
    mientras paste desde caminos autorizados, sin ofrecer comida ni interponerte entre adultos y potros.
  en: >-
    Domestic equid widespread across Europe, with breeds and populations kept in grasslands and other open
    spaces. It is a domestic taxon and the source assigns no global IUCN threat category. Watch it grazing
    from authorised tracks, without offering food or stepping between adults and foals.
