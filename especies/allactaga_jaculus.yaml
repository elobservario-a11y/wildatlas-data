id: allactaga_jaculus
nombre_cientifico: Allactaga jaculus
nombre:
  es: Allactaga jaculus
descripcion:
  es: >-
    Roedor saltador de estepas, pastizales dispersos y semidesiertos, presente en el este europeo y Asia
    central. La IUCN la clasifica globalmente como preocupación menor (LC). Si aparece durante recorridos
    autorizados, obsérvalo desde lejos sin perseguirlo, capturarlo ni abrir madrigueras.
