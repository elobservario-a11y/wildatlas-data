id: sciurus_vulgaris
nombre_cientifico: Sciurus vulgaris
nombre:
  es: Ardilla roja
  en: Eurasian red squirrel
  fr: Écureuil roux
  de: Eurasisches Eichhörnchen
  pt: Esquilo-vermelho
descripcion:
  es: >-
    Roedor arborícola de bosques de coníferas, frondosas y mixtos de buena parte de Europa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante el día, observa su actividad desde senderos
    sin ofrecer comida ni acercarte a nidos.
  en: >-
    Arboreal rodent of conifer, broadleaf and mixed forests across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). During the day, watch its activity from trails without offering food or
    approaching dreys.
  fr: >-
    Rongeur arboricole des forêts de conifères, feuillus et mixtes d'une grande partie de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). De jour, observez son activité depuis les sentiers sans
    donner de nourriture ni vous approcher des nids.
  de: >-
    Baumbewohnendes Nagetier von Nadel-, Laub- und Mischwäldern in weiten Teilen Europas. Die IUCN stuft es
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber seine Aktivität von Wegen aus, ohne zu
    füttern oder sich Kobeln zu nähern.
  pt: >-
    Roedor arborícola de florestas de coníferas, folhosas e mistas de grande parte da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Durante o dia, observe a sua atividade a partir dos
    trilhos sem oferecer comida nem se aproximar de ninhos.
