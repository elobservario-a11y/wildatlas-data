id: rissa_tridactyla
nombre_cientifico: Rissa tridactyla
nombre:
  es: Gaviota tridáctila
  en: Black-legged kittiwake
  fr: Mouette tridactyle
  de: Dreizehenmöwe
  it: Gabbiano tridattilo
  pt: Gaivota-tridáctila
descripcion:
  es: >-
    Gaviota pelágica que cría en acantilados de las costas del Atlántico norte europeo. La IUCN la clasifica
    globalmente como vulnerable (VU). Durante la época reproductora, observa las colonias desde miradores
    distantes sin aproximarte a repisas ni provocar vuelos.
  en: >-
    Pelagic gull breeding on cliffs along the European North Atlantic coasts. The IUCN classifies it globally
    as Vulnerable (VU). During the breeding season, watch colonies from distant viewpoints without approaching
    ledges or flushing birds.
  fr: >-
    Mouette pélagique qui niche sur les falaises des côtes de l'Atlantique Nord européen. L'UICN la classe
    globalement comme vulnérable (VU). Pendant la période de reproduction, observez les colonies depuis des
    belvédères éloignés sans vous approcher des corniches ni provoquer d'envols.
  de: >-
    Pelagische Möwe, die an Steilküsten des europäischen Nordatlantiks brütet. Die IUCN stuft sie weltweit als
    gefährdet (VU) ein. Beobachten Sie Kolonien während der Brutzeit von entfernten Aussichtspunkten aus, ohne
    sich Felsbändern zu nähern oder Vögel aufzuscheuchen.
  it: >-
    Gabbiano pelagico che nidifica sulle scogliere delle coste dell'Atlantico settentrionale europeo. La IUCN
    lo classifica a livello globale come vulnerabile (VU). Durante il periodo riproduttivo, osserva le colonie
    da punti panoramici distanti senza avvicinarti alle cenge né provocare involi.
  pt: >-
    Gaivota pelágica que nidifica em falésias das costas do Atlântico Norte europeu. A IUCN classifica-a
    globalmente como vulnerável (VU). Durante a época reprodutora, observe as colónias a partir de miradouros
    distantes sem se aproximar de cornijas nem provocar levantamentos de voo.
