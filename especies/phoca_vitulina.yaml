id: phoca_vitulina
nombre_cientifico: Phoca vitulina
nombre:
  es: Foca común
  en: Common seal
  fr: Phoque commun
  de: Seehund
  it: Foca comune
  pt: Foca-comum
descripcion:
  es: >-
    Foca de costas templadas y frías del hemisferio norte, presente en aguas atlánticas europeas. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvala cuando descanse en bancos o rocas con
    telescopio, sin cortar su acceso al agua ni acercarte a las crías.
  en: >-
    Seal of temperate and cold coasts of the Northern Hemisphere, present in European Atlantic waters. The
    IUCN classifies it globally as Least Concern (LC). Watch it resting on sandbanks or rocks through a scope,
    without cutting off its access to the water or approaching pups.
  fr: >-
    Phoque des côtes tempérées et froides de l'hémisphère Nord, présent dans les eaux atlantiques européennes.
    L'UICN le classe globalement en préoccupation mineure (LC). Observez-le au repos sur les bancs ou rochers
    à la longue-vue, sans lui couper l'accès à l'eau ni vous approcher des petits.
  de: >-
    Robbe gemäßigter und kalter Küsten der Nordhalbkugel, die in europäischen Atlantikgewässern vorkommt. Die
    IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie sie beim Ruhen auf Sandbänken oder
    Felsen mit dem Spektiv, ohne ihr den Weg ins Wasser abzuschneiden oder sich Jungtieren zu nähern.
  it: >-
    Foca delle coste temperate e fredde dell'emisfero settentrionale, presente nelle acque atlantiche europee.
    La IUCN la classifica a livello globale come a rischio minimo (LC). Osservala mentre riposa su banchi o
    rocce con il cannocchiale, senza tagliarle l'accesso all'acqua né avvicinarti ai cuccioli.
  pt: >-
    Foca de costas temperadas e frias do hemisfério norte, presente em águas atlânticas europeias. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Observe-a quando descansa em bancos ou rochas com
    telescópio, sem lhe cortar o acesso à água nem se aproximar das crias.
