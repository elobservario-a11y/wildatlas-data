id: aquila_heliaca
nombre_cientifico: Aquila heliaca
nombre:
  es: Águila imperial
  en: Eastern imperial eagle
  fr: Aigle impérial
  de: Östlicher Kaiseradler
  it: Aquila imperiale
  pt: Águia-imperial-oriental
descripcion:
  es: >-
    Gran rapaz de paisajes abiertos con arbolado disperso, reproductora en el sureste de Europa. La IUCN la
    clasifica globalmente como vulnerable (VU). Durante su estancia reproductora, observa vuelos diurnos desde
    miradores sin aproximarte a árboles con nidos.
  en: >-
    Large raptor of open landscapes with scattered trees, breeding in south-eastern Europe. The IUCN
    classifies it globally as Vulnerable (VU). During the breeding season, watch daytime flights from
    viewpoints without approaching nesting trees.
  fr: >-
    Grand rapace des paysages ouverts à boisement clairsemé, nicheur dans le sud-est de l'Europe. L'UICN le
    classe globalement comme vulnérable (VU). Pendant son séjour reproducteur, observez ses vols diurnes
    depuis les belvédères sans vous approcher des arbres abritant des nids.
  de: >-
    Großer Greifvogel offener Landschaften mit lockerem Baumbestand, der in Südosteuropa brütet. Die IUCN
    stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie während der Brutzeit Tagesflüge von
    Aussichtspunkten aus, ohne sich Nistbäumen zu nähern.
  it: >-
    Grande rapace di paesaggi aperti con alberi sparsi, nidificante nell'Europa sud-orientale. La IUCN la
    classifica a livello globale come vulnerabile (VU). Durante il periodo riproduttivo, osserva i voli diurni
    dai punti panoramici senza avvicinarti agli alberi con nidi.
  pt: >-
    Grande ave de rapina de paisagens abertas com arvoredo disperso, nidificante no sudeste da Europa. A IUCN
    classifica-a globalmente como vulnerável (VU). Durante a estadia reprodutora, observe os voos diurnos a
    partir de miradouros sem se aproximar de árvores com ninhos.
