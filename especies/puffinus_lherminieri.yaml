id: puffinus_lherminieri
nombre_cientifico: Puffinus lherminieri
nombre:
  es: Pardela de Audubon
  en: Audubon's shearwater
  fr: Puffin d'Audubon
  de: Schuppensturmtaucher
  it: Berta di Audubon
  pt: Pardela-de-audubon
descripcion:
  es: >-
    Pardela tropical del Caribe y Atlántico occidental, cuyo concepto taxonómico antiguo incluía poblaciones
    hoy separadas en otras especies. La IUCN la clasifica globalmente como preocupación menor (LC). Ante una
    observación europea excepcional, confirma la identificación a distancia sin perseguir aves ni acercarte a
    colonias.
  en: >-
    Tropical shearwater of the Caribbean and western Atlantic, whose older taxonomic concept included
    populations now split into other species. The IUCN classifies it globally as Least Concern (LC). In the
    event of an exceptional European sighting, confirm identification from afar without chasing birds or
    approaching colonies.
  fr: >-
    Puffin tropical des Caraïbes et de l'Atlantique occidental, dont l'ancien concept taxinomique incluait des
    populations aujourd'hui séparées en d'autres espèces. L'UICN le classe globalement en préoccupation
    mineure (LC). Face à une observation européenne exceptionnelle, confirmez l'identification à distance sans
    poursuivre les oiseaux ni vous approcher des colonies.
  de: >-
    Tropischer Sturmtaucher der Karibik und des Westatlantiks, dessen früheres Artkonzept heute in andere
    Arten aufgeteilte Populationen einschloss. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Bei
    einer außergewöhnlichen europäischen Sichtung bestätigen Sie die Bestimmung aus der Ferne, ohne Vögel zu
    verfolgen oder sich Kolonien zu nähern.
  it: >-
    Berta tropicale dei Caraibi e dell'Atlantico occidentale, il cui vecchio concetto tassonomico includeva
    popolazioni oggi separate in altre specie. La IUCN la classifica a livello globale come a rischio minimo
    (LC). In caso di un'osservazione europea eccezionale, conferma l'identificazione a distanza senza
    inseguire gli uccelli né avvicinarti alle colonie.
  pt: >-
    Pardela tropical das Caraíbas e do Atlântico ocidental, cujo conceito taxonómico antigo incluía populações
    hoje separadas noutras espécies. A IUCN classifica-a globalmente como pouco preocupante (LC). Perante uma
    observação europeia excecional, confirme a identificação à distância sem perseguir aves nem se aproximar
    de colónias.
