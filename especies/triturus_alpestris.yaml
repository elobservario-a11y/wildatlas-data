id: triturus_alpestris
nombre_cientifico: Triturus alpestris
nombre:
  es: Tritón alpino
  en: Alpine newt
  fr: Triton alpestre
  de: Bergmolch
descripcion:
  es: >-
    Anfibio de Europa continental que combina hábitats terrestres, frecuentemente forestales, con charcas y
    lagos para reproducirse. La IUCN la clasifica globalmente como preocupación menor (LC). En la estación
    reproductora, obsérvalo desde fuera de las charcas sin capturarlo, entrar en el agua ni mover vegetación.
  en: >-
    Amphibian of continental Europe combining terrestrial, often forest habitats with ponds and lakes for
    breeding. The IUCN classifies it globally as Least Concern (LC). During the breeding season, watch from
    outside ponds without catching it, entering the water or disturbing vegetation.
  fr: >-
    Amphibien d'Europe continentale qui associe milieux terrestres, souvent forestiers, et mares ou lacs pour
    se reproduire. L'UICN le classe globalement en préoccupation mineure (LC). En période de reproduction,
    observez-le depuis l'extérieur des mares sans le capturer, entrer dans l'eau ni déplacer la végétation.
  de: >-
    Lurch Kontinentaleuropas, der terrestrische, oft bewaldete Lebensräume mit Tümpeln und Seen zur
    Fortpflanzung verbindet. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn zur
    Fortpflanzungszeit vom Ufer aus, ohne ihn zu fangen, ins Wasser zu steigen oder Pflanzen zu stören.
