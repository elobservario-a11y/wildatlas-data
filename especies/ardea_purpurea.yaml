id: ardea_purpurea
nombre_cientifico: Ardea purpurea
nombre:
  es: Garza imperial
  en: Purple heron
  fr: Héron pourpré
  de: Purpurreiher
  it: Airone rosso
  pt: Garça-vermelha
descripcion:
  es: >-
    Garza de humedales con vegetación densa que cría en Europa central y meridional. La IUCN la clasifica
    globalmente como preocupación menor (LC). Al amanecer o al atardecer, espera sus salidas desde
    observatorios sin entrar en carrizales ni reproducir reclamos.
  en: >-
    Heron of densely vegetated wetlands breeding in central and southern Europe. The IUCN classifies it
    globally as Least Concern (LC). At dawn or dusk, wait for it to emerge from hides without entering
    reedbeds or playing back calls.
  fr: >-
    Héron des zones humides à végétation dense qui niche en Europe centrale et méridionale. L'UICN le classe
    globalement en préoccupation mineure (LC). À l'aube ou au crépuscule, attendez ses sorties depuis les
    observatoires sans entrer dans les roselières ni diffuser de chants.
  de: >-
    Reiher dicht bewachsener Feuchtgebiete, der in Mittel- und Südeuropa brütet. Die IUCN stuft ihn weltweit
    als nicht gefährdet (LC) ein. Warten Sie in der Morgen- oder Abenddämmerung von Beobachtungshütten aus auf
    seine Flüge, ohne Schilfgürtel zu betreten oder Rufe abzuspielen.
  it: >-
    Airone delle zone umide con vegetazione fitta che nidifica nell'Europa centrale e meridionale. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). All'alba o al tramonto, attendi le sue uscite
    dagli appostamenti senza entrare nei canneti né riprodurre richiami.
  pt: >-
    Garça de zonas húmidas com vegetação densa que nidifica na Europa central e meridional. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Ao amanhecer ou ao entardecer, aguarde as suas
    saídas a partir de observatórios sem entrar em caniços nem reproduzir chamarizes.
