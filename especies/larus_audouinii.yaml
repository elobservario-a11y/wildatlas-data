id: larus_audouinii
nombre_cientifico: Larus audouinii
nombre:
  es: Gaviota de Audouin
  en: Audouin's gull
  fr: Goéland d'Audouin
descripcion:
  es: >-
    Gaviota mediterránea ligada a costas e islas, que se alimenta principalmente de recursos marinos. La IUCN
    la clasifica globalmente como vulnerable (VU). Obsérvala cuando pesque o descanse desde miradores
    costeros, sin entrar en colonias ni ofrecerle alimento.
  en: >-
    Mediterranean gull linked to coasts and islands, feeding mainly on marine prey. The IUCN classifies it
    globally as Vulnerable (VU). Watch it fishing or resting from coastal viewpoints, without entering
    colonies or offering food.
  fr: >-
    Goéland méditerranéen lié aux côtes et aux îles, qui se nourrit principalement de ressources marines.
    L'UICN le classe globalement comme vulnérable (VU). Observez-le pêcher ou se reposer depuis les belvédères
    côtiers, sans entrer dans les colonies ni lui donner de nourriture.
