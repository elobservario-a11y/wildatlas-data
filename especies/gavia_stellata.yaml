id: gavia_stellata
nombre_cientifico: Gavia stellata
nombre:
  es: Colimbo chico
  en: Red-throated diver
  fr: Plongeon catmarin
  de: Sterntaucher
  it: Strolaga minore
  pt: Mobelha-pequena
descripcion:
  es: >-
    Ave acuática buceadora que cría en regiones árticas y pasa el invierno en costas europeas más templadas.
    La IUCN la clasifica globalmente como preocupación menor (LC). En invierno, obsérvala sobre el mar desde
    miradores con telescopio sin acercarte con embarcaciones.
  en: >-
    Diving waterbird breeding in Arctic regions and wintering along more temperate European coasts. The IUCN
    classifies it globally as Least Concern (LC). In winter, watch it on the sea from viewpoints with a scope
    without approaching in boats.
  fr: >-
    Oiseau aquatique plongeur qui niche dans les régions arctiques et hiverne sur les côtes européennes plus
    tempérées. L'UICN le classe globalement en préoccupation mineure (LC). En hiver, observez-le en mer depuis
    les belvédères à la longue-vue sans vous approcher en bateau.
  de: >-
    Tauchender Wasservogel, der in arktischen Regionen brütet und an gemäßigteren europäischen Küsten
    überwintert. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn im Winter auf
    dem Meer von Aussichtspunkten aus mit dem Spektiv, ohne sich mit Booten zu nähern.
  it: >-
    Uccello acquatico tuffatore che nidifica nelle regioni artiche e sverna lungo le coste europee più
    temperate. La IUCN lo classifica a livello globale come a rischio minimo (LC). In inverno, osservala in
    mare dai punti panoramici con il cannocchiale senza avvicinarti con imbarcazioni.
  pt: >-
    Ave aquática mergulhadora que nidifica em regiões árticas e passa o inverno em costas europeias mais
    temperadas. A IUCN classifica-a globalmente como pouco preocupante (LC). No inverno, observe-a no mar a
    partir de miradouros com telescópio sem se aproximar de embarcação.
