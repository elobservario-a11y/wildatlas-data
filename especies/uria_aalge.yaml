id: uria_aalge
nombre_cientifico: Uria aalge
nombre:
  es: Arao común
  en: Common murre
  fr: Guillemot de Troïl
  de: Trottellumme
  it: Uria
  pt: Airo
descripcion:
  es: >-
    Ave marina que cría en acantilados e islas del Atlántico norte europeo y se alimenta buceando. La IUCN la
    clasifica globalmente como preocupación menor (LC). En época reproductora, utiliza miradores distantes
    para observar las colonias sin acercarte a repisas ni acceder a ellas en barco.
  en: >-
    Seabird breeding on cliffs and islands of the European North Atlantic and feeding by diving. The IUCN
    classifies it globally as Least Concern (LC). During the breeding season, use distant viewpoints to watch
    colonies without approaching ledges or visiting them by boat.
  fr: >-
    Oiseau marin qui niche sur les falaises et îles de l'Atlantique Nord européen et se nourrit en plongeant.
    L'UICN le classe globalement en préoccupation mineure (LC). En période de reproduction, utilisez des
    belvédères éloignés pour observer les colonies sans vous approcher des corniches ni y accéder en bateau.
  de: >-
    Seevogel, der an Klippen und auf Inseln des europäischen Nordatlantiks brütet und tauchend frisst. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Nutzen Sie zur Brutzeit entfernte Aussichtspunkte
    zur Beobachtung der Kolonien, ohne sich Felsbändern zu nähern oder sie per Boot anzusteuern.
  it: >-
    Uccello marino che nidifica su scogliere e isole dell'Atlantico settentrionale europeo e si nutre
    immergendosi. La IUCN la classifica a livello globale come a rischio minimo (LC). Nella stagione
    riproduttiva, utilizza punti panoramici distanti per osservare le colonie senza avvicinarti alle cenge né
    accedervi in barca.
  pt: >-
    Ave marinha que nidifica em falésias e ilhas do Atlântico Norte europeu e se alimenta mergulhando. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Na época reprodutora, utilize miradouros distantes
    para observar as colónias sem se aproximar de cornijas nem aceder a elas de barco.
