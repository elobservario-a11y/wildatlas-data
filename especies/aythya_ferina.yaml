id: aythya_ferina
nombre_cientifico: Aythya ferina
nombre:
  es: Porrón europeo
  en: Common pochard
  fr: Fuligule milouin
  de: Tafelente
  it: Moriglione
  pt: Zarro-comum
descripcion:
  es: >-
    Pato buceador que cría en lagos y marismas europeos y pasa el invierno en regiones del sur y oeste. La
    IUCN la clasifica globalmente como vulnerable (VU). En otoño e invierno, observa los bandos desde
    miradores sin acercarte a dormideros ni provocar vuelos.
  en: >-
    Diving duck that breeds on European lakes and marshes and winters in southern and western regions. The
    IUCN classifies it globally as Vulnerable (VU). In autumn and winter, watch flocks from viewpoints without
    approaching roosts or flushing birds.
  fr: >-
    Canard plongeur qui niche sur les lacs et marais européens et hiverne dans les régions du sud et de
    l'ouest. L'UICN le classe globalement comme vulnérable (VU). En automne et en hiver, observez les groupes
    depuis les belvédères sans vous approcher des dortoirs ni provoquer d'envols.
  de: >-
    Tauchente, die an europäischen Seen und Sümpfen brütet und in südlichen und westlichen Regionen
    überwintert. Die IUCN stuft sie weltweit als gefährdet (VU) ein. Beobachten Sie Schwärme im Herbst und
    Winter von Aussichtspunkten aus, ohne sich Schlafplätzen zu nähern oder sie aufzuscheuchen.
  it: >-
    Anatra tuffatrice che nidifica su laghi e paludi europei e sverna nelle regioni meridionali e occidentali.
    La IUCN la classifica a livello globale come vulnerabile (VU). In autunno e in inverno, osserva gli stormi
    dai punti panoramici senza avvicinarti ai dormitori né provocare involi.
  pt: >-
    Pato mergulhador que nidifica em lagos e sapais europeus e passa o inverno em regiões do sul e oeste. A
    IUCN classifica-o globalmente como vulnerável (VU). No outono e no inverno, observe os bandos a partir de
    miradouros sem se aproximar de dormitórios nem provocar levantamentos de voo.
