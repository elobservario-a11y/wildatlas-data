id: regulus_regulus
nombre_cientifico: Regulus regulus
nombre:
  es: Reyezuelo sencillo
  en: Goldcrest
  fr: Roitelet huppé
  de: Wintergoldhähnchen
  it: Regolo
  pt: Estrelinha-de-poupa
descripcion:
  es: >-
    Pequeña ave de bosques de coníferas, parques y otros ambientes arbolados de amplia distribución europea.
    La IUCN la clasifica globalmente como preocupación menor (LC). De día, observa su actividad entre ramas
    desde senderos sin reproducir cantos ni acercarte a nidos.
  en: >-
    Small bird of conifer forests, parks and other wooded habitats widely distributed across Europe. The IUCN
    classifies it globally as Least Concern (LC). During the day, watch its activity among branches from
    trails without playing back calls or approaching nests.
  fr: >-
    Petit oiseau des forêts de conifères, parcs et autres milieux boisés largement répandu en Europe. L'UICN
    le classe globalement en préoccupation mineure (LC). De jour, observez son activité dans les branches
    depuis les sentiers sans diffuser de chants ni vous approcher des nids.
  de: >-
    Kleiner Vogel von Nadelwäldern, Parks und anderen Gehölzen mit weiter Verbreitung in Europa. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber seine Aktivität in den Zweigen
    von Wegen aus, ohne Gesänge abzuspielen oder sich Nestern zu nähern.
  it: >-
    Piccolo uccello di foreste di conifere, parchi e altri ambienti alberati ampiamente diffuso in Europa. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Di giorno, osserva la sua attività tra i
    rami dai sentieri senza riprodurre canti né avvicinarti ai nidi.
  pt: >-
    Pequena ave de florestas de coníferas, parques e outros ambientes arborizados de ampla distribuição
    europeia. A IUCN classifica-a globalmente como pouco preocupante (LC). De dia, observe a sua atividade
    entre ramos a partir dos trilhos sem reproduzir cantos nem se aproximar de ninhos.
