id: astragalus_peterfii
nombre_cientifico: Astragalus peterfii
nombre:
  es: Astragalus peterfii
descripcion:
  es: >-
    Leguminosa documentada en pastos y prados de Transilvania, en Rumanía. GBIF recoge para ella la categoría
    IUCN de datos insuficientes (DD). Obsérvala con luz diurna cuando sea identificable desde las rutas
    permitidas, sin recoger ejemplares ni pisar la vegetación.
