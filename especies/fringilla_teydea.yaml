id: fringilla_teydea
nombre_cientifico: Fringilla teydea
nombre:
  es: Pinzón azul del Teide
  en: Tenerife blue chaffinch
  fr: Pinson bleu
  de: Teidefink
  it: Fringuello blu delle Canarie
  pt: Tentilhão-azul
descripcion:
  es: >-
    Pequeño pinzón endémico de Tenerife, ligado principalmente a los pinares de montaña. La IUCN la clasifica
    globalmente como casi amenazada (NT). Durante el día, obsérvalo desde senderos forestales sin ofrecer
    comida ni utilizar reclamos.
  en: >-
    Small finch endemic to Tenerife, associated mainly with mountain pine forests. The IUCN classifies it
    globally as Near Threatened (NT). During the day, watch it from forest trails without offering food or
    using playback.
  fr: >-
    Petit pinson endémique de Tenerife, principalement lié aux pinèdes de montagne. L'UICN le classe
    globalement quasi menacé (NT). De jour, observez-le depuis les sentiers forestiers sans donner de
    nourriture ni utiliser d'appeaux.
  de: >-
    Kleiner, auf Teneriffa endemischer Fink, der vor allem an Bergkiefernwälder gebunden ist. Die IUCN stuft
    ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie ihn tagsüber von Waldwegen aus, ohne Futter
    anzubieten oder Klangattrappen zu nutzen.
  it: >-
    Piccolo fringuello endemico di Tenerife, legato principalmente alle pinete montane. La IUCN lo classifica
    a livello globale come prossimo alla minaccia (NT). Di giorno, osservalo dai sentieri forestali senza
    offrire cibo né usare richiami.
  pt: >-
    Pequeno tentilhão endémico de Tenerife, ligado principalmente aos pinhais de montanha. A IUCN classifica-o
    globalmente como quase ameaçado (NT). Durante o dia, observe-o a partir de trilhos florestais sem oferecer
    comida nem usar chamarizes.
