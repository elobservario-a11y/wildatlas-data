id: abies_alba
nombre_cientifico: Abies alba
nombre:
  es: Abeto blanco
  en: Silver fir
  fr: Sapin blanc
  de: Weiß-Tanne
  it: Abete bianco
descripcion:
  es: >-
    Conífera de bosques montanos europeos, presente en cordilleras como Pirineos, Alpes, Cárpatos y montañas
    balcánicas. La IUCN la clasifica globalmente como preocupación menor (LC). Puede observarse durante todo
    el año desde senderos forestales, sin arrancar ramas ni dañar el sotobosque.
  en: >-
    Conifer of European montane forests, present in mountain ranges such as the Pyrenees, Alps, Carpathians
    and Balkan mountains. The IUCN classifies it globally as Least Concern (LC). It can be observed year-round
    from forest trails, without breaking branches or damaging the undergrowth.
  fr: >-
    Conifère des forêts montagnardes européennes, présent dans des massifs tels que les Pyrénées, les Alpes,
    les Carpates et les montagnes des Balkans. L'UICN le classe globalement en préoccupation mineure (LC). Il
    peut être observé toute l'année depuis les sentiers forestiers, sans casser de branches ni endommager le
    sous-bois.
  de: >-
    Nadelbaum europäischer Bergwälder, der in Gebirgen wie den Pyrenäen, Alpen, Karpaten und auf dem Balkan
    vorkommt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Er lässt sich ganzjährig von Waldwegen
    aus beobachten, ohne Äste abzubrechen oder das Unterholz zu beschädigen.
  it: >-
    Conifera delle foreste montane europee, presente in catene montuose come Pirenei, Alpi, Carpazi e monti
    dei Balcani. La IUCN la classifica a livello globale come a rischio minimo (LC). Può essere osservata
    tutto l'anno dai sentieri forestali, senza spezzare rami né danneggiare il sottobosco.
