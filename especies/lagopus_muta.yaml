id: lagopus_muta
nombre_cientifico: Lagopus muta
nombre:
  es: Lagópodo alpino
  en: Rock ptarmigan
  fr: Lagopède alpin
  de: Alpenschneehuhn
  it: Pernice bianca
  pt: Lagópode-branco
descripcion:
  es: >-
    Galliforme de tundras y laderas pedregosas del norte europeo y de cordilleras como los Alpes y Pirineos.
    La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvalo durante recorridos diurnos desde
    senderos, sin usar reclamos ni seguir al ave o sus polladas.
  en: >-
    Gamebird of tundras and stony slopes of northern Europe and mountain ranges such as the Alps and Pyrenees.
    The IUCN classifies it globally as Least Concern (LC). Watch it during daytime walks from trails, without
    using playback or following the bird or broods.
  fr: >-
    Galliforme des toundras et pentes pierreuses du nord de l'Europe et de massifs comme les Alpes et les
    Pyrénées. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le lors de randonnées
    diurnes depuis les sentiers, sans utiliser d'appeaux ni suivre l'oiseau ou ses nichées.
  de: >-
    Hühnervogel der Tundren und Geröllhänge Nordeuropas sowie von Gebirgen wie den Alpen und Pyrenäen. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn bei Tageswanderungen von Wegen
    aus, ohne Klangattrappen zu nutzen oder dem Vogel und seinen Küken zu folgen.
  it: >-
    Galliforme di tundre e pendii pietrosi dell'Europa settentrionale e di catene come Alpi e Pirenei. La IUCN
    la classifica a livello globale come a rischio minimo (LC). Osservala durante le escursioni diurne dai
    sentieri, senza usare richiami né seguire l'uccello o le covate.
  pt: >-
    Galiforme de tundras e encostas pedregosas do norte europeu e de cordilheiras como os Alpes e os Pirenéus.
    A IUCN classifica-a globalmente como pouco preocupante (LC). Observe-a durante percursos diurnos a partir
    dos trilhos, sem usar chamarizes nem seguir a ave ou as suas ninhadas.
