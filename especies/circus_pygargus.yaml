id: circus_pygargus
nombre_cientifico: Circus pygargus
nombre:
  es: Aguilucho cenizo
  en: Montagu's harrier
  fr: Busard cendré
  de: Wiesenweihe
  it: Albanella minore
  pt: Tartaranhão-caçador
descripcion:
  es: >-
    Rapaz migratoria de pastizales, llanuras y cultivos europeos que pasa el invierno principalmente en
    África. La IUCN la clasifica globalmente como preocupación menor (LC). En primavera y verano, observa sus
    vuelos bajos desde caminos sin entrar en cultivos ni buscar nidos.
  en: >-
    Migratory raptor of European grasslands, plains and farmland that winters mainly in Africa. The IUCN
    classifies it globally as Least Concern (LC). In spring and summer, watch its low flights from tracks
    without entering crops or searching for nests.
  fr: >-
    Rapace migrateur des prairies, plaines et cultures européennes qui hiverne principalement en Afrique.
    L'UICN le classe globalement en préoccupation mineure (LC). Au printemps et en été, observez ses vols bas
    depuis les chemins sans entrer dans les cultures ni chercher de nids.
  de: >-
    Zuggreifvogel europäischer Wiesen, Ebenen und Äcker, der hauptsächlich in Afrika überwintert. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie im Frühjahr und Sommer seine tiefen Flüge
    von Wegen aus, ohne Felder zu betreten oder nach Nestern zu suchen.
  it: >-
    Rapace migratore di praterie, pianure e coltivi europei che sverna principalmente in Africa. La IUCN la
    classifica a livello globale come a rischio minimo (LC). In primavera e in estate, osserva i suoi voli
    bassi dai sentieri senza entrare nei coltivi né cercare nidi.
  pt: >-
    Ave de rapina migratória de pastagens, planícies e culturas europeias que passa o inverno sobretudo em
    África. A IUCN classifica-a globalmente como pouco preocupante (LC). Na primavera e no verão, observe os
    seus voos baixos a partir dos caminhos sem entrar em culturas nem procurar ninhos.
