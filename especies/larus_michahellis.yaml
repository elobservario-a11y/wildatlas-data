id: larus_michahellis
nombre_cientifico: Larus michahellis
nombre:
  es: Gaviota patiamarilla
  en: Yellow-legged gull
  fr: Goéland leucophée
  de: Mittelmeermöwe
  it: Gabbiano reale
  pt: Gaivota-de-patas-amarelas
descripcion:
  es: >-
    Gaviota de costas e islas mediterráneas y atlánticas europeas, también presente en ambientes
    transformados. La IUCN la clasifica globalmente como preocupación menor (LC). De día, observa sus vuelos y
    descanso desde espacios públicos sin ofrecer comida ni acercarte a colonias.
  en: >-
    Gull of Mediterranean and European Atlantic coasts and islands, also present in modified habitats. The
    IUCN classifies it globally as Least Concern (LC). During the day, watch its flights and loafing from
    public spaces without offering food or approaching colonies.
  fr: >-
    Goéland des côtes et îles méditerranéennes et atlantiques européennes, également présent dans les milieux
    transformés. L'UICN le classe globalement en préoccupation mineure (LC). De jour, observez ses vols et son
    repos depuis les espaces publics sans donner de nourriture ni vous approcher des colonies.
  de: >-
    Möwe der Mittelmeer- und europäischen Atlantikküsten sowie Inseln, die auch in veränderten Lebensräumen
    vorkommt. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber ihre Flüge und
    Ruhephasen von öffentlichen Bereichen aus, ohne zu füttern oder sich Kolonien zu nähern.
  it: >-
    Gabbiano di coste e isole mediterranee e atlantiche europee, presente anche in ambienti trasformati. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Di giorno, osserva i suoi voli e il
    riposo dagli spazi pubblici senza offrire cibo né avvicinarti alle colonie.
  pt: >-
    Gaivota de costas e ilhas mediterrânicas e atlânticas europeias, também presente em ambientes
    transformados. A IUCN classifica-a globalmente como pouco preocupante (LC). De dia, observe os seus voos e
    descanso a partir de espaços públicos sem oferecer comida nem se aproximar de colónias.
