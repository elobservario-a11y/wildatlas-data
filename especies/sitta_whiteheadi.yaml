id: sitta_whiteheadi
nombre_cientifico: Sitta whiteheadi
nombre:
  es: Trepador corso
  en: Corsican nuthatch
  fr: Sittelle corse
  de: Korsenkleiber
  it: Picchio muratore corso
  pt: Trepadeira-corsa
descripcion:
  es: >-
    Pequeña ave endémica de Córcega ligada a pinares viejos de montaña, con desplazamientos a menor altitud en
    invierno. La IUCN la clasifica globalmente como vulnerable (VU). Obsérvala durante el día desde senderos
    sin usar reclamos ni acercarte a cavidades de cría.
  en: >-
    Small bird endemic to Corsica linked to old mountain pinewoods, moving to lower elevations in winter. The
    IUCN classifies it globally as Vulnerable (VU). Watch it during the day from trails without using playback
    or approaching nest cavities.
  fr: >-
    Petit oiseau endémique de Corse lié aux vieilles pinèdes de montagne, avec des déplacements à plus basse
    altitude en hiver. L'UICN la classe globalement comme vulnérable (VU). Observez-la de jour depuis les
    sentiers sans utiliser d'appeaux ni vous approcher des cavités de nidification.
  de: >-
    Kleiner, auf Korsika endemischer Vogel, der an alte Bergkiefernwälder gebunden ist und im Winter tiefere
    Lagen aufsucht. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie ihn tagsüber von Wegen
    aus, ohne Klangattrappen zu nutzen oder sich Bruthöhlen zu nähern.
  it: >-
    Piccolo uccello endemico della Corsica legato a vecchie pinete montane, con spostamenti a quote più basse
    in inverno. La IUCN lo classifica a livello globale come vulnerabile (VU). Osservalo di giorno dai
    sentieri senza usare richiami né avvicinarti alle cavità di nidificazione.
  pt: >-
    Pequena ave endémica da Córsega ligada a pinhais velhos de montanha, com deslocações para menor altitude
    no inverno. A IUCN classifica-a globalmente como vulnerável (VU). Observe-a durante o dia a partir dos
    trilhos sem usar chamarizes nem se aproximar de cavidades de criação.
