id: margaritifera_margaritifera
nombre_cientifico: Margaritifera margaritifera
nombre:
  es: Madreperla de río
  en: Freshwater pearl mussel
  de: Flussperlmuschel
  pt: Náiade perlífera
descripcion:
  es: >-
    Molusco bivalvo de aguas dulces europeas que vive en fondos fluviales y depende de una buena calidad del
    agua. La IUCN la clasifica globalmente como en peligro (EN). Cuando sea visible en aguas claras, obsérvalo
    desde la orilla sin entrar en el cauce, tocarlo ni abrir conchas.
  en: >-
    Freshwater bivalve mollusc of European rivers that lives on riverbeds and depends on good water quality.
    The IUCN classifies it globally as Endangered (EN). When visible in clear water, observe from the bank
    without entering the riverbed, touching it or opening shells.
  de: >-
    Süßwassermuschel europäischer Flüsse, die auf Flussgründen lebt und auf gute Wasserqualität angewiesen
    ist. Die IUCN stuft sie weltweit als stark gefährdet (EN) ein. Wenn sie in klarem Wasser sichtbar ist,
    beobachten Sie sie vom Ufer aus, ohne ins Flussbett zu steigen, sie anzufassen oder Schalen zu öffnen.
  pt: >-
    Molusco bivalve de águas doces europeias que vive em fundos fluviais e depende de uma boa qualidade da
    água. A IUCN classifica-a globalmente como em perigo (EN). Quando for visível em águas límpidas, observe-a
    a partir da margem sem entrar no leito, tocar-lhe nem abrir conchas.
