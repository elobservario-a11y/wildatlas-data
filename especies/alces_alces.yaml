id: alces_alces
nombre_cientifico: Alces alces
nombre:
  es: Alce
  en: Moose
  fr: Élan
  de: Elch
  pt: Alce
descripcion:
  es: >-
    Gran cérvido de bosques boreales y humedales del norte y este de Europa. La IUCN la clasifica globalmente
    como preocupación menor (LC). De día, explora bordes forestales con prismáticos sin acercarte a los
    animales ni interponerte entre madre y cría.
  en: >-
    Large deer of boreal forests and wetlands in northern and eastern Europe. The IUCN classifies it globally
    as Least Concern (LC). During the day, scan forest edges with binoculars without approaching the animals
    or coming between a mother and her calf.
  fr: >-
    Grand cervidé des forêts boréales et zones humides du nord et de l'est de l'Europe. L'UICN le classe
    globalement en préoccupation mineure (LC). De jour, explorez les lisières forestières aux jumelles sans
    vous approcher des animaux ni vous interposer entre une mère et son petit.
  de: >-
    Großer Hirsch borealer Wälder und Feuchtgebiete Nord- und Osteuropas. Die IUCN stuft ihn weltweit als
    nicht gefährdet (LC) ein. Beobachten Sie tagsüber Waldränder mit dem Fernglas, ohne sich den Tieren zu
    nähern oder zwischen Muttertier und Kalb zu geraten.
  pt: >-
    Grande cervídeo de florestas boreais e zonas húmidas do norte e leste da Europa. A IUCN classifica-o
    globalmente como pouco preocupante (LC). De dia, observe as orlas florestais com binóculos sem se
    aproximar dos animais nem se interpor entre a mãe e a cria.
