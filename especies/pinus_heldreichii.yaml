id: pinus_heldreichii
nombre_cientifico: Pinus heldreichii
nombre:
  es: Pino de Bosnia
  en: Bosnian pine
  fr: Pin de Bosnie
  de: Schlangenhaut-Kiefer
descripcion:
  es: >-
    Pino de montañas del sureste europeo y del sur de Italia, que ocupa laderas y ambientes de alta montaña.
    La IUCN la clasifica globalmente como preocupación menor (LC). Puede observarse durante todo el año desde
    senderos, sin arrancar ramas ni acercarte a ejemplares pisando la vegetación.
  en: >-
    Pine of mountains in south-eastern Europe and southern Italy, occupying slopes and high-mountain habitats.
    The IUCN classifies it globally as Least Concern (LC). It can be seen year-round from trails, without
    breaking branches or trampling vegetation to approach trees.
  fr: >-
    Pin des montagnes du sud-est européen et du sud de l'Italie, qui occupe les versants et milieux de haute
    montagne. L'UICN le classe globalement en préoccupation mineure (LC). Il peut être observé toute l'année
    depuis les sentiers, sans casser de branches ni piétiner la végétation pour s'approcher des arbres.
  de: >-
    Kiefer der Gebirge Südosteuropas und Süditaliens, die Hänge und Hochgebirgslebensräume besiedelt. Die IUCN
    stuft sie weltweit als nicht gefährdet (LC) ein. Sie lässt sich ganzjährig von Wegen aus beobachten, ohne
    Äste abzubrechen oder durch Betreten der Vegetation an Bäume heranzutreten.
