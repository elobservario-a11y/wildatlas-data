id: vulpes_lagopus
nombre_cientifico: Vulpes lagopus
nombre:
  es: Zorro ártico
  en: Arctic fox
  fr: Renard polaire
  de: Polarfuchs
  it: Volpe artica
  pt: Raposa-do-ártico
descripcion:
  es: >-
    Pequeño cánido de tundras y costas árticas, presente en Islandia, Escandinavia y archipiélagos del norte
    europeo. La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvalo cuando recorra la
    tundra, con prismáticos y sin alimentarlo ni acercarte a sus madrigueras.
  en: >-
    Small canid of Arctic tundras and coasts, present in Iceland, Scandinavia and northern European
    archipelagos. The IUCN classifies it globally as Least Concern (LC). Watch it crossing the tundra with
    binoculars, without feeding it or approaching its dens.
  fr: >-
    Petit canidé des toundras et côtes arctiques, présent en Islande, en Scandinavie et dans les archipels du
    nord de l'Europe. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le parcourir la
    toundra aux jumelles, sans le nourrir ni vous approcher de ses terriers.
  de: >-
    Kleiner Wildhund arktischer Tundren und Küsten, der auf Island, in Skandinavien und auf nordeuropäischen
    Inselgruppen vorkommt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn beim
    Durchstreifen der Tundra mit dem Fernglas, ohne ihn zu füttern oder sich seinen Bauen zu nähern.
  it: >-
    Piccolo canide di tundre e coste artiche, presente in Islanda, Scandinavia e negli arcipelaghi del nord
    Europa. La IUCN lo classifica a livello globale come a rischio minimo (LC). Osservalo mentre percorre la
    tundra con il binocolo, senza nutrirlo né avvicinarti alle sue tane.
  pt: >-
    Pequeno canídeo de tundras e costas árticas, presente na Islândia, Escandinávia e arquipélagos do norte
    europeu. A IUCN classifica-o globalmente como pouco preocupante (LC). Observe-o quando percorre a tundra,
    com binóculos e sem o alimentar nem se aproximar das suas tocas.
