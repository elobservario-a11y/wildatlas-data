id: bubulcus_ibis
nombre_cientifico: Bubulcus ibis
nombre:
  es: Garcilla bueyera
  en: Western cattle egret
  fr: Héron garde-boeufs
  de: Kuhreiher
  it: Airone guardabuoi
  pt: Garça-boieira
descripcion:
  es: >-
    Garza de pastizales y otros medios abiertos, presente en regiones templadas y cálidas de Europa y
    frecuentemente asociada al ganado. BirdLife recoge la categoría global IUCN de preocupación menor (LC)
    para Bubulcus ibis. De día, obsérvala alimentándose desde caminos sin acercarte a colonias ni perseguir
    los grupos.
  en: >-
    Heron of pastures and other open habitats, present in temperate and warm regions of Europe and often
    associated with livestock. BirdLife records the global IUCN category of Least Concern (LC) for Bubulcus
    ibis. During the day, watch it feeding from tracks without approaching colonies or chasing flocks.
  fr: >-
    Héron des pâturages et autres milieux ouverts, présent dans les régions tempérées et chaudes d'Europe et
    souvent associé au bétail. BirdLife indique la catégorie mondiale UICN de préoccupation mineure (LC) pour
    Bubulcus ibis. De jour, observez-le s'alimenter depuis les chemins sans vous approcher des colonies ni
    poursuivre les groupes.
  de: >-
    Reiher von Weiden und anderen offenen Lebensräumen, der in gemäßigten und warmen Regionen Europas vorkommt
    und häufig mit Weidevieh vergesellschaftet ist. BirdLife führt für Bubulcus ibis die globale
    IUCN-Kategorie nicht gefährdet (LC). Beobachten Sie ihn tagsüber bei der Nahrungssuche von Wegen aus, ohne
    sich Kolonien zu nähern oder Trupps zu verfolgen.
  it: >-
    Airone di pascoli e altri ambienti aperti, presente nelle regioni temperate e calde d'Europa e spesso
    associato al bestiame. BirdLife riporta la categoria globale IUCN a rischio minimo (LC) per Bubulcus ibis.
    Di giorno, osservalo mentre si nutre dai sentieri senza avvicinarti alle colonie né inseguire i gruppi.
  pt: >-
    Garça de pastagens e outros meios abertos, presente em regiões temperadas e quentes da Europa e
    frequentemente associada ao gado. A BirdLife regista a categoria global IUCN de pouco preocupante (LC)
    para Bubulcus ibis. De dia, observe-a a alimentar-se a partir dos caminhos sem se aproximar de colónias
    nem perseguir os bandos.
