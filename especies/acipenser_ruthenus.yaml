id: acipenser_ruthenus
nombre_cientifico: Acipenser ruthenus
nombre:
  es: Esterlete del Danubio
  en: Sterlet
  de: Sterlet
descripcion:
  es: >-
    Esturión de grandes ríos euroasiáticos, con presencia natural en cuencas europeas que desembocan en los
    mares Negro, Azov y Caspio. La IUCN la clasifica globalmente como en peligro (EN). Cuando sea visible en
    un recorrido autorizado, obsérvalo desde la ribera sin capturarlo ni alterar fondos fluviales.
  en: >-
    Sturgeon of large Eurasian rivers, naturally present in European basins draining into the Black, Azov and
    Caspian seas. The IUCN classifies it globally as Endangered (EN). When visible on an authorised route,
    observe it from the riverbank without catching it or disturbing riverbeds.
  de: >-
    Stör großer eurasischer Flüsse mit natürlichem Vorkommen in europäischen Einzugsgebieten, die ins
    Schwarze, Asowsche und Kaspische Meer münden. Die IUCN stuft ihn weltweit als stark gefährdet (EN) ein.
    Wenn er auf einer zugelassenen Strecke sichtbar ist, beobachten Sie ihn vom Ufer aus, ohne ihn zu fangen
    oder den Flussgrund zu stören.
