id: dryocopus_martius
nombre_cientifico: Dryocopus martius
nombre:
  es: Picamaderos negro
  en: Black woodpecker
  fr: Pic noir
  de: Schwarzspecht
  it: Picchio nero
  pt: Pica-pau-preto
descripcion:
  es: >-
    Gran pájaro carpintero de bosques maduros de buena parte de Europa continental, ligado a árboles con
    cavidades. La IUCN la clasifica globalmente como preocupación menor (LC). Durante el día, escucha sus
    llamadas desde senderos sin golpear troncos, usar reclamos ni acercarte a agujeros de cría.
  en: >-
    Large woodpecker of mature forests across much of continental Europe, associated with cavity-bearing
    trees. The IUCN classifies it globally as Least Concern (LC). During the day, listen for its calls from
    trails without tapping trunks, using playback or approaching nest holes.
  fr: >-
    Grand pic des forêts matures d'une grande partie de l'Europe continentale, lié aux arbres à cavités.
    L'UICN le classe globalement en préoccupation mineure (LC). De jour, écoutez ses cris depuis les sentiers
    sans frapper les troncs, utiliser d'appeaux ni vous approcher des cavités de nidification.
  de: >-
    Großer Specht reifer Wälder in weiten Teilen Kontinentaleuropas, der an Höhlenbäume gebunden ist. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Lauschen Sie tagsüber von Wegen aus auf seine Rufe, ohne
    an Stämme zu klopfen, Klangattrappen zu nutzen oder sich Bruthöhlen zu nähern.
  it: >-
    Grande picchio delle foreste mature di gran parte dell'Europa continentale, legato ad alberi con cavità.
    La IUCN lo classifica a livello globale come a rischio minimo (LC). Di giorno, ascolta i suoi richiami dai
    sentieri senza battere sui tronchi, usare richiami né avvicinarti ai fori di nidificazione.
  pt: >-
    Grande pica-pau de florestas maduras de boa parte da Europa continental, ligado a árvores com cavidades. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Durante o dia, escute os seus chamamentos a
    partir dos trilhos sem bater nos troncos, usar chamarizes nem se aproximar de buracos de criação.
