id: dendrocopos_leucotos
nombre_cientifico: Dendrocopos leucotos
nombre:
  es: Pico dorsiblanco
  en: White-backed woodpecker
  fr: Pic à dos blanc
  de: Weißrückenspecht
  it: Picchio dorsobianco
  pt: Pica-pau-de-dorso-branco
descripcion:
  es: >-
    Pájaro carpintero de bosques maduros con abundante madera muerta, distribuido de forma fragmentada por
    Europa. La IUCN la clasifica globalmente como preocupación menor (LC). Durante el día, busca actividad en
    troncos desde senderos sin usar reclamos ni acercarte a cavidades de cría.
  en: >-
    Woodpecker of mature forests with abundant dead wood, distributed patchily across Europe. The IUCN
    classifies it globally as Least Concern (LC). During the day, look for activity on trunks from trails
    without using playback or approaching nest cavities.
  fr: >-
    Pic des forêts matures riches en bois mort, réparti de manière fragmentée en Europe. L'UICN le classe
    globalement en préoccupation mineure (LC). De jour, recherchez son activité sur les troncs depuis les
    sentiers sans utiliser d'appeaux ni vous approcher des loges de nidification.
  de: >-
    Specht reifer Wälder mit viel Totholz, der in Europa lückenhaft verbreitet ist. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Suchen Sie tagsüber von Wegen aus nach Aktivitäten an Stämmen, ohne
    Klangattrappen zu nutzen oder sich Bruthöhlen zu nähern.
  it: >-
    Picchio di foreste mature ricche di legno morto, distribuito in modo frammentato in Europa. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Durante il giorno, cerca segni di attività sui
    tronchi dai sentieri senza usare richiami né avvicinarti alle cavità di nidificazione.
  pt: >-
    Pica-pau de florestas maduras com abundante madeira morta, distribuído de forma fragmentada pela Europa. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Durante o dia, procure atividade nos troncos a
    partir dos trilhos sem usar chamarizes nem se aproximar de cavidades de criação.
