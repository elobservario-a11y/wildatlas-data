id: abies_pinsapo
nombre_cientifico: Abies pinsapo
nombre:
  es: Pinsapo
  en: Spanish fir
  de: Spanische Tanne
descripcion:
  es: >-
    Abeto mediterráneo de montañas del sur de España y norte de Marruecos, que forma bosques de distribución
    limitada. La IUCN la clasifica globalmente como en peligro (EN). Durante recorridos diurnos, observa su
    porte y follaje desde senderos señalizados sin recoger ramas, piñas ni semillas.
  en: >-
    Mediterranean fir of the mountains of southern Spain and northern Morocco, forming forests with a
    restricted distribution. The IUCN classifies it globally as Endangered (EN). During daytime walks, observe
    its form and foliage from marked trails without collecting branches, cones or seeds.
  de: >-
    Mediterrane Tanne der Gebirge Südspaniens und Nordmarokkos, die Wälder mit begrenzter Verbreitung bildet.
    Die IUCN stuft sie weltweit als stark gefährdet (EN) ein. Beobachten Sie bei Tageswanderungen ihren Wuchs
    und ihre Nadeln von markierten Wegen aus, ohne Äste, Zapfen oder Samen zu sammeln.
