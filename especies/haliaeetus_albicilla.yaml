id: haliaeetus_albicilla
nombre_cientifico: Haliaeetus albicilla
nombre:
  es: Águila pigargo
  en: White-tailed eagle
  fr: Pygargue à queue blanche
  de: Seeadler
  it: Aquila di mare
  pt: Águia-rabalva
descripcion:
  es: >-
    Gran rapaz ligada a costas, lagos y humedales del norte, centro y este de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). De día, revisa aguas abiertas y posaderos lejanos con
    telescopio, sin acercarte a nidos ni aves descansando.
  en: >-
    Large raptor linked to coasts, lakes and wetlands across northern, central and eastern Europe. The IUCN
    classifies it globally as Least Concern (LC). During the day, scan open waters and distant perches with a
    scope, without approaching nests or resting birds.
  fr: >-
    Grand rapace lié aux côtes, lacs et zones humides du nord, du centre et de l'est de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). De jour, scrutez les eaux libres et perchoirs éloignés à
    la longue-vue, sans vous approcher des nids ni des oiseaux au repos.
  de: >-
    Großer Greifvogel, der an Küsten, Seen und Feuchtgebiete Nord-, Mittel- und Osteuropas gebunden ist. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Suchen Sie tagsüber offene Gewässer und entfernte
    Sitzwarten mit dem Spektiv ab, ohne sich Nestern oder ruhenden Vögeln zu nähern.
  it: >-
    Grande rapace legato a coste, laghi e zone umide dell'Europa settentrionale, centrale e orientale. La IUCN
    lo classifica a livello globale come a rischio minimo (LC). Di giorno, controlla le acque aperte e i
    posatoi lontani con il cannocchiale, senza avvicinarti ai nidi né agli uccelli a riposo.
  pt: >-
    Grande ave de rapina ligada a costas, lagos e zonas húmidas do norte, centro e leste da Europa. A IUCN
    classifica-a globalmente como pouco preocupante (LC). De dia, observe águas abertas e poleiros distantes
    com telescópio, sem se aproximar de ninhos nem de aves em descanso.
