id: falco_rusticolus
nombre_cientifico: Falco rusticolus
nombre:
  es: Halcón gerifalte
  en: Gyrfalcon
  fr: Faucon gerfaut
  de: Gerfalke
  it: Girifalco
  pt: Falcão-gerifalte
descripcion:
  es: >-
    Gran halcón de tundras y costas árticas, presente en Islandia y regiones septentrionales europeas. La IUCN
    la clasifica globalmente como preocupación menor (LC). Obsérvalo en vuelo diurno con telescopio desde
    miradores, sin buscar nidos ni acercarte a paredes de cría.
  en: >-
    Large falcon of Arctic tundras and coasts, present in Iceland and northernmost European regions. The IUCN
    classifies it globally as Least Concern (LC). Watch it in daytime flight with a scope from viewpoints,
    without searching for nests or approaching nesting cliffs.
  fr: >-
    Grand faucon des toundras et côtes arctiques, présent en Islande et dans les régions septentrionales
    d'Europe. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le en vol diurne à la
    longue-vue depuis les belvédères, sans chercher de nids ni vous approcher des parois de nidification.
  de: >-
    Großer Falke arktischer Tundren und Küsten, der in Island und nördlichen Regionen Europas vorkommt. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn tagsüber im Flug mit dem Spektiv
    von Aussichtspunkten aus, ohne nach Nestern zu suchen oder sich Brutwänden zu nähern.
  it: >-
    Grande falco delle tundre e coste artiche, presente in Islanda e nelle regioni settentrionali europee. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Osservalo in volo diurno con il
    cannocchiale dai punti panoramici, senza cercare nidi né avvicinarti alle pareti di nidificazione.
  pt: >-
    Grande falcão de tundras e costas árticas, presente na Islândia e em regiões setentrionais europeias. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Observe-o em voo diurno com telescópio a partir
    de miradouros, sem procurar ninhos nem se aproximar de paredes de criação.
