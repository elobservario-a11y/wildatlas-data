id: rangifer_tarandus
nombre_cientifico: Rangifer tarandus
nombre:
  es: Reno
  en: Caribou
  fr: Renne
  de: Ren
  it: Renna / caribù
  pt: Rena
descripcion:
  es: >-
    Cérvido de tundras, montañas y bosques boreales del norte de Europa, con poblaciones silvestres y
    semidomésticas. La IUCN la clasifica globalmente como vulnerable (VU). Observa los rebaños cuando pasten
    en espacios abiertos, sin cortar sus desplazamientos ni aproximarte a las crías.
  en: >-
    Deer of tundras, mountains and boreal forests of northern Europe, with wild and semi-domesticated
    populations. The IUCN classifies it globally as Vulnerable (VU). Watch herds grazing in open country,
    without cutting across their movements or approaching calves.
  fr: >-
    Cervidé des toundras, montagnes et forêts boréales du nord de l'Europe, avec des populations sauvages et
    semi-domestiques. L'UICN le classe globalement comme vulnérable (VU). Observez les troupeaux lorsqu'ils
    pâturent en terrain ouvert, sans couper leurs déplacements ni vous approcher des jeunes.
  de: >-
    Hirsch der Tundren, Gebirge und borealen Wälder Nordeuropas mit wildlebenden und halbdomestizierten
    Beständen. Die IUCN stuft es weltweit als gefährdet (VU) ein. Beobachten Sie Herden beim Äsen in offenem
    Gelände, ohne ihre Wanderwege zu kreuzen oder sich Kälbern zu nähern.
  it: >-
    Cervide di tundre, montagne e foreste boreali del nord Europa, con popolazioni selvatiche e
    semidomestiche. La IUCN la classifica a livello globale come vulnerabile (VU). Osserva i branchi mentre
    pascolano in spazi aperti, senza tagliare i loro spostamenti né avvicinarti ai piccoli.
  pt: >-
    Cervídeo de tundras, montanhas e florestas boreais do norte da Europa, com populações selvagens e
    semidomésticas. A IUCN classifica-a globalmente como vulnerável (VU). Observe as manadas quando pastam em
    espaços abertos, sem cortar as suas deslocações nem se aproximar das crias.
