id: rupicapra_pyrenaica
nombre_cientifico: Rupicapra pyrenaica
nombre:
  es: Rebeco pirenaico
  en: Pyrenean chamois
  fr: Isard
  de: Pyrenäen-Gämse
  pt: Camurça-dos-pirineus
alias:
  - Sarrio
  - Rebeco de los Apeninos
  - Rebeco cantábrico
descripcion:
  es: >-
    Ungulado de praderas y roquedos de los Pirineos, la cordillera Cantábrica y los Apeninos. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvalo cuando paste en laderas abiertas con
    prismáticos desde senderos, sin perseguirlo ni cortar sus desplazamientos.
  en: >-
    Ungulate of meadows and crags of the Pyrenees, the Cantabrian Mountains and the Apennines. The IUCN
    classifies it globally as Least Concern (LC). Watch it grazing on open slopes with binoculars from trails,
    without chasing it or cutting across its movements.
  fr: >-
    Ongulé des pelouses et rochers des Pyrénées, de la cordillère Cantabrique et des Apennins. L'UICN le
    classe globalement en préoccupation mineure (LC). Observez-le pâturer sur les versants ouverts aux
    jumelles depuis les sentiers, sans le poursuivre ni couper ses déplacements.
  de: >-
    Huftier der Matten und Felsen der Pyrenäen, des Kantabrischen Gebirges und des Apennins. Die IUCN stuft
    sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie sie beim Äsen an offenen Hängen mit dem Fernglas
    von Wegen aus, ohne sie zu verfolgen oder ihre Wechsel zu kreuzen.
  pt: >-
    Ungulado de prados e rochedos dos Pirenéus, da cordilheira Cantábrica e dos Apeninos. A IUCN classifica-a
    globalmente como pouco preocupante (LC). Observe-a quando pasta em encostas abertas com binóculos a partir
    dos trilhos, sem a perseguir nem cortar as suas deslocações.
