id: chlamydotis_undulata
nombre_cientifico: Chlamydotis undulata
nombre:
  es: Hubara
  en: Houbara bustard
  fr: Outarde houbara
  de: Kragentrappe
  it: Ubara africana
  pt: Hubara
descripcion:
  es: >-
    Avutarda de ambientes áridos norteafricanos con una población insular en Canarias. La IUCN la clasifica
    globalmente como vulnerable (VU). Obsérvala mientras recorra llanuras abiertas desde caminos autorizados,
    sin perseguirla ni acercarte a exhibiciones de cortejo.
  en: >-
    Bustard of arid North African habitats with an island population in the Canary Islands. The IUCN
    classifies it globally as Vulnerable (VU). Watch it walking across open plains from authorised tracks,
    without chasing it or approaching courtship displays.
  fr: >-
    Outarde des milieux arides d'Afrique du Nord, avec une population insulaire aux Canaries. L'UICN la classe
    globalement comme vulnérable (VU). Observez-la parcourir les plaines ouvertes depuis les chemins
    autorisés, sans la poursuivre ni vous approcher des parades nuptiales.
  de: >-
    Trappe trockener nordafrikanischer Lebensräume mit einer Inselpopulation auf den Kanaren. Die IUCN stuft
    sie weltweit als gefährdet (VU) ein. Beobachten Sie sie von zugelassenen Wegen aus auf offenen Ebenen,
    ohne sie zu verfolgen oder sich Balzplätzen zu nähern.
  it: >-
    Otarda degli ambienti aridi nordafricani con una popolazione insulare alle Canarie. La IUCN la classifica
    a livello globale come vulnerabile (VU). Osservala mentre percorre le pianure aperte dai sentieri
    autorizzati, senza inseguirla né avvicinarti alle parate di corteggiamento.
  pt: >-
    Abetarda de ambientes áridos norte-africanos com uma população insular nas Canárias. A IUCN classifica-a
    globalmente como vulnerável (VU). Observe-a enquanto percorre planícies abertas a partir de caminhos
    autorizados, sem a perseguir nem se aproximar de exibições de cortejo.
