id: pterodroma_madeira
nombre_cientifico: Pterodroma madeira
nombre:
  es: Petrel de Madeira
  en: Zino's petrel
  fr: Pétrel de Madère
  de: Madeira-Sturmvogel
  it: Petrello di Madera
  pt: Freira-da-madeira
descripcion:
  es: >-
    Ave pelágica que cría en las montañas de Madeira y frecuenta sus aguas durante la temporada reproductora.
    La IUCN la clasifica globalmente como en peligro (EN). En esa temporada, prioriza salidas marítimas
    responsables sin perseguir aves ni acercarte a zonas de cría.
  en: >-
    Pelagic bird breeding in the mountains of Madeira and frequenting its waters during the breeding season.
    The IUCN classifies it globally as Endangered (EN). In that season, favour responsible boat trips without
    chasing birds or approaching breeding areas.
  fr: >-
    Oiseau pélagique qui niche dans les montagnes de Madère et fréquente ses eaux pendant la saison de
    reproduction. L'UICN le classe globalement en danger (EN). En cette saison, privilégiez les sorties en mer
    responsables sans poursuivre les oiseaux ni vous approcher des zones de nidification.
  de: >-
    Hochseevogel, der in den Bergen Madeiras brütet und während der Brutzeit die umliegenden Gewässer
    aufsucht. Die IUCN stuft ihn weltweit als stark gefährdet (EN) ein. Bevorzugen Sie in dieser Zeit
    verantwortungsvolle Bootsfahrten, ohne Vögel zu verfolgen oder sich Brutgebieten zu nähern.
  it: >-
    Uccello pelagico che nidifica sulle montagne di Madera e frequenta le sue acque durante la stagione
    riproduttiva. La IUCN lo classifica a livello globale come in pericolo (EN). In quella stagione, prediligi
    uscite in mare responsabili senza inseguire gli uccelli né avvicinarti alle aree di nidificazione.
  pt: >-
    Ave pelágica que nidifica nas montanhas da Madeira e frequenta as suas águas durante a época reprodutora.
    A IUCN classifica-a globalmente como em perigo (EN). Nessa época, dê preferência a saídas marítimas
    responsáveis sem perseguir aves nem se aproximar de zonas de criação.
