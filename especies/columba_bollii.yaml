id: columba_bollii
nombre_cientifico: Columba bollii
nombre:
  es: Paloma turqué
  en: Bolle's pigeon
  fr: Pigeon de Bolle
  de: Bolles Lorbeertaube
  it: Colomba di Bolle
  pt: Pombo-turqueza
descripcion:
  es: >-
    Paloma endémica de Canarias ligada a la laurisilva y a otros bosques húmedos montanos. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante recorridos diurnos, observa copas y vuelos
    desde senderos sin usar reclamos ni acercarte a nidos.
  en: >-
    Pigeon endemic to the Canary Islands, linked to laurel forest and other humid montane forests. The IUCN
    classifies it globally as Least Concern (LC). During daytime walks, watch the canopy and flights from
    trails without using playback or approaching nests.
  fr: >-
    Pigeon endémique des Canaries lié à la laurisylve et à d'autres forêts humides de montagne. L'UICN le
    classe globalement en préoccupation mineure (LC). Lors de balades diurnes, observez la canopée et les vols
    depuis les sentiers sans utiliser d'appeaux ni vous approcher des nids.
  de: >-
    Auf den Kanaren endemische Taube, die an Lorbeerwälder und andere feuchte Bergwälder gebunden ist. Die
    IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie bei Tageswanderungen die Baumkronen
    und Flüge von Wegen aus, ohne Klangattrappen zu nutzen oder sich Nestern zu nähern.
  it: >-
    Colombo endemico delle Canarie legato alla laurisilva e ad altre foreste umide montane. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Durante le escursioni diurne, osserva le chiome e
    i voli dai sentieri senza usare richiami né avvicinarti ai nidi.
  pt: >-
    Pombo endémico das Canárias ligado à laurissilva e a outras florestas húmidas de montanha. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Durante percursos diurnos, observe as copas e os
    voos a partir dos trilhos sem usar chamarizes nem se aproximar de ninhos.
