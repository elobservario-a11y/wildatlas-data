id: tilia_tomentosa
nombre_cientifico: Tilia tomentosa
nombre:
  es: Tilo plateado
  en: Silver lime
  fr: Tilleul argenté
  de: Silber-Linde
descripcion:
  es: >-
    Árbol caducifolio de bosques del sureste de Europa y regiones próximas, reconocible por el envés plateado
    de sus hojas. GBIF recoge la categoría global IUCN de preocupación menor (LC). En verano pueden apreciarse
    hojas y flores desde caminos sin arrancar ramas ni recoger flores.
  en: >-
    Deciduous tree of forests in south-eastern Europe and nearby regions, recognisable by the silvery
    underside of its leaves. GBIF records the global IUCN category of Least Concern (LC). In summer, leaves
    and flowers can be admired from tracks without breaking branches or picking blossoms.
  fr: >-
    Arbre caducifolié des forêts du sud-est de l'Europe et régions voisines, reconnaissable au revers argenté
    de ses feuilles. Le GBIF indique la catégorie mondiale UICN de préoccupation mineure (LC). En été,
    feuilles et fleurs peuvent être observées depuis les chemins sans casser de branches ni cueillir de
    fleurs.
  de: >-
    Laubbaum von Wäldern Südosteuropas und angrenzender Regionen, erkennbar an der silbrigen Blattunterseite.
    GBIF führt die globale IUCN-Kategorie nicht gefährdet (LC). Im Sommer lassen sich Blätter und Blüten von
    Wegen aus betrachten, ohne Zweige abzubrechen oder Blüten zu pflücken.
