id: egretta_alba
nombre_cientifico: Egretta alba
nombre:
  es: Garceta grande
descripcion:
  es: >-
    Gran garza blanca de marismas, lagos y otros humedales, presente en distintas regiones de Europa. La IUCN
    la clasifica globalmente como preocupación menor (LC). Obsérvala de día cuando pesque en aguas someras
    desde observatorios, sin acercarte a colonias ni hacerla levantar.
