id: picoides_tridactylus
nombre_cientifico: Picoides tridactylus
nombre:
  es: Pico tridáctilo
  en: Three-toed woodpecker
  fr: Pic tridactyle
  de: Dreizehenspecht
  it: Picchio tridattilo
  pt: Pica-pau-tridáctilo
descripcion:
  es: >-
    Pájaro carpintero de bosques de coníferas del norte europeo, también presente en los Alpes y Cárpatos. La
    IUCN la clasifica globalmente como preocupación menor (LC). Durante el día, observa troncos desde senderos
    en silencio, sin usar reclamos ni acercarte a cavidades ocupadas.
  en: >-
    Woodpecker of conifer forests in northern Europe, also present in the Alps and Carpathians. The IUCN
    classifies it globally as Least Concern (LC). During the day, watch trunks quietly from trails, without
    using playback or approaching occupied cavities.
  fr: >-
    Pic des forêts de conifères du nord de l'Europe, également présent dans les Alpes et les Carpates. L'UICN
    le classe globalement en préoccupation mineure (LC). De jour, observez les troncs en silence depuis les
    sentiers, sans utiliser d'appeaux ni vous approcher des cavités occupées.
  de: >-
    Specht der Nadelwälder Nordeuropas, der auch in den Alpen und Karpaten vorkommt. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber Stämme ruhig von Wegen aus, ohne
    Klangattrappen zu nutzen oder sich besetzten Höhlen zu nähern.
  it: >-
    Picchio delle foreste di conifere del nord Europa, presente anche nelle Alpi e nei Carpazi. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Durante il giorno, osserva i tronchi in silenzio
    dai sentieri, senza usare richiami né avvicinarti alle cavità occupate.
  pt: >-
    Pica-pau de florestas de coníferas do norte europeu, também presente nos Alpes e Cárpatos. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Durante o dia, observe os troncos em silêncio a
    partir dos trilhos, sem usar chamarizes nem se aproximar de cavidades ocupadas.
