id: delphinus_delphis
nombre_cientifico: Delphinus delphis
nombre:
  es: Delfín común
  en: Short-beaked common dolphin
  fr: Dauphin commun à bec court
  de: Gemeiner Delfin
  it: Delfino comune
  pt: Golfinho-comum-de-bico-curto
descripcion:
  es: >-
    Cetáceo social de aguas templadas, presente en el Atlántico europeo y el Mediterráneo. La IUCN la
    clasifica globalmente como preocupación menor (LC). Cuando los grupos afloren, obsérvalos desde costa o
    con operadores responsables sin perseguirlos ni interceptar su trayectoria.
  en: >-
    Social cetacean of temperate waters, present in the European Atlantic and the Mediterranean. The IUCN
    classifies it globally as Least Concern (LC). When pods surface, watch from shore or with responsible
    operators without chasing them or cutting across their path.
  fr: >-
    Cétacé social des eaux tempérées, présent dans l'Atlantique européen et en Méditerranée. L'UICN le classe
    globalement en préoccupation mineure (LC). Lorsque les groupes font surface, observez-les depuis la côte
    ou avec des opérateurs responsables sans les poursuivre ni couper leur trajectoire.
  de: >-
    Sozial lebender Wal gemäßigter Gewässer, der im europäischen Atlantik und im Mittelmeer vorkommt. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Wenn Gruppen auftauchen, beobachten Sie sie von der Küste
    oder mit verantwortungsvollen Anbietern aus, ohne sie zu verfolgen oder ihren Kurs zu kreuzen.
  it: >-
    Cetaceo sociale delle acque temperate, presente nell'Atlantico europeo e nel Mediterraneo. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Quando i gruppi affiorano, osservali dalla costa
    o con operatori responsabili senza inseguirli né tagliarne la traiettoria.
  pt: >-
    Cetáceo social de águas temperadas, presente no Atlântico europeu e no Mediterrâneo. A IUCN classifica-o
    globalmente como pouco preocupante (LC). Quando os grupos vierem à superfície, observe-os a partir da
    costa ou com operadores responsáveis sem os perseguir nem intercetar a sua trajetória.
