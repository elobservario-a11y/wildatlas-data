id: picoides_medius
nombre_cientifico: Picoides medius
nombre:
  es: Pico mediano
descripcion:
  es: >-
    Pájaro carpintero de bosques de frondosas europeos, citado actualmente como Dendrocoptes medius. La IUCN
    la clasifica globalmente como preocupación menor (LC). Durante recorridos diurnos, observa troncos y ramas
    desde senderos sin reproducir cantos ni acercarte a cavidades.
