id: juniperus_brevifolia
nombre_cientifico: Juniperus brevifolia
nombre:
  es: Cedro de las Azores
  en: Azores juniper
  de: Kurzblättriger Wacholder
descripcion:
  es: >-
    Conífera endémica de las Azores, asociada a bosques y otros ambientes naturales del archipiélago. La IUCN
    la clasifica globalmente como vulnerable (VU). Su follaje perenne puede observarse durante todo el año
    desde senderos sin arrancar ramas ni recoger frutos.
  en: >-
    Conifer endemic to the Azores, associated with forests and other natural habitats of the archipelago. The
    IUCN classifies it globally as Vulnerable (VU). Its evergreen foliage can be seen year-round from trails
    without breaking branches or picking berries.
  de: >-
    Auf den Azoren endemisches Nadelgehölz, das an Wälder und andere natürliche Lebensräume des Archipels
    gebunden ist. Die IUCN stuft es weltweit als gefährdet (VU) ein. Sein immergrünes Laub lässt sich
    ganzjährig von Wegen aus betrachten, ohne Zweige abzubrechen oder Früchte zu sammeln.
