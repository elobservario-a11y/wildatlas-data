id: falco_vespertinus
nombre_cientifico: Falco vespertinus
nombre:
  es: Cernícalo patirrojo
  en: Red-footed falcon
  fr: Faucon kobez
  de: Rotfußfalke
  it: Falco cuculo
  pt: Falcão-de-pés-vermelhos
descripcion:
  es: >-
    Pequeño halcón migratorio de paisajes abiertos del centro y este europeo, que inverna en África. La IUCN
    la clasifica globalmente como vulnerable (VU). Durante su estancia estival o el paso, obsérvalo cazando en
    vuelo desde caminos sin acercarte a colonias.
  en: >-
    Small migratory falcon of open landscapes in central and eastern Europe, wintering in Africa. The IUCN
    classifies it globally as Vulnerable (VU). During its summer stay or passage, watch it hunting on the wing
    from tracks without approaching colonies.
  fr: >-
    Petit faucon migrateur des paysages ouverts d'Europe centrale et orientale, qui hiverne en Afrique. L'UICN
    le classe globalement comme vulnérable (VU). Pendant son séjour estival ou le passage, observez-le chasser
    en vol depuis les chemins sans vous approcher des colonies.
  de: >-
    Kleiner Zugfalke offener Landschaften Mittel- und Osteuropas, der in Afrika überwintert. Die IUCN stuft
    ihn weltweit als gefährdet (VU) ein. Beobachten Sie ihn während seines Sommeraufenthalts oder auf dem Zug
    von Wegen aus bei der Flugjagd, ohne sich Kolonien zu nähern.
  it: >-
    Piccolo falco migratore di paesaggi aperti dell'Europa centrale e orientale, che sverna in Africa. La IUCN
    lo classifica a livello globale come vulnerabile (VU). Durante la permanenza estiva o il passo, osservalo
    cacciare in volo dai sentieri senza avvicinarti alle colonie.
  pt: >-
    Pequeno falcão migratório de paisagens abertas do centro e leste europeu, que passa o inverno em África. A
    IUCN classifica-o globalmente como vulnerável (VU). Durante a sua estadia estival ou passagem, observe-o a
    caçar em voo a partir dos caminhos sem se aproximar de colónias.
