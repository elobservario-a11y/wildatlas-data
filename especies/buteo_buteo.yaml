id: buteo_buteo
nombre_cientifico: Buteo buteo
nombre:
  es: Busardo ratonero
  en: Common buzzard
  fr: Buse variable
  de: Mäusebussard
  it: Poiana
  pt: Águia-de-asa-redonda
descripcion:
  es: >-
    Rapaz de bosques, lindes y campos abiertos, ampliamente distribuida por Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). De día, observa sus planeos y posaderos desde caminos sin
    acercarte a nidos ni ofrecer alimento.
  en: >-
    Raptor of woods, forest edges and open fields, widely distributed across Europe. The IUCN classifies it
    globally as Least Concern (LC). During the day, watch its soaring flights and perches from tracks without
    approaching nests or offering food.
  fr: >-
    Rapace des bois, lisières et champs ouverts, largement répandu en Europe. L'UICN le classe globalement en
    préoccupation mineure (LC). De jour, observez ses vols planés et perchoirs depuis les chemins sans vous
    approcher des nids ni donner de nourriture.
  de: >-
    Greifvogel von Wäldern, Waldrändern und offenen Feldern, der in Europa weit verbreitet ist. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber seine Segelflüge und Sitzwarten von
    Wegen aus, ohne sich Nestern zu nähern oder Futter anzubieten.
  it: >-
    Rapace di boschi, margini forestali e campi aperti, ampiamente distribuito in Europa. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Di giorno, osserva i suoi voli planati e posatoi
    dai sentieri senza avvicinarti ai nidi né offrire cibo.
  pt: >-
    Ave de rapina de florestas, orlas e campos abertos, amplamente distribuída pela Europa. A IUCN
    classifica-a globalmente como pouco preocupante (LC). De dia, observe os seus voos planados e poleiros a
    partir dos caminhos sem se aproximar de ninhos nem oferecer alimento.
