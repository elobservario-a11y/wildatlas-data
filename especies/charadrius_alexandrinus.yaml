id: charadrius_alexandrinus
nombre_cientifico: Charadrius alexandrinus
nombre:
  es: Chorlitejo patinegro
  en: Kentish plover
  fr: Pluvier à collier interrompu
  de: Seeregenpfeifer
  it: Fratino
  pt: Borrelho-de-coleira-interrompida
descripcion:
  es: >-
    Pequeña limícola de playas, salinas y orillas abiertas de humedales, presente en distintas regiones
    europeas. La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvala de día desde fuera de
    las zonas delimitadas, sin acercarte a nidos ni seguir a los pollos.
  en: >-
    Small wader of beaches, saltpans and open wetland shores, present in several European regions. The IUCN
    classifies it globally as Least Concern (LC). Watch it during the day from outside cordoned areas, without
    approaching nests or following chicks.
  fr: >-
    Petit limicole des plages, salines et rives ouvertes de zones humides, présent dans différentes régions
    européennes. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le de jour depuis
    l'extérieur des zones balisées, sans vous approcher des nids ni suivre les poussins.
  de: >-
    Kleiner Watvogel von Stränden, Salinen und offenen Ufern von Feuchtgebieten, der in verschiedenen
    europäischen Regionen vorkommt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie
    ihn tagsüber von außerhalb abgesperrter Bereiche, ohne sich Nestern zu nähern oder Küken zu verfolgen.
  it: >-
    Piccolo limicolo di spiagge, saline e rive aperte di zone umide, presente in diverse regioni europee. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Osservalo di giorno dall'esterno delle
    aree delimitate, senza avvicinarti ai nidi né seguire i pulcini.
  pt: >-
    Pequena limícola de praias, salinas e margens abertas de zonas húmidas, presente em várias regiões
    europeias. A IUCN classifica-a globalmente como pouco preocupante (LC). Observe-a de dia a partir do
    exterior das zonas delimitadas, sem se aproximar de ninhos nem seguir as crias.
