id: phoenicopterus_roseus
nombre_cientifico: Phoenicopterus roseus
nombre:
  es: Flamenco común
  en: Greater flamingo
  fr: Flamant rose
  de: Rosaflamingo
  it: Fenicottero
  pt: Flamingo-comum
descripcion:
  es: >-
    Ave gregaria de lagunas someras y salinas, característica de humedales mediterráneos del sur de Europa. La
    IUCN la clasifica globalmente como preocupación menor (LC). Obsérvala cuando se alimente en aguas abiertas
    desde observatorios, sin entrar en las lagunas ni acercarte a colonias.
  en: >-
    Gregarious bird of shallow lagoons and saltpans, characteristic of Mediterranean wetlands in southern
    Europe. The IUCN classifies it globally as Least Concern (LC). Watch it feeding in open water from hides,
    without entering lagoons or approaching colonies.
  fr: >-
    Oiseau grégaire des lagunes peu profondes et salines, caractéristique des zones humides méditerranéennes
    du sud de l'Europe. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le s'alimenter en
    eau libre depuis les observatoires, sans entrer dans les lagunes ni vous approcher des colonies.
  de: >-
    Geselliger Vogel flacher Lagunen und Salinen, charakteristisch für mediterrane Feuchtgebiete Südeuropas.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn bei der Nahrungssuche im
    offenen Wasser von Beobachtungshütten aus, ohne Lagunen zu betreten oder sich Kolonien zu nähern.
  it: >-
    Uccello gregario di lagune basse e saline, caratteristico delle zone umide mediterranee dell'Europa
    meridionale. La IUCN lo classifica a livello globale come a rischio minimo (LC). Osservalo mentre si nutre
    in acque aperte dagli appostamenti, senza entrare nelle lagune né avvicinarti alle colonie.
  pt: >-
    Ave gregária de lagoas rasas e salinas, característica de zonas húmidas mediterrânicas do sul da Europa. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Observe-o quando se alimenta em águas abertas a
    partir de observatórios, sem entrar nas lagoas nem se aproximar de colónias.
