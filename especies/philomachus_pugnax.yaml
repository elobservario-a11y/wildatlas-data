id: philomachus_pugnax
nombre_cientifico: Philomachus pugnax
nombre:
  es: Combatiente
  en: Ruff
  fr: Combattant varié
  de: Kampfläufer
  it: Combattente
  pt: Combatente
descripcion:
  es: >-
    Limícola migratoria que cría en marismas y prados húmedos del norte europeo y utiliza humedales durante
    sus desplazamientos. La IUCN la clasifica globalmente como preocupación menor (LC). Durante el paso
    migratorio, observa bandos desde observatorios sin entrar en áreas de cortejo ni hacerlos levantar.
  en: >-
    Migratory wader breeding in marshes and damp meadows of northern Europe and using wetlands during its
    movements. The IUCN classifies it globally as Least Concern (LC). During migration, watch flocks from
    hides without entering lekking areas or flushing them.
  fr: >-
    Limicole migrateur qui niche dans les marais et prairies humides du nord de l'Europe et fréquente les
    zones humides lors de ses déplacements. L'UICN le classe globalement en préoccupation mineure (LC). Lors
    du passage migratoire, observez les groupes depuis les observatoires sans entrer dans les aires de parade
    ni les faire décoller.
  de: >-
    Ziehender Watvogel, der in Sümpfen und Feuchtwiesen Nordeuropas brütet und auf seinen Zügen Feuchtgebiete
    nutzt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps auf dem Zug von
    Beobachtungshütten aus, ohne Balzplätze zu betreten oder sie aufzuscheuchen.
  it: >-
    Limicolo migratore che nidifica in paludi e prati umidi del nord Europa e frequenta le zone umide durante
    gli spostamenti. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante il passo
    migratorio, osserva gli stormi dagli appostamenti senza entrare nelle aree di parata né farli involare.
  pt: >-
    Limícola migratória que nidifica em sapais e prados húmidos do norte europeu e utiliza zonas húmidas
    durante as suas deslocações. A IUCN classifica-a globalmente como pouco preocupante (LC). Durante a
    passagem migratória, observe os bandos a partir de observatórios sem entrar em áreas de cortejo nem os
    fazer levantar voo.
