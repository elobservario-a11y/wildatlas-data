id: fulmarus_glacialis
nombre_cientifico: Fulmarus glacialis
nombre:
  es: Fulmar boreal
  en: Northern fulmar
  fr: Fulmar boréal
  de: Eissturmvogel
  it: Fulmaro
  pt: Fulmar-glacial
descripcion:
  es: >-
    Ave marina planeadora de aguas frías que cría en acantilados e islas del Atlántico norte europeo. La IUCN
    la clasifica globalmente como preocupación menor (LC). Durante la temporada reproductora, observa desde
    miradores distantes sin acercarte a repisas ni acceder a colonias.
  en: >-
    Gliding seabird of cold waters breeding on cliffs and islands of the European North Atlantic. The IUCN
    classifies it globally as Least Concern (LC). During the breeding season, watch from distant viewpoints
    without approaching ledges or entering colonies.
  fr: >-
    Oiseau marin planeur des eaux froides qui niche sur les falaises et îles de l'Atlantique Nord européen.
    L'UICN le classe globalement en préoccupation mineure (LC). Pendant la saison de reproduction, observez
    depuis des belvédères éloignés sans vous approcher des corniches ni entrer dans les colonies.
  de: >-
    Gleitender Seevogel kalter Gewässer, der an Klippen und auf Inseln des europäischen Nordatlantiks brütet.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie während der Brutzeit von
    entfernten Aussichtspunkten aus, ohne sich Felsbändern zu nähern oder Kolonien zu betreten.
  it: >-
    Uccello marino veleggiatore delle acque fredde che nidifica su scogliere e isole dell'Atlantico
    settentrionale europeo. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante la
    stagione riproduttiva, osserva da punti panoramici distanti senza avvicinarti alle cenge né accedere alle
    colonie.
  pt: >-
    Ave marinha planadora de águas frias que nidifica em falésias e ilhas do Atlântico Norte europeu. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Durante a época reprodutora, observe a partir de
    miradouros distantes sem se aproximar de cornijas nem entrar em colónias.
