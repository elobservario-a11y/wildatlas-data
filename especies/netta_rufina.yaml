id: netta_rufina
nombre_cientifico: Netta rufina
nombre:
  es: Pato colorado
  en: Red-crested pochard
  fr: Nette rousse
  de: Kolbenente
  it: Fistione turco
  pt: Pato-de-bico-vermelho
descripcion:
  es: >-
    Pato buceador de lagos y marismas del sur europeo, con poblaciones residentes y migratorias. La IUCN la
    clasifica globalmente como preocupación menor (LC). En invierno, observa los bandos desde miradores sin
    acercarte a dormideros ni ofrecer alimento.
  en: >-
    Diving duck of lakes and marshes in southern Europe, with resident and migratory populations. The IUCN
    classifies it globally as Least Concern (LC). In winter, watch flocks from viewpoints without approaching
    roosts or offering food.
  fr: >-
    Canard plongeur des lacs et marais du sud de l'Europe, avec des populations sédentaires et migratrices.
    L'UICN le classe globalement en préoccupation mineure (LC). En hiver, observez les groupes depuis les
    belvédères sans vous approcher des dortoirs ni donner de nourriture.
  de: >-
    Tauchente von Seen und Sümpfen Südeuropas mit Stand- und Zugvogelpopulationen. Die IUCN stuft sie weltweit
    als nicht gefährdet (LC) ein. Beobachten Sie Trupps im Winter von Aussichtspunkten aus, ohne sich
    Schlafplätzen zu nähern oder Futter anzubieten.
  it: >-
    Anatra tuffatrice di laghi e paludi dell'Europa meridionale, con popolazioni stanziali e migratrici. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). In inverno, osserva gli stormi dai punti
    panoramici senza avvicinarti ai dormitori né offrire cibo.
  pt: >-
    Pato mergulhador de lagos e sapais do sul europeu, com populações residentes e migratórias. A IUCN
    classifica-o globalmente como pouco preocupante (LC). No inverno, observe os bandos a partir de miradouros
    sem se aproximar de dormitórios nem oferecer alimento.
