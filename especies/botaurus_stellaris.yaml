id: botaurus_stellaris
nombre_cientifico: Botaurus stellaris
nombre:
  es: Avetoro común
  en: Eurasian bittern
  fr: Butor étoilé
  de: Rohrdommel
  it: Tarabuso
  pt: Abetouro-comum
descripcion:
  es: >-
    Garza discreta de carrizales extensos y humedales europeos, que suele permanecer oculta entre la
    vegetación. La IUCN la clasifica globalmente como preocupación menor (LC). Espera a que aparezca en un
    borde desde observatorios, sin penetrar en carrizales ni reproducir su canto.
  en: >-
    Secretive heron of extensive reedbeds and European wetlands, usually remaining hidden in vegetation. The
    IUCN classifies it globally as Least Concern (LC). Wait for it to appear at an edge from hides, without
    entering reedbeds or playing back its call.
  fr: >-
    Héron discret des vastes roselières et zones humides européennes, qui reste généralement caché dans la
    végétation. L'UICN le classe globalement en préoccupation mineure (LC). Attendez qu'il apparaisse en
    lisière depuis les observatoires, sans pénétrer dans les roselières ni diffuser son chant.
  de: >-
    Heimlicher Reiher ausgedehnter Schilfgebiete und europäischer Feuchtgebiete, der meist verborgen in der
    Vegetation bleibt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Warten Sie von
    Beobachtungshütten aus darauf, dass er am Rand erscheint, ohne Schilfflächen zu betreten oder seinen Ruf
    abzuspielen.
  it: >-
    Airone elusivo di vasti canneti e zone umide europee, che di solito rimane nascosto tra la vegetazione. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Attendi che compaia lungo un margine
    dagli appostamenti, senza penetrare nei canneti né riprodurne il canto.
  pt: >-
    Garça discreta de caniços extensos e zonas húmidas europeias, que costuma permanecer oculta entre a
    vegetação. A IUCN classifica-a globalmente como pouco preocupante (LC). Aguarde que apareça numa orla a
    partir de observatórios, sem entrar nos caniços nem reproduzir o seu canto.
