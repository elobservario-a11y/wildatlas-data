id: platalea_leucorodia
nombre_cientifico: Platalea leucorodia
nombre:
  es: Espátula común
  en: Eurasian spoonbill
  fr: Spatule blanche
  de: Löffler
  it: Spatola
  pt: Colhereiro-europeu
descripcion:
  es: >-
    Ave zancuda de humedales someros, distribuida de forma discontinua por Europa y reconocible por su pico
    aplanado. La IUCN la clasifica globalmente como preocupación menor (LC). Observa sus movimientos de
    alimentación desde observatorios, especialmente durante el paso migratorio, sin entrar en colonias ni
    levantar bandos.
  en: >-
    Wading bird of shallow wetlands, discontinuously distributed across Europe and recognisable by its
    flattened bill. The IUCN classifies it globally as Least Concern (LC). Watch its feeding movements from
    hides, especially during migration, without entering colonies or flushing flocks.
  fr: >-
    Échassier des zones humides peu profondes, réparti de manière discontinue en Europe et reconnaissable à
    son bec aplati. L'UICN la classe globalement en préoccupation mineure (LC). Observez ses déplacements de
    nourrissage depuis les observatoires, surtout lors du passage migratoire, sans entrer dans les colonies ni
    faire lever les groupes.
  de: >-
    Schreitvogel flacher Feuchtgebiete, in Europa lückenhaft verbreitet und an seinem abgeflachten Schnabel
    erkennbar. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie seine
    Nahrungsbewegungen von Beobachtungshütten aus, besonders zur Zugzeit, ohne Kolonien zu betreten oder
    Trupps aufzuscheuchen.
  it: >-
    Trampoliere delle zone umide basse, distribuito in modo discontinuo in Europa e riconoscibile per il becco
    appiattito. La IUCN la classifica a livello globale come a rischio minimo (LC). Osserva i suoi spostamenti
    di alimentazione dagli appostamenti, soprattutto durante il passo migratorio, senza entrare nelle colonie
    né far involare gli stormi.
  pt: >-
    Ave pernalta de zonas húmidas rasas, distribuída de forma descontínua pela Europa e reconhecível pelo bico
    achatado. A IUCN classifica-o globalmente como pouco preocupante (LC). Observe os seus movimentos de
    alimentação a partir de observatórios, especialmente durante a passagem migratória, sem entrar em colónias
    nem levantar bandos.
