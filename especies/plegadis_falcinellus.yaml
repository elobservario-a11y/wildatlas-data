id: plegadis_falcinellus
nombre_cientifico: Plegadis falcinellus
nombre:
  es: Morito común
  en: Glossy ibis
  fr: Ibis falcinelle
  de: Brauner Sichler
  it: Mignattaio
  pt: Íbis-preto
descripcion:
  es: >-
    Ibis de humedales someros y terrenos inundados, presente en regiones cálidas de Europa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante la alimentación diurna, observa los bandos
    desde caminos y observatorios sin entrar en colonias ni provocar vuelos.
  en: >-
    Ibis of shallow wetlands and flooded ground, present in warm regions of Europe. The IUCN classifies it
    globally as Least Concern (LC). During daytime feeding, watch flocks from tracks and hides without
    entering colonies or flushing birds.
  fr: >-
    Ibis des zones humides peu profondes et terrains inondés, présent dans les régions chaudes d'Europe.
    L'UICN le classe globalement en préoccupation mineure (LC). Pendant l'alimentation diurne, observez les
    groupes depuis les chemins et observatoires sans entrer dans les colonies ni provoquer d'envols.
  de: >-
    Ibis flacher Feuchtgebiete und überschwemmter Flächen, der in warmen Regionen Europas vorkommt. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps tagsüber bei der Nahrungssuche von
    Wegen und Beobachtungshütten aus, ohne Kolonien zu betreten oder Vögel aufzuscheuchen.
  it: >-
    Ibis di zone umide basse e terreni allagati, presente nelle regioni calde d'Europa. La IUCN lo classifica
    a livello globale come a rischio minimo (LC). Durante l'alimentazione diurna, osserva gli stormi da
    sentieri e appostamenti senza entrare nelle colonie né provocare involi.
  pt: >-
    Íbis de zonas húmidas rasas e terrenos alagados, presente em regiões quentes da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Durante a alimentação diurna, observe os bandos a
    partir de caminhos e observatórios sem entrar em colónias nem provocar levantamentos de voo.
