id: phalacrocorax_aristotelis
nombre_cientifico: Phalacrocorax aristotelis
nombre:
  es: Cormorán moñudo
  en: European shag
  fr: Cormoran huppé
  de: Krähenscharbe
  it: Marangone dal ciuffo
  pt: Corvo-marinho-de-crista
descripcion:
  es: >-
    Ave marina buceadora de costas rocosas de Europa occidental y meridional. La IUCN la clasifica globalmente
    como preocupación menor (LC). De día, observa pesca y descanso desde miradores costeros sin aproximarte en
    barco a colonias ni provocar vuelos.
  en: >-
    Diving seabird of rocky coasts in western and southern Europe. The IUCN classifies it globally as Least
    Concern (LC). During the day, watch fishing and resting from coastal viewpoints without approaching
    colonies by boat or flushing birds.
  fr: >-
    Oiseau marin plongeur des côtes rocheuses d'Europe occidentale et méridionale. L'UICN le classe
    globalement en préoccupation mineure (LC). De jour, observez pêche et repos depuis les belvédères côtiers
    sans vous approcher des colonies en bateau ni provoquer d'envols.
  de: >-
    Tauchender Seevogel felsiger Küsten West- und Südeuropas. Die IUCN stuft ihn weltweit als nicht gefährdet
    (LC) ein. Beobachten Sie tagsüber Fischen und Ruhen von Küsten-Aussichtspunkten aus, ohne sich Kolonien
    mit dem Boot zu nähern oder Vögel aufzuscheuchen.
  it: >-
    Uccello marino tuffatore di coste rocciose dell'Europa occidentale e meridionale. La IUCN lo classifica a
    livello globale come a rischio minimo (LC). Di giorno, osserva pesca e riposo dai punti panoramici
    costieri senza avvicinarti in barca alle colonie né provocare involi.
  pt: >-
    Ave marinha mergulhadora de costas rochosas da Europa ocidental e meridional. A IUCN classifica-a
    globalmente como pouco preocupante (LC). De dia, observe pesca e descanso a partir de miradouros costeiros
    sem se aproximar de barco das colónias nem provocar levantamentos de voo.
