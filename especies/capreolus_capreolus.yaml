id: capreolus_capreolus
nombre_cientifico: Capreolus capreolus
nombre:
  es: Corzo
  en: Roe deer
  fr: Chevreuil
  de: Reh
  it: Capriolo
  pt: Corça
descripcion:
  es: >-
    Pequeño cérvido de bosques, lindes y mosaicos agrícolas de buena parte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Búscalo al amanecer o al atardecer desde caminos, sin seguirlo
    por el monte ni acercarte a corcinos.
  en: >-
    Small deer of woodlands, forest edges and farmland mosaics across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). Look for it at dawn or dusk from tracks, without following it into cover
    or approaching fawns.
  fr: >-
    Petit cervidé des forêts, lisières et mosaïques agricoles d'une grande partie de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). Cherchez-le à l'aube ou au crépuscule depuis les
    chemins, sans le suivre dans les bois ni vous approcher des faons.
  de: >-
    Kleiner Hirsch von Wäldern, Waldrändern und kleinräumigen Kulturlandschaften in weiten Teilen Europas. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Suchen Sie ihn in der Morgen- oder Abenddämmerung
    von Wegen aus, ohne ihm ins Dickicht zu folgen oder sich Kitzen zu nähern.
  it: >-
    Piccolo cervide di boschi, margini forestali e mosaici agricoli di buona parte d'Europa. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Cercalo all'alba o al tramonto dai sentieri,
    senza seguirlo nel bosco né avvicinarti ai piccoli.
  pt: >-
    Pequeno cervídeo de florestas, orlas e mosaicos agrícolas de grande parte da Europa. A IUCN classifica-o
    globalmente como pouco preocupante (LC). Procure-o ao amanhecer ou ao entardecer a partir dos caminhos,
    sem o seguir pelo mato nem se aproximar das crias.
