id: felis_silvestris
nombre_cientifico: Felis silvestris
nombre:
  es: Gato montés
  en: European wildcat
  fr: Chat sauvage
  de: Wildkatze
  it: Gatto selvatico
  pt: Gato-bravo
descripcion:
  es: >-
    Felino solitario de bosques caducifolios y mixtos de Europa continental y Escocia. La IUCN la clasifica
    globalmente como preocupación menor (LC). De hábitos principalmente nocturnos, conviene esperar encuentros
    desde caminos tranquilos sin perseguirlo ni usar cebos.
  en: >-
    Solitary felid of deciduous and mixed forests of continental Europe and Scotland. The IUCN classifies it
    globally as Least Concern (LC). Mainly nocturnal, it is best awaited along quiet tracks without chasing it
    or using bait.
  fr: >-
    Félin solitaire des forêts feuillues et mixtes d'Europe continentale et d'Écosse. L'UICN le classe
    globalement en préoccupation mineure (LC). Principalement nocturne, il convient d'attendre une rencontre
    depuis des chemins calmes sans le poursuivre ni utiliser d'appâts.
  de: >-
    Einzelgängerische Katze der Laub- und Mischwälder Kontinentaleuropas und Schottlands. Die IUCN stuft sie
    weltweit als nicht gefährdet (LC) ein. Aufgrund ihrer vorwiegend nächtlichen Lebensweise empfiehlt es
    sich, an ruhigen Wegen zu warten, ohne sie zu verfolgen oder Köder auszulegen.
  it: >-
    Felino solitario di foreste decidue e miste dell'Europa continentale e della Scozia. La IUCN lo classifica
    a livello globale come a rischio minimo (LC). Dalle abitudini prevalentemente notturne, conviene attendere
    incontri da sentieri tranquilli senza inseguirlo né usare esche.
  pt: >-
    Felino solitário de florestas caducifólias e mistas da Europa continental e da Escócia. A IUCN
    classifica-o globalmente como pouco preocupante (LC). De hábitos principalmente noturnos, convém aguardar
    encontros a partir de caminhos tranquilos sem o perseguir nem usar iscos.
