id: aquila_pomarina
nombre_cientifico: Aquila pomarina
nombre:
  es: Águila pomerana
  en: Lesser spotted eagle
  fr: Aigle pomarin
  de: Schreiadler
descripcion:
  es: >-
    Rapaz migratoria que cría en Europa central y oriental, asociada a bosques próximos a espacios abiertos.
    La IUCN la clasifica globalmente como preocupación menor (LC). En primavera y verano, observa sus vuelos
    diurnos desde miradores sin acercarte a nidos ni usar reclamos.
  en: >-
    Migratory raptor breeding in central and eastern Europe, associated with forests close to open ground. The
    IUCN classifies it globally as Least Concern (LC). In spring and summer, watch daytime flights from
    viewpoints without approaching nests or using playback.
  fr: >-
    Rapace migrateur nichant en Europe centrale et orientale, associé aux forêts proches d'espaces ouverts.
    L'UICN le classe globalement en préoccupation mineure (LC). Au printemps et en été, observez ses vols
    diurnes depuis les belvédères sans vous approcher des nids ni utiliser d'appeaux.
  de: >-
    Zuggreifvogel, der in Mittel- und Osteuropa brütet und an Wälder nahe offenen Flächen gebunden ist. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie im Frühjahr und Sommer seine
    Tagesflüge von Aussichtspunkten aus, ohne sich Nestern zu nähern oder Klangattrappen zu nutzen.
