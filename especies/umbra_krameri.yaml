id: umbra_krameri
nombre_cientifico: Umbra krameri
nombre:
  es: Umbra europea
  en: European mudminnow
  fr: Poisson-chien
  de: Europäischer Hundsfisch
descripcion:
  es: >-
    Pequeño pez de aguas lentas y humedales de las cuencas del Danubio y Dniéster, en Europa central y
    oriental. La IUCN la clasifica globalmente como vulnerable (VU). Si resulta visible desde la orilla,
    obsérvalo sin capturarlo, remover fondos ni entrar entre la vegetación acuática.
  en: >-
    Small fish of slow-flowing waters and wetlands in the Danube and Dniester basins, in central and eastern
    Europe. The IUCN classifies it globally as Vulnerable (VU). If visible from the bank, watch without
    catching it, stirring up silt or entering aquatic vegetation.
  fr: >-
    Petit poisson des eaux lentes et zones humides des bassins du Danube et du Dniestr, en Europe centrale et
    orientale. L'UICN le classe globalement comme vulnérable (VU). S'il est visible depuis la berge,
    observez-le sans le capturer, remuer les fonds ni entrer dans la végétation aquatique.
  de: >-
    Kleiner Fisch langsam fließender Gewässer und Feuchtgebiete der Donau- und Dnestr-Becken in Mittel- und
    Osteuropa. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Wenn er vom Ufer aus sichtbar ist,
    beobachten Sie ihn, ohne ihn zu fangen, den Grund aufzuwühlen oder Wasserpflanzen zu betreten.
