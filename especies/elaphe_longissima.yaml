id: elaphe_longissima
nombre_cientifico: Elaphe longissima
nombre:
  es: Culebra de Esculapio
descripcion:
  es: >-
    Culebra no venenosa ligada a bosques y otros ambientes con cobertura en distintas regiones de Europa. La
    IUCN la clasifica globalmente como preocupación menor (LC). Durante la estación templada, obsérvala de día
    desde caminos sin cogerla, perseguirla ni levantar refugios.
