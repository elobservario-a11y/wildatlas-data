id: pterocles_alchata
nombre_cientifico: Pterocles alchata
nombre:
  es: Ganga ibérica
  en: Pin-tailed sandgrouse
  fr: Ganga cata
  de: Spießflughuhn
  it: Grandule
  pt: Cortiçol-de-barriga-branca
descripcion:
  es: >-
    Ave de estepas y llanuras secas, con poblaciones europeas en España, Portugal y el sur de Francia. La IUCN
    la clasifica globalmente como preocupación menor (LC). Al amanecer, observa desplazamientos con
    prismáticos desde caminos sin acercarte a bebederos ni hacer levantar los bandos.
  en: >-
    Bird of steppes and dry plains, with European populations in Spain, Portugal and southern France. The IUCN
    classifies it globally as Least Concern (LC). At dawn, watch flights with binoculars from tracks without
    approaching drinking sites or flushing flocks.
  fr: >-
    Oiseau des steppes et plaines sèches, avec des populations européennes en Espagne, au Portugal et dans le
    sud de la France. L'UICN le classe globalement en préoccupation mineure (LC). À l'aube, observez les
    déplacements aux jumelles depuis les chemins sans vous approcher des points d'eau ni faire lever les
    groupes.
  de: >-
    Vogel der Steppen und trockenen Ebenen mit europäischen Beständen in Spanien, Portugal und Südfrankreich.
    Die IUCN stuft es weltweit als nicht gefährdet (LC) ein. Beobachten Sie in der Morgendämmerung
    Flugbewegungen mit dem Fernglas von Wegen aus, ohne sich Wasserstellen zu nähern oder Trupps
    aufzuscheuchen.
  it: >-
    Uccello di steppe e pianure aride, con popolazioni europee in Spagna, Portogallo e Francia meridionale. La
    IUCN la classifica a livello globale come a rischio minimo (LC). All'alba, osserva gli spostamenti con il
    binocolo dai sentieri senza avvicinarti agli abbeveratoi né far alzare gli stormi.
  pt: >-
    Ave de estepes e planícies secas, com populações europeias em Espanha, Portugal e sul de França. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Ao amanhecer, observe as deslocações com binóculos a
    partir dos caminhos sem se aproximar de bebedouros nem levantar os bandos.
