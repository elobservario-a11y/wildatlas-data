id: pinus_canariensis
nombre_cientifico: Pinus canariensis
nombre:
  es: Pino canario
  en: Canary Islands pine
  de: Kanarische Kiefer
  pt: Pinheiro-das-Canárias
descripcion:
  es: >-
    Conífera endémica de Canarias que forma pinares en las islas del archipiélago. La IUCN la clasifica
    globalmente como preocupación menor (LC). Su follaje perenne puede observarse durante todo el año desde
    senderos sin recoger ramas, piñas ni dañar cortezas.
  en: >-
    Conifer endemic to the Canary Islands, forming pine forests across the islands of the archipelago. The
    IUCN classifies it globally as Least Concern (LC). Its evergreen foliage can be seen year-round from
    trails without picking branches, cones or damaging bark.
  de: >-
    Auf den Kanaren endemisches Nadelgehölz, das auf den Inseln des Archipels Kiefernwälder bildet. Die IUCN
    stuft sie weltweit als nicht gefährdet (LC) ein. Ihr immergrünes Laub lässt sich ganzjährig von Wegen aus
    betrachten, ohne Äste oder Zapfen zu sammeln oder die Rinde zu verletzen.
  pt: >-
    Conífera endémica das Canárias que forma pinhais nas ilhas do arquipélago. A IUCN classifica-a globalmente
    como pouco preocupante (LC). A sua folhagem perene pode ser observada durante todo o ano a partir dos
    trilhos sem recolher ramos, pinhas nem danificar a casca.
