id: bubo_bubo
nombre_cientifico: Bubo bubo
nombre:
  es: Búho real
  en: Eurasian eagle-owl
  fr: Hibou grand-duc
  de: Uhu
  it: Gufo reale
  pt: Bufo-real
descripcion:
  es: >-
    Gran búho de roquedos, montes y paisajes abiertos de Europa y Asia. La IUCN la clasifica globalmente como
    preocupación menor (LC). Al anochecer, escucha desde caminos alejados sin reproducir reclamos, iluminar al
    ave ni acercarte a nidos.
  en: >-
    Large owl of crags, woodlands and open landscapes across Europe and Asia. The IUCN classifies it globally
    as Least Concern (LC). At dusk, listen from distant tracks without playing back calls, shining lights on
    the bird or approaching nests.
  fr: >-
    Grand hibou des rochers, massifs et paysages ouverts d'Europe et d'Asie. L'UICN le classe globalement en
    préoccupation mineure (LC). À la tombée du jour, écoutez depuis des chemins éloignés sans diffuser
    d'appeaux, éclairer l'oiseau ni vous approcher des nids.
  de: >-
    Große Eule von Felswänden, Wäldern und offenen Landschaften Europas und Asiens. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Lauschen Sie in der Dämmerung von entfernten Wegen aus, ohne Rufe
    abzuspielen, den Vogel anzuleuchten oder sich Nestern zu nähern.
  it: >-
    Grande gufo di pareti rocciose, boschi e paesaggi aperti di Europa e Asia. La IUCN lo classifica a livello
    globale come a rischio minimo (LC). All'imbrunire, ascolta da sentieri lontani senza riprodurre richiami,
    illuminare l'uccello né avvicinarti ai nidi.
  pt: >-
    Grande mocho de rochedos, montes e paisagens abertas da Europa e Ásia. A IUCN classifica-o globalmente
    como pouco preocupante (LC). Ao anoitecer, escute a partir de caminhos afastados sem reproduzir
    chamarizes, iluminar a ave nem se aproximar de ninhos.
