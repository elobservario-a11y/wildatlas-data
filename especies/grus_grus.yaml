id: grus_grus
nombre_cientifico: Grus grus
nombre:
  es: Grulla común
  en: Common crane
  fr: Grue cendrée
  de: Kranich
  it: Gru
  pt: Grou-comum
descripcion:
  es: >-
    Ave migratoria que cría en humedales del norte y este europeo e inverna en regiones más meridionales. La
    IUCN la clasifica globalmente como preocupación menor (LC). En los pasos migratorios y la invernada,
    observa los bandos desde caminos y observatorios sin hacerlos levantar.
  en: >-
    Migratory bird breeding in wetlands of northern and eastern Europe and wintering in more southern regions.
    The IUCN classifies it globally as Least Concern (LC). During migration and wintering, watch flocks from
    tracks and hides without flushing them.
  fr: >-
    Oiseau migrateur qui niche dans les zones humides du nord et de l'est de l'Europe et hiverne dans des
    régions plus méridionales. L'UICN le classe globalement en préoccupation mineure (LC). Lors des passages
    migratoires et de l'hivernage, observez les groupes depuis les chemins et observatoires sans les faire
    décoller.
  de: >-
    Zugvogel, der in Feuchtgebieten Nord- und Osteuropas brütet und in südlicheren Regionen überwintert. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps während des Zugs und im Winter
    von Wegen und Beobachtungshütten aus, ohne sie aufzuscheuchen.
  it: >-
    Uccello migratore che nidifica nelle zone umide dell'Europa settentrionale e orientale e sverna in regioni
    più meridionali. La IUCN la classifica a livello globale come a rischio minimo (LC). Durante i passi
    migratori e lo svernamento, osserva gli stormi da sentieri e appostamenti senza farli involare.
  pt: >-
    Ave migratória que nidifica em zonas húmidas do norte e leste europeu e passa o inverno em regiões mais
    meridionais. A IUCN classifica-a globalmente como pouco preocupante (LC). Nas passagens migratórias e na
    invernada, observe os bandos a partir de caminhos e observatórios sem os fazer levantar voo.
