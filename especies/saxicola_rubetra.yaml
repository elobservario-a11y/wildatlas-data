id: saxicola_rubetra
nombre_cientifico: Saxicola rubetra
nombre:
  es: Tarabilla norteña
  en: Whinchat
  fr: Tarier des prés
  de: Braunkehlchen
  it: Stiaccino
  pt: Cartaxo-nortenho
descripcion:
  es: >-
    Pequeña ave migratoria de prados y herbazales europeos con vegetación heterogénea y posaderos. La IUCN la
    clasifica globalmente como preocupación menor (LC). En primavera y verano, obsérvala desde caminos sin
    entrar en prados de cría ni reproducir cantos.
  en: >-
    Small migratory bird of European meadows and grasslands with varied vegetation and perches. The IUCN
    classifies it globally as Least Concern (LC). In spring and summer, watch it from tracks without entering
    breeding meadows or playing back calls.
  fr: >-
    Petit oiseau migrateur des prairies et herbages européens à végétation variée et perchoirs. L'UICN le
    classe globalement en préoccupation mineure (LC). Au printemps et en été, observez-le depuis les chemins
    sans entrer dans les prairies de nidification ni diffuser de chants.
  de: >-
    Kleiner Zugvogel europäischer Wiesen und Grasländer mit strukturreicher Vegetation und Sitzwarten. Die
    IUCN stuft es weltweit als nicht gefährdet (LC) ein. Beobachten Sie es im Frühjahr und Sommer von Wegen
    aus, ohne Brutwiesen zu betreten oder Gesänge abzuspielen.
  it: >-
    Piccolo uccello migratore di prati e distese erbose europee con vegetazione varia e posatoi. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). In primavera e in estate, osservalo dai sentieri
    senza entrare nei prati di nidificazione né riprodurre canti.
  pt: >-
    Pequena ave migratória de prados e ervaçais europeus com vegetação heterogénea e poleiros. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Na primavera e no verão, observe-o a partir dos
    caminhos sem entrar em prados de criação nem reproduzir cantos.
