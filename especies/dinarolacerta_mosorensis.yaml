id: dinarolacerta_mosorensis
nombre_cientifico: Dinarolacerta mosorensis
nombre:
  es: Lagartija de Mosor
  en: Mosor rock lizard
  de: Mosoreidechse
descripcion:
  es: >-
    Lagartija de roquedos calizos y ambientes kársticos de la costa dinárica, presente en Croacia, Bosnia y
    Herzegovina y Montenegro. La IUCN la clasifica globalmente como casi amenazada (NT). Durante su actividad
    diurna, obsérvala desde senderos sin capturarla, perseguirla ni levantar piedras.
  en: >-
    Lizard of limestone crags and karst habitats on the Dinaric coast, present in Croatia, Bosnia and
    Herzegovina and Montenegro. The IUCN classifies it globally as Near Threatened (NT). During daytime
    activity, watch from trails without catching, chasing it or lifting stones.
  de: >-
    Eidechse von Kalkfelsen und Karstlebensräumen der dinarischen Küste in Kroatien, Bosnien und Herzegowina
    sowie Montenegro. Die IUCN stuft sie weltweit als potenziell gefährdet (NT) ein. Beobachten Sie sie
    während ihrer Tagesaktivität von Wegen aus, ohne sie zu fangen, zu verfolgen oder Steine anzuheben.
