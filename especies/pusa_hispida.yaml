id: pusa_hispida
nombre_cientifico: Pusa hispida
nombre:
  es: Foca ocelada
  en: Ringed seal
  fr: Phoque annelé
  de: Ringelrobbe
  pt: Foca-anelada
descripcion:
  es: >-
    Foca de mares árticos y subárticos, con poblaciones europeas marinas y lacustres. La IUCN la clasifica
    globalmente como preocupación menor (LC). Cuando descanse sobre hielo o roca, obsérvala con telescopio sin
    acercarte a crías ni bloquear el acceso al agua.
  en: >-
    Seal of Arctic and subarctic seas, with marine and freshwater European populations. The IUCN classifies it
    globally as Least Concern (LC). When resting on ice or rock, watch through a scope without approaching
    pups or blocking access to the water.
  fr: >-
    Phoque des mers arctiques et subarctiques, comptant des populations européennes marines et lacustres.
    L'UICN le classe globalement en préoccupation mineure (LC). Lorsqu'il se repose sur la glace ou la roche,
    observez-le à la longue-vue sans vous approcher des petits ni bloquer l'accès à l'eau.
  de: >-
    Robbe arktischer und subarktischer Meere mit marinen sowie Binnensee-Populationen in Europa. Die IUCN
    stuft sie weltweit als nicht gefährdet (LC) ein. Wenn sie auf Eis oder Felsen ruht, beobachten Sie sie mit
    dem Spektiv, ohne sich Jungtieren zu nähern oder den Weg ins Wasser zu versperren.
  pt: >-
    Foca de mares árticos e subárticos, com populações europeias marinhas e lacustres. A IUCN classifica-a
    globalmente como pouco preocupante (LC). Quando descansa sobre gelo ou rocha, observe-a com telescópio sem
    se aproximar de crias nem bloquear o acesso à água.
