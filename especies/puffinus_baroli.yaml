id: puffinus_baroli
nombre_cientifico: Puffinus baroli
nombre:
  es: Pardela chica macaronésica
  en: Barolo shearwater
  fr: Puffin de Macaronésie
  de: Barolosturmtaucher
  it: Berta della Macaronesia
  pt: Pardela-pequena
descripcion:
  es: >-
    Pequeña pardela del Atlántico norte que cría en las Azores y Canarias y se alimenta en el mar. La fuente
    consultada no aporta una categoría global IUCN para este taxón. Durante su estancia reproductora,
    obsérvala sobre el agua desde salidas responsables sin desembarcar en colonias ni utilizar luces.
  en: >-
    Small shearwater of the North Atlantic breeding in the Azores and Canary Islands and feeding at sea. The
    consulted source provides no global IUCN category for this taxon. During its breeding stay, watch it over
    the water on responsible trips without landing on colonies or using lights.
  fr: >-
    Petit puffin de l'Atlantique Nord qui niche aux Açores et aux Canaries et se nourrit en mer. La source
    consultée ne fournit pas de catégorie mondiale UICN pour ce taxon. Pendant son séjour reproducteur,
    observez-le sur l'eau lors de sorties responsables sans débarquer dans les colonies ni utiliser de
    lumières.
  de: >-
    Kleiner Sturmtaucher des Nordatlantiks, der auf den Azoren und Kanaren brütet und auf dem Meer frisst. Die
    herangezogene Quelle nennt keine globale IUCN-Kategorie für dieses Taxon. Beobachten Sie ihn zur Brutzeit
    auf dem Wasser bei verantwortungsvollen Ausfahrten, ohne Kolonien zu betreten oder Licht zu nutzen.
  it: >-
    Piccola berta dell'Atlantico settentrionale che nidifica alle Azzorre e alle Canarie e si nutre in mare.
    La fonte consultata non riporta una categoria globale IUCN per questo taxon. Durante il periodo
    riproduttivo, osservala sull'acqua con uscite responsabili senza sbarcare nelle colonie né usare luci.
  pt: >-
    Pequena cagarra do Atlântico Norte que nidifica nos Açores e nas Canárias e se alimenta no mar. A fonte
    consultada não apresenta uma categoria global IUCN para este táxon. Durante a sua estadia reprodutora,
    observe-a sobre a água em saídas responsáveis sem desembarcar em colónias nem usar luzes.
