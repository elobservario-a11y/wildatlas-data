id: bos_taurus
nombre_cientifico: Bos taurus
nombre:
  es: Ganado bovino
  en: Domestic cattle
descripcion:
  es: >-
    Bóvido doméstico criado en Europa, asociado a pastos y paisajes agropecuarios. Es un taxón doméstico y la
    fuente no le asigna una categoría global de amenaza IUCN. Observa los rebaños durante el pastoreo desde
    caminos permitidos, sin alimentarlos ni acercarte a terneros.
  en: >-
    Domestic bovid raised across Europe, associated with pastures and agricultural landscapes. It is a
    domestic taxon and the source assigns no global IUCN threat category. Watch herds while grazing from
    permitted tracks, without feeding them or approaching calves.
