id: halichoerus_grypus
nombre_cientifico: Halichoerus grypus
nombre:
  es: Foca gris
  en: Grey seal
  fr: Phoque gris
  de: Kegelrobbe
  it: Foca grigia
descripcion:
  es: >-
    Foca de costas rocosas, islas y playas del Atlántico norte europeo y del Báltico. La IUCN la clasifica
    globalmente como preocupación menor (LC). Obsérvala cuando descanse en tierra con telescopio desde lejos,
    sin bloquear su acceso al mar ni acercarte a las crías.
  en: >-
    Seal of rocky coasts, islands and beaches of the European North Atlantic and the Baltic. The IUCN
    classifies it globally as Least Concern (LC). Watch it resting ashore through a scope from afar, without
    blocking its access to the sea or approaching pups.
  fr: >-
    Phoque des côtes rocheuses, îles et plages de l'Atlantique Nord européen et de la Baltique. L'UICN le
    classe globalement en préoccupation mineure (LC). Observez-le au repos à terre à la longue-vue depuis une
    distance sûre, sans bloquer son accès à la mer ni vous approcher des petits.
  de: >-
    Robbe der Felsküsten, Inseln und Strände des europäischen Nordatlantiks und der Ostsee. Die IUCN stuft sie
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie sie beim Ruhen an Land aus der Ferne mit dem
    Spektiv, ohne ihr den Weg ins Meer zu versperren oder sich Jungtieren zu nähern.
  it: >-
    Foca di coste rocciose, isole e spiagge dell'Atlantico settentrionale europeo e del Baltico. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Osservala mentre riposa a terra con il
    cannocchiale da lontano, senza bloccarle l'accesso al mare né avvicinarti ai cuccioli.
