id: gulo_gulo
nombre_cientifico: Gulo gulo
nombre:
  es: Glotón
  en: Wolverine
  fr: Glouton
  de: Vielfraß
  it: Ghiottone
  pt: Glutão
descripcion:
  es: >-
    Mustélido solitario de bosques boreales y tundras montañosas del norte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Su observación exige paciencia cuando recorre espacios abiertos,
    manteniendo distancia y evitando refugios de cría.
  en: >-
    Solitary mustelid of boreal forests and mountain tundras of northern Europe. The IUCN classifies it
    globally as Least Concern (LC). Observing it requires patience as it travels across open ground, keeping
    distance and avoiding breeding dens.
  fr: >-
    Mustélidé solitaire des forêts boréales et toundras montagneuses du nord de l'Europe. L'UICN le classe
    globalement en préoccupation mineure (LC). Son observation demande de la patience lorsqu'il parcourt des
    espaces ouverts, en gardant ses distances et en évitant les tanières de mise bas.
  de: >-
    Einzelgängerischer Marder borealer Wälder und Gebirgstundren Nordeuropas. Die IUCN stuft ihn weltweit als
    nicht gefährdet (LC) ein. Seine Beobachtung erfordert Geduld, wenn er offene Flächen durchquert; halten
    Sie Abstand und meiden Sie Wurfbauten.
  it: >-
    Mustelide solitario delle foreste boreali e tundre montane del nord Europa. La IUCN lo classifica a
    livello globale come a rischio minimo (LC). La sua osservazione richiede pazienza quando percorre spazi
    aperti, mantenendo le distanze ed evitando le tane riproduttive.
  pt: >-
    Mustelídeo solitário de florestas boreais e tundras montanhosas do norte da Europa. A IUCN classifica-o
    globalmente como pouco preocupante (LC). A sua observação exige paciência quando percorre espaços abertos,
    mantendo distância e evitando tocas de criação.
