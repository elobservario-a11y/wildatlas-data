id: testudo_graeca
nombre_cientifico: Testudo graeca
nombre:
  es: Tortuga mora
  en: Moorish tortoise
  fr: Tortue mauresque
  de: Maurische Landschildkröte
descripcion:
  es: >-
    Tortuga terrestre de matorrales y ambientes abiertos mediterráneos, con presencia europea fragmentada. La
    IUCN la clasifica globalmente como vulnerable (VU). Durante los periodos templados de actividad, obsérvala
    desde senderos sin manipularla, alimentarla ni trasladarla.
  en: >-
    Terrestrial tortoise of Mediterranean scrubland and open habitats, with a fragmented European presence.
    The IUCN classifies it globally as Vulnerable (VU). During mild periods of activity, watch from trails
    without handling, feeding or moving it.
  fr: >-
    Tortue terrestre des maquis et milieux ouverts méditerranéens, à présence européenne fragmentée. L'UICN la
    classe globalement comme vulnérable (VU). Pendant les périodes tempérées d'activité, observez-la depuis
    les sentiers sans la manipuler, la nourrir ni la déplacer.
  de: >-
    Landschildkröte mediterraner Buschlandschaften und offener Lebensräume mit lückenhaftem europäischem
    Vorkommen. Die IUCN stuft sie weltweit als gefährdet (VU) ein. Beobachten Sie sie während milder
    Aktivitätsphasen von Wegen aus, ohne sie anzufassen, zu füttern oder umzusetzen.
