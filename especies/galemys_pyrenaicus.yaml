id: galemys_pyrenaicus
nombre_cientifico: Galemys pyrenaicus
nombre:
  es: Desmán ibérico
  en: Pyrenean desman
  fr: Desman des Pyrénées
  de: Pyrenäen-Desman
  pt: Toupeira-da-água
descripcion:
  es: >-
    Pequeño mamífero semiacuático de cursos de agua montanos de la península ibérica y los Pirineos. La IUCN
    la clasifica globalmente como en peligro (EN). Su actividad principalmente nocturna aconseja esperar desde
    la ribera sin usar focos, entrar en el agua ni tocar refugios.
  en: >-
    Small semi-aquatic mammal of mountain watercourses of the Iberian Peninsula and the Pyrenees. The IUCN
    classifies it globally as Endangered (EN). Its mainly nocturnal activity makes it best to wait from the
    bank without using lights, entering the water or disturbing shelters.
  fr: >-
    Petit mammifère semi-aquatique des cours d'eau montagnards de la péninsule Ibérique et des Pyrénées.
    L'UICN le classe globalement en danger (EN). Son activité principalement nocturne invite à attendre depuis
    la rive sans utiliser de lampes, entrer dans l'eau ni toucher aux abris.
  de: >-
    Kleines semi-aquatisches Säugetier der Gebirgsbäche der Iberischen Halbinsel und der Pyrenäen. Die IUCN
    stuft es weltweit als stark gefährdet (EN) ein. Seine überwiegend nächtliche Aktivität erfordert ein
    Abwarten vom Ufer aus, ohne Lampen zu nutzen, ins Wasser zu steigen oder Verstecke zu stören.
  pt: >-
    Pequeno mamífero semiaquático de cursos de água montanhosos da Península Ibérica e dos Pirenéus. A IUCN
    classifica-o globalmente como em perigo (EN). A sua atividade sobretudo noturna aconselha a aguardar a
    partir da margem sem usar focos, entrar na água nem mexer em abrigos.
