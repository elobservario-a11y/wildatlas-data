id: ovis_gmelini
nombre_cientifico: Ovis gmelini
nombre:
  es: Muflón
  en: Mouflon
  fr: Ovis gmelinii
  de: Mufflon
  it: Ovis musimon
  pt: Muflão
descripcion:
  es: >-
    Ovino silvestre de medios rocosos y con matorral, presente en Chipre y otras regiones mediterráneas bajo
    distintas poblaciones. La IUCN la clasifica globalmente como casi amenazada (NT). Obsérvalo cuando salga a
    pastar con prismáticos desde caminos, sin aproximarte a grupos ni perseguir animales.
  en: >-
    Wild sheep of rocky and scrub habitats, present in Cyprus and other Mediterranean regions under distinct
    populations. The IUCN classifies it globally as Near Threatened (NT). Watch it when it comes out to graze
    with binoculars from tracks, without approaching groups or chasing animals.
  fr: >-
    Ovin sauvage des milieux rocheux et buissonnants, présent à Chypre et dans d'autres régions
    méditerranéennes selon différentes populations. L'UICN le classe globalement quasi menacé (NT).
    Observez-le lorsqu'il sort pâturer aux jumelles depuis les chemins, sans vous approcher des groupes ni
    poursuivre les animaux.
  de: >-
    Wildschaf felsiger und buschreicher Lebensräume, das auf Zypern und in anderen Mittelmeerregionen in
    verschiedenen Populationen vorkommt. Die IUCN stuft es weltweit als potenziell gefährdet (NT) ein.
    Beobachten Sie es beim Äsen mit dem Fernglas von Wegen aus, ohne sich Gruppen zu nähern oder Tiere zu
    verfolgen.
  it: >-
    Ovino selvatico di ambienti rocciosi e con macchia, presente a Cipro e in altre regioni mediterranee con
    diverse popolazioni. La IUCN lo classifica a livello globale come prossimo alla minaccia (NT). Osservalo
    quando esce a pascolare con il binocolo dai sentieri, senza avvicinarti ai gruppi né inseguire gli
    animali.
  pt: >-
    Ovino selvagem de meios rochosos e com matagal, presente em Chipre e noutras regiões mediterrânicas em
    diferentes populações. A IUCN classifica-o globalmente como quase ameaçado (NT). Observe-o quando sai para
    pastar com binóculos a partir dos caminhos, sem se aproximar dos grupos nem perseguir animais.
