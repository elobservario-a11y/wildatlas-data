id: porphyrio_porphyrio
nombre_cientifico: Porphyrio porphyrio
nombre:
  es: Calamón común
  en: Western swamphen
  fr: Talève sultane
  de: Purpurhuhn
  it: Pollo sultano comune
  pt: Caimão-comum
descripcion:
  es: >-
    Ave de plumaje azulado ligada a vegetación palustre y humedales del Mediterráneo occidental. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvala cuando salga a los bordes de la vegetación
    desde observatorios, sin penetrar en carrizales ni usar reclamos.
  en: >-
    Blue-plumaged bird linked to marsh vegetation and wetlands of the western Mediterranean. The IUCN
    classifies it globally as Least Concern (LC). Watch it when it emerges at vegetation edges from hides,
    without entering reedbeds or using playback.
  fr: >-
    Oiseau au plumage bleuâtre lié à la végétation palustre et aux zones humides de Méditerranée occidentale.
    L'UICN la classe globalement en préoccupation mineure (LC). Observez-la lorsqu'elle sort en bordure de
    végétation depuis les observatoires, sans pénétrer dans les roselières ni utiliser d'appeaux.
  de: >-
    Vogel mit bläulichem Gefieder, der an Sumpfvegetation und Feuchtgebiete des westlichen Mittelmeers
    gebunden ist. Die IUCN stuft es weltweit als nicht gefährdet (LC) ein. Beobachten Sie es von
    Beobachtungshütten aus am Vegetationsrand, ohne Schilfflächen zu betreten oder Klangattrappen zu nutzen.
  it: >-
    Uccello dal piumaggio bluastro legato alla vegetazione palustre e alle zone umide del Mediterraneo
    occidentale. La IUCN lo classifica a livello globale come a rischio minimo (LC). Osservalo quando esce ai
    margini della vegetazione dagli appostamenti, senza penetrare nei canneti né usare richiami.
  pt: >-
    Ave de plumagem azulada ligada à vegetação palustre e zonas húmidas do Mediterrâneo ocidental. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Observe-o quando sai para as orlas da vegetação a
    partir de observatórios, sem entrar em caniços nem usar chamarizes.
