id: salmo_letnica
nombre_cientifico: Salmo letnica
nombre:
  es: Trucha de Ohrid
  en: Ohrid trout
  fr: Truite d'Ohrid
  de: Ohridforelle
descripcion:
  es: >-
    Trucha endémica del lago de Ohrid y de sus aguas conectadas, en Macedonia del Norte y Albania. La IUCN la
    clasifica globalmente como en peligro (EN). Cuando sea visible en aguas claras, obsérvala desde las
    orillas permitidas sin capturarla ni alterar fondos de freza.
  en: >-
    Trout endemic to Lake Ohrid and its connected waters, in North Macedonia and Albania. The IUCN classifies
    it globally as Endangered (EN). When visible in clear water, watch from permitted shores without catching
    it or disturbing spawning beds.
  fr: >-
    Truite endémique du lac d'Ohrid et de ses eaux reliées, en Macédoine du Nord et en Albanie. L'UICN la
    classe globalement en danger (EN). Lorsqu'elle est visible en eau claire, observez-la depuis les rives
    autorisées sans la capturer ni perturber les frayères.
  de: >-
    Im Ohridsee und den angeschlossenen Gewässern in Nordmazedonien und Albanien endemische Forelle. Die IUCN
    stuft sie weltweit als stark gefährdet (EN) ein. Wenn sie in klarem Wasser sichtbar ist, beobachten Sie
    sie von zugelassenen Ufern aus, ohne sie zu fangen oder Laichgründe zu stören.
