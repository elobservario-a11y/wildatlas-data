id: stercorarius_skua
nombre_cientifico: Stercorarius skua
nombre:
  es: Págalo grande
  en: Great skua
  fr: Grand labbe
  de: Große Raubmöwe
  it: Stercorario maggiore
  pt: Moleiro-grande
descripcion:
  es: >-
    Ave marina de islas y brezales costeros del Atlántico norte europeo, que también frecuenta mar abierto. La
    IUCN la clasifica globalmente como preocupación menor (LC). En época reproductora, utiliza senderos
    autorizados y mantén distancia, retrocediendo si las aves muestran alarma.
  en: >-
    Seabird of islands and coastal heathlands of the European North Atlantic, also frequenting open sea. The
    IUCN classifies it globally as Least Concern (LC). In the breeding season, use authorised trails and keep
    distance, stepping back if birds show alarm.
  fr: >-
    Oiseau marin des îles et landes côtières de l'Atlantique Nord européen, qui fréquente aussi la haute mer.
    L'UICN le classe globalement en préoccupation mineure (LC). En période de reproduction, empruntez les
    sentiers autorisés et gardez vos distances, en reculant si les oiseaux montrent des signes d'alarme.
  de: >-
    Seevogel von Inseln und Küstenheiden des europäischen Nordatlantiks, der auch auf offener See vorkommt.
    Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Nutzen Sie zur Brutzeit zugelassene Wege und
    halten Sie Abstand; weichen Sie zurück, sobald Vögel Warnverhalten zeigen.
  it: >-
    Uccello marino di isole e brughiere costiere dell'Atlantico settentrionale europeo, che frequenta anche il
    mare aperto. La IUCN lo classifica a livello globale come a rischio minimo (LC). Nella stagione
    riproduttiva, usa i sentieri autorizzati e mantieni le distanze, indietreggiando se gli uccelli mostrano
    allarme.
  pt: >-
    Ave marinha de ilhas e urzais costeiros do Atlântico Norte europeu, que também frequenta mar aberto. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Na época reprodutora, utilize trilhos
    autorizados e mantenha distância, recuando se as aves mostrarem alarme.
