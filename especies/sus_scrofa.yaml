id: sus_scrofa
nombre_cientifico: Sus scrofa
nombre:
  es: Jabalí
  en: Wild boar
  fr: Sanglier
  de: Wildschwein
  it: Cinghiale
  pt: Javali
descripcion:
  es: >-
    Ungulado omnívoro extendido por bosques y mosaicos de humedales, praderas y cultivos de Europa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvalo si sale a claros durante recorridos
    tranquilos, sin alimentarlo ni interponerte entre hembras y rayones.
  en: >-
    Omnivorous ungulate widespread across forests and mosaics of wetlands, meadows and farmland in Europe. The
    IUCN classifies it globally as Least Concern (LC). Watch it if it steps into clearings during quiet walks,
    without feeding it or coming between sows and piglets.
  fr: >-
    Ongulé omnivore répandu dans les forêts et mosaïques de zones humides, prairies et cultures d'Europe.
    L'UICN le classe globalement en préoccupation mineure (LC). Observez-le s'il sort dans les clairières lors
    de balades tranquilles, sans le nourrir ni vous interposer entre les laies et les marcassins.
  de: >-
    Allesfressendes Huftier, das in Wäldern sowie Mosaiken aus Feuchtgebieten, Wiesen und Feldern Europas weit
    verbreitet ist. Die IUCN stuft es weltweit als nicht gefährdet (LC) ein. Beobachten Sie es auf Lichtungen
    bei ruhigen Wanderungen, ohne zu füttern oder zwischen Bachen und Frischlinge zu geraten.
  it: >-
    Ungulato onnivoro diffuso in foreste e mosaici di zone umide, praterie e coltivi d'Europa. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Osservalo se esce nelle radure durante
    passeggiate tranquille, senza nutrirlo né frapporti tra femmine e piccoli.
  pt: >-
    Ungulado omnívoro distribuído por florestas e mosaicos de zonas húmidas, prados e culturas da Europa. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Observe-o se sair para clareiras durante
    percursos tranquilos, sem o alimentar nem se interpor entre fêmeas e crias.
