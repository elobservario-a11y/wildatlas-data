id: acrocephalus_paludicola
nombre_cientifico: Acrocephalus paludicola
nombre:
  es: Carricerín cejudo
  en: Aquatic warbler
  fr: Phragmite aquatique
  de: Seggenrohrsänger
  it: Pagliarolo
  pt: Felosa-aquática
descripcion:
  es: >-
    Pequeña ave migratoria de humedales con cárices y vegetación baja, reproductora en el este de Europa. La
    IUCN la clasifica globalmente como vulnerable (VU). Durante el paso migratorio, observa desde pasarelas y
    miradores sin entrar en la vegetación ni reproducir cantos.
  en: >-
    Small migratory bird of wetlands with sedges and low vegetation, breeding in eastern Europe. The IUCN
    classifies it globally as Vulnerable (VU). During migration, observe from boardwalks and viewpoints
    without entering the vegetation or playing back calls.
  fr: >-
    Petit oiseau migrateur des zones humides à laîches et végétation basse, nicheur dans l'est de l'Europe.
    L'UICN le classe globalement comme vulnérable (VU). Lors du passage migratoire, observez-le depuis les
    passerelles et observatoires sans entrer dans la végétation ni diffuser de chants.
  de: >-
    Kleiner Zugvogel von Feuchtgebieten mit Seggen und niedriger Vegetation, der im Osten Europas brütet. Die
    IUCN stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie ihn während des Vogelzugs von Stegen und
    Aussichtspunkten aus, ohne die Vegetation zu betreten oder Gesänge abzuspielen.
  it: >-
    Piccolo uccello migratore delle zone umide con carici e vegetazione bassa, nidificante nell'Europa
    orientale. La IUCN lo classifica a livello globale come vulnerabile (VU). Durante il passo migratorio,
    osservalo da passerelle e punti di osservazione senza entrare nella vegetazione né riprodurre canti.
  pt: >-
    Pequena ave migratória de zonas húmidas com ciperáceas e vegetação baixa, nidificante no leste da Europa.
    A IUCN classifica-a globalmente como vulnerável (VU). Durante a passagem migratória, observe a partir de
    passadiços e miradouros sem entrar na vegetação nem reproduzir cantos.
