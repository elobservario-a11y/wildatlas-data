id: lutra_lutra
nombre_cientifico: Lutra lutra
nombre:
  es: Nutria europea
  en: Eurasian otter
  fr: Loutre d'Europe
  de: Eurasischer Fischotter
  it: Lontra europea
  pt: Lontra-europeia
descripcion:
  es: >-
    Mustélido semiacuático de ríos, lagos y costas europeas, dependiente del agua y de orillas con refugio. La
    IUCN la clasifica globalmente como casi amenazada (NT). Espera a distancia cuando salga a pescar, sin
    seguirla por la orilla ni acercarte a sus refugios.
  en: >-
    Semi-aquatic mustelid of European rivers, lakes and coasts, dependent on water and sheltered banks. The
    IUCN classifies it globally as Near Threatened (NT). Wait at a distance when it comes out to fish, without
    following it along the bank or approaching its holts.
  fr: >-
    Mustélidé semi-aquatique des rivières, lacs et côtes d'Europe, dépendant de l'eau et de berges offrant des
    abris. L'UICN le classe globalement quasi menacé (NT). Attendez à distance lorsqu'elle sort pêcher, sans
    la suivre le long de la berge ni vous approcher de ses gîtes.
  de: >-
    Semi-aquatischer Marder europäischer Flüsse, Seen und Küsten, abhängig von Wasser und deckungsreichen
    Ufern. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Warten Sie aus der Ferne, wenn er
    zum Fischen erscheint, ohne ihm am Ufer zu folgen oder sich seinen Bauten zu nähern.
  it: >-
    Mustelide semiacquatico di fiumi, laghi e coste europee, dipendente dall'acqua e da sponde con rifugi. La
    IUCN la classifica a livello globale come prossima alla minaccia (NT). Attendi a distanza quando esce a
    pescare, senza seguirla lungo la riva né avvicinarti alle sue tane.
  pt: >-
    Mustelídeo semiaquático de rios, lagos e costas europeias, dependente da água e de margens com abrigo. A
    IUCN classifica-a globalmente como quase ameaçada (NT). Aguarde à distância quando sair para pescar, sem a
    seguir pela margem nem se aproximar dos seus abrigos.
