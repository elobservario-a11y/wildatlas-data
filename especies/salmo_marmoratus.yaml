id: salmo_marmoratus
nombre_cientifico: Salmo marmoratus
nombre:
  es: Trucha marmórea
descripcion:
  es: >-
    Trucha de ríos de la cuenca adriática, presente desde el entorno alpino hasta regiones balcánicas. La IUCN
    la clasifica globalmente como vulnerable (VU). Cuando sea visible en aguas claras, obsérvala desde la
    ribera sin entrar en frezaderos ni ofrecer alimento.
