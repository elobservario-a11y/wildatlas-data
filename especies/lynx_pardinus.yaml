id: lynx_pardinus
nombre_cientifico: Lynx pardinus
nombre:
  es: Lince ibérico
  en: Iberian lynx
  fr: Lynx pardelle
  de: Pardelluchs
  it: Lince pardina
  pt: Lince-ibérico
descripcion:
  es: >-
    Felino ibérico ligado al matorral mediterráneo y a mosaicos de monte y pastizal con conejos. La IUCN la
    clasifica globalmente como vulnerable (VU). Espera a que cruce zonas abiertas desde observatorios
    autorizados, sin seguirlo ni acercarte a las crías.
  en: >-
    Iberian felid linked to Mediterranean scrubland and mosaics of woodland and pasture with rabbits. The IUCN
    classifies it globally as Vulnerable (VU). Wait for it to cross open areas from authorised hides, without
    following it or approaching cubs.
  fr: >-
    Félin ibérique lié au maquis méditerranéen et aux mosaïques de bois et pâturages riches en lapins. L'UICN
    le classe globalement comme vulnérable (VU). Attendez qu'il traverse des espaces ouverts depuis des
    observatoires autorisés, sans le suivre ni vous approcher des jeunes.
  de: >-
    Iberische Katze, die an mediterranes Buschland und Mosaike aus Wald und Weideland mit Kaninchen gebunden
    ist. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Warten Sie von zugelassenen Beobachtungsständen
    aus darauf, dass er offene Flächen quert, ohne ihm zu folgen oder sich Jungtieren zu nähern.
  it: >-
    Felino iberico legato alla macchia mediterranea e ai mosaici di bosco e pascolo ricchi di conigli. La IUCN
    la classifica a livello globale come vulnerabile (VU). Attendi che attraversi spazi aperti dagli
    appostamenti autorizzati, senza seguirla né avvicinarti ai piccoli.
  pt: >-
    Felino ibérico ligado ao matagal mediterrânico e a mosaicos de bosque e pastagem com coelhos. A IUCN
    classifica-o globalmente como vulnerável (VU). Aguarde que atravesse zonas abertas a partir de
    observatórios autorizados, sem o seguir nem se aproximar das crias.
