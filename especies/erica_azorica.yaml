id: erica_azorica
nombre_cientifico: Erica azorica
nombre:
  es: Brezo de las Azores
descripcion:
  es: >-
    Brezo endémico de las Azores que ocupa laderas, acantilados, bosques y otros ambientes del archipiélago.
    La fuente consultada no aporta una categoría global IUCN para este taxón. Durante recorridos diurnos,
    observa su porte desde senderos sin arrancar ramas, flores ni plántulas.
