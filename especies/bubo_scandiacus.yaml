id: bubo_scandiacus
nombre_cientifico: Bubo scandiacus
nombre:
  es: Búho nival
  en: Snowy owl
  fr: Harfang des neiges
  de: Schnee-Eule
  it: Gufo delle nevi
  pt: Coruja-das-neves
descripcion:
  es: >-
    Gran búho blanco de tundras árticas, con reproducción en regiones del extremo norte europeo. La IUCN la
    clasifica globalmente como vulnerable (VU). Aprovecha su actividad diurna estival para observarlo con
    telescopio desde lejos, sin buscar nidos ni usar cebos.
  en: >-
    Large white owl of Arctic tundras, breeding in far northern regions of Europe. The IUCN classifies it
    globally as Vulnerable (VU). Take advantage of its summer daytime activity to watch it through a scope
    from afar, without searching for nests or using bait.
  fr: >-
    Grand hibou blanc des toundras arctiques, nicheur dans les régions de l'extrême nord européen. L'UICN le
    classe globalement comme vulnérable (VU). Profitez de son activité diurne estivale pour l'observer à la
    longue-vue de loin, sans chercher de nids ni utiliser d'appâts.
  de: >-
    Große weiße Eule der arktischen Tundren mit Brutgebieten im äußersten Norden Europas. Die IUCN stuft sie
    weltweit als gefährdet (VU) ein. Nutzen Sie ihre sommerliche Tagaktivität, um sie aus der Ferne mit dem
    Spektiv zu beobachten, ohne nach Nestern zu suchen oder Köder auszulegen.
  it: >-
    Grande gufo bianco delle tundre artiche, nidificante nelle regioni dell'estremo nord europeo. La IUCN lo
    classifica a livello globale come vulnerabile (VU). Approfitta della sua attività diurna estiva per
    osservalo con il cannocchiale da lontano, senza cercare nidi né usare esche.
  pt: >-
    Grande coruja branca das tundras árticas, com reprodução em regiões do extremo norte europeu. A IUCN
    classifica-a globalmente como vulnerável (VU). Aproveite a sua atividade diurna estival para a observar
    com telescópio de longe, sem procurar ninhos nem usar iscos.
