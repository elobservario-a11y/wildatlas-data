id: tetrax_tetrax
nombre_cientifico: Tetrax tetrax
nombre:
  es: Sisón común
  en: Little bustard
  fr: Outarde canepetière
  de: Zwergtrappe
  it: Gallina prataiola
  pt: Sisão
descripcion:
  es: >-
    Ave terrestre de pastizales y cultivos abiertos del sur de Europa, que puede formar grupos fuera de la
    cría. La IUCN la clasifica globalmente como casi amenazada (NT). En invierno, observa los bandos con
    telescopio desde caminos sin entrar en parcelas ni provocar su vuelo.
  en: >-
    Terrestrial bird of grasslands and open farmland in southern Europe, which can form flocks outside
    breeding. The IUCN classifies it globally as Near Threatened (NT). In winter, watch flocks through a scope
    from tracks without entering plots or flushing them.
  fr: >-
    Oiseau terrestre des prairies et cultures ouvertes du sud de l'Europe, pouvant former des groupes hors
    reproduction. L'UICN la classe globalement quasi menacée (NT). En hiver, observez les groupes à la
    longue-vue depuis les chemins sans entrer dans les parcelles ni provoquer leur envol.
  de: >-
    Bodenvogel von Grasländern und offenen Feldern Südeuropas, der außerhalb der Brutzeit Trupps bilden kann.
    Die IUCN stuft sie weltweit als potenziell gefährdet (NT) ein. Beobachten Sie Trupps im Winter mit dem
    Spektiv von Wegen aus, ohne Parzellen zu betreten oder sie aufzuscheuchen.
  it: >-
    Uccello terricolo di praterie e coltivi aperti dell'Europa meridionale, che può formare gruppi fuori dalla
    riproduzione. La IUCN la classifica a livello globale come prossimo alla minaccia (NT). In inverno,
    osserva gli stormi con il cannocchiale dai sentieri senza entrare nei campi né farli involare.
  pt: >-
    Ave terrestre de pastagens e culturas abertas do sul da Europa, que pode formar grupos fora da reprodução.
    A IUCN classifica-o globalmente como quase ameaçado (NT). No inverno, observe os bandos com telescópio a
    partir dos caminhos sem entrar em parcelas nem provocar o seu voo.
