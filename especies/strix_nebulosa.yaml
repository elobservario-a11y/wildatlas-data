id: strix_nebulosa
nombre_cientifico: Strix nebulosa
nombre:
  es: Cárabo lapón
  en: Great grey owl
  fr: Chouette lapone
  de: Bartkauz
  it: Allocco della Lapponia
  pt: Coruja-lapónica
descripcion:
  es: >-
    Gran búho de bosques boreales próximos a prados y turberas del norte europeo. La IUCN la clasifica
    globalmente como preocupación menor (LC). Cuando cace en claros, obsérvalo a distancia con prismáticos sin
    utilizar cebos, reproducir cantos ni acercarte a crías.
  en: >-
    Large owl of boreal forests near meadows and peatlands in northern Europe. The IUCN classifies it globally
    as Least Concern (LC). When hunting in clearings, watch from afar with binoculars without using bait,
    playing back calls or approaching young.
  fr: >-
    Grande chouette des forêts boréales proches des prairies et tourbières du nord de l'Europe. L'UICN la
    classe globalement en préoccupation mineure (LC). Lorsqu'elle chasse dans les clairières, observez-la à
    distance aux jumelles sans utiliser d'appâts, diffuser de chants ni vous approcher des jeunes.
  de: >-
    Große Eule borealer Wälder nahe Wiesen und Mooren Nordeuropas. Die IUCN stuft ihn weltweit als nicht
    gefährdet (LC) ein. Wenn er auf Lichtungen jagt, beobachten Sie ihn aus der Ferne mit dem Fernglas, ohne
    Köder auszulegen, Rufe abzuspielen oder sich Jungvögeln zu nähern.
  it: >-
    Grande gufo delle foreste boreali prossime a prati e torbiere dell'Europa settentrionale. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Quando caccia nelle radure, osservalo a distanza
    con il binocolo senza usare esche, riprodurre canti né avvicinarti ai piccoli.
  pt: >-
    Grande coruja de florestas boreais próximas de prados e turfeiras do norte europeu. A IUCN classifica-a
    globalmente como pouco preocupante (LC). Quando caça em clareiras, observe-a à distância com binóculos sem
    usar iscos, reproduzir cantos nem se aproximar das crias.
