id: canis_lupus
nombre_cientifico: Canis lupus
nombre:
  es: Lobo
  en: Grey wolf
  fr: Loup
  de: Wolf
  it: Lupo grigio
  pt: Lobo-cinzento
descripcion:
  es: >-
    Cánido social que ocupa bosques, montañas y paisajes abiertos en distintas regiones de Europa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Para observarlo, espera a distancia en espacios
    abiertos sin usar cebos ni buscar madrigueras.
  en: >-
    Social canid occupying forests, mountains and open landscapes across different regions of Europe. The IUCN
    classifies it globally as Least Concern (LC). To observe it, wait at a distance in open areas without
    using bait or searching for dens.
  fr: >-
    Canidé social occupant forêts, montagnes et paysages ouverts dans différentes régions d'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). Pour l'observer, attendez à distance dans des espaces
    ouverts sans utiliser d'appâts ni chercher de tanières.
  de: >-
    Sozial lebender Wildhund, der Wälder, Gebirge und offene Landschaften in verschiedenen Regionen Europas
    besiedelt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Um ihn zu beobachten, warten Sie aus
    der Ferne in offenen Bereichen, ohne Köder auszulegen oder nach Wurfbauen zu suchen.
  it: >-
    Canide sociale che occupa foreste, montagne e paesaggi aperti in diverse regioni d'Europa. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Per osservalo, attendi a distanza negli spazi
    aperti senza usare esche né cercare tane.
  pt: >-
    Canídeo social que ocupa florestas, montanhas e paisagens abertas em diferentes regiões da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Para o observar, aguarde à distância em espaços
    abertos sem usar iscos nem procurar tocas.
