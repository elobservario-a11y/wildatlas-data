id: pelecanus_onocrotalus
nombre_cientifico: Pelecanus onocrotalus
nombre:
  es: Pelícano común
  en: Great white pelican
  fr: Pélican blanc
  de: Rosapelikan
  it: Pellicano comune
  pt: Pelicano-branco
descripcion:
  es: >-
    Gran ave acuática que cría en humedales del sureste europeo, con núcleos destacados en el delta del
    Danubio. La IUCN la clasifica globalmente como preocupación menor (LC). Durante la estación reproductora,
    observa los grupos pescando desde miradores sin acercarte en barco a colonias.
  en: >-
    Large waterbird breeding in wetlands of south-eastern Europe, with notable strongholds in the Danube
    Delta. The IUCN classifies it globally as Least Concern (LC). During the breeding season, watch groups
    fishing from viewpoints without approaching colonies by boat.
  fr: >-
    Grand oiseau aquatique qui niche dans les zones humides du sud-est de l'Europe, avec des noyaux
    remarquables dans le delta du Danube. L'UICN le classe globalement en préoccupation mineure (LC). Pendant
    la saison de reproduction, observez les groupes pêcher depuis les belvédères sans vous approcher des
    colonies en bateau.
  de: >-
    Großer Wasservogel, der in Feuchtgebieten Südosteuropas brütet, mit bedeutenden Vorkommen im Donaudelta.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie zur Brutzeit Trupps beim Fischen
    von Aussichtspunkten aus, ohne sich Kolonien mit dem Boot zu nähern.
  it: >-
    Grande uccello acquatico che nidifica nelle zone umide dell'Europa sud-orientale, con nuclei importanti
    nel delta del Danubio. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante la
    stagione riproduttiva, osserva i gruppi che pescano dai punti panoramici senza avvicinarti in barca alle
    colonie.
  pt: >-
    Grande ave aquática que nidifica em zonas húmidas do sudeste europeu, com núcleos destacados no delta do
    Danúbio. A IUCN classifica-o globalmente como pouco preocupante (LC). Durante a época reprodutora, observe
    os grupos a pescar a partir de miradouros sem se aproximar de barco das colónias.
