id: equus_ferus
nombre_cientifico: Equus ferus
nombre:
  es: Caballo de Przewalski
  en: Asian wild horse
  fr: Cheval de Przewalski
  de: Wildpferd
descripcion:
  es: >-
    Équido de preferencia por ambientes abiertos, cuyo concepto incluye caballos silvestres históricos de
    Europa y el caballo de Przewalski. La IUCN la clasifica globalmente como en peligro (EN). Observa los
    grupos de conservación durante el pastoreo desde recorridos autorizados, sin ofrecer alimento ni acercarte
    a potros.
  en: >-
    Equid preferring open habitats, a concept encompassing historic wild horses of Europe and Przewalski's
    horse. The IUCN classifies it globally as Endangered (EN). Watch conservation herds grazing from
    authorised routes, without offering food or approaching foals.
  fr: >-
    Équidé affectionnant les milieux ouverts, un concept qui englobe les chevaux sauvages historiques d'Europe
    et le cheval de Przewalski. L'UICN le classe globalement en danger (EN). Observez les troupeaux de
    conservation au pâturage depuis les parcours autorisés, sans donner de nourriture ni vous approcher des
    poulains.
  de: >-
    Equide offener Lebensräume, dessen Begriff historische Wildpferde Europas sowie das Przewalski-Pferd
    umfasst. Die IUCN stuft ihn weltweit als stark gefährdet (EN) ein. Beobachten Sie Erhaltungsbestände beim
    Grasen von zugelassenen Wegen aus, ohne Futter anzubieten oder sich Fohlen zu nähern.
