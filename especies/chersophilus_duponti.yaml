id: chersophilus_duponti
nombre_cientifico: Chersophilus duponti
nombre:
  es: Alondra ricotí
  en: Dupont's lark
  fr: Alouette de Dupont
  de: Dupontlerche
  it: Allodola di Dupont
  pt: Calhandra-de-dupont
descripcion:
  es: >-
    Pequeña alondra de estepas y matorrales bajos, cuya presencia europea se concentra en España. La IUCN la
    clasifica globalmente como vulnerable (VU). Al amanecer o al atardecer, escucha desde caminos sin usar
    reclamos, salir del sendero ni seguir al ave.
  en: >-
    Small lark of steppes and low scrubland, whose European presence is concentrated in Spain. The IUCN
    classifies it globally as Vulnerable (VU). At dawn or dusk, listen from tracks without using playback,
    leaving the path or following the bird.
  fr: >-
    Petite alouette des steppes et garrigues basses, dont la présence européenne se concentre en Espagne.
    L'UICN la classe globalement comme vulnérable (VU). À l'aube ou au crépuscule, écoutez depuis les chemins
    sans utiliser d'appeaux, quitter le sentier ni suivre l'oiseau.
  de: >-
    Kleine Lerche der Steppen und niedrigen Zwergstrauchheiden, deren europäisches Vorkommen sich auf Spanien
    konzentriert. Die IUCN stuft sie weltweit als gefährdet (VU) ein. Lauschen Sie in der Morgen- oder
    Abenddämmerung von Wegen aus, ohne Klangattrappen zu nutzen, den Pfad zu verlassen oder dem Vogel zu
    folgen.
  it: >-
    Piccola allodola di steppe e garighe basse, la cui presenza europea si concentra in Spagna. La IUCN la
    classifica a livello globale come vulnerabile (VU). All'alba o al tramonto, ascolta dai sentieri senza
    usare richiami, uscire dal tracciato né seguire l'uccello.
  pt: >-
    Pequena calhandra de estepes e matagais baixos, cuja presença europeia se concentra em Espanha. A IUCN
    classifica-a globalmente como vulnerável (VU). Ao amanhecer ou ao entardecer, escute a partir dos caminhos
    sem usar chamarizes, sair do trilho nem seguir a ave.
