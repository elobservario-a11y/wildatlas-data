id: pluvialis_apricaria
nombre_cientifico: Pluvialis apricaria
nombre:
  es: Chorlito dorado europeo
  en: European golden plover
  fr: Pluvier doré
  de: Goldregenpfeifer
  it: Piviere dorato
  pt: Tarambola-dourada-europeia
descripcion:
  es: >-
    Limícola que cría en tundras y brezales del norte europeo y pasa el invierno en regiones más templadas. La
    IUCN la clasifica globalmente como preocupación menor (LC). En otoño e invierno, observa los bandos de
    campos y humedales desde caminos sin hacerlos levantar.
  en: >-
    Wader breeding on tundras and heathlands of northern Europe and wintering in more temperate regions. The
    IUCN classifies it globally as Least Concern (LC). In autumn and winter, watch flocks in fields and
    wetlands from tracks without flushing them.
  fr: >-
    Limicole qui niche dans les toundras et landes du nord de l'Europe et hiverne dans des régions plus
    tempérées. L'UICN le classe globalement en préoccupation mineure (LC). En automne et en hiver, observez
    les groupes dans les champs et zones humides depuis les chemins sans les faire décoller.
  de: >-
    Watvogel, der in Tundren und Heiden Nordeuropas brütet und in gemäßigteren Regionen überwintert. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps im Herbst und Winter auf Feldern
    und in Feuchtgebieten von Wegen aus, ohne sie aufzuscheuchen.
  it: >-
    Limicolo che nidifica in tundre e brughiere dell'Europa settentrionale e sverna in regioni più temperate.
    La IUCN lo classifica a livello globale come a rischio minimo (LC). In autunno e in inverno, osserva gli
    stormi nei campi e nelle zone umide dai sentieri senza farli involare.
  pt: >-
    Limícola que nidifica em tundras e urzais do norte europeu e passa o inverno em regiões mais temperadas. A
    IUCN classifica-a globalmente como pouco preocupante (LC). No outono e no inverno, observe os bandos de
    campos e zonas húmidas a partir dos caminhos sem os fazer levantar voo.
