id: tursiops_truncatus
nombre_cientifico: Tursiops truncatus
nombre:
  es: Delfín mular
  en: Common bottlenose dolphin
  fr: Grand dauphin
  de: Großer Tümmler
  it: Tursìope
  pt: Golfinho-comum
descripcion:
  es: >-
    Delfín de aguas templadas, presente en costas atlánticas europeas y en el Mediterráneo. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvalo al salir a respirar desde costa o
    embarcaciones responsables, sin perseguir los grupos ni ofrecerles alimento.
  en: >-
    Dolphin of temperate waters, present along European Atlantic coasts and in the Mediterranean. The IUCN
    classifies it globally as Least Concern (LC). Watch it surfacing to breathe from shore or responsible
    boats, without chasing pods or offering food.
  fr: >-
    Dauphin des eaux tempérées, présent sur les côtes atlantiques européennes et en Méditerranée. L'UICN le
    classe globalement en préoccupation mineure (LC). Observez-le lorsqu'il vient respirer depuis la côte ou
    des embarcations responsables, sans poursuivre les groupes ni leur donner de nourriture.
  de: >-
    Delfin gemäßigter Gewässer, der an europäischen Atlantikküsten und im Mittelmeer vorkommt. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn beim Auftauchen zum Atmen von der Küste oder
    von verantwortungsvollen Booten aus, ohne Gruppen zu verfolgen oder zu füttern.
  it: >-
    Delfino delle acque temperate, presente lungo le coste atlantiche europee e nel Mediterraneo. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Osservalo quando emerge per respirare dalla costa
    o da imbarcazioni responsabili, senza inseguire i gruppi né offrire cibo.
  pt: >-
    Golfinho de águas temperadas, presente em costas atlânticas europeias e no Mediterrâneo. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Observe-o ao vir à superfície para respirar a partir
    da costa ou de embarcações responsáveis, sem perseguir os grupos nem lhes oferecer alimento.
