id: glaucidium_passerinum
nombre_cientifico: Glaucidium passerinum
nombre:
  es: Mochuelo chico
  en: Eurasian pygmy owlet
  fr: Chevêchette d'Europe
  de: Sperlingskauz
  it: Civetta nana
  pt: Mocho-pigmeu
descripcion:
  es: >-
    Pequeño búho de bosques boreales y montanos de coníferas del norte y centro de Europa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Búscalo cerca del amanecer o atardecer desde senderos,
    sin reproducir cantos ni acercarte a cavidades.
  en: >-
    Small owl of boreal and montane conifer forests of northern and central Europe. The IUCN classifies it
    globally as Least Concern (LC). Look for it around dawn or dusk from trails, without playing back calls or
    approaching cavities.
  fr: >-
    Petite chouette des forêts boréales et montagnardes de conifères du nord et du centre de l'Europe. L'UICN
    la classe globalement en préoccupation mineure (LC). Recherchez-la vers l'aube ou le crépuscule depuis les
    sentiers, sans diffuser de chants ni vous approcher des cavités.
  de: >-
    Kleine Eule borealer und montaner Nadelwälder Nord- und Mitteleuropas. Die IUCN stuft sie weltweit als
    nicht gefährdet (LC) ein. Suchen Sie sie in der Morgen- oder Abenddämmerung von Wegen aus, ohne Rufe
    abzuspielen oder sich Höhlen zu nähern.
  it: >-
    Piccolo gufo delle foreste boreali e montane di conifere dell'Europa settentrionale e centrale. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Cercala intorno all'alba o al tramonto dai
    sentieri, senza riprodurre canti né avvicinarti alle cavità.
  pt: >-
    Pequena coruja de florestas boreais e montanas de coníferas do norte e centro da Europa. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Procure-a perto do amanhecer ou do entardecer a
    partir dos trilhos, sem reproduzir cantos nem se aproximar de cavidades.
