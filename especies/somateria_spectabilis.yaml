id: somateria_spectabilis
nombre_cientifico: Somateria spectabilis
nombre:
  es: Eider real
  en: King eider
  fr: Eider à tête grise
  de: Prachteiderente
  it: Re degli edredoni
  pt: Êider-real
descripcion:
  es: >-
    Pato marino de costas árticas, con presencia en Svalbard y el norte europeo y uso de aguas subárticas en
    invierno. La IUCN la clasifica globalmente como preocupación menor (LC). Durante la invernada, observa
    grupos desde miradores costeros con telescopio sin acercarte en barco ni provocar desplazamientos.
  en: >-
    Sea duck of Arctic coasts, present in Svalbard and northern Europe and using subarctic waters in winter.
    The IUCN classifies it globally as Least Concern (LC). During wintering, watch flocks from coastal
    viewpoints with a scope without approaching by boat or causing disturbance.
  fr: >-
    Canard marin des côtes arctiques, présent au Svalbard et dans le nord de l'Europe et fréquentant les eaux
    subarctiques en hiver. L'UICN le classe globalement en préoccupation mineure (LC). En hivernage, observez
    les groupes depuis les belvédères côtiers à la longue-vue sans vous approcher en bateau ni provoquer de
    dérangement.
  de: >-
    Meeresente arktischer Küsten mit Vorkommen auf Spitzbergen und in Nordeuropa, die im Winter subarktische
    Gewässer nutzt. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps im Winter
    von Küsten-Aussichtspunkten aus mit dem Spektiv, ohne sich im Boot zu nähern oder Störungen auszulösen.
  it: >-
    Anatra marina delle coste artiche, presente alle Svalbard e nel nord Europa e frequentatrice di acque
    subartiche in inverno. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante lo
    svernamento, osserva i gruppi dai punti panoramici costieri con il cannocchiale senza avvicinarti in barca
    né provocare spostamenti.
  pt: >-
    Pato marinho de costas árticas, presente em Svalbard e no norte europeu e utilizando águas subárticas no
    inverno. A IUCN classifica-o globalmente como pouco preocupante (LC). Durante a invernada, observe grupos
    a partir de miradouros costeiros com telescópio sem se aproximar de barco nem provocar deslocações.
