id: podarcis_pityusensis
nombre_cientifico: Podarcis pityusensis
nombre:
  es: Lagartija de las Pitiusas
  en: Ibiza wall lizard
  fr: Lézard des Pityuses
  de: Pityusen-Eidechse
descripcion:
  es: >-
    Lagartija de matorrales, roquedos y otros ambientes abiertos de las Pitiusas, también introducida en otras
    zonas mediterráneas. La IUCN la clasifica globalmente como en peligro (EN). Durante el día en la estación
    templada, obsérvala sin cogerla, alimentarla ni levantar piedras o refugios.
  en: >-
    Lizard of scrubland, rocks and other open habitats of the Pityusic Islands, also introduced elsewhere in
    the Mediterranean. The IUCN classifies it globally as Endangered (EN). During the day in the mild season,
    watch it without catching, feeding it or lifting stones and shelters.
  fr: >-
    Lézard des maquis, rochers et autres milieux ouverts des Pityuses, également introduit dans d'autres zones
    méditerranéennes. L'UICN le classe globalement en danger (EN). De jour à la belle saison, observez-le sans
    le saisir, le nourrir ni soulever de pierres ou d'abris.
  de: >-
    Eidechse der Gebüsche, Felsen und anderer offener Lebensräume der Pityusen, die auch in weiteren
    Mittelmeerräumen eingeführt wurde. Die IUCN stuft sie weltweit als stark gefährdet (EN) ein. Beobachten
    Sie sie tagsüber in der warmen Jahreszeit, ohne sie zu fangen, zu füttern oder Steine und Verstecke
    anzuheben.
