id: rhodostethia_rosea
nombre_cientifico: Rhodostethia rosea
nombre:
  es: Gaviota rosada
  en: Ross's gull
  fr: Mouette rosée
  de: Rosenmöwe
  it: Gabbiano di Ross
  pt: Gaivota-rosada
descripcion:
  es: >-
    Pequeña gaviota de tundras, estuarios y mares árticos, de aparición ocasional fuera de sus regiones
    septentrionales habituales. La IUCN la clasifica globalmente como preocupación menor (LC). Ante una
    aparición en costas europeas, obsérvala a distancia con telescopio sin perseguirla ni ofrecer alimento.
  en: >-
    Small gull of Arctic tundras, estuaries and seas, appearing occasionally outside its usual northern range.
    The IUCN classifies it globally as Least Concern (LC). When it appears on European coasts, watch through a
    scope from afar without chasing it or offering food.
  fr: >-
    Petite mouette des toundras, estuaires et mers arctiques, d'apparition occasionnelle hors de ses régions
    septentrionales habituelles. L'UICN la classe globalement en préoccupation mineure (LC). Lors d'une
    observation sur les côtes européennes, regardez-la à distance à la longue-vue sans la poursuivre ni lui
    donner de nourriture.
  de: >-
    Kleine Möwe arktischer Tundren, Flussmündungen und Meere, die gelegentlich außerhalb ihrer gewohnten
    nördlichen Gebiete erscheint. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Bei einem
    Auftreten an europäischen Küsten beobachten Sie sie aus der Ferne mit dem Spektiv, ohne sie zu verfolgen
    oder zu füttern.
  it: >-
    Piccolo gabbiano di tundre, estuari e mari artici, di comparsa occasionale al di fuori delle sue regioni
    settentrionali abituali. La IUCN lo classifica a livello globale come a rischio minimo (LC). In caso di
    comparsa sulle coste europee, osservalo a distanza con il cannocchiale senza inseguirlo né offrire cibo.
  pt: >-
    Pequena gaivota de tundras, estuários e mares árticos, de aparecimento ocasional fora das suas regiões
    setentrionais habituais. A IUCN classifica-a globalmente como pouco preocupante (LC). Perante uma aparição
    nas costas europeias, observe-a à distância com telescópio sem a perseguir nem oferecer alimento.
