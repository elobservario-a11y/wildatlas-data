id: aegypius_monachus
nombre_cientifico: Aegypius monachus
nombre:
  es: Buitre negro
  en: Cinereous vulture
  fr: Vautour moine
  de: Mönchsgeier
  it: Avvoltoio monaco
  pt: Abutre-preto
descripcion:
  es: >-
    Gran necrófaga de montes arbolados y paisajes abiertos de la península ibérica y otras regiones del sur
    europeo. La IUCN la clasifica globalmente como casi amenazada (NT). Obsérvala durante sus vuelos de
    búsqueda desde miradores, sin acercarte a árboles con nidos ni usar cebos.
  en: >-
    Large scavenger of wooded hills and open landscapes of the Iberian Peninsula and other parts of southern
    Europe. The IUCN classifies it globally as Near Threatened (NT). Observe it during foraging flights from
    viewpoints, without approaching nesting trees or using bait.
  fr: >-
    Grand charognard des massifs boisés et paysages ouverts de la péninsule Ibérique et d'autres régions du
    sud de l'Europe. L'UICN le classe globalement quasi menacé (NT). Observez-le en vol de recherche depuis
    les belvédères, sans vous approcher des arbres abritant des nids ni utiliser d'appâts.
  de: >-
    Großer Aasfresser bewaldeter Berglandschaften und offener Regionen der Iberischen Halbinsel und anderer
    Teile Südeuropas. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie ihn bei
    Suchflügen von Aussichtspunkten aus, ohne sich Nistbäumen zu nähern oder Köder auszulegen.
  it: >-
    Grande necrofago di rilievi boscati e paesaggi aperti della penisola iberica e di altre regioni
    dell'Europa meridionale. La IUCN lo classifica a livello globale come prossimo alla minaccia (NT).
    Osservalo durante i voli di ricerca dai punti panoramici, senza avvicinarti agli alberi con nidi né usare
    esche.
  pt: >-
    Grande necrófago de montes arborizados e paisagens abertas da Península Ibérica e de outras regiões do sul
    da Europa. A IUCN classifica-o globalmente como quase ameaçado (NT). Observe-o durante os voos de procura
    a partir de miradouros, sem se aproximar de árvores com ninhos nem usar iscos.
