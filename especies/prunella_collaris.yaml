id: prunella_collaris
nombre_cientifico: Prunella collaris
nombre:
  es: Acentor alpino
  en: Alpine accentor
  fr: Accenteur alpin
  de: Alpenbraunelle
  it: Sordone
  pt: Ferreirinha-alpina
descripcion:
  es: >-
    Pequeña ave de roquedos y praderas de alta montaña, presente en distintas cordilleras europeas. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante recorridos diurnos, observa sus movimientos
    desde senderos sin ofrecer comida ni acercarte a nidos.
  en: >-
    Small bird of high-mountain crags and meadows, present in several European mountain ranges. The IUCN
    classifies it globally as Least Concern (LC). During daytime walks, watch its movements from trails
    without offering food or approaching nests.
  fr: >-
    Petit oiseau des rochers et pelouses de haute montagne, présent dans différents massifs européens. L'UICN
    le classe globalement en préoccupation mineure (LC). Lors de randonnées diurnes, observez ses déplacements
    depuis les sentiers sans donner de nourriture ni vous approcher des nids.
  de: >-
    Kleiner Vogel von Felsfluren und Matten des Hochgebirges, der in verschiedenen europäischen Gebirgen
    vorkommt. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie bei Tageswanderungen
    seine Bewegungen von Wegen aus, ohne zu füttern oder sich Nestern zu nähern.
  it: >-
    Piccolo uccello di pareti rocciose e praterie d'alta montagna, presente in diverse catene montuose
    europee. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante le escursioni diurne,
    osserva i suoi spostamenti dai sentieri senza offrire cibo né avvicinarti ai nidi.
  pt: >-
    Pequena ave de rochedos e prados de alta montanha, presente em várias cordilheiras europeias. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Durante percursos diurnos, observe os seus
    movimentos a partir dos trilhos sem oferecer comida nem se aproximar de ninhos.
