id: ardea_cinerea
nombre_cientifico: Ardea cinerea
nombre:
  es: Garza real
  en: Grey heron
  fr: Héron cendré
  de: Graureiher
  it: Airone cenerino
  pt: Garça-real-europeia
descripcion:
  es: >-
    Garza de ríos, lagos, marismas y otras aguas someras de gran parte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Obsérvala cuando pesque desde caminos y observatorios sin
    seguirla por las orillas ni acercarte a colonias.
  en: >-
    Heron of rivers, lakes, marshes and other shallow waters across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). Watch it fishing from tracks and hides without following it along banks or
    approaching colonies.
  fr: >-
    Héron des rivières, lacs, marais et autres eaux peu profondes d'une grande partie de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). Observez-le pêcher depuis les chemins et observatoires
    sans le suivre le long des berges ni vous approcher des colonies.
  de: >-
    Reiher an Flüssen, Seen, Sümpfen und anderen Flachgewässern in weiten Teilen Europas. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn bei der Nahrungssuche von Wegen und
    Beobachtungshütten aus, ohne ihm am Ufer zu folgen oder sich Kolonien zu nähern.
  it: >-
    Airone di fiumi, laghi, paludi e altre acque basse di gran parte d'Europa. La IUCN lo classifica a livello
    globale come a rischio minimo (LC). Osservalo mentre pesca dai sentieri e dagli appostamenti senza
    seguirlo lungo le sponde né avvicinarti alle colonie.
  pt: >-
    Garça de rios, lagos, sapais e outras águas pouco profundas de grande parte da Europa. A IUCN classifica-a
    globalmente como pouco preocupante (LC). Observe-a enquanto pesca a partir de caminhos e observatórios sem
    a seguir pelas margens nem se aproximar de colónias.
