id: rupicapra_rupicapra
nombre_cientifico: Rupicapra rupicapra
nombre:
  es: Rebeco
  en: Chamois
  fr: Chamois
  de: Gämse
  it: Camoscio alpino
  pt: Camurça
descripcion:
  es: >-
    Ungulado de roquedos, bosques montanos y praderas de los Alpes, Cárpatos y montañas balcánicas. La IUCN la
    clasifica globalmente como preocupación menor (LC). Búscalo durante el día con prismáticos desde senderos,
    sin perseguirlo por laderas ni bloquear sus pasos.
  en: >-
    Ungulate of crags, montane forests and meadows of the Alps, Carpathians and Balkan mountains. The IUCN
    classifies it globally as Least Concern (LC). Look for it during the day with binoculars from trails,
    without chasing it across slopes or blocking its passes.
  fr: >-
    Ongulé des rochers, forêts montagnardes et pelouses des Alpes, des Carpates et des montagnes balkaniques.
    L'UICN le classe globalement en préoccupation mineure (LC). Cherchez-le de jour aux jumelles depuis les
    sentiers, sans le poursuivre sur les pentes ni bloquer ses passages.
  de: >-
    Huftier der Felsen, Bergwälder und Matten der Alpen, Karpaten und Balkangebirge. Die IUCN stuft sie
    weltweit als nicht gefährdet (LC) ein. Suchen Sie sie tagsüber mit dem Fernglas von Wegen aus, ohne sie an
    Hängen zu verfolgen oder ihre Pässe zu versperren.
  it: >-
    Ungulato di pareti rocciose, foreste montane e praterie delle Alpi, dei Carpazi e dei monti balcanici. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Cercalo durante il giorno con il binocolo
    dai sentieri, senza inseguirlo sui pendii né bloccarne i passaggi.
  pt: >-
    Ungulado de rochedos, florestas montanas e prados dos Alpes, Cárpatos e montanhas balcânicas. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Procure-a durante o dia com binóculos a partir dos
    trilhos, sem a perseguir pelas encostas nem bloquear as suas passagens.
