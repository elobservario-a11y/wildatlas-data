id: strix_uralensis
nombre_cientifico: Strix uralensis
nombre:
  es: Cárabo uralense
  en: Ural owl
  fr: Chouette de l'Oural
  de: Habichtskauz
  it: Allocco degli Urali
  pt: Coruja-dos-urais
descripcion:
  es: >-
    Búho de bosques boreales y montanos del norte, centro y este de Europa. La IUCN la clasifica globalmente
    como preocupación menor (LC). Al atardecer, escucha desde senderos sin usar reclamos, iluminar aves ni
    acercarte a cavidades o crías.
  en: >-
    Owl of boreal and montane forests in northern, central and eastern Europe. The IUCN classifies it globally
    as Least Concern (LC). At dusk, listen from trails without using playback, shining lights on birds or
    approaching cavities or young.
  fr: >-
    Chouette des forêts boréales et montagnardes du nord, du centre et de l'est de l'Europe. L'UICN la classe
    globalement en préoccupation mineure (LC). À la tombée du jour, écoutez depuis les sentiers sans utiliser
    d'appeaux, éclairer les oiseaux ni vous approcher des cavités ou des jeunes.
  de: >-
    Eule borealer und montaner Wälder Nord-, Mittel- und Osteuropas. Die IUCN stuft ihn weltweit als nicht
    gefährdet (LC) ein. Lauschen Sie in der Dämmerung von Wegen aus, ohne Klangattrappen zu nutzen, Vögel
    anzuleuchten oder sich Höhlen und Jungvögeln zu nähern.
  it: >-
    Gufo delle foreste boreali e montane dell'Europa settentrionale, centrale e orientale. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Al tramonto, ascolta dai sentieri senza usare
    richiami, illuminare gli uccelli né avvicinarti a cavità o piccoli.
  pt: >-
    Coruja de florestas boreais e montanas do norte, centro e leste da Europa. A IUCN classifica-a globalmente
    como pouco preocupante (LC). Ao entardecer, escute a partir dos trilhos sem usar chamarizes, iluminar aves
    nem se aproximar de cavidades ou crias.
