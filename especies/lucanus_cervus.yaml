id: lucanus_cervus
nombre_cientifico: Lucanus cervus
nombre:
  es: Ciervo volante
  en: Stag beetle
  fr: Lucane cerf-volant
  de: Hirschkäfer
descripcion:
  es: >-
    Escarabajo ligado a árboles y madera en descomposición, ampliamente distribuido por Europa. La evaluación
    europea de la IUCN lo clasifica como casi amenazado (NT), sin categoría global verificada aquí. En verano,
    observa los adultos al atardecer sin capturarlos, mover madera ni abrir sus refugios.
  en: >-
    Beetle linked to trees and decaying wood, widely distributed across Europe. The European IUCN assessment
    classifies it as Near Threatened (NT), with no global category verified here. In summer, watch adults at
    dusk without catching them, moving wood or opening shelters.
  fr: >-
    Coléoptère lié aux arbres et au bois en décomposition, largement répandu en Europe. L'évaluation
    européenne de l'UICN le classe quasi menacé (NT), sans catégorie mondiale vérifiée ici. En été, observez
    les adultes au crépuscule sans les capturer, déplacer de bois ni ouvrir leurs abris.
  de: >-
    Käfer, der an Bäume und Totholz gebunden und in Europa weit verbreitet ist. Die europäische IUCN-Bewertung
    stuft ihn als potenziell gefährdet (NT) ein, ohne dass hier eine globale Kategorie vorliegt. Beobachten
    Sie im Sommer die Alttiere in der Dämmerung, ohne sie zu fangen, Holz zu bewegen oder Verstecke zu öffnen.
