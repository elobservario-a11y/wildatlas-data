id: vipera_ursinii
nombre_cientifico: Vipera ursinii
nombre:
  es: Víbora de Orsini
  en: Orsinis viper
  fr: Vipère d'Orsini
  de: Wiesenotter
descripcion:
  es: >-
    Pequeña víbora de praderas y otros medios abiertos, distribuida de forma fragmentada por el sur y este
    europeo. La IUCN la clasifica globalmente como vulnerable (VU). Durante la estación activa, obsérvala
    desde senderos sin capturarla, perseguirla ni levantar piedras para localizarla.
  en: >-
    Small viper of meadows and other open habitats, discontinuously distributed in southern and eastern
    Europe. The IUCN classifies it globally as Vulnerable (VU). During the active season, watch from trails
    without catching, chasing it or lifting stones to locate it.
  fr: >-
    Petite vipère des prairies et autres milieux ouverts, répartie de façon fragmentée dans le sud et l'est de
    l'Europe. L'UICN la classe globalement comme vulnérable (VU). Pendant la saison active, observez-la depuis
    les sentiers sans la capturer, la poursuivre ni soulever de pierres pour la localiser.
  de: >-
    Kleine Viper von Wiesen und anderen offenen Lebensräumen, lückenhaft in Süd- und Osteuropa verbreitet. Die
    IUCN stuft sie weltweit als gefährdet (VU) ein. Beobachten Sie sie während der aktiven Zeit von Wegen aus,
    ohne sie zu fangen, zu verfolgen oder zur Suche Steine anzuheben.
