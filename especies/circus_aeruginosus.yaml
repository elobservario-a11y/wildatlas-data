id: circus_aeruginosus
nombre_cientifico: Circus aeruginosus
nombre:
  es: Aguilucho lagunero
  en: Western marsh harrier
  fr: Busard des roseaux
  de: Rohrweihe
  it: Falco di palude
  pt: Tartaranhão-ruivo-dos-pauis
descripcion:
  es: >-
    Rapaz ligada a carrizales y otros humedales, extendida por gran parte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). De día, observa sus vuelos sobre la vegetación palustre desde
    miradores, sin entrar en carrizales ni acercarte a nidos.
  en: >-
    Raptor linked to reedbeds and other wetlands, widespread across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). During the day, watch its flights over marsh vegetation from viewpoints,
    without entering reedbeds or approaching nests.
  fr: >-
    Rapace lié aux roselières et autres zones humides, répandu dans une grande partie de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). De jour, observez ses vols au-dessus de la végétation
    palustre depuis les belvédères, sans entrer dans les roselières ni vous approcher des nids.
  de: >-
    Greifvogel von Schilfgürteln und anderen Feuchtgebieten, der in weiten Teilen Europas verbreitet ist. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber seine Flüge über der
    Sumpfvegetation von Aussichtspunkten aus, ohne Schilfflächen zu betreten oder sich Nestern zu nähern.
  it: >-
    Rapace legato ai canneti e ad altre zone umide, diffuso in gran parte d'Europa. La IUCN lo classifica a
    livello globale come a rischio minimo (LC). Di giorno, osserva i suoi voli sopra la vegetazione palustre
    dai punti panoramici, senza entrare nei canneti né avvicinarti ai nidi.
  pt: >-
    Ave de rapina ligada a caniços e outras zonas húmidas, distribuída por grande parte da Europa. A IUCN
    classifica-a globalmente como pouco preocupante (LC). De dia, observe os seus voos sobre a vegetação
    palustre a partir de miradouros, sem entrar em caniços nem se aproximar de ninhos.
