id: cyanopica_cooki
nombre_cientifico: Cyanopica cooki
nombre:
  es: Rabilargo ibérico
  en: Iberian magpie
  fr: Pie-bleue ibérique
  de: Blauelster
  it: Gazza aliazzurre iberica
  pt: Pega-azul-ibérica
descripcion:
  es: >-
    Córvido social de bosques abiertos y otros paisajes arbolados de la península ibérica. La IUCN la
    clasifica globalmente como preocupación menor (LC). De día, observa los bandos desde caminos sin
    reproducir reclamos ni ofrecer comida.
  en: >-
    Social corvid of open woodlands and other wooded landscapes of the Iberian Peninsula. The IUCN classifies
    it globally as Least Concern (LC). During the day, watch flocks from tracks without playing back calls or
    offering food.
  fr: >-
    Corvidé social des boisements clairs et autres paysages arborés de la péninsule Ibérique. L'UICN le classe
    globalement en préoccupation mineure (LC). De jour, observez les groupes depuis les chemins sans diffuser
    d'appeaux ni donner de nourriture.
  de: >-
    Geselliger Rabenvogel lichter Wälder und anderer baumbestandener Landschaften der Iberischen Halbinsel.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps tagsüber von Wegen aus,
    ohne Rufe abzuspielen oder Futter anzubieten.
  it: >-
    Corvide sociale di boschi radi e altri paesaggi alberati della penisola iberica. La IUCN la classifica a
    livello globale come a rischio minimo (LC). Di giorno, osserva gli stormi dai sentieri senza riprodurre
    richiami né offrire cibo.
  pt: >-
    Corvídeo social de florestas abertas e outras paisagens arborizadas da Península Ibérica. A IUCN
    classifica-a globalmente como pouco preocupante (LC). De dia, observe os bandos a partir dos caminhos sem
    reproduzir chamarizes nem oferecer comida.
