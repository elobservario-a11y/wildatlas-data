id: capra_pyrenaica
nombre_cientifico: Capra pyrenaica
nombre:
  es: Cabra montés
  en: Spanish ibex
  fr: Bouquetin d'Espagne
  de: Iberiensteinbock
descripcion:
  es: >-
    Cabra silvestre de sierras y roquedos de la península ibérica. La IUCN la clasifica globalmente como
    preocupación menor (LC). Obsérvala cuando paste o se desplace por laderas con prismáticos desde senderos,
    sin acercarte ni ofrecer alimento.
  en: >-
    Wild goat of mountain ranges and rocky crags of the Iberian Peninsula. The IUCN classifies it globally as
    Least Concern (LC). Watch it grazing or moving across slopes with binoculars from trails, without
    approaching or offering food.
  fr: >-
    Bouquetin des massifs et parois rocheuses de la péninsule Ibérique. L'UICN le classe globalement en
    préoccupation mineure (LC). Observez-le pâturer ou se déplacer sur les pentes aux jumelles depuis les
    sentiers, sans vous approcher ni lui donner de nourriture.
  de: >-
    Wildziege der Gebirge und Felswände der Iberischen Halbinsel. Die IUCN stuft sie weltweit als nicht
    gefährdet (LC) ein. Beobachten Sie sie beim Äsen oder Klettern an Hängen mit dem Fernglas von Wegen aus,
    ohne sich zu nähern oder zu füttern.
