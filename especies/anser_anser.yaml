id: anser_anser
nombre_cientifico: Anser anser
nombre:
  es: Ánsar común
  en: Greylag goose
  fr: Oie cendrée
  de: Graugans
  it: Oca selvatica
  pt: Ganso-bravo
descripcion:
  es: >-
    Ganso de lagos, marismas y praderas húmedas, con poblaciones residentes y migratorias en Europa. La IUCN
    la clasifica globalmente como preocupación menor (LC). Durante la migración y la invernada, observa bandos
    desde observatorios sin acercarte a dormideros ni hacerlos levantar.
  en: >-
    Goose of lakes, marshes and damp meadows, with resident and migratory populations across Europe. The IUCN
    classifies it globally as Least Concern (LC). During migration and wintering, watch flocks from hides
    without approaching roosts or flushing them.
  fr: >-
    Oie des lacs, marais et prairies humides, avec des populations sédentaires et migratrices en Europe.
    L'UICN la classe globalement en préoccupation mineure (LC). Pendant la migration et l'hivernage, observez
    les groupes depuis les observatoires sans vous approcher des dortoirs ni les faire décoller.
  de: >-
    Gans von Seen, Sümpfen und Feuchtwiesen mit Stand- und Zugvogelpopulationen in Europa. Die IUCN stuft sie
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps während des Zugs und im Winter von
    Beobachtungshütten aus, ohne sich Schlafplätzen zu nähern oder sie aufzuscheuchen.
  it: >-
    Oca di laghi, paludi e prati umidi, con popolazioni stanziali e migratrici in Europa. La IUCN la
    classifica a livello globale come a rischio minimo (LC). Durante la migrazione e lo svernamento, osserva
    gli stormi dagli appostamenti senza avvicinarti ai dormitori né farli alzare in volo.
  pt: >-
    Ganso de lagos, sapais e prados húmidos, com populações residentes e migratórias na Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Durante a migração e a invernada, observe os bandos
    a partir de observatórios sem se aproximar de dormitórios nem os fazer levantar voo.
