id: vimba_vimba
nombre_cientifico: Vimba vimba
nombre:
  es: Vimba
  en: Zarte
  fr: Vimbe
  de: Zährte
descripcion:
  es: >-
    Pez de aguas salobres y dulces de Europa y Asia occidental, presente en distintas cuencas del continente.
    La IUCN la clasifica globalmente como preocupación menor (LC). Cuando remonte ríos o sea visible desde la
    ribera, obsérvalo sin capturarlo ni entrar en zonas de freza.
  en: >-
    Fish of brackish and fresh waters of Europe and western Asia, present in several basins across the
    continent. The IUCN classifies it globally as Least Concern (LC). When it migrates upriver or is visible
    from the bank, watch without catching it or entering spawning grounds.
  fr: >-
    Poisson des eaux saumâtres et douces d'Europe et d'Asie occidentale, présent dans différents bassins du
    continent. L'UICN le classe globalement en préoccupation mineure (LC). Lorsqu'il remonte les rivières ou
    est visible depuis la rive, observez-le sans le capturer ni entrer dans les frayères.
  de: >-
    Fisch der Brack- und Süßgewässer Europas und Westasiens, der in verschiedenen Einzugsgebieten des
    Kontinents vorkommt. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Wenn sie Flüsse hinaufzieht
    oder vom Ufer sichtbar ist, beobachten Sie sie, ohne sie zu fangen oder Laichplätze zu betreten.
