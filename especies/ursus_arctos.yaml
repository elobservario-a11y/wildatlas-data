id: ursus_arctos
nombre_cientifico: Ursus arctos
nombre:
  es: Oso pardo
  en: Brown bear
  fr: Ours brun
  de: Braunbär
  it: Orso bruno
  pt: Urso-pardo
descripcion:
  es: >-
    Gran omnívoro de bosques y montañas europeos, desde la península ibérica hasta Escandinavia y los
    Cárpatos. La IUCN la clasifica globalmente como preocupación menor (LC). Búscalo al amanecer o al
    atardecer con prismáticos desde miradores, sin acercarte ni ofrecer comida.
  en: >-
    Large omnivore of European forests and mountains, from the Iberian Peninsula to Scandinavia and the
    Carpathians. The IUCN classifies it globally as Least Concern (LC). Look for it at dawn or dusk with
    binoculars from viewpoints, without approaching or offering food.
  fr: >-
    Grand omnivore des forêts et montagnes européennes, de la péninsule Ibérique à la Scandinavie et aux
    Carpates. L'UICN le classe globalement en préoccupation mineure (LC). Cherchez-le à l'aube ou au
    crépuscule aux jumelles depuis les belvédères, sans vous approcher ni donner de nourriture.
  de: >-
    Großer Allesfresser europäischer Wälder und Gebirge von der Iberischen Halbinsel bis nach Skandinavien und
    in die Karpaten. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Suchen Sie ihn in der Morgen-
    oder Abenddämmerung mit dem Fernglas von Aussichtspunkten aus, ohne sich zu nähern oder zu füttern.
  it: >-
    Grande onnivoro delle foreste e montagne europee, dalla penisola iberica alla Scandinavia e ai Carpazi. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Cercalo all'alba o al tramonto con il
    binocolo dai punti panoramici, senza avvicinarti né offrire cibo.
  pt: >-
    Grande omnívoro de florestas e montanhas europeias, da Península Ibérica à Escandinávia e aos Cárpatos. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Procure-o ao amanhecer ou ao entardecer com
    binóculos a partir de miradouros, sem se aproximar nem oferecer comida.
