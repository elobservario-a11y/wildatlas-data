id: alcedo_atthis
nombre_cientifico: Alcedo atthis
nombre:
  es: Martín pescador común
  en: Common kingfisher
  fr: Martin-pêcheur d'Europe
  de: Eisvogel
  it: Martin pescatore
  pt: Guarda-rios-comum
descripcion:
  es: >-
    Ave pescadora de ríos, lagos y humedales de gran parte de Europa, que utiliza posaderos sobre el agua. La
    IUCN la clasifica globalmente como preocupación menor (LC). De día, espera sus vuelos y zambullidas desde
    senderos sin acercarte a taludes de cría ni modificar posaderos.
  en: >-
    Fish-eating bird of rivers, lakes and wetlands across much of Europe, hunting from perches above the
    water. The IUCN classifies it globally as Least Concern (LC). During the day, wait for its flights and
    dives from trails without approaching nesting banks or altering perches.
  fr: >-
    Oiseau pêcheur des rivières, lacs et zones humides d'une grande partie de l'Europe, qui utilise des
    perchoirs au-dessus de l'eau. L'UICN le classe globalement en préoccupation mineure (LC). De jour,
    attendez ses vols et plongeons depuis les sentiers sans vous approcher des berges de nidification ni
    modifier les perchoirs.
  de: >-
    Fischfressender Vogel an Flüssen, Seen und Feuchtgebieten in weiten Teilen Europas, der Sitzwarten über
    dem Wasser nutzt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Warten Sie tagsüber von Wegen
    aus auf seine Flüge und Tauchgänge, ohne sich Brutwänden zu nähern oder Sitzwarten zu verändern.
  it: >-
    Uccello pescatore di fiumi, laghi e zone umide di gran parte d'Europa, che utilizza posatoi sull'acqua. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Di giorno, attendi i suoi voli e tuffi
    dai sentieri senza avvicinarti alle sponde di nidificazione né modificare i posatoi.
  pt: >-
    Ave piscívora de rios, lagos e zonas húmidas de grande parte da Europa, que utiliza poleiros sobre a água.
    A IUCN classifica-a globalmente como pouco preocupante (LC). De dia, aguarde os seus voos e mergulhos a
    partir dos trilhos sem se aproximar de taludes de nidificação nem alterar poleiros.
