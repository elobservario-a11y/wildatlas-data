id: anthropoides_virgo
nombre_cientifico: Anthropoides virgo
nombre:
  es: Grulla damisela
  en: Demoiselle crane
  fr: Grue demoiselle
  de: Jungfernkranich
  pt: Grus virgo
descripcion:
  es: >-
    Grulla migratoria de medios abiertos con vegetación dispersa, presente en el entorno europeo del mar
    Negro. La IUCN la clasifica globalmente como preocupación menor (LC). Durante su estancia reproductora y
    los pasos, observa bandos con telescopio desde caminos sin acercarte a zonas de cría.
  en: >-
    Migratory crane of open habitats with sparse vegetation, present in the European Black Sea region. The
    IUCN classifies it globally as Least Concern (LC). During breeding and passage, watch flocks with a scope
    from tracks without approaching nesting areas.
  fr: >-
    Grue migratrice des milieux ouverts à végétation clairsemée, présente dans la région européenne de la mer
    Noire. L'UICN la classe globalement en préoccupation mineure (LC). Pendant la reproduction et les
    passages, observez les groupes à la longue-vue depuis les chemins sans vous approcher des zones de
    nidification.
  de: >-
    Zugkranich offener Lebensräume mit spärlicher Vegetation, der im europäischen Schwarzmeerraum vorkommt.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps während der Brut- und
    Zugzeit mit dem Spektiv von Wegen aus, ohne sich Brutgebieten zu nähern.
  pt: >-
    Grou migratório de meios abertos com vegetação esparsa, presente na região europeia do mar Negro. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Durante a estadia reprodutora e as passagens,
    observe os bandos com telescópio a partir de caminhos sem se aproximar de zonas de criação.
