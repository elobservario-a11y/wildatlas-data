id: pteromys_volans
nombre_cientifico: Pteromys volans
nombre:
  es: Ardilla voladora siberiana
  en: Eurasian flying squirrel
  fr: Polatouche
  de: Europäisches Gleithörnchen
  it: Scoiattolo volante siberiano
descripcion:
  es: >-
    Roedor arborícola de bosques boreales, con presencia europea en Finlandia, Estonia y Rusia. La IUCN la
    clasifica globalmente como preocupación menor (LC). Espera encuentros al salir de sus refugios desde
    caminos tranquilos, sin iluminar cavidades ni acercarte a nidos.
  en: >-
    Arboreal rodent of boreal forests, with European presence in Finland, Estonia and Russia. The IUCN
    classifies it globally as Least Concern (LC). Wait for sightings as it emerges from shelters along quiet
    tracks, without shining lights into cavities or approaching nests.
  fr: >-
    Rongeur arboricole des forêts boréales, présent en Europe en Finlande, en Estonie et en Russie. L'UICN le
    classe globalement en préoccupation mineure (LC). Attendez des rencontres à la sortie de ses abris depuis
    des chemins calmes, sans éclairer les cavités ni vous approcher des nids.
  de: >-
    Baumbewohnendes Nagetier borealer Wälder mit europäischem Vorkommen in Finnland, Estland und Russland. Die
    IUCN stuft es weltweit als nicht gefährdet (LC) ein. Warten Sie von ruhigen Wegen aus auf Sichtungen beim
    Verlassen der Verstecke, ohne Höhlen auszuleuchten oder sich Nestern zu nähern.
  it: >-
    Roditore arboricolo delle foreste boreali, presente in Europa in Finlandia, Estonia e Russia. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Attendi incontri all'uscita dai rifugi da
    sentieri tranquilli, senza illuminare le cavità né avvicinarti ai nidi.
