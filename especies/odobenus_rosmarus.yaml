id: odobenus_rosmarus
nombre_cientifico: Odobenus rosmarus
nombre:
  es: Morsa
  en: Walrus
  fr: Morse
  de: Walross
  it: Tricheco
  pt: Morsa
descripcion:
  es: >-
    Gran pinnípedo de mares árticos someros, presente en Svalbard y costas del norte de Rusia. La IUCN la
    clasifica globalmente como vulnerable (VU). Obsérvalo cuando repose en costas o hielos con telescopio, sin
    desembarcar junto a grupos ni cortarles el acceso al agua.
  en: >-
    Large pinniped of shallow Arctic seas, present in Svalbard and northern Russian coasts. The IUCN
    classifies it globally as Vulnerable (VU). Watch it resting on shores or ice through a scope, without
    landing near groups or cutting off their access to the water.
  fr: >-
    Grand pinnipède des mers arctiques peu profondes, présent au Svalbard et sur les côtes du nord de la
    Russie. L'UICN le classe globalement comme vulnérable (VU). Observez-le au repos sur les côtes ou la glace
    à la longue-vue, sans débarquer près des groupes ni leur couper l'accès à l'eau.
  de: >-
    Großer Flossenfüßer flacher arktischer Meere, der auf Spitzbergen und an den Küsten Nordrusslands
    vorkommt. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie ihn beim Ruhen an Küsten oder
    auf dem Eis mit dem Spektiv, ohne nahe bei Gruppen anzulanden oder ihnen den Zugang zum Wasser
    abzuschneiden.
  it: >-
    Grande pinnipede dei mari artici poco profondi, presente alle Svalbard e sulle coste della Russia
    settentrionale. La IUCN lo classifica a livello globale come vulnerabile (VU). Osservalo mentre riposa su
    coste o ghiacci con il cannocchiale, senza sbarcare vicino ai gruppi né tagliare loro l'accesso all'acqua.
  pt: >-
    Grande pinípede de mares árticos pouco profundos, presente em Svalbard e nas costas do norte da Rússia. A
    IUCN classifica-o globalmente como vulnerável (VU). Observe-o quando repousa em costas ou gelos com
    telescópio, sem desembarcar junto a grupos nem lhes cortar o acesso à água.
