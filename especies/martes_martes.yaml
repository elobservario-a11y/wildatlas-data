id: martes_martes
nombre_cientifico: Martes martes
nombre:
  es: Marta
  en: European pine marten
  fr: Martre des pins
  de: Baummarder
  pt: Marta do pinheiro europeia
descripcion:
  es: >-
    Mustélido arborícola de bosques europeos que utiliza árboles y otros refugios para descansar. La IUCN la
    clasifica globalmente como preocupación menor (LC). Si sale a zonas abiertas, obsérvalo desde caminos sin
    ofrecer comida ni aproximarte a sus refugios.
  en: >-
    Arboreal mustelid of European forests that uses trees and other shelters to rest. The IUCN classifies it
    globally as Least Concern (LC). If it ventures into open areas, watch it from tracks without offering food
    or approaching its shelters.
  fr: >-
    Mustélidé arboricole des forêts européennes qui utilise les arbres et d'autres abris pour se reposer.
    L'UICN le classe globalement en préoccupation mineure (LC). S'il sort en milieu ouvert, observez-le depuis
    les chemins sans donner de nourriture ni vous approcher de ses gîtes.
  de: >-
    Baumbewohnender Marder europäischer Wälder, der Bäume und andere Verstecke zum Ruhen nutzt. Die IUCN stuft
    ihn weltweit als nicht gefährdet (LC) ein. Wenn er auf offene Flächen tritt, beobachten Sie ihn von Wegen
    aus, ohne Futter anzubieten oder sich seinen Verstecken zu nähern.
  pt: >-
    Mustelídeo arborícola de florestas europeias que utiliza árvores e outros abrigos para descansar. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Se sair para zonas abertas, observe-o a partir dos
    caminhos sem oferecer comida nem se aproximar dos seus abrigos.
