id: tetraogallus_caspius
nombre_cientifico: Tetraogallus caspius
nombre:
  es: Perdigallo caspio
  en: Caspian snowcock
  fr: Tétraogalle de Perse
  de: Kaspi-Königshuhn
  it: Tetraogallo del Caspio
  pt: Galo-das-neves-do-cáspio
descripcion:
  es: >-
    Galliforme de laderas pedregosas y matorral alpino de Turquía oriental y el Cáucaso meridional, junto al
    límite suroriental europeo. La IUCN la clasifica globalmente como preocupación menor (LC). Durante
    recorridos diurnos autorizados, obsérvalo con prismáticos desde senderos sin perseguirlo ni utilizar
    reclamos.
  en: >-
    Gamebird of stony slopes and alpine scrub in eastern Turkey and the southern Caucasus, near Europe's
    south-eastern limit. The IUCN classifies it globally as Least Concern (LC). During authorised daytime
    walks, watch with binoculars from trails without chasing it or using playback.
  fr: >-
    Galliforme des pentes pierreuses et fourrés alpins de Turquie orientale et du Caucase méridional, près de
    la limite sud-est de l'Europe. L'UICN le classe globalement en préoccupation mineure (LC). Lors de
    randonnées diurnes autorisées, observez-le aux jumelles depuis les sentiers sans le poursuivre ni utiliser
    d'appeaux.
  de: >-
    Hühnervogel steiniger Hänge und alpiner Gebüsche der Osttürkei und des Südkaukasus am südöstlichen Rand
    Europas. Die IUCN stuft es weltweit als nicht gefährdet (LC) ein. Beobachten Sie es bei zugelassenen
    Tageswanderungen mit dem Fernglas von Wegen aus, ohne es zu verfolgen oder Klangattrappen zu nutzen.
  it: >-
    Galliforme di pendii pietrosi e arbusteti alpini della Turchia orientale e del Caucaso meridionale, vicino
    al limite sud-orientale europeo. La IUCN lo classifica a livello globale come a rischio minimo (LC).
    Durante escursioni diurne autorizzate, osservalo con il binocolo dai sentieri senza inseguirlo né usare
    richiami.
  pt: >-
    Galiforme de encostas pedregosas e matagal alpino da Turquia oriental e Cáucaso meridional, junto ao
    limite sudeste europeu. A IUCN classifica-o globalmente como pouco preocupante (LC). Durante percursos
    diurnos autorizados, observe-o com binóculos a partir dos trilhos sem o perseguir nem usar chamarizes.
