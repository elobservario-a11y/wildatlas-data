id: anas_platyrhynchos
nombre_cientifico: Anas platyrhynchos
nombre:
  es: Ánade azulón
  en: Mallard
  fr: Canard colvert
  de: Stockente
  it: Germano reale
  pt: Pato-real
descripcion:
  es: >-
    Pato de superficie extendido por Europa, que ocupa lagunas, ríos, marismas y otros humedales. La IUCN la
    clasifica globalmente como preocupación menor (LC). De día, observa su alimentación y descanso desde la
    orilla sin ofrecer comida ni acercarte a hembras con pollos.
  en: >-
    Dabbling duck widespread across Europe, occupying lagoons, rivers, marshes and other wetlands. The IUCN
    classifies it globally as Least Concern (LC). During the day, watch it feeding and resting from the shore
    without offering food or approaching females with ducklings.
  fr: >-
    Canard de surface répandu en Europe, qui occupe lagunes, rivières, marais et autres zones humides. L'UICN
    le classe globalement en préoccupation mineure (LC). De jour, observez son alimentation et son repos
    depuis la rive sans donner de nourriture ni vous approcher des femelles avec des canetons.
  de: >-
    In Europa weit verbreitete Gründelente, die Seen, Flüsse, Sümpfe und andere Feuchtgebiete besiedelt. Die
    IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber ihre Nahrungssuche und
    Ruhephasen vom Ufer aus, ohne zu füttern oder sich Weibchen mit Küken zu nähern.
  it: >-
    Anatra di superficie diffusa in tutta Europa, che occupa lagune, fiumi, paludi e altre zone umide. La IUCN
    la classifica a livello globale come a rischio minimo (LC). Di giorno, osservane l'alimentazione e il
    riposo dalla riva senza offrire cibo né avvicinarti alle femmine con i piccoli.
  pt: >-
    Pato de superfície amplamente distribuído pela Europa, que ocupa lagoas, rios, sapais e outras zonas
    húmidas. A IUCN classifica-o globalmente como pouco preocupante (LC). De dia, observe a sua alimentação e
    descanso a partir da margem sem dar comida nem se aproximar de fêmeas com crias.
