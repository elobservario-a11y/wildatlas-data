id: ciconia_nigra
nombre_cientifico: Ciconia nigra
nombre:
  es: Cigüeña negra
  en: Black stork
  fr: Cigogne noire
  de: Schwarzstorch
  it: Cicogna nera
  pt: Cegonha-preta
descripcion:
  es: >-
    Cigüeña esquiva que combina bosques tranquilos con ríos y humedales, distribuida de forma dispersa por
    Europa. La IUCN la clasifica globalmente como preocupación menor (LC). Durante su estancia reproductora,
    obsérvala desde lejos en vuelo o alimentándose, sin buscar nidos ni entrar en sus refugios.
  en: >-
    Shy stork combining quiet forests with rivers and wetlands, distributed sparsely across Europe. The IUCN
    classifies it globally as Least Concern (LC). During its breeding stay, watch it from afar in flight or
    feeding, without searching for nests or entering its refuges.
  fr: >-
    Cigogne farouche qui associe forêts calmes, rivières et zones humides, répartie de manière dispersée en
    Europe. L'UICN la classe globalement en préoccupation mineure (LC). Pendant son séjour reproducteur,
    observez-la de loin en vol ou en train de se nourrir, sans chercher de nids ni pénétrer dans ses refuges.
  de: >-
    Scheuer Storch, der ruhige Wälder mit Flüssen und Feuchtgebieten verbindet und in Europa verstreut
    vorkommt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn während der
    Brutzeit aus der Ferne im Flug oder bei der Nahrungssuche, ohne nach Nestern zu suchen oder seine
    Rückzugsgebiete zu betreten.
  it: >-
    Cicogna schiva che associa boschi tranquilli a fiumi e zone umide, distribuita in modo sparso in Europa.
    La IUCN la classifica a livello globale come a rischio minimo (LC). Durante il periodo riproduttivo,
    osservala da lontano in volo o mentre si nutre, senza cercare nidi né entrare nei suoi rifugi.
  pt: >-
    Cegonha esquiva que combina florestas tranquilas com rios e zonas húmidas, distribuída de forma dispersa
    pela Europa. A IUCN classifica-a globalmente como pouco preocupante (LC). Durante a sua estadia
    reprodutora, observe-a de longe em voo ou a alimentar-se, sem procurar ninhos nem entrar nos seus
    refúgios.
