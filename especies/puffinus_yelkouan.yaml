id: puffinus_yelkouan
nombre_cientifico: Puffinus yelkouan
nombre:
  es: Pardela mediterránea
  en: Yelkouan shearwater
  fr: Puffin yelkouan
  de: Mittelmeer-Sturmtaucher
  it: Berta minore
  pt: Fura-bucho-do-mediterrâneo
descripcion:
  es: >-
    Ave marina que cría en islas y acantilados del Mediterráneo central y oriental y suele invernar en ese
    mar. La IUCN la clasifica globalmente como vulnerable (VU). Obsérvala en vuelo sobre el agua durante la
    temporada reproductora desde la costa, sin acceder a colonias ni usar luces.
  en: >-
    Seabird breeding on islands and cliffs of the central and eastern Mediterranean and usually wintering in
    that sea. The IUCN classifies it globally as Vulnerable (VU). Watch it flying over the water during the
    breeding season from the coast, without accessing colonies or using lights.
  fr: >-
    Oiseau marin qui niche sur les îles et falaises de Méditerranée centrale et orientale et hiverne
    généralement dans cette mer. L'UICN le classe globalement comme vulnérable (VU). Observez-le en vol
    au-dessus de l'eau pendant la saison de reproduction depuis la côte, sans accéder aux colonies ni utiliser
    de lumières.
  de: >-
    Seevogel, der auf Inseln und an Klippen des zentralen und östlichen Mittelmeers brütet und meist dort
    überwintert. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie ihn zur Brutzeit von der
    Küste aus im Flug über dem Wasser, ohne Kolonien zu betreten oder Licht einzusetzen.
  it: >-
    Uccello marino che nidifica su isole e scogliere del Mediterraneo centrale e orientale e sverna di solito
    nello stesso mare. La IUCN lo classifica a livello globale come vulnerabile (VU). Osservala in volo
    sull'acqua durante la stagione riproduttiva dalla costa, senza accedere alle colonie né usare luci.
  pt: >-
    Ave marinha que nidifica em ilhas e falésias do Mediterrâneo central e oriental e costuma invernar nesse
    mar. A IUCN classifica-a globalmente como vulnerável (VU). Observe-a em voo sobre a água durante a época
    reprodutora a partir da costa, sem aceder a colónias nem usar luzes.
