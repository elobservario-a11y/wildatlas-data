id: castor_fiber
nombre_cientifico: Castor fiber
nombre:
  es: Castor europeo
  en: Eurasian beaver
  fr: Castor d'Europe
  de: Europäischer Biber
  pt: Castor-europeu
descripcion:
  es: >-
    Roedor semiacuático recuperado en ríos, lagos y humedales de gran parte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Espera en silencio cuando emerja junto a la ribera, sin tocar
    diques ni aproximarte a sus refugios.
  en: >-
    Semi-aquatic rodent recovered across rivers, lakes and wetlands in much of Europe. The IUCN classifies it
    globally as Least Concern (LC). Wait quietly when it surfaces along the bank, without touching dams or
    approaching its lodges.
  fr: >-
    Rongeur semi-aquatique rétabli dans les rivières, lacs et zones humides d'une grande partie de l'Europe.
    L'UICN le classe globalement en préoccupation mineure (LC). Attendez en silence lorsqu'il émerge près de
    la rive, sans toucher aux barrages ni vous approcher de ses gîtes.
  de: >-
    Semi-aquatisches Nagetier, das sich in Flüssen, Seen und Feuchtgebieten weiter Teile Europas wieder
    ausgebreitet hat. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Warten Sie still, wenn er am
    Ufer auftaucht, ohne Dämme anzurühren oder sich seinen Burgen zu nähern.
  pt: >-
    Roedor semiaquático recuperado em rios, lagos e zonas húmidas de grande parte da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Aguarde em silêncio quando emergir junto à margem,
    sem tocar em diques nem se aproximar dos seus abrigos.
