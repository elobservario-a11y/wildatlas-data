id: falco_peregrinus
nombre_cientifico: Falco peregrinus
nombre:
  es: Halcón peregrino
  en: Peregrine falcon
  fr: Faucon pèlerin
  de: Wanderfalke
  it: Falco pellegrino
  pt: Falcão-peregrino
descripcion:
  es: >-
    Halcón de vuelo rápido presente en acantilados, montañas y ciudades de gran parte de Europa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvalo de día en vuelo desde puntos públicos, sin
    acercarte a cornisas de cría ni usar reclamos.
  en: >-
    Fast-flying falcon present on cliffs, mountains and cities across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). Watch it in flight during the day from public points, without approaching
    nesting ledges or using playback.
  fr: >-
    Faucon au vol rapide présent sur les falaises, montagnes et villes d'une grande partie de l'Europe. L'UICN
    le classe globalement en préoccupation mineure (LC). Observez-le en vol de jour depuis les points publics,
    sans vous approcher des corniches de nidification ni utiliser d'appeaux.
  de: >-
    Schnell fliegender Falke, der an Klippen, in Gebirgen und Städten weiter Teile Europas vorkommt. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn tagsüber im Flug von öffentlichen
    Punkten aus, ohne sich Brutfelsen zu nähern oder Klangattrappen zu nutzen.
  it: >-
    Falco dal volo rapido presente su scogliere, montagne e città di gran parte d'Europa. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Osservalo di giorno in volo da punti pubblici,
    senza avvicinarti alle cenge di nidificazione né usare richiami.
  pt: >-
    Falcão de voo rápido presente em falésias, montanhas e cidades de grande parte da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Observe-o de dia em voo a partir de pontos públicos,
    sem se aproximar de cornijas de criação nem usar chamarizes.
