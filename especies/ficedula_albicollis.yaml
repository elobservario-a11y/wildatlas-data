id: ficedula_albicollis
nombre_cientifico: Ficedula albicollis
nombre:
  es: Papamoscas acollarado
  en: Collared flycatcher
  fr: Gobemouche à collier
  de: Halsbandschnäpper
  it: Balia dal collare
  pt: Papa-moscas-de-colar
descripcion:
  es: >-
    Pequeña ave migratoria de bosques, parques y otros ambientes arbolados del centro y sureste europeo. La
    IUCN la clasifica globalmente como preocupación menor (LC). En primavera y verano, obsérvala desde
    senderos sin reproducir cantos ni acercarte a cavidades de cría.
  en: >-
    Small migratory bird of forests, parks and other wooded habitats in central and south-eastern Europe. The
    IUCN classifies it globally as Least Concern (LC). In spring and summer, watch it from trails without
    playing back calls or approaching nest cavities.
  fr: >-
    Petit oiseau migrateur des forêts, parcs et autres milieux boisés du centre et du sud-est de l'Europe.
    L'UICN le classe globalement en préoccupation mineure (LC). Au printemps et en été, observez-le depuis les
    sentiers sans diffuser de chants ni vous approcher des cavités de nidification.
  de: >-
    Kleiner Zugvogel von Wäldern, Parks und anderen baumbestandenen Lebensräumen Mittel- und Südosteuropas.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn im Frühjahr und Sommer von
    Wegen aus, ohne Gesänge abzuspielen oder sich Bruthöhlen zu nähern.
  it: >-
    Piccolo uccello migratore di boschi, parchi e altri ambienti alberati dell'Europa centrale e
    sud-orientale. La IUCN la classifica a livello globale come a rischio minimo (LC). In primavera e in
    estate, osservala dai sentieri senza riprodurre canti né avvicinarti alle cavità di nidificazione.
  pt: >-
    Pequena ave migratória de florestas, parques e outros ambientes arborizados do centro e sudeste europeu. A
    IUCN classifica-a globalmente como pouco preocupante (LC). Na primavera e no verão, observe-a a partir dos
    trilhos sem reproduzir cantos nem se aproximar de cavidades de criação.
