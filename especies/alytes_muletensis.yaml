id: alytes_muletensis
nombre_cientifico: Alytes muletensis
nombre:
  es: Ferreret
  en: Majorcan midwife toad
  de: Mallorca-Geburtshelferkröte
  pt: Sapo-parteiro-de-maiorca
descripcion:
  es: >-
    Pequeño anfibio endémico de Mallorca ligado a cursos de agua y barrancos calizos de la sierra de
    Tramuntana. La IUCN la clasifica globalmente como en peligro (EN). Si resulta visible durante un recorrido
    autorizado, obsérvalo desde fuera del agua sin capturarlo ni mover piedras.
  en: >-
    Small amphibian endemic to Mallorca, linked to watercourses and limestone gorges of the Serra de
    Tramuntana. The IUCN classifies it globally as Endangered (EN). If visible on an authorised route, observe
    it from outside the water without catching it or moving stones.
  de: >-
    Kleiner, auf Mallorca endemischer Lurch, der an Wasserläufe und Kalkschluchten der Serra de Tramuntana
    gebunden ist. Die IUCN stuft ihn weltweit als stark gefährdet (EN) ein. Wenn er auf einem zugelassenen Weg
    sichtbar ist, beobachten Sie ihn vom Ufer aus, ohne ihn zu fangen oder Steine zu bewegen.
  pt: >-
    Pequeno anfíbio endémico de Maiorca ligado a cursos de água e gargantas calcárias da Serra de Tramuntana.
    A IUCN classifica-o globalmente como em perigo (EN). Se for visível num percurso autorizado, observe-o de
    fora da água sem o capturar nem mover pedras.
