id: falco_tinnunculus
nombre_cientifico: Falco tinnunculus
nombre:
  es: Cernícalo vulgar
  en: Common kestrel
  fr: Faucon crécerelle
  de: Turmfalke
  it: Gheppio
  pt: Peneireiro-vulgar
descripcion:
  es: >-
    Pequeño halcón de campos, pastizales y otros ambientes abiertos de gran parte de Europa. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante el día, observa sus cernidos desde caminos con
    prismáticos sin acercarte a nidos ni utilizar cebos.
  en: >-
    Small falcon of fields, grasslands and other open habitats across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). During the day, watch it hovering from tracks with binoculars without
    approaching nests or using bait.
  fr: >-
    Petit faucon des champs, prairies et autres milieux ouverts d'une grande partie de l'Europe. L'UICN le
    classe globalement en préoccupation mineure (LC). De jour, observez son vol stationnaire depuis les
    chemins aux jumelles sans vous approcher des nids ni utiliser d'appâts.
  de: >-
    Kleiner Falke von Feldern, Wiesen und anderen offenen Lebensräumen in weiten Teilen Europas. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber seinen Rüttelflug von Wegen aus
    mit dem Fernglas, ohne sich Nestern zu nähern oder Köder auszulegen.
  it: >-
    Piccolo falco di campi, praterie e altri ambienti aperti di gran parte d'Europa. La IUCN lo classifica a
    livello globale come a rischio minimo (LC). Durante il giorno, osserva il suo volo a spirito santo dai
    sentieri con il binocolo senza avvicinarti ai nidi né usare esche.
  pt: >-
    Pequeno falcão de campos, pastagens e outros ambientes abertos de grande parte da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Durante o dia, observe-o a peneirar a partir dos
    caminhos com binóculos sem se aproximar de ninhos nem utilizar iscos.
