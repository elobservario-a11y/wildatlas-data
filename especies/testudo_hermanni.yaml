id: testudo_hermanni
nombre_cientifico: Testudo hermanni
nombre:
  es: Tortuga mediterránea
  en: Hermann's tortoise
  fr: Tortue d'Hermann
  de: Griechische Landschildkröte
descripcion:
  es: >-
    Tortuga terrestre de ambientes mediterráneos del sur de Europa, ligada a matorrales y mosaicos abiertos.
    La IUCN la clasifica globalmente como vulnerable (VU). Búscala durante su actividad fuera de la
    hibernación desde senderos, sin cogerla, alimentarla ni retirarla de su entorno.
  en: >-
    Terrestrial tortoise of Mediterranean habitats in southern Europe, linked to scrubland and open mosaics.
    The IUCN classifies it globally as Vulnerable (VU). Look for it when active outside hibernation from
    trails, without picking it up, feeding it or removing it from its habitat.
  fr: >-
    Tortue terrestre des milieux méditerranéens du sud de l'Europe, liée aux maquis et mosaïques ouvertes.
    L'UICN la classe globalement comme vulnérable (VU). Cherchez-la lors de son activité hors hibernation
    depuis les sentiers, sans la saisir, la nourrir ni la retirer de son milieu.
  de: >-
    Landschildkröte mediterraner Lebensräume Südeuropas, gebunden an Buschland und offene Mosaiklandschaften.
    Die IUCN stuft sie weltweit als gefährdet (VU) ein. Suchen Sie sie außerhalb der Winterruhe von Wegen aus,
    ohne sie aufzuheben, zu füttern oder aus ihrem Lebensraum zu entfernen.
