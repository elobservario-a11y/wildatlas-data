id: vipera_renardi
nombre_cientifico: Vipera renardi
nombre:
  es: Víbora de la estepa
  de: Steppenotter
descripcion:
  es: >-
    Víbora de pastizales, matorrales y terrenos pedregosos del este de Europa y otras regiones de Eurasia.
    GBIF reproduce la categoría global IUCN casi amenazada (NT), distinta de la indicada en Wikipedia. Durante
    la estación activa, obsérvala desde caminos sin capturarla, acorralarla ni levantar piedras o refugios.
  de: >-
    Viper von Grasländern, Gebüschen und steinigen Böden Osteuropas und weiterer Teile Eurasiens. GBIF gibt
    die globale IUCN-Kategorie potenziell gefährdet (NT) an, abweichend von der Angabe in Wikipedia.
    Beobachten Sie sie während der aktiven Zeit von Wegen aus, ohne sie zu fangen, einzukreisen oder Steine
    und Verstecke anzuheben.
