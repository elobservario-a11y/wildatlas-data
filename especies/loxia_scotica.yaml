id: loxia_scotica
nombre_cientifico: Loxia scotica
nombre:
  es: Piquituerto escocés
  en: Scottish crossbill
  fr: Bec-croisé d'Écosse
  de: Schottlandkreuzschnabel
  it: Crociere di Scozia
  pt: Cruza-bico-escocês
descripcion:
  es: >-
    Pequeña ave endémica de las Highlands escocesas ligada a pinares y otras masas de coníferas. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante el día, observa copas y piñas con prismáticos
    desde senderos sin reproducir cantos ni acercarte a nidos.
  en: >-
    Small bird endemic to the Scottish Highlands, linked to pinewoods and other conifer stands. The IUCN
    classifies it globally as Least Concern (LC). During the day, scan treetops and cones with binoculars from
    trails without playing back calls or approaching nests.
  fr: >-
    Petit oiseau endémique des Highlands écossais lié aux pinèdes et autres peuplements de conifères. L'UICN
    le classe globalement en préoccupation mineure (LC). De jour, observez les cimes et les cônes aux jumelles
    depuis les sentiers sans diffuser de chants ni vous approcher des nids.
  de: >-
    Kleiner, in den schottischen Highlands endemischer Vogel, der an Kiefernwälder und andere
    Nadelholzbestände gebunden ist. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie
    tagsüber Baumkronen und Zapfen mit dem Fernglas von Wegen aus, ohne Gesänge abzuspielen oder sich Nestern
    zu nähern.
  it: >-
    Piccolo uccello endemico delle Highlands scozzesi legato a pinete e altri boschi di conifere. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Durante il giorno, osserva le chiome e le pigne
    con il binocolo dai sentieri senza riprodurre canti né avvicinarti ai nidi.
  pt: >-
    Pequena ave endémica das Terras Altas escocesas ligada a pinhais e outros povoamentos de coníferas. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Durante o dia, observe as copas e pinhas com
    binóculos a partir dos trilhos sem reproduzir cantos nem se aproximar de ninhos.
