id: cygnus_cygnus
nombre_cientifico: Cygnus cygnus
nombre:
  es: Cisne cantor
  en: Whooper swan
  fr: Cygne chanteur
  de: Singschwan
  it: Cigno selvatico
  pt: Cisne-bravo
descripcion:
  es: >-
    Cisne migratorio que cría en humedales del norte europeo y pasa el invierno en regiones más templadas. La
    IUCN la clasifica globalmente como preocupación menor (LC). En otoño e invierno, observa grupos en lagos y
    campos desde miradores sin acercarte a dormideros ni ofrecer comida.
  en: >-
    Migratory swan breeding in wetlands of northern Europe and wintering in more temperate regions. The IUCN
    classifies it globally as Least Concern (LC). In autumn and winter, watch groups on lakes and fields from
    viewpoints without approaching roosts or offering food.
  fr: >-
    Cygne migrateur qui niche dans les zones humides du nord européen et hiverne dans des régions plus
    tempérées. L'UICN le classe globalement en préoccupation mineure (LC). En automne et en hiver, observez
    les groupes sur les lacs et les champs depuis les belvédères sans vous approcher des dortoirs ni donner de
    nourriture.
  de: >-
    Zugschwan, der in Feuchtgebieten Nordeuropas brütet und in gemäßigteren Regionen überwintert. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie Gruppen im Herbst und Winter auf Seen und
    Feldern von Aussichtspunkten aus, ohne sich Schlafplätzen zu nähern oder Futter anzubieten.
  it: >-
    Cigno migratore che nidifica nelle zone umide dell'Europa settentrionale e sverna in regioni più
    temperate. La IUCN lo classifica a livello globale come a rischio minimo (LC). In autunno e in inverno,
    osserva i gruppi su laghi e campi dai punti panoramici senza avvicinarti ai dormitori né offrire cibo.
  pt: >-
    Cisne migratório que nidifica em zonas húmidas do norte europeu e passa o inverno em regiões mais
    temperadas. A IUCN classifica-o globalmente como pouco preocupante (LC). No outono e no inverno, observe
    os grupos em lagos e campos a partir de miradouros sem se aproximar de dormitórios nem oferecer comida.
