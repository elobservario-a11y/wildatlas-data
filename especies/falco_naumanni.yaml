id: falco_naumanni
nombre_cientifico: Falco naumanni
nombre:
  es: Cernícalo primilla
  en: Lesser kestrel
  fr: Faucon crécerellette
  de: Rötelfalke
  it: Grillaio
  pt: Peneireiro-das-torres
descripcion:
  es: >-
    Pequeño halcón migratorio de paisajes abiertos mediterráneos, que también puede criar en edificios. La
    IUCN la clasifica globalmente como preocupación menor (LC). En primavera y verano, observa sus vuelos de
    caza desde espacios públicos sin acercarte a colonias ni tapar accesos.
  en: >-
    Small migratory falcon of open Mediterranean landscapes, which can also nest on buildings. The IUCN
    classifies it globally as Least Concern (LC). In spring and summer, watch its hunting flights from public
    spaces without approaching colonies or blocking nest entrances.
  fr: >-
    Petit faucon migrateur des paysages ouverts méditerranéens, qui peut aussi nicher sur des édifices. L'UICN
    le classe globalement en préoccupation mineure (LC). Au printemps et en été, observez ses vols de chasse
    depuis les espaces publics sans vous approcher des colonies ni obstruer les accès.
  de: >-
    Kleiner Zugfalke offener mediterraner Landschaften, der auch an Gebäuden brüten kann. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie im Frühjahr und Sommer seine Jagdflüge von
    öffentlichen Bereichen aus, ohne sich Kolonien zu nähern oder Zugänge zu versperren.
  it: >-
    Piccolo falco migratore di paesaggi aperti mediterranei, che può nidificare anche sugli edifici. La IUCN
    lo classifica a livello globale come a rischio minimo (LC). In primavera e in estate, osserva i suoi voli
    di caccia da spazi pubblici senza avvicinarti alle colonie né ostruire gli accessi.
  pt: >-
    Pequeno falcão migratório de paisagens abertas mediterrânicas, que também pode nidificar em edifícios. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Na primavera e no verão, observe os seus voos
    de caça a partir de espaços públicos sem se aproximar de colónias nem tapar acessos.
