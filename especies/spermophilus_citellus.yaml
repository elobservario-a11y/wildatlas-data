id: spermophilus_citellus
nombre_cientifico: Spermophilus citellus
nombre:
  es: Suslik europeo
  en: European ground squirrel
  fr: Souslik d'Europe
  de: Europäischer Ziesel
descripcion:
  es: >-
    Roedor colonial de pastizales bajos de Europa central y sudoriental, que se refugia en madrigueras. La
    IUCN la clasifica globalmente como en peligro (EN). Búscalo de día durante la estación sin hibernación,
    sin ofrecer comida ni aproximarte a las entradas de sus refugios.
  en: >-
    Colonial rodent of short grasslands in central and south-eastern Europe, taking shelter in burrows. The
    IUCN classifies it globally as Endangered (EN). Look for it by day outside the hibernation season, without
    offering food or approaching burrow entrances.
  fr: >-
    Rongeur colonial des pelouses rases d'Europe centrale et sud-orientale, qui s'abrite dans des terriers.
    L'UICN le classe globalement en danger (EN). Recherchez-le de jour hors période d'hibernation, sans donner
    de nourriture ni vous approcher des entrées de ses terriers.
  de: >-
    Koloniebildendes Nagetier kurzrasiger Grasländer Mittel- und Südosteuropas, das Erdbauten als Schutz
    nutzt. Die IUCN stuft ihn weltweit als stark gefährdet (EN) ein. Suchen Sie ihn tagsüber außerhalb der
    Winterruhe, ohne zu füttern oder sich den Baueingängen zu nähern.
