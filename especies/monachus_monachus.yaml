id: monachus_monachus
nombre_cientifico: Monachus monachus
nombre:
  es: Foca monje del Mediterráneo
  en: Mediterranean monk seal
  fr: Phoque moine de Méditerranée
  de: Mittelmeer-Mönchsrobbe
  pt: Foca-monge-do-mediterrâneo
descripcion:
  es: >-
    Foca de costas tranquilas y cuevas marinas, presente de forma fragmentada en el Mediterráneo y Madeira. La
    IUCN la clasifica globalmente como vulnerable (VU). Obsérvala únicamente si aparece durante el día desde
    una distancia amplia, sin entrar en cuevas ni seguirla en barco.
  en: >-
    Seal of quiet coasts and sea caves, occurring patchily in the Mediterranean and Madeira. The IUCN
    classifies it globally as Vulnerable (VU). Watch it only if seen by day from a wide distance, without
    entering caves or following it by boat.
  fr: >-
    Phoque des côtes calmes et grottes marines, présent de façon fragmentée en Méditerranée et à Madère.
    L'UICN le classe globalement comme vulnérable (VU). Observez-le uniquement s'il apparaît de jour à grande
    distance, sans entrer dans les grottes ni le suivre en bateau.
  de: >-
    Robbe ruhiger Küsten und Meereshöhlen mit lückenhaftem Vorkommen im Mittelmeer und auf Madeira. Die IUCN
    stuft sie weltweit als gefährdet (VU) ein. Beobachten Sie sie nur, wenn sie tagsüber aus großer Entfernung
    erscheint, ohne Höhlen zu betreten oder ihr mit dem Boot zu folgen.
  pt: >-
    Foca de costas tranquilas e grutas marinhas, presente de forma fragmentada no Mediterrâneo e na Madeira. A
    IUCN classifica-a globalmente como vulnerável (VU). Observe-a apenas se aparecer durante o dia a uma
    distância ampla, sem entrar em grutas nem a seguir de barco.
