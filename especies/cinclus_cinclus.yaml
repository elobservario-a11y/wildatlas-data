id: cinclus_cinclus
nombre_cientifico: Cinclus cinclus
nombre:
  es: Mirlo acuático
  en: White-throated dipper
  fr: Cincle plongeur
  de: Wasseramsel
  it: Merlo acquaiolo
  pt: Melro-d'água
descripcion:
  es: >-
    Ave ribereña que bucea en arroyos y ríos de corriente rápida de gran parte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Durante el día, busca sus posaderos desde puentes y senderos,
    sin entrar en el cauce ni acercarte a nidos.
  en: >-
    Riverside bird that dives in fast-flowing streams and rivers across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). During the day, look for its perches from bridges and trails, without
    entering the streambed or approaching nests.
  fr: >-
    Oiseau riverain qui plonge dans les ruisseaux et rivières à courant rapide d'une grande partie de
    l'Europe. L'UICN le classe globalement en préoccupation mineure (LC). De jour, repérez ses perchoirs
    depuis les ponts et sentiers, sans entrer dans le lit du cours d'eau ni vous approcher des nids.
  de: >-
    Gewässervogel, der in schnell fließenden Bächen und Flüssen in weiten Teilen Europas taucht. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Suchen Sie tagsüber seine Sitzwarten von Brücken und
    Wegen aus, ohne ins Flussbett zu steigen oder sich Nestern zu nähern.
  it: >-
    Uccello ripariale che si tuffa in torrenti e fiumi a corrente rapida di gran parte d'Europa. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Durante il giorno, cerca i suoi posatoi da ponti
    e sentieri, senza entrare nell'alveo né avvicinarti ai nidi.
  pt: >-
    Ave ribeirinha que mergulha em ribeiros e rios de corrente rápida de grande parte da Europa. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Durante o dia, procure os seus poleiros a partir de
    pontes e trilhos, sem entrar no leito nem se aproximar de ninhos.
