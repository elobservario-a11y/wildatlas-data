id: ovibos_moschatus
nombre_cientifico: Ovibos moschatus
nombre:
  es: Buey almizclero
  en: Musk ox
  fr: Bœuf musqué
  de: Moschusochse
  pt: Boi-almiscarado
descripcion:
  es: >-
    Herbívoro de tundra y pastizales fríos, con poblaciones introducidas en Noruega y Suecia. La IUCN la
    clasifica globalmente como preocupación menor (LC). Obsérvalo cuando paste en terreno abierto con
    prismáticos, manteniendo amplia distancia y sin cerrarle el paso.
  en: >-
    Herbivore of tundra and cold grasslands, with introduced populations in Norway and Sweden. The IUCN
    classifies it globally as Least Concern (LC). Watch it grazing in open terrain with binoculars, keeping a
    wide distance and not blocking its path.
  fr: >-
    Herbivore de toundra et prairies froides, avec des populations introduites en Norvège et en Suède. L'UICN
    le classe globalement en préoccupation mineure (LC). Observez-le pâturer en terrain ouvert aux jumelles,
    en gardant une grande distance et sans lui barrer le passage.
  de: >-
    Pflanzenfresser der Tundra und kalten Grasländer mit eingeführten Beständen in Norwegen und Schweden. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn beim Äsen in offenem Gelände mit
    dem Fernglas, halten Sie großen Abstand und versperren Sie ihm nicht den Weg.
  pt: >-
    Herbívoro de tundra e pastagens frias, com populações introduzidas na Noruega e na Suécia. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Observe-o enquanto pasta em terreno aberto com
    binóculos, mantendo ampla distância e sem lhe cortar o passo.
