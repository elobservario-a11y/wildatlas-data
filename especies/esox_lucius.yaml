id: esox_lucius
nombre_cientifico: Esox lucius
nombre:
  es: Lucio
  en: Pike
  fr: Grand brochet
  de: Hecht
  it: Luccio
descripcion:
  es: >-
    Pez depredador de aguas continentales europeas, asociado a lagos, embalses y tramos fluviales con
    refugios. La IUCN la clasifica globalmente como preocupación menor (LC). Cuando sea visible en aguas
    claras, obsérvalo desde la ribera sin capturarlo ni alterar la vegetación acuática.
  en: >-
    Predatory fish of European inland waters, associated with lakes, reservoirs and river stretches with
    cover. The IUCN classifies it globally as Least Concern (LC). When visible in clear water, observe it from
    the bank without catching it or disturbing aquatic vegetation.
  fr: >-
    Poisson prédateur des eaux continentales européennes, associé aux lacs, retenues et tronçons fluviaux
    offrant des abris. L'UICN le classe globalement en préoccupation mineure (LC). Lorsqu'il est visible en
    eau claire, observez-le depuis la rive sans le capturer ni perturber la végétation aquatique.
  de: >-
    Raubfisch europäischer Binnengewässer, gebunden an Seen, Stauseen und Flussabschnitte mit Deckung. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Wenn er in klarem Wasser sichtbar ist, beobachten
    Sie ihn vom Ufer aus, ohne ihn zu fangen oder Wasserpflanzen zu stören.
  it: >-
    Pesce predatore delle acque interne europee, associato a laghi, bacini e tratti fluviali con rifugi. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Quando è visibile in acque limpide,
    osservalo dalla riva senza catturarlo né alterare la vegetazione acquatica.
