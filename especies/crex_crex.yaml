id: crex_crex
nombre_cientifico: Crex crex
nombre:
  es: Guion de codornices
  en: Corn crake
  fr: Râle des genêts
  de: Wachtelkönig
  it: Re di quaglie
  pt: Codornizão
descripcion:
  es: >-
    Ave migratoria discreta de prados y herbazales europeos, especialmente ligada a vegetación alta. La IUCN
    la clasifica globalmente como preocupación menor (LC). Durante su estancia reproductora, escucha desde
    caminos sin reproducir cantos, entrar en prados ni perseguir aves ocultas.
  en: >-
    Secretive migratory bird of European meadows and grasslands, especially linked to tall vegetation. The
    IUCN classifies it globally as Least Concern (LC). During its breeding stay, listen from tracks without
    playing back calls, entering meadows or chasing hidden birds.
  fr: >-
    Oiseau migrateur discret des prairies et herbages européens, particulièrement lié à la végétation haute.
    L'UICN le classe globalement en préoccupation mineure (LC). Pendant son séjour reproducteur, écoutez
    depuis les chemins sans diffuser de chants, entrer dans les prairies ni poursuivre les oiseaux cachés.
  de: >-
    Heimlicher Zugvogel europäischer Wiesen und Grasländer, besonders gebunden an hohe Vegetation. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Lauschen Sie während der Brutzeit von Wegen aus, ohne
    Gesänge abzuspielen, Wiesen zu betreten oder versteckte Vögel aufzuscheuchen.
  it: >-
    Uccello migratore schivo di prati e distese erbose europee, particolarmente legato alla vegetazione alta.
    La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante il periodo riproduttivo,
    ascolta dai sentieri senza riprodurre canti, entrare nei prati né inseguire uccelli nascosti.
  pt: >-
    Ave migratória discreta de prados e ervaçais europeus, especialmente ligada a vegetação alta. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Durante a sua estadia reprodutora, escute a partir
    dos caminhos sem reproduzir cantos, entrar nos prados nem perseguir aves ocultas.
