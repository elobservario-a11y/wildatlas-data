id: sternula_albifrons
nombre_cientifico: Sternula albifrons
nombre:
  es: Charrancito común
  en: Little tern
  fr: Sterne naine
  de: Zwergseeschwalbe
  it: Fraticello
  pt: Chilreta
descripcion:
  es: >-
    Pequeño charrán que cría en playas, graveras e islas de costas y aguas interiores europeas. La IUCN la
    clasifica globalmente como preocupación menor (LC). Durante su estancia reproductora, observa sus vuelos
    desde fuera de las zonas cerradas sin aproximarte a nidos o pollos.
  en: >-
    Small tern breeding on beaches, gravel bars and islands of European coasts and inland waters. The IUCN
    classifies it globally as Least Concern (LC). During its breeding stay, watch its flights from outside
    cordoned areas without approaching nests or chicks.
  fr: >-
    Petite sterne qui niche sur les plages, grèves et îles des côtes et eaux intérieures européennes. L'UICN
    la classe globalement en préoccupation mineure (LC). Pendant son séjour reproducteur, observez ses vols
    depuis l'extérieur des zones fermées sans vous approcher des nids ou des poussins.
  de: >-
    Kleine Seeschwalbe, die an Stränden, Kiesbänken und auf Inseln europäischer Küsten und Binnengewässer
    brütet. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie während der Brutzeit ihre
    Flüge von außerhalb abgesperrter Bereiche, ohne sich Nestern oder Küken zu nähern.
  it: >-
    Piccola sterna che nidifica su spiagge, greti e isole delle coste e acque interne europee. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Durante il periodo riproduttivo, osserva i suoi
    voli dall'esterno delle aree chiuse senza avvicinarti a nidi o pulcini.
  pt: >-
    Pequena andorinha-do-mar que nidifica em praias, cascalheiras e ilhas de costas e águas interiores
    europeias. A IUCN classifica-a globalmente como pouco preocupante (LC). Durante a sua estadia reprodutora,
    observe os seus voos a partir do exterior das zonas vedadas sem se aproximar de ninhos ou crias.
