id: chelonia_mydas
nombre_cientifico: Chelonia mydas
nombre:
  es: Tortuga verde
  en: Green turtle
  fr: Tortue verte
  de: Grüne Meeresschildkröte
  pt: Tartaruga-verde
descripcion:
  es: >-
    Tortuga marina de aguas tropicales y subtropicales, también presente en el Mediterráneo oriental. La IUCN
    la clasifica globalmente como preocupación menor (LC). Cuando aparezca nadando o respirando, obsérvala a
    distancia sin tocarla, alimentarla ni usar luces en playas de puesta.
  en: >-
    Sea turtle of tropical and subtropical waters, also present in the eastern Mediterranean. The IUCN
    classifies it globally as Least Concern (LC). When seen swimming or breathing, watch from a distance
    without touching, feeding it or using lights on nesting beaches.
  fr: >-
    Tortue marine des eaux tropicales et subtropicales, également présente en Méditerranée orientale. L'UICN
    la classe globalement en préoccupation mineure (LC). Lorsqu'elle apparaît en train de nager ou de
    respirer, observez-la à distance sans la toucher, la nourrir ni utiliser de lumières sur les plages de
    ponte.
  de: >-
    Meeresschildkröte tropischer und subtropischer Gewässer, die auch im östlichen Mittelmeer vorkommt. Die
    IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Wenn sie schwimmend oder atmend erscheint,
    beobachten Sie sie aus der Ferne, ohne sie zu berühren, zu füttern oder Licht an Niststränden zu
    verwenden.
  pt: >-
    Tartaruga marinha de águas tropicais e subtropicais, também presente no Mediterrâneo oriental. A IUCN
    classifica-a globalmente como pouco preocupante (LC). Quando aparecer a nadar ou a respirar, observe-a à
    distância sem lhe tocar, alimentar nem usar luzes em praias de postura.
