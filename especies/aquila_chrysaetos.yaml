id: aquila_chrysaetos
nombre_cientifico: Aquila chrysaetos
nombre:
  es: Águila real
  en: Golden eagle
  fr: Aigle royal
  de: Steinadler
  it: Aquila reale
  pt: Águia-real
descripcion:
  es: >-
    Rapaz de montañas y paisajes abiertos, presente en distintas cordilleras y regiones del norte de Europa.
    La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvala de día en vuelo con prismáticos
    desde miradores, sin aproximarte a cortados de cría.
  en: >-
    Raptor of mountains and open landscapes, present across several European mountain ranges and northern
    regions. The IUCN classifies it globally as Least Concern (LC). Watch it soaring during the day with
    binoculars from viewpoints, without approaching nesting cliffs.
  fr: >-
    Rapace des montagnes et paysages ouverts, présent dans différents massifs et régions du nord de l'Europe.
    L'UICN le classe globalement en préoccupation mineure (LC). Observez-le en vol de jour aux jumelles depuis
    les belvédères, sans vous approcher des falaises de nidification.
  de: >-
    Greifvogel der Gebirge und offenen Landschaften, der in verschiedenen Gebirgszügen und Regionen
    Nordeuropas vorkommt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn
    tagsüber im Flug mit dem Fernglas von Aussichtspunkten aus, ohne sich Brutfelsen zu nähern.
  it: >-
    Rapace delle montagne e dei paesaggi aperti, presente in diverse catene montuose e regioni dell'Europa
    settentrionale. La IUCN la classifica a livello globale come a rischio minimo (LC). Osservala di giorno in
    volo con il binocolo dai punti panoramici, senza avvicinarti alle pareti di nidificazione.
  pt: >-
    Ave de rapina de montanhas e paisagens abertas, presente em várias cordilheiras e regiões do norte da
    Europa. A IUCN classifica-a globalmente como pouco preocupante (LC). Observe-a de dia em voo com binóculos
    a partir de miradouros, sem se aproximar de escarpas de nidificação.
