id: rosalia_alpina
nombre_cientifico: Rosalia alpina
nombre:
  es: Rosalía alpina
  en: Rosalia longicorn
  fr: Rosalie des Alpes
  de: Alpenbock
descripcion:
  es: >-
    Escarabajo de antenas largas ligado a madera muerta de bosques europeos, especialmente de hayas. La IUCN
    la clasifica globalmente como vulnerable (VU). En la estación de actividad adulta, observa troncos desde
    senderos sin capturarlo, mover madera ni desprender corteza.
  en: >-
    Longhorn beetle linked to dead wood in European forests, especially beechwoods. The IUCN classifies it
    globally as Vulnerable (VU). During the adult activity season, watch trunks from trails without catching
    it, moving wood or peeling bark.
  fr: >-
    Coléoptère à longues antennes lié au bois mort des forêts européennes, notamment de hêtres. L'UICN le
    classe globalement comme vulnérable (VU). Pendant la saison d'activité des adultes, observez les troncs
    depuis les sentiers sans le capturer, déplacer de bois ni arracher d'écorce.
  de: >-
    Bockkäfer, der an Totholz europäischer Wälder, besonders von Buchenwäldern, gebunden ist. Die IUCN stuft
    ihn weltweit als gefährdet (VU) ein. Beobachten Sie während der Flugzeit der Käfer Stämme von Wegen aus,
    ohne ihn zu fangen, Holz zu bewegen oder Rinde abzulösen.
