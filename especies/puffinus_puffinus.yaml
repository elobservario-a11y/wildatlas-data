id: puffinus_puffinus
nombre_cientifico: Puffinus puffinus
nombre:
  es: Pardela pichoneta
  en: Manx shearwater
  fr: Puffin des Anglais
  de: Schwarzschnabel-Sturmtaucher
  it: Berta minore atlantica
  pt: Bobo-pequeno
descripcion:
  es: >-
    Ave pelágica que cría en islas del Atlántico norte europeo y visita sus madrigueras principalmente de
    noche. La IUCN la clasifica globalmente como preocupación menor (LC). Durante su estancia reproductora,
    prioriza verla sobre el mar sin desembarcar en colonias ni utilizar luces junto a refugios.
  en: >-
    Pelagic bird breeding on islands of the European North Atlantic and visiting its burrows mainly at night.
    The IUCN classifies it globally as Least Concern (LC). During its breeding stay, favour seeing it over the
    sea without landing on colonies or using lights near shelters.
  fr: >-
    Oiseau pélagique qui niche sur les îles de l'Atlantique Nord européen et rejoint ses terriers surtout de
    nuit. L'UICN le classe globalement en préoccupation mineure (LC). Pendant son séjour reproducteur,
    privilégiez l'observation en mer sans débarquer dans les colonies ni utiliser de lumières près des abris.
  de: >-
    Hochseevogel, der auf Inseln des europäischen Nordatlantiks brütet und seine Höhlen vorwiegend nachts
    aufsucht. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Bevorzugen Sie zur Brutzeit die
    Beobachtung auf See, ohne Kolonien zu betreten oder in der Nähe von Bauen Licht zu verwenden.
  it: >-
    Uccello pelagico che nidifica su isole dell'Atlantico settentrionale europeo e raggiunge le tane
    soprattutto di notte. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante il
    periodo riproduttivo, prediligi l'osservazione in mare senza sbarcare nelle colonie né usare luci vicino
    ai rifugi.
  pt: >-
    Ave pelágica que nidifica em ilhas do Atlântico Norte europeu e visita as suas tocas sobretudo de noite. A
    IUCN classifica-a globalmente como pouco preocupante (LC). Durante a sua estadia reprodutora, dê
    preferência a vê-la no mar sem desembarcar em colónias nem usar luzes junto a abrigos.
