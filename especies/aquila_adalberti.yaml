id: aquila_adalberti
nombre_cientifico: Aquila adalberti
nombre:
  es: Águila imperial ibérica
  en: Spanish imperial eagle
  fr: Aigle ibérique
  de: Spanischer Kaiseradler
  it: Aquila imperiale iberica
  pt: Águia-imperial-ibérica
descripcion:
  es: >-
    Rapaz de la península ibérica ligada a montes mediterráneos y espacios abiertos con presas. La IUCN la
    clasifica globalmente como vulnerable (VU). De día, observa sus vuelos desde miradores, sin acercarte a
    árboles de cría ni utilizar cebos o reclamos.
  en: >-
    Raptor of the Iberian Peninsula associated with Mediterranean woodland and open areas with prey. The IUCN
    classifies it globally as Vulnerable (VU). During the day, watch its flights from viewpoints, without
    approaching nesting trees or using bait or playback.
  fr: >-
    Rapace de la péninsule Ibérique lié aux massifs méditerranéens et aux espaces ouverts riches en proies.
    L'UICN le classe globalement comme vulnérable (VU). De jour, observez ses vols depuis les belvédères, sans
    vous approcher des arbres de nidification ni utiliser d'appâts ou d'appeaux.
  de: >-
    Greifvogel der Iberischen Halbinsel, der an mediterrane Wälder und offene Landschaften mit Beutetieren
    gebunden ist. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie seine Flüge tagsüber von
    Aussichtspunkten aus, ohne sich Brutbäumen zu nähern oder Köder und Klangattrappen zu verwenden.
  it: >-
    Rapace della penisola iberica legato ai boschi mediterranei e agli spazi aperti ricchi di prede. La IUCN
    lo classifica a livello globale come vulnerabile (VU). Di giorno, osserva i suoi voli dai punti
    panoramici, senza avvicinarti agli alberi di nidificazione né usare esche o richiami.
  pt: >-
    Ave de rapina da Península Ibérica ligada a montes mediterrânicos e espaços abertos com presas. A IUCN
    classifica-a globalmente como vulnerável (VU). De dia, observe os seus voos a partir de miradouros, sem se
    aproximar de árvores de nidificação nem utilizar iscos ou chamarizes.
