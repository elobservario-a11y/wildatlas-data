id: falco_biarmicus
nombre_cientifico: Falco biarmicus
nombre:
  es: Halcón borní
  en: Lanner falcon
  fr: Faucon lanier
  de: Lannerfalke
  it: Lanario
  pt: Falcão-borni
descripcion:
  es: >-
    Halcón de hábitats abiertos, presente en el sureste de Europa y regiones próximas de África y Asia. La
    IUCN la clasifica globalmente como preocupación menor (LC). Obsérvalo de día en vuelo con prismáticos
    desde miradores sin acercarte a nidos ni utilizar cebos.
  en: >-
    Falcon of open habitats, present in south-eastern Europe and adjacent parts of Africa and Asia. The IUCN
    classifies it globally as Least Concern (LC). Watch it in flight during the day with binoculars from
    viewpoints without approaching nests or using bait.
  fr: >-
    Faucon des milieux ouverts, présent dans le sud-est de l'Europe et les régions voisines d'Afrique et
    d'Asie. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le en vol de jour aux
    jumelles depuis les belvédères sans vous approcher des nids ni utiliser d'appâts.
  de: >-
    Falke offener Lebensräume, der in Südosteuropa sowie angrenzenden Teilen Afrikas und Asiens vorkommt. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn tagsüber im Flug mit dem Fernglas
    von Aussichtspunkten aus, ohne sich Nestern zu nähern oder Köder auszulegen.
  it: >-
    Falco di ambienti aperti, presente nell'Europa sud-orientale e nelle regioni vicine di Africa e Asia. La
    IUCN lo classifica a livello globale come a rischio minimo (LC). Osservalo di giorno in volo con il
    binocolo dai punti panoramici senza avvicinarti ai nidi né usare esche.
  pt: >-
    Falcão de habitats abertos, presente no sudeste da Europa e em regiões próximas de África e Ásia. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Observe-o de dia em voo com binóculos a partir de
    miradouros sem se aproximar de ninhos nem usar iscos.
