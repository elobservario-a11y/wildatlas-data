id: alca_torda
nombre_cientifico: Alca torda
nombre:
  es: Alca común
  en: Razorbill
  fr: Petit pingouin
  de: Tordalk
  it: Gazza marina
  pt: Torda-mergulheira
descripcion:
  es: >-
    Ave buceadora de islas y acantilados del Atlántico norte europeo, que también pasa tiempo en mar abierto.
    La IUCN la clasifica globalmente como preocupación menor (LC). En época de cría, utiliza miradores
    alejados de las repisas sin entrar en colonias ni provocar vuelos.
  en: >-
    Diving seabird of islands and cliffs of the European North Atlantic, which also spends time in open sea.
    The IUCN classifies it globally as Least Concern (LC). During the breeding season, use viewpoints well
    away from ledges without entering colonies or flushing birds.
  fr: >-
    Oiseau plongeur des îles et falaises de l'Atlantique Nord européen, qui passe aussi du temps en pleine
    mer. L'UICN le classe globalement en préoccupation mineure (LC). En période de reproduction, utilisez les
    belvédères éloignés des corniches sans entrer dans les colonies ni provoquer d'envols.
  de: >-
    Tauchvogel der Inseln und Klippen des europäischen Nordatlantiks, der auch Zeit auf offener See verbringt.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Nutzen Sie zur Brutzeit Aussichtspunkte abseits
    der Felsbänder, ohne Kolonien zu betreten oder Vögel aufzuscheuchen.
  it: >-
    Uccello tuffatore di isole e scogliere dell'Atlantico settentrionale europeo, che trascorre tempo anche in
    mare aperto. La IUCN lo classifica a livello globale come a rischio minimo (LC). Nella stagione
    riproduttiva, utilizza punti di osservazione lontani dalle cenge senza entrare nelle colonie né provocare
    involi.
  pt: >-
    Ave mergulhadora de ilhas e falésias do Atlântico Norte europeu, que também passa tempo em mar aberto. A
    IUCN classifica-a globalmente como pouco preocupante (LC). Na época de reprodução, utilize miradouros
    afastados das cornijas sem entrar em colónias nem provocar levantamentos de voo.
