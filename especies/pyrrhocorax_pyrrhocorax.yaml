id: pyrrhocorax_pyrrhocorax
nombre_cientifico: Pyrrhocorax pyrrhocorax
nombre:
  es: Chova piquirroja
  en: Red-billed chough
  fr: Crave à bec rouge
  de: Alpenkrähe
  it: Gracchio corallino
  pt: Gralha-de-bico-vermelho
descripcion:
  es: >-
    Córvido de pico rojo presente en montañas y acantilados de distintas regiones europeas. La IUCN la
    clasifica globalmente como preocupación menor (LC). De día, observa bandos en vuelo o alimentándose desde
    senderos, sin aproximarte a cavidades de cría ni dar comida.
  en: >-
    Red-billed corvid present in mountains and cliffs across several European regions. The IUCN classifies it
    globally as Least Concern (LC). During the day, watch flocks in flight or feeding from trails, without
    approaching nesting cavities or giving food.
  fr: >-
    Corvidé au bec rouge présent dans les montagnes et falaises de différentes régions européennes. L'UICN le
    classe globalement en préoccupation mineure (LC). De jour, observez les groupes en vol ou en train de se
    nourrir depuis les sentiers, sans vous approcher des cavités de nidification ni donner de nourriture.
  de: >-
    Rotschnäbliger Rabenvogel in Gebirgen und an Klippen verschiedener europäischer Regionen. Die IUCN stuft
    sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie Trupps tagsüber im Flug oder bei der
    Nahrungssuche von Wegen aus, ohne sich Bruthöhlen zu nähern oder Futter zu geben.
  it: >-
    Corvide dal becco rosso presente in montagne e scogliere di diverse regioni europee. La IUCN lo classifica
    a livello globale come a rischio minimo (LC). Di giorno, osserva gli stormi in volo o mentre si nutrono
    dai sentieri, senza avvicinarti alle cavità di nidificazione né dare cibo.
  pt: >-
    Corvídeo de bico vermelho presente em montanhas e falésias de várias regiões europeias. A IUCN
    classifica-a globalmente como pouco preocupante (LC). De dia, observe bandos em voo ou a alimentar-se a
    partir dos trilhos, sem se aproximar de cavidades de criação nem dar comida.
