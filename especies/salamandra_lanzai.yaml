id: salamandra_lanzai
nombre_cientifico: Salamandra lanzai
nombre:
  es: Salamandra de Lanza
  en: Lanza's alpine salamander
  fr: Salamandre de Lanza
  de: Lanzas Alpensalamander
descripcion:
  es: >-
    Salamandra de bosques, prados y pastos de los Alpes occidentales de Francia e Italia. La IUCN la clasifica
    globalmente como en peligro crítico (CR). Durante su actividad con tiempo húmedo, obsérvala desde senderos
    sin tocarla, mover piedras ni pisar la vegetación.
  en: >-
    Salamander of forests, meadows and pastures in the western Alps of France and Italy. The IUCN classifies
    it globally as Critically Endangered (CR). When active in wet weather, watch from trails without touching
    it, moving stones or trampling vegetation.
  fr: >-
    Salamandre des forêts, prairies et alpages des Alpes occidentales de France et d'Italie. L'UICN la classe
    globalement en danger critique (CR). Lors de son activité par temps humide, observez-la depuis les
    sentiers sans la toucher, déplacer de pierres ni piétiner la végétation.
  de: >-
    Salamander der Wälder, Wiesen und Weiden der Westalpen Frankreichs und Italiens. Die IUCN stuft ihn
    weltweit als vom Aussterben bedroht (CR) ein. Beobachten Sie ihn bei feuchtem Wetter von Wegen aus, ohne
    ihn anzufassen, Steine zu bewegen oder die Vegetation zu zertreten.
