id: marmota_bobak
nombre_cientifico: Marmota bobak
nombre:
  es: Marmota de las estepas
  en: Bobak marmot
  de: Steppenmurmeltier
descripcion:
  es: >-
    Roedor social de pastizales esteparios del este de Europa y Asia central, que pasa una larga estación en
    hibernación. La IUCN la clasifica globalmente como preocupación menor (LC). Durante la estación activa,
    observa los grupos desde caminos sin ofrecer comida ni aproximarte a madrigueras.
  en: >-
    Social rodent of steppe grasslands of eastern Europe and Central Asia, spending a long season in
    hibernation. The IUCN classifies it globally as Least Concern (LC). During the active season, watch groups
    from tracks without offering food or approaching burrows.
  de: >-
    Geselliges Nagetier der Steppengrasländer Osteuropas und Zentralasiens, das eine lange Zeit im
    Winterschlaf verbringt. Die IUCN stuft es weltweit als nicht gefährdet (LC) ein. Beobachten Sie Gruppen
    während der aktiven Jahreszeit von Wegen aus, ohne zu füttern oder sich Bauen zu nähern.
