id: capra_ibex
nombre_cientifico: Capra ibex
nombre:
  es: Íbice alpino
  en: Alpine ibex
  fr: Bouquetin des Alpes
  de: Alpensteinbock
  pt: Íbex
descripcion:
  es: >-
    Cabra de grandes cuernos que habita roquedos escarpados y praderas de los Alpes. La IUCN la clasifica
    globalmente como preocupación menor (LC). Obsérvala durante sus desplazamientos y pastoreo desde senderos,
    sin acercarte ni ofrecerle comida.
  en: >-
    Large-horned goat inhabiting steep crags and meadows of the Alps. The IUCN classifies it globally as Least
    Concern (LC). Watch it moving and grazing from trails, without approaching it or offering food.
  fr: >-
    Bouquetin aux grandes cornes qui habite les parois escarpées et pelouses des Alpes. L'UICN le classe
    globalement en préoccupation mineure (LC). Observez-le lors de ses déplacements et au pâturage depuis les
    sentiers, sans vous approcher ni lui donner de nourriture.
  de: >-
    Steinbock mit mächtigen Hörnern, der steile Felswände und Almen der Alpen bewohnt. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie ihn bei seinen Zügen und beim Äsen von Wegen aus,
    ohne sich zu nähern oder Futter anzubieten.
  pt: >-
    Cabra de grandes cornos que habita rochedos escarpados e prados dos Alpes. A IUCN classifica-a globalmente
    como pouco preocupante (LC). Observe-a durante as suas deslocações e pastoreio a partir dos trilhos, sem
    se aproximar nem lhe oferecer comida.
