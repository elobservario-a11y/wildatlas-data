id: milvus_milvus
nombre_cientifico: Milvus milvus
nombre:
  es: Milano real
  en: Red kite
  fr: Milan royal
  de: Rotmilan
  it: Nibbio reale
  pt: Milhafre-real
descripcion:
  es: >-
    Rapaz de cola ahorquillada que ocupa bosques claros, pastos y campos de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). En invierno pueden verse concentraciones desde puntos distantes,
    sin acercarte a dormideros ni ofrecer comida.
  en: >-
    Fork-tailed raptor occupying open woodlands, pastures and fields across Europe. The IUCN classifies it
    globally as Least Concern (LC). In winter, gatherings can be watched from distant points, without
    approaching roosts or offering food.
  fr: >-
    Rapace à queue fourchue qui occupe boisements clairs, pâturages et champs d'Europe. L'UICN le classe
    globalement en préoccupation mineure (LC). En hiver, des rassemblements peuvent être observés depuis des
    points éloignés, sans s'approcher des dortoirs ni donner de nourriture.
  de: >-
    Greifvogel mit tief gegabeltem Schwanz, der lichte Wälder, Weiden und Felder Europas besiedelt. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Im Winter lassen sich Ansammlungen aus der Ferne
    beobachten, ohne sich Schlafplätzen zu nähern oder Futter auszulegen.
  it: >-
    Rapace dalla coda forcuta che occupa boschi radi, pascoli e campi d'Europa. La IUCN lo classifica a
    livello globale come a rischio minimo (LC). In inverno si possono osservare concentrazioni da punti
    distanti, senza avvicinarsi ai dormitori né offrire cibo.
  pt: >-
    Ave de rapina de cauda furcada que ocupa florestas claras, pastagens e campos da Europa. A IUCN
    classifica-o globalmente como pouco preocupante (LC). No inverno podem observar-se concentrações a partir
    de pontos distantes, sem se aproximar de dormitórios nem oferecer comida.
