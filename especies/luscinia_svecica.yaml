id: luscinia_svecica
nombre_cientifico: Luscinia svecica
nombre:
  es: Pechiazul
  en: Bluethroat
  fr: Gorgebleue à miroir
  de: Blaukehlchen
  it: Pettazzurro
  pt: Pisco-de-peito-azul
descripcion:
  es: >-
    Pequeña ave migratoria ligada a matorrales húmedos y vegetación palustre, con distintas poblaciones
    reproductoras europeas. La IUCN la clasifica globalmente como preocupación menor (LC). Durante el paso
    migratorio, observa bordes de humedales desde senderos sin entrar en la vegetación ni reproducir cantos.
  en: >-
    Small migratory bird linked to damp scrub and marsh vegetation, with several European breeding
    populations. The IUCN classifies it globally as Least Concern (LC). During migration, watch wetland edges
    from trails without entering vegetation or playing back calls.
  fr: >-
    Petit oiseau migrateur lié aux fourrés humides et à la végétation palustre, comptant plusieurs populations
    nicheuses européennes. L'UICN le classe globalement en préoccupation mineure (LC). Lors du passage
    migratoire, observez les bordures de zones humides depuis les sentiers sans entrer dans la végétation ni
    diffuser de chants.
  de: >-
    Kleiner Zugvogel feuchter Gebüsche und Sumpfvegetation mit verschiedenen europäischen Brutpopulationen.
    Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie während des Vogelzugs
    Feuchtgebietsränder von Wegen aus, ohne die Vegetation zu betreten oder Gesänge abzuspielen.
  it: >-
    Piccolo uccello migratore legato ad arbusteti umidi e vegetazione palustre, con diverse popolazioni
    nidificanti europee. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante il passo
    migratorio, osserva i margini delle zone umide dai sentieri senza entrare nella vegetazione né riprodurre
    canti.
  pt: >-
    Pequena ave migratória ligada a matagais húmidos e vegetação palustre, com várias populações reprodutoras
    europeias. A IUCN classifica-a globalmente como pouco preocupante (LC). Durante a passagem migratória,
    observe as orlas das zonas húmidas a partir dos trilhos sem entrar na vegetação nem reproduzir cantos.
