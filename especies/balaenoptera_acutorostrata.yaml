id: balaenoptera_acutorostrata
nombre_cientifico: Balaenoptera acutorostrata
nombre:
  es: Rorcual aliblanco
  en: Minke whale
  fr: Petit rorqual
  de: Minkwal
  pt: Baleia-de-minke
descripcion:
  es: >-
    Pequeño rorcual presente en aguas del Atlántico europeo, que también puede acercarse a las costas. La IUCN
    la clasifica globalmente como preocupación menor (LC). Cuando aflore para respirar, obsérvalo desde costa
    o con operadores responsables sin perseguirlo ni interceptar su rumbo.
  en: >-
    Small rorqual whale present in European Atlantic waters, which can also approach coasts. The IUCN
    classifies it globally as Least Concern (LC). When it surfaces to breathe, watch it from shore or with
    responsible operators without chasing it or cutting across its path.
  fr: >-
    Petit rorqual présent dans les eaux de l'Atlantique européen, qui peut aussi s'approcher des côtes. L'UICN
    le classe globalement en préoccupation mineure (LC). Lorsqu'il fait surface pour respirer, observez-le
    depuis la côte ou avec des opérateurs responsables sans le poursuivre ni couper sa route.
  de: >-
    Kleiner Furchenwal der europäischen Atlantikgewässer, der sich auch Küsten nähern kann. Die IUCN stuft ihn
    weltweit als nicht gefährdet (LC) ein. Wenn er zum Atmen auftaucht, beobachten Sie ihn von der Küste oder
    mit verantwortungsvollen Anbietern aus, ohne ihn zu verfolgen oder seinen Kurs zu kreuzen.
  pt: >-
    Pequeno rorqual presente em águas do Atlântico europeu, que também pode aproximar-se das costas. A IUCN
    classifica-o globalmente como pouco preocupante (LC). Quando vier à superfície para respirar, observe-o a
    partir da costa ou com operadores responsáveis sem o perseguir nem intercetar o seu rumo.
