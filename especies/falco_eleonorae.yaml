id: falco_eleonorae
nombre_cientifico: Falco eleonorae
nombre:
  es: Halcón de Eleonora
  en: Eleonora's falcon
  fr: Faucon d'Éléonore
  de: Eleonorenfalke
  it: Falco della Regina
  pt: Falcão-da-rainha
descripcion:
  es: >-
    Halcón migratorio que cría en islas y acantilados mediterráneos y macaronésicos. La IUCN la clasifica
    globalmente como preocupación menor (LC). Durante su estancia estival, observa los vuelos desde puntos
    autorizados sin acercarte a colonias ni usar reclamos.
  en: >-
    Migratory falcon breeding on Mediterranean and Macaronesian islands and sea cliffs. The IUCN classifies it
    globally as Least Concern (LC). During its summer stay, watch its flights from authorised points without
    approaching colonies or using playback.
  fr: >-
    Faucon migrateur qui niche sur les îles et falaises méditerranéennes et macaronésiennes. L'UICN le classe
    globalement en préoccupation mineure (LC). Pendant son séjour estival, observez ses vols depuis des points
    autorisés sans vous approcher des colonies ni utiliser d'appeaux.
  de: >-
    Zugfalke, der auf Inseln und Klippen des Mittelmeers und Makaronesiens brütet. Die IUCN stuft ihn weltweit
    als nicht gefährdet (LC) ein. Beobachten Sie während seines Sommeraufenthalts seine Flüge von zugelassenen
    Punkten aus, ohne sich Kolonien zu nähern oder Klangattrappen zu nutzen.
  it: >-
    Falco migratore che nidifica su isole e scogliere del Mediterraneo e della Macaronesia. La IUCN lo
    classifica a livello globale come a rischio minimo (LC). Durante la sua permanenza estiva, osserva i voli
    da punti autorizzati senza avvicinarti alle colonie né usare richiami.
  pt: >-
    Falcão migratório que nidifica em ilhas e falésias mediterrânicas e macaronésicas. A IUCN classifica-o
    globalmente como pouco preocupante (LC). Durante a sua estadia estival, observe os voos a partir de pontos
    autorizados sem se aproximar de colónias nem usar chamarizes.
