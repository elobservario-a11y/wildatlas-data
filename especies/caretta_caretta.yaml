id: caretta_caretta
nombre_cientifico: Caretta caretta
nombre:
  es: Tortuga boba
  en: Loggerhead sea turtle
  fr: Tortue caouanne
  de: Unechte Karettschildkröte
  pt: Tartaruga-comum
descripcion:
  es: >-
    Tortuga marina de aguas atlánticas y mediterráneas, que utiliza costas del sur europeo para reproducirse.
    La IUCN la clasifica globalmente como vulnerable (VU). Obsérvala cuando aflore en el mar sin seguirla ni
    tocarla, respetando los cierres y evitando luces en playas de puesta.
  en: >-
    Sea turtle of Atlantic and Mediterranean waters, using southern European coasts for nesting. The IUCN
    classifies it globally as Vulnerable (VU). Watch it when it surfaces at sea without following or touching
    it, respecting closures and avoiding lights on nesting beaches.
  fr: >-
    Tortue marine des eaux atlantiques et méditerranéennes, qui utilise les côtes du sud de l'Europe pour se
    reproduire. L'UICN la classe globalement comme vulnérable (VU). Observez-la lorsqu'elle fait surface en
    mer sans la suivre ni la toucher, en respectant les fermetures et en évitant les lumières sur les plages
    de ponte.
  de: >-
    Meeresschildkröte atlantischer und mediterraner Gewässer, die Küsten Südeuropas zur Eiablage nutzt. Die
    IUCN stuft sie weltweit als gefährdet (VU) ein. Beobachten Sie sie beim Auftauchen im Meer, ohne ihr zu
    folgen oder sie zu berühren, beachten Sie Sperrungen und vermeiden Sie Licht an Niststränden.
  pt: >-
    Tartaruga marinha de águas atlânticas e mediterrânicas, que utiliza costas do sul europeu para se
    reproduzir. A IUCN classifica-a globalmente como vulnerável (VU). Observe-a quando vier à superfície no
    mar sem a seguir nem lhe tocar, respeitando os encerramentos e evitando luzes em praias de postura.
