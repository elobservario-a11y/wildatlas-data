id: phalacrocorax_carbo
nombre_cientifico: Phalacrocorax carbo
nombre:
  es: Cormorán grande
  en: Great cormorant
  fr: Grand cormoran
  de: Kormoran
  it: Cormorano comune
  pt: Corvo-marinho-de-faces-brancas
descripcion:
  es: >-
    Ave acuática buceadora de costas, estuarios, ríos y lagos de gran parte de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). De día, observa pesca y descanso desde miradores sin acercarte a
    posaderos colectivos ni provocar vuelos.
  en: >-
    Diving waterbird of coasts, estuaries, rivers and lakes across much of Europe. The IUCN classifies it
    globally as Least Concern (LC). During the day, watch fishing and resting from viewpoints without
    approaching communal roosts or flushing birds.
  fr: >-
    Oiseau aquatique plongeur des côtes, estuaires, rivières et lacs d'une grande partie de l'Europe. L'UICN
    le classe globalement en préoccupation mineure (LC). De jour, observez pêche et repos depuis les
    belvédères sans vous approcher des dortoirs collectifs ni provoquer d'envols.
  de: >-
    Tauchender Wasservogel von Küsten, Flussmündungen, Flüssen und Seen in weiten Teilen Europas. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie tagsüber Fischen und Ruhen von
    Aussichtspunkten aus, ohne sich Gemeinschaftsschlafplätzen zu nähern oder Vögel aufzuscheuchen.
  it: >-
    Uccello acquatico tuffatore di coste, estuari, fiumi e laghi di gran parte d'Europa. La IUCN lo classifica
    a livello globale come a rischio minimo (LC). Di giorno, osserva pesca e riposo dai punti panoramici senza
    avvicinarti ai dormitori collettivi né provocare involi.
  pt: >-
    Ave aquática mergulhadora de costas, estuários, rios e lagos de grande parte da Europa. A IUCN
    classifica-a globalmente como pouco preocupante (LC). De dia, observe pesca e descanso a partir de
    miradouros sem se aproximar de dormitórios coletivos nem provocar levantamentos de voo.
