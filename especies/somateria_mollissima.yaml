id: somateria_mollissima
nombre_cientifico: Somateria mollissima
nombre:
  es: Eider común
  en: Common eider
  fr: Eider à duvet
  de: Eiderente
  it: Edredone
  pt: Eider-edredão
descripcion:
  es: >-
    Pato marino de costas frías del norte de Europa, que cría en islas y ambientes costeros. La IUCN la
    clasifica globalmente como casi amenazada (NT). Obsérvalo de día desde miradores costeros sin acercarte a
    hembras con pollos ni entrar en colonias.
  en: >-
    Sea duck of cold northern European coasts, breeding on islands and coastal habitats. The IUCN classifies
    it globally as Near Threatened (NT). Watch it during the day from coastal viewpoints without approaching
    females with ducklings or entering colonies.
  fr: >-
    Canard marin des côtes froides du nord de l'Europe, qui niche sur les îles et milieux côtiers. L'UICN le
    classe globalement quasi menacé (NT). Observez-le de jour depuis les belvédères côtiers sans vous
    approcher des femelles avec des jeunes ni entrer dans les colonies.
  de: >-
    Meeresente kalter Küsten Nordeuropas, die auf Inseln und in Küstenlebensräumen brütet. Die IUCN stuft sie
    weltweit als potenziell gefährdet (NT) ein. Beobachten Sie sie tagsüber von Küsten-Aussichtspunkten aus,
    ohne sich Weibchen mit Küken zu nähern oder Kolonien zu betreten.
  it: >-
    Anatra marina delle coste fredde del nord Europa, che nidifica su isole e ambienti costieri. La IUCN lo
    classifica a livello globale come prossimo alla minaccia (NT). Osservalo di giorno dai punti panoramici
    costieri senza avvicinarti alle femmine con piccoli né entrare nelle colonie.
  pt: >-
    Pato marinho de costas frias do norte da Europa, que nidifica em ilhas e ambientes costeiros. A IUCN
    classifica-o globalmente como quase ameaçado (NT). Observe-o de dia a partir de miradouros costeiros sem
    se aproximar de fêmeas com crias nem entrar em colónias.
