id: limosa_limosa
nombre_cientifico: Limosa limosa
nombre:
  es: Aguja colinegra
  en: Black-tailed godwit
  fr: Barge à queue noire
  de: Uferschnepfe
  it: Pittima reale
  pt: Maçarico-de-bico-direito
descripcion:
  es: >-
    Limícola migratoria que cría en prados húmedos y marismas europeos y utiliza humedales durante el paso y
    la invernada. La IUCN la clasifica globalmente como casi amenazada (NT). En migración o invierno, observa
    bandos desde miradores sin entrar en prados de cría ni hacerlos levantar.
  en: >-
    Migratory wader breeding in European damp meadows and marshes and using wetlands during passage and
    wintering. The IUCN classifies it globally as Near Threatened (NT). On migration or in winter, watch
    flocks from viewpoints without entering breeding meadows or flushing them.
  fr: >-
    Limicole migrateur qui niche dans les prairies humides et marais européens et fréquente les zones humides
    lors du passage et de l'hivernage. L'UICN le classe globalement quasi menacé (NT). En migration ou en
    hiver, observez les groupes depuis les belvédères sans entrer dans les prairies de nidification ni les
    faire décoller.
  de: >-
    Ziehender Watvogel, der auf europäischen Feuchtwiesen und in Marschen brütet und auf dem Zug sowie im
    Winter Feuchtgebiete nutzt. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie
    Trupps auf dem Zug oder im Winter von Aussichtspunkten aus, ohne Brutwiesen zu betreten oder sie
    aufzuscheuchen.
  it: >-
    Limicolo migratore che nidifica in prati umidi e paludi europee e utilizza le zone umide durante il passo
    e lo svernamento. La IUCN lo classifica a livello globale come prossimo alla minaccia (NT). In migrazione
    o in inverno, osserva gli stormi dai punti panoramici senza entrare nei prati di nidificazione né farli
    involare.
  pt: >-
    Limícola migratória que nidifica em prados húmidos e sapais europeus e utiliza zonas húmidas durante a
    passagem e a invernada. A IUCN classifica-a globalmente como quase ameaçada (NT). Em migração ou no
    inverno, observe os bandos a partir de miradouros sem entrar em prados de criação nem os fazer levantar
    voo.
