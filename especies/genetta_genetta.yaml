id: genetta_genetta
nombre_cientifico: Genetta genetta
nombre:
  es: Gineta
  en: Common genet
  fr: Genette commune
  de: Kleinfleck-Ginsterkatze
  pt: Gineta
descripcion:
  es: >-
    Pequeño carnívoro de origen africano establecido en el suroeste europeo, donde ocupa ambientes arbolados y
    con refugios. La IUCN la clasifica globalmente como preocupación menor (LC). Al anochecer, espera
    encuentros desde caminos sin utilizar cebos, iluminar refugios ni perseguirla.
  en: >-
    Small carnivore of African origin established in south-western Europe, where it occupies wooded habitats
    with shelters. The IUCN classifies it globally as Least Concern (LC). At dusk, wait for encounters from
    tracks without using bait, shining lights on dens or chasing it.
  fr: >-
    Petit carnivore d'origine africaine établi dans le sud-ouest de l'Europe, où il occupe les milieux boisés
    pourvus de gîtes. L'UICN le classe globalement en préoccupation mineure (LC). À la tombée du jour,
    attendez une rencontre depuis les chemins sans utiliser d'appâts, éclairer les gîtes ni la poursuivre.
  de: >-
    Kleiner Raubsäuger afrikanischen Ursprungs, der im Südwesten Europas etabliert ist und bewaldete
    Lebensräume mit Verstecken besiedelt. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Warten Sie
    in der Dämmerung von Wegen aus auf Sichtungen, ohne Köder auszulegen, Verstecke anzuleuchten oder das Tier
    zu verfolgen.
  pt: >-
    Pequeno carnívoro de origem africana estabelecido no sudoeste europeu, onde ocupa ambientes arborizados
    com abrigos. A IUCN classifica-a globalmente como pouco preocupante (LC). Ao anoitecer, aguarde encontros
    a partir dos caminhos sem utilizar iscos, iluminar abrigos nem a perseguir.
