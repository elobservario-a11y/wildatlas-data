id: pterodroma_deserta
nombre_cientifico: Pterodroma deserta
nombre:
  es: Petrel de Desertas
  en: Desertas petrel
  fr: Pétrel des Desertas
  de: Desertassturmvogel
  it: Petrello delle Desertas
  pt: Grazina-de-desertas
descripcion:
  es: >-
    Ave pelágica que se reproduce en el archipiélago de Madeira y pasa gran parte de su vida en el océano. La
    IUCN la clasifica globalmente como vulnerable (VU). Durante su estancia reproductora, obsérvala sobre el
    mar con operadores responsables sin acceder a colonias ni utilizar luces.
  en: >-
    Pelagic bird breeding in the Madeira archipelago and spending much of its life at sea. The IUCN classifies
    it globally as Vulnerable (VU). During its breeding stay, watch it over the sea with responsible operators
    without accessing colonies or using lights.
  fr: >-
    Oiseau pélagique qui niche dans l'archipel de Madère et passe une grande partie de sa vie en mer. L'UICN
    le classe globalement comme vulnérable (VU). Pendant son séjour reproducteur, observez-le en mer avec des
    opérateurs responsables sans accéder aux colonies ni utiliser de lumières.
  de: >-
    Hochseevogel, der auf dem Madeira-Archipel brütet und einen Großteil seines Lebens auf dem Ozean
    verbringt. Die IUCN stuft ihn weltweit als gefährdet (VU) ein. Beobachten Sie ihn zur Brutzeit auf See mit
    verantwortungsvollen Anbietern, ohne Kolonien zu betreten oder Licht einzusetzen.
  it: >-
    Uccello pelagico che nidifica nell'arcipelago di Madera e trascorre gran parte della vita nell'oceano. La
    IUCN lo classifica a livello globale come vulnerabile (VU). Durante il periodo riproduttivo, osservalo in
    mare con operatori responsabili senza accedere alle colonie né usare luci.
  pt: >-
    Ave pelágica que nidifica no arquipélago da Madeira e passa grande parte da sua vida no oceano. A IUCN
    classifica-a globalmente como vulnerável (VU). Durante a sua estadia reprodutora, observe-a no mar com
    operadores responsáveis sem aceder a colónias nem utilizar luzes.
