id: lacerta_taurica
nombre_cientifico: Lacerta taurica
nombre:
  es: Lacerta taurica
descripcion:
  es: >-
    Lagartija de estepas, prados y matorrales abiertos del sureste de Europa, citada actualmente como Podarcis
    tauricus. La IUCN la clasifica globalmente como preocupación menor (LC). Durante recorridos diurnos en la
    estación templada, obsérvala sin capturarla, perseguirla ni levantar sus refugios.
