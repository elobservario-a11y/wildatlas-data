id: puffinus_gravis
nombre_cientifico: Puffinus gravis
nombre:
  es: Pardela capirotada
  en: Great shearwater
  fr: Puffin majeur
  de: Grosser Sturmtaucher
descripcion:
  es: >-
    Pardela que cría en islas del Atlántico sur y alcanza aguas atlánticas europeas durante su migración. La
    IUCN la clasifica globalmente como preocupación menor (LC). A finales de verano y en otoño, observa sus
    vuelos desde cabos y salidas responsables sin perseguir aves.
  en: >-
    Shearwater breeding on South Atlantic islands and reaching European Atlantic waters on migration. The IUCN
    classifies it globally as Least Concern (LC). In late summer and autumn, watch its flights from headlands
    and responsible boat trips without chasing birds.
  fr: >-
    Puffin qui niche sur les îles de l'Atlantique Sud et atteint les eaux atlantiques européennes lors de sa
    migration. L'UICN le classe globalement en préoccupation mineure (LC). En fin d'été et en automne,
    observez ses vols depuis les caps et lors de sorties responsables sans poursuivre les oiseaux.
  de: >-
    Sturmtaucher, der auf Inseln des Südatlantiks brütet und auf seinem Zug europäische Atlantikgewässer
    erreicht. Die IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie seine Flüge im
    Spätsommer und Herbst von Kaps und verantwortungsvollen Ausfahrten aus, ohne Vögel zu verfolgen.
