id: columba_trocaz
nombre_cientifico: Columba trocaz
nombre:
  es: Paloma trocaz
  en: Trocaz pigeon
  fr: Pigeon trocaz
  de: Silberhalstaube
  it: Colomba di Madera
  pt: Pombo-trocaz
descripcion:
  es: >-
    Paloma endémica de Madeira ligada a bosques de laurisilva y laderas arboladas. La IUCN la clasifica
    globalmente como preocupación menor (LC). Durante recorridos diurnos, observa las copas desde senderos
    señalizados sin usar reclamos ni acercarte a nidos.
  en: >-
    Pigeon endemic to Madeira linked to laurel forests and wooded slopes. The IUCN classifies it globally as
    Least Concern (LC). During daytime walks, scan the canopy from marked trails without using playback or
    approaching nests.
  fr: >-
    Pigeon endémique de Madère lié aux forêts de laurisylve et aux versants boisés. L'UICN le classe
    globalement en préoccupation mineure (LC). Lors de randonnées diurnes, observez la canopée depuis les
    sentiers balisés sans utiliser d'appeaux ni vous approcher des nids.
  de: >-
    Auf Madeira endemische Taube, die an Lorbeerwälder und bewaldete Hänge gebunden ist. Die IUCN stuft sie
    weltweit als nicht gefährdet (LC) ein. Beobachten Sie bei Tageswanderungen die Baumkronen von markierten
    Wegen aus, ohne Klangattrappen zu verwenden oder sich Nestern zu nähern.
  it: >-
    Colombo endemico di Madeira legato alle foreste di laurisilva e ai pendii boscosi. La IUCN la classifica a
    livello globale come a rischio minimo (LC). Durante le escursioni diurne, osserva le chiome dai sentieri
    segnalati senza usare richiami né avvicinarti ai nidi.
  pt: >-
    Pombo endémico da Madeira ligado a florestas de laurissilva e encostas arborizadas. A IUCN classifica-o
    globalmente como pouco preocupante (LC). Durante percursos diurnos, observe as copas a partir de trilhos
    sinalizados sem usar chamarizes nem se aproximar de ninhos.
