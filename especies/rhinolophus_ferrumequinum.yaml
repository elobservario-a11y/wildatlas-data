id: rhinolophus_ferrumequinum
nombre_cientifico: Rhinolophus ferrumequinum
nombre:
  es: Murciélago grande de herradura
  en: Greater horseshoe bat
  fr: Grand Rhinolophe fer à cheval
  de: Große Hufeisennase
descripcion:
  es: >-
    Murciélago de bosques, matorrales y pastizales del sur y otras regiones de Europa, que usa refugios
    subterráneos. La IUCN la clasifica globalmente como preocupación menor (LC). Obsérvalo al anochecer desde
    fuera de los refugios, sin entrar durante la cría o hibernación ni utilizar flash.
  en: >-
    Bat of forests, scrubland and pastures in southern and other parts of Europe, using underground roosts.
    The IUCN classifies it globally as Least Concern (LC). Watch it at dusk from outside roosts, without
    entering during breeding or hibernation or using flash.
  fr: >-
    Chauve-souris des forêts, maquis et pâturages du sud et d'autres régions d'Europe, qui utilise des gîtes
    souterrains. L'UICN le classe globalement en préoccupation mineure (LC). Observez-le au crépuscule depuis
    l'extérieur des gîtes, sans entrer pendant la mise bas ou l'hibernation ni utiliser de flash.
  de: >-
    Fledermaus von Wäldern, Buschland und Weiden im Süden und anderen Teilen Europas, die unterirdische
    Quartiere nutzt. Die IUCN stuft sie weltweit als nicht gefährdet (LC) ein. Beobachten Sie sie in der
    Dämmerung von außerhalb der Quartiere, ohne während der Jungenaufzucht oder Winterruhe einzutreten oder
    Blitzlicht zu nutzen.
