id: hucho_hucho
nombre_cientifico: Hucho hucho
nombre:
  es: Salmón del Danubio
  en: Huchen
  de: Huchen
descripcion:
  es: >-
    Gran salmónido de ríos de la cuenca del Danubio, en Europa central y oriental. GBIF reproduce la categoría
    global IUCN vulnerable (VU), distinta de la indicada en Wikipedia. Cuando sea visible en aguas claras,
    obsérvalo desde la ribera sin entrar en el cauce ni alterar zonas de freza.
  en: >-
    Large salmonid of rivers in the Danube basin, in central and eastern Europe. GBIF records the global IUCN
    category Vulnerable (VU), differing from the one noted on Wikipedia. When visible in clear water, observe
    from the bank without entering the riverbed or disturbing spawning grounds.
  de: >-
    Großer Lachsfisch der Flüsse des Donaueinzugsgebiets in Mittel- und Osteuropa. GBIF gibt die globale
    IUCN-Kategorie gefährdet (VU) an, abweichend von der Angabe in Wikipedia. Wenn er in klarem Wasser
    sichtbar ist, beobachten Sie ihn vom Ufer aus, ohne ins Flussbett zu steigen oder Laichplätze zu stören.
