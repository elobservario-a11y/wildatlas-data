id: anguilla_anguilla
nombre_cientifico: Anguilla anguilla
nombre:
  es: Anguila europea
  en: European eel
  fr: Anguille d'Europe
  de: Europäischer Aal
  it: Anguilla
descripcion:
  es: >-
    Pez migratorio de aguas europeas continentales y costeras, cuyo ciclo reproductor se vincula al mar de los
    Sargazos. La IUCN la clasifica globalmente como en peligro crítico (CR). Cuando sea visible desde la
    ribera, obsérvalo sin capturarlo, ofrecer alimento ni alterar pasos o refugios.
  en: >-
    Migratory fish of European inland and coastal waters, whose breeding cycle is linked to the Sargasso Sea.
    The IUCN classifies it globally as Critically Endangered (CR). When visible from the bank, observe it
    without catching it, offering food or disturbing passages and shelters.
  fr: >-
    Poisson migrateur des eaux continentales et côtières européennes, dont le cycle reproducteur est lié à la
    mer des Sargasses. L'UICN le classe globalement en danger critique (CR). Lorsqu'il est visible depuis la
    rive, observez-le sans le capturer, lui donner de nourriture ni perturber les passages ou refuges.
  de: >-
    Wanderfisch europäischer Binnen- und Küstengewässer, dessen Fortpflanzungszyklus an die Sargassosee
    gebunden ist. Die IUCN stuft ihn weltweit als vom Aussterben bedroht (CR) ein. Wenn er vom Ufer aus
    sichtbar ist, beobachten Sie ihn, ohne ihn zu fangen, zu füttern oder Durchgänge und Verstecke zu stören.
  it: >-
    Pesce migratore delle acque interne e costiere europee, il cui ciclo riproduttivo è legato al Mar dei
    Sargassi. La IUCN lo classifica a livello globale come in pericolo critico (CR). Quando è visibile dalla
    riva, osservalo senza catturarlo, offrire cibo né alterare passaggi o rifugi.
