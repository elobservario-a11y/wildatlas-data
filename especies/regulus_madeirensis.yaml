id: regulus_madeirensis
nombre_cientifico: Regulus madeirensis
nombre:
  es: Reyezuelo de Madeira
  en: Madeira firecrest
  fr: Roitelet de Madère
  de: Madeiragoldhähnchen
  it: Fiorrancino di Madera
  pt: Bis-bis
descripcion:
  es: >-
    Pequeña ave endémica de Madeira que ocupa bosques y matorrales montanos, especialmente brezales
    arborescentes. La IUCN la clasifica globalmente como preocupación menor (LC). Durante recorridos diurnos,
    observa las ramas desde senderos sin reproducir cantos ni acercarte a nidos.
  en: >-
    Small bird endemic to Madeira occupying montane forests and scrub, especially tree-heath habitats. The
    IUCN classifies it globally as Least Concern (LC). During daytime walks, watch branches from trails
    without playing back calls or approaching nests.
  fr: >-
    Petit oiseau endémique de Madère qui occupe forêts et fourrés montagnards, en particulier les landes
    arborescentes. L'UICN le classe globalement en préoccupation mineure (LC). Lors de randonnées diurnes,
    observez les branches depuis les sentiers sans diffuser de chants ni vous approcher des nids.
  de: >-
    Kleiner, auf Madeira endemischer Vogel, der Bergwälder und Gebüsche, besonders Baumheiden, besiedelt. Die
    IUCN stuft ihn weltweit als nicht gefährdet (LC) ein. Beobachten Sie bei Tageswanderungen die Zweige von
    Wegen aus, ohne Gesänge abzuspielen oder sich Nestern zu nähern.
  it: >-
    Piccolo uccello endemico di Madera che occupa boschi e arbusteti montani, in particolare brughiere
    arboree. La IUCN lo classifica a livello globale come a rischio minimo (LC). Durante le escursioni diurne,
    osserva i rami dai sentieri senza riprodurre canti né avvicinarti ai nidi.
  pt: >-
    Pequena ave endémica da Madeira que ocupa florestas e matagais de montanha, especialmente urzais
    arborescentes. A IUCN classifica-o globalmente como pouco preocupante (LC). Durante percursos diurnos,
    observe os ramos a partir dos trilhos sem reproduzir cantos nem se aproximar de ninhos.
