id: gypaetus_barbatus
nombre_cientifico: Gypaetus barbatus
nombre:
  es: Quebrantahuesos
  en: Bearded vulture
  fr: Gypaète barbu
  de: Bartgeier
  it: Gipeto
  pt: Abutre-barbudo
descripcion:
  es: >-
    Buitre especializado en huesos que vive en macizos europeos como Pirineos, Alpes y Cáucaso. La IUCN la
    clasifica globalmente como casi amenazada (NT). Obsérvalo en vuelo diurno desde miradores, sin abandonar
    senderos ni aproximarte a paredes de nidificación.
  en: >-
    Bone-eating vulture living in European mountain ranges such as the Pyrenees, Alps and Caucasus. The IUCN
    classifies it globally as Near Threatened (NT). Watch it in daytime flight from viewpoints, without
    leaving trails or approaching nesting cliffs.
  fr: >-
    Vautour spécialisé dans la consommation d'os vivant dans des massifs européens tels que les Pyrénées, les
    Alpes et le Caucase. L'UICN le classe globalement quasi menacé (NT). Observez-le en vol diurne depuis les
    belvédères, sans quitter les sentiers ni vous approcher des parois de nidification.
  de: >-
    Auf Knochen spezialisierter Geier, der in europäischen Gebirgen wie den Pyrenäen, Alpen und dem Kaukasus
    lebt. Die IUCN stuft ihn weltweit als potenziell gefährdet (NT) ein. Beobachten Sie ihn tagsüber im Flug
    von Aussichtspunkten aus, ohne Wege zu verlassen oder sich Brutwänden zu nähern.
  it: >-
    Avvoltoio specializzato nel consumo di ossa che vive in massicci europei come Pirenei, Alpi e Caucaso. La
    IUCN lo classifica a livello globale come prossimo alla minaccia (NT). Osservalo in volo diurno dai punti
    panoramici, senza abbandonare i sentieri né avvicinarti alle pareti di nidificazione.
  pt: >-
    Abutre especializado em ossos que vive em maciços europeus como os Pirenéus, os Alpes e o Cáucaso. A IUCN
    classifica-o globalmente como quase ameaçado (NT). Observe-o em voo diurno a partir de miradouros, sem
    sair dos trilhos nem se aproximar de paredes de nidificação.
