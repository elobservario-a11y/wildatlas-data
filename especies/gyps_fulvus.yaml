id: gyps_fulvus
nombre_cientifico: Gyps fulvus
nombre:
  es: Buitre leonado
  en: Griffon vulture
  fr: Vautour fauve
  de: Gänsegeier
  it: Grifone
  pt: Abutre-fouveiro
descripcion:
  es: >-
    Gran buitre planeador de montañas y campos abiertos del sur de Europa, asociado a cortados rocosos. La
    IUCN la clasifica globalmente como preocupación menor (LC). Espera a que planee sobre los valles con las
    corrientes térmicas, sin acercarte a colonias ni aportar comida.
  en: >-
    Large soaring vulture of mountains and open country in southern Europe, associated with rocky crags. The
    IUCN classifies it globally as Least Concern (LC). Wait for it to soar over valleys on thermals, without
    approaching colonies or leaving food.
  fr: >-
    Grand vautour planeur des montagnes et campagnes ouvertes du sud de l'Europe, associé aux falaises
    rocheuses. L'UICN le classe globalement en préoccupation mineure (LC). Attendez qu'il plane au-dessus des
    vallées grâce aux courants thermiques, sans vous approcher des colonies ni déposer de nourriture.
  de: >-
    Großer Segelfluggeier der Gebirge und offenen Landschaften Südeuropas, gebunden an Felswände. Die IUCN
    stuft ihn weltweit als nicht gefährdet (LC) ein. Warten Sie, bis er in der Thermik über den Tälern kreist,
    ohne sich Kolonien zu nähern oder Futter auszulegen.
  it: >-
    Grande avvoltoio veleggiatore di montagne e campagne aperte dell'Europa meridionale, associato a pareti
    rocciose. La IUCN lo classifica a livello globale come a rischio minimo (LC). Attendi che plani sulle
    valli sfruttando le correnti termiche, senza avvicinarti alle colonie né fornire cibo.
  pt: >-
    Grande abutre planador de montanhas e campos abertos do sul da Europa, associado a escarpas rochosas. A
    IUCN classifica-o globalmente como pouco preocupante (LC). Aguarde que plane sobre os vales com as
    correntes térmicas, sem se aproximar de colónias nem fornecer alimento.
