id: bombina_bombina
nombre_cientifico: Bombina bombina
nombre:
  es: Sapillo de vientre de fuego
  en: European fire-bellied toad
  fr: Sonneur à ventre de feu
  de: Rotbauchunke
descripcion:
  es: >-
    Pequeño anfibio de charcas, marismas y otros humedales del este de Europa. La IUCN la clasifica
    globalmente como preocupación menor (LC). Durante su actividad fuera de la hibernación, obsérvalo desde la
    orilla sin capturarlo ni entrar en el agua.
  en: >-
    Small amphibian of ponds, marshes and other wetlands in eastern Europe. The IUCN classifies it globally as
    Least Concern (LC). When active outside hibernation, observe it from the bank without catching it or
    entering the water.
  fr: >-
    Petit amphibien des mares, marais et autres zones humides d'Europe de l'Est. L'UICN le classe globalement
    en préoccupation mineure (LC). Lors de son activité hors hibernation, observez-le depuis la berge sans le
    capturer ni entrer dans l'eau.
  de: >-
    Kleiner Lurch von Tümpeln, Sümpfen und anderen Feuchtgebieten Osteuropas. Die IUCN stuft ihn weltweit als
    nicht gefährdet (LC) ein. Beobachten Sie ihn außerhalb der Winterruhe vom Ufer aus, ohne ihn zu fangen
    oder ins Wasser zu steigen.
