id: saiga_tatarica
nombre_cientifico: Saiga tatarica
nombre:
  es: Saiga
  en: Saiga
  fr: Saïga
  de: Saiga
  pt: Saiga
descripcion:
  es: >-
    Antílope de estepas y semidesiertos euroasiáticos, con poblaciones europeas en el entorno del bajo Volga y
    el Caspio. La IUCN la clasifica globalmente como casi amenazada (NT). Obsérvalo cuando las manadas pasten
    en terreno abierto con guías y prismáticos, sin perseguirlas ni cortar sus desplazamientos.
  en: >-
    Antelope of Eurasian steppes and semi-deserts, with European populations around the lower Volga and the
    Caspian. The IUCN classifies it globally as Near Threatened (NT). Watch herds grazing in open terrain with
    guides and binoculars, without chasing them or cutting across their movements.
  fr: >-
    Antilope des steppes et semi-déserts eurasiatiques, avec des populations européennes dans la région de la
    basse Volga et de la Caspienne. L'UICN la classe globalement quasi menacée (NT). Observez les hardes
    pâturer en terrain ouvert avec des guides et des jumelles, sans les poursuivre ni couper leurs
    déplacements.
  de: >-
    Antilope eurasischer Steppen und Halbwüsten mit europäischen Beständen im Raum der unteren Wolga und des
    Kaspischen Meers. Die IUCN stuft sie weltweit als potenziell gefährdet (NT) ein. Beobachten Sie Herden
    beim Äsen in offenem Gelände mit Führern und Fernglas, ohne sie zu verfolgen oder ihre Wanderwege zu
    kreuzen.
  pt: >-
    Antílope de estepes e semidesertos euro-asiáticos, com populações europeias na zona do baixo Volga e do
    Cáspio. A IUCN classifica-a globalmente como quase ameaçada (NT). Observe as manadas quando pastam em
    terreno aberto com guias e binóculos, sem as perseguir nem cortar as suas deslocações.
