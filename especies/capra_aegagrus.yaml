id: capra_aegagrus
nombre_cientifico: Capra aegagrus
nombre:
  es: Cabra salvaje
  en: Wild goat
  fr: Chèvre sauvage
  de: Wildziege
  it: Egagro
  pt: Cabra-selvagem
descripcion:
  es: >-
    Cabra silvestre de roquedos, matorrales y bosques de Turquía y el Cáucaso, en el margen oriental europeo.
    La IUCN la clasifica globalmente como casi amenazada (NT). Obsérvala durante sus desplazamientos por
    laderas con prismáticos, sin perseguirla ni aproximarte a grupos con crías.
  en: >-
    Wild goat of crags, scrubland and forests of Turkey and the Caucasus, on Europe's eastern margin. The IUCN
    classifies it globally as Near Threatened (NT). Watch it moving across slopes with binoculars, without
    chasing it or approaching groups with kids.
  fr: >-
    Chèvre sauvage des rochers, maquis et forêts de Turquie et du Caucase, aux marges orientales de l'Europe.
    L'UICN la classe globalement quasi menacée (NT). Observez-la lors de ses déplacements sur les versants aux
    jumelles, sans la poursuivre ni vous approcher des groupes avec des chevreaux.
  de: >-
    Wildziege von Felswänden, Buschland und Wäldern der Türkei und des Kaukasus am Ostrand Europas. Die IUCN
    stuft sie weltweit als potenziell gefährdet (NT) ein. Beobachten Sie sie mit dem Fernglas bei ihren Zügen
    über Hänge, ohne sie zu verfolgen oder sich Gruppen mit Kitzen zu nähern.
  it: >-
    Capra selvatica di pareti rocciose, macchie e boschi della Turchia e del Caucaso, al margine orientale
    dell'Europa. La IUCN la classifica a livello globale come prossima alla minaccia (NT). Osservala durante
    gli spostamenti lungo i pendii con il binocolo, senza inseguirla né avvicinarti ai gruppi con piccoli.
  pt: >-
    Cabra selvagem de rochedos, matagais e florestas da Turquia e do Cáucaso, na margem oriental europeia. A
    IUCN classifica-a globalmente como quase ameaçada (NT). Observe-a durante as suas deslocações pelas
    encostas com binóculos, sem a perseguir nem se aproximar de grupos com crias.
