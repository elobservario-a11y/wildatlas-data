resumen:
  es: Paredes calizas verticales de más de 1.000 m emergiendo sobre el estruendoso cauce del río Enns.
  en: Vertical limestone precipices towering over 1,000 m above the thundering whitewater of the Enns river.
  fr: >-
    Parois calcaires verticales s’élevant à plus de 1 000 m au-dessus des eaux tumultueuses de la rivière
    Enns.
  de: Senkrechte Kalkfelswände von über 1.000 m Höhe ragen über dem tosenden Wildwasser der Enns auf.
  it: >-
    Pareti calcaree verticali di oltre 1.000 m di dislivello che si innalzano sul corso tumultuoso del fiume
    Enns.
  pt: >-
    Paredes calcárias verticais com mais de 1.000 m de desnível emergindo sobre as correntes estrondosas do
    rio Enns.
unico:
  es: >-
    Ningún lugar de Austria tiene más especies endémicas que el Gesäuse, y muchas viven en sus paredes de
    caliza.
  en: >-
    Nowhere in Austria harbours more endemic species than the Gesäuse, and many cling directly to its sheer
    limestone walls.
  fr: >-
    Nulle part en Autriche ne subsistent autant d’espèces endémiques que dans le Gesäuse, dont beaucoup
    s’accrochent à ses parois de calcaire.
  de: >-
    Nirgendwo in Österreich gibt es mehr endemische Arten als im Gesäuse, und viele klammern sich direkt an
    die steilen Kalkwände.
  it: >-
    Nessun luogo in Austria ospita più specie endemiche del Gesäuse, e molte vivono aggrappate alle sue pareti
    calcaree.
  pt: >-
    Nenhum local na Áustria alberga tantas espécies endémicas como Gesäuse, e muitas vivem agarradas às suas
    escarpas de calcário.
observaciones:
  es: >-
    Está prohibido acampar (salvo en el camping Forstgarten de Gstatterboden), hacer fuego, aparcar fuera de
    los aparcamientos, soltar perros, usar drones y entrar en cuevas. Hay que seguir los caminos marcados: las
    orillas del Enns y del Johnsbach están cerradas, salvo en zonas señalizadas, y en invierno hay zonas de
    reposo. Cuenta con aludes, desprendimientos y niebla, con cambios rápidos de tiempo y con que la mayoría
    de los senderos piden pie seguro. Hay víboras y garrapatas.
texto:
  es:
    intro: >-
      El parque debe su nombre al agua blanca, rápida y espumosa del Enns, que aquí se abre paso entre paredes
      de roca por una de las gargantas más imponentes de los Alpes orientales, y a su alrededor se levanta un
      muro de cumbres calizas que sube desde los 500 hasta los 2.369 m del Hochtor. El Parque Nacional Gesäuse
      ocupa 12.000 hectáreas de Estiria, se fundó en 2002 y tiene una regla sencilla: la naturaleza decide.
    landscape: >-
      Hay cuatro elementos que dibujan el parque: agua, bosque, pasto de montaña y roca. Por eso el logotipo
      del parque lleva tres franjas, azul, verde y gris. La roca es dolomía, y la dolomía se desmorona: deja
      grandes masas de derrubios que el Enns y el Johnsbach arrastran y depositan en bancos de grava, donde
      cría el correlimos común. El Enns, a ratos rugiente y a ratos tranquilo, recibe al imprevisible
      Johnsbach.


      Algo más de la mitad del parque es bosque: bosques de ribera y de arce y fresno en el valle, pinares de
      brezo de invierno que son reliquias de las glaciaciones, y abetales y hayedos con pícea. Arriba crece lo
      más oriental de los pinos cembros y, sobre el límite del bosque, el pino mugo forma un cinturón cerrado.


      Y sobre todo hay roca. En las laderas de esas montañas crece la planta llamada feathered pink, endémica
      de los Alpes calizos septentrionales.
    wildlife: >-
      Entre las rocas viven el [lince](/especie/lynx_lynx/), el [águila real](/especie/aquila_chrysaetos/) y
      el opilión endémico Megabunus lesserti, que vive en las paredes de caliza entre el Lugauer y el
      Buchstein. El lince desapareció de Austria hacia 1900 por persecución directa; en 2011 empezó su
      reintroducción en el vecino parque nacional Kalkalpen, con la liberación de la hembra Freia.


      El águila real es residente todo el año y se ve con frecuencia. Es muy probable encontrar
      [rebecos](/especie/rupicapra_rupicapra/) en las montañas; con las marmotas o los ciervos hace falta más
      suerte. En los bosques de montaña se oye el tamborileo del pico dorsiblanco, que necesita hayedos mixtos
      con árboles viejos y muertos, y en las noches tranquilas de primavera se escucha el canto del mochuelo
      boreal. Con suerte, el treparriscos se deja ver en las paredes y gargantas de torrente. La
      administración del parque ofrece visitas guiadas para ver especies que normalmente no se ven, como el
      [urogallo](/especie/tetrao_urogallus/).
    visit: >-
      El parque se conoce a pie. Caminar aquí significa vistas de cumbres escarpadas y el Enns en el fondo del
      valle, por numerosos senderos señalizados y con recorridos guiados para distintas capacidades. Los
      centros de visitantes están en el Weidendom y en Gstatterboden. El Weidendom, a orillas del Enns junto
      al desvío a Johnsbach, ofrece programas para conocer el lado salvaje del parque, y su recinto se puede
      visitar todo el año. La oficina de información de Admont y el pabellón de Gstatterboden venden el mapa
      del parque impreso. También hay una guía fotográfica con motivos y puntos para fotografiar en cada
      estación.


      Johnsbach merece una parada de noche: allí se registró el cielo nocturno más oscuro medido en una
      localidad de Austria, y la Vía Láctea se ve a simple vista. El Gesäuse se llama desde hace casi cien
      años la «universidad del alpinismo».
    history: >-
      Es un parque de categoría II de la UICN: no se permite explotación forestal ni extracción de gravas, y
      la única excepción son los pastos de montaña, que necesitan su uso tradicional para sobrevivir. La zona
      natural cubre alrededor del 75 % de la superficie y quedará libre de intervención tras las medidas de
      gestión previstas.
    before: >-
      Está prohibido acampar (salvo en el camping Forstgarten de Gstatterboden), hacer fuego, aparcar fuera de
      los aparcamientos, soltar perros, usar drones y entrar en cuevas. Hay que seguir los caminos marcados:
      las orillas del Enns y del Johnsbach están cerradas, salvo en zonas señalizadas, y en invierno hay zonas
      de reposo. Cuenta con aludes, desprendimientos y niebla, con cambios rápidos de tiempo y con que la
      mayoría de los senderos piden pie seguro. Hay víboras y garrapatas.
    around: >-
      El [Grupo del Hochschwab](/lugar/hochschwabgruppe/) queda a unos tres kilómetros. A unos trece
      kilómetros está el [Parque Nacional Kalkalpen - Áreas
      Forestales](/lugar/nationalpark-kalkalpen---waldgebiete/) y a unos dieciséis el [Totes Gebirge -
      Desierto Kárstico](/lugar/totes-gebirge---karst-desert/). A unos veintidós kilómetros queda el [Área
      Salvaje Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/).
  en:
    intro: >-
      The national park owes its name to the rushing, foaming whitewater of the Enns, which cuts a passage
      through sheer rock ramparts in one of the grandest gorges of the Eastern Alps, framed by soaring
      limestone peaks rising from 500 m to the 2,369 m summit of the Hochtor. Gesäuse National Park
      encompasses 12,000 hectares of Upper Styria, was founded in 2002, and adheres to a simple principle:
      nature decides.
    landscape: >-
      Four fundamental elements define the park: water, woodland, alpine pasture, and rock. That is why the
      park emblem features three colour bands: blue, green, and grey. The rock is dolomite, and dolomite
      crumbles easily: it yields enormous volumes of scree that the Enns and Johnsbach torrents carry and
      deposit into extensive gravel banks where common sandpipers nest. Rushing violently one moment and
      idling quietly the next, the Enns absorbs the tempestuous mountain waters of the Johnsbach.


      Slightly more than half of the park is cloaked in forest: riverside willow and alder thickets alongside
      sycamore and ash along the valley floor, relict winter heath pine woods surviving from glacial times,
      and montane fir-beech woods mixed with spruce. Higher up grows the easternmost outpost of Swiss stone
      pine, while dense creeping mountain pine cushions the slopes above the timberline.


      Above all towers bare rock. Across these sheer mountain flanks clings the delicate feathered pink, a
      floral jewel strictly endemic to the Northern Limestone Alps.
    wildlife: >-
      Amid the jagged limestone crags live the [Eurasian lynx](/especie/lynx_lynx/), the [golden
      eagle](/especie/aquila_chrysaetos/), and the endemic harvestman Megabunus lesserti, which lives
      exclusively on limestone cliffs between Lugauer and Buchstein. The lynx disappeared from Austria around
      1900 due to intense hunting persecution; in 2011 its reintroduction began in the adjacent Kalkalpen
      National Park with the release of the female Freia.


      The golden eagle is a permanent resident, frequently seen soaring along the ridges. You are very likely
      to spot [chamois](/especie/rupicapra_rupicapra/) across the craggy heights; encountering marmots or red
      deer requires greater patience. In the montane woodlands you can hear the resonant drumming of the
      white-backed woodpecker, which depends on mixed beech forests rich in standing deadwood, and on still
      spring nights echoes the fluting call of the boreal owl. With luck, the wallcreeper flashes its crimson
      wings against steep torrent ravines. Park rangers offer guided outings to track secretive inhabitants
      such as the [western capercaillie](/especie/tetrao_urogallus/).
    visit: >-
      You experience the national park on foot. Walking here means taking in vistas of jagged limestone spires
      and the swirling Enns deep below, along numerous waymarked footpaths and guided routes tailored to
      various fitness levels. Visitor centres welcome you at the Weidendom and Gstatterboden. The Weidendom,
      situated beside the Enns near the Johnsbach turnoff, offers educational programmes showcasing wilderness
      dynamics, and its grounds remain open year-round. The Admont information office and the Gstatterboden
      pavilion sell printed topographic maps. A specialized photo guide highlights choice scenic viewpoints
      and seasonal lighting.


      Johnsbach warrants an overnight stop: the darkest night skies ever recorded in an Austrian settlement
      were measured here, and the Milky Way arches brightly to the naked eye. For almost a century the Gesäuse
      has been celebrated as the «university of mountaineering».
    history: >-
      It is an IUCN Category II national park: commercial forestry and gravel extraction are strictly
      forbidden, the sole exception being traditional alpine pastures whose historical grazing regime is
      essential for cultural biodiversity. The natural wilderness zone encompasses around 75 % of the park
      area and will remain entirely free from human intervention once scheduled transition measures conclude.
    before: >-
      Camping (except at the official Forstgarten campsite in Gstatterboden), open fires, parking outside
      designated areas, off-leash dogs, drones, and entering caves are prohibited. You must stay on marked
      paths: the banks of the Enns and Johnsbach are closed off outside designated gravel bars, and in winter
      wildlife resting zones are enforced. Be prepared for avalanches, rockfalls, sudden mountain mists, and
      rapid weather shifts, keeping in mind that most alpine tracks demand sure-footedness. European vipers
      and ticks occur.
    around: >-
      The [Hochschwab Group](/lugar/hochschwabgruppe/) lies some three kilometres away. About thirteen
      kilometres distant spreads the [Kalkalpen National Park - Forest
      Areas](/lugar/nationalpark-kalkalpen---waldgebiete/), and some sixteen kilometres away rises the [Totes
      Gebirge Karst Desert](/lugar/totes-gebirge---karst-desert/). Around twenty-two kilometres away rests the
      [Dürrenstein-Lassingtal Wilderness Area](/lugar/wildnisgebiet-durrenstein-lassingtal/).
  fr:
    intro: >-
      Le parc doit son nom aux eaux blanches, rapides et écumantes de l’Enns, qui s’ouvrent un passage entre
      de hautes falaises rocheuses dans l’une des gorges les plus spectaculaires des Alpes orientales,
      dominées par une couronne de cimes calcaires qui s’élèvent depuis 500 m jusqu’aux 2 369 m du Hochtor. Le
      Parc national de Gesäuse englobe 12 000 hectares en Haute-Styrie, a été fondé en 2002 et obéit à un
      précepte simple : la nature décide.
    landscape: >-
      Quatre éléments composent les paysages du parc : l’eau, la forêt, l’alpage et la roche. C’est pourquoi
      l’emblème du parc arbore trois bandes de couleur : bleu, vert et gris. La roche est de la dolomie, et la
      dolomie s’effrite : elle engendre d’immenses masses d’éboulis que l’Enns et le Johnsbach charrient et
      déposent en bancs de graviers où niche le chevalier guignette. Tantôt mugissante et tantôt paisible,
      l’Enns accueille les eaux impétueuses du torrent Johnsbach.


      Un peu plus de la moitié du territoire est boisée : forêts alluviales et frênaies-érablaies dans la
      vallée, pinèdes relictuelles de bruyère d’hiver rescapées des périodes glaciaires, et
      hêtraies-sapinières mêlées d’épicéas. Plus haut s’étend l’avant-poste le plus oriental de pin cembro
      d’Autriche, tandis que le pin couché forme une ceinture dense au-dessus de la limite des arbres.


      Et par-dessus tout s’impose la roche nue. Sur les vires escarpées de ces montagnes fleurit l’œillet des
      rochers (feathered pink), joyau végétal strictement endémique des Alpes calcaires septentrionales.
    wildlife: >-
      Parmi les escarpements rocheux vivent le [lynx boréal](/especie/lynx_lynx/), l’[aigle
      royal](/especie/aquila_chrysaetos/) et un faucheur endémique, Megabunus lesserti, inféodé aux parois de
      calcaire entre le Lugauer et le Buchstein. Le lynx avait disparu d’Autriche vers 1900 sous la pression
      d’une chasse acharnée ; en 2011, sa réintroduction a débuté dans le parc national voisin de Kalkalpen
      avec le lâcher de la femelle Freia.


      L’aigle royal est sédentaire toute l’année et s’observe fréquemment au-dessus des arêtes. Il est très
      facile de rencontrer des [chamois](/especie/rupicapra_rupicapra/) sur les hauteurs ; pour les marmottes
      ou les cerfs, il faut davantage de patience. Dans les bois montagnards résonne le tambourinage du pic à
      dos blanc, inféodé aux hêtraies mixtes sénescentes, et par les nuits calmes de printemps retentit le
      chant de la chouette de Tengmalm. Avec de la chance, le tichodrome échelette se laisse surprendre sur
      les parois de gorges. Les agents du parc proposent des sorties guidées pour pister des espèces très
      discrètes comme le [grand tétras](/especie/tetrao_urogallus/).
    visit: >-
      Le parc se découvre à pied. Randonner ici offre des panoramas saisissants sur les cimes acérées et
      l’Enns au fond de la gorge, le long de nombreux sentiers balisés et d’itinéraires accompagnés pour tous
      les niveaux. Des maisons d’accueil vous reçoivent au Weidendom et à Gstatterboden. Le Weidendom, dressé
      au bord de l’Enns près de l’embranchement vers Johnsbach, dispense des activités pour appréhender la
      dynamique sauvage des lieux, et son enceinte reste ouverte toute l’année. Le bureau d’Admont et le
      pavillon de Gstatterboden diffusent la carte topographique imprimée. Un guide photographique répertorie
      les points de vue et cadrages au fil des saisons.


      Johnsbach mérite une étape nocturne : c’est là qu’a été mesuré le ciel nocturne le plus noir jamais
      enregistré dans une commune d’Autriche, où la Voie lactée se contemple à l’œil nu. Le Gesäuse est salué
      depuis près de cent ans comme « l’université de l’alpinisme ».
    history: >-
      C’est un parc national de catégorie II de l’UICN : l’exploitation forestière et l’extraction de graviers
      y sont rigoureusement interdites, la seule dérogation concernant les alpages traditionnels dont
      l’entretien pastoral est indispensable à la diversité végétale. La zone naturelle de libre évolution
      couvre environ 75 % de la superficie et sera affranchie de toute intervention après l’achèvement des
      mesures de transition prévues.
    before: >-
      Le camping sauvage (hors camping officiel Forstgarten de Gstatterboden), les feux, le stationnement hors
      des parkings, les chiens sans laisse, les drones et l’accès aux grottes sont proscrits. Vous devez
      rester sur les chemins balisés : les berges de l’Enns et du Johnsbach sont interdites d’accès en dehors
      des zones signalées, et des zones de quiétude hivernale protègent la faune. Prenez garde aux avalanches,
      chutes de pierres, brumes soudaines et sautes d’humeur de la météo, la majorité des sentiers exigeant un
      pied très sûr. Vipères péliades et tiques sont présentes.
    around: >-
      Le [Massif du Hochschwab](/lugar/hochschwabgruppe/) se situe à environ trois kilomètres. À environ
      treize kilomètres s’étend le [Parc national de Kalkalpen - Massifs
      forestiers](/lugar/nationalpark-kalkalpen---waldgebiete/) et à environ seize kilomètres s’élèvent le
      [Totes Gebirge - Désert karstique](/lugar/totes-gebirge---karst-desert/). À une distance d’environ
      vingt-deux kilomètres s’ouvre l’[Espace sauvage de
      Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/).
  de:
    intro: >-
      Der Park verdankt seinen Namen dem tosenden, schäumenden Wildwasser der Enns, die sich hier durch eine
      der gewaltigsten Felsschluchten der Ostalpen bricht, umrahmt von steilen Kalksteinbergen, die von 500 m
      bis zum 2.369 m hohen Hochtor aufsteigen. Der Nationalpark Gesäuse umfasst 12.000 Hektar in der
      Obersteiermark, wurde 2002 gegründet und folgt einem einfachen Grundsatz: Die Natur bestimmt.
    landscape: >-
      Vier Elemente prägen den Nationalpark: Wasser, Wald, Alm und Fels. Daher zeigt das Parklogo drei
      Farbstreifen: Blau, Grün und Grau. Das Gestein ist Dolomit, und Dolomit verwittert brüchig: Riesige
      Schuttmassen werden von Enns und Johnsbach talwärts transportiert und zu ausgedehnten Schotterbänken
      umgelagert, auf denen der Flussuferläufer brütet. Mal tosend wild, mal still dahinfließend, nimmt die
      Enns den unberechenbaren Gebirgsbach Johnsbach auf.


      Etwas mehr als die Hälfte des Parks ist bewaldet: Weichholz- und Ahorn-Eschenwälder im Tal, eiszeitliche
      Schneeheide-Kiefernwälder als Relikte vergangener Kaltzeiten sowie Tannen-Buchen-Wälder mit
      Fichtenbeimischung. Weiter oben gedeiht der östlichste Zirbenbestand Österreichs, und über der
      Waldgrenze bildet die Bergkiefer (Latsche) einen dichten Krummholzgürtel.


      Und darüber herrscht der nackte Fels: An den steilen Wandabstürzen blüht die Hainburger Feder-Nelke
      (feathered pink), ein zarter Endemit der Nördlichen Kalkalpen.
    wildlife: >-
      In den schroffen Felsen leben der [Eurasische Luchs](/especie/lynx_lynx/), der
      [Steinadler](/especie/aquila_chrysaetos/) und der endemische Weberknecht Megabunus lesserti, der
      ausschließlich an Felswänden zwischen Lugauer und Buchstein heimisch ist. Der Luchs verschwand in
      Österreich um 1900 durch direkte Ausrottung; 2011 begann im benachbarten Nationalpark Kalkalpen mit der
      Freilassung des Weibchens Freia seine Wiederansiedlung.


      Der Steinadler ist ganzjährig anzutreffen und kreist regelmäßig über den Graten.
      [Gämsen](/especie/rupicapra_rupicapra/) lassen sich in den Hochlagen sehr zuverlässig beobachten; bei
      Murmeltieren oder Rotwild braucht man etwas mehr Geduld. In den Bergmischwäldern trommelt der
      Weißrückenspecht, der an totholzreiche Altwälder gebunden ist, und in stillen Frühlingsnächten ruft der
      Raufußkauz. Mit etwas Glück zeigt sich der Mauerläufer an Schluchtwänden. Die Nationalparkverwaltung
      veranstaltet geführte Exkursionen, um verborgene Arten wie das [Auerhuhn](/especie/tetrao_urogallus/)
      aufzuspüren.
    visit: >-
      Den Nationalpark erschließt man sich zu Fuß. Wandern bedeutet hier atemberaubende Tiefblicke auf die
      schäumende Enns und steile Felsabstürze auf zahlreichen markierten Steigen und geführten Routen
      unterschiedlicher Schwierigkeitsgrade. Besucherzentren erwarten dich im Weidendom und in Gstatterboden.
      Der Weidendom an der Enns nahe der Johnsbach-Einmündung vermittelt Wildnisökologie und ist ganzjährig
      zugänglich. Das Infobüro Admont und der Pavillon Gstatterboden halten die gedruckte Wanderkarte bereit.
      Ein Fotoguide stellt lohnende Motive und Fotopunkte für jede Jahreszeit vor.


      Johnsbach lohnt eine nächtliche Einkehr: Hier wurde der dunkelste Nachthimmel einer österreichischen
      Ortschaft gemessen, an dem sich die Milchstraße mit bloßem Auge abzeichnet. Das Gesäuse gilt seit
      beinahe hundert Jahren als «Universität des Bergsteigens».
    history: >-
      Das Gebiet ist ein Nationalpark der IUCN-Kategorie II: Forstwirtschaft und Schotterabbau sind verboten;
      einzige Ausnahme bleiben die traditionellen Almweiden, deren Bewirtschaftung für den Erhalt seltener
      Pflanzenarten nötig ist. Die Naturzone umfasst rund 75 % der Fläche und bleibt nach Abschluss der
      vorgesehenen Managementmaßnahmen gänzlich eingriffsfrei.
    before: >-
      Zelten (außer auf dem Campingplatz Forstgarten in Gstatterboden), offenes Feuer, Parken außerhalb von
      Parkplätzen, freilaufende Hunde, Drohnen und das Betreten von Höhlen sind verboten. Du musst auf den
      markierten Wegen bleiben: Die Uferzonen von Enns und Johnsbach sind abseits ausgewiesener Bereiche
      gesperrt, und im Winter gelten Wildruhezonen. Rechne mit Lawinen, Steinschlag, Nebel und raschen
      Wetterstürzen; die meisten Steige verlangen alpine Trittsicherheit. Kreuzottern und Zecken kommen vor.
    around: >-
      Die [Hochschwabgruppe](/lugar/hochschwabgruppe/) liegt etwa drei Kilometer entfernt. Rund dreizehn
      Kilometer entfernt breitet sich der [Nationalpark Kalkalpen -
      Waldgebiete](/lugar/nationalpark-kalkalpen---waldgebiete/) aus und etwa sechzehn Kilometer entfernt ragt
      das [Tote Gebirge - Karstwüste](/lugar/totes-gebirge---karst-desert/) auf. Rund zweiundzwanzig Kilometer
      entfernt liegt das [Wildnisgebiet Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/).
  it:
    intro: >-
      Il parco deve il suo nome alle acque vorticose, impetuose e schiumose dell’Enns, che si aprono un varco
      tra muraglie di roccia in una delle gole più grandiose delle Alpi orientali, circondata da una corona di
      picchi calcarei che salgono dai 500 fino ai 2.369 m del monte Hochtor. Il Parco Nazionale Gesäuse
      racchiude 12.000 ettari nell’Alta Stiria, è stato fondato nel 2002 e risponde a una semplice regola: la
      natura decide.
    landscape: >-
      Quattro elementi plasmano il paesaggio del parco: acqua, bosco, pascolo alpino e roccia. Per questo il
      logo ufficiale presenta tre fasce cromatiche: blu, verde e grigia. La roccia predominante è la dolomia,
      e la dolomia si sgretola: rilascia imponenti depositi detritici che l’Enns e il Johnsbach trascinano a
      valle accumulandoli in ampie ghiaiate dove nidifica il piro piro piccolo. L’Enns, a tratti fragoroso e a
      tratti placido, riceve le impetuose acque del torrente Johnsbach.


      Poco più della metà del parco è ricoperta da foreste: boschi ripariali e formazioni ad acero e frassino
      a fondovalle, pinete relitte a erica invernale superstiti delle glaciazioni, e faggete-abetaie miste a
      peccio. Più in alto prospera l’avamposto più orientale di pino cembro d’Austria, mentre oltre il limite
      degli alberi il pino mugo forma una fitta fascia arbustiva.


      E su tutto torreggia la roccia nuda: lungo i ripidi salti di queste montagne fiorisce il garofano
      piumoso (feathered pink), delicato gioiello botanico endemico delle Alpi Calcaree Settentrionali.
    wildlife: >-
      Tra le rupi impervie dimorano la [lince eurasiatica](/especie/lynx_lynx/), l’[aquila
      reale](/especie/aquila_chrysaetos/) e l’opilionide endemico Megabunus lesserti, che vive esclusivamente
      sulle pareti calcaree tra il Lugauer e il Buchstein. La lince era scomparsa dall’Austria intorno al 1900
      a causa della persecuzione venatoria; nel 2011 è iniziata la sua reintroduzione nel vicino parco
      nazionale Kalkalpen con il rilascio dell’esemplare femmina Freia.


      L’aquila reale è stanziale tutto l’anno e si osserva con regolarità volteggiare sulle creste. È
      facilissimo imbattersi nei [camosci](/especie/rupicapra_rupicapra/) sulle quote alte; per marmotte o
      cervi serve invece maggiore fortuna. Nei boschi montani echeggia il tambureggiare del picchio
      dorsobianco, legato a faggete miste mature e ricche di necromassa, e nelle notti primaverili si ascolta
      il canto della civetta capogrosso. Con un pizzico di fortuna, il picchio muraiolo si scorge lungo le
      pareti delle forre. I guardaparco offrono escursioni guidate per individuare specie elusive come il
      [gallo cedrone](/especie/tetrao_urogallus/).
    visit: >-
      Il parco si esplora a piedi. Camminare qui regala viste a strapiombo sulle cime frastagliate e sull’Enns
      sul fondovalle, lungo numerosi sentieri tracciati e itinerari guidati adatti a diverse preparazioni
      fisiche. I centri visite accolgono il pubblico al Weidendom e a Gstatterboden. Il Weidendom, situato
      sulle rive dell’Enns presso il bivio per Johnsbach, propone attività per comprendere i processi naturali
      della riserva ed è accessibile tutto l’anno. L’ufficio di Admont e il padiglione di Gstatterboden
      distribuiscono la mappa escursionistica stampata. Una guida fotografica illustra gli scorci più
      suggestivi in ogni stagione.


      Johnsbach merita una sosta serale: vi è stato registrato il cielo notturno più buio mai misurato in una
      località dell’Austria, dove la Via Lattea si ammira nitidamente a occhio nudo. Da quasi cento anni il
      Gesäuse è soprannominato l’«università dell’alpinismo».
    history: >-
      È un parco nazionale di categoria II della IUCN: sono vietate sia l’attività forestale che l’estrazione
      di ghiaia, e la sola eccezione riguarda i pascoli d’alpeggio tradizionali, indispensabili per tutelare
      la ricchezza floristica. L’area di protezione naturale copre circa il 75 % della superficie e rimarrà
      totalmente esente da interventi al termine delle misure gestionali di transizione.
    before: >-
      È vietato campeggiare (salvo nel campeggio ufficiale Forstgarten di Gstatterboden), accendere fuochi,
      sostare fuori dai parcheggi, liberare cani, pilotare droni ed entrare nelle cavità naturali. Devi
      attenerti ai sentieri segnati: le sponde dell’Enns e del Johnsbach sono interdette all’infuori dei punti
      autorizzati e in inverno sono attive zone di quiete faunistica. Metti in conto valanghe, scariche di
      sassi, nebbie e repentini cambi meteo; la maggior parte dei sentieri esige passo fermo da montagna. Sono
      presenti vipere e zecche.
    around: >-
      Il [Gruppo dell’Hochschwab](/lugar/hochschwabgruppe/) dista circa tre chilometri. A circa tredici
      chilometri si estende il [Parco Nazionale Kalkalpen - Aree
      Forestali](/lugar/nationalpark-kalkalpen---waldgebiete/) e a circa sedici chilometri si staglia il
      [Totes Gebirge - Deserto Carsico](/lugar/totes-gebirge---karst-desert/). A circa ventidue chilometri
      sorge l’[Area Selvaggia di Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/).
  pt:
    intro: >-
      O parque deve a sua denominação às águas brancas, impetuosas e espumosas do rio Enns, que aqui abrem
      caminho entre paredões rochosos por um dos desfiladeiros mais imponentes dos Alpes Orientais, rodeado
      por uma muralha de cumes calcários que se elevam desde os 500 m até aos 2.369 m do monte Hochtor. O
      Parque Nacional de Gesäuse ocupa 12.000 hectares na Alta Estíria, foi estabelecido em 2002 e assenta num
      lema direto: a natureza decide.
    landscape: >-
      Quatro elementos desenham a paisagem do parque: água, floresta, pastagem alpina e rocha. É por essa
      razão que o logótipo oficial exibe três faixas cromáticas: azul, verde e cinzenta. A litologia dominante
      é o dolomito, e o dolomito desagrega-se com facilidade: gera grandes massas de cascalheira que o Enns e
      o Johnsbach arrastam e depositam em bancos de cascalho onde nidifica o maçarico-das-rochas. Alternando
      momentos ruidosos com trechos serenos, o Enns acolhe o caudal impetuoso da torrente de Johnsbach.


      Pouco mais de metade da superfície é arborizada: galerias ripícolas e freixedos com áceres nos vales,
      pinhais relíquia de urze-de-inverno sobreviventes dos períodos glaciares, e bosques mistos de faia e
      abeto com espruces. Mais acima prospera o núcleo mais oriental de pinheiro-suíço da Áustria, ao passo
      que sobre o limite da vegetação arbórea o pinheiro-das-rochas forma uma cintura densa de mato rasteiro.


      E sobre tudo reina a rocha nua: nas escarpas abruptas destas montanhas desabrocha o cravo-franjado
      (feathered pink), espécie vegetal estritamente endémica dos Alpes Calcários Setentrionais.
    wildlife: >-
      Entre os alcantis rochosos habitam o [lince-euroasiático](/especie/lynx_lynx/), a
      [águia-real](/especie/aquila_chrysaetos/) e o opilião endémico Megabunus lesserti, que vive em exclusivo
      nas paredes calcárias entre o Lugauer e o Buchstein. O lince desapareceu da Áustria por volta de 1900
      devido à perseguição cinegética implacável; em 2011 arrancou o seu programa de reintrodução no contíguo
      parque nacional Kalkalpen com a libertação da fêmea Freia.


      A águia-real é residente permanente e pode ser avistada com frequência sobre as cristas. É muito comum
      observar [camurças](/especie/rupicapra_rupicapra/) nas faldas alpinas; para marmotas ou veados é
      necessária maior sorte. Nas matas montanhosas escuta-se o tamborilar do pica-pau-de-dorso-branco,
      associado a faiais maduros com madeira morta, e nas noites calmas de primavera ouve-se o canto do
      mocho-de-tengmalm. Com persistência, a trepadeira-dos-muros deixa-se entrever nas gargantas
      alcantiladas. A administração do parque promove saídas de campo orientadas para detetar espécies
      esquivas como o [tetraz-grande](/especie/tetrao_urogallus/).
    visit: >-
      O parque explora-se a pé. Caminhar nesta região proporciona perspetivas grandiosas sobre cristas
      escarpadas e o Enns no fundo do vale, através de numerosos percursos pedestres assinalados e rotas com
      guia para diferentes graus de preparação física. Os centros de acolhimento situam-se em Weidendom e
      Gstatterboden. O Weidendom, junto ao Enns perto do desvio para Johnsbach, faculta programas pedagógicos
      sobre a dinâmica selvagem, encontrando-se o recinto aberto o ano inteiro. O posto de Admont e o pavilhão
      de Gstatterboden disponibilizam o mapa topográfico em papel. Um guia fotográfico destaca os melhores
      pontos cénicos ao longo das quatro estações.


      Johnsbach justifica uma paragem noturna: foi aí registado o céu noturno mais escuro de qualquer
      localidade da Áustria, contemplando-se a Via Láctea a olho nu. Há quase cem anos que o Gesäuse é
      consagrado como a «universidade do alpinismo».
    history: >-
      Possui o estatuto de parque nacional de categoria II da UICN: a exploração florestal e a extração de
      inertes encontram-se rigorosamente interditas, sendo a única exceção a manutenção dos prados
      tradicionais de montanha, indispensáveis para a conservação botânica. A zona natural de reserva integral
      abrange cerca de 75 % da superfície territorial e permanecerá sem qualquer intervenção humana assim que
      concluído o plano de transição.
    before: >-
      É proibido acampar (salvo no parque de campismo florestal Forstgarten em Gstatterboden), acender
      fogueiras, estacionar fora dos parques oficiais, soltar cães, utilizar drones ou explorar grutas. Deves
      caminhar estritamente pelos trilhos oficiais: as margens do Enns e do Johnsbach estão encerradas fora
      dos locais devidamente sinalizados, e no inverno vigoram zonas de descanso para a fauna. Tem em conta o
      risco de avalanches, desmoronamento de pedras, nevoeiros e mudanças bruscas de tempo, pois a maioria dos
      caminhos exige passo firme. Ocorrem víboras e carraças.
    around: >-
      O [Grupo de Hochschwab](/lugar/hochschwabgruppe/) dista cerca de três quilómetros. A cerca de treze
      quilómetros estende-se o [Parque Nacional Kalkalpen - Áreas
      Florestais](/lugar/nationalpark-kalkalpen---waldgebiete/) e a cerca de dezasseis quilómetros ergue-se o
      [Totes Gebirge - Deserto Cársico](/lugar/totes-gebirge---karst-desert/). A cerca de vinte e dois
      quilómetros encontra-se a [Área Selvagem de
      Dürrenstein-Lassingtal](/lugar/wildnisgebiet-durrenstein-lassingtal/).
