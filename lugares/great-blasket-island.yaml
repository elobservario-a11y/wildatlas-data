resumen:
  es: >-
    La mayor de las islas del archipiélago de las Blasket (evacuada en 1953), famosa por su rica literatura
    gaélica, acantilados salvajes y playas con cientos de focas grises.
  en: >-
    The largest of the Blasket archipelago islands (evacuated in 1953), famed for rich Gaelic literature, wild
    sea cliffs, and beaches with hundreds of grey seals.
  fr: >-
    La plus grande île de l'archipel des Blasket (évacuée en 1953), célèbre pour sa littérature gaélique, ses
    falaises sauvages et ses centaines de phoques gris.
  de: >-
    Die größte Insel des Blasket-Archipels (1953 evakuiert), berühmt für gälische Literatur, wilde Klippen und
    Strände mit Hunderten von Kegelrobben.
  it: >-
    La maggiore delle isole Blasket (evacuata nel 1953), celebre per la letteratura gaelica, le scogliere
    selvagge e le spiagge con centinaia di foche grigie.
  pt: >-
    A maior das ilhas do arquipélago das Blasket (evacuada em 1953), célebre pela sua literatura gaélica,
    falésias agrestes e praias com centenas de focas-cinzentas.
unico:
  es: >-
    Una isla vacía desde 1953 que dio al mundo escritores de lengua irlandesa y hoy es zona silvestre
    protegida, con focas grises y marsopas en sus aguas.
  en: >-
    An uninhabited island since 1953 that gave the world extraordinary Irish-language writers and now thrives
    as a protected wilderness with grey seals and porpoises.
  fr: >-
    Une île inhabitée depuis 1953 qui a offert au monde d'illustres écrivains gaéliques et forme aujourd'hui
    une réserve sauvage côtoyée par les phoques gris et les marsouins.
  de: >-
    Eine seit 1953 unbewohnte Insel, die der Welt bedeutende irischsprachige Schriftsteller schenkte und heute
    als Wildnisgebiet mit Kegelrobben und Schweinswalen geschützt ist.
  it: >-
    Un'isola disabitata dal 1953 che ha donato al mondo insigni scrittori in lingua irlandese ed è oggi
    un'oasi protetta con foche grigie e focene.
  pt: >-
    Uma ilha despovoada desde 1953 que legou ao mundo insignes escritores de língua irlandesa e subsiste como
    reserva bravia com focas-cinzentas e botos.
observaciones:
  es: >-
    Los ferris dependen mucho del tiempo: comprueba la salida antes de ir. La temporada va de mayo a
    septiembre.
texto:
  es:
    intro: >-
      En abril de 1947 el mal tiempo dejó a la isla incomunicada con tierra firme durante semanas. Así se
      vivía en Great Blasket, en el extremo de la península de Dingle: el asentamiento más occidental de
      Irlanda, una comunidad de habla irlandesa a la que el mar podía dejar sin salida. La isla se vació en
      1953. Hoy quedan el pueblo abandonado y, detrás, una isla que es en su mayor parte zona silvestre. An
      Blascaod Mór es la mayor de las islas Blasket y tiene, en sus playas, focas grises.
    landscape: >-
      La isla se extiende seis kilómetros hacia el suroeste y sube a 346 m en An Cró Mór. Los restos del
      pueblo están en la costa nordeste, la más resguardada, donde se levantaban las casas sencillas. Detrás
      del pueblo abandonado, la mayor parte de la isla es zona silvestre, y no hay servicios públicos.


      El espacio forma parte del Área Especial de Conservación de las islas Blasket, que protege arrecifes,
      acantilados marinos con vegetación, brezales secos europeos y cuevas marinas sumergidas o parcialmente
      sumergidas.
    wildlife: >-
      Lo que viene a ver la mayoría desde el mar son las focas grises. Las Blasket son un lugar de cría
      importante de la [foca gris](/especie/halichoerus_grypus/) en Irlanda, y la foca gris figura entre los
      intereses de conservación del Área Especial de Conservación, igual que la [marsopa
      común](/especie/phocoena_phocoena/). Las islas tienen además al menos 13 especies de aves marinas
      nidificantes.


      Como los ferris solo cruzan en verano y con buen tiempo, esa es la época en que puedes ver la isla.
    visit: >-
      Se llega solo en ferri, desde Dunquin o Dingle, y no hay embarcadero: el último tramo se hace en lancha
      neumática. Los ferris funcionan en los meses de verano y con buen tiempo, y el trayecto dura entre
      veinte minutos y una hora según el puerto de salida. La visita media a la isla es de una hora y media.


      Hay recorridos guiados a pie por la isla, y la Oficina de Obras Públicas ofrece una visita guiada
      gratuita por el pueblo antiguo. La isla no es accesible en silla de ruedas y solo se recomienda a
      personas sin limitaciones físicas.


      Aparte de la isla, está el Blasket Centre, en el extremo de la península de Dingle, a 16 km de Dingle
      por la R559, con museo, archivo, talleres y aulas de idioma.
    history: >-
      La Great Blasket estuvo habitada con intermitencias durante siglos. En la década de 1840 vivían unas 150
      personas, la mayoría en casas sencillas de la costa nordeste. Por falta de madera, quemaban brezo, turba
      y tepe. En 1953 el gobierno irlandés decidió que ya no podía garantizar la seguridad de una población
      cada vez más reducida.


      De aquella gente salieron escritores que dejaron constancia de su vida y conservaron los cuentos
      populares irlandeses: An tOileánach, de Tomás Ó Criomhthain (1929), Fiche Bliain ag Fás, de Muiris Ó
      Súilleabháin (1933), y Machnamh Seanamhná, de Peig Sayers (1939).


      En 2009 la Oficina de Obras Públicas compró la mayor parte de las propiedades de la isla, incluido el
      pueblo abandonado, y desde 2010 hay visitas guiadas.
    before: >-
      Los ferris dependen mucho del tiempo: comprueba la salida antes de ir. La temporada va de mayo a
      septiembre.
    around: >-
      Great Blasket no tiene vecinos cercanos en el atlas; comparten especies con ella [Nationalpark
      Schleswig-Holsteinisches Wattenmeer](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (marsopa
      común y foca gris), [Lundy](/lugar/lundy/), [Lunga y las islas Treshnish](/lugar/lunga-treshnish-isles/)
      y [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (frailecillo y foca gris).
  en:
    intro: >-
      In April 1947, ferocious Atlantic storms severed the island's contact with the mainland for weeks. Such
      was daily life on Great Blasket, out on the western extremity of the Dingle Peninsula: Ireland's
      westernmost settlement, a native Irish-speaking community that the sea could isolate at will. The island
      was finally evacuated in 1953. Today its abandoned stone village endures against the Atlantic,
      backdropped by wild, untamed moorland. An Blascaod Mór is the largest of the Blasket Islands, celebrated
      for the grey seals hauling out across its white beaches.
    landscape: >-
      The island stretches six kilometres southwestward, rising to 346 m at the summit of An Cró Mór. The
      ruins of the village cluster along the sheltered northeastern flank, where simple stone cottages were
      built. Behind this deserted settlement, the island unfolds as raw wilderness, completely devoid of
      public services or paved roads.


      The entire territory forms part of the Blasket Islands Special Area of Conservation, protecting reefs,
      vegetated sea cliffs, European dry heaths, and submerged or partially submerged sea caves.
    wildlife: >-
      What draws most visitors arriving by sea are the seals. The Blaskets represent a premier breeding
      station for the [grey seal](/especie/halichoerus_grypus/) in Ireland, and the species is a designated
      primary qualifying interest of the Special Area of Conservation, alongside the [harbour
      porpoise](/especie/phocoena_phocoena/). The archipelago additionally sustains at least 13 breeding
      seabird species.


      Because passenger ferries only operate during summer months under favourable sea conditions, this is the
      sole window in which you can experience the island.
    visit: >-
      Arrival is exclusively by passenger ferry from Dunquin or Dingle, with no permanent pier: the final
      landing is completed by small inflatable tender. Ferries run through summer months in calm weather, with
      crossings taking twenty minutes to an hour depending on the departure harbour. A typical island visit
      lasts about an hour and a half.


      Walking tracks criss-cross the island, and the Office of Public Works (OPW) offers complimentary guided
      tours through the historic village. The island is not wheelchair-accessible and is recommended strictly
      for mobile visitors capable of rough-ground walking.


      On the mainland, the companion Blasket Centre sits on the tip of the Dingle Peninsula, 16 km from Dingle
      along the R559, featuring a museum, archives, workshops, and Gaelic language facilities.
    history: >-
      Great Blasket was intermittently inhabited for centuries. During the 1840s roughly 150 people lived
      here, mostly in modest drystone cottages on the northeastern slopes. Lacking firewood, they burned
      heather, peat, and turf scraws. By 1953 the Irish government decided it could no longer guarantee the
      safety and medical welfare of a dwindling population.


      From that isolated island society arose legendary authors who recorded their traditional lives and folk
      heritage: Tomás Ó Criomhthain's An tOileánach (1929), Muiris Ó Súilleabháin's Fiche Bliain ag Fás
      (1933), and Peig Sayers's Machnamh Seanamhná (1939).


      In 2009 the Office of Public Works acquired most island properties, including the ruined village, and
      has operated guided heritage tours since 2010.
    before: >-
      Ferry sailings are strictly weather-dependent: always reconfirm departures before travelling. The
      visitor season operates from May to September.
    around: >-
      Great Blasket has no immediate neighbouring sites in the atlas; it shares coastal wildlife with
      [Schleswig-Holstein Wadden Sea National Park](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/)
      (harbour porpoise and grey seal), [Lundy](/lugar/lundy/), [Lunga and the Treshnish
      Isles](/lugar/lunga-treshnish-isles/), and [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/)
      (Atlantic puffin and grey seal).
  fr:
    intro: >-
      En avril 1947, les tempêtes hivernales isolèrent l'île du continent durant des semaines. Telle était la
      vie sur Great Blasket, à l'extrémité de la péninsule de Dingle : l'avant-poste habité le plus occidental
      d'Irlande, communauté gaélophone que l'océan pouvait couper du monde. L'île fut définitivement évacuée
      en 1953. Subsistent aujourd'hui les ruines du village abandonné et une île rendue à l'état sauvage. An
      Blascaod Mór est la plus vaste des îles Blasket, bordée de plages où se reposent les phoques gris.
    landscape: >-
      L'île s'étire sur six kilomètres vers le sud-ouest et culmine à 346 m à An Cró Mór. Les vestiges des
      habitations occupent la côte nord-est, la plus abritée, où s'alignaient de modestes chaumières de pierre
      sèche. Au-delà du village désert, l'île constitue un sanctuaire sauvage vierge de tout service public.


      Le territoire s'inscrit dans la Zone Spéciale de Conservation des îles Blasket, protégeant récifs
      marins, falaises végétalisées, landes sèches européennes et grottes marines submergées ou
      semi-submergées.
    wildlife: >-
      Le spectacle qui attire la majorité des visiteurs venus par mer est celui des phoques gris. L'archipel
      des Blasket constitue un site de reproduction majeur pour le [phoque gris](/especie/halichoerus_grypus/)
      en Irlande, inscrit comme priorité de conservation de la Zone Spéciale de Conservation aux côtés du
      [marsouin commun](/especie/phocoena_phocoena/). Les îles hébergent en outre au moins 13 espèces
      d'oiseaux marins nicheurs.


      Les navettes maritimes ne naviguant qu'en période estivale par temps clément, c'est la seule saison où
      vous pouvez explorer l'île.
    visit: >-
      On y accède uniquement par bateau au départ de Dunquin ou Dingle, en l'absence de débarcadère en dur :
      le débarquement final s'effectue en zodiac. Les liaisons fonctionnent l'été par mer calme, la traversée
      durant de vingt minutes à une heure selon le port d'embarquement. La visite classique dure environ une
      heure et demie.


      Des sentiers parcourent l'île et l'Office of Public Works assure une visite guidée gratuite du village
      ancien. L'île n'est pas accessible en fauteuil roulant et s'adresse aux marcheurs mobiles.


      Sur le continent, le Centre des Blasket se dresse au bout de la péninsule de Dingle, à 16 km de Dingle
      par la route R559, réunissant musée, archives, ateliers et cours de langue irlandaise.
    history: >-
      Great Blasket fut habitée de façon intermittente durant des siècles. Dans les années 1840 vivaient
      environ 150 personnes, réparties dans des maisons de pierre sur les versants nord-est. Privés de bois,
      les insulaires brûlaient bruyères et mottes de tourbe. En 1953, le gouvernement irlandais décida qu'il
      ne pouvait plus garantir la sécurité et la santé d'une communauté réduite à quelques aînés.


      De cette modeste population émergèrent des auteurs majeurs de la langue irlandaise : An tOileánach de
      Tomás Ó Criomhthain (1929), Fiche Bliain ag Fás de Muiris Ó Súilleabháin (1933) et Machnamh Seanamhná de
      Peig Sayers (1939).


      En 2009, l'Office of Public Works racheta la quasi-totalité des parcelles insulaires dont le village,
      organisant des visites patrimoniales depuis 2010.
    before: >-
      Les traversées maritimes sont très dépendantes des conditions météo : confirmez les départs avant de
      prendre la route. La saison d'ouverture court de mai à septembre.
    around: >-
      Great Blasket ne possède pas de site voisin immédiat dans l'atlas ; elle partage des espèces marines
      avec le [Parc national de la mer des Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (marsouin et phoque gris),
      l'île de [Lundy](/lugar/lundy/), [Lunga et les îles Treshnish](/lugar/lunga-treshnish-isles/) et les
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (macareux et phoque gris).
  de:
    intro: >-
      Im April 1947 schnitten schwere Stürme die Insel über Wochen vom Festland ab. So sah der Alltag auf
      Great Blasket an der Spitze der Dingle-Halbinsel aus: die westlichste Siedlung Irlands, eine
      gälischsprachige Gemeinschaft, die dem Meer ausgeliefert war. Die Insel wurde 1953 endgültig evakuiert.
      Heute stehen dort die Ruinen des verlassenen Dorfes vor einer weitgehend wilden Inselnatur. An Blascaod
      Mór ist die größte der Blasket-Inseln und berühmt für die Kegelrobben an ihren Sandstränden.
    landscape: >-
      Die Insel erstreckt sich über sechs Kilometer nach Südwesten und steigt am Gipfel des An Cró Mór auf 346
      m an. Die Reste des Dorfes schmiegen sich an die geschützte Nordostküste, wo einst einfache Steinhäuser
      standen. Hinter der verfallenen Siedlung breitet sich ursprüngliche Wildnis ohne öffentliche
      Infrastruktur aus.


      Das gesamte Inselareal gehört zum FFH-Gebiet Blasket Islands, das Riffe, bewachsene Steilklippen,
      trockene Heideflächen und Meereshöhlen schützt.
    wildlife: >-
      Die größte Attraktion für Besucher auf dem Seeweg sind die Kegelrobben. Die Blaskets stellen ein
      wichtiges Fortpflanzungsgebiet der [Kegelrobbe](/especie/halichoerus_grypus/) in Irland dar, und sie
      gehört ebenso wie der [Schweinswal](/especie/phocoena_phocoena/) zu den Schutzgütern des FFH-Gebiets.
      Das Archipel beherbergt zudem mindestens 13 brütende Seevogelarten.


      Da Fährboote nur in den Sommermonaten und bei ruhiger See verkehren, ist dies das einzige Zeitfenster
      für einen Inselbesuch.
    visit: >-
      Die Anreise erfolgt ausschließlich per Fährboot von Dunquin oder Dingle ohne festen Anleger: Das letzte
      Stück wird im Schlauchboot zurückgelegt. Die Boote fahren im Sommer bei gutem Wetter; die Überfahrt
      dauert je nach Fährhafen zwischen zwanzig Minuten und einer Stunde. Ein durchschnittlicher
      Inselaufenthalt umfasst etwa anderthalb Stunden.


      Über die Insel führen unbefestigte Pfade, und das Office of Public Works bietet kostenlose Führungen
      durch das verlassene Dorf an. Die Insel ist nicht rollstuhlgerecht und nur für trittsichere Besucher zu
      empfehlen.


      Auf dem Festland informiert das Blasket Centre an der Spitze der Dingle-Halbinsel, 16 km von Dingle an
      der R559 gelegen, mit Museum, Archiv und Sprachkursräumen.
    history: >-
      Great Blasket war über Jahrhunderte hinweg mit Unterbrechungen besiedelt. In den 1840er Jahren lebten
      dort rund 150 Menschen in einfachen Steinhütten an der Nordostseite. Mangels Holz verfeuerten sie
      Heidekraut und Torfschollen. Im Jahr 1953 entschied die irische Regierung, dass sie die Versorgung der
      schrumpfenden Bevölkerung nicht länger gewährleisten könne.


      Aus jener Gemeinschaft gingen Schriftsteller hervor, die das traditionelle Inselleben festhielten: Tomás
      Ó Criomhthains An tOileánach (1929), Muiris Ó Súilleabháins Fiche Bliain ag Fás (1933) und Peig Sayers'
      Machnamh Seanamhná (1939).


      Im Jahr 2009 erwarb das Office of Public Works die meisten Grundstücke auf der Insel einschließlich des
      Geisterdorfs, und seit 2010 finden dort historische Führungen statt.
    before: >-
      Fährüberfahrten sind wetterabhängig: Erkundige dich vor der Anfahrt über aktuelle Abfahrten. Die Saison
      reicht von Mai bis September.
    around: >-
      Great Blasket hat keine direkten Nachbarn im Atlas; Tierarten teilen der [Nationalpark
      Schleswig-Holsteinisches Wattenmeer](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/)
      (Schweinswal und Kegelrobbe), die Insel [Lundy](/lugar/lundy/), [Lunga und die
      Treshnish-Inseln](/lugar/lunga-treshnish-isles/) sowie
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (Papageitaucher und Kegelrobbe).
  it:
    intro: >-
      Nell'aprile 1947 il maltempo lasciò l'isola priva di collegamenti con la terraferma per settimane. Così
      scorreva la vita a Great Blasket, all'estremità della penisola di Dingle: l'insediamento più occidentale
      d'Irlanda, una comunità di lingua gaelica che l'oceano poteva isolare a piacimento. L'isola fu
      definitivamente abbandonata nel 1953. Oggi restano il villaggio diroccato e una natura selvaggia
      incontaminata. An Blascaod Mór è la maggiore delle isole Blasket e accoglie sulle sue rive le foche
      grigie.
    landscape: >-
      L'isola si sviluppa per sei chilometri verso sud-ovest e tocca i 346 m sulla cima di An Cró Mór. I
      ruderi del villaggio si raggruppano lungo la costa nord-orientale più riparata, dove sorgevano semplici
      casette in pietra. Oltre l'abitato fantasma, gran parte dell'isola è terra selvaggia priva di servizi
      pubblici.


      Il comprensorio rientra nella Zona Speciale di Conservazione delle isole Blasket, tutelando scogliere
      marine con vegetazione, brughiere secche e grotte sommerse o semisommerse.
    wildlife: >-
      Ciò che richiama la maggioranza dei visitatori via mare sono le foche grigie. Le Blasket costituiscono
      una nursery fondamentale per la [foca grigia](/especie/halichoerus_grypus/) in Irlanda, compresa tra le
      priorità di tutela della ZSC assieme alla [focena comune](/especie/phocoena_phocoena/). L'arcipelago
      accoglie inoltre almeno 13 specie di uccelli marini nidificanti.


      Poiché i collegamenti marittimi operano solo nei mesi estivi e con mare calmo, l'estate rappresenta
      l'unico periodo utile per visitare l'isola.
    visit: >-
      Si accede esclusivamente via mare da Dunquin o Dingle, senza pontili fissi: lo sbarco finale avviene con
      gommoni. I traghetti salpano in estate con mare calmo e la traversata dura tra venti minuti e un'ora a
      seconda del porto. La sosta media dura circa un'ora e mezza.


      Sull'isola si snodano sentieri a piedi e l'Office of Public Works assicura una visita guidata gratuita
      del borgo storico. L'isola non è accessibile in sedia a rotelle ed è indicata per persone con buona
      mobilità.


      Sulla terraferma sorge il Blasket Centre, all'estremità della penisola di Dingle a 16 km da Dingle lungo
      la R559, con museo, archivio storico e laboratori didattici.
    history: >-
      Great Blasket fu popolata a fasi alterne per secoli. Nel decennio del 1840 vi risiedevano circa 150
      persone in modeste capanne di pietra sui versanti a nord-est. In mancanza di legna, ardevano brughiera e
      zolle di torba. Nel 1953 il governo irlandese concluse che non poteva più garantire l'assistenza a una
      popolazione ridotta al lumicino.


      Da quella comunità fiorirono autori che tramandarono memorie e racconti tradizionali: An tOileánach di
      Tomás Ó Criomhthain (1929), Fiche Bliain ag Fás di Muiris Ó Súilleabháin (1933) e Machnamh Seanamhná di
      Peig Sayers (1939).


      Nel 2009 l'Office of Public Works ha acquisito quasi tutti gli immobili dell'isola compreso il villaggio
      fantasma, organizzando visite guidate dal 2010.
    before: >-
      I traghetti dipendono dalle condizioni meteomarine: verifica le partenze prima di metterti in viaggio.
      La stagione turistica copre il periodo da maggio a settembre.
    around: >-
      Great Blasket non ha schede contigue nell'atlante; condividono specie marine il [Parco nazionale del
      Wattenmeer dello Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (focena e
      foca grigia), [Lundy](/lugar/lundy/), [Lunga e le Isole Treshnish](/lugar/lunga-treshnish-isles/) e le
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (pulcinella di mare e foca grigia).
  pt:
    intro: >-
      Em abril de 1947 o mau tempo cortou as ligações marítimas da ilha durante semanas. Assim era o
      quotidiano em Great Blasket, no extremo da península de Dingle: o povoado mais ocidental da Irlanda, uma
      comunidade falante de gaélico que o oceano isolava sem aviso. A ilha foi definitivamente evacuada em
      1953. Hoje restam as ruínas da aldeia e uma paisagem insular devolvida à natureza selvagem. An Blascaod
      Mór é a maior das ilhas Blasket, afamada pelas colónias de focas-cinzentas nas praias.
    landscape: >-
      A ilha desenvolve-se ao longo de seis quilómetros para sudoeste, culminando a 346 m no topo de An Cró
      Mór. As ruínas do povoado concentram-se na vertente nordeste, a mais resguardada, onde se erguiam
      rústicas habitações de pedra. Para lá do casario deserto, a ilha é um santuário desprovido de estradas
      ou serviços públicos.


      O espaço integra a Zona Especial de Conservação das ilhas Blasket, salvaguardando recifes, arribas
      marítimas com coberto vegetal, charnecas secas e grutas marinhas submersas ou semissubmersas.
    wildlife: >-
      O principal motivo de atração para quem chega por mar são as focas-cinzentas. As Blasket representam um
      berçário vital da [foca-cinzenta](/especie/halichoerus_grypus/) na Irlanda, espécie prioritária da Zona
      Especial de Conservação a par do [boto](/especie/phocoena_phocoena/). O arquipélago reúne ainda pelo
      menos 13 espécies de aves marinhas nidificantes.


      Como as embarcações só operam nos meses de verão com mar chão, esta é a única época em que podes visitar
      a ilha.
    visit: >-
      O acesso faz-se unicamente de barco a partir de Dunquin ou Dingle, sem cais acostável: o desembarque
      final processa-se em semirrígidos. Os barcos navegam no verão com tempo favorável, durando a viagem
      entre vinte minutos e uma hora consoante o porto. A permanência média cifra-se numa hora e meia.


      Existem carreiros pedestres pela ilha, e o Office of Public Works assegura visitas guiadas gratuitas à
      aldeia antiga. A ilha não é acessível a cadeiras de rodas, sendo indicada apenas a visitantes com
      autonomia física.


      No continente encontra-se o Blasket Centre, na ponta da península de Dingle, a 16 km de Dingle pela
      estrada R559, com núcleo museológico, arquivo e ateliês culturais.
    history: >-
      A Great Blasket foi habitada de forma intermitente ao longo de séculos. Na década de 1840 residiam ali
      cerca de 150 pessoas em casas térreas na costa nordeste. Perante a escassez de lenha, queimavam tojo e
      leivas de turfa. Em 1953 o governo irlandês deliberou que não podia continuar a assegurar os cuidados e
      a segurança de uma população em declínio.


      Daquele meio isolado emergiram autores singulares que perpetuaram o quotidiano tradicional gaélico: An
      tOileánach de Tomás Ó Criomhthain (1929), Fiche Bliain ag Fás de Muiris Ó Súilleabháin (1933) e Machnamh
      Seanamhná de Peig Sayers (1939).


      Em 2009 o Office of Public Works adquiriu a maioria dos terrenos incluindo a aldeia deserta, dinamizando
      visitas guiadas desde 2010.
    before: >-
      As travessias fluviais e marítimas dependem estritamente da meteorologia: confirma a partida antes de
      viajar. A temporada estende-se de maio a setembro.
    around: >-
      Great Blasket não possui sítios vizinhos próximos no atlas; partilham espécies costeiras o [Parque
      Nacional do Mar de Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (boto e foca-cinzenta),
      [Lundy](/lugar/lundy/), [Lunga e as Ilhas Treshnish](/lugar/lunga-treshnish-isles/) e as
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (papagaio-do-mar e foca-cinzenta).
