resumen:
  es: >-
    El pilar de piedra marina (*sea stack*) más famoso del mundo (137 m de arenisca roja aislada de la pared
    costera) en la salvaje e imponente isla de Hoy.
  en: >-
    The world's most famous sea stack (137 m of red sandstone standing isolated from the sea cliffs) on the
    wild and dramatic Isle of Hoy.
  fr: >-
    Le pilier marin (*sea stack*) le plus célèbre du monde (137 m de grès rouge isolé de la falaise) sur l'île
    sauvage et grandiose de Hoy.
  de: >-
    Der berühmteste Brandungspfeiler der Welt (137 m roter Sandstein, frei vor der Küstenwand aufragend) auf
    der wilden Insel Hoy.
  it: >-
    Il faraglione marino (*sea stack*) più celebre del pianeta (137 m di arenaria rossa isolata dalla parete
    costiera) sull'imponente isola di Hoy.
  pt: >-
    O pilar marítimo (*sea stack*) mais famoso do mundo (137 m de arenito vermelho isolado da falésia
    costeira) na bravia e imponente ilha de Hoy.
unico:
  es: Un farallón de arenisca de 137 metros que el mar ha separado de la costa hace apenas unos siglos.
  en: A 137 m sandstone sea stack carved away from the island's coast by the sea only a few centuries ago.
  fr: Un éperon de grès de 137 mètres que la mer a séparé de la côte il y a seulement quelques siècles.
  de: >-
    Ein 137 Meter hoher Sandsteinturm, den die Meeresbrandung erst vor wenigen Jahrhunderten von der Kliffwand
    abgetrennt hat.
  it: >-
    Un faraglione di arenaria alto 137 metri separato dalla scogliera dalla forza del mare appena qualche
    secolo fa.
  pt: Um farilhão de arenito de 137 metros que a erosão marinha separou da costa há apenas alguns séculos.
observaciones:
  es: >-
    Mantén a los perros con correa corta del 1 de abril al 15 de agosto, que es la época de cría de las aves
    de suelo. No se permiten barbacoas en la reserva en ningún momento por el riesgo de incendio. Hay que
    alejarse del borde del acantilado: la roca es especialmente quebradiza. Las rutas largas exigen buena
    orientación y equipo. Hay aparcamiento en la Dwarfie Stone y en la playa de Rackwick, ambos fuera de la
    reserva de la RSPB.
texto:
  es:
    intro: >-
      El Old Man of Hoy no siempre ha sido un hombre solo. En 1819 ya estaba separado de tierra firme, y un
      dibujo de la época lo muestra con un arco en la base, de donde le vino el nombre; después una tormenta
      se llevó una de las patas y lo dejó como hoy, un farallón de arenisca de 137 metros. Para llegar a él
      hay que cruzar Hoy, la isla alta de las Orcadas, entre páramo, brezales y acantilados. La reserva de la
      RSPB reúne justo eso: el paisaje que lo rodea y las aves que lo habitan.
    landscape: >-
      Hoy es la más alta, salvaje y húmeda de las Orcadas, con 1.500 mm de lluvia al año. Su punto más alto,
      Ward Hill, con 481 metros, lo es también de todo el archipiélago. El nombre viene del nórdico Háey,
      «isla alta». Los hielos modelaron las areniscas más duras hasta dejar las colinas y los valles de hoy.


      El Old Man se levanta junto a la bahía de Rackwick, en la costa oeste, y es un farallón de arenisca roja
      sobre un zócalo de basalto, separado de la costa por un foso de 60 metros. Las capas alternan areniscas
      blandas y con cantos con lajas más duras de Old Red Sandstone, y por eso los costados tienen un perfil
      de muescas y losas. Lo formó la erosión de un acantilado algún tiempo después de 1750, tiene como mucho
      unos pocos cientos de años y podría derrumbarse pronto.


      Cerca está St John's Head, con los acantilados verticales más altos del Reino Unido, junto a la masa
      rocosa de Bre Brough. Cuando la luz entra oblicua, la arenisca de los acantilados se tiñe de rosa,
      naranja, amarillo y morado.


      La playa de Rackwick tiene arena dorada y grandes bloques de colores bajo acantilados rosados. En el
      valle, Berriedale conserva un bosque antiguo, de los más septentrionales del Reino Unido.
    wildlife: >-
      En junio, las llamadas de miles de [fulmares](/especie/fulmarus_glacialis/), araos, alcas y frailecillos
      resuenan entre el Old Man y St John's Head.


      Tierra adentro, la RSPB mantiene un mosaico de turbera, brezal seco y brezal húmedo donde crían el
      [águila marina](/especie/haliaeetus_albicilla/), el [aguilucho pálido](/especie/circus_cyaneus/), el
      esmerejón y el [colimbo chico](/especie/gavia_stellata/). Cada año vigila la reproducción de estas
      especies. Los colimbos anidan junto a las lagunas de Sui Fea y se molestan con facilidad: en primavera y
      a comienzos del verano, rodéalas por las laderas norte.


      En Cuilags se ven liebres variables, pardas en primavera y verano y blancas en invierno. Esa elección de
      camuflaje las convierte en presa fácil del águila real y del águila marina, que han vuelto a los cielos
      de Hoy. Entre las plantas que se protegen hay rocío de sol grande, gayuba alpina, orquídea fragante y
      cornejo enano. Y en la reserva viven también págalos grandes y collalbas.
    visit: >-
      La ruta de Rackwick al Old Man es la fácil y está bien señalizada: empieza en el poblado de Rackwick.
      Los caminantes pueden volver de Rackwick a Moaness por el valle, un tramo que lleva unas dos horas a
      pie.


      La otra opción es la travesía de Cuilags, el Old Man y Rackwick: 21 km, grado cinco, unas ocho horas.
      Empieza con el ferry de pasajeros a pie desde Stromness hasta el embarcadero de Moaness, y es una ruta
      para montañeros con experiencia: terreno sin sendas, muy expuesto y con poca o ninguna cobertura móvil.
      Pasa por la cima de Cuilags, por Sui Fea y por St John's Head. Cerca de Rackwick hay un pequeño museo y
      un centro de visitantes.


      Antes de caminar, la Hoy Kirk and Heritage Centre, siempre abierta, tiene información sobre la historia
      local y libros de flora y fauna. En el norte del valle de Rackwick está la Dwarfie Stane, que data de
      hacia 3000 a. C. Y en Enegars se ven restos de un Corsair de la Royal Navy: en Hoy hay cuatro lugares de
      accidentes aéreos de la Segunda Guerra Mundial.
    history: >-
      En 1966 Chris Bonington, Rusty Baillie y Tom Patey hicieron la primera ascensión al farallón. Una
      ascensión de julio de 1967 se emitió en directo por la BBC, con unos 15 millones de espectadores. La
      isla es parte del Área Escénica Nacional Hoy y West Mainland, una de las 40 de Escocia.


      Desde que la RSPB tiene las tierras de Berriedale, las ovejas están excluidas del valle, y los árboles,
      con serbales y abedules, empiezan a recolonizar las laderas.
    before: >-
      Mantén a los perros con correa corta del 1 de abril al 15 de agosto, que es la época de cría de las aves
      de suelo. No se permiten barbacoas en la reserva en ningún momento por el riesgo de incendio. Hay que
      alejarse del borde del acantilado: la roca es especialmente quebradiza. Las rutas largas exigen buena
      orientación y equipo. Hay aparcamiento en la Dwarfie Stone y en la playa de Rackwick, ambos fuera de la
      reserva de la RSPB.
    around: >-
      A unos 19 km queda la [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/). Más lejos, el fulmar
      relaciona Hoy con la [Isla de Kalsoy y Faro de Kallur](/lugar/kalsoy/), el [Archipiélago de St
      Kilda](/lugar/st-kilda/), la [Reserva Natural de Hornstrandir](/lugar/hornstrandir/) y la [Isla de
      Lundy](/lugar/lundy/).
  en:
    intro: >-
      The Old Man of Hoy was not always a lone pillar. In 1819 it was already separated from the main island,
      and contemporary sketches depict it resting on a twin-legged arch that gave the stack its name;
      subsequently a ferocious storm swept away one leg, leaving the 137 m red sandstone monolith you see
      today. Reaching it means traversing Hoy, Orkney's high island of heather moorland, peat bogs, and
      towering sea cliffs. The RSPB nature reserve protects precisely this wild tapestry and the seabirds
      nesting along its precipices.
    landscape: >-
      Hoy is the highest, wildest, and wettest island in Orkney, soaked by some 1,500 mm of annual rainfall.
      Its summit, Ward Hill at 481 metres, is the highest point in the entire archipelago. The name stems from
      Old Norse Háey, meaning "high island". Glacial ice scoured the resistant sandstone strata into the
      dramatic hills and valleys visible today.


      The Old Man rises beside Rackwick Bay on the western coast, forming a red sandstone pillar rooted upon a
      basaltic plinth, separated from the cliff edge by a 60-metre chasm. Alternating beds of soft sandstone
      and pebbles with harder slabs of Old Red Sandstone give its sheer flanks their stepped and notched
      profile. Formed by coastal cliff collapse sometime after 1750, the stack is only a few centuries old at
      most and may eventually collapse into the sea.


      Nearby towers St John's Head, boasting the highest vertical sea cliffs in the United Kingdom, alongside
      the imposing mass of Bre Brough. In slanted afternoon light, the sandstone cliffs glow in shades of
      pink, orange, yellow, and purple.


      Rackwick beach features golden sand and colossal rounded boulders under pink cliffs. In the sheltered
      valley, Berriedale preserves an ancient native woodland, among the northernmost in the British Isles.
    wildlife: >-
      In June, the calls of thousands of [northern fulmars](/especie/fulmarus_glacialis/), common guillemots,
      razorbills, and puffins reverberate between the Old Man and St John's Head.


      Inland, the RSPB manages a mosaic of blanket bog, dry heath, and wet moorland where [white-tailed
      eagles](/especie/haliaeetus_albicilla/), [hen harriers](/especie/circus_cyaneus/), merlins, and
      [red-throated divers](/especie/gavia_stellata/) nest. Wardens monitor their breeding success every year.
      The divers nest along the quiet moorland lochans of Sui Fea and take fright easily: in spring and early
      summer, skirt these pools via the northern slopes.


      Around Cuilags you can spot mountain hares, brown in spring and summer and turning white in winter. This
      coat makes them easy prey for golden eagles and white-tailed eagles that have reclaimed the skies of
      Hoy. Protected flora includes great sundew, alpine bearberry, fragrant orchid, and dwarf cornel. Great
      skuas and northern wheatears also breed across the reserve.
    visit: >-
      The trail from Rackwick to the Old Man is the gentler option and well-signposted: it sets off from the
      hamlet of Rackwick. Walkers can loop back from Rackwick to Moaness along the glen, a hike of about two
      hours on foot.


      The grander alternative is the demanding Cuilags, Old Man, and Rackwick traverse: 21 km, grade five,
      taking around eight hours. It begins with the passenger ferry crossing from Stromness to Moaness pier,
      and is intended strictly for experienced hillwalkers: pathless, exposed moorland terrain with little or
      no mobile phone reception. It crosses the crest of Cuilags, Sui Fea, and St John's Head. Near Rackwick
      there is a small local museum and visitor point.


      Before hiking, the Hoy Kirk and Heritage Centre, open daily, offers insights into island heritage and
      flora and fauna guides. North of Rackwick glen lies the Dwarfie Stane, a rock-cut tomb dating back to
      around 3000 BC. On Enegars you can see wreckage of a Royal Navy Corsair: Hoy holds four World War II
      aircraft crash sites.
    history: >-
      In 1966 Chris Bonington, Rusty Baillie, and Tom Patey completed the first ascent of the sea stack. A
      celebrated climb in July 1967 was broadcast live by the BBC, captivating around 15 million television
      viewers. The island forms part of the Hoy and West Mainland National Scenic Area, one of 40 across
      Scotland.


      Since the RSPB acquired the Berriedale estate, grazing sheep have been excluded from the glen, allowing
      native trees such as rowan and birch to regenerate naturally along the valley slopes.
    before: >-
      Keep dogs on a short lead between 1 April and 15 August to protect ground-nesting birds. Barbecues and
      open fires are strictly prohibited throughout the reserve due to peat fire hazard. Maintain a safe
      distance from cliff edges: the sandstone rock is crumbly and unstable. Long hikes require competent map
      navigation and mountain gear. Parking is available at the Dwarfie Stone and Rackwick beach, both
      situated outside the RSPB reserve boundary.
    around: >-
      Around 19 km to the north lies the [Marwick Head Nature Reserve](/lugar/marwick-head/). Further afield,
      nesting fulmars link Hoy with the [Kalsoy Island and Kallur Lighthouse](/lugar/kalsoy/), the [St Kilda
      Archipelago](/lugar/st-kilda/), the [Hornstrandir Nature Reserve](/lugar/hornstrandir/), and [Lundy
      Island](/lugar/lundy/).
  fr:
    intro: >-
      L'Old Man of Hoy n'a pas toujours été une aiguille solitaire. En 1819, il était déjà détaché de la
      falaise, et les croquis de l'époque le montrent reposant sur une arche à deux piliers qui lui valut son
      nom ; plus tard, une violente tempête emporta l'un des pieds, laissant l'obélisque de grès rouge de 137
      mètres que l'on admire aujourd'hui. Pour l'atteindre, il faut traverser Hoy, la haute île des Orcades,
      entre landes tourbeuses, bruyères et parois vertigineuses. La réserve de la RSPB protège cet écrin et
      les oiseaux qui y nichent.
    landscape: >-
      Hoy est la plus haute, la plus sauvage et la plus arrosée des Orcades, recevant près de 1 500 mm de
      pluie par an. Son point culminant, Ward Hill avec 481 mètres, domine l'ensemble de l'archipel. Son nom
      dérive du vieux norrois Háey, « île haute ». Les glaciers quaternaires ont façonné les bancs de grès
      résistant pour sculpter les collines et les vallées actuelles.


      L'Old Man se dresse près de la baie de Rackwick, sur la côte ouest : c'est un pilier de grès rouge ancré
      sur un socle basaltique, séparé de la falaise par une brèche de 60 mètres. Les strates alternent des
      grès friables avec les dalles plus dures du Vieux Grès Rouge, conférant à ses flancs un profil crénelé
      d'éperons et de corniches. Né de l'effondrement d'une falaise quelque temps après 1750, il n'a que
      quelques siècles et finira un jour par s'écrouler dans les flots.


      Tout près se dresse St John's Head, qui abrite les plus hautes falaises verticales du Royaume-Uni, aux
      côtés du bastion rocheux de Bre Brough. En lumière rasante, le grès des falaises s'embrase de teintes
      roses, orangées, jaunes et violacées.


      La plage de Rackwick déroule son sable doré et ses gros galets polis sous des parois rosées. Dans le
      vallon abrité, Berriedale conserve un boisement ancien, parmi les plus nordiques de Grande-Bretagne.
    wildlife: >-
      En juin, les clameurs de milliers de [fulmars boréaux](/especie/fulmarus_glacialis/), de guillemots, de
      petits pingouins et de macareux résonnent entre l'Old Man et St John's Head.


      À l'intérieur des terres, la RSPB préserve une mosaïque de tourbières, de landes sèches et de tourbières
      humides où se reproduisent le [pyrgargue à queue blanche](/especie/haliaeetus_albicilla/), le [busard
      Saint-Martin](/especie/circus_cyaneus/), le faucon émerillon et le [plongeon
      catmarin](/especie/gavia_stellata/). Les gardes assurent chaque année le suivi de ces espèces. Les
      plongeons nichent aux abords des lochans de Sui Fea et s'alarment facilement : au printemps et au début
      de l'été, contournez les plans d'eau par les pentes nord.


      Sur les hauteurs de Cuilags s'observent des lièvres variables, au pelage brun en saison chaude et blanc
      en hiver. Ce mimétisme en fait la proie de l'aigle royal et du pygargue, de retour dans le ciel de Hoy.
      Parmi la flore remarquable figurent la droséra à feuilles rondes, la busserole alpine et le cornouiller
      de Suède.
    visit: >-
      Le sentier reliant Rackwick à l'Old Man est facile et bien tracé : il démarre au hameau de Rackwick. Les
      marcheurs peuvent regagner Moaness depuis Rackwick par la vallée, un tronçon d'environ deux heures à
      pied.


      L'autre option est la grande traversée par Cuilags, l'Old Man et Rackwick : 21 km, cotation de niveau
      cinq, réclamant environ huit heures. Elle débute par la navette maritime piétonne depuis Stromness
      jusqu'au quai de Moaness, et s'adresse à des randonneurs chevronnés : terrain hors sentier, très exposé
      et dépourvu de réseau téléphonique. Elle franchit le sommet de Cuilags, Sui Fea et St John's Head. Un
      musée d'histoire locale et un accueil se trouvent près de Rackwick.


      Avant de marcher, la Hoy Kirk and Heritage Centre offre des informations culturelles et des guides
      botaniques. Au nord du vallon de Rackwick trône la Dwarfie Stane, sépulture mégalithique taillée vers
      3000 av. J.-C. Sur les crêtes d'Enegars reposent les débris d'un Corsair de la Royal Navy : Hoy conserve
      quatre sites de crashs aériens de la Seconde Guerre mondiale.
    history: >-
      En 1966, Chris Bonington, Rusty Baillie et Tom Patey signèrent la première ascension du stack. Une
      ascension de juillet 1967 fut retransmise en direct par la BBC, suivie par près de 15 millions de
      téléspectateurs. L'île est intégrée à la National Scenic Area de Hoy et West Mainland, l'une des 40
      zones paysagères protégées d'Écosse.


      Depuis que la RSPB a acquis le domaine de Berriedale, les moutons ont été bannis du vallon, permettant
      aux sorbiers et bouleaux de recoloniser vigoureusement les versants.
    before: >-
      Tenez impérativement les chiens en laisse courte du 1 avril au 15 août afin de protéger les nichées au
      sol. Les feux et barbecues sont strictement interdits dans toute la réserve en raison du risque
      d'incendie de tourbe. Éloignez-vous prudemment des bords de falaise : la roche est très friable. Les
      grandes traversées exigent équipement de montagne et sens de l'orientation. Des parkings existent à la
      Dwarfie Stone et à la plage de Rackwick.
    around: >-
      À quelque 19 km au nord s'étend la [Réserve ornithologique de Marwick Head](/lugar/marwick-head/). Plus
      loin, le fulmar boréal unit Hoy à l'[Île de Kalsoy et phare de Kallur](/lugar/kalsoy/), à l'[Archipel de
      Saint-Kilda](/lugar/st-kilda/), à la [Réserve naturelle d'Hornstrandir](/lugar/hornstrandir/) et à
      l'[Île de Lundy](/lugar/lundy/).
  de:
    intro: >-
      Der Old Man of Hoy war nicht immer eine einsame Felsnadel. Im Jahr 1819 war er bereits vom Festland
      getrennt, und Zeichnungen jener Epoche zeigen ihn mit einem zweibeinigen Bogen am Sockel, dem er seinen
      Namen verdankt; später riss ein Orkan ein Bein fort und hinterließ den 137 Meter hohen roten
      Sandsteinpfeiler, den man heute bestaunt. Um ihn zu erreichen, durchquert man Hoy, die gebirgige Insel
      der Orkneys, zwischen Mooren, Heiden und tosenden Kliffs. Das RSPB-Reservat schützt diese wilde
      Berglandschaft und ihre Seevögel.
    landscape: >-
      Hoy ist die höchste, wildeste und feuchteste Insel der Orkneys mit rund 1.500 mm Jahresniederschlag. Ihr
      Gipfel Ward Hill ist mit 481 Metern zugleich die höchste Erhebung des gesamten Archipels. Der Name
      stammt vom altnordischen Háey, „hohe Insel“. Eiszeitliche Gletscher schliffen die harten Sandsteine zu
      den heutigen Hügeln und Tälern aus.


      Der Old Man erhebt sich nahe der Bucht Rackwick Bay an der Westküste als roter Sandsteinturm auf einem
      Basaltsockel, getrennt vom Kliff durch eine 60 Meter breite Kluft. Weichere Sandsteinschichten wechseln
      sich mit härteren Bänken des Old Red Sandstone ab, was den Flanken ihr markant gestuftes Profil
      verleiht. Er entstand durch Brandungserosion irgendwann nach 1750, ist höchstens wenige Jahrhunderte alt
      und wird eines Tages ins Meer stürzen.


      Nahebei ragen die Klippen von St John's Head empor, die höchsten senkrechten Meeresfelsen des
      Vereinigten Königreichs, neben dem Massiv des Bre Brough. Bei tief stehender Sonne leuchtet der
      Sandstein in Rosa, Orange, Gelb und Violett.


      Der Strand von Rackwick verzaubert mit goldfarbenem Sand und bunten Felsblöcken vor rosafarbenen Wänden.
      Im Tal birgt Berriedale einen Altwald, der zu den nördlichsten naturnahen Gehölzen Großbritanniens
      zählt.
    wildlife: >-
      Im Juni hallen die Rufe Tausender [Eissturmvögel](/especie/fulmarus_glacialis/), Trottellummen, Tordalke
      und Papageitaucher zwischen dem Old Man und St John's Head wider.


      Im Binnenland bewahrt die RSPB ein Mosaik aus Deckenmooren, Trocken- und Feuchtheiden, in denen
      [Seeadler](/especie/haliaeetus_albicilla/), [Kornweihen](/especie/circus_cyaneus/), Merline und
      [Sterntaucher](/especie/gavia_stellata/) brüten. Jedes Jahr überwacht die Schutzgebietsleitung den
      Bruterfolg. Die Taucher nisten an den Bergseen von Sui Fea und reagieren empfindlich auf Störungen:
      Umgehe die Tümpel im Frühjahr über die Nordhänge.


      An den Hängen von Cuilags leben Schneehasen, die im Sommer braun und im Winter schneeweiß gefärbt sind.
      Dies macht sie zur Beute von Steinadlern und Seeadlern, die den Himmel über Hoy zurückerobert haben. Zu
      den geschützten Pflanzen gehören Sonnentau, Alpen-Bärentraube, Wohlriechende Händelwurz und
      Zwerg-Hartriegel. Auch Raubmöwen brüten im Moor.
    visit: >-
      Der Pfad von Rackwick zum Old Man ist der leichteste und bestens markiert: Er beginnt im Weiler
      Rackwick. Wanderer können von Rackwick durch das Tal nach Moaness zurückkehren, was etwa zwei Stunden
      Gehzeit erfordert.


      Die anspruchsvolle Alternative ist die Überschreitung von Cuilags, Old Man und Rackwick: 21 km,
      Schwierigkeitsgrad fünf, rund acht Stunden Gehzeit. Sie startet mit der Personenfähre von Stromness zum
      Anleger Moaness und richtet sich an erfahrene Bergwanderer: wegloses, exponiertes Hochland ohne
      Mobilfunkempfang. Die Route berührt den Gipfel von Cuilags, Sui Fea und St John's Head. Bei Rackwick
      informiert ein kleines Heimatmuseum.


      Vor der Tour bietet das Heritage Centre in der Hoy Kirk Einblicke in Inselgeschichte und Naturkunde. Im
      Norden des Rackwick-Tals liegt der Dwarfie Stane, ein Felsengrab aus der Zeit um 3000 v. Chr. Bei
      Enegars finden sich Trümmer einer Corsair der Royal Navy: Hoy birgt vier Flugzeugabsturzstellen aus dem
      Zweiten Weltkrieg.
    history: >-
      Im Jahr 1966 gelang Chris Bonington, Rusty Baillie und Tom Patey die Erstbesteigung der Felsnadel. Eine
      Klettertour im Juli 1967 wurde live von der BBC übertragen und fesselte rund 15 Millionen Zuschauer vor
      den Fernsehschirmen. Die Insel ist Teil des National Scenic Area Hoy and West Mainland, eines von 40
      Schutzgebieten Schottlands.


      Seit die RSPB das Berriedale-Tal betreut, wurden weidende Schafe ferngehalten, sodass Ebereschen und
      Birken die Hänge natürlich wiederbesiedeln.
    before: >-
      Hunde sind vom 1. April bis zum 15. August wegen bodenbrütender Vögel an der kurzen Leine zu führen.
      Wegen Torfbrandgefahr sind Grillen und offenes Feuer im gesamten Reservat untersagt. Halte Abstand zu
      Kliffkanten: Der Sandstein ist brüchig. Weite Touren erfordern Navigationskönnen und wetterfeste
      Ausrüstung. Parkplätze gibt es am Dwarfie Stone und am Rackwick-Strand außerhalb des RSPB-Gebiets.
    around: >-
      Rund 19 km nördlich liegt das Vogelschutzgebiet [Marwick Head](/lugar/marwick-head/). Weiter entfernt
      verbinden brütende Eissturmvögel Hoy mit der [Insel Kalsoy und Leuchtturm Kallur](/lugar/kalsoy/), dem
      [St.-Kilda-Archipel](/lugar/st-kilda/), dem [Naturschutzgebiet Hornstrandir](/lugar/hornstrandir/) und
      der [Insel Lundy](/lugar/lundy/).
  it:
    intro: >-
      L'Old Man of Hoy non è sempre stato una guglia solitaria. Nel 1819 era già staccato dalla costa, e i
      disegni dell'epoca lo mostrano poggiato su un arco a due pilastri da cui trasse origine il nome; in
      seguito una tempesta spazzò via uno dei piedi lasciando l'obelisco di arenaria rossa alto 137 metri
      visibile oggi. Per raggiungerlo occorre attraversare Hoy, l'isola montuosa delle Orcadi, tra brughiere,
      torbiere e scogliere a picco. La riserva della RSPB protegge questo paesaggio selvaggio e l'avifauna
      nidificante.
    landscape: >-
      Hoy è la più elevata, selvaggia e piovosa delle Orcadi, bagnata da circa 1.500 mm di pioggia all'anno.
      La sua cima principale, Ward Hill con 481 metri, rappresenta il tetto dell'intero arcipelago. Il nome
      deriva dall'antico norreno Háey, «isola alta». I ghiacciai hanno modellato le arenarie più resistenti
      sino a foggiare le valli e i rilievi attuali.


      L'Old Man si erge presso la baia di Rackwick sulla costa occidentale: è un faraglione di arenaria rossa
      su basamento basaltico, separato dalla falesia da una fenditura marina di 60 metri. Gli strati alternano
      arenarie friabili e ciottolose a lenti durissime di Old Red Sandstone, donando ai fianchi un profilo
      intagliato a gradoni e cenge. Formatosi per crollo costiero poco dopo il 1750, conta al massimo pochi
      secoli di vita e un giorno crollerà tra le onde.


      Nelle vicinanze troneggia St John's Head, con le più alte scogliere verticali del Regno Unito, accanto
      al bastione di Bre Brough. Quando la luce pomeridiana scende radente, l'arenaria si accende di sfumature
      rosa, arancio, ocra e viola.


      La spiaggia di Rackwick offre sabbia dorata e ciottoloni levigati sotto muraglie rocciose. Nel
      fondovalle, Berriedale racchiude un bosco relitto tra i più settentrionali di tutta la Gran Bretagna.
    wildlife: >-
      A giugno le grida di migliaia di [fulmari](/especie/fulmarus_glacialis/), urie, gazze marine e
      pulcinelle echeggiano tra l'Old Man e St John's Head.


      All'interno la RSPB tutela un mosaico di torbiere e brughiere dove nidificano l'[aquila di
      mare](/especie/haliaeetus_albicilla/), l'[albanella reale](/especie/circus_cyaneus/), lo smeriglio e la
      [strolaga minore](/especie/gavia_stellata/). Gli operatori monitorano ogni anno il successo
      riproduttivo. Le strolaghe nidificano presso i laghetti di Sui Fea e si disturbano facilmente: in
      primavera e a inizio estate aggira gli specchi d'acqua lungo i versanti settentrionali.


      Sulle alture di Cuilags pascolano le lepri variabili, dal mantello bruno d'estate e bianco candido
      d'inverno. Questo le rende facili prede per l'aquila reale e l'aquila di mare, tornate a solcare i cieli
      di Hoy. Tra le piante protette spiccano la drosera, l'uva ursina alpina, l'orchidea odorosa e il
      corniolo nano. La brughiera ospita anche stercorari maggiori e culbianchi.
    visit: >-
      Il cammino da Rackwick all'Old Man è l'itinerario classico e ben tracciato: parte dal borgo rurale di
      Rackwick. Gli escursionisti possono tornare a Moaness risalendo la vallata a piedi in circa due ore.


      L'altra possibilità è l'impegnativa traversata di Cuilags, Old Man e Rackwick: 21 km, grado
      escursionistico cinque, per circa otto ore di marcia. Prende avvio dal traghetto passeggeri da Stromness
      al pontile di Moaness ed è riservata a camminatori esperti: tracciato privo di sentieri battuti, esposto
      e quasi privo di copertura cellulare. Tenta la vetta di Cuilags, Sui Fea e St John's Head. Vicino a
      Rackwick sorge un piccolo museo locale.


      Prima della camminata, l'Hoy Kirk and Heritage Centre offre approfondimenti storici e guide
      naturalistiche. A nord della valle di Rackwick si incontra la Dwarfie Stane, sepoltura rupestre
      risalente a circa il 3000 a.C. Su Enegars giacciono i rottami di un caccia Corsair della Royal Navy: Hoy
      custodisce quattro siti di incidenti aerei della Seconda Guerra Mondiale.
    history: >-
      Nel 1966 Chris Bonington, Rusty Baillie e Tom Patey compirono la prima ascensione alpinistica della
      guglia. Una scalata nel luglio 1967 fu trasmessa in diretta televisiva dalla BBC, incollando allo
      schermo circa 15 milioni di spettatori. L'isola fa parte della Hoy and West Mainland National Scenic
      Area, una delle 40 aree panoramiche protette della Scozia.


      Da quando la RSPB gestisce le terre di Berriedale, i pascoli ovini sono stati recintati fuori dalla
      valle, consentendo a betulle e sorbi di ricolonizzare spontaneamente i pendii.
    before: >-
      Tieni i cani al guinzaglio corto dal 1 aprile al 15 agosto per tutelare i volatili che nidificano al
      suolo. Barbecue e fuochi a terra sono severamente vietati nella riserva per il pericolo di incendi della
      torba. Mantieni una distanza prudente dal ciglio delle falesie franose. I lunghi itinerari richiedono
      calzature da trekking e orientamento con bussola. Ci sono aree di sosta alla Dwarfie Stone e alla
      spiaggia di Rackwick.
    around: >-
      A circa 19 km verso nord si trova la [Riserva di Marwick Head](/lugar/marwick-head/). Più distanti, le
      colonie di fulmaro collegano Hoy all'[Isola di Kalsoy e faro di Kallur](/lugar/kalsoy/), all'[Arcipelago
      di St Kilda](/lugar/st-kilda/), alla [Riserva naturale di Hornstrandir](/lugar/hornstrandir/) e
      all'[Isola di Lundy](/lugar/lundy/).
  pt:
    intro: >-
      O Old Man of Hoy nem sempre foi um monolito isolado. Em 1819 já se encontrava separado da falésia, e
      gravuras da época retratam-no apoiado num arco com duas pernas que lhe deu a alcunha; mais tarde, um
      forte temporal desmoronou uma das bases, restando a coluna de arenito vermelho de 137 metros que hoje
      contemplas. Chegar até lá implica cruzar Hoy, a ilha montanhosa das Órcades, por entre charnecas,
      turfeiras e penhascos atlânticos. A reserva da RSPB tutela precisamente esta paisagem agreste e as aves
      marinhas que nela nidificam.
    landscape: >-
      Hoy é a ilha mais alta, bravia e pluviosa das Órcades, recebendo cerca de 1.500 mm de precipitação por
      ano. O seu pico Ward Hill atinge 481 metros, constituindo a maior altitude de todo o arquipélago. O
      topónimo provém do nórdico antigo Háey, «ilha alta». As glaciações esculpiram as bancadas resistentes de
      arenito até formarem as colinas e vales atuais.


      O Old Man ergue-se junto à baía de Rackwick, no litoral ocidental: é um pilar de arenito vermelho
      assente num soco basáltico, separado da escarpa por um abismo marinho de 60 metros. As camadas alternam
      arenitos brandos e seixos com lajes duras de Arenito Vermelho Velho, conferindo aos flancos um perfil
      dentado de patamares sobrepostos. Gerado pelo colapso de uma falesia algum tempo depois de 1750, tem no
      máximo escassos séculos de existência e um dia ruirá nas vagas do oceano.


      Perto dali ergue-se St John's Head, com as mais altas falésias verticais do Reino Unido, ladeando o
      maciço rochoso de Bre Brough. Sob a luz rasante da tarde, os paredões tingem-se de tonalidades de rosa,
      laranja, amarelo e violeta.


      A praia de Rackwick estende o seu areal dourado e calhaus volumosos sob falesias rosadas. No vale
      protegido, Berriedale resguarda um bosque relíquia, dos mais boreais da Grã-Bretanha.
    wildlife: >-
      Em junho, o clamor de milhares de [fulmares-glaciais](/especie/fulmarus_glacialis/), airos,
      tordas-comuns e fradinhos ecoa entre o Old Man e St John's Head.


      No interior, a RSPB mantém um mosaico de charneca seca, turfeiras de cobertura e charnecas húmidas onde
      nidificam a [águia-rabalva](/especie/haliaeetus_albicilla/), o
      [tartaranhão-azulado](/especie/circus_cyaneus/), o esmerilhão e a
      [mobelha-pequena](/especie/gavia_stellata/). Os vigilantes monitorizam anualmente a reprodução destas
      aves raras. As mobelhas nidificam nas lagoas de Sui Fea e assustam-se com facilidade: na primavera e
      início do verão, contorna os charcos pelas encostas norte.


      Nas colinas de Cuilags avistam-se lebres-variáveis, com pelagem castanha no verão e alva no inverno.
      Esta camuflagem torna-as presas fáceis da águia-real e da águia-rabalva, que regressaram aos céus de
      Hoy. Entre a flora botânica protegida destacam-se a drósera, a uva-ursina-alpina, a orquídea-aromática e
      o corniso-anão. Pela reserva vagueiam também moleiros-grandes e cartaxos-nortenhos.
    visit: >-
      O percurso pedestre entre Rackwick e o Old Man é o trilho mais suave e está bem demarcado: tem início na
      aldeia de Rackwick. Os caminhantes podem regressar de Rackwick a Moaness pelo vale, num troço pedestre
      de cerca de duas horas.


      A alternativa mais exigente é a travessia de Cuilags, Old Man e Rackwick: 21 km, nível de dificuldade
      cinco, exigindo cerca de oito horas de marcha. Inicia-se com a travessia no barco de passageiros de
      Stromness para o cais de Moaness, destinando-se exclusivamente a montanheiros experientes: terreno sem
      trilhos abertos, exposto e com escassa ou nula rede de telemóvel. Galga os cumes de Cuilags, Sui Fea e
      St John's Head. Próximo de Rackwick existe um pequeno centro interpretativo.


      Antes da caminhada, a Hoy Kirk and Heritage Centre disponibiliza acervo histórico e guias de flora e
      fauna. A norte do vale de Rackwick encontra-se a Dwarfie Stane, um túmulo megalítico talhado cerca de
      3000 a.C. Em Enegars jazem destroços de um caça Corsair da Royal Navy: em Hoy existem quatro sítios de
      desastres aéreos da Segunda Guerra Mundial.
    history: >-
      Em 1966 Chris Bonington, Rusty Baillie e Tom Patey realizaram a primeira escalada da agulha rochosa. Uma
      escalada lendária em julho de 1967 foi transmitida em direto pela BBC, reunindo cerca de 15 milhões de
      telespectadores. A ilha integra a Área Cénica Nacional de Hoy e West Mainland, uma das 40 áreas cénicas
      da Escócia.


      Desde que a RSPB assumiu a herdade de Berriedale, o gado ovino foi vedado fora do vale, permitindo que
      bétulas e tramazeiras recolonizem espontaneamente as encostas.
    before: >-
      Mantém os cães com trela curta de 1 de abril a 15 de agosto para resguardar as crias no solo. Churrascos
      e fogueiras ao ar livre são estritamente interditos na reserva face ao perigo de ignição da turfa.
      Afasta-te com prudência do rebordo das falésias quebradiças. As grandes travessias exigem orientação
      cartográfica e botas de montanha. Há estacionamento na Dwarfie Stone e na praia de Rackwick.
    around: >-
      A cerca de 19 km para norte situa-se a [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/).
      Mais longe, as colónias de fulmar ligam Hoy à [Ilha de Kalsoy e Farol de Kallur](/lugar/kalsoy/), ao
      [Arquipélago de St Kilda](/lugar/st-kilda/), à [Reserva Natural de Hornstrandir](/lugar/hornstrandir/) e
      à [Ilha de Lundy](/lugar/lundy/).
