observaciones:
  es: >-
    Hay restricciones de entrada en las zonas de Käina y Vaemla: comprueba el aviso del gestor antes de ir. El
    gestor pide llevar los perros atados. En Orjaku no se puede hacer fuego.
texto:
  es:
    intro: >-
      Hace mil años aquí había dos islas, Kassari al este y Orjaku al oeste. Se unieron hace unos quinientos
      años. Hoy Kassari y la bahía de Käina forman una reserva paisajística en el sureste de Hiiumaa: 5652 ha
      de las que 3189 son tierra firme, el resto agua salobre, cañaverales y praderas junto a la costa. La
      bahía es poco profunda, de unos 9 km² y un metro de profundidad máxima, y Kassari la separa del mar de
      Väinameri.
    landscape: >-
      La isla de Kassari es un mundo pequeño, de unos trescientos habitantes repartidos en cuatro pueblos:
      Esiküla, Kassari, Orjaku y Taguküla. Su costa, de más de 56 km, es muy recortada. Un esker la recorre de
      norte a sur y llega a 15 metros sobre el nivel del mar en su punto más alto. En la vegetación dominan
      los enebrales y los prados costeros, y en Kassari hay praderas, prados arbolados y praderas costeras de
      origen seminatural.


      La bahía es otra cosa: aguas salobres, numerosas islas y cañaverales.
    wildlife: >-
      Las aves marcan el calendario. La bahía de Käina, poco profunda y con cañaverales, y la costa son lugar
      de parada de muchas aves acuáticas y costeras durante la migración de primavera y otoño: se concentran
      para descansar y alimentarse. Por eso la reserva se disfruta sobre todo en esas dos estaciones. Hay
      torres de observación en Silmakare y junto al sendero del Orjaku, para ver aves de paso y locales.


      Junto al sendero hay una pradera costera de pastoreo restaurada, que sirve para hablar del efecto de la
      actividad humana sobre la biodiversidad.
    visit: >-
      Empieza por Orjaku. Allí hay una pasarela y plataformas de observación con vistas a la bahía de Käina, y
      dos de las plataformas se alcanzan con cochecito o silla de ruedas. El sendero didáctico de Orjaku mide
      entre 0,7 y 2 km y sirve para conocer las aves de distintos hábitats; el programa de observación e
      identificación de aves dura entre dos y tres horas.


      Si quieres completar el día con cultura, en la casa del administrador de la antigua hacienda de Kassari
      hay una exposición del Museo de Hiiumaa. A los habitantes de Kassari se les llamaba tradicionalmente
      hombres de la isla de las liebres.
    history: >-
      Kassari figura en documentos desde 1520. En el siglo XIX se construyó el puerto de Orjaku, hoy un puerto
      deportivo. En lo natural, la reserva conserva la única población estonia superviviente de Bupleurum
      tenuissimum y un paisaje seminatural de prados abiertos, arbolados y costeros.
    before: >-
      Hay restricciones de entrada en las zonas de Käina y Vaemla: comprueba el aviso del gestor antes de ir.
      El gestor pide llevar los perros atados. En Orjaku no se puede hacer fuego.
    around: >-
      La [Reserva Paisajística de Vormsi](/lugar/vormsi-maastikukaitseala/) está a unos veintitrés kilómetros,
      y la [Reserva Natural de Kõpu](/lugar/kopu-looduskaitseala/), a unos veinticinco.
  en:
    intro: >-
      A thousand years ago, two separate islands lay here: Kassari to the east and Orjaku to the west. They
      merged into one roughly five hundred years ago. Today Kassari and Käina Bay form a landscape
      conservation area in southeastern Hiiumaa: 5652 ha of which 3189 comprise dry land, with the remainder
      composed of shallow brackish inlets, reedbeds, and coastal meadows. The bay is very shallow, covering
      around 9 km² with a maximum depth of barely one metre, shielded from the open Väinameri Sea by Kassari.
    landscape: >-
      The island of Kassari is an intimate coastal realm of some three hundred inhabitants scattered across
      four historic villages: Esiküla, Kassari, Orjaku, and Taguküla. Its coastline, stretching over 56 km, is
      deeply indented. A glacial esker ridge traverses the island from north to south, reaching 15 metres
      above sea level at its highest elevation. Dense juniper stands and coastal meadows dominate the
      vegetation, with Kassari harbouring rich alvars, wooded meadows, and semi-natural coastal pastures.


      The bay presents a contrasting environment: calm brackish waters, numerous emergent islets, and
      expansive reedbeds.
    wildlife: >-
      The seasonal rhythms of the reserve are set by migratory waterfowl. Shallow Käina Bay with its
      sheltering reed fringes and shoreline meadows serves as a vital staging post for thousands of waterbirds
      and shorebirds during spring and autumn migration, gathering here to rest and feed in safety. For this
      reason, the reserve is best visited during those two passage seasons. Well-positioned observation towers
      at Silmakare and along the Orjaku nature trail allow fine viewing of both migrants and local breeders.


      Beside the walking track lies a restored coastal grazing meadow, illustrating the positive role of
      low-intensity human grazing in maintaining open biodiversity.
    visit: >-
      Begin your exploration at Orjaku. There you will find a timber boardwalk and observation platforms
      looking out across Käina Bay, two of which are fully accessible for prams and wheelchairs. The Orjaku
      educational trail measures between 0.7 and 2 km, guiding visitors through distinct wetland habitats; the
      birdwatching and identification experience typically takes two to three hours.


      To complement nature with local culture, the estate manager's residence of the historic Kassari manor
      houses an exhibition curated by the Hiiumaa Museum. The people of Kassari were traditionally known in
      folklore as the "hare island folk".
    history: >-
      Kassari first appears in written records in 1520. In the nineteenth century, Orjaku harbour was
      constructed, functioning today as a small-craft marina. From an ecological perspective, the reserve
      safeguards the only surviving Estonian population of the endangered umbellifer Bupleurum tenuissimum,
      along with a cherished semi-natural landscape of open, wooded, and coastal meadows.
    before: >-
      Seasonal access restrictions apply across sensitive sectors of Käina and Vaemla bays: check the
      environmental board's regulations before visiting. The management requires all dogs to be kept on leads.
      Open campfires are strictly prohibited at Orjaku.
    around: >-
      The [Vormsi Landscape Conservation Area](/lugar/vormsi-maastikukaitseala/) lies around twenty-three
      kilometres to the east, while the [Kõpu Nature Reserve](/lugar/kopu-looduskaitseala/) is situated some
      twenty-five kilometres away.
  fr:
    intro: >-
      Il y a mille ans subsistaient ici deux îles distinctes, Kassari à l'est et Orjaku à l'ouest. Elles ont
      fusionné il y a environ cinq cents ans. Aujourd'hui, Kassari et la baie de Käina composent une réserve
      paysagère au sud-est de Hiiumaa : 5652 ha dont 3189 de terre ferme, le reste se partageant entre eaux
      saumâtres, roselières et prés côtiers. La baie est très peu profonde, couvrant quelque 9 km² pour un
      mètre de profondeur maximale, séparée de la mer de Väinameri par l'île de Kassari.
    landscape: >-
      L'île de Kassari forme un microcosme d'environ trois cents âmes réparties en quatre villages : Esiküla,
      Kassari, Orjaku et Taguküla. Son littoral, étiré sur plus de 56 km, est remarquablement découpé. Un
      esker glaciaire la parcourt du nord au sud pour culminer à 15 mètres au-dessus du niveau de la mer. Les
      genévriers et les prairies littorales dominent le paysage, Kassari abritant des alvars, des prés boisés
      et des pâturages côtiers semi-naturels.


      La baie déploie un univers aquatique : nappes d'eau saumâtre, chapelet d'îlots et denses roselières.
    wildlife: >-
      Les oiseaux rythment les saisons. La baie de Käina, avec ses petits fonds et ses ceintures de roseaux,
      constitue une halte majeure pour une multitude d'oiseaux d'eau et de limicoles lors des passages
      printaniers et automnaux : ils s'y concentrent pour se reposer et se nourrir. C'est pourquoi la réserve
      prend tout son éclat au cours de ces deux saisons. Des tours d'affût à Silmakare et sur le sentier
      d'Orjaku permettent d'observer les haltes migratoires et les nicheurs locaux.


      Au bord du sentier, une prairie côtière pâturée restaurée illustre le rôle bénéfique du pastoralisme
      traditionnel sur la biodiversité.
    visit: >-
      Commencez la visite par Orjaku. On y trouve un platelage en bois et des plates-formes panoramiques
      dominant la baie de Käina, dont deux sont accessibles aux poussettes et aux fauteuils roulants. Le
      sentier pédagogique d'Orjaku s'étire entre 0,7 et 2 km pour découvrir l'avifaune des différents milieux
      ; le parcours d'observation et d'identification réclame entre deux et trois heures.


      Pour une touche patrimoniale, la maison de l'intendant de l'ancien manoir de Kassari accueille une
      antenne du musée de Hiiumaa. Les habitants de Kassari étaient traditionnellement surnommés les « gens de
      l'île aux lièvres ».
    history: >-
      Kassari est mentionnée dans les archives depuis 1520. Au XIXe siècle fut bâti le port d'Orjaku,
      reconverti aujourd'hui en port de plaisance. Sur le plan écologique, la réserve conserve l'unique
      colonie estonienne de Bupleurum tenuissimum ainsi qu'une mosaïque de prairies ouvertes, boisées et
      littorales.
    before: >-
      Des restrictions d'accès saisonnières s'appliquent dans les baies de Käina et de Vaemla : vérifiez les
      arrêtés environnementaux avant votre séjour. Les chiens doivent être tenus en laisse. Tout feu est
      interdit à Orjaku.
    around: >-
      La [Zone de protection du paysage de Vormsi](/lugar/vormsi-maastikukaitseala/) s'étend à environ
      vingt-trois kilomètres, et la [Réserve naturelle de Kõpu](/lugar/kopu-looduskaitseala/) à environ
      vingt-cinq.
  de:
    intro: >-
      Vor tausend Jahren lagen hier zwei getrennte Eilande: Kassari im Osten und Orjaku im Westen. Vor rund
      fünfhundert Jahren wuchsen sie zusammen. Heute bilden Kassari und die Käina-Bucht ein
      Landschaftsschutzgebiet im Südosten von Hiiumaa: 5652 ha Gesamtfläche, von denen 3189 festes Land
      darstellen, während der Rest aus seichten Brackwasserlagunen, Röhricht und Uferwiesen besteht. Die Bucht
      ist flach, umfasst rund 9 km² bei maximal einem Meter Wassertiefe und wird durch Kassari vom
      Väinameri-Meer abgeschirmt.
    landscape: >-
      Die Insel Kassari ist eine kleine Welt mit rund dreihundert Bewohnern, verteilt auf vier Dörfer:
      Esiküla, Kassari, Orjaku und Taguküla. Ihre Küstenlinie erstreckt sich über 56 km und ist stark
      zerklüftet. Ein eiszeitlicher Oskamm durchzieht das Eiland von Nord nach Süd und erreicht am höchsten
      Punkt 15 Meter über dem Meeresspiegel. Wacholderheiden und Strandwiesen prägen das Bild, ergänzt durch
      Kalkmagerrasen, Laubwiesen und halbnatürliche Küstenweiden.


      Die Bucht bildet ein maritimes Gegenstück: Flachwasser, Inselchen und weite Schilfgürtel.
    wildlife: >-
      Zugvögel bestimmen das Geschehen. Die seichte Käina-Bucht mit ihren Schilfgürteln und Uferfluren ist ein
      zentraler Rastplatz für Wasservögel und Watvögel auf dem Frühjahrs- und Herbstzug, wo sie Schutz und
      Nahrung finden. Deshalb entfaltet das Schutzgebiet in diesen beiden Jahreszeiten seinen größten Reiz.
      Beobachtungstürme bei Silmakare und am Orjaku-Pfad erlauben beste Einblicke in das Rast- und
      Brutgeschehen.


      Am Wegesrand demonstriert eine renaturierte Strandweide die Bedeutung extensiver Beweidung für den
      Erhalt seltener Arten.
    visit: >-
      Beginne deinen Ausflug in Orjaku. Dort erschließen Holzstege und Plattformen die Käina-Bucht, von denen
      zwei schwellenlos mit Kinderwagen oder Rollstuhl erreichbar sind. Der Lehrpfad von Orjaku misst zwischen
      0,7 und 2 km und führt durch vielfältige Feuchtgebiete; das Naturbeobachtungsprogramm beansprucht
      zwischen zwei und drei Stunden.


      Für Kulturinteressierte zeigt das Verwalterhaus des einstigen Gutes Kassari eine Ausstellung des
      Hiiumaa-Museums. Die Bewohner von Kassari nannte man im Volksmund traditionell die „Leute der
      Haseninsel“.
    history: >-
      Kassari wird urkundlich erstmals 1520 erwähnt. Im neunzehnten Jahrhundert entstand der Hafen Orjaku, der
      heute als Yachthafen dient. Botanisch bewahrt das Schutzgebiet die einzige estnische Population von
      Bupleurum tenuissimum sowie ein schutzwürdiges Mosaik halbnatürlicher Wiesenlandschaften.
    before: >-
      In sensiblen Abschnitten der Buchten Käina und Vaemla gelten saisonale Betretungsverbote: Beachte die
      behördlichen Hinweise vor Ort. Hunde sind an der Leine zu führen. In Orjaku ist offenes Feuer verboten.
    around: >-
      Das [Landschaftsschutzgebiet Vormsi](/lugar/vormsi-maastikukaitseala/) liegt etwa dreiundzwanzig
      Kilometer östlich, das [Naturschutzgebiet Kõpu](/lugar/kopu-looduskaitseala/) rund fünfundzwanzig
      Kilometer entfernt.
  it:
    intro: >-
      Mille anni fa sorgevano qui due isole distinte: Kassari a est e Orjaku a ovest. Si unirono circa
      cinquecento anni fa. Oggi Kassari e la baia di Käina costituiscono una riserva paesaggistica nel sudest
      di Hiiumaa: 5652 ha di cui 3189 di terra emersa, con la parte restante formata da specchi salmastri,
      canneti e praterie costiere. La baia è assai poco profonda, estesa per circa 9 km² con un metro di
      profondità massima, separata dal mare di Väinameri dall'isola di Kassari.
    landscape: >-
      L'isola di Kassari è una comunità raccolta di circa trecento residenti distribuiti in quattro villaggi:
      Esiküla, Kassari, Orjaku e Taguküla. La sua linea costiera, sviluppata per oltre 56 km, è fortemente
      articolata. Un esker glaciale l'attraversa da nord a sud toccando 15 metri sul livello del mare nel suo
      punto culminante. Nella vegetazione primeggiano gineprai e pascoli costieri, con alvar, prati alberati e
      praterie seminaturali.


      La baia mostra tutt'altro scenario: acque salmastre poco profonde, isolotti affioranti e fitti canneti.
    wildlife: >-
      I volatili scandiscono le stagioni. La baia di Käina con i suoi bassifondi e i canneti è un sito di
      sosta irrinunciabile per stormi di uccelli acquatici e limicoli durante i passi di primavera e
      d'autunno, richiamati dall'abbondanza di cibo e rifugio. Per questo la riserva si apprezza
      particolarmente in questi due periodi. Torrette d'avvistamento a Silmakare e lungo il sentiero di Orjaku
      permettono di osservare le specie di passo e nidificanti.


      Accanto al tracciato, un pascolo costiero ripristinato racconta l'importanza del pascolo tradizionale
      nel mantenimento della biodiversità.
    visit: >-
      Comincia la visita da Orjaku. Lì troverai una passerella in legno e piattaforme panoramiche affacciate
      sulla baia di Käina, due delle quali accessibili a passeggini e sedie a rotelle. Il sentiero didattico
      di Orjaku si snoda tra 0,7 e 2 km per ammirare l'avifauna di ambienti diversi; il programma di
      avvistamento richiede tra due e tre ore.


      Per arricchire la giornata con la cultura locale, l'antica residenza dell'amministratore della tenuta di
      Kassari ospita una sezione del Museo di Hiiumaa. Gli abitanti di Kassari erano tradizionalmente detti
      «uomini dell'isola delle lepri».
    history: >-
      Kassari è documentata negli archivi sin dal 1520. Nel XIX secolo fu realizzato il porto di Orjaku, oggi
      approdo turistico. Sul fronte ecologico la riserva protegge l'unica popolazione estone superstite di
      Bupleurum tenuissimum e un pregevole mosaico di prati aperti e alberati.
    before: >-
      Si applicano limitazioni stagionali d'accesso nelle baie di Käina e Vaemla: verifica le disposizioni
      dell'ente parco prima della visita. I cani devono essere condotti al guinzaglio. A Orjaku è vietato
      accendere fuochi.
    around: >-
      L'[Area di protezione paesaggistica di Vormsi](/lugar/vormsi-maastikukaitseala/) dista circa ventitré
      chilometri, mentre la [Riserva naturale di Kõpu](/lugar/kopu-looduskaitseala/) si trova a circa
      venticinque chilometri.
  pt:
    intro: >-
      Há mil anos existiam aqui duas ilhas distintas: Kassari a leste e Orjaku a oeste. Uniram-se há cerca de
      quinhentos anos. Hoje Kassari e a baía de Käina integram uma reserva paisagística no sudeste de Hiiumaa:
      5652 ha dos quais 3189 são terra firme, compondo-se o restante de esteiros salobros, caniçais e prados
      litorais. A baía é muito rasa, ocupando cerca de 9 km² com apenas um metro de profundidade máxima,
      protegida do mar de Väinameri por Kassari.
    landscape: >-
      A ilha de Kassari é um pequeno enclave com cerca de trezentos habitantes repartidos por quatro aldeias:
      Esiküla, Kassari, Orjaku e Taguküla. O seu litoral, com mais de 56 km, é bastante recortado. Um esker
      glaciar percorre a ilha de norte a sul atingindo 15 metros de altitude no ponto mais elevado. Zimbros e
      prados costeiros dominam a flora, albergando Kassari prados abertos, prados arborizados e pastagens
      seminaturais.
    wildlife: >-
      As aves orientam o calendário. A baía de Käina, rasa e marginada por caniçais, e o litoral envolvente
      são escala vital para imensas aves aquáticas e limícolas nas migrações de primavera e outono, onde se
      concentram para repousar e procurar alimento. Por isso a reserva brilha sobretudo nestas duas épocas.
      Torres de observação em Silmakare e junto ao trilho de Orjaku facultam excelentes vistas sobre as aves.


      Junto ao trilho, um prado costeiro sujeito a pastoreio tradicional recuperado exemplifica a coexistência
      positiva entre o homem e a biodiversidade.
    visit: >-
      Começa o périplo por Orjaku. Aí encontrarás passadiços de madeira e miradouros sobre a baía de Käina,
      sendo duas das plataformas acessíveis a carrinhos de bebé e cadeiras de rodas. O trilho interpretativo
      de Orjaku tem entre 0,7 e 2 km e percorre diversos habitats; o circuito de observação e identificação
      demora entre duas e três horas.


      Para associar a natureza ao património histórico, a antiga casa senhorial de Kassari expõe uma coleção
      do Museu de Hiiumaa. Os naturais de Kassari eram tradicionalmente chamados de «povo da ilha das lebres».
    history: >-
      Kassari surge documentada desde 1520. No século XIX edificou-se o porto de Orjaku, atualmente marina de
      recreio. Na vertente biológica, a reserva guarda a única população estoniana de Bupleurum tenuissimum e
      uma paisagem seminatural de prados litorais e arvoredo aberto.
    before: >-
      Vigoram restrições sazonais de acesso em zonas das baías de Käina e Vaemla: consulta as diretrizes
      oficiais antes de entrar. Os cães devem andar com trela. Em Orjaku não é permitido acender fogueiras.
    around: >-
      A [Área de Paisagem Protegida de Vormsi](/lugar/vormsi-maastikukaitseala/) dista cerca de vinte e três
      quilómetros, situando-se a [Reserva Natural de Kõpu](/lugar/kopu-looduskaitseala/) a cerca de vinte e
      cinco.
