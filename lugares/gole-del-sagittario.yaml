resumen:
  es: >-
    Impresionante cañón kárstico esculpido por el río Sagittario entre paredes de caliza vertical de сотenas
    de metros.
  en: >-
    An awe-inspiring karst canyon carved by the Sagittario River between vertical limestone cliffs hundreds of
    metres high.
  fr: >-
    Impressionnant canyon karstique façonné par la rivière Sagittario entre des parois de calcaire vertical
    hautes de plusieurs centaines de mètres.
  de: >-
    Eindrucksvolle Karstschlucht des Sagittario-Flusses zwischen steilen Kalksteinwänden von mehreren hundert
    Metern Höhe.
  it: >-
    Impressionante canyon carsico scavato dal fiume Sagittario tra pareti di calcare verticale alte centinaia
    di metri.
  pt: >-
    Impressionante desfiladeiro cársico esculpido pelo rio Sagittario entre escarpas calcárias verticais de
    centenas de metros de altura.
unico:
  es: >-
    Una garganta calcárea de apenas 450 hectáreas donde caben el oso pardo marsicano, el lobo, el treparriscos
    y una flor que no crece en ningún otro valle.
  en: >-
    A limestone gorge spanning barely 450 hectares where the Marsican brown bear, wolf, wallcreeper, and a
    flower found in no other valley all find sanctuary.
  fr: >-
    Une gorge calcaire d'à peine 450 hectares où cohabitent l'ours brun marsicain, le loup, le tichodrome
    échelette et une plante absente de toute autre vallée.
  de: >-
    Eine kaum 450 Hektar große Kalkschlucht, in der Marsischer Braunbär, Wolf, Mauerläufer und eine nur hier
    heimische Pflanze zusammenleben.
  it: >-
    Una gola calcarea di appena 450 ettari dove convivono l'orso bruno marsicano, il lupo, il picchio muraiolo
    e un fiore esclusivo di questa valle.
  pt: >-
    Um desfiladeiro calcário de escassos 450 hectares onde coabitam o urso-pardo-marsicano, o lobo, o
    trepa-fragas e uma planta exclusiva deste vale.
observaciones:
  es: La temporada va de mayo a octubre. La afluencia es media alrededor del lago de Scanno.
texto:
  es:
    intro: >-
      Edward Lear escribió que las rocas a ambos lados del sendero superan toda imaginación. Lo dijo de las
      Gole del Sagittario, y no exageró: en estas gargantas calcáreas el río excavó durante millones de años
      un pasillo profundo entre paredes de piedra, y el pueblo de Castrovalva se asoma desde un espolón de
      roca sobre ellas. Hoy es una reserva natural regional de 450 hectáreas en Abruzzo, en Anversa degli
      Abruzzi, y desde 1991 oasis del WWF. Va desde el fondo de las gargantas, donde corre el río, hasta los
      prados de altura.
    landscape: >-
      La garganta es obra del agua. Las rocas más antiguas que afloran en la reserva tienen unos 200 millones
      de años y las más recientes unos 5 millones; antes de emerger del todo, la zona alternó entre mar
      abierto y costa, con arrecifes de coral. El fondo del valle está a unos 700 metros y las cumbres
      cercanas llegan a los 1500.


      Es pequeña pero variada. Hay seis ambientes: roquedos y pedregales calizos, prados áridos, vegetación de
      manantial, bosque mesófilo de fondo de valle, hayedo y praderas de altura. Abajo, en el valle, crecen
      bosques mixtos con roble pubescente y carpe negro, y encinas arbustivas en las grietas de la roca; por
      encima, sobre todo en la vertiente occidental, se extienden hayedos. En Cavuto, al pie de las gargantas,
      brotan manantiales abundantes. El hábitat ribereño ha mejorado mucho desde que Enel reabrió en 2006 la
      presa de San Domenico y se restableció el caudal del río.


      Los endemismos tienen nombre propio: el aciano del Sagittario (Centaurea scannensis), que vive solo a lo
      largo de este valle y está protegido a escala regional; la violeta de Eugenia, en pastos pedregosos; la
      campanilla de Cavolini, en roquedos calizos; y la efedra de los Nebrodi, un arbusto circunmediterráneo
      considerado un endemismo conservador de la era terciaria, que crece en las paredes más escarpadas del
      valle. En la reserva se han censado 789 entidades vegetales, 54 de ellas endémicas.
    wildlife: >-
      Casi todos los mamíferos del Apenino están presentes. Son fáciles de ver el corzo, el ciervo, el jabalí,
      el tejón, el zorro y el puercoespín, y la liebre italiana da a la reserva un valor extraordinario. El
      [lobo](/especie/canis_lupus/) tiene incluso un núcleo reproductor, y el [oso
      pardo](/especie/ursus_arctos/) marsicano deja cada vez más avistamientos: la reserva ha sido siempre su
      territorio fuera del Parque Nacional de Abruzzo, Lazio y Molise. Las cámaras trampa han confirmado el
      turón y el [gato montés](/especie/felis_silvestris/), y cada vez se ve más el rebeco apenino.


      Entre las aves, el [treparriscos](/especie/tichodroma_muraria/), símbolo de la reserva, es la estrella
      del invierno: es fácil verlo en las rocas y hasta en los muros de las casas de Castrovalva. Anidan el
      [águila real](/especie/aquila_chrysaetos/), el [halcón peregrino](/especie/falco_peregrinus/) y la
      [chova piquirroja](/especie/pyrrhocorax_pyrrhocorax/), y los bosques de frondosas son uno de los últimos
      refugios del [pico dorsiblanco](/especie/dendrocopos_leucotos/), ligado a los hayedos. Entre las aves
      figura también el [mirlo acuático](/especie/cinclus_cinclus/).


      Los anfibios y reptiles son variados: la salamandrina de anteojos, el sapillo pintojo apenino y el
      [cervone](/especie/elaphe_quatuorlineata/). La trucha común domina el río. En primavera y verano, cuando
      la mayoría de las plantas está en flor, es el momento del jardín botánico de las fuentes de Cavuto.
    visit: >-
      Casi todo parte de las fuentes de Cavuto, donde está el centro de visitantes, instalado en un viejo
      molino con paneles didácticos y juegos interactivos. Allí hay también un jardín botánico de interés
      regional, un estanque didáctico, una zona de pícnic y una estación de anillamiento de aves. El oasis
      está abierto todo el año.


      La red de senderos suma unos 30 km y sube desde los 500 m de Cavuto hasta los 1500 m. El sendero 15
      sigue el río Sagittario desde las fuentes de Cavuto hasta el Ponte delle fornaci. El sendero 16 sube
      desde Castrovalva, un pueblo encaramado en un espolón de roca sobre las sinuosas gargantas, hasta Fonte
      Celidonia, L’Immacolata y Frattura Vecchia (1128 m). Un itinerario circular sale de Anversa degli
      Abruzzi por el Monte Miglio (1711 m) y la Bocca Mezzana hasta el Monte Mezzana (1791 m).


      La visita guiada del oasis de las fuentes de Cavuto es un recorrido sencillo y llano de unas dos horas
      por la reserva y el río Sagittario, con posibilidad de talleres. Los senderos también se pueden recorrer
      por cuenta propia.
    history: >-
      La reserva nació de un empeño local. En los primeros años noventa, el municipio de Anversa degli Abruzzi
      y sus vecinos quisieron proteger las gargantas: en 1991, con voluntarios del WWF, nació el Oasis WWF, y
      en 1997 se reconoció como Reserva Natural Regional por ley regional. Su posición entre el Parque
      Nacional de la Majella, el de Abruzzo, Lazio y Molise y el Parque Regional Sirente Velino la hace clave
      para la conectividad de la biodiversidad apenina.


      La reserva está reconocida como Parque Literario «D’Annunzio» y acoge jóvenes europeos del programa
      Erasmus Plus de voluntariado, que colaboran en muchas actividades del oasis. Los estudios han
      descubierto en las fuentes de Cavuto un «fósil viviente» y una especie nueva para la ciencia entre los
      macroinvertebrados.
    before: La temporada va de mayo a octubre. La afluencia es media alrededor del lago de Scanno.
    around: >-
      A solo 3 km queda el [Parque Nacional de Abruzzo, Lazio y
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/); a 15 km, el [Parque Nacional de la
      Majella](/lugar/parco-nazionale-della-majella/); a veintiún kilómetros, las [Gole di
      Celano](/lugar/gole-di-celano/) y a veinticuatro, el [Parque Nacional del Gran Sasso y Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/).


      Más lejos, otros desfiladeros comparten el mirlo acuático y el lobo con Sagittario: el [NPR Kvačianska a
      Prosiecka dolina](/lugar/npr-kvacianska-a-prosiecka-dolina/), el [Acheron River Wild Upper
      Gorge](/lugar/acheron-river-wild-upper-gorge/), el [Národný park Slovenský
      raj](/lugar/narodny-park-slovensky-raj/) y el [Parcul Național
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/); todos menos el Acheron comparten además el oso
      pardo.
  en:
    intro: >-
      Edward Lear wrote that the towering crags on either side of the mountain path surpassed all imagination.
      He was describing the Gole del Sagittario, and he did not exaggerate: within these limestone gorges the
      river has cut a dramatic, deep chasm through stone over millions of years, overlooked by the village of
      Castrovalva perched on a sheer rocky buttress above. Today it forms a 450-hectare regional nature
      reserve in Abruzzo, based in Anversa degli Abruzzi, managed as a WWF Oasis since 1991. The reserve
      encompasses everything from the shaded canyon floor where the torrent rushes up to the alpine crests.
    landscape: >-
      The gorge is the handiwork of water. The oldest rock formations outcropping within the reserve date back
      some 200 million years, while the youngest are about 5 million years old; before full tectonic
      emergence, the region alternated between open sea and shallow reefs. The canyon floor sits around 700
      metres, with adjacent summits soaring to 1500 metres.


      Though compact, its ecological richness is extraordinary. Six distinct habitat zones occur: limestone
      crags and screes, arid grasslands, spring wetlands, cool mesophilic canyon floor woodland, beech forest,
      and high-altitude grasslands. Down in the shaded valley grow mixed stands of downy oak and European hop
      hornbeam, with stunted holm oaks wedged into rock fissures; higher up, particularly across west-facing
      slopes, mature beechwoods take over. At Cavuto, at the canyon mouth, abundant karstic springs surge
      forth. Riverine habitats have revived markedly since Enel restored downstream environmental flows from
      the San Domenico dam in 2006.


      Endemic plants give the gorge global renown: the Sagittario cornflower (Centaurea scannensis), which
      lives exclusively along this valley under regional protection; Eugenia's violet in rocky pastures;
      Cavolini's bellflower on limestone faces; and the Nebrodi jointfir, an archaic Tertiary shrub clinging
      to the steepest vertical walls. In total, 789 plant taxa have been inventoried within the reserve, 54 of
      which are endemic.
    wildlife: >-
      Almost the entire mammalian fauna of the central Apennines is represented here. Roe deer, red deer, wild
      boar, badger, red fox, and crested porcupine are frequently observed, while the Italian hare confers
      exceptional conservation value. The [grey wolf](/especie/canis_lupus/) maintains an active breeding
      pack, and the Marsican [brown bear](/especie/ursus_arctos/) generates increasingly frequent sightings:
      the gorge has historically functioned as a vital ecological corridor beyond the borders of Abruzzo,
      Lazio and Molise National Park. Camera traps have documented European polecat and [European
      wildcat](/especie/felis_silvestris/), alongside a recovering population of Apennine chamois.


      Among birds, the [wallcreeper](/especie/tichodroma_muraria/), emblem of the reserve, is the celebrated
      star of winter: it is easily seen foraging along crags and even flitting across house walls in
      Castrovalva. The [golden eagle](/especie/aquila_chrysaetos/), [peregrine
      falcon](/especie/falco_peregrinus/), and [red-billed chough](/especie/pyrrhocorax_pyrrhocorax/) nest in
      the cliffs, while deep beech woodlands provide a crucial haven for the [white-backed
      woodpecker](/especie/dendrocopos_leucotos/). The mountain torrent supports the [white-throated
      dipper](/especie/cinclus_cinclus/).


      Herpetofauna is equally varied: spectacled salamander, Apennine yellow-bellied toad, and the [four-lined
      snake](/especie/elaphe_quatuorlineata/). Wild brown trout thrive in the torrent. In spring and summer,
      when wild flora reaches peak flowering, the botanical garden at Cavuto springs offers prime visits.
    visit: >-
      Almost all explorations begin from the Cavuto springs visitor centre, located within a restored
      watermill with interpretive panels and educational exhibits. The complex includes a regional botanical
      garden, an educational pond, a shaded picnic ground, and a bird ringing station. The oasis remains
      accessible year-round.


      The trail network covers around 30 km, climbing from 500 m at Cavuto to 1500 m. Trail 15 follows the
      Sagittario River from Cavuto springs to Ponte delle fornaci. Trail 16 ascends from Castrovalva, clinging
      to its rocky spur above the gorge, up towards Fonte Celidonia, L'Immacolata, and Frattura Vecchia (1128
      m). A circular itinerary sets off from Anversa degli Abruzzi over Monte Miglio (1711 m) and Bocca
      Mezzana to Monte Mezzana (1791 m).


      The guided tour of the Cavuto springs oasis is an easy, level stroll of about two hours exploring the
      reserve and river, with workshops available. All paths can also be explored independently.
    history: >-
      The reserve was born from fierce local commitment. In the early nineties, the municipality of Anversa
      degli Abruzzi and local residents campaigned to save the gorge: in 1991, with WWF volunteers, the WWF
      Oasis was founded, and in 1997 it achieved formal status as a Regional Nature Reserve by regional law.
      Its strategic geographic position between Majella National Park, Abruzzo, Lazio and Molise National
      Park, and Sirente-Velino Regional Park makes it essential for Apennine ecological connectivity.


      The reserve is recognized as a D'Annunzio Literary Park and hosts European Erasmus Plus volunteers
      assisting in educational and conservation duties. Scientific studies at Cavuto springs have uncovered a
      living fossil and a macroinvertebrate species previously unknown to science.
    before: The best season runs from May to October. Visitor numbers are moderate around Lake Scanno.
    around: >-
      Just 3 km away lies [Abruzzo, Lazio and Molise National
      Park](/lugar/parco-nazionale-d-abruzzo-lazio-e/); 15 km away is [Majella National
      Park](/lugar/parco-nazionale-della-majella/); twenty-one kilometres distant lie the [Celano
      Gorges](/lugar/gole-di-celano/), and twenty-four kilometres away is [Gran Sasso and Monti della Laga
      National Park](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/).


      Further away, other rocky ravines share the dipper and wolf: [Kvačianska and Prosiecka
      Valleys](/lugar/npr-kvacianska-a-prosiecka-dolina/), [Acheron River Wild Upper
      Gorge](/lugar/acheron-river-wild-upper-gorge/), [Slovenský Raj National
      Park](/lugar/narodny-park-slovensky-raj/), and [Cozia National
      Park](/lugar/parcul-national-cozia---codrii-seculari/); all except the Acheron also share the brown
      bear.
  fr:
    intro: >-
      Edward Lear écrivit que les falaises bordant le sentier dépassaient toute imagination. Il parlait des
      Gole del Sagittario, et n'exagérait nullement : dans ces gorges calcaires, le cours d'eau a taillé
      durant des millénaires une profonde faille entre des parois rocheuses vertigineuses, dominées par le
      village de Castrovalva perché sur un éperon rocheux. C'est aujourd'hui une réserve naturelle régionale
      de 450 hectares dans les Abruzzes, à Anversa degli Abruzzi, gérée depuis 1991 comme oasis du WWF. Elle
      s'étage depuis le fond du défilé jusqu'aux pelouses sommitales.
    landscape: >-
      La gorge est l'œuvre exclusive de l'eau. Les roches les plus anciennes affleurant dans la réserve
      remontent à 200 millions d'années et les plus récentes à 5 millions ; avant d'émerger, la zone alternait
      entre haute mer et lagons coralliens. Le fond de vallée se situe vers 700 mètres et les crêtes
      avoisinantes atteignent 1500 mètres.


      Ce défilé est resserré mais d'une grande variété. On y distingue six milieux : rochers calcaires,
      pelouses arides, sources karstiques, forêts fraîches de fond de gorge, hêtraies et prairies d'altitude.
      En bas s'épanouissent chêne pubescent et charme-houblon, avec des chênes verts nains ancrés dans les
      failles ; plus haut, surtout sur le versant ouest, s'étendent de belles hêtraies. À Cavuto jaillissent
      de puissantes résurgences. Les ripisylves ont retrouvé leur vigueur depuis qu'Enel a rétabli en 2006 le
      débit réservé depuis le barrage de San Domenico.


      Les endémismes végétaux font la fierté des lieux : la centaurée du Sagittario (Centaurea scannensis),
      exclusive de cette vallée et protégée au niveau régional ; la pensée d'Eugénie dans les éboulis ; la
      campanule de Cavolini dans les fissures calcaires ; et l'éphédra des Nébrodes, arbuste relique du
      Tertiaire sur les parois abruptes. La réserve totalise 789 taxons végétaux, dont 54 endémiques.
    wildlife: >-
      Presque tous les mammifères des Apennins fréquentent la gorge. On observe facilement chevreuil, cerf,
      sanglier, blaireau, renard et porc-épic, tandis que le lièvre italique confère au site une valeur
      faunistique insigne. Le [loup d'Italie](/especie/canis_lupus/) y possède un noyau reproducteur, et
      l'[ours brun](/especie/ursus_arctos/) marsicain y est régulièrement repéré : la réserve forme un
      corridor écologique historique en dehors du parc national des Abruzzes, du Latium et du Molise. Les
      pièges photographiques attestent le putois et le [chat forestier](/especie/felis_silvestris/), avec des
      apparitions croissantes du chamois des Apennins.


      Parmi les oiseaux, le [tichodrome échelette](/especie/tichodroma_muraria/), emblème de la réserve, est
      l'hôte vedette en hiver : il s'observe sur les falaises et jusque sur les murs de pierre de Castrovalva.
      Y nichent l'[aigle royal](/especie/aquila_chrysaetos/), le [faucon pèlerin](/especie/falco_peregrinus/)
      et le [grave à bec rouge](/especie/pyrrhocorax_pyrrhocorax/), tandis que les hêtraies abritent le rare
      [pic à dos blanc](/especie/dendrocopos_leucotos/). Le torrent accueille également le [cincle
      plongeur](/especie/cinclus_cinclus/).


      Batraciens et reptiles comptent la salamandrine à lunettes, le sonneur d'Apennin et la [couleuvre à
      quatre raies](/especie/elaphe_quatuorlineata/). La truite fario peuple la rivière. Au printemps et en
      été, le jardin botanique des sources de Cavuto déploie toute sa floraison.
    visit: >-
      La plupart des excursions partent des sources de Cavuto où est établi le centre d'accueil, logé dans un
      ancien moulin à eau doté de maquettes et d'outils interactifs. On y trouve un jardin botanique régional,
      une mare pédagogique, une aire de pique-nique et une station de baguage ornithologique. L'oasis reste
      ouverte toute l'année.


      Le réseau de sentiers cumule 30 km et grimpe de 500 m à Cavuto jusqu'à 1500 m. Le sentier 15 longe le
      Sagittario depuis les sources de Cavuto jusqu'au Ponte delle fornaci. Le sentier 16 monte depuis
      Castrovalva, perché sur son éperon, vers Fonte Celidonia, L’Immacolata et Frattura Vecchia (1128 m). Un
      parcours en boucle part d'Anversa degli Abruzzi par le Monte Miglio (1711 m) et Bocca Mezzana jusqu'au
      Monte Mezzana (1791 m).


      La visite guidée de l'oasis de Cavuto est un parcours aisé d'environ deux heures le long de la rivière,
      avec ateliers pédagogiques possibles. Tous les sentiers se parcourent aussi en liberté.
    history: >-
      La réserve est le fruit d'une mobilisation citoyenne exemplaire. Au début des années quatre-vingt-dix,
      la commune d'Anversa degli Abruzzi et ses habitants voulurent préserver les gorges : en 1991 naquit
      l'Oasis WWF, et en 1997 le site fut classé réserve naturelle régionale par loi des Abruzzes. Sa position
      charnière entre le parc national de la Majella, celui des Abruzzes et le parc naturel Sirente-Velino
      assure la continuité écologique apennine.


      Le site est reconnu comme Parc Littéraire Gabriele D'Annunzio et accueille des volontaires européens du
      programme Erasmus Plus. Des études menées aux sources de Cavuto y ont mis au jour un fossile vivant
      ainsi qu'une espèce de macro-invertébré nouvelle pour la science.
    before: La période favorable s'étend de mai à octobre. La fréquentation est modérée autour du lac de Scanno.
    around: >-
      À seulement 3 km se trouve le [Parc national des Abruzzes, du Latium et du
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/) ; à 15 km, le [Parc national de la
      Majella](/lugar/parco-nazionale-della-majella/) ; à vingt-et-un kilomètres, les [Gorges de
      Celano](/lugar/gole-di-celano/) et à vingt-quatre kilomètres, le [Parc national du Gran Sasso et des
      Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/).


      Plus loin, d'autres défilés partagent cincle et loup : les [Gorges de Kvačianska et
      Prosiecka](/lugar/npr-kvacianska-a-prosiecka-dolina/), les [Gorges sauvages de
      l'Achéron](/lugar/acheron-river-wild-upper-gorge/), le [Parc national du Paradis
      slovaque](/lugar/narodny-park-slovensky-raj/) et le [Parc national
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/) ; tous sauf l'Achéron partagent aussi l'ours
      brun.
  de:
    intro: >-
      Edward Lear notierte einst, dass die Felswände zu beiden Seiten des Pfades jede Vorstellungskraft
      überstiegen. Er beschrieb die Gole del Sagittario, und er übertrieb nicht: In diesem Kalksteincanyon
      schnitt der Fluss über Jahrmillionen einen tiefen Korridor zwischen steile Felsabstürze, überragt vom
      Bergdorf Castrovalva auf einem schmalen Felssporn. Heute bildet das Areal ein 450 Hektar großes
      regionales Naturschutzgebiet in den Abruzzen bei Anversa degli Abruzzi, seit 1991 WWF-Oase. Es reicht
      vom kühlen Schluchtgrund am Fluss bis hinauf zu den Hochweiden.
    landscape: >-
      Die Schlucht ist das Werk des Wassers. Die ältesten aufgeschlossenen Gesteine der Reserve sind etwa 200
      Millionen Jahre alt, die jüngsten rund 5 Millionen Jahre; vor der Hebung wechselte die Region zwischen
      offenem Meer und Riffzonen. Der Talgrund liegt auf etwa 700 Metern, während die umgebenden Bergkämme
      1500 Meter erreichen.


      Das Gebiet ist kompakt, aber außergewöhnlich reich gegliedert. Man unterscheidet sechs Lebensräume:
      Kalkfelsen und Schutthalden, Trockenrasen, Quellbiotope, feuchte Schluchtwälder, Bergmischwälder und
      alpine Matten. Unten im Tal gedeihen Flaumeiche und Hopfenbuche, mit verkrüppelten Steineichen in
      Felsritzen; darüber breiten sich an den Westflanken ausgedehnte Buchenwälder aus. Bei Cavuto treten
      ergiebige Karstquellen zutage. Der Auwaldcharakter hat sich deutlich erholt, seit Enel 2006 die
      Mindestwasserabgabe aus dem Stausee San Domenico wiederhergestellt hat.


      Botanische Endemiten prägen die Schlucht: die Sagittario-Flockenblume (Centaurea scannensis), die
      ausschließlich in diesem Tal wächst und regional geschützt ist; das Eugenien-Veilchen auf Geröllfeldern;
      die Cavolini-Glockenblume an Felswänden; und das Nebrodi-Meerträubel, ein Reliktstrauch des Tertiärs an
      steilsten Felsabstürzen. Insgesamt sind 789 Pflanzenarten erfasst, davon 54 Endemiten.
    wildlife: >-
      Fast die gesamte Säugetierfauna des Apennins ist heimisch. Reh, Rothirsch, Wildschwein, Dachs, Rotfuchs
      und Stachelschwein lassen sich regelmäßig beobachten, während der Italienische Hase besonderen
      Seltenheitswert besitzt. Der [Wolf](/especie/canis_lupus/) verfügt über ein festes Rudel, und der
      Marsische [Braunbär](/especie/ursus_arctos/) wird immer häufiger nachgewiesen: Die Schlucht fungiert
      seit jeher als biologischer Wanderkorridor außerhalb des Nationalparks Abruzzen, Latium und Molise.
      Fotofallen belegen Iltis und [Wildkatze](/especie/felis_silvestris/), begleitet von der Rückkehr der
      Apennin-Gämse.


      Unter den Vögeln ist der [Mauerläufer](/especie/tichodroma_muraria/), das Wappentier des Schutzgebiets,
      der Star des Winters: Er klettert an Felswänden und an den Mauern von Castrovalva umher. Es brüten
      [Steinadler](/especie/aquila_chrysaetos/), [Wanderfalke](/especie/falco_peregrinus/) und
      [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/), während die Bergwälder Rückzugsraum für den
      [Weißrückenspecht](/especie/dendrocopos_leucotos/) bieten. Am Gebirgsbach lebt die
      [Wasseramsel](/especie/cinclus_cinclus/).


      Reptilien und Lurche zeigen Vielfalt: Brillensalamander, Apennin-Gelbbauchunke und die
      [Vierstreifennatter](/especie/elaphe_quatuorlineata/). Bachforellen beherrschen den Fluss. Im Frühjahr
      und Sommer lohnt der Besuch des Botanischen Gartens an den Quellen von Cavuto.
    visit: >-
      Zentrum der Aktivitäten sind die Quellen von Cavuto mit dem Besucherzentrum in einer alten Wassermühle.
      Dort befinden sich ein regionaler Botanischer Garten, ein Lehrteich, ein Picknickbereich und eine
      Vogelberingungsstation. Die Oase ist ganzjährig zugänglich.


      Das Wegenetz umfasst rund 30 km und steigt von 500 m bei Cavuto bis auf 1500 m an. Weg 15 folgt dem
      Sagittario von Cavuto bis zum Ponte delle fornaci. Weg 16 steigt von Castrovalva zur Quelle Fonte
      Celidonia, L'Immacolata und Frattura Vecchia (1128 m) auf. Eine Rundtour führt von Anversa degli Abruzzi
      über den Monte Miglio (1711 m) und Bocca Mezzana zum Monte Mezzana (1791 m).


      Die Führung an den Quellen von Cavuto ist ein einfacher, flacher Spaziergang von etwa zwei Stunden am
      Fluss mit Workshop-Angeboten. Alle Wanderwege können auch auf eigene Faust begangen werden.
    history: >-
      Das Reservat entstand aus bürgerschaftlichem Engagement. Anfang der neunziger Jahre setzten sich
      Gemeinde und Bewohner für den Schutz der Schlucht ein: 1991 entstand mit WWF-Ehrenamtlichen die
      WWF-Oase, 1997 folgte die Anerkennung als Regionales Naturschutzgebiet per Gesetz. Die Lage zwischen
      Majella-Nationalpark, Nationalpark Abruzzen und Regionalpark Sirente-Velino macht es zum Kerngebiet des
      Biotopverbunds.


      Das Schutzgebiet ist als Literaturpark Gabriele D'Annunzio anerkannt und betreut europäische
      Erasmus-Plus-Freiwillige. An den Quellen von Cavuto entdeckten Forscher ein lebendes Fossil und eine
      neue Makroinvertebraten-Art.
    before: Die beste Besuchszeit liegt zwischen Mai und Oktober. Mäßiger Andrang herrscht am nahen Lago di Scanno.
    around: >-
      Nur 3 km entfernt liegt der [Nationalpark Abruzzen, Latium und
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/); 15 km entfernt der [Nationalpark
      Majella](/lugar/parco-nazionale-della-majella/); einundzwanzig Kilometer die [Gole di
      Celano](/lugar/gole-di-celano/) und vierundzwanzig Kilometer der [Nationalpark Gran Sasso und Monti
      della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/).


      Weiter entfernt teilen andere Schluchten Wasseramsel und Wolf: das [Kvačianska- und
      Prosiecka-Tal](/lugar/npr-kvacianska-a-prosiecka-dolina/), die
      [Acheron-Schlucht](/lugar/acheron-river-wild-upper-gorge/), der [Nationalpark Slowakisches
      Paradies](/lugar/narodny-park-slovensky-raj/) und der [Nationalpark
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/); alle außer dem Acheron beherbergen zudem den
      Braunbären.
  it:
    intro: >-
      Edward Lear scrisse che le rupi da ambo i lati del sentiero superavano qualsiasi immaginazione. Si
      riferiva alle Gole del Sagittario, e non esagerava: in queste gole calcaree il fiume ha scavato per
      millenni una forra profonda fra pareti scoscese, su cui si affaccia Castrovalva aggrappata a uno sperone
      di roccia. Oggi è una riserva naturale regionale di 450 ettari in Abruzzo, nel comune di Anversa degli
      Abruzzi, oasi WWF dal 1991. Si sviluppa dal fondo della forra percorso dal torrente fino ai pascoli
      montani.
    landscape: >-
      La gola è interamente scolpita dall'azione dell'acqua. Le formazioni più antiche affioranti nella
      riserva contano circa 200 milioni di anni e le più recenti 5 milioni; prima di emergere, il territorio
      oscillò tra mare aperto e scogliere coralline. Il fondovalle sorge a circa 700 metri e le cime contigue
      toccano i 1500.


      È uno spazio raccolto ma straordinariamente vario. Si riconoscono sei ambienti: pareti rocciose,
      macereti calcarei, praterie aride, sorgenti, boschi mesofili di fondovalle, faggete e pascoli
      d'altitudine. In basso crescono boschi misti con roverella e carpino nero, e lecci rupicoli abbarbicati
      nelle fenditure; più in alto, specie sul versante occidentale, dominano le faggete. A Cavuto
      scaturiscono sorgenti copiose. L'habitat ripariale si è rigenerato da quando Enel ha ripristinato nel
      2006 il deflusso minimo vitale a valle della diga di San Domenico.


      Gli endemismi botanici sono il fiore all'occhiello: il fiordaliso del Sagittario (Centaurea scannensis),
      specie esclusiva della forra e protetta a livello regionale; la viola di Eugenia sui pascoli sassosi; la
      campanula di Cavolini sulle falesie; e l'efedra dei Nebrodi, arbusto relitto del Terziario che popola i
      salti verticali. Si contano 789 entità vegetali censite, di cui 54 endemiche.
    wildlife: >-
      Quasi tutti i mammiferi appenninici sono presenti. Si avvistano regolarmente capriolo, cervo, cinghiale,
      tasso, volpe e istrice, mentre la lepre italica conferisce un pregio faunistico singolare. Il [lupo
      appenninico](/especie/canis_lupus/) vanta un branco stabile e l'[orso bruno](/especie/ursus_arctos/)
      marsicano fa registrare continue segnalazioni: la riserva costituisce da sempre un corridoio vitale
      esterno al Parco Nazionale d'Abruzzo, Lazio e Molise. Il fototrappolaggio attesta la puzzola e il [gatto
      selvatico](/especie/felis_silvestris/), con osservazioni crescenti di camoscio appenninico.


      Tra i volatili, il [picchio muraiolo](/especie/tichodroma_muraria/), simbolo della riserva, è la star
      invernale: volteggia sulle rocce e sui muri delle case di Castrovalva. Nidificano l'[aquila
      reale](/especie/aquila_chrysaetos/), il [falco pellegrino](/especie/falco_peregrinus/) e il [gracchio
      corallino](/especie/pyrrhocorax_pyrrhocorax/), mentre i boschi ospitano il raro [picchio
      dorsobianco](/especie/dendrocopos_leucotos/). Lungo il torrente vive il [merlo
      acquaiolo](/especie/cinclus_cinclus/).


      Ricca l'erpetofauna: salamandrina dagli occhiali, ululone appenninico e
      [cervone](/especie/elaphe_quatuorlineata/). La trota fario domina le correnti. In primavera e in estate
      il giardino botanico delle sorgenti di Cavuto regala il massimo splendore.
    visit: >-
      Il punto di partenza è alle sorgenti di Cavuto con il centro visite allestito in un antico mulino ad
      acqua. L'area accoglie un giardino botanico regionale, uno stagno didattico, un'area picnic e una
      stazione di inanellamento. L'oasi è aperta tutto l'anno.


      La rete dei sentieri copre circa 30 km risalendo dai 500 m di Cavuto fino ai 1500 m. Il sentiero 15
      segue il corso del Sagittario dalle sorgenti fino al Ponte delle fornaci. Il sentiero 16 sale da
      Castrovalva, aggrappata al suo poggio roccioso, verso Fonte Celidonia, L’Immacolata e Frattura Vecchia
      (1128 m). Un circuito sale da Anversa degli Abruzzi per Monte Miglio (1711 m) e Bocca Mezzana fino a
      Monte Mezzana (1791 m).


      La visita guidata dell'oasi di Cavuto è una passeggiata agevole di circa due ore sul fondovalle fluviale
      con possibilità di laboratori. Tutti i sentieri sono liberamente percorribili in autonomia.
    history: >-
      La riserva è nata da una tenace iniziativa civica. Nei primi anni novanta la comunità di Anversa degli
      Abruzzi scelse di salvaguardare le gole: nel 1991 nacque l'Oasi WWF e nel 1997 l'area fu istituita come
      Riserva Naturale Regionale con legge dedicata. La collocazione fra il Parco Nazionale della Majella, il
      Parco d'Abruzzo e il Parco Sirente-Velino ne fa un tassello primario della rete ecologica.


      L'area è riconosciuta Parco Letterario Gabriele D'Annunzio e accoglie volontari europei del programma
      Erasmus Plus. Gli studi alle sorgenti di Cavuto hanno rinvenuto un fossile vivente e una specie di
      macroinvertebrato nuova per la scienza.
    before: La stagione consigliata va da maggio a ottobre. L'affluenza è moderata nei pressi del Lago di Scanno.
    around: >-
      A soli 3 km sorge il [Parco Nazionale d'Abruzzo, Lazio e
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/); a 15 km il [Parco Nazionale della
      Majella](/lugar/parco-nazionale-della-majella/); a ventuno chilometri le [Gole di
      Celano](/lugar/gole-di-celano/) e a ventiquattro il [Parco Nazionale del Gran Sasso e Monti della
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/).


      Più lontane, altre forre condividono merlo acquaiolo e lupo: le [Valli di Kvačianska e
      Prosiecka](/lugar/npr-kvacianska-a-prosiecka-dolina/), le [Gole
      dell'Acheronte](/lugar/acheron-river-wild-upper-gorge/), il [Parco nazionale del Paradiso
      Slovacco](/lugar/narodny-park-slovensky-raj/) e il [Parco nazionale di
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/); tutte tranne l'Acheronte ospitano anche l'orso
      bruno.
  pt:
    intro: >-
      Edward Lear escreveu que as escarpas em ambos os lados do trilho desafiavam toda a imaginação.
      Referia-se às Gole del Sagittario, e não exagerou: nestas gargantas calcárias o rio escavou ao longo de
      milénios um corredor profundo entre paredes abruptas, com a aldeia de Castrovalva debruçada sobre um
      esporão rochoso. Trata-se hoje de uma reserva natural regional de 450 hectares em Abruzzo, em Anversa
      degli Abruzzi, oásis WWF desde 1991. Desenvolve-se desde o fundo da ravina banhada pelo rio até aos
      pastos cimeiros.
    landscape: >-
      O desfiladeiro resultou exclusivamente da erosão hídrica. As rochas mais antigas expostas na reserva
      datam de há 200 milhões de anos e as mais recentes de há 5 milhões; antes de emergir, a zona alternava
      entre mar aberto e recifes coralíferos. O fundo do vale situa-se a cerca de 700 metros e as cristas
      circundantes tocam os 1500.


      É um território compacto mas extraordinariamente diversificado. Reconhecem-se seis biótopos: rochedos
      calcários, cascalheiras, prados secos, nascentes límpidas, bosques mesófilos de ravina, favais e
      pastagens de altitude. Em baixo surgem carvalho-negral e carpe-negro, com azinheiras anãs cravadas nas
      fendas; mais acima, sobretudo na vertente poente, dominam os favais. Em Cavuto jorram nascentes
      abundantes. O ecossistema ripícola recuperou vigor desde que a Enel restabeleceu em 2006 o caudal
      ecológico a jusante da barragem de San Domenico.


      Os endemismos vegetais dão prestígio internacional ao desfiladeiro: a centáurea-do-sagittario (Centaurea
      scannensis), exclusiva deste vale e estritamente protegida; o amor-perfeito de Eugénia nos prados
      pedregosos; a campânula de Cavolini nos rochedos; e a efedra-de-nebrodi, arbusto relíquia do Terciário
      que coloniza os paredões verticais. A reserva lista 789 espécies vegetais, 54 das quais endémicas.
    wildlife: >-
      Quase todos os mamíferos dos Apeninos habitam a reserva. O corço, o veado, o javali, o texugo, a raposa
      e o porco-espinho são de observação regular, enquanto a lebre-itálica possui valor conservacionista
      singular. O [lobo-ibérico](/especie/canis_lupus/) conta com uma alcateia reprodutora e o
      [urso-pardo](/especie/ursus_arctos/) marsicano regista passagens frequentes: a garganta sempre funcionou
      como corredor faunístico fora do Parque Nacional de Abruzzo, Lazio e Molise. Armadilhas fotográficas
      confirmam o toirão e o [gato-bravo](/especie/felis_silvestris/), com avistamentos crescentes do
      camurça-dos-apeninos.


      Nas aves, o [trepa-fragas](/especie/tichodroma_muraria/), símbolo da reserva, é a atração do inverno:
      vagueia pelas escarpas e pelas paredes de pedra de Castrovalva. Nidificam a
      [águia-real](/especie/aquila_chrysaetos/), o [falcão-peregrino](/especie/falco_peregrinus/) e o
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/), enquanto os bosques dão refúgio ao
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/). No rio vive o
      [melro-d'água](/especie/cinclus_cinclus/).


      Anfíbios e répteis são ricos: salamandrina-de-óculos, sapo-de-ventre-amarelo e a
      [cobra-de-quatro-riscas](/especie/elaphe_quatuorlineata/). A truta-fario domina a corrente. Na primavera
      e no verão o jardim botânico das nascentes de Cavuto atinge esplendor.
    visit: >-
      O itinerário arranca nas nascentes de Cavuto, onde funciona o centro de acolhimento instalado num moinho
      de água histórico com painéis e módulos interativos. O complexo inclui um jardim botânico regional, um
      charco pedagógico, parque de merendas e estação de anilhagem. O oásis permanece aberto todo o ano.


      A rede de percursos pedestres totaliza 30 km e sobe dos 500 m de Cavuto até aos 1500 m. O trilho 15
      acompanha o rio Sagittario desde Cavuto até à Ponte delle fornaci. O trilho 16 sobe de Castrovalva,
      empoleirada no penedo, rumo a Fonte Celidonia, L’Immacolata e Frattura Vecchia (1128 m). Um circuito
      circular parte de Anversa degli Abruzzi pelo Monte Miglio (1711 m) e Bocca Mezzana até ao Monte Mezzana
      (1791 m).


      A visita guiada ao oásis de Cavuto é um passeio fácil e plano de cerca de duas horas ao longo do rio,
      com ateliês disponíveis. Todos os percursos podem ser realizados de forma autónoma.
    history: >-
      A reserva resultou de uma persistente mobilização cívica. No início dos anos noventa o município e a
      população uniram-se para proteger o desfiladeiro: em 1991 nasceu o Oásis WWF e em 1997 a área foi
      reconhecida como Reserva Natural Regional por lei. A sua posição articulada entre o Parque Nacional da
      Majella, o Parque de Abruzzo e o Parque Sirente-Velino assegura a conectividade ecológica dos Apeninos.


      O espaço integra o Parque Literário Gabriele D'Annunzio e recebe voluntários europeus do programa
      Erasmus Plus. Investigações científicas nas nascentes de Cavuto descobriram um fóssil vivo e uma nova
      espécie de macroinvertebrado.
    before: A época recomendada decorre de maio a outubro. O afluxo é moderado nas margens do Lago de Scanno.
    around: >-
      Apenas a 3 km fica o [Parque Nacional de Abruzzo, Lazio e
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/); a 15 km o [Parque Nacional da
      Majella](/lugar/parco-nazionale-della-majella/); a vinte e um quilómetros as [Gargantas de
      Celano](/lugar/gole-di-celano/) e a vinte e quatro o [Parque Nacional do Gran Sasso e Montes da
      Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/).


      Mais distantes, outros canhões partilham melro-d'água e lobo: o [Desfiladeiro de Kvačianska e
      Prosiecka](/lugar/npr-kvacianska-a-prosiecka-dolina/), as [Gargantas Selvagens do Rio
      Aqueronte](/lugar/acheron-river-wild-upper-gorge/), o [Parque Nacional do Paraíso
      Eslovaco](/lugar/narodny-park-slovensky-raj/) e o [Parque Nacional de
      Cozia](/lugar/parcul-national-cozia---codrii-seculari/); todos exceto o Aqueronte acolhem igualmente o
      urso-pardo.
