resumen:
  es: La contrapartida húngara del lago Neusiedl y las estepas turbosas de Hanság.
  en: >-
    The Hungarian freshwater counterpart of Lake Neusiedl, preserving the peat bogs, alder carrs, and restored
    wetlands of Hanság.
  fr: >-
    Le pendant hongrois d’eau douce du lac de Neusiedl, protégeant les tourbières, les aulnaies marécageuses
    et les marais restaurés du Hanság.
  de: >-
    Ungarisches Süßwasser-Gegenstück des Neusiedler Sees mit den wiedervernässten Moor- und Niedermoorgebieten
    des Hanság.
  it: >-
    La controparte ungherese d’acqua dolce del lago di Neusiedl, che tutela le torbiere, gli ontaneti e le
    paludi ripristinate di Hanság.
  pt: >-
    A contraparte húngara de água doce do lago de Neusiedl, protegendo as turfeiras, amiais e pauis
    restaurados de Hanság.
unico:
  es: >-
    Un pantano turboso de agua dulce que se secó casi por completo y al que, tras abrirle de nuevo el agua,
    regresaron el pigargo europeo, el halcón sacre y una colonia de más de mil parejas de gaviota reidora.
  en: >-
    A vast freshwater peatland drained nearly to extinction where re-flooding has welcomed back white-tailed
    eagles, saker falcons, and over a thousand breeding gulls.
  fr: >-
    Un marais tourbeux d’eau douce jadis presque entièrement asséché où la remise en eau a ramené pygargue,
    faucon sacre et mille mouettes rieuses.
  de: >-
    Ein Süßwasserniedermoor, das fast trockenfiel und nach Wiedervernässung Seeadler, Sakerfalke und über
    tausend Lachmöwenpaare zurückholte.
  it: >-
    Una palude torbosa d’acqua dolce quasi estinta dalle bonifiche dove il riallagamento ha riportato aquila
    di mare, sacro e mille coppie di gabbiani.
  pt: >-
    Um paul de turfa doce quase extinto pela drenagem onde o regresso da água atraiu águia-rabalva,
    falcão-sacre e mil casais de guinchos.
observaciones:
  es: >-
    La Casa de Observación de Aves Esterházy solo se visita con inscripción previa. En la zona del sendero hay
    que mirar desde el borde del aliseda Csíkos: está estrictamente protegida y no se entra.
texto:
  es:
    intro: >-
      Un pantano que desapareció y volvió. Durante siglos el Hanság fue un laberinto de lagos de entre tres y
      cuatro metros de profundidad, carrizales, eneales e islas flotantes en la esquina noroeste de Hungría;
      después llegaron los canales, la turba se oxidó, se plantaron clones de chopo y el agua abierta casi
      dejó de existir. Hoy forma parte del Parque Nacional Fertő-Hanság, donde es la parte de agua dulce y
      turba, en contraste con el lago salino del Fertő. Un humedal recuperado a base de esclusas y diques.
    landscape: >-
      El Hanság es la continuación oriental de la cuenca del Fertő, entre los abanicos aluviales del Danubio y
      del Rába. Mide 55 km de largo y 17,5 km de ancho, y su suelo turboso y pantanoso se interrumpe con 52
      islotes de grava y arena, los gorond, que emergen como pequeñas dunas. Fue el viento quien dio al
      terreno su forma final, y sus huellas se leen todavía en las dunas orientadas de noroeste a sureste.


      Lo que lo define es el agua. En años lluviosos la superficie inundada del Hanság podía llegar a los 400
      km². El mayor de sus lagos era el Király-tó, en el punto más hondo de la cuenca. Los hombres tardaron en
      domarlo: el príncipe Pál Esterházy levantó entre 1777 y 1780 el dique Pomogy-Eszterháza para llegar con
      más facilidad a su palacio, las obras de canalización empezaron en 1795 y el drenaje, que arrancó en el
      siglo XVIII, solo logró su objetivo en la segunda mitad del XIX con una red de canales de varios cientos
      de kilómetros. El fin del agua continua, el cultivo, la minería de turba y su oxidación, más las
      plantaciones de chopo, cambiaron el rostro del Hanság.


      Hoy conviven dos mundos. El Fertő es un lago salino con grandes carrizales y praderas salinas en sus
      orillas, mientras que el Hanság es un pantano turboso de agua dulce con retazos de bosque de aliso. En
      el sur del Hanság el agua se ha vuelto a abrir en el humedal restaurado de Nyirkai-Hany, de 420 ha.
    wildlife: >-
      La restauración de Nyirkai-Hany empezó a inundarse en 2001, y los pájaros lo notaron enseguida. Antes
      casi no quedaba agua abierta, y el Hanság llevaba décadas sin importancia para las aves migratorias.
      Ahora, de finales de marzo a mediados de abril, se superan de forma habitual los 3000 individuos a la
      vez, y durante la migración primaveral se registran entre treinta y cuarenta especies, con un máximo de
      cuarenta en la primera semana de mayo. En otoño el número de especies es la mitad, pero llegan muchos
      ánsares: ánsar común, ánsar careto y ánsar campestre.


      En los carrizales crían la [garceta grande](/especie/egretta_alba/) y la [garza
      imperial](/especie/ardea_purpurea/), la [garza real](/especie/ardea_cinerea/) en el aliseda Csíkos y el
      [martinete](/especie/nycticorax_nycticorax/) en los sauces junto a los lagos. El [pigargo
      europeo](/especie/haliaeetus_albicilla/), desaparecido hace un siglo, y el [halcón
      sacre](/especie/falco_cherrug/) han vuelto. Una isla de cría creada a propósito acoge más de mil parejas
      de gaviota reidora, y la [espátula común](/especie/platalea_leucorodia/) cría desde 2005. El
      [avetoro](/especie/botaurus_stellaris/) y el [aguilucho lagunero](/especie/circus_aeruginosus/) lo hacen
      con unas pocas parejas, y el [pato colorado](/especie/netta_rufina/), muy raro como nidificante en el
      país salvo en el Fertő, se asentó con rapidez. El porrón pardo, amenazado en todo el mundo, es otra ave
      valiosa de los carrizales, y su cría era uno de los objetivos de la restauración.


      Los prados húmedos del Hanság sirven de cuna y de comedero al [guion de
      codornices](/especie/crex_crex/), al [aguilucho cenizo](/especie/circus_pygargus/) y al búho campestre.
      En Lébényi-Hany, donde se van secando los prados, florecen orquídeas y cría la [avutarda
      común](/especie/otis_tarda/); en los bosques de Kapuvári-Hany abundan los insectos y los reptiles, y
      vive la lagartija vivípara. En los bosques de ribera se oyen el alcotán, el búho chico y el cárabo
      común.
    visit: >-
      El sendero natural Hany Istók es la ruta que explica el Hanság. Mide 5 km y sale de la Casa de
      Observación de Aves Esterházy, a medio camino entre Osli y Bősárkány, uno de los observatorios de aves
      más antiguos de Hungría. Primero atraviesa el aliseda Csíkos, de raíces zancudas y estrictamente
      protegida, que solo se ve desde el borde del bosque. Después, un paseo corto lleva a una duna de arena,
      el gorond, donde anidan los abejarucos, y desde allí se ve un humedal con muchas aves acuáticas, sobre
      todo ánsares comunes, patos y garzas. Con algo de suerte se ven el pigargo europeo o el águila imperial
      oriental.


      Quien quiera más puede seguir hasta el lago Király, de 1 a 1,5 km, por un bosque pantanoso donde se
      encuentran huellas de [castor](/especie/castor_fiber/) y restos de la antigua extracción de turba. El
      lago, hoy cubierto de vegetación, es donde la leyenda sitúa el hallazgo del niño salvaje Hany Istók, y
      junto a él viven el pigargo europeo, la [cigüeña negra](/especie/ciconia_nigra/) y muchos reptiles y
      anfibios. El camino de grava se puede recorrer con cualquier tiempo y en cualquier época del año.


      Para aprender más hay una visita guiada, «Madárles a Hanságban», que muestra la avifauna del humedal
      restaurado de Osli-hany, y la exposición «La vida del Hanság» en Öntésmajor, que cuenta la historia del
      paisaje moldeado por la naturaleza y las personas y la vida y los oficios de los habitantes del Hanság.
    history: >-
      Los canales fueron la primera mitad de la historia; la segunda fue la restauración. La primera medida de
      protección fue el área protegida del paisaje del Hanság, creada en 1976. El parque tomó su nombre actual
      en 1994, al sumarse el Hanság al antiguo parque del Fertő. En la restauración de Nyirkai-Hany se
      levantaron esclusas y diques y se introdujeron plantas acuáticas del Hanság y peces autóctonos, y un
      programa de monitoreo sigue el efecto sobre el agua, la vegetación y las aves.
    before: >-
      La Casa de Observación de Aves Esterházy solo se visita con inscripción previa. En la zona del sendero
      hay que mirar desde el borde del aliseda Csíkos: está estrictamente protegida y no se entra.
    around: >-
      A unos 3 km queda el [Parque Nacional Neusiedler See -
      Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/). Lejos de aquí, el [Parque Nacional
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) comparte con el Hanság el guion de codornices, el halcón
      sacre y la avutarda, y el [Humedal de La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) las
      comparte con la garza imperial y la avutarda.
  en:
    intro: >-
      A fen that vanished and rose again. For centuries the Hanság was an impenetrable wetland maze of lakes
      three to four metres deep, extensive reedbeds, bulrushes, and floating peat mats across Hungary’s
      northwestern borderland. Then came drainage channels, the peat oxidised, timber poplars were planted,
      and open water nearly disappeared. Today it constitutes the freshwater and peat component of
      Fertő-Hanság National Park, contrasting with the alkaline waters of Lake Fertő, revived through a
      network of dykes and sluices.
    landscape: >-
      The Hanság forms the eastern continuation of the Fertő basin, wedged between the alluvial fans of the
      Danube and Rába rivers. It spans 55 km in length and 17.5 km in width, its peaty floor broken by 52
      gravel and sand islands—locally known as gorond—that emerge like low inland dunes. The wind gave the
      basin its final shape, leaving fossil dune crests aligned northwest to southeast.


      Water defines everything here. In flood years, inundations across the Hanság once covered 400 km². The
      deepest lake was Király-tó at the basin’s lowest point. Humans took centuries to conquer it: Prince Pál
      Esterházy built the Pomogy-Eszterháza causeway between 1777 and 1780 to ease access to his palace,
      channelisation works commenced in 1795, and drainage schemes started in the eighteenth century only
      triumphed in the late nineteenth century via a canal grid spanning several hundred kilometres. Vanishing
      waters, peat quarrying, oxidation, and poplars radically transformed the landscape.


      Today two worlds coexist side by side. Lake Fertő is an alkaline expanse fringed by wide reedbeds and
      salt meadows, whereas the Hanság is a freshwater peat fen sheltering remnant alder carrs. In southern
      Hanság, open water was resurrected across the 420 ha restored Nyirkai-Hany wetland.
    wildlife: >-
      The Nyirkai-Hany wetland re-flooding began in 2001, and waterbirds responded immediately. Decades had
      passed without significant migrant passage on the dry peat. Now, from late March to mid-April, flocks
      regularly exceed 3000 individuals simultaneously, and spring migration tallies thirty to forty species,
      peaking at forty during the first week of May. Autumn migration brings fewer species but immense geese
      concentrations: greylag, greater white-fronted, and taiga bean geese.


      Reedbeds shelter breeding [*Egretta alba*](/especie/egretta_alba/) (great egret) and [purple
      heron](/especie/ardea_purpurea/), while [grey heron](/especie/ardea_cinerea/) nests in the Csíkos alder
      carr and [black-crowned night heron](/especie/nycticorax_nycticorax/) in lakeside willows. The
      [white-tailed eagle](/especie/haliaeetus_albicilla/), absent for a century, and the [saker
      falcon](/especie/falco_cherrug/) have successfully returned. A constructed nesting islet accommodates
      over one thousand pairs of black-headed gulls, and the [Eurasian
      spoonbill](/especie/platalea_leucorodia/) has bred since 2005. [Eurasian
      bittern](/especie/botaurus_stellaris/) and [western marsh harrier](/especie/circus_aeruginosus/)
      maintain territories, while [red-crested pochard](/especie/netta_rufina/) colonised quickly. Ferruginous
      duck, globally near-threatened, represents another key restoration beneficiary.


      Wet meadows support the [corn crake](/especie/crex_crex/), [Montagu's
      harrier](/especie/circus_pygargus/), and short-eared owl. At Lébényi-Hany, drying grasslands host wild
      orchids and breeding [great bustard](/especie/otis_tarda/). Riparian woodlands ring with Eurasian hobby,
      long-eared owl, and tawny owl.
    visit: >-
      The Hany Istók nature trail provides the definitive introduction to the Hanság. Stretching 5 km, it
      begins at the Esterházy Birdwatching House midway between Osli and Bősárkány, among the oldest bird
      hides in Hungary. It first skirts the strictly protected stilt-rooted Csíkos alder forest, viewable from
      the woodland margin. A brief walk leads to a sand gorond dune where European bee-eaters burrow, opening
      onto vistas of wetlands bustling with greylag geese, ducks, and herons. With luck, visitors can spot
      white-tailed eagles or eastern imperial eagles.


      Ambitious hikers can extend 1 to 1.5 km to Király Lake through swamp forest bearing signs of [Eurasian
      beaver](/especie/castor_fiber/) and historic peat extraction. The overgrown lake is where legend places
      the discovery of the feral water-boy Hany Istók, where white-tailed eagles, [black
      storks](/especie/ciconia_nigra/), and amphibians now thrive. The gravel path is walkable year-round in
      all weather.


      Visitors can also join the «Madárles a Hanságban» guided wetland tour at Osli-hany, or explore the «Life
      of the Hanság» museum exhibition in Öntésmajor documenting traditional fen crafts and natural history.
    history: >-
      Draining canals made up the first half of the story; restoration wrote the second. Regional protection
      began in 1976 with the Hanság Landscape Protection Area. The national park adopted its unified dual name
      in 1994 when Hanság merged with the former Fertő reserve. Nyirkai-Hany restoration installed water
      sluices and low dykes, translocated native fen macrophytes and indigenous fish, backed by comprehensive
      hydrological and avian monitoring.
    before: >-
      The Esterházy Birdwatching House can only be visited with advance reservation. Along the trail, admire
      the Csíkos alder carr strictly from the designated path: it is a core nature sanctuary and off-limits to
      visitors.
    around: >-
      Around 3 km away lies [Neusiedler See - Seewinkel National
      Park](/lugar/nationalpark-neusiedler-see-seewinkel/). Farther afield, [Körös-Maros National
      Park](/lugar/koros-maros-nemzeti-park/) shares the corn crake, saker falcon, and great bustard, while
      [La Nava Wetland](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) shares the purple heron and great
      bustard.
  fr:
    intro: >-
      Un marais disparu puis ressuscité. Pendant des siècles, le Hanság fut un dédale de lacs profonds de
      trois à quatre mètres, de roselières, de massettes et d’îles de tourbe flottante dans le nord-ouest de
      la Hongrie ; puis vinrent les canaux, la tourbe s’oxyda, des peupliers furent plantés et l’eau libre
      cessa presque d’exister. Aujourd’hui intégré au parc national de Fertő-Hanság, il incarne le volet d’eau
      douce et de tourbe face au lac salé du Fertő, régénéré grâce à un réseau de digues et d’écluses.
    landscape: >-
      Le Hanság prolonge vers l’est la cuvette du Fertő, serré entre les cônes alluviaux du Danube et de la
      Rába. Il s’étire sur 55 km de long et 17,5 km de large, son socle tourbeux étant ponctué de 52 îlots de
      gravier et de sable — les gorond — émergeant telles de petites dunes. Le vent a sculpté le relief final,
      dont les traces subsistent dans les cordons dunaires orientés nord-ouest/sud-est.


      L’eau façonne chaque recoin. Lors des années pluvieuses, les crues du Hanság submergeaient jadis 400
      km². Le plus vaste des plans d’eau était le Király-tó au creux de la cuvette. L’homme mit longtemps à le
      dompter : le prince Pál Esterházy érigea entre 1777 et 1780 la chaussée Pomogy-Eszterháza pour accéder à
      son château, les canaux débutèrent en 1795 et le drainage du XVIIIe siècle n’aboutit qu’à la fin du XIXe
      siècle grâce à un réseau de canaux de plusieurs centaines de kilomètres. Assèchement, tourbage, mise en
      culture et peupleraies bouleversèrent le milieu.


      Aujourd’hui deux écosystèmes se côtoient. Le Fertő est un lac alcalin ceinturé d’immenses roselières et
      de prés salés, tandis que le Hanság est un marais d’eau douce parsemé d’aulnaies marécageuses. Au sud,
      l’eau libre a reconquis 420 ha dans le marais restauré de Nyirkai-Hany.
    wildlife: >-
      La remise en eau de Nyirkai-Hany a débuté en 2001, attirant aussitôt les oiseaux d’eau. Auparavant, le
      milieu asséché n’avait plus d’intérêt migratoire. Désormais, de fin mars à mi-avril, les rassemblements
      dépassent couramment 3000 individus simultanés, et la migration printanière enregistre trente à quarante
      espèces, avec un pic dans la première semaine de mai. L’automne accueille de grands vols d’oies : oie
      cendrée, oie rieuse et oie des moissons.


      Dans les roselières nichent la [*Egretta alba*](/especie/egretta_alba/) (grande aigrette) et le [héron
      pourpré](/especie/ardea_purpurea/), tandis que le [héron cendré](/especie/ardea_cinerea/) occupe
      l’aulnaie Csíkos et le [bihoreau gris](/especie/nycticorax_nycticorax/) les saules riverains. Le
      [pygargue à queue blanche](/especie/haliaeetus_albicilla/) et le [faucon sacre](/especie/falco_cherrug/)
      sont revenus nicher. Un îlot de nidification aménagé accueille plus de mille couples de mouettes
      rieuses, et la [spatule blanche](/especie/platalea_leucorodia/) s’y reproduit depuis 2005. Le [butor
      étoilé](/especie/botaurus_stellaris/) et le [busard des roseaux](/especie/circus_aeruginosus/) s’y
      maintiennent, tandis que la [nette rousse](/especie/netta_rufina/) a rapidement colonisé les bassins. Le
      fuligule nyroca est un autre hôte de marque.


      Les prés humides abritent le [râle des genêts](/especie/crex_crex/), le [busard
      cendré](/especie/circus_pygargus/) et le hibou des marais. À Lébényi-Hany nichent des [grandes
      outardes](/especie/otis_tarda/) au milieu des orchidées, tandis que les forêts riveraines résonnent du
      faucon hobereau et de la chouette hulotte.
    visit: >-
      Le sentier d’interprétation Hany Istók est l’itinéraire incontournable du Hanság. Long de 5 km, il
      débute à la Maison ornithologique Esterházy entre Osli et Bősárkány, l’un des plus anciens postes
      d’observation de Hongrie. Il longe d’abord l’aulnaie protégée Csíkos aux racines échasses, visible
      depuis la lisière. Une courte marche mène ensuite à une dune sableuse (gorond) où nichent les guêpiers,
      ouvrant sur un plan d’eau animé d’oies, de canards et de hérons. Avec un peu de chance, on y repère le
      pygargue ou l’aigle impérial.


      On peut prolonger de 1 à 1,5 km jusqu’au lac Király à travers une forêt marécageuse portant les traces
      du [castor d’Europe](/especie/castor_fiber/) et d’anciennes fosses de tourbage. Ce lac envahi de
      végétation est le théâtre légendaire de la découverte de l’enfant sauvage Hany Istók ; y vivent le
      pygargue, la [cigogne noire](/especie/ciconia_nigra/) et de nombreux batraciens. Le chemin est
      praticable par tous les temps.


      Pour approfondir la visite, une sortie guidée présente l’avifaune d’Osli-hany, et l’exposition « La vie
      du Hanság » à Öntésmajor retrace l’histoire rurale et naturelle de cette contrée.
    history: >-
      Le drainage fut le premier acte ; le réensauvagement écrivit le second. La protection débuta en 1976
      avec la création de la Réserve paysagère du Hanság. Le parc national adopta son nom actuel en 1994 lors
      de la fusion du Hanság et du Fertő. À Nyirkai-Hany, l’aménagement d’écluses a permis de réintroduire
      poissons et plantes paludicoles indigènes, suivis par un observatoire scientifique régulier.
    before: >-
      La Maison ornithologique Esterházy ne se visite que sur réservation préalable. Le long du sentier,
      observez l’aulnaie Csíkos depuis la lisière balisée : il s’agit d’une réserve intégrale strictement
      interdite d’accès.
    around: >-
      À environ 3 km se trouve le [Parc national de Neusiedler See -
      Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/). Plus loin, le [Parc national de
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) partage le râle des genêts, le faucon sacre et l’outarde,
      tandis que le [Marais de La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) partage le héron
      pourpré et la grande outarde.
  de:
    intro: >-
      Ein Moor, das verschwand und wiederauferstand. Über Jahrhunderte war der Hanság ein unwegsames
      Moorgebiet aus drei bis vier Meter tiefen Seen, Röhrichten, Rohrkolben und Schwingrasen in
      Nordwestungarn; dann folgten Entwässerungsgräben, Torfoxidation, Pappelplantagen und das Verschwinden
      der freien Wasserflächen. Heute bildet das Gebiet den Süßwasser- und Moorteil des Nationalparks
      Fertő-Hanság als Gegenpol zum Salzsee Fertő (Neusiedler See), wiederbelebt durch Stauanlagen und Dämme.
    landscape: >-
      Der Hanság ist die östliche Fortsetzung des Neusiedlersee-Beckens zwischen den Schwemmfächern von Donau
      und Raab. Er misst 55 km in der Länge und 17,5 km in der Breite; sein Moorboden wird von 52 Sand- und
      Schotterinseln unterbrochen – den Gorond –, die wie Dünen aufragen. Der Wind gab dem Becken seine
      Gestalt, sichtbar an den Dünenrücken von Nordwest nach Südost.


      Das Wasser prägte alles. In nassen Jahren erreichte die Überschwemmungsfläche des Hanság einst 400 km².
      Sein tiefster See war der Király-tó. Seine Zähmung dauerte lange: Fürst Pál Esterházy ließ zwischen 1777
      und 1780 den Damm Pomogy-Eszterháza errichten, die Kanalbauten begannen 1795 und die im achtzehnten
      Jahrhundert einsetzende Melioration vollendete sich erst Ende des neunzehnten Jahrhunderts mit einem
      Kanalnetz von Hunderten Kilometern. Torfabbau, Ackerbau und Forste wandelten das Bild grundlegend.


      Heute bestehen zwei Welten nebeneinander: der alkalische Fertő mit weiten Schilfgürteln und Salzsteppen
      und der Hanság als Süßwassermoor mit Erlenbruchwäldern. Im Süden wurde im 420 ha großen Feuchtgebiet
      Nyirkai-Hany wieder freies Wasser geschaffen.
    wildlife: >-
      Die Wiedervernässung von Nyirkai-Hany begann 2001, und die Vogelwelt reagierte unmittelbar. Zuvor war
      das trockengelegte Moor für Zugvögel bedeutungslos. Heute rasten von Ende März bis Mitte April
      regelmäßig über 3000 Wasservögel gleichzeitig; der Frühjahrszug zählt dreißig bis vierzig Arten mit
      Spitzenwerten Anfang Mai. Im Herbst rasten Tausende Gänse: Graugans, Blässgans und Saatgans.


      Im Röhricht brüten [*Egretta alba*](/especie/egretta_alba/) (Silberreiher) und
      [Purpurreiher](/especie/ardea_purpurea/), der [Graureiher](/especie/ardea_cinerea/) im Erlenwald Csíkos
      und der [Nachtreiher](/especie/nycticorax_nycticorax/) in ufernahen Weiden.
      [Seeadler](/especie/haliaeetus_albicilla/) und [Sakerfalke](/especie/falco_cherrug/) sind als Brutvögel
      zurückgekehrt. Eine künstliche Brutinsel beherbergt über tausend Lachmöwenpaare, und der
      [Löffler](/especie/platalea_leucorodia/) brütet seit 2005. [Rohrdommel](/especie/botaurus_stellaris/)
      und [Rohrweihe](/especie/circus_aeruginosus/) sind vertreten, während die
      [Kolbenente](/especie/netta_rufina/) die Gewässer rasch besiedelte. Die Moorente profitiert ebenfalls
      von den Schutzmaßnahmen.


      Feuchtwiesen beherbergen [Wachtelkönig](/especie/crex_crex/), [Wiesenweihe](/especie/circus_pygargus/)
      und Sumpfohreule. In Lébényi-Hany brütet die [Großtrappe](/especie/otis_tarda/) inmitten wilder
      Orchideen, während die Auwälder von Baumfalke und Waldkauz belebt werden.
    visit: >-
      Der Lehrpfad Hany Istók erschließt den Hanság auf 5 km Länge. Er beginnt am
      Esterházy-Vogelbeobachtungshaus auf halbem Weg zwischen Osli und Bősárkány, einer der ältesten
      Beobachtungsstationen Ungarns. Zunächst passiert er den streng geschützten Stelzwurzel-Erlenwald Csíkos,
      der nur vom Waldrand eingesehen werden darf. Ein kurzer Pfad führt zu einer Sanddüne (Gorond) mit
      Bienenfresserkolonie und Blick auf wasserreiche Feuchtflächen voller Gänse, Enten und Reiher. Mit Glück
      zeigen sich Seeadler oder Kaiseradler.


      Wer weiter wandert, erreicht nach 1 bis 1,5 km den Király-See durch Bruchwald mit Spuren des
      [Europäischen Bibers](/especie/castor_fiber/) und alten Torfstichen. Um diesen verwachsenen See rankt
      sich die Sage um das wilde Findelkind Hany Istók; Seeadler und [Schwarzstorch](/especie/ciconia_nigra/)
      jagen hier. Der Schotterweg ist ganzjährig wetterfest begehbar.


      Ergänzend bietet die geführte Tour «Madárles a Hanságban» Einblicke in die Vogelwelt bei Osli-hany,
      während das Museum in Öntésmajor die Kulturgeschichte des Moores darstellt.
    history: >-
      Die Gräben waren der Anfang, der Naturschutz brachte die Rettung. 1976 wurde das Landschaftsschutzgebiet
      Hanság ausgewiesen; 1994 erhielt der Nationalpark seinen heutigen Namen durch Zusammenlegung von Fertő
      und Hanság. Bei Nyirkai-Hany wurden regulierbare Wehre errichtet sowie standortheimische Wasserpflanzen
      und Fische eingesetzt, wissenschaftlich begleitet durch ein Dauer-Monitoring.
    before: >-
      Das Esterházy-Vogelbeobachtungshaus ist nur nach Voranmeldung zugänglich. Am Lehrpfad darf der
      Erlenbruchwald Csíkos keinesfalls betreten werden, da er als Kernzone streng geschützt ist.
    around: >-
      In rund 3 km Entfernung liegt der [Nationalpark Neusiedler See -
      Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/). Weiter entfernt teilen der [Nationalpark
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) Wachtelkönig, Sakerfalke und Großtrappe sowie das
      [La-Nava-Feuchtgebiet](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) Purpurreiher und Großtrappe.
  it:
    intro: >-
      Una palude scomparsa e poi rinata. Per secoli l’Hanság fu un intrico di specchi lacustri profondi tre o
      quattro metri, canneti, tifeti e zolle di torba galleggiante nell’angolo nord-occidentale dell’Ungheria;
      poi giunsero i canali, la torba si ossidò, vennero piantati pioppi da legno e le acque aperte quasi
      sparirono. Oggi fa parte del Parco Nazionale Fertő-Hanság, dove costituisce l’anima d’acqua dolce e
      torba a fronte del lago salmastro del Fertő, rigenerata mediante chiuse e argini.
    landscape: >-
      L’Hanság è la prosecuzione orientale del bacino del Fertő, compreso tra i conoidi alluvionali del
      Danubio e del Rába. Misura 55 km di lunghezza e 17,5 km di larghezza, e il suo suolo torboso è
      interrotto da 52 dossi sabbiosi e ghiaiosi — i gorond — che emergono come piccole dune. Fu il vento a
      modellare il rilievo finale, evidente nei cordoni orientati da nord-ovest a sud-est.


      L’acqua ne scandisce la storia. Negli anni piovosi le inondazioni dell’Hanság raggiungevano un tempo 400
      km². Il lago principale era il Király-tó nella parte più depressa della conca. L’uomo impiegò secoli per
      arginarlo: il principe Pál Esterházy costruì tra il 1777 e il 1780 il rilevato Pomogy-Eszterháza per
      raggiungere il proprio palazzo, i canali iniziarono nel 1795 e la bonifica avviata nel Settecento si
      completò nell’Ottocento con centinaia di chilometri di fossi. Estrazione di torba, coltivazioni e
      pioppeti mutarono radicalmente l’ecosistema.


      Oggi convivono due mondi. Il Fertő è un lago alcalino cinto da fitti canneti e praterie saline, mentre
      l’Hanság è una palude torbosa d’acqua dolce con lembi di ontaneto. Nel settore meridionale le acque
      aperte sono state ricreate nel bacino riallagato di Nyirkai-Hany su 420 ha.
    wildlife: >-
      Il riallagamento di Nyirkai-Hany è iniziato nel 2001 richiamando subito gli uccelli acquatici. Nei
      decenni precedenti l’area prosciugata non aveva richiamo migratorio. Oggi, da fine marzo a metà aprile,
      le presenze superano regolarmente i 3000 individui simultanei, e il passo primaverile registra tra
      trenta e quaranta specie con un picco a inizio maggio. L’autunno vede il passaggio massiccio di oche:
      oca selvatica, oca lombardella e oca granaiola.


      Nei canneti nidificano l’[*Egretta alba*](/especie/egretta_alba/) (airone bianco maggiore) e l’[airone
      rosso](/especie/ardea_purpurea/), l’[airone cenerino](/especie/ardea_cinerea/) nell’ontaneto Csíkos e la
      [nitticora](/especie/nycticorax_nycticorax/) sui salici. L’[aquila di
      mare](/especie/haliaeetus_albicilla/) e il [sacro](/especie/falco_cherrug/) sono tornati a nidificare
      stabilmente. Un isolotto appositamente creato ospita oltre mille coppie di gabbiani comuni, e la
      [spatola](/especie/platalea_leucorodia/) vi nidifica dal 2005. Sono presenti il
      [tarabuso](/especie/botaurus_stellaris/) e il [falco di palude](/especie/circus_aeruginosus/), mentre il
      [fistione turco](/especie/netta_rufina/) ha colonizzato rapidamente gli specchi d’acqua. La moretta
      tabaccata è un’altra specie di primaria importanza.


      I prati umidi ospitano il [re di quaglie](/especie/crex_crex/), l’[albanella
      minore](/especie/circus_pygargus/) e il gufo di palude. A Lébényi-Hany nidifica
      l’[otarda](/especie/otis_tarda/) tra le orchidee selvatiche, mentre nei boschi fluviali cantano lodolaio
      e allocco.
    visit: >-
      Il sentiero didattico Hany Istók illustra l’ecosistema dell’Hanság. Lungo 5 km, parte dalla Casa di
      Osservazione Ornitologica Esterházy a metà strada tra Osli e Bősárkány, uno dei capanni storici
      ungheresi. Costeggia l’ontaneto di Csíkos a radici colonnari, ammirabile unicamente dal limitare del
      bosco per via della protezione integrale. Una breve passeggiata sale poi su una duna gorond dove
      nidificano i gruccioni, con veduta su un acquitrino ricco di anatidi e aironi. Con un po’ di fortuna si
      scorgono l’aquila di mare o l’aquila imperiale.


      Chi desidera proseguire può coprire da 1 a 1,5 km fino al lago Király attraverso boschi palustri con
      tracce di [*Castor fiber*](/especie/castor_fiber/) (castoro europeo) e antiche cave di torba. Questo
      specchio velato dalla vegetazione è il luogo leggendario del ritrovamento del fanciullo selvatico Hany
      Istók; vi dimorano la [cicogna nera](/especie/ciconia_nigra/) e l’aquila di mare. Il fondo in ghiaia è
      agevole tutto l’anno.


      Sono disponibili visite guidate alla riserva di Osli-hany e la mostra «La vita dell’Hanság» a Öntésmajor
      dedicata alla storia delle bonifiche.
    history: >-
      I canali furono il primo tempo della storia; la rinaturazione ha scritto il secondo. La tutela iniziò
      nel 1976 con l’Area Protetta del Paesaggio dell’Hanság. Il parco ha assunto la denominazione attuale nel
      1994 con l’unione di Fertő e Hanság. A Nyirkai-Hany chiuse e argini hanno ricreato i regimi idrici
      d’antan, consentendo la reintroduzione di idrofite e pesci autoctoni monitorati regolarmente.
    before: >-
      La Casa di Osservazione Esterházy è accessibile solo su prenotazione. Lungo il sentiero osserva
      l’ontaneto Csíkos dal margine del tracciato: è riserva integrale ed è vietato inoltrarsi.
    around: >-
      A circa 3 km si trova il [Parco Nazionale Neusiedler See -
      Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/). Più distante, il [Parco Nazionale di
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) condivide re di quaglie, sacro e otarda, mentre la [Zona
      Umida de La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) ospita airone rosso e otarda.
  pt:
    intro: >-
      Um paul que desapareceu e renasceu. Durante séculos o Hanság foi um labirinto aquático de lagoas com
      três a quatro metros de profundidade, caniçais, tabuas e ilhas flutuantes de turfa no extremo noroeste
      da Hungria; depois abriram-se canais, a turfa oxidou, plantaram-se choupos e as águas abertas quase
      cessaram de existir. Hoje integra o Parque Nacional Fertő-Hanság, personificando a vertente de água doce
      e turfa em contraste com o lago salobro de Fertő, reabilitada através de açudes e diques.
    landscape: >-
      O Hanság prolonga para leste a depressão de Fertő, entalado entre os leques aluviais do Danúbio e do
      Rába. Mede 55 km de extensão e 17,5 km de largura, pontuado por 52 ilhotas de areia e seixos — os gorond
      — que emergem como pequenas dunas. O vento modelou a morfologia da bacia, legando cristas dunares com
      orientação noroeste-sudeste.


      A água dita as regras. Em anos húmidos a superfície alagada do Hanság atingia outrora 400 km². A maior
      lagoa era Király-tó no ponto mais profundo da bacia. A intervenção humana levou tempo a domesticá-lo: o
      príncipe Pál Esterházy ergueu entre 1777 e 1780 o aterro Pomogy-Eszterháza para aceder ao seu palácio,
      as valas principiaram em 1795 e a drenagem do século XVIII só vingou no final do século XIX através de
      uma malha de canais com várias centenas de quilómetros. A agricultura, a extração de turfa e os
      povoamentos florestais alteraram a paisagem.


      Hoje coexistem dois ecossistemas distintos. O Fertő é um lago alcalino marginado por caniçais e prados
      salgados, ao passo que o Hanság é um paul de turfa doce entremeado de amiais pantanosos. A sul
      reabriram-se 420 ha de espelhos de água na zona húmida de Nyirkai-Hany.
    wildlife: >-
      O restauro de Nyirkai-Hany começou a inundar-se em 2001, com resposta imediata da avifauna.
      Anteriormente as aves migradoras não encontravam alimento na terra drenada. Hoje, de finais de março a
      meados de abril, superam-se com regularidade os 3000 indivíduos em simultâneo, registando a passagem
      primaveril trinta a quarenta espécies com auge no início de maio. No outono chegam bandos densos de
      gansos: ganso-bravo, ganso-grande-de-testa-branca e ganso-campestre.


      Nos caniçais nidificam a [*Egretta alba*](/especie/egretta_alba/) (garça-branca-grande) e a
      [garça-vermelha](/especie/ardea_purpurea/), a [garça-real-europeia](/especie/ardea_cinerea/) no amial de
      Csíkos e o [savacu](/especie/nycticorax_nycticorax/) nos salgueiros. A
      [águia-rabalva](/especie/haliaeetus_albicilla/) e o [falcão-sacre](/especie/falco_cherrug/) voltaram a
      nidificar. Um ilhéu artificial acolhe mais de mil casais de guincho-comum, e o
      [colhereiro-europeu](/especie/platalea_leucorodia/) reproduz-se desde 2005. Ocorrem o
      [abetouro-comum](/especie/botaurus_stellaris/) e o
      [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/), tendo o
      [pato-de-bico-vermelho](/especie/netta_rufina/) colonizado prontamente a bacia. O zarro-castanho é outra
      espécie preciosa.


      As pastagens alagadiças abrigam o [codornizão](/especie/crex_crex/), o
      [tartaranhão-caçador](/especie/circus_pygargus/) e o bufo-pequeno. Em Lébényi-Hany nidifica a
      [abetarda-comum](/especie/otis_tarda/) por entre orquídeas bravias, enquanto as matas ribeirinhas
      acolhem o ólbio e a coruja-do-mato.
    visit: >-
      O trilho de interpretação Hany Istók explica a génese do Hanság ao longo de 5 km. Começa na Casa
      Ornitológica Esterházy a meio caminho entre Osli e Bősárkány, um dos postos de vigia de aves mais
      antigos da Hungria. O trilho margeia primeiro o amial estritamente protegido de Csíkos, visível da orla
      da floresta. Um pequeno passeio conduz a uma duna gorond com colónia de abelharucos, abrindo para lagoas
      repletas de gansos, patos e garças. Com alguma sorte avistam-se a águia-rabalva ou a águia-imperial.


      Quem pretender estender a caminhada pode percorrer 1 a 1,5 km até à lagoa Király através de floresta
      pantanosa com vestígios do [castor-europeu](/especie/castor_fiber/) e antigas fossas de turfa. Esta
      lagoa envolta em vegetação é o cenário lendário da descoberta do rapaz selvagem Hany Istók; por ali
      nidificam a águia-rabalva e a [cegonha-preta](/especie/ciconia_nigra/). O caminho em saibro é praticável
      em qualquer estação.


      O parque disponibiliza a visita guiada «Madárles a Hanságban» em Osli-hany e o museu «A Vida do Hanság»
      em Öntésmajor sobre a história e tradições locais.
    history: >-
      A drenagem foi o primeiro capítulo; o restauro ecológico escreveu o segundo. A conservação arrancou em
      1976 com a Área de Paisagem Protegida de Hanság. A designação atual resultou da fusão com o Fertő em
      1994. Em Nyirkai-Hany foram construídas comportas de retenção e reintroduzidas espécies nativas de
      macrófitas e peixes sob monitorização científica contínua.
    before: >-
      A Casa Ornitológica Esterházy requer reserva antecipada. No percurso pedestre contempla o amial de
      Csíkos exclusivamente a partir do trilho sinalizado: constitui reserva integral de acesso estritamente
      proibido.
    around: >-
      A cerca de 3 km fica o [Parque Nacional Neusiedler See -
      Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/). Mais distante, o [Parque Nacional
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) partilha o codornizão, o falcão-sacre e a abetarda, e a
      [Zona Húmida de La Nava](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) a garça-vermelha e a
      abetarda.
