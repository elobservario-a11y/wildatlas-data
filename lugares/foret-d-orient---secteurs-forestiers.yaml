unico:
  es: >-
    Es un bosque húmedo y un archipiélago de lagos a la vez, en pleno eje de migración de las grandes aves
    viajeras.
  en: >-
    It is simultaneously a damp oak forest and a lake archipelago, positioned directly on the European flyway
    of large migratory birds.
  fr: >-
    C'est à la fois une forêt humide et un archipel lacustre, situé en plein sur le couloir de migration des
    grands oiseaux voiliers.
  de: >-
    Ein feuchter Eichenwald und eine Seenlandschaft zugleich, mitten auf der Hauptzugroute großer europäischer
    Zugvögel.
  it: >-
    Un bosco igrofilo e un arcipelago di laghi al contempo, posto direttamente lungo la rotta migratoria dei
    grandi veleggiatori.
  pt: >-
    É simultaneamente uma floresta húmida e um arquipélago lacustre, posicionado em pleno corredor de migração
    de grandes aves planadoras.
