resumen:
  es: >-
    El corazón glaciar de los Alpes franceses (Barre des Écrins 4.102 m), con valles profundos como
    Valgaudemar y Vénéon.
  en: >-
    The glaciated core of the French Alps (Barre des Écrins 4,102 m), with deep glacial valleys such as
    Valgaudemar and Vénéon.
  fr: >-
    Le cœur glaciaire des Alpes françaises (Barre des Écrins 4 102 m), aux vallées profondes comme le
    Valgaudemar et le Vénéon.
  de: >-
    Das eiszeitliche Herz der französischen Alpen (Barre des Écrins 4.102 m) mit tiefen Trogtälern wie
    Valgaudemar und Vénéon.
  it: >-
    Il cuore glaciale delle Alpi francesi (Barre des Écrins 4.102 m), con profonde valli a U come la
    Valgaudemar e il Vénéon.
  pt: >-
    O coração glaciar dos Alpes franceses (Barre des Écrins 4.102 m), com vales profundos como Valgaudemar e
    Vénéon.
unico:
  es: >-
    Es un macizo con un centenar de cumbres de más de 3.000 m, unos cuarenta glaciares y la primera reserva
    natural integral de Francia, la de Lauvitel.
  en: >-
    A massive alpine realm with a hundred peaks above 3,000 m, some forty glaciers, and France's first strict
    nature reserve, Lauvitel.
  fr: >-
    Un massif comptant une centaine de sommets de plus de 3 000 m, une quarantaine de glaciers et la première
    réserve naturelle intégrale de France, celle du Lauvitel.
  de: >-
    Ein Hochgebirgsmassiv mit rund hundert Gipfeln über 3.000 m, etwa vierzig Gletschern und Frankreichs
    erstem Totalreservat, dem Lauvitel.
  it: >-
    Un imponente massiccio con un centinaio di vette sopra i 3.000 m, una quarantina di ghiacciai e la prima
    riserva naturale integrale di Francia, quella del Lauvitel.
  pt: >-
    Um maciço alpino com uma centena de cumes acima dos 3.000 m, cerca de quarenta glaciares e a primeira
    reserva natural integral de França, a de Lauvitel.
observaciones:
  es: >-
    Por la nieve del invierno y la primavera, la red de senderos abre poco a poco a finales de primavera y
    suele ser accesible hasta el otoño; los senderos suelen ser practicables desde mediados de junio hasta
    finales de septiembre. Los accesos a los collados y refugios más altos pueden estar nevados hasta julio y
    exigen crampones y piolet.


    El corazón del parque tiene reglamentación específica. El bivac se permite de 19 h a 9 h y a más de una
    hora a pie de los accesos por carretera y de los límites. Si el sendero presenta un tramo degradado o
    peligroso, el parque pide dar media vuelta y avisar. Algunas rutas cruzan pastos con perros de protección
    del rebaño: se recomienda detenerse cuando se acercan, seguir con calma y rodear el rebaño.
texto:
  es:
    intro: >-
      En 1913 el Estado francés compró 4.000 hectáreas de montaña en lo alto de Saint-Christophe-en-Oisans, y
      nació el «parque de la Bérarde». No lo movía la contemplación sino un problema práctico: los pastos
      avanzaban montaña arriba, y con ellos la erosión, la deforestación y los torrentes desordenados. Aquella
      semilla tardó sesenta años en convertirse en lo que hoy es el Parque Nacional de los Écrins, creado por
      decreto el 27 de marzo de 1973. Ocupa 91.800 ha entre Gap, Briançon y Grenoble, cabalga entre los Alpes
      del Norte y los del Sur, y sube desde unos 800 m hasta los 4.102 m de la barre des Écrins.
    landscape: >-
      Los Écrins son de las zonas más frías de los Alpes: sus numerosos glaciares condicionan el clima. Por
      encima de 2.500 a 3.000 m el frío persiste en cualquier estación y puede nevar incluso en verano. Esa
      altura se nota en los nombres propios: la Meije se alza a 3.983 m sobre el pueblo de La Grave, el mont
      Pelvoux mide 3.946 m y la barre des Écrins, el punto más alto, llega a 4.102 m.


      Entre tanta roca y hielo hay agua en forma de lago. El Lauvitel es el más profundo y grande del parque,
      con entre 25 y 35 ha de superficie y entre 40 y 65 m de profundidad. El lago del Pavé, a 2.820 m, es el
      más alto y frío: en superficie el agua está a 4 °C.


      La vida se escalona con la altura. En las laderas abundan pinos y alerces, y el parque guarda más de
      2.000 especies de plantas, entre ellas el cardo azul de los Alpes, el zapatito de dama, el edelweiss y
      el genepí. La saxífraga de hojas opuestas se ha encontrado hasta 4.070 m: es la planta más alta de
      Francia.
    wildlife: >-
      Al otro lado del paisaje de hielo están los animales que lo habitan. El
      [rebeco](/especie/rupicapra_rupicapra/), el [íbice alpino](/especie/capra_ibex/) y la
      [marmota](/especie/marmota_marmota/) son los más fáciles de reconocer; las marmotas se dejan observar
      con facilidad en las praderas y los pastos de altura, y precisamente por eso no hay que darles de comer:
      alimentarlas cambia su comportamiento y las expone a sus depredadores.


      Hay también liebre variable, armiño, ardilla roja y zorro rojo, y entre las aves, el [águila
      real](/especie/aquila_chrysaetos/) (con 40 parejas censadas), el [gallo lira](/especie/tetrao_tetrix/),
      el [buitre leonado](/especie/gyps_fulvus/), el [quebrantahuesos](/especie/gypaetus_barbatus/), el halcón
      peregrino y el [búho real](/especie/bubo_bubo/). El lagópodo alpino es una de las diez aves que el
      parque prioriza en su corazón.


      En primavera, en los claros de alerces, enebros y praderas altas, el macho del gallo lira despliega su
      cortejo, con su plumaje negro y su cola en forma de lira. A primera hora y al atardecer, los rebecos
      pastan alrededor de Tête de la Vieille, Pic de Charance y el circo de Bragousse, y unos prismáticos
      ayudan a verlos sin molestarlos. En el bosque de Boscodon, el corzo deja huellas y troncos
      descortezados.
    visit: >-
      Los Écrins se recorren a pie. El parque mantiene más de 700 km de itinerarios accesibles al mayor número
      de personas, y el GR 54, o Tour des Écrins, es uno de los tres principales senderos de gran recorrido de
      los Alpes franceses. Hay una treintena de refugios de montaña.


      Una forma de empezar es el Sentier des Pyramides, una ruta circular de 12 km que lleva cinco horas y
      media y acumula 722 m de desnivel. Parte y termina en el aparcamiento Fontaine de l'Ours, cerrado en
      invierno. Ofrece vistas del lago de Serre-Ponçon y de los circos de Bragousse y Morgon, pasa por dos
      miradores sobre Embrun y sobre el circo del torrente Colombier con sus torres de cargneule, y a su vera
      crece una estación de zapatito de dama, junto a otras orquídeas.


      Antes de salir, pasa por una de las casas del parque. Son siete, en Vallouise, el Briançonnais, el
      Embrunais, el Champsaur, el Valgaudemar, el Valbonnais y el Oisans, y funcionan como sede de los equipos
      de campo y como lugar de acogida para preparar la visita. Tienen espacios de exposición, un espacio
      audiovisual y de conferencias, y casi siempre un mapa en relieve del macizo. La primera, la de
      Vallouise, abrió en 1976.
    history: >-
      La historia del parque tiene un vaivén: perdió la categoría de parque nacional en 1962 y renació como
      parque nacional de los Écrins en 1973.


      Desde entonces ha sido laboratorio de conservación. En 1989 se reintrodujeron con éxito dieciséis íbices
      en el Valbonnais, procedentes de los parques de la Vanoise y del Vercors. En 1995 se creó en el valle de
      Lauvitel la primera reserva natural integral de Francia. En 2019 el parque entró en la Lista Verde de la
      UICN y la zona corazón creció 705 ha al integrar dos reservas contiguas. El programa «Alpages
      Sentinelles» estudia desde 2010 los pastos de altura y los efectos del cambio climático, y desde 2016 el
      atlas en línea Biodiv'Écrins reúne las observaciones de los agentes del parque.
    before: >-
      Por la nieve del invierno y la primavera, la red de senderos abre poco a poco a finales de primavera y
      suele ser accesible hasta el otoño; los senderos suelen ser practicables desde mediados de junio hasta
      finales de septiembre. Los accesos a los collados y refugios más altos pueden estar nevados hasta julio
      y exigen crampones y piolet.


      El corazón del parque tiene reglamentación específica. El bivac se permite de 19 h a 9 h y a más de una
      hora a pie de los accesos por carretera y de los límites. Si el sendero presenta un tramo degradado o
      peligroso, el parque pide dar media vuelta y avisar. Algunas rutas cruzan pastos con perros de
      protección del rebaño: se recomienda detenerse cuando se acercan, seguir con calma y rodear el rebaño.
    around: >-
      A unos diez kilómetros queda el [Macizo del Dévoluy](/lugar/massif-du-devoluy/), a catorce el [Parque
      Natural Regional del Queyras](/lugar/parc-naturel-regional-du-queyras/) y a quince la [Cadena de
      Belledonne](/lugar/chaine-de-belledonne/). A unos treinta kilómetros, el [Parque Nacional de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) ofrece otra cara de los Alpes franceses.


      Más lejos, el [Bosque Primario de Badínsky Prales](/lugar/badinsky-prales-primeval-forest/) comparte con
      los Écrins el musgo Buxbaumia viridis y el lobo.
  en:
    intro: >-
      In 1913 the French state acquired 4,000 hectares of high-mountain terrain above
      Saint-Christophe-en-Oisans, establishing the "Parc de la Bérarde." The motivation was practical rather
      than scenic: grazing herds were advancing up fragile slopes, triggering rampant erosion, deforestation,
      and unpredictable flash floods. That conservation seed took sixty years to fully mature into Écrins
      National Park, officially created by decree on 27 March 1973. Covering 91,800 ha between Gap, Briançon,
      and Grenoble, it straddles the Northern and Southern Alps, ascending from about 800 m to 4,102 m at the
      Barre des Écrins.
    landscape: >-
      The Écrins is among the coldest regions of the Alps: its extensive glaciers actively shape the regional
      climate. Above 2,500 to 3,000 m frigid conditions prevail year-round, and snow can fall even in
      midsummer. That soaring altitude is stamped into iconic topography: La Meije towers at 3,983 m above the
      village of La Grave, Mont Pelvoux reaches 3,946 m, and the Barre des Écrins crowns the entire massif at
      4,102 m.


      Amid sheer rock and ice, water pools in high glacial tarns. Lac Lauvitel is the park's largest and
      deepest lake, spanning 25 to 35 ha with depths between 40 and 65 m. Lac du Pavé, perched at 2,820 m, is
      the highest and coldest, with surface water hovering around 4 °C.


      Life tiers upward with altitude. Pine and larch forests carpet lower slopes, supporting over 2,000 plant
      species, including alpine blue thistle, lady's slipper orchid, edelweiss, and génépi. Purple saxifrage
      has been recorded up to 4,070 m, making it the highest vascular plant in France.
    wildlife: >-
      Beside ice and granite dwell alpine animals. The [chamois](/especie/rupicapra_rupicapra/), [Alpine
      ibex](/especie/capra_ibex/), and [Alpine marmot](/especie/marmota_marmota/) are the most recognizable;
      marmots are readily seen across high alpine meadows, which is precisely why you should never feed them:
      human food alters their foraging habits and exposes them to predators.


      Other mammals include mountain hares, stoats, red squirrels, and red foxes. Notable birds include the
      [golden eagle](/especie/aquila_chrysaetos/) (with 40 recorded breeding pairs), the [black
      grouse](/especie/tetrao_tetrix/), [griffon vulture](/especie/gyps_fulvus/), [bearded
      vulture](/especie/gypaetus_barbatus/), peregrine falcon, and [Eurasian eagle-owl](/especie/bubo_bubo/).
      The rock ptarmigan is one of ten focal avian species prioritized in the park core.


      In spring, amid larch clearings, junipers, and high lawns, black grouse cocks display their striking
      lyre-shaped tails. In early morning and at dusk, chamois graze around Tête de la Vieille, Pic de
      Charance, and the Cirque de Bragousse, where binoculars allow respectful observation. In the Boscodon
      forest, roe deer leave tracks and stripped bark.
    visit: >-
      The Écrins is explored on foot. The park maintains over 700 km of trails designed for broad
      accessibility, and the GR 54 (Tour des Écrins) is one of the three premier long-distance alpine treks in
      France. Around thirty mountain refuges welcome trekkers.


      A great introductory hike is the Sentier des Pyramides, a 12 km circular route taking five and a half
      hours and climbing 722 m. Starting and ending at the Fontaine de l'Ours car park (closed in winter), it
      offers vistas of Lac de Serre-Ponçon and the cirques of Bragousse and Morgon, passes two viewpoints over
      Embrun and the Colombier torrent with its cargneule rock towers, and skirts a rare stand of lady's
      slipper orchids.


      Before heading into the mountains, visit one of the seven Park Houses located in Vallouise, the
      Briançonnais, the Embrunais, the Champsaur, the Valgaudemar, the Valbonnais, and the Oisans. They house
      ranger bases, permanent exhibitions, screening rooms, and relief maps. The first opened in Vallouise in
      1976.
    history: >-
      The park's history had a setback: it lost its national park status in 1962 and was reborn as Écrins
      National Park in 1973.


      Since then it has served as a conservation laboratory. In 1989 sixteen ibex from the Vanoise and Vercors
      parks were successfully reintroduced to the Valbonnais. In 1995 France's first strict nature reserve was
      created in the Lauvitel valley. In 2019 the park joined the IUCN Green List and the core zone expanded
      by 705 ha by incorporating two adjoining reserves. The 'Alpages Sentinelles' program has studied
      high-altitude alpine pastures and climate change impacts since 2010, and since 2016 the online atlas
      Biodiv'Écrins centralizes observations made by park wardens.
    before: >-
      Due to winter and spring snow, the trail network opens gradually in late spring and typically remains
      accessible until autumn; trails are usually practicable from mid-June to late September. Access to the
      highest passes and mountain huts can remain snow-covered into July, requiring crampons and an ice axe.


      The park core has specific regulations. Bivouacking is permitted from 19 h to 9 h and at least one
      hour's walk from road access points and park boundaries. If a trail shows a degraded or hazardous
      section, the park asks hikers to turn back and report it. Certain routes cross pastures with livestock
      guardian dogs: you should stop when they approach, stay calm, and walk around the herd.
    around: >-
      Nearby massifs include the [Dévoluy Massif](/lugar/massif-du-devoluy/), the [Queyras Regional Natural
      Park](/lugar/parc-naturel-regional-du-queyras/), and the [Belledonne
      Range](/lugar/chaine-de-belledonne/). To the north, [Vanoise National
      Park](/lugar/parc-national-de-la-vanoise/) shares ibex and glaciated alpine topography.


      Farther away, [Badínsky Prales Primeval Forest](/lugar/badinsky-prales-primeval-forest/) preserves
      pristine old-growth mountain woodland.
  fr:
    intro: >-
      En 1913, l'État français acheta 4 000 hectares de montagne sur les hauteurs de
      Saint-Christophe-en-Oisans, donnant naissance au « parc de la Bérarde ». La démarche n'était pas
      contemplative mais utilitaire : le surpâturage gagnait l'altitude, entraînant érosion, déboisement et
      crues torrentielles dévastatrices. Cette graine mit soixante ans à devenir le Parc national des Écrins,
      créé par décret le 27 mars 1973. Il s'étend sur 91 800 ha entre Gap, Briançon et Grenoble, à cheval sur
      Alpes du Nord et du Sud, s'élevant de 800 m jusqu'aux 4 102 m de la barre des Écrins.
    landscape: >-
      Les Écrins comptent parmi les massifs les plus froids des Alpes : ses innombrables glaciers forgent le
      climat local. Au-dessus de 2 500 à 3 000 m, le froid persiste en toute saison et les chutes de neige
      surviennent même en plein été. Cette altitude extrême se lit dans les grands sommets : la Meije culmine
      à 3 983 m au-dessus de La Grave, le mont Pelvoux atteint 3 946 m et la barre des Écrins couronne
      l'ensemble à 4 102 m.


      Entre roche et glace miroitent de splendides lacs. Le Lauvitel est le plus vaste et le plus profond du
      parc, avec 25 à 35 ha de superficie pour 40 à 65 m de fond. Le lac du Pavé, perché à 2 820 m, est le
      plus élevé et le plus froid : son eau de surface avoisine les 4 °C.


      La végétation s'étage rigoureusement. Pins et mélèzes habillent les versants, et le parc abrite plus de
      2 000 espèces végétales, dont le chardon bleu des Alpes, le sabot de Vénus, l'edelweiss et le génépi. La
      saxifrage à feuilles opposées a été observée jusqu'à 4 070 m : c'est la plante la plus haute de France.
    wildlife: >-
      En regard de ce royaume minéral prospère une faune emblématique. Le
      [chamois](/especie/rupicapra_rupicapra/), le [bouquetin des Alpes](/especie/capra_ibex/) et la [marmotte
      des Alpes](/especie/marmota_marmota/) sont les plus faciles à observer ; les marmottes se laissent
      approcher dans les alpages, et c'est précisément pourquoi il ne faut jamais les nourrir : cela altère
      leur comportement et les livre aux prédateurs.


      On y croise aussi le lièvre variable, l'hermine, l'écureuil roux et le renard roux. Parmi les oiseaux
      s'illustrent l'[aigle royal](/especie/aquila_chrysaetos/) (avec 40 couples recensés), le [tétras
      lyre](/especie/tetrao_tetrix/), le [vautour fauve](/especie/gyps_fulvus/), le [gypaète
      barbu](/especie/gypaetus_barbatus/), le faucon pèlerin et le [hibou grand-duc](/especie/bubo_bubo/). Le
      lagopède alpin compte parmi les dix oiseaux prioritaires dans le cœur du parc.


      Au printemps, dans les clairières de mélèzes et genévriers, le mâle du tétras-lyre parade en déployant
      son plumage sombre et sa queue en lyre. À l'aube et au crépuscule, les chamois pâturent vers la Tête de
      la Vieille, le pic de Charance et le cirque de Bragousse. Dans la forêt de Boscodon, le chevreuil laisse
      empreintes et écorçages.
    visit: >-
      Les Écrins s'arpentent à pied. Le parc entretient plus de 700 km d'itinéraires balisés pour tous
      publics, et le GR 54 (Tour des Écrins) est l'un des trois grands treks alpins de France. Une trentaine
      de refuges gardés ponctuent les étapes.


      Pour débuter, le sentier des Pyramides offre une boucle de 12 km en cinq heures et demie avec 722 m de
      dénivelé. Partant du parking de la Fontaine de l'Ours (fermé en hiver), il dévoile le lac de
      Serre-Ponçon, les cirques de Bragousse et Morgon, ainsi que deux belvédères sur Embrun et les cargneules
      du torrent Colombier, côtoyant des stations de sabots de Vénus.


      Avant de partir, visitez l'une des sept Maisons du Parc situées en Vallouise, Briançonnais, Embrunais,
      Champsaur, Valgaudemar, Valbonnais et Oisans. Elles accueillent les équipes de terrain et les visiteurs
      avec expositions, projections et cartes en relief. La première, celle de Vallouise, a ouvert en 1976.
    history: >-
      L'histoire du parc a connu un tournant : il perdit son statut de parc national en 1962 avant de renaître
      sous le nom de Parc national des Écrins en 1973.


      Depuis lors, il fait figure de laboratoire de conservation. En 1989, seize bouquetins venus de la
      Vanoise et du Vercors furent réintroduits avec succès dans le Valbonnais. En 1995 fut créée dans le
      vallon du Lauvitel la première réserve naturelle intégrale de France. En 2019, le parc intégra la Liste
      verte de l'UICN et le cœur s'agrandit de 705 ha par l'incorporation de deux réserves contiguës. Le
      programme « Alpages Sentinelles » étudie depuis 2010 les pâturages d'altitude et les effets du
      dérèglement climatique, et depuis 2016 l'atlas en ligne Biodiv'Écrins rassemble les observations des
      agents du parc.
    before: >-
      En raison des neiges d'hiver et de printemps, le réseau de sentiers n'ouvre que progressivement à la fin
      du printemps et reste généralement accessible jusqu'à l'automne ; les sentiers sont praticables de la
      mi-juin à la fin septembre. L'accès aux cols et refuges les plus élevés peut être enneigé jusqu'en
      juillet, exigeant crampons et piolet.


      Le cœur du parc obéit à une réglementation précise. Le bivouac y est autorisé de 19 h à 9 h, à plus
      d'une heure de marche des accès routiers et des limites du parc. Si un sentier présente une portion
      dégradée ou dangereuse, le parc invite à faire demi-tour et à le signaler. Certains itinéraires
      traversent des estives avec des chiens de protection de troupeau : il convient de s'arrêter à leur
      approche, de rester calme et de contourner le troupeau.
    around: >-
      Parmi les massifs limitrophes figurent le [Massif du Dévoluy](/lugar/massif-du-devoluy/), le [Parc
      naturel régional du Queyras](/lugar/parc-naturel-regional-du-queyras/) et la [Chaîne de
      Belledonne](/lugar/chaine-de-belledonne/). Au nord, le [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) partage bouquetins et glaciers.


      Plus loin, la [Forêt primaire de Badínsky Prales](/lugar/badinsky-prales-primeval-forest/) préserve une
      hêtraie-sapinière intacte.
  de:
    intro: >-
      1913 erwarb der französische Staat 4.000 Hektar Hochgebirgsland oberhalb von Saint-Christophe-en-Oisans
      und gründete den „Parc de la Bérarde“. Der Anstoß war praktischer Natur: Überweidung fraß sich die
      Berghänge hinauf, begleitet von Bodenerosion, Entwaldung und unberechenbaren Muren. Aus diesem Keim
      entstand sechzig Jahre später der Nationalpark Écrins, der am 27. März 1973 per Dekret gegründet wurde.
      Er umfasst 91.800 ha zwischen Gap, Briançon und Grenoble, verbindet Nord- und Südalpen und reicht von
      800 m bis zu den 4.102 m der Barre des Écrins.
    landscape: >-
      Die Écrins zählen zu den kältesten Gebirgen der Alpen: Zahlreiche Gletscher bestimmen das Lokalklima.
      Oberhalb von 2.500 bis 3.000 m herrscht ganzjährig alpine Kälte, und selbst im Hochsommer kann Neuschnee
      fallen. Diese gewaltige Höhe spiegelt sich in den Gipfeln wider: La Meije ragt mit 3.983 m über La Grave
      auf, der Mont Pelvoux misst 3.946 m und die Barre des Écrins thront als höchster Punkt bei 4.102 m.


      Zwischen Fels und Eis ruhen kristallklare Karseen. Der Lac Lauvitel ist mit 25 bis 35 ha Fläche und 40
      bis 65 m Tiefe der größte und tiefste See des Parks. Der Lac du Pavé auf 2.820 m ist der höchstgelegene
      und kälteste: Sein Oberflächenwasser erreicht kaum 4 °C.


      Die Pflanzenwelt staffelt sich nach Höhenstufen. Kiefern und Lärchen überziehen die Hänge, und der Park
      beherbergt über 2.000 Pflanzenarten, darunter Alpen-Mannstreu, Frauenschuh, Edelweiß und Genepi. Der
      Gegenblättrige Steinbrech wurde bis auf 4.070 m Höhe nachgewiesen: Er gilt als höchstgelegene
      Gefäßpflanze Frankreichs.
    wildlife: >-
      Neben Eis und Geröll behaupten sich hochalpine Tiere. [Gämse](/especie/rupicapra_rupicapra/),
      [Alpensteinbock](/especie/capra_ibex/) und [Alpenmurmeltier](/especie/marmota_marmota/) sind am
      leichtesten zu entdecken; Murmeltiere zeigen sich auf Bergwiesen sehr zutraulich, weshalb man sie
      keinesfalls füttern darf: Fremdnahrung verändert ihr Verhalten und macht sie zur leichten Beute.


      Schneehase, Hermelin, Eichhörnchen und Rotfuchs sind weit verbreitet. Unter den Vögeln beeindrucken
      [Steinadler](/especie/aquila_chrysaetos/) (mit 40 Brutpaaren), [Birkhuhn](/especie/tetrao_tetrix/),
      [Gänsegeier](/especie/gyps_fulvus/), [Bartgeier](/especie/gypaetus_barbatus/), Wanderfalke und
      [Uhu](/especie/bubo_bubo/). Das Alpenschneehuhn gehört zu den zehn prioritär geschützten Vogelarten der
      Kernzone.


      Im Frühjahr balzen die Birkhähne auf Lichtungen und Zwergstrauchheiden mit leierförmigem Stoß. In der
      Morgen- und Abenddämmerung weiden Gämsen an Tête de la Vieille, Pic de Charance und im Cirque de
      Bragousse. Im Wald von Boscodon hinterlässt das Reh Spuren.
    visit: >-
      Die Écrins wollen zu Fuß erobert werden. Der Park unterhält über 700 km Wanderwege für alle
      Erfahrungsstufen, und der GR 54 (Tour des Écrins) gehört zu den drei großen Alpentouren Frankreichs.
      Rund dreißig bewirtschaftete Berghütten stehen bereit.


      Eine ideale Tagestour ist der Sentier des Pyramides: ein 12 km langer Rundweg (fünfeinhalb Stunden, 722
      Höhenmeter). Er startet am Parkplatz Fontaine de l'Ours (im Winter gesperrt), blickt auf den See von
      Serre-Ponçon, quert die Kare von Bragousse und Morgon und führt an Rauwacken-Türmen sowie
      Frauenschuh-Standorten vorbei.


      Vor der Tour empfiehlt sich der Besuch eines der sieben Parkzentren (Vallouise, Briançon, Embrun,
      Champsaur, Valgaudemar, Valbonnais, Oisans). Sie beherbergen Ausstellungen, Kinosäle und Reliefmodelle.
      Das erste öffnete 1976 in Vallouise.
    history: >-
      Die Geschichte des Parks erlebte Rückschläge: 1962 verlor er den Nationalparkstatus, bevor er 1973 als
      Nationalpark Écrins neu entstand.


      Seither dient er als Freilandlabor des Naturschutzes. 1989 wurden sechzehn Steinböcke aus den Parks
      Vanoise und Vercors im Valbonnais erfolgreich wiederangesiedelt. 1995 entstand im Lauvitel-Tal das erste
      Totalreservat Frankreichs. 2019 wurde der Park in die Grüne Liste der IUCN aufgenommen, und die Kernzone
      wuchs um 705 ha durch Eingliederung zweier angrenzender Schutzgebiete. Das Programm „Alpages
      Sentinelles“ erforscht seit 2010 die Hochalmen und die Folgen des Klimawandels, und seit 2016 bündelt
      der Online-Atlas Biodiv'Écrins die Beobachtungen der Parkmitarbeiter.
    before: >-
      Wegen des Winter- und Frühlingsschnees öffnet das Wegenetz im späten Frühjahr nur schrittweise und
      bleibt meist bis zum Herbst zugänglich; die Wanderpfade sind in der Regel von Mitte Juni bis Ende
      September begehbar. Zugänge zu den höchsten Pässen und Hütten können bis in den Juli hinein verschneit
      sein und erfordern Steigeisen und Eispickel.


      Die Kernzone des Parks unterliegt besonderen Regeln. Biwakieren ist von 19 h bis 9 h und mindestens eine
      Gehzeit-Stunde von Straßen und Parkgrenzen entfernt gestattet. Weist ein Wegabschnitt Schäden oder
      Gefahren auf, bittet die Parkverwaltung um Umkehr und Benachrichtigung. Manche Routen queren Almen mit
      Herdenschutzhunden: Es empfiehlt sich anzuhalten, wenn sie herankommen, ruhig zu bleiben und die Herde
      weiträumig zu umgehen.
    around: >-
      Benachbarte Gebirge sind das [Massif du Dévoluy](/lugar/massif-du-devoluy/), der [Regionale Naturpark
      Queyras](/lugar/parc-naturel-regional-du-queyras/) und die
      [Belledonne-Kette](/lugar/chaine-de-belledonne/). Nördlich teilt der [Nationalpark
      Vanoise](/lugar/parc-national-de-la-vanoise/) Steinböcke und Eisgipfel.


      Weiter entfernt bewahrt der [Urwald Badínsky Prales](/lugar/badinsky-prales-primeval-forest/) unberührte
      Bergmischwälder.
  it:
    intro: >-
      Nel 1913 lo Stato francese acquisì 4.000 ettari di pascoli d'alta quota a Saint-Christophe-en-Oisans,
      creando il «parco della Bérarde». L'intento non era contemplativo ma pratico: il pascolo incontrollato
      risaliva le pendici causando dissesto, disboscamento e piene torrentizie. Quel primo nucleo impiegò
      sessant'anni a trasformarsi nel Parco Nazionale degli Écrins, istituito con decreto il 27 marzo 1973.
      Tutela 91.800 ha tra Gap, Briançon e Grenoble, a cavallo tra Alpi Settentrionali e Meridionali,
      elevandosi da 800 m fino ai 4.102 m della Barre des Écrins.
    landscape: >-
      Gli Écrins sono tra i massicci più freddi delle Alpi: i suoi ghiacciai condizionano il clima dell'intero
      settore. Oltre i 2.500-3.000 m il gelo persiste in ogni stagione e le nevicate sono possibili persino in
      piena estate. Le quote culminano in vette leggendarie: la Meije svetta a 3.983 m sopra La Grave, il Mont
      Pelvoux tocca i 3.946 m e la Barre des Écrins primeggia a 4.102 m.


      Tra roccia viva e seracchi si annidano splendidi laghi glaciali. Il Lauvitel è il più vasto e profondo,
      con 25-35 ha di specchio d'acqua e 40-65 m di profondità. Il lago del Pavé, a 2.820 m, è il più alto e
      gelido: in superficie l'acqua segna circa 4 °C.


      La flora si scagliona per fasce. Pini e larici ammantano i versanti montani, e il parco ospita oltre
      2.000 specie botaniche, tra cui la regina delle Alpi (cardo blu), la pianella della Madonna, la stella
      alpina e il genepì. La sassifraga a foglie opposte è stata rinvenuta sino a 4.070 m: è la pianta
      vascolare più alta di Francia.
    wildlife: >-
      Accanto a ghiaccio e granito alligna una ricca fauna alpina. Il [camoscio
      alpino](/especie/rupicapra_rupicapra/), lo [stambecco](/especie/capra_ibex/) e la [marmotta
      alpina](/especie/marmota_marmota/) sono i più agevoli da osservare; le marmotte popolano le praterie
      d'alta quota, ragione per cui è vietato dar loro cibo: l'alimentazione antropica ne altera le abitudini
      esponendole ai predatori.


      Si incontrano pure lepre variabile, ermellino, scoiattolo rosso e volpe rossa. Tra i volatili spiccano
      l'[aquila reale](/especie/aquila_chrysaetos/) (con 40 coppie nidificanti), il [fagiano di
      monte](/especie/tetrao_tetrix/), il [grifone](/especie/gyps_fulvus/), il
      [gipeto](/especie/gypaetus_barbatus/), il falco pellegrino e il [gufo reale](/especie/bubo_bubo/). La
      pernice bianca figura tra i dieci volatili prioritari del cuore del parco.


      In primavera, nelle radure di larice e ginepro, i maschi di fagiano di monte intessono le loro parate
      nuziali. All'alba e al crepuscolo i camosci pascolano presso Tête de la Vieille, Pic de Charance e il
      circo di Bragousse. Nella foresta di Boscodon il capriolo lascia tracce e scortecciature.
    visit: >-
      Gli Écrins si percorrono a piedi. Il parco cura oltre 700 km di sentieri accessibili a escursionisti di
      ogni livello, e il GR 54 (Tour des Écrins) costituisce uno dei tre grandi anelli alpini di Francia.
      Circa trenta rifugi custoditi consentono traversate a tappe.


      Un classico giro giornaliero è il Sentier des Pyramides: percorso ad anello di 12 km percorribile in
      cinque ore e mezza con 722 m di dislivello. Muove dal parcheggio della Fontaine de l'Ours (chiuso in
      inverno), rimira il lago di Serre-Ponçon, tocca i circhi di Bragousse e Morgon e passa accanto a guglie
      di cargneule e stazioni di pianella della Madonna.


      Prima di partire fai tappa in una delle sette Case del Parco (Vallouise, Briançonnais, Embrunais,
      Champsaur, Valgaudemar, Valbonnais, Oisans), fornite di plastici tridimensionali, mostre e proiezioni.
      La prima sede fu aperta a Vallouise nel 1976.
    history: >-
      La storia del parco conobbe una battuta d'arresto: perse la qualifica di parco nazionale nel 1962 per
      rinascere come Parco Nazionale degli Écrins nel 1973.


      Da allora è stato un laboratorio di conservazione. Nel 1989 sedici stambecchi provenienti dai parchi
      della Vanoise e del Vercors vennero reintrodotti con successo nel Valbonnais. Nel 1995 fu istituita
      nella valle del Lauvitel la prima riserva naturale integrale di Francia. Nel 2019 il parco è entrato
      nella Green List dell'IUCN e la zona centrale è cresciuta di 705 ha integrando due riserve contigue. Il
      programma «Alpages Sentinelles» studia dal 2010 i pascoli d'alta quota e gli impatti dei cambiamenti
      climatici, e dal 2016 l'atlante online Biodiv'Écrins raccoglie le osservazioni dei guardiaparco.
    before: >-
      A causa della neve invernale e primaverile, la rete dei sentieri apre gradualmente a tarda primavera ed
      è solitamente accessibile fino all'autunno; i percorsi sono di norma praticabili da metà giugno a fine
      settembre. Gli accessi ai valichi e ai rifugi più elevati possono restare innevati fino a luglio,
      richiedendo ramponi e piccozza.


      Il cuore del parco segue normative specifiche. Il bivacco è consentito dalle 19 h alle 9 h a più di
      un'ora di cammino dagli accessi stradali e dai confini. Se un sentiero presenta un tratto degradato o
      pericoloso, l'ente parco raccomanda di tornare indietro e segnalarlo. Alcuni itinerari attraversano
      pascoli con cani da guardia delle greggi: è consigliabile fermarsi al loro avvicinamento, mantenere la
      calma e aggirare il gregge.
    around: >-
      I massicci limitrofi annoverano il [Massiccio del Dévoluy](/lugar/massif-du-devoluy/), il [Parco
      Naturale Regionale del Queyras](/lugar/parc-naturel-regional-du-queyras/) e la [Catena di
      Belledonne](/lugar/chaine-de-belledonne/). A nord, il [Parco Nazionale della
      Vanoise](/lugar/parc-national-de-la-vanoise/) condivide stambecchi e scenari glaciali.


      Più a est, la [Foresta Primaria di Badínsky Prales](/lugar/badinsky-prales-primeval-forest/) conserva
      una faggeta montana incontaminata.
  pt:
    intro: >-
      Em 1913 o Estado francês adquiriu 4.000 hectares de montanha em Saint-Christophe-en-Oisans, fundando o
      «parque de la Bérarde». A motivação era prática e urgente: o pastoreio descontrolado subia as encostas,
      acarretando erosão galopante, desflorestação e cheias torrenciais. Esse embrião demorou sessenta anos
      até desabrochar no Parque Nacional de Écrins, criado por decreto a 27 de março de 1973. Abrange 91.800
      ha entre Gap, Briançon e Grenoble, cavalgando os Alpes do Norte e do Sul, elevando-se dos 800 m até aos
      4.102 m da Barre des Écrins.
    landscape: >-
      Os Écrins contam-se entre os maciços mais frios dos Alpes: os seus numerosos glaciares condicionam o
      clima regional. Acima dos 2.500 a 3.000 m o frio persiste em todas as estações, nevando com frequência
      em pleno verão. Essas altitudes extremas estampam-se na orografia: La Meije eleva-se a 3.983 m sobre La
      Grave, o monte Pelvoux atinge 3.946 m e a Barre des Écrins coroa o maciço a 4.102 m.


      Por entre rochedos e glaciares espelham-se lagoas alpinas. O Lauvitel é a maior e mais profunda do
      parque, estendendo-se por 25 a 35 ha com 40 a 65 m de profundidade. O lago do Pavé, a 2.820 m, é o mais
      elevado e gélido: à superfície a água ronda os 4 °C.


      A vegetação escalona-se com a altitude. Pinhais e lariços revestem as encostas, albergando o parque mais
      de 2.000 espécies vegetais, como o cardo-azul-dos-alpes, o sapatinho-de-vénus, a edelvais e o génépi. A
      saxífraga-de-folhas-opostas foi assinalada até aos 4.070 m: é a planta vascular mais alta de França.
    wildlife: >-
      No limiar das neves perpétuas prosperam animais emblemáticos. A
      [camurça](/especie/rupicapra_rupicapra/), o [íbex](/especie/capra_ibex/) e a
      [marmota-alpina](/especie/marmota_marmota/) são os mais fáceis de identificar; as marmotas avistam-se
      com facilidade nas pastagens de altitude, razão pela qual nunca deves alimentá-las: dar-lhes comida
      altera o seu comportamento e expõe-nas aos predadores.


      Registam-se também lebre-variável, arminho, esquilo-vermelho e raposa-vermelha. Nas aves avultam a
      [águia-real](/especie/aquila_chrysaetos/) (com 40 casais reprodutores), o
      [tetraz-lira](/especie/tetrao_tetrix/), o [abutre-fouveiro](/especie/gyps_fulvus/), o
      [abutre-barbudo](/especie/gypaetus_barbatus/), o falcão-peregrino e o [bufo-real](/especie/bubo_bubo/).
      O lagópode-branco é uma das dez aves prioritárias no coração do parque.


      Na primavera, nas clareiras de lariços e zimbros, o tetraz-lira executa paradas nupciais exibindo a
      cauda em lira. Ao amanhecer e ao crepúsculo, as camurças pastam junto à Tête de la Vieille, Pic de
      Charance e no circo de Bragousse. No bosque de Boscodon o corço deixa pegadas.
    visit: >-
      Os Écrins exploram-se a pé. O parque mantém mais de 700 km de trilhos balizados para todos os públicos,
      e o GR 54 (Tour des Écrins) é uma das três grandes travessias alpinas de França. Cerca de trinta
      refúgios de montanha acolhem os caminheiros.


      Um percurso diurno recomendado é o Sentier des Pyramides: traçado circular de 12 km cumprido em cinco
      horas e meia com 722 m de desnível. Parte do parque de estacionamento da Fontaine de l'Ours (fechado no
      inverno), avista a albufeira de Serre-Ponçon, percorre os circos de Bragousse e Morgon e passa junto a
      agulhas de cargneule e núcleos de sapatinho-de-vénus.


      Antes de subir à montanha, visita uma das sete Casas do Parque (Vallouise, Briançonnais, Embrunais,
      Champsaur, Valgaudemar, Valbonnais, Oisans), dotadas de mapas em relevo, exposições e salas de projeção.
      A pioneira abriu em Vallouise em 1976.
    history: >-
      A história do parque conheceu percalços: perdeu a categoria de parque nacional em 1962 antes de renascer
      como Parque Nacional de Écrins em 1973.


      Desde então funciona como laboratório de conservação. Em 1989 dezasseis íbexes oriundos dos parques de
      Vanoise e de Vercors foram reintroduzidos com êxito no Valbonnais. Em 1995 criou-se no vale de Lauvitel
      a primeira reserva natural integral de França. Em 2019 o parque ingressou na Lista Verde da UICN e a
      zona nuclear cresceu 705 ha ao integrar duas reservas contíguas. O programa «Alpages Sentinelles» estuda
      desde 2010 as pastagens de altitude e os efeitos das alterações climáticas, e desde 2016 o atlas online
      Biodiv'Écrins reúne as observações dos guardas do parque.
    before: >-
      Devido à neve de inverno e primavera, a rede de trilhos abre paulatinamente no final da primavera e
      permanece acessível até ao outono; os trilhos são normalmente praticáveis de meados de junho a finais de
      setembro. O acesso aos colos e refúgios mais altos pode permanecer coberto de neve até julho, exigindo
      crampons e piolet.


      O coração do parque possui regulamentação própria. O bivaque é permitido das 19 h às 9 h a mais de uma
      hora de marcha dos acessos rodoviários e dos limites do parque. Caso o trilho exiba troços degradados ou
      perigosos, o parque solicita que se retroceda e avise. Alguns percursos cruzam pastagens com cães de
      proteção de gado: recomenda-se parar quando se aproximam, manter a calma e rodear o rebanho.
    around: >-
      Entre os maciços vizinhos contam-se o [Maciço de Dévoluy](/lugar/massif-du-devoluy/), o [Parque Natural
      Regional do Queyras](/lugar/parc-naturel-regional-du-queyras/) e a [Cadeia de
      Belledonne](/lugar/chaine-de-belledonne/). A norte, o [Parque Nacional de
      Vanoise](/lugar/parc-national-de-la-vanoise/) partilha íbexes e glaciares.


      Mais a oriente, a [Floresta Primitiva de Badínsky Prales](/lugar/badinsky-prales-primeval-forest/)
      conserva faiais montanos virgens.
