    Bosques como la Devesa da Rogueira y un relieve de pliegues, calizas y valles fluviales en las montañas
    del sureste de Lugo.
  en: >-
    Ancient woodlands like the Devesa da Rogueira amid folded strata, limestone gorges and river valleys in
    southeastern Lugo.
  fr: >-
    Forêts anciennes comme la Devesa da Rogueira et reliefs plissés, calcaires et vallées fluviales dans les
    montagnes du sud-est de Lugo.
  de: >-
    Urwüchsige Bergwälder wie die Devesa da Rogueira sowie Faltengebirgs-, Kalk- und Flusstäler im Südosten
    von Lugo.
  it: >-
    Foreste vetuste come la Devesa da Rogueira e rilievi piegati, calcari e valli fluviali nei monti del
    sud-est di Lugo.
  pt: >-
    Florestas vetustas como a Devesa da Rogueira e relevos de dobras, calcários e vales fluviais nas montanhas
    do sudeste de Lugo.
unico:
  es: >-
    La Rogueira reúne hayas, tejos, arces, castaños y robles en unas montañas donde se encuentran las
    influencias atlántica y mediterránea y sustratos muy distintos.
  en: >-
    The Rogueira forest brings together beeches, yews, maples, chestnuts and oaks where Atlantic and
    Mediterranean influences meet diverse rock substrates.
  fr: >-
    La Rogueira réunit hêtres, ifs, érables, châtaigniers et chênes dans un massif où se croisent influences
    atlantiques et méditerranéennes sur des roches très variées.
  de: >-
    Der Rogueira-Wald vereint Buchen, Eiben, Ahorne, Kastanien und Eichen in einer Gebirgslandschaft, in der
    atlantische und mediterrane Einflüsse auf verschiedenste Gesteine treffen.
  it: >-
    La Rogueira riunisce faggi, tassi, aceri, castagni e querce in montagne dove si incontrano influenze
    atlantiche e mediterranee su substrati geologici diversissimi.
  pt: >-
    A Rogueira reúne faias, teixos, bordos, castanheiros e carvalhos num relevo onde confluem influências
    atlânticas e mediterrânicas sobre substratos rochosos diversos.
observaciones:
  es: >-
    La parte inicial desde Moreda es llana, pero el ascenso posterior se complica: adapta la caminata a la
    dificultad y comprueba las condiciones del día. Las cuevas son ecosistemas frágiles con requisitos de
    acceso: para entrar hay que pertenecer a la Federación Galega de Espeleoloxía o disponer de permisos
    específicos.
texto:
  es:
    intro: >-
      Hay sierras que se miran de lejos y otras que se leen. La Serra do Courel es de las segundas: un
      territorio montañoso del sureste de Lugo, entre Folgoso do Courel y Quiroga, articulado por el río Lor,
      con cumbres como Formigueiros, Montouto y Pía Paxaro y un bosque, la Devesa da Rogueira, que pide
      caminar despacio. Es un lugar para unir botánica y geología: árboles muy variados sobre rocas que
      cuentan su propia historia. La sierra es más pequeña que el geoparque de las Montañas de O Courel y que
      la ZEC Ancares-Courel, que la incluyen.
    landscape: >-
      Las montañas de Courel están en el límite entre los dominios climáticos atlántico y mediterráneo, y eso
      se nota en cada ladera. El Lor y sus afluentes enlazan valles de ecosistemas diversos, y la variedad de
      rocas introduce nuevos cambios en la vegetación. Las calizas y los mármoles generan suelos básicos sobre
      los que crecen hayas y encinas en Moreda, Campelo, Vilasibil y Noceda. En las riberas del bajo Lor
      aparecen alisedas; junto a Moreda y Ferreirós de Abaixo, fresnedas. En las alturas mandan los
      matorrales, sobre todo brezales rojos, piornales y retamas. Y el corredor del Sil favoreció la entrada
      de jara, cantueso, encina y alcornoque. El resultado es un mosaico de bosques.


      Bajo ese mosaico, las rocas guardan una historia larga. Las calizas del Ordovícico nacieron de antiguos
      arrecifes marinos. Mucho después, durante la orogenia varisca, la colisión de Gondwana y Laurrusia plegó
      los estratos y dio origen al pliegue de Campodola, que puedes contemplar desde el mirador geológico de
      Campodola. El agua hizo el resto: la disolución de calizas intercaladas con pizarras originó sistemas de
      cuevas, y en Val das Mouras el relieve kárstico es obra de esa misma disolución. Circos, morrenas y
      sedimentos de till registran además el paso de los glaciares.


      La sierra guarda su propia memoria vegetal. Los sedimentos de la lagoa da Lucenza conservan polen que
      permite reconstruir la historia de la vegetación de Courel.
    wildlife: >-
      En la Devesa da Rogueira viven corzos, comadrejas, [gatos monteses](/especie/felis_silvestris/),
      lirones, tritones ibéricos y ranas patilargas. Junto al manantial de Fonte do Cervo crece la planta
      insectívora Pinguicula grandiflora: obsérvala sin tocar las plantas ni alterar el agua.


      El listado de Courel da para más. Entre los anfibios figura Chioglossa lusitanica; entre los mamíferos,
      el desmán [Galemys pyrenaicus](/especie/galemys_pyrenaicus/) y la [nutria](/especie/lutra_lutra/); entre
      los murciélagos inventariados, Barbastella barbastellus y [Myotis myotis](/especie/myotis_myotis/); y
      entre los invertebrados, el [ciervo volante](/especie/lucanus_cervus/) y la babosa Geomalacus maculosus.
      Varias microrreservas ayudan a conservar orquídeas y otras plantas amenazadas: Alto do Couto, Visuña,
      Monte do Cido y Alto da Pedra. Para elegir la época, pregunta en el Aula de Moreda.
    visit: >-
      Empieza por el Aula de la Naturaleza de Moreda. Su exposición permanente explica el entorno, y los
      educadores ambientales ayudan a orientarse entre rutas, permisos y lugares de interés. Se accede desde
      Seoane do Courel hacia Moreda; antes de entrar en el pueblo hay un pequeño espacio para aparcar junto al
      aula. Desde allí sale un recorrido señalizado con paneles sobre la biología de la devesa: la parte
      inicial es sencilla y llana, pero el ascenso posterior aumenta la dificultad.


      La otra manera de entrar es por Alto do Couto, en la carretera entre Seoane y Visuña. De allí parte la
      ruta lineal de la Devesa da Rogueira, que recorre el bosque hasta sus fuentes y el mirador de Polín: 8,8
      km entre ida y vuelta, unas tres horas y cuarto, con dificultad media de progresión y de orientación. Se
      puede seguir a pie hacia Visuña o empezar desde Moreda. En la microrreserva de Alto do Couto, un panel
      interpreta la flora y la fauna del norte de Courel.


      Para completar la lectura del territorio, el Museo Geológico de Quiroga explica el pliegue de
      Campodola-Leixazós con muestras de rocas y minerales, una sala del Pleistoceno que interpreta las
      huellas de antiguos glaciares, fósiles y una reproducción de un oso de las cavernas. En Meiraos, el
      Centro de Interpretación de las Cuevas ocupa la antigua escuela y cuenta dónde se distribuyen las
      cavidades y quiénes las habitan o las habitaron. La ruta de las Aldeas Paleozoicas relaciona la
      arquitectura tradicional con las rocas empleadas en las construcciones, y el Museo Etnográfico de
      Quiroga conserva contenidos sobre producción textil, fragua y castaña.
    history: >-
      La sierra tiene también una historia humana antigua: en una sima se encontraron restos humanos antiguos
      junto a restos de uro. Y tiene voz propia en la literatura, porque ocupa un lugar destacado en la obra
      de Uxío Novoneyra, nacido en Parada de Moreda.


      La gestión de la ZEC, que incluye Courel y la vecina sierra de Ancares dentro del espacio Natura 2000
      Ancares-Courel, se apoya en el Plan Director de la red Natura gallega. Su objetivo es recuperar un
      estado favorable de conservación y evitar deterioros. En Seoane, la estación científica de la
      Universidad de Santiago de Compostela puede acoger cursos y visitas docentes.
    before: >-
      La parte inicial desde Moreda es llana, pero el ascenso posterior se complica: adapta la caminata a la
      dificultad y comprueba las condiciones del día. Las cuevas son ecosistemas frágiles con requisitos de
      acceso: para entrar hay que pertenecer a la Federación Galega de Espeleoloxía o disponer de permisos
      específicos.
    around: >-
      A solo 5 km, la [Parque Natural Fuentes del Narcea, Degaña e Ibias y Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) forman el vecino más cercano de Courel
      en el atlas. Más lejos hay lugares que comparten con él especies y hábitats: los [Valles Kársticos de
      Prosiecka y Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) comparten el murciélago Barbastella
      barbastellus, el Myotis myotis y la nutria, con bosque maduro y corredor fluvial; y el [Parque Natural
      Hoces del Alto Ebro y Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) comparte el desmán y
      la nutria, también con bosque maduro y corredor fluvial.
  en:
    intro: >-
      Some mountain ranges are admired from afar, while others demand to be read up close. The Serra do Courel
      belongs firmly to the second kind: a rugged massif in southeastern Lugo, between Folgoso do Courel and
      Quiroga, carved by the Lor River, with peaks such as Formigueiros, Montouto and Pía Paxaro, and an
      ancient woodland — the Devesa da Rogueira — that insists you slow your pace. It is a territory where
      botany and geology intertwine: remarkably diverse tree species growing over rocks that tell their own
      story. The mountain range is more intimate than the Courel Mountains UNESCO Global Geopark and the
      Ancares-Courel SAC that encompass it.
    landscape: >-
      The Courel mountains sit squarely on the boundary between Atlantic and Mediterranean climatic domains, a
      transition evident on every hillside. The Lor and its tributaries link valleys of contrasting ecology,
      while geological variety further diversifies the flora. Limestones and marbles yield alkaline soils that
      nurture beech and holm oak at Moreda, Campelo, Vilasibil and Noceda. Along the lower Lor stretch alder
      gallery woods, while near Moreda and Ferreirós de Abaixo ash groves flourish. On higher slopes,
      heathlands dominate, particularly red heather and broom scrub. Meanwhile, the Sil River corridor
      facilitated the inland arrival of rockrose, lavender, holm oak and cork oak, weaving a complex forest
      mosaic.


      Beneath this living canopy, the bedrock preserves a long chronology. Ordovician limestones originated as
      ancient marine reefs. Much later, during the Variscan orogeny, the tectonic collision of Gondwana and
      Laurussia buckled these layers, giving birth to the dramatic Campodola syncline, easily viewed from the
      Campodola geological lookout. Running water did the rest: dissolution of limestone intercalated with
      slates opened cave systems, and at Val das Mouras sculpted a classic karst topography. Glacial cirques,
      moraines and till deposits record the passage of ancient ice sheets.


      The range also safeguards its own botanical archive: sediments in the Lagoa da Lucenza preserve fossil
      pollen that allows scientists to reconstruct the postglacial forest history of Courel.
    wildlife: >-
      The Devesa da Rogueira shelters roe deer, weasels, [European wildcats](/especie/felis_silvestris/),
      dormice, Iberian ribbed newts and Iberian frogs. Beside the Fonte do Cervo spring grows the
      insectivorous butterwort *Pinguicula grandiflora*: observe it without touching the plants or altering
      the flow of water.


      The Courel inventory extends far beyond. Amphibians include the golden-striped salamander; mammals
      feature the rare [Pyrenean desman](/especie/galemys_pyrenaicus/) and [Eurasian
      otter](/especie/lutra_lutra/); documented bats include the western barbastelle and [greater mouse-eared
      bat](/especie/myotis_myotis/); and invertebrates include the [stag beetle](/especie/lucanus_cervus/) and
      the Kerry slug (*Geomalacus maculosus*). Several plant micro-reserves safeguard threatened orchids and
      mountain endemics: Alto do Couto, Visuña, Monte do Cido and Alto da Pedra. For seasonal advice, inquire
      at the Moreda Nature Centre.
    visit: >-
      Begin at the Moreda Nature Interpretation Centre. Its permanent exhibition introduces the region, and
      environmental staff offer guidance on trails, permits and points of interest. Access is via Seoane do
      Courel toward Moreda; before entering the hamlet there is a small parking area beside the centre. From
      here departs a signposted trail with interpretive panels on the devesa's ecology: the opening stretch is
      easy and level, but the subsequent climb steepens considerably.


      The alternative entrance is via Alto do Couto, along the road connecting Seoane and Visuña. From there
      departs the linear Devesa da Rogueira trail, exploring the forest to its headwater springs and the Polín
      viewpoint: 8.8 km round trip, roughly three and a quarter hours, with moderate physical and navigational
      demand. You can continue on foot toward Visuña or start from Moreda. At the Alto do Couto micro-reserve,
      an interpretive board covers the flora and fauna of northern Courel.


      To deepen your geological understanding, the Quiroga Geological Museum explains the Campodola-Leixazós
      fold with rock samples, a Pleistocene gallery exploring glacial traces, fossils and a cave bear
      reconstruction. In Meiraos, the Cave Interpretation Centre occupies the former schoolhouse, detailing
      cavern distribution and past human use. The Paleozoic Villages trail links vernacular architecture with
      local stone types, while the Quiroga Ethnographic Museum covers traditional linen weaving, blacksmithing
      and chestnut cultivation.
    history: >-
      The range also preserves ancient human traces: an archaeological chasm yielded early human remains
      alongside bones of the aurochs. Courel possesses its own distinct voice in Galician literature, holding
      a central place in the poetry of Uxío Novoneyra, born in Parada de Moreda.


      Management of the SAC, which unites Courel and the adjacent Ancares range within the Natura 2000
      network, is guided by the Galician Natura network master plan, aiming to secure favourable conservation
      status and prevent habitat degradation. In Seoane, the University of Santiago de Compostela operates a
      scientific field station hosting university courses and research.
    before: >-
      The opening walk from Moreda is gentle, but the subsequent ascent becomes steep and demanding: tailor
      your outing to trail conditions and check the day's weather. The caves are fragile ecosystems subject to
      strict access controls: entry requires membership in the Galician Caving Federation or specific official
      permits.
    around: >-
      Just 5 km away, the [Fuentes del Narcea, Degaña e Ibias Natural Park and Muniellos
      Reserve](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) is Courel's closest neighbour in the
      atlas. Further afield, other sites share species and habitats: the [Kvačianska and Prosiecka Karst
      Valleys](/lugar/npr-kvacianska-a-prosiecka-dolina/) share the barbastelle, greater mouse-eared bat and
      otter within mature woodland and river corridors; and the [Hoces del Alto Ebro y Rudrón Natural
      Park](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) shares the desman and otter in rich riparian
      settings.
  fr:
    intro: >-
      Il y a des montagnes que l'on contemple de loin et d'autres qui se lisent de près. La Serra do Courel
      appartient à ces dernières : un territoire montagneux du sud-est de Lugo, entre Folgoso do Courel et
      Quiroga, structuré par la rivière Lor, couronné de sommets comme Formigueiros, Montouto et Pía Paxaro,
      et abritant une forêt remarquable, la Devesa da Rogueira, qui réclame une marche lente. C'est un lieu où
      marier botanique et géologie : une palette sylvestre exceptionnelle sur des roches qui content leur
      propre histoire. La sierra est plus intime que le géoparc des Montagnes d'O Courel et la ZSC
      Ancares-Courel qui l'englobent.
    landscape: >-
      Les montagnes du Courel se dressent à la frontière des influences climatiques atlantique et
      méditerranéenne, une dualité sensible sur chaque versant. Le Lor et ses affluents relient des vallées
      aux biotopes variés, tandis que la diversité lithologique renouvelle sans cesse la végétation. Calcaires
      et marbres engendrent des sols basiques où prospèrent hêtres et chênes verts à Moreda, Campelo,
      Vilasibil et Noceda. En fond de vallée du bas Lor s'étirent des aulnaies ; près de Moreda et Ferreirós
      de Abaixo s'épanouissent des frênaies. Sur les crêtes dominent les landes à bruyère rouge et les genêts.
      Le couloir fluvial du Sil a en outre favorisé la pénétration du ciste, de la lavande touffue, du chêne
      vert et du chêne-liège, composant une mosaïque forestière saisissante.


      Sous ce manteau végétal, la roche garde une histoire profonde. Les calcaires ordoviciens sont issus
      d'anciens récifs marins coralliens. Bien plus tard, lors de l'orogenèse varisque, la collision entre
      Gondwana et Laurussia a plissé les strates pour créer le spectaculaire pli synclinal de Campodola, que
      l'on admire depuis le belvédère géologique de Campodola. L'eau a parachevé l'œuvre : la dissolution des
      calcaires intercalés de schistes a ouvert des réseaux de grottes, et au Val das Mouras le relief
      karstique témoigne de cette dissolution. Cirques, moraines et sédiments morainiques attestent enfin le
      passage des anciens glaciers.


      La sierra abrite sa propre archive pollinique : les tourbières de la Lagoa da Lucenza ont conservé le
      pollen permettant de reconstituer l'histoire postglaciaire de la flore du Courel.
    wildlife: >-
      Dans la Devesa da Rogueira vivent chevreuils, belettes, [chats sauvages](/especie/felis_silvestris/),
      loirs, tritons ibériques et grenouilles ibériques. Près de la source Fonte do Cervo pousse la grassette
      carnivore *Pinguicula grandiflora* : observez-la sans cueillir les tiges ni troubler l'eau.


      L'inventaire faunistique s'étend bien au-delà. Parmi les amphibiens figure le chiroglosse ibérique ;
      chez les mammifères, le rare desman des Pyrénées [Galemys pyrenaicus](/especie/galemys_pyrenaicus/) et
      la [loutre d'Europe](/especie/lutra_lutra/) ; parmi les chauves-souris, la barbastelle d'Europe et le
      [grand murin](/especie/myotis_myotis/) ; et chez les invertébrés, le [lucane
      cerf-volant](/especie/lucanus_cervus/) et la limace léopard *Geomalacus maculosus*. Plusieurs
      microréserves botaniques protègent orchidées et endémiques d'altitude : Alto do Couto, Visuña, Monte do
      Cido et Alto da Pedra. Pour choisir la saison de visite, renseignez-vous à la Maison de la Nature de
      Moreda.
    visit: >-
      Commencez par la Maison de la Nature de Moreda. Son exposition permanente décrit le milieu et les
      animateurs vous aideront à choisir itinéraires et points d'intérêt. On y accède depuis Seoane do Courel
      vers Moreda ; avant l'entrée du hameau, un espace permet de se garer. De là part un sentier balisé
      jalonné de panneaux sur la flore de la devesa : la première partie est facile et plate, mais la montée
      ultérieure devient exigeante.


      L'autre accès s'effectue par l'Alto do Couto, sur la route reliant Seoane à Visuña. De ce col démarre le
      sentier linéaire de la Devesa da Rogueira, qui explore la forêt jusqu'aux sources et au belvédère de
      Polín : 8,8 km aller-retour, environ trois heures et quart de marche, de difficulté moyenne. On peut
      poursuivre à pied vers Visuña ou partir de Moreda. À la microréserve d'Alto do Couto, un panneau
      présente la faune et la flore du nord du Courel.


      Pour approfondir la lecture du paysage, le Musée géologique de Quiroga détaille le pli de
      Campodola-Leixazós avec échantillons minéraux, une salle du Pléistocène sur les traces glaciaires,
      fossiles et reconstitution d'ours des cavernes. À Meiraos, le Centre d'interprétation des Grottes occupe
      l'ancienne école et détaille la spéléologie locale. La route des Villages paléozoïques relie
      architecture vernaculaire et pierres locales, tandis que le Musée ethnographique de Quiroga présente
      tissage du lin, forges et culture de la châtaigne.
    history: >-
      La montagne recèle également un passé humain ancien : dans un gouffre, des ossements humains ancestraux
      ont été découverts aux côtés de restes d'aurochs. Le Courel possède une place illustre dans la
      littérature galicienne à travers les vers d'Uxío Novoneyra, né à Parada de Moreda.


      La gestion de la ZSC, englobant le Courel et les monts Ancares au sein du réseau Natura 2000, repose sur
      le plan directeur galicien de la nature, qui veille au maintien des habitats. À Seoane, la station
      scientifique universitaire accueille cours et recherches sur le terrain.
    before: >-
      La portion initiale depuis Moreda est aisée, mais l'ascension devient ardue par la suite : adaptez votre
      équipement et vérifiez la météo. Les grottes sont des écosystèmes vulnérables : l'exploration
      souterraine requiert l'adhésion à la fédération de spéléologie ou des autorisations spécifiques.
    around: >-
      À seulement 5 km, le [parc naturel de Fuentes del Narcea, Degaña e Ibias et réserve de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) constitue le voisin le plus proche du
      Courel dans l'atlas. Plus loin, d'autres sites partagent espèces et biotopes : les [vallées karstiques
      de Prosiecka et Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) abritent barbastelle, grand murin
      et loutre en milieu forestier et riparial ; et le [parc naturel des gorges du Haut-Èbre et du
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) accueille desman et loutre.
  de:
    intro: >-
      Es gibt Gebirgszüge, die man aus der Ferne bewundert, und solche, die man aus der Nähe liest. Die Serra
      do Courel gehört zu den letzteren: ein Gebirgsland im Südosten von Lugo zwischen Folgoso do Courel und
      Quiroga, durchzogen vom Fluss Lor, mit Gipfeln wie Formigueiros, Montouto und Pía Paxaro sowie einem
      Wald, der Devesa da Rogueira, der zu achtsamen Schritten einlädt. Hier verbinden sich Botanik und
      Geologie: eine erstaunliche Baumvielfalt auf Gesteinen, die eine eigene Erdgeschichte erzählen. Das
      Bergland ist kleinräumiger als der Geopark Montañas do Courel und das FFH-Gebiet Ancares-Courel, die es
      umschließen.
    landscape: >-
      Die Berge von Courel liegen an der Nahtstelle zwischen atlantischem und mediterranem Klimaraum, was an
      jedem Hang spürbar wird. Der Lor und seine Zuflüsse verknüpfen Täler unterschiedlicher Ökosysteme,
      während die Gesteinsvielfalt die Pflanzendecke prägt. Kalke und Marmore schaffen basische Böden, auf
      denen Buchen und Steineichen bei Moreda, Campelo, Vilasibil und Noceda gedeihen. An den Ufern des
      unteren Lor wachsen Erlenauen; bei Moreda und Ferreirós de Abaixo breiten sich Eschenwälder aus. In den
      Hochlagen herrschen Zwergstrauchheiden vor, namentlich Rote Heide und Ginsterbuschwerk. Über den
      Sil-Korridor drangen zudem Zistrosen, Schopflavendel, Steineichen und Korkeichen ein und bildeten ein
      abwechslungsreiches Waldmosaik.


      Unter dieser Pflanzendecke birgt das Gestein Jahrmillionen Erdgeschichte. Ordovizische Kalke entstanden
      aus fossilen Meeresriffen. Viel später, während der variszischen Orogenese, faltete die Kollision von
      Gondwana und Laurussia die Sedimente und schuf die markante Campodola-Synklinale, die vom Aussichtspunkt
      Campodola zu überblicken ist. Das Wasser tat ein Übriges: Die Lösung von Wechsellagerungen aus Kalken
      und Schiefern bildete Höhlensysteme, und im Val das Mouras formte die Verkarstung eine bizarre
      Felslandschaft. Karräume, Moränen und Glazialsedimente bezeugen zudem einstige Vergletscherungen.


      Das Gebirge hütet sein botanisches Gedächtnis: Seesedimente der Lagoa da Lucenza bergen fossilen Pollen,
      mit dem sich die nacheiszeitliche Vegetationsgeschichte von Courel rekonstruieren lässt.
    wildlife: >-
      In der Devesa da Rogueira leben Rehe, Wiesel, [Wildkatzen](/especie/felis_silvestris/), Siebenschläfer,
      Spanische Rippenmolche und Spanische Frösche. An der Quelle Fonte do Cervo wächst das insektenfressende
      Große Fettkraut *Pinguicula grandiflora*: Bitte beobachten, ohne die Pflanzen zu berühren oder das
      Quellwasser zu stören.


      Die Artenliste reicht weit darüber hinaus. Unter den Amphibien kommt der Goldstreifen-Salamander vor;
      bei den Säugetieren der seltene [Pyrenäen-Desman](/especie/galemys_pyrenaicus/) und der [Eurasische
      Fischotter](/especie/lutra_lutra/); unter den Fledermäusen Mopsfledermaus und [Großes
      Mausohr](/especie/myotis_myotis/); bei den Wirbellosen der [Hirschkäfer](/especie/lucanus_cervus/) und
      die Schnegelart *Geomalacus maculosus*. Mehrere botanische Mikroreservate sichern gefährdete Orchideen
      und Gebirgsarten: Alto do Couto, Visuña, Monte do Cido und Alto da Pedra. Für jahreszeitliche
      Empfehlungen empfiehlt sich ein Besuch im Naturzentrum Moreda.
    visit: >-
      Starte im Naturzentrum Moreda (Aula da Natureza). Die Dauerausstellung veranschaulicht die Landschaft,
      und Umweltpädagogen beraten zu Routen, Genehmigungen und Zielen. Die Anfahrt führt von Seoane do Courel
      Richtung Moreda; vor dem Ortseingang gibt es Parkmöglichkeiten am Zentrum. Von dort führt ein
      beschilderter Lehrpfad in die Devesa: Der Auftakt ist eben und einfach, der spätere Anstieg erfordert
      jedoch Ausdauer.


      Ein alternativer Ausgangspunkt ist der Pass Alto do Couto an der Straße zwischen Seoane und Visuña. Von
      dort führt der lineare Wanderweg der Devesa da Rogueira zu den Quellfassungen und zum Aussichtspunkt
      Polín: 8,8 km hin und zurück, rund dreieinviertel Stunden Gehzeit mit mittlerem Anspruch. Man kann zu
      Fuß nach Visuña weitergehen oder in Moreda beginnen. Im Mikroreservat Alto do Couto erläutert eine
      Schautafel Flora und Fauna des nördlichen Courel.


      Zur Vertiefung bietet das Geologische Museum Quiroga Einblicke in die Campodola-Falte mit
      Gesteinsproben, eine Pleistozän-Ausstellung zu Glazialspuren, Fossilien und die Rekonstruktion eines
      Höhlenbären. In Meiraos informiert das Höhlenzentrum über Höhlensysteme und Höhlenbewohner. Die Route
      der Paläozoischen Dörfer verknüpft traditionelle Bauweise mit lokalem Naturstein, und das Heimatmuseum
      Quiroga dokumentiert Leinenweberei, Schmiedekunst und Kastanienwirtschaft.
    history: >-
      Das Gebirge besitzt eine uralte Siedlungsgeschichte: In einer Karsthöhle wurden prähistorische Knochen
      zusammen mit Auerochsenskeletten geborgen. Courel hat zudem eine feste Stimme in der galicischen
      Literatur und steht im Mittelpunkt des dichterischen Werks von Uxío Novoneyra, geboren in Parada de
      Moreda.


      Die Betreuung des Schutzgebiets, das Courel und die Ancares-Berge im Netz Natura 2000 bündelt, richtet
      sich nach dem galicischen Natura-Masterplan zur Erhaltung und Wiederherstellung wertvoller Biotope. In
      Seoane betreibt die Universität Santiago de Compostela eine biologische Forschungsstation.
    before: >-
      Der Einstieg ab Moreda ist gemächlich, der weitere Aufstieg jedoch steil und steinig: Passe Schuhwerk
      und Route an die Witterung an. Die Höhlen sind empfindliche Biotope: Ein Betreten erfordert die
      Mitgliedschaft im Höhlenforscherverband oder Sondergenehmigungen.
    around: >-
      Nur 5 km entfernt bildet der [Naturpark Fuentes del Narcea, Degaña e Ibias und das
      Muniellos-Reservat](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) den nächsten Nachbarn im
      Atlas. Weiter entfernt teilen andere Gebiete Arten und Biotope: Die [Karsttäler Kvačianska und
      Prosiecka](/lugar/npr-kvacianska-a-prosiecka-dolina/) teilen Mopsfledermaus, Großes Mausohr und
      Fischotter in naturnahen Waldschluchten; der [Naturpark Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) teilt Desman und Fischotter an klaren
      Flüssen.
  it:
    intro: >-
      Ci sono montagne che si guardano da lontano e altre che si leggono da vicino. La Serra do Courel
      appartiene a queste ultime: un territorio montano nel sud-est di Lugo, tra Folgoso do Courel e Quiroga,
      solcato dal fiume Lor, con vette come Formigueiros, Montouto e Pía Paxaro, e un bosco, la Devesa da
      Rogueira, che invita a camminare con passo lento. È un luogo dove unire botanica e geologia: una
      straordinaria varietà di alberi su rocce che raccontano la propria storia. La sierra è più raccolta
      rispetto al geoparco delle Montagne di O Courel e alla ZSC Ancares-Courel che la comprendono.
    landscape: >-
      I monti del Courel si collocano al confine tra i domini climatici atlantico e mediterraneo, e questo
      contrasto emerge su ogni versante. Il Lor e i suoi affluenti collegano valli dagli ecosistemi diversi,
      mentre la varietà geologica arricchisce continuamente la flora. Calcari e marmi generano suoli basici su
      cui allignano faggi e lecci a Moreda, Campelo, Vilasibil e Noceda. Lungo le sponde del basso Lor
      crescono ontanete; presso Moreda e Ferreirós de Abaixo prosperano frassineti. Sulle creste dominano le
      brughiere montane, in particolare erica rossa e ginestrete. Il corridoio fluviale del Sil ha inoltre
      favorito l'ingresso di cisti, lavanda selvatica, lecci e querce da sughero, intessendo un suggestivo
      mosaico forestale.


      Sotto questa volta verde, le rocce custodiscono un'antica cronologia. I calcari ordoviciani derivano da
      remote barriere coralline marine. Molto tempo dopo, durante l'orogenesi varisica, la collisione tra
      Gondwana e Laurussia piegò gli strati dando origine alla celebre sinclinale di Campodola, ammirabile dal
      belvedere geologico di Campodola. L'acqua ha fatto il resto: la dissoluzione dei calcari intercalati a
      lavagne ha scavato sistemi di grotte, e a Val das Mouras il paesaggio carsico testimonia questa stessa
      erosione. Circhi glaciali, morene e depositi di till documentano il passaggio degli antichi ghiacciai.


      La sierra custodisce un proprio archivio pollinico: i sedimenti della Lagoa da Lucenza conservano
      pollini fossili che consentono di ricostruire la storia vegetazionale postglaciale del Courel.
    wildlife: >-
      Nella Devesa da Rogueira vivono caprioli, donnole, [gatti selvatici](/especie/felis_silvestris/), ghiri,
      tritoni iberici e rane iberiche. Presso la sorgente di Fonte do Cervo cresce l'erba unta carnivora
      *Pinguicula grandiflora*: osservala senza toccare le piante né alterare l'acqua.


      L'elenco faunistico riserva molte altre presenze. Tra gli anfibi figura la salamandra striata; tra i
      mammiferi, il raro desman pirenaico [*Galemys pyrenaicus*](/especie/galemys_pyrenaicus/) e la [lontra
      europea](/especie/lutra_lutra/); tra i chirotteri censiti, la barbastella e il [*Myotis
      myotis*](/especie/myotis_myotis/); e tra gli invertebrati, il [cervo volante](/especie/lucanus_cervus/)
      e la lumaca pezzata *Geomalacus maculosus*. Diverse microriserve botaniche tutelano orchidee e piante
      montane protette: Alto do Couto, Visuña, Monte do Cido e Alto da Pedra. Per consigli sul periodo
      migliore, rivolgiti all'Aula della Natura di Moreda.
    visit: >-
      Inizia dall'Aula della Natura di Moreda. La sua mostra permanente descrive il comprensorio e il
      personale didattico aiuta a pianificare itinerari, permessi e mete d'interesse. L'accesso avviene da
      Seoane do Courel verso Moreda; prima dell'abitato c'è un piccolo parcheggio accanto alla struttura. Da
      qui parte un sentiero segnalato con pannelli didattici sulla devesa: il tratto iniziale è agevole e
      pianeggiante, ma la salita successiva diventa impegnativa.


      L'altro accesso principale è dall'Alto do Couto, lungo la carrozzabile tra Seoane e Visuña. Da lì si
      snoda il percorso lineare della Devesa da Rogueira, che esplora la foresta sino alle sorgenti sommitali
      e al belvedere di Polín: 8,8 km tra andata e ritorno, circa tre ore e un quarto, con difficoltà media. È
      possibile proseguire a piedi verso Visuña o partire da Moreda. Nella microriserva di Alto do Couto un
      pannello illustra flora e fauna dell'area settentrionale.


      Per arricchire la comprensione geologica, il Museo Geologico di Quiroga illustra la piega di
      Campodola-Leixazós con campioni di rocce, una sala sul Pleistocene dedicata alle impronte glaciali,
      fossili e una ricostruzione dell'orso delle caverne. A Meiraos, il Centro d'Interpretazione delle Grotte
      occupa la vecchia scuola e illustra la speleologia locale. L'itinerario dei Borghi Paleozoici collega
      l'architettura in pietra ai materiali locali, mentre il Museo Etnografico di Quiroga documenta tessitura
      del lino, fucine e castanicoltura.
    history: >-
      La montagna conserva pure una remota memoria antropica: in un inghiottitoio carsico sono stati rinvenuti
      scheletri umani antichissimi accanto a resti di uro. Il Courel vanta una voce lirica d'eccezione nella
      poesia galiziana, occupando un ruolo centrale nell'opera di Uxío Novoneyra, nato a Parada de Moreda.


      La gestione della ZSC, che accorpa Courel e monti Ancares nella rete Natura 2000, si fonda sul Piano
      Direttore della rete ecologica galiziana per salvaguardare gli habitat. A Seoane, l'Università di
      Santiago de Compostela gestisce una stazione di ricerca scientifica per corsi accademici e studi di
      campo.
    before: >-
      Il tratto iniziale da Moreda è facile, ma la salita successiva si fa ripida e impegnativa: adatta
      l'escursione alle condizioni del terreno e meteo. Le grotte sono ambienti vulnerabili: l'accesso
      sotterraneo richiede l'iscrizione alla federazione speleologica o specifici permessi autorizzativi.
    around: >-
      A soli 5 km, il [Parco naturale Fuentes del Narcea, Degaña e Ibias e Riserva di
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) costituisce il vicino più immediato
      del Courel nell'atlante. Più distanti, altre riserve condividono specie e habitat: le [Valli carsiche di
      Prosiecka e Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) ospitano barbastella, vespertilio
      maggiore e lontra in forre boscose; il [Parco naturale Gole dell'Alto Ebro e
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) condivide il desman e la lontra lungo fiumi
      limpidi.
  pt:
    intro: >-
      Há serras que se contemplam de longe e outras que se leem de perto. A Serra do Courel é das segundas: um
      território montanhoso no sudeste de Lugo, entre Folgoso do Courel e Quiroga, articulado pelo rio Lor,
      com cumes como Formigueiros, Montouto e Pía Paxaro, e uma mata notável, a Devesa da Rogueira, que pede
      um caminhar pausado. É um espaço onde se cruzam botânica e geologia: árvores de grande diversidade sobre
      rochas com narrativa própria. A serra é mais recolhida do que o geoparque das Montanhas de O Courel e a
      ZEC Ancares-Courel que a integram.
    landscape: >-
      As montanhas do Courel erguem-se na transição entre os domínios climáticos atlântico e mediterrânico,
      contraste bem visível em cada encosta. O Lor e os seus afluentes enlaçam vales de ecossistemas
      distintos, enquanto a variedade litológica renova a vegetação. Calcários e mármores geram solos básicos
      onde vingam faias e azinheiras em Moreda, Campelo, Vilasibil e Noceda. Nas margens do baixo Lor
      despontam amiais; junto a Moreda e Ferreirós de Abaixo florescem freixiais. Nos cimos dominam os matos,
      mormente urzais de urze-vermelha e giestais. Pelo corredor do Sil penetraram estevas, rosmaninho,
      azinheiras e sobreiros, tecendo um complexo mosaico florestal.


      Sob esta mancha vegetal, as rochas guardam uma história profunda. Os calcários ordovícicos nasceram de
      antigos recifes marinhos. Muito depois, durante a orogenia varisca, a colisão entre a Gondwana e a
      Laurússia dobrou os estratos e gerou a célebre dobra de Campodola, admirável a partir do miradouro
      geológico de Campodola. A água encarregou-se do resto: a dissolução dos calcários intercalados com
      xistos abriu redes de grutas, e em Val das Mouras o relevo cársico documenta essa mesma ação erosiva.
      Circos, moreias e sedimentos glaciários testemunham a passagem dos antigos glaciares.


      A serra guarda o seu próprio arquivo palinológico: os sedimentos da Lagoa da Lucenza conservam pólen
      fóssil que permite reconstituir a evolução pós-glaciar da vegetação do Courel.
    wildlife: >-
      Na Devesa da Rogueira vivem corços, doninhas, [gatos-bravos](/especie/felis_silvestris/), arganazes,
      tritões-de-ventre-laranja e rãs-ibéricas. Junto à nascente da Fonte do Cervo cresce a planta insetívora
      *Pinguicula grandiflora*: contempla-a sem tocar nos exemplares nem turvar a água.


      O elenco faunístico é rico. Entre os anfíbios regista-se a salamandra-lusitânica; nos mamíferos, a rara
      [toupeira-da-água](/especie/galemys_pyrenaicus/) e a [lontra-europeia](/especie/lutra_lutra/); entre os
      morcegos inventariados, o morcego-borboleta e o [*Myotis myotis*](/especie/myotis_myotis/); e nos
      invertebrados, a [vaca-loura](/especie/lucanus_cervus/) e a lesma-armada *Geomalacus maculosus*.
      Diversas microrreservas botânicas conservam orquídeas e endemismos de montanha: Alto do Couto, Visuña,
      Monte do Cido e Alto da Pedra. Para escolher a melhor época, informa-te na Aula da Natureza de Moreda.
    visit: >-
      Começa pela Aula da Natureza de Moreda. A exposição permanente explica o meio envolvente e os monitores
      apoiam na orientação de percursos, autorizações e pontos de interesse. O acesso faz-se a partir de
      Seoane do Courel rumo a Moreda; antes de entrar na aldeia há estacionamento junto ao centro. Daí parte
      um trilho sinalizado com painéis sobre a biologia da devesa: o troço inicial é plano e acessível, mas a
      subida seguinte ganha inclinação acentuada.


      A outra entrada faz-se pelo Alto do Couto, na estrada entre Seoane e Visuña. De lá sai a rota linear da
      Devesa da Rogueira, que percorre a mata até às nascentes e ao miradouro de Polín: 8,8 km de ida e volta,
      cerca de três horas e um quarto, com exigência média. Podes continuar a pé rumo a Visuña ou partir de
      Moreda. Na microrreserva do Alto do Couto, um painel ilustra a fauna e a flora do norte do Courel.


      Para enriquecer a leitura da paisagem, o Museu Geológico de Quiroga explora a dobra de
      Campodola-Leixazós com amostras de rochas, uma sala do Plistoceno sobre marcas glaciares, fósseis e
      réplica de urso-das-cavernas. Em Meiraos, o Centro de Interpretação das Grutas ocupa a antiga escola e
      aborda a espeleologia regional. A rota das Aldeias Paleozóicas associa a traça arquitetónica às rochas
      locais, enquanto o Museu Etnográfico de Quiroga retrata o linho, as forjas e o cultivo da castanha.
    history: >-
      A serra conserva uma remota ocupação humana: num algar descobriram-se ossadas humanas antigas ao lado de
      restos de auroque. O Courel tem ainda presença singular na literatura galega, assumindo papel cimeiro na
      poesia de Uxío Novoneyra, nascido em Parada de Moreda.


      A gestão da ZEC, que reúne o Courel e os Ancares na rede Natura 2000, apoia-se no Plano Diretor da rede
      Natura galega para preservar os habitats. Em Seoane, a Universidade de Santiago de Compostela mantém uma
      estação científica aberta a estágios e investigações.
    before: >-
      A parte inicial a partir de Moreda é suave, mas o desnível acentua-se depois: calça calçado firme e
      consulta a meteorologia. As grutas são meios frágeis: o acesso subterrâneo requer filiação na federação
      de espeleologia ou autorizações específicas.
    around: >-
      A apenas 5 km, o [Parque Natural de Fuentes del Narcea, Degaña e Ibias e Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) forma o vizinho mais próximo do Courel
      no atlas. Mais longe, outros sítios partilham espécies e biótopos: os [Vales Cársicos de Prosiecka e
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) partilham o morcego-borboleta, o
      morcego-rato-grande e a lontra em gargantas arborizadas; e o [Parque Natural Hoces del Alto Ebro y
      Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) partilha a toupeira-da-água e a lontra.
