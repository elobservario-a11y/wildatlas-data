unico:
  es: Una turbera que fue «oro» para los turberos y vuelve a ser hogar de grullas y de gansos invernantes.
  en: A bog that was «gold» to peat cutters and is once again home to common cranes and wintering geese.
  fr: >-
    Une tourbière qui fut « de l'or » pour les tourbiers et redevient le foyer des grues et des oies
    hivernantes.
  de: Ein Moor, das für die Torfstecher «Gold» war und wieder Heimat für Kraniche und überwinternde Gänse wird.
  it: Una torbiera che fu «oro» per i cavatori di torba e torna a essere casa di gru e di oche svernanti.
  pt: Uma turfeira que foi «ouro» para os turfeiros e volta a ser lar de grous e de gansos invernantes.
observaciones:
  es: >-
    En la temporada de cría se cierran partes de la Deurnsche Peel, incluida la zona central, y de la
    Mariapeel. Del 15 de octubre al 30 de noviembre y en invierno hay cierres por el paso migratorio y por los
    gansos invernantes. Las rutas marcadas desde el aparcamiento De Halte y en el Broemeerbos siguen abiertas
    durante esos cierres. Lleva botas o zapatos impermeables: el terreno es húmedo.
texto:
  es:
    intro: >-
      Hasta mediados del siglo XIX, la Deurnese Peel era una gran llanura de turbera viva. Hoy lo que ves es
      el segundo acto: un paisaje de agua, brezales, lomas arenosas, abedules y claros de molinia, en el
      límite entre Brabante Septentrional y Limburgo. Mariapeel, Deurnsche Peel y el parque nacional Groote
      Peel forman, juntos, un gran pantano.


      La historia está en el suelo. Los turberos excavaron la mayor parte y vendieron la turba como «el oro de
      la Peel»; las huellas se ven por todas partes. Lo que quedó, con el tiempo, se ha devuelto a la
      naturaleza, y la prueba más vistosa llegó en 2022: la [grulla común](/especie/grus_grus/) sacó adelante
      un pollo por primera vez en la Deurnsche Peel.
    landscape: >-
      Tras la extracción de turba, la Deurnsche Peel quedó como una isla rodeada de tierras agrícolas
      drenadas. Por eso se ha ido secando y recibe mucho nitrógeno. Hoy el objetivo es devolverle agua, y
      entre 2021 y 2023 se restauraron casi 1000 hectáreas de turbera, con 40 km de diques y 180 hectáreas de
      antiguo cultivo decapadas. Se procura además que el nivel del agua sea lo más estable posible, para que
      crezca el musgo de turbera.


      La zona al este del Kanaal van Deurne es la más virgen y se considera el área salvaje por excelencia:
      está abierta al público, pero tiene pocos senderos y las botas son imprescindibles. En el Mariapeel hay
      tres complejos, Mariaveen, Driehonderd Bunder y Horster Driehoek. Allí, en 1716, se trazó entre dos
      grandes lagunas la frontera entre Brabante y Limburgo, y aún queda un mojón. La Mariapeel se libró por
      poco de una gran roturación cuando estalló la Segunda Guerra Mundial.
    wildlife: >-
      En el invierno llegan los gansos. Entre mediados de noviembre y finales de febrero se observan gansos
      invernantes, como el ánsar careto, el ánsar campestre de la tundra y el ánsar común. Por eso en el
      invierno la ruta roja de la Deurnsche Peel se cierra por los gansos invernantes.


      En primavera vuelven aves como el pechiazul, la buscarla pintoja y el escribano palustre. Crían unas 100
      especies, entre ellas el zarapito real y el rascón europeo; en las marismas, la cerceta común, el
      cuchara común y el zampullín común. La Deurnese Peel es un hábitat importante para libélulas, el tejón,
      la rana campestre y la culebra lisa.


      Lejos de las aves, en Mariaveen se reconstruyó un viejo redil para el rebaño de cabras neerlandesas, que
      ayudan a mantener corto el brezal.
    visit: >-
      El punto de partida es el Buitencentrum De Pelen, con exposiciones, de donde salen actividades y rutas.
      Allí empieza el familiepad amarillo, de 2 km, pavimentado, con una cabaña de observación y una torre
      accesibles en silla de ruedas.


      La Zon over de Peel pad sale de Griendtsveen, un pueblo monumental, pasa por el Kanaal van Deurne y una
      gran charca, y llega al borde de la turbera. La Turfjespad pasa por Griendtsveen, el camino de las
      monjas, y los restos de una fábrica de turba. Junto a la ruta está el Toon Kortooms Park, donde vivió la
      familia del escritor, hoy museo. El Mussenkeetpad cruza la Peel salvaje junto al canal, y la ruta roja
      pasa por un banco con forma de carro de turba. En Mariapeel, la ruta Mariapeel groen recorre lagunas
      ricas en aves y brezales ondulados que pastan cabras y vacas. Con un guía de la Peel se recorren
      pasarelas de madera y caminos antiguos y se aprende cómo se formó esta turbera.
    history: >-
      En 1853 el municipio de Deurne vendió una franja a Jan van de Griendt, que montó una explotación de
      turba a gran escala; así nació Helenaveen. La estación Halte Helenaveen, de 1868, fue hacia 1900 una de
      las estaciones de mercancías más activas del país, y quedó destruida en 1944. Frente al aparcamiento
      quedan los cimientos de una fábrica de mantillo de turba de hacia 1900.


      La Deurnsche Peel se declaró monumento natural protegido el 11 de diciembre de 1980 y la extracción de
      turba terminó poco después. Un grupo de voluntarios trabaja desde finales de los años setenta para
      evitar que se cierre de abedules. Es una zona Natura 2000.
    before: >-
      En la temporada de cría se cierran partes de la Deurnsche Peel, incluida la zona central, y de la
      Mariapeel. Del 15 de octubre al 30 de noviembre y en invierno hay cierres por el paso migratorio y por
      los gansos invernantes. Las rutas marcadas desde el aparcamiento De Halte y en el Broemeerbos siguen
      abiertas durante esos cierres. Lleva botas o zapatos impermeables: el terreno es húmedo.
    around: >-
      A catorce kilómetros está el [Parque de la Frontera Kempen~Broek](/lugar/grenspark-kempen-broek/), a
      veintitrés [De Maashorst](/lugar/de-maashorst/) y a veintiocho la [Puerta de Güeldres / Corredor del
      Rin](/lugar/gelderse-poort/). Más lejos, la [Reserva Natural de
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) y los [Humedales de
      Diepholz](/lugar/diepholzer-moorniederung/) comparten con la Deurnsche Peel la grulla común.
  en:
    intro: >-
      Until the mid-nineteenth century, Deurnese Peel was a vast plain of living raised bog. Today what you
      see is the second act: a landscape of water, heathlands, sandy rises, birches and purple moor-grass
      clearings, on the border between North Brabant and Limburg. Together, Mariapeel, Deurnsche Peel and
      Groote Peel National Park form one great mire.


      The history lies in the soil. Peat cutters dug out most of it and sold the peat as «Peel gold»; the
      traces are everywhere. What remained was gradually given back to nature, and the most visible proof came
      in 2022: the [common crane](/especie/grus_grus/) successfully raised a chick for the first time in
      Deurnsche Peel.
    landscape: >-
      After peat extraction, Deurnsche Peel was left like an island surrounded by drained farmland. Because of
      that it has been drying out and receives a great deal of nitrogen. Today the aim is to bring water back,
      and between 2021 and 2023 nearly 1,000 hectares of bog were restored, with 40 km of bunds and 180
      hectares of former farmland stripped of topsoil. Care is also taken to keep the water level as stable as
      possible so bog moss can grow.


      The area east of the Kanaal van Deurne is the wildest and is regarded as the wilderness sector par
      excellence: it is open to the public, though it has few trails and boots are essential. In Mariapeel
      there are three complexes: Mariaveen, Driehonderd Bunder and Horster Driehoek. There, in 1716, the
      border between Brabant and Limburg was drawn between two large pools, and a boundary stone still stands.
      Mariapeel narrowly escaped large-scale reclamation when the Second World War broke out.
    wildlife: >-
      In winter the geese arrive. Between mid-November and late February wintering geese are seen, including
      greater white-fronted goose, tundra bean goose and greylag goose. That is why in winter the red trail in
      Deurnsche Peel closes for the wintering geese.


      In spring birds return, such as bluethroat, Savi's warbler and reed bunting. Around 100 species breed,
      among them Eurasian curlew and water rail; on the marshes, Eurasian teal, northern shoveler and little
      grebe. Deurnese Peel is an important habitat for dragonflies, European badger, moor frog and smooth
      snake.


      Away from the birds, an old sheepfold was rebuilt in Mariaveen for a flock of Dutch Landrace goats,
      which help keep the heathland short.
    visit: >-
      The starting point is the Buitencentrum De Pelen, with exhibitions, from which activities and trails
      depart. The yellow familiepad starts there, 2 km long and paved, with a wheelchair-accessible
      observation hut and tower.


      The Zon over de Peel pad starts in Griendtsveen, a heritage village, passes the Kanaal van Deurne and a
      large pool, and reaches the edge of the bog. The Turfjespad runs past Griendtsveen, the nuns' path and
      the remains of a peat factory. Beside the route stands Toon Kortooms Park, where the writer's family
      lived, now a museum. The Mussenkeetpad crosses the wild Peel along the canal, and the red trail passes a
      bench shaped like a peat cart. In Mariapeel, the Mariapeel groen route winds past bird-rich pools and
      undulating heathland grazed by goats and cattle. With a Peel guide you walk wooden boardwalks and old
      tracks and learn how this bog was formed.
    history: >-
      In 1853 the municipality of Deurne sold a strip of land to Jan van de Griendt, who set up large-scale
      peat extraction; thus Helenaveen was born. The Halte Helenaveen station, built in 1868, was by around
      1900 one of the busiest freight stations in the country, and was destroyed in 1944. Opposite the car
      park stand the foundations of a peat-litter factory from around 1900.


      Deurnsche Peel was declared a protected natural monument on 11 December 1980 and peat cutting ended
      shortly afterwards. A volunteer group has worked since the late seventies to stop birch scrub from
      closing in. It is a Natura 2000 site.
    before: >-
      During the breeding season parts of Deurnsche Peel, including the central zone, and Mariapeel are
      closed. From 15 October to 30 November and in winter there are closures for bird migration and wintering
      geese. The waymarked trails from the De Halte car park and in Broemeerbos stay open during those
      closures. Wear boots or waterproof shoes: the ground is wet.
    around: >-
      Fourteen kilometres away lies [Kempen~Broek Cross-Border Park](/lugar/grenspark-kempen-broek/),
      twenty-three kilometres away is [De Maashorst](/lugar/de-maashorst/), and twenty-eight kilometres away
      is [Gelderse Poort / Rhine Corridor](/lugar/gelderse-poort/). Further afield, [Fochteloërveen Nature
      Reserve](/lugar/fochteloorveen---natuurreservaat/) and [Diepholz
      Moorland](/lugar/diepholzer-moorniederung/) share the common crane with Deurnsche Peel.
  fr:
    intro: >-
      Jusqu'au milieu du dix-neuvième siècle, la Deurnese Peel était une vaste plaine de tourbière vivante. Ce
      que vous voyez aujourd'hui est le deuxième acte : un paysage d'eau, de landes, de buttes sableuses, de
      bouleaux et de clairières à molinie, à la limite entre le Brabant-Septentrional et le Limbourg.
      Mariapeel, Deurnsche Peel et le parc national Groote Peel forment ensemble un grand marais.


      L'histoire est dans le sol. Les tourbiers en ont creusé la majeure partie et vendu la tourbe comme «
      l'or de la Peel » ; les traces se voient partout. Ce qui est resté a été rendu à la nature avec le
      temps, et la preuve la plus éclatante est arrivée en 2022 : la [grue cendrée](/especie/grus_grus/) a
      mené un jeune à l'envol pour la première fois dans la Deurnsche Peel.
    landscape: >-
      Après l'extraction de la tourbe, la Deurnsche Peel est restée comme une île entourée de terres agricoles
      drainées. C'est pourquoi elle s'est asséchée et reçoit beaucoup d'azote. Aujourd'hui l'objectif est de
      lui rendre l'eau, et entre 2021 et 2023 près de 1 000 hectares de tourbière ont été restaurés, avec 40
      km de digues et 180 hectares d'anciennes cultures décapées. On veille aussi à garder le niveau d'eau
      aussi stable que possible pour que pousse la sphaigne.


      La zone à l'est du Kanaal van Deurne est la plus vierge et passe pour le secteur sauvage par excellence
      : elle est ouverte au public, mais compte peu de sentiers et les bottes sont indispensables. Dans la
      Mariapeel existent trois ensembles : Mariaveen, Driehonderd Bunder et Horster Driehoek. Là, en 1716, on
      traça entre deux grands étangs la frontière entre le Brabant et le Limbourg, et une borne subsiste
      encore. La Mariapeel échappa de peu à un grand défrichement lorsque éclata la Seconde Guerre mondiale.
    wildlife: >-
      En hiver arrivent les oies. Entre la mi-novembre et la fin février on observe des oies hivernantes,
      comme l'oie rieuse, l'oie des moissons de la toundra et l'oie cendrée. C'est pourquoi en hiver le
      sentier rouge de la Deurnsche Peel est fermé pour protéger les oies hivernantes.


      Au printemps reviennent des oiseaux comme la gorgebleue à miroir, la locustelle luscinioïde et le bruant
      des roseaux. Environ 100 espèces nichent, dont le courlis cendré et le râle d'eau ; dans les marais
      vivent la sarcelle d'hiver, le canard souchet et le grèbe castagneux. La Deurnese Peel est un habitat
      important pour les libellules, le blaireau, la grenouille des champs et la coronelle lisse.


      Loin des oiseaux, à Mariaveen on a reconstruit une vieille bergerie pour le troupeau de chèvres
      néerlandaises, qui aident à maintenir la lande rase.
    visit: >-
      Le point de départ est le Buitencentrum De Pelen, doté d'expositions, d'où partent activités et
      sentiers. Là commence le familiepad jaune, long de 2 km et revêtu, avec une cabane d'observation et une
      tour accessibles en fauteuil roulant.


      La Zon over de Peel pad part de Griendtsveen, un village classé, passe par le Kanaal van Deurne et une
      grande mare, et atteint le bord de la tourbière. La Turfjespad passe par Griendtsveen, le chemin des
      religieuses et les vestiges d'une usine de tourbe. Près du parcours se trouve le Toon Kortooms Park, où
      vécut la famille de l'écrivain, aujourd'hui musée. Le Mussenkeetpad traverse la Peel sauvage le long du
      canal, et le sentier rouge passe devant un banc en forme de chariot à tourbe. Dans la Mariapeel,
      l'itinéraire Mariapeel groen longe des étangs riches en oiseaux et des landes ondulées pâturées par des
      chèvres et des vaches. Avec un guide de la Peel, on parcourt des caillebotis en bois et d'anciens
      chemins tout en découvrant comment s'est formée cette tourbière.
    history: >-
      En 1853, la commune de Deurne vendit une bande de terrain à Jan van de Griendt, qui lança une
      exploitation de tourbe à grande échelle ; ainsi naquit Helenaveen. La gare Halte Helenaveen, de 1868,
      était vers 1900 l'une des gares de marchandises les plus actives du pays, et fut détruite en 1944. Face
      au parking subsistent les fondations d'une usine de litière de tourbe datant d'environ 1900.


      La Deurnsche Peel fut classée monument naturel protégé le 11 décembre 1980 et l'extraction de tourbe
      cessa peu après. Un groupe de bénévoles travaille depuis la fin des années soixante-dix pour éviter que
      les bouleaux ne referment le milieu. C'est un site Natura 2000.
    before: >-
      Pendant la saison de reproduction, des secteurs de la Deurnsche Peel, dont la zone centrale, et de la
      Mariapeel sont fermés. Du 15 octobre au 30 novembre et en hiver ont lieu des fermetures pour le passage
      migratoire et les oies hivernantes. Les sentiers balisés au départ du parking De Halte et dans le
      Broemeerbos restent ouverts durant ces fermetures. Portez des bottes ou des chaussures imperméables : le
      terrain est humide.
    around: >-
      À quatorze kilomètres se trouve le [Parc frontalier Kempen~Broek](/lugar/grenspark-kempen-broek/), à
      vingt-trois [De Maashorst](/lugar/de-maashorst/) et à vingt-huit la [Porte de Gueldre / Corridor du
      Rhin](/lugar/gelderse-poort/). Plus loin, la [Réserve naturelle de
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) et les [Zones humides de
      Diepholz](/lugar/diepholzer-moorniederung/) partagent avec la Deurnsche Peel la grue cendrée.
  de:
    intro: >-
      Bis zur Mitte des neunzehnten Jahrhunderts war die Deurnese Peel eine weite Ebene aus lebendem Hochmoor.
      Was du heute siehst, ist der zweite Akt: eine Landschaft aus Wasser, Heiden, Sandrücken, Birken und
      Pfeifengraslichtungen an der Grenze zwischen Nordbrabant und Limburg. Mariapeel, Deurnsche Peel und der
      Nationalpark Groote Peel bilden zusammen ein großes Moorgebiet.


      Die Geschichte liegt im Boden. Die Torfstecher haben den größten Teil abgegraben und den Torf als «Gold
      der Peel» verkauft; die Spuren sind überall sichtbar. Was blieb, wurde mit der Zeit der Natur
      zurückgegeben, und der sichtbarste Beweis kam 2022: Der [Kranich](/especie/grus_grus/) zog in der
      Deurnsche Peel erstmals ein Junges groß.
    landscape: >-
      Nach dem Torfabbau blieb die Deurnsche Peel wie eine Insel inmitten entwässerter Agrarflächen zurück.
      Deshalb trocknet sie allmählich aus und erhält viel Stickstoff. Heute soll ihr das Wasser zurückgegeben
      werden, und zwischen 2021 und 2023 wurden fast 1.000 Hektar Moor renaturiert, mit 40 km Dämmen und 180
      Hektar abgetragenem ehemaligen Ackerland. Zudem versucht man, den Wasserstand möglichst stabil zu
      halten, damit Torfmoos wächst.


      Der Bereich östlich des Kanaal van Deurne ist der unberührteste und gilt als Wildnisgebiet schlechthin:
      Er ist öffentlich zugänglich, hat aber wenige Wege, und Stiefel sind unverzichtbar. In der Mariapeel
      gibt es drei Teilbereiche: Mariaveen, Driehonderd Bunder und Horster Driehoek. Dort wurde 1716 zwischen
      zwei großen Seen die Grenze zwischen Brabant und Limburg gezogen, und ein Grenzstein steht noch immer.
      Die Mariapeel entging knapp einer großen Urbarmachung, als der Zweite Weltkrieg ausbrach.
    wildlife: >-
      Im Winter kommen die Gänse. Zwischen Mitte November und Ende Februar lassen sich überwinternde Gänse
      beobachten, darunter Blässgans, Tundrasaatgans und Graugans. Deshalb wird im Winter der rote Weg der
      Deurnsche Peel wegen der überwinternden Gänse gesperrt.


      Im Frühling kehren Vögel wie Blaukehlchen, Rohrschwirl und Rohrammer zurück. Rund 100 Arten brüten hier,
      darunter Großer Brachvogel und Wasserralle; in den Sümpfen Krickente, Löffelente und Zwergtaucher. Die
      Deurnese Peel ist ein wichtiger Lebensraum für Libellen, Dachs, Moorfrosch und Schlingnatter.


      Abseits der Vögel wurde in Mariaveen ein alter Schafstall für die Herde niederländischer Landziegen
      wiederaufgebaut, die helfen, die Heide kurz zu halten.
    visit: >-
      Ausgangspunkt ist das Buitencentrum De Pelen mit Ausstellungen, von dem Aktivitäten und Wege ausgehen.
      Dort beginnt der gelbe familiepad, 2 km lang und befestigt, mit einer rollstuhlgerechten
      Beobachtungshütte und einem Turm.


      Der Zon over de Peel pad startet in Griendtsveen, einem denkmalgeschützten Dorf, führt am Kanaal van
      Deurne und einem großen Tümpel vorbei und erreicht den Moorrand. Der Turfjespad führt durch
      Griendtsveen, über den Nonnenweg und an den Resten einer Torffabrik vorbei. Am Weg liegt der Toon
      Kortooms Park, wo die Familie des Schriftstellers lebte, heute ein Museum. Der Mussenkeetpad quert die
      wilde Peel am Kanal entlang, und der rote Weg führt an einer Bank in Form eines Torfwagens vorbei. In
      der Mariapeel führt die Route Mariapeel groen an vogelreichen Seen und welligen Heiden vorbei, auf denen
      Ziegen und Rinder weiden. Mit einem Peel-Führer begeht man Holzstege und alte Wege und erfährt, wie
      dieses Moor entstand.
    history: >-
      1853 verkaufte die Gemeinde Deurne einen Landstreifen an Jan van de Griendt, der einen groß angelegten
      Torfabbau aufbaute; so entstand Helenaveen. Der Bahnhof Halte Helenaveen von 1868 war um 1900 einer der
      aktivsten Güterbahnhöfe des Landes und wurde 1944 zerstört. Gegenüber dem Parkplatz liegen die
      Fundamente einer Torfstreufabrik von um 1900.


      Die Deurnsche Peel wurde am 11. Dezember 1980 zum geschützten Naturdenkmal erklärt, und der Torfabbau
      endete kurz darauf. Eine Freiwilligengruppe arbeitet seit Ende der siebziger Jahre daran, das Zuwachsen
      mit Birken zu verhindern. Es ist ein Natura-2000-Gebiet.
    before: >-
      In der Brutzeit werden Teile der Deurnsche Peel, einschließlich der Kernzone, und der Mariapeel
      gesperrt. Vom 15. Oktober bis 30. November und im Winter gibt es Sperrungen wegen des Vogelzugs und der
      überwinternden Gänse. Die markierten Wege ab dem Parkplatz De Halte und im Broemeerbos bleiben während
      dieser Sperrungen offen. Nimm Stiefel oder wasserdichte Schuhe mit: Das Gelände ist feucht.
    around: >-
      Vierzehn Kilometer entfernt liegt der [Grenzpark Kempen~Broek](/lugar/grenspark-kempen-broek/),
      dreiundzwanzig [De Maashorst](/lugar/de-maashorst/) und achtundzwanzig [Gelderse Poort /
      Rheinkorridor](/lugar/gelderse-poort/). Weiter entfernt teilen das [Naturschutzgebiet
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) und die [Diepholzer
      Moorniederung](/lugar/diepholzer-moorniederung/) mit der Deurnsche Peel den Kranich.
  it:
    intro: >-
      Fino alla metà del diciannovesimo secolo, la Deurnese Peel era una grande pianura di torbiera viva. Oggi
      ciò che vedi è il secondo atto: un paesaggio d'acqua, brughiere, dossi sabbiosi, betulle e radure a
      molinia, al confine tra Brabante Settentrionale e Limburgo. Mariapeel, Deurnsche Peel e il parco
      nazionale Groote Peel formano, insieme, una grande palude.


      La storia è nel suolo. I cavatori di torba ne scavarono la maggior parte e vendettero la torba come
      «l'oro della Peel»; le tracce si vedono ovunque. Ciò che rimase, col tempo, è stato restituito alla
      natura, e la prova più evidente è arrivata nel 2022: la [gru](/especie/grus_grus/) ha portato avanti un
      piccolo per la prima volta nella Deurnsche Peel.
    landscape: >-
      Dopo l'estrazione della torba, la Deurnsche Peel rimase come un'isola circondata da terre agricole
      drenate. Per questo si è andata prosciugando e riceve molto azoto. Oggi l'obiettivo è restituirle acqua,
      e tra il 2021 e il 2023 sono stati ripristinati quasi 1.000 ettari di torbiera, con 40 km di argini e
      180 ettari di ex coltivi scoticati. Si cerca inoltre di mantenere il livello dell'acqua il più stabile
      possibile affinché cresca lo sfagno.


      La zona a est del Kanaal van Deurne è la più intatta ed è considerata l'area selvaggia per eccellenza: è
      aperta al pubblico, ma ha pochi sentieri e gli stivali sono indispensabili. Nella Mariapeel ci sono tre
      complessi: Mariaveen, Driehonderd Bunder e Horster Driehoek. Lì, nel 1716, fu tracciato tra due grandi
      laghi il confine tra Brabante e Limburgo, e resta ancora un cippo. La Mariapeel scampò per poco a una
      grande bonifica quando scoppiò la Seconda guerra mondiale.
    wildlife: >-
      D'inverno arrivano le oche. Tra metà novembre e fine febbraio si osservano oche svernanti, come l'oca
      lombardella, l'oca granaiola della tundra e l'oca selvatica. Per questo d'inverno il sentiero rosso
      della Deurnsche Peel viene chiuso per le oche svernanti.


      In primavera tornano uccelli come il pettazzurro, la salciaiola e il migliarino di palude. Nidificano
      circa 100 specie, tra cui il chiurlo maggiore e il porciglione; nelle paludi, l'alzavola, il mestolone e
      il tuffetto. La Deurnese Peel è un habitat importante per le libellule, il tasso, la rana arvale e la
      coronella austriaca.


      Lontano dagli uccelli, a Mariaveen è stato ricostruito un vecchio ovile per il gregge di capre olandesi,
      che aiutano a mantenere bassa la brughiera.
    visit: >-
      Il punto di partenza è il Buitencentrum De Pelen, con mostre, da cui partono attività e percorsi. Lì
      inizia il familiepad giallo, di 2 km, pavimentato, con una capanna di osservazione e una torre
      accessibili in sedia a rotelle.


      La Zon over de Peel pad parte da Griendtsveen, un villaggio monumentale, passa per il Kanaal van Deurne
      e un grande stagno, e arriva al margine della torbiera. La Turfjespad passa per Griendtsveen, il
      sentiero delle suore e i resti di una fabbrica di torba. Accanto al percorso si trova il Toon Kortooms
      Park, dove visse la famiglia dello scrittore, oggi museo. Il Mussenkeetpad attraversa la Peel selvaggia
      lungo il canale, e il sentiero rosso passa davanti a una panchina a forma di carro da torba. Nella
      Mariapeel, l'itinerario Mariapeel groen percorre laghi ricchi di uccelli e brughiere ondulate pascolate
      da capre e vacche. Con una guida della Peel si percorrono passerelle di legno e antichi cammini e si
      impara come si formò questa torbiera.
    history: >-
      Nel 1853 il comune di Deurne vendette una striscia a Jan van de Griendt, che avviò uno sfruttamento
      della torba su larga scala; così nacque Helenaveen. La stazione Halte Helenaveen, del 1868, fu verso il
      1900 una delle stazioni merci più attive del paese, e fu distrutta nel 1944. Di fronte al parcheggio
      restano le fondamenta di una fabbrica di lettiera di torba di circa il 1900.


      La Deurnsche Peel fu dichiarata monumento naturale protetto l'11 dicembre 1980 e l'estrazione di torba
      terminò poco dopo. Un gruppo di volontari lavora dalla fine degli anni settanta per evitare che si
      chiuda di betulle. È una zona Natura 2000.
    before: >-
      Nella stagione riproduttiva si chiudono parti della Deurnsche Peel, inclusa la zona centrale, e della
      Mariapeel. Dal 15 ottobre al 30 novembre e in inverno ci sono chiusure per il passo migratorio e per le
      oche svernanti. I sentieri segnalati dal parcheggio De Halte e nel Broemeerbos restano aperti durante
      tali chiusure. Porta stivali o scarpe impermeabili: il terreno è umido.
    around: >-
      A quattordici chilometri si trova il [Parco Transfrontaliero
      Kempen~Broek](/lugar/grenspark-kempen-broek/), a ventitré [De Maashorst](/lugar/de-maashorst/) e a
      ventotto la [Porta di Gheldria / Corridoio del Reno](/lugar/gelderse-poort/). Più lontano, la [Riserva
      Naturale di Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) e le [Zone umide di
      Diepholz](/lugar/diepholzer-moorniederung/) condividono con la Deurnsche Peel la gru.
  pt:
    intro: >-
      Até meados do século dezanove, a Deurnese Peel era uma grande planície de turfeira viva. Hoje o que vês
      é o segundo ato: uma paisagem de água, urzais, lombas arenosas, bétulas e clareiras de molínia, no
      limite entre o Brabante do Norte e o Limburgo. Mariapeel, Deurnsche Peel e o parque nacional Groote Peel
      formam, juntos, um grande pântano.


      A história está no solo. Os turfeiros escavaram a maior parte e venderam a turfa como «o ouro da Peel»;
      as marcas veem-se por todo o lado. O que restou, com o tempo, foi devolvido à natureza, e a prova mais
      vistosa chegou em 2022: o [grou-comum](/especie/grus_grus/) criou com sucesso uma cria pela primeira vez
      na Deurnsche Peel.
    landscape: >-
      Após a extração de turfa, a Deurnsche Peel ficou como uma ilha rodeada de terras agrícolas drenadas. Por
      isso tem vindo a secar e recebe muito azoto. Hoje o objetivo é devolver-lhe água, e entre 2021 e 2023
      restauraram-se quase 1.000 hectares de turfeira, com 40 km de diques e 180 hectares de antigo cultivo
      decapado. Procura-se também que o nível da água seja o mais estável possível, para que cresça o esfagno.


      A zona a leste do Kanaal van Deurne é a mais virgem e considera-se a área selvagem por excelência: está
      aberta ao público, mas tem poucos trilhos e as botas são imprescindíveis. Na Mariapeel há três
      complexos, Mariaveen, Driehonderd Bunder e Horster Driehoek. Ali, em 1716, traçou-se entre duas grandes
      lagoas a fronteira entre o Brabante e o Limburgo, e ainda resta um marco. A Mariapeel escapou por pouco
      a uma grande arroteia quando rebentou a Segunda Guerra Mundial.
    wildlife: >-
      No inverno chegam os gansos. Entre meados de novembro e finais de fevereiro observam-se gansos
      invernantes, como o ganso-grande-de-testa-branca, o ganso-campestre-da-tundra e o ganso-bravo. Por isso
      no inverno o trilho vermelho da Deurnsche Peel fecha por causa dos gansos invernantes.


      Na primavera regressam aves como o pisco-de-peito-azul, a felosa-unicolor e a escrevedeira-dos-caniços.
      Criam cerca de 100 espécies, entre elas o maçarico-real e o frango-d'água; nos pântanos, a
      marrequinha-comum, o pato-trombeteiro e o mergulhão-pequeno. A Deurnese Peel é um habitat importante
      para libélulas, o texugo, a rã-dos-campos e a cobra-lisa.


      Longe das aves, em Mariaveen reconstruiu-se um velho redil para o rebanho de cabras neerlandesas, que
      ajudam a manter curto o urzal.
    visit: >-
      O ponto de partida é o Buitencentrum De Pelen, com exposições, de onde partem atividades e percursos.
      Ali começa o familiepad amarelo, de 2 km, pavimentado, com uma cabana de observação e uma torre
      acessíveis em cadeira de rodas.


      A Zon over de Peel pad parte de Griendtsveen, uma aldeia monumental, passa pelo Kanaal van Deurne e um
      grande charco, e chega à orla da turfeira. A Turfjespad passa por Griendtsveen, o caminho das freiras e
      os restos de uma fábrica de turfa. Junto ao percurso fica o Toon Kortooms Park, onde viveu a família do
      escritor, hoje museu. O Mussenkeetpad cruza a Peel selvagem junto ao canal, e o trilho vermelho passa
      por um banco com forma de carro de turfa. Na Mariapeel, o percurso Mariapeel groen percorre lagoas ricas
      em aves e urzais ondulados onde pastam cabras e vacas. Com um guia da Peel percorrem-se passadiços de
      madeira e caminhos antigos e aprende-se como se formou esta turfeira.
    history: >-
      Em 1853 o município de Deurne vendeu uma faixa a Jan van de Griendt, que montou uma exploração de turfa
      em grande escala; assim nasceu Helenaveen. A estação Halte Helenaveen, de 1868, foi por volta de 1900
      uma das estações de mercadorias mais ativas do país, e ficou destruída em 1944. Em frente ao parque de
      estacionamento restam os alicerces de uma fábrica de manta de turfa de cerca de 1900.


      A Deurnsche Peel foi declarada monumento natural protegido a 11 de dezembro de 1980 e a extração de
      turfa terminou pouco depois. Um grupo de voluntários trabalha desde o final dos anos setenta para evitar
      que se feche de bétulas. É uma zona Natura 2000.
    before: >-
      Na época de criação fecham-se partes da Deurnsche Peel, incluindo a zona central, e da Mariapeel. De 15
      de outubro a 30 de novembro e no inverno há encerramentos pela passagem migratória e pelos gansos
      invernantes. Os trilhos marcados a partir do parque de estacionamento De Halte e no Broemeerbos
      continuam abertos durante esses encerramentos. Leva botas ou sapatos impermeáveis: o terreno é húmido.
    around: >-
      A catorze quilómetros fica o [Parque da Fronteira Kempen~Broek](/lugar/grenspark-kempen-broek/), a vinte
      e três [De Maashorst](/lugar/de-maashorst/) e a vinte e oito a [Porta de Guéldria / Corredor do
      Reno](/lugar/gelderse-poort/). Mais longe, a [Reserva Natural de
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) e as [Zonas Húmidas de
      Diepholz](/lugar/diepholzer-moorniederung/) partilham com a Deurnsche Peel o grou-comum.
