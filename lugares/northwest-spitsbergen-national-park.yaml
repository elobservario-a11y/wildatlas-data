resumen:
  es: >-
    El espectáculo supremo del Alto Ártico europeo (79° N), con frentes glaciares colosales en los fiordos de
    Magdalena y Kongsfjorden y fuentes termales de Bockfjorden.
  en: >-
    The ultimate spectacle of the European High Arctic (79° N), with colossal tidewater glacier fronts in
    Magdalena and Kongsfjorden and geothermal springs at Bockfjorden.
  fr: >-
    Le spectacle suprême du Haut-Arctique européen (79° N), avec des fronts glaciaires colossaux dans les
    fjords de Magdalena et Kongsfjorden et les sources chaudes de Bockfjorden.
  de: >-
    Der grandiose Höhepunkt der europäischen Hocharktis (79° N) mit gewaltigen Gezeitengletschern in
    Magdalena- und Kongsfjord sowie Thermalquellen am Bockfjord.
  it: >-
    Il massimo spettacolo dell'Alto Artico europeo (79° N), con colossali fronti glaciali marini nei fiordi di
    Magdalena e Kongsfjorden e sorgenti termali a Bockfjorden.
  pt: >-
    O espetáculo supremo do Alto Ártico europeu (79° N), com frentes glaciares colossais nos fiordes de
    Magdalena e Kongsfjorden e nascentes termais em Bockfjorden.
unico:
  es: Aquí están las fuentes termales terrestres más septentrionales que se conocen del planeta.
  en: Here lie the northernmost documented terrestrial thermal springs on Earth.
  fr: Ici jaillissent les sources thermales terrestres les plus septentrionales connues sur Terre.
  de: Hier entspringen die nördlichsten bekannten terrestrischen Thermalquellen der Erde.
  it: Qui sgorgano le sorgenti termali terrestri più settentrionali conosciute al mondo.
  pt: Aqui brotam as nascentes termais terrestres mais setentrionais conhecidas no planeta.
observaciones:
  es: >-
    Todo rastro humano anterior a 1946 está protegido, y está prohibido destruir, mover o llevarse nada de
    ellos. En Likneset, Ebeltofthamna y partes de Ytre Norskøya hay prohibición de visita todo el año. Acampar
    exige permiso del Gobernador, solicitado con cuatro semanas de antelación y con guardia contra osos
    polares. A partir del 1 de julio de 2027 se exigirán guías de Svalbard aprobados. Comprueba las normas
    vigentes en la web del Gobernador antes de ir.
texto:
  es:
    intro: >-
      Casi a 80° de latitud norte, donde el mapa se queda sin tierra, un fiordo esconde agua que sale caliente
      de la roca. Ese es el rincón más raro del Parque Nacional del Noroeste de Spitsbergen: la esquina
      noroccidental de Spitsbergen y el mar que la rodea. Son 9.914 km², de los cuales 3.683 son tierra y
      6.231 son mar. Más de la mitad del parque, por tanto, se recorre en barco. Montañas afiladas, glaciares
      que se rompen en el agua, islas bajas llenas de aves y, en la orilla, los restos de quienes llegaron
      hasta aquí hace cuatro siglos a cazar ballenas.
    landscape: >-
      El parque se entiende mejor desde el Bockfjorden. Una falla que corre de norte a sur parte el paisaje en
      dos: al oeste, picos alpinos; al este, montañas rojizas y redondeadas. En la orilla del fiordo están las
      fuentes Troll y Jotun, restos de volcanes cuaternarios extinguidos. Jotun sale a 24,5 °C y Troll a 28,3
      °C, y sus depósitos de caliza sostienen una botánica propia: plantas amantes del calor, algunas con su
      única población de todo Svalbard, entre ellas la eufrasia de montaña y la sibbaldia.


      Hacia el nordeste, el relieve se aplana. Reinsdyrflya, en Haakon VII Land, es la mayor llanura costera
      de Svalbard. Y en medio de tanta roca, los glaciares: el Lilliehöökbreen, al oeste, cae al Krossfjorden,
      y el Monacobreen, al este, baja al Liefdefjorden.


      El clima de la costa depende del mar. Es tundra del Ártico norte, pero las aguas cálidas de la corriente
      de Spitsbergen Occidental dejan los fiordos del oeste libres de hielo la mayor parte del año.
    wildlife: >-
      El parque es lugar de [oso polar](/especie/ursus_maritimus/): es zona de invernada, y por eso quien se
      mueve fuera de los asentamientos debe llevar medios para ahuyentarlo. También viven aquí la
      [morsa](/especie/odobenus_rosmarus/), el [reno](/especie/rangifer_tarandus/) de Svalbard y el [zorro
      ártico](/especie/vulpes_lagopus/); varios ríos tienen poblaciones de chars.


      Las aves son la gran riqueza de la costa. Un tercio del área —los acantilados, las islas y las orillas—
      es Área Importante para las Aves por las barnaclas cariblancas y carinegras, los [eíderes
      comunes](/especie/somateria_mollissima/) y los arrendajos de mar que crían allí. Moseøya, Skorpa y
      Guissezholmen son reservas de aves, con eíderes y gansos nidificando; en Reinsdyrflya se concentran aves
      acuáticas.


      Moffen, una isla baja justo al norte de Wijdefjorden, es zona de descanso de morsas y de nidificación de
      aves. Los barcos de recorrido se acercan por su latitud, pero no se puede desembarcar ni entrar en sus
      aguas interiores.
    visit: >-
      El parque se visita desde el mar, con desembarcos en puntos concretos. Los dos más conocidos son
      Smeerenburg y Virgohamna, y en verano el parque recibe bastante turismo. Magdalenefjorden es uno de los
      lugares más visitados de Svalbard fuera de los asentamientos.


      La norma de desembarco manda: la visita turística a tierra solo se hace en puntos cartografiados, con
      guía que conozca el entorno natural y cultural, y con límite de gente en tierra a la vez.
    history: >-
      El parque se creó por resolución real el 1 de junio de 1973 y protege tierra y mar, con sus glaciares,
      aves y monumentos históricos.


      La historia humana está en la costa. Smeerenburg fue una estación ballenera holandesa en Amsterdamøya,
      fundada hacia 1620 y abandonada hacia 1660 porque disminuyeron las ballenas. Hoy se han registrado allí
      siete hornos de grasa, 19 cimientos de casas y 101 tumbas. En Gravneset hay enterramientos de unos 130
      balleneros. En Virgohamna, en Danskøya, el ingeniero sueco Andrée despegó en 1897 en un globo de
      hidrógeno para llegar al Polo Norte; allí quedan los restos de aquella y otras expediciones.
    before: >-
      Todo rastro humano anterior a 1946 está protegido, y está prohibido destruir, mover o llevarse nada de
      ellos. En Likneset, Ebeltofthamna y partes de Ytre Norskøya hay prohibición de visita todo el año.
      Acampar exige permiso del Gobernador, solicitado con cuatro semanas de antelación y con guardia contra
      osos polares. A partir del 1 de julio de 2027 se exigirán guías de Svalbard aprobados. Comprueba las
      normas vigentes en la web del Gobernador antes de ir.
    around: >-
      Los lugares más parecidos del atlas están en el mismo archipiélago. La [Reserva Natural de
      Søraust-Svalbard](/lugar/soraust-svalbard-nature-reserve/) comparte con el parque el oso polar, la morsa
      y el reno, y también la costa, el mar y los glaciares. La [Reserva Natural de
      Nordaust-Svalbard](/lugar/nordaust-svalbard-nature-reserve/) coincide en el oso polar y la morsa.
  en:
    intro: >-
      Nearly at 80° north latitude, where maps run out of land, a fjord hides warm water welling straight from
      bedrock. That is the most astonishing secret of Northwest Spitsbergen National Park: the northwestern
      corner of Spitsbergen and the ocean embracing it. It encompasses 9,914 km², of which 3,683 are land and
      6,231 are sea. More than half the park is therefore traversed by boat. Jagged alpine peaks, glaciers
      calving directly into saltwater, low-lying bird islands and, along lonely strands, the poignant relics
      of whalers who ventured here four centuries ago.
    landscape: >-
      The park is best understood from Bockfjorden. A tectonic fault running north to south divides the
      terrain in two: to the west, jagged alpine horns; to the east, rounded, reddish sandstone mountains.
      Along the fjord shore emerge the Troll and Jotun springs, surface relicts of extinct Quaternary
      volcanoes. Jotun emerges at 24.5 °C and Troll at 28.3 °C, with their mineral travertine terraces
      supporting a unique botany: warmth-loving plants, some representing their sole population across
      Svalbard, including alpine eyebright and sibbaldia.


      Toward the northeast the topography levels out. Reinsdyrflya in Haakon VII Land is Svalbard's largest
      strandflat plain. And amid the bare rock plunge colossal glaciers: Lilliehöökbreen in the west calvings
      into Krossfjorden, while Monacobreen in the east tumbles into Liefdefjorden.


      The coastal climate is softened by the sea. It is High Arctic tundra, yet warm branches of the West
      Spitsbergen Current keep western fjords ice-free throughout most of the year.
    wildlife: >-
      The park is prime [polar bear](/especie/ursus_maritimus/) domain: it serves as an important wintering
      and hunting area, which is why anyone traveling beyond settlements must carry polar bear deterrents and
      firearms. The [walrus](/especie/odobenus_rosmarus/), Svalbard [caribou](/especie/rangifer_tarandus/) and
      [Arctic fox](/especie/vulpes_lagopus/) also reside here; several rivers support populations of Arctic
      char.


      Birdlife constitutes the supreme glory of this coast. One-third of the area—cliffs, islands and
      shorelines—is designated an Important Bird Area for breeding barnacle and brent geese, [common
      eiders](/especie/somateria_mollissima/) and Arctic terns. Moseøya, Skorpa and Guissezholmen are strict
      bird sanctuaries where eiders and geese nest; Reinsdyrflya concentrates thousands of staging waterbirds.


      Moffen, a low gravel atoll just north of Wijdefjorden, is a renowned walrus haul-out and bird breeding
      sanctuary. Expedition vessels cruise by for its high latitude, but landing on the island or entering its
      territorial waters is strictly prohibited.
    visit: >-
      The park is explored by sea, with zodiac landings at designated historical and natural sites. The two
      most famous landing sites are Smeerenburg and Virgohamna, and in summer the park receives regular
      expedition cruise traffic. Magdalenefjorden is among the most visited natural fjords in Svalbard outside
      settlements.


      Strict landing regulations apply: tourism ashore is only permitted at officially mapped sites,
      accompanied by qualified guides versed in natural and cultural heritage, with strict caps on group
      numbers ashore at any one time.
    history: >-
      The park was established by royal decree on 1 June 1973, protecting land and sea, glaciers, avian havens
      and historical monuments.


      Human history lines the strands. Smeerenburg was a seventeenth-century Dutch whaling station on
      Amsterdamøya, founded around 1620 and abandoned around 1660 as local whale stocks plummeted. Today
      researchers record seven blubber ovens, 19 building foundations and 101 graves there. At Gravneset lie
      the graves of some 130 early whalers. At Virgohamna on Danskøya, Swedish engineer S. A. Andrée took off
      in 1897 in a hydrogen balloon aiming for the North Pole; relics of that tragic voyage and later airship
      expeditions still rest on the tundra.
    before: >-
      All cultural heritage traces predating 1946 are legally protected: it is strictly forbidden to damage,
      disturb or remove anything. At Likneset, Ebeltofthamna and parts of Ytre Norskøya, year-round access
      prohibitions apply. Camping requires prior permission from the Governor, requested four weeks in advance
      with mandatory polar bear sentry duties. From 1 July 2027, certified Svalbard guides will be mandatory.
      Check current regulations on the Governor's website before travel.
    around: >-
      The closest counterparts in the atlas lie within the same archipelago. The [Søraust-Svalbard Nature
      Reserve](/lugar/soraust-svalbard-nature-reserve/) shares polar bear, walrus and caribou, alongside
      glaciated Arctic coastlines. The [Nordaust-Svalbard Nature
      Reserve](/lugar/nordaust-svalbard-nature-reserve/) also shares polar bears and walruses.
  fr:
    intro: >-
      Presque par 80° de latitude nord, là où la carte s'efface dans les glaces, un fjord dissimule des eaux
      chaudes jaillissant directement du roc. C'est le joyau le plus insolite du parc national du nord-ouest
      du Spitzberg : la pointe nord-occidentale du Spitzberg et l'océan qui l'entoure. Il couvre 9 914 km²,
      dont 3 683 de terres et 6 231 de mer. Plus de la moitié du parc se parcourt ainsi en bateau. De hardis
      pics alpins, des glaciers vêlant dans l'eau salée, des îlots grouillants d'oiseaux et, sur les grèves,
      les émouvants vestiges de baleiniers venus chasser ici voici quatre siècles.
    landscape: >-
      Le parc se comprend au mieux depuis le Bockfjorden. Une faille orientée nord-sud divise le relief en
      deux : à l'ouest, des aiguilles alpines ; à l'est, des montagnes rougeâtres aux formes adoucies. Sur la
      rive du fjord sourdent les sources Troll et Jotun, témoignages de volcans quaternaires éteints. La
      source Jotun jaillit à 24,5 °C et Troll à 28,3 °C, leurs dépôts de travertin calcaire nourrissant une
      flore remarquable : des végétaux thermophiles dont certains constituent l'unique population de tout le
      Svalbard, comme l'euphraise alpine et la sibbaldie.


      Vers le nord-est, le relief s'abaisse. Reinsdyrflya, dans la terre de Haakon VII, est la plus vaste
      plaine côtière du Svalbard. Et au milieu des parois rocheuses se dressent des glaciers géants : le
      Lilliehöökbreen, à l'ouest, plonge dans le Krossfjorden, tandis que le Monacobreen, à l'est, descend
      dans le Liefdefjorden.


      Le climat littoral dépend étroitement de la mer. C'est la toundra du Haut-Arctique, mais les eaux
      adoucies du courant du Spitzberg occidental maintiennent les fjords occidentaux libres de glace une
      grande partie de l'année.
    wildlife: >-
      Le parc est le domaine de l'[ours blanc](/especie/ursus_maritimus/) : c'est un territoire d'hivernage et
      de chasse, raison pour laquelle toute personne s'aventurant hors des localités doit emporter des moyens
      de dissuasion et une arme. On y rencontre aussi le [morse](/especie/odobenus_rosmarus/), le
      [renne](/especie/rangifer_tarandus/) du Svalbard et le [renard polaire](/especie/vulpes_lagopus/) ;
      plusieurs cours d'eau abritent l'omble chevalier.


      Les oiseaux composent la richesse éclatante du littoral. Un tiers de la superficie—falaises, îles et
      rivages—est classé Zone Importante pour les Oiseaux pour ses colonies de bernaches nonnettes et
      cravants, ses [eiders à duvet](/especie/somateria_mollissima/) et ses sternes arctiques. Moseøya, Skorpa
      et Guissezholmen forment des réserves d'oiseaux marins ; sur Reinsdyrflya se rassemblent de grandes
      hardes d'oiseaux d'eau.


      Moffen, îlot bas posé au nord du Wijdefjorden, est un reposoir réputé de morses et un sanctuaire de
      nidification. Les navires d'expédition s'en approchent pour sa haute latitude, mais tout débarquement et
      toute intrusion dans ses eaux intérieures sont rigoureusement proscrits.
    visit: >-
      Le parc se visite depuis la mer, avec des débarquements en zodiac sur des sites choisis. Les deux plus
      illustres sont Smeerenburg et Virgohamna, le parc accueillant une fréquentation régulière en été. Le
      Magdalenefjorden est l'un des fjords les plus admirés du Svalbard hors des implantations permanentes.


      La réglementation encadre strictement les visites : les débarquements touristiques s'effectuent
      exclusivement sur des sites cartographiés, sous la conduite de guides confirmés connaissant les milieux
      naturels et historiques, avec une jauge limitée de passagers à terre en simultané.
    history: >-
      Le parc a été fondé par décret royal le 1 juin 1973, sanctuarisant terres, mers, glaciers et mémoire
      polaire.


      L'épopée humaine s'est écrite sur le rivage. Smeerenburg fut une station baleinière néerlandaise sur
      Amsterdamøya, établie vers 1620 et désertée vers 1660 après le déclin des baleines. Les archéologues y
      ont répertorié sept fours à graisse, 19 fondations de maisons et 101 tombes. À Gravneset reposent
      environ 130 baleiniers. À Virgohamna, sur Danskøya, l'ingénieur suédois Andrée s'éleva en 1897 à bord
      d'un ballon à hydrogène pour atteindre le pôle Nord ; les débris de cette tentative et d'autres
      expéditions reposent encore sur le sol gelé.
    before: >-
      Tout vestige antérieur à 1946 est protégé par la loi : interdiction absolue de déplacer, dégrader ou
      emporter le moindre vestige. À Likneset, Ebeltofthamna et sur des secteurs d'Ytre Norskøya, une
      interdiction totale d'accès s'applique toute l'année. Camper exige une autorisation du gouverneur
      déposée quatre semaines avant, avec veille anti-ours obligatoire. Dès le 1 juillet 2027, des guides
      agréés pour le Svalbard seront requis. Consultez la réglementation sur le site officiel du gouverneur.
    around: >-
      Les espaces les plus comparables se situent dans le même archipel. La [Réserve naturelle de
      Søraust-Svalbard](/lugar/soraust-svalbard-nature-reserve/) partage l'ours polaire, le morse, le renne et
      les fronts glaciaires marins. La [Réserve naturelle de
      Nordaust-Svalbard](/lugar/nordaust-svalbard-nature-reserve/) partage également l'ours blanc et le morse.
  de:
    intro: >-
      Fast auf 80° nördlicher Breite, wo die Karte kein Festland mehr kennt, birgt ein Fjord warmes Wasser,
      das direkt aus dem Fels quillt. Dies ist der ungewöhnlichste Winkel des Nationalparks
      Nordwest-Spitzbergen: die Nordwestecke Spitzbergens und das umgebende Meer. Er umfasst 9.914 km², davon
      3.683 Land und 6.231 Meeresfläche. Mehr als die Hälfte des Parks erschließt sich daher per Schiff.
      Scharfe Grate, kalbende Gezeitengletscher, flache Vogelinseln und an den Ufern Zeugnisse jener
      Walfänger, die vor vier Jahrhunderten hierher vorstießen.
    landscape: >-
      Der Park erschließt sich am besten vom Bockfjord aus. Eine Verwerfungslinie teilt die Landschaft in zwei
      Zonen: im Westen spitze alpine Hörner, im Osten gerundete, rötliche Sandsteinberge. Am Fjordufer treten
      die Quellen Troll und Jotun zutage, Relikte erloschener quartärer Vulkane. Die Jotun-Quelle schüttet mit
      24,5 °C und Troll mit 28,3 °C; ihre Travertinterrassen beherbergen eine ganz eigene wärmeliebende Flora
      mit Vorkommen des Alpen-Augentrosts und des Gelblichen Fingerkrauts, die nirgendwo sonst auf Svalbard
      wachsen.


      Nach Nordosten flacht das Relief ab. Reinsdyrflya in Haakon VII Land ist Spitzbergens größte
      Strandflachebene. Dazwischen stürzen gewaltige Eisströme ins Meer: der Lilliehöökbreen im Westen in den
      Krossfjord und der Monacobreen im Osten in den Liefdefjord.


      Das Küstenklima wird vom Meer geprägt. Es ist arktische Kältetundra, doch warme Ausläufer des
      Westspitzbergenstroms halten die Westfjorde weite Teile des Jahres eisfrei.
    wildlife: >-
      Der Park ist ein Revier des [Eisbären](/especie/ursus_maritimus/): Er dient als wichtiges
      Überwinterungs- und Jagdgebiet; wer Siedlungen verlässt, muss daher Schutzwaffen und Vergrämungsmittel
      mitführen. Auch das [Walross](/especie/odobenus_rosmarus/), das
      Spitzbergen-[Ren](/especie/rangifer_tarandus/) und der [Polarfuchs](/especie/vulpes_lagopus/) sind hier
      heimisch; mehrere Bäche beherbergen Saiblinge.


      Vogelberge prägen die Küsten. Ein Drittel der Fläche ist als Important Bird Area für Weißwangen- und
      Ringelgänse, [Eiderenten](/especie/somateria_mollissima/) und Küstenseeschwalben ausgewiesen. Moseøya,
      Skorpa und Guissezholmen sind strenge Vogelschutzgebiete; auf Reinsdyrflya rasten Scharen von
      Wasservögeln.


      Moffen, eine flache Kiesinsel nördlich des Wijdefjords, ist ein bekannter Liegeplatz für Walrosse und
      Vogelbrutplatz. Schiffe passieren sie wegen der hohen Breite, Anlanden und Einfahrt in die Gewässer sind
      verboten.
    visit: >-
      Der Park wird von See aus mit Schlauchbootanlandungen erkundet. Zu den bekanntesten Stationen zählen
      Smeerenburg und Virgohamna; im Sommer herrscht reger Expeditionsverkehr. Der Magdalenefjord zählt zu den
      am stärksten frequentierten Naturfjorden außerhalb der Siedlungen.


      Strenge Anlanderegeln gelten: Landgänge sind nur an kartierten Plätzen unter Führung autorisierter
      Guides mit Personenbegrenzungen zulässig.
    history: >-
      Der Park wurde am 1. Juni 1973 durch königlichen Erlass gegründet und schützt Meeres- und
      Landlebensräume sowie historische Monumente.


      Menschliche Geschichte säumt die Gestade. Smeerenburg war eine holländische Walfangstation auf
      Amsterdamøya, gegründet um 1620 und um 1660 nach dem Rückgang der Wale aufgegeben. Archäologen zählen
      dort sieben Trankessel, 19 Hausfundamente und 101 Gräber. Bei Gravneset liegen Gräber von rund 130
      Walfängern. In Virgohamna auf Danskøya startete der schwedische Ingenieur Andrée 1897 mit einem
      Gasballon zum Nordpol; Trümmer jener und späterer Luftschiffexpeditionen liegen noch heute im Schotter.
    before: >-
      Alle menschlichen Spuren vor 1946 stehen unter Denkmalschutz: Es ist verboten, Fundstücke zu
      beschädigen, zu verlagern oder mitzunehmen. In Likneset, Ebeltofthamna und Teilen von Ytre Norskøya
      herrscht ganzjähriges Betretungsverbot. Zelten bedarf einer Genehmigung des Sysselmesters vier Wochen im
      Voraus mit Eisbärenwache. Ab dem 1. Juli 2027 sind zertifizierte Svalbard-Guides Pflicht. Prüfe aktuelle
      Vorgaben auf der Website des Sysselmesters.
    around: >-
      Ähnliche Gebiete im Atlas liegen im selben Archipel: Das [Naturreservat
      Südost-Svalbard](/lugar/soraust-svalbard-nature-reserve/) teilt Eisbär, Walross und Ren sowie
      Meeresbuchten und Gletscher. Das [Naturreservat
      Nordost-Svalbard](/lugar/nordaust-svalbard-nature-reserve/) teilt Eisbären und Walrosse.
  it:
    intro: >-
      Quasi a 80° di latitudine nord, dove la carta geografica termina nei ghiacci, un fiordo cela sorgenti
      calde che sgorgano direttamente dalla roccia. È la meraviglia più inattesa del Parco Nazionale di
      Spitsbergen Nord-Occidentale: l'angolo nord-occidentale di Spitsbergen e il mare che lo bagna. Copre
      9.914 km², di cui 3.683 di terra e 6.231 di mare. Più della metà del parco si naviga dunque in battello.
      Cime alpine scoscese, fronti glaciali che precipitano nelle onde, isolotti gremiti di uccelli e sulle
      rive i resti dei cacciatori di balene giunti qui quattro secoli fa.
    landscape: >-
      Il parco si comprende al meglio dal Bockfjorden. Una faglia con andamento nord-sud divide la morfologia
      in due: a ovest guglie alpine, a est montagne rossastre e arrotondate. Sulla riva del fiordo affiorano
      le sorgenti Troll e Jotun, relitti di vulcani quaternari estinti. Jotun sgorga a 24,5 °C e Troll a 28,3
      °C, formando terrazze calcaree che ospitano una flora esclusiva: piante termofile che costituiscono
      l'unica stazione di tutte le Svalbard, tra cui l'eufrasia alpina e la sibbaldia.


      Verso nord-est il paesaggio si addolcisce. Reinsdyrflya nella terra di Haakon VII è la più vasta pianura
      litoranea delle Svalbard. E tra le pareti rocciose colano ghiacciai ciclopici: il Lilliehöökbreen a
      ovest si getta nel Krossfjorden, mentre il Monacobreen a est scende nel Liefdefjorden.


      Il clima costiero risente del mare. È tundra dell'Alto Artico, ma le correnti temperate della Corrente
      di Spitsbergen Occidentale lasciano i fiordi occidentali sgombri dal ghiaccio per buona parte dell'anno.
    wildlife: >-
      Il parco è terra dell'[orso polare](/especie/ursus_maritimus/): è area di svernamento e caccia, motivo
      per cui chiunque esca dagli insediamenti deve portare strumenti di dissuasione e armi da fuoco. Vi
      abitano anche il [tricheco](/especie/odobenus_rosmarus/), la [renna](/especie/rangifer_tarandus/) delle
      Svalbard e la [volpe artica](/especie/vulpes_lagopus/); diversi corsi d'acqua ospitano il salmerino
      alpino.


      L'avifauna costiera è straordinaria. Un terzo dell'area—scogliere, isole e lidi—è classificato Important
      Bird Area per colonie di oche facciabianca, oche colombaccio, [edredoni](/especie/somateria_mollissima/)
      e sterne codalunga. Moseøya, Skorpa e Guissezholmen sono riserve ornitologiche integrali; su
      Reinsdyrflya sostano migliaia di uccelli acquatici.


      Moffen, un basso atollo di ghiaia a nord del Wijdefjorden, è un celebre sito di sosta per trichechi e
      nidificazione. Le navi vi transitano vicino per l'alta latitudine, ma sbarco e avvicinamento nelle acque
      protette sono vietati.
    visit: >-
      Il parco si visita dal mare con sbarchi in zodiac in punti autorizzati. I siti più noti sono Smeerenburg
      e Virgohamna; in estate la zona registra una frequenza costante di navi da spedizione. Il
      Magdalenefjorden è tra i fiordi più spettacolari delle Svalbard fuori dalle cittadine.


      Vigono norme di sbarco rigorose: le visite a terra avvengono solo nei siti cartografati, accompagnati da
      guide formate su natura e storia, con limiti rigidi al numero di visitatori a terra.
    history: >-
      Il parco è stato istituito con decreto reale il 1 giugno 1973 per salvaguardare ghiacciai, avifauna e
      reperti storici.


      La memoria delle esplorazioni segna le spiagge. Smeerenburg fu una base baleniera olandese su
      Amsterdamøya, fondata verso il 1620 e abbandonata attorno al 1660 per il declino delle balene. Oggi si
      contano sette forni da grasso, 19 basamenti di abitazioni e 101 tombe. A Gravneset riposano circa 130
      balenieri. A Virgohamna su Danskøya l'ingegnere svedese Andrée decollò nel 1897 a bordo di un pallone a
      idrogeno verso il Polo Nord; sul terreno ghiacciato restano le tracce di quell'audace tentativo.
    before: >-
      Ogni testimonianza umana antecedente il 1946 è tutelata dalla legge: è vietato danneggiare, spostare o
      asportare qualsiasi manufatto. A Likneset, Ebeltofthamna e in settori di Ytre Norskøya vige il divieto
      d'accesso annuale. Campeggiare esige l'autorizzazione del Governatore con quattro settimane d'anticipo e
      turni di guardia anti-orso. Dal 1 luglio 2027 saranno obbligatorie guide certificate per le Svalbard.
      Consulta il sito del Governatore prima di partire.
    around: >-
      Le aree più affini nell'atlas sorgono nello stesso arcipelago. La [Riserva Naturale delle Svalbard
      Sud-Orientali](/lugar/soraust-svalbard-nature-reserve/) condivide orso polare, tricheco, renna e fronti
      glaciali marini. La [Riserva Naturale delle Svalbard
      Nord-Orientali](/lugar/nordaust-svalbard-nature-reserve/) condivide a sua volta l'orso polare e il
      tricheco.
  pt:
    intro: >-
      Quase a 80° de latitude norte, onde o mapa fica sem terra firme, um fiorde oculta águas mornas que
      brotam diretamente da rocha. É o tesouro mais invulgar do Parque Nacional do Noroeste de Spitsbergen: o
      canto norocidental de Spitsbergen e o oceano que o abraça. Soma 9.914 km², dos quais 3.683 terrestres e
      6.231 marinhos. Mais de metade do parque descobre-se, pois, em embarcações. Picos alpinos afilados,
      glaciares que se desmoronam na água salgada, ilhotas repletas de aves e, nas praias, os vestígios dos
      baleeiros que aqui chegaram há quatro séculos.
    landscape: >-
      O parque compreende-se melhor a partir do Bockfjorden. Uma falha orientada norte-sul divide a paisagem
      em duas: a oeste, agulhas alpinas; a leste, montanhas avermelhadas e suaves. Na margem do fiorde emergem
      as fontes Troll e Jotun, relíquias de vulcões quaternários extintos. Jotun brota a 24,5 °C e Troll a
      28,3 °C, sustentando terraços de travertino com flora singular: plantas termófilas que mantêm aqui a sua
      única população em toda Svalbard, como a eufrásia-alpina e a sibáldia.


      Para nordeste o relevo suaviza-se. Reinsdyrflya, na terra de Haakon VII, constitui a maior planície
      costeira de Svalbard. E por entre as rochas precipitam-se glaciares gigantescos: o Lilliehöökbreen, a
      oeste, tomba no Krossfjorden, enquanto o Monacobreen, a leste, desce até ao Liefdefjorden.


      O clima costeiro depende do oceano. É tundra do Alto Ártico, mas ramos temperados da Corrente de
      Spitsbergen Ocidental mantêm os fiordes ocidentais sem gelo durante grande parte do ano.
    wildlife: >-
      O parque é território de [urso-polar](/especie/ursus_maritimus/): é zona de invernada e caça, pelo que
      quem se aventura fora das povoações deve transportar meios dissuasores e armas de fogo. Ocorrem
      igualmente a [morsa](/especie/odobenus_rosmarus/), a [rena](/especie/rangifer_tarandus/) de Svalbard e a
      [raposa-do-ártico](/especie/vulpes_lagopus/); vários rios albergam populações de salvelino-ártico.


      A avifauna litoral é deslumbrante. Um terço da área—arribas, ilhas e praias—é Área Importante para as
      Aves pelas colónias de gansos-de-faces-brancas, gansos-de-bico-curto,
      [êideres-edredão](/especie/somateria_mollissima/) e andorinhas-do-mar-árticas. Moseøya, Skorpa e
      Guissezholmen formam reservas integrais de aves; em Reinsdyrflya concentram-se aves aquáticas.


      Moffen, ilhota plana a norte do Wijdefjorden, é um conhecido santuário de repouso de morsas e de
      nidificação. Os navios aproximam-se pela latitude extrema, mas o desembarque e o acesso às águas
      interiores são totalmente proibidos.
    visit: >-
      O parque visita-se por mar, com desembarques em zodiac em locais devidamente determinados. Os dois mais
      célebres são Smeerenburg e Virgohamna; no verão o tráfego de expedições é frequente. O Magdalenefjorden
      figura entre os fiordes mais visitados de Svalbard fora das povoações permanentes.


      A regulamentação impõe disciplina: as visitas em terra realizam-se estritamente em locais cartografados,
      acompanhadas por guias credenciados com formação em património natural e cultural, sob lotação máxima
      simultânea.
    history: >-
      O parque foi estabelecido por decreto real a 1 de junho de 1973, protegendo terra, mar, glaciares e
      património histórico.


      A odisseia humana pontua a costa. Smeerenburg foi uma estação baleeira holandesa em Amsterdamøya,
      fundada por volta de 1620 e abandonada cerca de 1660 após o declínio das baleias. Contabilizam-se ali
      sete fornos de azeite de baleia, 19 alicerces de casas e 101 sepulturas. Em Gravneset repousam cerca de
      130 baleeiros. Em Virgohamna, em Danskøya, o engenheiro sueco Andrée descolou em 1897 num balão de
      hidrogénio rumo ao Polo Norte; destroços dessa e de outras expedições repousam ainda sobre o cascalho.
    before: >-
      Todos os vestígios humanos anteriores a 1946 encontram-se protegidos por lei: é proibido danificar,
      deslocar ou recolher artefactos. Em Likneset, Ebeltofthamna e partes de Ytre Norskøya vigoram
      interdições anuais completas de desembarque. Acampar carece de licença do Governador solicitada com
      quatro semanas de antecedência, com vigília obrigatória contra ursos. A partir de 1 de julho de 2027
      serão obrigatórios guias certificados para Svalbard. Consulta a regulamentação atualizada no portal do
      Governador.
    around: >-
      Os territórios mais afins no atlas situam-se no mesmo arquipélago. A [Reserva Natural do Sudeste de
      Svalbard](/lugar/soraust-svalbard-nature-reserve/) partilha o urso-polar, a morsa, a rena e frentes
      glaciares marinhas. A [Reserva Natural do Nordeste de
      Svalbard](/lugar/nordaust-svalbard-nature-reserve/) coincide igualmente na presença de ursos-polares e
      morsas.
