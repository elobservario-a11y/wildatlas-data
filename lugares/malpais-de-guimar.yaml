resumen:
  es: >-
    Paisaje volcánico reciente de lava pahoehoe y aa dominado por el volcán Montaña Grande, poblado de
    cardonales y tabaibales endémicos.
  en: >-
    Recent volcanic landscape of pahoehoe and aa lavas dominated by the Montaña Grande cone, colonized by
    endemic spurge communities.
  fr: >-
    Paysage volcanique récent de laves cordées et aa dominé par le cône de Montaña Grande, colonisé par des
    euphorbes endémiques.
  de: >-
    Junge Vulkanlandschaft aus Pahoehoe- und Aa-Lava, überragt vom Vulkan Montaña Grande und bewachsen von
    endemischen Wolfsmilchgewächsen.
  it: >-
    Recente paesaggio vulcanico di lave pahoehoe e aa dominato dal cono di Montaña Grande, colonizzato da
    formazioni endemiche di euforbie.
  pt: >-
    Recente paisagem vulcânica de lavas pahoehoe e aa dominada pelo vulcão de Montaña Grande, povoada por
    matagais endémicos de eufórbias.
unico:
  es: >-
    Es una de las mejores muestras de cardonal-tabaibal del archipiélago canario, crecida sobre lava de menos
    de 5000 años.
  en: >-
    One of the best preserved cardón and tabaiba spurge shrublands in the Canary Islands, thriving on lava
    flows less than 5000 years old.
  fr: >-
    L’un des plus beaux exemples de brousse à euphorbes de l’archipel canarien, installé sur des coulées de
    lave de moins de 5000 ans.
  de: >-
    Eines der am besten erhaltenen Wolfsmilchdickichte (Cardonal-Tabaibal) des Kanarischen Archipels,
    gewachsen auf Lava, die jünger als 5000 Jahre ist.
  it: >-
    Uno dei migliori esempi di boscaglia a euforbie (cardonal-tabaibal) dell’arcipelago canario, sviluppatosi
    su colate laviche risalenti a meno di 5000 anni fa.
  pt: >-
    É um dos melhores exemplos de matagal de cardos e tabaibas do arquipélago canário, desenvolvido sobre
    lavas com menos de 5000 anos.
observaciones:
  es: >-
    Camina acompañado y por los caminos señalizados, y respeta las propiedades de los habitantes del lugar.
    Llévate toda la basura, incluso la orgánica, y cuidado con las colillas. No recolectes plantas, animales
    ni objetos. Si evitas los ruidos, descubrirás mucha más vida a tu alrededor.


    Consulta antes el estado del sendero: la entidad gestora indica si no se recomienda el tránsito tras un
    fenómeno meteorológico adverso o si hay tramos cerrados.
texto:
  es:
    intro: >-
      Hace menos de 5000 años la lava salió por fisuras en la base de una montaña y corrió hasta el mar. Lo
      que dejó es el Malpaís de Güímar: una superficie rugosa, pedregosa y de aspecto caótico, con formas
      caprichosas, en el sureste de Tenerife. Sobre las coladas han crecido cardones y tabaibas, y desde la
      cima de Montaña Grande, de color rojo apagado, el relieve baja hasta el litoral. Son 290,3 hectáreas que
      se recorren a pie en una mañana.
    landscape: >-
      La historia empieza en Montaña Grande, el punto más alto, con 276 metros. Se formó por acumulación de
      material piroclástico, de cenizas a bombas, en sucesivas erupciones, y su cráter mide unos 300 metros de
      diámetro y unos 50 de profundidad. Pero la lava del malpaís no salió de ahí. Brotó de fisuras repartidas
      por la base de la montaña y avanzó en coladas de tipo aa, de basalto, hasta el mar.


      El resultado es un paisaje exclusivamente volcánico, con la Montaña de la Mar y Las Morras del Corcho,
      más antiguas, asomando entre las lavas porque no quedaron sepultadas. La costa es recortada, con caletas
      de playas de callaos y arena orgánica.


      Debajo del suelo hay otro mundo. El malpaís está atravesado por una gran cantidad de tubos y cuevas
      volcánicas, y los jameos, tramos donde se ha caído parte del techo, delatan su existencia. La más
      espectacular es Cueva Honda o Cueva de los Burros, con más de 100 metros de largo y hasta 5 de altura;
      no se puede visitar.


      El clima completa el cuadro. Llueve poco y los vientos alisios del noreste suavizan las temperaturas, de
      17 °C de media en enero a 23 °C en agosto. La insolación es muy elevada, de 2500 horas al año, y la
      humedad relativa ronda el 70 %.


      Sobre esa roca, la vegetación manda: abunda el tabaibal-cardonal, relativamente bien conservado, con el
      cardón canario. En la costa dominan la lechuga y la siempreviva de mar, y en los arenales las aulagas y
      los cerrillos. Por todo el malpaís hay más de 60 especies de líquenes.
    wildlife: >-
      Mira las piedras: allí corren los lagartos buscando el sol. Con ellos viven perenquenes y lisas. Entre
      las plantas, el balillo es una de las endémicas que cita la reserva.


      Las aves son el grupo de vertebrados que predomina, con más de una docena de especies nidificantes: el
      caminero, el pájaro moro y el búho chico, además del alcaudón, la abubilla y el cernícalo. Los
      invertebrados son el grupo más numeroso, y destacan varias especies endémicas.


      Entre los mamíferos introducidos hay conejos, gatos, ratas y erizos. Las temperaturas suaves permiten
      organizar paseos en distintas épocas del año.
    visit: >-
      Hay tres senderos, y el primero es el eje. Sale de la calle Almirante Cervera, en el Puertito de Güímar,
      y es circular: 6,11 km, unas 3 horas y 169 metros de ascenso acumulado, de dificultad media. Vuelve al
      punto de salida.


      El segundo bordea Montaña Grande en un recorrido lineal: 2,7 km, una hora, dificultad baja. Se enlaza
      con el primero para alargar la ruta. El tercero, de 1,87 km y unos 45 minutos, también de dificultad
      baja, permite empezar y terminar el primero desde El Socorro.


      En cualquiera de ellos, detente en los miradores: desde allí se ven las coladas, los cardones y las
      tabaibas que dominan el paisaje. El sendero atraviesa una zona con más de sesenta especies de líquenes.


      Para llegar, toma la TF-1 y sal hacia el Polígono Industrial de Arafo; en el primer cruce de calles,
      desvíate a la derecha. El acceso a la reserva está a unos 1,6 km.
    history: >-
      Quien vivió aquí lo supo aprovechar. Los antiguos pobladores aturdían a los peces envenenando los
      charcos con leche de cardón o de tabaiba amarga, una técnica que llamaban embarbascado. Del mar sacaban
      sal: todavía se ven dos salinas perfectamente conservadas. El pastoreo de invierno se practicaba ya
      antes del siglo XV y se mantuvo después a menor escala. De la tabaiba se obtenía látex, y el cráter y
      los flancos de la montaña se cultivaron durante mucho tiempo.


      El malpaís figura entre los espacios naturales protegidos desde 1987 y en 1989 se creó un patronato para
      su uso y gestión. La Ley de Espacios Naturales de Canarias de 1994 le dio el nombre actual, Reserva
      Natural Especial del Malpaís de Güímar. El Plan Director tiene aprobación definitiva.
    before: >-
      Camina acompañado y por los caminos señalizados, y respeta las propiedades de los habitantes del lugar.
      Llévate toda la basura, incluso la orgánica, y cuidado con las colillas. No recolectes plantas, animales
      ni objetos. Si evitas los ruidos, descubrirás mucha más vida a tu alrededor.


      Consulta antes el estado del sendero: la entidad gestora indica si no se recomienda el tránsito tras un
      fenómeno meteorológico adverso o si hay tramos cerrados.
    around: >-
      Otros espacios de Tenerife son el [Parque Nacional del Teide](/lugar/parque-nacional-del-teide/) y el
      [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/).
  en:
    intro: >-
      Less than 5000 years ago, lava erupted from fissures along the base of a cone and surged into the sea.
      The result is the Malpaís de Güímar: a rugged, stony, chaotic landscape of twisted volcanic formations
      on the south-eastern coast of Tenerife. Across these basalt fields grow dense clumps of Canary Island
      spurge (cardón) and sweet spurge (tabaiba), while the terrain slopes from the muted red summit of
      Montaña Grande down to the ocean edge. Spanning 290.3 hectares, it can easily be explored on foot in a
      morning.
    landscape: >-
      The story begins at Montaña Grande, the highest point at 276 metres. It formed through successive
      eruptions accumulating pyroclastic debris, from ash to volcanic bombs, and its volcanic crater spans
      some 300 metres in diameter and roughly 50 metres in depth. However, the badlands lava did not originate
      from this vent. Instead, it welled from fissures along the foot of the cone, spreading towards the ocean
      in jagged aa basalt flows.


      The resulting terrain is purely volcanic, with older features like Montaña de la Mar and Las Morras del
      Corcho emerging amid the lavas having escaped burial. The coastline is indented, dotted with small coves
      of rounded pebbles and organic sand.


      Beneath the surface lies another world. The badlands are honeycombed with volcanic tubes and lava caves,
      whose presence is revealed by jameos—sunken sections where cavern roofs collapsed. The most remarkable
      is Cueva Honda (or Cueva de los Burros), measuring over 100 metres in length and up to 5 metres in
      height; it remains closed to visitors.


      The climate completes the setting. Rainfall is scarce, and north-easterly trade winds moderate
      temperatures, averaging from 17 °C in January to 23 °C in August. Sunshine is abundant, reaching 2500
      hours annually, while relative humidity hovers around 70 %.


      Across the rock, flora reigns supreme: relatively pristine spurge scrub (cardonal-tabaibal) flourishes
      with the endemic Canary Island spurge. Near the shore, sea lettuce and sea lavender dominate, whereas
      coastal sands support gorse and perennial grass tussocks. Across the malpaís, more than 60 lichen
      species have been documented.
    wildlife: >-
      Keep an eye on the basalt blocks: lizards dart across them basking in the sun. Alongside them dwell
      Canary wall geckos and skinks. Among the flora, balillo is one of the notable endemics cited in the
      reserve.


      Birds form the dominant vertebrate group, with over a dozen breeding species: Berthelot’s pipit,
      trumpeter finch, and long-eared owl, alongside southern grey shrike, hoopoe, and common kestrel.
      Invertebrates represent the most diverse contingent, including numerous endemic species.


      Introduced mammals include rabbits, feral cats, rats, and hedgehogs. The gentle climate makes walking
      pleasant across different seasons of the year.
    visit: >-
      Three trails cross the reserve, with the primary trail serving as the backbone. Starting from Calle
      Almirante Cervera in Puertito de Güímar, it forms a loop: 6.11 km, around 3 hours, and 169 metres of
      cumulative elevation gain, rated moderate. It returns to the starting point.


      The second trail skirts Montaña Grande along a linear path: 2.7 km, one hour, easy grade. It connects
      with the main loop to extend the hike. The third route, spanning 1.87 km and roughly 45 minutes, also
      easy, allows you to begin and finish the primary loop from El Socorro.


      Whichever path you take, pause at the viewpoints: they overlook the basalt flows, cardones, and tabaibas
      that dominate the scenery. The path passes through an area hosting more than sixty lichen species.


      To reach the reserve, take the TF-1 motorway and exit towards Polígono Industrial de Arafo; at the first
      intersection, turn right. The reserve entrance is located roughly 1.6 km ahead.
    history: >-
      Early inhabitants made resourceful use of this barren landscape. Aboriginal Guanches stunned fish by
      poisoning tidal pools with the toxic sap of cardón or bitter tabaiba, a practice known as embarbascado.
      They also harvested sea salt: two historic salinas remain remarkably well preserved. Winter grazing was
      practiced before the fifteenth century and continued on a smaller scale in subsequent eras. Latex was
      harvested from tabaiba plants, and the crater and flanks of the cone were farmed for generations.


      The malpaís has been protected since 1987, and in 1989 a board was established for its use and
      stewardship. The 1994 Canary Islands Natural Protected Areas Law gave it its present designation as the
      Malpaís de Güímar Special Nature Reserve. Its Master Plan is officially ratified.
    before: >-
      Hike in company along marked trails and respect private properties belonging to local residents. Pack
      out all trash, including organic waste, and extinguish cigarette butts carefully. Do not collect plants,
      animals, rocks, or historical artefacts. Minimizing noise will reveal far more wildlife around you.


      Check trail conditions beforehand: the management authority posts notices if travel is inadvisable after
      adverse weather or when path segments undergo repairs.
    around: >-
      Other protected areas on Tenerife include [Teide National Park](/lugar/parque-nacional-del-teide/) and
      the [Anaga Rural Park](/lugar/parque-rural-de-anaga/).
  fr:
    intro: >-
      Il y a moins de 5000 ans, la lave s’est échappée par des fissures au pied d’une montagne pour se ruer
      vers l’océan. Elle a laissé derrière elle le Malpaís de Güímar : une surface rugueuse, pierreuse et
      d’aspect chaotique, aux formes tourmentées, dans le sud-est de Tenerife. Sur les coulées ont pris racine
      cardons et euphorbes tabaibas, tandis que depuis le sommet rougeoyant de Montaña Grande, le relief
      dévale jusqu’au littoral. Ce sont 290,3 hectares qui se découvrent à pied au cours d’une matinée.
    landscape: >-
      L’histoire prend racine à Montaña Grande, point culminant à 276 mètres. Ce cône s’est édifié par
      accumulation de matériaux pyroclastiques, des cendres aux bombes volcaniques, au gré d’éruptions
      successives ; son cratère mesure environ 300 mètres de diamètre pour près de 50 mètres de profondeur.
      Pourtant, la lave du malpaís ne provient pas de son cratère. Elle a jailli de fissures réparties à la
      base du cône pour progresser en coulées de basalte de type aa jusqu’à la mer.


      Il en résulte un paysage exclusivement volcanique, d’où émergent Montaña de la Mar et Las Morras del
      Corcho, plus anciennes, qui ont échappé à l’ensevelissement. La côte est déchiquetée, jalonnée de
      petites criques de galets et de sables organiques.


      Sous terre s’ouvre un autre monde. Le malpaís est sillonné par un dédale de tunnels et de grottes de
      lave dont témoignent les jameos, ces effondrements partiels de la voûte. La plus spectaculaire est la
      Cueva Honda (ou Cueva de los Burros), longue de plus de 100 mètres et haute de 5 mètres ; son accès est
      interdit.


      Le climat parachève le tableau. Les pluies sont rares et les alizés du nord-est tempèrent l’atmosphère,
      de 17 °C en moyenne en janvier à 23 °C en août. L’ensoleillement y est très généreux, avec 2500 heures
      par an, et l’humidité relative avoisine 70 %.


      Sur la roche, la végétation règne en maître : le tabaibal-cardonal, remarquablement préservé, s’épanouit
      avec l’euphorbe des Canaries. Près des flots dominent la laitue de mer et la statice maritime, tandis
      que sur les étendues sableuses croissent l’ajonc épineux et des graminées vivaces. L’ensemble du malpaís
      compte plus de 60 espèces de lichens.
    wildlife: >-
      Observez les blocs de lave : les lézards s’y faufilent en quête de soleil. À leurs côtés vivent geckos
      des Canaries et scinques. Côté flore, le balillo compte parmi les espèces endémiques signalées dans la
      réserve.


      Les oiseaux composent le groupe de vertébrés prédominant, avec plus d’une douzaine d’espèces nicheuses :
      le pipit de Berthelot, le roselin githagine et le hibou moyen-duc, ainsi que la pie-grièche méridionale,
      la huppe fasciée et le faucon crécerelle. Les invertébrés forment le contingent le plus nombreux,
      illustré par plusieurs endémismes canariens.


      Parmi les mammifères introduits figurent lapins, chats harets, rats et hérissons. Les températures
      clémentes rendent la promenade agréable en toute saison.
    visit: >-
      Trois itinéraires sillonnent la réserve, le premier faisant office d’axe majeur. Partant de la rue
      Almirante Cervera au Puertito de Güímar, cette boucle affiche 6,11 km, environ 3 heures de marche et 169
      mètres de dénivelé positif cumulé, pour une difficulté moyenne. Elle revient à son point de départ.


      Le deuxième sentier contourne Montaña Grande en tracé linéaire : 2,7 km, une heure, difficulté facile.
      Il peut s’associer au premier pour rallonger l’excursion. Le troisième, de 1,87 km et environ 45
      minutes, également facile, permet de débuter et de conclure la boucle principale depuis El Socorro.


      Quel que soit le chemin choisi, faites halte aux belvédères : ils embrassent les coulées basaltiques,
      les cardons et les euphorbes qui façonnent l’horizon. Le sentier traverse une zone hébergeant plus de
      soixante espèces de lichens.


      Pour venir, empruntez l’autoroute TF-1 et prenez la sortie vers le Polígono Industrial de Arafo ; au
      premier carrefour, bifurquez à droite. L’accès à la réserve se trouve à environ 1,6 km.
    history: >-
      Ceux qui vécurent ici surent en tirer parti. Les populations aborigènes guanches étourdissaient les
      poissons en empoisonnant les flaques de marée avec le suc du cardon ou de l’euphorbe amère, une pratique
      appelée embarbascado. Ils extrayaient aussi le sel de mer : deux salines historiques demeurent
      remarquablement conservées. Le pastoralisme hivernal s’exerçait déjà avant le quinzième siècle et s’est
      perpétué ensuite à plus modeste échelle. On récoltait le latex de l’euphorbe, et le cratère comme les
      flancs du cône furent longtemps cultivés.


      Le malpaís est protégé depuis 1987 et un comité de gestion fut constitué en 1989. La loi canarienne sur
      les espaces naturels de 1994 lui a conféré son statut actuel de réserve naturelle spéciale du Malpaís de
      Güímar. Son plan directeur est définitivement approuvé.
    before: >-
      Marchez accompagné et sur les sentiers balisés, et respectez les propriétés riveraines des habitants.
      Remportez l’intégralité de vos déchets, y compris organiques, et prenez garde aux mégots. Ne prélevez
      aucune plante, aucun animal ni aucun minéral. En évitant le bruit, vous percevrez bien davantage la
      faune qui vous entoure.


      Renseignez-vous au préalable sur l’état des sentiers : le gestionnaire signale les fermetures
      éventuelles ou les restrictions de passage à la suite d’intempéries.
    around: >-
      Parmi les autres espaces protégés de Tenerife figurent le [Parc national du
      Teide](/lugar/parque-nacional-del-teide/) et le [Parc rural d’Anaga](/lugar/parque-rural-de-anaga/).
  de:
    intro: >-
      Vor weniger als 5000 Jahren drang Lava aus Spalten am Fuß eines Vulkans und floss ins Meer. Was sie
      hinterließ, ist das Malpaís de Güímar: eine raue, steinige und chaotisch anmutende Landschaft mit
      bizarren Formen im Südosten Teneriffas. Über den Lavaströmen wachsen Kandelaber-Wolfsmilch und Tabaibas,
      und von der rostroten Kuppe der Montaña Grande fällt das Relief sanft bis an die Küstenlinie ab. Die
      290,3 Hektar lassen sich an einem Vormittag zu Fuß erkunden.
    landscape: >-
      Die Entstehung beginnt an der Montaña Grande, dem höchsten Punkt mit 276 Metern. Sie bildete sich durch
      die Ablagerung pyroklastischer Massen—von Asche bis hin zu vulkanischen Bomben—in aufeinanderfolgenden
      Ausbrüchen; ihr Krater misst rund 300 Meter im Durchmesser und etwa 50 Meter in der Tiefe. Die Lava des
      Malpaís entströmte jedoch nicht diesem Krater, sondern brach aus Spalten am Fuß des Berges hervor und
      wälzte sich in basaltischen Aa-Lavaströmen bis ins Meer.


      Das Resultat ist eine reine Vulkanlandschaft, aus der ältere Erhebungen wie die Montaña de la Mar und
      Las Morras del Corcho herausragen, da sie von den Laven verschont blieben. Die Küstenlinie ist stark
      zerklüftet und birgt Buchten mit Geröllstränden und organischem Sand.


      Unter der Oberfläche verbirgt sich eine weitere Welt. Das Malpaís wird von zahlreichen Lavaröhren und
      Höhlen durchzogen, deren Dasein durch sogenannte Jameos—eingestürzte Deckenabschnitte—verraten wird. Am
      spektakulärsten ist die Cueva Honda (oder Cueva de los Burros) mit über 100 Metern Länge und bis zu 5
      Metern Höhe; sie darf nicht betreten werden.


      Das Klima rundet das Landschaftsbild ab. Niederschläge sind selten, und der Nordostpassat mildert die
      Temperaturen, die von durchschnittlich 17 °C im Januar bis 23 °C im August reichen. Die
      Sonnenscheindauer ist mit 2500 Stunden im Jahr sehr hoch, die relative Luftfeuchtigkeit liegt bei etwa
      70 %.


      Auf dem Basaltgestein herrscht die Pflanzenwelt vor: Weite Bestände des Tabaibal-Cardonal sind
      bemerkenswert gut erhalten, geprägt von der Kanarischen Kandelaber-Wolfsmilch. An der Küste bestimmen
      Meeressalat und Strandflieder das Bild, während auf den sandigen Böden Ginsterarten und Büschelgräser
      siedeln. Im gesamten Malpaís existieren mehr als 60 Flechtenarten.
    wildlife: >-
      Achte auf die Steine: Dort huschen Eidechsen umher, um sich in der Sonne aufzuwärmen. Mit ihnen leben
      Mauergeckos und Skinke. Unter den Pflanzen ist das Balillo eine der bemerkenswerten endemischen Arten
      des Reservats.


      Vögel stellen die vorherrschende Wirbeltiergruppe mit über einem Dutzend Brutvogelarten dar:
      Kanarenpieper, Wüstengimpel und Waldohreule, ergänzt durch Raubwürger, Wiedehopf und Turmfalke. Die
      Wirbellosen bilden die individuenreichste Gruppe mit zahlreichen endemischen Vertretern.


      Zu den eingeführten Säugetieren zählen Kaninchen, verwilderte Katzen, Ratten und Igel. Dank der milden
      Temperaturen lässt sich das Gebiet zu verschiedenen Jahreszeiten erwandern.
    visit: >-
      Drei Wanderwege erschließen das Reservat, wobei der erste die Hauptroute bildet. Er beginnt an der Calle
      Almirante Cervera in Puertito de Güímar und verläuft als Rundweg: 6,11 km, rund 3 Stunden Gehzeit und
      169 Höhenmeter im Anstieg, von mittlerem Schwierigkeitsgrad. Er führt zum Ausgangspunkt zurück.


      Der zweite Pfad umrundet die Montaña Grande auf einer linearen Strecke: 2,7 km, eine Stunde Gehzeit,
      leicht. Er lässt sich mit der Hauptroute verknüpfen. Der dritte Weg mit 1,87 km und etwa 45 Minuten
      Gehzeit, ebenfalls leicht, erlaubt den Einstieg in den Rundweg ab El Socorro.


      Halte auf jeder Route an den Aussichtspunkten inne: Sie bieten Blicke über die Lavaströme, Cardones und
      Tabaibas, die das Landschaftsbild prägen. Der Weg durchquert einen Bereich mit mehr als sechzig
      Flechtenarten.


      Zur Anreise folgst du der Autobahn TF-1 bis zur Ausfahrt Polígono Industrial de Arafo; an der ersten
      Kreuzung biegst du nach rechts ab. Der Zugang zum Schutzgebiet liegt nach etwa 1,6 km.
    history: >-
      Frühere Bewohner verstanden es, diesen Raum zu nutzen. Die Ureinwohner der Guanchen betäubten Fische,
      indem sie Gezeitentümpel mit dem giftigen Milchsaft der Kandelaber-Wolfsmilch oder der Bitteren Tabaiba
      tränkten—ein Verfahren namens Embarbascado. Dem Meer entnahmen sie Salz: Zwei historische Salinen sind
      noch hervorragend erhalten. Die winterliche Weidewirtschaft begann bereits vor dem fünfzehnten
      Jahrhundert und bestand später in kleinerem Umfang fort. Aus der Tabaiba gewann man Kautschukmilch, und
      der Krater sowie die Hänge des Vulkans wurden über Generationen hinweg landwirtschaftlich genutzt.


      Das Malpaís steht seit 1987 unter Naturschutz; 1989 wurde ein Kuratorium für Verwaltung und Pflege
      gegründet. Das kanarische Naturschutzgesetz von 1994 verlieh ihm den heutigen Status als Besonderes
      Naturschutzgebiet Malpaís de Güímar. Der Managementplan ist rechtskräftig genehmigt.
    before: >-
      Wandere nicht allein und bleibe auf den markierten Wegen, und respektiere das Privateigentum der
      Anwohner. Nimm sämtliche Abfälle inklusive Bioabfall wieder mit und achte sorgsam auf Zigarettenkippen.
      Sammle weder Pflanzen, Tiere noch Steine. Wenn du Lärm vermeidest, wirst du ungleich mehr Tierleben
      entdecken.


      Erkundige dich vorab über den Wegzustand: Die Schutzgebietsverwaltung warnt, wenn Pfade nach Unwettern
      unpassierbar sind oder Instandsetzungsarbeiten stattfinden.
    around: >-
      Weitere Naturräume auf Teneriffa sind der [Nationalpark Teide](/lugar/parque-nacional-del-teide/) und
      der [Landschaftspark Anaga](/lugar/parque-rural-de-anaga/).
  it:
    intro: >-
      Meno di 5000 anni fa la lava sgorgò da fessure alla base di una montagna riversandosi verso il mare. Ciò
      che ne derivò è il Malpaís de Güímar: una distesa scabrosa, pietrosa e dall’aspetto caotico, ricca di
      forme contorte nel sud-est di Tenerife. Sulle colate laviche sono cresciuti cardi ed euforbie tabaibas,
      mentre dalla sommità rossastra di Montaña Grande il rilievo digrada fino alla linea di costa. Sono 290,3
      ettari che si visitano piacevolmente a piedi nell’arco di una mattinata.
    landscape: >-
      La genesi ha inizio a Montaña Grande, punto culminante a 276 metri di quota. Si è formata dall’accumulo
      di materiale piroclastico, dalle ceneri alle bombe vulcaniche, nel corso di eruzioni successive; il
      cratere misura circa 300 metri di diametro per una cinquantina di profondità (50 metri). Tuttavia la
      lava del malpaís non è scaturita da questo cono: è sgorgata da fessure aperte alla base della montagna,
      avanzando in colate basaltiche di tipo aa verso il mare.


      Il paesaggio che ne deriva è interamente vulcanico, dal quale emergono Montaña de la Mar e Las Morras
      del Corcho, più antiche, scampate all’inondazione lavica. La costa è frastagliata, scandita da calette
      con ciottoli levigati e sabbia di origine organica.


      Sotto la superficie si schiude un altro mondo. Il malpaís è attraversato da un fitto reticolo di tunnel
      di lava e cavità, la cui presenza è tradita dai jameos, tratti in cui il soffitto è parzialmente
      crollato. La cavità più grandiosa è Cueva Honda (o Cueva de los Burros), lunga più di 100 metri e alta
      fino a 5 metri; l’accesso non è consentito.


      Il clima completa il quadro ambientale. Le precipitazioni sono scarse e gli alisei di nord-est mitigano
      le temperature, con una media di 17 °C a gennaio e 23 °C ad agosto. L’insolazione è straordinaria, con
      2500 ore annue di sole, e l’umidità relativa si aggira attorno al 70 %.


      Sulla roccia vulcanica domina la flora: abbonda la macchia a cardonal-tabaibal, ben conservata, con
      l’euforbia delle Canarie. Sulla costa predominano la lattuga di mare e lo spillone marino, mentre sui
      terreni sabbiosi vegetano ginestre e graminacee. Nell’intero malpaís si contano più di 60 specie di
      licheni.
    wildlife: >-
      Osserva tra le rocce: le lucertole saettano in cerca di sole. Con esse convivono gechi delle Canarie e
      scinchi. Tra le piante, il balillo figura tra le specie endemiche degne di nota nella riserva.


      Gli uccelli rappresentano il gruppo di vertebrati predominante, con oltre una dozzina di specie
      nidificanti: il calandro di Berthelot, il trombettiere e il gufo comune, oltre alla gerla meridionale,
      all’upupa e al gheppio. Gli invertebrati costituiscono il raggruppamento più cospicuo, con diversi
      endemismi canari.


      Tra i mammiferi introdotti si annoverano conigli, gatti selvatici, ratti e ricci. Le temperature
      gradevoli consentono di organizzare escursioni in ogni periodo dell’anno.
    visit: >-
      Tre sentieri attraversano l’area, con il primo a fare da spina dorsale. Prende le mosse da Calle
      Almirante Cervera a Puertito de Güímar ed è ad anello: 6,11 km, circa 3 ore di cammino e 169 metri di
      dislivello positivo cumulato, con difficoltà media. Riconduce al punto di partenza.


      Il secondo costeggia Montaña Grande con un percorso lineare: 2,7 km, un’ora, difficoltà bassa. Si può
      raccordare al primo per prolungare la camminata. Il terzo tracciato, di 1,87 km e circa 45 minuti,
      anch’esso facile, consente di iniziare e concludere l’anello principale partendo da El Socorro.


      Su qualsiasi tracciato, concediti una sosta ai belvederi: consentono di ammirare le colate, i cardi e le
      euforbie che dominano l’orizzonte. Il sentiero attraversa una fascia con oltre sessanta specie di
      licheni.


      Per arrivare, prendi l’autostrada TF-1 ed esci verso il Polígono Industrial de Arafo; al primo incrocio
      svolta a destra. L’accesso alla riserva si trova a circa 1,6 km.
    history: >-
      Chi visse in queste terre seppe sfruttarne le risorse. Gli antichi Guanci stordivano i pesci avvelenando
      le pozze di marea con il lattice velenoso del cardón o della tabaiba amara, una tecnica detta
      embarbascado. Dal mare estraevano il sale: si possono tuttora osservare due saline storiche ben
      conservate. Il pascolo invernale era praticato già prima del quindicesimo secolo e si mantenne in
      seguito su scala più ridotta. Dalla tabaiba si ricavava lattice, e il cratere e i pendii del vulcano
      vennero coltivati per lungo tempo.


      Il malpaís gode di tutela dal 1987 e nel 1989 venne istituito un comitato per la sua gestione. La legge
      sugli spazi protetti delle Canarie del 1994 gli conferì l’attuale titolo di Riserva Naturale Speciale
      del Malpaís de Güímar. Il Piano Direttore è definitivamente approvato.
    before: >-
      Cammina accompagnato e lungo i sentieri tracciati, e rispetta le proprietà dei residenti. Riporta
      indietro tutti i rifiuti, inclusi quelli organici, e fai attenzione ai mozziconi di sigaretta. Non
      raccogliere piante, animali o sassi. Evitando i rumori potrai scorgere molta più fauna attorno a te.


      Informati preventivamente sullo stato del sentiero: l’ente gestore segnala eventuali chiusure o tratti
      sconsigliati a seguito di maltempo.
    around: >-
      Altri spazi protetti di Tenerife sono il [Parco Nazionale del Teide](/lugar/parque-nacional-del-teide/)
      e il [Parco Rurale di Anaga](/lugar/parque-rural-de-anaga/).
  pt:
    intro: >-
      Há menos de 5000 anos, a lava irrompeu por fissuras na base de uma montanha e correu até ao mar. O
      resultado é o Malpaís de Güímar: uma superfície rugosa, pedregosa e de feição caótica, com formas
      recortadas, no sudeste de Tenerife. Sobre as escoadas fixaram-se cardos e tabaibas, enquanto do cimo
      avermelhado de Montaña Grande o relevo declina até ao litoral. São 290,3 hectares que se percorrem a pé
      ao longo de uma manhã.
    landscape: >-
      A história principia em Montaña Grande, o ponto culminante, com 276 metros. Formou-se por acumulação de
      material piroclástico, desde cinzas a bombas vulcânicas, em sucessivas erupções, medindo a sua cratera
      cerca de 300 metros de diâmetro e perto de 50 de profundidade. Contudo, a lava do malpaís não emanou da
      cratera. Brotou de fendas distribuídas pela base do cone e progrediu em escoadas basálticas de tipo aa
      até ao oceano.


      O resultado é uma paisagem exclusivamente vulcânica, da qual sobressaem Montaña de la Mar e Las Morras
      del Corcho, mais antigas, por terem escapado ao soterramento. O litoral é recortado, salpicado de
      pequenas calhetas com calhaus rolados e areia orgânica.


      Sob a superfície esconde-se outro universo. O malpaís é atravessado por uma extensa rede de tubos e
      grutas vulcânicas, cuja existência é denunciada pelos jameos, setores onde o teto desabou parcialmente.
      A mais notável é a Cueva Honda (ou Cueva de los Burros), com mais de 100 metros de comprimento e até 5
      de altura; não é visitável.


      O clima remata o cenário. A chuva é escassa e os ventos alísios de nordeste amenizam as temperaturas,
      com médias de 17 °C em janeiro a 23 °C em agosto. A insolação é notável, com 2500 horas anuais de sol,
      rondando a humidade relativa os 70 %.


      Sobre a rocha nua, a vegetação impõe-se: prolifera o cardonal-tabaibal, relativamente bem preservado,
      com o cardo-das-canárias. Junto à costa predominam a alface-do-mar e a estátice-marítima, enquanto nos
      areais surgem tojos e gramíneas vivazes. Em todo o malpaís encontram-se mais de 60 espécies de líquenes.
    wildlife: >-
      Repara nas pedras: ali deslizam lagartos em busca de sol. Juntamente com eles habitam osgas e esguichos.
      Entre a flora, o balillo é um dos endemismos assinalados na reserva.


      As aves formam o grupo de vertebrados predominante, com mais de uma dúzia de espécies nidificantes: o
      corre-caminhos, o pintarroxo-trombeteiro e o bufo-pequeno, além do picanço-real, da poupa e do
      francelho. Os invertebrados compõem a comunidade mais numerosa, destacando-se vários endemismos
      canários.


      Entre os mamíferos introduzidos contam-se coelhos, gatos assilvestrados, ratos e ouriços. As
      temperaturas amenas permitem organizar caminhadas em qualquer época do ano.
    visit: >-
      Existem três percursos pedestres, funcionando o primeiro como eixo estruturante. Tem início na Calle
      Almirante Cervera, em Puertito de Güímar, e é circular: 6,11 km, cerca de 3 horas e 169 metros de
      desnível positivo acumulado, com dificuldade média. Regressa ao ponto de partida.


      O segundo percurso contorna Montaña Grande num traçado linear: 2,7 km, uma hora, dificuldade baixa.
      Liga-se ao primeiro para prolongar a caminhada. O terceiro, com 1,87 km e cerca de 45 minutos, também de
      dificuldade baixa, permite iniciar e terminar o circuito principal a partir de El Socorro.


      Em qualquer um deles, faz uma paragem nos miradouros: dali avistam-se as escoadas, os cardos e as
      tabaibas que definem o horizonte. O trilho atravessa uma área com mais de sessenta espécies de líquenes.


      Para chegar, apanha a autoestrada TF-1 e sai em direção ao Polígono Industrial de Arafo; no primeiro
      cruzamento, vira à direita. O acesso à reserva dista cerca de 1,6 km.
    history: >-
      Quem aqui habitou soube tirar proveito do meio. As antigas comunidades aborígenes guanches atordoavam o
      peixe envenenando as poças de maré com o látex do cardo ou da tabaiba-amarga, técnica denominada
      embarbascado. Do mar extraíam sal: ainda se avistam duas marinhas de sal históricas perfeitamente
      preservadas. O pastoreio de inverno praticava-se já antes do século XV e manteve-se posteriormente em
      escala reduzida. Da tabaiba extraía-se látex, e a cratera e as encostas da montanha foram cultivadas ao
      longo de muito tempo.


      O malpaís está classificado como espaço natural protegido desde 1987 e em 1989 foi constituído um
      patronato para o seu ordenamento. A Lei de Espaços Naturais das Canárias de 1994 atribuiu-lhe a atual
      designação de Reserva Natural Especial do Malpaís de Güímar. O Plano Diretor conta com aprovação
      definitiva.
    before: >-
      Caminha acompanhado e sempre pelos trilhos sinalizados, e respeita a propriedade privada dos habitantes
      locais. Transporta contigo todo o lixo, incluindo resíduos orgânicos, e tem especial cuidado com as
      beatas. Não colhas plantas, animais ou minerais. Evitando ruídos desnecessários poderás observar muito
      mais fauna ao teu redor.


      Informa-te previamente sobre o estado dos trilhos: a entidade gestora indica se a circulação está
      desaconselhada após episódios meteorológicos adversos ou se existem troços interditos.
    around: >-
      Outros espaços protegidos de Tenerife são o [Parque Nacional do
      Teide](/lugar/parque-nacional-del-teide/) e o [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/).
