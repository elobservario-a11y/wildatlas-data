unico:
  es: >-
    Un río que fue rectificado y contaminado y que hoy guarda orquídeas, castores y mariposas que dependen de
    una sola hierba.
  en: >-
    A river once heavily canalised and polluted that now safeguards wild orchids, beavers, and rare
    butterflies dependent on a single meadow herb.
  fr: >-
    Une rivière jadis canalisée et polluée qui abrite aujourd'hui orchidées sauvages, castors et papillons
    inféodés à une seule plante hôte.
  de: >-
    Ein begradigter und ehemals belasteter Fluss, der heute wilde Orchideen, Biber und Ameisenbläulinge
    bewahrt, die auf eine einzige Wiesenpflanze angewiesen sind.
  it: >-
    Un corso d'acqua rettificato e inquinato nel passato che custodisce oggi orchidee selvatiche, castori e
    farfalle legate a un'unica erba prativa.
  pt: >-
    Um rio outrora retificado e poluído que resguarda hoje orquídeas bravias, castores e borboletas
    dependentes de uma única planta herbácea.
