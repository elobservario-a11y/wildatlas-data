texto:
  es:
    intro: >-
      Hasta mediados del siglo XIX, el Elster Negro era una maraña: una red densa de brazos e islas, con
      orillas de carrizo y sauces grises. Hoy es un cauce recto entre diques, y su vega, una banda verde entre
      campos que merece más atención de la que recibe. El tramo medio del Schwarze Elster, que bordea los
      márgenes sur y oeste del parque natural Niederlausitzer Heidelandschaft entre Plessa y
      Uebigau-Wahrenbrück, conserva en pedazos lo que fue: prados húmedos, algunos brazos muertos, robles
      viejos y un río que, pese a todo, sigue siendo hábitat de interés.
    landscape: >-
      El río mide 179 km y es afluente derecho del Elba, entre Sajonia, Brandeburgo y Sajonia-Anhalt. Nace a
      317 m de altitud en el Lausitzer Bergland, en la Alta Lusacia. Pasado Elsterwerda, cruza la parte más
      estrecha del valle glaciar Breslau-Magdeburgo, de siete kilómetros, y gira hacia el noroeste hasta el
      Elba.


      La historia reciente le cambió la cara. Desde mediados del siglo XIX se rectificó su curso, antes muy
      meandriforme, y se cortaron muchos brazos laterales. En 1852 se aprobó la ley de melioración y ese año
      se empezaron a rectificar y encauzar con diques 90 km del río, entre Tätschwitz y Premsendorf. Hasta los
      años ochenta, la contaminación industrial casi acabó con la riqueza de peces del río.


      Aun así, el río conserva por tramos vegetación acuática sumergida que constituye un hábitat de interés.
      En las llanuras de inundación hay praderas húmedas, prados aluviales y prados de siega de baja altitud.
      Esos prados necesitan manejo continuo, como pastoreo de ovejas y cabras, que se garantiza dentro de la
      protección frente a crecidas. Algunos brazos muertos y bosques aluviales de madera blanda completan el
      cuadro.
    wildlife: >-
      En los brazos muertos, aunque ya no los alcancen las crecidas naturales, viven el
      [castor](/especie/castor_fiber/) y la [nutria](/especie/lutra_lutra/). En el camino, algunos robles
      viejos que bordean la orilla y dan sombra son refugio del [ciervo volante](/especie/lucanus_cervus/).


      Una de las historias más finas del río es la de una mariposa. La Ameisenbläuling pone los huevos solo en
      los capítulos cerrados de la hierba Großer Wiesenknopf, y las hormigas llevan a las larvas a su nido. En
      los prados húmedos de Kahla, gestionados con criterios de conservación, florecen en primavera miles de
      orquídeas. Desde el camino se ven, además, campos y prados que las [cigüeñas
      blancas](/especie/ciconia_ciconia/) usan como zona de caza.


      Cerca, en el parque natural, hay otra vida. En Naturparadies Grünhaus, un antiguo paisaje minero de
      escombreras, taludes y hondonadas llenas de agua, se pueden ver con prismáticos [aguiluchos
      laguneros](/especie/circus_aeruginosus/) y [ánsares comunes](/especie/anser_anser/), y
      [grullas](/especie/grus_grus/) que duermen en grupo en aguas poco profundas. Las orillas que se
      desmoronan de los lagos nuevos ofrecen sitios de cría al [martín pescador](/especie/alcedo_atthis/), la
      avión zapador y a insectos raros. Y de mediados de agosto a mediados de septiembre un manto violeta de
      brezo cubre las zonas abiertas de la reserva Forsthaus Prösa.
    visit: >-
      La forma natural es la bici. El Schwarze Elster Radweg está asfaltado, no tiene cuestas ni tráfico de
      coches. El gestor recomienda un recorrido desde Bad Liebenwerda por Wahrenbrück hasta Neumühl.


      Para entender el río, el centro de visitantes erlebnisREICH Naturpark, en el palacio de Doberlug, es el
      punto de partida norte del parque natural. El calendario del parque incluye RangerTouren y días
      familiares en el Naturparkzentrum, y se puede colaborar con la biodiversidad y la conservación mediante
      jornadas de voluntariado. En invierno se pueden seguir huellas de animales en la nieve, y la Naturwacht
      ayuda a identificarlas.


      Una pista de agua: once antiguos meandros de la Kleine Elster se han reconectado al cauce, y los
      refugios creados en él benefician a peces raros como el Bitterling y el Schlammpeitzger. La libélula
      Prachtlibelle destaca allí por su brillo azul al sol.
    history: >-
      El tramo medio del Elster Negro está bordeado por un área de hábitats protegidos de la red FFH, que
      incluye afluentes como el Rieke, el Pulsnitz y el Kleine y Große Röder. El plan FFH reunió entre 2009 y
      2013 las medidas destinadas a conservar los hábitats y especies valiosos del río. Desde 2012 el parque
      natural trabaja además en reintroducir el [urogallo](/especie/tetrao_urogallus/), extinguido en la zona.
    before: >-
      Consulta a la administración del parque natural los avisos y la apertura del centro de visitantes antes
      de ir.
    around: >-
      El [Biosphärenreservat Mittelelbe](/lugar/biospharenreservat-mittelelbe/) está a unos veintitrés
      kilómetros. Más lejos, la [Llanura aluvial del Alto Rin](/lugar/upper-rhine-floodplain-rheinauen/) y el
      [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) comparten el milano real y el castor.
  en:
    intro: >-
      Until the mid-nineteenth century, the Black Elster was a braided maze: a labyrinthine network of
      secondary arms, gravel bars, and islands hemmed by reed beds and grey willows. Today it runs as a
      straight channel bounded by artificial dykes, its floodplain forming a verdant ribbon among agricultural
      fields that warrants far more appreciation than it typically receives. The middle reaches of the
      Schwarze Elster, flanking the southern and western margins of the Niederlausitzer Heidelandschaft Nature
      Park between Plessa and Uebigau-Wahrenbrück, retain precious fragments of this former wildness: wet
      meadows, quiet oxbows, veteran pedunculate oaks, and a river corridor that remains an ecological
      lifeline.
    landscape: >-
      The river stretches 179 km as a right-bank tributary of the Elbe, traversing Saxony, Brandenburg, and
      Saxony-Anhalt. It rises at 317 m elevation in the Lusatian Highlands (Lausitzer Bergland) in Upper
      Lusatia. Beyond Elsterwerda it funnels through the narrowest seven-kilometre bottleneck of the
      Breslau-Magdeburg glacial spillway before swinging northwest toward its confluence with the Elbe.


      Modern history transformed its morphology. Beginning in the mid-nineteenth century its meanders were
      systematically straightened and numerous lateral side-arms severed. In 1852 a major melioration statute
      was enacted, launching the dyking and channel straightening of 90 km of the waterway between Tätschwitz
      and Premsendorf. Through the nineteen-eighties, intense industrial pollution severely depleted fish
      stocks.


      Nevertheless, sections of the river retain submerged macrophyte communities representing habitats of
      conservation interest. The floodplain shelters wet grasslands, alluvial meadows, and lowland hay
      meadows. These grasslands require continuous conservation management, such as grazing by sheep and
      goats, harmonised with local flood defence priorities. Scattered oxbow lakes and softwood riparian
      forests complete the fluvial tapestry.
    wildlife: >-
      Within the oxbow cut-offs, even where severed from annual flood pulses, the [Eurasian
      beaver](/especie/castor_fiber/) and [Eurasian otter](/especie/lutra_lutra/) maintain thriving lodges.
      Along riverside tracks, veteran oaks casting generous shade provide vital wood-decay habitat for the
      [stag beetle](/especie/lucanus_cervus/).


      One of the river's most delicate ecological partnerships involves a rare lycaenid butterfly: the scarce
      large blue (*Phengaris teleius*) lays its eggs exclusively in the closed flowerheads of great burnet,
      after which meadow ants carry the caterpillars into their subterranean nests. In the damp meadows of
      Kahla, managed under strict conservation regimes, thousands of wild orchids flower in spring. From the
      path you will look out across fields and pastures that [white storks](/especie/ciconia_ciconia/) use as
      primary foraging grounds.


      Nearby in the nature park, wildlife flourishes in transformed post-mining landscapes. At Naturparadies
      Grünhaus—a former opencast pit of spoil tips, terraces, and water-filled hollows—birdwatchers using
      spotting scopes regularly observe [western marsh harriers](/especie/circus_aeruginosus/) and [greylag
      geese](/especie/anser_anser/), alongside flocks of [common cranes](/especie/grus_grus/) roosting
      communally in the shallows. Eroding sandy banks of newly formed mining lakes provide nesting sites for
      the [common kingfisher](/especie/alcedo_atthis/), sand martins, and specialized burrowing insects. From
      mid-August to mid-September, a sweeping purple mantle of heather carpets the open heath of the Forsthaus
      Prösa reserve.
    visit: >-
      Bicycle touring is the ideal mode of exploration. The Schwarze Elster Radweg is fully paved, flat, and
      segregated from motor traffic. A rewarding route recommended by park rangers runs from Bad Liebenwerda
      through Wahrenbrück to Neumühl.


      To understand the river system, the erlebnisREICH Naturpark visitor centre at Doberlug Castle serves as
      the northern gateway to the nature park. The park's seasonal calendar offers ranger-led walks
      (RangerTouren) and family activity days, with opportunities to engage in citizen science and volunteer
      conservation projects. In winter you can track mammal footprints in the snow with guidance from the
      Naturwacht ranger service.


      A waterway highlight: eleven historical oxbows of the Kleine Elster have been reconnected to the main
      stream, creating quiet havens that benefit sensitive native fish including European bitterling and
      weather loach. Beautiful demoiselle damselflies dart over the ripples, shimmering iridescent blue in the
      sunlight.
    history: >-
      The middle course of the Black Elster is bordered by a European protected area network under the
      Habitats Directive, encompassing tributary waterways such as the Rieke, Pulsnitz, and the Kleine and
      Große Röder. The comprehensive FFH management plan formulated between 2009 and 2013 unified conservation
      measures for the basin's species and biotopes. Since 2012 the nature park has also actively pursued
      reintroduction programmes for the [western capercaillie](/especie/tetrao_urogallus/), which had
      disappeared from the regional pine barrens.
    before: >-
      Check trail advisories and visitor centre opening hours with the nature park administration before
      setting out.
    around: >-
      [Biosphärenreservat Mittelelbe](/lugar/biospharenreservat-mittelelbe/) lies approximately twenty-three
      kilometres to the northwest. Farther afield, the [Llanura aluvial del Alto
      Rin](/lugar/upper-rhine-floodplain-rheinauen/) and [Parque Nacional de
      Słowiński](/lugar/slowinski-park-narodowy/) share populations of red kites and beavers.
  fr:
    intro: >-
      Jusqu'au milieu du XIXe siècle, l'Elster Noire formait un dédale sauvage : un réseau ramifié de bras
      secondaires et d'îlots alluviaux bordés de roselières et de saules cendrés. C'est aujourd'hui un chenal
      rectifié endigué, dont la plaine inondable dessine un ruban végétal au milieu des cultures qui mérite
      une attention renouvelée. Le cours moyen de la Schwarze Elster, longeant les marges sud et ouest du parc
      naturel du Niederlausitzer Heidelandschaft entre Plessa et Uebigau-Wahrenbrück, conserve de précieux
      vestiges de sa dynamique primitive : prairies humides, bras morts isolés, chênes vénérables et une
      rivière demeurée un corridor écologique d'intérêt majeur.
    landscape: >-
      La rivière s'étire sur 179 km en rive droite de l'Elbe, traversant la Saxe, le Brandebourg et la
      Saxe-Anhalt. Elle prend sa source à 317 m d'altitude dans les collines de Lusace (Lausitzer Bergland),
      en Haute-Lusace. En aval d'Elsterwerda, elle franchit le goulot d'étranglement proglaciaire de
      Breslau-Magdebourg, large de sept kilomètres, avant de bifurquer vers le nord-ouest en direction de
      l'Elbe.


      L'époque moderne a profondément remanié sa morphologie. Dès le milieu du XIXe siècle, son tracé
      originellement méandreux a été rectifié et ses bras latéraux colmatés. En 1852 fut promulguée la loi de
      drainage agricole, lançant l'endiguement et la rectification de 90 km de chenal entre Tätschwitz et
      Premsendorf. Jusque dans les années quatre-vingt, les rejets industriels ont sévèrement éprouvé les
      peuplements piscicoles.


      Malgré ces altérations, plusieurs tronçons conservent une riche flore aquatique submergée d'intérêt
      patrimonial. La plaine inondable abrite des cariçaies, des prairies alluviales et des prairies de fauche
      de basse altitude. Ces parcelles herbagères nécessitent un entretien régulier, assuré par le pâturage
      ovin et caprin en concertation avec les impératifs d'écrêtement des crues. Quelques bras morts et
      lambeaux de forêts alluviales complètent l'ensemble.
    wildlife: >-
      Dans les bras morts, même déconnectés des submersions ordinaires, se maintiennent le [castor
      d'Europe](/especie/castor_fiber/) et la [loutre d'Europe](/especie/lutra_lutra/). Le long des pistes de
      halage, de vieux chênes pédonculés ombragent les berges et abritent le [lucane
      cerf-volant](/especie/lucanus_cervus/).


      Le cours d'eau accueille une fascinante chaîne biologique : l'azuré de la sanguisorbe dépose ses œufs
      exclusivement dans les capitules floraux de la grande pimprenelle, avant que les fourmis ne recueillent
      les chenilles au sein de leur fourmilière. Dans les prés humides de Kahla, fauchés selon un calendrier
      écologique, s'épanouissent au printemps des milliers d'orchidées sauvages. Depuis la piste cyclable, le
      regard balaie des pâtures où chassent les [cigognes blanches](/especie/ciconia_ciconia/).


      À proximité immédiate, le parc naturel héberge une biodiversité pionnière. Dans le Naturparadies
      Grünhaus—un ancien bassin minier réhabilité mêlant terrils, talus sableux et plans d'eau—on observe à la
      longue-vue le [busard des roseaux](/especie/circus_aeruginosus/), l'[oie cendrée](/especie/anser_anser/)
      et des groupes de [grues cendrées](/especie/grus_grus/) passant la nuit en eau peu profonde. Les berges
      ravinées des nouveaux étangs offrent des cavités au [martin-pêcheur d'Europe](/especie/alcedo_atthis/),
      à l'hirondelle de rivage et à des coléoptères sabulicoles. De la mi-août à la mi-septembre, la floraison
      violette de la bruyère métamorphose les clairières de la réserve de Forsthaus Prösa.
    visit: >-
      Le vélo est le moyen de transport idéal. La véloroute de la Schwarze Elster est asphaltée, plane et
      totalement préservée de la circulation automobile. La maison du parc recommande l'itinéraire reliant Bad
      Liebenwerda à Neumühl via Wahrenbrück.


      Pour s'orienter, le centre d'accueil erlebnisREICH Naturpark, établi dans le château de Doberlug,
      constitue la porte septentrionale du parc naturel. Le programme propose des sorties accompagnées par les
      rangers (RangerTouren) et des ateliers thématiques, ainsi que des actions écocitoyennes bénévoles. En
      hiver, les sorties sur la neige permettent d'identifier les traces d'animaux avec l'aide des gardes de
      la Naturwacht.


      Côté rivière, onze anciens méandres de la Petite Elster ont été reconnectés au lit mineur, offrant des
      zones de frayère à des poissons menacés tels que la bouvière et la loche d'étang. Le caloptéryx éclatant
      y patrouille au soleil, étincelant de reflets bleu métallique.
    history: >-
      Le cours moyen de l'Elster Noire est bordé par un ensemble de sites d'importance communautaire du réseau
      de protection européen englobant plusieurs affluents comme la Rieke, la Pulsnitz ainsi que la Petite et
      Grande Röder. Le plan de gestion communautaire a arrêté entre 2009 et 2013 les mesures de conservation
      des habitats et espèces. Depuis 2012, le parc naturel soutient également un projet de réintroduction du
      [grand tétras](/especie/tetrao_urogallus/), jadis disparu des pinèdes environnantes.
    before: >-
      Prenez contact avec la maison du parc naturel pour vérifier les conditions d'accès et l'ouverture du
      centre d'interprétation avant votre excursion.
    around: >-
      Le [Biosphärenreservat Mittelelbe](/lugar/biospharenreservat-mittelelbe/) se trouve à environ
      vingt-trois kilomètres. Plus loin, la [Llanura aluvial del Alto
      Rin](/lugar/upper-rhine-floodplain-rheinauen/) et le [Parque Nacional de
      Słowiński](/lugar/slowinski-park-narodowy/) partagent la présence du milan royal et du castor.
  de:
    intro: >-
      Bis zur Mitte des neunzehnten Jahrhunderts war die Schwarze Elster ein weit verzweigtes
      Gewässerlabyrinth: ein Geflecht aus Nebenarmen, Flussinseln und Röhrichten gesäumt von
      Grauweidengebüschen. Heute fließt sie kanalisiert zwischen Deichen, doch ihre Aue bildet ein grünes Band
      in der Agrarlandschaft, das mehr Wertschätzung verdient. Der Mittellauf der Schwarzen Elster, der den
      Naturpark Niederlausitzer Heidelandschaft zwischen Plessa und Uebigau-Wahrenbrück im Süden und Westen
      einfasst, bewahrt Mosaiksteine vergangener Auenlandschaften: Feuchtwiesen, Altarme, alte Stieleichen und
      einen Flusslauf, der wertvolle Lebensräume bietet.
    landscape: >-
      Der 179 km lange Fluss entspringt auf 317 m Höhe im Lausitzer Bergland in der Oberlausitz und mündet als
      rechter Nebenfluss in die Elbe. Hinter Elsterwerda durchquert er die nur sieben Kilometer breite Talenge
      des Breslau-Magdeburger Urstromtals und wendet sich nordwestwärts der Elbe zu.


      Die jüngere Geschichte formte das Gewässerbett neu: Ab Mitte des neunzehnten Jahrhunderts wurde der
      stark mäandrierende Lauf begradigt und zahlreiche Altarme abgetrennt. Im Jahr 1852 trat das
      Meliorationsgesetz in Kraft, woraufhin die Eindeichung und Begradigung von 90 km Flussstrecke zwischen
      Tätschwitz und Premsendorf begann. Bis in die achtziger Jahre dezimierte industrielle Abwasserbelastung
      die Fischbestände empfindlich.


      Dennoch beherbergen Abschnitte der Schwarzen Elster schutzwürdige Fluthahnenfuß- und
      Laichkrautgesellschaften. In der Aue breiten sich Feuchtwiesen, Auenwiesen und magere
      Flachland-Mähwiesen aus. Diese Grünlandflächen sind auf kontinuierliche Nutzung wie Schaf- und
      Ziegenbeweidung angewiesen, die mit dem Hochwasserschutz abgestimmt wird. Altwasser und Reste von
      Weichholzauen ergänzen das Auengefüge.
    wildlife: >-
      In den abgetrennten Altarmen, selbst wenn sie von Hochwassern nicht mehr erreicht werden, leben
      [Europäischer Biber](/especie/castor_fiber/) und [Eurasischer Fischotter](/especie/lutra_lutra/). Alte
      Stieleichen entlang des Uferwegs beschatten die Trasse und bieten dem
      [Hirschkäfer](/especie/lucanus_cervus/) Totholznischen.


      Zu den ökologischen Besonderheiten zählt der Helle Wiesenknopf-Ameisenbläuling: Seine Falter legen die
      Eier ausschließlich in die Blütenköpfe des Großen Wiesenknopfs, woraufhin Knotenameisen die Larven in
      ihr Erdnest adoptieren. Auf den extensiv gepflegten Feuchtwiesen bei Kahla blühen im Frühjahr Tausende
      wilde Orchideen. Vom Deichweg aus überblickt man Wiesen und Äcker, die
      [Weißstörche](/especie/ciconia_ciconia/) als Nahrungshabitat nutzen.


      In der Bergbaufolgelandschaft des Naturparadieses Grünhaus lassen sich mit dem Spektiv
      [Rohrweihe](/especie/circus_aeruginosus/) und [Graugans](/especie/anser_anser/) beobachten, während
      Trupps von [Kranichen](/especie/grus_grus/) im Flachwasser rasten. An den Abbruchkanten der Bergbauseen
      nisten [Eisvogel](/especie/alcedo_atthis/), Uferschwalbe und spezialisierte Insektenarten. Von Mitte
      August bis Mitte September überzieht die Besenheide die Sandflächen des Naturschutzgebiets Forsthaus
      Prösa mit einem lila Blütenteppich.
    visit: >-
      Das Rad ist das beste Fortbewegungsmittel: Der Schwarze-Elster-Radweg ist asphaltiert, eben und
      autofrei. Die Naturparkverwaltung empfiehlt den Abschnitt von Bad Liebenwerda über Wahrenbrück nach
      Neumühl.


      Das Besucherzentrum erlebnisREICH Naturpark im Schloss Doberlug fungiert als nördliches Eingangstor zum
      Schutzgebiet. Der Naturparkkalender bietet geführte RangerTouren und Thementage; Naturinteressierte
      können sich an Pflegeeinsätzen beteiligen. Im Winter lassen sich Tierspuren im Schnee mithilfe der
      Naturwacht bestimmen.


      Ein wasserbauliches Vorzeigeprojekt: Elf Altarme der Kleinen Elster wurden wieder an den Fluss
      angebunden, wovon seltene Fischarten wie Bitterling und Schlammpeitzger profitieren. Die Gebänderte
      Prachtlibelle tanzt an sonnigen Ufern über den Fluten.
    history: >-
      Der Mittellauf der Schwarzen Elster ist als FFH-Schutzgebiet ausgewiesen, das auch Zuflüsse wie Rieke,
      Pulsnitz sowie Kleine und Große Röder umfasst. Der FFH-Managementplan bündelte zwischen 2009 und 2013
      Erhaltungsmaßnahmen für Fließgewässer- und Auenbiotope. Seit 2012 beteiligt sich der Naturpark zudem an
      der Wiederansiedlung des [Auerhuhns](/especie/tetrao_urogallus/), das in den Heiden einst heimisch war.
    before: >-
      Erkundige dich vorab bei der Naturparkverwaltung über aktuelle Hinweise und Öffnungszeiten des
      Besucherzentrums.
    around: >-
      Das [Biosphärenreservat Mittelelbe](/lugar/biospharenreservat-mittelelbe/) liegt rund dreiundzwanzig
      Kilometer entfernt. Weiter entfernt teilen die [Llanura aluvial del Alto
      Rin](/lugar/upper-rhine-floodplain-rheinauen/) und der [Parque Nacional de
      Słowiński](/lugar/slowinski-park-narodowy/) Bestände von Rotmilan und Biber.
  it:
    intro: >-
      Fino alla metà del XIX secolo, l'Elster Nero formava un dedalo naturale: una complessa rete di meandri e
      isolotti ghiaiosi orlati da canneti e salici cenerini. Oggi scorre rettificato tra argini artificiali,
      ma la sua pianura alluvionale compone un nastro verde tra le colture che merita una riscoperta attenta.
      Il medio corso della Schwarze Elster, a ridosso dei margini meridionale e occidentale del parco naturale
      Niederlausitzer Heidelandschaft tra Plessa e Uebigau-Wahrenbrück, preserva tessere preziose
      dell'ambiente originario: prati umidi, lanche relitte, querce secolari e un corridoio ripariale di alto
      valore ecologico.
    landscape: >-
      Il fiume si sviluppa per 179 km come affluente di destra dell'Elba, attraversando Sassonia, Brandeburgo
      e Sassonia-Anhalt. Sgorga a 317 m di quota nelle colline della Lusazia (Lausitzer Bergland), nell'Alta
      Lusazia. Oltrepassata Elsterwerda, attraversa la stretta gola glaciale di Breslavia-Magdeburgo, ampia
      appena sette chilometri, piegando a nord-ovest verso la confluenza con l'Elba.


      Le vicende storiche recenti ne hanno mutato il volto. Dalla metà dell'Ottocento l'alveo meandriforme fu
      rettificato e numerosi rami secondari vennero interrati. Nel 1852 entrò in vigore la legge di bonifica
      agraria, avviando l'arginatura e la regolarizzazione di 90 km di corso fluviale tra Tätschwitz e
      Premsendorf. Fino agli anni ottanta gli scarichi industriali compromisero gravemente il patrimonio
      ittico.


      Ciò nonostante, il fiume preserva tratti con vegetazione macrofitica sommersa di notevole pregio
      biologico. La piana alluvionale accoglie prati umidi, praterie golenali e prati da sfalcio planiziali.
      Queste formazioni erbose richiedono una gestione continua mediante pascolo ovicaprino, integrata nelle
      misure di difesa idraulica. Lanche riparate e lembi di bosco alluvionale completano l'ambiente.
    wildlife: >-
      Nelle lanche relitte, pur non più raggiunte dalle piene ordinarie, risiedono stabilmente il [castoro
      europeo](/especie/castor_fiber/) e la [lontra europea](/especie/lutra_lutra/). Lungo gli argini,
      maestose farnie ombrosano il cammino fungendo da rifugio per il [cervo
      volante](/especie/lucanus_cervus/).


      Una delle associazioni più raffinate della pianura coinvolge una farfalla: l'argo azzurro della
      sanguisorba depone le uova soltanto nei capolini della pimpinella maggiore, dopodiché le formiche
      myrmica ne custodiscono i bruchi nel formicaio. Nei prati umidi di Kahla, governati da una gestione
      naturalistica, fioriscono a primavera migliaia di orchidee selvatiche. Dal tracciato arginale si
      scrutano campi aperti dove le [cicogne bianche](/especie/ciconia_ciconia/) reperiscono cibo.


      Nel vicino parco naturale pulsa un'altra biodiversità. Nel Naturparadies Grünhaus—antico bacino
      minerario rigenerato tra calanchi e specchi d'acqua—si osservano al cannocchiale il [falco di
      palude](/especie/circus_aeruginosus/) e l'[oca selvatica](/especie/anser_anser/), assieme a stormi di
      [gru](/especie/grus_grus/) che dormono in acque basse. Le rive sabbiose dei nuovi bacini offrono cavità
      nido al [martin pescatore](/especie/alcedo_atthis/), al topino e a insetti rari. Da metà agosto a metà
      settembre un tappeto violaceo di brugo ammanta la riserva di Forsthaus Prösa.
    visit: >-
      La bicicletta rappresenta il mezzo privilegiato. La pista ciclabile Schwarze Elster Radweg è asfaltata,
      priva di pendenze e interdetta al traffico automobilistico. L'ente parco consiglia la pedalata da Bad
      Liebenwerda a Neumühl transitando per Wahrenbrück.


      Per approfondire le dinamiche del fiume, il centro visite erlebnisREICH Naturpark nel castello di
      Doberlug funge da porta d'accesso settentrionale al comprensorio. Il calendario propone uscite tematiche
      con i guardiaparco (RangerTouren) e laboratori didattici per famiglie, oltre a giornate di volontariato
      ecologico. In inverno la Naturwacht supporta l'osservazione delle tracce animali lasciate sulla coltre
      nevosa.


      Sul versante idrografico, undici antichi meandri della Piccola Elster sono stati ricollegati al corso
      d'acqua, dando ossigeno a pesci rari come il rodeo amaro e il cobite di stagno. La calotterige
      splendente volteggia lungo le rive con i suoi riflessi blu cobalto.
    history: >-
      Il medio corso dell'Elster Nero è tutelato dalla rete di siti di interesse comunitario, comprendente
      affluenti quali il Rieke, il Pulsnitz e i corsi della Piccola e Grande Röder. Il piano di gestione SIC
      ha definito tra il 2009 e il 2013 le linee d'intervento a favore degli habitat ripariali. Dal 2012 il
      parco naturale è impegnato inoltre nel ripopolamento dell'[urogallo](/especie/tetrao_urogallus/),
      storicamente scomparso dalle pinete locali.
    before: >-
      Rivolgiti agli uffici del parco naturale per conoscere bollettini aggiornati e gli orari del centro
      visite prima dell'escursione.
    around: >-
      La [Biosphärenreservat Mittelelbe](/lugar/biospharenreservat-mittelelbe/) dista circa ventitré
      chilometri. Più lontano, la [Llanura aluvial del Alto Rin](/lugar/upper-rhine-floodplain-rheinauen/) e
      il [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) condividono presenze di nibbio reale
      e castoro.
  pt:
    intro: >-
      Até meados do século XIX, o Elster Negro formava um emaranhado bravio: uma densa malha de braços
      secundários e ilhotas orladas por caniçais e salgueiros-cinzentos. Hoje corre confinado entre diques
      artificiais, mas a sua várzea desenha uma fita verde entre os campos agrícolas que merece atenção
      renovada. O troço médio do Schwarze Elster, que acompanha as orlas sul e oeste do parque natural
      Niederlausitzer Heidelandschaft entre Plessa e Uebigau-Wahrenbrück, conserva testemunhos da sua antiga
      matriz: prados húmidos, meandros abandonados, carvalhos seculares e um rio que permanece um corredor
      ecológico de primeiro plano.
    landscape: >-
      O rio desenvolve 179 km na margem direita do Elba, banhando a Saxónia, Brandeburgo e Saxónia-Anhalt.
      Brota a 317 m de altitude no planalto da Lusácia (Lausitzer Bergland), na Alta Lusácia. Para lá de
      Elsterwerda transpõe o desfiladeiro fluvioglaciar de Breslau-Magdeburgo, com sete quilómetros de
      largura, fletindo para noroeste rumo ao Elba.


      A história moderna alterou profundamente o seu curso. A partir de meados do século XIX o leito
      meandriforme foi retificado e vários esteiros laterais foram entaipados. Em 1852 aprovou-se a lei de
      fomento hidroagrícola, iniciando-se a regularização e o encasulamento por diques de 90 km de rio entre
      Tätschwitz e Premsendorf. Até à década de oitenta a poluição industrial afetou gravemente as comunidades
      piscícolas.


      Apesar disso, o leito preserva trechos com vegetação submersa de elevado valor biológico. A planície de
      inundação abriga prados húmidos, pastagens aluviais e prados de feno de baixa altitude. Estas parcelas
      requerem pastoreio extensivo de ovelhas e cabras, articulado com a gestão das bacias de retenção de
      cheias. Braços mortos e matas aluviais de madeira branda completam o ecossistema.
    wildlife: >-
      Nas lagoas dos meandros cortados, ainda que já não recebam cheias cíclicas, fixaram-se o
      [castor-europeu](/especie/castor_fiber/) e a [lontra-europeia](/especie/lutra_lutra/). Pelo caminho
      ribeirinho, velhos carvalhos-robles que sombreiam o leito albergam a
      [vaca-loura](/especie/lucanus_cervus/).


      Entre as relações ecológicas mais singulares do vale sobressai a borboleta-das-formigas: a fêmea
      oviposita unicamente nos capítulos florais fechados da pimpinela-maior, após o que as formigas acolhem
      as lagartas no formigueiro. Nos prados húmidos de Kahla, sujeitos a cortes com critério botânico,
      florescem na primavera milhares de orquídeas silvestres. Do caminho avistam-se prados onde as
      [cegonhas-brancas](/especie/ciconia_ciconia/) caçam ativamente.


      No parque natural vizinho desponta outra dinâmica biológica. No Naturparadies Grünhaus—antiga bacia de
      exploração mineira de lenhite com escombreiras e depressões alagadas—avistam-se à luneta
      [tartaranhões-ruivos-dos-pauis](/especie/circus_aeruginosus/) e [gansos-bravos](/especie/anser_anser/),
      para além de bandos de [grous-comuns](/especie/grus_grus/) que pernoitam em águas baixas. As arribas
      arenosas das novas lagoas fornecem locais de escavação ao [guarda-rios-comum](/especie/alcedo_atthis/),
      à andorinha-das-barreiras e a insetos raros. De meados de agosto a meados de setembro um tapete
      arroxeado de urze cobre a reserva de Forsthaus Prösa.
    visit: >-
      A bicicleta constitui o meio de deslocação ideal. A ecopista Schwarze Elster Radweg encontra-se
      asfaltada, sem relevo acentuado e vedada a automóveis. A equipa do parque recomenda o circuito desde Bad
      Liebenwerda até Neumühl passando por Wahrenbrück.


      Para conhecer o património do rio, o centro de visitantes erlebnisREICH Naturpark no castelo de Doberlug
      representa a porta de entrada setentrional da área protegida. O programa inclui percursos orientados por
      vigilantes da natureza (RangerTouren) e iniciativas didáticas, além de ações de voluntariado ambiental.
      No inverno a Naturwacht apoia na leitura de pegadas na neve.


      No plano hidrográfico, onze meandros históricos da Pequena Elster foram reatados ao fluxo principal,
      favorecendo peixes autóctones raros como o bodião-amargo e a caboz-da-lama. A libélula gaiteiro-azul
      cintila ao sol nas margens soalheiras.
    history: >-
      O setor médio do Elster Negro integra a rede comunitária de sítios de importância comunitária, incluindo
      tributários como o Rieke, o Pulsnitz e a Pequena e Grande Röder. O plano de gestão setorial estabeleceu
      entre 2009 e 2013 as diretrizes de salvaguarda dos biótopos ripícolas. A partir de 2012 o parque natural
      tem vindo a promover a reintrodução do [tetraz-grande](/especie/tetrao_urogallus/), outrora extinto nos
      pinhais regionais.
    before: >-
      Informa-te junto da sede do parque natural sobre avisos de circulação e o horário do centro de
      visitantes antes da visita.
    around: >-
      A [Biosphärenreservat Mittelelbe](/lugar/biospharenreservat-mittelelbe/) dista cerca de vinte e três
      quilómetros. Mais longe, a [Llanura aluvial del Alto Rin](/lugar/upper-rhine-floodplain-rheinauen/) e o
      [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) partilham a presença de milhafres-reais
      e castores.
