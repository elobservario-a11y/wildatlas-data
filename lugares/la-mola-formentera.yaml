resumen:
  es: >-
    Meseta caliza independiente elevada a 200 m sobre el mar con vertiginosos acantilados desérticos en el
    extremo oriental de Formentera.
  en: >-
    Independent limestone plateau elevated 200 m above the sea with precipitous desert-like cliffs at the
    eastern tip of Formentera.
  fr: >-
    Plateau calcaire isolé dominant la mer de 200 m, flanqué de vertigineuses falaises désertiques à
    l'extrémité orientale de Formentera.
  de: >-
    Eigenständiges Kalksteinplateau, das sich 200 m über das Meer erhebt, mit schwindelerregenden wüstenhaften
    Klippen am Ostende von Formentera.
  it: >-
    Altopiano calcareo isolato elevato a 200 m sul mare con vertiginose falesie semidesertiche all'estremità
    orientale di Formentera.
  pt: >-
    Planalto calcário isolado erguido a 200 m sobre o mar com vertiginosas arribas desérticas no extremo
    oriental de Formentera.
unico:
  es: >-
    Una meseta de campos y muros de piedra seca termina en acantilados donde cría la pardela balear, endémica
    de las Baleares.
  en: >-
    A plateau of rustic fields and dry stone walls drops away into maritime cliffs where the Balearic
    shearwater, endemic to the Balearics, breeds.
  fr: >-
    Un plateau de parcelles et de murets de pierre sèche s'achève sur des falaises où se reproduit le puffin
    des Baléares, endémique de l'archipel.
  de: >-
    Ein Plateau aus Feldern und Trockensteinmauern bricht in Steilklippen ab, an denen der auf den Balearen
    endemische Balearensturmtaucher brütet.
  it: >-
    Un altopiano di campi e muretti a secco culmina in falesie a picco dove nidifica la berta delle Baleari,
    endemica dell'arcipelago.
  pt: >-
    Um planalto de campos e muros de pedra seca termina em arribas abruptas onde nidifica a pardela-balear,
    endémica das Baleares.
observaciones:
  es: >-
    Salvo el dominio público, el suelo de La Mola es de titularidad privada, así que sigue los caminos
    señalizados. El mar abierto está con frecuencia en mal estado y puede impedir el acceso de las
    embarcaciones de recreo a este sector de la costa.
texto:
  es:
    intro: >-
      En el extremo oriental de Formentera el suelo se levanta. La Mola es un altiplano de 17,5 km² rodeado de
      acantilados de más de 100 metros sobre el mar, con campos separados por muros de piedra seca en la
      meseta. Sus habitantes se llaman moleros; en los acantilados crían pardelas y las aguas del litoral son
      frecuentadas por delfines mulares.
    landscape: >-
      Todo se explica por la roca. La Mola es una plataforma tabular de calizas del Terciario, elevadas en el
      Mioceno superior, y allí donde la plataforma se acaba, la caída es casi vertical. Esos acantilados
      rodean la meseta entera. La altura la separa del mar y también del resto de Formentera: Sa Talaiassa,
      con 195 metros, es el punto más alto de toda la isla.


      Arriba, el paisaje conserva la huella de la agricultura: muros de piedra seca que separan los cultivos y
      los protegen del viento y del ganado. En una isla sin ríos ni fuentes de agua dulce, la lluvia se
      guardaba en aljibes con bóveda de cañón; muchos son del siglo XVIII.


      Bajo el agua, otra capa. Los fondos son de roca y grava, con algunas manchas de arena y hasta cincuenta
      metros de profundidad, y están cubiertos por extensas praderas de posidonia.


      En la costa hay también cuevas, en su mayoría naturales. Y en la zona de s'Estufador el bosque
      mediterráneo se abre a un paisaje de color tostado, con rocas de formas caprichosas de marés, una
      calcárea muy erosionable que se usó para construir la isla.
    wildlife: >-
      El protagonista está en los acantilados. La pardela balear cría aquí, y con ella la [pardela
      cenicienta](/especie/calonectris_diomedea/), el [cormorán moñudo](/especie/phalacrocorax_aristotelis/)
      mediterráneo y la [gaviota de Audouin](/especie/larus_audouinii/). Todas las aves marinas que anidan en
      estas paredes usan las aguas de abajo.


      El mar tiene su propia vida. Las praderas de [posidonia](/especie/posidonia_oceanica/) son aguas muy
      frecuentadas por el [delfín mular](/especie/tursiops_truncatus/), y la zona es adecuada para la
      invernada de tortugas bobas juveniles, la [tortuga boba](/especie/caretta_caretta/). Durante la
      migración, y sobre todo en invierno, es abundante el charrán patinegro. Con el invierno llegan además la
      gaviota sombría, la gaviota reidora y el [alca común](/especie/alca_torda/).


      Hubo un tiempo en que los moleros cazaban pardelas descolgándose por estas mismas paredes. Hoy la
      especie está protegida.
    visit: >-
      La puerta de entrada es El Pilar de la Mola, el pueblo en medio de la meseta. Desde su plaza salen los
      paseos a pie, todos señalizados como rutas verdes de Formentera.


      El más directo va al faro: 2,8 km, 35 minutos a pie y fácil, por caminos entre campos sin pisar la
      carretera. El faro, de 1861, está en el extremo este de la isla, al borde del acantilado, y junto a él
      hay un monolito que recuerda que Julio Verne situó allí la acción de su novela Héctor Servadac.


      Para recorrer la meseta entera, el Pla de la Mola es un circuito fácil de 12,3 km, unos 185 minutos a
      pie o 60 en bicicleta. Es la más larga de las 32 rutas verdes de Formentera y alterna cultivos, viñedos
      y bosque con accesos al mar.


      Los que busquen más campo tienen otras dos. La que va a Es Monestir mide 2,7 km y 45 minutos, de
      dificultad media, y pasa junto a aljibes típicos. La ruta de El Pilar por s'Estufador hasta Es Ram es
      más dura: 4,2 km, 85 minutos a pie y difícil, con un bosque de desnivel importante, torrentes y, al
      final, un camino estrecho paralelo al mar. Y una más: la de Punta Roja, de 3,4 km y 45 minutos, pasa por
      el Molí Vell, de 1778, que conserva su maquinaria completa y se visita en verano.


      La subida clásica es el Camí de sa Pujada, desde Es Caló. Son cuatro kilómetros, unos 80 minutos a pie y
      dificultad alta, por el camino histórico que se usaba antes de la carretera y que algunos llaman camí
      romà por su empedrado.
    history: >-
      El nombre de Es Monestir viene de un antiguo monasterio de frailes ermitaños de San Agustín. En Es Caló,
      el pequeño puerto al pie del camino, los varaderos de madera donde se guardan las barcas fueron
      declarados lugar de interés cultural en 2002.


      La zona protegida de La Mola dentro de la red europea Natura ocupa 2.189,81 hectáreas, y su parte
      terrestre es Área natural de especial interés. La protección reúne el medio terrestre y el litoral,
      incluidas las praderas de posidonia y las zonas de cría de aves marinas.
    before: >-
      Salvo el dominio público, el suelo de La Mola es de titularidad privada, así que sigue los caminos
      señalizados. El mar abierto está con frecuencia en mal estado y puede impedir el acceso de las
      embarcaciones de recreo a este sector de la costa.
    around: >-
      En el otro extremo de la isla está el [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).


      Lejos de aquí hay lugares que comparten con La Mola sus aves marinas y sus praderas de posidonia: el
      [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/) tiene en común la pardela cenicienta,
      la posidonia y el delfín mular, igual que el [Park prirode Lastovsko
      otočje](/lugar/park-prirode-lastovsko-otocje/).
  en:
    intro: >-
      At the eastern tip of Formentera the land rears up. La Mola is a high plateau of 17.5 km² encircled by
      sheer cliffs dropping more than 100 metres into the sea, its interior partitioned into fields by
      traditional dry stone walls. Its inhabitants are known as moleros; shearwaters breed along the cliffs
      and coastal waters are frequented by bottlenose dolphins.
    landscape: >-
      Everything is explained by the bedrock. La Mola is a tabular platform of Tertiary limestones, uplifted
      during the late Miocene, and wherever the platform terminates, the drop is almost sheer vertical. These
      ramparts encircle the entire plateau. Altitude isolates it from the sea and from the remainder of
      Formentera: Sa Talaiassa, at 195 metres, forms the highest point on the island.


      Up top, the landscape bears the enduring stamp of traditional farming: dry stone walls partitioning
      cultivated plots and sheltering them from salt winds and livestock. On an island devoid of rivers or
      fresh springs, rainfall was collected in barrel-vaulted stone cisterns; many date back to the eighteenth
      century.


      Beneath the waves lies another realm. The seabed consists of bedrock and gravel, interspersed with sand
      patches and descending to fifty metres in depth, mantled by extensive meadows of posidonia oceanica.


      Caves puncture the coastline, mostly natural hollows. In the s'Estufador area the Mediterranean woodland
      gives way to a sunbaked landscape of warmly toned marés sandstone, a soft calcarenite historically
      quarried to build the island.
    wildlife: >-
      The true protagonist occupies the cliffs. The critically endangered Balearic shearwater nests here,
      joined by [Scopoli's shearwater](/especie/calonectris_diomedea/), the Mediterranean [European
      shag](/especie/phalacrocorax_aristotelis/) and [Audouin's gull](/especie/larus_audouinii/). All seabirds
      breeding upon these precipices depend directly on the surrounding waters.


      The marine realm thrives with life. The [posidonia](/especie/posidonia_oceanica/) meadows are frequented
      by the [Common bottlenose dolphin](/especie/tursiops_truncatus/), and the coastal waters serve as
      wintering grounds for juvenile [Loggerhead sea turtle](/especie/caretta_caretta/)s. During migration,
      and particularly in winter, sandwich terns are abundant. Winter also brings lesser black-backed gulls,
      black-headed gulls and the [Razorbill](/especie/alca_torda/).


      There was once a time when the moleros harvested shearwaters by lowering themselves down these very
      cliffs on ropes. Today the bird is strictly protected.
    visit: >-
      The natural gateway is El Pilar de la Mola, the village nestled in the heart of the plateau. Walking
      trails radiate from its village square, all signposted as Formentera green routes.


      The most direct route leads to the lighthouse: 2.8 km, 35 minutes on foot and easy, meandering along
      lanes between stone-walled fields without setting foot on the paved road. The lighthouse, dating from
      1861, perches on the easternmost bluff of the island at the cliff edge, beside a stone monolith
      commemorating Jules Verne's setting of his novel Hector Servadac here.


      To explore the entire plateau, the Pla de la Mola circuit offers a gentle 12.3 km loop, requiring about
      185 minutes on foot or 60 by bicycle. It is the longest of Formentera's 32 green routes, alternating
      farm fields, vineyards and woods with cliff-edge vistas.


      Those seeking deeper rural solitude have two further choices. The trail to Es Monestir spans 2.7 km and
      45 minutes, of moderate difficulty, passing authentic vaulted cisterns. The route from El Pilar via
      s'Estufador down to Es Ram is considerably more demanding: 4.2 km, 85 minutes on foot and rated
      difficult, descending through steep pine woodland, torrent beds and ending along a narrow path clinging
      above the sea. Additionally, the Punta Roja trail, 3.4 km and 45 minutes, visits the Molí Vell, dating
      from 1778, which preserves its full milling machinery and welcomes visitors in summer.


      The definitive historical ascent is the Camí de sa Pujada, climbing from Es Caló. It measures four
      kilometres, taking roughly 80 minutes on foot with high difficulty, following the historic cobbled track
      used for centuries before the modern highway was engineered, often affectionately called the Roman road.
    history: >-
      The toponym Es Monestir originates from a historic monastery of Augustinian hermit friars. At Es Caló,
      the snug fishing inlet at the base of the path, the rustic wooden slipways where traditional fishing
      boats are cradled were declared a Cultural Heritage Site in 2002.


      The protected territory of La Mola within the European Natura network encompasses 2,189.81 hectares, its
      terrestrial portion designated as a Natural Area of Special Interest. Conservation measures embrace both
      the terrestrial plateau and marine waters, safeguarding fragile posidonia beds and seabird nesting
      cliffs.
    before: >-
      Excluding public rights of way, the land across La Mola is private property, so you must keep strictly
      to signposted routes. The open sea is frequently turbulent and can hinder small boat access to this
      sector of the coast.
    around: >-
      At the opposite end of the island lies [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).


      Further across the Mediterranean, other reserves share with La Mola their seabirds and seagrass
      ecosystems: [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/) shares Scopoli's
      shearwater, posidonia and the bottlenose dolphin, as does [Park prirode Lastovsko
      otočje](/lugar/park-prirode-lastovsko-otocje/).
  fr:
    intro: >-
      À l'extrémité orientale de Formentera, la terre s'élève brusquement. La Mola est un haut plateau de 17,5
      km² ceinturé de falaises de plus de 100 mètres plongeant dans la mer, aux parcelles compartimentées par
      des murets de pierre sèche. Ses habitants sont appelés les moleros ; des puffins nichent sur les parois
      et les eaux côtières sont fréquentées par les grands dauphins.
    landscape: >-
      Tout s'explique par la géologie. La Mola est une plate-forme tabulaire de calcaires tertiaires, soulevée
      au Miocène supérieur, et là où le plateau prend fin, la chute est presque verticale. Ces falaises
      ceinturent l'intégralité du plateau. L'altitude l'isole de la mer comme du reste de Formentera : Sa
      Talaiassa, avec 195 mètres, forme le point culminant de toute l'île.


      En haut, le paysage conserve l'empreinte de l'agriculture : des murets de pierre sèche qui délimitent
      les parcelles et les protègent du vent et du bétail. Sur une île dépourvue de cours d'eau et de sources
      d'eau douce, la pluie était recueillie dans des citernes voûtées en berceau ; beaucoup remontent au
      XVIIIe siècle.


      Sous les flots se déploie une autre dimension. Les fonds rocheux et graveleux, entrecoupés de bancs de
      sable jusqu'à cinquante mètres de profondeur, sont tapissés par de vastes herbiers de posidonies.


      Sur le littoral s'ouvrent également des grottes, marines et pour la plupart naturelles. Dans le secteur
      de s'Estufador, la pinède méditerranéenne débouche sur un décor ocré de grès marés aux formes
      tourmentées, une calcarénite tendre jadis extraite pour bâtir l'île.
    wildlife: >-
      Le maître des lieux niche au creux des parois. Le puffin des Baléares s'y reproduit, côtoyé par le
      [Puffin cendré](/especie/calonectris_diomedea/), le [Cormoran
      huppé](/especie/phalacrocorax_aristotelis/) méditerranéen et le [Goéland
      d'Audouin](/especie/larus_audouinii/). Tous les oiseaux marins nichant sur ces abrupts tirent leur
      subsistance des eaux sous-jacentes.


      Le milieu marin foisonne de vie. Les herbiers de [posidonie](/especie/posidonia_oceanica/) sont des eaux
      très fréquentées par le [Grand dauphin](/especie/tursiops_truncatus/), et le secteur constitue une aire
      d'hivernage favorable aux jeunes [Tortue caouanne](/especie/caretta_caretta/)s. En période de migration,
      et surtout en hiver, la sterne caugek abonde. Avec les frimas arrivent également le goéland brun, la
      mouette rieuse et le [Petit pingouin](/especie/alca_torda/).


      Il fut un temps où les moleros chassaient les puffins en se laissant glisser le long de ces parois
      vertigineuses. Aujourd'hui, l'espèce bénéficie d'une protection intégrale.
    visit: >-
      Le point de départ naturel est El Pilar de la Mola, le village établi au centre du plateau. De sa place
      s'élancent les itinéraires pédestres, tous balisés en tant qu'itinéraires verts de Formentera.


      Le plus direct rejoint le phare : 2,8 km, 35 minutes de marche facile, sur des chemins champêtres sans
      emprunter la route goudronnée. Le phare, érigé en 1861, se dresse à l'extrémité orientale de l'île en
      bordure du gouffre, auprès d'un monolithe rappelant que Jules Verne y situa l'intrigue de son roman
      Hector Servadac.


      Pour parcourir le plateau dans son ensemble, le circuit du Pla de la Mola offre une boucle facile de
      12,3 km, soit environ 185 minutes à pied ou 60 à vélo. C'est le plus long des 32 itinéraires verts de
      Formentera, alternant parcelles cultivées, vignes et pinèdes avec des ouvertures sur la mer.


      Les amateurs de calme rural disposent de deux autres options. Celle menant à Es Monestir compte 2,7 km
      et 45 minutes, de niveau moyen, longeant des citernes traditionnelles. L'itinéraire reliant El Pilar à
      Es Ram par s'Estufador s'avère bien plus exigeant : 4,2 km, 85 minutes de marche difficile, avec une
      descente prononcée en forêt, des ravins et un sentier littoral resserré. Une boucle supplémentaire vers
      Punta Roja, de 3,4 km et 45 minutes, dessert le Molí Vell de 1778, qui a conservé son mécanisme
      d'origine et se visite en période estivale.


      L'ascension historique emblématique est le Camí de sa Pujada depuis Es Caló. Ce sont quatre kilomètres
      et environ 80 minutes d'effort soutenu sur un ancien chemin empierré antérieur à la route, souvent
      surnommé chemin romain.
    history: >-
      Le toponyme Es Monestir rappelle l'existence d'un ancien monastère d'ermites augustins. À Es Caló, le
      petit havre au pied du chemin, les cales de halage en bois où s'abritent les embarcations
      traditionnelles ont été classées bien d'intérêt culturel en 2002.


      L'espace protégé de La Mola au sein du réseau européen Natura couvre 2 189,81 hectares, et sa composante
      terrestre est classée Zone naturelle d'intérêt spécial. La protection englobe le plateau terrestre et
      les eaux côtières, intégrant les herbiers de posidonie et les falaises de nidification des oiseaux
      marins.
    before: >-
      Hormis le domaine public, les terrains de La Mola relèvent de la propriété privée ; vous devez donc
      impérativement suivre les sentiers balisés. La haute mer est souvent agitée et peut interdire l'accès
      des bateaux de plaisance à ce secteur littoral.
    around: >-
      À l'autre extrémité de l'île s'étend le [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).


      Au-delà, d'autres sanctuaires méditerranéens partagent avec La Mola leurs oiseaux marins et leurs
      herbiers marins : le [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/) réunit le puffin
      cendré, la posidonie et le grand dauphin, tout comme le [Park prirode Lastovsko
      otočje](/lugar/park-prirode-lastovsko-otocje/).
  de:
    intro: >-
      Am östlichen Ende von Formentera bäumt sich das Land auf. La Mola ist eine Hochebene von 17,5 km²,
      umgeben von über 100 Meter hohen Steilklippen über dem Meer, mit von Trockensteinmauern unterteilten
      Feldern auf der Hochfläche. Die Bewohner werden moleros genannt; an den Klippen brüten Sturmtaucher, und
      die Küstengewässer werden von Großen Tümmlern aufgesucht.
    landscape: >-
      Alles gründet auf dem Fels. La Mola ist eine Tafelplattform aus tertiären Kalksteinen, die im Obermiozän
      emporgehoben wurden; wo die Hochfläche endet, bricht sie fast senkrecht ab. Diese Klippen fassen das
      gesamte Plateau ein. Die Höhe trennt es vom Meer und vom restlichen Formentera: Sa Talaiassa ist mit 195
      Metern die höchste Erhebung der gesamten Insel.


      Auf der Hochfläche spiegelt sich jahrhundertelange Landwirtschaft: Trockensteinmauern gliedern die
      Parzellen und schützen Feldfrüchte vor Seewinden und Weidetieren. Auf einer Insel ohne Flüsse und
      Süßwasserquellen fing man das Regenwasser in tonnengewölbten Zisternen auf; viele stammen aus dem
      achtzehnten Jahrhundert.


      Unter der Wasseroberfläche schließt sich ein weiterer Naturraum an. Der felsige und kiesige Grund mit
      einzelnen Sandflächen reicht bis in fünfzig Metern Tiefe und wird von ausgedehnten Seegraswiesen aus
      Posidonia überzogen.


      Entlang der Küste finden sich überwiegend natürliche Brandungshöhlen. Bei s'Estufador weicht der
      Kiefernwald einer ockerfarbenen Kulisse bizarrer Felsgebilde aus Marés, einem weichen Kalksandstein, der
      früher zum Bauen auf der Insel gebrochen wurde.
    wildlife: >-
      Die herausragende Art bewohnt die Steilwände. Der Balearensturmtaucher brütet hier, vergesellschaftet
      mit dem [Gelbschnabel-Sturmtaucher](/especie/calonectris_diomedea/), der
      Mittelmeer-[Krähenscharbe](/especie/phalacrocorax_aristotelis/) und der
      [Korallenmöwe](/especie/larus_audouinii/). Alle Meeresvögel, die in diesen Wänden nisten, nutzen die
      vorgelagerten Meeresgründe zur Nahrungssuche.


      Das Meer birgt reichhaltiges Leben. Die Wiesen der [Posidonia](/especie/posidonia_oceanica/) sind
      bevorzugte Jagdgründe des [Großen Tümmler](/especie/tursiops_truncatus/)s, und das Areal bietet
      heranwachsenden Exemplaren der [Unechte Karettschildkröte](/especie/caretta_caretta/) günstige
      Überwinterungshabitate. Auf dem Vogelzug und im Winter rastet die Brandseeschwalbe in großer Zahl. Im
      Winter gesellen sich zudem Heringsmöwe, Lachmöwe und der [Tordalk](/especie/alca_torda/) hinzu.


      In früheren Zeiten seilten sich die moleros an eben diesen Klippen ab, um Sturmtaucher zu jagen. Heute
      steht die Art unter strengem Schutz.
    visit: >-
      Das Eingangstor bildet El Pilar de la Mola, das Dorf im Zentrum des Plateaus. Vom Kirchplatz gehen
      mehrere markierte Routen des Netzes der Grünen Wege Formenteras aus.


      Der direkteste Weg führt zum Leuchtturm: 2,8 km, 35 Minuten Gehzeit und einfach, über Feldwege ohne die
      Autostraße zu betreten. Der Leuchtturm aus dem Jahr 1861 steht am äußersten Ostrand der Insel hart an
      der Klippenkante; nebenan erinnert ein Gedenkstein daran, dass Jules Verne hier die Handlung seines
      Romans Hector Servadac ansiedelte.


      Um die gesamte Hochebene zu erkunden, bietet die Runde Pla de la Mola einen einfachen Rundweg von 12,3
      km, für den du etwa 185 Minuten zu Fuß oder 60 mit dem Fahrrad benötigst. Es ist der längste der 32
      Grünen Wege Formenteras und wechselt zwischen Feldern, Weinbergen, Pinienwäldern und Klippenblicken.


      Wer mehr Ruhe sucht, wählt zwei Alternativen. Der Weg nach Es Monestir misst 2,7 km und erfordert 45
      Minuten bei mittlerer Schwierigkeit, vorbei an alten Gewölbezisternen. Der Weg von El Pilar über
      s'Estufador nach Es Ram ist anspruchsvoller: 4,2 km, 85 Minuten Gehzeit und schwierig, mit steilem
      Waldabstieg, Bachbetten und einem schmalen Pfad knapp über dem Meer. Eine weitere Route zur Punta Roja,
      3,4 km und 45 Minuten lang, passiert die Mühle Molí Vell von 1778 mit vollständig erhaltener Mechanik,
      die im Sommer besichtigt werden kann.


      Der klassische Aufstieg ist der Camí de sa Pujada ab Es Caló. Vier Kilometer, rund 80 Minuten Gehzeit
      und hoher Anspruch über den historischen Pflasterweg, der vor dem Bau der Fahrstraße genutzt wurde und
      wegen seiner soliden Steinsetzung oft Römerweg genannt wird.
    history: >-
      Der Ortsname Es Monestir erinnert an ein einstiges Kloster von Augustiner-Einsiedlermönchen. In Es Caló,
      dem kleinen Naturhafen am Fuß des Höhenwegs, wurden die hölzernen Bootsschuppen im Jahr 2002 zum
      Kulturgut erklärt.


      Das Schutzgebiet La Mola im europäischen Netz Natura umfasst 2.189,81 Hektar, und sein terrestrischer
      Teil ist als Naturgebiet von besonderem Wert ausgewiesen. Der Schutz vereint Festland und Meeresküste
      einschließlich der Seegraswiesen und Vogelbrutfelsen.
    before: >-
      Abgesehen von öffentlichen Wegen befindet sich das Land auf La Mola in Privatbesitz; folge daher strikt
      den ausgeschilderten Wegen. Auf offenem Meer herrscht häufig starker Wellengang, der Sportbooten die
      Zufahrt zu diesem Küstenabschnitt verwehren kann.
    around: >-
      Am anderen Ende der Insel liegt der [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).


      Weiter entfernt im Mittelmeer teilen andere Schutzgebiete mit La Mola ihre Meeresvögel und
      Seegrasbestände: Der [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/) beherbergt
      Gelbschnabel-Sturmtaucher, Posidonia und Großen Tümmler, ebenso wie der [Park prirode Lastovsko
      otočje](/lugar/park-prirode-lastovsko-otocje/).
  it:
    intro: >-
      All'estremità orientale di Formentera la terra si innalza bruscamente. La Mola è un altopiano di 17,5
      km² cinto da falesie alte oltre 100 metri a picco sul mare, con campi divisi da muretti a secco
      sull'altopiano. I suoi abitanti sono chiamati moleros; sulle pareti nidificano le berte e le acque
      costiere sono frequentate da tursiopi.
    landscape: >-
      Tutto trova spiegazione nella roccia. La Mola è una piattaforma tabulare di calcari del Terziario
      sollevatasi nel Miocene superiore; dove la piattaforma si arresta, la parete precipita quasi a picco.
      Queste falesie contornano l'intero altopiano. La quota la separa dal mare e dal resto dell'isola: Sa
      Talaiassa, con i suoi 195 metri, rappresenta il punto più alto di Formentera.


      Sull'altopiano il paesaggio serba l'impronta delle attività agricole: muretti a secco che delimitano le
      colture proteggendole dal vento salmastro e dal bestiame. In un'isola priva di fiumi e sorgenti dolci,
      la pioggia veniva raccolta in cisterne a botte; molte risalgono al XVIII secolo.


      Sott'acqua si schiude un altro mondo. I fondali di roccia e ghiaia, con chiazze sabbiose e profondità
      fino a cinquanta metri, sono colonizzati da rigogliose praterie di posidonia.


      Lungo la costa si aprono numerose grotte, in massima parte naturali. Nella zona di s'Estufador la
      macchia mediterranea cede il passo a un paesaggio color ocra modellato nel marés, una roccia
      calcarenitica tenera impiegata storicamente per le costruzioni dell'isola.
    wildlife: >-
      Il vero protagonista vive aggrappato alle falesie. Qui nidifica la rarissima berta delle Baleari,
      insieme alla [Berta maggiore mediterranea](/especie/calonectris_diomedea/), al [Marangone dal
      ciuffo](/especie/phalacrocorax_aristotelis/) e al [gabbiano corso](/especie/larus_audouinii/). Tutti gli
      uccelli marini che popolano queste pareti traggono nutrimento dallo specchio d'acqua sottostante.


      Il mare è pervaso di vita. Le praterie di [posidonia](/especie/posidonia_oceanica/) sono intensamente
      frequentate dal [Tursìope](/especie/tursiops_truncatus/), e l'area si presta allo svernamento di giovani
      esemplari di [tartaruga marina caretta](/especie/caretta_caretta/). Durante i passi migratori e
      soprattutto in inverno abbonda il beccapesci. Nei mesi freddi compaiono inoltre lo zafferano, il
      gabbiano comune e la [Gazza marina](/especie/alca_torda/).


      In passato gli abitanti locali calavano con funi lungo queste pareti a strapiombo per catturare le
      berte. Oggi la specie è protetta da rigorose norme di tutela.
    visit: >-
      Il punto d'accesso principale è El Pilar de la Mola, il borgo situato nel cuore dell'altopiano. Dalla
      piazza si dipartono gli itinerari a piedi, tutti segnalati nell'ambito dei percorsi verdi di Formentera.


      Il più diretto conduce al faro: 2,8 km, 35 minuti di cammino facile lungo stradelle interpoderali senza
      calcare l'asfalto. Il faro, costruito nel 1861, si erge all'estremità orientale dell'isola sull'orlo del
      precipizio, accanto a un cippo che ricorda come Jules Verne vi ambientò il suo romanzo Ettore Servadac.


      Per percorrere l'intero altopiano, il Pla de la Mola propone un anello pianeggiante di 12,3 km,
      percorribile in circa 185 minuti a piedi o 60 in bicicletta. È il più lungo dei 32 percorsi verdi di
      Formentera e alterna campi coltivati, vigne e boschi con scorci spettacolari sul mare.


      Chi predilige itinerari più appartati ha a disposizione altre due opzioni. Quella per Es Monestir misura
      2,7 km e richiede 45 minuti con difficoltà media, sfiorando antiche cisterne. L'itinerario da El Pilar a
      Es Ram passando per s'Estufador è nettamente più severo: 4,2 km, 85 minuti di cammino impegnativo
      attraverso una pineta scoscesa, torrenti in secca e un sentiero a filo d'acqua. Un ulteriore tracciato
      verso Punta Roja, di 3,4 km e 45 minuti, tocca il Molí Vell del 1778, mulino con ingranaggi originali
      intatti visitabile in estate.


      La salita storica classica è il Camí de sa Pujada da Es Caló. Sono quattro chilometri per circa 80
      minuti di cammino impegnativo lungo la mulattiera lastricata usata prima dell'apertura della strada
      provinciale, spesso denominata cammino romano.
    history: >-
      Il toponimo Es Monestir rimanda a un antico insediamento di frati eremiti agostiniani. A Es Caló, il
      piccolo approdo alla base del percorso, i caratteristici scali di alaggio in legno per le barche da
      pesca sono stati dichiarati bene di interesse culturale nel 2002.


      L'area protetta di La Mola all'interno della rete europea Natura si estende per 2.189,81 ettari, e la
      sua porzione terrestre è qualificata come Area naturale di speciale interesse. La tutela integra
      ambiente terrestre e marino, includendo le praterie di posidonia e le falesie di nidificazione
      dell'avifauna marina.
    before: >-
      Fatta eccezione per il demanio pubblico, i terreni di La Mola sono di proprietà privata; ti
      raccomandiamo quindi di non abbandonare i sentieri segnati. Il mare aperto è frequentemente agitato e
      può impedire l'accosto dei natanti da diporto a questo settore costiero.
    around: >-
      All'estremità opposta dell'isola si estende il [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).


      Più lontano, altri contesti mediterranei condividono con La Mola uccelli marini e fondali a posidonia:
      il [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/) ha in comune berta maggiore,
      posidonia e tursiope, analogamente al [Park prirode Lastovsko
      otočje](/lugar/park-prirode-lastovsko-otocje/).
  pt:
    intro: >-
      No extremo oriental de Formentera a terra eleva-se. La Mola é um planalto de 17,5 km² rodeado por
      arribas de mais de 100 metros sobre o mar, com campos separados por muros de pedra seca no planalto. Os
      seus habitantes chamam-se moleros; nas arribas nidificam pardelas e as águas costeiras são frequentadas
      por golfinhos-roazes.
    landscape: >-
      Tudo assenta na natureza da rocha. La Mola é uma plataforma tabular de calcários do Terciário, soerguida
      no Miocénico superior; onde a plataforma se esgota, a escarpa tomba quase na vertical. Essas arribas
      contornam integralmente o planalto. A altitude isola-o do mar e do resto de Formentera: Sa Talaiassa,
      com 195 metros, é a cota mais elevada de toda a ilha.


      No planalto, a paisagem preserva a marca da agricultura secular: muros de pedra seca que dividem os
      campos e os resguardam do vento e do gado. Numa ilha desprovida de rios ou nascentes de água doce, a
      água da chuva era retida em cisternas com abóbada de berço; muitas datam do século XVIII.


      Sob a superfície marinha desdobra-se outro universo. Os fundos rochosos e de cascalho, entremeados com
      manchas de areia até cinquenta metros de profundidade, surgem atapetados por extensos prados de
      posidónia.


      Na linha de costa abrem-se também grutas, na sua maioria naturais. No setor de s'Estufador, a floresta
      mediterrânica abre-se para uma paisagem ocre com formações rochosas esculpidas em marés, uma rocha
      calcarenítica branda tradicionalmente explorada para erguer as casas da ilha.
    wildlife: >-
      O verdadeiro protagonista habita as escarpas. A pardela-balear nidifica aqui, acompanhada pela
      [Cagarra](/especie/calonectris_diomedea/), pelo
      [Corvo-marinho-de-crista](/especie/phalacrocorax_aristotelis/) mediterrânico e pela
      [gaivota-de-audouin](/especie/larus_audouinii/). Todas as aves marinhas que nidificam nestas paredes
      dependem intimamente das águas circundantes.


      O ecossistema marinho pulsa com vitalidade. Os prados de [posidónia](/especie/posidonia_oceanica/) são
      águas assiduamente frequentadas pelo [Golfinho-comum](/especie/tursiops_truncatus/), e a enseada acolhe
      no inverno exemplares juvenis da [Tartaruga-comum](/especie/caretta_caretta/). Durante a migração, e em
      particular no inverno, abunda o garajau-calhandro. Com o inverno chegam igualmente a
      gaivota-d'asa-escura, o guincho-comum e a [Torda-mergulheira](/especie/alca_torda/).


      Houve tempos em que os habitantes de La Mola caçavam pardelas descendo em cordas por estas mesmas
      escarpas. Hoje a espécie beneficia de proteção estrita.
    visit: >-
      A porta de entrada é El Pilar de la Mola, a povoação situada no centro do planalto. Da sua praça partem
      os percursos pedestres, devidamente assinalados na rede de rotas verdes de Formentera.


      O trilho mais direto ruma ao farol: 2,8 km, 35 minutos a pé e traçado fácil, por caminhos rurais entre
      campos sem pisar o asfalto. O farol, datado de 1861, ergue-se no extremo leste da ilha à beira do
      abismo, junto a um monólito que evoca Júlio Verne, que aqui situou a ação do seu romance Heitor
      Servadac.


      Para percorrer o planalto na totalidade, o Pla de la Mola propõe um circuito acessível de 12,3 km,
      exigindo cerca de 185 minutos a pé ou 60 de bicicleta. É a mais extensa das 32 rotas verdes de
      Formentera e intercala searas, vinhedos e pinhais com panorâmicas sobre o mar.


      Quem procura recantos mais tranquilos tem duas outras alternativas. A que ruma a Es Monestir tem 2,7 km
      e 45 minutos, de dificuldade média, contornando cisternas tradicionais. O percurso de El Pilar por
      s'Estufador até Es Ram é bem mais severo: 4,2 km, 85 minutos de caminhada difícil, com acentuado
      desnível em floresta, torrentes secas e um carreiro estreito rente ao mar. Adicionalmente, a rota da
      Punta Roja, de 3,4 km e 45 minutos, visita o moinho Molí Vell de 1778, com todo o mecanismo original
      preservado, visitável no verão.


      A subida histórica por excelência é o Camí de sa Pujada a partir de Es Caló. São quatro quilómetros e
      cerca de 80 minutos de esforço acentuado pelo caminho empedrado secular utilizado antes da estrada
      alcatroada, muitas vezes designado caminho romano.
    history: >-
      O topónimo Es Monestir provém de um antigo cenóbio de frades eremitas de Santo Agostinho. Em Es Caló, o
      pequeno porto piscatório no sopé da subida, os varadouros rústicos de madeira para barcos de pesca foram
      classificados como bem de interesse cultural em 2002.


      A área protegida de La Mola na rede europeia Natura abrange 2.189,81 hectares, e a sua fração terrestre
      está classificada como Área Natural de Especial Interesse. O regime de proteção harmoniza o domínio
      terrestre e a faixa costeira, incluindo os prados de posidónia e as arribas de reprodução das aves
      marinhas.
    before: >-
      Excetuando o domínio público marítimo-terrestre, o solo de La Mola é propriedade privada, pelo que deves
      manter-te estritamente nos trilhos assinalados. O mar aberto é frequentemente agitado, podendo
      inviabilizar a aproximação de embarcações de recreio a este setor da costa.
    around: >-
      No extremo oposto da ilha situa-se o [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).


      Noutros pontos do Mediterrâneo existem áreas que partilham com La Mola a sua avifauna marinha e os
      prados de posidónia: o [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/) partilha a
      cagarra, a posidónia e o golfinho-roaz, à semelhança do [Park prirode Lastovsko
      otočje](/lugar/park-prirode-lastovsko-otocje/).
