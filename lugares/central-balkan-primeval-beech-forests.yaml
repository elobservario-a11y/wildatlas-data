observaciones:
  es: >-
    Las mejores fechas son de junio a octubre. Respeta a la fauna: el parque recuerda a los visitantes que los
    animales tienen derecho a vivir con tranquilidad y que el ocio debe respetar la naturaleza. Recoger setas
    exige un permiso de la dirección del parque.
texto:
  es:
    intro: >-
      Lo que ves aquí no lo plantó nadie. El 97 % de los bosques del Parque Nacional Central Balkan es de
      origen natural, y el 99 % nace de semilla, no de plantación. Se extiende por la parte central y alta de
      los Balcanes búlgaros: 716,69 km² a lo largo de 85 km de oeste a este, con apenas unos 10 km de ancho
      medio. En su interior, nueve reservas estrictas guardan los hayedos antiguos que desde 2017 forman parte
      del Patrimonio Mundial.
    landscape: >-
      La altitud lo cuenta casi todo: de 550 m cerca de Karlovo a 2 376 m en el pico Botev, la cima más alta
      de la cordillera. Entre un extremo y otro caben praderas alpinas, paredes verticales, precipicios,
      cañones profundos y cascadas, y unas 20 cumbres pasan de los 2 000 m. Entre las cascadas hay algunas de
      las más altas de Bulgaria: Raiskoto cae 124,5 m, Vidimskoto 80 m y Kademliyskoto 72 m.


      Bajo tierra, la roca también se abre. En la reserva Steneto está la Raichova dupka, la segunda cueva
      vertical más profunda de Bulgaria, con 377 m, y entre los fenómenos rocosos declarados figuran Skalen
      most, Markova dupka y Kalchovi kamani.


      El clima aquí no perdona. En las zonas altas la nieve se mantiene más de seis meses, con más de 2 m de
      espesor, y las nieblas son densas. De esa nieve y de esas nieblas nace el agua: del parque brotan los
      ríos Vit, Osam y Rositsa, que van al Danubio.


      El bosque se ordena por pisos. El hayedo manda entre 900 y 1 600 m, con una edad media de 135 años, y
      supone más del 7 % de los hayedos de Bulgaria. Mezclado con picea, abeto, carpe y roble, cubre la mayor
      parte del parque. En la reserva Boatin, que se extiende entre 800 y 1 750 m en 1 590,3 hectáreas,
      abundan las hayas de hasta 200 años y más de 50 m de altura. La edad media de los bosques del parque es
      de 111 años y la de los de frondosas, 121.
    wildlife: >-
      El parque cuenta 59 especies de mamíferos, 224 de aves, 14 de reptiles, 8 de anfibios y 6 de peces.
      Entre los carnívoros hay 12 especies: [lobo](/especie/canis_lupus/), chacal, zorro, [oso
      pardo](/especie/ursus_arctos/), [nutria](/especie/lutra_lutra/), tejón y [gato
      montés](/especie/felis_silvestris/). Del gato montés se dice que aquí vive su población más pura, no
      solo de Bulgaria sino de toda la península balcánica. Y del oso pardo, que es la mayor población de un
      territorio protegido de Europa. Ciervos, corzos y las cabras salvajes del Libro Rojo búlgaro se reparten
      por casi todo el parque, y su número es estable.


      Para las aves, mira hacia arriba. En las alturas crían el acentor alpino y el treparriscos; el [águila
      real](/especie/aquila_chrysaetos/) tiene aquí una población que supone cerca del 5 % de las que crían en
      Bulgaria, y entre las rapaces también destaca el águila imperial. Son 224 especies de aves en total, 123
      de ellas en época de cría.


      En el agua, la trucha balcánica, amenazada en Europa, mantiene una población de importancia nacional. En
      las zonas altas son comunes la víbora y el lagarto vivíparo. Y en la flora, más de la mitad de la flora
      autóctona de Bulgaria está en el parque, con 10 especies endémicas, entre ellas plantas protegidas como
      el edelweiss.
    visit: >-
      El senderismo es la actividad mejor desarrollada: hay más de 470 km de rutas y senderos. La ruta
      internacional E3 Kom–Emine atraviesa el parque por la cresta de Stara Planina, y otra de las rutas
      señaladas une la casa Cordella con Danchova Polyana atravesando la reserva Boatin. Hay también rutas a
      caballo y en bicicleta, otras para observar flora y fauna concretas y otras para ver monumentos
      históricos y culturales.


      Para entender lo que ves, el parque ofrece ecorrutas, recorridos interpretativos y educativos, el
      complejo interpretativo The Forest y el centro de información Vezhen. Las reservas, la categoría más
      estricta, cuentan con caminos marcados para el paso de visitantes, incluso con fines educativos.
    history: >-
      El parque se estableció el 31 de octubre de 1991. Cuatro de sus reservas forman parte de la Red Mundial
      de Reservas de la Biosfera de la UNESCO, y desde 2017 los bosques antiguos de haya de las nueve reservas
      están en el Patrimonio Mundial de los hayedos primarios. La dirección del parque implica a
      organizaciones locales, voluntarios y aficionados a la montaña en sus objetivos.


      El territorio se divide en cinco zonas. La de reservas, con las nueve reservas (Boatin, Tsarichina,
      Kozya Stena, Steneto, Stara Reka, Dzhendema, Severen Dzhendem, Peeshti Skali y Sokolna), tiene el mayor
      nivel de protección.
    before: >-
      Las mejores fechas son de junio a octubre. Respeta a la fauna: el parque recuerda a los visitantes que
      los animales tienen derecho a vivir con tranquilidad y que el ocio debe respetar la naturaleza. Recoger
      setas exige un permiso de la dirección del parque.
  en:
    intro: >-
      What you see here was planted by no human hand. Fully 97% of the forests of Central Balkan National Park
      are of natural origin, and 99% regenerated spontaneously from seed rather than plantation. The park
      drapes across the high central spine of Bulgaria's Balkan Mountains: 716.69 km² along an 85 km west-east
      ridge, with an average width of barely 10 km. Within its heart, nine strict nature reserves safeguard
      ancient beech forests inscribed on the UNESCO World Heritage list since 2017.
    landscape: >-
      Altitude dictates almost everything: from 550 m near Karlovo up to 2,376 m at Botev Peak, the highest
      summit in the Balkan range. Between these extremes lie alpine meadows, sheer precipices, vertiginous
      cliffs, deep gorges, and leaping torrents, with some 20 peaks exceeding 2,000 m. Among the waterfalls
      are some of Bulgaria's tallest: Raiskoto Praskalo plunges 124.5 m, Vidimskoto 80 m, and Kademliyskoto 72
      m.


      Underground, the limestone dissolves into subterranean realms. Within the Steneto reserve lies Raichova
      Dupka, Bulgaria's second-deepest vertical pothole at 377 m, while prominent registered rock landmarks
      include Skalen Most, Markova Dupka, and Kalchovi Kamani.


      The mountain climate is severe. On high ridges snowpack lingers for over six months, accumulating beyond
      2 m in depth, and fog is notoriously thick. From that mantle of snow and mist springs vital water: the
      park feeds the Vit, Osam, and Rositsa rivers, flowing north toward the Danube.


      The forest organizes into ecological belts. European beech reigns supreme between 900 and 1,600 m, with
      an average stand age of 135 years, representing over 7% of all beech woods in Bulgaria. Blending with
      Norway spruce, silver fir, hornbeam, and sessile oak, it blankets the park. In the Boatin reserve,
      spanning 800 to 1,750 m across 1,590.3 hectares, beech trees reaching 200 years of age and over 50 m in
      height are widespread. The average age of all forests across the park is 111 years, rising to 121 years
      for deciduous stands.
    wildlife: >-
      The park shelters 59 mammal species, 224 birds, 14 reptiles, 8 amphibians, and 6 fish. Among carnivores,
      12 species occur: [grey wolf](/especie/canis_lupus/), golden jackal, red fox, [brown
      bear](/especie/ursus_arctos/), [Eurasian otter](/especie/lutra_lutra/), European badger, and
      [wildcat](/especie/felis_silvestris/). The wildcat population here is considered the genetically purest
      not just in Bulgaria, but across the entire Balkan Peninsula. The brown bear population is the largest
      within any single protected area in Europe. Red deer, roe deer, and Balkan chamois listed in the
      Bulgarian Red Data Book inhabit all sectors in stable numbers.


      For birds, scan the crags and skies. High alpine meadows support alpine accentor and wallcreeper; the
      [golden eagle](/especie/aquila_chrysaetos/) maintains a breeding population accounting for roughly 5% of
      Bulgaria's total, accompanied by eastern imperial eagles. In all, 224 bird species have been recorded,
      123 of them breeding on site.


      In the streams, the Balkan stream trout, vulnerable across Europe, thrives in nationally vital
      populations. On the high slopes, common European adders and viviparous lizards are frequent.
      Botanically, over half of Bulgaria's native flora is represented in the park, including 10 endemic
      species, alongside protected treasures like edelweiss.
    visit: >-
      Hiking is the primary way to explore: more than 470 km of trails crisscross the park. The international
      E3 long-distance trail (Kom–Emine) follows the main Stara Planina ridge through the park, while another
      classic marked trail connects the Cordella hut with Danchova Polyana through the ancient Boatin reserve.
      Horseback riding and mountain biking routes are also designated, alongside specialist circuits for
      botanists and historic monuments.


      To interpret what you encounter, the park maintains eco-trails, educational circuits, The Forest visitor
      complex, and the Vezhen information centre. Even within the strict nature reserves, designated trails
      permit transit for educational and hiking purposes.
    history: >-
      Central Balkan National Park was designated on 31 October 1991. Four of its nature reserves form part of
      the UNESCO World Network of Biosphere Reserves, and since 2017 the ancient beech stands of all nine
      reserves have been inscribed on the UNESCO World Heritage Primeval Beech Forests register. Park
      administration actively engages local communities, volunteers, and mountaineering clubs.


      The park territory is zoned into five management tiers. The reserve zone, encompassing the nine strict
      reserves (Boatin, Tsarichina, Kozya Stena, Steneto, Stara Reka, Dzhendema, Severen Dzhendem, Peeshti
      Skali, and Sokolna), enjoys the strictest legal protection.
    before: >-
      The most reliable weather occurs from June to October. Respect wildlife: park regulations emphasise that
      animals are entitled to peaceful habitat and outdoor leisure must not compromise their wellbeing.
      Mushroom foraging requires a prior permit issued by the park directorate.
  fr:
    intro: >-
      Ce que l'on admire ici n'a jamais été planté par la main de l'homme. Environ 97 % des forêts du parc
      national du Balkan central sont d'origine naturelle, et 99 % sont nées de semis spontanés sans aucun
      reboisement. Le massif s'étend sur l'arête centrale et culminante des Balkans bulgares : 716,69 km² le
      long d'une crête de 85 km d'ouest en est, pour une largeur moyenne d'à peine 10 km. En son cœur, neuf
      réserves intégrales préservent des hêtraies séculaires inscrites au patrimoine mondial de l'UNESCO
      depuis 2017.
    landscape: >-
      L'altitude dicte chaque paysage : de 550 m près de Karlovo à 2 376 m au mont Botev, point culminant de
      la chaîne. Entre ces deux bornes se succèdent alpages, falaises verticales, gouffres, canyons et
      cascades sauvages, avec environ 20 sommets franchissant les 2 000 m. Les cascades comptent parmi les
      plus hautes de Bulgarie : Raiskoto Praskalo chute de 124,5 m, Vidimskoto de 80 m et Kademliyskoto de 72
      m.


      Sous terre, le calcaire s'ouvre en gouffres vertigineux. Dans la réserve de Steneto s'enfonce la
      Raichova dupka, deuxième cavité verticale la plus profonde de Bulgarie avec 377 m, tandis que des arches
      et monolithes naturels comme Skalen most, Markova dupka et Kalchovi kamani ponctuent les crêtes.


      Le climat est rude. Sur les hauteurs, la neige persiste plus de six mois par an, dépassant 2 m
      d'épaisseur sous d'épais brouillards. De ces neiges et de ces brumes jaillit l'eau : du massif sourdent
      les rivières Vit, Osam et Rositsa, tributaires du Danube.


      La forêt s'étage rigoureusement. Le hêtre règne entre 900 et 1 600 m, avec un âge moyen de 135 ans,
      représentant plus de 7 % des hêtraies de Bulgarie. Mêlé à l'épicéa, au sapin, au charme et au chêne, il
      couvre la majorité du parc. Dans la réserve de Boatin, étagée entre 800 et 1 750 m sur 1 590,3 hectares,
      abondent les hêtres de 200 ans hauts de plus de 50 m. L'âge moyen de l'ensemble des forêts du parc est
      de 111 ans, et celui des feuillus atteint 121 ans.
    wildlife: >-
      Le parc recense 59 espèces de mammifères, 224 d'oiseaux, 14 de reptiles, 8 d'amphibiens et 6 de
      poissons. Parmi les carnivores coexistent 12 espèces : [loup gris](/especie/canis_lupus/), chacal doré,
      renard roux, [ours brun](/especie/ursus_arctos/), [loutre d'Europe](/especie/lutra_lutra/), blaireau et
      [chat sauvage](/especie/felis_silvestris/). Le chat forestier présente ici la population la plus pure
      génétiquement de toute la péninsule balkanique, tandis que l'ours brun constitue la plus forte densité
      en zone protégée d'Europe. Cerfs élaphes, chevreuils et chamois des Balkans du Livre rouge bulgare
      peuplent les versants en effectifs stables.


      Dans les airs, le regard scrute les falaises. L'accenteur alpin et le tichodrome échelette nichent en
      altitude ; l'[aigle royal](/especie/aquila_chrysaetos/) maintient ici un bastion représentant environ 5
      % des couples nicheurs de Bulgarie, côtoyant l'aigle impérial. Au total, 224 espèces d'oiseaux
      fréquentent le parc, dont 123 nicheuses.


      Dans les torrents, la truite balkanique, menacée en Europe, conserve une population d'importance
      nationale. Sur les crêtes, la vipère péliade et le lézard vivipare sont fréquents. La flore rassemble
      plus de la moitié des plantes indigènes de Bulgarie, comptant 10 espèces endémiques locales et des
      joyaux protégés comme l'edelweiss.
    visit: >-
      La randonnée est l'activité reine : plus de 470 km de sentiers sillonnent le parc. L'itinéraire
      international E3 Kom–Emine parcourt toute la crête de la Stara Planina, tandis qu'un autre chemin balisé
      relie le refuge Cordella à Danchova Polyana à travers la réserve de Boatin. Des itinéraires équestres,
      VTT et naturalistes complètent le réseau.


      Pour appréhender ces écosystèmes, le parc propose sentiers d'interprétation, le complexe pédagogique The
      Forest et le centre d'information de Vezhen. Au sein des réserves intégrales, des sentiers balisés
      canalisent strictement les randonneurs.
    history: >-
      Le parc a été créé le 31 octobre 1991. Quatre de ses réserves font partie du réseau mondial des réserves
      de biosphère de l'UNESCO, et depuis 2017 les hêtraies anciennes des neuf réserves sont classées au
      patrimoine mondial des forêts primaires de hêtres. La gestion associe riverains, bénévoles et clubs
      alpins.


      Le territoire est divisé en cinq zones. Celle des réserves intégrales regroupe les neuf réserves
      (Boatin, Tsarichina, Kozya Stena, Steneto, Stara Reka, Dzhendema, Severen Dzhendem, Peeshti Skali et
      Sokolna), bénéficiant du niveau de protection maximal.
    before: >-
      La période idéale s'étend de juin à octobre. Respectez scrupuleusement la faune : le parc rappelle que
      les animaux ont droit à la quiétude dans leur milieu de vie. La cueillette de champignons nécessite une
      autorisation préalable délivrée par la direction du parc.
  de:
    intro: >-
      Was du hier siehst, hat kein Mensch gepflanzt. Ganze 97 % der Wälder im Nationalpark Zentralbalkan sind
      natürlichen Ursprungs, und 99 % gingen aus natürlicher Aussamung hervor, gänzlich ohne Aufforstung. Der
      Park erstreckt sich über den hohen Mittelkamm des bulgarischen Balkangebirges: 716,69 km² entlang eines
      85 km langen Ost-West-Kamms bei einer durchschnittlichen Breite von kaum 10 km. In seinem Kern hüten
      neun Totalreservate uralte Buchenwälder, die seit 2017 zum UNESCO-Welterbe gehören.
    landscape: >-
      Die Höhenlage prägt das gesamte Bild: von 550 m bei Karlowo bis auf 2 376 m am Botew, dem höchsten
      Gipfel des Balkangebirges. Dazwischen liegen alpine Matten, steile Felswände, Schluchten und Kaskaden;
      rund 20 Gipfel übersteigen 2 000 m. Unter den Wasserfällen stürzen einige der höchsten Bulgariens in die
      Tiefe: Raiskoto Praskalo fällt 124,5 m, Vidimskoto 80 m und Kademliyskoto 72 m.


      Unter Tage öffnet sich der Kalkstein in gewaltige Schlunde. Im Reservat Steneto liegt die Raichova
      dupka, mit 377 m die zweittiefste Schachthöhle Bulgariens; zu den Naturdenkmälern zählen Skalen most,
      Markova dupka und Kalchovi kamani.


      Das Gebirgsklima ist rau. In den Hochlagen bleibt die Schneedecke über sechs Monate liegen und türmt
      sich über 2 m hoch auf, begleitet von dichtem Nebel. Aus diesem Schnee schöpfen die Flüsse Vit, Osam und
      Rositsa ihre Kraft, bevor sie zur Donau eilen.


      Der Wald staffelt sich in Vegetationsstufen. Zwischen 900 und 1 600 m dominiert die Rotbuche mit einem
      Durchschnittsalter von 135 Jahren; sie stellt über 7 % aller Buchenwälder Bulgariens. Gemischt mit
      Fichte, Tanne, Hainbuche und Eiche bedeckt sie den Großteil des Parks. Im Reservat Boatin auf 800 bis 1
      750 m und 1 590,3 Hektar Fläche stehen bis zu 200 Jahre alte Buchen mit über 50 m Wuchshöhe. Das
      Durchschnittsalter sämtlicher Parkwälder liegt bei 111 Jahren, jenes der Laubwälder bei 121 Jahren.
    wildlife: >-
      Der Nationalpark beherbergt 59 Säugetierarten, 224 Vögel, 14 Reptilien, 8 Amphibien und 6 Fischarten.
      Unter den Beutegreifern leben 12 Arten: [Wolf](/especie/canis_lupus/), Goldschakal, Rotfuchs,
      [Braunbär](/especie/ursus_arctos/), [Fischotter](/especie/lutra_lutra/), Dachs und
      [Wildkatze](/especie/felis_silvestris/). Die hiesige Wildkatzenpopulation gilt als die genetisch reinste
      der gesamten Balkanhalbinsel. Die Braunbärenpopulation ist die stärkste in einem einzelnen europäischen
      Schutzgebiet. Rothirsch, Reh und die im Roten Buch Bulgariens geführte Balkangemse kommen flächendeckend
      vor.


      Am Himmel kreisen hochalpine Arten. Auf den Matten brüten Alpenbraunelle und Mauerläufer; der
      [Steinadler](/especie/aquila_chrysaetos/) stellt hier rund 5 % des bulgarischen Gesamtbestands,
      begleitet vom Kaiseradler. Insgesamt wurden 224 Vogelarten erfasst, 123 davon brüten im Park.


      In den Gebirgsbächen behauptet die europaweit bedrohte Balkan-Bachforelle vitale Bestände. In den
      Hochlagen sind Kreuzotter und Waldeidechse verbreitet. Botanisch beherbergt das Areal über die Hälfte
      der heimischen Flora Bulgariens mit 10 Endemiten, darunter das geschützte Edelweiß.
    visit: >-
      Wandern ist die klassische Erkundungsform: Über 470 km markierte Pfade durchziehen das Schutzgebiet. Der
      Fernwanderweg E3 (Kom–Emine) folgt dem Kamm der Stara Planina; eine weitere Traditionsroute verbindet
      die Cordella-Hütte mit Danchova Polyana quer durch das Reservat Boatin. Reit-, Rad- und Lehrpfade
      ergänzen das Wegenetz.


      Zur Umweltbildung dienen Lehrpfade, das Bildungszentrum The Forest und das Informationszentrum Vezhen.
      Auch durch die strengen Reservate leiten markierte Pfade, die für Bildungs- und Durchquerungszwecke
      offenstehen.
    history: >-
      Der Park wurde am 31. Oktober 1991 ausgewiesen. Vier seiner Reservate gehören zum Weltnetz der
      UNESCO-Biosphärenreservate, und seit 2017 sind die alten Buchenbestände aller neun Reservate Teil des
      UNESCO-Welterbes der Alten Buchenwälder. Die Verwaltung arbeitet eng mit Gemeinden, Bergsteigern und
      Freiwilligen zusammen.


      Das Gebiet gliedert sich in fünf Schutzzonen. Die Kernzone der neun Totalreservate (Boatin, Tsarichina,
      Kozya Stena, Steneto, Stara Reka, Dzhendema, Severen Dzhendem, Peeshti Skali und Sokolna) genießt den
      höchsten Schutzstatus.
    before: >-
      Die beste Reisezeit reicht von Juni bis Oktober. Achte auf den Schutz der Wildtiere: Der Park betont das
      Recht der Tiere auf ungestörte Ruhezonen. Das Sammeln von Pilzen erfordert eine offizielle Genehmigung
      der Nationalparkverwaltung.
  it:
    intro: >-
      Quello che si estende a perdita d'occhio non è mai stato toccato dall'uomo. Il 97 % dei boschi del Parco
      Nazionale dei Balcani Centrali è di origine spontanea, e il 99 % è nato da disseminazione naturale senza
      alcun rimboschimento. Si allunga sulla cresta mediana dei Balcani bulgari: 716,69 km² lungo una dorsale
      di 85 km da ovest a est, con una larghezza media di appena 10 km. Nel suo cuore, nove riserve integrali
      tutelano faggete vetuste dichiarate Patrimonio Mondiale UNESCO nel 2017.
    landscape: >-
      Il dislivello racconta ogni cosa: dai 550 m presso Karlovo ai 2 376 m del picco Botev, la cima più alta
      dei Balcani. Tra questi estremi trovano posto praterie alpine, pareti verticali, forre profonde e
      cascate impetuose, con circa 20 vette oltre i 2 000 m. Spiccano cascate tra le più imponenti della
      Bulgaria: Raiskoto precipita per 124,5 m, Vidimskoto per 80 m e Kademliyskoto per 72 m.


      Nel sottosuolo il calcare si spalanca in abissi carsici. Nella riserva di Steneto si apre la Raichova
      dupka, seconda grotta verticale della Bulgaria con 377 m di profondità, mentre sulle creste sorgono
      archi e pilastri naturali come Skalen most, Markova dupka e Kalchovi kamani.


      Il clima di quota non concede tregua. Sulle creste la neve permane per oltre sei mesi all'anno superando
      i 2 m di accumulo, avvolta da nebbie fitte. Da quelle nevi nascono fiumi copiosi: Vit, Osam e Rositsa,
      affluenti del Danubio.


      Il bosco si organizza per fasce. Il faggio primeggia tra 900 e 1 600 m con un'età media di 135 anni,
      costituendo oltre il 7 % delle faggete bulgare. Misto ad abete bianco, peccio, carpino e rovere, copre
      gran parte del parco. Nella riserva di Boatin, estesa tra 800 e 1 750 m su 1 590,3 ettari, abbondano
      faggi fino a 200 anni che superano i 50 m di altezza. L'età media di tutti i boschi del parco è di 111
      anni, e sale a 121 anni per le latifoglie.
    wildlife: >-
      Nel parco vivono 59 specie di mammiferi, 224 di uccelli, 14 di rettili, 8 di anfibi e 6 di pesci. Tra i
      carnivori compaiono 12 specie: [lupo](/especie/canis_lupus/), sciacallo dorato, volpe, [orso
      bruno](/especie/ursus_arctos/), [lontra](/especie/lutra_lutra/), tasso e [gatto
      selvatico](/especie/felis_silvestris/). Il gatto selvatico vanta qui il ceppo geneticamente più puro
      dell'intera penisola balcanica, mentre l'orso bruno forma la colonia protetta più densa d'Europa. Cervi,
      caprioli e i camosci balcanici del Libro Rosso bulgaro popolano le valli in consistenze stabili.


      In alto regnano gli uccelli di rupe. Sulle praterie d'alta quota nidificano sordone e picchio muraiolo;
      l'[aquila reale](/especie/aquila_chrysaetos/) conta qui una popolazione pari a circa il 5 % delle coppie
      nidificanti in Bulgaria, affiancata dall'aquila imperiale. Sono 224 le specie ornitiche registrate, 123
      delle quali nidificanti.


      Nei torrenti la trota balcanica mantiene popolazioni d'importanza conservazionistica europea. Sulle
      pietraie d'alta quota vivono vipera comune e lucertola vivipara. La flora accoglie oltre metà delle
      specie vegetali della Bulgaria, con 10 endemismi esclusivi e fiori protetti come la stella alpina.
    visit: >-
      Il trekking è la forma d'esplorazione primaria: si contano oltre 470 km di sentieri tracciati. Il
      percorso internazionale E3 Kom–Emine segue la cresta della Stara Planina, mentre un altro celebre
      sentiero unisce il rifugio Cordella a Danchova Polyana attraversando la riserva di Boatin. Si sviluppano
      inoltre ippovie, piste ciclabili e percorsi naturalistici a tema.


      Per approfondire gli aspetti ecologici sono attivi sentieri didattici, il centro interpretativo The
      Forest e il punto informativo di Vezhen. All'interno delle riserve integrali appositi tracciati
      segnalati consentono il transito pedonale a scopo educativo.
    history: >-
      Il parco fu istituito il 31 ottobre 1991. Quattro delle sue riserve appartengono alla Rete Mondiale
      delle Riserve della Biosfera dell'UNESCO, e dal 2017 le faggete vetuste delle nove riserve fanno parte
      del Patrimonio Mondiale UNESCO delle faggete primarie. La direzione del parco opera in sinergia con
      volontari, comunità montane e club alpini.


      Il territorio è suddiviso in cinque fasce. Quella di riserva integrale, che racchiude le nove riserve
      (Boatin, Tsarichina, Kozya Stena, Steneto, Stara Reka, Dzhendema, Severen Dzhendem, Peeshti Skali e
      Sokolna), garantisce il più rigoroso livello di tutela.
    before: >-
      Il periodo migliore per la visita va da giugno a ottobre. Rispetta la fauna: il parco ricorda che gli
      animali hanno diritto alla tranquillità e le escursioni devono conformarsi ai ritmi naturali. La
      raccolta di funghi è soggetta ad apposita autorizzazione della direzione del parco.
  pt:
    intro: >-
      O arvoredo que aqui contemplas nunca foi plantado pela mão humana. Cerca de 97 % das florestas do Parque
      Nacional dos Balcãs Centrais são de origem natural, e 99 % brotaram de sementeira espontânea sem
      reflorestação artificial. Estende-se pela cumeada central e mais alpina dos Balcãs búlgaros: 716,69 km²
      ao longo de 85 km de oeste a leste, com uma largura média de apenas 10 km. No seu interior, nove
      reservas integrais preservam faiais vetustos classificados como Património Mundial da UNESCO desde 2017.
    landscape: >-
      A altitude determina toda a paisagem: desde os 550 m junto a Karlovo até aos 2 376 m no pico Botev, o
      cume mais alto da cordilheira. Entre estes extremos sucedem-se pastagens alpinas, escarpas verticais,
      desfiladeiros e cascatas grandiosas, contando-se cerca de 20 cumes acima dos 2 000 m. As cascatas
      figuram entre as mais altas da Bulgária: Raiskoto precipita-se de 124,5 m, Vidimskoto de 80 m e
      Kademliyskoto de 72 m.


      No subsolo o calcário abre-se em abismos vertiginosos. Na reserva de Steneto situa-se a Raichova dupka,
      a segunda gruta vertical mais profunda da Bulgária com 377 m, sobressaindo à superfície formações
      rochosas como Skalen most, Markova dupka e Kalchovi kamani.


      O clima de montanha não perdoa. Nos cumes a neve perdura mais de seis meses, acumulando mais de 2 m de
      espessura sob nevoeiros densos. Desse manto nival brotam nascentes abundantes: do parque nascem os rios
      Vit, Osam e Rositsa, afluentes do Danúbio.


      A floresta organiza-se por andares altitudinais. O faial domina entre os 900 e os 1 600 m com uma idade
      média de 135 anos, representando mais de 7 % dos faiais da Bulgária. Mesclado com espruce, abeto, carpe
      e carvalho, cobre grande parte do parque. Na reserva de Boatin, que se estende dos 800 aos 1 750 m em 1
      590,3 hectares, abundam faias com 200 anos de idade e mais de 50 m de altura. A idade média das matas do
      parque é de 111 anos, subindo para 121 anos nos bosques folhosos.
    wildlife: >-
      O parque contabiliza 59 espécies de mamíferos, 224 de aves, 14 de répteis, 8 de anfíbios e 6 de peixes.
      Entre os carnívoros ocorrem 12 espécies: [lobo](/especie/canis_lupus/), chacal-dourado, raposa,
      [urso-pardo](/especie/ursus_arctos/), [lontra](/especie/lutra_lutra/), texugo e
      [gato-bravo](/especie/felis_silvestris/). O gato-bravo apresenta aqui a linhagem mais pura de toda a
      península balcânica, enquanto o urso-pardo forma a população mais densa em área protegida da Europa.
      Veados, corços e a cabra-selvagem balcânica do Livro Vermelho búlgaro mantêm povoamentos estáveis.


      Para as aves, o olhar ergue-se aos céus. Nos cumes nidificam a ferreirinha-alpina e o trepa-fragas; a
      [águia-real](/especie/aquila_chrysaetos/) concentra aqui um núcleo que representa cerca de 5 % dos
      casais nidificantes da Bulgária, partilhando o território com a águia-imperial. No total registam-se 224
      espécies de aves, 123 das quais reprodutoras.


      Nas linhas de água, a truta-dos-balcãs conserva populações de grande relevância conservacionista. Nos
      planaltos superiores ocorrem a víbora-comum e a lagartixa-vivípara. A flora reúne mais de metade das
      plantas autóctones da Bulgária com 10 espécies endémicas, incluindo raridades como a flor-dos-alpes.
    visit: >-
      O pedestrianismo é a melhor forma de contacto: existem mais de 470 km de percursos pedestres balizados.
      O trilho internacional E3 Kom–Emine percorre a cumeada da Stara Planina, enquanto outro percurso
      clássico liga o refúgio Cordella a Danchova Polyana atravessando a reserva de Boatin. Existem também
      rotas equestres, BTT e percursos temáticos.


      Para compreender os ecossistemas, o parque disponibiliza trilhos interpretativos, o centro de
      acolhimento The Forest e o posto informativo de Vezhen. Nas reservas integrais, veredas sinalizadas
      canalizam os caminhantes e as visitas educativas.
    history: >-
      O parque nacional foi criado a 31 de outubro de 1991. Quatro das suas reservas integram a Rede Mundial
      de Reservas da Biosfera da UNESCO, e desde 2017 os faiais antigos das nove reservas compõem o sítio
      Património Mundial das florestas primárias de faias. A gestão mobiliza comunidades locais, clubes de
      montanha e voluntários.


      O território reparte-se em cinco zonas. A zona de reservas integrais, que congrega as nove reservas
      (Boatin, Tsarichina, Kozya Stena, Steneto, Stara Reka, Dzhendema, Severen Dzhendem, Peeshti Skali e
      Sokolna), beneficia do estatuto legal mais rigoroso.
    before: >-
      A melhor época estende-se de junho a outubro. Respeita a vida selvagem: o parque recorda que os animais
      têm direito à tranquilidade nos seus habitats. A apanha de cogumelos carece de licença prévia concedida
      pela direção do parque.
