resumen:
  es: >-
    Tres cadenas calizas paralelas cortadas a pico con el pico Säntis (2.502 m) y los pintorescos lagos
    Seealpsee y Fälensee.
  en: >-
    Three parallel sheer-cut limestone chains crowned by Mount Säntis (2,502 m) with scenic lakes Seealpsee
    and Fälensee.
  fr: >-
    Trois chaînons calcaires parallèles taillés à pic dominés par le mont Säntis (2 502 m) et les lacs
    pittoresques Seealpsee et Fälensee.
  de: >-
    Drei parallel verlaufende, steil abfallende Kalkketten mit dem Säntis (2.502 m) und den malerischen Seen
    Seealpsee und Fälensee.
  it: >-
    Tre catene calcaree parallele recise a picco con la vetta del Säntis (2.502 m) e i suggestivi laghi
    Seealpsee e Fälensee.
  pt: >-
    Três cristas calcárias paralelas cortadas a pique com o cume do Säntis (2.502 m) e os pitorescos lagos
    Seealpsee e Fälensee.
