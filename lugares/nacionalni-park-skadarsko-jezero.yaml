  es: >-
    El mayor lago de los Balcanes, compartido con Albania: nenúfares, islas monásticas y la colonia de
    pelícano ceñudo más occidental.
  en: >-
    The largest lake in the Balkans, shared with Albania: water lilies, monastic islands and the westernmost
    colony of Dalmatian pelicans.
  fr: >-
    Le plus grand lac des Balkans, partagé avec l'Albanie : nénuphars, îles monastiques et la colonie la plus
    occidentale de pélicans frisés.
  de: >-
    Der größte See des Balkans, mit Albanien geteilt: Seerosen, Klosterinseln und die westlichste Kolonie von
    Krauskopfpelikanen.
  it: >-
    Il più grande lago dei Balcani, condiviso con l'Albania: ninfee, isole monastiche e la colonia più
    occidentale di pellicani ricci.
  pt: >-
    O maior lago dos Balcãs, partilhado com a Albânia: nenúfares, ilhas monásticas e a colônia mais ocidental
    de pelicanos-dálmatas.
