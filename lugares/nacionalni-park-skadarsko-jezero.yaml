texto:
  es:
    intro: >-
      Un lago tan grande que cambia de tamaño con las estaciones, y que en verano se cubre de nenúfares. El
      lago Skadar es el mayor lago de los Balcanes, una criptodepresión que comparten Montenegro y Albania, y
      solo la parte montenegrina es parque nacional (la albanesa es parque natural). Su orilla norte es llana,
      inundable y está cubierta de carrizales y sauzales; la sur y la suroeste son rocosas, áridas y
      empinadas. El parque se declaró en 1983.
    landscape: >-
      El lago llena una cuenca de origen tectónico, formada por plegamientos y fallas durante el Cenozoico. Lo
      alimenta sobre todo el río Morača, que aporta más del 62 % del agua, y recibe además el caudal de más de
      200 manantiales kársticos, temporales y permanentes. El Buna lo conecta con el Adriático.


      El detalle más curioso está bajo la superficie. En el borde del lago hay manantiales sublacustres, los
      oka, mucho más profundos que el resto del fondo; el más profundo es Raduško oko. En la orilla noreste,
      cerca de Hasanoj, el manantial de Vitoja es un gran sistema kárstico. Y sobre el agua, en el lado norte,
      se extiende una enorme zona inundada cuyos límites cambian con el nivel del lago.


      La vegetación explica el paisaje de verano. Los nenúfares blancos y amarillos y la castaña de agua
      cubren grandes superficies, y a ellos se suman extensos y densos carrizales y espadañales, a menudo
      impenetrables. Junto a la desembocadura del Morača hay un amplio bosque de sauces. Tierra adentro, en
      algunos puntos, crecen árboles del roble de Skadar, un endemismo protegido como especie rara y
      amenazada. Y en las islas, cerca del lago, quedan restos de maquia con encina y laurel.
    wildlife: >-
      El lago es, antes que nada, un lugar de aves. Es una de las mayores reservas de aves de Europa, con
      algunos de los últimos [pelícanos](/especie/pelecanus_crispus/) del continente. La zona importa sobre
      todo como lugar de cría, alimentación y descanso de aves migratorias. Entre las acuáticas figuran
      pelícanos, cormoranes, garzas, espátulas, cigüeñas, grullas, ostreros y chorlitos. Y entre las
      protegidas ligadas a los humedales, el [aguilucho lagunero](/especie/circus_aeruginosus/), el [martín
      pescador](/especie/alcedo_atthis/), el [águila pescadora](/especie/pandion_haliaetus/) y el [pigargo
      europeo](/especie/haliaeetus_albicilla/). Las mejores épocas del año para ir son abril, mayo y junio, y
      septiembre y octubre.


      El agua guarda lo suyo. El lago es muy rico en peces, sobre todo carpas, alburnos y anguilas, y
      alrededor del 31 % de los caracoles de agua dulce son endémicos. La [nutria](/especie/lutra_lutra/),
      protegida por ley, es el mamífero típico del agua, y en los bosques de alrededor viven zorro, liebre,
      jabalí, ardilla, lirón y erizo. Se han registrado 13 de las 25 especies de murciélagos de Montenegro.
      Entre los anfibios vive la rana verde de Skadar, una especie amenazada, y entre los reptiles el gestor
      destaca la lagartija de cabeza afilada, endémica de Montenegro.
    visit: >-
      La observación de aves del lago se organiza en barca o desde el observatorio de Stanaj. Virpazar es la
      puerta clásica: está junto al río Crmnica, que desemboca en el lago, y desde allí una carretera sigue la
      orilla occidental hacia Albania.


      El lago guarda también patrimonio humano. En la isla de Beška hay dos iglesias, y en Grmožur una antigua
      fortaleza y prisión. Y en la confluencia del Morača con el lago está Žabljak Crnojevića, una fortaleza
      medieval abandonada.
    history: >-
      Žabljak Crnojevića fue la capital de Zeta bajo la dinastía Crnojević entre 1466 y 1478. En Rijeka
      Crnojevića estuvo la imprenta de los Crnojević, que imprimió los primeros libros del sureste de Europa.
    before: >-
      Antes de organizar la salida, consulta al gestor las condiciones de visita y los sectores abiertos al
      público. El nivel del agua cambia con las estaciones, y con él los límites de las zonas inundadas.
    around: >-
      El [Cañón del Río Cijevna](/lugar/kanjon-cijevine/) está a 8 km, el [Parque Nacional de
      Lovćen](/lugar/nacionalni-park-lovcen/) a 12 km. Cerca quedan también el [Cañón del Río
      Morača](/lugar/kanjon-morace/) y el [Parque Nacional de los Alpes Albaneses - Valbona y
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/). Más lejos, el [Parque Nacional de Prespa
      (Grecia)](/lugar/ethniko-parko-prespon/) comparte con Skadar el pelícano ceñudo y la nutria, y también
      los lagos y los humedales.
  en:
    intro: >-
      A lake so large it changes size with the seasons, and in summer is blanketed by water lilies. Lake
      Skadar is the largest lake in the Balkans, a cryptodepression shared between Montenegro and Albania;
      only the Montenegrin portion is a national park (the Albanian side is a nature park). Its northern shore
      is flat, prone to flooding and covered with reedbeds and willow groves; the southern and southwestern
      shores are rocky, arid and steep. The park was declared in 1983.
    landscape: >-
      The lake fills a basin of tectonic origin, shaped by folding and faulting during the Cenozoic. It is fed
      principally by the Morača River, which contributes more than 62% of the water, and also receives the
      flow of more than 200 karst springs, both temporary and permanent. The Buna connects it to the Adriatic.


      The most remarkable detail lies beneath the surface. Along the lake's edge are sublacustrine springs
      called *oka*, far deeper than the surrounding lakebed; the deepest is Raduško oko. On the northeast
      shore near Hasanoj, the Vitoja spring is a large karst system. Above water, on the northern side, an
      enormous flooded zone extends across shifting boundaries that follow the lake's level.


      The vegetation explains the summer landscape. White and yellow water lilies and water chestnuts carpet
      large surfaces, complemented by extensive, dense reedbeds and bulrush thickets, often impenetrable. Near
      the mouth of the Morača there is a broad willow forest. Inland at certain points grow Skadar oaks, an
      endemic species protected as rare and threatened. On the islands near the lake, remnants of maquis with
      holm oak and laurel survive.
    wildlife: >-
      The lake is first and foremost a bird place. It is one of Europe's greatest bird reserves, home to some
      of the continent's last [Dalmatian pelicans](/especie/pelecanus_crispus/). The area matters above all as
      a breeding, feeding and resting site for migratory birds. Waterbirds include pelicans, cormorants,
      herons, spoonbills, storks, cranes, oystercatchers and plovers. Among the protected wetland species are
      the [marsh harrier](/especie/circus_aeruginosus/), the [common kingfisher](/especie/alcedo_atthis/), the
      [osprey](/especie/pandion_haliaetus/) and the [white-tailed eagle](/especie/haliaeetus_albicilla/). The
      best seasons to visit are April, May and June, and September and October.


      The water holds its own. The lake is very rich in fish, especially carp, bleak and eels, and around 31%
      of freshwater snails are endemic. The [otter](/especie/lutra_lutra/), protected by law, is the
      characteristic aquatic mammal, while fox, hare, wild boar, squirrel, dormouse and hedgehog inhabit the
      surrounding woodlands. 13 of Montenegro's 25 bat species have been recorded here. Among amphibians lives
      the Skadar frog, a threatened species, and among reptiles the park management highlights the
      sharp-snouted rock lizard, endemic to Montenegro.
    visit: >-
      Bird-watching on the lake is organised by boat or from the Stanaj observatory. Virpazar is the classic
      gateway: it stands beside the Crmnica River at its outlet into the lake, from where a road follows the
      western shore towards Albania.


      The lake also holds human heritage. On the island of Beška there are two churches, and at Grmožur an
      ancient fortress-prison. At the confluence of the Morača with the lake stands Žabljak Crnojevića, an
      abandoned medieval fortress.
    history: >-
      Žabljak Crnojevića was the capital of Zeta under the Crnojević dynasty between 1466 and 1478. At Rijeka
      Crnojevića stood the Crnojević printing press, which printed the first books in southeastern Europe.
    before: >-
      Before organising your trip, consult the park management about visiting conditions and sectors open to
      the public. Water levels change with the seasons, and with them the boundaries of flooded zones.
    around: >-
      The [Cijevna River Canyon](/lugar/kanjon-cijevine/) is 8 km away, [Lovćen National
      Park](/lugar/nacionalni-park-lovcen/) is 12 km away. Nearby are also the [Morača River
      Canyon](/lugar/kanjon-morace/) and the [Albanian Alps National Park - Valbona and
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/). Further away, [Prespa National Park
      (Greece)](/lugar/ethniko-parko-prespon/) shares with Skadar the Dalmatian pelican and the otter, as well
      as lakes and wetlands.
  fr:
    intro: >-
      Un lac si grand qu'il change de taille au fil des saisons, et qui se couvre de nénuphars en été. Le lac
      de Skadar est le plus grand lac des Balkans, une cryptodépression partagée entre le Monténégro et
      l'Albanie ; seule la partie monténégrine est un parc national (la partie albanaise est un parc naturel).
      Sa rive nord est plate, inondable et couverte de roselières et de saulaies ; les rives sud et sud-ouest
      sont rocheuses, arides et escarpées. Le parc a été créé en 1983.
    landscape: >-
      Le lac occupe un bassin d'origine tectonique, formé par des plissements et des failles au Cénozoïque. Il
      est alimenté principalement par la rivière Morača, qui apporte plus de 62 % de l'eau, et reçoit aussi le
      débit de plus de 200 sources karstiques, temporaires et permanentes. Le Buna le relie à l'Adriatique.


      Le détail le plus remarquable se trouve sous la surface. Sur le bord du lac existent des sources
      sous-lacustres appelées *oka*, bien plus profondes que le reste du fond ; la plus profonde est Raduško
      oko. Sur la rive nord-est, près de Hasanoj, la source de Vitoja est un vaste système karstique.
      Au-dessus de l'eau, au nord, s'étend une vaste zone inondée dont les limites varient avec le niveau du
      lac.


      La végétation explique le paysage estival. Les nénuphars blancs et jaunes et la châtaigne d'eau couvrent
      de grandes surfaces, auxquels s'ajoutent d'épaisses roselières et des massettes souvent impénétrables.
      Près de l'embouchure de la Morača s'étend une large forêt de saules. À l'intérieur des terres, le chêne
      de Skadar, endémique protégé comme espèce rare et menacée, pousse en certains endroits. Sur les îles
      proches du lac subsistent des lambeaux de maquis à chêne vert et laurier.
    wildlife: >-
      Le lac est avant tout un lieu pour les oiseaux. C'est l'une des plus grandes réserves ornithologiques
      d'Europe, avec quelques-uns des derniers [pélicans frisés](/especie/pelecanus_crispus/) du continent. La
      zone importe surtout comme site de reproduction, d'alimentation et de repos des oiseaux migrateurs.
      Parmi les oiseaux aquatiques figurent pélicans, cormorans, hérons, spatules, cigognes, grues, huîtriers
      et pluviers. Parmi les espèces protégées liées aux zones humides : le [busard des
      roseaux](/especie/circus_aeruginosus/), le [martin-pêcheur d'Europe](/especie/alcedo_atthis/), le
      [balbuzard pêcheur](/especie/pandion_haliaetus/) et le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/). Les meilleures saisons sont avril, mai et juin, puis septembre
      et octobre.


      L'eau cache ses trésors. Le lac est très riche en poissons, notamment carpes, ablettes et anguilles, et
      environ 31 % des escargots d'eau douce sont endémiques. La [loutre](/especie/lutra_lutra/), protégée par
      la loi, est le mammifère aquatique emblématique, tandis que renard, lièvre, sanglier, écureuil, loir et
      hérisson peuplent les forêts environnantes. 13 des 25 espèces de chauves-souris du Monténégro y ont été
      recensées. Parmi les amphibiens vit la grenouille de Skadar, espèce menacée ; parmi les reptiles, la
      lézard des roches à museau pointu, endémique du Monténégro.
    visit: >-
      L'observation des oiseaux sur le lac se fait en barque ou depuis l'observatoire de Stanaj. Virpazar est
      la porte d'entrée classique : elle est située au bord de la rivière Crmnica, qui se jette dans le lac,
      et de là une route longe la rive occidentale vers l'Albanie.


      Le lac recèle également un patrimoine humain. Sur l'île de Beška se trouvent deux églises, et à Grmožur
      une ancienne forteresse-prison. À la confluence de la Morača et du lac se dresse Žabljak Crnojevića, une
      forteresse médiévale abandonnée.
    history: >-
      Žabljak Crnojevića fut la capitale de Zeta sous la dynastie Crnojević entre 1466 et 1478. À Rijeka
      Crnojevića se trouvait l'imprimerie des Crnojević, qui imprima les premiers livres du sud-est de
      l'Europe.
    before: >-
      Avant d'organiser votre visite, renseignez-vous auprès du gestionnaire du parc sur les conditions de
      visite et les secteurs ouverts au public. Le niveau de l'eau varie selon les saisons, et avec lui les
      limites des zones inondées.
    around: >-
      Le [Canyon de la rivière Cijevna](/lugar/kanjon-cijevine/) est à 8 km, le [Parc national de
      Lovćen](/lugar/nacionalni-park-lovcen/) à 12 km. À proximité se trouvent aussi le [Canyon de la rivière
      Morača](/lugar/kanjon-morace/) et le [Parc national des Alpes albanaises - Valbona et
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/). Plus loin, le [Parc national de Prespa
      (Grèce)](/lugar/ethniko-parko-prespon/) partage avec Skadar le pélican frisé et la loutre, ainsi que les
      lacs et les zones humides.
  de:
    intro: >-
      Ein See so groß, dass er mit den Jahreszeiten seine Ausdehnung verändert und im Sommer von Seerosen
      bedeckt wird. Der Skadarsee ist der größte See des Balkans, eine Kryptodepression, die sich Montenegro
      und Albanien teilen; nur der montenegrinische Teil ist Nationalpark (der albanische Teil ist Naturpark).
      Das nördliche Ufer ist flach, überschwemmungsgefährdet und mit Schilf- und Weidenwäldern bedeckt; die
      südlichen und südwestlichen Ufer sind felsig, karg und steil. Der Park wurde 1983 ausgewiesen.
    landscape: >-
      Der See füllt ein Becken tektonischen Ursprungs, das durch Faltungen und Verwerfungen im Känozoikum
      entstanden ist. Er wird hauptsächlich vom Fluss Morača gespeist, der mehr als 62 % des Wassers liefert,
      und erhält zusätzlich den Zufluss von mehr als 200 Karstquellen, temporären und dauerhaften. Der Buna
      verbindet ihn mit der Adria.


      Das bemerkenswerteste Detail liegt unter der Oberfläche. Am Seerand befinden sich sublakustrische
      Quellen, die sogenannten *oka*, die weit tiefer sind als der restliche Seegrund; die tiefste ist Raduško
      oko. Am Nordostufer, nahe Hasanoj, ist die Vitoja-Quelle ein weitläufiges Karstsystem. Über Wasser
      erstreckt sich an der Nordseite ein riesiges überschwemmtes Gebiet, dessen Grenzen mit dem Pegelstand
      des Sees schwanken.


      Die Vegetation erklärt die Sommerlandschaft. Weiße und gelbe Seerosen und Wasserkastanien bedecken große
      Flächen, dazu kommen ausgedehnte, dichte Schilf- und Binsenbestände, oft undurchdringlich. Nahe der
      Mündung der Morača befindet sich ein breiter Auenwald aus Weiden. Im Binnenland wächst an einigen
      Stellen die Skadar-Eiche, ein Endemit, der als seltene und bedrohte Art geschützt ist. Auf den nahe
      gelegenen Inseln überleben Reste von Macchie mit Steineiche und Lorbeer.
    wildlife: >-
      Der See ist in erster Linie ein Vogelparadies. Er zählt zu den bedeutendsten Vogelschutzgebieten Europas
      mit einigen der letzten [Krauskopfpelikane](/especie/pelecanus_crispus/) des Kontinents. Das Gebiet ist
      vor allem als Brut-, Fress- und Rastplatz für Zugvögel bedeutsam. Zu den Wasservögeln gehören Pelikane,
      Kormorane, Reiher, Löffler, Störche, Kraniche, Austernfischer und Regenpfeifer. Zu den geschützten
      Feuchtgebietsarten zählen die [Rohrweihe](/especie/circus_aeruginosus/), der
      [Eisvogel](/especie/alcedo_atthis/), der [Fischadler](/especie/pandion_haliaetus/) und der
      [Seeadler](/especie/haliaeetus_albicilla/). Die besten Jahreszeiten sind April, Mai und Juni sowie
      September und Oktober.


      Das Wasser birgt seine eigenen Schätze. Der See ist sehr fischreich, vor allem Karpfen, Lauben und Aale;
      etwa 31 % der Süßwasserschnecken sind Endemiten. Der [Fischotter](/especie/lutra_lutra/), gesetzlich
      geschützt, ist das charakteristische Wassersäugetier, während Fuchs, Hase, Wildschwein, Eichhörnchen,
      Siebenschläfer und Igel die umliegenden Wälder bewohnen. 13 der 25 montenegrinischen Fledermausarten
      wurden hier nachgewiesen. Unter den Amphibien lebt der Skadar-Frosch, eine bedrohte Art, und unter den
      Reptilien hebt das Parkmanagement die Spitzkopfeidechse hervor, ein montenegrinischer Endemit.
    visit: >-
      Die Vogelbeobachtung auf dem See erfolgt per Boot oder vom Observatorium Stanaj aus. Virpazar ist das
      klassische Eingangstor: Es liegt am Fluss Crmnica, der in den See mündet, von wo aus eine Straße dem
      Westufer in Richtung Albanien folgt.


      Der See birgt auch menschliches Erbe. Auf der Insel Beška stehen zwei Kirchen, und in Grmožur eine alte
      Festung mit Gefängnis. An der Mündung der Morača in den See erhebt sich Žabljak Crnojevića, eine
      verlassene mittelalterliche Festung.
    history: >-
      Žabljak Crnojevića war zwischen 1466 und 1478 die Hauptstadt von Zeta unter der Crnojević-Dynastie. In
      Rijeka Crnojevića befand sich die Crnojević-Druckerei, die die ersten Bücher Südosteuropas druckte.
    before: >-
      Erkundigen Sie sich vor der Reise bei der Parkverwaltung nach den Besuchsbedingungen und den für die
      Öffentlichkeit zugänglichen Bereichen. Der Wasserstand verändert sich mit den Jahreszeiten und damit
      auch die Grenzen der überschwemmten Zonen.
    around: >-
      Der [Cijevna-Schlucht](/lugar/kanjon-cijevine/) liegt 8 km entfernt, der [Nationalpark
      Lovćen](/lugar/nacionalni-park-lovcen/) 12 km. In der Nähe befinden sich auch die
      [Morača-Schlucht](/lugar/kanjon-morace/) und der [Nationalpark Albanische Alpen - Valbona und
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/). Weiter entfernt teilt der [Nationalpark Prespa
      (Griechenland)](/lugar/ethniko-parko-prespon/) mit Skadar den Krauskopfpelikan und den Fischotter sowie
      Seen und Feuchtgebiete.
  it:
    intro: >-
      Un lago così grande da cambiare dimensioni con le stagioni, e che in estate si ricopre di ninfee. Il
      lago di Scutari è il più grande lago dei Balcani, una criptodepressione condivisa tra Montenegro e
      Albania; solo la parte montenegrina è un parco nazionale (quella albanese è un parco naturale). La riva
      nord è pianeggiante, soggetta a inondazioni e coperta di canneti e saliceti; le rive sud e sud-ovest
      sono rocciose, aride e ripide. Il parco è stato istituito nel 1983.
    landscape: >-
      Il lago occupa un bacino di origine tettonica, formato da pieghe e faglie durante il Cenozoico. È
      alimentato principalmente dal fiume Morača, che apporta più del 62% dell'acqua, e riceve anche il flusso
      di più di 200 sorgenti carsiche, temporanee e permanenti. Il Buna lo collega all'Adriatico.


      Il dettaglio più curioso si trova sotto la superficie. Sul bordo del lago esistono sorgenti sublacustri
      chiamate *oka*, ben più profonde del resto del fondale; la più profonda è Raduško oko. Sulla riva
      nord-est, vicino a Hasanoj, la sorgente di Vitoja è un grande sistema carsico. Sopra l'acqua, sul lato
      nord, si estende una vasta zona allagata i cui confini variano con il livello del lago.


      La vegetazione spiega il paesaggio estivo. Le ninfee bianche e gialle e la castagna d'acqua coprono
      grandi superfici, affiancate da estesi e densi canneti e tifeti, spesso impenetrabili. Vicino alla foce
      della Morača si trova una larga foresta di salici. All'interno, in alcuni punti, crescono esemplari di
      quercia di Scutari, un endemismo protetto come specie rara e minacciata. Sulle isole vicine al lago
      sopravvivono resti di macchia con leccio e alloro.
    wildlife: >-
      Il lago è, prima di tutto, un luogo per gli uccelli. È una delle maggiori riserve ornitologiche
      d'Europa, con alcuni degli ultimi [pellicani ricci](/especie/pelecanus_crispus/) del continente. L'area
      è importante soprattutto come sito di nidificazione, alimentazione e sosta per gli uccelli migratori.
      Tra gli acquatici figurano pellicani, cormorani, aironi, spatole, cicogne, gru, beccacce di mare e
      pivieri. Tra le specie protette legate alle zone umide: il [falco di
      palude](/especie/circus_aeruginosus/), il [martin pescatore](/especie/alcedo_atthis/), il [falco
      pescatore](/especie/pandion_haliaetus/) e l'[aquila di mare](/especie/haliaeetus_albicilla/). I periodi
      migliori sono aprile, maggio e giugno, e settembre e ottobre.


      L'acqua custodisce i propri segreti. Il lago è ricchissimo di pesci, soprattutto carpe, alborelle e
      anguille, e circa il 31% delle lumache d'acqua dolce sono endemiche. La [lontra](/especie/lutra_lutra/),
      protetta per legge, è il mammifero acquatico caratteristico, mentre volpe, lepre, cinghiale, scoiattolo,
      ghiro e riccio abitano i boschi circostanti. Sono state registrate 13 delle 25 specie di pipistrelli del
      Montenegro. Tra gli anfibi vive la rana di Scutari, specie minacciata, e tra i rettili la gestione del
      parco segnala la lucertola a testa appuntita, endemica del Montenegro.
    visit: >-
      L'osservazione degli uccelli sul lago si organizza in barca o dall'osservatorio di Stanaj. Virpazar è il
      classico punto d'accesso: si trova lungo il fiume Crmnica, che sfocia nel lago, da dove una strada segue
      la riva occidentale verso l'Albania.


      Il lago conserva anche patrimonio umano. Sull'isola di Beška si trovano due chiese, e a Grmožur
      un'antica fortezza-prigione. Alla confluenza della Morača con il lago si erge Žabljak Crnojevića, una
      fortezza medievale abbandonata.
    history: >-
      Žabljak Crnojevića fu la capitale di Zeta sotto la dinastia Crnojević tra il 1466 e il 1478. A Rijeka
      Crnojevića sorgeva la tipografia dei Crnojević, che stampò i primi libri del sud-est europeo.
    before: >-
      Prima di organizzare la visita, consultare la direzione del parco sulle condizioni di accesso e i
      settori aperti al pubblico. Il livello dell'acqua varia con le stagioni, e con esso i confini delle zone
      allagate.
    around: >-
      Il [Canyon del fiume Cijevna](/lugar/kanjon-cijevine/) si trova a 8 km, il [Parco nazionale di
      Lovćen](/lugar/nacionalni-park-lovcen/) a 12 km. Nelle vicinanze si trovano anche il [Canyon del fiume
      Morača](/lugar/kanjon-morace/) e il [Parco nazionale delle Alpi albanesi - Valbona e
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/). Più lontano, il [Parco nazionale di Prespa
      (Grecia)](/lugar/ethniko-parko-prespon/) condivide con Scutari il pellicano riccio e la lontra, oltre a
      laghi e zone umide.
  pt:
    intro: >-
      Um lago tão grande que muda de tamanho com as estações, e que no verão se cobre de nenúfares. O lago
      Skadar é o maior lago dos Balcãs, uma criptodepressão partilhada entre Montenegro e Albânia; apenas a
      parte montenegrina é parque nacional (a parte albanesa é parque natural). A margem norte é plana,
      sujeita a cheias e coberta de caniçais e salgueirais; as margens sul e sudoeste são rochosas, áridas e
      íngremes. O parque foi criado em 1983.
    landscape: >-
      O lago preenche uma bacia de origem tectônica, formada por dobramentos e falhas durante o Cenozoico. É
      alimentado principalmente pelo rio Morača, que fornece mais de 62% da água, e recebe também o caudal de
      mais de 200 nascentes cársicas, temporárias e permanentes. O Buna liga-o ao Adriático.


      O detalhe mais curioso encontra-se abaixo da superfície. Na margem do lago existem nascentes
      sublacustres chamadas *oka*, muito mais profundas do que o restante fundo; a mais profunda é Raduško
      oko. Na margem nordeste, perto de Hasanoj, a nascente de Vitoja é um grande sistema cársico. Acima da
      água, no lado norte, estende-se uma enorme zona alagada cujos limites variam com o nível do lago.


      A vegetação explica a paisagem de verão. Os nenúfares brancos e amarelos e a castanha-de-água cobrem
      grandes superfícies, acompanhados por extensos e densos caniçais e taboais, frequentemente
      impenetráveis. Perto da foz do Morača existe uma ampla floresta de salgueiros. No interior, em alguns
      pontos, cresce o carvalho de Skadar, um endemismo protegido como espécie rara e ameaçada. Nas ilhas
      próximas do lago subsistem restos de maquis com azinheira e loureiro.
    wildlife: >-
      O lago é, acima de tudo, um lugar de aves. É uma das maiores reservas de aves da Europa, com alguns dos
      últimos [pelicanos-dálmatas](/especie/pelecanus_crispus/) do continente. A zona tem importância
      sobretudo como local de nidificação, alimentação e repouso de aves migratórias. Entre as aquáticas
      figuram pelicanos, corvos-marinhos, garças, colhereiros, cegonhas, grous, ostraceiros e tarambolas.
      Entre as espécies protegidas ligadas às zonas húmidas: o
      [tartaranhão-ruivo-dos-paúis](/especie/circus_aeruginosus/), o [guarda-rios](/especie/alcedo_atthis/), o
      [águia-pescadora](/especie/pandion_haliaetus/) e a
      [águia-de-cauda-branca](/especie/haliaeetus_albicilla/). As melhores épocas são abril, maio e junho, e
      setembro e outubro.


      A água guarda os seus segredos. O lago é muito rico em peixes, sobretudo carpas, alburnos e enguias, e
      cerca de 31% dos caracóis de água doce são endémicos. A [lontra](/especie/lutra_lutra/), protegida por
      lei, é o mamífero aquático típico, enquanto raposa, lebre, javali, esquilo, lirão e ouriço habitam os
      bosques circundantes. Foram registadas 13 das 25 espécies de morcegos do Montenegro. Entre os anfíbios
      vive a rã de Skadar, espécie ameaçada, e entre os répteis a direção do parque destaca o
      lagarto-de-focinho-pontiagudo, endémico do Montenegro.
    visit: >-
      A observação de aves no lago organiza-se de barco ou a partir do observatório de Stanaj. Virpazar é a
      porta de entrada clássica: situa-se junto ao rio Crmnica, que desagua no lago, de onde uma estrada segue
      a margem ocidental em direção à Albânia.


      O lago guarda também património humano. Na ilha de Beška existem duas igrejas, e em Grmožur uma antiga
      fortaleza-prisão. Na confluência do Morača com o lago ergue-se Žabljak Crnojevića, uma fortaleza
      medieval abandonada.
    history: >-
      Žabljak Crnojevića foi a capital de Zeta sob a dinastia Crnojević entre 1466 e 1478. Em Rijeka
      Crnojevića funcionou a tipografia dos Crnojević, que imprimiu os primeiros livros do sudeste europeu.
    before: >-
      Antes de organizar a visita, consulte a direção do parque sobre as condições de visita e os sectores
      abertos ao público. O nível da água muda com as estações e, com ele, os limites das zonas alagadas.
    around: >-
      O [Canhão do rio Cijevna](/lugar/kanjon-cijevine/) fica a 8 km, o [Parque Nacional de
      Lovćen](/lugar/nacionalni-park-lovcen/) a 12 km. Nas proximidades ficam também o [Canhão do rio
      Morača](/lugar/kanjon-morace/) e o [Parque Nacional dos Alpes Albaneses - Valbona e
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/). Mais longe, o [Parque Nacional de Prespa
      (Grécia)](/lugar/ethniko-parko-prespon/) partilha com Skadar o pelicano-dálmata e a lontra, bem como
      lagos e zonas húmidas.
