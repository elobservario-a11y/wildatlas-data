    Un lago kárstico lleno de manantiales subacuáticos donde se reúnen los pelícanos, las garzas y una de las
    mayores reservas de aves de Europa.
  en: >-
    A karst lake fed by underwater springs where pelicans, herons and one of Europe's greatest bird reserves
    converge.
  fr: >-
    Un lac karstique alimenté par des sources sous-lacustres où se rassemblent pélicans, hérons et l'une des
    plus grandes réserves ornithologiques d'Europe.
  de: >-
    Ein Karstsee mit Unterwasserquellen, an dem Pelikane, Reiher und eines der bedeutendsten
    Vogelschutzgebiete Europas zusammentreffen.
  it: >-
    Un lago carsico alimentato da sorgenti sottolaghi in cui convergono pellicani, aironi e una delle maggiori
    riserve ornitologiche d'Europa.
  pt: >-
    Um lago cársico alimentado por nascentes subaquáticas onde se reúnem pelicanos, garças e uma das maiores
    reservas de aves da Europa.
