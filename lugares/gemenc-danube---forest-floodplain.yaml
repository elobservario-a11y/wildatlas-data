resumen:
  es: >-
    El mayor bosque de ribera inundable continuo de Europa Central (20.000 ha) habitado por ciervos
    gigantescos.
  en: Central Europe’s largest continuous floodplain forest (20,000 ha) inhabited by trophy red deer.
  fr: >-
    La plus vaste forêt alluviale inondable continue d’Europe centrale (20 000 ha), domaine de cerfs
    majestueux.
  de: Mitteleuropas größter zusammenhängender Überschwemmungsauwald (20.000 ha), Heimat kapitaler Rothirsche.
  it: >-
    La più vasta foresta ripariale alluvionale continua dell’Europa centrale (20.000 ha), regno di cervi
    monumentali.
  pt: A maior floresta ripícola inundável contínua da Europa Central (20.000 ha), couto de veados monumentais.
unico:
  es: Un bosque que sigue respirando al ritmo de las crecidas del Danubio.
  en: A primeval riverine forest that continues to pulse with the natural flood cycles of the Danube.
  fr: Une forêt qui respire encore au rythme naturel des crues du Danube.
  de: Ein Auwald, der noch heute im natürlichen Rhythmus der Donauhochwasser atmet.
  it: Un bosco golenale primordiale che continua a respirare al ritmo naturale delle piene del Danubio.
  pt: Uma mata ribeirinha que continua a pulsar ao ritmo natural das cheias periódicas do Danúbio.
observaciones:
  es: >-
    Quédate en las rutas marcadas: muchas bordean zonas estrictamente protegidas. Los caminos de la llanura
    quedan impracticables durante mucho tiempo tras las crecidas del Danubio o tras lluvias largas, y de
    principios de enero a mediados de marzo y de septiembre a finales de diciembre pueden aplicarse
    prohibiciones temporales de entrada al bosque. La mejor época va de mayo a octubre.
texto:
  es:
    intro: >-
      Imagina un bosque al que el río entra a visitar cada primavera. En Gemenc, el Danubio no se ha quedado
      encajado entre muros: unos 180 kilómetros cuadrados se inundan con regularidad, y de esa crecida vive
      todo lo demás. Es una llanura aluvial de unos 30 kilómetros de largo y siete de ancho, casi toda
      cubierta de bosque, y una de las mayores llanuras inundables continuas de Europa.


      Está entre Szekszárd y Baja, en el sur de Hungría, dentro del Parque Nacional Duna-Dráva. Su fama viene
      de los ciervos, pero lo que de verdad lo distingue es el agua: sauces con los pies mojados, brazos
      muertos que florecen en mayo y miles de aves que paran aquí en la migración.
    landscape: >-
      En este tramo el Danubio pierde pendiente y velocidad. Serpentea, deposita bancos de limo y arena y
      cambia sin cesar de cauce; cuando un meandro se estrangula y el río lo abandona, queda un brazo muerto,
      y en las zonas más hondas, un lago interior. Esa dinámica se frenó entre 1810 y 1872, cuando la
      regulación cortó curvas y encerró el río entre diques para acelerar las crecidas con hielo y facilitar
      la navegación. El lecho se encajó, el nivel del agua bajó y las llanuras de fuera de los diques
      empezaron a secarse. Gemenc sobrevivió porque en este tramo los diques se levantaron lejos del río.


      Hoy el mosaico se ordena por la altura. Junto al agua mandan los sauces, que cubren las orillas de barro
      con su copa plateada y cada primavera, cuando se inundan, se llenan de campanillas de primavera. En las
      zonas bajas ganan los sauces y en las altas los álamos. Más arriba, donde el agua solo llega con las
      grandes crecidas, se extienden los bosques de galería de roble común, olmo blanco europeo y fresno
      húngaro, con un sotobosque tan enmarañado que para las personas es casi intransitable, y por eso es el
      refugio de la caza mayor. En el estrato herbáceo crece la fritilaria, de flor rosada y ajedrezada.


      Los brazos muertos tienen su propia estación: en mayo se vuelven blancos de nenúfares y amarillos de
      helecho flotante, y la castaña de agua, una planta relicta de la época posglacial, cubre el agua con sus
      hojas romboidales.
    wildlife: >-
      La primavera y el otoño son temporada de pasos. Durante la migración, miles de aves encuentran alimento
      y descanso en la llanura, y en invierno se quedan patos, gansos y cormoranes. Gemenc y Béda-Karapancsa
      tienen importancia europea por sus aves: aquí anidan el [pigargo
      europeo](/especie/haliaeetus_albicilla/), que construye un nido enorme en lo alto de un árbol y lo usa
      durante décadas, y la [cigüeña negra](/especie/ciconia_nigra/), cuya mayor población húngara es
      prioridad de protección del parque. También anidan el [halcón sacre](/especie/falco_cherrug/) y el
      [águila pomerana](/especie/aquila_pomarina/). En los carrizales crían la [garceta
      común](/especie/egretta_garzetta/), la [garceta grande](/especie/egretta_alba/), el [martinete
      común](/especie/nycticorax_nycticorax/), la [garza imperial](/especie/ardea_purpurea/) y unas pocas
      parejas de [avetoro común](/especie/botaurus_stellaris/). El milano negro sigue siendo común en el
      paisaje de Béda-Karapancsa.


      Entre los mamíferos, el [ciervo común](/especie/cervus_elaphus/) es el emblema, con una genética
      excepcional y cuerpos grandes pero bien proporcionados, y hay también
      [corzos](/especie/capreolus_capreolus/) y [jabalíes](/especie/sus_scrofa/). El [castor
      europeo](/especie/castor_fiber/) fue reintroducido en la zona y hoy se reproduce con éxito. La
      [nutria](/especie/lutra_lutra/) caza peces, el [gato montés](/especie/felis_silvestris/) busca bosques
      tranquilos junto a los carrizales y los murciélagos duermen y crían en los huecos de los árboles viejos.
      Entre los peces del tramo danubiano hay 51 especies confirmadas; el
      [esterlete](/especie/acipenser_ruthenus/) y la lota son todavía bastante comunes.


      En los bosques de roble, fresno y olmo viven los [ciervos volantes](/especie/lucanus_cervus/), una araña
      que solo vive en Gemenc y, junto al agua, entre sauces y álamos, la mariposa Apatura metis.
    visit: >-
      Todo empieza en el Centro Ecoturístico de Pörböly, a las afueras del pueblo. Ahí están la estación del
      tren forestal, una exposición interactiva sobre Gemenc y una escuela forestal. El Tren Forestal de
      Gemenc es el único de su tipo en una llanura aluvial de Hungría y sigue el cauce del Danubio y del Sió.
      Admite bicicletas, y quienes hacen rutas en canoa lo usan para llegar a la orilla del Rezéti-Duna, del
      Danubio o del Sió.


      A pie hay varios senderos con paneles que explican la flora, la fauna, la formación del paisaje y la
      gestión del bosque. El sendero de la cigüeña negra parte del centro de recepción de Keselyűs: 1.500
      metros y unos cuarenta minutos por un bosque aluvial de frondosas, de vuelta junto a un brazo muerto del
      Sió. Está abierto todo el año. La ruta de Vajas-torok cruza un territorio de [martines
      pescadores](/especie/alcedo_atthis/) y castores. Una combinación clásica: tren hasta Malomtelelő y
      vuelta a pie por el sendero Molnárka hasta Lassi. Otra, desde la casa de caza de Pörböly hasta el árbol
      de mayor perímetro del país.


      Cerca del centro hay además un recinto de más de tres hectáreas con una piara de jabalíes y una familia
      de ciervos, para verlos de cerca desde fuera de la valla.
    history: >-
      Hasta finales del siglo XVIII la gente no luchaba contra las crecidas: las repartía. El agua se desviaba
      por canales llamados fok hacia lagos de pesca, depresiones, prados y huertos; como la crecida subía
      despacio, había tiempo de poner a salvo bienes y ganado. Además de la pesca, la actividad principal era
      la cría extensiva de caballos y ganado gris. Los diques rompieron esa relación entre río y llanura, y
      fuera de ellos las crecidas desaparecieron y los terrenos se secaron.


      Hoy el parque nacional protege lo que queda de aquel sistema natural, de un valor excepcional porque en
      Europa quedan pocos humedales tan extensos.
    before: >-
      Quédate en las rutas marcadas: muchas bordean zonas estrictamente protegidas. Los caminos de la llanura
      quedan impracticables durante mucho tiempo tras las crecidas del Danubio o tras lluvias largas, y de
      principios de enero a mediados de marzo y de septiembre a finales de diciembre pueden aplicarse
      prohibiciones temporales de entrada al bosque. La mejor época va de mayo a octubre.
    around: >-
      A un kilómetro, en el mismo tramo del Danubio, está la [Llanura de Inundación
      Béda-Karapancsa](/lugar/beda-karapancsa-floodplain/), con la que Gemenc comparte la importancia de sus
      aves y la protección del parque nacional.
  en:
    intro: >-
      Picture a woodland visited every spring by the surging river. In Gemenc, the Danube has not been hemmed
      in by stone embankments: roughly 180 square kilometres flood on a seasonal cycle, sustaining an entire
      web of floodplain life. This alluvial tract measures some 30 kilometres in length by seven in breadth,
      almost completely enveloped by riparian forest and ranking among the largest unbroken floodplain
      woodlands in Europe.


      Stretching between Szekszárd and Baja in southern Hungary, it forms part of the Danube-Drava National
      Park. While legendary for its massive red deer, its defining character is shaped by water: willows
      standing waist-deep in floodwaters, oxbow lakes blooming in May, and thousands of migrant waterbirds
      halting on international flyways.
    landscape: >-
      Along this low-gradient stretch, the Danube slows down, depositing vast bars of silt and sand and
      constantly reshaping its channels. When meander loops naturally pinch out, oxbows are left behind,
      forming deep wetland lakes. This natural river dynamic was curtailed between 1810 and 1872, when river
      engineering cut off wide bends and confined channels between flood levees to accelerate ice passage and
      aid navigation. The riverbed incised, water tables dropped, and outer plains desiccated. Gemenc survived
      because here the levees were set far back from the active river.


      Today the plant mosaic mirrors relative elevation. White and black willows command the low, muddy
      shores, their silvery canopies inundated every spring amidst carpets of spring snowflakes. Willows
      dominate lowest hollows while poplars cap higher river ridges. Further inland, reachable only by major
      seasonal crests, lie dense gallery forests of pedunculate oak, European white elm, and narrow-leaved
      ash. The undergrowth is so impenetrable that human foot travel is nearly impossible, offering an
      undisturbed sanctuary for wild game. In the herb layer blooms the rare snake’s head fritillary with its
      checkered pink petals.


      The oxbow lakes follow their own phenology: in May they turn white with water lilies and yellow with
      floating water-fern, while water caltrop, a postglacial relict, blankets open water with floating
      rosettes.
    wildlife: >-
      Spring and autumn bring immense migratory waves. Thousands of birds refuel across the wetlands, while
      ducks, geese, and cormorants overwinter in great concentrations. Gemenc and the neighboring
      Béda-Karapancsa tract are of pan-European importance: key nesters include the [white-tailed
      eagle](/especie/haliaeetus_albicilla/), which constructs monumental eyries reused for decades, and the
      [black stork](/especie/ciconia_nigra/), whose Hungarian stronghold represents a top conservation
      priority. The [saker falcon](/especie/falco_cherrug/) and [lesser spotted
      eagle](/especie/aquila_pomarina/) breed locally. Expansive reedbeds shelter [little
      egrets](/especie/egretta_garzetta/), [great white egrets](/especie/egretta_alba/), [black-crowned night
      herons](/especie/nycticorax_nycticorax/), [purple herons](/especie/ardea_purpurea/), and elusive pairs
      of [Eurasian bitterns](/especie/botaurus_stellaris/). Black kites remain widespread across
      Béda-Karapancsa.


      Among mammals, the [red deer](/especie/cervus_elaphus/) reigns supreme, noted for exceptional genetics,
      great body mass, and prized antlers, coexisting with [roe deer](/especie/capreolus_capreolus/) and [wild
      boars](/especie/sus_scrofa/). The [Eurasian beaver](/especie/castor_fiber/) was reintroduced and now
      breeds successfully. The [Eurasian otter](/especie/lutra_lutra/) hunts fish along oxbows, the [European
      wildcat](/especie/felis_silvestris/) roams quiet woods adjacent to reedlands, and bats roost in tree
      cavities. Ichthyologists have confirmed 51 fish species in the Danube reach, where
      [sterlet](/especie/acipenser_ruthenus/) and burbot remain relatively widespread.


      Ancient hardwoods support [stag beetles](/especie/lucanus_cervus/), a rare endemic spider found solely
      in Gemenc, and the Freyer’s purple emperor butterfly flitting among willows and poplars.
    visit: >-
      Your journey begins at the Pörböly Ecotourism Centre on the village edge. Facilities include the
      terminal for the forest railway, interactive exhibits on Gemenc, and a forestry education centre. The
      Gemenc Forest Railway is the only narrow-gauge railway operating in a Hungarian floodplain, following
      the Danube and Sió rivers. It carries bicycles, and canoeists use it to reach launch sites on the
      Rezéti-Duna, Danube, or Sió.


      Several interpretive walking trails feature displays on wildlife and river management. The Black Stork
      Trail departs from Keselyűs reception centre: 1,500 metres taking about forty minutes through floodplain
      hardwoods, returning along a quiet Sió oxbow, open year-round. The Vajas-torok route passes through
      territory favored by [common kingfishers](/especie/alcedo_atthis/) and beavers. A classic outing
      combines taking the train to Malomtelelő and walking back along the Molnárka trail to Lassi. Another
      route runs from Pörböly hunting lodge to the largest-girth tree in Hungary.


      Near the centre, a fenced enclosure spanning more than three hectares allows close-up observation of
      wild boar sounders and red deer families from outside the perimeter.
    history: >-
      Until the late XVIII century, local communities adapted to seasonal inundations rather than resisting
      them. Water was diverted through sluice channels called fok into fishing lakes, swales, and orchards;
      because floodwaters rose slowly, people had ample time to safeguard livestock and property. River
      fishing and free-range herding of Hungarian grey cattle and horses flourished. Levee construction
      severed this symbiosis, drying out the outer plains.


      Today the national park safeguards what remains of this ancestral floodplain system, exceptionally rare
      in modern Europe due to widespread river canalization.
    before: >-
      Stay strictly on marked paths: several trails skirt integral reserves. Roads and tracks can become
      impassable for extended periods following high water or heavy rains, and seasonal forestry closures may
      apply from early January to mid-March and from September through late December. The best visiting window
      spans May to October.
    around: >-
      One kilometre downstream along the Danube lies the [Béda-Karapancsa
      Floodplain](/lugar/beda-karapancsa-floodplain/), sharing rich avifauna and national park conservation
      with Gemenc.
  fr:
    intro: >-
      Imaginez une forêt que le fleuve vient visiter chaque printemps. À Gemenc, le Danube n’a pas été
      emprisonné entre des digues étroites : environ 180 kilomètres carrés sont régulièrement submergés, et de
      cette pulsation dépend tout l’écosystème. C’est une plaine alluviale d’environ 30 kilomètres de long sur
      sept de large, presque entièrement boisée, formant l’une des plus vastes forêts inondables d’un seul
      tenant en Europe.


      S’étirant entre Szekszárd et Baja dans le sud de la Hongrie, au sein du parc national Danube-Drava, elle
      doit sa renommée à ses grands cerfs, mais c’est l’eau qui en dicte la physionomie : saules baignés par
      le courant, bras morts qui s’épanouissent en mai et milliers d’oiseaux d’eau faisant halte lors des
      migrations.
    landscape: >-
      Dans ce secteur, le Danube s’alanguit et perd sa pente. Il serpente, dépose des bancs de limon et de
      sable et modifie sans cesse son tracé ; lorsqu’un méandre se trouve court-circuité, il laisse un bras
      mort et, dans les zones les plus profondes, un lac intérieur. Cette dynamique naturelle fut ralentie
      entre 1810 et 1872, lorsque les travaux d’endiguement rectifièrent le cours du fleuve pour accélérer
      l’évacuation des glaces et faciliter la navigation. Le lit s’est enfoncé, les nappes ont baissé et les
      plaines extérieures ont commencé à s’assécher. Gemenc a survécu parce que les digues y furent édifiées
      loin des berges.


      Aujourd’hui, la végétation s’ordonne selon l’altitude relative. Au contact immédiat de l’eau règnent les
      saules blancs aux frondaisons argentées, inondés chaque printemps au-dessus de tapis de nivéoles. Les
      saules occupent les cuvettes et les peupliers les bourrelets alluviaux. Plus haut, là où l’eau n’arrive
      que lors des crues majeures, s’étendent les forêts de chêne pédonculé, d’orme blanc et de frêne à
      feuilles étroites, avec un sous-bois si enchevêtré qu’il est impénétrable à l’homme, servant de refuge
      au grand gibier. Dans la strate herbacée fleurit la fritillaire pintade aux corolles en damier rose.


      Les bras morts ont leur propre calendrier : en mai, ils blanchissent sous les nénuphars et jaunissent
      sous les fougères d’eau, tandis que la châtaigne d’eau, relique postglaciaire, couvre les flots de ses
      rosettes losangiques.
    wildlife: >-
      Le printemps et l’automne constituent les grandes saisons de passage. Des milliers d’oiseaux trouvent
      repos et nourriture dans la plaine, rejoints en hiver par des canards, des oies et des cormorans. Gemenc
      et Béda-Karapancsa possèdent une importance européenne majeure pour l’avifaune : ici nichent le
      [pygargue à queue blanche](/especie/haliaeetus_albicilla/), bâtisseur d’aires gigantesques réutilisées
      pendant des décennies, et la [cigogne noire](/especie/ciconia_nigra/), dont la plus forte population
      hongroise fait l’objet d’une protection prioritaire. Le [faucon sacre](/especie/falco_cherrug/) et
      l’[aigle pomarin](/especie/aquila_pomarina/) s’y reproduisent également. Les roselières abritent
      l’[aigrette garzette](/especie/egretta_garzetta/), la [grande aigrette](/especie/egretta_alba/), le
      [bihoreau gris](/especie/nycticorax_nycticorax/), le [héron pourpré](/especie/ardea_purpurea/) et
      quelques couples de [butors étoilés](/especie/botaurus_stellaris/). Le milan noir reste commun à
      Béda-Karapancsa.


      Parmi les mammifères, le [cerf élaphe](/especie/cervus_elaphus/) est l’emblème incontesté des lieux,
      réputé pour sa stature imposante et ses ramures exceptionnelles, côtoyant le
      [chevreuil](/especie/capreolus_capreolus/) et le [sanglier](/especie/sus_scrofa/). Le [castor
      d’Europe](/especie/castor_fiber/) a été réintroduit avec succès. La [loutre
      d’Europe](/especie/lutra_lutra/) chasse dans les bras morts, le [chat
      forestier](/especie/felis_silvestris/) hante les lisières tranquilles et les chauves-souris logent dans
      les cavités des vieux arbres. On dénombre 51 espèces de poissons dans le cours danubien, où le
      [sterlet](/especie/acipenser_ruthenus/) et la lote restent fréquents.


      Dans les boisements de feuillus vivent le [lucane cerf-volant](/especie/lucanus_cervus/), une araignée
      cavernicole endémique de Gemenc et, au bord de l’eau, le papillon Apatura metis.
    visit: >-
      Toute découverte débute au centre écotouristique de Pörböly, en lisière du village. Il abrite la gare du
      train forestier, une exposition interactive et une maison de la forêt. Le chemin de fer forestier de
      Gemenc est le seul train à voie étroite d’Europe centrale circulant en plaine inondable, longeant le
      Danube et le Sió. Il embarque les vélos et permet aux canoéistes de rallier les berges du Rezéti-Duna,
      du Danube ou du Sió.


      À pied, plusieurs sentiers balisés expliquent la vie du fleuve et la sylviculture. Le sentier de la
      Cigogne Noire part de Keselyűs : 1 500 mètres et quarante minutes à travers la ripisylve, longeant un
      ancien bras mort du Sió, praticable toute l’année. Le parcours de Vajas-torok traverse un secteur
      apprécié des [martins-pêcheurs](/especie/alcedo_atthis/) et des castors. Une combinaison classique
      consiste à prendre le train jusqu’à Malomtelelő et revenir à pied par le sentier Molnárka vers Lassi. Un
      autre itinéraire relie le pavillon de chasse de Pörböly au plus gros arbre répertorié de Hongrie.


      Près du centre d’accueil, un enclos de plus de trois hectares permet d’observer de près une compagnie de
      sangliers et une harde de cerfs.
    history: >-
      Jusqu’à la fin du XVIIIe siècle, les riverains ne luttaient pas contre les inondations mais les géraient
      : l’eau était dirigée par des canaux appelés fok vers des étangs de pêche, des prairies et des vergers.
      Comme les crues montaient lentement, on avait le temps de mettre biens et bétail à l’abri. La pêche et
      l’élevage extensif de chevaux et de bœufs gris constituaient les activités reines. Les digues brisèrent
      ce fonctionnement hydraulique, asséchant les plaines extérieures.


      Aujourd’hui, le parc national protège ce qui subsiste de cette plaine alluviale vivante, un biotope
      devenu rarissime à l’échelle du continent européen.
    before: >-
      Restez sur les sentiers balisés qui côtoient des zones de protection intégrale. Les chemins de terre
      deviennent impraticables après les crues ou de longues pluies, et des interdictions temporaires d’accès
      peuvent s’appliquer de début janvier à mi-mars et de septembre à fin décembre. La période idéale s’étend
      de mai à octobre.
    around: >-
      À un kilomètre de là, sur le même bief du Danube, s’étend la [plaine inondable de
      Béda-Karapancsa](/lugar/beda-karapancsa-floodplain/), partageant avec Gemenc une avifaune exceptionnelle
      et le statut de parc national.
  de:
    intro: >-
      Stell dir einen Wald vor, den der Strom jeden Frühling überflutet. In Gemenc ist die Donau nicht in ein
      enges Bett gezwängt: Rund 180 Quadratkilometer werden regelmäßig überschwemmt, und von dieser
      Wasserzufuhr lebt das gesamte Ökosystem. Es ist eine Schwemmlandebene von etwa 30 Kilometern Länge und
      sieben Kilometern Breite, fast vollständig von Auwald bedeckt und eine der größten zusammenhängenden
      Flussauen Europas.


      Das Gebiet liegt zwischen Szekszárd und Baja in Südungarn im Nationalpark Donau-Drau. Berühmt ist es für
      seine kapitalen Hirsche, doch geprägt wird es vom Wasser: Weidenwälder im Flutsaum, Altarme, die im Mai
      aufblühen, und Tausende Zugvögel auf der Durchreise.
    landscape: >-
      In diesem Abschnitt verliert die Donau an Gefälle und Strömung. Sie mäandriert, lagert Schlick- und
      Sandbänke ab und verlegt ihren Lauf; schneidet sich eine Schleife ab, bleibt ein Altwasserarm zurück und
      in tiefen Senken ein Binnensee. Diese Dynamik wurde zwischen 1810 und 1872 gebremst, als
      Flussbegradigungen Schleifen abschnitten und Dämme bauten, um Treibeis rasch abzuführen und die
      Schifffahrt zu sichern. Das Strombett vertiefte sich, der Grundwasserspiegel sank und Flächen außerhalb
      der Deiche trockneten aus. Gemenc überlebte, weil die Dämme weit abseits des Flusslaufs errichtet
      wurden.


      Heute staffelt sich die Vegetation nach Geländehöhe. Unmittelbar am Wasser wachsen Weiden, deren
      silbrige Kronen die Ufer säumen und im Frühjahr von Frühlings-Knotenblumen umgeben sind. In tiefen Lagen
      dominieren Weiden, auf erhöhten Uferwällen Pappeln. Weiter landeinwärts, wo Fluten nur bei extremem
      Hochwasser ankommen, stocken Hartholzauen aus Stieleiche, Flatterulme und Schmalblättriger Esche mit
      einem so dichten Unterholz, dass sie für Menschen kaum passierbar sind und dem Wild ideale Deckung
      bieten. In der Krautschicht blüht die Schachblume mit rosa karierten Glocken.


      Die Altwässer haben ihren eigenen Rhythmus: Im Mai färben sie sich weiß von Seerosen und gelb von
      Schwimmfarn, während die Wassernuss, ein nacheiszeitliches Relikt, die Wasserfläche mit rautenförmigen
      Blättern überzieht.
    wildlife: >-
      Frühjahr und Herbst sind Zugzeiten. Tausende Vögel rasten und äsen in der Flussaue, während im Winter
      Enten, Gänse und Kormorane ausharren. Gemenc und Béda-Karapancsa besitzen europäische Bedeutung für den
      Vogelschutz: Hier brütet der [Seeadler](/especie/haliaeetus_albicilla/) in jahrzehntelang genutzten
      Riesennestern, und der [Schwarzstorch](/especie/ciconia_nigra/) erreicht hier seine dichteste ungarische
      Population. Auch [Sakerfalke](/especie/falco_cherrug/) und [Schreiadler](/especie/aquila_pomarina/)
      ziehen Junge auf. In den Röhrichten nisten [Seidenreiher](/especie/egretta_garzetta/),
      [Silberreiher](/especie/egretta_alba/), [Nachtreiher](/especie/nycticorax_nycticorax/),
      [Purpurreiher](/especie/ardea_purpurea/) und wenige Paare der
      [Rohrdommel](/especie/botaurus_stellaris/). Der Schwarzmilan ist in Béda-Karapancsa verbreitet.


      Unter den Säugetieren ist der [Rothirsch](/especie/cervus_elaphus/) das Wappentier, berühmt für
      gewaltige Körpermasse und Trophäen, neben [Reh](/especie/capreolus_capreolus/) und
      [Wildschwein](/especie/sus_scrofa/). Der [Europäische Biber](/especie/castor_fiber/) wurde erfolgreich
      wiederangesiedelt. Der [Eurasische Fischotter](/especie/lutra_lutra/) jagt Fische, die
      [Wildkatze](/especie/felis_silvestris/) streift am Schilfrand, und Fledermäuse bewohnen Baumhöhlen. Im
      Donauabschnitt sind 51 Fischarten nachgewiesen, darunter [Sterlet](/especie/acipenser_ruthenus/) und
      Quappe.


      In alten Eichenwäldern leben [Hirschkäfer](/especie/lucanus_cervus/), eine endemische Höhlenspinne und
      an Weiden der Östliche Schillerfalter (*Apatura metis*).
    visit: >-
      Ausgangsort ist das Ökotourismus-Zentrum Pörböly am Ortsrand mit Schmalspurbahnhof, interaktiver
      Ausstellung und Waldschule. Die Gemencer Waldbahn ist die einzige Schmalspurbahn Ungarns in einem Auwald
      und erschließt Donau- und Sió-Ufer. Sie nimmt Fahrräder mit und befördert Kanuten zu Einstiegsstellen an
      Rezéti-Duna, Donau oder Sió.


      Mehrere Lehrpfade informieren über Auenökologie. Der Schwarzstorch-Pfad beginnt bei Keselyűs: 1.500
      Meter und rund vierzig Minuten durch den Hartholzauwald entlang eines Sió-Altarms, ganzjährig begehbar.
      Der Pfad Vajas-torok führt durch Reviere von [Eisvogel](/especie/alcedo_atthis/) und Biber. Beliebt ist
      die Fahrt mit der Bahn nach Malomtelelő und der Rückweg zu Fuß auf dem Pfad Molnárka nach Lassi. Ein
      weiterer Weg führt vom Jagdhaus Pörböly zum dicksten Baum Ungarns.


      Nahe dem Besucherzentrum ermöglicht ein über drei Hektar großes Schaugehege den Blick auf Wildschweine
      und Rothirsche.
    history: >-
      Bis ins späte XVIII. Jahrhundert bekämpfte man Hochwasser nicht, sondern nutzte es: Über Kanäle (fok)
      leitete man das Flutwasser kontrolliert in Fischweiher, Weiden und Obstgärten. Da das Wasser langsam
      stieg, blieb Zeit zur Sicherung von Hab und Gut. Fischerei sowie extensive Haltung von Pferden und
      Grauvieh prägten das Leben. Deichbauten unterbrachen diese Auenwirtschaft und ließen die Außenflächen
      versteppen.


      Heute bewahrt der Nationalpark den Rest dieser urtümlichen Flussauenlandschaft, die im begradigten
      Europa Seltenheitswert besitzt.
    before: >-
      Bleibe auf den markierten Wegen: Viele Pfade säumen Totalreservate. Nach Donauhochwassern oder
      anhaltendem Regen sind Wege oft wochenlang unpassierbar. Von Anfang Januar bis Mitte März sowie von
      September bis Ende Dezember gelten teils zeitweilige forstliche Betretungsverbote. Beste Reisezeit ist
      Mai bis Oktober.
    around: >-
      Nur einen Kilometer stromabwärts liegt die [Béda-Karapancsa-Aue](/lugar/beda-karapancsa-floodplain/),
      die denselben Donauabschnitt, reiche Vogelbestände und den Nationalparkstatus mit Gemenc teilt.
  it:
    intro: >-
      Immagina una foresta allagata puntualmente ogni primavera dalle acque del fiume. A Gemenc il Danubio non
      è stato rinchiuso tra argini stretti: circa 180 chilometri quadrati si inondano regolarmente,
      alimentando un ricchissimo ecosistema anfibio. È una piana alluvionale lunga circa 30 chilometri e larga
      sette, interamente coperta da foreste ripariali, tra le maggiori distese golenali continue d’Europa.


      Situata tra Szekszárd e Baja nel sud dell’Ungheria, all’interno del Parco Nazionale Danubio-Drava, deve
      la propria fama ai magnifici cervi, ma il suo vero elemento fondante è l’acqua: salici con le radici
      immerse nel fango, meandri abbandonati che fioriscono a maggio e migliaia di uccelli acquatici in sosta
      migratoria.
    landscape: >-
      In questo tratto il Danubio riduce la pendenza e perde velocità. Serpeggia, deposita banchi di sabbia e
      limo e muta continuamente tracciato; quando un’ansa viene tagliata, si trasforma in lanca e, nelle
      depressioni maggiori, in lago golenale. Questa dinamica fluviale venne regimata tra il 1810 e il 1872
      con rettifiche d’alveo e argini per favorire il disgelo ed eliminare le secche per la navigazione.
      L’alveo si incise, la falda calò e le golene esterne si inaridirono. Gemenc sopravvisse perché in
      quest’area gli argini maestri vennero eretti a grande distanza dalla riva.


      Oggi la vegetazione si distribuisce secondo le quote topografiche. In riva al fiume dominano i boschi di
      salice bianco, sommersi ogni primavera su tappeti di campanellini. Nelle conche prevalgono i salici e
      sui dossi alluvionali i pioppi. Più all’interno, dove l’acqua giunge solo durante le piene eccezionali,
      prosperano le foreste planiziali di farnia, olmo bianco e frassino meridionale, con un sottobosco così
      fitto da risultare impenetrabile all’uomo, rifugio ideale per i grandi ungulati. Nello strato erbaceo
      sboccia la rara mezzanotte (*Fritillaria meleagris*) dai petali a scacchiera porpora.


      I bracci morti seguono una fenologia propria: a maggio si ammantano del bianco delle ninfee e del giallo
      delle felci galleggianti, mentre il castagno d’acqua, relitto postglaciale, copre gli specchi d’acqua
      con rosette galleggianti.
    wildlife: >-
      Primavera e autunno segnano i grandi flussi migratori: migliaia di uccelli sostano nella golena, mentre
      anatre, oche e cormorani svernano a centinaia. Gemenc e Béda-Karapancsa rivestono un valore europeo per
      l’avifauna: vi nidifica l’[aquila di mare](/especie/haliaeetus_albicilla/) in nidi enormi utilizzati per
      decenni, e la [cicogna nera](/especie/ciconia_nigra/), la cui popolazione ungherese più densa
      costituisce una priorità di conservazione. Nidificano anche il [sacro](/especie/falco_cherrug/) e
      l’[aquila anatraia minore](/especie/aquila_pomarina/). Nei canneti nidificano la
      [garzetta](/especie/egretta_garzetta/), l’[airone bianco maggiore](/especie/egretta_alba/), la
      [nitticora](/especie/nycticorax_nycticorax/), l’[airone rosso](/especie/ardea_purpurea/) e rari
      [tarabusi](/especie/botaurus_stellaris/). Il nibbio bruno è frequente a Béda-Karapancsa.


      Tra i mammiferi spicca il [cervo nobile](/especie/cervus_elaphus/), celebre per imponenza e trofei,
      insieme al [capriolo](/especie/capreolus_capreolus/) e al [cinghiale](/especie/sus_scrofa/). Il [castoro
      europeo](/especie/castor_fiber/) è stato reintrodotto con successo. La [lontra
      europea](/especie/lutra_lutra/) preda pesci nelle lanche, il [gatto
      selvatico](/especie/felis_silvestris/) frequenta i boschi litoranei e i pipistrelli occupano i tronchi
      cavi. Nelle acque danubiane sono censite 51 specie ittiche, tra cui lo
      [sterletto](/especie/acipenser_ruthenus/) e la bottatrice.


      Nelle querce vetuste vivono il [cervo volante](/especie/lucanus_cervus/), un ragno troglobio endemico di
      Gemenc e la farfalla *Apatura metis*.
    visit: >-
      Il punto di riferimento è il Centro Ecoturistico di Pörböly alle porte del paese. Ospita il capolinea
      del trenino forestale, allestimenti interattivi su Gemenc e un centro didattico. Il Trenino Forestale di
      Gemenc è l’unico a scartamento ridotto attivo in una piana alluvionale ungherese, affiancando Danubio e
      Sió; consente il trasporto biciclette e porta i canoisti agli imbarchi su Rezéti-Duna, Danubio o Sió.


      A piedi si sviluppano sentieri didattici su flora e idrologia. Il sentiero della Cicogna Nera parte da
      Keselyűs: 1.500 metri e circa quaranta minuti nel bosco planiziale lungo una lanca del Sió, fruibile
      tutto l’anno. L’itinerario Vajas-torok attraversa zone frequentate dal [martin
      pescatore](/especie/alcedo_atthis/) e dal castoro. Un classico prevede il treno fino a Malomtelelő e il
      rientro a piedi lungo il sentiero Molnárka fino a Lassi. Un altro percorso muove dal casino di caccia di
      Pörböly all’albero più monumentale d’Ungheria.


      Vicino al centro visite, un’area recintata di oltre tre ettari consente di osservare da vicino cinghiali
      e cervi.
    history: >-
      Fino al termine del XVIII secolo le popolazioni locali non arginavano le piene, ma le governavano:
      l’acqua veniva incanalata tramite canali detti fok verso specchi di pesca, acquitrini, pascoli e orti.
      Poiché la piena saliva gradualmente, si aveva tempo di mettere al sicuro persone e bestiame. Pesca e
      allevamento brado di cavalli e bovini grigi costituivano il cardine dell’economia. Le arginature ruppero
      questo equilibrio, inaridendo le piane golenali esterne.


      Oggi il parco nazionale tutela l’ultimo grande lembo di questo paesaggio primordiale, quasi scomparso
      nel resto del continente europeo.
    before: >-
      Resta sui percorsi tracciati: molti sentieri costeggiano riserve integrali. I sentieri sterrati
      diventano impercorribili dopo le piene o forti piogge; da inizio gennaio a metà marzo e da settembre a
      fine dicembre possono scattare divieti d’accesso temporanei per gestione forestale. Il periodo ideale va
      da maggio a ottobre.
    around: >-
      A un chilometro di distanza, lungo il medesimo tratto danubiano, si trova la [Piana Alluvionale di
      Béda-Karapancsa](/lugar/beda-karapancsa-floodplain/), che condivide con Gemenc le colonie di uccelli e
      la tutela del parco nazionale.
  pt:
    intro: >-
      Imagina uma floresta que o grande rio visita todas as primaveras. Em Gemenc, o Danúbio não foi confinado
      entre muralhas estreitas: cerca de 180 quilómetros quadrados inundam-se com regularidade sazonal,
      alimentando toda a cadeia de vida aluvial. Trata-se de uma planície com cerca de 30 quilómetros de
      comprimento e sete de largura, quase toda florestada, constituindo uma das maiores matas inundáveis
      contínuas da Europa.


      Estende-se entre Szekszárd e Baja no sul da Hungria, integrada no Parque Nacional Danúbio-Drava. Se a
      fama deriva dos seus veados gigantescos, a sua alma nasce da água: salgueirais de pés submersos, braços
      mortos que desabrocham em maio e milhares de aves aquáticas em descanso migratório.
    landscape: >-
      Neste troço o Danúbio perde declive e velocidade. Serpenteia, acumula bancos de vasa e areia e muda de
      rumo sem cessar; quando um meandro se fecha, dá origem a uma lanca e, nas depressões fundas, a uma lagoa
      interior. Esta dinâmica foi restringida entre 1810 e 1872, quando as obras de regularização cortaram
      curvas e ergueram diques para escoar os gelos e facilitar a navegação. O leito aprofundou-se, o nível
      freático desceu e as várzeas exteriores começaram a secar. Gemenc resistiu porque neste setor os diques
      mestres foram erguidos longe do rio.


      Hoje o mosaico arbóreo organiza-se pelo relevo. Junto à corrente imperam os salgueiros-brancos de copas
      prateadas, inundados a cada primavera sobre tapetes de campainhas-da-primavera. Nos baixios dominam os
      salgueiros e nas restingas os choupos. Mais acima, onde as cheias só chegam nos picos excecionais,
      estendem-se as matas de carvalho-roble, olmo-branco e freixo-de-folhas-estreitas, com um sub-bosque tão
      emaranhado que é impenetrável ao ser humano, servindo de refúgio à caça maior. No estrato herbáceo brota
      a rara fritilária-axadrezada de corolas rosadas.


      Os braços mortos têm o seu próprio relógio biológico: em maio cobrem-se de branco com nenúfares e de
      amarelo com fetos flutuantes, enquanto a castanha-d’água, relíquia pós-glaciar, forra o espelho líquido
      com folhas losangulares.
    wildlife: >-
      A primavera e o outono marcam as grandes passagens migratórias. Milhares de aves encontram sustento na
      planície aluvial, juntando-se no inverno patos, gansos e corvos-marinhos. Gemenc e Béda-Karapancsa
      ostentam relevância internacional para a avifauna: nidificam aqui a
      [águia-rabalva](/especie/haliaeetus_albicilla/), construtora de ninhos colossais usados décadas a fio, e
      a [cegonha-preta](/especie/ciconia_nigra/), cuja densa população húngara constitui prioridade
      conservacionista. Reproduzem-se também o [falcão-sacre](/especie/falco_cherrug/) e a
      [águia-pomarina](/especie/aquila_pomarina/). Nos caniçais criam a
      [garça-branca-pequena](/especie/egretta_garzetta/), a [garça-branca-grande](/especie/egretta_alba/), o
      [savacu](/especie/nycticorax_nycticorax/), a [garça-vermelha](/especie/ardea_purpurea/) e escassos
      casais de [abetouro-comum](/especie/botaurus_stellaris/). O milhafre-preto é habitual em
      Béda-Karapancsa.


      Nos mamíferos, o [veado-vermelho](/especie/cervus_elaphus/) é o símbolo mor, com genética ímpar e portes
      possantes, convivendo com a [corça](/especie/capreolus_capreolus/) e o [javali](/especie/sus_scrofa/). O
      [castor-europeu](/especie/castor_fiber/) foi reintroduzido e procria livremente. A
      [lontra-europeia](/especie/lutra_lutra/) caça nos esteiros, o [gato-bravo](/especie/felis_silvestris/)
      ronda os caniçais e os morcegos abrigam-se em troncos ocos. No canal do Danúbio contam-se 51 espécies
      piscícolas comprovadas, onde o [esterlete](/especie/acipenser_ruthenus/) e a lota ainda ocorrem com
      frequência.


      Nos carvalhais velhos vive a [vaca-loura](/especie/lucanus_cervus/), uma aranha cavernícola exclusiva de
      Gemenc e, nas margens, a borboleta *Apatura metis*.
    visit: >-
      A visita começa no Centro Ecoturístico de Pörböly, nos arredores da povoação. Aí funcionam a estação do
      comboio florestal, uma exposição interativa e a escola da floresta. O Comboio Florestal de Gemenc é a
      única linha de via estreita a operar numa planície inundável na Hungria, margeando o Danúbio e o Sió.
      Transporta bicicletas e apoia os canoístas nos acessos ao Rezéti-Duna, Danúbio ou Sió.


      A pé existem percursos temáticos sinalizados. O Trilho da Cegonha-Preta arranca de Keselyűs: 1.500
      metros percorridos em quarenta minutos por entre a mata aluvial e uma lanca do Sió, aberto todo o ano. O
      trilho de Vajas-torok percorre zonas ricas em [guarda-rios-comum](/especie/alcedo_atthis/) e castores.
      Uma opção muito procurada combina a viagem de comboio até Malomtelelő e o regresso a pé pelo trilho
      Molnárka até Lassi. Outro roteiro vai da casa de caça de Pörböly até à árvore de maior perímetro da
      Hungria.


      Perto do centro de acolhimento, um cercado de mais de três hectares permite avistar javalis e veados a
      curta distância.
    history: >-
      Até finais do século XVIII as gentes ribeirinhas não travavam as cheias: aproveitavam-nas. As águas eram
      encaminhadas por canais chamados fok para lagoas piscícolas, baixios e pomares; subindo o caudal
      suavemente, havia tempo de resguardar haveres e gado. A pesca e o pastoreio extensivo de cavalos e bois
      cinzentos compunham o sustento local. Os diques quebraram esta harmonia, secando as terras exteriores.


      Hoje o parque nacional resguarda os últimos vestígios desta imensa planície de inundação natural, um
      património de raridade excecional na Europa contemporânea.
    before: >-
      Permanece nos trilhos oficiais: muitos margeiam zonas de reserva integral. Os caminhos de terra ficam
      intransitáveis durante semanas após as cheias ou chuvas contínuas; de princípios de janeiro a meados de
      março e de setembro ao final de dezembro podem vigorar restrições de entrada por motivos florestais. A
      melhor época decorre de maio a outubro.
    around: >-
      A escasso um quilómetro a jusante estende-se a [Planície de Inundação de
      Béda-Karapancsa](/lugar/beda-karapancsa-floodplain/), que partilha com Gemenc a riqueza ornitológica e a
      proteção do parque nacional.
