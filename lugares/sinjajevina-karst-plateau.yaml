unico:
  es: >-
    Una meseta de caliza sin límites, con una altitud media de 1.600 metros, donde las reglas de los pastores
    han moldeado el paisaje durante siglos.
  en: >-
    A boundless limestone plateau averaging 1,600 metres in altitude, shaped over centuries by customary
    pastoral governance.
  fr: >-
    Un plateau calcaire infini, d’une altitude moyenne de 1 600 mètres, façonné depuis des siècles par les
    règles des bergers.
  de: >-
    Eine endlose Kalkhochfläche auf durchschnittlich 1.600 Metern Höhe, seit Jahrhunderten geprägt durch
    traditionelle Weiderechte.
  it: >-
    Un altopiano calcareo sterminato, con una quota media di 1.600 metri, plasmato per secoli dalle
    consuetudini pastorali.
  pt: >-
    Um planalto calcário imenso com altitude média de 1.600 metros, moldado ao longo de séculos pelas regras
    seculares dos pastores.
observaciones:
  es: >-
    La montaña carece por completo de fuentes de agua potable, y es uno de los terrenos más apartados y
    difíciles de orientar de Montenegro, tanto para el conductor como para el excursionista. Está repartida
    entre los municipios de Žabljak, Šavnik, Kolašin y Mojkovac.
texto:
  es:
    intro: >-
      Imagina una meseta tan grande que se pierde de vista, de cumbres peladas y pastos sin fin, y sin una
      sola fuente de agua potable. Eso es Sinjajevina: la mayor montaña de Montenegro por superficie, una alta
      llanura de caliza inclinada hacia el noroeste, de superficie ondulada, que enlaza con la planicie de
      Durmitor. Se extiende de sureste a noroeste, entre Kolašin y Njegovuđa, cerca de Žabljak, y mide 40
      kilómetros de largo y 15 de ancho.
    landscape: >-
      Sinjajevina es de calizas paleozoicas y mesozoicas, con rocas eruptivas más jóvenes en algunos puntos, y
      la llanura alta tiene una altitud media de 1.600 metros, con pocas cumbres por encima. Lo que domina el
      ojo son innumerables cimas peladas, sin bosque, y entre ellas un espacio inmenso de pastos de alta
      montaña. Es, en la práctica, una suma de montañas sembradas «sin orden» sobre un altiplano, con un
      laberinto de valles y laderas.


      Sus bordes son cañones: el del Tara al noreste, el del Morača al suroeste, los de Tušinja y Bukovica al
      noroeste. Cerca del cañón del Tara está el lago Zabojsko, una de las dos zonas más notables de la
      montaña; la otra es un paisaje de torres y picos de piedra sobre el cañón del Morača, donde acaba la
      meseta. Hay otro lago, el Zminičko, y los dos están en proceso de extinción natural.


      Al sureste, desde Kolašin, el valle de Donje y Gornje Lipovo corta la meseta. Lo hizo el hielo: un
      glaciar que bajaba del noroeste, con brazos que modelaron los picos calizos, y hoy por él corre el río
      Plašnica, afluente del Tara.
    wildlife: >-
      Sinjajevina es una montaña de pastores. Los katuns, los asentamientos pastoriles de altura, pertenecen a
      ocho grupos tribales, cada uno con reglas propias para el acceso a los pastos a lo largo del año. El
      paisaje de alta montaña conserva una biodiversidad que ha evolucionado junto al pastoreo durante
      milenios, y los ecosistemas existen gracias al uso cuidadoso y la gobernanza de las comunidades locales
      durante generaciones.


      En invierno, la oficina de turismo de Kolašin lista las raquetas de nieve, el esquí de fondo y el esquí
      de travesía entre las actividades de la zona.
    visit: >-
      El camino clásico es el de Torna. Sale de Gornje Lipovo, a 1.319 metros y a 10 kilómetros de Kolašin, y
      recorre 7,33 kilómetros con 958 metros de desnivel en unas cuatro horas y diez minutos, hasta la cumbre,
      a 2.277 metros. Atraviesa bosque y hacia los 1.800 metros sale a los pastos; después una pedriza lleva
      al paso de Djedov Do, con vistas a las montañas del Morača, y de ahí a la cumbre el ascenso es
      técnicamente más exigente. Está clasificada como difícil y exigente. Desde arriba se ven Gradište,
      Jablanov vrh, el valle de Lipovo, Durmitor, Maganik, Komovi y las montañas del Morača.


      Una alternativa más suave es la de Ječmen Do, de 7,5 kilómetros y 281 metros de desnivel, en dos horas y
      media. Une Gornje Lipovo con el pasto de verano de Ječmen Do por el puerto de Vratlo, cerca del
      manantial de Ropusica, y es fácil. Ječmen Do es uno de los pastos de verano más grandes de Sinjajevina,
      entre cumbres y pastizales sin fin, y la ruta destaca por sus miradores y la flora típica de la montaña.


      Al sur, sobre el cañón del Morača, se alzan muchos picos de piedra que forman el conjunto más
      interesante para el montañismo.
    history: >-
      Sinjajevina-Durmitor es la segunda mayor zona de pastos de montaña de Europa, con más de 1.000
      kilómetros cuadrados de altiplano calizo entre 1.600 y 2.500 metros. Las alturas de sus cumbres están en
      discusión: para Torna se barajan cifras de 2253 y 2217 metros, entre otras.
    before: >-
      La montaña carece por completo de fuentes de agua potable, y es uno de los terrenos más apartados y
      difíciles de orientar de Montenegro, tanto para el conductor como para el excursionista. Está repartida
      entre los municipios de Žabljak, Šavnik, Kolašin y Mojkovac.
    around: >-
      A cuatro kilómetros están el [Parque Nacional Durmitor - Cañón del Río
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) y el [Parque Nacional Durmitor - Macizo
      Montañoso](/lugar/nacionalni-park-durmitor---masiv/); a trece, el [Parque Nacional Biogradska Gora -
      Macizo de Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), y a diecisiete, el [Cañón
      del Río Morača](/lugar/kanjon-morace/).
  en:
    intro: >-
      Imagine an undulating highland so vast it fades into the horizon, a realm of bare summits and endless
      alpine grasslands devoid of a single spring of drinking water. That is Sinjajevina: the largest mountain
      territory in Montenegro by surface area, a high limestone plateau tilting gently towards the north-west
      to meet the plains of Durmitor. Stretching from south-east to north-west between Kolašin and Njegovuđa
      near Žabljak, it spans 40 kilometres in length and 15 in width.
    landscape: >-
      Sinjajevina is built of Paleozoic and Mesozoic limestones, interspersed locally with younger volcanic
      formations, with the elevated tableland maintaining an average altitude of 1,600 metres and relatively
      few peaks rising far above. What strikes the eye are countless bare, tree-less ridges sheltering an
      immense expanse of alpine pasture. In reality, it forms a vast array of rounded peaks scattered across a
      high plateau carved by labyrinthine valleys and slopes.


      Its perimeter drops into profound canyons: the Tara gorge to the north-east, the Morača canyon to the
      south-west, and the Tušinja and Bukovica defiles to the north-west. Tucked near the Tara canyon lies
      Lake Zabojsko, one of the two most remarkable natural sites of the plateau; the other is a dramatic
      field of stone needles and pinnacles towering over the Morača canyon where the tableland terminates.
      Another lake, Zminičko, also rests on the plateau; both are undergoing natural extinction through
      sedimentation.


      To the south-east, the glacial valley of Donje and Gornje Lipovo cuts into the limestone from Kolašin.
      It was gouged by a Pleistocene glacier advancing from the north-west, and is drained today by the
      Plašnica river, a tributary of the Tara.
    wildlife: >-
      Sinjajevina is fundamentally a pastoral mountain. Its katuns, seasonal high-altitude settlements, are
      distributed among eight historic tribal clans, each abiding by ancestral rules governing rotational
      grazing access throughout the seasons. This alpine landscape preserves a rich biodiversity that has
      co-evolved with transhumant pastoralism over millennia, sustained by the customary stewardship of local
      communities across generations.


      During winter, the tourism office in Kolašin highlights snowshoeing, Nordic cross-country skiing, and
      backcountry ski mountaineering across the highland expanses.
    visit: >-
      The classic alpine hike is the ascent of Torna. Starting from Gornje Lipovo at 1,319 metres, located 10
      kilometres from Kolašin, the route covers 7.33 kilometres with 958 metres of elevation gain in roughly
      four hours and ten minutes to reach the summit at 2,277 metres. It begins through beech woods, emerges
      into open pastures near 1,800 metres, and crosses scree slopes to Djedov Do pass before tackling a
      technically demanding final ridge. The route is graded difficult and physically strenuous. From the
      summit, panoramic views take in Gradište, Jablanov vrh, the Lipovo valley, Durmitor, Maganik, Komovi,
      and the Morača mountains.


      A gentler alternative is the Ječmen Do trail, measuring 7.5 kilometres with 281 metres of ascent,
      completed in two and a half hours. It connects Gornje Lipovo to the expansive summer katun of Ječmen Do
      via the Vratlo pass, passing close to the Ropusica spring on an easy track. Ječmen Do is one of
      Sinjajevina’s largest summer pastures, set amidst boundless meadows and offering sweeping viewpoints
      over montane flora.


      To the south, overlooking the Morača canyon, rises an amphitheatre of rocky spires offering the most
      rugged terrain for mountaineering.
    history: >-
      The combined Sinjajevina-Durmitor plateau forms the second-largest montane grazing area in Europe,
      embracing over 1,000 square kilometres of karst highland situated between 1,600 and 2,500 metres. The
      precise summit elevations remain debated: for Torna, surveyor records cite figures of 2253 and 2217
      metres, among others.
    before: >-
      The plateau is completely devoid of reliable potable water sources and represents one of the most remote
      and navigationally bewildering expanses in Montenegro for motorists and hikers alike. Administratively,
      the massif is split across the municipalities of Žabljak, Šavnik, Kolašin, and Mojkovac.
    around: >-
      Four kilometres away lie [Durmitor National Park - Tara River
      Canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/) and [Durmitor National Park - Mountain
      Massif](/lugar/nacionalni-park-durmitor---masiv/); thirteen kilometres distant is [Biogradska Gora
      National Park - Bjelasica Massif](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), and
      seventeen kilometres away rises the [Morača River Canyon](/lugar/kanjon-morace/).
  fr:
    intro: >-
      Imaginez un plateau ondulé si vaste qu’il se perd à l’horizon, semé de sommets dénudés et d’alpages
      infinis, sans la moindre source d’eau potable. C’est la Sinjajevina : la plus vaste montagne du
      Monténégro par sa superficie, un haut plateau calcaire incliné vers le nord-ouest qui rejoint les
      étendues du Durmitor. S’étirant du sud-est au nord-ouest entre Kolašin et Njegovuđa près de Žabljak,
      elle mesure 40 kilomètres de long sur 15 de large.
    landscape: >-
      La Sinjajevina est constituée de calcaires paléozoïques et mésozoïques, ponctués localement de roches
      éruptives plus récentes ; ce haut plateau présente une altitude moyenne de 1 600 mètres, avec peu de
      crêtes s’élevant nettement au-dessus. Le regard est frappé par d’innombrables cimes pelées sans arbres
      et, entre elles, par une immense steppe herbeuse d’altitude. C’est en pratique une constellation de
      sommets disposés sans ordre apparent sur un altiplano entaillé de vallons.


      Ses marges s’effondrent en gorges spectaculaires : le canyon de la Tara au nord-est, celui de la Morača
      au sud-ouest, et les vallées de la Tušinja et de la Bukovica au nord-ouest. Près du canyon de la Tara
      repose le lac Zabojsko, l’un des sites les plus remarquables du massif ; l’autre est un champ de tours
      rocheuses dominant le canyon de la Morača, à l’extrémité du plateau. Un second plan d’eau, le lac
      Zminičko, subsiste sur le plateau ; tous deux connaissent une extinction naturelle par envasement.


      Au sud-est, depuis Kolašin, la vallée de Donje et Gornje Lipovo entaille le calcaire. Elle fut façonnée
      par un glacier quaternaire descendant du nord-ouest, drainée aujourd’hui par la rivière Plašnica,
      affluent de la Tara.
    wildlife: >-
      La Sinjajevina est avant tout une montagne pastorale. Les katuns, ces hameaux d’estive d’altitude,
      appartiennent à huit groupes tribaux traditionnels, chacun appliquant ses propres règles coutumières
      pour la rotation des troupeaux au fil des saisons. Ce paysage montagnard abrite une biodiversité
      remarquable ayant évolué de concert avec le pastoralisme depuis des millénaires, maintenue grâce à la
      gestion raisonnée des communautés locales depuis des générations.


      En hiver, l’office de tourisme de Kolašin recense raquettes à neige, ski de fond et ski de randonnée
      parmi les activités phares sur ces grands espaces.
    visit: >-
      L’ascension emblématique est celle de la Torna. Au départ de Gornje Lipovo à 1 319 mètres d’altitude, à
      10 kilomètres de Kolašin, le sentier parcourt 7,33 kilomètres pour 958 mètres de dénivelé en environ
      quatre heures et dix minutes jusqu’au sommet à 2 277 mètres. Traversant d’abord les sous-bois, il
      débouche vers 1 800 mètres sur les pelouses d’altitude avant de gravir les pierriers du col de Djedov
      Do, menant à une crête finale plus aérienne. Ce tracé est classé difficile et exigeant. Du sommet, la
      vue embrasse le Gradište, le Jablanov vrh, la vallée de Lipovo, le Durmitor, le Maganik, les Komovi et
      les monts de la Morača.


      Une variante plus accessible mène à Ječmen Do sur 7,5 kilomètres et 281 mètres de dénivelé en deux
      heures et demie. Elle relie Gornje Lipovo aux alpages de Ječmen Do par le col de Vratlo, près de la
      source de Ropusica, sur un chemin facile. Ječmen Do constitue l’un des plus vastes pâturages d’estive de
      la Sinjajevina, célèbre pour ses points de vue et sa flore montagnarde.


      Au sud, au-dessus du canyon de la Morača, se dresse un ensemble d’aiguilles rocheuses prisé des
      alpinistes.
    history: >-
      L’ensemble Sinjajevina-Durmitor constitue le deuxième plus vaste espace pastoral montagnard d’Europe,
      avec plus de 1 000 kilomètres carrés de hauts plateaux calcaires étagés entre 1 600 et 2 500 mètres. Les
      cotes des sommets font l’objet d’écarts topographiques : pour la Torna, diverses cartes mentionnent
      notamment 2253 et 2217 mètres.
    before: >-
      Le plateau est totalement dépourvu de points d’eau potable et représente l’un des territoires les plus
      isolés et déroutants pour l’orientation au Monténégro, tant pour les automobilistes que pour les
      randonneurs. Le massif se partage entre les municipalités de Žabljak, Šavnik, Kolašin et Mojkovac.
    around: >-
      À quatre kilomètres se trouvent le [parc national du Durmitor - canyon de la
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) et le [parc national du Durmitor - massif
      montagneux](/lugar/nacionalni-park-durmitor---masiv/) ; à treize kilomètres, le [parc national de
      Biogradska Gora - massif de la Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), et à
      dix-sept kilomètres, le [canyon de la Morača](/lugar/kanjon-morace/).
  de:
    intro: >-
      Stell dir eine wellige Hochebene vor, die sich scheinbar endlos bis zum Horizont dehnt, voller kahler
      Kuppen und weiter Matten, ohne eine einzige Trinkwasserquelle. Das ist die Sinjajevina: das flächenmäßig
      größte Gebirge Montenegros, eine sanft nach Nordwesten geneigte Kalktafel, die an die Ebenen des
      Durmitor anschließt. Sie erstreckt sich von Südosten nach Nordwesten zwischen Kolašin und Njegovuđa bei
      Žabljak über 40 Kilometer Länge und 15 Kilometer Breite.
    landscape: >-
      Die Sinjajevina besteht aus paläozoischen und mesozoischen Kalksteinen, stellenweise durchbrochen von
      jüngeren Vulkaniten; die Hochfläche liegt im Schnitt auf 1.600 Metern Höhe, wobei nur wenige Grate
      deutlich darüber hinausragen. Das Auge erblickt unzählige waldfreie Steinkuppen und dazwischen riesige
      Hochweiden. Praktisch handelt es sich um eine scheinbar ungeordnete Ansammlung von Bergen auf einem
      Altiplano voller Senken und Tälchen.


      Ihre Ränder brechen in tiefe Canyons ab: die Tara-Schlucht im Nordosten, der Morača-Canyon im Südwesten
      sowie die Kerben von Tušinja und Bukovica im Nordwesten. Nahe der Tara-Schlucht liegt der Zabojsko-See,
      eine der beiden markantesten Landschaftsperlen; die andere ist ein Felsnadel- und Turmlabyrinth über dem
      Morača-Canyon am südlichen Plateauende. Mit dem Zminičko-See existiert ein weiteres Gewässer; beide
      verlanden auf natürliche Weise.


      Im Südosten schneidet das Gletschertal Donje und Gornje Lipovo von Kolašin aus in das Kalkplateau ein.
      Es wurde von einem eiszeitlichen Gletscher geformt und wird heute von der Plašnica entwässert, einem
      Zufluss der Tara.
    wildlife: >-
      Die Sinjajevina ist das Reich der Hirten. Die Katuns, traditionelle Sommersiedlungen in den Bergen,
      verteilen sich auf acht Sippenverbände, von denen jeder eigene althergebrachte Regeln für den saisonalen
      Weideauftrieb besitzt. Diese Kulturlandschaft bewahrt eine Artenvielfalt, die sich über Jahrtausende im
      Einklang mit der Wanderschäferei entwickelt hat und durch die sorgsame Selbstverwaltung der
      Gemeinschaften über Generationen erhalten blieb.


      Im Winter empfiehlt das Tourismusbüro in Kolašin Schneeschuhtouren, Langlauf und Skitouren über die
      weiten Schneefelder der Hochebene.
    visit: >-
      Der klassische Bergweg führt auf die Torna. Er beginnt in Gornje Lipovo auf 1.319 Metern Höhe, 10
      Kilometer von Kolašin entfernt, und führt über 7,33 Kilometer und 958 Höhenmeter in etwa vier Stunden
      und zehn Minuten zum 2.277 Meter hohen Gipfel. Nach Waldpassagen erreicht man gegen 1.800 Meter offene
      Weiden, quert Schotterflanken zum Djedov-Do-Sattel und steigt über schroffere Felsen zum Gipfel auf. Die
      Tour gilt als alpin anspruchsvoll. Oben reicht der Blick über Gradište, Jablanov vrh, das Lipovo-Tal,
      Durmitor, Maganik, Komovi und die Morača-Berge.


      Eine leichtere Alternative ist die Route nach Ječmen Do über 7,5 Kilometer und 281 Höhenmeter in
      zweieinhalb Stunden. Sie verbindet Gornje Lipovo über den Vratlo-Pass nahe der Ropusica-Quelle auf
      bequemen Wegen mit der Sommerweide Ječmen Do. Dieser Katun zählt zu den größten Weidegründen der
      Sinjajevina und besticht durch weite Aussichten und Hochgebirgsblumen.


      Im Süden über dem Morača-Canyon ragen Felstürme auf, die das alpinistisch lohnendste Kletterrevier des
      Massivs bilden.
    history: >-
      Der Komplex Sinjajevina-Durmitor bildet die zweitgrößte Hochweideregion Europas mit über 1.000
      Quadratkilometern Karsthochfläche zwischen 1.600 und 2.500 Metern. Die Gipfelhöhen weichen in den
      Quellen voneinander ab: Für die Torna werden unter anderem 2253 und 2217 Meter angegeben.
    before: >-
      Das Gebirge besitzt keinerlei verlässliche Trinkwasserquellen und zählt zu den abgelegensten, am
      schwersten zu navigierenden Regionen Montenegros für Fahrer und Wanderer. Es verteilt sich auf die
      Gemeinden Žabljak, Šavnik, Kolašin und Mojkovac.
    around: >-
      Vier Kilometer entfernt liegen der [Nationalpark Durmitor -
      Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/) und das [Nationalpark Durmitor -
      Bergmassiv](/lugar/nacionalni-park-durmitor---masiv/); dreizehn Kilometer entfernt ist der [Nationalpark
      Biogradska Gora - Bjelasica-Massiv](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) und
      siebzehn Kilometer die [Morača-Schlucht](/lugar/kanjon-morace/).
  it:
    intro: >-
      Immagina un altopiano ondulato talmente sconfinato da perdersi a vista d’occhio, fatto di creste brulle
      e pascoli infiniti, senza una sola sorgente d’acqua potabile. Questa è Sinjajevina: la montagna più
      vasta del Montenegro per estensione, un altopiano calcareo inclinato verso nord-ovest che si fonde con
      le piane del Durmitor. Esteso da sud-est a nord-ovest tra Kolašin e Njegovuđa presso Žabljak, misura 40
      chilometri di lunghezza e 15 di larghezza.
    landscape: >-
      Sinjajevina è costituita da calcari paleozoici e mesozoici con affioramenti vulcanici isolati;
      l’altopiano mantiene una quota media di 1.600 metri, con poche vette che svettano nettamente. Lo sguardo
      abbraccia innumerevoli dossi spogli, privi di alberi, e tra essi praterie alpine sconfinate. Di fatto è
      un insieme caotico di rilievi disseminati su un altopiano carsico inciso da avvallamenti e conche.


      I suoi orli precipitano in forre profonde: il canyon della Tara a nord-est, quello della Morača a
      sud-ovest e le gole di Tušinja e Bukovica a nord-ovest. Presso la Tara si annida il lago Zabojsko, una
      delle emergenze naturali più celebri; l’altra è uno scenario di guglie e torrioni calcarei a picco sul
      canyon della Morača, dove l’altopiano scende a precipizio. Esiste anche il lago Zminičko; entrambi sono
      soggetti a un naturale processo di interrimento.


      A sud-est, da Kolašin, la valle glaciale di Donje e Gornje Lipovo taglia l’altopiano. Fu modellata da un
      antico ghiacciaio proveniente da nord-ovest ed è oggi percorsa dal fiume Plašnica, affluente della Tara.
    wildlife: >-
      Sinjajevina è la terra dei pastori. I katun, i tipici villaggi d’alpeggio, appartengono a otto comunità
      tribali storiche, ciascuna regolata da norme secolari per l’accesso ai pascoli nelle diverse stagioni.
      Questo paesaggio montano custodisce una biodiversità coevoluta con il pastoralismo transumante per
      millenni, preservata grazie all’oculata gestione consuetudinaria delle comunità locali attraverso le
      generazioni.


      In inverno, l’ufficio turistico di Kolašin propone ciaspolate, sci di fondo e scialpinismo sui grandi
      spazi aperti dell’altopiano.
    visit: >-
      L’itinerario escursionistico più classico conduce alla Torna. Partendo da Gornje Lipovo a 1.319 metri di
      quota, a 10 chilometri da Kolašin, il sentiero percorre 7,33 chilometri con 958 metri di dislivello in
      circa quattro ore e dieci minuti fino alla vetta a 2.277 metri. Supera il bosco, sbuca intorno a 1.800
      metri sui pascoli e risale ghiaioni verso la sella di Djedov Do, affrontando una cresta finale più aerea
      ed esposta. È classificato come percorso impegnativo per camminatori esperti. Dalla cima il panorama
      tocca Gradište, Jablanov vrh, la valle di Lipovo, il Durmitor, Maganik, i Komovi e i monti della Morača.


      Un’alternativa più agevole punta a Ječmen Do su 7,5 chilometri e 281 metri di salita in due ore e mezza.
      Collega Gornje Lipovo all’alpeggio di Ječmen Do attraverso il valico di Vratlo, vicino alla sorgente di
      Ropusica, su facile sentiero. Ječmen Do è uno dei pascoli estivi più ampi di Sinjajevina, rinomato per
      gli ampi orizzonti e la flora d’alta quota.


      A sud, a strapiombo sul canyon della Morača, si stagliano formazioni rocciose adatte all’alpinismo.
    history: >-
      Il vasto territorio di Sinjajevina-Durmitor costituisce il secondo comprensorio di pascoli d’alta quota
      d’Europa, con oltre 1.000 chilometri quadrati di altopiano calcareo compreso tra 1.600 e 2.500 metri. Le
      quote delle cime presentano lievi discrepanze cartografiche: per la Torna vengono spesso indicate quote
      di 2253 e 2217 metri.
    before: >-
      L’altopiano è completamente privo di sorgenti di acqua potabile e costituisce una delle zone più remote
      e complesse per l’orientamento di tutto il Montenegro, sia in fuoristrada sia a piedi. Il massiccio è
      suddiviso tra i comuni di Žabljak, Šavnik, Kolašin e Mojkovac.
    around: >-
      A quattro chilometri sorgono il [Parco Nazionale Durmitor - Canyon del Fiume
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e il [Parco Nazionale Durmitor - Massiccio
      Montuoso](/lugar/nacionalni-park-durmitor---masiv/); a tredici chilometri il [Parco Nazionale Biogradska
      Gora - Massiccio di Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), e a diciassette
      il [Canyon del Fiume Morača](/lugar/kanjon-morace/).
  pt:
    intro: >-
      Imagina um planalto ondulado tão colossal que se dissipa no horizonte, feito de cumes despidos e
      pastagens infinitas, sem uma única fonte de água potável. Isso é a Sinjajevina: a montanha de maior
      extensão territorial de Montenegro, um alto altiplano calcário inclinado para noroeste que conflui com
      as planuras do Durmitor. Desenvolve-se de sudeste para noroeste entre Kolašin e Njegovuđa perto de
      Žabljak, estendendo-se por 40 quilómetros de comprimento e 15 de largura.
    landscape: >-
      A Sinjajevina assenta em calcários paleozoicos e mesozoicos, pontuados por intrusões vulcânicas
      pontuais; o planalto culmina a uma altitude média de 1.600 metros, com poucas cristas a superá-la
      francamente. O olhar abarca inúmeros cumes pedregosos desprovidos de arvoredo e, entre eles, uma
      pradaria de altitude incomensurável. Constitui, na prática, uma sucessão desordenada de montanhas sobre
      um altiplano sulcado por vales e socalcos.


      As suas bordaduras precipitam-se em desfiladeiros colossais: o do Tara a nordeste, o do Morača a
      sudoeste e as fendas de Tušinja e Bukovica a noroeste. Perto do desfiladeiro do Tara repousa o lago
      Zabojsko, um dos pontos mais notáveis da montanha; o outro é um anfiteatro de agulhas e torres rochosas
      sobranceiro ao desfiladeiro do Morača, onde o planalto quebra em falésia. Existe ainda o lago Zminičko;
      ambos sofrem um processo natural de dessecação e assoreamento.


      A sudeste, a partir de Kolašin, o vale glaciar de Donje e Gornje Lipovo rasga o planalto. Foi escavado
      por uma língua de gelo que descia de noroeste, sendo drenado na atualidade pelo rio Plašnica, afluente
      do Tara.
    wildlife: >-
      A Sinjajevina é a montanha dos pastores. Os katuns, assentamentos sazonais de altitude, pertencem a oito
      comunidades tribais ancestrais, cada uma com normas consuetudinárias próprias para o aproveitamento das
      pastagens ao longo do ano. Esta paisagem alpina preserva uma biodiversidade que coevoluiu com a
      pastorícia ao longo de milénios, sustentada pela governança comunitária ao longo de gerações.


      No inverno, o posto de turismo de Kolašin destaca raquetes de neve, esqui de fundo e esqui de montanha
      nas extensões do planalto.
    visit: >-
      A caminhada clássica é a ascensão ao pico Torna. Partindo de Gornje Lipovo a 1.319 metros de altitude, a
      10 quilómetros de Kolašin, o trilho percorre 7,33 quilómetros com 958 metros de desnível em cerca de
      quatro horas e dez minutos até ao cume a 2.277 metros. Atravessa bosque, sai por volta dos 1.800 metros
      para os prados alpinos e galga cascalheiras até ao colo de Djedov Do, abordando uma crista final mais
      escarpada. Está classificada como rota difícil e exigente. Do topo avistam-se Gradište, Jablanov vrh, o
      vale de Lipovo, o Durmitor, Maganik, Komovi e a serra do Morača.


      Uma opção mais suave conduz a Ječmen Do ao longo de 7,5 quilómetros e 281 metros de subida em duas horas
      e meia. Liga Gornje Lipovo à pastagem de verão de Ječmen Do através do colo de Vratlo, perto da nascente
      de Ropusica, por trilho fácil. Ječmen Do é uma das maiores pastagens da Sinjajevina, destacando-se pelos
      miradouros e pela flora de montanha.


      A sul, sobre o desfiladeiro do Morača, erguem-se escarpas rochosas que formam o setor mais procurado
      para alpinismo.
    history: >-
      O conjunto Sinjajevina-Durmitor representa a segunda maior área de pastagens de montanha da Europa,
      congregando mais de 1.000 quilómetros quadrados de altiplanos calcários situados entre os 1.600 e os
      2.500 metros. As altitudes cimeiras apresentam divergências nos mapas: para a Torna registam-se valores
      de 2253 e 2217 metros.
    before: >-
      A montanha carece em absoluto de mananciais de água potável e constitui um dos territórios mais remotos
      e desorientadores de Montenegro para automobilistas e caminheiros. O maciço reparte-se
      administrativamente pelos municípios de Žabljak, Šavnik, Kolašin e Mojkovac.
    around: >-
      A quatro quilómetros situam-se o [Parque Nacional Durmitor - Desfiladeiro do Rio
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e o [Parque Nacional Durmitor - Maciço
      Montanhoso](/lugar/nacionalni-park-durmitor---masiv/); a treze o [Parque Nacional Biogradska Gora -
      Maciço de Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) e a dezassete o
      [Desfiladeiro do Rio Morača](/lugar/kanjon-morace/).
