  en: >-
    A limestone and crystal-water gorge through which, according to myth, souls traveled on their way to
    Hades.
  fr: >-
    Une gorge de calcaire et d'eau cristalline par laquelle, selon le mythe, transitaient les âmes en route
    vers l'Hadès.
  de: >-
    Eine Kalkklamm mit kristallklarem Wasser, durch die der Sage nach die Seelen auf ihrem Weg in den Hades
    zogen.
  it: >-
    Una gola di calcare e acque cristalline attraverso cui, secondo il mito, transitavano le anime dirette
