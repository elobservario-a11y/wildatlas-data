resumen:
  es: >-
    El legendario 'Río del Inframundo' en la mitología griega, un desfiladero turquesa con nacimientos
    kársticos helados a los pies de las montañas de Souli.
  en: >-
    The mythical 'River of the Underworld' in Greek mythology, a turquoise defile with icy karst springs
    beneath the Souli mountains.
  fr: >-
    La mythique « Rivière des Enfers », un défilé turquoise aux sources karstiques glacées au pied des
    montagnes de Souli.
  de: >-
    Der legendäre 'Fluss der Unterwelt' der griechischen Mythologie, eine türkisfarbene Schlucht mit eiskalten
    Karstquellen am Fuße der Souli-Berge.
  it: >-
    Il leggendario 'Fiume degli Inferi' nella mitologia greca, una forra turchese con gelide sorgenti carsiche
    ai piedi dei monti di Souli.
  pt: >-
    O lendário 'Rio do Submundo' na mitologia grega, um desfiladeiro turquesa com nascentes cársticas geladas
    aos pés dos montes de Souli.
