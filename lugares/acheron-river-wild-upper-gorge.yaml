  pt: >-
    Uma garganta de calcário e águas cristalinas por onde, segundo o mito, passavam as almas a caminho do
    Hades.
observaciones:
  es: >-
    El tramo de sendero se alterna con pista y con carretera: lleva calzado cómodo para los tres tipos de
    suelo y reserva unas tres horas para toda la ruta.
texto:
  es:
    intro: >-
      Según la mitología griega, por aquí se entraba al inframundo. El Aqueronte, el río por el que Caronte
      cruzaba a las almas, es un río real del Epiro, en el noroeste del país, de cincuenta y dos kilómetros:
      nace cerca de Zotiko, en el suroeste de la unidad regional de Ioánina, y desemboca en el mar Jónico en
      Ammoudia, cerca de Parga. En su tramo de garganta, los Estrechos del Aqueronte, el agua ha tallado
      durante milenios la caliza y ha dejado acantilados escarpados, aguas claras y una vegetación de ribera
      densa.
    landscape: >-
      Los acantilados, el agua cristalina y la vegetación densa de ribera forman un ecosistema de excepcional
      valor ecológico. El pueblo de Glyki se levanta junto a la ribera, con una historia que va del periodo
      helenístico al bizantino; hoy es el punto de partida para explorar el entorno del río y un destino de
      actividades de naturaleza.


      Al entrar en el desfiladero, el río se encaja entre las paredes. En lo alto de la ladera, a la derecha,
      se distingue la llamada Skala de Tzavelaina: un paso audaz abierto, según una versión de la tradición
      local, por orden de Moscho, la esposa de Lambros Tzavelas, con los artesanos trabajando colgados de los
      riscos.
    wildlife: >-
      La garganta es refugio de especies protegidas: el [lobo](/especie/canis_lupus/), la [nutria
      europea](/especie/lutra_lutra/) y la rana arbórea europea (Hyla arborea). En el agua viven peces de
      interés como el killi mediterráneo (Aphanius fasciatus) y el piscardo jónico (Phoxinellus
      pleurobipunctatus). Todo el conjunto forma parte de la red europea Natura 2000.
    visit: >-
      La ruta de referencia une Glyki, los manantiales del Aqueronte, el puente de Dala, la aldea de Samonida
      y el castillo de Kiafa. Mide casi ocho kilómetros, de los que 3.400 metros son sendero, 1.789 son pista
      de tierra y 2.800 son carretera, y se hace en unas tres horas. Son tres tramos de una hora cada uno. El
      de Dala a Samonida tiene 1,44 km de sendero y 1,79 km de pista, y enlaza con los senderos del municipio
      vecino de Parga.


      Después del puente de Dala, la subida a las aldeas históricas de Souli cambia por completo el paisaje.
      La ruta termina en el castillo de Kiafa, desde donde se ve Souli y, enfrente, el monte Kougi. El
      municipio de Souli restauró en total cuatro rutas de senderismo con valores ecológicos, paisajísticos y
      culturales, y mantiene diecisiete kilómetros de senderos abiertos al público.
    history: >-
      Al cruzar la garganta se pasa, según la tradición, junto a las Puertas del Hades, donde las almas subían
      a la barca de Caronte; cerca de Parga están además las ruinas del Necromanteion, el oráculo de los
      muertos. El Aqueronte se llamó a veces «río del dolor».


      La historia más reciente es la de los soulíotas. El puente de Dala les dio durante siglos un cruce
      seguro sobre el torrente Tsaggariotiko, y toma el nombre del molino de Dala, cuyas ruinas siguen debajo.
      Samonida fue uno de los asentamientos históricos de Souli. Tras la rendición de Souli en 1803, Alí Pachá
      levantó el castillo de Kiafa para controlar la región e impedir su regreso.


      La restauración de las cuatro rutas se financió con el Mecanismo de Recuperación y Resiliencia, a través
      del Programa de Inversión Pública del Ministerio de Medio Ambiente y Energía.
    before: >-
      El tramo de sendero se alterna con pista y con carretera: lleva calzado cómodo para los tres tipos de
      suelo y reserva unas tres horas para toda la ruta.
    around: >-
      En el atlas el Aqueronte no tiene vecinos cercanos. Comparten con él el paisaje de garganta, río y karst
      el [Parque Natural del Alvão](/lugar/parque-natural-do-alvao/), las [Gargantas del Río
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), el [Alto Valle del Río
      Ain](/lugar/haute-vallee-de-l-ain/) y los [Valles Kársticos de Prosiecka y
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/); el Alvão y los valles eslovacos comparten además
      la nutria.
  en:
    intro: >-
      According to Greek mythology, this was the gateway to the underworld. The Acheron, the legendary stream
      across which Charon ferried departing souls, is an actual river fifty-two kilometers long in
      northwestern Greece: it springs near Zotiko in southwestern Ioannina regional unit and discharges into
      the Ionian Sea at Ammoudia near Parga. Along its canyon section—the Straits of the Acheron—the river has
      carved limestone crags over millennia, leaving sheer cliffs, pellucid waters, and dense riparian
      woodlands.
    landscape: >-
      The vertical limestone cliffs, crystalline water, and dense riparian canopy form an ecosystem of
      exceptional ecological value. The village of Glyki sits right along the riverbanks, with a storied
      history spanning Hellenistic to Byzantine times; today it serves as the launching pad for riverside
      exploration and nature outings.


      Venture into the defile, and the river narrows between precipitous walls. High up the right cliff face
      appears the celebrated Skala of Tzavelaina: a daring path carved out, according to local tradition,
      under the orders of Moscho, wife of chieftain Lambros Tzavelas, with masons suspended along the cliffs
      on ropes.
    wildlife: >-
      The gorge provides refuge for protected wildlife, including the [grey wolf](/especie/canis_lupus/), the
      [Eurasian otter](/especie/lutra_lutra/), and the European tree frog (Hyla arborea). The aquatic currents
      shelter species of conservation interest such as the Mediterranean killifish (Aphanius fasciatus) and
      the Ionian minnow (Phoxinellus pleurobipunctatus). The entire mountain corridor is safeguarded within
      the European Natura 2000 network.
    visit: >-
      The benchmark hiking trail connects Glyki, the Acheron springs, Dala Bridge, the mountain hamlet of
      Samonida, and Kiafa Castle. It measures almost eight kilometers—incorporating 3,400 meters of footpath,
      1,789 meters of unpaved track, and 2,800 meters of road—taking about three hours to complete. The walk
      consists of three consecutive one-hour legs. The stretch from Dala Bridge to Samonida features 1.44 km
      of trail and 1.79 km of track, linking smoothly with hiking paths in neighboring Parga.


      Past Dala Bridge, the climb toward the historic villages of Souli completely alters the landscape. The
      route terminates at Kiafa Castle, commanding views across Souli and Mount Kougi opposite. In total, the
      municipality of Souli restored four thematic hiking trails celebrating ecological, scenic, and cultural
      values, maintaining seventeen kilometers of paths open to walkers.
    history: >-
      Traversing the gorge leads hikers past what ancient mythology deemed the Gates of Hades, where souls
      boarded Charon's ferry; near Parga stand the excavated ruins of the Necromanteion, the oracle of the
      dead. The Acheron was historically dubbed the «river of sorrow».


      More recent centuries were shaped by the fiercely independent Souliotes. For centuries, Dala Bridge
      provided them a reliable crossing over the rushing Tsaggariotiko torrent, taking its name from Dala Mill
      whose stone ruins linger beneath the arch. Samonida was one of the historical bastion settlements of
      Souli. Following the capitulation of Souli in 1803, Ottoman ruler Ali Pasha erected Kiafa Castle to
      garrison the region and prevent the mountaineers' return.


      The restoration of the four hiking routes was financed by the Recovery and Resilience Facility through
      the Public Investment Programme of the Ministry of Environment and Energy.
    before: >-
      The route alternates between footpath, dirt track, and paved road: wear comfortable shoes suited to all
      three surfaces and set aside roughly three hours for the full outing.
    around: >-
      The Acheron has no immediate neighbors in the atlas. Sharing its river gorge and limestone karst
      landscape are [Alvão Natural Park](/lugar/parque-natural-do-alvao/), the [Doubs River
      Gorges](/lugar/gorges-du-doubs---franco-suisses/), the [Haute Vallée de
      l'Ain](/lugar/haute-vallee-de-l-ain/), and the [Prosiecka and Kvačianska Karst
      Valleys](/lugar/npr-kvacianska-a-prosiecka-dolina/); Alvão and the Slovak valleys also share the otter.
  fr:
    intro: >-
      Selon la mythologie grecque, c'est ici que s'ouvrait l'entrée des Enfers. L'Achéron, le fleuve sur
      lequel Charon guidait les âmes des défunts, est un cours d'eau bien réel d'Épire, dans le nord-ouest de
      la Grèce, long de cinquante-deux kilomètres : il prend sa source près de Zotiko, au sud-ouest du
      district régional d'Ioannina, pour se jeter dans la mer Ionienne à Ammoudia, près de Parga. Dans sa
      partie resserrée — les Défilés de l'Achéron —, l'eau a taillé le calcaire durant des millénaires,
      laissant des falaises vertigineuses, des eaux translucides et une abondante végétation riveraine.
    landscape: >-
      Les falaises abruptes, les eaux cristallines et la ripisylve forment un écosystème d'une valeur
      écologique remarquable. Le village de Glyki s'étire le long de la rive, fort d'un passé qui va de
      l'époque hellénistique à l'Empire byzantin ; il sert aujourd'hui de point de départ pour explorer les
      rives du fleuve et pratiquer des activités de pleine nature.


      En pénétrant dans le défilé, le cours d'eau s'encaisse entre les parois. Tout en haut du versant droit
      apparaît la Skala de Tzavelaina : un sentier hardi taillé, selon la tradition locale, sur ordre de
      Moscho, épouse de Lambros Tzavelas, avec des ouvriers travaillant suspendus au-dessus du vide.
    wildlife: >-
      La gorge sert de refuge à des espèces protégées : le [loup gris](/especie/canis_lupus/), la [loutre
      d'Europe](/especie/lutra_lutra/) et la rainette verte (Hyla arborea). Dans les eaux vivent des poissons
      d'intérêt comme l'aphanius de Corse (Aphanius fasciatus) et le vairon ionien (Phoxinellus
      pleurobipunctatus). L'ensemble du site est intégré au réseau européen Natura 2000.
    visit: >-
      L'itinéraire de référence relie Glyki, les sources de l'Achéron, le pont de Dala, le hameau de Samonida
      et le château de Kiafa. Il compte près de huit kilomètres — 3 400 mètres de sentier, 1 789 mètres de
      piste en terre et 2 800 mètres de route — et se parcourt en environ trois heures. Il se découpe en trois
      tronçons d'une heure. De Dala à Samonida, on trouve 1,44 km de sentier et 1,79 km de piste, raccordés
      aux itinéraires de randonnée de la commune voisine de Parga.


      Après le pont de Dala, la montée vers les villages historiques de Souli transforme totalement le
      paysage. Le circuit s'achève au château de Kiafa, d'où la vue embrasse Souli et, en face, le mont Kougi.
      La commune de Souli a réhabilité quatre sentiers de randonnée thématiques aux valeurs écologiques,
      paysagères et culturelles, totalisant dix-sept kilomètres d'itinéraires ouverts au public.
    history: >-
      Franchir la gorge revenait, selon la tradition, à côtoyer les Portes de l'Hadès où les âmes montaient
      sur la barque de Charon ; près de Parga subsistent en outre les vestiges du Nécromantéion, l'oracle des
      morts. L'Achéron fut aussi qualifié de « fleuve de la douleur ».


      L'histoire plus récente est marquée par l'épopée des Souliotes. Le pont de Dala leur assura pendant des
      siècles un passage sûr au-dessus du torrent Tsaggariotiko, tirant son nom du moulin de Dala dont les
      ruines subsistent sous l'arche. Samonida était l'un des villages historiques de Souli. Après la
      reddition de Souli en 1803, Ali Pacha fit ériger le château de Kiafa pour contrôler la région et
      empêcher le retour des insurgés.


      La restauration des quatre itinéraires pédestres a été financée par la Facilité pour la reprise et la
      résilience, dans le cadre du Programme d'investissements publics du ministère de l'Environnement et de
      l'Énergie.
    before: >-
      Le parcours alterne sentier de terre, piste et portion asphaltée : prévoyez des chaussures confortables
      adaptées à ces trois types de terrain et comptez environ trois heures pour réaliser l'ensemble de la
      sortie.
    around: >-
      Dans l'atlas, l'Achéron n'a pas de voisins immédiats. Partagent avec lui son profil de gorge, de rivière
      et de karst le [Parc naturel d'Alvão](/lugar/parque-natural-do-alvao/), les [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), la [Haute Vallée de
      l'Ain](/lugar/haute-vallee-de-l-ain/) et les [Vallées karstiques de Prosiecka et
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) ; l'Alvão et les vallées slovaques partagent
      également la loutre.
  de:
    intro: >-
      Der griechischen Mythologie zufolge lag hier der Eingang zur Unterwelt. Der Acheron, der mythische
      Strom, auf dem Charon die Seelen der Toten übersetzte, ist ein realer Fluss in Epirus im Nordwesten des
      Landes mit zweiundfünfzig Kilometern Länge: Er entspringt nahe Zotiko im Südwesten des Regionalbezirks
      Ioannina und mündet bei Ammoudia nahe Parga ins Ionische Meer. In seinem Klammabschnitt, den Meerengen
      des Acheron, hat das Wasser über Jahrtausende den Kalkstein zersägt und steile Felswände, glasklares
      Wasser und dichte Auenwälder geschaffen.
    landscape: >-
      Die steilen Felsen, das glasklare Wasser und der dichte Uferwald bilden ein Ökosystem von herausragendem
      ökologischem Wert. Das Dorf Glyki schmiegt sich an das Flussufer und blickt auf eine Siedlungsgeschichte
      zurück, die von hellenistischer bis in byzantinische Zeit reicht; heute dient es als Ausgangspunkt zur
      Erkundung des Flusses und für Outdoor-Aktivitäten.


      Beim Eintritt in die Schlucht schnürt sich das Tal zwischen den Felswänden ein. Hoch oben an der rechten
      Flanke zeichnet sich die Skala von Tzavelaina ab: ein kühn in den Fels gehauener Pfad, der einer
      Überlieferung nach auf Geheiß von Moscho, der Gattin des Souliotenführers Lambros Tzavelas, von
      Handwerkern angelegt wurde, die an Seilen über den Abgründen hingen.
    wildlife: >-
      Die Schlucht bietet Zuflucht für geschützte Arten: [Wolf](/especie/canis_lupus/),
      [Fischotter](/especie/lutra_lutra/) und Laubfrosch (Hyla arborea). Im Fluss leben bemerkenswerte
      Fischarten wie der Mittelmeer-Zahnkärpfling (Aphanius fasciatus) und die Peloponnes-Elritze (Phoxinellus
      pleurobipunctatus). Der gesamte Talraum ist Teil des europäischen Schutzgebietsnetzes Natura 2000.
    visit: >-
      Die Hauptroute verbindet Glyki, die Acheron-Quellen, die Dala-Brücke, das Bergdorf Samonida und die
      Festung Kiafa. Sie ist fast acht Kilometer lang – davon 3.400 Meter Wanderpfad, 1.789 Meter
      Schotterpiste und 2.800 Meter Fahrstraße – und nimmt etwa drei Stunden Gehzeit in Anspruch. Die Tour
      gliedert sich in drei Abschnitte von je einer Stunde. Das Teilstück von Dala nach Samonida umfasst 1,44
      km Pfad und 1,79 km Piste und schließt an das Wegenetz der Nachbargemeinde Parga an.


      Hinter der Dala-Brücke verändert der Anstieg zu den historischen Dörfern von Souli das Landschaftsbild
      völlig. Die Wanderung endet an der Festung Kiafa mit Panoramablick über Souli und den gegenüberliegenden
      Berg Kougi. Die Gemeinde Souli hat insgesamt vier Wanderrouten unter ökologischen, landschaftlichen und
      kulturellen Gesichtspunkten instand gesetzt und betreut siebzehn Kilometer öffentlich zugängliche Wege.
    history: >-
      Wer die Schlucht durchquert, wandelt der Sage nach an den Toren des Hades vorbei, an denen die Seelen
      Charons Kahn bestiegen; unweit von Parga liegen zudem die Ruinen des Nekromanteion, des Orakels der
      Toten. Der Acheron wurde auch als «Fluss des Wehklagens» bezeichnet.


      Die jüngere Geschichte prägte der Freiheitskampf der Soulioten. Die Dala-Brücke bot ihnen
      jahrhundertelang einen sicheren Übergang über den Tsaggariotiko-Wildbach; sie trägt den Namen der
      Dala-Mühle, deren Mauerreste unter dem Bogen liegen. Samonida zählte zu den historischen Kernsiedlungen
      Soulis. Nach der Kapitulation Soulis im Jahr 1803 ließ Ali Pascha die Festung Kiafa errichten, um die
      Region zu beherrschen und eine Rückkehr der Bewohner zu verhindern.


      Die Wiederherstellung der vier Wanderrouten wurde über die Aufbau- und Resilienzfazilität im Rahmen des
      Programms für öffentliche Investitionen des Ministeriums für Umwelt und Energie finanziert.
    before: >-
      Der Weg wechselt zwischen Wanderpfad, Schotterpiste und Asphaltstraße: Wähle bequemes Schuhwerk für alle
      drei Untergründe und plane rund drei Stunden für die gesamte Wanderung ein.
    around: >-
      Im Atlas hat der Acheron keine direkten Nachbarn. Das Landschaftsbild aus Schlucht, Fluss und Karst
      teilen der [Naturpark Alvão](/lugar/parque-natural-do-alvao/), die
      [Doubs-Schluchten](/lugar/gorges-du-doubs---franco-suisses/), das [Obere
      Ain-Tal](/lugar/haute-vallee-de-l-ain/) und die [Karsttäler Prosiecka und
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/); Alvão und die slowakischen Täler teilen zudem
      das Vorkommen des Fischotters.
  it:
    intro: >-
      Secondo la mitologia greca, da qui si accedeva al regno degli inferi. L'Acheronte, il fiume attraverso
      cui Caronte traghettava le anime dei defunti, è un corso d'acqua reale dell'Epiro, nel nord-ovest della
      Grecia, lungo cinquantadue chilometri: nasce vicino a Zotiko, nella parte sud-occidentale dell'unità
      periferica di Giannina, e sfocia nel Mar Ionio ad Ammoudia, nei pressi di Parga. Nel suo tratto più
      aspro, gli Stretti dell'Acheronte, la corrente ha modellato per millenni il calcare, creando rupi
      scoscese, acque trasparenti e una fitta vegetazione ripariale.
    landscape: >-
      Le pareti dirupate, l'acqua cristallina e la densa vegetazione di sponda compongono un ecosistema di
      eccezionale pregio ecologico. Il villaggio di Glyki sorge lungo la riva, con una storia che spazia
      dall'età ellenistica all'epoca bizantina; oggi funge da base privilegiata per esplorare il fiume e
      praticare attività all'aria aperta.


      Inoltrandosi nella forra, il corso d'acqua si serra tra pareti a picco. In alto sulla parete destra
      compare la cosiddetta Skala di Tzavelaina: un ardito sentiero intagliato nella roccia per ordine,
      secondo la memoria locale, di Moscho, consorte di Lambros Tzavelas, con gli artigiani al lavoro sospesi
      sopra il vuoto.
    wildlife: >-
      La gola costituisce rifugio per specie protette: il [lupo](/especie/canis_lupus/), la [lontra
      europea](/especie/lutra_lutra/) e la raganella europea (Hyla arborea). Nelle acque limpide vivono pesci
      d'interesse conservazionistico come il nono mediterraneo (Aphanius fasciatus) e la sanguinerola ionica
      (Phoxinellus pleurobipunctatus). L'intero comprensorio rientra nella rete ecologica europea Natura 2000.
    visit: >-
      L'itinerario classico collega Glyki, le sorgenti dell'Acheronte, il ponte di Dala, il villaggio montano
      di Samonida e il castello di Kiafa. Si sviluppa per quasi otto chilometri — di cui 3.400 metri di
      sentiero, 1.789 metri di sterrato e 2.800 metri di strada asfaltata — richiedendo circa tre ore di
      cammino. È articolato in tre tratte da un'ora ciascuna. Il tratto dal ponte di Dala a Samonida conta
      1,44 km di sentiero e 1,79 km di pista sterrata, connettendosi con la rete sentieristica del limitrofo
      comune di Parga.


      Superato il ponte di Dala, la risalita verso i borghi storici di Souli trasforma del tutto lo scenario.
      Il percorso culmina al castello di Kiafa, da cui lo sguardo spazia su Souli e sull'antistante monte
      Kougi. Il comune di Souli ha recuperato quattro percorsi escursionistici tematici di pregio
      naturalistico e culturale, gestendo diciassette chilometri di tracciati aperti al pubblico.
    history: >-
      Attraversare la gola significava, nella tradizione antica, lambire le Porte dell'Ade, dove le ombre
      salivano sulla barca di Caronte; vicino a Parga sorgono inoltre le rovine del Necromanteion, l'oracolo
      dei morti. L'Acheronte venne sovente appellato come «fiume del dolore».


      Le vicende più vicine a noi sono legate alla resistenza dei Sulioti. Il ponte di Dala garantì per secoli
      un varco sicuro sul torrente Tsaggariotiko, prendendo nome dal mulino di Dala i cui ruderi emergono
      sotto l'arcata. Samonida fu uno dei capisaldi storici di Souli. Dopo la resa di Souli nel 1803, Alì
      Pascià fece erigere la fortezza di Kiafa per presidiare il territorio ed evitare il rientro dei
      montanari.


      Il restauro delle quattro rotte escursionistiche è stato cofinanziato dal Dispositivo per la ripresa e
      la resilienza tramite il Programma di investimenti pubblici del Ministero dell'Ambiente e dell'Energia.
    before: >-
      Il tragitto alterna sentiero, pista sterrata e strada asfaltata: indossa calzature comode adatte a ogni
      fondo e prevedi circa tre ore per compiere l'intera escursione.
    around: >-
      Nell'atlante l'Acheronte non presenta luoghi vicini. Condividono il profilo di gola, corso d'acqua e
      carsismo il [Parco Naturale di Alvão](/lugar/parque-natural-do-alvao/), le [Gole del Fiume
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), l'[Alta Valle del Fiume
      Ain](/lugar/haute-vallee-de-l-ain/) e le [Valli Carsiche di Prosiecka e
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/); Alvão e le valli slovacche condividono anche la
      presenza della lontra.
  pt:
    intro: >-
      Segundo a mitologia grega, era por aqui que se acedia ao submundo. O Aqueronte, o rio por onde Caronte
      transportava as almas dos mortos, é um curso de água bem real do Épiro, no noroeste grego, com cinquenta
      e dois quilómetros: nasce próximo de Zotiko, no sudoeste da unidade regional de Ioannina, e desagua no
      mar Jónico em Ammoudia, perto de Parga. No seu setor mais apertado — os Estreitos do Aqueronte —, o rio
      talhou durante milénios o calcário, deixando escarpas verticais, águas límpidas e densos bosques
      ripícolas.
    landscape: >-
      As escarpas rochosas, a água translúcida e a densa vegetação marginal conformam um ecossistema de
      excecional relevância ecológica. A povoação de Glyki ergue-se à beira da água, com uma história que
      recua desde o período helenístico ao bizantino; hoje serve de ponto de partida para explorar o rio e
      praticar desportos de natureza.


      Ao entrar no desfiladeiro, a corrente aperta-se entre paredões abruptos. Bem no alto da encosta direita
      avista-se a célebre Skala de Tzavelaina: uma vereda vertiginosa rasgada na rocha, segundo a memória
      local, por ordem de Moscho, mulher do herói Lambros Tzavelas, com operários a trabalhar suspensos em
      cordas sobre o abismo.
    wildlife: >-
      O desfiladeiro é refúgio de espécies protegidas: o [lobo](/especie/canis_lupus/), a
      [lontra-europeia](/especie/lutra_lutra/) e a rela-comum (Hyla arborea). Nas águas nadam peixes de
      elevado valor conservacionista como o peixe-das-águas-doces (Aphanius fasciatus) e o boga-do-iónico
      (Phoxinellus pleurobipunctatus). Toda a área integra a rede europeia Natura 2000.
    visit: >-
      O itinerário principal liga Glyki, as nascentes do Aqueronte, a ponte de Dala, a aldeia serrana de
      Samonida e o castelo de Kiafa. Estende-se por quase oito quilómetros — dos quais 3.400 metros em trilho
      pedestre, 1.789 metros em caminho de terra e 2.800 metros em estrada —, demorando cerca de três horas a
      percorrer. Divide-se em três etapas de uma hora. O troço de Dala a Samonida soma 1,44 km de senda e 1,79
      km de pista, ligando aos trilhos do município vizinho de Parga.


      Após a ponte de Dala, a subida às aldeias históricas de Souli altera por completo o panorama. O passeio
      culmina no castelo de Kiafa, com vistas desafogadas sobre Souli e o monte Kougi em frente. O município
      de Souli recuperou quatro percursos pedestres com valores ecológicos, paisagísticos e patrimoniais,
      mantendo dezassete quilómetros de caminhos abertos ao público.
    history: >-
      Cruzar o desfiladeiro significava, na mitologia antiga, passar junto às Portas do Hades, onde as almas
      embarcavam no batel de Caronte; perto de Parga encontram-se ainda as ruínas do Necromanteion, o oráculo
      da morte. O Aqueronte foi também alcunhado de «rio da dor».


      A história mais recente ficou marcada pela epopeia dos suliotas. A ponte de Dala assegurou durante
      séculos uma travessia sólida sobre a torrente Tsaggariotiko, herdando o nome do moinho de Dala cujas
      ruínas resistem sob o arco. Samonida foi um dos povoados históricos de Souli. Após a capitulação de
      Souli em 1803, Ali Paxá ergueu a fortaleza de Kiafa para dominar a serra e impedir o regresso dos
      habitantes.


      A requalificação dos quatro itinerários pedestres foi financiada pelo Mecanismo de Recuperação e
      Resiliência, no âmbito do Programa de Investimento Público do Ministério do Ambiente e da Energia.
    before: >-
      O percurso combina caminho de pé posto, pista de terra batida e estrada asfaltada: calça sapatos
      confortáveis e adequados a estes três tipos de piso e reserva cerca de três horas para o passeio
      completo.
    around: >-
      No atlas o Aqueronte não tem vizinhos próximos. Partilham o mesmo perfil de garganta, rio e relevo
      cárstico o [Parque Natural do Alvão](/lugar/parque-natural-do-alvao/), as [Gargantas do Rio
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), o [Alto Vale do Rio
      Ain](/lugar/haute-vallee-de-l-ain/) e os [Vales Cársticos de Prosiecka e
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/); o Alvão e os vales eslovacos partilham também a
      lontra.
