resumen:
  es: La 'Amazonia polaca', un río anastomosado único en Europa compuesto por decenas de cauces entrelazados.
  en: >-
    The 'Polish Amazon', a rare anastomosing river system composed of dozens of braided and interconnected
    channels.
  fr: L'« Amazonie polonaise », un fleuve anastomosé unique en Europe composé de dizaines de bras entrelacés.
  de: >-
    Der „polnische Amazonas“, ein in Europa einmaliges anastomosierendes Flusssystem aus Dutzenden verzweigten
    Flussarmen.
  it: >-
    L'«Amazzonia polacca», un raro fiume anastomizzato unico in Europa composto da decine di corsi d'acqua
    intrecciati.
  pt: >-
    A 'Amazónia polaca', um raro rio anastomosado único na Europa composto por dezenas de braços fluviais
    entrelaçados.
unico:
  es: >-
    Un río que se multiplica en un laberinto de cauces, con una pasarela de madera y pontones flotantes que se
    cruzan tirando de una cadena.
  en: >-
    A river that branches into an intricate maze of waterways, explored via wooden boardwalks and self-service
    floating pontoon ferries hauled by chains.
  fr: >-
    Une rivière qui se ramifie en un dédale aquatique, sillonnée par une passerelle sur pilotis et des bacs à
    chaîne manuels pour passer d'une île à l'autre.
  de: >-
    Ein Fluss, der sich in ein Labyrinth von Wasserläufen auffächert, erschlossen durch Holzstege und
    handbetriebene Kettenfähren zur Flussquerung.
  it: >-
    Un fiume che si dirama in un fitto labirinto di canali, percorribile grazie a passerelle in legno e
    pontili galleggianti azionati a catena.
  pt: >-
    Um rio que se ramifica num labirinto aquático, percorrido por passadiços de madeira e barcas móveis
    acionadas manualmente por correntes.
observaciones:
  es: >-
    La pasarela puede cerrarse temporalmente cuando el tiempo o el nivel del agua ponen en peligro a los
    visitantes. Si el nivel del Narew es demasiado bajo, los pontones flotantes se cierran y no se puede
    cruzar a la otra orilla. En el parque no se permiten embarcaciones de motor de combustión.
texto:
  es:
    intro: >-
      Si cuentas los cauces del Narew en el parque, te pierdes. El río no corre por uno, sino por muchos, que
      se juntan y se separan y forman una red de brazos entre islas apenas más altas que el agua. Es un río
      anastomosado, una rareza, y el parque nacional creado en 1996 en el nordeste de Polonia, en Podlaquia,
      protege justo ese tramo del valle: unos 50 km entre Suraż y Rzędziany, de 2 a 4 km de ancho. Casi todo
      se ve mejor desde el agua, y no es casualidad que la web del parque recomiende recorrerlo en kayak.
    landscape: >-
      El Narew forma en el parque un mosaico de remansos, hábitats terrestres y pantanosos que le da su
      carácter único. Entre los cauces hay islas que apenas se elevan sobre el agua y que se inundan en las
      crecidas; suele haber una sola crecida al año, la del deshielo, y de ahí que el paisaje cambie tanto de
      una estación a otra.


      La vegetación sigue el mismo reparto. Hay 58 comunidades vegetales, y predominan las de pantano: grandes
      cárices y carrizales. En los bordes aparecen prados, alisedas y sauzales, y la distribución actual es
      fruto de la gestión tradicional de los prados. Los cárices y los carrizales conviven con unas 500
      especies de plantas vasculares, entre ellas el nenúfar blanco, el rocío de sol de hoja redonda y varias
      orquídeas.
    wildlife: >-
      **Primavera.** Es la estación de las aves. A comienzos de primavera llegan bandadas migratorias de
      gansos y patos, en las praderas se observa el [combatiente](/especie/philomachus_pugnax/) y, cuando baja
      el agua, anidan las aves limícolas. En las tardes de primavera se oyen anfibios junto a la pasarela,
      entre ellos el [sapillo de vientre de fuego](/especie/bombina_bombina/). En el parque hay 13 especies de
      anfibios, con dos tritones, el común y el crestado.


      **Verano.** Las aves de carrizal son las protagonistas: el [avetoro](/especie/botaurus_stellaris/), el
      [guion de codornices](/especie/crex_crex/), el búho campestre y el [carricerín
      cejudo](/especie/acrocephalus_paludicola/) figuran entre las aves amenazadas a escala mundial o europea
      que registra el parque. De los tres aguiluchos presentes, el más numeroso es el [aguilucho
      lagunero](/especie/circus_aeruginosus/), y el [pigargo europeo](/especie/haliaeetus_albicilla/) es otra
      de las aves amenazadas del parque. En total, de 1979 a 2000 se registraron 203 especies de aves, 154 de
      ellas nidificantes.


      **Otoño.** Las grullas se congregan en otoño.


      **Todo el año.** Hay 34 especies de mamíferos, entre ellos [castor](/especie/castor_fiber/),
      [alce](/especie/alces_alces/), [ciervo](/especie/cervus_elaphus/),
      [corzo](/especie/capreolus_capreolus/) y [jabalí](/especie/sus_scrofa/). De las 21 especies de peces,
      tres están protegidas, y también la lamprea ucraniana. Las rutas migratorias de grandes mamíferos, como
      los alces, pasan por este valle. Entre los insectos, la mariposa diurna protegida strzępotek edypus vive
      aquí, en uno de solo tres puntos de Polonia.
    visit: >-
      **En kayak.** El sendero acuático «Narwiański Labirynt» mide 45 km y recorre todo el parque, de Suraż a
      Rzędziany; se hace en dos o tres días. Como el Narew es un río de muchos cauces, lo mejor es seguir el
      principal, el más ancho, para no perderse. Para una jornada corta está el circuito «Kajakiem wokół
      Kurowa», que sale y vuelve al embarcadero de Kurowo en dos variantes: el circuito corto mide 3,2 km y se
      hace en hasta hora y media, y el largo, 7,7 km, unas tres horas. El largo va casi siempre a
      contracorriente y se recomienda a kayakistas resistentes con niveles de agua relativamente altos. Cuando
      el agua baja, en verano seco y otoño, algunos tramos del Kurówka son muy difíciles por la densa
      vegetación acuática.


      **A pie.** La pasarela de Waniewo–Śliwno es un sendero natural de aproximadamente 1 km que cruza el
      Narew por una pasarela de madera. Lo más llamativo son los pontones flotantes que permiten cruzar los
      cauces del río: son de autoservicio, se atrae el pontón con una cadena y se cruza tirando de la cadena
      del lado del agua. No se puede ir en bicicleta por la pasarela; hay que llevarla a pie.


      **Torres y miradores.** Hay torres de madera para la observación de la naturaleza en humedales, casi
      todas en los bordes del valle y conectadas por senderos de enlace. Están en Kurowo, en Waniewo (dos en
      medio de la pasarela y una municipal junto al río), en Suraż y en Kolonia Topilec.


      **Centro de visitantes.** El centro de educación ambiental Młynarzówka, en Kurowo, tiene una exposición
      multimedia sobre la naturaleza del valle, que lleva alrededor de una hora. Empieza con un breve vídeo
      sobre el origen del valle del Narew y sigue por nueve puestos con maqueta, acuario y diorama. La
      presentación «Poranek nad Narwią» muestra lo que se puede ver al amanecer sobre el río, y la exposición
      enseña además el mundo de los castores y compara el uso antiguo y actual del valle.
    history: >-
      El parque nacional se creó el 1 de julio de 1996. Su rasgo más particular es la propiedad de la tierra:
      solo 20.57 km² son de propiedad estatal, y el resto se reparte en 12,000 parcelas privadas, sobre todo
      de pequeños agricultores. La gestión tradicional de los prados es lo que dio al valle su vegetación
      actual.


      Del pasado quedan huellas visibles. Cerca de Kurowo se ven los estribos del puente derribado de la
      antigua carretera Białystok-Varsovia, excelentes miradores en las inundaciones de primavera. La sede del
      parque estuvo veinte años en una casa señorial del siglo XIX en Kurowo, antes de pasar a Młynarzówka.
    before: >-
      La pasarela puede cerrarse temporalmente cuando el tiempo o el nivel del agua ponen en peligro a los
      visitantes. Si el nivel del Narew es demasiado bajo, los pontones flotantes se cierran y no se puede
      cruzar a la otra orilla. En el parque no se permiten embarcaciones de motor de combustión.
    around: >-
      A dieciocho kilómetros queda el [Parque Paisajístico del Bosque de
      Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) y a 19 km el [Parque Nacional de
      Biebrza](/lugar/biebrzanski-park-narodowy/). Lejos, el [Parque Paisajístico del Valle del Bajo
      Oder](/lugar/park-krajobrazowy-dolina-dolnej-odry/) comparte con el Narew el aguilucho cenizo y el
      castor, y como el Narew es un valle fluvial de humedales.
  en:
    intro: >-
      If you try to count the channels of the Narew within the park, you quickly lose count. The river does
      not flow along a single bed, but splits into countless arms that divide and rejoin, forming an intricate
      aquatic network among low-lying marsh islands barely higher than the water level. It is an anastomosing
      river, an extraordinary hydrological rarity, and the national park founded in 1996 in Podlasie,
      north-eastern Poland, protects precisely this valley stretch: roughly 50 km between Suraż and Rzędziany,
      spanning 2 to 4 km in width. Almost everything is best appreciated from water level, which is why the
      park authorities actively encourage exploring by kayak.
    landscape: >-
      The Narew shapes an extraordinary mosaic of backwaters, river channels, reed islands and marsh habitats
      that gives the valley its unique character. Between channels lie peat islands that barely rise above
      water level and submerge completely during spring inundations; typically only a single annual flood
      occurs during the spring thaw, which is why the landscape changes so dramatically from season to season.


      Vegetation mirrors this aquatic zoning. Botanists have identified 58 plant associations, dominated by
      wetland communities: extensive sedge marshes and dense reedbeds. Along valley margins appear wet hay
      meadows, alder carrs and willow scrub, shaped by generations of traditional mowing. These marshes
      shelter some 500 species of vascular plants, including the white waterlily, round-leaved sundew and
      various native wild orchids.
    wildlife: >-
      Spring is the season of birds. In early spring, large flocks of migrating geese and dabbling ducks
      arrive; damp meadows host displaying [ruffs](/especie/philomachus_pugnax/) and, as floodwaters recede,
      wading birds begin nesting. On mild spring evenings, amphibian choruses ring out from boardwalk margins,
      featuring the [European fire-bellied toad](/especie/bombina_bombina/). The park supports 13 amphibian
      species, including both common and great crested newts.


      Summer brings reedbed specialists to prominence: the [Eurasian bittern](/especie/botaurus_stellaris/),
      [corncrake](/especie/crex_crex/), short-eared owl and [aquatic
      warbler](/especie/acrocephalus_paludicola/) figure prominently among globally or European-threatened
      birds inhabiting the park. Of three harrier species present, the [marsh
      harrier](/especie/circus_aeruginosus/) is most abundant, while the majestic [white-tailed
      eagle](/especie/haliaeetus_albicilla/) also patrols the valley. Between 1979 and 2000, ornithologists
      documented 203 bird species here, 154 of which breed locally.


      Autumn is marked by gathering cranes that stage in the marshes before migrating.


      Year-round, the valley supports 34 mammal species, including Eurasian [beaver](/especie/castor_fiber/),
      [elk](/especie/alces_alces/), [red deer](/especie/cervus_elaphus/), [roe
      deer](/especie/capreolus_capreolus/) and [wild boar](/especie/sus_scrofa/). Among 21 fish species, three
      are strictly protected alongside the Ukrainian brook lamprey. Major wildlife migration routes for large
      mammals, especially elks, traverse this wetland corridor. Among insects, the protected false ringlet
      butterfly (*Coenonympha oedippus*) survives here, at one of only three known localities in Poland.
    visit: >-
      By kayak, the designated water trail 'Narwiański Labirynt' stretches 45 km across the entire national
      park from Suraż to Rzędziany, typically covered over two to three days. Because the Narew branches into
      countless side arms, paddlers should follow the main, widest stream to avoid disorientation. For a
      half-day paddle, the loop 'Kajakiem wokół Kurowa' departs and returns to Kurowo landing stage with two
      options: the shorter route measures 3.2 km taking up to an hour and a half, while the longer circuit
      covers 7.7 km in roughly three hours. The longer circuit runs largely upstream and is recommended for
      experienced kayakers when water levels are adequate. In dry summers and autumn, low water makes sections
      of the Kurówka stream challenging due to dense submerged weeds.


      On foot, the Waniewo–Śliwno boardwalk forms a nature trail of approximately 1 km spanning the river
      basin over wooden decking. Its most celebrated feature is the series of hand-pulled floating pontoon
      ferries that cross river channels: visitors pull themselves across using steel chains. Bicycles may not
      be ridden across the boardwalk; they must be pushed on foot.


      Timber observation towers are positioned across the wetlands, primarily along valley margins and linked
      by walking trails, located in Kurowo, Waniewo, Suraż and Kolonia Topilec.


      The Młynarzówka Environmental Education Centre in Kurowo houses an interactive exhibition that takes
      about an hour to explore, featuring dioramas, an aquarium and a short orientation film explaining the
      origins of the river valley.
    history: >-
      The national park was formally gazetted on 1 July 1996. Its most distinctive organizational feature is
      land ownership: only 20.57 km² belong to the state, while the remainder is divided into some 12,000
      private agricultural parcels owned by local smallholders. Centuries of traditional meadow mowing and
      grazing created the unique open vegetation of the valley.


      Historic vestiges dot the landscape: near Kurowo stand the stone abutments of a destroyed bridge from
      the historic Białystok–Warsaw post road, now serving as panoramic viewpoints during spring floods. The
      park headquarters were housed for twenty years in a XIX century manor house in Kurowo before moving to
      the modern Młynarzówka complex.
    before: >-
      The boardwalk may close temporarily during severe weather or dangerous water levels. When water levels
      drop excessively, the pontoon ferries are locked and crossing is suspended. Motorized watercraft with
      internal combustion engines are strictly banned throughout the national park.
    around: >-
      Eighteen kilometres away lies the [Knyszyn Forest Landscape
      Park](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) and 19 km away is [Biebrza National
      Park](/lugar/biebrzanski-park-narodowy/). Further away, the [Lower Oder Valley Landscape
      Park](/lugar/park-krajobrazowy-dolina-dolnej-odry/) shares with the Narew the Montagu's harrier and
      beaver, being likewise a magnificent lowland river valley wetland.
  fr:
    intro: >-
      Si vous tentez de dénombrer les bras de la Narew dans le parc, vous vous y perdrez rapidement. La
      rivière ne s'écoule pas dans un lit unique, mais se scinde en un lacis inextricable de chenaux qui se
      croisent et s'écartent entre des îlots marécageux à fleur d'eau. C'est un cours d'eau anastomosé, une
      rareté hydrographique d'exception, et le parc national créé en 1996 en Podlachie, dans le nord-est de la
      Pologne, protège précisément ce tronçon de vallée : environ 50 km de Suraż à Rzędziany, sur 2 à 4 km de
      large. Tout s'y découvre idéalement depuis l'eau, et le parc préconise tout naturellement la découverte
      en kayak.
    landscape: >-
      La Narew façonne dans le parc une mosaïque de bras morts, de chenaux actifs, d'îles de tourbe et de
      roselières qui lui confère son identité singulière. Entre les bras d'eau émergent des langues de terre
      basses qui sont entièrement submergées lors des crues printanières ; il n'y a généralement qu'une seule
      grande crue annuelle, lors de la fonte des neiges, ce qui explique la spectaculaire métamorphose du
      paysage au fil des saisons.


      La flore épouse cette stratification humide. Les botanistes dénombrent 58 groupements végétaux, dominés
      par les milieux palustres : magnocariçaies et roselières denses. En lisière apparaissent des prairies
      humides fauchées, des aulnaies et des saulaies résultant de pratiques pastorales séculaires. Ces
      cariçaies abritent près de 500 espèces de plantes vasculaires, parmi lesquelles le nénuphar blanc, le
      droséra à feuilles rondes et diverses orchidées sauvages.
    wildlife: >-
      Le printemps appartient sans conteste aux oiseaux. Dès le dégel arrivent des nuées d'oies et de canards
      migrateurs ; sur les prairies détrempées paradent les [combattants variés](/especie/philomachus_pugnax/)
      et, dès la décrue, les limicoles entament leur nidification. Lors des tièdes soirées printanières
      résonnent les chants des amphibiens aux abords des pontons, notamment le [sonneur à ventre de
      feu](/especie/bombina_bombina/). Le parc abrite 13 espèces d'amphibiens, dont les tritons ponctué et
      crêté.


      L'été met à l'honneur les oiseaux paludicoles : le [butor étoilé](/especie/botaurus_stellaris/), le
      [râle des genêts](/especie/crex_crex/), le hibou des marais et le [phragmite
      aquatique](/especie/acrocephalus_paludicola/) figurent parmi les espèces rares ou menacées au niveau
      mondial protégées ici. Des trois busards recensés, le [busard des roseaux](/especie/circus_aeruginosus/)
      est le plus abondant, tandis que le [pygargue à queue blanche](/especie/haliaeetus_albicilla/) chasse
      également sur ces marais. De 1979 à 2000, le parc a dénombré 203 espèces d'oiseaux, dont 154 nicheuses.


      En automne, les grues cendrées se rassemblent en dortoirs spectaculaires au milieu des marais.


      Toute l'année, la vallée abrite 34 espèces de mammifères, dont le [castor](/especie/castor_fiber/)
      d'Eurasie, l'[élan](/especie/alces_alces/), le [cerf élaphe](/especie/cervus_elaphus/), le
      [chevreuil](/especie/capreolus_capreolus/) et le [sanglier](/especie/sus_scrofa/). Parmi les 21 espèces
      piscicoles, trois sont rigoureusement protégées ainsi que la lamproie ukrainienne. Les corridors de
      déplacement des grands mammifères, en particulier des élans, empruntent cet axe alluvial. Parmi les
      insectes, le papillon protégé fadet des laîches survit ici, dans l'un des trois seuls sites connus en
      Pologne.
    visit: >-
      En kayak, le sentier nautique balisé « Narwiański Labirynt » totalise 45 km à travers tout le parc entre
      Suraż et Rzędziany, se parcourant en deux à trois jours. Le fleuve se divisant en une multitude de bras,
      il est vivement conseillé de suivre le chenal principal pour ne pas s'égarer. Pour une boucle de
      quelques heures, le circuit « Kajakiem wokół Kurowa » part de l'embarcadère de Kurowo : la version
      courte de 3,2 km s'effectue en une heure et demie, tandis que le grand parcours de 7,7 km demande
      environ trois heures. Cette longue boucle s'effectue largement à contre-courant et requiert un bon
      niveau physique ainsi qu'un niveau d'eau suffisant. En période d'étiage estival, certains passages de la
      rivière Kurówka deviennent difficiles en raison de la végétation aquatique dense.


      À pied, la passerelle en bois de Waniewo–Śliwno constitue un sentier pédagogique d'environ 1 km reliant
      les deux rives au-dessus des marais. Sa particularité réside dans ses cinq pontons flottants manuels que
      les promeneurs manœuvrent eux-mêmes à l'aide de chaînes métalliques. Les vélos ne peuvent être
      enfourchés sur les platelages ; ils doivent obligatoirement être poussés à la main.


      Des belvédères et tours d'observation en bois ponctuent la vallée à Kurowo, Waniewo, Suraż et Kolonia
      Topilec.


      Le centre pédagogique Młynarzówka à Kurowo propose une muséographie interactive sur les milieux
      alluviaux, comprenant maquettes, aquariums et un film introductif.
    history: >-
      Le parc national a été officiellement instauré le 1er juillet 1996. Sa particularité foncière est
      remarquable : seuls 20.57 km² appartiennent à l'État, tandis que le reste du territoire se répartit en
      12,000 parcelles agricoles privées exploitées par des agriculteurs locaux. C'est l'entretien
      traditionnel des prairies de fauche qui a façonné le profil végétal actuel de la vallée.


      Des vestiges jalonnent le cours d'eau : près de Kurowo se dressent les culées en pierre de l'ancien pont
      de la route historique Białystok–Varsovie. Le siège du parc est resté établi pendant vingt ans dans un
      manoir du XIXe siècle à Kurowo avant d'emménager dans le complexe moderne de Młynarzówka.
    before: >-
      La passerelle peut être temporairement fermée en cas de coup de vent violent ou de crues excessives.
      Lors des étiages sévères, les bacs à chaîne sont mis hors service pour protéger les fonds marécageux.
      Les embarcations à moteur thermique sont formellement prohibées dans l'ensemble du parc.
    around: >-
      À dix-huit kilomètres s'étend le [parc paysager de la forêt de
      Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) et à 19 km le [parc national de la
      Biebrza](/lugar/biebrzanski-park-narodowy/). Plus loin, le [parc paysager de la vallée de la basse
      Oder](/lugar/park-krajobrazowy-dolina-dolnej-odry/) partage avec la Narew le busard cendré et le castor
      au cœur d'une semblable vallée alluviale marécageuse.
  de:
    intro: >-
      Wenn du versuchst, die Flussarme der Narew im Nationalpark zu zählen, verlierst du schnell den
      Überblick. Der Fluss fließt nicht in einem einzigen Bett, sondern verzweigt sich in unzählige Arme, die
      sich trennen und wieder vereinigen und ein Geflecht zwischen flachen Sumpfinseln bilden. Es ist ein
      anastomosierender Fluss, eine hydrologische Seltenheit; der 1996 in Podlachien im Nordosten Polens
      gegründete Nationalpark schützt genau diesen Talabschnitt: rund 50 km zwischen Suraż und Rzędziany auf
      einer Breite von 2 bis 4 km. Nahezu alles lässt sich am besten vom Wasser aus erleben, weshalb die
      Parkverwaltung die Erkundung per Kajak empfiehlt.
    landscape: >-
      Die Narew bildet im Park ein Mosaik aus Altwassern, Flussläufen, Torfinseln und Röhrichten, das ihr den
      unverwechselbaren Charakter verleiht. Zwischen den Wasserläufen liegen flache Inseln, die kaum aus dem
      Wasser ragen und bei Frühjahrshochwassern vollständig überflutet werden; in der Regel gibt es nur ein
      großes Hochwasser im Jahr während der Schneeschmelze, weshalb sich die Landschaft im Jahreslauf
      grundlegend wandelt.


      Die Pflanzenwelt folgt dieser nassen Gliederung. 58 Pflanzengesellschaften wurden erfasst, dominiert von
      Sumpfbiotopen: Großseggenriede und dichte Röhrichte. An den Rändern dehnen sich Feuchtwiesen,
      Erlenbrüche und Weidengebüsche aus, geprägt von traditioneller Heunutzung. In diesen Sümpfen gedeihen
      rund 500 Gefäßpflanzenarten, darunter Weiße Seerose, Rundblättriger Sonnentau und seltene wilde
      Orchideen.
    wildlife: >-
      Das Frühjahr gehört den Vögeln. Gleich nach dem Frost treffen rastende Gänse und Enten ein; auf nassen
      Wiesen balzt der [Kampfläufer](/especie/philomachus_pugnax/), und mit sinkendem Wasserstand beginnen die
      Limikolen zu brüten. An milden Frühlingsabenden schallen Amphibienkonzerte über die Stege, angeführt von
      der [Rotbauchunke](/especie/bombina_bombina/). Der Park beherbergt 13 Amphibienarten, darunter Teich-
      und Kammmolch.


      Im Sommer treten Röhrichtbewohner hervor: [Rohrdommel](/especie/botaurus_stellaris/),
      [Wachtelkönig](/especie/crex_crex/), Sumpfohreule und der weltweit bedrohte
      [Seggenrohrsänger](/especie/acrocephalus_paludicola/). Von drei Weihenarten ist die
      [Rohrweihe](/especie/circus_aeruginosus/) am häufigsten, und auch der
      [Seeadler](/especie/haliaeetus_albicilla/) jagt über den Wasserflächen. Von 1979 bis 2000 wurden 203
      Vogelarten im Gebiet registriert, davon 154 Brutvögel.


      Im Herbst sammeln sich Scharen von Kranichen auf ihren Rastplätzen im Schilf.


      Ganzjährig leben 34 Säugetierarten im Tal, darunter [Biber](/especie/castor_fiber/),
      [Elch](/especie/alces_alces/), [Rothirsch](/especie/cervus_elaphus/),
      [Reh](/especie/capreolus_capreolus/) und [Wildschwein](/especie/sus_scrofa/). Unter den 21 Fischarten
      stehen drei unter partiellem Schutz, ebenso das Ukrainische Bachneunauge. Wichtige Wanderrouten großer
      Säugetiere wie des Elchs queren das Flusstal. Bei den Insekten lebt hier der geschützte
      Wald-Wiesenvögelchen-Schmetterling an einem von nur drei Fundorten in ganz Polen.
    visit: >-
      Auf dem Wasser misst der markierte Kajakwanderweg „Narwiański Labirynt“ 45 km durch den gesamten Park
      von Suraż bis Rzędziany und lässt sich in zwei bis drei Tagen paddeln. Da sich der Fluss vielfach
      verzweigt, empfiehlt es sich, dem breitesten Hauptstrom zu folgen. Für Tagestouren bietet sich die
      Rundstrecke „Kajakiem wokół Kurowa“ an: Die kurze Variante über 3,2 km dauert rund anderthalb Stunden,
      während die lange Runde über 7,7 km etwa drei Stunden in Anspruch nimmt. Der lange Bogen verläuft
      überwiegend stromaufwärts und setzt gute Ausdauer und passenden Wasserstand voraus. Bei sommerlichem
      Niedrigwasser erschwert dichter Wasserpflanzenwuchs das Fortkommen auf der Kurówka.


      Zu Fuß führt der Holzsteg Waniewo–Śliwno als Lehrpfad über rund 1 km durch das Flusstal. Seine
      Besonderheit sind fünf schwimmende Pontons, die Besucher mit Stahlketten selbst über die Flussarme
      ziehen. Fahrräder dürfen auf dem Steg nicht gefahren, sondern nur geschoben werden.


      Aussichtstürme aus Holz stehen in Kurowo, Waniewo, Suraż und Kolonia Topilec an markanten Punkten des
      Tals.


      Das Bildungszentrum Młynarzówka in Kurowo bietet eine interaktive Ausstellung über die Flusslandschaft
      mit Dioramen, Aquarien und einem Film über die Entstehung des Flusstals.
    history: >-
      Der Nationalpark wurde am 1. Juli 1996 gegründet. Seine größte Besonderheit liegt in den
      Besitzverhältnissen: Nur 20.57 km² befinden sich in Staatsbesitz, während die übrige Fläche auf rund
      12,000 private Parzellen bäuerlicher Kleinbesitzer verteilt ist. Die traditionelle Mahd schuf einst die
      offenen Wiesenflächen des Tals.


      Historische Relikte säumen die Narew: Nahe Kurowo stehen steinerne Brückenpfeiler der zerstörten
      Poststraße Białystok–Warschau, die im Frühjahr hervorragende Aussichtspunkte bieten. Der Verwaltungssitz
      des Parks war zwanzig Jahre lang in einem Gutshaus des XIX. Jahrhunderts in Kurowo untergebracht, bevor
      er ins Bildungszentrum Młynarzówka umzog.
    before: >-
      Der Holzsteg kann bei extremen Wetterlagen oder Hochwasser gesperrt werden. Bei zu starkem Niedrigwasser
      werden die Pontonfähren verriegelt. Motorboote mit Verbrennungsmotoren sind im gesamten Nationalpark
      strikt verboten.
    around: >-
      Achtzehn Kilometer entfernt erstreckt sich der [Landschaftspark
      Knyszyn-Urwald](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) und in 19 km der
      [Biebrza-Nationalpark](/lugar/biebrzanski-park-narodowy/). Weiter entfernt teilt der [Landschaftspark
      Unteres Odertal](/lugar/park-krajobrazowy-dolina-dolnej-odry/) Wiesenweihe und Biber mit der Narew,
      ebenfalls als weites Feuchtgebietstal geprägt.
  it:
    intro: >-
      Se provi a contare i rami del Narew nel parco, perdi ben presto il conto. Il fiume non scorre entro un
      unico alveo, ma si suddivide in innumerevoli bracci che si separano e si ricongiungono, intessendo una
      rete acquatica tra isolotti appena emergenti dalla corrente. È un fiume anastomizzato, autentica rarità
      idrografica; il parco nazionale istituito nel 1996 in Podlachia, nella Polonia nord-orientale, protegge
      proprio questo tratto vallivo: circa 50 km tra Suraż e Rzędziany, con un'ampiezza tra 2 e 4 km. Il
      paesaggio si apprezza appieno dall'acqua, motivo per cui l'ente parco raccomanda l'esplorazione in
      kayak.
    landscape: >-
      Nel parco il Narew forma un mosaico di lanche, canali vivi, banchi torbosi e canneti che conferisce alla
      valle un fascino inconfondibile. Tra i rami fluviali sorgono isole piatte che affiorano appena dal pelo
      dell'acqua e vengono sommerse durante le piene primaverili; di solito si verifica una sola grande piena
      annuale al disgelo, ragione per cui il paesaggio muta radicalmente col volgere delle stagioni.


      La copertura vegetale riflette questo gradiente acquatico. Sono state censite 58 comunità floristiche,
      tra le quali prevalgono le formazioni palustri: grandi carici e canneti fitti. Verso i margini vallivi
      compaiono prati umidi sfalciati, ontanete e boscaglie di salici ereditate dalla tradizionale gestione
      agricola. Nelle paludi vegetano circa 500 specie di piante vascolari, tra cui la ninfea bianca, la
      drosera a foglie rotonde e varie orchidee palustri.
    wildlife: >-
      La primavera è il regno incontrastato degli uccelli. Già al termine dei geli arrivano folti stormi di
      anatre e oche migratrici; sui prati allagati si esibisce il [combattente](/especie/philomachus_pugnax/)
      e, con il ritirarsi delle acque, nidificano i limicoli. Nelle miti serate primaverili i canti degli
      anfibi risuonano attorno ai pontili, compreso l'ululone dal ventre rosso [ululone dal ventre
      rosso](/especie/bombina_bombina/). Il parco tutela 13 specie di anfibi, tra cui tritone punteggiato e
      tritone crestato.


      L'estate accende i canneti: il [tarabuso](/especie/botaurus_stellaris/), il [re di
      quaglie](/especie/crex_crex/), il gufo di palude e il [pagliarolo](/especie/acrocephalus_paludicola/)
      figurano tra le specie minacciate su scala europea e globale. Tra i rapaci, il [falco di
      palude](/especie/circus_aeruginosus/) è il più diffuso, mentre anche l'[aquila di
      mare](/especie/haliaeetus_albicilla/) perlustra le anse del fiume. Dal 1979 al 2000 sono state
      registrate nel parco 203 specie di uccelli, delle quali 154 nidificanti.


      In autunno migliaia di gru si concentrano nelle zone umide prima di intraprendere la migrazione verso
      sud.


      Durante tutto l'anno la valle accoglie 34 specie di mammiferi, tra cui il
      [castoro](/especie/castor_fiber/) europeo, l'[alce](/especie/alces_alces/), il
      [cervo](/especie/cervus_elaphus/), il [capriolo](/especie/capreolus_capreolus/) e il
      [cinghiale](/especie/sus_scrofa/). Delle 21 specie di pesci, tre sono rigidamente protette assieme alla
      lampreda ucraina. I corridoi di transito dei grandi mammiferi attraversano questa depressione valliva.
      Tra i lepidotteri, la rara farfalla Coenonympha oedippus vive qui in una delle tre stazioni note in
      tutta la Polonia.
    visit: >-
      In kayak, il percorso fluviale segnalato «Narwiański Labirynt» copre 45 km attraverso l'intero parco da
      Suraż a Rzędziany, percorribile in due o tre giorni di voga. Poiché il Narew si divide in numerosi
      meandri, conviene mantenersi lungo il ramo principale per evitare disorientamenti. Per un'uscita di
      mezza giornata è disponibile l'anello «Kajakiem wokół Kurowa», con partenza e arrivo all'imbarcadero di
      Kurowo: il circuito breve misura 3,2 km e richiede un'ora e mezza, mentre il giro lungo si estende per
      7,7 km e impegna per circa tre ore. Il tracciato lungo risale in buona parte controcorrente e richiede
      adeguata resistenza fisica. Nei periodi di magra estiva la vegetazione subacquea rende difficoltoso il
      transito nel fiume Kurówka.


      A piedi, la passerella di Waniewo–Śliwno offre un itinerario didattico di circa 1 km che attraversa la
      piana alluvionale su assi di legno. La caratteristica più originale è costituita dai cinque pontili
      mobili che i visitatori movimentano a mano tirando funi metalliche. È vietato percorrere la passerella
      in sella alla bicicletta: le due ruote vanno condotte a mano.


      Torrette d'avvistamento in legno sorgono a Kurowo, Waniewo, Suraż e Kolonia Topilec.


      Il centro visite Młynarzówka a Kurowo presenta una mostra multimediale con diorami, acquari e un
      documentario introduttivo sulla formazione della valle fluviale.
    history: >-
      Il parco nazionale è stato formalmente istituito il 1° luglio 1996. La sua peculiarità organizzativa
      risiede nel regime fondiario: soltanto 20.57 km² appartengono allo Stato, mentre la superficie restante
      è suddivisa in 12,000 parcelle agricole private appartenenti a piccoli proprietari locali. È stato
      proprio il costante lavoro di sfalcio dei prati a forgiare l'aspetto odierno della vegetazione.


      Il territorio custodisce memorie storiche: vicino a Kurowo svettano i piloni in pietra del ponte
      distrutto della vecchia arteria postale Białystok–Varsavia. La sede del parco è rimasta per vent'anni in
      una villa gentilizia del XIX secolo a Kurowo, prima di trasferirsi nel moderno centro Młynarzówka.
    before: >-
      La passerella può essere temporaneamente chiusa in caso di burrasche o piene pericolose. Nei periodi di
      eccessiva magra i pontili galleggianti vengono fermati per tutelare i fondali. Le imbarcazioni a motore
      termico sono tassativamente vietate in tutto il territorio del parco.
    around: >-
      A diciotto chilometri sorge il [Parco naturale della foresta di
      Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) e a 19 km si trova il [Parco nazionale della
      Biebrza](/lugar/biebrzanski-park-narodowy/). Più distante, il [Parco naturale della valle del Basso
      Oder](/lugar/park-krajobrazowy-dolina-dolnej-odry/) condivide con il Narew l'albanella minore e il
      castoro nel contesto di una grandiosa valle fluviale alluvionale.
  pt:
    intro: >-
      Se tentares contar os braços do Narew dentro do parque, rapidamente perdes o fio à meada. O rio não
      corre por um leito único, mas ramifica-se em inúmeros braços que se dividem e se voltam a juntar,
      tecendo uma malha aquática entre ilhotas que mal sobressaem do nível das águas. É um rio anastomosado,
      uma singularidade hidrológica de relevo continental; o parque nacional criado em 1996 na Podláquia, no
      nordeste da Polónia, protege precisamente este trecho do vale: cerca de 50 km entre Suraż e Rzędziany,
      com uma largura que oscila entre 2 e 4 km. A paisagem aprecia-se muito melhor a partir da água, razão
      pela qual a direção do parque recomenda percorrê-la em caiaque.
    landscape: >-
      O Narew desenha no parque um mosaico de remansos, braços correntes, ilhas de turfa e caniçais que lhe
      conferem uma fisionomia ímpar. Entre os canais surgem ilhotas alagadiças que mal despontam da água e
      ficam submersas nas cheias do degelo primaveril; regra geral regista-se apenas uma grande cheia anual, o
      que faz com que o aspeto do vale mude profundamente consoante as estações do ano.


      A flora acompanha esta gradação palustre. Estão inventariadas 58 associações botânicas, onde dominam as
      comunidades de pântano: grandes juncais e densos caniçais. Nos rebordos surgem prados húmidos de feno,
      amiais e salgueirais moldados pelo corte tradicional da vegetação. Nestes sapais convivem cerca de 500
      espécies de plantas vasculares, incluindo o lírio-d'água-branco, a drósera e várias orquídeas selvagens.
    wildlife: >-
      A primavera consagra o protagonismo às aves. Logo após o degelo aterrissam bandos de gansos e patos em
      trânsito migratório; nos prados alagados exibe-se o [combatente](/especie/philomachus_pugnax/) e, à
      medida que a água baixa, nidificam limícolas. Nas noites amenas de primavera escutam-se coros de
      anfíbios junto aos passadiços, salientando-se o
      [bombina-de-barriga-vermelha](/especie/bombina_bombina/). O parque acolhe 13 espécies de anfíbios,
      integrando tritões-pontuados e tritões-cristados.


      O verão destaca as aves de caniçal: o [abicaravão](/especie/botaurus_stellaris/), o
      [codornizão](/especie/crex_crex/), o bufo-pequeno e a
      [felosa-aquática](/especie/acrocephalus_paludicola/) contam-se entre as espécies vulneráveis à escala
      mundial e comunitária. De três espécies de tartaranhões, o
      [tartaranhão-dos-pauis](/especie/circus_aeruginosus/) é o mais frequente, enquanto a majestosa
      [águia-rabalva](/especie/haliaeetus_albicilla/) patrulha os canais. Entre 1979 e 2000 documentaram-se
      203 espécies de aves, das quais 154 nidificantes.


      No outono assiste-se a grandes concentrações de grous nos dormitórios antes da migração invernal.


      Ao longo de todo o ano, o vale alberga 34 espécies de mamíferos, compreendendo o
      [castor](/especie/castor_fiber/), o [alce](/especie/alces_alces/), o
      [veado-vermelho](/especie/cervus_elaphus/), o [corço](/especie/capreolus_capreolus/) e o
      [javali](/especie/sus_scrofa/). Das 21 espécies piscícolas, três encontram-se protegidas a par da
      lampreia-ucraniana. As rotas migratórias de grandes herbívoros cruzam este corredor fluvial. Nos
      insetos, a borboleta protegida Coenonympha oedippus habita aqui num de apenas três redutos polacos.
    visit: >-
      Em caiaque, o percurso fluvial sinalizado «Narwiański Labirynt» tem 45 km e atravessa todo o parque de
      Suraż a Rzędziany, realizando-se em dois ou três dias de navegação. Como o Narew se divide em
      incontáveis braços, recomenda-se acompanhar a calha principal para prevenir desorientações. Para
      passeios curtos sugere-se a rota circular «Kajakiem wokół Kurowa», com cais em Kurowo: a variante curta
      de 3,2 km cumpre-se em hora e meia, enquanto o circuito longo de 7,7 km leva cerca de três horas. Este
      último segue quase sempre contra a corrente e exige bom preparo físico e caudal adequado. Nos estios
      secos a vegetação subaquática dificulta a passagem na ribeira de Kurówka.


      A pé, o passadiço de Waniewo–Śliwno é um trilho de interpretação com cerca de 1 km que atravessa os
      sapais sobre estacas de madeira. O aspeto mais divertido são os cinco pontões flutuantes que os próprios
      caminhantes manobram puxando correntes de aço. Não é permitido circular de bicicleta no passadiço,
      devendo ser conduzida à mão.


      Torres panorâmicas de madeira erguem-se em Kurowo, Waniewo, Suraż e Kolonia Topilec ao longo da bacia.


      O centro de interpretação Młynarzówka em Kurowo acolhe uma mostra multimédia sobre a bacia com dioramas,
      aquários e uma projeção sobre a formação do vale fluvial.
    history: >-
      O parque nacional foi criado a 1 de julho de 1996. A sua feição institucional mais marcante prende-se
      com o regime de propriedade: unicamente 20.57 km² pertencem ao Estado, estando o restante retalhado em
      12,000 parcelas agrícolas particulares geridas por pequenos lavradores locais. Foi o corte tradicional
      das fenas que moldou o mosaico florístico da bacia.


      O vale preserva memórias do passado: junto a Kurowo erguem-se os pilares de cantaria da antiga ponte
      destruída da estrada histórica Białystok–Varsóvia. A sede funcionou durante vinte anos numa casa
      apalaçada do século XIX em Kurowo antes de transitar para o centro contemporâneo de Młynarzówka.
    before: >-
      O passadiço pode encerrar temporariamente em situações de tempestade ou cheias severas. Quando o caudal
      se reduz em excesso, as plataformas móveis são bloqueadas. É expressamente proibida a navegação com
      motores de combustão em todo o território do parque.
    around: >-
      A dezoito quilómetros situa-se o [Parque Paisagístico da Floresta de
      Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) e a 19 km o [Parque Nacional de
      Biebrza](/lugar/biebrzanski-park-narodowy/). Mais longe, o [Parque Paisagístico do Vale do Baixo
      Óder](/lugar/park-krajobrazowy-dolina-dolnej-odry/) partilha com o Narew o tartaranhão-caçador e o
      castor, compondo igualmente um vale aluvial pantanoso.
