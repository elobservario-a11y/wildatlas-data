observaciones:
  es: >-
    El acceso al mar está muy limitado cuando el mar está agitado, algo frecuente en la costa norte de
    Madeira. Se llega por el sendero escarpado o en teleférico, y la afluencia es media en el teleférico.
texto:
  es:
    intro: >-
      Esta reserva existe porque la gente del pueblo vio vaciarse su mar. Creada en 1997, nació de la voluntad
      de la población local, consciente de la degradación progresiva de los recursos pesqueros del litoral de
      Santana: se pescaba sobre todo con redes de enmalle perjudiciales y con explosivos. Hoy es una reserva
      exclusivamente marina de la costa norte de Madeira, entre Ponta do Clérigo, al este, y Ponta de São
      Jorge, al oeste, que baja desde la línea de pleamar máxima hasta los 100 metros de profundidad e incluye
      los islotes de Rocha das Vinhas y da Viúva. Frena la desertificación de los fondos marinos y busca
      repoblarlos.
    landscape: >-
      La costa de la reserva es de acantilado alto, rocoso y de difícil acceso, con dos playas de canto
      rodado. Junto a ellas, los dos islotes: Rocha das Vinhas, también llamado de São Jorge, y da Viúva, que
      es el islote de Rocha do Navio. La Viúva alcanza 94 metros de altura, ocupa unas 1,4 hectáreas y está
      horadada. En sus acantilados crecen plantas propias del litoral macaronésico, algunas raras en la isla y
      varias exclusivas del archipiélago de Madeira.


      Entre los hábitats protegidos están los acantilados macaronésicos con flora endémica y las cuevas
      marinas sumergidas o semisumergidas. El área de la reserva forma parte de la Red Natura 2000 como zona
      especial de conservación y coincide con ella.


      Y hay una huella humana. En la fajã de Rocha do Navio, de pequeñas parcelas de cultivo, se ven un lagar
      y un depósito de agua excavados en la roca.
    wildlife: >-
      El mar de aquí es agitado, y por eso el gran dinamismo de las aguas concentra una enorme cantidad de
      peces de muchas especies. Entre los residentes grandes están el mero (Epinephelus marginatus),
      Mycteroperca fusca y Bodianus scrofa; entre los costeros, sargos (Diplodus sargus y D. cervinus),
      Sparisoma cretense, Thalassoma pavo y las castañuelas Abudefduf luridus y Chromis limbata. En estos
      fondos rocosos son típicas las morenas, y en las rocas hay manchas naranjas, rojas y marrones que son
      colonias de ascidias, parecidas a esponjas; los erizos de mar son poco frecuentes.


      Arriba, los islotes son de las aves. El islote de Rocha das Vinhas es un lugar privilegiado para la cría
      de aves marinas pelágicas como la cagarra (Calonectris borealis), junto al alma-negra (Bulweria
      bulwerii) y el roque-de-castro (Hydrobates castro). Estas aves migratorias necesitan zonas con poca
      perturbación e inaccesibles a los depredadores, y por eso el islote es hoy tan importante. Dos aves
      marinas costeras crían aquí: el charrán común y la [gaviota patiamarilla](/especie/larus_michahellis/).


      En la zona terrestre contigua se ven todas las rapaces diurnas que crían en el archipiélago: el [busardo
      ratonero](/especie/buteo_buteo/), el [cernícalo vulgar](/especie/falco_tinnunculus/) y el gavilán. La
      lechuza común, la única rapaz nocturna del archipiélago, cría en los alrededores y suele verse, o al
      menos oírse. En los campos de la fajã, que llegan casi hasta la zona de mareas, viven el mirlo y la
      curruca capirotada; más arriba, entre arbustos y árboles pequeños, el pinzón de Madeira y el [reyezuelo
      de Madeira](/especie/regulus_madeirensis/), un endemismo madeirense.


      La reserva es hábitat potencial de la [foca monje](/especie/monachus_monachus/), llamada también lobo
      marino. El IFCN mantiene el proyecto de vigilancia de su estado de conservación en el archipiélago, y
      existe un reglamento de la actividad de observación de vertebrados marinos. La reserva se puede visitar
      todo el año, y basta con media jornada.
    visit: >-
      Se llega a la reserva desde el mirador de Rocha do Navio, por un sendero escarpado en la roca o por
      teleférico. Desde el mirador puede contemplarse el entorno de la reserva. El acceso al mar, en cambio,
      está muy limitado: el mar de la costa norte de la isla suele estar alborotado.


      La reserva recibe muchas visitas de residentes y estudiantes, y se da a conocer con visitas y acciones
      de sensibilización e información. Cualquier grupo con fin pedagógico puede participar en el programa de
      visitas educativas: se pide al Instituto das Florestas e Conservação da Natureza.
    history: >-
      La reserva buscaba, además, otras acciones de conservación unidas a actividades de ocio y turismo.
      Santana fue reconocido por la UNESCO como reserva de la biosfera en junio de 2011, en el programa MAB.
      La reserva de la biosfera cubre toda la parte emergida del municipio y el mar adyacente hasta la
      batimétrica de los 200 metros, y su logotipo une la orquídea de la sierra, símbolo de la laurisilva, con
      el islote de Rocha do Navio, símbolo de la reserva marina. Hoy se prohíben la caza y el uso de redes.
    before: >-
      El acceso al mar está muy limitado cuando el mar está agitado, algo frecuente en la costa norte de
      Madeira. Se llega por el sendero escarpado o en teleférico, y la afluencia es media en el teleférico.
    around: >-
      A dos kilómetros queda el [Parque Natural de Madeira - Bosque Primario de
      Laurisilva](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/), a seis el [Pico Ruivo y Macizo
      Montañoso Central de Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) y a otros seis
      la [Reserva Natural de la Península de Ponta de São
      Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/). Por la foca monje, la reserva se parece a
      la del [Parque Nacional Marino de Zakynthos (Zante)](/lugar/zakynthos-national-marine-park/), la
      [Península de Akamas](/lugar/akamas-peninsula/) y el [Parque Natural del Archipiélago de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/).
  en:
    intro: >-
      This marine reserve exists because local villagers watched their coastal sea being emptied. Established
      in 1997, it was created through the concerted initiative of local inhabitants distressed by the
      relentless degradation of fishery stocks off Santana: coastal waters had been heavily plundered with
      damaging gillnets and underwater explosives. Today it protects an exclusively marine perimeter along the
      rugged northern coast of Madeira, between Ponta do Clérigo to the east and Ponta de São Jorge to the
      west, extending from the extreme high-water spring line down to 100 metres depth and encompassing the
      rocky islets of Rocha das Vinhas and da Viúva. Its goal is halting seabed desertification and
      regenerating benthic habitats.
    landscape: >-
      The reserve's shoreline is formed by monumental, dark volcanic cliffs plunging sheer into the sea, with
      two secluded pebble beaches. Flanking them rise two steep islets: Rocha das Vinhas (also known as São
      Jorge islet) and Ilhéu da Viúva (the islet of Rocha do Navio). Viúva attains 94 metres in elevation,
      spans some 1.4 hectares and features sea-carved arches. Its sea bluffs host typical Macaronesian coastal
      halophytes, including rare island endemics and several species exclusive to the Madeira archipelago.


      Protected habitats include Macaronesian sea cliffs with endemic flora and submerged or semi-submerged
      marine sea caves. The reserve is fully integrated within the Natura 2000 network as a Special Area of
      Conservation, sharing its boundaries.


      Human history has also left its imprint. On the narrow coastal ledge (fajã) of Rocha do Navio, among
      terraced plots, survive a stone wine press and a cistern hollowed directly into the basalt.
    wildlife: >-
      The North Atlantic swell here is vigorous, and this tremendous wave energy supports abundant fish life.
      Resident large species include dusky grouper (*Epinephelus marginatus*), island grouper (*Mycteroperca
      fusca*) and barred hogfish (*Bodianus scrofa*); coastal fish include white seabream, zebra seabream,
      parrotfish, ornate wrasse and damselfish like *Abudefduf luridus* and *Chromis limbata*. Rocky crevices
      conceal moray eels, while submerged basaltic slabs display orange, red and brown encrusting colonies of
      sea squirts; sea urchins are uncommon.


      Above the waves, the islets belong to pelagic seabirds. Rocha das Vinhas is a vital nesting sanctuary
      for Cory's shearwater, Bulwer's petrel and band-rumped storm petrel. These open-ocean flyers require
      predator-free crags with minimal human disturbance. Inshore seabirds nesting here include common tern
      and [yellow-legged gull](/especie/larus_michahellis/).


      On the adjacent mainland cliffs, every diurnal raptor breeding on Madeira occurs: [common
      buzzard](/especie/buteo_buteo/), [common kestrel](/especie/falco_tinnunculus/) and Eurasian sparrowhawk.
      The western barn owl, Madeira's sole nocturnal raptor, nests in neighboring ravines. In the cultivated
      plots of the fajã live blackbird and blackcap; higher up among coastal scrub nest the Madeira chaffinch
      and the [Madeira firecrest](/especie/regulus_madeirensis/), a proud island endemic.


      The reserve serves as potential refuge for the rare [Mediterranean monk
      seal](/especie/monachus_monachus/), known locally as the lobo-marinho. Regional forestry services (IFCN)
      maintain monitoring programs for its population across the archipelago, supported by strict observation
      regulations. Visits are rewarding year-round, requiring half a day.
    visit: >-
      The reserve is accessed from the Rocha do Navio viewpoint, either via a steep footpath carved into the
      precipice or by the scenic municipal cable car. The clifftop viewpoint offers sweeping views across the
      protected waters. Direct access into the sea, however, is heavily constrained by the powerful swells
      typical of Madeira's northern coastline.


      The reserve welcomes students and eco-tourists through structured interpretive walks and environmental
      awareness campaigns. Educational groups can arrange specialized guided tours by contacting the Institute
      of Forests and Nature Conservation.
    history: >-
      Conservation at Rocha do Navio was conceived to harmonize ecosystem protection with sustainable
      eco-tourism. Santana was designated a UNESCO Biosphere Reserve in June 2011 under the MAB program. The
      biosphere reserve encompasses the entire onshore municipality and adjacent waters down to the 200-metre
      isobath, with an official emblem fusing the mountain orchid of the laurel forest and the islet of Rocha
      do Navio. Hunting and all forms of netting are strictly prohibited.
    before: >-
      Direct access to the water is frequently restricted by rough seas, typical of Madeira's wild northern
      coast. Access is via the cliff trail or cable car, which sees moderate queues during peak midday hours.
    around: >-
      Two kilometres away lies the [Madeira Natural Park - Primary Laurisilva
      Forest](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/), six kilometres away is [Pico Ruivo
      and Central Mountain Massif](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) and six
      kilometres east sits the [Ponta de São Lourenço Nature
      Reserve](/lugar/reserva-natural-da-ponta-de-sao-lourenco/). For Mediterranean monk seal protection, the
      reserve shares ecological affinities with [Zakynthos National Marine Park
      (Zante)](/lugar/zakynthos-national-marine-park/), the [Akamas Peninsula](/lugar/akamas-peninsula/) and
      [Lastovo Islands Nature Park](/lugar/park-prirode-lastovsko-otocje/).
  fr:
    intro: >-
      Cette réserve existe parce que les villageois ont vu leur littoral se dépeupler. Créée en 1997, elle est
      née de la volonté des habitants locaux, alarmés par le pillage des ressources halieutiques de Santana
      par les filets maillants et les explosifs. C'est aujourd'hui une réserve exclusivement marine de la côte
      septentrionale de Madère, entre Ponta do Clérigo à l'est et Ponta de São Jorge à l'ouest, qui s'étend de
      la ligne des hautes mers de vives-eaux jusqu'à 100 mètres de fond, incluant les îlots de Rocha das
      Vinhas et da Viúva. Elle vise à stopper la désertification sous-marine et restaurer la vie benthique.
    landscape: >-
      Le littoral de la réserve présente de hautes falaises rocheuses d'accès abrupt, ourlées de deux plages
      de galets. À leurs côtés se dressent deux îlots : Rocha das Vinhas (ou îlot de São Jorge) et da Viúva
      (l'îlot de Rocha do Navio). Ce dernier culmine à 94 mètres, couvre environ 1,4 hectare et présente une
      arche marine naturelle. Sur ses parois s'accrochent des plantes halophiles macaronésiennes, dont des
      raretés endémiques de Madère.


      Parmi les habitats protégés figurent les falaises macaronésiennes à flore endémique et les grottes
      marines submergées ou semi-submergées. La réserve est intégrée au réseau Natura 2000 comme zone spéciale
      de conservation dont elle épouse le périmètre.


      Une empreinte humaine singulière subsiste. Sur la fajã cultivée de Rocha do Navio, quelques parcelles en
      terrasses conservent un pressoir à vin et un réservoir d'eau creusés à même le roc.
    wildlife: >-
      La houle atlantique est ici vigoureuse, et ce brassage permanent concentre une faune ichtyologique
      foisonnante. Parmi les grands sédentaires figurent le mérou brun, le badèche et le pourceau dos-noir ;
      parmi les espèces côtières, sars, perroquets de mer, girelles-paons et demoiselles. Les fonds rocheux
      abritent murènes et colonies d'ascidies encroûtantes aux teintes vives ; les oursins se font plus rares.


      En hauteur, les îlots appartiennent aux oiseaux marins. Rocha das Vinhas est un sanctuaire exceptionnel
      pour le puffin cendré, le pétrel de Bulwer et l'océanite de Castro. Ces migrateurs recherchent des
      corniches inaccessibles aux prédateurs terrestres. Deux oiseaux côtiers nichent également : la sterne
      pierregarin et le [goéland leucophée](/especie/larus_michahellis/).


      Sur la falaise continentale nichent tous les rapaces diurnes de l'archipel : la [buse
      variable](/especie/buteo_buteo/), le [faucon crécerelle](/especie/falco_tinnunculus/) et l'épervier
      d'Europe. L'effraie des clochers, seul rapace nocturne insulaire, niche aux alentours. Dans les cultures
      de la fajã vivent merles et fauvettes à tête noire ; plus haut chantent le pinson de Madère et le
      [roitelet de Madère](/especie/regulus_madeirensis/), joyau endémique.


      La réserve forme un biotope d'accueil pour le rare [phoque moine de
      Méditerranée](/especie/monachus_monachus/), nommé localement lobo-marinho. L'institut forestier IFCN
      supervise son suivi dans l'archipel. La visite est praticable en toute saison en prévoyant une
      demi-journée.
    visit: >-
      On accède à la réserve depuis le belvédère de Rocha do Navio, par un sentier vertigineux taillé dans la
      falaise ou par le téléphérique. Le belvédère offre une vue splendide sur l'étendue marine protégée.
      L'accès à l'eau reste très restreint en raison de la forte houle de la côte nord de Madère.


      La réserve accueille écoliers et visiteurs à travers des actions de sensibilisation. Tout groupe à but
      éducatif peut solliciter un accueil encadré auprès de l'Institut des forêts et de la conservation de la
      nature.
    history: >-
      La réserve allie préservation marine et écotourisme respectueux. Santana a été désignée réserve de
      biosphère par l'UNESCO en juin 2011 dans le cadre du programme MAB. Cette réserve de biosphère englobe
      toute la commune terrestre et les eaux côtières jusqu'à l'isobathe des 200 mètres, son logo associant
      l'orchidée de montagne et l'îlot de Rocha do Navio. La chasse et les filets y sont rigoureusement
      prohibés.
    before: >-
      L'accès direct à la mer est sévèrement limité en cas de forte houle, fréquente sur le littoral nord de
      Madère. L'accès s'effectue par sentier escarpé ou téléphérique, qui connaît une affluence modérée.
    around: >-
      À deux kilomètres se situe le [parc naturel de Madère - Forêt primaire de
      laurisilva](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/), à six kilomètres le [Pico
      Ruivo et massif montagneux central de Madère](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/)
      et à six autres la [réserve naturelle de la presqu'île de Ponta de São
      Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/). Pour le phoque moine, la réserve se
      rapproche du [parc national marin de Zakynthos (Zante)](/lugar/zakynthos-national-marine-park/), de la
      [péninsule d'Akamas](/lugar/akamas-peninsula/) et du [parc naturel de l'archipel de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/).
  de:
    intro: >-
      Dieses Schutzgebiet verdankt seine Entstehung den Einheimischen, die mitansehen mussten, wie ihre
      Küstengewässer leergefischt wurden. Es wurde 1997 auf Initiative der Bevölkerung von Santana ins Leben
      gerufen, die sich gegen die Zerstörung der Fischgründe durch Kiemennetze und Dynamitfischerei wehrte.
      Heute bildet es ein rein marines Reservat an Madeiras Nordküste zwischen Ponta do Clérigo im Osten und
      Ponta de São Jorge im Westen. Es reicht von der Flutlinie bis in 100 Meter Meerestiefe und schließt die
      Felseilande Rocha das Vinhas und da Viúva ein, um den Meeresgrund zu regenerieren.
    landscape: >-
      Die Küstenlinie wird von monumentalen Steilwänden geprägt, die jäh ins Meer abfallen, unterbrochen von
      zwei Kieselstränden. Davor ragen zwei Felsinseln auf: Rocha das Vinhas (auch São-Jorge-Eiland) und Ilhéu
      da Viúva (das Eiland von Rocha do Navio). Die Viúva erreicht 94 Meter Höhe, misst rund 1,4 Hektar und
      besitzt ein Brandungstor. An den Felsflanken gedeiht makaronesische Küstenflora mit seltenen
      Inselendemiten des Archipels.


      Zu den geschützten Biotopen zählen makaronesische Steilküsten mit endemischer Flora sowie
      Brandungshöhlen. Das Schutzgebiet ist deckungsgleich als Besonderes Erhaltungsgebiet in das
      Natura-2000-Netzwerk eingegliedert.


      Auch Spuren menschlichen Wirkens sind sichtbar: Auf der Küstenterrasse (Fajã) von Rocha do Navio sind
      zwischen kleinen Parzellen eine historische Weinpresse und ein Wasserbecken in den Basalt gehauen.
    wildlife: >-
      Die Brandung des Nordatlantiks ist kräftig, und die starke Wasserbewegung fördert reichen Fischbestand.
      Zu den standorttreuen Großfischen gehören Brauner Zackenbarsch, Insel-Zackenbarsch und
      Schweinslippfisch; im Uferbereich leben Geißbrassen, Zebrabrassen, Meerjunker und Riffbarsche. In
      Felsspalten lauern Muränen, während bunte Seescheidenkolonien die Felsen überziehen; Seeigel treten eher
      spärlich auf.


      Die Felseilande gehören den Meeresvögeln. Rocha das Vinhas ist ein wichtiger Nistplatz für
      Gelbschnabel-Sturmtaucher, Bulwersturmvogel und Madeirawellenläufer, die störungsfreie Brutplätze
      benötigen. Auch Flussseeschwalbe und [Mittelmeermöwe](/especie/larus_michahellis/) brüten hier.


      An der Steilwand jagen alle auf Madeira heimischen Greifvögel: [Mäusebussard](/especie/buteo_buteo/),
      [Turmfalke](/especie/falco_tinnunculus/) und Sperber. Die Schleiereule, Madeiras einzige Eule, brütet in
      den Felsen. Auf den Wiesen der Fajã leben Amsel und Mönchsgrasmücke; in den höheren Gebüschen der
      Madeirafink und das endemische [Madeiragoldhähnchen](/especie/regulus_madeirensis/).


      Das Reservat gilt als Lebensraum der seltenen [Mittelmeer-Mönchsrobbe](/especie/monachus_monachus/), vor
      Ort als Meereswolf bekannt. Die Forstbehörde IFCN überwacht die Bestände. Ein Besuch lohnt ganzjährig
      und erfordert einen halben Tag.
    visit: >-
      Der Zugang erfolgt vom Aussichtspunkt Rocha do Navio über einen in die Felswand geschlagenen Steig oder
      mit der Seilbahn. Vom Miradouro eröffnet sich der Blick über das Meeresreservat. Ein direkter Einstieg
      ins Meer ist wegen des starken Wellengangs an Madeiras Nordküste stark eingeschränkt.


      Das Reservat empfängt zahlreiche Besucher und Schulklassen im Rahmen von Bildungsveranstaltungen.
      Umweltpädagogische Führungen können beim Institut für Forsten und Naturschutz angemeldet werden.
    history: >-
      Das Reservat verbindet Meeresschutz mit sanftem Ökotourismus. Santana wurde im Juni 2011 im Rahmen des
      UNESCO-MAB-Programms als Biosphärenreservat anerkannt. Dieses umfasst das gesamte Gemeindegebiet und die
      vorgelagerten Gewässer bis zur 200-Meter-Tiefenlinie; sein Logo vereint Bergorchidee und Felseiland von
      Rocha do Navio. Jagd und Stellnetze sind streng untersagt.
    before: >-
      Der Einstieg ins Wasser ist bei schwerem Seegang meist unmöglich, was an Madeiras Nordküste oft
      vorkommt. Der Abstieg erfolgt über Steilpfad oder Seilbahn, an der mit mäßigem Andrang zu rechnen ist.
    around: >-
      Zwei Kilometer entfernt liegt der [Naturpark Madeira -
      Lorbeer-Urwald](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/), sechs Kilometer der [Pico
      Ruivo und das zentrale Bergmassiv](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) und sechs
      Kilometer östlich das [Naturschutzgebiet Ponta de São
      Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/). Zum Schutz der Mönchsrobbe bestehen
      Parallelen zum [Nationalen Meerespark Zakynthos (Zante)](/lugar/zakynthos-national-marine-park/), zur
      [Akamas-Halbinsel](/lugar/akamas-peninsula/) und zum [Naturpark
      Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/).
  it:
    intro: >-
      Questa riserva esiste perché gli abitanti del luogo hanno visto spopolarsi il proprio mare. Istituita
      nel 1997, è nata dalla volontà della popolazione locale preoccupata per il progressivo depauperamento
      degli stock ittici di Santana dovuto a reti da posta e pesca con esplosivi. Oggi è una riserva
      esclusivamente marina della costa settentrionale di Madera, tra Ponta do Clérigo a est e Ponta de São
      Jorge a ovest, estesa dalla linea di alta marea sino a 100 metri di profondità comprendendo gli isolotti
      di Rocha das Vinhas e da Viúva, per arginare la desertificazione dei fondali.
    landscape: >-
      La costa della riserva è formata da alte falesie rocciose a picco sul mare con due spiagge di ciottoli.
      A breve distanza sorgono due faraglioni: Rocha das Vinhas (detto anche di São Jorge) e da Viúva
      (l'isolotto di Rocha do Navio). Quest'ultimo tocca i 94 metri di altezza, si estende per circa 1,4
      ettari ed è perforato da un arco naturale. Sulle pareti allignano piante alofile macaronesiche, alcune
      molto rare nell'isola e tipiche dell'arcipelago di Madera.


      Tra gli habitat tutelati figurano le scogliere macaronesiche con vegetazione endemica e le grotte marine
      sommerse o semisommerse. L'area è pienamente inclusa nella rete Natura 2000 quale zona speciale di
      conservazione.


      Non manca l'impronta umana: sulla fajã coltivata di Rocha do Navio, tra minuscoli terrazzamenti, si
      ammirano un palmento e una cisterna scavati nella roccia basaltica.
    wildlife: >-
      Il moto ondoso qui è possente, e il forte idrodinamismo concentra una grandissima quantità di pesci. Tra
      i grandi stanziali figurano cernia bruna, cernia dell'isola e pesce cane rosso; tra le specie costiere
      si notano saraghi, pesci pappagallo, donzelle pavonine e castagnole. I fondali rocciosi offrono rifugio
      a murene e colonie incrostanti di ascidie arancioni e rosse, mentre i ricci di mare scarseggiano.


      In alto, gli isolotti sono regno degli uccelli pelagici. Rocha das Vinhas è sito privilegiato di
      nidificazione per berta maggiore atlantica, berta di Bulwer e uccello delle tempeste di Castro,
      bisognosi di falesie al riparo dai predatori. Nidificano anche sterna comune e [gabbiano
      reale](/especie/larus_michahellis/).


      Lungo la scogliera nidificano tutti i rapaci diurni dell'arcipelago: la [poiana](/especie/buteo_buteo/),
      il [gheppio](/especie/falco_tinnunculus/) e lo sparviero. Il barbagianni, unico rapace notturno,
      frequenta le pareti vicine. Nei campi della fajã vivono merli e capinere; più in alto cinguettano il
      fringuello di Madera e il [fiorrancino di Madera](/especie/regulus_madeirensis/), endemismo isolano.


      La riserva è habitat potenziale della [foca monaca](/especie/monachus_monachus/), detta localmente
      lobo-marinho. L'ente forestale IFCN coordina programmi di monitoraggio. L'area si visita tutto l'anno,
      bastando mezza giornata.
    visit: >-
      Si accede alla riserva dal belvedere di Rocha do Navio, tramite un ripido sentiero gradinato nella
      roccia o per mezzo della funivia. Dal miradouro si gode una visuale grandiosa sulla riserva marina.
      L'accesso in acqua è invece fortemente condizionato dall'impetuoso moto ondoso della costa nord di
      Madera.


      La riserva accoglie scolaresche e visitatori con iniziative didattiche e informative. Gruppi a fini
      educativi possono richiedere visite guidate all'Istituto delle foreste e della conservazione della
      natura.
    history: >-
      La riserva persegue la salvaguardia marina unita a un ecoturismo sostenibile. Santana è stata
      riconosciuta riserva della biosfera UNESCO nel giugno 2011 nel programma MAB. La biosfera racchiude
      l'intero comune emerso e le acque circostanti sino all'isobata dei 200 metri; il logo abbina l'orchidea
      montana all'isolotto di Rocha do Navio. Caccia e reti sono tassativamente vietate.
    before: >-
      L'accesso al mare è limitato dal mare mosso, frequente sulla costa settentrionale di Madera. Si scende
      lungo il sentiero scosceso o in funivia, con affluenza moderata.
    around: >-
      A due chilometri si trova il [Parco naturale di Madera - Foresta primaria di
      laurisilva](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/), a sei il [Pico Ruivo e
      massiccio montuoso centrale di Madera](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) e ad
      altri sei la [Riserva naturale di Ponta de São
      Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/). Per la foca monaca condivide affinità con
      il [Parco nazionale marino di Zante](/lugar/zakynthos-national-marine-park/), la [Penisola di
      Akamas](/lugar/akamas-peninsula/) e il [Parco naturale dell'arcipelago di
      Lastovo](/lugar/park-prirode-lastovsko-otocje/).
  pt:
    intro: >-
      Esta reserva existe porque a população local viu o mar esvaziar-se. Criada em 1997, nasceu da vontade
      dos habitantes de Santana conscientes da degradação dos recursos haliêuticos provocada pelo uso de redes
      de emalhar prejudiciais e explosivos. Hoje é uma reserva exclusivamente marinha no litoral norte da
      Madeira, entre a Ponta do Clérigo a leste e a Ponta de São Jorge a oeste, estendendo-se da linha de
      preia-mar máxima até aos 100 metros de profundidade e acolhendo os ilhéus da Rocha das Vinhas e da
      Viúva. O objetivo central é travar a desertificação dos fundos e recuperar os ecossistemas.
    landscape: >-
      A linha costeira da reserva é talhada em falésias escarpadas de difícil acesso com duas praias de calhau
      rolado. Junto a elas emergem dois ilhéus: Rocha das Vinhas (também de São Jorge) e da Viúva (ilhéu da
      Rocha do Navio). A Viúva atinge 94 metros de altitude, ocupa cerca de 1,4 hectares e é perfurada por
      arcos naturais. Nas suas arribas desenvolve-se flora litoral macaronésica com espécies exclusivas do
      arquipélago da Madeira.


      Entre os habitats protegidos contam-se as arribas macaronésicas com flora endémica e grutas marinhas
      submersas ou semissubmersas. A área integra a Rede Natura 2000 como zona especial de conservação.


      Há ainda testemunhos humanos singulares: na fajã da Rocha do Navio, em pequenas courelas agrícolas,
      conservam-se um lagar e um poço escavados na rocha basáltica.
    wildlife: >-
      O mar aqui é alteroso, e a forte oxigenação das águas concentra grande abundância de peixes. Entre as
      espécies residentes maiores contam-se o mero, o cherne-da-ilha e o bodião; junto à costa nadam sargos,
      vejas, peixes-verdes e castanhetas. Nas fendas basálticas abrigam-se moreias e colónias coloridas de
      ascídias, sendo os ouriços-do-mar pouco vulgares.


      No topo, os ilhéus pertencem às aves marinhas. O ilhéu da Rocha das Vinhas é poiso excecional para a
      cagarra, a alma-negra e o roque-de-castro, migradores que necessitam de escarpas inacessíveis a
      predadores terrestres. Nidificam também o garajau-comum e a
      [gaivota-de-patas-amarelas](/especie/larus_michahellis/).


      Na arriba continental criam todas as rapinas diurnas do arquipélago: a
      [águia-de-asa-redonda](/especie/buteo_buteo/), o [peneireiro-vulgar](/especie/falco_tinnunculus/) e o
      gavião. A coruja-das-torres nidifica nas imediações. Nas hortas da fajã ocorrem o melro e a
      toutinegra-de-barrete; mais acima surge o tentilhão-da-madeira e o
      [bis-bis](/especie/regulus_madeirensis/), endemismo madeirense.


      A reserva é biótopo potencial da [foca-monge-do-mediterrâneo](/especie/monachus_monachus/), o
      lobo-marinho. O IFCN assegura a monitorização da espécie no arquipélago. A visita faz-se todo o ano e
      requer meia jornada.
    visit: >-
      O acesso à reserva parte do miradouro da Rocha do Navio, por um trilho íngreme esculpido na rocha ou de
      teleférico. Do miradouro contempla-se o mar protegido. Já o acesso à água encontra-se muito condicionado
      pela forte rebentação costeira do norte da ilha.


      A reserva recebe estudantes e visitantes através de ações pedagógicas e de sensibilização. Qualquer
      grupo com fins educativos pode solicitar visita orientada ao Instituto das Florestas e Conservação da
      Natureza.
    history: >-
      A reserva procurou aliar a conservação marinha ao ecoturismo sustentável. Santana foi reconhecida pela
      UNESCO como reserva da biosfera em junho de 2011 no âmbito do programa MAB. A reserva da biosfera
      engloba toda a área terrestre do concelho e o mar adjacente até à batimétrica dos 200 metros, unindo no
      logótipo a orquídea da serra e o ilhéu da Rocha do Navio. A caça e as redes estão interditas.
    before: >-
      O acesso direto ao mar fica fortemente limitado com mar alteroso, frequente na costa norte madeirense.
      Desce-se a pé pelo trilho escarpado ou no teleférico, com procura média.
    around: >-
      A dois quilómetros situa-se o [Parque Natural da Madeira - Floresta de
      Laurissilva](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/), a seis o [Pico Ruivo e Maciço
      Montanhoso Central da Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) e a outros
      seis a [Reserva Natural da Ponta de São Lourenço](/lugar/reserva-natural-da-ponta-de-sao-lourenco/).
      Quanto à foca-monge partilha afinidades com o [Parque Nacional Marinho de Zakynthos
      (Zante)](/lugar/zakynthos-national-marine-park/), a [Península de Akamas](/lugar/akamas-peninsula/) e o
      [Parque Natural do Arquipélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/).
