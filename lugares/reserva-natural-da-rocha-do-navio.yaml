    Reserva marina protegida a los pies de acantilados verticales de 400 m en la costa norte de Madeira
    accesible por teleférico.
  en: >-
    Protected marine reserve at the foot of 400 m vertical cliffs on Madeira's northern coast accessible by
    cable car.
  fr: >-
    Réserve marine protégée au pied de falaises verticales de 400 m sur la côte nord de Madère accessible en
    téléphérique.
  de: >-
    Geschütztes Meeresreservat am Fuße 400 m hoher vertikaler Klippen an Madeiras Nordküste, erreichbar mit
    der Seilbahn.
  it: >-
    Riserva marina protetta ai piedi di scogliere verticali di 400 m sulla costa nord di Madera accessibile in
