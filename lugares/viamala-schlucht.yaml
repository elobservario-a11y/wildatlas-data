observaciones:
  es: >-
    Cuenta con la escalera: son 359 escalones. La garganta está cerrada de noviembre a marzo por seguridad.
    Las visitas guiadas públicas son los jueves, de mediados de julio a mediados de agosto, duran
    aproximadamente una hora y admiten hasta treinta personas.
texto:
  es:
    intro: >-
      «Mal camino». Así llamaron durante siglos a este tajo del Hinterrhein, y no era una exageración: la
      Viamala fue el obstáculo más difícil de la ruta baja que llevaba de Coira a los pasos de Splügen y San
      Bernardino. Hoy la garganta, en el cantón de los Grisones, entre Thusis y Zillis-Reischen, se visita con
      una escalera de 359 escalones que baja desde el centro de visitantes hasta el fondo, entre paredes de
      roca pulida de hasta 300 metros. Las modeló hace milenios el hielo glaciar y las aguas del Hinterrhein,
      y todavía se ven las marmitas de gigante que el agua fue horadando.
    landscape: >-
      Piensa en lo que ves al llegar al fondo: roca lisa, pulida por el hielo y por el agua, y el río, con los
      colores del agua. Las paredes alcanzan los 300 metros y entre ellas se encajan las marmitas de gigante,
      de milenios de edad, que se ven de cerca. Sobre ese tajo se cruzan puentes de épocas distintas: el
      puente de Wildener de 1739 y los nuevos puentes de Conzett.


      El río de hoy ya no es el de antes. En los relatos antiguos el Hinterrhein era un monstruo mortal; hoy,
      salvo un caudal residual, el agua se desvía por un túnel que pasa por dentro de la montaña, junto a la
      garganta, hasta las turbinas de Sils. El caudal habitual es de entre 0,9 y 2,8 m³ por segundo, mientras
      que antes de las centrales pasaban por la garganta en verano entre 40 y 70 m³ por segundo. Solo de vez
      en cuando vuelve la bravura: en octubre de 2013 una crecida llegó hasta el escalón más bajo de la
      escalera del túnel, con un caudal de hasta 280 m³ por segundo.
    wildlife: >-
      Aquí el protagonista es el agua y la piedra, y las estaciones las marca el río y la seguridad de la
      garganta. El tajo cierra en invierno, de noviembre a marzo, por seguridad, así que el descenso a las
      profundidades se hace de primavera a otoño. En verano, entre mediados de julio y mediados de agosto, hay
      visitas guiadas públicas los jueves, en las que se cuenta la garganta y su historia como paso de
      tránsito.
    visit: >-
      La bajada y la subida por la escalera hasta el centro de la garganta suelen llevar de treinta a cuarenta
      y cinco minutos. Si tienes más tiempo, hay varios senderos públicos entre Thusis, Zillis y Andeer, y el
      personal del centro de visitantes informa de rutas y accesos.


      La ruta estrella es la Veia Traversina, que sigue en gran parte el trazado romano. Va desde Thusis, por
      Sils, hasta el centro de visitantes, pasando por el castillo de Ehrenfels, el complejo de Hohen Rätien y
      el Traversinersteg, un puente de Jürg Conzett que salva la quebrada más grande y salvaje entre Sils y la
      Viamala. El primero se hundió por una caída de piedras tres años después de su apertura; el actual, de
      2005, es una escalera colgante. En el lado sur, otra ruta une el centro de visitantes con el puente
      colgante Punt da Suransuns y Zillis, y el circuito Viamala Sur vuelve al punto de partida. El Punt da
      Suransuns cruza directamente el Rin, en una bahía de agua azul, antes de que el río siga por la
      garganta.


      Y si quieres hacer algo más largo, la viaSpluga recorre en cuatro etapas diarias, con más de 68 km, el
      viejo corredor entre Thusis y Chiavenna: pasa por la Viamala, por la cascada de Roffla, por los grabados
      rupestres de Carschenna y por el techo medieval de la iglesia de San Martín de Zillis.
    history: >-
      La Viamala es sobre todo historia. Grabados de la Edad del Bronce en Carschenna y hallazgos de la Edad
      del Bronce y del Hierro apuntan a un paso de mulas desde alrededor de 1500 a. C. Los romanos salvaron la
      garganta por la izquierda con varias semigalerías excavadas en la roca. Con el tiempo, el camino se
      deterioró, y desde el siglo XIII el desfiladero y el camino se llaman Viamala.


      En 1473, los municipios de Thusis, Masein y Cazis reabrieron el camino y levantaron el puente de piedra
      Punt da Tgiern. Por allí pasaron caravanas de mulas, comerciantes, diplomáticos, «primeros turistas» y
      el correo de Lindau; Goethe dibujó la garganta el 1 de junio de 1788. La carretera de San Bernardino,
      comenzada en 1818, abrió en 1821 y se terminó hacia 1823. Una crecida destruyó en 1834 el tramo junto al
      Punt da Tgiern: el puente resistió, pero quedó inservible. En 1967, la autopista A13 esquivó la parte
      más estrecha de la garganta con un túnel de 742 metros.
    before: >-
      Cuenta con la escalera: son 359 escalones. La garganta está cerrada de noviembre a marzo por seguridad.
      Las visitas guiadas públicas son los jueves, de mediados de julio a mediados de agosto, duran
      aproximadamente una hora y admiten hasta treinta personas.
    around: >-
      A cinco kilómetros está el [Altiplano de la Greina](/lugar/plaine-de-la-greina---passo-della-greina/),
      otro rincón de los Grisones.
  en:
    intro: >-
      «Bad path». For centuries, that was the name given to this slash carved by the Hinterrhein, and it was
      no exaggeration: the Viamala was the most arduous obstacle on the lower route linking Chur to the
      Splügen and San Bernardino passes. Today the gorge, situated in the canton of Grisons between Thusis and
      Zillis-Reischen, is visited via a flight of 359 steps leading down from the visitor center right to the
      chasm between polished rock walls rising up to 300 meters. They were carved millennia ago by glacial ice
      and the waters of the Hinterrhein, and the giant potholes hollowed out by swirling currents remain
      clearly visible.
    landscape: >-
      Consider what you see upon reaching the chasm floor: sheer rock polished smooth by ice and water, and
      the river displaying varied tones of alpine runoff. The sheer cliffs tower 300 meters, and hollowed out
      between them are millenary giant potholes viewed at close quarters. Spanning the gorge are bridges from
      disparate epochs: the Wildener bridge dating from 1739 and the modern Conzett bridges.


      The modern river is no longer what it once was. In historical chronicles, the Hinterrhein was a lethal
      torrent; today, aside from residual ecological flows, the current is diverted through a mountain tunnel
      flanking the gorge straight to the power turbines of Sils. Typical discharge runs between 0.9 and 2.8 m³
      per second, whereas in pre-dam days summer flows through the gorge surged between 40 and 70 m³ per
      second. Only occasionally does its ancestral fury return: in October 2013, a flood swept right up to the
      lowest step of the tunnel stairway, discharging up to 280 m³ per second.
    wildlife: >-
      Water and rock are the undisputed protagonists here, with seasonal rhythms dictated by river dynamics
      and gorge safety. The defile closes in winter from November to March for visitor safety, making late
      spring through autumn the prime window for exploring the depths. In summer, between mid-July and
      mid-August, public guided tours take place on Thursdays, recounting the gorge's formation and its
      storied transit history.
    visit: >-
      Descending and climbing back up the stairway to the gorge center typically takes thirty to forty-five
      minutes. If you have more time, several marked hiking routes link Thusis, Zillis, and Andeer, with
      visitor center staff providing route guidance and access advice.


      The standout trail is the Veia Traversina, which closely traces the historic Roman alignment. It leads
      from Thusis through Sils to the visitor center, passing Ehrenfels Castle, the Hohen Rätien complex, and
      the Traversinersteg—a footbridge engineered by Jürg Conzett spanning the widest and wildest ravine
      between Sils and the Viamala. The original bridge was destroyed by a rockfall three years after opening;
      the current suspension stairway opened in 2005. On the southern flank, another trail links the visitor
      center with the Punt da Suransuns suspension bridge and Zillis, while the Viamala South circular trail
      loops back to the start. The Punt da Suransuns crosses directly over the Rhine above a turquoise basin
      before the river plunges into the inner gorge.


      For a longer multi-day journey, the viaSpluga covers over 68 km in four daily stages along the ancestral
      transit corridor between Thusis and Chiavenna: it passes through the Viamala, past Roffla waterfall, by
      the prehistoric rock carvings of Carschenna, and below the celebrated Romanesque painted ceiling of St.
      Martin's Church in Zillis.
    history: >-
      The Viamala is steeped above all in history. Bronze Age rock engravings at Carschenna and Bronze and
      Iron Age artifacts indicate a packhorse crossing dating back to around 1500 BC. The Romans negotiated
      the gorge along the left bank using rock-hewn half-tunnels. Over subsequent centuries the path degraded,
      and by the thirteenth century both gorge and trail bore the moniker Viamala.


      In 1473, the communes of Thusis, Masein, and Cazis restored the track and erected the stone Punt da
      Tgiern bridge. Along it traveled mule trains, merchants, diplomats, early travelers, and the Lindau
      postal messengers; Johann Wolfgang von Goethe sketched the chasm on 1 June 1788. The San Bernardino
      commercial highway, commenced in 1818, opened in 1821 and achieved completion around 1823. In 1834,
      catastrophic flooding destroyed the roadway section adjacent to the Punt da Tgiern: the bridge withstood
      the waters but was rendered impassable. In 1967, the A13 motorway bypassed the gorge's narrowest
      bottleneck with a 742-meter tunnel.
    before: >-
      Be prepared for the staircase: there are 359 steps. The gorge is closed from November to March for
      safety. Public guided tours run on Thursdays from mid-July to mid-August, take roughly one hour, and
      accommodate up to thirty people.
    around: >-
      Five kilometers away lies the [Greina Plateau](/lugar/plaine-de-la-greina---passo-della-greina/),
      another pristine wilderness corner of Grisons.
  fr:
    intro: >-
      « Mauvais chemin ». C'est ainsi que l'on désigna pendant des siècles cette entaille du Rhin postérieur
      (Hinterrhein), et ce n'était nullement exagéré : la Viamala constitua l'obstacle le plus redoutable de
      l'itinéraire inférieur reliant Coire aux cols du Splügen et du San Bernardino. Aujourd'hui, la gorge,
      située dans le canton des Grisons entre Thusis et Zillis-Reischen, se découvre grâce à un escalier de
      359 marches descendant depuis le centre d'accueil jusqu'au fond, au milieu de parois rocheuses polies
      s'élevant jusqu'à 300 mètres. Elles furent façonnées il y a des millénaires par les glaces glaciaires et
      les flots du Rhin postérieur, laissant de spectaculaires marmites de géant creusées par le courant.
    landscape: >-
      Songez à ce que vous contemplez en touchant le fond : de la roche lisse, polie par la glace et l'eau
      vive, et le cours d'eau aux teintes alpines. Les parois culminent à 300 mètres et abritent des marmites
      de géant plurimillénaires que l'on observe de près. Au-dessus de cette faille se succèdent des ponts
      d'époques diverses : le pont de Wildener bâti en 1739 et les nouveaux ouvrages suspendus de Conzett.


      Le fleuve actuel ne ressemble plus à celui d'autrefois. Dans les récits anciens, le Rhin postérieur
      passait pour un monstre indomptable ; aujourd'hui, hormis un débit résiduel, l'eau est captée par une
      galerie forée dans la montagne longeant la gorge jusqu'aux turbines hydroélectriques de Sils. Le débit
      ordinaire oscille entre 0,9 et 2,8 m³ par seconde, alors qu'avant les aménagements estivaux transitaient
      40 à 70 m³ par seconde. Seules de rares crues rappellent son impétuosité : en octobre 2013, une montée
      des eaux atteignit la marche la plus basse de l'escalier avec un débit de pointe mesuré à 280 m³ par
      seconde.
    wildlife: >-
      Ici, l'eau et la roche règnent sans partage, et les saisons s'accordent au rythme du cours d'eau et aux
      exigences de sécurité. Le site ferme en hiver, de novembre à mars, par précaution : la découverte des
      profondeurs s'effectue donc du printemps à l'automne. En été, de la mi-juillet à la mi-août, des visites
      guidées publiques ont lieu le jeudi pour narrer la géologie du gouffre et son épopée historique.
    visit: >-
      La descente et la remontée par l'escalier menant au cœur des gorges demandent en général trente à
      quarante-cinq minutes. Si vous disposez de davantage de temps, plusieurs sentiers balisés relient
      Thusis, Zillis et Andeer, et les agents d'accueil vous orienteront vers les itinéraires adéquats.


      Le parcours vedette est la Veia Traversina, qui épouse fidèlement le tracé romain antique. Elle va de
      Thusis, via Sils, jusqu'au centre des visiteurs en côtoyant le château d'Ehrenfels, le site de Hohen
      Rätien et la passerelle Traversinersteg — un ouvrage d'art de Jürg Conzett enjambant le ravin le plus
      profond entre Sils et la Viamala. La première passerelle fut brisée par un éboulement trois ans après sa
      pose ; la version actuelle, inaugurée en 2005, forme un escalier suspendu. Côté sud, un sentier relie le
      centre d'accueil à la passerelle suspendue Punt da Suransuns et à Zillis, tandis que la boucle Viamala
      Sud regagne le point de départ. Le Punt da Suransuns enjambe le Rhin au-dessus d'une anse turquoise
      avant l'entrée dans le défilé.


      Pour une randonnée itinérante, la viaSpluga franchit en quatre étapes quotidiennes plus de 68 km le long
      de l'ancien couloir muletier reliant Thusis à Chiavenna : elle longe la Viamala, la cascade de Roffla,
      les gravures rupestres de Carschenna et le plafond peint médiéval de l'église Saint-Martin de Zillis.
    history: >-
      La Viamala est avant tout un livre d'histoire. Des gravures de l'âge du bronze à Carschenna et des
      pièces archéologiques des âges du bronze et du fer attestent un passage muletier dès 1500 av. J.-C. Les
      Romains contournèrent l'abîme par la rive gauche au moyen de galeries taillées à flanc de paroi. Au fil
      des siècles, le sentier se dégrada et dès le XIIIe siècle, gorge et passage prirent le nom de Viamala.


      En 1473, les communes de Thusis, Masein et Cazis réaménagèrent la voie et élevèrent le pont en pierre
      Punt da Tgiern. Dès lors s'y succédèrent caravanes muletières, marchands, diplomates, pionniers du
      voyage et postiers de Lindau ; Goethe dessina la gorge le 1er juin 1788. La route carrossable du San
      Bernardino, entreprise en 1818, ouvrit au trafic en 1821 pour s'achever vers 1823. Une crue ruina en
      1834 le tronçon voisin du Punt da Tgiern : l'arche résista mais la voie devint impraticable. En 1967,
      l'autoroute A13 évita le resserrement majeur de la gorge grâce à un tunnel de 742 mètres.
    before: >-
      Prévoyez l'effort lié à l'escalier : il compte 359 marches. Le défilé reste fermé de novembre à mars
      pour motifs de sécurité. Les visites guidées ont lieu le jeudi de la mi-juillet à la mi-août, durent
      environ une heure et accueillent jusqu'à trente participants.
    around: >-
      À cinq kilomètres s'étend le [Plateau de la Greina](/lugar/plaine-de-la-greina---passo-della-greina/),
      autre joyau sauvage des Grisons.
  de:
    intro: >-
      «Böser Weg». So nannte man jahrhundertelang diesen Einschnitt des Hinterrheins, und das war keine
      Übertreibung: Die Viamala war das gefürchtetste Hindernis auf der unteren Transitroute von Chur zu den
      Pässen Splügen und San Bernardino. Heute erschließt eine Treppe mit 359 Stufen vom Besucherzentrum im
      Kanton Graubünden zwischen Thusis und Zillis-Reischen den Abstieg in die Tiefe zwischen bis zu 300 Meter
      hohen, glattgeschliffenen Felswänden. Gletschereis und das Wasser des Hinterrheins schliffen sie vor
      Jahrtausenden aus, und noch heute zeugen gigantische Strudeltöpfe von dieser Urgewalt.
    landscape: >-
      Stell dir den Anblick am Grund der Schlucht vor: glatter, von Eis und Schmelzwasser polierter Fels und
      der Fluss in wechselnden Farben. Die Felswände ragen bis zu 300 Meter empor, und in den Fels sind
      Jahrtausende alte Riesentöpfe eingegraben, die man aus nächster Nähe betrachtet. Über den Abgrund
      spannen sich Brücken verschiedener Zeitalter: die Wildener-Brücke von 1739 und die modernen Bauwerke von
      Conzett.


      Der Fluss von heute ist nicht mehr jener früherer Zeiten. In alten Chroniken galt der Hinterrhein als
      todbringendes Ungeheuer; heute wird das Wasser bis auf eine Restwassermenge durch einen Stollen im Berg
      neben der Schlucht zu den Turbinen von Sils abgeleitet. Der reguläre Abfluss liegt zwischen 0,9 und 2,8
      m³ pro Sekunde, während vor dem Kraftwerksbau im Sommer 40 bis 70 m³ pro Sekunde durch das Nadelöhr
      rauschten. Nur selten kehrt die alte Wildheit zurück: Im Oktober 2013 erreichte ein Hochwasser mit
      Spitzenwerten von 280 m³ pro Sekunde die unterste Treppenstufe des Stollens.
    wildlife: >-
      Hier bestimmen Wasser und Stein das Geschehen, und die Jahreszeiten richten sich nach den Flusspegeln
      und der Sicherheit im Engpass. Die Schlucht bleibt im Winter von November bis März aus
      Sicherheitsgründen geschlossen, sodass der Abstieg in die Felsenwelt von Frühling bis Herbst möglich
      ist. Im Sommer finden von Mitte Juli bis Mitte August donnerstags öffentliche Führungen statt, die
      Geologie und Verkehrsgeschichte erläutern.
    visit: >-
      Der Abstieg und Wiederaufstieg über die Schluchttreppe nimmt üblicherweise dreißig bis fünfundvierzig
      Minuten in Anspruch. Wer mehr Zeit mitbringt, findet gut markierte Wanderwege zwischen Thusis, Zillis
      und Andeer; das Personal im Besucherzentrum berät gern zu Routen und Zugängen.


      Die bekannteste Wanderung ist die Veia Traversina, die weithin der antiken Römerstraße folgt. Sie führt
      von Thusis über Sils zum Besucherzentrum und passiert dabei die Burg Ehrenfels, den Festungshügel Hohen
      Rätien und den Traversinersteg – eine Konstruktion von Jürg Conzett über das tiefste und wildeste Tobel
      zwischen Sils und der Viamala. Die erste Hängebrücke wurde drei Jahre nach Eröffnung durch einen
      Felssturz zerstört; der Neubau von 2005 bildet eine hängende Treppe. Auf der Südseite verbindet ein Weg
      das Besucherzentrum mit der Hängebrücke Punt da Suransuns und Zillis, während die Rundtour Viamala Süd
      zurück zum Ausgangspunkt führt. Die Punt da Suransuns überspannt den Rhein über einer tiefblauen Bucht,
      kurz bevor der Strom in die Felsenge schießt.


      Für mehrtägige Weitwanderungen bietet die viaSpluga in vier Tagesetappen auf über 68 km den historischen
      Saumweg zwischen Thusis und Chiavenna: Sie erschließt die Viamala, die Rofflaschlucht, die Felsritzungen
      von Carschenna und die romanische Bilderdecke der Kirche St. Martin in Zillis.
    history: >-
      Die Viamala ist vor allem ein geschichtsträchtiger Ort. Felszeichnungen aus der Bronzezeit bei
      Carschenna sowie Funde aus der Bronze- und Eisenzeit belegen einen Saumverkehr seit etwa 1500 v. Chr.
      Die Römer meisterten die Felswand am linken Ufer mit aus dem Fels geschlagenen Halbgalerien. Im Laufe
      der Jahrhunderte verfiel der Saumpfad, und seit dem dreizehnten Jahrhundert trugen Engnis und Weg den
      Namen Viamala.


      Im Jahr 1473 erneuerten die Gemeinden Thusis, Masein und Cazis den Weg und bauten die steinerne Punt da
      Tgiern. Fortan passierten Säumerzüge, Händler, Diplomaten, frühe Reisende und die Lindauer Boten die
      Schlucht; Goethe zeichnete den Abgrund am 1. Juni 1788. Die 1818 begonnene San-Bernardino-Fahrstraße
      wurde 1821 dem Verkehr übergeben und bis 1823 vollendet. Ein verheerendes Hochwasser zerstörte 1834 die
      Straße bei der Punt da Tgiern: Die Brücke hielt stand, verlor jedoch ihren Anschluss. 1967 umging die
      Nationalstraße A13 den engsten Schluchtbereich mit einem 742 Meter langen Tunnel.
    before: >-
      Beachte die Anforderung der Treppe: Es sind 359 Stufen zu bewältigen. Die Schlucht ist von November bis
      März aus Sicherheitsgründen geschlossen. Öffentliche Führungen finden donnerstags von Mitte Juli bis
      Mitte August statt, dauern etwa eine Stunde und sind auf dreißig Personen begrenzt.
    around: >-
      Fünf Kilometer entfernt liegt die [Greina-Hochebene](/lugar/plaine-de-la-greina---passo-della-greina/),
      ein weiteres alpines Kleinod Graubündens.
  it:
    intro: >-
      «Mala via». Così venne chiamato per secoli questo intaglio del Reno Posteriore (Hinterrhein), e non si
      trattava di un'esagerazione: la Viamala fu il passaggio più ostico della rotta inferiore che conduceva
      da Coira ai valichi dello Spluga e del San Bernardino. Oggi la forra, situata nel cantone dei Grigioni
      tra Thusis e Zillis-Reischen, si visita percorrendo una scalinata di 359 gradini che scende dal centro
      visite fino al fondovalle, serrata tra rupi levigate alte fino a 300 metri. Furono modellate millenni fa
      dai ghiacciai e dai flutti del Reno Posteriore, e ancora oggi si ammirano le marmitte dei giganti
      scavate dall'acqua.
    landscape: >-
      Pensa a cosa vedi quando tocchi il fondo: roccia liscia, lucidata dal ghiaccio e dalle acque correnti, e
      il fiume con le sue tonalità alpine. Le pareti svettano per 300 metri e tra di esse si incuneano le
      marmitte dei giganti, d'età millenaria, osservabili da vicino. Sopra questo baratro si susseguono ponti
      di epoche distinte: il ponte di Wildener del 1739 e le moderne passerelle di Conzett.


      Il fiume attuale non è più quello di un tempo. Nelle cronache antiche il Reno Posteriore appariva come
      un mostro mortale; oggi, a parte un deflusso minimo vitale, l'acqua viene captata dentro una galleria
      scavata nella montagna lungo la gola fino alle turbine di Sils. La portata consueta oscilla tra 0,9 e
      2,8 m³ al secondo, mentre prima degli impianti idroelettrici transitavano in estate tra 40 e 70 m³ al
      secondo. Solo di rado riappare l'antica furia: nell'ottobre 2013 una piena toccò il gradino più basso
      della galleria con una portata fino a 280 m³ al secondo.
    wildlife: >-
      Qui i protagonisti assoluti sono l'acqua e la roccia, e le stagioni sono scandite dal fiume e dai
      requisiti di sicurezza. La gola chiude in inverno da novembre a marzo per ragioni di sicurezza, per cui
      la discesa nell'abisso si compie tra la primavera e l'autunno. In estate, da metà luglio a metà agosto,
      ogni giovedì si organizzano visite guidate pubbliche per illustrare la gola e le sue vicende storiche di
      transito.
    visit: >-
      La discesa e la risalita lungo la scalinata fino al centro della gola richiedono solitamente tra trenta
      e quarantacinque minuti. Se disponi di più tempo, vari sentieri collegano Thusis, Zillis e Andeer, e il
      personale del centro visite fornisce indicazioni sui percorsi.


      L'itinerario più celebre è la Veia Traversina, che ripercorre in buona parte il tracciato romano. Si
      snoda da Thusis, via Sils, fino al centro visite, oltrepassando il castello di Ehrenfels, il complesso
      di Hohen Rätien e il Traversinersteg, una passerella progettata da Jürg Conzett per scavalcare l'orrido
      più selvaggio tra Sils e la Viamala. La prima struttura fu travolta da una frana tre anni dopo
      l'inaugurazione; quella attuale, del 2005, è una scala sospesa. Sul versante meridionale, un altro
      tracciato collega il centro visite al ponte sospeso Punt da Suransuns e a Zillis, con il circuito
      Viamala Sud che riconduce alla partenza. Il Punt da Suransuns valica direttamente il Reno su un'ansa
      turchese prima che il fiume si incanali nella forra.


      Per un cammino a tappe, la viaSpluga copre oltre 68 km in quattro giornate lungo il corridoio storico
      tra Thusis e Chiavenna: attraversa la Viamala, sfiora la cascata di Roffla, i petroglifi di Carschenna e
      il soffitto medievale della chiesa di San Martino a Zillis.
    history: >-
      La Viamala è anzitutto storia viva. Incisioni rupestri dell'età del bronzo a Carschenna e reperti
      dell'età del bronzo e del ferro documentano un transito someggiato sin dal 1500 a.C. I Romani superarono
      la forra sulla sponda sinistra scavando mezze gallerie nella roccia. Nel tempo il sentiero si degradò, e
      a partire dal XIII secolo la gola e il cammino presero il nome di Viamala.


      Nel 1473 le comunità di Thusis, Masein e Cazis ripristinarono il passaggio ed eressero il ponte in
      pietra Punt da Tgiern. Vi transitarono carovane di muli, mercanti, diplomatici, pionieri del turismo e i
      corrieri postali di Lindau; Goethe disegnò la gola il 1° giugno 1788. La strada rotabile del San
      Bernardino, avviata nel 1818, fu aperta nel 1821 e ultimata verso il 1823. Una piena nel 1834 spazzò via
      il tratto attiguo al Punt da Tgiern: il ponte resse ma divenne inservibile. Nel 1967 l'autostrada A13 ha
      aggirato la stretta principale della gola con una galleria di 742 metri.
    before: >-
      Tieni conto della scalinata: comprende 359 gradini. La gola rimane chiusa da novembre a marzo per
      ragioni di sicurezza. Le visite guidate pubbliche si tengono il giovedì da metà luglio a metà agosto,
      durano circa un'ora e accolgono fino a trenta persone.
    around: >-
      A cinque chilometri si estende l'[Altopiano della
      Greina](/lugar/plaine-de-la-greina---passo-della-greina/), altro scenario selvaggio dei Grigioni.
  pt:
    intro: >-
      «Mau caminho». Assim foi batizado durante séculos este rasgão do Reno Posterior (Hinterrhein), e não se
      tratava de exagero: a Viamala constituiu o estrangulamento mais temido da rota baixa que unia Coira aos
      passos de Splügen e San Bernardino. Hoje o desfiladeiro, no cantão dos Grisões entre Thusis e
      Zillis-Reischen, visita-se descendo uma escadaria de 359 degraus desde o centro de acolhimento até ao
      fundo, entre paredões polidos com até 300 metros de altura. Foram talhados há milénios pelo gelo glaciar
      e pelas águas do Reno Posterior, exibindo ainda marmitas de gigante escavadas pelos turbilhões fluviais.
    landscape: >-
      Imagina o que encontras ao descer ao abismo: rocha lisa polida pelo gelo e pela torrente, e o rio com os
      seus reflexos alpinos. As falésias erguem-se até aos 300 metros, acolhendo marmitas de gigante milenares
      observadas de perto. Sobre esta fenda cruzam-se pontes de épocas distintas: a ponte de Wildener de 1739
      e as modernas passarelas de Conzett.


      O rio contemporâneo já não é a torrente mortal descrita nas crónicas antigas. Salvo um caudal ecológico
      residual, as águas são desviadas por um túnel aberto na montanha ao longo da garganta até às turbinas
      elétricas de Sils. O caudal habitual situa-se entre 0,9 e 2,8 m³ por segundo, quando antigamente no
      verão corriam entre 40 e 70 m³ por segundo. Apenas em cheias pontuais regressa a fúria: em outubro de
      2013 uma enchente alcançou o degrau inferior da escada com um pico de até 280 m³ por segundo.
    wildlife: >-
      Aqui os elementos dominantes são a água e a pedra, e o calendário regula-se pelas cheias e pela
      segurança na garganta. O desfiladeiro encerra no inverno, de novembro a março, por precaução, decorrendo
      as visitas entre a primavera e o outono. No verão, entre meados de julho e meados de agosto,
      organizam-se visitas guiadas públicas às quintas-feiras, narrando a formação geológica e o passado de
      passagem comercial.
    visit: >-
      A descida e subida pela escadaria até ao fundo da garganta requer habitualmente entre trinta a quarenta
      e cinco minutos. Se dispuseres de mais tempo, existem vários trilhos pedestres sinalizados entre Thusis,
      Zillis e Andeer, prestando o centro de acolhimento todas as informações.


      A rota mais procurada é a Veia Traversina, que acompanha de perto a antiga calçada romana. Segue desde
      Thusis por Sils até ao centro de acolhimento, passando pelo castelo de Ehrenfels, pelo complexo de Hohen
      Rätien e pelo Traversinersteg — uma ponte concebida por Jürg Conzett para vencer a ravina mais funda
      entre Sils e a Viamala. A primeira estrutura desmoronou com uma queda de pedras três anos após a
      abertura; a atual, de 2005, forma uma escada suspensa. Na vertente sul, outro percurso liga o centro de
      visitantes à ponte suspensa Punt da Suransuns e a Zillis, regressando o circuito Viamala Sul ao ponto de
      partida. A Punt da Suransuns transpõe diretamente o Reno sobre uma enseada turquesa antes da torrente se
      embrenhar no canhão.


      Para percursos pedestres de vários dias, a viaSpluga percorre mais de 68 km em quatro etapas diárias ao
      longo do antigo corredor entre Thusis e Chiavenna: atravessa a Viamala, a cascata de Roffla, as gravuras
      rupestres de Carschenna e o teto pintado medieval da igreja de São Martinho em Zillis.
    history: >-
      A Viamala encerra séculos de memória. Gravuras rupestres da Idade do Bronze em Carschenna e achados das
      Idades do Bronze e do Ferro comprovam a rota de cargueiros desde 1500 a.C. Os romanos transpassaram a
      garganta pela margem esquerda talhando meias-galerias na rocha. Com o tempo o caminho degradou-se e
      desde o século XIII tanto o desfiladeiro como a rota foram chamados Viamala.


      Em 1473, os municípios de Thusis, Masein e Cazis requalificaram a via e ergueram a ponte de pedra Punt
      da Tgiern. Por ali passaram tropas de mulas, comerciantes, diplomatas, os primeiros viajantes e o
      correio de Lindau; Goethe desenhou o abismo a 1 de junho de 1788. A estrada do San Bernardino, encetada
      em 1818, abriu ao trânsito em 1821 e terminou por volta de 1823. Uma cheia devastadora destruiu em 1834
      o troço contíguo ao Punt da Tgiern: a ponte resistiu, mas ficou inutilizada. Em 1967, a autoestrada A13
      contornou o gargalo mais estreito com um túnel de 742 metros.
    before: >-
      Conta com o desnível da escada: são 359 degraus. A garganta encerra de novembro a março por razões de
      segurança. As visitas guiadas decorrem às quintas-feiras de meados de julho a meados de agosto, duram
      cerca de uma hora e acolhem até trinta pessoas.
    around: >-
      A cinco quilómetros estende-se o [Planalto de Greina](/lugar/plaine-de-la-greina---passo-della-greina/),
      outro recanto agreste dos Grisões.
