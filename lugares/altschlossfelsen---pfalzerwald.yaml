resumen:
  es: >-
    Muralla masiva de arenisca roja de 1,5 km de longitud y 30 m de altura en el corazón del bosque de
    Pfälzerwald.
  en: Massive red sandstone rampart 1.5 km long and 30 m high set in the heart of the Pfälzerwald forest.
  fr: Muraille massive de grès rouge de 1,5 km de long et 30 m de haut au cœur de la forêt du Pfälzerwald.
  de: Massive Buntsandstein-Felsmauer von 1,5 km Länge und 30 m Höhe im Herzen des Pfälzerwalds.
  it: Muraglia compatta di arenaria rossa lunga 1,5 km e alta 30 m nel cuore della foresta del Pfälzerwald.
  pt: >-
    Muralha maciça de arenito vermelho com 1,5 km de extensão e 30 m de altura no coração da floresta de
    Pfälzerwald.
unico:
  es: >-
    Un muro de arenisca roja de kilómetro y medio donde, en abril, la luz hace arder las rocas, y en lo alto
    las huellas de un castillo medieval.
  en: >-
    A red sandstone barrier a kilometer and a half long where April light sets the crags ablaze, topped with
    traces of a medieval castle.
  fr: >-
    Un rempart de grès rouge d'un kilomètre et demi où, en avril, la lumière embrase la roche, surmonté des
    traces d'un château médiéval.
  de: >-
    Eine eineinhalb Kilometer lange rote Felswand, an der im April das Abendlicht die Felsen erglühen lässt,
    gekrönt von Spuren einer mittelalterlichen Burg.
  it: >-
    Una parete di arenaria rossa di un chilometro e mezzo dove, ad aprile, la luce infiamma le rocce,
    sormontata dai resti di un castello medievale.
  pt: >-
    Uma barreira de arenito vermelho de quilómetro e meio onde a luz de abril faz arder a rocha, coroada por
    vestígios de um castelo medieval.
observaciones:
  es: >-
    Las rocas son de acceso libre todo el año. Calcula una hora de camino desde Eppenbrunn o Roppeviller. Si
    buscas el Felsenglühen, ve en la primera quincena de abril, por la tarde o por la mañana temprano.
texto:
  es:
    intro: >-
      En la primera quincena de abril, hacia las siete de la tarde, la cara sureste de una roca del bosque
      parece arder. Es el Felsenglühen, el «fulgor de las rocas», y ocurre en las Altschlossfelsen, un muro de
      arenisca roja de kilómetro y medio de largo y hasta treinta metros de alto, en el Pfälzerwald, junto a
      Eppenbrunn y pegado a la frontera con Francia. Es la mayor formación rocosa del Palatinado, y además
      tiene su historia: en sus cuatro rocas principales quedan restos de un castillo medieval.
    landscape: >-
      Las Altschlossfelsen son un conjunto de torres y paredes de arenisca del Buntsandstein, surcadas de
      grietas y fisuras, algunas lo bastante anchas para pasar entre ellas. La roca se formó en el Pérmico y
      el Triásico, hace más de 250 millones de años, cuando se acumularon más de 500 metros de sedimentos en
      lo que hoy es el Pfälzerwald. El óxido de hierro le dio su color rojo, y la forma que ves hoy se la debe
      a la erosión de los últimos cinco millones de años. El viento y el tiempo han esculpido cuatro torres
      muy juntas y el peñón principal.


      Arriba, en la meseta de la cima, el bosque se aclara y las piedras están cubiertas de musgo. Las rocas
      son conocidas por sus formas de erosión y por sus líquenes raros, y las torres naranja y rojizas
      acompañan el sendero durante 1,5 km. En el Pfälzerwald, la mayor zona forestal continua de Alemania,
      conviven bosques mixtos, valles de prados, torres de roca y ruinas de castillos.
    wildlife: >-
      En el Pfälzerwald viven [corzo](/especie/capreolus_capreolus/), [ciervo rojo](/especie/cervus_elaphus/)
      y jabalí, y especies amenazadas como los murciélagos, la marta, el [gato
      montés](/especie/felis_silvestris/) y el [lince](/especie/lynx_lynx/). Es la fauna del bosque que rodea
      las rocas.


      La estación fuerte aquí es la primavera. En la primera quincena de abril, hacia las 19:00, el sol
      enciende la cara sureste de la tercera roca desde Eppenbrunn; por la mañana, el efecto aparece hacia las
      8:45. Depende del tiempo, de la vegetación y de la posición del sol. Las rocas están abiertas todo el
      año.
    visit: >-
      Solo se llega a pie. Desde Eppenbrunn o desde Roppeviller, en Francia, hay una hora de camino. El camino
      habitual es el Altschlosspfad, un sendero premium: sale del aparcamiento del Hotel Kupper, sigue el
      arroyo Eppenbrunner Bach, pasa junto al Teufelstisch, cruza el valle de Martelbach y continúa por la
      frontera franco-alemana hasta las rocas. Las torres de arenisca acompañan el camino durante 1,5 km;
      luego un sendero estrecho baja por un portal de roca hasta el monumento natural Hohler Fels, y la ruta
      vuelve a Eppenbrunn por el estanque del pueblo.


      Alrededor de las rocas hay otros senderos, integrados en rutas circulares como el Grenzweg y el
      Helmut-Kohl-Wanderweg. En la roca sur hay un mirador con vistas al Wasgau francés.
    history: >-
      Hallazgos de las épocas de Hallstatt y romana atestiguan un poblamiento antiguo de las rocas, y en 1964
      aparecieron cerámicas de La Tène. En las cuatro rocas principales hay restos de un castillo medieval de
      los siglos XI o XII, probablemente levantado por los condes de Zweibrücken-Bitche después de 1279. Para
      1605 ya se habían borrado los rastros visibles. En una roca hay una cavidad de cuatro metros de diámetro
      que pudo servir de cisterna.


      El macizo quedó protegido como monumento en 1991. El Pfälzerwald, junto con los Vosgos del Norte, forma
      la única reserva de biosfera transfronteriza de Alemania, reconocida por la UNESCO.
    before: >-
      Las rocas son de acceso libre todo el año. Calcula una hora de camino desde Eppenbrunn o Roppeviller. Si
      buscas el Felsenglühen, ve en la primera quincena de abril, por la tarde o por la mañana temprano.
    around: >-
      A solo un kilómetro está el [Parque Natural Regional de los Vosgos del
      Norte](/lugar/parc-naturel-regional-des-vosges-du-nord/), el socio francés de la reserva de biosfera del
      Pfälzerwald.
  en:
    intro: >-
      During the first half of April, around seven in the evening, the southeastern cliff of a woodland
      formation appears to catch fire. This is the Felsenglühen, the "rock glow," which takes place at the
      Altschlossfelsen: a red sandstone wall a kilometer and a half long and up to thirty meters high in the
      Pfälzerwald, near Eppenbrunn right along the French frontier. It is the largest single rock formation in
      the Palatinate, complete with human history: fragments of a medieval castle linger across its four main
      towers.
    landscape: >-
      The Altschlossfelsen form an imposing alignment of Buntsandstein towers and cliff bands, scored by deep
      clefts and fissures wide enough to walk through. The sandstone formed during the Permian and Triassic
      periods over 250 million years ago, when more than 500 meters of sediments accumulated across what is
      now the Pfälzerwald. Iron oxide lent the stone its vivid red hue, while weathering over the past five
      million years sculpted the relief visible today. Wind and frost have carved four tightly clustered rock
      pillars alongside the primary cliff massif.


      Up on the summit plateau, the surrounding woodland thins and boulders are carpeted in soft moss. The
      rocks are renowned for honeycomb weathering structures and rare epilithic lichens, while vibrant
      orange-red towers flank the hiking trail for 1.5 km. The Pfälzerwald—the largest contiguous forest tract
      in Germany—interweaves mixed woodlands, open meadow vales, sandstone towers, and medieval castle ruins.
    wildlife: >-
      The Pfälzerwald shelters [roe deer](/especie/capreolus_capreolus/), [red
      deer](/especie/cervus_elaphus/), and wild boar, alongside vulnerable forest mammals including bats, pine
      martens, the [wildcat](/especie/felis_silvestris/), and the [Eurasian lynx](/especie/lynx_lynx/). This
      is the wildlife roaming the forest that envelops the rocks.


      The defining season here is spring. In the first half of April, around 19:00, low evening sunlight
      illuminates the southeastern flank of the third tower from Eppenbrunn; in the morning, a counterpart
      effect appears near 8:45. The phenomenon depends closely on cloud cover, budding foliage, and solar
      angles. The rocks remain open year-round.
    visit: >-
      The site can be reached solely on foot. From either Eppenbrunn or Roppeviller in France, walking time is
      about one hour. The standard approach is the Altschlosspfad, a certified premium trail: departing from
      the Hotel Kupper parking area, following the Eppenbrunner Bach stream, passing the Teufelstisch outcrop,
      crossing the Martelbach valley, and continuing along the Franco-German border to the foot of the cliffs.
      The sandstone pillars guide the path for 1.5 km; a narrow track then descends through a natural rock
      portal to the Hohler Fels natural monument, with the circular route returning to Eppenbrunn via the
      village pond.


      Additional waymarked footpaths encircle the formation, integrated into wider networks like the Grenzweg
      and the Helmut-Kohl-Wanderweg. The southern summit vantage point looks across to the French Wasgau.
    history: >-
      Archaeological artifacts from the Hallstatt and Roman periods confirm ancient human presence at the
      rocks, and in 1964 La Tène pottery sherds were unearthed. The four main rock towers preserve traces of a
      medieval cliff castle from the eleventh or twelfth century, likely built by the Counts of
      Zweibrücken-Bitche after 1279. By 1605 visible remains had already largely deteriorated. A circular
      cavity measuring four meters in diameter chiseled into the rock surface may have functioned as a
      rainwater cistern.


      The entire rock group was declared a protected monument in 1991. The Pfälzerwald, together with the
      Northern Vosges, forms Germany's only transboundary UNESCO Biosphere Reserve.
    before: >-
      The rocks are freely accessible year-round. Allow about an hour of walking from either Eppenbrunn or
      Roppeviller. If you wish to witness the Felsenglühen, visit during the first half of April in early
      morning or late afternoon.
    around: >-
      Just one kilometer away lies the [Northern Vosges Regional Nature
      Park](/lugar/parc-naturel-regional-des-vosges-du-nord/), the French counterpart in the cross-border
      Pfälzerwald biosphere reserve.
  fr:
    intro: >-
      Dans la première quinzaine d'avril, vers sept heures du soir, la paroi sud-est d'un rocher forestier
      semble prendre feu. C'est le Felsenglühen, « l'embrasement des rochers », qui illumine les
      Altschlossfelsen : une muraille de grès rouge d'un kilomètre et demi de long et jusqu'à trente mètres de
      haut, dans le Pfälzerwald, près d'Eppenbrunn et contre la frontière française. Il s'agit du plus grand
      ensemble rocheux du Palatinat, enrichi d'histoire : sur ses quatre pitons majeurs subsistent les
      vestiges d'un château médiéval.
    landscape: >-
      Les Altschlossfelsen forment un alignement de tours et de falaises de grès bigarré (Buntsandstein),
      zébré de failles et de crevasses parfois assez larges pour s'y glisser. La roche s'est déposée au
      Permien et au Trias il y a plus de 250 millions d'années, lorsque plus de 500 mètres de sédiments se
      sont accumulés dans ce qui constitue aujourd'hui le Pfälzerwald. Les oxydes de fer lui confèrent sa
      teinte ocre rouge, et l'érosion des cinq derniers millions d'années a sculpté le relief actuel. Le vent
      et le gel ont isolé quatre tours serrées et l'éperon principal.


      Sur le plateau sommital, la forêt s'éclaircit et les dalles rocheuses se couvrent de mousses. Les parois
      sont réputées pour leurs alvéoles d'érosion et leurs lichens rares, tandis que les pitons orange et
      pourpres bordent le sentier sur 1,5 km. Dans le Pfälzerwald, le plus vaste massif boisé d'un seul tenant
      d'Allemagne, alternent forêts mixtes, vallons herbeux, tours de grès et ruines castrales.
    wildlife: >-
      Le Pfälzerwald abrite le [chevreuil](/especie/capreolus_capreolus/), le [cerf
      élaphe](/especie/cervus_elaphus/) et le sanglier, ainsi que des mammifères forestiers vulnérables tels
      que chauves-souris, martres, le [chat forestier](/especie/felis_silvestris/) et le [lynx
      boréal](/especie/lynx_lynx/). C'est la faune de la forêt entourant les falaises.


      Le temps fort reste le printemps. Durant la première quinzaine d'avril, vers 19:00, le soleil rasant
      embrase la face sud-est du troisième rocher depuis Eppenbrunn ; le matin, le phénomène se produit vers
      8:45. L'effet dépend de la météo, de la feuillaison et de l'axe solaire. Le site demeure ouvert toute
      l'année.
    visit: >-
      L'accès s'effectue exclusivement à pied. Depuis Eppenbrunn ou Roppeviller en France, comptez une heure
      de marche. Le parcours classique emprunte l'Altschlosspfad, sentier labellisé : partant du parking de
      l'hôtel Kupper, il longe le ruisseau Eppenbrunner Bach, passe près du Teufelstisch, franchit le vallon
      de Martelbach et suit la frontière franco-allemande jusqu'aux falaises. Les tours de grès escortent le
      chemin sur 1,5 km ; puis une sente descend par un porche rocheux jusqu'au monument naturel du Hohler
      Fels, avant de revenir à Eppenbrunn par l'étang du village.


      D'autres itinéraires balisés sillonnent les environs, comme le Grenzweg et le Helmut-Kohl-Wanderweg. Le
      rocher sud offre un belvédère ouvert sur le Wasgau français.
    history: >-
      Des objets d'époque hallstattienne et romaine attestent d'une fréquentation antique, complétée en 1964
      par des poteries de La Tène. Sur les quatre pitons subsistent les traces d'un château troglodytique des
      XIe ou XIIe siècles, vraisemblablement édifié par les comtes de Deux-Ponts-Bitche après 1279. Dès 1605,
      ses structures visibles avaient déjà disparu. Une fosse circulaire de quatre mètres de diamètre creusée
      dans la roche servait sans doute de citerne à eau.


      Le site a été classé monument naturel en 1991. Le Pfälzerwald et les Vosges du Nord composent la seule
      réserve de biosphère transfrontalière d'Allemagne reconnue par l'UNESCO.
    before: >-
      L'accès aux rochers est libre toute l'année. Prévoyez une heure de marche depuis Eppenbrunn ou
      Roppeviller. Pour admirer le Felsenglühen, privilégiez la première quinzaine d'avril en fin d'après-midi
      ou tôt le matin.
    around: >-
      À un kilomètre seulement commence le [parc naturel régional des Vosges du
      Nord](/lugar/parc-naturel-regional-des-vosges-du-nord/), versant français de la réserve de biosphère
      transfrontalière.
  de:
    intro: >-
      In der ersten Aprilhälfte gegen sieben Uhr abends scheint die Südostwand eines Waldmassivs zu brennen.
      Es ist das Felsenglühen an den Altschlossfelsen: ein anderthalb Kilometer langes und bis zu dreißig
      Meter hohes Felsenriff aus Buntsandstein im Pfälzerwald bei Eppenbrunn direkt an der französischen
      Grenze. Es ist die größte Felsformation der Pfalz, geschichtsträchtig zudem: Auf ihren vier Hauptfelsen
      finden sich Reste einer mittelalterlichen Felsenburg.
    landscape: >-
      Die Altschlossfelsen bilden ein Ensemble aus Türmen und Wänden des Buntsandsteins, durchzogen von
      Spalten und Klüften, die teils gangbar sind. Der Sandstein entstand im Perm und in der Trias vor über
      250 Millionen Jahren, als sich im heutigen Pfälzerwald mehr als 500 Meter Sedimente ablagerten.
      Eisenoxide gaben dem Gestein die rote Färbung, und die Verwitterung der letzten fünf Millionen Jahre
      schuf die heutigen Formen. Wind und Wetter modellierten vier eng stehende Türme und das Hauptmassiv
      heraus.


      Auf dem Felsplateau lichtet sich der Wald, und die Felsbänke sind bemoost. Die Wände sind bekannt für
      Wabenverwitterung und seltene Flechten; die orangeroten Sandsteintürme begleiten den Pfad auf 1,5 km
      Länge. Im Pfälzerwald, dem größten zusammenhängenden Waldgebiet Deutschlands, treffen Mischwälder,
      Wiesentäler, Felsburgen und Ruinen zusammen.
    wildlife: >-
      Im Pfälzerwald streifen [Reh](/especie/capreolus_capreolus/), [Rothirsch](/especie/cervus_elaphus/) und
      Wildschwein umher, dazu seltene Waldbewohner wie Fledermäuse, Baummarder,
      [Wildkatze](/especie/felis_silvestris/) und [Eurasischer Luchs](/especie/lynx_lynx/). Sie bilden die
      Tierwelt der Forste um das Felsenriff.


      Die Hauptattraktion ist der Frühling. In der ersten Aprilhälfte gegen 19:00 entzündet die tief stehende
      Abendsonne die Südostwand des dritten Felsens von Eppenbrunn aus; morgens zeigt sich das Phänomen gegen
      8:45. Das Felsenglühen hängt von Wetter, Belaubung und Sonnenstand ab. Die Felsen sind ganzjährig
      zugänglich.
    visit: >-
      Das Felsmassiv ist nur zu Fuß erreichbar. Von Eppenbrunn oder Roppeviller in Frankreich benötigt man
      etwa eine Stunde Gehzeit. Die beliebteste Route ist der Altschlosspfad, ein Premiumwanderweg: Er startet
      am Parkplatz des Hotels Kupper, folgt dem Eppenbrunner Bach, passiert den Teufelstisch, durchquert das
      Martelbachtal und zieht an der deutsch-französischen Grenze zu den Felsen. Die Sandsteintürme säumen den
      Weg auf 1,5 km Länge; danach führt ein schmaler Pfad durch ein Felsentor zum Naturdenkmal Hohler Fels
      und über den Dorfweiher zurück nach Eppenbrunn.


      Weitere Wanderwege wie der Grenzweg und der Helmut-Kohl-Wanderweg binden die Felsen ein. Vom Südfelsen
      bietet sich ein weiter Blick ins französische Wasgau.
    history: >-
      Funde aus der Hallstatt- und Römerzeit belegen eine frühe Begehung des Felsens; 1964 wurden
      La-Tène-Scherben geborgen. Auf den vier Hauptfelsen liegen die Reste einer mittelalterlichen Felsenburg
      aus dem elften oder zwölften Jahrhundert, wohl nach 1279 von den Grafen von Zweibrücken-Bitsch
      errichtet. Um 1605 waren die Baureste bereits verfallen. Eine vier Meter weite Felsmulde diente
      vermutlich als Regenwasserzisterne.


      Das Massiv wurde 1991 als Naturdenkmal geschützt. Der Pfälzerwald bildet zusammen mit den Nordvogesen
      das einzige grenzüberschreitende UNESCO-Biosphärenreservat Deutschlands.
    before: >-
      Die Felsen sind das ganze Jahr frei zugänglich. Plane etwa eine Gehzeitstunde von Eppenbrunn oder
      Roppeviller ein. Wer das Felsenglühen erleben möchte, sollte die erste Aprilhälfte am späten Nachmittag
      oder frühen Vormittag wählen.
    around: >-
      Nur einen Kilometer entfernt beginnt der [Regionale Naturpark
      Nordvogesen](/lugar/parc-naturel-regional-des-vosges-du-nord/), der französische Teil des
      grenzüberschreitenden Biosphärenreservats.
  it:
    intro: >-
      Nella prima metà di aprile, verso le sette di sera, la parete sud-orientale di uno sperone boscoso
      sembra prendere fuoco. È il Felsenglühen, il «bagliore delle rocce», visibile alle Altschlossfelsen: una
      muraglia di arenaria rossa lunga un chilometro e mezzo e alta fino a trenta metri, nel Pfälzerwald,
      vicino a Eppenbrunn a ridosso del confine francese. È la maggiore conformazione rocciosa del Palatinato,
      impreziosita da tracce storiche: sui suoi quattro speroni principali affiorano i ruderi di un castello
      medievale.
    landscape: >-
      Le Altschlossfelsen compongono un allineamento di torri e pareti di arenaria variegata (Buntsandstein),
      solcato da fessure e corridoi talvolta transitabili. La roccia si formò nel Permiano e nel Triassico
      oltre 250 milioni di anni fa, quando si accumularono più di 500 metri di sedimenti nell'area
      dell'odierno Pfälzerwald. Gli ossidi di ferro hanno impresso la tinta rossa, mentre l'erosione degli
      ultimi cinque milioni di anni ha scolpito il rilievo attuale. Vento e gelo hanno isolato quattro
      torrioni ravvicinati e la scogliera maggiore.


      Sulla sommità pianeggiante il bosco si apre e i lastroni sono ricoperti da muschio. Le pareti sono note
      per le forme alveolari e per i licheni rari, mentre le quinte rocciose arancioni e rossastre
      fiancheggiano il cammino per 1,5 km. Nel Pfälzerwald, la più vasta area forestale continua della
      Germania, convivono boschi misti, valli prative, castelli e pinnacoli di roccia.
    wildlife: >-
      Nel Pfälzerwald vivono il [capriolo](/especie/capreolus_capreolus/), il [cervo
      nobile](/especie/cervus_elaphus/) e il cinghiale, insieme a specie forestali minacciate quali
      chirotteri, martore, il [gatto selvatico](/especie/felis_silvestris/) e la [lince
      europea](/especie/lynx_lynx/). È la tipica fauna dei grandi boschi che circondano le rupi.


      Il momento privilegiato è la primavera. Nella prima metà di aprile, verso le 19:00, la luce radente del
      tramonto illumina la fronte sud-est del terzo sperone provenendo da Eppenbrunn; al mattino l'effetto si
      ripete verso le 8:45. Il fenomeno dipende dalle condizioni meteo, dal fogliame e dall'azimut solare. Le
      rupi sono accessibili tutto l'anno.
    visit: >-
      Il sito si raggiunge esclusivamente a piedi. Da Eppenbrunn o da Roppeviller in Francia si calcola un'ora
      di cammino. L'itinerario più frequentato è l'Altschlosspfad, sentiero escursionistico certificato: parte
      dal parcheggio dell'Hotel Kupper, segue il ruscello Eppenbrunner Bach, passa accanto al Teufelstisch,
      risale la valletta di Martelbach e costeggia la frontiera franco-tedesca fino alle rupi. I torrioni di
      arenaria affiancano il sentiero per 1,5 km; poi una traccia scende per un arco di roccia verso il
      monumento naturale Hohler Fels, tornando a Eppenbrunn lungo lo stagno del paese.


      Altri percorsi segnati collegano le rupi, come il Grenzweg e l'Helmut-Kohl-Wanderweg. Sulla roccia
      meridionale si apre un belvedere verso il Wasgau francese.
    history: >-
      Reperti di epoca hallstattiana e romana testimoniano un'antica frequentazione delle rupi, confermata nel
      1964 dal ritrovamento di ceramiche di La Tène. Sui quattro speroni principali sopravvivono le tracce di
      un castello rupestre dei secoli XI o XII, probabilmente edificato dai conti di Zweibrücken-Bitsch dopo
      il 1279. Già nel 1605 le strutture murarie erano andate distrutte. Una cavità circolare di quattro metri
      di diametro scavata nella pietra fungeva forse da cisterna.


      Il massiccio è protetto come monumento naturale dal 1991. Il Pfälzerwald forma con i Vosgi del Nord
      l'unica riserva della biosfera transfrontaliera della Germania riconosciuta dall'UNESCO.
    before: >-
      Le rupi sono ad accesso libero tutto l'anno. Metti in conto un'ora di cammino da Eppenbrunn o
      Roppeviller. Per ammirare il Felsenglühen, vieni nella prima metà di aprile, al tramonto o nelle prime
      ore del mattino.
    around: >-
      Ad appena un chilometro comincia il [Parco Naturale Regionale dei Vosgi del
      Nord](/lugar/parc-naturel-regional-des-vosges-du-nord/), il settore francese della riserva
      transfrontaliera.
  pt:
    intro: >-
      Na primeira quinzena de abril, por volta das sete da tarde, a vertente sudeste de uma crista rochosa
      parece incendiar-se. Trata-se do Felsenglühen, o «resplendor das rochas», que ocorre nas
      Altschlossfelsen: uma muralha de arenito vermelho com quilómetro e meio de comprimento e até trinta
      metros de altura, no Pfälzerwald, junto a Eppenbrunn e encostada à fronteira francesa. É a maior
      formação rochosa do Palatinado e guarda história: nos seus quatro penedos principais resistem ruínas de
      um castelo medieval.
    landscape: >-
      As Altschlossfelsen reúnem torres e escarpas de arenito do Buntsandstein, recortadas por fendas e
      frestas transitáveis a pé. A rocha originou-se no Pérmico e no Triásico há mais de 250 milhões de anos,
      quando se acumularam mais de 500 metros de sedimentos no território atual do Pfälzerwald. Os óxidos de
      ferro deram-lhe a cor avermelhada, enquanto a erosão dos últimos cinco milhões de anos talhou o relevo
      contemporâneo. O vento e os ciclos de gelo esculpiram quatro torres contíguas e o esporão principal.


      No topo aplanado a mata abre-se e os blocos surgem atapetados de musgo. As paredes destacam-se pelo
      rendilhado erosivo em favo de mel e líquenes raros, com as torres alaranjadas a ladearem o trilho ao
      longo de 1,5 km. No Pfälzerwald, a maior mancha florestal contínua da Alemanha, coexistem florestas
      mistas, vales relvados, torres de arenito e fortalezas arruinadas.
    wildlife: >-
      No Pfälzerwald habitam o [corço](/especie/capreolus_capreolus/), o
      [veado-vermelho](/especie/cervus_elaphus/) e o javali, bem como espécies florestais vulneráveis como
      morcegos, a marta, o [gato-bravo](/especie/felis_silvestris/) e o
      [lince-euroasiático](/especie/lynx_lynx/). É a fauna típica da mata em torno dos rochedos.


      A estação privilegiada é a primavera. Na primeira metade de abril, cerca das 19:00, o sol poente ilumina
      a face sudeste do terceiro bloco a partir de Eppenbrunn; pela manhã, o fenómeno repete-se por volta das
      8:45. O efeito depende da nebulosidade, da folhagem e da trajetória solar. O acesso mantém-se
      desimpedido todo o ano.
    visit: >-
      O acesso faz-se unicamente a pé. A partir de Eppenbrunn ou de Roppeviller em França calcula-se uma hora
      de caminhada. A rota habitual é o Altschlosspfad, um percurso pedestre certificado: inicia-se no parque
      do Hotel Kupper, segue a ribeira Eppenbrunner Bach, passa junto ao Teufelstisch, cruza o vale de
      Martelbach e avança ao longo da fronteira franco-alemã até aos rochedos. As torres de arenito marginam o
      caminho durante 1,5 km; em seguida, uma vereda desce por um portal rochoso rumo ao monumento natural
      Hohler Fels, regressando a Eppenbrunn pela lagoa da aldeia.


      Outros trilhos balizados contornam as rochas, como o Grenzweg e o Helmut-Kohl-Wanderweg. No penedo sul
      abre-se um miradouro com vistas sobre o Wasgau francês.
    history: >-
      Achados das épocas de Hallstatt e romana confirmam a ocupação antiga das rochas, tendo sido recolhidas
      cerâmicas de La Tène em 1964. Nos quatro penedos subsistem vestígios de uma fortaleza rupestre dos
      séculos XI ou XII, erguida provavelmente pelos condes de Zweibrücken-Bitsch após 1279. Em 1605 as
      estruturas tinham desaparecido. Uma cavidade circular com quatro metros de diâmetro esculpida na rocha
      serviu decerto de cisterna.


      O conjunto rochoso foi declarado monumento natural em 1991. O Pfälzerwald e os Vosgos do Norte integram
      a única Reserva da Biosfera transfronteiriça alemã reconhecida pela UNESCO.
    before: >-
      As rochas são de visitação livre todo o ano. Preveja uma hora de marcha a partir de Eppenbrunn ou
      Roppeviller. Para observar o Felsenglühen, planeie a visita para a primeira quinzena de abril ao fim da
      tarde ou ao romper do dia.
    around: >-
      A apenas um quilómetro situa-se o [Parque Natural Regional dos Vosgos do
      Norte](/lugar/parc-naturel-regional-des-vosges-du-nord/), a secção francesa da reserva da biosfera
      transfronteiriça.
