resumen:
  es: >-
    Mesetas calizas cortadas por desfiladeros estrechos que se remontan por escalas y pasarelas sobre
    cascadas.
  en: Limestone plateaus cut by narrow gorges climbed via ladders and footbridges over waterfalls.
  fr: >-
    Plateaux calcaires entaillés de défilés étroits que l'on remonte par des échelles et des passerelles
    au-dessus des cascades.
  de: >-
    Kalksteinplateaus, zerschnitten von engen Schluchten, die man über Leitern und Stege über Wasserfällen
    erklimmt.
  it: Altopiani calcarei intagliati da gole strette che si risalgono tramite scale e passerelle sopra cascate.
  pt: >-
    Planaltos calcários recortados por desfiladeiros estreitos que se sobem por escadas e passadiços sobre
    cascatas.
unico:
  es: >-
    Se camina por dentro de la roca, remontando cascadas, y se acaba el día en una cueva de hielo declarada
    Patrimonio Mundial.
  en: >-
    You walk inside the rock, climbing waterfalls, and end the day in an ice cave declared a World Heritage
    Site.
  fr: >-
    On chemine au cœur de la roche en escaladant des cascades, pour terminer la journée dans une grotte de
    glace inscrite au patrimoine mondial.
  de: >-
    Man wandert mitten im Fels, klettert Wasserfälle hinauf und beendet den Tag in einer Eishöhle, die zum
    Weltkulturerbe gehört.
  it: >-
    Si cammina all'interno della roccia risalendo cascate e si conclude la giornata in una grotta di ghiaccio
    dichiarata Patrimonio Mondiale.
  pt: >-
    Caminha-se por entre a rocha subindo cascatas e termina-se o dia numa gruta de gelo classificada como
    Património Mundial.
observaciones:
  es: >-
    A pie solo se puede ir por senderos señalizados, desde una hora después del amanecer hasta una hora antes
    del anochecer. Los perros solo pueden ir con correa y bozal, y no pasan por las escalas de las gargantas.
    Comprueba el estado de los senderos antes de salir, porque las gargantas pueden cerrarse con el agua alta.
texto:
  es:
    intro: >-
      Aquí el senderismo se parece a trepar por el interior de una cascada. En Slovenský raj los ríos han
      cortado una meseta de caliza en pedazos y han dejado gargantas tan estrechas y profundas que el camino
      las remonta por escalas, cadenas, peldaños metálicos y puentes, siempre contra la corriente. Es el
      parque nacional de los barrancos con cascadas: un laberinto de cañones, cuevas y bosques que cubre el 90
      % del territorio y que, desde hace décadas, es el primer lugar de Eslovaquia que mereció protección como
      paisaje.
    landscape: >-
      El núcleo del parque es una meseta kárstica cortada en mesetas más pequeñas por gargantas profundas. La
      causa está en la roca: casi todo el territorio es roca sedimentaria del Mesozoico, dolomía y arenisca, y
      al ser carbonatada se karstifica. Estas montañas se alzaron en el Terciario y el Cuaternario, y la red
      de ríos fue excavando valles estrechos y profundos. El protagonista es el Hornád, que con sus afluentes
      ha formado cañones, valles, cascadas y cuevas.


      Las gargantas más famosas son Veľký Sokol, la más larga, con 4,5 km, Suchá Belá, Piecky y Kyseľ, todas
      con cascadas. El Prielom Hornádu es el cañón más largo, con 11,7 km, y el de mayor diversidad de
      especies. La cascada más alta es Závojový vodopád, con 70 m. Y la cumbre más alta del parque es Predná
      hoľa, con 1545 m.


      Bajo tierra, el karst sigue: hay unas 350 cuevas, pero solo la cueva de hielo de Dobšiná, Patrimonio
      Mundial desde 2000, está abierta al público.


      El bosque lo cubre casi todo. Dominan el haya, el abeto rojo, el abeto blanco y el pino. En los prados
      de Kopanecké lúky crecen más de 75 especies de plantas vasculares en un solo metro cuadrado.
    wildlife: >-
      Es un parque de gran fauna y de pequeños detalles. Hay cuarenta especies de mamíferos, entre ellas el
      [oso pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/), el [lince](/especie/lynx_lynx/),
      el [gato montés](/especie/felis_silvestris/), la [gamuza](/especie/rupicapra_rupicapra/) y la marmota.
      Viven también 65 especies amenazadas, entre ellas el [halcón sacre](/especie/falco_cherrug/), la
      [nutria](/especie/lutra_lutra/) y la [ardilla de tierra europea](/especie/spermophilus_citellus/).


      A escala menor, Slovenský raj tiene la mayor concentración de mariposas de Eslovaquia, con más de 2100
      especies. La víbora común es una de las pocas serpientes presentes: evita a las personas y solo ataca si
      se la provoca. Y en cuanto a plantas, hay 930 especies, 35 de ellas protegidas, seis endémicas
      exclusivas de la zona y 19 endémicas de los Cárpatos Occidentales.


      El parque está abierto todo el año, pero con lluvia y el agua alta pueden cerrarse las gargantas. La
      temporada principal va de mayo a octubre, y en Suchá Belá la afluencia es alta en verano.
    visit: >-
      Dos centros turísticos abren el norte del parque: Čingov y Podlesok, unidos por una ruta señalizada de
      15 km que sigue el cañón del Hornád. Desde allí, el Prielom Hornádu es una de las rutas más visitadas.
      Otro punto muy visitado es el mirador rocoso de Tomášovský výhľad, famoso por su vista. En el sur está
      Dedinky, junto al embalse de Palcmanská Maša, donde se permite navegar en bote y practicar deportes
      acuáticos, salvo lanchas rápidas y a motor.


      Las gargantas se recorren solo en sentido ascendente, contra la corriente, por seguridad. Hay escalas y
      peldaños metálicos, y hace falta buena forma y calzado firme. Para una salida más tranquila, el circuito
      educativo de Geravy, que incluye la garganta Zejmarská, es de dificultad media. El parque tiene 13
      senderos educativos que suman casi 89 km, y es una de las redes de senderos señalizados más densas de
      Eslovaquia.


      En bici, hay 110 km de ciclorrutas señalizadas, 65 de ellas dentro del parque; fuera de ellas solo se
      puede ir en bici con guía.
    history: >-
      El nombre lo trajeron los monjes cartujos, que fundaron un monasterio en 1299 y lo llamaron en latín
      «paradisus». El nombre Slovenský raj, tal como lo conoces, apareció por primera vez en 1921 en la
      revista Krásy Slovenska. Este paisaje es lo que queda de la «Silva nigra», la Montaña Negra, un gran
      bosque entre los ríos Hornád y Slaná. Hay indicios de ocupación humana desde la Edad de Piedra, y las
      minas de cobre, hierro y plata impulsaron la metalurgia, la silvicultura y la producción de carbón
      vegetal.


      La protección llegó pronto: la primera reserva se fundó en 1890, la primera planta protegida fue el
      edelweiss en 1936, el 21 de agosto de 1964 se creó el primer paisaje protegido de Eslovaquia y el 18 de
      enero de 1988 pasó a ser parque nacional. Desde 2004 partes del parque forman parte de la red Natura
      2000.
    before: >-
      A pie solo se puede ir por senderos señalizados, desde una hora después del amanecer hasta una hora
      antes del anochecer. Los perros solo pueden ir con correa y bozal, y no pasan por las escalas de las
      gargantas. Comprueba el estado de los senderos antes de salir, porque las gargantas pueden cerrarse con
      el agua alta.
    around: >-
      A 9 km queda el [Parque Nacional Muránska Planina](/lugar/narodny-park-muranska-planina---pralesove/), y
      a 18 km el [Tatranský národný park](/lugar/tatransky-narodny-park/). A unos 30 km, ya en Polonia, está
      el [Tatrzański Park Narodowy](/lugar/tatrzanski-park-narodowy/). Más lejos, los [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), en la frontera franco-suiza, comparten con Slovenský
      raj los hábitats de garganta y karst, y el lince.
  en:
    intro: >-
      Hiking here feels like scaling the inside of a waterfall. In Slovenský raj, rivers have carved a
      limestone plateau into pieces, leaving gorges so narrow and sheer that footpaths climb them via ladders,
      chains, metal rungs, and footbridges, always heading against the current. It is the national park of
      waterfall-filled ravines: a maze of canyons, caves, and forests covering 90 % of the territory and, for
      decades, the first place in Slovakia deemed worthy of landscape protection.
    landscape: >-
      The park's core is a karst plateau dissected into smaller tablelands by deep ravines. The explanation
      lies in the rock: nearly the entire territory is Mesozoic sedimentary rock, dolomite and sandstone,
      which karstifies readily as carbonate stone. These mountains rose during the Tertiary and Quaternary,
      and the drainage network carved steep, narrow valleys. The protagonist is the Hornád river, which
      together with its tributaries shaped canyons, gorges, waterfalls, and caves.


      The most renowned gorges are Veľký Sokol, the longest at 4.5 km, Suchá Belá, Piecky, and Kyseľ, all
      adorned with cascades. The Prielom Hornádu is the longest canyon, at 11.7 km, and boasts the highest
      species diversity. The tallest cascade is Závojový vodopád, tumbling 70 m. And the highest peak in the
      park is Predná hoľa, rising to 1545 m.


      Underground, the karst endures: around 350 caves exist, but only the Dobšiná Ice Cave, a World Heritage
      site since 2000, is open to the public.


      Woodland blankets nearly everything. Beech, Norway spruce, silver fir, and Scots pine prevail. In the
      Kopanecké lúky meadows, more than 75 species of vascular plants thrive within a single square metre.
    wildlife: >-
      This is a park of large mammals and intricate micro-details. Forty species of mammals occur, among them
      the [brown bear](/especie/ursus_arctos/), the [grey wolf](/especie/canis_lupus/), the [Eurasian
      lynx](/especie/lynx_lynx/), the [European wildcat](/especie/felis_silvestris/), the
      [chamois](/especie/rupicapra_rupicapra/), and the alpine marmot. It also shelters 65 endangered species,
      including the [saker falcon](/especie/falco_cherrug/), the [Eurasian otter](/especie/lutra_lutra/), and
      the [European ground squirrel](/especie/spermophilus_citellus/).


      On a smaller scale, Slovenský raj holds Slovakia's greatest concentration of butterflies, with over 2100
      species. The common viper is one of few snakes present: it avoids people and strikes only when provoked.
      As for plants, 930 species are documented, 35 of them protected, six endemic exclusively to the area,
      and 19 endemic to the Western Carpathians.


      The park remains open year-round, though heavy rain and high water can lead to gorge closures. The main
      season spans May to October, and visitor traffic in Suchá Belá is high in summer.
    visit: >-
      Two tourist hubs open up the park's northern flank: Čingov and Podlesok, joined by a marked 15 km route
      tracing the Hornád canyon. From there, the Prielom Hornádu ranks among the most visited routes. Another
      highly popular vantage point is the rocky viewpoint of Tomášovský výhľad, celebrated for its panoramic
      vista. To the south lies Dedinky on the shores of the Palcmanská Maša reservoir, where boating and water
      sports are permitted, with the exception of motorboats and speedboats.


      Gorges are strictly hiked in an upstream direction, against the current, for safety. Metal ladders and
      rungs are installed, requiring good fitness and sturdy footwear. For a gentler outing, the Geravy nature
      circuit, which incorporates the Zejmarská gorge, is moderately easy. The park features 13 nature trails
      totalling nearly 89 km, forming one of the densest networks of marked trails in Slovakia.


      For cyclists, there are 110 km of signposted bike trails, 65 of them within the park; off these trails,
      cycling is allowed only with a guide.
    history: >-
      The name was bestowed by Carthusian monks, who established a monastery here in 1299 and christened it
      "paradisus" in Latin. The name Slovenský raj, as you know it, first appeared in 1921 in the journal
      Krásy Slovenska. This landscape represents what remains of the "Silva nigra", the Black Mountain, a vast
      forest tract between the Hornád and Slaná rivers. Traces of human presence date back to the Stone Age,
      while copper, iron, and silver mines later spurred metallurgy, forestry, and charcoal production.


      Conservation came early: the first reserve was created in 1890, the first protected plant was the
      edelweiss in 1936, Slovakia's first protected landscape area was established on 21 August 1964, and on
      18 January 1988 it became a national park. Since 2004, parts of the park have been integrated into the
      Natura 2000 network.
    before: >-
      Pedestrian access is permitted only along marked trails, from one hour after sunrise until one hour
      before sunset. Dogs must be kept on a leash and muzzled, and cannot tackle the gorge ladders. Check
      trail conditions before setting out, as high water levels can cause gorges to close.
    around: >-
      9 km away lies [Muránska Planina National Park](/lugar/narodny-park-muranska-planina---pralesove/), and
      at 18 km [Tatranský národný park](/lugar/tatransky-narodny-park/). Around 30 km off, across in Poland,
      is [Tatrzański Park Narodowy](/lugar/tatrzanski-park-narodowy/). Further afield, the [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) along the Franco-Swiss border share gorge and karst
      habitats, as well as the lynx, with Slovenský raj.
  fr:
    intro: >-
      Ici, la randonnée ressemble à une escalade à l'intérieur même d'une cascade. Dans le Slovenský raj, les
      cours d'eau ont taillé un plateau calcaire en lambeaux, laissant des gorges si étroites et profondes que
      le sentier les gravit au moyen d'échelles, de chaînes, d'échelons métalliques et de passerelles,
      toujours à contre-courant. C'est le parc national des ravins à cascades : un dédale de défilés, de
      grottes et de forêts qui recouvre 90 % du territoire et constitue, depuis des décennies, le premier site
      de Slovaquie à avoir bénéficié d'une protection paysagère.
    landscape: >-
      Le cœur du parc est un plateau karstique morcelé en tables secondaires par de profonds défilés. La
      raison tient à la roche : la quasi-totalité du territoire est formée de roches sédimentaires
      mésozoïques, dolomies et grès, propices à la karstification. Ces reliefs se sont soulevés au Tertiaire
      et au Quaternaire, et le réseau hydrographique y a entaillé des vallées étroites et profondes. Le grand
      artisan en est le Hornád, qui a sculpté avec ses affluents des défilés, des vallées, des cascades et des
      grottes.


      Les gorges les plus renommées sont Veľký Sokol, la plus longue avec 4,5 km, Suchá Belá, Piecky et Kyseľ,
      toutes parées de chutes d'eau. Le Prielom Hornádu est le plus long canyon avec 11,7 km et le plus riche
      en diversité d'espèces. La plus haute cascade est Závojový vodopád, haute de 70 m. Enfin, le point
      culminant du parc est Predná hoľa, qui culmine à 1545 m.


      Sous terre, le karst se poursuit : on dénombre environ 350 grottes, mais seule la grotte de glace de
      Dobšiná, inscrite au patrimoine mondial depuis 2000, est ouverte au public.


      La forêt recouvre presque tout. Le hêtre, l'épicéa, le sapin blanc et le pin y règnent. Dans les prés de
      Kopanecké lúky, plus de 75 espèces de plantes vasculaires prospèrent sur un seul mètre carré.
    wildlife: >-
      C'est un parc de grande faune et d'infinis détails. Quarante espèces de mammifères y résident, parmi
      lesquelles l'[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/), le [lynx
      boréal](/especie/lynx_lynx/), le [chat sauvage](/especie/felis_silvestris/), le
      [chamois](/especie/rupicapra_rupicapra/) et la marmotte des Alpes. On y compte aussi 65 espèces
      menacées, dont le [faucon sacre](/especie/falco_cherrug/), la [loutre d'Europe](/especie/lutra_lutra/)
      et le [souslik d'Europe](/especie/spermophilus_citellus/).


      À plus petite échelle, le Slovenský raj concentre la plus forte diversité de papillons de Slovaquie avec
      plus de 2100 espèces. La vipère péliade compte parmi les rares serpents présents : elle fuit l'homme et
      n'attaque que si on la provoque. Côté flore, on recense 930 espèces, dont 35 protégées, six endémiques
      strictes du massif et 19 endémiques des Carpates occidentales.


      Le parc reste ouvert toute l'année, mais les pluies abondantes et les crues peuvent entraîner la
      fermeture des gorges. La saison principale s'étend de mai à octobre, et la fréquentation est très forte
      à Suchá Belá en été.
    visit: >-
      Deux pôles touristiques ouvrent l'accès au nord du massif : Čingov et Podlesok, reliés par un itinéraire
      balisé de 15 km qui longe le canyon du Hornád. De là, le Prielom Hornádu figure parmi les parcours les
      plus empruntés. Un autre belvédère très couru est l'éperon rocheux de Tomášovský výhľad, réputé pour son
      panorama. Au sud se dresse Dedinky, au bord de la retenue de Palcmanská Maša, propice au canotage et aux
      activités nautiques, à l'exclusion des embarcations à moteur rapide.


      Les gorges se parcourent exclusivement dans le sens de la montée, face au courant, pour des motifs de
      sécurité. Le franchissement fait appel à des échelles et passerelles en fer, réclamant une bonne
      condition physique et des chaussures stables. Pour une sortie plus douce, la boucle pédagogique de
      Geravy, empruntant le défilé Zejmarská, propose une difficulté moyenne. Le parc offre 13 sentiers
      thématiques totalisant près de 89 km, constituant l'un des réseaux de chemins balisés les plus denses de
      Slovaquie.


      À vélo, on trouve 110 km d'itinéraires cyclables balisés, dont 65 à l'intérieur du parc ; hors de ces
      tracés, la pratique du vélo n'est autorisée qu'accompagnée d'un guide.
    history: >-
      Ce toponyme trouve son origine chez les moines chartreux, qui fondèrent un monastère en 1299 et
      nommèrent les lieux « paradisus » en latin. Le nom Slovenský raj, tel que vous le connaissez, est apparu
      pour la première fois en 1921 dans la revue Krásy Slovenska. Ce paysage correspond aux restes de la «
      Silva nigra », la Montagne Noire, vaste massif forestier étendu entre l'Hornád et la Slaná. Des traces
      d'occupation humaine remontent à l'âge de la pierre, tandis que l'exploitation du cuivre, du fer et de
      l'argent favorisa par la suite la métallurgie, la sylviculture et la production de charbon de bois.


      La protection a été précoce : la première réserve vit le jour en 1890, la première plante protégée fut
      l'edelweiss en 1936, le 21 août 1964 fut créé le premier paysage protégé de Slovaquie et le 18 janvier
      1988 il devint parc national. Depuis 2004, plusieurs secteurs du parc sont intégrés au réseau Natura
      2000.
    before: >-
      À pied, la progression est limitée aux sentiers balisés, d'une heure après le lever du soleil à une
      heure avant le coucher du soleil. Les chiens ne sont admis que tenus en laisse et muselés, et ne peuvent
      pas franchir les échelles des gorges. Vérifiez l'état des chemins avant de partir, car les fortes eaux
      peuvent entraîner la fermeture de défilés.
    around: >-
      À 9 km s'étend le [parc national de Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/), et à 18 km le [Tatranský národný
      park](/lugar/tatransky-narodny-park/). À environ 30 km, en Pologne voisine, se trouve le [Tatrzański
      Park Narodowy](/lugar/tatrzanski-park-narodowy/). Plus loin, les [gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), sur la frontière franco-suisse, partagent avec le
      Slovenský raj des habitats de gorges karstiques et la présence du lynx.
  de:
    intro: >-
      Wandern gleicht hier einer Kletterpartie im Inneren eines Wasserfalls. Im Slovenský raj haben Flüsse ein
      Kalkplateau in Stücke zersägt und Schluchten hinterlassen, die so eng und tief sind, dass der Weg sie
      über Leitern, Ketten, Eisensprossen und Stege überwindet – immer gegen die Strömung. Es ist der
      Nationalpark der klammartigen Schluchten mit Wasserfällen: ein Labyrinth aus Schluchten, Höhlen und
      Wäldern, das 90 % des Gebiets bedeckt und seit Jahrzehnten als erste Landschaft der Slowakei überhaupt
      unter Landschaftsschutz gestellt wurde.
    landscape: >-
      Das Kerngebiet des Parks ist ein Karstplateau, das von tiefen Schluchten in kleinere Tafeln unterteilt
      wird. Die Ursache liegt im Gestein: Nahezu das gesamte Gebiet besteht aus mesozoischen
      Sedimentgesteinen, Dolomit und Sandstein, die als Karbonatgesteine verkarsten. Diese Berge hoben sich im
      Tertiär und Quartär, woraufhin das Gewässernetz tiefe, enge Täler einschnitt. Hauptakteur ist der
      Hornád, der mit seinen Zuflüssen Schluchten, Täler, Wasserfälle und Höhlen geschaffen hat.


      Die bekanntesten Schluchten sind Veľký Sokol, mit 4,5 km die längste, Suchá Belá, Piecky und Kyseľ,
      allesamt reich an Kaskaden. Der Prielom Hornádu ist mit 11,7 km der längste Canyon und birgt die höchste
      Artenvielfalt. Der höchste Wasserfall ist der Závojový vodopád mit 70 m Fallhöhe. Und der höchste Gipfel
      im Park ist die Predná hoľa mit 1545 m.


      Unter der Erde setzt sich der Karst fort: Rund 350 Höhlen sind bekannt, doch nur die Dobšiná-Eishöhle,
      seit 2000 UNESCO-Welterbe, steht Besuchern offen.


      Wald bedeckt fast das gesamte Gebiet. Es dominieren Rotbuche, Gemeine Fichte, Weiß-Tanne und
      Wald-Kiefer. Auf den Kopanecké lúky wachsen über 75 Gefäßpflanzenarten auf einem einzigen Quadratmeter.
    wildlife: >-
      Der Park besticht durch Großwild und winzige Wunder. Vierzig Säugetierarten kommen vor, darunter
      [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/), [Eurasischer
      Luchs](/especie/lynx_lynx/), [Wildkatze](/especie/felis_silvestris/),
      [Gämse](/especie/rupicapra_rupicapra/) und Alpenmurmeltier. Hinzu kommen 65 bedrohte Tierarten, darunter
      der [Sakerfalke](/especie/falco_cherrug/), der [Eurasische Fischotter](/especie/lutra_lutra/) und der
      [Europäische Ziesel](/especie/spermophilus_citellus/).


      Im Kleinen weist der Slovenský raj mit über 2100 Arten die dichteste Schmetterlingsfauna der Slowakei
      auf. Die Kreuzotter ist eine der wenigen vorkommenden Schlangenarten: Sie meidet den Menschen und beißt
      nur bei Provokation. Bei den Pflanzen zählen Botaniker 930 Arten, von denen 35 geschützt, sechs
      ausschließlich hier endemisch und 19 Endemiten der Westkarpaten sind.


      Der Park ist ganzjährig zugänglich, doch bei Starkregen und Hochwasser können Schluchten gesperrt
      werden. Die Hauptsaison reicht von Mai bis Oktober; in der Suchá Belá ist der Andrang im Sommer hoch.
    visit: >-
      Zwei Touristenzentren erschließen den Norden des Parks: Čingov und Podlesok, verbunden durch eine 15 km
      lange markierte Route entlang des Hornád-Canyons. Von dort zählt der Prielom Hornádu zu den
      meistbegangenen Wegen. Ein weiterer Publikumsmagnet ist der Felsvorsprung Tomášovský výhľad, berühmt für
      seine Aussicht. Im Süden liegt Dedinky am Stausee Palcmanská Maša, wo Ruderboote und Wassersport
      gestattet sind – Schnellboote und Motorboote ausgenommen.


      Aus Sicherheitsgründen dürfen die Schluchten nur flussaufwärts begangen werden, also gegen die Strömung.
      Es gibt Leitern und Metalltritte; gute Trittsicherheit und feste Wanderschuhe sind unerlässlich.
      Gemächlicher verläuft der Lehrpfad Geravy über die Zejmarská-Klamm mit mittlerem Anspruch. Der Park
      verfügt über 13 Lehrpfade von zusammen fast 89 km Länge und bildet eines der dichtesten Wanderwegnetze
      der Slowakei.


      Für Radfahrer stehen 110 km markierte Radrouten bereit, davon 65 km innerhalb des Parks; abseits davon
      ist Radfahren nur mit Guide erlaubt.
    history: >-
      Den Namen prägten Kartäusermönche, die 1299 ein Kloster gründeten und den Ort auf Latein „paradisus“
      nannten. Der Name Slovenský raj, wie du ihn kennst, erschien erstmals 1921 in der Zeitschrift Krásy
      Slovenska. Diese Landschaft ist das Überbleibsel der „Silva nigra“, des Schwarzen Berges, eines
      ausgedehnten Waldgebiets zwischen Hornád und Slaná. Spuren menschlicher Besiedlung reichen bis in die
      Steinzeit zurück; Kupfer-, Eisen- und Silberbergbau kurbelten später Hüttenwesen, Forstwirtschaft und
      Köhlerei an.


      Der Naturschutz griff früh: Das erste Schutzgebiet entstand 1890, als erste Pflanze wurde 1936 das
      Edelweiß unter Schutz gestellt, am 21. August 1964 wurde die erste Landschaftsschutzzone der Slowakei
      geschaffen und am 18. Januar 1988 der Nationalpark ausgerufen. Seit 2004 sind Teilflächen Teil des
      Schutzgebietsnetzes Natura 2000.
    before: >-
      Zu Fuß darf man sich nur auf markierten Wegen bewegen, von einer Stunde nach Sonnenaufgang bis eine
      Stunde vor Sonnenuntergang. Hunde dürfen nur an der Leine und mit Maulkorb mitgeführt werden und können
      die Schluchtleitern nicht passieren. Erkundige dich vor der Tour nach dem Zustand der Steige, da
      Schluchten bei Hochwasser gesperrt sein können.
    around: >-
      In 9 km Entfernung liegt der [Nationalpark Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/) und in 18 km der [Tatranský národný
      park](/lugar/tatransky-narodny-park/). Rund 30 km entfernt, bereits auf polnischer Seite, erstreckt sich
      der [Tatrzański Park Narodowy](/lugar/tatrzanski-park-narodowy/). Weiter entfernt teilen die [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) an der französisch-schweizerischen Grenze mit dem
      Slovenský raj Schlucht- und Karstlebensräume sowie das Vorkommen des Luchses.
  it:
    intro: >-
      Qui camminare assomiglia a scalare l'interno di una cascata. Nel Slovenský raj i corsi d'acqua hanno
      sezionato un altopiano calcareo lasciando forre così strette e profonde che i sentieri le risalgono con
      scale a pioli, catene, gradini metallici e ponticelli, procedendo sempre controcorrente. È il parco
      nazionale delle gole a cascata: un labirinto di orridi, caverne e boschi che ricopre il 90 % del
      territorio e che, da decenni, rappresenta la prima area della Slovacchia tutelata per il suo paesaggio.
    landscape: >-
      Il cuore del parco è un altopiano carsico frazionato in rilievi minori da gole profonde. La causa
      risiede nella roccia: quasi l'intero territorio è formato da rocce sedimentarie mesozoiche, dolomia e
      arenaria, soggette a carsificazione. Questi monti si sollevarono nel Terziario e nel Quaternario, e la
      rete fluviale scavò valli ripide e anguste. Il protagonista è l'Hornád, che assieme ai suoi affluenti ha
      modellato canyon, valli, cascate e caverne.


      Le forre più celebri sono Veľký Sokol, la più lunga con 4,5 km, Suchá Belá, Piecky e Kyseľ, tutte
      impreziosite da balzi d'acqua. Il Prielom Hornádu costituisce il canyon più esteso, con 11,7 km, e vanta
      la maggiore ricchezza biologica. La cascata più alta è Závojový vodopád, con 70 m di salto. Il rilievo
      sommitale del parco è invece Predná hoľa, a 1545 m di altitudine.


      Nel sottosuolo il carsismo prosegue: si contano circa 350 grotte, ma soltanto la grotta di ghiaccio di
      Dobšiná, Patrimonio Mondiale dal 2000, è aperta alle visite.


      Il bosco ammanta quasi ogni pendio. Prevalgono faggio, abete rosso, abete bianco e pino silvestre. Nelle
      radure di Kopanecké lúky crescono oltre 75 specie di piante vascolari in un solo metro quadrato.
    wildlife: >-
      È un parco che unisce grande fauna e preziosi dettagli. Vi risiedono quaranta specie di mammiferi, tra
      cui l'[orso bruno](/especie/ursus_arctos/), il [lupo grigio](/especie/canis_lupus/), la
      [lince](/especie/lynx_lynx/), il [gato selvatico](/especie/felis_silvestris/), il [camoscio
      alpino](/especie/rupicapra_rupicapra/) e la marmotta. Vi vivono inoltre 65 specie minacciate, tra le
      quali il [sacro](/especie/falco_cherrug/), la [lontra europea](/especie/lutra_lutra/) e il
      [citello](/especie/spermophilus_citellus/).


      Su scala ridotta, il Slovenský raj ospita la maggior concentrazione di farfalle della Slovacchia, con
      oltre 2100 specie. Il marasso è uno dei pochi rettili presenti: schiva l'uomo e reagisce solo se
      provocato. Quanto alla flora, si contano 930 specie, di cui 35 protette, sei endemismi esclusivi del
      massiccio e 19 endemismi dei Carpazi Occidentali.


      Il parco rimane accessibile tutto l'anno, ma piogge intense e portate sostenute possono causare la
      chiusura dei canaloni. La stagione principale copre da maggio a ottobre, e a Suchá Belá l'affluenza è
      elevata d'estate.
    visit: >-
      Due basi turistiche introducono al settore settentrionale: Čingov e Podlesok, raccordate da una via
      segnata di 15 km che costeggia il canyon dell'Hornád. Da lì, il Prielom Hornádu è una delle mete
      escursionistiche più frequentate. Altro punto panoramico celebre è la terrazza rocciosa di Tomášovský
      výhľad, nota per la veduta aerea. A sud sorge Dedinky, sulle sponde del bacino di Palcmanská Maša, dove
      è possibile andare in barca ed esercitare sport acquatici, a eccezione di motoscafi e imbarcazioni a
      motore.


      Le gole si percorrono unicamente in salita, controcorrente, per motivi di sicurezza. La progressione si
      avvale di scale e staffe di metallo, che richiedono buona forma fisica e scarpe adatte. Per una
      camminata più tranquilla, l'anello didattico di Geravy, che attraversa la gola Zejmarská, offre una
      difficoltà moderata. Il comprensorio annovera 13 sentieri tematici che totalizzano quasi 89 km,
      componendo una delle reti escursionistiche più fitte della Slovacchia.


      Su due ruote, si sviluppano 110 km di percorsi ciclabili segnati, 65 dei quali interni al parco; al di
      fuori di tali tracciati la bicicletta è consentita solo con accompagnatore.
    history: >-
      Il toponimo fu coniato dai monaci certosini, che vi edificarono un monastero nel 1299 chiamandolo in
      latino «paradisus». La dicitura Slovenský raj, nella forma in cui la conosci, apparve per la prima volta
      nel 1921 sulla rivista Krásy Slovenska. Il territorio odierno è quanto resta dell'antica «Silva nigra»,
      la Montagna Nera, un vasto manto boschivo tra i fiumi Hornád e Slaná. Tracce umane risalgono all'età
      della pietra, mentre l'estrazione di rame, ferro e argento alimentò in seguito siderurgia, silvicoltura
      e carbonaie.


      La salvaguardia arrivò presto: la prima riserva fu istituita nel 1890, la prima pianta protetta fu la
      stella alpina nel 1936, il 21 agosto 1964 nacque la prima area paesaggistica protetta della Slovacchia e
      il 18 gennaio 1988 fu elevata a parco nazionale. Dal 2004 porzioni del parco sono inglobate nella rete
      Natura 2000.
    before: >-
      A piedi è obbligatorio procedere lungo i sentieri segnati, da un'ora dopo l'alba fino a un'ora prima del
      tramonto. I cani sono ammessi soltanto con guinzaglio e museruola, e non possono affrontare le scale
      delle forre. Accertati delle condizioni dei percorsi prima di incamminarti, poiché le piene possono
      imporre la chiusura dei passaggi.
    around: >-
      A 9 km si trova il [Parco Nazionale Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/), e a 18 km il [Tatranský národný
      park](/lugar/tatransky-narodny-park/). A circa 30 km, oltre il confine polacco, sorge il [Tatrzański
      Park Narodowy](/lugar/tatrzanski-park-narodowy/). Più distante, le [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), alla frontiera franco-svizzera, condividono con il
      Slovenský raj ambienti di forra carsica e la presenza della lince.
  pt:
    intro: >-
      Fazer caminhadas aqui assemelha-se a escalar pelo interior de uma cascata. No Slovenský raj, os rios
      cortaram um planalto de calcário em pedaços, deixando gargantas tão estreitas e fundas que os trilhos as
      sobem através de escadas, correntes, degraus metálicos e pontes, sempre em sentido contrário à corrente.
      É o parque nacional das ravinas com cascatas: um labirinto de canhões, grutas e matas que cobre 90 % do
      território e que, há décadas, se tornou o primeiro local da Eslováquia a merecer proteção paisagística.
    landscape: >-
      O núcleo do parque é um planalto cárstico retalhado em mesetas menores por desfiladeiros profundos. A
      razão reside na rocha: quase todo o território é composto por rochas sedimentares do Mesozoico, dolomito
      e arenito, que por serem carbonatadas sofrem carsificação. Estas montanhas ergueram-se no Terciário e no
      Quaternário, e a rede hidrográfica escavou vales estreitos e fundos. O protagonista é o rio Hornád, que
      com os seus afluentes modelou desfiladeiros, vales, cascatas e grutas.


      As gargantas mais célebres são Veľký Sokol, a mais extensa com 4,5 km, Suchá Belá, Piecky e Kyseľ, todas
      pontuadas por cascatas. O Prielom Hornádu é o canhão mais longo, com 11,7 km, e o que exibe maior
      diversidade biológica. A cascata mais alta é Závojový vodopád, com 70 m de queda. Já o pico mais elevado
      do parque é Predná hoľa, com 1545 m.


      No subsolo, o carste prolonga-se: contam-se cerca de 350 grutas, mas apenas a gruta de gelo de Dobšiná,
      Património Mundial desde 2000, está aberta ao público.


      A floresta cobre quase tudo. Predominam a faia, o abeto-falso, o abeto-branco e o pinheiro-silvestre.
      Nos prados de Kopanecké lúky chegam a crescer mais de 75 espécies de plantas vasculares num único metro
      quadrado.
    wildlife: >-
      É um parque que conjuga grande fauna e pormenores subtis. Registam-se quarenta espécies de mamíferos,
      entre os quais o [urso-pardo](/especie/ursus_arctos/), o [lobo-cinzento](/especie/canis_lupus/), o
      [lince-euroasiático](/especie/lynx_lynx/), o [gato-bravo](/especie/felis_silvestris/), a
      [camurça](/especie/rupicapra_rupicapra/) e a marmota-alpina. Habitam também 65 espécies ameaçadas, entre
      as quais o [falcão-sacre](/especie/falco_cherrug/), a [lontra-europeia](/especie/lutra_lutra/) e o
      [esquilo-terrestre-europeu](/especie/spermophilus_citellus/).


      A menor escala, o Slovenský raj apresenta a maior concentração de borboletas da Eslováquia, com mais de
      2100 espécies. A víbora-comum é uma das poucas cobras presentes: evita o contacto humano e só reage se
      molestada. Quanto às plantas, contabilizam-se 930 espécies, 35 delas protegidas, seis endémicas
      exclusivas do maciço e 19 endémicas dos Cárpatos Ocidentais.


      O parque encontra-se aberto todo o ano, mas chuvas intensas e caudais elevados podem motivar o
      encerramento de desfiladeiros. A temporada principal prolonga-se de maio a outubro, registando-se
      afluência elevada em Suchá Belá durante o verão.
    visit: >-
      Dois núcleos turísticos dão acesso ao norte do parque: Čingov e Podlesok, interligados por um itinerário
      sinalizado de 15 km que acompanha o canhão do Hornád. A partir daí, o Prielom Hornádu surge como uma das
      rotas mais procuradas. Outro miradouro célebre é a plataforma rochosa de Tomášovský výhľad, afamada
      pelas suas vistas. A sul situa-se Dedinky, junto à albufeira de Palcmanská Maša, onde é permitida a
      navegação a remo e a prática de desportos aquáticos, com exceção de lanchas rápidas e embarcações a
      motor.


      Os desfiladeiros são percorridos unicamente em sentido ascendente, contra a corrente, por motivos de
      segurança. Existem escadas e degraus de ferro, o que exige boa forma e calçado seguro. Para um passeio
      mais suave, o circuito educativo de Geravy, que abrange o desfiladeiro Zejmarská, apresenta dificuldade
      média. O parque soma 13 trilhos pedagógicos que totalizam quase 89 km, compondo uma das redes de
      percursos sinalizados mais densas da Eslováquia.


      Para bicicletas, estão disponíveis 110 km de ciclovias sinalizadas, 65 dos quais no interior do parque;
      fora dessas pistas o ciclismo só é autorizado na companhia de guia.
    history: >-
      A designação provém dos monges cartuxos, que aqui fundaram um mosteiro em 1299 batizando o local em
      latim como «paradisus». O nome Slovenský raj, na forma como o conheces, surgiu pela primeira vez em 1921
      na revista Krásy Slovenska. Esta paisagem corresponde ao remanescente da «Silva nigra», a Montanha
      Negra, uma vasta mancha florestal estendida entre os rios Hornád e Slaná. Vestígios de presença humana
      remontam à Idade da Pedra, tendo as minas de cobre, ferro e prata impulsionado mais tarde a metalurgia,
      a silvicultura e a laboração de carvoarias.


      A proteção chegou cedo: a primeira reserva nasceu em 1890, a primeira espécie vegetal protegida foi o
      edelvaisse em 1936, a 21 de agosto de 1964 instituiu-se a primeira paisagem protegida da Eslováquia e a
      18 de janeiro de 1988 foi declarada parque nacional. Desde 2004, parcelas do parque integram a rede
      Natura 2000.
    before: >-
      A deslocação a pé está restrita aos trilhos sinalizados, desde uma hora após o amanhecer até uma hora
      antes do pôr do sol. Os cães só são admitidos com trela e açaime, e não conseguem transpor as escadas
      dos desfiladeiros. Confirma o estado dos trilhos antes da partida, dado que as cheias podem ditar o
      encerramento dos canhões.
    around: >-
      A 9 km situa-se o [Parque Nacional de Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/) e a 18 km o [Tatranský národný
      park](/lugar/tatransky-narodny-park/). A cerca de 30 km, já em território polaco, encontra-se o
      [Tatrzański Park Narodowy](/lugar/tatrzanski-park-narodowy/). Mais longe, as [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/), na fronteira franco-suíça, partilham com o Slovenský
      raj os habitats de desfiladeiro cárstico e a presença do lince.
