resumen:
  es: El filtro biológico natural del lago Balatón formado por extensos carrizales y colonias acuáticas.
  en: The natural biological water filter of Lake Balaton formed by extensive reedbeds and aquatic colonies.
  fr: >-
    Le filtre biologique naturel du lac Balaton constitué d’immenses roselières et de riches colonies
    aquatiques.
  de: >-
    Der natürliche biologische Wasserfilter des Plattensees aus weiten Röhrichtmeeren und artenreichen
    Feuchtbiotopen.
  it: Il biofiltro naturale delle acque del lago Balaton, composto da canneti sconfinati e colonie aviarie.
  pt: O filtro biológico natural do lago Balaton, formado por extensos caniçais e colónias de aves aquáticas.
unico:
  es: >-
    Un humedal que el hombre secó, que dejó al Balatón sin su filtro y que, reinundado, recibió en su primer
    año a decenas de miles de aves migratorias.
  en: >-
    A wetland drained by human hand that deprived Balaton of its natural filter, whose re-flooding welcomed
    tens of thousands of migratory birds in its very first year.
  fr: >-
    Une zone humide asséchée par l’homme qui priva le Balaton de son filtre, dont la remise en eau attira dès
    la première année des dizaines de milliers d’oiseaux.
  de: >-
    Ein Feuchtgebiet, das durch Trockenlegung den Plattensee seines Filters beraubte und nach Wiedervernässung
    sofort Zehntausende Zugvögel anzog.
  it: >-
    Una palude bonificata dall’uomo che lasciò il Balaton senza il suo filtro naturale, la cui risonanza ha
    richiamato decine di migliaia di uccelli fin dal primo anno.
  pt: >-
    Um paul drenado pelo ser humano que privou o Balaton do seu filtro e que, reinundado, atraiu logo no
    primeiro ano dezenas de milhares de aves.
observaciones:
  es: >-
    No se puede salir de los itinerarios señalizados. Lleva ropa y calzado de senderismo, porque se recomienda
    en todos los senderos naturales. Cerca de humedales y lagos el perro debe ir atado, para proteger a las
    aves acuáticas, y no debe bañarse en esas aguas.
texto:
  es:
    intro: >-
      Hace dos siglos el Kis-Balaton no era un sitio aparte: formaba una unidad con el lago Balatón y era un
      brazo de él. El río Zala llegaba a su desembocadura, se encontraba con una gran superficie de agua y
      allí dejaba sus sedimentos y su materia orgánica antes de entrar en el lago. Era un filtro natural, y
      todo lo que vino después se explica por haberlo perdido y haberlo reconstruido. Hoy el Kis-Balaton, «el
      pequeño Balatón», es un humedal de cañaverales, eneales y carrizales junto al Balatón, y su zona más
      protegida solo se pisa con un guía del parque.
    landscape: >-
      El Kis-Balaton ocupa la desembocadura del río Zala, una zona siempre pantanosa y famosa por las fuertes
      variaciones de su nivel de agua. Los carrizales y cañaverales que lo cubren funcionan como filtro
      natural, y los alrededores del agua cambian en pocos pasos: junto a los grandes cañaverales, eneales y
      carrizales hay bosques pantanosos, praderas húmedas, sauzales, alisedas y robledales. En el agua flotan
      nenúfares blancos y amarillos y otras plantas acuáticas, y entre las rarezas botánicas figura la planta
      con flores más pequeña del mundo.
    wildlife: >-
      El Kis-Balaton se conoce sobre todo por sus aves. Cuando se inundó el embalse en los años ochenta, las
      aves acuáticas volvieron a lugares antes desiertos, y no tardaron: desde el primer año llegaron decenas
      de miles de aves migratorias a descansar o a pasar el invierno. Hoy se han identificado 250 especies.


      Entre las garzas, el emblema es la [garceta grande](/especie/egretta_alba/), que acompaña a la [garceta
      común](/especie/egretta_garzetta/), la [garza real](/especie/ardea_cinerea/) y la [garza
      imperial](/especie/ardea_purpurea/). Entre los patos destacan el porrón pardo y el [pato
      colorado](/especie/netta_rufina/), y el [ánsar común](/especie/anser_anser/) cría y se ve en enormes
      bandadas migratorias e invernantes. El cormorán pigmeo, extinguido en Hungría, volvió a aparecer a
      finales del siglo XX. Entre las rapaces destacan el [aguilucho lagunero](/especie/circus_aeruginosus/),
      que cría en el carrizal, y el [pigargo europeo](/especie/haliaeetus_albicilla/), que se alimenta de
      peces.


      También hay animales menos vistosos. La [nutria](/especie/lutra_lutra/) tiene aquí una población
      importante, en los bosques viven martas y en los carrizales, chacales dorados. El topillo nórdico,
      superviviente de la Edad de Hielo, vive en los cañaverales frescos, y su mayor población húngara está en
      el Kis-Balaton. Dos peces protegidos, la [umbra europea](/especie/umbra_krameri/) y la Misgurnus
      fossilis, son muy abundantes, y en las aguas se ven a menudo la culebra de collar, la culebra teselada y
      el [galápago europeo](/especie/emys_orbicularis/) tomando el sol.
    visit: >-
      Hay dos maneras de entrar. La zona estrictamente protegida solo se visita con guía de la dirección del
      parque, y en las visitas guiadas los guías profesionales explican la historia, el patrimonio natural y
      la rica avifauna. Para reducir las molestias solo se organiza una visita por día, de martes a domingo, y
      puede empezar antes de las 9 de la mañana si se pacta de antemano, para ver más aves. Lleva prismáticos.


      Quien no quiera guía tiene la isla Kányavári, junto a Balatonmagyaród, que se puede visitar sin
      restricciones. Allí está el sendero natural del Somormujo Lavanco, abierto todo el año, y dos torres de
      observación desde las que, con buenos prismáticos y algo de suerte, se asoma uno al mundo del humedal.
      El sendero natural de la Garceta Grande, en la isla Diás, solo se recorre por acuerdo previo, como parte
      de la visita a la cabaña de Matula y al memorial de István Fekete.


      Esa cabaña de juncos recuerda el ambiente de la novela Tüskevár, escrita por Fekete sobre el Kis-Balaton
      y publicada en 1957, y se visita con guía desde el centro de visitantes. Cerca hay otros dos lugares de
      exposición: la reserva de búfalos de Kápolnapuszta y la Casa Inclinada de Vörs.
    history: >-
      El Kis-Balaton perdió su agua en dos tiempos. En el siglo XIX, las obras de regulación por el
      ferrocarril de la orilla sur hicieron bajar mucho el nivel del lago, y desde el siglo XX los
      agricultores drenaron los humedales y abrieron canales para ganar tierra de cultivo. A mediados del
      siglo XX ya no filtraba, y la calidad del agua del Balatón empeoró con rapidez.


      La respuesta llegó en los años setenta: un sistema de protección del agua que volvería a inundar el
      Kis-Balaton y a rehabilitar el humedal. La obra se hizo en dos fases, con el lago Hídvégi listo en 1985
      y la inundación del lago Fenéki a mediados de los años 2000, con apoyo de la Unión Europea. El humedal
      se regeneró deprisa.


      La protección también fue por pasos. El Kis-Balaton está protegido a nivel nacional desde 1951, figura
      en la lista Ramsar desde 1979 y es unidad Natura 2000 desde 2004. En 1951 entró en el registro con 1403
      ha; en 1986 se amplió a unos 150 km² como área protegida del paisaje, y desde 1997 forma parte del
      Parque Nacional.
    before: >-
      No se puede salir de los itinerarios señalizados. Lleva ropa y calzado de senderismo, porque se
      recomienda en todos los senderos naturales. Cerca de humedales y lagos el perro debe ir atado, para
      proteger a las aves acuáticas, y no debe bañarse en esas aguas.
    around: >-
      Sin vecinos cercanos en el atlas, el Kis-Balaton se parece más a lugares lejanos que comparten su
      garceta grande y su pigargo europeo: el [Parque Nacional de
      Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/), la [Reserva de la Biosfera de
      Srebarna](/lugar/srebarna-biosphere-reserve/) y, con la nutria, la [Reserva Científica del Bajo
      Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/).
  en:
    intro: >-
      Two centuries ago Kis-Balaton was not a separate entity: it formed an unbroken bay of Lake Balaton
      itself. The Zala River reached its delta, entering a vast expanse of open water where it deposited
      suspended silt and organic sediments before feeding into the main lake. It served as a giant natural
      biofilter, and everything that followed arose from losing it and painstakingly rebuilding it. Today
      Kis-Balaton («Little Balaton») is a sprawling wilderness of reed swamps, bulrushes, and marshland beside
      Lake Balaton, whose core sanctuary may only be entered alongside an official park guide.
    landscape: >-
      Kis-Balaton occupies the delta of the Zala River, a wetland depression historically subject to sharp
      water level fluctuations. Its dense reedbeds function as a living water treatment system. Surrounding
      environments transition swiftly: beside towering Phragmites and Typha marshes grow swamp forests, wet
      meadows, willow carrs, alder woods, and oak groves. Sheltered open waters cradle white and yellow
      water-lilies, and botanical curiosities include the world’s smallest flowering plant (rootless
      duckweed).
    wildlife: >-
      Kis-Balaton is celebrated primarily for its rich avifauna. When reservoir basins were re-flooded in the
      eighties, aquatic birds returned en masse to previously desiccated flats: tens of thousands of migratory
      waterbirds touched down to rest or winter in the first year alone. To date, 250 bird species have been
      recorded.


      Among herons, the emblem is the [*Egretta alba*](/especie/egretta_alba/) (great egret), joined by the
      [little egret](/especie/egretta_garzetta/), [grey heron](/especie/ardea_cinerea/), and [purple
      heron](/especie/ardea_purpurea/). Diving ducks feature the ferruginous duck and [red-crested
      pochard](/especie/netta_rufina/), while the [greylag goose](/especie/anser_anser/) breeds locally and
      congregates in massive winter flocks. Pygmy cormorants, once extirpated in Hungary, recolonised in the
      late twentieth century. Dominant raptors include the [western marsh
      harrier](/especie/circus_aeruginosus/) nesting in reedbeds and the [white-tailed
      eagle](/especie/haliaeetus_albicilla/) hunting fish.


      Subtler wildlife abounds. The [Eurasian otter](/especie/lutra_lutra/) maintains a flourishing
      population, pine martens inhabit adjoining woodlands, and golden jackals roam the reed wilderness. The
      tundra vole, an Ice Age relict, thrives in cool sedge marshes, with its Hungarian stronghold centered
      here. Two strictly protected fish, the [European mudminnow](/especie/umbra_krameri/) and European
      weatherfish, thrive in abundance, while grass snakes, dice snakes, and [*Emys
      orbicularis*](/especie/emys_orbicularis/) (European pond turtles) bask on exposed logs.
    visit: >-
      Two visiting regimes exist. The strictly protected nature reserve is accessible exclusively on official
      guided excursions led by park rangers who interpret local hydrology, ecology, and birdlife. To minimize
      disturbance, only one tour per day is operated (Tuesday to Sunday), with departures arranged before 9 in
      the morning upon advance request for optimal birdwatching. Bring quality binoculars.


      For independent exploration, Kányavári Island near Balatonmagyaród is open without restriction. It
      features the Great Crested Grebe nature trail, accessible year-round, alongside two multi-tiered
      observation towers commanding views over the marsh. The Great Egret nature trail on Diás Island requires
      prior booking as part of the guided tour to the historic Matula hut and István Fekete memorial.


      The reed-thatched hut preserves the atmosphere of Tüskevár, Fekete’s celebrated novel set in Kis-Balaton
      and published in 1957. Nearby cultural sites include the Kápolnapuszta Buffalo Reserve and the historic
      Thatched House of Vörs.
    history: >-
      Kis-Balaton lost its water in two historical chapters. In the nineteenth century, water regulation works
      for the southern railway line drastically lowered Balaton’s water level; during the twentieth century,
      intensive drainage canals were dug to convert wetlands into farmland. By mid-century the natural
      biofilter had collapsed, triggering rapid water quality deterioration in Balaton.


      The turnaround came in the seventies with an ambitious hydrological restoration scheme to re-flood
      Kis-Balaton. Implemented in phases, Hídvégi Lake was impounded in 1985, followed by the restoration of
      Fenéki Lake in the mid-2000s supported by European funding, triggering rapid ecological recovery.


      Legal protection expanded in parallel: designated a national reserve in 1951, listed under the Ramsar
      Convention in 1979, and incorporated into Natura 2000 in 2004. Originally protected in 1951 across 1403
      ha, it was expanded in 1986 to some 150 km² as a landscape protection area, and joined the National Park
      in 1997.
    before: >-
      Always remain on marked footpaths. Sturdy walking shoes and weatherproof clothing are recommended across
      all nature trails. Around water bodies and wetlands, dogs must be kept on a leash to safeguard nesting
      waterbirds and are forbidden from entering the water.
    around: >-
      Kis-Balaton shares its great egret and white-tailed eagle with fellow inland wetland havens: [Hortobágy
      National Park](/lugar/hortobagyi-nemzeti-park---puszta/), [Srebarna Biosphere
      Reserve](/lugar/srebarna-biosphere-reserve/), and, sharing the Eurasian otter, [Lower Prut Scientific
      Reserve](/lugar/rezervatia-stiintifica-prutul-de-jos/).
  fr:
    intro: >-
      Il y a deux siècles, le Kis-Balaton ne formait pas une entité distincte : il constituait un golfe
      naturel du lac Balaton. La rivière Zala y achevait sa course, rencontrant une vaste nappe d’eau où elle
      déposait ses limons et matières en suspension avant de rejoindre le grand lac. C’était un biofiltre
      naturel, et toute son histoire découle de sa perte puis de sa renaissance. Aujourd’hui, le Kis-Balaton
      (« Petit Balaton ») est une immense mosaïque de roselières et de marécages bordant le Balaton, dont le
      sanctuaire ne se visite qu’en compagnie d’un guide officiel.
    landscape: >-
      Le Kis-Balaton occupe l’embouchure de la Zala, cuvette marécageuse soumise à d’amples variations de
      niveau d’eau. Ses roselières agissent comme une station d’épuration vivante. Le paysage végétal varie
      rapidement : aux vastes étendues de roseaux et de massettes succèdent des forêts marécageuses, des
      prairies humides, des saulaies, des aulnaies et des chênaies. Sur l’eau flottent nénuphars blancs et
      jaunes, et la flore compte notamment la plus petite plante à fleurs au monde (la lentille d’eau sans
      racines).
    wildlife: >-
      Le Kis-Balaton est réputé pour sa féerie aviaire. Lorsque les bassins furent remis en eau dans les
      années quatre-vingt, les oiseaux aquatiques réinvestirent des surfaces jadis désertées : dès la première
      année, des dizaines de milliers de migrateurs vinrent y faire escale ou hiverner. À ce jour, 250 espèces
      ont été identifiées.


      Chez les ardéidés, l’emblème est la [*Egretta alba*](/especie/egretta_alba/) (grande aigrette), côtoyant
      l’[aigrette garzette](/especie/egretta_garzetta/), le [héron cendré](/especie/ardea_cinerea/) et le
      [héron pourpré](/especie/ardea_purpurea/). Côté canards se distinguent le fuligule nyroca et la [nette
      rousse](/especie/netta_rufina/), tandis que l’[oie cendrée](/especie/anser_anser/) y niche et forme
      d’immenses rassemblements. Le cormoran pygmée s’est réinstallé à la fin du XXe siècle. Parmi les rapaces
      règnent le [busard des roseaux](/especie/circus_aeruginosus/) et le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/).


      Une faune discrète peuple les berges. La [loutre d’Europe](/especie/lutra_lutra/) y maintient une
      population prospère, les martres hantent les bois et le chacal doré parcourt les roselières. Le
      campagnol nordique, relique glaciaire, a ici son principal bastion hongrois. Deux poissons protégés, le
      [poisson-chien](/especie/umbra_krameri/) et la loche d’étang, abondent dans les canaux, où la couleuvre
      à collier, la couleuvre tessellée et la [*Emys orbicularis*](/especie/emys_orbicularis/) (cistude
      d’Europe) se chauffent au soleil.
    visit: >-
      Deux modes de découverte existent. La réserve intégrale est accessible uniquement lors des visites
      guidées du parc, au cours desquelles les guides interprètent la faune et l’histoire hydraulique. Afin de
      limiter les dérangements, une seule visite par jour est organisée du mardi au dimanche, avec possibilité
      d’un départ avant 9 heures du matin sur demande préalable. Munissez-vous de jumelles.


      En accès libre, l’île de Kányavári près de Balatonmagyaród est ouverte en permanence. Elle accueille le
      sentier du Grèbe huppé et deux tours d’observation en bois. Le sentier de la Grande Aigrette, sur l’île
      Diás, se visite sur réservation dans le cadre du circuit incluant la hutte de Matula et le mémorial
      István Fekete.


      Cette hutte traditionnelle de roseaux rappelle l’univers du roman Tüskevár, publié par Fekete en 1957.
      Les visiteurs peuvent aussi découvrir la réserve de buffles de Kápolnapuszta et la Maison penchée de
      Vörs.
    history: >-
      Le Kis-Balaton a perdu ses eaux en deux étapes. Au XIXe siècle, les travaux pour la ligne de chemin de
      fer de la rive sud firent chuter le niveau du Balaton ; au XXe siècle, des canaux de drainage
      asséchèrent les marais au profit de l’agriculture. Au milieu du siècle, le filtre ne fonctionnait plus
      et l’eau du Balaton se dégrada brutalement.


      La parade fut lancée dans les années soixante-dix par un grand programme de réhabilitation hydraulique.
      Les travaux se firent en deux temps : mise en eau du lac Hídvégi en 1985, puis du lac Fenéki au milieu
      des années 2000 avec l’appui de l’Union européenne.


      La protection réglementaire a suivi : site protégé national dès 1951, zone Ramsar en 1979 et Natura 2000
      en 2004. Inscrit en 1951 avec 1403 ha, le site fut étendu en 1986 à 150 km² en aire paysagère protégée,
      intégrant le Parc national en 1997.
    before: >-
      Ne quittez pas les sentiers balisés. Chaussures de marche et vêtements de pluie sont recommandés. À
      proximité des étangs et marais, les chiens doivent impérativement être tenus en laisse pour protéger les
      nichées et ne doivent pas se baigner.
    around: >-
      Le Kis-Balaton partage ses espèces maîtresses avec d’autres grands sanctuaires : le [Parc national de
      Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/), la [Réserve de biosphère de
      Srebarna](/lugar/srebarna-biosphere-reserve/) et, pour la loutre, la [Réserve scientifique du bas
      Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/).
  de:
    intro: >-
      Vor zwei Jahrhunderten war der Kis-Balaton kein eigenständiges Gewässer, sondern eine Bucht des
      Plattensees. Die Zala floss hier in eine weite Flachwasserzone, lagerte Schwebstoffe und organische
      Frachten ab und speiste den See mit geklärtem Wasser. Es war ein gewaltiger Naturfilter; sein Verlust
      und seine Wiederherstellung prägen die neuere Geschichte. Heute bildet der Kis-Balaton («Kleiner
      Plattensee») eine Wildnis aus Röhrichten, Seggenrieden und Bruchwäldern, deren Kernzone nur mit
      Parkführern betreten werden darf.
    landscape: >-
      Der Kis-Balaton nimmt das Mündungsdelta der Zala ein, eine historisch von starken
      Wasserstandsschwankungen geprägte Flachmulde. Die ausgedehnten Schilf- und Röhrichtgürtel reinigen das
      Wasser auf natürliche Weise. Die Pflanzengesellschaften wechseln mosaikartig: Auf Schilf- und
      Rohrkolbenmeere folgen Erlenbruchwälder, Weidengebüsche, Feuchtwiesen und Eichenhaine. Seerosen bedecken
      ruhige Buchten, und unter den floristischen Raritäten findet sich die Zwergwasserlinse als kleinste
      Blütenpflanze der Erde.
    wildlife: >-
      Berühmt ist der Kis-Balaton für seine Vogelwelt. Als die Speicherbecken in den achtziger Jahren geflutet
      wurden, kehrten Wasservögel schlagartig zurück: Bereits im ersten Jahr rasteten oder überwinterten
      Zehntausende Vögel. Bis heute wurden 250 Vogelarten nachgewiesen.


      Unter den Reihern gilt die [*Egretta alba*](/especie/egretta_alba/) (Silberreiher) als Wahrzeichen,
      begleitet von [Seidenreiher](/especie/egretta_garzetta/), [Graureiher](/especie/ardea_cinerea/) und
      [Purpurreiher](/especie/ardea_purpurea/). Moorente und [Kolbenente](/especie/netta_rufina/) bereichern
      die Gewässer, während die [Graugans](/especie/anser_anser/) hier brütet und in riesigen Schwärmen
      rastet. Die Zwergscharbe wanderte Ende des zwanzigsten Jahrhunderts wieder ein. Als Greifvögel
      dominieren [Rohrweihe](/especie/circus_aeruginosus/) und [Seeadler](/especie/haliaeetus_albicilla/).


      Auch die Boden- und Wasserfauna ist hochkarätig. Der [Eurasische Fischotter](/especie/lutra_lutra/)
      besitzt hier eine dichte Population; Baummarder und Goldschakale streifen durchs Unterholz. Die
      Nordische Wühlmaus als Eiszeitrelikt hat am Kis-Balaton ihr ungarisches Hauptvorkommen. Geschützte
      Fische wie der [Europäische Hundsfisch](/especie/umbra_krameri/) und der Schlammpeitzger kommen
      massenhaft vor, während Ringelnattern, Würfelnattern und die [*Emys
      orbicularis*](/especie/emys_orbicularis/) (Europäische Sumpfschildkröte) sich auf Totholz sonnen.
    visit: >-
      Es gibt zwei Zugangsmöglichkeiten. Die Kernzone darf nur im Rahmen geführter Touren der
      Nationalparkverwaltung besucht werden, bei denen Biologen die Vogelwelt und das Wassersystem erläutern.
      Um Störungen zu vermeiden, findet von Dienstag bis Sonntag nur eine Führung täglich statt (Voranmeldung
      für Termine vor 9 Uhr morgens möglich). Fernglas mitbringen.


      Frei zugänglich ist die Kányavári-Insel bei Balatonmagyaród. Dort verläuft der ganzjährig geöffnete
      Haubentaucher-Lehrpfad mit zwei Aussichtstürmen. Der Silberreiher-Lehrpfad auf der Diás-Insel ist nur
      mit Führung zur Matula-Hütte und zur István-Fekete-Gedenkstätte zugänglich.


      Die Schilfhütte erinnert an den Jugendbuchklassiker Tüskevár, den Fekete 1957 über das Leben im
      Kis-Balaton veröffentlichte. In der Umgebung locken das Büffelreservat Kápolnapuszta und das
      Heimatmuseum in Vörs.
    history: >-
      Der Kis-Balaton verlor sein Wasser in zwei Etappen. Im neunzehnten Jahrhundert senkte der Bau der
      Südbahn den Seespiegel ab; ab dem zwanzigsten Jahrhundert entwässerten Meliorationsgräben das Moor für
      Äcker. Mitte des zwanzigsten Jahrhunderts versagte die Filterfunktion, woraufhin die Wasserqualität des
      Plattensees rasch kollabierte.


      In den siebziger Jahren startete das staatliche Gewässerschutzprojekt zur Wiedervernässung. Der
      Hídvégi-See wurde 1985 aufgestaut, der Fenéki-See Mitte der 2000er-Jahre mit EU-Förderung geflutet, was
      eine bemerkenswert schnelle Regeneration auslöste.


      Der Schutzstatus wuchs schrittweise: Naturschutzgebiet seit 1951, Ramsar-Gebiet seit 1979 und Natura
      2000-Gebiet seit 2004. Bereits 1951 mit 1403 ha registriert, wuchs das Areal 1986 auf 150 km² als
      Landschaftsschutzgebiet und ging 1997 im Nationalpark auf.
    before: >-
      Verlasse niemals die markierten Pfade. Feste Wanderschuhe und wetterfeste Kleidung werden empfohlen. In
      Ufernähe müssen Hunde zwingend angeleint bleiben, um Wasservögel zu schützen, und dürfen keinesfalls
      baden.
    around: >-
      Der Kis-Balaton teilt Silberreiher und Seeadler mit bedeutenden Feuchtgebieten des Atlas: dem
      [Hortobágy-Nationalpark](/lugar/hortobagyi-nemzeti-park---puszta/), dem [Biosphärenreservat
      Srebarna](/lugar/srebarna-biosphere-reserve/) und dem [Wissenschaftlichen Reservat Unterer
      Pruth](/lugar/rezervatia-stiintifica-prutul-de-jos/).
  it:
    intro: >-
      Due secoli fa il Kis-Balaton non era un’entità separata: costituiva un golfo del lago Balaton stesso. Il
      fiume Zala sfociava in questo vasto bacino di acque basse dove depositava sedimenti e nutrienti prima di
      alimentare il lago principale. Era un prodigioso biofiltro naturale, e tutta la storia moderna discende
      dalla sua scomparsa e ricostruzione. Oggi il Kis-Balaton («il Piccolo Balaton») è un mosaico palustre di
      canneti e ontaneti affiancato al Balaton, il cui cuore protetto si visita solo con guida del parco.
    landscape: >-
      Il Kis-Balaton coincide con il delta terminale dello Zala, un bacino soggetto a marcate variazioni di
      livello idrico. I suoi canneti fungono da impianto di depurazione naturale. La vegetazione varia nel
      giro di pochi passi: accanto a canneti e tifeti sorgono boschi igrofili, prati allagati, saliceti,
      ontaneti e querceti. In acqua galleggiano ninfee bianche e gialle, mentre tra le gemme botaniche figura
      la lenticchia d’acqua senza radici, la pianta da fiore più piccola del mondo.
    wildlife: >-
      Il Kis-Balaton deve la sua fama internazionale all’avifauna. Quando i bacini artificiali vennero
      riallagati negli anni ottanta, gli uccelli tornarono in massa sui fondali prosciugati: già durante la
      prima stagione arrivarono decine di migliaia di migratori a svernare. A oggi sono state contate 250
      specie.


      Tra gli aironi la specie bandiera è l’[*Egretta alba*](/especie/egretta_alba/) (airone bianco maggiore),
      affiancata da [garzetta](/especie/egretta_garzetta/), [airone cenerino](/especie/ardea_cinerea/) e
      [airone rosso](/especie/ardea_purpurea/). Tra le anatre figurano la moretta tabaccata e il [fistione
      turco](/especie/netta_rufina/), mentre l’[oca selvatica](/especie/anser_anser/) vi nidifica e forma
      grandi branchi invernali. Il marangone minore è ricomparso a fine Novecento. Tra i rapaci spiccano il
      [falco di palude](/especie/circus_aeruginosus/) e l’[aquila di mare](/especie/haliaeetus_albicilla/).


      La fauna minore vanta specie relitte. La [lontra europea](/especie/lutra_lutra/) vanta una densità
      ragguardevole; nei boschi cacciano martore e nei canneti si muovono gli sciacalli dorati. L’arvicola
      boreale, relitto glaciale, ha qui il suo principale rifugio magiaro. Pesci rari come il [*Umbra
      krameri*](/especie/umbra_krameri/) (pesce cane europeo) e il cobite di stagno popolano le acque, dove
      bisce dal collare, bisce tassellate e la [*Emys orbicularis*](/especie/emys_orbicularis/) (testuggine
      palustre europea) si riscaldano al sole.
    visit: >-
      Vi sono due modalità di accesso. La riserva integrale è aperta esclusivamente alle visite guidate
      organizzate dal parco, con esperti che illustrano idrologia e ornitologia. Per limitare il disturbo si
      effettua una sola partenza al giorno (da martedì a domenica), con orari anticipabili prima delle 9 del
      mattino su richiesta per avvistare più uccelli. Porta un buon binocolo.


      L’accesso libero è garantito sull’isola di Kányavári, vicino a Balatonmagyaród. Vi si sviluppa il
      sentiero didattico dello Svasso Maggiore con due torri panoramiche in legno. Il sentiero dell’Airone
      Bianco Maggiore, sull’isola Diás, è invece accessibile solo su prenotazione con visita al capanno di
      Matula e al memoriale dello scrittore István Fekete.


      Quel capanno di cannuccia rievoca le atmosfere del romanzo Tüskevár, pubblicato da Fekete nel 1957. Nei
      dintorni meritano una sosta la riserva di bufali di Kápolnapuszta e la casa tradizionale dal tetto di
      paglia di Vörs.
    history: >-
      Il Kis-Balaton si prosciugò in due fasi. Nell’Ottocento i lavori di contenimento per la ferrovia
      meridionale abbassarono il livello del Balaton; nel Novecento le bonifiche agricole aprirono canali
      ovunque. A metà Novecento il filtro naturale cessò di funzionare, provocando un rapido degrado delle
      acque del Balaton.


      La salvezza partì negli anni settanta con il grande progetto idrico di ripristino. Il lago Hídvégi venne
      allagato nel 1985, seguito dal bacino di Fenéki a metà degli anni 2000 con finanziamenti europei,
      permettendo una rapida rinascita ecologica.


      La protezione è cresciuta per gradi: riserva nazionale nel 1951, sito Ramsar nel 1979 e Natura 2000 nel
      2004. Istituito nel 1951 con 1403 ha, venne ampliato nel 1986 a circa 150 km² confluendo nel Parco
      Nazionale nel 1997.
    before: >-
      Resta sempre sui tracciati segnalati. Scarponcini da trekking e giacca a vento sono vivamente
      consigliati. Nei pressi delle zone umide i cani vanno condotti al guinzaglio per non disturbare i nidi
      ed è severamente vietato farli entrare in acqua.
    around: >-
      Il Kis-Balaton condivide airone bianco maggiore e aquila di mare con grandi complessi umidi del bacino
      danubiano: il [Parco Nazionale di Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/), la [Riserva
      della Biosfera di Srebarna](/lugar/srebarna-biosphere-reserve/) e la [Riserva Scientifica del Basso
      Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/).
  pt:
    intro: >-
      Há dois séculos o Kis-Balaton não era um local isolado: formava uma baía contínua do próprio lago
      Balaton. O rio Zala desaguava nesta vasta bacia de águas calmas onde depositava lodos e sedimentos antes
      de alimentar o lago principal. Era um filtro biológico vital, e tudo o que se sucedeu resultou da sua
      perda e paciente reconstrução. Hoje o Kis-Balaton («o Pequeno Balaton») é um labirinto de caniçais,
      tabuais e pauis junto ao Balaton, cujo setor mais protegido apenas se visita na companhia de um guia do
      parque.
    landscape: >-
      O Kis-Balaton ocupa o delta terminal do rio Zala, uma bacia historicamente sujeita a fortes oscilações
      hídricas. Os densos caniçais atuam como uma estação de depuração natural. A paisagem vegetal alterna a
      cada passo: a par dos caniçais e tabuais estendem-se florestas pantanosas, prados alagados, salgueirais,
      amiais e carvalhais. Nas águas mansas flutuam nenúfares brancos e amarelos, surgindo entre as relíquias
      botânicas a lentilha-d'água-sem-raízes, a menor planta com flor do mundo.
    wildlife: >-
      O Kis-Balaton é afamado pela sua riqueza ornitológica. Quando as bacias foram reinundadas na década de
      oitenta, as aves aquáticas regressaram de imediato a fundos antes ressequidos: logo no primeiro ano
      dezenas de milhares de migradores pousaram para descansar ou invernar. Até hoje identificaram-se 250
      espécies.


      Entre os garçais a espécie emblemática é a [*Egretta alba*](/especie/egretta_alba/)
      (garça-branca-grande), acompanhada pela [garcinha-branca](/especie/egretta_garzetta/), pela
      [garça-real-europeia](/especie/ardea_cinerea/) e pela [garça-vermelha](/especie/ardea_purpurea/). Nos
      patos destacam-se o zarro-castanho e o [pato-de-bico-vermelho](/especie/netta_rufina/), enquanto o
      [ganso-bravo](/especie/anser_anser/) nidifica e forma grandes concentrações de inverno. O
      corvo-marinho-pigmeu recolonizou o espaço no final do século XX. Nas rapinas imperam o
      [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/) e a
      [águia-rabalva](/especie/haliaeetus_albicilla/).


      A fauna menor revela raridades notáveis. A [lontra-europeia](/especie/lutra_lutra/) conta aqui com uma
      densidade expressiva; nas matas caçam martas e nos caniçais rondam chacais-dourados. O rato-do-norte,
      relíquia glaciar, tem no Kis-Balaton a sua maior população húngara. Peixes protegidos como o [*Umbra
      krameri*](/especie/umbra_krameri/) (peixe-cão-europeu) e a traíra-da-lama abundam nas valas, onde
      cobras-de-água-de-colar e o [*Emys orbicularis*](/especie/emys_orbicularis/)
      (cágado-de-carapaça-estriada) apanham sol.
    visit: >-
      Existem dois modos de acesso. A reserva de proteção estrita apenas é visitável com guia oficial do
      parque, com acompanhamento técnico que desvenda a avifauna e o restauro ecológico. Para salvaguardar a
      tranquilidade das aves, realiza-se apenas uma visita diária (de terça-feira a domingo), com
      possibilidade de saída antes das 9 da manhã mediante marcação prévia. Leva binóculos.


      De acesso livre e permanente, a ilha Kányavári perto de Balatonmagyaród pode ser percorrida sem
      restrições. Abriga o trilho do Mergulhão-de-crista e duas torres panorâmicas em madeira. O trilho da
      Garça-branca-grande, na ilha Diás, exige agendamento prévio no âmbito da visita à cabana de Matula e ao
      memorial do escritor István Fekete.


      Essa cabana de colmo evoca o ambiente do romance Tüskevár, publicado por Fekete em 1957. Na proximidade
      merecem visita a reserva de búfalos de Kápolnapuszta e a Casa Tradicional de Vörs.
    history: >-
      O Kis-Balaton secou em dois tempos. No século XIX, as obras para a linha férrea baixaram drasticamente o
      nível do Balaton; no século XX, valas de drenagem secaram os pauis para a agricultura intensiva. Em
      meados do século XX o filtro colapsou, deteriorando com rapidez as águas do Balaton.


      A reviravolta deu-se na década de setenta com um arrojado plano de engenharia ecológica para voltar a
      alagar o Kis-Balaton. A lagoa Hídvégi encheu em 1985 e a lagoa Fenéki a meados dos anos 2000 com fundos
      europeus, acelerando a recuperação do ecossistema.


      A proteção legal consolidou-se por etapas: reserva nacional em 1951, sítio Ramsar em 1979 e Natura 2000
      em 2004. Registado em 1951 com 1403 ha, foi ampliado em 1986 para cerca de 150 km² e integrado no Parque
      Nacional em 1997.
    before: >-
      Não te desvies dos trilhos sinalizados. Recomenda-se calçado de caminhada e impermeável em todos os
      circuitos. Junto a pauis e lagoas os cães devem circular obrigatoriamente com trela para proteger os
      ninhos e não podem banhar-se na água.
    around: >-
      O Kis-Balaton partilha garça-branca-grande e águia-rabalva com outros grandes pauis fluviais: o [Parque
      Nacional de Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/), a [Reserva da Biosfera de
      Srebarna](/lugar/srebarna-biosphere-reserve/) e a [Reserva Científica do Baixo
      Prut](/lugar/rezervatia-stiintifica-prutul-de-jos/).
