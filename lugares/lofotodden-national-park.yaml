resumen:
  es: >-
    El Parque Nacional del extremo sur de las islas Lofoten, pirámides de granito negro emergiendo
    directamente del océano Ártico y playas secretas de arena blanca como Kvalvika.
  en: >-
    The national park at the southern tip of the Lofoten archipelago, black granite pyramids rising straight
    from the Arctic Ocean and secluded white sand beaches like Kvalvika.
  fr: >-
    Le parc national de la pointe sud des îles Lofoten, pyramides de granit noir émergeant droit de l'océan
    Arctique et plages secrètes de sable blanc comme Kvalvika.
  de: >-
    Der Nationalpark an der Südspitze der Lofoten, schwarze Granitpyramiden, die direkt aus dem Nordmeer
    emporragen, und verborgene weiße Sandstrände wie Kvalvika.
  it: >-
    Il parco nazionale all'estremità meridionale delle isole Lofoten, piramidi di granito nero che sorgono
    direttamente dall'Oceano Artico e spiagge nascoste di sabbia bianca come Kvalvika.
  pt: >-
    O parque nacional no extremo sul das ilhas Lofoten, pirâmides de granito negro emergindo diretamente do
    oceano Ártico e praias secretas de areia branca como Kvalvika.
unico:
  es: >-
    Aquí las montañas salen directamente del mar, con playas blancas de arena a los pies de crestas de hasta
    mil metros.
  en: >-
    Here the mountains plunge straight into the sea, with white sand beaches reposing at the foot of ridges
    soaring up to a thousand metres.
  fr: >-
    Ici, les montagnes plongent droit dans la mer, avec des plages de sable blanc étalées au pied d'arêtes
    culminant à mille mètres.
  de: >-
    Hier steigen die Berge unmittelbar aus dem Meer auf, mit weißen Sandstränden zu Füßen von bis zu tausend
    Meter hohen Graten.
  it: >-
    Qui le montagne sorgono direttamente dal mare, con spiagge bianche di sabbia ai piedi di creste che
    toccano i mille metri.
  pt: >-
    Aqui as montanhas erguem-se diretamente do mar, com praias brancas de areia no sopé de cristas com até mil
    metros.
observaciones:
  es: >-
    Está prohibido volar drones con cualquier fin, y la bicicleta eléctrica no se permite aunque tenga el
    motor apagado. El transporte motorizado está prohibido en tierra, agua y en el aire por debajo de 300 m.
    Se puede acampar a más de 150 m de la casa o cabaña habitada más cercana y hasta 2 noches en el mismo
    sitio. Del 16 de septiembre al 14 de abril se puede encender fuego; del 15 de abril al 15 de septiembre,
    solo donde claramente no haya riesgo de incendio. Los perros deben ir atados del 1 de abril al 20 de
    agosto. Si organizas visitas guiadas de cierta escala, necesitas permiso del órgano gestor.
texto:
  es:
    intro: >-
      Imagina una pared de picos que sale del mar. No una montaña con una ladera suave, sino una hilera
      estrecha de crestas altas, con el océano abierto a un lado y fiordos profundos al otro. Así es
      Lofotodden, el cuadragésimo parque nacional de Noruega, entero en la isla de Moskenesøya, en los
      municipios de Moskenes y Flakstad. Es la parte sur de una cordillera de 160 km llamada Lofotenveggen, la
      «Muralla de Lofoten», y reúne, sobre 99 km², 86 de tierra y 13 de mar, paisajes y tipos de naturaleza
      que no existen en ningún otro espacio protegido de Noruega.
    landscape: >-
      El macizo dentado es de rocas volcánicas y granito, y su techo es el Hermannsdalstinden, de 1029 m, la
      cima más alta de Moskenesøya; las demás cumbres importantes van de 500 a 940 m. Entre ellas el terreno
      es muy abrupto y de difícil acceso en algunos puntos, pero hay muchos senderos y algunos pasos por la
      cordillera.


      El parque abarca ecosistemas variados: turberas, costa acantilada y dunas. Las dunas de Kvalvika,
      Horseidet y Bunes forman algunos de los sistemas dunares más extensos del área. Y aunque el sustrato es
      pobre en nutrientes, la flora de montaña es rica: Lofoten fue una de las primeras zonas libres de hielo
      tras la glaciación, y por eso aquí están algunas de las poblaciones más antiguas de ciertas plantas de
      montaña. Hay helechos calcícolas como el kalktelg y plantas llamadas storblåfjær, en el extremo
      noroccidental de su distribución.
    wildlife: >-
      Lo mejor está en la costa exterior, donde anidan colonias de arao aliblanco, [cormorán
      moñudo](/especie/phalacrocorax_aristotelis/) y [gaviota tridáctila](/especie/rissa_tridactyla/), además
      de águilas reales y [pigargos](/especie/haliaeetus_albicilla/). La reserva natural de Lofotodden, en el
      extremo suroeste de Moskenesøya, con la isla de Sørholmen, es una importante zona de nidificación de
      aves marinas y está dentro del parque.


      Las estaciones se notan en los senderos. El mayor tránsito se mide en julio, con un pico claro a
      mediados de mes; el paso por el año sigue una curva en campana, creciendo desde la primavera y bajando
      hacia el otoño.
    visit: >-
      Los destinos más populares son Kvalvika, Ryten, Bunessanden y Horseid, y el parque y Lofoten Friluftsråd
      mantienen cuatro contadores de paso en ellos; Kvalvika y Ryten siguen siendo los más concurridos. Entre
      las travesías están la de Vinstad a la costa arenosa de Bunesstrand y la de Å por la orilla sur del lago
      Ågvatnet y una cresta empinada hasta el lago Stokkvikvatnet y la bahía de Stokkvika.


      Si vas a Kvalvika, ten presente que en el aparcamiento de Torsfjorden hay pocas plazas. Y para reducir
      el desgaste de los senderos: en bicicleta solo se puede ir por caminos y senderos, y está prohibido en
      dos, de Bunesfjorden a Bunes y de Torsfjorden a Kvalvika.
    history: >-
      Los restos antiguos y los de poblamientos recientes en la costa exterior de Moskenesøya dan al área una
      gran profundidad de tiempo, con huellas de asentamientos que se remontan a la Edad de Piedra. El pequeño
      valle de Stokkvika, de unos 2 km, estuvo habitado desde al menos 1634, fue almacén en la Segunda Guerra
      Mundial y campo de tiro militar de 1952 a 1963, y por eso queda fuera del parque.


      Lofotodden se creó el 22 de junio de 2018 y fue inaugurado oficialmente el 9 de junio de 2019 por el
      ministro de Clima y Medio Ambiente. Las visitas guiadas se regulan porque pueden desgastar la vegetación
      y molestar a la fauna, sobre todo a las rapaces y otras aves vulnerables en la cría.
    before: >-
      Está prohibido volar drones con cualquier fin, y la bicicleta eléctrica no se permite aunque tenga el
      motor apagado. El transporte motorizado está prohibido en tierra, agua y en el aire por debajo de 300 m.
      Se puede acampar a más de 150 m de la casa o cabaña habitada más cercana y hasta 2 noches en el mismo
      sitio. Del 16 de septiembre al 14 de abril se puede encender fuego; del 15 de abril al 15 de septiembre,
      solo donde claramente no haya riesgo de incendio. Los perros deben ir atados del 1 de abril al 20 de
      agosto. Si organizas visitas guiadas de cierta escala, necesitas permiso del órgano gestor.
    around: >-
      Lofotodden no tiene vecinos cercanos en el atlas, pero comparte aves marinas con otros lugares de costa:
      la [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/) comparte la gaviota tridáctila, y el
      [Parque Nacional de las Islas Atlánticas de
      Galicia](/lugar/parque-nacional-islas-atlanticas-de-galicia/), el cormorán moñudo.
  en:
    intro: >-
      Envision a wall of granite summits surging straight out of the Arctic Ocean. Not gentle mountain
      shoulders, but a knife-edge chain of sheer peaks flanked by open ocean on one side and profound fjords
      on the other. This is Lofotodden, Norway's fortieth national park, situated entirely on the island of
      Moskenesøya across the municipalities of Moskenes and Flakstad. It protects the southern anchor of the
      160 km mountain wall known as Lofotenveggen ('The Lofoten Wall'), uniting, across 99 km²—86 on land and
      13 in marine waters—geological landscapes and habitats found nowhere else in Norway's protected network.
    landscape: >-
      The jagged massif is formed of volcanic rocks and ancient granite, crowned by Hermannsdalstinden at 1029
      m, the highest mountain on Moskenesøya; other prominent peaks range from 500 to 940 m. Between these
      bastions the terrain is deeply fractured and alpine, yet traversable by mountain routes and high passes.


      The park encompasses diverse sub-arctic ecosystems: coastal mires, precipitous sea cliffs and sand
      dunes. The dunes at Kvalvika, Horseidet and Bunes comprise some of the most extensive coastal dune
      systems in the archipelago. Despite nutrient-poor bedrock, the alpine flora is remarkably diverse:
      Lofoten was among the earliest areas to emerge from glacial ice, sheltering relict populations of alpine
      plants. Calcium-loving ferns such as green spleenwort thrive alongside field gentians reaching their
      extreme north-western European limit.
    wildlife: >-
      The outer oceanic coast hosts thriving wildlife, where bustling seabird cliffs welcome black guillemots,
      the [European shag](/especie/phalacrocorax_aristotelis/) and the [Black-legged
      kittiwake](/especie/rissa_tridactyla/), alongside resident golden eagles and [White-tailed
      eagle](/especie/haliaeetus_albicilla/)s. The Lofotodden nature reserve, on the southwestern tip of
      Moskenesøya including the islet of Sørholmen, forms a protected maritime bird haven nested within the
      national park.


      Visitor traffic on trails tracks the seasonal cycle. Highest foot traffic occurs in July, showing a
      clear mid-month peak; seasonal usage traces a bell curve rising steeply in late spring and tapering off
      as autumn approaches.
    visit: >-
      The most sought-after destinations are Kvalvika, Ryten, Bunessanden and Horseid, where the park and the
      regional outdoor council maintain four automated visitor counters; Kvalvika and Ryten record the highest
      footfall. Classic treks include the boat-assisted hike from Vinstad to the sandy strand of Bunesstrand,
      and the demanding route from Å along the southern shore of Lake Ågvatnet, crossing a steep ridge to Lake
      Stokkvikvatnet and Stokkvika bay.


      If heading to Kvalvika, note that parking space at Torsfjorden is limited. To curb trail erosion:
      cycling is confined strictly to established roads and paths, and is prohibited on two specific routes:
      from Bunesfjorden to Bunes, and from Torsfjorden to Kvalvika.
    history: >-
      Prehistoric remnants and recent coastal settlements along the outer shores of Moskenesøya lend deep
      cultural antiquity to the landscape, with dwelling traces extending back to the Stone Age. The secluded
      valley of Stokkvika, spanning around 2 km, was inhabited continuously from at least 1634, served as a
      supply depot during the Second World War and operated as a military firing range from 1952 to 1963,
      explaining its exclusion from the park.


      Lofotodden was designated on 22 June 2018 and officially opened on 9 June 2019 by Norway's Minister of
      Climate and Environment. Guided commercial excursions are subject to regulation to safeguard fragile
      alpine vegetation and avoid disturbing wildlife, especially nesting raptors and seabirds.
    before: >-
      Flying recreational or commercial drones is prohibited, and electric mountain bikes are barred even with
      the motor switched off. Motorized transport is forbidden on land, water and in the air below 300 m.
      Wilderness camping is permitted more than 150 m from the nearest inhabited house or cabin and up to 2
      nights in the same spot. Open campfires are allowed from 16 September to 14 April; from 15 April to 15
      September, only where fire danger is demonstrably absent. Dogs must be kept on a leash from 1 April to
      20 August. Organized or commercial group events require formal approval from the management board.
    around: >-
      Lofotodden has no immediate neighbouring sites in the atlas, yet shares seabird ecosystems with other
      oceanic coastlines: [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/) shares the black-legged
      kittiwake, and [Parque Nacional de las Islas Atlánticas de
      Galicia](/lugar/parque-nacional-islas-atlanticas-de-galicia/) the European shag.
  fr:
    intro: >-
      Imaginez un rempart de pics jaillissant directement de l'océan. Non pas une montagne aux pentes
      adoucies, mais une étroite rangée d'arêtes aiguisées, avec le grand large d'un côté et de profonds
      fjords de l'autre. Tel est Lofotodden, le quarantième parc national de Norvège, établi en totalité sur
      l'île de Moskenesøya, sur les communes de Moskenes et Flakstad. Il protège la terminaison sud d'une
      chaîne de 160 km appelée Lofotenveggen, le « Mur des Lofoten », et rassemble sur 99 km² — 86 terrestres
      et 13 marins — des paysages et des écosystèmes sans équivalent dans les autres espaces protégés de
      Norvège.
    landscape: >-
      Ce massif déchiqueté est taillé dans des roches volcaniques et du granite, dominé par le
      Hermannsdalstinden à 1029 m, point culminant de Moskenesøya ; les autres sommets majeurs s'étagent de
      500 à 940 m. Entre eux, le relief se révèle très escarpé et d'accès ardu par endroits, mais il existe de
      nombreux sentiers et quelques cols franchissables.


      Le parc englobe des milieux variés : tourbières, falaises maritimes et cordons dunaires. Les dunes de
      Kvalvika, Horseidet et Bunes constituent certains des ensembles dunaires les plus remarquables de
      l'archipel. Bien que le sol soit pauvre en nutriments, la flore montagnarde y est luxuriante : les
      Lofoten ont compté parmi les premières terres libérées des glaces, abritant ainsi de très anciennes
      populations végétales. On y trouve des fougères calcicoles et des gentianes à leur limite
      nord-occidentale.
    wildlife: >-
      Le spectacle le plus grandiose s'offre sur le littoral extérieur, où nichent des colonies de guillemots
      à miroir, de [Cormoran huppé](/especie/phalacrocorax_aristotelis/)s et de [Mouette
      tridactyle](/especie/rissa_tridactyla/)s, aux côtés des aigles royaux et des [Pygargue à queue
      blanche](/especie/haliaeetus_albicilla/)s. La réserve naturelle de Lofotodden, à la pointe sud-ouest de
      Moskenesøya avec l'îlot de Sørholmen, est un sanctuaire de nidification pour les oiseaux marins intégré
      au parc.


      L'affluence suit le cycle saisonnier. La fréquentation culmine nettement en juillet, avec une pointe
      marquée à la mi-juillet ; la fréquentation annuelle décrit une courbe en cloche montant au printemps et
      déclinant vers l'automne.
    visit: >-
      Les sites emblématiques sont Kvalvika, Ryten, Bunessanden et Horseid, où le parc et le conseil de plein
      air des Lofoten ont installé quatre compteurs de passage automatiques ; Kvalvika et Ryten demeurent les
      plus courus. Parmi les traversées figurent la marche de Vinstad vers la plage de Bunesstrand et celle
      reliant Å le long du lac Ågvatnet par une arête raide jusqu'au lac Stokkvikvatnet et la baie de
      Stokkvika.


      Pour Kvalvika, notez que les places de stationnement à Torsfjorden sont très restreintes. Afin de
      limiter l'érosion, le vélo est réservé aux voies établies et demeure strictement proscrit sur deux
      sentiers : de Bunesfjorden à Bunes et de Torsfjorden à Kvalvika.
    history: >-
      Les vestiges archéologiques et les hameaux historiques de la côte extérieure de Moskenesøya confèrent
      aux lieux une grande profondeur temporelle, remontant jusqu'à l'âge de la pierre. Le vallon de
      Stokkvika, long d'environ 2 km, fut habité dès au moins 1634, servit d'entrepôt pendant la Seconde
      Guerre mondiale puis de champ de tir militaire de 1952 à 1963, ce qui justifie son maintien hors du
      périmètre du parc.


      Lofotodden a été créé le 22 juin 2018 et inauguré officiellement le 9 juin 2019 par le ministre du
      Climat et de l'Environnement. Les visites guidées commerciales font l'objet d'un encadrement strict pour
      épargner la végétation et préserver la tranquillité des rapaces et des oiseaux marins.
    before: >-
      Le survol par drone est formellement interdit, et les vélos électriques sont prohibés même moteur coupé.
      Tout transport motorisé est interdit sur terre, sur l'eau et dans les airs en dessous de 300 m. Le
      bivouac est autorisé à plus de 150 m de toute habitation et jusqu'à 2 nuits au même endroit. Les feux
      sont autorisés du 16 septembre au 14 avril ; du 15 avril au 15 septembre, uniquement là où il n'y a
      manifestement aucun danger. Les chiens doivent être tenus en laisse du 1 avril au 20 août. Les
      manifestations collectives nécessitent une autorisation préalable.
    around: >-
      Lofotodden ne possède pas de voisins directs dans l'atlas, mais partage des oiseaux marins avec d'autres
      côtes océaniques : la [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/) partage la mouette
      tridactyle, et le [Parque Nacional de las Islas Atlánticas de
      Galicia](/lugar/parque-nacional-islas-atlanticas-de-galicia/) le cormoran huppé.
  de:
    intro: >-
      Stell dir eine Mauer aus Felsgipfeln vor, die senkrecht aus dem Eismeer ragt. Kein Gebirge mit sanften
      Hängen, sondern eine schmale Folge schroffer Grate, mit dem offenen Ozean auf der einen und tiefen
      Fjorden auf der anderen Seite. Das ist Lofotodden, Norwegens vierzigster Nationalpark, der zur Gänze auf
      der Insel Moskenesøya in den Gemeinden Moskenes und Flakstad liegt. Er schützt den Südteil der 160 km
      langen Gebirgskette Lofotenveggen („Lofotenwand“) und vereint auf 99 km² — 86 zu Lande und 13 im Meer —
      Naturräume, die in keinem anderen norwegischen Schutzgebiet existieren.
    landscape: >-
      Das zackige Massiv besteht aus Vulkangestein und Granit und gipfelt im Hermannsdalstinden auf 1029 m,
      der höchsten Erhebung von Moskenesøya; die übrigen bedeutenden Berge liegen zwischen 500 und 940 m.
      Dazwischen ist das Gelände steil und abschnittsweise unzugänglich, doch existieren alpine Pfade und
      gangbare Pässe.


      Der Park birgt vielfältige Ökosysteme: Moore, Steilküsten und Dünenlandschaften. Die Dünen von Kvalvika,
      Horseidet und Bunes zählen zu den ausgedehntesten Dünengebieten des Archipels. Trotz nährstoffarmer
      Böden ist die Gebirgsflora beachtlich: Die Lofoten gehörten zu den ersten eisfreien Regionen nach der
      Vergletscherung und beherbergen alte Reliktvorkommen. Es wachsen kalkliebende Farne und Enzianarten am
      nordwestlichen Rand ihres Areals.
    wildlife: >-
      Das eindrucksvollste Naturschauspiel bietet die Außenküste, an der Gryllteisten,
      [Krähenscharbe](/especie/phalacrocorax_aristotelis/)n und [Dreizehenmöwe](/especie/rissa_tridactyla/)n
      brüten, begleitet von Steinadlern und [Seeadler](/especie/haliaeetus_albicilla/)n. Das Naturschutzgebiet
      Lofotodden an der Südwestspitze von Moskenesøya mit der Insel Sørholmen ist ein wichtiges Brutgebiet für
      Seevögel und liegt innerhalb des Parks.


      Die Besucherströme folgen den Jahreszeiten. Das höchste Aufkommen wird im Juli mit einer deutlichen
      Spitze zur Monatsmitte gemessen; der Jahresverlauf zeichnet eine Glockenkurve nach, die im Frühjahr
      ansteigt und zum Herbst hin abflacht.
    visit: >-
      Die populärsten Ziele sind Kvalvika, Ryten, Bunessanden und Horseid, an denen Parkverwaltung und
      Wanderverband vier automatische Personenzähler betreiben; Kvalvika und Ryten verzeichnen die stärkste
      Frequenz. Zu den klassischen Wanderungen gehören der Weg von Vinstad zum Sandstrand Bunesstrand sowie
      der Pfad von Å entlang des Südufers des Ågvatnet-Sees über einen Steilgrat zum Stokkvikvatnet und zur
      Bucht von Stokkvika.


      Für Kvalvika gilt es zu beachten, dass die Parkplätze am Torsfjorden knapp bemessen sind. Um Pfaderosion
      zu vermeiden: Radfahren ist nur auf Wegen erlaubt und auf zwei Abschnitten ganz verboten: von
      Bunesfjorden nach Bunes sowie von Torsfjorden nach Kvalvika.
    history: >-
      Prähistorische Funde und historische Siedlungen an der Außenküste verleihen der Landschaft Tiefe bis in
      die Steinzeit. Das rund 2 km lange Tal Stokkvika war seit mindestens 1634 bewohnt, diente im Zweiten
      Weltkrieg als Nachschubdepot und von 1952 bis 1963 als Militärschießplatz, weshalb es vom Park
      ausgespart wurde.


      Lofotodden wurde am 22. Juni 2018 ausgewiesen und am 9. Juni 2019 vom norwegischen Umweltminister
      feierlich eröffnet. Geführte Gruppenreisen werden reguliert, um die Pflanzendecke zu schonen und
      Störungen der Vogelwelt zu minimieren.
    before: >-
      Drohnenflüge sind strikt untersagt, und E-Bikes sind auch bei ausgeschaltetem Motor verboten.
      Motorisierter Verkehr ist zu Lande, zu Wasser und in der Luft unter 300 m untersagt. Zelten ist im
      Abstand von mehr als 150 m zu bewohnten Häusern und für maximal 2 Nächte am selben Platz gestattet.
      Offenes Feuer ist vom 16. September bis 14. April erlaubt; vom 15. April bis 15. September nur dort, wo
      Brandgefahr ausgeschlossen ist. Hunde sind vom 1. April bis 20. August an der Leine zu führen.
      Kommerzielle Gruppenveranstaltungen bedürfen einer Genehmigung.
    around: >-
      Lofotodden hat im Atlas keine unmittelbaren Nachbarn, teilt aber Meeresvögel mit anderen atlantischen
      Küsten: Das [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/) teilt die Dreizehenmöwe, und
      der [Parque Nacional de las Islas Atlánticas de
      Galicia](/lugar/parque-nacional-islas-atlanticas-de-galicia/) die Krähenscharbe.
  it:
    intro: >-
      Immagina una muraglia di vette che emerge dritta dalle acque dell'oceano. Non una dorsale dai dolci
      declivi, ma una sequenza serrata di creste aguzze, con l'oceano aperto da un lato e fiordi profondissimi
      dall'altro. Questo è Lofotodden, il quarantesimo parco nazionale della Norvegia, situato interamente
      sull'isola di Moskenesøya nei comuni di Moskenes e Flakstad. Protegge il settore meridionale di una
      catena di 160 km denominata Lofotenveggen, la 'Muraglia delle Lofoten', e racchiude su 99 km² — 86
      terrestri e 13 marini — scenari e habitat naturali privi di eguali in qualunque altra area protetta
      norvegese.
    landscape: >-
      L'aspro massiccio è composto da rocce vulcaniche e graniti antichi, culminando nell'Hermannsdalstinden a
      1029 m, cima più elevata di Moskenesøya; le altre vette principali si attestano tra 500 e 940 m. Tra di
      esse il territorio è severo e di difficile accesso, pur solcato da sentieri di montagna e valichi
      alpini.


      Il parco tutela ecosistemi differenziati: torbiere, falesie costiere e dune sabbiose. Le dune di
      Kvalvika, Horseidet e Bunes costituiscono i complessi dunali più estesi dell'arcipelago. Malgrado i
      suoli poveri, la flora alpina è ricchissima: le Lofoten figurano tra le prime terre liberate dai ghiacci
      dopo la glaciazione, ospitando popolazioni vegetali antichissime. Vi allignano felci amanti del calcare
      e genziane al loro limite nord-occidentale.
    wildlife: >-
      Lo spettacolo più avvincente si ammira lungo la costa esterna, dove nidificano colonie di urie nere,
      [Marangone dal ciuffo](/especie/phalacrocorax_aristotelis/) e [Gabbiano
      tridattilo](/especie/rissa_tridactyla/), insieme ad aquile reali e [aquile di
      mare](/especie/haliaeetus_albicilla/). La riserva naturale di Lofotodden, all'estremità sudoccidentale
      di Moskenesøya con l'isolotto di Sørholmen, costituisce un'importante oasi di nidificazione per
      l'avifauna marina interna al parco.


      I flussi turistici rispecchiano le stagioni. La massima frequentazione si registra in luglio, con una
      chiara punta a metà mese; l'andamento annuale segue una curva a campana che cresce dalla primavera per
      poi scendere verso l'autunno.
    visit: >-
      Le mete di maggior richiamo sono Kvalvika, Ryten, Bunessanden e Horseid, presidiate da quattro contatori
      automatici di passaggio curati dal parco e dal consiglio per il tempo libero; Kvalvika e Ryten si
      confermano le più battute. Tra le escursioni si segnalano il tragitto da Vinstad alla spiaggia sabbiosa
      di Bunesstrand e la traversata da Å lungo la sponda meridionale del lago Ågvatnet, su cresta scoscesa
      fino al lago Stokkvikvatnet e alla baia di Stokkvika.


      Se programmi una visita a Kvalvika, tieni presente che il parcheggio di Torsfjorden ha posti limitati.
      Per contenere l'erosione del suolo: in bicicletta è consentito transitare unicamente su tracciati già
      battuti, ed è fatto espresso divieto su due percorsi: da Bunesfjorden a Bunes e da Torsfjorden a
      Kvalvika.
    history: >-
      I reperti preistorici e gli insediamenti storici della costa esterna conferiscono al territorio radici
      che risalgono all'età della pietra. La vallata di Stokkvika, lunga circa 2 km, fu abitata stabilmente
      almeno dal 1634, funse da deposito militare durante la Seconda Guerra Mondiale e da poligono di tiro dal
      1952 al 1963, ragione per cui è rimasta esclusa dal perimetro del parco.


      Lofotodden è stato istituito il 22 giugno 2018 e inaugurato ufficialmente il 9 giugno 2019 dal ministro
      dell'Ambiente norvegese. Le escursioni guidate commerciali sono soggette ad autorizzazione per tutelare
      i pascoli d'alta quota e salvaguardare i rapaci e gli uccelli marini nella stagione riproduttiva.
    before: >-
      È tassativamente proibito far volare droni a qualunque titolo, e le biciclette elettriche non sono
      ammesse nemmeno a motore spento. I mezzi a motore sono vietati su terra, in acqua e nello spazio aereo
      sotto i 300 m di quota. Il campeggio libero è consentito ad almeno 150 m dalle abitazioni e per un
      massimo di 2 notti nello stesso punto. I fuochi liberi sono permessi dal 16 settembre al 14 aprile; dal
      15 aprile al 15 settembre solo dove sia escluso il rischio d'incendio. I cani devono essere tenuti al
      guinzaglio dal 1 aprile al 20 agosto. Attività organizzate richiedono l'autorizzazione preventiva
      dell'ente parco.
    around: >-
      Lofotodden non ha vicini diretti nell'atlas, ma condivide uccelli marini con altre coste oceaniche: la
      [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/) ospita il gabbiano tridattilo, e il [Parque
      Nacional de las Islas Atlánticas de Galicia](/lugar/parque-nacional-islas-atlanticas-de-galicia/) il
      marangone dal ciuffo.
  pt:
    intro: >-
      Imagina uma muralha de picos que brota diretamente do oceano. Não uma montanha de encostas suaves, mas
      uma crista serrada de picos aguçados, com o mar aberto de um lado e fiordes profundos do outro. Assim é
      Lofotodden, o quadragésimo parque nacional da Noruega, implantado por inteiro na ilha de Moskenesøya,
      nos municípios de Moskenes e Flakstad. Protege a porção sul de uma cordilheira de 160 km denominada
      Lofotenveggen ('A Muralha de Lofoten'), reunindo ao longo de 99 km² — 86 em terra e 13 em meio marinho —
      paisagens e ecossistemas sem paralelo em qualquer outra reserva norueguesa.
    landscape: >-
      O maciço recortado é talhado em rochas vulcânicas e granito maciço, culminando no Hermannsdalstinden a
      1029 m, o ponto mais alto de Moskenesøya; os restantes cumes destacados situam-se entre os 500 e os 940
      m. Entre eles o terreno mostra-se bravio e de difícil progressão, mas existem veredas de montanha e
      passos alcantilados.


      O parque alberga ecossistemas diferenciados: turfeiras, arribas oceânicas e areais dunares. As dunas de
      Kvalvika, Horseidet e Bunes compõem alguns dos sistemas dunares mais expressivos das ilhas. Não obstante
      os solos pobres em nutrientes, a flora alpina é de grande riqueza: as Lofoten figuraram entre as
      primeiras áreas a libertar-se dos gelos, albergando povoamentos arcaicos de plantas de montanha. Ocorrem
      fetos calcícolas e gencianas no limite noroeste da sua distribuição.
    wildlife: >-
      A maior riqueza congrega-se na costa aberta, onde nidificam colónias de airo-de-asa-branca,
      [Corvo-marinho-de-crista](/especie/phalacrocorax_aristotelis/) e
      [Gaivota-tridáctila](/especie/rissa_tridactyla/), a par de águias-reais e
      [águias-rabalvas](/especie/haliaeetus_albicilla/). A reserva natural de Lofotodden, no extremo sudoeste
      de Moskenesøya incluindo o ilhéu de Sørholmen, constitui um importante santuário de aves marinhas
      inserido no parque.


      A afluência de visitantes espelha o ritmo anual. O maior fluxo regista-se em julho, com um pico vincado
      a meio do mês; a curva de frequência anual sobe a partir da primavera e atenua-se no outono.
    visit: >-
      Os destinos mais emblemáticos são Kvalvika, Ryten, Bunessanden e Horseid, onde a administração e as
      autoridades de lazer mantêm quatro contadores automáticos de passagem; Kvalvika e Ryten continuam a ser
      os mais procurados. Entre as travessias contam-se a rota pedestre de Vinstad até ao areal de Bunesstrand
      e a marcha desde Å pela margem sul do lago Ågvatnet, transpondo uma crista íngreme rumo ao lago
      Stokkvikvatnet e à baía de Stokkvika.


      Se te dirigires a Kvalvika, lembra-te de que o parque de estacionamento de Torsfjorden tem poucos
      lugares. Para minimizar o desgaste: em bicicleta só podes andar por caminhos pré-existentes, sendo
      interdito pedalar em dois trilhos: de Bunesfjorden para Bunes e de Torsfjorden para Kvalvika.
    history: >-
      Os vestígios pré-históricos e as ruínas de povoamento na costa exterior de Moskenesøya imprimem uma
      vasta profundidade temporal, recuando à Idade da Pedra. O pequeno vale de Stokkvika, com cerca de 2 km,
      esteve habitado desde pelo menos 1634, acolheu paióis na Segunda Guerra Mundial e serviu de campo de
      tiro militar entre 1952 e 1963, razão pela qual ficou fora dos limites do parque.


      Lofotodden foi formalmente estabelecido a 22 de junho de 2018 e inaugurado a 9 de junho de 2019 pelo
      ministro do Clima e Ambiente da Noruega. As visitas guiadas com fins comerciais são alvo de
      regulamentação para poupar a vegetação e resguardar a tranquilidade das rapinas e aves em época de
      nidificação.
    before: >-
      É terminantemente proibido pilotar drones, e as bicicletas elétricas não são autorizadas mesmo com o
      motor desligado. Os transportes motorizados são interditos em terra, na água e no ar abaixo dos 300 m. É
      permitido acampar a mais de 150 m de qualquer casa habitada e até 2 noites no mesmo local. Fazer
      fogueiras só é permitido de 16 de setembro a 14 de abril; de 15 de abril a 15 de setembro, unicamente
      onde não exista qualquer perigo de incêndio. Os cães devem ir pela trela de 1 de abril a 20 de agosto.
      Eventos organizados dependem de licença do órgão de gestão.
    around: >-
      Lofotodden não tem vizinhos imediatos no atlas, mas partilha aves marinhas com outras orlas oceânicas: a
      [Reserva Ornitológica de Marwick Head](/lugar/marwick-head/) acolhe a gaivota-tridáctila, e o [Parque
      Nacional de las Islas Atlánticas de Galicia](/lugar/parque-nacional-islas-atlanticas-de-galicia/) o
      corvo-marinho-de-crista.
