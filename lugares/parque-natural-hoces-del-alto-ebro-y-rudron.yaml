resumen:
  es: >-
    Gargantas kársticas de 200 m esculpidas por el río Ebro y el Rudrón, destacando el conjunto de Orbaneja
    del Castillo y Pozo Azul.
  en: >-
    Karst gorges of 200 m carved by the Ebro and Rudrón rivers, featuring the picturesque village of Orbaneja
    del Castillo and Pozo Azul.
  fr: >-
    Gorges karstiques de 200 m sculptées par l'Èbre et le Rudrón, célèbres pour le village d'Orbaneja del
    Castillo et le Pozo Azul.
  de: >-
    Karstschluchten von 200 m Tiefe, geformt von Ebro und Rudrón, mit dem malerischen Dorf Orbaneja del
    Castillo und dem Pozo Azul.
  it: >-
    Gole carsiche di 200 m scavate dai fiumi Ebro e Rudrón, impreziosite dal borgo di Orbaneja del Castillo e
    dal Pozo Azul.
  pt: >-
    Gargantas cársticas de 200 m esculpidas pelos rios Ebro e Rudrón, destacando o conjunto de Orbaneja del
    Castillo e Pozo Azul.
unico:
  es: >-
    Un páramo llano que, de pronto, se rompe en cañones de casi doscientos metros donde un río se esconde bajo
    tierra y otro nace de una cueva.
  en: >-
    A flat plateau that suddenly splits into canyons almost two hundred meters deep where one river disappears
    underground and another emerges from a cave.
  fr: >-
    Un plateau aride qui se brise soudain en canyons de près de deux cents mètres où une rivière disparaît
    sous terre et une autre jaillit d'une grotte.
  de: >-
    Eine weite Hochebene, die unvermittelt in fast zweihundert Meter tiefe Schluchten abbricht, in denen ein
    Fluss im Untergrund verschwindet und ein anderer aus einer Höhle quillt.
  it: >-
    Un altopiano piatto che si spacca all'improvviso in canyon di quasi duecento metri dove un fiume scompare
    sottoterra e un altro sgorga da una caverna.
  pt: >-
    Um planalto plano que se quebra de repente em desfiladeiros de quase duzentos metros onde um rio se
    esconde debaixo da terra e outro nasce de uma gruta.
observaciones:
  es: >-
    Planifica la visita por tramos: la ruta del Rudrón entre San Felices y Valdelateja se divide en tres
    senderos más sencillos, y el Alto Rudrón solo se recorre a pie.
texto:
  es:
    intro: >-
      Hay ríos que se pierden bajo tierra y vuelven a salir kilómetros más allá. El Rudrón hace eso:
      desaparece en el sumidero de Basconcillos del Tozo y resurge en Barrio-Panizares. Es solo una de las
      sorpresas del Parque Natural Hoces del Alto Ebro y Rudrón, en el noroeste de la provincia de Burgos,
      donde el Ebro y el Rudrón han labrado un laberinto de cañones en un páramo calizo. Ocupa 45.767 ha y se
      declaró parque natural por la Ley 15/2008, de 18 de diciembre.
    landscape: >-
      Todo lo hace el agua sobre la caliza. El Ebro y el Rudrón han trabajado el páramo de La Lora, en la zona
      de transición entre la Meseta del Duero y la Cordillera Cantábrica, y sobre materiales del Cretácico
      superior han creado una sucesión de cañones, gargantas y desfiladeros que casi alcanzan los 200 m de
      profundidad. Arriba, los extensos páramos casi llanos; abajo, estrechos fondos de valle encajados entre
      cortados.


      El agua también sale de la roca. La Fuente de Orbaneja surge de una cueva kárstica del cañón del Ebro y
      baja en cascadas hasta el río; al pie se asienta Orbaneja del Castillo, un buen mirador del cañón. En
      Covanera, el Pozo Azul es una surgencia kárstica que da entrada a la cavidad sumergida más extensa de
      España, y en el Bajo Rudrón hay también cascadas de toba en Tubilla del Agua y el dolmen de Valdemuriel.
      El Ebro, en su tramo burgalés, recorre 150 km desde Orbaneja del Castillo en una sucesión de hoces y
      valles abiertos.


      La vegetación sigue otra lógica: aquí se cruzan dos mundos. Las hoces están en la transición entre las
      regiones atlántica y mediterránea, y el encajonamiento de los ríos crea un microclima que mantiene
      vegetación mediterránea en una zona que por latitud es atlántica. Conviven quejigos, encinas, rebollos y
      arces con hayas, y hay riberas de sauces, chopos y alisos. Entre los prados secos sobre caliza hay
      parajes con notables orquídeas.
    wildlife: >-
      Mira a los cortados. Albergan el [águila real](/especie/aquila_chrysaetos/), el [buitre
      leonado](/especie/gyps_fulvus/), el [águila perdicera](/especie/aquila_fasciata/), el [búho
      real](/especie/bubo_bubo/), el [alimoche](/especie/neophron_percnopterus/), el [halcón
      peregrino](/especie/falco_peregrinus/) y la [chova piquirroja](/especie/pyrrhocorax_pyrrhocorax/). En
      los páramos hay aguilucho cenizo, aguilucho pálido, búho campestre,
      [alcaraván](/especie/burhinus_oedicnemus/) y calandria.


      Abajo, en el fondo de los cañones, los bosques de ribera son refugio y zona de alimentación de muchas
      especies. Se han contado 117 aves y 21 mamíferos; entre ellos destacan la
      [nutria](/especie/lutra_lutra/), el [desmán de los Pirineos](/especie/galemys_pyrenaicus/) y el tejón.
      En sotos y riberas viven también el lagarto verdinegro, el [martín pescador](/especie/alcedo_atthis/),
      el autillo y el pico menor. En los ríos, el cangrejo de río autóctono, la trucha, la bermejuela, el
      gobio y el piscardo. Los bosques caducifolios albergan el escarabajo longicornio y el [ciervo
      volante](/especie/lucanus_cervus/), y carnívoros como el [lobo](/especie/canis_lupus/). Las cuevas y
      roquedos son refugio y cría de varias especies de murciélagos.
    visit: >-
      La red de senderos recorre el parque por tramos. El del Rudrón entre San Felices y Valdelateja tiene
      26,1 km y se divide en tres senderos más sencillos: el circular de San Felices, de 7,8 km, y el tramo
      hasta Valdelateja, de 10,7 km. Desde San Felices se puede subir un kilómetro a la ermita de las santas
      Céntola y Elena para ver el valle del Rudrón y el meandro abandonado de Valdelateja.


      El Alto Rudrón es de los rincones menos conocidos del parque y solo se recorre a pie, desde el Barrio de
      Panizares hasta Moradillo del Castillo. Entre Orbaneja del Castillo y Pesquera de Ebro hay dos caminos;
      un tercero por el páramo de La Lora ofrece vistas del Ebro y parapetos de la Guerra Civil, entre
      hayedos, bosques mixtos de quejigo y encina y encinares de monte bajo.
    history: >-
      El parque se protege por la belleza del paisaje, el buen estado de las masas arbóreas y la riqueza de
      fauna ligada a los ríos y a sus paredes verticales. Los valles están más humanizados y explotados
      agrícolamente, pero las hoces conservan bien su fauna y su flora, y la conservación del espacio protege
      su geología, bosques mixtos y fauna, además de sus valores paisajísticos.
    before: >-
      Planifica la visita por tramos: la ruta del Rudrón entre San Felices y Valdelateja se divide en tres
      senderos más sencillos, y el Alto Rudrón solo se recorre a pie.
    around: >-
      Entre los lugares lejanos, la [Serra do Courel](/lugar/zec-serra-do-courel/) comparte desmán y nutria
      entre ríos y bosque maduro, y el [Parc national des Pyrénées](/lugar/parc-national-des-pyrenees/)
      comparte desmán y águila real entre gargantas y bosque maduro.
  en:
    intro: >-
      Some rivers disappear underground and re-emerge kilometres away. The Rudrón does just that: it vanishes
      into the swallow hole of Basconcillos del Tozo and resurfaces in Barrio-Panizares. It is only one of the
      surprises of Hoces del Alto Ebro y Rudrón Natural Park, in north-western Burgos province, where the Ebro
      and Rudrón have carved a labyrinth of canyons across a limestone plateau. It covers 45,767 ha and was
      designated a natural park by Law 15/2008 of 18 December.
    landscape: >-
      Everything is shaped by water on limestone. The Ebro and the Rudrón have worked the plateau of La Lora,
      in the transition zone between the Duero plateau and the Cantabrian Mountains, sculpting Upper
      Cretaceous bedrock into a succession of canyons, gorges and defiles that reach nearly 200 m in depth.
      Above lie vast, nearly flat plateaus; below, narrow valley floors hemmed in between cliffs.


      Water also bursts from the rock. The Fuente de Orbaneja springs from a karst cave in the Ebro canyon and
      cascades down to the river; at its foot lies Orbaneja del Castillo, an excellent viewpoint over the
      gorge. In Covanera, the Pozo Azul is a karst upwelling that opens into the longest submerged cave system
      in Spain, while in the Lower Rudrón there are also tufa cascades in Tubilla del Agua and the Valdemuriel
      dolmen. In its Burgos section, the Ebro flows for 150 km from Orbaneja del Castillo through a sequence
      of gorges and open valleys.


      The vegetation follows another logic: two worlds meet here. The gorges lie in the transition between
      Atlantic and Mediterranean biogeographical regions, and the enclosed river courses create a microclimate
      that sustains Mediterranean plants at an Atlantic latitude. Portuguese oaks, holm oaks, Pyrenean oaks
      and maples grow alongside beeches, while willow, poplar and alder line the rivers. Among dry limestone
      meadows grow notable wild orchids.
    wildlife: >-
      Look up at the cliffs. They shelter the [golden eagle](/especie/aquila_chrysaetos/), [griffon
      vulture](/especie/gyps_fulvus/), [Bonelli's eagle](/especie/aquila_fasciata/), [Eurasian
      eagle-owl](/especie/bubo_bubo/), [Egyptian vulture](/especie/neophron_percnopterus/), [peregrine
      falcon](/especie/falco_peregrinus/) and [red-billed chough](/especie/pyrrhocorax_pyrrhocorax/). Across
      the open moors live Montagu's harrier, hen harrier, short-eared owl, [Eurasian
      stone-curlew](/especie/burhinus_oedicnemus/) and calandra lark.


      Below, along the canyon floors, gallery forests provide shelter and feeding grounds for many species.
      Observers have recorded 117 birds and 21 mammals; prominent among them are the [Eurasian
      otter](/especie/lutra_lutra/), [Pyrenean desman](/especie/galemys_pyrenaicus/) and Eurasian badger. The
      riverbanks and thickets are home to the Schreiber's green lizard, [common
      kingfisher](/especie/alcedo_atthis/), Eurasian scops owl and lesser spotted woodpecker. In the waters
      live native white-clawed crayfish, brown trout, bermejuela, gudgeon and Eurasian minnow. The deciduous
      woodlands harbour longhorn beetles and the [stag beetle](/especie/lucanus_cervus/), as well as
      carnivores like the [grey wolf](/especie/canis_lupus/). Caves and rock faces serve as roosting and
      nursery sites for several bat species.
    visit: >-
      The trail network covers the park in sections. The Rudrón route between San Felices and Valdelateja
      spans 26.1 km and splits into three simpler trails: the circular San Felices walk of 7.8 km, and the
      stretch to Valdelateja of 10.7 km. From San Felices you can climb one kilometre to the hermitage of
      Saints Céntola and Elena for views over the Rudrón valley and the abandoned meander of Valdelateja.


      The Upper Rudrón is among the least known corners of the park and can only be explored on foot, from
      Barrio de Panizares to Moradillo del Castillo. Between Orbaneja del Castillo and Pesquera de Ebro there
      are two paths; a third over the La Lora plateau offers vistas of the Ebro and Civil War parapets,
      passing through beech woods, mixed oak woodlands and Mediterranean scrub.
    history: >-
      The park is protected for the scenic beauty of its landscape, the pristine state of its woodlands and
      the rich wildlife tied to the rivers and their sheer vertical walls. The open valleys are more heavily
      settled and farmed, but the gorges preserve their flora and fauna remarkably well. Protection safeguards
      its geology, mixed forests and wildlife alongside its outstanding scenic value.
    before: >-
      Plan your visit in sections: the Rudrón route between San Felices and Valdelateja divides into three
      simpler trails, and the Upper Rudrón can only be reached on foot.
    around: >-
      Among distant landscapes, [Serra do Courel](/lugar/zec-serra-do-courel/) shares the desman and otter
      between clear rivers and old-growth woods, while [Parc national des
      Pyrénées](/lugar/parc-national-des-pyrenees/) shares the desman and golden eagle across deep gorges and
      mature forests.
  fr:
    intro: >-
      Certaines rivières s'engouffrent sous terre pour reparaître des kilomètres plus loin. C'est ce que fait
      le Rudrón : il disparaît dans la perte de Basconcillos del Tozo pour ressurgir à Barrio-Panizares. Ce
      n'est qu'une des surprises du parc naturel Hoces del Alto Ebro y Rudrón, dans le nord-ouest de la
      province de Burgos, où l'Èbre et le Rudrón ont taillé un labyrinthe de gorges dans un causse calcaire.
      Il s'étend sur 45 767 ha et a été classé parc naturel par la loi 15/2008 du 18 décembre.
    landscape: >-
      Tout est façonné par l'eau sur le calcaire. L'Èbre et le Rudrón ont incisé le plateau de La Lora, dans
      la zone de transition entre le plateau du Douro et la cordillère Cantabrique, sculptant dans les
      formations du Crétacé supérieur une succession de canyons, gorges et défilés qui atteignent presque 200
      m de profondeur. Au sommet s'étendent de vastes plateaux presque plans ; en bas, d'étroits fonds de
      vallée encaissés entre des falaises.


      L'eau jaillit aussi directement de la roche. La Fuente de Orbaneja sourd d'une grotte karstique du
      canyon de l'Èbre et dévale en cascades jusqu'au fleuve ; à son pied est bâti Orbaneja del Castillo,
      superbe belvédère sur la gorge. À Covanera, le Pozo Azul est une exsurgence karstique qui donne accès à
      la plus vaste cavité submergée d'Espagne, tandis que dans le Bas-Rudrón se trouvent aussi des cascades
      de tuf à Tubilla del Agua et le dolmen de Valdemuriel. Dans son secteur burgalais, l'Èbre parcourt 150
      km depuis Orbaneja del Castillo au fil d'une succession de gorges et de vallées ouvertes.


      La végétation obéit à une autre logique : deux mondes se croisent ici. Les gorges se trouvent à la
      charnière des régions atlantique et méditerranéenne, et l'encaissement des rivières crée un microclimat
      qui maintient des essences méditerranéennes sous une latitude atlantique. Chênes faginés, chênes verts,
      chênes tauzins et érables côtoient les hêtres, tandis que les rives abritent saules, peupliers et
      aulnes. Les pelouses sèches sur calcaire recèlent de remarquables orchidées sauvages.
    wildlife: >-
      Levez les yeux vers les falaises. Elles abritent l'[aigle royal](/especie/aquila_chrysaetos/), le
      [vautour fauve](/especie/gyps_fulvus/), l'[aigle de Bonelli](/especie/aquila_fasciata/), le [hibou
      grand-duc](/especie/bubo_bubo/), le [percnoptère](/especie/neophron_percnopterus/), le [faucon
      pèlerin](/especie/falco_peregrinus/) et le [crave à bec rouge](/especie/pyrrhocorax_pyrrhocorax/). Sur
      les plateaux vivent le busard cendré, le busard Saint-Martin, le hibou des marais, l'[œdicnème
      criard](/especie/burhinus_oedicnemus/) et la calandre.


      En bas, au fond des gorges, les ripisylves constituent le refuge et le terrain de chasse de nombreuses
      espèces. On y a recensé 117 oiseaux et 21 mammifères ; parmi eux se distinguent la [loutre
      d'Europe](/especie/lutra_lutra/), le [desman des Pyrénées](/especie/galemys_pyrenaicus/) et le blaireau.
      Dans les bosquets de rive vivent le lézard vert ibérique, le [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/), le petit-duc scops et le pic épeichette. Dans les cours d'eau
      subsistent l'écrevisse à pattes blanches autochtone, la truite, la bermejuela, le goujon et le vairon.
      Les forêts de feuillus abritent des capricornes et le [lucane cerf-volant](/especie/lucanus_cervus/),
      ainsi que de grands carnivores comme le [loup](/especie/canis_lupus/). Grottes et parois rocheuses
      abritent plusieurs espèces de chauves-souris en reproduction.
    visit: >-
      Le réseau de sentiers permet de parcourir le parc par étapes. L'itinéraire du Rudrón entre San Felices
      et Valdelateja s'étend sur 26,1 km et se divise en trois sentiers plus simples : la boucle de San
      Felices, de 7,8 km, et le tronçon jusqu'à Valdelateja, de 10,7 km. Depuis San Felices, vous pouvez
      monter un kilomètre jusqu'à l'ermitage des saintes Céntola et Elena pour contempler la vallée du Rudrón
      et le méandre abandonné de Valdelateja.


      Le Haut-Rudrón compte parmi les recoins les plus sauvages du parc et ne se parcourt qu'à pied, depuis
      Barrio de Panizares jusqu'à Moradillo del Castillo. Entre Orbaneja del Castillo et Pesquera de Ebro
      courent deux chemins ; un troisième passant par le causse de La Lora offre de splendides vues sur l'Èbre
      et d'anciens parapets de la guerre civile, au milieu de hêtraies, de forêts mixtes de chênes et de
      taillis méditerranéens.
    history: >-
      Le parc est protégé pour la splendeur de ses paysages, la vitalité de ses massifs forestiers et
      l'exceptionnelle richesse de sa faune liée aux rivières et aux falaises. Les vallées sont davantage
      habitées et exploitées par l'agriculture, mais les gorges préservent remarquablement leur faune et leur
      flore, garantissant la protection de la géologie, des forêts mixtes et de la biodiversité.
    before: >-
      Organisez votre visite par étapes : l'itinéraire du Rudrón entre San Felices et Valdelateja se divise en
      trois sentiers plus simples, et le Haut-Rudrón ne se visite qu'à pied.
    around: >-
      Parmi les espaces plus lointains, la [Serra do Courel](/lugar/zec-serra-do-courel/) partage desman et
      loutre entre rivières vives et forêt mature, tandis que le [Parc national des
      Pyrénées](/lugar/parc-national-des-pyrenees/) partage le desman et l'aigle royal au cœur des gorges et
      des futaies anciennes.
  de:
    intro: >-
      Manche Flüsse verschwinden im Untergrund und tauchen erst Kilometer weiter wieder auf. Der Rudrón tut
      genau das: Er versickert im Schluckloch von Basconcillos del Tozo und tritt in Barrio-Panizares wieder
      ans Licht. Es ist nur eine der Überraschungen des Naturparks Hoces del Alto Ebro y Rudrón im Nordwesten
      der Provinz Burgos, wo Ebro und Rudrón ein Labyrinth aus Schluchten in ein Kalkplateau geschnitten
      haben. Er umfasst 45.767 ha und wurde mit dem Gesetz 15/2008 vom 18. Dezember zum Naturpark erklärt.
    landscape: >-
      Alles verdankt sich der Wirkung des Wassers auf Kalkstein. Ebro und Rudrón haben die Hochebene von La
      Lora im Übergang zwischen der Duero-Hochebene und dem Kantabrischen Gebirge bearbeitet und im Gestein
      der Oberkreide eine Folge von Canyons, Schluchten und Engpässen geschaffen, die fast 200 m Tiefe
      erreichen. Oben weite, nahezu ebene Hochflächen; unten schmale, zwischen Felswände eingezwängte
      Talgründe.


      Das Wasser quillt auch direkt aus dem Fels. Die Quelle von Orbaneja entspringt einer Karsthöhle im
      Ebro-Canyon und stürzt über Kaskaden zum Fluss hinab; an ihrem Fuß schmiegt sich Orbaneja del Castillo
      an den Fels, ein hervorragender Aussichtspunkt auf die Schlucht. In Covanera bildet der Pozo Azul eine
      Karstquelle, die den Eingang zum weitläufigsten Unterwasserhöhlensystem Spaniens darstellt, während im
      Unteren Rudrón Tuffkaskaden in Tubilla del Agua und der Dolmen von Valdemuriel liegen. Auf seinem
      Abschnitt in Burgos legt der Ebro ab Orbaneja del Castillo 150 km in einer Abfolge aus Schluchten und
      offenen Tälern zurück.


      Die Vegetation folgt einer ganz eigenen Dynamik: Hier begegnen sich zwei Welten. Die Schluchten liegen
      im Übergang zwischen atlantischer und mediterraner Region, und die tiefe Lage der Flüsse erzeugt ein
      Mikroklima, das wärmeliebende Pflanzen auf atlantischer Breite gedeihen lässt. Portugiesische Eichen,
      Steineichen, Pyrenäen-Eichen und Ahorne wachsen neben Buchen, während Weiden, Pappeln und Erlen die Ufer
      säumen. Auf trockenen Kalkrasen blühen bemerkenswerte wilde Orchideen.
    wildlife: >-
      Blicke zu den Steilwänden empor. Sie bieten Brutplätze für [Steinadler](/especie/aquila_chrysaetos/),
      [Gänsegeier](/especie/gyps_fulvus/), [Habichtsadler](/especie/aquila_fasciata/),
      [Uhu](/especie/bubo_bubo/), [Schmutzgeier](/especie/neophron_percnopterus/),
      [Wanderfalke](/especie/falco_peregrinus/) und [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/). Auf den
      Hochebenen leben Wiesenweihe, Kornweihe, Sumpfohreule, [Triel](/especie/burhinus_oedicnemus/) und
      Kalanderlerche.


      Unten am Grund der Schluchten dienen Auwälder zahlreichen Arten als Rückzugsraum und Nahrungsrevier.
      Gezählt wurden 117 Vogelarten und 21 Säugetierarten; hervorzuheben sind der [Eurasische
      Fischotter](/especie/lutra_lutra/), der [Pyrenäen-Desman](/especie/galemys_pyrenaicus/) und der Dachs.
      In Ufergehölzen leben die Smaragdeidechse, der [Eisvogel](/especie/alcedo_atthis/), die Zwergohreule und
      der Kleinspecht. In den Flüssen behaupten sich der einheimische Edelkrebs, Forellen, Bermejuelas,
      Gründlinge und Elritzen. Laubwälder beherbergen Bockkäfer und den
      [Hirschkäfer](/especie/lucanus_cervus/) sowie Raubtiere wie den [Wolf](/especie/canis_lupus/). Höhlen
      und Felswände bieten mehreren Fledermausarten Quartier.
    visit: >-
      Das Wegenetz erschließt den Park in Etappen. Die Rudrón-Route zwischen San Felices und Valdelateja misst
      26,1 km und unterteilt sich in drei einfachere Wege: den 7,8 km langen Rundweg von San Felices und den
      10,7 km langen Abschnitt nach Valdelateja. Von San Felices aus kannst du einen Kilometer zur Einsiedelei
      Santa Céntola und Santa Elena aufsteigen, um das Rudrón-Tal und die verlassene Flussschleife von
      Valdelateja zu überblicken.


      Der Obere Rudrón gehört zu den stillsten Ecken des Parks und lässt sich nur zu Fuß erkunden, von Barrio
      de Panizares nach Moradillo del Castillo. Zwischen Orbaneja del Castillo und Pesquera de Ebro gibt es
      zwei Wege; ein dritter über die Hochebene von La Lora bietet Blicke auf den Ebro und Schützengräben aus
      dem Bürgerkrieg zwischen Buchen, Eichenmischwäldern und Steineichenbuschwerk.
    history: >-
      Der Park steht wegen der landschaftlichen Schönheit, des hervorragenden Zustands der Waldbestände und
      der reichen Tierwelt an Flüssen und Steilwänden unter Schutz. Die offenen Täler sind stärker besiedelt
      und landwirtschaftlich genutzt, doch die Schluchten bewahren ihre Tier- und Pflanzenwelt weitgehend
      unberührt und schützen Geologie, Mischwälder und Artenvielfalt.
    before: >-
      Plane deinen Besuch abschnittsweise: Die Rudrón-Route zwischen San Felices und Valdelateja teilt sich in
      drei einfachere Wege, und der Obere Rudrón ist ausschließlich zu Fuß erreichbar.
    around: >-
      Unter den weiter entfernten Schutzgebieten teilt die [Serra do Courel](/lugar/zec-serra-do-courel/)
      Desman und Fischotter zwischen Wildflüssen und alten Bergwäldern, während der [Parc national des
      Pyrénées](/lugar/parc-national-des-pyrenees/) Desman und Steinadler in Schluchten und Bergwäldern
      beheimatet.
  it:
    intro: >-
      Ci sono fiumi che sprofondano nel sottosuolo e riaffiorano chilometri più avanti. Il Rudrón fa proprio
      questo: sparisce nell'inghiottitoio di Basconcillos del Tozo e rispunta a Barrio-Panizares. È solo una
      delle meraviglie del Parco naturale Hoces del Alto Ebro y Rudrón, nel nord-ovest della provincia di
      Burgos, dove l'Ebro e il Rudrón hanno scavato un labirinto di gole in un altopiano calcareo. Si estende
      su 45.767 ha ed è stato dichiarato parco naturale con la legge 15/2008 del 18 dicembre.
    landscape: >-
      Tutto è opera dell'acqua sulla roccia calcarea. L'Ebro e il Rudrón hanno modellato l'altopiano di La
      Lora, nella fascia di transizione tra la Meseta del Duero e la Cordigliera Cantabrica, intagliando nei
      calcari del Cretacico superiore una serie di canyon, gole e forre che sfiorano i 200 m di profondità. In
      alto si allargano gli altipiani spogli quasi pianeggianti; in basso, stretti fondovalle serrati tra
      pareti a strapiombo.


      L'acqua sgorga abbondante anche dalla roccia. La Fuente de Orbaneja scaturisce da una grotta carsica nel
      canyon dell'Ebro e scende a cascata verso il fiume; ai suoi piedi sorge Orbaneja del Castillo, perfetto
      belvedere sulla forra. A Covanera, il Pozo Azul è una risorgiva carsica che apre l'accesso alla cavità
      sommersa più lunga di Spagna, mentre nel Basso Rudrón si ammirano le cascate di tufo a Tubilla del Agua
      e il dolmen di Valdemuriel. Nel suo tratto di Burgos, l'Ebro scorre per 150 km a partire da Orbaneja del
      Castillo alternando gole sinuose e ampie vallate.


      La vegetazione segue un'altra logica: qui si incontrano due mondi. Le gole si collocano al confine tra
      le regioni atlantica e mediterranea, e l'incasso delle valli genera un microclima caldo che mantiene
      specie mediterranee a una latitudine atlantica. Querce dei Pirenei, lecci, farnie e aceri crescono
      accanto ai faggi, mentre salici, pioppi e ontani costeggiano i fiumi. Sui prati aridi calcarei crescono
      orchidee selvatiche di grande pregio.
    wildlife: >-
      Guarda verso le pareti rocciose. Vi nidificano l'[aquila reale](/especie/aquila_chrysaetos/), il
      [grifone](/especie/gyps_fulvus/), l'[aquila di Bonelli](/especie/aquila_fasciata/), il [gufo
      reale](/especie/bubo_bubo/), il [capovaccaio](/especie/neophron_percnopterus/), il [falco
      pellegrino](/especie/falco_peregrinus/) e il [gracchio corallino](/especie/pyrrhocorax_pyrrhocorax/).
      Sulle brughiere aperte vivono l'albanella minore, l'albanella reale, il gufo di palude,
      l'[occhione](/especie/burhinus_oedicnemus/) e la calandra.


      In basso, sul fondovalle, i boschi ripariali offrono riparo e sostentamento a molte specie. Sono stati
      censiti 117 uccelli e 21 mammiferi; tra questi spiccano la [lontra europea](/especie/lutra_lutra/), il
      [desman dei Pirenei](/especie/galemys_pyrenaicus/) e il tasso. Nelle boscaglie fluviali vivono anche la
      lucertola verde iberica, il [martin pescatore](/especie/alcedo_atthis/), l'assiolo e il picchio rosso
      minore. Nei fiumi vivono il gambero d'acqua dolce indigeno, la trota, la bermejuela, il gobione e la
      sanguinerola. I boschi decidui ospitano cerambici e il [cervo volante](/especie/lucanus_cervus/), oltre
      a predatori come il [lupo grigio](/especie/canis_lupus/). Grotte e balze rocciose danno rifugio a
      numerose colonie di pipistrelli.
    visit: >-
      La rete escursionistica attraversa il parco a tappe. Il percorso del Rudrón tra San Felices e
      Valdelateja misura 26,1 km e si scompone in tre sentieri più semplici: l'anello di San Felices, di 7,8
      km, e il tratto fino a Valdelateja, di 10,7 km. Da San Felices puoi salire per un chilometro fino
      all'eremo di Santa Céntola e Santa Elena per ammirare la valle del Rudrón e il meandro abbandonato di
      Valdelateja.


      L'Alto Rudrón è tra gli angoli più appartati del parco e si visita solo a piedi, da Barrio de Panizares
      a Moradillo del Castillo. Tra Orbaneja del Castillo e Pesquera de Ebro corrono due sentieri; un terzo
      sull'altopiano di La Lora regala scorci sull'Ebro e postazioni della guerra civile, tra faggete, boschi
      misti di querce e macchia di leccio.
    history: >-
      Il parco è tutelato per la bellezza del paesaggio, il rigoglio delle coperture boschive e la ricchezza
      faunistica legata ai corsi d'acqua e alle rupi verticali. Le valli esterne sono maggiormente
      antropizzate e coltivate, ma le forre conservano intatte flora e fauna, assicurando la salvaguardia di
      geologia, boschi misti e biodiversità.
    before: >-
      Organizza la visita a tappe: l'itinerario del Rudrón tra San Felices e Valdelateja si suddivide in tre
      sentieri più semplici, e l'Alto Rudrón si percorre esclusivamente a piedi.
    around: >-
      Tra i siti più lontani, la [Serra do Courel](/lugar/zec-serra-do-courel/) condivide desman e lontra tra
      fiumi limpidi e faggete mature, mentre il [Parc national des
      Pyrénées](/lugar/parc-national-des-pyrenees/) accoglie desman e aquila reale tra forre aspre e boschi
      secolari.
  pt:
    intro: >-
      Há rios que se perdem debaixo de terra e voltam a surgir quilómetros mais adiante. O Rudrón faz isso
      mesmo: desaparece no sumidouro de Basconcillos del Tozo e ressurge em Barrio-Panizares. É apenas uma das
      surpresas do Parque Natural Hoces del Alto Ebro y Rudrón, no noroeste da província de Burgos, onde o
      Ebro e o Rudrón talharam um labirinto de gargantas num planalto calcário. Ocupa 45.767 ha e foi
      declarado parque natural pela Lei 15/2008, de 18 de dezembro.
    landscape: >-
      Tudo é obra da água sobre o calcário. O Ebro e o Rudrón trabalharam o planalto de La Lora, na transição
      entre a Meseta do Douro e a Cordilheira Cantábrica, escavando nos materiais do Cretácico superior uma
      sucessão de desfiladeiros, gargantas e ravinas que atingem quase 200 m de profundidade. No cimo, os
      vastos planaltos quase planos; em baixo, fundos de vale estreitos encaixados entre escarpas.


      A água também brota da rocha. A Fuente de Orbaneja nasce de uma gruta cárstica no desfiladeiro do Ebro e
      desce em cascatas até ao rio; ao pé ergue-se Orbaneja del Castillo, um excelente miradouro sobre a
      garganta. Em Covanera, o Pozo Azul é uma ressurgência cárstica que dá entrada à cavidade submersa mais
      extensa de Espanha, e no Baixo Rudrón encontram-se também cascatas de tufo em Tubilla del Agua e o
      dólmen de Valdemuriel. No seu troço burgalês, o Ebro percorre 150 km desde Orbaneja del Castillo numa
      alternância de gargantas e vales abertos.


      A vegetação obedece a outra lógica: cruzam-se aqui dois mundos. As gargantas ficam na charneira entre as
      regiões atlântica e mediterrânica, e o encaixe dos rios gera um microclima que sustenta vegetação
      mediterrânica numa latitude atlântica. Convivem carvalhos-cerquinhos, azinheiras, carvalhos-negrales e
      bordos com faias, surgindo nas margens salgueiros, choupos e amieiros. Entre os prados secos sobre
      calcário vicejam orquídeas notáveis.
    wildlife: >-
      Olha para as escarpas. Acolhem a [águia-real](/especie/aquila_chrysaetos/), o
      [abutre-fouveiro](/especie/gyps_fulvus/), a [águia-de-bonelli](/especie/aquila_fasciata/), o
      [bufo-real](/especie/bubo_bubo/), o [abutre-do-egito](/especie/neophron_percnopterus/), o
      [falcão-peregrino](/especie/falco_peregrinus/) e a
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/). Nos planaltos abertos vivem o
      tartaranhão-caçador, o tartaranhão-azulado, o bufo-campestre, o
      [alcaravão](/especie/burhinus_oedicnemus/) e a calhandra.


      Em baixo, no fundo dos desfiladeiros, as matas ripícolas são refúgio e área de alimentação para muitas
      espécies. Contaram-se 117 aves e 21 mamíferos; entre eles destacam-se a
      [lontra-europeia](/especie/lutra_lutra/), a [toupeira-da-água](/especie/galemys_pyrenaicus/) e o texugo.
      Nas margens habitam também o sardão-verde, o [guarda-rios-comum](/especie/alcedo_atthis/), o
      mocho-d'orelhas e o pica-pau-malhado-pequeno. Nos rios encontram-se o lagostim-de-patas-brancas
      autóctone, a truta, a bermejuela, o góbio e o boga-do-norte. Os bosques caducifólios albergam
      escaravelhos-longicórnios e a [vaca-loura](/especie/lucanus_cervus/), além de carnívoros como o
      [lobo-cinzento](/especie/canis_lupus/). Grutas e fragas acolhem diversas espécies de morcegos.
    visit: >-
      A rede de percursos percorre o parque por etapas. O trilho do Rudrón entre San Felices e Valdelateja tem
      26,1 km e divide-se em três trilhos mais simples: o circular de San Felices, de 7,8 km, e o troço até
      Valdelateja, de 10,7 km. A partir de San Felices podes subir um quilómetro até à ermida de Santa Céntola
      e Santa Elena para avistar o vale do Rudrón e o meandro abandonado de Valdelateja.


      O Alto Rudrón é dos recantos mais desconhecidos do parque e só se percorre a pé, desde Barrio de
      Panizares até Moradillo del Castillo. Entre Orbaneja del Castillo e Pesquera de Ebro há dois caminhos;
      um terceiro pelo planalto de La Lora oferece vistas do Ebro e parapeitos da Guerra Civil, por entre
      faiais, bosques mistos de carvalho e azinheira e matagais rasteiros.
    history: >-
      O parque é protegido pela beleza da paisagem, pelo vigor das massas florestais e pela riqueza de fauna
      associada aos rios e às suas arribas verticais. Os vales abertos estão mais humanizados e sujeitos à
      exploração agrícola, mas as gargantas mantêm muito bem a fauna e a flora, resguardando a geologia, as
      matas mistas e os valores cénicos.
    before: >-
      Planeia a visita por etapas: o percurso do Rudrón entre San Felices e Valdelateja divide-se em três
      trilhos mais simples, e o Alto Rudrón só se percorre a pé.
    around: >-
      Entre os lugares afastados, a [Serra do Courel](/lugar/zec-serra-do-courel/) partilha a toupeira-da-água
      e a lontra entre rios e bosque maduro, e o [Parc national des
      Pyrénées](/lugar/parc-national-des-pyrenees/) partilha a toupeira-da-água e a águia-real entre gargantas
      e floresta antiga.
