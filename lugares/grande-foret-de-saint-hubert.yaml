resumen:
  es: >-
    El corazón salvaje de las Ardenas belgas, célebre por sus extensas manadas de ciervo y bosques de robles y
    hayas.
  en: >-
    The wild heart of the Belgian Ardennes, famed for its large red deer herds and ancient oak and beech
    woodlands.
  fr: Le cœur sauvage de l'Ardenne belge, réputé pour ses hardes de cerfs et ses futaies de chênes et de hêtres.
  de: >-
    Das wilde Herz der belgischen Ardennen, berühmt für seine großen Rothirschrudel und dichten Eichen- und
    Buchenwälder.
  it: >-
    Il cuore selvaggio delle Ardenne belghe, celebre per i grandi branchi di cervi e le foreste vetuste di
    querce e faggi.
  pt: >-
    O coração selvagem das Ardenas belgas, afamado pelas suas grandes manadas de veados e bosques de carvalhos
    e faiais.
unico:
  es: >-
    Un bosque donde, a final del verano, parte del macizo se cierra al público de las cinco de la tarde a las
    nueve de la mañana para dejar oír la berrea del ciervo.
  en: >-
    A vast woodland where, in late summer, sectors of the massif close to the public from five in the
    afternoon to nine in the morning so visitors can hear the rutting call of red deer.
  fr: >-
    Une forêt où, en fin d'été, une partie du massif est fermée au public de cinq heures de l'après-midi à
    neuf heures du matin pour laisser résonner le brame du cerf.
  de: >-
    Ein Waldmassiv, in dem zum Spätsommer Teile des Gebiets von fünf Uhr nachmittags bis neun Uhr morgens
    gesperrt werden, damit Besucher die Hirschbrunft ungestört hören können.
  it: >-
    Una foresta dove, a fine estate, parte del massiccio chiude al pubblico dalle cinque del pomeriggio alle
    nove del mattino per consentire l'ascolto del bramito del cervo.
  pt: >-
    Uma floresta onde, no final do verão, setores do maciço encerram ao público das cinco da tarde às nove da
    manhã para permitir escutar a brama do veado.
observaciones:
  es: >-
    Los perros deben ir siempre atados. Los vehículos a motor no pueden salir de las carreteras o áreas
    balizadas. Entre el 1 de octubre y el 31 de diciembre hay batidas de caza en la región y, durante esos
    meses, algunas zonas del bosque quedan vedadas al público todo el día. Los mejores meses van de mayo a
    octubre, y septiembre es el de la berrea.
texto:
  es:
    intro: >-
      A mediados de septiembre, cuando cae la tarde, parte del bosque de Saint-Hubert se cierra y empieza a
      oírse otra cosa. Es la berrea del ciervo, y la Gran Foresta de Saint-Hubert, en la provincia belga de
      Luxemburgo, es un bosque de robles y hayas célebre por sus ciervos, atravesado por más de doscientos
      itinerarios a pie con su distancia, su desnivel y su señalización.
    landscape: >-
      El bosque es un mosaico de hayedos, robledales, turberas y estanques que se recorre por caminos y
      senderos balizados. No es un paisaje único: los itinerarios llevan a los bosques pantanosos de Rouge
      Poncé, que bordea el recorrido número siete de «Entre rivières et forêt», de 9,7 kilómetros; a las
      antiguas zonas de extracción de turba, que se rodean por el sendero Les troufferies, de seis kilómetros
      desde Roumont-Ochamps; a las turberas, los humedales y los estanques.


      También hay miradores. Un sendero de cuatro kilómetros desde Resteigne recorre la reserva natural de Les
      Pairées, y otro circular de 12,8 kilómetros desde Tellin pasa por la Fagne du Mâ d’Eau. Desde la Tour de
      Priesse, a lo largo del paseo de Mochamps, se ve un panorama de 360 grados.
    wildlife: >-
      El ciervo es el símbolo del lugar. La época habitual de la [berrea del ciervo](/especie/cervus_elaphus/)
      va de mediados de septiembre a mediados de octubre. En septiembre, normalmente desde la segunda semana,
      una parte del macizo se cierra de las cinco de la tarde a las nueve de la mañana, y se habilitan puntos
      para escuchar libremente. La clave es la discreción: hay que evitar la ropa ruidosa.


      Varios recorridos de la región se dirigen a sitios acondicionados para observar la fauna y sus hábitats,
      como Bilaude y el punto de Amonys. La ruta siete de Tenneville lleva al mirador Fagne à la Fontaine y a
      la Tour de Priesse.
    visit: >-
      Con tantos itinerarios, lo mejor es elegir por tema. Para aprender, hay paseos didácticos: la Promenade
      didactique du Marsoult, un circuito llano de cinco kilómetros alrededor de estanques que interpreta la
      biodiversidad, los depredadores de peces y los árboles; el sendero del Bois de la Fontaine, en
      Laneuville-au-Bois, de un kilómetro por el bosque, que habla de la naturaleza y del uso celta del
      entorno; y el paseo celta de Libramont, de 1,3 o 3 km, que explica cómo los celtas aprovechaban su
      entorno. El Sentier des Nutons, de 1,8 km en Libin, sigue las huellas de los nutons, los enanos de las
      leyendas ardenesas. El del humedal de Lomprez se hace en unos treinta minutos.


      Se puede caminar gratis por los itinerarios balizados, y también de noche, salvo cierres excepcionales.
    history: >-
      El bosque es un espacio Natura 2000. Las normas buscan reducir el impacto de la visita: caminar solo por
      los caminos y senderos autorizados, encender fuego solo en las zonas habilitadas, dormir únicamente en
      las áreas de vivac autorizadas, reservadas a senderistas en itinerancia.
    before: >-
      Los perros deben ir siempre atados. Los vehículos a motor no pueden salir de las carreteras o áreas
      balizadas. Entre el 1 de octubre y el 31 de diciembre hay batidas de caza en la región y, durante esos
      meses, algunas zonas del bosque quedan vedadas al público todo el día. Los mejores meses van de mayo a
      octubre, y septiembre es el de la berrea.
    around: >-
      A dieciocho kilómetros queda el [Parque Nacional del Valle del
      Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), a veinticuatro el [Parque Natural del Alto Sûre
      - Bosques del Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/) y a veintiséis el [Bosque de
      Anlier](/lugar/foret-d-anlier/).
  en:
    intro: >-
      In mid-September as evening falls, parts of Saint-Hubert forest close and a primeval sound takes over
      the canopy. This is the rutting of the red deer, and the Great Forest of Saint-Hubert in the Belgian
      province of Luxembourg is an expanse of oak and beech woodlands celebrated for its cervid herds, laced
      with more than two hundred marked walking itineraries detailing distance, gradients, and waymarking.
    landscape: >-
      The forest forms a rich mosaic of beech groves, oak stands, peat bogs, and woodland ponds explored along
      designated footpaths and tracks. The scenery is diverse: trails lead to the marshy woods of Rouge Poncé
      along route number seven of «Entre rivières et forêt» covering 9.7 kilometers; to ancestral peat-cutting
      hollows circled by the six-kilometer Les Troufferies trail from Roumont-Ochamps; and to sprawling peat
      mires, wetlands, and open water bodies.


      Belvederes dot the massif. A four-kilometer walk from Resteigne explores the Les Pairées nature reserve,
      while a 12.8-kilometer circular route from Tellin traverses the Fagne du Mâ d’Eau. From the Tour de
      Priesse along the Mochamps promenade, a commanding 360-degree panorama unfolds across the Ardennes.
    wildlife: >-
      The red deer stands as the undisputed emblem of the forest. The rutting season of the [red
      deer](/especie/cervus_elaphus/) runs from mid-September to mid-October. Throughout September, typically
      beginning in the second week, designated sectors of the massif are closed between five in the afternoon
      and nine in the morning, with designated listening posts provided for quiet observation. Discretion is
      paramount: quiet clothing without rustling fabrics is essential.


      Several regional routes guide visitors to purpose-built wildlife observation blinds and interpretation
      points, such as Bilaude and the Amonys lookout. Trail seven from Tenneville leads to the Fagne à la
      Fontaine lookout and the Tour de Priesse.
    visit: >-
      With so many trails available, selecting by theme is ideal. Educational strolls interpret nature: the
      Promenade didactique du Marsoult is a flat five-kilometer loop around ponds interpreting wetland
      biodiversity, aquatic predators, and forest flora; the Bois de la Fontaine trail in Laneuville-au-Bois
      covers one kilometer through woodland exploring nature and ancient Celtic resource use; and the Celtic
      walk of Libramont spans 1.3 or 3 km, highlighting Celtic life in the Ardennes. The Sentier des Nutons
      covers 1.8 km in Libin following local folklore regarding forest gnomes, while the Lomprez wetland path
      is completed in roughly thirty minutes.


      Access across all marked footpaths is free, including at night, aside from temporary seasonal wildlife
      closures.
    history: >-
      The forest is designated as a Natura 2000 protected reserve. Visitor regulations aim to safeguard forest
      ecosystems: walking is restricted to authorized paths and trails, campfires are permitted only within
      designated fire rings, and overnight camping is limited strictly to approved bivouac sites reserved for
      long-distance trekkers.
    before: >-
      Dogs must be kept on a leash at all times. Motor vehicles are prohibited from leaving paved public roads
      or signed parking areas. Between 1 October and 31 December, driven hunts occur across the region,
      closing certain forest compartments throughout the day. Prime visitation runs from May to October, with
      September dedicated to the deer rut.
    around: >-
      Eighteen kilometers away lies the [Semois Valley Natural
      Park](/lugar/parc-naturel-de-la-vallee-de-la-semois/), twenty-four kilometers away stands the [Upper
      Sûre Natural Park - Sûre Forests](/lugar/naturpark-oewersauer---haute-sure-forests/), and twenty-six
      kilometers away extends the [Anlier Forest](/lugar/foret-d-anlier/).
  fr:
    intro: >-
      À la mi-septembre, quand le crépuscule s'installe, une partie de la forêt de Saint-Hubert se ferme et un
      autre monde sonore s'éveille. C'est le brame du cerf, et la Grande Forêt de Saint-Hubert, dans la
      province belge de Luxembourg, forme un massif de chênes et de hêtres renommé pour ses cervidés, sillonné
      par plus de deux cents promenades balisées précisant distance, dénivelé et balisage.
    landscape: >-
      Le massif se déploie en une mosaïque de hêtraies, de chênaies, de tourbières et d'étangs que l'on
      parcourt le long de chemins balisés. Les itinéraires mènent aux forêts marécageuses du Rouge Poncé, que
      borde le circuit numéro sept de « Entre rivières et forêt » sur 9,7 kilomètres ; aux anciennes fosses
      d'extraction de tourbe cerclées par le sentier Les Troufferies, sur six kilomètres depuis
      Roumont-Ochamps ; et aux bas-marais tourbeux et étangs.


      Des belvédères ponctuent également le massif. Une boucle de quatre kilomètres au départ de Resteigne
      parcourt la réserve naturelle des Pairées, tandis qu'un circuit de 12,8 kilomètres depuis Tellin
      traverse la Fagne du Mâ d’Eau. Depuis la Tour de Priesse, le long de la promenade de Mochamps, s'offre
      un panorama à 360 degrés.
    wildlife: >-
      Le cerf est l'emblème incontesté des lieux. La saison des amours du [cerf
      élaphe](/especie/cervus_elaphus/) s'étend de la mi-septembre à la mi-octobre. En septembre, dès la
      deuxième semaine en général, une partie du massif est interdite d'accès entre cinq heures de
      l'après-midi et neuf heures du matin, des postes d'écoute libre étant aménagés pour le public. La
      discrétion est de rigueur : il convient d'éviter les vêtements bruyants.


      Plusieurs itinéraires régionaux mènent à des aménagements d'observation de la faune et de ses habitats,
      comme Bilaude et le point de vue d'Amonys. Le sentier sept de Tenneville conduit au belvédère de la
      Fagne à la Fontaine et à la Tour de Priesse.
    visit: >-
      Face à une telle variété d'itinéraires, le mieux est de choisir par thème. Pour apprendre, des
      promenades didactiques s'offrent aux promeneurs : la Promenade didactique du Marsoult, boucle plate de
      cinq kilomètres autour d'étangs abordant la biodiversité aquatique, les prédateurs piscicoles et les
      essences forestières ; le sentier du Bois de la Fontaine, à Laneuville-au-Bois, d'un kilomètre en
      sous-bois, expliquant la nature et les usages celtiques ; et la promenade celtique de Libramont, de 1,3
      ou 3 km, détaillant le mode de vie celte. Le Sentier des Nutons fait 1,8 km à Libin sur les traces des
      nains légendaires d'Ardenne. La boucle du marais de Lomprez se parcourt en une trentaine de minutes.


      La marche est libre et gratuite sur les tracés balisés, y compris de nuit, sauf fermetures ponctuelles.
    history: >-
      La forêt est classée en zone Natura 2000. Les règlements visent à préserver la quiétude des milieux :
      marcher uniquement sur les chemins et sentiers autorisés, n'allumer de feu que sur les aires dédiées et
      ne bivouaquer que sur les zones autorisées réservées aux randonneurs itinérants.
    before: >-
      Les chiens doivent impérativement être tenus en laisse. Les véhicules motorisés ne peuvent quitter les
      voies carrossables ou les parkings balisés. Entre le 1er octobre et le 31 décembre ont lieu des battues
      de chasse, interdisant certaines parcelles toute la journée. Les meilleurs mois vont de mai à octobre,
      septembre étant celui du brame.
    around: >-
      À dix-huit kilomètres se trouve le [Parc naturel de la Vallée de la
      Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), à vingt-quatre le [Parc naturel de la
      Haute-Sûre - Forêts de la Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/) et à vingt-six la
      [Forêt d'Anlier](/lugar/foret-d-anlier/).
  de:
    intro: >-
      Mitte September, wenn die Dämmerung hereinbricht, schließen sich Teile des Waldes von Saint-Hubert und
      eine urtümliche Geräuschkulisse hebt an. Es ist die Brunft der Hirsche: Der Große Wald von Saint-Hubert
      in der belgischen Provinz Luxemburg ist ein für seine Rothirschbestände berühmter Eichen- und
      Buchenwald, der von mehr als zweihundert markierten Wanderrouten mit detaillierten Angaben zu Distanz,
      Höhenmetern und Wegweisern erschlossen wird.
    landscape: >-
      Der Wald bildet ein Mosaik aus Buchen-, Eichenwäldern, Mooren und Waldweihern, das sich auf markierten
      Pfaden erwandern lässt. Es ist eine abwechslungsreiche Landschaft: Routen führen zu den Sumpfwäldern von
      Rouge Poncé entlang der Strecke Nummer sieben von «Entre rivières et forêt» über 9,7 Kilometer; zu den
      historischen Torfstichen auf dem sechs Kilometer langen Pfad Les Troufferies ab Roumont-Ochamps; und zu
      Moorheiden, Feuchtgebieten und Teichen.


      Auch Aussichtspunkte bereichern das Massiv: Ein Vier-Kilometer-Weg ab Resteigne erschließt das
      Naturschutzgebiet Les Pairées, während ein 12,8 Kilometer langer Rundweg ab Tellin die Fagne du Mâ d’Eau
      quert. Vom Aussichtsturm Tour de Priesse entlang der Mochamps-Wanderung eröffnet sich ein
      360-Grad-Panorama über die Ardennen.
    wildlife: >-
      Der Hirsch ist das Wappentier des Waldes. Die Brunftzeit des [Rothirsches](/especie/cervus_elaphus/)
      dauert von Mitte September bis Mitte Oktober. Im September, zumeist ab der zweiten Woche, wird ein Teil
      des Massivs zwischen fünf Uhr nachmittags und neun Uhr morgens gesperrt; für Interessierte werden
      spezielle Hörplätze eingerichtet. Ruhe ist oberstes Gebot: Raschelnde Kleidung sollte vermieden werden.


      Mehrere Routen führen zu Beobachtungseinrichtungen für Wildtiere und Lebensräume, wie Bilaude und der
      Aussichtspunkt Amonys. Weg sieben ab Tenneville leitet zur Kanzel Fagne à la Fontaine und zur Tour de
      Priesse.
    visit: >-
      Bei der Vielzahl an Routen wählt man am besten nach Themen. Lehrpfade vermitteln Naturwissen: Die
      Promenade didactique du Marsoult ist ein flacher Fünf-Kilometer-Rundweg um Teiche, der Gewässerbiologie,
      Fischjäger und Baumarten erklärt; der Pfad im Bois de la Fontaine in Laneuville-au-Bois führt über einen
      Kilometer durch den Wald und thematisiert Natur und keltische Kulturlandschaftsnutzung; der Keltenweg
      von Libramont über 1,3 oder 3 km erläutert das Leben der Kelten. Der Sentier des Nutons führt über 1,8
      km in Libin auf den Spuren der Zwerge ardennischer Sagen. Die Runde im Moor von Lomprez erfordert etwa
      dreißig Minuten.


      Das Wandern auf den markierten Pfaden ist kostenfrei, auch nachts, abgesehen von saisonalen
      Schutzsperrungen.
    history: >-
      Das Waldgebiet ist als Natura-2000-Reservat geschützt. Die Regeln zielen auf den Schutz der Biotope ab:
      Nur auf ausgewiesenen Wegen wandern, Feuer ausschließlich an freigegebenen Feuerstellen entfachen und
      Übernachtungen streng auf genehmigte Biwakplätze für Weitwanderer beschränken.
    before: >-
      Hunde müssen durchgehend an der Leine geführt werden. Kraftfahrzeuge dürfen Straßen und markierte
      Parkflächen nicht verlassen. Zwischen dem 1. Oktober und dem 31. Dezember finden in der Region
      Treibjagden statt, wodurch einzelne Waldzonen ganztägig gesperrt sein können. Die beste Besuchszeit
      reicht von Mai bis Oktober mit dem September als Monat der Hirschbrunft.
    around: >-
      Achtzehn Kilometer entfernt liegt der [Naturpark
      Semois-Tal](/lugar/parc-naturel-de-la-vallee-de-la-semois/), vierundzwanzig Kilometer der [Naturpark
      Obersauer - Sauer-Wälder](/lugar/naturpark-oewersauer---haute-sure-forests/) und sechsundzwanzig
      Kilometer der [Wald von Anlier](/lugar/foret-d-anlier/).
  it:
    intro: >-
      A metà settembre, all'imbrunire, una porzione della foresta di Saint-Hubert viene interdetta e risuona
      un richiamo ancestrale. È il bramito del cervo, e la Grande Foresta di Saint-Hubert, nella provincia
      belga del Lussemburgo, è un complesso di querce e faggi rinomato per i suoi ungulati, attraversato da
      oltre duecento percorsi a piedi con indicazione di distanze, dislivelli e segnavia.
    landscape: >-
      La foresta compone un mosaico di faggete, querceti, torbiere e stagni esplorabili lungo sentieri
      tracciati. Il paesaggio offre notevole varietà: i percorsi raggiungono i boschi umidi di Rouge Poncé
      lungo l'itinerario numero sette di «Entre rivières et forêt» di 9,7 chilometri; le antiche conche
      d'estrazione della torba costeggiate dal sentiero Les Troufferies di sei chilometri da Roumont-Ochamps;
      e torbiere, acquitrini e specchi d'acqua.


      Non mancano i punti panoramici: un tracciato di quattro chilometri da Resteigne tocca la riserva
      naturale di Les Pairées, mentre un anello di 12,8 chilometri da Tellin attraversa la Fagne du Mâ d’Eau.
      Dalla Tour de Priesse, lungo la passeggiata di Mochamps, si gode una veduta a 360 gradi sulle Ardenne.
    wildlife: >-
      Il cervo è il sovrano incontrastato della foresta. Il periodo degli amori del [cervo
      nobile](/especie/cervus_elaphus/) va da metà settembre a metà ottobre. In settembre, di solito a partire
      dalla seconda settimana, una parte del massiccio chiude dalle cinque del pomeriggio alle nove del
      mattino, predisponendo piazzole di ascolto libero per il pubblico. La discrezione è fondamentale:
      bisogna evitare abiti fruscianti.


      Vari sentieri conducono a capanni e punti di osservazione della fauna, come Bilaude e il belvedere di
      Amonys. La rotta sette da Tenneville conduce alla vedetta Fagne à la Fontaine e alla Tour de Priesse.
    visit: >-
      Con un'offerta così ampia, conviene orientarsi per tematismi. Per approfondire ci sono percorsi
      didattici: la Promenade didactique du Marsoult, anello pianeggiante di cinque chilometri attorno agli
      stagni incentrato su biodiversità acquatica, predatori ittici e alberi; il sentiero del Bois de la
      Fontaine a Laneuville-au-Bois, di un chilometro nel bosco, che racconta natura e usanze celtiche; e la
      passeggiata celtica di Libramont di 1,3 o 3 km sulle tracce dei Celti. Il Sentier des Nutons copre 1,8
      km a Libin sulle leggende dei nani delle Ardenne, mentre la palude di Lomprez si visita in una mezz'ora.


      L'accesso a piedi è libero e gratuito sui tracciati segnati, anche di notte, salvo le chiusure
      stagionali per la fauna.
    history: >-
      Il complesso forestale rientra nella rete protetta Natura 2000. Le normative tutelano la tranquillità
      degli ecosistemi: camminare solo lungo sentieri autorizzati, accendere fuochi esclusivamente nelle
      apposite piazzole e pernottare unicamente nelle aree bivacco predisposte per gli escursionisti
      itineranti.
    before: >-
      I cani devono essere tenuti sempre al guinzaglio. I veicoli a motore non possono uscire dalle strade
      asfaltate o dai parcheggi designati. Tra il 1° ottobre e il 31 dicembre si svolgono battute di caccia
      che comportano la chiusura diurna di alcune zone. Il periodo migliore va da maggio a ottobre, con
      settembre consacrato al bramito.
    around: >-
      A diciotto chilometri si trova il [Parco Naturale della Valle della
      Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), a ventiquattro il [Parco Naturale dell'Alta
      Sûre - Foreste della Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/) e a ventisei la [Foresta
      di Anlier](/lugar/foret-d-anlier/).
  pt:
    intro: >-
      A meados de setembro, ao cair da tarde, parte da floresta de Saint-Hubert encerra e começa a escutar-se
      um som diferente. É a brama do veado, e a Grande Floresta de Saint-Hubert, na província belga do
      Luxemburgo, forma um denso manto de carvalhos e faiais célebre pelos seus cervídeos, entrecortado por
      mais de duzentos percursos pedestres com registo de distância, declives e sinalização.
    landscape: >-
      O maciço compõe um mosaico de faiais, carvalhais, turfeiras e lagoas percorrido por caminhos bem
      marcados. A paisagem desdobra-se em contrastes: os trilhos conduzem às matas pantanosas de Rouge Poncé
      ao longo da rota número sete de «Entre rivières et forêt» com 9,7 quilómetros; às antigas jazidas de
      extração de turfa circundadas pelo percurso Les Troufferies de seis quilómetros a partir de
      Roumont-Ochamps; e a turfeiras, charcos e lagoas abertas.


      Há igualmente miradouros que dominam a floresta: um caminho de quatro quilómetros desde Resteigne
      percorre a reserva natural de Les Pairées, enquanto um circuito de 12,8 quilómetros desde Tellin cruza a
      Fagne du Mâ d’Eau. Do cimo da Tour de Priesse, ao longo do passeio de Mochamps, desfruta-se de um
      panorama de 360 graus sobre as Ardenas.
    wildlife: >-
      O veado é o símbolo supremo da região. A época de acasalamento do
      [veado-vermelho](/especie/cervus_elaphus/) decorre de meados de setembro a meados de outubro. Em
      setembro, habitualmente a partir da segunda semana, parte do maciço fecha entre as cinco da tarde e as
      nove da manhã, abrindo-se postos de escuta livre ao público. A discrição é mandatória: deve evitar-se
      vestuário ruidoso.


      Vários roteiros orientam para estruturas de observação de fauna, como Bilaude e o miradouro de Amonys. O
      percurso sete de Tenneville conduz ao ponto de vigia Fagne à la Fontaine e à Tour de Priesse.
    visit: >-
      Com tantas opções no terreno, o ideal é escolher por temática. Para aprender em família existem
      percursos didáticos: a Promenade didactique du Marsoult, um anel plano de cinco quilómetros em torno de
      lagoas que interpreta a biodiversidade aquática, os predadores piscícolas e as árvores; o trilho do Bois
      de la Fontaine em Laneuville-au-Bois, de um quilómetro pela mata, que aborda a ecologia e as práticas
      celtas; e a rota celta de Libramont de 1,3 ou 3 km sobre o quotidiano celta. O Sentier des Nutons cobre
      1,8 km em Libin seguindo as lendas dos duendes das Ardenas, enquanto o percurso do sapal de Lomprez
      demora cerca de trinta minutos.


      A caminhada é livre e gratuita nas rotas sinalizadas, inclusive à noite, exceto nos encerramentos
      temporários de conservação.
    history: >-
      A floresta integra a rede comunitária Natura 2000. As regras procuram salvaguardar a tranquilidade da
      fauna: caminhar estritamente pelos trilhos autorizados, acender fogueiras apenas nos locais
      regulamentados e pernoitar unicamente nas áreas de bivaque homologadas para caminhantes de longo curso.
    before: >-
      Os cães devem circular sempre com trela. Os veículos motorizados estão impedidos de sair das estradas
      públicas e parques demarcados. Entre 1 de outubro e 31 de dezembro decorrem montarias de caça na região,
      o que interdita certas parcelas florestais durante todo o dia. Os melhores meses estendem-se de maio a
      outubro, com setembro dedicado à brama.
    around: >-
      A dezoito quilómetros situa-se o [Parque Natural do Vale do
      Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), a vinte e quatro o [Parque Natural do Alto Sûre
      - Florestas do Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/) e a vinte e seis a [Floresta de
      Anlier](/lugar/foret-d-anlier/).
