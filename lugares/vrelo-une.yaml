texto:
  es:
    intro: >-
      Un río empieza donde el agua sale de la roca, y el Una empieza con un lago redondo, tranquilo, de un
      azul verdoso, de unos treinta metros por quince, rodeado de bosque y de los acantilados de las sierras
      Lička Plješevica y Stražbenica. Es el Vrelo Une, el manantial principal del Una, a 396 m de altitud,
      cerca del pueblo de Donja Suvaja. Está protegido como monumento natural hidrológico y el gestor lo
      presenta como el manantial kárstico más profundo de Croacia y uno de los cinco más profundos del mundo.
    landscape: >-
      Lo que ves en la superficie es la última etapa de un viaje subterráneo. El acuífero kárstico del Una se
      extiende por la Lička Plješevica, Čemernica y Mala Kapela y por los campos kársticos de Korenica,
      Bijelopolje, Krbava y Lapac, todos conectados con el manantial; el agua que se hunde en la zona de
      Gračac, Bruvno, Mazin y Velika Popina sale por el Vrelo Une. El caudal oscila entre 0,076 m³/s en 1987 y
      98,1 m³/s en 2009, y el agua sale a una temperatura de entre 8 y 11 °C, con una media de 9,5 °C: señal
      de que ha pasado mucho tiempo bajo tierra. Se ha explorado hasta 248 metros de profundidad, lo que lo
      hace el manantial más profundo explorado del karst dinárico y el quinto del mundo.


      El Una no pierde tiempo: a unos 20 metros del manantial forma su primera cascada de travertino y, a unos
      100, otra de 3-4 metros. Tras unos 5 km se une al río Krka.
    wildlife: >-
      Mira las rocas y el agua: es donde se concentra la riqueza vegetal. En el área estudiada se registraron
      219 taxones de plantas vasculares de 59 familias y 64 especies de briófitos (14 hepáticas y 50 musgos);
      las rocas y los medios acuáticos son lo más importante para los briófitos, y bosques y matorrales cubren
      buena parte del monumento. La flora está en la región euroasiática, en el punto de encuentro entre
      bosques submediterráneos termófilos y bosques mesófilos de carpe y haya. Cuatro especies están
      catalogadas como casi amenazadas por la UICN, y no se registraron plantas invasoras en las campañas de
      2018-2019 y del invierno de 2021.


      El manantial está cubierto de algas y alberga larvas de tricópteros, de efímeras y de caracoles, además
      de un escarabajo acuático.
    visit: >-
      El recorrido de visita cuenta con pasamanos y vallas de protección, y el gestor renovó el suelo y la
      escalera de uno de los miradores. El tercer mirador del nacimiento se alcanza por escaleras.
    history: >-
      El primer buceo registrado en el manantial fue en 1999, durante una expedición internacional de
      espeleobuceo, y llegó a 51 metros.


      En 2024 una amenaza llegó al propio nacimiento. El 5 de julio se empezó a construir una minicentral
      hidroeléctrica en el nacimiento sin la evaluación de impacto ambiental necesaria. Vecinos y activistas
      internacionales protestaron en la obra para frenar el daño; el 8 de agosto la inspección estatal
      denunció penalmente al funcionario que concedió el permiso de obra con documentación incompleta, y el 19
      de agosto prohibió continuar los trabajos. Reparar el daño llevará tiempo.


      El espacio lo gestiona Natura Jadera, institución pública que cuida las áreas protegidas de la provincia
      de Zadar.
    before: Consulta con Natura Jadera las condiciones de acceso antes de ir y sigue el recorrido acondicionado.
    around: >-
      A tres kilómetros queda el [Parque Nacional Una - Curso Alto y
      Cascadas](/lugar/nacionalni-park-una---gorji-tok/), y a veintiocho kilómetros, el [Bosque Virgen de Lom
      - Reserva Natural Estricta](/lugar/prasuma-lom-strogi-rezervat-prirode/).
  en:
    intro: >-
      A river begins where water emerges from bedrock, and the Una begins with a calm, circular, greenish-blue
      pool, some thirty metres by fifteen, framed by dense woodland and the cliffs of the Lička Plješevica and
      Stražbenica ranges. This is Vrelo Une, the principal spring of the Una River, at 396 m altitude near the
      hamlet of Donja Suvaja. Protected as a hydrological natural monument, the site manager highlights it as
      the deepest karst resurgence in Croatia and among the five deepest in the world.
    landscape: >-
      What you see at the surface is the terminal stage of a profound subterranean journey. The karst aquifer
      feeding the Una extends across Lička Plješevica, Čemernica, and Mala Kapela and through the poljes of
      Korenica, Bijelopolje, Krbava, and Lapac, all hydrologically linked to the spring; precipitation sinking
      around Gračac, Bruvno, Mazin, and Velika Popina re-emerges at Vrelo Une. Discharge fluctuates between
      0,076 m³/s in 1987 and 98.1 m³/s in 2009, with water emerging at between 8 and 11 °C, averaging 9.5 °C:
      clear evidence of extended residence time underground. Cave divers have surveyed it down to 248 metres
      depth, ranking it the deepest explored spring in the Dinaric karst and fifth deepest worldwide.


      The Una loses no time: some 20 metres from the resurgence it tumbles over its first travertine cascade,
      and around 100 metres farther down drops over another of 3-4 metres. After some 5 km it merges with the
      Krka River.
    wildlife: >-
      Look closely at the rocks and rushing water: this is where botanical richness thrives. Within the
      surveyed perimeter, researchers catalogued 219 vascular plant taxa across 59 families and 64 bryophyte
      species (14 liverworts and 50 mosses); damp limestone crags and aquatic margins support the richest
      bryophyte communities, while woodland and scrub cloaks most of the monument. Phytogeographically
      situated in the Eurasian zone, it marks the transition between thermophilous sub-Mediterranean scrub and
      mesophilous beech-hornbeam woodlands. Four species are IUCN near-threatened, and zero invasive weeds
      were recorded in 2018-2019 surveys or winter 2021.


      The spring basin is carpeted in aquatic algae, harboring caddisfly, mayfly, and aquatic snail larvae
      alongside a rare water beetle.
    visit: >-
      The visitor trail features safety handrails and protective fencing, and the park service recently
      refurbished the decking and steps of one viewpoint. The third panoramic lookout is reached via steps.
    history: >-
      The first recorded cave dive at the spring occurred in 1999 during an international speleodiving
      expedition, reaching a depth of 51 metres.


      In 2024 an acute threat targeted the springhead itself. On 5 July construction began on a
      micro-hydropower facility directly at the spring without the mandatory environmental impact assessment.
      Local villagers and international environmental campaigners staged on-site protests to halt the
      destruction; on 8 August state environmental inspectors filed criminal charges against the official who
      authorized permits on incomplete documentation, and on 19 August permanently halted work. Ecological
      remediation will require substantial time.


      The reserve is safeguarded by Natura Jadera, the public authority overseeing protected areas in Zadar
      County.
    before: >-
      Check with Natura Jadera regarding current access regulations prior to your visit and remain on the
      improved walkways.
    around: >-
      Three kilometres away lies [Una National Park - Upper Reaches and
      Waterfalls](/lugar/nacionalni-park-una---gorji-tok/), and twenty-eight kilometres away is [Lom Primeval
      Forest - Strict Nature Reserve](/lugar/prasuma-lom-strogi-rezervat-prirode/).
  fr:
    intro: >-
      Un fleuve commence là où l'eau jaillit du calcaire, et l'Una naît dans une vasque ronde et paisible,
      d'un bleu-vert intense, d'environ trente mètres sur quinze, enserrée par la forêt et les parois
      rocheuses des massifs de Lička Plješevica et Stražbenica. C'est le Vrelo Une, source principale de
      l'Una, à 396 m d'altitude près de Donja Suvaja. Protégé comme monument naturel hydrologique, le site est
      réputé comme la résurgence karstique la plus profonde de Croatie et l'une des cinq plus profondes au
      monde.
    landscape: >-
      Ce qui apparaît en surface est l'aboutissement d'un long périple souterrain. L'aquifère karstique de
      l'Una draine la Lička Plješevica, la Čemernica et la Mala Kapela ainsi que les poljés de Korenica,
      Bijelopolje, Krbava et Lapac, tous reliés au gouffre ; les eaux engouffrées vers Gračac, Bruvno, Mazin
      et Velika Popina ressurgissent au Vrelo Une. Le débit oscille entre 0,076 m³/s en 1987 et 98,1 m³/s en
      2009, et l'eau jaillit entre 8 et 11 °C, avec une moyenne de 9,5 °C : preuve d'un long transit sous
      terre. Les plongées spéléologiques ont atteint 248 mètres de profondeur, en faisant la source explorée
      la plus profonde du karst dinarique et la cinquième au monde.


      L'Una s'élance aussitôt : à 20 mètres de la vasque se forme une première cascade de travertin, et à 100
      mètres une autre de 3-4 mètres. Après environ 5 km, elle s'unit à la rivière Krka.
    wildlife: >-
      Observez les rochers et l'onde : c'est là que réside la valeur botanique. Dans l'espace étudié ont été
      recensés 219 taxons de plantes vasculaires appartenant à 59 familles et 64 espèces de bryophytes (14
      hépatiques et 50 mousses) ; les parois calcaires et les milieux aquatiques constituent le biotope majeur
      des mousses. La flore relève de la région eurasiatique, au carrefour des forêts thermophiles
      subméditerranéennes et des boisements mésophiles de charme et de hêtre. Quatre espèces sont quasi
      menacées selon l'UICN, et aucune plante invasive n'a été relevée en 2018-2019 ni lors de l'hiver 2021.


      La vasque tapissée d'algues nourrit larves de phryganes, d'éphémères, gastéropodes et un coléoptère
      aquatique.
    visit: >-
      Le parcours aménagé comporte des garde-corps et des clôtures en bois, et le gestionnaire a rénové le
      plancher et les marches d'un des belvédères. Le troisième belvédère surplombant la source est accessible
      par des escaliers.
    history: >-
      La première plongée spéléologique documentée eut lieu en 1999 lors d'une expédition internationale,
      atteignant 51 mètres.


      En 2024, une menace a directement frappé la résurgence. Le 5 juillet débuta le chantier d'une
      microcentrale hydroélectrique à la source même, sans étude d'impact environnemental requise. Habitants
      et défenseurs de l'environnement manifestèrent pour bloquer les travaux ; le 8 août, l'inspection de
      l'État porta plainte au pénal contre le fonctionnaire ayant délivré le permis avec un dossier incomplet,
      et le 19 août stoppa définitivement le chantier. La remise en état prendra du temps.


      Le site est administré par Natura Jadera, organisme public des espaces protégés de Zadar.
    before: >-
      Renseignez-vous auprès de Natura Jadera sur les modalités d'accès avant votre venue et restez sur les
      passerelles.
    around: >-
      À trois kilomètres se trouve le [parc national de l'Una - cours supérieur et
      cascades](/lugar/nacionalni-park-una---gorji-tok/), et à vingt-huit kilomètres la [forêt primaire de Lom
      - réserve naturelle intégrale](/lugar/prasuma-lom-strogi-rezervat-prirode/).
  de:
    intro: >-
      Ein Fluss beginnt dort, wo Wasser aus dem Fels tritt, und die Una entspringt in einem runden, stillen,
      blaugrünen Quelltopf von etwa dreißig mal fünfzehn Metern, umrahmt von Bergwald und den Steilwänden der
      Höhenzüge Lička Plješevica und Stražbenica. Es ist das Vrelo Une, die Hauptquelle der Una auf 396 m Höhe
      nahe dem Dorf Donja Suvaja. Als hydrologisches Naturdenkmal geschützt, gilt der Quelltopf als tiefste
      Karstquelle Kroatiens und als eine der fünf tiefsten weltweit.
    landscape: >-
      Was an der Oberfläche sichtbar ist, bildet das Finale einer weiten unterirdischen Reise. Der
      Karstaquifer der Una erstreckt sich über Lička Plješevica, Čemernica und Mala Kapela sowie die
      Karstpoljen von Korenica, Bijelopolje, Krbava und Lapac, die hydrologisch mit der Quelle verbunden sind;
      Versickerungswasser aus Gračac, Bruvno, Mazin und Velika Popina tritt am Vrelo Une zutage. Die Schüttung
      schwankt zwischen 0,076 m³/s im Jahr 1987 und 98,1 m³/s im Jahr 2009 bei einer Temperatur zwischen 8 und
      11 °C mit einem Mittelwert von 9,5 °C: ein Beleg für langen Verbleib im Untergrund. Höhlentaucher
      stießen bis in 248 Meter Tiefe vor, was den Quelltopf zur tiefsten erforschten Karstquelle der Dinariden
      und zur fünfttiefsten der Erde macht.


      Die Una fließt sofort lebhaft ab: Etwa 20 Meter unterhalb der Quelle bildet sie ihre erste
      Travertinkaskade und nach 100 Metern einen weiteren Fall von 3-4 Metern. Nach rund 5 km mündet sie in
      den Krka-Fluss.
    wildlife: >-
      Felsen und Quellwasser beherbergen beachtliche pflanzliche Vielfalt. Im Schutzgebiet wurden 219
      Gefäßpflanzensippen aus 59 Familien sowie 64 Moosarten (14 Lebermoose und 50 Laubmoose) nachgewiesen;
      feuchte Felsflanken und Gewässersäume sind die Kernlebensräume der Moose. Die Flora gehört zur
      eurasischen Region und liegt im Übergangsbereich zwischen wärmeliebenden submediterranen Gebüschen und
      mesophilen Buchen-Hainbuchen-Wäldern. Vier Arten stehen auf der Vorwarnliste der IUCN; invasive
      Neophyten fehlten in den Erhebungen 2018-2019 und im Winter 2021 völlig.


      Der Quellgrund ist von Algenrasen bedeckt und beherbergt Köcherfliegen-, Eintagsfliegen- und
      Schneckenlarven sowie seltene Wasserkäfer.
    visit: >-
      Der Besucherweg ist mit Geländern und Zäunen gesichert, und die Parkverwaltung erneuerte Stufen und
      Beläge eines Aussichtspunkts. Der dritte Aussichtspunkt über dem Quelltopf ist über Holzstufen
      zugänglich.
    history: >-
      Der erste dokumentierte Höhlentauchgang fand 1999 bei einer internationalen Expedition statt und
      erreichte 51 Meter Tiefe.


      Im Jahr 2024 drohte der Quelle akute Gefahr. Am 5. Juli begann der Bau eines Kleinwasserkraftwerks
      direkt am Quelltopf ohne vorgeschriebene Umweltverträglichkeitsprüfung. Anwohner und internationale
      Umweltschützer protestierten auf der Baustelle; am 8. August erstattete die Staatsinspektion
      Strafanzeige gegen den verantwortlichen Beamten wegen unvollständiger Genehmigungsunterlagen, und am 19.
      August wurden die Bauarbeiten endgültig untersagt. Die Behebung der Schäden erfordert Zeit.


      Verwaltet wird das Gebiet von Natura Jadera, der Naturschutzbehörde der Region Zadar.
    before: Informiere dich vorab bei Natura Jadera über Zugangsregelungen und bleibe auf den Holzstegen und Pfaden.
    around: >-
      Drei Kilometer entfernt liegt der [Nationalpark Una – Oberlauf und
      Wasserfälle](/lugar/nacionalni-park-una---gorji-tok/) und achtundzwanzig Kilometer entfernt der [Urwald
      Lom – Strenges Naturreservat](/lugar/prasuma-lom-strogi-rezervat-prirode/).
  it:
    intro: >-
      Un fiume comincia dove l'acqua sgorga dalla viva roccia, e l'Una nasce in un laghetto circolare e
      placido, di un limpido blu-verde, di circa trenta metri per quindici, racchiuso dal bosco e dalle pareti
      montuose di Lička Plješevica e Stražbenica. È il Vrelo Une, risorgiva maestra dell'Una a 396 m di quota
      presso Donja Suvaja. Protetto come monumento naturale idrologico, l'ente gestore lo descrive come la
      risorgiva carsica più profonda della Croazia e una delle cinque maggiori al mondo.
    landscape: >-
      Quanto visibile in superficie è il termine di un lunghissimo viaggio sotterraneo. L'acquifero carsico
      dell'Una interessa Lička Plješevica, Čemernica e Mala Kapela e i polje di Korenica, Bijelopolje, Krbava
      e Lapac, tutti collegati alla sorgente; le precipitazioni che si inabissano a Gračac, Bruvno, Mazin e
      Velika Popina risorgono al Vrelo Une. La portata varia tra 0,076 m³/s nel 1987 e 98,1 m³/s nel 2009, con
      acqua tra 8 e 11 °C e una media di 9,5 °C: segno di prolungata permanenza nelle viscere della terra. Le
      esplorazioni speleosubacquee sono scese a 248 metri di profondità, rendendola la sorgente carsica più
      profonda dei Balcani e la quinta al mondo.


      L'Una prende subito vigore: a 20 metri dalla sorgente genera una prima cascata di travertino e a circa
      100 metri un secondo salto di 3-4 metri. Dopo circa 5 km si congiunge con il fiume Krka.
    wildlife: >-
      Tra rocce e corsi d'acqua si concentra il patrimonio floristico. Nell'area protetta sono stati censiti
      219 taxa di piante vascolari appartenenti a 59 famiglie e 64 specie di briofite (14 epatiche e 50
      muschi); pareti umide e acque correnti sono gli habitat più preziosi per i muschi. La flora appartiene
      alla regione euroasiatica, tra boscaglie submediterranee termofile e boschi mesofili di carpino e
      faggio. Quattro specie sono considerate quasi minacciate dall'IUCN, e non sono state riscontrate piante
      invasive nelle campagne 2018-2019 e nell'inverno 2021.


      Il bacino sorgivo ospita tappeti di alghe, larve di tricotteri, effimere e gasteropodi, oltre a un raro
      coleottero acquatico.
    visit: >-
      Il percorso escursionistico è munito di corrimano e staccionate, e l'ente parco ha recentemente
      rinnovato scalinate e passerelle di un punto panoramico. Il terzo belvedere sulla sorgente si raggiunge
      mediante gradini.
    history: >-
      La prima immersione speleosubacquea registrata risale al 1999 durante una spedizione internazionale,
      raggiungendo 51 metri di profondità.


      Nel 2024 una grave minaccia ha colpito la risorgiva. Il 5 luglio sono stati avviati i cantieri di una
      centrale idroelettrica proprio presso la sorgente senza la necessaria valutazione d'impatto ambientale.
      Abitanti e attivisti hanno manifestato sul posto bloccando i lavori; l'8 agosto gli ispettori statali
      hanno denunciato il funzionario che aveva rilasciato i permessi su documentazione carente, e il 19
      agosto hanno imposto lo stop definitivo ai lavori. Il ripristino richiederà tempo.


      L'area è gestita da Natura Jadera, ente pubblico delle aree protette zaratine.
    before: >-
      Verifica con Natura Jadera lo stato degli accessi prima di partire e rispetta i percorsi pedonali
      predisposti.
    around: >-
      A tre chilometri sorge il [Parco Nazionale dell'Una - Alto Corso e
      Cascate](/lugar/nacionalni-park-una---gorji-tok/), e a ventotto chilometri la [Foresta Primaria di Lom -
      Riserva Naturale Integrale](/lugar/prasuma-lom-strogi-rezervat-prirode/).
  pt:
    intro: >-
      Um rio nasce onde a água rompe a rocha, e o Una tem a sua origem numa lagoa circular e serena, de um
      verde-azulado límpido, com cerca de trinta metros por quinze, abrigada por arvoredo e escarpas de Lička
      Plješevica e Stražbenica. É o Vrelo Une, a nascente principal do Una, a 396 m de altitude junto à aldeia
      de Donja Suvaja. Classificado como monumento natural hidrológico, o gestor destaca-o como a ressurgência
      cárstica mais funda da Croácia e uma das cinco maiores do globo.
    landscape: >-
      O que se observa à superfície é o epílogo de um extenso percurso subterrâneo. O aquífero cárstico do Una
      drena a Lička Plješevica, Čemernica e Mala Kapela e os poljes de Korenica, Bijelopolje, Krbava e Lapac,
      todos comunicantes com o sifão; as águas que se infiltram em Gračac, Bruvno, Mazin e Velika Popina
      brotam no Vrelo Une. O caudal varia entre 0,076 m³/s em 1987 e 98,1 m³/s em 2009, a uma temperatura
      estável entre 8 e 11 °C com média de 9,5 °C: evidência de uma longa circulação profunda. O mergulho
      espeleológico desceu até 248 metros de profundidade, consagrando-a como a ressurgência mais funda
      explorada nos Dináricos e a quinta a nível mundial.


      O Una corre veloz: a 20 metros da lagoa forma uma cascata de travertino e, a 100 metros, outro desnível
      com 3-4 metros. Após 5 km conflui com o rio Krka.
    wildlife: >-
      Contempla as rochas e a corrente: nelas reside a principal riqueza florística. Foram registados na
      reserva 219 táxons de plantas vasculares de 59 famílias e 64 espécies de briófitos (14 hepáticas e 50
      musgos); as fendas húmidas e margens aquáticas são refúgios-chave para os musgos. A flora integra a
      região euroasiática, na transição entre matos submediterrânicos termófilos e florestas mesófilas de
      carpa e faia. Quatro espécies constam como quase ameaçadas pela UICN e não se registaram invasoras em
      2018-2019 nem no inverno de 2021.


      A bacia é coberta por algas aquáticas e acolhe larvas de tricópteros, efémeras e caracóis fluviais, além
      de um escaravelho aquático.
    visit: >-
      O trilho de visitação dispõe de corrimões e vedações de madeira, tendo o gestor renovado o passadiço e
      os degraus de um dos miradouros. O terceiro miradouro sobre a nascente alcança-se por escadas.
    history: >-
      A primeira imersão de espeleomergulho documentada data de 1999 durante uma expedição internacional,
      atingindo 51 metros de profundidade.


      Em 2024 surgiu uma ameaça no próprio manancial. A 5 de julho iniciou-se a obra de uma mini-hídrica junto
      à nascente sem avaliação de impacte ambiental. Moradores e ativistas mobilizaram-se no local para travar
      os trabalhos; a 8 de agosto a inspeção estatal apresentou queixa-crime contra o funcionário que emitira
      a licença com documentação incompleta, e a 19 de agosto decretou a paragem definitiva das obras. A
      recuperação exigirá tempo.


      O monumento é gerido pela Natura Jadera, organismo público de conservação de Zadar.
    before: >-
      Informa-te junto da Natura Jadera sobre as normas de acesso antes da deslocação e utiliza os passadiços
      previstos.
    around: >-
      A três quilómetros situa-se o [Parque Nacional do Una - Curso Superior e
      Cascatas](/lugar/nacionalni-park-una---gorji-tok/) e a vinte e oito quilómetros a [Floresta Virgem de
      Lom - Reserva Natural Integral](/lugar/prasuma-lom-strogi-rezervat-prirode/).
