resumen:
  es: >-
    Cumbre de la 'Nieve Real' (1.424 m) en la triple divisoria de aguas de los mares del Norte, Báltico y
    Negro.
  en: >-
    Summit of the "Royal Snow" (1,424 m) straddling the triple European hydrological divide of the North,
    Baltic, and Black Seas.
  fr: >-
    Sommet de la « Neige Royale » (1 424 m) sur la triple ligne de partage des eaux vers la mer du Nord, la
    Baltique et la mer Noire.
  de: >-
    Gipfel des „Königlichen Schneebergs“ (1.424 m) an der europäischen Wasserscheide von Nordsee, Ostsee und
    Schwarzem Meer.
  it: >-
    Vetta della «Neve Reale» (1.424 m) sulla triplice linea spartiacque europea tra Mare del Nord, Mar Baltico
    e Mar Nero.
  pt: >-
    Cume da «Neve Real» (1.424 m) na tríplice divisória de águas europeia entre o Mar do Norte, o Báltico e o
    Mar Negro.
unico:
  es: >-
    Tres mares nacen en un solo macizo, y en su cima aún quedan prados alpinos, un endemismo botánico y un
    musgo que brilla.
  en: >-
    Three seas spring from a single massif whose crest shelters pristine alpine meadows, a unique endemic
    hawkweed, and luminescent goblin moss.
  fr: >-
    Trois mers naissent d'un seul massif dont le sommet abrite des pelouses alpines, une épervière endémique
    et une mousse luminescente.
  de: >-
    Drei Meere entspringen an einem einzigen Massiv, auf dessen Gipfel alpine Matten, ein endemisches
    Habichtskraut und Leuchtmoos gedeihen.
  it: >-
    Tre mari sgorgano da un unico massiccio, sulla cui vetta sopravvivono praterie alpine, uno sparviere
    endemico e un muschio luminescente.
  pt: >-
    Três mares nascem num único maciço em cujo cimo subsistem prados alpinos, uma pilosela endémica e um musgo
    luminescente.
observaciones:
  es: >-
    Comprueba el estado de la ruta y el acceso en el TIC de Staré Město antes de salir; el sendero didáctico
    se hace todo el año, pero su dificultad es de media a alta. En la reserva y en el parque rigen normas de
    protección: infórmate de ellas con el gestor antes de ir.
texto:
  es:
    intro: >-
      Una gota de lluvia que cae en el Trójmorski Wierch tiene tres destinos posibles: el Báltico, el mar del
      Norte o el mar Negro. Este nudo de montañas reparte sus aguas hacia tres mares, y lo hace sobre una
      frontera: el Králický Sněžník, en checo, o Masyw Śnieżnika, en polaco, se extiende a ambos lados de la
      línea entre Chequia y Polonia, al sureste de Kłodzko. Es la cordillera más alta de la parte polaca de
      los Sudetes Orientales, y en el lado checo la tercera del país, unos 16 km desde Králíky hasta el
      collado de Kladské sedlo. Unos 200 km² del macizo caen en Polonia y 76 km² en Chequia.
    landscape: >-
      Esta es una montaña de roca vieja, metamórfica. Predominan los gneises y los micaesquistos, pero cerca
      de Kletno aparecen lentes de mármol, y en una cantera de allí se descubrió en 1966 la Jaskinia
      Niedźwiedzia, la mayor cueva de los Sudetes. Donde hay caliza, el agua ha trabajado: valles secos,
      sumideros y surgencias. En el lado checo se ven formas periglaciares, como pedregales y escarpes de
      hielo, y cuevas de karst como Tvarožné díry.


      El agua también da espectáculo en la superficie. En el arroyo Wilczka, en Międzygórze, cae una de las
      cascadas más altas de los Sudetes, de 22 metros.


      La vegetación sube por pisos. Entre 1100 y 1350 m se extienden grandes bosques de picea de montaña, a
      menudo de aspecto casi virgen; en la cresta oriental hay turberas altas abiertas, rodeadas de pícea
      sobre turba. Desde unos 1350 m, cerca de la cima, empieza una zona alpina sin bosque, y por encima de
      los 1250 m los prados de montaña, que casi solo existen en la cumbre del Śnieżnik, tienen el mayor valor
      natural. En las grietas de las rocas crece un musgo luminoso, el único de Polonia.


      En altura sobreviven plantas con nombre propio. La campanilla barbada, que en Chequia solo crece en
      Hrubý Jeseník y en Králický Sněžník, ha retrocedido mucho en las últimas décadas. Una gramínea, Sesleria
      tatrae, crece solo en una roca de mármol del lado polaco y es su único lugar fuera de los Cárpatos. Y el
      jestřábník sněžnický es un endemismo local que no crece en ningún otro lugar del mundo.
    wildlife: >-
      No esperes grandes carnívoros: los osos, lobos y linces fueron exterminados del macizo, aunque en los
      últimos años se confirmaron ejemplares errantes, quizá llegados de los Cárpatos. Lo que sí hay es un
      rebaño de [rebecos](/especie/rupicapra_rupicapra/) en la zona de Średniak que vive aquí desde finales
      del siglo XIX y es el único de Polonia fuera de los Tatras. En el lado checo, el rebeco se considera una
      especie introducida que pasó desde los vecinos Jeseníky.


      Para las aves, el bosque y las alturas. Hay cuervo grande y [pito negro](/especie/dryocopus_martius/), y
      entre los pájaros carpinteros raros se ha registrado el [pico
      tridáctilo](/especie/picoides_tridactylus/). El mirlo capiblanco, que destaca por su pechera blanca,
      vive en las alturas, y en el nivel subalpino anida el acentor alpino. Entre los búhos y mochuelos viven
      el mochuelo chico, el mochuelo boreal, el cárabo común y el [búho real](/especie/bubo_bubo/); junto a
      los arroyos puede verse el [mirlo acuático](/especie/cinclus_cinclus/). Del
      [urogallo](/especie/tetrao_urogallus/), desaparecido del macizo, se intenta ahora una reintroducción.


      Entre los anfibios viven la [salamandra común](/especie/salamandra_salamandra/) y el tritón alpestre, y
      entre los reptiles la culebra de collar y la víbora común. Varias especies de murciélagos buscan las
      cuevas locales; en el parque polaco están el gacek szary, el gacek brunatny, el nocek rudy y el nocek
      duży.
    visit: >-
      La excursión de referencia es el sendero didáctico del Králický Sněžník: 14 km de dificultad media a
      alta, 17 paradas, 685 m de desnivel y unas cinco horas. Empieza en el aparcamiento de la parada de
      autobús de Dolní Morava y termina en la cabaña Návrší, en Stříbrnice, y se puede hacer todo el año. Lo
      mantienen Lesy ČR y la agencia de conservación AOPK, y el punto de información es el TIC de Staré Město,
      en Dolní Morava. Para llegar se puede ir en tren hasta Staré Město y seguir en autobús, o en autobús
      desde Králíky a Dolní Morava.


      En el lado polaco, los puntos de partida son los pueblos de Międzygórze y Kletno: allí está la cascada
      de Wilczka y la gran cueva. En invierno hay un proyecto de ruta de esquí de fondo desde Bielice, en las
      montañas Bialskie, hasta Sienna.
    history: >-
      La protección llegó por dos lados. En el lado checo, la reserva natural nacional se declaró en 1990 con
      1694,67 ha y una zona de protección de 1371,24 ha. En el polaco, el Parque Paisajístico Śnieżnicki se
      estableció en 1981 y los bosques ocupan alrededor del 60 % de su superficie; tiene tres reservas:
      Śnieżnik Kłodzki, la cascada Wilczki y la Jaskinia Niedźwiedzia.


      El bosque tiene una historia de usos. Los bosques naturales originales de haya, abeto y picea se
      transformaron en monocultivos de picea que hoy sufren la contaminación, y los árboles de las parcelas de
      estudio llegan a pasar los 250 años. Antes de la guerra se creó en Międzygórze una estación de ciencias
      biológicas.
    before: >-
      Comprueba el estado de la ruta y el acceso en el TIC de Staré Město antes de salir; el sendero didáctico
      se hace todo el año, pero su dificultad es de media a alta. En la reserva y en el parque rigen normas de
      protección: infórmate de ellas con el gestor antes de ir.
    around: >-
      [Hrubý Jeseník](/lugar/hruby-jesenik---subalpine-tundra/) queda a unos doce kilómetros y [Orlické
      hory](/lugar/orlicke-hory---gory-bystrzyckie/), a unos diecisiete.
  en:
    intro: >-
      A raindrop falling on the summit of Trójmorski Wierch has three possible ocean destinations: the Baltic,
      the North Sea, or the Black Sea. This mountain hub divides its waters between three European seas
      directly along an international frontier: Králický Sněžník in Czech, or Masyw Śnieżnika in Polish,
      extends on both sides of the border between Czechia and Poland southeast of Kłodzko. It forms the
      highest range in the Polish sector of the Eastern Sudetes and ranks as Czechia's third highest,
      stretching some 16 km from Králíky to the Kladské sedlo pass. Around 200 km² of the massif lie in Poland
      and 76 km² in Czechia.
    landscape: >-
      This is a mountain block carved from ancient metamorphic bedrock. Gneisses and mica schists predominate,
      yet near Kletno lenses of crystalline marble emerge, where quarrying in 1966 accidentally uncovered
      Jaskinia Niedźwiedzia (Bear Cave), the most extensive cave system in the Sudetes. Wherever limestone
      occurs, underground water has dissolved dry ravines, swallow-holes, and resurgences. On the Czech flank,
      periglacial landforms include blockfields, frost scarps, and karst cavities like Tvarožné díry.


      Surface waters put on an equally dramatic display. On the Wilczka stream in Międzygórze, one of the
      tallest waterfalls in the Sudetes plunges 22 metres down a gorge.


      Vegetation zones ascend systematically with elevation. Between 1100 and 1350 m stretch vast mountain
      spruce forests, frequently retaining an old-growth character; on the eastern ridge lie open
      high-elevation peat bogs surrounded by bog spruce. From about 1350 m near the summit begins a windswept
      treeless alpine tundra zone, while above 1250 m alpine grasslands—confined almost exclusively to
      Śnieżnik's crowning plateau—hold extraordinary conservation value. Deep inside sheltered boulder
      crevices thrives luminescent goblin moss (Schistostega pennata), unique in Poland.


      High altitudes harbour botanical rarities. The bearded bellflower, which in Czechia grows solely in
      Hrubý Jeseník and Králický Sněžník, has declined markedly over recent decades. The grass Sesleria tatrae
      survives only on a single marble outcrop on the Polish side, marking its solitary location outside the
      Carpathians. Finally, the hawkweed Hieracium nivimontis is a strictly local endemic found nowhere else
      on Earth.
    wildlife: >-
      Do not expect resident large carnivores: brown bears, wolves, and lynx were historically eradicated from
      the range, although wandering individuals confirmed in recent seasons likely strayed from the
      Carpathians. In their place, a resident herd of [chamois](/especie/rupicapra_rupicapra/) roams Średniak,
      established here since the late nineteenth century and representing Poland's only wild herd outside the
      Tatras. On the Czech slopes, chamois are considered an introduced species that dispersed from the
      neighbouring Jeseníky.


      The woodlands and summits harbour rich bird communities. Ravens and the [black
      woodpecker](/especie/dryocopus_martius/) inhabit the forests, alongside the rare [Eurasian three-toed
      woodpecker](/especie/picoides_tridactylus/). The ring ouzel, recognized by its bright white breast
      crescent, frequents high altitudes, while the alpine accentor nests in the subalpine dwarf scrub.
      Resident owls include the Eurasian pygmy owl, boreal owl, tawny owl, and [Eurasian
      eagle-owl](/especie/bubo_bubo/); turbulent mountain streams host the white-throated
      [dipper](/especie/cinclus_cinclus/). Following the extirpation of the [western
      capercaillie](/especie/tetrao_urogallus/), an active reintroduction program is currently underway.


      Amphibians include the fire [salamander](/especie/salamandra_salamandra/) and alpine newt, while
      reptiles feature grass snakes and common vipers. Local limestone caves provide winter hibernacula for
      bats: the Polish landscape park shelters the grey long-eared bat, brown long-eared bat, Daubenton's bat,
      and greater mouse-eared bat.
    visit: >-
      The primary walking route is the Králický Sněžník educational nature trail: 14 km of medium to high
      difficulty, featuring 17 thematic stops, 685 m of ascent, taking roughly five hours to complete. It
      begins at the Dolní Morava bus turnaround car park and concludes at the Návrší mountain hut in
      Stříbrnice, passable in all seasons. The trail is maintained by Lesy ČR and the nature conservation
      agency AOPK, with tourist information provided by the Staré Město TIC in Dolní Morava. Access is
      possible by rail to Staré Město followed by bus, or by direct bus from Králíky to Dolní Morava.


      On the Polish side, principal trailheads are the scenic villages of Międzygórze and Kletno, granting
      immediate access to the Wilczka waterfall and Bear Cave. In winter, a designated cross-country ski trail
      connects Bielice in the Bialskie Mountains to Sienna.
    history: >-
      Conservation status was established from two national sides. In Czechia, the national nature reserve was
      proclaimed in 1990 encompassing 1694.67 ha with a protective buffer zone of 1371.24 ha. On the Polish
      side, the Śnieżnik Landscape Park was established in 1981, with forests covering around 60 % of its
      area; it protects three designated nature reserves: Śnieżnik Kłodzki, Wilczki Waterfall, and Jaskinia
      Niedźwiedzia.


      The forests reflect a long forestry history. Native mixed old-growth of beech, fir, and spruce was
      largely replaced by commercial spruce monocultures that later suffered from acid rain; in preserved
      study plots, old-growth veterans exceed 250 years of age. Before World War II, an alpine biological
      research station operated in Międzygórze.
    before: >-
      Check trail conditions and weather forecasts at the Staré Město TIC before ascending; the educational
      trail remains open year-round but is classified as medium to demanding in difficulty. Strictly observe
      national reserve and landscape park regulations: verify local restrictions with the management
      authorities beforehand.
    around: >-
      [Hrubý Jeseník](/lugar/hruby-jesenik---subalpine-tundra/) lies roughly twelve kilometres to the east and
      [Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) around seventeen kilometres to the west.
  fr:
    intro: >-
      Une goutte de pluie tombant au sommet du Trójmorski Wierch a trois destinées possibles : la Baltique, la
      mer du Nord ou la mer Noire. Ce carrefour orographique distribue ses eaux vers trois mers par-delà une
      frontière d'État : le Králický Sněžník en tchèque, ou Masyw Śnieżnika en polonais, s'étend de part et
      d'autre de la frontière entre la Tchéquie et la Pologne, au sud-est de Kłodzko. C'est le plus haut
      massif de la section polonaise des Sudètes orientales et le troisième sommet de Tchéquie, s'étirant sur
      environ 16 km depuis Králíky jusqu'au col de Kladské sedlo. Environ 200 km² du massif relèvent de la
      Pologne et 76 km² de la Tchéquie.
    landscape: >-
      Cette montagne est bâtie de roches métamorphiques anciennes. Gneiss et micaschistes prédominent, mais
      près de Kletno affleurent des lentilles de marbre où une carrière révéla en 1966 la Jaskinia
      Niedźwiedzia (grotte de l'Ours), la plus vaste cavité des Sudètes. Là où s'étend le calcaire, l'eau a
      creusé vallons secs, gouffres et résurgences. Côté tchèque se contemplent des modelés périglaciaires
      comme des pierriers et des cavités karstiques telles que Tvarožné díry.


      Les eaux vives animent la surface. Sur le torrent de la Wilczka, à Międzygórze, se précipite une des
      plus hautes cascades des Sudètes, haute de 22 mètres.


      La végétation s'étage en fonction de l'altitude. Entre 1100 et 1350 m s'étendent de vastes pessières
      montagnardes d'aspect quasi vierge ; sur la crête orientale s'ouvrent des tourbières hautes ceinturées
      d'épicéas sur tourbe. Dès environ 1350 m débute près du sommet un étage alpin dénudé, et au-dessus de
      1250 m les pelouses sommitales du Śnieżnik possèdent une valeur patrimoniale exceptionnelle. Dans les
      anfractuosités des rochers luit la schizostéga pennée, l'unique mousse luminescente de Pologne.


      Les hauteurs abritent des raretés floristiques. La campanule barbue, qui en Tchéquie ne pousse qu'au
      Hrubý Jeseník et au Králický Sněžník, a fortement régressé. La graminée Sesleria tatrae subsiste sur une
      unique roche marbrière côté polonais, son seul site hors des Carpates. Enfin, l'épervière du Sněžník est
      un endémisme local exclusif.
    wildlife: >-
      Ne cherchez pas de grands prédateurs résidents : ours, loups et lynx furent exterminés du massif, même
      si des individus errants venus des Carpates ont été observés ces dernières années. En revanche, une
      harde de [chamois](/especie/rupicapra_rupicapra/) habite le secteur de Średniak depuis la fin du XIXe
      siècle, formant l'unique population polonaise hors des Tatras. Côté tchèque, le chamois est considéré
      comme une espèce introduite issue des Jeseníky voisins.


      L'avifaune colonise forêts et cimes. Grand corbeau et [pic noir](/especie/dryocopus_martius/)
      fréquentent les bois, aux côtés du rare [pic tridactyle](/especie/picoides_tridactylus/). Le merle à
      plastron peuple les altitudes, tandis que l'accenteur alpin niche à l'étage subalpin. Parmi les rapaces
      nocturnes figurent la chevêchette d'Europe, la chouette de Tengmalm, la chouette hulotte et le
      [grand-duc d'Europe](/especie/bubo_bubo/) ; les ruisseaux accueillent le [cincle
      plongeur](/especie/cinclus_cinclus/). Pour le [grand tétras](/especie/tetrao_urogallus/), disparu du
      massif, un programme de réintroduction est engagé.


      Chez les amphibiens vivent la [salamandre tachetée](/especie/salamandra_salamandra/) et le triton
      alpestre, et chez les reptiles la couleuvre à collier et la vipère péliade. Diverses chauves-souris
      hibernent dans les cavités, notamment la barbastelle, l'oreillard roux et le grand murin.
    visit: >-
      La randonnée classique suit le sentier didactique du Králický Sněžník : 14 km de difficulté moyenne à
      soutenue, 17 étapes, 685 m de dénivelé et environ cinq heures de marche. Il débute au parking du
      terminus de bus de Dolní Morava pour s'achever au refuge Návrší à Stříbrnice, praticable en toute
      saison. Il est géré par Lesy ČR et l'AOPK, avec pour point d'information le centre touristique TIC de
      Staré Město à Dolní Morava. L'accès s'effectue en train jusqu'à Staré Město puis en bus, ou en bus
      direct depuis Králíky.


      Côté polonais, les départs s'effectuent depuis Międzygórze et Kletno, accès privilégié à la cascade de
      la Wilczka et à la grotte de l'Ours. En hiver, un tracé de ski de fond relie Bielice à Sienna.
    history: >-
      La protection s'est mise en place des deux côtés de la frontière. En Tchéquie, la réserve naturelle
      nationale fut créée en 1990 avec 1694,67 ha et une zone tampon de 1371,24 ha. Côté polonais, le parc
      paysager de Śnieżnik fut institué en 1981, avec des forêts couvrant environ 60 % de sa superficie ; il
      englobe trois réserves : Śnieżnik Kłodzki, la cascade Wilczki et la Jaskinia Niedźwiedzia.


      La forêt garde les traces de son exploitation. Les hêtraies-sapinières primitives ont été transformées
      en monocultures d'épicéas vulnérables aux pluies acides, et les arbres des parcelles témoins dépassent
      250 ans. Avant la guerre, une station de biologie alpine fonctionnait à Międzygórze.
    before: >-
      Vérifiez la météo et l'état des chemins au TIC de Staré Město avant de partir ; le sentier didactique
      est praticable toute l'année mais exige une bonne condition physique. Respectez les règlements de la
      réserve et du parc paysager en consultant au préalable les gestionnaires.
    around: >-
      Le massif de [Hrubý Jeseník](/lugar/hruby-jesenik---subalpine-tundra/) se trouve à environ douze
      kilomètres et les monts [Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) à environ dix-sept
      kilomètres.
  de:
    intro: >-
      Ein Regentropfen, der auf den Trójmorski Wierch fällt, hat drei mögliche Ziele: die Ostsee, die Nordsee
      oder das Schwarze Meer. Dieser Bergknoten verteilt seine Gewässer auf drei Meere entlang einer
      Landesgrenze: Der Králický Sněžník auf Tschechisch oder Masyw Śnieżnika auf Polnisch erstreckt sich
      beiderseits der Grenze zwischen Tschechien und Polen südöstlich von Kłodzko. Er ist der höchste
      Gebirgszug im polnischen Teil der Ostsudeten und in Tschechien die dritthöchste Gebirgsgruppe, rund 16
      km lang von Králíky bis zum Pass Kladské sedlo. Rund 200 km² des Massivs liegen in Polen und 76 km² in
      Tschechien.
    landscape: >-
      Das Massiv besteht aus altem metamorphem Urgestein. Gneise und Glimmerschiefer herrschen vor, doch bei
      Kletno treten Marmoradern zutage, wo 1966 in einem Steinbruch die Jaskinia Niedźwiedzia (Bärenhöhle)
      entdeckt wurde, das größte Höhlensystem der Sudeten. Wo Kalkstein lagert, schuf das Wasser Karstformen
      mit Trockentälern und Dolinen. Auf tschechischer Seite finden sich periglaziale Frostschuttfelder und
      Karsthöhlen wie Tvarožné díry.


      Auch oberirdisch bietet das Wasser imposante Bilder. Am Bach Wilczka in Międzygórze stürzt einer der
      höchsten Wasserfälle der Sudeten 22 Meter in die Tiefe.


      Die Vegetation ist höhenzonal gegliedert. Zwischen 1100 und 1350 m stocken weite Bergfichtenurwälder;
      auf dem Ostkamm liegen offene Hochmoore. Ab etwa 1350 m nahe dem Gipfel beginnt eine baumfreie alpine
      Tundrazone, und oberhalb von 1250 m besitzen die artenreichen Bergwiesen auf der Kuppe des Śnieżnik
      herausragenden Wert. In schattigen Felsspalten gedeiht das seltene Leuchtmoos, das einzige Vorkommen
      Polens.


      In der Gipfelregion überdauern botanische Kostbarkeiten. Die Bärtige Glockenblume, die in Tschechien nur
      im Hrubý Jeseník und am Králický Sněžník vorkommt, ging stark zurück. Das Gras Sesleria tatrae wächst
      auf polnischer Seite auf einem isolierten Marmorfelsen als einziger Standort außerhalb der Karpaten. Das
      Schneeberg-Habichtskraut schließlich ist ein streng lokaler Endemit.
    wildlife: >-
      Große Raubtiere sind hier nicht sesshaft: Bären, Wölfe und Luchse wurden ausgerottet, wenngleich in den
      letzten Jahren vereinzelte Streiftiere aus den Karpaten nachgewiesen wurden. Dagegen lebt am Średniak
      seit Ende des neunzehnten Jahrhunderts ein [Gemsenbestand](/especie/rupicapra_rupicapra/), die einzige
      Gemsenkolonie Polens außerhalb der Hohen Tatra. Auf tschechischer Seite gelten die Gämsen als
      Einwanderer aus dem benachbarten Jeseníky.


      Wälder und Hochlagen prägen die Vogelwelt. Kolkrabe und [Schwarzspecht](/especie/dryocopus_martius/)
      sind verbreitet, seltener zeigt sich der [Dreizehenspecht](/especie/picoides_tridactylus/). Die
      Ringdrossel bewohnt die Höhenstufen, während der Alpenbraunelle subalpine Lagen genügen. Unter den Eulen
      leben Sperlingskauz, Raufußkauz, Waldkauz und [Uhu](/especie/bubo_bubo/); Gebirgsbäche beherbergen die
      [Wasseramsel](/especie/cinclus_cinclus/). Für das verschwundene [Auerhuhn](/especie/tetrao_urogallus/)
      laufen derzeit Wiederansiedlungsprojekte.


      Unter den Amphibien finden sich [Feuersalamander](/especie/salamandra_salamandra/) und Bergmolch, bei
      den Reptilien Ringelnatter und Kreuzotter. Höhlen dienen Fledermäusen als Winterquartier, darunter
      Mopsfledermaus, Braunes Langohr und Großes Mausohr.
    visit: >-
      Die Hauptroute bildet der Lehrpfad Králický Sněžník: 14 km lang, von mittlerem bis hohem Anspruch, mit
      17 Stationen, 685 m Höhenunterschied und etwa fünf Stunden Gehzeit. Er beginnt am Buswendeplatz von
      Dolní Morava und endet an der Berghütte Návrší in Stříbrnice, ganzjährig begehbar. Betreut wird er von
      Lesy ČR und der AOPK, mit Auskünften im TIC Staré Město in Dolní Morava. Die Anreise erfolgt per Bahn
      bis Staré Město mit Busanschluss oder direkt per Bus von Králíky.


      Auf polnischer Seite starten Wanderungen in Międzygórze und Kletno mit schnellem Zugang zum
      Wilczka-Wasserfall und zur Bärenhöhle. Im Winter verbindet eine Langlaufloipe Bielice mit Sienna.
    history: >-
      Der Schutz entstand von zwei Seiten. In Tschechien wurde das nationale Naturreservat 1990 mit 1694,67 ha
      und 1371,24 ha Pufferzone eingerichtet. Auf polnischer Seite wurde der Landschaftspark Śnieżnik 1981
      gegründet, dessen Fläche zu rund 60 % bewaldet ist; er umfasst drei Naturschutzgebiete: Śnieżnik
      Kłodzki, Wilczki-Wasserfall und Jaskinia Niedźwiedzia.


      Die Wälder blicken auf eine lange forstliche Nutzung zurück. Ursprüngliche Mischwälder wurden zu
      Fichtenforsten umgewandelt, die unter Immissionen litten; Probeflächen weisen Altbäume von über 250
      Jahren auf. Vor dem Krieg bestand in Międzygórze eine biologische Forschungsstation.
    before: >-
      Prüfe Wegezustand und Wetter im TIC Staré Město vor dem Aufstieg; der Lehrpfad ist ganzjährig geöffnet,
      verlangt aber Trittsicherheit. Beachte die Schutzbestimmungen von Naturreservat und Landschaftspark vor
      Ort.
    around: >-
      Das Gebirge [Hrubý Jeseník](/lugar/hruby-jesenik---subalpine-tundra/) liegt etwa zwölf Kilometer
      entfernt und das Adlergebirge [Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) etwa siebzehn
      Kilometer.
  it:
    intro: >-
      Una goccia di pioggia che cade sulla vetta del Trójmorski Wierch ha tre possibili destinazioni: il Mar
      Baltico, il Mare del Nord o il Mar Nero. Questo nodo montuoso spartisce le proprie acque verso tre mari
      lungo una linea di confine: il Králický Sněžník in ceco, o Masyw Śnieżnika in polacco, si distende a
      cavallo del confine tra Cechia e Polonia a sud-est di Kłodzko. È la catena più elevata dei Sudeti
      Orientali polacchi e la terza del territorio ceco, allungandosi per circa 16 km da Králíky al valico di
      Kladské sedlo. Circa 200 km² del massiccio ricadono in Polonia e 76 km² in Cechia.
    landscape: >-
      La montagna è scolpita in antichissime rocce metamorfiche. Prevalgono gneiss e micascisti, ma presso
      Kletno compaiono lenti di marmo cristallino dove nel 1966 una cava portò alla luce la Jaskinia
      Niedźwiedzia (Grotta dell'Orso), la cavità più estesa dei Sudeti. Dove affiora il calcare, le acque
      hanno modellato forre secche, inghiottitoi e risorgive. Sul versante ceco spiccano forme periglaciali
      come pietraie detritiche e caverne carsiche quali Tvarožné díry.


      Le acque regalano grandi scorci anche in superficie. Lungo il torrente Wilczka a Międzygórze scroscia
      una delle cascate più imponenti dei Sudeti, con un salto di 22 metri.


      La vegetazione si suddivide in fasce altimetriche. Tra 1100 e 1350 m prosperano estese peccete montane
      d'aspetto vetusto; sul crinale orientale si aprono torbiere alte cinte da abeti su torba. Da circa 1350
      m comincia presso la vetta la tundra alpina primaria, e oltre i 1250 m le praterie d'alta quota del
      massiccio racchiudono un inestimabile valore floristico. Nelle fessure rocciose ombrose brilla la
      schizostega pennata, l'unico muschio luminescente della Polonia.


      Le quote sommitali custodiscono rarità botaniche. La campanula barbuta, che in Cechia cresce unicamente
      a Hrubý Jeseník e sul Králický Sněžník, è fortemente regredita. La graminacea Sesleria tatrae resiste su
      un isolato sperone di marmo sul versante polacco, suo unico avamposto fuori dai Carpazi. Lo sparviere
      del Sněžník è invece un endemismo locale esclusivo.
    wildlife: >-
      Non aspettarti grandi carnivori stanziali: orsi, lupi e linci furono storicamente sterminati nel
      massiccio, sebbene negli ultimi anni siano stati segnalati individui erranti giunti dai Carpazi. Vive
      invece una popolazione di [camosci](/especie/rupicapra_rupicapra/) attorno a Średniak presente da fine
      Ottocento, unico nucleo polacco fuori dai Tatra. Sul versante ceco il camoscio è considerato specie
      alloctona discesa dai monti Jeseníky.


      Gli uccelli popolano boschi e creste. Il corvo imperiale e il [picchio
      nero](/especie/dryocopus_martius/) sono consueti, affiancati dal raro [picchio
      tridattilo](/especie/picoides_tridactylus/). Il merlo dal collare nidifica nei settori alti, mentre il
      sordone frequenta l'ambiente subalpino. Tra i rapaci notturni figurano la civetta nana, la civetta
      capogrosso, l'allocco e il [gufo reale](/especie/bubo_bubo/); i torrenti montani ospitano il [merlo
      acquaiolo](/especie/cinclus_cinclus/). Per il [gallo cedrone](/especie/tetrao_urogallus/), scomparso
      localmente, è attivo un piano di reintroduzione.


      Tra gli anfibi vivono la [salamandra pezzata](/especie/salamandra_salamandra/) e il tritone alpino,
      mentre tra i rettili la biscia dal collare e il marasso. Le cavità ospitano pipistrelli svernanti, tra
      cui il vespertilio di Daubenton e il serotino bruno.
    visit: >-
      L'itinerario di riferimento coincide con il sentiero didattico del Králický Sněžník: 14 km di media o
      alta difficoltà, 17 tappe informative, 685 m di dislivello e circa cinque ore di cammino. Muove dal
      capolinea dei bus di Dolní Morava e raggiunge il rifugio Návrší a Stříbrnice, agibile tutto l'anno. È
      gestito da Lesy ČR e dall'AOPK, con recapito presso il TIC Staré Město a Dolní Morava. L'accesso avviene
      in treno fino a Staré Město con bus coincidente o in bus da Králíky.


      Sul versante polacco i punti d'accesso principali sono i paesi di Międzygórze e Kletno, ideali per la
      cascata Wilczka e la Grotta dell'Orso. In inverno è attiva una pista di sci nordico tra Bielice e
      Sienna.
    history: >-
      La tutela è stata istituita su entrambi i versanti. In Cechia la riserva naturale nazionale fu
      proclamata nel 1990 su 1694,67 ha con fascia di protezione di 1371,24 ha. Sul lato polacco il Parco
      paesaggistico di Śnieżnik nacque nel 1981 con boschi che coprono circa il 60 % della superficie; tutela
      tre riserve: Śnieżnik Kłodzki, cascata Wilczki e Jaskinia Niedźwiedzia.


      I boschi recano l'impronta forestale storica. Le antiche faggete e abetine furono rimpiazzate da
      monocolture di peccio colpite dalle piogge acide; nelle parcelle storiche gli alberi superano 250 anni
      d'età. Prima della guerra operava a Międzygórze una stazione di biologia alpina.
    before: >-
      Controlla l'agibilità dei percorsi e il meteo al TIC di Staré Město prima di salire; il sentiero
      didattico è fruibile tutto l'anno ma richiede abitudine a camminare in montagna. Rispetta la normativa
      delle riserve naturali e dei parchi consultando gli enti preposti.
    around: >-
      Il massiccio di [Hrubý Jeseník](/lugar/hruby-jesenik---subalpine-tundra/) dista circa dodici chilometri
      verso est e i monti [Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) circa diciassette chilometri
      a ovest.
  pt:
    intro: >-
      Uma gota de chuva caída no topo de Trójmorski Wierch tem três destinos marítimos possíveis: o Báltico, o
      Mar do Norte ou o Mar Negro. Este nó orográfico distribui as suas águas por três mares ao longo de uma
      fronteira internacional: o Králický Sněžník em checo, ou Masyw Śnieżnika em polaco, estende-se em ambos
      os lados da fronteira entre a Chéquia e a Polónia a sudeste de Kłodzko. Constitui a cordilheira mais
      alta do setor polaco dos Sudetos Orientais e a terceira mais elevada da Chéquia, estendendo-se por cerca
      de 16 km desde Králíky até ao desfiladeiro de Kladské sedlo. Cerca de 200 km² do maciço situam-se na
      Polónia e 76 km² na Chéquia.
    landscape: >-
      Esta montanha assenta em rochas metamórficas antiquíssimas. Prevalecem gnaisses e micaxistos, mas perto
      de Kletno surgem bancadas de mármore cristalino onde uma pedreira desvendou em 1966 a Jaskinia
      Niedźwiedzia (Gruta do Urso), a maior cavidade subterrânea dos Sudetos. Onde há calcário, a água
      esculpiu vales secos, algares e ressurgências cársticas. No flanco checo evidenciam-se formas
      periglaciares como campos de blocos e grutas como Tvarožné díry.


      As águas de superfície proporcionam idêntico espetáculo. No ribeiro Wilczka, em Międzygórze,
      precipita-se uma das maiores cascatas dos Sudetos, com 22 metros de despenhadeiro.


      A vegetação escalona-se por patamares altitudinais. Entre 1100 e 1350 m estendem-se vastos abetais
      montanos de feição quase virgem; na crista oriental abrem-se turfeiras altas rodeadas de espruces sobre
      turfa. A partir de cerca de 1350 m inicia-se junto ao cume a tundra alpina desprovida de arvoredo, e
      acima dos 1250 m os prados montanos do cume do Śnieżnik possuem valor biológico extraordinário. Nas
      fendas rochosas abrigadas reluz o musgo luminescente Schistostega pennata, o único da Polónia.


      Nas altitudes sobrevivem relíquias botânicas. A campânula-barbuda, que na Chéquia só ocorre em Hrubý
      Jeseník e Králický Sněžník, regrediu nas últimas décadas. A gramínea Sesleria tatrae subsiste num
      rochedo de mármore do lado polaco, seu único reduto fora dos Cárpatos. Já a pilosela Hieracium
      nivimontis é um endemismo estritamente local.
    wildlife: >-
      Não esperes grandes carnívoros residentes: ursos, lobos e linces foram extintos do maciço, conquanto nos
      últimos anos se tenham confirmado indivíduos errantes vindos dos Cárpatos. Sobrevive uma manada de
      [camurças](/especie/rupicapra_rupicapra/) em Średniak desde finais do século XIX, único núcleo polaco
      fora dos Tatras. No flanco checo a camurça é considerada espécie introduzida a partir dos montes
      Jeseníky vizinhos.


      As aves povoam o dossel e as cristas. O corvo-comum e o [pica-pau-preto](/especie/dryocopus_martius/)
      são habituais, surgindo raramente o [pica-pau-tridáctilo](/especie/picoides_tridactylus/). O
      melro-de-peito-branco reside nas altitudes, enquanto a ferreirinha-alpina nidifica no patamar subalpino.
      Entre as aves de rapina noturnas contam-se o mocho-pigmeu, o mocho-de-tengmalm, a coruja-do-mato e o
      [bufo-real](/especie/bubo_bubo/); as ribeiras acolhem o [melro-d'água](/especie/cinclus_cinclus/).
      Quanto ao [tetraz](/especie/tetrao_urogallus/), extirpado do maciço, decorre um programa de
      reintrodução.


      Entre os anfíbios destacam-se a [salamandra-de-pintas-amarelas](/especie/salamandra_salamandra/) e o
      tritão-alpino, e nos répteis a cobra-de-água-de-colar e a víbora-comum. Várias espécies de morcegos
      procuram as grutas calcárias no inverno.
    visit: >-
      A rota pedestre de referência é o trilho didático de Králický Sněžník: 14 km de dificuldade média a
      elevada, 17 paragens temáticas, 685 m de desnível e cerca de cinco horas de marcha. Inicia-se no parque
      da paragem de autocarros de Dolní Morava e termina no refúgio Návrší em Stříbrnice, realizável em
      qualquer estação. É gerido por Lesy ČR e pela agência AOPK, com apoio do posto de turismo TIC de Staré
      Město em Dolní Morava. O acesso faz-se de comboio até Staré Město e depois em autocarro, ou em autocarro
      direto de Králíky.


      No lado polaco, os pontos de partida são as povoações de Międzygórze e Kletno, ideais para visitar a
      cascata Wilczka e a Gruta do Urso. No inverno há pistas de esqui nórdico entre Bielice e Sienna.
    history: >-
      A classificação ambiental desenvolveu-se em duas vertentes. Na Chéquia, a reserva natural nacional foi
      estabelecida em 1990 abrangendo 1694,67 ha com zona de proteção de 1371,24 ha. Do lado polaco, o Parque
      Paisagístico de Śnieżnik foi criado em 1981, cobrindo os bosques cerca de 60 % da sua superfície; tutela
      três reservas: Śnieżnik Kłodzki, cascata Wilczki e Jaskinia Niedźwiedzia.


      A floresta reflete um passado de exploração silvícola. Os bosques primitivos de faia, abeto e espruce
      deram lugar a monoculturas de espruce fustigadas por chuvas ácidas; nas parcelas de estudo há exemplares
      que superam 250 anos de idade. Antes da guerra funcionava em Międzygórze uma estação de investigação
      biológica.
    before: >-
      Informa-te sobre o estado dos caminhos e a meteorologia no TIC de Staré Město antes de subir; o trilho
      didático faz-se o ano inteiro mas exige calçado de montanha. Acata as normas de proteção da reserva e do
      parque paisagístico junto das entidades gestoras.
    around: >-
      [Hrubý Jeseník](/lugar/hruby-jesenik---subalpine-tundra/) fica a cerca de doze quilómetros para leste e
      [Orlické hory](/lugar/orlicke-hory---gory-bystrzyckie/) a cerca de dezassete quilómetros para oeste.
