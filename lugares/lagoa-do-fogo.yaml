    edificaciones ni carreteras en la orilla.
  en: >-
    Collapsed volcanic caldera cradling a turquoise lake ringed by endemic Azorean flora, free from buildings
    or roads along its shores.
  fr: >-
    Cratère volcanique effondré abritant un lac turquoise ceinturé d'une flore endémique açorienne, vierge de
    constructions et de routes sur ses berges.
  de: >-
    Eingestürzter Vulkankrater mit türkisfarbenem Binnensee, umgeben von endemischer azoreanischer Flora, frei
    von Bauten und Straßen am Ufer.
  it: >-
    Cratere vulcanico collassato che racchiude un lago turchese cinto da flora endemica delle Azzorre, privo
