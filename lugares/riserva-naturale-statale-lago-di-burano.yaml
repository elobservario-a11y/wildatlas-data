observaciones:
  es: >-
    Comprueba antes de ir y reserva: la reserva está cerrada los días con alerta meteorológica amarilla,
    naranja o roja de la Región de Toscana, y puede cerrar por motivos ajenos a su gestión. En tren, por la
    línea Roma-Pisa, se baja en Capalbio Scalo y se llega a pie en pocos minutos al centro de visitas.
texto:
  es:
    intro: >-
      En el extremo sur de la Maremma de Grosseto, en el municipio de Capalbio, hay una laguna de aguas
      salobres. El lago de Burano es el vestigio de un lago antiguo, separado del mar Tirreno por una franja
      de arena —un tómbolo— cubierta hoy de dunas y de macchia. Aquí nació en 1967 la primera Oasi WWF de
      Italia, y desde entonces la reserva es una pequeña historia de cómo se defiende una costa.
    landscape: >-
      El lago es en realidad un estanque costero salobre. Su superficie actual es de 140 hectáreas, con una
      profundidad media de cerca de un metro. Entre el agua y el mar corre la duna: el litoral se mantiene
      íntegro a lo largo de 12 kilómetros, con la vegetación pionera típica de la playa de arena, y justo
      detrás se alza el tómbolo cubierto de macchia mediterránea. Esa franja consolida el terreno y protege
      del viento del mar el resto de bosque perennifolio mediterráneo.


      La duna de Burano es un raro ejemplo de ambiente dunal de altísima naturalidad, con enebrales de
      Juniperus. La vegetación tiene encinas y alcornoques, y entre los arbustos enebros, mirto, zarzaparrilla
      y espárrago. En total, la flora supera las quinientas plantas.
    wildlife: >-
      Para quien viene a ver aves, Burano es una cita de invierno: el oasis alberga más de trescientas
      especies. Entre las más características están la focha común, el porrón común, el porrón pardo, el
      aguilucho lagunero y el rascón europeo. Entre las acuáticas se citan además el flamenco, los cormoranes,
      las garzas, el ánade real y la cuchara común, símbolo del Oasi WWF; en el aire, el martín pescador y el
      águila pescadora. Entre las nidificantes de mayor interés figuran el chorlitejo patinegro y la terrera
      marismeña.


      La duna también guarda otra fauna. Viven la tortuga mediterránea y la culebra de cuatro rayas, y entre
      los anfibios Bombina pachypus, endémico de la Italia peninsular. Puercoespines, zorros y jabalíes la
      frecuentan: difícilmente se ven, pero es fácil notar sus huellas en la arena. Más raro aún, el lobo usa
      la reserva en sus desplazamientos largos, atraído por las presas que le ofrecen nutrias y jabalíes.
    visit: >-
      La visita se hace desde el centro de visitas. Los visitantes individuales solo pueden entrar con visita
      guiada, con reserva; la entrada de la reserva queda a unos 2 km del centro, adonde se llega cada uno con
      su coche, moto o bicicleta. El sendero natural, adaptado también a personas con discapacidad, recorre la
      duna y se asoma al lago con siete puntos de observación: seis puestos cubiertos y una torre. Junto al
      centro de visitas hay además un pequeño sendero de 500 m que termina en un rincón dedicado a las
      mariposas, y solo se puede comer en el área de pícnic del centro.
    history: >-
      La reserva estatal se creó en 1980, pero desde 1967 el WWF ya había fundado aquí la primera Oasi WWF de
      Italia. La reserva se extiende por unas 410 hectáreas, más otras 600 sustraídas a la caza mediante un
      coto cerrado acordado con el propietario, y queda dentro del humedal de importancia internacional «Lago
      di Burano», creado en 1977. También es zona especial de conservación (IT51A0031), zona de protección
      especial (IT51A0033) y sitio Ramsar. Forma parte además del Important Bird and Biodiversity Area que
      incluye el Argentario y la laguna de Orbetello.


      Las amenazas son conocidas: el turismo de playa en verano y los perros sueltos, que ponen en peligro a
      las aves que anidan. El WWF responde con paneles informativos, vías de acceso preferentes, vallas en
      dunas erosionadas y una lanzadera, y limpia la playa sin maquinaria, dejando el material orgánico
      varado, vital para los escarabajos y otros invertebrados.
    before: >-
      Comprueba antes de ir y reserva: la reserva está cerrada los días con alerta meteorológica amarilla,
      naranja o roja de la Región de Toscana, y puede cerrar por motivos ajenos a su gestión. En tren, por la
      línea Roma-Pisa, se baja en Capalbio Scalo y se llega a pie en pocos minutos al centro de visitas.
    around: >-
      No hay vecinos publicados en el atlas. Por su costa, humedal y bosque mediterráneo se parece al [Parque
      Natural de Mondragó](/lugar/parque-natural-de-mondrago/), con el que comparte la tortuga mediterránea.
  en:
    intro: >-
      In the southernmost part of the Grosseto Maremma, in the municipality of Capalbio, lies a brackish
      lagoon. Lake Burano is the relict of an ancient coastal lake, cut off from the Tyrrhenian Sea by a sandy
      tombolo crowned today with coastal dunes and dense macchia. Here in 1967 Italy's first WWF Oasis was
      born, and ever since the reserve has been a living lesson in how to defend a coastline.
    landscape: >-
      The lake is actually a shallow brackish coastal pond. Its present surface covers 140 hectares, with an
      average depth of around one meter. Between open water and the sea runs the dune cordon: the shoreline
      remains completely intact along 12 kilometers, showing pioneer sand-beach flora, with the sand spit
      cloaked in Mediterranean macchia right behind. This strip stabilizes the sands and shields the remaining
      evergreen Mediterranean woodland from salt winds.


      The Burano dune is a rare example of a highly natural coastal dune ecosystem, rich in Juniperus
      thickets. The canopy includes holm oaks and cork oaks, with an understory of juniper, myrtle,
      sarsaparilla, and wild asparagus. In all, the flora exceeds five hundred species.
    wildlife: >-
      For birdwatchers, Burano is an unmissable winter destination: the oasis shelters more than three hundred
      bird species. Among the most characteristic are common coot, common pochard, ferruginous duck, western
      marsh harrier, and water rail. Other aquatic species include greater flamingo, cormorants, herons,
      mallard, and northern shoveler, the emblem of the WWF Oasis; hovering overhead, kingfisher and osprey.
      Remarkable breeding species include Kentish plover and Mediterranean short-toed lark.


      The dunes also shelter distinctive terrestrial wildlife. Hermann's tortoise and four-lined snake live
      here, alongside the Apennine yellow-bellied toad (Bombina pachypus), endemic to peninsular Italy.
      Crested porcupines, red foxes, and wild boars roam the dunes: rarely spotted, but their tracks are
      easily traced in the sand. Rarer still, wolves use the reserve as a travel corridor, drawn by otters and
      young boars as potential prey.
    visit: >-
      Visits begin at the visitor center. Individual travelers may enter only on guided tours by prior
      reservation; the reserve entrance lies about 2 km from the center, reachable independently by car,
      motorbike, or bicycle. The nature trail, fully adapted for visitors with disabilities, runs along the
      dune and looks out onto the lagoon via seven viewing blinds: six covered hides and an observation tower.
      Beside the visitor center, an additional 500 m path leads to a butterfly garden, and meals are permitted
      only in the center's picnic area.
    history: >-
      The state nature reserve was formally established in 1980, though WWF Italy had already founded its
      first oasis here in 1967. The reserve encompasses around 410 hectares, with a further 600 hectares
      closed to hunting through an agreement with the landowner, and sits within the 'Lago di Burano' wetland
      of international importance designated in 1977. It is also a Special Area of Conservation (IT51A0031), a
      Special Protection Area (IT51A0033), and a Ramsar site. Additionally, it forms part of the Important
      Bird and Biodiversity Area encompassing Mount Argentario and Orbetello Lagoon.


      Pressures are well known: summer beach tourism and off-leash dogs, which endanger ground-nesting birds.
      WWF counters this with interpretive signage, designated access walkways, fencing on eroded dunes, and an
      electric shuttle, while cleaning the beach manually without machinery to leave beach-cast organic wrack
      vital for beetles and marine invertebrates.
    before: >-
      Check in advance and reserve: the reserve is closed on days with yellow, orange, or red weather alerts
      issued by the Tuscany Region, and may close for operational reasons beyond management control. By train
      along the Rome-Pisa line, disembark at Capalbio Scalo and walk a few minutes to the visitor center.
    around: >-
      There are no neighboring sites published in the atlas. In its coast, wetland, and Mediterranean woods it
      resembles [Mondragó Natural Park](/lugar/parque-natural-de-mondrago/), sharing the presence of Hermann's
      tortoise.
  fr:
    intro: >-
      À l'extrémité méridionale de la Maremme de Grosseto, sur la commune de Capalbio, s'étend une lagune
      d'eaux saumâtres. Le lac de Burano est le vestige d'un ancien lac littoral, isolé de la mer Tyrrhénienne
      par un cordon sablonneux — un tombolo — aujourd'hui couvert de dunes et de maquis. C'est ici qu'est née
      en 1967 la première oasis WWF d'Italie, et la réserve offre depuis lors un exemple éclatant de
      protection du littoral.
    landscape: >-
      Le lac est en réalité un étang littoral saumâtre. Sa superficie actuelle est de 140 hectares, avec une
      profondeur moyenne d'environ un mètre. Entre l'étang et la mer s'étire la dune : le rivage reste intact
      sur 12 kilomètres, abritant la végétation pionnière caractéristique des plages de sable, tandis que
      juste derrière s'élève le tombolo couvert de maquis méditerranéen. Cette bande boisée stabilise les
      sables et abrite des embruns marins le reste du boisement méditerranéen sempervirent.


      La dune de Burano constitue un modèle d'écosystème dunaire d'une très haute naturalité, riche en
      genévriers Juniperus. Le couvert associe chênes verts et chênes-lièges, complétés d'arbustes comme le
      genévrier, le myrte, la salsepareille et l'asperge sauvage. Au total, la flore dépasse cinq cents
      espèces végétales.
    wildlife: >-
      Pour les ornithologues, Burano est un rendez-vous hivernal incontournable : l'oasis accueille plus de
      trois cents espèces d'oiseaux. Parmi les plus emblématiques figurent la foulque macroule, le fuligule
      milouin, le fuligule nyroca, le busard des roseaux et le râle d'eau. Les zones d'eau libre accueillent
      également le flamant rose, cormorans, hérons, canard colvert et canard souchet, emblème de l'oasis WWF ;
      dans les airs planent le martin-pêcheur et le balbuzard pêcheur. Parmi les nicheurs remarquables se
      trouvent le gravelot à collier interrompu et l'alouette calandrelle.


      La dune héberge également une riche faune terrestre. Y vivent la tortue d'Hermann et la couleuvre à
      quatre raies, ainsi que le sonneur à ventre jaune italien (Bombina pachypus), endémique de la péninsule.
      Porcs-épics, renards et sangliers la fréquentent : difficiles à apercevoir, leurs empreintes marquent le
      sable. Plus exceptionnel, le loup utilise la réserve comme corridor de déplacement, attiré par les
      proies que constituent ragondins et marcassins.
    visit: >-
      La découverte débute au centre d'accueil. Les visiteurs individuels ne peuvent accéder que dans le cadre
      de visites guidées sur réservation ; l'entrée de la réserve se situe à environ 2 km du centre,
      accessible de façon autonome en voiture, à moto ou à vélo. Le sentier nature, aménagé pour les personnes
      à mobilité réduite, chemine sur la dune et longe la lagune via sept postes d'observation : six
      observatoires couverts et une tour. Près du centre d'accueil, un parcours de 500 m mène à un jardin des
      papillons, et les repas ne sont autorisés que sur l'aire de pique-nique du centre.
    history: >-
      La réserve d'État a été instituée en 1980, mais le WWF avait fondé ici dès 1967 sa première oasis
      italienne. La réserve s'étend sur 410 hectares, auxquels s'ajoutent 600 hectares soustraits à la chasse
      par accord avec le propriétaire, et s'intègre à la zone humide d'importance internationale du « Lago di
      Burano » créée en 1977. Elle est également zone spéciale de conservation (IT51A0031), zone de protection
      spéciale (IT51A0033) et site Ramsar. Elle fait partie de la zone importante pour la conservation des
      oiseaux englobant l'Argentario et la lagune d'Orbetello.


      Les menaces sont bien identifiées : le tourisme estival balnéaire et les chiens divagants qui menacent
      les nicheurs au sol. Le WWF y répond par des panneaux d'information, des passerelles d'accès, des
      clôtures sur les cordons dunaires fragilisés et une navette électrique, et assure le nettoyage manuel de
      la plage sans engins mécaniques pour préserver les laisses de mer vitales aux invertébrés.
    before: >-
      Renseignez-vous et réservez avant de venir : la réserve est fermée lors des alertes météo jaune, orange
      ou rouge de la région Toscane, et peut fermer pour motifs techniques imprévus. En train sur la ligne
      Rome-Pise, descendez à la gare de Capalbio Scalo pour rejoindre le centre d'accueil à pied en quelques
      minutes.
    around: >-
      Aucun site voisin n'est publié dans l'atlas. Par son littoral, ses zones humides et ses boisements
      méditerranéens, elle s'apparente au [parc naturel de Mondragó](/lugar/parque-natural-de-mondrago/),
      partageant avec lui la tortue d'Hermann.
  de:
    intro: >-
      Ganz im Süden der Maremma von Grosseto, im Gemeindegebiet von Capalbio, liegt eine Lagune mit brackigem
      Wasser. Der Lago di Burano ist das Relikt eines alten Strandsees, getrennt vom Tyrrhenischen Meer durch
      einen sandigen Dünenstreifen – einen Tombolo –, der heute von Dünen und dichter Macchia überwuchert ist.
      Hier entstand 1967 die erste WWF-Oase Italiens, und seither erzählt das Reservat beispielhaft, wie
      Küstenlebensräume gerettet werden können.
    landscape: >-
      Der See ist in Wahrheit ein flacher Brackwasser-Küstensee. Seine Fläche beträgt gegenwärtig 140 Hektar
      bei einer durchschnittlichen Tiefe von etwa einem Meter. Zwischen Wasserfläche und Meer erstreckt sich
      die Düne: Die Küstenlinie ist über 12 Kilometer hinweg unverbaut geblieben und beherbergt typische
      Pioniergewächse des Sandstrands, während landeinwärts der Macchia-bewachsene Tombolo anschließt. Dieser
      Grüngürtel befestigt das Gelände und schützt die mediterranen Eichenwälder vor Meersalz und Seewind.


      Die Düne von Burano ist ein rares Beispiel für ein hochgradig naturnahes Küstendünensystem mit Beständen
      des Phönizischen Wacholders. Der Baumbestand setzt sich aus Stein- und Korkeichen zusammen, unter denen
      Wacholder, Myrte, Stechwinde und Wilder Spargel gedeihen. Insgesamt zählt die Flora mehr als fünfhundert
      Pflanzenarten.
    wildlife: >-
      Für Vogelbeobachter ist Burano ein herausragendes Winterziel: Mehr als dreihundert Vogelarten suchen die
      Oase auf. Zu den charakteristischsten Zählern gehören Blässhuhn, Tafelente, Moorente, Rohrweihe und
      Wasserralle. Unter den Wasservögeln finden sich zudem Rosaflamingos, Kormorane, Reiher, Stockenten und
      Löffelenten, das Wappentier der WWF-Oase; am Himmel rütteln Eisvogel und Fischadler. Bemerkenswerte
      Brutvögel der Küste sind Seeregenpfeifer und Kurzzehenlerche.


      Die Düne birgt zudem eine reiche Landfauna. Griechische Landschildkröte und Vierstreifennatter leben
      hier, ebenso die Gelbbauchunke (Bombina pachypus), ein Endemit der italienischen Halbinsel.
      Stachelschweine, Füchse und Wildschweine durchstreifen das Areal: Sie sind schwer zu erblicken, doch
      ihre Spuren zeichnen sich im Dünensand ab. Seltener noch streifen Wölfe durch das Schutzgebiet,
      angelockt von Beutetieren wie Biberratten und Jungschweinen.
    visit: >-
      Besuche nehmen am Besucherzentrum ihren Ausgang. Einzelreisende dürfen das Schutzgebiet ausschließlich
      im Rahmen geführter Touren nach Voranmeldung betreten; der eigentliche Reservatseingang liegt rund 2 km
      vom Zentrum entfernt und wird eigenständig per Pkw, Motorrad oder Fahrrad erreicht. Der auch für
      Rollstuhlfahrer ausgelegte Naturlehrpfad führt über die Düne und blickt über sieben Beobachtungspunkte
      auf den See: sechs überdachte Beobachtungshütten und ein Aussichtsturm. Am Besucherzentrum zweigt ein
      500 m langer Schmetterlingspfad ab; Mahlzeiten sind nur im Picknickbereich des Zentrums gestattet.
    history: >-
      Das staatliche Schutzgebiet wurde 1980 gegründet, nachdem der WWF Italien hier bereits 1967 seine erste
      Oase ins Leben gerufen hatte. Das Reservat umfasst rund 410 Hektar, ergänzt um weitere 600 Hektar, die
      per Pachtvertrag mit dem Eigentümer von der Jagd ausgenommen wurden, und liegt im 1977 deklarierten
      international bedeutenden Feuchtgebiet 'Lago di Burano'. Es ist zugleich Besonderes Erhaltungsgebiet
      (IT51A0031), Europäisches Vogelschutzgebiet (IT51A0033) und Ramsar-Gebiet. Zudem gehört es zum Important
      Bird Area von Argentario und Orbetello.


      Die Belastungen sind vertraut: sommerlicher Strandtourismus und unangeleinte Hunde, die Bodenbrüter
      gefährden. Der WWF begegnet dem mit Informationspaneelen, Bohlenwegen, Zäunen an erodierten Dünen und
      einem Shuttlebus; die Strandreinigung erfolgt schonend ohne Maschinen, um organisches Treibgut für
      Krebse und Käfer zu erhalten.
    before: >-
      Erkundige dich vorab und reserviere: An Tagen mit Unwetterwarnstufe Gelb, Orange oder Rot der Region
      Toskana bleibt das Reservat geschlossen, gelegentlich auch aus organisatorischen Gründen. Per Bahn auf
      der Strecke Rom-Pisa erreichst du den Bahnhof Capalbio Scalo und gehst in wenigen Minuten zu Fuß zum
      Besucherzentrum.
    around: >-
      Im Atlas sind keine direkten Nachbargebiete aufgeführt. In Küstenstruktur, Feuchtgebieten und
      mediterranen Gehölzen ähnelt das Gebiet dem [Naturpark Mondragó](/lugar/parque-natural-de-mondrago/),
      mit dem es die Griechische Landschildkröte teilt.
  it:
    intro: >-
      All'estremità meridionale della Maremma grossetana, nel territorio comunale di Capalbio, si distende una
      laguna di acque salmastre. Il lago di Burano è il relitto di un antico lago costiero, separato dal mar
      Tirreno da una striscia sabbiosa — un tombolo — oggi ammantata di dune e fitta macchia. Qui nel 1967
      prese vita la prima Oasi WWF d'Italia, e da allora la riserva testimonia la storia esemplare della
      difesa di un litorale.
    landscape: >-
      Il lago è a tutti gli effetti uno stagno costiero salmastro. Lo specchio d'acqua misura 140 ettari, con
      una profondità media di circa un metro. Tra il lago e il mare si sviluppa il cordone dunicolo: la costa
      si mantiene intatta lungo 12 chilometri, con la vegetazione pioniera tipica dell'arenile, alle cui
      spalle si eleva il tombolo coperto da macchia mediterranea. Questa fascia boscata consolida le sabbie e
      difende dai venti marini carichi di salsedine la lecceta retrostante.


      La duna di Burano costituisce un raro modello di ambiente dunicolo di straordinaria naturalità,
      ricchissimo di ginepri. La copertura forestale unisce lecci e querce da sughero, mentre tra gli arbusti
      allignano ginepro coccolone, mirto, salsapariglia e asparago pungente. Nel complesso la flora annovera
      più di cinquecento entità botaniche.
    wildlife: >-
      Per chi pratica birdwatching, Burano è una meta d'elezione invernale: l'oasi accoglie più di trecento
      specie di volatili. Tra i più caratteristici figurano folaga, moriglione, moretta tabaccata, falco di
      palude e porciglione. Sulle acque aperte compaiono fenicotteri, cormorani, aironi, germani reali e il
      mestolone, animale simbolo dell'Oasi WWF; in volo perlustrano lo specchio lacustre martin pescatore e
      falco pescatore. Tra i nidificanti di grande interesse si distinguono il fratino e il calandrello.


      La duna custodisce anche una ricca fauna terrestre. Vi abitano la testuggine comune e il cervone,
      assieme all'ululone appenninico (Bombina pachypus), endemismo dell'Italia peninsulare. Istrice, volpe e
      cinghiale battono la duna: difficili da scorgere di giorno, lasciano tracce inconfondibili sulla sabbia.
      Presenza ancor più straordinaria, il lupo sfrutta la riserva nei suoi spostamenti, richiamato dalla
      disponibilità di prede quali nutrie e giovani cinghiali.
    visit: >-
      La visita prende le mosse dal centro visite. I singoli visitatori possono accedere unicamente tramite
      visite guidate su prenotazione; l'ingresso della riserva dista circa 2 km dal centro, raggiungibile
      autonomamente con la propria auto, moto o bicicletta. Il sentiero natura, accessibile anche a persone
      con disabilità, costeggia la duna e si affaccia sullo stagno con sette punti di osservazione: sei
      capanni coperti e una torre di avvistamento. Presso il centro visite si sviluppa inoltre un breve
      sentiero di 500 m dedicato alle farfalle; il consumo di cibi è consentito unicamente nell'area picnic
      del centro.
    history: >-
      La riserva statale è stata formalmente istituita nel 1980, anche se fin dal 1967 il WWF vi aveva fondato
      la prima oasi italiana. L'area protetta copre 410 ettari, cui si aggiungono altri 600 ettari sottratti
      alla caccia grazie a una convenzione con la proprietà fondiaria, e ricade nella zona umida d'importanza
      internazionale «Lago di Burano» istituita nel 1977. È inoltre Zona Speciale di Conservazione
      (IT51A0031), Zona di Protezione Speciale (IT51A0033) e sito Ramsar. Rientra pure nell'Important Bird and
      Biodiversity Area che include il promontorio dell'Argentario e la laguna di Orbetello.


      Le minacce sono note: il turismo balneare estivo e i cani lasciati liberi, che mettono a repentaglio gli
      uccelli nidificanti a terra. Il WWF risponde con percorsi obbligati su passerelle, staccionate sulle
      dune erose, una navetta e pulizia manuale della spiaggia senza mezzi meccanici, salvaguardando il
      materiale spiaggiato vitale per coleotteri e fauna marina.
    before: >-
      Informati prima di partire ed effettua la prenotazione: la riserva resta chiusa nei giorni di allerta
      meteo gialla, arancione o rossa della Regione Toscana e può sospendere le visite per cause di forza
      maggiore. In treno, lungo la ferrovia Roma-Pisa, si scende alla stazione di Capalbio Scalo e si
      raggiunge a piedi il centro visite in pochi minuti.
    around: >-
      Non vi sono siti limitrofi descritti nell'atlante. Per il profilo costiero, l'ambiente palustre e le
      formazioni a macchia si avvicina al [Parco Naturale di Mondragó](/lugar/parque-natural-de-mondrago/),
      con cui condivide la testuggine comune.
  pt:
    intro: >-
      No extremo meridional da Maremma de Grosseto, no concelho de Capalbio, repousa uma laguna de águas
      salobras. O lago de Burano é o vestígio de um antigo lago litoral, separado do mar Tirreno por uma
      restinga arenosa — um tômbolo — hoje revestida de dunas e maquis mediterrânico. Aqui nasceu em 1967 o
      primeiro Oásis WWF de Itália, e desde então a reserva constitui um exemplo vivo de salvaguarda costeira.
    landscape: >-
      O lago é na verdade um esteiro costeiro de águas salobras. A sua extensão atual atinge 140 hectares, com
      uma profundidade média próxima de um metro. Entre o espelho de água e o mar ergue-se o cordão dunar: a
      linha costeira mantém-se virgem ao longo de 12 quilómetros, exibindo a vegetação pioneira das praias
      arenosas, logo ladeada pelo tômbolo coberto de maquis. Esta cortina vegetal fixa os areais e abriga dos
      ventos marítimos salgados o bosque mediterrânico perenifólio.


      A duna de Burano é um exemplo raro de ecossistema dunar de altíssima naturalidade, rico em zimbrais de
      Juniperus. O estrato arbóreo conjuga azinheiras e sobreiros, acompanhados por arbustos como o zimbro, a
      murta, a salsaparrilha e o espargo-bravo. Ao todo, a flora ultrapassa quinhentas espécies botânicas.
    wildlife: >-
      Para quem pratica observação de aves, Burano é uma paragem obrigatória no inverno: o oásis acolhe mais
      de trezentas espécies de aves. Entre as mais emblemáticas contam-se o galeirão-comum, o zarro-comum, o
      zarro-castanho, o tartaranhão-ruivo-dos-pauis e o frango-d'água. Nas águas abertas marcam presença
      flamingos, corvos-marinhos, garças, patos-reais e o pato-trombeteiro, símbolo do Oásis WWF; no ar
      patrulham o guarda-rios e a águia-pesqueira. Como nidificantes de grande interesse sobressaem o
      borrelho-de-coleira-interrompida e a calhandrinha-das-marismas.


      A duna abriga igualmente fauna terrestre de relevo. Ocorrem o cágado-mediterrânico e a
      cobra-de-quatro-riscas, a par do sapo-de-barriga-amarela-italiano (Bombina pachypus), endémico da
      Península Itálica. Porcos-espinhos, raposas e javalis vagueiam pelo areal: são raramente avistados, mas
      as suas pegadas ficam bem marcadas na areia. Ainda mais excecional, o lobo cruza a reserva nas suas
      deslocações amplas, atraído por presas como lontras e crias de javali.
    visit: >-
      A visita inicia-se no centro de acolhimento. Os visitantes individuais só podem entrar mediante visitas
      guiadas com marcação prévia; o portão da reserva fica a cerca de 2 km do centro, trajeto feito em
      viatura própria, moto ou bicicleta. O percurso de natureza, adaptado a pessoas com mobilidade reduzida,
      percorre a duna e abre-se para a laguna com sete postos de observação: seis abrigos cobertos e uma torre
      de vigia. Junto ao centro de acolhimento existe ainda um pequeno trilho de 500 m que conduz a um recanto
      de borboletas, sendo as refeições apenas autorizadas no parque de merendas do centro.
    history: >-
      A reserva estatal foi criada em 1980, embora a WWF já tivesse estabelecido no local em 1967 o primeiro
      oásis italiano. A reserva estende-se por 410 hectares, acrescidos de outros 600 hectares interditos à
      caça mediante acordo com o proprietário, integrando a zona húmida de importância internacional «Lago di
      Burano» formalizada em 1977. É também Zona Especial de Conservação (IT51A0031), Zona de Proteção
      Especial (IT51A0033) e sítio Ramsar. Integra ainda a Important Bird and Biodiversity Area que abarca o
      promontório de Argentario e a laguna de Orbetello.


      As pressões antrópicas são bem conhecidas: o turismo balnear no verão e os cães soltos, que ameaçam as
      aves que nidificam no chão. A WWF atua mediante painéis didáticos, passadiços de madeira nas dunas
      fragilizadas e um vaivém elétrico, limpando a praia à mão sem recurso a maquinaria para deixar intactos
      os detritos orgânicos costeiros essenciais aos invertebrados.
    before: >-
      Informa-te previamente e faz a tua reserva: o espaço encerra nos dias com aviso meteorológico amarelo,
      laranja ou vermelho emitido pela Região da Toscana, podendo fechar por motivos operacionais
      imprevisíveis. De comboio, na linha Roma-Pisa, sai na estação de Capalbio Scalo e caminha escassos
      minutos até ao centro de acolhimento.
    around: >-
      Não existem áreas vizinhas registadas no atlas. Pelos seus traços costeiros, zonas húmidas e matas
      mediterrânicas assemelha-se ao [Parque Natural de Mondragó](/lugar/parque-natural-de-mondrago/),
      partilhando com este o cágado-mediterrânico.
