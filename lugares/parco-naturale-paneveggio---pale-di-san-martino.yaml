resumen:
  es: >-
    El 'Bosque de los Violines' (abeto rojo de resonancia usado por Stradivarius) bajo las espectaculares
    agujas de dolomía de las Pale di San Martino.
  en: >-
    The 'Forest of the Violins' (resonance spruce harvested by Stradivarius) beneath the spectacular dolomitic
    spires of the Pale di San Martino.
  fr: >-
    La « forêt des violons » (épicéa de résonance utilisé par Stradivarius) dominée par les spectaculaires
    aiguilles dolomitiques des Pale di San Martino.
  de: >-
    Der 'Geigenwald' (Resonanzfichten für Geigenbauer wie Stradivari) unter den spektakulären Dolomitennadeln
    der Pale di San Martino.
  it: >-
    La 'Foresta dei Violini' (abete rosso di risonanza scelto da Stradivari) ai piedi delle spettacolari
    guglie dolomitiche delle Pale di San Martino.
  pt: >-
    A 'Floresta dos Violinos' (abeto-falso de ressonância escolhido por Stradivarius) sob as imponentes
    agulhas dolomíticas das Pale di San Martino.
unico:
  es: >-
    Aquí se pasea en una sola jornada del bosque donde nacieron las maderas de los violines a las rocas más
    antiguas de toda la sucesión dolomítica, y se ve vivir a los ciervos en la puerta del centro de
    visitantes.
  en: >-
    In a single day you can walk from the forest that provided the tonewood for celebrated violins to the
    oldest rock strata in the Dolomites, while observing red deer right by the visitor centre gate.
  fr: >-
    Ici, vous cheminez en une seule journée de la forêt qui a donné le bois des violons aux roches les plus
    anciennes de toute la séquence dolomitique, en observant les cerfs aux portes du centre des visiteurs.
  de: >-
    Hier wanderst du an einem einzigen Tag vom Wald des berühmten Geigenholzes zu den ältesten Schichten der
    Dolomitenfolge und beobachtest Hirsche direkt am Besucherzentrum.
  it: >-
    Qui puoi camminare in una sola giornata dalla foresta che ha fornito i legni per i violini più celebri
    alle rocce più antiche della sequenza dolomitica, osservando i cervi al cancello del centro visitatori.
  pt: >-
    Aqui podes caminhar num único dia da floresta que forneceu as madeiras dos violinos mais famosos aos
    estratos mais antigos de toda a sequência dolomítica, observando veados junto à porta do centro de
    acolhimento.
observaciones:
  es: >-
    Los acompañamientos guiados del parque se organizan durante las temporadas de verano e invierno, así que
    mira antes qué salidas hay. Con nieve o hielo, el Sentiero Marciò deja de estar libre de barreras.
texto:
  es:
    intro: >-
      Los violines más famosos del mundo salieron de un bosque. Los luthiers de antaño buscaban abetos de
      resonancia en Paneveggio, un mar de abeto rojo que hoy se conoce como el Bosque de los Violines, y
      todavía hoy es famoso por la madera «de resonancia» para instrumentos musicales. El Parque Natural
      Paneveggio - Pale di San Martino encierra ese bosque y, sobre él, las agujas de dolomía de las Pale di
      San Martino: del bosque oscuro a la roca clara, en el Trentino oriental, desde poco menos de 1.100 m
      hasta unos 3.200 m.
    landscape: >-
      El parque se reparte entre tres valles, el Primiero, el Val di Fiemme y el Val di Fassa, y se organiza
      alrededor de las cuencas de los torrentes Cismon, Vanoi y Travignolo. Al este están las Pale di San
      Martino, un grupo dolomítico; al oeste, las estribaciones de la cadena del Lagorai, que es un macizo de
      pórfidos cuarcíferos con paredes empinadas, crestas afiladas y pedregales. Dos mundos de roca distintos,
      y por eso dos tipos de paisaje y de vegetación.


      La roca cuenta la historia. Aquí afloran las rocas más antiguas de toda la sucesión dolomítica. La
      formación Bellerophon guarda calizas oscuras con abundantes fósiles, entre ellos el gasterópodo que le
      da nombre. Y la Dolomía del Sciliar, clara y maciza, se depositó hace unos 200 millones de años con casi
      mil metros de espesor: es la roca del Cimon della Pala y de las Pale di San Martino. Para ver cómo se
      lee ese paisaje, el circuito geológico Valles–Venegia ayuda a interpretar las rocas sedimentarias y los
      depósitos morrénicos de la zona.


      El bosque sube por pisos. Entre los 1.500 y los 1.900 m el abeto rojo ocupa el 85 % del bosque, y allí
      está el bosque estatal de Paneveggio, de más de 2.700 hectáreas. Más arriba, hasta unos 2.200 m, abundan
      el alerce y el pino cembro. Más alto aún, las praderas, y entre ellas especies que solo existen en las
      Dolomitas: Campanula morettiana, Primula tyrolensis, Saxifraga facchini y Rhizobotrya alpina, endémica
      no solo como especie sino como género, un caso único en la flora de las Dolomitas. Los líquenes son otra
      riqueza: se conocen unas 650 especies y se cree que puede haber al menos un millar.
    wildlife: >-
      El [ciervo](/especie/cervus_elaphus/) es el símbolo del parque, y su historia empieza con un descuido:
      los pocos ejemplares que salieron por casualidad del recinto de Paneveggio en 1963 repoblaron el
      territorio. Hoy, junto al centro de visitantes, otro recinto permite verlos desde cerca. El
      [corzo](/especie/capreolus_capreolus/) está repartido por todo el parque, el
      [rebeco](/especie/rupicapra_rupicapra/) vive más arriba, y en 2000 empezó un proyecto de repoblación de
      [cabra montés](/especie/capra_ibex/) en las Pale di San Martino, con la suelta de treinta ejemplares.


      En las praderas alpinas vive la [marmota](/especie/marmota_marmota/), que cava madrigueras extensas; en
      las colonias hay un centinela que avisa con un silbido distinto según el peligro venga del cielo o de la
      tierra. Por encima de los 1.300 m vive la liebre variable, y entre los mustélidos están la garduña y la
      [marta](/especie/martes_martes/), esta más forestal.


      Para las aves, hay más de 80 especies en época de cría. Destacan el
      [urogallo](/especie/tetrao_urogallus/), el mayor de los galliformes italianos, y el [gallo
      lira](/especie/tetrao_tetrix/); la perdiz nival vive más alto, y la grévol es el tetraónido forestal por
      excelencia. El [búho real](/especie/bubo_bubo/) y el [águila real](/especie/aquila_chrysaetos/) son los
      únicos superpredadores alados. Hay cinco especies de estrígidos, entre ellos el mochuelo boreal y el
      mochuelo chico, y entre los pícidos el raro [pico tridáctilo](/especie/picoides_tridactylus/) y el [pito
      negro](/especie/dryocopus_martius/). Y en los prados cría el guion de codornices, que da tímidas señales
      de recuperación tras su caída por la mecanización de la siega.


      Del agua llegan las sorpresas pequeñas. La salamandra alpina, antes tenida por rara, se encuentra con
      relativa facilidad en los pedregales y bosques de altura; en los lagos alpinos vive el tritón alpino, de
      librea azulada y vientre naranja en época de celo. Los ríos tienen trucha marmorata y [trucha
      común](/especie/salmo_trutta/), y los lagos de altura salvelino alpino. En el laghetto Welsperg, en Val
      Canali, se mantiene el cangrejo de río, ya raro, gracias a una intervención de recuperación.
    visit: >-
      El parque tiene tres centros de visitantes, y cada uno es una puerta. El Centro Terra Foresta de
      Paneveggio, en la carretera de Predazzo al Passo Rolle, es la entrada desde el Val di Fiemme: cuenta la
      historia del Bosque de los Violines y de los animales del bosque, con un recinto junto al centro donde
      se observan ciervos. De él parte el Sentiero Marciò, un circuito interpretativo con puntos de
      observación, que se puede recorrer todo el año, es poco exigente, no tiene barreras salvo cuando hay
      nieve o hielo, y cruza un puente cubierto sobre el Travignolo y otro suspendido sobre la garganta, donde
      el torrente forma rápidos y cascadas. En verano y en invierno se organizan salidas con acompañamiento.


      Villa Welsperg, en Val Canali, de 1853, es la entrada desde el Primiero y la sede del parque; allí está
      el centro de visitantes sobre las áreas protegidas, el territorio del parque y la vida acuática alpina,
      y alrededor discurre el «Percorso delle muse Fedaie», un itinerario llano y accesible para todos sobre
      la biodiversidad. El centro de San Martino di Castrozza trata del ambiente de alta montaña, la geología
      de las Dolomitas y el águila.


      Para andar más, el Sentiero Etnografico del Vanoi une Caoria, a 845 m, y malga Vesnòta de sora, a 1.879
      m, por cuatro itinerarios temáticos. La ruta ciclopeatonal Caoria-Paneveggio suma casi 36,5 kilómetros
      por caminos forestales y senderos existentes, y la carretera estatal SS 50 conecta el centro de
      Paneveggio con Predazzo y el Passo Rolle. El parque organiza también excursiones a pie y con raquetas de
      nieve y talleres ambientales.
    history: >-
      El parque se creó en 1967 con 15.704 hectáreas; en 1987 se le añadieron 4.007 y hoy suma 19.726,09. Está
      dividido en zonas: la reserva integral, la de mayor protección, ocupa el 39,82 % y solo admite
      investigación, senderos señalizados y pastoreo limitado. Las Pale di San Martino forman parte de las
      Dolomitas Patrimonio de la Humanidad, reconocidas el 26 de junio de 2009 en Sevilla.


      La historia humana también está en el bosque: en Paneveggio hay dos fuertes austrohúngaros de la Primera
      Guerra Mundial, el Forte Buso y el Forte Dossaccio. Y el bosque tiene cicatrices recientes: a finales de
      octubre de 2018 la tormenta Vaia derribó o rompió árboles en más de 650 hectáreas del parque.
    before: >-
      Los acompañamientos guiados del parque se organizan durante las temporadas de verano e invierno, así que
      mira antes qué salidas hay. Con nieve o hielo, el Sentiero Marciò deja de estar libre de barreras.
    around: >-
      El [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) está a
      unos cinco kilómetros, y la [Val Canzoi (Dolomiti Bellunesi Wilderness Sector)](/lugar/val-canzoi/) a
      doce. A veintitrés kilómetros queda el [Parco Naturale Puez-Odle / Naturpark
      Puez-Geisler](/lugar/parco-naturale-puez-odle/), y a veintisiete el [Parco Naturale Fanes-Sennes-Braies
      / Naturpark Fanes-Sennes-Prags](/lugar/parco-naturale-fanes-sennes-braies/).
  en:
    intro: >-
      The world's most famous violins were born in an Alpine forest. Historic master luthiers sought out
      resonance spruce in Paneveggio, an ocean of Norway spruce known today as the Forest of the Violins,
      celebrated for furnishing tonewood for stringed musical instruments. The Paneveggio - Pale di San
      Martino Natural Park protects this legendary forest and, soaring above it, the jagged dolomitic towers
      of the Pale di San Martino: passing from deep forest green to pale gleaming rock in eastern Trentino,
      rising from just under 1,100 m to roughly 3,200 m.
    landscape: >-
      The park spans three valleys—Primiero, Val di Fiemme, and Val di Fassa—organized around the watersheds
      of the Cismon, Vanoi, and Travignolo torrents. To the east rise the Pale di San Martino, an immense
      dolomitic massif; to the west lie the rugged porphyry crests of the Lagorai chain, characterized by dark
      volcanic walls, sharp arêtes, and extensive blockfields. Two contrasting geological realms shaping two
      distinct landscapes and plant worlds.


      Rock strata tell the story: here outcroppings display the oldest rocks in the entire dolomitic sequence.
      The Bellerophon formation holds dark fossiliferous limestones, including the eponymous marine gastropod.
      Above it, the massive, pale Sciliar Dolomite settled some 200 million years ago, accumulating nearly a
      thousand metres in thickness to form the sheer ramparts of Cimon della Pala and the Pale di San Martino.
      The Valles–Venegia geological trail helps visitors interpret local sedimentary strata and glacial
      moraines.


      Forest belts reflect altitude. Between 1,500 and 1,900 m, Norway spruce comprises 85 % of the canopy,
      forming the historic state forest of Paneveggio spanning over 2,700 hectares. Higher up to about 2,200
      m, European larch and Swiss stone pine dominate. Above the tree line thrive alpine pastures sheltering
      endemics confined to the Dolomites, such as Campanula morettiana, Primula tyrolensis, Saxifraga
      facchini, and Rhizobotrya alpina—endemic not merely at species level but as an entire genus. Lichens
      represent another treasure: some 650 species are known, with estimates suggesting at least a thousand.
    wildlife: >-
      The [red deer](/especie/cervus_elaphus/) is the emblem of the park; its modern presence stems from an
      accidental release: a few individuals escaped from a fenced enclosure in Paneveggio in 1963,
      successfully recolonizing the valley. Today, a dedicated enclosure beside the visitor centre allows
      close observation. The [roe deer](/especie/capreolus_capreolus/) is distributed throughout lower
      woodlands, the [chamois](/especie/rupicapra_rupicapra/) populates high crags, and in 2000 a
      reintroduction programme re-established the [alpine ibex](/especie/capra_ibex/) on the Pale di San
      Martino with the release of thirty individuals.


      High alpine meadows shelter the [alpine marmot](/especie/marmota_marmota/), which excavates extensive
      burrow networks; colonial sentinels sound differentiated whistles depending on whether danger approaches
      from the skies or on land. Above 1,300 m live mountain hares, alongside stone martens and the more
      forest-dependent European [pine marten](/especie/martes_martes/).


      Avian life numbers over 80 breeding species. Outstanding galliformes include the [western
      capercaillie](/especie/tetrao_urogallus/)—the largest Italian grouse—and the [black
      grouse](/especie/tetrao_tetrix/); rock ptarmigan dwell in the high tundra and hazel grouse in mixed
      woods. The [Eurasian eagle-owl](/especie/bubo_bubo/) and [golden eagle](/especie/aquila_chrysaetos/)
      rule the skies as apex predators. Five owl species occur here, while woodpeckers feature the rare
      [three-toed woodpecker](/especie/picoides_tridactylus/) and the [black
      woodpecker](/especie/dryocopus_martius/). In hay meadows breeds the corncrake, showing early signs of
      recovery.


      Cold streams and tarns yield unexpected species: alpine salamanders are found across high screes, while
      alpine newts inhabit glacial pools. Streams host marble trout and [brown trout](/especie/salmo_trutta/),
      with Arctic char in high tarns. At Laghetto Welsperg in Val Canali, native white-clawed crayfish thrive
      thanks to active conservation.
    visit: >-
      The park has three visitor centres, each serving as a gateway. The Centro Terra Foresta in Paneveggio,
      on the road from Predazzo to Passo Rolle, is the entrance from Val di Fiemme: it tells the story of the
      Forest of the Violins and woodland animals, with an enclosure beside the centre where deer can be
      observed. From it departs the Sentiero Marciò, an interpretive loop with observation points that can be
      walked year-round, is undemanding, barrier-free except when there is snow or ice, and crosses a covered
      wooden bridge over the Travignolo and a suspension bridge over the gorge, where the torrent forms rapids
      and waterfalls. In summer and winter, accompanied outings are organized.


      Villa Welsperg in Val Canali, dating from 1853, is the entrance from Primiero and the park headquarters;
      here is the visitor centre dedicated to protected areas, the park territory, and alpine aquatic life,
      surrounded by the «Percorso delle muse Fedaie», a flat and barrier-free loop for all exploring
      biodiversity. The San Martino di Castrozza centre focuses on the high-mountain environment, the geology
      of the Dolomites, and the golden eagle.


      For longer walks, the Sentiero Etnografico del Vanoi links Caoria, at 845 m, and malga Vesnòta de sora,
      at 1,879 m, along four themed itineraries. The Caoria-Paneveggio cycle-pedestrian route covers almost
      36.5 kilometres along existing forest roads and trails, and the SS 50 state highway connects the
      Paneveggio centre with Predazzo and Passo Rolle. The park also organizes walking and snowshoe excursions
      and environmental workshops.
    history: >-
      The park was created in 1967 encompassing 15,704 hectares, expanded in 1987 by 4,007 hectares to its
      present extent of 19,726.09 hectares. It is structured into management zones: the integral wilderness
      reserve, subject to strict protection, covers 39.82 % where only scientific research and limited
      traditional grazing are permitted. The Pale di San Martino were inscribed as part of the UNESCO
      Dolomites World Heritage Site on 26 June 2009 in Seville.


      Human history marks the landscape: two Austro-Hungarian forts from World War I stand at Forte Buso and
      Forte Dossaccio. In late October 2018, Storm Vaia devastated woodland across more than 650 hectares of
      the park.
    before: >-
      Guided walks and ranger outings are scheduled throughout the summer and winter seasons; verify programme
      details in advance. In snowy or icy conditions, the Sentiero Marciò is no longer barrier-free.
    around: >-
      The [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) lies
      about five kilometres away, and [Val Canzoi (Dolomiti Bellunesi Wilderness Sector)](/lugar/val-canzoi/)
      twelve kilometres away. Twenty-three kilometres away sits [Parco Naturale Puez-Odle / Naturpark
      Puez-Geisler](/lugar/parco-naturale-puez-odle/), and twenty-seven kilometres away [Parco Naturale
      Fanes-Sennes-Braies / Naturpark Fanes-Sennes-Prags](/lugar/parco-naturale-fanes-sennes-braies/).
  fr:
    intro: >-
      Les violons les plus réputés du monde sont nés dans une forêt alpine. Les luthiers d'antan cherchaient
      leurs épicéas de résonance à Paneveggio, un océan de conifères aujourd'hui célébré sous le nom de Forêt
      des Violons pour son bois d'harmonie exceptionnel. Le parc naturel de Paneveggio - Pale di San Martino
      préserve ce massif forestier et, au-dessus de lui, les aiguilles dolomitiques des Pale di San Martino :
      du manteau sombre des bois au blanc étincelant des cimes, dans le Trentin oriental, depuis un peu moins
      de 1 100 m jusqu'à environ 3 200 m.
    landscape: >-
      Le territoire se partage entre trois vallées — Primiero, Val di Fiemme et Val di Fassa — agencées autour
      des bassins des torrents Cismon, Vanoi et Travignolo. À l'est s'élèvent les Pale di San Martino, massif
      dolomitique par excellence ; à l'ouest se dressent les contreforts du Lagorai, chaîne de porphyres
      quartzifères aux parois abruptes et vastes pierriers. Deux mondes géologiques dissemblables forgeant
      deux paysages et végétations distincts.


      La roche narre les ères passées : affleurent ici les strates les plus anciennes de la succession
      dolomitique. La formation de Bellerophon renferme des calcaires sombres très fossilifères, dont le
      gastéropode éponyme. Au-dessus, la dolomie du Sciliar s'est déposée voici environ 200 millions d'années
      sur près de mille mètres d'épaisseur, sculptant le Cimon della Pala et les Pale di San Martino. Le
      sentier géologique Valles–Venegia permet de décrypter roches sédimentaires et moraines glaciaires.


      La forêt s'étage avec régularité. Entre 1 500 et 1 900 m, l'épicéa commun compose 85 % du boisement,
      formant la forêt domaniale de Paneveggio sur plus de 2 700 hectares. Plus haut, jusqu'à 2 200 m,
      dominent mélèze et pin cembro. Au-delà s'étendent les pelouses alpines abritant des endémiques
      exclusives des Dolomites : Campanula morettiana, Primula tyrolensis, Saxifraga facchini et Rhizobotrya
      alpina, endémique à l'échelle du genre tout entier. Les lichens comptent environ 650 espèces
      répertoriées, les spécialistes estimant leur diversité à au moins un millier.
    wildlife: >-
      Le [cerf élaphe](/especie/cervus_elaphus/) est l'emblème du parc ; son retour débuta par une échappée
      fortuite : quelques spécimens s'évadèrent d'un enclos de Paneveggio en 1963, recolonisant le territoire.
      Aujourd'hui, un enclos pédagogique contigu au centre d'accueil permet de les observer de près. Le
      [chevreuil](/especie/capreolus_capreolus/) peuple les lisières, le
      [chamois](/especie/rupicapra_rupicapra/) les crêtes, et en 2000 un projet de réintroduction a réimplanté
      le [bouquetin des Alpes](/especie/capra_ibex/) sur les Pale di San Martino avec le lâcher de trente
      individus.


      Les alpages hébergent la [marmotte des Alpes](/especie/marmota_marmota/), qui creuse de vastes terriers
      et dont les sentinelles modulent leurs sifflements selon que le péril surgit du ciel ou du sol. Au-delà
      de 1 300 m vit le lièvre variable, côtoyant la fouine et la [martre des pins](/especie/martes_martes/),
      cette dernière inféodée aux grands boisements.


      Pour les oiseaux, plus de 80 espèces se reproduisent ici. On remarque le [grand
      tétras](/especie/tetrao_urogallus/), le plus imposant des galliformes italiens, et le [tétras
      lyre](/especie/tetrao_tetrix/) ; la perdrix des neiges habite les crêtes pierreuses et la gélinotte des
      bois représente le tétras forestier emblématique. Le [hibou grand-duc](/especie/bubo_bubo/) et l'[aigle
      royal](/especie/aquila_chrysaetos/) sont les seuls grands prédateurs ailés. Cinq espèces de rapaces
      nocturnes cohabitent, dont la chouette de Tengmalm et la chevêchette d'Europe, accompagnées de picidés
      rares comme le [pic tridactyle](/especie/picoides_tridactylus/) et le [pic
      noir](/especie/dryocopus_martius/). Le râle des genêts niche dans les prairies de fauche, manifestant de
      discrets signes de reprise après son déclin dû aux fauches mécanisées.


      Des eaux montagnardes viennent les surprises discrètes. La salamandre noire se rencontre aisément dans
      les éboulis humides ; dans les lacs d'altitude vit le triton alpestre, paré de bleu et d'orange durant
      les amours. Les rivières abritent la truite marbrée et la [truite fario](/especie/salmo_trutta/), et les
      plans d'eau froids l'omble chevalier. Au lac Welsperg, en Val Canali, l'écrevisse à pattes blanches se
      maintient grâce à un programme de préservation.
    visit: >-
      Le parc compte trois centres de visiteurs, et chacun constitue une porte d'entrée. Le Centre Terra
      Foresta de Paneveggio, sur la route reliant Predazzo au col Rolle, est l'accès depuis le Val di Fiemme :
      il raconte l'histoire de la Forêt des Violons et de la faune des bois, avec un enclos attenant au centre
      où l'on observe des cerfs. De là part le sentier Marciò, un circuit d'interprétation jalonné de postes
      d'observation, praticable toute l'année, peu exigeant, sans barrières architecturales sauf en présence
      de neige ou de verglas, qui franchit un pont couvert sur le Travignolo ainsi qu'une passerelle suspendue
      au-dessus de la gorge où le torrent forme des rapides et des cascades. En été comme en hiver, des
      sorties accompagnées sont organisées.


      La Villa Welsperg, en Val Canali, datant de 1853, est la porte d'entrée depuis le Primiero et le siège
      du parc ; elle abrite le centre de visiteurs dédié aux espaces protégés, au territoire du parc et à la
      vie aquatique alpine, et autour se développe le « Percorso delle muse Fedaie », un itinéraire plat et
      accessible à tous sur la biodiversité. Le centre de San Martino di Castrozza est quant à lui consacré à
      l'environnement de haute montagne, à la géologie des Dolomites et à l'aigle royal.


      Pour randonner davantage, le sentier ethnographique du Vanoi relie Caoria, à 845 m, et la malga Vesnòta
      de sora, à 1 879 m, au fil de quatre itinéraires thématiques. La piste cyclo-piétonne Caoria-Paneveggio
      totalise près de 36,5 kilomètres sur des pistes forestières et des sentiers existants, et la route
      nationale SS 50 relie le centre de Paneveggio à Predazzo et au col Rolle. Le parc organise également des
      excursions à pied et en raquettes ainsi que des ateliers environnementaux.
    history: >-
      Le parc vit le jour en 1967 avec 15 704 hectares, agrandi en 1987 de 4 007 hectares pour atteindre 19
      726,09 hectares. Il s'organise en zones de gestion : la réserve intégrale couvre 39,82 % de la surface,
      réservée à la recherche et au pastoralisme contrôlé. Les Pale di San Martino ont été inscrites au
      Patrimoine mondial de l'UNESCO le 26 juin 2009 à Séville.


      Le patrimoine militaire compte deux forts austro-hongrois de la Première Guerre mondiale : Forte Buso et
      Forte Dossaccio. Fin octobre 2018, la tempête Vaia a abattu des peuplements sur plus de 650 hectares du
      parc.
    before: >-
      Des sorties guidées avec les agents du parc sont programmées durant les saisons d'été et d'hiver ;
      consultez le calendrier officiel avant vos sorties. Par temps de neige ou de verglas, le sentier Marciò
      perd son caractère accessible.
    around: >-
      Le [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) se situe
      à environ cinq kilomètres et le secteur [Val Canzoi (Dolomiti Bellunesi Wilderness
      Sector)](/lugar/val-canzoi/) à douze kilomètres. À vingt-trois kilomètres s'étend le [Parco Naturale
      Puez-Odle / Naturpark Puez-Geisler](/lugar/parco-naturale-puez-odle/) et à vingt-sept kilomètres le
      [Parco Naturale Fanes-Sennes-Braies / Naturpark
      Fanes-Sennes-Prags](/lugar/parco-naturale-fanes-sennes-braies/).
  de:
    intro: >-
      Die berühmtesten Geigen der Musikgeschichte entstammen einem Bergwald: Historische Geigenbauer suchten
      in Paneveggio nach Resonanzholz, einem weiten Fichtenurwald, der heute als Geigenwald bekannt ist und
      noch immer erstklassiges Klangholz für Instrumentenbauer liefert. Der Naturpark Paneveggio - Pale di San
      Martino schützt diesen Nadelwald und darüber die hellen Dolomitenzacken der Pale di San Martino: vom
      schattigen Bergwald zum lichten Fels im östlichen Trentino von knapp unter 1.100 m bis rund 3.200 m.
    landscape: >-
      Das Schutzgebiet verteilt sich auf drei Täler — Primiero, Val di Fiemme und Val di Fassa — rund um die
      Wildbäche Cismon, Vanoi und Travignolo. Im Osten ragen die Pale di San Martino empor; im Westen ziehen
      sich die Ausläufer der Lagorai-Kette, ein Quarzporphyrmassiv mit steilen Wänden und Schutthalden. Zwei
      verschiedene Gesteinswelten, die zwei Landschafts- und Vegetationstypen prägen.


      Das Gestein erzählt Erdgeschichte: Hier treten die ältesten Schichten der Dolomitenfolge zutage. Die
      Bellerophon-Formation birgt dunkle Kalke mit fossilen Schnecken. Darüber lagerte sich vor rund 200
      Millionen Jahren der helle Sciliardolomit mit fast tausend Metern Mächtigkeit ab — das Baumaterial des
      Cimon della Pala. Der Geologielehrpfad Valles–Venegia erschließt diese Sedimentgesteine und Moränen.


      Der Wald staffelt sich nach Höhenstufen: Zwischen 1.500 und 1.900 m stellt die Fichte 85 % des
      Baumbestands im über 2.700 Hektar großen Staatswald von Paneveggio. Weiter oben bis etwa 2.200 m
      dominieren Lärche und Zirbelkiefer. Darüber gedeihen alpine Matten mit Dolomiten-Endemiten wie Campanula
      morettiana, Primula tyrolensis, Saxifraga facchini und Rhizobotrya alpina, die sogar als Gattung
      endemisch ist. Rund 650 Flechtenarten sind belegt, Experten vermuten mindestens ein Tausend.
    wildlife: >-
      Der [Rothirsch](/especie/cervus_elaphus/) ist das Wappentier des Parks, und seine Geschichte begann mit
      einem Versehen: Die wenigen Tiere, die 1963 zufällig aus dem Gehege von Paneveggio entwichen,
      besiedelten das Tal erfolgreich wieder. Heute ermöglicht ein weiteres Gehege direkt am Besucherzentrum,
      sie aus nächster Nähe zu beobachten. Das [Reh](/especie/capreolus_capreolus/) ist über das gesamte
      Parkgebiet verbreitet, die [Gämse](/especie/rupicapra_rupicapra/) lebt in höheren Lagen, und im Jahr
      2000 begann auf den Pale di San Martino ein Projekt zur Wiederansiedlung des
      [Alpensteinbocks](/especie/capra_ibex/) mit der Freilassung von dreißig Tieren.


      Auf den alpinen Matten lebt das [Alpenmurmeltier](/especie/marmota_marmota/), das ausgedehnte Bausysteme
      anlegt; in den Kolonien hält ein Wächter Ausschau und warnt mit unterschiedlichen Pfiffen, je nachdem,
      ob die Gefahr aus der Luft oder vom Boden droht. Oberhalb von 1.300 m lebt der Schneehase, und unter den
      Mardern finden sich Steinmarder sowie die stärker waldgebundene [Baummarder](/especie/martes_martes/).


      Unter den Vögeln brüten hier zur Fortpflanzungszeit über 80 Arten. Hervorzuheben sind das
      [Auerhuhn](/especie/tetrao_urogallus/), der größte Hühnervogel Italiens, und das
      [Birkhuhn](/especie/tetrao_tetrix/); das Alpenschneehuhn lebt noch weiter oben, während das Haselhuhn
      der Waldhühnervogel par excellence ist. Der [Uhu](/especie/bubo_bubo/) und der
      [Steinadler](/especie/aquila_chrysaetos/) sind die einzigen gefiederten Spitzenprädatoren. Fünf
      Eulenarten kommen vor, darunter Raufußkauz und Sperlingskauz, und unter den Spechten der seltene
      [Dreizehenspecht](/especie/picoides_tridactylus/) sowie der
      [Schwarzspecht](/especie/dryocopus_martius/). Auf den Mähwiesen brütet der Wachtelkönig, der nach
      Einbrüchen durch die mechanisierte Mahd erste zaghafte Zeichen der Erholung zeigt.


      Aus den Gewässern kommen die kleinen Überraschungen. Der Alpensalamander, einst als selten erachtet,
      lässt sich in Blockhalden und Bergwäldern verhältnismäßig leicht entdecken; in den Hochgebirgsseen lebt
      der Alpentriton mit bläulichem Rücken und orangefarbenem Bauch zur Paarungszeit. Die Fließgewässer
      beherbergen Marmorierte Forelle und [Bachforelle](/especie/salmo_trutta/), die Hochseen den Seesaibling.
      Im Laghetto Welsperg im Val Canali hält sich dank eines Schutzprojekts der seltene einheimische
      Dohlenkrebs.
    visit: >-
      Der Park verfügt über drei Besucherzentren, von denen jedes als Portal dient. Das Zentrum Terra Foresta
      in Paneveggio an der Straße von Predazzo zum Passo Rolle ist der Zugang aus dem Val di Fiemme: Es
      erzählt die Geschichte des Geigenwaldes und der Tiere des Waldes, mit einem Schaugehege am Zentrum, in
      dem Hirsche beobachtet werden können. Hier beginnt der Sentiero Marciò, ein Lehrpfad mit
      Aussichtspunkten, der das ganze Jahr über begehbar ist, geringe Anforderungen stellt, außer bei Schnee
      oder Eis barrierefrei ist und eine überdachte Holzbrücke über den Travignolo sowie eine Hängebrücke über
      die Schlucht quert, wo der Wildbach Stromschnellen und Wasserfälle bildet. Im Sommer und im Winter
      werden geführte Touren veranstaltet.


      Die Villa Welsperg im Val Canali aus dem Jahr 1853 ist der Zugang aus dem Primiero und Sitz der
      Parkverwaltung; dort befindet sich das Besucherzentrum über Schutzgebiete, den Parkraum und das alpine
      Wasserleben, umgeben vom «Percorso delle muse Fedaie», einem ebenen, für alle zugänglichen Rundweg zur
      Biodiversität. Das Zentrum in San Martino di Castrozza widmet sich der Hochgebirgswelt, der Geologie der
      Dolomiten und dem Steinadler.


      Für ausgedehntere Wanderungen verbindet der Sentiero Etnografico del Vanoi Caoria auf 845 m mit der
      Malga Vesnòta de sora auf 1.879 m über vier Themenwege. Die Rad- und Fußgängerroute Caoria–Paneveggio
      erstreckt sich über fast 36,5 Kilometer auf Forst- und Wanderwegen, während die Staatsstraße SS 50 das
      Zentrum Paneveggio mit Predazzo und dem Passo Rolle verbindet. Zudem veranstaltet der Park Wanderungen
      zu Fuß und mit Schneeschuhen sowie Umweltworkshops.
    history: >-
      Der Park entstand 1967 mit 15.704 Hektar, wurde 1987 um 4.007 Hektar erweitert und umfasst heute
      19.726,09 Hektar. Die Kernzone beansprucht 39,82 % der Fläche. Die Pale di San Martino wurden am 26.
      Juni 2009 in Sevilla als UNESCO-Weltnaturerbe anerkannt.


      Historische Festungsbauten des Ersten Weltkriegs überdauern im Forte Buso und Forte Dossaccio. Ende
      Oktober 2018 warf der Sturm Vaia Waldbestände auf über 650 Hektar Parkfläche.
    before: >-
      Geführte Touren finden im Sommer und Winter statt; informiere dich vorab über Termine. Bei Schnee oder
      Eis ist der Sentiero Marciò nicht barrierefrei zugänglich.
    around: >-
      Der [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) liegt
      etwa fünf Kilometer entfernt und das Wildnisgebiet [Val Canzoi (Dolomiti Bellunesi Wilderness
      Sector)](/lugar/val-canzoi/) zwölf Kilometer. In dreiundzwanzig Kilometern Entfernung liegt der [Parco
      Naturale Puez-Odle / Naturpark Puez-Geisler](/lugar/parco-naturale-puez-odle/) und in siebenundzwanzig
      Kilometern der [Parco Naturale Fanes-Sennes-Braies / Naturpark
      Fanes-Sennes-Prags](/lugar/parco-naturale-fanes-sennes-braies/).
  it:
    intro: >-
      I violini più famosi del mondo sono nati in una foresta alpina. I liutai del passato cercavano gli abeti
      di risonanza a Paneveggio, un mare di abeti rossi noto oggi come la Foresta dei Violini, ancora celebre
      per il legname armonico destinato agli strumenti a corda. Il Parco Naturale Paneveggio - Pale di San
      Martino tutela questo patrimonio silvano e, sopra di esso, le guglie dolomitiche delle Pale di San
      Martino: dal bosco ombroso alla roccia chiara, nel Trentino orientale, da poco meno di 1.100 m fino a
      circa 3.200 m.
    landscape: >-
      Il territorio si articola su tre vallate — Primiero, Val di Fiemme e Val di Fassa — imperniate sui
      bacini dei torrenti Cismon, Vanoi e Travignolo. A oriente svettano le Pale di San Martino, massiccio
      dolomitico di rara imponenza; a occidente si allungano i contrafforti della catena del Lagorai,
      massiccio di porfidi quarziferi dalle creste affilate e pietraie scoscese. Due universi geologici
      distinti che forgiano paesaggi e vegetazioni differenti.


      La roccia illustra la cronologia geologica: qui affiorano gli strati più remoti della successione
      dolomitica. La formazione a Bellerophon racchiude calcari scuri ricchi di fossili marini. Al di sopra,
      la Dolomia dello Sciliar si depositò circa 200 milioni di anni fa raggiungendo quasi mille metri di
      spessore, formando il Cimon della Pala e le Pale di San Martino. Il sentiero geologico Valles–Venegia
      consente di decifrare rocce sedimentarie e depositi morenici.


      La foresta sale a fasce: tra 1.500 e 1.900 m l'abete rosso compone l'85 % della compagine arborea nella
      foresta demaniale di Paneveggio, estesa su oltre 2.700 ettari. Più in alto, fino a circa 2.200 m,
      prevalgono larice e pino cembro. Oltre vegetano le praterie alpine ricche di endemismi dolomitici
      esclusivi: Campanula morettiana, Primula tyrolensis, Saxifraga facchini e Rhizobotrya alpina, endemismo
      non solo specifico ma di genere. I licheni annoverano circa 650 specie note, stimate in almeno un
      migliaio.
    wildlife: >-
      Il [cervo](/especie/cervus_elaphus/) è il simbolo del parco; la sua presenza moderna discende da una
      fuga accidentale: alcuni capi scappati da un recinto a Paneveggio nel 1963 ripopolarono la valle. Oggi
      un'area faunistica attigua al centro visite consente di ammirarli da vicino. Il
      [capriolo](/especie/capreolus_capreolus/) abita i boschi, il [camoscio
      alpino](/especie/rupicapra_rupicapra/) le balze superiori, e nel 2000 prese avvio la reintroduzione
      dello [stambecco](/especie/capra_ibex/) sulle Pale con il rilascio di trenta individui.


      Nelle praterie d'alta quota vive la [marmotta](/especie/marmota_marmota/), le cui sentinelle modulano
      fischi distinti a seconda del pericolo. Oltre i 1.300 m vive la lepre variabile, assieme a faina e
      [martora](/especie/martes_martes/).


      Tra gli uccelli si contano oltre 80 specie nidificanti: [urogallo](/especie/tetrao_urogallus/), [fagiano
      di monte](/especie/tetrao_tetrix/), pernice bianca e francolino di monte. [Gufo
      reale](/especie/bubo_bubo/) e [aquila reale](/especie/aquila_chrysaetos/) signoreggiano le pareti.
      Cinque specie di rapaci notturni popolano i boschi, assieme a picidi rari quali il [picchio
      tridattilo](/especie/picoides_tridactylus/) e il [picchio nero](/especie/dryocopus_martius/). Nei prati
      sfalciati nidifica il re di quaglie.


      Dai corsi d'acqua giungono salamandra alpina, tritone alpestre, trota marmorata e [trota
      fario](/especie/salmo_trutta/), oltre al salmerino alpino. Nel laghetto Welsperg in Val Canali
      sopravvive il gambero di fiume autoctono grazie a mirati interventi di tutela.
    visit: >-
      Il parco conta tre centri visitatori, e ciascuno costituisce una porta d'accesso. Il Centro Terra
      Foresta di Paneveggio, sulla strada da Predazzo al Passo Rolle, è l'ingresso dalla Val di Fiemme: narra
      la storia della Foresta dei Violini e degli animali del bosco, con un recinto adiacente al centro dove
      si possono osservare i cervi. Da esso parte il Sentiero Marciò, un anello didattico dotato di punti di
      osservazione, percorribile tutto l'anno, poco impegnativo, privo di barriere tranne in presenza di neve
      o ghiaccio, che supera un ponte coperto sul Travignolo e un ponte sospeso sopra la forra, dove il
      torrente dà vita a rapide e cascate. In estate e in inverno si organizzano uscite con accompagnamento.


      Villa Welsperg, in Val Canali, risalente al 1853, è l'accesso dal Primiero e la sede del parco; vi si
      trova il centro visitatori dedicato alle aree protette, al territorio del parco e alla vita acquatica
      alpina, e attorno si snoda il «Percorso delle muse Fedaie», un itinerario pianeggiante e accessibile a
      tutti incentrato sulla biodiversità. Il centro di San Martino di Castrozza approfondisce l'ambiente
      d'alta montagna, la geologia delle Dolomiti e l'aquila.


      Per camminare più a lungo, il Sentiero Etnografico del Vanoi unisce Caoria, a 845 m, e malga Vesnòta de
      sora, a 1.879 m, attraverso quattro itinerari a tema. Il percorso ciclopedonale Caoria-Paneveggio conta
      quasi 36,5 chilometri lungo strade forestali e sentieri già esistenti, e la strada statale SS 50 collega
      il centro di Paneveggio con Predazzo e il Passo Rolle. Il parco promuove inoltre escursioni a piedi e
      con le ciaspole oltre a laboratori ambientali.
    history: >-
      Il parco fu istituito nel 1967 con 15.704 ettari, ampliato nel 1987 di 4.007 ettari fino agli attuali
      19.726,09 ettari. La riserva integrale occupa il 39,82 % dell'area. Le Pale di San Martino sono state
      dichiarate Patrimonio Mondiale dell'Umanità UNESCO il 26 giugno 2009 a Siviglia.


      La memoria bellica annovera due forti austro-ungarici della prima guerra mondiale: Forte Buso e Forte
      Dossaccio. A fine ottobre 2018 la tempesta Vaia ha schiantato boschi su oltre 650 ettari dell'area
      protetta.
    before: >-
      Le uscite guidate con il personale del parco si svolgono nelle stagioni estiva e invernale; consulta in
      anticipo il calendario delle attività. In presenza di neve o ghiaccio il Sentiero Marciò perde la sua
      piena accessibilità.
    around: >-
      Il [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) sorge a
      circa cinque chilometri e la [Val Canzoi (Dolomiti Bellunesi Wilderness Sector)](/lugar/val-canzoi/) a
      dodici chilometri. A ventitré chilometri si trova il [Parco Naturale Puez-Odle / Naturpark
      Puez-Geisler](/lugar/parco-naturale-puez-odle/) e a ventisette il [Parco Naturale Fanes-Sennes-Braies /
      Naturpark Fanes-Sennes-Prags](/lugar/parco-naturale-fanes-sennes-braies/).
  pt:
    intro: >-
      Os violinos mais célebres do mundo brotaram de uma floresta alpina. Os mestres luthiers de outrora
      demandavam os abetos de ressonância em Paneveggio, um imenso mar de abeto-falso hoje batizado como a
      Floresta dos Violinos pela excelência da sua madeira para instrumentos de corda. O Parque Natural
      Paneveggio - Pale di San Martino resguarda este bosque e, acima dele, os torreões dolomíticos das Pale
      di San Martino: das matas sombrias aos rochedos alvos, no Trentino oriental, desde pouco menos de 1.100
      m até cerca de 3.200 m.
    landscape: >-
      O parque distribui-se por três vales — Primiero, Val di Fiemme e Val di Fassa — ordenados pelas bacias
      dos torrentes Cismon, Vanoi e Travignolo. A oriente erguem-se as Pale di San Martino, imponente maciço
      dolomítico; a ocidente prolonga-se a cadeia do Lagorai, maciço de pórfiro quartzífero talhado em cristas
      afiladas e cascalheiras íngremes. Dois universos rochosos distintos que dão lugar a paisagens e
      coberturas vegetais contrastantes.


      A geologia desvenda as eras primordiais: afloram aqui os estratos mais antigos de toda a sucessão
      dolomítica. A formação Bellerophon resguarda calcários escuros com abundantes fósseis marinhos. Sobre
      ela, a Dolomia dello Sciliar assentou há cerca de 200 milhões de anos com quase mil metros de espessura,
      modelando o Cimon della Pala e as Pale di San Martino. O roteiro geológico Valles–Venegia permite
      interpretar rochas sedimentares e moreias glaciares.


      A floresta estratifica-se por patamares: entre os 1.500 e os 1.900 m o abeto-falso preenche 85 % do
      coberto arbóreo na floresta estatal de Paneveggio, com mais de 2.700 hectares. Mais acima, até cerca de
      2.200 m, prevalecem o lariço e o pinheiro-suíço. Acima estendem-se prados alpinos com endemismos
      dolomíticos exclusivos: Campanula morettiana, Primula tyrolensis, Saxifraga facchini e Rhizobotrya
      alpina, endémica a nível de género. Os líquenes somam cerca de 650 espécies conhecidas, estimando-se que
      superem pelo menos um milhar.
    wildlife: >-
      O [veado](/especie/cervus_elaphus/) é o símbolo do parque; a sua presença atual deriva de um episódio
      fortuito: alguns exemplares fugidos de um cercado em Paneveggio em 1963 recolonizaram o vale. Hoje, um
      cercado interpretativo contíguo ao centro de acolhimento permite contemplá-los de perto. O
      [corço](/especie/capreolus_capreolus/) povoa as matas, a [camurça](/especie/rupicapra_rupicapra/) os
      cumes alcantilados, e em 2000 iniciou-se a reintrodução do [íbex](/especie/capra_ibex/) nas Pale com a
      libertação de trinta animais.


      Nas pastagens alpinas habita a [marmota](/especie/marmota_marmota/), cujas sentinelas apitam avisos
      específicos. Acima dos 1.300 m vive a lebre-variável, acompanhada pela fuinha e pela
      [marta](/especie/martes_martes/).


      Mais de 80 espécies de aves nidificam na região: o [tetraz-grande](/especie/tetrao_urogallus/), o
      [tetraz-lira](/especie/tetrao_tetrix/), a lagópode-branca e a galinha-do-mato. O
      [bufo-real](/especie/bubo_bubo/) e a [águia-real](/especie/aquila_chrysaetos/) dominam os céus. Cinco
      espécies de corujas habitam as florestas, ao lado de pica-paus raros como o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/) e o [pica-pau-preto](/especie/dryocopus_martius/).
      Nos prados de feno nidifica o codornizão.


      Nas águas de montanha encontram-se a salamandra-alpina, o tritão-alpino, a truta-marmoreada e a
      [truta-comum](/especie/salmo_trutta/), a par do salvelino-ártico. Na pequena lagoa Welsperg, no Val
      Canali, sobrevive o caranguejo-de-rio autóctone graças a ações conservacionistas.
    visit: >-
      O parque conta com três centros de acolhimento de visitantes, sendo cada um deles uma porta de entrada.
      O Centro Terra Foresta de Paneveggio, na estrada de Predazzo ao Passo Rolle, é a entrada pelo Val di
      Fiemme: relata a história da Floresta dos Violinos e dos animais da floresta, dispondo de um cercado
      contíguo onde se avistam veados. Dele parte o Sentiero Marciò, um circuito interpretativo com pontos de
      observação, percorrível durante todo o ano, pouco exigente, sem barreiras arquitetónicas exceto sob neve
      ou gelo, que cruza uma ponte coberta sobre o Travignolo e uma ponte suspensa sobre a garganta, onde o
      torrente molda rápidos e cascatas. No verão e no inverno organizam-se saídas com acompanhamento.


      A Villa Welsperg, no Val Canali, erguida em 1853, é a entrada pelo Primiero e a sede do parque; ali
      situa-se o centro de visitantes dedicado às áreas protegidas, ao território do parque e à vida aquática
      alpina, correndo ao redor o «Percorso delle muse Fedaie», um itinerário plano e acessível a todos
      centrado na biodiversidade. O centro de San Martino di Castrozza aborda o ambiente de alta montanha, a
      geologia das Dolomitas e a águia.


      Para caminhadas mais longas, o Sentiero Etnografico del Vanoi une Caoria, a 845 m, e a malga Vesnòta de
      sora, a 1.879 m, através de quatro itinerários temáticos. O traçado ciclável e pedonal Caoria-Paneveggio
      soma quase 36,5 quilómetros por estradas florestais e caminhos existentes, ligando a estrada estatal SS
      50 o centro de Paneveggio a Predazzo e ao Passo Rolle. O parque promove igualmente excursões a pé e com
      raquetes de neve e oficinas ambientais.
    history: >-
      O parque foi criado em 1967 com 15.704 hectares, expandido em 1987 em 4.007 hectares até atingir os
      atuais 19.726,09 hectares. A reserva integral engloba 39,82 % da área protegida. As Pale di San Martino
      foram inscritas no Património Mundial da UNESCO a 26 de junho de 2009 em Sevilha.


      A história militar legou dois fortes austro-húngaros da Primeira Guerra Mundial: Forte Buso e Forte
      Dossaccio. No final de outubro de 2018 a tempestade Vaia derrubou arvoredo em mais de 650 hectares do
      parque.
    before: >-
      As saídas acompanhadas pelos vigilantes organizam-se nos períodos de verão e inverno; consulta o
      calendário antes de iniciares a visita. Sob neve ou gelo o Sentiero Marciò deixa de ser totalmente
      acessível.
    around: >-
      O [Parco Nazionale delle Dolomiti Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/) fica a
      cerca de cinco quilómetros e a [Val Canzoi (Dolomiti Bellunesi Wilderness Sector)](/lugar/val-canzoi/) a
      doze quilómetros. A vinte e três quilómetros localiza-se o [Parco Naturale Puez-Odle / Naturpark
      Puez-Geisler](/lugar/parco-naturale-puez-odle/) e a vinte e sete o [Parco Naturale Fanes-Sennes-Braies /
      Naturpark Fanes-Sennes-Prags](/lugar/parco-naturale-fanes-sennes-braies/).
