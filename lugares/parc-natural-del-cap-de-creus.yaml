resumen:
  es: >-
    El punto más oriental de la península ibérica, donde los Pirineos se hunden en el mar en un laberinto de
    esquistos metamórficos esculpidos por la tramontana.
  en: >-
    The easternmost point of the Iberian Peninsula, where the Pyrenees plunge into the sea in a labyrinth of
    metamorphic schists sculpted by the tramontana.
  fr: >-
    Le point le plus oriental de la péninsule Ibérique, où les Pyrénées plongent dans la mer au milieu d'un
    dédale de schistes métamorphiques sculptés par la tramontane.
  de: >-
    Der östlichste Punkt der Iberischen Halbinsel, an dem die Pyrenäen in einem von der Tramontana geformten
    Labyrinth metamorpher Schiefer ins Meer abfallen.
  it: >-
    Il punto più orientale della penisola iberica, dove i Pirenei sprofondano nel mare in un labirinto di
    scisti metamorfici modellati dalla tramontana.
  pt: >-
    O ponto mais oriental da Península Ibérica, onde os Pirenéus mergulham no mar num labirinto de xistos
    metamórficos esculpidos pela tramontana.
