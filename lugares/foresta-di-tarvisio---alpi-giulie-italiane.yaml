resumen:
  es: >-
    El bosque estatal más grande de Italia (24.000 ha en la triple frontera con Austria y Eslovenia) con los
    mágicos Lagos de Fusine al pie del Mangart.
  en: >-
    Italy’s largest state forest (24,000 ha on the tripoint border with Austria and Slovenia) featuring the
    magical Fusine Lakes at the foot of Mangart.
  fr: >-
    La plus vaste forêt domaniale d’Italie (24 000 ha au tripoint avec l’Autriche et la Slovénie) et les
    splendides lacs de Fusine au pied du Mangart.
  de: >-
    Italiens größter Staatswald (24.000 ha am Dreiländereck zu Österreich und Slowenien) mit den magischen
    Weißenfelser Seen am Fuß des Mangart.
  it: >-
    La più grande foresta demaniale d’Italia (24.000 ha sul confine con Austria e Slovenia) con i magici Laghi
    di Fusine ai piedi del Mangart.
  pt: >-
    A maior floresta estatal de Itália (24.000 ha na tríplice fronteira com a Áustria e a Eslovénia) com os
    mágicos lagos de Fusine no sopé do Mangart.
unico:
  es: >-
    Un bosque milenario de píceas y hayas, gestionado desde hace más de un siglo para mantener siempre la
    cubierta arbórea, donde se oye a la vez el gallo lira, el lobo y el oso.
  en: >-
    A thousand-year-old forest of spruce and beech, managed for over a century for continuous canopy cover,
    where black grouse, wolf, and bear coexist.
  fr: >-
    Une forêt millénaire d’épicéas et de hêtres gérée depuis plus d’un siècle à couvert continu, où cohabitent
    tétras lyre, loup et ours.
  de: >-
    Ein tausendjähriger Fichten- und Buchenwald, der seit über einem Jahrhundert durch Dauerwaldwirtschaft
    gepflegt wird und Birkhuhn, Wolf und Bär vereint.
  it: >-
    Un bosco millenario di abeti rossi e faggi, gestito da oltre un secolo per mantenere sempre la copertura
    arborea, dove si incontrano gallo forcello, lupo e orso.
  pt: >-
    Uma mata milenar de espruces e faias gerida há mais de um século com cobertura florestal permanente, onde
    convivem o galo-lira, o lobo e o urso.
observaciones:
  es: >-
    Si vas a los lagos, calcula que en invierno se hielan de diciembre a marzo y que la zona es de las más
    frías de la región.
texto:
  es:
    intro: >-
      En el rincón más al noreste de Italia, donde se tocan Austria y Eslovenia, hay un bosque con mil años de
      historia escrita. En 1007 el emperador Enrique II lo regaló al obispo de Bamberg; más de siete siglos
      después, en 1759, lo compró la emperatriz María Teresa; en 1919, tras el tratado de Saint-Germain, pasó
      a Italia. La foresta de Tarvisio es hoy el mayor bosque estatal del país sin contar los parques: unas
      veinticuatro mil hectáreas de territorio alpino, quince mil de ellas de bosque productivo, entre los
      seiscientos metros del fondo del valle y los dos mil quinientos de las crestas.
    landscape: >-
      La foresta se extiende entre los Alpes Cárnicos al oeste, los Alpes Julianos al sur y los Karavanke al
      norte, por todo el Valcanale y el valle del Slizza. El río Fella la cruza, y a ambos lados se abren
      valles hondos: el del Rio Bianco, el de Malborghetto, el de Ugovizza, el de Valbruna y el Rio del Lago.


      El paisaje cambia de abajo arriba. Primero los bosques de media montaña, mixtos de pícea y haya; luego,
      en los terrenos forestales menos desarrollados, alerces y pinos silvestres y pinos negros de Austria.
      Por encima de los mil setecientos metros el bosque se rinde a los matorrales de pino mugo y rododendro,
      a los prados alpinos y a la roca desnuda, hasta los pináculos y los neveros permanentes. Y la pícea de
      Tarvisio tiene fama propia: su madera es especialmente apta para hacer instrumentos de cuerda.


      Pegados a la foresta están los lagos de Fusine, a los pies del Mangart. Son dos, el Superior y el
      Inferior, de origen glaciar, en un anfiteatro calcáreo. El Superior está a unos novecientos veintinueve
      metros y tiene diez de profundidad máxima; el Inferior, más ancho, llega a veinticinco. En invierno es
      una de las zonas más frías de la región: los lagos suelen estar helados de principios de diciembre a
      marzo. El valle es área protegida desde 1971.
    wildlife: >-
      Aquí viven las cuatro especies alpinas de tetraónidos: el [urogallo](/especie/tetrao_urogallus/), el
      [gallo lira](/especie/tetrao_tetrix/), la [perdiz nival](/especie/lagopus_muta/) y el grévol. También el
      [águila real](/especie/aquila_chrysaetos/), que vive de forma estable entre los Alpes Julianos y los
      Cárnicos, y el [buitre leonado](/especie/gyps_fulvus/), que aparece en sus desplazamientos.


      Entre los mamíferos, la recuperación de prados y pastos y la reposición de frutales locales han
      contribuido al regreso de los ungulados. Los principales son el [ciervo](/especie/cervus_elaphus/), el
      gamo y el [corzo](/especie/capreolus_capreolus/); en Val Saisera y Tarvisio hay áreas de naturaleza
      dedicadas al rebeco, al ciervo y al corzo. Desde finales de los años setenta se repuebla la zona con
      [íbices](/especie/capra_ibex/), que hoy superan los trescientos. Los grandes carnívoros han vuelto por
      su cuenta: hay [lobos](/especie/canis_lupus/), con al menos dos manadas de formación reciente, se ven
      con frecuencia [osos pardos](/especie/ursus_arctos/) que cruzan desde Eslovenia o Austria.


      La flora tiene sus citas. En las cotas altas, sobre caliza, crece la campanilla de Zoys, y en el sector
      cárnico florece *Wulfenia carinthiaca*.
    visit: >-
      La puerta natural son los lagos de Fusine. Desde Tarvisio se sigue la señal hacia Eslovenia hasta Fusine
      Valromana y allí se gira a la derecha hacia los lagos; el gran aparcamiento de Scicchizza está a nueve
      kilómetros. De allí sale un anillo de unos cinco kilómetros y medio, de unas dos horas, que une los dos
      lagos: tras un tramo breve por el bosque, el Sentiero del Lago llega en un cuarto de hora a la presa que
      regula el lago Inferior, y cruza una morrena que separa los lagos, con enormes bloques erráticos, entre
      ellos el Pirona, de unos treinta mil metros cúbicos. Para más esfuerzo hay un anillo de trekking más
      largo que sigue por el sendero 513 hacia Alpe Vecchia, desde donde se ve de cerca el Mangart.


      Dentro del bosque hay senderos naturalistas con nombre: Naturalmente…Tarvisio, Girabosco, Giro del Lago
      di Raibl y Orrido dello Slizza.
    history: >-
      Hasta hoy, el noventa por ciento de la superficie sigue sometido a derechos de uso de origen medieval.
      Su gestión pasó en 1932 al Cuerpo Forestal del Estado y hoy la lleva la unidad de biodiversidad de los
      Carabinieri de Tarvisio. Dentro del bosque hay reservas integrales como la del Rio Bianco, reserva
      biogenética desde diciembre de 1977 e incluida en el sitio Natura 2000 Valloni di Rio Bianco e di
      Malborghetto.
    before: >-
      Si vas a los lagos, calcula que en invierno se hielan de diciembre a marzo y que la zona es de las más
      frías de la región.
    around: >-
      A cuatro kilómetros están la [Meseta de Pokljuka](/lugar/pokljuka-plateau/) y el [Parque Nacional de
      Triglav](/lugar/triglav-southern-karst-plateau/). Más lejos, el [Totes Gebirge - Desierto
      Kárstico](/lugar/totes-gebirge---karst-desert/) comparte el gallo lira y el oso, y el [Parque Natural
      del Monviso](/lugar/parco-naturale-del-monviso/) y la [Reserva Natural del Dachstein — Gosau, Hallstatt
      y Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/) comparten el gallo lira y
      paisaje de alta montaña y bosque.
  en:
    intro: >-
      In Italy’s far northeastern corner, where borders touch Austria and Slovenia, lies a mountain forest
      with a thousand years of documented history. In 1007 Emperor Henry II gifted it to the Bishop of
      Bamberg; more than seven centuries later, in 1759, Empress Maria Theresa acquired it; and in 1919, under
      the Treaty of Saint-Germain, it passed to Italy. The Foresta di Tarvisio is today the largest state
      forest in Italy outside the national parks: some twenty-four thousand hectares of alpine terrain,
      fifteen thousand of which comprise productive woodland, extending from six hundred metres on the valley
      floor up to two thousand five hundred metres along the ridgelines.
    landscape: >-
      The forest sprawls across Valcanale and the Slizza valley, enclosed by the Carnic Alps to the west, the
      Julian Alps to the south, and the Karavanke to the north. The river Fella cuts through its heart,
      bordered by deep lateral valleys: Rio Bianco, Malborghetto, Ugovizza, Valbruna, and Rio del Lago.


      The vegetation changes as altitude increases. Mid-elevation montane forests combine Norway spruce and
      European beech; thinner, rocky soils host European larch, Scots pine, and Austrian black pine. Above one
      thousand seven hundred metres, the woodland yields to dwarf mountain pine scrub, rhododendron, alpine
      meadows, and exposed limestone crags rising toward permanent snow hollows. Tarvisio resonance spruce
      enjoys world renown: its slow-grown, even-grained timber is prized for crafting high-grade stringed
      musical instruments.


      Nestled against the forest beneath the precipices of Mangart lie the glacial Fusine Lakes: Lago
      Superiore and Lago Inferiore, cupped in an amphitheatre of limestone scree. Lago Superiore sits at about
      nine hundred and twenty-nine metres with a maximum depth of ten metres; the broader Lago Inferiore
      reaches twenty-five metres. In winter this hollow becomes one of the coldest pockets in Friuli: the
      lakes remain frozen from early December into March. The valley has been conserved as a protected area
      since 1971.
    wildlife: >-
      All four native alpine grouse species inhabit these forests: the [western
      capercaillie](/especie/tetrao_urogallus/), the [black grouse](/especie/tetrao_tetrix/), the [rock
      ptarmigan](/especie/lagopus_muta/), and the hazel grouse. The [golden
      eagle](/especie/aquila_chrysaetos/) maintains resident nesting territories between the Julian and Carnic
      Alps, while wandering [griffon vultures](/especie/gyps_fulvus/) appear regularly during seasonal
      foraging flights.


      Mammals have benefited greatly from meadow restoration and the replanting of traditional orchard
      varieties. Principal ungulates include the [red deer](/especie/cervus_elaphus/), fallow deer, and [roe
      deer](/especie/capreolus_capreolus/); designated wildlife corridors in Val Saisera and Tarvisio provide
      refuge for chamois, red deer, and roe. Following reintroductions launched in the late
      nineteen-seventies, the [alpine ibex](/especie/capra_ibex/) population now numbers over three hundred
      head. Apex predators have returned autonomously: [grey wolves](/especie/canis_lupus/) have established
      at least two active packs, and [brown bears](/especie/ursus_arctos/) regularly wander in from
      neighboring ranges in Slovenia and Austria.


      Botanical highlights include Zoys’ harebell in high limestone screes, while the endemic *Wulfenia
      carinthiaca* blooms on adjacent Carnic crests.
    visit: >-
      The classic access point is the Fusine Lakes basin. From Tarvisio, head toward the Slovenian border to
      Fusine Valromana and turn right into the lakes road; the large Scicchizza car park is nine kilometres
      away. A walking circuit of five and a half kilometres, taking roughly two hours, links both lakes: after
      a forest stroll, the lakeside path reaches the weir regulating the lower lake in fifteen minutes, then
      traverses the moraine ridge separating the two basins amidst colossal erratics, including the giant
      Pirona boulder of roughly thirty thousand cubic metres. For longer outings, trail 513 continues toward
      Alpe Vecchia, offering up-close views of Mangart’s sheer north face.


      Within the state forest, themed nature walks include Naturalmente…Tarvisio, Girabosco, Giro del Lago di
      Raibl, and Orrido dello Slizza.
    history: >-
      Remarkably, ninety percent of the woodland remains subject to grazing and timber rights of medieval
      origin. Custody was transferred in 1932 to the State Forestry Corps, managed today by the Carabinieri
      Biodiversity Department of Tarvisio. Several integral nature reserves lie embedded within, including the
      Rio Bianco Biogenetic Reserve established in December 1977, which forms part of the Natura 2000 site
      Valloni di Rio Bianco e di Malborghetto.
    before: >-
      If visiting the Fusine basin, note that the lakes freeze solid between December and March in one of the
      region’s coldest microclimates.
    around: >-
      Four kilometres away lie the [Pokljuka Plateau](/lugar/pokljuka-plateau/) and [Triglav National
      Park](/lugar/triglav-southern-karst-plateau/). Further afield, the [Totes Gebirge - Karst
      Desert](/lugar/totes-gebirge---karst-desert/) shares black grouse and brown bear, while [Monviso Natural
      Park](/lugar/parco-naturale-del-monviso/) and [Dachstein Nature Reserve — Gosau, Hallstatt and
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/) share black grouse and
      subalpine forest landscapes.
  fr:
    intro: >-
      À l’extrémité nord-orientale de l’Italie, au point de rencontre de l’Autriche et de la Slovénie, s’étend
      un massif forestier riche de mille ans d’histoire écrite. En 1007, l’empereur Henri II en fit don à
      l’évêque de Bamberg ; plus de sept siècles plus tard, en 1759, l’impératrice Marie-Thérèse l’acheta ; en
      1919, à la suite du traité de Saint-Germain, elle fut rattachée à l’Italie. La forêt de Tarvisio
      constitue aujourd’hui la plus vaste forêt domaniale d’Italie hors parcs nationaux : environ vingt-quatre
      mille hectares d’espace alpin, dont quinze mille de forêt productive, s’étageant entre six cents mètres
      en fond de vallée et deux mille cinq cents mètres sur les crêtes.
    landscape: >-
      Le domaine forestier s’étire entre les Alpes carniques à l’ouest, les Alpes juliennes au sud et les
      Karavanke au nord, occupant tout le Valcanale et la vallée du Slizza. La Fella le traverse, flanquée de
      vallées tributaires profondes : le Rio Bianco, Malborghetto, Ugovizza, Valbruna et le Rio del Lago.


      Le manteau végétal change avec l’altitude. D’abord les forêts montagnardes mixtes d’épicéa commun et de
      hêtre ; puis, sur les versants plus ingrats, mélèzes, pins sylvestres et pins noirs d’Autriche. Au-delà
      de mille sept cents mètres, la forêt cède la place aux landes à pin mugo et rhododendron, aux pelouses
      alpines et à la roche nue, jusqu’aux arêtes et névés permanents. L’épicéa de résonance de Tarvisio jouit
      d’une réputation séculaire : son bois au fil serré et régulier est particulièrement recherché par les
      maîtres luthiers pour façonner des instruments à cordes.


      Adossés à la forêt se nichent les lacs de Fusine, au pied de la muraille du Mangart. Ces deux bassins
      d’origine glaciaire, le lac Supérieur et le lac Inférieur, dorment dans un cirque calcaire. Le lac
      Supérieur se situe à environ neuf cent vingt-neuf mètres d’altitude pour dix mètres de profondeur
      maximale ; l’Inférieur, plus vaste, atteint vingt-cinq mètres. En hiver, cette cuvette est l’une des
      plus froides du Frioul : les lacs gèlent généralement de début décembre à mars. La vallée est classée
      zone protégée depuis 1971.
    wildlife: >-
      Les quatre tétraonidés alpins peuplent ces boisements : le [grand tétras](/especie/tetrao_urogallus/),
      le [tétras lyre](/especie/tetrao_tetrix/), le [lagopède alpin](/especie/lagopus_muta/) et la gélinotte
      des bois. L’[aigle royal](/especie/aquila_chrysaetos/) niche de manière stable entre Alpes juliennes et
      carniques, tandis que le [vautour fauve](/especie/gyps_fulvus/) survole régulièrement la zone lors de
      ses errances estivales.


      Chez les mammifères, la restauration des prairies et la replantation de vergers traditionnels ont
      favorisé le retour des ongulés : [cerf élaphe](/especie/cervus_elaphus/), daim et
      [chevreuil](/especie/capreolus_capreolus/) prospèrent, appuyés par des zones de quiétude dans le Val
      Saisera et à Tarvisio. Réintroduit à la fin des années soixante-dix, le [bouquetin des
      Alpes](/especie/capra_ibex/) dépasse aujourd’hui les trois cents individus. Les grands prédateurs ont
      recolonisé le massif d’eux-mêmes : le [loup](/especie/canis_lupus/) y compte au moins deux meutes
      récentes, et l’[ours brun](/especie/ursus_arctos/) traverse fréquemment depuis la Slovénie et
      l’Autriche.


      La flore recèle de précieuses raretés : la campanule de Zoys dans les pierriers calcaires d’altitude et
      la célèbre *Wulfenia carinthiaca* sur les crêtes carniques.
    visit: >-
      Les lacs de Fusine constituent le point d’accès naturel. Depuis Tarvisio, suivez la route vers la
      frontière slovène jusqu’à Fusine Valromana puis tournez à droite vers les lacs ; le grand parking de
      Scicchizza se trouve à neuf kilomètres. De là part une boucle de cinq kilomètres et demi, réalisable en
      deux heures environ, reliant les deux bassins : après un court passage en sous-bois, le Sentiero del
      Lago mène en un quart d’heure au déversoir du lac Inférieur, puis gravit le cordon morainique jonché
      d’énormes blocs erratiques, dont le rocher Pirona cubant environ trente mille mètres cubes. Pour une
      randonnée plus sportive, le sentier 513 monte vers l’Alpe Vecchia au plus près de la face nord du
      Mangart.


      En forêt domaniale, plusieurs sentiers balisés portent un nom : Naturalmente…Tarvisio, Girabosco, Giro
      del Lago di Raibl et l’Orrido dello Slizza.
    history: >-
      Fait remarquable, quatre-vingt-dix pour cent de la superficie demeure grevée de droits d’usage d’origine
      médiévale. Sa gestion passa en 1932 au Corps forestier de l’État et relève aujourd’hui du service pour
      la biodiversité des Carabiniers de Tarvisio. Elle englobe plusieurs réserves intégrales, dont la réserve
      biogénétique du Rio Bianco créée en décembre 1977 et rattachée au site Natura 2000 Valloni di Rio Bianco
      e di Malborghetto.
    before: >-
      Si vous visitez les lacs, notez qu’ils sont gelés de décembre à mars et que la combe figure parmi les
      sites les plus froids du nord-est italien.
    around: >-
      À quatre kilomètres se trouvent le [plateau de Pokljuka](/lugar/pokljuka-plateau/) et le [parc national
      du Triglav](/lugar/triglav-southern-karst-plateau/). Plus loin, le [Totes Gebirge - désert
      karstique](/lugar/totes-gebirge---karst-desert/) abrite également le tétras lyre et l’ours brun, tandis
      que le [parc naturel du Monviso](/lugar/parco-naturale-del-monviso/) et la [réserve naturelle du
      Dachstein — Gosau, Hallstatt et
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/) partagent le tétras lyre ainsi
      que de magnifiques paysages de haute montagne boisée.
  de:
    intro: >-
      Im äußersten Nordosten Italiens, wo das Land an Österreich und Slowenien grenzt, erstreckt sich ein
      Bergwald mit tausendjähriger schriftlicher Geschichte. Im Jahr 1007 schenkte ihn Kaiser Heinrich II. dem
      Bistum Bamberg; mehr als sieben Jahrhunderte später, 1759, erwarb ihn Kaiserin Maria Theresia; 1919 ging
      er nach dem Vertrag von Saint-Germain an Italien über. Die Foresta di Tarvisio bildet heute den größten
      Staatswald Italiens außerhalb der Nationalparks: rund vierundzwanzigtausend Hektar alpiner Landschaft,
      davon fünfzehntausend Hektar Wirtschaftswald, zwischen sechshundert Metern im Talboden und
      zweitausendfünfhundert Metern auf den Bergkämmen.
    landscape: >-
      Der Forst erstreckt sich zwischen den Karnischen Alpen im Westen, den Julischen Alpen im Süden und den
      Karawanken im Norden über das gesamte Kanaltal und das Tal der Slizza. Die Fella durchzieht das Gebiet,
      gesäumt von tiefen Seitentälern: Rio Bianco, Malborghetto, Ugovizza, Valbruna und Rio del Lago.


      Die Vegetation staffelt sich mit der Höhe. Zuerst Bergmischwälder aus Fichte und Buche; auf kargen Böden
      Lärchen, Waldkiefern und österreichische Schwarzkiefern. Oberhalb von eintausendsiebenhundert Metern
      weicht der Wald Krummholzzonen aus Latsche und Almrausch, alpinen Matten und nacktem Fels bis hin zu
      Dauerschneefeldern. Die Tarviser Resonanzfichte genießt Weltruf: Ihr fein- und gleichmäßig gewachsenes
      Holz ist bei Geigenbauern für hochwertige Saiteninstrumente begehrt.


      Direkt an den Forst grenzen die Weißenfelser Seen (Laghi di Fusine) unter der mächtigen
      Mangart-Nordwand. Es sind zwei Gewässer glazialen Ursprungs, der Obere und der Untere See, eingebettet
      in ein Amphitheater aus Schutt und Fels. Der Obere See liegt auf etwa neunhundertneunundzwanzig Metern
      und ist maximal zehn Meter tief; der tiefere Untere See erreicht fünfundzwanzig Meter. Im Winter gehört
      die Senke zu den kältesten Winkeln der Region: Die Seen sind meist von Anfang Dezember bis März
      zugefroren. Das Tal steht seit 1971 unter Schutz.
    wildlife: >-
      Alle vier alpinen Raufußhühner leben hier: [Auerhuhn](/especie/tetrao_urogallus/),
      [Birkhuhn](/especie/tetrao_tetrix/), [Alpenschneehuhn](/especie/lagopus_muta/) und Haselhuhn. Der
      [Steinadler](/especie/aquila_chrysaetos/) brütet regelmäßig zwischen Julischen und Karnischen Alpen,
      während der [Gänsegeier](/especie/gyps_fulvus/) auf seinen Sommerzügen das Tal überfliegt.


      Unter den Säugetieren förderten Wiesenpflegen und die Pflanzung alter Obstsorten die Bestände von
      [Rothirsch](/especie/cervus_elaphus/), Damhirsch und [Reh](/especie/capreolus_capreolus/); im Val
      Saisera und bei Tarvisio bestehen Wildruhezonen für Gämsen und Hirsche. Durch Auswilderungen seit Ende
      der siebziger Jahre zählt der [Alpensteinbock](/especie/capra_ibex/) heute über dreihundert Tiere. Auch
      Großraubtiere kehrten selbstständig zurück: Der [Wolf](/especie/canis_lupus/) ist mit mindestens zwei
      Rudeln präsent, und aus Slowenien und Österreich wandern regelmäßig [Braunbären](/especie/ursus_arctos/)
      ein.


      Zu den botanischen Besonderheiten gehören Zoys’ Glockenblume in alpinen Felsschuttfluren und die
      berühmte Kärntner Wulfenie (*Wulfenia carinthiaca*) auf den Karnischen Kämmen.
    visit: >-
      Natürlicher Ausgangspunkt sind die Weißenfelser Seen. Von Tarvisio fährst du Richtung slowenische Grenze
      nach Fusine Valromana und biegst rechts zu den Seen ab; der große Parkplatz Scicchizza liegt neun
      Kilometer entfernt. Ein Rundweg von etwa fünfeinhalb Kilometern Länge verbindet in rund zwei Stunden
      beide Seen: Nach einem Waldstück erreicht der Uferweg in einer Viertelstunde das Wehr des Unteren Sees
      und überquert dann den Moränenwall zwischen den Seen mit riesigen Findlingen wie dem Block Pirona mit
      dreißigtausend Kubikmetern Volumen. Eine anspruchsvollere Bergtour führt auf Weg 513 hinauf zur Alpe
      Vecchia unter die Nordwand des Mangart.


      Im Staatswald gibt es benannte Naturpfade: Naturalmente…Tarvisio, Girabosco, Giro del Lago di Raibl und
      Orrido dello Slizza.
    history: >-
      Bis heute unterliegen neunzig Prozent der Waldfläche historischen Nutzungsrechten mittelalterlichen
      Ursprungs. Die Verwaltung ging 1932 an die staatliche Forstverwaltung über und wird heute von der
      Biodiversitätsabteilung der Carabinieri von Tarvisio ausgeübt. Im Forst liegen Totalreservate wie das
      biogenetische Schutzgebiet Rio Bianco aus dem Dezember 1977, Teil des Natura-2000-Gebiets Valloni di Rio
      Bianco e di Malborghetto.
    before: >-
      Beachte bei einem Besuch der Seen, dass sie von Dezember bis März zufrieren und das Tal zu den kältesten
      Kältelöchern Norditaliens zählt.
    around: >-
      Vier Kilometer entfernt liegen die [Pokljuka-Hochebene](/lugar/pokljuka-plateau/) und der
      [Triglav-Nationalpark](/lugar/triglav-southern-karst-plateau/). Weiter entfernt teilen das [Tote Gebirge
      - Karstwüste](/lugar/totes-gebirge---karst-desert/) Vorkommen von Birkhuhn und Bär, während der
      [Naturpark Monviso](/lugar/parco-naturale-del-monviso/) und das [Naturschutzgebiet Dachstein — Gosau,
      Hallstatt und Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/) das Birkhuhn
      sowie hochalpine Waldlandschaften mit Tarvisio teilen.
  it:
    intro: >-
      Nell’angolo più a nord-est d’Italia, dove si toccano Austria e Slovenia, si estende una foresta con
      mille anni di storia documentata. Nel 1007 l’imperatore Enrico II ne fece dono al vescovo di Bamberga;
      oltre sette secoli dopo, nel 1759, fu acquistata dall’imperatrice Maria Teresa; nel 1919, dopo il
      trattato di Saint-Germain, passò all’Italia. La foresta di Tarvisio è oggi la più vasta foresta
      demaniale dello Stato al di fuori dei parchi nazionali: circa ventiquattromila ettari di territorio
      alpino, di cui quindicimila di bosco produttivo, compresi tra i seicento metri del fondovalle e i
      duemilacinquecento metri delle creste.
    landscape: >-
      La foresta si sviluppa tra le Alpi Carniche a ovest, le Alpi Giulie a sud e le Caravanche a nord,
      abbracciando l’intera Valcanale e la valle dello Slizza. Il fiume Fella la attraversa solcando profonde
      valli tributarie: il Rio Bianco, Malborghetto, Ugovizza, Valbruna e il Rio del Lago.


      La composizione vegetale muta salendo di quota. Dapprima i boschi montani misti di abete rosso e faggio;
      poi, sui suoli più scoscesi, larici, pini silvestri e pini neri d’Austria. Oltre i millesettecento metri
      la copertura arborea lascia spazio alle boscaglie di pino mugo e rododendro, alle praterie alpine e alle
      rupi nude fino ai nevai perenni. L’abete rosso di risonanza di Tarvisio gode di fama mondiale: il suo
      legno a fibra fitta e regolare è ideale per la costruzione di pregiati strumenti a corda.


      Accanto alla foresta riposano i laghi di Fusine, sovrastati dalla parete del Mangart. Sono due specchi
      d’acqua d’origine glaciale, il Lago Superiore e il Lago Inferiore, adagiati in un circo calcareo. Il
      Lago Superiore si trova a circa novecentoventinove metri di quota con dieci metri di profondità massima;
      l’Inferiore, più esteso, ne raggiunge venticinque. In inverno è una delle conche più fredde del Friuli:
      i laghi restano gelati da inizio dicembre a marzo. La valle è riserva naturale protetta dal 1971.
    wildlife: >-
      Nel comprensorio vivono tutti e quattro i tetraonidi alpini: l’[urogallo](/especie/tetrao_urogallus/),
      il [gallo forcello](/especie/tetrao_tetrix/), la [pernice bianca](/especie/lagopus_muta/) e il
      francolino di monte. Nidifica stabilmente l’[aquila reale](/especie/aquila_chrysaetos/) tra Alpi Giulie
      e Carniche, mentre il [grifone](/especie/gyps_fulvus/) compare nei suoi regolari spostamenti estivi.


      Tra i mammiferi, il recupero dei pascoli e la messa a dimora di fruttiferi tradizionali hanno favorito
      gli ungulati: [cervo nobile](/especie/cervus_elaphus/), daino e
      [capriolo](/especie/capreolus_capreolus/) popolano le oasi di rifugio della Val Saisera e di Tarvisio.
      Dai ripopolamenti avviati alla fine degli anni settanta, lo [stambecco alpino](/especie/capra_ibex/)
      supera oggi i trecento esemplari. I grandi predatori sono tornati autonomamente: il [lupo
      grigio](/especie/canis_lupus/) conta almeno due branchi stabili e si registrano frequenti incursioni di
      [orsi bruni](/especie/ursus_arctos/) provenienti da Slovenia e Austria.


      Tra le peculiarità botaniche spiccano la campanula di Zoys sui ghiaioni d’alta quota e la celebre
      *Wulfenia carinthiaca* sui crinali carnici.
    visit: >-
      Il punto di partenza naturale sono i laghi di Fusine. Da Tarvisio si segue la direzione per il valico
      sloveno fino a Fusine Valromana svoltando a destra verso i bacini; il grande piazzale di Scicchizza si
      trova a nove chilometri. Da qui un anello escursionistico di circa cinque chilometri e mezzo,
      percorribile in due ore, collega entrambi i laghi: dopo un tratto nel bosco, il Sentiero del Lago giunge
      in un quarto d’ora allo sbarramento del lago Inferiore, valicando poi il cordone morenico cosparso di
      massi erratici giganti, tra cui il masso Pirona di circa trentamila metri cubi. Per escursioni più
      impegnative, il sentiero 513 prosegue verso l’Alpe Vecchia a ridosso del Mangart.


      All’interno della foresta si snodano percorsi naturalistici tematici: Naturalmente…Tarvisio, Girabosco,
      Giro del Lago di Raibl e Orrido dello Slizza.
    history: >-
      Ancora oggi il novanta per cento della superficie forestale è soggetto a diritti d’uso civico di origine
      medievale. La gestione passò nel 1932 al Corpo Forestale dello Stato ed è attualmente affidata al
      Reparto Carabinieri Biodiversità di Tarvisio. Include riserve integrali come quella biogenetica del Rio
      Bianco, istituita nel dicembre 1977 e compresa nel sito Natura 2000 Valloni di Rio Bianco e di
      Malborghetto.
    before: >-
      Se programmi la visita ai laghi, tieni presente che gelano stabilmente da dicembre a marzo e che la
      conca è una delle più fredde d’Italia.
    around: >-
      A quattro chilometri si estendono l’[Altopiano di Pokljuka](/lugar/pokljuka-plateau/) e il [Parco
      Nazionale del Triglav](/lugar/triglav-southern-karst-plateau/). Più lontano, il [Totes Gebirge - Deserto
      Carsico](/lugar/totes-gebirge---karst-desert/) ospita gallo forcello e orso bruno, mentre il [Parco
      Naturale del Monviso](/lugar/parco-naturale-del-monviso/) e la [Riserva Naturale del Dachstein — Gosau,
      Hallstatt e Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/) condividono il
      gallo forcello e splendidi ambienti alpini forestali.
  pt:
    intro: >-
      No extremo nordeste de Itália, no ponto onde se encontram a Áustria e a Eslovénia, ergue-se uma floresta
      alpina com mil anos de registos escritos. Em 1007, o imperador Henrique II doou-a ao bispo de Bamberg;
      mais de sete séculos depois, em 1759, a imperatriz Maria Teresa comprou-a; em 1919, após o Tratado de
      Saint-Germain, passou para a soberania italiana. A floresta de Tarvisio constitui hoje a maior mata
      pública estatal de Itália fora dos parques nacionais: cerca de vinte e quatro mil hectares de território
      alpino, com quinze mil de floresta produtiva, estendendo-se entre os seiscentos metros do vale e os dois
      mil e quinhentos metros das cristas.
    landscape: >-
      A mancha florestal espalha-se entre os Alpes Cárnicos a oeste, os Alpes Julianos a sul e as Caravancas a
      norte, preenchendo o Valcanale e o vale do Slizza. O rio Fella rasga o vale principal, ladeado por vales
      laterais profundos: Rio Bianco, Malborghetto, Ugovizza, Valbruna e Rio del Lago.


      A vegetação reparte-se por andares montanhosos. Primeiro os bosques mistos de espruce e faia; depois,
      nas encostas mais escarpadas, lariços, pinheiros-silvestres e pinheiros-larícios-austríacos. Acima dos
      mil e setecentos metros o arvoredo dá lugar a matagais de pinheiro-raso e rododendros, a pastos alpinos
      e escarpas calcárias até aos covões navais permanentes. O espruce de ressonância de Tarvisio é afamado
      internacionalmente: a sua madeira de veio denso e regular é procurada por mestres construtores de
      instrumentos de corda.


      Junto à floresta repousam os lagos glaciares de Fusine, defronte das escarpas do Mangart. São dois
      espelhos de água, o Lago Superior e o Lago Inferior, recolhidos num anfiteatro de rocha calcária. O
      Superior fica a cerca de novecentos e vinte e nove metros de altitude com dez metros de profundidade
      máxima; o Inferior, mais largo, atinge vinte e cinco metros. No inverno é dos sítios mais frios da
      região: as águas ficam geladas de princípios de dezembro a março. O vale é protegido como reserva
      natural desde 1971.
    wildlife: >-
      As quatro espécies alpinas de tetrazes habitam estas encostas: o
      [tetraz-grande](/especie/tetrao_urogallus/), o [galo-lira](/especie/tetrao_tetrix/), o
      [lagópode-branco](/especie/lagopus_muta/) e a galinha-do-mato. A
      [águia-real](/especie/aquila_chrysaetos/) nidifica estavelmente entre os Alpes Julianos e Cárnicos, e o
      [abutre-fouveiro](/especie/gyps_fulvus/) surge nas suas rotas sazonais.


      Nos mamíferos, a recuperação de prados e a plantação de pomares antigos sustentam populações de
      ungulados: [veado-vermelho](/especie/cervus_elaphus/), gamo e [corça](/especie/capreolus_capreolus/)
      prosperam em áreas de refúgio no Val Saisera e em Tarvisio. Graças a reintroduções encetadas no final
      dos anos setenta, o [íbex](/especie/capra_ibex/) ultrapassa hoje os trezentos exemplares. Os grandes
      predadores regressaram de forma espontânea: o [lobo-cinzento](/especie/canis_lupus/) conta com pelo
      menos duas alcateias recentes e o [urso-pardo](/especie/ursus_arctos/) cruza com frequência vindo da
      Eslovénia e Áustria.


      A flora apresenta endemismos raros: a campânula-de-Zoys nas fendas calcárias de altitude e a famosa
      *Wulfenia carinthiaca* nos cumes cárnicos.
    visit: >-
      Os lagos de Fusine são a entrada natural. A partir de Tarvisio ruma-se em direção à fronteira eslovena
      até Fusine Valromana, virando à direita para os lagos; o parque de estacionamento de Scicchizza fica a
      nove quilómetros. Dali parte um circuito pedestre de cerca de cinco quilómetros e meio, feito em duas
      horas, ligando ambos os lagos: após uma secção florestal, o trilho alcança em quinze minutos o açude do
      lago Inferior, atravessando depois a moreia que separa as bacias entre blocos erráticos monumentais,
      como o penedo Pirona com cerca de trinta mil metros cúbicos. Para uma subida mais desportiva, o trilho
      513 ruma ao Alpe Vecchia junto à parede norte do Mangart.


      Na mata estatal existem percursos temáticos sinalizados: Naturalmente…Tarvisio, Girabosco, Giro del Lago
      di Raibl e Orrido dello Slizza.
    history: >-
      Ainda hoje noventa por cento da superfície permanece sob direitos consuetudinários de uso de raiz
      medieval. A gestão passou em 1932 para o Corpo Florestal do Estado, sendo atualmente tutelada pelos
      Carabinieri Florestais de Tarvisio. Inclui reservas integrais como a reserva biogenética do Rio Bianco,
      criada em dezembro de 1977 e integrada no sítio Natura 2000 Valloni di Rio Bianco e di Malborghetto.
    before: >-
      Ao visitar os lagos tem em conta que congelam entre dezembro e março e que a bacia regista algumas das
      temperaturas mais frias de Itália.
    around: >-
      A quatro quilómetros ficam o [Planalto de Pokljuka](/lugar/pokljuka-plateau/) e o [Parque Nacional do
      Triglav](/lugar/triglav-southern-karst-plateau/). Mais longe, o [Totes Gebirge - Deserto
      Cárstico](/lugar/totes-gebirge---karst-desert/) acolhe o galo-lira e o urso, enquanto o [Parque Natural
      do Monviso](/lugar/parco-naturale-del-monviso/) e a [Reserva Natural de Dachstein — Gosau, Hallstatt e
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/) partilham o galo-lira e
      relevos alpinos florestados.
