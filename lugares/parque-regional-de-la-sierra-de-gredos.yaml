texto:
  es:
    intro: >-
      Un murallón de granito que separa dos cuencas y que durante las glaciaciones se llenó de hielo. Eso es
      la Sierra de Gredos, en el extremo sur de la provincia de Ávila: 86 236 hectáreas de picos agudos,
      lagunas, circos y gargantas, con el Almanzor, de 2.592 metros, como techo de todo el Sistema Central.
      Es, además, el feudo de la [cabra montés](/especie/capra_pyrenaica/).
    landscape: >-
      Gredos se levantó en la Orogenia Alpina, hace entre 15 y 30 millones de años, cuando el Sistema Central
      se alzó y se fracturó en bloques. Después llegó el Cuaternario. Las aguas torrenciales trabajaron sobre
      todo en la vertiente sur, y el hielo en la norte, que dejó 41 glaciares de montaña de valle, de circo y
      de ladera. Hoy se pueden ver lagunas glaciares, circos, gargantas y depósitos morrénicos. El hielo y el
      deshielo, la gelifracción, tallaron además los galayares y cuchillares, únicos por su belleza.


      Esa altura se nota en la vegetación, que se ordena en pisos. En el parque están 4 de los 5 pisos
      bioclimáticos de la región mediterránea. En la cara norte dominan el matorral y el piornal de las
      cumbres, y los pinares de pino albar solo forman masas grandes en Navarredonda de Gredos y Hoyos del
      Espino. En la cara sur, en cambio, abundan los pinares de pino negral, con terrazas de cerezos,
      castaños, higueras y olivos. Por encima de los 2.000 metros la vegetación se reduce a un piornal denso y
      achaparrado, con cambrión y enebro rastrero, y en lo más alto del circo la única cubierta verde son los
      líquenes silicícolas.


      El mayor valor ecológico está en las rocas: la manzanilla de Gredos, la siderítide de Gredos y el
      gualdoncillo viven pegados a las grietas. Y en la parte baja de las gargantas de la cara sur sobreviven
      pequeños grupos de loros.
    wildlife: >-
      Gredos tiene más de 230 vertebrados catalogados. En las cumbres, la cabra montés ocupa las crestas del
      circo, y la salamandra del Almanzor y el topillo nival abulense completan los endemismos locales. Entre
      las aves hay dos especies en peligro de extinción, el [águila imperial](/especie/aquila_adalberti/) y la
      [cigüeña negra](/especie/ciconia_nigra/), y otras vulnerables, como el alimoche y el [buitre
      negro](/especie/aegypius_monachus/). El [águila real](/especie/aquila_chrysaetos/), el [buitre
      leonado](/especie/gyps_fulvus/), el acentor alpino y el roquero rojo también están. Entre los mamíferos,
      el desmán de los Pirineos, la musaraña española, la [nutria](/especie/lutra_lutra/) y el [gato
      montés](/especie/felis_silvestris/).
    visit: >-
      La Casa del Parque Pinos Cimeros, en Hoyos del Espino, es el mejor punto de partida de la vertiente
      norte. Allí un monitor te ayuda a planificar la visita, un audiovisual cuenta la historia geológica del
      macizo, y desde una cámara en lo alto de una cumbre, que se maneja a distancia con giro de 360° y zoom,
      puedes buscar cabras o rapaces. En la vertiente sur, El Risquillo tiene un banco de aromas de las
      plantas de la sierra, un sistema de luces para conocer las especies de alta montaña y un juego para
      identificar rapaces. Junto a él, una senda accesible sobre pasarela de madera atraviesa un pinar de pino
      resinero.


      La marcha más clásica sale de la plataforma que cierra la pista de Hoyos del Espino y sube por una senda
      empedrada de grandes losas de granito hasta el Circo de Gredos. La Senda de la Laguna Grande, de 6,40 km
      y unas dos horas y media, asciende a Los Barrerones antes de bajar a la laguna; es de dificultad
      media-alta. Desde el alto, el circo y la laguna aparecen de golpe, y las aguas frías y transparentes
      reflejan el Risco de la Ventana, Los Tres Hermanitos, el Cuchillar de las Navajas y El Sagrao. En el
      camino pueden aparecer la cabra montés, el sapo común de Gredos y la salamandra del Almanzor.


      Si prefieres bosque, la Senda del Pinar de Navarredonda mide tres kilómetros y es de dificultad baja.
      Atraviesa un pinar maduro de pino silvestre, con ejemplares de más de un siglo, y está pensada para
      disfrutar de las aves: pico picapinos, arrendajo, trepador azul y carbonero garrapinos. Dos paneles y
      varios bancos permiten detenerse a observar flora y fauna.
    history: >-
      Muchas sendas de Gredos fueron caminos de pastores. La Vereda del Puerto de Candeleda es una vía
      pecuaria de la trashumancia que subía el ganado a los pastos frescos de verano de la vertiente norte, y
      la Senda del Puerto del Peón es una de las viejas trochas trashumantes, con restos del antiguo
      empedrado. En El Risquillo se conservan útiles de los oficios tradicionales, entre ellos los del
      resinado de los pinos. Entre los lugares con historia destaca la calzada romana del Puerto del Pico.
    before: >-
      La Senda de la Rubía empieza en el Puerto del Pico, a 1.395 m, y la de la Laguna Grande es de dificultad
      media-alta.
    around: >-
      Lejos de aquí, otros macizos comparten la cabra montés y el águila real en un paisaje de alta montaña:
      el [Parque Nacional y Natural de Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), con
      alta montaña y restos glaciares, el [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) y el
      [Parque Nacional da
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/). El [Pieniński
      Park Narodowy - Dunajec Gorge](/lugar/pieninski-park-narodowy---dunajec-gorge/), en cambio, comparte con
      Gredos el pino silvestre y los bosques maduros.
  en:
    intro: >-
      A colossal granite rampart that separates two river basins and filled with ice during glacial epochs.
      That is the Sierra de Gredos, at the southern tip of Ávila province: 86,236 hectares of sharp peaks,
      glacial tarns, cirques and gorges, crowned by Pico Almanzor at 2,592 metres, the highest point of the
      entire Central System. It is also the paramount stronghold of the [Spanish
      ibex](/especie/capra_pyrenaica/).
    landscape: >-
      Gredos rose during the Alpine Orogeny between 15 and 30 million years ago, when the Central System was
      uplifted and fractured into massive fault blocks. Then came the Quaternary. Torrential streams cut deep
      into the southern slopes while glaciers sculpted the north, leaving 41 mountain glaciers comprising
      valley, cirque and slope formations. Today you can admire glacial lakes, amphitheatre cirques, canyons
      and morainic deposits. Freeze-thaw gelifraction carved sharp spires and knife-edge crests, renowned for
      their rugged beauty.


      This great elevation is mirrored in altitudinal vegetation zones, representing 4 of the 5 bioclimatic
      zones of the Mediterranean region. On the northern face, summit dwarf scrub and broom heath predominate,
      with Scots pine only forming extensive stands around Navarredonda de Gredos and Hoyos del Espino.
      Conversely, the southern face abounds in maritime pine, interspersed with agricultural terraces of
      cherry trees, sweet chestnuts, fig trees and olive groves. Above 2,000 metres vegetation dwindles to
      dense dwarf broom and creeping juniper, and on the highest cirque crags the sole plant cover consists of
      saxicolous lichens.


      The greatest botanical values dwell in the rocks: Gredos chamomile, Gredos ironwort and wild mignonette
      grow wedged into granite crevices. In the lower reaches of southern gorges small stands of Portugal
      laurel persist.
    wildlife: >-
      Gredos is home to more than 230 catalogued vertebrate species. On the high summits, the Spanish ibex
      commands the cirque ridges, while the Almanzor salamander and Ávila snow vole complete the trio of local
      endemics. Among birds there are two endangered species, the [Spanish imperial
      eagle](/especie/aquila_adalberti/) and [black stork](/especie/ciconia_nigra/), along with vulnerable
      raptors such as the Egyptian vulture and [cinereous vulture](/especie/aegypius_monachus/). The [golden
      eagle](/especie/aquila_chrysaetos/), [griffon vulture](/especie/gyps_fulvus/), alpine accentor and
      common rock thrush are also present. Mammals include the Pyrenean desman, Iberian shrew, [Eurasian
      otter](/especie/lutra_lutra/) and [European wildcat](/especie/felis_silvestris/).
    visit: >-
      The Casa del Parque Pinos Cimeros in Hoyos del Espino is the finest trailhead for the northern slopes.
      There staff help plan excursions, an audiovisual presentation recounts the massif's geology, and a
      summit-mounted remote camera with 360° pan and zoom lets you scan the crags for ibex and raptors. On the
      southern slopes, El Risquillo offers an olfactory bank of mountain herbs, lighting displays explaining
      high-altitude species and a raptor identification game. Next to it, an accessible boardwalk leads
      through a maritime pine wood.


      The most classic hike sets out from the Plataforma car park at the end of the road from Hoyos del
      Espino, ascending a granite-flagged path to the Circo de Gredos. The Senda de la Laguna Grande, spanning
      6.40 km and roughly two and a half hours, climbs up to Los Barrerones before descending to the lake; it
      is graded medium-high difficulty. From the pass, the cirque and tarn suddenly emerge, the cold
      transparent waters mirroring Risco de la Ventana, Los Tres Hermanitos, Cuchillar de las Navajas and El
      Sagrao. Along the path you may spot Spanish ibex, Gredos common toad and Almanzor salamander.


      For forest walks, the Senda del Pinar de Navarredonda covers three kilometres at easy difficulty through
      a mature Scots pine wood with trees over a century old, designed for birdwatching: great spotted
      woodpeckers, Eurasian jays, Eurasian nuthatches and coal tits. Two panels and several benches invite
      quiet nature observation.
    history: >-
      Many trails in Gredos originated as pastoral routes. The Vereda del Puerto de Candeleda is a historic
      transhumance droveway along which herds ascended to cool summer pastures on the northern face, while the
      Senda del Puerto del Peón is an ancient drover trail retaining stretches of original stone paving. El
      Risquillo preserves tools from traditional trades, including pine resin harvesting. Foremost among
      historical landmarks is the Roman road climbing Puerto del Pico.
    before: >-
      The Senda de la Rubía starts at Puerto del Pico at 1,395 m, and the Laguna Grande hike is graded
      medium-high difficulty.
    around: >-
      Farther away, other mountain massifs share Spanish ibex and golden eagles in alpine scenery: [Sierra
      Nevada National and Natural Park](/lugar/parque-nacional-y-natural-de-sierra-nevada/), with high alpine
      peaks and glacial relict tarns, [Els Ports Natural Park](/lugar/parc-natural-dels-ports/) and
      [Peneda-Gerês National Park](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/).
      [Pieniny National Park - Dunajec Gorge](/lugar/pieninski-park-narodowy---dunajec-gorge/), by contrast,
      shares Scots pine and mature woodlands with Gredos.
  fr:
    intro: >-
      Un immense rempart de granit qui sépare deux bassins fluviaux et s'est englacé au cours des périodes
      glaciaires. C'est la Sierra de Gredos, à la bordure méridionale de la province d'Ávila : 86 236 hectares
      de crêtes ciselées, de lagunes, de cirques et de gorges, dominés par le pic Almanzor et ses 2 592
      mètres, toit de tout le Système central. C'est également le sanctuaire absolu du [bouquetin
      d'Espagne](/especie/capra_pyrenaica/).
    landscape: >-
      Gredos s'est soulevé lors de l'orogenèse alpine il y a entre 15 et 30 millions d'années, quand le
      Système central s'est haussé et morcelé en grands blocs. Puis vint le Quaternaire. Les eaux
      torrentielles ont entaillé le versant sud tandis que les glaces façonnaient le versant nord, y laissant
      41 glaciers de montagne répartis en glaciers de vallée, de cirque et de pente. On y observe aujourd'hui
      lacs glaciaires, cirques escarpés, gorges et cordons morainiques. Le gel et le dégel ont en outre
      façonné des crêtes acérées d'une beauté saisissante.


      Cette altitude se traduit par un étagement rigoureux de la végétation, couvrant 4 des 5 étages
      bioclimatiques de la région méditerranéenne. Sur le versant nord dominent les landes de genêts et de
      piornas sommitaux, les pinèdes de pin sylvestre ne formant de grands massifs qu'à Navarredonda de Gredos
      et Hoyos del Espino. Sur le versant sud prospèrent au contraire les pinèdes de pin maritime, parsemées
      de vergers en terrasses de cerisiers, châtaigniers, figuiers et oliviers. Au-delà de 2 000 mètres la
      végétation se réduit à une lande rase de genêts et de genévriers nains, les rochers les plus hauts du
      cirque n'abritant que des lichens silicicoles.


      Les trésors botaniques s'accrochent à la pierre : la camomille de Gredos, la crapaudine de Gredos et la
      réséda s'abritent dans les fissures. Dans le bas des gorges du versant sud subsistent de petits
      peuplements de lauriers du Portugal.
    wildlife: >-
      Gredos compte plus de 230 vertébrés répertoriés. Sur les sommets, le bouquetin d'Espagne règne sur les
      falaises, tandis que la salamandre de l'Almanzor et le campagnol des neiges complètent les endémismes
      locaux. Parmi les oiseaux figurent deux espèces menacées de disparition, l'[aigle
      ibérique](/especie/aquila_adalberti/) et la [cigogne noire](/especie/ciconia_nigra/), aux côtés de
      rapaces vulnérables comme le percnoptère et le [vautour moine](/especie/aegypius_monachus/). L'[aigle
      royal](/especie/aquila_chrysaetos/), le [vautour fauve](/especie/gyps_fulvus/), l'accenteur alpin et le
      monticole merle-de-roche sont également présents. Côté mammifères, on relève le desman des Pyrénées, la
      musaraigne ibérique, la [loutre d'Europe](/especie/lutra_lutra/) et le [chat
      forestier](/especie/felis_silvestris/).
    visit: >-
      La Maison du parc Pinos Cimeros, à Hoyos del Espino, constitue le point de départ idéal sur le versant
      nord. Une équipe vous aide à organiser la visite, une présentation audiovisuelle retrace l'histoire
      géologique du massif et une caméra panoramique 360° avec zoom télécommandée depuis le sommet permet de
      repérer bouquetins et rapaces. Sur le versant sud, El Risquillo propose un herbier olfactif des plantes
      de montagne, un dispositif lumineux interactif et un atelier de reconnaissance des rapaces. À proximité,
      un ponton en bois aménagé traverse une pinède de pin maritime.


      L'excursion classique démarre sur la Plataforma au terminus de la route d'Hoyos del Espino et monte par
      un chemin pavé de larges dalles de granit jusqu'au cirque de Gredos. La Senda de la Laguna Grande,
      longue de 6,40 km pour environ deux heures et demie, grimpe à Los Barrerones avant de redescendre vers
      le lac ; elle présente une difficulté moyenne-haute. Du col, le cirque et la lagune se révèlent soudain,
      leurs eaux froides et limpides reflétant le Risco de la Ventana, Los Tres Hermanitos et le Cuchillar de
      las Navajas. En chemin s'observent parfois le bouquetin d'Espagne, le crapaud de Gredos et la salamandre
      d'Almanzor.


      Si vous privilégiez la forêt, la Senda del Pinar de Navarredonda s'étend sur trois kilomètres avec une
      faible difficulté au milieu d'une futaie de pins sylvestres plus que centenaires, idéale pour
      l'ornithologie : pic épeiche, geai des chênes, sitelle torchepot et mésange noire. Deux panneaux et
      plusieurs bancs invitent à contempler flore et faune.
    history: >-
      De nombreux sentiers de Gredos furent d'antiques voies pastorales. La Vereda del Puerto de Candeleda est
      un chemin de transhumance historique emprunté par les troupeaux pour gagner les alpages d'été du versant
      nord, tout comme la Senda del Puerto del Peón, dont subsiste le caladage médiéval. À El Risquillo sont
      conservés les outils d'anciens métiers, notamment ceux du résinage du pin. Parmi les sites historiques
      remarquables figure la chaussée romaine du Puerto del Pico.
    before: >-
      La Senda de la Rubía commence au Puerto del Pico, à 1 395 m, et l'itinéraire de la Laguna Grande est de
      difficulté moyenne-haute.
    around: >-
      Plus loin, d'autres massifs partagent bouquetin d'Espagne et aigle royal dans un cadre alpin : le [Parc
      national et naturel de Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), avec ses
      hauts sommets et lagunes glaciaires, le [Parc naturel dels Ports](/lugar/parc-natural-dels-ports/) et le
      [Parc national de Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/).
      Le [Parc national des Piénines - Gorges du Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/)
      partage quant à lui pin sylvestre et forêts matures.
  de:
    intro: >-
      Ein gewaltiger Granitwall, der zwei Flusseinzugsgebiete trennt und während der Eiszeiten von Gletschern
      überformt wurde. Das ist die Sierra de Gredos am Südrand der Provinz Ávila: 86 236 Hektar schroffe
      Gipfel, Gebirgsseen, Kare und Schluchten, überragt vom 2.592 Meter hohen Pico Almanzor als Dach des
      gesamten Kastilischen Scheidegebirges. Zudem ist es die unbestrittene Hochburg des
      [Iberiensteinbocks](/especie/capra_pyrenaica/).
    landscape: >-
      Gredos hob sich während der Alpidischen Orogenese vor 15 bis 30 Millionen Jahren heraus, als das
      Scheidegebirge aufstieg und in Schollen zerbrach. Dann folgte das Quartär. Sturzbäche schnitten die
      Südseite ein, während Gletscher die Nordseite formten und 41 Gebirgsgletscher aus Tal-, Kar- und
      Hanglagen hinterließen. Heute zeugen Karseen, Felszirkusse, Schluchten und Moränen von dieser Zeit.
      Frostverwitterung meißelte zudem messerscharfe Felsgrate und Zinnen von wilder Schönheit.


      Diese Höhenlage spiegelt sich in Vegetationsstufen wider: Im Park sind 4 der 5 Vegetationsstufen der
      Mittelmeerregion vertreten. An der Nordflanke dominieren Zwergstrauchheiden und Ginsterfluren der
      Gipfel, während Wald-Kiefern nur bei Navarredonda de Gredos und Hoyos del Espino größere Bestände
      bilden. An der Südflanke wachsen dichte See-Kiefernwälder neben terrassierten Kulturen aus Kirschen,
      Kastanien, Feigen und Oliven. Oberhalb von 2.000 Metern weicht der Wald niederliegendem Ginster und
      Kriech-Wacholder, bis auf den höchsten Felsbändern nur noch Krustenflechten überleben.


      Die botanischen Kostbarkeiten siedeln im nackten Fels: Gredos-Kamille, Gredos-Gliedkraut und Färberwau
      klammern sich in schmale Felsritzen. In den tieferen Schluchten der Südseite überdauern Reliktbestände
      des Portugiesischen Kirschlorbeers.
    wildlife: >-
      Über 230 Wirbeltierarten sind in Gredos katalogisiert. Auf den Gipfelkämmen behauptet sich der
      Iberiensteinbock, während Almanzor-Salamander und Ávila-Schneemaus das Trio lokaler Endemiten
      vervollständigen. Unter den Vögeln brüten zwei stark gefährdete Arten, der [Spanische
      Kaiseradler](/especie/aquila_adalberti/) und der [Schwarzstorch](/especie/ciconia_nigra/), neben
      Schmutzgeier und [Mönchsgeier](/especie/aegypius_monachus/). Auch
      [Steinadler](/especie/aquila_chrysaetos/), [Gänsegeier](/especie/gyps_fulvus/), Alpenbraunelle und
      Steinrötel kommen vor. Bei den Säugetieren leben Pyrenäen-Desman, Iberische Spitzmaus, [Eurasische
      Fischotter](/especie/lutra_lutra/) und [Wildkatze](/especie/felis_silvestris/).
    visit: >-
      Das Besucherzentrum Casa del Parque Pinos Cimeros in Hoyos del Espino ist der beste Ausgangspunkt der
      Nordseite. Fachpersonal hilft bei der Tourenplanung, ein Dokumentarfilm schildert die Entstehung des
      Massivs, und über eine ferngesteuerte Kamera auf einem Felsgipfel mit 360°-Schwenk und Zoom lassen sich
      Steinböcke und Greifvögel beobachten. Auf der Südseite bietet El Risquillo ein Duftarchiv von
      Gebirgspflanzen, eine Lichtinstallation zu alpinen Arten und ein Vogelbestimmungsspiel. Daneben führt
      ein barrierefreier Holzbohlenweg durch einen See-Kiefernwald.


      Die beliebteste Route beginnt am Parkplatz der Plataforma hinter Hoyos del Espino und steigt auf einem
      granitgepflasterten Saumpfad zum Circo de Gredos an. Der Weg zur Laguna Grande misst 6,40 km,
      beansprucht rund zweieinhalb Stunden und steigt über Los Barrerones an, ehe er zum Bergsee abfällt; er
      weist mittleren bis hohen Anspruch auf. Am Pass öffnet sich unvermittelt der Blick auf das Felskar und
      den See, in dessen klarem Wasser sich markante Felszacken spiegeln. Unterwegs begegnet man oft
      Steinböcken, Gredos-Kröten und dem Almanzor-Salamander.


      Wer Wälder bevorzugt, wählt den einfachen, drei Kilometer langen Rundweg im Kiefernwald von Navarredonda
      mit über hundert Jahre alten Wald-Kiefern, ideal zur Vogelbeobachtung von Buntspecht, Eichelhäher,
      Kleiber und Tannenmeise. Zwei Schautafeln und Bänke laden zur Rast ein.
    history: >-
      Viele Pfade in Gredos waren historische Hirtenwege. Die Vereda del Puerto de Candeleda ist ein
      jahrhundertealter Viehtriebweg der Wanderschäferei zu den Sommerweiden der Nordseite, und die Senda del
      Puerto del Peón bewahrt ursprüngliche Pflasterungen. In El Risquillo werden traditionelle Werkzeuge
      aufbewahrt, darunter Gerätschaften der Harzgewinnung. Herausragendes Baudenkmal ist die Römerstraße über
      den Puerto del Pico.
    before: >-
      Die Senda de la Rubía beginnt am Puerto del Pico auf 1.395 m; die Tour zur Laguna Grande weist mittlere
      bis hohe Schwierigkeit auf.
    around: >-
      Weiter entfernt teilen andere Hochgebirge Steinbock und Steinadler: der [National- und Naturpark Sierra
      Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/) mit eiszeitlichen Karseen, der [Parc Natural
      dels Ports](/lugar/parc-natural-dels-ports/) und der [Nationalpark
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/). Der [Nationalpark
      Pieninen - Dunajec-Schlucht](/lugar/pieninski-park-narodowy---dunajec-gorge/) teilt Wald-Kiefern und
      Bergwälder mit Gredos.
  it:
    intro: >-
      Un baluardo di granito che divide due bacini idrografici e che durante le glaciazioni si ricoprì di
      ghiaccio. Questa è la Sierra de Gredos, al margine meridionale della provincia di Ávila: 86 236 ettari
      di creste affilate, lagune, circhi e gole, dominati dai 2.592 metri del picco Almanzor, vetta culminante
      dell'intero Sistema Centrale. È, inoltre, il regno incontrastato dello [stambecco
      iberico](/especie/capra_pyrenaica/).
    landscape: >-
      Gredos si sollevò durante l'Orogenesi Alpina, tra 15 e 30 milioni di anni fa, quando il Sistema Centrale
      fu dislocato in grandi blocchi tettonici. Poi subentrò il Quaternario. I torrenti incisero a fondo il
      versante meridionale mentre il gelo modellò il settore nord, lasciando 41 ghiacciai montani distribuiti
      in valli, circhi e pendii. Oggi si ammirano laghi glaciali, anfiteatri rocciosi, forre e cordoni
      morenici. Il gelo e il disgelo hanno scolpito guglie e creste frastagliate di grande fascino.


      La quota si rispecchia nella zonazione floristica, che copre 4 dei 5 piani bioclimatici dell'area
      mediterranea. Sul versante nord dominano le brughiere d'alta quota e le ginestre, con pinete di pino
      silvestre sviluppate soprattutto a Navarredonda de Gredos e Hoyos del Espino. Sul versante sud
      prevalgono invece pinete di pino marittimo, frammiste a terrazzamenti coltivati a ciliegi, castagni,
      fichi e ulivi. Oltre i 2.000 metri la vegetazione si riduce a ginestrete nane e ginepri striscianti,
      mentre sulle vette più aspre allignano solo licheni silicicoli.


      Il pregio floristico risiede nelle fenditure rocciose: la camomilla di Gredos, la siderite di Gredos e
      la reseda crescono aggrappate alle rupi. Nelle parti basse delle gole meridionali resistono rari nuclei
      di lauroceraso del Portogallo.
    wildlife: >-
      Gredos annovera oltre 230 specie di vertebrati. Sulle vette, lo stambecco occupa le balze dei circhi,
      mentre la salamandra dell'Almanzor e l'arvicola delle nevi completano gli endemismi locali. Tra i
      volatili figurano due specie in pericolo d'estinzione, l'[aquila imperiale
      iberica](/especie/aquila_adalberti/) e la [cicogna nera](/especie/ciconia_nigra/), oltre a specie
      vulnerabili quali capovaccaio e [avvoltoio monaco](/especie/aegypius_monachus/). L'[aquila
      reale](/especie/aquila_chrysaetos/), il [grifone](/especie/gyps_fulvus/), il sordone e il codirossone
      popolano i dirupi. Tra i mammiferi compaiono il desman dei Pirenei, il toporagno iberico, la [lontra
      europea](/especie/lutra_lutra/) e il [gatto selvatico](/especie/felis_silvestris/).
    visit: >-
      La Casa del Parque Pinos Cimeros a Hoyos del Espino è il cardine per le escursioni sul versante nord. Il
      personale assiste nella pianificazione dei percorsi, un filmato documenta l'evoluzione geologica e una
      videocamera su una cima, manovrabile a 360° con zoom, consente di individuare stambecchi e rapaci. Sul
      versante sud, El Risquillo offre un laboratorio olfattivo di erbe aromatiche, percorsi luminosi e giochi
      didattici. Accanto, una passerella in legno attraversa la pineta di pino marittimo.


      La salita classica muove dal parcheggio della Plataforma al termine della strada di Hoyos del Espino e
      sale su un sentiero lastricato in granito verso il Circo di Gredos. La Senda de la Laguna Grande, di
      6,40 km e circa due ore e mezza di cammino, sale a Los Barrerones prima di calare alla conca lacustre;
      presenta difficoltà medio-alta. Dal valico, il circo e il lago compaiono improvvisamente, specchiando
      nelle acque gelide il Risco de la Ventana, Los Tres Hermanitos e il Cuchillar de las Navajas. Lungo il
      sentiero non è raro scorgere stambecchi, rospi di Gredos e la salamandra di Almanzor.


      Se preferisci il bosco, la Senda del Pinar de Navarredonda copre tre chilometri a difficoltà bassa in
      una pineta matura di pino silvestre con fusti di oltre un secolo, pensata per il birdwatching di picchio
      rosso maggiore, ghiandaia, picchio muratore e cincia mora. Due pannelli e alcune panchine invitano alla
      sosta.
    history: >-
      Molti tracciati di Gredos nacquero come sentieri pastorali. La Vereda del Puerto de Candeleda è
      un'antica via di transumanza per salire il bestiame ai pascoli estivi settentrionali, così come la Senda
      del Puerto del Peón, che conserva tratti del selciato originale. A El Risquillo sono conservati attrezzi
      dei mestieri tradizionali, tra cui quelli per l'estrazione della resina. Spicca sul piano archeologico
      la strada romana del Puerto del Pico.
    before: >-
      La Senda de la Rubía parte dal Puerto del Pico a 1.395 m, e il tracciato della Laguna Grande è di
      difficoltà medio-alta.
    around: >-
      Più lontano, altri massicci condividono stambecco e aquila reale in paesaggi alpini: il [Parque Nacional
      y Natural de Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), con vette innevate e
      lagune d'alta quota, il [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) e il [Parque Nacional
      da Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/). Il [Parco
      Nazionale Pieniny - Gola del Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) condivide invece
      pino silvestre e boschi vetusti.
  pt:
    intro: >-
      Uma colossal muralha de granito que divide duas bacias hidrográficas e que durante as glaciações se
      cobriu de gelo. Essa é a Sierra de Gredos, no extremo sul da província de Ávila: 86 236 hectares de
      cristas afiadas, lagoas, circos e gargantas, coroados pelo Almanzor com 2.592 metros, ponto culminante
      de todo o Sistema Central. É, além disso, o reduto por excelência da
      [cabra-montês-ibérica](/especie/capra_pyrenaica/).
    landscape: >-
      Gredos ergueu-se durante a Orogenia Alpina há entre 15 e 30 milhões de anos, quando o Sistema Central se
      elevou e fraturou em blocos. Mais tarde chegou o Quaternário. As águas torrenciais escavaram a vertente
      sul, enquanto os glaciares moldaram a vertente norte, originando 41 glaciares de montanha distribuídos
      por vales, circos e encostas. Hoje podem contemplar-se lagoas glaciares, anfiteatros rochosos,
      desfiladeiros e moreias. A gelifração talhou ainda cristas escarpadas de invulgar beleza.


      A altitude manifesta-se nos andares de vegetação, reunindo o parque 4 dos 5 andares bioclimáticos da
      região mediterrânica. Na vertente norte dominam os matos rasteiros e os piornais de cumeada, ao passo
      que os pinhais de pinheiro-silvestre só formam extensões consideráveis em Navarredonda de Gredos e Hoyos
      del Espino. Na vertente sul abundam os pinhais de pinheiro-bravo, intercalados com socalcos agrícolas de
      cerejeiras, castanheiros, figueiras e oliveiras. Acima dos 2.000 metros a vegetação cede a piornais
      densos e zimbros-rasteiros, restando nos cumes apenas líquenes saxícolas.


      O maior tesouro florístico mora nas fendas rochosas: a camomila-de-gredos, a siderite-de-gredos e o
      gualdroncillo crescem agarrados à pedra. Nos troços baixos das gargantas do sul sobrevivem núcleos de
      azereiro.
    wildlife: >-
      Gredos soma mais de 230 vertebrados catalogados. Nos cumes, a cabra-montês ocupa as cristas rochosas,
      completando a salamandra-do-almanzor e a ratazana-das-neves os endemismos locais. Entre a avifauna
      figuram duas espécies em perigo de extinção, a [águia-imperial-ibérica](/especie/aquila_adalberti/) e a
      [cegonha-preta](/especie/ciconia_nigra/), além de espécies vulneráveis como o abutre-do-egito e o
      [abutre-preto](/especie/aegypius_monachus/). A [águia-real](/especie/aquila_chrysaetos/), o
      [abutre-fouveiro](/especie/gyps_fulvus/), a ferreirinha-alpina e o melro-das-rochas também marcam
      presença. Nos mamíferos encontram-se a toupeira-da-água, o musaranho-ibérico, a
      [lontra-europeia](/especie/lutra_lutra/) e o [gato-bravo](/especie/felis_silvestris/).
    visit: >-
      A Casa del Parque Pinos Cimeros, em Hoyos del Espino, é o ponto de partida ideal para a vertente norte.
      Ali a equipa ajuda a planear o passeio, um documentário relata a história geológica e uma câmara num
      pico com rotação de 360° e zoom permite procurar cabras e rapinas. Na vertente sul, El Risquillo
      disponibiliza um mostruário olfativo de plantas aromáticas, esquemas iluminados e um jogo de
      identificação de aves. Junto ao centro, um passadiço de madeira percorre um pinhal de pinheiro-bravo.


      A caminhada mais célebre parte do parque da Plataforma no final da estrada de Hoyos del Espino e sobe
      por uma calçada granítica até ao Circo de Gredos. A Senda de la Laguna Grande, com 6,40 km e cerca de
      duas horas e meia, ascende a Los Barrerones antes de descer para a lagoa; tem dificuldade média-alta. Do
      alto, o circo e a lagoa revelam-se num relance, espelhando nas águas límpidas o Risco de la Ventana, Los
      Tres Hermanitos e o Cuchillar de las Navajas. No percurso podem avistar-se cabras-monteses,
      sapos-de-gredos e a salamandra-do-almanzor.


      Se preferires bosque, o trilho do Pinar de Navarredonda tem três quilómetros com baixa dificuldade num
      pinhal maduro de pinheiro-silvestre com exemplares com mais de um século, ideal para observar pica-paus,
      gaios, trepadeiras-azuis e chapins-pretos. Dois painéis e vários bancos convidam ao descanso.
    history: >-
      Muitos trilhos de Gredos foram caminhos de pastores. A Vereda del Puerto de Candeleda é um caminho de
      transumância por onde o gado subia para as pastagens frescas de verão na vertente norte, tal como a
      Senda del Puerto del Peón, com vestígios da antiga calçada. Em El Risquillo preservam-se alfaias
      tradicionais, incluindo as da resinagem. No património histórico ressalta a calçada romana do Puerto del
      Pico.
    before: >-
      A Senda de la Rubía principia no Puerto del Pico a 1.395 m, e o trilho da Laguna Grande exige preparo
      físico de dificuldade média-alta.
    around: >-
      Mais longe, outros maciços partilham a cabra-montês e a águia-real em ambiente de alta montanha: o
      [Parque Nacional e Natural de Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), com
      lagoas glaciares, o [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) e o [Parque Nacional da
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/). O [Parque
      Nacional Pieniny - Garganta do Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) partilha
      pinheiro-silvestre e florestas maduras.
