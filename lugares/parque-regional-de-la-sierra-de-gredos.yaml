resumen:
  es: >-
    El espinazo granítico del Sistema Central (Almanzor 2.592 m) con circos glaciares, la Laguna Grande y la
    cabra montés de Gredos.
  en: >-
    The granite spine of the Central System (Almanzor 2,592 m) featuring glacial cirques, Laguna Grande and
    the Gredos ibex.
  fr: >-
    L'épine dorsale granitique du Système central (Almanzor 2 592 m) avec cirques glaciaires, la Laguna Grande
    et le bouquetin de Gredos.
  de: >-
    Das Granitrückgrat des Kastilischen Scheidegebirges (Almanzor 2.592 m) mit Gletscherkaren, der Laguna
    Grande und dem Gredos-Steinbock.
  it: >-
    La spina dorsale granitica del Sistema Centrale (Almanzor 2.592 m) con circhi glaciali, la Laguna Grande e
    lo stambecco di Gredos.
  pt: >-
    A espinha dorsal granítica do Sistema Central (Almanzor 2.592 m) com circos glaciares, a Laguna Grande e a
    cabra-montês de Gredos.
unico:
  es: >-
    Tres endemismos locales viven en sus cumbres, la cabra montés, la salamandra del Almanzor y el topillo
    nival abulense, en un macizo que conserva uno de los mejores conjuntos glaciares del sur de Europa.
  en: >-
    Three local endemics inhabit its high summits, the Spanish ibex, Almanzor salamander and Ávila snow vole,
    in a massif preserving one of southern Europe's finest glacial landscapes.
  fr: >-
    Trois espèces endémiques locales habitent ses crêtes, le bouquetin d'Espagne, la salamandre de l'Almanzor
    et le campagnol des neiges d'Ávila, au sein d'un massif abritant l'un des plus beaux ensembles glaciaires
    d'Europe du Sud.
  de: >-
    Drei lokale Endemiten bewohnen die Hochgipfel, der Iberiensteinbock, der Almanzor-Salamander und die
    Ávila-Schneemaus, in einem Gebirgsmassiv mit einem der bedeutendsten Gletscherensembles Südeuropas.
  it: >-
    Tre endemismi locali popolano le sue vette, lo stambecco iberico, la salamandra dell'Almanzor e l'arvicola
    delle nevi di Ávila, in un massiccio che racchiude uno dei migliori complessi glaciali dell'Europa
    meridionale.
  pt: >-
    Três endemismos locais habitam os seus cumes, a cabra-montês-ibérica, a salamandra-do-almanzor e a
    ratazana-das-neves de Ávila, num maciço que resguarda um dos melhores conjuntos glaciares do sul da
    Europa.
