resumen:
  es: >-
    Un circo de erosión volcánica colosal de 8 km de diámetro y 1.500 m de profundidad rodeado de pinares
    canarios verticales (*Pinus canariensis*).
  en: >-
    A colossal volcanic erosion cirque 8 km in diameter and 1,500 m deep, rimmed by precipitous Canary Island
    pine forests (*Pinus canariensis*).
  fr: >-
    Un colossal cirque d’érosion volcanique de 8 km de diamètre et 1 500 m de profondeur ceinturé de pinèdes
    canariennes vertigineuses (*Pinus canariensis*).
  de: >-
    Gewaltiger vulkanischer Erosionskessel von 8 km Durchmesser und 1.500 m Tiefe, umrahmt von steilen
    Kanarenkiefernwäldern (*Pinus canariensis*).
  it: >-
    Un colossale circo di erosione vulcanica di 8 km di diametro e 1.500 m di profondità cinto da vertiginose
    pinete canarie (*Pinus canariensis*).
  pt: >-
    Um colossal circo de erosão vulcânica com 8 km de diâmetro e 1.500 m de desnível contornado por pinhais
    canários verticais (*Pinus canariensis*).
unico:
  es: >-
    Una caldera que guarda su agua, su pinar y sus plantas endémicas gracias a más de cuatrocientos años de
    protección del agua.
  en: >-
    A caldera that preserves its water, pine woodlands and endemic flora thanks to more than four hundred
    years of community water conservation.
  fr: >-
    Une caldeira qui a préservé ses eaux, sa pinède et sa flore endémique grâce à plus de quatre cents ans de
    gestion collective de l’eau.
  de: >-
    Eine Caldera, die ihr Wasser, ihren Kiefernurwald und endemische Pflanzen dank über vierhundertjährigem
    gemeinschaftlichem Wasserschutz bewahrt hat.
  it: >-
    Una caldera che custodisce le sue acque, la pineta e piante endemiche grazie a oltre quattrocento anni di
    tutela idrica comunitaria.
  pt: >-
    Uma caldeira que preserva as suas águas, pinhais e flora endémica graças a mais de quatrocentos anos de
    regulação comunitária da água.
observaciones:
  es: >-
    Camina siempre acompañado, no te salgas de los senderos señalizados, no empieces a caminar después del
    mediodía y evita el parque con lluvia o viento fuerte, por el riesgo de desprendimientos. El sendero de La
    Cumbrecita a la zona de acampada es muy peligroso, no recomendable con vértigo, y sufre desprendimientos
    durante el año: consulta su estado en el centro de visitantes antes de salir. Para acampar hace falta
    tramitar antes un permiso en el centro de visitantes de El Paso.
texto:
  es:
    intro: >-
      Imagina un anfiteatro de roca cuyas gradas llegan a 2426 metros y cuyo fondo está entre 600 y 900 metros
      sobre el mar. Esa es la Caldera de Taburiente, en el centro de La Palma, con el Roque de los Muchachos
      como punto más alto, donde se levanta el observatorio astrofísico. Su única salida natural es el
      barranco de las Angustias, adonde confluyen las cuencas de Taburiente y Almendro Amargo y por donde el
      agua llega al mar. Es parque nacional desde 1954.
    landscape: >-
      El agua manda aquí. Cerca de 1.800 hacendados aprovechan el agua de más de 70 manantiales y galerías de
      la Caldera, y el Heredamiento de las Haciendas de Argual y Tazacorte prohibía en sus ordenanzas talar
      árboles e introducir ganado en el interior para conservar las fuentes. Gracias a esa conciencia
      ecológica, nacida hace más de 400 años, la Caldera llegó a nuestros días con sus recursos naturales casi
      intactos. El río Almendro Amargo baja amarillo rojizo por los materiales férricos de la zona, y la
      Cascada de Colores debe sus tonalidades al musgo que la tapiza y a las aguas ferruginosas. Los roques
      del interior tienen, según los últimos estudios geológicos, un origen sedimentario ligado sobre todo a
      avalanchas.


      La vegetación se ordena por pisos. En el fondo y las laderas manda el pinar de pino canario, acompañado
      por el amagante; el pino tolera los incendios gracias a su adaptación al fuego volcánico: se quema la
      corteza, pero por dentro sigue vivo. En el interior hay monteverde de faya y brezo que condensa las
      brumas y aporta agua al terreno. En las paredes crece flora rupícola, con bejeques de los géneros
      Aeonium y Greenovia. Y arriba, por encima de 1700 metros, aparecen el codeso, el cedro de Canarias, el
      pensamiento de las cumbres, el tajinaste azul y el retamón. La Caldera cuenta con 380 especies
      catalogadas de plantas vasculares.
    wildlife: >-
      Entre las aves endémicas de la Macaronesia destacan la [paloma rabiche](/especie/columba_junoniae/), el
      canario, el bisbita caminero y el vencejo unicolor. La graja o [chova
      piquirroja](/especie/pyrrhocorax_pyrrhocorax/) se ve con facilidad en las zonas altas. Hay tres especies
      de murciélagos, entre ellas el murciélago de Madeira y el orejudo canario, y entre los reptiles el
      lagarto tizón y la salamanquesa. A 2000 metros hay una cueva con un escarabajo cavernícola endémico de
      La Palma, sin ojos ni pigmentación.


      La amenaza tiene cuatro patas: el arruí, las cabras y los conejos, que perjudican a las plantas
      endémicas. Por eso se levantan parcelas valladas para repoblar y producir semillas, y se hace un
      seguimiento individualizado del retamón y de la violeta de cumbre desde 1988. Los programas buscan
      recuperar el paisaje anterior a la llegada humana, hace algo más de 2000 años.
    visit: >-
      Dentro del parque se anda a pie. El centro de visitantes de El Paso es el punto de partida: tiene sala
      de exposiciones sobre geología, hidrología, vida animal y vegetal y medio humano, y un jardín botánico
      didáctico de plantas endémicas. De allí sale la carretera de 7 km al mirador de La Cumbrecita, el punto
      más visitado, donde por la mañana se regula el acceso de vehículos porque el aparcamiento tiene pocas
      plazas. A Los Brecitos se sube por una pista y se puede subir en coche a ver el paisaje, pero no se
      permite aparcar. El mirador del Roque de los Muchachos es el punto más alto del parque y de la isla, y
      por su carretera no hay transporte regular.


      La ruta de referencia es Los Brecitos–Caldera, circular de 12,5 km y unas seis horas, de dificultad
      alta: desciende entre pinares hacia el interior. Otras opciones: de la zona de acampada al barranco de
      las Angustias, por un pinar y luego un barranco con diques, aguas ferruginosas, roques y lavas
      almohadilladas; la subida al Pico Bejenado, entre lavas cordadas y tubos volcánicos hasta uno de los
      mejores miradores; y desde el Roque de los Muchachos, la parte más alta de la isla, con vistas sobre el
      mar de nubes.
    history: >-
      El bando de la Caldera era Aceró, y su último mencey fue Tanausú. La Caldera era un lugar ideal para
      llevar los ganados cuando faltaban pastos en otras partes, y en el barranco de Tajodeque una cueva
      guarda grabados que parecen signos del alfabeto bereber. Por su topografía accidentada, la Caldera ha
      permanecido casi despoblada: sus usos fueron el pastoreo de cabras y luego el aprovechamiento del agua.
      El parque nacional se declaró en 1954 por decreto, a instancias de artistas y estudiosos.
    before: >-
      Camina siempre acompañado, no te salgas de los senderos señalizados, no empieces a caminar después del
      mediodía y evita el parque con lluvia o viento fuerte, por el riesgo de desprendimientos. El sendero de
      La Cumbrecita a la zona de acampada es muy peligroso, no recomendable con vértigo, y sufre
      desprendimientos durante el año: consulta su estado en el centro de visitantes antes de salir. Para
      acampar hace falta tramitar antes un permiso en el centro de visitantes de El Paso.
  en:
    intro: >-
      Picture a vast rock amphitheatre whose tiered crests reach 2426 metres, plunging down to a caldera floor
      resting between 600 and 900 metres above sea level. This is the Caldera de Taburiente at the heart of La
      Palma, crowned by the Roque de los Muchachos as its highest point, where the international astrophysical
      observatory stands. Its sole natural drainage outlet is the Barranco de las Angustias gorge, where the
      Taburiente and Almendro Amargo watersheds converge to reach the Atlantic. It has been a national park
      since 1954.
    landscape: >-
      Water rules this mountain sanctuary. Around 1,800 landholders tap the pure mountain flow from over 70
      natural springs and gallery adits across the Caldera, protected by ancestral bylaws of the Heredamiento
      de las Haciendas de Argual y Tazacorte that strictly banned felling trees and introducing livestock.
      Born over 400 years ago, this early conservation ethos enabled the Caldera to reach modern times with
      its ecosystems remarkably intact. The Almendro Amargo stream runs ochre-red from iron minerals, while
      the Cascada de Colores displays vivid mineral greens and oranges where mosses thrive amid ferruginous
      seepages. Interior monoliths, known as roques, are now understood as sedimentary breccias formed by
      catastrophic volcanic debris avalanches.


      Vegetation is zoned in altitudinal belts. Along the floor and lower slopes dominates the endemic Canary
      Island pine, accompanied by amagante rockroses; the pine withstands periodic wildfires through thick
      protective bark that shields living inner tissues. In humid gullies, laurel-forest elements such as faya
      and tree heath trap oceanic trade-wind mist. Precipitous cliff faces harbour specialized rupicolous
      flora, including houseleek succulents of Aeonium and Greenovia. Higher up, above 1700 metres, alpine
      scrub takes over with yellow broom, Canary cedar, summit pansy, blue bugloss and mountain dock. The
      Caldera encompasses 380 catalogued vascular plant species.
    wildlife: >-
      Macaronesian endemic avifauna features the [white-tailed laurel pigeon](/especie/columba_junoniae/),
      Atlantic canary, Berthelot's pipit and plain swift. The [red-billed
      chough](/especie/pyrrhocorax_pyrrhocorax/), known locally as the graja, is frequently spotted soaring
      across high crags. Three bat species reside here, notably the Madeira pipistrelle and Canary big-eared
      bat, while reptiles include the western Canaries lizard and Delande's gecko. At an altitude of 2000
      metres lies a lava cave sheltering a blind, unpigmented subterranean beetle endemic to La Palma.


      The principal ecological threat comes on four hooves: introduced Barbary sheep, feral goats and rabbits
      that browse vulnerable endemic plants. Enclosed fenced plots have been constructed to encourage
      regeneration and seed gathering, alongside targeted monitoring of mountain broom and the summit violet
      underway since 1988. Conservation programmes seek to restore the vegetation patterns that predated human
      arrival slightly more than 2000 years ago.
    visit: >-
      All travel within the national park is on foot. The El Paso visitor centre is the logical gateway: it
      features interpretive halls covering volcanology, hydrology and plant life, complemented by an outdoor
      botanical garden of Canarian endemics. From here, a 7 km mountain road winds to the La Cumbrecita
      viewpoint, the most visited outlook, where vehicle access is regulated in the morning due to limited
      parking. Los Brecitos is accessible via an unpaved forest track by car for sightseeing, though parking
      is strictly forbidden. The summit lookout at Roque de los Muchachos crowns the park and island,
      accessible via high-altitude roads without scheduled public transport.


      The quintessential hike is the Los Brecitos to Caldera circuit, a challenging 12.5 km trek taking around
      six hours descending through towering pine groves into the abyss. Other routes explore the campsite to
      Barranco de las Angustias gorge with pillow lavas and iron waterfalls; the climb up Pico Bejenado across
      corded pahoehoe lavas; and high traverses from Roque de los Muchachos overlooking the sea of clouds.
    history: >-
      In pre-Hispanic times, the Caldera formed the indigenous cantón of Aceró, led by its legendary mencey
      Tanausú. It was a seasonal refuge for goat herds during low-elevation droughts; in the Barranco de
      Tajodeque, cave shelters hold geometric engravings resembling ancient Berber scripts. Due to rugged
      topography, the Caldera remained largely unsettled, used solely for goat pastoralism and subsequently
      water harvesting. The national park was created by decree in 1954 following advocacy by artists and
      scientists.
    before: >-
      Always hike accompanied, keep strictly to marked trails, avoid starting descents in late afternoon, and
      avoid the park during heavy rain or high winds due to severe rockfall risk. The trail connecting La
      Cumbrecita to the camping area is exposed and hazardous, subject to seasonal landslides: check its
      status at the visitor centre beforehand. Camping requires a mandatory advance permit obtained at the El
      Paso visitor centre.
  fr:
    intro: >-
      Imaginez un immense amphithéâtre rocheux dont les crêtes s’élèvent à 2426 mètres et dont le fond repose
      entre 600 et 900 mètres d’altitude. C’est la Caldera de Taburiente, au cœur de La Palma, dominée par le
      Roque de los Muchachos où s’élève le célèbre observatoire astrophysique. Son unique exutoire naturel est
      le barranco de las Angustias, où se rejoignent les bassins versants de Taburiente et d’Almendro Amargo
      pour mener l’eau vers la mer. Le site est érigé en parc national depuis 1954.
    landscape: >-
      Ici l’eau est reine. Près de 1 800 exploitants bénéficient des eaux de plus de 70 sources et galeries de
      captage, protégées dès le XVIe siècle par les ordonnances du Heredamiento de las Haciendas de Argual y
      Tazacorte qui prohibaient l’abattage d’arbres et l’entrée du bétail pour préserver les résurgences.
      Grâce à cette gestion collective née il y a plus de 400 ans, la caldeira est parvenue jusqu’à nous
      presque intacte. Le torrent Almendro Amargo roule des eaux jaune-orangé chargées de fer, et la Cascada
      de Colores doit ses teintes bigarrées aux mousses et aux dépôts ferreux. Les pitons rocheux intérieurs
      résultent d’avalanches de débris volcaniques anciennes.


      La végétation s’étage par niveaux. Au fond et sur les versants domine le pin des Canaries, capable de
      survivre aux feux volcaniques grâce à son écorce isolante. Dans les ravins humides, la laurisylve de
      faya et de bruyère arborescente capte l’humidité des alizés. Sur les parois rocheuses s’accrochent
      diverses joubarbes des genres Aeonium et Greenovia. Plus haut, au-delà de 1700 mètres, apparaissent le
      genêt des sommets, le cèdre des Canaries, la violette de montagne et la vipérine bleue. La caldeira
      compte 380 espèces cataloguées de plantes vasculaires.
    wildlife: >-
      Parmi l’avifaune endémique de Macaronésie nichent le [pigeon de Madère](/especie/columba_junoniae/), le
      serin des Canaries, le pipit de Berthelot et le martinet unicolore. Le [crave à bec
      rouge](/especie/pyrrhocorax_pyrrhocorax/), ou graja, se remarque aisément sur les cimes. On compte trois
      espèces de chauves-souris et plusieurs reptiles endémiques. À 2000 mètres d'altitude, une cavité
      volcanique abrite un coléoptère cavernicole aveugle et dépigmenté exclusif de l'île.


      La principale pression sur la flore découle d'animaux introduits : le mouflon à manchettes, les chèvres
      férales et les lapins. Des enclos d'exclusion ont été aménagés et un suivi du genêt des sommets est
      assuré depuis 1988, cherchant à restaurer l'écosystème d'avant l'arrivée humaine survenue il y a un peu
      plus de 2000 ans.
    visit: >-
      La découverte se fait impérativement à pied. Le centre d'accueil d’El Paso constitue le départ logique :
      il abrite des salles sur la géologie et un jardin botanique de flore canarienne. De là part la route de
      7 km montant au belvédère de La Cumbrecita, où l’accès automobile est régulé le matin par manque de
      stationnement. La piste de Los Brecitos est ouverte aux voitures pour la vue, mais le stationnement y
      est interdit. Le sommet du Roque de los Muchachos est dépourvu de navettes publiques régulières.


      L'itinéraire de référence est la boucle Los Brecitos–Caldeira, circuit sportif de 12,5 km et environ six
      heures de descente à travers les pinèdes. D'autres parcours arpentent le lit du barranco de las
      Angustias, gravissent le Pico Bejenado ou longent les crêtes au-dessus de la mer de nuages.
    history: >-
      Avant la conquête, le territoire portait le nom d'Aceró et était défendu par le chef Tanausú. Les
      bergers y montaient en période de sécheresse ; dans le barranco de Tajodeque, des gravures rupestres
      évoquent l'alphabet libyco-berbère. La caldeira est restée déserte grâce à son relief abrupt. Le parc
      national fut officialisé en 1954 à la demande d'artistes et de scientifiques.
    before: >-
      Ne partez jamais seul, restez sur les chemins balisés et évitez les fonds de gorge en cas d'averses en
      raison des chutes de pierres. Le sentier reliant La Cumbrecita au campement est vertigineux et sujet aux
      éboulements. Le bivouac sous tente exige une autorisation préalable délivrée au centre d'El Paso.
  de:
    intro: >-
      Ein Felsenamphitheater, dessen Ränder bis auf 2426 Meter ansteigen und dessen Kesselboden zwischen 600
      und 900 Metern über dem Atlantik liegt. Das ist die Caldera de Taburiente auf La Palma, gekrönt vom
      Roque de los Muchachos, dem Standort der internationalen Sternwarten. Einziger natürlicher Abfluss ist
      der Barranco de las Angustias, in dem sich die Schluchtenbäche sammeln und zum Meer fließen. Der
      Nationalpark besteht seit 1954.
    landscape: >-
      Das Wasser bestimmt diesen Ort. Rund 1.800 Landwirte nutzen das Trink- und Bewässerungswasser aus über
      70 Quellen und Stollen der Caldera. Bereits vor über 400 Jahren erließen die Grundbesitzer von Argual
      und Tazacorte strenge Waldschutzordnungen, um die Quellgebiete vor Kahlschlag und Viehtritt zu bewahren.
      Der Fluss Almendro Amargo schimmert durch Eisenverbindungen ockergelb, während der Wasserfall Cascada de
      Colores durch Moosbeläge und mineralische Sickerwässer leuchtet. Die mächtigen Felsnadeln im
      Kesselinneren entstanden durch prähistorische Gerölllawinen.


      Die Vegetation gliedert sich nach Höhenstufen. Auf den Hängen dominiert die Kanarische Kiefer, deren
      dicke Borke selbst Waldbrände überdauert. In feuchten Schluchten gedeiht Lorbeerwald, der die
      Passatnebel auskämmt. An den Felswänden wachsen Dickblattgewächse der Gattungen Aeonium und Greenovia.
      Oberhalb von 1700 Metern setzen sich Hochgebirgsbüsche wie Ginster, Wacholder und die blaue
      Teide-Natterkopf durch. Die Caldera zählt 380 katalogisierte Gefäßpflanzenarten.
    wildlife: >-
      Zu den endemischen Vogelarten zählen die [Lorbeertaube](/especie/columba_junoniae/), der Kanarienvogel,
      der Kanarenpieper und der Einfarbsegler. Die [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/) kreist
      regelmäßig an den Felsabstürzen. Drei Fledermausarten und endemische Eidechsen bewohnen das Gebiet. Auf
      2000 Metern Höhe verbirgt sich in einer Lavahöhle ein augenloser, ungebleichter Höhlenkäfer.


      Bedrohungen gehen von eingeführten Säugern aus: Mähnenspringer, verwilderte Ziegen und Wildkaninchen
      verbeißen Jungpflanzen. Seit 1988 werden daher eingezäunte Schutzgatter unterhalten, um die
      Florenverhältnisse vor der menschlichen Besiedlung vor etwas mehr als 2000 Jahren zu regenerieren.
    visit: >-
      Im Nationalpark bewegt man sich ausschließlich zu Fuß fort. Das Besucherzentrum in El Paso dient als
      idealer Ausgangspunkt: Es verfügt über Ausstellungsräume zu Geologie, Hydrologie, Tier- und Pflanzenwelt
      sowie zur menschlichen Siedlungsgeschichte, ergänzt durch einen didaktischen botanischen Garten mit
      einheimischen Pflanzenarten. Von dort zweigt die 7 km lange Bergstraße zum Aussichtspunkt La Cumbrecita
      ab, dem meistbesuchten Punkt des Parks, wo der Fahrzeugzugang morgens streng reguliert wird, da der
      Parkplatz nur wenige Stellplätze bietet. Nach Los Brecitos führt eine unbefestigte Piste; man kann zwar
      mit dem Auto hinauffahren, um das Panorama zu betrachten, das Parken ist dort jedoch verboten. Der
      Aussichtspunkt am Roque de los Muchachos bildet den höchsten Punkt des Parks und der gesamten Insel,
      wird jedoch von keinem regulären öffentlichen Nahverkehr angefahren.


      Die klassische Hauptroute ist der Rundweg Los Brecitos–Caldera über 12,5 km und rund sechs Stunden
      Gehzeit von hohem Anspruch: Er führt steil bergab durch hochgewachsene Kiefernwälder ins Herz des
      Kessels. Weitere lohnende Optionen: vom Zeltplatz hinab in die Schlucht Barranco de las Angustias durch
      Kiefernwälder und eine bizarre Klamm mit Vulkangängen, eisenhaltigen Quellen, Felsmonolithen und
      Kissenlaven; der Aufstieg auf den Pico Bejenado zwischen Stricklaven und Lavatunneln zu einem der
      schönsten Panoramen der Kanaren; oder Rundtouren vom Roque de los Muchachos aus, dem höchsten Inseldach
      mit grandiosen Ausblicken über das weite Wolkenmeer.
    history: >-
      Zur Zeit der Ureinwohner hieß das Gebiet Aceró, regiert von Häuptling Tanausú. Die Hirten nutzten den
      Kessel als Sommerweide; in Höhlen finden sich Felsritzungen mit altkanarischen Schriftzeichen. Wegen der
      Unzugänglichkeit blieb die Caldera unbesiedelt. Der Nationalpark wurde 1954 per Dekret geschaffen.
    before: >-
      Wandere stets in Begleitung, verlasse keinesfalls die markierten Pfade, beginne längere Bergtouren nicht
      erst nach der Mittagszeit und meide den Nationalpark unbedingt bei starkem Regen oder heftigem Sturm, da
      erhebliche Gefahr von Steinschlag und Felsstürzen besteht. Der Verbindungsweg von La Cumbrecita zum
      Zeltplatz ist äußerst ausgesetzt, für Personen mit Schwindelgefühl gänzlich ungeeignet und leidet das
      ganze Jahr über unter Erdrutschen: Erkundige dich vor dem Aufbruch im Besucherzentrum nach dem aktuellen
      Wegzustand. Für das Übernachten im Zelt ist vorab eine obligatorische Genehmigung im Besucherzentrum von
      El Paso zu beantragen.
  it:
    intro: >-
      Immagina un anfiteatro di roccia i cui spalti raggiungono i 2426 metri e il cui fondo si trova tra 600 e
      900 metri sul livello del mare. È la Caldera de Taburiente, al centro di La Palma, con il Roque de los
      Muchachos a fare da tetto dell'isola con gli osservatori astronomici internazionali. L'unico sbocco
      naturale è il barranco de las Angustias, in cui confluiscono le acque per raggiungere l'oceano. È parco
      nazionale dal 1954.
    landscape: >-
      L'acqua governa questo anfiteatro. Circa 1.800 concessionari utilizzano le acque di oltre 70 sorgenti e
      gallerie della Caldera, protette dalle norme comunitarie dell'Heredamiento de las Haciendas de Argual y
      Tazacorte che vietavano il taglio del legname e il pascolo. Grazie a questa tutela nata oltre 400 anni
      fa, la Caldera è giunta a noi quasi intatta. Il torrente Almendro Amargo scorre rossastro per i
      sedimenti ferrosi, mentre la Cascada de Colores deve le sue tinte vivaci a muschi e acque mineralizzate.
      I pinnacoli rocciosi interni derivano da colossali frane sottomarine preistoriche.


      La vegetazione si suddivide in piani altitudinali. Sul fondo e lungo le pareti regna il pino canario,
      resistente agli incendi grazie alla spessa corteccia isolante. Negli anfratti umidi la laurisilva
      cattura l'umidità degli alisei oceanici. Sulle pareti verticali attecchiscono succulente dei generi
      Aeonium e Greenovia. Oltre i 1700 metri crescono ginestre di vetta, cedri canari e la viola delle vette.
      La flora vascolare comprende 380 specie catalogate.
    wildlife: >-
      Tra i volatili endemici della Macaronesia spiccano il [colombo di Giunone](/especie/columba_junoniae/),
      il canarino, il calandro di Berthelot e il rondone unicolore. Il [gracchio
      corallino](/especie/pyrrhocorax_pyrrhocorax/) è facilmente avvistabile sulle cenge sommitali. Vivono tre
      specie di chirotteri e gechi endemici. A quota 2000 metri una caverna vulcanica cela un coleottero cieco
      e depigmentato esclusivo dell'isola.


      La minaccia principale è rappresentata da erbivori introdotti: l'ammotrago, le capre inselvatichite e i
      conigli. Per proteggere la vegetazione sono stati allestiti recinti sperimentali e dal 1988 si
      monitorano le piante minacciate, mirando a ricostituire il paesaggio precedente all'arrivo dell'uomo
      avvenuto poco più di 2000 anni fa.
    visit: >-
      Nel parco ci si sposta esclusivamente a piedi. Il centro visitatori di El Paso costituisce il punto di
      partenza, con percorsi didattici e un giardino botanico. Da qui si dipana la strada di 7 km verso il
      belvedere de La Cumbrecita, dove l'accesso veicolare è regolato per penuria di parcheggi. A Los Brecitos
      sale una pista forestale ma non è consentito parcheggiare. Il belvedere del Roque de los Muchachos non è
      servito da autobus di linea.


      Il tracciato cardine è l'anello Los Brecitos–Caldera, escursione impegnativa di 12,5 km e circa sei ore
      di cammino in discesa tra maestosi pini. Altre opzioni discendono il letto del barranco de las Angustias
      o salgono sul Pico Bejenado affacciato sul mare di nubi.
    history: >-
      I popoli indigeni chiamavano l'area Aceró, guidati dal condottiero Tanausú. Durante le estati secche vi
      riparavano le greggi di capre; nel barranco de Tajodeque alcune incisioni rupestri rimandano a caratteri
      berberi. Per la conformazione aspra la Caldera è rimasta spopolata. Il parco nazionale fu istituito nel
      1954 con decreto.
    before: >-
      Cammina sempre in compagnia, resta scrupolosamente lungo i sentieri segnalati, non iniziare a camminare
      dopo mezzogiorno ed evita assolutamente il parco in caso di pioggia o vento forte, a causa dell'alto
      pericolo di frane e caduta massi. Il sentiero che unisce La Cumbrecita all'area campeggio è molto
      pericoloso, del tutto sconsigliato a chi soffre di vertigini, ed è soggetto a frequenti smottamenti
      durante l'anno: controlla sempre il suo stato presso il centro visitatori prima di metterti in marcia.
      Per campeggiare in tenda è indispensabile richiedere prima un permesso autorizzativo al centro
      visitatori di El Paso.
  pt:
    intro: >-
      Imagina um anfiteatro rochoso cujos rebordos tocam os 2426 metros e cujo fundo repousa entre 600 e 900
      metros acima do mar. É a Caldera de Taburiente, no coração de La Palma, encimada pelo Roque de los
      Muchachos onde funciona o observatório astrofísico internacional. A sua única saída natural é o barranco
      de las Angustias, onde convergem as águas de Taburiente e Almendro Amargo rumo ao mar. Foi classificado
      como parque nacional em 1954.
    landscape: >-
      A água dita as regras. Cerca de 1.800 regantes usufruem das águas de mais de 70 nascentes e galerias da
      caldeira, preservadas pelos regulamentos seculares do Heredamiento de las Haciendas de Argual y
      Tazacorte que proibiam o corte de arvoredo e o pastoreio. Graças a esta consciência ecológica com mais
      de 400 anos, a caldeira chegou quase intocada até aos nossos dias. O ribeiro Almendro Amargo corre
      avermelhado devido aos minerais de ferro, e a Cascada de Colores exibe matizes de musgo e depósitos
      ferrosos. Os monólitos rochosos interiores resultam de avalanches de detritos vulcânicos do passado.


      A flora reparte-se por andares. No fundo e nas encostas domina o pinheiro-das-canárias, resistente aos
      fogos vulcânicos graças à grossa casca isolante. Nos canhões húmidos, faias e urzes formam o monteverde
      que retém as brumas dos ventos alísios. Nas escarpas verticais sobrevivem suculentas dos géneros Aeonium
      e Greenovia. Mais acima, para lá dos 1700 metros, surgem giestas de montanha, cedros-das-canárias e a
      violeta-dos-cumes. A caldeira abriga 380 espécies catalogadas de plantas vasculares.
    wildlife: >-
      Entre as aves endémicas da Macaronésia evidenciam-se o [pombo-do-loureiro](/especie/columba_junoniae/),
      o canário, o corre-caminhos e o andorinhão-unicolor. A
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/), ou graja, patrulha as escarpas superiores.
      Vivem três espécies de morcegos e répteis endémicos. A 2000 metros de altitude uma gruta vulcânica
      oculta um escaravelho cavernícola cego e despigmentado exclusivo da ilha.


      A principal pressão decorre de espécies introduzidas: o carneiro-da-berbéria, cabras bravias e coelhos.
      Foram construídas vedações de exclusão e monitoriza-se a flora desde 1988, procurando recriar o
      ecossistema anterior à chegada humana há pouco mais de 2000 anos.
    visit: >-
      Dentro do parque a progressão faz-se exclusivamente a pé. O centro de visitantes de El Paso é o ponto de
      partida recomendável, com mostras de vulcanologia e jardim botânico. Daí parte a estrada de 7 km até ao
      miradouro de La Cumbrecita, cujo trânsito automóvel é limitado de manhã pela escassez de estacionamento.
      A pista de Los Brecitos permite subir de carro para contemplar a paisagem, mas é proibido estacionar. O
      miradouro do Roque de los Muchachos não conta com transporte público regular.


      A rota fundamental é o trilho Los Brecitos–Caldeira, circuito exigente de 12,5 km e cerca de seis horas
      a descer por entre pinhais majestosos. Outros percursos percorrem o leito do barranco de las Angustias,
      sobem ao Pico Bejenado ou percorrem as cumeadas sobre o mar de nuvens.
    history: >-
      Os povos pré-hispânicos designavam o território por Aceró, liderados pelo guerreiro Tanausú. No estio
      seco recolhiam aqui os seus rebanhos; no barranco de Tajodeque algumas grutas exibem gravuras rupestres
      berberes. Dada a sua orografia escarpada a caldeira permaneceu desabitada. O parque nacional foi
      instituído em 1954 por decreto régio.
    before: >-
      Nunca caminhes sozinho, mantém-te nos trilhos marcados e evita as ravinas com chuva devido a derrocadas
      de pedras. O trilho entre La Cumbrecita e o parque de campismo é exposto e propenso a deslizamentos de
      terras. O acampamento requer autorização prévia obtida no centro de visitantes de El Paso.
