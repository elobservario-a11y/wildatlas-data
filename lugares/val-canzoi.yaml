    Un valle antiguo que corta de lado a lado toda la serie estratigráfica de las Dolomitas Belluneses, desde
    la Scaglia rossa hasta la Dolomia Principale.
  en: >-
    An ancient valley slicing clean through the entire stratigraphic sequence of the Belluno Dolomites, from
    the Scaglia rossa down to the Dolomia Principale.
  fr: >-
    Une vallée ancienne qui tranche de part en part toute la série stratigraphique des Dolomites Bellunaises,
    de la Scaglia rossa à la Dolomia Principale.
  de: >-
    Ein uraltes Tal, das die gesamte Schichtenfolge der Belluneser Dolomiten von der Scaglia rossa bis zum
    Hauptdolomit lückenlos durchschneidet.
  it: >-
    Un'antica valle che taglia da cima a fondo l'intera serie stratigrafica delle Dolomiti Bellunesi, dalla
    Scaglia rossa alla Dolomia Principale.
  pt: >-
    Um vale antigo que corta de alto a baixo toda a série estratigráfica das Dolomitas Belluneses, da Scaglia
    rossa à Dolomia Principale.
observaciones:
  es: >-
    El valle está dentro de un parque nacional. El Sentiero Natura es fácil y de desniveles modestos, y el
    sendero circular del centro La Santina es accesible.
texto:
  es:
    intro: >-
      Hay valles que se atraviesan y valles donde se llega al final del camino. Val Canzoi es de los segundos.
      Nace de la confluencia de valles escarpados que drenan la vertiente sur del grupo del Cimonega, y por su
      fondo corre el torrente Caorame durante unos siete kilómetros y medio, desde la fracción de Toschian, en
      Cesiomaggiore, hasta un embalse con forma de Y: el lago della Stua. Más allá solo quedan los senderos
      que se adentran en el parque nacional de las Dolomitas Belluneses, y en eso consiste su atractivo: es
      una puerta estrecha a la montaña más salvaje del parque.
    landscape: >-
      El Caorame nace en las laderas sur del Sass de Mura, que con 2547 metros es la cima más alta del grupo
      del Cimonega. En la formación del relieve de Val Canzoi intervinieron los glaciares, los cursos de agua,
      los deslizamientos y la erosión, además de la corrosión kárstica local. El resultado es un valle de
      ambientes variados: bosques, claros herbosos, lechos aluviales y manantiales kársticos. En el sendero
      hacia Casera Cimonega se ven marmitas de erosión y pequeñas cascadas a lo largo del Caorame.


      El camino del valle pasa sobre una garganta profunda por el puente de la Serrada y llega a Ave, la aldea
      más grande. Al final, en el lago della Stua, el grupo del Cimonega, parte de las Vette Feltrine, se
      asoma sobre el agua. El lago se construyó entre 1952 y 1953 y es parte del parque nacional.
    wildlife: >-
      Lo que sigue es del parque en su conjunto, pero el valle lo da en pequeño. Entre los mamíferos del
      parque figuran la [marmota](/especie/marmota_marmota/), el armiño, la marta, el
      [rebeco](/especie/rupicapra_rupicapra/), el [ciervo](/especie/cervus_elaphus/), el muflón, el
      [íbice](/especie/capra_ibex/), el [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/). Entre
      las aves, el pito negro, el azor, el [águila real](/especie/aquila_chrysaetos/), el [búho
      real](/especie/bubo_bubo/), el [urogallo](/especie/tetrao_urogallus/), la perdiz nival y el grévol, este
      último en riesgo de extinción. El parque registra cinco especies de murciélagos, entre ellas el
      murciélago ratonero grande, el enano y el de Daubenton, y entre los anfibios y reptiles tritón alpino,
      salamandra negra, sapo de vientre amarillo y víbora cornuda.


      La flora incluye rododendros, cardos y edelweiss, con bosques de frondosas y de coníferas, pastos y
      prados. El programa educativo del parque propone recorrer el valle para conocer flores y hierbas desde
      la botánica y la conservación, y también hay salidas de zoología y fauna con enfoque científico.
    visit: >-
      El acceso descrito va de Le Ave al lago della Stua por la carretera municipal, con desvíos laterales
      cortos. El Sentiero Natura Val Canzoi es un itinerario fácil, con desniveles modestos. A pocas decenas
      de metros de una segunda iglesia pequeña está el Centro de Educación Ambiental La Santina, del parque
      nacional, que trabaja biodiversidad y conservación con un recorrido sensorial accesible a personas con
      movilidad reducida y ciegas. De ahí sale un sendero circular accesible de unos dos kilómetros con tramos
      elevados por el bosque.


      Quien quiera seguir a pie tiene dos opciones. En la orilla izquierda del lago, donde entra el Caorame,
      sale un camino de mulas hacia los Piani Eterni, en el corazón del parque. Y el sendero hacia Casera
      Cimonega sigue el curso del torrente.
    history: >-
      El valle conserva las huellas de una vida rural: nichos de asentamiento como Montagne y Le Ave,
      terrazas, muros de piedra seca y carboneras. Es famoso por sus calchere, hornos de cal viva, de los que
      aún se conservan muchos. Hay una pequeña iglesia del siglo XIV dedicada a Santa Eurosia y San Juan
      Bautista.


      El parque nacional, de 31.512 hectáreas, se concretó en 1990 con el decreto del Ministerio de Medio
      Ambiente.
    before: >-
      El valle está dentro de un parque nacional. El Sentiero Natura es fácil y de desniveles modestos, y el
      sendero circular del centro La Santina es accesible.
    around: >-
      Val Canzoi es un sector del [Parque Nacional de las Dolomitas
      Belluneses](/lugar/parco-nazionale-delle-dolomiti-bellunesi/). A siete kilómetros está el [Parque
      Natural de Paneveggio y Pale di San Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) y
      a veintiocho el [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  en:
    intro: >-
      There are valleys you pass through on the way to somewhere else, and valleys where you reach the very
      end of the road. Val Canzoi belongs firmly to the second kind. Born from the convergence of steep
      hanging valleys draining the southern flank of the Cimonega group, the Caorame torrent rushes along its
      floor for some seven and a half kilometres, from the hamlet of Toschian in Cesiomaggiore to a Y-shaped
      reservoir: Lago della Stua. Beyond the water, only footpaths push deeper into the Belluno Dolomites
      National Park, and that is precisely its appeal: an intimate mountain portal into the park's wildest
      recesses.
    landscape: >-
      The Caorame rises on the southern precipices of the Sass de Mura, whose 2547 metres make it the highest
      crest in the Cimonega group. Glaciers, torrents, landslides and weathering all had a hand in shaping the
      relief of Val Canzoi, alongside localized karst solution. The outcome is a mosaic of habitats: mixed
      woodland, clearings, gravel bars and karst springs. Along the trail toward Casera Cimonega, giant
      potholes and small cascades tumble down the Caorame.


      The valley road crosses a sheer gorge via the Serrada bridge to reach Ave, the largest historic hamlet.
      At the valley head, the Cimonega group, part of the Vette Feltrine, looms over the waters of Lago della
      Stua. The reservoir was constructed between 1952 and 1953 and lies within the national park.
    wildlife: >-
      The fauna listed here represents the national park as a whole, reflected in miniature within the valley.
      Park mammals include the [Alpine marmot](/especie/marmota_marmota/), stoat, pine marten,
      [chamois](/especie/rupicapra_rupicapra/), [red deer](/especie/cervus_elaphus/), mouflon, [Alpine
      ibex](/especie/capra_ibex/), [grey wolf](/especie/canis_lupus/) and [Eurasian
      lynx](/especie/lynx_lynx/). Avian highlights feature black woodpecker, northern goshawk, [golden
      eagle](/especie/aquila_chrysaetos/), [Eurasian eagle-owl](/especie/bubo_bubo/), [western
      capercaillie](/especie/tetrao_urogallus/), rock ptarmigan and hazel grouse, the latter vulnerable to
      local extinction. The park records five bat species, including greater mouse-eared, common pipistrelle
      and Daubenton's bat, while herpetofauna includes Alpine newt, Alpine salamander, yellow-bellied toad and
      nose-horned viper.


      The flora features rhododendrons, mountain thistles and edelweiss, amid deciduous and coniferous
      woodlands, subalpine pastures and meadows. Park educational programmes offer botanically focused valley
      walks, alongside science-led wildlife tracking excursions.
    visit: >-
      The standard route follows the municipal road from Le Ave to Lago della Stua, with short lateral
      excursions. The Sentiero Natura Val Canzoi is an easy, low-gradient trail. A few dozen metres past a
      second small chapel stands the national park's La Santina Environmental Education Centre, which explores
      biodiversity through a sensory path accessible to visitors with reduced mobility and visual impairments.
      From the centre departs an accessible circular loop of some two kilometres with raised boardwalk
      sections through the trees.


      Those wishing to continue on foot have two main paths. From the left shore of the lake where the Caorame
      flows in, a mule track climbs into the Piani Eterni in the heart of the park. Meanwhile, the trail
      toward Casera Cimonega follows the wild riverbed upstream.
    history: >-
      The valley preserves quiet remnants of rural subsistence: settled clearings such as Montagne and Le Ave,
      cultivation terraces, drystone walls and charcoal-burning sites. It is especially renowned for its
      *calchere* (traditional quicklime kilns), many of which survive intact. A small chapel dating from the
      fourteenth century is dedicated to Saint Eurosia and Saint John the Baptist.


      The national park, encompassing 31,512 hectares, was formally established in 1990 by decree of the
      Ministry of the Environment.
    before: >-
      The valley is protected within a national park. The Sentiero Natura is gentle with modest elevation
      change, and the circular trail at the La Santina centre is barrier-free.
    around: >-
      Val Canzoi forms a wild sector of the [Belluno Dolomites National
      Park](/lugar/parco-nazionale-delle-dolomiti-bellunesi/). Seven kilometres away lies the [Paneveggio -
      Pale di San Martino Nature Park](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) and
      twenty-eight kilometres away is the [Fanes-Sennes-Braies Nature
      Park](/lugar/parco-naturale-fanes-sennes-braies/).
  fr:
    intro: >-
      Il y a des vallées que l'on traverse et des vallées où l'on atteint le bout de la route. Le Val Canzoi
      appartient à ces dernières. Né de la confluence de combes escarpées drainant le flanc sud du groupe du
      Cimonega, il voit couler en son fond le torrent Caorame sur environ sept kilomètres et demi, depuis le
      hameau de Toschian à Cesiomaggiore jusqu'à une retenue en forme d'Y : le lac della Stua. Au-delà des
      eaux, seuls des sentiers de montagne s'enfoncent dans le parc national des Dolomites Bellunaises, et
      c'est là tout son charme : une porte d'accès intime à la montagne la plus sauvage du parc.
    landscape: >-
      Le Caorame prend sa source sur les versants méridionaux du Sass de Mura qui, avec ses 2547 mètres,
      constitue le point culminant du groupe du Cimonega. Dans le modelé du Val Canzoi sont intervenus les
      glaciers quaternaires, les torrents, les glissements de terrain et l'érosion, ainsi qu'une dissolution
      karstique locale. Le résultat est une vallée aux biotopes variés : forêts denses, clairières d'herbe,
      bancs alluviaux et résurgences karstiques. Le long du sentier vers la Casera Cimonega, marmites de géant
      et cascades animent le lit du Caorame.


      La route de la vallée enjambe une gorge profonde par le pont de la Serrada pour atteindre Ave, le hameau
      le plus étendu. Au fond, au lac della Stua, les parois du groupe du Cimonega, au sein des Vette
      Feltrine, se mirent dans l'eau. Le lac de barrage a été aménagé entre 1952 et 1953 et fait partie
      intégrante du parc national.
    wildlife: >-
      Ce qui suit concerne l'ensemble du parc, mais la vallée en offre une synthèse remarquable. Parmi les
      mammifères figurent la [marmotte des Alpes](/especie/marmota_marmota/), l'hermine, la martre, le
      [chamois](/especie/rupicapra_rupicapra/), le [cerf élaphe](/especie/cervus_elaphus/), le mouflon, le
      [bouquetin des Alpes](/especie/capra_ibex/), le [loup](/especie/canis_lupus/) et le [lynx
      boréal](/especie/lynx_lynx/). Chez les oiseaux : pic noir, autour des palombes, [aigle
      royal](/especie/aquila_chrysaetos/), [grand-duc d'Europe](/especie/bubo_bubo/), [grand
      tétras](/especie/tetrao_urogallus/), lagopède alpin et gélinotte des bois, cette dernière très
      vulnérable. Le parc recense cinq chauves-souris dont le grand murin, la pipistrelle et le murin de
      Daubenton, tandis que l'herpétofaune compte triton alpestre, salamandre noire, sonneur à ventre jaune et
      vipère cornue.


      La flore rassemble rhododendrons, chardons et edelweiss, au milieu de forêts mixtes, d'alpages et de
      prairies. Les activités pédagogiques du parc proposent des circuits d'initiation botanique et des
      sorties scientifiques consacrées à la faune alpine.
    visit: >-
      L'itinéraire décrit relie Le Ave au lac della Stua par la route communale, avec de courts détours
      latéraux. Le Sentiero Natura Val Canzoi est un parcours facile, au dénivelé modeste. À quelques dizaines
      de mètres d'une seconde petite chapelle se dresse le centre d'éducation environnementale La Santina du
      parc national, qui aborde biodiversité et conservation avec un sentier sensoriel accessible aux
      personnes à mobilité réduite ou malvoyantes. De là part une boucle accessible d'environ deux kilomètres
      sur passerelles de bois.


      Pour continuer à pied, deux options s'ouvrent. Sur la rive gauche du lac, à l'embouchure du Caorame, un
      chemin muletier monte vers les Piani Eterni au cœur du parc. L'autre sentier vers Casera Cimonega
      remonte le cours sauvage du torrent.
    history: >-
      La vallée conserve les traces d'une rude économie rurale : hameaux d'alpage comme Montagne et Le Ave,
      terrasses de culture, murets en pierre sèche et charbonnières. Elle est renommée pour ses *calchere*,
      fours à chaux traditionnels dont beaucoup subsistent intacts. Une petite église du XIVe siècle est
      dédiée à sainte Éurosie et saint Jean-Baptiste.


      Le parc national, d'une superficie de 31 512 hectares, a été officiellement institué en 1990 par décret
      du ministère de l'Environnement.
    before: >-
      La vallée se trouve au sein d'un parc national. Le Sentiero Natura est aisé et peu pentu, et le sentier
      circulaire du centre La Santina est aménagé pour tous.
    around: >-
      Le Val Canzoi forme un secteur du [parc national des Dolomites
      Bellunaises](/lugar/parco-nazionale-delle-dolomiti-bellunesi/). À sept kilomètres se trouve le [parc
      naturel de Paneveggio et Pale di San Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/)
      et à vingt-huit kilomètres le [parc naturel
      Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  de:
    intro: >-
      Es gibt Täler, die man bloß durchquert, und Täler, an deren Ende die Straße schlicht aufhört. Das Val
      Canzoi gehört zur zweiten Art. Entstanden aus steilen Schluchten an der Südseite der Cimonega-Gruppe,
      fließt auf seinem Grund der Wildbach Caorame über rund siebeneinhalb Kilometer, vom Weiler Toschian in
      Cesiomaggiore bis zu einem Y-förmigen Stausee: dem Lago della Stua. Hinter dem Gewässer führen nur noch
      Fußpfade tiefer in den Nationalpark Belluneser Dolomiten — ein abgeschiedenes Portal in die
      unberührteste Gebirgswelt des Parks.
    landscape: >-
      Der Caorame entspringt an den Südwänden des Sass de Mura, der mit 2547 Metern die höchste Erhebung der
      Cimonega-Gruppe darstellt. Gletscher, Wildbäche, Hangrutschungen und Verwitterung formten das Relief des
      Val Canzoi, ergänzt durch lokale Verkarstung. Das Ergebnis ist ein Tal reicher Lebensräume: dichte
      Wälder, Bergwiesen, Schotterbänke und Karstquellen. Entlang des Weges zur Casera Cimonega sieht man
      Strudeltöpfe und kleine Wasserfälle im Bett des Caorame.


      Die Talstraße quert eine tiefe Schlucht über die Serrada-Brücke und erreicht Ave, den größten Weiler. Am
      Talende spiegelt sich die Cimonega-Gruppe, Teil der Vette Feltrine, im Lago della Stua. Der Stausee
      wurde zwischen 1952 und 1953 angelegt und gehört zum Nationalpark.
    wildlife: >-
      Die Tierwelt gilt für den gesamten Nationalpark, spiegelt sich im Tal jedoch beispielhaft wider. Zu den
      Säugetieren gehören [Alpenmurmeltier](/especie/marmota_marmota/), Hermelin, Baummarder,
      [Gämse](/especie/rupicapra_rupicapra/), [Rothirsch](/especie/cervus_elaphus/), Mufflon,
      [Alpensteinbock](/especie/capra_ibex/), [Wolf](/especie/canis_lupus/) und [Eurasischer
      Luchs](/especie/lynx_lynx/). Unter den Vögeln: Schwarzspecht, Habicht,
      [Steinadler](/especie/aquila_chrysaetos/), [Uhu](/especie/bubo_bubo/),
      [Auerhuhn](/especie/tetrao_urogallus/), Alpenschneehuhn und Haselhuhn. Der Park verzeichnet fünf
      Fledermausarten, darunter Großes Mausohr und Wasserfledermaus; die Herpetofauna zählt Alpensalamander,
      Bergmolch, Gelbbauchunke und Hornotter.


      Die Flora umfasst Rhododendren, Disteln und Edelweiß inmitten von Bergmischwäldern und
      Hochstaudenfluren. Das Bildungsprogramm des Parks bietet botanische Erkundungen und
      naturwissenschaftliche Exkursionen zur Hochgebirgsfauna an.
    visit: >-
      Der beschriebene Talweg führt von Le Ave zum Lago della Stua über die Gemeindestraße mit kurzen
      Abstechern. Der Sentiero Natura Val Canzoi ist ein einfacher Weg mit geringen Steigungen. Wenige Dutzend
      Meter nach einer zweiten kleinen Kapelle steht das Umweltbildungszentrum La Santina mit Sinnespfad für
      mobilitäts- und sehbehinderte Besucher. Von dort startet ein barrierefreier Rundweg von rund zwei
      Kilometern auf Holzstegen durch den Bergwald.


      Für Bergwanderer gibt es zwei Hauptpfade. Am linken Seeufer beim Caorame-Zufluss steigt ein Saumpfad zu
      den Piani Eterni im Herzen des Parks auf. Der andere Steig zur Casera Cimonega folgt dem wilden Bachlauf
      stromaufwärts.
    history: >-
      Das Tal bewahrt Relikte traditioneller Kulturlandschaft: Almsiedlungen wie Montagne und Le Ave,
      Terrassen, Trockenmauern und Köhlerplätze. Berühmt ist es für seine *calchere* (Kalkbrennöfen), von
      denen viele erhalten sind. Eine kleine Kirche aus dem vierzehnten Jahrhundert ist St. Eurosia und
      Johannes dem Täufer geweiht.


      Der Nationalpark mit 31.512 Hektar wurde 1990 per Dekret des Umweltministeriums formal begründet.
    before: >-
      Das Tal liegt in einem Nationalpark. Der Sentiero Natura ist sanft und wenig anstrengend, der Rundweg am
      Zentrum La Santina ist barrierefrei.
    around: >-
      Das Val Canzoi ist ein Teilbereich des [Nationalparks Belluneser
      Dolomiten](/lugar/parco-nazionale-delle-dolomiti-bellunesi/). Sieben Kilometer entfernt liegt der
      [Naturpark Paneveggio - Pale di San Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/)
      und achtundzwanzig Kilometer entfernt der [Naturpark
      Fanes-Sennes-Prags](/lugar/parco-naturale-fanes-sennes-braies/).
  it:
    intro: >-
      Ci sono valli che si attraversano per andare altrove e valli dove si giunge alla fine della strada. La
      Val Canzoi appartiene a queste ultime. Nata dalla convergenza di aspre forre che drenano il versante
      meridionale del gruppo del Cimonega, vede scorrere sul proprio fondo il torrente Caorame per circa sette
      chilometri e mezzo, dalla frazione di Toschian a Cesiomaggiore sino a un bacino a forma di Y: il lago
      della Stua. Oltre lo specchio d'acqua rimangono solo sentieri che si addentrano nel Parco nazionale
      delle Dolomiti Bellunesi: una porta appartata verso le cime più selvagge dell'area protetta.
    landscape: >-
      Il Caorame sorge sulle pendici meridionali del Sass de Mura che, con i suoi 2547 metri, rappresenta la
      cima più elevata del gruppo del Cimonega. Nel modellamento della Val Canzoi hanno agito ghiacciai, corsi
      d'acqua, frane ed erosione, uniti a una corrosione carsica locale. Il risultato è una valle ricca di
      ambienti diversi: boschi misti, radure erbose, greti alluvionali e sorgenti carsiche. Lungo il sentiero
      per Casera Cimonega si ammirano marmitte dei giganti e cascate scavate dal Caorame.


      La rotabile di fondovalle supera una profonda forra sul ponte della Serrada e tocca Ave, l'abitato più
      esteso. In fondo, presso il lago della Stua, le pareti del Cimonega, nelle Vette Feltrine, dominano le
      acque. Il bacino artificiale fu realizzato tra il 1952 e il 1953 ed è compreso nel parco nazionale.
    wildlife: >-
      La fauna citata appartiene al parco nel suo insieme, ma la valle ne offre una sintesi fedele. Tra i
      mammiferi compaiono la [marmotta alpina](/especie/marmota_marmota/), l'ermellino, la martora, il
      [camoscio alpino](/especie/rupicapra_rupicapra/), il [cervo nobile](/especie/cervus_elaphus/), il
      muflone, lo [stambecco alpino](/especie/capra_ibex/), il [lupo grigio](/especie/canis_lupus/) e la
      [lince europea](/especie/lynx_lynx/). Tra i volatili: picchio nero, astore, [aquila
      reale](/especie/aquila_chrysaetos/), [gufo reale](/especie/bubo_bubo/),
      [urogallo](/especie/tetrao_urogallus/), pernice bianca e francolino di monte. Il parco conta cinque
      specie di pipistrelli, tra cui vespertilio maggiore e daubenton, mentre tra anfibi e rettili figurano
      tritone alpino, salamandra nera, ululone dal ventre giallo e vipera cornuta.


      La flora include rododendri, cardi montani e stelle alpine, tra boschi di conifere e latifoglie, pascoli
      e praterie. Il programma didattico del parco prevede escursioni botaniche in valle e uscite scientifiche
      dedicate alla fauna alpina.
    visit: >-
      Il percorso descritto conduce da Le Ave al lago della Stua lungo la strada comunale, con brevi
      deviazioni laterali. Il Sentiero Natura Val Canzoi è un itinerario agevole a modesto dislivello. A poche
      decine di metri da una seconda chiesetta sorge il Centro di Educazione Ambientale La Santina del parco
      nazionale, dedicato a biodiversità e conservazione con un percorso sensoriale per non vedenti e disabili
      motori. Da qui parte un anello accessibile di circa due chilometri su passerelle nel bosco.


      Per proseguire a piedi vi sono due direttrici. Sulla riva sinistra del lago, dove entra il Caorame, una
      mulattiera sale verso i Piani Eterni nel cuore del parco. Il sentiero per Casera Cimonega risale invece
      il greto del torrente.
    history: >-
      La valle testimonia una tenace civiltà rurale: insediamenti montani come Montagne e Le Ave,
      terrazzamenti, muretti a secco e carbonaie. È celebre per le sue *calchere* (antiche fornaci da calce),
      molte delle quali ancora intatte. Una chiesetta del XIV secolo è consacrata a sant'Eurosia e san
      Giovanni Battista.


      Il parco nazionale, di 31.512 ettari, è stato formalmente istituito nel 1990 con decreto del Ministero
      dell'Ambiente.
    before: >-
      La valle ricade in un parco nazionale. Il Sentiero Natura è facile e poco faticoso, e il percorso
      circolare del centro La Santina è privo di barriere.
    around: >-
      Val Canzoi è parte integrante del [Parco Nazionale delle Dolomiti
      Bellunesi](/lugar/parco-nazionale-delle-dolomiti-bellunesi/). A sette chilometri si trova il [Parco
      Naturale Paneveggio - Pale di San Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) e a
      ventotto chilometri il [Parco Naturale Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  pt:
    intro: >-
      Há vales que se atravessam a caminho de outro lugar e vales onde a estrada simplesmente termina. O Val
      Canzoi pertence a estes últimos. Nascido da confluência de desfiladeiros íngremes que drenam a vertente
      sul do maciço do Cimonega, vê correr no seu fundo a torrente Caorame ao longo de cerca de sete
      quilómetros e meio, da povoação de Toschian em Cesiomaggiore até a uma albufeira em forma de Y: o lago
      della Stua. Para além das águas restam apenas veredas de montanha que penetram no Parque Nacional das
      Dolomitas Belluneses: uma porta discreta para o relevo mais selvagem do parque.
    landscape: >-
      O Caorame nasce nas escarpas meridionais do Sass de Mura que, com os seus 2547 metros, é o ponto
      culminante do grupo do Cimonega. Na formação do relevo do Val Canzoi intervieram glaciares, torrentes,
      deslizamentos e erosão, aliados à dissolução cársica local. O resultado é um vale de biótopos
      diversificados: matas mistas, clareiras relvadas, leitos de calhaus e nascentes cársicas. Ao longo do
      trilho para a Casera Cimonega avistam-se marmitas de gigante e pequenas cascatas talhadas pelo Caorame.


      A estrada do vale transpõe uma garganta profunda pela ponte da Serrada até Ave, a aldeia mais ampla. No
      topo, no lago della Stua, as encostas do maciço do Cimonega, nas Vette Feltrine, espelham-se na água. A
      albufeira foi erguida entre 1952 e 1953 e está integrada no parque nacional.
    wildlife: >-
      A fauna apresentada diz respeito ao conjunto do parque, mas o vale acolhe uma síntese representativa.
      Entre os mamíferos contam-se a [marmota-dos-alpes](/especie/marmota_marmota/), a doninha-anã, a marta, a
      [camurça](/especie/rupicapra_rupicapra/), o [veado-vermelho](/especie/cervus_elaphus/), o muflão, o
      [íbex](/especie/capra_ibex/), o [lobo-cinzento](/especie/canis_lupus/) e o
      [lince-euroasiático](/especie/lynx_lynx/). Nas aves destacam-se o pica-pau-preto, o açor, a
      [águia-real](/especie/aquila_chrysaetos/), o [bufo-real](/especie/bubo_bubo/), o
      [tetraz-grande](/especie/tetrao_urogallus/), a lagópode-branca e a galinha-do-mato. O parque soma cinco
      espécies de morcegos, incluindo o morcego-rato-grande, e anfíbios como o tritão-alpino, a
      salamandra-negra e a víbora-cornuda.


      A flora abrange rododendros, cardos alpinos e edelvais, entre florestas de coníferas e folhosas,
      pastagens e prados. Os programas educativos do parque promovem percursos de identificação botânica e
      saídas de campo sobre a fauna de montanha.
    visit: >-
      O itinerário habitual liga Le Ave ao lago della Stua pela estrada municipal, com pequenos desvios
      laterais. O Sentiero Natura Val Canzoi é um percurso fácil e com pouco desnível. A poucas dezenas de
      metros de uma segunda ermida situa-se o Centro de Educação Ambiental La Santina, do parque nacional,
      vocacionado para a biodiversidade com um percurso sensorial para invisuais e cidadãos com mobilidade
      reduzida. Daí parte um anello circular acessível de cerca de dois quilómetros em passadiços de madeira.


      Para prosseguir a pé há duas rotas principais. Na margem esquerda do lago, onde desagua o Caorame, um
      caminho de ferradura sobe até aos Piani Eterni no coração do parque. O trilho para a Casera Cimonega
      acompanha o leito selvagem da torrente.
    history: >-
      O vale conserva vestígios da antiga ruralidade: núcleos pastoris como Montagne e Le Ave, socalcos, muros
      de pedra seca e carvoarias. É famoso pelas suas *calchere* (antigos fornos de cal viva), muitos dos
      quais preservados. Uma pequena igreja do século XIV é consagrada a Santa Eurósia e São João Batista.


      O parque nacional, com 31.512 hectares, foi formalmente instituído em 1990 por decreto do Ministério do
      Ambiente.
    before: >-
      O vale está inserido num parque nacional. O Sentiero Natura é acessível e com declives suaves, e o
      percurso circular do centro La Santina não tem barreiras arquitetónicas.
    around: >-
      O Val Canzoi é parte integrante do [Parque Nacional das Dolomitas
      Belluneses](/lugar/parco-nazionale-delle-dolomiti-bellunesi/). A sete quilómetros fica o [Parque Natural
      Paneveggio - Pale di San Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) e a vinte e
      oito quilómetros o [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
