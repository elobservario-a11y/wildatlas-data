      alpina](/especie/rosalia_alpina/) e la rara farfalla Parnassius apollo.
    visit: "Nei borghi storici quali Bova, Gerace, Mammola e San Giorgio Morgeto si stratificano memorie della Magna Grecia, romane, bizantine e normanne. Centri visita sorgono nei paesi di Bagaladi, Bova, Gerace e Mammola; le sedi montane di Africo, Cittanova, Delianuova, Sant'Eufemia d'Aspromonte, Oppido Mamertina e Santo Stefano in Aspromonte sono visitabili su prenotazione. A Santo Stefano un osservatorio della biodiversitÃ\_ illustra fauna ed ecosistemi con stagni didattici per l'ululone. Bova ospita il Geoparco e il Museo Paleontologico.\n\nTra i percorsi pedestri, il sentiero 104 collega Samo a Montalto in sette ore e mezza di cammino. Il sentiero 132 conduce alle cascate dell'Amendolea con un tratto finale di trentacinque minuti; l'anello dalla diga del Menta alle cascate richiede quattro ore. Famosi sono anche il Sentiero dei Greci e il cammino devozionale da Montalto al Santuario di Polsi."
    history: "L'area protetta trae origine dalla sezione aspromontana dello storico Parco Nazionale della Calabria. Istituito autonomamente nel 1989 come sesto parco nazionale d'Italia, nel 2021 Ã¨ stato proclamato UNESCO Global Geopark comprendendo 37 comuni della CittÃ\_ metropolitana di Reggio Calabria.\n\nSull'altopiano della Limina a Mammola, il Santuario di San Nicodemo fondato nel X secolo Ã¨ tuttora abitato da un monaco eremita."
