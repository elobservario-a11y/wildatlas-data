texto:
  es:
    intro: >-
      En el extremo sur de Calabria, donde Italia termina, la tierra no se arrastra hacia el mar: salta. Desde
      la costa, el relieve del Aspromonte sube con rapidez hasta rozar los 2.000 metros, entre el mar Jónico,
      el Tirreno y el estrecho de Mesina. El macizo tiene forma cónico-piramidal, con el Montalto (1956 m) en
      el centro y varias crestas que se abren de él entre valles hondos. El Parque Nacional del Aspromonte lo
      recorre entero, y desde 2021 su territorio es también un Geoparque Mundial de la UNESCO.
    landscape: >-
      El Aspromonte pertenece al Arco Calabro-Peloritano, un sector geológico distinto del Apenino que lo
      rodea. Sus rocas guardan la memoria de procesos que empezaron hace más de 500 millones de años y que no
      han terminado: la tectónica, la erosión, los desprendimientos y los ríos siguen trabajando.


      Ese trabajo se ve en los valles. Montañas, dorsales y altiplanos están surcados por gargantas profundas
      y por las fiumare, cursos de agua torrenciales que unen deprisa la montaña con la costa. Las fiumare
      tienen carácter de estación: llevan agua con fuerza en invierno y forman cascadas en altura, bajan de
      caudal en primavera hasta agotarse y en verano y otoño están completamente secas.


      Cuando subes, cambia la vegetación. A baja altitud reinan la maquia mediterránea (retama, jara, encina,
      mirto, labiérnago, madroño) y los encinares. Hay encinares altos que, por extensión y características,
      son ejemplos únicos a escala nacional. Más arriba aparece el roble meridional, mezclado con pinares
      majestuosos y, aún más alto, con el haya. En el valle de las Grandi Pietre crece el farnetto, un roble
      de hojas grandes y lóbulos profundos que se mezcla con la encina. Las hayas más interesantes están en
      Monte Scorda y Zervò, y en Molochio quedan reliquias de tejo. Los pinares naturales, sobre todo en la
      vertiente jónica, tienen ejemplares enormes, como los Gigantes de Acatti.


      Junto al agua, las fiumare se cubren de álamos, sauces y alisos, y donde la humedad es constante todo el
      año crece Woodwardia radicans, un helecho gigante, reliquia del Terciario. En total el parque tiene unas
      1.500 especies de plantas, más del 50% de la flora regional. La razón es su posición en el centro del
      Mediterráneo, que durante el Terciario y el Cuaternario superpuso floras de distinto origen.
    wildlife: >-
      El [lobo](/especie/canis_lupus/) es la gran noticia: su presencia está de nuevo confirmada en el macizo,
      aunque durante dos décadas se consideró desaparecido. Con él viven el [gato
      montés](/especie/felis_silvestris/), el lirón gris y el driomio, un pequeño roedor que solo habita en
      Calabria y en Friuli. En los bosques abunda la ardilla meridional, de pelaje negro en lugar de marrón o
      rojizo. A finales de 2011 se reintrodujeron 75 [corzos](/especie/capreolus_capreolus/) de la subespecie
      itálica, una especie ausente de estas tierras desde hacía aproximadamente un siglo.


      Arriba mandan las rapaces. El [águila perdicera](/especie/aquila_fasciata/), casi extinta en el resto de
      Italia, está en el parque con dos parejas; el [águila real](/especie/aquila_chrysaetos/) ha vuelto a
      criar. Entre las nocturnas, el [búho real](/especie/bubo_bubo/). Hay también perdiz griega y [pico
      negro](/especie/dryocopus_martius/).


      A ras de suelo, el parque guarda reptiles como la víbora, el cervone y la [tortuga
      mediterránea](/especie/testudo_hermanni/), y anfibios como la [salamandra
      común](/especie/salamandra_salamandra/), la salamandrina de anteojos y el sapillo de vientre amarillo
      apenínico, inconfundible por el color amarillo anaranjado del vientre. Entre los insectos hay
      escarabajos saproxílicos de interés comunitario, como [Rosalia alpina](/especie/rosalia_alpina/), y una
      mariposa amenazada, Parnassius apollo, ligada a los claros de alta montaña con Sedum.
    visit: >-
      En los pueblos del parque, Bova, Gerace, Mammola y San Giorgio Morgeto, la historia se apila en capas:
      huellas de la Magna Grecia, de época romana, medieval y renacentista. Los centros de visita de Bagaladi,
      Bova, Gerace y Mammola están en los pueblos; los de Africo, Cittanova, Delianuova, Sant'Eufemia
      d'Aspromonte, Oppido Mamertina y Santo Stefano in Aspromonte están en la montaña, y hay que pedir cita
      antes con la sede del parque. En Santo Stefano in Aspromonte hay un observatorio de la biodiversidad y
      la fauna, y el Observatorio de la Biodiversidad presenta flora, fauna, hábitats y ecosistemas de
      Calabria y del parque; allí se conocen las charcas de cría del amenazado sapillo de vientre amarillo
      apenínico. En Bova está la sede del Geoparque, con un Museo de Paleontología.


      Para caminar, la red de senderos incluye el sendero 104 entre Samo y Montalto, con siete horas y media
      de marcha. El sendero 132 lleva a las cascadas Amendolea, y su tramo final dura treinta y cinco minutos;
      la ida y vuelta desde la presa del Menta hasta las cascadas Menta-Amendolea dura cuatro horas. Otros
      senderos, algunos aptos para bici o caballo, son el Sentiero dei Greci (Mammola, Fiume Torbido, Passo
      Sella, santuario de San Nicodemo y Passo della Limina) y el que va de Montalto a Polsi.
    history: >-
      El parque actual deriva de la sección aspromontana del parque nacional de Calabria. Se instituyó en 1989
      y fue el sexto parque nacional de Italia. En 2021 el territorio entró en la red de geoparques de la
      UNESCO, con 37 municipios de la Ciudad metropolitana de Reggio Calabria.


      En el altiplano de la Limina, en Mammola, el santuario de San Nicodemo, del siglo X, está habitado por
      un monje.
    before: >-
      El gestor publica avisos sobre senderos no transitables: compruébalos antes de ir. Para los centros de
      la montaña, pide cita con la sede del parque. Y ten en cuenta que las fiumare están secas en verano y
      otoño, pero se vuelven impetuosas en invierno.
    around: >-
      El Aspromonte comparte con el [Parque Nacional da Peneda-Gerês / Baixa Limia e Serra do
      Xurés](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/) el helecho Woodwardia
      radicans y el lobo, y con el [Parque Nacional del Pollino](/lugar/parco-nazionale-del-pollino/) y el
      [Parque Nacional de la Sila](/lugar/parco-nazionale-della-sila/), el pico negro y el lobo, además de la
      alta montaña y el bosque maduro. Lo mismo ocurre con [Fuentes del Narcea, Degaña e Ibias & Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/).
  en:
    intro: >-
      In the southernmost tip of Calabria, where Italy reaches its toe, the land does not gently slope into
      the sea: it rears up. From the coastline, the relief of the Aspromonte rises steeply to brush 2,000
      metres, commanding the Ionian, Tyrrhenian and the Strait of Messina. The massif forms a conical pyramid
      anchored by Montalto (1956 m) at its core, from which radial ridges diverge between deeply incised
      valleys. Aspromonte National Park encompasses the entire massif, and since 2021 its territory is
      designated as a UNESCO Global Geopark.
    landscape: >-
      The Aspromonte belongs geologically to the Calabrian-Peloritan Arc, an exotic geological terrane
      completely distinct from the surrounding Apennines. Its metamorphic rocks preserve records of plate
      tectonic processes that began more than 500 million years ago and remain active today: seismicity,
      tectonic uplift, landslides and raging torrents continue sculpting the terrain.


      This tectonic activity is etched across the valleys. High plateaus and mountain crests are cleaved by
      deep gorges and *fiumare*â€”braided torrent beds that rush precipitously from crests to coastal shores.
      The fiumare reflect extreme seasonality: roaring with heavy runoff in winter while plunging over rock
      waterfalls, dwindling in spring, and drying out completely into wide stone washes during summer and
      autumn.


      Climbing higher, vegetation transforms in stepped altitudinal zones. Low foothills support dense
      Mediterranean maquis and holm oak woods. Some tall holm oak stands represent magnificent old-growth
      examples unmatched anywhere in Italy. Higher up appear Hungarian and Italian oaks intermingling with
      Corsican pine forests, yielding to montane beechwoods on upper slopes. The Grandi Pietre valley shelters
      the Hungarian oak (*farnetto*), while old-growth beeches thrive at Monte Scorda and ZervÃ², alongside
      relict English yew at Molochio. Pine stands on Ionian slopes boast monumental veterans like the Giants
      of Acatti.


      Along gorge floors, fiumare margins support poplars, willows and alders, and where perennial
      microclimatic humidity lingers thrives *Woodwardia radicans*, an ancient giant chain fern dating from
      the Tertiary period. In total, the national park shelters around 1,500 vascular plant species,
      representing more than 50% of Calabria's entire flora.
    wildlife: >-
      The grey [wolf](/especie/canis_lupus/) provides the park's premier conservation success: its breeding
      presence is once again confirmed across the massif after being considered locally extinct for two
      decades. It shares these woodlands with the [wildcat](/especie/felis_silvestris/), edible dormouse and
      forest dormouse, a small rodent found in Italy only in Calabria and Friuli. The black-furred Calabrian
      black squirrel is widespread throughout the canopy. In late 2011, park biologists reintroduced 75 [roe
      deer](/especie/capreolus_capreolus/) of the native Italico subspecies, absent for roughly a century.


      Raptors rule the skies above the gorges. Bonelli's eagle ([aquila del
      Bonelli](/especie/aquila_fasciata/)), teetering on extinction elsewhere in peninsular Italy, maintains
      two resident pairs in the park; the [golden eagle](/especie/aquila_chrysaetos/) has returned to breed.
      Nocturnal predators include the [Eurasian eagle-owl](/especie/bubo_bubo/), alongside rock partridge and
      the [black woodpecker](/especie/dryocopus_martius/).


      At ground level, the park shelters reptiles including the asp viper, four-lined snake and [Hermann's
      tortoise](/especie/testudo_hermanni/). Amphibians feature the [fire
      salamander](/especie/salamandra_salamandra/), spectacled salamandrina and the Apennine yellow-bellied
      toad, displaying its orange-yellow underside. Notable invertebrates include rare saproxylic beetles like
      the Rosalia longicorn ([Rosalia alpina](/especie/rosalia_alpina/)) and the endangered Apollo butterfly
      (*Parnassius apollo*), tied to subalpine rock outcrops.
    visit: >-
      In historic hill towns like Bova, Gerace, Mammola and San Giorgio Morgeto, history reveals layered
      civilizations: Magna Graecia, Roman, Byzantine, Norman and Renaissance heritages. Visitor centres are
      located within valley towns like Bagaladi, Bova, Gerace and Mammola, while highland centres at Africo,
      Cittanova, Delianuova, Sant'Eufemia d'Aspromonte, Oppido Mamertina and Santo Stefano in Aspromonte
      require advance booking with park headquarters. Santo Stefano in Aspromonte houses a regional
      biodiversity observatory that displays habitats, flora and fauna, alongside conservation breeding ponds
      for the yellow-bellied toad. Bova hosts the Geopark headquarters and Paleontological Museum.


      For hiking, trail 104 connects Samo to Montalto across seven and a half hours of mountain walking. Trail
      132 leads to the Amendolea waterfalls, with its final descent taking thirty-five minutes; a classic loop
      from the Menta dam to the Menta-Amendolea falls takes four hours. Other popular routes include the
      historic Sentiero dei Greci through Mammola and the pilgrimage trail from Montalto to the Sanctuary of
      Polsi.
    history: >-
      The modern park developed from the Aspromonte section of the historic National Park of Calabria.
      Established as an independent entity in 1989, it became Italy's sixth national park. In 2021, its entire
      territory was incorporated into the UNESCO Global Geoparks Network, encompassing 37 municipalities
      within the Metropolitan City of Reggio Calabria.


      High on the Limina plateau above Mammola, the X-century Sanctuary of San Nicodemo remains occupied by a
      resident hermit monk.
    before: >-
      Park authorities publish trail condition bulletins: check for path closures before setting out. Schedule
      visits to highland interpretive centres in advance. Remember that torrent riverbeds (*fiumare*) lie bone
      dry through summer and autumn but become dangerous raging torrents following winter downpours.
    around: >-
      Aspromonte shares the Tertiary relict fern *Woodwardia radicans* and the wolf with [Peneda-GerÃªs /
      Baixa Limia and Serra do
      XurÃ©s](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/), while sharing the black
      woodpecker and wolf with [Pollino National Park](/lugar/parco-nazionale-del-pollino/) and [Sila National
      Park](/lugar/parco-nazionale-della-sila/). Similar montane and old-growth forest affinities exist with
      [Fuentes del Narcea, DegaÃ±a e Ibias & Muniellos
      Reserve](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/).
