      s'innalzano con pendenze vertiginose sfiorando i 2.000 metri, sospesi tra Mar Jonio, Mar Tirreno e
      Stretto di Messina. Il massiccio sfoggia un profilo piramidale imperniato su Montalto (1956 m), da cui
      si dipartono dorsali divise da gole aspre. Il Parco Nazionale dell'Aspromonte ne tutela l'intera
      estensione, riconosciuto dal 2021 come UNESCO Global Geopark.
    landscape: "L'Aspromonte appartiene all'Arco Calabro-Peloritano, un settore geologico peculiare completamente distinto dal contesto appenninico circostante. Le sue formazioni metamorfiche custodiscono la testimonianza di processi orogenetici iniziati oltre 500 milioni di anni fa e tuttora operativi: tettonica attiva, sollevamenti, frane e torrenti impetuosi plasmano costantemente le valli.\n\nQuesta dinamica emerge evidente nei fondovalle: le dorsali sono intagliate da gole e dalle *fiumare*, corsi d'acqua a regime torrentizio che collegano le cime al mare. Le fiumare sfoggiano una marcata stagionalitÃ\_: tumultuose d'inverno con spettacolari salti d'acqua, riducono la portata in primavera per prosciugarsi del tutto in ampie fiumane di ciottoli aridi durante l'estate e l'autunno.\n\nSalendo di quota muta la vegetazione. Alle quote basali domina la macchia mediterranea affiancata da leccete ad alto fusto uniche per estensione su scala nazionale. PiÃ¹ in alto compaiono roverella, farnetto e cerro frammisti a pinete di pino laricio, lasciando il posto alla faggeta montana nelle fasce sommitali. A Monte Scorda e ZervÃ² si conservano faggi secolari, e a Molochio relitti di tasso. Le pinete joniche vantano patriarchi monumentali come i Giganti di Acatti.\n\nNelle forre umide prosperano pioppi, ontani e la rara *Woodwardia radicans*, felce gigante relitto dell'era terziaria. Il parco racchiude circa 1.500 specie vegetali, ossia oltre il 50% dell'intera flora calabrese."
    wildlife: >-
      Il [lupo](/especie/canis_lupus/) rappresenta il successo faunistico piÃ¹ significativo: la sua presenza
      riproduttiva Ã¨ confermata stabilmente nel massiccio dopo un ventennio di assenza. Convive con il [gatto
      selvatico](/especie/felis_silvestris/), il ghiro e il driomio, piccolo roditore limitato in Italia a
      Calabria e Friuli. Nei boschi Ã¨ frequente lo scoiattolo nero meridionale. Alla fine del 2011 sono stati
      reintrodotti 75 [caprioli](/especie/capreolus_capreolus/) italici, sottospecie autoctona assente da
      circa un secolo.


      Nei cieli dominano i rapaci. L'[aquila di Bonelli](/especie/aquila_fasciata/), a rischio estinzione in
      Italia peninsulare, nidifica con due coppie nel parco; Ã¨ tornata a riprodursi anche l'[aquila
      reale](/especie/aquila_chrysaetos/). Tra i rapaci notturni caccia il [gufo reale](/especie/bubo_bubo/),
      accanto a coturnice e [picchio nero](/especie/dryocopus_martius/).


      Al suolo vivono la vipera comune, il cervone e la [testuggine di Hermann](/especie/testudo_hermanni/).
