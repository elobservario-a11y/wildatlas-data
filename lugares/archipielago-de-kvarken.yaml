resumen:
  es: >-
    El laboratorio mundial del reajuste isostático postglaciar (Patrimonio Mundial UNESCO transfronterizo con
    Höga Kusten en Suecia), donde la tierra emerge del mar Báltico a razón de 1 cm al año.
  en: >-
    The world's premier natural laboratory for post-glacial isostatic rebound (transboundary UNESCO World
    Heritage site with Sweden's High Coast), where land rises from the Baltic Sea at 1 cm annually.
  fr: >-
    Le laboratoire mondial du relèvement isostatique postglaciaire (bien transfrontalier avec la Haute Côte en
    Suède), où la terre émerge de la Baltique à raison de 1 cm par an.
  de: >-
    Das weltweite Freilandlabor der nacheiszeitlichen Landhebung (grenzüberschreitendes UNESCO-Welterbe mit
    Schwedens Höga Kusten), wo das Land um 1 cm pro Jahr aus der Ostsee steigt.
  it: >-
    Il laboratorio naturale mondiale del rimbalzo isostatico postglaciale (sito UNESCO transfrontaliero con
    l'Alta Costa svedese), dove la terra emerge dal Baltico di 1 cm all'anno.
  pt: >-
    O laboratório natural mundial do reajuste isostático pós-glaciar (sítio transfronteiriço da UNESCO com a
    Costa Alta na Suécia), onde a terra emerge do Báltico à razão de 1 cm por ano.
unico:
  es: >-
    Aquí la tierra sube casi diez milímetros al año, y en unos 2.000 años el fondo del mar emergerá y partirá
    el golfo de Botnia en dos.
  en: >-
    Here the land rises nearly ten millimetres per year, and in some 2,000 years the seabed will emerge
    completely, dividing the Gulf of Bothnia into two.
  fr: >-
    Ici, le sol s'élève de près de dix millimètres par an, et dans environ 2 000 ans les fonds marins
    émergeront pour scinder le golfe de Botnie en deux.
  de: >-
    Hier hebt sich der Meeresboden um fast zehn Millimeter pro Jahr; in rund 2.000 Jahren wird das Land die
    Ostsee teilen und den Bottnischen Meerbusen in zwei Gewässer trennen.
  it: >-
    Qui la terra si solleva di quasi dieci millimetri all'anno e tra circa 2.000 anni il fondale emergerà
    scindendo il golfo di Botnia in due bacini.
  pt: >-
    Aqui o solo eleva-se quase dez milímetros ao ano, e em cerca de 2.000 anos o fundo marinho emergirá
    dividindo o golfo de Bótnia em dois.
observaciones:
  es: >-
    La temporada recomendada va de mayo a octubre. La afluencia es media en la torre de observación de
    Björköby y en el puente de Replot, y para las aves lo mejor es la migración de primavera.
texto:
  es:
    intro: >-
      En Kvarken el mar se está convirtiendo en tierra delante de tus ojos. Las morrenas que dejó la Edad de
      Hielo siguen emergiendo del Báltico: el fondo marino pasa a ser suelo y las playas se vuelven bosque. El
      hielo se retiró de aquí hace unos 9.600 años, y el terreno, que había quedado comprimido bajo su peso,
      se elevó con rapidez en un proceso llamado rebote isostático que todavía no ha terminado. Hoy el
      archipiélago, en la costa de Ostrobotnia, es el primer Patrimonio Natural Mundial de la UNESCO de
      Finlandia.
    landscape: >-
      La cifra más difícil de imaginar es esta: Kvarken se ha alzado 285 m desde que se retiró el hielo, una
      de las tasas de elevación más altas del mundo. Lo que se ve es un paisaje de poca profundidad: entre las
      costas continentales hay unos 80 km, pero entre las islas más externas solo 25 km, y el agua ronda los
      25 m. En el lado finlandés hay un gran archipiélago, con las islas grandes de Replot y Björkö y más de
      5.600 islas menores.


      Esa elevación deja una firma: las morrenas de De Geer, que forman grupos regulares paralelos al frente
      del hielo. Y deja lagunas: el levantamiento del terreno crea lagunas costeras protegidas llamadas flads
      y gloes, que ofrecen un entorno submarino pequeño y protegido frente a las duras condiciones del mar. El
      cambio es constante: la costa va uniendo bahías poco profundas con tierra firme.


      El sitio de la parte finlandesa ocupa 1944 km², de los cuales 293 son tierra. En cifras del gestor, el
      Patrimonio Mundial de Kvarken ocupa 194.400 ha, el 85 % de ellas mar.
    wildlife: >-
      Kvarken es para quien mira hacia arriba. Svedjehamn aparece entre los diez mejores de Finlandia para la
      observación de aves en el concurso Tornien taisto, «la batalla de las torres», de BirdLife Finland. En
      los primeros días de mayo se llegan a ver hasta cien especies desde la torre Saltkaret. El número de
      individuos y de especies es máximo entre abril y junio, durante la migración de primavera y la cría, y
      la migración de primavera de los busardos alcanza su punto máximo a mediados de abril, en el oeste de la
      torre.


      Nidifican más de cien especies de aves. Las más excepcionales y raras son el ánade friso, el [pigargo
      europeo](/especie/haliaeetus_albicilla/) y el [pico dorsiblanco](/especie/dendrocopos_leucotos/). Entre
      las aves acuáticas, las más comunes son el porrón moñudo, la serreta grande, el somormujo lavanco y el
      [ánade azulón](/especie/anas_platyrhynchos/). Entre las raras citadas están el colimbo grande, el
      [avetoro común](/especie/botaurus_stellaris/), la [cigüeña blanca](/especie/ciconia_ciconia/) y la
      oropéndola europea.


      En invierno, cuando el mar sigue abierto más lejos, la playa al noreste de Svedjehamn es buen punto de
      observación en diciembre. El resto del invierno, de enero a marzo, el lugar queda muy tranquilo tras la
      helada del mar.
    visit: >-
      Se llega a casi todos los puntos de interés en coche o en barco; también se puede recorrer el
      archipiélago en bici, en kayak, a pie o en un crucero patrimonial. Empieza por el centro de visitantes,
      el World Heritage Gateway, en Replot, a unos 20 minutos en coche de Vaasa. Su vestíbulo explica el sitio
      con textos, vídeos, animaciones y folletos todo el año y gratis, la exposición principal se llama
      Weichsel, y las visitas guiadas se ofrecen todo el año con reserva previa. Justo al lado está el puente
      de Replot, un buen sitio para pasear y contemplar el paisaje. También hay una guía de audio de 75
      episodios, con relatos, imágenes y películas de 75 lugares del sitio.


      De ahí, el destino clásico es Svedjehamn, un puerto de pesca entre morrenas. Desde Vaasa se llega por
      las carreteras Alskatintie y Björköntie, y junto al puerto hay aparcamiento y señales a la ruta y a la
      torre. Allí hay fogón, sendero de naturaleza, torre de observación, playa, café y exposición. Bodvattnet
      runt es una ruta circular de naturaleza de 3,8 km junto al puerto, y el sendero de Svedjehamn a Panike
      recorre 12 km y cruza dos estrechos que se atraviesan en barca.
    history: >-
      La historia de Kvarken es también la del mar helado. Cuando el mar se helaba entre las dos costas, el
      correo cruzaba por aquí, una ruta que se usó mucho cuando Finlandia era parte de Suecia. En las islas
      del centro se alza el faro de Valsörarna, de 36 m y construido en 1885, cuya estructura recuerda a la
      Torre Eiffel.


      La UNESCO inscribió Kvarken en 2006 junto con la Costa Alta sueca por su excepcional muestra de
      elevación isostática. Gran parte del archipiélago pertenece a la red Natura 2000 y también está
      protegida por HELCOM. Metsähallitus y la administración regional sueca coordinan la gestión, y en los
      pueblos de Kvarken viven muchos pescadores y agricultores y sus descendientes, con quienes la
      cooperación es esencial.
    before: >-
      La temporada recomendada va de mayo a octubre. La afluencia es media en la torre de observación de
      Björköby y en el puente de Replot, y para las aves lo mejor es la migración de primavera.
  en:
    intro: >-
      In Kvarken, the sea is turning into solid land before your very eyes. Glacial moraine ridges deposited
      during the Ice Age continue to emerge relentlessly from the shallow Baltic waters: undersea floor
      becomes dry ground, and stony shores evolve into dense boreal forest. Continental ice sheets retreated
      roughly 9,600 years ago, and the crust, depressed under miles of ice, rebounded at world-record speed in
      a process known as post-glacial isostatic rebound that continues unabated today. The archipelago off the
      Ostrobothnian coast constitutes Finland's first UNESCO World Natural Heritage site.
    landscape: >-
      The most striking figure to grasp is this: Kvarken has risen 285 m since the ice sheets vanished,
      representing one of the highest land uplift rates on Earth. What you see is an exceptionally shallow
      maritime landscape: while mainland shores are separated by 80 km across the Gulf of Bothnia, only 25 km
      separate the outermost Swedish and Finnish islands, and average water depths hover around just 25 m. On
      the Finnish side lies an intricate archipelago featuring large inhabited islands like Replot and Björkö
      alongside more than 5,600 smaller islets.


      This continuous uplift leaves a distinctive geological signature: washboard-like De Geer moraine ridges,
      running in parallel swarms perpendicular to glacial ice flow. It also creates protected shallow bays:
      progressive land uplift isolates brackish inlets from the open sea, evolving through stages known
      locally as flads and gloes, providing sheltered nursery grounds shielded from Baltic wave energy.
      Coastal change is relentless as shallow bays gradually fuse with mainland shores.


      The Finnish component of the World Heritage site spans 1944 km², of which 293 km² are land. Under
      national management figures, the protected Kvarken property encompasses 194,400 ha, with 85% comprising
      marine waters.
    wildlife: >-
      Kvarken is paradise for birdwatchers looking skyward. Svedjehamn consistently ranks among Finland's top
      ten birding venues in BirdLife Finland's annual 'Battle of the Towers' competition (Tornien taisto).
      During the first days of May, observers have recorded up to a hundred bird species in a single day from
      the Saltkaret observation tower. Avian numbers and species diversity peak between April and June during
      spring migration and breeding, with rough-legged buzzard passage peaking in mid-April directly west of
      the tower.


      More than a hundred bird species nest within the archipelago. Exceptional breeders include the gadwall,
      the [white-tailed eagle](/especie/haliaeetus_albicilla/), and the threatened [white-backed
      woodpecker](/especie/dendrocopos_leucotos/). Abundant waterfowl include tufted duck, red-breasted
      merganser, great crested grebe, and [mallard](/especie/anas_platyrhynchos/). Notable rarities recorded
      include yellow-billed diver, [great bittern](/especie/botaurus_stellaris/), [white
      stork](/especie/ciconia_ciconia/), and Eurasian golden oriole.


      In early winter, when offshore leads remain ice-free, the rocky coast north-east of Svedjehamn offers
      rewarding birding in December. Throughout the rest of winter, from January to March, deep quiet blankets
      the archipelago as the surrounding sea freezes solid.
    visit: >-
      Most key sites are reachable by car or passenger boat, while the wider archipelago invites exploration
      by bicycle, sea kayak, walking trails, or heritage cruises. Begin at the World Heritage Gateway visitor
      centre in Replot, roughly 20 minutes by road from Vaasa. Its entrance exhibition interprets the heritage
      property year-round through films, animations, and brochures; the core exhibition is titled Weichsel,
      with guided tours arranged year-round upon booking. Directly adjacent stands the impressive Replot
      bridge, offering panoramic vistas across the sound. An audio guide comprising 75 episodes shares local
      folklore and ecological insights across 75 sites throughout the archipelago.


      From Replot, the classic journey leads to Svedjehamn, a traditional wooden fishing harbour set amidst
      ribbed moraines. From Vaasa it is reached via the Alskatintie and Björköntie roads; parking and trail
      markers stand beside the harbour. Amenities include a public campfire shelter, nature trail, observation
      tower, swimming area, summer café, and museum. Bodvattnet runt is a 3.8 km circular trail starting from
      the harbour, while the long-distance trek from Svedjehamn to Panike covers 12 km and crosses two sounds
      using self-operated rowboats.
    history: >-
      The history of Kvarken is inseparable from the frozen sea. When winter ice sheets linked the Finnish and
      Swedish coasts, the historic winter mail route operated across the frozen sound, maintaining essential
      communications when Finland formed part of the Swedish Kingdom. Out on the central reefs rises the
      Valsörarna lighthouse, built in 1885 and standing 36 m high, designed by the firm that built the Eiffel
      Tower.


      UNESCO inscribed Kvarken in 2006 as a joint serial transboundary site alongside Sweden's High Coast in
      recognition of its peerless demonstration of rapid isostatic rebound. Most of the archipelago belongs to
      the Natura 2000 network and is protected under HELCOM Baltic agreements. Metsähallitus coordinates
      regional stewardship in active partnership with local fishing and farming communities whose livelihoods
      depend on the sea.
    before: >-
      Optimal visiting season extends from May to October. Moderate visitor numbers gather around the Björköby
      tower and Replot bridge, while birdwatching is at its absolute prime during spring migration.
  fr:
    intro: >-
      À Kvarken, la mer se métamorphose en terre ferme sous vos yeux. Les moraines déposées par la calotte de
      l'ère glaciaire émergent inexorablement des eaux de la Baltique : les hauts-fonds deviennent des rivages
      et les grèves se transforment en forêts boréales. Le grand glacier s'est retiré d'ici il y a environ 9
      600 ans, et l'écorce terrestre, comprimée sous son poids colossal, s'est relevée à un rythme
      exceptionnel par le phénomène de rebond isostatique qui se poursuit encore aujourd'hui. Cet archipel de
      la côte d'Ostrobotnie constitue le premier bien naturel du Patrimoine mondial de l'UNESCO en Finlande.
    landscape: >-
      Le chiffre le plus spectaculaire est le suivant : Kvarken s'est exhaussé de 285 m depuis la fonte des
      glaces, soit l'un des taux de soulèvement les plus rapides de la planète. Ce qui s'offre au regard est
      un paysage marin remarquablement peu profond : si 80 km séparent les côtes continentales finlandaise et
      suédoise, 25 km seulement séparent les îles extérieures, et la profondeur moyenne oscille autour de 25
      m. Côté finlandais s'étire un vaste archipel dominé par les grandes îles de Replot et Björkö, complétées
      par plus de 5 600 îlots rocheux.


      Cette surrection permanente imprime sa signature géologique : les moraines de De Geer, cordons réguliers
      parallèles au front de l'ancien glacier. Elle engendre également des lagunes côtières protégées appelées
      flads et gloes, offrant un milieu sous-marin calme à l'abri de la houle baltique. La dynamique est
      incessante : la côte intègre progressivement baies et chenaux à la terre ferme.


      Le bien côté finlandais couvre 1944 km², dont 293 km² de terres émergées. Selon les chiffres officiels,
      le bien de Kvarken totalise 194 400 ha, dont 85 % d'espaces marins.
    wildlife: >-
      Kvarken s'adresse aux passionnés qui scrutent le ciel. Svedjehamn figure parmi les dix meilleurs sites
      d'observation ornithologique de Finlande lors du concours annuel Tornien taisto organisé par BirdLife
      Finland. Dès les premiers jours de mai, on peut identifier jusqu'à cent espèces en une journée depuis la
      tour Saltkaret. L'abondance et la diversité des oiseaux culminent entre avril et juin lors de la
      migration et de la reproduction printanières, le passage des buses atteignant son zénith à la mi-avril à
      l'ouest de la tour.


      Plus de cent espèces d'oiseaux nichent sur l'archipel. Parmi les plus emblématiques figurent le canard
      chipeau, le [pygargue à queue blanche](/especie/haliaeetus_albicilla/) et le rare [pic à dos
      blanc](/especie/dendrocopos_leucotos/). Les anatidés les plus communs comptent le fuligule morillon, le
      harle bièvre, le grèbe huppé et le [canard colvert](/especie/anas_platyrhynchos/). Parmi les raretés
      citées figurent le plongeon imbrin, le [butor étoilé](/especie/botaurus_stellaris/), la [cigogne
      blanche](/especie/ciconia_ciconia/) et le loriot d'Europe.


      En début d'hiver, tant que la mer reste libre au large, le littoral au nord-est de Svedjehamn offre de
      belles observations en décembre. Le reste de l'hiver, de janvier à mars, un calme absolu s'installe dès
      que la banquise fige les eaux.
    visit: >-
      La majorité des sites d'intérêt se rallient en voiture ou en bateau ; l'archipel s'explore également à
      vélo, en kayak de mer, à pied ou en croisière commentée. Débutez votre visite par le pavillon World
      Heritage Gateway à Replot, à 20 minutes de route de Vaasa. L'accueil propose gratuitement toute l'année
      des expositions, des films et des cartes ; la scénographie permanente s'intitule Weichsel, des visites
      guidées étant organisées sur réservation. Tout près s'élance le pont suspendu de Replot, offrant un
      point de vue exceptionnel. Un audioguide en 75 épisodes raconte l'histoire et la nature de 75 stations
      remarquables.


      De là, la destination incontournable est Svedjehamn, port de pêche traditionnel enclavé entre des
      cordons morainiques. Depuis Vaasa, on y accède par les routes Alskatintie et Björköntie ; un parking et
      des sentiers balisés attendent les visiteurs au port. Le site dispose d'une aire de pique-nique, d'un
      sentier nature, de la tour Saltkaret, d'une plage, d'un café et d'un musée. Bodvattnet runt est une
      boucle nature de 3,8 km partant du port, tandis que le sentier de Svedjehamn à Panike s'étend sur 12 km
      et franchit deux bras de mer à l'aide de barques à rames.
    history: >-
      L'histoire de Kvarken est intimement liée à la mer gelée. Lorsque la banquise reliait les deux rives, la
      route de la poste hivernale franchissait le détroit, une liaison stratégique du temps où la Finlande
      appartenait au royaume de Suède. Sur les îlots centraux s'élève le phare de Valsörarna, haut de 36 m et
      érigé en 1885, dont l'ossature métallique fut conçue par les ateliers de Gustave Eiffel.


      L'UNESCO a inscrit Kvarken en 2006 en extension transfrontalière de la Haute Côte suédoise en hommage à
      son laboratoire géologique d'élévation isostatique. Une grande part de l'archipel appartient au réseau
      Natura 2000 et bénéficie de la protection de la convention HELCOM. L'agence Metsähallitus gère le site
      en concertation avec les communautés d'agriculteurs et de pêcheurs côtiers.
    before: >-
      Saison recommandée : de mai à octobre. La fréquentation est modérée autour de la tour de Björköby et du
      pont de Replot ; le printemps offre le meilleur spectacle pour l'avifaune migratrice.
  de:
    intro: >-
      Im Kvarken wird das Meer vor deinen Augen zu festem Land. Die Moränenrücken, die die letzte Eiszeit
      hinterlassen hat, steigen unaufhaltsam aus der Ostsee empor: Flachwasser verwandelt sich in Strände, und
      Strände werden zu borealem Nadelwald. Vor etwa 9.600 Jahren wich das Inlandeis aus dieser Region, und
      die entlastete Erdkruste hob sich mit weltweiter Rekordgeschwindigkeit — ein isostatischer
      Hebungsprozess, der bis heute anhält. Die Inselwelt vor der Küste Österbottens ist Finnlands erstes
      UNESCO-Weltnaturerbe.
    landscape: >-
      Die eindrucksvollste Zahl lautet: Kvarken hat sich seit dem Abschmelzen der Eismassen um 285 m gehoben,
      eine der höchsten Hebungsraten der Erde. Vor Ort blickst du auf ein extrem seichtes Meeresgebiet:
      Während die Festlandküsten von Finnland und Schweden 80 km auseinanderliegen, trennen die äußersten
      Inseln nur 25 km bei durchschnittlichen Wassertiefen von lediglich 25 m. Auf finnischer Seite erstreckt
      sich ein weitläufiger Archipel mit den großen Inseln Replot und Björkö sowie mehr als 5.600 kleineren
      Inseln und Schären.


      Die Hebung hinterlässt typische Landschaftsformen: De-Geer-Moränen, die als parallele Rippen quer zur
      Bewegungsrichtung des Eises verlaufen. Zudem schnüren sie Buchten ab: Die Landhebung verwandelt
      Meeresarme in geschützte Lagunen (flads und gloes), die vor den Wellen der offenen Ostsee geschützt
      sind. Der Wandel vollzieht sich ununterbrochen, indem Flachwasserzonen mit dem Festland verwachsen.


      Der finnische Teil des Welterbes umfasst 1944 km², wovon 293 km² Landfläche sind. Nach Angaben der
      Verwaltung erstreckt sich das Welterbegebiet über 194.400 ha, davon 85 % Meeresfläche.
    wildlife: >-
      Kvarken belohnt den aufmerksamen Blick in den Himmel. Svedjehamn zählt zu den zehn besten
      Vogelbeobachtungsplätzen Finnlands beim jährlichen Wettbewerb 'Turmkampf' (Tornien taisto) von BirdLife
      Finland. In den ersten Maitagen lassen sich vom Aussichtsturm Saltkaret bis zu hundert Vogelarten an
      einem einzigen Tag beobachten. Vogelzug und Brutzeit erreichen zwischen April und Juni ihren Höhepunkt,
      wobei der Raufußbussardzug Mitte April westlich des Turms gipfelt.


      Über hundert Vogelarten brüten im Archipel. Zu den bemerkenswertesten Arten gehören die Schnatterente,
      der [Seeadler](/especie/haliaeetus_albicilla/) und der seltene
      [Weißrückenspecht](/especie/dendrocopos_leucotos/). Unter den Wasservögeln dominieren Reiherente,
      Gänsesäger, Haubentaucher und [Stockente](/especie/anas_platyrhynchos/). Zu den nachgewiesenen
      Seltenheiten zählen Eistaucher, [Rohrdommel](/especie/botaurus_stellaris/),
      [Weißstorch](/especie/ciconia_ciconia/) und Pirol.


      Im Frühwinter, solange das küstennahe Wasser eisfrei bleibt, bietet der Strand nordöstlich von
      Svedjehamn im Dezember lohnende Beobachtungen. Den restlichen Winter über, von Januar bis März, herrscht
      nach dem Zufrieren des Meeres tiefe Stille im Archipel.
    visit: >-
      Die meisten Sehenswürdigkeiten sind per Auto oder Boot erreichbar; auch Radtouren, Seekajakfahrten und
      Wanderungen sind beliebt. Erster Anlaufpunkt ist das Besucherzentrum World Heritage Gateway in Replot,
      etwa 20 Autominuten von Vaasa entfernt. Das Foyer informiert ganzjährig kostenlos mit Filmen und Karten;
      die Hauptausstellung heißt Weichsel. Direkt daneben überspannt die imposante Replot-Brücke den Sund und
      eröffnet weite Ausblicke. Ein Audioguide mit 75 Episoden schildert Natur und Kulturgeschichte an 75
      Stationen im Archipel.


      Klassisches Ausflugsziel ist der historische Fischerhafen Svedjehamn inmitten der Moränenlandschaft. Von
      Vaasa führen die Straßen Alskatintie und Björköntie direkt dorthin; am Hafen stehen Parkplätze und
      Schautafeln bereit. Es gibt Feuerstellen, einen Naturlehrpfad, den Turm Saltkaret, Badestelle und Café.
      Bodvattnet runt ist ein 3,8 km langer Rundweg um eine verlandete Bucht; der Wanderweg von Svedjehamn
      nach Panike misst 12 km und überquert zwei Meeresengen per Ruderboot.
    history: >-
      Die Geschichte Kvarkens ist eng mit dem Eiswinter verknüpft: Als das Meer zwischen beiden Küsten zufror,
      verlief hier die historische Winterpostroute zwischen Schweden und Finnland. Auf den zentralen
      Außeninseln steht der 36 m hohe Leuchtturm Valsörarna aus dem Jahr 1885, dessen Eisenkonstruktion aus
      derselben Werkstatt wie der Eiffelturm stammt.


      Die UNESCO nahm Kvarken 2006 als grenzüberschreitende Erweiterung der schwedischen Höga Kusten in das
      Welterbe auf. Große Teile gehören zum Natura 2000-Netzwerk und sind durch HELCOM geschützt. Die
      Forstbehörde Metsähallitus koordiniert die Pflege gemeinsam mit der lokalen Bevölkerung aus Fischern und
      Bauern.
    before: >-
      Empfohlene Besuchszeit: Mai bis Oktober. Mäßiger Besucherandrang am Turm Björköby und an der
      Replot-Brücke; der Vogelzug im Frühling bietet die eindrucksvollsten Naturerlebnisse.
  it:
    intro: >-
      A Kvarken il mare si tramuta in terraferma sotto i tuoi occhi. I cordoni morenici lasciati dall'era
      glaciale continuano a emergere dal Baltico: i bassifondi marini diventano spiagge e i litorali pietrosi
      si trasformano in foreste boreali. I ghiacci si ritirarono da quest'area circa 9.600 anni fa e la crosta
      terrestre, compressa sotto il loro peso, si è risollevata a velocità record in un rimbalzo isostatico
      tuttora attivo. L'arcipelago sulla costa dell'Ostrobotnia è il primo sito naturale della Finlandia
      iscritto nel Patrimonio Mondiale dell'UNESCO.
    landscape: >-
      Il dato più sorprendente è questo: Kvarken si è innalzato di 285 m dallo scioglimento dei ghiacci, uno
      dei tassi di sollevamento più rapidi al mondo. Ciò che si contempla è un paesaggio marino
      straordinariamente basso: se tra le due coste continentali corrono 80 km, tra le isole esterne vi sono
      appena 25 km con fondali medi attorno a soli 25 m. Sul versante finlandese si allarga un arcipelago con
      le grandi isole di Replot e Björkö e oltre 5.600 isolotti minori.


      Questo continuo sollevamento imprime una fisionomia peculiare: le morene di De Geer, allineate in fasce
      parallele al fronte dell'antico ghiacciaio. Modella inoltre baie protette in fase di isolamento dal mare
      (flads e gloes), che offrono un ambiente sottomarino riparato dal moto ondoso del Baltico. La linea di
      costa muta continuamente, unendo le insenature alla terraferma.


      La porzione finlandese del sito si estende per 1944 km², dei quali 293 km² sono terre emerse. Secondo i
      dati gestionali, l'area protetta di Kvarken abbraccia 194.400 ha, coperti per l'85% dalle acque marine.
    wildlife: >-
      Kvarken premia chi rivolge lo sguardo al cielo. Svedjehamn compare tra i dieci migliori siti
      ornitologici della Finlandia nella gara annuale delle torri (Tornien taisto) di BirdLife Finland. Nei
      primi giorni di maggio dalla torre Saltkaret si possono identificare sino a cento specie in un solo
      giorno. La varietà avifaunistica raggiunge l'apice tra aprile e giugno durante il passo e la
      nidificazione, con la migrazione della poiana calzata al culmine a metà aprile a ovest della torre.


      Nell'arcipelago nidificano oltre cento specie di volatili. Tra le più notevoli figurano la canapiglia,
      l'[aquila di mare](/especie/haliaeetus_albicilla/) e il raro [picchio
      dorsobianco](/especie/dendrocopos_leucotos/). Tra gli uccelli acquatici abbondano moretta, smergo
      maggiore, svasso maggiore e [germano reale](/especie/anas_platyrhynchos/). Tra le rarità documentate si
      annoverano strolaga maggiore, [tarabuso](/especie/botaurus_stellaris/), [cicogna
      bianca](/especie/ciconia_ciconia/) e rigogolo.


      A inizio inverno, finché il mare resta sgombro al largo, la spiaggia a nord-est di Svedjehamn offre
      buone osservazioni a dicembre. Nei restanti mesi invernali, da gennaio a marzo, cala un silenzio totale
      non appena la banchisa congela le acque.
    visit: >-
      La maggior parte dei luoghi si raggiunge in auto o in barca; l'arcipelago si presta a escursioni in
      bicicletta, kayak, a piedi o con battelli turistici. Il punto di partenza ideale è il centro visite
      World Heritage Gateway a Replot, a circa 20 minuti di guida da Vaasa. L'atrio accoglie gratuitamente
      tutto l'anno con proiezioni e mostre; l'allestimento principale si intitola Weichsel, con visite guidate
      prenotabili. Accanto sorge il ponte di Replot, affacciato su ampie visuali. Un'audioguida in 75 puntate
      illustra storie e natura di 75 luoghi dell'arcipelago.


      Da Replot la meta classica è Svedjehamn, borgo marinaro incastonato tra le morene. Da Vaasa si giunge
      percorrendo le strade Alskatintie e Björköntie; vicino al porto si trovano parcheggio, torre panoramica
      e percorsi. L'anello naturalistico Bodvattnet runt misura 3,8 km intorno al bacino costiero, mentre il
      sentiero da Svedjehamn a Panike copre 12 km attraversando due bracci di mare con barche a remi.
    history: >-
      La storia di Kvarken si lega indissolubilmente al mare ghiacciato: quando la morsa del gelo univa le
      sponde, il servizio postale transitava sulla banchisa tra Svezia e Finlandia. Sugli scogli esterni sorge
      il faro di Valsörarna, eretto nel 1885 con 36 m d'altezza, la cui struttura metallica fu realizzata
      dalle stesse officine della Torre Eiffel.


      L'UNESCO ha inserito Kvarken nel 2006 come estensione seriale transfrontaliera con l'Alta Costa svedese
      a riconoscimento del fenomeno isostatico. Gran parte dell'area appartiene alla rete Natura 2000 ed è
      protetta dalla convenzione HELCOM. L'ente Metsähallitus coordina la gestione in sinergia con i pescatori
      e gli agricoltori locali.
    before: >-
      Periodo ideale: da maggio a ottobre. Affluenza moderata presso la torre di Björköby e il ponte di
      Replot; la primavera regala il momento migliore per l'avifauna migratrice.
  pt:
    intro: >-
      Em Kvarken o mar está a transformar-se em terra firme diante dos teus olhos. Os relevos morenicos
      depositados na Idade do Gelo emergem sem cessar das águas do Báltico: os baixios marinhos convertem-se
      em margens secas e as praias transformam-se em taiga densa. A calota de gelo recuou há cerca de 9.600
      anos e a crosta terrestre, aliviada do peso continental, elevou-se a uma velocidade ímpar através do
      ressalto isostático que se mantém ativo. Este arquipélago na costa da Ostrobótnia constitui o primeiro
      bem natural da Finlândia no Património Mundial da UNESCO.
    landscape: >-
      A estatística mais desconcertante é esta: Kvarken elevou-se 285 m desde o degelo, traduzindo uma das
      taxas de soerguimento mais velozes do globo. O que se observa é um relevo marinho extraordinariamente
      raso: enquanto as margens continentais distam 80 km, entre as ilhas periféricas suecas e finlandesas
      medeiam apenas 25 km com fundos médios em torno de 25 m. Do lado finlandês desenvolve-se um vasto
      arquipélago dominado pelas ilhas de Replot e Björkö e por mais de 5.600 ilhéus menores.


      Esta dinâmica contínua imprime uma assinatura singular: as moreias de De Geer, alinhadas em faixas
      paralelas ao avanço da frente glaciar fóssil. Modela também lagoas costeiras resguardadas (flads e
      gloes), que oferecem um meio subaquático calmo e protegido das tempestades do Báltico. A linha de costa
      transforma-se a olhos vistos, fundindo enseadas com a terra firme.


      O polígono finlandês do bem compreende 1944 km², dos quais 293 km² correspondem a terra emersa. Em
      termos de gestão territorial, a área classificada de Kvarken abrange 194.400 ha, dos quais 85% são de
      domínio marítimo.
    wildlife: >-
      Kvarken recompensa quem ergue os olhos para o céu. Svedjehamn figura entre os dez melhores postos de
      observação de aves da Finlândia na maratona ornitológica Tornien taisto da BirdLife Finland. Nos
      primeiros dias de maio chegam a registar-se até cem espécies num só dia a partir da torre Saltkaret. A
      abundância atinge o auge entre abril e junho com o fluxo migratório e a reprodução, culminando a
      passagem de águias-pesqueiras e bútios a meio de abril a oeste da torre.


      Nidificam mais de cem espécies de aves no arquipélago. Entre as mais notáveis figuram o frisada, o
      [pigargo-comum](/especie/haliaeetus_albicilla/) e o raro
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/). As aves aquáticas mais abundantes são o
      negrinha, o merganso-grande, o mergulhão-de-crista e o [pato-real](/especie/anas_platyrhynchos/). Entre
      as raridades inventariadas contam-se a mobelha-grande, o [abcaravão](/especie/botaurus_stellaris/), a
      [cegonha-branca](/especie/ciconia_ciconia/) e o papa-figos.


      No princípio do inverno, enquanto o largo oceânico permanece sem gelo, a enseada a nordeste de
      Svedjehamn faculta boas observações em dezembro. No restante período invernal, de janeiro a março, reina
      uma quietude total assim que a água congela.
    visit: >-
      A generalidade dos locais é acessível por automóvel ou barco, podendo também o arquipélago ser
      percorrido em bicicleta, caiaque, a pé ou em circuitos marítimos turísticos. Começa no pavilhão World
      Heritage Gateway em Replot, a 20 minutos de estrada de Vaasa. O centro faculta mostras informativas,
      vídeos e folhetos gratuitos todo o ano; a exposição central intitula-se Weichsel. Ao lado impõe-se a
      ponte suspensa de Replot, com perspetivas panorâmicas sobre o estreito. Um audioguia de 75 episódios
      documenta relatos orais e natureza ao longo de 75 paragens comemorativas.


      Dali o rumo tradicional conduz a Svedjehamn, porto piscatório de madeira emoldurado pelas cristas
      morenicas. A partir de Vaasa acede-se pelas estradas Alskatintie e Björköntie, dispondo o porto de
      estacionamento e sinalética. Oferece abrigo com lareira, torre panorâmica, praia e café. Bodvattnet runt
      é um percurso pedestre circular de 3,8 km, enquanto a grande rota de Svedjehamn a Panike totaliza 12 km
      e vence dois esteiros com barcos a remos comunitários.
    history: >-
      A crónica de Kvarken conjuga-se com o mar gelado: quando a banquise unia as duas margens, a rota postal
      invernal atravessava o estreito, assegurando a ligação estratégica no tempo em que a Finlândia pertencia
      ao reino sueco. Nos ilhéus centrais eleva-se o farol de Valsörarna, erguido em 1885 com 36 m de altura,
      cuja armação de ferro foi forjada pela mesma empresa que projetou a Torre Eiffel.


      A UNESCO inscreveu Kvarken em 2006 como extensão transfronteiriça da Costa Alta sueca em virtude do seu
      relevo isostático ímpar. Grande parte do arquipélago integra a rede Natura 2000 e beneficia de proteção
      HELCOM. O organismo florestal Metsähallitus coordena a gestão de mãos dadas com os pescadores e
      agricultores locais.
    before: >-
      Época mais propícia: de maio a outubro. A afluência é moderada junto à torre de Björköby e à ponte de
      Replot; a primavera oferece as melhores condições para contemplar aves migradoras.
