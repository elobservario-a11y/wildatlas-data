resumen:
  es: >-
    Cabo Kolka donde chocan las corrientes del Báltico y del golfo de Riga, dunas boscosas históricas Livonas
    (*Kangari*) y costa de acantilados de arcilla.
  en: >-
    Cape Kolka where the currents of the Baltic Sea and the Gulf of Riga collide, ancient Livonian wooded
    dunes (*Kangari*), and clay coastal bluffs.
  fr: >-
    Cap Kolka où s'entrechoquent les courants de la Baltique et du golfe de Riga, dunes boisées livoniennes
    (*Kangari*) et falaises d'argile du littoral.
  de: >-
    Kap Kolka, wo Ostsee und Rigaischer Meerbusen aufeinandertreffen, uralte livische bewaldete Dünenzüge
    (*Kangari*) und Steilufer aus Ton.
  it: >-
    Capo Kolka dove convergono le correnti del Baltico e del golfo di Riga, antiche dune boscate livoni
    (*Kangari*) e falesie costiere d'argilla.
  pt: >-
    Cabo Kolka onde confluem as correntes do Báltico e do golfo de Riga, dunas arborizadas seculares livónias
    (*Kangari*) e arribas costeiras de argila.
unico:
  es: >-
    Un complejo de dunas antiguas y hondonadas, los kangari y las vigas, que no existe en el mundo con una
    extensión tan grande.
  en: >-
    A complex of ancient dune ridges and swales, the kangari and vigas, whose vast geographic extent is unique
    in the world.
  fr: >-
    Un ensemble de cordons dunaires anciens et de dépressions humides, les kangari et les vigas, unique au
    monde par son étendue.
  de: >-
    Ein Komplex aus fossilen Dünenrücken und moorigen Senken, den Kangari und Vigas, der in dieser Ausdehnung
    weltweit einmalig ist.
  it: >-
    Un complesso di antichi cordoni dunosi e depressioni torbose, i kangari e le vigas, privo di eguali al
    mondo per estensione.
  pt: >-
    Um conjunto de cordões dunares fósseis e depressões húmidas, os kangari e as vigas, cuja extensão
    territorial não tem paralelo no mundo.
observaciones:
  es: >-
    El acantilado de los Zilie kalni, sus barrancos y el bosque de su pie forman la zona de régimen estricto.
    Si necesitas un sendero concreto, comprueba antes con el gestor si está abierto.
texto:
  es:
    intro: >-
      En el cabo Kolka el Báltico y el golfo de Riga chocan, y por encima de ese choque pasa una ruta de aves.
      Los días de migración, decenas de miles cruzan el cabo en una hora. Detrás, tierra adentro, hay un
      bosque que los naturalistas llaman la Selva Lluviosa del Norte, un laberinto de dunas antiguas separadas
      por hondonadas encharcadas y un puñado de pueblos de pescadores livonios. Es el Parque Nacional de
      Slītere, 16.365 hectáreas en el noroeste de Letonia, en las parroquias de Dundaga y Kolka.
    landscape: >-
      La historia geológica del Báltico se lee aquí a pie. El antiguo acantilado del lago glaciar báltico, de
      treinta a cincuenta metros, son los Zilie kalni. Más abajo está el complejo de kangari y vigas: crestas
      de dunas antiguas de kilómetros de largo, los kangari, que alternan con depresiones estrechas y
      encharcadas, las vigas. En las vigas del lago Pēterezers hay un sendero para vivir sus subidas y
      bajadas.


      Al pie del antiguo acantilado, el bosque de frondosas de la ladera, casi un siglo sin intervención
      humana, y los bosques y turberas de su pie con un microclima húmedo dan refugio a una enorme variedad de
      plantas y animales: de ahí lo de selva lluviosa. El parque reúne todos los tipos de bosque letones, la
      mitad de las plantas del país y el 60 % de sus musgos. El bosque ocupa cerca del 70 % del parque y las
      turberas el 20 %, entre ellas la de Bažu.


      En Kolka se restauran dunas grises para proteger la pulsatila de los prados y el clavel de arena, que
      necesitan claros soleados.
    wildlife: >-
      La estación fuerte es la migración. El parque tiene más de 260 especies de aves, y en primavera se
      concentra allí una gran migración; en 2007 y 2008 se contaron 135 especies nidificantes. En primavera la
      migración es larga, de modo que en Kolkasrags pueden verse casi todas las especies de aves de Letonia.
      En otoño, la playa es lugar de parada de la aguja colipinta, y en invierno llega desde Rusia el cárabo
      lapón.


      En la primavera de 2010, en la turbera de Bažu se registró el mayor lek de urogallo de Europa, con 66
      machos. En el faro de Šlītere, una exposición permanente explica la ruta migratoria que cruza Kolka y
      presenta al correlimos falcinelo.


      En Slītere viven el lobo, el [lince](/especie/lynx_lynx/) y el [alce](/especie/alces_alces/). En el
      otoño de 2006 un oso pardo estuvo en el parque tras más de 20 años de ausencia. En invierno las [focas
      grises](/especie/halichoerus_grypus/) del Báltico crían bajo el mar helado de la costa. Hay siete
      especies de anfibios, entre ellas el tritón crestado y el sapo corredor, y la culebra lisa, en vías de
      desaparecer en Letonia, tiene aquí una de sus dos localidades del país. En los ríos pequeños desova la
      lamprea de río y la trucha marina. Entre los invertebrados raros de Letonia, aquí viven la mitad de los
      escarabajos, dos tercios de los moluscos y un tercio de las mariposas.
    visit: >-
      El parque tiene cuatro senderos naturales acondicionados y varias rutas ciclistas señaladas. Los sitios
      más visitados son Kolkasrags y la costa, y el conjunto del faro de Šlītere, que sirve de mirador y para
      la educación ambiental. Para empezar, el circuito de Kolkasrags, fácil y de 3 km, recorre mar, playa y
      dunas con bosque, y el sendero de los pinos de Kolkasrags, de 1,2 km, cruza el bosque de dunas por dunas
      grises y blancas hasta la playa. En otoño y primavera lleva abrigo y prismáticos.


      El sendero de Ēvaži lleva a un acantilado de entre 8 y 15 metros sobre la playa. La playa está
      humedecida por el agua de la turbera de Bažu, y gracias a ello vive allí el sapo corredor, un anfibio
      raro en Letonia. El sendero natural de Pēterezers permite recorrer la secuencia de crestas y
      depresiones.
    history: >-
      Aquí vivieron los livonios junto al mar: los antiguos pueblos de pescadores eran Sīkrags, Mazirbe,
      Košrags, Pitrags, Saunags, Vaide, Kolka y Uši, y la cultura livonia sigue viva y es parte del patrimonio
      cultural del norte de Europa. Los pastos antiguos de Dāvids, Tamnīte y Zvejnieki guardan la huella del
      manejo tradicional.


      El núcleo se protegió como monumento natural; hasta 1999 fue la reserva estatal de Slītere y en 2000
      pasó a ser parque nacional. En la reserva no se retiraron los árboles que derribaron las tormentas de
      los años sesenta, y el bosque se regenera solo en unas 100 ha; y tras el incendio de 1992 en la turbera
      de Bažu se dejaron los árboles quemados. Slītere forma parte de Natura 2000 y del inventario letón de
      áreas importantes para las aves.
    before: >-
      El acantilado de los Zilie kalni, sus barrancos y el bosque de su pie forman la zona de régimen
      estricto. Si necesitas un sendero concreto, comprueba antes con el gestor si está abierto.
    around: >-
      Con costa, foca gris y alce en común están el [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) y el [Vilsandi
      rahvuspark](/lugar/vilsandi-rahvuspark/); con alce y lince, el [Lahemaa
      rahvuspark](/lugar/lahemaa-rahvuspark/).
  en:
    intro: >-
      At Cape Kolka, the open Baltic and the Gulf of Riga collide, and directly above that clash runs a major
      avian migratory flyway. On peak migration days, tens of thousands of birds sweep across the cape in a
      single hour. Inland stretches a forest naturalists term the Northern Rainforest, a maze of ancient dune
      ridges separated by marshy troughs alongside a scattering of traditional Livonian fishing hamlets. This
      is Slītere National Park, protecting 16,365 hectares in northwestern Latvia across the parishes of
      Dundaga and Kolka.
    landscape: >-
      The Baltic's post-glacial geological past can be read here on foot. The ancient cliffline of the Baltic
      Ice Lake, rising thirty to fifty meters high, forms the Zilie kalni (Blue Hills). Below lies the unique
      dune-and-swale complex: kilometer-long ancient dune ridges, known as kangari, alternating with narrow,
      waterlogged peat troughs called vigas. In the vigas of Lake Pēterezers, a boardwalk trail lets you
      experience these undulating crests and bog hollows.


      At the foot of the ancient bluff, the slope's deciduous woodland has grown untouched by human timber
      cutting for almost a century. The humid microclimate nurtured by bottomland forests and mires provides
      sanctuary for an immense variety of plant and animal life, earning it the rainforest moniker. The park
      hosts all forest types found in Latvia, half the country's plant species, and 60 % of its mosses. Forest
      blankets roughly 70 % of the park territory, while peat bogs account for 20 %, most prominently the Bažu
      Mire.


      Around Kolka, conservationists actively restore grey dune habitats to protect the meadow pasqueflower
      and sand pink, which require open, sunny clearings.
    wildlife: >-
      Migration season is the highlight. The park has recorded more than 260 bird species, and spring
      witnesses a massive migration front; in 2007 and 2008 surveys counted 135 nesting species. Spring
      passage lasts several weeks, allowing birdwatchers at Kolkasrags to spot almost every species on the
      Latvian national list. In autumn, the sand spit serves as a refueling stopover for bar-tailed godwits,
      while winter brings great grey owls wandering from boreal Russia.


      In the spring of 2010, the Bažu Mire hosted Europe's largest recorded capercaillie lek, with 66
      displaying cocks. At the Šlītere Lighthouse, a permanent exhibition details the flyway crossing Kolka
      and highlights the broad-billed sandpiper.


      Slītere harbors grey wolf, [Eurasian lynx](/especie/lynx_lynx/), and [moose](/especie/alces_alces/). In
      the autumn of 2006, a brown bear roamed through the park after an absence of more than 20 years. In
      winter, Baltic [grey seals](/especie/halichoerus_grypus/) breed on coastal sea ice. Seven amphibian
      species occur, including the northern crested newt and natterjack toad, while the smooth snake, on the
      verge of extirpation in Latvia, maintains one of only two national populations here. Forest streams
      provide spawning gravels for river lamprey and sea trout. Among rare Latvian invertebrates, the park
      supports half the nation's beetle species, two-thirds of its molluscs, and one-third of its butterflies.
    visit: >-
      The park offers four established nature trails and several signposted cycling itineraries. The most
      popular destinations are Kolkasrags and the seacoast, along with the Šlītere Lighthouse complex, which
      doubles as an observation viewpoint and environmental education hub. For an easy start, the 3 km
      Kolkasrags circuit loops past sea, sandy beach, and wooded dunes, while the 1.2 km Kolkasrags Pine Trail
      weaves through white and grey coastal dunes to the shore. Carry warm layers and binoculars in spring and
      autumn.


      The Ēvaži Trail leads to coastal bluffs rising between 8 and 15 meters above the beach. The shoreline is
      seeped with freshwater runoff from the Bažu Mire, sustaining rare Latvian populations of the natterjack
      toad. The Pēterezers Nature Trail lets hikers traverse the alternating sequence of dune crests and peat
      depressions.
    history: >-
      Livonian communities lived here along the shore for generations, creating historic fishing settlements
      at Sīkrags, Mazirbe, Košrags, Pitrags, Saunags, Vaide, Kolka, and Uši; Livonian culture remains alive
      today as an integral part of northern European heritage. Historic pastures at Dāvids, Tamnīte, and
      Zvejnieki preserve traces of centuries-old coastal grazing.


      The core area was initially protected as a natural monument, operating as the Slītere State Nature
      Reserve until 1999 before being designated a national park in 2000. In the reserve core, fallen timber
      felled by storms in the sixties was deliberately left untouched, allowing natural forest regeneration
      across roughly 100 ha; similarly, following a wildfire in 1992 in the Bažu Mire, charred snags were left
      standing for ecological succession. Slītere belongs to the European Natura 2000 network and the Latvian
      Important Bird Areas inventory.
    before: >-
      The Zilie kalni escarpment, its forested ravines, and the base woodlands constitute a strict nature
      reserve zone. If you plan to hike a specific trail, check in advance with park administration to verify
      whether it is currently open.
    around: >-
      Sharing coastal marine ecosystems, grey seals, and moose are [Kuršių Nerija National
      Park](/lugar/kursiu-nerijos-nacionalinis-parkas/) in Lithuania and [Vilsandi National
      Park](/lugar/vilsandi-rahvuspark/) in Estonia; sharing moose and Eurasian lynx is [Lahemaa National
      Park](/lugar/lahemaa-rahvuspark/).
  fr:
    intro: >-
      Au cap Kolka, la Baltique ouverte et le golfe de Riga s'entrechoquent, et au-dessus de cette rencontre
      passe un couloir migratoire majeur. Les jours de grand passage, des dizaines de milliers d'oiseaux
      survolent le cap en une heure. Vers l'intérieur des terres s'étend une forêt que les naturalistes
      comparent à une forêt pluviale du Nord, un dédale d'anciennes dunes séparées par des dépressions
      marécageuses et quelques villages de pêcheurs livoniens. C'est le parc national de Slītere, fort de 16
      365 hectares dans le nord-ouest de la Lettonie, sur les paroisses de Dundaga et Kolka.
    landscape: >-
      L'histoire géologique postglaciaire de la Baltique se lit ici pas à pas. L'ancienne falaise du lac
      glaciaire de la Baltique, haute de trente à cinquante mètres, forme les Zilie kalni (collines bleues).
      En contrebas s'étend le complexe des kangari et des vigas : de longues crêtes dunaires anciennes, les
      kangari, alternant avec des sillons tourbeux étroits et gorgés d'eau, les vigas. Au lac Pēterezers, un
      sentier sur caillebotis permet d'arpenter cette succession d'ondulations et de creux humides.


      Au pied de la falaise fossile, la forêt de feuillus du versant, préservée de toute coupe depuis près
      d'un siècle, et les tourbières développent un microclimat très humide favorable à une immense diversité
      végétale et animale, d'où ce qualificatif de forêt pluviale. Le parc abrite tous les types de forêts de
      Lettonie, la moitié des plantes du pays et 60 % de ses mousses. La forêt couvre environ 70 % du
      territoire et les tourbières 20 %, notamment celle de Bažu.


      À Kolka, des chantiers restaurent les dunes grises pour préserver l'anémone des prés et l'œillet des
      sables, tributaires de clairières ensoleillées.
    wildlife: >-
      La grande saison est la migration. Le parc compte plus de 260 espèces d'oiseaux, et le printemps
      concentre un flux immense ; en 2007 et 2008 furent recensées 135 espèces nicheuses. La migration
      printanière s'étale dans le temps, permettant d'observer à Kolkasrags presque toutes les espèces
      aviaires de Lettonie. À l'automne, la plage sert d'escale à la barge rousse, tandis qu'en hiver arrive
      de Russie la chouette lapone.


      Au printemps 2010, la tourbière de Bažu a enregistré la plus vaste arène de parade de grand tétras
      d'Europe, avec 66 coqs. Au phare de Šlītere, une exposition permanente explique le couloir de migration
      survolant Kolka et présente le bécasseau falcinelle.


      Slītere abrite le loup, le [lynx boréal](/especie/lynx_lynx/) et l'[élan](/especie/alces_alces/). À
      l'automne 2006, un ours brun a parcouru le parc après plus de 20 ans d'absence. En hiver, les [phoques
      gris](/especie/halichoerus_grypus/) de la Baltique mettent bas sur la banquise côtière. Sept espèces
      d'amphibiens y vivent, dont le triton crêté et le crapaud calamite, tandis que la coronelle lisse,
      menacée d'extinction en Lettonie, y maintient l'une de ses deux stations nationales. Les ruisseaux
      abritent la lamproie de rivière et la truite de mer. Parmi les invertébrés rares, le parc rassemble la
      moitié des coléoptères, deux tiers des mollusques et un tiers des papillons de Lettonie.
    visit: >-
      Le parc propose quatre sentiers de découverte aménagés et plusieurs itinéraires cyclables balisés. Les
      sites les plus fréquentés sont Kolkasrags, le rivage et l'ensemble du phare de Šlītere, qui sert de
      belvédère et de pôle d'éducation à l'environnement. Pour commencer, la boucle de Kolkasrags, facile et
      longue de 3 km, traverse la plage et les dunes boisées, tandis que le sentier des pins de Kolkasrags,
      long de 1,2 km, chemine parmi les dunes grises et blanches jusqu'à la mer. En automne et au printemps,
      prévoyez des vêtements chauds et des jumelles.


      Le sentier d'Ēvaži mène à une falaise haute de 8 à 15 mètres dominant la plage. Le rivage est humidifié
      par les résurgences de la tourbière de Bažu, ce qui permet au crapaud calamite, rare en Lettonie, de s'y
      maintenir. Le sentier de Pēterezers fait traverser la succession de crêtes et de dépressions tourbeuses.
    history: >-
      Les Livoniens ont habité cette côte pendant des générations : leurs anciens villages de pêcheurs étaient
      Sīkrags, Mazirbe, Košrags, Pitrags, Saunags, Vaide, Kolka et Uši, et la culture livonienne demeure
      vivante au cœur du patrimoine du nord de l'Europe. Les pâturages historiques de Dāvids, Tamnīte et
      Zvejnieki conservent l'empreinte des pratiques agropastorales traditionnelles.


      Le cœur du massif fut d'abord classé monument naturel, fonctionnant jusqu'en 1999 comme réserve d'État
      de Slītere avant d'être érigé en parc national en 2000. Dans la réserve, les chablis abattus par les
      tempêtes des années soixante ne furent pas évacués, laissant la forêt se régénérer spontanément sur
      environ 100 ha ; après l'incendie de 1992 dans la tourbière de Bažu, les bois brûlés furent également
      conservés sur pied. Slītere est intégré au réseau Natura 2000 et à l'inventaire letton des zones
      importantes pour les oiseaux.
    before: >-
      La falaise des Zilie kalni, ses ravins boisés et la forêt de son piémont constituent une réserve
      intégrale. Si vous souhaitez emprunter un itinéraire particulier, vérifiez au préalable auprès des
      gestionnaires s'il est ouvert au public.
    around: >-
      Partageant littoral marin, phoque gris et élan se trouvent le [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) en Lituanie et le [Vilsandi
      rahvuspark](/lugar/vilsandi-rahvuspark/) en Estonie ; partageant élan et lynx boréal, le [Lahemaa
      rahvuspark](/lugar/lahemaa-rahvuspark/).
  de:
    intro: >-
      Am Kap Kolka prallen die offene Ostsee und der Rigaische Meerbusen aufeinander, und genau darüber
      verläuft eine der wichtigsten Vogelzugrouten Europas. An Zugtagen überqueren zehntausende Vögel das Kap
      binnen einer Stunde. Landeinwärts erstreckt sich ein Urwald, den Naturforscher den Regenwald des Nordens
      nennen: ein Labyrinth aus alten Binnendünen, getrennt durch nasse Moorschlenken, durchsetzt von
      historischen livischen Fischerdörfern. Das ist der Nationalpark Slītere, 16.365 Hektar im Nordwesten
      Lettlands in den Gemeinden Dundaga und Kolka.
    landscape: >-
      Die nacheiszeitliche Erdgeschichte der Ostsee lässt sich hier zu Fuß erwandern. Das fossile Kliff des
      Baltischen Eisstausees, dreißig bis fünfzig Meter hoch, bildet die Hügelkette der Zilie kalni (Blaue
      Berge). Darunter breitet sich der Komplex aus Kangari und Vigas aus: kilometerlange uralte Dünenkämme
      (Kangari), die mit schmalen, sumpfigen Senken (Vigas) abwechseln. An den Vigas des Pēterezers-Sees
      erschließt ein Bohlenweg dieses Auf und Ab.


      Am Fuß der Steilstufe blieben die Laubmischwälder des Hangs fast ein Jahrhundert lang von forstlichen
      Eingriffen verschont. Zusammen mit den Mooren am Hangfuß erzeugen sie ein feuchtes Mikroklima, das
      unzähligen Pflanzen und Tieren Schutz bietet – daher der Name Regenwald. Der Park vereint alle Waldtypen
      Lettlands, die Hälfte aller Pflanzenarten des Landes und 60 % seiner Moosarten. Wald bedeckt rund 70 %
      der Parkfläche, Moore 20 %, darunter das renommierte Bažu-Moor.


      Bei Kolka werden Graudünen entkusselt, um Wiesen-Kuhschelle und Sand-Nelke zu bewahren, die offene,
      besonnte Sandflächen brauchen.
    wildlife: >-
      Höhepunkt des Jahres ist die Zugzeit. Über 260 Vogelarten wurden im Park nachgewiesen, und das Frühjahr
      bringt gewaltige Zugströme; 2007 und 2008 wurden 135 Brutvogelarten kartiert. Der Frühjahrszug zieht
      sich über Wochen hin, sodass Vogelbeobachter an der Landspitze Kolkasrags fast jede lettische Vogelart
      sichten können. Im Herbst rastet die Pfuhlschnepfe am Strand, während im Winter der Bartkauz aus
      Russland einfliegt.


      Im Frühjahr 2010 zählte man im Bažu-Moor den größten Auerhahnbalzplatz Europas mit 66 balzenden Hähnen.
      Im Leuchtturm von Šlītere veranschaulicht eine Dauerausstellung die Zugstraße über Kolka und stellt den
      Sumpfläufer vor.


      In den Wäldern leben Wolf, [Eurasischer Luchs](/especie/lynx_lynx/) und [Elch](/especie/alces_alces/).
      Im Herbst 2006 streifte erstmals nach über 20 Jahren wieder ein Braunbär durch das Gebiet. Im Winter
      bringen die [Kegelrobben](/especie/halichoerus_grypus/) der Ostsee ihre Jungen auf dem Küsteneis zur
      Welt. Sieben Amphibienarten kommen vor, darunter Kammmolch und Kreuzkröte; die Schlingnatter, in
      Lettland vom Aussterben bedroht, besitzt hier eines ihrer zwei nationalen Vorkommen. In kleinen Bächen
      laichen Flussneunauge und Meerforelle. Unter den seltenen Wirbellosen beherbergt der Park die Hälfte
      aller Käferarten, zwei Drittel der Weichtiere und ein Drittel der Schmetterlinge Lettlands.
    visit: >-
      Vier angelegte Naturlehrpfade und mehrere beschilderte Radrouten erschließen den Park. Beliebteste Ziele
      sind Kolkasrags, der Strand und das Ensemble am Leuchtturm Šlītere mit Aussichtsplattform und
      Umweltbildungszentrum. Für den Einstieg eignet sich der leichte, 3 km lange Rundweg Kolkasrags durch
      Strand- und Dünenwälder sowie der 1,2 km lange Kiefernpfad von Kolkasrags über Grau- und Weißdünen ans
      Meer. Nimm im Frühling und Herbst warme Kleidung und ein Fernglas mit.


      Der Ēvaži-Pfad führt zu einem Kliff, das 8 bis 15 Meter über den Strand aufragt. Der Strand wird durch
      Sickerwasser aus dem Bažu-Moor befeuchtet, wodurch hier die seltene Kreuzkröte leben kann. Der Lehrpfad
      am Pēterezers-See durchquert das charakteristische Relief aus Dünenkämmen und Moorschlenken.
    history: >-
      Die Liven siedelten jahrhundertelang an dieser Küste: Ihre historischen Fischerdörfer waren Sīkrags,
      Mazirbe, Košrags, Pitrags, Saunags, Vaide, Kolka und Uši; die livische Sprache und Kultur sind
      lebendiges Erbe Nordeuropas. Historische Waldweiden bei Dāvids, Tamnīte und Zvejnieki zeugen von
      traditioneller Landnutzung.


      Das Kerngebiet wurde zunächst als Naturdenkmal geschützt, bestand bis 1999 als staatliches
      Naturschutzgebiet Slītere und wurde 2000 zum Nationalpark erhoben. Im Schutzgebiet wurden die Windwürfe
      der Stürme aus den sechziger Jahren bewusst nicht geräumt, sodass sich der Wald auf rund 100 ha völlig
      eigendynamisch regeneriert; nach dem Brand von 1992 im Bažu-Moor blieben die Totholzstämme ebenfalls
      stehen. Slītere gehört zum Schutzgebietsnetz Natura 2000 und zum lettischen Inventar bedeutender
      Vogelgebiete.
    before: >-
      Die Steilstufe der Zilie kalni, ihre Schluchten und die Hangfußwälder bilden eine Kernzone mit
      partiellem Betretungsverbot. Erkundige dich vor der Wanderung bei der Parkverwaltung nach der aktuellen
      Wegbegehbarkeit.
    around: >-
      Gemeinsamkeiten bei Küstenlebensräumen, Kegelrobbe und Elch bestehen mit dem [Kuršių nerijos
      nacionalinis parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) in Litauen und dem [Vilsandi
      rahvuspark](/lugar/vilsandi-rahvuspark/) in Estland; Elch und Luchs teilt der Park mit dem estnischen
      [Lahemaa rahvuspark](/lugar/lahemaa-rahvuspark/).
  it:
    intro: >-
      A Capo Kolka il Baltico aperto e il golfo di Riga si scontrano, e sopra questo punto di contatto
      transita una delle principali rotte migratorie dell'avifauna. Nelle giornate di picco, decine di
      migliaia di uccelli sorvolano il capo in una sola ora. Verso l'interno si estende una foresta che i
      naturalisti chiamano la Foresta Pluviale del Nord, un dedalo di dune fossili intervallate da depressioni
      allagate e piccoli borghi marinari livoni. È il Parco Nazionale di Slītere, 16.365 ettari nel nord-ovest
      della Lettonia, tra le parrocchie di Dundaga e Kolka.
    landscape: >-
      La storia geologica postglaciale del Baltico si legge qui a piedi. L'antica falesia del lago glaciale
      baltico, alta da trenta a cinquanta metri, forma le alture dei Zilie kalni (Colline Blu). Più in basso
      si sviluppa il complesso di kangari e vigas: lunghe creste dunose fossili, i kangari, che si alternano a
      strette formazioni torbose allagate, le vigas. Attorno al lago Pēterezers, un sentiero attrezzato su
      passerelle consente di attraversare questi continui saliscendi.


      Ai piedi della scarpata fossile, la foresta di latifoglie del versante, non toccata dall'uomo da quasi
      un secolo, e le torbiere basali mantengono un microclima umido che accoglie una straordinaria varietà
      botanica e zoologica, da cui la definizione di foresta pluviale. Il parco racchiude tutti i tipi di
      bosco della Lettonia, la metà della flora vascolare e il 60 % delle specie di muschi del paese. Il bosco
      copre circa il 70 % della superficie protetta e le torbiere il 20 %, tra cui spicca la torbiera di Bažu.


      Nei pressi di Kolka si ripristinano le dune grigie per tutelare l'anemone prativo e il garofanino delle
      sabbie, che necessitano di radure soleggiate.
    wildlife: >-
      La stagione culminante è la migrazione. Il parco annovera oltre 260 specie di uccelli, e in primavera il
      transito tocca numeri impressionanti; nel 2007 e 2008 si sono censite 135 specie nidificanti. La
      migrazione primaverile è prolungata, offrendo a Kolkasrags la possibilità di scorgere quasi tutte le
      specie dell'avifauna lettone. In autunno la spiaggia accoglie la sosta della pittima minore, mentre in
      inverno compare dalla Russia l'allocco di Lapponia.


      Nella primavera del 2010, nella torbiera di Bažu è stata registrata la maggiore arena di parata di gallo
      cedrone d'Europa, con 66 maschi. Nel faro di Šlītere, un allestimento permanente illustra la rotta
      migratoria che attraversa Kolka e descrive il gambecchio frullino.


      A Slītere vivono il lupo, la [lince europea](/especie/lynx_lynx/) e l'[alce](/especie/alces_alces/).
      Nell'autunno del 2006 un orso bruno ha frequentato il parco dopo oltre 20 anni di assenza. In inverno le
      [foche grigie](/especie/halichoerus_grypus/) del Baltico partoriscono sul ghiaccio marino costiero. Si
      contano sette specie di anfibi, tra cui il tritone crestato e il rospo smeraldino, mentre il colubro
      liscio, a rischio di estinzione in Lettonia, vi trova una delle sole due stazioni nazionali. Nei corsi
      d'acqua risalgono per la frega la lampreda di fiume e la trota di mare. Tra gli invertebrati rari, il
      comprensorio accoglie la metà dei coleotteri, due terzi dei molluschi e un terzo delle farfalle della
      Lettonia.
    visit: >-
      Il parco vanta quattro sentieri naturalistici allestiti e numerosi itinerari ciclabili segnalati. I
      luoghi più visitati sono Kolkasrags, la costa e il complesso del faro di Šlītere, ideale punto
      panoramico e centro di educazione ambientale. Per iniziare, l'anello di Kolkasrags, agevole e lungo 3
      km, percorre litorale, spiagge e pinete dunose, mentre il sentiero dei pini di Kolkasrags, di 1,2 km,
      attraversa dune grigie e bianche fino alla battigia. In primavera e in autunno porta abiti caldi e
      binocolo.


      Il sentiero di Ēvaži conduce a una falesia alta tra 8 e 15 metri a picco sulla spiaggia. La riva è
      lambita dalle acque di risorgiva della torbiera di Bažu, consentendo la sopravvivenza del rospo
      calamita, raro in Lettonia. Il percorso naturalistico di Pēterezers consente di apprezzare la peculiare
      alternanza tra rilievi dunosi e conche umide.
    history: >-
      Le comunità livoni abitarono questo litorale per generazioni: i borghi storici di pescatori erano
      Sīkrags, Mazirbe, Košrags, Pitrags, Saunags, Vaide, Kolka e Uši; l'eredità etnica e linguistica livone
      rimane viva nel patrimonio culturale nord-europeo. Gli storici pascoli costieri di Dāvids, Tamnīte e
      Zvejnieki testimoniano l'antica gestione agro-pastorale.


      Il nucleo fu protetto originariamente come monumento naturale; fino al 1999 fu riserva statale di
      Slītere e nel 2000 divenne parco nazionale. Nella riserva non furono rimossi gli schianti provocati
      dalle tempeste degli anni sessanta, permettendo al bosco di rigenerarsi spontaneamente su circa 100 ha;
      dopo l'incendio del 1992 nella torbiera di Bažu, i tronchi bruciati vennero mantenuti sul terreno.
      Slītere è compreso nella rete Natura 2000 e nell'inventario lettone delle Important Bird Areas.
    before: >-
      La scarpata dei Zilie kalni, le forre boscate e le selve di pianura formano una riserva integrale con
      accessi regolamentati. Prima di partire verifica con l'ente gestore l'effettiva apertura dei singoli
      sentieri.
    around: >-
      Affinità costiere, foca grigia e alce legano l'area al [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) in Lituania e al [Vilsandi
      rahvuspark](/lugar/vilsandi-rahvuspark/) in Estonia; alce e lince europea accomunano il parco al
      [Lahemaa rahvuspark](/lugar/lahemaa-rahvuspark/).
  pt:
    intro: >-
      No cabo Kolka, o Báltico aberto e o golfo de Riga confluem com estrondo, e sobre esse ponto de encontro
      passa uma das grandes rotas migratórias de aves da Europa. Em dias de pico, dezenas de milhares de aves
      cruzam o cabo numa só hora. Para o interior estende-se uma floresta que os naturalistas apelidam de
      Floresta Tropical do Norte, um labirinto de dunas antigas separadas por depressões pantanosas e aldeias
      piscatórias livónias. É o Parque Nacional de Slītere, com 16.365 hectares no noroeste da Letónia,
      abrangendo as paróquias de Dundaga e Kolka.
    landscape: >-
      A evolução geológica pós-glaciar do mar Báltico lê-se aqui a pé. A antiga escarpa do lago glaciar
      báltico, erguendo-se entre trinta a cinquenta metros de altura, forma os Zilie kalni (Montes Azuis).
      Mais abaixo estende-se o complexo de kangari e vigas: cristas dunares seculares de quilómetros de
      extensão, os kangari, alternando com depressões estreitas e alagadas, as vigas. Junto às vigas da lagoa
      de Pēterezers, um passadiço de madeira permite percorrer esta ondulação constante.


      No sopé da antiga arriba, o bosque caducifólio da encosta, intocado por cortes florestais há quase um
      século, e as turfeiras basais geram um microclima húmido propício a uma impressionante diversidade de
      fauna e flora, justificando a designação de floresta pluvial. O parque reúne todos os tipos florestais
      da Letónia, metade das plantas vasculares e 60 % dos musgos do país. A floresta cobre cerca de 70 % da
      área do parque e as turfeiras 20 %, destacando-se a de Bažu.


      Em Kolka decorrem trabalhos de restauro de dunas cinzentas para proteger a anémona-dos-prados e o
      cravo-das-areias, espécies que dependem de clareiras ensolaradas.
    wildlife: >-
      A grande época de visitação coincide com a migração. O parque contabiliza mais de 260 espécies de aves,
      registando na primavera um fluxo massivo; em 2007 e 2008 foram identificadas 135 espécies nidificantes.
      A migração primaveril estende-se por várias semanas, possibilitando a observação em Kolkasrags de quase
      todas as aves da lista nacional letoniana. No outono, o areal serve de paragem à fuselo, ao passo que no
      inverno surge da Rússia o corujão-lapão.


      Na primavera de 2010, a turfeira de Bažu acolheu o maior cortejo nupcial de tetraz-grande da Europa, com
      66 machos em parada. No farol de Šlītere, uma exposição permanente documenta a rota migratória que cruza
      Kolka e dá a conhecer o pilrito-de-bico-largo.


      Em Slītere ocorrem o lobo, o [lince-euroasiático](/especie/lynx_lynx/) e o
      [alce](/especie/alces_alces/). No outono de 2006 um urso-pardo vagueou pelo parque após mais de 20 anos
      de ausência. No inverno, as [focas-cinzentas](/especie/halichoerus_grypus/) do Báltico reproduzem-se
      sobre o gelo marinho costeiro. Ocorrem sete espécies de anfíbios, entre as quais o tritão-de-crista e o
      sapo-corredor, enquanto a cobra-lisa-austríaca, em perigo crítico na Letónia, mantém aqui uma das suas
      duas populações nacionais. Nos rios desovam a lampreia-de-rio e a truta-marisca. Entre os invertebrados
      raros, o parque alberga metade dos escaravelhos, dois terços dos moluscos e um terço das borboletas da
      Letónia.
    visit: >-
      O parque dispõe de quatro percursos pedestres interpretativos e de diversas rotas cicláveis sinalizadas.
      Os pontos mais procurados são Kolkasrags, a orla costeira e o complexo do farol de Šlītere, que serve de
      miradouro e centro de educação ambiental. Como introdução, o circuito de Kolkasrags, fácil e com 3 km de
      extensão, percorre costa, praia e pinhais dunares, enquanto o trilho dos pinheiros de Kolkasrags, de 1,2
      km, cruza dunas brancas e cinzentas até ao mar. No outono e na primavera leva roupa quente e binóculos.


      O trilho de Ēvaži alcança uma arriba com 8 a 15 metros de altura sobre a praia. O areal é humedecido
      pela água proveniente da turfeira de Bažu, favorecendo a presença do sapo-corredor, anfíbio raro na
      Letónia. O trilho natural de Pēterezers percorre a alternância entre cristas dunares e depressões de
      turfeira.
    history: >-
      Os povos livónios habitaram esta orla marítima ao longo de séculos: as aldeias piscatórias históricas
      incluíam Sīkrags, Mazirbe, Košrags, Pitrags, Saunags, Vaide, Kolka e Uši; a cultura livónia permanece
      viva como parte integrante do património do norte da Europa. As pastagens históricas de Dāvids, Tamnīte
      e Zvejnieki mantêm os vestígios do maneio agropastoril tradicional.


      O núcleo começou por ser protegido como monumento natural; até 1999 foi reserva estatal de Slītere e em
      2000 foi elevado a parque nacional. Na reserva não se retiraram as árvores derrubadas pelas tempestades
      dos anos sessenta, permitindo uma regeneração florestal espontânea em cerca de 100 ha; após o incêndio
      de 1992 na turfeira de Bažu, as árvores calcinadas foram igualmente mantidas de pé. Slītere integra a
      rede Natura 2000 e o inventário letão de Important Bird Areas.
    before: >-
      A escarpa dos Zilie kalni, as suas ravinas florestadas e o bosque basal integram uma reserva integral
      com restrições de trânsito. Se pretenderes efetuar um trilho específico, confirma previamente com a
      entidade gestora se se encontra praticável.
    around: >-
      Com ambientes litorais, foca-cinzenta e alce em comum destacam-se o [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) na Lituânia e o [Vilsandi
      rahvuspark](/lugar/vilsandi-rahvuspark/) na Estónia; com alce e lince-euroasiático, o [Lahemaa
      rahvuspark](/lugar/lahemaa-rahvuspark/).
