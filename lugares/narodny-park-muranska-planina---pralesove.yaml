resumen:
  es: >-
    Meseta kárstica con abismos calizos, hayedos primarios y prados donde pastan caballos de montaña
    semisilvestres.
  en: >-
    Karst plateau with limestone chasms, primeval beech woods, and meadows grazed by semi-feral mountain
    horses.
  fr: >-
    Plateau karstique aux abîmes calcaires, hêtraies primaires et prairies où paissent des chevaux de montagne
    semi-sauvages.
  de: >-
    Karstplateau mit Kalksteinschluchten, Buchenurwäldern und Bergwiesen, auf denen halbwilde Gebirgspferde
    weiden.
  it: >-
    Altopiano carsico con baratri calcarei, faggete primarie e pascoli dove brucano cavalli di montagna
    semibradi.
  pt: >-
    Planalto cárstico com abismos calcários, fagetos primários e prados onde pastam cavalos de montanha
    semisselvagens.
unico:
  es: >-
    Es un bosque talado y quemado durante siglos que todavía guarda, en sus esquinas más difíciles, árboles
    con la edad que les toca y troncos muertos que alimentan a la siguiente generación.
  en: >-
    A forest logged and burned for centuries that still preserves, in its roughest corners, ancient trees of
    full age and dead logs nurturing the next generation.
  fr: >-
    Une forêt exploitée et brûlée durant des siècles qui conserve encore, dans ses recoins les plus rudes, des
    arbres séculaires et du bois mort nourrissant la génération suivante.
  de: >-
    Ein jahrhundertelang abgeholzter und abgebrannter Wald, der in seinen unwegsamsten Ecken noch uralte Bäume
    und Totholz bewahrt, das die nächste Generation nährt.
  it: >-
    Una foresta disboscata e bruciata per secoli che preserva tuttora, nei suoi angoli più dirupati, alberi
    vetusti e tronchi caduti che nutrono la generazione successiva.
  pt: >-
    Uma floresta explorada e queimada durante séculos que ainda preserva, nos seus recantos mais íngremes,
    árvores de idade venerável e troncos mortos que alimentam a geração seguinte.
observaciones:
  es: >-
    Para entrar en coche al parque hace falta un permiso, válido solo en el tramo Muráň–Veľká lúka, que se
    reserva por teléfono o correo y es de un solo día; debe ir colocado tras el parabrisas. Comprueba antes de
    ir el horario del centro de información de Muráň. Desde octubre de 2024 rige un nuevo reglamento de
    visitas, que designa áreas para recorrer a caballo y desplazarse en carruaje; consúltalo antes de
    organizar el viaje.
texto:
  es:
    intro: >-
      Durante siglos, aquí se quemó el bosque para hacer carbón y para dar pasto a los rebaños. Y aun así, en
      los rincones más inaccesibles de la meseta de Muránska planina quedan árboles que nadie cortó. El parque
      nacional protege, desde 1997, una plataforma de caliza y dolomía en el oeste de los montes Slovenské
      rudohorie, con un mosaico de hayedos, abetales y roquedos por donde se mueven el
      [lobo](/especie/canis_lupus/), el [oso pardo](/especie/ursus_arctos/) y el [lince](/especie/lynx_lynx/),
      y bajo cuyo suelo se han descubierto casi 500 cuevas y simas.
    landscape: >-
      La meseta tiene una historia de tres actos. En el Terciario el mar cubrió la zona y dejó sus sedimentos.
      Más tarde, un volcán de kilómetros de altura se alzó al noroeste de Tisovec. Y la erosión del agua, el
      viento y el hielo del Cuaternario acabó el trabajo y dejó una plataforma caliza de unos 160 km². Como la
      caliza se disuelve, la meseta está llena de lapiaces, torres y puertas de roca, más de 50 sumideros y
      surgencias y casi 500 cuevas y simas. El parque sube de los 400 m a los 1439 m de Fabová hoľa, su cumbre
      más alta.


      El bosque llegó por etapas. Tras la última glaciación el bosque se fue espesando, y hace unos cinco o
      seis mil años, con clima cálido y húmedo, entraron el haya y el abeto blanco. Hoy los hayedos son el
      bosque más extendido de la meseta: ocupan la base de las laderas del sur y, mezclados con otros árboles,
      suben hasta unos 1300 m. Los más bonitos están en el valle Hrdzavá, en el valle Martinova, en Šarkanica
      o bajo Šiance. El abeto rojo, en cambio, solo es natural en las cumbres de Fabová hoľa y Kľak; los
      abetales de cotas bajas son plantados.


      En los cortados del borde de la meseta se refugian los relictos de alerce y pino silvestre, y entre
      ellos vive la dafne de Muráň, la planta más rara del territorio: un endemismo y un relicto terciario que
      sobrevivió incluso a la glaciación. En lo alto de Tŕstie, además, hay turberas.
    wildlife: >-
      Lo que define a esta meseta son sus bosques viejos. Un bosque primario se reconoce por sus árboles muy
      gruesos, por la madera muerta en todas las fases de descomposición y por sus estructuras naturales.
      Quedan fragmentos: el mejor conservado, en el valle Javorníková; otros, en Stožky, Poludnica y el valle
      Hrdzavá.


      Esa madera muerta y esas cavidades sostienen la fauna. Los bosques son hogar del lobo, el oso pardo, el
      lince y el [gato montés](/especie/felis_silvestris/). En los arroyos de casi todos los valles con caudal
      vive la [nutria](/especie/lutra_lutra/), a la que a veces disputa el sitio la [cigüeña
      negra](/especie/ciconia_nigra/). En los bosques viejos y los cortados anidan el [águila
      real](/especie/aquila_chrysaetos/), el [halcón peregrino](/especie/falco_peregrinus/) y el [cárabo
      uralense](/especie/strix_uralensis/), y en los abetales de las cotas más altas vive el
      [urogallo](/especie/tetrao_urogallus/).


      Bajo tierra, otra fauna: de las 28 especies de murciélagos de Eslovaquia, 26 viven en la meseta, que
      ofrece cuevas no accesibles para hibernar. Entre los más frecuentes están el [murciélago grande de
      herradura](/especie/rhinolophus_ferrumequinum/) y el ratonero grande. Y entre los invertebrados, que
      superan las 2700 especies, hay endemismos como el escarabajo cavernícola Duvalius szaboi.


      El monte se renueva solo cuando se le deja. Tras el vendaval de 2004 se dejaron los abetales caídos sin
      intervenir: proliferó el escarabajo de la corteza y una nueva generación, con serbal de cazadores,
      sustituyó a los abetos viejos. La temporada para visitarlo va de mayo a octubre.
    visit: >-
      La puerta de entrada es Muráň. Allí está el centro de información, con una exposición permanente sobre
      la historia y la naturaleza del parque y animales expuestos. Desde el pueblo sale el sendero natural del
      castillo de Muráň: 6,5 km y 530 m de desnivel hasta la pradera Veľká lúka, con 14 paneles y 2 puntos de
      información sobre la naturaleza y el castillo.


      Hay más senderos naturales. El del valle del Hronec parte de Závadka nad Hronom, mide 13,5 km y llega
      bajo los macizos de Stožky. Desde Tisovec salen el de Hradová (unos 3,12 km, 475 m de desnivel, en
      serpentinas) y el de Tŕstie (6 km y 720 m). Y el circuito de Zbojská, de 4 km, empieza y acaba en la
      majada y atraviesa la garganta de Čertova dolina.


      En el collado de Burda hay un puesto de campo sin electricidad ni agua corriente. La acampada solo se
      permite en tres sitios habilitados; uno está en el extremo suroeste de Veľká lúka. En el centro de la
      meseta, en Nižná Kľaková, hay un refugio gratuito, abierto todo el año y sin reserva: llega quien llega
      primero.
    history: >-
      Los pastores valacos talaron y quemaron bosque para ganar pastos para sus rebaños, y la minería del
      hierro hizo el resto, con carbón vegetal que se quemaba en el propio monte, en plataformas excavadas en
      la ladera. El territorio se protegió como parque nacional en 1997. Parte de los bosques se deja hoy sin
      intervención, solo a merced de los procesos naturales, para proteger a las especies del bosque natural.
    before: >-
      Para entrar en coche al parque hace falta un permiso, válido solo en el tramo Muráň–Veľká lúka, que se
      reserva por teléfono o correo y es de un solo día; debe ir colocado tras el parabrisas. Comprueba antes
      de ir el horario del centro de información de Muráň. Desde octubre de 2024 rige un nuevo reglamento de
      visitas, que designa áreas para recorrer a caballo y desplazarse en carruaje; consúltalo antes de
      organizar el viaje.
    around: >-
      A 9 km queda el [Parque Nacional Slovenský raj](/lugar/narodny-park-slovensky-raj/). A 14 km está el
      [Bosque Primario de Dobročský Prales](/lugar/dobrocsky-prales-primeval-forest/), y algo más lejos, hacia
      los Tatras, el [Tatranský národný park](/lugar/tatransky-narodny-park/).
  en:
    intro: >-
      For centuries, the forest here was burned to produce charcoal and create pasture for livestock. Yet in
      the most inaccessible nooks of the Muránska planina plateau, uncut trees remain. Since 1997, the
      national park has protected a limestone and dolomite plateau in the western Slovenské rudohorie
      mountains, hosting a mosaic of beech woods, fir groves, and rocky bluffs roamed by the [grey
      wolf](/especie/canis_lupus/), the [brown bear](/especie/ursus_arctos/), and the [Eurasian
      lynx](/especie/lynx_lynx/), under whose soil nearly 500 caves and chasms have been discovered.
    landscape: >-
      The plateau has a three-act history. In the Tertiary, the sea submerged the area and left its sediment.
      Later, a volcano kilometres high rose northwest of Tisovec. Finally, erosion by water, wind, and
      Quaternary ice finished the work, leaving a limestone platform of some 160 km². Because limestone
      dissolves, the plateau is riddled with karren, towers, and rock gates, over 50 sinkholes and
      resurgences, and nearly 500 caves and chasms. The park climbs from 400 m to 1439 m at Fabová hoľa, its
      highest summit.


      The forest arrived in stages. After the last ice age the woods thickened, and some five to six thousand
      years ago, during a warm, damp climate, beech and silver fir took hold. Today beech forests are the
      plateau's most extensive woodland: they carpet the lower southern slopes and, mixed with other trees,
      reach up to about 1300 m. The finest stands grow in the Hrdzavá valley, Martinova valley, Šarkanica, and
      below Šiance. Norway spruce, by contrast, is native only on the crests of Fabová hoľa and Kľak;
      lower-elevation spruce stands were planted.


      Cliffs along the edge of the plateau shelter relict stands of larch and Scots pine, among which lives
      the Muráň daphne, the territory's rarest plant: an endemic tertiary relict that survived even
      glaciation. In addition, peat bogs thrive atop Tŕstie.
    wildlife: >-
      What defines this plateau is its ancient woodland. A primeval forest reveals itself through massive
      trees, deadwood in every phase of decay, and intricate natural architecture. Intact remnants persist:
      the best preserved in the Javorníková valley, and others at Stožky, Poludnica, and the Hrdzavá valley.


      This deadwood and these tree cavities support wildlife. The woods are home to the wolf, the brown bear,
      the lynx, and the [European wildcat](/especie/felis_silvestris/). In the running streams of nearly every
      valley lives the [Eurasian otter](/especie/lutra_lutra/), which at times contends for territory with the
      [black stork](/especie/ciconia_nigra/). Old forests and rocky crags shelter nesting [golden
      eagles](/especie/aquila_chrysaetos/), [peregrine falcons](/especie/falco_peregrinus/), and [Ural
      owls](/especie/strix_uralensis/), while [western capercaillies](/especie/tetrao_urogallus/) live in
      high-altitude fir woods.


      Underground, another fauna thrives: of Slovakia's 28 bat species, 26 inhabit the plateau, finding
      inaccessible caves for winter hibernation. Among the most frequent are the [greater horseshoe
      bat](/especie/rhinolophus_ferrumequinum/) and the greater mouse-eared bat. Invertebrates surpass 2700
      species, including endemics such as the cave beetle Duvalius szaboi.


      The forest regenerates on its own when left alone. After the windstorm of 2004, fallen fir stands were
      left untouched: bark beetles flourished, and a new generation featuring rowan replaced the ancient firs.
      The visiting season runs from May to October.
    visit: >-
      The gateway town is Muráň. The information centre is located there, offering a permanent exhibition on
      park history and wildlife with mounted animal specimens. From the village, the Muráň Castle nature trail
      departs: 6.5 km and 530 m of elevation gain to the Veľká lúka meadow, featuring 14 panels and 2
      information points about nature and the castle.


      Other nature trails branch out across the park. The Hronec valley trail leaves from Závadka nad Hronom,
      spans 13.5 km, and ends beneath the Stožky massifs. From Tisovec depart the Hradová trail (about 3.12
      km, 475 m of climb, in serpentines) and the Tŕstie trail (6 km and 720 m). The Zbojská loop, covering 4
      km, starts and finishes at the mountain farmstead and negotiates the Čertova dolina gorge.


      At Burda pass there is a field outpost without electricity or running water. Camping is permitted only
      at three designated spots; one lies at the southwestern end of Veľká lúka. In the centre of the plateau,
      at Nižná Kľaková, stands a free shelter, open year-round with no reservations: first come, first served.
    history: >-
      Vlach shepherds felled and burned woodland to clear pasture for their flocks, and iron mining completed
      the transformation using charcoal produced right on the mountain slopes in hearths carved into
      hillsides. The territory gained protection as a national park in 1997. Portions of the forests are now
      left completely without intervention, subject only to natural processes, to safeguard natural woodland
      species.
    before: >-
      Driving into the park requires a permit, valid only along the Muráň–Veľká lúka stretch, bookable by
      phone or email for a single day; it must be displayed behind the windscreen. Check opening hours of the
      Muráň visitor centre before travelling. Since October 2024, a new visitor regulation has been in effect,
      specifying areas for horse riding and horse-drawn carriages; review it before planning your trip.
    around: >-
      9 km away lies [Slovenský Raj National Park](/lugar/narodny-park-slovensky-raj/). At 14 km stands
      [Dobročský Prales Primeval Forest](/lugar/dobrocsky-prales-primeval-forest/), and somewhat further
      toward the Tatras, [Tatranský národný park](/lugar/tatransky-narodny-park/).
  fr:
    intro: >-
      Pendant des siècles, la forêt fut ici brûlée pour produire du charbon de bois et offrir des pâturages
      aux troupeaux. Pourtant, dans les recoins les plus inaccessibles du plateau de Muránska planina,
      subsistent des arbres que nul n'a abattus. Le parc national protège depuis 1997 une table calcaire et
      dolomitique dans l'ouest des monts Slovenské rudohorie, où s'entremêlent hêtraies, sapinières et
      escarpements rocheux parcourus par le [loup](/especie/canis_lupus/), l'[ours
      brun](/especie/ursus_arctos/) et le [lynx boréal](/especie/lynx_lynx/), et sous le sol de laquelle près
      de 500 grottes et gouffres ont été explorés.
    landscape: >-
      Le plateau s'est façonné en trois actes. Au Tertiaire, la mer recouvrit la région et y déposa ses
      sédiments. Plus tard, un volcan haut de plusieurs kilomètres s'éleva au nord-ouest de Tisovec. Puis
      l'érosion par l'eau, le vent et les glaces quaternaires acheva l'ouvrage, laissant une plate-forme
      calcaire d'environ 160 km². Le calcaire se dissolvant, le plateau fourmille de lapiés, de tours et
      d'arches rocheuses, de plus de 50 pertes et résurgences et de près de 500 grottes et gouffres. Le parc
      s'élève de 400 m jusqu'aux 1439 m de Fabová hoľa, son point culminant.


      La forêt s'y est installée par étapes. Après la dernière glaciation, le couvert boisé s'est épaissi et,
      il y a cinq à six mille ans, sous un climat chaud et humide, le hêtre et le sapin pectiné s'y sont
      enracinés. Les hêtraies forment aujourd'hui le boisement le plus étendu du plateau : elles occupent la
      base des versants sud et, mêlées à d'autres essences, grimpent jusqu'à environ 1300 m. Les plus
      remarquables se trouvent dans les vallées Hrdzavá et Martinova, à Šarkanica ou sous Šiance. L'épicéa
      commun n'est en revanche indigène que sur les crêtes de Fabová hoľa et Kľak ; les pessières d'altitude
      modeste résultent de plantations.


      Sur les escarpements bordant le plateau se réfugient des reliques de mélèze et de pin sylvestre, parmi
      lesquelles s'épanouit le daphné de Muráň, la plante la plus rare des lieux : un endémisme et une relique
      tertiaire ayant survécu aux glaciations. Sur les hauteurs de Tŕstie s'étendent en outre des tourbières.
    wildlife: >-
      Ce qui caractérise ce plateau, ce sont ses forêts anciennes. Une forêt primaire se reconnaît à ses fûts
      imposants, à son bois mort à tous les stades de décomposition et à ses structures étagées. Quelques
      fragments subsistent : le mieux préservé dans la vallée Javorníková, d'autres à Stožky, Poludnica et
      dans la vallée Hrdzavá.


      Ce bois mort et ces cavités nourrissent la faune. Les forêts hébergent le loup, l'ours brun, le lynx et
      le [chat sauvage](/especie/felis_silvestris/). Dans les ruisseaux de presque toutes les vallées vives
      vit la [loutre d'Europe](/especie/lutra_lutra/), que dispute parfois la [cigogne
      noire](/especie/ciconia_nigra/). Les vieux bois et les falaises abritent la nidification de l'[aigle
      royal](/especie/aquila_chrysaetos/), du [faucon pèlerin](/especie/falco_peregrinus/) et de la [chouette
      de l'Oural](/especie/strix_uralensis/), tandis que le [grand tétras](/especie/tetrao_urogallus/)
      fréquente les pessières sommitales.


      Sous terre, un autre univers s'anime : sur les 28 espèces de chauves-souris de Slovaquie, 26 vivent sur
      le plateau, profitant de grottes calmes pour hiberner. Les plus communes comprennent le [grand
      rhinolophe fer à cheval](/especie/rhinolophus_ferrumequinum/) et le grand murin. Parmi les invertébrés,
      qui dépassent 2700 espèces, figurent des endémiques cavernicoles comme le coléoptère Duvalius szaboi.


      La forêt se régénère d'elle-même quand on la laisse faire. Après la tempête de 2004, les chablis de
      sapins furent laissés intacts : le scolyte a proliféré et une nouvelle génération, enrichie en sorbiers
      des oiseleurs, a succédé aux vieux arbres. La saison de visite s'étend de mai à octobre.
    visit: >-
      Le point d'accès privilégié est Muráň. On y trouve le centre d'information, avec une exposition
      permanente sur l'histoire et la nature du parc ainsi que des animaux naturalisés. Du village part le
      sentier naturel du château de Muráň : 6,5 km et 530 m de dénivelé jusqu'au pré de Veľká lúka, jalonnés
      de 14 panneaux et 2 points d'information sur la nature et la forteresse.


      D'autres sentiers jalonnent le massif. Celui de la vallée du Hronec part de Závadka nad Hronom, fait
      13,5 km et gagne le pied des massifs de Stožky. Depuis Tisovec partent le sentier de Hradová (environ
      3,12 km, 475 m de montée en lacets) et celui de Tŕstie (6 km et 720 m). La boucle de Zbojská, longue de
      4 km, part du hameau pastoral pour traverser la gorge de Čertova dolina.


      Au col de Burda se trouve un gîte de terrain sans électricité ni eau courante. Le bivouac n'est permis
      que sur trois emplacements aménagés, dont l'un à l'extrémité sud-ouest de Veľká lúka. Au cœur du
      plateau, à Nižná Kľaková, un refuge libre est ouvert toute l'année sans réservation : premier arrivé,
      premier servi.
    history: >-
      Les bergers valaques ont abattu et incendié la forêt pour créer des pacages pour leurs troupeaux, et les
      forges de fer firent le reste avec le charbon de bois produit à même la montagne sur des plateformes
      terrassées. Le secteur a été protégé en parc national en 1997. Une fraction des forêts est aujourd'hui
      laissée en libre évolution pour préserver les espèces caractéristiques du milieu forestier naturel.
    before: >-
      L'accès en voiture dans le parc requiert un permis, valable uniquement sur le tronçon Muráň–Veľká lúka,
      réservable par téléphone ou courriel pour une seule journée et à placer derrière le pare-brise.
      Renseignez-vous sur les horaires du centre d'accueil de Muráň avant de venir. Depuis octobre 2024
      s'applique un nouveau règlement des visites fixant les secteurs accessibles aux cavaliers et calèches ;
      consultez-le avant d'organiser votre excursion.
    around: >-
      À 9 km s'étend le [parc national du Paradis slovaque](/lugar/narodny-park-slovensky-raj/). À 14 km se
      trouve la [forêt primaire de Dobročský Prales](/lugar/dobrocsky-prales-primeval-forest/), et plus loin
      vers les Tatras, le [Tatranský národný park](/lugar/tatransky-narodny-park/).
  de:
    intro: >-
      Jahrhundertelang wurde der Wald hier gerodet und verbrannt, um Holzkohle zu gewinnen und Weideland für
      Herden zu schaffen. Dennoch blieben in den unzugänglichsten Winkeln der Hochebene Muránska planina Bäume
      stehen, die nie eine Axt berührte. Der Nationalpark schützt seit 1997 ein Kalk- und Dolomitplateau im
      Westen des Slowakischen Erzgebirges mit einem Mosaik aus Buchenwäldern, Tannenbeständen und Felswänden,
      durch die [Wolf](/especie/canis_lupus/), [Braunbär](/especie/ursus_arctos/) und [Eurasischer
      Luchs](/especie/lynx_lynx/) streifen, und unter dessen Boden fast 500 Höhlen und Schlünde entdeckt
      wurden.
    landscape: >-
      Die Entstehung der Hochebene gliedert sich in drei Akte. Im Tertiär bedeckte das Meer das Areal und
      lagerte Sedimente ab. Später erhob sich nordwestlich von Tisovec ein kilometerhoher Vulkan. Die
      Abtragung durch Wasser, Wind und quartäres Eis vollendete das Werk und hinterließ ein Kalkplateau von
      rund 160 km². Da sich Kalkstein löst, ist das Plateau reich an Karren, Felstürmen und Felstoren, über 50
      Dolinen und Karstquellen sowie fast 500 Höhlen und Klüften. Der Park steigt von 400 m bis auf 1439 m an
      der Fabová hoľa an, seiner höchsten Erhebung.


      Der Wald siedelte sich schrittweise an. Nach der letzten Eiszeit verdichtete sich der Bewuchs, und vor
      etwa fünf- bis sechstausend Jahren wanderten bei feucht-warmem Klima Rotbuche und Weiß-Tanne ein. Heute
      bilden Buchenwälder den ausgedehntesten Waldtyp der Hochfläche: Sie bedecken die unteren Südhänge und
      steigen, mit anderen Baumarten gemischt, bis auf rund 1300 m empor. Die schönsten Bestände wachsen im
      Hrdzavá-Tal, im Martinova-Tal, bei Šarkanica oder unterhalb von Šiance. Die Gemeine Fichte ist hingegen
      nur auf den Kämmen von Fabová hoľa und Kľak heimisch; tiefer gelegene Fichtenforste wurden angepflanzt.


      An den Abbruchkanten des Plateaus halten sich Relikte von Lärche und Wald-Kiefer, unter denen der
      Muráň-Seidelbast gedeiht – die seltenste Pflanze des Gebiets: ein Endemit und tertiäres Relikt, das
      selbst die Vergletscherung überdauerte. Auf den Höhen von Tŕstie liegen zudem Moorflächen.
    wildlife: >-
      Das Markenzeichen dieses Plateaus sind seine alten Wälder. Ein Urwald zeigt sich an mächtigen Stämmen,
      Totholz in sämtlichen Zersetzungsstadien und vielschichtigen Naturstrukturen. Unberührte Reste haben
      überdauert: am besten erhalten im Javorníková-Tal, weitere bei Stožky, Poludnica und im Hrdzavá-Tal.


      Dieses Totholz und die Baumhöhlen bieten zahllosen Tieren Lebensraum. Die Wälder beherbergen Wolf,
      Braunbär, Luchs und die [Wildkatze](/especie/felis_silvestris/). An den Bergbächen fast aller
      wasserführenden Täler lebt der [Eurasische Fischotter](/especie/lutra_lutra/), dem gelegentlich der
      [Schwarzstorch](/especie/ciconia_nigra/) das Revier streitig macht. In Altwäldern und Felsabstürzen
      nisten [Steinadler](/especie/aquila_chrysaetos/), [Wanderfalke](/especie/falco_peregrinus/) und
      [Habichtskauz](/especie/strix_uralensis/), während in hochgelegenen Nadelwäldern das
      [Auerhuhn](/especie/tetrao_urogallus/) haust.


      Unter Tage verbirgt sich eine weitere Tierwelt: Von den 28 Fledermausarten der Slowakei leben 26 auf dem
      Plateau und nutzen ungestörte Höhlen zur Überwinterung. Zu den häufigsten zählen die [Große
      Hufeisennase](/especie/rhinolophus_ferrumequinum/) und das Große Mausohr. Unter den mehr als 2700
      Wirbellosen finden sich Endemiten wie der Höhlenlaufkäfer Duvalius szaboi.


      Der Bergwald verjüngt sich selbst, wenn man ihn gewähren lässt. Nach dem Windwurf von 2004 ließ man
      umgestürzte Tannen unberührt: Borkenkäfer vermehrten sich, und eine neue Waldgeneration mit Vogelbeere
      trat an die Stelle der alten Bäume. Die Besuchersaison dauert von Mai bis Oktober.
    visit: >-
      Das Eingangstor ist Muráň. Dort liegt das Informationszentrum mit einer Dauerausstellung zur Natur- und
      Kulturgeschichte des Parks samt Präparaten. Vom Ort führt der Naturlehrpfad der Burg Muráň los: 6,5 km
      und 530 Höhenmeter hinauf zur Wiese Veľká lúka, begleitet von 14 Infotafeln und 2 Stationen zu Natur und
      Festung.


      Weitere Lehrpfade erschließen die Landschaft. Jener im Hronec-Tal beginnt in Závadka nad Hronom, misst
      13,5 km und führt unter die Felsmassive von Stožky. Von Tisovec starten die Pfade Hradová (rund 3,12 km,
      475 Höhenmeter in Serpentinen) und Tŕstie (6 km und 720 m). Der 4 km lange Rundweg von Zbojská beginnt
      und endet an der Sennerei und quert die Čertova-dolina-Schlucht.


      Am Burda-Sattel gibt es eine Feldstation ohne Strom oder fließendes Wasser. Zelten ist nur an drei
      ausgewiesenen Plätzen erlaubt, darunter am südwestlichen Ende der Veľká lúka. Im Zentrum des Plateaus,
      bei Nižná Kľaková, steht eine kostenlose Schutzhütte, die ganzjährig ohne Reservierung offensteht: Wer
      zuerst kommt, mahlt zuerst.
    history: >-
      Walachische Hirten rodeten und verbrannten Waldstücke, um Futterflächen für ihr Vieh zu gewinnen; den
      Rest bewirkte der Eisenbergbau mit Holzkohlemeilern, die direkt an Hangkanten in den Fels gehauen
      wurden. Das Areal wurde 1997 als Nationalpark ausgewiesen. Teile der Wälder bleiben heute ohne jeden
      Eingriff den Naturprozessen überlassen, um die Lebensgemeinschaften des Naturwaldes zu bewahren.
    before: >-
      Für die Einfahrt mit dem Pkw ist eine Genehmigung erforderlich, die ausschließlich für die Strecke
      Muráň–Veľká lúka gilt, telefonisch oder per Mail für einen einzelnen Tag gebucht werden kann und hinter
      der Windschutzscheibe liegen muss. Prüfe vor der Anreise die Öffnungszeiten des Infobüros in Muráň. Seit
      Oktober 2024 gilt eine neue Besucherordnung, die Areale für Reitsport und Pferdekutschen festlegt;
      informiere dich vorab bei der Tourenplanung.
    around: >-
      In 9 km Entfernung liegt der [Nationalpark Slowakisches Paradies](/lugar/narodny-park-slovensky-raj/).
      14 km entfernt befindet sich der [Urwald Dobročský Prales](/lugar/dobrocsky-prales-primeval-forest/),
      und etwas weiter taleinwärts zu den Bergen der [Tatranský národný park](/lugar/tatransky-narodny-park/).
  it:
    intro: >-
      Per secoli, qui la foresta fu incendiata per ricavare carbone di legna e garantire pascoli alle mandrie.
      Eppure, negli anfratti più inaccessibili dell'altopiano di Muránska planina sopravvivono alberi mai
      abbattuti. Dal 1997 il parco nazionale tutela una piattaforma di calcare e dolomia nei monti occidentali
      dello Slovenské rudohorie, con un mosaico di faggete, abetine e rupi dove si aggirano il [lupo
      grigio](/especie/canis_lupus/), l'[orso bruno](/especie/ursus_arctos/) e la
      [lince](/especie/lynx_lynx/), e sotto il cui suolo sono state scoperte quasi 500 grotte e voragini.
    landscape: >-
      La genesi dell'altopiano si articola in tre atti. Nel Terziario il mare coprì l'area depositando i
      propri sedimenti. In seguito, un vulcano alto chilometri emerse a nord-ovest di Tisovec. L'erosione
      dell'acqua, del vento e dei ghiacci quaternari concluse l'opera, lasciando una placca calcarea di circa
      160 km². Poiché il calcare si dissolve, l'altopiano è cosparso di campi carreggiati, torrioni e archi
      naturali, oltre 50 inghiottitoi e risorgenze e quasi 500 cavità ipogee. Il parco sale dai 400 m ai 1439
      m di Fabová hoľa, la cima più elevata.


      La copertura arborea giunse per gradi. Dopo l'ultima glaciazione il bosco andò infittendosi, e circa
      cinque o seimila anni fa, in un clima mite e umido, fecero il loro ingresso il faggio e l'abete bianco.
      Oggi le faggete costituiscono la formazione più diffusa dell'altopiano: rivestono la base dei versanti
      meridionali e, consorziate con altri alberi, salgono fino a circa 1300 m. Le più integre allignano nella
      valle Hrdzavá, nella valle Martinova, a Šarkanica o sotto Šiance. L'abete rosso è invece autoctono
      unicamente sulle creste di Fabová hoľa e Kľak; le formazioni di abete a quote inferiori derivano da
      rimboschimenti.


      Sulle pareti a strapiombo dell'orlo dell'altopiano trovano rifugio relitti di larice e pino silvestre,
      tra cui alligna la dafne di Muráň, la pianta più rara del territorio: un endemismo e relitto terziario
      sopravvissuto perfino alle ere glaciali. Sulle sommità di Tŕstie si sviluppano inoltre torbiere.
    wildlife: >-
      La peculiarità di questo altopiano risiede nelle sue foreste vetuste. Un bosco primario si riconosce dai
      fusti ciclopici, dal legno morto presente in ogni stadio di degradazione e dalle stratificazioni
      naturali. Ne restano ampie parcelle: la meglio conservata nella valle Javorníková, altre a Stožky,
      Poludnica e nella valle Hrdzavá.


      Quel legno morto e quelle cavità sostengono la fauna. I boschi danno ricetto al lupo, all'orso bruno,
      alla lince e al [gatto selvatico](/especie/felis_silvestris/). Nei torrenti di quasi ogni valle a corso
      perenne risiede la [lontra europea](/especie/lutra_lutra/), che talora compete per gli spazi con la
      [cicogna nera](/especie/ciconia_nigra/). Nelle vecchie selve e sulle cenge nidificano l'[aquila
      reale](/especie/aquila_chrysaetos/), il [falco pellegrino](/especie/falco_peregrinus/) e l'[allocco
      degli Urali](/especie/strix_uralensis/), mentre nelle abetine di vetta vive
      l'[urogallo](/especie/tetrao_urogallus/).


      Nel sottosuolo pullula un'altra fauna: delle 28 specie di chirotteri presenti in Slovacchia, 26 vivono
      sull'altopiano sfruttando cavità indisturbate per svernare. Tra i più frequenti spiccano il [ferro di
      cavallo maggiore](/especie/rhinolophus_ferrumequinum/) e il vespertilio maggiore. Tra gli oltre 2700
      invertebrati compaiono endemismi come il coleottero cavernicolo Duvalius szaboi.


      La foresta si rinnova da sola quando non viene disturbata. Dopo la tempesta di vento del 2004 le abetine
      schiantate furono lasciate sul posto: il bostrico proliferò e una nuova generazione, ricca di sorbi
      degli uccellatori, subentrò ai vecchi abeti. La stagione di visita va da maggio a ottobre.
    visit: >-
      La via d'accesso principale è Muráň. Qui si trova il centro visite, con un'esposizione didattica su
      storia e natura del comprensorio e animali tassidermizzati. Dal paese si dipana il sentiero
      naturalistico del castello di Muráň: 6,5 km e 530 m di dislivello fino al pianoro di Veľká lúka,
      arricchito da 14 bacheche e 2 punti informativi su flora, fauna e fortezza.


      Si sviluppano altri itinerari naturalistici. Quello della valle dell'Hronec parte da Závadka nad Hronom,
      copre 13,5 km e raggiunge i bastioni di Stožky. Da Tisovec prendono avvio i sentieri di Hradová (circa
      3,12 km, 475 m di dislivello a tornanti) e di Tŕstie (6 km e 720 m). L'anello di Zbojská, di 4 km,
      inizia e finisce alla malga solcando la gola di Čertova dolina.


      Al valico di Burda sorge un presidio alpino sprovvisto di corrente e acqua corrente. Il campeggio è
      autorizzato solo in tre piazzole adibite, di cui una all'estremità sud-occidentale di Veľká lúka. Nel
      cuore dell'altopiano, a Nižná Kľaková, è a disposizione un bivacco gratuito aperto tutto l'anno senza
      prenotazione: chi prima arriva, alloggia.
    history: >-
      I pastori valacchi tagliarono e bruciarono boschi per ricavare pascoli per gli armenti, e le miniere di
      ferro fecero il resto impiegando carbone vegetale ricavato direttamente in quota su terrazze scavate nei
      pendii. L'area è stata protetta come parco nazionale nel 1997. Porzioni di foresta sono oggi escluse da
      qualsiasi intervento antropico, lasciate ai soli ritmi naturali per tutelare la biodiversità forestale.
    before: >-
      Per entrare in automobile nel parco occorre un permesso, valido soltanto lungo la tratta Muráň–Veľká
      lúka, richiedibile per telefono o posta elettronica per un unico giorno ed esponibile sul cruscotto.
      Controlla prima della partenza gli orari del punto informativo di Muráň. Da ottobre 2024 è operativo un
      nuovo regolamento escursionistico che disciplina le aree consentite a cavallo e carrozze; consultalo
      prima di pianificare l'itinerario.
    around: >-
      A 9 km sorge il [Parco Nazionale del Paradiso Slovacco](/lugar/narodny-park-slovensky-raj/). A 14 km si
      trova la [Foresta Primaria di Dobročský Prales](/lugar/dobrocsky-prales-primeval-forest/), e poco più
      lontano verso le cime, il [Tatranský národný park](/lugar/tatransky-narodny-park/).
  pt:
    intro: >-
      Durante séculos, a floresta ardeu aqui para produzir carvão e abrir pastos para os rebanhos. Mesmo
      assim, nos recantos mais inacessíveis do planalto de Muránska planina restam árvores que ninguém abateu.
      O parque nacional protege desde 1997 uma plataforma de calcário e dolomito no setor ocidental dos montes
      Slovenské rudohorie, com um mosaico de fagetos, abetais e escarpas rochosas onde vagueiam o
      [lobo-cinzento](/especie/canis_lupus/), o [urso-pardo](/especie/ursus_arctos/) e o
      [lince-euroasiático](/especie/lynx_lynx/), sob cujo solo foram já descobertas quase 500 grutas e
      algares.
    landscape: >-
      A história do planalto desdobra-se em três atos. No Terciário o mar submergiu a região e depositou os
      seus sedimentos. Mais tarde, ergueu-se a noroeste de Tisovec um vulcão com quilómetros de altitude. Por
      fim, a erosão fluvial, eólica e os glaciares quaternários completaram a obra, deixando uma plataforma
      calcária com cerca de 160 km². Como o calcário se dissolve, o planalto está repleto de lapiás, torres e
      arcos rochosos, mais de 50 sumidouros e ressurgências e quase 500 grutas e abismos. O parque ascende dos
      400 m aos 1439 m em Fabová hoľa, o seu ponto mais alto.


      A floresta instalou-se por etapas. Após a última glaciação a vegetação adensou-se e, há cerca de cinco a
      seis mil anos, sob clima ameno e húmido, estabeleceram-se a faia e o abeto-branco. Hoje os fagetos
      formam a floresta mais vasta do planalto: revestem a base das encostas a sul e, associados a outras
      espécies, sobem até cerca de 1300 m. Os talhões mais pujantes encontram-se nos vales Hrdzavá e
      Martinova, em Šarkanica ou sob Šiance. Já o abeto-falso só é autóctone nas cumeadas de Fabová hoľa e
      Kľak; os povoamentos em cotas inferiores foram plantados.


      Nas escarpas do rebordo do planalto abrigam-se relíquias de lariço e pinheiro-silvestre, entre as quais
      sobrevive o dáfne-de-muráň, a planta mais rara da região: um endemismo e relíquia terciária que resistiu
      até às glaciações. No cimo de Tŕstie existem ainda turfeiras.
    wildlife: >-
      O que singulariza este planalto são as suas matas vetustas. Uma floresta virgem evidencia-se por árvores
      de porte maciço, madeira morta em todos os estádios de decomposição e estratificação natural. Sobrevivem
      testemunhos expressivos: o melhor conservado no vale Javorníková, e outros em Stožky, Poludnica e no
      vale Hrdzavá.


      Essa madeira morta e as cavidades arbóreas sustentam a vida selvagem. Os bosques abrigam o lobo, o
      urso-pardo, o lince e o [gato-bravo](/especie/felis_silvestris/). Nos ribeiros de quase todos os vales
      com caudal permanente vive a [lontra-europeia](/especie/lutra_lutra/), que por vezes disputa o habitat
      com a [cegonha-preta](/especie/ciconia_nigra/). Nas matas maduras e nas falésias nidificam a
      [águia-real](/especie/aquila_chrysaetos/), o [falcão-peregrino](/especie/falco_peregrinus/) e a
      [coruja-dos-urais](/especie/strix_uralensis/), enquanto nos abetais das altitudes cimeiras habita o
      [tetraz-grande](/especie/tetrao_urogallus/).


      No subsolo fervilha outra fauna: das 28 espécies de morcegos da Eslováquia, 26 residem no planalto,
      tirando partido de grutas tranquilas para hibernar. Entre os mais habituais encontram-se o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/) e o morcego-rato-grande. Entre os
      invertebrados, que ultrapassam as 2700 espécies, registam-se endemismos cavernícolas como o escaravelho
      Duvalius szaboi.


      A floresta regenera-se por si só quando não perturbada. Após o vendaval de 2004 os abetos caídos foram
      mantidos no terreno sem intervenção: o escaravelho-da-casca proliferou e uma nova geração arbórea,
      povoada por tramazeiras, substituiu as árvores antigas. A temporada de visita vai de maio a outubro.
    visit: >-
      O ponto de entrada por excelência é Muráň. Aí se situa o centro de informação, dispondo de uma exposição
      permanente sobre a história e a natureza do parque com espécimes empalhados. Da povoação parte o
      percurso pedestre do castelo de Muráň: 6,5 km e 530 m de desnível até ao prado de Veľká lúka, integrando
      14 painéis e 2 pontos informativos sobre a natureza e a fortificação.


      Existem outros percursos interpretativos. O do vale do Hronec tem início em Závadka nad Hronom, soma
      13,5 km e alcança a base dos maciços de Stožky. A partir de Tisovec iniciam-se os trilhos de Hradová
      (cerca de 3,12 km, 475 m de desnível por curvas sucessivas) e de Tŕstie (6 km e 720 m). O circuito de
      Zbojská, com 4 km, começa e termina junto ao curral tradicional atravessando o desfiladeiro de Čertova
      dolina.


      No colo de Burda existe um abrigo de campo sem eletricidade nem água canalizada. Só é permitido acampar
      em três locais autorizados, um dos quais situado no extremo sudoeste de Veľká lúka. No centro do
      planalto, em Nižná Kľaková, existe um refúgio gratuito aberto o ano inteiro sem reserva: vigora a ordem
      de chegada.
    history: >-
      Os pastores valacos cortaram e queimaram arvoredo para criar pastagens para o gado, e a mineração de
      ferro encarregou-se do resto recorrendo a carvão vegetal produzido na própria encosta, em plataformas
      talhadas na vertente. A área obteve proteção como parque nacional em 1997. Parcelas da floresta são hoje
      mantidas sem qualquer intervenção humana, confiadas exclusivamente à dinâmica natural para salvaguardar
      a fauna e flora do bosque virgem.
    before: >-
      A circulação de automóvel no parque requer uma autorização, válida exclusivamente no troço Muráň–Veľká
      lúka, reservável por telefone ou correio eletrónico para um único dia e afixável atrás do para-brisas.
      Informa-te sobre o horário do posto de informação de Muráň antes de viajar. Desde outubro de 2024 vigora
      um novo regulamento de visitas que estabelece as áreas abertas a passeios a cavalo e charretes;
      consulta-o antes de preparar o itinerário.
    around: >-
      A 9 km situa-se o [Parque Nacional do Paraíso Eslovaco](/lugar/narodny-park-slovensky-raj/). A 14 km
      fica a [Floresta Primária de Dobročský Prales](/lugar/dobrocsky-prales-primeval-forest/), e ligeiramente
      mais distante, rumo aos Tatras, o [Tatranský národný park](/lugar/tatransky-narodny-park/).
