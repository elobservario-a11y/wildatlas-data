resumen:
  es: >-
    El mayor complejo de turberas ombrotróficas al sur de Laponia (100 km² de marismas y lagunas con pasarelas
    de madera).
  en: >-
    The largest ombrotrophic bog complex south of Lapland (100 km² of mires and tarns traversed by wooden
    boardwalks).
  fr: >-
    Le plus grand complexe de tourbières ombrotrophes au sud de la Laponie (100 km² de tourbières et de
    lagunes aménagées de passerelles en bois).
  de: >-
    Der größte ombrotrophe Moorkomplex südlich von Lappland (100 km² Feuchtgebiete und Moorseen mit
    Holzbohlenwegen).
  it: >-
    Il più grande complesso di torbiere ombrotrofiche a sud della Lapponia (100 km² di paludi e acquitrini
    attrezzati con passerelle in legno).
  pt: >-
    O maior complexo de turfeiras ombrotróficas a sul da Lapónia (100 km² de pauis e lagoas com passadiços de
    madeira).
unico:
  es: Casi la mitad de las unas sesenta especies suecas de libélulas vive en esta turbera.
  en: Nearly half of Sweden's roughly sixty dragonfly species thrive across this vast mire system.
  fr: Près de la moitié de la soixantaine d'espèces de libellules de Suède vit dans cette vaste tourbière.
  de: Fast die Hälfte der rund sechzig schwedischen Libellenarten lebt in diesem riesigen Hochmoor.
  it: Quasi la metà della sessantina di specie svedesi di libellule vive in questa sterminata torbiera.
  pt: Quase metade das cerca de sessenta espécies suecas de libélulas vive nesta imensa turfeira.
observaciones:
  es: >-
    Prohibido pisar la reserva de aves del Kävsjön entre el 1 de marzo y el 15 de agosto; está marcada con
    señales amarillas. Está prohibido arrancar plantas, flores, musgos, líquenes y hongos de madera, y se
    acampa solo en los lugares señalados. Se prohíben los perros sin correa y otros animales domésticos
    sueltos.
texto:
  es:
    intro: >-
      En Store Mosse el suelo es una esponja de musgo, y la vida cabe en los huecos. Con sus 78,5 kilómetros
      cuadrados es la mayor turbera del sur de Suecia, y no es un paisaje uniforme: la extensa turbera convive
      con el lago Kävsjön, rico en aves, con un entorno cultural y con un mosaico de pinares. Se declaró
      parque nacional en 1983.


      Las pasarelas de madera la hacen más fácil de lo que parece, y hay una torre de aves de doce metros,
      senderos accesibles y un naturum para organizar el día.
    landscape: >-
      Store Mosse está a unos 165-180 metros sobre el nivel del mar, entre los valles del Lagan y del Nissan.
      El paisaje lo modeló la última glaciación, pero también la mano humana, con la extracción de turba y el
      descenso del nivel de los lagos; por eso, al pasear, a veces te encuentras con el paisaje que dejó la
      antigua industria de la turba.


      Sobre la turbera alta crecen más de 20 especies de esfagno y tres de rocío de sol (sileshår). En
      primavera el romero de turbera florece con campanillas rosadas y el algodoncillo ilumina el bosque
      pantanoso. En el sur, Björnekullakärret es una excepción: un pequeño turbal calcáreo de unas cinco
      hectáreas, uno de los pocos de las tierras altas de Småland, con orquídeas, musgos propios y un diminuto
      caracol. Un turbal calcáreo es pobre en nutrientes pero rico en cal u otros minerales; esas condiciones
      duras limitan las especies que pueden vivir en él, y es un hábitat amenazado, porque depende de la siega
      o el pastoreo y en muchos sitios el drenaje lo ha secado. Una pasarela lo cruza, así que puedes
      visitarlo sin botas.
    wildlife: >-
      Aquí el protagonista es el cielo. Más temprano en primavera los [gallos lira](/especie/tetrao_tetrix/)
      hacen su parada en varios puntos del parque, y al oeste de Lilla Lövö hay un hide abierto al público
      para observar el celo. En mayo se oye con frecuencia el canto de la agachadiza chica desde la torre de
      Hagudden; entre las aves de humedal están además el zarapito real y el trinador. En primavera, el
      Kävsjön permite buscar [grullas](/especie/grus_grus/), cisnes cantores, ánades reales y aguiluchos.


      El invierno trae a las águilas. Cada invierno, de noviembre a marzo, se alimenta a pigargos y [águilas
      reales](/especie/aquila_chrysaetos/) en el parque, y el águila real también cría en la zona. La
      alimentación, con fauna atropellada, se observa a 400 metros desde un hide público junto a un camino de
      grava, y puede seguirse por webcam.


      Entre los mamíferos, los [alces](/especie/alces_alces/) pueden observarse todo el año; también hay
      corzos, zorros, tejones, linces y [nutrias](/especie/lutra_lutra/). En las tardes de verano, Södra Svänö
      es el mejor punto para observar murciélagos cazando, y en el parque se pueden encontrar seis especies.
    visit: >-
      La entrada principal y el naturum están en la carretera 151 entre Värnamo y Gnosjö, a 17 km de Värnamo.
      El parque tiene varias entradas y se puede llegar en coche, tren, autobús o bicicleta; se puede pedalear
      por los senderos marcados, aunque es difícil en algunos puntos, como las pasarelas de madera.


      El naturum, junto a la entrada principal, explica el parque y su vida, da consejos de rutas y sirve de
      descanso. La torre de aves grande, junto a la entrada principal, mira al Kävsjön y a la turbera
      flotante, con una exposición sobre el lago, su fauna y su gestión, y un reproductor manual con cantos de
      aves.


      Los senderos suman unos 40 kilómetros, y unos 5,5 están adaptados a sillas de ruedas y cochecitos. La
      Wibecksleden mide 1,6 km ida y vuelta, unos treinta minutos, y atraviesa bosque mixto y luego abedular
      encharcado hasta una plataforma con vistas a la turbera flotante. La Svartgölsleden mide unos 1,3 km por
      trayecto y, como la Wibecksleden, está adaptada para sillas de ruedas, personas ciegas y cochecitos.


      Si buscas más, el Kävsjön runt rodea el lago en 12 kilómetros y de tres a cuatro horas, y se puede
      empezar desde cuatro entradas; tiene desvíos a varias torres de aves y va sobre pasarelas y sendas
      forestales irregulares con muchas raíces, entre pinares abiertos y abetales densos. La vuelta a Lilla
      Lövö tiene unos 6 km y es bastante húmeda con lluvia: se recomiendan botas. Con niños, el sendero de
      cuento Skogstrollens stig tarda unos 30 minutos, y el cuento está en sueco, sueco fácil, inglés y
      alemán.
    history: >-
      La turbera fue explotada para turba y los lagos bajaron de nivel: parte del paisaje actual viene de ahí.
      Los turbales calcáreos como Björnekullakärret son un hábitat amenazado.
    before: >-
      Prohibido pisar la reserva de aves del Kävsjön entre el 1 de marzo y el 15 de agosto; está marcada con
      señales amarillas. Está prohibido arrancar plantas, flores, musgos, líquenes y hongos de madera, y se
      acampa solo en los lugares señalados. Se prohíben los perros sin correa y otros animales domésticos
      sueltos.
    around: >-
      Store Mosse comparte con otros humedales lejanos el alce, la grulla o el pigargo: el [Parque Nacional de
      Ķemeri](/lugar/kemeru-nacionalais-parks/) y el [Bosque de
      Orient](/lugar/foret-d-orient---secteurs-forestiers/) tienen grulla y pigargo con humedales y bosque
      maduro, la [Reserva Natural de Lille Vildmose](/lugar/lille-vildmose/) tiene alce y pigargo, y la
      [Meseta de Babadag](/lugar/podisul-babadag---rezervatia-de-stepa/) también tiene pigargo.
  en:
    intro: >-
      At Store Mosse the ground is a moss sponge, where life fills every crevice. Covering 78.5 square
      kilometres, it is the largest bog complex in southern Sweden, and far from monotonous: the expansive
      mire adjoins Lake Kävsjön, renowned for its birdlife, a pastoral cultural landscape, and a mosaic of
      pine woodlands. It was designated a national park in 1983.


      Wooden boardwalks make exploring much easier than it appears, complemented by a twelve-metre bird
      observation tower, accessible paths, and a Naturum visitor centre to plan your visit.
    landscape: >-
      Store Mosse lies at some 165–180 metres above sea level, nestled between the river valleys of the Lagan
      and the Nissan. The landscape was carved by the last glaciation, but also shaped by human hands through
      commercial peat cutting and the lowering of lake water levels; walking the paths, you will occasionally
      come across traces of the bygone peat-extraction industry.


      More than 20 species of sphagnum moss and three of sundew (sileshår) grow across the raised bog plateau.
      In spring, bog rosemary blossoms with pink bell-shaped flowers while cottongrass illuminates the
      waterlogged bog woodlands. In the south, Björnekullakärret forms a striking anomaly: a small calcareous
      fen of roughly five hectares, one of the few in the Småland uplands, harboring rare orchids, specialized
      mosses, and a minute snail species. A calcareous fen is nutrient-poor yet mineral-rich in lime; these
      austere conditions restrict the plants that can survive, making it an endangered habitat reliant on
      traditional haymaking or light grazing, often lost elsewhere to drainage. A wooden boardwalk crosses the
      fen, allowing you to explore without rubber boots.
    wildlife: >-
      Here the sky takes center stage. In early spring, [black grouse](/especie/tetrao_tetrix/) display at
      several lekking sites across the park, with a public observation hide located west of Lilla Lövö for
      watching courtship. In May, the hollow drumming call of the jack snipe echoes from the Hagudden tower;
      wetland birds also include Eurasian curlew and whimbrel. In springtime, Lake Kävsjön offers views of
      [common crane](/especie/grus_grus/), whooper swan, mallard, and marsh harriers.


      Winter brings the eagles. Each winter from November to March, white-tailed eagles and [golden
      eagle](/especie/aquila_chrysaetos/) are provided supplementary winter food in the park, and golden
      eagles also nest locally. Feeding with roadkill carrion can be watched from a public hide 400 metres
      away along a gravel track, or followed via a live webcam.


      Among mammals, [moose](/especie/alces_alces/) can be encountered throughout the year, alongside roe
      deer, red fox, badger, lynx, and [Eurasian otter](/especie/lutra_lutra/). On summer evenings, Södra
      Svänö is the finest spot for watching foraging bats, with six species documented across the national
      park.
    visit: >-
      The main entrance and the Naturum centre lie on road 151 between Värnamo and Gnosjö, 17 km from Värnamo.
      The park has several entry points and can be reached by car, train, bus, or bicycle; cycling is
      permitted on marked paths, though difficult in sections like the wooden boardwalks.


      The Naturum by the main entrance interprets the bog's ecosystem and wildlife, provides hiking advice,
      and offers a quiet rest area. The large bird observation tower beside the main entrance overlooks Lake
      Kävsjön and the quaking mire, housing an interpretive display on the lake's fauna and management
      alongside an audio player featuring bird calls.


      Marked trails total around 40 kilometres, with roughly 5.5 kilometres adapted for wheelchairs and
      strollers. The Wibecksleden measures 1.6 km round trip (about thirty minutes), winding through mixed
      forest and marshy birch woods to an observation platform overlooking the floating fen. The
      Svartgölsleden runs some 1.3 km each way and, like Wibecksleden, is fully adapted for wheelchairs,
      visually impaired visitors, and prams.


      For a longer trek, the Kävsjön runt trail loops around the lake for 12 kilometres (three to four hours),
      accessible from four trailheads; it features detours to several bird towers along boardwalks and uneven,
      root-strewn forest tracks between open pine barrens and dense spruce stands. The loop around Lilla Lövö
      spans about 6 km and becomes quite waterlogged in rain, making waterproof boots advisable. For children,
      the Skogstrollens stig fairytale trail takes about 30 minutes, presented in Swedish, easy Swedish,
      English, and German.
    history: >-
      The mire was exploited for peat cutting and lake water levels were lowered: part of today's terrain
      stems from that industrial past. Calcareous fens like Björnekullakärret remain fragile and threatened
      habitats.
    before: >-
      Entering the Kävsjön bird sanctuary is prohibited between 1 March and 15 August; the restricted boundary
      is marked with yellow signs. Picking plants, flowers, mosses, lichens, and wood-inhabiting bracket fungi
      is strictly forbidden, and camping is permitted only at designated shelters. Dogs must be kept on a
      leash at all times.
    around: >-
      Store Mosse shares moose, common crane, or white-tailed eagle with other distant wetlands: [Ķemeri
      National Park](/lugar/kemeru-nacionalais-parks/) and [Forêt
      d'Orient](/lugar/foret-d-orient---secteurs-forestiers/) host crane and eagle amidst wetlands and mature
      forest, [Lille Vildmose Nature Reserve](/lugar/lille-vildmose/) supports moose and eagle, and the
      [Babadag Plateau](/lugar/podisul-babadag---rezervatia-de-stepa/) also shelters white-tailed eagle.
  fr:
    intro: >-
      À Store Mosse, le sol est une éponge de sphaigne où la vie s'immisce dans chaque anfractuosité. Avec ses
      78,5 kilomètres carrés, c'est la plus vaste tourbière du sud de la Suède, loin d'être un décor monotone
      : la grande tourbière haute voisine avec le lac Kävsjön réputé pour ses oiseaux, un cadre agropastoral
      traditionnel et une mosaïque de pinèdes. L'espace a été classé parc national en 1983.


      Des passerelles de madriers rendent la marche bien plus aisée qu'il n'y paraît, complétées par une tour
      ornithologique de douze mètres, des sentiers accessibles et un naturum pour préparer votre journée.
    landscape: >-
      Store Mosse s'étend entre 165 et 180 mètres d'altitude, niché entre les vallées fluviales du Lagan et du
      Nissan. Le paysage a été façonné par la dernière glaciation mais aussi par les activités humaines, avec
      l'extraction de la tourbe et l'abaissement du niveau des lacs ; en vous promenant, vous découvrirez
      parfois les vestiges laissés par l'ancienne industrie tourbière.


      Sur la tourbière haute se développent plus de 20 espèces de sphaignes et trois de droséras (sileshår).
      Au printemps, l'andromède fleurit en clochettes roses tandis que les linaigrettes illuminent la forêt
      marécageuse. Au sud, Björnekullakärret forme une exception remarquable : une petite tourbière basse
      alcaline d'environ cinq hectares, l'une des rares des hauts plateaux du Småland, abritant orchidées,
      mousses rares et un minuscule escargot. Une tourbière calcaire est pauvre en nutriments mais saturée en
      calcaire ; ces conditions contraignantes limitent le nombre d'espèces capables d'y subsister, ce qui en
      fait un milieu menacé tributaire de la fauche ou du pâturage et souvent détruit ailleurs par drainage.
      Un platelage en bois la traverse, permettant la visite sans bottes.
    wildlife: >-
      Ici, le ciel est le premier des spectacles. Dès le début du printemps, les [tétras
      lyres](/especie/tetrao_tetrix/) paradent sur plusieurs arènes de parade du parc, et à l'ouest de Lilla
      Lövö un affût public permet d'observer les parades nuptiales. En mai, le chant singulier de la bécassine
      sourde résonne depuis la tour de Hagudden ; les zones humides accueillent aussi le courlis cendré et le
      courlis corlieu. Au printemps, le Kävsjön permet d'admirer les [grues cendrées](/especie/grus_grus/),
      les cygnes chanteurs, les canards colverts et les busards.


      L'hiver attire les grands rapaces. Chaque hiver de novembre à mars, des pygargues et des [aigles
      royaux](/especie/aquila_chrysaetos/) sont nourris dans le parc, l'aigle royal nichant également dans les
      parages. Ce nourrissage hivernal s'observe à 400 mètres depuis un affût public aménagé le long d'une
      piste de gravier, ou en direct par webcam.


      Parmi les mammifères, l'[élan](/especie/alces_alces/) s'observe en toute saison ; chevreuils, renards,
      blaireaux, lynx et [loutres d'Europe](/especie/lutra_lutra/) arpentent aussi les lieux. Les soirs d'été,
      Södra Svänö constitue le meilleur observatoire pour voir chasser les chauves-souris, le parc comptant
      six espèces de chiroptères.
    visit: >-
      L'entrée principale et le naturum se situent sur la route 151 entre Värnamo et Gnosjö, à 17 km de
      Värnamo. Le parc compte plusieurs accès et se rejoint en voiture, train, autocar ou vélo ; pédaler est
      autorisé sur les chemins balisés, bien que malaisé par endroits comme sur les passerelles de bois.


      Le naturum près de l'entrée principale explique le fonctionnement du biotope, donne des conseils
      d'itinéraires et sert d'espace de détente. La grande tour ornithologique contiguë donne sur le lac
      Kävsjön et la tourbière tremblante, abritant une scénographie sur le lac et un module sonore
      reproduisant les chants d'oiseaux.


      Les sentiers totalisent environ 40 kilomètres, dont près de 5,5 sont adaptés aux fauteuils roulants et
      poussettes. La boucle de Wibecksleden fait 1,6 km aller-retour (environ trente minutes) à travers bois
      mixtes et bétulaie inondée jusqu'à une plateforme avec vue sur la tourbière flottante. La Svartgölsleden
      s'étend sur environ 1,3 km l'aller et, tout comme Wibecksleden, est aménagée pour les personnes en
      situation de handicap visuel ou moteur.


      Pour aller plus loin, le tour Kävsjön runt contourne le lac sur 12 kilomètres en trois à quatre heures,
      accessible depuis quatre entrées ; il comprend des embranchements vers plusieurs tours d'observation et
      chemine sur madriers et sentiers forestiers accidentés entre pinèdes claires et pessières denses. La
      boucle de Lilla Lövö mesure environ 6 km et s'avère très humide par temps de pluie : les bottes sont
      recommandées. Avec des enfants, le parcours conté Skogstrollens stig dure environ 30 minutes, disponible
      en suédois, suédois facile, anglais et allemand.
    history: >-
      La tourbière a été exploitée pour son combustible et les lacs ont vu leur niveau baisser : une part du
      paysage actuel provient de ces travaux passés. Les tourbières calcaires comme Björnekullakärret
      demeurent des habitats rares et menacés.
    before: >-
      L'accès à la réserve ornithologique du Kävsjön est strictement interdit du 1er mars au 15 août ; le
      secteur est balisé de panneaux jaunes. Il est défendu d'arracher végétaux, fleurs, mousses, lichens et
      champignons lignicoles, et le bivouac est réservé aux emplacements prévus. Les chiens et animaux de
      compagnie doivent être tenus en laisse.
    around: >-
      Store Mosse partage l'élan, la grue ou le pygargue avec d'autres zones humides lointaines : le [Parc
      national de Ķemeri](/lugar/kemeru-nacionalais-parks/) et la [Forêt
      d'Orient](/lugar/foret-d-orient---secteurs-forestiers/) accueillent grue et pygargue en milieu lacustre
      et forestier, la [Réserve naturelle de Lille Vildmose](/lugar/lille-vildmose/) abrite élan et pygargue,
      et le [Plateau de Babadag](/lugar/podisul-babadag---rezervatia-de-stepa/) compte aussi le pygargue à
      queue blanche.
  de:
    intro: >-
      Im Store Mosse ist der Boden ein feuchter Moosschwamm, in dessen Zwischenräumen sich das Leben
      entfaltet. Mit 78,5 Quadratkilometern ist es das größte Moor Südschwedens und keineswegs eine monotone
      Weite: Das ausgedehnte Hochmoor grenzt an den vogelreichen See Kävsjön, an eine historische
      Kulturlandschaft und an ein Mosaik aus Kiefernwäldern. Es wurde 1983 zum Nationalpark erklärt.


      Holzstege erleichtern das Vorankommen erheblich; ein zwölf Meter hoher Vogelbeobachtungsturm,
      barrierefreie Wege und das Naturum unterstützen bei der Gestaltung deines Tages.
    landscape: >-
      Store Mosse liegt auf etwa 165–180 Metern über dem Meeresspiegel zwischen den Flusstälern des Lagan und
      des Nissan. Das Landschaftsbild wurde durch die letzte Eiszeit geprägt, aber auch durch Menschenhand
      beim industriellen Torfabbau und der Absenkung der Seen geformt; beim Wandern stößt du mancherorts auf
      Relikte des einstigen Torfgewerbes.


      Auf dem Hochmoor wachsen mehr als 20 Torfmoosarten und drei Arten Sonnentau (sileshår). Im Frühling
      blüht die Rosmarinheide mit rosa Glockenblumen und das Wollgras erleuchtet die feuchten Bruchwälder. Im
      Süden bildet Björnekullakärret eine bemerkenswerte Ausnahme: ein kleines Kalkflachmoor von rund fünf
      Hektar, eines der wenigen im Hochland von Småland, mit Orchideen, speziellen Moosen und einer winzigen
      Schnecke. Ein Kalkmoor ist nährstoffarm, aber reich an Kalkmineralien; diese extremen Bedingungen
      beschränken den Artenbestand und machen es zu einem bedrohten Lebensraum, der auf Mahd oder Beweidung
      angewiesen ist und andernorts durch Entwässerung zerstört wurde. Ein Holzsteg durchzieht das Moor,
      sodass du es ohne Gummistiefel betreten kannst.
    wildlife: >-
      Hier gehört die Bühne dem Himmel. Im zeitigen Frühjahr balzen die [Birkhühner](/especie/tetrao_tetrix/)
      an mehreren Plätzen im Park, und westlich von Lilla Lövö steht eine öffentliche Beobachtungshütte zur
      Verfügung. Im Mai ist von der Plattform in Hagudden oft der Ruf der Zwergschnepfe zu vernehmen; unter
      den Feuchtwiesenvögeln treten auch Großer Brachvogel und Regenbrachvogel auf. Im Frühling lassen sich am
      Kävsjön [Kraniche](/especie/grus_grus/), Singschwäne, Stockenten und Weihen beobachten.


      Der Winter lockt Adler an. Jeden Winter von November bis März werden Seeadler und
      [Steinadler](/especie/aquila_chrysaetos/) im Park zugefüttert, wobei der Steinadler auch im Umfeld
      brütet. Die Fütterung mit Fallwild lässt sich aus 400 Metern Entfernung von einem öffentlichen
      Unterstand an einem Schotterweg beobachten oder per Webcam verfolgen.


      Unter den Säugetieren können [Elche](/especie/alces_alces/) das ganze Jahr über gesichtet werden; zudem
      gibt es Rehe, Füchse, Dachse, Luchse und [Eurasische Fischotter](/especie/lutra_lutra/). An
      Sommerabenden ist Södra Svänö der beste Ort zur Beobachtung jagender Fledermäuse; im Park wurden sechs
      Fledermausarten nachgewiesen.
    visit: >-
      Der Haupteingang und das Naturum liegen an der Straße 151 zwischen Värnamo und Gnosjö, 17 km von Värnamo
      entfernt. Der Park besitzt mehrere Zugänge und ist per Pkw, Bahn, Bus oder Fahrrad erreichbar; Radfahren
      ist auf markierten Wegen gestattet, stellenweise auf schmalen Bohlenwegen jedoch schwierig.


      Das Naturum am Haupteingang veranschaulicht Lebensräume und Tierwelt, berät zu Routen und bietet
      Rastmöglichkeiten. Der große Beobachtungsturm am Haupteingang blickt auf den Kävsjön und das
      Schwingrasenmoor, ergänzt durch eine Ausstellung zur Seebewirtschaftung und ein Audiogerät mit
      Vogelstimmen.


      Die Wanderwege summieren sich auf rund 40 Kilometer, wovon etwa 5,5 Kilometer für Rollstühle und
      Kinderwagen ausgebaut sind. Der Wibecksleden misst 1,6 km hin und zurück (etwa dreißig Minuten) und
      führt durch Mischwald und Bruchbirkenwald zu einer Aussichtsplattform über dem Schwingmoor. Der
      Svartgölsleden verläuft über rund 1,3 km je Richtung und ist wie der Wibecksleden für Rollstühle,
      Sehbehinderte und Kinderwagen eingerichtet.


      Für längere Wanderungen umrundet der Kävsjön runt den See auf 12 Kilometern in drei bis vier Stunden,
      beginnend an vier Eingängen; er bietet Abstecher zu mehreren Vogeltürmen und führt über Holzstege und
      wurzelige Waldpfade zwischen lichten Kiefern und dichten Fichten. Die Schleife um Lilla Lövö umfasst
      etwa 6 km und wird bei Regen sehr nass: Stiefel sind ratsam. Mit Kindern beansprucht der Märchenpfad
      Skogstrollens stig etwa 30 Minuten; die Geschichte liegt auf Schwedisch, einfachem Schwedisch, Englisch
      und Deutsch aus.
    history: >-
      Das Moor wurde für Torf abgetorft und die Seespiegel wurden künstlich gesenkt: Teile des heutigen
      Geländes rühren aus dieser Zeit her. Kalkmoore wie Björnekullakärret sind seltene, hochgradig gefährdete
      Lebensräume.
    before: >-
      Das Betreten des Vogelschutzgebiets Kävsjön ist vom 1. März bis zum 15. August verboten; das Areal ist
      mit gelben Schildern gekennzeichnet. Das Pflücken von Pflanzen, Blumen, Moosen, Flechten und Baumpilzen
      ist streng untersagt, Zelten nur an ausgewiesenen Plätzen erlaubt. Hunde müssen stets an der Leine
      geführt werden.
    around: >-
      Store Mosse teilt Elch, Kranich oder Seeadler mit fernen Feuchtgebieten: Der [Nationalpark
      Ķemeri](/lugar/kemeru-nacionalais-parks/) und der [Wald von
      Orient](/lugar/foret-d-orient---secteurs-forestiers/) beherbergen Kranich und Seeadler in Mooren und
      Altwäldern, das [Naturschutzgebiet Lille Vildmose](/lugar/lille-vildmose/) ernährt Elch und Adler, und
      das [Babadag-Plateau](/lugar/podisul-babadag---rezervatia-de-stepa/) weist ebenfalls Seeadler auf.
  it:
    intro: >-
      A Store Mosse il terreno è una spugna di muschio dove la vita occupa ogni fessura. Con i suoi 78,5
      chilometri quadrati è la più estesa torbiera della Svezia meridionale e non è affatto un paesaggio
      monotono: l'immensa torbiera alta convive con il lago Kävsjön, ricchissimo di uccelli, con un contesto
      rurale e con un mosaico di pinete. È stato istituito come parco nazionale nel 1983.


      Le passerelle in legno ne rendono la visita più agevole del previsto, completate da una torretta di
      avvistamento di dodici metri, sentieri accessibili e un naturum per organizzare l'escursione.
    landscape: >-
      Store Mosse si colloca a circa 165–180 metri sul livello del mare, compreso tra le vallate fluviali del
      Lagan e del Nissan. Il territorio è stato modellato dall'ultima glaciazione ma anche dall'opera umana,
      attraverso l'estrazione industriale di torba e l'abbassamento del livello dei laghi; camminando capita
      di scorgere i segni lasciati dall'antica attività estrattiva.


      Sulla torbiera alta allignano oltre 20 specie di sfagno e tre di drosera (sileshår). In primavera
      l'andromeda sboccia con campanule rosate e gli eriofori illuminano il bosco paludoso. A sud,
      Björnekullakärret costituisce una notevole eccezione: una piccola torbiera alcalina di circa cinque
      ettari, una delle poche degli altopiani dello Småland, con orchidee, muschi particolari e una minuscola
      chiocciola. Una torbiera calcarea è povera di sostanze nutritive ma ricca di calcare; tali condizioni
      estreme selezionano specie specializzate rendendola un ambiente minacciato, legato a sfalcio o pascolo e
      prosciugato altrove dai drenaggi. Una passerella la attraversa permettendo di visitarla senza stivali.
    wildlife: >-
      Qui la volta celeste è la vera protagonista. All'inizio della primavera i [fagiani di
      monte](/especie/tetrao_tetrix/) tengono le loro parate nuziali in vari angoli del parco, e a ovest di
      Lilla Lövö si trova un capanno pubblico per osservarne i corteggiamenti. A maggio risuona sovente il
      richiamo del frullino dalla torretta di Hagudden; tra i volatili di palude compaiono pure chiurlo
      maggiore e chiurlo piccolo. In primavera il Kävsjön consente di osservare [Gru](/especie/grus_grus/),
      cigni selvatici, germani reali e falchi di palude.


      L'inverno porta le aquile. Ogni inverno da novembre a marzo aquile di mare e [Aquila
      reale](/especie/aquila_chrysaetos/) vengono alimentate nel parco, con l'aquila reale presente anche come
      nidificante locale. Questo foraggiamento invernale con carcasse stradali si può osservare da 400 metri
      tramite un capanno pubblico lungo una sterrata, oppure seguire in diretta webcam.


      Tra i mammiferi, gli [alci](/especie/alces_alces/) sono visibili tutto l'anno; vi sono anche caprioli,
      volpi, tassi, linci e [Lontra europea](/especie/lutra_lutra/). Nelle sere estive Södra Svänö è il punto
      ideale per ammirare i pipistrelli a caccia, con sei specie presenti nel parco.
    visit: >-
      L'ingresso principale e il naturum sorgono lungo la strada 151 tra Värnamo e Gnosjö, a 17 km da Värnamo.
      Il parco conta diversi accessi ed è raggiungibile in auto, treno, bus o bicicletta; pedalare è
      consentito sui tracciati segnalati, pur risultando arduo sui passaggi con assi di legno.


      Il naturum all'entrata principale illustra la natura e la fauna del luogo, offre spunti di visita e
      funge da sosta. La grande torretta per l'avifauna a fianco dell'ingresso guarda verso il lago Kävsjön e
      la torbiera galleggiante, ospitando un allestimento didattico sul bacino e un diffusore con canti di
      uccelli.


      La rete dei sentieri assomma circa 40 chilometri, di cui 5,5 resi accessibili a sedie a rotelle e
      passeggini. Il tracciato Wibecksleden misura 1,6 km andata e ritorno (circa trenta minuti) e attraversa
      il bosco misto e una betuleta allagata fino a una pedana panoramica sulla torbiera galleggiante. La
      Svartgölsleden copre circa 1,3 km a tratta e, come la Wibecksleden, è accessibile a persone con
      disabilità visiva e motoria.


      Chi desidera camminare a lungo può compiere il Kävsjön runt, anello di 12 chilometri percorribile in tre
      o quattro ore e accessibile da quattro ingressi distinti; prevede deviazioni per varie torrette e corre
      su passerelle e sentieri forestali accidentati tra pinete aperte e fitte abetaie. Il circuito di Lilla
      Lövö misura circa 6 km ed è assai fangoso dopo la pioggia: consigliati gli stivali. Con i più piccoli,
      il sentiero delle fiabe Skogstrollens stig richiede circa 30 minuti, disponibile in svedese, svedese
      semplificato, inglese e tedesco.
    history: >-
      La torbiera fu sfruttata per l'estrazione e il livello dei laghi venne ridotto artificialmente: parte
      della morfologia odierna deriva da tali interventi. Le torbiere calcaree come Björnekullakärret sono
      habitat fragili e protetti.
    before: >-
      È vietato accedere all'area protetta per l'avifauna del Kävsjön tra il 1° marzo e il 15 agosto; il
      confine è indicato da segnali gialli. È fatto divieto di raccogliere piante, fiori, muschi, licheni e
      funghi lignicoli, e il bivacco è consentito solo nelle apposite piazzole. I cani devono essere
      rigorosamente tenuti al guinzaglio.
    around: >-
      Store Mosse condivide alce, gru o aquila di mare con altre zone umide europee: il [Parco Nazionale di
      Ķemeri](/lugar/kemeru-nacionalais-parks/) e la [Foresta
      d'Orient](/lugar/foret-d-orient---secteurs-forestiers/) ospitano gru e aquila di mare tra paludi e
      boschi maturi, la [Riserva Naturale di Lille Vildmose](/lugar/lille-vildmose/) vanta alce e aquila di
      mare, e l'[Altopiano di Babadag](/lugar/podisul-babadag---rezervatia-de-stepa/) annovera anch'esso
      l'aquila di mare.
  pt:
    intro: >-
      Em Store Mosse o chão é uma esponja de musgo, onde a vida cabe em cada reentrância. Com 78,5 quilómetros
      quadrados é a maior turfeira do sul da Suécia, e longe de ser uma paisagem uniforme: a vasta turfeira
      alta convive com o lago Kävsjön, riquíssimo em avifauna, com uma paisagem agropastoril tradicional e um
      mosaico de pinhais. Foi declarado parque nacional em 1983.


      Os passadiços de madeira facilitam a caminhada mais do que parece, contando ainda com uma torre de
      observação de aves com doze metros de altura, trilhos acessíveis e um naturum para planear o dia.
    landscape: >-
      Store Mosse situa-se a cerca de 165–180 metros acima do nível do mar, entre os vales fluviais do Lagan e
      do Nissan. O relevo foi esculpido pela última glaciação, mas também pela intervenção humana através da
      extração de turfa e do rebaixamento do nível dos lagos; ao caminhar, encontram-se por vezes marcas
      deixadas pela antiga atividade extrativa.


      Sobre a turfeira alta crescem mais de 20 espécies de esfagno e três de dróseras (sileshår). Na primavera
      a andrómeda floresce com campânulas rosadas e o algodão-dos-pauis ilumina as matas pantanosas. A sul,
      Björnekullakärret constitui uma notável exceção: uma pequena turfeira calcária de cerca de cinco
      hectares, uma das poucas dos planaltos de Småland, com orquídeas, musgos raros e um minúsculo caracol.
      Uma turfeira calcária é pobre em nutrientes mas rica em calcário; estas condições rigorosas limitam as
      espécies capazes de nela prosperar, tornando-a num habitat ameaçado dependente de ceifa ou pastoreio e
      secado noutros locais por drenagens. Um passadiço de madeira atravessa-a, permitindo visitá-la sem
      galochas.
    wildlife: >-
      Aqui o protagonista é o firmamento. No início da primavera os [tetrazes-lira](/especie/tetrao_tetrix/)
      exibem as suas paradas nupciais em vários pontos do parque, e a oeste de Lilla Lövö existe um abrigo
      público para observar o cortejo. Em maio escuta-se frequentemente o canto da narceja-galega a partir da
      torre de Hagudden; entre as aves palustres contam-se ainda o maçarico-real e o maçarico-galego. Na
      primavera, o Kävsjön permite avistar [grou-comum](/especie/grus_grus/), cisnes-bravos, patos-reais e
      tartaranhões.


      O inverno atrai as grandes águias. Em cada inverno, de novembro a março, são alimentados no parque
      águias-rabalvas e [águia-real](/especie/aquila_chrysaetos/), nidificando a águia-real igualmente na
      região envolvente. Esta alimentação com carcaças de atropelamentos pode ser observada a 400 metros de
      distância a partir de um abrigo público junto a um caminho de cascalho, ou acompanhada por webcam.


      Entre os mamíferos, o [alce](/especie/alces_alces/) pode ser avistado durante todo o ano; ocorrem também
      corços, raposas, texugos, linces e [lontra-europeia](/especie/lutra_lutra/). Nos serões de verão, Södra
      Svänö é o melhor local para ver morcegos em caça ativa, albergando o parque seis espécies de
      quirópteros.
    visit: >-
      A entrada principal e o naturum situam-se na estrada 151 entre Värnamo e Gnosjö, a 17 km de Värnamo. O
      parque dispõe de vários acessos e pode ser alcançado de carro, comboio, autocarro ou bicicleta; é
      permitido pedalar nos percursos sinalizados, ainda que com dificuldade em certas secções como os
      passadiços.


      O naturum junto à entrada principal explica o parque e a sua biodiversidade, sugere itinerários e serve
      de ponto de descanso. A grande torre de aves adjacente à entrada mira o lago Kävsjön e a turfeira
      flutuante, contendo uma exposição sobre o lago e a sua gestão, além de um reprodutor sonoro com cantos
      de aves.


      Os trilhos totalizam cerca de 40 quilómetros, estando aproximadamente 5,5 adaptados a cadeiras de rodas
      e carrinhos de bebé. O Wibecksleden mede 1,6 km ida e volta (cerca de trinta minutos), percorrendo
      bosque misto e depois um vidoal encharcado até a uma plataforma com vista para a turfeira flutuante. O
      Svartgölsleden tem cerca de 1,3 km por sentido e, à semelhança do Wibecksleden, encontra-se adaptado a
      cadeiras de rodas, invisuais e carrinhos de bebé.


      Para quem procura percursos mais longos, o Kävsjön runt circunda o lago ao longo de 12 quilómetros (três
      a quatro horas), podendo iniciar-se a partir de quatro entradas; conta com desvios para vários
      observatórios de aves e desenvolve-se sobre passadiços e veredas florestais irregulares com muitas
      raízes, entre pinhais abertos e densos abetais. A volta a Lilla Lövö estende-se por cerca de 6 km e fica
      bastante lamacenta com chuva: recomendam-se botas impermeáveis. Com crianças, o trilho de conto
      Skogstrollens stig percorre-se em cerca de 30 minutos, estando a história disponível em sueco, sueco
      fácil, inglês e alemão.
    history: >-
      A turfeira foi explorada comercialmente para extração de turfa e os lagos sofreram rebaixamento de
      nível: parte da fisionomia atual resulta dessas intervenções. As turfeiras calcárias como
      Björnekullakärret são habitats frágeis e ameaçados.
    before: >-
      É proibido entrar na reserva ornitológica do Kävsjön entre 1 de março e 15 de agosto; o perímetro está
      delimitado por placas amarelas. É expressamente interdito colher plantas, flores, musgos, líquenes e
      fungos lignícolas, e o acampamento só é permitido nos locais assinalados. Os cães devem circular sempre
      com trela.
    around: >-
      Store Mosse partilha alces, grous ou águia-rabalva com outras zonas húmidas distantes: o [Parque
      Nacional de Ķemeri](/lugar/kemeru-nacionalais-parks/) e a [Floresta de
      Orient](/lugar/foret-d-orient---secteurs-forestiers/) acolhem grou e águia-rabalva entre turfeiras e
      florestas maduras, a [Reserva Natural de Lille Vildmose](/lugar/lille-vildmose/) mantém alce e
      águia-rabalva, e o [Planalto de Babadag](/lugar/podisul-babadag---rezervatia-de-stepa/) abriga
      igualmente a águia-rabalva.
