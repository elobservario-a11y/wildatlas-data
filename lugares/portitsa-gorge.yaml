  en: >-
    A limestone defile crossed only by wading the riverbed, guarded at its mouth by a two-arch Ottoman stone
    bridge.
  fr: >-
    Un défilé qui ne se franchit qu'en marchant dans le lit de la rivière, précédé d'un pont ottoman en
