texto:
  es:
    intro: >-
      Dos paredes de piedra que casi se tocan y un río que llena el suelo entero entre ellas. Así es la
      garganta de Portitsa, a la que los vecinos llaman Symplegades, las «rocas que chocan», por sus
      acantilados escarpados de doscientos metros. En su entrada, un puente de piedra de dos arcos cruza el
      río Venetikos y une los pueblos de Spilaio y Monachiti. Está en la región de Grevená, en Macedonia
      Occidental, y es de esos sitios donde la naturaleza y la obra humana se explican la una a la otra.
    landscape: >-
      El Venetikos, un afluente del Haliacmon, ocupa todo el ancho del lecho de la garganta, y por eso esta es
      intransitable salvo que se camine por el agua. A la altura del puente, el paisaje es de riscos
      pronunciados.


      Los puentes de piedra se levantaron en época otomana por toda la región, a lo largo del Venetikos, «el
      río de aguas verde esmeralda», del Haliacmon y de otros ríos. Los construyeron maestros que venían de
      pueblos de artesanos de Grevená, Kozani, Kastoria y Ioánina. Tienen aberturas de alivio en los pilares y
      tajamares triangulares, que encauzan el agua de las crecidas sin poner en riesgo la estabilidad. El de
      Portitsa mide treinta y cuatro metros y tiene dos arcos: el mayor, ligeramente apuntado, es la excepción
      en una región de arcos semicirculares.
    wildlife: >-
      Aquí el protagonista es el río, de aguas verde esmeralda, y lo que hace con el agua cuando crece. En
      algunos puentes de la región se colgaba una campana de cobre en el centro del arco central, para avisar
      a los viandantes del peligro cuando soplaba el viento o crecía el río.


      El puente aparece rodeado de vegetación exuberante y aguas que fluyen, y de él sale el camino empedrado
      hacia Spilaio.
    visit: >-
      Desde el puente sale un viejo camino empedrado hasta el pueblo de Spilaio, una excursión que merece la
      pena. Cruzar el puente da vistas del río y de la entrada imponente de la garganta; para atravesar la
      garganta a la altura del puente hay que caminar por el Venetikos.
    history: >-
      Los puentes de piedra de Grevená se levantaron entre finales del siglo XVII y finales del XIX, cuando
      florecía el comercio de la región, y sirvieron a las caravanas de mercaderes que acudían a las grandes
      ferias de Grevená, la más importante en Mavronoros cada verano. También servían a los pastores que
      desplazaban sus rebaños entre los pastos del Pindo y las llanuras de Tesalia.


      El de Portitsa se restauró en los años treinta. Los testimonios orales lo sitúan entre 1830 y 1850, a
      costa del monasterio de la Dormición de la Virgen, en Spilaio; otra fecha lo lleva hacia 1743 y también
      apunta al monasterio de Spilaio como financiador. Mide treinta y cuatro metros de largo, casi 2,70 de
      ancho, y sus dos arcos son uno mayor y otro de cinco metros.
    before: >-
      Para pasar por la garganta hay que caminar por el río, y el Venetikos puede crecer: así que ve preparado
      para mojarte.
    around: >-
      En el atlas la garganta no tiene vecinos cercanos. De lejos le recuerdan gargantas de karst y de río
      como el [Aqueronte](/lugar/acheron-river-wild-upper-gorge/), la [Reserva Natural Garganta del
      Sagittario](/lugar/gole-del-sagittario/), el [Monumento Natural de los Puentes Maravillosos de las
      Ródopes](/lugar/chudnite-mostove/) y las [Gargantas del Río
      Doubs](/lugar/gorges-du-doubs---franco-suisses/).
  en:
    intro: >-
      Two sheer stone cliffs that almost touch, with a turquoise river completely filling the passage between
      them. This is Portitsa Gorge, which locals call the Symplegades—the "clashing rocks"—after its
      precipitous two-hundred-meter limestone crags. Right at its entrance, a double-arched stone bridge spans
      the Venetikos River, historically linking the mountain villages of Spilaio and Monachiti. Set in the
      Grevena regional unit of Western Macedonia, it is one of those timeless places where raw nature and
      traditional masonry explain each other.
    landscape: >-
      The Venetikos, a principal tributary of the Haliacmon, occupies the entire floor of the gorge, rendering
      the canyon impassable on foot unless you wade directly through its waters. Around the bridge, the
      topography rises into sheer crags.


      Traditional arched stone bridges were erected across the region during Ottoman times along the emerald
      waters of the Venetikos, the Haliacmon, and their mountain feeders. They were crafted by itinerant
      master masons hailing from renowned artisan settlements in Grevena, Kozani, Kastoria, and Ioannina.
      Built with flood relief openings in the spandrels and triangular cutwaters on the piers, they deflect
      high waters without risking collapse. The bridge of Portitsa spans thirty-four meters with two arches:
      the larger main span, slightly pointed, is an exception in a landscape dominated by semicircular arches.
    wildlife: >-
      The emerald-green river is the central protagonist here, along with its dynamic response to mountain
      downpours. On several historical bridges in the area, a small brass bell was suspended beneath the
      keystone of the central arch to ring when gale winds or surging freshets made crossing treacherous.


      The bridge stands framed by riparian plane trees and bubbling currents, with an ancient cobbled
      packhorse trail climbing directly toward Spilaio.
    visit: >-
      From the bridge, a preserved stone-paved mule track ascends to the cliff-top village of Spilaio, making
      for an exceptional walk. Crossing the bridge affords commanding perspectives over the river and the
      dramatic limestone portal; to venture beyond into the gorge, you must wade directly into the Venetikos.
    history: >-
      The stone bridges of Grevena were raised between the late seventeenth and the late nineteenth century
      during a golden age of regional overland trade. They accommodated merchant caravans journeying to
      prominent trade fairs, notably the renowned summer fair of Mavronoros. They also guided transhumant
      Vlach shepherds moving flocks between high Pindus summer pastures and lowland Thessalian winter plains.


      Portitsa Bridge was restored in the nineteen-thirties. Oral accounts date its original construction
      between 1830 and 1850 funded by the Monastery of the Dormition of the Virgin in Spilaio; another
      historical record dates it back to 1743, likewise attributing patronage to Spilaio Monastery. The
      structure measures thirty-four meters long and almost 2.70 meters wide, supported by a large primary
      arch and a secondary arch spanning five meters.
    before: >-
      Penetrating the gorge requires wading the river, and the Venetikos is prone to sudden fluctuations in
      volume: come prepared to get wet.
    around: >-
      The gorge has no immediate neighbors in the atlas. Further away, kindred karst canyons and river portals
      include the [Acheron River](/lugar/acheron-river-wild-upper-gorge/), the [Gole del Sagittario Nature
      Reserve](/lugar/gole-del-sagittario/), the [Wonderful Bridges Natural Monument in the
      Rhodopes](/lugar/chudnite-mostove/), and the [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/).
  fr:
    intro: >-
      Deux falaises de calcaire qui se touchent presque et une rivière qui occupe tout l'espace entre elles.
      Tel est le défilé de Portitsa, que les gens du cru surnomment Symplégades—les « roches qui
      s'entrechoquent »—en raison de ses abrupts vertigineux de deux cents mètres. À son entrée, un pont de
      pierre à double arche enjambe le Venétikos pour relier les villages de Spilaio et Monachiti. Situé dans
      le district de Grévéna en Macédoine-Occidentale, c'est un site où nature brute et génie des bâtisseurs
      s'éclairent mutuellement.
    landscape: >-
      Le Venétikos, affluent de l'Aliakmon, occupe toute la largeur du canyon, rendant le passage impossible
      sans marcher dans l'eau. Au niveau du pont, le relief n'est que parois rocheuses déchiquetées.


      Les ponts de pierre ont été bâtis à l'époque ottomane dans toute la région, le long des eaux vert
      émeraude du Venétikos, de l'Aliakmon et de leurs affluents. Ils sont l'œuvre de maîtres maçons venus des
      villages réputés de Grévéna, Kozani, Kastoria et Ioannina. Pourvus d'ouïes d'évacuation dans les piles
      et d'avant-becs triangulaires, ils laissent s'écouler les crues sans faiblir. Celui de Portitsa mesure
      trente-quatre mètres et possède deux arches : la plus grande, légèrement brisée, fait figure d'exception
      au milieu d'arches régionales en plein cintre.
    wildlife: >-
      Le cours d'eau aux reflets émeraude est le cœur du paysage, tout comme ses brusques colères lors des
      orages. Sur certains ponts du secteur, une cloche en cuivre était suspendue sous la clé de voûte de
      l'arche centrale pour avertir les voyageurs du danger lorsque le vent ou les flots grondaient.


      L'ouvrage se dresse au milieu de platanes riverains et d'eaux vives, tandis qu'une calade pavée grimpe
      vers Spilaio.
    visit: >-
      Depuis le pont, un vieux sentier pavé monte jusqu'au village perché de Spilaio, offrant une excursion
      remarquable. Traverser l'ouvrage ouvre de magnifiques perspectives sur les gorges ; pour pénétrer dans
      le défilé, il faut impérativement descendre dans le lit du Venétikos.
    history: >-
      Les ponts de pierre de Grévéna ont été édifiés entre la fin du XVIIe et la fin du XIXe siècle, à l'âge
      d'or des foires commerciales régionales, notamment la grande foire d'été de Mavronoros. Ils servaient
      également aux bergers transhumants reliant les alpages du Pinde aux plaines de Thessalie.


      Le pont de Portitsa a été consolidé dans les années trente. Les traditions orales situent sa
      construction entre 1830 et 1850 aux frais du monastère de la Dormition de Spilaio ; une autre source
      mentionne l'année 1743 avec le même mécénat monastique. Il mesure trente-quatre mètres de long pour près
      de 2,70 mètres de large, porté par une grande arche et une seconde arche de cinq mètres.
    before: >-
      S'aventurer dans la gorge impose de marcher dans l'eau, et le Venétikos peut gonfler rapidement :
      prévoyez un équipement adapté pour vous mouiller.
    around: >-
      Dans l'atlas, la gorge n'a pas de voisins immédiats. Plus loin, des paysages comparables se retrouvent
      aux [gorges de l'Achéron](/lugar/acheron-river-wild-upper-gorge/), à la [réserve naturelle des gorges du
      Sagittario](/lugar/gole-del-sagittario/), au [monument naturel des Ponts Merveilleux des
      Rhodopes](/lugar/chudnite-mostove/) et aux [gorges du Doubs](/lugar/gorges-du-doubs---franco-suisses/).
  de:
    intro: >-
      Zwei Felswände, die einander fast berühren, und ein Fluss, der die Talsohle gänzlich ausfüllt. Das ist
      die Portitsa-Schlucht, von den Einheimischen nach den mythischen Symplegaden—den aufeinandertreffenden
      Felsen—benannt, wegen ihrer zweihundert Meter aufragenden Steilabbrüche. An ihrem Eingang überspannt
      eine zweibogige Steinbrücke den Venetikos und verband die Dörfer Spilaio und Monachiti. In der Region
      Grevena in Westmakedonien gelegen, verschmelzen hier Natur und Baukunst zu einer Einheit.
    landscape: >-
      Der Venetikos, ein Zufluss des Haliakmon, nimmt die gesamte Breite der Klamm ein, weshalb sie zu Fuß nur
      im Flussbett passierbar ist. An der Brücke ragen steile Kalkfelsen auf.


      Die Steinbrücken entstanden in osmanischer Zeit entlang des smaragdgrünen Venetikos, des Haliakmon und
      benachbarter Gebirgsbäche. Errichtet wurden sie von Baumeistern aus den Handwerkerdörfern von Grevena,
      Kozani, Kastoria und Ioannina. Flutöffnungen im Mauerwerk und dreieckige Wellenbrecher leiten Hochwasser
      ab, ohne die Standfestigkeit zu gefährden. Die Brücke von Portitsa misst vierunddreißig Meter Länge und
      besitzt zwei Bögen: Der größere, leicht zugespitzte Bogen bildet eine Ausnahme inmitten sonst
      rundbogiger Bauwerke.
    wildlife: >-
      Der smaragdgrüne Gebirgsfluss ist das beherrschende Element. An mehreren Brücken der Gegend hing einst
      eine Bronzeglocke unter dem Scheitel des Hauptbogens, um Reisende vor starkem Wind oder anschwellendem
      Fluss zu warnen.


      Die Brücke wird von dichtem Ufergehölz gesäumt, und ein alter gepflasterter Saumpfad zieht hinauf nach
      Spilaio.
    visit: >-
      Von der Brücke führt ein historischer Pflasterweg zum Bergdorf Spilaio, ein lohnender Aufstieg. Die
      Überquerung eröffnet Blicke auf den Fluss und den Schluchteingang; wer die Klamm selbst erkunden möchte,
      muss durch den Venetikos waten.
    history: >-
      Die Steinbrücken von Grevena wurden zwischen dem späten siebzehnten und dem ausgehenden neunzehnten
      Jahrhundert errichtet, als der Karawanenhandel zu den Sommermärkten in Mavronoros florierte. Zudem
      dienten sie den Hirten bei der Transhumanz zwischen Pindos und thessalischer Ebene.


      Die Portitsa-Brücke wurde in den dreißiger Jahren restauriert. Mündliche Überlieferungen datieren sie
      auf 1830 bis 1850, finanziert vom Marienkloster in Spilaio; andere Quellen verweisen auf das Jahr 1743
      unter gleicher Trägerschaft. Sie misst vierunddreißig Meter Länge, fast 2,70 Meter Breite und ruht auf
      einem Hauptbogen sowie einem Nebenbogen von fünf Metern Spannweite.
    before: >-
      Um in die Schlucht zu gelangen, musst du durch das Flussbett waten: Stelle dich darauf ein, nass zu
      werden.
    around: >-
      Im Atlas hat die Schlucht keine direkten Nachbarn. Weit entfernt weisen der
      [Acheron-Fluss](/lugar/acheron-river-wild-upper-gorge/), das [Naturreservat
      Sagittario-Schlucht](/lugar/gole-del-sagittario/), das [Naturdenkmal Felsbrücken der
      Rhodopen](/lugar/chudnite-mostove/) und die [Doubs-Schlucht](/lugar/gorges-du-doubs---franco-suisses/)
      verwandte Karstflusslandschaften auf.
  it:
    intro: >-
      Due pareti calcaree che quasi si sfiorano e un fiume che occupa per intero il fondo della gola. Così
      appare il defileo di Portitsa, ribattezzato dagli abitanti Symplegadi—le «rocce che cozzano»—per via
      delle pareti verticali alte duecento metri. All'ingresso, un ponte in pietra a due arcate varca il fiume
      Venetikos unendo i borghi di Spilaio e Monachiti. Situato nella regione di Grevena, nella Macedonia
      Occidentale, è uno scenario in cui l'architettura storica e l'orografia si fondono.
    landscape: >-
      Il Venetikos, tributario dell'Aliacmone, riempie l'intera ampiezza della forra, rendendola impraticabile
      se non risalendo il letto nell'acqua. Attorno al ponte il terreno s'impenna in balze scoscese.


      I ponti in pietra sorsero in epoca ottomana lungo il corso color smeraldo del Venetikos, dell'Aliacmone
      e dei loro affluenti. Li edificarono maestri mastri provenienti dai villaggi d'arte di Grevena, Kozani,
      Kastoria e Giannina. Dotati di finestrelle di scarico nei timpani e rostri frangiflutti triangolari,
      assecondano le piene senza cedere. Il manufatto di Portitsa misura trentaquattro metri e presenta due
      arcate: la maggiore, ad arco leggermente acuto, costituisce un unicum in un'area dominata da arcate a
      tutto sesto.
    wildlife: >-
      L'elemento centrale è il fiume dalle acque smeraldine e la sua reazione alle piogge torrentizie. In
      alcuni ponti della zona si appendeva una campana di bronzo sotto la chiave di volta dell'arco principale
      per avvertire del pericolo in caso di forti venti o piene improvvise.


      Il ponte è immerso in una ricca vegetazione riparia, e da esso si diparte la mulattiera lastricata che
      risale a Spilaio.
    visit: >-
      Dal ponte parte un'antica mulattiera selciata che sale al borgo di Spilaio, escursione assai panoramica.
      Varcare il ponte permette di dominare l'imbocco della forra; per addentrarsi tra le pareti occorre
      risalire direttamente le acque del Venetikos.
    history: >-
      I ponti in pietra di Grevena furono costruiti tra la fine del XVII secolo e la fine del XIX, nell'epoca
      d'oro delle fiere commerciali regionali, su tutte quella estiva di Mavronoros. Servivano inoltre ai
      pastori transumanti che guidavano le greggi tra i pascoli del Pindo e le pianure della Tessaglia.


      Il ponte di Portitsa fu restaurato negli anni Trenta. Le memorie orali ne collocano la costruzione tra
      il 1830 e il 1850 a spese del monastero della Dormizione di Spilaio; altre fonti ne retrodatano
      l'origine al 1743 con il medesimo mecenatismo monastico. Misura trentaquattro metri di lunghezza per
      quasi 2,70 di larghezza, retto da un arco maggiore e da un arco minore di cinque metri.
    before: >-
      Per risalire la gola bisogna camminare nel torrente e il Venetikos può ingrossarsi: affronta il percorso
      pronto a bagnarti.
    around: >-
      Nell'atlas la gola non ha vicini immediati. Da lontano richiamano scenari affini la [Gola del Fiume
      Acheronte](/lugar/acheron-river-wild-upper-gorge/), la [Riserva Naturale Gole del
      Sagittario](/lugar/gole-del-sagittario/), il [Monumento Naturale dei Ponti Meravigliosi nei
      Rodopi](/lugar/chudnite-mostove/) e le [Gole del Fiume Doubs](/lugar/gorges-du-doubs---franco-suisses/).
  pt:
    intro: >-
      Duas falésias de pedra que quase se tocam e um rio caudaloso que preenche todo o leito. Assim se
      apresenta a garganta de Portitsa, que os locais apelidam de Simplégades—as «rochas que colidem»—devido
      às escarpas verticais de duzentos metros. À sua entrada, uma ponte de pedra de dois arcos transpõe o rio
      Venetikos ligando as aldeias serranas de Spilaio e Monachiti. Fica na região de Grevena, na Macedónia
      Ocidental, constituindo um recanto onde a geologia e a engenharia tradicional se completam.
    landscape: >-
      O Venetikos, afluente do Haliácmon, toma toda a largura do fundo do desfiladeiro, razão pela qual este é
      intransitável a pé a não ser caminhando pela água. Junto à ponte erguem-se escarpas alcantiladas.


      As pontes de pedra foram erigidas durante o período otomano ao longo das águas verde-esmeralda do
      Venetikos, do Haliácmon e dos seus tributários. Foram lavradas por mestres pedreiros das célebres
      aldeias de artesãos de Grevena, Kozani, Kastoria e Ioannina. Apresentam aberturas nos pilares e
      talha-mares triangulares para desviar as cheias sem abalar a estrutura. A de Portitsa mede trinta e
      quatro metros de comprimento com dois arcos: o maior, ligeiramente ogival, é exceção numa região de
      arcos de volta perfeita.
    wildlife: >-
      O elemento fulcral é o rio de águas esmeralda e a força das suas cheias sazonais. Nalgumas pontes da
      região colocava-se um sino de cobre sob o arco central para avisar os viandantes do perigo de travessia
      quando soprava o vento ou subiam as águas.


      A ponte surge enquadrada por plátanos ribeirinhos e águas correntes, partindo dela a calçada pedregosa
      que sobe a Spilaio.
    visit: >-
      A partir da ponte tem início uma antiga calçada de montanha que alcança a povoação de Spilaio,
      proporcionando um passeio de grande beleza. Cruzar a ponte oferece vistas para o rio e para a imponente
      entrada da garganta; para percorrer o desfiladeiro é indispensável caminhar pelo leito do Venetikos.
    history: >-
      As pontes de pedra de Grevena foram erguidas entre os finais do século XVII e os finais do XIX, servindo
      as caravanas de mercadores que demandavam as grandes feiras regionais, em especial a de Mavronoros no
      verão. Atendiam também os pastores que conduziam rebanhos entre as pastagens do Pindo e as planícies da
      Tessália.


      A ponte de Portitsa foi intervencionada na década de trinta. Testemunhos orais apontam a sua feitura
      para o período entre 1830 e 1850 custeada pelo mosteiro da Dormição da Virgem em Spilaio; outra datação
      remete para 1743, associando o mesmo financiamento monástico. Mede trinta e quatro metros de extensão,
      quase 2,70 metros de largura, apoiando-se num arco maior e num arco menor com cinco metros.
    before: >-
      Para entrar no desfiladeiro terás de caminhar pelo rio, e o Venetikos pode subir de nível: vai prevenido
      para te molhares.
    around: >-
      No atlas a garganta não possui vizinhos contíguos. A maior distância encontram-se gargantas e rios afins
      como o [Rio Aqueronte](/lugar/acheron-river-wild-upper-gorge/), a [Reserva Natural da Garganta do
      Sagittario](/lugar/gole-del-sagittario/), o [Monumento Natural das Pontes Maravilhosas dos
      Ródope](/lugar/chudnite-mostove/) e as [Gargantas do Rio
      Doubs](/lugar/gorges-du-doubs---franco-suisses/).
