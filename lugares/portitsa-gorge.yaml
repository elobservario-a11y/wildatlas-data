resumen:
  es: >-
    Estrecha puerta caliza de 200 m de altura donde se enmarca el puente histórico de piedra del siglo XVIII
    sobre el río Venetikos.
  en: >-
    Narrow 200 m high limestone gate framing an eighteenth-century historic stone bridge across the Venetikos
    River.
  fr: >-
    Étroite porte calcaire de 200 m de haut encadrant un pont de pierre historique du XVIIIe siècle sur la
    rivière Venétikos.
  de: >-
    Enge 200 m hohe Kalksteinschlucht, die eine historische Steinbrücke des achtzehnten Jahrhunderts über den
    Fluss Venetikos einrahmt.
  it: >-
    Stretta porta calcarea alta 200 m che incornicia il ponte storico in pietra del XVIII secolo sul fiume
    Venetikos.
  pt: >-
    Estreita garganta calcária de 200 m de altura emoldurando a histórica ponte de pedra do século XVIII sobre
    o rio Venetikos.
