    La cueva con mayor biodiversidad subterránea del mundo (Vjetrenica, Patrimonio Mundial UNESCO en 2024) y
    uno de los mayores poljés inundables de los Balcanes.
  en: >-
    The cave with the highest subterranean biodiversity in the world (Vjetrenica, UNESCO World Heritage in
    2024) and one of the largest floodable poljes in the Balkans.
  fr: >-
    La grotte à la plus grande biodiversité souterraine au monde (Vjetrenica, patrimoine mondial de l'UNESCO
    en 2024) et l'un des plus vastes poljés inondables des Balkans.
  de: >-
    Die Höhle mit der größten unterirdischen Artenvielfalt der Welt (Vjetrenica, UNESCO-Welterbe seit 2024)
    und eines der größten überschwemmbaren Poljen des Balkans.
  it: >-
    La grotta con la maggiore biodiversità sotterranea al mondo (Vjetrenica, patrimonio mondiale UNESCO nel
    2024) e uno dei più grandi polje inondabili dei Balcani.
  pt: >-
    A gruta com a maior biodiversidade subterrânea do mundo (Vjetrenica, Património Mundial da UNESCO em 2024)
    e um dos maiores poljes inundáveis dos Balcãs.
unico:
  es: >-
    Una cueva con 93 especies que solo viven bajo tierra, el único gusano tubícola subterráneo del mundo y un
    viento que cambia de sentido con las estaciones.
  en: >-
    A cave with 93 species that live exclusively underground, the world's only subterranean tube worm, and a
    wind that reverses direction with the seasons.
  fr: >-
    Une grotte abritant 93 espèces vivant exclusivement sous terre, le seul ver tubicole souterrain au monde
    et un vent qui inverse son sens au fil des saisons.
  de: >-
    Eine Höhle mit 93 ausschließlich unterirdisch lebenden Arten, dem weltweit einzigen unterirdischen
    Röhrenwurm und einem Wind, der mit den Jahreszeiten die Richtung wechselt.
  it: >-
    Una grotta con 93 specie che vivono esclusivamente sottoterra, l'unico verme tubicolo sotterraneo al mondo
    e un vento che inverte la rotta con le stagioni.
  pt: >-
    Uma gruta com 93 espécies que vivem exclusivamente no subsolo, o único verme tubícola subterrâneo do mundo
    e um vento que inverte o sentido com as estações.
observaciones:
  es: >-
    Lleva pantalón largo y calzado robusto, nada de chancletas ni zapatos que resbalen. Quédate cerca del guía
    y no abandones el grupo. No dejes basura ni saques objetos de la cueva: es un ecosistema protegido de gran
    valor. No se recomienda la visita a niños menores de 4 años, a personas con claustrofobia ni a quienes
    tengan dificultades para moverse. La excursión en bici no se recomienda a menores de 10 años.
texto:
  es:
    intro: >-
      En pleno verano, en un terreno de roca desnuda, caluroso y sin agua, sale de la tierra un soplo de aire
      frío. Es la entrada de Vjetrenica, la «cueva del viento», en el extremo sur de Bosnia y Herzegovina. Se
      abre en el borde del poljé de Popovo, a 260 metros de altitud, a solo 12 km en línea recta del
      Adriático, y es la cueva más rica del mundo en biodiversidad subterránea: casi 230 especies registradas,
      37 de ellas descritas aquí por primera vez. Desde 2024 es Patrimonio Mundial de la UNESCO.
    landscape: >-
      El poljé de Popovo es uno de los grandes poljés del mundo, sobre todo por el Trebišnjica, el mayor río
      sumidero del planeta. El valle está lleno de sumideros, y el clima es mediterráneo, con veranos
      calurosos y secos. Antes de las obras hidráulicas, entre octubre y junio llegaban al poljé enormes
      cantidades de agua; hoy las centrales y el cauce de hormigón del Trebišnjica permiten regular el caudal,
      drenar el exceso en invierno y regar en verano.


      Debajo de ese suelo, la roca es casi pura calcita: las calizas del Popovo polje tienen hasta un 99,98
      por ciento, lo que las hace muy solubles. Por eso hay una cueva así. Vjetrenica forma parte del sistema
      fluvial del Trebišnjica y se han explorado 7.014 metros de canales kársticos, con cuatro cursos de agua
      y más de diez corrientes periódicas menores con lagos subterráneos. La temperatura es constante, de unos
      11,6 °C.


      El viento tiene explicación. Por encima de la cueva hay grietas profundas por las que en verano entra
      aire caliente, se enfría y sale por la boca; en invierno, cuando el exterior es más frío que el
      interior, la corriente invierte el sentido. El nombre viene de ahí.
    wildlife: >-
      La fauna es el gran argumento. Se han registrado casi 230 especies: 180 de animales, 14 de hongos y 35
      de protistas, de las cuales 93 son troglobias. Vjetrenica es el hogar del único gusano tubícola
      subterráneo del mundo, Marifugia cavatica, y del único hidrozoo de agua dulce que vive exclusivamente en
      aguas subterráneas, Velkovrhia enigmatica. Hay nueve especies de anfípodos subterráneos del género
      Niphargus, quizá la mayor diversidad subterránea de un solo género. Varias especies son relictas del
      Terciario o anteriores, y se consideran fósiles vivientes. El [proteo](/especie/proteus_anguinus/)
      figura entre las especies de la ficha.


      La cueva se visita casi todo el año, con horarios distintos de marzo a mayo, de junio a agosto, en
      septiembre, de octubre a noviembre y de diciembre a febrero. La temporada ideal va de mayo a octubre.
    visit: >-
      La visita guiada recorre la parte acondicionada, de 1.050 metros electrificados, y dura de 40 a 60
      minutos. Pasas por el «Cementerio turco», un grupo de estalagmitas sobre arcilla que recuerdan lápidas
      musulmanas, y el tramo turístico termina en la Hajdučki stol, una mesa y asientos de piedra hechos por
      el hombre. Más allá, en el sifón, la bóveda baja a 120 cm; en invierno la cueva se inunda por completo
      allí y no se puede seguir. En el Gran Lago, de 180 metros, está la mayor superficie de agua de la cueva.


      Con aviso previo, hasta el día anterior, se pueden adaptar las condiciones de la visita. La entrada
      incluye el Museo Bioespeleológico. Y hay otra manera de recorrer el poljé: la excursión en bici sigue la
      vía estrecha del Ćiro y caminos de Popovo Polje con un guía local, y exige reservar con un día de
      antelación.
    history: >-
      La presencia humana en la cueva empieza hace unos 8000 años, y hay un dibujo de hace doce mil años antes
      de Cristo. En 1582 Jakov Sorkočević escribió que los vecinos decían que allí vivían ninfas, las vile, y
      que de noche organizaban sus bailes. El espeleólogo checo Karel Absolon hizo los mayores descubrimientos
      entre 1912 y 1914, y Mihajlo Radovanović la describió científicamente en 1929. En un canal bajo se halló
      un esqueleto completo de leopardo.


      Desde 1952 la cueva es monumento natural protegido, y desde 1965 pertenece a la categoría de reservas
      geológicas especiales. En 2024, el Comité del Patrimonio Mundial la inscribió en su 46.ª sesión. El
      pueblo de Zavala, con su arquitectura de piedra, forma junto a la cueva un conjunto natural y
      arquitectónico en proceso de protección como monumento nacional; su monasterio se menciona por primera
      vez en el siglo XVI.
    before: >-
      Lleva pantalón largo y calzado robusto, nada de chancletas ni zapatos que resbalen. Quédate cerca del
      guía y no abandones el grupo. No dejes basura ni saques objetos de la cueva: es un ecosistema protegido
      de gran valor. No se recomienda la visita a niños menores de 4 años, a personas con claustrofobia ni a
      quienes tengan dificultades para moverse. La excursión en bici no se recomienda a menores de 10 años.
    around: >-
      Lejos de aquí, la [Karst Clásico y Sistema Subterráneo
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/) comparte con Vjetrenica el karst, los
      humedales y el proteo.
  en:
    intro: >-
      In midsummer, across a barren limestone landscape, scorching and arid, an icy breath of air streams from
      the ground. This is the mouth of Vjetrenica, the 'wind cave', in the southernmost reaches of Bosnia and
      Herzegovina. Opening at the edge of Popovo Polje at 260 metres altitude, a mere 12 km as the crow flies
      from the Adriatic, it is the world's richest cave in subterranean biodiversity: nearly 230 recorded
      species, 37 of which were described here for the very first time. In 2024 it was inscribed as a UNESCO
      World Heritage site.
    landscape: >-
      Popovo Polje ranks among the grandest poljes on Earth, predominantly shaped by the Trebišnjica, the
      longest sinking river on the planet. The valley is riddled with ponors, and the climate is
      Mediterranean, marked by hot, dry summers. Before hydraulic engineering, colossal volumes of water
      inundated the polje between October and June; today power stations and the Trebišnjica's concrete
      channel regulate discharge, draining excess waters in winter and irrigating fields in summer.


      Beneath this floor, the rock consists of near-pure calcite: the limestones of Popovo Polje reach up to
      99.98 percent, rendering them exceptionally soluble. Hence such an elaborate cave came to be. Vjetrenica
      forms an integral part of the Trebišnjica river system, with 7,014 metres of karstic channels surveyed,
      featuring four subterranean watercourses and over ten minor intermittent streams feeding subterranean
      lakes. The internal temperature remains constant at around 11.6 °C.


      The wind has a clear physical explanation. Deep fractures penetrate above the cave through which warm
      air is drawn in summer, cooling as it sinks and blasting outward through the entrance; in winter, when
      outside temperatures plunge below those within, the airflow reverses direction. The name stems directly
      from this draught.
    wildlife: >-
      Its fauna forms the headline attraction. Nearly 230 species have been documented: 180 animals, 14 fungi,
      and 35 protists, of which 93 are obligate troglobites. Vjetrenica is the exclusive home of the world's
      only subterranean tube worm, Marifugia cavatica, and the sole freshwater hydrozoan inhabiting
      subterranean waters exclusively, Velkovrhia enigmatica. Nine species of subterranean amphipods belonging
      to the genus Niphargus occur here, possibly representing the highest subterranean diversity of any
      single genus. Several taxa are relicts from the Tertiary or earlier, regarded as living fossils. The
      [olm](/especie/proteus_anguinus/) figures among the featured species.


      The cave can be visited almost year-round, operating on seasonal timetables from March to May, June to
      August, during September, October to November, and December to February. The ideal season spans May to
      October.
    visit: >-
      The guided tour covers the developed section, consisting of 1,050 electrified metres, and lasts 40 to 60
      minutes. You pass the 'Turkish Cemetery', a cluster of stalagmites resting on clay reminiscent of Muslim
      tombstones, and the tourist trail concludes at Hajdučki stol, a man-made stone table and seats. Beyond,
      at the siphon, the ceiling drops to 120 cm; in winter the cave floods completely here, barring further
      progress. At the Great Lake, stretching 180 metres, lies the cave's largest expanse of open water.


      With advance notice up to the day before, visiting arrangements can be tailored. Admission includes
      access to the Biospeleological Museum. There is another enticing way to experience the polje: cycling
      tours follow the narrow-gauge Ćiro railway line and country tracks across Popovo Polje alongside a local
      guide, requiring reservation one day in advance.
    history: >-
      Human presence in the cave dates back some 8000 years, with an engraved drawing originating twelve
      thousand years before Christ. In 1582 Jakov Sorkočević noted that local inhabitants believed nymphs, the
      vile, dwelled within and held midnight dances there. Czech speleologist Karel Absolon made the most
      groundbreaking discoveries between 1912 and 1914, while Mihajlo Radovanović published its scientific
      description in 1929. In a lower gallery, a complete leopard skeleton was uncovered.


      Since 1952 the cave has been protected as a natural monument, and in 1965 it was designated a special
      geological reserve. In 2024, the World Heritage Committee inscribed it during its 46th session. The
      village of Zavala, with its stone vernacular architecture, forms alongside the cave a natural and
      architectural ensemble currently undergoing designation as a national monument; its monastery is first
      referenced in historical records in the sixteenth century.
    before: >-
      Wear long trousers and sturdy footwear, avoiding flip-flops or slippery soles. Stay close to the guide
      and never wander away from the group. Do not discard rubbish or remove any objects from the cave: it is
      a highly delicate protected ecosystem. The visit is not recommended for children under 4 years of age,
      individuals with claustrophobia, or anyone with limited mobility. The cycling excursion is discouraged
      for children under 10 years old.
    around: >-
      Far from here, the [Classical Karst and Postojna-Planina Cave
      System](/lugar/postonjska-jama---planinsko-polje/) shares with Vjetrenica the karst, wetlands, and the
      olm.
  fr:
    intro: >-
      En plein été, sur un plateau de roche nue, brûlant et privé d'eau, un souffle d'air glacé jaillit des
      entrailles de la terre. C'est l'entrée de Vjetrenica, la « grotte du vent », à l'extrémité méridionale
      de la Bosnie-Herzégovine. S'ouvrant en bordure du poljé de Popovo à 260 mètres d'altitude, à seulement
      12 km à vol d'oiseau de l'Adriatique, elle constitue la grotte la plus riche du globe en biodiversité
      souterraine : près de 230 espèces répertoriées, dont 37 décrites ici pour la toute première fois. Depuis
      2024, elle est inscrite au patrimoine mondial de l'UNESCO.
    landscape: >-
      Le poljé de Popovo figure parmi les plus remarquables poljés du monde, sculpté en particulier par la
      Trebišnjica, la plus longue rivière souterraine perdue de la planète. La vallée est criblée
      d'engouffroirs et le climat est méditerranéen, avec des étés torrides et arides. Avant les aménagements
      hydrauliques, d'immenses masses d'eau submergeaient le poljé entre octobre et juin ; de nos jours, les
      centrales et le chenal bétonné de la Trebišnjica régulent les débits, évacuant le trop-plein en hiver et
      irriguant les cultures en été.


      Sous ce sol, la roche est de la calcite quasi pure : les calcaires du Popovo polje atteignent jusqu'à
      99,98 pour cent de pureté, ce qui les rend extraordinairement solubles. C'est l'origine d'un tel dédale
      souterrain. Vjetrenica fait partie intégrante du réseau hydrographique de la Trebišnjica et 7 014 mètres
      de conduits karstiques ont été explorés, comportant quatre cours d'eau pérennes et plus de dix
      écoulements intermittents secondaires alimentant des lacs sous terre. La température y reste immuable,
      voisine de 11,6 °C.


      Le vent a une explication naturelle limpide. Des failles profondes surplombent la cavité, par lesquelles
      s'engouffre en été un air chaud qui se refroidit avant de ressortir sous pression par la gueule de la
      grotte ; en hiver, lorsque l'extérieur devient plus froid que le milieu souterrain, le courant
      s'inverse. C'est de là que découle son nom.
    wildlife: >-
      La faune constitue l'argument suprême des lieux. Près de 230 espèces y sont recensées : 180 animales, 14
      fongiques et 35 protistes, parmi lesquelles 93 sont strictement troglobies. Vjetrenica est le sanctuaire
      de l'unique ver tubicole souterrain de la planète, Marifugia cavatica, et du seul hydrozoaire d'eau
      douce vivant exclusivement dans les nappes souterraines, Velkovrhia enigmatica. Neuf espèces
      d'amphipodes souterrains du genre Niphargus y cohabitent, ce qui représente peut-être la plus grande
      diversité souterraine pour un seul et même genre. Plusieurs espèces sont des relictes du Tertiaire ou
      d'époques antérieures, considérées comme de véritables fossiles vivants. Le [protée
      anguillard](/especie/proteus_anguinus/) figure parmi les espèces phares de la fiche.


      La grotte se visite presque toute l'année, selon des horaires modulés de mars à mai, de juin à août, en
      septembre, d'octobre à novembre et de décembre à février. La saison optimale court de mai à octobre.
    visit: >-
      La visite guidée parcourt la section aménagée, comprenant 1 050 mètres électrifiés, et dure de 40 à 60
      minutes. Vous passez devant le « cimetière turc », un groupe de stalagmites fichées sur l'argile
      évoquant des stèles funéraires musulmanes, et le parcours aménagé s'achève à la Hajdučki stol, une table
      et des bancs de pierre taillés par l'homme. Plus loin, au siphon, la voûte s'abaisse à 120 cm ; en hiver
      la grotte s'y inonde totalement et barre le passage. Au Grand Lac, long de 180 mètres, s'étend le plus
      vaste plan d'eau de la cavité.


      Sur préavis jusqu'à la veille, les conditions de visite peuvent être adaptées. Le billet donne également
      accès au musée biospéléologique. Il existe une autre façon de sillonner le poljé : l'excursion à vélo
      emprunte l'ancienne voie étroite du train Ćiro et les chemins du Popovo Polje avec un guide local,
      nécessitant une réservation un jour à l'avance.
    history: >-
      La présence humaine dans la cavité remonte à près de 8000 ans, un dessin rupestre datant même de douze
      mille ans avant Jésus-Christ. En 1582, Jakov Sorkočević rapportait que les habitants des environs
      croyaient que des nymphes, les vile, y vivaient et y dansaient chaque nuit. Le spéléologue tchèque Karel
      Absolon réalisa les découvertes majeures entre 1912 et 1914, tandis que Mihajlo Radovanović en livra la
      description scientifique en 1929. Dans une galerie inférieure, un squelette entier de léopard a été mis
      au jour.


      Depuis 1952, la grotte bénéficie du statut de monument naturel protégé, et depuis 1965 de celui de
      réserve géologique spéciale. En 2024, le Comité du patrimoine mondial l'a inscrite lors de sa 46e
      session. Le village de Zavala et son architecture de pierre composent avec la grotte un ensemble
      paysager et bâti en cours de classement comme monument national ; son monastère apparaît pour la
      première fois dans les archives au XVIe siècle.
    before: >-
      Portez un pantalon long et des chaussures de marche robustes, en proscrivant claquettes et semelles
      lisses. Restez près du guide et ne quittez jamais le groupe. N'abandonnez aucun déchet et ne prélevez
      rien dans la cavité : c'est un écosystème protégé d'une fragilité extrême. La visite est déconseillée
      aux enfants de moins de 4 ans, aux personnes claustrophobes ou ayant des difficultés de déplacement.
      L'excursion à vélo n'est pas recommandée aux moins de 10 ans.
    around: >-
      Loin d'ici, le [Karst classique et système souterrain de
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/) partage avec Vjetrenica le milieu
      karstique, les zones humides et le protée anguillard.
  de:
    intro: >-
      Mitten im Hochsommer, in einer kahlen Felslandschaft, sengend heiß und ohne Wasser, weht ein eisiger
      Atemzug aus dem Boden. Es ist der Eingang der Vjetrenica, der «Windhöhle», im äußersten Süden von
      Bosnien und Herzegowina. Sie öffnet sich am Rand des Popovo Polje auf 260 Metern Höhe, nur 12 km
      Luftlinie von der Adria entfernt, und ist die höhlenreichste Stätte unterirdischer Artenvielfalt
      weltweit: Nahezu 230 Arten wurden hier erfasst, 37 davon an diesem Ort erstmals wissenschaftlich
      beschrieben. Seit 2024 zählt sie zum UNESCO-Welterbe.
    landscape: >-
      Das Popovo Polje zählt zu den größten Poljen der Erde, geprägt vor allem von der Trebišnjica, dem
      längsten Versickerungsfluss unseres Planeten. Die Talsenke ist übersät mit Ponoren, und das Klima ist
      mediterran mit heißen, trockenen Sommern. Vor den wasserbaulichen Eingriffen strömten zwischen Oktober
      und Juni gewaltige Wassermassen ins Polje; heute erlauben Kraftwerke und das betonierte Flussbett der
      Trebišnjica eine Regulierung, leiten Hochwasser im Winter ab und bewässern die Felder im Sommer.


      Unter dieser Senke besteht das Gestein aus nahezu reinem Calcit: Die Kalksteine des Popovo Polje
      erreichen bis zu 99,98 Prozent Reinheit, was sie extrem löslich macht. Genau das ermöglichte eine Höhle
      von solchem Ausmaß. Vjetrenica ist Teil des Flusssystems der Trebišnjica; bislang wurden 7.014 Meter
      Karstgänge erforscht, mit vier Wasserläufen und mehr als zehn periodischen Nebenläufen, die
      unterirdische Seen speisen. Die Höhlentemperatur ist ganzjährig konstant und liegt bei etwa 11,6 °C.


      Der Wind lässt sich physikalisch erklären. Oberhalb der Höhle verlaufen tiefe Felsspalten, durch die im
      Sommer Warmluft eingesaugt wird, abkühlt und mit Macht am Höhleneingang ausströmt; im Winter, wenn es
      draußen kälter ist als drinnen, kehrt sich die Luftströmung um. Diesem Phänomen verdankt die Höhle ihren
      Namen.
    wildlife: >-
      Die Tierwelt ist der herausragende Schatz dieses Ortes. Nahezu 230 Arten wurden nachgewiesen: 180 Tiere,
      14 Pilze und 35 Protisten, von denen 93 echte Troglobionten sind. Vjetrenica beherbergt den weltweit
      einzigen unterirdischen Röhrenwurm, Marifugia cavatica, und das einzige Süßwasser-Hydrozoon, das
      ausschließlich in Grundwässern vorkommt, Velkovrhia enigmatica. Neun Arten unterirdischer Flohkrebse der
      Gattung Niphargus leben hier zusammen – womöglich die größte unterirdische Vielfalt einer einzelnen
      Gattung überhaupt. Zahlreiche Arten sind Relikte des Tertiärs oder noch älterer Epochen und gelten als
      lebende Fossilien. Der [Grottenolm](/especie/proteus_anguinus/) gehört zu den bemerkenswertesten Arten
      des Gebietes.


      Die Höhle ist fast das ganze Jahr über zugänglich, mit angepassten Öffnungszeiten von März bis Mai, Juni
      bis August, im September, von Oktober bis November sowie von Dezember bis Februar. Die beste Besuchszeit
      liegt zwischen Mai und Oktober.
    visit: >-
      Die Führung verläuft über den erschlossenen Abschnitt von 1.050 beleuchteten Metern und dauert 40 bis 60
      Minuten. Du passierst den «türkischen Friedhof», eine Gruppe von Tropfsteinen auf Tonböden, die an
      muslimische Grabstelen erinnert; der Schauteil endet am Hajdučki stol, einer von Menschenhand
      errichteten Steintafel samt Sitzgelegenheiten. Weiter hinten am Siphon senkt sich die Decke auf 120 cm;
      im Winter steht die Höhle dort vollständig unter Wasser und versperrt jedes Weiterkommen. Im Großen See
      breitet sich über 180 Meter die größte Wasserfläche des Höhlensystems aus.


      Bei Voranmeldung bis zum Vortag lassen sich die Besuchsmodalitäten anpassen. Der Eintritt umfasst das
      Biospeläologische Museum. Das Polje lässt sich zudem auf andere Weise erkunden: Eine geführte Radtour
      folgt der Trasse der historischen Schmalspurbahn Ćiro und Pfaden durch das Popovo Polje mit einem
      einheimischen Führer; sie erfordert eine Reservierung einen Tag im Voraus.
    history: >-
      Menschliche Spuren in der Höhle reichen rund 8000 Jahre zurück, und eine Felszeichnung datiert auf
      zwölftausend Jahre vor Christus. Im Jahr 1582 berichtete Jakov Sorkočević, die Einheimischen erzählten
      von Nymphen, den Vile, die dort hausten und nachts ihre Reigen tanzten. Der tschechische Speläologe
      Karel Absolon machte zwischen 1912 und 1914 die bedeutendsten Entdeckungen, und Mihajlo Radovanović
      beschrieb die Höhle 1929 erstmals wissenschaftlich. In einem tiefen Gang wurde ein vollständiges
      Leopardenskelett freigelegt.


      Seit 1952 steht die Höhle als Naturdenkmal unter Schutz und gehört seit 1965 zur Kategorie der
      besonderen geologischen Reservate. Im Jahr 2024 nahm das Welterbekomitee sie auf seiner 46. Sitzung in
      die Welterbeliste auf. Das Steindorf Zavala bildet zusammen mit der Höhle ein herausragendes Natur- und
      Bauensemble im Verfahren zur Anerkennung als Nationaldenkmal; sein Kloster wird im sechzehnten
      Jahrhundert erstmals urkundlich erwähnt.
    before: >-
      Trage lange Hosen und feste Schuhe, keinesfalls Flip-Flops oder rutschige Sohlen. Bleibe stets nah beim
      Höhlenführer und verlasse niemals die Gruppe. Hinterlasse keinen Müll und nimm nichts aus der Höhle mit:
      Es handelt sich um ein streng geschütztes, hochsensibles Ökosystem. Der Besuch wird für Kinder unter 4
      Jahren, Personen mit Klaustrophobie sowie Gehbehinderte nicht empfohlen. Die Radtour ist für Kinder
      unter 10 Jahren nicht geeignet.
    around: >-
      Weit von hier teilt das [Klassischer Karst und Höhlensystem
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/) mit der Vjetrenica den Karstcharakter, die
      Feuchtgebiete und den Grottenolm.
  it:
    intro: >-
      In pieno luglio, su un terreno di roccia nuda, torrido e senz'acqua, si sprigiona dalla terra un alito
      di aria fredda. È l'imbocco di Vjetrenica, la «grotta del vento», all'estremo meridione della Bosnia ed
      Erzegovina. Si apre sul margine del polje di Popovo a 260 metri di quota, a soli 12 km in linea d'aria
      dall'Adriatico, ed è la cavità più ricca del pianeta per biodiversità ipogea: quasi 230 specie censite,
      37 delle quali descritte qui per la prima volta. Dal 2024 è patrimonio mondiale dell'UNESCO.
    landscape: >-
      Il polje di Popovo è uno dei più grandiosi polje del pianeta, plasmato anzitutto dalla Trebišnjica, il
      più lungo fiume inghiottitoio della Terra. La vallata è punteggiata di inghiottitoi e il clima è
      mediterraneo, con estati torride e secche. Prima delle imponenti opere idrauliche, tra ottobre e giugno
      confluivano nel polje enormi masse d'acqua; oggi le centrali e l'alveo cementato della Trebišnjica
      consentono di regolarne la portata, drenando gli eccessi invernali e irrigando d'estate.


      Sotto questo piano, la roccia è calcite quasi pura: i calcari del Popovo polje raggiungono fino al 99,98
      per cento di purezza, il che li rende oltremodo solubili. Da qui l'esistenza di un simile complesso.
      Vjetrenica è parte integrante del bacino della Trebišnjica e conta 7.014 metri di condotti carsici
      esplorati, con quattro corsi d'acqua principali e oltre dieci flussi periodici secondari che alimentano
      laghetti ipogei. La temperatura è perenne, sui circa 11,6 °C.


      Il vento trova una limpida spiegazione scientifica. Sopra la cavità si aprono profonde fenditure
      attraverso cui in estate entra aria calda, che raffreddandosi precipita e fuoriesce impetuosa
      dall'imbocco; d'inverno, allorché l'esterno è più freddo dell'ambiente sotterraneo, la corrente inverte
      direzione. Da tale fenomeno trae origine il suo nome.
    wildlife: >-
      La fauna costituisce la perla ineguagliabile del luogo. Sono state censite quasi 230 specie: 180
      animali, 14 funghi e 35 protisti, delle quali ben 93 sono troglobie obbligate. Vjetrenica è l'habitat
      dell'unico verme tubicolo sotterraneo del pianeta, Marifugia cavatica, e dell'unico idrozoo d'acqua
      dolce che dimora unicamente in acque ipogee, Velkovrhia enigmatica. Vi convivono nove specie di anfipodi
      sotterranei del genere Niphargus, forse la più alta diversità ipogea per un singolo genere. Diverse
      specie sono relitti del Terziario o di ere precedenti, considerati autentici fossili viventi. Il
      [proteo](/especie/proteus_anguinus/) figura tra le specie di spicco della scheda.


      La grotta è visitabile quasi tutto l'anno, con orari differenziati da marzo a maggio, da giugno ad
      agosto, in settembre, da ottobre a novembre e da dicembre a febbraio. La stagione ottimale va da maggio
      a ottobre.
    visit: >-
      La visita guidata si snoda lungo il tratto attrezzato, composto da 1.050 metri elettrificati, e dura da
      40 a 60 minuti. Attraversi il «cimitero turco», un gruppo di stalagmiti su argilla che evocano lapidi
      musulmane, e il percorso turistico termina presso la Hajdučki stol, una tavola e sedili di pietra
      scolpiti dall'uomo. Più avanti, al sifone, la volta scende a 120 cm; in inverno la grotta si allaga
      interamente e impedisce ogni passaggio. Nel Grande Lago, esteso per 180 metri, si apre la maggiore
      superficie liquida della caverna.


      Con preavviso fino al giorno prima è possibile concordare visite personalizzate. Il biglietto include
      l'ingresso al Museo Biospeleologico. C'è pure un altro modo di percorrere il polje: l'escursione in
      bicicletta segue la linea a scartamento ridotto del Ćiro e sentieri del Popovo Polje insieme a una guida
      locale, con prenotazione obbligatoria un giorno prima.
    history: >-
      La presenza umana nella cavità risale a circa 8000 anni fa, con un'incisione risalente a dodicimila anni
      prima di Cristo. Nel 1582 Jakov Sorkočević annotava che gli abitanti del posto credevano vi dimorassero
      le ninfe, le vile, intente a danzare ogni notte. Lo speleologo ceco Karel Absolon compì le scoperte
      maggiori tra il 1912 e il 1914, mentre Mihajlo Radovanović ne redasse la prima descrizione scientifica
      nel 1929. In una galleria inferiore fu rinvenuto uno scheletro integro di leopardo.


      Dal 1952 la grotta è tutelata quale monumento naturale, e dal 1965 come riserva geologica speciale. Nel
      2024 il Comitato del Patrimonio Mondiale l'ha iscritta nella sua 46ª sessione. Il borgo di Zavala, con
      la sua architettura in pietra, forma con la grotta un connubio paesaggistico e architettonico in via di
      riconoscimento come monumento nazionale; il suo monastero viene citato per la prima volta nel XVI
      secolo.
    before: >-
      Indossa pantaloni lunghi e calzature robuste, evitando ciabatte o suole scivolose. Rimani vicino alla
      guida e non allontanarti dal gruppo. Non abbandonare rifiuti né asportare oggetti dalla cavità: è un
      ecosistema protetto di straordinario pregio. La visita è sconsigliata ai bambini di età inferiore a 4
      anni, alle persone con claustrofobia e a chi ha ridotta mobilità. L'escursione in bicicletta non è
      raccomandata ai minori di 10 anni.
    around: >-
      Lontano da qui, il [Carso classico e sistema sotterraneo di
      Postumia-Planina](/lugar/postonjska-jama---planinsko-polje/) condivide con Vjetrenica il carsismo, le
      zone umide e il proteo.
  pt:
    intro: >-
      Em pleno verão, num terreno de rocha nua, abrasador e sem água, sopra da terra uma aragem de ar gelado.
      É a entrada de Vjetrenica, a «gruta do vento», no extremo sul da Bósnia e Herzegovina. Abre-se no bordo
      do polje de Popovo a 260 metros de altitude, a escassos 12 km em linha reta do Adriático, constituindo a
      gruta mais rica do mundo em biodiversidade subterrânea: quase 230 espécies recenseadas, 37 das quais
      descritas aqui pela primeira vez. Desde 2024 integra o Património Mundial da UNESCO.
    landscape: >-
      O polje de Popovo é um dos maiores poljes do planeta, moldado sobretudo pelo Trebišnjica, o maior rio
      sumidouro da Terra. O vale está repleto de sumidouros e o clima é mediterrânico, com verões quentes e
      secos. Antes das obras de engenharia hidráulica, entre outubro e junho afluíam ao polje enormes massas
      de água; atualmente, as centrais e o leito em betão do Trebišnjica permitem regular o caudal, drenando o
      excedente no inverno e irrigando no verão.


      Sob este chão, a rocha é calcite quase pura: os calcários do Popovo polje atingem até 99,98 por cento, o
      que os torna extraordinariamente solúveis. Por essa razão desenvolveu-se uma gruta desta envergadura.
      Vjetrenica integra o sistema fluvial do Trebišnjica e tem 7.014 metros de galerias cársticas exploradas,
      com quatro cursos de água e mais de dez correntes periódicas secundárias que alimentam lagos
      subterrâneos. A temperatura é estável, fixando-se em cerca de 11,6 °C.


      O vento tem uma explicação direta. Por cima da caverna existem fendas profundas pelas quais entra ar
      quente no verão, que arrefece e sai sob pressão pela boca da gruta; no inverno, quando a atmosfera
      exterior fica mais fria que o interior, a corrente inverte o rumo. O seu nome deriva exatamente desta
      circulação.
    wildlife: >-
      A fauna constitui o grande argumento do lugar. Estão registadas quase 230 espécies: 180 animais, 14
      fungos e 35 protistas, das quais 93 são estritamente troglóbias. Vjetrenica é o lar do único verme
      tubícola subterrâneo do mundo, Marifugia cavatica, e do único hidrozoário de água doce que vive
      exclusivamente em águas subterrâneas, Velkovrhia enigmatica. Existem nove espécies de anfípodes
      subterrâneos do género Niphargus, o que representa porventura a maior diversidade hipógea de um único
      género. Várias espécies são relíquias do Terciário ou anteriores, consideradas fósseis vivos. O
      [proteu](/especie/proteus_anguinus/) figura entre as espécies em destaque.


      A gruta pode ser visitada quase todo o ano, com horários distintos de março a maio, de junho a agosto,
      em setembro, de outubro a novembro e de dezembro a fevereiro. A época ideal decorre de maio a outubro.
    visit: >-
      A visita guiada percorre o troço preparado, com 1.050 metros eletrificados, durando de 40 a 60 minutos.
      Passas pelo «Cemitério turco», um conjunto de estalagmites sobre argila que lembram lápides muçulmanas,
      e o troço turístico termina na Hajdučki stol, uma mesa e assentos de pedra esculpidos pelo homem. Mais
      adiante, no sifão, a abóbada desce até 120 cm; no inverno a gruta inunda completamente nesse ponto,
      impedindo a passagem. No Grande Lago, com 180 metros, localiza-se o maior plano de água da cavidade.


      Com aviso prévio até à véspera, é possível ajustar as condições da visita. A entrada contempla o Museu
      Bioespeleológico. Existe ainda outro modo de desfrutar do polje: o passeio de bicicleta segue o antigo
      traçado de via estreita do comboio Ćiro e caminhos de Popovo Polje com um guia local, requerendo reserva
      com um dia de antecedência.
    history: >-
      A presença humana na gruta remonta a cerca de 8000 anos, existindo uma gravura de há doze mil anos antes
      de Cristo. Em 1582, Jakov Sorkočević escreveu que os habitantes locais acreditavam que ali moravam
      ninfas, as vile, que dançavam durante a noite. O espeleólogo checo Karel Absolon protagonizou as maiores
      descobertas entre 1912 e 1914, tendo Mihajlo Radovanović feito a descrição científica em 1929. Numa
      galeria inferior foi resgatado um esqueleto completo de leopardo.


      Desde 1952 a gruta é monumento natural protegido, e desde 1965 integra a categoria de reservas
      geológicas especiais. Em 2024, o Comité do Património Mundial inscreveu-a na sua 46.ª sessão. A aldeia
      de Zavala, com a sua arquitetura vernacular em pedra, forma com a gruta um conjunto natural e edificado
      em processo de salvaguarda como monumento nacional; o seu mosteiro é mencionado pela primeira vez no
      século XVI.
    before: >-
      Usa calças compridas e calçado robusto, evitando chinelos ou solas escorregadias. Mantém-te próximo do
      guia e nunca te afastes do grupo. Não deixes lixo nem retires quaisquer objetos da gruta: trata-se de um
      ecossistema protegido de elevado valor. A visita não é recomendada a crianças com menos de 4 anos, a
      pessoas que sofram de claustrofobia ou com mobilidade reduzida. O passeio de bicicleta não é aconselhado
      a menores de 10 anos.
    around: >-
      Longe daqui, o [Carste Clássico e Sistema Subterrâneo de
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/) partilha com Vjetrenica o carste, as zonas
      húmidas e o proteu.
