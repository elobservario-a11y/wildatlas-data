resumen:
  es: Relieve kárstico, glaciar, prados alpinos y bosques sobre los lagos Gosau.
  en: Karst topography, glaciers, alpine meadows and old-growth mountain forests above the Gosau lakes.
  fr: Relief karstique, glacier, alpages et forêts de montagne au-dessus des lacs de Gosau.
  de: Karstrelief, Gletscher, Almmatten und Bergmischwälder über den Gosauseen.
  it: Rilievi carsici, ghiacciaio, pascoli alpini e foreste montane sui laghi di Gosau.
  pt: Relevo cársico, glaciar, prados alpinos e florestas de montanha sobre os lagos de Gosau.
unico:
  es: >-
    El único glaciar de Alta Austria, sobre un macizo calizo que esconde sus aguas bajo tierra y las devuelve
    en lagos y manantiales.
  en: >-
    Upper Austria’s only glacier realm, resting on a vast limestone massif that swallows its waters
    underground to return them through hidden springs and tarns.
  fr: >-
    L’unique glacier de Haute-Autriche, reposant sur un puissant massif calcaire qui engloutit ses eaux sous
    terre pour les restituer en résurgences et lacs limpides.
  de: >-
    Oberösterreichs einziger Gletscher auf einem Kalkmassiv, das seine Wasser unterirdisch schluckt und in
    Quelltöpfen und Gebirgsseen wieder zutage fördert.
  it: >-
    L’unico ghiacciaio dell’Alta Austria, posato su un massiccio calcareo che inghiotte le acque nel
    sottosuolo per restituirle in laghi e risorgive.
  pt: >-
    O único glaciar da Alta Áustria, sobre um maciço calcário que absorve as águas no subsolo para as devolver
    em lagoas e nascentes profundas.
observaciones:
  es: >-
    La norma de la reserva permite entrar a pie en sus zonas. Los perros tienen normas municipales en el
    camino del Koppenwinkel hasta Ebnersteg. El glaciar retrocede con fuerza, así que no cuentes con que el
    hielo sea el de las fotos antiguas. Consulta en el municipio de Obertraun los avisos y los cierres antes
    de ir.
texto:
  es:
    intro: >-
      El Dachstein tiene un glaciar y un lago que no se ven brotar. Bajo la roca, la nieve y el hielo se
      filtran por dolinas y cuevas, y el agua reaparece en la base de la montaña: en los lagos Gosau, que se
      alimentan de manantiales ocultos bajo la superficie venidos de los glaciares, o en el Kessel, junto a
      Hallstatt, que solo se activa con lluvias extremas. La reserva natural Dachstein, en los municipios de
      Gosau, Hallstatt y Obertraun, es el macizo calizo más alto de Alta Austria, con el único glaciar del
      estado, y baja desde los pastos alpinos hasta los bosques de barranco del Koppenwinkel.
    landscape: >-
      El Dachstein es una masa de caliza con grandes mesetas altas y crestas abruptas como el Gosaukamm. Es
      sobre todo caliza del Dachstein muy karstificada, y la mayor zona de glaciares de los Alpes calizos del
      norte. En su superficie hay grandes dolinas y campos de lapiaz, y debajo, extensos sistemas de cuevas:
      la Hirlatzhöhle, con más de 112 km, es la tercera más larga de Austria, y la Mammuthöhle, la
      Rieseneishöhle y la Koppenbrüllerhöhle son cuevas turísticas abiertas al público.


      La historia del hielo está escrita en el relieve. En el Dachstein está el glaciar más oriental de los
      Alpes, que retrocede con fuerza pero sigue siendo el mayor glaciar individual de los Alpes calizos del
      norte; los tres mayores son el Hallstätter Gletscher, el Großer Gosaugletscher y el Schladminger
      Gletscher. Los lagos Hallstätter See y Hinterer Gosausee ocupan cuencas excavadas por el hielo de la
      glaciación. Y el valle de los lagos Gosau es una fosa tectónica que separa la caliza sedimentaria del
      Dachstein de la caliza arrecifal del Gosaukamm.


      La vegetación sube por pisos. En la parte baja hay bosque de pícea, abeto y haya; hacia los 1800 m aún
      crecen grupos de cembro, donde está el límite del bosque. El pino mugo forma un cinturón de matorral
      rastrero que sube hasta unos 2000 m y se disuelve en brezales enanos y pastos alpinos. Por encima del
      límite del bosque queda un paisaje casi virgen de pinar rastrero, pastos alpinos, pedregales y cantiles.
      En el Koppenwinkel hay además bosques de barranco y alisedas grises.
    wildlife: >-
      La meseta árida es refugio de la [gamuza](/especie/rupicapra_rupicapra/), con altas densidades, y
      alberga el único rebaño de [íbice alpino](/especie/capra_ibex/) de Alta Austria. Cerca de Bachlalm hay
      varias colonias de [marmota alpina](/especie/marmota_marmota/), todas de antiguas sueltas, y también
      vive la liebre variable.


      En el aire, la chova piquigualda y el cuervo son frecuentes. Viven cuatro gallos de bosque: la [perdiz
      nival](/especie/lagopus_muta/), el [gallo lira](/especie/tetrao_tetrix/), la grévol y el
      [urogallo](/especie/tetrao_urogallus/). También se han registrado el [acentor
      alpino](/especie/prunella_collaris/) y el gorrión alpino, y el [águila
      real](/especie/aquila_chrysaetos/) tiene aquí su área.
    visit: >-
      La puerta natural es Obertraun. Desde el Gasthaus Koppenrast, una pista forestal lleva a la reserva
      Koppenwinkel; a unos 20 minutos está el Koppenwinkelsee, un lago pequeño y claro alimentado por
      manantiales del subsuelo. El paseo del Koppenwinkel es especialmente adecuado para familias: sin
      desnivel, con una marcha de unas dos horas.


      El Dachsteinhöhlenpfad lleva hasta la estación del teleférico, punto de partida a las cuevas
      Rieseneishöhle y Mammuthöhle. El Obertrauner Höhenweg, cómodo y con bancos, sigue las laderas del
      Sarstein 50 a 80 metros sobre el fondo del valle. Y el Salzkammerweg da la vuelta de 45,5 km al Hoher
      Sarstein en cinco etapas, entre el Ausseerland y el Salzkammergut interior.


      El Kessel, junto a Hallstatt, es un manantial kárstico que solo se activa con lluvias extremas o un
      fuerte deshielo, y es monumento protegido. En el oeste, la reserva incluye los lagos Gosau.
    history: >-
      El macizo y el Salzkammergut interior entraron en diciembre de 1997 en la lista del Patrimonio Mundial
      como paisaje cultural Hallstatt–Dachstein/Salzkammergut, y su historia está marcada por la minería
      prehistórica de sal de Hallstatt. La reserva natural se fijó con un decreto del gobierno de Alta Austria
      de 2018, que declara reserva natural el Dachstein de Gosau, Hallstatt y Obertraun. En el Hallstätter
      Kalk, además, hay ammonites: es uno de los yacimientos de ammonites triásicos más interesantes del
      mundo.
    before: >-
      La norma de la reserva permite entrar a pie en sus zonas. Los perros tienen normas municipales en el
      camino del Koppenwinkel hasta Ebnersteg. El glaciar retrocede con fuerza, así que no cuentes con que el
      hielo sea el de las fotos antiguas. Consulta en el municipio de Obertraun los avisos y los cierres antes
      de ir.
    around: >-
      A unos 6 km está el [Totes Gebirge](/lugar/totes-gebirge---karst-desert/), otro desierto kárstico, y a
      unos 8 km la [Meseta Kárstica de Tennengebirge](/lugar/tennengebirge---karst-plateau/).
  en:
    intro: >-
      The Dachstein possesses glaciers and deep mountain lakes that appear to have no surface feeder streams.
      Beneath the fractured limestone, snow and ice meltwaters filter into abyss-like sinkholes and caves,
      resurfacing at the foot of the massif: filling the Gosau lakes from submerged sub-lacustrine springs fed
      by glacial melt, or swelling the Kessel near Hallstatt, which surges only after extreme deluges. The
      Dachstein nature reserve, straddling the municipalities of Gosau, Hallstatt and Obertraun, encompasses
      the highest limestone bastion of Upper Austria, holding the federal state’s sole glaciers and cascading
      from high alpine meadows down into the ravine forests of Koppenwinkel.
    landscape: >-
      The Dachstein forms a colossal limestone massif crowned by elevated plateaux and sheer jagged ridges
      like the Gosaukamm. It consists primarily of heavily karstified Dachstein limestone, harbouring the most
      extensive glacier zone in the Northern Limestone Alps. Its barren tablelands feature giant dolines and
      expansive karren lapiaz fields, underlain by profound cave labyrinths: the Hirlatzhöhle, exceeding 112
      km in surveyed passages, is the third longest cave system in Austria, while the Mammuthöhle,
      Rieseneishöhle and Koppenbrüllerhöhle operate as show caves open to the public.


      The imprint of the ice ages is etched across every landform. The Dachstein cradles the easternmost
      glacier in the Alps, shrinking noticeably yet retaining its status as the largest single ice body in the
      Northern Limestone Alps; the primary three are the Hallstätter Gletscher, Großer Gosaugletscher and
      Schladminger Gletscher. Both Lake Hallstatt and Hinterer Gosausee occupy deep bedrock troughs excavated
      by Pleistocene glaciers. The Gosau lake valley is a dramatic tectonic graben separating bedded Dachstein
      lagoonal limestone from the fossil reef limestone of the Gosaukamm.


      Vegetation ascends in distinct altitudinal zones. Lower slopes support mixed spruce, silver fir and
      European beech; near 1800 m grow hardy stands of Swiss stone pine marking the timberline. Dwarf mountain
      pine forms a dense creeping scrub belt reaching up to roughly 2000 m before giving way to alpine heath
      and turf. Above the tree line stretches a near-pristine wilderness of krummholz pine, alpine tundra,
      rock screes and precipitous cliffs. In the Koppenwinkel, specialized ravine forests and grey alder
      woodlands flank cold karst seepages.
    wildlife: >-
      The arid high-altitude plateau offers prime sanctuary for the [chamois](/especie/rupicapra_rupicapra/),
      which maintains high population densities, and shelters Upper Austria’s only resident herd of [alpine
      ibex](/especie/capra_ibex/). Near Bachlalm several colonies of [alpine
      marmot](/especie/marmota_marmota/) thrive, all descending from historical reintroductions, alongside the
      mountain hare.


      In the alpine air, alpine choughs and common ravens are daily sights. Four distinct grouse species
      inhabit the massif: [rock ptarmigan](/especie/lagopus_muta/), [black grouse](/especie/tetrao_tetrix/),
      hazel grouse and [capercaillie](/especie/tetrao_urogallus/). The [alpine
      accentor](/especie/prunella_collaris/) and white-winged snowfinch have been regularly recorded, and the
      [golden eagle](/especie/aquila_chrysaetos/) maintains established breeding territories across the crags.
    visit: >-
      The natural approach is through Obertraun. From Gasthaus Koppenrast, an unpaved forest track leads
      directly into the Koppenwinkel reserve; after roughly 20 minutes you reach Koppenwinkelsee, a
      transparent shallow lake fed exclusively by groundwater springs. The Koppenwinkel circuit is ideal for
      families: entirely flat, requiring around two hours of gentle walking.


      The Dachsteinhöhlenpfad climbs toward the cable car base station, the launch point for the
      Rieseneishöhle ice cave and Mammuthöhle. The Obertrauner Höhenweg, a level panoramic trail lined with
      benches, traces the flanks of the Sarstein 50 to 80 metres above the valley floor. And the Salzkammerweg
      completes a 45.5 km circuit around the Hoher Sarstein in five stages, connecting Ausseerland with the
      inner Salzkammergut.


      The Kessel near Hallstatt is a periodic karst siphon spring that erupts only during exceptional
      torrential rains or violent spring snowmelt, protected as a natural monument. To the west, the reserve
      embraces the magnificent Gosau lakes.
    history: >-
      The Dachstein massif and inner Salzkammergut were inscribed on the UNESCO World Heritage list in
      December 1997 as the Hallstatt–Dachstein/Salzkammergut Cultural Landscape, shaped by Hallstatt’s
      prehistoric salt mining heritage. The modern nature reserve was legally established under an Upper
      Austrian provincial government ordinance in 2018, officially proclaiming the Dachstein within Gosau,
      Hallstatt and Obertraun. The red Hallstätter Kalk limestone is also internationally famed for its
      Triassic ammonites, constituting one of the most celebrated paleontological deposits in the world.
    before: >-
      Reserve regulations permit hiking on foot across the territory. Strict municipal dog-leash rules apply
      on the path through Koppenwinkel up to Ebnersteg. The glaciers are undergoing rapid retreat, so do not
      expect the ice extent seen in historical photographs. Check local advisories and trail closures with
      Obertraun municipal office prior to setting out.
    around: >-
      Roughly 6 km away lies the [Totes Gebirge](/lugar/totes-gebirge---karst-desert/), another vast karst
      desert, and about 8 km away rises the [Tennengebirge Karst
      Plateau](/lugar/tennengebirge---karst-plateau/).
  fr:
    intro: >-
      Le Dachstein abrite des glaciers et des lacs de montagne sans tributaires de surface visibles. Sous la
      roche calcaire, la neige et la glace fondent et s’engouffrent dans les dolines et les abîmes, pour ne
      réapparaître qu’au pied du massif : dans les lacs de Gosau, nourris par des sources sous-lacustres
      invisibles venues des glaces, ou au Kessel près de Hallstatt, qui n’entre en charge que lors de
      précipitations diluviennes. La réserve naturelle du Dachstein, sur les communes de Gosau, Hallstatt et
      Obertraun, forme le plus haut bastion calcaire de Haute-Autriche, abrite le seul glacier de ce Land et
      dévale depuis les pelouses alpines jusqu’aux forêts de ravin du Koppenwinkel.
    landscape: >-
      Le Dachstein est un colossal bloc de calcaire couronné de hauts plateaux et de crêtes déchiquetées
      telles que le Gosaukamm. Il est constitué d’un calcaire du Dachstein intensément karstifié et accueille
      le plus vaste complexe glaciaire des Préalpes orientales septentrionales. À sa surface se succèdent
      dolines géantes et champs de lapiés, recouvrant d’immenses réseaux souterrains : la Hirlatzhöhle, longue
      de plus de 112 km de galeries explorées, est la troisième plus vaste cavité d’Autriche, tandis que la
      Mammuthöhle, la Rieseneishöhle et la Koppenbrüllerhöhle sont des grottes aménagées ouvertes au public.


      L’empreinte des glaciations se lit dans chaque repli du relief. Le Dachstein abrite le glacier le plus
      oriental des Alpes, en net recul mais demeurant le plus vaste appareil glaciaire individuel des Alpes
      calcaires septentrionales ; les trois principaux sont le Hallstätter Gletscher, le Großer Gosaugletscher
      et le Schladminger Gletscher. Le Hallstätter See et le Hinterer Gosausee occupent des ombilics
      surcreusés par les langues glaciaires. La vallée des lacs de Gosau constitue un fossé d’effondrement
      séparant les calcaires lités du Dachstein du récif corallien fossile du Gosaukamm.


      La végétation s’étage avec rigueur. Dans les bas versants s’épanouit une forêt mixte d’épicéas, de
      sapins et de hêtres ; vers 1800 m subsistent des bouquets de pins cembros marquant la limite supérieure
      des arbres. Le pin mugho compose une ceinture d’arbustes rampants qui grimpe jusqu’à environ 2000 m
      avant de céder la place aux landes naines et aux pelouses alpines. Au-delà subsiste un désert minéral de
      pins couchés, de toundras d’altitude, de pierriers et de parois verticales. Dans le Koppenwinkel
      s’ajoutent des forêts de ravin et des aulnaies blanches sur alluvions froides.
    wildlife: >-
      Ce haut plateau rocailleux sert de havre au [chamois](/especie/rupicapra_rupicapra/), présent à de
      fortes densités, et abrite l’unique harde de [bouquetin des Alpes](/especie/capra_ibex/) de
      Haute-Autriche. Vers la Bachlalm sont établies plusieurs colonies de [marmotte des
      Alpes](/especie/marmota_marmota/), toutes issues de réintroductions historiques, aux côtés du lièvre
      variable.


      Dans les airs, le chocard à bec jaune et le grand corbeau sont des compagnons familiers. Quatre
      tétraonidés habitent le massif : le [lagopède alpin](/especie/lagopus_muta/), le [tétras
      lyre](/especie/tetrao_tetrix/), la gélinotte des bois et le [grand tétras](/especie/tetrao_urogallus/).
      On y observe également l’[accenteur alpin](/especie/prunella_collaris/) et la niverolle alpine, tandis
      que [l’aigle royal](/especie/aquila_chrysaetos/) patrouille régulièrement sur les falaises.
    visit: >-
      L’accès privilégié se fait par Obertraun. Depuis l’auberge Gasthaus Koppenrast, une piste forestière
      pénètre dans la réserve du Koppenwinkel ; en 20 minutes environ, vous atteignez le Koppenwinkelsee,
      petit lac aux eaux limpides alimenté par des résurgences sous-marines. La boucle du Koppenwinkel
      convient parfaitement aux familles : totalement plate, elle s’effectue en deux heures de marche
      tranquille.


      Le sentier des grottes (Dachsteinhöhlenpfad) grimpe vers la gare du téléphérique, point de départ vers
      la grotte de glace Rieseneishöhle et la Mammuthöhle. L’Obertrauner Höhenweg, confortable et jalonné de
      bancs, longe les pentes du Sarstein de 50 à 80 mètres au-dessus du fond de vallée. Le Salzkammerweg
      boucle un périple de 45,5 km autour du Hoher Sarstein en cinq étapes, reliant l’Ausseerland au
      Salzkammergut intérieur.


      Le Kessel, près de Hallstatt, est une spectaculaire résurgence intermittente protégée au titre des
      monuments naturels, ne jaillissant qu’après des pluies exceptionnelles ou une fonte massive. À l’ouest,
      la réserve englobe les lacs enchanteurs de Gosau.
    history: >-
      Le massif du Dachstein et le Salzkammergut intérieur ont été inscrits en décembre 1997 sur la liste du
      patrimoine mondial de l’UNESCO sous l’appellation de paysage culturel de
      Hallstatt–Dachstein/Salzkammergut, en hommage notamment aux mines de sel préhistoriques de Hallstatt. La
      réserve naturelle a été formellement instaurée par décret du gouvernement de Haute-Autriche en 2018,
      regroupant le Dachstein sur Gosau, Hallstatt et Obertraun. Les calcaires rouges de Hallstatt
      (Hallstätter Kalk) renferment en outre de remarquables ammonites triasiques parmi les plus célèbres de
      la planète.
    before: >-
      La réglementation de la réserve autorise l’accès pédestre sur les chemins. Les chiens sont soumis à des
      prescriptions communales strictes sur le chemin du Koppenwinkel jusqu’à Ebnersteg. Le glacier recule
      rapidement, ne vous attendez donc pas à contempler les étendues de glace visibles sur les clichés
      anciens. Consultez les avis municipaux à Obertraun avant votre départ.
    around: >-
      À environ 6 km s’étend le [Totes Gebirge](/lugar/totes-gebirge---karst-desert/), un autre haut désert
      calcaire, et à quelque 8 km se dresse le [Plateau karstique du
      Tennengebirge](/lugar/tennengebirge---karst-plateau/).
  de:
    intro: >-
      Der Dachstein besitzt einen Gletscher und Gebirgsseen, denen scheinbar kein oberirdischer Zufluss
      entspringt. Unter dem nackten Kalkgestein versickern Schnee und Schmelzwasser in Dolinen und Klüften, um
      erst am Fuß des Bergmassivs wieder auszutreten: in den Gosauseen, die von unterseeischen Quellen aus den
      Gletschern gespeist werden, oder im Kessel bei Hallstatt, der nur bei extremen Starkregen überläuft. Das
      Naturschutzgebiet Dachstein in den Gemeinden Gosau, Hallstatt und Obertraun umfasst das höchste
      Kalkmassiv Oberösterreichs mit den einzigen Gletschern des Bundeslandes und reicht von den Almmatten bis
      in die Schluchtwälder des Koppenwinkels hinab.
    landscape: >-
      Der Dachstein ist ein gewaltiger Kalkstock mit ausgedehnten Hochplateaus und schroffen Felsgraten wie
      dem Gosaukamm. Er besteht überwiegend aus stark verkarstetem Dachsteinkalk und bildet das größte
      Gletschergebiet der Nördlichen Kalkalpen. Seine Hochflächen sind von Riesen-Dolinen und Karrenfeldern
      geprägt, unter denen weitverzweigte Höhlensysteme liegen: Die Hirlatzhöhle ist mit über 112 km
      Gesamtganglänge die drittlängste Höhle Österreichs, während Mammuthöhle, Rieseneishöhle und
      Koppenbrüllerhöhle als Schauhöhlen öffentlich zugänglich sind.


      Das Wirken des Eises prägt jede Geländeform. Am Dachstein liegt der östlichste Gletscher der Alpen, der
      zwar stark abschmilzt, aber nach wie vor der größte Einzelgletscher der Nördlichen Kalkalpen ist; die
      drei größten Eiskörper sind Hallstätter Gletscher, Großer Gosaugletscher und Schladminger Gletscher.
      Hallstätter See und Hinterer Gosausee füllen eiszeitliche Zungenbecken. Das Tal der Gosauseen stellt
      einen tektonischen Grabenbruch dar, der den geschichteten Dachstein-Bankkalk vom Riffkalk des Gosaukamms
      trennt.


      Die Vegetation staffelt sich nach Höhenstufen. In tieferen Lagen dominiert Fichten-Tannen-Buchenwald;
      gegen 1800 m wachsen noch Zirbengruppen an der Waldgrenze. Die Latsche bildet einen dichten
      Krummholzgürtel, der bis etwa 2000 m hinaufreicht und in Zwergstrauchheiden und alpine Rasen übergeht.
      Oberhalb der Waldgrenze breitet sich eine urwüchsige Hochgebirgslandschaft aus Latschengebüsch, alpinen
      Matten, Schuttfluren und Felswänden aus. Im Koppenwinkel finden sich zudem feuchte Schluchtwälder und
      Grauerlen-Auen.
    wildlife: >-
      Das karge Hochplateau bietet der [Gämse](/especie/rupicapra_rupicapra/) mit hohen Bestandsdichten
      Lebensraum und beherbergt die einzige Kolonie des [Alpensteinbocks](/especie/capra_ibex/) in
      Oberösterreich. Bei der Bachlalm leben mehrere Kolonien des
      [Alpenmurmeltiers](/especie/marmota_marmota/), die auf historische Auswilderungen zurückgehen, neben dem
      Schneehasen.


      In der Luft gehören Alpendohle und Kolkrabe zum vertrauten Bild. Vier Raufußhuhnarten besiedeln das
      Massiv: [Schneehuhn](/especie/lagopus_muta/), [Birkhuhn](/especie/tetrao_tetrix/), Haselhuhn und
      [Auerhuhn](/especie/tetrao_urogallus/). Auch [Alpenbraunelle](/especie/prunella_collaris/) und
      Schneesperling wurden nachgewiesen, und der [Steinadler](/especie/aquila_chrysaetos/) besitzt hier sein
      angestammtes Revier.
    visit: >-
      Das natürliche Eingangstor ist Obertraun. Vom Gasthaus Koppenrast führt eine Forststraße in das
      Naturschutzgebiet Koppenwinkel; nach rund 20 Minuten erreichst du den Koppenwinkelsee, ein klares
      seichtes Gewässer, das von Grundwasseraufstößen gespeist wird. Der Rundweg im Koppenwinkel ist ideal für
      Familien: völlig eben, mit einer Gehzeit von etwa zwei Stunden.


      Der Dachsteinhöhlenpfad zieht hinauf zur Seilbahnstation, dem Ausgangspunkt zur Rieseneishöhle und
      Mammuthöhle. Der Obertrauner Höhenweg verläuft eben und mit Rastbänken an den Hängen des Sarsteins 50
      bis 80 Meter über dem Talboden. Und der Salzkammerweg umrundet den Hohen Sarstein auf 45,5 km in fünf
      Etappen zwischen dem Ausseerland und dem inneren Salzkammergut.


      Der Kessel bei Hallstatt ist ein periodischer Karstquelltopf, der nur nach Starkregen oder massiver
      Schneeschmelze aktiv wird und als Naturdenkmal geschützt ist. Im Westen gehören die Gosauseen zum
      Schutzgebiet.
    history: >-
      Das Dachsteinmassiv und das innere Salzkammergut wurden im Dezember 1997 als Kulturlandschaft
      Hallstatt–Dachstein/Salzkammergut in das UNESCO-Welterbe aufgenommen, geprägt durch die prähistorische
      Salzgewinnung in Hallstatt. Das Naturschutzgebiet wurde mit einer Verordnung der oberösterreichischen
      Landesregierung von 2018 verbindlich festgeschrieben. Im Hallstätter Kalk finden sich zudem berühmte
      Vorkommen triassischer Ammoniten von internationalem Rang.
    before: >-
      Die Schutzgebietsverordnung gestattet das Begehen der Wege zu Fuß. Für Hunde gelten auf dem Weg durch
      den Koppenwinkel bis zum Ebnersteg örtliche Leinenbestimmungen. Der Gletscher schmilzt rapide ab; stelle
      dich darauf ein, dass das Eis nicht mehr den Ausmaßen alter Fotografien entspricht. Erkundige dich im
      Gemeindeamt Obertraun über aktuelle Wegsperren vor deiner Tour.
    around: >-
      Rund 6 km entfernt dehnt sich das [Tote Gebirge](/lugar/totes-gebirge---karst-desert/) als weitere
      Karstwüste aus, und etwa 8 km entfernt ragt das [Tennengebirge](/lugar/tennengebirge---karst-plateau/)
      empor.
  it:
    intro: >-
      Il Dachstein possiede ghiacciai e laghi alpini privi di emissari superficiali evidenti. Sotto il banco
      calcareo, le acque di fusione di neve e ghiaccio si disperdono in doline e voragini, per riaffiorare
      alla base della montagna: nei laghi di Gosau, alimentati da polle subacquee provenienti dai ghiacciai, o
      nel Kessel presso Hallstatt, che si attiva esclusivamente durante piogge torrenziali. La riserva
      naturale Dachstein, nei comuni di Gosau, Hallstatt e Obertraun, costituisce il massiccio calcareo più
      elevato dell’Alta Austria, accoglie l’unico ghiacciaio del Land e scende dai pascoli alpini fino ai
      boschi di forra del Koppenwinkel.
    landscape: >-
      Il Dachstein è un imponente blocco calcareo modellato da vasti altipiani e creste aspre come il
      Gosaukamm. È composto da calcare del Dachstein intensamente carsificato e ospita la più estesa
      superficie glaciale delle Alpi Calcaree Settentrionali. Sul suo altopiano si aprono doline giganti e
      campi solcati di carreggiate carsiche, sotto i quali si snodano immensi reticoli ipogei: la
      Hirlatzhöhle, con oltre 112 km di gallerie censite, è la terza cavità più estesa d’Austria, mentre la
      Mammuthöhle, la Rieseneishöhle e la Koppenbrüllerhöhle sono grotte turistiche aperte al pubblico.


      Le impronte dei ghiacci quaternari si riflettono in ogni piega del paesaggio. Sul Dachstein resiste il
      ghiacciaio più orientale dell’arco alpino, in forte ritiro ma ancora il maggiore apparato glaciale
      individuale delle Alpi Calcaree Settentrionali; i tre corpi principali sono l’Hallstätter Gletscher, il
      Großer Gosaugletscher e lo Schladminger Gletscher. L’Hallstätter See e l’Hinterer Gosausee riempiono
      conche di sovraescavazione glaciale. La valle dei laghi di Gosau rappresenta una fossa tettonica che
      separa il calcare sedimentario del Dachstein dalla scogliera fossile del Gosaukamm.


      La vegetazione risale i versanti per fasce altitudinali. Nella parte basale domina il bosco misto di
      abete rosso, abete bianco e faggio; verso i 1800 m vegetano ancora nuclei di pino cembro al limite della
      vegetazione arborea. Il pino mugo forma una fascia arbustiva prostrata che sale fino a circa 2000 m per
      poi cedere il passo a brughiere nane e pascoli alpini. Oltre la linea degli alberi si distende un regno
      incontaminato di mughete, praterie d’alta quota, ghiaioni e pareti verticali. Nel Koppenwinkel si
      sviluppano inoltre boschi di forra e ontanete ad ontano bianco lungo risorgive fredde.
    wildlife: >-
      L’arido altopiano calcareo offre rifugio al [camoscio](/especie/rupicapra_rupicapra/), presente con alte
      densità demografiche, e accoglie l’unico nucleo di [stambecco alpino](/especie/capra_ibex/) dell’Alta
      Austria. Presso la Bachlalm vivono colonie stabili di [marmotta alpina](/especie/marmota_marmota/),
      frutto di storiche reintroduzioni, assieme alla lepre variabile.


      Tra le pareti rocciose il gracchio corallino e il corvo imperiale sono presenze consuete. Quattro specie
      di galliformi di montagna nidificano nel massiccio: la [pernice bianca](/especie/lagopus_muta/), il
      [fagiano di monte](/especie/tetrao_tetrix/), il francolino di monte e il [gallo
      cedrone](/especie/tetrao_urogallus/). Sono stati documentati anche il
      [sordone](/especie/prunella_collaris/) e il fringuello alpino, mentre l’[aquila
      reale](/especie/aquila_chrysaetos/) pattuglia costantemente le pareti rocciose.
    visit: >-
      Il punto di accesso naturale è Obertraun. Dalla locanda Gasthaus Koppenrast una carrareccia forestale
      conduce alla riserva di Koppenwinkel; in circa 20 minuti si raggiunge il Koppenwinkelsee, un piccolo
      specchio d’acqua trasparente alimentato da polle sotterranee. L’anello del Koppenwinkel è perfetto per
      le famiglie: privo di salite, richiede circa due ore di cammino riposante.


      Il Dachsteinhöhlenpfad risale verso la stazione della funivia, punto di partenza per visitare la grotta
      di ghiaccio Rieseneishöhle e la Mammuthöhle. L’Obertrauner Höhenweg, comodo e attrezzato con panchine
      panoramiche, asseconda le pendici del Sarstein da 50 a 80 metri sopra il fondovalle. Il Salzkammerweg
      compie l’intero giro di 45,5 km dell’Hoher Sarstein in cinque tappe, unendo l’Ausseerland al
      Salzkammergut interno.


      Il Kessel, vicino a Hallstatt, è una sorgente carsica periodica protetta come monumento naturale che
      zampilla con violenza solo a seguito di nubifragi prolungati. A ovest la riserva include i suggestivi
      laghi di Gosau.
    history: >-
      Il massiccio del Dachstein e il Salzkammergut interno sono stati dichiarati Patrimonio Mondiale UNESCO
      nel dicembre 1997 come paesaggio culturale Hallstatt–Dachstein/Salzkammergut, legati alla millenaria
      estrazione del sale di Hallstatt. La riserva naturale è stata formalizzata con decreto del governo
      dell’Alta Austria nel 2018, istituendo la tutela del Dachstein nei comuni di Gosau, Hallstatt e
      Obertraun. Nel calcare Hallstätter Kalk si trovano inoltre celebri giacimenti di ammoniti triassiche di
      rilevanza scientifica mondiale.
    before: >-
      Le norme dell’area protetta consentono la libera circolazione a piedi lungo i tracciati. Per i cani
      vigono ordinanze comunali di conduzione al guinzaglio sul tracciato del Koppenwinkel fino a Ebnersteg.
      Il ghiacciaio subisce un rapido ritiro: tieni presente che la coltre glaciale non corrisponde più a
      quella documentata nelle fotografie storiche. Informati presso il comune di Obertraun sullo stato dei
      sentieri prima dell’escursione.
    around: >-
      A circa 6 km si estende il [Totes Gebirge](/lugar/totes-gebirge---karst-desert/), un altro altopiano
      carsico desolato, e a circa 8 km sorge l’[Altopiano Carsico del
      Tennengebirge](/lugar/tennengebirge---karst-plateau/).
  pt:
    intro: >-
      O Dachstein possui um glaciar e lagoas de montanha que parecem não ter linhas de água superficiais
      visíveis. Sob o calcário fraturado, as neves e o gelo fundente infiltram-se em algares e fendas,
      reaparecendo apenas na base do maciço: alimentando os lagos de Gosau a partir de nascentes subaquáticas
      geradas nos glaciares, ou no Kessel junto a Hallstatt, que apenas desperta após chuvadas torrenciais. A
      reserva natural de Dachstein, nos municípios de Gosau, Hallstatt e Obertraun, constitui o maciço
      calcário mais alto da Alta Áustria, alberga os únicos glaciares do estado e desce dos pastos alpinos até
      aos bosques de ravina do Koppenwinkel.
    landscape: >-
      O Dachstein é um formidável bloco de calcário coroado por extensos planaltos elevados e arestas abruptas
      como o Gosaukamm. É formado essencialmente por calcário do Dachstein intensamente carstificado e encerra
      o maior domínio glaciar dos Alpes Calcários Setentrionais. Na sua superfície recortam-se dolinas
      gigantes e campos de lapiás, sob os quais se escondem redes subterrâneas imensas: a Hirlatzhöhle, com
      mais de 112 km de galerias exploradas, é a terceira cavidade mais longa da Áustria, ao passo que a
      Mammuthöhle, a Rieseneishöhle e a Koppenbrüllerhöhle funcionam como grutas turísticas abertas ao
      público.


      A herança dos períodos glaciares está gravada em todas as vertentes. No Dachstein resiste o glaciar mais
      oriental dos Alpes, em forte recuo mas mantendo o estatuto de maior massa de gelo individual dos Alpes
      Calcários Setentrionais; os três principais corpos são o Hallstätter Gletscher, o Großer Gosaugletscher
      e o Schladminger Gletscher. Os lagos Hallstätter See e Hinterer Gosausee preenchem bacias escavadas
      pelos glaciares quaternários. O vale dos lagos de Gosau corresponde a uma fossa tectónica que separa o
      calcário acamadado do Dachstein do recife fóssil do Gosaukamm.


      A vegetação distribui-se em andares altitudinais bem marcados. Na base domina a floresta mista de
      espruce, abeto-branco e faia; por volta dos 1800 m resistem tufos de pinheiro-suíço marcando o limite
      superior da floresta. O pinheiro-montês rasteiro compõe uma faixa de matagais que alcança perto de 2000
      m antes de se diluir em charnecas anãs e pastos alpinos. Acima do limite arbóreo estende-se uma vastidão
      desértica de pinheiros rasteiros, tundras de altitude, cascalheiras e escarpas verticais. No
      Koppenwinkel somam-se matas de ravina e amiais-brancos sobre sedimentos frios.
    wildlife: >-
      O planalto rochoso serve de refúgio à [camurça](/especie/rupicapra_rupicapra/), com densidades
      populacionais elevadas, e abriga a única manada de [íbis-dos-alpes](/especie/capra_ibex/) da Alta
      Áustria. Junto a Bachlalm prosperam várias colónias de [marmota-alpina](/especie/marmota_marmota/),
      fruto de reintroduções históricas, bem como a lebre-variável.


      Nas correntes de ar térmicas, a gralha-de-bico-amarelo e o corvo-comum são presenças constantes. Quatro
      espécies de galiformes de montanha habitam o maciço: a [perdiz-nival](/especie/lagopus_muta/), o
      [tetraz-lírio](/especie/tetrao_tetrix/), a galinha-do-mato e o
      [tetraz-grande](/especie/tetrao_urogallus/). Foram também registados a
      [ferreirinha-alpina](/especie/prunella_collaris/) e o pardal-nival, mantendo a
      [águia-real](/especie/aquila_chrysaetos/) territórios estáveis de nidificação nas escarpas.
    visit: >-
      A entrada natural faz-se a partir de Obertraun. Da estalagem Gasthaus Koppenrast, uma pista florestal
      conduz diretamente à reserva de Koppenwinkel; em cerca de 20 minutos alcança-se o Koppenwinkelsee, um
      pequeno lago límpido alimentado por nascentes freáticas. O percurso de Koppenwinkel adapta-se
      admiravelmente a famílias: sem qualquer desnível, cumpre-se em duas horas de marcha suave.


      O trilho Dachsteinhöhlenpfad sobe rumo à estação do teleférico, ponto de partida para a gruta de gelo
      Rieseneishöhle e a Mammuthöhle. O Obertrauner Höhenweg, confortável e dotado de bancos de descanso,
      contorna as encostas do Sarstein 50 a 80 metros acima do fundo do vale. O Salzkammerweg perfaz a volta
      de 45,5 km ao Hoher Sarstein em cinco etapas pedestres, ligando o Ausseerland ao Salzkammergut interior.


      O Kessel, próximo de Hallstatt, é um sifão cársico intermitente classificado como monumento natural que
      apenas transborda após aguaceiros extremos ou fusão nival acelerada. A ocidente, a reserva compreende os
      admiráveis lagos de Gosau.
    history: >-
      O maciço de Dachstein e o Salzkammergut interior foram inscritos na lista do Património Mundial da
      UNESCO em dezembro de 1997 como Paisagem Cultural Hallstatt–Dachstein/Salzkammergut, celebrando a
      mineração pré-histórica de sal em Hallstatt. A reserva natural foi formalmente homologada por decreto do
      governo da Alta Áustria em 2018, consagrando a proteção de Dachstein em Gosau, Hallstatt e Obertraun. No
      calcário Hallstätter Kalk ocorrem ainda extraordinários jazigos de amonites triássicas de renome
      científico internacional.
    before: >-
      As diretrizes da reserva facultam a circulação pedestre nos caminhos. Os cães estão sujeitos a regras
      municipais de uso obrigatório de trela no trilho do Koppenwinkel até Ebnersteg. O glaciar regride a
      ritmo acentuado, pelo que não deves esperar a cobertura de gelo patente em registos fotográficos
      históricos. Informa-te junto da câmara municipal de Obertraun sobre restrições e encerramentos
      temporários antes de iniciar a caminhada.
    around: >-
      A cerca de 6 km estende-se o [Totes Gebirge](/lugar/totes-gebirge---karst-desert/), outro extenso
      planalto cársico desértico, e a perto de 8 km avulta o [Planalto Cársico de
      Tennengebirge](/lugar/tennengebirge---karst-plateau/).
