texto:
  es:
    intro: >-
      Snježnik significa, más o menos, «el nevado», y se lo ganó con razón: a pesar de lo cerca que está el
      mar, la nieve aguanta aquí hasta bien entrada la primavera. Es una cresta rocosa de 10 kilómetros que
      corre de noroeste a sureste en el Gorski kotar occidental, a espaldas de Rijeka, rodeada de prados de
      montaña. Su cumbre, de 1506 metros, está dentro del Parque Nacional de Risnjak, del que es la segunda
      cima, y la separan solo tres kilómetros de Risnjak, su gemela de enfrente.
    landscape: >-
      Desde arriba se entiende todo. Se ven las islas del Kvarner, el golfo de Rijeka, Istria con el monte
      Učka, el Snežnik esloveno y, con buena visibilidad, más allá, los Alpes de Kamnik-Savinja. Es una de las
      mejores vistas de Croacia, y no es casualidad: el macizo está aislado y es alto.


      Sobre la roca, la vida se agarra. Las plantas de Snježnik aguantan el calor del verano, el frío intenso
      y el viento, y cerca de la cima crece el edelweiss del Karst, subespecie Leontopodium alpinum krasense.
      A su alrededor se abren los prados de montaña, y entre las crestas el de Lazac, que destaca por la
      variedad de colores de sus plantas.


      Debajo del macizo, el parque es un mundo de caliza y dolomía con dolinas, lapiaces, simas y cuevas. Como
      la caliza es porosa, hay pocos cursos de agua en superficie. El clima es una mezcla de aire adriático y
      continental: en el refugio de Risnjak caen unos 3600 milímetros de lluvia al año, entre lo más alto del
      país, y las dolinas, llamadas ponikve, guardan la nieve más tiempo por la inversión térmica. La mayor
      parte del parque es bosque mixto de haya y abeto, y encima, entre 1200 y 1400 metros, el hayedo
      subalpino da paso al último piso, de pino mugo.
    wildlife: >-
      Croacia es uno de los pocos países de Europa donde conviven el [oso pardo](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/), y el entorno de Risnjak es uno de sus
      refugios. El lince, que dio nombre al parque, desapareció en el siglo XIX y volvió tras una
      reintroducción en la vecina Eslovenia. Es el más escaso y esquivo, y casi nunca se ve. Del lobo se
      rastrean dos manadas en la zona, la de Risnjak y la de Snježnik. Los osos se estudian desde los años
      ochenta, y su territorio es mayor que el del parque.


      También viven aquí el [ciervo](/especie/cervus_elaphus/), el [corzo](/especie/capreolus_capreolus/) y el
      [jabalí](/especie/sus_scrofa/). El [rebeco](/especie/rupicapra_rupicapra/) ha disminuido y el parque
      plantea reintroducirlo. Entre las aves, el [urogallo](/especie/tetrao_urogallus/), el grévol, el azor y
      el [búho real](/especie/bubo_bubo/); en total se han registrado 114 especies en el parque y su entorno.


      Los dos momentos del año: a finales de agosto y principios de septiembre despierta el celo del ciervo, y
      el parque describe su berrea como el punto álgido de actividad. En invierno el macizo es la zona más
      habitual de Croacia para el esquí de travesía, por su cercanía a la estación de Platak.
    visit: >-
      Desde Platak se sube en alrededor de una hora. Lo más fácil es ir por la cresta de Greben hasta la cima
      y bajar por Grlo, que desciende por la parte oeste del pico. Si tienes más tiempo, el parque recomienda
      enlazar con la cima de Risnjak, con el prado de Lazac en medio.


      Para ver animales, el parque organiza un programa de observación de fauna silvestre que empieza en la
      entrada principal de Crni Lug/Bijela Vodica, donde se queda con el guarda. Quien quiera subir a las
      montañas vecinas debe quedar antes, hacia el mediodía, y pasar la noche en una cabaña de troncos; se
      lleva comida y agua, porque allí solo hay agua para el baño. La reserva es obligatoria con siete días de
      antelación.
    history: >-
      Las primeras visitas científicas llegaron en 1825, y el primer refugio de montaña de la zona se levantó
      en 1932. El parque se amplió en 1997 y entonces entraron Snježnik y las fuentes del Kupa. El nombre de
      Risnjak tiene dos teorías: el lince, ris en croata, o risje, palabra local para un tipo de hierba.


      La conservación pasa por dar espacio. El parque pide que la franja de al menos 500 metros alrededor de
      sus límites se use con rigor para que los osos no sean atraídos hacia los comederos de los cotos
      vecinos. En Croacia viven unos 160 a 210 lobos, que están protegidos.


      En Guslica, a una hora a pie de Snježnik, queda un complejo militar yugoslavo abandonado desde 1991.
    before: >-
      El programa de observación de fauna exige reserva con siete días de antelación, y hay que llevar comida
      y agua. Desde Platak, cuenta con una hora hasta la cima. No confundas Snježnik con Snežnik, una meseta
      caliza de Eslovenia: son lugares distintos.
    around: >-
      Snježnik colinda con los [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/), el [Complejo Forestal de
      Kočevsko](/lugar/kocevski-gozdni-kompleks/) y el [Macizo Forestal de
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), todos a distancia casi nula. También figura
      cerca la [Reserva Estricta de Čorkova Uvala](/lugar/nacionalni-park-plitvicka-jezera-posebni-rezervat/),
      en el parque de Plitvice.
  en:
    intro: >-
      Snježnik translates roughly as «the snowy one», an epithet earned with good reason: despite its
      proximity to the Adriatic Sea, snow lingers across these heights well into late spring. It forms a
      rugged 10-kilometer limestone ridge trending northwest to southeast in western Gorski kotar above
      Rijeka, encircled by subalpine meadows. Its rocky peak, at 1506 metres, rises within Risnjak National
      Park as its second-highest apex, separated by just three kilometres from the summit of Mount Risnjak
      directly opposite.
    landscape: >-
      Standing on the apex puts the regional geography in perspective. The vista encompasses the islands of
      Kvarner Bay, the Gulf of Rijeka, Istria crowned by Mount Učka, Slovenia's Mount Snežnik, and on
      exceptionally clear days, the distant glaciated crests of the Kamnik-Savinja Alps. It offers one of
      Croatia's grandest panoramic viewpoints, owing to the massif's commanding elevation and isolation.


      Vegetation clings tightly to bare bedrock. Snježnik's flora withstands intense summer solar radiation,
      bitter winter frost, and ferocious winds; near the apex thrives the rare Karst edelweiss, subspecies
      Leontopodium alpinum krasense. Sweeping mountain meadows flank the crests, most notably the Lazac
      plateau, renowned for the vivid color palette of its alpine turf.


      Beneath the ridge, the national park reveals a karst landscape of limestone and dolomite hollowed by
      dolines, limestone pavement, chasms, and caves. Porous rock leaves few surface streams. The local
      climate blends maritime Adriatic and harsh continental weather systems: the Risnjak weather station
      records roughly 3600 millimetres of annual precipitation, among Croatia's wettest, and deep sinkholes
      called ponikve trap frigid air and snow through temperature inversions. Most of the park is cloaked in
      mixed beech and silver fir woods, giving way between 1200 and 1400 metres to subalpine crooked beech and
      dwarf mountain pine.
    wildlife: >-
      Croatia ranks among the few European territories where [brown bear](/especie/ursus_arctos/), [grey
      wolf](/especie/canis_lupus/), and [Eurasian lynx](/especie/lynx_lynx/) coexist in viable populations,
      and the forests around Risnjak serve as their core redoubt. The lynx, after which the park was
      christened, disappeared during the nineteenth century before returning following successful
      reintroductions in neighboring Slovenia. It remains the rarest and most secretive predator, seldom
      glimpsed. Biologists track two resident wolf packs in the area: the Risnjak pack and the Snježnik pack.
      Brown bear movements have been monitored since the nineteen-eighties across ranges extending far beyond
      park boundaries.


      The woodlands also support [red deer](/especie/cervus_elaphus/), [roe
      deer](/especie/capreolus_capreolus/), and [wild boar](/especie/sus_scrofa/). The
      [chamois](/especie/rupicapra_rupicapra/) population has diminished, prompting park plans for active
      reintroduction. Notable avian residents include the [western capercaillie](/especie/tetrao_urogallus/),
      hazel grouse, goshawk, and [Eurasian eagle-owl](/especie/bubo_bubo/); in total, observers have
      documented 114 bird species within the park and its buffer zones.


      Two moments highlight the calendar: in late August and early September, the red deer rut begins,
      heralded by the park as the pinnacle of autumn wildlife activity. In winter, the massif becomes
      Croatia's premier ski-mountaineering playground, favored for its easy access from the nearby Platak
      winter sports area.
    visit: >-
      From Platak, hikers can summit Snježnik in roughly one hour. The standard ascent follows the scenic
      Greben ridge up to the rocky peak, returning via the western gully known as Grlo. For a more ambitious
      outing, park rangers recommend linking Snježnik to the main summit of Mount Risnjak across the
      intervening Lazac meadow.


      To observe wildlife, the park authority operates a structured wildlife watching program departing from
      the main park entrance at Crni Lug/Bijela Vodica, accompanied by an official ranger. Visitors seeking
      overnight observation posts rendezvous around midday and spend the night in secluded timber hides; you
      must bring your own food and drinking water, as hides provide only non-potable washing water. Advance
      booking is mandatory at least seven days beforehand.
    history: >-
      The earliest botanical expeditions explored the massif in 1825, and the area's inaugural mountain refuge
      was erected in 1932. Risnjak National Park was formally expanded in 1997 to incorporate the Snježnik
      ridge and the karst springs of the Kupa River. Two theories explain the name Risnjak: either from ris,
      the Croatian word for lynx, or from risje, an archaic regional term for a native moor grass.


      Conservation hinges on buffer corridors. The park administration urges rigorous stewardship over a
      protective strip of at least 500 metres along its boundaries to deter bears from venturing toward
      feeding stations in adjacent hunting estates. Across Croatia live approximately 160 to 210 wolves under
      strict legal protection.


      At Guslica, located one hour on foot from Snježnik, sits a decommissioned Yugoslav subterranean military
      outpost abandoned since 1991.
    before: >-
      The wildlife watching program requires reservations at least seven days in advance. For climbing
      Snježnik, sturdy trekking boots with reliable tread are indispensable: the fractured limestone along the
      ridge is razor-sharp and turns treacherous when damp or snowbound.
    around: >-
      Roughly thirty kilometres to the north across the Slovenian border, the [Snežnik Forest
      Massif](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) shares its name, bears, and lynx. Further east,
      the [Kočevje Forest Complex](/lugar/kocevski-gozdni-kompleks/) and [Javorniki Forest
      Plateau](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) form part of the same uninterrupted
      Dinaric forest belt. To the south, [Plitvice Lakes National
      Park](/lugar/nacionalni-park-plitvicka-jezera-posebni-rezervat/) also protects bears, wolves, and lynx.
  fr:
    intro: >-
      Snježnik signifie à peu près « l'enneigé », un nom amplement mérité : en dépit de la proximité de la mer
      Adriatique, la neige persiste ici jusqu'au cœur du printemps. Il s'agit d'une crête rocheuse de 10
      kilomètres orientée du nord-ouest au sud-est dans le Gorski kotar occidental, sur les hauteurs de
      Rijeka, ceinte de prairies d'altitude. Son sommet de 1506 mètres s'élève dans le parc national de
      Risnjak, dont il constitue le second point culminant, distant de seulement trois kilomètres du mont
      Risnjak qui lui fait face.
    landscape: >-
      Depuis le sommet, la vue embrasse tout le relief environnant. On aperçoit les îles du golfe de Kvarner,
      la baie de Rijeka, l'Istrie dominée par le mont Učka, le Snežnik slovène et, par excellente visibilité,
      les crêtes étincelantes des Alpes de Kamnik-Savinja. C'est l'un des panoramas les plus réputés de
      Croatie, favorisé par la hauteur et l'isolement du chaînon.


      Sur la roche nue, la flore fait preuve d'une remarquable résistance. Les plantes du Snježnik affrontent
      les canicules estivales, le gel hivernal et de violents coups de vent ; près du sommet s'épanouit
      l'edelweiss du Karst, sous-espèce Leontopodium alpinum krasense. Des pelouses subalpines tapissent les
      abords, en particulier le plateau de Lazac réputé pour sa variété floristique chatoyante.


      Sous la crête, le parc national forme un univers calcaire et dolomitique creusé de dolines, lapiaz,
      gouffres et grottes. La roche étant perméable, les écoulements de surface restent rares. Le climat
      combine influences adriatiques et continentales : la station du mont Risnjak enregistre environ 3600
      millimètres de pluie par an, parmi les records nationaux, et les dolines ou ponikve emprisonnent l'air
      froid et la neige par inversion thermique. L'essentiel du parc est couvert d'une forêt mixte de hêtre et
      sapin, relayée entre 1200 et 1400 mètres par la hêtraie subalpine puis par les pins nains.
    wildlife: >-
      La Croatie est l'un des rares pays d'Europe où cohabitent l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/), et les massifs de Risnjak leur
      servent de havre privilégié. Le lynx, qui donna son nom au parc, disparut au cours du dix-neuvième
      siècle avant d'être réintroduit depuis la Slovénie voisine. Il demeure le prédateur le plus rare et le
      plus farouche. Les gardes pistent deux meutes de loups : celle de Risnjak et celle de Snježnik. Les ours
      font l'objet d'un suivi scientifique depuis les années quatre-vingt, sur un territoire débordant
      largement les limites du parc.


      On y croise aussi le [cerf élaphe](/especie/cervus_elaphus/), le
      [chevreuil](/especie/capreolus_capreolus/) et le [sanglier](/especie/sus_scrofa/). Le
      [chamois](/especie/rupicapra_rupicapra/) a régressé et fait l'objet de réflexions pour un renforcement.
      Parmi les oiseaux nichent le [grand tétras](/especie/tetrao_urogallus/), la gélinotte des bois, l'autour
      des palombes et le [hibou grand-duc](/especie/bubo_bubo/) ; 114 espèces aviaires ont été recensées dans
      le parc et sa zone périphérique.


      Deux périodes marquent l'année : fin août et début septembre résonne le brame du cerf, moment d'activité
      animale maximale selon les gardes. En hiver, le massif devient le secteur le plus prisé de Croatie pour
      le ski de randonnée, grâce aux installations de la station voisine de Platak.
    visit: >-
      Depuis Platak, le sommet s'atteint en environ une heure de montée. L'itinéraire le plus classique
      emprunte la crête panoramique de Greben jusqu'au sommet avant de redescendre par le couloir ouest de
      Grlo. Si vous disposez de davantage de temps, le parc conseille d'enchaîner avec le mont Risnjak en
      traversant la combe herbeuse de Lazac.


      Pour l'observation de la faune, le parc propose un programme guidé au départ de la maison du parc à Crni
      Lug/Bijela Vodica avec un garde forestier. Pour monter aux postes d'affût d'altitude, le rendez-vous a
      lieu vers midi pour passer la nuit dans un refuge en rondins ; prévoyez eau et nourriture, l'eau sur
      place n'étant pas potable. La réservation est obligatoire sept jours à l'avance.
    history: >-
      Les premières explorations scientifiques remontent à 1825, et le premier refuge de montagne fut érigé en
      1932. Le parc national fut étendu en 1997 pour englober la crête de Snježnik et les sources de la Kupa.
      Le nom de Risnjak suscite deux hypothèses : le mot ris désignant le lynx en croate, ou risje, désignant
      une graminée des sous-bois.


      La quiétude dépend des zones tampons. Le parc demande qu'une bande périphérique d'au moins 500 mètres
      soit préservée sans agrainage de chasse pour éviter d'attirer les ours vers les domaines de chasse
      limitrophes. La Croatie abrite entre 160 et 210 loups strictement protégés.


      À Guslica, à une heure de marche du Snježnik, subsiste une base militaire yougoslave abandonnée depuis
      1991.
    before: >-
      Le programme d'observation de la faune nécessite une réservation sept jours à l'avance. Pour gravir le
      Snježnik, équipez-vous de chaussures de montagne à semelle crantée : les lapiaz calcaires de la crête
      sont acérés et s'avèrent glissants sous la pluie ou le givre.
    around: >-
      À une trentaine de kilomètres au nord, au-delà de la frontière slovène, le [massif forestier de
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) partage le même toponyme, l'ours et le lynx.
      Vers l'est, la [forêt de Kočevje](/lugar/kocevski-gozdni-kompleks/) et le [plateau karstique de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) s'intègrent au même massif boisé
      continu. Au sud, le [parc national des lacs de
      Plitvice](/lugar/nacionalni-park-plitvicka-jezera-posebni-rezervat/) protège aussi ours, loups et lynx.
  de:
    intro: >-
      Snježnik bedeutet sinngemäß «der Schneeige», und dieser Beiname hat seine Berechtigung: Trotz der
      relativen Nähe zur Adria halten sich die Schneefelder hier oft bis weit in das Frühjahr. Der
      Gebirgsstock bildet einen 10 Kilometer langen Felskamm, der im westlichen Gorski kotar oberhalb von
      Rijeka von Nordwesten nach Südosten zieht und von Almwiesen gesäumt wird. Sein 1506 Meter hoher Gipfel
      liegt im Nationalpark Risnjak als dessen zweithöchste Erhebung, nur drei Kilometer Luftlinie vom
      gegenüberliegenden Hauptgipfel des Risnjak entfernt.
    landscape: >-
      Vom Felsgipfel aus erschließt sich das Panorama der Region. Der Blick reicht über die Inseln der
      Kvarner-Bucht, die Bucht von Rijeka, die Halbinsel Istrien mit dem Berg Učka, den slowenischen Snežnik
      und an klaren Tagen bis zu den fernen Gipfeln der Steiner Alpen. Es gilt als einer der eindrucksvollsten
      Aussichtspunkte Kroatiens, begünstigt durch die freistehende Höhe des Massivs.


      Auf dem nackten Karstfels trotzt eine zähe Vegetation der Witterung. Die Pflanzen des Snježnik
      widerstehen sommerlicher Hitze, klirrender Kälte und stürmischen Winden; in Gipfelnähe wächst das
      seltene Karst-Edelweiß, Unterart Leontopodium alpinum krasense. Ringsum breiten sich Bergwiesen aus,
      allen voran die Lazac-Hochfläche, die für ihren botanischen Blütenreichtum gerühmt wird.


      Unterhalb des Kammes erstreckt sich eine Karstlandschaft aus Kalkstein und Dolomit mit Dolinen,
      Karrenfeldern, Klüften und Höhlen. Aufgrund der Durchlässigkeit des Gesteins gibt es kaum oberirdische
      Fließgewässer. Das Klima verbindet adriatische Feuchte und kontinentale Kälte: Bei der Risnjak-Hütte
      fallen jährlich rund 3600 Millimeter Niederschlag, Spitzenwerte im Landesvergleich, und in den
      Karsttrichtern namens Ponikve staut sich durch Kaltluftseen der Schnee besonders lange. Der Großteil des
      Parks besteht aus Buchen-Tannen-Mischwäldern, die zwischen 1200 und 1400 Metern in subalpine
      Krummholzbuchen und Legföhren übergehen.
    wildlife: >-
      Kroatien gehört zu den wenigen Ländern Europas, in denen [Braunbär](/especie/ursus_arctos/),
      [Wolf](/especie/canis_lupus/) und [Eurasischer Luchs](/especie/lynx_lynx/) dauerhaft nebeneinander
      leben, und das Bergland des Risnjak dient ihnen als Kernrefugium. Der Luchs, nach dem der Park benannt
      wurde, starb im neunzehnten Jahrhundert aus und kehrte erst nach einer Auswilderung im benachbarten
      Slowenien zurück. Er bleibt die seltenste und scheuste Raubkatze. Bei den Wölfen werden zwei Rudel
      beobachtet: das Risnjak- und das Snježnik-Rudel. Bären werden seit den achtziger Jahren erforscht und
      beanspruchen Streifgebiete, die weit über den Park hinausreichen.


      Ebenso leben hier [Rothirsch](/especie/cervus_elaphus/), [Reh](/especie/capreolus_capreolus/) und
      [Wildschwein](/especie/sus_scrofa/). Die Bestände der [Gämse](/especie/rupicapra_rupicapra/) gingen
      zurück, weshalb der Park Wiederansiedlungen plant. Unter den Vögeln brüten
      [Auerhuhn](/especie/tetrao_urogallus/), Haselhuhn, Habicht und [Uhu](/especie/bubo_bubo/); insgesamt
      wurden 114 Vogelarten im Parkgebiet dokumentiert.


      Zwei Jahreshöhepunkte prägen den Rhythmus: Ende August und Anfang September beginnt die Hirschbrunft,
      die von der Parkverwaltung als intensivste Phase tierischer Aktivität bezeichnet wird. Im Winter ist das
      Massiv das bekannteste Skitourengebiet Kroatiens, begünstigt durch die Nähe zur Liftstation Platak.
    visit: >-
      Von Platak aus erreichst du den Gipfel in etwa einer Gehzeit von einer Stunde. Der bequemste Aufstieg
      führt über den felsigen Greben-Kamm zum Gipfelkreuz und über die Rinne Grlo an der Westflanke hinab.
      Wenn du mehr Zeit mitbringst, empfiehlt die Parkverwaltung die Überschreitung zum Gipfel des Risnjak
      über die Hochwiese Lazac.


      Zur Tierbeobachtung veranstaltet die Parkverwaltung geführte Wildbeobachtungstouren ab dem Haupteingang
      in Crni Lug/Bijela Vodica in Begleitung eines Rangers. Wer in den Beobachtungshütten im Gebirge ansitzen
      möchte, trifft den Ranger gegen Mittag und übernachtet in einer Blockhütte; eigene Verpflegung und
      Trinkwasser sind mitzubringen, da vor Ort nur Brauchwasser vorhanden ist. Eine Voranmeldung ist sieben
      Tage im Voraus zwingend erforderlich.
    history: >-
      Erste naturwissenschaftliche Erkundungen fanden 1825 statt, und die erste Schutzhütte entstand 1932. Der
      Nationalpark wurde 1997 erweitert, wobei der Snježnik-Kamm und die Karstquellen der Kupa eingegliedert
      wurden. Für den Namen Risnjak gibt es zwei Deutungen: vom kroatischen Wort ris für Luchs oder von risje,
      einer volkstümlichen Bezeichnung für ein Waldgras.


      Der Artenschutz verlangt Pufferzonen. Die Parkverwaltung fordert, einen Streifen von mindestens 500
      Metern um die Parkgrenzen streng zu überwachen, damit Bären nicht an Futterstellen benachbarter
      Jagdreviere gelockt werden. In Kroatien leben schätzungsweise 160 bis 210 streng geschützte Wölfe.


      Auf dem Gipfel Guslica, eine Gehstunde vom Snježnik entfernt, steht eine unterirdische jugoslawische
      Militäranlage, die seit 1991 verlassen ist.
    before: >-
      Das Wildbeobachtungsprogramm verlangt eine Buchung mindestens sieben Tage im Voraus. Für die Besteigung
      des Snježnik sind feste Bergschuhe mit griffigem Profil unverzichtbar: Das Karrengestein am Grat ist
      scharfkantig und wird bei Nässe oder Eis tückisch rutschig.
    around: >-
      Rund dreißig Kilometer nördlich jenseits der slowenischen Grenze teilt das [Waldmassiv
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) Namen, Bären und Luchse. Weiter östlich bilden
      der [Waldkomplex von Kočevje](/lugar/kocevski-gozdni-kompleks/) und das [Karstplateau
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) denselben dinarischen Urwaldkorridor.
      Südlich schützt auch der [Nationalpark Plitvicer
      Seen](/lugar/nacionalni-park-plitvicka-jezera-posebni-rezervat/) Bären, Wölfe und Luchse.
  it:
    intro: >-
      Snježnik significa pressappoco «l'innevato», appellativo pienamente meritato: malgrado la vicinanza al
      mare Adriatico, i banchi di neve resistono qui fino a primavera inoltrata. Si tratta di una cresta
      rocciosa di 10 chilometri che corre da nord-ovest a sud-est nel Gorski kotar occidentale, alle spalle di
      Fiume (Rijeka), cinta da pascoli d'alta quota. La sua vetta, a quota 1506 metri, sorge all'interno del
      Parco nazionale di Risnjak di cui costituisce la seconda cima, separata da appena tre chilometri dalla
      vetta gemella del monte Risnjak.
    landscape: >-
      Dalla sommità lo sguardo spazia sull'intera regione. Si distinguono le isole del golfo del Quarnaro, la
      baia di Fiume, l'Istria con il monte Maggiore (Učka), il monte Snežnik in Slovenia e, con atmosfera
      tersa, le vette lontane delle Alpi di Kamnik-Savinja. È uno dei panorami più spettacolari della Croazia,
      favorito dall'isolamento e dall'altitudine del massiccio.


      Sulla roccia nuda la vegetazione resiste tenacemente. La flora dello Snježnik affronta l'insolazione
      estiva, il gelo e i venti impetuosi; vicino alla cima fiorisce la stella alpina del Carso, sottospecie
      Leontopodium alpinum krasense. Tutt'intorno si aprono praterie subalpine, tra cui spicca l'altopiano di
      Lazac per la vivacità cromatica delle sue specie.


      Sotto la cresta, il parco è un comprensorio carsico di calcari e dolomie solcato da doline, campi
      carreggiati, inghiottitoi e grotte. La permeabilità della roccia fa sì che le acque scorrano quasi solo
      nel sottosuolo. Il clima fonde correnti adriatiche e rigori continentali: presso il rifugio di Risnjak
      cadono circa 3600 millimetri di pioggia all'anno, tra i valori più alti del paese, e le doline dette
      ponikve trattengono a lungo neve e freddo per inversione termica. Gran parte del territorio è ammantata
      da faggete e abetine, che tra 1200 e 1400 metri cedono il passo al faggio contorto subalpino e al pino
      mugo.
    wildlife: >-
      La Croazia è uno dei pochi paesi europei in cui convivono stabilmente l'[orso
      bruno](/especie/ursus_arctos/), il [lupo grigio](/especie/canis_lupus/) e la [lince
      eurasiatica](/especie/lynx_lynx/), e le foreste del Risnjak ne custodiscono il rifugio primario. La
      lince, che ha dato il nome al parco, si estinse nel corso del diciannovesimo secolo prima di riapparire
      grazie alle reintroduzioni nella vicina Slovenia. Rimane il predatore più elusivo e raro. Nel
      comprensorio si seguono due branchi di lupi: quello di Risnjak e quello di Snježnik. Gli orsi sono
      monitorati dagli anni ottanta su territori che oltrepassano di gran lunga i confini dell'area protetta.


      I boschi ospitano anche il [cervo](/especie/cervus_elaphus/), il
      [capriolo](/especie/capreolus_capreolus/) e il [cinghiale](/especie/sus_scrofa/). Il [camoscio
      alpino](/especie/rupicapra_rupicapra/) si è rarefatto e il parco valuta interventi di ripopolamento. Tra
      i volatili nidificano il [gallo cedrone](/especie/tetrao_urogallus/), il francolino di monte, l'astore e
      il [gufo reale](/especie/bubo_bubo/); complessivamente sono state censite 114 specie ornitiche.


      I due momenti cardine dell'anno: tra fine agosto e inizio settembre inizia il bramito del cervo,
      considerato dai guardaparco l'apice dell'attività animale. D'inverno il massiccio diventa la mèta
      prediletta in Croazia per lo scialpinismo, grazie alla vicinanza agli impianti di Platak.
    visit: >-
      Dalla località di Platak si sale alla cima in circa un'ora di cammino. La via più agevole percorre la
      panoramica cresta di Greben fino alla sommità per poi scendere lungo il canalone occidentale di Grlo.
      Con più tempo a disposizione, il parco suggerisce di compiere la traversata verso la cima del Risnjak
      passando per il pascolo di Lazac.


      Per l'avvistamento degli animali, l'ente parco cura un programma di osservazione della fauna con
      partenza dalla sede di Crni Lug/Bijela Vodica assieme a un guardaparco. Chi intende salire ai capanni
      d'alta quota concorda il ritrovo verso mezzogiorno per pernottare in una baita di tronchi; occorre
      portare provviste e acqua potabile, essendovi solo acqua per i servizi igienici. La prenotazione è
      obbligatoria con almeno sette giorni di anticipo.
    history: >-
      Le prime indagini scientifiche risalgono al 1825, e il primo rifugio alpino venne costruito nel 1932. Il
      parco nazionale venne esteso nel 1997 includendo il crinale dello Snježnik e le sorgenti del fiume Kupa.
      L'origine del toponimo Risnjak rimanda a due tesi: ris, termine croato per lince, oppure risje, nome
      dialettale di un'erba forestale.


      La salvaguardia esige fasce di rispetto. Il parco raccomanda che una fascia cuscinetto di almeno 500
      metri attorno ai confini sia gestita rigorosamente per non attirare gli orsi verso i carnai delle
      riserve di caccia contigue. In Croazia vivono tra 160 e 210 lupi rigorosamente protetti.


      A Guslica, a un'ora a piedi dallo Snježnik, sorge una base militare sotterranea jugoslava in disuso dal
      1991.
    before: >-
      Il programma di osservazione della fauna richiede la prenotazione con sette giorni di anticipo. Per
      salire allo Snježnik indossa scarponi da trekking con suola ben scolpita: il terreno calcareo di cresta
      è affilato e diventa scivoloso con pioggia o neve.
    around: >-
      Circa trenta chilometri a nord, oltre il confine sloveno, il [Complesso Forestale di
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) condivide nome, orsi e linci. Verso est, la
      [Foresta di Kočevje](/lugar/kocevski-gozdni-kompleks/) e l'[Altopiano di
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) costituiscono lo stesso corridoio
      boschivo dinarico. A sud, il [Parco nazionale dei laghi di
      Plitvice](/lugar/nacionalni-park-plitvicka-jezera-posebni-rezervat/) tutela anch'esso orso, lupo e
      lince.
  pt:
    intro: >-
      Snježnik significa sensivelmente «o nevado», designação inteiramente justificada: não obstante a
      proximidade com o mar Adriático, os lençóis de neve perduram aqui até bem avançada a primavera.
      Constitui uma crista rochosa de 10 quilómetros orientada de noroeste a sudeste no Gorski kotar
      ocidental, na retaguarda de Rijeka, rodeada de pastagens de altitude. O seu cimo escarpado, a 1506
      metros de altitude, integra o Parque Nacional de Risnjak como segundo ponto culminante, separado por
      escassos três quilómetros do pico gémeo de Risnjak.
    landscape: >-
      Do topo do relevo descortina-se a geografia circundante. Avistam-se as ilhas do golfo de Kvarner, a baía
      de Rijeka, a Ístria coroada pelo monte Učka, o Snežnik esloveno e, sob atmosfera limpa, as cristas
      distantes dos Alpes de Kamnik-Savinja. É um dos miradouros mais deslumbrantes da Croácia, proporcionado
      pelo isolamento e altitude do maciço.


      Na rocha nua, a vegetação resiste com vigor. As plantas de Snježnik suportam o calor do estio, o gelo
      invernal e vendavais furiosos; junto ao topo floresce o raro edelvais do Carso, subespécie Leontopodium
      alpinum krasense. Em redor estendem-se prados de montanha, destacando-se a planura de Lazac pela
      exuberância colorida da sua flora alpina.


      Sob a crista, o parque abre-se num universo cársico de calcários e dolomitos retalhado por dolinas,
      campos de lapiás, algares e grutas. A natureza permeável da rocha faz com que quase não existam linhas
      de água superficiais. O clima conjuga influências adriáticas e rigor continental: junto ao refúgio de
      Risnjak registam-se cerca de 3600 milímetros de precipitação anual, dos valores mais elevados do país, e
      os sumidouros chamados ponikve retêm o ar gélido e a neve por inversão térmica. O manto florestal
      dominante é o bosque misto de faia e abeto, que entre os 1200 e os 1400 metros dá lugar ao faial
      subalpino e ao pinheiro-anão.
    wildlife: >-
      A Croácia figura entre os raros territórios europeus onde coexistem o
      [urso-pardo](/especie/ursus_arctos/), o [lobo-cinzento](/especie/canis_lupus/) e o
      [lince-euroasiático](/especie/lynx_lynx/), constituindo os contrafortes de Risnjak o seu refúgio
      fulcral. O lince, que deu nome ao parque, extinguiu-se no século dezanove e regressou após repovoamentos
      na vizinha Eslovénia. É o carnívoro mais escasso e esquivo. Entre os lobos monitorizam-se duas
      alcateias: a de Risnjak e a de Snježnik. Os ursos são acompanhados desde os anos oitenta em territórios
      que ultrapassam largamente os limites da reserva.


      Estas matas acolhem ainda o [veado-vermelho](/especie/cervus_elaphus/), a
      [corça](/especie/capreolus_capreolus/) e o [javali](/especie/sus_scrofa/). A
      [camurça](/especie/rupicapra_rupicapra/) rarefiz-se, existindo planos de reforço populacional. Entre a
      avifauna nidificam o [tetraz-grande](/especie/tetrao_urogallus/), a galinha-do-mato, o açor e o
      [bufo-real](/especie/bubo_bubo/); somam-se 114 espécies ornitológicas registadas.


      Dois períodos pontuam o ano: em finais de agosto e princípios de setembro inicia-se a brama dos veados,
      considerada o apogeu da vivência faunística. No inverno, o maciço converte-se no principal destino
      croata para esqui de travessia, beneficiando da proximidade com a estância de Platak.
    visit: >-
      A partir de Platak alcança-se o cume em cerca de uma hora de caminhada. A subida mais direta segue a
      crista rochosa de Greben até ao ponto mais alto, descendo pelo barranco de Grlo na encosta ocidental.
      Dispondo de mais tempo, o parque sugere efetuar a travessia até ao cume de Risnjak passando pela campina
      de Lazac.


      Para a observação de fauna, a direção do parque organiza um programa acompanhado por um guarda florestal
      com início no centro de Crni Lug/Bijela Vodica. Quem pretenda vigiar a partir dos abrigos de montanha
      junta-se ao guarda por volta do meio-dia para pernoitar numa cabana de troncos; é necessário levar
      comida e água potável, pois no local existe apenas água para higiene. A reserva é obrigatória com sete
      dias de antecedência.
    history: >-
      As pioneiras expedições científicas ocorreram em 1825, e o primeiro abrigo de montanha surgiu em 1932. O
      parque nacional foi alargado em 1997, integrando a crista de Snježnik e as nascentes do rio Kupa. Há
      duas teses para a origem de Risnjak: ris, vocábulo croata para lince, ou risje, designação popular de
      uma gramínea silvestre.


      A preservação exige faixas tampão. O parque requer que uma orla de pelo menos 500 metros em redor dos
      seus limites seja gerida com rigor para que os ursos não sejam cevados nos coutos de caça adjacentes. Na
      Croácia vivem cerca de 160 a 210 lobos sob proteção integral.


      Em Guslica, a uma hora a pé de Snježnik, subsiste um complexo militar subterrâneo jugoslavo desativado
      desde 1991.
    before: >-
      O programa de observação de fauna carece de reserva prévia com sete dias de antecedência. Para subir ao
      Snježnik impõe-se calçado de caminhada com sola aderente: os lapiás calcários da crista são aguçados e
      tornam-se escorregadios sob chuva ou neve.
    around: >-
      Cerca de trinta quilómetros a norte, transpondo a fronteira eslovena, o [Maciço Florestal de
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) partilha o nome, ursos e linces. Mais a leste, o
      [Complexo Florestal de Kočevje](/lugar/kocevski-gozdni-kompleks/) e o [Planalto de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) formam a mesma mancha florestal
      dinárica contínua. Para sul, o [Parque Nacional dos Lagos de
      Plitvice](/lugar/nacionalni-park-plitvicka-jezera-posebni-rezervat/) alberga também urso, lobo e lince.
