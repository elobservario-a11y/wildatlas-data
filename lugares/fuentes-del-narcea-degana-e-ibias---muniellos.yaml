observaciones:
  es: >-
    Lleva el documento de autorización y el DNI usado en la solicitud. Muniellos cierra los días 1 y 6 de
    enero y los días 24, 25 y 31 de diciembre. La reserva puede cerrar sin aviso por riesgo de incendio, clima
    extremo o razones de conservación, y entonces se anulan los permisos. El itinerario habitual recorre unos
    veinte kilómetros y tiene desniveles acusados, por lo que requiere preparación física. En el parque
    natural, los perros deben ir con correa.
texto:
  es:
    intro: >-
      Para entrar en Muniellos necesitas permiso, un día fijado y un DNI. El bosque más celebrado de la
      cordillera Cantábrica no se visita: se reserva. Es la Reserva Natural Integral de Muniellos, 59,7 km²
      con tres montes (Muniellos, La Viliella y Valdebois) dentro del Parque Natural de Fuentes del Narcea,
      Degaña e Ibias, en el suroeste de Asturias. Protege el mayor robledal de roble albar de la península y
      uno de los mejores conservados de Europa.
    landscape: >-
      La altitud de la reserva va de 680 m a 1640 m, en el pico de la Candanosa. El bosque se asienta sobre un
      sustrato paleozoico de unos 500 millones de años, casi todo silíceo, y los procesos tectónicos modelaron
      un relieve abrupto. Aún se ven antiguos circos glaciares y las lleronas, canchales de cuarcita
      desmenuzada; del origen glaciar dan fe las lagunas del pico de la Candanosa, y las lagunas de montaña y
      turberas del Cueto de Arbás ocupan cubetas de excavación glaciar.


      Sobre ese suelo pobre crece el bosque. Dominan el roble albar, el castaño y el haya; en los valles hay
      avellanos, arces, fresnos, sauces y alisos, y en las cotas altas aparece el abedular. En el parque
      natural, el hayedo del valle del Hermo, de unos diez kilómetros, es el mayor y mejor conservado de los
      hayedos, y en la alta montaña hay matorrales de enebros, brecinas y arándanos, muy característicos en el
      Cueto de Arbás.
    wildlife: >-
      Muniellos es territorio del [oso pardo](/especie/ursus_arctos/). Viven allí también el
      [lobo](/especie/canis_lupus/), que depreda sobre todo corzo y jabalí, la
      [nutria](/especie/lutra_lutra/), el zorro y el gato montés. En conjunto, en la reserva viven más de 150
      especies de vertebrados y más de 100 de aves, con la salamandra rabilarga en las charcas y turberas y la
      liebre de piornal entre sus emblemas.


      Entre las aves, el [urogallo](/especie/tetrao_urogallus/) y el [pito negro](/especie/dryocopus_martius/)
      son las de mayor interés y más ligadas al bosque. El urogallo, en peligro de extinción, habita los
      bosques de Hermo, Degaña y Muniellos. Entre las rapaces nocturnas destaca por su abundancia el cárabo
      común. En el parque abundan los corzos y los rebecos, y en los ríos se ve la nutria.


      La temporada va de mayo a noviembre, con espectacular colorido en otoño.
    visit: >-
      El permiso se pide desde el 15 de diciembre del año anterior; se concede un único permiso por persona y
      año. Hay que confirmarlo entre 23 y 15 días antes de la fecha reservada: si no, se anula. La entrada y
      la salida se hacen solo por Tablizas, donde está el centro de recepción de visitantes. Hay dos
      itinerarios: la ruta de Fonculebrera, circular de 20 km con desniveles acusados, y la ruta del río, de
      ida y vuelta, y desde ambas se llega a la primera laguna, la de la Isla.


      El Centro de Interpretación de la Reserva, en Obacho, es un edificio nuevo sobre un mirador natural del
      bosque. Y fuera de la reserva, el parque natural tiene la Casa del Parque en Courias, el Aula de la
      Naturaleza y centro de la Palloza de Ibias en San Antolín y el centro Casa Florencio en Zarréu (Degaña).
      Para caminar sin permiso están la subida al Cueto de Arbas, el Pomar de las Montañas, la laguna de
      Chagüeños y el dolmen da Hucha, además del mirador del Alto del Acebo; el Gran Recorrido GR 203, «Por
      donde camina el oso», recorre toda la Reserva de la Biosfera.
    history: >-
      La explotación de la madera para los astilleros de la Armada en Ferrol empezó hacia 1766, y en 1789 se
      detuvo la tala para los buques. En 1973 el Estado compró el monte, lo declaró coto nacional de caza y
      desde entonces se prohibió la caza y se protegió toda la fauna. En 1982 limitó las visitas a 20 personas
      al día y prohibió acampar, llevar perros, pescar y pernoctar en el bosque. Es Reserva de la Biosfera
      desde 2000 y Reserva Natural Integral desde la ley de 2002.


      La huella humana es más antigua: hay muchas pruebas de actividad romana, con restos de explotaciones
      auríferas y asentamientos castreños. La palloza, vivienda circular de piedra seca con cubierta de paja
      de centeno, conserva el parecido con la casa castreña, y los cortinos son muros circulares de piedra
      seca de dos metros, sin cubierta, para proteger las colmenas del oso.
    before: >-
      Lleva el documento de autorización y el DNI usado en la solicitud. Muniellos cierra los días 1 y 6 de
      enero y los días 24, 25 y 31 de diciembre. La reserva puede cerrar sin aviso por riesgo de incendio,
      clima extremo o razones de conservación, y entonces se anulan los permisos. El itinerario habitual
      recorre unos veinte kilómetros y tiene desniveles acusados, por lo que requiere preparación física. En
      el parque natural, los perros deben ir con correa.
    around: >-
      El [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) está a 1 km, y el [Serra do
      Courel](/lugar/zec-serra-do-courel/), a 5 km, todos en la Cantábrica occidental.
  en:
    intro: >-
      To enter Muniellos you need an official permit, a designated date, and your national ID. The most
      celebrated forest of the Cantabrian Mountains cannot simply be visited: it must be booked well in
      advance. This is the Muniellos Integral Nature Reserve, 59.7 km² encompassing three massifs (Muniellos,
      La Viliella, and Valdebois) within the Natural Park of Fuentes del Narcea, Degaña e Ibias, in
      southwestern Asturias. It safeguards the largest sessile oak woodland on the Iberian Peninsula and one
      of the most intact surviving in Europe.
    landscape: "The reserve rises from 680 m up to 1640 m at the peak of La Candanosa. The forest is rooted on an ancient Palaeozoic substrate dating back some 500 million years, overwhelmingly siliceous, with tectonic activity having carved a deeply rugged topography. Ancient glacial cirques and lleronas—scree slopes of shattered quartzite—are clearly visible; the mountain tarns beneath the peak of La Candanosa bear witness to glacial origins, while the alpine tarns and peat bogs of Cueto de Arbás occupy glacially excavated hollows.\r\n\r\nUpon this nutrient-poor ground thrives the forest. Sessile oak, sweet chestnut, and beech dominate; throughout the valley floors grow hazel, sycamore, ash, willow, and alder, giving way to birch at higher elevations. Within the broader natural park, the beech forest of the Hermo Valley, stretching for about ten kilometres, is the largest and best preserved of its kind, while the high mountains feature dwarf juniper, heather, and bilberry scrub, particularly characteristic across Cueto de Arbás."
    wildlife: "Muniellos is core territory for the [brown bear](/especie/ursus_arctos/). The [grey wolf](/especie/canis_lupus/) also roams here, preying primarily on roe deer and wild boar, alongside the [Eurasian otter](/especie/lutra_lutra/), red fox, and European wildcat. All told, more than 150 vertebrate species and over 100 bird species inhabit the reserve, with the gold-striped salamander dwelling in mountain pools and peatlands, and the broom hare standing among its emblematic fauna.\r\n\r\nAmong birds, the [western capercaillie](/especie/tetrao_urogallus/) and the [black woodpecker](/especie/dryocopus_martius/) are of prime conservation interest and deeply bound to mature woodland. The capercaillie, critically endangered in the Cantabrian range, persists in the forests of Hermo, Degaña, and Muniellos. Tawny owls are the most abundant nocturnal raptors. Roe deer and Cantabrian chamois are widespread throughout the park, and otters patrol the river corridors.\r\n\r\nThe best visiting season spans May to November, with autumn displaying extraordinary foliage."
    visit: "Permits can be requested starting on 15 December of the previous year; each person is granted only a single permit per calendar year. You must reconfirm your reservation between 23 and 15 days prior to the booked visit: failure to do so will result in immediate cancellation. Entry and exit take place strictly via Tablizas, where the visitor reception centre is located. Two marked routes are available: the Fonculebrera circuit, a challenging circular hike of 20 km with steep elevation changes, and the river trail, an out-and-back walk; both itineraries lead to the first glacial tarn, Laguna de la Isla.\r\n\r\nThe reserve interpretation centre at Obacho is a modern facility set atop a commanding natural viewpoint overlooking the forest canopy. Outside the strict reserve, the natural park maintains the Casa del Parque in Courias, the Nature Classroom and Palloza visitor centre of Ibias in San Antolín, and Casa Florencio in Zarréu (Degaña). For walking without special permits, notable excursions include the ascent of Cueto de Arbas, Pomar de las Montañas, Laguna de Chagüeños, and the dolmen of A Hucha, alongside the Alto del Acebo viewpoint; the long-distance trail GR 203, «Where the Bear Walks», traverses the entire biosphere reserve."
    history: "Timber exploitation for the Royal Navy shipyards in Ferrol began around 1766, continuing until logging for naval vessels was halted in 1789. In 1973 the Spanish state purchased the woodland, declaring it a national hunting preserve, thereby immediately banning all hunting and placing all wildlife under strict protection. In 1982 daily visitation was capped at 20 people, and wild camping, bringing dogs, fishing, and overnight stays in the forest were strictly forbidden. It was designated a UNESCO Biosphere Reserve in 2000 and established as an Integral Nature Reserve by regional law in 2002.\r\n\r\nHuman heritage reaches back far earlier: widespread evidence of Roman mining activity survives, alongside ancient hillfort settlements (castros). The palloza, a traditional circular drystone dwelling thatched with rye straw, preserves close architectural ties to Celtic-era hillfort houses, while cortinos are two-metre-high circular drystone enclosures built without roofs to shield traditional beehives from bears."
    before: >-
      Always carry your official authorization document and the national ID card used during the reservation
      process. Muniellos closes on 1 and 6 January and on 24, 25, and 31 December. The reserve may close
      without notice due to wildfire danger, severe weather, or pressing conservation imperatives, which
      automatically cancels all existing permits. The standard circular hike covers about twenty kilometres
      over rugged, steep mountain terrain, demanding solid physical fitness. Within the surrounding natural
      park, dogs must be kept on a leash at all times.
    around: >-
      [Somiedo Natural Park](/lugar/parque-natural-de-somiedo/) lies just 1 km away, and [Serra do
      Courel](/lugar/zec-serra-do-courel/) is 5 km distant, both occupying the western Cantabrian Mountains.
  fr:
    intro: >-
      Pour pénétrer dans Muniellos, vous avez besoin d'une autorisation officielle, d'une date attribuée et
      d'une pièce d'identité. La forêt la plus emblématique de la cordillère Cantabrique ne se visite pas à
      l'improviste : elle se réserve. Il s'agit de la réserve naturelle intégrale de Muniellos, un espace de
      59,7 km² englobant trois massifs (Muniellos, La Viliella et Valdebois) au sein du parc naturel de
      Fuentes del Narcea, Degaña e Ibias, dans le sud-ouest des Asturies. Elle abrite la plus vaste chênaie
      sessile de la péninsule Ibérique et l'une des mieux préservées d'Europe.
    landscape: "L'altitude de la réserve s'étage de 680 m à 1640 m au pic de la Candanosa. La forêt repose sur un socle paléozoïque vieux d'environ 500 millions d'années, presque exclusivement siliceux, où la tectonique a façonné un relief abrupt et tourmenté. D'anciens cirques glaciaires et des lleronas — de vastes éboulis de quartzite concassée — restent bien visibles ; les lagunes d'altitude situées sous le pic de la Candanosa témoignent de cette origine glaciaire, tandis que les plans d'eau et tourbières du Cueto de Arbás occupent d'anciens ombilics d'affouillement.\r\n\r\nSur ce substrat acide s'épanouit la forêt. Le chêne sessile, le châtaignier et le hêtre dominent ; dans les fonds de vallées prospèrent le noisetier, l'érable, le frêne, le saule et l'aulne, tandis que la bétulaie s'installe sur les hauteurs. Au sein du parc naturel, la hêtraie de la vallée de l'Hermo, longue d'environ dix kilomètres, constitue le massif de hêtres le plus étendu et le mieux conservé, et la haute montagne se couvre de landes de genévriers nains, de bruyères et de myrtilles, particulièrement caractéristiques sur le Cueto de Arbás."
    wildlife: "Muniellos est le sanctuaire de l'[ours brun](/especie/ursus_arctos/). Y réside également le [loup](/especie/canis_lupus/), qui chasse principalement le chevreuil et le sanglier, ainsi que la [loutre d'Europe](/especie/lutra_lutra/), le renard et le chat forestier. Au total, plus de 150 espèces de vertébrés et plus de 100 espèces d'oiseaux peuplent la réserve, la salamandre de Bonaparte colonisant mares et tourbières et le lièvre ibérique des genêts figurant parmi ses joyaux fauniques.\r\n\r\nParmi l'avifaune, le [grand tétras](/especie/tetrao_urogallus/) et le [pic noir](/especie/dryocopus_martius/) sont les plus précieux et les plus inféodés aux vieilles forêts. Le grand tétras, en danger critique d'extinction dans le massif cantabrique, survit dans les bois d'Hermo, de Degaña et de Muniellos. Chez les rapaces nocturnes, la chouette hulotte abonde particulièrement. Dans l'ensemble du parc naturel, chevreuils et isards cantabriques sont fréquents, et la loutre fréquente les cours d'eau.\r\n\r\nLa meilleure période s'étend de mai à novembre, avec une explosion de teintes spectaculaires en automne."
    visit: "La demande d'autorisation s'effectue dès le 15 décembre de l'année précédente ; une seule autorisation par personne et par an est délivrée. Il est impératif de confirmer sa réservation entre 23 et 15 jours avant la date prévue, sous peine d'annulation automatique. Les entrées et sorties s'effectuent exclusivement par Tablizas, où se trouve le centre d'accueil. Deux itinéraires s'offrent aux marcheurs : la boucle de Fonculebrera, circuit exigeant de 20 km aux dénivelés prononcés, et le sentier de la rivière, en aller-retour ; tous deux rejoignent la première lagune glaciaire, celle de la Isla.\r\n\r\nLe centre d'interprétation de la réserve, à Obacho, est un bâtiment moderne posé sur un belvédère naturel dominant le massif forestier. En dehors de la réserve, le parc naturel propose la Casa del Parque à Courias, l'Aula de la Naturaleza et le centre de la Palloza d'Ibias à San Antolín, ainsi que la Casa Florencio à Zarréu (Degaña). Pour randonner sans réservation préalable, vous pouvez gravir le Cueto de Arbas, découvrir le Pomar de las Montañas, la lagune de Chagüeños ou le dolmen da Hucha, sans oublier le point de vue de l'Alto del Acebo ; le sentier de grande randonnée GR 203, « Sur les pas de l'ours », sillonne l'ensemble de la réserve de biosphère."
    history: "L'exploitation forestière destinée aux chantiers navals de l'Armada royale à Ferrol débuta vers 1766, avant que les abattages pour la marine ne soient stoppés en 1789. En 1973, l'État espagnol racheta la forêt pour la classer en réserve nationale de chasse, y interdisant dès lors toute pratique cynégétique et protégeant l'ensemble de la faune. Dès 1982, l'accès fut limité à 20 personnes par jour, avec interdiction stricte du camping, des chiens, de la pêche et des bivouacs. Le site devint réserve de biosphère en 2000 et fut érigé en réserve naturelle intégrale par la loi de 2002.\r\n\r\nL'empreinte humaine est bien plus ancienne : de nombreux vestiges témoignent de l'exploitation aurifère romaine et d'anciens habitats fortifiés préromains (castros). La palloza, maison circulaire traditionnelle en pierre sèche coiffée de paille de seigle, perpétue l'architecture de ces habitats castreños, tandis que les cortinos sont des enceintes circulaires en pierre sèche de deux mètres de haut, sans toit, conçues pour préserver les ruches des assauts de l'ours."
    before: >-
      Munissez-vous impérativement de votre document d'autorisation et de la pièce d'identité enregistrée lors
      de la demande. Muniellos ferme ses portes les 1er et 6 janvier, ainsi que les 24, 25 et 31 décembre. La
      réserve peut être fermée sans préavis pour risque d'incendie, météo extrême ou raisons de conservation,
      ce qui entraîne l'annulation des autorisations. Le circuit classique totalise environ vingt kilomètres
      avec de forts dénivelés et requiert une bonne condition physique. Dans le parc naturel, les chiens
      doivent être tenus en laisse.
    around: >-
      Le [parc naturel de Somiedo](/lugar/parque-natural-de-somiedo/) n'est qu'à 1 km, et la [Serra do
      Courel](/lugar/zec-serra-do-courel/) à 5 km, tous deux situés dans la partie occidentale de la
      cordillère Cantabrique.
  de:
    intro: >-
      Um Muniellos zu betreten, brauchst du eine behördliche Genehmigung, ein festes Datum und einen Ausweis.
      Der berühmteste Wald des Kantabrischen Gebirges steht nicht für Spontanbesuche offen: Er wird
      reserviert. Es handelt sich um das integrale Naturschutzgebiet Muniellos mit 59,7 km² und drei
      Bergmassiven (Muniellos, La Viliella und Valdebois) im Naturpark Fuentes del Narcea, Degaña e Ibias im
      Südwesten Asturiens. Es bewahrt den größten Traubeneichenwald der Iberischen Halbinsel und einen der
      besterhaltenen Europas.
    landscape: "Die Höhenlage des Schutzgebiets reicht von 680 m bis auf 1640 m am Gipfel La Candanosa hinauf. Der Wald wurzelt auf einem paläozoischen Urgestein von rund 500 Millionen Jahren, das fast durchweg silikatisch ist; tektonische Kräfte haben ein stark zerklüftetes Relief herausgebildet. Alte Kargletscher und die lleronas — Schutthalden aus zerborstenem Quarzit — prägen die Hänge; eiszeitliche Karseen unterhalb des Gipfels La Candanosa sowie Moor- und Hochgebirgsseen am Cueto de Arbás füllen alte Gletschermulden.\r\n\r\nAuf diesem nährstoffarmen Boden gedeiht der Wald. Traubeneiche, Edelkastanie und Rotbuche dominieren; in den Tälern mischen sich Hasel, Ahorn, Esche, Weide und Erle darunter, während in den Hochlagen Birkenwälder wachsen. Im Naturpark ist der Buchenwald des Hermo-Tals mit einer Länge von rund zehn Kilometern der ausgedehnteste und besterhaltene seiner Art, während das Hochgebirge von Zwergwacholder-, Besenheide- und Heidelbeergebüschen geprägt ist, die besonders am Cueto de Arbás typisch sind."
    wildlife: "Muniellos ist angestammtes Revier des [Braunbären](/especie/ursus_arctos/). Hier lebt auch der [Wolf](/especie/canis_lupus/), der vor allem Reh und Wildschwein erbeutet, sowie [Fischotter](/especie/lutra_lutra/), Rotfuchs und Wildkatze. Insgesamt beherbergt das Reservat über 150 Wirbeltierarten und mehr als 100 Vogelarten; der Goldstreifen-Salamander besiedelt Tümpel und Torfmoore, und der Ginsterhase zählt zu den zoologischen Wahrzeichen.\r\n\r\nUnter den Vögeln sind das [Auerhuhn](/especie/tetrao_urogallus/) und der [Schwarzspecht](/especie/dryocopus_martius/) von herausragender Bedeutung und eng an die Altwälder gebunden. Das vom Aussterben bedrohte Auerhuhn hält sich in den Wäldern von Hermo, Degaña und Muniellos. Unter den Eulen sticht der Waldkauz durch seine Häufigkeit hervor. Im Naturpark trifft man regelmäßig auf Rehe und Kantabrische Gämsen, und in den Flüssen jagt der Fischotter.\r\n\r\nDie Saison reicht von Mai bis November mit besonders eindrucksvoller Herbstfärbung."
    visit: "Die Genehmigung kann ab dem 15. Dezember des Vorjahres beantragt werden; pro Person wird nur eine einzige Erlaubnis pro Kalenderjahr erteilt. Die Reservierung muss zwischen 23 und 15 Tagen vor dem Termin rückbestätigt werden, andernfalls verfällt sie automatisch. Ein- und Ausgang erfolgen ausschließlich über Tablizas, wo sich das Besucherzentrum befindet. Es gibt zwei Wanderrouten: die Fonculebrera-Runde, ein anspruchsvoller Rundweg von 20 km mit beträchtlichen Höhenunterschieden, und den Flussweg als Hin- und Rückweg; beide Routen führen zum ersten Karsee, der Laguna de la Isla.\r\n\r\nDas Informationszentrum des Reservats in Obacho ist ein moderner Bau auf einem natürlichen Aussichtspunkt über den Wipfeln. Außerhalb des Kernreservats unterhält der Naturpark die Casa del Parque in Courias, das Naturzentrum und Palloza-Museum von Ibias in San Antolín sowie die Casa Florencio in Zarréu (Degaña). Für genehmigungsfreie Touren bieten sich der Aufstieg zum Cueto de Arbas, Pomar de las Montañas, die Laguna de Chagüeños und der Dolmen da Hucha sowie der Aussichtspunkt Alto del Acebo an; der Weitwanderweg GR 203, «Wo der Bär wandert», führt durch das gesamte Biosphärenreservat."
    history: "Die Holznutzung für die Werften der königlichen Armada in Ferrol begann um 1766; im Jahr 1789 wurde der Holzeinschlag für den Schiffsbau eingestellt. 1973 erwarb der spanische Staat den Forst, erklärte ihn zum nationalen Jagdgebiet und untersagte seither die Jagd vollständig, um die Fauna zu schützen. 1982 wurde die Besucherzahl auf 20 Personen pro Tag begrenzt und das Zelten, Mitführen von Hunden, Angeln und Übernachten im Wald strikt verboten. Seit 2000 ist das Gebiet ein UNESCO-Biosphärenreservat und seit dem Gesetz von 2002 ein integrales Naturreservat.\r\n\r\nDie menschlichen Spuren reichen weiter zurück: Ausgrabungen belegen römischen Goldbergbau und befestigte Keltensiedlungen (Castros). Die Palloza, ein traditionelles rundes Trockensteinhaus mit Roggenstrohdach, bewahrt die Bauform der alten Castro-Bauten, während Cortinos rund zwei Metern hohe kreisrunde Steinmauern ohne Dach sind, die Imkern dienten, um Bienenstöcke vor Bären zu schützen."
    before: >-
      Führe unbedingt die offizielle Genehmigung und den bei der Antragstellung hinterlegten Ausweis mit.
      Muniellos bleibt am 1. und 6. Januar sowie am 24., 25. und 31. Dezember geschlossen. Das Reservat kann
      bei Waldbrandgefahr, extremem Wetter oder aus dringenden Naturschutzgründen kurzfristig geschlossen
      werden, wodurch alle Genehmigungen erlöschen. Die klassische Wanderroute erstreckt sich über rund
      zwanzig Kilometer mit steilen Auf- und Abstiegen und verlangt gute Kondition. Im Naturpark müssen Hunde
      ausnahmslos an der Leine geführt werden.
    around: >-
      Der [Naturpark Somiedo](/lugar/parque-natural-de-somiedo/) liegt nur 1 km entfernt, und das Schutzgebiet
      [Serra do Courel](/lugar/zec-serra-do-courel/) ist 5 km entfernt, beide im westlichen Kantabrischen
      Gebirge.
  it:
    intro: >-
      Per entrare a Muniellos hai bisogno di un permesso formale, di una data fissata e di un documento
      d'identità. La foresta più celebre della cordigliera Cantabrica non si visita liberamente: si prenota
      con largo anticipo. È la Riserva Naturale Integrale di Muniellos, 59,7 km² articolati su tre complessi
      montuosi (Muniellos, La Viliella e Valdebois) all'interno del Parco Naturale di Fuentes del Narcea,
      Degaña e Ibias, nel sud-ovest delle Asturie. Custodisce il più esteso bosco di rovere della penisola
      iberica e uno dei meglio conservati dell'intero continente.
    landscape: "La quota della riserva varia dai 680 m ai 1640 m del picco della Candanosa. La selva poggia su un basamento paleozoico di circa 500 milioni di anni, prevalentemente siliceo, che i processi tettonici hanno scolpito in un rilievo aspro. Sono tuttora evidenti antichi circhi glaciali e le lleronas, estesi ghiaioni di quarzite frantumata; le lagune d'alta quota sotto la cima della Candanosa testimoniano l'origine glaciale, mentre i laghetti alpini e le torbiere del Cueto de Arbás occupano conche di escavazione glaciale.\r\n\r\nSu questo suolo povero prospera la foresta. Dominano il rovere, il castagno e il faggio; nei fondovalle crescono noccioli, aceri, frassini, salici e ontani, mentre alle quote superiori compare la betulla. Nel parco naturale, la faggeta della valle dell'Hermo, lunga circa dieci chilometri, rappresenta il complesso di faggi più vasto e integro, e l'alta montagna accoglie brughiere a ginepro nano, brugo e mirtillo, tipiche del Cueto de Arbás."
    wildlife: "Muniellos è il territorio d'elezione dell'[orso bruno](/especie/ursus_arctos/). Vi abita anche il [lupo grigio](/especie/canis_lupus/), che preda soprattutto caprioli e cinghiali, insieme alla [lontra europea](/especie/lutra_lutra/), alla volpe e al gatto selvatico. Nel complesso vivono nella riserva oltre 150 specie di vertebrati e più di 100 specie di uccelli, con la salamandra di Valverde nelle pozze e torbiere e la lepre di scopa tra le specie simbolo.\r\n\r\nTra gli uccelli, l'[urogallo](/especie/tetrao_urogallus/) e il [picchio nero](/especie/dryocopus_martius/) sono le specie di maggior valore conservazionistico e più strettamente legate alla foresta vetusta. L'urogallo, in grave pericolo di estinzione nella cordigliera Cantabrica, popola i boschi di Hermo, Degaña e Muniellos. Tra i rapaci notturni spicca per abbondanza l'allocco. Nel parco abbondano caprioli e camosci cantabrici, e lungo i corsi d'acqua si avvista la lontra.\r\n\r\nLa stagione ideale va da maggio a novembre, con uno spettacolo cromatico straordinario in autunno."
    visit: "Il permesso si richiede a partire dal 15 dicembre dell'anno precedente; viene concesso un unico permesso per persona a ogni anno solare. È obbligatorio confermare la prenotazione tra 23 e 15 giorni prima della data stabilita, pena la cancellazione d'ufficio. L'ingresso e l'uscita avvengono unicamente da Tablizas, sede del centro visite. Due sono gli itinerari percorribili: l'anello di Fonculebrera, tracciato circolare impegnativo di 20 km con dislivelli severi, e il sentiero del fiume, andata e ritorno; entrambi consentono di raggiungere la prima laguna, quella della Isla.\r\n\r\nIl Centro di Interpretazione della Riserva, a Obacho, è un edificio moderno situato sopra un belvedere naturale con vista panoramica sulla foresta. All'esterno della riserva integrale, il parco naturale offre la Casa del Parque a Courias, l'Aula della Natura e centro della Palloza di Ibias a San Antolín e la Casa Florencio a Zarréu (Degaña). Per camminare senza permessi si possono percorrere l'ascesa al Cueto de Arbas, il Pomar de las Montañas, la laguna di Chagüeños e il dolmen da Hucha, oltre al belvedere dell'Alto del Acebo; il sentiero GR 203, «Sulle tracce dell'orso», attraversa l'intera riserva della biosfera."
    history: "L'abbattimento di legname per i cantieri navali dell'Armada a Ferrol iniziò verso il 1766, per poi interrompersi nel 1789 per la costruzione di navi. Nel 1973 lo Stato spagnolo acquistò la proprietà, la trasformò in riserva nazionale di caccia e da allora vietò qualsiasi attività venatoria, proteggendo integralmente la fauna. Nel 1982 l'accesso fu contingentato a 20 persone al giorno, proibendo campeggio, introduzione di cani, pesca e pernottamenti. È Riserva della Biosfera dal 2000 e Riserva Naturale Integrale in forza della legge del 2002.\r\n\r\nLa presenza umana affonda in tempi remoti: rimangono molteplici tracce di miniere d'oro romane e di villaggi fortificati preromani (castros). La palloza, abitazione circolare in pietra a secco coperta da paglia di segale, conserva stretta somiglianza con le antiche case dei castros, mentre i cortinos sono recinti circolari in pietra a secco alti due metri, privi di tetto, eretti per difendere le arnie dagli orsi."
    before: >-
      Porta sempre con te il documento di autorizzazione e il documento d'identità indicato nella richiesta.
      Muniellos resta chiusa nei giorni 1 e 6 gennaio e nei giorni 24, 25 e 31 dicembre. La riserva può
      chiudere improvvisamente per allerta incendi, meteo avverso o inderogabili ragioni di conservazione,
      annullando i permessi in corso. L'escursione classica richiede di coprire circa venti chilometri su
      sentieri alpini ripidi e faticosi, richiedendo preparazione fisica. Nel territorio del parco naturale i
      cani devono essere tenuti sempre al guinzaglio.
    around: >-
      Il [Parco Naturale di Somiedo](/lugar/parque-natural-de-somiedo/) dista appena 1 km, e la [Serra do
      Courel](/lugar/zec-serra-do-courel/) si trova a 5 km, entrambi nella cordigliera Cantabrica occidentale.
  pt:
    intro: >-
      Para entrar em Muniellos precisas de autorização prévia, de uma data agendada e do documento de
      identificação. A floresta mais admirada da cordilheira Cantábrica não se visita de forma espontânea:
      reserva-se com antecedência. Trata-se da Reserva Natural Integral de Muniellos, com 59,7 km² e três
      montes (Muniellos, La Viliella e Valdebois) integrados no Parque Natural de Fuentes del Narcea, Degaña e
      Ibias, no sudoeste das Astúrias. Resguarda o maior carvalhal de roble-alvar da Península Ibérica e um
      dos mais bem preservados da Europa.
    landscape: "A altitude da reserva estende-se dos 680 m até aos 1640 m no cume de La Candanosa. A mata assenta sobre um substrato paleozoico com cerca de 500 milhões de anos, maioritariamente silicioso, esculpido por processos tectónicos num relevo escarpado. Observam-se ainda circos glaciares e as lleronas, imensas escombreiras de quartzito fragmentado; as lagoas sob o pico de La Candanosa comprovam essa génese glaciar, enquanto as lagoas alpinas e turfeiras do Cueto de Arbás preenchem antigas bacias de sobreescavação.\r\n\r\nSobre este solo pobre desenvolve-se a floresta. Predominam o roble-alvar, o castanheiro e a faia; nos fundos de vale encontram-se aveleiras, bordos, freixos, salgueiros e amieiros, ao passo que nas cotas mais elevadas surge o bétula. No parque natural, o faial do vale do Hermo, com cerca de dez quilómetros, é o mais extenso e intacto dos faiais, e na alta montanha dominam charnecas de zimbro-anão, urzes e mirtilos, muito típicas no Cueto de Arbás."
    wildlife: "Muniellos é santuário do [urso-pardo](/especie/ursus_arctos/). Aí reside também o [lobo](/especie/canis_lupus/), que caça sobretudo corços e javalis, a par da [lontra-europeia](/especie/lutra_lutra/), da raposa e do gato-bravo. Ao todo, vivem na reserva mais de 150 espécies de vertebrados e mais de 100 de aves, com a salamandra-lusitânica em charcas e turfeiras e a lebre-cantábrica entre os seus símbolos faunísticos.\r\n\r\nEntre as aves, o [tetraz-grande](/especie/tetrao_urogallus/) e o [pica-pau-preto](/especie/dryocopus_martius/) constituem os elementos de maior relevo conservacionista, intimamente dependentes da floresta madura. O tetraz-grande, em perigo crítico de extinção na cordilheira Cantábrica, sobrevive nas matas de Hermo, Degaña e Muniellos. Nas rapinas noturnas, a coruja-do-mato destaca-se pela abundância. No parque são comuns corços e camurças-cantábricas, e nos cursos de água avista-se a lontra.\r\n\r\nA temporada estende-se de maio a novembro, com um colorido outonal deslumbrante."
    visit: "A autorização pode ser solicitada a partir de 15 de dezembro do ano precedente, atribuindo-se apenas uma autorização por pessoa em cada ano civil. É obrigatório confirmar a reserva entre 23 e 15 dias antes da data marcada: caso contrário, é sumariamente cancelada. A entrada e a saída realizam-se exclusivamente por Tablizas, onde funciona o centro de acolhimento. Há dois percursos assinalados: o circuito de Fonculebrera, rota circular exigente de 20 km com desníveis acentuados, e o trilho do rio, de ida e volta; ambos permitem aceder à primeira lagoa glaciar, a da Isla.\r\n\r\nO Centro de Interpretação da Reserva, em Obacho, é uma estrutura contemporânea implantada sobre um miradouro natural com vista sobre a floresta. Fora da reserva integral, o parque natural acolhe a Casa del Parque em Courias, a Aula da Natureza e núcleo da Palloza de Ibias em San Antolín e a Casa Florencio em Zarréu (Degaña). Para caminhar sem autorização destacam-se a subida ao Cueto de Arbas, o Pomar de las Montañas, a lagoa de Chagüeños e o dólmen da Hucha, além do miradouro do Alto del Acebo; a Grande Rota GR 203, «Por Onde Caminha o Urso», atravessa toda a Reserva da Biosfera."
    history: "A exploração de madeira destinada aos estaleiros da Armada Real em Ferrol principiou por volta de 1766, cessando em 1789 o corte para navios de guerra. Em 1973 o Estado espanhol adquiriu a propriedade florestal, declarou-a coutada nacional de caça e desde então baniu a caça, protegendo integralmente a fauna selvagem. Em 1982 estipulou o limite de 20 pessoas por dia e proibiu o campismo, a presença de cães, a pesca e as dormidas no bosque. Foi reconhecida Reserva da Biosfera em 2000 e instituída Reserva Natural Integral pela lei de 2002.\r\n\r\nA presença humana é muito mais recuada: abundam vestígios da mineração aurífera romana e de povoados castrejos. A palloza, habitação circular de pedra solta coberta a colmo de centeio, preserva a morfologia das primitivas casas castrejas, enquanto os cortinos são muros circulares de pedra seca com dois metros de altura, sem teto, concebidos para resguardar os cortiços dos ursos."
    before: >-
      Leva obrigatoriamente a autorização emitida e o documento de identificação utilizado na inscrição.
      Muniellos encerra nos dias 1 e 6 de janeiro e nos dias 24, 25 e 31 de dezembro. A reserva pode fechar
      sem aviso prévio por perigo de incêndio, meteorologia adversa ou motivos de conservação, cancelando as
      autorizações. O trilho habitual percorre cerca de vinte quilómetros com declives rigorosos, exigindo boa
      condição física. No parque natural, os cães têm de circular sempre com trela.
    around: >-
      O [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) situa-se a apenas 1 km, e a [Serra do
      Courel](/lugar/zec-serra-do-courel/) dista 5 km, ambos integrados na Cantábrica ocidental.
