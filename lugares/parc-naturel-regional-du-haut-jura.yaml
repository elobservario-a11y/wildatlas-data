resumen:
  es: >-
    Las crestas más altas de la cordillera del Jura (Crêt de la Neige 1.720 m) con bosques de abetos
    centenarios y turberas.
  en: The highest crests of the Jura Range (Crêt de la Neige 1,720 m) with ancient spruce forests and peat bogs.
  fr: >-
    Les plus hautes crêtes du massif du Jura (Crêt de la Neige 1 720 m) avec forêts d’épicéas centenaires et
    tourbières.
  de: >-
    Die höchsten Kämme des Juragebirges (Crêt de la Neige 1.720 m) mit jahrhundertealten Fichtenwäldern und
    Hochmooren.
  it: >-
    Le creste più elevate della catena del Giura (Crêt de la Neige 1.720 m) con foreste di abeti centenari e
    torbiere.
  pt: >-
    As cristas mais altas da cordilheira do Jura (Crêt de la Neige 1.720 m) com florestas de abetos
    centenários e turfeiras.
unico:
  es: >-
    Una media montaña de bosques, turberas y combes donde el urogallo y el lince todavía tienen su sitio y
    donde el senderista aprende a pasar sin molestar.
  en: >-
    A mid-mountain world of forests, peatlands and combes where capercaillie and lynx still find refuge and
    where hikers learn to tread lightly.
  fr: >-
    Une moyenne montagne de forêts, tourbières et combes où le grand tétras et le lynx trouvent encore refuge
    et où le randonneur apprend à passer sans déranger.
  de: >-
    Ein Mittelgebirge aus Wäldern, Mooren und Combes, in dem Auerhuhn und Luchs noch ihren Lebensraum finden
    und Wanderer lernen, rücksichtsvoll unterwegs zu sein.
  it: >-
    Una media montagna di boschi, torbiere e combes dove il gallo cedrone e la lince trovano ancora rifugio e
    dove l’escursionista impara a passare in punta di piedi.
  pt: >-
    Uma média montanha de florestas, turfeiras e combes onde o tetraz e o lince ainda encontram refúgio e onde
    o caminhante aprende a passar sem perturbar.
observaciones:
  es: >-
    El parque llama a esto la Quiétude attitude: ocho gestos sencillos para practicar deporte y ocio
    respetando los medios naturales y a quienes trabajan en ellos. Muchos senderos cruzan propiedades privadas
    donde pastan las vacas cuya leche se transforma en quesos jurásicos como el Comté. El vivac, entre las 19
    h y las 9 h, está en general permitido, aunque hay zonas reglamentadas y prohibidas. Con perro, según el
    itinerario se cruzan zonas reglamentadas con normas distintas; en las demás se aconseja llevarlo atado.
    Ante perros de protección de rebaños, infórmate de dónde están los rebaños, sigue por los itinerarios
    señalizados, mantén la calma, detente y no les mires a los ojos.
texto:
  es:
    intro: >-
      Alrededor de cien urogallos viven en los bosques del Alto Jura, una especie amenazada de desaparición, y
      buena parte de lo que se ve aquí gira en torno a no molestarlos. El Parque Natural Regional del
      Haut-Jura se creó el 10 de febrero de 1986 en el suroeste del macizo del Jura, en la frontera con Suiza,
      y hoy agrupa municipios de tres departamentos, el Ain, el Doubs y el Jura, en unas 178.000 hectáreas.
      Los bosques cubren el 70 % de su territorio, y entre ellos pastan sobre todo vacas lecheras
      montbéliardes: una montaña habitada, de bosque, agua y prados.
    landscape: >-
      El agua está en todas partes: esculpe la roca y corre por muchos ríos y cascadas. El macizo forma
      mesetas onduladas de 700 a 1.000 m cortadas por combes profundas y por cluses, pasos naturales de un
      valle a otro sin cruzar un puerto. Los paisajes cambian de un sector a otro.


      En la Montaña Plegada, entre 950 m y el Mont d'Or (1.460 m), alternan montes, combes y valles; los
      montes anchos y aplanados se usan como pastos de alpe. El Crêt Pela, a 1.495 metros, es la cima del
      departamento del Jura, con montes más anchos que los valles y el paisaje típico de los prés-bois. El
      Crêt de la Neige, de 1.718 m, es la cima de la línea de crestas del Jura; el territorio mira a Suiza con
      un desnivel de más de 1.000 m. Los lagos y turberas de las partes bajas de los Grands Vaux siguen siendo
      polos de frío extremo en los inviernos duros.
    wildlife: >-
      El bosque es la casa. Entre las especies más emblemáticas están el [lince](/especie/lynx_lynx/) y el
      [urogallo](/especie/tetrao_urogallus/), y entre las menos conocidas el cangrejo de patas blancas y las
      orquídeas silvestres. El urogallo se alimenta de agujas de abeto. Para protegerlo en su periodo más
      sensible, algunos sectores forestales cierran al público del 15 de diciembre al 30 de junio: es una
      restricción fija de cada año.


      Con tantos animales esquivos, la mejor manera de ver el bosque es leer sus huellas. El sendero educativo
      invita a buscar rastros de rebeco, corzo, ciervo, zorro y lince, y no a esperar ver a los animales, que
      suelen esconderse al oír a las personas; de hecho, algunos oyen a varios metros y huyen antes de que los
      veas. En junio y julio, a lo largo del Crêt Pela, puede encontrarse la orquídea sureña.
    visit: >-
      Para empezar con calma, el Sentier des Explorateurs, en Prémanon, es un circuito fácil de una hora, 2 km
      y 71 m de desnivel positivo, propuesto por escolares para familias interesadas en la naturaleza. La ruta
      del Crêt Pela atraviesa un hábitat forestal protegido por normativa debido a la presencia de especies
      sensibles.


      El parque ofrece muchos más caminos. Haut-Jura Rando recoge circuitos a pie, en BTT y con raquetas, con
      distintas distancias y niveles de dificultad, y la itinerancia por el corazón del parque tiene 7
      trazados y numerosos bucles derivados a pie, con raquetas, esquí, BTT o a caballo. En bicicleta hay 44
      recorridos, 1.500 km de carreteras y caminos pequeños y más de 100 curiosidades, con bicicletas
      eléctricas para alquilar. En invierno, el parque ofrece un mapa interactivo de esquí nórdico, raquetas y
      perros de trineo.


      La Maison du Parc, en Lajoux, es la sede del parque y también su centro de visita: tiene la exposición
      permanente «Haut-Jura, Terre Vivante!» sobre paisajes, humedales y bosque, y el Grenier-Fort, un antiguo
      granero-caja fuerte en el jardín. En la sala de proyección se escucha «El canto del bosque del Risoux»,
      una inmersión sonora basada en los trabajos de ecoacústica del parque que recorre ocho décadas. Los RDV
      du Parc son salidas a la naturaleza, conferencias, proyecciones y talleres gratuitos para descubrir la
      montaña en familia.
    history: >-
      El parque considera los medios forestales reservorios de biodiversidad y promueve diversidad de especies
      arbóreas y de estratos vegetales. La conservación, aquí, es sobre todo un asunto de convivencia: con los
      agricultores, los forestales y la fauna. El río Valserine, en el Ain y el Jura, tiene la etiqueta de
      «río salvaje».
    before: >-
      El parque llama a esto la Quiétude attitude: ocho gestos sencillos para practicar deporte y ocio
      respetando los medios naturales y a quienes trabajan en ellos. Muchos senderos cruzan propiedades
      privadas donde pastan las vacas cuya leche se transforma en quesos jurásicos como el Comté. El vivac,
      entre las 19 h y las 9 h, está en general permitido, aunque hay zonas reglamentadas y prohibidas. Con
      perro, según el itinerario se cruzan zonas reglamentadas con normas distintas; en las demás se aconseja
      llevarlo atado. Ante perros de protección de rebaños, infórmate de dónde están los rebaños, sigue por
      los itinerarios señalizados, mantén la calma, detente y no les mires a los ojos.
    around: >-
      Pegados al parque están la [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) (0 km) y el [Parc
      Naturel Régional Jura Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) (1 km); más lejos, [La Loue -
      Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) (15 km) y, más allá, las [Gorges du Doubs -
      Franco-Suisses](/lugar/gorges-du-doubs---franco-suisses/).
  en:
    intro: >-
      Around a hundred capercaillies live in the forests of the Haut-Jura, a species threatened with
      extinction, and much of what you see here revolves around avoiding disturbing them. The Haut-Jura
      Regional Nature Park was created on 10 February 1986 in the south-west of the Jura massif along the
      Swiss border, and today unites municipalities from three departments—Ain, Doubs and Jura—covering some
      178,000 hectares. Forests blanket 70% of its area, grazed beneath their canopy mainly by Montbéliarde
      dairy cattle: an inhabited mountain of woodland, water and meadows.
    landscape: >-
      Water is ubiquitous, sculpting the rock and feeding numerous rivers and waterfalls. The massif forms
      undulating plateaus from 700 to 1,000 m dissected by deep combes and by cluses—natural transverse
      valleys linking one vale to another without crossing a high pass. Landscapes shift distinctly from one
      sector to the next.


      In the Montagne Pliée, between 950 m and Mont d'Or (1,460 m), ridges, combes and valleys alternate;
      broad, flattened summits serve as summer mountain pastures. Crêt Pela, at 1,495 metres, is the highest
      point in the Jura department, with summits broader than the valleys and the characteristic
      wooded-pasture scenery of the prés-bois. Crêt de la Neige, at 1,718 m, crowns the ridge line of the
      Jura; the territory drops down towards Switzerland with an elevation difference exceeding 1,000 m. The
      lakes and bogs in the lower basins of the Grands Vaux remain poles of extreme cold during bitter
      winters.
    wildlife: >-
      The forest is home. Among the most emblematic species are the [lynx](/especie/lynx_lynx/) and the
      [capercaillie](/especie/tetrao_urogallus/), alongside lesser-known treasures such as the white-clawed
      crayfish and wild orchids. The capercaillie feeds on spruce needles. To protect it during its most
      vulnerable season, certain forest sectors are closed to the public from 15 December to 30 June: an
      annual regulatory restriction.


      With such elusive wildlife, the most rewarding way to experience the woods is reading their tracks. The
      interpretive trail invites you to search for signs of chamois, roe deer, red deer, fox and lynx rather
      than expecting direct sightings, as animals slip away upon hearing human footsteps; some can hear from
      several metres away and flee before you ever spot them. In June and July, along Crêt Pela, the southern
      marsh orchid may be found.
    visit: >-
      For an easy start, the Sentier des Explorateurs in Prémanon is a gentle circuit taking about one hour, 2
      km long with 71 m of elevation gain, designed by schoolchildren for families eager to explore nature.
      The Crêt Pela route leads through forest habitat protected by regulation due to the presence of
      sensitive species.


      The park offers a vast network of routes. Haut-Jura Rando gathers itineraries on foot, mountain bike and
      snowshoes across various distances and grades, while the park’s main roaming trail features 7
      itineraries with numerous loop variants on foot, snowshoes, cross-country skis, mountain bike or
      horseback. For cycling, there are 44 signposted routes encompassing 1,500 km of quiet backroads and
      lanes and over 100 sights of interest, with e-bikes available for hire. In winter, the park provides an
      interactive map for Nordic skiing, snowshoeing and sled dog trails.


      The Maison du Parc in Lajoux serves as both park headquarters and visitor hub: it hosts the permanent
      exhibition «Haut-Jura, Terre Vivante!» exploring landscapes, wetlands and forests, and the Grenier-Fort,
      a traditional wooden vault-granary in the garden. In the screening room you can listen to «The Song of
      the Risoux Forest», a sound immersion spanning eight decades based on the park’s ecoacoustic studies.
      Les Rendez-vous du Parc offer free guided nature walks, lectures, film screenings and workshops for
      families to discover the mountain.
    history: >-
      The park views forest ecosystems as biodiversity reservoirs and actively promotes a wide variety of tree
      species and vegetation layers. Conservation here is above all an art of coexistence with farmers,
      foresters and wildlife. The Valserine river, flowing through Ain and Jura, holds the prestigious «wild
      river» certification.
    before: >-
      The park calls this the Quiétude attitude: eight simple practices for enjoying outdoor recreation while
      respecting natural environments and the people working within them. Many paths traverse private property
      where grazing cows produce the milk for renowned Jura cheeses like Comté. Bivouacking between 19 h and 9
      h is generally permitted, though certain zones have specific restrictions or bans. When hiking with a
      dog, rules vary by sector along the trail; elsewhere keeping dogs leashed is advised. If you encounter
      livestock guardian dogs, find out where herds are grazing beforehand, stay on marked routes, remain
      calm, stop walking and avoid eye contact.
    around: >-
      Bordering the park are the [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) (0 km) and the [Parc
      Naturel Régional Jura Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) (1 km); further out, [La Loue
      - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) (15 km) and, beyond that, the [Gorges du Doubs -
      Franco-Suisses](/lugar/gorges-du-doubs---franco-suisses/).
  fr:
    intro: >-
      Une centaine de grands tétras vivent encore dans les forêts du Haut-Jura, une espèce menacée
      d'extinction, et une grande part de ce qui s'y découvre tourne autour du souci de ne pas les déranger.
      Le Parc naturel régional du Haut-Jura a été créé le 10 février 1986 dans le sud-ouest du massif
      jurassien, le long de la frontière suisse, et regroupe aujourd'hui des communes de trois départements —
      Ain, Doubs et Jura — sur quelque 178 000 hectares. Les forêts couvrent 70 % de son territoire, pâturé
      par les vaches laitières montbéliardes : une montagne habitée, d'arbres, d'eau et de prés.
    landscape: >-
      L'eau est partout présente : elle façonne la roche et s'écoule par d'innombrables rivières et cascades.
      Le massif forme des plateaux ondulés de 700 à 1 000 m entaillés de combes profondes et de cluses,
      passages naturels d'une vallée à l'autre sans franchir de col. Les paysages varient fortement selon les
      secteurs.


      Dans la Montagne pliée, entre 950 m et le mont d'Or (1 460 m), alternent monts, combes et vallées ; les
      sommets larges et aplatis servent d'alpages estivaux. Le Crêt Pela, à 1 495 mètres, est le point
      culminant du département du Jura, avec des crêts plus étalés que les vallées et le décor emblématique
      des prés-bois. Le Crêt de la Neige, à 1 718 m, domine la ligne de crête du Jura ; le versant bascule
      vers la Suisse avec un dénivelé de plus de 1 000 m. Les lacs et tourbières situés au fond des Grands
      Vaux demeurent des pôles de froid remarquable lors des hivers rigoureux.
    wildlife: >-
      La forêt constitue l'habitat central. Parmi les espèces les plus emblématiques figurent le
      [lynx](/especie/lynx_lynx/) et le [grand tétras](/especie/tetrao_urogallus/), tandis que parmi les plus
      discrètes se trouvent l'écrevisse à pattes blanches et diverses orchidées sauvages. Le grand tétras se
      nourrit d'aiguilles de conifères. Pour préserver sa quiétude durant sa période la plus vulnérable,
      certains secteurs forestiers sont fermés au public du 15 décembre au 30 juin : une règle annuelle
      incontournable.


      Face à une faune aussi farouche, la meilleure approche consiste à observer ses empreintes. Le sentier
      pédagogique propose de chercher les traces du chamois, du chevreuil, du cerf, du renard et du lynx
      plutôt que d'espérer un contact direct, les animaux fuyant aux bruits des pas humains ; certains
      perçoivent les présences à plusieurs mètres et s'éloignent bien avant d'être remarqués. En juin et
      juillet, le long du Crêt Pela, on peut repérer l'orchis grenouille.
    visit: >-
      Pour débuter paisiblement, le Sentier des Explorateurs à Prémanon est une boucle facile d'une heure, 2
      km et 71 m de dénivelé positif, imaginée par des écoliers pour les familles curieuses de nature.
      L'itinéraire du Crêt Pela traverse quant à lui un milieu forestier protégé par arrêté de biotope en
      raison de la présence d'espèces vulnérables.


      Le parc déploie de multiples parcours. Haut-Jura Rando recense des itinéraires pédestres, VTT et
      raquettes adaptés à tous les niveaux, tandis que l'itinérance au cœur du parc comprend 7 tracés assortis
      de nombreuses variantes en boucle à pied, à raquettes, à ski de fond, à VTT ou à cheval. À vélo, on
      compte 44 parcours balisés représentant 1 500 km de petites routes champêtres et plus de 100 curiosités
      répertoriées, avec des vélos à assistance électrique en location. En hiver, le parc met à disposition
      une carte interactive pour le ski nordique, les raquettes et les attelages de chiens de traîneau.


      La Maison du Parc, à Lajoux, abrite à la fois le siège administratif et le centre d'accueil : elle
      propose l'exposition permanente « Haut-Jura, Terre Vivante ! » sur les paysages, les zones humides et la
      forêt, ainsi que le Grenier-Fort, un grenier traditionnel dans le jardin. Dans la salle de projection
      résonne « Le chant de la forêt du Risoux », immersion sonore retraçant huit décennies de recherches
      écoacoustiques. Les RDV du Parc rassemblent des sorties nature, conférences, projections et ateliers
      gratuits pour explorer la montagne en famille.
    history: >-
      Le parc conçoit les massifs forestiers comme de véritables réservoirs de biodiversité et encourage la
      diversité des essences d'arbres et des strates végétales. La préservation y repose sur la concertation
      étroite avec les éleveurs, les gestionnaires forestiers et les usagers. La rivière Valserine, coulant
      dans l'Ain et le Jura, arbore le label « Site Rivières Sauvages ».
    before: >-
      Le parc promeut la Quiétude attitude : huit gestes simples pour profiter des loisirs de plein air tout
      en respectant la nature et les activités pastorales. De nombreux sentiers traversent des parcelles
      privées où paissent les vaches produisant le lait des fromages jurassiens comme le Comté. Le bivouac,
      autorisé entre 19 h et 9 h, est soumis à des règles strictes voire interdit dans certaines réserves.
      Avec un chien, tenez compte des règlements spécifiques selon les zones ; sur les autres chemins la
      laisse est vivement recommandée. Si vous croisez des chiens de protection de troupeaux, renseignez-vous
      sur les pâturages, restez sur les tracés balisés, gardez votre calme, marquez l'arrêt et ne les fixez
      pas dans les yeux.
    around: >-
      Limitrophes du parc se trouvent la [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) (0 km) et le
      [Parc Naturel Régional Jura Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) (1 km) ; un peu plus
      loin, [La Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) (15 km) et, au-delà, les [Gorges
      du Doubs - Franco-Suisses](/lugar/gorges-du-doubs---franco-suisses/).
  de:
    intro: >-
      Rund einhundert Auerhühner leben in den Wäldern des Haut-Jura, eine vom Aussterben bedrohte Vogelart,
      und vieles hier dreht sich darum, ihre Ruhezonen nicht zu stören. Der regionale Naturpark Haut-Jura
      wurde am 10. Februar 1986 im Südwesten des Juramassivs an der Grenze zur Schweiz geschaffen und vereint
      heute Gemeinden aus drei Departements — Ain, Doubs und Jura — auf einer Fläche von rund 178.000 Hektar.
      Wälder bedecken 70 % des Gebiets, auf deren Waldweiden vor allem Montbéliard-Milchkühe grasen: ein
      belebtes Gebirge aus Wald, Wasser und Matten.
    landscape: >-
      Wasser ist allgegenwärtig: Es modelliert das Gestein und speist zahlreiche Bäche und Kaskaden. Das
      Massiv bildet wellige Hochebenen von 700 bis 1.000 m, durchfurcht von tiefen Längstälern (Combes) und
      Quertälern (Cluses), die Täler ohne Passüberquerung verbinden. Das Landschaftsbild wechselt je nach
      Sektor deutlich.


      Im Faltenjura (Montagne Pliée), zwischen 950 m und dem Mont d'Or (1.460 m), wechseln Bergrücken, Mulden
      und Täler einander ab; die breiten, abgeflachten Höhenzüge dienen als Sommerweiden. Der Crêt Pela ist
      mit 1.495 Metern der höchste Punkt des Departements Jura und zeigt die typische Kulisse lockerer
      Waldweiden (prés-bois). Der Crêt de la Neige ragt mit 1.718 m als Scheitelpunkt des Jurakamms auf; das
      Gelände fällt mit einem Höhenunterschied von über 1.000 m zur Schweiz hin ab. Die Seen und Hochmoore in
      den Senken der Grands Vaux gelten in strengen Wintern als Kältepole.
    wildlife: >-
      Der Wald bildet den zentralen Lebensraum. Zu den Symbolarten zählen der [Luchs](/especie/lynx_lynx/) und
      das [Auerhuhn](/especie/tetrao_urogallus/), während zu den verborgeneren Arten der Steinkrebs und wilde
      Orchideen gehören. Das Auerhuhn ernährt sich im Winter vorwiegend von Nadeln der Nadelbäume. Um es in
      seiner empfindlichsten Phase zu schonen, sind bestimmte Waldgebiete vom 15. Dezember bis zum 30. Juni
      für die Öffentlichkeit gesperrt: eine jährliche feste Schutzregelung.


      Bei solch scheuen Tieren liegt der Reiz der Naturbeobachtung im Lesen ihrer Spuren. Der Lehrpfad
      ermuntert dazu, nach Fährten von Gämse, Reh, Hirsch, Fuchs und Luchs Ausschau zu halten, statt auf
      direkte Begegnungen zu warten, da die Tiere bei menschlichen Schritten ausweichen; manche wittern
      Wanderer schon aus etlichen Metern Entfernung. Im Juni und Juli lässt sich entlang des Crêt Pela die
      Breitblättrige Kuckucksblume entdecken.
    visit: >-
      Für einen entspannten Einstieg bietet sich der Sentier des Explorateurs in Prémanon an, ein leichter
      Rundweg von einer Stunde, 2 km Länge und 71 m Höhenunterschied, der von Schulkindern für Familien
      entworfen wurde. Der Pfad über den Crêt Pela führt durch ein durch Biotopschutzverordnung gesichertes
      Waldgebiet mit sensiblen Bewohnern.


      Der Naturpark stellt zahlreiche Routen bereit. Das Portal Haut-Jura Rando bündelt Touren zu Fuß, per
      Mountainbike und mit Schneeschuhen in unterschiedlichen Längen und Niveaus, während die Rundtour im
      Parkherzen 7 Streckenabschnitte mit Varianten zu Fuß, auf Schneeschuhen, per Langlaufski, Mountainbike
      oder Pferd umfasst. Radfahrern stehen 44 ausgeschilderte Strecken mit insgesamt 1.500 km verkehrsarmen
      Nebenstraßen und über 100 markierten Sehenswürdigkeiten offen, ergänzt durch E-Bike-Verleihstationen. Im
      Winter informiert eine interaktive Karte über Loipen, Schneeschuh- und Hundeschlittenrouten.


      Die Maison du Parc in Lajoux beherbergt die Parkverwaltung sowie das Besucherzentrum: Hier locken die
      Dauerausstellung «Haut-Jura, Terre Vivante!» über Landschaften, Moore und Wälder sowie der historische
      Kornspeicher Grenier-Fort im Garten. Im Vorführraum vermittelt «Der Gesang des Risoux-Waldes» eine
      Klangreise durch acht Jahrzehnte forstlicher Ökoakustik. Die Rendez-vous du Parc bieten kostenlose
      Exkursionen, Vorträge und Workshops für die ganze Familie an.
    history: >-
      Der Naturpark versteht Waldökosysteme als Reservoire biologischer Vielfalt und fördert strukturreiche
      Mischwälder mit vielschichtigen Vegetationsstufen. Naturschutz beruht hier auf dem engen Miteinander von
      Landwirten, Forstleuten und Besuchern. Der Fluss Valserine in den Departements Ain und Jura trägt das
      Gütesiegel «Wilder Fluss».
    before: >-
      Der Park fasst dies unter dem Begriff Quiétude attitude zusammen: acht einfache Verhaltensweisen für
      Freizeitaktivitäten mit Respekt vor Natur und Weidewirtschaft. Viele Pfade queren Privatweiden von
      Milchkühen, deren Milch für Jurakäse wie den Comté bestimmt ist. Biwakieren zwischen 19 h und 9 h ist
      grundsätzlich gestattet, in Kernzonen und Schutzgebieten jedoch reglementiert oder untersagt. Hunde
      müssen abschnittsweise angeleint bleiben. Beim Zusammentreffen mit Herdenschutzhunden gilt: Ruhe
      bewahren, stehenbleiben, nicht in die Augen blicken und auf markierten Wegen bleiben.
    around: >-
      Direkt an den Park grenzen die [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) (0 km) und der
      [Parc Naturel Régional Jura Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) (1 km); etwas weiter
      entfernt liegen [La Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) (15 km) und dahinter
      die [Gorges du Doubs - Franco-Suisses](/lugar/gorges-du-doubs---franco-suisses/).
  it:
    intro: >-
      Circa cento galli cedroni vivono nelle foreste dell'Alto Giura, una specie minacciata di estinzione, e
      gran parte di ciò che si osserva qui ruota attorno all'imperativo di non disturbarli. Il Parco Naturale
      Regionale dell'Haut-Jura è stato istituito il 10 febbraio 1986 nel sud-ovest della catena del Giura, a
      ridosso del confine svizzero, e associa oggi comuni di tre dipartimenti — Ain, Doubs e Jura — su circa
      178.000 ettari. Le foreste ricoprono il 70% del suo territorio, pascolate soprattutto da bovine da latte
      montbéliarde: una montagna viva di bosco, acqua e prati.
    landscape: >-
      L'acqua è onnipresente: incide la pietra e scorre lungo fiumi e cascate. Il massiccio modella altopiani
      ondulati da 700 a 1.000 m solcati da profonde combes e da cluses, valli trasversali che uniscono un
      bacino all'altro senza valicare colli. Gli scenari mutano sensibilmente da un versante all'altro.


      Nella Montagna Piegata, tra 950 m e il Mont d'Or (1.460 m), si alternano rilievi, conche e valli; le
      cime ampie e spianate sono adibite ad alpeggio estivo. Il Crêt Pela, a 1.495 metri, è la massima
      elevazione del dipartimento del Jura, con creste più larghe delle valli e il classico mosaico di pascoli
      alberati. Il Crêt de la Neige, con 1.718 m, domina la linea di vetta del Giura; il versante precipita
      verso la Svizzera con un dislivello superiore a 1.000 m. I laghi e le torbiere sul fondo dei Grands Vaux
      rappresentano celebri poli di gelo intenso durante i rigidi inverni.
    wildlife: >-
      La foresta è l'habitat sovrano. Tra le specie più rappresentative spiccano la
      [lince](/especie/lynx_lynx/) e il [gallo cedrone](/especie/tetrao_urogallus/), e tra quelle meno
      visibili il gambero di fiume europeo e le orchidee selvatiche. Il gallo cedrone si nutre di aghi di
      conifera. Per tutelarlo nella fase più delicata, alcuni comparti boschivi sono chiusi al pubblico dal 15
      dicembre al 30 giugno: una limitazione annuale fissa.


      Con animali tanto guardinghi, la via migliore per scoprire il bosco consiste nell'interpretarne le
      tracce. Il percorso didattico invita a cercare orme di camoscio, capriolo, cervo, volpe e lince,
      evitando di attendere un incontro visivo, dato che gli animali fuggono al minimo rumore di passi; alcuni
      percepiscono presenze a diversi metri allontanandosi prima di essere scorti. In giugno e luglio, lungo
      il Crêt Pela, fiorisce l'orchidea colombina.
    visit: >-
      Per iniziare con calma, il Sentier des Explorateurs a Prémanon è un anello agevole di un'ora, lungo 2 km
      con 71 m di dislivello positivo, ideato dagli scolari per le famiglie amanti della natura. L'itinerario
      del Crêt Pela attraversa un biotopo forestale tutelato per la presenza di specie minacciate.


      Il parco mette a disposizione molti altri percorsi. La piattaforma Haut-Jura Rando elenca itinerari a
      piedi, in mountain bike e con ciaspole di ogni livello, mentre la traversata nel cuore del parco propone
      7 tappe ed escursioni ad anello a piedi, con racchette da neve, sci di fondo, bici o a cavallo. Per il
      cicloturismo sono predisposti 44 circuiti per 1.500 km di strade secondarie e oltre 100 curiosità
      segnalate, con noleggio di bici elettriche. D'inverno il parco pubblica una mappa interattiva per sci
      nordico, ciaspole e slitte trainate da cani.


      La Maison du Parc a Lajoux ospita la sede e il centro visite: presenta l'esposizione permanente
      «Haut-Jura, Terre Vivante!» su paesaggi, zone umide e boschi, nonché il Grenier-Fort, antico granaio di
      legno nel cortile. Nella sala proiezioni è diffuso «Il canto della foresta del Risoux», installazione
      sonora su otto decenni di rilievi ecoacustici. I Rendez-vous du Parc organizzano escursioni guidate,
      conferenze, proiezioni e laboratori gratuiti per famiglie.
    history: >-
      Il parco intende i popolamenti forestali come serbatoi di biodiversità e promuove la diversità di specie
      arboree e strati vegetali. La salvaguardia qui è questione di intesa continua fra allevatori, boscaioli
      e amanti della natura. Il fiume Valserine, che scorre nell'Ain e nello Jura, vanta il riconoscimento di
      «fiume selvaggio».
    before: >-
      Il parco riassume questo spirito nella Quiétude attitude: otto accortezze per praticare sport e svago
      nel rispetto degli equilibri naturali e del lavoro agricolo. Molti sentieri attraversano proprietà
      private dove pascolano le mandrie da cui si ricava il celebre formaggio Comté. Il bivacco, permesso tra
      le 19 h e le 9 h, è severamente vietato in talune riserve naturali. Se ti muovi con un cane, verifica le
      regole delle diverse aree; fuori da esse il guinzaglio è raccomandato. Di fronte a cani da guardiania,
      informati sui pascoli, non deviare dai sentieri, fermati e non fissarli negli occhi.
    around: >-
      Confinanti con il parco sono la [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) (0 km) e il [Parc
      Naturel Régional Jura Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) (1 km); poco più distanti,
      [La Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) (15 km) e, oltre, le [Gorges du Doubs -
      Franco-Suisses](/lugar/gorges-du-doubs---franco-suisses/).
  pt:
    intro: >-
      Cerca de cem tetrazes-grandes habitam as florestas do Alto Jura, uma espécie ameaçada de extinção, e
      grande parte do que aqui se vive gira em torno da necessidade de não os perturbar. O Parque Natural
      Regional do Haut-Jura foi instituído a 10 de fevereiro de 1986 no sudoeste do maciço jurassiano, ao
      longo da fronteira suíça, congregando hoje municípios de três departamentos — Ain, Doubs e Jura — em
      cerca de 178.000 hectares. As florestas cobrem 70% da sua superfície, sob as quais pastam sobretudo
      vacas leiteiras montbéliardes: uma montanha habitada de arvoredo, água e pastagens.
    landscape: >-
      A água corre por todo o lado: esculpe as rochas e alimenta inúmeros rios e cascatas. O maciço configura
      planaltos ondulados de 700 a 1.000 m recortados por combes profundas e por cluses, passagens naturais de
      um vale a outro sem necessidade de transpor portelas. A paisagem transforma-se claramente de um setor
      para o seguinte.


      Na Montanha Dobrada, entre 950 m e o Mont d'Or (1.460 m), revezam-se cumes, vales e combes; as elevações
      aplanadas servem de pastagens de verão. O Crêt Pela, a 1.495 metros, constitui o ponto mais alto do
      departamento do Jura, ostentando lombas mais largas que os vales e a paisagem singular dos prés-bois. O
      Crêt de la Neige, com 1.718 m, encima a linha de cumeadas do Jura; o território debruça-se sobre a Suíça
      com um desnível superior a 1.000 m. As lagoas e turfeiras no fundo dos Grands Vaux continuam a ser
      autênticos polos de frio extremo nos invernos mais duros.
    wildlife: >-
      A floresta é o santuário. Entre as espécies mais emblemáticas destacam-se o [lince](/especie/lynx_lynx/)
      e o [tetraz-grande](/especie/tetrao_urogallus/), figurando entre as mais discretas o
      lagostim-de-patas-brancas e várias orquídeas bravias. O tetraz nutre-se de agulhas de coníferas. Para o
      resguardar na sua época mais vulnerável, certos setores florestais encerram ao público de 15 de dezembro
      a 30 de junho: uma interdição anual intransponível.


      Diante de animais tão esquivos, a melhor maneira de sentir a floresta é decifrar os seus vestígios. O
      percurso pedagógico convida a rastrear pegadas de camurça, corço, veado, raposa e lince, em vez de
      esperar um avistamento direto, dado que os animais fogem com o ruído de passos; alguns pressentem
      aproximações a vários metros e afastam-se antes de serem avistados. Em junho e julho, ao longo do Crêt
      Pela, pode encontrar-se a orquídea-rã.
    visit: >-
      Para começar de forma tranquila, o Sentier des Explorateurs em Prémanon é um circuito acessível de uma
      hora, com 2 km e 71 m de desnível positivo, concebido por crianças da escola para famílias apreciadoras
      da natureza. A rota do Crêt Pela cruza um biótopo florestal protegido por decreto devido à presença de
      espécies vulneráveis.


      O parque disponibiliza muitas outras rotas. O portal Haut-Jura Rando reúne itinerários pedestres, de BTT
      e com raquetes de neve para todos os níveis, enquanto a travessia pelo âmago do parque oferece 7
      traçados e múltiplos circuitos a pé, com raquetes, esqui de fundo, BTT ou a cavalo. Em bicicleta estão
      traçados 44 percursos que totalizam 1.500 km por estradas secundárias tranquilas e mais de 100 pontos de
      interesse, com bicicletas elétricas disponíveis para aluguer. No inverno, o parque publica um mapa
      interativo para esqui nórdico, raquetes e trenós puxados por cães.


      A Maison du Parc, em Lajoux, congrega a sede e o centro de visitantes: apresenta a exposição permanente
      «Haut-Jura, Terre Vivante!» sobre paisagens, zonas húmidas e florestas, bem como o histórico celeiro
      Grenier-Fort no jardim. Na sala de projeção ouve-se «O canto da floresta do Risoux», uma experiência
      sonora que cobre oito décadas de recolhas ecoacústicas. Os Rendez-vous du Parc organizam saídas de
      campo, palestras e oficinas gratuitas para as famílias explorarem a montanha.
    history: >-
      O parque encara as massas florestais como reservatórios de biodiversidade, fomentando a coexistência de
      várias espécies arbóreas e estratos vegetais. A conservação faz-se em permanente diálogo com os
      criadores de gado, os técnicos florestais e a fauna. O rio Valserine, nos departamentos de Ain e Jura,
      ostenta a chancela de «rio selvagem».
    before: >-
      O parque resume esta atitude na Quiétude attitude: oito gestos simples para desfrutar da natureza
      respeitando a vida selvagem e o trabalho dos produtores locais. Vários trilhos atravessam pastagens
      privadas onde pastam as vacas leiteiras cujo leite origina queijos jurassianos como o Comté. O bivaque,
      consentido entre as 19 h e as 9 h, encontra-se estritamente condicionado ou interditado em certas
      reservas. Ao levar cão, consulta as normas de cada setor; nos restantes caminhos o uso de trela é
      vivamente recomendado. Perante cães de proteção de rebanhos, informa-te com antecedência, não saias dos
      trilhos balizados, mantém a calma, imobiliza-te e evita encará-los nos olhos.
    around: >-
      Contíguos ao parque situam-se a [Haute Vallée de l'Ain](/lugar/haute-vallee-de-l-ain/) (0 km) e o [Parc
      Naturel Régional Jura Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) (1 km); um pouco mais longe,
      [La Loue - Vallée et Gorges](/lugar/la-loue---vallee-et-gorges/) (15 km) e, para além deste, as [Gorges
      du Doubs - Franco-Suisses](/lugar/gorges-du-doubs---franco-suisses/).
