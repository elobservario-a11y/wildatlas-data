resumen:
  es: >-
    Calas de arena blanca encerradas entre sabinares costeros, barrancos de acebuche y estanques de agua dulce
    de Ses Fonts de n'Alis.
  en: >-
    White-sand coves nestled between coastal juniper groves, wild olive ravines and the freshwater wetlands of
    Ses Fonts de n’Alis.
  fr: >-
    Criques de sable blanc enchâssées entre genévriers côtiers, ravins d’oliviers sauvages et étangs d’eau
    douce de Ses Fonts de n’Alis.
  de: >-
    Weiße Sandbuchten zwischen Küsten-Wacholderhainen, Olivenbaum-Schluchten und den Süßwasser-Lagunen von Ses
    Fonts de n’Alis.
  it: >-
    Cale di sabbia bianca racchiuse tra gineprai costieri, forre di olivo selvatico e gli stagni d’acqua dolce
    di Ses Fonts de n’Alis.
  pt: >-
    Calas de areia branca envolvidas por zimbrais costeiros, barrancos de zambujeiro e as lagoas de água doce
    de Ses Fonts de n’Alis.
unico:
  es: >-
    En un espacio pequeño caben bosque, humedal, playa, duna, acantilado, torrente y cueva, todo rodeado de
    campos de secano que siguen siendo parte del paisaje.
  en: >-
    A compact coastal mosaic uniting pine forests, wetlands, dunes, cliffs and sea caves, framed by active
    dry-stone agricultural terraces.
  fr: >-
    Un condensé littoral réunissant pinèdes, zones humides, dunes, falaises et grottes, entouré de parcelles
    agricoles traditionnelles en murets de pierre sèche.
  de: >-
    Ein kompaktes Küstenmosaik aus Pinienwäldern, Feuchtgebieten, Dünen, Klippen und Meereshöhlen, eingebettet
    in jahrhundertealte Trockenstein-Kulturlandschaft.
  it: >-
    Un compatto mosaico litoraneo che unisce pinete, zone umide, dune, scogliere e grotte, circondato da
    tradizionali terrazzamenti agricoli in pietra a secco.
  pt: >-
    Um mosaico litorâneo que reúne pinhais, zonas húmidas, dunas, arribas e grutas marinhas, emoldurado por
    parcelas agrícolas tradicionais de pedra seca.
observaciones:
  es: >-
    Pasea en silencio y por los caminos: así evitas molestias a la fauna y a otras personas. Es una zona de
    alto riesgo de incendio, y no se debe encender fuego en ningún caso. Los perros van atados y no se pasean
    por las playas. En el parque no hay papeleras, así que te llevas los residuos. Respeta los elementos
    etnológicos y la propiedad privada.
texto:
  es:
    intro: >-
      Hace unos 6 millones de años, aquí no había campos ni sabinas: había un mar somero y cálido, con
      arrecifes de coral, y Mallorca tenía clima tropical. Aquel fondo marino es hoy la costa sudeste de la
      isla, en Santanyí, y el Parque Natural de Mondragó es la manera de recorrerla a pie: calas largas y
      estrechas, dos estanques, garriga de acebuche y una trama de campos cerrados con paredes de piedra seca.
    landscape: >-
      La base es piedra. En la parte baja de los acantilados, la unidad arrecifal guarda corales y algas
      calcáreas; encima, las calizas de Santanyí, y en la costa, el marés, arenisca que fue playa y duna.
      Después llegaron los torrentes, que abrieron barrancos largos y estrechos, y el mar entró por sus
      desembocaduras. Así nacieron cales como la de Mondragó: más largas que anchas, orientadas igual que los
      torrentes.


      Sobre esa roca se extiende la garriga, la vegetación que manda en el parque. Predomina el acebuche,
      acompañado de sabina y pino blanco, con lentisco, estepa limonera y romero en el sotobosque. En el fondo
      de los barrancos, donde el suelo es más hondo y húmedo, quedan restos de encinar, un bosque muy
      fraccionado que se refugia en los torrentes.


      El agua dulce y la salada se encuentran en los dos estanques, s'Amarador y ses Fonts de n'Alis. En el
      segundo, la sal impone sus condiciones: junco y salicornia. En el primero, más dulce, crece el carrizo.
      Detrás de la playa de s'Amarador hay un sistema dunar, sujeto por el lirio de mar, el cardo marino y el
      margall de playa. Y en la costa rocosa, expuesta a la sal y al viento, resisten el hinojo marino, las
      saladinas y Launaea cervicornis, una planta endémica de las Baleares.


      Entre medias, los campos: parcelas cerradas con pared seca, cereal y árboles de secano, con almendros,
      algarrobos e higueras. Siglos de agricultura y ganadería han dejado también norias, acequias y
      cisternas.
    wildlife: >-
      Mondragó es un buen sitio para mirar al cielo. En el parque se han catalogado cerca de un centenar de
      especies de aves, muchas migratorias y propias de zonas húmedas, y los dos estanques son un punto de
      descanso en las rutas migratorias entre Europa y África. En ellos busca el [ánade
      real](/especie/anas_platyrhynchos/), la gallineta y la focha común. En la costa rocosa, el [cormorán
      moñudo](/especie/phalacrocorax_aristotelis/) y la [gaviota de Audouin](/especie/larus_audouinii/). Entre
      las rapaces destacan el [halcón peregrino](/especie/falco_peregrinus/), el [milano
      real](/especie/milvus_milvus/) y el [águila pescadora](/especie/pandion_haliaetus/), y la garriga da
      alimento, refugio y lugar de cría a pájaros pequeños y medianos como el carbonero común y la abubilla.


      Entre los reptiles destaca la [tortuga mediterránea](/especie/testudo_hermanni/). El parque ha soltado
      ejemplares desde su creación para recuperar sus poblaciones. En las balsas viven la culebra viperina y
      el calàpet, un anfibio que cría en las balsas temporales. Entre los mamíferos se citan el erizo, la rata
      montesa, la comadreja, la marta y la [gineta](/especie/genetta_genetta/).


      Y según la época, las orquídeas: la mosca gorda, Ophrys fusca, Spiranthes spiralis y la Ophrys
      balearica, endemismo balear.
    visit: >-
      El parque tiene cinco itinerarios señalizados a pie, fáciles y de entre 15 y 60 minutos: el mirador de
      ses Fonts de n'Alis, la vuelta a sa Guàrdia d'en Garrot, sa Punta de ses Gatoves, s'Amarador y s'Hort
      d'en Metge. El del mirador une el aparcamiento con la playa a través del bosque, junto al estanque. El
      de sa Punta de ses Gatoves, que recorre el sabinar costero, está adaptado a personas con movilidad
      reducida. Quien no pueda acceder al medio natural por una dificultad física o psíquica puede solicitar
      un itinerario con silla Joëlette.


      El centro de información está junto al aparcamiento de ses Fonts de n'Alis y aconseja qué ruta elegir
      según tus intereses. Hay visitas guiadas gratuitas durante todo el año, previamente concertadas.
    history: >-
      Mondragó se declaró parque natural en 1992. Forma parte de Natura 2000 como ZEPA y ZEC, y es también
      Área Natural de Especial Interés. De unas 766 hectáreas, solo 95 son de propiedad pública; el resto son
      fincas privadas muy parceladas, dedicadas a cultivo extensivo de secano. Por eso el cuidado del parque
      es también el cuidado de un paisaje agrario vivo.


      En la playa del Caló d'en Garrot, la vegetación dunar está muy dañada por el tránsito constante de
      vehículos.
    before: >-
      Pasea en silencio y por los caminos: así evitas molestias a la fauna y a otras personas. Es una zona de
      alto riesgo de incendio, y no se debe encender fuego en ningún caso. Los perros van atados y no se
      pasean por las playas. En el parque no hay papeleras, así que te llevas los residuos. Respeta los
      elementos etnológicos y la propiedad privada.
    around: >-
      Lejos de Mallorca, el parque comparte especies y costa con el [Parque Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) (pino blanco, cormorán moñudo y tortuga mediterránea), con
      la [Península de Akamas](/lugar/akamas-peninsula/) (lentisco y sabina) y con el [Parque Natural del
      Archipiélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/) (pino blanco y gaviota de Audouin).
  en:
    intro: >-
      Around 6 million years ago, this landscape was neither farmland nor juniper grove: a shallow tropical
      sea with coral reefs bathed ancient Mallorca. That primordial seabed now forms the island’s southeastern
      coast in Santanyí, and Mondragó Natural Park is the best way to explore it on foot: narrow sea inlets,
      two coastal lagoons, wild olive garrigue and an intricate mosaic of dry-stone enclosures.
    landscape: >-
      The bedrock tells the geological story. At the base of coastal cliffs lies a fossil reef preserving
      corals and calcareous algae; above sit the Santanyí limestones, and on the shoreline rests marès,
      calcarenite sandstone formed from prehistoric beaches and dunes. Seasonal torrents subsequently carved
      deep ravines, and rising seas drowned their mouths, creating long, sheltered calas such as Cala
      Mondragó.


      Garrigue scrub blankets the rocky terrain, dominated by wild olive alongside Phoenician juniper and
      Aleppo pine, with mastic, rockrose and rosemary filling the understorey. Along canyon bottoms where
      deeper soil retains moisture, fragmented holm oak woodlands find a sheltered refuge.


      Freshwater and sea meet in two coastal lagoons: s’Amarador and ses Fonts de n’Alis. In the latter,
      salinity encourages sea rush and glasswort. In s’Amarador, fresher water supports dense reedbeds. Behind
      s’Amarador beach lies a fragile dune belt anchored by sea daffodils and sea holly, while wind-sculpted
      rocky shelves sustain rock samphire and the Balearic endemic hedgehog lettuce (Launaea cervicornis).


      Interspersed across the park are traditional rural plots enclosed by dry-stone walls (*marges*), where
      almond, carob and fig trees flourish alongside old waterwheels, irrigation channels and cisterns.
    wildlife: >-
      Mondragó offers exceptional birdwatching across varied coastal habitats. Around a hundred bird species
      have been recorded, many pausing at the freshwater ponds during trans-Mediterranean migrations between
      Europe and Africa. The lagoons attract [mallard](/especie/anas_platyrhynchos/), common moorhen and
      Eurasian coot. Along maritime cliffs, the [European shag](/especie/phalacrocorax_aristotelis/) and
      [Audouin's gull](/especie/larus_audouinii/) patrol the coastline. Raptors include the [peregrine
      falcon](/especie/falco_peregrinus/), the [red kite](/especie/milvus_milvus/) and the
      [osprey](/especie/pandion_haliaetus/), while dense scrub provides nesting territory for great tits and
      hoopoes.


      Among reptiles, [Hermann's tortoise](/especie/testudo_hermanni/) is the flagship species, bolstered by
      captive-breeding releases since the park’s creation. Ponds host viperine snakes and the green toad
      (*calàpet*), which breeds in temporary pools. Mammals include hedgehogs, wood mice, least weasels, pine
      martens and the [common genet](/especie/genetta_genetta/).


      Seasonally, wild orchids bloom across forest glades, including the dark bee orchid, autumn
      lady's-tresses and the endemic Balearic orchid (*Ophrys balearica*).
    visit: >-
      The park features five signposted walking trails, all easy and taking between 15 and 60 minutes: Ses
      Fonts de n’Alis viewpoint, the Sa Guàrdia d’en Garrot loop, Sa Punta de ses Gatoves, S’Amarador and
      S’Hort d’en Metge. The viewpoint trail links the main car park to the beach through coastal pine woods
      along the lagoon. The Sa Punta de ses Gatoves trail through coastal junipers is fully accessible for
      visitors with reduced mobility. Visitors requiring assistance can request an all-terrain Joëlette chair.


      The visitor information centre is located beside the Ses Fonts de n’Alis car park and provides
      recommendations suited to your interests. Free guided tours are offered year-round by advance
      reservation.
    history: >-
      Mondragó was designated a natural park in 1992. It belongs to Natura 2000 as both a Special Protection
      Area and a Special Area of Conservation, while also holding Balearic Natural Area of Special Interest
      status. Of its 766 hectares, only 95 are public property; the remainder consists of small private
      agricultural estates dedicated to traditional dry farming, making park conservation inseparable from
      agrarian stewardship.


      At Caló d’en Garrot, coastal dunes have suffered historic degradation from unauthorized vehicle access.
    before: >-
      Walk quietly and remain on signposted footpaths to avoid disturbing nesting wildlife and fellow
      visitors. Wildfire risk is acute; open fires and smoking are strictly forbidden. Dogs must be kept on a
      leash and are prohibited on beaches. There are no waste bins in the park, so pack out all trash. Respect
      historical dry-stone structures and private farmland.
    around: >-
      Beyond Mallorca, the park shares Mediterranean coastal affinities with [Cap de Creus Natural
      Park](/lugar/parc-natural-del-cap-de-creus/) (Aleppo pine, European shag and Hermann's tortoise), the
      [Akamas Peninsula](/lugar/akamas-peninsula/) (mastic and Phoenician juniper) and [Lastovo Archipelago
      Nature Park](/lugar/park-prirode-lastovsko-otocje/) (Aleppo pine and Audouin's gull).
  fr:
    intro: >-
      Il y a environ 6 millions d'années, ce paysage n'abritait ni champs cultivés ni genévriers : une mer
      chaude et peu profonde aux récifs coralliens baignait une île de Majorque au climat tropical. Cet ancien
      fond marin constitue aujourd'hui la côte sud-est à Santanyí, et le parc naturel de Mondragó offre le
      moyen idéal de le parcourir à pied : criques échancrées, deux étangs littoraux, garrigue d'oléastres et
      réseau de terrasses ceintes de pierre sèche.
    landscape: >-
      La roche sous-jacente raconte l'histoire géologique. Au pied des falaises, la terrasse récifale renferme
      coraux et algues calcaires fossiles ; au-dessus s'étendent les calcaires de Santanyí, et sur le rivage
      le marès, grès dunaire d'anciennes plages quaternaires. Les torrents côtiers ont ensuite creusé
      d'étroits ravins dont les embouchures ont été envahies par la mer, formant des calanques
      caractéristiques comme celle de Mondragó.


      Sur ce socle rocheux règne la garrigue méditerranéenne dominée par l'oléastre, le genévrier de Phénicie
      et le pin d'Alep, avec un sous-bois de lentisque, ciste cotonneux et romarin. Au fond des vallons plus
      humides subsistent des lambeaux de chênaies vertes réfugiées dans les ravins.


      Les eaux douces et salées se côtoient dans les deux étangs de s'Amarador et de ses Fonts de n'Alis. Dans
      ce dernier, la salinité favorise joncs et salicornes. À s'Amarador, les eaux plus douces nourrissent une
      roselière dense. En arrière de la plage de s'Amarador s'élève un cordon dunaire fixé par le lis maritime
      et le panicaut, tandis que le littoral rocheux abrite la criste marine et l'épineuse Launaea
      cervicornis, endémique des Baléares.


      Entre ces espaces naturels subsistent des parcelles de polyculture protégées de murs en pierre sèche,
      avec amandiers, caroubiers et figuiers, ponctuées de norias et citernes traditionnelles.
    wildlife: >-
      Mondragó est un observatoire privilégié pour les amateurs d'oiseaux. Près d'une centaine d'espèces y ont
      été recensées, nombre d'entre elles faisant escale sur les étangs lors de leur migration entre l'Europe
      et l'Afrique. On y rencontre le [canard colvert](/especie/anas_platyrhynchos/), la poule d'eau et la
      foulque macroule. Sur les côtes rocheuses patrouillent le [cormoran
      huppé](/especie/phalacrocorax_aristotelis/) et le [goéland d'Audouin](/especie/larus_audouinii/). Parmi
      les rapaces figurent le [faucon pèlerin](/especie/falco_peregrinus/), le [milan
      royal](/especie/milvus_milvus/) et le [balbuzard pêcheur](/especie/pandion_haliaetus/), tandis que la
      garrigue abrite mésanges et huppes fasciées.


      Chez les reptiles, la [tortue d'Hermann](/especie/testudo_hermanni/) fait l'objet de lâchers réguliers
      depuis la création du parc pour reconstituer ses populations sauvages. Les mares abritent la couleuvre
      vipérine et le crapaud vert baléare (*calàpet*). Les mammifères comptent le hérisson, la belette, la
      martre des pins et la [genette commune](/especie/genetta_genetta/).


      Au fil des saisons fleurissent des orchidées remarquables, dont l'ophrys brun, la spiranthe d'automne et
      l'endémique Ophrys balearica.
    visit: >-
      Le parc propose cinq sentiers balisés, très faciles et d'une durée comprise entre 15 et 60 minutes : le
      belvédère de ses Fonts de n’Alis, le tour de sa Guàrdia d’en Garrot, sa Punta de ses Gatoves, s’Amarador
      et s’Hort d’en Metge. Le sentier du belvédère relie le parking à la plage à travers les pins au bord de
      l'étang. Le parcours de sa Punta de ses Gatoves est aménagé pour les personnes à mobilité réduite. Les
      personnes ayant des difficultés motrices peuvent réserver un fauteuil tout-terrain Joëlette.


      Le centre d'accueil situé près du parking de ses Fonts de n’Alis fournit plans et conseils
      d'itinéraires. Des visites guidées gratuites sont proposées toute l'année sur réservation.
    history: >-
      Mondragó a été déclaré parc naturel en 1992. Il est intégré au réseau Natura 2000 au titre de ZPS et
      ZSC, et classé zone naturelle d'intérêt spécial des Baléares. Sur ses 766 hectares, seules 95 relèvent
      du domaine public ; le reste est constitué de petites exploitations agricoles privées de cultures
      sèches, associant la sauvegarde des milieux naturels à la préservation du paysage rural vivant.


      À la crique de Caló d’en Garrot, la végétation dunaire a souffert par le passé de la circulation
      incontrôlée des véhicules.
    before: >-
      Marchez discrètement et restez impérativement sur les sentiers balisés afin de ne pas perturber la faune
      ni détériorer la flore. Le risque d'incendie est très élevé : tout feu et tout mégot sont formellement
      proscrits. Les chiens doivent être tenus en laisse et sont interdits sur le sable. Emportez
      l'intégralité de vos déchets et respectez le patrimoine en pierre sèche et les propriétés privées.
    around: >-
      Au-delà de Majorque, le parc partage son cortège biologique méditerranéen avec le [parc naturel du Cap
      de Creus](/lugar/parc-natural-del-cap-de-creus/) (pin d'Alep, cormoran huppé et tortue d'Hermann), la
      [péninsule d'Akamas](/lugar/akamas-peninsula/) (lentisque et genévrier) et le [parc naturel de
      l'archipel de Lastovo](/lugar/park-prirode-lastovsko-otocje/) (pin d'Alep et goéland d'Audouin).
  de:
    intro: >-
      Vor rund 6 Millionen Jahren gab es hier weder Ackerland noch Wacholder: Ein flaches, warmes Meer mit
      Korallenriffen umspülte damals das tropische Mallorca. Jener einstige Meeresboden bildet heute die
      Südostküste der Insel in Santanyí, und der Naturpark Mondragó erschließt ihn ideal zu Fuß:
      langgestreckte Buchten, zwei Küstenseen, Macchia aus wilden Olivenbäumen und von Trockensteinmauern
      eingefasste Felder.
    landscape: >-
      Das Gestein bildet das Fundament. Am Fuß der Klippen bewahrt die fossile Riffformation uralte Korallen
      und Kalkalgen; darüber lagern die Santanyí-Kalke und an der Brandungslinie der Marès-Sandstein früherer
      Dünen und Strände. Später schnitten periodische Wildbäche tiefe Schluchten ins Gestein, deren Mündungen
      vom Meer überflutet wurden – so entstanden Buchten wie Cala Mondragó.


      Auf dem Kalkstein breitet sich die für den Park typische Garrigue aus. Wilder Ölbaum, Phönizischer
      Wacholder und Aleppo-Kiefern bestimmen das Bild, durchsetzt mit Mastixstrauch, Zistrosen und Rosmarin.
      In feuchteren Schluchtsohlen mit tiefgründigem Boden behaupten sich kleine Restbestände von Steineichen.


      Süß- und Salzwasser begegnen sich in zwei Lagunen: s’Amarador und ses Fonts de n’Alis. Im salzigeren See
      gedeihen Binsen und Queller, während s’Amarador von dichtem Schilfrohr gesäumt wird. Hinter dem Strand
      von s’Amarador stabilisieren Strandlilie und Stranddistel das Dünensystem, während an windigen
      Felsküsten Meerfenchel und der endemische Dornlattich (Launaea cervicornis) trotzen.


      Dazwischen liegen traditionelle Parzellen mit Mandel-, Johannisbrot- und Feigenbäumen, eingerahmt von
      Trockensteinmauern und ergänzt durch historische Schöpfräder und Zisternen.
    wildlife: >-
      Mondragó ist ein hervorragendes Revier für Vogelbeobachter. Rund einhundert Vogelarten wurden
      registriert; viele nutzen die Feuchtgebiete als Rastplatz auf dem Zug zwischen Europa und Afrika. An den
      Lagunen suchen [Stockente](/especie/anas_platyrhynchos/), Teichhuhn und Blässhuhn nach Nahrung. An den
      Felsenküsten patrouillieren [Krähenscharbe](/especie/phalacrocorax_aristotelis/) und
      [Korallenmöwe](/especie/larus_audouinii/). Unter den Greifvögeln sind
      [Wanderfalke](/especie/falco_peregrinus/), [Rotmilan](/especie/milvus_milvus/) und
      [Fischadler](/especie/pandion_haliaetus/) vertreten, während die Macchia Singvögeln wie Meisen und
      Wiedehopfen Schutz bietet.


      Bei den Reptilien ist die [Griechische Landschildkröte](/especie/testudo_hermanni/) die Leitart, deren
      Bestand durch gezielte Auswilderungsprogramme gestützt wird. In den Gewässern leben Würfel- und
      Vipernatter sowie die Balearen-Wechselkröte (*Calàpet*). Zu den Säugetieren zählen Igel, Wiesel,
      Baummarder und die [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/).


      Im Frühjahr und Herbst blühen seltene Orchideen wie Braunrote Ragwurz, Herbst-Drehwurz und die
      endemische Balearen-Ragwurz.
    visit: >-
      Der Park verfügt über fünf markierte Rundwanderwege von jeweils 15 bis 60 Minuten Gehzeit: der
      Aussichtspunkt Ses Fonts de n’Alis, der Rundweg Sa Guàrdia d’en Garrot, Sa Punta de ses Gatoves,
      S’Amarador und S’Hort d’en Metge. Der Aussichtsweg führt vom Parkplatz durch Kiefernwälder zum Strand.
      Der Weg Sa Punta de ses Gatoves durch die Küstenwacholder ist barrierefrei ausgebaut. Personen mit
      eingeschränkter Mobilität können zudem eine geländegängige Joëlette-Sänfte reservieren.


      Das Informationszentrum am Parkplatz von Ses Fonts de n’Alis berät zur Routenwahl. Kostenlose Führungen
      werden nach vorheriger Anmeldung ganzjährig angeboten.
    history: >-
      Mondragó wurde 1992 zum Naturpark erklärt. Er gehört als Vogelschutzgebiet und FFH-Gebiet zum Natura
      2000-Netzwerk. Von den rund 766 Hektar Parkfläche befinden sich lediglich 95 Hektar in öffentlicher
      Hand; die restlichen Flächen sind landwirtschaftliche Privatparzellen, wodurch der Schutz des Naturraums
      untrennbar mit dem Erhalt der traditionellen Agrarlandschaft verknüpft ist.


      An der Bucht Caló d’en Garrot wurde die Dünenvegetation in der Vergangenheit durch unbefugten
      Fahrzeugverkehr geschädigt.
    before: >-
      Verhalte dich ruhig und bleibe auf den ausgeschilderten Wegen, um Tiere und Mitwanderer nicht zu stören.
      Wegen extremer Waldbrandgefahr ist jegliches Feuer streng untersagt. Hunde müssen an der Leine geführt
      werden und sind am Strand nicht gestattet. Nimm Abfälle vollständig wieder mit und respektiere
      Trockensteinbauten sowie Privateigentum.
    around: >-
      Über Mallorca hinaus teilt der Naturpark Lebensräume mit dem [Naturpark Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) (Aleppo-Kiefer, Krähenscharbe und Landschildkröte), der
      [Akamas-Halbinsel](/lugar/akamas-peninsula/) (Mastixstrauch und Phönizischer Wacholder) sowie dem
      [Naturpark Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/) (Aleppo-Kiefer und Korallenmöwe).
  it:
    intro: >-
      Circa 6 milioni di anni fa qui non c'erano campi coltivati né ginepri: un mare tropicale poco profondo e
      ricco di scogliere coralline bagnava l'antica Maiorca. Quell'antico fondale costituisce oggi la costa
      sud-orientale dell'isola a Santanyí, e il Parco Naturale di Mondragó è il modo perfetto per esplorarla a
      piedi: insenature strette e riparate, due lagune costiere, gariga di olivastro e una trama di
      appezzamenti cinti da muretti a secco.
    landscape: >-
      La roccia racconta l'evoluzione geologica. Alla base delle falesie si trovano coralli fossili e alghe
      calcaree dell'antico reef; superiormente poggiano i calcari di Santanyí e lungo la costa il marès,
      arenaria d'origine dunare e marina. Successivamente i torrenti hanno scavato gole strette e profonde,
      allagate dal mare alle foci per originare calette allungate come Cala Mondragó.


      Su questa roccia si sviluppa la gariga mediterranea, formazione vegetale dominante con olivastro
      selvatico, ginepro fenicio e pino d'Aleppo, accompagnati da lentisco, cisto e rosmarino. Sul fondo dei
      valloni più umidi resistono nuclei relitti di lecceta montana.


      Le acque dolci e salmastre si incontrano nei due stagni di s'Amarador e ses Fonts de n'Alis. Nel secondo
      la salinità favorisce giunchi e salicornie; nel primo, più dolce, prospera un fitto canneto. Alle spalle
      della spiaggia di s'Amarador si stende un cordone dunale trattenuto dal giglio marino e dall'eringio
      marittimo, mentre sulle rocce costiere ventose crescono il finocchio marino e l'endemica Launaea
      cervicornis balearica.


      In mezzo si alternano appezzamenti coltivati delimitati da muretti a secco, con mandorli, carrubi e
      fichi, testimoni di una secolare cultura rurale provvista di pozzi, canali e cisterne.
    wildlife: >-
      Mondragó è un ottimo sito per il birdwatching costiero. Nel parco sono state censite circa un centinaio
      di specie di uccelli, molte delle quali sostano nelle zone umide durante le rotte migratorie tra Europa
      e Africa. Negli stagni cercano cibo il [germano reale](/especie/anas_platyrhynchos/), la gallinella
      d'acqua e la folaga. Sulle scogliere rocciose nidificano il [marangone dal
      ciuffo](/especie/phalacrocorax_aristotelis/) e il [gabbiano corso](/especie/larus_audouinii/). Tra i
      rapaci spiccano il [falco pellegrino](/especie/falco_peregrinus/), il [nibbio
      reale](/especie/milvus_milvus/) e il [falco pescatore](/especie/pandion_haliaetus/), mentre la macchia
      ospita cince e upupe.


      Tra i rettili la specie di maggior rilievo è la [testuggine di Hermann](/especie/testudo_hermanni/),
      reintrodotta e monitorata con successo fin dalla nascita del parco. Negli invasi vivono la biscia
      tassellata e il rospo smeraldino balearico (*calàpet*). I mammiferi annoverano ricci, donnole, martore e
      la [genetta comune](/especie/genetta_genetta/).


      In primavera e autunno sbocciano suggestive orchidee selvatiche, tra cui l'ofride scura, la treccia
      d'autunno e la rara Ophrys balearica.
    visit: >-
      Il parco offre cinque itinerari pedonali segnalati, facili e della durata compresa tra 15 e 60 minuti:
      il belvedere di Ses Fonts de n’Alis, il giro di Sa Guàrdia d’en Garrot, Sa Punta de ses Gatoves,
      S’Amarador e S’Hort d’en Metge. Il sentiero del belvedere collega il parcheggio alla spiaggia attraverso
      la pineta. Il tracciato di Sa Punta de ses Gatoves è interamente accessibile a persone con mobilità
      ridotta. Chi presenta difficoltà motorie può inoltre richiedere una sedia da fuoristrada Joëlette.


      Il centro visite vicino al parcheggio di Ses Fonts de n’Alis orienta sui diversi percorsi. Si
      organizzano visite guidate gratuite tutto l'anno previa prenotazione.
    history: >-
      Mondragó è stato istituito come parco naturale nel 1992. Fa parte della rete Natura 2000 come ZPS e ZSC,
      ed è un'Area Naturale di Speciale Interesse. Su circa 766 ettari di superficie, appena 95 sono di
      proprietà pubblica; il restante territorio appartiene a piccoli poderi agricoli privati, rendendo la
      tutela dell'ambiente inseparabile dalla preservazione del paesaggio rurale vivo.


      Presso la cala di Caló d’en Garrot la fascia dunale ha subito alterazioni a causa del passaggio
      incontrollato di veicoli.
    before: >-
      Cammina con discrezione e mantieniti sui sentieri segnalati per non disturbare la fauna né danneggiare
      la flora litoranea. Il rischio di incendi boschivi è elevatissimo: è assolutamente vietato accendere
      fuochi. I cani vanno condotti al guinzaglio e non possono accedere alle spiagge. Riporta con te tutti i
      rifiuti e rispetta manufatti rurali e proprietà private.
    around: >-
      Fuori da Maiorca, il parco condivide caratteri mediterranei con il [Parco Naturale del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) (pino d'Aleppo, marangone dal ciuffo e testuggine di
      Hermann), la [Penisola di Akamas](/lugar/akamas-peninsula/) (lentisco e ginepro) e il [Parco Naturale
      dell'Arcipelago di Lastovo](/lugar/park-prirode-lastovsko-otocje/) (pino d'Aleppo e gabbiano corso).
  pt:
    intro: >-
      Há cerca de 6 milhões de anos não existiam aqui campos cultivados nem zimbros: um mar tépido de pouca
      profundidade com recifes de coral banhava Maiorca num clima tropical. Esse leito submarino ancestral
      compõe hoje o litoral sudeste da ilha em Santanyí, e o Parque Natural de Mondragó é a melhor forma de o
      percorrer a pé: enseadas estreitas e abrigadas, duas lagoas costeiras, charneca de zambujeiro e uma
      malha de campos fechados por muros de pedra seca.
    landscape: >-
      A rocha revela a evolução geológica. Na base das falésias repousam corais e algas calcárias do recife
      primitivo; sobre eles assentam os calcários de Santanyí e, junto à linha de água, o marès, arenito
      formado a partir de praias e dunas fósseis. Posteriormente, as torrentes abriram barrancos estreitos e
      profundos invadidos pelo mar, dando origem a calas abrigadas como a de Mondragó.


      Sobre este substrato rochoso expande-se o zambujal e a charneca mediterrânica, dominada por zambujeiro
      selvagem, zimbro-da-praia e pinheiro-de-Alepo, com aroeira, esteva e alecrim no sub-bosque. No fundo dos
      barrancos mais frescos resistem núcleos relíquia de sobreiral e azinheira.


      As águas doces e marinhas juntam-se nas duas lagoas de s’Amarador e ses Fonts de n’Alis. Na segunda a
      salinidade impõe juncos e salicornias; na primeira, mais doce, desenvolve-se um denso caniçal. Atrás da
      praia de s’Amarador ergue-se um cordão dunar fixado pelo lírio-das-praias e pelo cardo-marítimo,
      enquanto na costa rochosa batida pelo vento prosperam o funcho-marinho e a endémica Launaea cervicornis.


      Entre estes ambientes alternam-se terrenos agrícolas murados com amendoeiras, alfarrobeiras e figueiras
      de sequeiro, pontuados por antigas noras, levadas e cisternas históricas.
    wildlife: >-
      Mondragó é um local privilegiado para observação de aves. Estão inventariadas no parque cerca de uma
      centena de espécies, muitas das quais repousam nas zonas húmidas durante a migração entre a Europa e
      África. Nas lagoas alimentam-se o [pato-real](/especie/anas_platyrhynchos/), a galinha-d’água e o
      galeirão. Nas escarpas marinhas patrulham o
      [corvo-marinho-de-crista](/especie/phalacrocorax_aristotelis/) e a
      [gaivota-de-audouin](/especie/larus_audouinii/). Entre as rapinas salientam-se o
      [falcão-peregrino](/especie/falco_peregrinus/), o [milhafre-real](/especie/milvus_milvus/) e a
      [águia-pesqueira](/especie/pandion_haliaetus/), acolhendo os matos rouxinóis, chapins e poupas.


      Entre a herpetofauna destaca-se a [tartaruga-de-hermann](/especie/testudo_hermanni/), objeto de
      programas de soltura e recuperação continuada desde a criação do parque. Nos pegos ocorrem a
      cobra-de-água-viperina e o sapo-verde balear (*calàpet*). Os mamíferos incluem ouriços, doninhas, martas
      e a [gineta](/especie/genetta_genetta/).


      Conforme a estação, florescem orquídeas raras como a erva-abelha-fusca, a espiral-de-outono e a endémica
      Ophrys balearica.
    visit: >-
      O parque oferece cinco trilhos pedestres sinalizados, acessíveis e com durações entre 15 e 60 minutos: o
      miradouro de Ses Fonts de n’Alis, a volta a Sa Guàrdia d’en Garrot, Sa Punta de ses Gatoves, S’Amarador
      e S’Hort d’en Metge. O percurso do miradouro liga o parque de estacionamento à praia por pinhais junto à
      lagoa. O trilho de Sa Punta de ses Gatoves está adaptado a pessoas com mobilidade reduzida. Visitantes
      com limitações físicas podem solicitar o agendamento de uma cadeira todo-o-terreno Joëlette.


      O centro de informação situa-se junto ao estacionamento de Ses Fonts de n’Alis e orienta os visitantes
      conforme os seus interesses. Realizam-se visitas guiadas gratuitas ao longo de todo o ano sob reserva
      prévia.
    history: >-
      Mondragó foi classificado como parque natural em 1992. Integra a rede Natura 2000 como ZEPA e ZEC,
      possuindo estatuto de Área Natural de Especial Interesse. Dos seus 766 hectares de área protegida,
      apenas 95 hectares são do domínio público; o restante compõe-se de pequenas propriedades rurais privadas
      de sequeiro, tornando a conservação ecológica indissociável da salvaguarda da paisagem agrária viva.


      Na enseada de Caló d’en Garrot, as dunas costeiras sofreram degradação no passado devido à circulação
      abusiva de viaturas.
    before: >-
      Caminha em silêncio e exclusivamente pelos trilhos marcados para não perturbar a fauna e proteger a
      flora costeira. O perigo de incêndio rural é extremo: é proibido acender fogo ou atirar fósforos e
      beatas. Os cães devem circular com trela e não são permitidos nas praias. Leva todo o teu lixo contigo e
      respeita a pedra seca e as propriedades privadas.
    around: >-
      Para além de Maiorca, o parque partilha afinidades com o [Parque Natural do Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) (pinheiro-de-Alepo, corvo-marinho-de-crista e
      tartaruga-de-hermann), a [Península de Akamas](/lugar/akamas-peninsula/) (aroeira e zimbro) e o [Parque
      Natural do Arquipélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/) (pinheiro-de-Alepo e
      gaivota-de-audouin).
