unico:
  es: >-
    Aquí conviven dieciocho lagos glaciares, a los que llaman los ojos de la montaña, con un bosque antiguo de
    pino negro cuyos ejemplares han llegado a los 400 años.
  en: >-
    Here eighteen glacial tarns, known as the eyes of the mountain, coexist with an ancient black pine forest
    whose veterans have reached 400 years.
  fr: >-
    Ici cohabitent dix-huit lacs glaciaires appelés les yeux de la montagne et une forêt ancienne de pin noir
    dont les arbres atteignent 400 ans.
  de: >-
    Hier koexistieren achtzehn Gletscherseen, genannt die Augen der Berge, mit einem alten Schwarzkiefernwald,
    dessen Baumriesen 400 Jahre alt sind.
  it: >-
    Qui convivono diciotto laghi glaciali chiamati gli occhi della montagna e una foresta secolare di pino
    nero i cui esemplari toccano i 400 anni.
  pt: >-
    Aqui convivem dezoito lagos glaciares chamados os olhos da montanha com uma floresta madura de
    pinheiro-negro com espécimes de 400 anos.
observaciones:
  es: >-
    Consulta con el parque las normas de la zona antes de ir: el gestor regula la filmación, la fotografía y
    el uso de drones, y las entradas al parque. Antes de salir, comprueba si hay reservas o permisos que
    afecten a tu visita.
texto:
  es:
    intro: >-
      Una meseta a 1.500 m de altitud, cortada por cañones profundos, y sobre ella un macizo de unos cincuenta
      picos que superan los 2.000 m. Eso es Durmitor, en el noroeste de Montenegro. Al norte lo corta el cañón
      del Tara, al oeste el del Piva y al sur el del Komarnica; al este, la meseta se abre hacia la llamada
      meseta de los Lagos. El parque nacional que lleva su nombre se fundó en 1952 y protege el macizo, los
      cañones del Tara, el Sušica y el Draga y la parte alta de la meseta del Komarnica.
    landscape: >-
      Durmitor es un macizo calcáreo modelado por glaciares y atravesado por ríos y corrientes subterráneas.
      El hielo dejó sus huellas en forma de lagos, y los ríos trabajaron en lo hondo: el cañón del Tara llega
      a los 1.300 m en su punto más profundo. Entre los cañones que destacan en el paisaje están también los
      de Draga, Sušica y Komarnica.


      Los lagos son lo más característico. Hay 18 repartidos por el macizo y por la meseta de los Lagos, y se
      les conoce como Gorske Oči, los ojos de la montaña. El más grande y conocido es el lago Negro, a 1.416 m
      de altitud, a 3 km de Žabljak y al pie del pico Međed. En realidad son dos lagos, el Grande y el
      Pequeño, unidos por un estrecho que se seca en verano. El agua cambia de sentido con las estaciones: en
      verano pasa del Grande al Pequeño, y en invierno al revés, algo muy raro. Por debajo, los desagües del
      lago se bifurcan y alimentan a la vez el Tara y el Piva. En primavera, cuando la nieve se funde,
      aparecen por la ladera arroyos sin nombre que solo existen unos días.


      La vegetación reúne bosques, prados alpinos, lagos, ríos, cañones y cuevas. Entre los bosques, el [pino
      negro](/especie/pinus_nigra/) forma un bosque antiguo, con árboles de 400 años y más de 50 m. En lo alto
      hay incluso una cueva de hielo, con estalactitas y estalagmitas heladas que son vestigios de la
      glaciación.
    wildlife: >-
      El parque es refugio de grandes mamíferos: [oso pardo](/especie/ursus_arctos/),
      [lobo](/especie/canis_lupus/), [gato montés](/especie/felis_silvestris/) y
      [nutria](/especie/lutra_lutra/). Entre las aves, de las 130 registradas, destacan el [águila
      real](/especie/aquila_chrysaetos/), el [halcón peregrino](/especie/falco_peregrinus/) y el
      [urogallo](/especie/tetrao_urogallus/).


      En el agua, el [salmón del Danubio](/especie/hucho_hucho/), una especie amenazada a escala mundial,
      continúa viviendo en los ríos del parque, y el Tara es rico en peces salmónidos endémicos.


      El año marca el ritmo del macizo. En verano, las actividades se vuelven hacia el senderismo y el
      montañismo, y los agricultores y pastores siguen usando los prados de altura como pastos de verano. En
      invierno, el turismo gira en torno a la nieve. Con el deshielo de primavera, la nieve del Durmitor
      alimenta arroyos que aparecen solo unos días.
    visit: >-
      Žabljak es la puerta de entrada y concentra las instalaciones turísticas del macizo. Desde allí se llega
      a pie al lago Negro, y un camino de 3,5 km rodea todo el agua. Dos arroyos cruzan el sendero y pueden
      ser difíciles de vadear. Del lago salen muchos senderos hacia otros lagos pequeños de los alrededores.


      Para quien quiera subir, la primera ascensión conocida al macizo es de 1883. En verano las actividades
      son el senderismo y el montañismo; la UNESCO señala también el piragüismo en el parque.
    history: >-
      El lago Negro ya tenía protección en 1907, mucho antes de que el parque se fundara en 1952. El nombre
      del macizo tiene origen discutido; una teoría lo hace derivar de una palabra rumana que significa lugar
      de dormir.
    before: >-
      Consulta con el parque las normas de la zona antes de ir: el gestor regula la filmación, la fotografía y
      el uso de drones, y las entradas al parque. Antes de salir, comprueba si hay reservas o permisos que
      afecten a tu visita.
    around: >-
      Pegado al macizo, a 1 km, está el [Parque Natural de Piva](/lugar/park-prirode-piva/), y a 2 km el
      [Macizo de Bioč](/lugar/masiv-bioca/). A 7 km están las [Montañas de Volujak](/lugar/planina-volujak/) y
      a 14 km el [Parque Nacional Biogradska Gora - Macizo de
      Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/). Más lejos, el [Parque Nacional Una
      - Curso Alto y Cascadas](/lugar/nacionalni-park-una---gorji-tok/) comparte con Durmitor el salmón del
      Danubio, el lobo, el oso y el paisaje kárstico.
  en:
    intro: >-
      A plateau at 1,500 m altitude, incised by deep canyons, crowned by a massif of some fifty summits
      soaring above 2,000 m. That is Durmitor, in northwestern Montenegro. To the north it is bounded by the
      Tara canyon, to the west by the Piva, and to the south by the Komarnica; eastward, the highland merges
      into the Plateau of Lakes. The national park bearing its name was founded in 1952 and protects the
      massif, the canyons of the Tara, Sušica and Draga, and the upper Komarnica plateau.
    landscape: >-
      Durmitor is a limestone massif carved by glaciers and pierced by rivers and subterranean drainage. Ice
      etched its memory in glacial tarns, while rivers cut into the bedrock: the Tara canyon plunges to 1,300
      m at its deepest point. Other prominent chasms include the Draga, Sušica and Komarnica gorges.


      The lakes are the defining feature. There are 18 scattered across the massif and the Plateau of Lakes,
      known as Gorske Oči, the eyes of the mountain. The largest and most famous is Black Lake (Crno jezero)
      at 1,416 m altitude, 3 km from Žabljak at the foot of Međed peak. It consists of two basins, the Big and
      Small lakes, linked by a narrow strait that dries out in summer. Water flow reverses with the seasons:
      in summer it runs from the Big to the Small lake, and in winter in reverse—a rare hydrological
      curiosity. Subterranean bifurcations feed both the Tara and Piva rivers. In spring snowmelt, nameless
      cascading streams appear along the slopes for just a few days.


      Vegetation brings together forests, alpine meadows, tarns, rivers, canyons and caverns. Among woodlands,
      the [European black pine](/especie/pinus_nigra/) forms an old-growth stand with trees 400 years old and
      over 50 m tall. High on the peaks lies an ice cave, holding frozen stalactites and stalagmites that
      preserve remnants of the ice age.
    wildlife: >-
      The park is a haven for large mammals: [brown bear](/especie/ursus_arctos/),
      [wolf](/especie/canis_lupus/), [wildcat](/especie/felis_silvestris/) and [Eurasian
      otter](/especie/lutra_lutra/). Among birds, of the 130 recorded, notable species include the [golden
      eagle](/especie/aquila_chrysaetos/), [peregrine falcon](/especie/falco_peregrinus/) and [western
      capercaillie](/especie/tetrao_urogallus/).


      In the water, the [huchen](/especie/hucho_hucho/) (Danube salmon), globally endangered, thrives in the
      park's rivers, and the Tara is rich in endemic salmonid fishes.


      The year dictates the mountain's rhythm. In summer, activities centre on hiking and mountaineering,
      while shepherds graze livestock on high pastures. In winter, tourism shifts to snow sports. During
      spring thaw, Durmitor's melting snow feeds transient torrents that flow for only a few days.
    visit: >-
      Žabljak is the main gateway and clusters tourist amenities. From town one can walk to Black Lake, where
      a 3.5 km trail circles the shoreline. Two stream crossings along the path can be challenging to ford
      during high water. From the lake, numerous trails branch towards smaller tarns in the surrounding basin.


      For mountaineers, the first recorded ascent of the massif dates to 1883. In summer, primary pursuits are
      trekking and peak climbing; UNESCO also highlights canoeing in the park waters.
    history: >-
      Black Lake enjoyed protection as early as 1907, well before the national park was formally established
      in 1952. The origin of the name Durmitor is debated; a leading theory derives it from a Romanian or
      Vlach term meaning a place of slumber.
    before: >-
      Check park regulations before visiting: the management regulates commercial filming, photography and
      drone usage, as well as entry fees. Inquire in advance regarding any permits or seasonal restrictions
      that might apply to your itinerary.
    around: >-
      Adjacent to the massif, just 1 km away, lies [Piva Nature Park](/lugar/park-prirode-piva/), and 2 km
      away the [Bioč Massif](/lugar/masiv-bioca/). At 7 km stand the [Volujak
      Mountains](/lugar/planina-volujak/) and at 14 km [Biogradska Gora National Park – Bjelasica
      Massif](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/). Farther away, [Una National Park –
      Upper Reach and Waterfalls](/lugar/nacionalni-park-una---gorji-tok/) shares huchen, wolf, brown bear and
      dramatic karst formations with Durmitor.
  fr:
    intro: >-
      Un haut plateau à 1 500 m d'altitude entaillé par de profonds canyons, couronné par un massif d'une
      cinquantaine de cimes dépassant les 2 000 m. C'est le Durmitor, au nord-ouest du Monténégro. Au nord
      s'ouvre le canyon de la Tara, à l'ouest celui de la Piva et au sud celui de la Komarnica ; à l'est,
      l'étendue rejoint le plateau des Lacs. Le parc national éponyme a été créé en 1952 et protège le massif,
      les gorges de la Tara, de la Sušica et de la Draga ainsi que les hauteurs de la Komarnica.
    landscape: >-
      Le Durmitor est un massif calcaire façonné par les glaciers et traversé de rivières souterraines. Les
      glaces ont laissé leur empreinte sous forme de chapelets de lacs, et l'érosion a creusé les gouffres :
      le canyon de la Tara plonge à 1 300 m à son point le plus profond. Parmi les autres défilés majeurs
      figurent les gorges de la Draga, de la Sušica et de la Komarnica.


      Les lacs en sont le trait le plus emblématique. On en compte 18 disséminés dans le massif et le plateau
      des Lacs, connus sous le nom poétique de Gorske Oči, les yeux de la montagne. Le plus vaste et réputé
      est le Lac Noir (Crno jezero), perché à 1 416 m d'altitude, à 3 km de Žabljak au pied du pic Međed. Il
      rassemble deux bassins, le Grand et le Petit lac, reliés par un détroit qui s'assèche en été. Le sens du
      courant s'inverse selon les saisons : en été de l'un vers l'autre, et en hiver en sens inverse,
      phénomène hydrologique remarquable. Ses pertes alimentent à la fois la Tara et la Piva. Au dégel
      printanier, des torrents éphémères jaillissent des pentes pour quelques jours seulement.


      La végétation associe forêts, alpages, lacs, rivières, canyons et grottes. Parmi les boisements, le [pin
      noir](/especie/pinus_nigra/) forme une forêt ancienne abritant des arbres de 400 ans dépassant 50 m de
      hauteur. Sur les hauteurs s'ouvre une grotte de glace aux stalactites pétrifiées, précieux témoin des
      périodes glaciaires.
    wildlife: >-
      Le parc constitue un sanctuaire pour la grande faune : [ours brun](/especie/ursus_arctos/),
      [loup](/especie/canis_lupus/), [chat sauvage](/especie/felis_silvestris/) et [loutre
      d'Europe](/especie/lutra_lutra/). Parmi les oiseaux, sur les 130 espèces recensées, se distinguent
      l'[aigle royal](/especie/aquila_chrysaetos/), le [faucon pèlerin](/especie/falco_peregrinus/) et le
      [grand tétras](/especie/tetrao_urogallus/).


      Dans l'eau, le [saumon du Danube](/especie/hucho_hucho/), poisson menacé d'extinction à l'échelle
      mondiale, continue de peupler les rivières du parc, et la Tara regorge de salmonidés endémiques.


      Le cycle des saisons rythme la vie montagnarde. En été, les visiteurs pratiquent la randonnée et
      l'alpinisme, tandis que les éleveurs mènent leurs troupeaux sur les hauts pâturages. En hiver, les
      activités se tournent vers la neige. Au printemps, la fonte des neiges alimente des ruisseaux qui ne
      coulent que quelques jours.
    visit: >-
      Žabljak sert de porte d'entrée et concentre les hébergements. On rejoint aisément à pied le Lac Noir,
      ceint d'un sentier pédestre de 3,5 km. Deux ruisseaux traversent la piste et peuvent s'avérer délicats à
      franchir lors des crues. Du rivage partent de nombreux sentiers vers les lacs d'altitude voisins.


      Pour les alpinistes, la première ascension documentée du massif date de 1883. En été, les activités
      reines sont la marche et l'escalade ; l'UNESCO met également en avant la pratique du canoë sur les eaux
      du parc.
    history: >-
      Le Lac Noir bénéficiait déjà d'un statut de protection dès 1907, bien avant l'établissement officiel du
      parc national en 1952. L'origine étymologique du mot Durmitor reste débattue ; une hypothèse dominante
      la rattache à un terme valaque ou roumain désignant un lieu de repos ou de sommeil.
    before: >-
      Consultez la réglementation du parc avant votre venue : l'administration encadre les tournages, la
      photographie, le survol de drones et les droits d'entrée. Renseignez-vous à l'avance sur les éventuelles
      autorisations requises pour votre parcours.
    around: >-
      Attenant au massif, à 1 km, s'étend le [Parc naturel de Piva](/lugar/park-prirode-piva/), et à 2 km le
      [Massif de Bioč](/lugar/masiv-bioca/). À 7 km se dressent les [Montagnes de
      Volujak](/lugar/planina-volujak/) et à 14 km le [Parc national de Biogradska Gora - Massif de
      Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/). Plus loin, le [Parc national d'Una
      - Cours supérieur et cascades](/lugar/nacionalni-park-una---gorji-tok/) partage avec le Durmitor saumon
      du Danube, loup, ours et paysages karstiques tourmentés.
  de:
    intro: >-
      Ein Hochplateau auf 1.500 m Höhe, eingeschnitten von tiefen Schluchten, überragt von einem Gebirgsmassiv
      mit rund fünfzig Gipfeln über 2.000 m. Das ist der Durmitor im Nordwesten Montenegros. Im Norden wird er
      vom Tara-Canyon begrenzt, im Westen von der Piva und im Süden von der Komarnica; nach Osten öffnet sich
      die Hochfläche zur Seen-Hochebene. Der gleichnamige Nationalpark wurde 1952 gegründet und schützt das
      Massiv, die Canyons der Tara, Sušica und Draga sowie das obere Komarnica-Plateau.
    landscape: >-
      Der Durmitor ist ein von Gletschern modelliertes Kalkmassiv, durchzogen von Flüssen und unterirdischen
      Wasserläufen. Das Eis hinterließ Bergseen, und die Flüsse fraßen sich tief in den Fels: Der Tara-Canyon
      erreicht an seiner tiefsten Stelle 1.300 m. Zu den weiteren markanten Schluchten zählen jene von Draga,
      Sušica und Komarnica.


      Die Karseen sind das markanteste Landschaftsmerkmal. Es gibt 18 über das Massiv und die Seen-Hochebene
      verteilte Gewässer, bekannt als Gorske Oči, die Augen der Berge. Der größte und berühmteste ist der
      Schwarze See (Crno jezero) auf 1.416 m Höhe, 3 km von Žabljak entfernt am Fuße des Međed-Gipfels. Er
      besteht aus zwei Becken, dem Großen und dem Kleinen See, verbunden durch eine im Sommer trockenfallende
      Enge. Die Fließrichtung wechselt saisonal: im Sommer vom Großen zum Kleinen See, im Winter umgekehrt –
      ein seltenes hydrologisches Phänomen. Unterirdische Abflüsse speisen gleichzeitig Tara und Piva. Im
      Frühjahr lassen Schneeschmelzen an den Hängen für wenige Tage namenlose Bäche aufleben.


      Die Vegetation vereint Wälder, alpine Matten, Seen, Flüsse, Schluchten und Höhlen. Unter den Wäldern
      bildet die [Schwarzkiefer](/especie/pinus_nigra/) alte Bestände mit 400 Jahre alten und über 50 m hohen
      Bäumen. In Gipfelnähe birgt eine Eishöhle gefrorene Stalaktiten und Stalagmiten als eiszeitliche
      Relikte.
    wildlife: >-
      Der Park bietet großen Säugern Zuflucht: [Braunbär](/especie/ursus_arctos/),
      [Wolf](/especie/canis_lupus/), [Wildkatze](/especie/felis_silvestris/) und
      [Fischotter](/especie/lutra_lutra/). Unter den 130 nachgewiesenen Vogelarten ragen
      [Steinadler](/especie/aquila_chrysaetos/), [Wanderfalke](/especie/falco_peregrinus/) und
      [Auerhuhn](/especie/tetrao_urogallus/) heraus.


      Im Wasser lebt der weltweit bedrohte [Huchen](/especie/hucho_hucho/) in den Flüssen des Parks fort, und
      die Tara ist reich an endemischen Salmoniden.


      Der Jahreskreis bestimmt das Leben im Gebirge. Im Sommer stehen Wandern und Bergsteigen im Vordergrund,
      und Hirten nutzen die Hochalmen zur Beweidung. Im Winter dominiert der Skitourismus. Bei der
      Frühlingsschmelze speist das Schmelzwasser Bäche, die nur wenige Tage existieren.
    visit: >-
      Žabljak fungiert als Hauptausgangspunkt und bündelt touristische Einrichtungen. Von dort gelangt man zu
      Fuß zum Schwarzen See, den ein 3,5 km langer Rundweg umrundet. Zwei Bachläufe queren den Pfad und können
      bei hohem Wasserstand fordernd sein. Vom Ufer zweigen zahlreiche Wanderwege zu weiteren Bergseen ab.


      Für Bergsteiger datiert die erste überlieferte Besteigung des Massivs aus dem Jahr 1883. Im Sommer
      stehen Wandern und Klettern im Mittelpunkt; die UNESCO verweist zudem auf Kanutouren auf den
      Parkgewässern.
    history: >-
      Der Schwarze See stand bereits 1907 unter Naturschutz, lange vor der eigentlichen Parkgründung im Jahr
      1952. Der Name Durmitor ist sprachlich umstritten; eine weitverbreitete Herleitung führt ihn auf ein
      romanisches Wort für Ruhestätte oder Schlafplatz zurück.
    before: >-
      Informieren Sie sich vorab über die Parkvorschriften: Die Parkverwaltung regelt Dreharbeiten,
      Fotografie, Drohnennutzung und Eintrittsgebühren. Klären Sie vor Reiseantritt, ob für Ihre Route
      Genehmigungen erforderlich sind.
    around: >-
      Direkt an das Massiv grenzt, 1 km entfernt, der [Naturpark Piva](/lugar/park-prirode-piva/) an, und 2 km
      entfernt liegt das [Bioč-Massiv](/lugar/masiv-bioca/). In 7 km Entfernung erheben sich die
      [Volujak-Berge](/lugar/planina-volujak/) und in 14 km der [Nationalpark Biogradska Gora –
      Bjelasica-Massiv](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/). Weiter entfernt teilt der
      [Nationalpark Una – Oberlauf und Wasserfälle](/lugar/nacionalni-park-una---gorji-tok/) Huchen, Wolf, Bär
      und Karstlandschaften mit dem Durmitor.
  it:
    intro: >-
      Un altopiano a 1.500 m di altitudine, inciso da forre profonde, sovrastato da un massiccio di circa
      cinquanta vette che superano i 2.000 m. Questo è il Durmitor, nel nord-ovest del Montenegro. A nord è
      delimitato dal canyon della Tara, a ovest da quello della Piva e a sud da quello della Komarnica; a est
      l'altopiano si allarga verso l'Altopiano dei Laghi. Il parco nazionale omonimo nacque nel 1952 e tutela
      il massiccio, i canyon della Tara, Sušica e Draga e l'altopiano superiore della Komarnica.
    landscape: >-
      Il Durmitor è un massiccio calcareo forgiato dai ghiacciai e solcato da corsi d'acqua sotterranei. Il
      ghiaccio ha lasciato specchi d'acqua montani e i fiumi hanno scavato abissi: la forra della Tara
      raggiunge i 1.300 m nel suo punto più profondo. Tra gli altri canyon suggestivi spiccano quelli di
      Draga, Sušica e Komarnica.


      I laghi sono l'elemento paesaggistico cardine. Se ne contano 18 disseminati tra il massiccio e
      l'Altopiano dei Laghi, noti come Gorske Oči, gli occhi della montagna. Il maggiore e più celebre è il
      Lago Nero (Crno jezero), a 1.416 m di quota, a 3 km da Žabljak ai piedi della cima Međed. È formato da
      due bacini, il Grande e il Piccolo lago, uniti da uno stretto canale che in estate si prosciuga. Il
      flusso d'acqua si inverte secondo la stagione: d'estate da un bacino all'altro e d'inverno al contrario,
      bizzarria idrologica notevole. Inghiottitoi carsici alimentano contemporaneamente la Tara e la Piva. Con
      il disgelo primaverile, rivoli senza nome compaiono sui versanti per pochi giorni.


      La vegetazione unisce foreste, pascoli alpini, laghi, forre e caverne. Tra i boschi, il [pino
      nero](/especie/pinus_nigra/) forma una foresta vetusta con colossi di 400 anni e oltre 50 m di altezza.
      In quota una grotta di ghiaccio conserva stalattiti e stalagmiti perenni come testimonianza glaciale.
    wildlife: >-
      Il parco è rifugio di grandi mammiferi: [orso bruno](/especie/ursus_arctos/),
      [lupo](/especie/canis_lupus/), [gatto selvatico](/especie/felis_silvestris/) e
      [lontra](/especie/lutra_lutra/). Tra gli uccelli, sulle 130 specie registrate, emergono l'[aquila
      reale](/especie/aquila_chrysaetos/), il [falco pellegrino](/especie/falco_peregrinus/) e il [gallo
      cedrone](/especie/tetrao_urogallus/).


      Nelle acque, il [salmone del Danubio](/especie/hucho_hucho/), specie a rischio su scala globale, abita i
      fiumi del parco, e la Tara vanta una ricca fauna salmonicola endemica.


      Il ritmo dell'anno scandisce la montagna. In estate dominano escursionismo e alpinismo, mentre i pastori
      monticano il bestiame sui pascoli d'alta quota. In inverno il turismo si sposta sulla neve. Al disgelo
      primaverile, le acque di fusione alimentano torrenti che scorrono solo per qualche giorno.
    visit: >-
      Žabljak funge da centro di accesso e raggruppa le strutture ricettive. Da lì si raggiunge comodamente a
      piedi il Lago Nero, intorno al quale corre un sentiero di 3,5 km. Due ruscelli attraversano la traccia e
      possono risultare impegnativi da guadare in piena. Dalle rive si diramano numerosi itinerari verso i
      laghetti vicini.


      Per gli alpinisti, la prima ascensione documentata del massiccio risale al 1883. In estate prevalgono
      trekking e ascensioni alle vette; l'UNESCO raccomanda anche la canoa nelle acque del parco.
    history: >-
      Il Lago Nero godeva di tutela già nel 1907, ben prima dell'istituzione del parco nazionale nel 1952. Il
      toponimo Durmitor ha origini discusse; una tesi accreditata lo fa derivare da una radice romanza che
      indica il luogo del riposo o del sonno.
    before: >-
      Consultate i regolamenti del parco prima della partenza: la direzione disciplina riprese video,
      fotografia professionale, uso di droni e permessi d'ingresso. Verificate con anticipo se vi siano
      restrizioni stagionali che interessino la vostra escursione.
    around: >-
      A ridosso del massiccio, a 1 km, si trova il [Parco naturale di Piva](/lugar/park-prirode-piva/), e a 2
      km il [Massiccio di Bioč](/lugar/masiv-bioca/). A 7 km si ergono i [Monti
      Volujak](/lugar/planina-volujak/) e a 14 km il [Parco nazionale Biogradska Gora - Massiccio di
      Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/). Più lontano, il [Parco nazionale
      Una - Corso superiore e cascate](/lugar/nacionalni-park-una---gorji-tok/) condivide con il Durmitor
      salmone del Danubio, lupo, orso e scenari carsici grandiosi.
  pt:
    intro: >-
      Um planalto a 1.500 m de altitude, recortado por desfiladeiros fundos, encimado por um maciço de cerca
      de cinquenta picos ultrapassando os 2.000 m. Eis o Durmitor, no noroeste do Montenegro. A norte é
      quebrado pelo desfiladeiro do Tara, a oeste pelo do Piva e a sul pelo do Komarnica; a leste, abre-se
      para o Planalto dos Lagos. O parque nacional homónimo foi criado em 1952 e resguarda o maciço, as
      gargantas do Tara, Sušica e Draga e as terras altas da bacia do Komarnica.
    landscape: >-
      O Durmitor é um maciço calcário esculpido por glaciares e sulcado por correntes subterrâneas. O gelo
      moldou covas lacustres e os rios escavaram abismos: o canhão do Tara desce aos 1.300 m no ponto mais
      fundo. Entre outras gargantas notáveis contam-se as de Draga, Sušica e Komarnica.


      Os lagos glaciares são o traço mais peculiar. Existem 18 espalhados pelo maciço e pelo Planalto dos
      Lagos, denominados Gorske Oči, os olhos da montanha. O mais extenso e afamado é o Lago Negro (Crno
      jezero), a 1.416 m de altitude, a 3 km de Žabljak no sopé do pico Međed. Compreende duas bacias, o
      Grande e o Pequeno lago, unidos por um esteiro que seca no estio. O sentido da água inverte-se com as
      estações: no verão corre num sentido e no inverno no sentido oposto, fenómeno hidrográfico invulgar.
      Fissuras cársicas subterrâneas alimentam simultaneamente o Tara e o Piva. No degelo primaveril, regatos
      sem nome brotam das encostas por escassos dias.


      A vegetação congrega florestas, prados alpinos, lagos, desfiladeiros e cavernas. Entre o arvoredo, o
      [pinheiro-negro](/especie/pinus_nigra/) forma bosques centenários com exemplares de 400 anos e mais de
      50 m de porte. No alto, uma gruta de gelo ostenta estalagmites perenes como herança da época glaciar.
    wildlife: >-
      O parque é refúgio de grandes mamíferos: [urso-pardo](/especie/ursus_arctos/),
      [lobo](/especie/canis_lupus/), [gato-bravo](/especie/felis_silvestris/) e
      [lontra](/especie/lutra_lutra/). Entre as aves, de 130 espécies observadas, destacam-se a
      [águia-real](/especie/aquila_chrysaetos/), o [falcão-peregrino](/especie/falco_peregrinus/) e o
      [tetraz-grande](/especie/tetrao_urogallus/).


      Nos cursos de água, o [salmão-do-danúbio](/especie/hucho_hucho/), ameaçado a nível global, mantém
      populações saudáveis, e o Tara alberga salmonídeos endémicos.


      O ciclo das estações rege a montanha. No verão, o interesse recai no montanhismo e caminhada, enquanto
      os pastores conduzem o gado para as pastagens de altitude. No inverno, o turismo foca-se nos desportos
      de neve. Na primavera, o degelo do Durmitor alimenta ribeiras temporárias que correm apenas alguns dias.
    visit: >-
      Žabljak é o ponto nevrálgico e concentra serviços turísticos. De lá caminha-se facilmente até ao Lago
      Negro, rodeado por um trilho pedonal de 3,5 km. Dois ribeiros cortam a vereda e podem exigir cautela
      durante as cheias. Do lago saem vários caminhos para pequenos lagos glaciares vizinhos.


      Para quem procura cumes, a primeira ascensão documentada remonta a 1883. No verão sobressaem caminhadas
      e escalada; a UNESCO salienta igualmente a canoagem nas águas do parque.
    history: >-
      O Lago Negro beneficiava de proteção legal logo em 1907, muito antes da instituição formal do parque
      nacional em 1952. O étimo Durmitor é motivo de debate; a tese mais aceite deriva-o de vocábulo latino ou
      valaco que designa local de descanso ou adormecimento.
    before: >-
      Consulte previamente as regras do parque: os gestores regulamentam filmagens, fotografia comercial,
      drones e ingressos no parque. Verifique antes de partir se existem licenças obrigatórias para a sua
      rota.
    around: >-
      Junto ao maciço, a escasso 1 km, fica o [Parque Natural de Piva](/lugar/park-prirode-piva/), e a 2 km o
      [Maciço de Bioč](/lugar/masiv-bioca/). A 7 km erguem-se os [Montes Volujak](/lugar/planina-volujak/) e a
      14 km o [Parque Nacional Biogradska Gora - Maciço de
      Bjelasica](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/). Mais longe, o [Parque Nacional do
      Una - Curso Superior e Cascatas](/lugar/nacionalni-park-una---gorji-tok/) partilha com o Durmitor o
      salmão-do-danúbio, o lobo, o urso e o relevo cársico.
