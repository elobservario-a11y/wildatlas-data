resumen:
  es: Una de las gargantas calizas más sobrecogedoras de los Cárpatos con paredes de 300 m de corte vertical.
  en: One of the most awe-inspiring limestone defiles in the Carpathians with vertical 300 m walls.
  fr: L'une des gorges calcaires les plus saisissantes des Carpates aux parois verticales de 300 m.
  de: Eine der spektakulärsten Kalksteinschluchten der Karpaten mit senkrechten 300 m hohen Felswänden.
  it: Una delle gole calcaree più impressionanti dei Carpazi con pareti verticali di 300 m.
  pt: Uma das gargantas calcárias mais impressionantes dos Cárpatos com escarpas verticais de 300 m.
unico:
  es: >-
    Una garganta de caliza por donde pasa una carretera, un lago nacido de una represa natural y un macizo con
    fósiles de mares antiguos.
  en: >-
    A limestone gorge threaded by a highway, a lake born from a natural rock dam, and a mountain massif
    crammed with ancient sea fossils.
  fr: >-
    Une gorge calcaire franchie par une route, un lac né d'un barrage naturel et un massif pétri de fossiles
    marins ancestraux.
  de: >-
    Eine von einer Straße durchquerte Kalksteinschlucht, ein durch natürlichen Bergsturz entstandener See und
    ein Massiv voller Meeresfossilien.
  it: >-
    Una forra calcarea attraversata da una strada, un lago generato da una frana naturale e un massiccio
    ricolmo di fossili marini.
  pt: >-
    Uma garganta de calcário cruzada por uma estrada, um lago formado por uma represa natural e um maciço
    repleto de fósseis marinhos.
observaciones:
