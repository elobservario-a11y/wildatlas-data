texto:
  es:
    intro: >-
      La carretera DN12C se mete en la garganta como un hilo en una aguja: ocho kilómetros de barrancos entre
      paredes de caliza. Son las gargantas del Bicaz, famosas por su tamaño. En la garganta está también el
      Lago Rojo, que se formó en 1837 cuando las aguas del arroyo Bicaz quedaron represadas de forma natural.


      El Parque Nacional Cheile Bicazului-Hășmaș se fundó en 1990, tiene 7072 hectáreas y se reparte entre las
      provincias de Harghita y Neamț. Está en los montes Hășmaș, en el grupo central de los Cárpatos
      Orientales, y su interés es a la vez geológico, paisajístico y biológico.
    landscape: >-
      Todo parte de la roca. Los montes Hășmaș tienen calizas y dolomías en toda su longitud, y de ahí vienen
      los relieves abruptos, las cumbres aisladas y las gargantas profundas. Las cumbres más altas son Licaș,
      Suhardul Mare, Hășmașul Negru y Hășmașul Mare, de 1792 m. El desnivel va de 575 m en el valle del Bicaz
      a esa cima, y por eso hay una flora y una fauna ricas.


      Las formas son de torres, agujas, lapiaz, alveolos y depósitos de derrubios. La Torre Bardoș es un
      testigo de erosión que domina toda la zona. Y bajo la piedra hay otra historia: las montañas guardan
      fósiles de millones de amonites y belemnitas y arrecifes de coral del Jurásico y el Cretácico. El
      afloramiento de Muntele Ucigaș (Gyilkos) tiene fósiles de más de 200 taxones y es de valor europeo.
    wildlife: >-
      Se han inventariado 1147 especies de plantas superiores, con bosques de coníferas con haya, pastos
      montanos, cumbres subalpinas y roquedos con vegetación propia. El endemismo local es Astragalus
      pseudopurpureus. Entre las plantas protegidas están la zapatilla de dama, el edelweiss, la nigritela
      roja y el tejo.


      La fauna es rica en especies raras. Entre las mariposas está Parnassius apollo, y entre los anfibios el
      sapo de vientre amarillo; viven la salamandra, la rana bermeja, el lagarto vivíparo, la víbora común y
      la culebra lisa. Entre las aves de montaña están el [treparriscos](/especie/tichodroma_muraria/), el
      pico tridáctilo, el escribano montesino, el cuervo grande y el [urogallo](/especie/tetrao_urogallus/);
      también se citan el [cárabo uralense](/especie/strix_uralensis/) y el [águila
      real](/especie/aquila_chrysaetos/). Entre los mamíferos están el ciervo de los Cárpatos, el
      [rebeco](/especie/rupicapra_rupicapra/), el [oso](/especie/ursus_arctos/), el
      [lince](/especie/lynx_lynx/) y el [lobo](/especie/canis_lupus/).
    visit: >-
      La base es el centro de Lacu Roșu. Desde ahí hay un circuito a pie que recorre las gargantas del Bicaz,
      Cheile Bicazului Mic y Șaua Piatra Roșie antes de volver al lago, y otro que parte del centro, alcanza
      Șaua Piatra Roșie a 1011 m y regresa.


      El recorrido circular del Lago Rojo pasa por el Balcón de Piedra, un mirador de 15-20 m sobre el agua,
      con una sola subida. La ruta a Suhardul Mic sale del centro de Lacu Roșu a 967 m y llega a la cumbre a
      1345 m. Desde Suhardul Mic se observa la zona del Lago Rojo y los macizos vecinos, y desde el macizo
      Ghilcoș se ve también el macizo Ceahlău. Piatra Singuratică-Hășmașul Mare se ve desde la carretera DN 12
      ya desde Miercurea Ciuc, y se accede desde la localidad de Bălan. En el extremo norte está la sima
      Avenul Licaș y en el este las gargantas Cheile Șugăului.


      Para una travesía larga, el primer recorrido sale del puerto de Pângărați a 1255 m y salva 435 m de
      desnivel; en invierno es difícil y es preferible dividirlo en dos etapas.


      Se llega desde Bicaz (Neamț) y Gheorgheni (Harghita), unidas por la carretera DN12C que cruza el parque,
      y desde Sândominic por la DJ125 vía Bălan.
    history: >-
      El parque forma parte de Natura 2000 como zona de interés comunitario ROSCI 0027 y zona de protección
      especial para aves ROSPA 0018. Dentro del parque solo se admiten actividades tradicionales de las
      comunidades locales y de quienes tienen terrenos allí, reguladas por el plan de gestión.


      Gheorgheni, en el oeste del parque, se desarrolló sobre un asentamiento feudal y tiene las primeras
      referencias escritas de 1332.
    before: >-
      En invierno, los itinerarios largos como el del puerto de Pângărați son difíciles. Respeta las
      actividades tradicionales de las comunidades del parque.
    around: >-
      A nueve kilómetros está el [Parque Nacional Ceahlău - Macizo
      Forestal](/lugar/parcul-national-ceahlau---masivul-forestier/). A mayor distancia, el [Parque Nacional
      Gesäuse - Garganta del Enns](/lugar/nationalpark-gesause---enns-gorge/), la [Reserva Natural Garganta
      del Sagittario](/lugar/gole-del-sagittario/) y el [Parque Nacional de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) comparten con las gargantas del Bicaz el treparriscos, el
      rebeco y el águila real.
  en:
    intro: >-
      Highway DN12C threads the gorge like a thread through a needle: eight kilometres of defiles hemmed
      between sheer limestone walls. These are the Bicaz Gorges, celebrated for their monumental scale. Within
      the canyon lies Red Lake (Lacu Roșu), formed in 1837 when a massive landslide naturally impounded the
      waters of the Bicaz stream.


      Cheile Bicazului-Hășmaș National Park was established in 1990, spans 7,072 hectares, and straddles the
      boundary between Harghita and Neamț counties. It lies in the Hășmaș Mountains of the central Eastern
      Carpathians, combining exceptional geological, botanical and scenic interest.
    landscape: >-
      Everything stems from bedrock. The Hășmaș Mountains are built of Mesozoic limestones and dolomites along
      their entire length, giving rise to sheer crags, isolated pinnacles and yawning canyons. The highest
      peaks include Licaș, Suhardul Mare, Hășmașul Negru and Hășmașul Mare at 1,792 m. Vertical relief drops
      from that summit to 575 m in the Bicaz valley floor, sustaining remarkable biodiversity.


      Karst landforms feature towers, needles, karren fields, hollows and scree fans. Turnul Bardoș is an
      erosion witness pillar dominating the entire gorge. Beneath the stone lies an ancient seascape: the
      rocks preserve millions of fossil ammonites, belemnites and Jurassic and Cretaceous coral reefs. The
      Muntele Ucigaș (Gyilkos) outcrop exposes fossils from over 200 taxa, holding European paleontological
      significance.
    wildlife: >-
      Surveys document 1,147 vascular plant species, ranging from mixed beech-conifer forests to subalpine
      pastures and specialized cliff flora. The local endemic is Astragalus pseudopurpureus. Protected
      botanical treasures include lady's slipper orchid, edelweiss, red vanilla orchid and yew.


      The fauna abounds in rare species. Notable butterflies include the Apollo (*Parnassius apollo*), and
      amphibians feature the yellow-bellied toad, fire salamander, common frog, viviparous lizard, adder and
      smooth snake. Mountain birds feature the [wallcreeper](/especie/tichodroma_muraria/), Eurasian
      three-toed woodpecker, rock bunting, common raven and [western
      capercaillie](/especie/tetrao_urogallus/); also recorded are the [Ural owl](/especie/strix_uralensis/)
      and [golden eagle](/especie/aquila_chrysaetos/). Mammals include Carpathian red deer,
      [chamois](/especie/rupicapra_rupicapra/), [brown bear](/especie/ursus_arctos/), [Eurasian
      lynx](/especie/lynx_lynx/) and [wolf](/especie/canis_lupus/).
    visit: >-
      The hub is the settlement of Lacu Roșu. From there a walking loop traverses the Bicaz Gorges, Cheile
      Bicazului Mic and Șaua Piatra Roșie before returning to the lake, while another circuit climbs from the
      centre to Șaua Piatra Roșie at 1,011 m and loops back.


      The Red Lake circular promenade leads past the Stone Balcony, a viewing platform perched 15–20 m above
      the water, via a single ascent. The trail to Suhardul Mic departs from Lacu Roșu centre at 967 m and
      reaches the summit at 1,345 m. From Suhardul Mic one takes in sweeping vistas of Red Lake and
      neighbouring ranges, while from the Ghilcoș massif Ceahlău is also visible. Piatra Singuratică–Hășmașul
      Mare is visible from highway DN 12 as far away as Miercurea Ciuc and is accessed from Bălan. At the
      northern edge lies the Avenul Licaș chasm and to the east Cheile Șugăului.


      For a grand traverse, the main ridge trail starts from Pângărați Pass at 1,255 m and overcomes 435 m of
      ascent; in winter it is strenuous and best split into two stages.


      Road access connects via Bicaz (Neamț) and Gheorgheni (Harghita) along highway DN12C crossing the park,
      or from Sândominic via road DJ125 through Bălan.
    history: >-
      The park forms part of Natura 2000 as Site of Community Importance ROSCI 0027 and Special Protection
      Area for birds ROSPA 0018. Within park borders, only traditional resource practices of local communities
      and registered landholders are permitted, governed by the management plan.


      Gheorgheni, west of the park, grew out of a medieval market town with earliest documentary mentions
      dating back to 1332.
    before: >-
      In winter, long ridge crossings like the Pângărați pass route require serious alpine gear. Respect the
      traditional agro-pastoral activities of local communities.
    around: >-
      Nine kilometres away stands [Ceahlău National Park – Forest
      Massif](/lugar/parcul-national-ceahlau---masivul-forestier/). Further afield, [Gesäuse National Park –
      Enns Gorge](/lugar/nationalpark-gesause---enns-gorge/), the [Sagittario Gorge Nature
      Reserve](/lugar/gole-del-sagittario/) and [Vanoise National Park](/lugar/parc-national-de-la-vanoise/)
      share wallcreeper, chamois and golden eagle with the Bicaz gorges.
  fr:
    intro: >-
      La route DN12C s'enfile dans le défilé comme un fil dans le chas d'une aiguille : huit kilomètres de
      parois calcaires verticales. Ce sont les célèbres gorges du Bicaz. Dans la gorge repose également le Lac
      Rouge (Lacu Roșu), formé en 1837 lorsqu'un glissement de terrain colossal barra naturellement le cours
      du ruisseau Bicaz.


      Le parc national Cheile Bicazului-Hășmaș a été créé en 1990, couvre 7 072 hectares et s'étend sur les
      départements de Harghita et de Neamț. Il se déploie dans les monts Hășmaș, au cœur des Carpates
      orientales, associant intérêt géologique, paysager et faunistique exceptionnel.
    landscape: >-
      Tout procède de la roche. Les monts Hășmaș sont armés de calcaires et dolomies sur toute leur longueur,
      créant reliefs escarpés, pinacles rocheux et gouffres. Les sommets culminants sont Licaș, Suhardul Mare,
      Hășmașul Negru et Hășmașul Mare à 1 792 m. Le dénivelé s'étire depuis 575 m dans la vallée du Bicaz
      jusqu'au faîte, entretenant une flore diversifiée.


      Le modelé calcaire aligne tours, aiguilles, lapiaz, alvéoles et cônes d'éboulis. La Tour Bardoș est un
      éperon d'érosion dominant les gorges. La pierre recèle aussi une riche histoire géologique : les strates
      conservent des millions d'ammonites, de bélemnites et de récifs coralliens jurassiques et crétacés.
      L'affleurement du Muntele Ucigaș (Gyilkos) présente plus de 200 taxons fossiles d'importance
      patrimoniale européenne.
    wildlife: >-
      Les botanistes dénombrent 1 147 espèces de plantes supérieures, depuis les forêts mixtes
      hêtraies-pessières jusqu'aux pelouses alpines et falaises calcaires. L'endémisme local est illustré par
      Astragalus pseudopurpureus. Parmi les raretés végétales figurent le sabot de Vénus, l'edelweiss,
      l'orchis vanille et l'if.


      La faune compte de nombreuses raretés. Parmi les insectes vit l'apollon (*Parnassius apollo*), et les
      amphibiens comptent le sonneur à ventre jaune, la salamandre tachetée, la grenouille rousse, le lézard
      vivipare, la vipère péliade et la coronelle lisse. Les falaises hébergent le [tichodrome
      échelette](/especie/tichodroma_muraria/), le pic tridactyle, le bruant fou, le grand corbeau et le
      [grand tétras](/especie/tetrao_urogallus/) ; on y rencontre aussi la [chouette de
      l'Oural](/especie/strix_uralensis/) et l'[aigle royal](/especie/aquila_chrysaetos/). Les mammifères
      comprennent le cerf des Carpates, le [chamois](/especie/rupicapra_rupicapra/), l'[ours
      brun](/especie/ursus_arctos/), le [lynx](/especie/lynx_lynx/) et le [loup](/especie/canis_lupus/).
    visit: >-
      La station de Lacu Roșu est le centre d'accueil naturel. Une boucle pédestre traverse les gorges du
      Bicaz, Cheile Bicazului Mic et Șaua Piatra Roșie avant de revenir au lac, tandis qu'une autre gagne Șaua
      Piatra Roșie à 1 011 m avant de redescendre.


      Le sentier d'interprétation du Lac Rouge longe le Balcon de Pierre, promontoire aménagé à 15–20 m
      au-dessus des eaux en montée unique. L'ascension du Suhardul Mic part du centre de Lacu Roșu à 967 m
      pour atteindre le sommet à 1 345 m. De là s'embrassent le Lac Rouge et les crêtes voisines, tandis que
      du massif de Ghilcoș apparaît le Ceahlău. Piatra Singuratică–Hășmașul Mare est visible de la route DN 12
      dès Miercurea Ciuc et accessible depuis Bălan. Au nord s'ouvre le gouffre Avenul Licaș et à l'est les
      gorges Cheile Șugăului.


      Pour une traversée d'ampleur, la crête démarre du col de Pângărați à 1 255 m pour vaincre 435 m de
      dénivelé ; en hiver, le parcours est rude et se scinde judicieusement en deux étapes.


      L'accès routier relie Bicaz (Neamț) à Gheorgheni (Harghita) par la route DN12C traversant le parc, ou
      depuis Sândominic par la DJ125 via Bălan.
    history: >-
      Le parc est intégré au réseau Natura 2000 comme zone d'importance communautaire ROSCI 0027 et zone de
      protection spéciale pour les oiseaux ROSPA 0018. Les activités sylvopastorales traditionnelles des
      communautés locales sont strictement encadrées par le plan de gestion.


      Gheorgheni, à l'ouest du parc, s'est développée à partir d'un bourg féodal dont les premières
      attestations écrites remontent à 1332.
    before: >-
      En hiver, les longues traversées de crête comme celle du col de Pângărați exigent une vigilance accrue.
      Respectez les activités traditionnelles des habitants du parc.
    around: >-
      À neuf kilomètres s'élève le [Parc national Ceahlău – Massif
      forestier](/lugar/parcul-national-ceahlau---masivul-forestier/). Plus loin, le [Parc national de Gesäuse
      – Défilé de l'Enns](/lugar/nationalpark-gesause---enns-gorge/), la [Réserve naturelle des gorges du
      Sagittario](/lugar/gole-del-sagittario/) et le [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) partagent tichodrome, chamois et aigle royal avec les
      gorges du Bicaz.
  de:
    intro: >-
      Die Nationalstraße DN12C fädelt sich wie ein Faden durch ein Nadelöhr in die Schlucht ein: acht
      Kilometer Felsenkluft zwischen senkrechten Kalksteinwänden. Das ist die berühmte Bicaz-Klamm. In der
      Schlucht liegt auch der Rote See (Lacu Roșu), der 1837 entstand, als ein gewaltiger Bergsturz den
      Bicaz-Bach natürlich aufstaute.


      Der Nationalpark Cheile Bicazului-Hășmaș wurde 1990 gegründet, umfasst 7.072 Hektar und erstreckt sich
      über die Kreise Harghita und Neamț. Er liegt im Hășmaș-Gebirge der zentralen Ostkarpaten und vereint
      herausragende geologische, landschaftliche und biologische Werte.
    landscape: >-
      Alles gründet auf dem Gestein. Das Hășmaș-Gebirge besteht auf seiner gesamten Länge aus Kalksteinen und
      Dolomiten, woraus schroffe Felsgrate, isolierte Felstürme und tiefe Klammen hervorgingen. Die höchsten
      Erhebungen sind Licaș, Suhardul Mare, Hășmașul Negru und Hășmașul Mare mit 1.792 m. Der Höhenunterschied
      reicht von 575 m in der Talsohle des Bicaz bis zum Hauptkamm und nährt eine reiche Flora.


      Das Karstrelief zeigt Felstürme, Nadeln, Karren, Alveolen und Schuttkegel. Der Bardoș-Turm ist ein
      imposanter Erosionszeuge über der Schlucht. Die Gesteinsschichten bergen zudem Jahrmillionen alte
      Versteinerungen: unzählige Ammoniten, Belemniten und Korallenriffe aus Jura und Kreide. Der Aufschluss
      am Muntele Ucigaș (Gyilkos) birgt Fossilien von über 200 Taxa von europäischer Bedeutung.
    wildlife: >-
      Botaniker verzeichnen 1.147 höhere Pflanzenarten, von Mischwäldern aus Buche und Fichte bis zu Almmatten
      und Felsspaltenfluren. Lokaler Endemit ist Astragalus pseudopurpureus. Zu den botanischen Kostbarkeiten
      zählen Frauenschuh, Edelweiß, Kohlröschen und Eibe.


      Die Tierwelt ist reich an Besonderheiten. Unter den Schmetterlingen fliegt der Apollo (*Parnassius
      apollo*), bei den Amphibien leben Gelbbauchunke, Feuersalamander, Grasfrosch, Waldeidechse, Kreuzotter
      und Schlingnatter. An Felswänden brüten [Mauerläufer](/especie/tichodroma_muraria/), Dreizehenspecht,
      Zippammer, Kolkrabe und [Auerhuhn](/especie/tetrao_urogallus/); auch
      [Habichtskauz](/especie/strix_uralensis/) und [Steinadler](/especie/aquila_chrysaetos/) sind vertreten.
      Unter den Säugetieren leben Karpatenhirsch, [Gämse](/especie/rupicapra_rupicapra/),
      [Braunbär](/especie/ursus_arctos/), [Luchs](/especie/lynx_lynx/) und [Wolf](/especie/canis_lupus/).
    visit: >-
      Zentrum des Gebiets ist die Siedlung Lacu Roșu. Ein Rundweg erschließt die Bicaz-Klamm, Cheile Bicazului
      Mic und Șaua Piatra Roșie mit Rückkehr zum See; eine weitere Route führt zum Pass Șaua Piatra Roșie auf
      1.011 m und zurück.


      Der Uferweg um den Roten See passiert den Steinbalkon, eine Aussichtsplattform 15–20 m über dem
      Wasserspiegel. Der Anstieg zum Suhardul Mic startet im Zentrum von Lacu Roșu auf 967 m und erreicht den
      Gipfel auf 1.345 m. Vom Suhardul Mic blickt man auf den Roten See und Nachbargipfel; vom Ghilcoș-Massiv
      zeigt sich auch das Ceahlău-Gebirge. Piatra Singuratică–Hășmașul Mare ist von der DN 12 ab Miercurea
      Ciuc sichtbar und von Bălan aus zugänglich. Im Norden liegt die Schachthöhle Avenul Licaș und im Osten
      die Șugău-Klamm.


      Für eine Weitwanderung startet der Kammweg am Pângărați-Pass auf 1.255 m und überwindet 435 m
      Höhenunterschied; im Winter empfiehlt sich eine Aufteilung in zwei Etappen.


      Die Zufahrt erfolgt von Bicaz (Neamț) und Gheorgheni (Harghita) über die DN12C quer durch den Park oder
      von Sândominic über die DJ125 via Bălan.
    history: >-
      Der Park ist Teil des Natura-2000-Netzwerks als FFH-Gebiet ROSCI 0027 und Vogelschutzgebiet ROSPA 0018.
      Innerhalb des Schutzgebiets sind traditionelle Nutzungsformen der Einheimischen nach Maßgabe des
      Managementplans erlaubt.


      Gheorgheni im Westen des Parks entstand aus einer mittelalterlichen Marktsiedlung mit ersten
      schriftlichen Erwähnungen aus dem Jahr 1332.
    before: >-
      Im Winter fordern lange Kammquerungen wie jene vom Pângărați-Pass alpine Erfahrung. Achten Sie die
      traditionelle Wirtschaftsweise der Dorfgemeinschaften.
    around: >-
      Neun Kilometer entfernt ragt der [Nationalpark Ceahlău –
      Waldmassiv](/lugar/parcul-national-ceahlau---masivul-forestier/) auf. Weiter entfernt teilen der
      [Nationalpark Gesäuse – Ennsschlucht](/lugar/nationalpark-gesause---enns-gorge/), das [Naturreservat
      Sagittario-Schlucht](/lugar/gole-del-sagittario/) und der [Nationalpark
      Vanoise](/lugar/parc-national-de-la-vanoise/) Mauerläufer, Gämse und Steinadler mit der Bicaz-Klamm.
  it:
    intro: >-
      La strada statale DN12C si infila nella forra come un filo nella cruna di un ago: otto chilometri di
      pareti calcaree a picco. Sono le famose gole del Bicaz. Nella gola riposa anche il Lago Rosso (Lacu
      Roșu), formatosi nel 1837 a seguito di una frana ciclopica che sbarrò il corso del torrente Bicaz.


      Il Parco nazionale Cheile Bicazului-Hășmaș è stato istituito nel 1990, si estende su 7.072 ettari e
      abbraccia le province di Harghita e Neamț. Situato nei monti Hășmaș, nel settore centrale dei Carpazi
      Orientali, unisce supremo pregio geologico, faunistico e paesaggistico.
    landscape: >-
      Tutto scaturisce dalla roccia. I monti Hășmaș sono costituiti da calcari e dolomie su tutta la loro
      estensione, generando creste dirupate, guglie slanciate e orridi profondi. Le cime maggiori sono Licaș,
      Suhardul Mare, Hășmașul Negru e Hășmașul Mare con 1.792 m. Il dislivello varia da 575 m nel fondovalle
      del Bicaz alla cresta sommitale, alimentando una rigogliosa biodiversità.


      Il paesaggio carsico sfoggia torrioni, aghi, campi carreggiati, alveoli e ghiaioni. La Torre Bardoș è un
      torrione d'erosione che signoreggia sulla gola. La roccia racchiude anche un tesoro paleontologico:
      milioni di ammoniti, belemniti e barriere coralline del Giurassico e Cretacico. L'affioramento del
      Muntele Ucigaș (Gyilkos) racchiude fossili di oltre 200 taxa di rilievo europeo.
    wildlife: >-
      I rilievi botanici censano 1.147 specie di piante superiori, spaziando da boschi misti di faggio e abete
      rosso a brughiere e rupi calcaree. L'endemismo locale è Astragalus pseudopurpureus. Tra le rarità
      botaniche figurano la pianella della Madonna, la stella alpina, l'orchidea vaniglia e il tasso.


      La fauna annovera specie di notevole interesse. Tra le farfalle vola l'apollo (*Parnassius apollo*), e
      tra gli anfibi spiccano l'ululone dal ventre giallo, la salamandra pezzata, la rana temporaria, la
      lucertola vivipara, il marasso e il colubro liscio. Tra le balze rocciose nidificano il [picchio
      muraiolo](/especie/tichodroma_muraria/), il picchio tridattilo, lo zigolo muciatto, il corvo imperiale e
      il [gallo cedrone](/especie/tetrao_urogallus/); presenti anche l'[allocco degli
      Urali](/especie/strix_uralensis/) e l'[aquila reale](/especie/aquila_chrysaetos/). I mammiferi
      comprendono cervo dei Carpazi, [camoscio](/especie/rupicapra_rupicapra/), [orso
      bruno](/especie/ursus_arctos/), [lince](/especie/lynx_lynx/) e [lupo](/especie/canis_lupus/).
    visit: >-
      La base escursionistica è il centro di Lacu Roșu. Da qui un percorso circolare attraversa le gole del
      Bicaz, Cheile Bicazului Mic e Șaua Piatra Roșie prima di tornare al lago, mentre un secondo itinerario
      sale a Șaua Piatra Roșie a 1.011 m e rientra.


      La passeggiata ad anello del Lago Rosso tocca il Balcone di Pietra, belvedere attrezzato a 15–20 m sul
      pelo dell'acqua. L'escursione al Suhardul Mic parte dal centro di Lacu Roșu a 967 m e tocca la vetta a
      1.345 m. Dalla cima si ammira il Lago Rosso e le cime circostanti; dal massiccio del Ghilcoș spazia la
      vista sul Ceahlău. Piatra Singuratică–Hășmașul Mare è visibile dalla strada DN 12 fin da Miercurea Ciuc
      e si risale da Bălan. A nord si apre l'inghiottitoio Avenul Licaș e a est le gole Cheile Șugăului.


      Per una traversata d'alta quota, il sentiero di cresta inizia dal valico di Pângărați a 1.255 m
      superando 435 m di dislivello; in inverno richiede preparazione e si consiglia di dividerlo in due
      tappe.


      L'accesso stradale collega Bicaz (Neamț) e Gheorgheni (Harghita) tramite la statale DN12C che taglia il
      parco, o da Sândominic attraverso la DJ125 via Bălan.
    history: >-
      Il parco rientra nella rete Natura 2000 quale Sito di Interesse Comunitario ROSCI 0027 e Zona di
      Protezione Speciale per l'avifauna ROSPA 0018. Le attività agrosilvopastorali tradizionali delle
      comunità locali sono disciplinate dal piano di gestione.


      Gheorgheni, a ovest dell'area protetta, nacque da un borgo feudale con prime citazioni storiche scritte
      risalenti al 1332.
    before: >-
      In inverno gli itinerari di cresta impegnativi come quello del passo Pângărați richiedono dotazione
      adeguata. Si raccomanda di rispettare le consuetudini rurali locali.
    around: >-
      A nove chilometri si innalza il [Parco nazionale Ceahlău – Massiccio
      forestale](/lugar/parcul-national-ceahlau---masivul-forestier/). A maggiore distanza, il [Parco
      nazionale Gesäuse – Forra dell'Enns](/lugar/nationalpark-gesause---enns-gorge/), la [Riserva naturale
      Gole del Sagittario](/lugar/gole-del-sagittario/) e il [Parco nazionale della
      Vanoise](/lugar/parc-national-de-la-vanoise/) condividono picchio muraiolo, camoscio e aquila reale con
      le gole del Bicaz.
  pt:
    intro: >-
      A estrada nacional DN12C enfia-se na garganta como uma linha pelo buraco de uma agulha: oito quilómetros
      de desfiladeiros apertados entre falésias calcárias. São as grandiosas gargantas do Bicaz. No
      desfiladeiro repousa também o Lago Vermelho (Lacu Roșu), formado em 1837 quando um desmoronamento
      colossal represou naturalmente o riacho Bicaz.


      O Parque Nacional Cheile Bicazului-Hășmaș foi criado em 1990, estende-se por 7.072 hectares e abrange
      terras de Harghita e Neamț. Fica nos montes Hășmaș, no núcleo central dos Cárpatos Orientais, reunindo
      excecional interesse geológico, paisagístico e biológico.
    landscape: >-
      Tudo decorre da geologia. Os montes Hășmaș contêm calcários e dolomitos em toda a sua extensão,
      originando escarpas abruptly talhadas, agulhas isoladas e gargantas profundas. Os cumes mais elevados
      são Licaș, Suhardul Mare, Hășmașul Negru e Hășmașul Mare a 1.792 m. O desnível estende-se dos 575 m no
      leito do vale do Bicaz até ao cume, acolhendo rica flora e fauna.


      O modelado cársico exibe torres, agulhas, lapiás e leques de cascalho. A Torre Bardoș é um bloco de
      erosão imponente sobranceiro ao desfiladeiro. Sob as rochas jaz uma história oceânica: camadas repletas
      de fósseis de amonites, belemnites e recifes de coral jurássicos e cretácicos. O afloramento do Muntele
      Ucigaș (Gyilkos) exibe fósseis de mais de 200 táxones de valor paleontológico europeu.
    wildlife: >-
      Contabilizam-se 1.147 espécies de plantas vasculares, oscilando entre matas mistas de faia e coníferas,
      pastagens alpinas e escarpas rochosas. O endemismo local é Astragalus pseudopurpureus. Entre as
      relíquias botânicas destacam-se o sapatinho-de-vênus, a edelvaisse, a orquídea-baunilha e o teixo.


      A fauna ostenta espécies raras. Nos insetos sobressai a borboleta-apolo (*Parnassius apollo*), e nos
      anfíbios o sapo-de-ventre-amarelo, a salamandra-de-pintas, a rã-castanha, o lagarto-vivíparo, a
      víbora-comum e a cobra-lisa. Nas escarpas nidificam a
      [trepadeira-dos-muros](/especie/tichodroma_muraria/), o pica-pau-tridáctilo, a escrevedeira-das-rochas,
      o corvo-comum e o [tetraz-grande](/especie/tetrao_urogallus/); citam-se ainda a
      [coruja-dos-urais](/especie/strix_uralensis/) e a [águia-real](/especie/aquila_chrysaetos/). Nos
      mamíferos encontram-se o veado dos Cárpatos, a [camurça](/especie/rupicapra_rupicapra/), o
      [urso-pardo](/especie/ursus_arctos/), o [lince](/especie/lynx_lynx/) e o [lobo](/especie/canis_lupus/).
    visit: >-
      O centro de apoio situa-se na localidade de Lacu Roșu. Daí parte um trilho circular pelas gargantas do
      Bicaz, Cheile Bicazului Mic e Șaua Piatra Roșie até ao lago, bem como outro trajeto até Șaua Piatra
      Roșie a 1.011 m com regresso.


      O circuito do Lago Vermelho passa pela Varanda de Pedra, miradouro suspenso a 15–20 m da água. A
      ascensão ao Suhardul Mic arranca do centro de Lacu Roșu a 967 m e atinge o cume a 1.345 m. Do cimo
      vislumbra-se o Lago Vermelho e relevos vizinhos; do maciço Ghilcoș avista-se o Ceahlău. Piatra
      Singuratică–Hășmașul Mare avista-se da estrada DN 12 a partir de Miercurea Ciuc e sobe-se por Bălan. Ao
      norte situa-se o algar Avenul Licaș e a leste as gargantas Cheile Șugăului.


      Para uma longa travessia, a rota de cumeada sai do passo de Pângărați a 1.255 m e vence 435 m de
      desnível; no inverno é exigente e convém fracionar em duas etapas.


      O acesso rodoviário faz-se entre Bicaz (Neamț) e Gheorgheni (Harghita) pela DN12C, ou desde Sândominic
      pela DJ125 via Bălan.
    history: >-
      O parque integra a Rede Natura 2000 como Sítio de Importância Comunitária ROSCI 0027 e Zona de Proteção
      Especial para aves ROSPA 0018. Dentro do parque vigoram unicamente os usos agrossilvopastoris
      tradicionais regulados pelo plano de gestão.


      Gheorgheni, a oeste do parque, evoluiu a partir de povoado medieval com referências escritas desde 1332.
    before: >-
      No inverno, travessias extensas como a do passo de Pângărați requerem preparação cuidada. Respeite as
      práticas agropecuárias tradicionais dos moradores.
    around: >-
      A nove quilómetros eleva-se o [Parque Nacional Ceahlău – Maciço
      Florestal](/lugar/parcul-national-ceahlau---masivul-forestier/). A maior distância, o [Parque Nacional
      Gesäuse – Desfiladeiro do Enns](/lugar/nationalpark-gesause---enns-gorge/), a [Reserva Natural Garganta
      do Sagittario](/lugar/gole-del-sagittario/) e o [Parque Nacional da
      Vanoise](/lugar/parc-national-de-la-vanoise/) partilham a trepadeira-dos-muros, a camurça e a águia-real
      com as gargantas do Bicaz.
