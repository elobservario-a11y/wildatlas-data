resumen:
  es: >-
    Laguna duna prístina y pantanos arbolados protegidos entre los grandes lagos médocainos y el océano
    Atlántico.
  en: Pristine dune pond and protected wooded marshes between the great Médoc lakes and the Atlantic Ocean.
  fr: Étang dunaire préservé et marais boisés protégés entre les grands lacs médocains et l'océan Atlantique.
  de: Unberührter Dünensee und geschützte Sumpfwälder zwischen den großen Seen des Médoc und dem Atlantik.
  it: Stagno dunale incontaminato e paludi boscose protette tra i grandi laghi del Médoc e l'Oceano Atlantico.
  pt: >-
    Lagoa dunar preservada e pântanos arborizados protegidos entre os grandes lagos do Médoc e o oceano
    Atlântico.
unico:
  es: >-
    En muy poco espacio caben el bosque sobre dunas antiguas, una laguna que nunca se seca y un marjal donde
    cada invierno aterrizan miles de grullas.
  en: >-
    Within a very compact space lie forests on ancient dunes, a pond that never dries up, and a marsh where
    thousands of cranes land every winter.
  fr: >-
    Dans un espace restreint cohabitent la forêt sur dunes anciennes, un étang qui ne s'assèche jamais et un
    marais où hivernent chaque année des milliers de grues.
  de: >-
    Auf engstem Raum finden sich Wald auf alten Dünen, ein See, der niemals austrocknet, und ein Moor, auf dem
    jeden Winter Tausende Kraniche landen.
  it: >-
    In uno spazio assai contenuto convivono la foresta su dune antiche, uno stagno perenne e una palude dove
    ogni inverno atterrano migliaia di gru.
  pt: >-
    Num espaço muito concentrado reúnem-se a floresta sobre dunas antigas, uma lagoa que nunca seca e um sapal
    onde todos os invernos pousam milhares de grous.
observaciones:
  es: >-
    Está prohibido todo el año circular con cualquier vehículo, incluidas bicis aunque se lleven a mano,
    bañarse, navegar, ir con perros sin correa, recoger plantas y setas, molestar a los animales, acampar,
    vivaquear, hacer fuego y sobrevolar la reserva, drones incluidos. El acceso se limita a los senderos
    señalizados y los guardas vigilan el cumplimiento de las normas durante todo el año.
texto:
  es:
    intro: >-
      A tres kilómetros del Atlántico, entre dos de los grandes lagos del Médoc, hay una laguna pequeña a la
      que solo se llega a pie o en bicicleta. Así es la Reserva Natural Nacional de la Laguna de Cousseau, en
      Lacanau, a 50 km al oeste de Burdeos. La laguna ocupa 50 ha, pero la reserva abarca seiscientas
      hectáreas, con otras trescientas adquiridas en su entorno: un resumen, en pequeño, de las Landas de
      Gascuña, con dunas boscosas al oeste y el marjal de Talaris al este.
    landscape: >-
      Todo empezó con el viento. Hace unos 3000 años, el viento llevó arena de la playa hacia el interior y
      formó dunas que impidieron que los ríos de las Landas de Gascuña desaguaran en el mar. Se crearon así
      lagunas paralelas a la costa, separadas del océano por un cordón dunar. Hasta el siglo XVII, la de
      Cousseau formaba parte de una gran masa de agua que iba del norte de Hourtin al sur de Lacanau.


      Tres ambientes componen hoy la reserva. El bosque sobre dunas antiguas mezcla pinares plantados y
      bosques mixtos de pino y roble, con claros secos y depresiones húmedas llamadas barins. La laguna de
      Cousseau se queda con agua todo el año. Y el marjal: junto a la laguna domina el carrizal y, más al
      este, la landa de molinia anuncia la landa húmeda que antes cubría la mayor parte de la meseta.


      En las dunas del oeste hay landas de brezo y jara de hojas de salvia, con corolas blancas que florecen
      entre abril y junio. En las zonas más inundadas del marjal domina la marisque, junto a arraclán, sauces
      y abedules colonizadores. En las depresiones turbosas florecen la drosera intermedia, la Thorella y la
      pilularia, y la flora rara incluye la carex de frutos barbados, el falso berro de Thore y la pilularia
      globulífera.
    wildlife: >-
      La reserva sabe cambiar según la época. En los pasos de primavera y otoño, sobre un corredor migratorio,
      se ven más de doscientas especies, como el ánsar común, la garceta común, la
      [espátula](/especie/platalea_leucorodia/) o la gaviota reidora; el [águila
      pescadora](/especie/pandion_haliaetus/) se queda sobre todo de agosto a octubre. En invierno llegan
      miles de [grullas](/especie/grus_grus/), que convierten la reserva en zona de invernada de importancia
      nacional.


      En primavera anidan más de 70 especies. En las orillas de la laguna, [garza
      imperial](/especie/ardea_purpurea/) y [aguilucho lagunero](/especie/circus_aeruginosus/); en el marjal,
      alcaudón dorsirrojo, [zarapito real](/especie/numenius_arquata/) y la escasa agachadiza común; en el
      bosque, rapaces como la culebrera europea y el azor. La [nutria](/especie/lutra_lutra/) y la
      [gineta](/especie/genetta_genetta/) son discretas y encuentran aquí calma y comida, junto con
      [corzos](/especie/capreolus_capreolus/), [ciervos](/especie/cervus_elaphus/) y
      [jabalíes](/especie/sus_scrofa/).


      Cuando el marjal de Talaris se inunda en invierno y primavera, sirve para la cría del
      [lucio](/especie/esox_lucius/) y para el engorde de las angulas. Hay ranas verde y meridional, el sapo
      corredor, culebras como la víbora áspid y la de Esculapio, y la [tortuga de
      estanque](/especie/emys_orbicularis/). Desde 1995 se han contado 39 especies de libélulas y unas
      cincuenta de mariposas diurnas, con el Fadet des laîches como emblema. En total se han registrado más de
      3 000 especies.
    visit: >-
      Un sendero de interpretación balizado bordea la laguna desde el observatorio, al sur, hasta el claro del
      oeste. El recorrido desde el aparcamiento de Marmande, en la D6E1 entre el Huga (Lacanau) y
      Carcans-plage, es de 7,5 km ida y vuelta. También se llega en bicicleta por el carril bici entre
      Lacanau-océan y Maubuisson, con dos entradas con aparcabicis, Lesperon y Régue verte. La reserva abre
      todo el año, del amanecer al anochecer, y las visitas guiadas son con reserva.


      Para el paseo se aconseja calzado de marcha, agua, antimosquitos de marzo a julio y prismáticos. La
      mejor época para la grulla es el otoño y el invierno.
    history: >-
      Hasta finales del siglo XVIII esto eran landas rasas inundadas en invierno, donde los pastores dejaban
      pastar libremente a sus ovejas. En el siglo XIX, el drenaje y la plantación de pino marítimo
      transformaron las Landas; el pinar se explotó para madera y para resina, y en la reserva aún queda una
      cabaña de gemmeur.


      En los años 1970 el esquí náutico en la laguna perturbó mucho su quietud. La declaración como reserva en
      1976 y el trabajo de la SEPANSO permitieron una lenta vuelta de la biodiversidad. Entonces el marjal
      estaba colonizado por leñosas y desconectado de la red hidrográfica; se restauró con fuego y desbroces
      mecánicos y se reconectó a su cuenca para recuperar un régimen hídrico más natural.


      La restauración trajo animales. A principios de los años 1990 la SEPANSO compró in extremis el último
      rebaño conocido de vacas marinas landesas, y su reintroducción ayudó a restaurar la biodiversidad. Hoy
      la gestión usa vacas de raza Marine y ponis landeses. La reserva forma parte de la red Rewilding Europe:
      en 2023 inició la reintroducción del escarabajo coprófago Scarabaeus laticollis, desaparecido de
      Gironda, la primera de un insecto extinguido en Francia, y en 2024 se introdujo una manada de búfalos de
      agua para mantener abierto el medio. Entre las amenazas está el cangrejo de Luisiana, especie
      introducida con un gran impacto sobre la vegetación y la fauna acuática.
    before: >-
      Está prohibido todo el año circular con cualquier vehículo, incluidas bicis aunque se lleven a mano,
      bañarse, navegar, ir con perros sin correa, recoger plantas y setas, molestar a los animales, acampar,
      vivaquear, hacer fuego y sobrevolar la reserva, drones incluidos. El acceso se limita a los senderos
      señalizados y los guardas vigilan el cumplimiento de las normas durante todo el año.
    around: >-
      Los grandes lagos del Médoc quedan a ambos lados de la laguna, Carcans-Hourtin al norte y Lacanau al
      sur. Más lejos, el [Słowiński Park Narodowy](/lugar/slowinski-park-narodowy/) comparte con Cousseau la
      grulla y la nutria y sus humedales costeros.
  en:
    intro: >-
      Three kilometers from the Atlantic, between two of the great lakes of the Médoc, lies a small pond
      accessible only on foot or by bicycle. This is the Cousseau Pond National Nature Reserve in Lacanau, 50
      km west of Bordeaux. The pond covers 50 ha, but the reserve spans six hundred hectares, with another
      three hundred acquired in its surrounding area: a miniature summary of the Landes of Gascony, with
      wooded dunes to the west and the Talaris marsh to the east.
    landscape: >-
      It all began with the wind. Around 3000 years ago, winds carried beach sand inland, creating dunes that
      prevented rivers of the Landes of Gascony from flowing into the sea. This formed coastal lagoons
      parallel to the shoreline, cut off from the ocean by a dune cord. Until the seventeenth century,
      Cousseau was part of a vast body of water extending from north of Hourtin to south of Lacanau.


      Three environments compose the reserve today. The woodland over ancient dunes blends planted pine stands
      and mixed oak-pine woods, with dry clearings and damp hollows known as barins. The pond of Cousseau
      holds water year-round. And the marsh: beside the pond reedbeds dominate, and further east, purple
      moor-grass moorland announces the wet heath that once covered most of the plateau.


      On the western dunes grow heather moorlands and sage-leaved rockrose, with white corollas blooming
      between April and June. In the most flooded parts of the marsh, great fen-sedge prevails alongside alder
      buckthorn, willows, and colonizing birches. In the peaty hollows, spoonleaf sundew, Thorella, and
      pillwort thrive; rare flora includes hairy-fruited sedge, Thore's false watercress, and pillwort
      globulifera.
    wildlife: >-
      The reserve transforms with each passing season. During spring and autumn stopovers along this migration
      corridor, more than two hundred species can be spotted, including greylag geese, little egrets, the
      [Eurasian spoonbill](/especie/platalea_leucorodia/), and black-headed gulls; the
      [osprey](/especie/pandion_haliaetus/) stays mainly from August to October. In winter, thousands of
      [common cranes](/especie/grus_grus/) arrive, making the reserve a wintering ground of national
      importance.


      In spring, more than 70 species breed here. On the shores of the pond, [purple
      heron](/especie/ardea_purpurea/) and [western marsh harrier](/especie/circus_aeruginosus/); in the
      marsh, red-backed shrike, [Eurasian curlew](/especie/numenius_arquata/), and the scarce common snipe; in
      the forest, raptors such as short-toed snake eagle and northern goshawk. The [Eurasian
      otter](/especie/lutra_lutra/) and the [common genet](/especie/genetta_genetta/) are discreet, finding
      quiet sanctuary and food here alongside [roe deer](/especie/capreolus_capreolus/), [red
      deer](/especie/cervus_elaphus/), and [wild boars](/especie/sus_scrofa/).


      When the Talaris marsh floods in winter and spring, it serves as breeding habitat for
      [pike](/especie/esox_lucius/) and feeding ground for young glass eels. There are pool frogs and
      Mediterranean tree frogs, natterjack toads, snakes such as asp viper and Aesculapian snake, and the
      [European pond turtle](/especie/emys_orbicularis/). Since 1995 a total of 39 dragonfly species and about
      fifty butterfly species have been recorded, with the false ringlet as an emblem. In total, more than
      3,000 species have been documented.
    visit: >-
      A marked nature trail skirts the pond from the observatory in the south to the western clearing. The
      walk from the Marmande car park on the D6E1 between Le Huga (Lacanau) and Carcans-Plage is 7.5 km round
      trip. You can also arrive by bicycle via the bike path between Lacanau-Océan and Maubuisson, with two
      entrances equipped with bicycle stands, Lesperon and Régue Verte. The reserve is open year-round from
      sunrise to sunset, and guided tours require booking.


      Sturdy walking shoes, water, mosquito repellent from March to July, and binoculars are recommended. The
      best time for cranes is autumn and winter.
    history: >-
      Until the end of the eighteenth century, these were open moorlands flooded in winter, where shepherds
      let their sheep graze freely. In the nineteenth century, drainage and maritime pine plantations
      transformed the Landes; pine stands were worked for timber and resin, and an authentic gemmeur resin
      tapper's hut still stands in the reserve.


      During the 1970s, waterskiing on the pond caused severe disturbance to wildlife. Its designation as a
      reserve in 1976 and the work of SEPANSO enabled a gradual recovery of biodiversity. Back then, the marsh
      had been invaded by woody scrub and disconnected from the drainage network; it was restored through
      controlled burning and brush clearing, and reconnected to its basin to recover natural water dynamics.


      Restoration brought large grazing animals. In the early 1990s, SEPANSO acquired the last known herd of
      Marine landaise cattle in extremis, and their reintroduction helped restore biodiversity. Today,
      management utilizes Marine cattle and Landais ponies. The reserve is part of the Rewilding Europe
      network: in 2023 it launched the reintroduction of the dung beetle Scarabaeus laticollis, once vanished
      from Gironde—the first reintroduction of an extinct insect in France—and in 2024 a herd of water
      buffaloes was introduced to maintain open marshland. Among current threats is the Louisiana crayfish, an
      introduced species with heavy impacts on vegetation and aquatic fauna.
    before: >-
      Year-round, all vehicles are prohibited, including bicycles even if pushed on foot, swimming, boating,
      off-leash dogs, gathering plants and mushrooms, disturbing wildlife, camping, bivouacking, lighting
      fires, and flying over the reserve, including drones. Access is strictly confined to marked trails, and
      rangers patrol year-round to enforce the rules.
    around: >-
      The great lakes of the Médoc lie to both sides of the pond: Carcans-Hourtin to the north and Lacanau to
      the south. Further afield, [Słowiński National Park](/lugar/slowinski-park-narodowy/) in Poland shares
      coastal wetlands with Cousseau, along with common cranes and otters.
  fr:
    intro: >-
      À trois kilomètres de l'Atlantique, entre deux des grands lacs du Médoc, se niche un petit étang
      uniquement accessible à pied ou à vélo. Telle est la réserve naturelle nationale de l'étang de Cousseau,
      à Lacanau, à 50 km à l'ouest de Bordeaux. L'étang couvre 50 ha, mais la réserve englobe six cents
      hectares, complétés par trois cents autres hectares acquis en périphérie : un condensé, en modèle
      réduit, des Landes de Gascogne, avec ses dunes boisées à l'ouest et le marais de Talaris à l'est.
    landscape: >-
      Tout a commencé avec le vent. Il y a environ 3000 ans, le vent a poussé le sable de l'estran vers
      l'intérieur, formant des dunes qui ont empêché les cours d'eau des Landes de Gascogne de se jeter dans
      l'océan. C'est ainsi que sont nés des étangs parallèles au littoral, isolés de la mer par un cordon
      dunaire. Jusqu'au XVIIe siècle, celui de Cousseau faisait partie d'une vaste nappe d'eau s'étendant du
      nord d'Hourtin au sud de Lacanau.


      Trois milieux composent aujourd'hui la réserve. La forêt sur dunes anciennes associe pinèdes plantées et
      bois mixtes de pins et de chênes, entrecoupés de clairières sèches et de dépressions humides appelées
      barins. L'étang de Cousseau conserve de l'eau en permanence. Et le marais : aux abords de l'étang domine
      la roselière et, plus à l'est, la lande à molinie annonce la lande humide qui couvrait autrefois
      l'essentiel du plateau.


      Sur les dunes occidentales s'épanouissent des landes de bruyères et de cistes à feuilles de sauge, dont
      les corolles blanches fleurissent d'avril à juin. Dans les secteurs les plus inondés du marais prédomine
      la marisque, côtoyant bourdaines, saules et bouleaux pionniers. Dans les dépressions tourbeuses
      prospèrent le droséra intermédiaire, la Thorella et la pilulaire ; la flore rare comprend le laîche à
      fruits barbus, le faux cresson de Thore et la pilulaire à globules.
    wildlife: >-
      La réserve se métamorphose au fil des saisons. Lors des passages de printemps et d'automne, sur un axe
      migratoire majeur, on dénombre plus de deux cents espèces, dont l'oie cendrée, l'aigrette garzette, la
      [spatule blanche](/especie/platalea_leucorodia/) et la mouette rieuse ; le [balbuzard
      pêcheur](/especie/pandion_haliaetus/) s'y installe surtout d'août à octobre. En hiver arrivent des
      milliers de [grues cendrées](/especie/grus_grus/), érigeant la réserve en site d'hivernage d'importance
      nationale.


      Au printemps nichent plus de 70 espèces. Sur les rives de l'étang, le [héron
      pourpré](/especie/ardea_purpurea/) et le [busard des roseaux](/especie/circus_aeruginosus/) ; dans le
      marais, la pie-grièche écorcheur, le [courlis cendré](/especie/numenius_arquata/) et la rare bécassine
      des marais ; en forêt, des rapaces comme le circaète Jean-le-Blanc et l'autour des palombes. La [loutre
      d'Europe](/especie/lutra_lutra/) et la [genette commune](/especie/genetta_genetta/) sont discrètes et
      trouvent ici quiétude et nourriture, aux côtés du [chevreuil](/especie/capreolus_capreolus/), du [cerf
      élaphe](/especie/cervus_elaphus/) et du [sanglier](/especie/sus_scrofa/).


      Lorsque le marais de Talaris s'inonde en hiver et au printemps, il sert de zone de fraie pour le [grand
      brochet](/especie/esox_lucius/) et de grossissement pour les civelles. On y rencontre la grenouille
      verte et la rainette méridionale, le crapaud calamite, des serpents comme la vipère aspic et la
      couleuvre d'Esculape, ainsi que la [cistude d'Europe](/especie/emys_orbicularis/). Depuis 1995 ont été
      recensées 39 espèces d'odonates et une cinquantaine d'espèces de papillons diurnes, avec le fadet des
      laîches pour symbole. Au total, plus de 3 000 espèces y ont été recensées.
    visit: >-
      Un sentier d'interprétation balisé longe l'étang depuis l'observatoire, au sud, jusqu'à la clairière de
      l'ouest. Le parcours depuis le parking de Marmande, sur la D6E1 entre Le Huga (Lacanau) et
      Carcans-Plage, fait 7,5 km aller-retour. L'accès est également possible à vélo par la piste cyclable
      reliant Lacanau-Océan à Maubuisson, avec deux entrées dotées de parcs à vélos, Lesperon et Régue verte.
      La réserve est ouverte toute l'année, du lever au coucher du soleil, et les visites guidées se font sur
      réservation.


      Prévoyez de bonnes chaussures de marche, de l'eau, du répulsif antimoustiques de mars à juillet et des
      jumelles. L'automne et l'hiver sont les périodes idéales pour observer les grues.
    history: >-
      Jusqu'à la fin du XVIIIe siècle, ces terres étaient de vastes landes rases inondées en hiver, où les
      bergers laissaient paître librement leurs troupeaux d'ovins. Au XIXe siècle, les travaux de drainage et
      le boisement en pins maritimes ont métamorphosé les Landes ; la pinède a été exploitée pour le bois et
      la résine, et la réserve abrite encore une authentique cabane de gemmeur.


      Dans les années 1970, la pratique du ski nautique sur l'étang troubla gravement la quiétude des lieux.
      Le classement en réserve en 1976 et l'engagement de la SEPANSO ont permis le retour progressif de la
      biodiversité. Le marais était alors enfriché et coupé du réseau hydrographique ; il a été restauré par
      brûlage dirigé et débroussaillement, puis reconnecté à son bassin versant pour retrouver un régime
      hydrologique naturel.


      Cette restauration a permis le retour d'herbivores. Au début des années 1990, la SEPANSO racheta in
      extremis le dernier troupeau connu de vaches marines landaises, et leur réintroduction contribua à
      ouvrir le milieu. La gestion fait appel aux bovins de race Marine et aux poneys landais. La réserve
      adhère au réseau Rewilding Europe : en 2023 débuta la réintroduction du bousier Scarabaeus laticollis,
      disparu de Gironde, marquant la première opération de ce type pour un insecte éteint en France, et en
      2024 un troupeau de buffles d'eau fut introduit pour entretenir les zones marécageuses. Parmi les
      menaces actuelles figure l'écrevisse de Louisiane, une espèce invasive exerçant une forte pression sur
      la flore et la faune aquatiques.
    before: >-
      Il est interdit toute l'année de circuler avec un quelconque véhicule, y compris les vélos même tenus à
      la main, de se baigner, de naviguer, de promener des chiens même en laisse, de cueillir plantes et
      champignons, de déranger la faune, de camper, de bivouaquer, d'allumer du feu et de survoler la réserve,
      y compris avec des drones. L'accès s'effectue exclusivement sur les sentiers balisés et les gardes
      veillent au respect de la réglementation toute l'année.
    around: >-
      Les grands lacs du Médoc s'étendent de part et d'autre de l'étang, Carcans-Hourtin au nord et Lacanau au
      sud. Plus loin, le [parc national de Słowiński](/lugar/slowinski-park-narodowy/) partage avec Cousseau
      la grue cendrée, la loutre et ses zones humides littorales.
  de:
    intro: >-
      Drei Kilometer vom Atlantik entfernt, zwischen zwei der großen Seen des Médoc, liegt ein kleiner See,
      der nur zu Fuß oder mit dem Fahrrad erreichbar ist. Das ist das Nationale Naturschutzgebiet Étang de
      Cousseau in Lacanau, 50 km westlich von Bordeaux. Der See selbst bedeckt 50 ha, das Schutzgebiet umfasst
      jedoch sechshundert Hektar, ergänzt um weitere dreihundert im Umland erworbene Hektar: eine Miniatur der
      Landes de Gascogne mit bewaldeten Dünen im Westen und dem Sumpf von Talaris im Osten.
    landscape: >-
      Alles begann mit dem Wind. Vor rund 3000 Jahren wehte der Wind Sand vom Strand landeinwärts und schuf
      Dünen, die den Flüssen der Landes de Gascogne den Abfluss ins Meer versperrten. So entstanden
      küstenparallele Strandseen, durch einen Dünenstreifen vom Ozean getrennt. Bis ins siebzehnte Jahrhundert
      war der Cousseau Teil einer riesigen Wasserfläche vom Norden Hourtins bis in den Süden von Lacanau.


      Drei Lebensräume prägen heute das Schutzgebiet. Der Wald auf alten Dünen vereint Kiefernforste und
      Eichen-Kiefern-Mischwälder mit trockenen Lichtungen und feuchten Senken, den sogenannten Barins. Der
      Étang de Cousseau führt das ganze Jahr über Wasser. Und das Moor: Am Seeufer dominiert das
      Schilfröhricht, weiter östlich leitet Pfeifengrasmoor zu den feuchten Heiden über, die einst die
      Hochfläche beherrschten.


      Auf den westlichen Dünen wachsen Besenheide und Salbeiblättrige Zistrose, deren weiße Blüten von April
      bis Juni erscheinen. In den überfluteten Moorbereichen dominiert die Schneide, begleitet von Faulbaum,
      Weiden und Birken. In torfigen Senken gedeihen Mittlerer Sonnentau, Thorella und Pillenfarn; seltene
      Pflanzenarten sind die Haarfrucht-Segge, die Thore-Wasserblume und der Kugel-Pillenfarn.
    wildlife: >-
      Das Schutzgebiet wandelt sich mit den Jahreszeiten. Auf dem herbstlichen und frühjährlichen Vogelzug
      entlang dieses Korridors lassen sich über zweihundert Arten beobachten, darunter Graugans, Seidenreiher,
      [Löffler](/especie/platalea_leucorodia/) und Lachmöwe; der [Fischadler](/especie/pandion_haliaetus/)
      rastet vor allem von August bis Oktober. Im Winter treffen Tausende von [Kranichen](/especie/grus_grus/)
      ein und machen das Reservat zu einem Überwinterungsgebiet von nationalem Rang.


      Im Frühjahr brüten mehr als 70 Arten. An den Ufern des Sees brüten
      [Purpurreiher](/especie/ardea_purpurea/) und [Rohrweihe](/especie/circus_aeruginosus/); im Moor
      Neuntöter, [Großer Brachvogel](/especie/numenius_arquata/) und die seltene Bekassine; im Wald Greifvögel
      wie Schlangenadler und Habicht. Der [Eurasische Fischotter](/especie/lutra_lutra/) und die
      [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/) leben heimlich und finden hier Ruhe und Nahrung,
      gemeinsam mit [Rehen](/especie/capreolus_capreolus/), [Rothirschen](/especie/cervus_elaphus/) und
      [Wildschweinen](/especie/sus_scrofa/).


      Wenn der Talaris-Sumpf im Winter und Frühjahr überflutet ist, dient er als Laichplatz für den
      [Hecht](/especie/esox_lucius/) und als Nahrungsraum für Glasaale. Es gibt Wasser- und
      Mittelmeer-Laubfrösche, Kreuzkröten, Schlangen wie Aspisviper und Äskulapnatter sowie die [Europäische
      Sumpfschildkröte](/especie/emys_orbicularis/). Seit 1995 wurden 39 Libellenarten und rund fünfzig
      Tagfalterarten erfasst, mit dem Wald-Wiesenvögelchen als Symbolart. Insgesamt sind mehr als 3 000 Arten
      nachgewiesen.
    visit: >-
      Ein markierter Lehrpfad führt vom Beobachtungsturm im Süden bis zur westlichen Lichtung am See entlang.
      Der Rundweg ab dem Parkplatz Marmande an der D6E1 zwischen Le Huga (Lacanau) und Carcans-Plage misst 7,5
      km hin und zurück. Das Reservat ist auch per Rad über den Radweg zwischen Lacanau-Océan und Maubuisson
      erreichbar, mit zwei Eingängen samt Fahrradständern in Lesperon und Régue verte. Das Schutzgebiet ist
      ganzjährig von Sonnenaufgang bis Sonnenuntergang geöffnet; Führungen bedürfen der Voranmeldung.


      Empfohlen werden festes Schuhwerk, Trinkwasser, Mückenschutz von März bis Juli und ein Fernglas. Für
      Kranichbeobachtungen eignen sich Herbst und Winter am besten.
    history: >-
      Bis zum Ende des achtzehnten Jahrhunderts erstreckten sich hier offene, im Winter überschwemmte Heiden,
      auf denen Schäfer ihre Herden weiden ließen. Im neunzehnten Jahrhundert wandelten Entwässerung und die
      Aufforstung mit Strandkiefern die Region; der Kiefernwald wurde für Holz und Harzgewinnung genutzt, und
      eine historische Harzerhütte steht noch heute im Schutzgebiet.


      In den 1970er-Jahren störte Wasserskisport auf dem See die empfindliche Tierwelt empfindlich. Die
      Unterschutzstellung 1976 und der Einsatz der SEPANSO ermöglichten eine schrittweise Rückkehr der
      Artenvielfalt. Damals war das Moor verbuscht und vom Gewässernetz getrennt; durch gezieltes Brennen und
      Entbuschen wurde es wieder an sein Einzugsgebiet angeschlossen, um natürliche Wasserstände
      wiederherzustellen.


      Mit der Renaturierung kehrten Weidetiere zurück. Anfang der 1990er-Jahre erwarb die SEPANSO in letzter
      Minute die letzte bekannte Herde der Landais-Rinderrasse Marine, deren Beweidung die Landschaft offen
      hält. Heute beweiden Marine-Rinder und Landais-Ponys das Areal. Das Reservat gehört zum Netzwerk
      Rewilding Europe: 2023 startete die Wiederansiedlung des in der Gironde verschollenen Pillendrehers
      Scarabaeus laticollis – die erste Wiederansiedlung eines ausgestorbenen Insekts in Frankreich –, und
      2024 wurde eine Wasserbüffelherde eingeführt, um Feuchtbereiche offen zu halten. Zu den Bedrohungen
      zählt der Rote Amerikanische Sumpfkrebs, der Wasserfauna und Pflanzenwelt stark beeinträchtigt.
    before: >-
      Ganzjährig verboten sind das Befahren mit Fahrzeugen aller Art (einschließlich geschobener Fahrräder),
      Baden, Bootfahren, unangeleinte Hunde, das Sammeln von Pflanzen und Pilzen, die Beunruhigung von Tieren,
      Zelten, Biwakieren, offenes Feuer sowie das Überfliegen mit Drohnen. Besucher müssen auf den markierten
      Wegen bleiben; Ranger kontrollieren die Einhaltung ganzjährig.
    around: >-
      Die großen Seen des Médoc liegen zu beiden Seiten des Étang: Carcans-Hourtin im Norden und Lacanau im
      Süden. Weiter entfernt teilt der polnische [Słowiński Nationalpark](/lugar/slowinski-park-narodowy/)
      Kraniche, Fischotter und Küstenfeuchtgebiete mit Cousseau.
  it:
    intro: >-
      A tre chilometri dall'Atlantico, incastonato tra due dei grandi laghi del Médoc, si trova un piccolo
      stagno raggiungibile solo a piedi o in bicicletta. È la riserva naturale nazionale dello stagno di
      Cousseau a Lacanau, 50 km a ovest di Bordeaux. Lo specchio d'acqua copre 50 ha, ma la riserva abbraccia
      seicento ettari, con altri trecento ettari acquisiti nelle zone limitrofe: un compendio in miniatura
      delle Landes de Gascogne, con dune boscose a ovest e la palude di Talaris a est.
    landscape: >-
      Tutto ebbe inizio con il vento. Circa 3000 anni fa, le correnti eoliche trasportarono la sabbia della
      spiaggia verso l'interno, formando cordoni dunicoli che impedirono ai fiumi delle Landes de Gascogne di
      sfociare in mare. Nacquero così lagune parallele alla linea di costa, separate dall'oceano dalle dune
      litoranee. Fino al diciassettesimo secolo, il bacino di Cousseau faceva parte di una vasta distesa
      d'acqua che andava dal nord di Hourtin al sud di Lacanau.


      Tre ambienti formano oggi la riserva. Il bosco su dune antiche combina pinete impiantate e boschi misti
      di pino e quercia, con radure secche e conche umide chiamate barins. Lo stagno di Cousseau conserva
      acqua tutto l'anno. E la palude: accanto allo stagno domina il canneto e, più a est, la brughiera a
      molinia introduce la landa umida che un tempo ricopriva gran parte dell'altopiano.


      Sulle dune occidentali fioriscono brughiere a erica e cisto a foglie di salvia, con corolle bianche che
      sbocciano tra aprile e giugno. Nelle parti più sommerse della palude predomina il falasco, frammisto a
      frangola, salici e betulle colonizzatrici. Nelle depressioni torbose vegetano la drosera intermedia, la
      Thorella e la pilularia; le rarità floristiche comprendono il carice a frutti barbuti, il falso
      crescione di Thore e la pilularia globulifera.
    wildlife: >-
      La riserva muta volto secondo il ciclo delle stagioni. Durante i passi primaverili e autunnali lungo
      questa direttrice migratoria, si osservano oltre duecento specie, tra cui l'oca selvatica, la garzetta,
      la [spatola](/especie/platalea_leucorodia/) e il gabbiano comune; il [falco
      pescatore](/especie/pandion_haliaetus/) sosta soprattutto da agosto a ottobre. In inverno giungono a
      migliaia le [gru](/especie/grus_grus/), che rendono la riserva un'area di svernamento di rilievo
      nazionale.


      In primavera nidificano più di 70 specie. Lungo le sponde dello stagno, l'[airone
      rosso](/especie/ardea_purpurea/) e il [falco di palude](/especie/circus_aeruginosus/); nella palude,
      l'averla piccola, il [chiurlo maggiore](/especie/numenius_arquata/) e il raro beccaccino; nel bosco,
      rapaci quali il biancone e l'astore. La [lontra europea](/especie/lutra_lutra/) e la [genetta
      comune](/especie/genetta_genetta/) sono elusive e trovano rifugio e cibo indisturbati, insieme a
      [caprioli](/especie/capreolus_capreolus/), [cervi](/especie/cervus_elaphus/) e
      [cinghiali](/especie/sus_scrofa/).


      Quando la palude di Talaris si allaga in inverno e primavera, funge da fregola per il
      [luccio](/especie/esox_lucius/) e da pascolo per le ceche. Vi si trovano rane verdi e raganelle
      meridionali, il rospo smeraldino, serpenti come la vipera comune e il biacco, nonché la [testuggine
      palustre europea](/especie/emys_orbicularis/). Dal 1995 sono state censite 39 specie di libellule e una
      cinquantina di farfalle diurne, con la ninfa delle torbiere come specie simbolo. In totale si contano
      più di 3 000 specie registrate.
    visit: >-
      Un sentiero tematico segnalato costeggia lo stagno dall'osservatorio a sud fino alla radura occidentale.
      L'itinerario a piedi dal parcheggio di Marmande, sulla D6E1 tra Le Huga (Lacanau) e Carcans-Plage, è di
      7,5 km andata e ritorno. Si può giungere anche in bicicletta lungo la pista ciclabile tra Lacanau-Océan
      e Maubuisson, con due accessi dotati di rastrelliere a Lesperon e Régue verte. La riserva è aperta tutto
      l'anno dall'alba al tramonto e le visite guidate si effettuano su prenotazione.


      Per la camminata sono raccomandati scarponcini, scorta d'acqua, repellente antizanzare da marzo a luglio
      e binocolo. La stagione ottimale per le gru è l'autunno e l'inverno.
    history: >-
      Fino alla fine del diciottesimo secolo queste distese erano lande aperte allagate d'inverno, dove i
      pastori facevano pascolare liberamente le greggi. Nel diciannovesimo secolo, le opere di bonifica e le
      piantumazioni di pino marittimo trasformarono le Landes; le pinete vennero sfruttate per il legname e la
      resina, e nella riserva resta tuttora una capanna autentica di gemmeur.


      Negli anni 1970 lo sci nautico sullo specchio lacustre compromise gravemente la serenità dell'habitat.
      L'istituzione della riserva nel 1976 e l'operato della SEPANSO favorirono il ritorno graduale della
      biodiversità. All'epoca la palude era invasa da arbusti e scollegata dalla rete idrografica; è stata
      ripristinata con incendi controllati e decespugliamenti, ricollegandola al suo bacino idrologico
      naturale.


      La rinaturalizzazione ha visto la reintroduzione di bestiame rustico. All'inizio degli anni 1990 la
      SEPANSO acquistò in extremis l'ultimo nucleo noto di bovine di razza Marine landaise, il cui pascolo ha
      permesso di mantenere aperti i prati. Oggi la gestione si avvale di vacche Marine e pony landesi. La
      riserva fa parte del circuito Rewilding Europe: nel 2023 ha avviato la reintroduzione dello scarabeo
      stercorario Scarabaeus laticollis, estinto in Gironda, prima operazione di questo genere per un insetto
      scomparso in Francia, e nel 2024 è stato introdotto un nucleo di bufali d'acqua per contenere la
      vegetazione palustre. Tra le minacce aperte figura il gambero rosso della Louisiana, specie alloctona
      che altera pesantemente flora e fauna acquatica.
    before: >-
      Durante tutto l'anno è proibito circolare con qualsiasi veicolo (biciclette incluse, anche se condotte a
      mano), fare il bagno, navigare, condurre cani non al guinzaglio, raccogliere fiori e funghi, disturbare
      gli animali, campeggiare, bivaccare, accendere fuochi e sorvolare la riserva con droni. L'accesso è
      consentito unicamente sui sentieri tracciati e il personale di vigilanza vigila con continuità.
    around: >-
      I grandi laghi del Médoc circondano lo stagno: Carcans-Hourtin a nord e Lacanau a sud. Più distante, il
      [Parco nazionale Słowiński](/lugar/slowinski-park-narodowy/) in Polonia condivide con Cousseau la
      presenza di gru cenerine, lontre e ambienti umidi costieri.
  pt:
    intro: >-
      A três quilómetros do Atlântico, entre dois dos grandes lagos do Médoc, repousa uma pequena lagoa à qual
      só se acede a pé ou de bicicleta. Trata-se da Reserva Natural Nacional da Lagoa de Cousseau, em Lacanau,
      a 50 km a oeste de Bordéus. A lagoa ocupa 50 ha, mas a reserva estende-se por seiscentas hectares, com
      outras trezentas adquiridas na sua envolvente: uma síntese em miniatura das Landes da Gasconha, com
      dunas arborizadas a oeste e o sapal de Talaris a este.
    landscape: >-
      Tudo começou com o vento. Há cerca de 3000 anos, os ventos arrastaram as areias da praia para o
      interior, formando dunas que impediram os rios das Landes da Gasconha de desaguarem no oceano.
      Formaram-se assim lagoas paralelas à linha de costa, separadas do mar por um cordão dunar. Até ao século
      XVII, a de Cousseau integrava um grande plano de água que se prolongava do norte de Hourtin até ao sul
      de Lacanau.


      Três habitats formam hoje a reserva. O bosque sobre dunas antigas combina pinhais plantados e florestas
      mistas de pinheiro e carvalho, com clareiras secas e depressões húmidas chamadas barins. A lagoa de
      Cousseau mantém água todo o ano. E o sapal: junto à lagoa domina o caniçal e, mais a este, a charneca de
      molínia prenuncia a charneca húmida que outrora cobria a maior parte do planalto.


      Nas dunas ocidentais surgem charnecas de urze e roselha-de-folha-de-salva, com flores brancas que
      desabrocham entre abril e junho. Nas áreas mais inundadas do sapal predomina a junça-de-folha-cortante,
      acompanhada por amieiros-negros, salgueiros e bétulas colonizadoras. Nas depressões turfosas vicejam a
      drosera-intermédia, a Thorella e a pilulária; a flora rara inclui a carriço-de-fruto-barbado, o falso
      agrião de Thore e a pilulária-globulífera.
    wildlife: >-
      A reserva renova-se ao ritmo das estações. Nas passagens de primavera e outono, ao longo de um corredor
      migratório de destaque, avistam-se mais de duzentas espécies, como o ganso-comum, a
      garça-branca-pequena, o [colhereiro-europeu](/especie/platalea_leucorodia/) e o guincho-comum; a [águia
      pescadora](/especie/pandion_haliaetus/) permanece sobretudo de agosto a outubro. No inverno chegam aos
      milhares os [grous-comuns](/especie/grus_grus/), tornando a reserva uma zona de invernada de relevância
      nacional.


      Na primavera nidificam mais de 70 espécies. Nas margens da lagoa, a
      [garça-vermelha](/especie/ardea_purpurea/) e o
      [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/); no sapal, o picanço-de-dorso-ruivo, o
      [maçarico-real](/especie/numenius_arquata/) e a rara narceja-comum; no bosque, rapinas como a
      águia-cobreira e o açor. A [lontra-europeia](/especie/lutra_lutra/) e a
      [gineta](/especie/genetta_genetta/) são esquivas e encontram aqui tranquilidade e alimento, a par de
      [corças](/especie/capreolus_capreolus/), [veados-vermelhos](/especie/cervus_elaphus/) e
      [javalis](/especie/sus_scrofa/).


      Quando o sapal de Talaris inunda no inverno e na primavera, acolhe a desova do
      [lúcio](/especie/esox_lucius/) e o crescimento das meixões. Encontram-se rãs-verdes e rela-meridional, o
      sapo-corredor, cobras como a víbora-áspide e a cobra-de-Esculápio, bem como o
      [cágado-de-carapaça-estriada](/especie/emys_orbicularis/). Desde 1995 foram identificadas 39 espécies de
      libélulas e cerca de cinquenta espécies de borboletas diurnas, com a borboleta-dos-lameiros por emblema.
      No cômputo geral já foram catalogadas mais de 3 000 espécies.
    visit: >-
      Um percurso pedestre interpretativo balizado ladeia a lagoa desde o observatório, a sul, até à clareira
      ocidental. O percurso a partir do parque de estacionamento de Marmande, na D6E1 entre Le Huga (Lacanau)
      e Carcans-Plage, é de 7,5 km ida e volta. Também é possível aceder de bicicleta pela ciclovia entre
      Lacanau-Océan e Maubuisson, com duas entradas providas de estacionamento para bicicletas, Lesperon e
      Régue verte. A reserva abre todo o ano do nascer ao pôr do sol, realizando-se as visitas guiadas
      mediante reserva.


      Para o percurso recomenda-se calçado de caminhada, água, repelente de mosquitos de março a julho e
      binóculos. A melhor altura para os grous é o outono e o inverno.
    history: >-
      Até finais do século XVIII, estas paragens eram charnecas rasas alagadas no inverno, onde os pastores
      deixavam pastar livremente os seus rebanhos de ovelhas. No século XIX, a drenagem e o plantio de
      pinheiro-bravo transformaram as Landes; o pinhal foi explorado para madeira e resina, subsistindo ainda
      na reserva uma autêntica cabana de gemmeur.


      Nos anos 1970, a prática de esqui aquático na lagoa perturbou profundamente a sua tranquilidade. A
      criação da reserva em 1976 e o trabalho da SEPANSO propiciaram a lenta recuperação da biodiversidade. Na
      época o sapal encontrava-se invadido por mato lenhoso e isolado da rede hidrográfica; foi recuperado com
      fogo controlado e desbaste mecânico, voltando a ligar-se à sua bacia para repor o ciclo hídrico natural.


      A recuperação trouxe consigo animais pastadores. No início dos anos 1990, a SEPANSO adquiriu in extremis
      o último efetivo conhecido de vacas de raça Marine landesa, cujo pastoreio ajudou a reabrir os prados.
      Hoje em dia a gestão recorre a vacas Marine e a póneis landeses. A reserva integra a rede Rewilding
      Europe: em 2023 iniciou a reintrodução do escaravelho-bosteiro Scarabaeus laticollis, desaparecido da
      Gironda, a primeira operação com um inseto extinto em França, e em 2024 introduziu-se uma manada de
      búfalos-asiáticos para conservar os sapais abertos. Entre as ameaças figura o
      lagostim-vermelho-da-luisiana, espécie exótica com forte impacto na vegetação e fauna aquática.
    before: >-
      É proibido durante todo o ano circular com qualquer veículo (incluindo bicicletas mesmo que levadas à
      mão), tomar banho, navegar, passear cães soltos, colher plantas e cogumelos, perturbar a fauna, acampar,
      pernoitar, acender fogueiras e sobrevoar a reserva com drones. O acesso limita-se estritamente aos
      trilhos sinalizados e os guardas florestais vigiam o cumprimento ao longo de todo o ano.
    around: >-
      Os grandes lagos do Médoc ladeiam a lagoa: Carcans-Hourtin a norte e Lacanau a sul. Mais longe, o
      [Parque Nacional Słowiński](/lugar/slowinski-park-narodowy/) na Polónia partilha com Cousseau a presença
      de grous-comuns, lontras e sapais costeiros.
