resumen:
  es: Landas de brezo y acantilados de arenisca roja de más de 70 metros con colonias de aves marinas.
  en: >-
    Heather moorlands and pink sandstone cliffs rising over 70 metres sheltering vital seabird breeding
    colonies.
  fr: >-
    Landes littorales et falaises de grès rose de plus de 70 mètres abritant des colonies majeures d'oiseaux
    marins.
  de: >-
    Küstenheiden und über 70 Meter hohe Klippen aus rosa Sandstein mit bedeutenden Brutkolonien von
    Meeresvögeln.
  it: >-
    Brughiere costiere e falesie di arenaria rosa alte oltre 70 metri con importanti colonie di uccelli marini
    nidificanti.
  pt: >-
    Charnecas litorais e arribas de arenito avermelhado com mais de 70 metros sustentando colónias de aves
    marinhas.
unico:
  es: Entre 280 y 336 parejas de arao común crían en estos acantilados, alrededor del 85 % de las de Francia.
  en: >-
    Between 280 and 336 pairs of common murres nest on these sheer sea cliffs, accounting for roughly 85 % of
    the French population.
  fr: >-
    Entre 280 et 336 couples de guillemots de Troïl nichent sur ces falaises, représentant environ 85 % de la
    population reproductrice française.
  de: >-
    Zwischen 280 und 336 Trottellummen-Paare brüten in den Steilwänden – rund 85 % des gesamten französischen
    Brutbestands.
  it: >-
    Tra 280 e 336 coppie di urie nidificano su queste scogliere, rappresentando circa l'85 % dell'intera
    popolazione riproduttiva francese.
  pt: >-
    Entre 280 e 336 casais de airo nidificam nestas arribas, congregando cerca de 85 % do efetivo nidificante
    de França.
observaciones:
  es: >-
    Quédate en los senderos balizados: los atajos favorecen la erosión y el pisoteo de la vegetación. Si vas
    con perro, llévalo siempre con correa. No se puede hacer fuego, y de noche están prohibidos el camping y
    las autocaravanas en el sitio clasificado. Si ves delfines desde el mar, mantén una distancia mínima.
    Consulta antes de ir las restricciones en los ayuntamientos o las oficinas de turismo.
texto:
  es:
    intro: >-
      Entre dos bahías, una punta de arenisca rosa se adentra en el mar como un dedo tozudo. Es el Cabo
      Fréhel, en Bretaña, y su acantilado cae unos 70 metros sobre el mar. Separa la bahía de Saint-Brieuc de
      la de Saint-Malo, y desde su extremo, con tiempo claro, se distingue la isla de Jersey. Arriba, una
      landa rasa, rosa de brezo y amarilla de aulaga; abajo, una roca roja que cada verano se llena de aves
      marinas.
    landscape: >-
      La piedra lo explica todo. El cabo es de la Serie roja de Erquy-Fréhel, y su color viene de un óxido de
      hierro mezclado con el cemento que une los granos de arena. Las capas son casi horizontales y están
      cortadas por grandes filones verticales de diorita. El mar hace el resto: talla la arenisca en escalones
      y bloques, y a veces deja pilares y pináculos, como la roca de la Fauconnière.


      En la base, la costa abrupta esconde cuevas marinas que los bretones llaman «houles». Se puede entrar a
      pie con marea baja y en kayak de mar con marea alta, y la houle de la Banche es la más larga. Según los
      cuentos que recogió Paul Sébillot en el siglo XIX, las poblaban las hadas de las houles.


      Arriba mandan las landas: 340 hectáreas de brezo y aulaga batidas por el viento marino, mantenidas por
      un pequeño rebaño que pasta para evitar que se cierren. En las praderas de brachypodium y Peucedanum
      officinale, que en Francia solo se dan en este cabo, y en los senderos abiertos por el pisoteo se
      refugian lagartijas de los muros, abejas silvestres, saltamontes y arañas.
    wildlife: >-
      El gran espectáculo son los acantilados en verano. Sobre la roca de la Fauconnière, y en la pared que
      hay bajo los pies de los visitantes, crían el [cormorán moñudo](/especie/phalacrocorax_aristotelis/), el
      [arao común](/especie/uria_aalge/) y, más abajo, la [gaviota tridáctila](/especie/rissa_tridactyla/). Se
      suman unas 28 a 31 parejas de [alca](/especie/alca_torda/), el [fulmar
      boreal](/especie/fulmarus_glacialis/) repartido a lo largo de los cortados, y gaviotas sombría, argéntea
      y parda en los islotes llanos de los alrededores.


      El año tiene su ritmo. En primavera llegan las aves marinas que anidan en el cabo y aparecen discretas
      orquídeas. A finales del verano florece la genciana de los pantanos. En invierno, la bahía de la
      Fresnaye recibe aves venidas del norte. Las landas, además, son lugar de paso migratorio de muchos
      paseriformes, como la collalba gris, y desde mediados del verano de 2019 se observa una pareja de
      [chovas piquirrojas](/especie/pyrrhocorax_pyrrhocorax/), la primera mención en el departamento.
    visit: >-
      Lo clásico es caminar. Un sendero del GR 34 rodea el cabo entre brezos y aulagas. Por el Grand Site pasa
      también la Vélomaritime, el itinerario ciclista europeo Eurovelo 4. Los senderos costeros son solo para
      peatones.


      Se llega por una carretera costera: desde el este, pasando junto al fuerte La Latte, o desde
      Sables-d'Or-les-Pins, al oeste. Sin coche, desde Saint-Brieuc la línea 2 de Breizhgo lleva a Erquy y
      Plévenon y admite bicicletas. El acceso al faro está adaptado para personas con movilidad reducida.
    history: >-
      El viejo faro de granito, la torre Vauban, se construyó en 1701 bajo Luis XIV. Durante la Segunda Guerra
      Mundial el cabo albergó una estación de radar: hoy quedan algunos búnkeres escondidos entre los
      matorrales, y en sus galerías hay murciélagos. Y hubo un intento de carretera: un alcalde de Fréhel
      empezó ilegalmente una vía litoral hacia el cabo, pero la oposición ecologista hizo que se abandonara y
      se restituyó el lugar.


      El cabo está clasificado desde 1967 por la calidad de sus landas costeras, su riqueza biológica y su
      reserva ornitológica. Las landas y el mar forman parte de un sitio Natura 2000 que va de Erquy a
      Saint-Cast-le-Guildo, y en septiembre de 2019 el conjunto de los Caps de Erquy y Fréhel se convirtió en
      el decimonoveno Grand Site de France. Reciben más de dos millones de visitantes al año.
    before: >-
      Quédate en los senderos balizados: los atajos favorecen la erosión y el pisoteo de la vegetación. Si vas
      con perro, llévalo siempre con correa. No se puede hacer fuego, y de noche están prohibidos el camping y
      las autocaravanas en el sitio clasificado. Si ves delfines desde el mar, mantén una distancia mínima.
      Consulta antes de ir las restricciones en los ayuntamientos o las oficinas de turismo.
    around: >-
      Lejos, en la punta occidental de Bretaña, la [Pointe du Raz](/lugar/pointe-du-raz-en-cap-sizun/)
      comparte con el cabo el fulmar, la chova piquirroja y el halcón peregrino. Las
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Marwick Head](/lugar/marwick-head/) y
      [Hornstrandir](/lugar/hornstrandir/) comparten con él alcas y araos comunes.
  en:
    intro: >-
      Wedged between two vast bays, a jagged promontory of pink sandstone projects into the English Channel
      like a defiant finger. This is Cap Fréhel in Brittany, its sea cliffs plunging some 70 metres into
      pounding waves. It demarcates the Bay of Saint-Brieuc from the Bay of Saint-Malo, and on clear days the
      silhouette of Jersey sharpens against the horizon. Above unfolds an exposed windswept moorland, ablaze
      with pink bell heather and golden gorse; below, sheer red cliffs host raucous seabird colonies
      throughout summer.
    landscape: >-
      The bedrock explains the coastal architecture. The cape belongs to the Erquy-Fréhel Red Sandstone
      Series, its distinctive ochre-pink color derived from iron oxide mineral cements bonding quartz grains.
      Stratified beds lie nearly horizontal, punctuated by vertical dolerite dykes. Ocean breakers carve the
      sandstone into fractured terraces, pillars, and sea stacks, notably the iconic pinnacle of the
      Fauconnière.


      At the water line the plunging cliffs conceal labyrinthine sea caves known locally in Breton as
      *houles*. Explorers can access them on foot at extreme low spring tides or by sea kayak at high water;
      the Houle de la Banche is the longest. Nineteenth-century folklorist Paul Sébillot recorded local
      legends populating these cavernous hollows with marine fairies (*fées des houles*).


      Across the clifftop plateau stretches coastal heath: 340 hectares of maritime dwarf-shrub heathland
      windswept by oceanic gales, maintained through conservation sheep grazing to halt woody scrub
      encroachment. Maritime grasslands of *Brachypodium pinnatum* and sea hog's fennel (*Peucedanum
      officinale*)—the latter unique in France to this headland—shelter common wall lizards, solitary bees,
      grasshoppers, and burrowing spiders.
    wildlife: >-
      The summer cliff colonies stage an unforgettable avian spectacle. Crowning the Fauconnière sea stack and
      nesting along ledges beneath the visitor balustrades are [European
      shag](/especie/phalacrocorax_aristotelis/), [common murre](/especie/uria_aalge/), and [black-legged
      kittiwake](/especie/rissa_tridactyla/). They are joined by 28 to 31 pairs of
      [razorbill](/especie/alca_torda/), with [northern fulmars](/especie/fulmarus_glacialis/) dispersed along
      the gullies, alongside lesser black-backed, herring, and great black-backed gulls nesting on offshore
      islets.


      Seasonal rhythms transform the headland. In spring pelagic cliff-nesters arrive and subtle wild orchids
      flower among the sward. Late summer brings the delicate azure blossoms of marsh gentian (*Gentiana
      pneumonanthe*). In winter the sheltered Baie de la Fresnaye hosts northern wildfowl. The moorlands also
      serve as a vital coastal migration funnel for passerines like northern wheatears; since mid-summer 2019,
      a resident pair of [red-billed choughs](/especie/pyrrhocorax_pyrrhocorax/) has established itself,
      marking the first confirmed record for the department.
    visit: >-
      Walking is the classic experience. The GR 34 coastal footpath loops around the perimeter of the headland
      through heather and gorse. The Grand Site is also crossed by the Vélomaritime, part of the EuroVelo 4
      European cycle route. Cliff-edge tracks are strictly reserved for pedestrians.


      Vehicular access follows coastal roads: from the east past Fort La Latte, or from Sables-d'Or-les-Pins
      to the west. Without a car, BreizhGo regional bus line 2 from Saint-Brieuc serves Erquy and Plévenon
      with on-board bicycle racks. Paved access pathways to the lighthouse are accessible to visitors with
      reduced mobility.
    history: >-
      The historic granite lighthouse, the Vauban tower, was erected in 1701 during the reign of Louis XIV. In
      the Second World War the German military operated a coastal radar surveillance post here; reinforced
      concrete bunkers remain hidden beneath the scrub, their damp galleries providing winter bat roosts. A
      controversial littoral road initiated illegally by a local mayor was successfully halted by
      environmentalists, and the disturbed heath was fully restored.


      The cape has enjoyed national protected site classification since 1967 in recognition of its heathland
      habitats, rich botanical diversity, and seabird cliffs. The terrestrial moors and offshore waters form a
      Natura 2000 marine site spanning Erquy to Saint-Cast-le-Guildo; in September 2019 the combined headlands
      of Erquy and Fréhel were formally designated as France's nineteenth Grand Site de France, welcoming over
      two million visitors annually.
    before: >-
      Stay on demarcated pathways at all times: shortcuts accelerate severe coastal erosion and trample
      delicate heath communities. Dogs must remain on leashes. Open fires, overnight wild camping, and camper
      van stays are strictly forbidden across the protected site. If watching bottlenose dolphins offshore,
      maintain respectful distances. Consult local tourism offices for seasonal restrictions.
    around: >-
      Far to the west at Brittany's outer extremity, the [Pointe du Raz](/lugar/pointe-du-raz-en-cap-sizun/)
      shares northern fulmars, red-billed choughs, and peregrines. The
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Marwick Head](/lugar/marwick-head/), and
      [Hornstrandir](/lugar/hornstrandir/) share raucous seabird cliffs crowded with razorbills and common
      murres.
  fr:
    intro: >-
      Entre deux baies, une proue de grès rose s'avance en mer comme un doigt obstiné. C'est le cap Fréhel, en
      Bretagne, dont les falaises vertigineuses plongent de près de 70 mètres vers les déferlantes. Il sépare
      la baie de Saint-Brieuc de celle de Saint-Malo, et par temps clair l'île de Jersey se détache à
      l'horizon. Au sommet s'étend une lande rase, rose de bruyère et jaune d'ajonc ; en contrebas, des parois
      pourpres où se pressent chaque été des colonies d'oiseaux marins.
    landscape: >-
      La géologie commande les paysages. Le promontoire appartient à la série rouge d'Erquy-Fréhel : sa teinte
      chaude provient d'un oxyde de fer imprégnant le ciment liant les grains de quartz. Les strates
      subhorizontales sont recoupées par de puissants filons verticaux de dolérite. L'érosion marine sculpte
      le grès en gradins et en piliers isolés, à l'image de l'emblématique rocher de la Fauconnière.


      Au pied des falaises, le ressac a creusé de profondes grottes marines que la tradition bretonne nomme «
      houles ». Accessibles à pied aux grandes marées basses ou en kayak de mer à marée haute, la houle de la
      Banche est la plus spectaculaire. Les récits de Paul Sébillot recueillis au XIXe siècle les peuplaient
      de fées des houles bienveillantes.


      Sur le plateau règnent les landes : 340 hectares de bruyères et d'ajoncs battus par les embruns,
      entretenus par un troupeau ovin assurant une gestion pastorale conservatoire. Les pelouses à brachypode
      et peucédan officinal—station unique en France—et les sentiers sablonneux abritent lézards des
      murailles, abeilles solitaires, criquets et araignées terricoles.
    wildlife: >-
      Les falaises estivales offrent une féerie ornithologique. Sur le pinacle de la Fauconnière et sur les
      corniches qui s'étirent sous les yeux des visiteurs nichent le [cormoran
      huppé](/especie/phalacrocorax_aristotelis/), le [guillemot de Troïl](/especie/uria_aalge/) et, sur les
      vires inférieures, la [mouette tridactyle](/especie/rissa_tridactyla/). S'y ajoutent 28 à 31 couples de
      [petit pingouin](/especie/alca_torda/), des [fulmars boréaux](/especie/fulmarus_glacialis/) disséminés
      sur les parois et plusieurs goélands sur les îlots rocheux voisins.


      Le cap vit au rythme des saisons. Au printemps arrivent les colonies reproductrices et éclosent de
      discrètes orchidées terrestres. La fin de l'été dévoile la gentiane des marais. En hiver, la baie de la
      Fresnaye abrite des canards venus du grand Nord. Les landes constituent une halte migratoire majeure
      pour de nombreux passereaux ; depuis le milieu de l'été 2019, un couple de [craves à bec
      rouge](/especie/pyrrhocorax_pyrrhocorax/) s'est installé, constituant la première nidification moderne
      du département.
    visit: >-
      La découverte se fait à pied. Le sentier des douaniers (GR 34) ceinture le promontoire à travers les
      landes. Le Grand Site est également traversé par la Vélomaritime, section de l'EuroVelo 4. Les sentiers
      côtiers sont strictement piétons.


      On y accède par la route littorale : par l'est depuis le fort La Latte, ou par l'ouest depuis
      Sables-d'Or-les-Pins. Sans voiture, la ligne 2 de BreizhGo au départ de Saint-Brieuc dessert Erquy et
      Plévenon et transporte les bicyclettes. L'accès au phare est aménagé pour les personnes à mobilité
      réduite.
    history: >-
      Le vieux phare de granit, dit tour Vauban, fut érigé en 1701 sous le règne de Louis XIV. Durant la
      Seconde Guerre mondiale, le site abrita une station radar côtière ; des blockhaus subsistent enfouis
      sous la lande, abritant des chauves-souris. Une tentative illégale de percement d'une route littorale
      par un maire local fut abandonnée face à la mobilisation citoyenne, et le milieu naturel fut restauré.


      Le cap est classé monument naturel depuis 1967 pour la qualité de ses landes, sa richesse floristique et
      sa réserve ornithologique. Le plateau et le milieu marin relèvent du réseau Natura 2000 entre Erquy et
      Saint-Cast-le-Guildo ; en septembre 2019, l'ensemble Grand Site Cap d'Erquy-Cap Fréhel est devenu le
      dix-neuvième Grand Site de France, accueillant plus de deux millions de visiteurs par an.
    before: >-
      Restez impérativement sur les sentiers balisés : les raccourcis accélèrent le ravinement et dégradent
      les landes fragiles. Tenez les chiens en laisse en permanence. Le feu, le bivouac et le stationnement
      nocturne des camping-cars sont rigoureusement interdits dans le périmètre classé. En cas d'observation
      de dauphins en mer, gardez vos distances.
    around: >-
      À la pointe occidentale du Finistère, la [Pointe du Raz](/lugar/pointe-du-raz-en-cap-sizun/) partage
      fulmar boréal, crave à bec rouge et faucon pèlerin. Les
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Marwick Head](/lugar/marwick-head/) et
      [Hornstrandir](/lugar/hornstrandir/) partagent des colonies de petits pingouins et de guillemots.
  de:
    intro: >-
      Zwischen zwei weiten Meeresbuchten schiebt sich eine Landzunge aus rosafarbenem Sandstein wie ein
      trutziger Finger in den Ärmelkanal. Es ist das Cap Fréhel in der Bretagne, dessen rote Klippen rund 70
      Meter steil ins Meer abbrechen. Das Kap trennt die Bucht von Saint-Brieuc von jener von Saint-Malo; bei
      klarer Sicht zeichnen sich die Umrisse der Kanalinsel Jersey am Horizont ab. Oben breitet sich eine
      karge, windgepeitschte Heidelandschaft aus, rosa von Heidekraut und gelb von Stechginster; unten ragen
      Brandungsfelsen auf, die im Sommer von Seevögeln bevölkert sind.
    landscape: >-
      Das Gestein prägt das Relief: Das Kap gehört zur roten Serie von Erquy-Fréhel. Seine warme Färbung rührt
      von Eisenoxiden her, die das Bindemittel der Quarzkörner durchdringen. Die fast horizontal gelagerten
      Sandsteinbänke werden von senkrechten Doleritgängen durchschlagen. Die Meeresbrandung meißelt
      Felsstufen, Brandungstore und freistehende Felsnadeln wie die markante Fauconnière heraus.


      Am Fuß der Steilküste verbergen sich Brandungshöhlen, die im Bretonischen *houles* heißen. Bei extremem
      Niedrigwasser sind sie zu Fuß, bei Flut per Seekajak befahrbar; die Houle de la Banche ist die längste.
      Der Volkskundler Paul Sébillot sammelte im neunzehnten Jahrhundert Sagen über die Feen dieser
      Meeresgrotten (*fées des houles*).


      Auf der Hochfläche dominieren Küstenheiden: 340 Hektar windgebeutelte Zwergstrauchheiden, die durch
      extensive Schafbeweidung offen gehalten werden. In lückigen Rasen aus Fieder-Zwenke und Echtem
      Haarstrang (*Peucedanum officinale*) – der in Frankreich ausschließlich an diesem Kap vorkommt – finden
      Mauereidechsen, Wildbienen, Heuschrecken und Webspinnen Zuflucht.
    wildlife: >-
      Die Klippen bieten im Sommer ein unvergleichliches Vogelschauspiel. Auf der Felsnadel Fauconnière und an
      den Kanten direkt unter den Aussichtsplattformen nisten
      [Krähenscharbe](/especie/phalacrocorax_aristotelis/), [Trottellumme](/especie/uria_aalge/) und auf
      tieferen Bändern die [Dreizehenmöwe](/especie/rissa_tridactyla/). Hinzu kommen 28 bis 31 Paare des
      [Tordalks](/especie/alca_torda/), [Eissturmvögel](/especie/fulmarus_glacialis/) entlang der Wände sowie
      Herings-, Silber- und Mantelmöwen auf vorgelagerten Felsriffen.


      Das Kap folgt dem Rhythmus der Jahreszeiten. Im Frühjahr kehren die Seevögel zurück und zarte
      Erdorchideen blühen auf. Im Spätsommer öffnet der Lungen-Enzian seine blauen Kelche. Im Winter bietet
      die Bucht von La Fresnaye nordischen Meeresenten Schutz. Zudem dient die Heidelandschaft ziehenden
      Singvögeln wie dem Steinschmätzer als Rastplatz; seit Hochsommer 2019 hält sich ein Paar der
      [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/) auf – der erste Brutnachweis im Département.
    visit: >-
      Zu Fuß erlebt man das Kap am intensivsten. Der Zöllnerpfad GR 34 umrundet die Landspitze durch Heide und
      Ginster. Entlang der Küste verläuft auch die Vélomaritime (EuroVelo 4). Die ufernahen Klippenpfade sind
      ausschließlich Fußgängern vorbehalten.


      Die Anfahrt erfolgt über Küstenstraßen: aus Osten vorbei am Fort La Latte oder aus Westen ab
      Sables-d'Or-les-Pins. Autofrei verkehrt ab Saint-Brieuc die BreizhGo-Buslinie 2 nach Erquy und Plévenon
      mit Fahrradbeförderung. Der Weg zum Leuchtturm ist barrierefrei ausgebaut.
    history: >-
      Der alte Leuchtturm aus Granit, der Vauban-Turm, wurde 1701 unter Ludwig XIV. erbaut. Im Zweiten
      Weltkrieg betrieb die deutsche Wehrmacht hier eine Radarstation; Bunkerruinen liegen im Gestrüpp
      verborgen und dienen Fledermäusen als Winterquartier. Ein rechtswidriger Straßenbauversuch eines
      Bürgermeisters wurde durch Naturschützer gestoppt und das Gelände renaturiert.


      Das Kap steht seit 1967 wegen seiner Küstenheiden, seiner Flora und seines Vogelschutzgebiets unter
      Denkmalschutz. Land und Meer gehören zum Natura-2000-Gebiet von Erquy bis Saint-Cast-le-Guildo; im
      September 2019 wurden die Caps von Erquy und Fréhel als neunzehnter Grand Site de France anerkannt und
      verzeichnen jährlich über zwei Millionen Gäste.
    before: >-
      Bleibe unbedingt auf den ausgewiesenen Wegen: Abkürzungen beschleunigen die Küstenerosion und zerstören
      die Heidedecke. Führe Hunde stets an der Leine. Offenes Feuer, Wildcampen und Wohnmobil-Übernachtungen
      sind auf dem geschützten Areal verboten. Halte bei Bootsausfahrten respektvollen Abstand zu
      Meeressäugern.
    around: >-
      Am westlichen Ende der Bretagne teilt die [Pointe du Raz](/lugar/pointe-du-raz-en-cap-sizun/)
      Eissturmvogel, Alpenkrähe und Wanderfalke mit dem Kap. Die
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Marwick Head](/lugar/marwick-head/) und
      [Hornstrandir](/lugar/hornstrandir/) teilen reiche Kolonien von Tordalken und Trottellummen.
  it:
    intro: >-
      Tra due ampie insenature, una punta di arenaria rosa si allunga sull'oceano come un fiero baluardo. È
      Cap Fréhel, in Bretagna, le cui falesie scoscendono per circa 70 metri fino a incontrare i frangenti.
      Separa la baia di Saint-Brieuc da quella di Saint-Malo e, nelle giornate terse, all'orizzonte emerge
      l'isola di Jersey. In alto si apre una landa spazzata dal vento, punteggiata dal rosa dell'erica e
      dall'oro del ginestrone; in basso, scogliere rossastre popolate d'estate da festose colonie marine.
    landscape: >-
      La roccia governa la conformazione del litorale. Il promontorio rientra nella Serie rossa di
      Erquy-Fréhel: il caratteristico colore scaturisce dagli ossidi di ferro presenti nel cemento minerale
      che salda i granuli di quarzo. Gli strati quasi orizzontali sono intersecati da imponenti filoni
      verticali di diorite. Il moto ondoso modella l'arenaria in terrazzamenti, pilastri e faraglioni, tra cui
      spicca lo scoglio della Fauconnière.


      Alla base delle falesie si aprono grotte marine denominate in bretone «houles». Si visitano a piedi
      nelle basse maree sizigiali e in kayak da mare durante l'alta marea; la houle de la Banche è la più
      profonda. Nell'Ottocento il folklorista Paul Sébillot vi raccolse fiabe popolari abitate da ninfe marine
      (*fées des houles*).


      Sull'altopiano dominano le lande litoranee: 340 ettari di brughiera nana modellata dalle tempeste
      atlantiche, gestita tramite pascolo ovino controllato per contrastare l'avanzata del bosco. Le praterie
      costiere a paleo e peucedano officinale—stazione unica in territorio francese—e i sentieri sabbiosi
      danno asilo a lucertole muraiole, api solitarie, cavallette e ragni fossori.
    wildlife: >-
      Nei mesi estivi le scogliere offrono uno straordinario carosello ornitologico. Sull'isolotto della
      Fauconnière e sulle cenge rocciose poste a strapiombo nidificano il [marangone dal
      ciuffo](/especie/phalacrocorax_aristotelis/), l'[uria](/especie/uria_aalge/) e, sui gradini inferiori,
      il [gabbiano tridattilo](/especie/rissa_tridactyla/). A loro si affiancano 28-31 coppie di [gazza
      marina](/especie/alca_torda/), il [fulmaro](/especie/fulmarus_glacialis/) sparso lungo le balze, oltre a
      gabbiani zafferani e reali sui faraglioni prospicienti.


      Il promontorio scandisce il ciclo delle stagioni. A primavera giungono gli uccelli pelagici e fioriscono
      orchidee spontanee. Sul finire dell'estate sboccia la genziana di palude. In inverno la baia de la
      Fresnaye accoglie anatre tuffatrici e limicoli nordici. Le lande sono un corridoio migratorio
      fondamentale per i passeriformi; dal pieno dell'estate 2019 vi risiede una coppia stanziale di [gracchio
      corallino](/especie/pyrrhocorax_pyrrhocorax/), prima segnalazione accertata nel dipartimento.
    visit: >-
      Il modo migliore per visitarlo è camminare. Il sentiero litoraneo GR 34 cinge l'intero perimetro del
      promontorio tra eriche e ginestroni. Il comprensorio è servito anche dalla Vélomaritime, tratta francese
      dell'EuroVelo 4. I tracciati di falesia sono rigorosamente pedonali.


      L'accesso veicolare si effettua lungo la strada litoranea: da est costeggiando Fort La Latte, o da ovest
      partendo da Sables-d'Or-les-Pins. Con i mezzi pubblici, da Saint-Brieuc la linea 2 BreizhGo raggiunge
      Erquy e Plévenon consentendo il trasporto bici. Il percorso attorno al faro è accessibile a persone con
      disabilità motoria.
    history: >-
      L'antico faro in granito, la torre Vauban, venne innalzato nel 1701 sotto Luigi XIV. Durante la seconda
      guerra mondiale ospitò una postazione radar navale tedesca; resti di bunker in cemento armato affiorano
      tra gli arbusti offrendo rifugio invernale ai pipistrelli. Il cantiere abusivo di una strada litoranea
      intrapreso da un sindaco locale fu bloccato dalle proteste ambientaliste e il promontorio venne
      bonificato.


      Il promontorio è tutelato come monumento naturale dal 1967 per il pregio delle lande costiere e l'oasi
      avifaunistica. Brughiere e specchi d'acqua ricadono nel sito Natura 2000 da Erquy a
      Saint-Cast-le-Guildo; nel settembre 2019 l'insieme dei capi d'Erquy e Fréhel è divenuto il
      diciannovesimo Grand Site de France, superando i due milioni di turisti all'anno.
    before: >-
      Resta sempre sui sentieri battuti: le scorciatoie provocano il franamento del suolo e calpestano la
      delicata copertura vegetale. Conduci i cani sempre al guinzaglio. Sono tassativamente vietati fuochi,
      campeggio libero e sosta notturna di camper. In caso di avvistamento di delfini in mare, mantieni
      distanze prudenti.
    around: >-
      All'estremità occidentale della Bretagna, la [Pointe du Raz](/lugar/pointe-du-raz-en-cap-sizun/) divide
      con Cap Fréhel fulmaro, gracchio corallino e falco pellegrino. Le
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Marwick Head](/lugar/marwick-head/) e
      [Hornstrandir](/lugar/hornstrandir/) ospitano falesie con gazze marine e urie.
  pt:
    intro: >-
      Entre duas baías abertas, uma proa de arenito rosado avança mar adentro como um promontório
      inexpugnável. É o Cabo Fréhel, na Bretanha, cujas arribas caem cerca de 70 metros a pique sobre as
      vagas. Separa a baía de Saint-Brieuc da de Saint-Malo e, em dias luminosos, a silhueta da ilha de Jersey
      recorta-se no horizonte. No topo estende-se uma charneca rasteira, rosada de urze e dourada de tojo; no
      sopé erguem-se escarpas avermelhadas povoadas no verão por milhares de aves marinhas.
    landscape: >-
      A geologia dita a fisionomia da costa. O promontório integra a Série vermelha de Erquy-Fréhel: a sua
      tonalidade provém de óxidos de ferro no cimento que agrega os grãos de quartzo. Os estratos
      sub-horizontais são intersetados por possantes filões verticais de diorito. A ondulação marinha esculpe
      o arenito em bancadas, plataformas e leixões imponentes, destacando-se o ilhéu da Fauconnière.


      Na linha de água as falésias abrigam cavidades marinhas apelidadas em bretão de «houles». Tornam-se
      acessíveis a pé na maré-baixa viva e de caiaque do mar na maré-cheia; a houle de la Banche é a mais
      extensa. No século XIX o folclorista Paul Sébillot recolheu narrativas populares habitadas pelas fadas
      do mar (*fées des houles*).


      No planalto imperam as charnecas costeiras: 340 hectares de charneca marítima fustigada pelos ventos
      atlânticos, mantida através de pastoreio extensivo de ovelhas para travar a matagalização. Os prados de
      braquipódio e peucédano-oficinal—reduto exclusivo em França—e os caminhos arenosos abrigam sardões,
      abelhas-solitárias, gafanhotos e aranhas.
    wildlife: >-
      As arribas no verão encenam um espetáculo grandioso. No leixão da Fauconnière e nas escarpas que se
      desdobram sob o olhar dos visitantes nidificam o
      [corvo-marinho-de-crista](/especie/phalacrocorax_aristotelis/), o [airo](/especie/uria_aalge/) e, em
      patamares inferiores, a [gaivota-tridáctila](/especie/rissa_tridactyla/). A eles somam-se 28 a 31 casais
      de [torda-mergulheira](/especie/alca_torda/), o [fulmar-glacial](/especie/fulmarus_glacialis/) disperso
      pelas fissuras e gaivotas nas ilhotas costeiras circundantes.


      O cabo pulsa ao ritmo do ano. Na primavera chegam as aves marinhas pelágicas e despontam orquídeas
      bravias. No final do estio desabrocha a genciana-dos-pauis. No inverno a baía de la Fresnaye acolhe
      patos e limícolas setentrionais. A charneca constitui igualmente corredor migratório de passeriformes;
      desde meados do verão de 2019 observa-se um casal de
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/), o primeiro registo confirmado no
      departamento.
    visit: >-
      A caminhada pedestre é a forma soberana de exploração. O trilho litoral GR 34 circunda o promontório
      entre urzes e tojos. O Grand Site é igualmente cruzado pela Vélomaritime, secção francesa da rota
      ciclável europeia EuroVelo 4. Os trilhos de arriba são exclusivamente pedonais.


      O acesso rodoviário faz-se pelas vias costeiras: a partir de leste passando pelo Fort La Latte, ou de
      oeste desde Sables-d'Or-les-Pins. Em transportes públicos, de Saint-Brieuc a linha 2 da BreizhGo serve
      Erquy e Plévenon admitindo bicicletas. O acesso ao farol encontra-se adaptado a mobilidade reduzida.
    history: >-
      O vetusto farol de granito, denominado torre Vauban, foi edificado em 1701 sob o reinado de Luís XIV. Na
      Segunda Guerra Mundial o cabo acolheu uma base de radar naval alemã; fortins de betão permanecem
      dissimulados no tojo servindo de abrigo a morcegos. Uma controversa tentativa camarária de abrir uma
      estrada costeira foi embargada pela mobilização cívica e a área restaurada.


      O cabo encontra-se classificado como sítio natural desde 1967 pelo valor das suas charnecas e colónias
      avícolas. As charnecas e águas marinhas integram a rede Natura 2000 de Erquy a Saint-Cast-le-Guildo; em
      setembro de 2019 o conjunto dos cabos de Erquy e Fréhel foi distinguido como décimo nono Grand Site de
      France, registando mais de dois milhões de visitantes anuais.
    before: >-
      Circula imperativamente nos trilhos balizados: os atalhos aceleram a erosão das arribas e pisoteiam
      espécies raras. Conduz os cães sempre presos por trela. É estritamente proibido acender fogueiras,
      acampar livremente ou pernoitar em autocaravanas no sítio classificado. Em caso de avistamento de
      golfinhos no mar, respeita as distâncias de segurança.
    around: >-
      No extremo poente da Bretanha, a [Pointe du Raz](/lugar/pointe-du-raz-en-cap-sizun/) partilha
      fulmar-glacial, gralha-de-bico-vermelho e falcão-peregrino. As
      [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), [Marwick Head](/lugar/marwick-head/) e
      [Hornstrandir](/lugar/hornstrandir/) partilham colónias de tordas-mergulheiras e airos.
