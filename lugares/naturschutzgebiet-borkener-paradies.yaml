texto:
  es:
    intro: >-
      Hay bosques que nacieron del abandono y otros que nacieron del hambre de los animales. El Borkener
      Paradies es de los segundos. Durante siglos, vacas y caballos, y antes también cerdos y cabras, pastaron
      entre los árboles de un antiguo bosque aluvial del Ems, y lo convirtieron en un paisaje de parque
      abierto, con robles de copa ancha y claros de arena. Hoy, al noroeste de Meppen, en la Baja Sajonia,
      queda un rincón de unas 30 hectáreas rodeado por un brazo viejo del río, que conserva ese mundo.
    landscape: >-
      El lugar nació por la mano del hombre: siglos de pastoreo del bosque con ganado. Eso explica un paisaje
      que no se parece a un bosque cerrado ni a un prado. El reglamento histórico de 1937 asignaba a la
      reserva 33,35 ha; hoy su presentación oficial redondea la superficie a unas 30. Un brazo viejo del Ems
      la rodea. Al oeste, entre la reserva y ese brazo, hay un bosque aluvial de madera dura, y en el centro
      de la reserva hay un estanque con zonas de aterramiento.


      Dentro, la tierra cambia a trozos. A veces el Ems inunda el bosque aluvial y los pastos, y a veces el
      terreno es arenoso y seco, con pastizal de suelos pobres en nutrientes. Hay robledales viejos de roble
      pedunculado sobre suelos arenosos, que el gestor protege como Hutewald, bosque de pastoreo; hay brezales
      con brezo común y retama sobre dunas interiores; y hay matorrales densos de endrino. Los pastizales
      arenosos aportan flores raras a ese mosaico. En el conjunto del valle del Ems, brazos muertos, prados,
      restos de bosque aluvial, brezales y bosques de pastoreo forman un mosaico de hábitats, y el Borkener
      Paradies es una de sus piezas.
    wildlife: >-
      El pastoreo sigue siendo parte de la conservación. Las [vacas](/especie/bos_taurus/) y los
      [caballos](/especie/equus_caballus/) siguen pastando hoy para mantener el carácter del paisaje, y el
      robledal abierto, con sus árboles retorcidos de copas anchas, es el resultado.


      Los robles de copas anchas y los matorrales densos de endrino muestran dos extremos de ese paisaje
      abierto. En los pastizales secos del Ems y del Hase, la verónica espigada es una planta característica.
      En la reserva también florece Hornklee.
    visit: >-
      Para conocer la reserva y su entorno hay una ruta circular señalizada de 7,20 km, catalogada como muy
      fácil y con una duración orientativa de 1:47 h. Empieza en el punto P34, en Versen; esa distancia
      corresponde al circuito completo desde Versen. En la reserva hay un mirador. La ruta pasa por robles
      viejos, matorrales de endrino, praderas de arena con flores raras y orillas del río, y en ese paseo se
      intuye cómo eran antes grandes partes de Europa central.
    history: >-
      La zona está protegida desde el 31 de julio de 1937. La norma de protección prohíbe salirse de los
      caminos, hacer ruido, encender fuego y tirar basura. La reserva forma parte de la protección del espacio
      FFH 013, asociado al río Ems, y los robles viejos de copa ancha del Borkener Paradies muestran la
      antigua gestión de monte adehesado en la Geest del noroeste.
    before: >-
      Hay que seguir los caminos señalizados y no salirse de ellos. Los perros deben ir con correa para
      ahorrar estrés a los animales salvajes, y no se puede hacer fuego.
    around: >-
      A unos 13 km está la [Reserva Natural de Bargerveen](/lugar/natuurreservaat-bargerveen/).


      Más lejos, el [Parque Natural Lonjsko Polje](/lugar/park-prirode-lonjsko-polje/), la [Reserva Natural De
      Maashorst](/lugar/de-maashorst/), la [Puerta de Güeldres / Corredor del Rin](/lugar/gelderse-poort/) y
      el [Parque Nacional Kiskunság - Estepa de Bugac](/lugar/kiskunsagi---bugac-puszta/) comparten con él las
      vacas y los caballos del pastoreo.
  en:
    intro: >-
      Some woodlands were shaped by neglect, and others by the hunger of domestic animals. The Borkener
      Paradies belongs to the second kind. For centuries, cattle and horses—and earlier also pigs and
      goats—grazed beneath the canopy of an ancient Ems floodplain forest, sculpting an open, park-like
      pasture dotted with broad-crowned oaks and sandy clearings. Today, northwest of Meppen in Lower Saxony,
      a 30-hectare pocket encircled by an old river oxbow preserves that lost world.
    landscape: >-
      This place was forged by human hands: centuries of woodland cattle grazing. That heritage explains a
      landscape that resembles neither a dense forest nor an open meadow. Historical protective regulations
      from 1937 assigned the reserve 33.35 ha; today official descriptions round the area to around 30. An old
      oxbow of the Ems wraps around it. To the west, between the reserve and the oxbow, lies a hardwood
      floodplain forest, while the centre of the reserve features a pond showing siltation succession.


      Inside, the terrain changes in quick succession. At times the Ems inundates the floodplain woods and
      pastures; at other times the ground is sandy and parched, supporting nutrient-poor grassland. There are
      ancient pedunculate oak stands on sandy soils, preserved by managers as Hutewald (wood-pasture); there
      are dwarf-shrub heaths with common heather and broom over inland dunes; and there are dense blackthorn
      thickets. Sandy grasslands contribute rare wildflowers to this mosaic. Across the wider Ems valley,
      oxbows, meadows, alluvial forest remnants, heaths and wood-pastures form an intricate habitat mosaic,
      and the Borkener Paradies is one of its finest gems.
    wildlife: >-
      Grazing remains central to conservation. Domestic cattle ([vacas](/especie/bos_taurus/)) and feral
      horses ([caballos](/especie/equus_caballus/)) still graze here today to maintain the open structure of
      the landscape, producing wide-spreading, gnarled oaks as a direct result.


      Sprawling oaks and dense blackthorn thickets represent two opposite poles of this semi-open country.
      Across dry grasslands of the Ems and Hase, spiked speedwell is a signature plant. Birdsfoot trefoil
      (Hornklee) also blooms abundantly in the reserve.
    visit: >-
      To explore the reserve and its surroundings, a waymarked circular walking trail of 7.20 km is
      signposted, graded as very easy with an approximate walking time of 1:47 h. It starts at point P34 in
      Versen; that distance corresponds to the full circuit from Versen. An observation platform stands within
      the reserve. The trail winds past ancient oaks, blackthorn thickets, sandy wildflower clearings and
      riverbanks, offering an evocative glimpse into the historical face of Central Europe.
    history: >-
      The area has been legally protected since 31 July 1937. Protection rules prohibit leaving marked trails,
      making excessive noise, lighting fires and discarding rubbish. The reserve forms part of the Natura FFH
      013 conservation area along the Ems, with the broad-crowned ancient oaks of the Borkener Paradies
      illustrating historical wood-pasture management across the northwestern Geest.
    before: >-
      Follow the marked trails and do not stray from them. Dogs must be kept on a leash to prevent stress to
      wildlife, and lighting fires is strictly prohibited.
    around: >-
      About 13 km away lies the [Natuurreservaat Bargerveen](/lugar/natuurreservaat-bargerveen/).


      Further afield, [Park prirode Lonjsko polje](/lugar/park-prirode-lonjsko-polje/), [De
      Maashorst](/lugar/de-maashorst/), [Gelderse Poort](/lugar/gelderse-poort/) and [Kiskunsági - Bugac
      Puszta](/lugar/kiskunsagi---bugac-puszta/) share grazing cattle and horses in landscape management.
  fr:
    intro: >-
      Il y a des bois nés de l'abandon et d'autres nés de la faim des animaux. Le Borkener Paradies appartient
      aux seconds. Pendant des siècles, bovins et chevaux—et autrefois aussi porcs et chèvres—ont pâturé sous
      la frondaison d'une ancienne forêt alluviale de l'Ems, façonnant un paysage de parc ouvert, ponctué de
      chênes aux cimes étalées et de clairières sableuses. Aujourd'hui, au nord-ouest de Meppen en Basse-Saxe,
      subsiste une enclave d'environ 30 hectares ceinte par un ancien bras mort de la rivière, préservant ce
      monde d'antan.
    landscape: >-
      Ce lieu est né de la main de l'homme : des siècles de pâturage forestier avec le bétail. Cela explique
      un paysage qui ne ressemble ni à une forêt dense ni à une prairie nue. Le texte de protection historique
      de 1937 attribuait à la réserve 33,35 ha ; aujourd'hui la communication officielle arrondit sa
      superficie à environ 30. Un ancien bras mort de l'Ems l'enveloppe. À l'ouest, entre la réserve et ce
      méandre, s'étend une forêt alluviale de bois dur, tandis qu'au centre de la réserve se trouve une mare
      en voie d'atterrissement.


      À l'intérieur, le sol varie par touches successives. Tantôt l'Ems inonde la forêt alluviale et les
      pâtures, tantôt le sol se fait sableux et sec, couvert d'une herbe rase sur substrat maigre. On y trouve
      de vieux chênes pédonculés sur sables, protégés en tant que Hutewald (bois pastoral) ; des landes à
      callune et genêt sur dunes continentales ; et des fourrés impénétrables de prunelliers. Les pelouses
      sableuses apportent des fleurs rares à cette marqueterie. À l'échelle de la vallée de l'Ems, bras morts,
      prairies, forêts alluviales résiduelles, landes et bois pâturés forment une remarquable mosaïque, et le
      Borkener Paradies en est l'un des joyaux.
    wildlife: >-
      Le pâturage demeure le moteur de la conservation. Les bovins ([vacas](/especie/bos_taurus/)) et les
      chevaux ([caballos](/especie/equus_caballus/)) continuent de paître aujourd'hui pour pérenniser
      l'ouverture du milieu, sculptant ces chênes trapus aux ramures déployées.


      Les chênes majestueux et les buissons denses de prunellier incarnent les deux visages de cette mosaïque
      pastorale. Sur les pelouses sèches de l'Ems et de la Hase, la véronique en épi est une plante
      emblématique. Le lotier corniculé (Hornklee) y fleurit également.
    visit: >-
      Pour découvrir la réserve et ses abords, un circuit balisé de 7,20 km est proposé, classé très facile
      pour une durée indicative de 1:47 h. Il débute au point P34, à Versen ; cette distance correspond à la
      boucle intégrale au départ de Versen. Un observatoire est aménagé au sein de la réserve. Le sentier
      chemine entre chênes séculaires, buissons d'épines, pelouses sableuses à fleurs rares et rives de l'Ems,
      offrant une saisissante vision des paysages anciens d'Europe centrale.
    history: >-
      La zone bénéficie d'une protection légale depuis le 31 juillet 1937. Le décret de protection interdit de
      quitter les chemins, de faire du bruit, d'allumer du feu ou de jeter des détritus. La réserve est
      intégrée au site FFH 013 lié à l'Ems, et ses chênes anciens témoignent de l'ancienne gestion pastorale
      sylvicole du Geest du nord-ouest.
    before: >-
      Suivez strictement les chemins balisés sans vous en écarter. Les chiens doivent être tenus en laisse
      pour épargner tout stress à la faune, et les feux sont rigoureusement proscrits.
    around: >-
      À environ 13 km s'étend le [Natuurreservaat Bargerveen](/lugar/natuurreservaat-bargerveen/).


      Plus loin, le [Park prirode Lonjsko polje](/lugar/park-prirode-lonjsko-polje/), [De
      Maashorst](/lugar/de-maashorst/), le [Gelderse Poort](/lugar/gelderse-poort/) et le [Kiskunsági - Bugac
      Puszta](/lugar/kiskunsagi---bugac-puszta/) partagent bovins et chevaux en pâturage extensif.
  de:
    intro: >-
      Es gibt Wälder, die durch Nutzungsaufgabe entstanden, und solche, die durch den Hunger des Weideviehs
      geformt wurden. Das Borkener Paradies gehört zur zweiten Gruppe. Über Jahrhunderte weideten Rinder und
      Pferde—früher auch Schweine und Ziegen—unter den Bäumen eines alten Ems-Auenwaldes und schufen eine
      parkartige Weidelandschaft mit breitkronigen Eichen und Sandheiden. Heute bewahrt eine rund 30 Hektar
      große, von einer Ems-Altschleife umschlossene Fläche nordwestlich von Meppen im Emsland diese
      historische Kulturlandschaft.
    landscape: >-
      Der Ort entstand durch Menschenhand: Jahrhunderte alte Waldweide mit Vieh. Das erklärt ein
      Landschaftsbild, das weder geschlossenem Wald noch offener Wiese gleicht. Die historische
      Schutzverordnung von 1937 wies dem Gebiet 33,35 ha zu; heute rundet die Verwaltung die Fläche auf etwa
      30 Hektar. Ein alter Emsarm umschließt das Areal. Im Westen erstreckt sich ein Hartholz-Auenwald, im
      Zentrum liegt ein verlandender Kolk.


      Im Inneren wechselt der Boden kleinräumig. Mal überflutet die Ems Auenwald und Weiden, mal ist der
      Sandboden trocken und mager. Hier stehen alte Stieleichen auf sandigen Böden, geschützt als historischer
      Hutewald; Heideflächen mit Besenheide und Ginster bedecken Binnendünen; dichte Schlehengebüsche
      schließen die Ränder ab. Sandtrockenrasen steuern seltene Blütenpflanzen bei. Im gesamten Emstal bilden
      Altarme, Wiesen, Auenwaldreste, Heiden und Hudewälder ein Mosaik, und das Borkener Paradies ist eines
      seiner wertvollsten Teilstücke.
    wildlife: >-
      Beweidung ist das Herzstück des Naturschutzes. Rinder ([vacas](/especie/bos_taurus/)) und Pferde
      ([caballos](/especie/equus_caballus/)) weiden auch heute im Gebiet, um den lichten Charakter zu
      bewahren; die knorrigen, breitkronigen Huteeichen sind das unmittelbare Ergebnis.


      Breitkronige Eichen und dichte Schlehenhecken markieren die Pole dieser offenen Weidelandschaft. Auf den
      Sandtrockenrasen von Ems und Hase ist der Ährige Ehrenpreis eine Leitart. Auch Hornklee blüht im
      Schutzgebiet.
    visit: >-
      Zur Erkundung des Gebiets ist ein 7,20 km langer Rundwanderweg ausgeschildert, als sehr leicht
      eingestuft mit einer Gehzeit von etwa 1:47 h. Er beginnt am Parkplatz P34 in Versen; diese Distanz
      umfasst die gesamte Runde ab Versen. Im Schutzgebiet gibt es einen Aussichtsturm. Der Weg führt vorbei
      an knorrigen Eichen, Schlehenhecken, Sandrasen mit seltenen Pflanzen und Flussufern und lässt erahnen,
      wie weite Teile Mitteleuropas einst aussahen.
    history: >-
      Das Gebiet steht seit dem 31. Juli 1937 unter Naturschutz. Die Verordnung untersagt das Verlassen der
      Wege, Lärm, offenes Feuer und Müllablagerungen. Das Reservat gehört zum FFH-Gebiet 013 an der Ems; die
      alten, breitkronigen Eichen des Borkener Paradieses belegen die historische Hudewaldnutzung der Geest.
    before: >-
      Bleibe auf den ausgewiesenen Pfaden. Hunde sind anzuleinen, um Wildtiere nicht zu beunruhigen, und
      offenes Feuer ist verboten.
    around: >-
      Rund 13 km entfernt liegt das [Natuurreservaat Bargerveen](/lugar/natuurreservaat-bargerveen/).


      Weiter entfernt teilen [Park prirode Lonjsko polje](/lugar/park-prirode-lonjsko-polje/), [De
      Maashorst](/lugar/de-maashorst/), [Gelderse Poort](/lugar/gelderse-poort/) und [Kiskunsági - Bugac
      Puszta](/lugar/kiskunsagi---bugac-puszta/) Weiderinder und Pferde im Naturschutz.
  it:
    intro: >-
      Ci sono boschi nati dall'abbandono e altri scaturiti dalla fame del bestiame. Il Borkener Paradies
      appartiene ai secondi. Per secoli bovini e cavalli—e in passato anche maiali e capre—hanno pascolato tra
      gli alberi di un'antica foresta alluvionale dell'Ems, forgiando un paesaggio a parco aperto con querce
      dalla chioma espansa e radure sabbiose. Oggi, a nord-ovest di Meppen in Bassa Sassonia, un tassello di
      circa 30 ettari racchiuso da un vecchio meandro fluviale conserva intatto quel mondo.
    landscape: >-
      Questo luogo è nato per mano dell'uomo: secoli di pascolo brado nel bosco. Ciò spiega un mosaico che non
      assomiglia né a una fitta foresta né a un prato nudo. Il regolamento storico di tutela del 1937
      assegnava alla riserva 33,35 ha; oggi la documentazione ufficiale arrotonda l'estensione a circa 30
      ettari. Un vecchio braccio dell'Ems la cinge interamente. A ovest, tra la riserva e il meandro, si
      stende un bosco golenale di latifoglie dure, mentre al centro della riserva si trova uno stagno in fase
      di interrimento.


      All'interno il terreno muta rapidamente. A volte l'Ems inonda bosco golenale e pascoli, altre volte il
      suolo è sabbioso e asciutto, popolato da prati magri. Si incontrano querce farnie monumentali su sabbia,
      tutelate come Hutewald (bosco-pascolo); lande di brugo e ginestra su dune continentali; e densi
      cespuglieti di prugnolo. I prati sabbiosi donano fioriture rare a questo mosaico. Nella valle dell'Ems,
      meandri morti, prati, boschi alluvionali e pascoli arborati formano un insieme prezioso di cui il
      Borkener Paradies è parte integrante.
    wildlife: >-
      Il pascolo resta il cardine della tutela. Bovini ([vacas](/especie/bos_taurus/)) e cavalli
      ([caballos](/especie/equus_caballus/)) continuano a pascolare per mantenere aperto il paesaggio,
      plasmando le querce monumentali dalle chiome allargate.


      Le querce secolari e le fitte siepi di prugnolo rappresentano i due estremi di questo territorio aperto.
      Nei pascoli aridi dell'Ems e dell'Hase la veronica spigata è una presenza tipica. Nella riserva fiorisce
      anche il ginestrino (Hornklee).
    visit: >-
      Per esplorare la riserva e i dintorni è segnalato un anello escursionistico di 7,20 km, catalogato come
      molto facile con un tempo indicativo di 1:47 h. Parte dal punto P34 a Versen; tale distanza copre il
      giro completo da Versen. Nella riserva sorge una torretta d'osservazione. Il tracciato si snoda tra
      querce vetuste, roveti di prugnoli, prati sabbiosi e sponde fluviali, restituendo l'immagine storica
      dell'Europa centrale.
    history: >-
      L'area è tutelata dal 31 luglio 1937. La norma vieta di abbandonare i sentieri, fare rumore, accendere
      fuochi e abbandonare rifiuti. La riserva appartiene al sito FFH 013 associato all'Ems, e le grandi
      querce del Borkener Paradies testimoniano l'antica conduzione a bosco pascolato della Geest
      nord-occidentale.
    before: >-
      Segui scrupolosamente i tracciati segnalati. I cani devono essere condotti al guinzaglio per non
      arrecare disturbo alla fauna, ed è vietato accendere fuochi.
    around: >-
      A circa 13 km si trova il [Natuurreservaat Bargerveen](/lugar/natuurreservaat-bargerveen/).


      Più lontano, il [Park prirode Lonjsko polje](/lugar/park-prirode-lonjsko-polje/), [De
      Maashorst](/lugar/de-maashorst/), [Gelderse Poort](/lugar/gelderse-poort/) e il [Kiskunsági - Bugac
      Puszta](/lugar/kiskunsagi---bugac-puszta/) condividono il pascolo di bovini e cavalli.
  pt:
    intro: >-
      Há matas que nasceram do abandono e outras que brotaram da fome dos animais domésticos. O Borkener
      Paradies pertence ao segundo grupo. Durante séculos, vacas e cavalos—e antes também porcos e
      cabras—pastaram sob as copas de uma antiga floresta aluvial do Ems, moldando uma paisagem em parque
      aberto com carvalhos de copa ampla e clareiras arenosas. Hoje, a noroeste de Meppen na Baixa Saxónia,
      subsiste um recanto de cerca de 30 hectares envolvido por um antigo meandro abandonado do rio, que
      preserva esse mundo.
    landscape: >-
      Este local nasceu pela mão do homem: séculos de pastoreio florestal com gado. Isso explica uma
      fisionomia que não se assemelha nem a um bosque fechado nem a um prado desnudado. O regulamento
      histórico de proteção de 1937 atribuía à reserva 33,35 ha; hoje a informação oficial arredonda a área
      para cerca de 30 hectares. Um antigo braço do Ems envolve-a. A oeste, entre a reserva e o meandro,
      desenvolve-se uma mata aluvial de folhosas nobres, enquanto no centro da reserva se encontra um lago em
      assoreamento.


      No interior o terreno alterna rapidamente. Umas vezes o Ems inunda a mata aluvial e as pastagens, outras
      vezes o solo torna-se arenoso e seco, albergando pastagens pobres em nutrientes. Ocorrem
      carvalhos-alvarinhos seculares sobre areias, conservados como Hutewald (bosque de pastoreio); charnecas
      de urze e giesta sobre dunas interiores; e silvados densos de abrunheiro. As pastagens arenosas
      contribuem com flores raras para este mosaico. No vale do Ems, meandros mortos, prados, matas ripícolas
      e bosques de pastoreio compõem um mosaico ecológico, sendo o Borkener Paradies uma das suas peças mais
      notáveis.
    wildlife: >-
      O pastoreio continua a ser a base da conservação. As vacas ([vacas](/especie/bos_taurus/)) e os cavalos
      ([caballos](/especie/equus_caballus/)) continuam a pastar para preservar o carácter aberto da paisagem,
      produzindo carvalhos vetustos de copa aberta e ramos retorcidos.


      Os carvalhos monumentais e os matagais espessos de abrunheiro mostram dois extremos deste habitat
      semiaberto. Nos pastos secos do Ems e do Hase, a verónica-espigada é uma planta emblemática. Na reserva
      floresce também o cornichão (Hornklee).
    visit: >-
      Para descobrir a reserva e os arredores existe um percurso pedestre circular sinalizado de 7,20 km,
      classificado como muito fácil e com uma duração aproximada de 1:47 h. Começa no ponto P34, em Versen;
      essa distância corresponde ao circuito completo a partir de Versen. Na reserva existe um miradouro. O
      trilho serpenteia entre carvalhos vetustos, moitas de abrunheiro, prados arenosos com flores raras e
      margens fluviais, mostrando como era a paisagem histórica da Europa Central.
    history: >-
      A área encontra-se protegida desde 31 de julho de 1937. O regulamento interdita a saída dos trilhos,
      ruído, fogueiras e depósito de lixo. A reserva integra a zona protegida FFH 013 associada ao rio Ems, e
      os seus carvalhos atestam a gestão tradicional de bosque silvopastoril na Geest do noroeste.
    before: >-
      Segue os caminhos assinalados sem sair deles. Os cães têm de andar com trela para evitar perturbar a
      fauna bravia, e é proibido acender fogueiras.
    around: >-
      A cerca de 13 km fica o [Natuurreservaat Bargerveen](/lugar/natuurreservaat-bargerveen/).


      Mais longe, o [Park prirode Lonjsko polje](/lugar/park-prirode-lonjsko-polje/), [De
      Maashorst](/lugar/de-maashorst/), [Gelderse Poort](/lugar/gelderse-poort/) e o [Kiskunsági - Bugac
      Puszta](/lugar/kiskunsagi---bugac-puszta/) partilham vacas e cavalos em pastoreio extensivo.
