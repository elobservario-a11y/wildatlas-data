resumen:
  es: >-
    El reino sagrado del buey almizclero (*Ovibos moschatus*), único lugar de la Europa continental con
    manadas salvajes del gigante de la Edad de Hielo coronado por el Snøhetta (2.286 m).
  en: >-
    The ancestral realm of the muskox (*Ovibos moschatus*), the only place in continental Europe holding wild
    herds of this Ice Age giant crowned by Mount Snøhetta (2,286 m).
  fr: >-
    Le royaume sacré du bœuf musqué (*Ovibos moschatus*), seul site d'Europe continentale abritant des hardes
    sauvages de ce colosse glaciaire couronné par le Snøhetta (2 286 m).
  de: >-
    Das urzeitliche Reich des Moschusochsen (*Ovibos moschatus*), einziger Ort Kontinentaleuropas mit wilden
    Herden dieses Eiszeitgiganten unter dem Snøhetta (2.286 m).
  it: >-
    Il regno primordiale del bue muschiato (*Ovibos moschatus*), unico sito dell'Europa continentale con
    mandrie selvagge di questo gigante glaciale dominato dallo Snøhetta (2.286 m).
  pt: >-
    O domínio primordial do boi-almizclado (*Ovibos moschatus*), único sítio da Europa continental com manadas
    selvagens deste gigante da Idade do Gelo coroado pelo monte Snøhetta (2.286 m).
unico:
  es: >-
    Aquí viven el reno salvaje más puro de Escandinavia y el único buey almizclero de Noruega, y a los dos hay
    que verlos de lejos.
  en: >-
    Here live Scandinavia's purest wild mountain reindeer and Norway's only wild muskoxen, both requiring a
    respectful distance.
  fr: >-
    Ici vivent le renne sauvage le plus pur de Scandinavie et l'unique bœuf musqué de Norvège, tous deux à
    observer à distance respectueuse.
  de: >-
    Hier leben Skandinaviens reinblütigste wilde Berggrenntiere und Norwegens einzige Moschusochsen – beide
    erfordern gebührenden Abstand.
  it: >-
    Qui vivono le renne selvatiche più pure della Scandinavia e l'unico nucleo di buoi muschiati della
    Norvegia, da osservare entrambi a debita distanza.
  pt: >-
    Aqui habitam a rena selvagem mais pura da Escandinávia e os únicos bois-almizclados da Noruega, devendo
    ambos ser contemplados à distância.
observaciones:
  es: >-
    Del 1 de abril al 20 de agosto todos los perros deben ir atados. Y si quieres ver aves o fauna con un
    grupo organizado, la actividad necesita autorización del parque; el órgano gestor recomienda ir con un
    guía autorizado para ver al buey almizclero y reducir el impacto en el entorno.
texto:
  es:
    intro: >-
      Hay un animal en Dovrefjell que no se comporta como los demás. Cuando algo lo amenaza, no huye: ataca.
      Es el buey almizclero, y Noruega solo lo tiene aquí. Lo curioso es que no es el animal más importante
      del lugar. Ese título lo tiene un habitante más tímido, el reno salvaje de Snøhetta y Knutshø, el último
      resto del reno de montaña original de Escandinavia. Dovrefjell-Sunndalsfjella es una montaña entera
      dedicada a cuidar a ese reno, con un macizo que se alza hasta los 2286 m en el Snøhetta.
    landscape: >-
      El parque casi no tiene árboles: se encuentra casi todo por encima del límite del arbolado, en un
      paisaje de alta montaña que se extiende entre Sunndalen, Drivdalen, Dalsida y Torbudalen. Hay montañas
      altas, con el Snøhetta, monte nacional, como hito. Hay valles profundos de paredes casi verticales al
      noroeste y alrededor del Snøhetta, y terreno más tranquilo en el resto, aunque siempre con grandes
      desniveles.


      El clima parte la montaña en dos. Al noroeste es suboceánico y los vientos del oeste traen mal tiempo;
      el macizo del Snøhetta y sus vecinos forman una divisoria meteorológica evidente y, hacia el este y el
      sur, el clima es bastante continental, con la mayor parte de la lluvia llegando del sureste.


      Donde hay caliza el suelo se vuelve generoso: prados de montaña ricos, turberas muy fértiles y una flora
      singular de plantas vasculares. Parte de esa vegetación es anterior a la última glaciación, y hay muchos
      endemismos. Y en las llanuras fluviales, el agua dibuja lagunas en meandro, ríos sinuosos y arenales
      abiertos. La protección alcanza además a formaciones geológicas cuaternarias características del área.
    wildlife: >-
      El reno salvaje es el centro de todo. Los animales de Snøhetta y Knutshø, junto con los de Rondane y
      Sølnkletten, son lo último que queda del reno de montaña original de Escandinavia; tienen poca o ninguna
      mezcla con el reno doméstico y son muy esquivos. En el ecosistema de alta montaña, el
      [reno](/especie/rangifer_tarandus/), el [glotón](/especie/gulo_gulo/), el [zorro
      ártico](/especie/vulpes_lagopus/), el [águila real](/especie/aquila_chrysaetos/) y el cuervo tienen un
      papel clave, y entre las aves grandes también se ve el [halcón gerifalte](/especie/falco_rusticolus/).


      El buey almizclero (moskus) llegó de Groenlandia: los de hoy descienden de animales soltados en
      Dovrefjell entre 1947 y 1953. Dovrefjell es el único lugar de Noruega, y uno de los pocos del mundo,
      donde se puede ver. Para verlo hay dos buenas formas. Con un guía autorizado, en un safari que en verano
      dura unas seis horas e implica andar de 7 a 15 km según dónde esté el animal, y en el que casi seguro se
      le ve. O por tu cuenta por el Moskusstien, un sendero marcado que da buenas posibilidades y evita
      internarse en las zonas del reno salvaje de Stroplsjødalen. Si te cruzas con uno, la distancia de
      seguridad es de 200 m como mínimo: este no huye, ataca.


      El calendario marca el trato con los animales. De febrero a julio, y en algunas especies hasta agosto,
      es la época de cría y de parto y hay que ser especialmente cuidadoso. Si ves un reno, detente y
      retírate; es esquivo, vuelve a huir lejos y pierde un tiempo valioso. El zorro ártico tiene sus
      madrigueras protegidas por ley: no te acerques a menos de 300 m. En invierno, hay poca infraestructura
      en el interior para que los animales gasten la energía en comer y descansar; en el oeste y en los
      pueblos de alrededor hay muchas posibilidades.
    visit: >-
      Hjerkinn, en el punto más alto de la E6 sobre Dovrefjell, entre Dombås y Oppdal, es la puerta más
      cómoda: se llega en coche y en tren, desde allí sale la lanzadera a Snøheim y es el punto de partida del
      mirador Snøhetta, del Besøkssenter Villrein (el centro de visitantes del reno salvaje), de la Kongevegen
      y de la Pilegrimsleden. Kongsvoll es el punto de partida del safari de buey almizclero y del
      Moskusstien, y allí está el jardín botánico alpino de Kongsvoll. Lesja, entre Åndalsnes y Dombås, queda
      entre dos parques: Reinheimen al oeste y Dovrefjell-Sunndalsfjella al este.


      Llegar es sencillo: se puede ir en autobús, tren y coche, y los aeropuertos más cercanos son Gardermoen
      y Værnes. En el parque nacional no se puede ir en bicicleta, salvo contadas excepciones, y la bicicleta
      eléctrica cuenta como transporte motorizado.
    history: >-
      Durante cientos de generaciones se cazó y capturó reno en estas montañas, y todavía se nota. Los restos
      más antiguos que se pueden contemplar hoy tienen más de 1500 años, entre puestos de tiro con arco, fosas
      de captura y cercados. Entre Dombås y Oppdal hay más de 1200 fosas de captura de renos, en una hilera
      casi continua. Antes de que llegaran las obras, Rondane y Dovrefjell-Sunndalsfjella eran un solo
      territorio del reno salvaje, que hacía migraciones anuales entre zonas de pasto.


      El parque nacional se creó en 2002 y se amplió en 2018. Desde entonces incluye casi todo el antiguo
      campo de tiro de Hjerkinn. El objetivo principal de la protección es cuidar el hábitat del reno salvaje
      de Snøhetta y Knutshø, y para eso se ha regulado el tránsito por caminos importantes y se han cerrado o
      trasladado senderos.
    before: >-
      Del 1 de abril al 20 de agosto todos los perros deben ir atados. Y si quieres ver aves o fauna con un
      grupo organizado, la actividad necesita autorización del parque; el órgano gestor recomienda ir con un
      guía autorizado para ver al buey almizclero y reducir el impacto en el entorno.
    around: >-
      El [Parque Nacional de Reinheimen](/lugar/reinheimen-national-park/) está a unos quince kilómetros y el
      [Parque Nacional de Rondane](/lugar/rondane-national-park/), a unos veinte; Rondane comparte con
      Dovrefjell-Sunndalsfjella al reno salvaje original de Escandinavia. Más lejos, el [Parque Nacional de
      Hardangervidda](/lugar/hardangervidda-national-park/) y la [Reserva Natural de
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/) comparten con él el zorro ártico y el reno en la
      alta montaña.
  en:
    intro: >-
      There is a creature in Dovrefjell that behaves unlike any other mountain herbivore. When threatened, it
      does not flee: it forms a defensive wall and charges. This is the muskox, found nowhere else in Norway.
      Yet remarkably, it is not the park's most ecologically vital resident. That status belongs to a far more
      elusive dweller: the wild reindeer of Snøhetta and Knutshø, the last genetically unmixed remnant of
      Scandinavia's ancestral mountain reindeer. Dovrefjell-Sunndalsfjella is an entire mountain wilderness
      dedicated to safeguarding this herd, crowned by the 2286 m summit of Mount Snøhetta.
    landscape: >-
      The park is virtually treeless: almost the entire protected area lies above the subalpine birch limit,
      sprawling across high Arctic-alpine tundra between Sunndalen, Drivdalen, Dalsida, and Torbudalen.
      Precipitous walls drop into deep glacial troughs around north-western Sunndalen and encircling Snøhetta,
      while gentler rolling fells characterise the south and east, albeit with formidable relief throughout.


      The mountain climate is sharply bifurcated. To the north-west, oceanic influences and prevailing
      westerlies bring heavy precipitation; the massif of Snøhetta forms a stark meteorological barrier,
      beyond which the eastern and southern sectors experience a continental climate where most rain arrives
      from the south-east.


      Where limestone bands occur, the mountain soil proves remarkably lush: species-rich alpine calcareous
      grasslands, fertile fens, and a unique vascular flora. Elements of this vegetation pre-date the last
      glacial maximum, fostering high regional endemism. Along the river valleys, braided streams, oxbows, and
      open gravel flats wind through the tundra. Protection also covers quaternary glacial deposits and relict
      permafrost features.
    wildlife: >-
      Wild mountain reindeer are the ecological keystone. The animals of Snøhetta and Knutshø, alongside
      Rondane and Sølnkletten, represent the last wild descendants of prehistoric European reindeer; they have
      virtually no domestic reindeer genes and are exceedingly wary of humans. Across this high-fell
      ecosystem, [reindeer](/especie/rangifer_tarandus/), [wolverine](/especie/gulo_gulo/), [Arctic
      fox](/especie/vulpes_lagopus/), [golden eagle](/especie/aquila_chrysaetos/), and common raven interact
      closely, with [gyrfalcons](/especie/falco_rusticolus/) nesting on high cliffs.


      The muskox (moskus) was brought from north-east Greenland: modern animals descend from individuals
      released across Dovrefjell between 1947 and 1953. Dovrefjell is the sole place in Norway, and one of few
      worldwide, where free-roaming herds can be observed. There are two primary ways to see them: joining an
      authorised guide on a summer walking safari that typically lasts about six hours and covers 7 to 15 km,
      offering near-guaranteed sightings; or hiking independently along the Moskusstien, a signposted trail
      that minimises disturbance to the wild reindeer sanctuary of Stroplsjødalen. If you encounter a muskox,
      maintain a minimum safety distance of 200 m: they do not retreat, they charge.


      Respecting seasonal wildlife calendars is critical. From February through July, and into August for some
      species, herds calve and must be granted peace. If you spot reindeer, stop and retreat immediately;
      disturbance forces them to expend crucial energy fleeing across scree. Arctic fox dens are strictly
      protected by law: never approach within 300 m. Winter backcountry infrastructure is deliberately minimal
      to safeguard energy reserves.
    visit: >-
      Hjerkinn, situated at the high point of the E6 over Dovrefjell between Dombås and Oppdal, is the most
      practical trailhead: reachable by rail and road, it offers shuttle buses to Snøheim and serves as the
      starting point for the Norwegian Wild Reindeer Centre Pavilion (Viewpoint Snøhetta), the Besøkssenter
      Villrein, Kongevegen, and the St. Olav Ways (Pilegrimsleden). Kongsvoll is the departure hub for muskox
      safaris and the Moskusstien, and hosts the historic Kongsvoll Alpine Botanical Garden. Lesja, between
      Åndalsnes and Dombås, sits between two national parks: Reinheimen to the west and
      Dovrefjell-Sunndalsfjella to the east.


      Public transit access is straightforward via train, coach, and road, with regional airports at
      Gardermoen and Værnes. Cycling is prohibited across the national park with very limited track
      exceptions, and e-bikes count as motorised transport.
    history: >-
      Humans have stalked and trapped wild reindeer across these plateaux for hundreds of generations. The
      oldest stone hunting remains visible today exceed 1500 years in age, including mass pitfall trap lines,
      stone archery blinds, and converging drift fences. Between Dombås and Oppdal lie more than 1200 ancient
      pitfall traps in an almost unbroken chain. Before transport corridors severed the plateau, Rondane and
      Dovrefjell-Sunndalsfjella functioned as a single seasonal migration corridor for reindeer.


      The national park was established in 2002 and expanded in 2018, incorporating the extensively restored
      former Hjerkinn military artillery range. The paramount management goal is conserving the undisturbed
      range of the Snøhetta and Knutshø reindeer, leading to seasonal road regulations and the rerouting of
      historic trekking paths.
    before: >-
      From 1 April to 20 August all dogs must be kept strictly on leads. Organised commercial wildlife
      watching groups require advance permission from the park board; joining an accredited local guide is
      strongly recommended to spot muskoxen safely while preventing habitat degradation.
    around: >-
      The [Reinheimen National Park](/lugar/reinheimen-national-park/) lies some fifteen kilometres away and
      [Rondane National Park](/lugar/rondane-national-park/) about twenty; Rondane shares with
      Dovrefjell-Sunndalsfjella the authentic wild mountain reindeer of Scandinavia. Farther across the fells,
      [Hardangervidda National Park](/lugar/hardangervidda-national-park/) and the [Helagsfjället Nature
      Reserve](/lugar/helagsfjallet-nature-reserve/) also share Arctic fox and wild reindeer in high alpine
      habitats.
  fr:
    intro: >-
      Un animal de Dovrefjell ne réagit pas comme les autres herbivores. Menacé, il ne prend pas la fuite : il
      charge. C'est le bœuf musqué, présent en Norvège uniquement ici. Pourtant, le véritable emblème
      écologique du massif est un seigneur bien plus farouche : le renne sauvage de Snøhetta et Knutshø,
      ultime relique intacte du renne montagnard primitif de Scandinavie. Dovrefjell-Sunndalsfjella est un
      sanctuaire d'altitude voué à sa sauvegarde, dominé par les 2286 m du Snøhetta.
    landscape: >-
      Le parc est presque dénué d'arbres : la quasi-totalité du territoire s'élève au-dessus de la limite
      forestière, formant une toundra d'altitude entre Sunndalen, Drivdalen, Dalsida et Torbudalen. Des parois
      quasi verticales plongent dans de profonds canyons au nord-ouest et autour du Snøhetta, tandis qu'à
      l'est et au sud s'étendent de vastes croupes plus douces, aux dénivelés impressionnants.


      Le climat coupe la montagne en deux. Au nord-ouest prévaut un régime subocéanique balayé par les
      tempêtes d'ouest ; le Snøhetta dresse une véritable barrière météorologique, au-delà de laquelle l'est
      et le sud connaissent un climat continental où les pluies arrivent du sud-est.


      Là où affleure le calcaire, le sol nourrit des pelouses alpines généreuses, des tourbières fertiles et
      une flore vasculaire remarquable, dont plusieurs espèces ont survécu aux glaciations. Dans les vallées
      fluviales serpentent méandres, étangs et bancs de graviers. La protection englobe également les dépôts
      quaternaires glaciaires typiques du haut plateau.
    wildlife: >-
      Le renne sauvage est la clé de voûte de l'écosystème. Les populations de Snøhetta et Knutshø, avec
      celles de Rondane et Sølnkletten, constituent les derniers rennes montagnards purs d'Europe du Nord,
      sans métissage domestique et très farouches. Dans cette toundra d'altitude, le
      [renne](/especie/rangifer_tarandus/), le [glouton](/especie/gulo_gulo/), le [renard
      polaire](/especie/vulpes_lagopus/), l'[aigle royal](/especie/aquila_chrysaetos/) et le grand corbeau
      jouent un rôle capital, rejoints par le [faucon gerfaut](/especie/falco_rusticolus/).


      Le bœuf musqué (moskus) a été réintroduit du Groenland : les hardes actuelles descendent d'animaux
      lâchés sur Dovrefjell entre 1947 et 1953. Dovrefjell est le seul endroit de Norvège où on peut les
      observer à l'état sauvage. Deux options s'offrent au visiteur : un safari guidé qui dure environ six
      heures en été et demande 7 à 15 km de marche selon la position des hardes ; ou l'itinéraire balisé du
      Moskusstien, conçu pour éviter de pénétrer dans le sanctuaire des rennes de Stroplsjødalen. En cas de
      rencontre, la distance de sécurité minimale est de 200 m : le bœuf musqué ne fuit pas, il attaque.


      La quiétude de la faune dicte les saisons. De février à juillet, voire août, s'étend la mise bas des
      rennes et la reproduction des espèces sensibles : si vous apercevez un renne, immobilisez-vous et
      éloignez-vous lentement. Les terriers de renard polaire sont strictement protégés : interdiction
      d'approcher à moins de 300 m. En hiver, les aménagements intérieurs restent réduits au strict minimum
      pour préserver l'énergie vitale des animaux.
    visit: >-
      Hjerkinn, point culminant de la route E6 sur le col de Dovrefjell entre Dombås et Oppdal, est l'accès le
      plus pratique : desservi par le train et la route, il propose une navette vers Snøheim et constitue le
      départ vers le belvédère Snøhetta, le Besøkssenter Villrein, la Kongevegen et la Pilegrimsleden.
      Kongsvoll est le point d'envol des safaris et du Moskusstien, abritant également son jardin botanique
      alpin. Lesja se trouve entre deux parcs : Reinheimen à l'ouest et Dovrefjell-Sunndalsfjella à l'est.


      L'accès se fait facilement en train, car et voiture, les aéroports les plus proches étant Gardermoen et
      Værnes. Le vélo est interdit dans le parc national, hormis rares dérogations, et les vélos électriques
      sont assimilés à des véhicules à moteur.
    history: >-
      Des générations de chasseurs ont traqué le renne sur ces hauts plateaux. Les vestiges les plus anciens
      datent de plus de 1500 ans, entre postes de tir à l'arc, fosses de piégeage et clôtures convergentes.
      Entre Dombås et Oppdal s'alignent plus de 1200 fosses de piégeage en une chaîne continue. Avant les
      infrastructures modernes, Rondane et Dovrefjell-Sunndalsfjella formaient un seul territoire pastoral
      parcouru par les migrations saisonnières du renne.


      Le parc national a été créé en 2002 et agrandi en 2018, intégrant la majeure partie de l'ancien champ de
      tir militaire de Hjerkinn renaturé. La vocation première du parc est la quiétude des rennes de Snøhetta
      et Knutshø, ce qui a entraîné la régulation du trafic et la déviation de sentiers.
    before: >-
      Du 1 avril au 20 août, les chiens doivent être impérativement tenus en laisse. Les groupes organisés de
      photographie ou d'observation de la faune requièrent une autorisation du parc ; il est vivement
      conseillé de faire appel à un guide certifié pour observer le bœuf musqué sans déranger le milieu.
    around: >-
      Le [Parc national de Reinheimen](/lugar/reinheimen-national-park/) se trouve à une quinzaine de
      kilomètres et le [Parc national de Rondane](/lugar/rondane-national-park/) à une vingtaine ; Rondane
      partage avec Dovrefjell-Sunndalsfjella le renne sauvage primitif de Scandinavie. Plus loin, le [Parc
      national de Hardangervidda](/lugar/hardangervidda-national-park/) et la [Réserve naturelle de
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/) partagent le renard polaire et le renne en haute
      montagne.
  de:
    intro: >-
      Ein Tier im Dovrefjell verhält sich ganz anders als gewöhnliche Fjellbewohner. Fühlt es sich bedroht,
      flieht es nicht: Es geht zum Angriff über. Es ist der Moschusochse, den es in Norwegen nur hier gibt.
      Doch der eigentliche ökologische König der Hochebene ist viel scheuer: das wilde Berggrenntier von
      Snøhetta und Knutshø, der letzte unverfälschte Rest des ursprünglichen Wildrentiers Skandinaviens. Das
      Dovrefjell-Sunndalsfjella ist ein ganzes Gebirge zum Schutz dieses Wildrentiers, überragt vom 2286 m
      hohen Snøhetta.
    landscape: >-
      Der Nationalpark ist nahezu baumlos: Fast die gesamte Fläche liegt oberhalb der alpinen Waldgrenze in
      einer hochalpinen Tundrenlandschaft zwischen Sunndalen, Drivdalen, Dalsida und Torbudalen. Nahezu
      senkrechte Trogtalwände stürzen im Nordwesten und rund um den Snøhetta ab, während nach Osten und Süden
      weite Fjellweiten mit gewaltigen Höhenunterschieden dominieren.


      Das Klima teilt die Bergwelt in zwei Zonen. Im Nordwesten herrscht ozeanisches Wetter mit heftigen
      Westwinden; der Snøhetta-Stock bildet eine markante Wetterscheide, hinter der nach Osten und Süden
      kontinentales Klima mit Niederschlägen aus Südost vorherrscht.


      Auf kalkhaltigen Böden gedeiht artenreiche alpine Flora: bunte Bergwiesen, fruchtbare Moore und seltene
      Gefäßpflanzen, die teils die Eiszeiten überdauerten. In den Flussebenen mäandrieren Bäche, Altarme und
      Schotterbänke. Die Unterschutzstellung wahrt zudem charakteristische quartäre Moränenablagerungen und
      Frostmusterböden.
    wildlife: >-
      Das wilde Berggrenntier ist das Herzstück des Parks. Die Herden von Snøhetta und Knutshø bilden zusammen
      mit jenen aus Rondane und Sølnkletten die letzten genetisch reinen Wildrentiere Europas; sie meiden
      jegliche Annäherung an Menschen. Im Hochgebirgsökosystem nehmen [Rentier](/especie/rangifer_tarandus/),
      [Vielfraß](/especie/gulo_gulo/), [Polarfuchs](/especie/vulpes_lagopus/),
      [Steinadler](/especie/aquila_chrysaetos/) und Kolkrabe Schlüsselrollen ein; an Felswänden brütet der
      [Gerfalke](/especie/falco_rusticolus/).


      Der Moschusochse (moskus) stammt ursprünglich aus Grönland: Die heutigen Bestände gehen auf
      Auswilderungen im Dovrefjell zwischen 1947 und 1953 zurück. Dovrefjell ist der einzige Ort Norwegens, an
      dem man diese Eiszeittiere in freier Wildbahn erleben kann. Zwei Wege bieten sich an: eine geführte Tour
      mit autorisiertem Guide, die im Sommer rund sechs Stunden dauert und 7 bis 15 km Wanderstrecke umfasst;
      oder der markierte Moskusstien, der Beobachtungschancen eröffnet, ohne in die Rentierkernzone im
      Stroplsjødalen einzugreifen. Bei Sichtung gilt: mindestens 200 m Sicherheitsabstand halten, da
      Moschusochsen im Ernstfall angreifen.


      Der Schutz der Wildtiere richtet sich nach den Jahreszeiten. Von Februar bis Juli – bei manchen Arten
      bis August – ist Kalb- und Brutzeit: Begegnest du Rentieren, bleibe ruhig stehen und weiche zurück. Die
      Baue der Polarfüchse stehen unter strengem Schutz: Halte mindestens 300 m Abstand. Im Winter wird die
      Infrastruktur im Fjell bewusst minimiert, damit Tiere Energie sparen können.
    visit: >-
      Hjerkinn am Scheitelpunkt der E6 über das Dovrefjell zwischen Dombås und Oppdal ist das bequemste Tor:
      per Bahn und Straße erreichbar, starten hier Pendelbusse nach Snøheim sowie Wanderungen zum Viewpoint
      Snøhetta, zum Besøkssenter Villrein, zur Kongevegen und zum Pilgerweg Pilegrimsleden. Kongsvoll ist
      Ausgangspunkt der Moschusochsensafaris und des Moskusstien mit historischem Alpengarten. Lesja liegt
      strategisch zwischen Reinheimen im Westen und Dovrefjell-Sunndalsfjella im Osten.


      Die Anreise klappt hervorragend per Zug, Bus und Pkw; die nächsten Flughäfen sind Gardermoen und Værnes.
      Radfahren ist im Nationalpark weitestgehend untersagt; E-Bikes gelten rechtlich als Motorfahrzeuge.
    history: >-
      Über hunderte Generationen jagten Menschen Rentiere auf diesen Hochflächen. Die ältesten sichtbaren
      Fanggrubensysteme, Bogenstände und Leitgatter sind über 1500 Jahre alt. Zwischen Dombås und Oppdal
      reihen sich mehr als 1200 Fanggruben zu einer fast lückenlosen Kette. Vor dem Bau moderner Verkehrswege
      bildeten Rondane und Dovrefjell ein zusammenhängendes Wanderrevier des Wildrentiers.


      Der Nationalpark wurde 2002 eingerichtet und 2018 um das renaturierte Militärgelände Hjerkinn erweitert.
      Oberstes Schutzziel ist die Erhaltung des ungestörten Lebensraums der Snøhetta- und Knutshø-Rentiere,
      weshalb Verkehrswege reguliert und Wanderpfade verlegt wurden.
    before: >-
      Vom 1. April bis zum 20. August gilt strikte Leinenpflicht für alle Hunde. Gewerbliche
      Tierbeobachtungsgruppen benötigen eine Genehmigung; die Parkverwaltung empfiehlt dringend autorisierte
      Guides für Moschusochsenbeobachtungen, um Störungen zu minimieren.
    around: >-
      Der [Nationalpark Reinheimen](/lugar/reinheimen-national-park/) liegt rund fünfzehn Kilometer entfernt,
      der [Nationalpark Rondane](/lugar/rondane-national-park/) etwa zwanzig; Rondane teilt mit
      Dovrefjell-Sunndalsfjella die ursprünglichen Wildrentiere Skandinaviens. Weiter entfernt teilen auch der
      [Nationalpark Hardangervidda](/lugar/hardangervidda-national-park/) und das [Naturreservat
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/) Polarfuchs und Wildrentier im Hochgebirge.
  it:
    intro: >-
      C'è un animale nel Dovrefjell che non reagisce come gli altri erbivori. Quando si sente minacciato, non
      fugge: carica. È il bue muschiato, presente in tutta la Norvegia soltanto qui. Eppure il vero custode
      ecologico di queste lande è un abitante ben più schivo: la renna selvatica di Snøhetta e Knutshø,
      l'ultimo ceppo puro della renna montana primigenia di Scandinavia. Dovrefjell-Sunndalsfjella è un'intera
      montagna votata alla sua tutela, dominata dai 2286 m del monte Snøhetta.
    landscape: >-
      Il parco è pressoché privo di vegetazione arborea: quasi tutta l'area si colloca sopra il limite delle
      betulle, in una tundra d'alta quota che unisce Sunndalen, Drivdalen, Dalsida e Torbudalen. Pareti
      rocciose quasi verticali precipitano nelle valli a nord-ovest e attorno allo Snøhetta, mentre altopiani
      più ondulati ma con imponenti dislivelli si allungano verso est e sud.


      Il clima divide il massiccio in due versanti. A nord-ovest prevalgono correnti suboceaniche con venti
      umidi da ovest; lo Snøhetta costituisce una netta barriera spartiacque, oltre la quale a est e a sud il
      clima diviene marcatamente continentale, con precipitazioni provenienti da sud-est.


      Dove affiorano lenti calcaree il suolo sprigiona una ricchezza straordinaria: pascoli alpini ubertosi,
      torbiere fertili e una flora vascolare con elementi risalenti a prima dell'ultima glaciazione e ricca di
      endemismi. Nei fondovalle le acque disegnano meandri, lanche e greti ghiaiosi. La tutela include le
      peculiari formazioni glaciali quaternarie del comprensorio.
    wildlife: >-
      La renna selvatica è il perno dell'ecosistema. Gli esemplari di Snøhetta e Knutshø, assieme a quelli di
      Rondane e Sølnkletten, rappresentano gli ultimi discendenti puri delle renne montane autoctone europee,
      privi di ibridazione domestica e diffidenti verso l'uomo. Sulla tundra montana, la
      [renna](/especie/rangifer_tarandus/), il [ghiottone](/especie/gulo_gulo/), la [volpe
      artica](/especie/vulpes_lagopus/), l'[aquila reale](/especie/aquila_chrysaetos/) e il corvo imperiale
      svolgono ruoli cardine, affiancati dal [falco girfalco](/especie/falco_rusticolus/).


      Il bue muschiato (moskus) giunse dalla Groenlandia: i branchi attuali discendono da rilasci effettuati
      nel Dovrefjell tra il 1947 e il 1953. Il Dovrefjell è l'unico territorio norvegese in cui vive allo
      stato brado. Per avvistarlo esistono due modalità ideali: un safari con guida autorizzata, che d'estate
      impegna circa sei ore e comporta dai 7 ai 15 km di cammino garantendo quasi sempre l'avvistamento;
      oppure in autonomia lungo il sentiero Moskusstien, tracciato per evitare l'intrusione nell'area di
      rifugio delle renne di Stroplsjødalen. Se ne incroci uno, mantieni almeno 200 m di distanza: non scappa,
      carica.


      Il ciclo biologico detta le regole. Da febbraio a luglio, e per certe specie fino ad agosto, cade il
      periodo di parto e cova: se avvisti una renna fermati e allontanati con discrezione. Le tane della volpe
      artica sono tutelate per legge: divieto assoluto di avvicinamento a meno di 300 m. In inverno le
      infrastrutture interne restano ridotte al minimo per preservare l'energia degli animali.
    visit: >-
      Hjerkinn, sul valico della E6 tra Dombås e Oppdal, è la porta d'accesso d'elezione: raggiungibile in
      treno e in auto, offre la navetta per Snøheim ed è il punto di partenza per il Viewpoint Snøhetta, il
      Besøkssenter Villrein, la Kongevegen e la Pilegrimsleden. Kongsvoll è la base dei safari e del
      Moskusstien, e ospita il giardino botanico alpino. Lesja sorge tra due parchi: Reinheimen a ovest e
      Dovrefjell-Sunndalsfjella a est.


      L'accesso coi mezzi pubblici è pratico in treno e pullman; gli scali aerei più vicini sono Gardermoen e
      Værnes. L'uso della bicicletta nel parco è vietato salvo rare eccezioni, e le e-bike sono equiparate a
      veicoli a motore.
    history: >-
      Per centinaia di generazioni l'uomo ha cacciato la renna su queste vette. I reperti più antichi visibili
      superano i 1500 anni, tra appostamenti per arcieri, buche di cattura e recinti a imbuto. Tra Dombås e
      Oppdal si contano oltre 1200 fosse di cattura allineate in una teoria quasi ininterrotta. Prima delle
      vie di comunicazione moderne, Rondane e Dovrefjell formavano un unico territorio montano solcato dalle
      migrazioni delle renne.


      Il parco nazionale è nato nel 2002 ed è stato ampliato nel 2018, inglobando il poligono militare di
      Hjerkinn interamente bonificato. Scopo prioritario è difendere la quiete delle renne di Snøhetta e
      Knutshø, regolamentando il traffico viario e deviando i tracciati escursionistici.
    before: >-
      Dal 1 aprile al 20 agosto i cani vanno tenuti obbligatoriamente al guinzaglio. Le uscite organizzate di
      fotografia o birdwatching necessitano di autorizzazione; si raccomanda l'affiancamento a guide
      autorizzate per osservare i buoi muschiati limitando l'impatto ambientale.
    around: >-
      Il [Parco Nazionale di Reinheimen](/lugar/reinheimen-national-park/) dista circa quindici chilometri e
      il [Parco Nazionale di Rondane](/lugar/rondane-national-park/) circa venti; Rondane condivide con
      Dovrefjell-Sunndalsfjella le autentiche renne selvatiche di montagna della Scandinavia. Più lontano, il
      [Parco Nazionale di Hardangervidda](/lugar/hardangervidda-national-park/) e la [Riserva Naturale di
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/) condividono volpe artica e renna negli ambienti
      sommitali.
  pt:
    intro: >-
      Há um habitante em Dovrefjell que não reage como os outros herbívoros da montanha. Sentindo-se ameaçado,
      não foge: parte para o ataque. É o boi-almizclado, que na Noruega apenas existe aqui. Todavia, a espécie
      mais relevante do parque é bem mais discreta: a rena selvagem de Snøhetta e Knutshø, a derradeira
      linhagem intacta da rena alpina ancestral da Escandinávia. Dovrefjell-Sunndalsfjella é um maciço inteiro
      votado à sua preservação, culminando nos 2286 m do monte Snøhetta.
    landscape: >-
      O parque é quase desprovido de árvores: praticamente toda a área fica acima da linha do arvoredo, numa
      paisagem de tundra alpina entre Sunndalen, Drivdalen, Dalsida e Torbudalen. Vertentes alcantiladas
      mergulham em vales profundos a noroeste e em redor do Snøhetta, enquanto a leste e a sul dominam
      planaltos mais suaves, embora com fortes desníveis.


      O clima reparte a montanha em dois regimes. A noroeste predomina a influência suboceânica com ventos
      tempestuosos de oeste; o maciço do Snøhetta ergue uma divisória meteorológica evidente, a partir da qual
      o clima para leste e sul se torna marcadamente continental, com a chuva a provir de sudeste.


      Nas zonas de calcário o solo torna-se generoso: pastagens alpinas luxuriantes, turfeiras férteis e uma
      flora vascular singular com plantas que sobreviveram à última era glaciar e múltiplos endemismos. Nos
      vales fluviais, as águas desenham meandros, lagoas e bancos de cascalho. A classificação protege ainda
      formações geológicas quaternárias de relevo.
    wildlife: >-
      A rena selvagem comanda a vida no parque. Os animais de Snøhetta e Knutshø, em conjunto com os de
      Rondane e Sølnkletten, são os últimos remanescentes puros da rena montesa europeia, sem cruzamentos
      domésticos e de grande desconfiança face ao ser humano. Neste ecossistema alpino, a
      [rena](/especie/rangifer_tarandus/), o [glutão](/especie/gulo_gulo/), a
      [raposa-do-ártico](/especie/vulpes_lagopus/), a [águia-real](/especie/aquila_chrysaetos/) e o corvo
      desempenham funções basilares, com o [falcão-gerifalte](/especie/falco_rusticolus/) a nidificar nas
      escarpas.


      O boi-almizclado (moskus) foi introduzido da Gronelândia: os rebanhos atuais descendem de animais soltos
      em Dovrefjell entre 1947 e 1953. Dovrefjell é o único local na Noruega onde vagueia em liberdade. Para o
      avistar há duas boas vias: acompanhar um guia credenciado num safari que no verão dura cerca de seis
      horas e implica 7 a 15 km de caminhada, garantindo observação quase certa; ou caminhar no percurso
      balizado do Moskusstien, desenhado para evitar intrusões no santuário das renas de Stroplsjødalen. Ao
      cruzar-te com um, mantém pelo menos 200 m de distância de segurança: ele não foge, ataca.


      O calendário zoológico é rigoroso. De fevereiro a julho, e em algumas espécies até agosto, decorre o
      período de partos e crias: se vires uma rena, detém-te e recua de imediato. As tocas da raposa-do-ártico
      estão protegidas por lei: nunca te aproximes a menos de 300 m. No inverno a infraestrutura no interior é
      mínima para que os animais poupem energia vital.
    visit: >-
      Hjerkinn, no ponto mais elevado da estrada E6 sobre Dovrefjell entre Dombås e Oppdal, é o acesso mais
      cómodo: acessível de comboio e automóvel, daí parte o autocarro para Snøheim e começam as rotas para o
      miradouro Viewpoint Snøhetta, o Besøkssenter Villrein, a Kongevegen e a Pilegrimsleden. Kongsvoll é a
      base dos safaris e do Moskusstien, acolhendo o jardim botânico alpino histórico. Lesja fica entre dois
      parques: Reinheimen a oeste e Dovrefjell-Sunndalsfjella a leste.


      A deslocação é simples por comboio, autocarro ou carro, ficando os aeroportos de Gardermoen e Værnes a
      curta distância. É proibido circular de bicicleta no parque, salvo raras exceções balizadas, e as
      bicicletas elétricas contam como transporte motorizado.
    history: >-
      Ao longo de centenas de gerações caçou-se a rena nestas serras. Os vestígios mais antigos visíveis
      superam 1500 anos, entre abrigos de tiro com arco, fossas de captura e paliçadas. Entre Dombås e Oppdal
      alinham-se mais de 1200 covas de caça em fiada quase contínua. Antes das vias de transporte modernas,
      Rondane e Dovrefjell formavam um único território pastoril atravessado pelas migrações das renas.


      O parque nacional foi criado em 2002 e ampliado em 2018, integrando o antigo campo de tiro militar de
      Hjerkinn inteiramente renaturado. O desiderato primeiro é a salvaguarda do habitat das renas de Snøhetta
      e Knutshø, regulando-se o tráfego viário e desviando trilhos pedestres.
    before: >-
      De 1 de abril a 20 de agosto os cães devem andar obrigatoriamente presos por trela. As iniciativas
      comerciais organizadas de observação de fauna exigem autorização; recomenda-se vivamente recorrer a
      guias autorizados para avistar bois-almizclados com segurança e sem perturbar o meio.
    around: >-
      O [Parque Nacional de Reinheimen](/lugar/reinheimen-national-park/) dista cerca de quinze quilómetros e
      o [Parque Nacional de Rondane](/lugar/rondane-national-park/) cerca de vinte; Rondane partilha com
      Dovrefjell-Sunndalsfjella a rena selvagem autóctone da Escandinávia. Mais longe, o [Parque Nacional de
      Hardangervidda](/lugar/hardangervidda-national-park/) e a [Reserva Natural de
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/) partilham a raposa-do-ártico e a rena em ambientes
      de alta montanha.
