resumen:
  es: >-
    Reserva de la Biosfera Transfronteriza con Alemania caracterizada por densos bosques sobre acantilados de
    arenisca rosa y castillos medievales en ruinas.
  en: >-
    A cross-border Biosphere Reserve shared with Germany, characterised by dense woodlands over pink sandstone
    cliffs and ruined medieval castles.
  fr: >-
    Réserve de biosphère transfrontalière avec l’Allemagne, caractérisée par des forêts denses sur falaises de
    grès rose et des châteaux médiévaux en ruines.
  de: >-
    Grenzüberschreitendes Biosphärenreservat mit Deutschland, geprägt von dichten Wäldern auf
    Buntsandsteinfelsen und mittelalterlichen Burgruinen.
  it: >-
    Riserva della Biosfera transfrontaliera con la Germania caratterizzata da fitti boschi su falesie di
    arenaria rosa e castelli medievali in rovina.
  pt: >-
    Reserva da Biosfera Transfronteiriça com a Alemanha, caracterizada por florestas densas sobre escarpas de
    arenito rosa e castelos medievais em ruínas.
unico:
  es: >-
    Un bosque sin fronteras sobre arenisca rosa donde el lince ha vuelto a cruzar de Alemania a Francia y a
    criar.
  en: >-
    A borderless forest on pink sandstone where the lynx has once again crossed from Germany into France and
    bred.
  fr: >-
    Une forêt sans frontières sur grès rose où le lynx a recommencé à franchir la frontière depuis l’Allemagne
    vers la France et à s’y reproduire.
  de: >-
    Ein grenzenloser Wald auf Buntsandstein, in dem der Luchs wieder von Deutschland nach Frankreich gewandert
    ist und Junge großzieht.
  it: >-
    Una foresta senza confini su arenaria rosa dove la lince è tornata ad attraversare dalla Germania alla
    Francia e a riprodursi.
  pt: >-
    Uma floresta sem fronteiras sobre arenito rosa onde o lince voltou a cruzar da Alemanha para França e a
    reproduzir-se.
observaciones:
  es: >-
    Prepara el terreno: el sendero natural de Loosthal cruza un sitio Natura 2000 y ambientes protegidos, así
    que mantente en el camino y respeta lo que el parque pide.
texto:
  es:
    intro: >-
      Pese al nombre, los Vosgos del Norte no están en el departamento de los Vosgos ni se centran en el
      macizo vosgiano, cuyas cumbres quedan a varias decenas de kilómetros al sur: solo ocupan su periferia.
      Lo que tienen es un bosque. Un 65 % del parque, 83.500 hectáreas, está cubierto de árboles, y se
      prolonga por el lado alemán con el Pfälzerwald hasta formar una unidad forestal de unos 2500 km²,
      integrada en una reserva de biosfera transfronteriza de la UNESCO. El parque natural regional se creó el
      30 de diciembre de 1975.
    landscape: >-
      El subsuelo es sobre todo arenisca, y el agua la ha ido esculpiendo en valles encajados, peñascos y
      depresiones. De ella son los castillos: 35 fortalezas medievales sobre espolones de arenisca, 27 en el
      Bajo Rin y 8 en el Mosela, además de dos castillos renacentistas. Sobre esa arenisca crecen desde hace
      milenios hayedos, robledales albares y pinares silvestres, y el parque suma hayedos, robledales,
      alisedas y pinares sobre turba y sobre arenisca. El bosque se reparte así: un 45 % de frondosas, un 30 %
      de resinosas y un 25 % mixto.


      El paisaje se organiza en tres unidades: el piedemonte al este, el bosque en el centro y la meseta
      lorenesa al oeste. En los espacios abiertos hay céspedes arenosos y calcáreos, landas y huertos
      tradicionales con orquídeas, genciana, alondras, lechuzas y abubillas.
    wildlife: >-
      El parque alberga ciervos, [linces](/especie/lynx_lynx/), murciélagos y algunos lobos, y entre las aves,
      pitos, [cigüeñas](/especie/ciconia_ciconia/), [búhos reales](/especie/bubo_bubo/), [halcones
      peregrinos](/especie/falco_peregrinus/) y [mochuelos chicos](/especie/glaucidium_passerinum/). El lince
      es la historia que más se sigue, y se cuenta más abajo.


      En las rocas y ruinas hay otra vida. Las paredes, rocas, subterráneos y desvanes de los castillos
      albergan cuervos grandes, grajillas, cernícalos y a veces el halcón peregrino, además de murciélagos
      como la pipistrela común, el nóctulo común y la barbastela. Entre los bloques de roca bajo los
      acantilados de arenisca puede verse la culebra lisa. Y en las turberas de esfagnos de la reserva de los
      rochers et tourbières du pays de Bitche crece una flora particular, con la elegante orquídea epipactis
      de los pantanos.
    visit: >-
      Hay 2.600 km de itinerarios balizados a pie, a caballo, en BTT o en bicicleta, 1.700 de ellos mantenidos
      por el Club vosgien. El sitio RandoVosgesduNord.fr reúne unos cincuenta circuitos a pie, algunos por el
      GR53, y varias vueltas en BTT y bicicleta, con ficha, GPX y puntos de interés.


      Si buscas un sendero para entender el parque, empieza por el sendero natural de Loosthal. Cruza el sitio
      Natura 2000 de los Vosgos del Norte entre La Petite-Pierre y Neuwiller-lès-Saverne, tiene cuatro
      kilómetros y veintiséis estaciones temáticas centradas en la ecología local, y su guía se ofrece en
      francés, inglés y alemán. El parque pide respeto en un recorrido que cruza ambientes naturales raros y
      protegidos.


      Para entender el agua, la Maison de l'Eau et de la Rivière, en Frohmuhl, junto al estanque de
      Donnenbach, es un centro de educación en la naturaleza dedicado al agua, los medios acuáticos, el bosque
      y la biodiversidad. Está en un cruce de muchos senderos, entre ellos el sendero René Char.
    history: >-
      El bosque no entiende de fronteras, y el lince tampoco. Entre 2016 y 2020 se soltaron veinte linces, 12
      hembras y 8 machos, en el Pfälzerwald alemán, procedentes de Suiza y Eslovaquia. Lycka, una hembra
      soltada en 2020, pasó rápido al lado francés, se instaló en los Vosgos del Norte y crió en 2021 y en
      2022. Hoy viven unos siete u ocho linces del proyecto alemán en el macizo, sobre todo en los Vosgos del
      Norte, y al menos cuatro han llegado a los Vosgos centrales o a las Hautes Vosges. El Pfälzerwald y los
      Vosgos del Norte forman una sola unidad forestal.
    before: >-
      Prepara el terreno: el sendero natural de Loosthal cruza un sitio Natura 2000 y ambientes protegidos,
      así que mantente en el camino y respeta lo que el parque pide.
    around: >-
      A 3 km, el [Altschlossfelsen - Pfälzerwald](/lugar/altschlossfelsen---pfalzerwald/) es la otra mitad de
      esta unidad forestal, ya en el lado alemán.
  en:
    intro: >-
      Despite its name, the Northern Vosges are not located in the Vosges department nor centred on the Vosges
      massif itself, whose high peaks lie several dozen kilometres to the south: they occupy only its northern
      fringe. What they do have is woodland. About 65% of the park, 83,500 hectares, is blanketed in trees and
      extends into Germany with the Pfälzerwald to form a continuous forest unit of some 2500 km², designated
      as a UNESCO cross-border biosphere reserve. The regional nature park was established on 30 December
      1975.
    landscape: >-
      The bedrock is predominantly sandstone, sculpted by water into deep-set valleys, crags and hollows. The
      castles are built from it: 35 medieval strongholds set upon sandstone promontories, 27 in Bas-Rhin and 8
      in Moselle, alongside two Renaissance châteaux. Beechwoods, sessile oakwoods and Scots pine forests have
      grown on this sandstone for millennia, and the park encompasses beeches, oaks, alder groves and pine
      stands on peat and on sandstone. The forest breaks down into 45% broadleaf species, 30% conifers and 25%
      mixed stands.


      The landscape is structured into three units: the piedmont in the east, the woodland heart in the centre
      and the Lorraine plateau to the west. Across open areas lie sandy and calcareous grasslands, heathlands
      and traditional orchards hosting orchids, gentians, skylarks, barn owls and hoopoes.
    wildlife: >-
      The park is home to red deer, [lynx](/especie/lynx_lynx/), bats and a few wolves, with birdlife
      featuring woodpeckers, [white storks](/especie/ciconia_ciconia/), [eagle owls](/especie/bubo_bubo/),
      [peregrine falcons](/especie/falco_peregrinus/) and [pygmy owls](/especie/glaucidium_passerinum/). The
      lynx is the most closely followed conservation story, recounted below.


      Another world of life inhabits the rocks and ruins. The walls, crags, subterranean vaults and lofts of
      the castles harbour ravens, jackdaws, kestrels and occasionally peregrine falcons, together with bats
      such as the common pipistrelle, common noctule and barbastelle. Smooth snakes may be spotted among rock
      boulders beneath the sandstone escarpments. In the sphagnum bogs of the Rochers et tourbières du pays de
      Bitche reserve thrives a distinctive flora, including the graceful marsh helleborine orchid.
    visit: >-
      There are 2,600 km of waymarked routes for walking, horse riding, mountain biking and cycling, 1,700 of
      which are maintained by the Club vosgien. The website RandoVosgesduNord.fr brings together around fifty
      walking circuits, some following the GR53, alongside several mountain bike and road cycling loops,
      complete with route descriptions, GPX tracks and points of interest.


      If you are looking for a trail to grasp the essence of the park, begin with the Loosthal nature trail.
      It traverses the Northern Vosges Natura 2000 site between La Petite-Pierre and Neuwiller-lès-Saverne,
      spans four kilometres with twenty-six interpretive stations focused on local ecology, and its guide
      leaflet is available in French, English and German. The park asks you to show respect along a walk that
      crosses rare and protected natural habitats.


      To discover water heritage, the Maison de l'Eau et de la Rivière in Frohmuhl, beside the Donnenbach
      pond, is an environmental education centre dedicated to water, aquatic ecosystems, woodland and
      biodiversity. It sits at the intersection of numerous trails, including the René Char trail.
    history: >-
      The forest knows no borders, and neither does the lynx. Between 2016 and 2020, twenty lynx, 12 females
      and 8 males, were released into the German Pfälzerwald, originating from Switzerland and Slovakia.
      Lycka, a female released in 2020, quickly crossed over to the French side, settled in the Northern
      Vosges and bred in 2021 and in 2022. Today, around seven or eight lynx from the German project live in
      the massif, mainly in the Northern Vosges, and at least four have reached the central Vosges or the High
      Vosges. The Pfälzerwald and the Northern Vosges form a single continuous woodland unit.
    before: >-
      Prepare your outing: the Loosthal nature trail crosses a Natura 2000 site and protected environments, so
      keep to marked paths and observe the guidelines requested by the park.
    around: >-
      At 3 km, the [Altschlossfelsen - Pfälzerwald](/lugar/altschlossfelsen---pfalzerwald/) represents the
      other half of this forest unit, across on the German side.
  fr:
    intro: >-
      Malgré son nom, les Vosges du Nord ne se trouvent pas dans le département des Vosges et ne sont pas
      centrées sur le massif vosgien, dont les hauts sommets s’élèvent à plusieurs dizaines de kilomètres plus
      au sud : elles n’en occupent que la frange septentrionale. Leur véritable richesse, c’est la forêt.
      Environ 65 % du parc, soit 83 500 hectares, est couvert d’arbres et se prolonge côté allemand par le
      Pfälzerwald pour constituer un massif forestier d’environ 2500 km², intégré dans une réserve de
      biosphère transfrontalière de l’UNESCO. Le parc naturel régional a été créé le 30 décembre 1975.
    landscape: >-
      Le sous-sol est essentiellement constitué de grès, que l’eau a sculpté en vallées encaissées, rochers
      ruiniformes et dépressions. Les châteaux sont issus de cette roche : 35 forteresses médiévales bâties
      sur des éperons de grès, 27 dans le Bas-Rhin et 8 en Moselle, sans oublier deux châteaux Renaissance.
      Sur ce grès prospèrent depuis des millénaires des hêtraies, des chênaies sessiliflores et des pinèdes
      sylvestres, et le parc rassemble des hêtraies, chênaies, aulnaies et pinèdes sur tourbe et sur grès. La
      forêt se compose de 45 % de feuillus, 30 % de résineux et 25 % de peuplements mixtes.


      Le paysage s’articule en trois entités : le piémont à l’est, le cœur forestier au centre et le plateau
      lorrain à l’ouest. Dans les espaces ouverts s’étendent des pelouses sableuses et calcaires, des landes
      et des vergers traditionnels abritant orchidées, gentianes, alouettes, chouettes effraies et pupes.
    wildlife: >-
      Le parc accueille des cerfs, des [lynx](/especie/lynx_lynx/), des chauves-souris et quelques loups,
      ainsi que des oiseaux tels que pics, [cigognes](/especie/ciconia_ciconia/),
      [grands-ducs](/especie/bubo_bubo/), [faucons pèlerins](/especie/falco_peregrinus/) et [chevêchettes
      d'Europe](/especie/glaucidium_passerinum/). Le lynx constitue le feuilleton naturaliste le plus suivi,
      détaillé plus bas.


      Sur les rochers et dans les ruines s’épanouit une autre vie. Les murailles, parois rocheuses,
      souterrains et combles des châteaux servent d’abri aux grands corbeaux, choucas des tours, faucons
      crécerelles et parfois au faucon pèlerin, ainsi qu’à des chauves-souris comme la pipistrelle commune, la
      noctule commune et la barbastelle. Parmi les éboulis au pied des falaises de grès, on peut observer la
      coronelle lisse. Et dans les tourbières à sphaignes de la réserve des rochers et tourbières du pays de
      Bitche se développe une flore remarquable, avec l’élégante épipactis des marais.
    visit: >-
      Le territoire propose 2 600 km d’itinéraires balisés pour la randonnée à pied, à cheval, à VTT ou à
      vélo, dont 1 700 entretenus par le Club vosgien. Le site RandoVosgesduNord.fr réunit une cinquantaine de
      circuits pédestres, dont certains empruntent le GR53, ainsi que plusieurs boucles à VTT et à vélo de
      route, avec fiches descriptives, traces GPX et points d’intérêt.


      Pour une première immersion révélant l’esprit du parc, commencez par le sentier nature du Loosthal. Il
      traverse le site Natura 2000 des Vosges du Nord entre La Petite-Pierre et Neuwiller-lès-Saverne, s’étend
      sur quatre kilomètres jalonnés de vingt-six stations thématiques dédiées à l’écologie locale, et son
      livret-guide est disponible en français, anglais et allemand. Le parc invite à la plus grande
      délicatesse tout au long d’un tracé qui côtoie des milieux naturels rares et préservés.


      Pour explorer la thématique de l’eau, la Maison de l’Eau et de la Rivière, à Frohmuhl, au bord de
      l’étang de Donnenbach, est un centre d’éducation à la nature dédié à l’eau, aux zones aquatiques, à la
      forêt et à la biodiversité. Elle se situe au croisement de multiples itinéraires, dont le sentier René
      Char.
    history: >-
      La forêt ignore les frontières, et le lynx tout autant. Entre 2016 et 2020, vingt lynx, 12 femelles et 8
      mâles, ont été réintroduits dans le Pfälzerwald allemand depuis la Suisse et la Slovaquie. Lycka, une
      femelle relâchée en 2020, est rapidement passée côté français pour s’établir dans les Vosges du Nord, où
      elle a mis bas en 2021 et en 2022. Aujourd’hui, environ sept ou huit lynx issus du projet allemand
      vivent dans le massif, principalement dans les Vosges du Nord, et au moins quatre ont rejoint les Vosges
      centrales ou les Hautes Vosges. Le Pfälzerwald et les Vosgos du Nord forment un seul et même grand
      massif boisé.
    before: >-
      Préparez votre parcours : le sentier nature du Loosthal traverse un site Natura 2000 et des zones
      protégées sensibles, restez donc bien sur les chemins balisés et respectez les consignes du parc.
    around: >-
      À 3 km, l’[Altschlossfelsen - Pfälzerwald](/lugar/altschlossfelsen---pfalzerwald/) forme la seconde
      moitié de ce massif forestier continu, de l’autre côté de la frontière allemande.
  de:
    intro: >-
      Trotz des Namens liegen die Nordvogesen weder im Departement Vosges noch im Zentrum des eigentlichen
      Vogesenmassivs, dessen hohe Gipfel etliche Dutzend Kilometer weiter südlich aufragen: Sie bilden
      lediglich dessen nördlichen Saum. Was sie auszeichnet, ist der Wald. Rund 65 % des Naturparks, 83.500
      Hektar, sind bewaldet und setzen sich jenseits der Grenze im Pfälzerwald fort, sodass ein geschlossener
      Waldkomplex von rund 2500 km² entsteht, der als grenzüberschreitendes UNESCO-Biosphärenreservat
      anerkannt ist. Der regionale Naturpark wurde am 30. Dezember 1975 gegründet.
    landscape: >-
      Der Untergrund besteht vor allem aus Sandstein, den das Wasser zu engen Tälern, bizarren Felsformationen
      und Kesseln geformt hat. Aus diesem Stein entstanden die Burgen: 35 mittelalterliche Festungen auf
      Sandsteinspornen, 27 im Bas-Rhin und 8 im Departement Moselle, ergänzt um zwei Renaissanceschlösser. Auf
      diesem Sandstein wachsen seit Jahrtausenden Buchen, Traubeneichen und Waldkiefern; der Naturpark vereint
      Buchen-, Eichen-, Erlen- und Kiefernwälder auf Torf- wie auf Sandsteinböden. Die Waldzusammensetzung
      teilt sich auf in 45 % Laubhölzer, 30 % Nadelbäume und 25 % Mischwald.


      Die Landschaft gliedert sich in drei Großräume: das Hügelland im Osten, das Waldherz im Zentrum und die
      lothringische Hochebene im Westen. In den offenen Bereichen breiten sich Sand- und Kalkmagerrasen,
      Heiden sowie traditionelle Streuobstwiesen mit Orchideen, Enzianen, Feldlerchen, Schleiereulen und
      Wiedehopfen aus.
    wildlife: >-
      Im Naturpark leben Hirsche, [Luchse](/especie/lynx_lynx/), Fledermäuse und vereinzelt Wölfe, während
      unter den Vögeln Spechte, [Weißstörche](/especie/ciconia_ciconia/), [Uhus](/especie/bubo_bubo/),
      [Wanderfalken](/especie/falco_peregrinus/) und [Sperlingskäuze](/especie/glaucidium_passerinum/)
      heimisch sind. Die Geschichte des Luchses wird besonders aufmerksam verfolgt und weiter unten
      geschildert.


      Felsen und Ruinen beherbergen eine ganz eigene Lebensgemeinschaft. In den Mauern, Felswänden, Gewölben
      und Dachböden der Burgen nisten Kolkraben, Dohlen, Turmfalken und zuweilen der Wanderfalke, neben
      Fledermausarten wie Zwergfledermaus, Großem Abendsegler und Mopsfledermaus. Im Blockschutt unter den
      Sandsteinwänden lässt sich die Schlingnatter beobachten. In den Torfmooren des Schutzgebiets Rochers et
      tourbières du pays de Bitche gedeiht eine spezialisierte Flora, darunter die zarte Sumpf-Stendelwurz.
    visit: >-
      Es gibt 2.600 km markierte Wege zum Wandern, Reiten, Mountainbiken und Radfahren, von denen 1.700 vom
      Club vosgien betreut werden. Das Portal RandoVosgesduNord.fr bündelt rund fünfzig Wanderrouten, teils
      auf dem GR53, sowie diverse Mountainbike- und Radrunden mit Datenblättern, GPX-Tracks und
      Sehenswürdigkeiten.


      Wenn du einen Pfad suchst, um das Wesen des Parks zu verstehen, beginne mit dem Naturlehrpfad Loosthal.
      Er durchquert das Natura 2000 Gebiet Nordvogesen zwischen La Petite-Pierre und Neuwiller-lès-Saverne,
      umfasst vier Kilometer mit sechsundzwanzig Stationen zur regionalen Ökologie, und die Broschüre liegt
      auf Französisch, Englisch und Deutsch vor. Der Naturpark bittet um größte Rücksichtnahme auf einer Route
      durch seltene und empfindliche Lebensräume.


      Für Einblicke in den Naturhaushalt des Wassers empfiehlt sich das Haus des Wassers und des Flusses
      (Maison de l'Eau et de la Rivière) in Frohmuhl am Donnenbach-Weiher, eine Umweltbildungsstätte zu
      Gewässern, Feuchtgebieten, Wald und Biodiversität. Es liegt am Schnittpunkt vieler Wege, darunter der
      René-Char-Weg.
    history: >-
      Der Wald kennt keine Staatsgrenzen, und der Luchs ebenso wenig. Zwischen 2016 und 2020 wurden im
      deutschen Pfälzerwald zwanzig Luchse ausgewildert, 12 Weibchen und 8 Männchen aus der Schweiz und der
      Slowakei. Lycka, ein 2020 freigelassenes Weibchen, wechselte rasch auf die französische Seite, siedelte
      sich in den Nordvogesen an und zog 2021 sowie 2022 erfolgreich Junge auf. Heute streifen etwa sieben
      oder acht Luchse aus dem deutschen Wiederansiedlungsprojekt durch das Gebirge, vorwiegend in den
      Nordvogesen, und mindestens vier haben die zentralen oder Hohen Vogesen erreicht. Pfälzerwald und
      Nordvogesen bilden eine einzige zusammenhängende Waldeinheit.
    before: >-
      Bereite deine Tour vor: Der Lehrpfad von Loosthal durchquert ein Natura 2000 Areal und empfindliche
      Zonen; bleibe stets auf den markierten Wegen und beachte die Schutzhinweise des Naturparks.
    around: >-
      In 3 km Entfernung bildet der [Altschlossfelsen - Pfälzerwald](/lugar/altschlossfelsen---pfalzerwald/)
      die Fortsetzung dieser gemeinsamen Waldlandschaft auf deutscher Seite.
  it:
    intro: >-
      A dispetto del nome, i Vosgi del Nord non si trovano nel dipartimento dei Vosgi né sono incentrati sul
      massiccio vosgiano, le cui vette più elevate sorgono a diverse decine di chilometri a sud: ne occupano
      solo la fascia periferica. Il loro vero cuore è la foresta. Circa il 65% del parco, ossia 83.500 ettari,
      è coperto da boschi e si prolunga sul versante tedesco con il Pfälzerwald, formando un'unica distesa
      forestale di circa 2500 km², compresa in una riserva della biosfera transfrontaliera dell'UNESCO. Il
      parco naturale regionale è stato istituito il 30 dicembre 1975.
    landscape: >-
      Il sottosuolo è composto prevalentemente di arenaria, che l'acqua ha scolpito in valli incassate,
      pinnacoli rocciosi e conche. Da questa pietra nascono i castelli: 35 fortezze medievali arroccate su
      speroni d'arenaria, 27 nel Basso Reno e 8 nella Mosella, oltre a due manieri rinascimentali. Su questa
      arenaria vegetano da millenni faggete, querceti di rovere e pinete di pino silvestre, e il parco
      riunisce faggete, querceti, ontanete e pinete sia su torba sia su arenaria. La copertura boschiva si
      suddivide in 45% di latifoglie, 30% di conifere e 25% di bosco misto.


      Il paesaggio si articola in tre unità: il piedimonte a est, il cuore forestale al centro e l'altopiano
      lorenese a ovest. Negli spazi aperti si estendono praterie sabbiose e calcaree, brughiere e frutteti
      tradizionali con orchidee, genziane, allodole, barbagianni e upupe.
    wildlife: >-
      Il parco ospita cervi, [linci](/especie/lynx_lynx/), pipistrelli e alcuni lupi, e fra i volatili picchi,
      [cicogne bianche](/especie/ciconia_ciconia/), [gufo reali](/especie/bubo_bubo/), [falchi
      pellegrini](/especie/falco_peregrinus/) e [civette nane](/especie/glaucidium_passerinum/). La lince
      rappresenta il capitolo di tutela più seguito, approfondito più avanti.


      Tra rocce e rovine si sviluppa un'altra comunità vivente. Le mura, le pareti rocciose, i sotterranei e i
      solai dei castelli offrono rifugio a corvi imperiali, taccole, gheppi e talvolta al falco pellegrino,
      accanto a chirotteri come la pippistrello comune, la nottola comune e il vespertilio barbastello. Tra i
      massi ai piedi delle falesie di arenaria si può scorgere il colubro liscio. E nelle torbiere a sfagni
      della riserva di rochers et tourbières du pays de Bitche cresce una flora singolare, con la graziosa
      elleborina palustre.
    visit: >-
      La rete conta 2.600 km di sentieri segnalati per cammino, cavallo, mountain bike e bicicletta, 1.700 dei
      quali curati dal Club vosgien. Il portale RandoVosgesduNord.fr raccoglie una cinquantina di itinerari a
      piedi, alcuni lungo il GR53, oltre a diversi anelli per mountain bike e cicloturismo, con schede, tracce
      GPX e punti d'interesse.


      Se cerchi un percorso per comprendere l'ambiente del parco, inizia dal sentiero natura di Loosthal.
      Attraversa il sito Natura 2000 dei Vosgi del Nord tra La Petite-Pierre e Neuwiller-lès-Saverne, si snoda
      per quattro chilometri con ventisei tappe didattiche sull'ecologia locale, ed è corredato da una guida
      in francese, inglese e tedesco. Il parco raccomanda il massimo rispetto lungo un tracciato che costeggia
      ecosistemi rari e protetti.


      Per scoprire il ruolo delle acque, la Maison de l'Eau et de la Rivière a Frohmuhl, accanto allo stagno
      di Donnenbach, è un centro di educazione ambientale dedicato all'acqua, agli ecosistemi umidi, al bosco
      e alla biodiversità. Si trova all'incrocio di numerosi tracciati, tra cui il sentiero René Char.
    history: >-
      La foresta non conosce frontiere, e nemmeno la lince. Tra il 2016 e il 2020 sono state reintrodotte
      venti linci, 12 femmine e 8 maschi, nel Pfälzerwald tedesco, provenienti da Svizzera e Slovacchia.
      Lycka, una femmina rilasciata nel 2020, è passata rapidamente sul versante francese stabilendosi nei
      Vosgi del Nord, dove si è riprodotta nel 2021 e nel 2022. Oggi circa sette o otto linci del progetto
      tedesco popolano il massiccio, principalmente nei Vosgi del Nord, e almeno quattro hanno raggiunto i
      Vosgi centrali o le Alte Vosgi. Il Pfälzerwald e i Vosgi del Nord formano un unico corpo forestale
      ininterrotto.
    before: >-
      Organizza bene l'escursione: il sentiero didattico di Loosthal attraversa un sito Natura 2000 e ambienti
      protetti; resta dunque lungo il percorso tracciato e osserva le raccomandazioni del parco.
    around: >-
      A 3 km, l'[Altschlossfelsen - Pfälzerwald](/lugar/altschlossfelsen---pfalzerwald/) costituisce l'altra
      metà di questo massiccio forestale, situata oltre il confine tedesco.
  pt:
    intro: >-
      Apesar do nome, os Vosgos do Norte não ficam no departamento dos Vosgos nem se centram no maciço
      vosgiano propriamente dito, cujos cumes mais altos se erguem várias dezenas de quilómetros a sul: ocupam
      apenas a sua franja norte. Aquilo que possuem é floresta. Cerca de 65% do parque, 83.500 hectares, está
      coberto de arvoredo e prolonga-se pelo lado alemão com o Pfälzerwald até formar uma unidade florestal de
      cerca de 2500 km², integrada numa reserva da biosfera transfronteiriça da UNESCO. O parque natural
      regional foi criado a 30 de dezembro de 1975.
    landscape: >-
      O subsolo é predominantemente arenito, que a água foi esculpindo em vales profundos, penedos escarpados
      e depressões. É dele que nascem os castelos: 35 fortalezas medievais sobre esporões de arenito, 27 no
      Baixo Reno e 8 no Mosela, além de dois castelos renascentistas. Sobre esse arenito crescem há milénios
      faias, carvalhos-alvares e pinheiros-silvestres, reunindo o parque faias, carvalhos, amiais e pinhais
      sobre turfa e arenito. A floresta reparte-se em 45% de folhosas, 30% de resinosas e 25% de povoamentos
      mistos.


      A paisagem organiza-se em três unidades: o sopé a leste, o coração florestal ao centro e o planalto
      lorenês a oeste. Nos espaços abertos estendem-se relvados arenosos e calcários, charnecas e pomares
      tradicionais com orquídeas, gencianas, cotovias, corujas-das-torres e poupas.
    wildlife: >-
      O parque abriga veados, [linces](/especie/lynx_lynx/), morcegos e alguns lobos, figurando entre as aves
      petos, [cegonhas-brancas](/especie/ciconia_ciconia/), [bufos-reais](/especie/bubo_bubo/),
      [falcões-peregrinos](/especie/falco_peregrinus/) e [mochos-pigmeus](/especie/glaucidium_passerinum/). O
      lince é o caso de conservação mais acompanhado, descrito mais abaixo.


      Nas rochas e ruínas palpita outro tipo de vida. As muralhas, penedos, subterrâneos e sótãos dos castelos
      servem de abrigo a corvos-comuns, gralhas-de-nuca-cinzenta, peneireiros-de-dorso-malhado e por vezes ao
      falcão-peregrino, ao lado de morcegos como o morcego-anão, o nóctulo-comum e o morcego-de-franja. Entre
      os blocos de pedra ao pé das escarpas de arenito pode avistar-se a cobra-lisa-austríaca. E nas turfeiras
      de esfagno da reserva de rochers et tourbières du pays de Bitche medra uma flora singular, com a
      delicada orquídea epipáctis-dos-pântanos.
    visit: >-
      Existem 2.600 km de itinerários balizados para caminhar, andar a cavalo, em BTT ou em bicicleta de
      estrada, 1.700 dos quais mantidos pelo Club vosgien. O portal RandoVosgesduNord.fr reúne cerca de
      cinquenta circuitos pedestres, alguns ao longo do GR53, além de vários percursos em BTT e bicicleta, com
      fichas, ficheiros GPX e pontos de interesse.


      Se procuras um trilho para compreender a essência do parque, começa pelo trilho de natureza de Loosthal.
      Atravessa o sítio Natura 2000 dos Vosgos do Norte entre La Petite-Pierre e Neuwiller-lès-Saverne, tem
      quatro quilómetros e vinte e seis estações temáticas dedicadas à ecologia local, estando o folheto
      disponível em francês, inglês e alemão. O parque pede consideração e respeito num percurso que percorre
      biótopos raros e protegidos.


      Para explorar a temática aquática, a Maison de l'Eau et de la Rivière, em Frohmuhl, junto à lagoa de
      Donnenbach, é um centro de educação ambiental voltado para a água, os meios aquáticos, a floresta e a
      biodiversidade. Fica na confluência de múltiplos caminhos, incluindo o percurso René Char.
    history: >-
      A floresta não conhece fronteiras e o lince tão-pouco. Entre 2016 e 2020 soltaram-se vinte linces, 12
      fêmeas e 8 machos, no Pfälzerwald alemão, vindos da Suíça e da Eslováquia. Lycka, uma fêmea libertada em
      2020, passou rapidamente para o território francês, instalou-se nos Vosgos do Norte e procriou em 2021 e
      em 2022. Hoje vivem no maciço cerca de sete ou oito linces originários do projeto alemão, mormente nos
      Vosgos do Norte, e pelo menos quatro alcançaram os Vosgos centrais ou os Altos Vosgos. O Pfälzerwald e
      os Vosgos do Norte formam um único maciço florestal contínuo.
    before: >-
      Prepara bem a tua saída: o trilho de natureza de Loosthal cruza um sítio Natura 2000 e biótopos
      protegidos; mantém-te nos caminhos traçados e respeita os avisos do parque.
    around: >-
      A 3 km, o [Altschlossfelsen - Pfälzerwald](/lugar/altschlossfelsen---pfalzerwald/) constitui a outra
      metade deste bloco florestal, já em solo alemão.
