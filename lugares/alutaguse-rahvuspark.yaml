resumen:
  es: >-
    El Parque Nacional más joven de Estonia (creado en 2018), vasto desierto boreal de taiga profunda y
    turberas que limita con el lago Peipus.
  en: >-
    Estonia's youngest National Park (designated in 2018), an immense boreal wilderness of deep taiga and
    expansive mire complexes bordering Lake Peipus.
  fr: >-
    Le plus jeune parc national d'Estonie (créé en 2018), vaste immensité boréale de taïga profonde et de
    tourbières bordant le lac Peïpous.
  de: >-
    Estlands jüngster Nationalpark (gegründet 2018), eine weite boreale Wildnis aus dichter Taiga und
    Moorkomplexen am Peipussee.
  it: >-
    Il parco nazionale più giovane dell'Estonia (istituito nel 2018), vasta wilderness boreale di taiga
    profonda e torbiere al confine con il lago Peipus.
  pt: >-
    O Parque Nacional mais jovem da Estónia (criado em 2018), vasto ermo boreal de taiga profunda e turfeiras
    confinante com o lago Peipus.
unico:
  es: >-
    Cordones de arena de hasta 18 m con pinos viejos, rodeados de turberas, en el parque nacional más joven de
    Estonia.
  en: >-
    Ancient relict dune ridges up to 18 m high crowned by veteran pines, encircled by mires in Estonia's
    youngest national park.
  fr: >-
    Des cordons de dunes continentales atteignant 18 m boisés de vieux pins, cernés de tourbières, dans le
    plus jeune parc national d'Estonie.
  de: >-
    Bis zu 18 m hohe Binnendünenzüge mit uralten Kiefern, umgeben von Mooren, in Estlands jüngstem
    Nationalpark.
  it: >-
    Dune continentali sabbiose alte sino a 18 m con pini vetusti, cinte da torbiere, nel parco nazionale più
    recente dell'Estonia.
  pt: >-
    Cordões dunares continentais com até 18 m coroados de pinheiros seculares, cercados por turfeiras, no mais
    recente parque nacional estónio.
observaciones:
  es: 'Mejor época: de mayo a octubre. Si duermes en Varessaare, lleva agua potable: no hay pozo.'
texto:
  es:
    intro: >-
      Sube a la torre de Iisaku, de 28 m, y con buen tiempo verás las torres del monasterio de Kuremäe y el
      lago Peipus. Entre una cosa y otra, nada que se parezca a una ciudad: turberas, bosques y poca gente.
      Eso es Alutaguse, un parque nacional del este de Estonia que en su delimitación histórica abarcaba
      44.331 hectáreas, más de tres veces las de Karula. Nació el 24 de noviembre de 2018 sobre once áreas
      protegidas, entre ellas las reservas de Puhatu, Agusalu, Muraka y Selisoo, y se extiende sobre una
      llanura de poblamiento escaso y paisajes naturales. En esa delimitación histórica, las turberas cubrían
      el 54 % y los bosques el 42 %.
    landscape: >-
      Lo que define Agusalu son los cordones arenosos, estrechos y elevados, entre los que se extienden
      turberas y bosques. Algunos, con pinos viejos, alcanzan 18 m de altura. El paisaje es un mosaico, y los
      cambios entre ecosistemas son bruscos.


      Las crestas tienen su origen en el hielo. En la zona de la cabaña de Seljandiku, una cresta arenosa de
      la era glacial, y en el sendero de Kotka, las crestas boscosas se formaron al retirarse el lago Peipus.
      Cerca están las misteriosas islas de turbera de Rüütli raba, de sedimentos de la edad de hielo.


      En la parte occidental de la turbera de Agusalu hay pinares con murakas y sookail, y arándanos rojos en
      los mullidos. Las turberas bajas y los bosques pantanosos de Alutaguse son el lugar donde crecen varias
      orquídeas.
    wildlife: >-
      Alutaguse es el territorio del [oso pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/) y
      el [alce](/especie/alces_alces/): los bosques que rodean los humedales son su hábitat. Entre las
      especies raras del parque están la [ardilla voladora](/especie/pteromys_volans/) siberiana, el lagópodo
      común y la [cigüeña negra](/especie/ciconia_nigra/).


      Agusalu es desde siempre territorio del [pigargo europeo](/especie/haliaeetus_albicilla/) y el [águila
      real](/especie/aquila_chrysaetos/), del [urogallo](/especie/tetrao_urogallus/) y el lagópodo, y de búhos
      y halcones. Junto al río Poruni viven las águilas de la primera categoría de protección (pigargo, águila
      real, águila pescadora) y el lagópodo, y el urogallo en la segunda.


      Para ver animales, la mejor opción es el silencio. La cabaña de Varessaare, en el borde de la turbera de
      Muraka, está casi sin poblamiento alrededor y quien va en silencio tiene muchas opciones de ver animales
      salvajes. Mejor época: de mayo a octubre; en invierno hay pistas de esquí de fondo preparadas junto a la
      torre de Iisaku.
    visit: >-
      Empieza en Iisaku. El sendero didáctico de la ardilla voladora mide algo más de un kilómetro y arranca
      junto al aparcamiento de la torre; nueve paneles explican su biología, hábitat, distribución y
      protección, y el ecosistema forestal. La torre de Iisaku está a 94 m sobre el mar, el segundo punto
      natural más alto del condado de Ida-Viru tras la cresta de Uljaste.


      En bicicleta, la ruta circular de Agusalu tiene unos 38 km: empieza y termina junto a la torre y pasa
      por Vaikla, Imatu y Varesmetsa.


      A pie, hay tres senderos. El de Kotka (6,7 km) recorre turberas bajas y de transición y crestas de
      arena; ida y vuelta son 13 km. Desde el pueblo de Alliku se puede hacer solo un tramo de 1,5 km por la
      turbera de Rüütli. Al sendero de Kotka se puede llegar en autobús hasta la estación de Iisaku; el camino
      empieza en el aparcamiento de Liivamäe. El de Poruni sigue la orilla del río Poruni hasta el Narva y
      vuelve: son 10 km ida y vuelta, con 12 paneles que explican la naturaleza de la zona, el bosque de
      ribera, los estratos geológicos que asoman en las orillas y la historia militar. Un circuito de 2,5 km
      muestra el bosque de ribera y el bosque primario de frondosas, y un tramo de 700 m con grava sirve para
      sillas de ruedas y carritos de niño. El de Kurtna (9 km) es circular, con 300 m de pasarela, y pasa por
      las orillas de 11 lagos de la región de lagos de Kurtna.


      Quien quiera quedarse a dormir tiene las cabañas forestales del parque, de uso gratuito: la de
      Varessaare tiene literas para 8 personas y no hay pozo, así que hay que llevar agua potable. Desde el
      cruce de la mina Estonia, en Väike-Pungerja, un poste señala el sendero de Selisoo a tres kilómetros.
    history: >-
      En 1944, en febrero y marzo, hubo combates en la cresta de Seljandiku. Mucho antes, en los años veinte
      del siglo pasado, el botánico Gustav Vilbaste ya había intentado crear un parque nacional en Alutaguse.
      La propuesta gubernamental de ampliación lleva Alutaguse desde 45.019 hectáreas hasta cerca de 69.800,
      para conectar sus bosques y proteger la ardilla voladora y el urogallo, y las normas modificadas
      entraron en vigor el 3 de octubre de 2026.
    before: 'Mejor época: de mayo a octubre. Si duermes en Varessaare, lleva agua potable: no hay pozo.'
    around: >-
      Alutaguse no tiene vecinos cercanos en el atlas, pero sí lugares lejanos que comparten con él la ardilla
      voladora y los bosques maduros: el [Parque Nacional de Liesjärvi](/lugar/liesjarvi-national-park/) y el
      [Parque Nacional de Syöte](/lugar/syote-national-park/), este último también con el oso pardo.
  en:
    intro: >-
      Climb the 28 m observation tower at Iisaku, and in clear weather you can glimpse the distant domes of
      Kuremäe Convent and the blue shimmer of Lake Peipus. In between stretches nothing resembling a town:
      boundless peatlands, unbroken woodlands, and hardly a soul. This is Alutaguse, a national park in
      eastern Estonia whose original territory encompassed 44,331 hectares—more than three times the size of
      Karula. Established on 24 November 2018 by uniting eleven pre-existing nature reserves including Puhatu,
      Agusalu, Muraka, and Selisoo, it blankets a sparsely inhabited lowland plain. Within that historic
      boundary, mires covered 54% and forests 42%.
    landscape: >-
      Agusalu is uniquely defined by continental inland dunes—narrow, steep sandy ridges known as kriivad,
      threading through vast mires and transitional bogs. Some ridges, crowned with ancient Scots pines, rise
      18 m above the surrounding peat. The landscape forms a dynamic mosaic with abrupt ecological boundaries.


      These sandy ridges owe their existence to the ice. Near the Seljandiku wilderness cabin, an ice-age
      esker ridge looms, while along the Kotka trail, forested ridges were shaped by the receding waters of
      ancient Lake Peipus. Nearby lie the mysterious peat-bound islands of Rüütli raba, composed of glacial
      sediment islands engulfed by growing mire.


      In the western sector of Agusalu mire, pine bogs are carpeted with cloudberries and marsh Labrador tea,
      while cowberries blanket drier hummocks. The fens, transitional mires, and swamp forests of Alutaguse
      provide habitat for numerous rare native orchid species.
    wildlife: >-
      Alutaguse is undisputed realm of the [brown bear](/especie/ursus_arctos/), the [grey
      wolf](/especie/canis_lupus/), and the [moose](/especie/alces_alces/): the mature forests surrounding the
      wetlands are their stronghold. Rare species include the Siberian [flying
      squirrel](/especie/pteromys_volans/), willow ptarmigan, and the [black stork](/especie/ciconia_nigra/).


      Agusalu has long been prime territory for the [white-tailed eagle](/especie/haliaeetus_albicilla/) and
      the [golden eagle](/especie/aquila_chrysaetos/), alongside the [western
      capercaillie](/especie/tetrao_urogallus/), willow ptarmigan, owls, and falcons. Along the Poruni River
      live top-tier category one strictly protected eagles (white-tailed eagle, golden eagle, osprey)
      alongside willow ptarmigan, with the capercaillie in the second category.


      For wildlife viewing, silence is your greatest ally. The Varessaare wilderness hut, on the edge of
      Muraka bog, sits amidst virtually uninhabited wilderness where quiet observers stand high chances of
      encountering wild animals. Optimal season: May to October; in winter, cross-country ski trails are
      groomed near the Iisaku tower.
    visit: >-
      Begin in Iisaku. The Flying Squirrel study trail covers just over a kilometre, starting beside the
      observation tower car park; nine interpretive boards explain squirrel biology, habitat, distribution,
      and forest ecology. The Iisaku observation tower sits at 94 m above sea level, the second highest
      natural elevation in Ida-Viru County after the Uljaste esker.


      By bicycle, the Agusalu circular route covers roughly 38 km: starting and ending at the tower, it winds
      through Vaikla, Imatu, and Varesmetsa.


      On foot, three main trails await. The Kotka trail (6.7 km) traverses fens, bogs, and sand ridges,
      totalling 13 km round-trip. From Alliku village, a shorter 1.5 km loop across Rüütli bog can be walked.
      Kotka trail is accessible by bus to Iisaku; the path begins at the Liivamäe parking area. The Poruni
      trail follows the Poruni River to the Narva River and back: 10 km round-trip with 12 interpretive panels
      explaining pristine riparian habitats, exposed geological strata, and wartime history. A 2.5 km circular
      spur explores old-growth deciduous forest, while a 700 m gravel section accommodates wheelchairs and
      strollers. The Kurtna trail (9 km) is a circular route with 300 m of boardwalk, passing the shores of 11
      lakes in the Kurtna lake district.


      For overnight stays, the park offers free wilderness huts: Varessaare hut has bunks for 8 people and
      lacks a well, so you must bring drinking water. From the Estonia mine crossroads at Väike-Pungerja, a
      signpost points to the Selisoo bog trail three kilometres away.
    history: >-
      In 1944, during February and March, intense combat took place along the Seljandiku ridge. Long before,
      in the nineteen-twenties, botanist Gustav Vilbaste had already campaigned to establish a national park
      in Alutaguse. A governmental expansion proposal increases Alutaguse from 45,019 hectares to nearly
      69,800 hectares to connect fragmented forests and protect flying squirrels and capercaillie, with
      revised conservation rules entering into force on 3 October 2026.
    before: >-
      Best visiting season: May to October. If staying overnight at Varessaare hut, bring sufficient drinking
      water: there is no well on site.
    around: >-
      Alutaguse has no immediately neighbouring sites in the atlas, but shares flying squirrels and mature
      boreal forest habitats with [Liesjärvi National Park](/lugar/liesjarvi-national-park/) and [Syöte
      National Park](/lugar/syote-national-park/), the latter also sharing brown bear.
  fr:
    intro: >-
      Montez au sommet de la tour d'Iisaku, haute de 28 m, et par temps dégagé vous apercevrez les coupoles du
      couvent de Kuremäe et l'horizon liquide du lac Peïpous. Entre les deux, rien qui ressemble à une ville :
      des tourbières, des forêts profondes et une poignée d'habitants. C'est le parc national d'Alutaguse,
      dans l'est de l'Estonie, dont le périmètre initial couvrait 44 331 hectares, plus de trois fois la
      superficie de Karula. Établi le 24 novembre 2018 par la réunion de onze réserves naturelles protégées,
      parmi lesquelles Puhatu, Agusalu, Muraka et Selisoo, il s'étend sur une plaine peu peuplée. Dans ce
      tracé historique, les tourbières occupaient 54 % et les forêts 42 % du territoire.
    landscape: >-
      Ce qui caractérise la tourbière d'Agusalu, ce sont ses cordons dunaires continentaux étroits et
      surélevés (kriivad), entre lesquels s'étirent tourbières et forêts. Certains, couronnés de pins
      séculaires, s'élèvent à 18 m de hauteur. Le paysage compose une mosaïque aux transitions écologiques
      tranchées.


      Ces crêtes trouvent leur origine dans les glaciations. Près de la cabane de Seljandiku, un esker
      d'origine glaciaire et, sur le sentier de Kotka, des crêtes boisées ont été façonnés lors du recul du
      lac Peïpous. Non loin s'élèvent les îlots tourbeux de Rüütli raba, constitués de sédiments de l'ère
      glaciaire.


      Dans le secteur occidental d'Agusalu, les pinèdes abritent la ronce petit-mûrier et le lédon des marais,
      tandis que l'airelle rouge tapisse les buttes de sphaignes. Les tourbières basses et les forêts
      marécageuses d'Alutaguse accueillent plusieurs espèces d'orchidées rares.
    wildlife: >-
      Alutaguse est le fief de l'[ours brun](/especie/ursus_arctos/), du [loup gris](/especie/canis_lupus/) et
      de l'[élan](/especie/alces_alces/) : les forêts enveloppant les marais constituent leur biotope. Parmi
      les raretés du parc figurent l'[écureuil volant](/especie/pteromys_volans/) de Sibérie, le lagopède des
      saules et la [cigogne noire](/especie/ciconia_nigra/).


      Agusalu est de longue date le territoire du [pygargue à queue blanche](/especie/haliaeetus_albicilla/)
      et de l'[aigle royal](/especie/aquila_chrysaetos/), du [grand tétras](/especie/tetrao_urogallus/) et du
      lagopède, ainsi que de divers rapaces. Près de la rivière Poruni nichent les aigles de première
      catégorie de protection (pygargue, aigle royal, balbuzard) et le lagopède, le grand tétras relevant de
      la deuxième catégorie.


      Pour l'observation, le silence s'impose. La cabane de Varessaare, en lisière de la tourbière de Muraka,
      est isolée de toute habitation et offre d'excellentes opportunités d'observation faunique. Période
      conseillée : de mai à octobre ; en hiver, des pistes de ski de fond sont tracées près de la tour
      d'Iisaku.
    visit: >-
      Commencez à Iisaku. Le sentier didactique de l'écureuil volant mesure un peu plus d'un kilomètre au
      départ du parking de la tour ; neuf panneaux en détaillent la biologie, l'habitat et la protection au
      sein de l'écosystème forestier. La tour d'observation d'Iisaku culmine à 94 m au-dessus du niveau de la
      mer, deuxième sommet naturel du comté d'Ida-Viru après la colline d'Uljaste.


      À vélo, la boucle d'Agusalu totalise 38 km : elle part de la tour et traverse Vaikla, Imatu et
      Varesmetsa.


      À pied, trois parcours sont aménagés. Le sentier de Kotka (6,7 km) traverse tourbières et crêtes de
      sable, pour un aller-retour de 13 km. Depuis Alliku, un tronçon de 1,5 km mène à travers la tourbière de
      Rüütli. On peut gagner le départ en bus jusqu'à Iisaku, le chemin débutant au parking de Liivamäe. Le
      sentier de Poruni longe la rivière Poruni jusqu'à la Narva : 10 km aller-retour rythmés par 12 panneaux
      explicatifs sur les forêts alluviales et l'histoire locale. Une boucle de 2,5 km explore la forêt
      primaire de feuillus, et un tronçon de 700 m en gravier est accessible aux poussettes et fauteuils
      roulants. Le sentier de Kurtna (9 km) est une boucle intégrant 300 m de platelage qui longe les rives de
      11 lacs du complexe lacustre de Kurtna.


      Pour la nuitée, le parc met à disposition des refuges forestiers gratuits : celui de Varessaare propose
      des couchettes pour 8 personnes et ne dispose d'aucun puits, nécessitant d'apporter son eau potable.
      Depuis le carrefour de la mine Estonia à Väike-Pungerja, un jalon indique le sentier de Selisoo à trois
      kilomètres.
    history: >-
      En 1944, en février et mars, de durs combats se sont déroulés sur la crête de Seljandiku. Bien avant,
      dans les années vingt du siècle dernier, le botaniste Gustav Vilbaste avait déjà milité pour créer un
      parc national à Alutaguse. Le projet gouvernemental d'extension prévoit de porter Alutaguse de 45 019
      hectares à près de 69 800 hectares afin de connecter les corridors forestiers de l'écureuil volant et du
      grand tétras, les règles révisées étant entrées en vigueur le 3 octobre 2026.
    before: >-
      Saison recommandée : de mai à octobre. Si vous logez à Varessaare, emportez votre eau potable : il n'y a
      pas de puits sur place.
    around: >-
      Alutaguse ne compte pas de voisins immédiats dans l'atlas, mais partage l'écureuil volant et la vieille
      forêt boréale avec le [parc national de Liesjärvi](/lugar/liesjarvi-national-park/) et le [parc national
      de Syöte](/lugar/syote-national-park/), ce dernier hébergeant également l'ours brun.
  de:
    intro: >-
      Besteige den 28 m hohen Aussichtsturm von Iisaku, und bei klarer Sicht erkennst du die Kuppeln des
      Klosters Kuremäe und das weite Wasser des Peipussees. Dazwischen liegt nichts, was einer Stadt ähnelt:
      endlose Hochmoore, unberührte Taigawälder und kaum Menschen. Das ist Alutaguse, ein Nationalpark im
      Osten Estlands, dessen ursprüngliche Abgrenzung 44.331 Hektar umfasste — mehr als dreimal so viel wie
      Karula. Er wurde am 24. November 2018 durch den Zusammenschluss von elf Schutzgebieten gegründet,
      darunter Puhatu, Agusalu, Muraka und Selisoo. In jener historischen Gebietsabgrenzung machten Moore 54 %
      und Wälder 42 % der Fläche aus.
    landscape: >-
      Prägend für Agusalu sind die schmalen, aufragenden Binnendünenzüge (kriivad), zwischen denen sich Moore
      und Taigawälder ausbreiten. Manche dieser Kämme tragen alte Kiefern und erreichen 18 m Höhe. Die
      Landschaft bildet ein Mosaik mit abrupt wechselnden Biotopen.


      Die Sandrücken gehen auf die Eiszeit zurück. Im Bereich der Forsthütte Seljandiku liegt ein
      eiszeitlicher Os, und am Kotka-Wanderweg entstanden bewaldete Dünenzüge beim nacheiszeitlichen Rückzug
      des Peipussees. Nahebei liegen die Moorinseln von Rüütli raba, bestehend aus glazialen Sedimentkernen.


      Im westlichen Teil des Hochmoors Agusalu wachsen lichte Kiefern mit Moltebeeren und Sumpfporst, während
      Preiselbeeren die Bulten überziehen. Die Niedermoore und Bruchwälder von Alutaguse beherbergen zudem
      seltene heimische Orchideenarten.
    wildlife: >-
      Alutaguse ist das Revier von [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und
      [Elch](/especie/alces_alces/): Die Wälder rings um die Feuchtgebiete bilden ihren Lebensraum. Zu den
      seltenen Arten zählen das Sibirische [Flughörnchen](/especie/pteromys_volans/), das Moorschneehuhn und
      der [Schwarzstorch](/especie/ciconia_nigra/).


      Agusalu gilt von jeher als Stammrevier von [Seeadler](/especie/haliaeetus_albicilla/) und
      [Steinadler](/especie/aquila_chrysaetos/), von [Auerhuhn](/especie/tetrao_urogallus/), Moorschneehuhn
      sowie Eulen und Falken. Am Fluss Poruni brüten Adler der höchsten Schutzklasse (Seeadler, Steinadler,
      Fischadler) und das Moorschneehuhn, während das Auerhuhn in der zweiten Kategorie geführt wird.


      Für Tierbeobachtungen zahlt sich Stille aus: Die Forsthütte Varessaare am Rand des Moores Muraka liegt
      in einsamer Wildnis und bietet hervorragende Chancen auf Wildtierbegegnungen. Beste Reisezeit: Mai bis
      Oktober; im Winter werden Langlaufloipen am Turm von Iisaku gespurt.
    visit: >-
      Beginne in Iisaku. Der Lehrpfad des Flughörnchens misst etwas mehr als einen Kilometer und beginnt am
      Parkplatz des Aussichtsturms; neun Schautafeln erläutern Biologie, Lebensraum und Schutz der Art sowie
      das Waldökosystem. Der Aussichtsturm Iisaku steht auf 94 m Meereshöhe, der zweithöchsten natürlichen
      Erhebung des Kreises Ida-Viru nach dem Uljaste-Höhenzug.


      Per Fahrrad misst der Rundkurs Agusalu rund 38 km: Er startet am Turm und verläuft über Vaikla, Imatu
      und Varesmetsa.


      Zu Fuß stehen drei Routen zur Wahl. Der Kotka-Wanderweg (6,7 km) erschließt Übergangsmoore und
      Dünenkämme (13 km für Hin- und Rückweg). Vom Dorf Alliku aus kann ein 1,5 km langer Abschnitt durch das
      Rüütli-Moor begangen werden. Der Kotka-Weg ist per Bus bis Iisaku erreichbar; der Pfad beginnt am
      Parkplatz Liivamäe. Der Poruni-Pfad folgt dem Fluss Poruni bis zur Narva und zurück: 10 km Wegstrecke
      mit 12 Schautafeln zu Auwäldern und Militärgeschichte. Eine 2,5 km lange Schleife führt durch
      urwüchsigen Laubmischwald, und ein 700 m langer Schotterabschnitt eignet sich für Rollstühle und
      Kinderwagen. Der Kurtna-Weg (9 km) ist ein Rundkurs mit 300 m Bohlenwegen entlang von 11 Waldseen der
      Kurtna-Seenplatte.


      Kostenlose einfache Schutzhütten stehen für Übernachtungen bereit: Die Hütte Varessaare bietet Pritschen
      für 8 Personen und besitzt keinen Brunnen, sodass Trinkwasser mitzuführen ist. Von der Kreuzung der
      Grube Estonia in Väike-Pungerja weist ein Wegweiser zum Moorpfad Selisoo in drei Kilometern Entfernung.
    history: >-
      Im Februar und März 1944 tobten schwere Abwehrkämpfe auf dem Seljandiku-Kamm. Bereits in den zwanziger
      Jahren des vorigen Jahrhunderts bemühte sich der Botaniker Gustav Vilbaste um die Gründung eines
      Nationalparks in Alutaguse. Ein Erweiterungsplan vergrößert Alutaguse von 45.019 Hektar auf rund 69.800
      Hektar zur Vernetzung von Flughörnchen- und Auerhuhnbiotopen; die novellierten Schutzbestimmungen traten
      am 3. Oktober 2026 in Kraft.
    before: >-
      Beste Reisezeit: Mai bis Oktober. Bei Übernachtung in Varessaare Trinkwasser mitbringen: Es gibt keinen
      Brunnen vor Ort.
    around: >-
      Alutaguse hat keine direkten Nachbarn im Atlas, teilt jedoch Flughörnchen und alte Taigawälder mit dem
      [Liesjärvi-Nationalpark](/lugar/liesjarvi-national-park/) und dem
      [Syöte-Nationalpark](/lugar/syote-national-park/), letzterer auch mit dem Braunbären.
  it:
    intro: >-
      Sali sulla torre di avvistamento di Iisaku, alta 28 m, e con cielo limpido scorgerai le cupole del
      convento di Kuremäe e l'orizzonte azzurro del lago Peipus. Nel mezzo non v'è nulla che somigli a una
      città: torbiere, foreste sterminate e pochissima gente. Questo è Alutaguse, parco nazionale dell'Estonia
      orientale che nel suo perimetro originario abbracciava 44.331 ettari, oltre tre volte la superficie di
      Karula. È stato istituito il 24 novembre 2018 raggruppando undici aree protette preesistenti, tra cui
      Puhatu, Agusalu, Muraka e Selisoo. In quella delimitazione storica, le torbiere coprivano il 54% e le
      foreste il 42% del territorio.
    landscape: >-
      A contraddistinguere Agusalu sono i cordoni dunosi sabbiosi continentali (kriivad), stretti e
      sopraelevati, fra i quali si estendono torbiere e boscaglie. Alcuni di essi, ammantati di pini
      centenari, svettano per 18 m d'altezza. Il paesaggio forma un mosaico con passaggi ambientali repentini.


      Le creste affondano le radici nell'epoca glaciale. Presso il rifugio di Seljandiku si erge un cordone
      morenico di origine glaciale, mentre lungo il sentiero Kotka le dune boscose si modellarono con il
      ritiro delle acque del lago Peipus. Poco discosto sorgono gli isolotti torbosi di Rüütli raba, originati
      da sedimenti glaciali.


      Nel settore occidentale di Agusalu le pinete su torba abbondano di camemoro e loto palustre, mentre il
      mirtillo rosso copre i cuscinetti di sfagno. Le torbiere basse e i boschi paludosi di Alutaguse
      costituiscono l'habitat di diverse specie di orchidee spontanee.
    wildlife: >-
      Alutaguse è il regno dell'[orso bruno](/especie/ursus_arctos/), del [lupo](/especie/canis_lupus/) e
      dell'[alce](/especie/alces_alces/): le foreste che orlano le paludi rappresentano il loro rifugio. Tra
      le specie più rare spiccano lo [scoiattolo volante](/especie/pteromys_volans/) siberiano, la pernice
      bianca nordica e la [cicogna nera](/especie/ciconia_nigra/).


      Agusalu è da sempre rifugio dell'[aquila di mare](/especie/haliaeetus_albicilla/) e dell'[aquila
      reale](/especie/aquila_chrysaetos/), del [gallo cedrone](/especie/tetrao_urogallus/), della pernice
      bianca e di vari rapaci notturni. Lungo il fiume Poruni nidificano i rapaci di prima categoria di tutela
      (aquila di mare, aquila reale, falco pescatore) e la pernice bianca, con il gallo cedrone inserito nella
      seconda.


      Per scorgere la fauna la regola d'oro è il silenzio. Il capanno di Varessaare, ai margini della torbiera
      di Muraka, sorge in un contesto disabitato e offre ottime opportunità di osservazione. Mesi consigliati:
      da maggio a ottobre; in inverno vengono tracciate piste di sci di fondo presso la torre di Iisaku.
    visit: >-
      Inizia da Iisaku. Il sentiero didattico dello scoiattolo volante misura poco più di un chilometro e
      parte accanto al parcheggio della torre; nove pannelli didattici illustrano biologia, distribuzione e
      tutela della specie nell'ecosistema forestale. La torre di Iisaku sorge a 94 m sul livello del mare,
      seconda elevazione naturale della contea di Ida-Viru dopo la collina di Uljaste.


      In bicicletta, l'anello di Agusalu conta circa 38 km: parte dalla torre e si snoda attraverso Vaikla,
      Imatu e Varesmetsa.


      A piedi puoi scegliere tra tre sentieri. Il percorso Kotka (6,7 km) attraversa torbiere basse e dune
      sabbiose, per 13 km complessivi tra andata e ritorno. Dal villaggio di Alliku è possibile percorrere un
      tratto breve di 1,5 km sulla torbiera di Rüütli. Il sentiero Kotka si raggiunge in autobus fino a
      Iisaku, muovendo dal parcheggio di Liivamäe. Il sentiero di Poruni segue la sponda del fiume Poruni sino
      al Narva: 10 km complessivi con 12 tabelle didattiche su boschi ripariali e memorie storiche. Una
      variante ad anello di 2,5 km visita il bosco primario di latifoglie, mentre un tratto di 700 m con fondo
      stabilizzato è fruibile con passeggini e carrozzine. Il percorso Kurtna (9 km) è un anello con 300 m di
      passerelle che costeggia 11 laghi del distretto lacustre di Kurtna.


      Chi desidera pernottare può usufruire dei capanni forestali gratuiti: quello di Varessaare offre
      cuccette per 8 persone e non dispone di pozzo, imponendo di portare scorte idriche. Dal bivio della
      miniera Estonia a Väike-Pungerja, un cartello segnala il sentiero della torbiera di Selisoo a tre
      chilometri.
    history: >-
      Nel 1944, a febbraio e marzo, si svolsero aspri combattimenti sulla cresta di Seljandiku. Molto prima,
      negli anni venti del secolo scorso, il botanico Gustav Vilbaste propose la creazione di un parco
      nazionale ad Alutaguse. Il piano governativo di ampliamento estende Alutaguse da 45.019 ettari a circa
      69.800 ettari per riconnettere le foreste di scoiattolo volante e gallo cedrone; le norme aggiornate
      sono entrate in vigore il 3 ottobre 2026.
    before: >-
      Stagione consigliata: da maggio a ottobre. Se alloggi a Varessaare porta acqua potabile: non ci sono
      pozzi sul posto.
    around: >-
      Alutaguse non vanta vicini diretti nell'atlas, ma condivide lo scoiattolo volante e la taiga matura con
      il [Parco nazionale di Liesjärvi](/lugar/liesjarvi-national-park/) e il [Parco nazionale di
      Syöte](/lugar/syote-national-park/), quest'ultimo anche con l'orso bruno.
  pt:
    intro: >-
      Sobe à torre de observação de Iisaku, de 28 m de altura, e com céu limpo descortinarás as cúpulas do
      convento de Kuremäe e o espelho de água do lago Peipus. Pelo meio nada evoca uma urbe: turfeiras sem
      fim, taiga contínua e quase nenhuma presença humana. Este é o Parque Nacional de Alutaguse, no leste da
      Estónia, cuja área histórica abrangia 44.331 hectares, mais de três vezes a dimensão de Karula. Foi
      criado a 24 de novembro de 2018 agregando onze reservas naturais protegidas, entre as quais Puhatu,
      Agusalu, Muraka e Selisoo. Nesse limite original, as turfeiras representavam 54% e as florestas 42% do
      território.
    landscape: >-
      A singularidade de Agusalu assenta nos seus cordões dunares continentais estreitos e alcantilados
      (kriivad), entre os quais se estendem charnecas e turfeiras. Alguns, coroados por pinheiros-silvestres
      seculares, atingem 18 m de altura. A paisagem forma um mosaico dinâmico com transições ecológicas
      nítidas.


      Estes relevos arenosos tiveram génese no gelo. Perto do abrigo florestal de Seljandiku ergue-se um esker
      fóssil, enquanto no percurso de Kotka as cristas arenosas resultaram do recuo das águas ancestrais do
      lago Peipus. Nas imediações repousam os ilhéus de turfeira de Rüütli raba, formados por depósitos
      glaciares.


      No setor ocidental de Agusalu os pinhais de turfeira abundam em amora-ártica e lédon-dos-pântanos,
      cobrindo o arando-vermelho as elevações de musgo. As turfeiras baixas e matas pantanosas de Alutaguse
      sustentam diversas orquídeas autóctones raras.
    wildlife: >-
      Alutaguse é o santuário do [urso-pardo](/especie/ursus_arctos/), do [lobo](/especie/canis_lupus/) e do
      [alce](/especie/alces_alces/): as florestas que circundam as zonas húmidas constituem o seu refúgio
      permanente. Entre a fauna notável contam-se o [esquilo-voador](/especie/pteromys_volans/) siberiano, a
      lagópode-dos-sauces e a [cegonha-preta](/especie/ciconia_nigra/).


      Agusalu é desde tempos imemoriais couto do [pigargo-comum](/especie/haliaeetus_albicilla/) e da
      [águia-real](/especie/aquila_chrysaetos/), do [tetraz-grande](/especie/tetrao_urogallus/), da lagópode e
      de rapinas noturnas. Junto ao rio Poruni nidificam águias com estatuto de proteção máxima de primeira
      categoria (pigargo, águia-real, águia-pesqueira) e a lagópode, enquadrando-se o tetraz na segunda.


      Para avistar animais, o segredo é o silêncio. A cabana florestal de Varessaare, no rebordo da turfeira
      de Muraka, situa-se num ermo despovoado com elevadas hipóteses de observação de fauna bravia. Época
      ideal: de maio a outubro; no inverno preparam-se pistas de esqui de fundo junto à torre de Iisaku.
    visit: >-
      Começa em Iisaku. O trilho interpretativo do esquilo-voador cobre pouco mais de um quilómetro a partir
      do parque de estacionamento da torre; nove painéis explicam a biologia, os habitats e a conservação
      florestal. A torre de Iisaku assenta a 94 m de altitude, o segundo relevo natural mais proeminente do
      condado de Ida-Viru após a elevação de Uljaste.


      Em bicicleta, o circuito circular de Agusalu soma 38 km: arranca junto à torre e percorre Vaikla, Imatu
      e Varesmetsa.


      A pé, dispões de três percursos. O de Kotka (6,7 km) cruza turfeiras e dunas de areia, totalizando 13 km
      entre ida e volta. A partir da aldeia de Alliku é possível caminhar um troço reduzido de 1,5 km pela
      turfeira de Rüütli. O trilho de Kotka é servido por autocarro até Iisaku, iniciando-se a marcha no
      parque de Liivamäe. O percurso de Poruni acompanha a margem do rio homónimo até ao Narva: são 10 km de
      ida e volta com 12 painéis sobre galerias ripícolas e episódios bélicos. Uma variante circular de 2,5 km
      dá a conhecer a mata virgem de folhosas, e um segmento de 700 m em gravilha facilita o acesso de
      cadeiras de rodas e carrinhos infantis. O trilho de Kurtna (9 km) é circular com 300 m de passadiços,
      contornando as margens de 11 lagos do complexo lacustre de Kurtna.


      Para pernoitar, o parque disponibiliza abrigos florestais gratuitos: o de Varessaare dispõe de beliches
      para 8 pessoas e não tem poço, sendo obrigatório transportar água potável. No cruzamento da mina
      Estonia, em Väike-Pungerja, um poste assinala o trilho de Selisoo a três quilómetros.
    history: >-
      Em 1944, em fevereiro e março, registaram-se duros recontros bélicos na crista de Seljandiku. Muito
      antes, nos anos vinte do século passado, o botânico Gustav Vilbaste batera-se pela fundação de um parque
      nacional em Alutaguse. O plano estatal de alargamento expande Alutaguse de 45.019 hectares para perto de
      69.800 hectares para salvaguarda de corredores do esquilo-voador e do tetraz, tendo as normas revistas
      entrado em vigor a 3 de outubro de 2026.
    before: >-
      Período recomendável: de maio a outubro. Se pernoitares em Varessaare, transporta água potável: não
      existe poço de água doce no local.
    around: >-
      Alutaguse não confina com áreas contíguas no atlas, mas partilha o esquilo-voador e a floresta boreale
      com o [Parque Nacional de Liesjärvi](/lugar/liesjarvi-national-park/) e o [Parque Nacional de
      Syöte](/lugar/syote-national-park/), este último acolhendo também o urso-pardo.
