resumen:
  es: Las cumbres de Chipre, cubiertas de pinares, sobre una corteza oceánica levantada del fondo del mar.
  en: >-
    The pine-cloaked peaks of Cyprus, towering above a complete section of ancient oceanic crust lifted from
    the Tethys seabed.
  fr: >-
    Les cimes de Chypre couronnées de pinèdes, reposant sur une section complète de croûte océanique soulevée
    du fond de la Téthys.
  de: >-
    Die von Kiefernwäldern gekrönten Gipfel Zyperns auf einem unversehrten Stück ozeanischer Erdkruste,
    gehoben aus den Tiefen der Tethys.
  it: >-
    Le vette di Cipro ricoperte di pinete, poggiate su una sequenza intatta di crosta oceanica sollevatasi
    dagli abissi della Tetide.
  pt: >-
    Os cumes de Chipre coroados de pinhais, assentes sobre uma secção intacta de crosta oceânica soerguida das
    profundezas da Tétis.
