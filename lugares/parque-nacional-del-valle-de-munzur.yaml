resumen:
  es: >-
    El parque nacional más extenso y diverso de Turquía (42.000 ha), cañones kársticos profundos, nacimientos
    de agua sagrados y rebaños de la cabra bezoar.
  en: >-
    Turkey's most extensive and biodiverse national park (42,000 ha), featuring deep karst canyons, sacred
    springs, and herds of wild bezoar ibex.
  fr: >-
    Le parc national le plus étendu et diversifié de Turquie (42 000 ha), canyons karstiques profonds,
    résurgences sacrées et hardes de chèvres bezoar.
  de: >-
    Der weitläufigste und artenreichste Nationalpark der Türkei (42.000 ha), tiefe Karstschluchten, heilige
    Karstquellen und Herden der Bezoarziege.
  it: >-
    Il parco nazionale più vasto e variegato della Turchia (42.000 ha), profonde gole carsiche, sorgenti sacre
    e branchi di capra bezoar.
  pt: >-
    O parque nacional mais extenso e biodiverso da Turquia (42.000 ha), profundos desfiladeiros cársticos,
    nascentes sagradas e manadas de cabra-selvagem-asiática.
unico:
  es: >-
    Un río que nace en manantiales, un valle donde el roble convive con un abedul raro en Turquía y unas
    plantas que no crecen en ningún otro sitio del mundo.
  en: >-
    A river born of gushing springs, a valley where oak woods shelter birches exceedingly rare in Turkey, and
    endemic flora found nowhere else on Earth.
  fr: >-
    Une rivière née de puissantes résurgences, une vallée où le chêne côtoie un bouleau rarissime en Turquie
    et des espèces végétales uniques au monde.
  de: >-
    Ein Fluss, der aus gewaltigen Quellen entspringt, ein Tal, wo Eichenwälder mit seltenen Birken wachsen,
    und Pflanzen, die es nirgendwo sonst auf der Erde gibt.
  it: >-
    Un fiume originato da sorgenti impetuose, una forra dove i querceti accolgono betulle rarissime in Turchia
    ed endemismi vegetali esclusivi.
  pt: >-
    Um rio que brota em nascentes impetuosas, um vale onde os carvalhais acolhem bétulas raríssimas na Turquia
    e plantas que não crescem em mais nenhum lugar do planeta.
observaciones:
  es: >-
    Los montes son altos y el invierno extremo, así que el periodo de visita es corto. Consulta al gestor las
    condiciones de visita y los sectores abiertos antes de organizar la salida.
texto:
  es:
    intro: >-
      El agua nace aquí de golpe. Cerca del pueblo de Ziyaret, entre diez y quince kilómetros al oeste de
      Ovacık, el Munzur brota de la tierra en grandes manantiales y, ya hecho río, baja por un valle que corta
      los montes del mismo nombre hasta desembocar en el Éufrates. El Parque Nacional del Valle de Munzur
      recoge ese recorrido: de los manantiales a los cañones, y de los robledales del fondo a unas cumbres que
      llegan a los 3300 m, con lagos glaciares y de cráter, rebaños de cabras montesas y osos que duermen en
      cuevas.
    landscape: >-
      El parque empieza a 8 km del centro de Tunceli y sigue el valle hasta Ovacık. Al norte, los montes
      Munzur suben hasta los 3300 m, y los valles de los ríos Mercan y Munzur los fragmentan. En las cumbres,
      entre los 2000 y los 3000 m, hay lagos de cráter; en la llanura de Ovacık brotan los manantiales; y a lo
      largo del valle hay cañones y cascadas. Karagöl es uno de los principales lagos glaciares de los montes.
      Bajo tierra hay varias cuevas que no se han explorado de forma sistemática.


      El clima es continental, con inviernos extremos y fuertes nevadas.


      La vegetación sigue el valle. El roble es el árbol dominante y cubre las colinas y las laderas donde no
      hay roca. En el fondo y a orillas del agua se mezclan olmo, arce, aliso, fresno, plátano, vid, abedul,
      nogal, avellano silvestre, álamo y sauce. Y a 1,5 km de los manantiales del Munzur hay un bosquecillo de
      abedules a ambos lados del río, un árbol raro en Turquía que aquí es el árbol característico de la
      región.
    wildlife: >-
      La flora es la gran riqueza: 1518 plantas registradas, de las que 43 son endémicas de los montes Munzur
      y 227 de Turquía. Entre las que no crecen en ningún otro sitio fuera de esas montañas están el Munzur
      kekliği, el cerezo de Erzincan y la violeta.


      La fauna incluye al [oso pardo](/especie/ursus_arctos/), que vive en cuevas y huecos de las rocas y es
      uno de los grandes mamíferos más importantes del parque. Hay también [lobo](/especie/canis_lupus/),
      [lince](/especie/lynx_lynx/), [nutria](/especie/lutra_lutra/), [gato
      montés](/especie/felis_silvestris/), tejón, jabalí y cabra montés, y dos cabras de montaña, la de
      cuernos en gancho y la [bezoar](/especie/capra_aegagrus/), junto con la
      [gamuza](/especie/rupicapra_rupicapra/).


      En el aire hay águila, buitre, halcón y milano, y la rara águila real. Las aves amenazadas más comunes
      incluyen la [cigüeña negra](/especie/ciconia_nigra/), el [quebrantahuesos](/especie/gypaetus_barbatus/),
      el [alimoche](/especie/neophron_percnopterus/), el [buitre leonado](/especie/gyps_fulvus/), la [perdiz
      de nieve del Caspio](/especie/tetraogallus_caspius/), el [águila imperial
      oriental](/especie/aquila_heliaca/) y el [treparriscos](/especie/tichodroma_muraria/). De noche son
      comunes el [búho real](/especie/bubo_bubo/), el búho y los murciélagos. En el agua, las truchas abundan
      en el Munzur y el Mercan, y los manantiales del Munzur albergan truchas rojas.


      Por el clima, el mejor periodo para visitarlo va del 15 de junio al 27 de agosto.
    visit: >-
      Se llega desde Tunceli por una carretera asfaltada que sigue el río Munzur hasta Ovacık. En el parque,
      la parte norte del valle del Mercan es la más cómoda para el trekking y el senderismo; la sur, con
      bosque, para acampar y hacer picnic.


      Halbori Gözeleri y Ana Fatma son los principales centros de visita del parque. En el área de uso diario
      de Ana Fatma hay un centro de administración y de presentación para visitantes.
    history: >-
      El parque se declaró el 21 de diciembre de 1971. Lo gestiona la Dirección General de Protección de la
      Naturaleza y Parques Nacionales. La cultura, las creencias y la mitología de las comunidades del valle
      se consideran valores importantes del parque, y los habitantes alevíes de la región respetan la
      naturaleza como parte de sus creencias religiosas, lo que ayuda a conservar el paisaje.


      La amenaza viene del agua. En 1985 empezó la construcción de una presa hidroeléctrica en el río Mercan,
      y una investigación posterior mostró que se construyó dentro de los límites del parque.
    before: >-
      Los montes son altos y el invierno extremo, así que el periodo de visita es corto. Consulta al gestor
      las condiciones de visita y los sectores abiertos antes de organizar la salida.
    around: >-
      Lejos de aquí, en Creta, el [Macizo de Lefka Ori](/lugar/macizo-de-lefka-ori/) y el [Parque Nacional de
      la Garganta de Samaria](/lugar/samaria-national-park/) comparten con Munzur la cabra bezoar y los
      hábitats de alta montaña y garganta.
  en:
    intro: >-
      Water bursts forth here with sudden power. Near the village of Ziyaret, some ten to fifteen kilometres
      west of Ovacık, the Munzur erupts from the earth through monumental resurgences and, already a mighty
      river, carves through the Munzur Mountains before eventually meeting the Euphrates. Munzur Valley
      National Park embraces this dramatic course: from sacred springs to sheer canyons, and from
      valley-bottom oakwoods to rugged peaks reaching 3300 m, dotted with glacial tarns and crater lakes, home
      to herds of wild mountain goats and brown bears denning in natural limestone caverns.
    landscape: >-
      The national park begins 8 km outside the centre of Tunceli and follows the river valley all the way to
      Ovacık. To the north, the Munzur Range rises steeply to 3300 m, heavily incised by the gorges of the
      Mercan and Munzur rivers. Across the high crests, between 2000 and 3000 m, lie dramatic crater and
      cirque lakes; on the plains of Ovacık gush the river springs; and throughout the valley stretch gorges,
      vertical precipices, and waterfalls. Karagöl ranks among the prominent glacial lakes nestled in these
      heights. Subterranean conduits riddle the karst, though few of the caves have been explored
      systematically.


      The climate is strictly continental, marked by fierce winters and heavy snowfall.


      Vegetation mirrors the dramatic topography. Oak is the dominant forest tree, cloaking slopes and
      hillsides wherever rock gives way to soil. Along the riverbanks and valley floors mingle elm, maple,
      alder, ash, plane, wild grapevine, birch, walnut, wild hazel, poplar, and willow. Just 1.5 km downstream
      from the Munzur springs thrives a native birch grove along both banks, an exceptionally rare tree in
      Turkey that forms a signature ecological feature of the region.
    wildlife: >-
      Botany is the park's foremost treasure: 1518 plant species documented, of which 43 are strictly endemic
      to the Munzur Mountains and 227 endemic to Turkey. Among botanical species growing nowhere else on the
      planet are the Munzur snowcock pea, the Erzincan cherry, and local endemic violets.


      Mammalian fauna features the [brown bear](/especie/ursus_arctos/), sheltering in caves and rock fissures
      as one of the park's flagship species. Also roaming these mountains are the
      [wolf](/especie/canis_lupus/), [Eurasian lynx](/especie/lynx_lynx/), [Eurasian
      otter](/especie/lutra_lutra/), [wildcat](/especie/felis_silvestris/), Eurasian badger, wild boar, and
      wild goat, represented by two distinct caprid species: the hook-horned wild goat and the [bezoar
      ibex](/especie/capra_aegagrus/), coexisting alongside the [chamois](/especie/rupicapra_rupicapra/).


      Avian life includes eagles, vultures, falcons, and kites, alongside the rare golden eagle. Vulnerable
      and protected birds regularly logged include [black stork](/especie/ciconia_nigra/), [bearded
      vulture](/especie/gypaetus_barbatus/), [Egyptian vulture](/especie/neophron_percnopterus/), [griffon
      vulture](/especie/gyps_fulvus/), [Caspian snowcock](/especie/tetraogallus_caspius/), [eastern imperial
      eagle](/especie/aquila_heliaca/), and [wallcreeper](/especie/tichodroma_muraria/). At night, the
      [Eurasian eagle-owl](/especie/bubo_bubo/), smaller owls, and bats are common. In the cold mountain
      streams, brown trout thrive in both the Munzur and Mercan, with the Munzur springs harbouring
      red-spotted trout.


      Owing to high-mountain weather, the optimal window for exploration runs from 15 June to 27 August.
    visit: >-
      Access from Tunceli is via an asphalt road tracking the course of the Munzur River towards Ovacık.
      Within the park, the northern reach of the Mercan Valley provides the most rewarding terrain for
      trekking and mountain hiking, whereas the wooded southern sectors are favoured for camping and riverside
      day use.


      Halbori Gözeleri and Ana Fatma constitute the primary visitor nodes along the river. In the Ana Fatma
      day-use area, a park administration and visitor interpretation facility welcomes travellers.
    history: >-
      The national park was officially proclaimed on 21 December 1971, administered by the General Directorate
      of Nature Conservation and National Parks. The sacred traditions, spiritual beliefs, and folklore of the
      valley communities are recognized as integral cultural values of the park; the local Alevi population
      reveres nature as an inseparable aspect of spiritual devotion, an ethic that has helped safeguard the
      wilderness.


      Ecological pressures have emerged from hydrological schemes. In 1985 construction began on a
      hydroelectric dam along the Mercan River, subsequent legal investigations confirming that portions of
      the reservoir fell directly inside national park boundaries.
    before: >-
      High elevations bring extreme winter conditions, keeping the seasonal window narrow. Check current
      accessibility and open sectors with the park administration before organizing excursions.
    around: >-
      Far across the eastern Mediterranean, in Crete, the [Lefka Ori Massif](/lugar/macizo-de-lefka-ori/) and
      [Samaria Gorge National Park](/lugar/samaria-national-park/) share with Munzur the wild bezoar goat
      alongside rugged high-mountain and canyon habitats.
  fr:
    intro: >-
      L'eau jaillit ici avec une soudaine puissance. Près du village de Ziyaret, à environ dix ou quinze
      kilomètres à l'ouest d'Ovacık, le Munzur sourd de la terre en résurgences monumentales et, devenu fleuve
      fougueux, entaille les monts du même nom avant de rejoindre l'Euphrate. Le parc national de la vallée de
      Munzur englobe ce périple : des sources sacrées aux défilés rocheux, et des chênaies du fond de vallée
      jusqu'aux cimes s'élevant à 3300 m, constellées de lacs glaciaires et de cratère où dorment des hardes
      de chèvres sauvages et des ours réfugiés dans les cavernes.
    landscape: >-
      Le parc débute à 8 km du centre de Tunceli et longe la vallée fluviale jusqu'à Ovacık. Au nord, les
      monts Munzur culminent à 3300 m, profondément échancrés par les défilés des rivières Mercan et Munzur.
      Sur les hauts sommets, entre 2000 et 3000 m, s'égrènent des lacs de cratère et de cirque ; dans la
      plaine d'Ovacık jaillissent les sources vauclusiennes ; et tout au long de la vallée se succèdent
      canyons et cascades. Le lac Karagöl compte parmi les pièces maîtresses glaciaires du massif. Le sous-sol
      recèle diverses cavités karstiques non encore explorées de manière méthodique.


      Le climat est rigoureusement continental, caractérisé par des hivers glaciaux et d'abondantes chutes de
      neige.


      La couverture végétale épouse le relief. Le chêne domine les pentes et coteaux partout où la terre
      arable s'accroche à la roche. Sur les berges et au fond du défilé se mêlent orme, érable, aulne, frêne,
      platane, vigne sauvage, bouleau, noyer, noisetier, peuplier et saule. À 1,5 km en aval des résurgences
      du Munzur subsiste un bosquet de bouleaux sur les deux rives, une essence arborée rarissime en Turquie
      qui constitue ici une curiosité emblématique.
    wildlife: >-
      La richesse floristique est exceptionnelle : 1518 taxons végétaux recensés, dont 43 sont strictement
      endémiques des monts Munzur et 227 endémiques de Turquie. Parmi les espèces ne croissant nulle part
      ailleurs figurent une astragale locale (*Munzur kekliği*), le cerisier d'Erzincan et plusieurs
      violettes.


      La faune mammalienne compte l'[ours brun](/especie/ursus_arctos/), qui fréquente cavernes et chaos
      rocheux comme grand mammifère emblématique du parc. Y vivent également le [loup
      gris](/especie/canis_lupus/), le [lynx boréal](/especie/lynx_lynx/), la [loutre
      d'Europe](/especie/lutra_lutra/), le [chat forestier](/especie/felis_silvestris/), le blaireau, le
      sanglier et deux espèces d'ongulés de montagne : la chèvre sauvage à cornes arquées ou [chèvre
      bézoard](/especie/capra_aegagrus/), ainsi que le [chamois](/especie/rupicapra_rupicapra/).


      Côté avifaune planent aigles, vautours, faucons et milans, sans oublier l'aigle royal. Les oiseaux
      menacés et emblématiques incluent la [cigogne noire](/especie/ciconia_nigra/), le [gypaète
      barbu](/especie/gypaetus_barbatus/), le [vautour percnoptère](/especie/neophron_percnopterus/), le
      [vautour fauve](/especie/gyps_fulvus/), le [tétraogalle de la
      Caspienne](/especie/tetraogallus_caspius/), l'[aigle impérial](/especie/aquila_heliaca/) et le
      [tichodrome échelette](/especie/tichodroma_muraria/). La nuit s'animent le [grand-duc
      d'Europe](/especie/bubo_bubo/), d'autres rapaces nocturnes et les chauves-souris. Les truites abondent
      dans le Munzur et le Mercan, les résurgences abritant la truite à points rouges.


      En raison des rigueurs climatiques, la meilleure période d'excursion s'étend du 15 juin au 27 août.
    visit: >-
      L'accès depuis Tunceli emprunte une route goudronnée longeant le cours du Munzur jusqu'à Ovacık. Au sein
      du parc, le secteur nord de la vallée du Mercan s'avère le plus favorable pour les randonnées pédestres
      et le trekking ; la partie sud, boisée, est appréciée pour le bivouac et les haltes de pique-nique.


      Halbori Gözeleri et Ana Fatma représentent les pôles d'accueil majeurs. L'aire récréative d'Ana Fatma
      comprend un centre de gestion et d'information destiné aux visiteurs.
    history: >-
      Le parc a été proclamé le 21 décembre 1971 sous l'égide de la Direction générale de la protection de la
      nature et des parcs nationaux. Les croyances, traditions et mythes des communautés de la vallée sont
      reconnus comme un patrimoine culturel inhérent au site ; les habitants alévis vénèrent la nature sacrée
      dans leur foi quotidienne, favorisant ainsi la sauvegarde des milieux.


      Les perturbations résultent des projets hydroélectriques. En 1985 débuta la construction d'un barrage
      sur la rivière Mercan, des expertises ultérieures ayant révélé que ses emprises mordaient sur le
      périmètre protégé.
    before: >-
      Les massifs sont élevés et les hivers rudes, restreignant la saison propice aux sorties estivales.
      Renseignez-vous auprès de la direction du parc sur les voies ouvertes avant tout départ.
    around: >-
      Bien plus à l'ouest, en Crète, le [Massif des Lefka Ori](/lugar/macizo-de-lefka-ori/) et le [Parc
      national des gorges de Samaria](/lugar/samaria-national-park/) partagent avec le Munzur la chèvre
      bézoard et les biotopes rupestres de haute montagne.
  de:
    intro: >-
      Das Wasser bricht hier mit urwüchsiger Wucht hervor. Nahe dem Dorf Ziyaret, rund zehn bis fünfzehn
      Kilometer westlich von Ovacık, entspringt der Munzur in mächtigen Karstquellen aus dem Fels und bahnt
      sich als reissender Strom seinen Weg durch die gleichnamigen Berge bis zum Euphrat. Der Nationalpark
      Munzur-Tal umfasst diesen wilden Lauf: von heiligen Quellen zu tiefen Schluchten und von den
      Eichenhainen des Talgrunds hinauf zu Felsgipfeln bis auf 3300 m Höhe mit eiszeitlichen Karen,
      Kraterseen, Bezoarziegen und Höhlenbären.
    landscape: >-
      Der Nationalpark beginnt 8 km ausserhalb des Zentrums von Tunceli und folgt dem Flusstal bis nach
      Ovacık. Im Norden steigen die Munzur-Berge steil bis auf 3300 m an, tief zerschnitten von den Schluchten
      der Flüsse Mercan und Munzur. In den Hochlagen zwischen 2000 und 3000 m liegen markante Krater- und
      Karseen; in der Ebene von Ovacık sprudeln die Hauptquellen, und entlang des Tals wechseln Felsklammen
      und Kaskaden einander ab. Der Karagöl gehört zu den bedeutendsten Gletscherseen des Massivs. Im
      Untergrund liegen mehrere Karsthöhlen, die noch nicht systematisch erforscht sind.


      Das Klima ist streng kontinental mit eisigen Wintern und enormen Schneehöhen.


      Die Pflanzenwelt folgt dem Relief. Eichen dominieren die Hänge und Hügel, wo immer der Fels von Boden
      bedeckt ist. Im Talgrund und an den Ufern mischen sich Ulmen, Ahorne, Erlen, Eschen, Platanen, wilde
      Reben, Birken, Walnussbäume, Hasel, Pappeln und Weiden. Rund 1,5 km unterhalb der Munzur-Quellen
      erstreckt sich beiderseits des Flusses ein Birkenhain – ein in der Türkei sehr seltener Baum, der hier
      eine landschaftsprägende botanische Besonderheit darstellt.
    wildlife: >-
      Die Flora bildet den herausragendsten Reichtum: 1518 Gefässpflanzenarten wurden erfasst, von denen 43
      ausschliesslich im Munzur-Gebirge und 227 endemisch in der Türkei vorkommen. Zu den Pflanzen, die
      nirgendwo sonst auf der Welt wachsen, zählen die Munzur-Schneehuhn-Wicke, die Erzincan-Kirsche und
      lokale Veilchenarten.


      Die Säugetierfauna umfasst den [Braunbären](/especie/ursus_arctos/), der Höhlen und Felsspalten bewohnt
      und als Leitart des Parks gilt. Zudem streifen [Wolf](/especie/canis_lupus/), [Eurasischer
      Luchs](/especie/lynx_lynx/), [Fischotter](/especie/lutra_lutra/),
      [Wildkatze](/especie/felis_silvestris/), Dachs, Wildschwein und Wildziegen durch die Hänge, vertreten
      durch zwei Hochgebirgsarten: die krummhörnige Wildziege oder [Bezoarziege](/especie/capra_aegagrus/) und
      die [Gämse](/especie/rupicapra_rupicapra/).


      Am Himmel kreisen Adler, Geier, Falken und Milane neben dem seltenen Steinadler. Zu den gefährdeten
      Vogelarten gehören [Schwarzstorch](/especie/ciconia_nigra/), [Bartgeier](/especie/gypaetus_barbatus/),
      [Schmutzgeier](/especie/neophron_percnopterus/), [Gänsegeier](/especie/gyps_fulvus/),
      [Kaspikönigshuhn](/especie/tetraogallus_caspius/), [Östlicher Kaiseradler](/especie/aquila_heliaca/) und
      [Mauerläufer](/especie/tichodroma_muraria/). Nachts sind [Uhu](/especie/bubo_bubo/), Eulen und
      Fledermäuse häufig. Forellen bevölkern die klaren Flüsse Munzur und Mercan, während die Munzur-Quellen
      die seltene Bachforelle beherbergen.


      Wegen des Hochgebirgsklimas reicht das günstigste Besuchsfenster vom 15. Juni bis zum 27. August.
    visit: >-
      Die Anreise von Tunceli erfolgt über eine asphaltierte Landstrasse entlang des Munzur-Flusses bis nach
      Ovacık. Im Park bietet sich der nördliche Abschnitt des Mercan-Tals hervorragend für Trekking und
      Bergtouren an; der bewaldete südliche Teil wird gern für Picknick und Camping genutzt.


      Halbori Gözeleri und Ana Fatma sind die zentralen Anlaufpunkte im Tal. Im Tageserholungsgebiet Ana Fatma
      informiert ein Informations- und Verwaltungszentrum über den Nationalpark.
    history: >-
      Der Nationalpark wurde am 21. Dezember 1971 ausgewiesen und wird von der Generaldirektion für
      Naturschutz und Nationalparks betreut. Kultur, Mythologie und Glauben der Talgemeinschaften gelten als
      wesentliche Schutzgüter des Gebiets; die alevitische Bevölkerung verehrt die Natur als Teil ihrer
      religiösen Überzeugung, was entscheidend zur Erhaltung der Landschaft beiträgt.


      Gefahr droht durch wasserwirtschaftliche Eingriffe. 1985 begann der Bau eines Wasserkraftwerks am Fluss
      Mercan; spätere Untersuchungen bestätigten, dass die Anlagen innerhalb der Nationalparkgrenzen errichtet
      wurden.
    before: >-
      Die Gebirgskämme sind hoch und die Winter extrem, sodass das Sommerfenster kurz bleibt. Erkundige dich
      bei der Parkverwaltung über geöffnete Sektoren und Wegeverhältnisse.
    around: >-
      Weit entfernt auf Kreta teilen das [Lefka-Ori-Massiv](/lugar/macizo-de-lefka-ori/) und der
      [Samaria-Schlucht-Nationalpark](/lugar/samaria-national-park/) mit dem Munzur-Tal die Bezoarziege sowie
      schroffe Hochgebirgs- und Schluchthabitate.
  it:
    intro: >-
      L'acqua prorompe qui con vigore improvviso. Nei pressi dell'abitato di Ziyaret, tra dieci e quindici
      chilometri a ovest di Ovacık, il Munzur scaturisce dal sottosuolo attraverso spettacolari risorgenze e,
      già fiume imponente, solca i monti omonimi fino a gettarsi nell'Eufrate. Il Parco Nazionale della Valle
      di Munzur custodisce questo aspro percorso: dalle sorgenti venerate alle gole scoscese, e dai querceti
      di fondovalle sino alle vette che salgono a 3300 m, trapunte di laghi glaciali e conche vulcaniche dove
      pascolano capre selvatiche e orsi rifugiati negli anfratti carsici.
    landscape: >-
      Il parco prende avvio a 8 km dal centro urbano di Tunceli e segue la valle del fiume fino a Ovacık.
      Verso settentrione, i monti Munzur si innalzano sino a 3300 m, profondamente incisi dai solchi del
      Mercan e del Munzur. Sulle creste culminali, tra 2000 e 3000 m, si adagiano laghetti di circo e specchi
      d'acqua di cratere; nella piana di Ovacık zampillano le risorgive; e lungo l'intera forra si alternano
      pareti strapiombanti e cascate. Il lago Karagöl figura tra i maggiori bacini glaciali del massiccio. Nel
      sottosuolo si aprono varie cavità carsiche non ancora indagate in modo sistematico.


      Il clima è spiccatamente continentale, contrassegnato da inverni rigidi e imponenti nevicate.


      Il manto vegetale asseconda il rilievo. La quercia costituisce l'essenza arborea dominante, rivestendo
      crinali e colline ovunque la roccia consenta l'attecchimento. Lungo le sponde e nei greti si associano
      olmo, acero, ontano, frassino, platano, vite silvestre, betulla, noce, nocciolo, pioppo e salice. Ad
      appena 1,5 km a valle delle risorgenze del Munzur alligna un boschetto di betulle su entrambe le ripe,
      un albero inconsueto per la Turchia che rappresenta un emblema floristico locale.
    wildlife: >-
      La biodiversità botanica è il pregio maggiore: 1518 piante censite, delle quali 43 endemiche esclusive
      dei monti Munzur e 227 endemiche della Turchia. Tra i vegetali che non allignano in nessun altro luogo
      del pianeta risaltano un'astragalo locale (*Munzur kekliği*), il ciliegio di Erzincan e viole endemiche.


      Tra i mammiferi campeggia l'[orso bruno](/especie/ursus_arctos/), che abita cavità e forre rocciose
      rappresentando una specie bandiera del parco. Non mancano il [lupo](/especie/canis_lupus/), la [lince
      europea](/especie/lynx_lynx/), la [lontra](/especie/lutra_lutra/), il [gatto
      selvatico](/especie/felis_silvestris/), il tasso, il cinghiale e gli ungulati di rupe, presenti con due
      specie: la capra selvatica cornuta o [bezoar](/especie/capra_aegagrus/) e il
      [camoscio](/especie/rupicapra_rupicapra/).


      Nel cielo volteggiano aquile, avvoltoi, falchi e nibbi, compresa la rara aquila reale. Tra le specie
      avifaunistiche minacciate e protette figurano la [cicogna nera](/especie/ciconia_nigra/), il
      [gipeto](/especie/gypaetus_barbatus/), il [capovaccaio](/especie/neophron_percnopterus/), il
      [grifone](/especie/gyps_fulvus/), il [tetraogallo del Caspio](/especie/tetraogallus_caspius/), l'[aquila
      imperiale orientale](/especie/aquila_heliaca/) e il [picchio muraiolo](/especie/tichodroma_muraria/).
      Nelle ore notturne si fanno frequenti il [gufo reale](/especie/bubo_bubo/), altri strigiformi e i
      pipistrelli. Le trote pullulano nei fiumi Munzur e Mercan, mentre le risorgenze del Munzur accolgono la
      trota macrostigma.


      Per via delle condizioni climatiche montane, la finestra escursionistica più favorevole cade tra il 15
      giugno e il 27 agosto.
    visit: >-
      Da Tunceli si perviene percorrendo una comoda rotabile asfaltata che asseconda il fiume Munzur fino a
      Ovacık. All'interno dell'area protetta, il ramo settentrionale della valle del Mercan risulta il più
      vocato per il trekking e le escursioni d'alta quota; il versante meridionale, boscoso, è ideale per
      soste e campeggio.


      Halbori Gözeleri e Ana Fatma fungono da snodi primari per i visitatori. Presso l'area ricreativa di Ana
      Fatma è attivo un centro didattico e amministrativo del parco.
    history: >-
      Il parco nazionale venne proclamato il 21 dicembre 1971 sotto l'egida della Direzione Generale per la
      Conservazione della Natura e i Parchi Nazionali. Il patrimonio spirituale, le credenze e le leggende
      delle comunità valligiane sono tutelati alla stregua di beni culturali del parco; gli abitanti di fede
      alevita riveriscono la sacralità della natura, favorendo concretamente l'integrità dei luoghi.


      Le minacce ambientali provengono dallo sfruttamento idroelettrico. Nel 1985 presero avvio i cantieri di
      una diga lungo il fiume Mercan, con successive indagini che appurarono come le opere ricadessero
      all'interno del perimetro del parco nazionale.
    before: >-
      Le quote sono elevate e la stagione fredda è proibitiva, rendendo breve il periodo di agibilità.
      Informati presso l'ente gestore sullo stato della viabilità prima di intraprendere escursioni.
    around: >-
      Lontano da qui, a Creta, il [Massiccio di Lefka Ori](/lugar/macizo-de-lefka-ori/) e il [Parco Nazionale
      delle Gole di Samaria](/lugar/samaria-national-park/) condividono con Munzur la capra bezoar oltre agli
      ambienti rupestri d'alta quota e forra.
  pt:
    intro: >-
      A água brota aqui com força arrebatadora. Próximo da aldeia de Ziyaret, entre dez e quinze quilómetros a
      oeste de Ovacık, o Munzur irrompe das profundezas em nascentes monumentais e, tornado rio volumoso, abre
      caminho pelos montes homónimos até desaguar no Eufrates. O Parque Nacional do Vale de Munzur reúne esse
      percurso: desde as nascentes veneradas até às gargantas aprumadas, e dos carvalhais de vale até cumes
      que ascendem aos 3300 m com lagoas glaciares e de cratera, povoados por cabras-monteses e ursos
      abrigados em grutas.
    landscape: >-
      O parque principia a 8 km do centro de Tunceli e prolonga-se pelo vale do rio até Ovacık. A norte, os
      montes Munzur erguem-se até aos 3300 m, fragmentados pelos desfiladeiros dos rios Mercan e Munzur. Nas
      cumeadas, entre os 2000 e os 3000 m, repousam lagoas glaciares e de cratera; na planície de Ovacık
      brotam as ressurgências; e ao longo do vale desdobram-se canhões e cascatas. Karagöl sobressai como uma
      das lagoas glaciares maiores do maciço. No subsolo abrem-se várias cavernas cársticas por explorar de
      forma metódica.


      O clima é acentuadamente continental, com invernos gélidos e nevões copiosos.


      A vegetação acompanha a orografia. O carvalho é a árvore dominante, revestindo colinas e encostas onde a
      rocha cede espaço ao solo. No leito e nas margens associam-se ulmeiro, ácer, amieiro, freixo, plátano,
      videira-brava, bétula, nogueira, aveleira-brava, choupo e salgueiro. A escassos 1,5 km das nascentes do
      Munzur viceja um bosque de bétulas em ambas as margens, uma árvore invulgar na Turquia que se assume
      aqui como elemento vegetal emblemático.
    wildlife: >-
      A flora constitui o património mais notável: 1518 plantas inventariadas, das quais 43 são endemismos
      exclusivos dos montes Munzur e 227 endémicas da Turquia. Entre as espécies botânicas que não ocorrem em
      mais nenhum recanto da Terra figuram a ervilhaca de Munzur (*Munzur kekliği*), a cerejeira de Erzincan e
      violetas rupícolas.


      A fauna inclui o [urso-pardo](/especie/ursus_arctos/), que habita grutas e reentrâncias escarpadas como
      mamífero heráldico do parque. Ocorrem igualmente o [lobo](/especie/canis_lupus/), o
      [lince-euroasiático](/especie/lynx_lynx/), a [lontra](/especie/lutra_lutra/), o
      [gato-bravo](/especie/felis_silvestris/), o texugo, o javali e duas cabras de montanha: a
      cabra-selvagem-asiática ou [cabra-bezoar](/especie/capra_aegagrus/) e a
      [camurça](/especie/rupicapra_rupicapra/).


      No espaço aéreo cruzam-se águias, abutres, falcões e milhafres, além da rara águia-real. Entre as aves
      ameaçadas contam-se a [cegonha-preta](/especie/ciconia_nigra/), o
      [quebra-ossos](/especie/gypaetus_barbatus/), o [abutre-do-egito](/especie/neophron_percnopterus/), o
      [grifo](/especie/gyps_fulvus/), o [tetraogalo-do-cáspio](/especie/tetraogallus_caspius/), a
      [águia-imperial-oriental](/especie/aquila_heliaca/) e o
      [trepador-dos-muros](/especie/tichodroma_muraria/). À noite proliferam o
      [bufo-real](/especie/bubo_bubo/), outras corujas e morcegos. As trutas povoam os rios Munzur e Mercan,
      abrigando as nascentes a truta-de-pontos-vermelhos.


      Face aos rigores da montanha, a melhor época para visitação decorre de 15 de junho a 27 de agosto.
    visit: >-
      O acesso a partir de Tunceli faz-se por estrada asfaltada que acompanha o rio Munzur até Ovacık. No
      perímetro do parque, o setor norte do vale do Mercan revela-se o mais apropriado para caminhadas e
      trekking; o setor sul, florestado, adequa-se a campismo e merendas.


      Halbori Gözeleri e Ana Fatma configuram os pontos centrais de acolhimento. Na área de recreio de Ana
      Fatma funciona um centro pedagógico e administrativo ao dispor dos visitantes.
    history: >-
      O parque foi formalizado em 21 de dezembro de 1971, sob gestão da Direção-Geral de Conservação da
      Natureza e Parques Nacionais. A herança espiritual, ritos e mitologia das populações ribeirinhas são
      valorizados como atributos intrínsecos do parque; as comunidades alevis respeitam a sacralidade da
      natureza na sua prática de fé, contribuindo para a salvaguarda da paisagem.


      As pressões derivam do setor hídrico. Em 1985 arrancou a construção de uma barragem hidroelétrica no rio
      Mercan, tendo averiguações posteriores comprovado que a sua implantação violou os limites do parque
      nacional.
    before: >-
      As cristas são elevadas e os invernos glaciares, tornando curta a janela de visitação. Consulta
      previamente a administração sobre os setores transitáveis antes de viajar.
    around: >-
      A grande distância, em Creta, o [Maciço de Lefka Ori](/lugar/macizo-de-lefka-ori/) e o [Parque Nacional
      da Garganta de Samaria](/lugar/samaria-national-park/) partilham com Munzur a cabra-bezoar e os habitats
      escarpados de alta montanha e desfiladeiro.
