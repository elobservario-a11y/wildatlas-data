resumen:
  es: Valle íntimo meandriforme de acantilados calizos del Quercy salpicado de aldeas rupestres.
  en: Intimate meandering valley of Quercy limestone cliffs dotted with cliffside troglodyte hamlets.
  fr: Vallée intime et méandreuse de falaises calcaires du Quercy ponctuée de villages troglodytiques.
  de: Intimes, mäandrierendes Tal der Quercy-Kalkklippen mit malerischen Felsdörfern.
  it: Intima valle meandriforme tra le falesie calcaree del Quercy costellata di borghi rupestri.
  pt: Íntimo vale meandriforme de arribas calcárias do Quercy salpicado de aldeias troglodíticas.
unico:
  es: >-
    Un valle que reúne en pocos kilómetros acantilados ocres, plantas mediterráneas, cuevas con arte
    prehistórico y un cielo nocturno cuidado a propósito.
  en: >-
    A river valley gathering within a few kilometres ochre cliffs, Mediterranean flora, prehistoric painted
    caves and an intentionally preserved dark night sky.
  fr: >-
    Une vallée qui rassemble en quelques kilomètres falaises ocres, flore méditerranéenne, grottes ornées
    préhistoriques et ciel nocturne protégé.
  de: >-
    Ein Tal, das auf wenigen Kilometern ockerfarbene Klippen, mediterrane Flora, Bilderhöhlen der Steinzeit
    und einen geschützten Nachthimmel vereint.
  it: >-
    Una valle fluviale che racchiude in pochi chilometri falesie ocra, flora mediterranea, grotte d'arte
    rupestre e un cielo notturno scrupolosamente tutelato.
  pt: >-
    Um vale que congrega em escassos quilómetros escarpas de ocre, flora mediterrânica, grutas com arte
    pré-histórica e um céu noturno protegido.
observaciones:
  es: >-
    Las crecidas del Célé pueden ser bruscas tras las tormentas, así que mira el cielo si piensas en la canoa.
    La mejor época va de mayo a octubre. La confluencia del Célé con el Lot es una puerta de entrada al valle.
texto:
  es:
    intro: >-
      Su nombre significa «rápido», y el Célé hace honor a él: cuando los veranos no son demasiado secos, baja
      vivo entre muros de caliza que unas veces son negros y blancos y otras ocres. Nace a 713 m en el Macizo
      Central y recorre 104,4 km hasta echarse al Lot en Bouziès, cerca de Saint-Cirq-Lapopie. Su curso es
      casi paralelo al del Lot, y el valle, que se esconde entre los altiplanos calizos de los Causses du
      Quercy, es mucho más secreto.
    landscape: >-
      El río va grabando su paso en los altiplanos calizos y, al seguirlo, las paredes se abren para mostrar
      sus cuevas oscuras, decoradas con dibujos prehistóricos, sus pueblos, sus casas trogloditas y sus
      molinos. Uno de ellos, el de la Pescalerie, cerca de Cabrerets, es semitroglodita y está construido
      sobre la surgencia de un río subterráneo que viene del causse de Gramat.


      El valle está profundamente excavado en la roca caliza y tiene acantilados abruptos. Los aleros
      orientados al sur de las laderas rocosas son más cálidos, y allí crecen numerosas plantas mediterráneas
      del Quercy. El Célé es un río de lluvia: sus caudales saltan, las aguas altas llegan en invierno y
      primavera, las bajas en verano, de julio a septiembre, y las crecidas tras una tormenta pueden ser
      bruscas.
    wildlife: >-
      En los acantilados altos de Marcilhac anidan la golondrina roquera, el cuervo grande, la grajilla y el
      [halcón peregrino](/especie/falco_peregrinus/). En los acantilados del antiguo pueblo de
      Sauliac-sur-Célé anidan golondrinas y, sobre todo, murciélagos. Esos acantilados forman parte de un
      sitio Natura 2000.


      La noche es otra estación del valle. En Corn hay un sendero nocturno de 4 km, fácil y accesible, para
      recorrer bajo las estrellas. Cinco paneles fosforescentes explican la fauna, la geología, el patrimonio
      y el cielo estrellado, y el sendero está pensado para preservar la calidad del cielo nocturno de los
      Causses du Quercy.
    visit: >-
      A pie, el eje es el GR 651, la «voie du Célé», una variante del Camino de Santiago que recorre el valle
      de causse en causse y junto al río. De Bouziès a Béduer son 55,3 km, y se pueden hacer en tres etapas.


      Para tramos cortos, la Balade de Marcilhac permite contemplar desde el itinerario el Célé, sus
      acantilados ocres, la vegetación mediterránea y las praderas del fondo. El camino de Pierre-Levée ofrece
      vistas notables del valle y de sus acantilados ocres, y cruza un paraje Natura 2000 a lo largo de los
      acantilados del antiguo pueblo de Sauliac-sur-Célé; ahí se ven muros y casetas de piedra seca y hasta un
      dolmen. Recorrer el Célé en canoa es accesible aunque algunos pasos son más delicados.


      La cueva de Pech Merle, en Cabrerets, se visita en una hora y permite retroceder 25.000 años.
    history: >-
      La piedra seca de los muros y las casetas es parte de la identidad de los causses. Gran parte del valle
      está dentro del Parque Natural Regional y Geoparque Mundial UNESCO de los Causses du Quercy, que
      coordina el polo de naturaleza del valle: va de Bagnac-sur-Célé a la confluencia con el Lot, incluye el
      valle del Vers y parte de los causses y reúne 50 municipios.
    before: >-
      Las crecidas del Célé pueden ser bruscas tras las tormentas, así que mira el cielo si piensas en la
      canoa. La mejor época va de mayo a octubre. La confluencia del Célé con el Lot es una puerta de entrada
      al valle.
    around: A quince kilómetros están las [Gargantas del Aveyron](/lugar/gorges-de-l-aveyron/).
  en:
    intro: >-
      Its name means «swift», and the Célé lives up to it: whenever summers are not excessively dry, it flows
      briskly between limestone bluffs that alternate between black and white and warm ochre. Rising at 713 m
      in the Massif Central, it winds for 104.4 km before emptying into the Lot at Bouziès near
      Saint-Cirq-Lapopie. Its course runs almost parallel to the Lot, but the valley, tucked away among the
      limestone plateaus of the Causses du Quercy, is far more secret.
    landscape: >-
      The river carves its course deeply through the limestone plateaus, and as you follow its banks, the
      cliff walls reveal dark caves decorated with prehistoric art, ancient stone hamlets, troglodytic
      dwellings and old watermills. One of these, the Pescalerie mill near Cabrerets, is semi-troglodytic and
      built directly over the resurgence of a subterranean river issuing from the Causse de Gramat.


      The valley is deeply incised into the limestone, flanked by sheer cliffs. South-facing rock ledges are
      noticeably warmer, nurturing numerous Quercy Mediterranean plants. The Célé is a rain-fed river:
      discharge fluctuates widely, high waters arrive in winter and spring, low water in summer from July to
      September, and post-storm flash floods can be sudden.
    wildlife: >-
      On the high cliffs of Marcilhac nest Eurasian crag martin, common raven, western jackdaw and [peregrine
      falcon](/especie/falco_peregrinus/). The cliffs around the old abandoned village of Sauliac-sur-Célé
      shelter swifts and, above all, bat colonies. These precipices form part of a Natura 2000 protected site.


      Night brings another dimension to the valley. At Corn, an easy and accessible 4 km night trail invites
      stargazing walks. Five phosphorescent interpretive boards explain nocturnal fauna, geology, heritage and
      the dark sky, reflecting the valley's commitment to protecting the starry night skies of the Causses du
      Quercy.
    visit: >-
      On foot, the primary spine is the GR 651 («Voie du Célé»), a scenic variant of the Camino de Santiago
      traversing the valley from causse to causse and along the riverbank. From Bouziès to Béduer is 55.3 km,
      comfortably completed in three stages.


      For shorter strolls, the Balade de Marcilhac offers panoramic views over the Célé, its ochre bluffs,
      Mediterranean vegetation and bottomland meadows. The Pierre-Levée trail yields striking perspectives
      over the valley cliffs and crosses a Natura 2000 sector along the old village of Sauliac-sur-Célé,
      passing drystone huts, walls and a megalithic dolmen. Canoeing the Célé is accessible to all, though
      several minor rapids require attention.


      The Pech Merle cave in Cabrerets takes one hour to visit, carrying you back 25,000 years in human
      artistry.
    history: >-
      Drystone walls and shepherd shelters (*gariottes*) define the cultural identity of the causses. Much of
      the valley falls within the Causses du Quercy Regional Natural Park and UNESCO Global Geopark, which
      coordinates the valley's eco-tourism pole: reaching from Bagnac-sur-Célé to the Lot confluence,
      including the Vers valley and causse plateaus, uniting 50 municipalities.
    before: >-
      Flash floods on the Célé can happen rapidly after thunderstorms, so monitor the weather closely before
      setting out in a canoe. The best visiting season runs from May to October. The confluence of the Célé
      and Lot provides an atmospheric gateway.
    around: Fifteen kilometres away lie the [Aveyron Gorges](/lugar/gorges-de-l-aveyron/).
  fr:
    intro: >-
      Son nom signifie « rapide », et le Célé lui fait honneur : quand les étés ne sont pas trop secs, il
      descend vif entre des murailles de calcaire tantôt noires et blanches, tantôt ocres. Né à 713 m dans le
      Massif central, il parcourt 104,4 km avant de se jeter dans le Lot à Bouziès, près de
      Saint-Cirq-Lapopie. Son cours est presque parallèle à celui du Lot, mais la vallée, cachée entre les
      plateaux calcaires des Causses du Quercy, est bien plus secrète.
    landscape: >-
      La rivière s'enfonce dans les plateaux calcaires et, au fil de l'eau, les falaises s'ouvrent pour
      dévoiler leurs grottes obscures ornées de peintures préhistoriques, leurs villages de pierre, leurs
      maisons troglodytiques et leurs moulins. L'un d'eux, le moulin de la Pescalerie près de Cabrerets, est
      semi-troglodytique et bâti sur la résurgence d'une rivière souterraine venue du causse de Gramat.


      La vallée est profondément entaillée dans le calcaire et présente des falaises abruptes. Les corniches
      rocheuses exposées au sud sont plus chaudes, accueillant de nombreuses plantes méditerranéennes du
      Quercy. Le Célé est une rivière pluviale : ses débits varient fortement, les hautes eaux surviennent en
      hiver et au printemps, l'étiage en été de juillet à septembre, et les crues d'orage peuvent être
      brutales.
    wildlife: >-
      Sur les hautes falaises de Marcilhac nichent l'hirondelle de rochers, le grand corbeau, le choucas des
      tours et le [faucon pèlerin](/especie/falco_peregrinus/). Les parois de l'ancien village de
      Sauliac-sur-Célé abritent martinets et colonies de chauves-souris. Ces falaises font partie d'un site
      Natura 2000.


      La nuit est une autre saison de la vallée. À Corn, un sentier nocturne de 4 km, facile et accessible,
      invite à marcher sous les étoiles. Cinq panneaux phosphorescents présentent la faune, la géologie, le
      patrimoine et la voûte céleste, conçus pour préserver la qualité du ciel nocturne des Causses du Quercy.
    visit: >-
      À pied, l'axe majeur est le GR 651, la « voie du Célé », variante du chemin de Compostelle qui arpente
      la vallée de causse en causse et au bord de l'eau. De Bouziès à Béduer, il compte 55,3 km réalisables en
      trois étapes.


      Pour de courts parcours, la Balade de Marcilhac permet d'admirer le Célé, ses falaises ocres, la
      végétation méditerranéenne et les prairies alluviales. Le sentier de la Pierre-Levée offre des vues
      remarquables et traverse un secteur Natura 2000 le long des falaises de Sauliac-sur-Célé, avec murets de
      pierre sèche et dolmen. Descendre le Célé en canoë est accessible à tous, malgré quelques passages plus
      vifs.


      La grotte du Pech Merle à Cabrerets se visite en une heure et permet de remonter 25 000 ans en arrière.
    history: >-
      La pierre sèche des murs et des cazelles forge l'identité des causses. Une grande partie de la vallée
      est comprise dans le Parc naturel régional et Géoparc mondial UNESCO des Causses du Quercy, qui anime le
      pôle nature de la vallée : il s'étend de Bagnac-sur-Célé au confluent du Lot, inclut la vallée du Vers
      et réunit 50 communes.
    before: >-
      Les crues du Célé peuvent être soudaines après les orages : surveillez le ciel si vous prévoyez une
      sortie en canoë. La meilleure saison va de mai à octobre. La confluence avec le Lot forme une porte
      d'entrée grandiose.
    around: À quinze kilomètres s'étendent les [gorges de l'Aveyron](/lugar/gorges-de-l-aveyron/).
  de:
    intro: >-
      Sein Name bedeutet «schnell», und der Célé macht ihm alle Ehre: Wenn die Sommer nicht zu trocken
      ausfallen, fließt er munter zwischen Kalkfelswänden dahin, die bald schwarz-weiß, bald ockerfarben
      leuchten. Er entspringt auf 713 m im Zentralmassiv und legt 104,4 km zurück, ehe er bei Bouziès nahe
      Saint-Cirq-Lapopie in den Lot mündet. Sein Lauf verläuft fast parallel zum Lot, doch das zwischen den
      Kalkhochflächen der Causses du Quercy verborgene Tal ist ungleich geheimnisvoller.
    landscape: >-
      Der Fluss gräbt sich tief in die Kalkplateaus ein, und seinen Windungen folgend öffnen sich die
      Steilwände zu dunklen Höhlen mit prähistorischen Wandmalereien, Steindörfern, Höhlenwohnungen und
      Wassermühlen. Eine davon, die Mühle von Pescalerie bei Cabrerets, ist halb in den Fels gehauen und über
      der Karstquelle eines unterirdischen Flusses vom Causse de Gramat errichtet.


      Das Tal ist tief in den Kalkstein eingeschnitten und besitzt steile Felsabstürze. Die südexponierten
      Felssimse sind wärmebegünstigt; dort gedeihen zahlreiche mediterrane Pflanzenarten des Quercy. Der Célé
      ist ein Regenfluss: Seine Wasserstände schwanken stark, Hochwasser tritt im Winter und Frühjahr auf,
      Niedrigwasser im Sommer von Juli bis September, und Unwetterfluten können überraschend hereinbrechen.
    wildlife: >-
      An den hohen Klippen von Marcilhac brüten Felsenschwalbe, Kolkrabe, Dohle und
      [Wanderfalke](/especie/falco_peregrinus/). Die Felswände des verlassenen Altdorfs Sauliac-sur-Célé
      beherbergen Schwalben und Fledermauskolonien. Diese Steilwände gehören zu einem Natura 2000-Gebiet.


      Die Nacht ist eine eigene Jahreszeit im Tal. In Corn lädt ein 4 km langer Nachtwanderweg, leicht und
      barrierearm, zu Wanderungen unterm Sternenhimmel ein. Fünf phosphoreszierende Schautafeln erläutern
      Fauna, Geologie, Kultur und Sternenbilder und tragen zum Schutz des Nachthimmels der Causses du Quercy
      bei.
    visit: >-
      Zu Fuß bildet der GR 651 («Voie du Célé»), eine Variante des Jakobswegs, die Leitlinie des Tals von
      Causse zu Causse und am Wasser entlang. Von Bouziès nach Béduer sind es 55,3 km, bequem in drei Etappen
      wanderbar.


      Für kürzere Spaziergänge erschließt die Balade de Marcilhac schöne Ausblicke auf den Célé, ockerfarbene
      Klippen und Talauen. Der Weg Pierre-Levée bietet weite Blicke auf die Steilwände, quert ein Natura
      2000-Areal entlang von Sauliac-sur-Célé und passiert Trockenmauern, Steinhütten und einen Dolmen.
      Kanufahrten auf dem Célé sind gut machbar, auch wenn einige Schwälle Aufmerksamkeit verlangen.


      Die Höhle Pech Merle in Cabrerets ist in einer Stunde besichtigt und führt 25.000 Jahre in die
      Menschheitsgeschichte zurück.
    history: >-
      Das Trockenmauerwerk der Mauern und Steinhütten (*gariottes*) prägt das Gesicht der Causses. Ein
      Großteil des Tals gehört zum Regionalen Naturpark und UNESCO Global Geopark Causses du Quercy, der das
      Ökotourismus-Zentrum des Tals von Bagnac-sur-Célé bis zur Lot-Mündung koordiniert und 50 Gemeinden
      umfasst.
    before: >-
      Gewitterfluten können auf dem Célé rasch anschwellen; behalte bei Kanutouren das Wetter im Blick. Die
      beste Reisezeit reicht von Mai bis Oktober. Der Zusammenfluss mit dem Lot bietet ein eindrucksvolles
      Eingangstor ins Tal.
    around: Fünfzehn Kilometer entfernt liegen die [Aveyron-Schluchten](/lugar/gorges-de-l-aveyron/).
  it:
    intro: >-
      Il suo nome significa «rapido», e il Célé gli rende merito: quando le estati non sono aride, scende
      vivace tra muraglie di calcare ora bianche e nere, ora ocra dorato. Nasce a 713 m nel Massiccio Centrale
      e scorre per 104,4 km prima di confluire nel Lot a Bouziès, vicino a Saint-Cirq-Lapopie. Il suo corso è
      quasi parallelo a quello del Lot, ma la valle, rintanata tra gli altopiani calcarei dei Causses du
      Quercy, è assai più segreta.
    landscape: >-
      Il fiume incide profondamente gli altopiani calcarei e, seguendone le sponde, le pareti si aprono
      mostrando cavità buie decorate con pitture rupestri, borghi in pietra, dimore trogloditiche e mulini ad
      acqua. Uno di questi, il mulino della Pescalerie presso Cabrerets, è semitrogloditico ed eretto sulla
      risorgiva di un corso sotterraneo originato nel causse di Gramat.


      La valle è profondamente scavata nella roccia con pareti scoscese. Le cenge rocciose esposte a sud sono
      più calde, ospitando numerose piante mediterranee del Quercy. Il Célé è un fiume a regime pluviale: le
      portate oscillano vistosamente, le piene giungono in inverno e primavera, le magre tra luglio e
      settembre, e le piene estemporanee dopo i temporali possono risultare violente.
    wildlife: >-
      Sulle alte falesie di Marcilhac nidificano il rondine montana, il corvo imperiale, la taccola e il
      [falco pellegrino](/especie/falco_peregrinus/). Sulle rupi dell'antico borgo di Sauliac-sur-Célé
      alloggiano rondoni e colonie di pipistrelli. Queste pareti ricadono in un sito Natura 2000.


      La notte rappresenta un'altra dimensione della valle. A Corn un sentiero notturno di 4 km, facile e
      accessibile, invita a camminare sotto la volta stellata. Cinque pannelli fosforescenti illustrano fauna,
      geologia e cielo notturno, ideati per preservare l'eccellente qualità del cielo stellato dei Causses du
      Quercy.
    visit: >-
      A piedi, la direttrice principale è il GR 651 («voie du Célé»), suggestiva variante del Cammino di
      Santiago che percorre la valle di causse in causse lungo il corso d'acqua. Da Bouziès a Béduer misura
      55,3 km, percorribili in tre tappe.


      Per passeggiate brevi, la Balade de Marcilhac offre scorci panoramici sul Célé, le falesie ocra, la
      macchia mediterranea e i prati golenali. Il sentiero della Pierre-Levée schiude vedute grandiose e
      attraversa un'area Natura 2000 lungo Sauliac-sur-Célé, tra muretti a secco e un dolmen megalitico.
      Discendere il Célé in canoa è facile e accessibile a tutti, pur richiedendo attenzione su alcuni
      passaggi.


      La grotta di Pech Merle a Cabrerets si visita in un'ora e conduce a 25.000 anni nel passato
      dell'umanità.
    history: >-
      La pietra a secco di muri e capanni (*gariottes*) costituisce l'identità rurale dei causses. Gran parte
      della valle ricade nel Parco Naturale Regionale e Geoparco Mondiale UNESCO dei Causses du Quercy, che
      coordina le iniziative naturalistiche tra Bagnac-sur-Célé e il Lot, toccando 50 comuni.
    before: >-
      Le piene del Célé possono risultare repentine dopo forti temporali: controlla le previsioni meteo prima
      di noleggiare una canoa. La stagione consigliata va da maggio a ottobre. La confluenza nel Lot regala
      un'entrata memorabile.
    around: A quindici chilometri si estendono le [Gole dell'Aveyron](/lugar/gorges-de-l-aveyron/).
  pt:
    intro: >-
      O seu nome significa «veloz», e o Célé faz-lhe justiça: quando os estios não são excessivamente secos,
      corre lesto entre muralhas de calcário ora negras e brancas, ora em tons quentes de ocre. Nasce a 713 m
      no Maciço Central e serpenteia ao longo de 104,4 km até desembocar no Lot em Bouziès, próximo de
      Saint-Cirq-Lapopie. O seu percurso corre quase paralelo ao do Lot, mas o vale, oculto entre os planaltos
      calcários dos Causses du Quercy, é muito mais secreto.
    landscape: >-
      O rio vai gravando o seu traçado nos planaltos calcários e, ao acompanhá-lo, as escarpas abrem-se para
      revelar grutas escuras com pinturas rupestres, aldeias de pedra, casas troglodíticas e moinhos de água.
      Um deles, o da Pescalerie perto de Cabrerets, é semitroglodítico e assenta sobre a ressurgência de um
      rio subterrâneo proveniente do causse de Gramat.


      O vale está profundamente escavado no calcário com arribas verticais. As cornijas viradas a sul são mais
      tépidas, acolhendo plantas mediterrânicas do Quercy. O Célé é um rio pluvial: os caudais variam
      bruscamente, as águas altas ocorrem no inverno e primavera, a estiagem no verão de julho a setembro, e
      as cheias pós-trovoada podem ser repentinas.
    wildlife: >-
      Nas altas escarpas de Marcilhac nidificam a andorinha-das-rochas, o corvo-comum, a
      gralha-de-nuca-cinzenta e o [falcão-peregrino](/especie/falco_peregrinus/). As arribas da antiga aldeia
      de Sauliac-sur-Célé abrigam andorinhões e colónias de morcegos. Estas arribas integram um sítio Natura
      2000.


      A noite constitui outra dimensão do vale. Em Corn existe um percurso noturno de 4 km, acessível e fácil,
      para caminhar sob o manto estrelado. Cinco painéis fosforescentes interpretam a fauna, geologia e
      constelações, concebidos para preservar o céu escuro dos Causses du Quercy.
    visit: >-
      A pé, a rota principal é o GR 651 («voie du Célé»), variante cénica do Caminho de Santiago que percorre
      o vale de causse em causse e junto à margem. De Bouziès a Béduer são 55,3 km, divididos em três etapas.


      Para caminhadas curtas, o passeio de Marcilhac permite apreciar o Célé, as arribas de ocre, a vegetação
      mediterrânica e os prados de várzea. O trilho de Pierre-Levée desvenda panorâmicas do vale e cruza um
      setor Natura 2000 junto a Sauliac-sur-Célé, com muros de pedra seca e um dólmen. Descer o Célé em canoa
      é acessível, embora alguns rápidos peçam atenção.


      A gruta de Pech Merle, em Cabrerets, visita-se numa hora e recua 25.000 anos na história da arte humana.
    history: >-
      A pedra seca dos muros e das cabanas (*gariottes*) molda a identidade dos causses. Grande parte do vale
      integra o Parque Natural Regional e Geoparque Mundial UNESCO dos Causses du Quercy, que dinamiza o polo
      de natureza do vale entre Bagnac-sur-Célé e a foz no Lot, abrangendo 50 municípios.
    before: >-
      As cheias do Célé podem surgir depressa após trovoadas: vigia o tempo se planeares andar de canoa. A
      melhor época decorre de maio a outubro. A confluência com o Lot marca uma soberba entrada no vale.
    around: A quinze quilómetros estendem-se as [Gargantas do Aveyron](/lugar/gorges-de-l-aveyron/).
