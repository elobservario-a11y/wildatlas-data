unico:
  es: >-
    Un bosque que crece sobre andesita volcánica, con hayas, abetos y píceas de estructura compleja, y con el
    oso, el lobo y el lince en lo más alto de la cadena trófica.
  en: >-
    An ancient woodland rooted in volcanic andesite, mixing beech, silver fir, and spruce in complex
    structures, crowned by brown bear, wolf, and lynx atop the food web.
  fr: >-
    Une forêt enracinée sur des andésites volcaniques, mêlant hêtres, sapins et épicéas aux structures
    complexes, couronnée par l’ours, le loup et le lynx.
  de: >-
    Ein Urwald auf vulkanischem Andesit mit strukturreichen Buchen, Tannen und Fichten sowie Bär, Wolf und
    Luchs an der Spitze der Nahrungskette.
  it: >-
    Un bosco primordiale radicato su andesite vulcanica, con faggi, abeti bianchi e abeti rossi a struttura
    complessa, sovrastato da orso, lupo e lince.
  pt: >-
    Uma mata secular sobre andesito vulcânico, misturando faias, abetos e espruces de estrutura complexa, com
    o urso, o lobo e o lince no topo da teia trófica.
observaciones:
  es: >-
    Tratándose de una reserva estricta, no esperes una red de senderos: pregunta al distrito forestal antes de
    organizar la salida. Los mejores meses van de junio a octubre.
texto:
  es:
    intro: >-
      Bajo la cumbre de los montes Țibleș, en el extremo norte de los Cárpatos Orientales, quedan dos retazos
      de bosque donde nadie ha tocado el reloj. Se llaman Izvorul Șurii y Preluci, miden unas 210,5 y 135,80
      hectáreas, y son los componentes UNESCO de Groșii Țibleșului: hayedos puros y mixtos con abeto y pícea,
      con árboles de edad y tamaño excepcionales. Es una reserva estricta.
    landscape: >-
      Los bosques de Groșii Țibleșului están en el macizo de Țibleș, en el norte de los Cárpatos Orientales,
      entre 760 y 1460 metros de altitud. Los montes Țibleș forman un grupo de los Cárpatos de Maramureș y
      Bucovina, con el Vârful Bran como punto más alto, a 1840 metros. El suelo ácido se formó sobre andesita
      con piroxenos de origen volcánico neógeno.


      Los dos componentes UNESCO, con una zona de amortiguación común de 563,6 hectáreas, conservan hayedos
      puros y mixtos con abeto y pícea, masas puras de pícea y pequeñas turberas oligotróficas. Los rodales
      destacan por su estructura compleja, su alta naturalidad y sus árboles excepcionales. La página
      ministerial nombra las cumbres Groapa, Ștevioara, Tomnatic-Groși, Prelucilor y Piatra Rea.
    wildlife: >-
      En estos bosques viven el [oso pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/) y el
      [lince](/especie/lynx_lynx/), los grandes carnívoros del nivel superior de la cadena trófica. Con ellos
      conviven el ciervo, el corzo, el [jabalí](/especie/sus_scrofa/), el gato montés, la marta y el zorro.
      Entre las aves aparecen el [halcón peregrino](/especie/falco_peregrinus/), el [halcón
      abejero](/especie/pernis_apivorus/), el gavilán, el cernícalo y dos rapaces nocturnas, el cárabo común y
      el cárabo uralense, además del [picamaderos negro](/especie/dryocopus_martius/).


      La flora define el bosque tanto como la fauna: păştiţă, clopoţei, orbalţ, rogoz y slăbănog son las
      plantas características, a las que se suman năpraznic, brustur negru, călugăr, Cardamine glanduligera,
      luşcuţe y brânduşe. El mejor momento para acercarse a la zona va de junio a octubre.
    visit: >-
      No hay senderos, observatorios ni centro de visitantes publicados para estos rodales, un bosque de
      pendientes escarpadas. El distrito forestal de Groșii Țibleșului, que gestiona unas 12226 hectáreas, es
      quien puede indicar qué sectores están abiertos y en qué condiciones.


      Mientras tanto, el pueblo de Groșii Țibleșului queda al pie de los montes Țibleș, en el valle del Suciu,
      y es la puerta natural al macizo.
    history: >-
      El conjunto transnacional de hayedos documenta cómo la especie recolonizó Europa tras la última
      glaciación sin alteraciones. Groșii Țibleșului y Strâmbu Băiuț enlazan con otros componentes UNESCO de
      los Cárpatos ucranianos, de modo que forman parte de una red de bosques que protege los hayedos más
      extensos y menos alterados.


      El sitio de importancia comunitaria ROSCI0411 Groșii Țibleșului se declaró en 2016 y cubre 927
      hectáreas.
    before: >-
      Tratándose de una reserva estricta, no esperes una red de senderos: pregunta al distrito forestal antes
      de organizar la salida. Los mejores meses van de junio a octubre.
    around: >-
      A tres kilómetros está el [Bosque Primario de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), otro
      componente de la misma red de hayedos. A veinte kilómetros queda el [Parque Natural Montañas de
      Maramureș](/lugar/parcul-natural-muntii-maramuresului/) y a veintiuno el [Parque Nacional Montañas de
      Rodna](/lugar/parcul-national-muntii-rodnei/).


      Con especies y bosque primario en común, aunque más lejos, aparecen el [Bosque Virgen de
      Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), el [Bosque Virgen de
      Vihorlat](/lugar/prales-vihorlat---morske-oko/), la [Reserva Natural Estricta
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) y el [Bosque Primario de
      Krokar](/lugar/pragozd-krokar/).
  en:
    intro: >-
      Beneath the crest of the Țibleș Mountains, at the northern margin of the Eastern Carpathians, survive
      two enclaves of primeval forest where biological time has never been disrupted. Known as Izvorul Șurii
      and Preluci, covering roughly 210.5 and 135.80 hectares respectively, they constitute the UNESCO World
      Heritage components of Groșii Țibleșului: pure beech and mixed beech-fir-spruce woodlands harboring
      trees of remarkable age and monumental dimensions. It is an integral wilderness reserve.
    landscape: >-
      The forests of Groșii Țibleșului cloak the Țibleș Massif in the northern Eastern Carpathians, between
      760 and 1460 metres in elevation. The Țibleș range forms a subgroup within the Maramureș and Bukovina
      Carpathians, peaking at Vârful Bran at 1840 metres. The acidic forest soils formed over Neogene pyroxene
      andesite of volcanic origin.


      The two UNESCO component sectors, protected by a shared buffer zone of 563.6 hectares, preserve pure
      beech stands alongside mixed stands of silver fir and Norway spruce, pure subalpine spruce belts, and
      small oligotrophic peat bogs. The forest compartments stand out for their multi-layered vertical
      structure, absolute naturalness, and ancient canopy giants. Official records cite the surrounding peaks
      of Groapa, Ștevioara, Tomnatic-Groși, Prelucilor, and Piatra Rea.
    wildlife: >-
      These wild Carpathians shelter the [brown bear](/especie/ursus_arctos/), the [grey
      wolf](/especie/canis_lupus/), and the [Eurasian lynx](/especie/lynx_lynx/), the large carnivores
      presiding at the apex of the food chain. Alongside them live red deer, roe deer, [wild
      boar](/especie/sus_scrofa/), European wildcat, pine marten, and red fox. Notable forest avifauna
      includes the [peregrine falcon](/especie/falco_peregrinus/), the [European honey
      buzzard](/especie/pernis_apivorus/), Eurasian sparrowhawk, common kestrel, and two nocturnal hunters—the
      tawny owl and Ural owl—as well as the [black woodpecker](/especie/dryocopus_martius/).


      The ground flora defines the forest ecosystem just as vividly as its animals: wood anemones,
      bellflowers, herb Paris, sedges, and touch-me-not balsam are characteristic species, joined by herb
      Robert, black butterbur, monkshood, *Cardamine glanduligera*, spring snowflakes, and autumn crocuses.
      The ideal season to visit the surrounding valleys runs from June to October.
    visit: >-
      No designated trails, viewpoints, or visitor centres are established within these core stands, which
      cling to exceptionally steep mountain terrain. The Groșii Țibleșului Forest District, overseeing roughly
      12226 hectares of montane woodland, is the authoritative body able to advise on accessible peripheral
      sectors and legal access protocols.


      Meanwhile, the mountain village of Groșii Țibleșului sits at the foot of the Țibleș range in the Suciu
      Valley, serving as the traditional gateway to the massif.
    history: >-
      The transnational Ancient and Primeval Beech Forests network documents how European beech recolonized
      the continent following the last glaciation without anthropogenic disturbance. Groșii Țibleșului and
      Strâmbu Băiuț connect with other UNESCO beech components in the Ukrainian Carpathians, anchoring an
      international chain that preserves Europe’s most intact forest expanses.


      The Site of Community Importance ROSCI0411 Groșii Țibleșului was officially designated in 2016 and
      encompasses 927 hectares.
    before: >-
      As an integral reserve, do not expect marked tourist footpaths: consult the local forest district prior
      to planning any trip. Optimal mountain months span June to October.
    around: >-
      Three kilometres away lies the [Strâmbu-Băiuț Ancient Beech
      Forest](/lugar/codrul-secular-strambu-baiut/), a sister component within the same World Heritage
      network. Twenty kilometres away sits the [Maramureș Mountains Natural
      Park](/lugar/parcul-natural-muntii-maramuresului/), and twenty-one kilometres distant is [Rodna
      Mountains National Park](/lugar/parcul-national-muntii-rodnei/).


      Further across the Carpathians and Dinarides, other undisturbed primeval forests share comparable apex
      fauna and virgin beech structures: [Janj Strict Nature Reserve Primeval
      Forest](/lugar/prasuma-janj-strogi-rezervat-prirode/), [Vihorlat Primeval Forest - Morské
      Oko](/lugar/prales-vihorlat---morske-oko/), [Havešová Strict Nature
      Reserve](/lugar/narodna-prirodna-rezervacia-havesova/), and [Krokar Virgin
      Forest](/lugar/pragozd-krokar/).
  fr:
    intro: >-
      Sous les cimes des monts Țibleș, à l’extrême nord des Carpates orientales, subsistent deux sanctuaires
      forestiers où nul n’a jamais perturbé le cours du temps. Nommés Izvorul Șurii et Preluci, couvrant
      respectivement 210,5 et 135,80 hectares, ils forment les composantes UNESCO de Groșii Țibleșului : des
      hêtraies pures et mixtes à sapin et épicéa abritant des arbres d’âge et de stature exceptionnels. C’est
      une réserve intégrale.
    landscape: >-
      Les forêts de Groșii Țibleșului habillent le massif du Țibleș, dans le nord des Carpates orientales,
      entre 760 et 1460 mètres d’altitude. Les monts Țibleș constituent un chaînon des Carpates de Maramureș
      et de Bucovine, culminant au Vârful Bran à 1840 mètres. Les sols acides reposent sur des andésites à
      pyroxènes d’origine volcanique néogène.


      Les deux composantes UNESCO, protégées par une zone tampon commune de 563,6 hectares, préservent des
      hêtraies pures ainsi que des peuplements mixtes associant sapin pectiné et épicéa commun, des pessières
      d’altitude et de minuscules tourbières oligotrophes. Ces parcelles se distinguent par leur étagement
      vertical complexe, leur naturalité absolue et leurs vieux arbres monumentaux. Les documents officiels
      recensent les sommets de Groapa, Ștevioara, Tomnatic-Groși, Prelucilor et Piatra Rea.
    wildlife: >-
      Ces forêts abritent l’[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/) et le [lynx
      boréal](/especie/lynx_lynx/), les trois grands prédateurs dominant la chaîne alimentaire. Ils cohabitent
      avec le cerf élaphe, le chevreuil, le [sanglier](/especie/sus_scrofa/), le chat forestier, la martre des
      pins et le renard roux. Parmi les oiseaux figurent le [faucon pèlerin](/especie/falco_peregrinus/), la
      [bondrée apivore](/especie/pernis_apivorus/), l’épervier d’Europe, le faucon crécerelle et deux rapaces
      nocturnes, la chouette hulotte et la chouette de l’Oural, sans oublier le [pic
      noir](/especie/dryocopus_martius/).


      Le sous-bois caractérise la forêt avec autant de vigueur que la faune : anémones sylvies, campanules,
      parisettes, laîches et balsamines des bois composent le tapis végétal, rejoints par l’herbe à Robert, le
      pétasite blanc, l’aconit, *Cardamine glanduligera*, la nivéole printanière et le safran d’automne. La
      meilleure période pour approcher les abords du massif s’étend de juin à octobre.
    visit: >-
      Il n’existe aucun sentier balisé, observatoire ni maison du parc au sein de ces peuplements primitifs
      campés sur des pentes abruptes. Le district forestier de Groșii Țibleșului, qui administre environ 12226
      hectares de forêts montagnardes, est le seul interlocuteur à même d’indiquer les zones périphériques
      accessibles et les consignes de sécurité.


      Le village de Groșii Țibleșului s’établit au pied des monts Țibleș dans la vallée du Suciu, constituant
      la porte d’entrée naturelle du massif.
    history: >-
      Le réseau transnational des hêtraies primaires témoigne de la manière dont le hêtre européen a
      recolonisé le continent après la dernière glaciation sans interférence humaine. Groșii Țibleșului et
      Strâmbu Băiuț s’articulent avec les composantes UNESCO des Carpates ukrainiennes, formant un maillage
      qui sauvegarde les massifs de hêtres les plus vastes et préservés d’Europe.


      Le site d’importance communautaire ROSCI0411 Groșii Țibleșului a été désigné en 2016 et englobe 927
      hectares.
    before: >-
      S’agissant d’une réserve intégrale, ne comptez pas sur un réseau de sentiers aménagés : prenez contact
      avec le district forestier avant toute incursion. Les meilleurs mois vont de juin à octobre.
    around: >-
      À trois kilomètres se trouve la [forêt primaire de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/),
      autre composante du réseau mondial des hêtraies. À vingt kilomètres s’étend le [parc naturel des monts
      Maramureș](/lugar/parcul-natural-muntii-maramuresului/) et à vingt et un kilomètres le [parc national
      des monts Rodna](/lugar/parcul-national-muntii-rodnei/).


      Plus loin, d’autres forêts anciennes partagent cette haute naturalité et ses grands carnivores : la
      [forêt primaire de Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), la [forêt primaire de Vihorlat -
      Morské oko](/lugar/prales-vihorlat---morske-oko/), la [réserve naturelle intégrale de
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) et la [forêt vierge de
      Krokar](/lugar/pragozd-krokar/).
  de:
    intro: >-
      Unter dem Kamm des Țibleș-Gebirges, am nördlichen Rand der Ostkarpaten, haben zwei Waldinseln
      überdauert, in denen die Naturzeit unberührt geblieben ist. Sie heißen Izvorul Șurii und Preluci,
      umfassen rund 210,5 und 135,80 Hektar und bilden die UNESCO-Komponenten von Groșii Țibleșului: reine
      Buchenwälder sowie Mischbestände mit Tanne und Fichte, in denen Bäume von außergewöhnlichem Alter und
      gewaltigem Wuchs stehen. Es ist ein strenges Totalreservat.
    landscape: >-
      Die Wälder von Groșii Țibleșului bedecken das Țibleș-Massiv in den nördlichen Ostkarpaten zwischen 760
      und 1460 Metern Höhe. Das Țibleș-Gebirge gehört zu den Karpaten der Maramureș und der Bukowina, mit dem
      Vârful Bran als höchstem Punkt auf 1840 Metern. Der saure Boden bildete sich auf pyroxenhaltigem Andesit
      neogenen vulkanischen Ursprungs.


      Die beiden UNESCO-Teilgebiete werden von einer gemeinsamen Pufferzone von 563,6 Hektar geschützt. Sie
      bewahren reine Buchen- und Tannen-Buchen-Mischwälder, subalpine Fichtenbestände und kleine oligotrophe
      Moorflächen. Die Bestände zeichnen sich durch hohe Strukturvielfalt, absolute Naturnähe und monumentale
      Urwaldbäume aus. Zu den umgebenden Bergen zählen Groapa, Ștevioara, Tomnatic-Groși, Prelucilor und
      Piatra Rea.
    wildlife: >-
      In diesen Bergwäldern leben [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und
      [Eurasischer Luchs](/especie/lynx_lynx/), die großen Raubtiere an der Spitze der Nahrungspyramide. Mit
      ihnen teilen sich Rothirsch, Reh, [Wildschwein](/especie/sus_scrofa/), Wildkatze, Baummarder und
      Rotfuchs das Revier. Zur Vogelwelt gehören [Wanderfalke](/especie/falco_peregrinus/),
      [Wespenbussard](/especie/pernis_apivorus/), Sperber, Turmfalke sowie Waldkauz und Habichtskauz, ergänzt
      durch den [Schwarzspecht](/especie/dryocopus_martius/).


      Die Bodenflora prägt das Waldinnere gleichermaßen: Buschwindröschen, Wald-Glockenblume, Einbeere,
      Wald-Segge und Echtes Springkraut bilden den Teppich, ergänzt durch Ruprechtskraut, Weiße Pestwurz,
      Eisenhut, *Cardamine glanduligera*, Frühlings-Knotenblume und Herbstzeitlose. Die beste Besuchszeit für
      das Gebirgsumfeld reicht von Juni bis Oktober.
    visit: >-
      In diesen Steillagen-Urwäldern gibt es weder Wanderwege, Aussichtspunkte noch Besucherzentren. Das
      Forstamt Groșii Țibleșului, das rund 12226 Hektar Bergwald bewirtschaftet, ist die einzige zuständige
      Anlaufstelle für Auskünfte über Randbereiche und Zugangsbestimmungen.


      Das Dorf Groșii Țibleșului liegt am Fuß des Gebirges im Suciu-Tal und dient als traditioneller
      Ausgangspunkt für das Massiv.
    history: >-
      Das transnationale UNESCO-Buchenurwaldnetz dokumentiert die ungestörte Wiederbesiedlung Europas durch
      die Rotbuche nach der letzten Eiszeit. Groșii Țibleșului und Strâmbu Băiuț schließen an
      Urwaldkomponenten in den ukrainischen Karpaten an und bilden eine geschützte Kette der ursprünglichsten
      Buchenwälder unseres Kontinents.


      Das FFH-Gebiet ROSCI0411 Groșii Țibleșului wurde 2016 ausgewiesen und umfasst 927 Hektar.
    before: >-
      Da es sich um ein strenges Naturreservat handelt, gibt es kein Wegenetz: Halte vor jeder Tour
      Rücksprache mit der Forstverwaltung. Die besten Reisemonate sind Juni bis Oktober.
    around: >-
      Drei Kilometer entfernt liegt der [Urwald Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), ein
      Schwesterbestand desselben Welterbe-Verbunds. Zwanzig Kilometer entfernt erstreckt sich der [Naturpark
      Maramureș-Gebirge](/lugar/parcul-natural-muntii-maramuresului/) und einundzwanzig Kilometer entfernt der
      [Nationalpark Rodna-Gebirge](/lugar/parcul-national-muntii-rodnei/).


      In größerer Entfernung bewahren auch der [Urwald Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/),
      der [Urwald Vihorlat - Morské oko](/lugar/prales-vihorlat---morske-oko/), das [Naturreservat
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) und der [Urwald Krokar](/lugar/pragozd-krokar/)
      unberührte Urwalddynamik und Großraubtiere.
  it:
    intro: >-
      Sotto la cresta dei monti Țibleș, all’estremità settentrionale dei Carpazi Orientali, sopravvivono due
      lembi di foresta primigenia dove il tempo naturale non è mai stato alterato. Denominati Izvorul Șurii e
      Preluci, estesi rispettivamente su 210,5 e 135,80 ettari, compongono il sito UNESCO di Groșii
      Țibleșului: faggete pure e miste ad abete bianco e abete rosso con alberi monumentali di eccezionale
      longevità. È una riserva naturale integrale.
    landscape: >-
      Le foreste di Groșii Țibleșului ammantano il massiccio del Țibleș tra i 760 e i 1460 metri di
      altitudine. I monti Țibleș appartengono al gruppo montuoso del Maramureș e della Bucovina, con il Vârful
      Bran quale quota culminante a 1840 metri. Il suolo acido si è sviluppato su andesiti a pirosseni di
      origine vulcanica neogenica.


      I due nuclei UNESCO, tutelati da una fascia di rispetto condivisa di 563,6 ettari, preservano faggete
      pure e consorzi misti con abete bianco e peccio, formazioni pure di conifere d’alta quota e piccole
      torbiere oligotrofiche. I popolamenti risaltano per l’articolata struttura verticale, la rigorosa
      naturalità e gli alberi colossali. Le carte ufficiali citano le vette circostanti di Groapa, Ștevioara,
      Tomnatic-Groși, Prelucilor e Piatra Rea.
    wildlife: >-
      Nel cuore di queste boscaglie vivono l’[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/) e la [lince boreale](/especie/lynx_lynx/), i grandi predatori che guidano
      la rete trofica. Insieme a loro si muovono cervo, capriolo, [cinghiale](/especie/sus_scrofa/), gatto
      selvatico, martora e volpe. Tra l’avifauna figurano il [falco pellegrino](/especie/falco_peregrinus/),
      il [falco pecchiaiolo](/especie/pernis_apivorus/), lo sparviere, il gheppio e rapaci notturni come
      allocco e allocco degli Urali, oltre al maestoso [picchio nero](/especie/dryocopus_martius/).


      Il sottobosco definisce l’ambiente naturale al pari della fauna: anemoni bianchi, campanule, uva di
      volpe, carici e balsamine compongono lo strato erbaceo, affiancati da erba roberta, farfaraccio,
      aconito, *Cardamine glanduligera*, bucaneve e crochi autunnali. Il periodo consigliato per esplorare le
      vallate del massiccio va da giugno a ottobre.
    visit: >-
      Non esistono tracciati turistici, punti panoramici né centri visita all’interno di questi boschi primari
      arrampicati su pendici aspre. Il distretto forestale di Groșii Țibleșului, che governa circa 12226
      ettari di demanio montano, rappresenta l’autorità di riferimento per informazioni sulla fruibilità e sui
      regolamenti di tutela.


      Il paese di Groșii Țibleșului sorge ai piedi dei monti nella valle del Suciu, fungendo da varco naturale
      d’accesso al gruppo montuoso.
    history: >-
      La rete transnazionale delle faggete primarie testimonia la ricolonizzazione indisturbata dell’Europa da
      parte del faggio dopo l’ultima era glaciale. Groșii Țibleșului e Strâmbu Băiuț si raccordano alle
      componenti dei Carpazi ucraini, consolidando una cintura protetta che racchiude le faggete più integre
      d’Europa.


      Il Sito di Importanza Comunitaria ROSCI0411 Groșii Țibleșului è stato istituito nel 2016 e tutela 927
      ettari.
    before: >-
      Trattandosi di una riserva integrale, non vi sono percorsi attrezzati: rivolgiti agli uffici forestali
      prima di qualsiasi itinerario. I mesi ideali sono compresi tra giugno e ottobre.
    around: >-
      A tre chilometri di distanza si trova la [Foresta Primaria di
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), inserita nella medesima rete UNESCO. A venti
      chilometri si estende il [Parco Naturale dei Monti
      Maramureș](/lugar/parcul-natural-muntii-maramuresului/) e a ventuno chilometri il [Parco Nazionale dei
      Monti Rodna](/lugar/parcul-national-muntii-rodnei/).


      Più lontani, condividono caratteri primari e grandi carnivori la [Foresta Vergine di
      Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), la [Foresta Vergine di Vihorlat - Morské
      oko](/lugar/prales-vihorlat---morske-oko/), la [Riserva Naturale Integrale di
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) e la [Foresta Vergine di
      Krokar](/lugar/pragozd-krokar/).
  pt:
    intro: >-
      Sob os cumes dos montes Țibleș, no extremo setentrional dos Cárpatos Orientais, resistem dois redutos de
      floresta virgem onde o relógio biológico nunca foi perturbado. Chamam-se Izvorul Șurii e Preluci,
      cobrindo cerca de 210,5 e 135,80 hectares respetivamente, e constituem as parcelas UNESCO de Groșii
      Țibleșului: faiais puros e mistos com abeto e espruce, acolhendo árvores de longevidade e porte
      prodigiosos. É uma reserva integral estrita.
    landscape: >-
      As matas de Groșii Țibleșului revestem o maciço de Țibleș, no norte dos Cárpatos Orientais, entre os 760
      e os 1460 metros de altitude. Os montes Țibleș formam um subgrupo dos Cárpatos de Maramureș e Bucovina,
      culminando no Vârful Bran a 1840 metros de altitude. O solo ácido desenvolveu-se sobre andesitos com
      piroxenas de génese vulcânica neogénica.


      Os dois setores UNESCO, salvaguardados por uma zona de amortecimento comum de 563,6 hectares, preservam
      faiais puros e mistos com abeto-branco e espruce, manchas puras de coníferas subalpinas e pequenas
      turfeiras oligotróficas. As parcelas sobressaem pela estrutura vertical complexa, naturalidade intocada
      e arvoredo monumental. Os inventários oficiais assinalam os picos de Groapa, Ștevioara, Tomnatic-Groși,
      Prelucilor e Piatra Rea.
    wildlife: >-
      Nestes recessos montanhosos habitam o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/), os grandes
      carnívoros que lideram a cadeia alimentar carpatina. Com eles convivem o veado, a corça, o
      [javali](/especie/sus_scrofa/), o gato-bravo, a marta e a raposa. Entre as aves destacam-se o
      [falcão-peregrino](/especie/falco_peregrinus/), o [tartaranhão-apívoro](/especie/pernis_apivorus/), o
      gavião, o peneireiro e duas rapinas noturnas, a coruja-do-mato e a coruja-uralense, a par do
      [pica-pau-preto](/especie/dryocopus_martius/).


      A flora herbácea carateriza a mata com igual riqueza: anémonas-dos-bosques, campainhas, uva-de-raposa,
      carrascos e balsaminas atapetam o solo, juntando-se a erva-de-são-roberto, petasites, acónito,
      *Cardamine glanduligera*, campainhas-brancas e açafrão-bravo. A melhor altura para explorar as
      imediações decorre de junho a outubro.
    visit: >-
      Não existem trilhos balizados, miradouros nem centros de acolhimento nestas matas virgens encravadas em
      encostas íngremes. O distrito florestal de Groșii Țibleșului, que tutela cerca de 12226 hectares de mata
      pública, é a entidade competente para indicar setores abertos e normas de circulação.


      A aldeia de Groșii Țibleșului repousa no sopé da serra no vale do Suciu, constituindo o ponto de partida
      clássico para o maciço.
    history: >-
      A rede transnacional de faiais primários atesta a recolonização da Europa pela faia após a última era
      glaciar sem intervenção antrópica. Groșii Țibleșului e Strâmbu Băiuț articulam-se com parcelas UNESCO
      dos Cárpatos ucranianos, integrando uma cadeia continental que protege as mais vastas e bem conservadas
      florestas de faia.


      O Sítio de Importância Comunitária ROSCI0411 Groșii Țibleșului foi classificado em 2016 e estende-se por
      927 hectares.
    before: >-
      Sendo uma reserva integral, não esperes caminhos turísticos marcados: consulta os serviços florestais
      antes de planear deslocações. Os meses mais favoráveis vão de junho a outubro.
    around: >-
      A escassos três quilómetros ergue-se a [Floresta Primária de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), membro da mesma rede mundial de faiais. A vinte
      quilómetros situa-se o [Parque Natural das Montanhas de
      Maramureș](/lugar/parcul-natural-muntii-maramuresului/) e a vinte e um quilómetros o [Parque Nacional
      das Montanhas de Rodna](/lugar/parcul-national-muntii-rodnei/).


      Mais distantes, resguardam florestas virgens e predadores de topo a [Floresta Virgem de
      Janj](/lugar/prasuma-janj-strogi-rezervat-prirode/), a [Floresta Virgem de Vihorlat - Morské
      oko](/lugar/prales-vihorlat---morske-oko/), a [Reserva Natural Estrita de
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) e a [Floresta Virgem de
      Krokar](/lugar/pragozd-krokar/).
