resumen:
  es: Cañones de arenisca, bosques y humedales en torno al arroyo Pšovka.
  en: Sandstone canyons, forests and wetlands flanking the meandering Pšovka stream.
  fr: Canyons de grès, forêts et zones humides bordant le ruisseau Pšovka.
  de: Sandsteincanyons, Wälder und Feuchtgebiete entlang des gewundenen Pšovka-Bachs.
  it: Canyon d’arenaria, boschi e zone umide attorno al corso del torrente Pšovka.
  pt: Desfiladeiros de arenito, florestas e zonas húmidas em redor do ribeiro Pšovka.
unico:
  es: Es el lugar donde mejor se ve cómo la arenisca se deshace en «tapaderas», ventanas y puertas de piedra.
  en: >-
    The premier European site to observe how sandstone weathers into mushroom caps (*pokličky*), rock windows
    and stone arches.
  fr: >-
    Le meilleur site d’Europe pour observer l’érosion du grès en champignons rocheux (*pokličky*), fenêtres et
    arches de pierre.
  de: >-
    Der eindrucksvollste Ort Mitteleuropas, um die Verwitterung von Sandstein zu Felsformationen mit Deckeln
    (*Pokličky*), Fenstern und Toren zu beobachten.
  it: >-
    Il miglior sito in Europa per osservare come l’arenaria si disgrega in funghi di roccia (*pokličky*),
    finestre e archi naturali.
  pt: >-
    O local mais notável da Europa para observar a desagregação do arenito em cogumelos rochosos (*pokličky*),
    janelas e arcos de pedra.
observaciones:
  es: >-
    Las normas del gestor son estrictas. En el paisaje protegido no se puede acampar ni dormir bajo tienda o
    lona, y fuera de las zonas de acampada públicas está estrictamente prohibido encender fuego. En las
    reservas naturales nacionales hay que ir solo por caminos señalizados, y está prohibido circular en coche
    por caminos forestales y agrícolas. Respeta los senderos señalizados para proteger los hábitats frágiles,
    y llévate todos los residuos.


    Prefiere el transporte público porque los aparcamientos son pequeños: a Mšeno, al norte de Kokořínsko o a
    Máchův kraj se puede llegar en tren. Mira la sección de avisos del gestor antes de salir, por si hay
    restricciones en algún tramo.
texto:
  es:
    intro: >-
      Imagina un cañón de 14 km por el que corre un arroyo discreto y donde las paredes de arenisca parecen
      esculpidas con intención. Eso es Kokořínský důl: el valle del Pšovka, que entre el cruce de Ráj y la
      estación de Lhotka u Mělníka se encaja entre rocas, pinares y robledales. La reserva natural que lleva
      su nombre supera las 2000 ha, es una de las mayores del país y es el núcleo del paisaje protegido
      Kokořínsko – Máchův kraj. Aquí no se viene a hacer cumbres, sino a leer la roca.
    landscape: >-
      La historia empieza en el fondo de un mar. Al final del Mesozoico las aguas llegaban hasta aquí y
      depositaron una arenisca blanda; las capas se cementaron de distintas maneras, así que unas aguantan la
      erosión y otras no. Por eso, al meter agua y cambios de temperatura, la roca se deshace de forma
      selectiva. Donde una placa dura de hierro cubre una columna de arenisca blanda, queda una tapadera, y el
      nombre de la roca, las Pokličky, ha acabado en el logotipo del paisaje protegido. Las mejores muestras
      de Europa de las primeras fases de la desintegración de esas areniscas están en esta reserva.


      Sobre una red de mesetas y valles, esa arenisca ácida forma ciudades de roca, pokličky y puertas y
      ventanas rocosas en los bordes. Algunas figuras tienen nombre, como la Cabeza gigante, la Rana o
      Blancanieves y los siete enanitos. Y por encima de todo asoman cumbres sueltas de rocas ígneas del
      Terciario, como Vlhošť o Ronov.


      El bosque va con la roca. Lo que se conserva son sobre todo pinares y robledales ácidos, carpinares,
      hayedos ácidos y robledales con pino. Las inversiones térmicas completan la mezcla: en los valles crecen
      plantas de humedad y de zonas más altas, y en las partes elevadas, plantas de calor y sequedad. En el
      norte de la región hay además pinares ácidos relictos de aspecto primario.
    wildlife: >-
      El agua es el otro protagonista. Los humedales del Pšovka forman parte del complejo Mokřady Liběchovky a
      Pšovky, de importancia internacional según el Convenio de Ramsar, y en ellos viven el tritón alpestre,
      la [salamandra común](/especie/salamandra_salamandra/), el sapo común y la rana bermeja, y aves como el
      [martín pescador](/especie/alcedo_atthis/) y el [mirlo acuático](/especie/cinclus_cinclus/).


      En los valles anidan algunas rapaces nocturnas, sobre todo el [búho real](/especie/bubo_bubo/), y
      últimamente se ha extendido el cuervo grande. El [lobo](/especie/canis_lupus/) se mueve por todo el
      paisaje protegido, pero sobre todo en Máchův kraj, un lugar tradicional de presencia de la especie.


      La primavera pide cuidado: está prohibido entrar en los carrizales en la época de nidificación.
    visit: >-
      La Máchova cesta, de marca roja, recorre todo el Kokořínský důl, y por ella va la ruta europea E10. En
      ella, los Mšenské pokličky están al comienzo de la cresta de Droužkov, a la izquierda del Pšovka. La
      zona recibe a decenas de miles de excursionistas al año en puntos como Mšenské pokličky, y el acceso a
      las Pokličky de Kokořínský důl se hace por una escalera de madera desde el valle del Pšovka.


      Algunas rutas exigen superar rocas con ayuda de cadenas, y no todas las fuentes tienen agua potable. Los
      senderos educativos de la región ayudan a ordenar la visita: el Cinibulkova, de 9 km, entra en las
      rocas; el Dubsko - Kokořínsko, de 10 km, recorre bosques, prados, agua y pueblos alrededor de Dubá; y el
      Se Čtyřlístkem okolo Blaťáku rodea el lago Mácha con niños en 13 km. Si prefieres aves, el paseo Okolím
      Novozámeckého rybníka mide unos 14 km, tiene dificultad media y permite ver aves acuáticas desde dos
      observatorios.
    history: >-
      Desde el siglo XIX el paisaje de Kokořínsko atrae al turismo por su belleza y por el aspecto agreste de
      sus rocas. Esa romántica fama dio nombre a Máchův kraj, por uno de los poetas románticos que la región
      atrajo. Algunas rocas se modificaron para viviendas excavadas (Staráky, Nedamy, el molino de roca de
      Hlučov) o para obras artísticas de Václav Levý, y la arquitectura popular, de madera y de obra, se
      integra de forma armoniosa con el paisaje.


      Los humedales del Novozámecký rybník y del vecino Břehyňský rybník entraron en 1990 en la lista de
      Ramsar; el complejo Mokřady Liběchovky a Pšovky se registró en 1998.
    before: >-
      Las normas del gestor son estrictas. En el paisaje protegido no se puede acampar ni dormir bajo tienda o
      lona, y fuera de las zonas de acampada públicas está estrictamente prohibido encender fuego. En las
      reservas naturales nacionales hay que ir solo por caminos señalizados, y está prohibido circular en
      coche por caminos forestales y agrícolas. Respeta los senderos señalizados para proteger los hábitats
      frágiles, y llévate todos los residuos.


      Prefiere el transporte público porque los aparcamientos son pequeños: a Mšeno, al norte de Kokořínsko o
      a Máchův kraj se puede llegar en tren. Mira la sección de avisos del gestor antes de salir, por si hay
      restricciones en algún tramo.
  en:
    intro: >-
      Picture a 14 km canyon through which a quiet stream meanders, flanked by sandstone towers sculpted as if
      by deliberate design. That is Kokořínský důl: the valley of the Pšovka stream, which wedges between pine
      woods, oak groves and rock cliffs from the Ráj junction to Lhotka u Mělníka station. The nature reserve
      bearing its name spans over 2000 ha, making it one of the largest in the Czech Republic and the
      ecological core of the Kokořínsko – Máchův kraj Protected Landscape Area. You do not come here to scale
      summits, but to read the rock.
    landscape: >-
      The story began on an ancient seabed. At the end of the Mesozoic Era, marine waters laid down soft
      sandstone beds; varying degrees of iron and silica cementation left some strata resistant while others
      erode rapidly. As rain, frost and temperature swings take effect, the rock weathers selectively. Where a
      hard ferruginous capstone covers a softer sandstone pillar, a rock mushroom is born — and these
      *Pokličky* have become the emblem of the protected landscape. The finest examples in Europe illustrating
      the initial stages of sandstone block disintegration are found within this reserve.


      Across a labyrinth of mesas and deep gorges, the acidic sandstone carves rock cities, hoodoos, stone
      gates and high windows along cliff edges. Several formations bear popular names, such as the Giant Head,
      the Frog, or Snow White and the seven dwarfs. Surmounting the plateau rise isolated conical peaks of
      Tertiary volcanic rock, including Vlhošť and Ronov.


      Vegetation mirrors the bedrock. Well-preserved habitats are dominated by acidic pine and oak woods,
      hornbeam groves, acidophilous beechwoods and pine-oak mixtures. Marked temperature inversions enhance
      the diversity: canyon bottoms shelter moisture-loving montane species, while sun-baked upper clifftops
      support drought-tolerant warmth-loving flora. The northern sector preserves relict acidic pine woodlands
      of virgin character.
    wildlife: >-
      Water is the other living protagonist. The Pšovka wetlands belong to the Mokřady Liběchovky a Pšovky
      complex, designated a Wetland of International Importance under the Ramsar Convention. They shelter the
      alpine newt, [fire salamander](/especie/salamandra_salamandra/), common toad and moor frog, alongside
      wetland birds including the [common kingfisher](/especie/alcedo_atthis/) and [white-throated
      dipper](/especie/cinclus_cinclus/).


      Nocturnal raptors breed in the sandstone gorges, particularly the [Eurasian
      eagle-owl](/especie/bubo_bubo/), while the common raven has expanded in recent years. The [gray
      wolf](/especie/canis_lupus/) roams across the wider protected landscape, with steady presence in Máchův
      kraj, a traditional territory for the species.


      Spring calls for care: entering reedbeds is strictly prohibited during the bird nesting season.
    visit: >-
      The red-marked Máchova cesta trail traverses the entire Kokořínský důl, shared with the European
      long-distance path E10. Along it, the Mšenské pokličky formations stand at the start of the Droužkov
      ridge, on the left bank of the Pšovka. The area draws tens of thousands of hikers annually to hotspots
      like Mšenské pokličky; access to the Kokořín formations climbs a wooden staircase from the Pšovka valley
      floor.


      Some side routes require negotiating scrambles assisted by safety chains, and not all local springs
      provide potable water. Several nature trails help organise your visit: the Cinibulkova trail (9 km)
      enters the rock labyrinths; the Dubsko - Kokořínsko trail (10 km) explores woods, meadows and historical
      villages around Dubá; and the Se Čtyřlístkem okolo Blaťáku route circles Lake Mácha for families over 13
      km. If you prefer birdwatching, the circuit around Novozámecký rybník covers about 14 km of moderate
      walking and offers waterfowl viewing from two bird hides.
    history: >-
      Since the nineteenth century, the romantic rock scenery of Kokořínsko has attracted artists and
      travellers. That poetic reputation gave rise to the name Máchův kraj, after Karel Hynek Mácha, one of
      the Romantic poets inspired by the region. Several rock faces were hollowed out into rock-cut dwellings
      (Staráky, Nedamy, the rock mill of Hlučov) or monumental outdoor sculptures by Václav Levý, while
      traditional timbered folk architecture blends seamlessly into the landscape.


      The wetlands of Novozámecký fishpond and neighbouring Břehyňský fishpond were listed under the Ramsar
      Convention in 1990; the wider Mokřady Liběchovky a Pšovky complex was registered in 1998.
    before: >-
      Reserve regulations are strictly enforced. Camping and bivouacking under tarps or tents are forbidden
      throughout the protected landscape, and lighting fires outside designated public campsites is strictly
      prohibited. In national nature reserves, remain strictly on marked trails, and driving motor vehicles on
      forestry and agricultural tracks is unlawful. Stay on marked paths to safeguard fragile sandstone
      habitats, and pack out all waste.


      Public transport is recommended given limited parking capacities: Mšeno, northern Kokořínsko and Máchův
      kraj are accessible by regional rail. Check local administration notices before setting out for
      temporary trail diversions.
  fr:
    intro: >-
      Imaginez un canyon de 14 km au fond duquel s'écoule un ruisseau paisible, resserré entre des parois de
      grès semblant taillées avec dessein. C'est le Kokořínský důl : la vallée de la Pšovka, qui s'encaisse
      entre pinèdes, chênaies et falaises du carrefour de Ráj jusqu'à la gare de Lhotka u Mělníka. La réserve
      naturelle qui porte son nom dépasse les 2000 ha, figurant parmi les plus vastes du pays et constituant
      le cœur écologique du paysage protégé de Kokořínsko – Máchův kraj. Vous ne venez pas ici gravir des
      sommets, mais déchiffrer la pierre.
    landscape: >-
      L'histoire commence au fond d'une mer disparue. À la fin du Mésozoïque, les eaux déposèrent d'épaisses
      couches de grès meuble ; les ciments de fer et de silice ont consolidé certaines strates tandis que
      d'autres s'érodent rapidement. Sous l'action de l'eau et des écarts thermiques, la roche se désagrège de
      façon sélective. Lorsqu'une chape de fer protège une colonne de grès tendre, un champignon rocheux
      subsiste : ces *Pokličky* sont devenues le symbole de la région protégée. Les meilleurs exemples
      européens des phases initiales de dégradation des grès se trouvent dans cette réserve.


      Sur un réseau de plateaux et de gorges, ce grès acide compose cités de pierre, cheminées de fées, portes
      et fenêtres rocheuses. Certaines figures portent des noms imagés comme la Tête de géant, la Grenouille
      ou Blanche-Neige et les sept nains. Au-dessus du plateau émergent des cônes volcaniques isolés de roches
      magmatiques du Tertiaire, comme le Vlhošť ou le Ronov.


      La végétation épouse la roche. Les milieux préservés sont formés de pinèdes et chênaies acidophiles,
      charmaies, hêtraies et chênaies mêlées de pin. Les inversions thermiques accentuent les contrastes : les
      fonds de gorges abritent des espèces fraîches et montagnardes, tandis que les rebords sommitales
      accueillent une flore xérophile de chaleur. Le nord du secteur abrite des pinèdes relictuelles d'allure
      primaire.
    wildlife: >-
      L'eau constitue l'autre composante vivante majeure. Les zones humides de la Pšovka appartiennent au
      complexe Mokřady Liběchovky a Pšovky, d'importance internationale au titre de la Convention de Ramsar.
      Elles abritent le triton alpestre, la [salamandre tachetée](/especie/salamandra_salamandra/), le crapaud
      commun et la grenouille rousse, ainsi que des oiseaux remarquables comme le [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/) et le [cincle plongeur](/especie/cinclus_cinclus/).


      Dans les gorges rocheuses nichent des rapaces nocturnes, en particulier le [grand-duc
      d'Europe](/especie/bubo_bubo/), tandis que le grand corbeau a récemment progressé. Le [loup
      gris](/especie/canis_lupus/) sillonne l'ensemble du paysage protégé, avec une présence attestée dans le
      secteur de Máchův kraj, territoire historique de l'espèce.


      Le printemps requiert une grande vigilance : l'accès aux roselières est formellement interdit pendant la
      période de nidification.
    visit: >-
      Le chemin balisé en rouge Máchova cesta parcourt tout le Kokořínský důl, emprunté par le sentier
      européen de grande randonnée E10. Les formations rocheuses de Mšenské pokličky se dressent au départ de
      la crête de Droužkov, sur la rive gauche de la Pšovka. Le site accueille des dizaines de milliers de
      visiteurs par an ; l'accès aux Pokličky de Kokořínský důl s'effectue par un escalier en bois depuis le
      fond de vallée.


      Certains passages nécessitent de franchir des rochers équipés de mains courantes, et toutes les sources
      ne fournissent pas d'eau potable. Des sentiers pédagogiques balisent la découverte : le sentier
      Cinibulkova (9 km) s'enfonce dans les labyrinthes rocheux ; le sentier Dubsko - Kokořínsko (10 km)
      parcourt forêts, prairies et villages autour de Dubá ; le circuit Se Čtyřlístkem okolo Blaťáku fait le
      tour du lac Mácha en famille sur 13 km. Pour observer les oiseaux, la boucle Okolím Novozámeckého
      rybníka compte environ 14 km de marche facile avec deux observatoires ornithologiques.
    history: >-
      Dès le XIXe siècle, les paysages sauvages de Kokořínsko ont séduit artistes et randonneurs. Cette
      renommée romantique a donné son nom à Máchův kraj, en hommage au poète romantique Karel Hynek Mácha.
      Plusieurs parois rocheuses ont été aménagées en habitations troglodytiques (Staráky, Nedamy, le moulin
      rupestre de Hlučov) ou ornées de sculptures monumentales par Václav Levý, tandis que l'architecture
      traditionnelle en bois s'accorde au décor minéral.


      Les zones humides de l'étang de Novozámecký et du plan d'eau voisin de Břehyňský ont été classées site
      Ramsar en 1990 ; l'ensemble du complexe Mokřady Liběchovky a Pšovky a été inscrit en 1998.
    before: >-
      Les règles de la réserve sont très strictes. Le camping sauvage et le bivouac sous tente ou bâche sont
      interdits dans tout le paysage protégé, et tout feu hors des aires publiques de camping est sévèrement
      prohibé. Dans les réserves naturelles nationales, marchez exclusivement sur les sentiers balisés, et la
      circulation motorisée sur pistes forestières est interdite. Respectez les chemins balisés pour préserver
      les grès fragiles et remportez tous vos déchets.


      Privilégiez les transports ferroviaires car les aires de stationnement sont restreintes : Mšeno et le
      nord de Kokořínsko sont accessibles en train. Vérifiez les avis du gestionnaire avant votre départ pour
      d'éventuelles fermetures temporaires.
  de:
    intro: >-
      Stell dir einen 14 km langen Canyon vor, durch den ein ruhiger Bach mäandert, flankiert von
      Sandsteinwänden, die wie von Meisterhand gemeißelt wirken. Das ist der Kokořínský důl: das Tal der
      Pšovka, das sich zwischen der Wegkreuzung Ráj und der Bahnstation Lhotka u Mělníka tief zwischen
      Kiefernwälder, Eichenhaine und Felswände eingräbt. Das gleichnamige Naturschutzgebiet umfasst über 2000
      ha, gehört zu den größten Schutzgebieten Tschechiens und bildet das Herz des Landschaftsschutzgebiets
      Kokořínsko – Máchův kraj. Hierher kommt man nicht für Gipfelbesteigungen, sondern um den Fels zu lesen.
    landscape: >-
      Die Erdgeschichte begann auf einem Meeresgrund. Am Ende des Mesozoikums lagerten Meeresfluten mächtige
      Lockersandsteine ab; ungleichmäßige Zementierungen durch Eisen und Kieselsäure machten einige Schichten
      widerstandsfähig, während andere leicht erodieren. Durch Frostsprengung und Verwitterung zerfällt das
      Gestein selektiv. Wo eine eisenhaltige Deckplatte weichere Sandsteinsäulen schützt, bleiben Felskappen
      stehen — jene *Pokličky*, die zum Wappensymbol der Region wurden. Die lehrreichsten Beispiele für frühe
      Zerfallsstadien solcher Sandsteinmassive in Europa finden sich in diesem Reservat.


      Inmitten eines Netzes aus Tafelländern und Schluchten bildet der saure Sandstein Felsenstädte, Felstore
      und Felsenfenster. Markante Felsgestalten tragen Namen wie Riesenkopf, Frosch oder Schneewittchen und
      die sieben Zwerge. Über die Hochebene ragen isolierte Vulkankegel aus dem Tertiär empor, darunter Vlhošť
      und Ronov.


      Die Vegetation folgt dem Felsboden. Gut erhalten sind bodensaure Kiefern- und Eichenwälder,
      Hainbuchenwälder, Hainsimsen-Buchenwälder und Kiefern-Eichen-Mischbestände. Ausgeprägte
      Temperaturinversionen verstärken die Vielfalt: In den Schluchtgründen gedeihen kühle Bergwaldpflanzen,
      während an sonnenexponierten Felskanten trockenwarme Arten wachsen. Im Norden überdauern urwaldartige
      Relikt-Kiefernwälder.
    wildlife: >-
      Das Wasser bildet die andere Lebensader. Die Pšovka-Auen gehören zum Feuchtgebietskomplex Mokřady
      Liběchovky a Pšovky von internationaler Bedeutung gemäß Ramsar-Konvention. Hier leben Bergmolch,
      [Feuersalamander](/especie/salamandra_salamandra/), Erdkröte und Moorfrosch sowie Feuchtgebietsvögel wie
      [Eisvogel](/especie/alcedo_atthis/) und [Wasseramsel](/especie/cinclus_cinclus/).


      In den stillen Schluchten brüten seltene Eulenarten, vor allem der [Uhu](/especie/bubo_bubo/), während
      der Kolkrabe in jüngerer Zeit zugenommen hat. Der [Wolf](/especie/canis_lupus/) streift durch das
      gesamte Schutzgebiet, mit regelmäßiger Präsenz im Máchův kraj, einem traditionellen Streifrevier der
      Art.


      Im Frühjahr ist besondere Rücksicht geboten: Das Betreten von Schilfzonen ist während der Brutzeit
      streng untersagt.
    visit: >-
      Der rot markierte Weg Máchova cesta durchquert den gesamten Kokořínský důl und fällt mit dem
      europäischen Fernwanderweg E10 zusammen. An ihm liegen die Felsgebilde Mšenské pokličky am Beginn des
      Droužkov-Kamms links der Pšovka. Das Gebiet zieht jährlich Zehntausende Wanderer an; der Aufstieg zu den
      Kokořín-Pokličky erfolgt über eine Holztreppe vom Talboden der Pšovka.


      Einige Wege erfordern Trittsicherheit an kettenversicherten Felsstufen, und nicht alle Quellen führen
      Trinkwasser. Lehrpfade strukturieren den Besuch: Der Cinibulkova-Pfad (9 km) führt mitten in die
      Felsenlabyrinthe; der Dubsko - Kokořínsko-Weg (10 km) erschließt Wälder, Wiesen und Dörfer um Dubá; der
      Pfad Se Čtyřlístkem okolo Blaťáku umrundet den Mácha-See familienfreundlich auf 13 km. Für
      Vogelbeobachter bietet der Rundweg Okolím Novozámeckého rybníka rund 14 km moderate Strecke mit zwei
      Beobachtungshütten.
    history: >-
      Seit dem neunzehnten Jahrhundert zog die wilde Sandsteinlandschaft von Kokořínsko Romantiker und
      Reisende an. Dieser Ruhm prägte die Bezeichnung Máchův kraj nach dem romantischen Dichter Karel Hynek
      Mácha. Mehrere Felsen wurden zu Höhlenwohnungen ausgebaut (Staráky, Nedamy, Felsenmühle Hlučov) oder von
      Bildhauer Václav Levý plastisch gestaltet, während sich historische Volksarchitektur harmonisch in die
      Landschaft fügt.


      Die Feuchtgebiete am Novozámecký-Teich und dem benachbarten Břehyňský-Teich wurden 1990 als
      Ramsar-Gebiete ausgewiesen; der Gesamtkomplex Mokřady Liběchovky a Pšovky folgte 1998.
    before: >-
      Die Schutzgebietsvorschriften sind streng. Zelten und Biwakieren sind im gesamten
      Landschaftsschutzgebiet untersagt, und außerhalb offizieller Campingplätze ist offenes Feuer verboten.
      In nationalen Naturreservaten darfst du die markierten Wege nicht verlassen, und motorisierter Verkehr
      auf Wald- und Feldwegen ist unzulässig. Bleibe auf den Pfaden, um die Felsvegetation zu schonen, und
      nimm allen Müll wieder mit.


      Nutze bevorzugt die Bahn, da Parkplätze begrenzt sind: Mšeno und der Norden von Kokořínsko sind an das
      Schienennetz angebunden. Prüfe vorab behördliche Hinweise auf zeitweilige Wegerisiken.
  it:
    intro: >-
      Immagina un canyon di 14 km solcato da un torrente discreto, dove le pareti d'arenaria sembrano scolpite
      con disegno accurato. Questo è Kokořínský důl: la valle della Pšovka, che dal bivio di Ráj fino alla
      stazione di Lhotka u Mělníka si incunea tra pinete, querceti e rupi rocciose. La riserva naturale che
      porta il suo nome si estende per oltre 2000 ha, figurando tra le più grandi della Repubblica Ceca e
      costituendo il cuore ecologico dell'area protetta Kokořínsko – Máchův kraj. Qui non si viene per
      conquistare vette, ma per decifrare la roccia.
    landscape: >-
      La storia ha inizio sul fondo di un antico mare. Verso la fine del Mesozoico le acque depositarono
      spessi banchi di arenaria tenera; cementazioni disomogenee di ferro e silice resero alcuni strati
      resistenti mentre altri si sgretolano facilmente. L'acqua e le oscillazioni di temperatura modellano
      selettivamente la pietra. Dove un cappello ferruginoso protegge una colonna di roccia sottostante nasce
      un fungo di roccia: queste *Pokličky* sono divenute l'emblema visivo della riserva. Gli esempi più
      completi d'Europa sulle prime fasi di disgregazione dell'arenaria si trovano proprio qui.


      In una maglia di altopiani e gole, l'arenaria acida origina città di roccia, pinnacoli e finestre
      naturali lungo i margini. Molti torrioni portano nomi caratteristici come la Testa di gigante, la Rana o
      Biancaneve e i sette nani. Sopra l'altopiano emergono isolati rilievi vulcanici del Terziario, come il
      Vlhošť e il Ronov.


      La vegetazione riflette la natura del suolo. Si conservano querceti e pinete acidofili, carpineti,
      faggete e boschi misti di pino e rovere. Le inversioni termiche ne accentuano la varietà: sul fondo dei
      valloni prosperano specie montane di climi umidi, mentre sulle alture rocciose trovano spazio piante
      amanti del caldo e dell'aridità. Il settore settentrionale custodisce pinete relitte dall'aspetto
      primario.
    wildlife: >-
      L'acqua è l'altro elemento vitale di rilievo. Le zone umide della Pšovka fanno parte del complesso
      Mokřady Liběchovky a Pšovky, riconosciuto d'importanza internazionale dalla Convenzione di Ramsar. Vi
      vivono il tritone alpestre, la [salamandra pezzata](/especie/salamandra_salamandra/), il rospo comune e
      la rana temporaria, oltre a specie alate come il [martin pescatore](/especie/alcedo_atthis/) e il [merlo
      acquaiolo](/especie/cinclus_cinclus/).


      Nelle forre rocciose nidificano rapaci notturni, in particolare il [gufo reale](/especie/bubo_bubo/),
      mentre il corvo imperiale è in espansione. Il [lupo grigio](/especie/canis_lupus/) percorre l'intera
      area protetta, con presenze stabili documentate nel territorio di Máchův kraj.


      La primavera esige cautela: l'accesso ai canneti è severamente vietato durante la stagione riproduttiva
      dell'avifauna.
    visit: >-
      Il sentiero a segnavia rosso Máchova cesta attraversa l'intero Kokořínský důl, condiviso con il percorso
      escursionistico europeo E10. Lungo di esso, i funghi di roccia Mšenské pokličky si trovano all'inizio
      della cresta di Droužkov, sulla sinistra della Pšovka. La zona accoglie decine di migliaia di
      escursionisti ogni anno; l'accesso alle Pokličky sale con una scalinata in legno dal fondo valle.


      Alcuni tratti richiedono passi sicuri con l'aiuto di catene metalliche, e non tutte le sorgenti erogano
      acqua potabile. Vari sentieri tematici permettono di pianificare la camminata: il sentiero Cinibulkova
      (9 km) penetra nei labirinti rocciosi; il percorso Dubsko - Kokořínsko (10 km) esplora boschi, prati e
      borghi storici attorno a Dubá; l'itinerario Se Čtyřlístkem okolo Blaťáku compie il giro del lago Mácha
      in 13 km per famiglie. Per gli appassionati di birdwatching, l'anello Okolím Novozámeckého rybníka
      misura circa 14 km di cammino agevole con due capanni di osservazione.
    history: >-
      Fin dal diciannovesimo secolo i paesaggi rocciosi di Kokořínsko hanno attratto viaggiatori e artisti. Da
      questa fama romantica è derivato il nome Máchův kraj, in omaggio al poeta Karel Hynek Mácha. Diverse
      pareti rocciose furono modificate per ricavarne abitazioni trogloditiche (Staráky, Nedamy, il mulino
      rupestre di Hlučov) o sculture monumentali opera di Václav Levý, mentre le tradizionali case in legno si
      integrano nel paesaggio.


      Le zone umide dello stagno Novozámecký rybník e del vicino Břehyňský rybník sono entrate nella lista di
      Ramsar nel 1990; l'intero comprensorio Mokřady Liběchovky a Pšovky è stato registrato nel 1998.
    before: >-
      Le norme di tutela sono stringenti. È vietato campeggiare o bivaccare sotto tende o teli in tutta l'area
      protetta, ed è assolutamente proibito accendere fuochi all'infuori dei campeggi pubblici. Nelle riserve
      naturali nazionali cammina esclusivamente sui sentieri segnati; è vietata la circolazione con veicoli a
      motore sulle piste forestali. Rispetta i percorsi tracciati per preservare le formazioni rocciose e
      riporta a valle ogni rifiuto.


      Usa preferibilmente i mezzi pubblici data la ridotta capienza dei parcheggi: Mšeno e il nord di
      Kokořínsko sono serviti dalla ferrovia. Consulta le comunicazioni dell'ente gestore prima di metterti in
      cammino.
  pt:
    intro: >-
      Imagina um desfiladeiro de 14 km onde corre um ribeiro tranquilo e onde as arribas de arenito parecem
      talhadas com intenção escultural. Isso é Kokořínský důl: o vale do Pšovka, que entre o cruzamento de Ráj
      e a estação de Lhotka u Mělníka se encaixa entre rochedos, pinhais e carvalhais. A reserva natural
      homónima ultrapassa os 2000 ha, constituindo uma das maiores da Chéquia e o núcleo ecológico da Paisagem
      Protegida Kokořínsko – Máchův kraj. Não se vem aqui para escalar cumes, mas para ler a rocha.
    landscape: >-
      A história começou no fundo de um mar extinto. No final do Mesozóico, as águas depositaram arenitos
      brandos; cimentações irregulares de ferro e sílica tornaram algumas camadas resistentes enquanto outras
      se desgastam depressa. Sob a ação da água e das oscilações térmicas, a rocha desagrega-se de forma
      seletiva. Onde uma placa dura de ferro cobre uma coluna de arenito brando, forma-se um cogumelo de rocha
      — as *Pokličky*, que passaram a figurar no logótipo da área protegida. Os melhores testemunhos europeus
      das fases iniciais de erosão destes arenitos encontram-se nesta reserva.


      Numa malha de planaltos e gargantas, o arenito ácido forma labirintos rochosos, cogumelos e janelas de
      pedra nas cristas. Várias figuras ostentam nomes populares, como a Cabeça de Gigante, a Rã ou a Branca
      de Neve e os sete anões. Acima do relevo destacam-se cones vulcânicos do Terciário, como o Vlhošť ou o
      Ronov.


      A floresta acompanha a geologia. Predominam pinhais e carvalhais acidófilos, soutos de carpino, faias e
      carvalhos com pinheiro. As inversões térmicas completam o mosaico: nos fundos de vale subsistem plantas
      de ambientes húmidos e montanhosos, enquanto nas cristas rochosas secas prosperam espécies xerófilas. A
      norte ocorrem pinhais relíquias de traço primário.
    wildlife: >-
      A água desempenha papel de primeiro plano. As zonas húmidas do Pšovka integram o complexo Mokřady
      Liběchovky a Pšovky, classificado como Sítio Ramsar de importância internacional. Acolhem o
      tritão-alpino, a [salamandra-de-pintas-amarelas](/especie/salamandra_salamandra/), o sapo-comum e a
      rã-castanha, a par de aves ribeirinhas como o [guarda-rios-comum](/especie/alcedo_atthis/) e o
      [melro-d'água](/especie/cinclus_cinclus/).


      Nos vales rochosos nidificam rapinas noturnas, em particular o [bufo-real](/especie/bubo_bubo/),
      assistindo-se à recente expansão do corvo-comum. O [lobo-cinzento](/especie/canis_lupus/) percorre a
      paisagem protegida, com presença regular assinalada em Máchův kraj, reduto tradicional da espécie.


      A primavera exige cautela: é expressamente proibido entrar nos caniçais durante a época de nidificação.
    visit: >-
      O trilho de marcação vermelha Máchova cesta percorre todo o Kokořínský důl, coincidindo com a rota
      europeia de grande curso E10. As formações de Mšenské pokličky situam-se no início da crista de
      Droužkov, na margem esquerda do Pšovka. A área acolhe dezenas de milhares de caminhantes por ano; o
      acesso às Pokličky faz-se por uma escadaria de madeira a partir do vale do Pšovka.


      Alguns percursos secundários exigem ultrapassar rochas com recurso a correntes de apoio, e nem todas as
      nascentes dispõem de água potável. Vários trilhos temáticos orientam a visita: o percurso Cinibulkova (9
      km) penetra nos labirintos rochosos; o percurso Dubsko - Kokořínsko (10 km) cruza florestas, prados e
      aldeias em redor de Dubá; o trilho Se Čtyřlístkem okolo Blaťáku contorna o lago Mácha em 13 km para
      passeios familiares. Para avistamento de aves, o circuito Okolím Novozámeckého rybníka tem cerca de 14
      km com dificuldade moderada e dois postos de observação.
    history: >-
      Desde o século XIX que as paisagens agrestes de Kokořínsko atraem viajantes e artistas. Esse renome
      romântico deu o nome a Máchův kraj, em honra do poeta romântico Karel Hynek Mácha. Diversas rochas foram
      escavadas para habitações trogloditas (Staráky, Nedamy, o moinho rupestre de Hlučov) ou enriquecidas com
      esculturas de Václav Levý, integrando-se a arquitetura popular em madeira com harmonia na paisagem.


      As zonas húmidas da lagoa Novozámecký rybník e da vizinha Břehyňský rybník foram integradas na lista
      Ramsar em 1990; o complexo Mokřady Liběchovky a Pšovky foi registado em 1998.
    before: >-
      As normas de proteção são rigorosas. É proibido acampar ou pernoitar sob toldos ou tendas em toda a
      paisagem protegida, e fazer fogueiras fora dos parques de campismo públicos é formalmente interdito. Nas
      reservas naturais nacionais circula exclusivamente pelos caminhos assinalados; é proibido conduzir
      veículos a motor em caminhos florestais ou rurais. Respeita os trilhos marcados para proteger os
      habitats areníticos e leva todo o lixo contigo.


      Prefere os transportes públicos devido à capacidade reduzida dos parques de estacionamento: Mšeno e o
      norte de Kokořínsko têm ligação ferroviária. Consulta os avisos da administração antes de partir.
