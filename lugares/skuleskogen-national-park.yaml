resumen:
  es: >-
    El corazón de la Costa Alta sueca (*Höga Kusten*), el lugar con el mayor reajuste isostático postglaciar
    del mundo (286 m de elevación de la tierra tras los hielos), destacando el cañón Slåttdalssvackan.
  en: >-
    The heart of Sweden's High Coast (*Höga Kusten*), the site of the world's greatest post-glacial isostatic
    rebound (286 m of land uplift after the ice), featuring the Slåttdalssvackan canyon.
  fr: >-
    Le cœur de la Haute Côte suédoise (*Höga Kusten*), lieu du plus grand réajustement isostatique
    post-glaciaire au monde (286 m de soulèvement des terres après la fonte des glaces), remarquable pour la
    faille de Slåttdalssvackan.
  de: >-
    Das Herzstück der schwedischen Hohen Küste (*Höga Kusten*), dem Ort der weltweit stärksten postglazialen
    Landhebung (286 m Hebung nach der Eisschmelze), berühmt für die Schlucht Slåttdalssvackan.
  it: >-
    Il cuore della Costa Alta svedese (*Höga Kusten*), il sito con il più marcato rimbalzo isostatico
    postglaciale al mondo (286 m di sollevamento del suolo dopo il disgelo), celebre per la gola
    Slåttdalssvackan.
  pt: >-
    O coração da Costa Alta sueca (*Höga Kusten*), o local com a maior recuperação isostática pós-glaciar do
    mundo (286 m de elevação de terras após o degelo), com destaque para o desfiladeiro de Slåttdalssvackan.
unico:
  es: >-
    Aquí puedes caminar por una costa que sigue naciendo: la isla de Tärnättholmarna se está convirtiendo,
    poco a poco, en península.
  en: >-
    Here you can walk along a coastline that continues to emerge: the island of Tärnättholmarna is slowly
    transforming into a peninsula.
  fr: >-
    Ici, vous pouvez arpenter un littoral qui continue d'émerger : l'île de Tärnättholmarna se transforme
    lentement en péninsule.
  de: >-
    Hier wanderst du entlang einer Küste, die unablässig neu entsteht: Die Insel Tärnättholmarna wächst
    langsam zu einer Halbinsel zusammen.
  it: >-
    Qui puoi camminare lungo una costa che continua a nascere: l'isola di Tärnättholmarna si sta lentamente
    unendo alla terraferma diventando una penisola.
  pt: >-
    Aqui podes caminhar ao longo de uma costa em constante génese: a ilha de Tärnättholmarna está a
    converter-se, lentamente, numa península.
observaciones:
  es: >-
    Se acampa solo en lugares señalados y un máximo de tres noches seguidas entre el 1 de mayo y el 30 de
    septiembre, y solo se permite hacer fuego en los lugares habilitados en esas mismas fechas. No hay grifos
    de agua potable: el agua de los arroyos no tiene calidad garantizada y en veranos secos muchos se secan.
texto:
  es:
    intro: >-
      Esta tierra sube. Hace 20.000 años, en lo más duro de la última glaciación, el centro del casquete de
      hielo estaba en el mar junto a la Costa Alta; al fundirse, el suelo empezó a elevarse, y hoy lo hace a
      unos 8 mm por año. Skuleskogen es el sitio donde mejor se ve el resultado: bosques, roca desnuda y
      valles de fisura profunda junto al Báltico, con cumbres que fueron islas y bahías que se convierten en
      lagos.


      El parque ocupa 3.062 hectáreas, 282 de ellas marinas, a lo largo de la costa. Su cima más alta,
      Slåttdalsberget, mide 280 metros y se alza casi directamente desde el mar.
    landscape: >-
      La roca principal es el granito de Nordingrå, un granito rapakivi formado hace unos 1.500 millones de
      años. Es un sustrato pobre en nutrientes; por eso la diabasa del noreste, que da un terreno muy fértil y
      una vegetación más rica, marca la diferencia. La diabasa también explica la grieta más famosa:
      Slåttdalsskrevan empezó a formarse hace 1.200 millones de años, cuando el magma rellenó una fractura y
      se solidificó en diabasa; esta, más blanda, se erosionó con el tiempo. Hoy la grieta mide 200 metros de
      largo, 30 de profundidad y siete de ancho.


      La subida del terreno hizo el resto. En aquella época las cumbres del parque eran islas, y algunas
      montañas conservan una cima que nunca estuvo bajo el mar tras retirarse el hielo: Nylandsruten es uno de
      esos «kalottberg», montes con casquete. El clima añade matices. Es húmedo, con unos 700 mm de
      precipitación al año, más de un tercio en forma de nieve, que cubre el suelo unos 175 días de media. La
      influencia marítima enfría los primeros veranos respecto al interior, pero suaviza los otoños.


      El 36 % del parque es roca desnuda, un sustrato pobre para la vegetación, y el resto es sobre todo
      coníferas.
    wildlife: >-
      Skuleskogen está en el límite norte del área de distribución de varias plantas. Su símbolo es un liquen:
      Dolichousnea longissima, amenazado en Suecia. En el desvío de Krypenbranten, junto a la entrada norte,
      se puede ver otro liquen colgante raro, el «långskägg». En verano florece en Näskebodarna una pradera
      variada con topplåsbräken, kattfot, röllika y femfingerört.


      Entre los mamíferos hay [lince](/especie/lynx_lynx/), [oso pardo](/especie/ursus_arctos/), zorro, tejón,
      marta, [alce](/especie/alces_alces/), [castor](/especie/castor_fiber/) y [foca
      gris](/especie/halichoerus_grypus/). La población de lince de la región disminuye, probablemente por la
      fragmentación del hábitat que causa la carretera E4. Entre las aves amenazadas en Suecia figuran el
      arrendajo siberiano, el [pico tridáctilo](/especie/picoides_tridactylus/) y el colimbo chico, y hay
      poblaciones importantes de pico cano, [grulla](/especie/grus_grus/) y garza real. Es además la zona del
      condado más rica en escarabajos.


      Las estaciones cambian el parque. En octubre ofrece una intensa muestra de colores otoñales. Mayo, junio
      y desde mediados de agosto suelen tener menos visitantes que julio y comienzos de agosto, y en invierno
      la ruta a Slåttdalsskrevan se hace con raquetas.
    visit: >-
      El parque está en la Costa Alta, junto al mar al este de la E4, entre Örnsköldsvik y Härnösand, y tiene
      tres entradas: oeste, sur y norte. El naturum Höga Kusten está a unos diez kilómetros de las entradas
      sur y oeste, junto a Skuleberget y la E4. Informa sobre el parque y el Patrimonio Mundial y organiza
      visitas guiadas, caminatas y actividades para niños durante todo el año.


      Empieza por lo más fácil: desde la entrada oeste sale un camino adaptado hasta el mirador de
      Nylandsruten, apto para sillas de ruedas y cochecitos, desde el que se ven gran parte del parque, el
      faro de Skags, la reserva de Trysunda y las Ulvöarna.


      La caminata más popular es la de Slåttdalsskrevan. Se llega desde las tres entradas: unos 6 km desde la
      oeste, 4,5 desde la norte y 3,5 desde la sur. El tramo desde la entrada oeste es exigente en partes y va
      sobre roca con pinar claro y vistas al archipiélago.


      Para ir junto al mar, la Kuststigen une las entradas sur y norte: es menos accidentada que otros
      senderos, discurre junto al mar y pasa por varias playas de arena. Desde la entrada sur hay 5,5 km hasta
      Tärnättholmarna. Näskebodarna, una antigua majada junto al mar, está a 3,8 km de la entrada sur
      siguiendo la Kuststigen.
    history: >-
      A lo largo de la costa de entonces hay numerosos túmulos funerarios de la Edad del Bronce, 28 de ellos
      dentro del parque. A mediados del siglo XIX la tala alcanzó casi todo el bosque, pero cesó a finales de
      siglo, por lo que hoy domina el arbolado de más de 100 años. Hasta hacia 1900 hubo en Skrattabborrtjärn
      una majada de verano, con como mucho una decena de edificios.


      Antiguamente el bosque era uno de los tramos más temidos del camino de los comerciantes, tenido por
      guarida de bandidos y proscritos. El parque se creó en 1984 y en 2000 pasó a formar parte, con el resto
      de la Costa Alta, de la lista del Patrimonio Mundial de la UNESCO.
    before: >-
      Se acampa solo en lugares señalados y un máximo de tres noches seguidas entre el 1 de mayo y el 30 de
      septiembre, y solo se permite hacer fuego en los lugares habilitados en esas mismas fechas. No hay
      grifos de agua potable: el agua de los arroyos no tiene calidad garantizada y en veranos secos muchos se
      secan.
  en:
    intro: >-
      This land rises. Some 20,000 years ago, at the height of the last ice age, the centre of the ice sheet
      lay in the sea just off the High Coast; as it melted, the land began to rebound, and today it rises by
      about 8 mm per year. Skuleskogen is the place where this phenomenon is most dramatic: ancient forests,
      bare bedrock, and deep fissure valleys by the Baltic, where mountaintops were once islands and marine
      bays are turning into freshwater lakes.


      The park covers 3,062 hectares along the coast, 282 of which are marine. Its highest peak,
      Slåttdalsberget, rises to 280 metres almost directly from the sea.
    landscape: >-
      The bedrock is dominated by Nordingrå granite, a rapakivi granite formed some 1,500 million years ago.
      It is nutrient-poor; thus the diabase in the northeast, which creates fertile ground and far richer
      vegetation, makes all the difference. Diabase also explains the park's most celebrated feature:
      Slåttdalsskrevan began forming 1,200 million years ago when magma welled up into a fracture, solidifying
      into diabase that gradually eroded away over eons. Today the gorge measures 200 metres long, 30 deep,
      and seven wide.


      Post-glacial rebound did the rest. In that epoch the park's summits stood as isolated islands, and some
      hills still preserve caps untouched by the sea after the ice receded: Nylandsruten is one such
      "kalottberg" (capped mountain). The climate adds its own nuances: it is damp, with about 700 mm of
      annual precipitation, over a third falling as snow that blankets the ground for an average of 175 days.
      Maritime influence keeps early summer cooler than inland, but softens autumn frosts.


      About 36 % of the park consists of exposed bedrock with sparse vegetation, while the remainder is
      predominantly coniferous forest.
    wildlife: >-
      Skuleskogen marks the northern range limit for several plant species. Its botanical symbol is a rare
      hanging lichen: *Dolichousnea longissima*, endangered in Sweden. Along the trail at Krypenbranten near
      the north entrance, you can spot another rare beard lichen, "långskägg". In summer, an alpine meadow
      blooms at Näskebodarna with moonwort, mountain everlasting, yarrow, and tormentil.


      Mammals include the [Eurasian lynx](/especie/lynx_lynx/), [brown bear](/especie/ursus_arctos/), red fox,
      badger, pine marten, [moose](/especie/alces_alces/), [Eurasian beaver](/especie/castor_fiber/), and
      [grey seal](/especie/halichoerus_grypus/). The local lynx population has dwindled, likely owing to
      habitat fragmentation caused by highway E4. Birds of conservation concern in Sweden include Siberian
      jay, [three-toed woodpecker](/especie/picoides_tridactylus/), and red-throated diver; there are also
      strong populations of grey-headed woodpecker, [common crane](/especie/grus_grus/), and grey heron. The
      area is also the county's richest sanctuary for wood-boring beetles.


      The seasons transform the park completely. October paints the canopy in vibrant autumn hues. May, June,
      and the period from mid-August onward see fewer visitors than July and early August, while in winter the
      trek to Slåttdalsskrevan calls for snowshoes.
    visit: >-
      The park is located on the High Coast beside the sea east of the E4, between Örnsköldsvik and Härnösand,
      and has three entrances: west, south, and north. The Naturum Höga Kusten visitor centre lies about ten
      kilometres from the south and west entrances, adjacent to Skuleberget and the E4. It offers
      interpretation on the national park and World Heritage Site, running guided walks, hikes, and children's
      activities year-round.


      For an accessible start, the west entrance offers an adapted trail leading to the Nylandsruten
      viewpoint, accessible to wheelchairs and prams, with expansive panoramas over the park, Skags
      lighthouse, the Trysunda reserve, and the Ulvöarna archipelago.


      The most celebrated hike leads to Slåttdalsskrevan. Accessible from all three entrances: roughly 6 km
      from the west, 4.5 from the north, and 3.5 from the south. The path from the west entrance is rugged in
      stretches, passing over rocky pine barrens with island vistas.


      To follow the shore, the Kuststigen links the south and north entrances: it is gentler than other
      trails, hugging the sea and passing several sandy bays. From the south entrance it is 5.5 km to
      Tärnättholmarna. Näskebodarna, a historic coastal summer farm, lies 3.8 km from the south entrance along
      the Kuststigen.
    history: >-
      Bronze Age burial cairns dot the ancient shoreline of that era, with 28 located inside the park
      boundaries. During the mid-nineteenth century, logging swept across almost the entire forest, but
      cutting ceased toward the end of the century; today mature forest older than 100 years covers the
      landscape. Until around 1900, a summer shieling operated at Skrattabborrtjärn with up to ten cabins.


      In earlier times this wilderness was one of the most feared passages along the coastal merchant route,
      notorious as a lair of outlaws and bandits. The national park was established in 1984 and in 2000 joined
      the UNESCO World Heritage list alongside the rest of the High Coast.
    before: >-
      Camping is permitted only in designated areas and for a maximum of three consecutive nights between 1
      May and 30 September, and campfires are allowed only at designated hearths during that same period.
      There are no drinking water taps: stream water cannot be guaranteed safe for drinking, and during dry
      summers many creeks dry up completely.
  fr:
    intro: >-
      Cette terre s'élève. Il y a 20 000 ans, au plus fort de la dernière glaciation, le cœur de la calotte
      glaciaire pesait en mer au large de la Haute Côte ; à sa fonte, le sol s'est mis à remonter, et poursuit
      son ascension aujourd'hui à raison d'environ 8 mm par an. Skuleskogen est le site où ce prodige est le
      plus visible : forêts boréales, roches dénudées et vallées de failles profondes bordant la Baltique, où
      les sommets furent jadis des îles et les baies marines deviennent des lacs d'eau douce.


      Le parc s'étend sur 3 062 hectares, dont 282 marins, le long du littoral. Son point culminant,
      Slåttdalsberget, culmine à 280 mètres et s'élève presque à pic au-dessus de la mer.
    landscape: >-
      La roche dominante est le granite de Nordingrå, un granite rapakivi formé il y a environ 1 500 millions
      d'années. C'est un substrat très pauvre en éléments nutritifs ; aussi la diabase présente au nord-est,
      générant un sol très fertile et une végétation luxuriante, marque-t-elle un net contraste. La diabase
      explique également la faille emblématique : Slåttdalsskrevan s'est ébauchée voici 1 200 millions
      d'années lors d'une intrusion magmatique solidifiée en diabase, roche plus tendre qui s'est érodée au
      fil des âges. Aujourd'hui, le couloir mesure 200 mètres de long, 30 de profondeur et sept de large.


      Le soulèvement post-glaciaire a parachevé le relief. À cette époque, les sommets du parc étaient des
      îles, et certaines collines conservent une calotte restée hors d'eau après le retrait des glaces :
      Nylandsruten est l'un de ces « kalottberg » (monts à calotte). Le climat apporte sa rigueur. Humide,
      avec environ 700 mm de précipitations annuelles dont plus d'un tiers sous forme de neige, qui tapisse le
      sol durant 175 jours en moyenne. L'influence maritime rafraîchit le début d'été par rapport à
      l'intérieur, mais adoucit les automnes.


      Près de 36 % du parc est fait de roche nue pauvre en végétation, le reste étant dominé par la forêt de
      résineux.
    wildlife: >-
      Skuleskogen marque la limite septentrionale de répartition de plusieurs espèces végétales. Son symbole
      est un lichen suspendu rarissime : *Dolichousnea longissima*, menacé en Suède. Sur le sentier de
      Krypenbranten près de l'entrée nord, on découvre un autre lichen barbu remarquable, le « långskägg ». En
      été s'épanouit à Näskebodarna une prairie riche en botryches lunaires, pieds-de-chat, millefeuilles et
      potentilles.


      Parmi les mammifères figurent le [lynx boréal](/especie/lynx_lynx/), l'[ours
      brun](/especie/ursus_arctos/), le renard roux, le blaireau, la martre, l'[élan](/especie/alces_alces/),
      le [castor d'Europe](/especie/castor_fiber/) et le [phoque gris](/especie/halichoerus_grypus/). La
      population de lynx locale régresse, sans doute sous l'effet du morcellement provoqué par la route E4.
      Parmi les oiseaux menacés en Suède nichent le mésangeai imitateur, le [pic
      tridactyle](/especie/picoides_tridactylus/) et le plongeon catmarin ; on trouve aussi de belles densités
      de pic cendré, de [grue cendrée](/especie/grus_grus/) et de héron cendré. Le parc est en outre le refuge
      de coléoptères le plus diversifié de la province.


      Les saisons métamorphosent le paysage. Octobre déploie un feu d'artifice de teintes d'automne. Mai, juin
      et la période débutant à la mi-août connaissent moins d'affluence que juillet et début août, et en hiver
      l'ascension vers Slåttdalsskrevan se fait en raquettes.
    visit: >-
      Le parc se situe sur la Haute Côte, en bordure maritime à l'est de l'E4, entre Örnsköldsvik et
      Härnösand, et dispose de trois accès : ouest, sud et nord. Le Naturum Höga Kusten se trouve à une
      dizaine de kilomètres des entrées sud et ouest, à proximité de Skuleberget et de l'E4. Il informe sur le
      parc et le site du Patrimoine mondial et organise visites guidées, randonnées et activités pour enfants
      toute l'année.


      Commencez par le plus accessible : depuis l'entrée ouest, un chemin aménagé conduit au belvédère de
      Nylandsruten, praticable en fauteuil roulant et poussette, offrant une vue dégagée sur le parc, le phare
      de Skags, la réserve de Trysunda et les îles Ulvöarna.


      La randonnée maîtresse mène à Slåttdalsskrevan. On y accède depuis les trois portes : environ 6 km
      depuis l'ouest, 4,5 depuis le nord et 3,5 depuis le sud. La section occidentale est par endroits
      escarpée, grimpant sur la roche au milieu de pins clairs face aux îles.


      Pour longer le rivage, le Kuststigen relie les accès sud et nord : moins accidenté que les crêtes, il
      longe l'eau et dessert plusieurs anses sablonneuses. Depuis l'accès sud, il y a 5,5 km jusqu'à
      Tärnättholmarna. Näskebodarna, un ancien hameau d'estive au bord de l'eau, se trouve à 3,8 km de
      l'entrée sud par le Kuststigen.
    history: >-
      Le long de l'ancien rivage se dressent de nombreux tumulus funéraires de l'âge du bronze, dont 28 à
      l'intérieur du parc. Au milieu du XIXe siècle, les coupes de bois touchèrent la quasi-totalité de la
      forêt, avant de cesser à la fin du siècle ; c'est pourquoi dominent aujourd'hui des arbres de plus de
      100 ans. Jusque vers 1900 subsistait à Skrattabborrtjärn un alpage d'été ne comptant pas plus d'une
      dizaine de cabanes.


      Jadis, cette forêt était l'un des passages les plus craints de la route côtière marchande, tenue pour un
      repaire de brigands et de proscrits. Le parc a été créé en 1984 et a été inscrit en 2000, avec
      l'ensemble de la Haute Côte, au patrimoine mondial de l'UNESCO.
    before: >-
      Le bivouac n'est permis que dans les zones balisées et pour trois nuits consécutives au maximum entre le
      1er mai et le 30 septembre, et les feux sont strictement réservés aux foyers prévus à cet effet durant
      ces mêmes dates. Il n'y a pas de points d'eau potable : l'eau des ruisseaux n'offre aucune garantie
      sanitaire et beaucoup s'assèchent lors des étés chauds.
  de:
    intro: >-
      Dieses Land steigt empor. Vor 20.000 Jahren, auf dem Höhepunkt der letzten Eiszeit, drückte das Zentrum
      des Eisschilds vor der Hohen Küste auf das Meer; als das Eis schmolz, hob sich das Land und steigt heute
      noch um etwa 8 mm pro Jahr. Skuleskogen ist der Ort, an dem dieses Phänomen am eindrucksvollsten
      sichtbar wird: Urwälder, nackte Felsplateaus und tiefe Spaltentäler an der Ostsee, wo Berggipfel einst
      Inseln waren und Meeresbuchten zu Süßwasserseen werden.


      Der Nationalpark erstreckt sich über 3.062 Hektar entlang der Küste, davon 282 Hektar Meeresfläche. Sein
      höchster Gipfel, der Slåttdalsberget, misst 280 Meter und ragt fast unmittelbar aus dem Meer empor.
    landscape: >-
      Das vorherrschende Gestein ist Nordingrå-Granit, ein Rapakiwi-Granit, der vor rund 1.500 Millionen
      Jahren entstand. Er bildet einen nährstoffarmen Boden; daher setzt der Diabas im Nordosten, der
      fruchtbare Böden und üppige Vegetation hervorbringt, einen deutlichen Kontrast. Diabas erklärt auch die
      berühmteste Schlucht: Slåttdalsskrevan begann vor 1.200 Millionen Jahren zu entstehen, als Magma eine
      Kluft füllte und zu Diabas erstarrte, der über Jahrmillionen rascher verwitterte. Heute ist der Spalt
      200 Meter lang, 30 Meter tief und sieben Meter breit.


      Die Landhebung formte den Rest des Reliefs. Zu jener Zeit bildeten die Höhenzüge des Parks Inseln, und
      einige Berge tragen eine Kappe, die nach dem Rückzug des Eises nie vom Meer überspült wurde:
      Nylandsruten ist ein solcher „Kalottberg“ (Kappenberg). Das Klima setzt eigene Akzente. Es ist feucht,
      mit rund 700 mm Jahresniederschlag, davon mehr als ein Drittel als Schnee, der den Boden
      durchschnittlich an 175 Tagen bedeckt. Der maritime Einfluss kühlt den Frühsommer im Vergleich zum
      Binnenland ab, dämpft aber die Herbste.


      Etwa 36 % der Parkfläche bestehen aus nacktem Fels mit schütterem Bewuchs, der Rest ist vor allem
      Nadelwald.
    wildlife: >-
      Skuleskogen liegt an der nördlichen Verbreitungsgrenze etlicher Pflanzenarten. Sein Wappenzeichen ist
      eine vom Aussterben bedrohte Bartflechte: *Dolichousnea longissima*. Am Pfad bei Krypenbranten unweit
      des Nordeingangs kannst du eine weitere seltene Hänge-Flechte entdecken, das „Långskägg“. Im Sommer
      blüht auf Näskebodarna eine bunte Wiese mit Mondraute, Katzenpfötchen, Schafgarbe und Fingerkraut.


      Unter den Säugetieren leben hier [Eurasischer Luchs](/especie/lynx_lynx/),
      [Braunbär](/especie/ursus_arctos/), Rotfuchs, Dachs, Baummarder, [Elch](/especie/alces_alces/),
      [Europäischer Biber](/especie/castor_fiber/) und [Kegelrobbe](/especie/halichoerus_grypus/). Der
      Luchsbestand der Region schrumpft, vermutlich infolge der Zerschneidung durch die Europastraße E4. Zu
      den in Schweden gefährdeten Vogelarten zählen Unglückshäher,
      [Dreizehenspecht](/especie/picoides_tridactylus/) und Sterntaucher; zudem gibt es bedeutende Bestände an
      Grauspecht, [Kranich](/especie/grus_grus/) und Graureiher. Das Areal ist überdies das käferreichste
      Schutzgebiet der Provinz.


      Die Jahreszeiten wandeln den Park tiefgreifend. Im Oktober leuchtet das Herbstlaub in intensiven Farben.
      Mai, Juni und die Zeit ab Mitte August verzeichnen weniger Andrang als Juli und Anfang August, und im
      Winter erkundet man die Route zur Slåttdalsskrevan auf Schneeschuhen.
    visit: >-
      Der Park liegt an der Hohen Küste östlich der E4 am Meer zwischen Örnsköldsvik und Härnösand und besitzt
      drei Eingänge: West, Süd und Nord. Das Naturum Höga Kusten liegt etwa zehn Kilometer von den Eingängen
      Süd und West entfernt am Skuleberget an der E4. Es informiert über Nationalpark und Welterbe und bietet
      ganzjährig Führungen, Wanderungen und Kinderaktivitäten an.


      Beginne mit der leichtesten Tour: Vom Westeingang führt ein barrierefreier Weg zum Aussichtspunkt
      Nylandsruten, befahrbar mit Rollstuhl und Kinderwagen, mit weitem Blick über den Park, das Leuchtfeuer
      Skags, das Reservat Trysunda und die Ulvöarna.


      Die beliebteste Wanderung führt zur Slåttdalsskrevan. Sie ist von allen drei Eingängen erreichbar: rund
      6 km ab West, 4,5 km ab Nord und 3,5 km ab Süd. Der Westabschnitt ist stellenweise steil und führt über
      Felskuppen mit lichten Kiefern und Inselblick.


      Direkt an der Ostsee verläuft der Kuststigen zwischen den Eingängen Süd und Nord: Er ist sanfter als die
      Bergpfade, folgt dem Ufer und berührt mehrere Sandstrände. Vom Südeingang sind es 5,5 km bis
      Tärnättholmarna. Näskebodarna, eine historische Sennhütte an einer Meeresbucht, liegt 3,8 km vom
      Südeingang entlang des Kuststigen entfernt.
    history: >-
      Entlang der damaligen Uferlinie finden sich zahlreiche bronzezeitliche Steinhügelgräber, 28 davon
      innerhalb des Nationalparks. Mitte des neunzehnten Jahrhunderts erfasste der Holzeinschlag fast den
      gesamten Wald, kam jedoch gegen Ende des Jahrhunderts zum Erliegen; daher dominiert heute ein
      Baumbestand von mehr als 100 Jahren. Bis um 1900 existierte am Skrattabborrtjärn eine Sommersennhütte
      mit höchstens zehn Gebäuden.


      Früher galt der dichte Wald als einer der gefürchtetsten Abschnitte des Handelswegs, verrufen als
      Unterschlupf von Räubern und Gesetzlosen. Der Park wurde 1984 gegründet und im Jahr 2000 gemeinsam mit
      der restlichen Hohen Küste in das UNESCO-Welterbe aufgenommen.
    before: >-
      Zelten ist nur an ausgewiesenen Plätzen und für maximal drei aufeinanderfolgende Nächte zwischen dem 1.
      Mai und dem 30. September gestattet; offenes Feuer ist im selben Zeitraum ausschließlich an den festen
      Feuerstellen erlaubt. Es gibt keine Trinkwasserstellen: Die Qualität der Bäche ist nicht garantiert und
      in trockenen Sommern versiegen viele Läufe ganz.
  it:
    intro: >-
      Questa terra si solleva. Circa 20.000 anni fa, nel momento più rigido dell'ultima glaciazione, il centro
      della calotta glaciale premeva in mare a ridosso dell'odierna Costa Alta; sciogliendosi i ghiacci, la
      crosta terrestre ha iniziato a innalzarsi e ancora oggi sale di circa 8 mm all'anno. Skuleskogen è il
      luogo in cui questo fenomeno si ammira al meglio: antiche foreste, roccia nuda e profonde valli di
      faglia sul Baltico, dove vette un tempo isole e baie marine si tramutano in laghi d'acqua dolce.


      Il parco si estende per 3.062 ettari lungo la riva, di cui 282 marini. La sua vetta più alta,
      Slåttdalsberget, raggiunge i 280 metri e si erge quasi a picco sul mare.
    landscape: >-
      La roccia principale è il granito di Nordingrå, un granito rapakivi formatosi circa 1.500 milioni di
      anni fa. È un substrato povero di nutrienti; per questo il diabase a nord-est, che genera suoli molto
      fertili e una vegetazione assai ricca, fa una netta differenza. Il diabase spiega anche la celebre gola:
      Slåttdalsskrevan cominciò a delinearsi 1.200 milioni di anni fa, quando il magma colmò una frattura
      consolidandosi in diabase, che col tempo si è eroso più facilmente. Oggi la spaccatura misura 200 metri
      di lunghezza, 30 di profondità e sette di larghezza.


      Il sollevamento della terra ha fatto il resto. A quell'epoca le cime del parco erano isole e alcune
      alture conservano una sommità che non è mai finita sott'acqua dopo il ritiro dei ghiacci: Nylandsruten è
      uno di questi "kalottberg" (monti a calotta). Il clima aggiunge sfumature: è umido, con circa 700 mm di
      precipitazioni all'anno, di cui oltre un terzo sotto forma di neve, che ricopre il suolo per 175 giorni
      in media. L'influsso marino rinfresca l'inizio dell'estate rispetto all'interno, ma attenua i rigori
      autunnali.


      Il 36 % del parco è costituito da roccia spoglia con vegetazione stentata, mentre il resto è coperto in
      gran parte da conifere.
    wildlife: >-
      Skuleskogen segna il confine settentrionale dell'areale di diverse piante. Il suo simbolo è un lichene
      pendente rarissimo: *Dolichousnea longissima*, minacciato in Svezia. Lungo il sentiero di Krypenbranten,
      vicino all'ingresso nord, si può scorgere un altro singolare lichene a barba, il "långskägg". In estate
      fiorisce a Näskebodarna un prato vario con botrichio lunaria, piede di gatto, achillea millefoglie e
      potentilla.


      Tra i mammiferi si incontrano la [lince](/especie/lynx_lynx/), l'[Orso bruno](/especie/ursus_arctos/),
      la volpe, il tasso, la martora, l'[alce](/especie/alces_alces/), il [castoro
      europeo](/especie/castor_fiber/) e la [Foca grigia](/especie/halichoerus_grypus/). La popolazione locale
      di lince è in calo, con ogni probabilità a causa della frammentazione ambientale provocata dalla strada
      E4. Tra i volatili a rischio in Svezia spiccano la ghiandaia siberiana, il [Picchio
      tridattilo](/especie/picoides_tridactylus/) e la strolaga minore; non mancano popolazioni cospicue di
      picchio cenerino, [Gru](/especie/grus_grus/) e airone cenerino. È inoltre l'area provinciale più ricca
      in coleotteri silvicoli.


      Le stagioni trasformano il parco. In ottobre offre un magnifico spettacolo di tonalità autunnali.
      Maggio, giugno e da metà agosto in poi registrano meno afflusso rispetto a luglio e inizio agosto,
      mentre in inverno la salita a Slåttdalsskrevan si affronta con le ciaspole.
    visit: >-
      Il parco sorge sulla Costa Alta, affacciato sul mare a est della E4, tra Örnsköldsvik e Härnösand, e
      dispone di tre ingressi: ovest, sud e nord. Il Naturum Höga Kusten si trova a circa dieci chilometri
      dagli ingressi sud e ovest, vicino a Skuleberget e alla E4. Offre informazioni sul parco e sul
      Patrimonio Mondiale, organizzando visite guidate, escursioni e attività per bambini tutto l'anno.


      Comincia dall'accesso più facile: dall'ingresso ovest si dirama un percorso attrezzato verso il
      belvedere di Nylandsruten, accessibile a sedie a rotelle e passeggini, con splendida visuale su gran
      parte del parco, sul faro di Skags, sulla riserva di Trysunda e sulle isole Ulvöarna.


      L'escursione più celebre conduce a Slåttdalsskrevan. È raggiungibile da tutti e tre gli ingressi: circa
      6 km da quello ovest, 4,5 da quello nord e 3,5 da quello sud. Il tratto dall'ingresso ovest presenta
      tratti impegnativi e risale su roccia tra pini radi con vista sull'arcipelago.


      Per camminare lungo il litorale, il Kuststigen collega gli ingressi sud e nord: è meno aspro rispetto ai
      sentieri interni, segue la costa e tocca diverse spiagge sabbiose. Dall'ingresso sud dista 5,5 km da
      Tärnättholmarna. Näskebodarna, un antico alpeggio marittimo, si trova a 3,8 km dall'ingresso sud lungo
      il Kuststigen.
    history: >-
      Lungo l'antica costa dell'epoca si conservano numerosi tumuli funerari dell'età del bronzo, di cui 28
      all'interno del parco. Verso la metà del XIX secolo i disboscamenti interessarono quasi l'intera
      foresta, ma cessarono alla fine del secolo; per questo oggi predomina una copertura arborea con oltre
      100 anni di età. Fino a circa il 1900 funzionò a Skrattabborrtjärn un alpeggio estivo con una decina di
      capanni al massimo.


      In passato il bosco costituiva uno dei tratti più temuti dai mercanti lungo la pista costiera,
      considerato covo di briganti e fuorilegge. Il parco fu istituito nel 1984 e nel 2000 è entrato a far
      parte, insieme al resto della Costa Alta, del Patrimonio Mondiale dell'UNESCO.
    before: >-
      Il campeggio è consentito unicamente nelle aree designate e per un massimo di tre notti consecutive tra
      il 1° maggio e il 30 settembre, e l'accensione di fuochi è permessa solo nei bracieri autorizzati nelle
      stesse date. Non ci sono fontanelle d'acqua potabile: l'acqua dei torrenti non ha potabilità certificata
      e nelle estati aride molti corsi d'acqua si prosciugano.
  pt:
    intro: >-
      Esta terra eleva-se. Há 20.000 anos, no auge da última glaciação, o centro da calota de gelo comprimia o
      mar junto à Costa Alta; ao derreter, o solo começou a reerguer-se e ascende hoje a um ritmo de cerca de
      8 mm por ano. Skuleskogen é o lugar onde melhor se observa este fenómeno: florestas seculares, rocha nua
      e vales de falha profundos junto ao Báltico, com cumes que foram ilhas e baías marinhas que se convertem
      em lagoas de água doce.


      O parque abrange 3.062 hectares, 282 dos quais marítimos, ao longo da linha de costa. O seu cume mais
      elevado, Slåttdalsberget, atinge 280 metros e ergue-se quase verticalmente a partir do mar.
    landscape: >-
      A rocha predominante é o granito de Nordingrå, um granito rapakivi formado há cerca de 1.500 milhões de
      anos. É um substrato muito pobre em nutrientes; por isso o diabásio no nordeste, que origina um terreno
      muito fértil e uma vegetação mais luxuriante, faz toda a diferença. O diabásio explica também a fenda
      mais célebre: Slåttdalsskrevan começou a esboçar-se há 1.200 milhões de anos, quando o magma preencheu
      uma fratura e solidificou em diabásio, rocha mais branda que se desgastou com o tempo. Hoje a fenda mede
      200 metros de comprimento, 30 de profundidade e sete de largura.


      A subida do terreno moldou o resto. Naquela época os cumes do parque eram ilhas e algumas elevações
      conservam um topo que nunca esteve submerso após o recuo do gelo: Nylandsruten é um desses «kalottberg»,
      montes de calota. O clima introduz contrastes. É húmido, com cerca de 700 mm de precipitação anual, mais
      de um terço sob a forma de neve, que cobre o solo durante 175 dias em média. A influência marítima
      arrefece o início do verão em relação ao interior, mas ameniza os outonos.


      Cerca de 36 % do parque é composto por rocha nua com vegetação rasteira, enquanto o restante é sobretudo
      floresta de coníferas.
    wildlife: >-
      Skuleskogen situa-se no limite setentrional da área de distribuição de várias plantas. O seu emblema
      botânico é um líquene pendente muito raro: *Dolichousnea longissima*, ameaçado na Suécia. No trilho de
      Krypenbranten, perto da entrada norte, pode avistar-se outro líquene barbado raro, o «långskägg». No
      verão floresce em Näskebodarna uma pradaria variada com botríquio-lunar, pé-de-gato, milefólio e
      potentilha.


      Entre os mamíferos encontram-se o [lince-euroasiático](/especie/lynx_lynx/), o
      [urso-pardo](/especie/ursus_arctos/), a raposa, o texugo, a marta, o [alce](/especie/alces_alces/), o
      [castor-europeu](/especie/castor_fiber/) e a [foca-cinzenta](/especie/halichoerus_grypus/). A população
      regional de lince diminui, provavelmente pela fragmentação do habitat provocada pela autoestrada E4.
      Entre as aves em perigo na Suécia contam-se o gaio-siberiano, o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/) e a mobelha-pequena; ocorrem também populações
      relevantes de pica-pau-cinzento, [grou-comum](/especie/grus_grus/) e garça-real. É ainda o enclave com
      maior diversidade de escaravelhos da província.


      As estações do ano transformam profundamente o parque. Em outubro assiste-se a uma intensa paleta de
      cores outonais. Maio, junho e a partir de meados de agosto costumam registar menos visitantes do que
      julho e o início de agosto, enquanto no inverno a travessia até Slåttdalsskrevan se faz com raquetes de
      neve.
    visit: >-
      O parque localiza-se na Costa Alta, junto ao mar a leste da E4, entre Örnsköldsvik e Härnösand, dispondo
      de três entradas: oeste, sul e norte. O Naturum Höga Kusten fica a cerca de dez quilómetros das entradas
      sul e oeste, junto a Skuleberget e à E4. Fornece informação sobre o parque e o Património Mundial,
      promovendo visitas guiadas, caminhadas e atividades infantis ao longo de todo o ano.


      Começa pelo percurso mais acessível: da entrada oeste parte um passadiço adaptado até ao miradouro de
      Nylandsruten, acessível a cadeiras de rodas e carrinhos de bebé, de onde se contempla vasta parte do
      parque, o farol de Skags, a reserva de Trysunda e as ilhas Ulvöarna.


      A caminhada mais procurada conduz a Slåttdalsskrevan. É acessível a partir das três entradas: cerca de 6
      km a partir de oeste, 4,5 a partir de norte e 3,5 a partir de sul. O troço da entrada oeste é exigente
      em alguns pontos, subindo sobre rochedos e pinhais abertos com vista para o arquipélago.


      Para caminhar junto à água, o Kuststigen liga as entradas sul e norte: é menos acidentado do que os
      trilhos interiores, contorna a linha costeira e atravessa várias praias de areia. A partir da entrada
      sul são 5,5 km até Tärnättholmarna. Näskebodarna, um antigo abrigo de pescadores e pastores junto ao
      mar, fica a 3,8 km da entrada sul seguindo o Kuststigen.
    history: >-
      Ao longo da linha costeira da época encontram-se numerosos túmulos da Idade do Bronze em pedra solta, 28
      dos quais no interior do parque. Em meados do século XIX o corte de madeira atingiu quase toda a
      floresta, mas cessou no final desse século; por isso predomina hoje um arvoredo com mais de 100 anos de
      idade. Até cerca de 1900 existiu em Skrattabborrtjärn uma cabana de pastoreio de verão com cerca de uma
      dezena de construções no máximo.


      Antigamente esta floresta densa era um dos troços mais temidos na rota comercial da costa, vista como
      refúgio de bandidos e foras da lei. O parque foi criado em 1984 e em 2000 passou a integrar, juntamente
      com o resto da Costa Alta, a lista do Património Mundial da UNESCO.
    before: >-
      O acampamento só é permitido em locais autorizados e durante um máximo de três noites consecutivas entre
      1 de maio e 30 de setembro, sendo fogueiras permitidas exclusivamente nas fogueiras oficiais nas mesmas
      datas. Não há pontos de água potável: a água dos ribeiros não tem garantia de salubridade e nos verões
      secos muitos secam totalmente.
