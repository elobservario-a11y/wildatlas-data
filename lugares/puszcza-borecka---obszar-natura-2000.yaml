resumen:
  es: Bosque masuriano diverso donde habita una importante población reintroducida de bisontes libres.
  en: >-
    Diverse Masurian old-growth woodland harbouring a significant reintroduced free-ranging European bison
    population.
  fr: Forêt mazurienne diversifiée abritant une population réintroduite majeure de bisons d'Europe en liberté.
  de: >-
    Artenreicher masurischer Urwald mit einer bedeutenden wiederangesiedelten Population frei lebender
    Wisente.
  it: >-
    Foresta masuriana eterogenea che accoglie un'importante popolazione reintrodotta di bisonti europei
    liberi.
  pt: Floresta masuriana diversa onde habita uma relevante população reintroduzida de bisontes-europeus livres.
unico:
  es: >-
    Es un bosque de varios árboles a la vez, sin masas de una sola especie, donde los bisontes se soltaron en
    1956 y seis años después ya vivían todos en libertad.
  en: >-
    A complex multi-species forest free of monocultures, where European bison were released in 1956 and were
    roaming completely wild six years later.
  fr: >-
    Une forêt multi-essences sans monoculture où les bisons d'Europe furent lâchés en 1956 et vivaient tous en
    totale liberté six ans plus tard.
  de: >-
    Ein vielschichtiger Mischwald ohne Monokulturen, in dem Wisente 1956 ausgewildert wurden und sechs Jahre
    später vollständig frei lebten.
  it: >-
    Un bosco plurispecifico privo di rimboschimenti monospecifici, dove i bisonti europei vennero rilasciati
    nel 1956 e vivevano tutti in piena libertà sei anni dopo.
  pt: >-
    É uma floresta de múltiplas espécies arbóreas sem manchas monoespecíficas, onde os bisontes foram
    libertados em 1956 e seis anos depois já viviam todos em total liberdade.
observaciones:
  es: >-
    Comprueba las normas del recinto de bisontes de Wolisko antes de la visita. Consulta también la web del
    distrito forestal de Borki para saber qué senderos están abiertos.
texto:
  es:
    intro: >-
      Los bisontes de la Puszcza Borecka viven libres, pero evitan a las personas. Por eso, para que los
      visitantes puedan verlos, se construyó un recinto cerca de Wolisko donde algunos viven de forma
      permanente. Esa pequeña paradoja resume el lugar: un gran bosque mazuriano de 230 km², el mayor complejo
      forestal de la región de lagos de Ełk, al este del lago Mamry, que se deja conocer poco a poco.


      Es un mosaico de tilos, robles y abetos rodeado por la región de los Grandes Lagos Masurianos, y su
      manada de bisontes en libertad es una población reintroducida de gran importancia.
    landscape: >-
      El terreno es ondulado, cubierto de colinas de morrena que no forman las crestas típicas de otras
      partes. Ese desorden glaciar dificulta la agricultura, y por eso se conservaron bajo el bosque grandes
      extensiones de suelos fértiles, propios de los bosques de carpe. La colina más alta es Lipowa Góra, de
      223 m. Entre las colinas hay depresiones encharcadas sin salida de agua, donde aparecen turberas altas y
      de transición. Los lagos más grandes son Szwałk Wielki, Piłwąg, Haszno (Łaźno) y Litygajno.


      El bosque cubre casi el 92 % del territorio. No hay masas de un solo tipo de árbol: dominan el roble, el
      carpe, el tilo, el fresno, la pícea, el aliso, el arce y el abedul pubescente. Crecen unas trescientas
      especies de plantas, 38 de ellas protegidas, y unos 90 líquenes, y entre las plantas raras está el tejo
      común.
    wildlife: >-
      Viven alces, bisontes, linces, nutrias, castores y lobos. El lince es muy escaso por el tamaño de sus
      territorios y la presencia de lobos, que le hacen competencia y lo amenazan, sobre todo a las crías.


      La historia del [bisonte](/especie/bison_bonasus/) aquí es reciente. Se soltó en el bosque en 1956 y se
      crió al principio en cautividad; seis años después toda la manada quedó libre. El recuento de la manada
      libre de Borecka contó 155 animales, 73 machos y 82 hembras.


      Entre las aves se han registrado 141 especies, entre ellas el pico dorsiblanco, el pico mediano y el
      papamoscas papirrojo, además de avetoros y grullas. Entre las aves protegidas hay parejas de pigargo, de
      águila pomerana (unas 25) y de cigüeña negra (16), y una de águila pescadora. La reserva Borki se creó
      para conservar bosques naturales y cuatro especies: el bisonte, el papamoscas collarino, el pico
      dorsiblanco y el liquen pulmonaria.


      De mayo a octubre es la mejor época.
    visit: >-
      El recinto de bisontes de Wolisko sirve para mostrar y educar, y también para que los bisontes se
      aclimaten antes de unirse a la manada libre. Es un espacio vallado de siete hectáreas con hierba, grupos
      de árboles y bebedero. El distrito forestal pide consultar sus normas antes de ir.


      Hay dos senderos de naturaleza. El de Kruklanki, con 12 paradas temáticas, cruza un paisaje variado:
      pueblo, bordes de cultivos, bosque, orilla de lago y estanque, caminos de tierra y un terraplén
      ferroviario, y descubre obras históricas militares y de ingeniería. El de Ogonki, en Pozezdrze, tiene
      dos etapas, una corta de 1,95 km y otra de unos tres, con 12 paneles que explican cómo funciona el
      bosque mazuriano, y un aula forestal al aire libre para grupos y escolares.
    history: >-
      Hasta el siglo VII a. C. aquí se extendía la inmensa y despoblada Puszcza Galindzka. Con los siglos se
      talaron bosques a gran escala, sobre todo los caducifolios de suelos fértiles, y en el siglo XVII los
      límites de la Puszcza Borecka ya eran casi los de hoy.


      La reserva Mazury, entre los lagos Szwałk Wielki, Piłwąg y Łaźno, es refugio de aves acuáticas; la
      reserva Borki conserva bosques de varios pisos con piceas, carpes, robles, fresnos y tilos de 100 a 150
      años; y Lipowy Jar guarda un bosque caducifolio variado y denso sobre colinas de laderas empinadas junto
      al lago Piłwąg.
    before: >-
      Comprueba las normas del recinto de bisontes de Wolisko antes de la visita. Consulta también la web del
      distrito forestal de Borki para saber qué senderos están abiertos.
    around: >-
      A dieciocho kilómetros queda el [Parque Paisajístico del Bosque de
      Romincka](/lugar/park-krajobrazowy-puszczy-rominckiej/). Más lejos, el [Parque Nacional de Białowieża -
      Reserva Estricta](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) comparte el papamoscas collarino,
      el pico dorsiblanco y el bisonte, igual que la [Reserva Natural Estricta
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) y la [Garganta del Crișul
      Repede](/lugar/cheile-crisului-repede/).
  en:
    intro: >-
      The wild European bison of the Puszcza Borecka roam free, but actively shun human encounters. To allow
      visitors to observe them safely, a dedicated semi-open reserve was built near Wolisko where several
      animals reside permanently. That gentle paradox encapsulates this place: a vast Masurian woodland
      covering 230 km², the largest contiguous forest complex in the Ełk Lake District east of Lake Mamry,
      revealing its wild secrets only gradually.


      It is a vibrant tapestry of small-leaved linden, pedunculate oak, and Norway spruce cradled by the Great
      Masurian Lakes, sheltering an internationally significant population of reintroduced free-ranging
      European bison.
    landscape: >-
      The terrain is undulating, formed by glacial moraine hills that lack the continuous ridge crests typical
      elsewhere. This chaotic postglacial topography hindered historic agriculture, successfully safeguarding
      extensive tracts of deep, fertile soils characteristic of temperate hornbeam-oak forests. The highest
      eminence is Lipowa Góra, rising to 223 m. Tucked among moraines lie enclosed hollows without surface
      drainage, where raised bogs and transitional mires have formed. The principal lakes are Szwałk Wielki,
      Piłwąg, Haszno (Łaźno), and Litygajno.


      Dense woodland blankets nearly 92 % of the territory. Monoculture plantations are completely absent: the
      multi-tiered canopy is dominated by oak, hornbeam, linden, ash, spruce, black alder, Norway maple, and
      downy birch. Botanical surveys record some three hundred plant species, 38 of which are legally
      protected, and around 90 lichen taxa, with old-growth rarities featuring English yew (*Taxus baccata*).
    wildlife: >-
      The mammal community includes elk, European bison, Eurasian lynx, Eurasian otter, beaver, and wolf. The
      lynx remains scarce due to vast territorial requirements and direct competition from resident wolf
      packs, which exert predatory pressure, particularly on lynx kittens.


      The history of the [European bison](/especie/bison_bonasus/) here is relatively recent. Animals were
      first released into enclosures in 1956 for captive breeding; six years later the entire herd was granted
      complete liberty. The census of the free-roaming Borecka herd recorded 155 animals, comprising 73 males
      and 82 females.


      Avian records document 141 bird species, featuring white-backed woodpecker, middle spotted woodpecker,
      and red-breasted flycatcher, alongside breeding Eurasian bitterns and common cranes. Protected nesting
      raptors and large birds include white-tailed eagle pairs, lesser spotted eagles (around 25 pairs), black
      storks (16 pairs), and an active osprey pair. The Borki nature reserve was designated to preserve
      primeval forest structures and four flagship species: European bison, collared flycatcher, white-backed
      woodpecker, and lungwort lichen (*Lobaria pulmonaria*).


      May to October is the finest season to visit.
    visit: >-
      The Wolisko bison enclosure serves educational purposes while providing an acclimatization facility for
      bison prior to joining the wild herd. It covers an enclosed paddock of seven hectares with pasture,
      mature tree groves, and a natural watering hole. The local forest inspectorate requests visitors check
      opening regulations in advance.


      Two interpretive nature trails traverse the forest. The Kruklanki trail features 12 thematic stops
      crossing a varied rural and forest mosaic: village lanes, crop margins, woodlands, lake and pond shores,
      dirt tracks, and an abandoned railway embankment, discovering historic military and civil engineering
      structures. The Ogonki trail in Pozezdrze comprises two loops—a shorter circuit of 1.95 km and a longer
      walk of about three kilometres—with 12 interpretive panels explaining the ecology of Masurian forests,
      complemented by an open-air forest classroom for student groups.
    history: >-
      Until the seventh century BC, this territory formed part of the boundless, uninhabited primeval
      wilderness known as Puszcza Galindzka. Over subsequent centuries, extensive forest clearances swept the
      region, clearing fertile broadleaf soils, so that by the seventeenth century the perimeter of Puszcza
      Borecka approximated its present configuration.


      The Mazury reserve, spanning between lakes Szwałk Wielki, Piłwąg, and Łaźno, provides a quiet haven for
      waterfowl; the Borki reserve protects multi-tiered virgin stands with spruce, hornbeam, oak, ash, and
      linden aged between 100 and 150 years; and Lipowy Jar preserves dense, diverse broadleaf forest on steep
      ravine slopes bordering Lake Piłwąg.
    before: >-
      Check visiting hours and access rules for the Wolisko bison demonstration enclosure prior to travelling.
      Consult the Borki Forest District website to verify trail conditions and closures.
    around: >-
      Eighteen kilometres away lies the [Romincka Forest Landscape
      Park](/lugar/park-krajobrazowy-puszczy-rominckiej/). Further afield, [Białowieża National Park - Strict
      Reserve](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) shares the collared flycatcher,
      white-backed woodpecker, and European bison, as do [Havešová Strict Nature
      Reserve](/lugar/narodna-prirodna-rezervacia-havesova/) and [Crișul Repede
      Gorge](/lugar/cheile-crisului-repede/).
  fr:
    intro: >-
      Les bisons d'Europe de la Puszcza Borecka vivent en liberté, mais fuient la présence humaine. Afin de
      permettre aux visiteurs de les observer, un enclos de démonstration a été aménagé près de Wolisko où
      quelques individus résident en permanence. Ce doux paradoxe résume ce haut lieu : un grand massif
      mazurien de 230 km², le plus vaste ensemble forestier de la région des lacs d'Ełk à l'est du lac Mamry,
      qui se dévoile en toute discrétion.


      C'est un patchwork de tilleuls, de chênes et d'épicéas au cœur de la région des Grands Lacs de Mazurie,
      dont la harde de bisons en liberté représente une réintroduction de premier plan.
    landscape: >-
      Le relief est moutonné, hérissé de collines morainiques qui ne dessinent pas les crêtes régulières
      observables ailleurs. Ce désordre glaciaire a contrarié la mise en culture historique, préservant de
      vastes sols fertiles propices aux chênaies-charmaies. Le point culminant est la Lipowa Góra, s'élevant à
      223 m. Entre les monticules subsistent des cuvettes humides sans exutoire où se forment tourbières
      hautes et de transition. Les lacs majeurs sont Szwałk Wielki, Piłwąg, Haszno (Łaźno) et Litygajno.


      La forêt couvre près de 92 % du territoire. Les peuplements monospécifiques sont absents : dominent le
      chêne pédonculé, le charme, le tilleul, le frêne, l'épicéa, l'aulne, l'érable et le bouleau pubescent.
      On y recense quelque trois cents espèces végétales, dont 38 protégées, et environ 90 lichens, avec des
      reliques telles que l'if commun.
    wildlife: >-
      Le peuplement de mammifères rassemble élan, bison d'Europe, lynx, loutre, castor et loup. Le lynx reste
      très rare en raison de ses exigences territoriales et de la concurrence directe exercée par les meutes
      de loups sur ses jeunes.


      L'histoire du [bison d'Europe](/especie/bison_bonasus/) est ici récente. Il fut introduit dans le massif
      en 1956 et d'abord élevé en captivité ; six ans après, la harde entière vivait en liberté. Le
      recensement de la population sauvage de Borecka a dénombré 155 individus, 73 mâles et 82 femelles.


      Chez les oiseaux, 141 espèces sont inventoriées, dont le pic à dos blanc, le pic mar et le gobe-mouche
      nain, aux côtés du butor étoilé et de la grue cendrée. Parmi les nicheurs protégés figurent le pygargue
      à queue blanche, l'aigle pomarin (environ 25 couples), la cigogne noire (16 couples) et le balbuzard
      pêcheur. La réserve de Borki a été créée pour préserver les peuplements naturels et quatre espèces
      phares : le bison d'Europe, le gobe-mouche à collier, le pic à dos blanc et la pulmonaire des chênes
      (*Lobaria pulmonaria*).


      La saison de mai à octobre est la plus recommandable.
    visit: >-
      L'enclos des bisons de Wolisko assure une mission pédagogique tout en permettant l'acclimatation des
      animaux avant leur intégration à la harde sauvage. C'est un espace clôturé de sept hectares alliant
      prairies, bouquets d'arbres et point d'eau. L'administration forestière invite à vérifier les modalités
      d'accès au préalable.


      Deux sentiers nature parcourent le massif. Celui de Kruklanki, jalonné de 12 haltes thématiques,
      traverse un paysage diversifié : bourg, lisières de cultures, sous-bois, rives lacustres et ballast
      ferroviaire, révélant ouvrages militaires et d'art. Celui d'Ogonki, à Pozezdrze, comporte deux étapes,
      une boucle courte de 1,95 km et une longue d'environ trois kilomètres, avec 12 panneaux explicatifs sur
      la dynamique forestière mazurienne et une clairière pédagogique pour les scolaires.
    history: >-
      Jusqu'au VIIe siècle av. J.-C. s'étendait ici l'immense Puszcza Galindzka désertique. Au fil des
      siècles, les défrichements entamèrent les sols fertiles de feuillus, si bien qu'au XVIIe siècle les
      contours de la Puszcza Borecka étaient déjà presque stabilisés.


      La réserve Mazury, ceinte par les lacs Szwałk Wielki, Piłwąg et Łaźno, forme un refuge pour oiseaux
      d'eau ; la réserve Borki abrite des futaies étagées d'épicéas, charmes, chênes, frênes et tilleuls âgés
      de 100 à 150 ans ; et Lipowy Jar préserve une forêt de feuillus dense sur des pentes raides côtoyant le
      lac Piłwąg.
    before: >-
      Prenez connaissance du règlement de l'enclos de Wolisko avant votre visite. Consultez également le site
      du district forestier de Borki pour connaître les sentiers praticables.
    around: >-
      À dix-huit kilomètres s'étend le [Parc paysager de la forêt de
      Romincka](/lugar/park-krajobrazowy-puszczy-rominckiej/). Plus loin, le [Parc national de Białowieża -
      Réserve intégrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) partage le gobe-mouche à
      collier, le pic à dos blanc et le bison d'Europe, tout comme la [Réserve naturelle intégrale de
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) et le [Défilé du Crișul
      Repede](/lugar/cheile-crisului-repede/).
  de:
    intro: >-
      Die Wisente der Puszcza Borecka leben frei, meiden jedoch menschliche Nähe. Damit Besucher sie dennoch
      beobachten können, wurde bei Wolisko ein Schaugehege errichtet, wo einige Tiere dauerhaft verweilen.
      Dieses kleine Paradoxon kennzeichnet das Gebiet: ein grosser masurischer Urwald von 230 km² Fläche, der
      grösste Waldkomplex der Seenplatte von Ełk östlich des Mamry-Sees, der sich nur behutsam erschliesst.


      Es ist ein Mosaik aus Linden, Eichen und Fichten inmitten der Masurischen Seenplatte, dessen freilebende
      Wisentherde eine Auswilderung von internationaler Tragweite darstellt.
    landscape: >-
      Das Relief ist wellig, geformt von Endmoränenhügeln, die keine zusammenhängenden Kämme bilden. Dieses
      eiszeitliche Durcheinander erschwerte die historische Rodung für den Ackerbau, wodurch unter dem
      Waldboden fruchtbare Böden der Eichen-Hainbuchen-Wälder bewahrt blieben. Höchste Erhebung ist die Lipowa
      Góra mit 223 m. In abflusslosen Senken zwischen den Hügeln bildeten sich Hoch- und Übergangsmoore. Die
      bedeutendsten Seen sind Szwałk Wielki, Piłwąg, Haszno (Łaźno) und Litygajno.


      Der Wald bedeckt fast 92 % des Gebiets. Reinbestände fehlen völlig: Es dominieren Stieleiche, Hainbuche,
      Winterlinde, Esche, Fichte, Schwarzerle, Spitzahorn und Moorbirke. Rund dreihundert Pflanzenarten
      wachsen hier, 38 davon gesetzlich geschützt, sowie etwa 90 Flechtenarten; zu den seltenen Baumarten
      zählt die Europäische Eibe.
    wildlife: >-
      Die Säugetierwelt umfasst Elch, Wisent, Luchs, Fischotter, Biber und Wolf. Der Luchs ist sehr selten,
      bedingt durch weite Reviere und Konkurrenz durch Wolfsrudel, die namentlich Jungluchse bedrängen.


      Die Geschichte des [Wisents](/especie/bison_bonasus/) ist hier jung. Die Tiere wurden 1956 angesiedelt
      und zunächst im Gehege gehalten; sechs Jahre später streifte die gesamte Herde frei umher. Die Zählung
      der wilden Borecka-Herde ergab 155 Tiere, davon 73 Bullen und 82 Kühe.


      Unter den Vögeln wurden 141 Arten erfasst, darunter Weissrückenspecht, Mittelspecht und Zwergschnäpper,
      neben Rohrdommeln und Kranichen. Zu den geschützten Brutvögeln zählen Seeadler, Schreiadler (rund 25
      Paare), Schwarzstorch (16 Paare) und Fischadler. Das Naturschutzgebiet Borki wurde eingerichtet, um
      Naturwälder und vier Leitarten zu schützen: Wisent, Halsbandschnäpper, Weissrückenspecht und die
      Lungenflechte (*Lobaria pulmonaria*).


      Von Mai bis Oktober ist die günstigste Besuchszeit.
    visit: >-
      Das Schaugehege Wolisko dient Bildungszwecken und der Eingewöhnung von Tieren in die Wildbahn. Es
      umfasst sieben Hektar eingezäunte Weidefläche mit Baumgruppen und Tränke. Das Forstamt empfiehlt,
      Besuchsregeln vorab einzusehen.


      Zwei Naturlehrpfade erschliessen das Waldgebiet. Der Lehrpfad Kruklanki mit 12 Themenstationen führt
      durch Dorf, Feldflur, Wald, Seeufer und Bahndämme und zeigt historische Bauten. Der Pfad Ogonki bei
      Pozezdrze besitzt zwei Teilstrecken—eine kurze von 1,95 km und eine längere von rund drei Kilometern—mit
      12 Schautafeln zur Waldökologie sowie ein Waldklassenzimmer für Gruppen.
    history: >-
      Bis ins siebte Jahrhundert v. Chr. dehnte sich hier die unberührte Puszcza Galindzka aus. Rodungen
      drängten die Laubwälder auf fruchtbaren Böden zurück, sodass im siebzehnten Jahrhundert die Grenzen der
      Puszcza Borecka bereits weitgehend festlagen.


      Das Reservat Mazury zwischen den Seen Szwałk Wielki, Piłwąg und Łaźno dient als Wasservogelrefugium;
      Borki bewahrt mehrschichtige Urwälder mit Fichten, Hainbuchen, Eichen, Eschen und Linden im Alter von
      100 bis 150 Jahren; und Lipowy Jar schützt urwüchsigen Hangwald am Ufer des Piłwąg-Sees.
    before: >-
      Beachte die Zugangsregeln des Wisentgeheges Wolisko vor der Anreise. Erkundige dich auf der Website des
      Forstamts Borki über offene Wege.
    around: >-
      Achtzehn Kilometer entfernt erstreckt sich der [Landschaftspark Rominter
      Heide](/lugar/park-krajobrazowy-puszczy-rominckiej/). Weiter entfernt teilt der [Nationalpark Białowieża
      - Strenges Reservat](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) Halsbandschnäpper,
      Weissrückenspecht und Wisent, ebenso wie das [Strenge Naturreservat
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) und die
      [Schnelle-Kreisch-Schlucht](/lugar/cheile-crisului-repede/).
  it:
    intro: >-
      I bisonti europei della Puszcza Borecka vivono allo stato brado, ma schivano la presenza dell'uomo. Per
      consentirne l'osservazione, presso Wolisko è stata allestita un'area faunistica recintata dove alcuni
      capi stazionano stabilmente. Questo paradosso illustra bene la vocazione del luogo: una vasta selva
      masuriana di 230 km², il maggiore massiccio boschivo del distretto lacustre di Ełk a est del lago Mamry,
      che si lascia svelare a piccoli passi.


      È un mosaico di tigli, querce e abeti rossi incastonato tra i Grandi Laghi Masuri, la cui mandria di
      bisonti bradi costituisce un contingente reintrodotto di enorme valore conservazionistico.
    landscape: >-
      La topografia è dolcemente ondulata, contraddistinta da morene glaciali che non formano le creste
      regolari tipiche di altri settori. Questa disomogeneità geomorfologica ha ostacolato i dissodamenti
      agricoli, preservando suoli fertili vocati alle foreste di querce e carpini. Il rilievo culminante è
      Lipowa Góra a 223 m. Nelle conche intermoreniche prive di emissari si sono sviluppate torbiere alte e di
      transizione. I laghi maggiori sono Szwałk Wielki, Piłwąg, Haszno (Łaźno) e Litygajno.


      Il manto forestale riveste quasi il 92 % del territorio. Le monocolture sono assenti: dominano farnia,
      carpino bianco, tiglio selvatico, frassino, peccio, ontano nero, acero riccio e betulla pubescente. Vi
      vegetano circa trecento specie di piante, 38 delle quali protette, e una novantina (90) di licheni,
      annoverando rarità come il tasso comune.
    wildlife: >-
      La compagine dei mammiferi riunisce alce, bisonte europeo, lince, lontra, castoro e lupo. La lince è
      rara per via dell'ampiezza dell'home range e della concorrenza territoriale con le mute di lupi, che
      predano talvolta i gattini.


      La vicenda del [bisonte europeo](/especie/bison_bonasus/) è recente. Fu introdotto nel 1956 e allevato
      in cattività; sei anni dopo l'intera mandria venne liberata. L'ultimo censimento del nucleo brado di
      Borecka ha contato 155 esemplari, 73 maschi e 82 femmine.


      Tra i volatili si contano 141 specie registrate, tra cui picchio dorsobianco, picchio rosso mezzano e
      pigliamosche pettirosso, oltre a tarabusi e gru. I nidificanti protetti includono coppie di aquila di
      mare, aquila anatraia minore (circa 25 coppie), cicogna nera (16 coppie) e falco pescatore. La riserva
      Borki fu istituita per salvaguardare popolamenti naturali e quattro entità guida: il bisonte europeo, la
      balia dal collare, il picchio dorsobianco e il lichene polmonaria (*Lobaria pulmonaria*).


      Da maggio a ottobre è il periodo di visita più favorevole.
    visit: >-
      Il recinto dei bisonti di Wolisko assolve compiti didattici e permette l'ambientamento dei capi
      destinati al rilascio. È un'area recintata di sette ettari con pascolo, querce ombrose e abbeveratoi.
      L'amministrazione forestale raccomanda di verificare gli orari prima della visita.


      Due percorsi naturalistici attraversano il bosco. Il sentiero di Kruklanki, con 12 stazioni tematiche,
      percorre un mosaico rurale e forestale: paese, margini coltivati, boscaglia, sponde lacustri e un
      terrapieno ferroviario storico, toccando manufatti militari. Quello di Ogonki a Pozezdrze prevede due
      anelli, uno breve di 1,95 km e uno di circa tre chilometri, con 12 bacheche che illustrano il
      funzionamento della foresta masuriana, oltre a un'aula didattica all'aperto.
    history: >-
      Sino al VII secolo a.C. questa regione faceva parte della sterminata e disabitata Puszcza Galindzka. Con
      i secoli i disboscamenti ridussero i boschi fertili di latifoglie, cosicché nel XVII secolo i limiti
      della Puszcza Borecka coincidevano quasi con quelli attuali.


      La riserva Mazury, serrata tra i laghi Szwałk Wielki, Piłwąg e Łaźno, tutela gli uccelli acquatici; la
      riserva Borki preserva selve stratificate con pecci, carpini, querce, frassini e tigli di 100 a 150
      anni; e Lipowy Jar custodisce un bosco denso e ripido lungo il lago Piłwąg.
    before: >-
      Prendi visione del regolamento del recinto dei bisonti di Wolisko prima della partenza. Consulta il sito
      del distretto forestale di Borki per conoscere la percorribilità dei sentieri.
    around: >-
      A diciotto chilometri si trova il [Parco Paesaggistico della Foresta di
      Romincka](/lugar/park-krajobrazowy-puszczy-rominckiej/). Più distante, il [Parco Nazionale di Białowieża
      - Riserva Integrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) condivide balia dal collare,
      picchio dorsobianco e bisonte europeo, al pari della [Riserva Naturale Integrale di
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) e della [Gola del Crișul
      Repede](/lugar/cheile-crisului-repede/).
  pt:
    intro: >-
      Os bisontes-europeus da Puszcza Borecka vivem em liberdade, mas evitam o contacto com as pessoas. Por
      isso, para que os visitantes os possam observar com segurança, concebeu-se um cercado junto a Wolisko
      onde alguns indivíduos residem de forma permanente. Esse paradoxo resume bem a identidade do lugar: um
      grande bosque masuriano de 230 km², o maior maciço florestal da região dos lagos de Ełk a leste do lago
      Mamry, que se deixa desvendar aos poucos.


      Constitui um mosaico de tílias, carvalhos e píceas emoldurado pela Região dos Grandes Lagos Masurianos,
      e a sua manada de bisontes em estado selvagem representa uma população reintroduzida de primeiro plano.
    landscape: >-
      O relevo é ondulado, coberto de colinas morénicas que não desenham as cristas regulares habituais
      noutras paragens. Este relevo desordenado travou a desmatação agrícola histórica, preservando sob a
      floresta grandes manchas de solos férteis próprios das matas de carvalho e carpe. A colina mais elevada
      é Lipowa Góra, com 223 m de altitude. Entre as colinas formaram-se depressões húmidas sem drenagem
      superficial, onde se fixam turfeiras altas e de transição. As maiores lagoas são Szwałk Wielki, Piłwąg,
      Haszno (Łaźno) e Litygajno.


      A floresta cobre quase 92 % do território. Não existem povoamentos monoespecíficos: dominam o
      carvalho-alvarinho, o carpe, a tília, o freixo, a pícea, o amieiro-negro, o bordo e a bétula-pubescente.
      Vicejam cerca de trezentas espécies vasculares, 38 das quais protegidas por lei, e cerca de 90 líquenes,
      incluindo espécies raras como o teixo.
    visit: >-
      O cercado de bisontes de Wolisko desempenha funções pedagógicas e facilita a aclimatação dos animais
      antes da sua integração na manada selvagem. É um espaço vedado de sete hectares combinando pastagens,
      arvoredo e bebedouro. Os serviços florestais solicitam a consulta prévia dos regulamentos.


      Existem dois trilhos interpretativos. O de Kruklanki, dotado de 12 paragens temáticas, atravessa um
      mosaico variado: povoado, orlas agrícolas, bosque, margens lacustres e aterros ferroviários desativados,
      desvendando estruturas militares históricas. O de Ogonki, em Pozezdrze, comporta duas etapas—uma volta
      curta de 1,95 km e outra de cerca de três quilómetros—com 12 painéis sobre o funcionamento da floresta
      masuriana e uma sala de aula ao ar livre.
    history: >-
      Até ao século VII a. C. estendia-se aqui a impenetrável e desabitada Puszcza Galindzka. Ao longo dos
      séculos a desmatação eliminou as matas nobres de solos ricos, de modo que no século XVII os limites da
      Puszcza Borecka coincidiam já sensivelmente com os atuais.


      A reserva Mazury, abraçada pelas lagoas Szwałk Wielki, Piłwąg e Łaźno, serve de refúgio à avifauna
      aquática; a reserva Borki preserva matas estratificadas de píceas, carpes, carvalhos, freixos e tílias
      com 100 a 150 anos de idade; e Lipowy Jar acolhe um bosque denso sobre encostas íngremes junto ao lago
      Piłwąg.
    before: >-
      Consulta o regulamento do cercado de bisontes de Wolisko antes de viajar. Confirma também no portal do
      distrito florestal de Borki o estado dos trilhos abertos.
    around: >-
      A dezoito quilómetros situa-se o [Parque Paisagístico da Floresta de
      Romincka](/lugar/park-krajobrazowy-puszczy-rominckiej/). Mais afastado, o [Parque Nacional de Białowieża
      - Reserva Integral](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) partilha o
      papa-moscas-de-colar, o pica-pau-de-dorso-branco e o bisonte-europeu, tal como a [Reserva Natural
      Estrita Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) e a [Garganta do Crișul
      Repede](/lugar/cheile-crisului-repede/).
    wildlife: >-
      Nos mamíferos ocorrem o alce, o bisonte-europeu, o lince, a lontra, o castor e o lobo. O lince é muito
      escasso devido à extensão dos seus territórios vitais e à concorrência das alcateias, que atacam
      sobretudo as crias.


      A história do [bisonte-europeu](/especie/bison_bonasus/) é aqui recente. Foi introduzido na floresta em
      1956 e criado inicialmente em cativeiro; seis anos decorridos, toda a manada vivia livre. O censo da
      população selvagem de Borecka registou 155 animais, sendo 73 machos e 82 fêmeas.


      Na avifauna contam-se 141 espécies assinaladas, incluindo o pica-pau-de-dorso-branco, o pica-pau-médio e
      o papa-moscas-pequeno, além de abetouros e grous. Nas aves com estatuto de proteção destacam-se casais
      de águia-rabalva, águia-pomerana (cerca de 25 casais), cegonha-preta (16 casais) e águia-pesqueira. A
      reserva de Borki foi estabelecida para conservar ecossistemas pristinos e quatro espécies-bandeira: o
      bisonte-europeu, o papa-moscas-de-colar, o pica-pau-de-dorso-branco e o líquen pulmonária (*Lobaria
      pulmonaria*).


      O intervalo de maio a outubro constitui a melhor época.
