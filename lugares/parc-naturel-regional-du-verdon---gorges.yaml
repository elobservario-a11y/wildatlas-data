resumen:
  es: >-
    El 'Gran Cañón de Europa', acantilados calizos de 700 m de caída libre labrados por las aguas turquesa del
    río Verdon.
  en: >-
    The 'Grand Canyon of Europe', sheer limestone cliffs plunging 700 m carved out by the turquoise waters of
    the Verdon River.
  fr: >-
    Le « Grand Canyon d'Europe », falaises calcaires de 700 m de verticalité sculptées par les eaux turquoise
    du Verdon.
  de: >-
    Der 'Grand Canyon Europas', 700 m senkrecht abfallende Kalkfelsen, die vom türkisgrünen Wasser des Verdon
    tief eingegraben wurden.
  it: >-
    Il 'Grand Canyon d'Europa', pareti calcaree di 700 m a picco modellate dalle acque turchesi del fiume
    Verdon.
  pt: >-
    O 'Grand Canyon da Europa', escarpas calcárias com 700 m de queda vertical talhadas pelas águas turquesa
    do rio Verdon.
unico:
  es: >-
    Un cañón de caliza que cae hasta 700 metros, un río que se esconde bajo tierra en el Imbut y buitres que
    volvieron a criar en sus paredes.
  en: >-
    A limestone canyon dropping up to 700 metres, a river vanishing subterraneanly at the Imbut, and vultures
    returned to nest along its sheer walls.
  fr: >-
    Un canyon de calcaire plongeant jusqu'à 700 mètres, une rivière qui disparaît sous terre à l'Imbut et des
    vautours réinstallés sur ses parois.
  de: >-
    Ein bis zu 700 Meter tief eingeschnittener Kalksteincanyon, ein Fluss, der beim Imbut unterirdisch
    verschwindet, und Geier, die wieder in den Wänden brüten.
  it: >-
    Un canyon calcareo profondo fino a 700 metri, un fiume che sparisce sottoterra all'Imbut e avvoltoi
    tornati a nidificare sulle sue vertiginose pareti.
  pt: >-
    Um desfiladeiro de calcário que despenca até 700 metros, um rio que desaparece debaixo da terra no Imbut e
    abutres que regressaram para nidificar nas suas escarpas.
observaciones:
  es: >-
    En las rutas del parque se pide permanecer en los senderos señalizados para no pisotear plantas e
    insectos. Respeta los cierres de las vías de escalada, que protegen la cría de los buitres.
texto:
  es:
    intro: >-
      En 1905, Édouard-Alfred Martel e Isidore Blanc recorrieron las gargantas del Verdon de punta a punta, y
      con ellos el Gran Cañón de Europa dejó de ser un mapa en blanco. Lo que encontraron es una grieta de
      entre 250 y 700 metros de profundidad y, en el lecho del río, de entre 6 y 100 metros de ancho. Hoy el
      Parque Natural Regional del Verdon se extiende por 188 000 hectáreas entre los departamentos de
      Alpes-de-Haute-Provence y Var y se organiza en torno a la cuenca del río que le da nombre, y que lo debe
      al color verde turquesa de sus aguas.
    landscape: >-
      La historia empieza en el fondo de un mar. En el Triásico la Provenza se hundió y el mar depositó
      gruesas capas de caliza; en el Jurásico, un mar cálido y poco profundo favoreció el crecimiento de
      corales. Mucho después, en el Terciario, se levantaron los Alpes, y fue entonces cuando el Verdon trazó
      su curso, y desde entonces ha ido cortando esa piedra. El Mont-Chiran forma parte de un macizo calizo de
      las Prealpes de Castellane.


      En el Imbut, el Verdon desaparece bajo tierra, bajo un enorme caos de bloques de roca. Y en el extremo
      opuesto del recorrido, a la salida de las gargantas, el agua tiene otra historia: al llenarse el embalse
      de Sainte-Croix en 1973 quedó anegada la llanura, con el pueblo de Les Salles-sur-Verdon, que se reubicó
      más arriba. Junto a ese lago, en la orilla derecha, las terrazas rocosas de toba del Verdon son reserva
      natural regional.


      El gran cañón es además un refugio: su clima ha permitido que se mantengan plantas endémicas de
      acantilado, aves rupícolas y murciélagos específicos. En las gargantas, la orilla izquierda es más
      fresca y está cubierta de frondosas, con hayas y robles, y el hayedo de Aiguines está protegido como
      reserva biológica dirigida. En conjunto, el 63 % del territorio del parque es bosque, el 32 % es tierra
      cultivada o de pasto y solo el 3 % está artificializado. La flora suma 2 200 especies, un tercio de los
      tipos de flora de Francia, y entre ellas hay un helecho, la Doradille du Verdon (Asplenium jahandiezii),
      que se descubrió en las gargantas en 1911.
    wildlife: >-
      Mira hacia las paredes. Las rapaces y aves rupícolas del parque incluyen el [águila
      real](/especie/aquila_chrysaetos/), la chova piquirroja, el [halcón
      peregrino](/especie/falco_peregrinus/), el cuervo grande, el
      [quebrantahuesos](/especie/gypaetus_barbatus/) y el [búho real](/especie/bubo_bubo/). Pero los
      protagonistas son los buitres. El [buitre leonado](/especie/gyps_fulvus/), reintroducido en 1999, cría
      en las paredes con una población de más de 200 parejas y lo sigue de cerca la LPO. Hay también buitres
      negros alrededor del río.


      En invierno, el parque recomienda el Grand Margès para ver buitres junto al lago de Sainte-Croix, y la
      LPO organiza recorridos para descubrir los buitres del Verdon.


      A ras de suelo, la fauna es más discreta. No es raro cruzarse con
      [rebecos](/especie/rupicapra_rupicapra/), solos o en rebaño, en cualquier recodo del camino por las
      gargantas. El parque tiene unas 50 especies de mamíferos, entre ellas 22 especies de murciélagos de las
      32 que hay en la Francia metropolitana. Entre los grandes se citan el
      [corzo](/especie/capreolus_capreolus/), el [jabalí](/especie/sus_scrofa/), el
      [lince](/especie/lynx_lynx/), el [lobo](/especie/canis_lupus/), el tejón y la
      [gineta](/especie/genetta_genetta/). Y en el agua, el apron del Ródano, en peligro crítico de extinción,
      indica la buena calidad de las aguas del Verdon.


      La primavera y el otoño son las mejores estaciones para el sendero Blanc-Martel. En primavera, la subida
      al monte Teillon permite caminar entre flores de montaña, y en una noche de verano el observatorio
      astronómico del Mont-Chiran se propone para contemplar las estrellas.
    visit: >-
      El camino por excelencia es el sendero Blanc-Martel: quince kilómetros entre el chalet de la Maline y
      Point Sublime, con unos 600 metros de desnivel positivo. La ruta hasta el Couloir Samson recorre 12 km.
      Para empezarlo desde el pueblo de La Palud-sur-Verdon hay una lanzadera del parque, y dejas el coche en
      un aparcamiento específico.


      Otras caminatas habituales de las gargantas son el sendero del Imbut, el del Bastidon y el mirador de
      Rancoumas por el puente de Tusset. El sendero Martel se trazó en 1928 por el Touring Club de France y
      recibió en 1930 el nombre del explorador.


      Para entender lo que ves: la Maison de site, en Rougon junto al mirador del Point Sublime, orienta la
      visita y anima a pasar de una orilla a otra. El dominio de Valx-Félines, propiedad del Conservatoire du
      littoral y gestionado por el parque, aloja la Maison du Parc, una granja de cabras pedagógica y un
      sendero de descubrimiento, abierto todo el año. Y por los senderos encontrarás a los ecoguardas del
      parque, de uniforme beige, que acogen e informan a los visitantes y dan consejos sobre riesgos e
      itinerarios.
    history: >-
      Aquí se vive en cuevas desde la Prehistoria: en las bajas gargantas, y el museo de la Prehistoria de
      Quinson reúne los resultados de las excavaciones de la región.


      El parque se creó por decreto el 3 de marzo de 1997. Las gargantas están clasificadas desde 1990 como
      monumento natural y sitio, lo que protege su núcleo a largo plazo, y la carta del parque se renovó el 28
      de abril de 2025 para el periodo 2025-2040 y abarca 54 municipios. La protección de las aves explica un
      detalle: algunas vías de escalada se cierran para proteger la nidificación de los buitres recién
      reintroducidos. Y la afluencia crece: restringe cada vez más las zonas de tranquilidad.
    before: >-
      En las rutas del parque se pide permanecer en los senderos señalizados para no pisotear plantas e
      insectos. Respeta los cierres de las vías de escalada, que protegen la cría de los buitres.
    around: >-
      Lejos de aquí hay lugares con los que comparte rapaces y paredes de roca. El [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) tiene quebrantahuesos y alimoche, como el Verdon, y hábitats de
      cañón y karst. El [Parque Natural Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/)
      comparte alimoche, búho real y buitre leonado. Y las [Gorges du Tarn](/lugar/gorges-du-tarn/) comparten
      chova piquirroja, buitre negro y buitre leonado.
  en:
    intro: >-
      In 1905, Édouard-Alfred Martel and Isidore Blanc traversed the Verdon gorge from end to end,
      transforming Europe's Grand Canyon from a blank spot on the map into a celebrated wonder. What they
      unveiled is a chasm between 250 and 700 metres deep, narrowing at the riverbed to between 6 and 100
      metres wide. Today, the Verdon Regional Natural Park covers 188,000 hectares across the departments of
      Alpes-de-Haute-Provence and Var, organized around the watershed of the river that lends its name,
      inspired by the vivid turquoise hue of its waters.
    landscape: >-
      The narrative begins beneath an ancient sea. During the Triassic, Provence subsided and the sea laid
      down thick calcareous sediments; in the Jurassic, warm, shallow waters fostered extensive coral growth.
      Much later in the Tertiary, the Alpine orogeny buckled the terrain, prompting the ancestral Verdon to
      cut into the limestone as the mountains rose. Mont Chiran belongs to this pre-Alpine limestone massif
      around Castellane.


      At the Imbut, the Verdon plunges subterraneanly beneath a colossal chaos of fallen boulders. At the
      downstream exit of the gorge, the hydrology tells another story: the filling of the Sainte-Croix
      reservoir in 1973 submerged the agricultural plain and the old village of Les Salles-sur-Verdon,
      reconstructed on higher ground. On the right bank bordering the lake, the Verdon tufa terraces form a
      designated regional nature reserve.


      The great gorge also provides a sheltered microclimatic haven: sheltering endemic cliff flora,
      cliff-dwelling birds, and specialized bats. The left bank is cooler and clad in deciduous woodland of
      beech and oak, with the Aiguines beech forest managed as a directed biological reserve. Overall, 63 % of
      the park area is forest, 32 % is agricultural or pasture land, and only 3 % is built up. The flora
      numbers 2,200 species, representing one third of all plant species in France, including the Verdon
      spleenwort (Asplenium jahandiezii), a rare chasmophytic fern discovered in the gorge in 1911.
    wildlife: >-
      Cast your eyes toward the cliffs. The park's rock-dwelling birds include the [golden
      eagle](/especie/aquila_chrysaetos/), red-billed chough, [peregrine falcon](/especie/falco_peregrinus/),
      common raven, [bearded vulture](/especie/gypaetus_barbatus/), and [Eurasian
      eagle-owl](/especie/bubo_bubo/). Yet the undisputed masters of the air are the vultures. The [griffon
      vulture](/especie/gyps_fulvus/), reintroduced in 1999, now nests across the gorge walls with over 200
      breeding pairs closely monitored by the LPO. Cinereous vultures also frequent the gorge corridors.


      In winter, the park recommends the Grand Margès summit to spot vultures overlooking Lake Sainte-Croix,
      while the LPO leads interpretive outings to observe the Verdon's scavengers.


      Ashore, terrestrial wildlife remains discreet. You may encounter
      [chamois](/especie/rupicapra_rupicapra/), singly or in small groups, along the bends of the canyon
      paths. The park harbours some 50 mammal species, including 22 bat species out of the 32 recorded in
      metropolitan France. Larger mammals include [roe deer](/especie/capreolus_capreolus/), [wild
      boar](/especie/sus_scrofa/), [Eurasian lynx](/especie/lynx_lynx/), [wolf](/especie/canis_lupus/),
      badger, and the [common genet](/especie/genetta_genetta/). In the river, the critically endangered Rhône
      streber bears witness to the pristine water quality of the Verdon.


      Spring and autumn offer the finest conditions for the Blanc-Martel trail. In spring, ascending Mount
      Teillon lets you walk amid mountain wild blooms, while on clear summer nights the astronomical
      observatory on Mont Chiran invites stargazing.
    visit: >-
      The definitive footpath through the gorge is the Blanc-Martel trail: fifteen kilometres between the
      Chalet de la Maline and Point Sublime, involving some 600 metres of cumulative ascent. The hike down to
      the Couloir Samson spans 12 km. To walk it from the village of La Palud-sur-Verdon, a park shuttle
      operates to the trailhead while cars are parked in designated bays.


      Other classic gorge hikes include the Sentier de l'Imbut, the Sentier du Bastidon, and the Rancoumas
      lookout via the Tusset bridge. The Martel trail was laid out in 1928 by the Touring Club de France and
      named in 1930 in honour of the speleologist.


      To interpret the landscapes: the Maison de site in Rougon by Point Sublime guides visitors across both
      rims. The Valx-Félines estate, owned by the Conservatoire du littoral and managed by the park, houses
      the Maison du Parc, an educational goat farm, and an interpretive nature trail open year-round. Along
      the paths, park eco-guards in beige uniforms provide guidance on conservation rules and route safety.
    history: >-
      Caves in the lower gorges have sheltered human populations since prehistoric times, with findings
      exhibited at the Museum of Prehistory in Quinson.


      The regional natural park was officially founded by decree on 3 March 1997. The gorge itself has been
      protected as a classified natural site since 1990, securing long-term core preservation, and the park
      charter was renewed on 28 April 2025 for the 2025-2040 term, embracing 54 member communes. Avian
      protection carries direct consequences: certain climbing sectors are closed seasonally to safeguard
      nesting ledges of reintroduced vultures amid growing recreational pressures.
    before: >-
      Hikers must remain on marked paths to prevent trampling fragile cliff vegetation and endemic
      invertebrates. Always heed seasonal climbing cliff closures designed to safeguard nesting vultures.
    around: >-
      Farther away, other karst landscapes share raptors and limestone walls: [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) shares bearded and Egyptian vultures in deep limestone gorges,
      [Parque Natural Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) hosts Egyptian
      vultures, eagle-owls, and griffons, while the [Gorges du Tarn](/lugar/gorges-du-tarn/) share choughs,
      cinereous vultures, and griffon vultures.
  fr:
    intro: >-
      En 1905, Édouard-Alfred Martel et Isidore Blanc parcoururent les gorges du Verdon d'un bout à l'autre,
      transformant le Grand Canyon d'Europe en un paysage exploré. Ils révélèrent une entaille profonde de 250
      à 700 mètres et, au fond du lit, large de 6 à 100 mètres seulement. Aujourd'hui, le parc naturel
      régional du Verdon s'étend sur 188 000 hectares entre Alpes-de-Haute-Provence et Var, structuré autour
      du bassin versant de la rivière dont il tire son nom en hommage à la teinte vert turquoise de ses flots.
    landscape: >-
      La genèse remonte au fond des mers. Au Trias, la Provence s'affaissa et la mer déposa d'épaisses strates
      calcaires ; au Jurassique, des eaux chaudes et peu profondes favorisèrent la croissance de récifs
      coralliens. Bien plus tard, au Tertiaire, le soulèvement alpin contraignit le Verdon à creuser son lit
      dans la roche calcaire au fur et à mesure de l'orogenèse. Le mont Chiran s'inscrit dans ce massif
      calcaire des Préalpes de Castellane.


      À l'Imbut, le Verdon s'engouffre sous terre sous un colossal chaos de blocs effondrés. À l'autre
      extrémité, à l'ouverture des gorges, l'eau offre une autre mémoire : la mise en eau du barrage de
      Sainte-Croix en 1973 noya la plaine agricole et le village des Salles-sur-Verdon, reconstruit plus haut.
      Sur la rive droite bordant le lac, les terrasses de tuf du Verdon forment une réserve naturelle
      régionale.


      Ce canyon majestueux constitue un sanctuaire écologique : son microclimat abrite des plantes rupicoles
      endémiques, des oiseaux de falaise et des chauves-souris spécialisées. La rive gauche, plus fraîche, est
      boisée de chênes et de hêtres, la hêtraie d'Aiguines bénéficiant du statut de réserve biologique
      dirigée. Au total, 63 % du territoire est boisé, 32 % est constitué de terres agricoles et de pâturages
      et seuls 3 % sont urbanisés. La flore rassemble 2 200 espèces, soit un tiers de la flore française, dont
      la doradille du Verdon (Asplenium jahandiezii), une fougère rupestre découverte dans les gorges en 1911.
    wildlife: >-
      Levez les yeux vers les à-pics rocheux. Les falaises hébergent l'[aigle
      royal](/especie/aquila_chrysaetos/), le crave à bec rouge, le [faucon
      pèlerin](/especie/falco_peregrinus/), le grand corbeau, le [gypaète barbu](/especie/gypaetus_barbatus/)
      et le [hibou grand-duc](/especie/bubo_bubo/). Mais les souverains du ciel restent les vautours. Le
      [vautour fauve](/especie/gyps_fulvus/), réintroduit en 1999, niche dans les parois avec plus de 200
      couples sous le suivi attentif de la LPO. Le vautour moine patrouille également au-dessus du canyon.


      En hiver, le parc conseille le Grand Margès pour observer les vautours au-dessus du lac de Sainte-Croix,
      et la LPO organise des visites naturalistes.


      Au sol, la faune reste farouche. Il n'est pas rare de croiser des
      [chamois](/especie/rupicapra_rupicapra/) isolés ou en hardes sur les vires du canyon. Le parc compte
      quelque 50 espèces de mammifères, dont 22 espèces de chiroptères sur les 32 de France métropolitaine.
      Parmi les grands mammifères se signalent [chevreuil](/especie/capreolus_capreolus/),
      [sanglier](/especie/sus_scrofa/), [lynx boréal](/especie/lynx_lynx/), [loup
      gris](/especie/canis_lupus/), blaireau et [genette commune](/especie/genetta_genetta/). Dans la rivière,
      l'apron du Rhône, en danger critique d'extinction, atteste la haute pureté des eaux.


      Le printemps et l'automne restent les saisons idéales pour parcourir le sentier Blanc-Martel. Au
      printemps, l'ascension du mont Teillon permet d'admirer la flore d'altitude, tandis qu'en été
      l'observatoire du mont Chiran convie aux veillées astronomiques.
    visit: >-
      L'itinéraire légendaire est le sentier Blanc-Martel : quinze kilomètres reliant le chalet de la Maline
      au Point Sublime, cumulant quelque 600 mètres de dénivelé positif. L'aller-retour vers le Couloir Samson
      totalise 12 km. Depuis le village de La Palud-sur-Verdon, une navette du parc dessert le départ des
      randonnées.


      D'autres parcours célèbres sillonnent les gorges : le sentier de l'Imbut, le sentier du Bastidon et le
      belvédère de Rancoumas par le pont de Tusset. Le sentier Martel fut aménagé en 1928 par le Touring Club
      de France et baptisé en 1930 en hommage à l'explorateur.


      Pour contextualiser votre visite : la Maison de site à Rougon renseigne les randonneurs. Le domaine de
      Valx-Félines, géré par le parc pour le Conservatoire du littoral, réunit la Maison du Parc, une
      chèvrerie pédagogique et un sentier d'interprétation ouvert toute l'année. Sur les chemins, des
      écogardes en uniforme beige accueillent et conseillent les visiteurs.
    history: >-
      L'homme a occupé les grottes des basses gorges depuis la Préhistoire, dont les découvertes enrichissent
      le musée de Préhistoire de Quinson.


      Le parc naturel régional fut instauré par décret le 3 mars 1997. Les gorges sont classées au titre des
      sites et monuments naturels depuis 1990, et la charte du parc a été renouvelée le 28 avril 2025 pour la
      période 2025-2040, fédérant 54 communes. La protection des oiseaux impose des fermetures temporaires de
      voies d'escalade lors de la nidification des vautours.
    before: >-
      Restez impérativement sur les sentiers balisés pour ne pas piétiner la flore rupicole fragile. Respectez
      les interdictions temporaires sur les falaises d'escalade protégeant la couvaison des vautours.
    around: >-
      Plus loin, d'autres parois calcaires partagent une avifaune comparable : le [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) abrite gypaète et percnoptère en milieu karstique, le [Parque
      Natural Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) compte percnoptères et
      vautours fauves, et les [Gorges du Tarn](/lugar/gorges-du-tarn/) partagent crave à bec rouge, vautour
      moine et vautour fauve.
  de:
    intro: >-
      Im Jahr 1905 erkundeten Édouard-Alfred Martel und Isidore Blanc die Verdonschlucht der Länge nach und
      machten den Grand Canyon Europas zu einer erforschten Realität. Sie stießen auf eine Felsspalte von 250
      bis 700 Metern Tiefe, die sich am Flussbett auf Breiten zwischen 6 und 100 Metern verengt. Heute umfasst
      der Regionale Naturpark Verdon 188 000 Hektar in den Departements Alpes-de-Haute-Provence und Var,
      geordnet entlang des Einzugsgebiets jenes Flusses, der nach der blaugrünen Farbe seines Wassers benannt
      ist.
    landscape: >-
      Die Entstehung begann auf dem Meeresgrund. In der Trias senkte sich die Provence ab und das Meer lagerte
      gewaltige Kalkschichten ab; im Jura begünstigte ein flaches Warmwassermeer Korallenriffe. Wesentlich
      später, im Tertiär, hoben sich die Alpen empor, und der Verdon grub sich während der Gebirgsbildung
      unaufhaltsam in das Kalkgestein ein. Der Mont Chiran bildet Teil dieses Kalkmassivs der Voralpen von
      Castellane.


      Beim Imbut verschwindet der Verdon unter einem gigantischen Blockchaos im Untergrund. Am Talausgang am
      See von Sainte-Croix zeigt das Wasser eine andere Dimension: Durch den Einstau des Sees im Jahr 1973
      wurde die Ebene samt dem Dorf Les Salles-sur-Verdon überflutet, das weiter oben neu errichtet wurde. Am
      rechten Seeufer stehen die Tuffsteinterrassen als regionales Naturreservat unter Schutz.


      Die Schlucht dient als mikroklimatischer Zufluchtsort für Felsspaltenpflanzen, Felsbrüter und
      spezialisierte Fledermäuse. Das linke Ufer ist kühler und von Laubwäldern mit Buchen und Eichen bedeckt;
      der Buchenwald von Aiguines ist ein biologisches Schutzgebiet. Insgesamt sind 63 % der Parkfläche
      bewaldet, 32 % dienen der Landwirtschaft oder Beweidung und nur 3 % sind versiegelt. Die Flora zählt 2
      200 Arten — ein Drittel der gesamten Pflanzenwelt Frankreichs —, darunter der Verdon-Streifenfarn
      (Asplenium jahandiezii), der 1911 in der Schlucht entdeckt wurde.
    wildlife: >-
      Richte den Blick an die Felswände: Zu den Felsbrütern gehören [Steinadler](/especie/aquila_chrysaetos/),
      Alpendohle, [Wanderfalke](/especie/falco_peregrinus/), Kolkrabe,
      [Bartgeier](/especie/gypaetus_barbatus/) und [Uhu](/especie/bubo_bubo/). Die Hauptrolle spielen jedoch
      die Geier. Der 1999 wiederangesiedelte [Gänsegeier](/especie/gyps_fulvus/) brütet mit über 200 Paaren in
      den Felswänden, eng überwacht von der Vogelschutzorganisation LPO. Auch Mönchsgeier ziehen entlang des
      Canyons ihre Bahnen.


      Im Winter empfiehlt der Naturpark den Gipfel des Grand Margès zur Geierbeobachtung über dem See von
      Sainte-Croix; die LPO bietet geführte Exkursionen an.


      Am Boden bleibt die Tierwelt scheu: Mit etwas Glück begegnet man [Gämsen](/especie/rupicapra_rupicapra/)
      auf den Felsbändern der Schlucht. Der Park beherbergt rund 50 Säugetierarten, darunter 22
      Fledermausarten der insgesamt 32 in Frankreich vorkommenden Spezies. Zu den größeren Säugern zählen
      [Reh](/especie/capreolus_capreolus/), [Wildschwein](/especie/sus_scrofa/), [Eurasischer
      Luchs](/especie/lynx_lynx/), [Wolf](/especie/canis_lupus/), Dachs und
      [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/). Im Fluss belegt der vom Aussterben bedrohte
      Rhone-Streber die hervorragende Wasserqualität.


      Frühling und Herbst bieten die beste Zeit für den Blanc-Martel-Pfad. Im Frühjahr lockt der Mont Teillon
      mit Bergblumen, während die Sternwarte auf dem Mont Chiran zu sommerlichen Himmelsbeobachtungen einlädt.
    visit: >-
      Die klassische Wanderung ist der Blanc-Martel-Weg: fünfzehn Kilometer zwischen dem Chalet de la Maline
      und dem Point Sublime mit etwa 600 Höhenmetern Aufstieg. Die Route bis zum Couloir Samson misst 12 km.
      Von La Palud-sur-Verdon aus pendelt ein Shuttlebus zum Startpunkt, sodass Fahrzeuge auf Parkplätzen
      verbleiben können.


      Weitere Wanderklassiker sind der Imbut-Weg, der Bastidon-Pfad und der Aussichtspunkt Rancoumas über die
      Tusset-Brücke. Der Martel-Pfad wurde 1928 vom Touring Club de France angelegt und erhielt 1930 den Namen
      des Höhlenforschers.


      Zur Orientierung: Das Maison de site in Rougon informiert über Touren. Das Anwesen Valx-Félines
      beherbergt das Maison du Parc, einen Lehrbauernhof und einen ganzjährig zugänglichen Naturlehrpfad. Auf
      den Wegen begegnet man den Rangern in beigen Uniformen, die Besucher über Routen und Schutzregeln
      informieren.
    history: >-
      Die Höhlen der unteren Schluchten sind seit der Urgeschichte bewohnt; Funde sind im Museum für Vorzeit
      in Quinson ausgestellt.


      Der Regionalpark entstand per Dekret am 3. März 1997. Die Schlucht steht seit 1990 als Naturdenkmal
      unter Schutz, und die Parkcharta wurde am 28. April 2025 für den Zeitraum 2025-2040 erneuert und umfasst
      54 Kommunen. Zum Schutz der Geierbruten werden einzelne Klettersektoren temporär gesperrt.
    before: >-
      Bleibe auf den markierten Wanderwegen, um Felsvegetation und Insekten nicht zu zertreten. Beachte
      Kletterverbote an Felswänden zum Schutz nistender Geier.
    around: >-
      In weiterer Ferne teilen andere Schluchten Landschaften und Greifvögel: Der [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) birgt Bartgeier und Schmutzgeier, der [Parque Natural Hoces del
      Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) Schmutzgeier und Uhu, und die [Gorges du
      Tarn](/lugar/gorges-du-tarn/) teilen Alpendohle, Mönchsgeier und Gänsegeier.
  it:
    intro: >-
      Nel 1905 Édouard-Alfred Martel e Isidore Blanc percorsero per intero le gole del Verdon, trasformando il
      Grand Canyon d'Europa in una meraviglia cartografata. Rivelarono una fenditura profonda tra 250 e 700
      metri, che sul fondovalle si restringe a larghezze comprese tra 6 e 100 metri. Oggi il Parco Naturale
      Regionale del Verdon tutela 188 000 ettari divisi tra i dipartimenti delle Alpi dell'Alta Provenza e del
      Var, imperniato sul bacino idrografico del fiume che deve il nome allo smeraldo turchese delle sue
      acque.
    landscape: >-
      La storia muove dal fondo di un mare arcaico. Nel Triassico la Provenza sprofondò e il mare accumulò
      spessi strati calcarei; nel Giurassico mari caldi e poco profondi favorirono la proliferazione
      corallina. Molto più tardi, nel Terziario, il sollevamento delle Alpi costrinse il corso ancestrale del
      Verdon a incidere la roccia durante la crescita del rilievo. Il Mont Chiran fa parte di questo massiccio
      calcareo delle Prealpi di Castellane.


      All'Imbut il Verdon scompare inghiottito nel sottosuolo sotto un immenso caos di massi crollati.
      All'uscita delle gole l'invaso di Sainte-Croix, riempito nel 1973, sommerse la pianura alluvionale e il
      vecchio borgo di Les Salles-sur-Verdon, ricostruito più in alto. Sulla sponda destra del lago i terrazzi
      di tufo del Verdon sono riserva naturale regionale.


      Il grande canyon funge inoltre da santuario rupicolo: il suo clima ha conservato piante endemiche di
      falesia, avifauna rocciosa e pipistrelli specializzati. La riva sinistra, più fresca e umida, ospita
      faggete e querceti; la faggeta di Aiguines è tutelata come riserva biologica guidata. Nel complesso il
      63 % della superficie è coperto da boschi, il 32 % è coltivato o a pascolo e appena il 3 % è
      urbanizzato. La flora vanta 2 200 specie, un terzo della flora nazionale francese, compresa l'Asplenium
      jahandiezii, felce rupestre scoperta nelle gole nel 1911.
    wildlife: >-
      Guarda verso le pareti strapiombanti. I dirupi ospitano l'[aquila reale](/especie/aquila_chrysaetos/),
      il gracchio corallino, il [falco pellegrino](/especie/falco_peregrinus/), il corvo imperiale, il
      [gipeto](/especie/gypaetus_barbatus/) e il [gufo reale](/especie/bubo_bubo/). I veri protagonisti
      restano però gli avvoltoi. Il [grifone](/especie/gyps_fulvus/), reintrodotto nel 1999, nidifica sulle
      pareti con una colonia di oltre 200 coppie seguita dalla LPO. Anche l'avvoltoio monaco perlustra la
      forra.


      In inverno l'ente parco suggerisce la cima del Grand Margès per osservare i volteggi degli avvoltoi
      sopra il lago di Sainte-Croix, mentre la LPO promuove uscite guidate.


      A terra la fauna selvatica si fa più guardinga. È frequente incrociare [camosci
      alpini](/especie/rupicapra_rupicapra/) sui cenge rocciose delle gole. Il parco conta circa 50 specie di
      mammiferi, tra cui 22 specie di chirotteri sulle 32 presenti nella Francia continentale. Tra i grandi
      mammiferi si registrano [capriolo](/especie/capreolus_capreolus/), [cinghiale](/especie/sus_scrofa/),
      [lince europea](/especie/lynx_lynx/), [lupo grigio](/especie/canis_lupus/), tasso e [genetta
      comune](/especie/genetta_genetta/). Nel fiume l'asprete del Rodano, a grave rischio di estinzione, prova
      l'eccellente purezza delle acque.


      Primavera e autunno rappresentano le stagioni migliori per il sentiero Blanc-Martel. In primavera la
      salita al monte Teillon permette di camminare tra fioriture alpine, mentre nelle notti estive
      l'osservatorio del Mont Chiran accoglie le osservazioni astronomiche.
    visit: >-
      L'escursione regina è il sentiero Blanc-Martel: quindici chilometri tra lo Chalet de la Maline e il
      Point Sublime con circa 600 metri di dislivello positivo. L'itinerario fino al Couloir Samson misura 12
      km. Da La Palud-sur-Verdon è attiva una navetta del parco per lasciare l'auto nei parcheggi attrezzati.


      Altri tracciati celebri sono il sentiero dell'Imbut, il sentiero del Bastidon e il belvedere di
      Rancoumas dal ponte di Tusset. Il sentiero Martel fu tracciato nel 1928 dal Touring Club de France e
      intitolato nel 1930 all'esploratore.


      Per comprendere il territorio: la Maison de site a Rougon introduce alla visita. La tenuta di
      Valx-Félines ospita la Maison du Parc, una fattoria didattica e un sentiero natura aperto tutto l'anno.
      Lungo i percorsi gli ecoguardi in divisa beige accolgono i visitatori e consigliano itinerari sicuri.
    history: >-
      Le grotte delle basse gole furono abitate sin dalla Preistoria, con reperti conservati al museo della
      Preistoria di Quinson.


      Il parco naturale regionale è stato istituito per decreto il 3 marzo 1997. Le gole sono classificate
      monumento e sito naturale dal 1990, e lo statuto del parco è stato rinnovato il 28 aprile 2025 per il
      periodo 2025-2040, raggruppando 54 comuni. La tutela dell'avifauna impone la chiusura stagionale di
      alcune vie d'arrampicata per non disturbare la nidificazione degli avvoltoi.
    before: >-
      Resta rigorosamente sui sentieri tracciati per preservare la flora rupicola e gli insetti. Rispetta le
      chiusure temporanee delle pareti d'arrampicata a tutela della cova degli avvoltoi.
    around: >-
      In altre regioni si trovano ambienti affini per pareti e rapaci: il [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) ospita gipeto e capovaccaio in un contesto carsico, il [Parque
      Natural Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) accoglie capovaccaio e
      grifone, mentre le [Gorges du Tarn](/lugar/gorges-du-tarn/) condividono gracchio corallino, avvoltoio
      monaco e grifone.
  pt:
    intro: >-
      Em 1905, Édouard-Alfred Martel e Isidore Blanc percorreram as gargantas do Verdon de ponta a ponta,
      transformando o Grand Canyon da Europa num território desbravado. Revelaram uma fenda com 250 a 700
      metros de profundidade e, no leito da corrente, entre 6 e 100 metros de largura. Hoje, o Parque Natural
      Regional do Verdon abrange 188 000 hectares divididos entre os departamentos de Alpes-de-Haute-Provence
      e Var, organizado em redor da bacia hidrográfica do rio que lhe dá nome, devido ao tom verde-turquesa
      das suas águas.
    landscape: >-
      A génese remonta ao fundo de um mar ancestral. No Triásico a Provença abateu e o oceano depositou densos
      estratos calcários; no Jurássico águas tépidas e pouco profundas propiciaram recifes de coral. Muito
      mais tarde, no Terciário, a orogenia alpina elevou o relevo, obrigando o Verdon primitivo a entalhar a
      rocha calcária à medida que as serras subiam. O Mont Chiran faz parte deste maciço calcário dos
      Pré-Alpes de Castellane.


      No Imbut, o Verdon precipita-se no subsolo sob um caos colossal de blocos abatidos. Na saída das
      gargantas, o lago de Sainte-Croix, enchido em 1973, submergiu a planície agrícola e a antiga aldeia de
      Les Salles-sur-Verdon, transferida para cotas superiores. Na margem direita contígua ao lago, as
      plataformas de tufo calcário do Verdon formam uma reserva natural regional.


      O grande canhão é também um refúgio ecológico: o seu microclima protege plantas rupícolas endémicas,
      aves de escarpa e morcegos especializados. A margem esquerda, mais fresca, veste-se de carvalhais e
      faiais, estando o faial de Aiguines sob estatuto de reserva biológica dirigida. No conjunto, 63 % da
      área do parque é floresta, 32 % é terra agrícola ou de pastoreio e apenas 3 % se encontra urbanizada. A
      flora reúne 2 200 espécies, um terço da flora de França, onde figura o feto Asplenium jahandiezii,
      descoberto nas gargantas em 1911.
    wildlife: >-
      Ergue o olhar para os paredões vertiginosos. As arribas sustentam a
      [águia-real](/especie/aquila_chrysaetos/), a gralha-de-bico-vermelho, o
      [falcão-peregrino](/especie/falco_peregrinus/), o corvo-comum, o
      [quebra-ossos](/especie/gypaetus_barbatus/) e o [bufo-real](/especie/bubo_bubo/). Mas os donos do céu
      são os abutres. O [grifo](/especie/gyps_fulvus/), reintroduzido em 1999, nidifica nas escarpas com mais
      de 200 casais monitorizados pela LPO. O abutre-preto também sobrevoa o desfiladeiro.


      No inverno, a administração do parque recomenda o cume do Grand Margès para observar abutres sobre o
      lago de Sainte-Croix, organizando a LPO roteiros interpretativos.


      No solo, a fauna mantém-se esquiva. Não é raro avistar [camurças](/especie/rupicapra_rupicapra/) nas
      saliências rochosas das gargantas. O parque acolhe cerca de 50 espécies de mamíferos, compreendendo 22
      espécies de morcegos das 32 registadas na França metropolitana. Entre os maiores contam-se o
      [corço](/especie/capreolus_capreolus/), o [javali](/especie/sus_scrofa/), o
      [lince-euroasiático](/especie/lynx_lynx/), o [lobo](/especie/canis_lupus/), o texugo e a
      [gineta](/especie/genetta_genetta/). No rio, o peixe Zingel asper, em perigo crítico, reflete a pureza
      das águas.


      A primavera e o outono proporcionam a melhor época para o trilho Blanc-Martel. Na primavera a subida ao
      monte Teillon oferece prados em flor, enquanto nas noites de verão o observatório astronómico do Mont
      Chiran convida a contemplar o firmamento.
    visit: >-
      O itinerário emblemático é o trilho Blanc-Martel: quinze quilómetros entre o Chalet de la Maline e o
      Point Sublime com cerca de 600 metros de desnível positivo acumulado. O percurso até ao Couloir Samson
      totaliza 12 km. A partir da povoação de La Palud-sur-Verdon funciona um vaivém do parque, permitindo
      estacionar a viatura nos parques previstos.


      Outros trilhos célebres incluem o caminho do Imbut, o trilho do Bastidon e o miradouro de Rancoumas pela
      ponte de Tusset. O trilho Martel foi inaugurado em 1928 pelo Touring Club de France e batizado em 1930
      em honra do espeleólogo.


      Para contextualizar a visita: a Maison de site em Rougon acolhe os caminhantes. O domínio de
      Valx-Félines abriga a Maison du Parc, um aprisco caprino pedagógico e um trilho de interpretação aberto
      todo o ano. Nos percursos encontrarás vigilantes da natureza em fardamento bege, prestando conselhos de
      segurança.
    history: >-
      As cavernas das gargantas baixas foram habitadas desde a Pré-História, guardando o museu de Pré-História
      de Quinson os achados das escavações.


      O parque regional foi constituído por decreto a 3 de março de 1997. As gargantas estão classificadas
      como sítio natural desde 1990, e a carta de compromisso do parque foi renovada a 28 de abril de 2025
      para o período 2025-2040, abrangendo 54 municípios. A conservação das aves obriga ao encerramento
      temporário de vias de escalada durante a postura e criação dos abutres.
    before: >-
      Permanece rigorosamente nos trilhos marcados para não pisar plantas rupícolas sensíveis e insetos.
      Respeita os encerramentos temporários das falésias de escalada para salvaguardar a nidificação dos
      abutres.
    around: >-
      Mais longe situam-se outros desfiladeiros que partilham avifauna e escarpas rochosas: o [Parc Natural
      dels Ports](/lugar/parc-natural-dels-ports/) acolhe quebra-ossos e abutre-do-egito em contexto cársico,
      o [Parque Natural Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) alberga grifos e
      bufos-reais, e as [Gorges du Tarn](/lugar/gorges-du-tarn/) partilham gralhas-de-bico-vermelho,
      abutres-pretos e grifos.
