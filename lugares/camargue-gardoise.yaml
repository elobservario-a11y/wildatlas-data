texto:
  es:
    intro: >-
      Los brazos del Ródano se fueron, pero los estanques se quedaron. La Camarga del Gard, o Petite Camargue,
      es la región costera del departamento de Gard entre el Petit-Rhône y el Vidourle, al oeste del delta
      actual, en una zona que ocuparon en otro tiempo brazos del río que ya no existen. Lo que queda es un
      mundo de tierra muy baja, carrizales, prados húmedos, caballos y garzas, con la reserva natural regional
      del Scamandre como puerta de entrada.
    landscape: >-
      La Camarga del Gard se asienta en terrenos muy bajos, a menudo bajo el nivel del mar. El gran humedal de
      los estanques fue el lecho mayor del Ródano hasta que lo encauzaron en 1858, y hoy sirve de zona tampón
      para las crecidas de otoño que golpean con regularidad el sureste de Francia.


      En la reserva del Scamandre se reúnen la mayoría de los biotopos camarguenses: la pradera, la sansouïre
      (el prado salado) y la marisma. Otros hábitats son lagunas, dunas arboladas, saladares y prados húmedos.
      Los prados húmedos mediterráneos son el refugio de plantas silvestres poco extendidas en Francia, y se
      favorecen con inundaciones temporales; los más bellos se ven en la valle bajo del Vistre y al pie de las
      Costières, los «prés du Cailar» y las «launes de Gallician».


      Parte de este paisaje es obra de la gente. Un segador corta las cañas entre diciembre y marzo, solo con
      balsa, para no dañar el carrizal, y con ellas se hacen los techos tradicionales de caña, la sagne. El
      dominio de Mahistre es un resto de los grandes marais de la Souteyranne, desecados hacia 1970 para la
      agricultura, y el de la Musette fue un pólder de cereal restaurado como marisma abierta.
    wildlife: >-
      **Todo el año.** En la reserva del Scamandre anidan nueve especies europeas de garzas, y más de la mitad
      de los ibis falcinelos de Francia anidan allí, en la mayor colonia mixta que ha tenido el país, de 9.000
      parejas en 2015. Allí se ve también el [galápago europeo](/especie/emys_orbicularis/), que se encuentra
      buscando sobre los troncos caídos en las roubines, las zanjas, y el topillo anfibio, vulnerable en la
      lista roja mundial, probablemente el mamífero más valioso de la reserva. Los
      [caballos](/especie/equus_caballus/) y los toros de Camarga pastan de forma extensiva todo el año y
      ayudan a gestionar las praderas, pero no se garantiza verlos.


      **Finales de primavera.** Las crías de [tarro blanco](/especie/tadorna_tadorna/) se agrupan en guardería
      antes de ir a mudar al mar de Wadden. **Verano.** Los archibebes finos y otros limícolas se alimentan en
      los fangos que deja la bajada del agua durante su escala migratoria de 4000 km. **Invierno.** Mientras
      sopla el mistral, los [calamones comunes](/especie/porphyrio_porphyrio/) ya parlotean ante las cercetas
      comunes.


      Los dominios de Mahistre y la Musette tienen sus propias protagonistas. En Mahistre se han registrado
      200 especies de aves, y la [garza imperial](/especie/ardea_purpurea/) y la [garceta
      grande](/especie/egretta_alba/) se han instalado hace poco en los grandes carrizales. Allí dos rebaños
      de caballos mantienen abiertos los hábitats entre abril y noviembre. En la Musette se alimentan y anidan
      el [pato colorado](/especie/netta_rufina/), el somormujo lavanco y garzas arborícolas, hay un nido de
      milano negro en las copas del bosque de ribera y, abajo, la rara y protegida campanilla de verano.
    visit: >-
      El lugar de entrada es el Centro de Descubrimiento del Scamandre, creado para organizar la acogida del
      público en la reserva natural regional. Ofrece varios recorridos en bucle, el más largo de 4 km,
      conectados para adaptar el paseo al tiempo disponible. El más especial es un recorrido sobre pilotes de
      1 km, del programa europeo Life Butor, que lleva al corazón de las marismas y a tres puntos de
      observación y escucha.


      La reserva abre de martes a sábado, salvo festivos.


      La Marette, Maison du Grand Site de France, está dedicada a descubrir los paisajes, las tradiciones, la
      fauna y la flora de la Camarga del Gard. Ofrece un sendero de 1,6 km cuyo acceso cambia según la
      estación, una museografía y exposiciones itinerantes, y organiza visitas guiadas y actividades
      escolares.
    history: >-
      El sindicato mixto de la Camarga del Gard gestiona más de 1600 ha de espacios naturales protegidos con
      distintos estatutos. Los espacios naturales sensibles departamentales son la mayor parte, con 1010 ha, y
      se adquieren con una tasa sobre la construcción para compensar sus daños ambientales. Las 240 ha de la
      reserva del Scamandre, antes en parte cultivadas, se compraron para protegerlos y darlos a conocer, y su
      plan de gestión se validó oficialmente en septiembre de 2010.


      La red Natura 2000 comprende tres zonas que abarcan 35.000 ha y ocho municipios, con tres sitios:
      «Petite Camargue», «Camargue gardoise fluvio-lacustre» y «Petite Camargue laguno-marine». Los prados
      húmedos están amenazados por el cultivo, el exceso de diques, el drenaje y el saneamiento.
    before: >-
      En la reserva del Scamandre los senderos se abren desde las nueve de la mañana y la visita debe terminar
      antes del cierre, a las seis de la tarde. No se admiten perros, ni siquiera con correa.
    around: >-
      Lejos de aquí, la [Laguna de Venecia](/lugar/laguna-di-venezia/) y el [Parque Natural de la Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) comparten con la Camarga del Gard la garceta común y el
      flamenco común, y como ella son humedales costeros. La [Reserva Natural Slikken van de
      Heen](/lugar/slikken-van-de-heen/) comparte, además, los caballos y el paisaje de humedal y costa.
  en:
    intro: >-
      The river branches migrated, but the coastal wetlands remained. The Gard Camargue, or Petite Camargue,
      covers the coastal fringe of the Gard department between the Petit-Rhône and the Vidourle, west of the
      modern delta in an area once shaped by ancient river mouths. What endures today is a low-lying realm of
      reedbeds, waterlogged meadows, horses, and herons, with the Scamandre Regional Nature Reserve serving as
      the prime gateway.
    landscape: >-
      The Gard Camargue lies in very low-lying terrain, frequently dipping below sea level. This expansive
      wetland of lagoons and pools formed the ancient flood basin of the Rhône until channelisation works in
      1858, and today functions as a vital buffer absorbing the autumn flash floods that regularly strike
      southeastern France.


      The Scamandre Reserve gathers most classic Camargue habitats: open grassland, sansouïre (saline samphire
      plains), and freshwater marsh. Surrounding zones feature brackish lagoons, wooded coastal dunes, salt
      steppes, and humid meadows. Mediterranean wet meadows shelter rare wild flora and depend upon seasonal
      flooding; the finest examples extend across the lower Vistre valley and beneath the Costières, known
      locally as the «prés du Cailar» and «launes de Gallician».


      Human stewardship has sculpted much of this wetland. Reed-cutters harvest the tall Phragmites between
      December and March solely from flat-bottomed boats to protect fragile rhizomes, supplying the thatch for
      traditional local roofing (sagne). The Mahistre estate preserves a remaining pocket of the great
      Souteyranne marshes, drained around 1970 for agriculture, while La Musette represents a former grain
      polder successfully re-flooded as open marsh.
    wildlife: >-
      **Year-round.** Nine European heron species breed within the Scamandre Reserve, and over half of
      France’s glossy ibises nest here, forming the nation’s largest mixed heronry with some 9,000 pairs
      recorded in 2015. Visitors can also spot the [*Emys orbicularis*](/especie/emys_orbicularis/) (European
      pond turtle) basking on submerged logs in the roubines (drainage ditches), alongside the European water
      vole, vulnerable on the global red list and arguably the reserve’s most precious mammal. Semi-feral
      [horses](/especie/equus_caballus/) and Camargue bulls graze extensively year-round to maintain open
      meadows, though encounters are never guaranteed.


      **Late spring.** Juvenile [common shelducks](/especie/tadorna_tadorna/) gather in creches before flying
      north to moult in the Wadden Sea. **Summer.** Marsh sandpipers and diverse waders forage across exposed
      mudflats during their 4000 km migratory stopover. **Winter.** As the mistral wind scours the marshes,
      [western swamphens](/especie/porphyrio_porphyrio/) already call amidst wintering Eurasian teals.


      The Mahistre and La Musette reserves boast their own specialities. Mahistre has recorded over 200 bird
      species, with both [purple heron](/especie/ardea_purpurea/) and [*Egretta alba*](/especie/egretta_alba/)
      (great egret) recently colonising the reed expanses, kept open by two horse herds between April and
      November. In La Musette, [red-crested pochards](/especie/netta_rufina/), great crested grebes, and
      tree-nesting herons breed, while black kites nest in the riparian canopy above rare, protected summer
      snowflakes.
    visit: >-
      The primary entry point is the Scamandre Discovery Centre, established to welcome visitors to the
      regional nature reserve. Several interconnecting loop trails are available, the longest stretching 4 km,
      allowing you to tailor your walk to your schedule. The highlight is a 1 km boardwalk trail on stilts
      funded by the European Life Butor programme, guiding you into the heart of the reedbeds to three
      observation hides and listening posts.


      The reserve is open from Tuesday to Saturday, excluding public holidays.


      La Marette, Maison du Grand Site de France, is dedicated to showcasing the landscape, heritage,
      wildlife, and flora of the Gard Camargue. It offers a 1.6 km nature trail with seasonal variations,
      museum exhibits, temporary displays, guided walks, and educational workshops.
    history: >-
      The Syndicat Mixte of the Gard Camargue manages more than 1600 ha of protected natural territory under
      various designations. Departmental Sensitive Natural Areas comprise the bulk with 1010 ha, acquired via
      a local development levy designed to mitigate environmental impacts. The 240 ha Scamandre reserve,
      previously partly cultivated, was bought for habitat conservation and public awareness, its formal
      management plan ratified in September 2010.


      The Natura 2000 network encompasses three designated sectors spanning 35,000 ha across eight
      municipalities: «Petite Camargue», «Camargue gardoise fluvio-lacustre», and «Petite Camargue
      laguno-marine». Delicate wet meadows remain threatened by agricultural conversion, embankment
      construction, and land drainage.
    before: >-
      At the Scamandre Reserve the trails open from nine in the morning and visits must conclude before
      closing at six in the evening. Dogs are strictly prohibited, even on a leash.
    around: >-
      Far away, the [Venice Lagoon](/lugar/laguna-di-venezia/) and [Ria Formosa Natural
      Park](/lugar/parque-natural-da-ria-formosa/) share the little egret and greater flamingo with the Gard
      Camargue as coastal wetlands. [Slikken van de Heen Nature Reserve](/lugar/slikken-van-de-heen/) also
      shares grazing horses in a mosaic of wetland and coastline.
  fr:
    intro: >-
      Les bras du Rhône se sont déplacés, mais les étangs sont restés. La Camargue gardoise, ou Petite
      Camargue, s’étend sur la frange littorale du Gard entre le Petit-Rhône et le Vidourle, à l’ouest du
      delta actuel, sur des terres jadis baignées par des embouchures aujourd’hui disparues. Ce qui subsiste
      est un monde de basses terres, de roselières, de prés humides, de chevaux et de hérons, avec la réserve
      naturelle régionale du Scamandre comme porte d’entrée privilégiée.
    landscape: >-
      La Camargue gardoise repose sur des terrains très bas, souvent situés sous le niveau marin. Ce vaste
      marais d’étangs constituait le lit majeur du fleuve jusqu’à son endiguement en 1858, et joue aujourd’hui
      le rôle de zone tampon face aux crues d’automne qui frappent périodiquement le sud-est de la France.


      La réserve du Scamandre rassemble l’essentiel des biotopes camarguais : la pelouse, la sansouïre (pré
      salé) et le marais. Les milieux voisins comprennent des lagunes, des dunes boisées, des steppes salées
      et des prairies humides. Les prés humides méditerranéens abritent des espèces végétales rares favorisées
      par des submersions temporaires ; les plus remarquables s’étendent dans la basse vallée du Vistre et au
      pied des Costières, réputés comme les « prés du Cailar » et les « launes de Gallician ».


      Ce paysage porte aussi la marque des hommes. Le sagneur coupe les roseaux entre décembre et mars,
      uniquement en bateau à fond plat pour ne pas abîmer la roselière, fournissant la matière première des
      toits de chaume traditionnels (la sagne). Le domaine de Mahistre conserve un fragment des grands marais
      de la Souteyranne asséchés vers 1970 pour l’agriculture, tandis que celui de la Musette est un ancien
      polder céréalier reconquis en marais ouvert.
    wildlife: >-
      **Toute l’année.** Neuf espèces européennes de hérons nichent au Scamandre, et plus de la moitié des
      ibis falcinelles de France s’y reproduisent, formant la plus vaste héronnière mixte du pays avec quelque
      9 000 couples recensés en 2015. On y croise aussi la [*Emys orbicularis*](/especie/emys_orbicularis/)
      (cistude d’Europe) se réchauffant sur les troncs morts dans les roubines (fossés de drainage), ainsi que
      le campagnol amphibie, espèce vulnérable sur la liste rouge mondiale. Les
      [chevaux](/especie/equus_caballus/) et les taureaux de Camargue pâturent en plein air toute l’année pour
      entretenir les prairies, sans garantie d’observation immédiate.


      **Fin de printemps.** Les poussins de [tadorne de Belon](/especie/tadorna_tadorna/) se regroupent en
      crèches avant de rejoindre la mer des Wadden pour leur mue. **Été.** Bécassines, chevaliers stagnatiles
      et limicoles fouillent les vasières asséchées lors de leur escale migratoire de 4000 km. **Hiver.** Sous
      le souffle du mistral, les [talèves sultanes](/especie/porphyrio_porphyrio/) s’activent déjà au milieu
      des sarcelles d’hiver.


      Les domaines de Mahistre et de la Musette accueillent leurs propres richesses. À Mahistre, 200 espèces
      d’oiseaux ont été recensées, le [héron pourpré](/especie/ardea_purpurea/) et la [*Egretta
      alba*](/especie/egretta_alba/) (grande aigrette) ayant récemment colonisé les roselières, où deux hardes
      de chevaux entretiennent les milieux d’avril à novembre. À la Musette nichent la [nette
      rousse](/especie/netta_rufina/), le grèbe huppé et des hérons arboricoles, sous un nid de milan noir
      dominant la rare nivéole d’été.
    visit: >-
      Le point d’accès privilégié est le Centre de découverte du Scamandre, aménagé pour accueillir le public
      au cœur de la réserve naturelle régionale. Il propose plusieurs boucles interconnectées, la plus longue
      atteignant 4 km pour s’adapter au temps dont vous disposez. Le sentier sur pilotis d’un kilomètre (1
      km), financé par le programme européen Life Butor, pénètre au cœur des marais vers trois observatoires
      et postes d’écoute.


      La réserve ouvre du mardi au samedi, hors jours fériés.


      La Marette, Maison du Grand Site de France, est dédiée aux paysages, aux traditions et à la biodiversité
      de la Camargue gardoise. Elle propose un sentier de 1,6 km aux ambiances changeantes selon les saisons,
      un espace muséographique, des expositions temporaires et des visites guidées.
    history: >-
      Le Syndicat Mixte de la Camargue Gardoise veille sur plus de 1600 ha d’espaces naturels protégés aux
      statuts variés. Les Espaces Naturels Sensibles départementaux constituent l’essentiel avec 1010 ha,
      acquis grâce à la taxe d’aménagement pour compenser l’urbanisation. Les 240 ha de la réserve du
      Scamandre, jadis partiellement cultivés, ont été acquis pour leur préservation et l’accueil du public,
      avec un plan de gestion validé en septembre 2010.


      Le réseau Natura 2000 couvre trois secteurs totalisant 35 000 ha sur huit communes : « Petite Camargue
      », « Camargue gardoise fluvio-lacustre » et « Petite Camargue laguno-marine ». Les prairies humides
      demeurent vulnérables aux mises en culture et aux drainages.
    before: >-
      Dans la réserve du Scamandre, les sentiers ouvrent à partir de neuf heures du matin et la visite doit
      s’achever avant la fermeture des portes à dix-huit heures. Les chiens sont formellement interdits, même
      tenus en laisse.
    around: >-
      Plus loin, la [Lagune de Venise](/lugar/laguna-di-venezia/) et le [Parc naturel de la Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) partagent avec la Camargue gardoise l’aigrette garzette
      et le flamant rose au sein de zones humides littorales. La [Réserve naturelle Slikken van de
      Heen](/lugar/slikken-van-de-heen/) partage en outre la présence de chevaux en milieu côtier.
  de:
    intro: >-
      Die Flussarme der Rhône zogen weiter, doch die Lagunen blieben zurück. Die Gard-Camargue, auch Petite
      Camargue genannt, umfasst den Küstenstreifen des Départements Gard zwischen Petit-Rhône und Vidourle
      westlich des heutigen Hauptdeltas in einer Region einstiger Mündungsarme. Was heute überdauert, ist eine
      tiefliegende Welt aus Röhrichten, Feuchtwiesen, Pferden und Reihern, erschlossen über das regionale
      Naturschutzgebiet Scamandre.
    landscape: >-
      Die Gard-Camargue liegt auf sehr tiefem Gelände, oft knapp unter dem Meeresspiegel. Das weitläufige
      Feuchtgebiet bildete das Überschwemmungsbett der Rhône bis zur Eindeichung im Jahr 1858 und dient heute
      als Pufferraum für herbstliche Starkhochwasser in Südfrankreich.


      Im Schutzgebiet Scamandre vereinen sich die typischen Lebensräume der Camargue: Wiesensteppen, Sansouïre
      (Salzböden) und Süßwassermarschen. Rundum schließen sich Lagunen, bewaldete Küstendünen, Salzsteppen und
      Feuchtwiesen an. Die mediterranen Feuchtwiesen bieten seltenen Wildpflanzen Zuflucht und werden durch
      periodische Überflutungen erhalten; die schönsten erstrecken sich im Vistre-Tal und am Fuß der Costières
      als «prés du Cailar» und «launes de Gallician».


      Diese Landschaft verdankt viel menschlicher Pflege. Die Schilfbauern schneiden das Reet zwischen
      Dezember und März ausschließlich von Flachbooten aus, um die Wurzelballen zu schonen, und liefern das
      Reet für traditionelle Schilfdächer (sagne). Das Landgut Mahistre bewahrt Reste der großen
      Souteyranne-Sümpfe, die um 1970 trockengelegt wurden, während La Musette ein früherer Getreidepolder
      ist, der wieder als offenes Röhricht geflutet wurde.
    wildlife: >-
      **Ganzjährig.** Im Reservat Scamandre brüten neun europäische Reiherarten, und über die Hälfte aller
      Braunsichler Frankreichs nistet hier in der größten Mischkolonie des Landes mit rund 9.000 Paaren im
      Jahr 2015. Regelmäßig sonnt sich die [*Emys orbicularis*](/especie/emys_orbicularis/) (Europäische
      Sumpfschildkröte) auf Totholz in den Entwässerungsgräben (roubines), begleitet von der Ostschermaus.
      Halbwilde Camargue-[Pferde](/especie/equus_caballus/) und Stiere weiden ganzjährig extensiv und halten
      das Grasland offen, lassen sich aber nicht auf Abruf blicken.


      **Spätfrühling.** Junge [Brandgänse](/especie/tadorna_tadorna/) schließen sich in Kindergärten zusammen,
      ehe sie zur Mauser ins Wattenmeer aufbrechen. **Sommer.** Teichwasserläufer und andere Watvögel rasten
      auf trockenfallenden Schlickflächen während ihres 4000 km langen Zugs. **Winter.** Bei eisigem
      Mistralwind rufen die [Purpurhühner](/especie/porphyrio_porphyrio/) bereits vor überwinternden
      Krickenten.


      Die Schutzgüter Mahistre und La Musette bergen eigene Arten. In Mahistre wurden 200 Vogelarten erfasst,
      wobei [Purpurreiher](/especie/ardea_purpurea/) und [*Egretta alba*](/especie/egretta_alba/)
      (Silberreiher) die Röhrichte besiedelt haben, die zwei Pferdeherden von April bis November offenhalten.
      In La Musette brüten [Kolbenente](/especie/netta_rufina/), Haubentaucher und baumbrütende Reiher,
      überragt von Schwarzmilanhorsten und der seltenen Sommer-Knotenblume.
    visit: >-
      Eingangstor ist das Besucherzentrum Scamandre, geschaffen zur Lenkung der Naturbegeisterten im
      Regionalreservat. Es bietet mehrere Rundwege, der längste 4 km lang, die sich je nach Zeitbudget
      kombinieren lassen. Höhepunkt ist der 1 km lange Holzbohlenweg des europäischen Förderprogramms Life
      Butor, der mitten ins Röhricht zu drei Beobachtungshütten führt.


      Das Schutzgebiet öffnet von Dienstag bis Samstag (außer an Feiertagen).


      La Marette, Maison du Grand Site de France, widmet sich Landschaft, Traditionen und Tierwelt der
      Gard-Camargue. Ein 1,6 km langer Naturpfad wechselt je nach Jahreszeit seine Reize, ergänzt durch
      Ausstellungen und geführte Exkursionen.
    history: >-
      Der Zweckverband Syndicat Mixte de la Camargue Gardoise verwaltet über 1600 ha Naturschutzflächen
      verschiedener Kategorien. Den Schwerpunkt bilden départementsweite Schutzflächen mit 1010 ha, finanziert
      über Ausgleichsabgaben für Bauvorhaben. Die 240 ha des Scamandre-Gebiets wurden angekauft, um bedrohte
      Feuchtgebiete dauerhaft zu sichern; der Managementplan wurde im September 2010 behördlich verabschiedet.


      Das Natura 2000-Netz umfasst drei Teilgebiete mit 35.000 ha in acht Gemeinden: «Petite Camargue»,
      «Camargue gardoise fluvio-lacustre» und «Petite Camargue laguno-marine». Feuchtwiesen bleiben durch
      intensive Ackernutzung, Deichbau und Entwässerung gefährdet.
    before: >-
      Im Reservat Scamandre sind die Rundwege ab neun Uhr morgens zugänglich; der Besuch muss vor Torschluss
      um achtzehn Uhr beendet sein. Hunde sind auf dem gesamten Gelände verboten, auch an der Leine.
    around: >-
      In größerer Entfernung teilen die [Lagune von Venedig](/lugar/laguna-di-venezia/) und der [Naturpark Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) Seidenreiher und Rosaflamingo mit der Gard-Camargue als
      Küstenfeuchtgebiete. Das [Naturreservat Slikken van de Heen](/lugar/slikken-van-de-heen/) teilt darüber
      hinaus weidende Pferde an der Küste.
  it:
    intro: >-
      I rami del Rodano hanno cambiato corso, ma gli stagni sono rimasti. La Camargue del Gard, o Petite
      Camargue, è la fascia litoranea del dipartimento del Gard compresa tra il Petit-Rhône e il Vidourle, a
      ovest dell’attuale delta, in un’area modellata da antiche foci fluviali. Quel che resta è un bassopiano
      di canneti, prati umidi, cavalli e aironi, con la Riserva Naturale Regionale dello Scamandre a fare da
      porta d’accesso.
    landscape: >-
      La Camargue del Gard sorge su terreni bassissimi, sovente depressi sotto il livello marino. Questa vasta
      zona umida costituiva l’antico alveo di piena del Rodano prima dell’arginatura completata nel 1858, e
      funge tuttora da bacino di laminazione contro le violente piene autunnali che investono il Mezzogiorno
      francese.


      Nella riserva dello Scamandre coesistono i principali biotopi camarguesi: il pascolo arido, la sansouïre
      (prateria salmastra) e la palude dolce. Negli immediati dintorni si estendono lagune, dune boscate,
      steppe salate e prati allagati. I prati umidi mediterranei offrono asilo a una flora selvatica rara in
      Francia grazie alle sommersioni stagionali; i più suggestivi si ammirano nella bassa valle del Vistre e
      ai piedi delle Costières, noti come i «prés du Cailar» e le «launes de Gallician».


      Questo paesaggio vive dell’opera dell’uomo. Il tagliatore di canne raccoglie i fusti tra dicembre e
      marzo esclusivamente su barchini a fondo piatto per preservare i rizomi, impiegandoli per i tradizionali
      tetti di cannuccia (sagne). La tenuta di Mahistre conserva un lembo delle paludi della Souteyranne,
      prosciugate intorno al 1970 per far posto alle colture, mentre La Musette è un antico polder cerealicolo
      ripristinato a palude aperta.
    wildlife: >-
      **Tutto l’anno.** Nella riserva dello Scamandre nidificano nove specie europee di aironi e oltre la metà
      dei mignattai di Francia, formando la più estesa colonia mista dell’intero paese con circa 9.000 coppie
      censite nel 2015. Vi si avvista facilmente la [*Emys orbicularis*](/especie/emys_orbicularis/)
      (testuggine palustre europea) intenta a scaldarsi sui tronchi affioranti nelle roubines (canali di
      scolo), oltre all’arvicola acquatica europea. [Cavalli](/especie/equus_caballus/) e tori di Camargue
      pascolano allo stato brado tutto l’anno mantenendo sgombri i prati, pur senza garanzia di avvistamento
      immediato.


      **Fine primavera.** I giovani di [volpoca](/especie/tadorna_tadorna/) si radunano in asili nido
      collettivi prima di migrare per la muta nel Mare dei Wadden. **Estate.** Piro-piro stagnatili e altri
      limicoli setacciano i fanghi emersi durante la loro sosta migratoria di 4000 km. **Inverno.** Mentre
      infuria il maestrale, i [polli sultani comuni](/especie/porphyrio_porphyrio/) lanciano già i loro
      richiami tra le alzavole svernanti.


      Le tenute di Mahistre e La Musette vantano ulteriori rarità. A Mahistre sono state registrate 200 specie
      di uccelli, con l’[airone rosso](/especie/ardea_purpurea/) e l’[*Egretta alba*](/especie/egretta_alba/)
      (airone bianco maggiore) insediatisi nei canneti pascolati da due mandrie di cavalli tra aprile e
      novembre. A La Musette nidificano il [fistione turco](/especie/netta_rufina/), lo svasso maggiore e
      aironi arboricoli, sovrastati da nidi di nibbio bruno e dalla rara campanella estiva.
    visit: >-
      Il punto d’ingresso canonico è il Centro Visite dello Scamandre, ideato per accogliere i viaggiatori
      nella riserva regionale. Propone diversi sentieri ad anello, il più lungo di 4 km, combinabili a seconda
      del tempo a disposizione. L’itinerario più suggestivo è una passerella su palafitte di 1 km, finanziata
      dal progetto Life Butor, che penetra nel canneto conducendo a tre capanni d’avvistamento e ascolto.


      La riserva è accessibile dal martedì al sabato, festivi esclusi.


      La Marette, Maison du Grand Site de France, è dedicata all’interpretazione di paesaggi, tradizioni e
      fauna della Camargue gardoise. Dispone di un sentiero di 1,6 km con allestimenti museografici, mostre ed
      escursioni guidate.
    history: >-
      Il Syndicat Mixte della Camargue Gardoise tutela oltre 1600 ha di ambienti naturali protetti a vario
      titolo. Gli Spazi Naturali Sensibili dipartimentali coprono la quota principale con 1010 ha, acquisiti
      tramite oneri di compensazione edilizia. I 240 ha dello Scamandre, in passato in parte coltivati,
      vennero acquistati per preservare l’ecosistema palustre e aprirlo al pubblico, con un piano di gestione
      formalizzato nel settembre 2010.


      La rete Natura 2000 tutela tre siti per complessivi 35.000 ha distribuiti su otto comuni: «Petite
      Camargue», «Camargue gardoise fluvio-lacustre» e «Petite Camargue laguno-marine». I prati umidi restano
      minacciati da bonifiche, arginature e drenaggi intensivi.
    before: >-
      Nella riserva dello Scamandre i percorsi aprono alle nove del mattino e l’uscita deve avvenire entro
      l’orario di chiusura fissato alle diciotto. I cani sono severamente vietati, anche al guinzaglio.
    around: >-
      Più lontano, la [Laguna di Venezia](/lugar/laguna-di-venezia/) e il [Parco Naturale di Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) accolgono come la Camargue del Gard garzette e
      fenicotteri rosa in ambienti litoranei umidi. La [Riserva Naturale Slikken van de
      Heen](/lugar/slikken-van-de-heen/) condivide inoltre i cavalli allo stato brado su pascoli costieri.
  pt:
    intro: >-
      Os braços do Ródano mudaram de curso, mas as lagoas ficaram. A Camarga do Gard, ou Petite Camargue,
      estende-se pela orla costeira do departamento de Gard entre o Petit-Rhône e o Vidourle, a oeste do delta
      moderno, numa planície outrora esculpida por antigas embocaduras fluviais. O que subsiste é um
      território rebaixado de caniçais, prados húmidos, cavalos e garças, com a Reserva Natural Regional de
      Scamandre como principal porta de entrada.
    landscape: >-
      A Camarga do Gard assenta em terrenos muito baixos, por vezes abaixo do nível do mar. Esta vasta zona
      húmida constituía o antigo leito de cheia do Ródano até ser canalizado em 1858, servindo hoje de bacia
      de retenção contra as cheias outonais que assolam ciclicamente o sudeste francês.


      Na reserva de Scamandre congregam-se os principais biótopos da Camarga: a pastagem, a sansouïre (estepe
      salgada) e o paul doce. Ao redor distribuem-se lagoas, dunas arborizadas, estepes salinas e prados
      alagados. As pastagens húmidas mediterrânicas abrigam flora rara em França beneficiada por inundações
      sazonais; as mais ricas estendem-se no baixo vale do Vistre e nas faldas das Costières, célebres como os
      «prés du Cailar» e as «launes de Gallician».


      Esta paisagem deve muito à atividade tradicional. O ceifeiro de junco corta as canas entre dezembro e
      março exclusivamente a partir de barcos de fundo plano para não danificar o caniçal, fornecendo o
      material para as coberturas de colmo tradicionais (sagne). A herdade de Mahistre conserva um vestígio
      dos grandes pauis da Souteyranne drenados por volta de 1970 para cultivo, enquanto La Musette
      corresponde a um antigo pôlder de cereais recuperado como paul aberto.
    wildlife: >-
      **Todo o ano.** Na reserva de Scamandre nidificam nove espécies europeias de garças e mais de metade dos
      íbis-pretos de França, totalizando a maior colónia mista do país com cerca de 9.000 casais
      contabilizados em 2015. É habitual observar o [*Emys orbicularis*](/especie/emys_orbicularis/)
      (cágado-de-carapaça-estriada) a aquecer-se sobre troncos nas valas de drenagem (roubines), a par do
      rato-cego-d’água. [Cavalos](/especie/equus_caballus/) e toiros da Camarga pastam em liberdade todo o ano
      ajudando a travar o avanço do mato, embora os avistamentos não sejam garantidos.


      **Fim da primavera.** Os juvenis de [pato-branco](/especie/tadorna_tadorna/) agrupam-se em creches antes
      de migrarem para a muda da plumagem no Mar de Wadden. **Verão.** Perna-verde-fino e outros limícolas
      alimentam-se nos lodaçais durante a sua escala migratória de 4000 km. **Inverno.** Sob o vento mistral,
      os [caimões-comuns](/especie/porphyrio_porphyrio/) vocalizam ruidosamente junto aos bandos invernantes
      de marrequinhas-comuns.


      As propriedades de Mahistre e La Musette guardam atrativos próprios. Em Mahistre foram identificadas 200
      espécies de aves, com a [garça-vermelha](/especie/ardea_purpurea/) e a [*Egretta
      alba*](/especie/egretta_alba/) (garça-branca-grande) a nidificar nos caniçais mantidos abertos por duas
      manadas de cavalos entre abril e novembro. Em La Musette criam o
      [pato-de-bico-vermelho](/especie/netta_rufina/), o mergulhão-de-crista e garças arborícolas, sob ninhos
      de milhafre-preto e tufos da rara campainha-de-verão.
    visit: >-
      O ponto de acolhimento de referência é o Centro de Descoberta de Scamandre, concebido para receber o
      público na reserva natural regional. Disponibiliza vários percursos circulares, o mais longo com 4 km,
      interligáveis consoante o tempo disponível. O trilho mais emblemático decorre sobre passadiços
      sobrelevados com 1 km, construído pelo programa europeu Life Butor, que penetra no coração do paul até
      três postos de observação e escuta.


      A reserva abre de terça a sábado, exceto feriados.


      La Marette, Maison du Grand Site de France, dedica-se à interpretação da paisagem, tradições e
      património natural da Camarga do Gard. Conta com um trilho interpretativo de 1,6 km, núcleo museológico
      e visitas guiadas temáticas.
    history: >-
      O Syndicat Mixte da Camargue Gardoise administra mais de 1600 ha de áreas protegidas sob diferentes
      estatutos. Os Espaços Naturais Sensíveis departamentais constituem a maior parcela com 1010 ha,
      adquiridos através de taxas de compensação urbanística. Os 240 ha da reserva de Scamandre, outrora
      parcialmente cultivados, foram adquiridos para garantir a conservação das zonas húmidas, com plano de
      gestão homologado em setembro de 2010.


      A rede Natura 2000 abrange três áreas totalizando 35.000 ha em oito municípios: «Petite Camargue»,
      «Camargue gardoise fluvio-lacustre» e «Petite Camargue laguno-marine». As pastagens húmidas continuam
      vulneráveis à intensificação agrícola e à drenagem.
    before: >-
      Na reserva de Scamandre os trilhos abrem a partir das nove da manhã e a visita deve terminar antes do
      encerramento às dezoito horas. Não são permitidos cães, mesmo presos por trela.
    around: >-
      Mais distante, a [Laguna de Veneza](/lugar/laguna-di-venezia/) e o [Parque Natural da Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) acolhem garças-pequenas e flamingos em sapais litorais.
      A [Reserva Natural Slikken van de Heen](/lugar/slikken-van-de-heen/) partilha também cavalos em
      pastoreio semi-selvagem em zonas húmidas costeiras.
