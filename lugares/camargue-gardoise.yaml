resumen:
  es: >-
    La vertiente occidental del delta del Ródano, caracterizada por carrizales, lucios y manadas de caballos
    blancos de Camarga.
  en: >-
    The western flank of the Rhône delta, characterized by vast reedbeds, freshwater pools, and free-roaming
    herds of white Camargue horses.
  fr: >-
    La rive occidentale du delta du Rhône, façonnée par d’immenses roselières, des marais doux et des hardes
    de chevaux Camargue blancs.
  de: >-
    Die westliche Flanke des Rhônedeltas, geprägt von Schilfmeeren, Süßwassersümpfen und frei weidenden Herden
    weißer Camargue-Pferde.
  it: >-
    Il versante occidentale del delta del Rodano, contraddistinto da canneti infiniti, specchi d’acqua dolce e
    mandrie di cavalli Camargue bianchi.
  pt: >-
    A margem ocidental do delta do Ródano, dominada por extensos caniçais, pauis de água doce e manadas de
    cavalos brancos da Camarga.
unico:
  es: >-
    La Camarga que el Ródano dejó atrás, con la mayor colonia mixta de garzas e ibis de Francia en una reserva
    de apenas 240 ha.
  en: >-
    The wild Camargue that the Rhône left behind, hosting France’s largest mixed heron and ibis colony within
    a reserve of just 240 ha.
  fr: >-
    La Camargue délaissée par le Rhône, abritant la plus grande héronnière mixte de France dans une réserve de
    seulement 240 ha.
  de: >-
    Die vom Rhône-Hauptstrom verlassene Camargue mit Frankreichs größter Reiher- und Ibis-Mischkolonie auf nur
    240 ha Schutzfläche.
  it: >-
    La Camargue abbandonata dalle piene del Rodano, custode della più grande garzaia mista di Francia in
    appena 240 ha di riserva.
  pt: >-
    A Camarga deixada para trás pelo Ródano, albergando a maior colónia mista de garças e íbis de França numa
    reserva de apenas 240 ha.
