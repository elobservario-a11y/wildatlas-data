resumen:
  es: >-
    La montaña caliza que se alza sobre la bahía de Kotor, con hayedos, karst y vistas al Adriático y al
    interior dinárico.
  en: >-
    The limestone mountain that rises dramatically above the Bay of Kotor, with beech groves, karst terrain
    and sweeping views across the Adriatic and Dinaric interior.
  fr: >-
    La montagne calcaire qui domine la baie de Kotor, entre hêtraies, karst et panoramas sur l'Adriatique et
    l'intérieur dinarique.
  de: >-
    Das markante Kalkgebirge über der Bucht von Kotor, mit Buchenwäldern, Karstformen und Panoramablicken auf
    Adria und dinarisches Binnenland.
  it: >-
    La montagna calcarea che svetta maestosa sulle Bocche di Cattaro, tra faggete, rilievi carsici e scorci
    panoramici sull'Adriatico e l'interno dinarico.
  pt: >-
    A montanha calcária que se ergue sobre a baía de Kotor, entre faiais, relevo cársico e vistas sobre o
    Adriático e o interior dinárico.
unico:
  es: >-
    Una sola montaña recibe a la vez la influencia del mar y la del interior, y guarda en su cima la tumba de
    Njegoš.
  en: >-
    A single mountain massif simultaneously bathed in marine and continental influences, crowned by the high
    summit mausoleum of Njegoš.
  fr: >-
    Une seule montagne subit à la fois les influences marines et continentales, abritant à son sommet le
    tombeau de Njegoš.
  de: >-
    Ein einzelner Berg vereint meeres- und kontinentale Klimaeinflüsse und birgt auf seinem Gipfel das
    Njegoš-Mausoleum.
  it: >-
    Una sola montagna accoglie insieme l'influenza del mare e dell'entroterra, custodendo sulla sua cima il
    mausoleo di Njegoš.
  pt: >-
    Uma única montanha recebe em simultâneo a influência marítima e continental, guardando no topo o mausoléu
    de Njegoš.
observaciones:
