texto:
  es:
    intro: >-
      Si Montenegro se llama así, en parte es por esta montaña. Lovćen, cubierto de bosque denso, daba la
      impresión de una montaña negra, y de ahí vienen los nombres de Montenegro y de Crna Gora. El macizo se
      alza detrás de Kotor, en el borde de la cuenca del Adriático, y encierra las bahías largas y retorcidas
      de Boka Kotorska. El parque nacional, proclamado en 1952, cubre su parte central y más alta, con las dos
      cumbres de Štirovnik y Jezerski vrh.
    landscape: >-
      Lovćen es un paisaje kárstico tallado en caliza y dolomía. Sus laderas son rocosas, llenas de fisuras,
      simas y depresiones profundas que le dan un aspecto inconfundible. Las dos cumbres lo resumen:
      Štirovnik, de 1.749 m, y Jezerski vrh, de 1.657 m. Al pie del macizo están Kotor, Budva y Cetinje.


      La montaña se levanta entre el mar y el continente, y por eso sufre la influencia de los dos climas. Esa
      mezcla ha dado lugar a sistemas biológicos distintos, y el efecto se ve en la vegetación.
    wildlife: >-
      Lo más medible de Lovćen es su flora: 1.158 especies de plantas, dos de ellas endémicas de Montenegro,
      Taraxacum validum y Cardamine montenegrina.


      La Wikipedia alemana añade que la parte de la montaña que es parque nacional alberga plantas y animales
      raros. No hay cifras de fauna: este es un parque para fijarse en el paisaje, en las plantas y en la
      huella humana, más que para salir a buscar animales.


      Las estaciones se notan sobre todo en los katuns, los asentamientos de verano de los ganaderos, con
      cabañas y eras que aún se conservan. Y en el nombre: la montaña es negra cuando el bosque la cubre.
    visit: >-
      La visita clásica es subir por la carretera de Cetinje a Kotor, que pasa por Njeguši. Es la primera
      carretera para carros que se hizo en Montenegro. Desde Kotor sube serpenteando hasta el pueblo de
      Njeguši, cuna de la familia real, los Petrović, y está considerada una reliquia arquitectónica. Desde un
      mirador cercano se ve la bahía de Kotor y la comarca de Katunska nahija, que Bernard Shaw llamó el mar
      de piedra. El gestor señala que los miradores son de fácil acceso y están unidos por senderos marcados.


      En la cima de Jezerski vrh está el mausoleo de Njegoš, a veintiún kilómetros por carretera asfaltada de
      Cetinje. Es el monumento más grande e importante del parque.
    history: >-
      Njegoš eligió él mismo la cima de Jezerski vrh como lugar de su tumba: fue su última voluntad. La
      capilla que él construyó allí fue destruida durante la ocupación austrohúngara de la Primera Guerra
      Mundial y reconstruida en los años veinte. El mausoleo actual, concebido por el escultor Ivan Meštrović,
      la sustituyó.


      El macizo fue también una fortaleza. Antes de la Primera Guerra Mundial se fortificó con ayuda francesa,
      con artillería que dominaba la base naval austrohúngara de Kotor. En enero de 1916, las tropas
      austrohúngaras tomaron el paso de Lovćen y las alturas contiguas.


      El parque protege tanto la naturaleza como este patrimonio histórico, cultural y arquitectónico, con sus
      casas antiguas y sus katuns.
    before: >-
      Consulta al gestor las condiciones de visita y los sectores abiertos al público antes de organizar la
      salida.
    around: >-
      El [Parque Nacional del Lago Skadar](/lugar/nacionalni-park-skadarsko-jezero/) es el vecino más cercano.
      Más lejos, otros espacios comparten con Lovćen hábitats de alta montaña o de karst y especies como la
      [víbora cornuda](/especie/vipera_ammodytes/): el [Parque Nacional de Velebit
      Norte](/lugar/nacionalni-park-sjeverni-velebit/), la [Garganta de Sohodol](/lugar/cheile-sohodolului/) y
      el [Parque Nacional Desfiladero del Jiu - Bosque
      Primario](/lugar/parcul-national-defileul-jiului-codrii-seculari/).
  en:
    intro: >-
      If Montenegro carries this name, it is largely due to this mountain. Lovćen, clad in thick dark forests,
      gave the impression of a black mountain, inspiring the names Montenegro and Crna Gora. The massif rises
      steeply behind Kotor at the threshold of the Adriatic basin, enclosing the serpentine waters of the Bay
      of Kotor (Boka Kotorska). Established as a national park in 1952, it protects the central and highest
      crest of the massif, anchored by the twin peaks of Štirovnik and Jezerski vrh.
    landscape: >-
      Lovćen presents a classical karst landscape sculpted in limestone and dolomite. Its rugged slopes are
      fissured with crevices, deep sinkholes and dry karst depressions that give the massif its distinctive
      rocky texture. Two high summits dominate the relief: Štirovnik at 1,749 m and Jezerski vrh at 1,657 m.
      Clustered around the foot of the massif lie Kotor, Budva and Cetinje.


      The mountain rises abruptly between the sea and the mainland, enduring the interplay of both maritime
      and continental climates. This meeting of regimes fosters diverse ecological zones, plainly visible
      across its layered vegetation.
    wildlife: >-
      The most remarkable feature of Lovćen is its botanical richness: 1,158 documented plant species,
      including two endemics unique to Montenegro, Taraxacum validum and Cardamine montenegrina.


      The protected national park area shelters rare plants and adapted animals. Precise wildlife counts are
      not published: this is a park best experienced through its austere landscapes, rich flora and profound
      human heritage rather than active animal tracking.


      The cycle of seasons is most apparent in the traditional *katuns*, pastoral summer hamlets featuring
      stone huts and threshing floors still preserved today. The mountain's dark aspect deepens when summer
      foliage covers the slopes.
    visit: >-
      The classic visit involves driving the historic mountain road from Cetinje to Kotor via Njeguši, the
      very first carriage road built in Montenegro. From Kotor it climbs through legendary switchbacks to the
      village of Njeguši, ancestral cradle of the royal Petrović dynasty, celebrated as an architectural
      relic. A nearby belvedere offers sweeping panoramas across the Bay of Kotor and the rocky Katunska
      nahija plateau, which George Bernard Shaw famously likened to a sea of stone. Park authorities note that
      viewpoints are easily accessible and linked by marked walking paths.


      At the summit of Jezerski vrh stands the Njegoš Mausoleum, reached via twenty-one kilometres of paved
      road from Cetinje. It represents the largest and most significant monument in the national park.
    history: >-
      Petar II Petrović-Njegoš chose the summit of Jezerski vrh for his final resting place according to his
      last will. The original burial chapel he constructed was destroyed during the Austro-Hungarian
      occupation of the First World War and rebuilt in the nineteen-twenties. The current monumental
      mausoleum, designed by sculptor Ivan Meštrović, replaced it in later decades.


      The massif was also a strategic military stronghold. Prior to the First World War it was fortified with
      French assistance, mounting heavy artillery that commanded the Austro-Hungarian naval base in Kotor. In
      January 1916, Austro-Hungarian troops captured the Lovćen pass and surrounding crests.


      The park safeguards both pristine natural ecosystems and this deep historical, cultural and
      architectural heritage embodied by traditional stone houses and pastoral katuns.
    before: >-
      Check with park authorities regarding access conditions and open visitor sectors before planning your
      mountain excursion.
    around: >-
      [Lake Skadar National Park](/lugar/nacionalni-park-skadarsko-jezero/) is the closest neighbouring
      protected area. Further away, other parks share high-mountain karst habitats and species such as the
      [nose-horned viper](/especie/vipera_ammodytes/): [Northern Velebit National
      Park](/lugar/nacionalni-park-sjeverni-velebit/), [Sohodol Gorge](/lugar/cheile-sohodolului/) and [Jiu
      Gorge National Park - Primeval Forest](/lugar/parcul-national-defileul-jiului-codrii-seculari/).
  fr:
    intro: >-
      Si le Monténégro porte ce nom, c'est en grande partie grâce à cette montagne. Le mont Lovćen, autrefois
      drapé de forêts denses et sombres, donnait l'impression d'une montagne noire, inspirant les noms de
      Monténégro et de Crna Gora. Le massif surgit derrière Kotor au bord du bassin adriatique, surplombant
      les méandres des bouches de Kotor (Boka Kotorska). Déclaré parc national en 1952, il englobe la partie
      centrale et sommitale du massif, couronnée par les deux pics de Štirovnik et du Jezerski vrh.
    landscape: >-
      Le Lovćen présente un relief karstique classique taillé dans le calcaire et la dolomie. Ses versants
      rocheux sont criblés de failles, de gouffres béants et de dépressions fermées qui lui confèrent une
      silhouette minérale unique. Deux sommets résument la crête : le Štirovnik à 1 749 m et le Jezerski vrh à
      1 657 m. Au pied du massif s'étendent Kotor, Budva et Cetinje.


      La montagne se dresse entre mer et continent, affrontant l'influence mêlée de deux climats. Cette
      transition biogéographique engendre des écosystèmes singuliers, parfaitement visibles dans l'étagement
      de la végétation.
    wildlife: >-
      L'attrait majeur du Lovćen réside dans sa flore : 1 158 espèces végétales ont été recensées, dont deux
      endémiques du Monténégro, Taraxacum validum et Cardamine montenegrina.


      Le cœur du parc national abrite des plantes rares et une faune montagnarde adaptée. Il n'existe pas de
      statistiques faunistiques détaillées : c'est un parc qui se contemple avant tout pour son austère beauté
      géologique, sa richesse botanique et ses traces d'histoire pastorale.


      Le cycle des saisons se lit dans les *katuns*, ces hameaux d'estive traditionnels où subsistent
      bergeries en pierre et aires de battage. La montagne semble noire lorsque le feuillage dense des hêtres
      enveloppe ses flancs.
    visit: >-
      L'excursion classique emprunte la route historique de Cetinje à Kotor par Njeguši, la toute première
      route carrossable tracée au Monténégro. Depuis Kotor, elle grimpe en lacets spectaculaires jusqu'au
      village de Njeguši, berceau de la dynastie royale des Petrović, considéré comme une relique
      architecturale. Depuis un belvédère voisin s'offre une vue saisissante sur les bouches de Kotor et la
      Katunska nahija, que George Bernard Shaw comparait à une mer de pierre. Les belvédères sont facilement
      accessibles et reliés par des sentiers balisés.


      Au sommet du Jezerski vrh se dresse le mausolée de Njegoš, relié à Cetinje par vingt-et-un kilomètres de
      route asphaltée. C'est le monument le plus emblématique du parc.
    history: >-
      Njegoš choisit lui-même le sommet du Jezerski vrh pour y établir sa sépulture : c'était ses dernières
      volontés. La chapelle qu'il y fit édifier fut détruite pendant l'occupation austro-hongroise de la
      Première Guerre mondiale, puis reconstruite dans les années vingt. L'imposant mausolée conçu par le
      sculpteur Ivan Meštrović lui succéda par la suite.


      Le massif fit aussi office de forteresse stratégique. Avant la Première Guerre mondiale, il fut fortifié
      avec l'aide française afin de pointer son artillerie sur la base navale austro-hongroise de Kotor. En
      janvier 1916, les troupes austro-hongroises s'emparèrent du col du Lovćen et de ses hauteurs.


      Le parc préserve ainsi des espaces naturels sauvages tout autant qu'un patrimoine historique et
      architectural forgé par les anciens katuns pastoraux.
    before: >-
      Renseignez-vous auprès des gestionnaires du parc sur l'accessibilité des routes et des secteurs de
      visite avant d'organiser votre excursion.
    around: >-
      Le [parc national du lac Skadar](/lugar/nacionalni-park-skadarsko-jezero/) est le voisin protégé le plus
      proche. Plus loin, d'autres massifs partagent avec le Lovćen des reliefs karstiques et des espèces comme
      la [vipère ammodyte](/especie/vipera_ammodytes/) : le [parc national du Velebit
      septentrional](/lugar/nacionalni-park-sjeverni-velebit/), les [gorges de
      Sohodol](/lugar/cheile-sohodolului/) et le [parc national des gorges du Jiu - forêt
      primaire](/lugar/parcul-national-defileul-jiului-codrii-seculari/).
  de:
    intro: >-
      Wenn Montenegro diesen Namen trägt, dann vor allem wegen dieses Berges. Der einst von dichten, dunklen
      Wäldern bedeckte Lovćen erweckte den Eindruck eines schwarzen Berges, was den Namen Montenegro und Crna
      Gora prägte. Das Massiv erhebt sich steil hinter Kotor am Rande des Adria-Beckens und umrahmt die tief
      eingeschnittene Bucht von Kotor (Boka Kotorska). Der 1952 ausgerufene Nationalpark schützt den zentralen
      und höchsten Teil des Massivs mit den beiden Gipfeln Štirovnik und Jezerski vrh.
    landscape: >-
      Der Lovćen ist eine klassische Karstlandschaft aus Kalkstein und Dolomit. Seine Hänge sind felsig,
      durchzogen von Spalten, tiefen Dolinen und Trockentälern, die ihm sein unverwechselbares Gepräge
      verleihen. Zwei Gipfel dominieren das Relief: der Štirovnik mit 1.749 m und der Jezerski vrh mit 1.657
      m. Am Fuße des Gebirges liegen Kotor, Budva und Cetinje.


      Der Berg steht zwischen Meer und Festland und ist daher beiden Klimaeinflüssen ausgesetzt. Diese
      Begegnung brachte eigenständige Lebensgemeinschaften hervor, was sich in der abgestuften Vegetation
      widerspiegelt.
    wildlife: >-
      Das bemerkenswerteste Naturmerkmal des Lovćen ist seine Flora: 1.158 Pflanzenarten sind dokumentiert,
      darunter zwei für Montenegro endemische Arten, Taraxacum validum und Cardamine montenegrina.


      Der Nationalparkteil beherbergt seltene Pflanzen und Gebirgstiere. Exakte Wildtierzahlen werden nicht
      erhoben: Dies ist ein Schutzgebiet, in dem Landschaft, Karstflora und historische Spuren im Vordergrund
      stehen.


      Die Jahreszeiten prägen die traditionellen *Katuns*, die Sommerweideplätze der Hirten mit ihren
      erhaltenen Steinhütten und Dreschplätzen. Der Berg wirkt dunkel und schwarz, wenn dichter Buchenwald
      seine Flanken bedeckt.
    visit: >-
      Der klassische Ausflug führt über die historische Bergstraße von Cetinje nach Kotor über Njeguši, die
      allererste befahrbare Straße Montenegros. Von Kotor aus windet sie sich in spektakulären Serpentinen
      hinauf zum Dorf Njeguši, dem Stammsitz der Fürstendynastie Petrović, und gilt als bauliches Denkmal. Ein
      naher Aussichtspunkt eröffnet weite Blicke auf die Bucht von Kotor und die Katunska nahija, die Bernard
      Shaw als Steinmeer beschrieb. Die Aussichtspunkte sind leicht erreichbar und durch markierte Wege
      verbunden.


      Auf dem Gipfel des Jezerski vrh thront das Njegoš-Mausoleum, erreichbar über einundzwanzig Kilometer
      Asphaltstraße von Cetinje. Es ist das bedeutendste Bauwerk des Parks.
    history: >-
      Njegoš wählte die Kuppe des Jezerski vrh selbst als letzte Ruhestätte aus. Die von ihm errichtete
      Kapelle wurde während der österreichisch-ungarischen Besatzung im Ersten Weltkrieg zerstört und in den
      zwanziger Jahren wieder aufgebaut. Das heutige Monumental-Mausoleum des Bildhauers Ivan Meštrović
      ersetzte sie schließlich.


      Das Massiv diente auch als strategische Festung. Vor dem Ersten Weltkrieg wurde es mit französischer
      Hilfe befestigt, um mit Artillerie den österreichisch-ungarischen Marinestützpunkt Kotor zu beherrschen.
      Im Januar 1916 eroberten österreichisch-ungarische Truppen den Lovćen-Pass und die umliegenden Höhen.


      Der Park schützt Natur ebenso wie dieses reiche historische und bauliche Erbe aus traditionellen
      Steinhäusern und Hirtenkatuns.
    before: >-
      Informiere dich vor Beginn einer Bergtour bei der Parkverwaltung über geöffnete Straßenabschnitte und
      aktuelle Besuchsbedingungen.
    around: >-
      Der [Nationalpark Skutarisee](/lugar/nacionalni-park-skadarsko-jezero/) ist das nächstgelegene
      Schutzgebiet. Weiter entfernt teilen Karst- und Hochgebirgslebensräume sowie Arten wie die [Europäische
      Hornotter](/especie/vipera_ammodytes/) der [Nationalpark Nördlicher
      Velebit](/lugar/nacionalni-park-sjeverni-velebit/), die [Sohodol-Schlucht](/lugar/cheile-sohodolului/)
      und der [Nationalpark Jiu-Schlucht - Urwälder](/lugar/parcul-national-defileul-jiului-codrii-seculari/).
  it:
    intro: >-
      Se il Montenegro porta questo nome, lo deve in gran parte a questa montagna. Il Lovćen, ammantato di
      foreste scure e fitte, trasmetteva la sensazione di una montagna nera, dando origine ai toponimi
      Montenegro e Crna Gora. Il massiccio si erge ripido alle spalle di Cattaro, sul margine del bacino
      adriatico, racchiudendo le insenature delle Bocche di Cattaro (Boka Kotorska). Proclamato parco
      nazionale nel 1952, protegge il settore sommitale dominato dalle due vette dello Štirovnik e dello
      Jezerski vrh.
    landscape: >-
      Il Lovćen offre un paesaggio carsico modellato in calcari e dolomie. I suoi versanti rocciosi sono
      incisi da fessure, inghiottitoi e doline che conferiscono alla montagna un profilo aspro e tormentato.
      Due cime ne delineano la cresta: lo Štirovnik a 1.749 m e lo Jezerski vrh a 1.657 m. Ai piedi del
      massiccio sorgono Cattaro, Budva e Cetinje.


      La montagna s'innalza tra il mare e la terraferma, risentendo del confronto tra i due climi. Questo
      connubio ha generato comunità biologiche originali, testimoniate dalla ricca vegetazione a fasce.
    wildlife: >-
      L'aspetto più straordinario del Lovćen risiede nella flora: 1.158 specie censite, di cui due endemiche
      del Montenegro, Taraxacum validum e Cardamine montenegrina.


      Il cuore del parco racchiude piante e animali montani adattati alle rocce carsiche. Non esistono
      censimenti sistematici della fauna: è un'area protetta in cui contemplare soprattutto l'austera bellezza
      geologica, la vegetazione e i segni della presenza pastorale.


      Il mutare delle stagioni si percepisce nei *katun*, i borghi d'alpeggio dei pastori con rustici in
      pietra e aie tradizionali. La montagna appare nera quando il fitto bosco di faggi ne riveste i pendii.
    visit: >-
      L'escursione classica percorre la storica rotabile da Cetinje a Cattaro via Njeguši, la primissima
      strada per carrozze realizzata in Montenegro. Da Cattaro risale con leggendari tornanti panoramici verso
      Njeguši, culla della dinastia reale Petrović, autentica testimonianza di architettura tradizionale. Da
      un vicino belvedere la vista spazia sulle Bocche di Cattaro e sull'altopiano di Katunska nahija,
      definito da Bernard Shaw un vero mare di pietra. I punti panoramici sono accessibili e collegati da
      sentieri segnati.


      Sulla vetta dello Jezerski vrh sorge il maestoso mausoleo di Njegoš, a ventuno chilometri di strada
      asfaltata da Cetinje. Rappresenta il monumento più imponente del parco.
    history: >-
      Njegoš scelse personalmente la vetta dello Jezerski vrh quale luogo per la propria tomba, secondo le sue
      ultime volontà. La cappella originale da lui eretta fu distrutta durante l'occupazione austro-ungarica
      della prima guerra mondiale e ricostruita negli anni venti. L'attuale mausoleo monumentale, opera dello
      scultore Ivan Meštrović, la sostituì in seguito.


      Il massiccio fu anche un bastione fortificato. Prima della prima guerra mondiale fu presidiato con
      artiglieria francese per controllare la piazzaforte navale austro-ungarica di Cattaro. Nel gennaio 1916
      le truppe austro-ungariche conquistarono il valico del Lovćen e le creste circostanti.


      Il parco preserva sia gli ambienti naturali montani sia il patrimonio culturale e architettonico dei
      borghi pastorali.
    before: >-
      Verifica con l'ente parco le condizioni di viabilità e i settori aperti al pubblico prima di
      intraprendere l'escursione.
    around: >-
      Il [Parco nazionale del Lago di Scutari](/lugar/nacionalni-park-skadarsko-jezero/) è l'area protetta più
      vicina. A maggiore distanza, condividono habitat carsici e specie come la [vipera dal
      corno](/especie/vipera_ammodytes/) il [Parco nazionale del Velebit
      settentrionale](/lugar/nacionalni-park-sjeverni-velebit/), le [Gole di
      Sohodol](/lugar/cheile-sohodolului/) e il [Parco nazionale della Gola del Jiu - Foresta
      vetusta](/lugar/parcul-national-defileul-jiului-codrii-seculari/).
  pt:
    intro: >-
      Se Montenegro tem este nome, deve-o em grande medida a esta serra. O monte Lovćen, antigamente coberto
      por densas e escuras florestas, transmitia a impressão de uma montanha negra, inspirando os nomes de
      Montenegro e Crna Gora. O maciço ergue-se escarpado por detrás de Kotor, no rebordo da bacia adriática,
      abraçando as enseadas das Bocas de Kotor (Boka Kotorska). Declarado parque nacional em 1952, abrange o
      setor culminante do maciço, coroado pelos picos Štirovnik e Jezerski vrh.
    landscape: >-
      Lovćen constitui uma paisagem cársica esculpida em calcários e dolomitos. As suas encostas rochosas
      encontram-se fendidas por algares, covas profundas e dolinas que lhe conferem uma fisionomia
      inconfundível. Dois cumes marcam o relevo: o Štirovnik, com 1.749 m, e o Jezerski vrh, com 1.657 m. No
      sopé da montanha situam-se Kotor, Budva e Cetinje.


      A serra ergue-se entre o mar e o continente, recebendo o influxo convergente de ambos os climas. Este
      cruzamento climático originou ecossistemas próprios, evidentes no escalonamento da vegetação.
    wildlife: >-
      O elemento de maior destaque em Lovćen é a sua flora: estão documentadas 1.158 espécies de plantas,
      incluindo duas endémicas de Montenegro, Taraxacum validum e Cardamine montenegrina.


      A zona protegida acolhe plantas raras e animais de montanha adaptados ao meio rochoso. Não existem
      censos pormenorizados de fauna: este parque destina-se a apreciar a imponência geológica, a riqueza
      vegetal e os vestígios da presença humana.


      O ritmo das estações transparece nos tradicionais *katuns*, os povoados de verão dos pastores com as
      suas cabanas em pedra e eiras seculares. A serra aparenta ser negra quando o denso arvoredo cobre as
      suas vertentes.
    visit: >-
      A subida clássica faz-se pela estrada panorâmica que liga Cetinje a Kotor através de Njeguši, a primeira
      estrada para carruagens construída em Montenegro. A partir de Kotor serpenteia em curvas arrojadas até à
      aldeia de Njeguši, berço da linhagem real dos Petrović, tida como património histórico. Num miradouro
      vizinho vislumbra-se a baía de Kotor e o planalto cársico de Katunska nahija, que Bernard Shaw designou
      por mar de pedra. Os miradouros são de acesso fácil e encontram-se interligados por trilhos pedestres.


      No topo do Jezerski vrh ergue-se o mausoléu de Njegoš, a vinte e um quilómetros em estrada pavimentada a
      partir de Cetinje. É o monumento mais relevante do parque.
    history: >-
      O próprio Njegoš escolheu o cimo do Jezerski vrh para sua sepultura, conforme expresso no seu
      testamento. A capela primitiva por si edificada foi destruída durante a ocupação austro-húngara da
      Primeira Guerra Mundial e reconstruída na década de vinte. O monumental mausoléu desenhado pelo escultor
      Ivan Meštrović substituiu-a mais tarde.


      O maciço desempenhou também funções de baluarte militar. Antes da Primeira Guerra Mundial foi
      fortificado com cooperação francesa, apontando a artilharia sobre a base naval austro-húngara de Kotor.
      Em janeiro de 1916, forças austro-húngaras tomaram o desfiladeiro de Lovćen e as cotas contíguas.


      O parque protege simultaneamente o património natural e este testemunho histórico patente nos antigos
      katuns.
    before: >-
      Informa-te junto da administração do parque sobre o estado das estradas e os setores abertos à visitação
      antes de planear a subida.
    around: >-
      O [Parque Nacional do Lago Skadar](/lugar/nacionalni-park-skadarsko-jezero/) é o espaço protegido mais
      próximo. Mais distantes, partilham relevos cársicos e espécies como a
      [víbora-cornuda](/especie/vipera_ammodytes/) o [Parque Nacional de Velebit
      Norte](/lugar/nacionalni-park-sjeverni-velebit/), o [Desfiladeiro de
      Sohodol](/lugar/cheile-sohodolului/) e o [Parque Nacional do Desfiladeiro do Jiu - Bosque
      Primário](/lugar/parcul-national-defileul-jiului-codrii-seculari/).
