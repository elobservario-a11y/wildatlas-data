resumen:
  es: >-
    El río Reka desaparece bajo tierra en un cañón subterráneo de más de cien metros de altura, uno de los
    mayores del mundo.
  en: >-
    The Reka River vanishes underground into a subterranean canyon over a hundred metres high, among the
    grandest on Earth.
  fr: >-
    La rivière Reka s'engouffre sous terre dans un canyon souterrain de plus de cent mètres de haut, parmi les
    plus vastes du monde.
  de: >-
    Der Fluss Reka verschwindet im Untergrund in einer über hundert Meter hohen Schlucht, einer der
    gewaltigsten der Erde.
  it: >-
    Il fiume Timavo superiore (Reka) scompare nel sottosuolo in un canyon sotterraneo alto oltre cento metri,
    tra i più imponenti del pianeta.
  pt: >-
    O rio Reka precipita-se no subsolo num desfiladeiro subterrâneo com mais de cem metros de altura, dos mais
    colossais do planeta.
unico:
  es: Es un cañón subterráneo cuyo río, tras cruzarlo, se desvanece hacia el mar bajo una pared de roca.
  en: >-
    An underground canyon whose river, having traversed vast caverns, disappears towards the sea beneath a
    sheer wall of rock.
  fr: >-
    Un canyon souterrain dont le cours d'eau, après avoir traversé d'immenses salles, disparaît vers la mer
    sous une muraille rocheuse.
  de: >-
    Eine unterirdische Schlucht, deren Fluss nach dem Durchqueren riesiger Hallen unter einer Felswand dem
    Meer entgegen verschwindet.
  it: >-
    Un canyon ipogeo il cui fiume, dopo aver percorso caverne titaniche, svanisce verso il mare sotto una
    colossale parete di roccia.
  pt: >-
    Um canhão subterrâneo cujo rio, após sulcar abismos colossais, se desvanece em direção ao mar sob uma
    imensa muralha de rocha.
observaciones:
  es: >-
    La visita a las cuevas solo se hace con guía y por turnos, así que comprueba antes los turnos y si hay
    plazas. Las cuevas cierran el 1 de enero y el 25 de diciembre. Lleva ropa y calzado cómodos, gorra, agua y
    paraguas por si llueve: parte del camino va por la superficie.
texto:
  es:
    intro: >-
      Un río entero entra en la montaña y no sale en kilómetros. En Škocjan, el Reka llega por una garganta de
      unos cuatro kilómetros, topa con una pared y desaparece bajo tierra en el fondo de una dolina inmensa.
      Lo que viene después es un cañón subterráneo de dimensiones fuera de lo común, que tiene a las cuevas de
      Škocjan entre los fenómenos subterráneos más famosos del mundo. Son Patrimonio Mundial de la UNESCO
      desde 1986 y humedal Ramsar, y el parque regional que las rodea las protege junto con un paisaje
      kárstico que es, de por sí, un museo al aire libre.
    landscape: >-
      Todo lo hizo el Reka. Nace bajo la meseta de Snežnik y recorre unos cincuenta y cinco kilómetros por la
      superficie, sobre flysch impermeable, donde reúne el agua. Al llegar a la caliza del Cretácico y del
      Paleoceno, se hunde. Desde entonces el río no solo ahonda su cauce por erosión: también disuelve la
      roca. Antes de desaparecer atraviesa una garganta de unos cuatro kilómetros, que termina en una gran
      pared; es el valle ciego más grande de Eslovenia.


      El techo de la cueva se hundió y quedaron dos dolinas de hundimiento: Velika dolina, de hasta 165 m de
      profundidad, y Mala dolina, de 120 m, separadas por un puente natural, resto del techo original. Allí
      están las entradas. Dentro, el cañón sigue su camino por el canal de Hanke y se abre en grandes salas,
      entre ellas la de Martel, con 2,2 millones de m³. El problema es la salida: un cañón de esas dimensiones
      acaba en un sifón pequeño, y tras fuertes lluvias el agua no cabe. El Reka crece dentro de la cueva,
      normalmente hasta 30 metros; la mayor subida registrada fue de 132 metros.


      El clima de las dolinas es otro mundo. Crecen juntas especies alpinas, como la oreja de oso, y
      mediterráneas, como el culantrillo, algo excepcionalmente raro en la naturaleza. Los relictos glaciares
      se concentran en el fondo, justo sobre el sumidero del Reka; unos 40 metros más arriba, en el techo de
      la entrada de la sala Schmidl, crecen relictos termófilos como el espárrago silvestre y el enebro de
      miera.
    wildlife: >-
      Arriba, lo primero que se nota son las palomas bravías, que vuelan en bandadas y anidan bajo los techos
      de las entradas; un pequeño grupo de vencejos reales anida en las grietas. Los cortados dan refugio y
      nido al [búho real](/especie/bubo_bubo/) y al [halcón peregrino](/especie/falco_peregrinus/), y en
      invierno las paredes colgantes reciben al [treparriscos](/especie/tichodroma_muraria/), un ave alpina
      que se alimenta de arañas y pequeños invertebrados de las grietas. Los lirones ocupan las cuevas y las
      copas de los árboles; el zorro y el tejón viven en las laderas de la garganta del Reka.


      Bajo tierra, la vida es distinta: no hay verano ni invierno, la temperatura es estable y los animales
      terrestres de las cuevas son diminutos, rara vez más de un centímetro. En el agua, el rey es el
      [proteo](/especie/proteus_anguinus/), «gigante» entre los suyos, de más de 20 centímetros. Se describió
      en 1758, y el escarabajo ciego Leptodirus hochenwartii en 1832, los primeros troglobios descritos
      científicamente. Entre los murciélagos, el más numeroso es el murciélago de cueva, cuya colonia migra
      entre Škocjan y Predjama.
    visit: >-
      La visita guiada sale del centro de recepción y los guías llevan a pie hasta la dolina de Globočak,
      donde está la entrada. Un túnel artificial da paso a Tiha jama, una galería fósil seca y rica en
      formaciones; su Velika dvorana alberga a Orjak, uno de los mayores estalagmitos del sistema. Desde allí
      se llega a Šumeča jama, donde aparece el Reka y se cruza uno de los mayores cañones subterráneos de
      Europa por el puente de Cerkvenik. Después sales a la luz y sigues por tu cuenta por Velika dolina. El
      recorrido completo mide 5 km, con unos mil escalones; la salida anticipada en Velika dolina deja 3 km y
      entre 500 y 800 escalones. De enero a abril y de octubre a diciembre la visita termina por Velika
      dolina. Dentro no se puede fotografiar y no se admiten mascotas.


      Fuera de la cueva, el sendero educativo rodea las dos dolinas en unos dos kilómetros, en menos de una
      hora, con vistas de las dolinas, las paredes y el Reka que desaparece. Empieza y acaba ante el Centro de
      Información de Matavun, donde se compran las entradas. Las colecciones del caserío Delez tratan de la
      geología y la biodiversidad del Karst y solo abren en temporada alta, de junio a septiembre.


      Si vienes en tren, de la estación de Divača sale un sendero marcado de unos 4 kilómetros que se hace en
      unos 50 minutos.
    history: >-
      El valor humano del lugar es enorme. En el abismo de Mušja jama hubo ritos de sacrificio a los dioses a
      finales de la Edad del Bronce: se hallaron armas y huesos de animales quemados y rotos. Por los
      hallazgos, la gente peregrinaba a este centro de culto desde cientos de kilómetros, de Italia, los
      Alpes, Panonia, los Balcanes y hasta Grecia. En la cueva Skeletna apareció una inscripción en letras
      venecias tempranas, el texto más antiguo hallado en Eslovenia.


      En 1689, Valvasor describió el sumidero del Reka y su curso subterráneo; la exploración sistemática
      empezó con una expedición en 1884, y el libro de visitas se abrió el 1 de enero de 1819. Los vecinos de
      Škocjan y Matavun cincelaron casi 12.000 metros de senderos en las cuevas, el doble de la longitud del
      sistema. Los términos «karst» y «dolina» nacieron aquí.


      Son el único monumento de Eslovenia y del Karst clásico en la lista de la UNESCO. El parque regional se
      creó por ley en 1996 y las cuevas son humedal Ramsar por su fauna cavernícola, a menudo endémica, desde
      el 18 de mayo de 1999.
    before: >-
      La visita a las cuevas solo se hace con guía y por turnos, así que comprueba antes los turnos y si hay
      plazas. Las cuevas cierran el 1 de enero y el 25 de diciembre. Lleva ropa y calzado cómodos, gorra, agua
      y paraguas por si llueve: parte del camino va por la superficie.
    around: >-
      Pegadas a Škocjan, a 0 km, están las [cuevas de Postojna y el Karst Clásico (Sistema
      Postojna-Planina)](/lugar/postonjska-jama---planinsko-polje/). A unos 12 km queda la [Meseta Kárstica de
      Nanos](/lugar/kraska-planota-nanos/); a dieciséis, los [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); a diecinueve, el [Macizo Forestal de
      Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), donde nace el Reka; a veintisiete, el [lago de
      Cerknica](/lugar/cerknisko-jezero/), y a veintiocho la [Meseta Forestal de
      Trnovo](/lugar/trnovski-gozd/).


      Más lejos, los [Valles Kársticos de Prosiecka y Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/)
      comparten con Škocjan el karst, los cañones y los corredores fluviales, y el murciélago ratonero grande.
  en:
    intro: >-
      An entire river plunges into the mountain and stays hidden for kilometres. At Škocjan, the Reka enters
      through a canyon of some four kilometres, strikes a precipitous wall, and vanishes underground at the
      base of an immense collapse doline. What follows is a subterranean canyon of extraordinary proportions,
      placing the Škocjan Caves among the most renowned speleological wonders on Earth. Inscribed as a UNESCO
      World Heritage site in 1986 and designated a Ramsar wetland, the surrounding regional park safeguards
      them alongside a classic karst landscape that is, in itself, an open-air museum.
    landscape: >-
      The Reka sculpted everything. Rising beneath the Snežnik plateau, it flows for some fifty-five
      kilometres across impermeable flysch, gathering water before meeting Cretaceous and Paleocene limestone
      where it sinks beneath the surface. From that threshold onward, the river does not merely carve its bed
      through mechanical erosion; it dissolves the soluble rock. Before disappearing, it cuts through a gorge
      of about four kilometres terminating at a sheer cliff face: the largest blind valley in Slovenia.


      Catastrophic collapse of the cave ceiling left two gaping sinkholes: Velika dolina, plunging to a depth
      of 165 m, and Mala dolina at 120 m, separated by a natural bridge representing a remnant of the original
      cavern roof. The cave entrances open here. Underground, the canyon continues through Hanke's Channel and
      opens into immense chambers, notably Martel's Chamber, boasting 2.2 million m³. The bottle-neck lies at
      the exit: a canyon of such massive proportions terminates in a narrow siphon, unable to absorb extreme
      spates after heavy rainfall. The Reka surges inside the cave, typically rising by up to 30 metres; the
      highest flood ever recorded reached a staggering 132 metres.


      The microclimate within the collapse dolines forms an extraordinary ecological refuge. Alpine species
      such as bear's ear (*Primula auricula*) grow side by side with Mediterranean elements like maidenhair
      fern (*Adiantum capillus-veneris*), a co-occurrence of exceptional biogeographical rarity. Glacial
      relicts thrive at the bottom, directly above the Reka's ponor; some 40 metres higher, around the roof of
      the Schmidl Cave entrance, warmth-loving relicts such as wild asparagus and prickly juniper find
      purchase.
    wildlife: >-
      Above ground, the first creatures you notice are wild rock doves circling in flocks and roosting beneath
      entrance arches, while an alpine swift colony nests in rock fissures. The sheer crags offer nesting
      ledges for the [Eurasian eagle-owl](/especie/bubo_bubo/) and [peregrine
      falcon](/especie/falco_peregrinus/), while in winter the overhanging cliffs welcome the
      [wallcreeper](/especie/tichodroma_muraria/), an alpine bird searching crevices for spiders and tiny
      invertebrates. Fat dormice inhabit the caves and surrounding canopy, while red fox and badger roam the
      slopes of the Reka gorge.


      Subterranean ecology obeys entirely different rules: lacking seasonal variation, temperature remains
      constant and terrestrial cave animals are minute, rarely exceeding one centimetre. In the subterranean
      waters, the uncontested sovereign is the [olm](/especie/proteus_anguinus/), an aquatic giant among cave
      fauna growing beyond 20 centimetres in length. It was scientifically described in 1758, followed by the
      blind cave beetle *Leptodirus hochenwartii* in 1832, making these the very first troglobites recognized
      by modern science. Among bats, the most abundant is Schreiber's bent-winged bat, whose roosting colonies
      migrate between Škocjan and Predjama.
    visit: >-
      Guided tours depart from the visitor reception centre, with rangers leading groups on foot to Globočak
      doline where the tour enters. An artificial tunnel leads into Tiha jama (Silent Cave), a dry fossil
      gallery rich in dripstone formations; its Velika dvorana holds the colossal stalagmite known as Orjak
      (the Giant). From there, the path enters Šumeča jama (Murmuring Cave), where the roar of the Reka fills
      one of the largest subterranean river canyons in Europe, crossed via the daring Cerkvenik Bridge.
      Re-emerging into daylight, you continue independently around Velika dolina. The full guided route covers
      5 km with roughly a thousand steps; the shorter exit at Velika dolina spans 3 km with between 500 and
      800 steps. From January to April and from October to December the tour finishes via Velika dolina.
      Inside the cave, photography and domestic pets are strictly prohibited.


      Above ground, an educational trail encircles both dolines over approximately two kilometres, taking
      under an hour while offering panoramic vistas of the cliffs, sinkholes, and the vanishing Reka. It
      begins and ends at the Matavun Information Centre, where tickets are issued. The ethnographic
      collections at Delez homestead cover the geology and biodiversity of the Classical Karst and are open
      only during peak season from June to September.


      Arriving by rail, a waymarked walking path of some 4 kilometres leads from Divača railway station in
      approximately 50 minutes.
    history: >-
      Human veneration of the chasm spans millennia. In the abyss of Mušja jama, sacrificial rites honouring
      chthonic deities took place during the Late Bronze Age: excavations unearthed deliberately broken
      weapons and charred animal bones. Archaeological evidence shows pilgrims journeyed to this sacred
      sanctuary across hundreds of kilometres, travelling from northern Italy, the Alps, Pannonia, the
      Balkans, and even Greece. Skeletna Cave yielded an early Venetic inscription, the oldest written text
      ever discovered within Slovenia.


      In 1689, Johann Weikhard von Valvasor published the first detailed description of the Reka's ponor and
      subterranean course; systematic exploration began with an organized expedition in 1884, while the
      visitor registry book opened on 1 January 1819. Local inhabitants from Škocjan and Matavun chiselled
      almost 12,000 metres of paths into the living rock of the caves, twice the length of the natural cave
      system. The scientific terms 'karst' and 'doline' were born right here.


      The caves are the only natural monument in Slovenia and the Classical Karst inscribed on the UNESCO
      World Heritage list. The regional park was established by law in 1996, and the caves were designated a
      Ramsar wetland on 18 May 1999 on account of their specialized, often endemic subterranean fauna.
    before: >-
      Visits inside the caves are conducted exclusively on guided tours with set departure times; check
      schedules and advance availability beforehand. The caves are closed on 1 January and 25 December. Wear
      comfortable footwear and warm clothing, and bring a hat, drinking water, and an umbrella in case of
      rain, as part of the trail traverses the surface.
    around: >-
      Immediately adjacent to Škocjan, at 0 km, lie the [Postojna and Classical Karst Caves (Postojna-Planina
      Cave System)](/lugar/postonjska-jama---planinsko-polje/). Approximately 12 km away rises the [Nanos
      Karst Plateau](/lugar/kraska-planota-nanos/); at sixteen kilometres, the [Javorniki Forests and Karst
      Plateau](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); at nineteen, the [Snežnik Forest
      Massif](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), birthplace of the Reka; at twenty-seven, [Lake
      Cerknica](/lugar/cerknisko-jezero/); and at twenty-eight, the [Trnovo Forest
      Plateau](/lugar/trnovski-gozd/).


      Further afield, [Prosiecka and Kvačianska Karst Valleys](/lugar/npr-kvacianska-a-prosiecka-dolina/)
      share with Škocjan karst geomorphology, canyons, river corridors, and the greater mouse-eared bat.
  fr:
    intro: >-
      Une rivière entière s'enfonce sous la montagne et disparaît sur des kilomètres. À Škocjan, la Reka
      débouche d'une gorge d'environ quatre kilomètres, vient buter contre une paroi rocheuse et s'engouffre
      sous terre au fond d'une immense doline d'effondrement. Ce qui suit est un canyon souterrain aux
      dimensions hors du commun, qui place les grottes de Škocjan parmi les phénomènes spéléologiques les plus
      célèbres de la planète. Inscrites au patrimoine mondial de l'UNESCO depuis 1986 et reconnues zone humide
      Ramsar, elles sont protégées au sein d'un parc régional englobant un paysage karstique qui constitue un
      véritable musée à ciel ouvert.
    landscape: >-
      Tout a été façonné par la Reka. Prenant sa source sous le plateau de Snežnik, elle parcourt environ
      cinquante-cinq kilomètres en surface sur des flyschs imperméables, rassemblant les eaux de ruissellement
      avant d'atteindre les calcaires du Crétacé et du Paléocène où elle s'engouffre. Dès lors, le cours d'eau
      ne se contente pas d'entailler son lit par érosion mécanique : il dissout activement la roche. Avant de
      disparaître, il traverse un défilé d'environ quatre kilomètres se terminant par une falaise abrupte : la
      plus grande vallée aveugle de Slovénie.


      L'effondrement du toit de la cavité a laissé place à deux dolines béantes : Velika dolina, profonde de
      165 m, et Mala dolina, de 120 m, séparées par un pont naturel relique de la voûte primitive. C'est là
      que s'ouvrent les accès. Sous terre, le canyon poursuit sa trajectoire par le canal de Hanke et s'évase
      en salles titanesques, notamment la salle Martel, cubant 2,2 millions de m³. Le point critique demeure
      l'exutoire : un canyon d'une telle démesure se termine par un siphon étroit incapable d'évacuer les
      crues violentes consécutives aux orages. La Reka monte alors en charge à l'intérieur de la galerie,
      s'élevant habituellement jusqu'à 30 mètres ; la plus haute crue enregistrée a atteint le niveau record
      de 132 mètres.


      Le climat des dolines forme un univers à part. Des espèces alpines comme l'oreille-d'ours côtoient des
      éléments méditerranéens tels que le capillaire de Montpellier, un mélange d'une insigne rareté
      biogéographique. Les reliques glaciaires s'épanouissent au fond, juste au-dessus du gouffre
      d'engouffrement de la Reka ; quelque 40 mètres plus haut, sur le surplomb rocheux de l'entrée de la
      salle Schmidl, s'accrochent des taxons thermophiles comme l'asperge sauvage et le genévrier cade.
    wildlife: >-
      En surface, le regard est immédiatement attiré par les pigeons bisets nichant sous les voûtes d'entrée,
      tandis qu'une colonie de martinets à ventre blanc s'abrite dans les fissures. Les falaises verticales
      offrent gîte et quiétude au [grand-duc d'Europe](/especie/bubo_bubo/) et au [faucon
      pèlerin](/especie/falco_peregrinus/), tandis qu'en hiver les parois en surplomb accueillent le
      [tichodrome échelette](/especie/tichodroma_muraria/), oiseau alpin glanant araignées et petits
      invertébrés dans les fentes. Les loirs colonisent cavités et frondaisons, tandis que le renard et le
      blaireau arpentent les versants boisés de la gorge de la Reka.


      Sous terre règne une tout autre écologie : ni été ni hiver, une température stable et une faune
      terrestre troglobie minuscule ne dépassant que rarement un centimètre. Dans le domaine aquatique, le
      souverain incontesté est le [protée anguillard](/especie/proteus_anguinus/), géant parmi les siens
      dépassant 20 centimètres. Il fut décrit dès 1758, et le coléoptère aveugle *Leptodirus hochenwartii* en
      1832, constituant les tout premiers animaux cavernicoles décrits scientifiquement. Chez les
      chauves-souris, le minioptère de Schreibers forme la colonie la plus nombreuse, migrant de façon
      saisonnière entre Škocjan et Predjama.
    visit: >-
      La visite guidée s'élance du centre d'accueil des visiteurs, les guides conduisant le groupe à pied
      jusqu'à la doline de Globočak où se trouve l'accès aménagé. Une galerie artificielle permet de pénétrer
      dans Tiha jama (la Grotte silencieuse), conduit fossile sec riche en concrétions stalagmitiques dont la
      Velika dvorana abrite Orjak (le Géant), l'un des plus massifs spéléothèmes du réseau. De là s'ouvre
      Šumeča jama (la Grotte bruyante), où résonne le fracas de la Reka franchie par le pont Cerkvenik
      au-dessus du gouffre. Vous ressortez ensuite à la lumière pour continuer librement autour de Velika
      dolina. Le parcours guidé complet totalise 5 km avec un millier de marches ; la sortie intermédiaire de
      Velika dolina propose 3 km et entre 500 et 800 marches. De janvier à avril et d'octobre à décembre, la
      visite s'achève par Velika dolina. Les prises de vue et les animaux de compagnie sont interdits sous
      terre.


      À l'extérieur, un sentier pédagogique contourne les deux dolines sur environ deux kilomètres en moins
      d'une heure, offrant de superbes échappées sur les murailles et l'engouffrement de la Reka. Il commence
      et finit devant le centre d'information de Matavun, point de billetterie. Les expositions de la ferme
      Delez présentent la géologie et la biodiversité du Karst classique et n'ouvrent qu'en haute saison, de
      juin à septembre.


      Si vous arrivez par le train, un sentier balisé d'environ 4 kilomètres relie la gare de Divača au site
      en 50 minutes environ.
    history: >-
      L'importance culturelle et spirituelle du lieu est considérable. Dans le gouffre de Mušja jama se
      déroulaient des sacrifices votifs à la fin de l'âge du bronze : les fouilles ont mis au jour armes
      brisées et ossements animaux calcinés. Ces découvertes attestent que les hommes affluaient vers ce
      sanctuaire depuis des centaines de kilomètres, venus d'Italie, des Alpes, de Pannonie, des Balkans et
      jusqu'en Grèce. Dans la grotte Skeletna a été mise au jour une inscription en caractères vénètes
      archaïques, le texte le plus ancien identifié en Slovénie.


      En 1689, Johann Weikhard von Valvasor décrivit la perte de la Reka et son cours souterrain ; les
      explorations méthodiques débutèrent avec l'expédition de 1884, et le registre des visiteurs fut ouvert
      le 1 janvier 1819. Les habitants de Škocjan et de Matavun ont taillé près de 12 000 mètres de sentiers
      et passerelles dans la roche, le double du développement souterrain naturel. Les vocables scientifiques
      « karst » et « doline » sont nés en ces lieux.


      Les grottes constituent le seul bien naturel de Slovénie et du Karst classique inscrit sur la liste de
      l'UNESCO. Le parc régional a été créé par la loi en 1996 et les cavités sont inscrites comme zone humide
      Ramsar depuis le 18 mai 1999 pour leur faune cavernicole hautement spécialisée.
    before: >-
      La visite des cavités s'effectue obligatoirement en visite guidée et par créneaux horaires ; vérifiez
      les horaires et disponibilités au préalable. Le site est fermé le 1 janvier et le 25 décembre. Prévoyez
      des chaussures de marche et des vêtements chauds, ainsi qu'un chapeau et un parapluie pour la portion de
      sentier en surface.
    around: >-
      À proximité immédiate de Škocjan, à 0 km, s'étendent les [grottes de Postojna et le Karst classique
      (système Postojna-Planina)](/lugar/postonjska-jama---planinsko-polje/). À environ 12 km se dresse le
      [Plateau karstique de Nanos](/lugar/kraska-planota-nanos/) ; à seize kilomètres, les [Forêts et plateau
      karstique de Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) ; à dix-neuf, le [Massif
      forestier de Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), berceau de la Reka ; à vingt-sept,
      le [lac de Cerknica](/lugar/cerknisko-jezero/), et à vingt-huit le [Plateau forestier de
      Trnovo](/lugar/trnovski-gozd/).


      Plus loin, les [Vallées karstiques de Prosiecka et
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) partagent avec Škocjan reliefs calcaires,
      défilés, corridors fluviaux et grand murin.
  de:
    intro: >-
      Ein ganzer Fluss stürzt in das Gebirge und bleibt über Kilometer verschwunden. Bei Škocjan strömt die
      Reka durch eine Schlucht von rund vier Kilometern Länge, prallt gegen eine Felswand und versinkt am
      Grund einer riesigen Einsturzdoline in den Tiefen des Karstes. Was folgt, ist ein unterirdischer Canyon
      von aussergewöhnlichen Dimensionen, der die Höhlen von Škocjan zu den berühmtesten Höhlensystemen der
      Erde zählt. Seit 1986 stehen sie auf der UNESCO-Welterbeliste und sind als Ramsar-Feuchtgebiet
      anerkannt; der umgebende Regionalpark schützt sie eingebettet in eine Karstlandschaft, die ein
      Freilichtmuseum für sich bildet.
    landscape: >-
      Die Reka hat alles geschaffen. Sie entspringt unter dem Snežnik-Plateau und fliesst über rund
      fünfundfünfzig Kilometer oberirdisch über wasserundurchlässigen Flysch, wo sie ihre Wassermassen
      sammelt. Beim Auftreffen auf Kalksteine der Kreidezeit und des Paläozäns sinkt sie in den Untergrund.
      Fortan vertieft der Fluss sein Bett nicht nur mechanisch durch Erosion, sondern löst das Gestein
      chemisch auf. Vor seinem Verschwinden durchbricht er eine Schlucht von rund vier Kilometern, die an
      einer mächtigen Wand endet: das grösste Blindtal Sloweniens.


      Durch den Einsturz der Höhlendecke bildeten sich zwei gewaltige Einsturzdolinen: Velika dolina mit bis
      zu 165 m Tiefe und Mala dolina mit 120 m, getrennt durch eine Naturbrücke als Rest des ursprünglichen
      Deckengewölbes. Hier liegen die Höhleneingänge. Im Berginneren folgt die Schlucht dem Hanke-Kanal und
      weitet sich zu riesigen Hallen, darunter die Martel-Halle mit 2,2 Millionen m³ Rauminhalt. Das Problem
      liegt am Ausgang: Ein Canyon dieser Grössenordnung mündet in einen engen Siphon, der bei Starkregen die
      Fluten nicht fassen kann. Die Reka staut sich im Höhleninneren auf, typischerweise bis zu 30 Meter hoch;
      das höchste je gemessene Hochwasser erreichte einen Anstieg von 132 Metern.


      Das Kleinklima der Einsturzdolinen bildet ein Rückzugsgebiet von besonderem Rang. Alpine Pflanzen wie
      das Aurikel wachsen unmittelbar neben mediterranen Arten wie dem Frauenhaarfarn, ein biogeografisches
      Zusammentreffen von ausserordentlicher Seltenheit. Die Eiszeitrelikte konzentrieren sich am feuchtkühlen
      Grund über dem Schluckloch der Reka; etwa 40 Meter höher, am Felsüberhang der Schmidl-Höhle, gedeihen
      wärmeliebende Reliktarten wie wilder Spargel und Stech-Wacholder.
    wildlife: >-
      Oberirdisch fallen sofort die Felsentauben auf, die in Schwärmen die Portale umkreisen, während eine
      Kolonie des Alpenseglers Felsspalten bewohnt. Die Steilwände bieten [Uhu](/especie/bubo_bubo/) und
      [Wanderfalke](/especie/falco_peregrinus/) Brutplätze, und im Winter rastet an den überhängenden
      Felswänden der [Mauerläufer](/especie/tichodroma_muraria/), ein Gebirgsvogel, der Spalten nach Spinnen
      und Kleintieren absucht. Siebenschläfer besiedeln Höhleneingänge und Baumkronen; Fuchs und Dachs
      bewohnen die Hänge der Reka-Schlucht.


      Unter Tage herrschen gänzlich andere Lebensbedingungen: Es gibt weder Sommer noch Winter, die Temperatur
      bleibt konstant und troglobionte Landtiere sind winzig und messen selten mehr als einen Zentimeter. Im
      unterirdischen Flusssystem herrscht der [Grottenolm](/especie/proteus_anguinus/), ein aquatischer Riese
      unter den Höhlentieren mit über 20 Zentimetern Länge. Er wurde 1758 wissenschaftlich beschrieben,
      gefolgt vom blinden Höhlenkäfer *Leptodirus hochenwartii* im Jahr 1832 – die ersten beiden
      wissenschaftlich erfassten echten Höhlentiere weltweit. Unter den Fledermäusen stellt die
      Langflügelfledermaus die grösste Kolonie, die zwischen Škocjan und Predjama wandert.
    visit: >-
      Die Führung startet am Besucherzentrum, von wo Ranger die Gruppe zu Fuss zur Globočak-Doline führen, wo
      sich der Höhleneingang befindet. Ein künstlicher Stollen führt in die Tiha jama (Stille Höhle), einen
      trockenen fossilen Gang reich an Tropfsteinen; ihre Velika dvorana birgt den Riesenstalagmiten Orjak.
      Von dort gelangt man in die Šumeča jama (Rauschende Höhle), wo das Tosen der Reka ertönt und man auf der
      Cerkvenik-Brücke eine der tiefsten unterirdischen Schluchten Europas überquert. Anschliessend trittst du
      ans Tageslicht und setzt den Weg eigenständig um die Velika dolina fort. Die Gesamttour misst 5 km mit
      rund tausend Stufen; die verkürzte Route an der Velika dolina umfasst 3 km und zwischen 500 und 800
      Stufen. Von Januar bis April sowie von Oktober bis Dezember endet die Tour an der Velika dolina.
      Fotografieren und Haustiere sind in der Höhle untersagt.


      Ausserhalb der Höhle umrundet ein Naturlehrpfad die beiden Dolinen auf etwa zwei Kilometern Länge in
      unter einer Stunde und bietet Blicke auf Felswände und die versinkende Reka. Er beginnt und endet am
      Informationszentrum Matavun. Die Ausstellungen im Delez-Gehöft widmen sich Geologie und Karstbiologie
      und sind nur in der Hauptsaison von Juni bis September geöffnet.


      Bei Anreise mit der Bahn führt ein markierter Wanderweg von rund 4 Kilometern Länge vom Bahnhof Divača
      in etwa 50 Minuten zum Höhlenpark.
    history: >-
      Die menschliche Bedeutung des Ortes reicht tief in die Vergangenheit. Im Schlund der Mušja jama fanden
      am Ende der Bronzezeit Kulthandlungen und Tieropfer statt: Archäologen bargen zerbrochene Waffen und
      verbrannte Tierknochen. Die Funde belegen, dass Menschen aus Hunderten Kilometern Entfernung hierher
      pilgerten – aus Norditalien, den Alpen, Pannonien, dem Balkan und bis aus Griechenland. In der
      Skeletna-Höhle fand sich eine venetische Inschrift, das älteste Schriftzeugnis Sloweniens.


      1689 beschrieb Valvasor die Versickerung der Reka; die systematische Erforschung begann 1884, und das
      Gästebuch wurde am 1. Januar 1819 eröffnet. Einheimische aus Škocjan und Matavun meisselten fast 12.000
      Meter Steige in den Fels – die doppelte Gesamtlänge des Höhlensystems. Die Fachbegriffe 'Karst' und
      'Doline' nahmen hier ihren Ursprung.


      Die Höhlen sind das einzige UNESCO-Weltnaturerbe im klassischen Karst Sloweniens. Der Regionalpark wurde
      1996 gesetzlich begründet, und seit dem 18. Mai 1999 sind die Höhlen als Ramsar-Schutzgebiet für ihre
      endemische Höhlenfauna ausgewiesen.
    before: >-
      Der Höhlenbesuch ist nur im Rahmen geführter Gruppen mit festen Einlasszeiten möglich; prüfe Termine und
      Plätze im Voraus. Die Höhlen bleiben am 1. Januar und 25. Dezember geschlossen. Bequeme Schuhe, warme
      Kleidung sowie Kopfbedeckung und Regenschirm für den Aussenweg sind erforderlich.
    around: >-
      Unmittelbar angrenzend, bei 0 km, liegen die [Höhlen von Postojna und der Klassische Karst
      (Postojna-Planina-Höhlensystem)](/lugar/postonjska-jama---planinsko-polje/). Rund 12 km entfernt erhebt
      sich das [Nanos-Karstplateau](/lugar/kraska-planota-nanos/); in sechzehn Kilometern Entfernung die
      [Wälder und Karsthochfläche von Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); in
      neunzehn das [Snežnik-Waldmassiv](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), wo die Reka
      entspringt; in siebenundzwanzig der [Zirknitzer See](/lugar/cerknisko-jezero/) und in achtundzwanzig das
      [Trnovo-Waldplateau](/lugar/trnovski-gozd/).


      Weiter entfernt teilen die [Karsttäler Prosiecka und Kvačianska
      dolina](/lugar/npr-kvacianska-a-prosiecka-dolina/) mit Škocjan Karstschluchten, Flusskorridore und das
      Grosse Mausohr.
  it:
    intro: >-
      Un intero fiume penetra nella montagna e sparisce nelle viscere della terra per chilometri. A Škocjan,
      la Reka giunge attraverso una forra di circa quattro chilometri, sbatte contro una parete strapiombante
      e scompare sul fondo di un'immensa dolina di crollo. Ciò che segue è una forra ipogea dalle dimensioni
      straordinarie, che colloca le grotte di Škocjan tra i fenomeni sotterranei più celebri al mondo.
      Iscritte nel Patrimonio Mondiale UNESCO dal 1986 e riconosciute zona umida Ramsar, sono tutelate
      all'interno di un parco regionale che custodisce un paesaggio carsico che è, di per sé, un museo a cielo
      aperto.
    landscape: >-
      Tutto è stato plasmato dalla Reka. Nata ai piedi dell'altopiano dello Snežnik, scorre per circa
      cinquantacinque chilometri in superficie su rocce impermeabili di flysch, raccogliendo le acque prima di
      toccare i calcari del Cretaceo e del Paleocene dove si inabissa. Da quel momento il corso d'acqua non
      solo incide l'alveo per erosione, ma dissolve chimicamente la roccia. Prima di scomparire percorre una
      gola di circa quattro chilometri che si arresta contro una muraglia verticale: la più ampia valle cieca
      della Slovenia.


      Il collasso della volta rocciosa ha generato due profonde doline di sprofondamento: la Velika dolina,
      con una profondità fino a 165 m, e la Mala dolina a 120 m, separate da un ponte naturale superstite del
      soffitto primordiale. Qui si aprono gli imbocchi. All'interno, il canyon continua lungo il canale di
      Hanke allargandosi in sale colossali, tra cui la sala Martel con 2,2 milioni di m³. Il nodo critico è
      l'uscita: una gola di tali dimensioni sfocia in uno stretto sifone che non riesce a smaltire le piene
      dopo piogge torrenziali. La Reka monta all'interno della cavità, crescendo normalmente fino a 30 metri;
      la massima piena documentata ha fatto registrare un'incredibile risalita di 132 metri.


      Il microclima delle doline ospita una flora eccezionale. Piante alpine come l'orecchia d'orso vegetano a
      fianco di essenze mediterranee come il capelvenere, un'associazione di straordinaria rarità
      biogeografica. I relitti glaciali prosperano sul fondo, a ridosso dell'inghiottitoio della Reka; circa
      40 metri più in alto, sotto il tetto d'ingresso della sala Schmidl, mettono radici specie termofile
      relitte come l'asparago selvatico e il ginepro fenicio.
    wildlife: >-
      In superficie, la prima presenza è costituita dai piccioni selvatici che volteggiano in stormi e
      nidificano sotto le arcate di roccia, mentre una colonia di rondoni maggiori frequenta le fessure. I
      balzi rocciosi offrono asilo al [gufo reale](/especie/bubo_bubo/) e al [falco
      pellegrino](/especie/falco_peregrinus/), mentre nella stagione fredda le pareti a strapiombo accolgono
      il [picchio muraiolo](/especie/tichodroma_muraria/), uccello d'alta quota che cerca ragni e insetti
      negli anfratti. I ghiri occupano caverne e chiome arboree; la volpe e il tasso perlustrano i pendii
      boscosi della gola della Reka.


      Nelle profondità della terra i ritmi ecologici sono completamente diversi: né estate né inverno,
      temperatura perennemente costante e organismi cavernicoli terrestri minuscoli, che raramente superano il
      centimetro. Nelle acque ipogee il sovrano incontrastato è il [proteo](/especie/proteus_anguinus/),
      gigante del mondo sotterraneo lungo oltre 20 centimetri. Venne descritto scientificamente nel 1758,
      seguito dal coleottero cieco *Leptodirus hochenwartii* nel 1832, primi troglobi catalogati dalla scienza
      moderna. Tra i chirotteri, la colonia più folta appartiene al miniottero, che compie migrazioni
      stagionali fra Škocjan e Predjama.
    visit: >-
      L'itinerario guidato parte dal centro accoglienza, da dove le guide accompagnano a piedi verso la dolina
      Globočak dove si trova l'imbocco. Una galleria artificiale conduce a Tiha jama (Grotta Silenziosa),
      cavità fossile asciutta colma di formazioni calcaree; la sua Velika dvorana racchiude Orjak, una delle
      stalagmiti più maestose del complesso. Si passa quindi in Šumeča jama (Grotta Rumorosa), dove risuona il
      rombo della Reka e si valica una delle forre sotterranee più alte d'Europa sul ponte Cerkvenik. Si
      ritorna all'aperto proseguendo in autonomia attorno alla Velika dolina. L'escursione completa è di 5 km
      con circa mille gradini; l'uscita anticipata alla Velika dolina riduce a 3 km con un numero di gradini
      tra 500 e 800. Da gennaio ad aprile e da ottobre a dicembre la visita si chiude presso la Velika dolina.
      All'interno sono vietate fotografie e animali domestici.


      In superficie, un sentiero didattico circonda entrambe le doline su circa due chilometri in meno di
      un'ora, offrendo scorci sulle falesie e sull'inghiottitoio. Inizia e termina davanti al Centro
      Informazioni di Matavun, dove si acquistano i biglietti. Le esposizioni del borgo rurale Delez
      illustrano geologia e biodiversità del Carso e aprono soltanto in alta stagione da giugno a settembre.


      Se arrivi in treno, dalla stazione di Divača parte un sentiero segnalato di circa 4 chilometri
      percorribile in 50 minuti.
    history: >-
      L'importanza sacrale e antropologica del sito affonda nella protostoria. Nella voragine di Mušja jama si
      celebravano sacrifici rituali alle divinità sul finire dell'Età del Bronzo: gli scavi hanno recuperato
      armi spezzate e ossa di animali bruciate. Le testimonianze indicano pellegrinaggi verso questo santuario
      da centinaia di chilometri, da Italia, Alpi, Pannonia, Balcani e Grecia. Nella grotta Skeletna è stata
      rinvenuta un'iscrizione in caratteri venetici arcaici, la più antica testimonianza scritta della
      Slovenia.


      Nel 1689 Valvasor descrisse l'inghiottitoio e il corso sotterraneo della Reka; le esplorazioni
      sistematiche partirono con la spedizione del 1884, mentre il libro degli ospiti venne aperto il 1
      gennaio 1819. Gli abitanti di Škocjan e Matavun scavarono quasi 12.000 metri di passaggi nella roccia
      viva, il doppio dello sviluppo ipogeo. I termini scientifici «carso» e «dolina» sono nati qui.


      Le grotte sono l'unico bene naturale della Slovenia e del Carso classico iscritto nella lista UNESCO. Il
      parco regionale è nato per legge nel 1996 e le grotte sono zona umida Ramsar per la fauna sotterranea
      endemica dal 18 maggio 1999.
    before: >-
      L'accesso alle grotte avviene unicamente tramite visita guidata con orari prestabiliti; verifica gli
      orari e la disponibilità con anticipo. Il sito è chiuso il 1 gennaio e il 25 dicembre. Indossa scarpe
      comode e abiti pesanti, portando cappello e ombrello per il tratto all'aperto.
    around: >-
      Aderenti a Škocjan, a 0 km, si trovano le [grotte di Postumia e il Carso Classico (Sistema
      Postumia-Planina)](/lugar/postonjska-jama---planinsko-polje/). A circa 12 km si innalza l'[Altopiano
      Carsico del Nanos](/lugar/kraska-planota-nanos/); a sedici chilometri, i [Boschi e Altopiano Carsico di
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); a diciannove, il [Massiccio Forestale
      dello Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), dove sgorga la Reka; a ventisette, il
      [lago di Cerknica](/lugar/cerknisko-jezero/), e a ventotto l'[Altopiano Forestale di
      Trnovo](/lugar/trnovski-gozd/).


      Più lontane, le [Valli Carsiche di Prosiecka e Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/)
      condividono con Škocjan formazioni carsiche, canyon, vie d'acqua e il vespertilio maggiore.
  pt:
    intro: >-
      Um rio volumoso penetra na montanha e desaparece durante quilómetros. Em Škocjan, o Reka desce por uma
      garganta de cerca de quatro quilómetros, choca contra uma muralha calcária e esvai-se no subsolo no
      fundo de uma enorme dolina de colapso. O que se segue é um desfiladeiro subterrâneo de proporções
      monumentais, que inscreve as grutas de Škocjan entre os fenómenos espeleológicos mais célebres do mundo.
      Declaradas Património Mundial da UNESCO em 1986 e sítio Ramsar, o parque regional em seu redor
      protege-as num mosaico cárstico que constitui, por si só, um museu a céu aberto.
    landscape: >-
      Toda a paisagem resultou da força do Reka. Nascendo sob o planalto de Snežnik, percorre cerca de
      cinquenta e cinco quilómetros à superfície sobre formações de flysch impermeável onde condensa as águas.
      Ao encontrar as bancadas calcárias do Cretácico e do Paleoceno, afunda-se na rocha. A partir daqui, o
      rio não só aprofunda o leito por desgaste mecânico, como corrói quimicamente a pedra. Antes do sumidouro
      atravessa uma garganta de cerca de quatro quilómetros que expira contra uma escarpa aprumada: o maior
      vale cego da Eslovénia.


      O abatimento da abóbada gerou duas dolinas de colapso colossais: Velika dolina, descendo a 165 m de
      profundidade, e Mala dolina, com 120 m, separadas por uma ponte natural que testemunha o teto primitivo.
      É aí que se situam as entradas. No interior, o canhão prossegue pelo canal de Hanke e rasga-se em salas
      titânicas, com destaque para a sala Martel com 2,2 milhões de m³. O ponto crítico é a saída: um
      desfiladeiro deste porte culmina num sifão estreito incapaz de escoar cheias torrenciais. O Reka sobe no
      interior da gruta, habitualmente até 30 metros; a maior subida alguma vez registada atingiu 132 metros.


      O microclima das dolinas encerra um refúgio botânico singular. Coabitam plantas alpinas como a
      orelha-de-urso e essências mediterrânicas como o avencão, uma simbiose de extrema raridade
      biogeográfica. Os endemismos e relíquias glaciares concentram-se no fundo, sobre o sumidouro do Reka;
      cerca de 40 metros acima, no teto da entrada da caverna Schmidl, fixam-se relíquias termófilas como o
      espargo-bravo e o zimbro-galego.
    wildlife: >-
      À superfície, a primeira impressão deve-se aos pombos-bravos que volteiam em bandos pelas arcadas,
      enquanto o andorinhão-real nidifica nas fraturas da pedra. As escarpas verticais abrigam o
      [bufo-real](/especie/bubo_bubo/) e o [falcão-peregrino](/especie/falco_peregrinus/), recebendo no
      inverno o [trepador-dos-muros](/especie/tichodroma_muraria/), ave alpina que rebusca aranhas nas fendas.
      Os arganazes povoam grutas e copas; a raposa e o texugo deambulam pelas encostas da garganta do Reka.


      No mundo subterrâneo as leis vitais transformam-se: sem alternância de estações, a temperatura é estável
      e a fauna terrestre cavernosa é minúscula, raramente superando um centímetro. No meio aquático reina o
      [proteu](/especie/proteus_anguinus/), um gigante das cavernas com mais de 20 centímetros de comprimento.
      Foi descrito em 1758, surgindo em 1832 a descrição do escaravelho cego *Leptodirus hochenwartii*, as
      primeiras espécies troglóbias reconhecidas pela ciência. Entre os morcegos destaca-se o
      morcego-de-peluche, com colónias que migram sazonalmente entre Škocjan e Predjama.
    visit: >-
      O percurso guiado tem início no centro de visitantes, partindo os grupos a pé com os guardas até à
      dolina de Globočak, onde se situa o acesso. Uma galeria artificial conduz a Tiha jama (Gruta
      Silenciosa), galeria fóssil seca rica em espeleotemas cuja Velika dvorana alberga Orjak (o Gigante), uma
      das maiores estalagmites do sistema. Daí passa-se a Šumeča jama (Gruta Ruidosa), onde o ribombar das
      águas do Reka ecoa sob a ponte Cerkvenik, cruzando um dos desfiladeiros subterrâneos mais fundos da
      Europa. A saída faz-se para a luz do dia contornando livremente a Velika dolina. O circuito guiado
      integral estende-se por 5 km com cerca de mil degraus; a opção abreviada na Velika dolina fixa-se em 3
      km e entre 500 e 800 degraus. De janeiro a abril e de outubro a dezembro o itinerário encerra na Velika
      dolina. Não são permitidas fotografias nem animais no interior.


      No exterior, um percurso de interpretação envolve as duas dolinas ao longo de cerca de dois quilómetros
      em menos de uma hora, oferecendo panorâmicas sobre as escarpas e o sumidouro. Começa e conclui-se diante
      do Centro de Informações de Matavun, local de compra de bilhetes. O núcleo museológico de Delez aborda a
      geologia e fauna do Carso clássico, funcionando apenas de junho a setembro.


      Se viajares de comboio, da estação de Divača parte um trilho assinalado com cerca de 4 quilómetros
      realizável em 50 minutos.
    history: >-
      A dimensão antropológica e espiritual do abismo é milenar. No poço de Mušja jama consumavam-se oferendas
      rituais aos deuses no final da Idade do Bronze: as campanhas arqueológicas revelaram armas partidas e
      ossadas de animais calcinadas. As provas demonstram peregrinações com origem a centenas de quilómetros,
      de Itália, dos Alpes, da Panónia, dos Balcãs e até da Grécia. Na gruta Skeletna recolheu-se uma
      inscrição em escrita véneta arcaica, o texto epigráfico mais remoto descoberto na Eslovénia.


      Em 1689, Valvasor documentou o sumidouro do Reka e o percurso subterrâneo; o desbravamento científico
      iniciou-se em 1884, abrindo-se o livro de visitas em 1 de janeiro de 1819. Os habitantes de Škocjan e
      Matavun esculpiram quase 12.000 metros de caminhos e passadiços nas bancadas de rocha, o dobro da
      extensão natural da cavidade. Os conceitos geológicos de «carso» e «dolina» foram cunhados neste lugar.


      Trata-se do único monumento natural da Eslovénia e do Carso clássico sob chancela da UNESCO. O parque
      regional foi criado por diploma em 1996 e as grutas foram classificadas sítio Ramsar devido à fauna
      cavernícola endémica em 18 de maio de 1999.
    before: >-
      A entrada nas grutas processa-se unicamente mediante visitas acompanhadas com horários rígidos; verifica
      as sessões e a disponibilidade com antecedência. O espaço encerra em 1 de janeiro e 25 de dezembro. Leva
      calçado de caminhada e agasalho, bem como chapéu e guarda-chuva para a extensão percorrida à superfície.
    around: >-
      Contíguas a Škocjan, a 0 km, estendem-se as [grutas de Postojna e o Carso Clássico (Sistema
      Postojna-Planina)](/lugar/postonjska-jama---planinsko-polje/). A cerca de 12 km ergue-se o [Planalto
      Cárstico de Nanos](/lugar/kraska-planota-nanos/); a dezasseis quilómetros, as [Florestas e Planalto
      Cárstico de Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); a dezanove, o [Maciço
      Florestal de Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), onde brota o Reka; a vinte e sete,
      o [lago de Cerknica](/lugar/cerknisko-jezero/), e a vinte e oito o [Planalto Florestal de
      Trnovo](/lugar/trnovski-gozd/).


      Mais distantes, os [Vales Cársticos de Prosiecka e
      Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) partilham com Škocjan formações cársticas,
      desfiladeiros, cursos de água e o morcego-rato-grande.
