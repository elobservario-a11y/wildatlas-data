    Hace 25.000 años el hielo cubría el 95 % de este macizo; hoy queda menos de un 1 %, y lo que ves es la
    huella de aquella gran glaciación.
  en: >-
    More than 25,000 hectares of high alpine wilderness where 95 % of the territory is strict nature reserve
    (IUCN Category 1).
  fr: >-
    Plus de 25 000 hectares de haute montagne sauvage où 95 % du territoire relève d'une réserve naturelle
    intégrale (Catégorie 1 de l'UICN).
  de: >-
    Mehr als 25.000 Hektar hochalpine Wildnis, in der 95 % des Gebiets streng geschützte Kernzone sind
