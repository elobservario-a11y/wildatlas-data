resumen:
  es: Grupo alpino afilado de más de 30 cumbres de 3.000 m con circo glaciares aislados sin remontes de esquí.
  en: Heart of high alpine rock and silence with 30 summits above 3,000 m and no cable cars in the Eastern Alps.
  fr: >-
    Cœur de haute montagne rocheuse et de silence avec 30 sommets de plus de 3 000 m sans aucune remontée
    mécanique dans les Alpes orientales.
  de: Herz aus hochalpinem Fels und Stille mit 30 Gipfeln über 3.000 m und ohne Bergbahnen in den Ostalpen.
  it: >-
    Cuore di roccia d'alta quota e silenzio con 30 cime oltre i 3.000 m e nessun impianto di risalita nelle
    Alpi Orientali.
  pt: Coração de rocha alpina e silêncio com 30 cumes acima de 3.000 m e sem teleféricos nos Alpes Orientais.
