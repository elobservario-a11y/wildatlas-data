resumen:
  es: Reserva de 1.200 ha a las puertas de la Camarga que alberga las 9 especies de garzas europeas.
  en: A 1,200 ha nature reserve on the threshold of the Camargue hosting all 9 European heron and egret species.
  fr: >-
    Réserve de 1 200 ha aux portes de la Camargue accueillant les 9 espèces de hérons et aigrettes
    européennes.
  de: >-
    Ein 1.200 ha großes Schutzgebiet am Tor zur Camargue, in dem alle 9 europäischen Reiherarten heimisch
    sind.
  it: >-
    Riserva di 1.200 ettari alle porte della Camargue che ospita tutte le 9 specie di aironi e garzette
    europee.
  pt: Reserva de 1.200 ha às portas da Camarga que alberga as 9 espécies de garças e garçotes europeus.
unico:
  es: >-
    Es la reserva natural francesa con más avetoros comunes, entre el 17 y el 20 % de los que hay en el país,
    escondidos en un carrizal tan pequeño que apenas se ve desde fuera.
  en: >-
    France's premier stronghold for Eurasian bitterns, sheltering between 17 and 20 % of the national breeding
    population in reedbeds barely visible from outside.
  fr: >-
    La réserve naturelle française la plus riche en butors étoilés, abritant entre 17 et 20 % de la population
    nationale dans une roselière invisible de l'extérieur.
  de: >-
    Frankreichs bedeutendstes Reservat für die Rohrdommel, das zwischen 17 und 20 % des nationalen Bestands in
    dichtem Röhricht birgt.
  it: >-
    La riserva francese con la maggiore concentrazione di tarabusi, tra il 17 e il 20 % della popolazione
    nazionale, celati in un canneto invisibile dall'esterno.
  pt: >-
    A reserva natural francesa com mais abetouros-comuns, albergando entre 17 e 20 % da população nacional,
    camuflados num caniçal invisível do exterior.
observaciones:
  es: >-
    El corazón de la reserva solo se visita con guía, así que comprueba antes de ir el calendario y si hay
    plazas. Lleva calzado de marcha, ropa para el tiempo que haga y prismáticos.
texto:
  es:
    intro: >-
      Nueve especies de garzas, y las nueve crían o viven aquí. Los Marais du Vigueirat son 1.200 hectáreas de
      marisma, carrizal y canal entre el delta del Ródano y la llanura de la Crau, una de las mayores
      propiedades del Conservatoire du littoral en la Camarga. Lo cogestionan la LPO Francia y la LPO
      Provence-Alpes-Côte d'Azur, y lo que se ve desde sus pasarelas es una Camarga trabajada: toros, caballos
      y aves que comparten el mismo agua.
    landscape: >-
      Aquí el agua manda. Hay marismas permanentes y temporales, canales, roubines, lagunas y las sansouïres,
      los suelos salados donde crecen la sosa leñosa, las salicornias y las saladelles. La reserva incluye el
      mayor carrizal protegido de la Camarga.


      La flora cuenta más de lo que parece: se han registrado 909 especies de plantas, hongos y líquenes, con
      más de 600 plantas vasculares, 41 de ellas protegidas o de interés patrimonial. En primavera, junto a
      los senderos, florece la nivéola de verano, de flores blancas en forma de campanilla. Y el pequeño
      nenúfar, que se creía desaparecido de la Camarga, volvió a aparecer en el canal del Vigueirat, la única
      estación conocida del delta.
    wildlife: >-
      Más de 310 especies de aves se han registrado en la reserva. Las garzas son el emblema: la garcilla
      cangrejera cría en los tamarices, y la garceta grande y la [garza imperial](/especie/ardea_purpurea/)
      anidan en los grandes carrizales. El [avetoro común](/especie/botaurus_stellaris/) se confunde con el
      carrizal, y en primavera se organizan salidas temáticas para conocerlo.


      Cada estación trae algo distinto. En los espacios abiertos viven abejarucos, carracas y
      [alcaravanes](/especie/burhinus_oedicnemus/); entre las rapaces hay muchos [aguiluchos
      laguneros](/especie/circus_aeruginosus/) y, cada vez más raras, el águila moteada, el [águila de
      Bonelli](/especie/aquila_fasciata/) y el [águila pescadora](/especie/pandion_haliaetus/). En invierno es
      un sitio mayor de invernada para anátidas y rállidos, y desde 2018 acoge a buena parte de las [grullas
      comunes](/especie/grus_grus/) que pasan el invierno en la región. Entre 80 y 100 parejas de charrán
      común crían en los islotes y balsas que la reserva montó para compensar la pérdida de sitios naturales
      de nidificación del litoral, dentro del proyecto LIFE+ENVOLL.


      Entre los mamíferos, los más visibles son las cinco manadas de toros y caballos camargueses, que pastan
      de finales de marzo a mediados de diciembre y hacen de cortacésped ecológico. De vez en cuando dejan
      rastro la [nutria](/especie/lutra_lutra/) o el [castor](/especie/castor_fiber/). Los murciélagos usan la
      reserva para cazar o criar, y el sendero Homme et Nature tiene una cabaña dedicada a ellos. La ranita
      meridional es el anfibio más fácil de ver, y la [galápaga europea](/especie/emys_orbicularis/), el
      reptil emblemático, se calienta al sol junto a los roubines del sendero de las Cabanes. La [anguila
      europea](/especie/anguilla_anguilla/), amenazada, usa estas aguas para crecer antes de partir hacia el
      mar de los Sargazos.
    visit: >-
      Hay dos maneras de entrar, y son distintas. Los senderos de l'Étourneau, de visita libre, suman cerca de
      seis kilómetros de recorridos temáticos autoguiados. El de las Cabanes es una pasarela de medio
      kilómetro sobre pilotes con ocho cabañas interactivas, pensada para familias; el de la Palunette recorre
      unos dos kilómetros junto al canal del Vigueirat, con dos observatorios y una plataforma elevada; el
      Homme et Nature, inaugurado en la primavera de 2022, suma casi 2 km sobre los paisajes de la Camarga y
      la relación entre el ser humano y la naturaleza; y el jardín etnobotánico muestra cinco ambientes
      camargueses y los usos alimentarios, medicinales, textiles y tintóreos de sus plantas.


      El corazón de la reserva, en cambio, solo se visita con guía naturalista. La salida sale de la entrada
      en minibús eléctrico, dura dos horas y media y supone unos 700 m a pie de ida y vuelta hasta los
      observatorios. Para más tiempo, hay una caminata guiada de día completo de 5 km por marismas, estanques
      y sansouïres que cruza el mayor carrizal protegido de la Camarga, y salidas temáticas según la estación.


      Llegar en bicicleta es posible: desde el puente Van Gogh de Arlés, la ViaRhôna cubre 16 km hasta
      Mas-Thibert, y una extensión de unos 5 km lleva a la entrada. También hay autobús, la línea 703
      Arlés-Port Saint Louis du Rhône, hasta Mas-Thibert, a unos 3,5 km de la reserva.
    history: >-
      La gestión combina pastoreo, islotes artificiales para las aves coloniales y la lucha contra las plantas
      exóticas invasoras: hay 13 especies, entre ellas las jussias, el bacarís y la hierba de la pampa, y las
      jussias se arrancan porque ahogan al resto de plantas acuáticas.
    before: >-
      El corazón de la reserva solo se visita con guía, así que comprueba antes de ir el calendario y si hay
      plazas. Lleva calzado de marcha, ropa para el tiempo que haga y prismáticos.
    around: >-
      A unos 5 km está la [Réserve Naturelle Nationale de la Coussoul de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/), en la llanura de la Crau. Y lejos de
      aquí, con la garza imperial como nexo, se parece a [Laguna di Venezia](/lugar/laguna-di-venezia/) y al
      [Parc Natural del Delta de l'Ebre](/lugar/parc-natural-del-delta-de-l-ebre/), que comparten con él la
      garza imperial y el flamenco.
  en:
    intro: >-
      Nine species of herons and egrets, and all nine breed or dwell here. The Marais du Vigueirat encompass
      1,200 hectares of floodplain marsh, reedbeds, and canals between the Grand Rhône delta and the stony
      Crau plain, representing one of the Conservatoire du littoral's largest protected holdings in the
      Camargue. Co-managed by LPO France and LPO PACA, the view from its boardwalks reveals a living Camargue:
      fighting bulls, semi-wild horses, and wetland avifauna sharing the same waters.
    landscape: >-
      Water governs every aspect of the landscape. The reserve protects permanent and seasonal freshwater
      marshes, canals, drainage ditches (roubines), lagoons, and saline sansouïres carpeted with shrubby
      seablite, glassworts, and sea lavender. It preserves the Camargue's largest protected continuous
      reedbed.


      The botanical richness is remarkable: scientists have recorded 909 species of plants, fungi, and
      lichens, including over 600 vascular plants, 41 of which hold protected or heritage conservation status.
      In spring, delicate bell-shaped blossoms of summer snowflake line the wet footpaths. Furthermore, the
      yellow water-lily, once feared extinct in the Camargue, was rediscovered thriving in the Vigueirat
      canal, its sole known station across the delta.
    wildlife: >-
      More than 310 bird species have been recorded in the reserve. Herons serve as the flagship: squacco
      herons nest in tamarisk thickets, while great white egrets and [purple herons](/especie/ardea_purpurea/)
      colonize the deep reedbeds. The secretive [Eurasian bittern](/especie/botaurus_stellaris/) blends
      invisibly into the reeds, celebrated each spring with themed listening walks.


      Every season brings distinct wildlife encounters. Dry open rangelands host European bee-eaters, European
      rollers, and cryptic [Eurasian stone-curlews](/especie/burhinus_oedicnemus/); raptors feature abundant
      [western marsh harriers](/especie/circus_aeruginosus/) and rarer visitors such as greater spotted
      eagles, [Bonelli's eagles](/especie/aquila_fasciata/), and [ospreys](/especie/pandion_haliaetus/).
      Winter transforms the marshes into a major haven for dabbling ducks and water rails, and since 2018
      large flocks of [common cranes](/especie/grus_grus/) overwinter here. Between 80 and 100 pairs of common
      terns nest on artificial floating rafts deployed under the LIFE+ENVOLL project to compensate for lost
      coastal nesting beaches.


      Among mammals, five herds of Camargue cattle and horses graze freely from late March to mid-December as
      living ecological mowers. Eurasian [otters](/especie/lutra_lutra/) and [beavers](/especie/castor_fiber/)
      leave occasional tracks along waterways. Diverse bats forage across the pools, interpreted in a
      dedicated hut along the Homme et Nature trail. Mediterranean tree frogs are abundant, while the
      [European pond turtle](/especie/emys_orbicularis/) basks on muddy canal banks. Critically endangered
      [European eels](/especie/anguilla_anguilla/) use these productive lagoons to mature before migrating to
      the Sargasso Sea.
    visit: >-
      There are two contrasting ways to discover the reserve. The self-guided Sentiers de l'Étourneau total
      nearly six kilometres of themed trails. The Sentier des Cabanes is a half-kilometre stilted boardwalk
      with eight interactive family nature huts; the Palunette trail extends for some two kilometres beside
      the Vigueirat canal with two hides and an elevated viewing platform; the Homme et Nature trail,
      inaugurated in spring 2022, covers nearly 2 km exploring Camargue pastoral landscapes; and an
      ethnobotanical garden presents five traditional Camargue habitats and the culinary, medicinal, and
      dyeing uses of their plants.


      The protected core reserve, by contrast, is accessible exclusively with an expert naturalist guide.
      Guided tours depart by open-sided electric shuttle, lasting two hours and a half with roughly 700 m of
      walking between observation towers. For thorough exploration, full-day guided walking treks of 5 km
      traverse marshes, lagoons, and sansouïres across the Camargue's largest reedbed.


      Cycling access is straightforward: from the Van Gogh Bridge in Arles, the ViaRhôna trail runs for 16 km
      to Mas-Thibert, where an additional 5 km dedicated link reaches the visitor centre. By public transit,
      regional bus line 703 (Arles to Port-Saint-Louis-du-Rhône) stops at Mas-Thibert, roughly 3.5 km from the
      site.
    history: >-
      Habitat management integrates extensive equine and bovine grazing, colonial nesting rafts, and invasive
      alien weed eradication: 13 alien species are monitored, with water primroses (Ludwigia), groundsel bush
      (Baccharis), and pampas grass actively uprooted to prevent choking of indigenous marsh flora.
    before: >-
      The core nature reserve can only be entered on guided tours, so verify timetables and book in advance.
      Bring sturdy walking footwear, weather-appropriate clothing, and field binoculars.
    around: >-
      Around 5 km away lies the [Réserve Naturelle Nationale des Coussouls de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/) on the steppe plain. Further afield,
      sharing purple herons and flamingoes, the site shares coastal wetland ecology with the [Venice
      Lagoon](/lugar/laguna-di-venezia/) and the [Ebro Delta Natural
      Park](/lugar/parc-natural-del-delta-de-l-ebre/).
  fr:
    intro: >-
      Neuf espèces de hérons et d'aigrettes, et les neuf nichent ou séjournent ici. Les Marais du Vigueirat
      déploient 1 200 hectares de marais, roselières et canaux entre le delta du Grand Rhône et la plaine de
      la Crau, constituant l'une des plus vastes propriétés du Conservatoire du littoral en Camargue. Cogéré
      par la LPO France et la LPO PACA, le site offre depuis ses passerelles le spectacle d'une Camargue
      vivante : taureaux, chevaux et oiseaux partageant le même plan d'eau.
    landscape: >-
      Ici l'eau dicte sa loi. Le domaine alterne marais doux permanents et temporaires, canaux, roubines,
      baisses et sansouïres salées où croissent salicornes, soudes et saladelles. La réserve protège la plus
      vaste roselière d'un seul tenant de Camargue.


      La flore recèle une diversité insoupçonnée : 909 espèces de plantes, champignons et lichens y ont été
      recensées, dont plus de 600 plantes vasculaires et 41 espèces d'intérêt patrimonial. Au printemps
      fleurit le long des chemins la nivéole d'été aux clochettes blanches. Le nénuphar nain, que l'on croyait
      disparu de Camargue, a été redécouvert dans le canal du Vigueirat, son unique station connue dans le
      delta.
    wildlife: >-
      Plus de 310 espèces d'oiseaux fréquentent la réserve. Les ardéidés en sont les emblèmes : le crabier
      chevelu niche dans les tamaris, tandis que grande aigrette et [héron pourpré](/especie/ardea_purpurea/)
      colonisent les grandes roselières. Le discret [butor étoilé](/especie/botaurus_stellaris/) s'y camoufle
      au point de justifier au printemps des sorties d'écoute de son chant grave.


      Chaque saison révèle ses richesses. Dans les milieux ouverts vivent guêpiers, rolliers et [œdicnèmes
      criards](/especie/burhinus_oedicnemus/) ; parmi les rapaces abondent les [busards des
      roseaux](/especie/circus_aeruginosus/), rejoints par l'aigle criard, l'[aigle de
      Bonelli](/especie/aquila_fasciata/) et le [balbuzard pêcheur](/especie/pandion_haliaetus/). L'hiver
      rassemble canards et foulques, et depuis 2018 des dortoirs de [grues cendrées](/especie/grus_grus/) s'y
      établissent. Entre 80 et 100 couples de sternes pierregarins nichent sur les îlots et radeaux
      artificiels aménagés dans le cadre du projet LIFE+ENVOLL.


      Parmi les mammifères dominent cinq manades de taureaux et chevaux de race Camargue, pâturant de fin mars
      à la mi-décembre en tondeuses écologiques. [Loutre d'Europe](/especie/lutra_lutra/) et [castor
      d'Eurasie](/especie/castor_fiber/) laissent leurs empreintes au bord des canaux. Les chauves-souris
      disposent d'une cabane dédiée sur le sentier Homme et Nature. La rainette méridionale coasse le soir
      venu, tandis que la [cistude d'Europe](/especie/emys_orbicularis/) se chauffe au soleil le long des
      roubines. L'[anguille d'Europe](/especie/anguilla_anguilla/), très menacée, croît dans ces lagunes avant
      de rejoindre la mer des Sargasses.
    visit: >-
      Deux modes de découverte complémentaires s'offrent aux visiteurs. Les sentiers de l'Étourneau, en accès
      libre, regroupent près de six kilomètres de promenades thématiques. Le sentier des Cabanes est une
      passerelle sur pilotis d'un demi-kilomètre jalonnée de huit cabanes ludiques pour les familles ; le
      sentier de la Palunette s'étire sur deux kilomètres le long du canal du Vigueirat avec deux
      observatoires et une tour ; le sentier Homme et Nature, inauguré au printemps 2022, parcourt près de 2
      km sur l'histoire agro-écologique camarguaise ; et le jardin ethnobotanique présente cinq milieux et les
      usages des plantes locales.


      Le cœur de réserve naturelle, quant à lui, ne se visite qu'accompagné d'un guide. Le départ s'effectue
      en navette électrique, durant deux heures et demie avec environ 700 m de marche aller-retour jusqu'aux
      observatoires. Une randonnée naturaliste de 5 km à la journée permet de sillonner sansouïres et
      roselières géantes.


      L'accès cyclable est idéal : depuis le pont Van Gogh à Arles, la ViaRhôna déroule 16 km jusqu'à
      Mas-Thibert, puis une voie verte de 5 km mène à l'accueil. En bus, la ligne 703 Arles–Port-Saint-Louis
      dessert Mas-Thibert, à 3,5 km de la réserve.
    history: >-
      La gestion associe pâturage extensif, radeaux de nidification pour laro-limicoles et arrachage des
      espèces végétales invasives : 13 espèces exotiques sont contrôlées, notamment les jussies d'eau, le
      séneçon en arbre et l'herbe de la pampa, afin d'éviter l'étouffement des herbiers aquatiques indigènes.
    before: >-
      Le cœur de réserve se visite exclusivement avec guide : consultez le calendrier et réservez à l'avance.
      Munissez-vous de chaussures de marche, de vêtements adaptés à la météo et de jumelles.
    around: >-
      À environ 5 km s'étend la [réserve naturelle nationale des Coussouls de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/). Plus loin, par l'affinité du héron
      pourpré et des lagunes, le site rappelle la [lagune de Venise](/lugar/laguna-di-venezia/) et le [parc
      naturel du delta de l'Èbre](/lugar/parc-natural-del-delta-de-l-ebre/).
  de:
    intro: >-
      Neun Reiherarten, und alle neun brüten oder rasten hier. Die Marais du Vigueirat umfassen 1.200 Hektar
      Feuchtgebiete, Schilfröhrichte und Kanäle zwischen Rhônedelta und Crau-Ebene – eines der größten
      Schutzareale des Conservatoire du littoral in der Camargue. Gemeinsam betreut von LPO France und LPO
      PACA, zeigt sich von den Holzstegen aus eine lebendige Camargue: Kampfstiere, Pferde und Sumpfvögel
      teilen sich denselben Lebensraum.
    landscape: >-
      Wasser regiert diese Landschaft. Permanente und periodische Süßwassersümpfe wechseln mit Kanälen, Gräben
      (Roubines), Lagunen und salzigen Sansouïres, auf denen Queller und Strandflieder wachsen. Das Reservat
      umfasst das größte zusammenhängende Schilfgebiet der Camargue.


      Die Pflanzenwelt birgt ungeahnte Vielfalt: 909 Arten von Pflanzen, Pilzen und Flechten wurden kartiert,
      darunter über 600 Gefäßpflanzen, von denen 41 unter Schutz stehen. Im Frühjahr blüht am Wegrand die
      Sommer-Knotenblume mit zarten Glöckchen. Auch die Zwerg-Seerose, die in der Camargue als ausgestorben
      galt, wurde im Vigueirat-Kanal wiederentdeckt – ihr einziges bekanntes Vorkommen im gesamten Delta.
    wildlife: >-
      Über 310 Vogelarten wurden gezählt. Die Reiher sind das Wahrzeichen: Rallenreiher nisten im
      Tamariskengebüsch, Silberreiher und [Purpurreiher](/especie/ardea_purpurea/) in den tiefen
      Schilffeldern. Die heimliche [Rohrdommel](/especie/botaurus_stellaris/) verbirgt sich im Schilf, weshalb
      im Frühjahr geführte Hörübersichten stattfinden.


      Jede Jahreszeit bringt andere Beobachtungen. Offene Trockenrasen beherbergen Bienenfresser, Blauracken
      und [Triele](/especie/burhinus_oedicnemus/); unter den Greifvögeln dominieren
      [Rohrweihen](/especie/circus_aeruginosus/), selten zeigen sich Schelladler,
      [Habichtsadler](/especie/aquila_fasciata/) und [Fischadler](/especie/pandion_haliaetus/). Im Winter
      rasten Enten und Rallen, und seit 2018 überwintern Scharen von [Kranichen](/especie/grus_grus/).
      Zwischen 80 und 100 Paare der Flussseeschwalbe brüten auf künstlichen Brutflößen des Projekts
      LIFE+ENVOLL.


      Unter den Säugetieren weiden fünf Herden von Camargue-Stieren und Camargue-Pferden von Ende März bis
      Mitte Dezember als ökologische Rasenmäher. [Fischotter](/especie/lutra_lutra/) und
      [Biber](/especie/castor_fiber/) hinterlassen Spuren an den Ufern. Fledermäuse jagen über den Gewässern,
      und am Lehrpfad steht eine eigene Fledermaushütte. Mittelmeer-Laubfrösche rufen in lauen Nächten,
      während sich die [Europäische Sumpfschildkröte](/especie/emys_orbicularis/) an den Roubines sonnt. Der
      bedrohte [Europäische Aal](/especie/anguilla_anguilla/) wächst in diesen Gewässern heran, bevor er zur
      Sargassosee wandert.
    visit: >-
      Es gibt zwei grundverschiedene Zugangswege. Die frei zugänglichen Sentiers de l'Étourneau umfassen fast
      sechs Kilometer Themenwege. Der Sentier des Cabanes ist ein Bohlenweg auf Stelzen von einem halben
      Kilometer Länge mit acht Mitmach-Hütten für Familien; der Palunette-Pfad führt über zwei Kilometer am
      Kanal entlang zu zwei Beobachtungshütten; der im Frühjahr 2022 eröffnete Pfad Homme et Nature widmet
      sich auf fast 2 km der Natur- und Kulturgeschichte; und ein ethnobotanischer Garten veranschaulicht fünf
      typische Lebensräume.


      Die Kernzone des Naturschutzgebiets darf ausschließlich mit Naturführern betreten werden. Die Führungen
      starten im Elektro-Kleinbus, dauern zweieinhalb Stunden und beinhalten rund 700 m Fußweg zu den
      Beobachtungstürmen. Ganztages-Exkursionen über 5 km erschließen die weiten Schilfröhrichte.


      Radfahrer erreichen das Schutzgebiet leicht: Ab der Van-Gogh-Brücke in Arles führt die ViaRhôna über 16
      km nach Mas-Thibert, von wo ein 5 km langer Weg zum Eingang führt. Die Buslinie 703
      Arles–Port-Saint-Louis hält in Mas-Thibert, rund 3,5 km vom Reservat entfernt.
    history: >-
      Das Schutzgebietsmanagement verknüpft extensive Beweidung, Brutflöße für Wasservögel und die Bekämpfung
      invasiver Neophyten: 13 problematische Arten, darunter Heidelauch-Arten (Ludwigia), Kreuzstrauch und
      Pampasgras, werden mechanisch entfernt, um das Zuwachsen der Wasserläufe zu verhindern.
    before: >-
      Die Kernzone ist nur mit Führung zugänglich: Informiere dich vorab über Termine und reserviere Plätze.
      Festes Schuhwerk, wetterfeste Kleidung und ein Fernglas sind erforderlich.
    around: >-
      Rund 5 km entfernt erstreckt sich die Steppenlandschaft [Réserve Naturelle Nationale des Coussouls de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/). Weiter entfernt teilt das Gebiet
      Purpurreiher und Flamingos mit der [Lagune von Venedig](/lugar/laguna-di-venezia/) und dem [Naturpark
      Ebro-Delta](/lugar/parc-natural-del-delta-de-l-ebre/).
  it:
    intro: >-
      Nove specie di aironi e garzette, e tutte e nove nidificano o stazionano qui. I Marais du Vigueirat
      abbracciano 1.200 ettari di paludi, canneti e canali tra il delta del Rodano e la pianura sassosa della
      Crau, formando una delle maggiori proprietà del Conservatoire du littoral in Camargue. Cogestita da LPO
      France e LPO PACA, la visuale dalle passerelle svela una Camargue viva: tori da combattimento, cavalli
      bradi e uccelli palustri che condividono le medesime acque.
    landscape: >-
      L'acqua scandisce la vita del territorio. Si alternano paludi dolci permanenti e temporanee, canali
      artificiali, roubines, bacini lagunari e le sansouïres salmastre dove prosperano salicornia e lavanda
      marina. La riserva protegge il più vasto canneto continuo della Camargue.


      La flora rivela un patrimonio cospicuo: sono censite 909 specie tra piante vascolari, funghi e licheni,
      con oltre 600 piante superiori, 41 delle quali protette o di alto valore conservazionistico. In
      primavera fiorisce la campanella maggiore lungo i bordi umidi. Inoltre il nanufee nano, creduto estinto
      in Camargue, è ricomparso nel canale di Vigueirat, sua unica stazione nell'intero delta.
    wildlife: >-
      Oltre 310 specie di uccelli sono state documentate nella riserva. Gli aironi ne rappresentano l'emblema:
      la sgarza ciuffetto nidifica nei tamerici, mentre l'airone bianco maggiore e l'[airone
      rosso](/especie/ardea_purpurea/) popolano i fitti canneti. Il mimetico
      [tarabuso](/especie/botaurus_stellaris/) risuona tra le cannucce, protagonista in primavera di visite
      guidate all'ascolto.


      Ogni stagione riserva scoperte. Nelle garighe aperte vivono gruccioni, ghiandaie marine e
      [occhioni](/especie/burhinus_oedicnemus/) ; tra i rapaci primeggia il [falco di
      palude](/especie/circus_aeruginosus/), affiancato dall'aquila anatraia maggiore, dall'[aquila di
      Bonelli](/especie/aquila_fasciata/) e dal [falco pescatore](/especie/pandion_haliaetus/). L'inverno
      attrae stormi di anatre e rallidi, e dal 2018 vi svernano nutrite colonie di [gru
      cenerine](/especie/grus_grus/). Tra 80 e 100 coppie di sterna comune nidificano su zattere galleggianti
      predisposte dal progetto LIFE+ENVOLL.


      Tra i mammiferi spiccano cinque mandrie di tori e cavalli camarguesi che pascolano da fine marzo a metà
      dicembre come falciatrici ecologiche. La [lontra europea](/especie/lutra_lutra/) e il [castoro
      europeo](/especie/castor_fiber/) lasciano frequenti orme nei canali. I pipistrelli dispongono di un
      rifugio didattico sul sentiero Homme et Nature. La raganella mediterranea canta la sera, mentre la
      [testuggine palustre europea](/especie/emys_orbicularis/) si riscalda al sole lungo le sponde. La
      minacciata [anguilla europea](/especie/anguilla_anguilla/) cresce in queste lagune prima di salpare per
      il Mar dei Sargassi.
    visit: >-
      Esistono due modalità differenti per scoprire il sito. I sentieri gratuiti de l'Étourneau sommano circa
      sei chilometri di anelli tematici. Il sentiero delle Cabanes è una passerella sopraelevata di mezzo
      chilometro con otto capanne interattive per famiglie; quello della Palunette costeggia il canale per
      circa due chilometri con due capanni e una torre; il percorso Homme et Nature, aperto nella primavera
      del 2022, copre quasi 2 km sui paesaggi camarguesi; e l'orto etnobotanico espone cinque ambienti
      tradizionali e i loro usi botanici.


      La riserva integrale, al contrario, si visita unicamente con guida naturalistica. La visita parte su
      navetta elettrica, dura due ore e mezza con circa 700 m a piedi fino alle torrette d'avvistamento.
      Un'escursione di una giornata intera di 5 km attraversa canneti e sansouïres nel cuore della riserva.


      In bicicletta l'accesso è comodissimo: dal ponte Van Gogh di Arles, la ciclabile ViaRhôna corre per 16
      km fino a Mas-Thibert, con un raccordo di 5 km fino all'ingresso. In autobus la linea 703
      Arles–Port-Saint-Louis ferma a Mas-Thibert, a circa 3,5 km dal centro visite.
    history: >-
      La tutela integra pascolo estensivo, zattere artificiali per uccelli coloniali e contenimento delle
      specie esotiche invasive: 13 specie aliene vengono monitorate ed estirpate, in particolare la ludwigia
      acquatica e l'erba della pampa, per evitare l'asfissia dei canali.
    before: >-
      La riserva integrale è accessibile unicamente con guida: verifica orari e disponibilità prima della
      partenza. Indossa calzature da cammino e porta con te un binocolo.
    around: >-
      A circa 5 km si trova la [Réserve Naturelle Nationale des Coussouls de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/). Più lontano, affini per aironi rossi
      e fenicotteri, si collocano la [Laguna di Venezia](/lugar/laguna-di-venezia/) e il [Parco Naturale del
      Delta dell'Ebro](/lugar/parc-natural-del-delta-de-l-ebre/).
  pt:
    intro: >-
      Nove espécies de garças e garçotes, e as nove nidificam ou residem aqui. Os Marais du Vigueirat reúnem
      1.200 hectares de sapais, caniçais e canais entre o delta do Ródano e a planície pedregosa de Crau,
      configurando uma das maiores propriedades do Conservatoire du littoral na Camarga. Com gestão conjunta
      da LPO France e LPO PACA, o panorama dos seus passadiços revela uma Camarga viva: toiros bravos, cavalos
      e aves aquáticas partilhando a mesma água.
    landscape: >-
      A dinâmica hídrica molda cada recanto. Alternam-se pauis permanentes e temporários de água doce, canais,
      roubines, lagoas e sansouïres salinas onde vingam salicornias e estátices. A reserva resguarda o maior
      caniçal contínuo da Camarga.


      A flora exibe uma riqueza surpreendente: estão inventariadas 909 espécies entre plantas, fungos e
      líquenes, com mais de 600 plantas vasculares, 41 das quais com estatuto de proteção. Na primavera
      desabrocha a campainha-branca-de-verão. O nenúfar-amarelo-pequeno, que se julgava extinto na Camarga,
      reapareceu no canal do Vigueirat, seu único reduto conhecido em todo o delta.
    wildlife: >-
      Mais de 310 espécies de aves foram registadas na reserva. Os membros da família das garças são a
      bandeira local: o garçote nidifica nos tamargueirais, enquanto a garça-branca-grande e a
      [garça-vermelha](/especie/ardea_purpurea/) colonizam os grandes caniçais. O esquivo
      [abetouro-comum](/especie/botaurus_stellaris/) funde-se na vegetação, motivando na primavera passeios de
      escuta ao amanhecer.


      Cada época traz novidades. Nos espaços abertos habitam abelharucos, rolieiros e
      [alcaravões](/especie/burhinus_oedicnemus/); entre as rapinas abundam
      [tartaranhões-dos-pauis](/especie/circus_aeruginosus/), surgindo mais raramente a águia-pomarina, a
      [águia-de-bonelli](/especie/aquila_fasciata/) e a [águia-pesqueira](/especie/pandion_haliaetus/). O
      inverno atrai patos e galeirões, acolhendo desde 2018 grandes bandos de
      [grous-comuns](/especie/grus_grus/). Entre 80 e 100 casais de andorinha-do-mar-comum nidificam em
      plataformas flutuantes criadas pelo projeto LIFE+ENVOLL.


      Nos mamíferos destacam-se cinco manadas de toiros e cavalos camargueses, que pastam de finais de março a
      meados de dezembro como corta-relvas naturais. A [lontra-europeia](/especie/lutra_lutra/) e o
      [castor-europeu](/especie/castor_fiber/) deixam rastos nas margens. Os morcegos usam uma cabana didática
      no trilho Homme et Nature. A rela-meridional canta ao entardecer, enquanto o
      [cágado-de-carapaça-estriada](/especie/emys_orbicularis/) apanha sol nas margens. A ameaçada
      [enguia-europeia](/especie/anguilla_anguilla/) desenvolve-se nestas lagoas antes de partir para o Mar
      dos Sargaços.
    visit: >-
      A visitação reparte-se por duas abordagens distintas. Os trilhos de l'Étourneau, de acesso livre, somam
      cerca de seis quilómetros de circuitos temáticos. O trilho das Cabanes é um passadiço de meio quilómetro
      sobre estacas com oito cabanas pedagógicas para famílias; o da Palunette desenvolve-se por dois
      quilómetros junto ao canal com dois observatórios; o percurso Homme et Nature, aberto na primavera de
      2022, cobre quase 2 km sobre a história agrária da Camarga; e o jardim etnobotânico ilustra cinco
      biótopos tradicionais e os seus usos medicinais e tintureiros.


      A reserva integral, por seu turno, só se visita com guia naturalista. As partidas fazem-se em vaivém
      elétrico, com duração de duas horas e meia e cerca de 700 m de caminhada até aos observatórios. Para
      aprofundar, uma caminhada de 5 km de dia inteiro percorre sansouïres e caniçais gigantes.


      O acesso em bicicleta é ótimo: desde a ponte Van Gogh em Arles, a ViaRhôna segue 16 km até Mas-Thibert,
      ligando uma ciclovia de 5 km à entrada. Em autocarro, a linha 703 Arles–Port-Saint-Louis serve
      Mas-Thibert, a cerca de 3,5 km da reserva.
    history: >-
      A gestão combina pastoreio extensivo, jangadas artificiais para aves marinhas e erradicação de plantas
      invasoras: são controladas 13 espécies exóticas, nomeadamente as jússeas aquáticas e a erva-das-pampas,
      para evitar o asfixiamento da flora nativa.
    before: >-
      A reserva integral visita-se exclusivamente com guia: consulta os calendários e reserva antecipadamente.
      Usa calçado de caminhada, roupa adaptada ao tempo e binóculos.
    around: >-
      A cerca de 5 km fica a [Réserve Naturelle Nationale des Coussouls de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/). Mais longe, pela afinidade de
      garças-vermelhas e flamingos, partilha características ecológicas com a [Laguna de
      Veneza](/lugar/laguna-di-venezia/) e o [Parque Natural do Delta do
      Ebro](/lugar/parc-natural-del-delta-de-l-ebre/).
