unico:
  es: Un valle glaciar donde un mismo río nace dos veces y cae noventa metros en la cascada de Rinka.
  en: A glacial alpine valley where a single river is born twice and plunges ninety metres over Rinka Falls.
  fr: >-
    Une vallée glaciaire où une même rivière naît deux fois et chute de quatre-vingt-dix mètres à la cascade
    de Rinka.
  de: >-
    Ein alpines Gletschertal, in dem derselbe Fluss zweimal entspringt und neunzig Meter über den
    Rinka-Wasserfall stürzt.
  it: >-
    Una valle glaciale dove uno stesso fiume sorge due volte e compie un salto di novanta metri alla cascata
    Rinka.
  pt: Um vale glaciar onde o mesmo rio brota duas vezes e se despenha noventa metros na cascata de Rinka.
observaciones:
  es: >-
    El gestor pide quedarse en los senderos señalizados y llevar al perro atado, y prohíbe el uso de drones.
    Muchas plantas del valle están protegidas o son raras: el mejor recuerdo es una foto, no un ramo. El
    tiempo cambia deprisa en la montaña: lleva ropa de repuesto, botas de montaña y agua. Con un día basta
    para el sendero.
texto:
  es:
    intro: >-
      El Savinja nace dos veces. La primera, limpio y potable, brota a 1.280 metros bajo el circo de Okrešelj
      y se lanza hacia la cascada de Rinka, de noventa metros. Pronto el agua se esconde bajo tierra y vuelve
      a salir más abajo, negra de arcilla, en la fuente de Črna, que es su segundo nacimiento. Todo eso ocurre
      en Logarska dolina, un valle alpino de origen glaciar en los Alpes de Kamnik y Savinja, en el municipio
      de Solčava. Mide 7 kilómetros de largo y 250 metros de ancho de media, y se divide en tres partes: Log y
      Plest, de praderas, y Kot, cubierto sobre todo de bosque. Es parque paisajístico desde 1987.
    landscape: >-
      Cimas de más de 2000 metros rodean el valle: Krofička, Ojstrica, Planjava, Brana, Turska gora. Su
      aspecto actual lo modeló un glaciar de la última edad de hielo. Quedan testigos por todas partes. Los
      grandes bloques de roca repartidos por el valle son depósitos que dejó el glaciar. Hay morrena hasta 200
      metros por encima del fondo, señal de la altura máxima que alcanzó el hielo. Tras la morrena que dejó el
      glaciar al retirarse se formó un lago, y sus arcillas forman hoy la mayor parte de Log. Una leyenda
      cuenta que hace siglos hubo un lago glaciar en Matkov kot, y el arroyo del valle aún se llama Jezera.


      El parque abarca todo el valle hasta las crestas, con 24,3 kilómetros cuadrados, y reúne 43 valores
      naturales: cascadas, torres de roca, cuevas, bloques glaciares, árboles de dimensiones enormes. La
      cascada de Rinka cae en un chorro estrecho por un umbral glaciar; Palenk, otro monumento natural, se
      despeña setenta y ocho metros en escalones, sobre todo después de llover. El tilo de Logar mide 485
      centímetros de perímetro y 25 metros de altura. La cueva Potočka zijalka es una de las más importantes
      de Eslovenia por su valor arqueológico y paleontológico. En la fuente de Črna, el agua aflora por capas
      impermeables y corre sobre arcillas oscuras que le dan el color negro.
    wildlife: >-
      El haya es el árbol más común del valle y el abeto rojo también es abundante. Bajo los hayedos, en el
      bosque de montaña, vive el zueco de dama, la mayor orquídea de Eslovenia, y entre los cantos rodados
      crece la amapola amarilla de Kerner, endémica de los Alpes de Kamnik y Savinja y de los Karavanke.


      Entre las aves, en el entorno del valle anidan dos parejas de [águila
      real](/especie/aquila_chrysaetos/), y también vive el [halcón peregrino](/especie/falco_peregrinus/). El
      [picamaderos negro](/especie/dryocopus_martius/), el mayor de los pájaros carpinteros, cava huecos que
      luego ocupan otros animales. En el bosque y la alta montaña hay [urogallo](/especie/tetrao_urogallus/),
      [gallo lira](/especie/tetrao_tetrix/) y [lagópodo alpino](/especie/lagopus_muta/).


      Las estaciones cambian el reparto de los mamíferos. Los [rebecos](/especie/rupicapra_rupicapra/) viven
      en verano en las alturas y en invierno bajan a las laderas soleadas y empinadas. Los
      [íbices](/especie/capra_ibex/) viven en las cimas de Planjava, Lučka baba y Brana. En el fondo del valle
      vive sobre todo el [corzo](/especie/capreolus_capreolus/), y en los últimos años se asienta también el
      [ciervo](/especie/cervus_elaphus/). El [lince boreal](/especie/lynx_lynx/) y el [oso
      pardo](/especie/ursus_arctos/) son visitantes raros de estos bosques.
    visit: >-
      El sendero del valle es un recorrido natural y etnográfico que se puede hacer por libre o con un guía
      local. Calcula unas dos horas de ida, y puedes entrar en él en distintos puntos del valle. A lo largo
      del camino se ven el segundo nacimiento del Savinja, grandes bloques de roca, una cabaña de leñadores y
      carboneros, un mirador de cazadores y un enebro gigante; el tramo central pasa por el llamado Fairytale
      Forest. El broche del sendero es la cascada de Rinka, una de las más altas de Eslovenia, con aire y agua
      frescos al pie.


      Un tramo corto junto al Dom planincev, la casa de montaña del valle, permite el paso de sillas de
      ruedas. El centro de información turística TIC Rinka, en Solčava, ofrece información, programas,
      exposiciones y guías locales.
    history: >-
      Entre los siglos XII y XIV el monasterio benedictino de Gornji Grad pobló las zonas remotas con
      campesinos, y así se fue formando el paisaje de granjas. Hoy el proceso es el contrario: las granjas y
      los pastos y prados abandonados se cubren de vegetación con rapidez.


      El valle se declaró parque paisajístico en 1987, y en 1992 los vecinos obtuvieron la concesión para
      gestionarlo. El parque reúne 43 valores naturales, es en su conjunto un área ecológicamente importante y
      una parte forma parte de Natura 2000. El curso alto del Savinja, entre Logarska dolina y Ljubno, está
      protegido como monumento natural. El gestor busca además reducir la presión del tráfico en una de las
      áreas alpinas más visitadas del país.
    before: >-
      El gestor pide quedarse en los senderos señalizados y llevar al perro atado, y prohíbe el uso de drones.
      Muchas plantas del valle están protegidas o son raras: el mejor recuerdo es una foto, no un ramo. El
      tiempo cambia deprisa en la montaña: lleva ropa de repuesto, botas de montaña y agua. Con un día basta
      para el sendero.
    around: >-
      A siete kilómetros queda la [Cordillera de Karavanke / Karawanken](/lugar/karavanke---karawanken/), de
      la que la amapola de Kerner es también endémica.
  en:
    intro: >-
      The Savinja is born twice. Its first source, crystal-clear and drinkable, springs at 1,280 metres
      beneath the Okrešelj cirque and surges toward the ninety-metre Rinka Falls. Soon the water slips
      subterranean and resurfaces further downstream, dark with clay, at the Črna spring, marking its second
      birth. All of this unfolds in Logarska dolina, an alpine glacial valley in the Kamnik–Savinja Alps,
      within the municipality of Solčava. It stretches 7 kilometres in length and 250 metres in average width,
      divided into three sectors: Log and Plest, composed of meadows, and Kot, cloaked primarily in forest. It
      has been protected as a landscape park since 1987.
    landscape: >-
      Peaks topping 2,000 metres encircle the valley: Krofička, Ojstrica, Planjava, Brana, and Turska gora.
      Its current profile was carved by a glacier during the last ice age. Vestiges remain visible everywhere.
      Giant boulders scattered across the valley floor are glacial erratics left by retreating ice. Lateral
      moraine deposits reach up to 200 metres above the valley floor, marking the peak thickness of the
      ancient ice sheet. Behind the terminal moraine a lake formed as the glacier withdrew, and its lacustrine
      clays now form the foundation of Log. Local lore tells that centuries ago a glacial lake existed in
      Matkov kot, and the valley stream is still named Jezera.


      The park encompasses the entire valley up to the mountain crests, covering 24.3 square kilometres and
      uniting 43 designated natural values: waterfalls, rock towers, caves, glacial erratics, and monumental
      trees. Rinka Falls drops in an unbroken narrow ribbon over a glacial step; Palenk, another declared
      natural monument, tumbles seventy-eight metres in cascading ledges, particularly spectacular after
      rainfall. The Logar linden measures 485 centimetres in trunk circumference and 25 metres in height. The
      Potočka zijalka cave is among Slovenia's most celebrated archaeological and palaeontological sites. At
      the Črna spring, underground water filters through impermeable layers and flows over dark clays that
      lend it its characteristic dark colour.
    wildlife: >-
      Common beech is the most widespread tree in the valley, with Norway spruce also abundantly represented.
      Beneath the beech stands, mountain woods shelter lady's slipper, the largest native orchid in Slovenia,
      while limestone scree beds nourish Kerner's yellow poppy, an endemic wildflower of the Kamnik–Savinja
      Alps and the Karawanks.


      Among birds, two breeding pairs of [golden eagle](/especie/aquila_chrysaetos/) nest around the valley
      crags, and the [peregrine falcon](/especie/falco_peregrinus/) also resides here. The [black
      woodpecker](/especie/dryocopus_martius/), the largest woodpecker in Europe, excavates nest cavities that
      subsequently shelter other forest wildlife. In the timberline forests and subalpine crags dwell [western
      capercaillie](/especie/tetrao_urogallus/), [black grouse](/especie/tetrao_tetrix/) and [rock
      ptarmigan](/especie/lagopus_muta/).


      The changing seasons shift the distribution of large mammals. [Alpine
      chamois](/especie/rupicapra_rupicapra/) spend the summer months on open high crags, descending in winter
      to steep sunny rock faces. [Alpine ibex](/especie/capra_ibex/) graze the rocky summits of Planjava,
      Lučka baba and Brana. The valley floor is roamed mainly by [roe deer](/especie/capreolus_capreolus/),
      joined in recent years by established populations of [red deer](/especie/cervus_elaphus/). The [Eurasian
      lynx](/especie/lynx_lynx/) and [brown bear](/especie/ursus_arctos/) remain elusive, occasional wanderers
      across these forests.
    visit: >-
      The valley trail is a scenic natural and ethnographic hiking route that can be walked self-guided or
      with an experienced local guide. Allow about two hours for the one-way walk, with multiple entry points
      scattered along the valley road. Highlights along the footpath include the second source of the Savinja,
      giant glacial erratics, a restored woodcutter and charcoal-burner cabin, an elevated hunter's lookout,
      and an ancient giant juniper; the central section winds through the whimsical Fairytale Forest. The
      culminating highlight of the path is Rinka Falls, one of Slovenia's tallest waterfalls, where cool spray
      and mountain air greet hikers at the foot of the cliff.


      A short paved stretch adjacent to the Dom planincev mountain hut is wheelchair accessible. The TIC Rinka
      tourist information centre in Solčava provides maps, seasonal programmes, cultural exhibitions and local
      guide services.
    history: >-
      Between the twelfth and fourteenth centuries, the Benedictine monastery of Gornji Grad settled remote
      mountain tracts with tenant farmers, gradually carving out the isolated farmstead landscape seen today.
      Modern trends run in reverse: abandoned upland farms and alpine pastures are swiftly being reclaimed by
      natural forest succession.


      The valley was designated a landscape park in 1987, and in 1992 local residents secured a public
      concession to manage it cooperatively. The park brings together 43 natural values, constitutes an
      ecologically significant area in its entirety, and partly belongs to Natura 2000. The upper course of
      the Savinja River between Logarska dolina and Ljubno is protected as a natural monument. Management
      efforts focus on curbing motor vehicle congestion in one of Slovenia's most cherished alpine valleys.
    before: >-
      The park authority requests visitors stay on marked paths, keep dogs securely on a leash, and refrain
      from operating drones. Many mountain plants in the valley are protected or endangered: take photographs,
      not bouquets. Alpine weather changes swiftly: pack spare warm layers, sturdy hiking boots, and drinking
      water. One day is sufficient to experience the main valley trail.
    around: >-
      Seven kilometres away lies the [Karavanke / Karawanken Mountain Range](/lugar/karavanke---karawanken/),
      where Kerner's yellow poppy is likewise endemic.
  fr:
    intro: >-
      La Savinja naît deux fois. Sa première source, pure et potable, jaillit à 1 280 mètres au pied du cirque
      d'Okrešelj et dévale vers la cascade de Rinka, haute de quatre-vingt-dix mètres. L'eau s'infiltre
      ensuite sous terre pour resurgir en aval, noircie par l'argile, à la source de Črna, son second berceau.
      Tout cela se déroule dans la Logarska dolina, une vallée alpine glaciaire des Alpes de Kamnik et de la
      Savinja, sur la commune de Solčava. Elle mesure 7 kilomètres de long pour 250 mètres de large en
      moyenne, et se divise en trois parties : Log et Plest, dominées par les prés de fauche, et Kot, tapissée
      d'une dense forêt. Elle est classée parc paysager depuis 1987.
    landscape: >-
      Des sommets dépassant 2 000 mètres ceinturent la vallée : Krofička, Ojstrica, Planjava, Brana et Turska
      gora. Son profil actuel a été façonné par un glacier lors de la dernière période glaciaire. Les témoins
      abondent. De gigantesques blocs rocheux dispersés dans le fond de vallée sont des dépôts glaciaires
      abandonnés par les glaces. Des moraines latérales subsistent jusqu'à 200 mètres au-dessus du plancher du
      vallon, signalant la hauteur maximale atteinte par l'appareil glaciaire. À l'arrière du cordon
      morainique frontal, un lac s'est formé au retrait du glacier, et ses dépôts argileux composent
      aujourd'hui la majeure partie du secteur de Log. Une légende affirme qu'un lac glaciaire occupait
      autrefois le vallon de Matkov kot, et le ruisseau local porte toujours le nom de Jezera.


      Le parc s'étend sur toute la vallée jusqu'aux lignes de crête, totalisant 24,3 kilomètres carrés et
      réunissant 43 monuments naturels : cascades, aiguilles rocheuses, grottes, blocs erratiques et arbres
      gigantesques. La cascade de Rinka se projette en un jet étroit franchissant un verrou glaciaire ;
      Palenk, autre monument naturel, dévale soixante-dix-huit mètres en cascades successives après les
      pluies. Le tilleul de Logar mesure 485 centimètres de tour de tronc et 25 mètres de haut. La caverne de
      Potočka zijalka compte parmi les sites archéologiques et paléontologiques majeurs de Slovénie. À la
      source de Črna, l'eau suinte à travers des couches imperméables et ruisselle sur des argiles sombres qui
      lui donnent sa teinte noire.
    wildlife: >-
      Le hêtre est l'arbre dominant de la vallée et l'épicéa commun est également très répandu. Sous les
      hêtraies de montagne fleurit le sabot de Vénus, la plus grande orchidée indigène de Slovénie, tandis que
      les pierriers calcaires abritent le pavot jaune de Kerner, endémique des Alpes de Kamnik-Savinja et des
      Karavanke.


      Côté avifaune, deux couples d'[aigle royal](/especie/aquila_chrysaetos/) nidifient sur les falaises
      encadrant la vallée, accompagnés du [faucon pèlerin](/especie/falco_peregrinus/). Le [pic
      noir](/especie/dryocopus_martius/), le plus grand des pics européens, creuse des cavités qui profitent
      ensuite à d'autres espèces. Les forêts montagnardes et les vires sommitales abritent le [grand
      tétras](/especie/tetrao_urogallus/), le [tétras lyre](/especie/tetrao_tetrix/) et le [lagopède
      alpin](/especie/lagopus_muta/).


      Le rythme des saisons réorganise les mammifères. Les [chamois](/especie/rupicapra_rupicapra/) gagnent
      les crêtes rocheuses en été et redescendent l'hiver sur les parois escarpées bien exposées. Les
      [bouquetins des Alpes](/especie/capra_ibex/) parcourent les cimes de Planjava, Lučka baba et Brana. Le
      fond de vallée héberge essentiellement le [chevreuil](/especie/capreolus_capreolus/), rejoint ces
      dernières années par le [cerf élaphe](/especie/cervus_elaphus/). Le [lynx boréal](/especie/lynx_lynx/)
      et l'[ours brun](/especie/ursus_arctos/) sont des hôtes rares et discrets de ces grands massifs
      forestiers.
    visit: >-
      Le sentier de découverte de la vallée propose un parcours naturaliste et ethnographique à arpenter en
      autonomie ou en compagnie d'un guide local. Comptez environ deux heures de marche pour l'aller simple,
      avec plusieurs points d'accès répartis le long de la vallée. L'itinéraire dévoile la seconde source de
      la Savinja, de spectaculaires blocs erratiques, une cabane de bûcherons et de charbonniers, un affût de
      chasseurs et un genévrier centenaire monumental ; le tronçon central traverse la Forêt des contes de
      fées. Le point d'orgue de la balade est la cascade de Rinka, l'une des plus impressionnantes de
      Slovénie, offrant une halte vivifiante au pied de la chute.


      Une courte section près du refuge Dom planincev est adaptée aux fauteuils roulants. Le centre
      d'information touristique TIC Rinka, à Solčava, propose renseignements, programmes thématiques,
      expositions et services de guidage.
    history: >-
      Entre les XIIe et XIVe siècles, les moines bénédictins de Gornji Grad implantèrent des colons paysans
      dans ces vallées reculées, modelant peu à peu le paysage d'exploitations agricoles dispersées.
      Aujourd'hui, la tendance s'inverse : prairies et pâturages d'altitude délaissés sont rapidement
      reconquis par la forêt spontanée.


      La vallée a été érigée en parc paysager en 1987, et en 1992 les résidents de la commune ont obtenu la
      concession pour gérer le site collectivement. Le parc regroupe 43 valeurs naturelles patrimoniales,
      constitue une zone écologiquement déterminante et s'intègre pour partie au réseau Natura 2000. Le cours
      supérieur de la Savinja, entre Logarska dolina et Ljubno, est classé monument naturel. L'organisme
      gestionnaire s'attache en outre à réguler le trafic automobile dans l'une des vallées alpines les plus
      fréquentées du pays.
    before: >-
      La direction du parc invite les usagers à rester sur les chemins balisés, à tenir les chiens en laisse
      et rappelle l'interdiction des drones. Beaucoup de fleurs alpines sont protégées : une photo est le plus
      beau des souvenirs. La météo montagnarde évolue très rapidement : munissez-vous de vêtements chauds, de
      chaussures de marche et d'eau. Une journée suffit pour parcourir le sentier principal.
    around: >-
      À sept kilomètres s'étire la [chaîne des Karavanke / Karawanken](/lugar/karavanke---karawanken/), dont
      le pavot jaune de Kerner est également une espèce endémique.
  de:
    intro: >-
      Die Savinja wird zweimal geboren. Ihre erste Quelle entspringt glasklar und trinkbar auf 1.280 Metern
      unterhalb des Kars von Okrešelj und stürzt über den neunzig Meter hohen Rinka-Wasserfall in die Tiefe.
      Bald verschwindet das Wasser im karstigen Untergrund und tritt weiter talauswärts, von Tonpartikeln
      getrübt, an der Črna-Quelle ein zweites Mal ans Tageslicht. All dies vollzieht sich in der Logarska
      dolina, einem eiszeitlichen Alpenhochtal in den Steiner und Sanntaler Alpen in der Gemeinde Solčava. Das
      Tal misst 7 Kilometer in der Länge und im Mittel 250 Meter in der Breite; es gliedert sich in die
      wiesenreichen Abschnitte Log und Plest sowie das waldreiche Kot. Seit 1987 ist es als Landschaftspark
      geschützt.
    landscape: >-
      Gipfel von mehr als 2.000 Metern Höhe umrahmen das Tal: Krofička, Ojstrica, Planjava, Brana und Turska
      gora. Das gegenwärtige Antlitz meißelte ein mächtiger Gletscher der letzten Kaltzeit. Zeugen dieses
      Geschehens sind überall sichtbar. Große Felsblöcke auf dem Talboden stellen vom Eis verfrachtete
      Findlinge dar. Seitenmoränen ragen bis zu 200 Meter über den Talboden auf und markieren den Höchststand
      der eiszeitlichen Gletschermassen. Hinter der Endmoräne staute sich beim Eisrückzug ein
      Schmelzwassersee, dessen Tone heute den Grund von Log bilden. Einer Überlieferung nach bestand einst
      auch im Matkov kot ein Eiszeitsee, und der Talbach trägt bis heute den Namen Jezera.


      Der Park erstreckt sich über das gesamte Tal bis zu den Gebirgskämmen, umfasst 24,3 Quadratkilometer und
      vereint 43 ausgewiesene Naturwerte: Wasserfälle, Felszinnen, Höhlen, Moränenblöcke und gewaltige
      Baumveteranen. Der Rinka-Wasserfall stürzt in schmalem Strahl über eine glaziale Gefällsstufe; Palenk,
      ein weiteres Naturdenkmal, fällt über achtundsiebzig Meter in Felskaskaden, besonders imposant nach
      Regengüssen. Die Logar-Linde weist 485 Zentimeter Stammumfang und 25 Meter Höhe auf. Die Höhle Potočka
      zijalka zählt zu den bedeutendsten archäologischen und paläontologischen Fundstätten Sloweniens. An der
      Črna-Quelle tritt Grundwasser über undurchlässigen Schichten aus und strömt über dunkle Tone, die ihm
      die charakteristische dunkle Färbung verleihen.
    wildlife: >-
      Die Rotbuche dominiert den Talwald, während die Gemeine Fichte ebenfalls reich vertreten ist. Unter den
      montanen Buchenwäldern blüht der Frauenschuh, die größte einheimische Orchidee Sloweniens, während auf
      Kalkschutthalden der Gelbe Kerner-Mohn gedeiht, ein Endemit der Steiner Alpen und der Karawanken.


      In der Vogelwelt brüten zwei Paare des [Steinadlers](/especie/aquila_chrysaetos/) an den Felswänden des
      Tales, und auch der [Wanderfalke](/especie/falco_peregrinus/) ist hier heimisch. Der
      [Schwarzspecht](/especie/dryocopus_martius/), Europas größter Specht, zimmert Höhlenbäume, die später
      zahlreichen Folgenutzern dienen. In den Bergwäldern und Hochlagen leben
      [Auerhuhn](/especie/tetrao_urogallus/), [Birkhuhn](/especie/tetrao_tetrix/) und
      [Alpenschneehuhn](/especie/lagopus_muta/).


      Im Jahreslauf wechselt der Lebensraum der Säugetiere. Die [Gämse](/especie/rupicapra_rupicapra/) weidet
      im Sommer auf den offenen Felsgraten und zieht sich im Winter an steile, sonnige Steilwände zurück.
      [Alpensteinböcke](/especie/capra_ibex/) besiedeln die schroffen Gipfel von Planjava, Lučka baba und
      Brana. Den Talboden bewohnt vor allem das [Reh](/especie/capreolus_capreolus/), zu dem in den letzten
      Jahren wieder vermehrt der [Rothirsch](/especie/cervus_elaphus/) stößt. [Luchs](/especie/lynx_lynx/) und
      [Braunbär](/especie/ursus_arctos/) sind seltene, scheue Gäste dieser weitläufigen Waldgebiete.
    visit: >-
      Der Talwanderweg ist ein naturkundlicher und volkskundlicher Themenweg, der sich auf eigene Faust oder
      in Begleitung einheimischer Führer erkunden lässt. Für den einfachen Hinweg solltest du etwa zwei
      Stunden Gehzeit veranschlagen; Einstiege sind an mehreren Punkten entlang der Talstraße möglich. Zu den
      Stationen zählen die zweite Savinja-Quelle, mächtige Findlinge, eine historische Holzknecht- und
      Köhlerhütte, ein Hochsitz und ein uralter Wacholder; der Mittelabschnitt führt durch den sogenannten
      Märchenwald. Den krönenden Abschluss bildet der Rinka-Wasserfall, einer der höchsten Sloweniens, an
      dessen Fuß kühle Tropfen Erfrischung spenden.


      Ein kurzer Abschnitt beim Alpenheim Dom planincev ist barrierefrei für Rollstühle ausgebaut. Das
      Tourismuszentrum TIC Rinka in Solčava hält Kartenmaterial, Erlebnisprogramme, Ausstellungen und
      Führungsangebote bereit.
    history: >-
      Zwischen dem zwölften und vierzehnten Jahrhundert besiedelten Benediktinermönche aus Gornji Grad diese
      entlegenen Täler mit Bergbauern, wodurch die traditionsreiche Kulturlandschaft mit ihren Einzelhöfen
      entstand. Heute kehrt sich die Entwicklung um: Aufgelassene Hochweiden und Almen werden zusehends von
      spontanem Waldwuchs überwachsen.


      Das Tal wurde 1987 zum Landschaftspark erklärt, und 1992 übertrugen die Behörden den einheimischen
      Bewohnern die Konzession zur eigenverantwortlichen Parkverwaltung. Das Schutzgebiet umfasst 43
      ausgewiesene Naturwerte, stellt ein ökologisch bedeutsames Gebiet dar und gehört teilweise zum
      europäischen Schutznetz Natura 2000. Der Oberlauf der Savinja zwischen Logarska dolina und Ljubno ist
      als Naturdenkmal geschützt. Der Parkbetreiber bemüht sich aktiv um eine Entlastung vom motorisierten
      Ausflugsverkehr.
    before: >-
      Die Parkverwaltung bittet darum, auf den markierten Wegen zu bleiben, Hunde an der Leine zu führen und
      Drohnenflüge zu unterlassen. Viele Alpenblumen sind streng geschützt: Nimm ein Foto als Erinnerung mit,
      keinen Blumenstrauß. Das Gebirgswetter schlägt rasch um: Führe warme Kleidung, feste Bergschuhe und
      Trinkwasser mit. Ein Tag reicht aus, um den Talweg ausgiebig zu begehen.
    around: >-
      Sieben Kilometer entfernt liegt der Gebirgszug der [Karawanken](/lugar/karavanke---karawanken/), in dem
      der Kerner-Mohn ebenfalls als Endemit vorkommt.
  it:
    intro: >-
      La Savinja nasce due volte. La prima, limpida e potabile, scaturisce a 1.280 metri sotto il circo di
      Okrešelj e precipita verso la cascata Rinka, alta novanta metri. Poco dopo le acque si inabissano nel
      sottosuolo e riemergono più a valle, cariche di argilla scura, presso la risorgiva di Črna, che segna la
      sua seconda nascita. Tutto questo avviene nella Logarska dolina, una vallata alpina di origine glaciale
      incastonata nelle Alpi di Kamnik e della Savinja, nel comune di Solčava. Il solco vallivo misura 7
      chilometri di lunghezza e 250 metri di larghezza media, articolandosi in tre settori: Log e Plest,
      occupati da prati, e Kot, ricoperto prevalentemente da boscaglie. È tutelata come parco paesaggistico
      dal 1987.
    landscape: >-
      Vette che oltrepassano i 2.000 metri circondano la valle: Krofička, Ojstrica, Planjava, Brana e Turska
      gora. L'aspetto contemporaneo è stato scolpito da un ghiacciaio durante l'ultima glaciazione. Le
      testimonianze affiorano ovunque. I grandi massi sparsi sul fondovalle sono blocchi erratici abbandonati
      dal ritiro dei ghiacci. I cordoni morenici si spingono fino a 200 metri sopra il fondo, attestando lo
      spessore massimo raggiunto dalla colata glaciale. A monte della morrena frontale si formò un bacino
      lacustre e le sue argille costituiscono oggi la piana di Log. Una tradizione popolare narra che secoli
      or sono esistesse un lago glaciale a Matkov kot, e il ruscello vallivo porta ancora il nome di Jezera.


      Il parco copre l'intera valle fino ai crinali sommitali, abbracciando 24,3 chilometri quadrati e
      riunendo 43 valori naturali riconosciuti: cascate, guglie rocciose, caverne, massi erratici e alberi
      maestosi. La cascata Rinka si getta con un getto sottile oltre una soglia glaciale; Palenk, altro
      monumento naturale, precipita per settantotto metri a salti successivi, specialmente dopo le piogge. Il
      tiglio di Logar misura 485 centimetri di circonferenza del fusto e 25 metri d'altezza. La caverna
      Potočka zijalka è uno dei siti paleontologici e archeologici più celebri della Slovenia. Alla risorgiva
      di Črna, le acque risalgono strati impermeabili e scorrono su argille scure che conferiscono loro la
      caratteristica tonalità nerastra.
    wildlife: >-
      Il faggio è l'albero più comune della vallata e l'abete rosso è altrettanto rigoglioso. Nel sottobosco
      montano delle faggete prospera la pianella della Madonna, la maggiore orchidea spontanea della Slovenia,
      mentre tra i macereti calcarei cresce il papavero giallo di Kerner, endemico delle Alpi di
      Kamnik-Savinja e delle Caravanche.


      Tra i volatili, nei contrafforti rocciosi nidificano due coppie di [aquila
      reale](/especie/aquila_chrysaetos/), affiancate dal [falco pellegrino](/especie/falco_peregrinus/). Il
      [picchio nero](/especie/dryocopus_martius/), il più grande tra i picchi europei, scava nei tronchi
      cavità che ospitano in seguito altri animali. Nelle pinete d'alta quota e sui pascoli subalpini vivono
      il [gallo cedrone](/especie/tetrao_urogallus/), il [fagiano di monte](/especie/tetrao_tetrix/) e la
      [pernice bianca](/especie/lagopus_muta/).


      Le stagioni governano gli spostamenti dei mammiferi. I [camosci](/especie/rupicapra_rupicapra/)
      frequentano in estate le quote più alte e in inverno scendono sui versanti solatii e dirupati. Gli
      [stambecchi](/especie/capra_ibex/) popolano le creste di Planjava, Lučka baba e Brana. Sul fondovalle
      staziona prevalentemente il [capriolo](/especie/capreolus_capreolus/), cui si è affiancato negli ultimi
      tempi anche il [cervo](/especie/cervus_elaphus/). La [lince eurasiatica](/especie/lynx_lynx/) e l'[orso
      bruno](/especie/ursus_arctos/) sono visitatori elusivi e rari di questi boschi.
    visit: >-
      Il sentiero della valle è un tracciato naturalistico ed etnografico percorribile in autonomia o con
      accompagnamento di guide locali. Considera circa due ore per l'andata, con diverse possibilità di
      imbocco lungo la carrozzabile della valle. Lungo il tragitto si ammirano la seconda scaturigine della
      Savinja, imponenti massi erratici, la capanna tradizionale di boscaioli e carbonai, un punto
      d'avvistamento venatorio e un ginepro gigante; il tratto centrale attraversa la suggestiva Foresta delle
      Fiabe. Il traguardo finale del percorso è la cascata Rinka, tra le più maestose della Slovenia, con aria
      fresca e spruzzi rigeneranti ai piedi della balza.


      Un breve tratto pianeggiante accanto al rifugio Dom planincev è accessibile in sedia a rotelle. Il
      centro visite TIC Rinka a Solčava offre mappe, itinerari guidati ed esposizioni tematiche.
    history: >-
      Tra il XII e il XIV secolo il monastero benedettino di Gornji Grad insediò famiglie contadine in queste
      vallate isolate, dando forma al caratteristico paesaggio di masi e fattorie sparse. Al giorno d'oggi il
      fenomeno è opposto: i prati e i pascoli d'altitudine abbandonati vengono progressivamente ricolonizzati
      dalla boscaglia.


      La valle è stata proclamata parco paesaggistico nel 1987 e nel 1992 la comunità locale ha ottenuto la
      concessione per gestirla in forma partecipata. Il parco racchiude 43 emergenze naturali di pregio,
      costituisce un'area ecologicamente rilevante e ricade parzialmente nella rete Natura 2000. Il corso
      superiore della Savinja, tra Logarska dolina e Ljubno, è protetto come monumento naturale. L'ente
      gestore è inoltre impegnato a limitare l'impatto del traffico automobilistico in una delle valli alpine
      più frequentate del paese.
    before: >-
      L'ente parco raccomanda di non allontanarsi dai sentieri tracciati, di tenere i cani al guinzaglio e
      vieta il sorvolo con droni. Molti fiori alpini sono specie protette o rare: il ricordo migliore è una
      fotografia, non un fiore reciso. Il meteo alpino muta repentinamente: indossa calzature da montagna,
      indumenti pesanti di ricambio e porta con te una scorta d'acqua. Una giornata è sufficiente per godersi
      il cammino.
    around: >-
      A sette chilometri si innalzano le [Caravanche / Karawanken](/lugar/karavanke---karawanken/), catena
      montuosa di cui il papavero di Kerner è parimenti endemico.
  pt:
    intro: >-
      O rio Savinja nasce duas vezes. A primeira nascente, límpida e potável, brota a 1.280 metros de altitude
      sob o circo de Okrešelj e precipita-se em direção à cascata de Rinka, de noventa metros. Rapidamente a
      água desaparece debaixo do chão e regressa à superfície mais a jusante, escura devido à argila, na
      nascente de Črna, que representa o seu segundo nascimento. Tudo isto se desenrola em Logarska dolina, um
      vale alpino de origem glaciar nos Alpes de Kamnik e da Savinja, no município de Solčava. Estende-se por
      7 quilómetros de comprimento e 250 metros de largura média, dividindo-se em três partes: Log e Plest,
      formadas por prados, e Kot, coberta sobretudo por arvoredo denso. Foi declarado parque paisagístico em
      1987.
    landscape: >-
      Picos que ultrapassam os 2.000 metros delimitam o vale: Krofička, Ojstrica, Planjava, Brana e Turska
      gora. A configuração atual foi esculpida por um glaciar durante a última glaciação. Os testemunhos
      subsistem por toda a parte. Os grandes blocos rochosos dispersos pelo vale constituem depósitos
      glaciares erráticos deixados pelo recuo dos gelos. Existem moreias laterais até 200 metros acima do
      fundo do vale, testemunhando a espessura máxima atingida pela massa de gelo. A montante da moreia
      terminal formou-se uma lagoa após o recuo do glaciar, cujas argilas formam hoje o solo da planície de
      Log. Uma lenda refere que outrora existiu um lago glaciar em Matkov kot, e a ribeira local conserva
      ainda o nome de Jezera.


      O parque abrange todo o vale até às cristas montanhosas, perfazendo 24,3 quilómetros quadrados e
      congregando 43 valores naturais classificados: cascatas, torres rochosas, grutas, blocos erráticos e
      árvores portentosas. A cascata de Rinka projeta-se num jato estreito sobre um degrau glaciar; Palenk,
      outro monumento natural, tomba setenta e oito metros em socalcos sucessivos, sobretudo após períodos
      chuvosos. A tília de Logar atinge 485 centímetros de perímetro de tronco e 25 metros de altura. A gruta
      Potočka zijalka figura entre os sítios paleontológicos e arqueológicos mais relevantes da Eslovénia. Na
      nascente de Črna, a água ressurge por entre camadas impermeáveis e escorre sobre argilas escuras que lhe
      conferem a coloração negra característica.
    wildlife: >-
      A faia é a árvore mais abundante do vale, surgindo também o abeto-falso em grande densidade. Sob as
      florestas montanas de faias floresce o sapatinho-de-vénus, a maior orquídea nativa da Eslovénia, ao
      passo que nos cascalhais calcários medra a papoila-amarela de Kerner, endemismo dos Alpes de
      Kamnik-Savinja e dos Karavanke.


      No que respeita à avifauna, dois casais de [águia-real](/especie/aquila_chrysaetos/) nidificam nos
      contrafortes rochosos do vale, habitando também o local o
      [falcão-peregrino](/especie/falco_peregrinus/). O [pica-pau-preto](/especie/dryocopus_martius/), o maior
      dos pica-paus europeus, escava cavidades nos troncos que acolhem mais tarde outras espécies da fauna
      florestal. Nos bosques de montanha e nas vertentes alpinas vivem o
      [tetraz-grande](/especie/tetrao_urogallus/), o [galo-lira](/especie/tetrao_tetrix/) e a
      [perdiz-nival](/especie/lagopus_muta/).


      As estações do ano determinam a distribuição dos mamíferos. As [camurças](/especie/rupicapra_rupicapra/)
      povoam os penedos alcantilados no verão e refugiam-se nas vertentes ensolaradas durante o inverno. Os
      [íbexes](/especie/capra_ibex/) habitam as cristas pedregosas de Planjava, Lučka baba e Brana. No fundo
      do vale predomina o [corço](/especie/capreolus_capreolus/), ao qual se juntou recentemente uma população
      residente de [veado-vermelho](/especie/cervus_elaphus/). O [lince-euroasiático](/especie/lynx_lynx/) e o
      [urso-pardo](/especie/ursus_arctos/) constituem visitantes ocasionais e esquivos destas matas.
    visit: >-
      O trilho do vale proporciona um percurso natural e etnográfico que pode ser percorrido autonomamente ou
      com a companhia de guias locais. Estima cerca de duas horas para a ida, com múltiplos acessos ao longo
      da estrada do vale. Durante a caminhada avistam-se a segunda nascente do Savinja, imponentes blocos
      erráticos, uma cabana tradicional de lenhadores e carvoeiros, um posto de observação cinegético e um
      zimbro gigante; o troço intermédio cruza a Floresta dos Contos de Fadas. O ponto alto da rota é a
      cascata de Rinka, uma das mais impressionantes da Eslovénia, que acolhe os caminhantes com ar fresco e
      borrifos de água no sopé da escarpa.


      Um pequeno segmento contíguo ao albergue Dom planincev está adaptado a cadeiras de rodas. O posto de
      turismo TIC Rinka em Solčava faculta mapas, programas culturais, exposições e visitas guiadas.
    history: >-
      Entre os séculos XII e XIV, os monges beneditinos de Gornji Grad fixaram camponeses nestas terras ermas,
      estruturando gradualmente a paisagem de quintas e pastagens dispersas. Atualmente observa-se o fenómeno
      oposto: as pastagens de montanha abandonadas são rapidamente reconquistadas pela floresta espontânea.


      O vale foi classificado como parque paisagístico em 1987, e em 1992 os habitantes locais obtiveram a
      concessão comunitária para gerir a área protegida. O parque engloba 43 valores naturais inventariados,
      constitui uma área ecologicamente relevante e integra parcialmente a rede Natura 2000. O curso superior
      do rio Savinja, entre Logarska dolina e Ljubno, encontra-se classificado como monumento natural. A
      administração empenha-se ainda em atenuar o tráfego automóvel numa das áreas alpinas mais concorridas do
      país.
    before: >-
      A entidade gestora solicita aos visitantes que permaneçam nos trilhos marcados, mantenham os cães com
      trela e proíbe a utilização de drones. Muitas plantas da montanha são protegidas ou raras: a melhor
      recordação é uma fotografia, não um ramo colhido. O tempo muda com rapidez na serra: leva vestuário
      quente, botas de montanha e água. Um dia é suficiente para percorrer o percurso principal.
    around: >-
      A sete quilómetros ergue-se a [Cordilheira de Karavanke / Karawanken](/lugar/karavanke---karawanken/),
      da qual a papoila de Kerner é igualmente uma planta endémica.
