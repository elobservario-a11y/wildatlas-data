resumen:
  es: El cráter volcánico extinto más grande de Europa (10 km de diámetro) cubierto de abetales de alta montaña.
  en: >-
    The largest extinct volcanic crater in Europe (10 km in diameter) covered with high-mountain fir and
    spruce forests.
  fr: Le plus grand cratère volcanique éteint d'Europe (10 km de diamètre) tapissé de pessières d'altitude.
  de: Der größte erloschene Vulkankrater Europas (10 km Durchmesser), bedeckt von hochmontanen Fichtenwäldern.
  it: Il più grande cratere vulcanico estinto d'Europa (10 km di diametro) ammantato di abetine d'alta quota.
  pt: A maior cratera vulcânica extinta da Europa (10 km de diâmetro) coberta por abetais de alta montanha.
unico:
  es: >-
    Una caldera volcánica única en Rumanía y en Europa, con rocas que parecen figuras, un matorral de
    rododendro que tiñe de rosa la cumbre y una cantera de azufre que enseña lo que cuesta cicatrizar una
    montaña.
  en: >-
    A volcanic caldera unique in Romania and Europe, with bizarre rock towers, rhododendron thickets tinting
    the summit pink, and a former sulphur quarry showing the cost of healing a mountain.
  fr: >-
    Une caldeira volcanique sans équivalent en Roumanie et en Europe, aux monolithes étranges, landes à
    rhododendrons qui empourprent les cimes et ancienne mine de soufre montrant la lente guérison d'une
    montagne.
  de: >-
    Eine in Rumänien und Europa einzigartige Caldera mit bizarren Felsgebilden, rosafarben blühenden
    Almrauschhängen und einem Schwefelsteinbruch, der die Wunden einer geschundenen Bergwelt zeigt.
  it: >-
    Una caldera vulcanica unica in Romania e in Europa, con bizzarri torrioni rocciosi, distese di rododendro
    che tingono di rosa la cima e una miniera di zolfo che mostra la lenta guarigione della montagna.
  pt: >-
    Uma caldeira vulcânica sem paralelo na Roménia e na Europa, com monólitos invulgares, charnecas de
    rododendro que tingem o cume de cor-de-rosa e uma pedreira de enxofre que revela a lenta regeneração da
    montanha.
observaciones:
  es: >-
    Consulta el mapa antes de salir y mantente en las rutas turísticas señalizadas. Para entrar con vehículos
    de motor hace falta el permiso escrito de la administración. Se puede acampar solo en las zonas
    habilitadas, y la comida no debe quedar cerca de las tiendas para no atraer a los animales salvajes.
texto:
  es:
    intro: >-
      Un volcán apagado tan grande que se puede caminar dentro de él. Los Călimani guardan el mayor cráter
      volcánico de Rumanía, de unos 10 km de diámetro, rodeado de cumbres de más de 2000 metros: el Pietrosul,
      con 2102 m, es el pico volcánico más alto del país. El parque nacional protege ese anillo, con bosques
      de picea y haya, pino cembro, matorrales subalpinos y pastos alpinos.
    landscape: >-
      Los Călimani se numeran entre los montes volcánicos más jóvenes y más altos de Rumanía. Tras fuertes
      erupciones, hace millones de años, enormes bloques de roca volcánica cayeron al azar y dieron origen a
      rocas de formas extrañas. La roca es sobre todo andesítica, con hornblenda y piroxeno, además de dacitas
      y basaltos. Los conos volcánicos forman un círculo, una caldera que no tiene igual en Rumanía ni en
      Europa.


      Esa roca aflora en las formas más curiosas: los 12 Apóstoles, Pietrele Roșii y Dealul Tătarului. En los
      12 Apóstoles la piedra ha esculpido figuras con nombres como Moșul, Mareșalul, Godzilla, Gușterul,
      Ramses o Dragonii. En su día los vecinos subían el 29 de junio a celebrar a los «Moșii din Călimani»,
      con raíces en un antiguo culto dacio al sol, al abeto y al fuego.


      Una cresta de relieve alpino, con el Pietrosul (2100 m) y el Negoiu Unguresc (2081 m), es la parte más
      alta y espectacular del macizo. A sus pies, bajo el pico Răchitiș, la reserva del lago Iezer protege un
      lago de represa natural con matorrales de pino mugo y enebro.


      Y está la cicatriz. En 1976 se abrió una cantera de azufre que afectó a más de 300 hectáreas de
      vegetación y sustrato. Donde estuvo la explotación queda un paisaje con escombreras, caminos y una
      montaña cortada en escalones, y la vegetación avanza con dificultad por la acidez del sustrato.
    wildlife: >-
      Los estudios del parque registran 1004 especies de plantas vasculares. El pino cembro es un relicto
      glaciar presente en algunos sectores de los Cárpatos rumanos, y de junio a principios de julio las matas
      de rododendro tiñen la zona alta de verde y rosa. El mejor sitio para verlo es el pico Retitis, por el
      sendero de triángulo azul que sale de la antigua explotación de azufre.


      Entre los grandes carnívoros hay [oso pardo](/especie/ursus_arctos/), [lobo](/especie/canis_lupus/) y
      [lince](/especie/lynx_lynx/); la [nutria](/especie/lutra_lutra/), la [marta](/especie/martes_martes/),
      el tejón y el [gato montés](/especie/felis_silvestris/) completan el inventario de mamíferos. El
      [corzo](/especie/capreolus_capreolus/), el [ciervo](/especie/cervus_elaphus/) y el jabalí animan el
      paisaje forestal, y la víbora común es el reptil que la administración destaca.


      La administración señala la berrea del ciervo como una de las épocas destacadas para observar mamíferos.
      Entre los principales atractivos están también el cortejo del [urogallo](/especie/tetrao_urogallus/) y
      la floración del rododendro. Para observar fauna se recomienda ir en grupos pequeños con un guarda guía
      o un biólogo del parque. La nieve domina el paisaje desde noviembre hasta abril o mayo.
    visit: >-
      El centro de visitantes de Șaru Dornei, y dos puntos de información en Panaci y Poiana Stampei, abrieron
      en 2013. Tiene una exposición educativa sobre los valores del parque y un patio con el paisaje y la
      cultura locales, y un sendero temático acondicionado que lleva dos horas por la turbera de Șaru Dornei.


      Entre las rutas, la de punto rojo une Neagra Șarului con los 12 Apóstoli, Iezerul Călimanilor y Rețițiș:
      el recorrido completo lleva entre dieciocho y veintiuna horas y es difícil. La de cruz azul entre Gura
      Haitii, Pietrele Roșii y Dornișoara es moderada y requiere entre siete y ocho horas. La excursión a los
      12 Apóstoles recorre bosques de picea y pastos subalpinos desde Gura Haitii, por Pietrele Roșii, y
      vuelta.


      A la antigua explotación de azufre se va por Vatra Dornei y Gura Hăitii (unos 25 km) y luego unos 12 km
      más por camino de hormigón; el acceso en coche llega solo hasta el aparcamiento habilitado.
    history: >-
      El parque se declaró en 1990, con 15.300 ha, y se oficializó con la ley de 2000, con 24.041 ha. Dentro
      hay tres reservas: la científica de matorral de pino mugo con pino cembro, la del lago Iezer y la
      geológica de los 12 Apóstoles. Cada año la administración organiza eventos con voluntarios.
    before: >-
      Consulta el mapa antes de salir y mantente en las rutas turísticas señalizadas. Para entrar con
      vehículos de motor hace falta el permiso escrito de la administración. Se puede acampar solo en las
      zonas habilitadas, y la comida no debe quedar cerca de las tiendas para no atraer a los animales
      salvajes.
    around: >-
      Con el [Parque Nacional Retezat](/lugar/parcul-national-retezat---masivul-muntos/) comparte víbora
      común, marta y urogallo, y bosques maduros y alta montaña; con el [Macizo de
      Vlădeasa](/lugar/masivul-vladeasa/), marta, gato montés y nutria.
  en:
    intro: >-
      An extinct volcano so vast you can hike inside it. The Călimani shelter Romania's largest volcanic
      crater, around 10 km in diameter, encircled by peaks exceeding 2000 metres: Pietrosul, at 2102 m, is the
      country's tallest volcanic summit. The national park safeguards this ring, blanketed in spruce and beech
      forests, Swiss stone pine, subalpine scrub, and alpine pastures.
    landscape: >-
      The Călimani rank among Romania's youngest and highest volcanic ranges. After catastrophic eruptions
      millions of years ago, massive blocks of volcanic rock tumbled haphazardly, giving rise to strangely
      sculpted crags. The rock is predominantly andesite, rich in hornblende and pyroxene, alongside dacites
      and basalts. The volcanic cones encircle a caldera unrivaled in Romania and Europe.


      This rock emerges in curious configurations: the 12 Apostles, Pietrele Roșii, and Dealul Tătarului. At
      the 12 Apostles, the stone has carved human-like effigies named Moșul, Mareșalul, Godzilla, Gușterul,
      Ramses, and Dragonii. Historically, locals ascended on 29 June to celebrate "Moșii din Călimani", rooted
      in an ancient Dacian cult of sun, fir, and fire.


      An alpine crest holding Pietrosul (2100 m) and Negoiu Unguresc (2081 m) forms the massif's highest, most
      dramatic sector. At its base beneath Răchitiș peak, the Lake Iezer reserve protects a naturally dammed
      tarn framed by mountain pine and juniper scrub.


      And there is the scar. In 1976 an open-pit sulphur quarry commenced operations, affecting over 300
      hectares of vegetation and topsoil. The former works left behind spoil heaps, access tracks, and a
      terraced hillside where plant life struggles against substrate acidity.
    wildlife: >-
      Park surveys document 1004 vascular plant species. Swiss stone pine is a glacial relict present in
      select Romanian Carpathian massifs, and from June to early July swathes of blooming rhododendron paint
      the heights in green and pink. The finest vantage point is Retitis peak, reached via the blue-triangle
      trail ascending from the former sulphur mine.


      Large carnivores include the [brown bear](/especie/ursus_arctos/), [grey wolf](/especie/canis_lupus/),
      and [Eurasian lynx](/especie/lynx_lynx/); the [Eurasian otter](/especie/lutra_lutra/), [European pine
      marten](/especie/martes_martes/), badger, and [European wildcat](/especie/felis_silvestris/) round out
      the mammalian roster. The [roe deer](/especie/capreolus_capreolus/), [red
      deer](/especie/cervus_elaphus/), and wild boar animate the forest expanses, while the common viper is
      highlighted among reptiles.


      The administration highlights the autumn deer rut as a prime period for mammal observation. Further
      seasonal highlights include the lekking displays of the [western
      capercaillie](/especie/tetrao_urogallus/) and the rhododendron bloom. For wildlife watching, visiting in
      small groups accompanied by a ranger or park biologist is strongly advised. Snow dominates the landscape
      from November through April or May.
    visit: >-
      The visitor centre in Șaru Dornei and two info points in Panaci and Poiana Stampei opened in 2013. The
      main centre houses educational exhibits on park heritage and a courtyard showcasing local crafts and
      landscapes, alongside an interpretive boardwalk requiring two hours through the Șaru Dornei peat bog.


      Among the hiking trails, the red-dot route connects Neagra Șarului with the 12 Apostles, Iezerul
      Călimanilor, and Rețițiș: completing the entire route takes between eighteen and twenty-one hours and is
      strenuous. The blue-cross trail between Gura Haitii, Pietrele Roșii, and Dornișoara is moderate,
      requiring seven to eight hours. The day outing to the 12 Apostles winds through spruce woods and
      subalpine pastures from Gura Haitii via Pietrele Roșii and back.


      The former sulphur mine is reached via Vatra Dornei and Gura Hăitii (about 25 km) followed by roughly 12
      km along a concrete road; vehicular access ends at the designated parking area.
    history: >-
      The park was initially declared in 1990, spanning 15,300 ha, and officially established under law in
      2000, covering 24,041 ha. Inside lie three reserves: the scientific mountain pine and Swiss pine
      reserve, the Lake Iezer reserve, and the geological 12 Apostles reserve. Each year park authorities
      organize volunteer conservation initiatives.
    before: >-
      Due to severe substrate acidity around the old sulphur quarry, stay strictly on marked paths. In bear
      territory, make noise while walking and avoid travelling at dusk. Dress in layers, as weather changes
      abruptly on the caldera rim.
    around: >-
      With [Retezat National Park](/lugar/parcul-national-retezat---masivul-muntos/) it shares the common
      viper, marten, and capercaillie, as well as old-growth forests and high-alpine realms; with the
      [Vlădeasa Massif](/lugar/masivul-vladeasa/), marten, wildcat, and otter.
  fr:
    intro: >-
      Un volcan éteint si immense que l'on peut marcher en son sein. Les Călimani abritent le plus grand
      cratère volcanique de Roumanie, d'environ 10 km de diamètre, ceinturé de crêtes dépassant 2000 mètres :
      le Pietrosul, avec 2102 m, est le point culminant volcanique du pays. Le parc national protège cette
      couronne, couverte d'épicéas et de hêtres, de pins cembros, de landes subalpines et d'alpages.
    landscape: >-
      Les Călimani comptent parmi les massifs volcaniques les plus jeunes et les plus élevés de Roumanie. À la
      suite d'éruptions titanesques il y a des millions d'années, d'énormes blocs de lave se sont abattus
      pêle-mêle pour sculpter des figures étranges. La roche est surtout andésitique, riche en hornblende et
      pyroxène, côtoyant dacites et basaltes. Les cônes dessinent un cercle, une caldeira sans pareille en
      Roumanie comme en Europe.


      Ce substrat rocheux émerge en reliefs étonnants : les 12 Apôtres, Pietrele Roșii et Dealul Tătarului.
      Aux 12 Apôtres, l'érosion a taillé des silhouettes anthropomorphes baptisées Moșul, Mareșalul, Godzilla,
      Gușterul, Ramses ou Dragonii. Jadis, les villageois y montaient le 29 juin célébrer les « Moșii din
      Călimani », perpétuant un culte dace séculaire voué au soleil, au sapin et au feu.


      Une arête alpine coiffée par le Pietrosul (2100 m) et le Negoiu Unguresc (2081 m) forme le secteur le
      plus haut et le plus grandiose. À ses pieds, sous le pic Răchitiș, la réserve du lac Iezer abrite un
      plan d'eau de barrage naturel ceint de pins nains et de genévriers.


      Et demeure la cicatrice. En 1976 fut ouverte une carrière de soufre à ciel ouvert ayant décapé plus de
      300 hectares de sol et de flore. De cette exploitation subsiste un paysage d'éboulis, de pistes et de
      gradins taillés à vif, où la végétation peine à regagner du terrain sous l'effet de l'acidité.
    wildlife: >-
      Les inventaires du parc recensent 1004 espèces de plantes vasculaires. Le pin cembro constitue une
      relique glaciaire propre à certains massifs des Carpates roumaines, et de juin à début juillet les
      massifs de rhododendrons parent les hauteurs de vert et de pourpre. Le meilleur belvédère est le pic
      Retitis, accessible par le tracé au triangle bleu depuis l'ancienne exploitation de soufre.


      Parmi les grands prédateurs figurent l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/) ; la [loutre
      d'Europe](/especie/lutra_lutra/), la [martre des pins](/especie/martes_martes/), le blaireau et le [chat
      sauvage](/especie/felis_silvestris/) complètent ce cortège. Le
      [chevreuil](/especie/capreolus_capreolus/), le [cerf élaphe](/especie/cervus_elaphus/) et le sanglier
      animent les futaies, tandis que la vipère péliade est le reptile le plus représentatif.


      La direction met en avant le brame du cerf à l'automne pour l'observation des grands mammifères. Parmi
      les autres rendez-vous majeurs figurent la parade du [grand tétras](/especie/tetrao_urogallus/) et la
      floraison des rhododendrons. Pour observer la faune, il est recommandé de se faire accompagner d'un
      garde ou d'un biologiste du parc. La neige fige le paysage de novembre jusqu'en avril ou mai.
    visit: >-
      Le centre de visiteurs de Șaru Dornei et deux points d'information à Panaci et Poiana Stampei ont ouvert
      en 2013. Il propose une exposition didactique sur les patrimoines du parc, une cour valorisant les
      traditions locales et un sentier aménagé de deux heures à travers la tourbière de Șaru Dornei.


      Parmi les randonnées, le balisage au point rouge relie Neagra Șarului aux 12 Apôtres, à l'Iezerul
      Călimanilor et au Rețițiș : la boucle intégrale demande dix-huit à vingt-et-une heures et s'avère
      sportive. Le sentier à la croix bleue entre Gura Haitii, Pietrele Roșii et Dornișoara est modéré et
      prend sept à huit heures. L'excursion classique aux 12 Apôtres monte au milieu des pessières et alpages
      depuis Gura Haitii par Pietrele Roșii avant de revenir au départ.


      L'ancienne mine de soufre s'atteint via Vatra Dornei et Gura Hăitii (environ 25 km) puis 12 km de route
      bétonnée ; les véhicules doivent stationner au parking aménagé.
    history: >-
      Le parc fut esquissé en 1990 avec 15 300 ha, avant d'être légalement institué en 2000 avec 24 041 ha. Il
      englobe trois réserves : la réserve scientifique de pin mugo et pin cembro, celle du lac Iezer et la
      réserve géologique des 12 Apôtres. Chaque année, la direction réunit des bénévoles pour des chantiers
      écologiques.
    before: >-
      En raison de la forte acidité résiduelle autour de l'ancienne carrière de soufre, veillez à ne jamais
      vous écarter des sentiers balisés. En zone d'ours, progressez en faisant du bruit et évitez les sorties
      au crépuscule. Prévoyez des vêtements chauds.
    around: >-
      Avec le [parc national de Retezat](/lugar/parcul-national-retezat---masivul-muntos/), il partage la
      vipère péliade, la martre, le grand tétras, les vieilles forêts et la haute montagne ; avec le [massif
      de Vlădeasa](/lugar/masivul-vladeasa/), la martre, le chat sauvage et la loutre.
  de:
    intro: >-
      Ein erloschener Vulkan von solchen Ausmaßen, dass man in seinem Inneren wandern kann. Das
      Călimani-Gebirge birgt Rumäniens größten Vulkankrater mit rund 10 km Durchmesser, umringt von über 2000
      Meter hohen Gipfeln: Der Pietrosul ist mit 2102 m die höchste vulkanische Erhebung des Landes. Der
      Nationalpark schützt diesen Ring samt Fichten- und Buchenwäldern, Zirben, Krummholz und alpinen Matten.
    landscape: >-
      Die Călimani zählen zu den jüngsten und höchsten Vulkanbergen Rumäniens. Nach gewaltigen Eruptionen vor
      Jahrmillionen stürzten riesige Lavablöcke herab und bildeten skurrile Steingestalten. Das Gestein
      besteht vorwiegend aus Hornblende- und Pyroxen-Andesiten neben Daziten und Basalten. Die Kraterkämme
      schließen sich zu einer Caldera zusammen, die in Rumänien und Europa ihresgleichen sucht.


      Diese Gesteinswelt tritt in verblüffenden Formen zutage: die 12 Apostel, Pietrele Roșii und Dealul
      Tătarului. An den 12 Aposteln schuf die Verwitterung Skulpturen mit Namen wie Moșul, Mareșalul,
      Godzilla, Gușterul, Ramses oder Dragonii. Einst stiegen Einheimische am 29. Juni auf, um die „Moșii din
      Călimani“ zu feiern – ein Brauch, der auf dakische Sonnen-, Tannen- und Feuerkulte zurückgeht.


      Ein alpiner Grat mit Pietrosul (2100 m) und Negoiu Unguresc (2081 m) bildet den höchsten und
      spektakulärsten Abschnitt. Zu seinen Füßen unterhalb des Răchitiș schützt das Iezer-Reservat einen
      natürlich aufgestauten Bergsee inmitten von Latschen- und Wacholderbüschen.


      Und da ist die Narbe. Im Jahr 1976 wurde ein Schwefeltagebau eröffnet, der über 300 Hektar Bergflanke
      verwüstete. Zurück blieben Abraumhalden, Schotterpisten und ein terrassierter Berg, auf dem sich die
      Vegetation wegen des sauren Untergrunds nur mühsam erholt.
    wildlife: >-
      Untersuchungen im Park verzeichnen 1004 Gefäßpflanzenarten. Die Zirbelkiefer ist ein eiszeitliches
      Relikt einiger rumänischer Karpatenstriche, und von Juni bis Anfang Juli hüllen üppige
      Rhododendronpolster die Kammlagen in sattes Rosa. Den besten Ausblick bietet der Retitis-Gipfel, den man
      über den Wanderweg mit blauem Dreieck vom ehemaligen Schwefelbruch aus erreicht.


      Zu den großen Beutegreifern zählen [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und
      [Eurasischer Luchs](/especie/lynx_lynx/); [Eurasischer Fischotter](/especie/lutra_lutra/),
      [Baummarder](/especie/martes_martes/), Dachs und [Wildkatze](/especie/felis_silvestris/) komplettieren
      das Inventar. [Reh](/especie/capreolus_capreolus/), [Rothirsch](/especie/cervus_elaphus/) und
      Wildschwein beleben die Nadelwälder, während die Kreuzotter die bemerkenswerteste Reptilienart stellt.


      Die Parkverwaltung empfiehlt die herbstliche Hirschbrunft als Höhepunkt zur Wildbeobachtung. Weitere
      Höhepunkte sind die Balz des [Auerhuhns](/especie/tetrao_urogallus/) und die Almrauschblüte. Für
      Tierbeobachtungen wird die Begleitung durch Ranger oder Biologen angeraten. Schnee prägt die Landschaft
      von November bis April oder Mai.
    visit: >-
      Das Besucherzentrum in Șaru Dornei und zwei Infostellen in Panaci und Poiana Stampei wurden 2013
      eröffnet. Es beherbergt eine Schau zur Natur des Parks und einen Lehrpfad, der zwei Stunden durch das
      Moor von Șaru Dornei führt.


      Unter den Wanderrouten verbindet jene mit rotem Punkt Neagra Șarului mit den 12 Aposteln, dem Iezerul
      Călimanilor und dem Rețițiș: Die Gesamttour erfordert achtzehn bis einundzwanzig Stunden und ist
      anspruchsvoll. Die Route mit blauem Kreuz zwischen Gura Haitii, Pietrele Roșii und Dornișoara ist
      mittelschwer und beansprucht sieben bis acht Stunden. Die Wanderung zu den 12 Aposteln führt durch
      Fichtenwälder und Bergweiden von Gura Haitii über Pietrele Roșii und zurück.


      Zum alten Schwefelbruch gelangt man über Vatra Dornei und Gura Hăitii (rund 25 km) sowie weitere 12 km
      über eine Betonstraße; die Zufahrt endet am Wanderparkplatz.
    history: >-
      Der Park wurde 1990 mit 15.300 ha ausgewiesen und durch das Gesetz im Jahr 2000 auf 24.041 ha
      vergrößert. Er umfasst drei Reservate: das wissenschaftliche Krummholz- und Zirbenreservat, den
      Iezer-See und das Georeservat der 12 Apostel. Regelmäßig finden Freiwilligeneinsätze statt.
    before: >-
      Bleibe wegen der starken Schwefelazidität an der Tagebaugrube stets auf den markierten Pfaden. Im
      Bärengebiet solltest du dich durch Reden bemerkbar machen und Dämmerungsstunden meiden. Nimm warme
      Kleidung mit.
    around: >-
      Mit dem [Nationalpark Retezat](/lugar/parcul-national-retezat---masivul-muntos/) teilt er Kreuzotter,
      Marder, Auerhuhn sowie Urwälder und Hochgebirge; mit dem [Vlădeasa-Massiv](/lugar/masivul-vladeasa/)
      Marder, Wildkatze und Fischotter.
  it:
    intro: >-
      Un vulcano spento così grande da poterci camminare dentro. I Călimani racchiudono il maggiore cratere
      vulcanico della Romania, di circa 10 km di diametro, cinto da vette superiori ai 2000 metri: il
      Pietrosul, con 2102 m, è la cima vulcanica più alta del paese. Il parco nazionale tutela questa corona,
      rivestita da boschi di abete rosso e faggio, pino cembro, brughiere subalpine e pascoli alpini.
    landscape: >-
      I Călimani rientrano tra i massicci vulcanici più giovani e più alti della Romania. In seguito a
      violente eruzioni di milioni di anni fa, enormi colate di roccia lavica si depositarono caoticamente
      dando vita a curiose sculture naturali. Il basamento è prevalentemente andesitico, ricco di orneblenda e
      pirosseni, oltre a daciti e basalti. I coni vulcanici descrivono un cerchio, una caldera che non ha
      eguali in Romania né in Europa.


      Questa roccia affiora in sagome bizzarre: i 12 Apostoli, Pietrele Roșii e Dealul Tătarului. Presso i 12
      Apostoli la pietra ha plasmato figure con nomi quali Moșul, Mareșalul, Godzilla, Gușterul, Ramses o
      Dragonii. Un tempo gli abitanti salivano il 29 giugno per celebrare i «Moșii din Călimani», rito legato
      a un antico culto dacico del sole, dell'abete e del fuoco.


      Una cresta dal profilo alpino, con il Pietrosul (2100 m) e il Negoiu Unguresc (2081 m), costituisce il
      settore più alto e spettacolare. Ai suoi piedi, sotto la vetta del Răchitiș, la riserva del lago Iezer
      tutela uno specchio lacustre di sbarramento naturale orlato da pino mugo e ginepro.


      E poi c'è la ferita. Nel 1976 fu aperta una cava di zolfo a cielo aperto che intaccò oltre 300 ettari di
      cotone erboso e suolo. Nel sito dell'escavazione rimane un paesaggio di detriti, piste e pendici
      scalinate, dove la vegetazione stenta a riprendersi per l'elevata acidità.
    wildlife: >-
      Le ricerche del parco registrano 1004 specie di piante vascolari. Il pino cembro è un relitto glaciale
      circoscritto ad alcuni settori dei Carpazi rumeni, e da giugno a inizio luglio le macchie di rododendro
      tingono la sommità di verde e rosa. Il punto ideale per osservarle è il picco Retitis, lungo il sentiero
      a triangolo blu che risale dall'ex miniera di zolfo.


      Tra i grandi carnivori allignano l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/) e la [lince](/especie/lynx_lynx/); la [lontra
      europea](/especie/lutra_lutra/), la [martora](/especie/martes_martes/), il tasso e il [gatto
      selvatico](/especie/felis_silvestris/) completano il quadro dei mammiferi. Il
      [capriolo](/especie/capreolus_capreolus/), il [cervo](/especie/cervus_elaphus/) e il cinghiale popolano
      le abetine, mentre il marasso è il rettile posto in risalto dall'ente parco.


      L'amministrazione segnala il bramito autunnale del cervo come momento culminante per avvistare la fauna.
      Tra le attrattive spiccano anche le parate nuziali dell'[urogallo](/especie/tetrao_urogallus/) e la
      fioritura del rododendro. Per l'avvistamento faunistico si consiglia di muoversi in piccoli gruppi con
      una guida del parco. La coltre nevosa permane da novembre fino ad aprile o maggio.
    visit: >-
      Il centro visite di Șaru Dornei e due punti informativi a Panaci e Poiana Stampei hanno aperto nel 2013.
      Ospita una mostra divulgativa sui valori dell'area e una corte con le tradizioni locali, con un percorso
      guidato di due ore nella torbiera di Șaru Dornei.


      Tra i sentieri escursionistici, la traccia a punto rosso unisce Neagra Șarului ai 12 Apostoli, a Iezerul
      Călimanilor e a Rețițiș: la traversata totale richiede tra diciotto e ventuno ore ed è impegnativa.
      L'itinerario a croce blu tra Gura Haitii, Pietrele Roșii e Dornișoara è moderato e impegna sette-otto
      ore. L'escursione classica ai 12 Apostoli attraversa abetine e praterie da Gura Haitii via Pietrele
      Roșii con rientro.


      All'ex cava di zolfo si giunge da Vatra Dornei e Gura Hăitii (circa 25 km) e poi per altri 12 km su
      carreggiata in calcestruzzo; il transito veicolare termina al posteggio designato.
    history: >-
      Il parco fu istituito nel 1990 su 15.300 ha e sancito per legge nel 2000 con 24.041 ha. Al suo interno
      comprende tre riserve: quella scientifica a pino mugo e pino cembro, quella del lago Iezer e la riserva
      geologica dei 12 Apostoli. Ogni anno il parco promuove cantieri di volontariato.
    before: >-
      A causa dell'acidità residua del terreno attorno alla vecchia miniera di zolfo, resta rigidamente sui
      tracciati segnati. Nelle aree frequentate dall'orso cammina segnalando la tua presenza ed evita le ore
      crepuscolari. Indossa abiti adatti alla quota.
    around: >-
      Con il [Parco Nazionale Retezat](/lugar/parcul-national-retezat---masivul-muntos/) condivide il marasso,
      la martora, l'urogallo, nonché foreste vetuste e ambiente d'alta quota; con il [Massiccio di
      Vlădeasa](/lugar/masivul-vladeasa/), martora, gatto selvatico e lontra.
  pt:
    intro: >-
      Um vulcão extinto tão vasto que se pode caminhar no seu interior. Os Călimani encerram a maior cratera
      vulcânica da Roménia, com cerca de 10 km de diâmetro, ladeada por picos que superam os 2000 metros: o
      Pietrosul, com 2102 m, é o cume vulcânico mais alto do país. O parque nacional resguarda este anel,
      recoberto por matas de abeto-falso e faia, pinheiro-suíço, matos subalpinos e pastagens de altitude.
    landscape: >-
      Os Călimani contam-se entre as montanhas vulcânicas mais jovens e mais altas da Roménia. Após erupções
      colossais ocorridas há milhões de anos, enormes blocos de rocha vulcânica tombaram desordenadamente
      dando origem a penedos de contornos singulares. A rocha é mormente andesítica, rica em horneblenda e
      piroxena, a par de dacitos e basaltos. Os cones vulcânicos dispõem-se em círculo, numa caldeira sem
      igual na Roménia nem na Europa.


      Essa formação pétrea aflora em figuras bizarras: os 12 Apóstolos, Pietrele Roșii e Dealul Tătarului. Nos
      12 Apóstolos o vento esculpiu efígies a que chamaram Moșul, Mareșalul, Godzilla, Gușterul, Ramses ou
      Dragonii. Outrora as populações subiam a 29 de junho para saudar os «Moșii din Călimani», festa
      enraizada num ancestral culto dácico ao sol, ao abeto e ao fogo.


      Uma crista de relevo alpino, encimada pelo Pietrosul (2100 m) e pelo Negoiu Unguresc (2081 m), constitui
      o troço mais alpestre e majestoso. Na base, sob o pico Răchitiș, a reserva do lago Iezer protege uma
      lagoa de represa natural ladeada por pinheiro-anão e zimbro.


      E existe a cicatriz. Em 1976 iniciou-se a exploração de uma pedreira de enxofre a céu aberto que
      devastou mais de 300 hectares de vegetação e solo. Desse passado resta uma paisagem de escombreiras,
      pistas e uma encosta talhada em socalcos onde as plantas teimam em brotar perante a acidez.
    wildlife: >-
      Os levantamentos do parque inventariam 1004 espécies de plantas vasculares. O pinheiro-suíço é uma
      relíquia glaciar restrita a certos maciços dos Cárpatos romenos, e de junho ao começo de julho extensas
      manchas de rododendro pintam as alturas de verde e cor-de-rosa. O melhor miradouro para contemplar a
      floração é o pico Retitis, subindo pelo trilho de triângulo azul que arranca da antiga mina de enxofre.


      Entre os grandes predadores habitam o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/); a
      [lontra-europeia](/especie/lutra_lutra/), a [marta do pinheiro europeia](/especie/martes_martes/), o
      texugo e o [gato-bravo](/especie/felis_silvestris/) completam o elenco de mamíferos. A
      [corça](/especie/capreolus_capreolus/), o [veado-vermelho](/especie/cervus_elaphus/) e o javali povoam o
      arvoredo, sendo a víbora-comum o réptil em destaque.


      A administração salienta a brama do veado no outono como um dos momentos áureos para observação
      faunística. Outros atrativos incluem as exibições do [tetraz-grande](/especie/tetrao_urogallus/) e a
      floração do rododendro. Para avistar fauna aconselha-se integrar grupos pequenos acompanhados por um
      guarda do parque. A neve impera na paisagem de novembro até abril ou maio.
    visit: >-
      O centro de interpretação de Șaru Dornei e dois postos informativos em Panaci e Poiana Stampei foram
      inaugurados em 2013. O centro possui uma mostra pedagógica sobre o património natural e um pátio
      etnográfico, contando ainda com um passadiço interpretativo de duas horas através da turfeira de Șaru
      Dornei.


      Entre os percursos pedestres, a marcação de ponto vermelho une Neagra Șarului aos 12 Apóstolos, a
      Iezerul Călimanilor e a Rețițiș: a travessia integral demora dezoito a vinte e uma horas e é exigente. A
      rota de cruz azul entre Gura Haitii, Pietrele Roșii e Dornișoara é moderada e requer sete a oito horas.
      A caminhada aos 12 Apóstolos cruza abetais e pastagens alpinas desde Gura Haitii passando por Pietrele
      Roșii antes de regressar.


      À antiga mina de enxofre acede-se via Vatra Dornei e Gura Hăitii (cerca de 25 km), seguindo-se mais 12
      km em estrada de betão; o tráfego automóvel encerra no parque de estacionamento.
    history: >-
      O parque começou a ser delineado em 1990 com 15.300 ha e foi oficializado por lei no ano 2000 com 24.041
      ha. Abrange três reservas: a científica de pinheiro-anão e pinheiro-suíço, a do lago Iezer e a reserva
      geológica dos 12 Apóstolos. Realizam-se anualmente ações com voluntários.
    before: >-
      Devido à acidez persistente em redor da antiga exploração de enxofre, caminha estritamente pelos trilhos
      marcados. Em habitat de urso avança fazendo ruído e evita as horas do crepúsculo. Veste roupa quente
      para o cume.
    around: >-
      Com o [Parque Nacional Retezat](/lugar/parcul-national-retezat---masivul-muntos/) partilha a
      víbora-comum, a marta, o tetraz-grande, matas maduras e alta montanha; com o [Maciço de
      Vlădeasa](/lugar/masivul-vladeasa/), a marta, o gato-bravo e a lontra.
