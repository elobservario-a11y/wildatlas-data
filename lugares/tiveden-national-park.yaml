resumen:
  es: >-
    Caótica selva de bloques erráticos de granito cubiertos de musgo y pinos centenarios entre los grandes
    lagos Vänern y Vättern.
  en: >-
    A chaotic wild maze of moss-cloaked granite boulder fields and centuries-old pines between lakes Vänern
    and Vättern.
  fr: >-
    Labyrinthe chaotique de blocs de granite erratiques moussus et de pins pluricentenaires entre les grands
    lacs Vänern et Vättern.
  de: >-
    Chaotische Wildnis aus moosüberzogenen Granit-Findlingen und uralten Kiefern zwischen den großen Seen
    Vänern und Vättern.
  it: >-
    Caotico labirinto di massi erratici di granito ammantati di muschio e pini secolari tra i grandi laghi
    Vänern e Vättern.
  pt: >-
    Caótico labirinto de blocos erráticos de granito cobertos de musgo e pinheiros seculares entre os grandes
    lagos Vänern e Vättern.
unico:
  es: >-
    Es un bosque de pinos viejos, modelado por el fuego, sembrado de bloques que trajo el hielo y encajado en
    un granito que se rompió en cuadrícula.
  en: >-
    An ancient pine forest shaped by fire, strewn with ice-transported boulders and carved into granite
    fractured into a grid.
  fr: >-
    Une forêt de pins séculaires modelée par le feu, semée de blocs abandonnés par les glaces et incrustée
    dans un granite fracturé en damier.
  de: >-
    Ein urzeitlicher Kiefernwald, durch Feuer geformt, übersät mit gletscherverfrachteten Riesenblöcken und
    eingebettet in rasterartig geklüfteten Granit.
  it: >-
    Un bosco vetusto di pini modellato dal fuoco, costellato di massi trasportati dai ghiacci e incassato in
    un granito fratturato a scacchiera.
  pt: >-
    Uma floresta antiga de pinheiros moldada pelo fogo, semeada de megálitos glaciares e cravada num granito
    fraturado em grelha.
observaciones:
  es: >-
    No hay electricidad ni agua potable en el parque. Junto a la caseta de información de la entrada principal
    hay un pozo con bomba manual, pero su agua no está analizada. En temporada alta, de junio a septiembre,
    hay más gente al mediodía, entre las 11:00 y las 14:00; la entrada de Vitsand ofrece otro aparcamiento.


    Las normas son claras. Los perros van atados. Solo puedes acampar una noche en las zonas designadas, entre
    las 18.00 y las 10.00. Está prohibido encender fuego fuera de las zonas designadas, acercarse a nidos de
    rapaces o a madrigueras, y usar embarcaciones a motor. Puedes recoger bayas y setas comestibles; para
    plantas, musgos o líquenes necesitas permiso. Las tres entradas son accesibles y hay rampas hasta un
    mirador y hasta un cabo del lago.
texto:
  es:
    intro: >-
      Imagina un bosque donde el suelo es una cuadrícula de grietas, los lagos ocupan las fracturas y bloques
      de roca más altos que una casa descansan donde los dejó el hielo. Eso es Tiveden, entre los grandes
      lagos Vättern y Vänern, en la frontera de las provincias de Västergötland y Närke. Es un parque nacional
      desde 1983 y sigue siendo uno de los bosques más salvajes del sur de Suecia: un lugar para caminar entre
      pinos viejos, musgo y piedra, y para entender por qué la gente inventó aquí cuentos de trolls.
    landscape: >-
      Todo empieza en el granito. Cuando se formó el Vättern, hace entre 900 y 1 400 millones de años, la roca
      de Tiveden se agrietó en un patrón de cuadrícula que todavía se ve. En las fracturas quedaron los lagos
      y las turberas; los tramos de roca entera se quedaron como cerros empinados.


      Luego llegó el hielo. El casquete continental, que se fundió hace unos 11.000 años, arrancó piedras y
      las dejó repartidas sobre las rocas. Los bloques más grandes y numerosos acabaron en los valles de
      fractura, y de ahí los enormes campos de piedras, como el de Stenkälla. El agua de deshielo se llevó
      casi todo el material suelto y dejó solo lo grande. Hay bloques de hasta diez metros de altura y cuevas
      entre las piedras.


      La vida se aferra a lo poco que hay. Sobre la roca desnuda solo resiste el pino, y crece despacio; a
      veces el suelo es solo una alfombra de líquenes. Donde hay algo más de tierra entra el abeto, y los
      árboles de hoja ancha escasean. Quedan además trozos de bosque de pino muy viejo, abierto y modelado por
      el fuego, con una diversidad biológica altísima, de lo poco que hay así en el sur de Suecia. Como los
      acantilados, la roca madre y una protección temprana mantuvieron lejos la silvicultura moderna, aquí se
      deja que el bosque avance hacia bosque natural. En las turberas aparece el abedul enano, un arbusto que
      en Suecia se encuentra sobre todo en Norrland.
    wildlife: >-
      Tiveden es un límite biológico entre especies del norte y del sur. Por eso conviven el
      [urogallo](/especie/tetrao_urogallus/) y el [mochuelo chico](/especie/glaucidium_passerinum/) con varios
      pájaros carpinteros, y el [pico tridáctilo](/especie/picoides_tridactylus/) está aquí cerca del sur de
      su área. El [alce](/especie/alces_alces/) y el [corzo](/especie/capreolus_capreolus/) son escasos; sí
      hay zorro, tejón, marta y ardilla. También ha llegado el [castor](/especie/castor_fiber/), que a veces
      embalsa arroyos y zanjas junto a las carreteras del parque. El parque guarda además más de 770 especies
      de escarabajos.


      El año reparte los atractivos. En primavera, el verde nuevo y las aves; con suerte, en una mañana de
      principios de verano, un urogallo en plena exhibición nupcial. En verano, caminas sobre la roca
      calentada por el sol y te bañas en el Trehörningen desde la playa de Vitsand, y entre los bloques y las
      cuevas de los valles encuentras sombra. En octubre los árboles de hoja caduca ponen color y el aire
      claro abre vistas lejanas. En invierno llegar es más difícil, pero puedes ver el hielo de Stigmanspasset
      o caminar con botas o raquetas por el bosque en silencio.
    visit: >-
      Casi todo empieza en la entrada principal, en el centro del parque: hay aparcamiento, aseos, información
      y una exposición, y de allí salen la mayoría de los senderos. Hay otras dos entradas, Vitsand y Ösjönäs.
      Los senderos señalizados suman más de 34 km, con bajadas a grietas profundas y subidas a crestas
      cubiertas de líquenes. Muchos son duros.


      Si tienes poco tiempo, Stenkällerundan (2,2 km, hora y media) es la más popular y lleva a un bosque
      viejo moldeado por antiguos incendios y a los bloques del hielo; la formación de Stenkällan, «el templo
      de roca», es una excursión clásica desde finales del siglo XIX. Trollkyrkorundan (4,6 km, unas tres
      horas) sube a varias colinas, entre ellas Stora Trollkyrkan y Lilla Trollkyrkan, las cimas más
      conocidas, y tiene estaciones numeradas con información. Stigmansrundan (4,2 km) baja al desfiladero de
      Stigmanspasset. Oxögabergsrundan (6,7 km) recorre abetales húmedos, valles encharcados y bosque de
      urogallo. La Trehörningsrundan, de 9,5 km, rodea el lago y permite ver la mayoría de los hábitats. Y
      Mellannäsrundan (1,9 km) es la más fácil: en Mellannäsudden verás restos de la producción de carbón
      vegetal y alquitrán de antiguas ferrerías.


      Por la parte oriental pasa Bergslagsleden, una ruta de larga distancia de 280 km, y se puede llegar
      caminando, en bicicleta o a caballo desde la aldea de Tived. En los alrededores hay unos 150 km de rutas
      ciclistas señalizadas y más de 300 km de senderos para caballos.
    history: >-
      A comienzos de la Edad Media, el bosque de Tiveden fue refugio de proscritos. Su paisaje de grietas,
      bloques y cuevas dio pie a cuentos con trolls, enanos y criaturas fantásticas.


      El parque nació en 1983 con unas 1.350 hectáreas y se amplió en 2017 hasta unas 2.030, con una ruta
      nueva alrededor del Stora Trehörningen y dos entradas más, en Vitsand y Ösjönäs. Su objetivo es
      conservar casi intacto un paisaje continuo de bosques, lagos y valles de fractura, y dejar que el bosque
      evolucione hacia bosque primario. Para mantener el pino viejo se recurre a la quema prescrita, que
      favorece al pino y reduce el abeto.
    before: >-
      No hay electricidad ni agua potable en el parque. Junto a la caseta de información de la entrada
      principal hay un pozo con bomba manual, pero su agua no está analizada. En temporada alta, de junio a
      septiembre, hay más gente al mediodía, entre las 11:00 y las 14:00; la entrada de Vitsand ofrece otro
      aparcamiento.


      Las normas son claras. Los perros van atados. Solo puedes acampar una noche en las zonas designadas,
      entre las 18.00 y las 10.00. Está prohibido encender fuego fuera de las zonas designadas, acercarse a
      nidos de rapaces o a madrigueras, y usar embarcaciones a motor. Puedes recoger bayas y setas
      comestibles; para plantas, musgos o líquenes necesitas permiso. Las tres entradas son accesibles y hay
      rampas hasta un mirador y hasta un cabo del lago.
  en:
    intro: >-
      Imagine a forest where the ground is a grid of deep chasms, lakes fill the fractures, and rock boulders
      larger than houses rest exactly where the glacier abandoned them. That is Tiveden, lying between the
      great lakes Vättern and Vänern on the border of Västergötland and Närke. It has been a national park
      since 1983 and remains one of the wildest primeval-like forests in southern Sweden: a terrain to trek
      among gnarled pines, thick moss, and stone, understanding why folklore populated these woods with
      trolls.
    landscape: >-
      It all originates in the granite bedrock. When Lake Vättern took shape between 900 and 1,400 million
      years ago, the bedrock of Tiveden fractured into a perpendicular grid pattern that is clearly legible
      today. Lakes and peat mosses settled into the fissures, while intact crustal blocks remained as steep
      ridges.


      Then the continental ice sheet advanced. Melting away roughly 11,000 years ago, it ripped away rock
      slabs and scattered them across the plateaus. The largest and densest accumulations of boulders jammed
      into the fracture valleys, creating monumental block fields such as Stenkälla. Rushing meltwater flushed
      away virtually all fine sediments, leaving behind bare rock. Boulders rise up to ten metres high, hiding
      cave labyrinths in their interstices.


      Vegetation clings stubbornly to this sparse terrain. Scots pine alone perseveres on bare rock, growing
      slowly into dwarf forms; in places the forest floor is just an uninterrupted carpet of reindeer lichen.
      Wherever soil gathers, Norway spruce establishes, while broadleaved trees are rare. Portions of very
      old, open pine woodland shaped by historic wild fires survive with extraordinarily high biodiversity,
      among the last remnants of its kind in southern Sweden. Because precipitous cliffs, barren rock, and
      early protection kept modern commercial forestry away, the forest is allowed to develop freely toward
      natural climax woodland. Dwarf birch flourishes in the mires, a subarctic shrub largely confined to
      Norrland.
    wildlife: >-
      Tiveden forms a biogeographical transition zone between northern and southern biotas. Consequently,
      [western capercaillie](/especie/tetrao_urogallus/) and [Eurasian pygmy
      owlet](/especie/glaucidium_passerinum/) co-occur with diverse woodpeckers, and the [three-toed
      woodpecker](/especie/picoides_tridactylus/) approaches the southern limit of its breeding range here.
      [Moose](/especie/alces_alces/) and [roe deer](/especie/capreolus_capreolus/) are scarce; red fox,
      badger, pine marten, and red squirrel are widespread. [Eurasian beaver](/especie/castor_fiber/) has also
      recolonized, occasionally damming streams alongside park roads. Over 770 species of beetles find a haven
      in the decaying deadwood.


      Each season unfolds distinct impressions. In spring, fresh green growth and birdsong; with good fortune,
      on an early summer dawn, a capercaillie displaying on his lek. In summer, you walk upon sun-warmed rock,
      swim in Lake Trehörningen from Vitsand beach, and seek cool shelter among the shaded boulder caves. In
      October, deciduous trees blaze with autumn color while crystal air opens broad vistas. Winter access is
      more demanding, but you can marvel at the ice curtains of Stigmanspasset or snowshoe through the silent
      forest.
    visit: >-
      Most visits begin at the main entrance in the park's center: featuring parking, toilets, visitor
      information, and an interpretive exhibition, serving as the hub for most trails. Two alternative
      entrances exist at Vitsand and Ösjönäs. Marked paths span over 34 km, featuring scrambles into deep
      gorges and climbs onto lichen-clad ridges. Many are strenuous.


      If you have limited time, Stenkällerundan (2.2 km, hour and a half) is the most frequented, leading to
      fire-shaped old-growth pine and colossal glacial boulders; the Stenkällan rock formation ("the stone
      temple") has been a classic destination since the late nineteenth century. Trollkyrkorundan (4.6 km,
      about three hours) climbs several ridges, including Stora Trollkyrkan and Lilla Trollkyrkan, with
      numbered interpretive stops. Stigmansrundan (4.2 km) descends into the chasm of Stigmanspasset.
      Oxögabergsrundan (6.7 km) traverses damp spruce forests, boggy swales, and capercaillie habitat. The 9.5
      km Trehörningsrundan circles the central lake, displaying most park habitats. Mellannäsrundan (1.9 km)
      is the gentlest: at Mellannäsudden you will see relics of historic charcoal and tar production from
      early ironworks.


      Through the eastern boundary runs the Bergslagsleden, a 280 km long-distance trail, accessible on foot,
      by bike, or on horseback from Tived village. Surrounding the park are roughly 150 km of signposted cycle
      routes and over 300 km of equestrian trails.
    history: >-
      In the early Middle Ages, the dense wilderness of Tiveden was a notorious refuge for outlaws. Its maze
      of fissures, caves, and perched boulders fostered folklore of trolls, gnomes, and mythical creatures.


      The national park was established in 1983 encompassing some 1,350 hectares, and expanded in 2017 to
      approximately 2,030 hectares, adding a circuit around Stora Trehörningen and two new trailheads at
      Vitsand and Ösjönäs. Its primary purpose is preserving an intact wilderness of fracture valleys, lakes,
      and ancient woodlands, letting the forest age into true primeval condition. To maintain fire-adapted
      pine communities, controlled prescribed burning is applied, invigorating pine regeneration while
      suppressing spruce.
    before: >-
      There is no electricity or certified drinking water in the park. Beside the main entrance information
      cabin stands a manual pump well, but its water is unmonitored. During peak summer from June to
      September, visitor numbers peak between 11:00 and 14:00; the Vitsand entrance provides additional
      parking.


      Regulations are clear. Dogs must be kept leashed. Overnight camping is restricted to a single night at
      designated campsites between 18.00 and 10.00. Lighting fires outside designated fire hearths, disturbing
      raptor nests or animal dens, and operating motorized watercraft are strictly forbidden. You may harvest
      edible wild berries and mushrooms; collecting plants, mosses, or lichens requires research
      authorization. All three entrances feature accessible facilities, with boardwalk ramps leading to a
      viewpoint and a lake promontory.
  fr:
    intro: >-
      Imaginez une forêt où le socle est un quadrillage de failles profondes, où les lacs comblent les
      fractures et où des blocs rocheux plus hauts que des maisons reposent là où le glacier les a déposés.
      C'est Tiveden, blotti entre les grands lacs Vättern et Vänern, aux confins des provinces de
      Västergötland et de Närke. Classé parc national en 1983, il demeure l'un des massifs forestiers les plus
      sauvages du sud de la Suède : un lieu pour cheminer parmi les pins centenaires, la mousse et la roche,
      et pour comprendre pourquoi l'imaginaire populaire y a vu le repaire des trolls.
    landscape: >-
      Tout commence dans le granite. Lorsque le lac Vättern s'est formé, il y a entre 900 et 1 400 millions
      d'années, le socle de Tiveden s'est fissuré selon un réseau perpendiculaire toujours parfaitement
      lisible. Dans les creux se sont nichés lacs et tourbières ; les blocs rocheux compacts sont restés sous
      forme de crêtes escarpées.


      Puis vint le glacier continental. En se retirant voici environ 11 000 ans, il a arraché d'immenses blocs
      erratiques et les a disséminés. Les plus volumineux se sont accumulés dans les vallées de fracture,
      créant de spectaculaires chaos rocheux comme celui de Stenkälla. Les torrents de fonte ont décapé les
      sédiments fins pour ne laisser que la roche nue. Certains blocs atteignent dix mètres de hauteur et
      abritent des grottes sous leurs anfractuosités.


      La végétation s'accroche à ce substrat indigent. Sur la roche nue, seul le pin sylvestre résiste en
      poussant très lentement ; par endroits le sol n'est qu'un tapis continu de lichens. Dès qu'un peu de
      terre s'accumule, l'épicéa s'installe, tandis que les feuillus demeurent très rares. Subsistent des
      lambeaux de pinèdes très âgées, claires et façonnées par d'anciens incendies, d'une valeur écologique
      inestimable dans le sud du pays. Les falaises et une mise en réserve précoce ayant tenu à distance
      l'exploitation sylvicole moderne, la forêt évolue librement vers son stade naturel. Dans les tourbières
      apparaît le bouleau nain, un arbuste boréal typique du Norrland.
    wildlife: >-
      Tiveden forme une frontière biogéographique majeure entre flores et faunes boréales et méridionales.
      Ainsi cohabitent le [grand tétras](/especie/tetrao_urogallus/) et la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/) avec plusieurs pics, le [pic
      tridactyle](/especie/picoides_tridactylus/) trouvant ici sa limite méridionale.
      L'[élan](/especie/alces_alces/) et le [chevreuil](/especie/capreolus_capreolus/) sont discrets ; renard,
      blaireau, martre et écureuil roux sont fréquents. Le [castor d'Europe](/especie/castor_fiber/) s'y est
      également installé, inondant parfois ruisseaux et fossés en lisière des pistes. Le parc abrite en outre
      plus de 770 espèces de coléoptères saproxyliques.


      Le fil de l'année renouvelle les attraits. Au printemps, les jeunes pousses et les oiseaux chanteurs ;
      avec de la chance, au petit matin d'un début d'été, un grand tétras en pleine parade nuptiale. En été,
      vous marchez sur les dalles chauffées par le soleil, vous baignez dans le Trehörningen depuis la plage
      de Vitsand et trouvez la fraîcheur sous les grottes rocheuses. En octobre, les feuillus se parent d'or
      tandis que l'air pur dégage des horizons lointains. L'hiver rend l'accès plus rude, mais permet
      d'admirer les cascades de glace de Stigmanspasset ou de randonner en raquettes dans un silence feutré.
    visit: >-
      L'essentiel se découvre depuis l'entrée principale, au centre du parc : parking, sanitaires, pavillon
      d'information et exposition permanente, point de départ de la majorité des sentiers. Deux autres accès
      secondaires existent à Vitsand et Ösjönäs. Les chemins balisés dépassent 34 km, jalonnés de descentes
      dans des failles rocheuses et de montées sur des dômes dénudés. Plusieurs sont escarpés.


      Si le temps vous manque, Stenkällerundan (2,2 km, une heure et demie) est la boucle la plus courue,
      menant à une vieille pinède façonnée par les feux et aux blocs glaciaires ; la curiosité de Stenkällan,
      « le temple de pierre », est une excursion classique depuis la fin du XIXe siècle. Trollkyrkorundan (4,6
      km, environ trois heures) franchit plusieurs croupes rocheuses dont Stora et Lilla Trollkyrkan, avec des
      stations numérotées. Stigmansrundan (4,2 km) plonge dans la faille de Stigmanspasset. Oxögabergsrundan
      (6,7 km) traverse pessières humides, tourbières et zones de gagnage du grand tétras. La boucle de
      Trehörningsrundan (9,5 km) contourne le lac en dévoilant la diversité des milieux. Mellannäsrundan (1,9
      km) est la plus accessible : sur la pointe de Mellannäsudden subsistent des traces d'anciennes meules à
      charbon et de fosses à goudron.


      Sur le flanc oriental passe le Bergslagsleden, grand itinéraire de 280 km, accessible à pied, à vélo ou
      à cheval depuis le village de Tived. Les alentours proposent environ 150 km d'itinéraires cyclables
      balisés et plus de 300 km de pistes équestres.
    history: >-
      Au début du Moyen Âge, la forêt impénétrable de Tiveden servait de repaire aux bannis et brigands. Ses
      chaos de blocs, ses abris sous roche et ses failles ont alimenté une multitude de récits mettant en
      scène trolls, nains et créatures fantastiques.


      Le parc national a vu le jour en 1983 sur environ 1 350 hectares, avant d'être agrandi en 2017 pour
      atteindre près de 2 030 hectares, en intégrant un nouveau sentier autour du Stora Trehörningen et deux
      accès supplémentaires à Vitsand et Ösjönäs. Sa vocation est de conserver d'un seul tenant cet ensemble
      de forêts, de lacs et de vallées de failles, en laissant la forêt retourner à l'état primaire. Pour
      préserver les vieux peuplements de pin, des brûlages dirigés sont périodiquement conduits, favorisant la
      régénération du pin sylvestre au détriment de l'épicéa.
    before: >-
      Le parc est dépourvu d'électricité et de réseau d'eau courante. Près du pavillon d'accueil se trouve un
      puits à pompe manuelle, mais l'eau n'est pas contrôlée. En haute saison de juin à septembre, l'affluence
      culmine en milieu de journée entre 11:00 et 14:00 ; l'entrée de Vitsand offre une alternative de
      stationnement.


      La réglementation est stricte. Les chiens doivent être tenus en laisse. Le bivouac sous tente n'est
      autorisé qu'une seule nuit sur les sites balisés entre 18.00 et 10.00. Il est formellement interdit de
      faire du feu hors des foyers prévus, d'approcher des nids ou tanières et d'utiliser des bateaux à
      moteur. La cueillette des baies et des champignons comestibles est permise ; prélever mousses, lichens
      ou plantes exige une autorisation. Les trois accès disposent d'aménagements adaptés, avec des rampes
      jusqu'à un belvédère et une avancée lacustre.
  de:
    intro: >-
      Stell dir einen Urwald vor, in dem der Untergrund ein Schachbrett aus Klüften bildet, die Seen die
      Verwerfungen füllen und Felsblöcke größer als Häuser dort ruhen, wo das Inlandeis sie zurückließ. Das
      ist Tiveden, gelegen zwischen den Großseen Vättern und Vänern an der Grenze von Västergötland und Närke.
      Seit 1983 Nationalpark, zählt er bis heute zu den wildesten Waldgebieten Südschwedens: ein Ort zum
      Wandern zwischen knorrigen Kiefern, Moos und Fels, an dem man versteht, warum die Menschen hier einst
      Trollmythen ersonnen.
    landscape: >-
      Alles wurzelt im Granit. Als der Vättern vor 900 bis 1 400 Millionen Jahren entstand, riss das
      Grundgebirge von Tiveden in einem rechtwinkligen Klüftungsmuster auf, das bis heute sichtbar ist. In den
      Spalten lagerten sich Seen und Moore an; kompakte Felsabschnitte blieben als steile Höhenrücken stehen.


      Dann rückte das Eis vor. Als der Eispanzer vor rund 11.000 Jahren abschmolz, riss er Gestein mit und
      verteilte riesige Findlinge über die Ebenen. Die gewaltigsten Blöcke verkeilten sich in den
      Spaltentälern – daher die monumentalen Blockmeere wie Stenkälla. Das Schmelzwasser schwemmte fast alles
      Feinmaterial fort und hinterließ nackten Fels. Einzelne Findlinge ragen bis zu zehn Meter empor und
      bilden Höhlen im Gesteinsgewirr.


      Das Leben behauptet sich auf kargem Grund. Auf nacktem Fels widersteht nur die Kiefer in langsamem
      Wuchs; stellenweise ist der Boden lediglich von Flechtenteppichen überzogen. Wo sich etwas Humus
      sammelt, fasst die Fichte Fuß, während Laubbäume selten bleiben. Es existieren uralte, lichte
      Kiefernurwälder, geprägt durch historische Waldbrände, mit überragender biologischer Vielfalt – eine der
      wenigen verbliebenen Oasen dieser Art in Südschweden. Da Steilhänge und früher Schutz moderne
      Forstwirtschaft fernhielten, darf der Wald ungestört altern. In Mooren wächst die Zwergbirke, ein
      Zwergstrauch, der in Schweden vor allem in Norrland vorkommt.
    wildlife: >-
      Tiveden markiert eine biogeographische Scheidezone zwischen nördlichen und südlichen Arten. Daher leben
      [Auerhuhn](/especie/tetrao_urogallus/) und [Sperlingskauz](/especie/glaucidium_passerinum/) einträchtig
      neben verschiedenen Spechten, und der [Dreizehenspecht](/especie/picoides_tridactylus/) erreicht hier
      die Südgrenze seiner Verbreitung. [Elch](/especie/alces_alces/) und [Reh](/especie/capreolus_capreolus/)
      sind eher spärlich vertreten; Fuchs, Dachs, Baummarder und Eichhörnchen kommen regelmäßig vor. Auch der
      [Europäischer Biber](/especie/castor_fiber/) ist heimisch geworden und staut gelegentlich Gräben nahe
      den Parkstraßen an. Über 770 Totholzkäferarten sind im Park dokumentiert.


      Jede Jahreszeit hat ihren Reiz. Im Frühling frisches Buchengrün und Vogelgesang; mit Glück frühmorgens
      im Frühsommer ein balzendes Auerhuhn. Im Sommer wanderst du über sonnengewärmte Felsplatten, badest am
      Strand Vitsand im Trehörningen und findest Kühle in den Blockhöhlen. Im Oktober setzen Laubbäume bunte
      Akzente, während klare Herbstluft weite Aussichten schenkt. Im Winter ist die Anfahrt beschwerlicher,
      belohnt aber mit Eisbildungen am Stigmanspasset oder stillen Schneeschuhtouren.
    visit: >-
      Der Ausgangspunkt ist meist der Haupteingang im Parkzentrum: mit Parkplatz, Toiletten, Infopavillon und
      Dauerausstellung sowie Anschluss an die meisten Wanderwege. Zwei weitere Eingänge liegen in Vitsand und
      Ösjönäs. Die markierten Pfade umfassen über 34 km mit Abstiegen in tiefe Klüfte und Aufstiegen auf
      flechtenbedeckte Felskuppen. Viele Strecken sind steinig und anspruchsvoll.


      Bei wenig Zeit empfiehlt sich Stenkällerundan (2,2 km, eineinhalb Stunden), der zu feuergeprägten
      Altkiefern und eiszeitlichen Findlingen führt; das Naturmonument Stenkällan („der Steintempel“) ist seit
      dem späten neunzehnten Jahrhundert ein klassisches Ausflugsziel. Trollkyrkorundan (4,6 km, rund drei
      Stunden) erklimmt markante Höhenrücken wie Stora und Lilla Trollkyrkan und verfügt über nummerierte
      Lehrstationen. Stigmansrundan (4,2 km) führt in die enge Klamm Stigmanspasset. Oxögabergsrundan (6,7 km)
      erschließt feuchte Fichtenbrüche, Moorfluren und Auerhuhneinstände. Der 9,5 km lange Trehörningsrundan
      umrundet den zentralen See. Mellannäsrundan (1,9 km) ist der ebenste Weg: auf Mellannäsudden finden sich
      Spuren historischer Holzkohle- und Teergewinnung.


      Durch den Ostteil verläuft der 280 km lange Fernwanderweg Bergslagsleden, erreichbar zu Fuß, per Rad
      oder zu Pferd ab Tived. Im Umland gibt es etwa 150 km Radrouten und über 300 km Reitwege.
    history: >-
      Im Frühmittelalter galt der dichte Urwald von Tiveden als berüchtigtes Versteck für Gesetzlose. Seine
      zerklüftete Felslandschaft lieferte den Stoff für Sagen über Trolle, Zwerge und Waldgeister.


      Der Nationalpark wurde 1983 mit rund 1.350 Hektar ausgewiesen und 2017 auf etwa 2.030 Hektar vergrößert,
      ergänzt um die Seeroute um den Stora Trehörningen und zwei Zugänge in Vitsand und Ösjönäs. Ziel ist der
      Erhalt eines zusammenhängenden Urwaldgebiets aus Felsspalten, Seen und Bruchwäldern. Zur Verjüngung des
      Altkiefernbestands werden kontrollierte Brandrodungen eingesetzt, die Kiefern fördern und Fichten
      zurückdrängen.
    before: >-
      Im Park gibt es weder Strom noch geprüftes Trinkwasser. Neben dem Infopavillon am Haupteingang steht
      eine Schwengelpumpe, deren Brunnenwasser jedoch ungeprüft ist. In der Sommersaison von Juni bis
      September herrscht zur Mittagszeit zwischen 11:00 und 14:00 Uhr das meiste Aufkommen; Vitsand bietet
      einen Ausweichparkplatz.


      Es gelten feste Regeln. Hunde sind stets anzuleinen. Zelten ist nur für eine einzige Nacht an den
      bezeichneten Plätzen zwischen 18.00 und 10.00 Uhr gestattet. Offenes Feuer außerhalb der festen
      Feuerstellen, die Störung von Horsten und Bauten sowie Motorboote sind untersagt. Beeren und Speisepilze
      dürfen gesammelt werden; das Sammeln von Pflanzen, Moosen und Flechten bedarf einer Genehmigung. Alle
      drei Eingänge bieten barrierefreie Einrichtungen mit Stegrampen zu Aussichtspunkten.
  it:
    intro: >-
      Immagina una foresta in cui il suolo è un reticolo di fenditure, i laghi colmano le spaccature e massi
      più imponenti di una casa riposano esattamente dove li ha abbandonati il ghiacciaio. Tutto questo è
      Tiveden, racchiuso tra i grandi laghi Vättern e Vänern al confine tra le province di Västergötland e
      Närke. È parco nazionale dal 1983 e resta uno dei boschi più primordiali della Svezia meridionale: uno
      spazio in cui camminare tra pini contorti, muschi e macigni, comprendendo perché la fantasia popolare
      abbia ambientato qui le leggende dei troll.
    landscape: >-
      La matrice risiede interamente nel granito. All'epoca della formazione del Vättern, tra 900 e 1 400
      milioni di anni fa, il basamento di Tiveden si è fratturato secondo una griglia ortogonale tuttora ben
      visibile. Nei solchi si sono insediati laghi e torbiere, mentre i blocchi rocciosi integri sono rimasti
      come dorsali aspre.


      Poi giunse la calotta glaciale. Sciogliendosi circa 11.000 anni fa, il ghiaccio ha sradicato blocchi
      ciclopici disseminandoli sugli altipiani. I massi più imponenti si sono incastrati nelle valli di faglia
      dando vita a impressionanti pietraie caotiche come quella di Stenkälla. Le acque di fusione hanno
      asportato i sedimenti minuti lasciando solo la roccia denudata. I massi superano talora i dieci metri di
      altezza e nascondono meandri e caverne.


      La vegetazione contende lo spazio alla roccia. Sul granito spoglio resiste unicamente il pino silvestre
      crescendo a ritmi lentissimi; talvolta il terreno è solo un fitto manto di licheni. Dove si accumula
      terriccio subentra l'abete rosso, mentre le latifoglie sono rarissime. Sopravvivono lembi di pineta
      vetusta, aperta e modellata da passati incendi, con un valore di biodiversità straordinario per il sud
      della Svezia. Le scogliere rocciose e una precoce tutela hanno bandito la selvicoltura intensiva
      permettendo al bosco di riacquistare caratteri primari. Nelle torbiere alligna la betulla nana, un
      arbusto subartico altrove limitato al Norrland.
    wildlife: >-
      Tiveden rappresenta una linea di confine biogeografico tra specie settentrionali e meridionali. Per
      questo convivono il [Urogallo](/especie/tetrao_urogallus/) e la [Civetta
      nana](/especie/glaucidium_passerinum/) con vari picchi, mentre il [Picchio
      tridattilo](/especie/picoides_tridactylus/) tocca qui l'estremo meridionale del suo areale riproduttivo.
      L'[alce](/especie/alces_alces/) e il [Capriolo](/especie/capreolus_capreolus/) sono schivi; frequenti
      sono volpe, tasso, martora e scoiattolo. È presente anche il [castoro europeo](/especie/castor_fiber/),
      che talora sbarra torrenti e canali a ridosso delle strade del parco. Il parco custodisce inoltre oltre
      770 specie di coleotteri legati al legno morto.


      L'anno distribuisce emozioni diverse. In primavera, il verde novello e i canti degli uccelli; con un
      pizzico di fortuna, all'alba di inizio estate, un urogallo in parata amorosa. In estate cammini sulle
      lastre levigate dal sole, fai il bagno nel Trehörningen dalla spiaggia di Vitsand e trovi frescura nelle
      forombre dei massi. In ottobre le latifoglie accendono i boschi e l'aria nitida apre orizzonti remoti.
      L'inverno complica l'accesso, ma svela le colate di ghiaccio di Stigmanspasset o consente silenziose
      uscite con le ciaspole.
    visit: >-
      Il punto di riferimento primario è l'ingresso principale nel cuore dell'area protetta: dispone di
      parcheggio, servizi igienici, punto informativo e una mostra didattica, fungendo da snodo per la maggior
      parte dei sentieri. Esistono altri due accessi a Vitsand e Ösjönäs. I percorsi segnati superano i 34 km,
      tra ripide discese in fenditure oscure e salite su gobbe rocciose ammantate di licheni. Molti risultano
      impervi.


      Se hai poco tempo a disposizione, Stenkällerundan (2,2 km, un'ora e mezza) è l'anello più frequentato e
      conduce a pini secolari modellati dal fuoco e a massi ciclopici; il complesso di Stenkällan ("il tempio
      di pietra") è una meta classica sin dalla fine del XIX secolo. Trollkyrkorundan (4,6 km, circa tre ore)
      risale crinali panoramici come Stora e Lilla Trollkyrkan con paline illustrative numerate.
      Stigmansrundan (4,2 km) scende nella gola di Stigmanspasset. Oxögabergsrundan (6,7 km) tocca abetaie
      muschiose, torbiere e territori di urogallo. Trehörningsrundan (9,5 km) abbraccia l'intero lago
      centrale. Mellannäsrundan (1,9 km) è il tracciato più agevole: a Mellannäsudden si scorgono i resti di
      antiche carbonaie e fosse da pece.


      Sul versante orientale transita il Bergslagsleden, trekking di 280 km percorribile a piedi, in bici o a
      cavallo dal villaggio di Tived. Nei dintorni si snodano circa 150 km di itinerari ciclabili segnalati e
      oltre 300 km di piste per l'equitazione.
    history: >-
      Agli albori del Medioevo la fitta boscaglia di Tiveden costituiva un sicuro nascondiglio per fuorilegge
      ed esuli. L'intrico di gole, massi e anfratti alimentò leggende su troll, gnomi e spiriti dei boschi.


      Il parco nazionale nacque nel 1983 su circa 1.350 ettari ed è stato ampliato nel 2017 fino a raggiungere
      circa 2.030 ettari, inaugurando il sentiero attorno allo Stora Trehörningen e i due punti di accesso a
      Vitsand e Ösjönäs. Il suo obiettivo è salvaguardare nella sua interezza un paesaggio continuo di
      foreste, laghi e gole di spaccatura favorendo la transizione verso la foresta vergine. Per sostenere i
      pini monumentali si applicano fuochi controllati periodici che stimolano il pino e contengono
      l'espansione dell'abete rosso.
    before: >-
      Non ci sono allacciamenti elettrici né acquedotti nell'area protetta. Accanto alla casetta informativa
      dell'ingresso principale si trova una pompa manuale a pozzo, la cui acqua non è microbiologicamente
      controllata. In alta stagione, da giugno a settembre, l'affluenza raggiunge il picco tra le 11:00 e le
      14:00; l'accesso di Vitsand offre un'area di sosta alternativa.


      Le norme comportamentali sono tassative. I cani devono essere tenuti sempre al guinzaglio. Il campeggio
      è consentito per una sola notte nelle aree designate tra le 18.00 e le 10.00. È fatto divieto assoluto
      di accendere fuochi fuori dalle piazzole attrezzate, avvicinarsi a nidi o tane e impiegare natanti a
      motore. È consentita la raccolta di bacche e funghi commestibili per uso personale; asportare piante,
      muschi o licheni necessita di apposita deroga scientifica. Tutti e tre gli accessi presentano rampe
      attrezzate verso belvedere e punti lago.
  pt:
    intro: >-
      Imagina um bosque onde o solo é uma malha de fendas profundas, as lagoas preenchem as fraturas e blocos
      rochosos maiores que habitações repousam exatamente onde o glaciar os depositou. Isso é Tiveden, situado
      entre os grandes lagos Vättern e Vänern, na fronteira entre as províncias de Västergötland e Närke. É
      parque nacional desde 1983 e continua a ser uma das florestas mais selvagens do sul da Suécia: um
      cenário para deambular entre pinheiros seculares, musgo espesso e penedos, compreendendo por que motivo
      o imaginário popular povoou estas matas de lendas de trolls.
    landscape: >-
      Tudo tem origem no granito primordial. Quando o lago Vättern se formou, há entre 900 e 1 400 milhões de
      anos, o soco rochoso de Tiveden estalou num padrão de fraturação ortogonal que ainda hoje salta à vista.
      Nas fendas acomodaram-se lagoas e pauis; os blocos intactos permaneceram como cristas escarpadas.


      Depois avançou o gelo continental. Ao derreter há cerca de 11.000 anos, arrancou penedos e espalhou-os
      pelos planaltos. Os blocos mais corpulentos tombaram nos vales de falha, originando gigantescos caos de
      blocos como o de Stenkälla. As torrentes glaciares arrastaram os sedimentos miúdos deixando a rocha nua.
      Há blocos com alturas que atingem dez metros e labirintos de grutas entre os penedos.


      A vida agarra-se ao substrato estéril. Na rocha nua apenas o pinheiro-silvestre resiste crescendo com
      lentidão extrema; por vezes o solo é apenas um tapete contínuo de líquenes. Onde se acumula alguma terra
      instala-se o espruce, sendo as folhosas muito raras. Sobrevivem manchas de pinhal muito antigo, aberto e
      moldado por fogos pretéritos, com uma biodiversidade excecional para o sul da Suécia. Graças às escarpas
      e a uma proteção precoce que travaram a exploração florestal moderna, a mata evolui livremente para o
      estádio primordial. Nas turfeiras surge a bétula-anã, um arbusto subártico que na Suécia se encontra
      essencialmente em Norrland.
    wildlife: >-
      Tiveden constitui uma fronteira biogeográfica marcante entre faunas boreais e temperadas. Daí
      coexistirem o [tetraz-grande](/especie/tetrao_urogallus/) e o
      [mocho-pigmeu](/especie/glaucidium_passerinum/) com diversas espécies de pica-paus, encontrando-se aqui
      o [pica-pau-tridáctilo](/especie/picoides_tridactylus/) perto do seu limite meridional. O
      [alce](/especie/alces_alces/) e a [corça](/especie/capreolus_capreolus/) são discretos; raposas,
      texugos, martas e esquilos são comuns. Ocorreu também o regresso do
      [castor-europeu](/especie/castor_fiber/), que por vezes represa regatos junto às vias do parque. O
      parque alberga ainda mais de 770 espécies de escaravelhos associados à madeira morta.


      As estações trazem encantos próprios. Na primavera despontam o verde tenro e as aves canoras; com sorte,
      numa alvorada de início de verão, um tetraz em plena parada nupcial. No verão caminha-se sobre rochas
      aquecidas pelo sol, toma-se banho no Trehörningen a partir da praia de Vitsand e encontra-se refúgio
      fresco nas fendas dos penedos. Em outubro as folhosas incendeiam a paisagem e o ar límpido rasga
      horizontes largos. No inverno o acesso é exigente, mas permite contemplar as cascatas de gelo de
      Stigmanspasset ou caminhar com raquetes na floresta silenciosa.
    visit: >-
      A maioria das visitas começa na entrada principal, no centro do parque: dispõe de parqueamento,
      sanitários, posto de receção e centro de exposições, de onde irradiam quase todos os trilhos. Existem
      outras duas entradas em Vitsand e Ösjönäs. Os percursos sinalizados ultrapassam os 34 km, com descidas a
      gargantas escarpadas e ascensões a cumes recobertos de líquenes. Muitos troços são exigentes.


      Com tempo contado, o Stenkällerundan (2,2 km, hora e meia) é o percurso mais emblemático, alcançando
      pinheiros vetustos moldados pelo fogo e grandes blocos glaciares; o penedo de Stenkällan («o templo de
      pedra») é um passeio clássico desde os finais do século XIX. O Trollkyrkorundan (4,6 km, cerca de três
      horas) sobe a várias elevações como Stora e Lilla Trollkyrkan, integrando paragens explicativas
      numeradas. O Stigmansrundan (4,2 km) desce à garganta de Stigmanspasset. O Oxögabergsrundan (6,7 km)
      percorre abetais sombrios, turfeiras e áreas de parada de tetraz. O Trehörningsrundan (9,5 km) contorna
      a lagoa central revelando quase todos os biótopos. E o Mellannäsrundan (1,9 km) é o mais suave: em
      Mellannäsudden avistam-se vestígios da antiga produção de carvão vegetal e pez.


      Pela orla nascente passa o Bergslagsleden, percurso de grande rota com 280 km, acessível a pé, em
      bicicleta ou a cavalo a partir de Tived. Nos arredores contam-se cerca de 150 km de ciclovias
      sinalizadas e mais de 300 km de trilhos equestres.
    history: >-
      No início da Idade Média a densa floresta de Tiveden servia de refúgio a foragidos e bandoleiros. A sua
      paisagem labiríntica de fendas e cavidades inspirou lendas sobre trolls, anões e criaturas fantásticas.


      O parque foi criado em 1983 com cerca de 1.350 hectares e alargado em 2017 para aproximadamente 2.030
      hectares, adicionando o circuito em redor de Stora Trehörningen e duas novas entradas em Vitsand e
      Ösjönäs. O objetivo primordial consiste em preservar intacto este ecossistema contínuo de florestas,
      lagoas e vales de falha, permitindo à mata atingir maturidade virgem. Para preservar o pinhal antigo
      recorre-se ao fogo controlado periódico, que beneficia o pinheiro e trava a progressão do espruce.
    before: >-
      Não existe eletricidade nem água potável canalizada no parque. Junto ao posto de acolhimento da entrada
      principal há uma bomba manual de poço, mas a água não é testada. Na época alta, entre junho e setembro,
      o afluxo concentra-se a meio do dia entre as 11:00 e as 14:00; a entrada de Vitsand faculta
      estacionamento alternativo.


      As regras são rigorosas. Os cães devem circular sempre com trela. O acampamento com tenda restringe-se a
      uma única noite nos recintos assinalados entre as 18.00 e as 10.00. É proibido foguear fora dos
      braseiros oficiais, perturbar ninhos ou tocas e navegar com embarcações a motor. É autorizada a recolha
      comedida de bagas e cogumelos comestíveis; colher plantas, musgos ou líquenes carece de autorização
      científica. As três entradas oferecem estruturas acessíveis, com passadiços até miradouros e margens
      lacustres.
