resumen:
  es: >-
    Pinsapares, un abeto relicto que solo crece en estas sierras, sobre un karst profundo con algunas de las
    simas más hondas de España.
  en: >-
    Spanish fir forests (pinsapares), a relict conifer growing only in these ranges, over deep karst harboring
    some of the deepest chasms in Spain.
  fr: >-
    Forêts de sapins d'Andalousie (pinsapares), un conifère relique qui ne pousse que dans ces sierras, sur un
    karst profond abritant certains des gouffres les plus vertigineux d'Espagne.
  de: >-
    Igeltannenwälder (Pinsapares), eine Relikt-Tanne, die weltweit nur in diesen Gebirgen wächst, über tiefem
    Karst mit einigen der tiefsten Höhlenschächte Spaniens.
  it: >-
    Foreste di abete di Spagna (pinsapares), una conifera relitta che vegeta unicamente in queste sierre, su
    un carsismo profondo con alcuni degli orridi più verticali di Spagna.
  pt: >-
    Bosques de pinsapo (pinsapares), um abeto relíquia que só vegeta nestas serras, sobre um relevo cárstico
    com alguns dos algares mais profundos de Espanha.
unico:
  es: >-
    Aquí crece, en la mayor extensión del mundo, el pinsapo, un abeto reliquia de los bosques del Terciario
    que solo existe en unas pocas sierras andaluzas.
  en: >-
    Here flourishes the world's largest expanse of pinsapo, a relict fir from Tertiary forests that survives
    only across a handful of Andalusian mountain ranges.
  fr: >-
    Ici prospère, sur la plus vaste superficie au monde, le sapin d'Andalousie (pinsapo), relique des forêts
    du Tertiaire qui ne survit que dans une poignée de massifs andalous.
  de: >-
    Hier wächst auf der größten zusammenhängenden Fläche der Erde die Spanische Tanne (Pinsapo), eine
    Reliktart der tertiären Wälder, die nur in wenigen andalusischen Gebirgen überlebt hat.
  it: >-
    Qui prospera, nella più vasta estensione al mondo, il pinsapo, un abete relitto delle foreste del
    Terziario che sopravvive unicamente in pochi massicci andalusi.
  pt: >-
    Aqui medra, na maior extensão do planeta, o pinsapo, um abeto fóssil remanescente do Terciário que
    subsiste unicamente em escassas serras andaluzas.
observaciones:
  es: >-
    En la zona escasean las fuentes de agua: lleva agua y protección solar, calzado adecuado, y sigue los
    senderos señalizados. Consulta la meteorología antes de salir. Desde Málaga se llega por la A-357 hasta
    Cártama y la A-366 hacia Coín, Yunquera o Alozaina, en aproximadamente una hora.
texto:
  es:
    intro: >-
      En pleno sur de España hubo un oficio que consistía en subir a las cumbres, guardar la nieve en pozos
      durante el invierno y repartirla en verano por los pueblos. Los neveros dieron nombre a esta sierra,
      aunque el oficio tuvo un precio: fue responsable del gran deterioro del quejigal de montaña. El Parque
      Nacional Sierra de las Nieves ocupa 22.979,76 hectáreas en el sector occidental de la provincia de
      Málaga, en la Serranía de Ronda. Es el decimosexto parque nacional de España y el tercero de Andalucía,
      y se declaró en 2021; desde 1995 ya era reserva de la biosfera de la UNESCO.
    landscape: >-
      La sierra se explica por contrastes de color. Por un lado, las sierras blancas, de caliza, con sus
      tajos, lapiaces, cuevas y simas: la sima GESM baja 1.101 m y es la más profunda de Andalucía. Por otro,
      las sierras rojizas, de peridotitas, unas rocas muy raras en la corteza terrestre que se tiñen de rojo
      al oxidarse el hierro; sus afloramientos rondeños figuran entre los más extensos del mundo. Y en medio,
      las tierras pardas, que los pueblos de la comarca han explotado desde siempre para la agricultura. El
      pico Torrecilla, de 1.919 m, es la mayor altitud de la Andalucía occidental.


      El clima añade lo demás. La sierra queda bajo la influencia del Mediterráneo y del Atlántico, y las
      lluvias se concentran de octubre a marzo, con menos de 15 mm mensuales en verano. Las zonas altas son
      más frescas y reciben más precipitación, y eso explica por qué sobrevive aquí el pinsapo.


      El bosque sube por pisos. En la media montaña hay encinares, pinares de pino resinero y sabinares, y
      pinares mezclados con pinsapos. En las umbrías húmedas del sur, el alcornocal se enriquece con quejigos
      y pinsapos. En la alta montaña vive el quejigal con arces, mostajos y tejos, hoy en mal estado por
      siglos de carboneo y sobrepastoreo. Los pinsapares ocupan cerca de 2.000 ha, el 60 % de la superficie
      mundial de esos bosques, y el inventario de flora supera las 1.400 especies de plantas, 15 de ellas
      amenazadas, como el pinsapo, el quejigo de alta montaña y el tabaco gordo.
    wildlife: >-
      La [cabra montés](/especie/capra_pyrenaica/) es el animal que mejor representa estas sierras, unida a su
      carácter montañoso. Con ella viven el corzo, la garduña, la [gineta](/especie/genetta_genetta/), el
      meloncillo y la [nutria](/especie/lutra_lutra/), presente en todos los ríos importantes. En el aire, el
      [águila real](/especie/aquila_chrysaetos/), el [águila perdicera](/especie/aquila_fasciata/), el águila
      culebrera, el [búho real](/especie/bubo_bubo/) y el [halcón peregrino](/especie/falco_peregrinus/).
      Entre los reptiles destaca la víbora hocicuda; el cangrejo de río autóctono conserva aquí algunas de sus
      últimas poblaciones en Andalucía. En total hay casi 200 especies de vertebrados, y 14 están en el
      Catálogo Andaluz de Especies Amenazadas, entre ellas murciélagos y libélulas.


      El otoño tiene su escena: los castaños tiñen de rojizo y dorado el llamado Bosque de Cobre, sobre todo
      en el Valle del Genal, en Igualeja y Parauta.
    visit: >-
      Hay dos puertas principales al corazón del parque. Una es la pista forestal que sale de la carretera de
      Ronda a San Pedro de Alcántara hasta el área recreativa Los Quejigales; la otra sube desde Yunquera
      hasta los miradores del Saucillo y de Caucón o Luis Ceballos. Las rutas principales,
      Quejigales-Torrecilla y Puerto Saucillo-Torrecilla, llevan al pico más alto de la Andalucía occidental.


      Para una primera visita hay tres senderos con carácter. Las Escaleretas es un corto sendero circular que
      lleva al pinsapo monumento natural: con más de 350 años, fue el de mayor porte del parque. Conejeras es
      otro circular corto, por el encinar de La Nava, uno de los bosques mejor conservados del parque, con
      quejigos y pinsapos; cinco grandes balsas de un millón de litros abastecen a los vehículos de extinción
      de incendios. Y Caucón-Tajo de la Caína, de 4,4 km y dificultad media, atraviesa pinsapares hasta un
      tajo de más de 100 metros de caída libre. La leyenda dice que su nombre viene de una mujer apodada la
      Caína, a quien la Inquisición mandó despeñar allí por brujería.


      Si quieres más, la ruta Caucón-Peñón de los Enamorados (8 km, difícil, circular, unos 210 minutos) cruza
      pinsapar, quejigal de alta montaña y vegetación de roquedo.


      Los pueblos de la comarca tienen oficinas de turismo que orientan sobre rutas, actividades y patrimonio
      de cada municipio.
    history: >-
      Aquí se han ido solapando culturas: de los vestigios de la prehistoria a los fenicios, íberos, romanos,
      visigodos y, sobre todo, musulmanes.


      El bosque ha sufrido, y sufre. Los incendios son una de las principales amenazas y han destruido
      pinsapares enteros, como el de la Cañada de la Encina o Cerro Corona. El sobrepastoreo causa la fuerte
      erosión de las zonas altas y frena la regeneración del quejigal de alta montaña. Para el pinsapo hay un
      Plan de Recuperación, aprobado en 2011, que protege las poblaciones y restaura su hábitat donde el fuego
      lo hizo desaparecer.
    before: >-
      En la zona escasean las fuentes de agua: lleva agua y protección solar, calzado adecuado, y sigue los
      senderos señalizados. Consulta la meteorología antes de salir. Desde Málaga se llega por la A-357 hasta
      Cártama y la A-366 hacia Coín, Yunquera o Alozaina, en aproximadamente una hora.
    around: >-
      El [Parque Natural Los Alcornocales](/lugar/parque-natural-los-alcornocales/) está a unos veintinueve
      kilómetros. Más lejos, el [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) comparte con Sierra
      de las Nieves la cabra montés y el buitre leonado, con hábitats kársticos y de alta montaña; el [Parc
      Natural de la Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) coincide en la cabra montés, el
      águila perdicera y el buitre leonado sobre terreno kárstico.
  en:
    intro: >-
      In the heart of southern Spain there was once a demanding profession: climbing the mountain peaks,
      packing snow into pits during winter, and distributing ice down to villages during summer. These
      ice-harvesters (neveros) gave the sierra its name, though the trade came at an environmental cost,
      contributing to the severe degradation of high-mountain gall oak stands. Sierra de las Nieves National
      Park covers 22,979.76 hectares in western Málaga province within the Serranía de Ronda. It is Spain's
      sixteenth national park and the third in Andalusia, designated in 2021 after being a UNESCO Biosphere
      Reserve since 1995.
    landscape: >-
      The sierra reveals itself through striking colour contrasts. On one hand, the white ranges of limestone,
      carved into cliffs, lapiaz pavements, caves, and chasms: the GESM chasm plunges 1,101 m, making it the
      deepest in Andalusia. On the other hand, the reddish ranges of peridotite, extraordinarily rare
      ultramafic mantle rocks that turn red as their iron oxidises; the Ronda peridotite massifs rank among
      the most extensive on Earth. Between them lie brown soils, historically cultivated by local farming
      hamlets. Torrecilla peak, at 1,919 m, forms the highest crest in western Andalusia.


      Climate shapes the rest. Influenced by both Mediterranean air and Atlantic fronts, precipitation
      concentrates from October to March, dropping below 15 mm monthly in summer. High elevations are cooler
      and receive heavier rainfall, explaining why the Spanish fir (pinsapo) clings to survival here.


      Forests climb in altitudinal bands. Mid-elevation slopes host holm oaks, maritime pines, junipers, and
      mixed stands of pine and pinsapo. In moist southern shade, cork oak stands integrate gall oaks and
      pinsapos. High elevations support relict gall oaks alongside maples, whitebeams, and yews, currently
      degraded by centuries of charcoal burning and livestock overgrazing. Pinsapo forests occupy roughly
      2,000 ha, representing 60 % of the global range of these relict woods, while the botanical catalogue
      exceeds 1,400 plant species, with 15 threatened taxa including the pinsapo, subalpine gall oak, and
      giant mullein.
    wildlife: >-
      The [Spanish ibex](/especie/capra_pyrenaica/) represents the soul of these rugged heights, in keeping
      with their alpine terrain. Alongside it live roe deer, stone martens, the [common
      genet](/especie/genetta_genetta/), Egyptian mongooses, and the [Eurasian otter](/especie/lutra_lutra/),
      present along all major streams. The skies shelter the [golden eagle](/especie/aquila_chrysaetos/),
      [Bonelli's eagle](/especie/aquila_fasciata/), short-toed snake eagle, [Eurasian
      eagle-owl](/especie/bubo_bubo/), and [peregrine falcon](/especie/falco_peregrinus/). Reptiles include
      the Lataste's viper; the native white-clawed crayfish preserves here some of its last Andalusian
      refuges. In total, nearly 200 vertebrate species breed or dwell here, with 14 listed on the Andalusian
      Catalogue of Threatened Species, including rare bats and dragonflies.


      Autumn creates a scenic masterpiece: chestnut groves tint the Valle del Genal around Igualeja and
      Parauta in glowing copper and gold, creating the renowned Bosque de Cobre.
    visit: >-
      Two primary gateways lead into the heart of the park. One is the forest track departing the Ronda–San
      Pedro de Alcántara road toward Los Quejigales recreation area; the other climbs from Yunquera toward the
      viewpoints of Saucillo and Caucón (Luis Ceballos). The core routes, Quejigales-Torrecilla and Puerto
      Saucillo-Torrecilla, climb to the highest summit in western Andalusia.


      For a first outing, three distinct trails stand out. Las Escaleretas is a short circular walk leading to
      a monumental specimen fir: over 350 years old, it was long the largest in the park. Conejeras forms
      another gentle loop through the La Nava holm oak woods, one of the park's best-preserved forests,
      interspersed with gall oaks and pinsapos; five large million-litre water basins stand ready for
      firefighting vehicles. Caucón-Tajo de la Caína spans 4.4 km of moderate walking through fir woods to a
      dramatic cliff featuring a sheer drop of over 100 metres. Local lore holds that its name recalls a woman
      known as La Caína, whom the Inquisition condemned to be cast over the edge for witchcraft.


      For seasoned trekkers, the Caucón-Peñón de los Enamorados trail (8 km, demanding, circular, about 210
      minutes) winds through pinsapar, subalpine gall oak woods, and high limestone crags.


      Gateway villages feature municipal tourist desks providing route advice and cultural background.
    history: >-
      A succession of cultures has overlapped here: from prehistoric hunter-gatherers to Phoenicians,
      Iberians, Romans, Visigoths, and above all, Islamic communities.


      The forest has endured heavy pressures. Wildfires represent the gravest peril, having razed whole fir
      groves such as Cañada de la Encina and Cerro Corona. Overgrazing drives severe soil erosion on high
      slopes and inhibits gall oak regeneration. A recovery plan for the pinsapo was ratified in 2011 to
      safeguard surviving populations and restore woodlands in burnt areas.
    before: >-
      Natural springs are scarce across high elevations: always carry sufficient drinking water, sun
      protection, and proper footwear, and keep strictly to waymarked paths. Check local weather forecasts
      before setting out. From Málaga, take the A-357 to Cártama and then the A-366 toward Coín, Yunquera, or
      Alozaina, reaching the park in approximately an hour.
    around: >-
      Around twenty-nine kilometres away lies [Parque Natural Los
      Alcornocales](/lugar/parque-natural-los-alcornocales/). Further afield, [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) shares with Sierra de las Nieves the Spanish ibex, griffon
      vulture, and rugged karst highland habitats; [Parc Natural de la Serra de
      Montsant](/lugar/parc-natural-de-la-serra-de/) coincides in sheltering the ibex, Bonelli's eagle, and
      griffon vulture over similar calcareous karst.
  fr:
    intro: >-
      Au cœur du sud de l'Espagne existait jadis un métier rude : monter sur les crêtes en hiver pour tasser
      la neige dans des puits et redescendre la glace en été vers les villages. Ces glaciers (neveros)
      donnèrent leur nom à la sierra, même si cette activité eut un coût écologique élevé en dégradant les
      chênaies faginées d'altitude. Le parc national de la Sierra de las Nieves s'étend sur 22 979,76 hectares
      dans la partie occidentale de la province de Málaga, au sein de la Serranía de Ronda. Seizième parc
      national d'Espagne et troisième d'Andalousie, il a été créé en 2021 après avoir été reconnu réserve de
      biosphère par l'UNESCO dès 1995.
    landscape: >-
      La sierra s'explique par des contrastes de couleurs saisissants. D'un côté, les sierras blanches,
      calcaires, hérissées de falaises, lapiés, grottes et gouffres : le gouffre GESM plonge à 1 101 m, étant
      le plus profond d'Andalousie. De l'autre, les sierras rougeâtres, formées de péridotites, des roches du
      manteau terrestre très rares en surface qui virent au rouge sous l'effet de l'oxydation du fer ; leurs
      affleurements dans la région de Ronda comptent parmi les plus vastes de la planète. Entre les deux
      s'étendent les terres brunes que les paysans ont toujours cultivées. Le pic Torrecilla culmine à 1 919
      m, formant le sommet de l'Andalousie occidentale.


      Le climat modèle le reste. Placée sous l'influence conjointe de la Méditerranée et de l'Atlantique, la
      sierra concentre ses pluies d'octobre à mars, avec moins de 15 mm par mois en été. Les crêtes plus
      fraîches et arrosées permettent la survie du sapin d'Andalousie.


      La forêt s'étage en altitude. À mi-pente se succèdent chênaies vertes, pinèdes maritimes, genévriers et
      boisements mixtes de pins et pinsapos. Dans les combes ombragées du sud, la suberaie s'enrichit de
      chênes faginés et de sapins. En altitude survit la chênaie de montagne mêlée d'érables, d'alisiers et
      d'ifs, fragilisée par des siècles de charbonnage et de surpâturage. Les pinsapares couvrent près de 2
      000 ha, soit 60 % de l'aire mondiale de cette essence, et la flore rassemble plus de 1 400 espèces
      végétales, dont 15 protégées comme le pinsapo ou le chêne faginé d'altitude.
    wildlife: >-
      Le [bouquetin d'Espagne](/especie/capra_pyrenaica/) incarne l'âme montagnarde de ces crêtes. Il partage
      le massif avec le chevreuil, la fouine, la [genette commune](/especie/genetta_genetta/), la mangouste et
      la [loutre d'Europe](/especie/lutra_lutra/), présente dans tous les cours d'eau notables. Dans le ciel
      évoluent l'[aigle royal](/especie/aquila_chrysaetos/), l'[aigle de Bonelli](/especie/aquila_fasciata/),
      le circaète Jean-le-Blanc, le [hibou grand-duc](/especie/bubo_bubo/) et le [faucon
      pèlerin](/especie/falco_peregrinus/). Les reptiles comptent la vipère de Lataste ; l'écrevisse à pattes
      blanches indigène conserve ici certaines de ses ultimes populations andalouses. Au total, près de 200
      espèces de vertébrés fréquentent le parc, dont 14 inscrites au catalogue andalou des espèces menacées.


      L'automne compose un décor magistral : les châtaigneraies parent la vallée du Genal, à Igualeja et
      Parauta, de reflets cuivrés au sein de la « forêt de cuivre ».
    visit: >-
      Deux entrées principales mènent au cœur du parc. La première est la piste forestière reliant la route de
      Ronda à San Pedro de Alcántara à l'aire récréative de Los Quejigales ; la seconde grimpe depuis Yunquera
      vers les belvédères du Saucillo et de Caucón (Luis Ceballos). Les grands itinéraires
      Quejigales-Torrecilla et Puerto Saucillo-Torrecilla mènent au plus haut sommet d'Andalousie occidentale.


      Pour une première découverte, trois sentiers se distinguent. Las Escaleretas forme une courte boucle
      menant à un pinsapo classé monument naturel : âgé de plus de 350 ans, il fut le plus haut spécimen du
      parc. Conejeras offre une boucle facile dans la chênaie de La Nava, mêlant chênes verts et pinsapos ;
      cinq grands bassins d'un million de litres alimentent les engins de lutte contre l'incendie. Caucón-Tajo
      de la Caína totalise 4,4 km de difficulté moyenne à travers les pinsapares jusqu'à une falaise abrupte
      de plus de 100 mètres de paroi verticale. La légende raconte que son nom vient d'une femme surnommée la
      Caína, précipitée dans le vide par l'Inquisition pour sorcellerie.


      Pour aller plus loin, le tracé Caucón-Peñón de los Enamorados (8 km, difficile, boucle d'environ 210
      minutes) traverse pinsapares, chênaies d'altitude et falaises karstiques.


      Les villages des alentours disposent de bureaux d'information guidant vers les sentiers locaux.
    history: >-
      Une mosaïque de civilisations s'est succédé ici : des chasseurs préhistoriques aux Phéniciens, Ibères,
      Romains, Wisigoths et, surtout, populations arabo-andalouses.


      Le massif forestier a payé un lourd tribut. Les incendies constituent la menace majeure et ont anéanti
      des massifs entiers de pinsapos, comme à la Cañada de la Encina ou au Cerro Corona. Le surpâturage
      accentue l'érosion et entrave la régénération des chênes de montagne. Un plan de rétablissement du sapin
      d'Andalousie a été adopté en 2011 afin de préserver les peuplements et de replanter les secteurs
      incendiés.
    before: >-
      Les sources pérennes sont rarissimes sur les hauteurs : emportez une réserve d'eau suffisante, une
      protection solaire et des chaussures adaptées, en restant sur les chemins balisés. Consultez la météo
      avant toute sortie. Depuis Málaga, on emprunte l'A-357 jusqu'à Cártama puis l'A-366 en direction de
      Coín, Yunquera ou Alozaina en environ une heure.
    around: >-
      Le [Parque Natural Los Alcornocales](/lugar/parque-natural-los-alcornocales/) se trouve à environ
      vingt-neuf kilomètres. Plus loin, le [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) partage
      avec la Sierra de las Nieves le bouquetin d'Espagne, le vautour fauve et les reliefs karstiques
      d'altitude ; le [Parc Natural de la Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) abrite
      également le bouquetin, l'aigle de Bonelli et le vautour fauve sur substrat calcaire.
  de:
    intro: >-
      Mitten im Süden Spaniens gab es einst ein hartes Handwerk: Auf die Bergkämme steigen, den Winterschnee
      in tiefen Schächten verdichten und das Eis im Sommer in die Täler transportieren. Diese Schneesammler
      (neveros) gaben der Sierra ihren Namen, wenngleich das Gewerbe seinen Preis forderte: Es trug maßgeblich
      zum Niedergang der Berg-Portugiese-Eichenwälder bei. Der Nationalpark Sierra de las Nieves umfasst
      22.979,76 Hektar im Westen der Provinz Málaga in der Serranía de Ronda. Er ist Spaniens sechzehnter
      Nationalpark und der dritte in Andalusien, ausgewiesen im Jahr 2021, nachdem er bereits seit 1995 als
      UNESCO-Biosphärenreservat geschützt war.
    landscape: >-
      Die Sierra offenbart sich in faszinierenden Farbkontrasten. Einerseits die weißen Bergketten aus
      Kalkstein mit Steilwänden, Karrenfeldern, Höhlen und Schächten: Der Schacht GESM stürzt 1.101 m in die
      Tiefe und ist die tiefste Karsthöhle Andalusiens. Andererseits die rötlichen Höhenzüge aus Peridotit,
      sehr seltenen ultramafischen Mantelgesteinen, die sich durch Eisenoxidation rot färben; die
      Peridotitmassive von Ronda zählen zu den weltweit größten Vorkommen. Dazwischen erstrecken sich braune
      Böden, die seit jeher landwirtschaftlich genutzt wurden. Der Pico Torrecilla bildet mit 1.919 m die
      höchste Erhebung Westandalusiens.


      Das Regionalklima prägt das Ökosystem. Zwischen Mittelmeer und Atlantik konzentrieren sich die
      Regenfälle auf Oktober bis März, während im Sommer oft weniger als 15 mm monatlich fallen. Die kühlen,
      niederschlagsreicheren Hochlagen sichern das Überleben der Pinsapo-Tanne.


      Die Wälder staffeln sich in Höhenstufen. In mittleren Lagen wachsen Steineichen, See-Kiefern,
      Phönizischer Wacholder und Mischbestände aus Kiefern und Pinsapos. In feuchten Südschluchten mischen
      sich Korkeichen mit Portugiesischen Eichen und Tannen. In den Hochlagen überdauern
      Berg-Portugiesische-Eichen mit Ahornen, Mehlbeeren und Eiben, geschwächt durch Jahrhunderte der Köhlerei
      und Überweidung. Die Pinsapo-Wälder bedecken rund 2.000 ha, was 60 % des weltweiten Bestandes
      entspricht, während die Flora über 1.400 Pflanzenarten umfasst, darunter 15 bedrohte Taxa.
    wildlife: >-
      Der [Iberiensteinbock](/especie/capra_pyrenaica/) ist das Wappentier dieser schroffen Kämme. Er teilt
      das Gebirge mit Reh, Steinmarder, [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/), Ichneumon und
      [Fischotter](/especie/lutra_lutra/), der in allen größeren Bächen vorkommt. Am Himmel kreisen
      [Steinadler](/especie/aquila_chrysaetos/), [Habichtsadler](/especie/aquila_fasciata/), Schlangenadler,
      [Uhu](/especie/bubo_bubo/) und [Wanderfalke](/especie/falco_peregrinus/). Unter den Kriechtieren sticht
      die Stülpnasenotter hervor; der einheimische Edelkrebs besitzt hier einige seiner letzten andalusischen
      Refugien. Insgesamt brüten oder leben hier fast 200 Wirbeltierarten, von denen 14 im andalusischen
      Katalog gefährdeter Arten verzeichnet sind.


      Der Herbst inszeniert ein Farbenspiel: Die ausgedehnten Edelkastanienhaine im Genal-Tal bei Igualeja und
      Parauta verwandeln sich in den sogenannten Kupferwald (Bosque de Cobre).
    visit: >-
      Zwei Hauptzugänge führen ins Herz des Schutzgebiets. Eine Piste zweigt von der Straße Ronda–San Pedro de
      Alcántara zum Rastplatz Los Quejigales ab; die andere steigt von Yunquera zu den Aussichtspunkten
      Saucillo und Caucón (Luis Ceballos) auf. Die zentralen Wanderrouten Quejigales-Torrecilla und Puerto
      Saucillo-Torrecilla führen zum höchsten Gipfel Westandalusiens.


      Für den Einstieg bieten sich drei markierte Wege an. Las Escaleretas ist ein kurzer Rundweg zu einer
      monumentalen Pinsapo-Tanne: Mit über 350 Jahren zählte sie zu den mächtigsten Bäumen des Gebiets.
      Conejeras bildet einen leichten Rundkurs durch den Steineichenwald von La Nava, durchsetzt mit Pinsapos;
      fünf große Löschwasserbecken von je einer Million Liter stehen für Feuerwehrfahrzeuge bereit.
      Caucón-Tajo de la Caína führt über 4,4 km mittlerer Schwierigkeit durch Tannenwälder zu einer
      senkrechten Felswand mit über 100 Metern freiem Tiefblick. Der Legende nach verdankt die Wand ihren
      Namen einer als Hexe verurteilten Frau namens La Caína, die dort von der Inquisition herabgestürzt
      wurde.


      Für Geübte erschließt die Route Caucón-Peñón de los Enamorados (8 km, anspruchsvoll, Rundweg von rund
      210 Minuten) Tannenforste, Eichenkämme und Felsfluren.


      Die Dörfer der Umgebung bieten Touristenbüros mit Informationen zu Wanderungen und Kultur.
    history: >-
      Völker und Epochen haben einander hier abgelöst: von prähistorischen Spuren über Phönizier, Iberer,
      Römer und Westgoten bis hin zur prägenden islamischen Herrschaft.


      Der Wald hat gelitten: Waldbrände vernichteten ganze Pinsapo-Bestände wie in der Cañada de la Encina
      oder am Cerro Corona. Überweidung beschleunigt die Bodenerosion in den Hochlagen und hemmt die
      Eichenverjüngung. Ein 2011 verabschiedeter Schutzplan widmet sich dem Erhalt der Igeltanne und der
      Aufforstung brandgeschädigter Hänge.
    before: >-
      In den Höhenlagen gibt es kaum Wasserstellen: Führe ausreichend Trinkwasser, Sonnenschutz und Bergschuhe
      mit und bleibe auf den Wegen. Prüfe vorab den Wetterbericht. Von Málaga aus erreichst du das Gebiet über
      die A-357 bis Cártama und die A-366 nach Coín, Yunquera oder Alozaina in rund einer Stunde.
    around: >-
      Der [Parque Natural Los Alcornocales](/lugar/parque-natural-los-alcornocales/) liegt etwa neunundzwanzig
      Kilometer entfernt. Weiter entfernt teilt der [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/)
      mit der Sierra de las Nieves Steinbock, Gänsegeier und Karsthochgebirge; der [Parc Natural de la Serra
      de Montsant](/lugar/parc-natural-de-la-serra-de/) beherbergt ebenfalls Steinbock, Habichtsadler und
      Gänsegeier über Kalkkarst.
  it:
    intro: >-
      Nel cuore dell'Andalusia esisteva un tempo un mestiere severo: salire sulle vette in inverno, stipare la
      neve in pozzi profondi e trasportare il ghiaccio d'estate verso i paesi della pianura. I raccoglitori di
      neve (neveros) hanno dato il nome alla sierra, anche se tale attività ebbe un costo ambientale elevato
      impoverendo i querceti d'alta quota. Il Parco Nazionale Sierra de las Nieves si estende su 22.979,76
      ettari nel settore occidentale della provincia di Málaga, all'interno della Serranía de Ronda. È il
      sedicesimo parco nazionale istituito in Spagna e il terzo in Andalusia, dichiarato nel 2021 dopo essere
      stato riserva della biosfera UNESCO fin dal 1995.
    landscape: >-
      La sierra si legge attraverso netti contrasti cromatici. Da un lato le sierre bianche calcaree, con
      strapiombi, campi carreggiati, grotte e abissi: l'abisso GESM scende per 1.101 m, risultando la cavità
      carsica più profonda dell'Andalusia. Dall'altro le sierre rossastre di peridotiti, rocce ultramafiche
      del mantello terrestre assai rare in superficie che assumono toni ruggine per ossidazione del ferro; gli
      affioramenti di Ronda figurano tra i più vasti del pianeta. Tra le due formazioni si aprono le terre
      brune, coltivate da sempre dalle comunità rurali. Il picco Torrecilla, a 1.919 m, rappresenta la vetta
      più alta dell'Andalusia occidentale.


      Il clima detta i ritmi biologici. Sotto l'influsso combinato di Mediterraneo e Atlantico, le
      precipitazioni si concentrano da ottobre a marzo, con meno di 15 mm mensili nei mesi estivi. Le quote
      sommitali, più fresche e piovose, consentono la sopravvivenza relitta dell'abete pinsapo.


      I boschi salgono per fasce di quota. A quote intermedie allignano leccete, pinete di pino marittimo,
      gineprai e boschi misti con pinsapi. Negli ombrosi valloni meridionali le sugherete si arricchiscono di
      querce faginé e pinsapi. Alle quote elevate resiste il querceto montano con aceri, sorbi e tassi,
      provato da secoli di pascolo e disboscamento per carbonella. I boschi di pinsapo coprono circa 2.000 ha,
      pari al 60 % della superficie mondiale di tale essenza, e il patrimonio floristico supera 1.400 specie
      vascolari, con 15 piante a rischio d'estinzione.
    wildlife: >-
      Lo [stambecco iberico](/especie/capra_pyrenaica/) è il simbolo faunistico di queste creste scoscese.
      Convive con capriolo, faina, [genetta](/especie/genetta_genetta/), mangusta egiziana e [lontra
      europea](/especie/lutra_lutra/), insediata lungo i fiumi principali. Nel cielo volteggiano l'[aquila
      reale](/especie/aquila_chrysaetos/), l'[aquila di Bonelli](/especie/aquila_fasciata/), il biancone, il
      [gufo reale](/especie/bubo_bubo/) e il [falco pellegrino](/especie/falco_peregrinus/). Tra i rettili
      spicca la vipera di Lataste; il gambero di fiume autoctono preserva qui alcune delle ultime stazioni
      andaluse. Complessivamente si contano quasi 200 specie di vertebrati, di cui 14 figurano nel Catalogo
      Andaluso delle Specie Minacciate.


      L'autunno regala scorci suggestivi: i castagneti tingono di rame e oro la valle del Genal, attorno a
      Igualeja e Parauta, nel cosiddetto Bosque de Cobre.
    visit: >-
      Due varchi principali conducono nel cuore del parco. Il primo è la pista forestale che si dirama dalla
      strada Ronda–San Pedro de Alcántara verso l'area ricreativa di Los Quejigales; il secondo sale da
      Yunquera ai belvederi del Saucillo e di Caucón (Luis Ceballos). Le grandi direttrici
      Quejigales-Torrecilla e Puerto Saucillo-Torrecilla salgono al punto culminante dell'Andalusia
      occidentale.


      Per iniziare si consigliano tre percorsi ben tracciati. Las Escaleretas è un breve circuito verso un
      pinsapo monumento naturale: con oltre 350 anni di età, fu il gigante del parco. Conejeras è un altro
      anello accessibile nella lecceta di La Nava, arricchita da pinsapi; cinque grandi vasche da un milione
      di litri d'acqua riforniscono i mezzi antincendio. Caucón-Tajo de la Caína misura 4,4 km di livello
      medio tra pinsapares fino a una forra con oltre 100 metri di salto nel vuoto. La leggenda tramanda che
      il nome derivi da una donna detta la Caína, precipitata dalla rupe dall'Inquisizione con l'accusa di
      stregoneria.


      Per escursionisti esperti, il percorso Caucón-Peñón de los Enamorados (8 km, impegnativo, circolare di
      circa 210 minuti) attraversa pinsapari, querceti di vetta e pietraie.


      I paesi della comarca ospitano sportelli turistici municipali per informazioni su tracciati e cultura
      locale.
    history: >-
      Questo territorio ha visto succedersi popoli e dominazioni: dai cacciatori preistorici ai fenici, iberi,
      romani, visigoti e in modo marcato le genti islamiche.


      Il patrimonio boschivo ha sofferto incendi disastrosi, che hanno distrutto intere foreste di pinsapo
      come a Cañada de la Encina e Cerro Corona. Il sovrapascolo genera forte erosione e frena il rinnovamento
      del bosco montano. Nel 2011 è stato varato un piano di tutela dell'abete di Spagna per proteggere i
      popolamenti e ripristinare le aree bruciate.
    before: >-
      Le sorgenti d'acqua sono rare sui rilievi: porta scorte idriche abbondanti, copricapo e calzature da
      montagna, rimanendo sempre sui percorsi battuti. Esamina le previsioni meteo prima di partire. Da Málaga
      si raggiunge la zona percorrendo la A-357 fino a Cártama e la A-366 verso Coín, Yunquera o Alozaina in
      circa un'ora di viaggio.
    around: >-
      Il [Parque Natural Los Alcornocales](/lugar/parque-natural-los-alcornocales/) sorge a circa ventinove
      chilometri. Più distante, il [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) condivide con la
      Sierra de las Nieves lo stambecco iberico, il grifone e gli ambienti carsici di quota; il [Parc Natural
      de la Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) accoglie anch'esso stambecco, aquila di
      Bonelli e grifone su formazioni calcaree.
  pt:
    intro: >-
      No extremo sul de Espanha existiu antigamente um ofício árduo: subir aos cumes no inverno, acumular a
      neve em poços profundos e descer o gelo no verão para abastecer as vilas. Estes homens da neve (neveros)
      deram o nome a esta serra, embora a atividade tenha acarretado um custo ecológico pesado na degradação
      dos carvalhais de altitude. O Parque Nacional Sierra de las Nieves estende-se por 22.979,76 hectares no
      setor poente da província de Málaga, na Serranía de Ronda. É o décimo sexto parque nacional instituído
      em Espanha e o terceiro da Andaluzia, classificado em 2021 após ser reconhecido como Reserva da Biosfera
      da UNESCO desde 1995.
    landscape: >-
      A serra decifra-se por expressivos contrastes cromáticos. De um lado sobressaem as serras brancas,
      calcárias, talhadas em escarpas, lapiás, grutas e algares: o algar GESM precipita-se por 1.101 m,
      constituindo a cavidade mais profunda da Andaluzia. Do outro lado avultam as serras avermelhadas de
      peridotitos, rochas ultramáficas do manto terrestre raríssimas à superfície que ganham tons vermelhos
      pela oxidação férrica; os seus afloramentos em Ronda situam-se entre os mais grandiosos do mundo. No
      meio abrem-se as terras pardas, exploradas desde sempre pela agricultura tradicional. O pico Torrecilla
      atinge 1.919 m, coroando o relevo da Andaluzia ocidental.


      O clima dita a dinâmica ambiental. Sob influência combinada do Mediterrâneo e do Atlântico, a
      precipitação concentra-se de outubro a março, caindo para menos de 15 mm mensais no estio. Os cumes mais
      frios e chuvosos asseguram a sobrevivência do abeto pinsapo.


      A floresta reparte-se por andares. A meia encosta estendem-se azinhais, pinhais de pinheiro-bravo,
      zimbrais e matas mistas de pinheiro e pinsapo. Nos vales frescos do sul, o sobreiral acolhe carvalhos e
      pinsapos. Na alta montanha resiste o carvalhal de altitude com bordos, aveleiras e teixos, desgastado
      por séculos de pastorícia e carvoaria. Os bosques de pinsapo cobrem cerca de 2.000 ha, acolhendo 60 % da
      área mundial desta espécie rara, enquanto a flora vascular supera 1.400 espécies de plantas, integrando
      15 espécies em perigo.
    wildlife: >-
      A [cabra-montês](/especie/capra_pyrenaica/) simboliza a natureza áspera destas serras escarpadas.
      Partilha o habitat com a corça, a fuinha, a [gineta](/especie/genetta_genetta/), o saca-rabos e a
      [lontra-europeia](/especie/lutra_lutra/), que ocorre nas principais linhas de água. Nos ares planam a
      [águia-real](/especie/aquila_chrysaetos/), a [águia-de-bonelli](/especie/aquila_fasciata/), a
      águia-cobreira, o [bufo-real](/especie/bubo_bubo/) e o [falcão-peregrino](/especie/falco_peregrinus/).
      Nos répteis evidencia-se a víbora-cornuda; o lagostim-de-patas-brancas autóctone conserva aqui alguns
      dos derradeiros redutos andaluzes. Ao todo contam-se quase 200 espécies de vertebrados, constando 14 do
      Catálogo Andaluz de Espécies Ameaçadas.


      O outono proporciona um quadro cromático célebre: os soutos de castanheiros cobrem o vale do Genal, em
      Igualeja e Parauta, de cambiantes acobreados no designado Bosque de Cobre.
    visit: >-
      Dois acessos principais penetram no coração do parque. Um segue pela pista florestal que parte da
      estrada Ronda–San Pedro de Alcántara até ao parque de merendas de Los Quejigales; o outro ascende a
      partir de Yunquera até aos miradouros do Saucillo e de Caucón (Luis Ceballos). Os trilhos estruturantes
      Quejigales-Torrecilla e Puerto Saucillo-Torrecilla conduzem ao cume mais alto da Andaluzia ocidental.


      Para um primeiro contacto salientam-se três trilhos. Las Escaleretas é um percurso circular curto que
      visita um exemplar monumental de pinsapo com mais de 350 anos, em tempos o maior do parque. Conejeras é
      outro anel fácil no montado de La Nava, combinando azinheiras e pinsapos; cinco tanques de água de um
      milhão de litros garantem apoio aos meios de combate a fogos. Caucón-Tajo de la Caína soma 4,4 km de
      dificuldade média por entre pinsapos até uma falésia com mais de 100 metros de despenhadeiro vertical.
      Reza a lenda que o nome recorda uma mulher apelidada de La Caína, precipitada no abismo pela Inquisição
      sob acusação de feitiçaria.


      Para percursos mais longos, a rota Caucón-Peñón de los Enamorados (8 km, exigente, anel de cerca de 210
      minutos) atravessa pinsapares, carvalhais de altitude e fragas calcárias.


      As povoações ribeirinhas contam com postos municipais de acolhimento para apoio a caminhantes.
    history: >-
      Diferentes civilizações sobrepuseram-se neste território: de povoamentos pré-históricos a fenícios,
      iberos, romanos, visigodos e, de forma estruturante, comunidades islâmicas.


      A floresta sofreu graves impactos: os incêndios representam o maior flagelo, destruindo núcleos inteiros
      de pinsapos como na Cañada de la Encina ou Cerro Corona. O sobrepastoreio acentua a erosão nos cumes e
      entrava a regeneração do carvalho de montanha. Em 2011 foi aprovado um Plano de Recuperação do pinsapo
      para salvaguardar as populações existentes e reflorestar encostas ardidas.
    before: >-
      As nascentes perenes são escassas nas zonas cimeiras: transporta água potável abundante, protetor solar
      e calçado de caminhada, seguindo sempre pelos caminhos balizados. Confirma as previsões meteorológicas
      antes da partida. A partir de Málaga chega-se pela A-357 até Cártama e pela A-366 em direção a Coín,
      Yunquera ou Alozaina em aproximadamente uma hora.
    around: >-
      O [Parque Natural Los Alcornocales](/lugar/parque-natural-los-alcornocales/) localiza-se a cerca de
      vinte e nove quilómetros. Mais além, o [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/)
      partilha com a Sierra de las Nieves a cabra-montês, o abutre-fouveiro e os relevos cársticos de
      altitude; o [Parc Natural de la Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) alberga também a
      cabra-montês, a águia-de-bonelli e o abutre-fouveiro em serranias calcárias.
