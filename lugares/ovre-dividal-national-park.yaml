resumen:
  es: >-
    Uno de los pocos parques nacionales europeos donde coexisten de forma estable los cuatro grandes
    depredadores árticos: oso pardo, lobo, lince y glotón.
  en: >-
    One of the few European national parks where all four large Arctic predators stably coexist: brown bear,
    wolf, lynx, and wolverine.
  fr: >-
    L'un des rares parcs nationaux d'Europe où cohabitent durablement les quatre grands prédateurs arctiques :
    ours brun, loup, lynx et glouton.
  de: >-
    Einer der wenigen europäischen Nationalparks, in dem die vier großen arktischen Raubtiere stabil
    nebeneinander existieren: Braunbär, Wolf, Luchs und Vielfraß.
  it: >-
    Uno dei pochi parchi nazionali europei in cui coesistono stabilmente i quattro grandi predatori artici:
    orso bruno, lupo, lince e ghiottone.
  pt: >-
    Um dos raros parques nacionais europeus onde coexistem de forma estável os quatro grandes predadores
    árticos: urso-pardo, lobo, lince e glutão.
unico:
  es: >-
    Aquí la población de glotón es de las más densas del norte de Europa, y cada año nacen crías en muchas
    madrigueras del parque.
  en: >-
    Here the wolverine population ranks among the densest in northern Europe, with cubs born every year in
    numerous dens throughout the park.
  fr: >-
    La population de gloutons y est l'une des plus denses d'Europe du Nord, avec des petits qui naissent
    chaque année dans de nombreuses tanières du parc.
  de: >-
    Hier erreicht die Vielfraßpopulation eine der höchsten Dichten Nordeuropas, und jedes Jahr werden in
    zahlreichen Höhlen des Parks Jungtiere geboren.
  it: >-
    Qui la popolazione di ghiottoni è tra le più dense del Nord Europa, e ogni anno nascono piccoli in
    numerose tane all'interno del parco.
  pt: >-
    Aqui a população de glutões é uma das mais densas do norte da Europa, e todos os anos nascem crias em
    inúmeras tocas no interior do parque.
observaciones:
  es: >-
    Puedes ir por donde quieras, a pie o en esquís, pero todo lo que lleve motor está básicamente prohibido.
    Se puede acampar donde se quiera, con la obligación de llevarse la basura. Hay prohibición general de
    fuego en el bosque del 15 de abril al 15 de septiembre. Los perros pueden entrar, pero atados del 1 de
    abril al 1 de septiembre. Respeta al reno, sobre todo en la época de partos, en mayo y junio.
texto:
  es:
    intro: >-
      En el interior de Troms, pegado a Suecia, hay un valle donde vive una de las poblaciones de glotón más
      densas del norte de Europa. Øvre Dividal es un parque de 770 km² que se estableció en 1971 y se amplió
      en 2006 para proteger un valle interior y una zona de montaña en gran parte sin perturbar. No tiene la
      fama de otros parques noruegos, y eso es parte del encanto: pinares viejos y retorcidos, abedulares,
      montañas redondeadas, lagos, turberas y cañones. Es, sobre todo, el reino del glotón.
    landscape: >-
      El parque empieza a unos 300 m y sube hasta los 1.600. En ese desnivel el bosque se ordena como un libro
      de texto: pinares en las cotas bajas, abedul de montaña más arriba y, en la tundra alpina abierta,
      sauces y abedul enano. A lo largo del Divielva quedan rodales de pinar antiguo y bosque caducifolio con
      una flora y una fauna muy ricas, incluidos muchos líquenes, hongos y escarabajos raros.


      El suelo cuenta una historia más larga. Hace unos 600 millones de años se depositaron conglomerados,
      areniscas y pizarras —el Grupo Dividal— sobre un zócalo granítico, y esas rocas asoman todavía en
      laderas como la de Bumannsberget. Mucho después, los glaciares de la última edad de hielo dejaron
      bloques erráticos en varias cumbres: un enorme bloque de granito rojo junto al mojón de la cima de Jerta
      llegó desde Suecia. Varios ríos han excavado barrancos, y en medio del valle aparecen rocas enormes en
      lugares improbables, abandonadas por el hielo al azar.


      El clima es seco. A 228 m de altitud, Dividalen es el segundo valle más seco de Noruega, con 282 mm de
      precipitación anual. En las cotas bajas no hay permafrost; por encima de 700 m, es común.


      Entre las plantas, se han registrado 315 especies. Abunda la brecina blanca ártica, que solo crece en el
      norte de Noruega, y crece de forma natural el diminuto Rhododendron lapponicum.
    wildlife: >-
      Aquí están todos los grandes depredadores del continente. El [glotón](/especie/gulo_gulo/) es el
      protagonista: su población es de las más densas del norte de Europa y en invierno el
      [reno](/especie/rangifer_tarandus/) pesa mucho en su dieta. El [oso pardo](/especie/ursus_arctos/)
      comparte población con Suecia y casi cada año se ven hembras con crías. El [zorro
      ártico](/especie/vulpes_lagopus/) y el [lince](/especie/lynx_lynx/) son residentes, y el
      [lobo](/especie/canis_lupus/) recorre el parque con regularidad, aunque es raro y probablemente no tiene
      presencia permanente. El reno, de propiedad sami, es común, igual que el [alce](/especie/alces_alces/).


      Las aves llegan con las migraciones de primavera y otoño. En los humedales extensos se ven combatientes
      y falaropos picofinos, junto a muchas especies de patos. En el bosque abundan las aves pequeñas y anida
      el [urogallo](/especie/tetrao_urogallus/). Crían el [águila real](/especie/aquila_chrysaetos/), el
      busardo calzado, el [halcón gerifalte](/especie/falco_rusticolus/) y el cernícalo; el [búho
      nival](/especie/bubo_scandiacus/) aparece los años en que abundan los roedores.
    visit: >-
      La ruta ártica, la Nordkalottruta, atraviesa el parque y es el eje de las travesías; puedes empezarla al
      final de la carretera de Dividalen o desde Innset, en Altevatn. Para un día basta menos: desde el
      aparcamiento al final de la carretera de Dividalen hasta la cabaña de Ole Nergård, de allí a las cabañas
      de Dividal y vuelta. Otro paseo corto lleva por el pinar antiguo de árboles retorcidos, y Skakterdalen,
      un cañón, queda a una hora a pie de la carretera.


      Hay cabañas para pasar la noche: las de la asociación de senderistas de Troms (Dividal, Vuomma y Gaska)
      y la de Ole Nergård, un refugio de troncos sin llave de Statskog. Se puede acceder por la carretera de
      Dividalen y una pista forestal hasta Skaktarelva (en invierno) o Gambekken (en verano), por Rostadalen
      hasta Innset y Tverrelvmo, o hasta Altevatn.


      En otoño, el bosque antiguo ofrece setas y bayas que se pueden recoger para uso propio.
    history: >-
      El nombre Dividal viene de la palabra sami *dievva*, una colina redonda y seca. Generaciones de sami
      usaron la zona y dejaron lugares de sacrificio, restos de casas de turba, depósitos de carne y viejas
      cercas de abedul para el reno. A finales del siglo XVIII llegaron colonos noruegos y kvenes al interior
      de Troms; Dividalen se pobló tarde, y su granja más alta, Frihetsli, no se desbrozó hasta 1844. Hoy
      pastan en el parque, en verano, renos de las comunidades sami suecas de Lainiovuoma y Saarivuoma.
    before: >-
      Puedes ir por donde quieras, a pie o en esquís, pero todo lo que lleve motor está básicamente prohibido.
      Se puede acampar donde se quiera, con la obligación de llevarse la basura. Hay prohibición general de
      fuego en el bosque del 15 de abril al 15 de septiembre. Los perros pueden entrar, pero atados del 1 de
      abril al 1 de septiembre. Respeta al reno, sobre todo en la época de partos, en mayo y junio.
    around: >-
      Øvre Dividal no tiene vecinos cercanos en el atlas, pero comparte glotón, lobo y oso pardo con otros
      parques del norte. El [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/), el [Parque
      Nacional de Sarek](/lugar/sarek-national-park/), el [Parque Nacional de
      Hossa](/lugar/hossan-kansallispuisto/) y el [Parque Nacional de
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/) tienen, como él, glotón y lobo, y Urho Kekkonen, Hossa
      y Femundsmarka también oso pardo.
  en:
    intro: >-
      In the interior of Troms, hugging the Swedish border, lies a secluded valley harboring one of the
      densest wolverine populations in northern Europe. Øvre Dividal is a 770 km² park established in 1971 and
      expanded in 2006 to safeguard a largely undisturbed inland valley and mountain landscape. It lacks the
      fame of other Norwegian parks, and that is central to its charm: ancient, gnarled pine forests, mountain
      birch groves, rounded massifs, pristine lakes, peatlands, and deep ravines. Above all, it is the realm
      of the wolverine.
    landscape: >-
      The park ascends from around 300 m up to 1,600. Across this gradient the forest terraces with textbook
      clarity: ancient pine forests at lower elevations, mountain birch higher up, and, across the open alpine
      tundra, willow thickets and dwarf birch. Along the Divielva river linger ancient stands of old-growth
      pine and deciduous woods supporting rich flora and fauna, including many rare lichens, fungi, and
      beetles.


      The ground tells a much longer saga. Some 600 million years ago, conglomerates, sandstones, and
      shales—the Dividal Group—were deposited over a granite basement, and these bedrock layers remain exposed
      on escarpments such as Bumannsberget. Much later, glaciers of the last ice age stranded erratic boulders
      on high summits: a massive red granite erratic beside the cairn on the peak of Jerta was transported all
      the way from Sweden. Several rivers have carved canyons, while across the valley floor colossal boulders
      lie in improbable spots, deposited at random by retreating ice.


      The climate is continental and dry. At 228 m altitude, Dividalen is Norway's second driest valley,
      receiving just 282 mm of annual precipitation. Low-lying valley floors lack permafrost; above 700 m, it
      is ubiquitous.


      Among plants, 315 species have been recorded. Arctic white heather, which grows only in northern Norway,
      is abundant, and the tiny Rhododendron lapponicum grows naturally here.
    wildlife: >-
      All four large European carnivores inhabit the park. The [wolverine](/especie/gulo_gulo/) takes center
      stage: its population is among the densest in northern Europe, and in winter
      [caribou](/especie/rangifer_tarandus/) constitutes the mainstay of its diet. The [brown
      bear](/especie/ursus_arctos/) shares a cross-border population with Sweden, and sows with cubs are
      sighted almost every year. The [Arctic fox](/especie/vulpes_lagopus/) and [Eurasian
      lynx](/especie/lynx_lynx/) are resident, while the [grey wolf](/especie/canis_lupus/) regularly ranges
      through the park, though it is scarce and likely lacks permanent pack residency. Reindeer, owned by Sami
      herders, are common, as is the [moose](/especie/alces_alces/).


      Birds arrive with the spring and autumn migrations. Extensive wetlands attract ruffs and red-necked
      phalaropes alongside numerous duck species. Woodlands teem with passerines and host nesting [western
      capercaillies](/especie/tetrao_urogallus/). Raptors include breeding [golden
      eagles](/especie/aquila_chrysaetos/), rough-legged buzzards, [gyrfalcons](/especie/falco_rusticolus/),
      and kestrels; the [snowy owl](/especie/bubo_scandiacus/) appears in years of rodent irruptions.
    visit: >-
      The Arctic Nordkalottruta trail traverses the park, serving as the spine for long-distance treks; you
      can pick it up at the end of the Dividalen road or from Innset at Altevatn. For a day trip, less is
      required: from the trailhead car park at the end of the Dividalen road to the Ole Nergård cabin, onwards
      to the Dividal cabins, and back. Another short stroll meanders through the gnarled old-growth pine
      woods, while the canyon of Skakterdalen lies an hour's hike from the road.


      Overnight huts are available: the Troms Turlag hiking association cabins (Dividal, Vuomma, and Gaska)
      and the Ole Nergård cabin, an unlocked Statskog log shelter. Access is via the Dividalen road and a
      forest track to Skaktarelva (in winter) or Gambekken (in summer), through Rostadalen to Innset and
      Tverrelvmo, or up to Altevatn.


      In autumn, the ancient forests yield mushrooms and berries that you can forage for personal consumption.
    history: >-
      The name Dividal originates from the Sami word *dievva*, designating a rounded, dry hill. Generations of
      Sami inhabited the land, leaving sacred sacrifice sites, turf hut remnants, meat caches, and ancient
      birch reindeer corrals. In the late eighteenth century, Norwegian and Kven settlers penetrated interior
      Troms; Dividalen was colonized late, and its highest homestead, Frihetsli, was not cleared until 1844.
      Today, reindeer belonging to the Swedish Sami reindeer-herding districts of Lainiovuoma and Saarivuoma
      graze the park in summer.
    before: >-
      You may roam wherever you wish on foot or skis, but motorized transport is essentially prohibited. Wild
      camping is permitted anywhere, provided you pack out all refuse. A general campfire ban in or near
      woodlands applies from 15 April to 15 September. Dogs are welcome but must be kept on a leash from 1
      April to 1 September. Respect reindeer, especially during calving season in May and June.
    around: >-
      Øvre Dividal has no immediate neighbors in the atlas, yet it shares wolverine, wolf, and brown bear with
      other northern wildernesses. [Urho Kekkonen National Park](/lugar/urho-kekkonen-national-park/), [Sarek
      National Park](/lugar/sarek-national-park/), [Hossa National Park](/lugar/hossan-kansallispuisto/), and
      [Femundsmarka National Park](/lugar/femundsmarka-nasjonalpark/) all shelter wolverines and wolves, while
      Urho Kekkonen, Hossa, and Femundsmarka also support brown bears.
  fr:
    intro: >-
      Dans l'intérieur du comté de Troms, adossée à la Suède, une vallée isolée abrite l'une des populations
      de gloutons les plus denses d'Europe du Nord. Øvre Dividal est un parc de 770 km² créé en 1971 et
      agrandi en 2006 pour sauvegarder une vallée intérieure et un massif montagnard largement préservés de
      toute perturbation. Il ne jouit pas de la renommée d'autres parcs norvégiens, et c'est là tout son
      charme : vieilles pinèdes noueuses, bétulaies d'altitude, reliefs arrondis, lacs purs, tourbières et
      profonds canyons. C'est avant tout le royaume du glouton.
    landscape: >-
      Le parc s'élève d'environ 300 m jusqu'à 1 600. Sur ce dénivelé, l'étagement forestier s'ordonne avec la
      clarté d'un manuel : vieilles pinèdes en fond de vallée, bouleaux de montagne plus haut, puis saules et
      bouleaux nains sur la toundra alpine dégagée. Le long de la Divielva subsistent des peuplements anciens
      de pins sylvestres et de feuillus abritant une flore et une faune très riches, dont nombre de lichens,
      champignons et coléoptères rares.


      Le sous-sol raconte une histoire bien plus ancienne. Il y a environ 600 millions d'années, des
      conglomérats, grès et schistes — le Groupe de Dividal — se sont déposés sur un socle granitique, roches
      qui affleurent encore sur des versants comme celui de Bumannsberget. Bien plus tard, les glaciers de la
      dernière période glaciaire ont abandonné des blocs erratiques sur plusieurs crêtes : un imposant bloc de
      granite rouge près du cairn sommital de Jerta provient de Suède. Plusieurs rivières ont creusé de
      spectaculaires ravins, et au milieu de la vallée émergent d'immenses blocs erratiques disséminés au
      hasard par le retrait glaciaire.


      Le climat est continental et sec. À 228 m d'altitude, Dividalen est la deuxième vallée la plus sèche de
      Norvège, avec 282 mm de précipitations annuelles. Dans les parties basses, il n'y a pas de pergélisol ;
      au-dessus de 700 m, il devient omniprésent.


      Parmi les plantes, 315 espèces ont été recensées. La cassiope tétragone, qui ne pousse que dans le nord
      de la Norvège, abonde ici, aux côtés de la forme sauvage du minuscule Rhododendron lapponicum.
    wildlife: >-
      Tous les grands prédateurs du continent sont présents. Le [glouton](/especie/gulo_gulo/) est la vedette
      des lieux : sa densité est parmi les plus fortes d'Europe septentrionale et, en hiver, le
      [renne](/especie/rangifer_tarandus/) représente la base de son alimentation. L'[ours
      brun](/especie/ursus_arctos/) partage sa population avec la Suède et l'on observe presque chaque année
      des mères accompagnées de leurs oursons. Le [renard polaire](/especie/vulpes_lagopus/) et le [lynx
      boréal](/especie/lynx_lynx/) sont résidents, tandis que le [loup](/especie/canis_lupus/) sillonne
      régulièrement le territoire, bien qu'il y soit rare et sans présence pérenne avérée de meute. Les rennes
      d'élevage sami sont omniprésents, de même que l'[élan](/especie/alces_alces/).


      Les oiseaux affluent aux migrations de printemps et d'automne. De vastes zones humides attirent des
      combattants variés et des phalaropes à bec étroit, ainsi que de nombreuses espèces de canards. Les bois
      abritent une multitude de passereaux et des couples nicheurs de [grand
      tétras](/especie/tetrao_urogallus/). Les rapaces nicheurs comptent l'[aigle
      royal](/especie/aquila_chrysaetos/), la buse pattue, le [faucon gerfaut](/especie/falco_rusticolus/) et
      le faucon crécerelle ; le [harfang des neiges](/especie/bubo_scandiacus/) fait son apparition les années
      d'abondance de rongeurs.
    visit: >-
      La grande traversée arctique de la Nordkalottruta sillonne le parc et constitue l'épine dorsale des
      randonnées au long cours ; vous pouvez l'entamer au terminus de la route de Dividalen ou depuis Innset
      près d'Altevatn. Pour une excursion d'un jour, le programme est plus simple : partez du parking au bout
      de la route de Dividalen jusqu'au refuge d'Ole Nergård, poursuivez vers les chalets de Dividal et
      revenez. Une autre promenade agréable serpente au milieu des vieux pins tordus, tandis que le canyon de
      Skakterdalen se rejoint en une heure de marche depuis la route.


      Des refuges permettent de passer la nuit : ceux de l'association de randonnée de Troms (Dividal, Vuomma
      et Gaska) et la cabane en rondins d'Ole Nergård, gérée par Statskog et accessible sans clé. Les accès
      s'effectuent par la route de Dividalen prolongée par une piste forestière jusqu'à Skaktarelva (en hiver)
      ou Gambekken (en été), par le vallon de Rostadalen vers Innset et Tverrelvmo, ou encore en direction
      d'Altevatn.


      En automne, la forêt ancienne offre une profusion de baies et de champignons que vous pouvez cueillir
      pour votre usage personnel.
    history: >-
      Le toponyme Dividal provient du terme sami *dievva*, qui désigne une colline ronde et sèche. Des
      générations de Samis ont parcouru la contrée en y laissant des sites sacrificiels, des vestiges de
      huttes de tourbe, des caches à viande et d'anciens enclos en bouleau pour les rennes. À la fin du
      dix-huitième siècle, des pionniers norvégiens et kvènes s'établirent dans l'intérieur du Troms ;
      Dividalen fut colonisée tardivement et sa ferme la plus haute, Frihetsli, ne fut défrichée qu'en 1844.
      De nos jours, les rennes des communautés samies suédoises de Lainiovuoma et Saarivuoma paissent dans le
      parc en période estivale.
    before: >-
      Vous pouvez circuler librement à pied ou à skis, mais tout engin à moteur est rigoureusement prohibé. Le
      bivouac sauvage est autorisé partout, sous réserve d'emporter tous ses déchets. Les feux en forêt font
      l'objet d'une interdiction générale du 15 avril au 15 septembre. Les chiens sont admis mais doivent
      impérativement être tenus en laisse du 1 avril au 1 septembre. Respectez impérativement les rennes,
      particulièrement durant la période des naissances en mai et juin.
    around: >-
      Øvre Dividal ne possède aucun voisin immédiat dans l'atlas, mais il partage glouton, loup et ours brun
      avec d'autres grands parcs du Grand Nord. Le [Parc national Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), le [Parc national de
      Sarek](/lugar/sarek-national-park/), le [Parc national d'Hossa](/lugar/hossan-kansallispuisto/) et le
      [Parc national de Femundsmarka](/lugar/femundsmarka-nasjonalpark/) abritent comme lui gloutons et loups,
      tandis qu'Urho Kekkonen, Hossa et Femundsmarka accueillent également l'ours brun.
  de:
    intro: >-
      Im Landesinneren von Troms, direkt an der schwedischen Grenze, liegt ein abgelegenes Tal mit einer der
      dichtesten Vielfraßpopulationen Nordeuropas. Øvre Dividal ist ein 770 km² großer Nationalpark, der 1971
      ausgewiesen und 2006 erweitert wurde, um ein weitgehend unberührtes Inntal und alpine
      Gebirgslandschaften zu schützen. Er besitzt nicht den Bekanntheitsgrad anderer norwegischer Parks, was
      seinen Reiz ausmacht: alte, knorrige Kiefernwälder, lichte Fjällbirken, runde Bergrücken, stille Seen,
      Moore und tiefe Schluchten. Vor allem ist es das Reich des Vielfraßes.
    landscape: >-
      Der Park steigt von rund 300 m bis auf 1.600 m an. Über diesen Höhenunterschied staffelt sich die
      Vegetation wie im Lehrbuch: uralte Kiefernwälder in den Talauen, Birkenwälder darüber und in der offenen
      Bergtundra Zwergbirken und Weidengebüsche. Entlang des Flusses Divielva stehen Reste alter Urwälder und
      Laubmischwälder mit reicher Flora und Fauna, darunter viele seltene Flechten, Pilze und Käfer.


      Der geologische Untergrund erzählt eine noch längere Erdgeschichte. Vor rund 600 Millionen Jahren
      lagerten sich Konglomerate, Sandsteine und Tonschiefer — die Dividal-Gruppe — auf dem Urgesteinssockel
      ab, Gesteine, die an Steilhängen wie dem Bumannsberget zutage treten. Viel später hinterließen die
      Gletscher der letzten Eiszeit Findlinge auf vielen Gipfeln: Ein riesiger roter Granitblock neben dem
      Gipfelsteinmann der Jerta wurde einst aus Schweden herantransportiert. Mehrere Flüsse haben tiefe
      Schluchten gegraben, und im Talboden liegen gewaltige Felsblöcke verstreut, die das Eis willkürlich
      abgelegt hat.


      Das Klima ist ausgesprochen trocken. Auf 228 m Höhe ist Dividalen mit 282 mm Jahresniederschlag das
      zweittrockenste Tal Norwegens. Im Talboden gibt es keinen Dauerfrostboden; oberhalb von 700 m ist
      Permafrost dagegen weit verbreitet.


      Unter den Gefäßpflanzen wurden 315 Arten kartiert. Weit verbreitet ist die Moosheide (Cassiope
      tetragona), die nur im Norden Norwegens wächst, sowie das wild vorkommende Zwerg-Rhododendron
      (Rhododendron lapponicum).
    wildlife: >-
      Alle großen Raubtiere des europäischen Kontinents leben hier. Der [Vielfraß](/especie/gulo_gulo/) steht
      im Mittelpunkt: Seine Population zählt zu den dichtesten Nordeuropas, und im Winter bildet das
      [Ren](/especie/rangifer_tarandus/) die Hauptnahrungsquelle. Der [Braunbär](/especie/ursus_arctos/) teilt
      seinen Bestand mit Schweden, und fast jedes Jahr werden Bärinnen mit Nachwuchs gesichtet.
      [Polarfuchs](/especie/vulpes_lagopus/) und [Eurasischer Luchs](/especie/lynx_lynx/) sind dauerhaft
      heimisch, während der [Wolf](/especie/canis_lupus/) das Areal regelmäßig durchstreift, wenn auch selten
      und wohl ohne festes Rudelrevier. Rentiere der Samen weiden zahlreich, ebenso lebt der
      [Elch](/especie/alces_alces/) im Tal.


      Die Vogelwelt pulsiert im Rhythmus des Vogelzugs. Auf den Moorflächen rasten Kampfläufer und
      Odinshühnchen neben diversen Entenarten. In den Wäldern singen zahllose Singvögel und brütet das
      [Auerhuhn](/especie/tetrao_urogallus/). Zu den Brutvögeln gehören
      [Steinadler](/especie/aquila_chrysaetos/), Raufußbussard, [Gerfalke](/especie/falco_rusticolus/) und
      Turmfalke; die [Schnee-Eule](/especie/bubo_scandiacus/) erscheint verlässlich in Jahren mit
      Nagergradationen.
    visit: >-
      Der arktische Fernwanderweg Nordkalottruta zieht sich quer durch den Park und dient als Hauptachse für
      Weitwanderungen; du kannst ihn am Ende der Straße von Dividalen oder von Innset am Altevatn beginnen.
      Für einen Tagesausflug genügt weniger: Vom Parkplatz am Ende der Straße von Dividalen wanderst du zur
      Hütte Ole Nergård, weiter zu den Dividal-Hütten und zurück. Ein weiterer kurzer Rundweg führt durch die
      knorrigen Urkiefern, und die Schlucht Skakterdalen liegt nur eine Wanderstunde von der Straße entfernt.


      Für Übernachtungen stehen Hütten bereit: die Unterkünfte des Troms Turlag (Dividal, Vuomma und Gaska)
      sowie die Hütte Ole Nergård, eine stets offene Blockhütte von Statskog. Der Zugang erfolgt über die
      Straße durchs Dividalen und einen Forstweg nach Skaktarelva (im Winter) oder Gambekken (im Sommer), über
      das Rostadalen nach Innset und Tverrelvmo oder bis zum See Altevatn.


      Im Herbst schenkt der Urwald reichlich Beeren und Pilze, die du für den Eigenbedarf sammeln darfst.
    history: >-
      Der Name Dividal leitet sich vom samischen Wort *dievva* ab, was einen runden, trockenen Hügel
      bezeichnet. Generationen samischer Hirten nutzten das Tal und hinterließen Opferplätze, Reste von
      Torfhütten, Fleischspeicher und alte Zäune aus Birkenstämmen für die Rentiere. Gegen Ende des
      achtzehnten Jahrhunderts zogen norwegische und kvenische Siedler ins Innere von Troms; das Dividalen
      wurde spät besiedelt, und das höchstgelegene Gehöft, Frihetsli, entstand erst 1844. Heute weiden im
      Sommer Rentiere der schwedischen Samengemeinden Lainiovuoma und Saarivuoma im Park.
    before: >-
      Du darfst dich zu Fuß und auf Skiern frei bewegen, motorisierte Fahrzeuge sind jedoch grundsätzlich
      verboten. Zelten ist überall gestattet, solange du deinen Müll vollständig wieder mitnimmst. Es gilt ein
      allgemeines Lagerfeuerverbot in Waldnähe vom 15. April bis zum 15. September. Hunde sind willkommen,
      müssen aber vom 1. April bis zum 1. September an der Leine geführt werden. Nimm stets Rücksicht auf die
      Rentiere, besonders während der Kalbezeit im Mai und Juni.
    around: >-
      Øvre Dividal hat keine direkten Nachbarn im Atlas, teilt aber Vielfraß, Wolf und Braunbär mit anderen
      arktischen Wildnisgebieten. Der [Nationalpark Urho Kekkonen](/lugar/urho-kekkonen-national-park/), der
      [Nationalpark Sarek](/lugar/sarek-national-park/), der [Nationalpark
      Hossa](/lugar/hossan-kansallispuisto/) und der [Nationalpark
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/) beherbergen wie er Vielfraß und Wolf; Urho Kekkonen,
      Hossa und Femundsmarka zudem den Braunbären.
  it:
    intro: >-
      Nell'entroterra di Troms, a ridosso del confine svedese, una valle isolata accoglie una delle
      popolazioni di ghiottoni più dense del Nord Europa. Øvre Dividal è un parco di 770 km² istituito nel
      1971 e ampliato nel 2006 per preservare una vallata interna e un paesaggio montano quasi intatti da
      interferenze umane. Non possiede la notorietà di altri parchi norvegesi, e ciò costituisce il suo
      fascino principale: antiche pinete contorte, betulle d'alta quota, rilievi ondulati, specchi d'acqua
      immacolati, torbiere e forre scoscese. È soprattutto il regno del ghiottone.
    landscape: >-
      Il territorio si innalza da circa 300 m fino a quota 1.600. Lungo questo dislivello il bosco si dispone
      come in un manuale didattico: pinete secolari alle quote basse, betulla montana più in quota e, nella
      tundra alpina aperta, cespugli di salice e betulla nana. Lungo il corso della Divielva sopravvivono
      lembi di pineta primigenia e boschi decidui ricchissimi di flora e fauna, comprendenti rari licheni,
      funghi e coleotteri.


      Il substrato roccioso custodisce una memoria ben più arcaica. Circa 600 milioni di anni fa conglomerati,
      arenarie e scisti — il Gruppo di Dividal — si depositarono sopra un basamento granitico, affiorando
      tuttora su pendii scoscesi come quello di Bumannsberget. Molto più tardi, i ghiacciai dell'ultima era
      glaciale abbandonarono massi erratici su svariate vette: un enorme blocco di granito rosso posato
      accanto all'omino di vetta del monte Jerta giunse direttamente dalla Svezia. Diversi corsi d'acqua hanno
      scavato gole, mentre sul fondovalle si scorgono massi ciclopici lasciati nei punti più impensati dal
      ritiro dei ghiacci.


      Il clima si caratterizza per una spiccata aridità. A 228 m di altitudine, Dividalen è la seconda valle
      più asciutta della Norvegia, con appena 282 mm di pioggia all'anno. A quote basse manca il permafrost;
      oltre i 700 m, è invece una presenza costante.


      Tra la flora vascolare sono state censite 315 specie. Abbonda l'erica bianca artica, presente soltanto
      nella Norvegia settentrionale, e cresce spontaneo il minuscolo Rhododendron lapponicum.
    wildlife: >-
      Nel parco vivono tutti i maggiori carnivori del continente europeo. Il [ghiottone](/especie/gulo_gulo/)
      è il sovrano incontrastato: la sua densità è tra le maggiori del Nord Europa e in inverno la
      [renna](/especie/rangifer_tarandus/) rappresenta la base principale della sua dieta. L'[orso
      bruno](/especie/ursus_arctos/) condivide la propria popolazione con la Svezia e quasi ogni anno si
      avvistano femmine con cuccioli. La [volpe artica](/especie/vulpes_lagopus/) e la [lince
      eurasiatica](/especie/lynx_lynx/) sono stanziali, mentre il [lupo grigio](/especie/canis_lupus/)
      perlustra regolarmente l'area, sebbene sia raro e senza branchi stabili accertati. Le renne degli
      allevatori sami pascolano ovunque, affiancate dall'[alce](/especie/alces_alces/).


      L'avifauna segue il ritmo delle migrazioni primaverili e autunnali. Nelle ampie torbiere sostano
      combattenti e falaropi beccosottile, accanto a svariate specie di anatre. I boschi risuonano di
      passeriformi e offrono rifugio all'[urogallo](/especie/tetrao_urogallus/). Tra i rapaci nidificano
      l'[aquila reale](/especie/aquila_chrysaetos/), la poiana calzata, il
      [girifalco](/especie/falco_rusticolus/) e il gheppio; il [gufo delle nevi](/especie/bubo_scandiacus/)
      compare negli anni di picco dei roditori.
    visit: >-
      Il percorso artico della Nordkalottruta solca il parco e rappresenta la direttrice principale delle
      traversate; puoi imboccarlo al termine della strada di Dividalen o da Innset, presso l'Altevatn. Per una
      gita in giornata serve meno impegno: dal parcheggio a fine strada procedi fino al capanno di Ole
      Nergård, prosegui verso i rifugi di Dividal e rientra. Una breve passeggiata alternativa conduce tra i
      pini secolari contorti, mentre la gola di Skakterdalen dista solo un'ora a piedi dalla carreggiata.


      Per il pernottamento vi sono comode strutture: i rifugi dell'associazione escursionistica di Troms
      (Dividal, Vuomma e Gaska) e la casetta in tronchi di Ole Nergård, sempre aperta e gestita da Statskog.
      L'accesso avviene tramite la strada di Dividalen e una pista sterrata fino a Skaktarelva (in inverno) o
      Gambekken (in estate), risalendo la Rostadalen verso Innset e Tverrelvmo, o salendo verso l'Altevatn.


      In autunno i boschi vetusti regalano bacche e funghi che è possibile raccogliere per uso personale.
    history: >-
      Il toponimo Dividal discende dalla voce sami *dievva*, indicante un rilievo tondeggiante e asciutto.
      Generazioni di sami popolarono l'area lasciando siti sacrificali, resti di capanne di torba, depositi
      per le carni e vecchi recinti di betulla per il raduno delle renne. Verso la fine del diciottesimo
      secolo coloni norvegesi e kven si insediarono nell'entroterra di Troms; Dividalen fu colonizzata tardi,
      e la fattoria più elevata, Frihetsli, vide i primi dissodamenti solo nel 1844. Attualmente nel parco
      pascolano in estate le renne appartenenti alle comunità sami svedesi di Lainiovuoma e Saarivuoma.
    before: >-
      Puoi muoverti liberamente a piedi o con gli sci, ma qualunque mezzo a motore è severamente vietato. Il
      campeggio libero è consentito ovunque, con l'obbligo inderogabile di smaltire i propri rifiuti. Vige il
      divieto generale di accendere fuochi nel bosco dal 15 aprile al 15 settembre. I cani sono ammessi ma
      devono rimanere al guinzaglio dal 1 aprile al 1 settembre. Rispetta rigorosamente le renne, soprattutto
      nel delicato periodo dei parti a maggio e giugno.
    around: >-
      Øvre Dividal non possiede parchi adiacenti nell'atlante, ma condivide ghiottone, lupo e orso bruno con
      altre aree selvagge del Grande Nord. Il [Parco Nazionale Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), il [Parco Nazionale di
      Sarek](/lugar/sarek-national-park/), il [Parco Nazionale di Hossa](/lugar/hossan-kansallispuisto/) e il
      [Parco Nazionale di Femundsmarka](/lugar/femundsmarka-nasjonalpark/) ospitano anch'essi ghiottoni e
      lupi, e Urho Kekkonen, Hossa e Femundsmarka accolgono inoltre l'orso bruno.
  pt:
    intro: >-
      No interior de Troms, encostado à Suécia, existe um vale isolado que acolhe uma das populações de
      glutões mais densas do norte da Europa. Øvre Dividal é um parque de 770 km² instituído em 1971 e
      ampliado em 2006 para resguardar um vale interior e uma cordilheira alpina quase imunes a perturbações
      humanas. Não usufrui da fama de outros parques noruegueses, o que faz parte do seu encanto: pinhais
      velhos e retorcidos, vidoeiros de montanha, maciços arredondados, lagos puros, turfeiras e desfiladeiros
      fundos. É, acima de tudo, o santuário do glutão.
    landscape: >-
      O parque eleva-se de cerca de 300 m até aos 1.600. Ao longo deste desnível a floresta organiza-se com a
      clareza de um manual: pinhais vetustos nas cotas mais baixas, vidoeiro de montanha em altitude e, na
      tundra alpina aberta, salgueiros e vidoeiro-anão. Ao longo do rio Divielva subsistem manchas de pinhal
      antigo e bosque caducifólio que sustentam uma flora e fauna muito ricas, integrando vários líquenes,
      fungos e escaravelhos raros.


      O solo revela uma história geológica muito mais remota. Há cerca de 600 milhões de anos depositaram-se
      conglomerados, arenitos e xistos — o Grupo Dividal — sobre uma base granítica, rochas que ainda afloram
      em escarpas como a de Bumannsberget. Muito mais tarde, os glaciares da última era do gelo deixaram
      blocos erráticos em vários cumes: um bloco gigante de granito vermelho junto ao marco do pico de Jerta
      foi transportado desde a Suécia. Vários rios esculpiram desfiladeiros, e no meio do vale surgem blocos
      rochosos imensos depositados ao acaso pelo degelo.


      O clima caracteriza-se por grande aridez. A 228 m de altitude, Dividalen é o segundo vale mais seco da
      Noruega, com apenas 282 mm de precipitação anual. Nas partes baixas do vale inexiste permafrost; acima
      dos 700 m, torna-se uma presença constante.


      Entre as plantas, registam-se 315 espécies. A urze-branca-do-ártico, que só medra no norte da Noruega, é
      abundante, e cresce em estado selvagem o minúsculo Rhododendron lapponicum.
    wildlife: >-
      Todos os grandes predadores do continente marcam presença. O [glutão](/especie/gulo_gulo/) assume o
      papel principal: a sua população situa-se entre as mais densas do norte da Europa e, no inverno, a
      [rena](/especie/rangifer_tarandus/) representa a base da sua alimentação. O
      [urso-pardo](/especie/ursus_arctos/) partilha população com a Suécia e quase todos os anos se avistam
      fêmeas com crias. A [raposa-do-ártico](/especie/vulpes_lagopus/) e o
      [lince-euroasiático](/especie/lynx_lynx/) são residentes, ao passo que o
      [lobo-cinzento](/especie/canis_lupus/) vagueia com regularidade pela área, embora seja escasso e não
      tenha alcatéia permanente confirmada. A rena semi-domesticada sami abunda, assim como o
      [alce](/especie/alces_alces/).


      As aves acompanham as rotas migratórias da primavera e do outono. Nas vastas zonas húmidas observam-se
      combatentes e falaropos-de-bico-fino, em conjunto com inúmeras espécies de patos. Nos bosques pululam
      aves de pequeno porte e nidifica o [tetraz-grande](/especie/tetrao_urogallus/). As rapinas reprodutoras
      incluem a [águia-real](/especie/aquila_chrysaetos/), o búteo-calçado, o
      [falcão-gerifalte](/especie/falco_rusticolus/) e o peneireiro; a
      [coruja-das-neves](/especie/bubo_scandiacus/) surge nos anos com explosão de roedores.
    visit: >-
      A rota ártica da Nordkalottruta atravessa o parque e constitui a coluna vertebral das grandes
      travessias; podes iniciá-la no fim da estrada de Dividalen ou a partir de Innset, junto a Altevatn. Para
      um passeio de um dia basta menos esforço: do parque de estacionamento no final da estrada de Dividalen
      sobes até à cabana de Ole Nergård, segues para as cabanas de Dividal e regressas. Outro percurso curto
      passeia pelo pinhal antigo de troncos torcidos, e o desfiladeiro de Skakterdalen fica a apenas uma hora
      a pé da estrada.


      Existem cabanas acolhedoras para pernoitar: as da associação de pedestrianismo de Troms (Dividal, Vuomma
      e Gaska) e a cabana de toros de Ole Nergård, sempre aberta e gerida pela Statskog. O acesso faz-se pela
      estrada de Dividalen e uma pista florestal até Skaktarelva (no inverno) ou Gambekken (no verão), através
      de Rostadalen até Innset e Tverrelvmo, ou subindo até Altevatn.


      No outono, o bosque primitivo presenteia bagas e cogumelos que podes recolher livremente para consumo
      próprio.
    history: >-
      O nome Dividal deriva do vocábulo sami *dievva*, que descreve uma colina redonda e seca. Gerações de
      samis percorreram este vale, deixando locais de sacrifício, ruínas de cabanas de turfa, armazéns de
      carne e antigas cercas de vidoeiro para a lida das renas. No final do século dezoito chegaram pioneiros
      noruegueses e kvens ao interior de Troms; Dividalen conheceu povoamento tardio, e a quinta mais alta,
      Frihetsli, só foi desbravada em 1844. Hoje em dia pastam no parque, durante o verão, renas das
      comunidades samis suecas de Lainiovuoma e Saarivuoma.
    before: >-
      Podes deambular livremente a pé ou em esquis, mas qualquer transporte motorizado está expressamente
      proibido. O acampamento selvagem é permitido em qualquer lugar, desde que recolhas todo o lixo.
      Aplica-se uma proibição geral de fazer fogueiras nas zonas florestais de 15 de abril a 15 de setembro.
      Os cães são bem-vindos, mas devem ser conduzidos com trela de 1 de abril a 1 de setembro. Respeita com
      rigor as renas, especialmente na época das crias em maio e junho.
    around: >-
      Øvre Dividal não tem vizinhos imediatos no atlas, mas partilha glutão, lobo e urso-pardo com outros
      espaços bravios do norte. O [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/), o
      [Parque Nacional de Sarek](/lugar/sarek-national-park/), o [Parque Nacional de
      Hossa](/lugar/hossan-kansallispuisto/) e o [Parque Nacional de
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/) acolhem glutões e lobos, e Urho Kekkonen, Hossa e
      Femundsmarka contam igualmente com o urso-pardo.
