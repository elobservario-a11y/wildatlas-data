resumen:
  es: >-
    Los espectaculares meandros encajados del río Nestos labrados en la caliza de las Ródopes antes de
    desembocar en el Egeo.
  en: >-
    The spectacular entrenched meanders of the Nestos River carved into Rhodope limestone before opening into
    the Aegean.
  fr: >-
    Les spectaculaires méandres encaissés du fleuve Nestos creusés dans les calcaires des Rhodopes avant de se
    jeter dans l’Égée.
  de: >-
    Die spektakulären, tief eingeschnittenen Mäander des Nestos im Kalkstein der Rhodopen vor seiner Mündung
    in die Ägäis.
  it: I grandiosi meandri incassati del fiume Nestos scavati nei calcari dei Rodopi prima di sfociare nell’Egeo.
  pt: >-
    Os espetaculares meandros encaixados do rio Nestos talhados no calcário dos Ródopes antes de desaguar no
    Egeu.
unico:
  es: >-
    Una senda de diez kilómetros que sigue las vías del tren junto al río, entre acantilados donde crían
    rapaces, y que la guía regional llama «divina».
  en: >-
    A ten-kilometre path tracking the railway line beside the river, flanked by crags where raptors nest,
    described by regional guides as “divine”.
  fr: >-
    Un sentier de dix kilomètres qui longe la voie ferrée au bord de l’eau, entre des falaises où nichent les
    rapaces, qualifié de « divin » par le guide régional.
  de: >-
    Ein zehn Kilometer langer Pfad entlang der Eisenbahngleise am Flussufer, gesäumt von Felswänden mit
    nistenden Greifvögeln, den der regionale Reiseführer als „göttlich“ rühmt.
  it: >-
    Un sentiero di dieci chilometri che segue la linea ferroviaria lungo il fiume, tra pareti rocciose dove
    nidificano i rapaci, definito «divino» dalle guide locali.
  pt: >-
    Um trilho de dez quilómetros que acompanha a linha de comboio junto ao rio, por entre escarpas onde
    nidificam aves de rapina, apelidado de «divino» pelos guias locais.
observaciones:
  es: >-
    Las rapaces anidan en las paredes, así que no escales ni te acerques a los cortados, y si vas en barca o
    en canoa, evítalo en época de cría. Sobre el estado del sendero, de las vías y de los accesos, consulta
    antes a la unidad de gestión de Porto Lagos.
texto:
  es:
    intro: >-
      Un mismo río con dos nombres y dos países: Nestos para los griegos, Mesta para los búlgaros. Nace en las
      montañas de Rila, baja por cañones de paredes altas, cruza las Ródopes occidentales y el monte Falakro
      y, al final, desemboca en el Egeo frente a la isla de Thasos. Los estrechos del Nestos, Stena Nestou,
      son el tramo en que el río se abre paso entre acantilados antes de soltarse en la llanura costera: un
      cañón de roca metamórfica, bosque de ribera y rapaces que cuelgan de las paredes.
    landscape: >-
      El Nestos desciende por cañones de laderas escarpadas y rocas mayoritariamente metamórficas. Ya en
      Bulgaria forma desfiladeros en Rila y Pirin; el más largo, Momina Klisura, mide 25 km y se abre entre el
      Pirin y las Ródopes. Más abajo las orillas se cubren sobre todo de árboles de hoja caduca. Al llegar a
      la llanura costera de Chrysoupolis el cauce se abre en un delta con lagunas de agua dulce y charcas.


      El río es también una frontera que viene de lejos. Está entre los cinco ríos más grandes de Grecia y
      separa Macedonia de Tracia y las unidades regionales de Kavala y Jantia. Tolomeo ya lo citaba como
      Nestus y lo situaba como límite entre la antigua Macedonia y Tracia. Entre cañones y montañas
      inaccesibles no era navegable en la antigüedad ni ofrecía un camino natural a lo largo de su cauce;
      tenía solo dos pasos, y en el inferior, cerca de Topeiros, cruzaba una antigua calzada, luego la Vía
      Egnatia romana.
    wildlife: >-
      Las paredes mandan. Los estrechos del Nestos son un espacio de la red Natura (GR1120004) y la lista de
      aves que lo justifican empieza por el [búho real](/especie/bubo_bubo/), el [buitre
      leonado](/especie/gyps_fulvus/) y el cormorán pigmeo. La ruta cultural de la región habla de
      biodiversidad única, rapaces raras y bosques bien conservados, y el conjunto del Nestos y su delta sirve
      de refugio o de comedor a 300 especies de aves, 30 de rapaces, 11 de anfibios y 21 de reptiles.


      La historia cuenta que Heródoto hacía del Nestos el límite norte de los leones en Grecia. Hoy quedan las
      rapaces. Las mejores épocas para ir son la primavera y el otoño.
    visit: >-
      La ruta más conocida sale de la estación de Toxotes y llega hasta los estrechos del Nestos: diez
      kilómetros, unas tres horas, siguiendo las vías del tren junto al río y con vistas amplias de los
      estrechos. Es el tramo donde más gente se junta.


      Si prefieres otro ritmo, hay una ruta de dos a tres horas por el Bosque Estético del Nestos, con
      miradores sobre los grandes meandros. La misma ruta se puede hacer en bicicleta o en canoa o kayak por
      las aguas tranquilas del río.


      La región propone además una ruta cultural de dos a tres días con dieciséis paradas. Estas son algunas:


      - Stavroupoli conserva casas de estilo macedonio y calles empedradas, y tiene un museo folclórico con
      trajes, herramientas y objetos cotidianos.

      - La fortaleza de Kalyva, a 650 metros de altitud, la levantó Filipo II de Macedonia en el siglo IV a.
      C. y domina el valle del Nestos.

      - Cerca de Stavroupoli, en Komnina, se conserva una tumba macedonia abovedada de época helenística.

      - La cueva de las Dríades, cerca de Livera, mide 1.150 metros cuadrados y tiene galerías de más de 300
      metros decoradas con estalagmitas y estalactitas.
    history: >-
      El bosque de ribera del Nestos superó los 125.000 stremmata y fue uno de los grandes bosques de ribera
      de Europa; en 1952 se decidió talar la mayor parte para cultivar maíz y drenar buena parte del humedal.
      Hoy quedan 4.500 stremmata protegidos y vallados. Entre las presiones que han cambiado el ecosistema
      figuran la escalada en las paredes del cañón donde anidan especies raras y el paso de barcas en época de
      cría. Aguas arriba, en la provincia de Drama, el embalse de Thisavros produce electricidad desde 1997.


      En la provincia de Jantia hay centros de información con material audiovisual sobre el bosque de ribera.
      La unidad de gestión de los parques del Nestos, Vistonida y Ródope tiene su sede en Porto Lagos y una
      oficina en Mesochori Paranestiou.
    before: >-
      Las rapaces anidan en las paredes, así que no escales ni te acerques a los cortados, y si vas en barca o
      en canoa, evítalo en época de cría. Sobre el estado del sendero, de las vías y de los accesos, consulta
      antes a la unidad de gestión de Porto Lagos.
    around: >-
      El atlas no recoge lugares cercanos a los estrechos del Nestos. Lejos, la [Reserva de la Biosfera de
      Srebarna](/lugar/srebarna-biosphere-reserve/) comparte con él el cormorán pigmeo y el pigargo, entre
      otras aves de río.
  en:
    intro: >-
      One river bearing two names across two countries: Nestos for Greeks, Mesta for Bulgarians. Rising in the
      high Rila Mountains, it plunges through deep gorges, traverses the Western Rhodopes and Mount Falakro,
      and empties into the North Aegean opposite the island of Thasos. Stena Nestou, the Nestos Straits,
      designates the dramatic stretch where the river cuts through towering cliffs before spilling out onto
      the coastal plain: a canyon carved through metamorphic rock, shaded by riparian forest, with birds of
      prey wheeling across the rock faces.
    landscape: >-
      The Nestos carves its way down through steep canyons framed mostly by metamorphic geology. In Bulgaria
      it already forms dramatic defiles through Rila and Pirin; the longest, Momina Klisura, measures 25 km
      between Pirin and the Rhodopes. Further downstream, broadleaf deciduous woods cloak its riverbanks. Upon
      reaching the coastal plain near Chrysoupolis, the river fans out into a sweeping delta dotted with
      freshwater marshes and lagoons.


      The river has formed a natural frontier since ancient times. Ranking among the five largest rivers in
      Greece, it divides Macedonia from Thrace as well as the regional units of Kavala and Xanthi. Ptolemy
      recorded it as Nestus, marking the historic boundary between ancient Macedonia and Thrace. Enclosed by
      rugged gorges and inaccessible mountains, it was unnavigable in antiquity nor did it offer a continuous
      valley route; only two river crossings existed, the lower of which, near Topeiros, carried an ancient
      road later incorporated into the Roman Via Egnatia.
    wildlife: >-
      The cliff faces command the ecosystem. Stena Nestou is designated as a Natura site (GR1120004), where
      qualifying birdlife is spearheaded by the [Eurasian eagle-owl](/especie/bubo_bubo/), the [griffon
      vulture](/especie/gyps_fulvus/), and the pygmy cormorant. Regional biodiversity trails highlight a
      pristine haven for rare raptors and mature woodlands; the Nestos corridor and its delta provide feeding
      and refuge grounds for 300 bird species, 30 raptor species, 11 amphibian species, and 21 reptile
      species.


      Herodotus famously noted that the Nestos formed the northern limit of lions in ancient Greece. Today,
      the raptors remain masters of the skies. The most rewarding seasons to visit are spring and autumn.
    visit: >-
      The most popular walking route departs from Toxotes railway station and leads directly into the Nestos
      Straits: ten kilometres, taking around three hours, tracking the railway line along the riverbank with
      broad vistas over the gorge. This section sees the highest concentration of walkers.


      For a different rhythm, a route of two to three hours traverses the Nestos Aesthetic Forest, featuring
      lookout viewpoints over the river’s great sweeping meanders. The same river section can be experienced
      by bicycle or explored from the water by canoe or kayak along calmer stretches.


      The regional network also outlines a cultural itinerary of two to three days featuring sixteen stops.
      Highlights include:


      - Stavroupoli, preserving traditional Macedonian stone architecture, cobbled alleys, and a folklore
      museum with regional costumes and tools.

      - Kalyva Fortress, perched at 650 metres elevation, erected by Philip II of Macedon in the IV century BC
      to command the Nestos valley.

      - Near Stavroupoli, at Komnina, an intact Hellenistic vaulted Macedonian tomb.

      - Dryades Cave near Livera, extending across 1,150 square metres with galleries over 300 metres adorned
      with stalactites and stalagmites.
    history: >-
      The riparian forest of the Nestos once covered more than 125,000 stremmata, constituting one of the
      great riverine woodlands of Europe; in 1952, large-scale clearing was authorized to cultivate maize and
      drain extensive wetland tracts. Today, roughly 4,500 stremmata remain protected and fenced. Current
      ecological pressures include rock climbing along cliff faces where rare raptors nest, as well as
      disturbance from boat traffic during breeding seasons. Upstream, in Drama prefecture, the Thisavros
      hydroelectric dam has generated power since 1997.


      Visitor centres across Xanthi prefecture provide multimedia displays on the riparian ecosystem. The
      management body for the national parks of Nestos, Vistonida, and Rhodope is headquartered at Porto
      Lagos, with a field office at Mesochori Paranestiou.
    before: >-
      Raptors nest on the cliff faces: do not scramble or approach the crags, and avoid canoeing or boating
      during the breeding period. Inquire beforehand with the Porto Lagos management unit regarding track and
      trail conditions.
    around: >-
      The atlas does not include adjacent reserves in the immediate vicinity of the Nestos gorge. Further
      north, [Srebarna Biosphere Reserve](/lugar/srebarna-biosphere-reserve/) shares populations of pygmy
      cormorants and white-tailed eagles, among other riverine birds.
  fr:
    intro: >-
      Un même fleuve portant deux noms dans deux pays : Nestos pour les Grecs, Mesta pour les Bulgares. Né
      dans le massif du Rila, il s’engouffre dans de hautes gorges, traverse les Rhodopes occidentales et le
      mont Falakro, avant de se jeter dans la mer Égée face à l’île de Thasos. Les défilés du Nestos, Stena
      Nestou, désignent le tronçon où le cours d’eau s’ouvre un passage spectaculaire à travers les falaises
      avant de s’épancher dans la plaine côtière : un canyon de roches métamorphiques, bordé de forêts
      alluviales et dominé par des rapaces nichant dans les parois.
    landscape: >-
      Le Nestos dévale des gorges aux versants abrupts, sculptés principalement dans des roches
      métamorphiques. Côté bulgare, il forme déjà des défilés remarquables à travers le Rila et le Pirin ; le
      plus long, Momina Klisura, s’étire sur 25 km entre le Pirin et les Rhodopes. Plus en aval, les rives
      s’habillent de forêts d’arbres à feuilles caduques. En atteignant la plaine côtière de Chrysoupolis, le
      cours d’eau s’évase en un vaste delta parsemé de lagunes d’eau douce et de roselières.


      Le fleuve marque également une frontière géographique séculaire. Comptant parmi les cinq plus grands
      cours d’eau de Grèce, il sépare la Macédoine de la Thrace ainsi que les districts de Kavala et de
      Xanthi. Ptolémée le mentionnait déjà sous le nom de Nestus comme limite entre l’ancienne Macédoine et la
      Thrace. Encaissé entre gorges et massifs infranchissables, il n’était pas navigable dans l’Antiquité et
      n’offrait aucun cheminement aisé ; seuls deux passages existaient, dont le plus bas, près de Topeiros,
      voyait passer une voie antique reprise ensuite par la Via Egnatia romaine.
    wildlife: >-
      Les parois rocheuses dictent la vie sauvage. Les défilés du Nestos forment un site du réseau Natura
      (GR1120004) dont les oiseaux emblématiques comptent le [hibou grand-duc](/especie/bubo_bubo/), le
      [vautour fauve](/especie/gyps_fulvus/) et le cormoran pygmée. Les circuits régionaux soulignent une
      biodiversité remarquable, faite de rapaces rares et de ripisylves préservées ; l’ensemble du Nestos et
      de son delta sert d’abri et de gagnage à 300 espèces d’oiseaux, 30 espèces de rapaces, 11 d’amphibiens
      et 21 de reptiles.


      Hérodote écrivait jadis que le Nestos marquait la frontière septentrionale des lions en Grèce.
      Aujourd’hui, les rapaces y règnent seuls. Le printemps et l’automne constituent les périodes idéales
      pour vous y rendre.
    visit: >-
      L’itinéraire le plus célèbre part de la gare de Toxotes et pénètre dans les gorges du Nestos : dix
      kilomètres, environ trois heures de marche en suivant la ligne de chemin de fer au bord de l’eau, avec
      des vues dégagées sur les défilés. C’est le secteur qui concentre le plus de visiteurs.


      Si vous préférez un autre rythme, une boucle de deux à trois heures traverse la forêt esthétique du
      Nestos, ponctuée de belvédères dominant les grands méandres. Ce parcours peut également s’effectuer à
      vélo, ou bien en canoë-kayak sur les eaux calmes du fleuve.


      La région propose en outre un itinéraire culturel de deux à trois jours comptant seize étapes. En voici
      quelques points forts :


      - Stavroupoli conserve de belles maisons d’architecture macédonienne et des ruelles pavées, abritant un
      musée folklorique riche en costumes et outils traditionnels.

      - La forteresse de Kalyva, perchée à 650 mètres d’altitude, bâtie par Philippe II de Macédoine au IVe
      siècle avant notre ère, domine la vallée du Nestos.

      - Près de Stavroupoli, à Komnina, une tombe macédonienne voûtée d’époque hellénistique est
      remarquablement préservée.

      - La grotte des Dryades, près de Livera, s’étend sur 1 150 mètres carrés et présente des galeries de
      plus de 300 mètres ornées de concrétions calcaires.
    history: >-
      La forêt alluviale du Nestos dépassait jadis les 125 000 stremmata, formant l’une des plus vastes forêts
      de bord de fleuve d’Europe ; en 1952, la décision fut prise d’en défricher la majeure partie pour y
      cultiver du maïs et d’assécher les zones humides. Il ne subsiste aujourd’hui que 4 500 stremmata
      protégés et clôturés. Parmi les pressions pesant sur le milieu figurent l’escalade sur les falaises où
      nichent des oiseaux sensibles et le passage d’embarcations en pleine nidification. En amont, dans le
      nome de Dráma, le barrage hydroélectrique de Thisavros fonctionne depuis 1997.


      Dans le district de Xanthi, plusieurs centres d’information proposent des documents audiovisuels sur la
      ripisylve. L’organisme de gestion des parcs du Nestos, de Vistonida et du Rhodope a son siège à Porto
      Lagos et une antenne à Mesochori Paranestiou.
    before: >-
      Les rapaces nichent à même les falaises : évitez l’escalade et ne vous approchez pas des parois, et
      renoncez aux sorties en barque pendant la nidification. Renseignez-vous auprès de la direction de Porto
      Lagos sur l’état du sentier et de la voie ferrée.
    around: >-
      L’atlas ne recense pas d’autre espace protégé à proximité immédiate des gorges du Nestos. Plus au nord,
      la [réserve de biosphère de Srebarna](/lugar/srebarna-biosphere-reserve/) partage avec ce site la
      présence du cormoran pygmée et du pygargue à queue blanche, parmi d’autres oiseaux aquatiques.
  de:
    intro: >-
      Ein Fluss mit zwei Namen und in zwei Ländern: Nestos für die Griechen, Mesta für die Bulgaren. Er
      entspringt im Rila-Gebirge, gräbt sich durch steile Schluchten, durchquert die Westrhodopen sowie das
      Falakro-Gebirge und mündet schließlich gegenüber der Insel Thasos in die nördliche Ägäis. Die
      Nestos-Engen, Stena Nestou, bezeichnen jenen wilden Abschnitt, in dem sich der Fluss durch Felswände
      bricht, bevor er die Küstenebene erreicht: eine Schlucht aus metamorphem Gestein, Auwäldern und
      Greifvögeln, die an den Felsabstürzen horsten.
    landscape: >-
      Der Nestos fließt durch Schluchten mit steilen Hängen, die überwiegend aus metamorphen Gesteinen
      aufgebaut sind. Bereits in Bulgarien formt er eindrucksvolle Klause in Rila und Pirin; die längste,
      Momina Klisura, erstreckt sich über 25 km zwischen Pirin und Rhodopen. Flussabwärts säumen vor allem
      Laubwälder die Ufer. Beim Eintritt in die Küstenebene von Chrysoupolis öffnet sich der Flusslauf zu
      einem weiten Delta mit Süßwasserlagunen und Feuchtgebieten.


      Der Strom bildet seit jeher eine historische Grenze. Als einer der fünf größten Flüsse Griechenlands
      trennt er Makedonien von Thrakien sowie die Regionalbezirke Kavala und Xanthi. Schon Ptolemäus führte
      ihn als Nestus und bestimmte ihn als Grenze zwischen dem antiken Makedonien und Thrakien. Zwischen
      unwegsamen Schluchten und Felsmassiven war er in der Antike weder schiffbar noch bot er einen
      durchgehenden Weg entlang des Ufers; es gab lediglich zwei Flussübergänge, von denen der untere bei
      Topeiros von einer antiken Straße genutzt wurde, die später in der römischen Via Egnatia aufging.
    wildlife: >-
      Die Steilwände bestimmen das Ökosystem. Die Nestos-Engen sind als Natura-Gebiet (GR1120004) geschützt,
      angeführt von Brutvögeln wie dem [Uhu](/especie/bubo_bubo/), dem [Gänsegeier](/especie/gyps_fulvus/) und
      der Zwergscharbe. Regionale Kulturrouten heben die außergewöhnliche Artenvielfalt seltener Greife und
      naturnaher Wälder hervor; der Flusslauf des Nestos samt Delta dient 300 Vogelarten, 30 Greifvogelarten,
      11 Amphibienarten und 21 Reptilienarten als Zuflucht und Nahrungsraum.


      Herodot berichtete einst, dass der Nestos die nördliche Verbreitungsgrenze von Löwen in Griechenland
      bildete. Heute beherrschen die Greifvögel die Felswände. Die besten Reisezeiten sind Frühling und
      Herbst.
    visit: >-
      Die bekannteste Wanderroute nimmt ihren Ausgang am Bahnhof Toxotes und führt in die Nestos-Schlucht:
      zehn Kilometer, etwa drei Stunden Gehzeit, direkt entlang der Bahngleise am Flussufer mit weiten
      Ausblicken auf die Engpässe. Auf diesem Abschnitt begegnen dir die meisten Wanderer.


      Wer eine andere Gangart schätzt, wählt eine Route von zwei bis drei Stunden durch den Ästhetischen Wald
      des Nestos mit Aussichtspunkten über die weiten Flussschleifen. Dieselbe Strecke lässt sich auch per
      Fahrrad zurücklegen oder vom Wasser aus per Kanu und Kajak auf ruhigen Abschnitten erkunden.


      Die Region schlägt zudem eine Kulturroute von zwei bis drei Tagen mit sechzehn Stationen vor. Einige
      Höhepunkte:


      - Stavroupoli bewahrt traditionelle makedonische Häuser und gepflasterte Gassen mit einem
      Volkskundemuseum voller Trachten und Gerätschaften.

      - Die Festung Kalyva in 650 Metern Höhe wurde im IV. Jahrhundert v. Chr. von Philipp II. von Makedonien
      errichtet und beherrscht das Nestos-Tal.

      - Nahe Stavroupoli, in Komnina, ist ein gewölbtes makedonisches Grabmal aus hellenistischer Zeit
      erhalten.

      - Die Dryaden-Höhle bei Livera umfasst 1.150 Quadratmeter mit über 300 Meter langen Gängen voller
      Tropfsteine.
    history: >-
      Der Auwald des Nestos bedeckte einst mehr als 125.000 Stremmata und zählte zu den bedeutendsten
      Auwäldern Europas; 1952 wurde beschlossen, den Großteil zu roden, um Mais anzubauen und das Feuchtgebiet
      trockenzulegen. Heute verbleiben lediglich 4.500 Stremmata unter Schutz und eingezäunt. Zu den
      Belastungen zählen Sportkletterer an den Brutwänden seltener Vögel sowie Bootsverkehr während der
      Brutzeit. Flussaufwärts, in der Präfektur Drama, liefert die Talsperre Thisavros seit 1997 Elektrizität.


      In der Präfektur Xanthi informieren Besucherzentren mit Multimedia-Präsentationen über den Auwald. Die
      Verwaltungsbehörde der Nationalparks von Nestos, Vistonida und Rhodopen hat ihren Sitz in Porto Lagos
      und eine Außenstelle in Mesochori Paranestiou.
    before: >-
      Greifvögel brüten an den Felswänden: Klettere nicht und nähere dich den Abstürzen nicht, und verzichte
      zur Brutzeit auf Bootsfahrten. Erkundige dich bei der Verwaltung in Porto Lagos über den Zustand von
      Wanderweg und Bahnstrecke.
    around: >-
      Der Atlas verzeichnet keine unmittelbaren Nachbargebiete bei den Nestos-Engen. Weiter nördlich teilt das
      [Biosphärenreservat Srebarna](/lugar/srebarna-biosphere-reserve/) Brutvorkommen von Zwergscharbe und
      Seeadler an Flussläufen.
  it:
    intro: >-
      Uno stesso corso d’acqua con due nomi e due patrie: Nestos per i greci, Mesta per i bulgari. Nasce tra i
      monti del Rila, precipita attraverso forre impervie, valica i Rodopi occidentali e il monte Falakro, per
      poi sfociare nel Mar Egeo di fronte all’isola di Taso. Le gole del Nestos, Stena Nestou, formano il
      tratto in cui il fiume si apre un varco scenografico tra le scogliere prima di distendersi nella piana
      costiera: un canyon di rocce metamorfiche, foreste ripariali e grandi rapaci aggrappati alle pareti.
    landscape: >-
      Il Nestos scende tra valloni dalle sponde ripide intagliate prevalentemente in rocce metamorfiche. Già
      in Bulgaria scava spettacolari forre nel Rila e nel Pirin; la più estesa, Momina Klisura, misura 25 km
      tra il Pirin e i Rodopi. Più a valle le rive si popolano di boschi di latifoglie. Giunto nella piana
      litoranea di Chrysoupolis, il letto fluviale si apre in un delta articolato con lagune d’acqua dolce e
      acquitrini.


      Il fiume è anche un confine naturale di antichissima memoria. Annoverato tra i cinque fiumi più lunghi
      della Grecia, separa la Macedonia dalla Tracia e le province di Kavala e Xanthi. Tolomeo lo chiamava
      Nestus indicandolo come limite tra l’antica Macedonia e la Tracia. Racchiuso tra dirupi e montagne
      aspre, non risultava navigabile nell’antichità né consentiva percorsi agevoli lungo le rive; contava
      soltanto due guadi, e in quello inferiore, presso Topeiros, transitava una via arcaica poi confluita
      nella Via Egnatia romana.
    wildlife: >-
      Le pareti rocciose dettano le regole dell’ecosistema. Le strette del Nestos sono tutelate come sito
      della rete Natura (GR1120004), con una comunità di volatili guidata dal [gufo
      reale](/especie/bubo_bubo/), dal [grifone](/especie/gyps_fulvus/) e dal marangone minore. I tracciati
      regionali valorizzano una biodiversità preziosa, ricca di rapaci rari e boschi maturi; il bacino del
      Nestos e il suo delta ospitano 300 specie di uccelli, 30 di rapaci, 11 di anfibi e 21 di rettili.


      Erodoto narrava che il corso del Nestos segnava il confine settentrionale dei leoni in Grecia. Oggi
      rimangono le grandi ali dei rapaci. Le stagioni più indicate per la visita sono la primavera e
      l’autunno.
    visit: >-
      L’itinerario più frequentato parte dalla stazione ferroviaria di Toxotes e raggiunge le strette del
      Nestos: dieci chilometri, circa tre ore di cammino, affiancando i binari del treno a pelo d’acqua con
      magnifici scorci sulla gola. È la tratta che attira il maggior numero di visitatori.


      Se cerchi un passo diverso, puoi percorrere un tracciato di due o tre ore nella Foresta Estetica del
      Nestos, toccando punti panoramici affacciati sui grandi meandri. La stessa tratta è fruibile in
      bicicletta o navigando in canoa e kayak sulle acque tranquille del fiume.


      La regione propone inoltre un circuito culturale di due o tre giorni articolato su sedici tappe. Tra
      queste:


      - Stavroupoli, che conserva architetture macedoni tradizionali, vicoli lastricati e un museo etnografico
      con abiti e attrezzi d’epoca.

      - La fortezza di Kalyva, situata a 650 metri di quota, eretta da Filippo II di Macedonia nel IV secolo
      a.C. per controllare la vallata del Nestos.

      - Vicino a Stavroupoli, a Komnina, una tomba macedone a volta di epoca ellenistica in ottimo stato.

      - La grotta delle Driadi, nei pressi di Livera, vasta 1.150 metri quadrati con gallerie lunghe oltre 300
      metri adornate da stalattiti e stalagmiti.
    history: >-
      La foresta ripariale del Nestos superava un tempo i 125.000 stremmata, attestandosi come uno dei più
      imponenti boschi golenali d’Europa; nel 1952 fu avviato il disboscamento della maggior parte dell’area
      per fare spazio a coltivazioni di mais e bonificare le paludi. Oggi sopravvivono appena 4.500 stremmata
      recintati e tutelati. Tra i fattori di disturbo figurano l’arrampicata sulle pareti dove nidificano
      specie sensibili e il passaggio di imbarcazioni in periodo riproduttivo. Più a monte, nella prefettura
      di Drama, l’invaso idroelettrico di Thisavros è operativo dal 1997.


      Nella provincia di Xanthi operano centri visite dotati di sale multimediali sull’ecosistema fluviale.
      L’ente gestore dei parchi di Nestos, Vistonida e Rodopi ha sede a Porto Lagos e un presidio a Mesochori
      Paranestiou.
    before: >-
      I rapaci nidificano sulle pareti rocciose: non arrampicare né avvicinarti ai dirupi, ed evita escursioni
      in barca durante la stagione riproduttiva. Chiedi informazioni all’ente parco di Porto Lagos sullo stato
      dei sentieri e della linea ferroviaria.
    around: >-
      L’atlante non include altre aree protette nelle immediate adiacenze delle gole del Nestos. Più a nord,
      la [Riserva della biosfera di Srebarna](/lugar/srebarna-biosphere-reserve/) condivide popolazioni di
      marangone minore e aquila di mare tra l’avifauna fluviale.
  pt:
    intro: >-
      Um mesmo rio com dois nomes e dois países: Nestos para os gregos, Mesta para os búlgaros. Nasce nas
      montanhas de Rila, desce por desfiladeiros de paredões alcantilados, atravessa os Ródopes ocidentais e o
      monte Falakro e desagua no mar Egeu em frente à ilha de Tasos. Os estreitos do Nestos, Stena Nestou,
      correspondem ao troço onde o rio rasga caminho por entre escarpas antes de se espraiar pela planície
      litoral: um desfiladeiro de rocha metamórfica, galerias ripícolas e aves de rapina alcandoradas nas
      fragas.
    landscape: >-
      O Nestos corre por desfiladeiros de encostas declivosas esculpidas sobretudo em rochas metamórficas.
      Ainda na Bulgária rasga gargantas no Rila e em Pirin; a mais extensa, Momina Klisura, atinge 25 km entre
      Pirin e os Ródopes. Mais a jusante, as margens vestem-se essencialmente de arvoredo caducifólio. Ao
      atingir a planície costeira de Chrysoupolis, o leito abre-se num delta com lagoas de água doce e sapais.


      O rio constitui também uma fronteira natural secular. Entre os cinco maiores rios da Grécia, divide a
      Macedónia da Trácia e as unidades regionais de Kavala e Xanthi. Ptolomeu referia-o já como Nestus,
      definindo-o como divisa entre a antiga Macedónia e a Trácia. Encurralado entre desfiladeiros e montanhas
      inacessíveis, não era navegável na Antiguidade nem facultava caminhos fluviais contínuos; possuía apenas
      duas passagens transitáveis, cruzando na inferior, junto a Topeiros, uma estrada antiga mais tarde
      integrada na Via Egnatia romana.
    wildlife: >-
      As escarpas dominam a paisagem e a vida selvagem. Os estreitos do Nestos integram a rede Natura
      (GR1120004), justificando-se a sua proteção pela presença do [bufo-real](/especie/bubo_bubo/), do
      [abutre-fouveiro](/especie/gyps_fulvus/) e do corvo-marinho-pigmeu. Os itinerários regionais celebram
      uma biodiversidade única de rapinas raras e bosques conservados; o conjunto do Nestos e do seu delta
      acolhe 300 espécies de aves, 30 de rapinas, 11 de anfíbios e 21 de répteis.


      Heródoto relatava outrora que o Nestos marcava o limite norte dos leões na Grécia. Hoje sobram as aves
      de rapina no céu. As melhores épocas para a visita são a primavera e o outono.
    visit: >-
      O percurso mais procurado parte da estação de Toxotes e adentra os estreitos do Nestos: dez quilómetros,
      cerca de três horas de caminhada, acompanhando a linha férrea junto às margens com amplas panorâmicas
      sobre a garganta. É o setor onde se concentra maior afluência.


      Se preferires outro ritmo, existe um percurso de duas a três horas pela Floresta Estética do Nestos, com
      miradouros sobre os grandes meandros. O mesmo trajeto pode ser feito em bicicleta ou em canoa e caiaque
      pelas águas calmas do rio.


      A região desenhou também um roteiro cultural de dois a três dias com dezasseis paragens. Entre elas
      contam-se:


      - Stavroupoli, que conserva solares de traça macedónia e calçadas rústicas, com um museu etnográfico
      repleto de trajes e alfaias.

      - A fortaleza de Kalyva, a 650 metros de altitude, mandada erguer por Filipe II da Macedónia no século
      IV a.C., sobranceira ao vale do Nestos.

      - Perto de Stavroupoli, em Komnina, mantém-se intacta uma sepultura macedónia abobadada de época
      helenística.

      - A gruta das Dríades, junto a Livera, estende-se por 1.150 metros quadrados com galerias de mais de 300
      metros cobertas de estalactites e estalagmites.
    history: >-
      A floresta ripícola do Nestos ultrapassou no passado os 125.000 stremmata, configurando uma das maiores
      matas de galeria da Europa; em 1952 decidiu-se abater a maior parte do arvoredo para plantar milho e
      drenar grande parte das zonas húmidas. Hoje restam 4.500 stremmata vedados e resguardados. Entre as
      pressões que fragilizam o ecossistema contam-se a escalada nas escarpas onde nidificam aves raras e o
      tráfego de embarcações na época de reprodução. A montante, no distrito de Drama, a albufeira
      hidroelétrica de Thisavros produz energia desde 1997.


      Na província de Xanthi existem centros de interpretação com materiais audiovisuais sobre a floresta
      ripícola. O organismo gestor dos parques do Nestos, Vistonida e Ródope está sediado em Porto Lagos,
      dispondo de uma dependência em Mesochori Paranestiou.
    before: >-
      As rapinas nidificam nas escarpas: não pratiques escalada nem te aproximes das fragas, e evita passeios
      de barco em plena época reprodutiva. Informa-te junto da delegação de Porto Lagos sobre as condições do
      trilho e da linha.
    around: >-
      O atlas não assinala outros espaços protegidos nas imediações dos estreitos do Nestos. Mais a norte, a
      [Reserva da Biosfera de Srebarna](/lugar/srebarna-biosphere-reserve/) acolhe também o
      corvo-marinho-pigmeu e a águia-rabalva entre a sua rica avifauna aquática.
