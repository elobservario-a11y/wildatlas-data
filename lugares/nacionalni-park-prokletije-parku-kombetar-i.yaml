resumen:
  es: Valles de montaña y bosques antiguos de molika en el parque montenegrino de Prokletije.
  en: Mountain valleys and ancient Macedonian pine (molika) forests in the Montenegrin Prokletije National Park.
  fr: Vallées alpines et forêts anciennes de pin de Macédoine (molika) dans le parc monténégrin de Prokletije.
  de: >-
    Hochgebirgstäler und alte Bestände der Mazedonischen Kiefer (Molika) im montenegrinischen
    Prokletije-Nationalpark.
  it: >-
    Valli alpine e antiche foreste di pino di Macedonia (molika) nel Parco Nazionale montenegrino di
    Prokletije.
  pt: >-
    Vales alpinos e florestas seculares de pinheiro-da-macedónia (molika) no Parque Nacional montenegrino de
    Prokletije.
unico:
  es: >-
    Un bosque de molika, un pino reliquia endémico de los Balcanes, protege con rango de reserva natural
    estricta el lago glaciar más bello del parque.
  en: >-
    A pristine molika forest, an endemic Balkan relict pine, is protected as a strict nature reserve
    surrounding the park's most picturesque glacial lake.
  fr: >-
    Une forêt de molika, pin relique endémique des Balkans, protège avec le statut de réserve naturelle
    intégrale le plus beau lac glaciaire du parc.
  de: >-
    Ein geschützter Molika-Urwald, eine endemische Relikt-Kiefer des Balkans, umgibt als strenges
    Naturreservat den malerischsten Gletschersee des Parks.
  it: >-
    Una foresta primigenia di molika, pino relitto endemico dei Balcani, tutela come riserva naturale
    integrale il più scenografico lago glaciale del parco.
  pt: >-
    Um bosque autóctone de molika, pinheiro relíquia endémico dos Balcãs, protege com estatuto de reserva
    natural integral o mais belo lago glaciar do parque.
observaciones:
  es: >-
    Muévete por los senderos señalizados y no dejes residuos. Los inviernos son largos y rigurosos, y las
    rutas altas pueden conservar nieve en verano, así que comprueba antes de ir su estado y, si no conoces la
    zona, considera un guía con licencia.
texto:
  es:
    intro: >-
      Los nombres lo dicen sin rodeos: Prokletije, en serbocroata, y Bjeshkët e Nemuna, en albanés, significan
      las montañas malditas. Pero lo que se encuentra al llegar son cumbres altas, afiladas y dentadas, de
      laderas muy empinadas, y lagos glaciares escondidos entre bosques. El Parque Nacional de Prokletije, en
      los municipios de Plav y Gusinje, es el más joven de Montenegro: se fundó en 2009. Está en la triple
      frontera con Kosovo y Albania, y el gestor sitúa aquí la cumbre más alta del país, Zla Kolata, de 2.534
      m.
    landscape: >-
      A mediados del siglo XIX, el geólogo austriaco Ami Boué las bautizó como los Alpes del sur de Europa, y
      la imagen sigue siendo buena. Es un mar de rocas con cumbres de nombres misteriosos: Rosni vrh, Dobra y
      Zla Kolata, Trojan, Gvozdeni, Šilo, Očnjak, Volušnica, Popadija, Talijanka y Karaula.


      El hielo hizo el resto. La cordillera es la parte más meridional de los Alpes Dináricos, y sus valles de
      Ropojana, Grbaja y Valbona los excavaron glaciares de varios kilómetros durante la última glaciación. En
      las zonas altas hay nieve incluso en verano, salvo en años muy secos. El clima, continental, de montaña
      y subalpino, trae inviernos largos y rigurosos, y veranos frescos y cortos.


      Los lagos glaciares completan el decorado, y el más bello es Hridsko jezero. A 1.970 m, lo rodean
      bosques de molika. Una leyenda cuenta que Dios lo creó en lo alto de los bosques para que se bañaran las
      hadas de la montaña, hasta que los hombres las echaron y Dios, furioso, castigó las montañas con rayos
      hasta dejarlas en roca desnuda. Por eso, dice la leyenda, son malditas. Y en la tradición, bañarse en el
      lago, al que llaman el lago de la suerte, trae suerte, salud, belleza y paz interior.
    wildlife: >-
      Prokletije es una fiesta de la diversidad. En el parque se han registrado más de 1.600 especies de
      plantas, la mitad de la flora de Montenegro, y en las zonas altas, 180 especies endémicas de los
      Balcanes. El terreno es tan inaccesible que todavía aparecen especies nuevas para el parque e incluso
      para la ciencia. El valle de Grebaje está reconocido como Área Importante para las Plantas. En la
      cordillera dominan los bosques de haya, abeto y pícea, y crecen más de cincuenta especies arctoalpinas
      de la flora glaciar de los Balcanes.


      La fauna es igual de rica. Hay 161 especies de aves, que viven en las zonas altas, los valles de
      Ropojana y Grebaje, los bosques, los lagos y los ríos; entre las más significativas, el [buitre
      leonado](/especie/gyps_fulvus/) y la culebrera europea. En la cordillera se ven además el [águila
      real](/especie/aquila_chrysaetos/), el [halcón peregrino](/especie/falco_peregrinus/) y el
      [urogallo](/especie/tetrao_urogallus/). Entre los mamíferos hay murciélagos y roedores, liebre,
      [lobo](/especie/canis_lupus/), [oso pardo](/especie/ursus_arctos/), [gato
      montés](/especie/felis_silvestris/), jabalí, [rebeco](/especie/rupicapra_rupicapra/) y
      [corzo](/especie/capreolus_capreolus/).


      Los reptiles y anfibios son un capítulo aparte: de las 40 especies de la zona, 9 son endémicas, y en la
      cordillera vive el lagarto de Prokletije, Dinarolacerta montenegrina, que solo existe aquí. La
      salamandra alpina, Salamandra atra, tiene su único hallazgo montenegrino en la montaña Bogićevica, a
      1.952 m. Y hay unas 60 especies endémicas de insectos.
    visit: >-
      Si es tu primera vez, empieza por el valle de Grebaje: es de fácil acceso, está rodeado de cumbres altas
      y es ideal para paseos cortos y para fotografiar. El siguiente paso es Volušnica, una buena primera
      subida: el sendero no es muy exigente y desde la cima se ve Grebaje, Karanfili y buena parte de
      Prokletije. Con más experiencia, se puede seguir hacia Talijanka y Popadija, una de las excursiones de
      montaña más conocidas del parque. El circuito Grbaja–Volušnica–Popadija lo recorre en unas cinco horas y
      media, y el gestor lo clasifica de dificultad media.


      Para una salida más tranquila, el lago Hridsko se alcanza desde Plav por un sendero lineal y fácil de
      3,1 km y una hora. Hay también rutas ciclistas señalizadas.


      El valle de Ropojana, uno de los mayores valles glaciares, forma parte de la ruta internacional Peaks of
      the Balkans, que une Montenegro, Albania y Kosovo. Antes de entrar en el valle están las fuentes de
      Ali-paša, Oko Skakavice y el cañón de Grlja, en la zona de contacto del parque.


      El centro de visitantes de Gusinje informa sobre las visitas guiadas. Hay excursiones organizadas con
      guías con licencia, que permiten recorrer las mejores rutas con más seguridad y conocer mejor el
      patrimonio natural y cultural.
    history: >-
      El gestor hace seguimiento de los escolítidos con trampas de feromonas en los bosques de pícea, y su
      informe de gestión mantiene afecciones locales en rodales de pícea afectados por esta plaga; el
      diagnóstico no equivale a degradación de todo el parque. Los rodales antiguos de molika, puros y mixtos,
      se conservan bien.
    before: >-
      Muévete por los senderos señalizados y no dejes residuos. Los inviernos son largos y rigurosos, y las
      rutas altas pueden conservar nieve en verano, así que comprueba antes de ir su estado y, si no conoces
      la zona, considera un guía con licencia.
    around: >-
      El [Parque Nacional Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) y el [Parque Nacional
      de los Alpes Albaneses - Valbona y Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) están a 1 km,
      al otro lado de las fronteras: la misma cordillera continúa en Kosovo y en Albania. A 9 km están el
      [Parque Natural de los Montes Komovi](/lugar/park-prirode-komovi/) y la [Reserva Natural Estricta del
      Río Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). A 19 km, el [Cañón del Río
      Morača](/lugar/kanjon-morace/), y a 21 km, la [Meseta Kárstica de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  en:
    intro: >-
      Their names speak plainly: Prokletije in Serbo-Croatian and Bjeshkët e Nemuna in Albanian both translate
      as the Accursed Mountains. Yet what greets you upon arrival are soaring, razor-sharp serrated peaks,
      precipitously steep rock faces and crystalline glacial lakes hidden within ancient woodlands. Prokletije
      National Park, spanning the municipalities of Plav and Gusinje, is Montenegro's youngest national park,
      established in 2009. Set along the tripoint border with Kosovo and Albania, park managers place the
      country's highest summit here: Zla Kolata at 2,534 m.
    landscape: >-
      In the mid-XIX century, Austrian geologist Ami Boué aptly christened these massifs the Alps of Southern
      Europe. It remains an ocean of raw limestone crests bearing evocative names: Rosni vrh, Dobra and Zla
      Kolata, Trojan, Gvozdeni, Šilo, Očnjak, Volušnica, Popadija, Talijanka and Karaula.


      Ice shaped the rest. The range forms the southernmost bastion of the Dinaric Alps, whose deep valleys of
      Ropojana, Grbaja and Valbona were gouged out by massive valley glaciers during the last glacial maximum.
      Perennial snow patches persist in high hollows through summer, except during unusually arid years. The
      climate, blending continental, montane and subalpine regimes, delivers long and harsh winters alongside
      cool, short summers.


      Glacial lakes complete this alpine tableau, none more enchanting than Hridsko jezero. Lying at 1,970 m,
      it is framed by ancient molika pines. Local legend tells that God placed this hidden tarn high in the
      forest for mountain mountain fairies to bathe in, until human intrusion drove them away and divine
      lightning blasted the surrounding peaks into bare rock. Thus, lore says, the mountains were cursed.
      Traditional belief holds that swimming in this 'lake of happiness' bestows good fortune, health, beauty
      and inner serenity.
    wildlife: >-
      Prokletije represents an extraordinary biodiversity hotspot. Over 1,600 plant species have been
      documented in the park—representing half of Montenegro's entire flora—with the high-altitude zones
      harbouring 180 Balkan endemics. Due to the forbidding terrain, botanists continue to uncover species
      newly recorded for the park and science. The Grebaje valley is designated as an Important Plant Area.
      Extensive beech, fir and spruce forests mantle the slopes, alongside more than fifty arctic-alpine
      relict plant species preserved from glacial epochs.


      The fauna is equally diverse. Around 161 bird species inhabit the high crags, Ropojana and Grebaje
      valleys, ancient woodlands, lakes and torrents; prominent species include the [griffon
      vulture](/especie/gyps_fulvus/) and short-toed snake eagle. The massif also supports the [golden
      eagle](/especie/aquila_chrysaetos/), [peregrine falcon](/especie/falco_peregrinus/) and [western
      capercaillie](/especie/tetrao_urogallus/). Mammalian inhabitants encompass bats, rodents, mountain hare,
      grey [wolf](/especie/canis_lupus/), [brown bear](/especie/ursus_arctos/),
      [wildcat](/especie/felis_silvestris/), wild boar, Balkan [chamois](/especie/rupicapra_rupicapra/) and
      [roe deer](/especie/capreolus_capreolus/).


      Herpetofauna constitutes another treasure: out of 40 species recorded, 9 are regional endemics,
      including the Prokletije rock lizard (*Dinarolacerta montenegrina*), strictly endemic to this range. The
      alpine salamander (*Salamandra atra*) has its only confirmed Montenegrin locality on Mount Bogićevica at
      1,952 m. Furthermore, roughly 60 endemic insect species inhabit these valleys.
    visit: >-
      If this is your first visit, begin in the Grebaje valley: easily reached, framed by towering rock
      amphitheatres and ideal for gentle strolls and photography. A natural progression leads up Volušnica, an
      outstanding introductory ascent: the path is not overly strenuous and the summit unfolds panoramic
      vistas over Grebaje, the Karanfili peaks and across Prokletije. Experienced hikers can press onwards to
      Talijanka and Popadija, forming one of the park's premier ridge routes. The Grbaja–Volušnica–Popadija
      circuit takes roughly five and a half hours, rated moderate by park rangers.


      For a peaceful excursion, Lake Hridsko is reached from Plav via an easy, well-marked trail covering 3.1
      km in about an hour. There are also marked mountain bike itineraries.


      Ropojana valley, among the grandest glacial troughs, forms part of the international 'Peaks of the
      Balkans' trail connecting Montenegro, Albania and Kosovo. Before entering the valley lie Ali Pasha's
      Springs, the karst spring Oko Skakavice and the Grlja gorge, marking the threshold of the park.


      The Gusinje visitor centre provides advice on certified mountain guides, allowing you to tackle higher
      trails with greater safety and cultural insight.
    history: >-
      Park authorities actively monitor bark beetle outbreaks using pheromone traps throughout the spruce
      forests, noting localised damage in affected stands; this targeted management does not imply park-wide
      ecological degradation. Ancient pure and mixed stands of Macedonian pine (*molika*) remain exceptionally
      well preserved.
    before: >-
      Stick strictly to marked trails and pack out all waste. Winters are protracted and severe, and
      high-altitude passes can hold snow well into summer; verify current trail conditions before departure
      and consider hiring a licensed guide if unfamiliar with high-mountain karst terrain.
    around: >-
      [Bjeshkët e Nemuna National Park](/lugar/parku-kombetar-bjeshket-e-nemuna/) and [Albanian Alps National
      Park - Valbona and Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) lie just 1 km away across
      national borders, as the contiguous massif spans Kosovo and Albania. Located 9 km away are [Komovi
      Nature Park](/lugar/park-prirode-komovi/) and [Gashi River Strict Nature
      Reserve](/lugar/rezervati-natyror-i-strazuar-lumi-i/). At 19 km lies the [Morača River
      Canyon](/lugar/kanjon-morace/), and 21 km away is the [Sinjajevina Karst
      Plateau](/lugar/sinjajevina-karst-plateau/).
  fr:
    intro: >-
      Leurs dénominations sont sans équivoque : Prokletije en serbo-croate et Bjeshkët e Nemuna en albanais
      signifient littéralement les monts maudits. Pourtant, vous y découvrez de vertigineuses aiguilles
      rocheuses, des parois calcaires abruptes et des lacs glaciaires enchâssés au milieu de forêts
      préservées. Le parc national de Prokletije, réparti sur les municipalités de Plav et Gusinje, est le
      plus récent du Monténégro, créé en 2009. Situé au tripoint frontalier avec le Kosovo et l'Albanie, le
      parc abrite le point culminant du pays, le pic Zla Kolata à 2 534 m.
    landscape: >-
      Au milieu du XIXe siècle, le géologue autrichien Ami Boué qualifia ce massif d'Alpes de l'Europe
      méridionale, comparaison toujours saisissante. C'est un déferlement de cimes rocheuses aux noms
      évocateurs : Rosni vrh, Dobra et Zla Kolata, Trojan, Gvozdeni, Šilo, Očnjak, Volušnica, Popadija,
      Talijanka et Karaula.


      Les glaciers quaternaires ont modelé ce relief. Cette chaîne constitue le bastion méridional des Alpes
      dinariques, où les vallées en auge de Ropojana, Grbaja et Valbona furent creusées par d'immenses langues
      glaciaires. Des névés subsistent en altitude même au cœur de l'été. Le climat, à la fois continental et
      alpin, apporte des hivers prolongés et rudes, suivis d'étés courts et tempérés.


      Les lacs d'altitude complètent ce décor grandiose, le plus réputé étant le Hridsko jezero. Niché à 1 970
      m, il est ceinturé de vieux pins molika. Selon une légende pastorale, Dieu créa ce plan d'eau pour que
      les fées des montagnes viennent s'y baigner, jusqu'à ce que les hommes les chassent, déclenchant la
      colère divine qui foudroya les crêtes pour les réduire en roche stérile. La tradition populaire affirme
      qu'une baignade dans ce lac porte bonheur, santé et paix intérieure.
    wildlife: >-
      Prokletije constitue un carrefour biogéographique remarquable. Plus de 1 600 espèces végétales y sont
      inventoriées—soit la moitié de la flore du Monténégro—les combes d'altitude recelant 180 taxons
      endémiques des Balkans. En raison de son relief escarpé, les botanistes continuent d'y identifier des
      espèces inédites. La vallée de Grebaje est classée Zone importante pour les plantes. Des hêtraies,
      sapinières et pessières couvrent les versants, abritant plus de cinquante espèces relictes
      arctico-alpines de l'ère glaciaire.


      L'avifaune se révèle tout aussi variée avec 161 espèces d'oiseaux nichant dans les falaises, les forêts
      et les vallées alluviales ; parmi les plus notables figurent le [vautour fauve](/especie/gyps_fulvus/)
      et le circaète Jean-le-Blanc. Les cimes accueillent l'[aigle royal](/especie/aquila_chrysaetos/), le
      [faucon pèlerin](/especie/falco_peregrinus/) et le [grand tétras](/especie/tetrao_urogallus/). Les
      mammifères comptent chauves-souris, rongeurs, lièvre variable, [loup](/especie/canis_lupus/), [ours
      brun](/especie/ursus_arctos/), [chat sauvage](/especie/felis_silvestris/), sanglier,
      [chamois](/especie/rupicapra_rupicapra/) et [chevreuil](/especie/capreolus_capreolus/).


      Les reptiles et amphibiens forment un chapitre captivant : sur 40 espèces recensées, 9 sont endémiques
      régionales, dont le lézard de Prokletije (*Dinarolacerta montenegrina*), inféodé à ces parois. La
      salamandre noire (*Salamandra atra*) possède son unique station monténégrine sur le mont Bogićevica à 1
      952 m. Le massif abrite également quelque 60 insectes endémiques.
    visit: >-
      Pour une première découverte, commencez par la vallée de Grebaje : aisément accessible, dominée par
      d'immenses cirques rocheux, elle est idéale pour la promenade et la photographie. Vous pouvez ensuite
      monter à la Volušnica : ce sentier panoramique permet d'admirer les aiguilles de Karanfili et les crêtes
      de Prokletije. Les randonneurs confirmés poursuivront vers la Talijanka et la Popadija. La boucle
      Grbaja–Volušnica–Popadija s'effectue en environ cinq heures et demie, classée de difficulté moyenne.


      Pour une sortie paisible, le lac Hridsko s'atteint depuis Plav par un sentier balisé de 3,1 km
      réalisable en une heure de marche. Des itinéraires VTT sillonnent également le massif.


      La vallée glaciaire de Ropojana est intégrée au sentier international des « Sommets des Balkans »
      reliant Monténégro, Albanie et Kosovo. À son entrée se trouvent les sources d'Ali-Pacha, la résurgence
      d'Oko Skakavice et les gorges de Grlja.


      Le centre d'accueil de Gusinje fournit des informations sur les guides professionnels accompagnateurs
      pour explorer les secteurs d'altitude en toute sécurité.
    history: >-
      Les gardes du parc surveillent la prolifération des scolytes à l'aide de pièges à phéromones dans les
      pessières, enregistrant des impacts localisés qui ne compromettent pas l'équilibre de l'écosystème
      forestier. Les peuplements séculaires de pin de Macédoine (*molika*) demeurent remarquablement intacts.
    before: >-
      Restez impérativement sur les sentiers balisés et rapportez tous vos déchets. Les hivers sont rigoureux
      et la neige persiste tardivement sur les cols en été ; vérifiez l'état des itinéraires et sollicitez un
      guide agréé si vous ne maîtrisez pas le terrain karstique alpin.
    around: >-
      Le [parc national Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) et le [parc national des
      Alpes albanaises - Valbona et Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) ne sont qu'à 1 km
      par-delà les frontières, le massif se prolongeant au Kosovo et en Albanie. À 9 km se trouvent le [parc
      naturel des monts Komovi](/lugar/park-prirode-komovi/) et la [réserve naturelle intégrale de la rivière
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). À 19 km s'ouvrent les [gorges de la
      Morača](/lugar/kanjon-morace/) et à 21 km le [plateau karstique de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  de:
    intro: >-
      Ihre Namen sagen es unmissverständlich: Prokletije auf Serbokroatisch und Bjeshkët e Nemuna auf
      Albanisch bedeuten die Verwunschenen Berge. Doch wer hierher gelangt, blickt auf schroffe, messerscharfe
      Felsgrate, steil abfallende Felsflanken und glasklare Karseen inmitten stiller Nadelwälder. Der
      Nationalpark Prokletije in den Gemeinden Plav und Gusinje ist der jüngste Montenegros, gegründet im Jahr
      2009. Im Dreiländereck mit dem Kosovo und Albanien gelegen, birgt das Gebiet Montenegros höchsten
      Gipfel, die Zla Kolata mit 2.534 m.
    landscape: >-
      Mitte des XIX. Jahrhunderts taufte der österreichische Geologe Ami Boué das Gebirge treffend die Alpen
      Südeuropas. Es ist ein wildes Felsenmeer mit klangvollen Gipfeln: Rosni vrh, Dobra und Zla Kolata,
      Trojan, Gvozdeni, Šilo, Očnjak, Volušnica, Popadija, Talijanka und Karaula.


      Das Eis vollendete das Werk. Das Massiv bildet den südlichsten Teil der Dinarischen Alpen, deren
      Trogtäler Ropojana, Grbaja und Valbona während der letzten Eiszeit von kilometermächtigen Gletschern
      ausgeschürft wurden. In hochgelegenen Karen hält sich Schnee bis weit in den Sommer. Das raue
      Gebirgsklima bringt lange, schneereiche Winter und kurze, kühle Sommer mit sich.


      Gletscherseen prägen die Landschaft, allen voran der Hridsko jezero. Auf 1.970 m Höhe ruht er umgeben
      von alten Molika-Kiefern. Einer Sage nach schuf Gott den See hoch oben in den Wäldern als Badestelle für
      Bergfeen, bis Menschen sie vertrieben und göttliche Blitze das Gebirge in nackten Fels verwandelten.
      Daher, so heißt es, rühre der Name der Verwunschenen Berge. Der Volksglaube besagt, ein Bad im 'See des
      Glücks' schenke Gesundheit, Schönheit und Seelenfrieden.
    wildlife: >-
      Das Massiv gilt als Brennpunkt floristischer Vielfalt: Über 1.600 Pflanzenarten sind dokumentiert—die
      Hälfte der gesamten Flora Montenegros—wobei in den Hochlagen 180 balkanische Endemiten wachsen. Wegen
      der Unzugänglichkeit werden regelmäßig für das Gebiet oder die Wissenschaft neue Sippen entdeckt. Das
      Grebaje-Tal ist als Important Plant Area anerkannt. Buchen-, Tannen- und Fichtenwälder dominieren die
      Berghänge, bereichert durch mehr als fünfzig arktisch-alpine Eiszeitrelikte.


      Ebenso reich ist die Vogelwelt mit 161 Arten in Felswänden, Hochtälern und Wäldern; bemerkenswert sind
      [Gänsegeier](/especie/gyps_fulvus/) und Schlangenadler. Am Himmel kreisen zudem
      [Steinadler](/especie/aquila_chrysaetos/), [Wanderfalke](/especie/falco_peregrinus/) und das
      [Auerhuhn](/especie/tetrao_urogallus/) balzt im Bergwald. An Säugetieren leben Fledermäuse, Schneehase,
      [Wolf](/especie/canis_lupus/), [Braunbär](/especie/ursus_arctos/),
      [Wildkatze](/especie/felis_silvestris/), Wildschwein, Balkan-[Gämse](/especie/rupicapra_rupicapra/) und
      [Reh](/especie/capreolus_capreolus/).


      Besonderen Schutz genießen Reptilien und Lurche: Von 40 Arten sind 9 regional endemisch, darunter die
      Prokletije-Felseidechse (*Dinarolacerta montenegrina*), die weltweit nur hier vorkommt. Der
      Alpensalamander (*Salamandra atra*) besitzt am Berg Bogićevica auf 1.952 m seinen einzigen
      montenegrinischen Fundort. Zudem leben hier rund 60 endemische Insektenarten.
    visit: >-
      Für Einsteiger empfiehlt sich das Grebaje-Tal: Leicht erreichbar, umrahmt von gewaltigen Felswänden,
      eignet es sich ideal für Spaziergänge und Naturfotografie. Als Bergtour bietet sich die Volušnica an:
      Der Pfad ist moderat und belohnt am Gipfel mit Tiefblicken ins Grebaje-Tal, zu den Karanfili-Spitzen und
      über die Prokletije. Geübte Bergwanderer setzen die Tour zu Talijanka und Popadija fort. Der Rundweg
      Grbaja–Volušnica–Popadija beansprucht rund fünfundeinhalb Stunden und wird als mittelschwer eingestuft.


      Ein beschauliches Ziel ist der Hridsko-See, ab Plav über einen einfachen Bergsteig von 3,1 km in gut
      einer Stunde erreichbar. Ausgewiesene Mountainbike-Routen sind ebenfalls vorhanden.


      Das eiszeitliche Ropojana-Tal ist Teil des Weitwanderwegs 'Peaks of the Balkans', der Montenegro,
      Albanien und den Kosovo verbindet. Vor dem Taleingang liegen die Karstquellen von Ali-paša, das
      Felsenauge Oko Skakavice und die Grlja-Klamm.


      Das Besucherzentrum in Gusinje vermittelt lizenzierte Bergführer für anspruchsvolle Gipfeltouren.
    history: >-
      Die Nationalparkverwaltung überwacht Borkenkäferpopulationen mit Pheromonfallen in Fichtenbeständen;
      lokale Schäden bedeuten jedoch keine Gefährdung des gesamten Waldökosystems. Die urwüchsigen Bestände
      der Mazedonischen Kiefer (*molika*) sind hervorragend erhalten.
    before: >-
      Bleib stets auf den markierten Wegen und nimm Abfälle vollständig wieder mit. Die Winter sind lang und
      schneereich; auf Pässen kann im Sommer Altschnee liegen. Informiere dich vor Antritt einer Bergtour über
      die Verhältnisse und ziehe im Zweifel einen Bergführer hinzu.
    around: >-
      Der [Nationalpark Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) und der [Nationalpark
      Albanische Alpen - Valbona und Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) liegen nur 1 km
      entfernt jenseits der Grenze. In 9 km Entfernung liegen der [Naturpark
      Komovi](/lugar/park-prirode-komovi/) und das [Strenge Naturreservat
      Gashi-Fluss](/lugar/rezervati-natyror-i-strazuar-lumi-i/). Nach 19 km erreichst du die
      [Morača-Schlucht](/lugar/kanjon-morace/) und nach 21 km das [Karstplateau
      Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  it:
    intro: >-
      I loro toponimi non lasciano spazio a dubbi: Prokletije in serbocroato e Bjeshkët e Nemuna in albanese
      significano le montagne maledette. Eppure, all'arrivo si svelano vette affilate, ripidissime bastionate
      calcaree e laghi glaciali incastonati tra fitti boschi. Il Parco Nazionale di Prokletije, suddiviso tra
      i comuni di Plav e Gusinje, è il più recente del Montenegro, istituito nel 2009. Posto al confine con
      Kosovo e Albania, racchiude la vetta più alta del paese, la Zla Kolata a 2.534 m.
    landscape: >-
      Verso la metà del XIX secolo il geologo austriaco Ami Boué le ribattezzò le Alpi dell'Europa
      meridionale. È una maestosa distesa di roccia dominata da cime dai nomi suggestivi: Rosni vrh, Dobra e
      Zla Kolata, Trojan, Gvozdeni, Šilo, Očnjak, Volušnica, Popadija, Talijanka e Karaula.


      Il gelo ha scolpito il resto. La catena rappresenta il settore più meridionale delle Alpi Dinariche, le
      cui valli di Ropojana, Grbaja e Valbona furono modellate da poderose lingue glaciali quaternarie. Nelle
      conche elevate i nevai resistono anche in piena estate. Il clima alpino montano riserva inverni lunghi e
      gelidi ed estati brevi e fresche.


      I laghetti glaciali completano lo scenario, tra i quali eccelle lo Hridsko jezero. Posto a 1.970 m, è
      cinto da pini molika. La leggenda narra che Dio lo creò affinché le fate dei monti potessero bagnarvisi,
      finché l'uomo non le allontanò scatenando folgori divine che ridussero le cime a nude pietraie. Fare il
      bagno in questo 'lago della fortuna' donerebbe salute, bellezza e pace interiore.
    wildlife: >-
      Prokletije è un crocevia straordinario di biodiversità botanica. Vi sono censite oltre 1.600 specie
      vegetali—pari a metà della flora del Montenegro—con le fasce alpine che annoverano 180 endemismi
      balcanici. Per l'asprezza dei rilievi continuano a essere scoperte nuove specie botaniche. La valle di
      Grebaje è riconosciuta come Important Plant Area. Faggete, abetine e peccete coprono le pendici, insieme
      a più di cinquanta relitti glaciali arctico-alpini.


      Altrettanto ricca è l'avifauna con 161 specie di uccelli che popolano pareti rocciose e valli montane;
      risaltano il [grifone](/especie/gyps_fulvus/) e il biancone. Nel massiccio nidificano l'[aquila
      reale](/especie/aquila_chrysaetos/), il [falco pellegrino](/especie/falco_peregrinus/) e il [gallo
      cedrone](/especie/tetrao_urogallus/). Tra i mammiferi figurano pipistrelli, lepre variabile,
      [lupo](/especie/canis_lupus/), [orso bruno](/especie/ursus_arctos/), [gatto
      selvatico](/especie/felis_silvestris/), cinghiale, [camoscio](/especie/rupicapra_rupicapra/) e
      [capriolo](/especie/capreolus_capreolus/).


      Notevole è la presenza di anfibi e rettili: su 40 specie presenti, 9 sono endemiche, tra cui la
      lucertola di Prokletije (*Dinarolacerta montenegrina*), esclusiva di queste creste. La salamandra alpina
      (*Salamandra atra*) trova sul monte Bogićevica a 1.952 m la sua unica stazione montenegrina. Si contano
      inoltre circa 60 insetti endemici.
    visit: >-
      Se visiti il parco per la prima volta, comincia dalla valle di Grebaje: facilmente raggiungibile,
      dominata da imponenti pareti calcaree, ideale per passeggiate e fotografie. La salita alla Volušnica
      offre una bella panoramica sulle creste dei Karanfili e sull'intero massiccio. Chi ha esperienza può
      proseguire verso Talijanka e Popadija. L'anello Grbaja–Volušnica–Popadija richiede circa cinque ore e
      mezza, classificato di media difficoltà.


      Per un'escursione tranquilla, il lago Hridsko si raggiunge da Plav con una facile camminata di 3,1 km
      percorribile in un'ora. Sono presenti anche tracciati per mountain bike.


      La valle di Ropojana fa parte del sentiero escursionistico internazionale 'Peaks of the Balkans' che
      unisce Montenegro, Albania e Kosovo. All'imbocco vallivo sorgono le sorgenti di Ali-paša, la risorgiva
      carsica Oko Skakavice e la forra di Grlja.


      Il centro visite di Gusinje fornisce indicazioni per avvalersi di guide alpine qualificate per i
      percorsi più impegnativi.
    history: >-
      I guardaparco effettuano il monitoraggio del bostrico tipografo con trappole a feromoni nei boschi di
      abete rosso; i focolai localizzati non intaccano la stabilità complessiva della foresta. I popolamenti
      storici di pino di Macedonia (*molika*) si mantengono in ottimo stato di conservazione.
    before: >-
      Rimani sui sentieri segnati e non abbandonare rifiuti. Gli inverni sono severi e sui valichi elevati la
      neve persiste in estate; verifica le condizioni dei tracciati prima della partenza e affidati a una
      guida autorizzata se non conosci la montagna carsica.
    around: >-
      Il [Parco nazionale Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) e il [Parco nazionale
      delle Alpi Albanesi - Valbona e Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) distano appena 1
      km oltreconfine, poiché la catena montuosa prosegue in Kosovo e Albania. A 9 km sorgono il [Parco
      naturale dei monti Komovi](/lugar/park-prirode-komovi/) e la [Riserva naturale integrale del fiume
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). A 19 km si apre il [Canyon del fiume
      Morača](/lugar/kanjon-morace/) e a 21 km l'[Altopiano carsico di
      Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  pt:
    intro: >-
      Os seus topónimos expressam-no claramente: Prokletije em servo-croata e Bjeshkët e Nemuna em albanês
      traduzem-se por montanhas amaldiçoadas. Contudo, ao chegar encontras picos aguçados, imponentes escarpas
      rochosas e lagos glaciares escondidos no seio da floresta. O Parque Nacional de Prokletije, nos
      municípios de Plav e Gusinje, é o mais jovem de Montenegro, criado em 2009. Localizado na fronteira
      tríplice com o Kosovo e a Albânia, acolhe o ponto mais alto do país, Zla Kolata, com 2.534 m.
    landscape: >-
      Em meados do século XIX, o geólogo austríaco Ami Boué apelidou esta cordilheira de Alpes do sul da
      Europa. É um mar de penedias coroadas por cumes de nomes misteriosos: Rosni vrh, Dobra e Zla Kolata,
      Trojan, Gvozdeni, Šilo, Očnjak, Volušnica, Popadija, Talijanka e Karaula.


      O gelo esculpiu o restante relevo. O maciço ergue-se como o setor mais meridional dos Alpes Dináricos,
      cujos vales em U de Ropojana, Grbaja e Valbona foram talhados por vastas línguas glaciares. Nas cotas
      mais elevadas acumula-se neve mesmo em pleno verão. O clima de montanha traz invernos longos e gélidos,
      acompanhados de verões amenos e curtos.


      Os lagos de altitude compõem o cenário alpino, destacando-se o Hridsko jezero. Situado a 1.970 m, surge
      rodeado por pinheiros-molika. Segundo reza a lenda, Deus terá criado este lago nas alturas para banho
      das fadas das montanhas, até que a intromissão humana as expulsou, provocando raios divinos que
      desnudaram os cumes em rocha viva. A tradição popular garante que mergulhar neste lago atrai sorte,
      saúde e serenidade.
    wildlife: >-
      Prokletije constitui um santuário de biodiversidade botânica. Foram registadas mais de 1.600 espécies de
      plantas—metade de toda a flora de Montenegro—albergando as cotas alpinas 180 endemismos dos Balcãs. Pela
      sua inacessibilidade, continuam a ser descritas novas espécies para a ciência. O vale de Grebaje está
      classificado como Área Importante para as Plantas. Faiais, abetais e florestas de espruce cobrem as
      encostas, convivendo com mais de cinquenta relíquias árctico-alpinas da era glaciar.


      A fauna ostenta idêntica abundância com 161 espécies de aves nas escarpas e vales; destacam-se o
      [grifo](/especie/gyps_fulvus/) e a águia-cobreira. Na cordilheira avistam-se também a
      [águia-real](/especie/aquila_chrysaetos/), o [falcão-peregrino](/especie/falco_peregrinus/) e o
      [tetraz-grande](/especie/tetrao_urogallus/). Os mamíferos incluem morcegos, lebre-variável,
      [lobo](/especie/canis_lupus/), [urso-pardo](/especie/ursus_arctos/),
      [gato-bravo](/especie/felis_silvestris/), javali, [camurça](/especie/rupicapra_rupicapra/) e
      [corço](/especie/capreolus_capreolus/).


      Os répteis e anfíbios merecem destaque: entre 40 espécies locais, 9 são endémicas, incluindo a
      lagartixa-de-prokletije (*Dinarolacerta montenegrina*), exclusiva destas rochas. A salamandra-alpina
      (*Salamandra atra*) tem no monte Bogićevica, a 1.952 m, o seu único registo montenegrino. Estão ainda
      descritas cerca de 60 espécies endémicas de insetos.
    visit: >-
      Na primeira visita, começa pelo vale de Grebaje: de acesso fácil, cercado por anfiteatros rochosos,
      perfeito para passeios ligeiros e fotografia. Em seguida podes subir à Volušnica: o trilho é moderado e
      do cume avistam-se as cristas de Karanfili e de Prokletije. Caminhantes mais experientes podem avançar
      para Talijanka e Popadija. O circuito Grbaja–Volušnica–Popadija cumpre-se em cinco horas e meia, com
      grau de dificuldade média.


      Para um passeio mais tranquilo, o lago Hridsko atinge-se a partir de Plav num trilho de 3,1 km que se
      percorre em cerca de uma hora. Existem percursos sinalizados para BTT.


      O vale de Ropojana integra a rota internacional pedestre 'Peaks of the Balkans', unindo Montenegro,
      Albânia e Kosovo. Antes de entrar no vale encontram-se as nascentes de Ali-paša, a ressurgência cársica
      Oko Skakavice e o desfiladeiro de Grlja.


      O centro de visitantes em Gusinje fornece informações e contactos de guias de montanha credenciados.
    history: >-
      Os técnicos do parque efetuam a monitorização de escaravelhos-da-casca com armadilhas de feromonas nas
      matas de espruce; as afeções locais registadas não comprometem a vitalidade geral do ecossistema. As
      matas seculares de pinheiro-da-macedónia (*molika*) exibem excelente estado de conservação.
    before: >-
      Caminha exclusivamente nos trilhos marcados e recolhe todo o lixo. Os invernos são rigorosos e os passos
      de montanha retêm neve durante o verão; consulta previamente as condições dos percursos e contrata um
      guia credenciado caso não estejas familiarizado com terreno cársico alpino.
    around: >-
      O [Parque Nacional Bjeshkët e Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) e o [Parque Nacional dos
      Alpes Albaneses - Valbona e Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) distam apenas 1 km
      além-fronteiras, estendendo-se a cordilheira pelo Kosovo e Albânia. A 9 km ficam o [Parque Natural dos
      Montes Komovi](/lugar/park-prirode-komovi/) e a [Reserva Natural Estrita do Rio
      Gashi](/lugar/rezervati-natyror-i-strazuar-lumi-i/). A 19 km abre-se o [Desfiladeiro do Rio
      Morača](/lugar/kanjon-morace/) e a 21 km o [Planalto Cársico de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/).
