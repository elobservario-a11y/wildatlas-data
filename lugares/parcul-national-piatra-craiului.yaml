resumen:
  es: >-
    La 'Cresta Real', la hoja caliza alpina más afilada y espectacular de los Cárpatos (25 km de crestería
    ininterrumpida).
  en: >-
    The "Royal Ridge", the sharpest and most spectacular alpine limestone blade in the Carpathians (25 km of
    unbroken crest).
  fr: >-
    La « Crête royale », la lame calcaire alpine la plus affûtée et spectaculaire des Carpates (25 km de crête
    ininterrompue).
  de: >-
    Der „Königskamm“, die schärfste und spektakulärste alpine Kalkklinge der Karpaten (25 km ununterbrochener
    Grat).
  it: >-
    La «Cresta Reale», l'affilata e spettacolare lama calcarea alpina dei Carpazi (25 km di cresta
    ininterrotta).
  pt: >-
    A «Crista Real», a lâmina alpina calcária mais afilada e impressionante dos Cárpatos (25 km de espinha
    ininterrupta).
unico:
  es: >-
    Una sola pared de caliza concentra 1199 especies y subespecies de plantas, una flor que no crece en ningún
    otro sitio y una cresta que lleva más de un siglo atrayendo a los montañeros.
  en: >-
    A single limestone wall concentrates 1199 plant species and subspecies, a flower that grows nowhere else,
    and a ridge that has drawn mountaineers for over a century.
  fr: >-
    Une unique paroi calcaire rassemble 1199 espèces et sous-espèces végétales, une fleur endémique stricte et
    une crête qui attire les alpinistes depuis plus d'un siècle.
  de: >-
    Eine einzige Kalksteinwand vereint 1199 Pflanzenarten und Unterarten, eine weltweit einzigartige Blüte und
    einen Grat, der Bergsteiger seit über einem Jahrhundert anzieht.
  it: >-
    Una singola parete di calcare concentra 1199 specie e sottospecie di piante, un fiore che non cresce in
    nessun altro luogo e una cresta che attrae alpinisti da oltre un secolo.
  pt: >-
    Uma única parede de calcário concentra 1199 espécies e subespécies de plantas, uma flor endémica exclusiva
    e uma crista que atrai montanhistas há mais de um século.
observaciones:
  es: >-
    Elige un itinerario acorde con tus fuerzas, consulta el mapa antes de salir y, si dudas, pide información
    a la administración del parque o al servicio de salvamento de montaña. Quédate en los senderos oficiales
    marcados, no entres en coche, moto o quad en las zonas con acceso motorizado prohibido y acampa solo donde
    esté permitido.


    Hay osos. Para no atraerlos, no guardes comida en la tienda: cuélgala de las ramas a al menos 2 metros de
    altura, separada del tronco. Mira antes de que te vean y atiende a los rastros (piedras volteadas, troncos
    removidos, montículos esparcidos).
texto:
  es:
    intro: >-
      Una hoja de caliza de 25 km de largo clavada en mitad de los Cárpatos. Piatra Craiului no es una montaña
      de cumbre redondeada y laderas amables: es una cresta continua, la más alta y la más larga de roca
      calcárea de Rumanía, que se levanta entre los condados de Argeș y Brașov con su punto más alto en el
      Piscul Baciului, a 2238 m. El parque nacional que la protege reúne la cresta, sus canchales, sus
      gargantas y los bosques de las faldas, y tiene a Zărnești como puerta principal.
    landscape: >-
      Empieza por abajo, porque ahí está la explicación de todo. En el noreste del parque, las gargantas de
      Zărnești (los Prăpăstiile Zărneștilor) se formaron hace cientos de millones de años y la caliza aceleró
      su excavación. Fueron cuatro fases: primero un río que corría por la superficie; luego el agua se hundió
      y abrió una cueva; después el techo se vino abajo y la cueva quedó convertida en un tajo estrecho de
      paredes verticales; por último el curso volvió a perderse bajo tierra. Hoy es un valle seco, de 3,9 km,
      que da testimonio de procesos geológicos del Jurásico. Las gargantas de la Dâmbovicioara, cuentan una
      historia parecida, y su cueva, formada en calizas jurásicas, tiene una galería de 555 m.


      Arriba mandan los canchales. Se extienden entre 1300 y 2200 m de altitud y son sobre todo móviles: bajan
      por los valles de las dos vertientes y forman auténticos ríos de piedras. En la vertiente oeste, a 1720
      m, el Cerdacul Stanciului es la mayor arcada kárstica del macizo, el resto de una cueva antigua cuyo
      techo se derrumbó y dejó en pie un bloque de caliza en el centro.


      El punto más bajo del parque, a 735 m, está en la confluencia de la Dâmbovicioara y la Dâmbovița. Entre
      ese fondo de valle y la cresta se suceden hayedos, pinares relictos de pino silvestre sobre caliza y
      matorrales de pino mugo y rododendro.
    wildlife: >-
      La flor que da fama al macizo es el clavel de Piatra Craiului, garofița Piatrei Craiului (*Dianthus
      callizonus*), endémico estricto: crece en las rocas y grutas de esta sierra y en ninguna otra parte. Es,
      además, el símbolo florístico del macizo. Le acompañan la flor de nieve, el zapatito de dama
      (*Cypripedium calceolus*), la amapola amarilla de montaña y otras especies protegidas. El inventario es
      enorme: 1199 especies y subespecies, de las que 181 están en la lista roja rumana como endémicas, raras
      o vulnerables.


      Entre los animales, la administración destaca los grandes carnívoros: el [oso
      pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/). Hay
      21 especies de murciélagos, 112 de aves (el parque se considera un lugar idóneo para observarlas) y más
      de 220 [rebecos](/especie/rupicapra_rupicapra/) en los roquedos. Entre los mamíferos de los bosques
      figuran también el [ciervo](/especie/cervus_elaphus/), el [corzo](/especie/capreolus_capreolus/) y la
      [marta](/especie/martes_martes/).


      La mejor época para ir es de junio a octubre. La administración ofrece salidas acompañadas para observar
      fauna y aprender a reconocer rastros de animales sobre el terreno.
    visit: >-
      Empieza por el centro de visitantes de Zărnești, en el valle de Bârsa Mare, a un kilómetro del núcleo
      urbano. Su recorrido en circuito explica la flora, la fauna, la geología, la cresta y los canchales, las
      cuevas, las comunidades locales y los senderos. Dentro hay una majada tradicional, una cueva con
      formaciones geológicas y una maqueta 3D del parque donde se proyectan mapas de rutas, hábitats y rocas.
      Las rampas tienen una inclinación del 6 % y el recorrido lleva marcas táctiles y paneles en braille.


      La administración presenta 42 rutas a pie. La más fácil es la de las gargantas de Zărnești, accesible
      para niños y personas con discapacidad. Para la cresta hay muchos senderos exigentes, tanto desde la
      vertiente este como desde la oeste. Si prefieres no ir por tu cuenta, hay excursiones con acompañante,
      visitas a los bosques vírgenes, a los senderos educativos y a los pueblos de montaña de Măgura y Peștera
      y sus majadas tradicionales.


      En la sierra hay refugios para emergencias. El más alto está en la Șaua Grindului, a 2026 m. Se pide
      usarlos solo en caso de necesidad.
    history: >-
      Los primeros en subir fueron cazadores de rebeco y pastores, y de ahí salieron los primeros guías
      locales. El nombre de la cima más alta, Piscul Baciului, procede del pastoreo, una actividad tradicional
      de la zona. A mediados de septiembre de 1872 un grupo de sajones de Brașov escaló el macizo y decidió
      allí arriba, en la cresta, fundar la Sociedad Alpina de Transilvania. Años después, en agosto de 1886,
      Friedrich Deubel bajó la pared oeste.


      Los primeros refugios los levantaron los cazadores de rebeco entre las dos guerras mundiales. En la
      Peștera Liliecilor, en el pueblo de Peștera, se hallaron restos de presencia humana del paleolítico, y
      la cueva de la Dâmbovicioara sirvió, ya en el siglo XVIII, de escondite a los vecinos frente a los
      invasores.


      El macizo se protegió como área natural el 28 de marzo de 1938. Hoy es parque nacional y forma parte de
      la red Natura 2000.
    before: >-
      Elige un itinerario acorde con tus fuerzas, consulta el mapa antes de salir y, si dudas, pide
      información a la administración del parque o al servicio de salvamento de montaña. Quédate en los
      senderos oficiales marcados, no entres en coche, moto o quad en las zonas con acceso motorizado
      prohibido y acampa solo donde esté permitido.


      Hay osos. Para no atraerlos, no guardes comida en la tienda: cuélgala de las ramas a al menos 2 metros
      de altura, separada del tronco. Mira antes de que te vean y atiende a los rastros (piedras volteadas,
      troncos removidos, montículos esparcidos).
    around: >-
      A unos 5 km está el [Parque Nacional Bucegi - Ladera
      Occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/), y a 0 km, pegado al macizo, las
      [Montañas de Leaota](/lugar/muntii-leaota/).
  en:
    intro: >-
      A limestone blade 25 km long planted in the middle of the Carpathians. Piatra Craiului is not a mountain
      of rounded peaks and gentle slopes: it is a continuous crest, the highest and longest limestone ridge in
      Romania, rising between Argeș and Brașov counties with its apex at Piscul Baciului, at 2238 m. The
      national park protecting it brings together the crest, its screes, its gorges, and the forests on its
      lower slopes, with Zărnești serving as the main gateway.
    landscape: >-
      Start at the bottom, where the story of everything lies. In the northeast of the park, the Zărnești
      Gorges (Prăpăstiile Zărneștilor) began forming hundreds of millions of years ago, with soluble limestone
      accelerating their carving. It occurred in four stages: first a surface river; then water sank
      underground to carve a cave; later the roof collapsed, turning the cavern into a narrow defile of
      vertical walls; finally, the stream went subterranean once again. Today it is a dry canyon 3.9 km long,
      bearing witness to Jurassic geological forces. The Dâmbovicioara gorges tell a similar story, and their
      cave, hollowed in Jurassic limestones, contains a 555 m gallery.


      Higher up, scree rules. Scree fields span between 1300 and 2200 m altitude and are largely active: they
      cascade down valleys on both flanks, forming genuine rivers of stone. On the western slope at 1720 m,
      Cerdacul Stanciului represents the massif's grandest karst arch, the remnant of an ancient cave whose
      collapsed ceiling left a central limestone block standing.


      The park's lowest point, at 735 m, sits at the confluence of the Dâmbovicioara and Dâmbovița rivers.
      Between the valley floor and the crest, beech forests give way to relict Scots pine stands on limestone
      and scrub of mountain pine and rhododendron.
    wildlife: >-
      The flower giving fame to the massif is the Piatra Craiului carnation, garofița Piatrei Craiului
      (*Dianthus callizonus*), a strict endemic: it grows on the cliffs and crags of this range and nowhere
      else. It is also the floral emblem of the massif. Accompanying it are edelweiss, lady's slipper
      (*Cypripedium calceolus*), yellow alpine poppy, and other protected plants. The botanical inventory is
      enormous: 1199 species and subspecies, with 181 appearing on Romania's red list as endemic, rare, or
      vulnerable.


      Among mammals, park authorities highlight large carnivores: the [brown bear](/especie/ursus_arctos/),
      [grey wolf](/especie/canis_lupus/), and [Eurasian lynx](/especie/lynx_lynx/). There are 21 bat species,
      112 bird species (the park is recognized as a prime birdwatching ground), and more than 220
      [chamois](/especie/rupicapra_rupicapra/) on the rocky precipices. Forest mammals also include the [red
      deer](/especie/cervus_elaphus/), [roe deer](/especie/capreolus_capreolus/), and [European pine
      marten](/especie/martes_martes/).


      The finest season to visit runs from June to October. The administration organizes guided excursions to
      watch wildlife and interpret animal tracks in the wild.
    visit: >-
      Begin at the Zărnești visitor centre in the Bârsa Mare valley, one kilometre from the town centre. Its
      circuit tour interprets flora, fauna, geology, crest and screes, caves, local communities, and hiking
      trails. Inside, you will find a traditional sheepfold replica, a cave with geological formations, and a
      3D terrain model of the park projecting maps of routes, habitats, and bedrock. Wheelchair ramps have an
      inclination of 6 %, and the interpretive path features tactile markers and braille plaques.


      The administration presents 42 walking routes. The gentlest is through the Zărnești Gorges, fully
      accessible to children and visitors with disabilities. For the ridge, numerous demanding trails ascend
      from both eastern and western slopes. If you prefer guided visits, accompanied excursions, virgin forest
      outings, educational walks, and visits to mountain villages like Măgura and Peștera with their
      traditional sheepfolds are available.


      Emergency shelters are scattered along the ridge. The highest sits at Șaua Grindului, at 2026 m.
      Visitors are requested to use them strictly in emergencies.
    history: >-
      Chamois hunters and shepherds were the first to ascend the ridge, becoming the earliest local guides.
      The highest peak's name, Piscul Baciului, derives from traditional pastoral life. In mid-September 1872,
      a group of Transylvanian Saxons from Brașov scaled the massif and decided on the summit ridge to
      establish the Transylvanian Alpine Society. In August 1886, Friedrich Deubel climbed down the western
      face.


      The earliest mountain shelters were built by chamois hunters between the two world wars. In Peștera
      Liliecilor in the village of Peștera, archaeologists uncovered Paleolithic human traces, and the
      Dâmbovicioara cave sheltered local villagers from invading armies during the eighteenth century.


      The massif gained protection as a natural reserve on 28 March 1938. Today it is a national park and
      forms part of the Natura 2000 network.
    before: >-
      Choose an itinerary matched to your fitness, consult the map before setting out, and if in doubt, seek
      advice from park authorities or mountain rescue. Stay on official marked trails, do not bring cars,
      motorbikes, or quad bikes into areas where motor access is barred, and camp only in permitted sites.


      Bears are present. To avoid attracting them, never store food inside your tent: hang it from tree
      branches at least 2 metres off the ground, well away from the trunk. Stay alert and watch for signs of
      bear activity (overturned stones, scratched logs, torn anthills).
    around: >-
      Around 5 km away lies [Bucegi National Park - Western
      Slopes](/lugar/parcul-national-bucegi---vertientes-occidentales/), and at 0 km, bordering the massif
      directly, are the [Leaota Mountains](/lugar/muntii-leaota/).
  fr:
    intro: >-
      Une lame calcaire de 25 km de long fichée en plein cœur des Carpates. Piatra Craiului n'est pas une
      montagne aux cimes douces et arrondies : c'est une crête continue, la plus haute et la plus longue arête
      calcaire de Roumanie, dressée entre les județe d'Argeș et de Brașov avec son point culminant au Piscul
      Baciului, à 2238 m. Le parc national qui la préserve réunit l'arête, ses éboulis, ses gorges et les
      forêts de piémont, avec Zărnești pour porte principale.
    landscape: >-
      Commencez par le bas, car c'est là que tout s'éclaire. Au nord-est du parc, les gorges de Zărnești (les
      Prăpăstiile Zărneștilor) ont commencé à naître il y a des centaines de millions d'années, le calcaire
      soluble précipitant leur creusement. Cela s'est fait en quatre temps : d'abord une rivière coulant en
      surface ; puis l'eau s'est engouffrée sous terre en ouvrant une cavité ; plus tard le toit s'est
      effondré, transformant la grotte en un défilé rocheux étroit aux parois verticales ; enfin le cours
      d'eau s'est de nouveau perdu sous terre. C'est aujourd'hui un canyon sec de 3,9 km, témoin des forces
      jurassiques. Les gorges de la Dâmbovicioara racontent une genèse similaire, et leur grotte calcaire
      recèle une galerie de 555 m.


      En haut règnent les éboulis. Ils s'étagent entre 1300 et 2200 m d'altitude et sont pour la plupart
      actifs : ils dévalent les vallons des deux versants en véritables fleuves de pierre. Sur le versant
      ouest, à 1720 m, le Cerdacul Stanciului constitue la plus grande arche karstique du massif, vestige
      d'une antique grotte effondrée laissant un pilier calcaire isolé au centre.


      Le point le plus bas du parc, à 735 m, se situe au confluent de la Dâmbovicioara et de la Dâmbovița.
      Entre ce fond de vallée et la crête se succèdent hêtraies, pinèdes relictes de pin sylvestre sur roche
      calcaire et landes de pin mugo et rhododendron.
    wildlife: >-
      La fleur qui fait la renommée du massif est l'œillet de Piatra Craiului, la garofița Piatrei Craiului
      (*Dianthus callizonus*), un endémisme strict : elle ne pousse que sur les falaises de cette chaîne et
      nulle part ailleurs. C'est en outre le symbole végétal du massif. Elle s'accompagne de l'edelweiss, du
      sabot de Vénus (*Cypripedium calceolus*), du pavot jaune alpin et d'autres espèces protégées.
      L'inventaire est colossal : 1199 espèces et sous-espèces, dont 181 inscrites sur la liste rouge roumaine
      comme endémiques, rares ou vulnérables.


      Côté faune, l'administration souligne les grands prédateurs : l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/). On recense 21 espèces de
      chauves-souris, 112 espèces d'oiseaux (le parc est réputé pour l'ornithologie) et plus de 220
      [chamois](/especie/rupicapra_rupicapra/) sur les parois. Les mammifères forestiers comptent également le
      [cerf élaphe](/especie/cervus_elaphus/), le [chevreuil](/especie/capreolus_capreolus/) et la [martre des
      pins](/especie/martes_martes/).


      La meilleure période de visite s'étend de juin à octobre. L'administration organise des sorties guidées
      pour observer la faune et identifier les empreintes sur le terrain.
    visit: >-
      Commencez par le centre d'accueil de Zărnești, dans la vallée de la Bârsa Mare, à un kilomètre du
      centre-ville. Son circuit pédagogique présente la flore, la faune, la géologie, la crête, les éboulis,
      les grottes, les communautés locales et les chemins. On y découvre la maquette d'une bergerie
      traditionnelle, une grotte avec concrétions et un relief en 3D projetant cartes des sentiers, habitats
      et roches. Les rampes présentent une pente de 6 %, avec guidage tactile et panneaux en braille.


      L'administration propose 42 itinéraires de randonnée. Le plus accessible parcourt les gorges de
      Zărnești, praticable pour enfants et personnes à mobilité réduite. Vers la crête grimpent de nombreux
      sentiers engagés, tant par l'est que par l'ouest. Si vous préférez être accompagné, des sorties
      encadrées, des visites de forêts anciennes, des sentiers didactiques et la découverte des villages
      pastoraux de Măgura et Peștera sont proposés.


      Des abris d'urgence jalonnent les hauteurs. Le plus haut se dresse à Șaua Grindului, à 2026 m. Il est
      demandé de ne les occuper qu'en cas de nécessité absolue.
    history: >-
      Les chasseurs de chamois et bergers gravirent les premiers le massif, devenant les premiers guides
      alpins. Le toponyme du plus haut sommet, Piscul Baciului, puise ses racines dans le pastoralisme local.
      À la mi-septembre 1872, un groupe de Saxons de Transylvanie venus de Brașov gravit la montagne et décida
      sur l'arête de créer la Société alpine de Transylvanie. En août 1886, Friedrich Deubel descendit la
      paroi ouest.


      Les premiers abris de chasseurs virent le jour entre les deux guerres mondiales. Dans la Peștera
      Liliecilor au village de Peștera, des fouilles ont attesté une occupation paléolithique, tandis que la
      grotte de Dâmbovicioara servit de cachette aux villageois fuyant les envahisseurs au XVIIIe siècle.


      Le massif a été protégé en réserve naturelle le 28 mars 1938. Il est aujourd'hui parc national et
      intégré au réseau Natura 2000.
    before: >-
      Choisissez un parcours à la mesure de vos forces, consultez la carte avant de partir et sollicitez
      conseil auprès du parc ou du secours en montagne. Ne quittez pas les sentiers balisés officiels, ne
      pénétrez pas en véhicule à moteur dans les zones interdites et campez uniquement là où c'est autorisé.


      Les ours sont bien présents. Pour ne pas les attirer, ne conservez jamais de vivres dans votre tente :
      suspendez-les aux branches à au moins 2 mètres de hauteur, à l'écart du tronc. Soyez attentif aux
      indices récents (pierres retournées, troncs griffés, termitières éventrées).
    around: >-
      À environ 5 km s'étend le [parc naturel de Bucegi - Versant
      occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/), et à 0 km, contigus au massif,
      les [monts Leaota](/lugar/muntii-leaota/).
  de:
    intro: >-
      Eine 25 km lange Kalksteinklinge, die wie eingepflanzt mitten in den Karpaten steht. Piatra Craiului ist
      kein Berg mit runden Kuppen und sanften Hängen: Es ist ein durchgehender Felsgrat, die höchste und
      längste Kalkrippe Rumäniens, die sich zwischen den Kreisen Argeș und Brașov erhebt und am Piscul
      Baciului 2238 m erreicht. Der Nationalpark schützt den Felskamm, seine Schutthalden, seine Schluchten
      und die Wälder an seinen Flanken, mit Zărnești als Haupttor.
    landscape: >-
      Beginne am Fuß der Berge, denn dort liegt der Schlüssel zu allem. Im Nordosten des Parks formten sich
      die Zărnești-Schluchten (Prăpăstiile Zărneștilor) vor hunderten Millionen Jahren, wobei der lösliche
      Kalkstein die Eintiefung beschleunigte. Es geschah in vier Phasen: Zuerst floss ein Fluss an der
      Oberfläche; dann versickerte das Wasser und höhlte eine Höhle aus; später stürzte die Höhlendecke ein
      und hinterließ eine enge Klamm mit senkrechten Felswänden; schließlich verlor sich der Bach erneut im
      Untergrund. Heute ist es ein 3,9 km langes Trockental, das von jurassischen Prozessen zeugt. Die
      Dâmbovicioara-Schlucht erzählt eine ähnliche Geschichte, und ihre Höhle im Jurakalk birgt einen 555 m
      langen Gang.


      Weiter oben herrschen die Schuttreisen. Sie ziehen sich zwischen 1300 und 2200 m Meereshöhe hin und sind
      überwiegend in Bewegung: Sie fließen durch die Kare beider Hänge wie steinerne Ströme zu Tal. An der
      Westflanke auf 1720 m bildet das Cerdacul Stanciului das größte Karsttor des Massivs – der Überrest
      einer urzeitlichen Höhle, deren Einsturz einen Mittelpfeiler stehen ließ.


      Der tiefste Punkt des Parks auf 735 m liegt am Zusammenfluss von Dâmbovicioara und Dâmbovița. Zwischen
      Talboden und Kamm staffeln sich Buchenwälder, Reliktföhrenwälder auf Kalk sowie Krummholz aus Latsche
      und Almrausch.
    wildlife: >-
      Die Berühmtheit des Massivs begründet die Königstein-Nelke, garofița Piatrei Craiului (*Dianthus
      callizonus*), ein strenger Endemit: Sie wächst an den Felsen dieser Bergkette und nirgendwo sonst.
      Zugleich ist sie das floristische Symbol des Massivs. Ihr zur Seite stehen Edelweiß, Frauenschuh
      (*Cypripedium calceolus*), Gelber Alpenmohn und weitere geschützte Arten. Das Inventar ist gewaltig:
      1199 Arten und Unterarten, von denen 181 auf der Roten Liste Rumäniens als endemisch, selten oder
      gefährdet geführt werden.


      Unter den Tieren hebt die Parkverwaltung Großraubtiere hervor: [Braunbär](/especie/ursus_arctos/),
      [Wolf](/especie/canis_lupus/) und [Eurasischer Luchs](/especie/lynx_lynx/). Es gibt 21 Fledermausarten,
      112 Vogelarten (der Park gilt als erstklassiges Vogelbeobachtungsrevier) und über 220
      [Gämsen](/especie/rupicapra_rupicapra/) in den Felswänden. Die Waldsäuger umfassen ferner
      [Rothirsch](/especie/cervus_elaphus/), [Reh](/especie/capreolus_capreolus/) und
      [Baummarder](/especie/martes_martes/).


      Die beste Besuchszeit reicht von Juni bis Oktober. Die Verwaltung bietet geführte Exkursionen zur
      Wildbeobachtung und zum Erkennen von Fährten im Gelände an.
    visit: >-
      Beginne im Besucherzentrum von Zărnești im Bârsa-Mare-Tal, einen Kilometer vom Stadtkern entfernt. Sein
      Rundgang veranschaulicht Flora, Fauna, Geologie, Grat und Schutthalden, Höhlen, Siedlungen und Wege. Im
      Inneren befinden sich eine Alphütte, eine Höhle mit Tropfsteinen und ein 3D-Geländemodell des Parks mit
      Projektionen zu Wegen, Biotopen und Gesteinen. Die Rampen haben 6 % Steigung und der Rundweg bietet
      Blindenleitsysteme und Braille-Tafeln.


      Die Verwaltung stellt 42 Wanderrouten vor. Die leichteste durchquert die Zărnești-Klamm,
      rollstuhlgerecht und für Kinder geeignet. Zum Grat steigen anspruchsvolle Pfade von der Ost- wie von der
      Westseite auf. Wer Begleitung schätzt, kann an geführten Touren, Exkursionen in Urwälder, Lehrpfaden und
      Besuchen der Bergdörfer Măgura und Peștera mit ihren Almen teilnehmen.


      Auf den Kämmen stehen Notunterkünfte bereit. Die höchste liegt am Sattel Șaua Grindului auf 2026 m. Sie
      sollen nur in echten Notfällen genutzt werden.
    history: >-
      Gämsenjäger und Hirten erstiegen das Massiv zuerst und wurden zu den ersten Bergführern. Der Name des
      höchsten Gipfels, Piscul Baciului, wurzelt in der Alpwirtschaft. Mitte September 1872 bestieg eine
      Gruppe Siebenbürger Sachsen aus Kronstadt den Berg und beschloss auf dem Gipfelgrat die Gründung des
      Siebenbürgischen Alpenvereins. Im August 1886 kletterte Friedrich Deubel die Westwand hinab.


      Die ersten Jagdhütten entstanden zwischen den beiden Weltkriegen. In der Höhle Peștera Liliecilor im
      Dorf Peștera wurden altsteinzeitliche Spuren entdeckt, während die Höhle von Dâmbovicioara der
      Dorfbevölkerung im achtzehnten Jahrhundert als Versteck vor Eindringlingen diente.


      Das Massiv wurde am 28. März 1938 unter Schutz gestellt. Heute ist es Nationalpark und Teil des
      Schutzgebietsnetzes Natura 2000.
    before: >-
      Wähle eine deinen Kräften angemessene Route, prüfe die Wanderkarte und frage im Zweifel die Parkwacht
      oder Bergrettung. Bleibe auf den markierten Wegen, befahre gesperrte Pfade nicht mit Kraftfahrzeugen und
      zelte nur an ausgewiesenen Plätzen.


      Bären leben im Gebiet. Um sie nicht anzulocken, lagere keine Vorräte im Zelt: Hänge Nahrungsmittel
      mindestens 2 Meter hoch an Ästen auf, mit Abstand zum Stamm. Achte auf frische Fährten und halte
      Abstand.
    around: >-
      Rund 5 km entfernt liegt der [Naturpark Bucegi -
      Westhänge](/lugar/parcul-national-bucegi---vertientes-occidentales/), und in 0 km Entfernung schließen
      direkt die [Leaota-Berge](/lugar/muntii-leaota/) an.
  it:
    intro: >-
      Una lama di calcare lunga 25 km conficcata nel mezzo dei Carpazi. Piatra Craiului non è un rilievo dalla
      cima tondeggiante e dai pendii dolci: è una cresta ininterrotta, la più alta e la più estesa dorsale
      calcarea della Romania, che si erge tra i distretti di Argeș e Brașov toccando il punto culminante al
      Piscul Baciului, a 2238 m. Il parco nazionale che la tutela abbraccia la cresta, i suoi ghiaioni, le
      gole e le selve pedemontane, con Zărnești come accesso cardine.
    landscape: >-
      Comincia dal basso, poiché lì si svela l'origine di ogni cosa. Nel settore nord-orientale del parco, le
      gole di Zărnești (i Prăpăstiile Zărneștilor) cominciarono a modellarsi centinaia di milioni di anni fa,
      accelerate dall'azione dissolutiva del calcare. Si susseguirono quattro fasi: dapprima un fiume di
      superficie; in seguito l'acqua sprofondò scavando una cavità ipogea; poi la volta collassò trasformando
      la grotta in un forra angusta a pareti verticali; infine il corso d'acqua scomparve nuovamente nel
      sottosuolo. Oggi è una valle secca lunga 3,9 km, testimone delle forze geologiche giurassiche. Le gole
      di Dâmbovicioara mostrano un'evoluzione analoga, e la loro caverna nel calcare giurassico presenta una
      galleria di 555 m.


      Più in alto signeggiano i ghiaioni. Si estendono tra 1300 e 2200 m di quota e risultano in gran parte
      mobili: scendono lungo i canali di entrambi i versanti formando autentici fiumi di pietre. Sul versante
      ovest, a 1720 m, il Cerdacul Stanciului è la maggiore arcata carsica del massiccio, residuo di un'antica
      caverna il cui soffitto crollò lasciando un isolato pilastro calcareo al centro.


      Il punto più depresso del parco, a 735 m, coincide con la confluenza di Dâmbovicioara e Dâmbovița. Tra
      questo fondovalle e la cresta si alternano faggete, pinete rupicole relitte di pino silvestre su calcare
      e boscaglie di pino mugo e rododendro.
    wildlife: >-
      Il fiore simbolo del massiccio è il garofano di Piatra Craiului, la garofița Piatrei Craiului (*Dianthus
      callizonus*), endemismo puntiforme: vegeta sulle rocce di questa catena e in nessun'altra parte del
      globo. Costituisce inoltre l'emblema botanico della montagna. Lo accompagnano la stella alpina, la
      pianella della Madonna (*Cypripedium calceolus*), il papavero giallo alpino e altre entità protette. Il
      catalogo è amplissimo: 1199 specie e sottospecie, di cui 181 iscritte nella lista rossa romena come
      endemiche, rare o vulnerabili.


      Tra i mammiferi, l'ente parco pone l'accento sui predatori: l'[orso bruno](/especie/ursus_arctos/), il
      [lupo grigio](/especie/canis_lupus/) e la [lince](/especie/lynx_lynx/). Si registrano 21 specie di
      pipistrelli, 112 specie di uccelli (il parco è reputato un'area privilegiata per il birdwatching) e
      oltre 220 [camosci](/especie/rupicapra_rupicapra/) sulle pareti rocciose. Tra gli abitanti dei boschi
      compaiono anche il [cervo](/especie/cervus_elaphus/), il [capriolo](/especie/capreolus_capreolus/) e la
      [martora](/especie/martes_martes/).


      Il periodo migliore va da giugno a ottobre. L'amministrazione organizza escursioni con accompagnatori
      per avvistare la fauna e decifrare le tracce sul campo.
    visit: >-
      Inizia dal centro visite di Zărnești, nella valle di Bârsa Mare, a un chilometro dall'abitato. Il
      percorso didattico illustra flora, fauna, geologia, cresta, ghiaioni, cavità carsiche, comunità locali e
      sentieri. All'interno si trovano una malga tradizionale, una grotta allestita e un modello in 3D che
      proietta mappe di percorsi, habitat e rocce. Le rampe hanno una pendenza del 6 % e il tracciato offre
      percorsi tattili e pannelli in braille.


      L'amministrazione propone 42 itinerari a piedi. Il più agevole solca le gole di Zărnești, fruibile da
      famiglie e persone con disabilità. Verso la cresta salgono numerosi sentieri impegnativi, da oriente
      come da occidente. Chi desidera una guida può aderire a visite guidate, uscite nelle foreste vergini,
      sentieri tematici e visite ai villaggi pastorali di Măgura e Peștera con le loro malghe tipiche.


      Lungo la cresta sono dislocati bivacchi di soccorso. Il più elevato si trova a Șaua Grindului, a 2026 m.
      Si raccomanda di occuparli solo in reale stato di emergenza.
    history: >-
      I cacciatori di camosci e i pastori furono i pionieri delle vette, divenendo le prime guide della zona.
      Il nome della vetta massima, Piscul Baciului, affonda nelle consuetudini della pastorizia. A metà
      settembre del 1872 un gruppo di sassoni di Transilvania salì da Brașov e stabilì sulla cresta di
      istituire la Società Alpina di Transilvania. Nell'agosto del 1886 Friedrich Deubel scese lungo la parete
      ovest.


      I primi ricoveri furono eretti dai cacciatori tra le due guerre mondiali. Nella Peștera Liliecilor a
      Peștera gli scavi hanno accertato tracce umane paleolitiche, mentre la grotta di Dâmbovicioara offrì
      riparo agli abitanti durante il XVIII secolo.


      Il massiccio fu protetto quale area naturale il 28 marzo 1938. Oggi è parco nazionale e appartiene alla
      rete Natura 2000.
    before: >-
      Scegli un percorso proporzionato alle tue capacità, consulta la mappa prima di muoverti e chiedi
      delucidazioni ai guardaparco o al soccorso alpino. Resta lungo i tracciati segnati ufficiali, non
      transitare con mezzi a motore dove proibito e bivacca unicamente nei campeggi designati.


      L'orso è presente. Per non attirarlo, non lasciare mai cibo nella tenda: appendilo ai rami ad almeno 2
      metri di altezza, discosto dal tronco. Mantieni l'attenzione e osserva le tracce fresche.
    around: >-
      A circa 5 km si trova il [Parco Naturale Bucegi - Versante
      Occidentale](/lugar/parcul-national-bucegi---vertientes-occidentales/), e a 0 km, a ridosso del
      massiccio, i [Monti di Leaota](/lugar/muntii-leaota/).
  pt:
    intro: >-
      Uma lâmina de calcário com 25 km de comprimento cravada em plenos Cárpatos. Piatra Craiului não é uma
      serra de topos redondos e encostas amenas: é uma crista contínua, a mais alta e mais extensa espinha
      calcária da Roménia, erguida entre os distritos de Argeș e Brașov com vértice em Piscul Baciului, a 2238
      m. O parque nacional que a protege reúne a crista, as cascalheiras, as gargantas e as matas de sopé,
      tendo Zărnești como portal de entrada.
    landscape: >-
      Começa por baixo, onde se desvenda a explicação de todo o relevo. No nordeste do parque, as gargantas de
      Zărnești (Prăpăstiile Zărneștilor) começaram a esculpir-se há centenas de milhões de anos, aceleradas
      pela solubilidade do calcário. O processo deu-se em quatro fases: primeiro um rio fluindo à superfície;
      depois a água afundou-se cavando uma gruta; mais tarde o teto desabou transformando a caverna num canhão
      estreito de paredes verticais; por fim o caudal voltou a sumir-se no subsolo. É hoje um vale seco com
      3,9 km, testemunho das eras jurássicas. As gargantas de Dâmbovicioara narram uma evolução idêntica,
      guardando a sua gruta uma galeria com 555 m.


      Mais acima imperam os canchais. Estendem-se entre os 1300 e os 2200 m de altitude e são em grande parte
      móveis: precipitam-se pelas ravinas de ambas as vertentes como verdadeiros rios de pedra. Na encosta
      poente, a 1720 m, o Cerdacul Stanciului é o maior arco cárstico do maciço, vestígio de uma antiga gruta
      cujo abatimento deixou um pilar de calcário no centro.


      O ponto mais baixo do parque, a 735 m, coincide com a foz da Dâmbovicioara na Dâmbovița. Entre o fundo
      do vale e a crista sucedem-se fagetos, pinhais relíquias de pinheiro-silvestre sobre calcário e matos de
      pinheiro-anão e rododendro.
    wildlife: >-
      A flor emblemática do maciço é o cravo de Piatra Craiului, garofița Piatrei Craiului (*Dianthus
      callizonus*), endemismo estrito: desponta nas escarpas rochosas desta serra e em mais nenhum recanto da
      Terra. É simultaneamente o símbolo botânico da montanha. Convive com a flor-dos-alpes, o
      sapatinho-de-vênus (*Cypripedium calceolus*), a papoila-amarela-alpina e outras espécies protegidas. O
      inventário é monumental: 1199 espécies e subespécies, das quais 181 integram a lista vermelha da Roménia
      como endémicas, raras ou vulneráveis.


      Na fauna, os responsáveis salientam os grandes carnívoros: o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/). Contam-se 21
      espécies de morcegos, 112 espécies de aves (o parque é considerado ideal para a sua observação) e mais
      de 220 [camurças](/especie/rupicapra_rupicapra/) nos rochedos. Entre os mamíferos florestais registam-se
      o [veado-vermelho](/especie/cervus_elaphus/), a [corça](/especie/capreolus_capreolus/) e a [marta do
      pinheiro europeia](/especie/martes_martes/).


      A melhor época decorre de junho a outubro. A administração organiza passeios acompanhados para avistar
      animais e aprender a rastrear pegadas no terreno.
    visit: >-
      Parte do centro de visitantes de Zărnești, no vale de Bârsa Mare, a um quilómetro da malha urbana. O seu
      circuito expositivo aborda flora, fauna, geologia, crista, canchais, grutas, comunidades rurais e
      trilhos. No interior ergue-se uma réplica de curral tradicional, uma gruta didática e uma maquete em 3D
      que projeta mapas de percursos, habitats e rochas. As rampas exibem 6 % de inclinação e o piso inclui
      sinalização tátil e placas em braille.


      A administração disponibiliza 42 trilhos a pé. O mais suave percorre as gargantas de Zărnești, acessível
      a crianças e pessoas com mobilidade reduzida. Rumo à crista sobem veredas árduas, tanto a partir do
      flanco nascente como poente. Quem prefira guias pode optar por excursões acompanhadas, visitas a matas
      virgens, percursos pedagógicos e incursões às aldeias serranas de Măgura e Peștera com as suas pastagens
      tradicionais.


      Na serra encontram-se abrigos de socorro. O mais elevado situa-se na Șaua Grindului, a 2026 m.
      Solicita-se o seu uso unicamente em situações de emergência.
    history: >-
      Caçadores de camurças e pastores foram os primeiros a desbravar o relevo, convertendo-se nos primeiros
      guias locais. A designação do pico maior, Piscul Baciului, deriva da pastorícia serrana. Em meados de
      setembro de 1872 um grupo de saxões da Transilvânia vindos de Brașov subiu o maciço e combinou na crista
      criar a Sociedade Alpina da Transilvânia. Em agosto de 1886 Friedrich Deubel desceu a parede ocidental.


      Os primeiros refúgios foram erguidos por caçadores entre as duas guerras mundiais. Na Peștera
      Liliecilor, na aldeia de Peștera, acharam-se vestígios paleolíticos, ao passo que a gruta de
      Dâmbovicioara acolheu os camponeses perante as invasões no século XVIII.


      O maciço foi consagrado como reserva natural a 28 de março de 1938. Hoje é parque nacional e integra a
      rede Natura 2000.
    before: >-
      Escolhe um percurso ajustado à tua preparação física, estuda o mapa antes de sair e, na dúvida,
      aconselha-te com o parque ou o resgate de montanha. Conserva-te nos trilhos sinalizados oficiais, não
      entres com viaturas a motor onde o trânsito é proibido e pernoita apenas nos locais balizados.


      O urso está presente. Para não o atrair, nunca guardes alimentos na tenda: suspende-os dos ramos a pelo
      menos 2 metros de altura, afastados do tronco. Mantém atenção constante aos rastos no chão.
    around: >-
      A cerca de 5 km fica o [Parque Natural de Bucegi - Vertente
      Ocidental](/lugar/parcul-national-bucegi---vertientes-occidentales/), e a 0 km, encostadas ao maciço, as
      [Montanhas de Leaota](/lugar/muntii-leaota/).
