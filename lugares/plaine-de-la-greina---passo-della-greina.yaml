observaciones:
  es: >-
    Con tiempo incierto no se debe empezar la ruta: el tiempo cambia a menudo en la montaña y, si se acerca un
    frente de lluvia, hay que dar la vuelta a tiempo. Se recomienda calzado con buen perfil, ropa para la
    lluvia, botiquín, bebida, comida y, quizá, bastones. El distrito protegido de Greina está sujeto a
    protección integral.
texto:
  es:
    intro: >-
      Un río serpentea sin prisa por una llanura a más de 2000 m donde no hay un solo árbol, una casa ni una
      carretera. La Greina es una meseta de unos seis kilómetros de largo y uno de ancho, a 2200 m, en la
      frontera entre los Grisones y el Tesino, y lo que la hace célebre es lo que no tiene: carreteras ni
      teleféricos, de modo que cruzarla requiere normalmente una excursión de dos o más días. Casi se la tragó
      un embalse. Hoy es un lugar clave del conservacionismo suizo.
    landscape: >-
      La meseta no es un llano perfecto: parece más bien un paisaje de colinas, terrazas y costillas rocosas a
      ambos lados del río. El Rein da Sumvitg la recorre en meandros, y el paisaje se compara a veces con las
      tundras nórdicas, porque los árboles de los valles no han podido llegar hasta aquí. Alrededor se agrupan
      once tresmiles, y por la cresta alpina del paisaje protegido pasa un tramo de la divisoria europea de
      aguas.


      La Greina es una llave de la geología alpina. La erosión deja a la vista pliegues y cabalgamientos con
      los que reconstruir las transformaciones de los minerales y la formación de los Alpes. Desde el noroeste
      desciende el macizo cristalino del manto del Gotardo, de gneis, y desde el sur choca con él el manto de
      la Adula, con sedimentos penínicos y esquistos grisones. Al oeste, bancos verticales de dolomía clara,
      mármol y rauwacke dominan el fondo del valle.


      El hielo hizo el resto. En el máximo glaciar la superficie del hielo estaba a unos 2900 m, más de 600 m
      sobre la llanura. El bloque errático de gneis ocular Crap la Crusch lo trajo el glaciar desde la zona
      del Gotardo, y en el espacio protegido hay un gran dique morrénico de un glaciar tardío de hace unos
      8000 años. Los últimos restos de glaciar son el Glatscher dalla Greina, el Glatscher da Gaglianera y el
      Glatscher dil Terri, que alimentan con agua de fusión la llanura. Cerca del paso hay un arco natural de
      roca caliza de unos cuarenta metros, muy admirado. Y a 2585 m, bajo el Piz Terri, está el Laghet la
      Greina, el único lago grande de montaña.
    wildlife: >-
      En el verano breve, la flora es muy variada. En los suelos jóvenes de la llanura crece el junco bicolor,
      un raro relicto, y en los pastos alpinos hay anémona sulfúrea, ranúnculo de montaña, soldanela alpina,
      genciana de las nieves y miosotis alpino, entre otras. El poeta del Tesino Plinio Grossi describió la
      meseta como «museo geológico» y «jardín botánico».


      La fauna es discreta. En el paisaje abierto y sin árboles encuentran buen hogar la
      [marmota](/especie/marmota_marmota/) y la víbora común, esta amenazada. Entre los mamíferos de la
      reserva federal figuran el [rebeco](/especie/rupicapra_rupicapra/) y el [íbice](/especie/capra_ibex/), y
      se prevé regular el segundo para reducir daños y competencia con el primero. Otro objetivo de
      conservación es mantener la variedad de poblaciones de tetraónidos.
    visit: >-
      Se llega a la meseta desde tres valles, unidos por senderos: el Val Lumnezia, el Val Sumvitg y el valle
      de Blenio. Lo mejor es subir por uno y bajar por otro. El Bus alpin sale de Vrin hacia Puzzatsch y de
      Rabius hacia Runcahez, y en el lado tesinés una línea va de Olivone a Pian Geirett y al Lago di Luzzone.


      La ruta clásica son dos jornadas. La primera sale de Vrin/Puzzatsch, sube al paso Diesrut, a 2428 m, la
      «puerta de la Greina», con una pendiente constante y unas dos horas y media desde Puzzatsch, y cruza la
      meseta. Poco después del paso, al bajar a la llanura, cruzas el puente colgante Punt la Greina, de 65 m
      de largo y 40 m de alto, sobre el Rein da Sumvitg. La segunda va desde el Terrihütte por Crest la Greina
      hasta Runcahez; el descenso es en parte más exigente y hay cadenas en los tramos rocosos. Quienes estén
      muy en forma pueden hacer la ruta en un solo día. El perfil publicado de la travesía llega a 2430 m en
      su punto más alto y baja hasta 1280 m en el más bajo. El acceso público combina el autobús postal
      Ilanz–Vrin y el Bus alpin hasta Puzzatsch.


      Desde el lado tesinés, el sendero empieza al final de una carretera, a unos 2000 m; un autobús postal
      lleva a los excursionistas hasta esa cota.
    history: >-
      La Greina estuvo varias veces amenazada en el siglo XX por proyectos de centrales. El proyecto preveía
      un embalse sobre la meseta, con su llanura aluvial, y una central hidroeléctrica en el valle de Blenio.


      Entre las organizaciones que lucharon por salvarla está la Fundación Suiza de la Greina para la
      conservación de las aguas alpinas, creada el 15 de agosto de 1986. Al final, la industria energética
      aparcó el embalse por razones económicas, el paisaje entró en el inventario federal en 1996 y desde 1997
      los municipios reciben compensaciones por renunciar a la central. Desde 2004 la zona es coto federal de
      caza protegido, «Pez Vial/Greina». Hoy el pastoreo de vacas ha causado daños por pisoteo en las turberas
      bajas, sobre todo en la mitad suroeste de la llanura aluvial.
    before: >-
      Con tiempo incierto no se debe empezar la ruta: el tiempo cambia a menudo en la montaña y, si se acerca
      un frente de lluvia, hay que dar la vuelta a tiempo. Se recomienda calzado con buen perfil, ropa para la
      lluvia, botiquín, bebida, comida y, quizá, bastones. El distrito protegido de Greina está sujeto a
      protección integral.
    around: >-
      No hay otros lugares del atlas cerca. A mucha distancia, el [Curso Alto del Valle de
      Lötschental](/lugar/lotschen-tal-upper-valley/), el [Parque Natural Regional del
      Queyras](/lugar/parc-naturel-regional-du-queyras/), el [Parque Nacional de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) y el [Parque Nacional Montañas de
      Rodna](/lugar/parcul-national-muntii-rodnei/) comparten con la Greina la marmota y el rebeco, y la alta
      montaña.
  en:
    intro: >-
      A river meanders unhurriedly across a plain above 2000 m where there is not a single tree, house, or
      road. The Greina is a plateau about six kilometres long and one wide, at 2200 m, on the border between
      Grisons and Ticino, and what makes it famous is what it lacks: neither roads nor cable cars, so crossing
      it typically requires an excursion of two or more days. A reservoir nearly swallowed it. Today it is a
      milestone of Swiss conservation.
    landscape: >-
      The plateau is not a perfect flat: it appears rather as a landscape of hills, terraces, and rocky ribs
      on either side of the river. The Rein da Sumvitg meanders across it, and the scenery is sometimes
      compared to northern tundras, because trees from the valleys have been unable to reach here. Eleven
      three-thousanders surround it, and a section of the European watershed passes along the alpine crest of
      the protected area.


      The Greina is a key to Alpine geology. Erosion exposes folds and overthrusts through which the
      transformation of minerals and the formation of the Alps can be reconstructed. From the northwest
      descends the crystalline Gotthard massif nappe, made of gneiss, and from the south the Adula nappe
      collides with it, carrying Penninic sediments and Grisons schists. To the west, vertical beds of light
      dolomite, marble, and rauwacke dominate the valley floor.


      Ice did the rest. During the glacial maximum, the ice surface stood at around 2900 m, more than 600 m
      above the plain. The erratic block of augen gneiss, Crap la Crusch, was carried by the glacier from the
      Gotthard area, and within the protected territory lies a massive morainic wall left by a late glacier
      some 8000 years ago. The last remnants of glaciers are the Glatscher dalla Greina, the Glatscher da
      Gaglianera, and the Glatscher dil Terri, which nourish the plain with meltwater. Near the pass, a
      natural limestone rock arch of about forty metres is widely admired. And at 2585 m, beneath Piz Terri,
      lies Laghet la Greina, the only large mountain lake.
    wildlife: >-
      In the brief summer, the flora is remarkably diverse. In the youthful soils of the plain grows the
      two-coloured rush, a rare relict, and in the alpine pastures there are sulphur anemone, mountain
      buttercup, alpine snowbell, snow gentian, and alpine forget-me-not, among others. Ticino poet Plinio
      Grossi described the plateau as a 'geological museum' and 'botanical garden'.


      The wildlife is discreet. In the open, treeless landscape, the [Alpine
      marmot](/especie/marmota_marmota/) and the common adder, which is endangered here, find good habitat.
      Mammals of the federal reserve include the [chamois](/especie/rupicapra_rupicapra/) and the [Alpine
      ibex](/especie/capra_ibex/), and management plans foresee regulating the latter to reduce grazing impact
      and competition with the former. Another conservation goal is preserving the diversity of grouse
      populations.
    visit: >-
      The plateau is reached from three valleys connected by trails: Val Lumnezia, Val Sumvitg, and the Blenio
      Valley. It is best to ascend via one and descend by another. The Bus alpin runs from Vrin to Puzzatsch
      and from Rabius to Runcahez, while on the Ticino side a line operates from Olivone to Pian Geirett and
      Lago di Luzzone.


      The classic crossing takes two days. The first stage sets off from Vrin/Puzzatsch, ascends to the
      Diesrut Pass at 2428 m, the 'gateway to the Greina', with a steady climb taking about two and a half
      hours from Puzzatsch, and traverses the plateau. Shortly after the pass, descending onto the plain, you
      cross the Punt la Greina suspension bridge, 65 m long and 40 m high above the Rein da Sumvitg. The
      second stage leads from Terrihütte across Crest la Greina down to Runcahez; the descent is partly more
      demanding, with chains on rocky sections. Those in top physical condition can complete the crossing in a
      single day. The published trail profile peaks at 2430 m at its highest point and drops to 1280 m at its
      lowest. Public transport combines the postbus Ilanz–Vrin and the Bus alpin up to Puzzatsch.


      From the Ticino side, the trail starts at the end of a road at about 2000 m; a postbus carries hikers up
      to that elevation.
    history: >-
      The Greina was repeatedly threatened in the twentieth century by power plant projects. The scheme
      planned a reservoir across the plateau, submerging its alluvial plain, and a hydroelectric station in
      the Blenio Valley.


      Among the organisations that campaigned to preserve it was the Swiss Greina Foundation for the
      Protection of Alpine Waters, established on 15 August 1986. Ultimately, the power industry shelved the
      reservoir for economic reasons, the landscape entered the federal inventory in 1996, and since 1997 the
      municipalities have received compensation for relinquishing the power plant. Since 2004 the area has
      been designated a federal game reserve, 'Pez Vial/Greina'. Today, cattle grazing has caused trampling
      damage to the low bogs, particularly across the southwestern half of the alluvial plain.
    before: >-
      With uncertain weather you should not start the route: mountain weather changes rapidly, and if a rain
      front approaches, you must turn back in good time. Sturdy footwear with a deep tread, waterproof
      clothing, a first-aid kit, water, food, and perhaps walking poles are recommended. The Greina protected
      district is subject to strict integral protection.
    around: >-
      There are no other atlas sites nearby. At a great distance, the [Upper
      Lötschental](/lugar/lotschen-tal-upper-valley/), the [Queyras Regional Natural
      Park](/lugar/parc-naturel-regional-du-queyras/), the [Vanoise National
      Park](/lugar/parc-national-de-la-vanoise/), and the [Rodna Mountains National
      Park](/lugar/parcul-national-muntii-rodnei/) share with the Greina the chamois, the Alpine marmot, and
      the high-alpine character.
  fr:
    intro: >-
      Une rivière serpente sans hâte à travers une plaine à plus de 2000 m où l'on ne trouve ni arbre, ni
      maison, ni route. La Greina est un plateau d'environ six kilomètres de long et un de large, à 2200 m, à
      la frontière entre les Grisons et le Tessin, et ce qui fait sa renommée est précisément ce qui lui
      manque : aucune route ni téléphérique, de sorte que sa traversée exige généralement une randonnée de
      deux jours ou plus. Un barrage a failli l'engloutir. C'est aujourd'hui un haut lieu de la protection de
      la nature en Suisse.
    landscape: >-
      Le plateau n'est pas une plaine parfaite : il ressemble plutôt à un paysage de collines, de terrasses et
      d'arêtes rocheuses de part et d'autre de la rivière. Le Rein da Sumvitg y serpente en méandres, et le
      décor est parfois comparé aux toundras nordiques, car les arbres des vallées n'ont jamais pu grimper
      jusqu'ici. Onze sommets de plus de trois mille mètres l'entourent, et une section de la ligne de partage
      des eaux européenne court le long de la crête alpine de l'espace protégé.


      La Greina est une clé de voûte de la géologie alpine. L'érosion y laisse à nu des plis et des
      chevauchements permettant de reconstituer les transformations minérales et la formation des Alpes.
      Depuis le nord-ouest descend le massif cristallin de la nappe du Saint-Gothard, composé de gneiss,
      contre lequel vient buter depuis le sud la nappe de l'Adula, chargée de sédiments penniques et de
      schistes grisons. À l'ouest, des bancs verticaux de dolomie claire, de marbre et de cargneule dominent
      le fond de la vallée.


      La glace s'est chargée du reste. Au paroxysme glaciaire, la surface de la glace atteignait environ 2900
      m, soit plus de 600 m au-dessus de la plaine. Le bloc erratique de gneiss œillé Crap la Crusch a été
      transporté par le glacier depuis le massif du Saint-Gothard, et l'espace protégé abrite une imposante
      digue morainique laissée par un glacier tardif il y a environ 8000 ans. Les derniers vestiges glaciaires
      sont le Glatscher dalla Greina, le Glatscher da Gaglianera et le Glatscher dil Terri, qui alimentent la
      plaine en eau de fonte. Près du col, une arche naturelle de calcaire d'une quarantaine de mètres suscite
      l'admiration. Et à 2585 m, sous le Piz Terri, s'étend le Laghet la Greina, l'unique grand lac de
      montagne.
    wildlife: >-
      Durant le court été, la flore s'avère particulièrement variée. Sur les sols jeunes de la plaine pousse
      le jonc bicolore, un vestige rare, tandis que les pâturages alpins abritent l'anémone soufrée, la
      renoncule des montagnes, la soldanelle des Alpes, la gentiane des neiges et le myosotis des Alpes, entre
      autres. Le poète tessinois Plinio Grossi a qualifié ce plateau de « musée géologique » et de « jardin
      botanique ».


      La faune reste discrète. Dans ce paysage ouvert et dépourvu d'arbres, la [marmotte des
      Alpes](/especie/marmota_marmota/) et la vipère péliade, ici menacée, trouvent un habitat propice. Parmi
      les mammifères de la réserve fédérale figurent le [chamois](/especie/rupicapra_rupicapra/) et le
      [bouquetin des Alpes](/especie/capra_ibex/), ce dernier faisant l'objet de régulations prévues pour
      limiter la pression de pâturage et la concurrence avec le premier. Un autre objectif de conservation
      consiste à maintenir la diversité des populations de tétraonidés.
    visit: >-
      On accède au plateau depuis trois vallées reliées par des sentiers : le Val Lumnezia, le Val Sumvitg et
      la vallée de Blenio. Le mieux est de monter par l'une et de redescendre par une autre. Le Bus alpin part
      de Vrin vers Puzzatsch et de Rabius vers Runcahez, tandis que du côté tessinois une ligne relie Olivone
      à Pian Geirett et au Lago di Luzzone.


      L'itinéraire classique se déroule en deux étapes. La première part de Vrin/Puzzatsch, monte au col de
      Diesrut à 2428 m, la « porte de la Greina », avec une pente régulière et environ deux heures et demie de
      marche depuis Puzzatsch, puis traverse le plateau. Peu après le col, en descendant sur la plaine, vous
      franchissez la passerelle suspendue Punt la Greina, longue de 65 m et haute de 40 m au-dessus du Rein da
      Sumvitg. La seconde étape mène de la Terrihütte par la Crest la Greina jusqu'à Runcahez ; la descente
      est en partie plus technique, avec des mains courantes sur les passages rocheux. Les marcheurs très
      affûtés peuvent réaliser l'itinéraire en une seule journée. Le profil publié de la traversée culmine à
      2430 m à son point le plus haut et descend jusqu'à 1280 m au plus bas. L'accès en transports publics
      combine le car postal Ilanz–Vrin et le Bus alpin jusqu'à Puzzatsch.


      Depuis le versant tessinois, le sentier commence au bout d'une route, à environ 2000 m ; un car postal y
      dépose les randonneurs.
    history: >-
      La Greina fut menacée à plusieurs reprises au cours du XXe siècle par des projets de centrales
      hydroélectriques. Le projet prévoyait une retenue d'eau sur le plateau, inondant sa plaine alluviale, et
      une centrale dans la vallée de Blenio.


      Parmi les organisations qui se sont battues pour la sauver figure la Fondation suisse de la Greina pour
      la protection des cours d'eau alpins, créée le 15 août 1986. Finalement, les milieux énergétiques ont
      renoncé au barrage pour des raisons financières, le paysage a été inscrit à l'inventaire fédéral en 1996
      et, depuis 1997, les communes perçoivent des indemnités pour avoir abandonné l'usine hydroélectrique.
      Depuis 2004, le secteur constitue le district franc fédéral protégé « Pez Vial/Greina ». Aujourd'hui, le
      pâturage bovin a entraîné des dégradations par piétinement dans les bas-marais, en particulier sur la
      moitié sud-ouest de la plaine alluviale.
    before: >-
      Par temps incertain, il ne faut pas s'engager sur l'itinéraire : les conditions changent vite en
      montagne et, si un front pluvieux approche, il faut faire demi-tour à temps. Des chaussures à profil
      adhérent, des vêtements de pluie, une trousse de secours, de l'eau, des vivres et éventuellement des
      bâtons sont recommandés. Le district protégé de la Greina fait l'objet d'une protection intégrale.
    around: >-
      Il n'y a pas d'autres sites de l'atlas à proximité. Bien plus loin, la [Vallée du
      Haut-Lötschental](/lugar/lotschen-tal-upper-valley/), le [Parc naturel régional du
      Queyras](/lugar/parc-naturel-regional-du-queyras/), le [Parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) et le [Parc national des monts
      Rodna](/lugar/parcul-national-muntii-rodnei/) partagent avec la Greina la marmotte des Alpes, le chamois
      et la haute montagne.
  de:
    intro: >-
      Gemächlich mäandert ein Fluss über eine Ebene auf über 2000 m, wo es weder einen einzigen Baum noch ein
      Haus oder eine Straße gibt. Die Greina ist eine Hochebene von etwa sechs Kilometern Länge und einem
      Kilometer Breite auf 2200 m an der Grenze zwischen Graubünden und dem Tessin, und berühmt ist sie für
      das, was es hier nicht gibt: weder Straßen noch Seilbahnen, sodass ihre Überquerung gewöhnlich eine Tour
      von zwei oder mehr Tagen erfordert. Beinahe hätte ein Stausee sie verschluckt. Heute ist sie ein
      Meilenstein des Schweizer Naturschutzes.
    landscape: >-
      Die Hochebene ist keine vollkommene Ebene: Sie gleicht eher einer Landschaft aus Hügeln, Terrassen und
      Felsrippen zu beiden Seiten des Flusses. Der Rein da Sumvitg durchzieht sie in Mäandern, und das
      Landschaftsbild wird zuweilen mit nordischen Tundren verglichen, da die Bäume der Täler es nicht bis
      hierher geschafft haben. Ringsum gruppieren sich elf Dreitausender, und über den Alpenkamm des
      Schutzgebiets verläuft ein Abschnitt der europäischen Hauptwasserscheide.


      Die Greina ist ein Schlüssel zur alpinen Geologie. Die Erosion legt Falten und Überschiebungen frei, an
      denen sich die Umwandlung von Mineralien und die Entstehung der Alpen rekonstruieren lassen. Von
      Nordwesten senkt sich das kristalline Massiv der Gotthard-Decke aus Gneis herab, und von Süden prallt
      die Adula-Decke mit penninischen Sedimenten und Bündnerschiefer darauf. Im Westen prägen senkrechte
      Bänke aus hellem Dolomit, Marmor und Rauwacke den Talboden.


      Das Eis tat sein Übriges. Im Hochglazial lag die Eisoberfläche bei rund 2900 m, mehr als 600 m über der
      Ebene. Den Augengneis-Findling Crap la Crusch trug der Gletscher aus dem Gotthardgebiet heran, und im
      Schutzgebiet zeugt ein mächtiger Moränenwall von einem Spätglazial-Gletscher vor rund 8000 Jahren. Die
      letzten Reste der Gletscher sind der Glatscher dalla Greina, der Glatscher da Gaglianera und der
      Glatscher dil Terri, die die Ebene mit Schmelzwasser speisen. Nahe dem Pass zieht ein rund vierzig Meter
      breiter natürlicher Felsbogen aus Kalkstein die Blicke auf sich. Und auf 2585 m, unterhalb des Piz
      Terri, liegt der Laghet la Greina, der einzige große Bergsee.
    wildlife: >-
      Im kurzen Sommer zeigt sich die Flora überaus vielfältig. Auf den jungen Böden der Ebene wächst die
      Zweifarbige Binse, ein seltenes Relikt, und auf den alpinen Rasen gedeihen unter anderem
      Schwefel-Anemone, Berg-Hahnenfuß, Alpenglöckchen, Schnee-Enzian und Alpen-Vergissmeinnicht. Der Tessiner
      Dichter Plinio Grossi beschrieb die Hochebene als «geologisches Museum» und «botanischen Garten».


      Die Tierwelt ist unaufdringlich. In der offenen, baumlosen Landschaft finden das
      [Alpenmurmeltier](/especie/marmota_marmota/) und die Kreuzotter, die hier bedroht ist, einen passenden
      Lebensraum. Zu den Säugetieren des Eidgenössischen Jagdbanngebiets zählen die
      [Gämse](/especie/rupicapra_rupicapra/) und der [Alpensteinbock](/especie/capra_ibex/), wobei für
      Letzteren eine Bestandsregulierung vorgesehen ist, um Weideschäden und Konkurrenz mit der Gämse zu
      mindern. Ein weiteres Schutzziel ist der Erhalt der Raufußhuhn-Bestände.
    visit: >-
      Die Hochebene wird von drei Tälern aus erreicht, die durch Wanderwege verbunden sind: dem Val Lumnezia,
      dem Val Sumvitg und dem Bleniotal. Am lohnendsten ist es, über ein Tal aufzusteigen und über ein anderes
      abzusteigen. Der Bus alpin fährt von Vrin nach Puzzatsch und von Rabius nach Runcahez, während auf der
      Tessiner Seite eine Linie von Olivone nach Pian Geirett und zum Lago di Luzzone verkehrt.


      Die klassische Route umfasst zwei Tagesetappen. Die erste beginnt in Vrin/Puzzatsch, steigt zum
      Diesrutpass auf 2428 m an, dem «Tor zur Greina», bei stetiger Steigung und etwa zweieinhalb Stunden
      Gehzeit ab Puzzatsch, und quert das Plateau. Kurz nach dem Pass, beim Abstieg in die Ebene, überquerst
      du die Hängebrücke Punt la Greina, 65 m lang und 40 m hoch über dem Rein da Sumvitg. Die zweite Etappe
      führt von der Terrihütte über den Crest la Greina hinab nach Runcahez; der Abstieg ist teils
      anspruchsvoller und an Felspassagen mit Ketten gesichert. Wer sehr gut in Form ist, kann die Tour an
      einem einzigen Tag bewältigen. Das veröffentlichte Höhenprofil der Traversierung erreicht 2430 m am
      höchsten Punkt und fällt am tiefsten bis auf 1280 m ab. Die Anreise mit öffentlichen Verkehrsmitteln
      kombiniert das Postauto Ilanz–Vrin und den Bus alpin hinauf nach Puzzatsch.


      Von der Tessiner Seite beginnt der Pfad am Ende einer Straße auf rund 2000 m; ein Postauto bringt
      Wanderer bis auf diese Höhe.
    history: >-
      Die Greina war im zwanzigsten Jahrhundert mehrfach durch Kraftwerksprojekte bedroht. Die Vorhaben sahen
      einen Stausee auf der Hochebene vor, der die Schwemmebene überflutet hätte, sowie ein Wasserkraftwerk im
      Bleniotal.


      Zu den Organisationen, die für ihre Rettung stritten, gehörte die am 15. August 1986 gegründete
      Schweizerische Greina-Stiftung zur Erhaltung der alpinen Fliessgewässer. Letztlich ließ die
      Energiewirtschaft das Staudammprojekt aus wirtschaftlichen Gründen fallen, die Landschaft wurde 1996 in
      das Bundesinventar aufgenommen und seit 1997 erhalten die Gemeinden Ausgleichszahlungen für den Verzicht
      auf das Kraftwerk. Seit 2004 ist das Gebiet als Eidgenössisches Jagdbanngebiet «Pez Vial/Greina»
      geschützt. Gegenwärtig hat die Rinderbeweidung zu Trittschäden in den Flachmooren geführt, vor allem in
      der südwestlichen Hälfte der Schwemmebene.
    before: >-
      Bei unsicherem Wetter solltest du die Tour nicht antreten: In den Bergen schlägt das Wetter oft rasch
      um, und nähert sich eine Regenfront, muss rechtzeitig umgekehrt werden. Festes Schuhwerk mit gutem
      Profil, Regenbekleidung, Erste-Hilfe-Set, Getränke, Verpflegung und eventuell Wanderstöcke werden
      empfohlen. Das Schutzgebiet der Greina unterliegt vollständigem Schutz.
    around: >-
      In der näheren Umgebung gibt es keine weiteren Atlas-Orte. In weiter Ferne teilen das [Oberes
      Lötschental](/lugar/lotschen-tal-upper-valley/), der [Regionaler Naturpark
      Queyras](/lugar/parc-naturel-regional-du-queyras/), der
      [Vanoise-Nationalpark](/lugar/parc-national-de-la-vanoise/) und der
      [Rodna-Gebirge-Nationalpark](/lugar/parcul-national-muntii-rodnei/) mit der Greina das Alpenmurmeltier,
      die Gämse und die Hochgebirgslandschaft.
  it:
    intro: >-
      Un fiume serpeggia senza fretta attraverso una pianura a oltre 2000 m dove non c'è un solo albero, una
      casa né una strada. La Greina è un altopiano lungo circa sei chilometri e largo uno, a 2200 m, al
      confine tra i Grigioni e il Ticino, e ciò che lo rende celebre è ciò che non possiede: né strade né
      funivie, cosicché attraversarlo richiede normalmente un'escursione di due o più giorni. Un bacino idrico
      stava quasi per inghiottirlo. Oggi è un luogo cardine del conservazionismo svizzero.
    landscape: >-
      L'altopiano non è una pianura perfetta: assomiglia piuttosto a un paesaggio di colline, terrazze e
      costoni rocciosi su entrambi i lati del fiume. Il Rein da Sumvitg lo percorre serpeggiando, e lo
      scenario viene talvolta paragonato alle tundre nordiche, poiché gli alberi delle valli non sono riusciti
      a spingersi fin quassù. Tutt'intorno si raggruppano undici tremila, e lungo la cresta alpina dell'area
      protetta corre un tratto dello spartiacque europeo.


      La Greina è una chiave di volta della geologia alpina. L'erosione mette a nudo pieghe e accavallamenti
      con cui ricostruire le trasformazioni dei minerali e la formazione delle Alpi. Da nord-ovest scende il
      massiccio cristallino della falda del San Gottardo, formato da gneiss, e da sud vi si scontra la falda
      dell'Adula, con sedimenti pennidici e scisti grigionesi. A ovest, banchi verticali di dolomia chiara,
      marmo e corniole dominano il fondovalle.


      Il ghiaccio ha fatto il resto. Durante il massimo glaciale la superficie del ghiaccio si trovava a circa
      2900 m, più di 600 m sopra la piana. Il masso erratico di gneiss occhiadino Crap la Crusch fu
      trasportato dal ghiacciaio dall'area del San Gottardo, e nell'area protetta si trova un grande argine
      morenico di un ghiacciaio tardivo di circa 8000 anni fa. Gli ultimi residui glaciali sono il Glatscher
      dalla Greina, il Glatscher da Gaglianera e il Glatscher dil Terri, che alimentano la pianura con acque
      di disgelo. Vicino al passo un arco naturale di roccia calcarea di circa quaranta metri desta grande
      ammirazione. E a 2585 m, sotto il Piz Terri, si trova il Laghet la Greina, l'unico grande lago montano.
    wildlife: >-
      Nella breve estate la flora è straordinariamente varia. Nei suoli giovani della piana cresce il giunco
      bicolore, un raro relitto, e nei pascoli alpini fioriscono anemone sulfureo, ranuncolo montano,
      soldanella alpina, genziana delle nevi e nontiscordardimé alpino, tra gli altri. Il poeta ticinese
      Plinio Grossi descrisse l'altopiano come un «museo geologico» e un «giardino botanico».


      La fauna è discreta. Nel paesaggio aperto e privo di alberi trovano un ottimo habitat la [marmotta
      alpina](/especie/marmota_marmota/) e il marasso, qui minacciato. Tra i mammiferi della riserva federale
      figurano il [camoscio alpino](/especie/rupicapra_rupicapra/) e lo [stambecco delle
      Alpi](/especie/capra_ibex/), ed è previsto un controllo del secondo per ridurre i danni da pascolo e la
      concorrenza con il primo. Un altro obiettivo di conservazione è preservare la varietà delle popolazioni
      di tetraonidi.
    visit: >-
      Si accede all'altopiano da tre valli collegate da sentieri: la Val Lumnezia, la Val Sumvitg e la valle
      di Blenio. La soluzione migliore è salire da una e scendere dall'altra. Il Bus alpin parte da Vrin per
      Puzzatsch e da Rabius per Runcahez, mentre sul versante ticinese una linea collega Olivone a Pian
      Geirett e al Lago di Luzzone.


      L'itinerario classico si compie in due tappe. La prima parte da Vrin/Puzzatsch, sale al passo Diesrut a
      2428 m, la «porta della Greina», con pendenza costante e circa due ore e mezza da Puzzatsch, e
      attraversa l'altopiano. Poco dopo il passo, scendendo nella piana, attraversi il ponte sospeso Punt la
      Greina, lungo 65 m e alto 40 m sopra il Rein da Sumvitg. La seconda tappa va dalla Terrihütte attraverso
      la Crest la Greina fino a Runcahez; la discesa è in parte più impegnativa e presenta catene nei tratti
      rocciosi. Chi è molto allenato può compiere l'itinerario in un solo giorno. Il profilo altimetrico
      pubblicato della traversata tocca i 2430 m nel punto più alto e scende fino a 1280 m in quello più
      basso. L'accesso coi mezzi pubblici combina l'autopostale Ilanz–Vrin e il Bus alpin fino a Puzzatsch.


      Dal versante ticinese il sentiero inizia al termine di una strada a circa 2000 m; un autopostale porta
      gli escursionisti fino a quella quota.
    history: >-
      La Greina fu più volte minacciata nel corso del XX secolo da progetti di centrali idroelettriche. Il
      progetto prevedeva un bacino artificiale sull'altopiano, sommergendo la sua piana alluvionale, e una
      centrale nella valle di Blenio.


      Tra le organizzazioni che si batterono per salvarla spicca la Fondazione Svizzera della Greina per la
      protezione delle acque alpine, istituita il 15 agosto 1986. Alla fine l'industria energetica accantonò
      l'invaso per ragioni economiche, il paesaggio entrò nell'inventario federale nel 1996 e dal 1997 i
      comuni ricevono indennizzi per aver rinunciato all'impianto. Dal 2004 la zona è riserva federale di
      caccia protetta, «Pez Vial/Greina». Oggi il pascolo bovino ha provocato danni da calpestio nelle
      torbiere basse, soprattutto nella metà sud-occidentale della piana alluvionale.
    before: >-
      In caso di tempo incerto non si deve intraprendere l'itinerario: in montagna il meteo cambia spesso
      repentinamente e, se si avvicina un fronte temporalesco, occorre fare marcia indietro per tempo. Si
      raccomandano calzature con buona scolpitura, abbigliamento antipioggia, kit di primo soccorso, bevande,
      cibo e all'occorrenza bastoncini da trekking. Il distretto protetto della Greina è soggetto a tutela
      integrale.
    around: >-
      Non ci sono altri luoghi dell'atlante nelle vicinanze. A grande distanza, l'[Alta Valle di
      Lötschental](/lugar/lotschen-tal-upper-valley/), il [Parco naturale regionale del
      Queyras](/lugar/parc-naturel-regional-du-queyras/), il [Parco nazionale della
      Vanoise](/lugar/parc-national-de-la-vanoise/) e il [Parco nazionale dei Monti
      Rodna](/lugar/parcul-national-muntii-rodnei/) condividono con la Greina la marmotta alpina, il camoscio
      alpino e l'alta quota.
  pt:
    intro: >-
      Um rio serpenteia sem pressa por uma planície a mais de 2000 m onde não há uma única árvore, uma casa
      nem uma estrada. A Greina é um planalto com cerca de seis quilómetros de comprimento e um de largura, a
      2200 m, na fronteira entre os Grisões e o Ticino, e o que o torna célebre é o que não tem: nem estradas
      nem teleféricos, pelo que atravessá-lo exige normalmente uma caminhada de dois ou mais dias. Quase foi
      engolido por uma albufeira. Hoje é um lugar fulcral da conservação da natureza suíça.
    landscape: >-
      O planalto não é uma planície perfeita: assemelha-se antes a uma paisagem de colinas, socalcos e cristas
      rochosas de ambos os lados do rio. O Rein da Sumvitg percorre-o em meandros, e a paisagem é por vezes
      comparada às tundras nórdicas, pois as árvores dos vales não conseguiram chegar até aqui. Ao redor
      agrupam-se onze cumes de mais de três mil metros, e pela crista alpina da área protegida passa um troço
      da divisória continental de águas.


      A Greina é uma chave da geologia alpina. A erosão deixa a descoberto dobras e cavalgamentos com os quais
      é possível reconstruir as transformações minerais e a formação dos Alpes. Do noroeste desce o maciço
      cristalino do manto de São Gotardo, em gnaisse, e do sul choca com ele o manto de Adula, com sedimentos
      penínicos e xistos dos Grisões. A oeste, bancadas verticais de dolomite clara, mármore e rauvaca dominam
      o fundo do vale.


      O gelo fez o resto. No máximo glaciar a superfície do gelo encontrava-se a cerca de 2900 m, mais de 600
      m acima da planície. O bloco errático de gnaisse ocelar Crap la Crusch foi transportado pelo glaciar a
      partir da zona de São Gotardo, e na área protegida existe um grande dique morénico de um glaciar tardio
      de há cerca de 8000 anos. Os últimos vestígios de glaciares são o Glatscher dalla Greina, o Glatscher da
      Gaglianera e o Glatscher dil Terri, que alimentam a planície com água de degelo. Perto do passo de
      montanha ergue-se um arco natural de rocha calcária com cerca de quarenta metros, muito admirado. E a
      2585 m, sob o Piz Terri, fica o Laghet la Greina, o único grande lago de montanha.
    wildlife: >-
      No breve verão, a flora é extraordinariamente variada. Nos solos jovens da planície cresce o
      junco-bicolor, um raro relíquia, e nas pastagens alpinas ocorrem a anémona-sulfúrea, o
      ranúnculo-da-montanha, a soldanela-alpina, a genciana-das-neves e o miosótis-alpino, entre outras. O
      poeta do Ticino Plinio Grossi descreveu o planalto como «museu geológico» e «jardim botânico».


      A fauna é discreta. Na paisagem aberta e sem árvores encontram um bom refúgio a
      [marmota-alpina](/especie/marmota_marmota/) e a víbora-comum, esta última ameaçada. Entre os mamíferos
      da reserva federal contam-se a [camurça](/especie/rupicapra_rupicapra/) e o
      [íbex](/especie/capra_ibex/), estando prevista a regulação deste último para reduzir danos e a
      competição com a primeira. Outro objetivo de conservação é manter a diversidade das populações de
      tetraonídeos.
    visit: >-
      Chega-se ao planalto a partir de três vales, unidos por trilhos: o Val Lumnezia, o Val Sumvitg e o vale
      de Blenio. O ideal é subir por um e descer por outro. O Bus alpin parte de Vrin para Puzzatsch e de
      Rabius para Runcahez, enquanto no lado do Ticino uma linha vai de Olivone a Pian Geirett e ao Lago di
      Luzzone.


      A travessia clássica divide-se em duas jornadas. A primeira sai de Vrin/Puzzatsch, sobe ao passo Diesrut
      a 2428 m, a «porta da Greina», com inclinação constante e cerca de duas horas e meia desde Puzzatsch, e
      atravessa o planalto. Pouco depois do colo, ao descer para a planície, atravessas a ponte suspensa Punt
      la Greina, com 65 m de comprimento e 40 m de altura sobre o Rein da Sumvitg. A segunda vai da Terrihütte
      por Crest la Greina até Runcahez; a descida é em parte mais exigente, existindo correntes nos troços
      rochosos. Quem estiver em excelente forma física pode fazer o percurso num único dia. O perfil
      altimétrico publicado da travessia atinge 2430 m no ponto mais alto e desce até 1280 m no mais baixo. O
      acesso por transportes públicos combina o autocarro postal Ilanz–Vrin e o Bus alpin até Puzzatsch.


      Do lado do Ticino, o trilho começa no fim de uma estrada, a cerca de 2000 m; um autocarro postal leva os
      caminhantes até essa cota.
    history: >-
      A Greina esteve várias vezes ameaçada ao longo do século XX por projetos hidroelétricos. O projeto
      previa uma albufeira sobre o planalto, submergindo a sua planície aluvial, e uma central hidroelétrica
      no vale de Blenio.


      Entre as organizações que lutaram para a salvar conta-se a Fundação Suíça da Greina para a Conservação
      das Águas Alpinas, criada a 15 de agosto de 1986. Por fim, a indústria energética arquivou a albufeira
      por motivos económicos, a paisagem entrou no inventário federal em 1996 e desde 1997 os municípios
      recebem compensações por terem renunciado à central. Desde 2004 a área é coutada federal de caça
      protegida, «Pez Vial/Greina». Atualmente, o pastoreio de gado vacum causou danos por pisoteio nas
      turfeiras baixas, sobretudo na metade sudoeste da planície aluvial.
    before: >-
      Com tempo incerto não deves iniciar o percurso: a meteorologia muda amiúde na montanha e, se uma frente
      de chuva se aproximar, é imperativo regressar a tempo. Recomenda-se calçado com boa aderência, roupa
      para a chuva, estojo de primeiros socorros, água, comida e, eventualmente, bastões de caminhada. O
      distrito protegido da Greina está sujeito a proteção integral.
    around: >-
      Não existem outros locais do atlas nas proximidades. A grande distância, o [Alto Vale de
      Lötschental](/lugar/lotschen-tal-upper-valley/), o [Parque Natural Regional do
      Queyras](/lugar/parc-naturel-regional-du-queyras/), o [Parque Nacional da
      Vanoise](/lugar/parc-national-de-la-vanoise/) e o [Parque Nacional das Montanhas de
      Rodna](/lugar/parcul-national-muntii-rodnei/) partilham com a Greina a marmota-alpina, a camurça e a
      alta montanha.
