resumen:
  es: Bosque virgen frondoso de hayedo y roble situado en las laderas que descienden hacia el Danubio.
  en: Virgin broadleaf forest of beech and oak on the slopes descending towards the Danube.
  fr: Forêt vierge de feuillus — hêtre et chêne — sur les versants qui descendent vers le Danube.
  de: Jungfräulicher Laubwald aus Buche und Eiche auf den Hängen, die zur Donau abfallen.
  it: Foresta vergine di latifoglie — faggio e quercia — sui versanti che scendono verso il Danubio.
  pt: Floresta virgem de folhosas — faia e carvalho — nos declives que descem para o Danúbio.
unico:
  es: >-
    Un bosque donde crece en abundancia Daphne laureola, un relicto terciario, sobre un karst con 45 cuevas y
    simas.
  en: >-
    A forest where Daphne laureola grows abundantly, a Tertiary relict, above a karst landscape with 45 caves
    and sinkholes.
  fr: >-
    Une forêt où prospère le Daphne laureola, relicte tertiaire, au-dessus d'un karst aux 45 grottes et
    gouffres.
  de: Ein Wald, in dem Daphne laureola gedeiht, ein Tertiärrelikt, über einem Karst mit 45 Höhlen und Dolinen.
  it: >-
    Una foresta dove prospera il Daphne laureola, relitto terziario, sopra un carso con 45 grotte e
    inghiottitoi.
  pt: Uma floresta onde prospera o Daphne laureola, relíquia terciária, sobre um carso com 45 grutas e algares.
