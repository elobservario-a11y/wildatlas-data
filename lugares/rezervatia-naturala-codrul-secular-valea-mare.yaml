texto:
  es:
    intro: >-
      Debajo de la hojarasca, el suelo es hueco. En el sur del Banato, en el término de Moldova Nouă, el río
      Valea Mare ha ido horadando una caliza que esconde 45 cuevas y simas conocidas, y por encima crece un
      bosque de haya, carpe y tilos. Es la Reserva Natural Valea Mare, una reserva de tipo mixto dentro del
      Parque Natural Porțile de Fier, en la que se mezclan el bosque, el roquedo y el karst.
    landscape: >-
      La reserva ocupa unas 1179 hectáreas en los montes Locvei, parte de los montes del Banato, ya en los
      Cárpatos Occidentales. Lo que la hace especial es el relieve: sobre la caliza se han desarrollado
      lapiaces, dolinas, uvalas, surgencias, sumideros, gargantas, cuevas y simas, y los farallones calizos
      recortan el bosque. El río Valea Mare es permanente, y recibe muchos afluentes de cauce temporal:
      Mudavița Seacă, Apele Albe, Ogașu Rău, Ogașu Tisa y Ogașu Greci.


      Entre las cuevas, la de Gaura Haiducească tiene 1370 m y el Avenul Roşu, una sima de 149 m de desnivel.
      El clima es templado continental moderado, con influencias mediterráneas.
    wildlife: >-
      El bosque mezcla haya, carpe, tilo de hoja pequeña, tilo plateado, arce sicómoro y cerezo silvestre, y
      entre las hierbas hay rarezas botánicas: Daphne laureola, Genista ovata, Echinops bannaticus, claveles
      como Dianthus kitaibelii y Dianthus banaticus y la orquídea Orchis pallens. Los prados secos sobre
      caliza se señalan como sitios importantes para orquídeas, y entre los hábitats de interés comunitario
      hay bosques dacios de haya y pastizales esteparios subpanónicos.


      Entre los mamíferos hay zorro, [lobo](/especie/canis_lupus/), [jabalí](/especie/sus_scrofa/) y
      [lince](/especie/lynx_lynx/), y murciélagos de herradura como el mediterráneo y el de Blasius. En el
      aire y los riscos viven el vencejo común, el avión roquero, el escribano soteño, la collalba rubia, el
      [alimoche común](/especie/neophron_percnopterus/) y la golondrina dáurica. Entre los reptiles figuran la
      [víbora cornuda](/especie/vipera_ammodytes/) y la [tortuga mediterránea](/especie/testudo_hermanni/).


      Los mejores meses van de mayo a octubre.
    visit: >-
      Desde Moldova Nouă se llega a la reserva siguiendo el camino paralelo al río Valea Mare. Desde Orşova se
      va por la carretera nacional hasta Moldova Nouă y luego por la de distrito hacia Padina Matei; la
      reserva empieza a la derecha, justo al salir de la ciudad.
    history: >-
      La reserva se declaró en 1973 por decisión del consejo del distrito de Caraș-Severin, se confirmó en
      1982 y se reconfirmó por ley en 2000. Es una reserva natural de categoría IV de la UICN, dentro de la
      región biogeográfica europea.
    before: >-
      Antes de organizar la salida, consulta al centro de información turística de Moldova Nouă las
      condiciones de visita y los sectores abiertos. Plan de una jornada.
    around: >-
      A ocho kilómetros está el [Parque Nacional Đerdap - Puerta de
      Hierro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), y a once el [Parque Nacional Gargantas del
      Nera - Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/). Más lejos, el [Parque Nacional Cozia
      - Bosques Primarios](/lugar/parcul-national-cozia---codrii-seculari/) comparte con Valea Mare la víbora
      cornuda y el oso pardo en un paisaje de bosque primario.
  en:
    intro: >-
      Beneath the leaf litter, the ground is hollow. In southern Banat, in the municipality of Moldova Nouă,
      the Valea Mare river has steadily bored through limestone that conceals 45 known caves and sinkholes,
      and above it grows a forest of beech, hornbeam and lime trees. This is the Valea Mare Nature Reserve, a
      mixed-type reserve within the Porțile de Fier Nature Park, where forest, rocky terrain and karst meet.
    landscape: >-
      The reserve covers about 1,179 hectares in the Locvei Mountains, part of the Banat Mountains within the
      Western Carpathians. What makes it exceptional is the relief: on the limestone, lapiés, dolines, uvalas,
      resurgences, sinkholes, gorges, caves and sinkholes have developed, and limestone crags punctuate the
      forest. The Valea Mare river flows year-round and receives many seasonally intermittent tributaries:
      Mudavița Seacă, Apele Albe, Ogașu Rău, Ogașu Tisa and Ogașu Greci.


      Among the caves, Gaura Haiducească extends 1,370 m and Avenul Roșu is a sinkhole with 149 m of vertical
      drop. The climate is moderately temperate continental with Mediterranean influences.
    wildlife: >-
      The forest blends beech, hornbeam, small-leaved lime, silver lime, sycamore and wild cherry, and among
      the herbaceous plants there are botanical rarities: Daphne laureola, Genista ovata, Echinops bannaticus,
      carnations such as Dianthus kitaibelii and Dianthus banaticus, and the orchid Orchis pallens. Dry
      calcareous grasslands are noted as important orchid sites, and among the habitats of community interest
      are Dacian beech forests and subpannonic steppe grasslands.


      Among the mammals are fox, [wolf](/especie/canis_lupus/), [wild boar](/especie/sus_scrofa/) and
      [Eurasian lynx](/especie/lynx_lynx/), together with horseshoe bats including the Mediterranean and
      Blasius's. Among the birds and cliff-dwellers are the common swift, rock martin, rock bunting,
      rufous-tailed rock thrush, [Egyptian vulture](/especie/neophron_percnopterus/) and red-rumped swallow.
      Among the reptiles are the [nose-horned viper](/especie/vipera_ammodytes/) and the [Hermann's
      tortoise](/especie/testudo_hermanni/).


      The best months run from May to October.
    visit: >-
      From Moldova Nouă, reach the reserve by following the track parallel to the Valea Mare river. From
      Orșova, take the national road to Moldova Nouă and then the district road towards Padina Matei; the
      reserve begins on the right, just on the outskirts of town.
    history: >-
      The reserve was declared in 1973 by decision of the Caraș-Severin district council, confirmed in 1982
      and reconfirmed by law in 2000. It is a natural reserve of IUCN Category IV, within the European
      biogeographical region.
    before: >-
      Before planning a visit, check with the Moldova Nouă tourist information centre for current visiting
      conditions and open sectors. Plan for a full day.
    around: >-
      Eight kilometres away is [Đerdap National Park — Iron
      Gate](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), and eleven kilometres from [Nera Gorges –
      Beușnița National Park](/lugar/parcul-national-cheile-nerei---beusnita/). Further away, [Cozia National
      Park — Secular Forests](/lugar/parcul-national-cozia---codrii-seculari/) shares with Valea Mare the
      nose-horned viper and brown bear in a primeval forest landscape.
  fr:
    intro: >-
      Sous la litière, le sol est creux. Dans le sud du Banat, sur le territoire de Moldova Nouă, la rivière
      Valea Mare a lentement percé un calcaire qui dissimule 45 grottes et gouffres répertoriés, et par-dessus
      croît une forêt de hêtres, charmes et tilleuls. C'est la réserve naturelle de Valea Mare, une réserve de
      type mixte inscrite dans le Parc naturel des Porțile de Fier, où se mêlent forêt, falaises et karst.
    landscape: >-
      La réserve s'étend sur environ 1 179 hectares dans les monts Locvei, qui font partie des monts du Banat
      dans les Carpates occidentales. Ce qui la singularise c'est le relief : sur le calcaire se sont
      développés des lapiés, des dolines, des ouvalas, des résurgences, des pertes, des gorges, des grottes et
      des gouffres, et des pitons rocheux découpent la forêt. La rivière Valea Mare est pérenne et reçoit de
      nombreux affluents à écoulement temporaire : Mudavița Seacă, Apele Albe, Ogașu Rău, Ogașu Tisa et Ogașu
      Greci.


      Parmi les cavités, Gaura Haiducească mesure 1 370 m et l'Avenul Roșu est un gouffre de 149 m de
      dénivelée. Le climat est continental modéré avec des influences méditerranéennes.
    wildlife: >-
      La forêt mêle hêtre, charme, tilleul à petites feuilles, tilleul argenté, érable sycomore et cerisier
      sauvage ; parmi les herbacées se cachent des raretés botaniques : Daphne laureola, Genista ovata,
      Echinops bannaticus, des œillets tels que Dianthus kitaibelii et Dianthus banaticus, et l'orchidée
      Orchis pallens. Les pelouses sèches calcaires sont signalées comme des sites importants pour les
      orchidées, et parmi les habitats d'intérêt communautaire figurent les hêtraies daces et les pelouses
      steppiques subpannoniques.


      Parmi les mammifères on trouve le renard, le [loup](/especie/canis_lupus/), le
      [sanglier](/especie/sus_scrofa/) et le [lynx boréal](/especie/lynx_lynx/), ainsi que des rhinolophes
      méditerranéen et de Blasius. Dans les airs et sur les falaises vivent le martinet noir, l'hirondelle de
      rochers, le bruant fou, le monticole de roche, le [vautour percnoptère](/especie/neophron_percnopterus/)
      et l'hirondelle rousseline. Parmi les reptiles figurent la [vipère cornue](/especie/vipera_ammodytes/)
      et la [tortue d'Hermann](/especie/testudo_hermanni/).


      Les meilleurs mois vont de mai à octobre.
    visit: >-
      Depuis Moldova Nouă, rejoignez la réserve en suivant le chemin longeant la rivière Valea Mare. Depuis
      Orșova, prenez la nationale jusqu'à Moldova Nouă puis la route départementale vers Padina Matei ; la
      réserve commence sur la droite, dès la sortie de la ville.
    history: >-
      La réserve a été déclarée en 1973 par décision du conseil du district de Caraș-Severin, confirmée en
      1982 et réaffirmée par la loi en 2000. C'est une réserve naturelle de catégorie IV de l'UICN, au sein de
      la région biogéographique européenne.
    before: >-
      Avant d'organiser votre sortie, renseignez-vous auprès du centre d'information touristique de Moldova
      Nouă sur les conditions de visite et les secteurs ouverts. Prévoyez une journée complète.
    around: >-
      À huit kilomètres se trouve le [Parc national Đerdap — Portes de
      Fer](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), et à onze le [Parc national des Gorges du Nera
      — Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/). Plus loin, le [Parc national Cozia —
      Forêts primaires](/lugar/parcul-national-cozia---codrii-seculari/) partage avec Valea Mare la vipère
      cornue et l'ours brun dans un paysage de forêt vierge.
  de:
    intro: >-
      Unter der Laubschicht ist der Boden hohl. Im Süden des Banats hat der Fluss Valea Mare im Gemeindegebiet
      von Moldova Nouă beständig einen Kalkstein durchhöhlt, hinter dem 45 bekannte Höhlen und Schächte
      verborgen liegen, und darüber wächst ein Buchen-, Hainbuchen- und Lindenwald. Das ist das Naturreservat
      Valea Mare, ein gemischtes Reservat im Naturpark Porțile de Fier, wo Wald, Fels und Karst
      aufeinandertreffen.
    landscape: >-
      Das Reservat umfasst rund 1.179 Hektar im Locvei-Gebirge, das zu den Banater Bergen der Westlichen
      Karpaten gehört. Was es besonders macht, ist das Relief: Im Kalkstein haben sich Karren, Dolinen,
      Uvalas, Quellen, Schwinden, Schluchten, Höhlen und Schächte entwickelt, und Kalksteinfelsen durchziehen
      den Wald. Der Fluss Valea Mare führt ganzjährig Wasser und erhält viele saisonale Zuflüsse: Mudavița
      Seacă, Apele Albe, Ogașu Rău, Ogașu Tisa und Ogașu Greci.


      Unter den Höhlen erstreckt sich Gaura Haiducească 1.370 m, und der Avenul Roșu ist ein Schacht mit 149 m
      Tiefgang. Das Klima ist gemäßigt-kontinental mit mediterranen Einflüssen.
    wildlife: >-
      Der Wald mischt Buche, Hainbuche, Winterlinde, Silberlinde, Bergahorn und Vogelkirsche, und unter dem
      Kraut wachsen botanische Raritäten: Daphne laureola, Genista ovata, Echinops bannaticus, Nelken wie
      Dianthus kitaibelii und Dianthus banaticus sowie die Orchidee Orchis pallens. Trockene Kalkrasen gelten
      als wichtige Orchideenstandorte, und zu den gemeinschaftlich bedeutenden Lebensräumen gehören dakische
      Buchenwälder und subpannonische Steppenrasen.


      Unter den Säugetieren finden sich Fuchs, [Wolf](/especie/canis_lupus/),
      [Wildschwein](/especie/sus_scrofa/) und [Eurasischer Luchs](/especie/lynx_lynx/) sowie Hufeisennasen wie
      die Mittelmeer- und die Blasius-Fledermaus. An Felsen und in der Luft leben Mauersegler, Felsenschwalbe,
      Zippammer, Steinrötel, [Schmutzgeier](/especie/neophron_percnopterus/) und Rötelschwalbe. Unter den
      Reptilien sind die [Hornotter](/especie/vipera_ammodytes/) und die [Griechische
      Landschildkröte](/especie/testudo_hermanni/).


      Die besten Monate laufen von Mai bis Oktober.
    visit: >-
      Von Moldova Nouă aus erreichst du das Reservat, indem du dem Weg parallel zum Fluss Valea Mare folgst.
      Von Orșova nimmst du die Nationalstraße nach Moldova Nouă und dann die Kreisstraße Richtung Padina
      Matei; das Reservat beginnt rechter Hand kurz hinter der Stadtgrenze.
    history: >-
      Das Reservat wurde 1973 durch Beschluss des Kreisrats Caraș-Severin ausgewiesen, 1982 bestätigt und im
      Jahr 2000 gesetzlich neu verankert. Es ist ein Naturreservat der IUCN-Kategorie IV innerhalb der
      europäischen biogeografischen Region.
    before: >-
      Erkundige dich vor dem Ausflug beim Tourismusinformationszentrum Moldova Nouă nach den aktuellen
      Besuchsbedingungen und zugänglichen Bereichen. Plane einen ganzen Tag ein.
    around: >-
      Acht Kilometer entfernt liegt der [Nationalpark Đerdap — Eisernes
      Tor](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), elf Kilometer der [Nationalpark Nera-Schlucht
      — Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/). Weiter entfernt teilt der [Nationalpark
      Cozia — Urwälder](/lugar/parcul-national-cozia---codrii-seculari/) mit Valea Mare die Hornotter und den
      Braunbären in einer Urwaldlandschaft.
  it:
    intro: >-
      Sotto la lettiera, il suolo è cavo. Nel sud del Banato, nel territorio di Moldova Nouă, il fiume Valea
      Mare ha progressivamente forato un calcare che nasconde 45 grotte e inghiottitoi noti, e sopra cresce
      una foresta di faggi, carpini e tigli. È la Riserva naturale Valea Mare, una riserva di tipo misto
      all'interno del Parco Naturale Porțile de Fier, dove bosco, rocce e carso si incontrano.
    landscape: >-
      La riserva occupa circa 1.179 ettari nei monti Locvei, parte dei Monti del Banato nei Carpazi
      Occidentali. Ciò che la rende eccezionale è il rilievo: sul calcare si sono sviluppati lapias, doline,
      uvala, risorgenze, inghiottitoi, forre, grotte e pozzi, e le cime calcaree sporgono nel bosco. Il fiume
      Valea Mare è perenne e riceve molti affluenti a regime temporaneo: Mudavița Seacă, Apele Albe, Ogașu
      Rău, Ogașu Tisa e Ogașu Greci.


      Tra le cavità, la Gaura Haiducească si estende per 1.370 m e l'Avenul Roșu è una verticale di 149 m. Il
      clima è continentale temperato con influenze mediterranee.
    wildlife: >-
      Il bosco mescola faggio, carpino, tiglio selvatico, tiglio argentato, acero montano e ciliegio
      selvatico, e tra le erbacee si celano rarità botaniche: Daphne laureola, Genista ovata, Echinops
      bannaticus, garofani come Dianthus kitaibelii e Dianthus banaticus e l'orchidea Orchis pallens. I prati
      aridi calcarei sono segnalati come siti importanti per le orchidee, e tra gli habitat di interesse
      comunitario vi sono le faggete daciche e le praterie steppiche subpannoniche.


      Tra i mammiferi si trovano la volpe, il [lupo](/especie/canis_lupus/), il
      [cinghiale](/especie/sus_scrofa/) e la [lince eurasiatica](/especie/lynx_lynx/), oltre a pipistrelli
      ferri di cavallo come il ferro di cavallo mediterraneo e il ferro di cavallo di Blasius. Sulle pareti
      rocciose e in volo vivono il rondone comune, il balestruccio rupestre, il zigolo muciatto, il
      codirossone, il [capovaccaio](/especie/neophron_percnopterus/) e la rondine rossiccia. Tra i rettili
      figurano la [vipera dal corno](/especie/vipera_ammodytes/) e la [testuggine di
      Hermann](/especie/testudo_hermanni/).


      I mesi migliori vanno da maggio a ottobre.
    visit: >-
      Da Moldova Nouă si raggiunge la riserva seguendo la strada parallela al fiume Valea Mare. Da Orșova si
      percorre la strada nazionale fino a Moldova Nouă e poi quella di distretto verso Padina Matei; la
      riserva inizia sulla destra, appena usciti dalla città.
    history: >-
      La riserva è stata dichiarata nel 1973 su decisione del consiglio del distretto di Caraș-Severin,
      confermata nel 1982 e riconfermata per legge nel 2000. È una riserva naturale di categoria IV IUCN,
      all'interno della regione biogeografica europea.
    before: >-
      Prima di organizzare l'escursione, consulta il centro di informazione turistica di Moldova Nouă sulle
      condizioni di visita e sui settori aperti. Pianifica una giornata intera.
    around: >-
      A otto chilometri si trova il [Parco Nazionale Đerdap — Porta di
      Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), e a undici il [Parco Nazionale Gole del Nera
      — Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/). Più lontano, il [Parco Nazionale Cozia —
      Foreste primarie](/lugar/parcul-national-cozia---codrii-seculari/) condivide con Valea Mare la vipera
      dal corno e l'orso bruno in un paesaggio di foresta primeva.
  pt:
    intro: >-
      Sob a folhada, o solo é oco. No sul do Banat, no município de Moldova Nouă, o rio Valea Mare foi
      perfurando pacientemente um calcário que esconde 45 grutas e algares conhecidos, e por cima cresce uma
      floresta de faias, carpinos e tílias. É a Reserva Natural Valea Mare, uma reserva de tipo misto dentro
      do Parque Natural Porțile de Fier, onde floresta, rocha e carso se encontram.
    landscape: >-
      A reserva ocupa cerca de 1.179 hectares nos montes Locvei, parte dos Montes do Banat nos Cárpatos
      Ocidentais. O que a torna excecional é o relevo: sobre o calcário desenvolveram-se lapiás, dolinas,
      uvalas, ressurgências, sumidouros, gargantas, grutas e algares, e as cristas calcárias pontuam o bosque.
      O rio Valea Mare é perene e recebe muitos afluentes de regime temporário: Mudavița Seacă, Apele Albe,
      Ogașu Rău, Ogașu Tisa e Ogașu Greci.


      Entre as cavidades, a Gaura Haiducească estende-se por 1.370 m e o Avenul Roșu é um algar de 149 m de
      desnível. O clima é temperado continental moderado com influências mediterrânicas.
    wildlife: >-
      A floresta mistura faia, carpino, tília-de-folha-pequena, tília-prateada, bordo-sicómoro e
      cerejeira-brava, e entre as herbáceas escondem-se raridades botânicas: Daphne laureola, Genista ovata,
      Echinops bannaticus, cravos como Dianthus kitaibelii e Dianthus banaticus e a orquídea Orchis pallens.
      Os prados secos calcários são assinalados como locais importantes para orquídeas, e entre os habitats de
      interesse comunitário figuram as florestas dácicas de faia e as pastagens estépicas subpanónicas.


      Entre os mamíferos há raposa, [lobo](/especie/canis_lupus/), [javali](/especie/sus_scrofa/) e
      [lince-euroasiático](/especie/lynx_lynx/), bem como morcegos-de-ferradura mediterrâneo e de Blasius. No
      ar e nas escarpas vivem o andorinhão-preto, a andorinha-das-rochas, o escrevedeira-de-roca, o
      melro-azul, o [abutre-do-egipto](/especie/neophron_percnopterus/) e a andorinha-dáurica. Entre os
      répteis figuram a [víbora-cornuda](/especie/vipera_ammodytes/) e a
      [tartaruga-de-hermann](/especie/testudo_hermanni/).


      Os meses mais propícios vão de maio a outubro.
    visit: >-
      A partir de Moldova Nouă chega-se à reserva seguindo o caminho paralelo ao rio Valea Mare. A partir de
      Orșova segue-se a estrada nacional até Moldova Nouă e depois a estrada de distrito em direção a Padina
      Matei; a reserva começa à direita, logo à saída da cidade.
    history: >-
      A reserva foi declarada em 1973 por decisão do conselho do distrito de Caraș-Severin, confirmada em 1982
      e reconfirmada por lei em 2000. É uma reserva natural de categoria IV da UICN, dentro da região
      biogeográfica europeia.
    before: >-
      Antes de organizar a saída, consulta o centro de informação turística de Moldova Nouă sobre as condições
      de visita e os setores abertos. Planeia uma jornada completa.
    around: >-
      A oito quilómetros fica o [Parque Nacional Đerdap — Porta de
      Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), e a onze o [Parque Nacional Gargantas do
      Nera — Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/). Mais longe, o [Parque Nacional Cozia
      — Florestas Primárias](/lugar/parcul-national-cozia---codrii-seculari/) partilha com Valea Mare a
      víbora-cornuda e o urso-pardo numa paisagem de floresta primeva.
