observaciones:
  es: Ve preparado para una montaña sin infraestructura. Los mejores meses son de mayo a octubre.
texto:
  es:
    intro: >-
      En Leaota, el año pastoral termina con una fiesta. Cuando las ovejas bajan de la montaña, en Runcu, la
      comunidad celebra el fin del año pastoral y las tradiciones con el Răvășitul oilor, el descenso de las
      ovejas. Es la mejor entrada a un macizo poco conocido del centro de Rumanía, al norte de Târgoviște,
      entre los Bucegi al este y Piatra Craiului al oeste. Cubre 346 kilómetros cuadrados entre los condados
      de Dâmbovița, Argeș y Brașov, y su punto más alto, la cumbre Leaota, llega a 2.133 metros.
    landscape: >-
      Leaota es conocido por sus densos bosques de abeto, pícea y haya y por su fauna silvestre. Apenas lo
      visitan excursionistas por falta de infraestructura, pero conserva pastos de altura activos y bonitos.
      Los estudios de expertos encuentran en Leaota una biodiversidad comparable a la de Piatra Craiului, con
      especies endémicas.
    wildlife: >-
      Leaota es territorio de grandes carnívoros, y lo que sabemos de ellos viene del trabajo de Conservation
      Carpathia. Un estudio genético de osos en el este de Făgăraș, Piatra Craiului, Iezer-Păpușa y Leaota
      identificó 283 osos, con una densidad estimada de 17-18 por cada cien kilómetros cuadrados. El programa
      de monitoreo genético de lobos, iniciado en 2017, cubre seis cotos en Făgăraș, Iezer-Păpușa y Leaota,
      además del Parque Nacional Piatra Craiului. Y en una zona piloto del este de Făgăraș, Piatra Craiului y
      Leaota, 152 cámaras trampa identificaron 23 [linces](/especie/lynx_lynx/) adultos y nueve crías.


      Un equipo científico estudió y monitorizó las aves de la zona. El monitoreo en corredores de alisos,
      riberas y bordes forestales detectó tres plantas invasoras, que el equipo retiró a mano o cortó en
      verano a lo largo de dos kilómetros del valle Bădenilor.
    visit: >-
      No se ha descrito ninguna ruta, refugio ni centro de visitantes de Leaota: quien va camina por un macizo
      sin infraestructura, entre bosques de abetos y pastos de altura.
    history: >-
      Desde 2012, Wildland y Romfor habían adquirido 8.600 hectáreas de bosques y pastos alpinos de Leaota
      para su protección integral, y hay un plan de conservación y restauración para ellos. Conservation
      Carpathia incluye Leaota junto con el sitio Natura 2000 de Făgăraș y el Parque Nacional Piatra Craiului
      en un proyecto de más de 250.000 hectáreas. En su campaña de replantación, la fundación plantó 382.150
      plantones de abeto, pícea, haya y arce blanco en Făgăraș y en los montes Leaota, y cerca de 150 vecinos
      de los pueblos de la zona trabajaron como temporeros.
    before: Ve preparado para una montaña sin infraestructura. Los mejores meses son de mayo a octubre.
    around: >-
      A un kilómetro queda el [Parque Nacional Bucegi - Ladera
      Occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) y a seis el [Parque Nacional
      Piatra Craiului](/lugar/parcul-national-piatra-craiului/). A diecinueve están las [Montañas de
      Iezer-Păpușa](/lugar/muntii-iezer-papusa/).
  en:
    intro: >-
      In Leaota, the pastoral year concludes with a festival. When sheep descend from the highlands to Runcu,
      the community celebrates heritage and pastoral traditions during Răvășitul oilor, the homecoming of the
      flocks. It offers an ideal introduction to a quiet massif in central Romania, north of Târgoviște,
      wedged between the Bucegi to the east and Piatra Craiului to the west. Spanning 346 square kilometres
      across Dâmbovița, Argeș, and Brașov counties, its highest point, Leaota Peak, reaches 2,133 metres.
    landscape: >-
      Leaota is renowned for its unbroken woodlands of fir, spruce, and beech, and for its rich wildlife. Few
      hikers venture here due to the lack of tourist infrastructure, yet active and picturesque high-altitude
      pastures endure. Ecological studies find in Leaota a level of biodiversity comparable to neighbouring
      Piatra Craiului, harbouring endemic alpine species.
    wildlife: >-
      Leaota is prime habitat for large carnivores, studied through the ongoing fieldwork of Conservation
      Carpathia. A genetic survey of brown bears across eastern Făgăraș, Piatra Craiului, Iezer-Păpușa, and
      Leaota identified 283 bears, reflecting an estimated density of 17-18 individuals per one hundred square
      kilometres. A wolf genetic monitoring programme launched in 2017 encompasses six hunting concessions
      across Făgăraș, Iezer-Păpușa, and Leaota, alongside Piatra Craiului National Park. Within a pilot sector
      of eastern Făgăraș, Piatra Craiului, and Leaota, 152 camera traps documented 23 adult
      [lynx](/especie/lynx_lynx/) and nine kittens.


      A scientific team surveyed and monitored local birdlife. Riparian monitoring along alder corridors,
      riverbanks, and woodland edges uncovered three invasive plant species, which field crews manually
      uprooted or cut in summer along two kilometres of the Bădenilor Valley.
    visit: >-
      No official waymarked hiking routes, mountain huts, or visitor centres exist in Leaota: travellers hike
      across an undeveloped range between fir woodlands and open mountain pastures.
    history: >-
      Since 2012, Wildland and Romfor purchased 8,600 hectares of forests and alpine pastures in Leaota for
      complete conservation, establishing dedicated management and habitat restoration plans. Conservation
      Carpathia integrates Leaota together with the Făgăraș Natura 2000 site and Piatra Craiului National Park
      within a conservation area exceeding 250,000 hectares. Through its ecological restoration campaigns, the
      foundation planted 382,150 saplings of silver fir, Norway spruce, European beech, and sycamore maple
      across Făgăraș and Leaota, employing around 150 local villagers as seasonal workers.
    before: >-
      Be prepared for wilderness travel without any tourist infrastructure. The best hiking months run from
      May to October.
    around: >-
      One kilometre away lies [Bucegi National Park - Western
      Slopes](/lugar/parcul-national-bucegi---vertientes-occidentales/) and six kilometres away is [Piatra
      Craiului National Park](/lugar/parcul-national-piatra-craiului/). Nineteen kilometres away rise the
      [Iezer-Păpușa Mountains](/lugar/muntii-iezer-papusa/).
  fr:
    intro: >-
      À Leaota, l'année pastorale s'achève par une grande fête. Lorsque les brebis descendent des alpages à
      Runcu, la communauté célèbre les traditions rurales lors du Răvășitul oilor, la descente des troupeaux.
      C'est la plus belle porte d'entrée dans ce massif méconnu du centre de la Roumanie, au nord de
      Târgoviște, lové entre les Bucegi à l'est et Piatra Craiului à l'ouest. Il couvre 346 kilomètres carrés
      sur les județe de Dâmbovița, Argeș et Brașov, et son point culminant, le pic Leaota, s'élève à 2 133
      mètres.
    landscape: >-
      Leaota est réputé pour ses épaisses forêts de sapins, d'épicéas et de hêtres ainsi que pour sa grande
      faune. Rares sont les randonneurs qui s'y aventurent faute d'infrastructures d'accueil, mais de
      splendides pâturages d'altitude y demeurent actifs. Les inventaires scientifiques révèlent à Leaota une
      richesse biologique comparable à celle de Piatra Craiului, avec des taxons endémiques.
    wildlife: >-
      Leaota est le royaume des grands carnivores, documenté par les recherches de terrain de Conservation
      Carpathia. Une étude génétique sur les ours dans l'est du Făgăraș, à Piatra Craiului, Iezer-Păpușa et
      Leaota a dénombré 283 ours, soit une densité estimée à 17-18 individus pour cent kilomètres carrés. Le
      programme de suivi génétique du loup, lancé en 2017, couvre six territoires de chasse du Făgăraș,
      d'Iezer-Păpușa et de Leaota, en plus du parc national Piatra Craiului. Dans une zone pilote associant
      l'est du Făgăraș, Piatra Craiului et Leaota, 152 pièges photographiques ont permis d'identifier 23
      [lynx](/especie/lynx_lynx/) adultes et neuf jeunes.


      Une équipe scientifique a suivi et inventorié l'avifaune locale. Des prospections menées le long des
      ripisylves d'aulnes, des berges et des lisières ont permis de détecter trois plantes exotiques
      envahissantes, éliminées à la main ou fauchées en été sur deux kilomètres dans la vallée de Bădenilor.
    visit: >-
      Aucun itinéraire balisé, refuge gardé ni centre d'accueil n'a été aménagé à Leaota : vous parcourez une
      montagne sans infrastructures, entre pessières sauvages et pelouses alpines.
    history: >-
      Depuis 2012, Wildland et Romfor ont acquis 8 600 hectares de forêts et de pâturages d'altitude à Leaota
      pour les placer en protection intégrale, adossés à un plan de gestion et de restauration écologique.
      Conservation Carpathia rattache Leaota au site Natura 2000 du Făgăraș et au parc national Piatra
      Craiului dans un vaste ensemble de plus de 250 000 hectares. Lors de ses campagnes de reboisement, la
      fondation a planté 382 150 jeunes plants de sapin, d'épicéa, de hêtre et d'érable sycomore dans le
      Făgăraș et les monts de Leaota, employant environ 150 habitants des villages voisins comme ouvriers
      saisonniers.
    before: >-
      Préparez-vous à une immersion montagnarde en autonomie totale. Les mois les plus favorables vont de mai
      à octobre.
    around: >-
      À un kilomètre s'ouvre le [parc national de Bucegi - versants
      occidentaux](/lugar/parcul-national-bucegi---vertientes-occidentales/) et à six kilomètres le [parc
      national de Piatra Craiului](/lugar/parcul-national-piatra-craiului/). À dix-neuf kilomètres se dressent
      les [montagnes d'Iezer-Păpușa](/lugar/muntii-iezer-papusa/).
  de:
    intro: >-
      In Leaota endet das Hirtenjahr mit einem festlichen Brauch. Wenn die Schafe von den Bergen hinab nach
      Runcu getrieben werden, feiert die Gemeinde das Ende der Weidesaison und alte Traditionen beim Răvășitul
      oilor, dem festlichen Almabtrieb. Es ist das schönste Tor zu diesem wenig bekannten Massiv
      Zentralrumäniens nördlich von Târgoviște, eingebettet zwischen dem Bucegi-Gebirge im Osten und Piatra
      Craiului im Westen. Es umfasst 346 Quadratkilometer in den Kreisen Dâmbovița, Argeș und Brașov; sein
      höchster Punkt, der Leaota-Gipfel, erreicht 2.133 Meter.
    landscape: >-
      Das Leaota-Gebirge ist bekannt für seine unberührten Tannen-, Fichten- und Buchenwälder sowie seine
      artenreiche Tierwelt. Wegen der fehlenden touristischen Infrastruktur zieht es kaum Wanderer an, doch
      aktive und idyllische Hochweiden haben sich erhalten. Fachgutachten bescheinigen dem Gebirge eine mit
      Piatra Craiului vergleichbare Biodiversität samt endemischen Bergpflanzen.
    wildlife: >-
      Leaota ist das Revier großer Raubtiere, erforscht durch die Feldarbeit von Conservation Carpathia. Eine
      genetische Bärenstudie im östlichen Făgăraș, in Piatra Craiului, Iezer-Păpușa und Leaota erfasste 283
      Braunbären, was einer geschätzten Dichte von 17-18 Tieren pro hundert Quadratkilometer entspricht. Das
      2017 gestartete genetische Wolfsmonitoring umfasst sechs Jagdreviere im Făgăraș, in Iezer-Păpușa und
      Leaota sowie den Nationalpark Piatra Craiului. In einem Pilotgebiet im östlichen Făgăraș, Piatra
      Craiului und Leaota wiesen 152 Fotofallen 23 erwachsene [Luchse](/especie/lynx_lynx/) und neun Jungtiere
      nach.


      Ein wissenschaftliches Team untersuchte die Vogelwelt der Region. Bei Erhebungen entlang von
      Erlenkorridoren, Ufern und Waldsäumen wurden drei invasive Pflanzenarten entdeckt, die Helfer im Sommer
      entlang von zwei Kilometern im Bădenilor-Tal von Hand entfernten.
    visit: >-
      Im Leaota-Gebirge gibt es keine markierten Routen, Berghütten oder Besucherzentren: Wer hier wandert,
      durchstreift ein wegloses Bergmassiv zwischen Nadelwäldern und Hochweiden.
    history: >-
      Seit 2012 erwarben Wildland und Romfor 8.600 Hektar Wälder und Hochweiden in Leaota für den Vollschutz,
      begleitet von einem Konzept zur Renaturierung. Conservation Carpathia bindet Leaota zusammen mit dem
      Natura-2000-Gebiet Făgăraș und dem Nationalpark Piatra Craiului in ein Schutzgebiet von über 250.000
      Hektar ein. Bei Aufforstungsaktionen pflanzte die Stiftung 382.150 Setzlinge von Tanne, Fichte, Buche
      und Bergahorn im Făgăraș und im Leaota-Gebirge, wobei etwa 150 Dorfbewohner als Saisonkräfte mitwirkten.
    before: >-
      Stelle dich auf eine alpine Wildnis ohne jede Infrastruktur ein. Die besten Monate für Touren reichen
      von Mai bis Oktober.
    around: >-
      Einen Kilometer entfernt liegt der [Bucegi-Nationalpark –
      Westhänge](/lugar/parcul-national-bucegi---vertientes-occidentales/) und sechs Kilometer entfernt der
      [Nationalpark Piatra Craiului](/lugar/parcul-national-piatra-craiului/). In neunzehn Kilometern
      Entfernung erhebt sich das [Iezer-Păpușa-Gebirge](/lugar/muntii-iezer-papusa/).
  it:
    intro: >-
      A Leaota l'anno pastorale si conclude con una festa. Quando le greggi scendono dalla montagna a Runcu,
      la comunità celebra le tradizioni e la transumanza con il Răvășitul oilor, la discesa delle pecore. È la
      migliore introduzione a questo massiccio poco frequentato della Romania centrale, a nord di Târgoviște,
      racchiuso tra i Bucegi a est e Piatra Craiului a ovest. Si estende per 346 chilometri quadrati tra i
      distretti di Dâmbovița, Argeș e Brașov, e la sua cima più elevata, il monte Leaota, tocca i 2.133 metri.
    landscape: >-
      Leaota è rinomato per le sue fitte foreste di abete bianco, abete rosso e faggio e per la sua fauna
      selvatica. Pochi escursionisti vi si addentrano a causa dell'assenza di strutture ricettive, eppure i
      pascoli d'alta quota attivi conservano un fascino intatto. Gli studi ecologici attribuiscono a Leaota
      una biodiversità paragonabile a quella di Piatra Craiului, impreziosita da specie endemiche.
    wildlife: >-
      Leaota è territorio di grandi carnivori, monitorati dalle ricerche sul campo di Conservation Carpathia.
      Uno studio genetico sugli orsi nella parte orientale di Făgăraș, Piatra Craiului, Iezer-Păpușa e Leaota
      ha identificato 283 orsi, con una densità stimata di 17-18 individui ogni cento chilometri quadrati. Il
      programma di monitoraggio genetico dei lupi avviato nel 2017 comprende sei riserve di caccia nei
      massicci di Făgăraș, Iezer-Păpușa e Leaota, oltre al Parco Nazionale Piatra Craiului. In un'area pilota
      tra Făgăraș orientale, Piatra Craiului e Leaota, 152 fototrappole hanno registrato 23
      [linci](/especie/lynx_lynx/) adulte e nove cuccioli.


      Un gruppo scientifico ha censito e monitorato l'avifauna locale. I rilievi condotti lungo i corridoi di
      ontani, le sponde fluviali e i margini forestali hanno individuato tre piante aliene invasive, estirpate
      a mano o falciate in estate lungo due chilometri nella valle di Bădenilor.
    visit: >-
      Non vi sono itinerari segnati, rifugi gestiti né centri visite a Leaota: chi vi sale cammina in una
      montagna priva di infrastrutture, tra abetaie selvagge e praterie d'alta quota.
    history: >-
      A partire dal 2012, Wildland e Romfor hanno acquistato 8.600 ettari di foreste e pascoli alpini a Leaota
      per assicurarne la tutela integrale, elaborando un programma di conservazione e ripristino ambientale.
      Conservation Carpathia unisce Leaota al sito Natura 2000 di Făgăraș e al Parco Nazionale Piatra Craiului
      in un comprensorio protetto di oltre 250.000 ettari. Nelle sue campagne di rimboschimento, la fondazione
      ha messo a dimora 382.150 piantine di abete bianco, abete rosso, faggio e acero montano tra il Făgăraș e
      i monti Leaota, impiegando circa 150 residenti dei borghi circostanti come lavoratori stagionali.
    before: >-
      Preparati a camminare in una montagna priva di infrastrutture. I mesi migliori vanno da maggio a
      ottobre.
    around: >-
      A un chilometro si trova il [Parco Nazionale Bucegi - Versante
      Occidentale](/lugar/parcul-national-bucegi---vertientes-occidentales/) e a sei chilometri il [Parco
      Nazionale Piatra Craiului](/lugar/parcul-national-piatra-craiului/). A diciannove chilometri sorgono i
      [Monti di Iezer-Păpușa](/lugar/muntii-iezer-papusa/).
  pt:
    intro: >-
      Em Leaota, o ano pastoril termina com uma celebração tradicional. Quando as ovelhas descem da montanha
      até Runcu, a comunidade comemora o fecho da época de pastoreio com o Răvășitul oilor, a descida dos
      rebanhos. É a porta de entrada perfeita para este maciço pouco conhecido do centro da Roménia, a norte
      de Târgoviște, entre Bucegi a leste e Piatra Craiului a oeste. Abrange 346 quilómetros quadrados entre
      os distritos de Dâmbovița, Argeș e Brașov, e o seu cume mais elevado, o pico Leaota, atinge 2.133
      metros.
    landscape: >-
      Leaota destaca-se pelas suas matas contínuas de abeto, espruce e faia e pela sua abundante fauna bravia.
      Poucos excursionistas percorrem o maciço devido à ausência de infraestruturas turísticas, mas
      preservam-se pastagens de altitude ativas e deslumbrantes. Vários estudos ecológicos reconhecem em
      Leaota uma riqueza biológica semelhante à de Piatra Craiului, incluindo espécies botânicas endémicas.
    wildlife: >-
      Leaota é território privilegiado de grandes carnívoros, estudados através do trabalho de campo da
      Conservation Carpathia. Uma investigação genética sobre o urso-pardo no leste de Făgăraș, Piatra
      Craiului, Iezer-Păpușa e Leaota identificou 283 ursos, com uma densidade estimada de 17-18 exemplares
      por cada cem quilómetros quadrados. O programa de monitorização genética de lobos, iniciado em 2017,
      cobre seis coutadas em Făgăraș, Iezer-Păpușa e Leaota, além do Parque Nacional Piatra Craiului. Numa
      área-piloto do leste de Făgăraș, Piatra Craiului e Leaota, 152 câmaras de armadilhagem fotográfica
      registaram 23 [linces](/especie/lynx_lynx/) adultos e nove crias.


      Uma equipa científica estudou a avifauna da região. A vigilância ao longo de galerias de amieiros,
      margens fluviais e orlas florestais detetou três plantas invasoras, erradicadas manualmente ou ceifadas
      no verão ao longo de dois quilómetros no vale de Bădenilor.
    visit: >-
      Não existem trilhos balizados, refúgios de montanha nem postos de acolhimento em Leaota: caminharás por
      uma cordilheira selvagem sem infraestruturas, entre florestas de coníferas e pastagens de altitude.
    history: >-
      Desde 2012, a Wildland e a Romfor adquiriram 8.600 hectares de florestas e pastagens alpinas em Leaota
      para proteção integral, desenvolvendo planos de conservação e restauro ecológico. A Conservation
      Carpathia integra Leaota com o sítio Natura 2000 de Făgăraș e o Parque Nacional Piatra Craiului numa
      área de conservação superior a 250.000 hectares. Nas suas campanhas de reflorestação, a fundação plantou
      382.150 rebentos de abeto, espruce, faia e ácer nos montes de Făgăraș e Leaota, envolvendo cerca de 150
      habitantes locais em trabalhos sazonais.
    before: >-
      Prepara-te para caminhar numa montanha sem qualquer apoio de infraestruturas. A melhor época decorre de
      maio a outubro.
    around: >-
      A um quilómetro fica o [Parque Nacional de Bucegi - Vertente
      Ocidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) e a seis quilómetros o [Parque
      Nacional de Piatra Craiului](/lugar/parcul-national-piatra-craiului/). A dezanove quilómetros erguem-se
      as [Montanhas de Iezer-Păpușa](/lugar/muntii-iezer-papusa/).
