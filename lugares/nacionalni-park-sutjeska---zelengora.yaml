resumen:
  es: >-
    La 'Montaña Verde', cordillera boscosa y de prados alpinos salpicada por 8 lagos glaciares de gran
    belleza.
  en: The "Green Mountain", a range of forests and alpine meadows dotted by 8 glacial lakes of striking beauty.
  fr: La « Montagne Verte », chaîne boisée d’alpages jalonnée par 8 magnifiques lacs glaciaires.
  de: Der „Grüne Berg“, waldreiche Gebirgskette mit Almwiesen und 8 wunderschönen Gletscherseen.
  it: La "Montagna Verde", dorsale ricca di boschi e pascoli alpini costellata da 8 incantevoli laghi glaciali.
  pt: >-
    A "Montanha Verde", cordilheira arborizada e de prados alpinos pontilhada por 8 lagos glaciares
    deslumbrantes.
unico:
  es: >-
    Una montaña mansa de lagos glaciares y pastos a la que los pastores suben el ganado desde hace siglos, al
    otro lado del cañón del Sutjeska.
  en: >-
    A gentle mountain of glacial lakes and pastures where shepherds have driven their livestock for centuries,
    opposite the rugged Sutjeska canyon.
  fr: >-
    Une montagne paisible de lacs glaciaires et de pâturages où les bergers mènent leurs troupeaux depuis des
    siècles, face aux gorges abruptes de la Sutjeska.
  de: >-
    Ein sanftes Gebirge aus Karseen und Weideflächen, auf die Hirten seit Jahrhunderten ihr Vieh treiben,
    gegenüber der wilden Schlucht der Sutjeska.
  it: >-
    Una montagna armoniosa punteggiata da laghi glaciali e pascoli dove i pastori portano le greggi da secoli,
    sul versante opposto all’orrido della Sutjeska.
  pt: >-
    Uma montanha serena de lagos glaciares e pastagens onde os pastores sobem com o gado há séculos, defronte
    ao desfiladeiro escarpado do Sutjeska.
observaciones:
  es: >-
    El parque es accesible casi todo el año, con algunas restricciones en invierno. Perućica tiene el máximo
    grado de protección: la visita está prohibida salvo que la anuncie, la autorice y la acompañe personal del
    parque. Consulta al parque el acceso y las condiciones del invierno antes de ir.
texto:
  es:
    intro: >-
      El río Sutjeska ha abierto un cañón de unos 1200 m de profundidad. A un lado quedan Maglić, Volujak y
      Bioč; al otro, Zelengora, la «Montaña Verde», suave y de cumbres redondeadas, hecha de bosques, pastos
      verdes y lagos glaciares. Está en el parque nacional Sutjeska (República Srpska, entre Foča y Tjentište)
      y el parque la recomienda como destino de descanso familiar porque sus recorridos no son especialmente
      exigentes.
    landscape: >-
      Zelengora es la cara amable del parque. Lo dicen sus propios gestores: suave y de cumbres redondeadas,
      es lo contrario de Maglić y Volujak. Su base es de caliza y dolomita cubiertas de arenisca, y por eso el
      agua brota por todas partes: fuentes, arroyos y lagos de origen glaciar, los «ojos de la montaña». Los
      más conocidos son Kotlaničko, Orlovačko, Štirinsko, Borilovačko, Donje Bare, Gornje Bare, el Negro y el
      Blanco. En el macizo nace además el río Neretva.


      Sobre una meseta alomada de bosque y prado asoman las cumbres: Bregoč, de 2014 m, y Kozje strane, de
      2013 m, se miran de frente como en un duelo. Alrededor, el parque habla de plantas medicinales, bayas
      silvestres, bosques, pastos y manantiales. Cada lago tiene su carácter: unos para bañarse, otros para
      quedarse mirando.
    wildlife: >-
      El parque dice que aquí viven las mayores poblaciones de fauna grande y que se ven con frecuencia en las
      excursiones; la propia web presenta Zelengora como hogar del [lobo](/especie/canis_lupus/). En el
      conjunto del parque se han visto [oso pardo](/especie/ursus_arctos/),
      [rebeco](/especie/rupicapra_rupicapra/), jabalí, martas, [gato montés](/especie/felis_silvestris/),
      zorro y cabra salvaje, sobre todo en los bosques de Perućica. Y hay más de 300 especies de aves en las
      zonas de lagos y humedales; entre las citadas en Perućica están el [águila
      real](/especie/aquila_chrysaetos/), el [halcón peregrino](/especie/falco_peregrinus/) y la perdiz
      griega. El rebeco ha dado además un buen ejemplo de conservación: entre 1963 y 1987 se llevaron 256
      ejemplares de este parque a otras 13 zonas de Bosnia y Herzegovina y Croacia.


      El calendario lo marcan los pastores. De mayo a septiembre, miles de ovejas, cabras y vacas cubren los
      pastos de Zelengora, acompañadas de pastores y de perros. Para caminar, el parque propone sus rutas de
      lagos entre junio y noviembre.
    visit: >-
      Las rutas arrancan desde Tjentište, el valle del Sutjeska. Desde allí se sube en todoterreno al punto de
      partida de varias de ellas, Borovno brdo, a 1720 m.


      La ruta de los cuatro lagos es la más completa. Enlaza Kotlaničko, Štirinsko, Borilovačko y Orlovačko,
      es difícil y calcula entre cinco y seis horas de marcha. Štirinsko es el mayor de Zelengora y en su
      orilla hay una necrópolis medieval de lápidas stećci. Borilovačko es el único lago artificial.


      Bregoč es más sencillo. Su trazado total es de 8,5 km y se alcanza la cima en una hora y media de
      marcha; el parque la considera de dificultad media a fácil, y se baja después hasta el Orlovačko. Para
      quien busque una jornada más corta están los lagos Negro y Blanco, de siete a ocho horas en total con
      cuatro o cinco de marcha entre ida y vuelta; del Blanco sobresale una roca que se asoma sobre el agua
      como un trampolín natural, y más arriba, en el collado de Ljubin grob, hay un monumento a los partisanos
      de 1943.


      En Zelengora también se anda en bicicleta por rutas acondicionadas y señalizadas, se puede acampar junto
      a los lagos y se recogen plantas medicinales, bayas y setas.
    history: >-
      Durante siglos, los pastores trasladaron sus rebaños a estos pastos cuando en verano se acababa el
      forraje en las tierras bajas de Herzegovina y Bosnia. Alrededor de las praderas siguen los katuni,
      asentamientos temporales de cabañas de montaña. Del mundo pastoril quedan topónimos, lápidas stećci y
      viejos modos de trabajar la leche y de mover el ganado.


      La montaña conoce también otra historia: fue escenario de batallas sangrientas, y en la Segunda Guerra
      Mundial se libró aquí la batalla del Sutjeska, del 15 de mayo al 16 de junio de 1943. De hecho, el
      parque se declaró en 1962 más por esas batallas que por la conservación, y es el parque nacional más
      antiguo de Bosnia y Herzegovina. La selva de Perućica, que forma parte del parque, está en la lista
      indicativa de la UNESCO.
    before: >-
      El parque es accesible casi todo el año, con algunas restricciones en invierno. Perućica tiene el máximo
      grado de protección: la visita está prohibida salvo que la anuncie, la autorice y la acompañe personal
      del parque. Consulta al parque el acceso y las condiciones del invierno antes de ir.
    around: >-
      La [Prašuma Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) está dentro del parque. A
      solo 1 km queda el [Parque natural Piva](/lugar/park-prirode-piva/), y a unos 20 km el [macizo del
      Durmitor](/lugar/nacionalni-park-durmitor---masiv/) y el [cañón del
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/).
  en:
    intro: >-
      The Sutjeska River has carved a canyon some 1200 m deep. On one flank rise Maglić, Volujak and Bioč; on
      the opposite side spreads Zelengora, the "Green Mountain", undulating with rounded summits, blanketed by
      woodlands, lush meadows and glacial tarns. Located within Sutjeska National Park (Republika Srpska,
      between Foča and Tjentište), the park administration recommends it as an ideal setting for family
      recreation because its mountain trails are not particularly demanding.
    landscape: >-
      Zelengora is the welcoming, gentle face of the national park. The park rangers themselves emphasize it:
      mild with softened ridges, the complete opposite of the razor-sharp crags of Maglić and Volujak. Its
      underlying geology blends limestone and dolomite capped by sandstone strata, which causes freshwater to
      bubble up in every direction: natural springs, mountain streams and glacial cirque tarns, fondly called
      the "eyes of the mountain". The best known are Kotlaničko, Orlovačko, Štirinsko, Borilovačko, Donje
      Bare, Gornje Bare, and the Black and White lakes. The headwaters of the Neretva River also originate
      within this massif.


      Above a rolling plateau of mixed woods and pastures rise the principal peaks: Bregoč, at 2014 m, and
      Kozje strane, at 2013 m, facing each other across the highland like silent duellists. All around, the
      park highlights medicinal herbs, wild forest berries, woodlands, open grazing lands and clean springs.
      Each lake exhibits its own distinctive character: some entice you for a cold swim, others invite quiet
      contemplation.
    wildlife: >-
      Park authorities state that these ranges support the largest concentrations of large wildlife,
      frequently sighted during hikes; the official website describes Zelengora as home of the
      [wolf](/especie/canis_lupus/). Across the national park territory visitors have recorded [brown
      bear](/especie/ursus_arctos/), [chamois](/especie/rupicapra_rupicapra/), wild boar, pine martens,
      [wildcat](/especie/felis_silvestris/), red fox and wild goat, particularly in the old-growth woodlands
      of Perućica. Furthermore, over 300 bird species populate the lake systems and wetland margins; species
      documented around Perućica include [golden eagle](/especie/aquila_chrysaetos/), [peregrine
      falcon](/especie/falco_peregrinus/) and rock partridge. Chamois conservation here provides an
      exceptional success story: between 1963 and 1987, a total of 256 individuals were translocated from this
      park to 13 other mountain areas across Bosnia and Herzegovina and Croatia.


      The pastoral calendar dictates the seasons. From May to September, thousands of sheep, goats and cattle
      cover the slopes of Zelengora, tended by traditional shepherds and mountain sheepdogs. For hiking, the
      park recommends touring the lake circuits between June and November.
    visit: >-
      Excursions depart from Tjentište in the Sutjeska valley. From the valley floor, off-road vehicles
      transfer hikers to Borovno brdo at 1720 m, the starting point for several routes.


      The Four Lakes circuit is the most comprehensive trail. Linking Kotlaničko, Štirinsko, Borilovačko and
      Orlovačko, it is rated difficult and requires between five and six hours of walking. Štirinsko is the
      largest lake in Zelengora, with a medieval necropolis of carved stećci tombstones on its shore.
      Borilovačko is the only artificial lake in the chain.


      Bregoč is more straightforward. The total distance is 8.5 km, reaching the summit in an hour and a half
      of climbing; the park classifies it as moderate to easy, with a descent down to Orlovačko. For those
      looking for a shorter day out, the Black and White lakes offer a hike of seven to eight hours in total
      with four to five hours of actual walking there and back; out of the White Lake juts a natural
      diving-board rock overlooking the water, and higher up at the Ljubin grob pass stands a partisan
      memorial monument from 1943.


      Zelengora also caters to mountain biking along prepared and marked tracks, allows lakeside camping, and
      invites foraging for medicinal herbs, wild berries and forest mushrooms.
    history: >-
      For centuries, transhumant pastoralists brought their flocks to these high pastures when summer drought
      dried out grazing land in the lowlands of Herzegovina and Bosnia. Encircling the high pastures remain
      the katuni, seasonal mountain hamlets of rustic timber huts. This pastoral heritage survives in local
      toponyms, medieval stećci tombstones, traditional cheese-making and customary seasonal livestock
      migrations.


      The mountain has also witnessed dramatic conflict: it served as the theatre for fierce battles, and
      during World War II the Battle of the Sutjeska unfolded here between 15 May and 16 June 1943. Indeed,
      the national park was proclaimed in 1962 largely to commemorate those battlefield sacrifices rather than
      purely for ecological protection, making it the oldest national park in Bosnia and Herzegovina. The
      ancient primeval forest of Perućica, encompassed within the park, is inscribed on the UNESCO World
      Heritage tentative list.
    before: >-
      The park remains accessible almost year-round, with winter restrictions. Perućica enjoys the strictest
      level of legal protection: entry is strictly prohibited unless pre-announced, officially authorised, and
      guided by park personnel. Consult park authorities regarding trail accessibility and winter conditions
      prior to departure.
    around: >-
      [Prašuma Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) lies within the national park
      itself. Just 1 km away begins [Piva Nature Park](/lugar/park-prirode-piva/), and around 20 km away rise
      the [Durmitor massif](/lugar/nacionalni-park-durmitor---masiv/) and the [Tara
      canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/).
  fr:
    intro: >-
      La rivière Sutjeska a taillé un canyon d’environ 1200 m de profondeur. D’un côté se dressent Maglić,
      Volujak et Bioč ; de l’autre s’étend la Zelengora, la « Montagne Verte », aux crêtes douces et ondulées,
      drapée de forêts, d’alpages verdoyants et de lacs d’origine glaciaire. Située dans le parc national de
      Sutjeska (Republika Srpska, entre Foča et Tjentište), le parc la recommande tout particulièrement pour
      des séjours de repos en famille en raison de sentiers sans difficulté majeure.
    landscape: >-
      La Zelengora représente le visage bienveillant du parc national. Ses propres gestionnaires le soulignent
      : douce et arrondie, elle tranche avec la verticalité acérée du Maglić et du Volujak. Son socle de
      calcaire et de dolomite est surmonté de bancs de grès, de sorte que l’eau jaillit de toute part :
      sources vives, torrents et lacs de cirque glaciaire, affectueusement appelés les « yeux de la montagne
      ». Les plus renommés sont Kotlaničko, Orlovačko, Štirinsko, Borilovačko, Donje Bare, Gornje Bare, ainsi
      que le lac Noir et le lac Blanc. La rivière Neretva prend d’ailleurs naissance au cœur de ce massif.


      Sur un plateau moutonné de bois et de pelouses émergent les sommets principaux : le Bregoč, à 2014 m, et
      le Kozje strane, à 2013 m, qui se toisent en face-à-face comme deux duellistes. Tout autour, le parc
      valorise la richesse en plantes médicinales, petits fruits des bois, forêts, pâtures et fontaines
      naturelles. Chaque plan d’eau possède sa propre personnalité : certains propices à la baignade
      vivifiante, d’autres au recueillement silencieux.
    wildlife: >-
      L’administration du parc rappelle qu’on trouve ici les plus fortes densités de grande faune,
      régulièrement croisées lors des randonnées ; son portail officiel décrit la Zelengora comme le domaine
      privilégié du [loup](/especie/canis_lupus/). Sur l’ensemble du parc national sont observés [l’ours
      brun](/especie/ursus_arctos/), [le chamois](/especie/rupicapra_rupicapra/), le sanglier, la martre, [le
      chat sauvage](/especie/felis_silvestris/), le renard et la chèvre sauvage, en particulier dans les
      futaies primaires de Perućica. Plus de 300 espèces d’oiseaux fréquentent en outre les lacs et zones
      humides ; parmi les nicheurs de Perućica figurent [l’aigle royal](/especie/aquila_chrysaetos/), [le
      faucon pèlerin](/especie/falco_peregrinus/) et la perdrix bartavelle. Le chamois illustre une
      remarquable réussite de réintroduction : entre 1963 et 1987, a total of 256 spécimens issus du parc ont
      été relâchés dans 13 autres massifs de Bosnie-Herzégovine et de Croatie.


      Le rythme saisonnier est dicté par le pastoralisme. De mai à septembre, des milliers d’ovins, de caprins
      et de bovins investissent les pâturages de la Zelengora sous la surveillance des bergers et de leurs
      chiens. Côté marche, le parc conseille d’effectuer les randonnées des lacs glaciaires entre juin et
      novembre.
    visit: >-
      Les itinéraires démarrent généralement de Tjentište, au fond de la vallée de la Sutjeska. De là, on
      monte en véhicule tout-terrain jusqu’à Borovno brdo, à 1720 m, point d’envol de plusieurs circuits.


      La boucle des quatre lacs est la plus complète. Reliant Kotlaničko, Štirinsko, Borilovačko et Orlovačko,
      cet itinéraire exigeant demande entre cinq et six heures de marche effective. Štirinsko est le plus
      vaste lac de la Zelengora et abrite sur ses berges une nécropole médiévale ornée de pierres tombales
      stećci. Borilovačko est le seul lac artificiel du massif.


      Le mont Bregoč offre une ascension plus aisée. Son parcours fait au total 8,5 km pour atteindre la crête
      en une heure et demie de montée ; le parc classe l’itinéraire de moyen à facile, puis on redescend vers
      l’Orlovačko. Pour une journée plus modérée, les lacs Noir et Blanc composent une sortie de sept à huit
      heures au total, dont quatre à cinq heures de marche aller-retour ; du lac Blanc émerge un éperon
      rocheux faisant office de plongeoir naturel au-dessus de l’eau, et plus haut, au col de Ljubin grob, se
      dresse un monument commémoratif dédié aux partisans de 1943.


      Sur la Zelengora, vous pouvez également pratiquer le VTT sur pistes balisées, camper sur les rives des
      lacs et cueillir plantes aromatiques, baies et champignons.
    history: >-
      Pendant des générations, les bergers ont conduit leurs bêtes vers ces alpages lorsque les chaleurs de
      l’été tarissaient les fourrages des basses terres d’Herzégovine et de Bosnie. Autour des pelouses
      subsistent les katuni, hameaux d’alpage temporaires bâtis de cabanes en bois. De cette vie pastorale
      restent des toponymes évocateurs, des stèles stećci et des traditions séculaires de fabrication laitière
      et de transhumance.


      Le massif garde aussi la mémoire de batailles tragiques : durant la Seconde Guerre mondiale s’y est
      déroulée la célèbre bataille de la Sutjeska, du 15 mai au 16 juin 1943. C’est d’ailleurs à la suite de
      ces événements héroïques que le parc a été fondé en 1962, avant même la prise en compte
      environnementale, constituant le plus ancien parc national de Bosnie-Herzégovine. La forêt primaire de
      Perućica, incluse dans le périmètre, figure sur la liste indicative du patrimoine mondial de l’UNESCO.
    before: >-
      Le parc reste ouvert la plus grande partie de l’année, avec certaines restrictions hivernales. Perućica
      bénéficie d’un statut de protection intégrale : toute visite y est strictement interdite sans
      signalement préalable, autorisation officielle et accompagnement par les gardes du parc. Renseignez-vous
      auprès de la direction sur l’accès et la météo avant de partir.
    around: >-
      La [forêt primaire de Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) fait partie
      intégrante du parc. À seulement 1 km s’ouvre le [Parc naturel de Piva](/lugar/park-prirode-piva/), et à
      environ 20 km s’élèvent le [massif du Durmitor](/lugar/nacionalni-park-durmitor---masiv/) et le [canyon
      de la Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/).
  de:
    intro: >-
      Der Fluss Sutjeska hat einen etwa 1200 m tiefen Canyon in das Gestein gegraben. Auf der einen Seite
      thronen Maglić, Volujak und Bioč; auf der anderen erstreckt sich die Zelengora, der „Grüne Berg“, mit
      sanft gerundeten Kuppen, dichten Bergwäldern, saftigen Weiden und eiszeitlichen Karseen. Sie liegt im
      Nationalpark Sutjeska (Republika Srpska, zwischen Foča und Tjentište) und wird von der Parkverwaltung
      besonders als ruhiges Familienausflugsziel empfohlen, da die Wege keine extremen alpinistischen
      Anforderungen stellen.
    landscape: >-
      Die Zelengora ist die sanfte Seite des Nationalparks. Wie die Ranger betonen: Weich geformt und mit
      runden Gipfeln bildet sie den vollkommenen Gegenpol zu den schroffen Graten des Maglić und Volujak. Ihr
      Sockel aus Kalkstein und Dolomit wird von Sandsteinschichten überlagert, weshalb überall Quellwasser
      austritt: muntere Bäche, Brunnen und eiszeitliche Karseen, die im Volksmund als „Augen der Berge“
      bezeichnet werden. Am bekanntesten sind Kotlaničko, Orlovačko, Štirinsko, Borilovačko, Donje Bare,
      Gornje Bare sowie der Schwarze und der Weiße See. Im Massiv entspringt zudem der Fluss Neretva.


      Über einer welligen Hochebene aus Wald und Wiesen ragen die beiden höchsten Erhebungen empor: Bregoč mit
      2014 m und Kozje strane mit 2013 m stehen sich wie zwei Duellanten gegenüber. Ringsum rühmt die
      Parkverwaltung den Reichtum an Heilkräutern, Waldbeeren, Hochwäldern, Weiden und Quellen. Jeder See
      besitzt seinen ganz eigenen Reiz: Die einen laden zum erfrischenden Bad ein, die anderen zur stillen
      Einkehr.
    wildlife: >-
      Nach Angaben des Nationalparks beherbergt dieses Massiv die dichtesten Populationen an Großsäugern, die
      bei Bergtouren regelmäßig gesichtet werden; die offizielle Website beschreibt die Zelengora als
      Kernlebensraum für den [Wolf](/especie/canis_lupus/). Im gesamten Parkgebiet wurden
      [Braunbär](/especie/ursus_arctos/), [Gämse](/especie/rupicapra_rupicapra/), Wildschwein, Baummarder,
      [Wildkatze](/especie/felis_silvestris/), Rotfuchs und Wildziege nachgewiesen, vor allem in den Urwäldern
      von Perućica. Über 300 Vogelarten beleben die Bergseen und Feuchtbiotope; zu den Brutvögeln um Perućica
      zählen [Steinadler](/especie/aquila_chrysaetos/), [Wanderfalke](/especie/falco_peregrinus/) und
      Steinhuhn. Die Gämse verzeichnete hier einen bemerkenswerten Umsiedlungserfolg: Zwischen 1963 und 1987
      wurden 256 Tiere aus diesem Park in 13 andere Bergregionen Bosnien-Herzegowinas und Kroatiens
      umgesiedelt.


      Der Jahresablauf folgt den Hirten. Von Mai bis September grasen Tausende Schafe, Ziegen und Rinder auf
      den Hochebenen der Zelengora, begleitet von Hirten und Herdenschutzhunden. Zum Wandern empfiehlt der
      Park die Seenrouten zwischen Juni und November.
    visit: >-
      Die Bergtouren starten meist in Tjentište im Tal der Sutjeska. Von dort geht es im Geländewagen hinauf
      nach Borovno brdo auf 1720 m, dem Ausgangspunkt für mehrere Bergrouten.


      Die Route der vier Seen ist die umfassendste Rundtour. Sie verbindet Kotlaničko, Štirinsko, Borilovačko
      und Orlovačko, gilt als anspruchsvoll und erfordert fünf bis sechs Gehstunden. Štirinsko ist der größte
      See der Zelengora und weist an seinem Ufer eine mittelalterliche Stećci-Nekropole auf. Borilovačko ist
      der einzige künstlich gestaute See der Kette.


      Die Tour auf den Bregoč ist deutlich einfacher. Die Gesamtstrecke misst 8,5 km und der Gipfel wird in
      anderthalb Stunden Aufstieg erreicht; die Parkleitung stuft die Wanderung als leicht bis mittelschwer
      ein, mit anschließendem Abstieg zum Orlovačko-See. Wer eine kürzere Tagestour sucht, wählt den Schwarzen
      und Weißen See, insgesamt sieben bis acht Stunden Ausflugsdauer mit vier bis fünf Stunden reiner Gehzeit
      hin und zurück; am Weißen See ragt eine Felsnase wie ein natürliches Sprungbrett über das klare Wasser,
      und weiter oben am Pass Ljubin grob erinnert ein Denkmal an die Partisanen von 1943.


      In der Zelengora kann man zudem auf ausgeschilderten Pisten Mountainbike fahren, an den Seeufern zelten
      sowie Kräuter, Pilze und Waldbeeren sammeln.
    history: >-
      Über Jahrhunderte trieben die Bergbauern ihre Herden im Hochsommer auf diese saftigen Weiden, wenn die
      Weiden im Tiefland der Herzegowina und Bosniens verdorrten. Um die Almflächen stehen bis heute Katuni,
      traditionelle Sommersiedlungen aus einfachen Holzhütten. Aus dieser Hirtenkultur überdauerten Flurnamen,
      steinerne Stećci-Grabmäler und althergebrachte Methoden der Milchverarbeitung und Viehführung.


      Die Berge blicken jedoch auch auf eine kriegerische Geschichte zurück: Im Zweiten Weltkrieg tobte hier
      vom 15. Mai bis zum 16. Juni 1943 die dramatische Schlacht an der Sutjeska. Tatsächlich wurde der
      Nationalpark 1962 in erster Linie zum Gedenken an diese Kämpfe gegründet und ist damit der älteste
      Nationalpark von Bosnien und Herzegowina. Der im Schutzgebiet liegende Urwald Perućica steht auf der
      Tentativliste des UNESCO-Weltnaturerbes.
    before: >-
      Der Park ist fast das ganze Jahr über erreichbar, mit einigen Einschränkungen in den Wintermonaten.
      Perućica unterliegt dem strengsten Schutzstatus: Das Betreten ist strengstens verboten, sofern es nicht
      angemeldet, offiziell genehmigt und von Rangern des Nationalparks begleitet wird. Informiere dich vorab
      bei der Verwaltung über Schneelage und Wegezustand.
    around: >-
      Der Urwald [Prašuma Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) liegt direkt im Park.
      Nur 1 km entfernt beginnt der [Naturpark Piva](/lugar/park-prirode-piva/), und rund 20 km weiter ragen
      das [Durmitor-Massiv](/lugar/nacionalni-park-durmitor---masiv/) und die
      [Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/) auf.
  it:
    intro: >-
      Il fiume Sutjeska ha scavato una gola profonda circa 1200 m. Da una parte si innalzano le muraglie di
      Maglić, Volujak e Bioč; dall’altra si distende la Zelengora, la «Montagna Verde», dolce e dalle creste
      arrotondate, ammantata di boschi secolari, verdi praterie e specchi d’acqua d’origine glaciale. È
      compresa nel Parco Nazionale di Sutjeska (Republika Srpska, tra Foča e Tjentište) e l’ente gestore la
      raccomanda come mèta ideale per le famiglie, poiché i suoi sentieri non presentano particolari asperità
      alpinistiche.
    landscape: >-
      La Zelengora rappresenta il volto accogliente del parco naturale. Lo confermano i guardaparco: dalle
      dorsali morbide e smussate, è l’opposto delle rupi scoscese di Maglić e Volujak. La base calcarea e
      dolomitica è rivestita da formazioni arenacee, consentendo all’acqua di sgorgare in ogni vallone:
      sorgenti limpide, ruscelli e laghi glaciali di circo, chiamati popolarmente gli «occhi della montagna».
      I più celebri sono Kotlaničko, Orlovačko, Štirinsko, Borilovačko, Donje Bare, Gornje Bare, oltre al Lago
      Nero e al Lago Bianco. Nel massiccio nasce inoltre il fiume Neretva.


      Sopra un altopiano ondulato di boschi e pascoli svettano le cime principali: il Bregoč, a 2014 m, e il
      Kozje strane, a 2013 m, che si fronteggiano come due duellanti silenziosi. Attorno, il parco valorizza
      erbe officinali, frutti di bosco, fustaie, pascoli d’alta quota e risorgive. Ogni lago possiede una
      propria identità: ideali per un tuffo rigenerante o per sostare a contemplare il paesaggio.
    wildlife: >-
      L’ente parco attesta che qui si concentrano le popolazioni più numerose di grandi mammiferi, avvistabili
      con regolarità durante le camminate; il sito ufficiale promuove la Zelengora come territorio d’elezione
      per il [lupo](/especie/canis_lupus/). Nell’insieme dell’area protetta sono censiti [orso
      bruno](/especie/ursus_arctos/), [camoscio](/especie/rupicapra_rupicapra/), cinghiale, martore, [gatto
      selvatico](/especie/felis_silvestris/), volpe e capra selvatica, soprattutto nei boschi primigeni di
      Perućica. Inoltre, oltre 300 specie di uccelli popolano le zone umide lacustri; tra quelle nidificanti a
      Perućica si segnalano l’[aquila reale](/especie/aquila_chrysaetos/), il [falco
      pellegrino](/especie/falco_peregrinus/) e la coturnice. Il camoscio vanta un eccellente primato
      gestionale: tra il 1963 e il 1987 ben 256 capi prelevati in questo parco furono trasferiti in altre 13
      aree montane di Bosnia ed Erzegovina e Croazia.


      I tempi della montagna sono scanditi dalla transumanza. Da maggio a settembre migliaia di pecore, capre
      e mucche invadono i pascoli della Zelengora, scortate da pastori e cani da guardia. Per camminare, il
      parco consiglia i circuiti dei laghi tra giugno e novembre.
    visit: >-
      I tracciati partono da Tjentište, nella valle della Sutjeska. Da lì si sale a bordo di fuoristrada fino
      a Borovno brdo, a 1720 m, punto di partenza di varie escursioni.


      Il circuito dei quattro laghi è la traversata più completa. Unisce Kotlaničko, Štirinsko, Borilovačko e
      Orlovačko, presenta un grado di difficoltà impegnativo e richiede tra cinque e sei ore di cammino.
      Štirinsko è il lago maggiore della Zelengora e conserva sulla sponda una necropoli medievale di stećci
      scolpiti. Borilovačko è il solo invaso artificiale.


      Il Bregoč è più accessibile. Lo sviluppo complessivo è di 8,5 km e si conquista la cima in un’ora e
      mezza di salita; il parco lo valuta di difficoltà medio-facile, scendendo poi verso l’Orlovačko. Per chi
      desidera un percorso più contenuto ci sono il Lago Nero e il Lago Bianco, con una gita di sette-otto ore
      totali di cui quattro o cinque di cammino effettivo tra andata e ritorno; dal Lago Bianco sporge uno
      sperone roccioso simile a un trampolino naturale proteso sulle acque, e più in alto, al valico di Ljubin
      grob, sorge un monumento ai partigiani del 1943.


      Sulla Zelengora si pedala anche in mountain bike lungo carrarecce segnalate, si può piantare la tenda
      vicino ai laghi e raccogliere erbe officinali, funghi e bacche.
    history: >-
      Per secoli i pastori hanno condotto le greggi su questi alpeggi estivi quando i pascoli delle pianure di
      Erzegovina e Bosnia inaridivano. Attorno alle radure resistono i katuni, insediamenti montani stagionali
      fatti di baite in legno. Del retaggio pastorale rimangono toponimi, monumenti funerari stećci e antichi
      saperi nella lavorazione del formaggio e nella gestione del bestiame.


      Questi monti conservano anche memorie belliche cruente: durante la Seconda Guerra Mondiale furono teatro
      della celebre battaglia della Sutjeska, svoltasi tra il 15 maggio e il 16 giugno 1943. Il parco fu
      istituito nel 1962 in omaggio a quelle gesta storiche prima ancora che per finalità ecologiche, ed è il
      parco nazionale più antico di Bosnia ed Erzegovina. La riserva vergine di Perućica, compresa nel
      perimetro, è iscritta nella lista propositiva dell’UNESCO.
    before: >-
      Il parco è accessibile per gran parte dell’anno, con restrizioni nella stagione invernale. Perućica gode
      del livello massimo di tutela: l’accesso è rigidamente vietato a meno di previa prenotazione, specifica
      autorizzazione e accompagnamento da parte del personale del parco. Contatta i guardaparco per lo stato
      delle vie d’accesso e le condizioni meteo invernali prima di partire.
    around: >-
      La [Foresta vergine di Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) si trova
      all’interno del parco. A solo 1 km comincia il [Parco naturale di Piva](/lugar/park-prirode-piva/), e a
      circa 20 km si ergono il [massiccio del Durmitor](/lugar/nacionalni-park-durmitor---masiv/) e la [gola
      del Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/).
  pt:
    intro: >-
      O rio Sutjeska escavou um desfiladeiro com cerca de 1200 m de profundidade. De um dos lados erguem-se
      Maglić, Volujak e Bioč; do outro estende-se Zelengora, a «Montanha Verde», de cristas suaves e cumes
      arredondados, coberta por florestas, prados verdejantes e lagoas glaciares. Fica integrada no Parque
      Nacional de Sutjeska (Republika Srpska, entre Foča e Tjentište), sendo recomendada pela administração
      como destino familiar tranquilo por não exigir esforços alpinos desmedidos.
    landscape: >-
      Zelengora é a vertente acolhedora do parque natural. Afirmam-no os próprios técnicos: suave e de formas
      redondas, contrasta com o relevo agreste de Maglić e Volujak. O substrato de calcário e dolomite está
      coberto por camadas de arenito, razão pela qual a água surge em todo o lado: nascentes límpidas,
      ribeiros e lagoas de circo glaciar, carinhosamente denominadas os «olhos da montanha». As mais
      conhecidas são Kotlaničko, Orlovačko, Štirinsko, Borilovačko, Donje Bare, Gornje Bare, bem como o Lago
      Negro e o Lago Branco. No maciço nasce também o rio Neretva.


      Sobre um planalto ondulado de arvoredo e pasto destacam-se os picos cimeiros: Bregoč, com 2014 m, e
      Kozje strane, com 2013 m, que se encaram em confronto silencioso. Em redor, o parque exibe uma notável
      variedade de ervas medicinais, bagas silvestres, matas, pastos de altitude e fontanários naturais. Cada
      lago ostenta o seu encanto: uns convidam a um mergulho fresco, outros à contemplação demorada.
    wildlife: >-
      O parque salienta que aqui residem as densidades mais elevadas de grandes animais selvagens,
      frequentemente observados nas caminhadas; a página oficial descreve Zelengora como o santuário do
      [lobo](/especie/canis_lupus/). No conjunto do parque assinalam-se o
      [urso-pardo](/especie/ursus_arctos/), a [camurça](/especie/rupicapra_rupicapra/), o javali, a marta, o
      [gato-bravo](/especie/felis_silvestris/), a raposa e a cabra-selvagem, sobretudo nas florestas intactas
      de Perućica. Mais de 300 espécies de aves habitam as margens lacustres e as zonas húmidas; entre as
      espécies registadas em Perućica incluem-se a [águia-real](/especie/aquila_chrysaetos/), o
      [falcão-peregrino](/especie/falco_peregrinus/) e a perdiz-mourisca. A camurça constitui um marco de
      conservação exemplar: entre 1963 e 1987 foram translocados 256 espécimes deste parque para outras 13
      regiões montanhosas da Bósnia e Herzegovina e da Croácia.


      O ciclo pastoril rege as estações. De maio a setembro, milhares de ovelhas, cabras e vacas pastam nas
      encostas de Zelengora sob a guarda de pastores e cães de rebanho. Para caminhar, o parque aconselha os
      circuitos dos lagos entre junho e novembro.
    visit: >-
      Os percursos partem habitualmente de Tjentište, no vale do Sutjeska. De lá sobe-se em veículo
      todo-o-terreno até Borovno brdo, aos 1720 m, ponto de partida de várias caminhadas.


      A rota dos quatro lagos é a mais representativa. Enlaça Kotlaničko, Štirinsko, Borilovačko e Orlovačko,
      tem dificuldade exigente e calcula entre cinco e seis horas de marcha. Štirinsko é o maior lago de
      Zelengora e conserva na sua margem uma necrópole medieval de monumentos tumulares stećci. Borilovačko é
      a única albufeira artificial do conjunto.


      A subida ao Bregoč é mais simples. O percurso totaliza 8,5 km e o topo atinge-se numa hora e meia de
      subida; o parque cataloga o trilho como médio a fácil, descendo depois em direção a Orlovačko. Para quem
      busca uma caminhada mais curta, os lagos Negro e Branco oferecem uma jornada de sete a oito horas no
      cômputo geral, com quatro a cinco horas de caminhada efetiva entre ida e volta; do Lago Branco sobressai
      um rochedo suspenso como um trampolim natural sobre as águas, e mais acima, no colo de Ljubin grob,
      ergue-se um monumento de homenagem aos guerrilheiros de 1943.


      Em Zelengora podes igualmente pedalar em BTT por caminhos florestais balizados, acampar nas imediações
      dos lagos e recolher ervas medicinais, cogumelos e frutos silvestres.
    history: >-
      Ao longo dos séculos, os pastores transumantes conduziram os seus rebanhos a estas pastagens de montanha
      quando a estiagem secava os campos baixos da Herzegovina e da Bósnia. À volta dos prados perduram os
      katuni, povoações de montanha sazonais formadas por cabanas de madeira. Dessa cultura pastoril subsistem
      topónimos, estelas funerárias medievais stećci e velhas tradições de queijaria e condução de gado.


      A montanha guarda igualmente memórias dramáticas: no decorrer da Segunda Guerra Mundial desenrolou-se
      aqui a célebre Batalha do Sutjeska, de 15 de maio a 16 de junho de 1943. Na verdade, o parque nacional
      foi formalizado em 1962 em memória dessas batalhas antes de se consolidar a vertente de conservação da
      natureza, sendo o parque nacional mais antigo da Bósnia e Herzegovina. A floresta primitiva de Perućica,
      integrada no perímetro, está inscrita na lista indicativa da UNESCO.
    before: >-
      O parque é acessível na maior parte do ano, com condicionamentos na estação de inverno. Perućica possui
      proteção integral: a entrada é estritamente interdita a menos que seja previamente agendada, devidamente
      autorizada e acompanhada por vigilantes do parque. Informa-te junto da administração sobre o estado das
      estradas e as condições invernais antes de partir.
    around: >-
      A [Floresta Primária de Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/) fica no próprio
      parque. A escasso 1 km dista o [Parque Natural de Piva](/lugar/park-prirode-piva/), e a cerca de 20 km
      erguem-se o [maciço de Durmitor](/lugar/nacionalni-park-durmitor---masiv/) e o [desfiladeiro do
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/).
