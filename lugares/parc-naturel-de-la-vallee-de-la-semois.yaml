resumen:
  es: >-
    Meandros incisos encajados en esquistos de las Ardenas, incluyendo la meandro gigante de la 'Tumba del
    Gigante'.
  en: Incised meanders cut into Ardennes schists, including the giant meander of the "Tomb of the Giant".
  fr: Méandres encaissés dans les schistes des Ardennes, dont le méandre géant du Tombeau du Géant.
  de: Eingeschnittene Mäander in ardenner Schiefer, darunter der Riesenmäander des „Tombeau du Géant".
  it: Meandri incassati negli scisti delle Ardenne, incluso il meandro gigante del "Tombeau du Géant".
  pt: Meandros incisados em xistos das Ardenas, incluindo o meandro gigante do "Tombeau du Géant".
unico:
  es: >-
    Un río de meandros rodeado de bosque antiguo, con cigüeñas negras, martines pescadores y leyendas de
    guerreros tréviros.
  en: >-
    A river of meanders surrounded by ancient forest, with black storks, kingfishers and legends of Treviri
    warriors.
  fr: >-
    Une rivière à méandres entourée de forêt ancienne, avec cigognes noires, martins-pêcheurs et légendes de
    guerriers trévires.
  de: Ein Mäanderfluss umgeben von Urwald, mit Schwarzstörchen, Eisvögeln und Legenden über treverische Krieger.
  it: >-
    Un fiume di meandri circondato da foresta antica, con cicogne nere, martin pescatori e leggende di
    guerrieri treveri.
  pt: >-
    Um rio de meandros rodeado de floresta antiga, com cegonhas-pretas, martins-pescadores e lendas de
    guerreiros tréveros.
observaciones:
  es: >-
    En bicicleta solo se circula por pistas autorizadas de más de un metro de ancho; en canoa y kayak se sale
    y se llega por los puntos señalados, en silencio. Hay cuatro zonas oficiales de vivac, y en ellas está
    prohibido encender fuego bajo cualquier circunstancia. De octubre a diciembre, antes de salir, comprueba
    las restricciones de caza y sigue las señales.
texto:
  es:
    intro: >-
      Un río que da vueltas sobre sí mismo y, en el hueco de una de esas vueltas, una colina cubierta de
      bosque. Así es la imagen más conocida del Semois: el Tombeau du Géant, que se admira desde un mirador en
      Botassart. El Semois, la «reina de los meandros», cruza el parque nacional del Valle del Semois en 167
      km, de Tintigny a Vresse-sur-Semois, y alrededor de él se extiende un territorio de bosques antiguos,
      humedales y agua limpia. La región valona lo designó parque nacional el 9 de diciembre de 2022.
    landscape: >-
      El agua lo ordena todo. Con sus afluentes, el territorio suma cerca de 690 km de cursos de agua.


      Después del agua viene el bosque, que ocupa más del 86 % del parque. La mayoría son frondosas, un 60 %,
      y bosques antiguos, un 65 %. Además de los clásicos robledales-hayedos hay bosques de pendiente (arces
      de barranco, hayedos con luzula), bosques de ribera, carpinares-robledales y fresnedas-robledales.


      Entre los biotopos menos comunes están las megaforbias, los prados magros de siega, los humedales y las
      cavidades subterráneas que dejó la antigua actividad de la pizarra.
    wildlife: >-
      El inventario impresiona: 110 especies de aves nidificantes, el 65 % de las de Valonia; 20 especies de
      murciélagos, de las 24 presentes en Valonia; diez de anfibios y seis de reptiles; 44 de libélulas y
      caballitos del diablo. En el agua viven dos moluscos raros y protegidos, el [mejillón
      perlífero](/especie/margaritifera_margaritifera/) y la náyade espesa.


      Las aves más fáciles de asociar al río son el [martín pescador](/especie/alcedo_atthis/), que anida en
      galerías de las orillas blandas del Semois y puede abandonar la puesta si pasas demasiado cerca; el
      [mirlo acuático](/especie/cinclus_cinclus/); la garceta grande, la serreta grande y la lavandera
      cascadeña; y la [cigüeña negra](/especie/ciconia_nigra/), junto al [pico
      negro](/especie/dryocopus_martius/). El [búho real](/especie/bubo_bubo/), la mayor rapaz nocturna del
      parque, puede abandonar su nido si se le molesta de forma repetida. La [nutria](/especie/lutra_lutra/)
      se ha registrado de nuevo en el valle, y el parque, con WWF Bélgica, trabaja para reforzar las
      poblaciones de nutria y [lince](/especie/lynx_lynx/). La víbora común y el lagarto vivíparo toman el sol
      en los bordes del bosque.


      El calendario del parque pide respeto en cuatro momentos. De febrero a julio crían muchas especies; de
      abril a agosto anidan las aves; en septiembre y octubre es la berrea del
      [ciervo](/especie/cervus_elaphus/), y se pide silencio; y de octubre a diciembre es la temporada de
      caza, con señales y restricciones de acceso temporales.
    visit: >-
      El territorio tiene ocho puertas de entrada, una por municipio, y la herramienta Destination Semois
      sirve para preparar rutas a pie, en bicicleta o a caballo. Guías del territorio y guías de río organizan
      paseos y también se pueden contratar a la carta.


      Cuatro observatorios permiten ver flora y sobre todo fauna sin molestarla; están en Vresse-sur-Semois,
      Poupehan, Herbeumont y Florenville. El Centro de Interpretación Paysalia, en Florenville, ayuda a
      entender los paisajes del valle.


      Los senderos didácticos son la mejor puerta para quien llega sin plan. En el bosque de Defoy, cerca de
      Paliseul, el circuito «Dans la peau d'un blaireau» mide 1,5 km y enseña, con paneles y cabañas de
      actividades sensoriales, cómo vive el tejón. El recorrido narrado «De l'autre côté…» sigue tres
      kilómetros el Semois desde la pasarela de Chiny hasta el Moulin Cambier; en la ruta de Chiny, una
      historia sonora cuenta a los pájaros del río. Y hay un sendero geológico en La Roche à l'Appel, en Muno.


      Entre los lugares imprescindibles: la pasarela del Moulin de l'Épine, inaugurada en 2020, un puente
      colgante de 55 m cerca de Bouillon; el puente de zarzos de Laforêt, de unos 80 m, que se monta y
      desmonta cada año; los meandros del Ménil, entre Breuvanne y Termes, con paneles sobre los combates de
      agosto de 1914; el mirador del Jambon, entre Membre y Bohan, con una vista cenital del Semois 120 m más
      abajo; y el Domaine des Épioux, de más de 1.700 hectáreas entre Chiny y Herbeumont, con cinco estanques
      y bosques variados.
    history: >-
      El valle guarda leyendas. Una cuenta que un guerrero tréviro de gran talla se arrojó desde la Rocher des
      Gattes para escapar de los romanos y que lo enterraron en la colina del Tombeau du Géant. El puente de
      zarzos de Laforêt, por su parte, lo usaban plantadores de tabaco, agricultores y ganado.


      La conservación se centra en el bosque. Las reservas forestales integrales dejan que los procesos
      naturales evolucionen sin intervención, con restricciones de explotación forestal, caza y acceso. El
      parque quiere pasar al menos el 10 % de los bosques de frondosas públicos a esa categoría, lo que daría
      más refugio y alimento a murciélagos, pico negro y mediano, y facilitaría la llegada del lince.
    before: >-
      En bicicleta solo se circula por pistas autorizadas de más de un metro de ancho; en canoa y kayak se
      sale y se llega por los puntos señalados, en silencio. Hay cuatro zonas oficiales de vivac, y en ellas
      está prohibido encender fuego bajo cualquier circunstancia. De octubre a diciembre, antes de salir,
      comprueba las restricciones de caza y sigue las señales.
    around: >-
      Pegado al parque está el [Plateau de la Croix-Scaille](/lugar/plateau-de-la-croix-scaille---masse/); a
      unos 5 km, la [Grande Forêt de Saint-Hubert](/lugar/grande-foret-de-saint-hubert/), y a unos 10 km el
      [Bosque de Anlier](/lugar/foret-d-anlier/).
  en:
    intro: >-
      A river that loops back on itself and, in the hollow of one of those loops, a hill covered in forest.
      That is the most iconic image of the Semois: the Tombeau du Géant, admired from a viewpoint at
      Botassart. The Semois, the "queen of meanders", crosses the Semois Valley National Park for 167 km, from
      Tintigny to Vresse-sur-Semois, and around it stretches a territory of ancient forests, wetlands and
      clean water. The Walloon Region designated it a national park on 9 December 2022.
    landscape: >-
      Water orders everything. Together with its tributaries, the territory totals about 690 km of
      watercourses.


      After water comes the forest, which covers more than 86 % of the park. Most of it is broadleaf, 60 %,
      and ancient woodland, 65 %. Beyond the classic oak-beech woods there are slope forests (sycamore
      ravines, beech-luzula), riparian forests, hornbeam-oak woods and ash-oak woods.


      Among the rarer habitats are tall-herb communities, lean hay meadows, wetlands and underground cavities
      left by the old slate-quarrying industry.
    wildlife: >-
      The inventory is impressive: 110 breeding bird species, 65 % of those of Wallonia; 20 bat species, of
      the 24 present in Wallonia; ten amphibian and six reptile species; 44 dragonfly and damselfly species.
      In the water live two rare and protected molluscs, the [freshwater pearl
      mussel](/especie/margaritifera_margaritifera/) and the thick naiad.


      The birds most easily associated with the river are the [kingfisher](/especie/alcedo_atthis/), which
      nests in galleries on the soft banks of the Semois and may abandon its clutch if you pass too close; the
      [white-throated dipper](/especie/cinclus_cinclus/); the great egret, the goosander and the grey wagtail;
      and the [black stork](/especie/ciconia_nigra/), alongside the [black
      woodpecker](/especie/dryocopus_martius/). The [eagle owl](/especie/bubo_bubo/), the largest nocturnal
      raptor in the park, may desert its nest if repeatedly disturbed. The [otter](/especie/lutra_lutra/) has
      been recorded again in the valley, and the park, together with WWF Belgium, is working to reinforce
      otter and [lynx](/especie/lynx_lynx/) populations. The common viper and the viviparous lizard bask at
      forest edges.


      The park calendar asks for respect at four moments. From February to July many species breed; from April
      to August birds nest; in September and October is the [red deer](/especie/cervus_elaphus/) rut — silence
      is requested; and from October to December is the hunting season, with signs and temporary access
      restrictions.
    visit: >-
      The territory has eight entry points, one per municipality, and the Destination Semois tool helps plan
      walks, cycling routes and horse rides. Local and river guides organise outings and can also be hired
      individually.


      Four hides allow you to observe flora and especially fauna without disturbing it; they are at
      Vresse-sur-Semois, Poupehan, Herbeumont and Florenville. The Paysalia Interpretation Centre, in
      Florenville, helps you understand the valley landscapes.


      Thematic trails are the best entry for those arriving without a plan. In the Defoy forest, near
      Paliseul, the "Dans la peau d'un blaireau" circuit covers 1.5 km and teaches, through panels and sensory
      activity huts, how a badger lives. The narrated route "De l'autre côté…" follows three kilometres of the
      Semois from the Chiny footbridge to the Moulin Cambier; on the Chiny trail, a sound story narrates the
      river birds. And there is a geology trail at La Roche à l'Appel, in Muno.


      Must-see highlights include: the Moulin de l'Épine footbridge, opened in 2020, a 55 m suspension bridge
      near Bouillon; the Laforêt wicker bridge, about 80 m long, assembled and dismantled every year; the
      Ménil meanders, between Breuvanne and Termes, with panels about the fighting of August 1914; the Jambon
      viewpoint, between Membre and Bohan, with an overhead view of the Semois 120 m below; and the Domaine
      des Épioux, more than 1,700 ha between Chiny and Herbeumont, with five ponds and varied woodland.
    history: >-
      The valley holds legends. One tells of a Treviri warrior of great stature who threw himself from the
      Rocher des Gattes to escape the Romans and was buried on the hill of the Tombeau du Géant. The Laforêt
      wicker bridge was used by tobacco growers, farmers and livestock.


      Conservation focuses on the forest. Integral forest reserves let natural processes evolve without
      intervention, with restrictions on timber harvesting, hunting and access. The park aims to convert at
      least 10 % of its public broadleaf forests to that category, which would provide more shelter and food
      for bats, black and middle-spotted woodpeckers, and ease the eventual arrival of the lynx.
    before: >-
      The park asks you to respect breeding seasons: avoid disturbing birds between February and July, stay
      silent during the red deer rut in September and October, and pay attention to temporary access
      restrictions during the hunting season from October to December. Near nesting sites of eagle owls and
      black storks, keep your distance. Stay on marked paths near the eagle owl nests and never approach the
      kingfisher's bank galleries.
    around: >-
      Right next to the park is the [Plateau de la Croix-Scaille –
      Massé](/lugar/plateau-de-la-croix-scaille---masse/); about 5 km away, the [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/); and about 10 km away, the [Forêt
      d'Anlier](/lugar/foret-d-anlier/).
  fr:
    intro: >-
      Une rivière qui se retourne sur elle-même et, dans le creux d'un de ces lacets, une colline couverte de
      forêt. C'est l'image la plus connue de la Semois : le Tombeau du Géant, que l'on admire depuis un
      belvédère à Botassart. La Semois, la « reine des méandres », traverse le parc national de la vallée de
      la Semois sur 167 km, de Tintigny à Vresse-sur-Semois, et autour d'elle s'étend un territoire de forêts
      anciennes, de zones humides et d'eaux claires. La Région wallonne l'a désigné parc national le 9
      décembre 2022.
    landscape: >-
      L'eau ordonne tout. Avec ses affluents, le territoire cumule environ 690 km de cours d'eau.


      Après l'eau vient la forêt, qui couvre plus de 86 % du parc. La majorité est feuillue, 60 %, et de
      vieille forêt, 65 %. Outre les classiques chênaies-hêtraies, on trouve des forêts de pente (érables de
      ravin, hêtraies à luzule), des forêts riveraines, des charmaies-chênaies et des frênaies-chênaies.


      Parmi les milieux plus rares figurent les mégaphorbiaies, les prairies maigres de fauche, les zones
      humides et les cavités souterraines laissées par l'ancienne activité ardoisière.
    wildlife: >-
      L'inventaire impressionne : 110 espèces d'oiseaux nicheurs, soit 65 % de ceux de Wallonie ; 20 espèces
      de chauves-souris sur les 24 présentes en Wallonie ; dix espèces d'amphibiens et six de reptiles ; 44
      espèces de libellules et demoiselles. Dans l'eau vivent deux mollusques rares et protégés, la [mulette
      perlière](/especie/margaritifera_margaritifera/) et la mulette épaisse.


      Les oiseaux les plus associés à la rivière sont le [martin-pêcheur](/especie/alcedo_atthis/), qui niche
      dans des galeries des berges meubles de la Semois et peut abandonner sa couvée si vous passez trop près
      ; le [cincle plongeur](/especie/cinclus_cinclus/) ; la grande aigrette, le grand harle et la
      bergeronnette des ruisseaux ; et la [cigogne noire](/especie/ciconia_nigra/), aux côtés du [pic
      noir](/especie/dryocopus_martius/). Le [grand-duc d'Europe](/especie/bubo_bubo/), le plus grand rapace
      nocturne du parc, peut déserter son nid s'il est dérangé à répétition. La
      [loutre](/especie/lutra_lutra/) a été de nouveau détectée dans la vallée, et le parc, avec WWF Belgique,
      travaille à renforcer les populations de loutres et de [lynx](/especie/lynx_lynx/). La vipère péliade et
      le lézard vivipare se chauffent en lisière de forêt.


      Le calendrier du parc demande le respect à quatre moments. De février à juillet, de nombreuses espèces
      nichent ; d'avril à août, les oiseaux sont en nidification ; en septembre et octobre, c'est le brame du
      [cerf](/especie/cervus_elaphus/), et le silence est demandé ; d'octobre à décembre, c'est la chasse,
      avec des panneaux et des restrictions d'accès temporaires.
    visit: >-
      Le territoire dispose de huit portes d'entrée, une par commune, et l'outil Destination Semois permet de
      préparer des randonnées à pied, à vélo ou à cheval. Des guides du territoire et des guides de rivière
      organisent des sorties et peuvent aussi être engagés à la carte.


      Quatre observatoires permettent d'observer la flore et surtout la faune sans les déranger ; ils se
      trouvent à Vresse-sur-Semois, Poupehan, Herbeumont et Florenville. Le Centre d'Interprétation Paysalia,
      à Florenville, aide à comprendre les paysages de la vallée.


      Les sentiers didactiques sont la meilleure porte d'entrée pour qui arrive sans plan. Dans le bois de
      Defoy, près de Paliseul, le circuit « Dans la peau d'un blaireau » mesure 1,5 km et enseigne, avec des
      panneaux et des cabanes d'activités sensorielles, comment vit le blaireau. Le parcours narré « De
      l'autre côté… » suit trois kilomètres de la Semois depuis la passerelle de Chiny jusqu'au Moulin Cambier
      ; sur le sentier de Chiny, une histoire sonore raconte les oiseaux de la rivière. Il y a aussi un
      sentier géologique à La Roche à l'Appel, à Muno.


      Parmi les incontournables : la passerelle du Moulin de l'Épine, inaugurée en 2020, un pont suspendu de
      55 m près de Bouillon ; le pont de clayonnage de Laforêt, d'environ 80 m, monté et démonté chaque année
      ; les méandres du Ménil, entre Breuvanne et Termes, avec des panneaux sur les combats d'août 1914 ; le
      belvédère du Jambon, entre Membre et Bohan, avec une vue à pic sur la Semois 120 m en contrebas ; et le
      Domaine des Épioux, plus de 1 700 hectares entre Chiny et Herbeumont, avec cinq étangs et des boisements
      variés.
    history: >-
      La vallée garde des légendes. L'une raconte qu'un guerrier trévire de haute taille se jeta du Rocher des
      Gattes pour échapper aux Romains et fut enterré sur la colline du Tombeau du Géant. Le pont de
      clayonnage de Laforêt était utilisé par des planteurs de tabac, des agriculteurs et du bétail.


      La conservation se concentre sur la forêt. Les réserves forestières intégrales laissent les processus
      naturels évoluer sans intervention, avec des restrictions sur l'exploitation forestière, la chasse et
      l'accès. Le parc souhaite convertir au moins 10 % de ses forêts feuillues publiques dans cette
      catégorie, ce qui fournirait plus d'abri et de nourriture aux chauves-souris, aux pics noir et mar, et
      faciliterait l'arrivée du lynx.
    before: >-
      Le parc demande de respecter les saisons de reproduction : évitez de déranger les oiseaux entre février
      et juillet, gardez le silence pendant le brame du cerf en septembre et octobre, et faites attention aux
      restrictions d'accès temporaires durant la chasse d'octobre à décembre. À proximité des nids de
      grand-duc et de cigogne noire, gardez vos distances. Restez sur les sentiers balisés près des nids de
      grand-duc et n'approchez jamais des berges où le martin-pêcheur creuse ses galeries.
    around: >-
      Juste à côté du parc se trouve le [Plateau de la Croix-Scaille –
      Massé](/lugar/plateau-de-la-croix-scaille---masse/) ; à environ 5 km, la [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/) ; et à environ 10 km, la [Forêt
      d'Anlier](/lugar/foret-d-anlier/).
  de:
    intro: >-
      Ein Fluss, der sich um sich selbst dreht, und in einer dieser Windungen ein waldbewachsener Hügel. Das
      ist das bekannteste Bild der Semois: das Tombeau du Géant, das man von einem Aussichtspunkt in Botassart
      bewundert. Die Semois, die „Königin der Mäander", durchquert den Nationalpark Semoistal auf 167 km von
      Tintigny bis Vresse-sur-Semois, und um sie herum erstreckt sich ein Gebiet aus alten Wäldern,
      Feuchtgebieten und sauberem Wasser. Die Wallonische Region erklärte es am 9. Dezember 2022 zum
      Nationalpark.
    landscape: >-
      Das Wasser ordnet alles. Mit seinen Nebenflüssen summiert das Gebiet rund 690 km Fließgewässer.


      Nach dem Wasser kommt der Wald, der mehr als 86 % des Parks bedeckt. Die meisten Bäume sind Laubbäume,
      60 %, und alter Wald, 65 %. Neben den klassischen Eichen-Buchenwäldern gibt es Hangwälder
      (Schluchtwälder mit Ahorn, Hainsimsen-Buchenwälder), Auwälder, Hainbuchen-Eichenwälder und
      Eschen-Eichenwälder.


      Zu den selteneren Biotopen gehören Hochstaudenfluren, magere Mähwiesen, Feuchtgebiete und unterirdische
      Hohlräume aus dem alten Schieferabbau.
    wildlife: >-
      Das Inventar ist beeindruckend: 110 Brutvogelarten, 65 % der wallonischen; 20 Fledermausarten von den 24
      in Wallonien vorkommenden; zehn Amphibien- und sechs Reptilienarten; 44 Libellen- und
      Wasserjungfernarten. Im Wasser leben zwei seltene und geschützte Mollusken, die
      [Flussperlmuschel](/especie/margaritifera_margaritifera/) und die Dicke Flussmuschel.


      Die am stärksten mit dem Fluss verbundenen Vögel sind der [Eisvogel](/especie/alcedo_atthis/), der in
      Galerien der weichen Semois-Ufer nistet und sein Gelege verlassen kann, wenn du zu nahe kommst; die
      [Wasseramsel](/especie/cinclus_cinclus/); der Silberreiher, der Gänsesäger und die Gebirgsstelze; und
      der [Schwarzstorch](/especie/ciconia_nigra/), neben dem [Schwarzspecht](/especie/dryocopus_martius/).
      Der [Uhu](/especie/bubo_bubo/), der größte Nachtgreif des Parks, kann sein Nest verlassen, wenn er
      wiederholt gestört wird. Die [Fischotter](/especie/lutra_lutra/) wurde wieder im Tal nachgewiesen, und
      der Park arbeitet mit WWF Belgien daran, die Otter- und [Luchspopulationen](/especie/lynx_lynx/) zu
      stärken. Die Kreuzotter und die Waldeidechse sonnen sich an Waldrändern.


      Der Parkskalender verlangt Rücksicht zu vier Zeitpunkten. Von Februar bis Juli brüten viele Arten; von
      April bis August nisten die Vögel; im September und Oktober ist die Brunft des
      [Rothirsches](/especie/cervus_elaphus/), und Stille ist erbeten; von Oktober bis Dezember ist
      Jagdsaison, mit Schildern und vorübergehenden Zugangsbeschränkungen.
    visit: >-
      Das Gebiet hat acht Eingangspforten, eine pro Gemeinde, und das Tool Destination Semois hilft, Wander-,
      Rad- und Reitrouten zu planen. Gebiets- und Flussführer organisieren Ausflüge und sind auch auf Anfrage
      buchbar.


      Vier Beobachtungsstationen ermöglichen das Beobachten von Flora und vor allem Fauna ohne Störung; sie
      befinden sich in Vresse-sur-Semois, Poupehan, Herbeumont und Florenville. Das Interpretationszentrum
      Paysalia in Florenville hilft, die Landschaften des Tales zu verstehen.


      Lehrpfade sind der beste Einstieg für Ankommende ohne Plan. Im Wald von Defoy bei Paliseul misst der
      Rundweg „Dans la peau d'un blaireau" 1,5 km und zeigt mit Tafeln und Sinneshütten, wie ein Dachs lebt.
      Der erzählte Weg „De l'autre côté…" folgt drei Kilometern der Semois von der Stegbrücke Chiny bis zur
      Mühle Cambier; auf dem Chiny-Pfad erzählt eine Klanggeschichte von den Flussvögeln. Und in Muno gibt es
      einen Geologiepfad bei La Roche à l'Appel.


      Unter den Pflichtzielen: die Stegbrücke am Moulin de l'Épine, eingeweiht 2020, eine 55 m lange
      Hängebrücke bei Bouillon; die Flechtwerkbrücke von Laforêt, etwa 80 m, die jedes Jahr auf- und abgebaut
      wird; die Ménil-Mäander zwischen Breuvanne und Termes mit Tafeln über die Kämpfe vom August 1914; der
      Aussichtspunkt Jambon zwischen Membre und Bohan mit einer Senkrechtsicht auf die Semois 120 m tiefer;
      und das Domaine des Épioux, mehr als 1.700 Hektar zwischen Chiny und Herbeumont, mit fünf Teichen und
      vielfältigen Wäldern.
    history: >-
      Das Tal hält Legenden bereit. Eine erzählt, dass ein treverischer Krieger von großer Statur sich vom
      Rocher des Gattes stürzte, um den Römern zu entkommen, und auf dem Hügel des Tombeau du Géant begraben
      wurde. Die Flechtwerkbrücke von Laforêt wurde von Tabakpflanzern, Bauern und Vieh genutzt.


      Der Naturschutz konzentriert sich auf den Wald. Integrale Waldreservate lassen natürliche Prozesse ohne
      Eingriff ablaufen, mit Einschränkungen für Holzeinschlag, Jagd und Zugang. Der Park möchte mindestens 10
      % seiner öffentlichen Laubwälder in diese Kategorie überführen, was Fledermäusen, Schwarz- und
      Mittelspecht mehr Unterschlupf und Nahrung bieten und die eventuelle Ankunft des Luchses erleichtern
      würde.
    before: >-
      Der Park bittet um Rücksicht auf die Brutzeiten: Störe Vögel nicht zwischen Februar und Juli, schweige
      während der Rothirschbrunft im September und Oktober, und beachte die vorübergehenden
      Zugangsbeschränkungen während der Jagdsaison von Oktober bis Dezember. In der Nähe von Uhu- und
      Schwarzstorchnestern halte Abstand. Bleib auf markierten Wegen nahe der Uhunester und nähere dich nie
      den Ufergalerien des Eisvogels.
    around: >-
      Direkt neben dem Park liegt das [Plateau de la Croix-Scaille –
      Massé](/lugar/plateau-de-la-croix-scaille---masse/); etwa 5 km entfernt der [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/); und etwa 10 km entfernt der [Forêt
      d'Anlier](/lugar/foret-d-anlier/).
  it:
    intro: >-
      Un fiume che si avvolge su se stesso e, nel cavo di uno di questi giri, una collina coperta di bosco. È
      l'immagine più nota della Semois: il Tombeau du Géant, che si ammira da un belvedere a Botassart. La
      Semois, la "regina dei meandri", attraversa il parco nazionale della valle della Semois per 167 km, da
      Tintigny a Vresse-sur-Semois, e attorno ad essa si estende un territorio di foreste antiche, zone umide
      e acque pulite. La Regione vallona l'ha designato parco nazionale il 9 dicembre 2022.
    landscape: >-
      L'acqua ordina tutto. Con i suoi affluenti, il territorio totalizza circa 690 km di corsi d'acqua.


      Dopo l'acqua viene la foresta, che copre più dell' 86 % del parco. La maggior parte è a latifoglie, il
      60 %, e foresta antica, il 65 %. Oltre alle classiche querceto-faggete ci sono foreste di versante
      (acero di forra, faggete a luzula), foreste ripariali, carpineti-querceti e frassineti-querceti.


      Tra i biotopi più rari ci sono le megaforbie, i prati magri da sfalcio, le zone umide e le cavità
      sotterranee lasciate dall'antica attività dell'ardesia.
    wildlife: >-
      L'inventario colpisce: 110 specie di uccelli nidificanti, il 65 % di quelle della Vallonia; 20 specie di
      pipistrelli, delle 24 presenti in Vallonia; dieci specie di anfibi e sei di rettili; 44 specie di
      libellule e damigelle. Nell'acqua vivono due molluschi rari e protetti, la [cozza perlata d'acqua
      dolce](/especie/margaritifera_margaritifera/) e la Unio crassus.


      Gli uccelli più facilmente associati al fiume sono il [martin pescatore](/especie/alcedo_atthis/), che
      nidifica in gallerie sulle sponde morbide della Semois e può abbandonare la covata se ti avvicini
      troppo; il [merlo acquaiolo](/especie/cinclus_cinclus/); l'airone bianco maggiore, il smergo maggiore e
      la ballerina bianca montana; e la [cicogna nera](/especie/ciconia_nigra/), accanto al [picchio
      nero](/especie/dryocopus_martius/). Il [gufo reale](/especie/bubo_bubo/), il più grande rapace notturno
      del parco, può abbandonare il nido se disturbato ripetutamente. La [lontra](/especie/lutra_lutra/) è
      stata di nuovo rilevata nella valle, e il parco, con WWF Belgio, lavora per rafforzare le popolazioni di
      lontra e [lince](/especie/lynx_lynx/). La vipera comune e la lucertola vivipara si soleggiano ai margini
      del bosco.


      Il calendario del parco chiede rispetto in quattro momenti. Da febbraio a luglio nidificano molte
      specie; da aprile ad agosto nidificano gli uccelli; a settembre e ottobre è il bramito del
      [cervo](/especie/cervus_elaphus/), e si chiede silenzio; da ottobre a dicembre è la stagione della
      caccia, con segnali e restrizioni di accesso temporanee.
    visit: >-
      Il territorio ha otto porte di ingresso, una per comune, e lo strumento Destination Semois aiuta a
      pianificare escursioni a piedi, in bicicletta o a cavallo. Guide del territorio e guide fluviali
      organizzano uscite e possono essere ingaggiate anche su richiesta.


      Quattro osservatori permettono di osservare flora e soprattutto fauna senza disturbarla; si trovano a
      Vresse-sur-Semois, Poupehan, Herbeumont e Florenville. Il Centro d'Interpretazione Paysalia, a
      Florenville, aiuta a capire i paesaggi della valle.


      I sentieri didattici sono il miglior ingresso per chi arriva senza un piano. Nel bosco di Defoy, vicino
      a Paliseul, il circuito "Dans la peau d'un blaireau" misura 1,5 km e insegna, con pannelli e capanne di
      attività sensoriali, come vive il tasso. Il percorso narrato "De l'autre côté…" segue tre chilometri
      della Semois dalla passerella di Chiny fino al Moulin Cambier; sul sentiero di Chiny, una storia sonora
      racconta gli uccelli del fiume. E c'è un sentiero geologico a La Roche à l'Appel, a Muno.


      Tra le tappe imperdibili: la passerella del Moulin de l'Épine, inaugurata nel 2020, un ponte sospeso di
      55 m vicino a Bouillon; il ponte di vimini di Laforêt, circa 80 m, montato e smontato ogni anno; i
      meandri del Ménil, tra Breuvanne e Termes, con pannelli sui combattimenti dell'agosto 1914; il belvedere
      del Jambon, tra Membre e Bohan, con una vista a picco sulla Semois 120 m sotto; e il Domaine des Épioux,
      più di 1 700 ettari tra Chiny e Herbeumont, con cinque stagni e boschi variati.
    history: >-
      La valle custodisce leggende. Una racconta che un guerriero trevero di grande statura si gettò dalla
      Rocher des Gattes per sfuggire ai Romani e fu sepolto sulla collina del Tombeau du Géant. Il ponte di
      vimini di Laforêt era usato da coltivatori di tabacco, contadini e bestiame.


      La conservazione si concentra sulla foresta. Le riserve forestali integrali lasciano evolvere i processi
      naturali senza intervento, con restrizioni sul taglio del legno, la caccia e l'accesso. Il parco mira a
      convertire almeno il 10 % delle sue foreste di latifoglie pubbliche in questa categoria, fornendo più
      riparo e cibo a pipistrelli, picchio nero e picchio rosso mezzano, e agevolando l'eventuale arrivo della
      lince.
    before: >-
      Il parco chiede di rispettare le stagioni riproduttive: evita di disturbare gli uccelli tra febbraio e
      luglio, stai in silenzio durante il bramito del cervo a settembre e ottobre, e fai attenzione alle
      restrizioni di accesso temporanee durante la caccia da ottobre a dicembre. Vicino ai nidi di gufo reale
      e cicogna nera, mantieni le distanze. Resta sui sentieri segnalati vicino ai nidi del gufo reale e non
      avvicinarti mai alle gallerie del martin pescatore.
    around: >-
      Proprio accanto al parco si trova il [Plateau de la Croix-Scaille –
      Massé](/lugar/plateau-de-la-croix-scaille---masse/); a circa 5 km, la [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/); e a circa 10 km, la [Forêt
      d'Anlier](/lugar/foret-d-anlier/).
  pt:
    intro: >-
      Um rio que dá voltas sobre si mesmo e, no interior de uma dessas voltas, uma colina coberta de floresta.
      Essa é a imagem mais conhecida do Semois: o Tombeau du Géant, admirado de um miradouro em Botassart. O
      Semois, a "rainha dos meandros", atravessa o parque nacional do vale do Semois ao longo de 167 km, de
      Tintigny a Vresse-sur-Semois, e à sua volta estende-se um território de florestas antigas, zonas húmidas
      e água limpa. A Região Valona designou-o parque nacional a 9 de dezembro de 2022.
    landscape: >-
      A água ordena tudo. Com os seus afluentes, o território totaliza cerca de 690 km de cursos de água.


      Depois da água vem a floresta, que cobre mais de 86 % do parque. A maioria é folhosa, 60 %, e floresta
      antiga, 65 %. Para além dos clássicos carvalhal-faial, há florestas de encosta (bordos-de-ravina,
      faiais-de-luzula), florestas ribeirinhas, carvalhal-carpa e freixal-carvalhal.


      Entre os biótopos mais raros estão as megafórbias, os prados magros de corte, as zonas húmidas e as
      cavidades subterrâneas deixadas pela antiga actividade da ardósia.
    wildlife: >-
      O inventário impressiona: 110 espécies de aves nidificantes, 65 % das da Valónia; 20 espécies de
      morcegos, das 24 presentes na Valónia; dez espécies de anfíbios e seis de répteis; 44 espécies de
      libélulas e donzelinhas. Na água vivem dois moluscos raros e protegidos, o [mexilhão perlífero de
      rio](/especie/margaritifera_margaritifera/) e o Unio crassus.


      As aves mais facilmente associadas ao rio são o [guarda-rios](/especie/alcedo_atthis/), que nidifica em
      galerias nas margens moles do Semois e pode abandonar a postura se te aproximares demasiado; o
      [melro-d'água](/especie/cinclus_cinclus/); a garça-branca-grande, o mergansão e a alvéola-cinzenta; e a
      [cegonha-preta](/especie/ciconia_nigra/), ao lado do [pica-pau-preto](/especie/dryocopus_martius/). O
      [bufo-real](/especie/bubo_bubo/), a maior rapina nocturna do parque, pode abandonar o ninho se for
      perturbado repetidamente. A [lontra](/especie/lutra_lutra/) foi de novo detectada no vale, e o parque,
      com o WWF Bélgica, trabalha para reforçar as populações de lontra e [lince](/especie/lynx_lynx/). A
      víbora-comum e o lagarto-vivíparo aquecem-se nas bordas da floresta.


      O calendário do parque pede respeito em quatro momentos. De fevereiro a julho nidificam muitas espécies;
      de abril a agosto as aves estão a nidificar; em setembro e outubro é o berreiro do
      [veado](/especie/cervus_elaphus/), pedindo-se silêncio; e de outubro a dezembro é a época de caça, com
      sinais e restrições de acesso temporárias.
    visit: >-
      O território tem oito portas de entrada, uma por município, e a ferramenta Destination Semois serve para
      preparar percursos a pé, de bicicleta ou a cavalo. Guias do território e guias de rio organizam passeios
      e também se podem contratar individualmente.


      Quatro observatórios permitem ver flora e sobretudo fauna sem a perturbar; ficam em Vresse-sur-Semois,
      Poupehan, Herbeumont e Florenville. O Centro de Interpretação Paysalia, em Florenville, ajuda a
      compreender as paisagens do vale.


      Os percursos didácticos são a melhor porta de entrada para quem chega sem plano. Na floresta de Defoy,
      perto de Paliseul, o circuito "Dans la peau d'un blaireau" mede 1,5 km e ensina, com painéis e cabanas
      de actividades sensoriais, como vive o texugo. O percurso narrado "De l'autre côté…" segue três
      quilómetros do Semois desde a passarela de Chiny até ao Moulin Cambier; na rota de Chiny, uma história
      sonora conta as aves do rio. E há um percurso geológico em La Roche à l'Appel, em Muno.


      Entre os pontos obrigatórios: a passarela do Moulin de l'Épine, inaugurada em 2020, uma ponte suspensa
      de 55 m perto de Bouillon; a ponte de fasquias de Laforêt, de cerca de 80 m, montada e desmontada todos
      os anos; os meandros do Ménil, entre Breuvanne e Termes, com painéis sobre os combates de agosto de
      1914; o miradouro do Jambon, entre Membre e Bohan, com uma vista aérea do Semois 120 m abaixo; e o
      Domaine des Épioux, mais de 1 700 hectares entre Chiny e Herbeumont, com cinco lagoas e florestas
      variadas.
    history: >-
      O vale guarda lendas. Uma conta que um guerreiro trévero de grande estatura se lançou da Rocher des
      Gattes para escapar dos romanos e foi enterrado na colina do Tombeau du Géant. A ponte de fasquias de
      Laforêt era usada por cultivadores de tabaco, agricultores e gado.


      A conservação centra-se na floresta. As reservas florestais integrais deixam os processos naturais
      evoluir sem intervenção, com restrições à exploração florestal, à caça e ao acesso. O parque pretende
      converter pelo menos 10 % das suas florestas de folha caduca públicas nessa categoria, o que
      proporcionaria mais abrigo e alimento a morcegos, pica-pau-preto e pica-pau-malhado-grande, e
      facilitaria a eventual chegada do lince.
    before: >-
      O parque pede que respeites as épocas de reprodução: evita perturbar as aves entre fevereiro e julho,
      guarda silêncio durante o berreiro do veado em setembro e outubro, e presta atenção às restrições de
      acesso temporárias durante a época de caça de outubro a dezembro. Perto dos ninhos de bufo-real e
      cegonha-preta, mantém distância. Fica nos percursos sinalizados perto dos ninhos do bufo-real e nunca te
      aproximes das galerias do guarda-rios.
    around: >-
      Mesmo ao lado do parque fica o [Plateau de la Croix-Scaille –
      Massé](/lugar/plateau-de-la-croix-scaille---masse/); a cerca de 5 km, a [Grande Floresta de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/); e a cerca de 10 km, a [Floresta de
      Anlier](/lugar/foret-d-anlier/).
