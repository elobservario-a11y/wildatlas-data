resumen:
  es: >-
    La alta montaña granítica que corona el Sistema Central (Peñalosa 2.428 m), La Pedriza y el histórico
    Pinar de Valsaín.
  en: >-
    The granitic high mountain crowning the Central System (Peñalara 2,428 m), La Pedriza, and the historic
    Pine Forest of Valsaín.
  fr: >-
    La haute montagne granitique qui couronne le Système central (Peñalara 2 428 m), La Pedriza et la pinède
    historique de Valsaín.
  de: >-
    Das hochalpine Granitgebirge, das das Kastilische Scheidegebirge krönt (Peñalara 2.428 m), La Pedriza und
    der historische Kiefernwald von Valsaín.
  it: >-
    L'alta montagna granitica che corona il Sistema Centrale (Peñalara 2.428 m), La Pedriza e la storica
    pineta di Valsaín.
  pt: >-
    A alta montanha granítica que coroa o Sistema Central (Peñalara 2.428 m), La Pedriza e o histórico Pinhal
    de Valsaín.
unico:
  es: >-
    Una montaña mediterránea con restos glaciares y un batolito de granito, La Pedriza, que es un museo al
    aire libre de formas esculpidas por la erosión.
  en: >-
    A Mediterranean mountain range bearing glacial relics and a monumental granite batholith, La Pedriza,
    which forms an open-air museum sculpted by natural erosion.
  fr: >-
    Une montagne méditerranéenne aux vestiges glaciaires et un batholite de granit, La Pedriza, qui forme un
    musée à ciel ouvert de formes sculptées par l'érosion.
  de: >-
    Ein mediterranes Hochgebirge mit eiszeitlichen Spuren und ein riesiger Granitbatholith, La Pedriza, der
    ein Freilichtmuseum erosionsgeformter Felsgestalten darstellt.
  it: >-
    Una montagna mediterranea con testimonianze glaciali e un batolite di granito, La Pedriza, che costituisce
    un museo a cielo aperto di forme scolpite dall'erosione.
  pt: >-
    Uma montanha mediterrânica com vestígios glaciares e um batólito de granito, La Pedriza, que constitui um
    museu ao ar livre de relevos esculpidos pela erosão.
observaciones:
  es: >-
    El acceso en vehículo privado a La Pedriza está regulado por la gran afluencia de visitantes, y el macizo
    de Peñalara tiene un cupo diario y normas específicas para las visitas en grupo. La Zona del Zabala puede
    complicarse con nieve o hielo; consulta antes en el centro de visitantes. Mira el estado de las rutas y
    los avisos del parque antes de salir.
texto:
  es:
    intro: >-
      En la sierra de Guadarrama la nieve es cosa seria. En el Puerto de Navacerrada, a 1894 m, caen 1223 mm
      al año, hay 71 días de nevadas de media y la temperatura de enero baja hasta los -0,4 °C de media. El
      Parque Nacional de la Sierra de Guadarrama protege ese mundo de frío entre Madrid y Castilla y León:
      lagunas glaciares, pinares de pino albar, granito en forma de riscos y una fauna que incluye el lobo,
      que ha vuelto, y el desmán ibérico, que se daba por perdido. Nació por la Ley 7/2013, de 25 de junio,
      con 33 960 hectáreas repartidas entre Madrid y Castilla y León.
    landscape: >-
      Todo empieza hace unos 500 millones de años, con la roca más antigua de la sierra, el gneis. Después, en
      la orogenia Hercínica, nació el granito. Y mucho más tarde, la orogenia Alpina levantó el Sistema
      Central a bloques, hundidos y levantados, por el choque de las placas africana e Ibérica. Esa es la
      sierra.


      Luego llegó el hielo. En el macizo de Peñalara, el glaciar llenó la cabecera del torrente desde Dos
      Hermanas, terminó a 1.870 m y recorrió 2,5 km; cuando se retiró dejó circos, morrenas y lagunas de alta
      montaña. La laguna Grande de Peñalara está a 2.019 m, en el circo que lleva su nombre, y apenas llega a
      4,7 m de profundidad. Los humedales del macizo son sitio Ramsar, y la laguna sufrió un deterioro por un
      uso turístico inadecuado que obligó a una restauración ecológica: por eso hoy su visita tiene
      limitaciones.


      En la vertiente sur está La Pedriza, un batolito granítico de unas 3.200 hectáreas nacido en el
      Carbonífero. La erosión lo ha trabajado en pilancones, marmitas, taffonis, domos, crestas y berrocales,
      y a los riscos se les ha puesto nombre: el Yelmo, el Pájaro, la Foca, el Camello, el Elefantito, Canto
      Cochino.


      La vegetación sube por pisos. Los pinares de pino albar son los bosques más representativos y extensos,
      y alcanzan rodales por encima de los 2.100 m. Sobre ellos se extienden piornales de piorno serrano y
      enebrales de enebro rastrero; y cerca de las cumbres, pastizales de Festuca curvifolia. Quedan también
      rodales relictos de abedul y de tejo; el del Arroyo Barondillo es un árbol singular de más de 1.500
      años.
    wildlife: >-
      Hay 135 especies de aves con presencia regular. Entre las de montaña, el mirlo acuático, el pechiazul y
      el verderón serrano; entre las grandes, el [buitre negro](/especie/aegypius_monachus/), el [águila
      imperial](/especie/aquila_adalberti/), el [águila real](/especie/aquila_chrysaetos/), el [milano
      real](/especie/milvus_milvus/) y el [halcón peregrino](/especie/falco_peregrinus/). Desde que empezó el
      seguimiento de la colonia, se han marcado 1586 buitres negros con anillas de lectura a distancia.


      Entre los 61 mamíferos hay 6 endemismos ibéricos, como la liebre ibérica, el topo ibérico y el [desmán
      ibérico](/especie/galemys_pyrenaicus/), que se creía extinguido en la sierra y mantiene una pequeña
      población en la vertiente segoviana. El [lobo](/especie/canis_lupus/) volvió tras desaparecer hace más
      de un siglo y está en expansión. El relieve agreste conserva grandes mamíferos como el
      [corzo](/especie/capreolus_capreolus/), el [gato montés](/especie/felis_silvestris/), la
      [nutria](/especie/lutra_lutra/) y el tejón, y la [cabra montés](/especie/capra_pyrenaica/) ha llegado
      con repoblaciones. Los murciélagos suman 23 especies. Una amenaza: el visón americano, escapado de
      granjas peleteras, daña al desmán y a los anfibios.


      La temporada de visita va de mayo a octubre; en invierno la nieve y el hielo complican las rutas de
      altura.
    visit: >-
      Hay cinco centros de visitantes: Peñalara, Valle de La Fuenfría, Valle de El Paular, Valsaín–Boca del
      Asno y La Pedriza, más el punto de información de Canto Cochino.


      Rutas, de más fácil a más exigente. El paseo azul de Valsaín cruza el Eresma por el puente de
      Navalcarreta, y el paseo del bosque de Valsaín incorpora paradas sobre botánica, el arroyo Peñalara y
      los usos tradicionales. La Zona del Zabala, desde el Centro de Visitantes Peñalara hasta el refugio
      sobre la laguna Grande, mide 4,7 km y 279 m de desnivel acumulado, para principiantes. La Calzada
      Romana, de 5,5 km y unas 2 h 50 min, sube desde el Centro de Visitantes Valle de La Fuenfría hasta el
      puerto, por un trazado que unía Titulcia con Segovia. Las laderas de la Mujer Muerta suman 9,2 km y 2 h
      35 min. De Canto Cochino al Tolmo hay 5,8 km de ida y vuelta, para senderistas avanzados, con puntos de
      interés geológico. La travesía del Camino Schmid, el puerto de Fuenfría y el collado Ventoso mide 12 km
      y unas cuatro horas.
    history: >-
      Los humedales del macizo de Peñalara son sitio Ramsar, de importancia internacional. El parque declarado
      en 2013 reúne zonas de Madrid y Castilla y León.
    before: >-
      El acceso en vehículo privado a La Pedriza está regulado por la gran afluencia de visitantes, y el
      macizo de Peñalara tiene un cupo diario y normas específicas para las visitas en grupo. La Zona del
      Zabala puede complicarse con nieve o hielo; consulta antes en el centro de visitantes. Mira el estado de
      las rutas y los avisos del parque antes de salir.
    around: >-
      A unos veintisiete kilómetros está el [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/). Más lejos, el [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) y el [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/) comparten con Guadarrama el águila
      imperial y el buitre negro.
  en:
    intro: >-
      In the Sierra de Guadarrama, snow is serious business. At the Puerto de Navacerrada, at 1894 m, 1223 mm
      of precipitation fall annually, there are an average of 71 snowfall days, and the average January
      temperature drops to -0.4 °C. The Sierra de Guadarrama National Park protects this cold realm between
      Madrid and Castilla y León: glacial tarns, Scots pine woodlands, jagged granite crags, and wildlife that
      includes the returning wolf and the Pyrenean desman, once feared lost. It was established by Law 7/2013,
      of 25 June, covering 33,960 hectares divided between Madrid and Castilla y León.
    landscape: >-
      It all began roughly 500 million years ago with the oldest rock in the range: gneiss. Later, during the
      Hercynian orogeny, granite formed. Much later, the Alpine orogeny thrust up the Central System in tilted
      fault-blocks, uplifted and dropped as the African and Iberian plates collided. That is the sierra.


      Then came the ice. In the Peñalara massif, the glacier filled the torrent headwaters from Dos Hermanas,
      terminating at 1,870 m after travelling 2.5 km; as it retreated it carved cirques, moraines, and
      high-mountain tarns. Laguna Grande de Peñalara sits at 2,019 m within its namesake cirque, reaching
      barely 4.7 m in depth. The wetlands of the massif are a Ramsar site, and the main tarn suffered
      degradation from excessive tourism that required ecological restoration: that is why visits today are
      regulated.


      On the southern slope lies La Pedriza, a granitic batholith of some 3,200 hectares born during the
      Carboniferous. Weathering has sculpted it into pans, potholes, taffoni, domes, ridges, and boulder
      piles, and its crags bear popular names: El Yelmo, El Pájaro, La Foca, El Camello, El Elefantito, Canto
      Cochino.


      Vegetation ascends through altitudinal belts. Scots pine forests are the most extensive and
      characteristic woods, with stands reaching above 2,100 m. Above them stretch mountain scrub of broom and
      creeping juniper; near the summits lie grasslands of Festuca curvifolia. Relict groves of birch and yew
      also persist; the yew at Arroyo Barondillo is a monumental specimen over 1,500 years old.
    wildlife: >-
      There are 135 bird species regularly recorded. Among montane species are the white-throated dipper,
      bluethroat, and citril finch; among raptors, the [cinereous vulture](/especie/aegypius_monachus/),
      [Spanish imperial eagle](/especie/aquila_adalberti/), [golden eagle](/especie/aquila_chrysaetos/), [red
      kite](/especie/milvus_milvus/), and [peregrine falcon](/especie/falco_peregrinus/). Since monitoring
      began, 1586 cinereous vultures have been marked with readable rings.


      Among the 61 mammals, 6 are Iberian endemics, such as the Iberian hare, Iberian mole, and [Pyrenean
      desman](/especie/galemys_pyrenaicus/), which was thought extinct in the range and maintains a small
      relict population on the Segovian slope. The [grey wolf](/especie/canis_lupus/) has returned after
      vanishing over a century ago and is expanding. The rugged terrain sustains large mammals including the
      [roe deer](/especie/capreolus_capreolus/), [European wildcat](/especie/felis_silvestris/), [Eurasian
      otter](/especie/lutra_lutra/), and badger, while the [Spanish ibex](/especie/capra_pyrenaica/) was
      reintroduced. Bats number 23 species. One key threat: the American mink, escaped from fur farms, preys
      upon both desman and amphibians.


      The main visiting season runs from May to October; in winter, snow and ice complicate high-elevation
      routes.
    visit: >-
      There are five visitor centres: Peñalara, Valle de La Fuenfría, Valle de El Paular, Valsaín–Boca del
      Asno, and La Pedriza, plus the information kiosk at Canto Cochino.


      Trails range from gentle to demanding. The blue walk of Valsaín crosses the Eresma over the Navalcarreta
      bridge, while the Valsaín forest walk features interpretive stops on botany, the Peñalara brook, and
      historical forestry. The Zona del Zabala, running from the Peñalara Visitor Centre to the refuge
      overlooking Laguna Grande, covers 4.7 km with 279 m of elevation gain, suitable for beginner hikers. The
      Calzada Romana spans 5.5 km taking about 2 h 50 min, climbing from the Valle de La Fuenfría centre to
      the pass along an ancient road connecting Titulcia and Segovia. The slopes of La Mujer Muerta cover 9.2
      km and 2 h 35 min. From Canto Cochino to El Tolmo is 5.8 km round trip for experienced walkers, passing
      notable geological points. The crossing of the Schmid trail, Fuenfría pass, and Collado Ventoso spans 12
      km and takes roughly four hours.


      Choose routes suited to your fitness and check conditions.
    history: >-
      The wetlands of the Peñalara massif are a Ramsar wetland of international importance. The national park
      established in 2013 brings together contiguous protected lands in Madrid and Castilla y León.
    before: >-
      Private vehicle access to La Pedriza is regulated due to heavy visitation, and the Peñalara massif
      imposes daily quotas and specific group rules. The Zabala area can become hazardous under snow or ice;
      inquire first at the visitor centre. Check trail conditions and weather advisories before setting out.
    around: >-
      Around twenty-seven kilometres away lies [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/). Further afield, [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) and [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/) share with Guadarrama the Spanish
      imperial eagle and cinereous vulture.
  fr:
    intro: >-
      Dans la sierra de Guadarrama, la neige ne plaisante pas. Au col de Navacerrada, à 1894 m, il tombe 1223
      mm par an, on compte 71 jours de neige en moyenne et la température de janvier chute à -0,4 °C en
      moyenne. Le parc national de la Sierra de Guadarrama protège cet univers froid entre Madrid et
      Castille-et-León : lagunes glaciaires, pinèdes de pin sylvestre, falaises de granit et une faune
      comprenant le loup, de retour, et le desman des Pyrénées, que l'on croyait disparu. Il a été créé par la
      loi 7/2013, du 25 juin, avec 33 960 hectares partagés entre Madrid et Castille-et-León.
    landscape: >-
      Tout commence il y a environ 500 millions d'années avec la roche la plus ancienne de la sierra, le
      gneiss. Plus tard, lors de l'orogenèse hercynienne, le granit s'est formé. Bien plus tard, l'orogenèse
      alpine a soulevé le Système central par blocs faillés sous la collision des plaques africaine et
      ibérique. Telle est la sierra.


      Puis vint la glace. Dans le massif de Peñalara, le glacier a comblé le haut bassin depuis Dos Hermanas,
      s'est achevé à 1 870 m et s'est étendu sur 2,5 km ; en se retirant, il a laissé cirques, moraines et
      lagunes d'altitude. La laguna Grande de Peñalara se trouve à 2 019 m dans son cirque éponyme,
      n'atteignant que 4,7 m de profondeur. Les zones humides du massif sont un site Ramsar, et la lagune a
      souffert d'une surfréquentation touristique qui a nécessité une restauration écologique : c'est pourquoi
      sa visite fait aujourd'hui l'objet de restrictions.


      Sur le versant sud s'étend La Pedriza, un batholite granitique d'environ 3 200 hectares né au
      Carbonifère. L'érosion y a façonné vasques, marmites, taffonis, dômes, arêtes et chaos rocheux, et les
      falaises ont reçu des noms évocateurs : El Yelmo, El Pájaro, La Foca, El Camello, El Elefantito, Canto
      Cochino.


      La végétation s'étage en altitude. Les pinèdes de pin sylvestre constituent les forêts les plus
      caractéristiques et étendues, atteignant des peuplements au-dessus de 2 100 m. Au-dessus s'étendent les
      landes de genêt purgatif et de genévrier nain ; près des sommets dominent les pelouses de Festuca
      curvifolia. Des îlots relictes de bouleau et d'if subsistent ; celui de l'Arroyo Barondillo est un arbre
      remarquable de plus de 1 500 ans.
    wildlife: >-
      On compte 135 espèces d'oiseaux à présence régulière. Parmi les espèces de montagne, le cincle plongeur,
      la gorgebleue à miroir et le venturon montagnard ; parmi les grands rapaces, le [vautour
      moine](/especie/aegypius_monachus/), l'[aigle ibérique](/especie/aquila_adalberti/), l'[aigle
      royal](/especie/aquila_chrysaetos/), le [milan royal](/especie/milvus_milvus/) et le [faucon
      pèlerin](/especie/falco_peregrinus/). Depuis le début du suivi de la colonie, 1586 vautours moines ont
      été marqués avec des bagues lisibles à distance.


      Parmi les 61 mammifères figurent 6 endémismes ibériques, dont le lièvre ibérique, la taupe ibérique et
      le [desman des Pyrénées](/especie/galemys_pyrenaicus/), que l'on croyait éteint dans la sierra et qui
      conserve une petite population sur le versant ségovien. Le [loup](/especie/canis_lupus/) est revenu
      après plus d'un siècle d'absence et progresse. Le relief accidenté abrite de grands mammifères comme le
      [chevreuil](/especie/capreolus_capreolus/), le [chat sauvage](/especie/felis_silvestris/), la [loutre
      d'Europe](/especie/lutra_lutra/) et le blaireau, et le [bouquetin d'Espagne](/especie/capra_pyrenaica/)
      a été réintroduit. Les chauves-souris comptent 23 espèces. Une menace majeure : le vison d'Amérique,
      échappé d'élevages, prédate le desman et les amphibiens.


      La saison de visite s'étend de mai à octobre ; en hiver, la neige et le verglas compliquent les
      itinéraires de crête.
    visit: >-
      On trouve cinq centres d'accueil : Peñalara, Valle de La Fuenfría, Valle de El Paular, Valsaín–Boca del
      Asno et La Pedriza, en plus du point d'information de Canto Cochino.


      Les itinéraires vont du plus accessible au plus exigeant. La promenade bleue de Valsaín franchit
      l'Eresma sur le pont de Navalcarreta, tandis que le sentier de la forêt de Valsaín intègre des haltes
      thématiques sur la flore et les usages historiques. La Zona del Zabala, depuis le centre de Peñalara
      jusqu'au refuge dominant la laguna Grande, mesure 4,7 km pour 279 m de dénivelé, idéale pour débuter. La
      Calzada Romana, de 5,5 km et environ 2 h 50 min, monte du centre de la vallée de La Fuenfría jusqu'au
      col en suivant l'antique voie reliant Titulcia à Ségovie. Les versants de la Mujer Muerta totalisent 9,2
      km et 2 h 35 min. De Canto Cochino au Tolmo, comptez 5,8 km aller-retour pour randonneurs avertis,
      jalonnés de curiosités géologiques. La traversée du sentier Schmid, du col de Fuenfría et du col Ventoso
      fait 12 km en environ quatre heures.


      Choisissez votre parcours selon vos capacités et vérifiez les prévisions.
    history: >-
      Les zones humides du massif de Peñalara sont un site Ramsar d'importance internationale. Le parc déclaré
      en 2013 réunit des espaces naturels de Madrid et de Castille-et-León.
    before: >-
      L'accès des véhicules privés à La Pedriza est réglementé en raison de la forte affluence, et le massif
      de Peñalara impose un quota journalier et des règles spécifiques pour les groupes. Le secteur du Zabala
      peut devenir délicat sous la neige ou le verglas ; renseignez-vous d'abord au centre d'accueil.
      Consultez l'état des sentiers et les alertes météo avant de partir.
    around: >-
      À environ vingt-sept kilomètres se trouve le [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/). Plus loin, le [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) et le [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/) partagent avec Guadarrama l'aigle
      ibérique et le vautour moine.
  de:
    intro: >-
      In der Sierra de Guadarrama ist Schnee eine ernsthafte Angelegenheit. Am Puerto de Navacerrada auf 1894
      m fallen jährlich 1223 mm Niederschlag, es gibt im Schnitt 71 Schneetage und die durchschnittliche
      Januartemperatur sinkt auf -0,4 °C. Der Nationalpark Sierra de Guadarrama schützt diese winterliche
      Hochgebirgswelt zwischen Madrid und Kastilien und León: Gletscherkare, Bergkiefernwälder, zerklüftete
      Granitfelsen und eine Tierwelt, zu der der zurückgekehrte Wolf und der Pyrenäen-Desman gehören, den man
      bereits für ausgestorben hielt. Er entstand durch Gesetz 7/2013 vom 25. Juni mit 33 960 Hektar Fläche,
      verteilt auf Madrid und Kastilien und León.
    landscape: >-
      Alles begann vor rund 500 Millionen Jahren mit dem ältesten Gestein des Gebirges: Gneis. Später, während
      der variszischen Orogenese, entstand der Granit. Wesentlich später hob die alpidische Gebirgsbildung das
      Kastilische Scheidegebirge in Staffelbrüchen an, emporgehoben durch den Zusammenstoß der afrikanischen
      und iberischen Kontinentalplatten. Das formt die Sierra.


      Dann kam das Eis. Im Peñalara-Massiv füllte der Gletscher das Talbecken von Dos Hermanas, endete auf
      1.870 m und erstreckte sich über 2,5 km; beim Rückzug hinterließ er Kare, Moränen und Hochgebirgsseen.
      Die Laguna Grande de Peñalara liegt auf 2.019 m im gleichnamigen Kar und erreicht knapp 4,7 m Tiefe. Die
      Feuchtgebiete des Massivs sind als Ramsar-Gebiet ausgewiesen; der See litt unter touristischer
      Überlastung, was eine Renaturierung erforderte: deshalb unterliegt der Zugang heute Beschränkungen.


      Auf der Südseite erstreckt sich La Pedriza, ein Granitbatholith von rund 3.200 Hektar, der im Karbon
      entstand. Die Verwitterung meißelte daraus Tafoni, Felsbecken, Kuppen, Grate und Wollsackblöcke; die
      Felszacken tragen markante Namen: El Yelmo, El Pájaro, La Foca, El Camello, El Elefantito, Canto
      Cochino.


      Die Pflanzenwelt gliedert sich in Höhenstufen. Waldkiefernwälder bilden die ausgedehntesten Baumbestände
      und reichen stellenweise über 2.100 m hinauf. Darüber wachsen Zwergginster und Kriech-Wacholder; nahe
      den Kämmen dominieren Matten aus Festuca curvifolia. Auch Reliktbestände von Birke und Eibe überdauern;
      die Eibe am Arroyo Barondillo ist ein Baumdenkmal von über 1.500 Jahren.
    wildlife: >-
      Regelmäßig werden 135 Vogelarten nachgewiesen. Unter den Gebirgsvögeln finden sich Wasseramsel,
      Blaukehlchen und Zitronenzeisig; unter den Großvögeln der [Mönchsgeier](/especie/aegypius_monachus/),
      der [Spanische Kaiseradler](/especie/aquila_adalberti/), der [Steinadler](/especie/aquila_chrysaetos/),
      der [Rotmilan](/especie/milvus_milvus/) und der [Wanderfalke](/especie/falco_peregrinus/). Seit Beginn
      des Koloniemonitorings wurden 1586 Mönchsgeier mit ablesbaren Ringen markiert.


      Unter den 61 Säugetierarten zählen 6 zu den iberischen Endemiten, darunter das Iberische Schuppentier,
      der Iberische Maulwurf und der [Pyrenäen-Desman](/especie/galemys_pyrenaicus/), der im Gebirge als
      verschollen galt und eine Restpopulation auf der Seite von Segovia bewahrt. Der
      [Wolf](/especie/canis_lupus/) kehrte nach mehr als einem Jahrhundert Abwesenheit zurück und breitet sich
      aus. Das schroffe Relief beherbergt Großsäuger wie [Reh](/especie/capreolus_capreolus/),
      [Wildkatze](/especie/felis_silvestris/), [Fischotter](/especie/lutra_lutra/) und Dachs; der
      [Iberiensteinbock](/especie/capra_pyrenaica/) wurde wiederangesiedelt. Fledermäuse zählen 23 Arten. Eine
      akute Bedrohung: Aus Pelzfarmen entkommene Minke gefährden Desman und Amphibien.


      Die Hauptbesuchszeit erstreckt sich von Mai bis Oktober; im Winter erschweren Schnee und Vereisung die
      Höhenrouten.
    visit: >-
      Es gibt fünf Besucherzentren: Peñalara, Valle de La Fuenfría, Valle de El Paular, Valsaín–Boca del Asno
      und La Pedriza, ergänzt durch die Informationsstelle Canto Cochino.


      Die Wanderwege reichen von leicht bis anspruchsvoll. Der blaue Spazierweg von Valsaín quert den Eresma
      auf der Navalcarreta-Brücke, während der Waldweg von Valsaín Stationen zu Botanik und historischer
      Waldnutzung bietet. Die Zona del Zabala führt vom Besucherzentrum Peñalara zur Schutzhütte oberhalb der
      Laguna Grande: 4,7 km und 279 Höhenmeter, gut für Einsteiger. Die Calzada Romana überwindet 5,5 km in
      rund 2 h 50 min vom Informationszentrum Fuenfría zur Passhöhe auf einer Römerstraße, die einst Titulcia
      mit Segovia verband. Die Hänge der Mujer Muerta erfordern 9,2 km und 2 h 35 min. Von Canto Cochino zum
      El Tolmo sind es 5,8 km hin und zurück für geübte Wanderer mit geologischen Aufschlüssen. Die
      Überschreitung des Camino Schmid über den Fuenfría-Pass und den Collado Ventoso misst 12 km und dauert
      rund vier Stunden.


      Passe deine Route deiner Kondition an und beachte die Witterung.
    history: >-
      Die Feuchtgebiete des Peñalara-Massivs stehen als Ramsar-Gebiet unter internationalem Schutz. Der 2013
      ausgerufene Nationalpark vereint geschützte Zonen der Regionen Madrid und Kastilien und León.
    before: >-
      Die Zufahrt für Privatfahrzeuge nach La Pedriza wird wegen hohen Andrangs reguliert, und für das
      Peñalara-Massiv gelten Tageskontingente sowie Sonderregeln für Reisegruppen. Der Bereich Zabala kann bei
      Eis und Schnee heikel sein; erkundige dich vorab im Besucherzentrum. Prüfe Wegesperrungen und
      Unwetterwarnungen vor Beginn der Tour.
    around: >-
      Rund siebenundzwanzig Kilometer entfernt liegt der [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/). Weiter entfernt teilen der [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) und der [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/) mit Guadarrama das Vorkommen von
      Kaiseradler und Mönchsgeier.
  it:
    intro: >-
      Nella sierra de Guadarrama la neve è una cosa seria. Al valico di Navacerrada, a 1894 m, cadono 1223 mm
      all'anno, si registrano in media 71 giorni di nevicate e la temperatura di gennaio scende fino a una
      media di -0,4 °C. Il Parco Nazionale della Sierra de Guadarrama tutela questo ambiente alpino tra Madrid
      e Castiglia e León: lagune glaciali, pinete di pino silvestre, falesie di granito e una fauna che
      comprende il lupo, ritornato stabilmente, e il desman pirenaico, creduto a lungo scomparso. È stato
      istituito con Legge 7/2013, del 25 giugno, su 33 960 ettari distribuiti tra Madrid e Castiglia e León.
    landscape: >-
      Tutto ha inizio circa 500 milioni di anni fa con la roccia più antica della sierra, lo gneiss.
      Successivamente, con l'orogenesi ercinica, si generò il granito. Molto più tardi, l'orogenesi alpina
      sollevò il Sistema Centrale a blocchi rigidi, spinti verso l'alto dallo scontro tra placca africana e
      iberica. Ecco come è nata la sierra.


      Poi giunsero i ghiacci. Nel massiccio del Peñalara, il ghiacciaio colmò il bacino a monte da Dos
      Hermanas, terminò a 1.870 m e si sviluppò per 2,5 km; ritirandosi lasciò circhi, morene e bacini
      lacustri di quota. La laguna Grande de Peñalara sorge a 2.019 m nel circo omonimo e tocca appena 4,7 m
      di profondità. Le zone umide del massiccio costituiscono un sito Ramsar; la laguna ha sofferto per una
      pressione turistica eccessiva che ha reso necessario un restauro ecologico: per questo oggi l'accesso è
      contingentato.


      Sul versante meridionale si apre La Pedriza, un batolite granitico di circa 3.200 ettari formatosi nel
      Carbonifero. L'erosione ne ha modellato vasche, marmitte, tafoni, cupole, creste e ammassi di blocchi,
      con torrioni dai nomi bizzarri: El Yelmo, El Pájaro, La Foca, El Camello, El Elefantito, Canto Cochino.


      La flora si dispone su piani altitudinali. Le pinete di pino silvestre sono le formazioni più ampie e
      caratteristiche, con formazioni che superano i 2.100 m. Più in alto prosperano le brughiere di ginestra
      purgante e ginepro nano; vicino alle creste dominano i pascoli di Festuca curvifolia. Sopravvivono lembi
      relitti di betulle e tassi; l'esemplare dell'Arroyo Barondillo è un tasso monumentale di oltre 1.500
      anni.
    wildlife: >-
      Si contano 135 specie di uccelli a presenza regolare. Tra quelli d'alta quota figurano il merlo
      acquaiolo, il pettazzurro e il venturone montagnano; tra i grandi rapaci, l'[avvoltoio
      monaco](/especie/aegypius_monachus/), l'[aquila imperiale iberica](/especie/aquila_adalberti/),
      l'[aquila reale](/especie/aquila_chrysaetos/), il [nibbio reale](/especie/milvus_milvus/) e il [falco
      pellegrino](/especie/falco_peregrinus/). Dall'avvio del monitoraggio, sono stati inanellati 1586
      avvoltoi monaci con marcaggi identificativi a distanza.


      Tra i 61 mammiferi si annoverano 6 endemismi iberici, come la lepre iberica, la talpa iberica e il
      [desman pirenaico](/especie/galemys_pyrenaicus/), ritenuto estinto nella sierra e presente con una
      piccola popolazione sul versante segoviano. Il [lupo grigio](/especie/canis_lupus/) è ritornato dopo
      oltre un secolo di assenza ed è in espansione. Il rilievo aspro ospita mammiferi come il
      [capriolo](/especie/capreolus_capreolus/), il [gatto selvatico](/especie/felis_silvestris/), la [lontra
      europea](/especie/lutra_lutra/) e il tasso; lo [stambecco iberico](/especie/capra_pyrenaica/) è tornato
      grazie a reintroduzioni. I pipistrelli annoverano 23 specie. Una minaccia concreta: il visone americano,
      fuggito dagli allevamenti, preda desman e anfibi.


      La stagione ideale di visita va da maggio a ottobre; in inverno neve e ghiaccio rendono insidiose le
      vette.
    visit: >-
      Il parco conta cinque centri visitatori: Peñalara, Valle de La Fuenfría, Valle de El Paular,
      Valsaín–Boca del Asno e La Pedriza, oltre al punto informativo di Canto Cochino.


      I percorsi variano per impegno fisico. La passeggiata blu di Valsaín attraversa l'Eresma sul ponte di
      Navalcarreta, mentre il sentiero del bosco di Valsaín include soste botaniche e memorie storiche. La
      Zona del Zabala, dal Centro Visitatori Peñalara fino al rifugio sulla laguna Grande, misura 4,7 km per
      279 m di dislivello, adatta a principianti. La Calzada Romana, di 5,5 km e circa 2 h 50 min, sale dal
      centro della valle della Fuenfría al valico lungo un'antica via lastricata che univa Titulcia a Segovia.
      I versanti della Mujer Muerta assommano 9,2 km e 2 h 35 min. Da Canto Cochino a El Tolmo vi sono 5,8 km
      tra andata e ritorno per escursionisti esperti. La traversata del Camino Schmid, passo di Fuenfría e
      colle Ventoso misura 12 km per circa quattro ore di cammino.


      Valuta le tue forze e informati prima di partire.
    history: >-
      Le zone umide del massiccio del Peñalara sono riconosciute sito Ramsar di importanza internazionale. Il
      parco, istituito nel 2013, unisce aree protette appartenenti a Madrid e Castiglia e León.
    before: >-
      L'accesso dei veicoli privati a La Pedriza è regolamentato a causa dell'elevato flusso turistico, e il
      massiccio di Peñalara applica una quota giornaliera e regole mirate per i gruppi. La Zona del Zabala può
      presentare rischi con neve o ghiaccio; chiedi ragguagli al centro visitatori. Controlla lo stato dei
      tracciati e i bollettini prima dell'escursione.
    around: >-
      A circa ventisette chilometri sorge il [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/). Più lontano, il [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) e il [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/) condividono con Guadarrama
      l'aquila imperiale e l'avvoltoio monaco.
  pt:
    intro: >-
      Na serra de Guadarrama a neve é assunto sério. No porto de Navacerrada, a 1894 m, caem 1223 mm anuais,
      registam-se em média 71 dias de queda de neve e a temperatura média de janeiro desce aos -0,4 °C. O
      Parque Nacional da Serra de Guadarrama preserva este refúgio alpino entre Madrid e Castela e Leão:
      lagoas glaciares, pinhais de pinheiro-silvestre, penedos de granito e fauna que acolhe o lobo,
      regressado recentemente, e a toupeira-da-água, que se julgava desaparecida. Foi criado pela Lei 7/2013,
      de 25 de junho, com 33 960 hectares repartidos entre Madrid e Castela e Leão.
    landscape: >-
      Tudo tem início há cerca de 500 milhões de anos com a rocha mais ancestral da serra, o gnaisse. Mais
      tarde, durante a orogenia hercínica, consolidou-se o granito. Muito depois, a orogenia alpina soergueu o
      Sistema Central em blocos falhados, erguidos pela colisão entre as placas africana e ibérica. Assim se
      forjou a serra.


      Depois chegou o gelo. No maciço de Peñalara, o glaciar preencheu a cabeceira da bacia desde Dos
      Hermanas, terminou a 1.870 m e estendeu-se por 2,5 km; ao recuar gerou circos, moreias e lagoas de alta
      montanha. A laguna Grande de Peñalara localiza-se a 2.019 m no circo homónimo, atingindo apenas 4,7 m de
      profundidade. As zonas húmidas do maciço constituem sítio Ramsar, tendo a lagoa sofrido forte degradação
      turística que exigiu recuperação ecológica: por isso as visitas estão hoje sujeitas a restrições.


      Na vertente meridional estende-se La Pedriza, um batólito granítico de cerca de 3.200 hectares formado
      no Carbonífero. A erosão modelou alvéolos, marmitas, tafonis, domos, cristas e caos de blocos, com
      penhascos batizados com nomes populares: El Yelmo, El Pájaro, La Foca, El Camello, El Elefantito, Canto
      Cochino.


      A vegetação reparte-se por andares ecológicos. Os pinhais de pinheiro-silvestre formam os bosques mais
      expressivos e extensos, atingindo talhões acima dos 2.100 m. Sobre eles desenvolvem-se tojais de piorno
      e zimbro-rasteiro; próximo das cimeiras dominam os pastos de Festuca curvifolia. Persistem núcleos
      relíquias de bétula e teixo; o exemplar do Arroyo Barondillo é uma árvore monumental com mais de 1.500
      anos.
    wildlife: >-
      Assinalam-se 135 espécies de aves com presença regular. Entre as aves de montanha contam-se o
      melro-d'água, o pisco-de-peito-azul e o milheiro-alpino; entre as grandes aves, o
      [abutre-preto](/especie/aegypius_monachus/), a [águia-imperial-ibérica](/especie/aquila_adalberti/), a
      [águia-real](/especie/aquila_chrysaetos/), o [milhafre-real](/especie/milvus_milvus/) e o
      [falcão-peregrino](/especie/falco_peregrinus/). Desde o início da monitorização da colónia, anilharam-se
      1586 abutres-pretos com marcas visíveis à distância.


      Entre os 61 mamíferos ocorrem 6 endemismos ibéricos, como a lebre-ibérica, a toupeira-ibérica e a
      [toupeira-da-água](/especie/galemys_pyrenaicus/), dada por extinta na serra e que conserva um pequeno
      núcleo no lado segoviano. O [lobo-cinzento](/especie/canis_lupus/) regressou após mais de um século de
      ausência e encontra-se em expansão. O terreno escarpado abriga grandes mamíferos como a
      [corça](/especie/capreolus_capreolus/), o [gato-bravo](/especie/felis_silvestris/), a
      [lontra-europeia](/especie/lutra_lutra/) e o texugo; a [cabra-montês](/especie/capra_pyrenaica/) foi
      reintroduzida. Os morcegos reúnem 23 espécies. Uma ameaça séria: o visão-americano, foragido de quintas
      de peles, preda a toupeira-da-água e os anfíbios.


      A temporada de visitação estende-se de maio a outubro; no inverno a neve e o gelo dificultam as
      caminhadas em altitude.
    visit: >-
      Funcionam cinco centros de visitantes: Peñalara, Valle de La Fuenfría, Valle de El Paular, Valsaín–Boca
      del Asno e La Pedriza, além do posto de informação de Canto Cochino.


      Os trilhos cobrem vários níveis de dificuldade. O passeio azul de Valsaín atravessa o Eresma pela ponte
      de Navalcarreta, enquanto a rota florestal de Valsaín conta com paragens botânicas e sobre usos
      silvícolas tradicionais. A Zona del Zabala, a partir do Centro de Visitantes Peñalara até ao refúgio
      sobre a laguna Grande, soma 4,7 km e 279 m de desnível, acessível a iniciantes. A Calzada Romana, com
      5,5 km e cerca de 2 h 50 min, sobe do centro de acolhimento de Fuenfría até ao porto de montanha por uma
      antiga via que unia Titulcia a Segóvia. As encostas de La Mujer Muerta totalizam 9,2 km e 2 h 35 min. De
      Canto Cochino ao Tolmo são 5,8 km de ida e volta para caminhantes experientes, incluindo paragens
      geológicas. A travessia do Camino Schmid, porto de Fuenfría e collado Ventoso atinge 12 km em cerca de
      quatro horas de marcha.


      Escolhe a rota adequada à tua condição física e verifica os avisos meteorológicos.
    history: >-
      As zonas húmidas do maciço de Peñalara estão classificadas como sítio Ramsar de relevância
      internacional. O parque instituído em 2013 reúne superfícies protegidas sob jurisdição de Madrid e
      Castela e Leão.
    before: >-
      A circulação em viatura particular em La Pedriza encontra-se condicionada devido ao elevado afluxo, e o
      maciço de Peñalara impõe lotações diárias e regulamentos específicos para grupos. A Zona del Zabala pode
      tornar-se perigosa com gelo ou neve; informa-te antecipadamente no centro de visitantes. Consulta o
      estado dos caminhos e as previsões antes de partires.
    around: >-
      A cerca de vinte e sete quilómetros fica o [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/). Mais além, o [Parque Nacional de
      Cabañeros](/lugar/parque-nacional-de-cabaneros/) e o [Parque Natural de Sierra Madrona y Valle de
      Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/) partilham com Guadarrama a
      águia-imperial-ibérica e o abutre-preto.
