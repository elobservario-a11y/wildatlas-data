observaciones:
  es: >-
    Es una reserva estricta, y al área natural se llega a pie: el tramo final, de unos 45 minutos, es de
    montaña. La salida es desde Bajram Curri.
texto:
  es:
    intro: >-
      El Gashi nace a 2.238 m, en el paso de Dobërdol, y empieza a abrirse camino entre las cumbres del
      extremo norte de Albania. Lo que talla es un valle profundo, y en sus laderas empinadas trepa el mayor
      hayedo primario de los Alpes Albaneses. Eso es la Reserva Natural Estricta del Río Gashi, unas 3.000
      hectáreas en la región de Tropojë, hoy dentro del Parque Nacional de los Alpes Albaneses y parte del
      Patrimonio Mundial de los hayedos antiguos de Europa.
    landscape: >-
      El río nace en el macizo de las montañas de Gashi y cruza un territorio de valles hondos, pendientes
      empinadas y cañones. Más al sur atraviesa un desfiladero estrecho y baja a la cuenca de Tropojë, donde
      se une al Valbona. Cerca están los lagos glaciares de Dobërdol y Sylbica.


      El bosque lo lleva todo. El haya sube por las laderas empinadas del valle y el abeto marca el piso
      montano. Entre las hayas se mezclan pino macedonio, pino bosnio, abeto rojo y abeto blanco, y también el
      pino de Heldreich, una planta mediterránea y endémica que enriquece el hayedo. La latitud sur y los
      cambios de altitud explican que haya tanto endemismo.
    wildlife: >-
      La reserva tiene 64 especies de mamíferos, entre ellas el [oso pardo](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/), el [rebeco](/especie/rupicapra_rupicapra/), el
      [lince](/especie/lynx_lynx/), el [corzo](/especie/capreolus_capreolus/), el jabalí y la
      [nutria](/especie/lutra_lutra/). También hay 14 especies de anfibios, entre ellas el tritón crestado
      italiano.


      En el aire, el [quebrantahuesos](/especie/gypaetus_barbatus/), el [buitre
      leonado](/especie/gyps_fulvus/), el águila imperial oriental, el [urogallo](/especie/tetrao_urogallus/)
      y la perdiz griega.


      La temporada recomendada para ir va de junio a octubre.
    visit: >-
      Para llegar al Gashi, el viaje empieza en la ciudad de Bajram Curri y sigue por pueblos de montaña como
      Dragobi, Qerem, Markovçë, Rorkuz y Dobërdol. Desde allí se camina hacia el área natural durante unos 45
      minutos de terreno de montaña.


      Dentro del valle se puede caminar entre bosques sin tocar, por la montaña de Bjeshkët e Nemuna y sus
      alrededores. Los lagos glaciares, las aguas claras y los bosques verdes también hacen buen fondo para
      fotografiar la naturaleza.
    history: >-
      El valle del Gashi se incluyó en la lista del Patrimonio Mundial como parte de los hayedos antiguos de
      Europa. Es uno de los espacios mejor conservados de Europa en cuanto a ecosistemas forestales naturales,
      y forma parte del Cinturón Verde Europeo. En 2022 la reserva se integró en el Parque Nacional de los
      Alpes Albaneses.


      La zona es conocida también por sus rutas pastoriles tradicionales, que conectan Albania con Montenegro
      y Kosovo.
    before: >-
      Es una reserva estricta, y al área natural se llega a pie: el tramo final, de unos 45 minutos, es de
      montaña. La salida es desde Bajram Curri.
    around: >-
      A unos seis kilómetros está el [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) y a unos nueve el [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). La reserva forma hoy parte del [Parque
      Nacional de los Alpes Albaneses](/lugar/parku-kombetar-i-alpeve-te-shqiperise/).
  en:
    intro: >-
      The Gashi rises at 2,238 m at the Dobërdol Pass and carves its way through the highest peaks of northern
      Albania. It hollows out a deep gorge, and up its steep flanks climbs the largest primeval beech forest
      in the Albanian Alps. This is the Gashi River Strict Nature Reserve, spanning some 3,000 hectares in the
      Tropojë region, now part of the Albanian Alps National Park and included in the UNESCO World Heritage
      Ancient Beech Forests of Europe.
    landscape: >-
      The river originates in the Gashi Mountain massif and flows through a landscape of deep canyons, steep
      scarps, and dramatic gorges. Further south it cuts through a narrow ravine before descending to the
      Tropojë basin, where it joins the Valbona. Nearby lie the glacial tarns of Dobërdol and Sylbica.


      The forest dominates the scene. European beech climbs the steep valley slopes, while silver fir marks
      the montane belt. Mixed among the beeches are Macedonian pine, Bosnian pine, Norway spruce, and silver
      fir, alongside Heldreich's pine, a Mediterranean endemic tree that enriches the beech groves. The
      southerly latitude and sharp elevation gradients account for such high endemism.
    wildlife: >-
      The reserve shelters 64 mammal species, including the [brown bear](/especie/ursus_arctos/), the [grey
      wolf](/especie/canis_lupus/), the [chamois](/especie/rupicapra_rupicapra/), the [Eurasian
      lynx](/especie/lynx_lynx/), the [roe deer](/especie/capreolus_capreolus/), the wild boar, and the
      [Eurasian otter](/especie/lutra_lutra/). There are also 14 amphibian species, including the Italian
      crested newt.


      In the skies soar the [bearded vulture](/especie/gypaetus_barbatus/), the [griffon
      vulture](/especie/gyps_fulvus/), the eastern imperial eagle, the [western
      capercaillie](/especie/tetrao_urogallus/), and the rock partridge.


      The recommended visiting season extends from June to October.
    visit: >-
      To reach the Gashi, the journey starts from the town of Bajram Curri and continues through mountain
      villages like Dragobi, Qerem, Markovçë, Rorkuz, and Dobërdol. From there, visitors hike toward the
      natural area for about 45 minutes across rugged mountain terrain.


      Inside the valley, you can hike through pristine forests across Mount Bjeshkët e Nemuna and its
      surroundings. Glacial tarns, crystal-clear streams, and emerald forests provide stunning backdrops for
      nature photography.
    history: >-
      The Gashi Valley was inscribed on the World Heritage List as part of the Ancient and Primeval Beech
      Forests of Europe. It ranks among Europe's best-preserved forest ecosystems and forms part of the
      European Green Belt. In 2022, the reserve was integrated into the Albanian Alps National Park.


      The area is also renowned for its traditional pastoral routes connecting Albania with Montenegro and
      Kosovo.
    before: >-
      This is a strict nature reserve, and access is on foot: the final stretch takes about 45 minutes of
      mountain walking. The starting base is Bajram Curri.
    around: >-
      Around six kilometers away lies [Bjeshkët e Nemuna National
      Park](/lugar/parku-kombetar-bjeshket-e-nemuna/) and about nine kilometers away is [Prokletije National
      Park](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). The reserve is today integrated into the
      [Albanian Alps National Park](/lugar/parku-kombetar-i-alpeve-te-shqiperise/).
  fr:
    intro: >-
      La Gashi prend sa source à 2 238 m au col de Dobërdol et commence à se frayer un chemin parmi les cimes
      du nord de l'Albanie. Elle creuse une vallée profonde sur les pentes abruptes de laquelle s'accroche la
      plus vaste hêtraie primaire des Alpes albanaises. C'est la réserve naturelle intégrale de la rivière
      Gashi, environ 3 000 hectares dans la région de Tropojë, aujourd'hui intégrée au parc national des Alpes
      albanaises et au patrimoine mondial des forêts primaires de hêtres d'Europe.
    landscape: >-
      La rivière naît dans le massif des monts Gashi et traverse un territoire de vallées encaissées, de
      pentes vertigineuses et de gorges. Plus au sud, elle franchit un défilé étroit avant de déboucher dans
      le bassin de Tropojë où elle rejoint la Valbona. Non loin de là scintillent les lacs glaciaires de
      Dobërdol et Sylbica.


      La forêt règne en maîtresse absolue. Le hêtre gravit les versants raides de la vallée tandis que le
      sapin structure l'étage montagnard. Aux hêtres se mêlent le pin de Macédoine, le pin de Bosnie, l'épicéa
      commun et le sapin pectiné, ainsi que le pin de Heldreich, essence méditerranéenne et endémique qui
      enrichit la hêtraie. La latitude méridionale et le fort gradient altitudinal expliquent ce haut niveau
      d'endémisme.
    wildlife: >-
      La réserve abrite 64 espèces de mammifères, parmi lesquelles l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/), le [chamois](/especie/rupicapra_rupicapra/), le [lynx
      boréal](/especie/lynx_lynx/), le [chevreuil](/especie/capreolus_capreolus/), le sanglier et la [loutre
      d'Europe](/especie/lutra_lutra/). On compte également 14 espèces d'amphibiens, dont le triton crêté
      italien.


      Dans les airs évoluent le [gypaète barbu](/especie/gypaetus_barbatus/), le [vautour
      fauve](/especie/gyps_fulvus/), l'aigle impérial d'Orient, le [grand tétras](/especie/tetrao_urogallus/)
      et la perdrix bartavelle.


      La période recommandée pour la visite s'étend de juin à octobre.
    visit: >-
      Pour parvenir à la Gashi, le voyage débute dans la ville de Bajram Curri et traverse des villages
      d'altitude tels que Dragobi, Qerem, Markovçë, Rorkuz et Dobërdol. De là, on marche en direction du site
      naturel durant environ 45 minutes en terrain de haute montagne.


      Au cœur de la vallée, vous pouvez cheminer à travers des forêts intactes sur le mont Bjeshkët e Nemuna
      et ses alentours. Les lacs glaciaires, les eaux pures et les futaies verdoyantes offrent en outre un
      cadre remarquable pour la photographie naturaliste.
    history: >-
      La vallée de la Gashi a été inscrite sur la liste du patrimoine mondial au titre des forêts primaires de
      hêtres d'Europe. Elle constitue l'un des espaces forestiers naturels les mieux préservés de toute
      l'Europe et s'intègre à la Ceinture verte européenne. En 2022, la réserve a été incorporée au parc
      national des Alpes albanaises.


      La région est également réputée pour ses sentiers pastoraux séculaires reliant l'Albanie au Monténégro
      et au Kosovo.
    before: >-
      Il s'agit d'une réserve intégrale où l'accès s'effectue à pied : le tronçon terminal, d'environ 45
      minutes, emprunte un sentier de montagne. Le point de départ est Bajram Curri.
    around: >-
      À environ six kilomètres se situe le [parc national de Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) et à environ neuf kilomètres le [parc national de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). La réserve est aujourd'hui intégrée au
      [parc national des Alpes albanaises](/lugar/parku-kombetar-i-alpeve-te-shqiperise/).
  de:
    intro: >-
      Der Gashi entspringt auf 2.238 m am Dobërdol-Pass und bahnt sich seinen Weg zwischen den höchsten
      Gipfeln Nordalbaniens. Er gräbt ein tiefes Tal, an dessen steilen Hängen der größte Ur-Buchenwald der
      Albanischen Alpen emporsteigt. Das ist das Strenge Naturreservat Gashi-Fluss, rund 3.000 Hektar im
      Gebiet von Tropojë, heute eingebettet in den Nationalpark der Albanischen Alpen und Teil des
      UNESCO-Welterbes der Alten Buchenwälder Europas.
    landscape: >-
      Der Fluss entspringt im Massiv der Gashi-Berge und durchquert eine Landschaft aus tiefen Tälern, steilen
      Abhängen und Schluchten. Weiter südlich zwängt er sich durch eine enge Klamm hinab ins Tropojë-Becken,
      wo er in die Valbona mündet. In der Nähe liegen die Karseen von Dobërdol und Sylbica.


      Der Wald beherrscht die Szenerie. Die Rotbuche klettert die steilen Talflanken empor, während die
      Weißtanne die montane Stufe prägt. Unter die Buchen mischen sich Mazedonische Kiefer,
      Schlangenhaut-Kiefer, Gemeine Fichte und Weißtanne sowie die Panzerkiefer, ein mediterranes Endemit, das
      den Buchenwald bereichert. Die südliche Breitenlage und die starken Höhenunterschiede erklären den
      außergewöhnlichen Endemismus.
    wildlife: >-
      Das Reservat beherbergt 64 Säugetierarten, darunter [Braunbär](/especie/ursus_arctos/),
      [Wolf](/especie/canis_lupus/), [Gämse](/especie/rupicapra_rupicapra/), [Eurasischer
      Luchs](/especie/lynx_lynx/), [Reh](/especie/capreolus_capreolus/), Wildschwein und [Eurasischer
      Fischotter](/especie/lutra_lutra/). Zudem leben hier 14 Amphibienarten, unter ihnen der Italienische
      Kammmolch.


      Am Himmel kreisen [Bartgeier](/especie/gypaetus_barbatus/), [Gänsegeier](/especie/gyps_fulvus/),
      Kaiseradler, [Auerhuhn](/especie/tetrao_urogallus/) und Steinhuhn.


      Die empfohlene Reisezeit reicht von Juni bis Oktober.
    visit: >-
      Die Anreise zum Gashi beginnt in der Kleinstadt Bajram Curri und führt über Gebirgsdörfer wie Dragobi,
      Qerem, Markovçë, Rorkuz und Dobërdol. Von dort aus wanderst du rund 45 Minuten durch alpines Gelände in
      das Schutzgebiet hinein.


      Im Tal kannst du durch unberührte Wälder an den Flanken der Bjeshkët e Nemuna und deren Umgebung
      wandern. Die Karseen, klaren Gewässer und urwüchsigen Wälder bilden zudem eine hervorragende Kulisse für
      die Naturfotografie.
    history: >-
      Das Gashi-Tal wurde als Teil der Alten Buchenwälder und Buchenurwälder Europas in die Welterbeliste der
      UNESCO aufgenommen. Es zählt zu den am besten erhaltenen Waldökosystemen ganz Europas und ist Teil des
      Grünen Bandes Europa. Im Jahr 2022 wurde das Reservat in den Nationalpark der Albanischen Alpen
      eingegliedert.


      Das Gebiet ist außerdem für seine traditionellen Hirtenwege bekannt, die Albanien mit Montenegro und dem
      Kosovo verbinden.
    before: >-
      Es handelt sich um ein strenges Schutzgebiet, der Zugang erfolgt zu Fuß: Der letzte Aufstieg von etwa 45
      Minuten verläuft im Gebirge. Ausgangspunkt ist Bajram Curri.
    around: >-
      Rund sechs Kilometer entfernt liegt der [Nationalpark Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) und etwa neun Kilometer entfernt der [Nationalpark
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). Das Reservat ist heute Teil des
      [Nationalparks der albanischen Alpen](/lugar/parku-kombetar-i-alpeve-te-shqiperise/).
  it:
    intro: >-
      Il Gashi nasce a 2.238 m al passo di Dobërdol e comincia a scavarsi un varco tra le vette più elevate
      dell'Albania settentrionale. Scava una forra profonda e lungo i suoi versanti scoscesi si inerpica la
      faggeta primaria più estesa delle Alpi Albanesi. È la riserva naturale integrale del fiume Gashi, circa
      3.000 ettari nella regione di Tropojë, oggi inclusa nel Parco nazionale delle Alpi Albanesi e parte del
      Patrimonio Mondiale UNESCO delle antiche faggete d'Europa.
    landscape: >-
      Il fiume trae origine dal massiccio montuoso del Gashi e scorre attraverso vallate impervie, pareti
      dirupate e orridi. Più a sud attraversa una gola stretta per poi aprirsi nel bacino di Tropojë, dove
      confluisce nel Valbona. Nei pressi si aprono i laghi glaciali di Dobërdol e Sylbica.


      La foresta signoreggia incontrastata. Il faggio risale le pendici ripide della valle, mentre l'abete
      bianco contraddistingue la fascia montana. In mezzo ai faggi si alternano il pino macedone, il pino
      loricato, l'abete rosso e l'abete bianco, assieme al pino di Heldreich, un endemismo mediterraneo che
      arricchisce la faggeta. La posizione meridionale e il marcato gradiente altimetrico spiegano un tasso
      così elevato di endemismi.
    wildlife: >-
      La riserva ospita 64 specie di mammiferi, tra cui l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/), il [camoscio alpino](/especie/rupicapra_rupicapra/), la
      [lince](/especie/lynx_lynx/), il [capriolo](/especie/capreolus_capreolus/), il cinghiale e la [lontra
      europea](/especie/lutra_lutra/). Si contano inoltre 14 specie di anfibi, tra cui il tritone crestato
      italiano.


      In volo si ammirano il [gipeto](/especie/gypaetus_barbatus/), il [grifone](/especie/gyps_fulvus/),
      l'aquila imperiale orientale, l'[urogallo](/especie/tetrao_urogallus/) e la coturnice orientale.


      Il periodo consigliato per una visita va da giugno a ottobre.
    visit: >-
      Per giungere al Gashi, l'itinerario comincia nella cittadina di Bajram Curri e attraversa villaggi
      montani come Dragobi, Qerem, Markovçë, Rorkuz e Dobërdol. Da qui si procede a piedi verso l'area
      protetta per circa 45 minuti su terreno d'alta montagna.


      Nella valle puoi camminare tra boschi intatti lungo le pendici del Bjeshkët e Nemuna e nei dintorni. I
      laghetti alpini, le acque limpide e i fitti boschi secolari compongono inoltre uno sfondo ideale per la
      fotografia naturalistica.
    history: >-
      La valle del Gashi è stata iscritta nella lista del Patrimonio Mondiale dell'UNESCO nell'ambito delle
      faggete primordiali dei Carpazi e d'altre regioni d'Europa. Risulta uno degli ecosistemi forestali
      naturali meglio conservati d'Europa ed è parte della Cintura Verde Europea. Nel 2022 la riserva è stata
      integrata nel Parco nazionale delle Alpi Albanesi.


      La zona è rinomata anche per le antiche mulattiere pastorali che congiungono l'Albania con il Montenegro
      e il Kosovo.
    before: >-
      Si tratta di una riserva naturale integrale e l'accesso si effettua a piedi: l'ultimo tratto dura circa
      45 minuti su sentiero alpino. La base di partenza è Bajram Curri.
    around: >-
      A circa sei chilometri sorge il [Parco nazionale Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) e a circa nove chilometri il [Parco nazionale di
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). La riserva fa oggi parte del [Parco
      nazionale delle Alpi Albanesi](/lugar/parku-kombetar-i-alpeve-te-shqiperise/).
  pt:
    intro: >-
      O Gashi nasce a 2.238 m no passo de Dobërdol e rasga o seu caminho por entre os cumes do extremo norte
      da Albânia. Escava um desfiladeiro profundo e pelas suas encostas íngremes sobe o maior faial primário
      dos Alpes Albaneses. Essa é a Reserva Natural Integral do Rio Gashi, com cerca de 3.000 hectares na
      região de Tropojë, atualmente integrada no Parque Nacional dos Alpes Albaneses e parte do Património
      Mundial dos Faiais Antigos da Europa.
    landscape: >-
      O rio nasce no maciço das montanhas de Gashi e percorre um território de vales profundos, escarpas
      agrestes e desfiladeiros. Mais a sul atravessa uma garganta estreita antes de atingir a bacia de
      Tropojë, onde desagua no Valbona. Nas imediações repousam as lagoas glaciares de Dobërdol e Sylbica.


      A floresta assume o protagonismo absoluto. A faia trepa pelas vertentes abruptas do vale, enquanto o
      abeto marca o piso montano. Misturados com as faias surgem o pinheiro-da-macedónia, o pinheiro-bósnio, o
      espruce e o abeto-branco, a par do pinheiro-de-heldreich, uma árvore mediterrânica e endémica que
      enriquece o faial. A latitude meridional e o grande desnível altimétrico explicam uma riqueza tão
      expressiva de endemismos.
    wildlife: >-
      A reserva alberga 64 espécies de mamíferos, entre as quais o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/), a [camurça](/especie/rupicapra_rupicapra/), o
      [lince-euroasiático](/especie/lynx_lynx/), a [corça](/especie/capreolus_capreolus/), o javali e a
      [lontra-europeia](/especie/lutra_lutra/). Ocorrem igualmente 14 espécies de anfíbios, incluindo o
      tritão-de-crista-italiano.


      Nos céus planam o [abutre-barbudo](/especie/gypaetus_barbatus/), o
      [abutre-fouveiro](/especie/gyps_fulvus/), a águia-imperial-oriental, o
      [tetraz-grande](/especie/tetrao_urogallus/) e a perdiz-grega.


      A época recomendada para visitar decorre de junho a outubro.
    visit: >-
      Para chegar ao Gashi, o périplo tem início na vila de Bajram Curri e continua por aldeias de montanha
      como Dragobi, Qerem, Markovçë, Rorkuz e Dobërdol. A partir daí caminha-se rumo à área protegida durante
      cerca de 45 minutos em terreno acidentado de alta montanha.


      No vale podes caminhar através de matas virgens ao longo do monte Bjeshkët e Nemuna e áreas envolventes.
      As lagoas de origem glaciar, as águas cristalinas e as matas verdejantes compõem também um enquadramento
      privilegiado para a fotografia de natureza.
    history: >-
      O vale do Gashi foi classificado como Património Mundial enquanto integrante dos Faiais Antigos e
      Primários da Europa. Representa um dos ecossistemas florestais naturais mais bem conservados de todo o
      continente e faz parte do Cinturão Verde Europeu. Em 2022 a reserva passou a integrar o Parque Nacional
      dos Alpes Albaneses.


      A região destaca-se ainda pelas ancestrais rotas pastoris que unem a Albânia ao Montenegro e ao Kosovo.
    before: >-
      Trata-se de uma reserva integral onde o acesso é pedonal: o troço final, com cerca de 45 minutos,
      decorre em terreno de montanha. O ponto de partida situa-se em Bajram Curri.
    around: >-
      A cerca de seis quilómetros fica o [Parque Nacional Bjeshkët e
      Nemuna](/lugar/parku-kombetar-bjeshket-e-nemuna/) e a cerca de nove o [Parque Nacional de
      Prokletije](/lugar/nacionalni-park-prokletije-parku-kombetar-i/). A reserva está atualmente integrada no
      [Parque Nacional dos Alpes Albaneses](/lugar/parku-kombetar-i-alpeve-te-shqiperise/).
