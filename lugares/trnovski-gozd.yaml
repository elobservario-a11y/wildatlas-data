resumen:
  es: Meseta kárstica de alta montaña con dolinas profundas, hieleras naturales y extensos hayedos.
  en: High mountain karst plateau featuring deep collapse dolines, natural ice caves, and extensive beechwoods.
  fr: Plateau karstique d'altitude percé de dolines profondes, de glacières naturelles et d'immenses hêtraies.
  de: Hochalpines Karstplateau mit tiefen Dolinen, natürlichen Eishöhlen und ausgedehnten Buchenmischwäldern.
  it: Altopiano carsico d'alta quota con doline profonde, ghiacciaie naturali ed estese faggete.
  pt: Planalto cársico de altitude com dolinas profundas, glaciares subterrâneos e extensos faiais.
unico:
  es: >-
    Una meseta donde el frío se acumula en el fondo de las cubetas y pone la vegetación del revés, y donde una
    cueva guarda hielo todo el año.
  en: >-
    A plateau where freezing air pools in deep hollows to invert normal vegetation zones, and where a
    subterranean cavern traps eternal ice.
  fr: >-
    Un plateau où le froid stagne au fond des dépressions pour inverser la végétation, et dont une grotte
    conserve des glaces pérennes.
  de: >-
    Eine Hochebene, in deren tiefen Senken sich Kaltluft staut und die Höhenstufen umkehrt, und wo eine Höhle
    ganzjährig Eis birgt.
  it: >-
    Un altopiano dove il freddo ristagna sul fondo delle doline invertendo la vegetazione, e dove una grotta
    conserva ghiaccio perenne.
  pt: >-
    Um planalto onde o ar gélido estagna no fundo das covas invertendo a vegetação, e onde uma gruta preserva
    gelo fóssil todo o ano.
observaciones:
  es: >-
    Los mejores meses van de mayo a octubre; calcula uno o dos días. La Gran Cueva de Hielo solo es accesible
    hasta su entrada, donde el frío crea una inversión de vegetación. Cerca de Predmeja hay una sima que
    desciende 884 m.
texto:
  es:
    intro: >-
      Por aquí llueve más de lo que cabría esperar, pero no corre ni un arroyo. La meseta de Trnovo recibe de
      media unos 1881 mm de precipitación al año, y toda esa agua desaparece bajo tierra: es una meseta
      kárstica, sin corrientes de agua en la superficie, rota en valles cerrados, cerros, colinas, cuevas,
      simas, lapiaces y pilas de disolución. Forma el extremo noroeste de los Alpes Dináricos y se alza sobre
      el valle de Vipava, con bosques densos en los flancos y cumbres peladas en lo alto.
    landscape: >-
      La historia empieza en un mar. Buena parte de las rocas de la meseta nace de un gran arrecife de coral y
      contiene muchos fósiles de conchas, caracoles y corales. Dos tercios de la superficie son caliza, una
      cuarta parte dolomía y el resto flysch y material suelto. Luego el mar se retiró, los movimientos del
      terreno levantaron las colinas y la lluvia fue disolviendo la roca. Los glaciares dejaron pequeños
      circos y morrenas sobre lo que era una superficie bastante llana.


      El resultado más curioso son las cubetas profundas, como Mrzla draga, Mojska, Smrekova y Črna draga. Son
      tan hondas y de formas tan cerradas que el aire frío se queda en el fondo y provoca una inversión de
      temperatura y de vegetación: Smrekova draga es el ejemplo típico de cubeta de heladas. Y otra reserva de
      la meseta se deja totalmente a la naturaleza, sin intervención humana.


      Bajo tierra, la Gran Cueva de Hielo de Paradana tiene hielo hasta 150 m de profundidad y está protegida
      como monumento natural. Junto al pueblo de Otlica, en el borde de la meseta, hay una ventana natural en
      la roca, con un sendero fácil desde el pueblo. Y el Wild Lake es un manantial de tipo vauclusiano y un
      pequeño lago con un sifón profundo sin explorar.
    wildlife: >-
      El bosque ocupa el 75,5 % de la meseta y sigue creciendo por la repoblación de tierras agrícolas
      abandonadas. Es sobre todo un bosque mixto de haya y abeto dinárico, que crece entre 700 y 1200 metros;
      más abajo da paso a hayedos submontanos. En lo alto la cima está pelada; más abajo crecen sauce enano y
      pino mugo, y en las grietas de las rocas, plantas protegidas como la primavera de Carniola.


      La meseta recibe la bora, un viento que baja hacia el mar con rachas que a menudo superan los 100 km/h.
    visit: >-
      La ruta más sencilla a la cumbre sale de Tiha Dolina, en Predmeja. Empieza por la carretera hacia la
      aldea de Korenina, gira a la izquierda tras una corta subida y sigue el camino marcado hacia Golaki.
      Cruza el bosque y dolinas hasta la cima rocosa, adornada solo con brezo bajo. Desde arriba se ven los
      Alpes Julianos y el Triglav, los Alpes de Kamnik y las Karavanke y, al otro lado, el Adriático y el
      valle del Po. La meseta atrae además a ciclistas por su paisaje de bosques y cumbres abiertas.
    history: >-
      Aquí se cortó hielo. A finales del siglo XIX se sacaban de la cueva de Paradana bloques de 10 a 40 kg
      que se llevaban de noche a Gorizia o Trieste. En la Primera Guerra Mundial, las autoridades militares
      crearon una unidad que exploraba las cuevas heladas para abastecer de agua y hielo el frente del Soča.


      Hoy la meseta está poco poblada: solo la parte occidental está habitada, y la meseta es una de las zonas
      menos pobladas de Eslovenia.
    before: >-
      Los mejores meses van de mayo a octubre; calcula uno o dos días. La Gran Cueva de Hielo solo es
      accesible hasta su entrada, donde el frío crea una inversión de vegetación. Cerca de Predmeja hay una
      sima que desciende 884 m.
    around: >-
      A seis kilómetros queda el [Karst Clásico y Sistema Subterráneo
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/). A diecinueve está el [Parque Nacional de
      Triglav](/lugar/triglav-southern-karst-plateau/), a veintidós el [Bosque de Tarvisio y Alpes Julianos
      Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) y a veinticuatro la [Meseta de
      Pokljuka](/lugar/pokljuka-plateau/).
  en:
    intro: >-
      Precipitation falls heavily across this plateau, yet not a single stream runs on its surface. The Trnovo
      plateau receives an annual average of some 1881 mm of rainfall, all of which vanishes underground into
      an intricate subterranean karst realm without surface runoff, broken into blind valleys, rounded hills,
      caves, deep chasms, limestone pavement, and solution pans. It forms the northwestern bastion of the
      Dinaric Alps, rearing high above the Vipava valley with dense woods on its flanks and bare karst crags
      above.
    landscape: >-
      The geological narrative began beneath ancient seas. Much of the plateau bedrock originated as a
      colossal fossiliferous coral reef packed with shells, gastropods, and corals. Two-thirds of the bedrock
      is limestone, one-quarter dolomite, and the remainder flysch and loose debris. Tectonic uplift raised
      the sea floor into mountain ranges, while acidic rainwater hollowed the limestone. Ice Age glaciers
      later carved small cirques and deposited moraines across the elevated plain.


      The most striking geomorphological phenomena are deep collapse hollows such as Mrzla draga, Mojska,
      Smrekova, and Črna draga. They are so profound and sheltered that cold air stagnates at the bottom,
      creating sharp thermal and botanical inversions: Smrekova draga stands as the textbook example of a
      frost hollow. Another pristine forest reserve on the plateau is left entirely to natural wilderness
      without human interference.


      Subterranean wonders include the Great Ice Cave of Paradana, preserving perennial ice down to 150 m
      depth, protected as a national natural monument. Near the clifftop village of Otlica sits a celebrated
      natural rock window accessible via an easy trail from the hamlet. In addition, the Wild Lake (Divje
      jezero) is a renowned Vauclusian karst resurgence and deep unexplored siphon pool.
    wildlife: >-
      Dense forest cloaks 75.5 % of the plateau, continuing to expand as abandoned agricultural clearings
      regenerate naturally. It consists predominantly of Dinaric beech-fir forest flourishing between 700 and
      1200 metres, transitioning lower down into submontane beechwoods. The highest peaks are windswept and
      bald, skirted below by dwarf willow and mountain pine scrub, while rock crevices harbor protected
      botanical endemics like the Carniolan primrose.


      The plateau regularly catches the ferocious bora, a frigid katabatic wind that hurtles toward the
      Adriatic Sea with gusts frequently exceeding 100 km/h.
    visit: >-
      The most direct ascent to the highest summit departs from Tiha Dolina in Predmeja. It follows the lane
      toward the hamlet of Korenina, bends left after a brief uphill grade, and follows the waymarked path
      toward Golaki. It traverses high woodland and dolines to reach the stony apex adorned with low heather.
      The summit provides grand vistas of the Julian Alps crowned by Mount Triglav, the Kamnik Alps, the
      Karavanke, and across to the Adriatic coast and the Po valley. The plateau is also highly prized by
      cyclists for its network of gravel forest tracks.
    history: >-
      For centuries, ice harvesting formed a vital local industry. In the late nineteenth century, workers
      extracted ice blocks weighing 10 to 40 kg from Paradana cave, transporting them by night in horse carts
      to Gorizia and Trieste. During the First World War, military engineers established a specialized unit to
      exploit the ice caves, supplying freshwater and ice to troops along the bloody Soča Front.


      Today the plateau is sparsely inhabited: permanent settlements cling only to its western fringe, ranking
      among the least populated highland districts in Slovenia.
    before: >-
      The most favorable months run from May to October; allow one to two days for a thorough visit. The Great
      Ice Cave of Paradana is accessible only as far as its entrance chamber, where cold airflow creates a
      marked vegetation inversion. Near Predmeja, an abyss plunges 884 m.
    around: >-
      Six kilometres away lies the [Classical Karst and Postojna-Planina Cave
      System](/lugar/postonjska-jama---planinsko-polje/). Nineteen kilometres away sits [Triglav National
      Park](/lugar/triglav-southern-karst-plateau/), twenty-two kilometres distant is the [Tarvisio Forest and
      Italian Julian Alps](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/), and twenty-four kilometres
      away lies the [Pokljuka Plateau](/lugar/pokljuka-plateau/).
  fr:
    intro: >-
      Il pleut ici bien plus que de coutume, pourtant aucun ruisseau ne coule à l'air libre. Le plateau de
      Trnovo reçoit en moyenne quelque 1881 mm de précipitations annuelles, et cette eau s'engouffre
      immédiatement sous terre : c'est un haut plateau karstique sans drainage superficiel, morcelé en vallées
      aveugles, buttes, gouffres, lapiaz et dolines. Il forme l'extrémité nord-ouest des Alpes dinariques,
      dominant la vallée de la Vipava de ses pentes boisées couronnées de crêtes nues.
    landscape: >-
      L'histoire s'enracine au fond des mers anciennes. Une grande part des roches dérive d'un vaste récif
      corallien fossilisé. Deux tiers de la superficie sont constitués de calcaire, un quart de dolomie et le
      reste de flysch. Le soulèvement tectonique a ensuite exhaussé ces fonds marins tandis que la pluie
      dissolvait la roche. D'anciens glaciers y ont laissé de petits cirques et des moraines sur ce qui
      formait une surface aplanie.


      La curiosité majeure réside dans les dépressions d'effondrement comme Mrzla draga, Mojska, Smrekova et
      Črna draga. Elles sont si encaissées que l'air glacial y reste piégé, provoquant une inversion thermique
      et végétale spectaculaire : Smrekova draga en est le parangon. Une autre réserve du plateau est laissée
      en libre évolution sans aucune intervention sylvicole.


      Sous terre, la Grande Grotte de Glace de Paradana abrite des glaces pérennes jusqu'à 150 m de
      profondeur, classée monument naturel. Près du village d'Otlica, sur le rebord oriental, se dresse une
      arche rocheuse naturelle facile d'accès. Le Wild Lake (Divje jezero) forme quant à lui une résurgence
      vauclusienne débouchant dans un lac au siphon inexploré.
    wildlife: >-
      La forêt recouvre 75,5 % du plateau et progresse encore sur d'anciennes friches agricoles. C'est avant
      tout une hêtraie-sapinière dinarique s'étageant entre 700 et 1200 mètres, relayée en contrebas par des
      hêtraies submontagnardes. Les crêtes sommitales sont dénudées, bordées plus bas de saules nains et de
      pins mugos, tandis que les fissures rocheuses abritent la primevère de Carniole.


      Le plateau subit la bora, vent catabatique violent dévalant vers la mer avec des rafales excédant
      souvent 100 km/h.
    visit: >-
      L'itinéraire le plus simple vers le sommet part de Tiha Dolina à Predmeja. Il emprunte la route vers le
      hameau de Korenina, oblique à gauche après une courte rampe et suit le sentier balisé vers Golaki. Il
      traverse hêtraies et dolines pour déboucher sur le dôme sommital rocheux orné de bruyères. Du sommet, la
      vue embrasse les Alpes juliennes dominées par le Triglav, les Alpes de Kamnik, les Karavanke, et au sud
      l'Adriatique et la plaine du Pô. Le plateau attire également les adeptes du vélo tout-terrain.
    history: >-
      On y exploitait jadis la glace naturelle. À la fin du dix-neuvième siècle, on extrayait de la grotte de
      Paradana des blocs de 10 à 40 kg transportés de nuit en chariot vers Gorizia et Trieste. Durant la
      Première Guerre mondiale, les états-majors mirent sur pied une unité spéciale chargée d'exploiter ces
      glacières pour ravitailler en eau le front de l'Isonzo (Soča).


      Aujourd'hui le plateau est très peu peuplé, seuls quelques hameaux subsistant sur sa bordure
      occidentale.
    before: >-
      Les mois les plus propices s'étalent de mai à octobre ; comptez un à deux jours. La Grande Grotte de
      Glace de Paradana n'est accessible que jusqu'à son porche d'entrée. Près de Predmeja, un gouffre plonge
      à 884 m.
    around: >-
      À six kilomètres se trouve le [Karst classique et réseau souterrain de
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/). À dix-neuf kilomètres s'élève le [parc
      national du Triglav](/lugar/triglav-southern-karst-plateau/), à vingt-deux kilomètres la [forêt de
      Tarvisio et les Alpes juliennes italiennes](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) et à
      vingt-quatre kilomètres le [plateau de Pokljuka](/lugar/pokljuka-plateau/).
  de:
    intro: >-
      Hier regnet es ergiebiger als erwartet, doch kein einziger Bach plätschert über die Oberfläche. Die
      Trnovo-Hochebene erhält im Jahresmittel rund 1881 mm Niederschlag, und all dieses Wasser versickert
      augenblicklich im Karstuntergrund: eine Hochebene ohne oberirdische Fließgewässer, zerklüftet von
      Blindtälern, Kuppen, Höhlen, Schlünden und Karrenfeldern. Sie bildet den nordwestlichen Eckpfeiler der
      Dinarischen Alpen über dem Vipava-Tal, flankiert von dichten Bergwäldern und kahlen Hochkämmen.
    landscape: >-
      Die Entstehung begann in warmen Urmeeren. Ein Großteil der Gesteine geht auf ein fossiles Korallenriff
      zurück. Zwei Drittel der Oberfläche bestehen aus Kalkstein, ein Viertel aus Dolomit und der Rest aus
      Flysch. Tektonische Hebungen hoben den Meeresboden empor, während kohlensäurehaltiges Regenwasser das
      Gestein löste. Eiszeitliche Gletscher hinterließen kleine Kare und Moränen auf der Hochfläche.


      Bemerkenswert sind die tiefen Einsturzdolinen wie Mrzla draga, Mojska, Smrekova und Črna draga. Sie sind
      derart tief und kesselförmig, dass die Kaltluft am Boden stagniert und eine Vegetationsinversion
      bewirkt: Smrekova draga gilt als Paradebeispiel einer Frostsenke. Ein weiteres Waldreservat auf der
      Hochfläche ist vollständig der ungestörten Natur überlassen.


      Im Untergrund verbirgt die Große Eishöhle von Paradana bis in 150 m Tiefe ewiges Eis, geschützt als
      Naturdenkmal. Beim Dorf Otlica am Plateaurand durchbricht ein bekanntes Felsenfenster die Kante. Der
      Wild Lake (Divje jezero) bildet eine vauclusianische Karstquelle mit einem tiefen, unerforschten Siphon.
    wildlife: >-
      Wald bedeckt 75,5 % des Plateaus und breitet sich auf aufgelassenen Kulturflächen weiter aus. Es
      dominiert dinarischer Buchen-Tannen-Wald zwischen 700 und 1200 Metern Höhe, der talwärts in submontane
      Buchenwälder übergeht. Die Gipfelkuppen sind kahl, gesäumt von Zwergweiden und Bergkiefern, während in
      Felsspitzen geschützte Endemiten wie die Krainer Primel wurzeln.


      Das Plateau ist der Bora ausgesetzt, einem stürmischen Fallwind, dessen Böen häufig 100 km/h
      übertreffen.
    visit: >-
      Der einfachste Aufstieg zum Gipfel beginnt in Tiha Dolina bei Predmeja. Er folgt der Straße zum Weiler
      Korenina, zweigt nach kurzer Steigung links ab und folgt dem markierten Bergweg zu den Golaki-Gipfeln.
      Durch Wald und Dolinengelände gelangt man zur felsigen Kuppe. Oben öffnet sich der Rundblick auf
      Julische Alpen mit dem Triglav, Steiner Alpen, Karawanken und südwärts zur Adria. Das Plateau wird zudem
      von Mountainbikern geschätzt.
    history: >-
      Einst wurde hier gewerbsmäßig Höhleneis abgebaut. Im späten neunzehnten Jahrhundert brach man in der
      Höhle von Paradana Eisblöcke von 10 bis 40 kg, die nachts per Fuhrwerk nach Görz und Triest gekarrt
      wurden. Im Ersten Weltkrieg betrieb das Militär eine Sondereinheit zur Eisgewinnung, um die Truppen an
      der Isonzofront (Soča) mit Trinkwasser zu versorgen.


      Heute ist das Plateau dünn besiedelt: Nur der Westrand ist bewohnt, womit das Gebiet zu den einsamsten
      Regionen Sloweniens gehört.
    before: >-
      Die besten Reisemonate sind Mai bis Oktober; plane ein bis zwei Tage ein. Die Große Eishöhle von
      Paradana ist nur bis zum Eingangsbereich zugänglich. Bei Predmeja stürzt ein Schacht 884 m in die Tiefe.
    around: >-
      Sechs Kilometer entfernt liegt der [Klassische Karst und das Höhlensystem
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/). Neunzehn Kilometer weit liegt der
      [Nationalpark Triglav](/lugar/triglav-southern-karst-plateau/), zweiundzwanzig Kilometer der [Wald von
      Tarvisio und die italienischen Julischen Alpen](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) und
      vierundzwanzig Kilometer die [Pokljuka-Hochebene](/lugar/pokljuka-plateau/).
  it:
    intro: >-
      Qui piove molto più di quanto ci si aspetterebbe, eppure in superficie non scorre neanche un ruscello.
      L'altopiano di Trnovo (Selva di Tarnova) riceve in media circa 1881 mm di precipitazioni all'anno, e
      tutta quest'acqua sparisce nelle profondità: è un rilievo carsico privo di drenaggio superficiale,
      solcato da valli cieche, poggi, voragini, campi solcati e doline. Rappresenta l'avamposto
      nord-occidentale delle Alpi Dinariche affacciato sulla valle del Vipacco, cinto da fitte foreste e
      sormontato da creste pietrose.
    landscape: >-
      La storia geologica affonda nelle acque marine mesozoiche. Buona parte delle formazioni rocciose deriva
      da un'antica scogliera corallina ricca di fossili. Due terzi del suolo sono composti da calcari, un
      quarto da dolomie e la frazione residua da flysch. Il sollevamento tettonico fece emergere la
      piattaforma marina mentre le piogge dissolvevano la roccia. Antichi ghiacciai hanno modellato piccoli
      circhi e morene sul vasto pianoro sommitale.


      Il fenomeno geomorfologico più singolare è dato dalle profonde doline d'inversione termica come Mrzla
      draga, Mojska, Smrekova e Črna draga. Sono depressioni talmente incassate che l'aria gelida ristagna sul
      fondo generando una netta inversione di temperatura e di vegetazione: Smrekova draga ne rappresenta il
      modello classico. Un'ulteriore riserva del massiccio è affidata alla libera evoluzione forestale senza
      tagli.


      Nel sottosuolo, la Grande Grotta di Ghiaccio di Paradana conserva ghiaccio perenne fino a 150 m di
      profondità, tutelata quale monumento naturale. Presso il villaggio di Otlica si apre una finestra
      naturale nella roccia facilmente raggiungibile a piedi. Il Lago Selvaggio (Divje jezero) è una notevole
      risorgiva carsica con un profondo sifone inesplorato.
    wildlife: >-
      Il manto forestale ricopre il 75,5 % dell'altopiano ed è in costante espansione sui pascoli abbandonati.
      È costituito prevalentemente dalla faggeta-abetina dinarica che vegeta tra 700 e 1200 metri, sostituita
      più in basso da boschi di faggio submontano. Sulle cime spoglie allignano salice nano e pino mugo,
      mentre nelle fessure calcaree fiorisce la primula di Carniola.


      L'altopiano è sferzato dalla bora, vento catabatico impetuoso con raffiche che superano frequentemente i
      100 km/h.
    visit: >-
      La salita più lineare alla cima parte da Tiha Dolina presso Predmeja. Imbocca la stradina verso
      Korenina, piega a sinistra dopo una breve salita e segue il sentiero segnalato verso i monti Golaki. Si
      attraversano boschi e doline fino al culmine roccioso coperto di brugo. Dalla vetta lo sguardo abbraccia
      le Giulie col Triglav, le Alpi di Kamnik, le Caravanche e verso sud l'Adriatico e la pianura padana.
      L'altopiano è mèta ambita per la mountain bike.
    history: >-
      In passato vi fiorì il commercio del ghiaccio naturale. Verso la fine del diciannovesimo secolo dalla
      grotta di Paradana si cavavano blocchi di ghiaccio da 10 a 40 kg trasportati nottetempo verso Gorizia e
      Trieste. Nel corso della Grande Guerra i comandi militari organizzarono un reparto speciale per estrarre
      ghiaccio da impiegare sul fronte dell'Isonzo (Soča).


      Oggi l'altopiano è scarsamente abitato: solo la frangia occidentale ospita insediamenti stabili,
      figurando tra le aree montane più spopolate della Slovenia.
    before: >-
      I mesi più indicati vanno da maggio a ottobre; metti in conto uno o due giorni. La Grande Grotta di
      Ghiaccio di Paradana è visitabile solo fino all'atrio d'ingresso. Presso Predmeja si spalanca una
      voragine profonda 884 m.
    around: >-
      A sei chilometri si trova il [Carso Classico e Sistema Sotterraneo
      Postumia-Planina](/lugar/postonjska-jama---planinsko-polje/). A diciannove chilometri sorge il [Parco
      nazionale del Triglav](/lugar/triglav-southern-karst-plateau/), a ventidue la [Foresta di Tarvisio e
      Alpi Giulie Italiane](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) e a ventiquattro l'[Altopiano
      di Pokljuka](/lugar/pokljuka-plateau/).
  pt:
    intro: >-
      Chove aqui com invulgar intensidade, contudo não corre um único ribeiro à superfície. O planalto de
      Trnovo recebe em média cerca de 1881 mm de precipitação anual, e toda essa água submerge de imediato no
      subsolo: é um relevo cársico sem hidrografia superficial, retalhado em vales cegos, cerros, covas,
      algares e campos de lapiás. Constitui o extremo noroeste dos Alpes Dináricos alcandorado sobre o vale de
      Vipava, com encostas florestadas e cumes nus.
    landscape: >-
      A génese geológica iniciou-se em mares quentes pretéritos. Grande fração do substrato provém de um
      recife de coral fóssil com abundantes conchas e corais. Dois terços do território são calcários, um
      quarto dolomitos e a restante porção flysch. Os movimentos orogénicos soergueram o relevo e as águas
      pluviais dissolveram a rocha. Antigos glaciares deixaram circos e moreias sobre a superfície aplanada.


      O traço mais invulgar reside nas profundas dolinas de colapso como Mrzla draga, Mojska, Smrekova e Črna
      draga. São tão fundas e confinadas que o ar gélido assenta no fundo gerando inversão térmica e
      vegetacional: Smrekova draga é o exemplo emblemático. Outra reserva integral do planalto é mantida em
      estrita evolução natural sem cortes florestais.


      Nas entranhas da serra, a Grande Gruta de Gelo de Paradana alberga gelo perene até aos 150 m de
      profundidade, monumento natural classificado. Perto de Otlica rasga-se uma célebre janela natural na
      rocha de acesso fácil. O Lago Selvagem (Divje jezero) consiste numa ressurgência vauclusiana profunda
      com sifão inexplorado.
    wildlife: >-
      A floresta ocupa 75,5 % do planalto e expande-se sobre terrenos agrícolas abandonados. É essencialmente
      um faial-abetal dinárico que medra entre os 700 e os 1200 metros, cedendo lugar em cotas inferiores a
      faiais submontanos. Os cumes mais altos são descampados, ladeados por salgueiro-anão e pinheiro-anão,
      abrigando as fendas rochosas a prímula-da-Carniola.


      O planalto enfrenta amiúde a bora, vento catabático que desce veloz para o mar com rajadas que superam
      frequentemente os 100 km/h.
    visit: >-
      A rota mais acessível até ao cume parte de Tiha Dolina em Predmeja. Segue pela estrada para o lugar de
      Korenina, vira à esquerda após ligeira subida e prossegue pelo trilho marcado rumo aos picos Golaki.
      Atravessa matas e dolinas até ao cimo rochoso coberto de urze. Do topo descortinam-se os Alpes Julianos
      dominados pelo Triglav, os Alpes de Kamnik, Karavanke e o mar Adriático. O planalto atrai igualmente
      praticantes de BTT pelas pistas de gravilha.
    history: >-
      Aqui laborou uma próspera indústria do gelo. No final do século dezanove extraíam-se da gruta de
      Paradana blocos de 10 a 40 kg transportados de noite em carroças para Gorizia e Trieste. Na Primeira
      Guerra Mundial o exército organizou uma brigada militar para explorar as cavernas glaciares abastecendo
      a frente do Soča de água potável.


      Hoje o planalto é muito despovoado: apenas a orla ocidental mantém povoamento fixo, constituindo um dos
      recantos mais isolados da Eslovénia.
    before: >-
      Os meses recomendados decorrem de maio a outubro; prevê um a dois dias. A Grande Gruta de Gelo de
      Paradana apenas é visitável até à entrada. Perto de Predmeja abre-se um algar que desce 884 m.
    around: >-
      A seis quilómetros fica o [Carso Clássico e Sistema Subterrâneo
      Postojna-Planina](/lugar/postonjska-jama---planinsko-polje/). A dezanove quilómetros ergue-se o [Parque
      Nacional do Triglav](/lugar/triglav-southern-karst-plateau/), a vinte e dois a [Floresta de Tarvisio e
      Alpes Julianos Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/) e a vinte e quatro o
      [Planalto de Pokljuka](/lugar/pokljuka-plateau/).
