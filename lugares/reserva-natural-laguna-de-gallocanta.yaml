resumen:
  es: >-
    La mayor laguna salada de Europa occidental y el principal punto de paso de la grulla común en la
    península.
  en: Western Europe's largest saline lagoon and the Iberian Peninsula's foremost stopover for the common crane.
  fr: >-
    La plus grande lagune salée d'Europe occidentale et la halte majeure de la grue cendrée dans la péninsule
    Ibérique.
  de: Westeuropas größte Salzlagune und wichtigster Rastplatz des Graukranichs auf der Iberischen Halbinsel.
  it: >-
    La più vasta laguna salata dell'Europa occidentale e il principale snodo di sosta della gru comune nella
    penisola iberica.
  pt: >-
    A maior lagoa salgada da Europa ocidental e o principal ponto de paragem do grou-comum na Península
    Ibérica.
unico:
  es: >-
    Una laguna salada de apenas dos metros de profundidad, a mil metros de altitud, se convierte cada otoño en
    la mejor parada de grullas de la península.
  en: >-
    A saline lagoon barely two metres deep, set at a thousand metres altitude, transforms each autumn into the
    Iberian Peninsula's premier crane stopover.
  fr: >-
    Une lagune salée d'à peine deux mètres de profondeur, perchée à mille mètres d'altitude, devient chaque
    automne la halte d'hivernage de grues la plus spectaculaire de la péninsule.
  de: >-
    Eine kaum zwei Meter tiefe Salzlagune auf tausend Metern Höhe verwandelt sich jeden Herbst in den
    bedeutendsten Kranichrastplatz der Iberischen Halbinsel.
  it: >-
    Una laguna salata di appena due metri di profondità, a mille metri di quota, si trasforma ogni autunno
    nella più straordinaria tappa per le gru della penisola.
  pt: >-
    Uma lagoa salgada com apenas dois metros de profundidade, a mil metros de altitude, converte-se em cada
    outono no melhor ponto de paragem de grous da península.
observaciones:
  es: >-
    La época es de octubre a marzo, con el paso y la concentración de grullas. La afluencia es media en los
    observatorios al amanecer y al atardecer durante el paso de grullas.
texto:
  es:
    intro: >-
      A mediados de octubre empiezan a llegar las primeras grullas, tímidas, en pequeños grupos, desde el
      norte y el este de Europa. Han volado miles de kilómetros y han encontrado el sitio donde parar a
      descansar y alimentarse: Gallocanta, la mayor laguna natural de la península ibérica, a unos mil metros
      de altitud, entre las provincias de Zaragoza y Teruel. En unas semanas la cuenca se llena. Hay días de
      noviembre en que se censan más de 19.000 grullas, y el censo invernal da una media de 150 000 aves.
    landscape: >-
      Gallocanta mide como máximo 7 km de largo y 2 de ancho, ocupa 1924 ha y está rodeada por otras 4553 ha
      de zona periférica de protección. Es una cuenca endorreica de montaña: un valle cerrado, sin salida al
      mar, en el sistema Ibérico, entre las comarcas de Campo de Daroca y Jiloca. La altitud oscila entre 995
      y 1085 metros, y la rodean las sierras de Santa Cruz y Pardos, Menera y Caldereros.


      Aquí el agua es poca y salada. La profundidad media es de 70 cm y la máxima de 2 m. Las aguas llegan
      sobre todo de torrentes subterráneos y son diez veces más saladas que el mar, de modo que en los
      periodos secos se forman costras de sal en las playas. Junto con la laguna de Fuente de Piedra, en
      Málaga, es la mayor laguna salada de Europa. Y por esa sal no hay peces: hay aves, reptiles y anfibios
      en arroyos y balsas, y mamíferos en las sierras y montes.


      La vegetación se reparte en bandas. Las plantas halófilas soportan la salinidad, y entre ellas hay
      endemismos y especies protegidas como Puccinellia pungens, Lythrum flexuosum y Anacamptis palustris. En
      las zonas de aguas más dulces destacan los carrizales y espadañales. En los montes todavía hay pinos,
      carrascas, quejigos y enebros. Y alrededor, la laguna, casi un ambiente estepario, está llena de campos
      de cereales, girasoles, maíces, hortalizas y alfalfa.
    wildlife: >-
      El calendario lo marcan las [grullas](/especie/grus_grus/). Llegan del norte de Europa de mediados de
      octubre a mediados de diciembre, y una parte inverna hasta la primavera. Las primeras llegan de forma
      tímida y gradual en las primeras semanas de migración de otoño. En primavera, la migración empieza en
      febrero y termina a principios de marzo. Desde los años 70 se adelanta, algo que se relaciona con
      temperaturas más altas y menos superficie encharcada, efectos del cambio climático.


      Pero no solo hay grullas. Gallocanta es el enclave más importante de aves acuáticas de Aragón y el
      segundo de la península después de Doñana. Se han contado más de 220 especies de aves, entre ellas
      buitres, águilas, abubillas y fochas. El censo invernal da una media de 150 000 aves, con un máximo de
      400 000 en el invierno de 1998.


      En las sierras y montes que rodean la laguna viven corzos, comadrejas, zorros, [gatos
      monteses](/especie/felis_silvestris/), jabalíes, martas, conejos y tejones.
    visit: >-
      El mejor sitio para empezar es el Centro de Interpretación de la reserva, en la carretera que une Bello
      y Tornos. Desde allí, el programa «De ruta con las grullas» ofrece visitas guiadas gratuitas, con un
      educador ambiental, con paradas explicativas y de observación. En otoño se hacen todos los fines de
      semana y festivos hasta primeros de diciembre, en dos pases, a las 10.30 y a las 15.30, con reserva
      previa.


      El recorrido guiado dura tres horas, se hace sobre todo en coche por pistas de tierra en buen estado y
      exige vehículo propio. No exige técnica, pero es largo y se recomienda para mayores de 6 años. Lleva
      ropa de abrigo y, si los tienes, prismáticos. El observatorio de Gallocanta tiene firme accesible y
      espacio interior libre de obstáculos para sillas de ruedas.
    history: >-
      Antiguamente en la zona se cultivaban viñas y azafrán. Hoy la laguna se protege como reserva natural,
      declarada el 30 de noviembre de 2006 por la ley 11/2006 de Aragón, y es también LIC y ZEPA.
    before: >-
      La época es de octubre a marzo, con el paso y la concentración de grullas. La afluencia es media en los
      observatorios al amanecer y al atardecer durante el paso de grullas.
    around: >-
      Gallocanta no tiene vecinos cercanos en el atlas, pero comparte hábitat con otras estepas. El [Parque
      Natural Bardenas Reales de Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) y la [Reserva
      Natural Nacional del Coussoul de Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/)
      comparten con ella el [sisón común](/especie/tetrax_tetrax/) y la [ganga
      ibérica](/especie/pterocles_alchata/); Bardenas, además, la alondra ricotí. El [Parque Nacional de
      Hortobágy - La Puszta Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) comparte la [grulla
      común](/especie/grus_grus/) y la [avutarda](/especie/otis_tarda/), con humedales y estepas.
  en:
    intro: >-
      By mid-October the first cranes begin arriving timidly, in small flocks, from northern and eastern
      Europe. Having flown thousands of kilometres, they find their haven to rest and refuel: Gallocanta, the
      largest natural lake on the Iberian Peninsula, lying at about a thousand metres altitude between the
      provinces of Zaragoza and Teruel. Within weeks the basin fills to capacity. On peak November days over
      19,000 cranes are counted, and winter censuses average 150,000 birds.
    landscape: >-
      Gallocanta stretches at most 7 km long by 2 wide, spanning 1924 ha encircled by another 4553 ha of
      peripheral buffer zone. It is an upland endorheic basin: a closed valley without an outlet to the sea,
      nestled within the Iberian System between Campo de Daroca and Jiloca. Elevations range between 995 and
      1085 metres, framed by the Sierra de Santa Cruz, Pardos, Menera, and Caldereros ranges.


      Water is sparse and intensely saline here. Average water depth is barely 70 cm with a maximum of 2 m.
      The lake is replenished primarily by subterranean aquifers and tests ten times saltier than the ocean,
      so that during arid spells thick salt crusts coat the shoreline. Together with Fuente de Piedra lagoon
      in Málaga, it ranks as the largest saline lake in Europe. Due to this hypersalinity fish are entirely
      absent: birdlife, amphibians, and reptiles populate streams and pools, while mammals inhabit the
      surrounding ranges.


      Vegetation arranges itself in concentric bands. Halophytic plants withstand severe salinity, among them
      endemics and protected botanicals such as Puccinellia pungens, Lythrum flexuosum, and Anacamptis
      palustris. In fresher water pockets reedbeds and cattails flourish. The uplands preserve stands of Scots
      pine, holm oak, gall oak, and juniper. Surrounding the lagoon, the steppe-like basin is partitioned into
      fields of grain, sunflowers, maize, vegetables, and alfalfa.
    wildlife: >-
      The seasonal rhythm is governed by the [common crane](/especie/grus_grus/). Flocks arrive from northern
      Europe between mid-October and mid-December, with a substantial contingent overwintering until spring.
      The vanguard arrives gradually in the opening weeks of autumn migration. In spring, northbound passage
      commences in February, concluding by early March. Since the 70s the passage has been shifting earlier, a
      trend linked to warming temperatures and shrinking flooded surface area under climate change.


      Yet cranes are not alone. Gallocanta represents Aragon's most critical wetland for waterbirds and
      Spain's second-most significant after Doñana. More than 220 bird species have been recorded, including
      vultures, eagles, hoopoes, and coots. The winter census averages 150,000 birds, peaking at 400,000 in
      the winter of 1998.


      In the surrounding sierras and hills roam roe deer, weasels, foxes, [European
      wildcats](/especie/felis_silvestris/), wild boars, martens, rabbits, and badgers.
    visit: >-
      The best place to begin is the reserve's Visitor Centre, situated along the road linking Bello and
      Tornos. From there, the 'Route of the Cranes' programme offers free guided excursions accompanied by an
      environmental educator, featuring observation stops and interpretive explanations. In autumn these take
      place every weekend and public holiday until early December, in two daily slots, at 10.30 and 15.30,
      requiring prior reservation.


      The guided itinerary lasts three hours, conducted primarily by vehicle along well-maintained gravel
      tracks and requiring your own transport. It demands no physical exertion, but is lengthy and recommended
      for visitors aged 6 and above. Bring warm clothing and binoculars if available. The Gallocanta
      observatory provides accessible paving and unobstructed interior spaces for wheelchairs.
    history: >-
      In centuries past, local lands were cultivated with grapevines and saffron. Today the lagoon is
      protected as a nature reserve, designated on 30 November 2006 under Law 11/2006 of Aragon, additionally
      holding SCI and SPA conservation status.
    before: >-
      The peak window spans October to March, coinciding with crane migration and overwintering
      concentrations. Visitor presence is moderate at the hides around sunrise and sunset during the height of
      crane passage.
    around: >-
      Gallocanta has no immediate neighbours in the atlas, but shares steppe affinities with other expanses.
      The [Bardenas Reales Natural Park of Navarre](/lugar/parque-natural-bardenas-reales-de-navarra/) and the
      [Coussoul de Crau National Nature Reserve](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/)
      share with it the [little bustard](/especie/tetrax_tetrax/) and the [pin-tailed
      sandgrouse](/especie/pterocles_alchata/); Bardenas additionally shares Dupont's lark. The [Hortobágy
      National Park - The Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) shares the [common
      crane](/especie/grus_grus/) and the [great bustard](/especie/otis_tarda/), across vast wetlands and
      steppes.
  fr:
    intro: >-
      Vers la mi-octobre, les premières grues commencent à arriver discrètement, en petits groupes, venues du
      nord et de l'est de l'Europe. Après avoir parcouru des milliers de kilomètres, elles trouvent leur havre
      pour reprendre des forces : Gallocanta, la plus vaste lagune naturelle de la péninsule Ibérique, lovée à
      environ mille mètres d'altitude entre Saragosse et Teruel. En quelques semaines, la cuvette se remplit.
      Certains jours de novembre, on dénombre plus de 19 000 grues, et les recensements hivernaux affichent
      une moyenne de 150 000 oiseaux.
    landscape: >-
      Gallocanta mesure au maximum 7 km de long sur 2 de large, occupant 1924 ha ceinturés par 4553 ha
      supplémentaires de zone périphérique de protection. C'est une cuvette endoréique d'altitude : une
      dépression fermée, sans exutoire vers la mer, au cœur du système Ibérique entre les comarques de Campo
      de Daroca et de Jiloca. L'altitude fluctue entre 995 et 1085 mètres, sous la garde des sierras de Santa
      Cruz, Pardos, Menera et Caldereros.


      L'eau y est mesurée et très salée. La profondeur moyenne n'est que de 70 cm pour un maximum de 2 m. Les
      apports proviennent essentiellement d'infiltrations souterraines et sont dix fois plus salés que l'eau
      de mer, si bien qu'en période sèche des croûtes salines recouvrent les grèves. Avec la lagune de Fuente
      de Piedra, à Malaga, elle constitue la plus vaste lagune salée d'Europe. Cette salinité exclut tout
      poisson : oiseaux, reptiles et batraciens occupent ruisseaux et mares, tandis que les mammifères
      peuplent les reliefs voisins.


      La végétation s'organise en ceintures concentriques. Les espèces halophiles bravent le sel, parmi
      lesquelles des endémiques et plantes protégées telles que Puccinellia pungens, Lythrum flexuosum et
      Anacamptis palustris. Dans les secteurs plus doux dominent roselières et massettes. Les hauteurs portent
      encore des pins, des chênes verts, des chênes faginés et des genévriers. Tout autour, la lagune s'insère
      dans un paysage quasi steppique de cultures céréalières, de tournesols, de maïs, de maraîchage et de
      luzerne.
    wildlife: >-
      Le calendrier des lieux est dicté par la [grue cendrée](/especie/grus_grus/). Venues du nord de l'Europe
      entre la mi-octobre et la mi-décembre, une partie des troupes y hiverne jusqu'au printemps. Les
      premières cohortes arrivent avec prudence lors des semaines inaugurales de migration automnale. Au
      printemps, la remontée débute en février pour s'achever début mars. Depuis les années 70, le passage
      tend à s'avancer, en lien avec la hausse des températures et la baisse des niveaux d'eau, conséquences
      du changement climatique.


      Mais les grues ne sont pas seules. Gallocanta constitue le sanctuaire d'oiseaux d'eau le plus important
      d'Aragon et le deuxième de la péninsule après Doñana. On y a recensé plus de 220 espèces d'oiseaux, dont
      vautours, aigles, huppes et foulques. Le décompte hivernal moyen atteint 150 000 oiseaux, avec un pic
      historique de 400 000 durant l'hiver 1998.


      Dans les sierras et collines entourant la dépression vivent chevreuils, belettes, renards, [chats
      sauvages](/especie/felis_silvestris/), sangliers, martres, lapins et blaireaux.
    visit: >-
      Le point de départ idéal est le centre d'interprétation de la réserve, sur la route reliant Bello à
      Tornos. De là, le programme « De ruta con las grullas » organise des sorties guidées gratuites animées
      par un éducateur à l'environnement, avec haltes commentées et séances d'observation. En automne, elles
      se déroulent chaque week-end et jour férié jusqu'à début décembre, en deux créneaux, à 10.30 et à 15.30,
      sur réservation préalable.


      Le parcours guidé dure trois heures, s'effectue essentiellement en voiture sur des pistes en terre
      carrossables et nécessite son propre véhicule. Ne réclamant aucune technicité, il est toutefois assez
      long et conseillé à partir de 6 ans. Prévoyez des vêtements très chauds et des jumelles. L'observatoire
      de Gallocanta dispose d'un accès de plain-pied et d'espaces dégagés adaptés aux fauteuils roulants.
    history: >-
      Jadis, la région était vouée à la vigne et au safran. Aujourd'hui, la lagune est protégée au titre de
      réserve naturelle, déclarée le 30 novembre 2006 par la loi aragonaise 11/2006, et bénéficie également
      des classements en SIC et ZPS.
    before: >-
      La période propice s'étend d'octobre à mars, avec le passage et les rassemblements de grues. La
      fréquentation est moyenne dans les observatoires à l'aube et au crépuscule pendant la migration des
      grues.
    around: >-
      Gallocanta n'a pas de voisins immédiats dans l'atlas, mais partage des biotopes steppiques avec d'autres
      territoires. Le [Parc naturel des Bardenas Reales de
      Navarre](/lugar/parque-natural-bardenas-reales-de-navarra/) et la [Réserve naturelle nationale des
      Coussouls de Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/) partagent avec elle
      l'[outarde canepetière](/especie/tetrax_tetrax/) et le [ganga cata](/especie/pterocles_alchata/) ; les
      Bardenas y ajoutent le sirli de Dupont. Le [Parc national de Hortobágy - La puszta
      hongroise](/lugar/hortobagyi-nemzeti-park---puszta/) partage la [grue cendrée](/especie/grus_grus/) et
      la [grande outarde](/especie/otis_tarda/) au cœur de vastes zones humides et steppiques.
  de:
    intro: >-
      Mitte Oktober treffen die ersten Kraniche vorsichtig in kleinen Trupps aus Nord- und Osteuropa ein.
      Tausende Kilometer Flug liegen hinter ihnen, wenn sie ihren Rastplatz erreichen: Gallocanta, das größte
      natürliche Gewässer der Iberischen Halbinsel, gelegen auf rund tausend Metern Höhe zwischen Saragossa
      und Teruel. Binnen weniger Wochen füllt sich das Becken. An manchen Novembertagen werden über 19.000
      Kraniche gezählt, und die Winterzählung ergibt im Schnitt 150.000 Vögel.
    landscape: >-
      Gallocanta misst maximal 7 km in der Länge und 2 in der Breite, bedeckt 1924 ha und wird von weiteren
      4553 ha peripherer Schutzzone umrahmt. Es handelt sich um ein abflussloses Gebirgsbecken: eine
      geschlossene Senke ohne Zugang zum Meer im Iberischen Gebirge zwischen Campo de Daroca und Jiloca. Die
      Höhenlage schwankt zwischen 995 und 1085 Metern, umgeben von den Höhenzügen der Sierras de Santa Cruz,
      Pardos, Menera und Caldereros.


      Das Wasser ist spärlich und salzig. Die durchschnittliche Wassertiefe beträgt 70 cm, die maximale 2 m.
      Das Wasser stammt vor allem aus unterirdischen Zuflüssen und ist zehnmal salziger als Meerwasser, sodass
      sich in Trockenzeiten dicke Salzblanken an den Ufern ablagern. Zusammen mit der Laguna de Fuente de
      Piedra in Málaga ist sie die größte Salzwasserlagune Europas. Fische fehlen aufgrund des Salzgehalts
      völlig: Vögel, Reptilien und Amphibien leben an Gräben und Tümpeln, während Säugetiere die Bergzüge
      durchstreifen.


      Die Vegetation staffelt sich in Zonen. Halophile Pflanzen trotzen dem Salz, darunter Endemiten und
      geschützte Arten wie Puccinellia pungens, Lythrum flexuosum und Anacamptis palustris. Wo das Wasser
      süßer ist, dominieren Schilf- und Rohrkolbenbestände. An den Hängen wachsen noch Kiefern, Steineichen,
      Portugiesische Eichen und Wacholder. Rings um die Lagune liegt eine steppenartige Kulturlandschaft mit
      Feldern von Getreide, Sonnenblumen, Mais, Gemüse und Luzerne.
    wildlife: >-
      Der Jahreskreis wird vom [Kranich](/especie/grus_grus/) bestimmt. Die Vögel treffen von Mitte Oktober
      bis Mitte Dezember aus Nordeuropa ein, und ein beträchtlicher Teil überwintert bis zum Frühjahr. Die
      ersten Vögel landen zögernd und schrittweise in den ersten Wochen des Herbstzugs. Im Frühjahr setzt der
      Heimzug im Februar ein und endet Anfang März. Seit den 70er Jahren verlagert sich der Durchzug nach
      vorne, was mit steigenden Temperaturen und geringeren Wasserflächen infolge des Klimawandels
      zusammenhängt.


      Doch es gibt nicht nur Kraniche. Gallocanta ist das bedeutendste Wasservogelgebiet Aragoniens und nach
      Doñana das zweitwichtigste der Halbinsel. Mehr als 220 Vogelarten wurden registriert, darunter Geier,
      Adler, Wiedehopfe und Blässhühner. Die Winterzählung ergibt im Mittel 150.000 Vögel, mit einem
      Spitzenwert von 400.000 im Winter 1998.


      In den umliegenden Hügeln und Bergen leben Rehe, Wiesel, Füchse,
      [Wildkatzen](/especie/felis_silvestris/), Wildschweine, Marder, Wildkaninchen und Dachse.
    visit: >-
      Bester Ausgangspunkt ist das Besucherzentrum des Schutzgebiets an der Verbindungsstraße zwischen Bello
      und Tornos. Von dort bietet das Programm «Unterwegs mit den Kranichen» kostenlose Führungen mit
      Umweltpädagogen samt Erläuterungen und Beobachtungsstopps an. Im Herbst finden diese an jedem Wochenende
      und Feiertag bis Anfang Dezember in zwei Durchgängen statt, um 10.30 und um 15.30 Uhr, mit Voranmeldung.


      Die Führung dauert drei Stunden, verläuft überwiegend im eigenen Pkw über gut befahrbare Schotterpisten
      und erfordert ein eigenes Fahrzeug. Sie erfordert keine Fitness, zieht sich jedoch hin und wird ab 6
      Jahren empfohlen. Warme Kleidung und nach Möglichkeit ein Fernglas mitbringen. Die Beobachtungshütte von
      Gallocanta bietet barrierefreien Zugang und hindernisfreien Raum für Rollstuhlfahrer.
    history: >-
      Ehedem wurden in der Region Weinreben und Safran angebaut. Heute steht die Lagune als Naturreservat
      unter Schutz, ausgewiesen am 30. November 2006 durch das aragonesische Gesetz 11/2006, und ist zugleich
      als FFH-Gebiet und Vogelschutzgebiet ausgewiesen.
    before: >-
      Die Saison reicht von Oktober bis März, geprägt von Durchzug und Rast der Kraniche. Der Andrang ist
      mäßig in den Beobachtungshütten bei Sonnenauf- und -untergang zur Hauptzugzeit.
    around: >-
      Gallocanta hat keine unmittelbaren Nachbarn im Atlas, teilt aber Steppenhabitate mit anderen Gebieten.
      Der [Naturpark Bardenas Reales in Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) und das
      [Nationales Naturreservat Coussoul de Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/)
      teilen die [Zwergtrappe](/especie/tetrax_tetrax/) und das [Spießflughuhn](/especie/pterocles_alchata/);
      die Bardenas zudem die Dupontlerche. Der [Hortobágy-Nationalpark – die
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/) teilt den [Kranich](/especie/grus_grus/) und die
      [Großtrappe](/especie/otis_tarda/) in Weiten aus Feuchtgebieten und Steppen.
  it:
    intro: >-
      A metà ottobre iniziano a giungere le prime timide gru, in piccoli stormi, provenienti dal nord e
      dall'est dell'Europa. Hanno volato per migliaia di chilometri prima di scorgere il rifugio in cui
      rifocillarsi e riposare: Gallocanta, la maggiore laguna naturale della penisola iberica, adagiata a
      circa mille metri di quota tra le province di Saragozza e Teruel. In poche settimane il bacino si
      popola. Vi sono giornate di novembre in cui si contano oltre 19.000 gru, e i censimenti invernali
      rilevano una media di 150.000 volatili.
    landscape: >-
      Gallocanta misura al massimo 7 km di lunghezza per 2 di larghezza, coprendo 1924 ha cinti da altri 4553
      ha di fascia di protezione periferica. È un bacino endoreico montano: una conca chiusa, priva di sbocco
      al mare, incastonata nel Sistema Iberico tra le comarche di Campo de Daroca e Jiloca. La quota oscilla
      tra 995 e 1085 metri, incorniciata dalle catene montuose di Santa Cruz, Pardos, Menera e Caldereros.


      L'acqua è esigua e marcatamente salmastra. La profondità media è di 70 cm e la massima di 2 m. I
      rifornimenti giungono soprattutto da sorgenti sotterranee e sono dieci volte più salati dell'acqua
      marina, tanto che nei mesi aridi spesse croste saline ammantano le sponde. Unitamente alla laguna di
      Fuente de Piedra a Malaga, rappresenta il più vasto bacino salino d'Europa. A causa della salinità i
      pesci mancano del tutto: avifauna, rettili e anfibi popolano canali e pozze, mentre i mammiferi dimorano
      nei boschi collinari.


      La vegetazione si articola in cinture. Le formazioni alofile sopportano l'elevata salinità, annoverando
      endemismi e piante protette quali Puccinellia pungens, Lythrum flexuosum e Anacamptis palustris. Nei
      settori con acque più dolci risaltano canneti e tife. Sulle alture resistono pini, lecci, roverelle e
      ginepri. Tutt'intorno la laguna è orlata da un ambiente sub-steppico coltivato a cereali, girasoli,
      mais, ortaggi ed erba medica.
    wildlife: >-
      Il ritmo stagionale è scandito dalla [gru](/especie/grus_grus/). Gli stormi giungono dal nord Europa tra
      metà ottobre e metà dicembre, e una frazione vi sverna fino a primavera. Le prime avanguardie atterrano
      gradualmente nelle prime settimane di migrazione autunnale. In primavera il passo verso nord comincia a
      febbraio e si conclude ai primi di marzo. Dagli anni 70 il fenomeno tende ad anticipare, fattore
      correlato all'innalzamento delle temperature e alla riduzione degli specchi allagati per i mutamenti
      climatici.


      Ma non ci sono solo gru. Gallocanta costituisce la zona umida per avifauna acquatica più rilevante
      dell'Aragona e la seconda della penisola dopo Doñana. Sono state censite oltre 220 specie di uccelli,
      tra cui avvoltoi, aquile, upupe e folaghe. Il censimento invernale registra una media di 150.000
      uccelli, con un primato di 400.000 nell'inverno del 1998.


      Nelle colline e nelle sierre circostanti dimorano caprioli, donnole, volpi, [gatti
      selvatici](/especie/felis_silvestris/), cinghiali, martore, conigli e tassi.
    visit: >-
      Il punto migliore da cui partire è il Centro di Interpretazione della riserva, lungo la strada che
      collega Bello a Tornos. Da lì il programma «In rotta con le gru» propone visite guidate gratuite con
      educatore ambientale, intervallate da soste illustrative e di avvistamento. In autunno le visite si
      svolgono ogni fine settimana e nei festivi fino ai primi di dicembre, in due turni, alle 10.30 e alle
      15.30, previa prenotazione.


      L'itinerario guidato dura tre ore, si compie principalmente in auto lungo piste sterrate in buono stato
      e necessita di mezzo proprio. Non presenta difficoltà tecniche, ma è lungo ed è consigliato dai 6 anni
      in su. Porta indumenti pesanti e, se li possiedi, un binocolo. Il capanno di avvistamento di Gallocanta
      offre una rampa d'accesso priva di barriere e spazi agevoli per sedie a rotelle.
    history: >-
      In antico nella zona si coltivavano vigneti e zafferano. Oggi la laguna è tutelata come riserva
      naturale, istituita il 30 novembre 2006 dalla legge aragonese 11/2006, ed è inoltre riconosciuta quale
      SIC e ZPS.
    before: >-
      Il periodo propizio va da ottobre a marzo, in corrispondenza del passo e della concentrazione delle gru.
      L'affluenza è media negli osservatori all'alba e al tramonto durante il transito migratorio.
    around: >-
      Gallocanta non ha parchi vicini nell'atlante, ma condivide ambienti steppici con altre aree protette. Il
      [Parco naturale delle Bardenas Reales di Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) e
      la [Riserva naturale nazionale del Coussoul de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/) condividono con essa la [gallina
      prataiola](/especie/tetrax_tetrax/) e il [grandule](/especie/pterocles_alchata/); le Bardenas presentano
      inoltre la calandra del Dupont. Il [Parco nazionale di Hortobágy - La Puszta
      ungherese](/lugar/hortobagyi-nemzeti-park---puszta/) condivide la [gru](/especie/grus_grus/) e
      l'[otarda](/especie/otis_tarda/) tra estese zone umide e praterie.
  pt:
    intro: >-
      Em meados de outubro começam a chegar os primeiros grous, discretos, em pequenos bandos, vindos do norte
      e do leste da Europa. Voaram milhares de quilómetros até encontrar o lugar ideal para descansar e
      alimentar-se: Gallocanta, a maior lagoa natural da Península Ibérica, a cerca de mil metros de altitude,
      entre as províncias de Saragoça e Teruel. Em poucas semanas a bacia enche-se. Há dias de novembro em que
      se recenseiam mais de 19.000 grous, e o censo de inverno aponta para uma média de 150.000 aves.
    landscape: >-
      Gallocanta mede no máximo 7 km de comprimento por 2 de largura, estendendo-se por 1924 ha rodeados por
      outros 4553 ha de zona periférica de proteção. Trata-se de uma bacia endorreica de montanha: um vale
      fechado, sem saída para o mar, no Sistema Ibérico entre as comarcas de Campo de Daroca e Jiloca. A
      altitude oscila entre 995 e 1085 metros, emoldurada pelas serras de Santa Cruz e Pardos, Menera e
      Caldereros.


      Aqui a água é escassa e salgada. A profundidade média fixa-se em 70 cm e a máxima em 2 m. Os caudais
      provêm mormente de aquíferos subterrâneos e revelam-se dez vezes mais salgados do que o oceano,
      formando-se nos períodos secos crostas de sal nas margens. Juntamente com a lagoa de Fuente de Piedra,
      em Málaga, é a maior lagoa salgada da Europa. Em virtude dessa salinidade não existem peixes: aves,
      répteis e anfíbios habitam ribeiros e charcas, enquanto os mamíferos povoam os montes circundantes.


      A vegetação reparte-se em faixas. As espécies halófilas suportam o teor de sal, figurando entre elas
      endemismos e espécies protegidas como Puccinellia pungens, Lythrum flexuosum e Anacamptis palustris. Nas
      zonas de água mais doce sobressaem caniçais e bunhais. Nos relevos periféricos persistem pinheiros,
      azinheiras, carvalhos-cerquinhos e zimbros. Em redor da lagoa, a paisagem estepária é preenchida por
      campos cerealíferos, girassóis, milho, hortaliças e luzerna.
    wildlife: >-
      O calendário biológico é pautado pelo [grou-comum](/especie/grus_grus/). Chegam do norte da Europa de
      meados de outubro a meados de dezembro, e uma parte expressiva inverna até à primavera. Os primeiros
      indivíduos chegam de forma discreta e gradual nas semanas iniciais da migração outonal. Na primavera, o
      regresso inicia-se em fevereiro e termina no começo de março. Desde os anos 70 que a passagem se tem
      vindo a antecipar, fenómeno associado a temperaturas mais elevadas e menor superfície alagada
      decorrentes das alterações climáticas.


      Mas não há apenas grous. Gallocanta constitui o enclave de aves aquáticas mais importante de Aragão e o
      segundo da península após Doñana. Foram identificadas mais de 220 espécies de aves, incluindo abutres,
      águias, poupas e galeirões. O censo de inverno apresenta uma média de 150.000 aves, com um recorde de
      400.000 no inverno de 1998.


      Nas serras e colinas que circundam a lagoa habitam corços, doninhas, raposas,
      [gatos-bravos](/especie/felis_silvestris/), javalis, martas, coelhos e texugos.
    visit: >-
      O melhor ponto de partida é o Centro de Interpretação da reserva, na estrada que liga Bello a Tornos. A
      partir daí, o programa «Na rota dos grous» disponibiliza visitas guiadas gratuitas com um monitor
      ambiental, com paragens de observação e explicações temáticas. No outono realizam-se todos os fins de
      semana e feriados até ao início de dezembro, em dois turnos, às 10.30 e às 15.30, mediante reserva
      antecipada.


      O percurso guiado dura três horas, decorre essencialmente de automóvel por pistas de terra batida em bom
      estado e requer viatura própria. Não exige preparação física, mas é extenso e recomenda-se para maiores
      de 6 anos. Leva agasalhos e, se tiveres, binóculos. O observatório de Gallocanta dispõe de piso
      acessível e espaço desobstruído para cadeiras de rodas.
    history: >-
      Antigamente cultivavam-se na região vinhas e açafrão. Hoje a lagoa está classificada como reserva
      natural, declarada a 30 de novembro de 2006 pela Lei 11/2006 de Aragão, sendo igualmente LIC e ZEPA.
    before: >-
      A melhor época vai de outubro a março, acompanhando a passagem e a concentração de grous. A afluência é
      média nos observatórios ao amanhecer e ao entardecer durante a migração dos grous.
    around: >-
      Gallocanta não tem vizinhos imediatos no atlas, mas partilha características estepárias com outros
      territórios. O [Parque Natural de Bardenas Reales de
      Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) e a [Reserva Natural Nacional do Coussoul de
      Crau](/lugar/reserve-naturelle-nationale-de-la-coussoul-de-crau/) partilham o
      [sisão](/especie/tetrax_tetrax/) e o [cortiçol-de-barriga-branca](/especie/pterocles_alchata/); Bardenas
      partilha também a calhandra-de-dupont. O [Parque Nacional de Hortobágy - A Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/) partilha o [grou-comum](/especie/grus_grus/) e a
      [abetarda-comum](/especie/otis_tarda/), entre zonas húmidas e estepes.
