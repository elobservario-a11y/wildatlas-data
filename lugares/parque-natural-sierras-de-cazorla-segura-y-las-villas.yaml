resumen:
  es: >-
    El mayor espacio protegido de España: pinares de laricio, nacimiento del Guadalquivir y la reintroducción
    del quebrantahuesos en Andalucía.
  en: >-
    Spain's largest protected area: black pine forests, headwaters of the Guadalquivir and the reintroduction
    of the bearded vulture in Andalusia.
  fr: >-
    Le plus vaste espace protégé d'Espagne : pinèdes de pin laricio, sources du Guadalquivir et réintroduction
    du gypaète barbu en Andalousie.
  de: >-
    Spaniens größtes Schutzgebiet: Schwarzkiefernwälder, Ursprung des Guadalquivir und Wiederansiedlung des
    Bartgeiers in Andalusien.
  it: >-
    La più vasta area protetta di Spagna: pinete di pino nero, sorgenti del Guadalquivir e reintroduzione del
    gipeto in Andalusia.
  pt: >-
    O maior espaço protegido de Espanha: pinhais de pinheiro-larício, nascente do Guadalquivir e a
    reintrodução do quebra-ossos na Andaluzia.
