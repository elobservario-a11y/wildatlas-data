texto:
  es:
    intro: >-
      Empieza como un hilo de agua en una cueva inundada y acaba siendo uno de los grandes ríos de España. En
      las Sierras de Cazorla, Segura y Las Villas nacen el Guadalquivir y el Segura: estas montañas son la
      divisoria entre el Atlántico y el Mediterráneo. Con 214.336 hectáreas, el parque es el mayor espacio
      protegido de España y el segundo de Europa, y reúne la mayor extensión de pinar continuo del país,
      cumbres de más de 2.000 metros.
    landscape: >-
      El relieve es escarpado y de media montaña: paredes rocosas muy altas entre valles profundos y bosques
      de pino laricio. En lo más alto, el Cerro las Empanadas llega a 2107 metros, y el parque baja hasta unos
      500 metros, en el río Guadiana Menor. Entre ambas cotas está casi todo: el Yelmo, uno de los picos más
      frecuentados para el vuelo libre, y el altiplano de Hernán Pelea, el más extenso de España, con más de
      5.000 hectáreas a unos 1.600 metros, y los calares pelados que lo rodean, como el Calar de las Palomas.


      Después está el agua, y es la que explica lo demás. El Segura brota de una cueva natural inundada, en
      Fuente Segura, a 1413 metros de altura. Por el camino, el agua disuelve la caliza y la dolomía y deja
      monumentos kársticos: la Cerrada de Elías y el Salto de los Órganos, en el Borosa; la Toba, un escalón
      de travertino blanco con cuevas de agua junto al Segura; y las cuevas de los Anguijones, junto al
      embalse de Anchuricas. Las cascadas completan el cuadro, y La Osera, con 132 metros, es la más alta de
      Andalucía.


      El bosque sube por pisos. Hasta los 900 metros hay pino carrasco con madroños y lentisco. Más arriba,
      encinas, quejigos y pino rodeno. En las zonas más húmedas viven tejos milenarios y acebos, escasísimos
      en Andalucía, y a orillas de los ríos hay fresnos, sauces y chopos, con juncos y eneas donde se cobijan
      aves acuáticas. Entre todos los pinos manda el [pino salgareño](/especie/pinus_nigra/): los más viejos
      de España, algunos de más de mil años, crecen en Puertollano. En el Sendero de los Tejos Milenarios está
      el tejo más longevo de Europa, de unos 2.000 años.
    wildlife: >-
      En lo alto de los roquedos se ve el vuelo del águila real y del buitre leonado. El quebrantahuesos y el
      alimoche están en proceso de repoblación, y el parque conserva especies que solo viven aquí, como la
      violeta de Cazorla y la lagartija de Valverde. La [cabra montés](/especie/capra_pyrenaica/) es el animal
      emblemático. Llegó a los 11 000 ejemplares en 1988, pero una epidemia de sarna redujo mucho su
      población. Hay también ciervos, jabalíes, zorros, gamos y muflones.


      No todo se conserva. Lobo, oso, corzo, lince y buitre negro desaparecieron del parque, sobre todo por la
      caza y los cebos envenenados. El cangrejo de río común casi se ha extinguido por un hongo llegado con el
      cangrejo americano.
    visit: >-
      La puerta de entrada es el centro de visitantes de Torre del Vinagre, en el punto kilométrico 45 de la
      A-319, entre Cazorla y Hornos de Segura. Su exposición presenta cinco ambientes del parque: la roca, el
      agua, el pinar, las altas cumbres y los paisajes humanos, con un protagonismo especial del
      quebrantahuesos y el alimoche. Junto a él hay jardines con casa forestal y ejemplares como la secuoya, y
      el jardín botánico de Torre del Vinagre, que reúne la flora más singular del parque, con las plantas más
      representativas debidamente rotuladas.


      Con el agua hay mucho que hacer: un paseo en barca por el embalse del Tranco, senderismo junto al río
      Borosa, los nacimientos del Guadalquivir y del Segura o el salto de Chorro Gil. La ruta completa al
      nacimiento del Borosa está clasificada como de dificultad alta, así que no es un paseo cualquiera.
    history: >-
      Los pinares tienen una historia naval. Desde 1748, cuando la Sierra de Segura se declaró provincia
      marítima, su madera se usó para construir barcos, y los bosques se repoblaron en parte. El parque es hoy
      reserva de la biosfera desde 1983, parque natural desde 1986 y ZEPA desde 1988.


      La principal amenaza para la flora y la fauna son los incendios forestales, cada vez más frecuentes: en
      el verano de 2005, tras una tormenta eléctrica, ardieron más de 5.000 hectáreas en la sierra de las
      Villas y el Tranco.
    before: >-
      La ruta completa al nacimiento del Borosa está clasificada como de dificultad alta. El centro de Torre
      del Vinagre ofrece información, actividades de naturaleza y educación ambiental para organizar la
      salida.
    around: >-
      Lejos de aquí hay otras sierras con la misma mezcla de cabra montés y buitre leonado: el [Parque
      Nacional de Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/), el [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) y el [Parque Nacional da
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/), este con águila
      real y cabra montés en un paisaje kárstico. El [Macizo de Lefka Ori](/lugar/macizo-de-lefka-ori/)
      comparte con Cazorla el quebrantahuesos, el águila real y los karst y cañones.
  en:
    intro: >-
      It begins as a trickle of water inside a flooded cavern and ends as one of Spain's greatest rivers. In
      the Sierras de Cazorla, Segura y Las Villas rise both the Guadalquivir and the Segura: these mountains
      form the watershed between the Atlantic and the Mediterranean. Covering 214,336 hectares, the park is
      the largest protected area in Spain and the second largest in Europe, harbouring the country's most
      extensive continuous pine forest and peaks exceeding 2,000 metres.
    landscape: >-
      The relief is rugged and mid-mountain: towering rock ramparts rising between deep valleys and forests of
      European black pine. At the highest point, Cerro las Empanadas reaches 2107 metres, and the park
      descends to around 500 metres along the Guadiana Menor River. Between these two elevations lies almost
      everything: El Yelmo, one of the most popular peaks for paragliding, the Hernán Pelea plateau, Spain's
      largest high plateau, with over 5,000 hectares at roughly 1,600 metres, and the bare limestone plateaus
      surrounding it, such as Calar de las Palomas.


      Then comes the water, which explains all the rest. The Segura springs from a natural flooded cave at
      Fuente Segura at an elevation of 1413 metres. Along its course, water dissolves limestone and dolomite,
      creating karst landmarks: Cerrada de Elías and Salto de los Órganos on the Borosa; La Toba, a travertine
      shelf with aquatic caves beside the Segura; and the Anguijones caves by the Anchuricas reservoir.
      Waterfalls complete the scenery, and La Osera, at 132 metres, is the highest in Andalusia.


      The forest climbs in altitudinal zones. Up to 900 metres Aleppo pine grows with strawberry trees and
      mastic. Higher up stand holm oaks, Portuguese oaks and maritime pines. In the dampest valleys grow
      ancient yews and hollies, extremely rare in Andalusia, while ash, willow and poplar line the rivers
      alongside rushes and bulrushes sheltering waterbirds. Among all the conifers, the [European black
      pine](/especie/pinus_nigra/) reigns supreme: the oldest in Spain, some over a thousand years old, grow
      in Puertollano. Along the Sendero de los Tejos Milenarios stands Europe's most ancient yew, roughly
      2,000 years old.
    wildlife: >-
      High above the crags you can see the flight of golden eagles and griffon vultures. The bearded vulture
      and Egyptian vulture are being reintroduced, and the park preserves species that live nowhere else, such
      as the Cazorla violet and Valverde's lizard. The [Spanish ibex](/especie/capra_pyrenaica/) is the
      emblematic mammal. Its numbers reached 11,000 animals in 1988, but a scabies epidemic severely reduced
      the herd. Red deer, wild boars, red foxes, fallow deer and mouflons are also widespread.


      Not all historical wildlife survived. Wolves, brown bears, roe deer, lynx and cinereous vultures
      vanished from the park, primarily due to past hunting and poison baits. The native white-clawed crayfish
      has been driven nearly extinct by a water mould introduced with the American signal crayfish.
    visit: >-
      The gateway to the park is the Torre del Vinagre visitor centre, at kilometre point 45 of the A-319
      between Cazorla and Hornos de Segura. Its exhibition showcases five distinct environments: rock, water,
      pine forest, high summits and human landscapes, highlighting the bearded vulture and Egyptian vulture.
      Beside it lie grounds with a historic forestry house and specimens such as giant sequoias, as well as
      the Torre del Vinagre botanical garden, which displays the park's most unique botanical treasures with
      informative labels.


      Water offers abundant activities: a boat trip across the Tranco reservoir, walking beside the Borosa
      River, visiting the sources of the Guadalquivir and Segura or admiring the Chorro Gil waterfall. The
      full hike to the source of the Borosa is rated difficult, so it is not a casual stroll.
    history: >-
      These pine woods have a naval heritage. From 1748, when the Sierra de Segura was designated a maritime
      province, its timber was harvested to build ships for the navy, and the forests were partially
      reforested. The park has been a biosphere reserve since 1983, a natural park since 1986 and an SPA since
      1988.


      Forest fires are the primary threat to local flora and fauna, occurring with increasing frequency: in
      the summer of 2005, following an electrical storm, over 5,000 hectares burned across Sierra de las
      Villas and El Tranco.
    before: >-
      The complete trail to the source of the Borosa is rated difficult. The Torre del Vinagre centre provides
      maps, nature activities and environmental education to help you plan your outing.
    around: >-
      Farther away lie other mountain ranges sharing Spanish ibex and griffon vultures: [Sierra de las Nieves
      National Park](/lugar/parque-nacional-sierra-de-las-nieves/), [Els Ports Natural
      Park](/lugar/parc-natural-dels-ports/) and [Peneda-Gerês National
      Park](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/), the latter featuring
      golden eagles and ibex in a karst mountain terrain. The [Lefka Ori Massif](/lugar/macizo-de-lefka-ori/)
      shares bearded vultures, golden eagles, karst and canyons with Cazorla.
  fr:
    intro: >-
      Tout commence par un filet d'eau dans une grotte inondée avant de devenir l'un des grands fleuves
      d'Espagne. Dans les Sierras de Cazorla, Segura et Las Villas naissent le Guadalquivir et le Segura : ces
      montagnes forment la ligne de partage des eaux entre l'Atlantique et la Méditerranée. Avec 214 336
      hectares, le parc constitue le plus vaste espace protégé d'Espagne et le deuxième d'Europe, abritant la
      plus grande pinède continue du pays et des sommets de plus de 2 000 mètres.
    landscape: >-
      Le relief est escarpé et de moyenne montagne : de hautes falaises rocheuses encadrant des vallées
      profondes et des forêts de pin laricio. À son point culminant, le Cerro las Empanadas atteint 2107
      mètres, et le parc descend jusqu'à environ 500 mètres au niveau du río Guadiana Menor. Entre ces deux
      altitudes se déploie une grande variété de paysages : El Yelmo, sommet très prisé pour le vol libre, le
      haut plateau d'Hernán Pelea, le plus vaste d'Espagne avec plus de 5 000 hectares perchés vers 1 600
      mètres, ainsi que les calares dénudés qui l'entourent, comme le Calar de las Palomas.


      Vient ensuite l'eau, clé de voûte de tout l'écosystème. Le Segura jaillit d'une caverne inondée à Fuente
      Segura, à 1413 mètres d'altitude. Au fil de son cours, l'eau dissout calcaires et dolomies, sculptant
      des merveilles karstiques : la Cerrada de Elías et le Salto de los Órganos sur le Borosa ; La Toba,
      gradin de travertin blanc percé de grottes aquatiques le long du Segura ; et les grottes des Anguijones
      près de la retenue d'Anchuricas. Les cascades parachèvent ce tableau, La Osera, haute de 132 mètres,
      étant la plus haute d'Andalousie.


      La forêt s'étage en paliers. Jusqu'à 900 mètres pousse le pin d'Alep avec arbousiers et lentisques. Plus
      haut se succèdent chênes verts, chênes faginés et pins maritimes. Dans les vallons les plus humides
      survivent des ifs millénaires et des houx, rarissimes en Andalousie, tandis que frênes, saules et
      peupliers bordent les rivières, mêlés aux joncs où nichent les oiseaux d'eau. Parmi tous les résineux
      domine le [pin noir](/especie/pinus_nigra/) : les spécimens les plus âgés d'Espagne, certains plus que
      millénaires, prospèrent à Puertollano. Le sentier des ifs millénaires abrite l'if le plus vieux
      d'Europe, âgé d'environ 2 000 ans.
    wildlife: >-
      Au-dessus des escarpements rocheux s'élèvent l'aigle royal et le vautour fauve. Le gypaète barbu et le
      percnoptère font l'objet d'un programme de réintroduction, et le parc abrite des espèces exclusives
      comme la violette de Cazorla et le lézard de Valverde. Le [bouquetin
      d'Espagne](/especie/capra_pyrenaica/) est l'animal emblématique du massif. Ses effectifs atteignirent 11
      000 têtes en 1988, avant qu'une épidémie de gale ne réduise fortement le cheptel. Cerfs, sangliers,
      renards, daims et mouflons parcourent également le massif.


      Toutes les espèces n'ont pas survécu. Loup, ours, chevreuil, lynx et vautour moine ont disparu du parc
      en raison de la chasse historique et des appâts empoisonnés. L'écrevisse à pattes blanches autochtone a
      presque entièrement disparu à cause d'une maladie introduite par l'écrevisse américaine.
    visit: >-
      La principale porte d'accès est le centre de visiteurs de Torre del Vinagre, au point kilométrique 45 de
      l'A-319, entre Cazorla et Hornos de Segura. Son parcours présente cinq milieux caractéristiques du parc
      : la roche, l'eau, la pinède, les hauts sommets et les terroirs façonnés par l'homme, avec une attention
      particulière pour le gypaète et le percnoptère. Autour du bâtiment s'étendent des jardins forestiers
      avec des séquoias, ainsi que le jardin botanique de Torre del Vinagre, qui rassemble la flore la plus
      remarquable du parc clairement étiquetée.


      L'eau offre de multiples activités : balade en bateau sur la retenue du Tranco, randonnée le long du río
      Borosa, découverte des sources du Guadalquivir et du Segura ou contemplation de la cascade de Chorro
      Gil. Le sentier complet menant à la source du Borosa est classé difficile : ce n'est pas une simple
      promenade.
    history: >-
      Les pinèdes possèdent un riche passé naval. Dès 1748, lorsque la Sierra de Segura fut érigée en province
      maritime, son bois servit à bâtir les navires de la flotte royale, entraînant des replantations. Le parc
      est aujourd'hui réserve de biosphère depuis 1983, parc naturel depuis 1986 et ZPS depuis 1988.


      Les incendies de forêt constituent la principale menace pesant sur les milieux naturels : au cours de
      l'été 2005, à la suite d'un violent orage sec, plus de 5 000 hectares ont brûlé dans la sierra de Las
      Villas et autour du Tranco.
    before: >-
      L'itinéraire complet vers la source du Borosa est classé de difficulté haute. Le centre de Torre del
      Vinagre fournit cartes, activités nature et conseils pour bien préparer votre randonnée.
    around: >-
      Plus loin, d'autres massifs partagent le bouquetin d'Espagne et le vautour fauve : le [Parc national de
      la Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/), le [Parc naturel dels
      Ports](/lugar/parc-natural-dels-ports/) et le [Parc national de
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/), ce dernier
      abritant aigle royal et bouquetin dans un relief karstique. Le [Massif de Lefka
      Ori](/lugar/macizo-de-lefka-ori/) partage avec Cazorla le gypaète barbu, l'aigle royal et des canyons
      spectaculaires.
  de:
    intro: >-
      Es beginnt als unscheinbares Rinnsal in einer gefluteten Höhle und wird zu einem der gewaltigsten Ströme
      Spaniens. In den Sierras de Cazorla, Segura y Las Villas entspringen Guadalquivir und Segura: Diese
      Berge bilden die Wasserscheide zwischen Atlantik und Mittelmeer. Mit 214.336 Hektar ist der Park das
      größte Schutzgebiet Spaniens und das zweitgrößte Europas, Heimat des ausgedehntesten zusammenhängenden
      Kiefernwaldes des Landes und von Gipfeln über 2.000 Metern Höhe.
    landscape: >-
      Das Relief ist schroff und mittelgebirgig geprägt: steile Felswände zwischen tief eingeschnittenen
      Tälern und Schwarzkiefernforsten. Am höchsten Punkt erreicht der Cerro las Empanadas 2107 Meter, während
      der Park am Río Guadiana Menor bis auf rund 500 Meter hinabsteigt. Dazwischen liegt die ganze Vielfalt
      des Gebirges: El Yelmo, ein beliebter Startplatz für Gleitschirmflieger, das Hochplateau Hernán Pelea
      als größte Hochebene Spaniens mit über 5.000 Hektar auf etwa 1.600 Metern, sowie die umgebenden kahlen
      Kalkberge wie der Calar de las Palomas.


      Das Wasser prägt das Antlitz der Landschaft. Der Segura entspringt einer überfluteten Karsthöhle bei
      Fuente Segura auf 1413 Metern Höhe. Auf seinem Lauf löst das Wasser Kalk und Dolomit und schuf markante
      Karstformationen: die Cerrada de Elías und den Wasserfall Salto de los Órganos am Borosa; La Toba, eine
      weiße Travertinstufe mit Wasserhöhlen am Segura; und die Anguijones-Höhlen am Anchuricas-Stausee.
      Wasserfälle runden das Bild ab: La Osera ist mit 132 Metern der höchste Wasserfall Andalusiens.


      Der Wald klettert in Vegetationsstufen empor. Bis 900 Meter wächst die Aleppo-Kiefer zusammen mit
      Erdbeerbäumen und Mastixsträuchern. Darüber folgen Steineichen, Portugiesische Eichen und See-Kiefern.
      In feuchten Schluchten überdauern uralte Eiben und Stechpalmen, die in Andalusien extrem selten sind,
      während an den Flussufern Eschen, Weiden und Pappeln gedeihen. Über allen Nadelbäumen thront die
      [Schwarzkiefer](/especie/pinus_nigra/): Die ältesten Exemplare Spaniens, teils über tausend Jahre alt,
      wachsen in Puertollano. Entlang des Eibenwegs steht die mit rund 2.000 Jahren langlebigste Eibe Europas.
    wildlife: >-
      Hoch über den Felsabstürzen kreisen Steinadler und Gänsegeier. Bartgeier und Schmutzgeier werden aktiv
      wiederangesiedelt, und der Park bewahrt endemische Arten, die nirgendwo sonst vorkommen, wie das
      Cazorla-Veilchen und die Valverde-Eidechse. Der [Iberiensteinbock](/especie/capra_pyrenaica/) ist das
      Wappentier des Gebirges. Sein Bestand erreichte 11 000 Tiere im Jahr 1988, ehe ein Räudeausbruch die
      Population drastisch dezimierte. Rothirsche, Wildschweine, Füchse, Damhirsche und Mufflons sind weit
      verbreitet.


      Nicht alles konnte bewahrt werden. Wolf, Braunbär, Reh, Luchs und Mönchsgeier verschwanden vor allem
      infolge historischer Bejagung und Giftköder. Der einheimische Edelkrebs wurde durch die Krebspest fast
      vollständig vernichtet.
    visit: >-
      Eingangstor zum Park ist das Besucherzentrum Torre del Vinagre bei Kilometer 45 der Straße A-319
      zwischen Cazorla und Hornos de Segura. Seine Ausstellung veranschaulicht fünf Landschaftsräume des
      Parks: Fels, Wasser, Kiefernwald, Hochgipfel und Kulturlandschaften, mit Schwerpunkt auf Bartgeier und
      Schmutzgeier. Daneben liegen Außenanlagen mit Forthaus, Mammutbäumen und der Botanische Garten Torre del
      Vinagre, der die seltensten Pflanzenarten des Parks mit Beschilderung präsentiert.


      Das Wasser bietet reiche Möglichkeiten: Bootsfahrten auf dem Tranco-Stausee, Wanderungen am Río Borosa,
      Besuche der Quellen von Guadalquivir und Segura oder die Kaskade Chorro Gil. Die gesamte Wanderung zur
      Quelle des Borosa ist als anspruchsvoll eingestuft und kein gewöhnlicher Spaziergang.
    history: >-
      Die Kiefernwälder blicken auf eine maritime Geschichte zurück. Seit 1748, als die Sierra de Segura zur
      maritimen Provinz erklärt wurde, lieferte ihr Holz das Material für den Schiffbau der königlichen
      Flotte, was Aufforstungen anstieß. Der Park ist seit 1983 Biosphärenreservat, seit 1986 Naturpark und
      seit 1988 Europäisches Vogelschutzgebiet.


      Waldbrände stellen die größte Gefahr für Tier- und Pflanzenwelt dar: Im Sommer 2005 verbrannten nach
      einem Gewitter über 5.000 Hektar in der Sierra de las Villas und rund um El Tranco.
    before: >-
      Die komplette Route zur Quelle des Borosa ist als schwer eingestuft. Das Besucherzentrum Torre del
      Vinagre hält Karten, Naturangebote und Umweltinformationen bereit.
    around: >-
      Weiter entfernt teilen andere Gebirge Steinböcke und Gänsegeier: der [Parque Nacional Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/), der [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) und der [Parque Nacional da
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/), letzterer mit
      Steinadlern und Steinböcken im Karst. Das [Lefka-Ori-Massiv](/lugar/macizo-de-lefka-ori/) teilt
      Bartgeier, Steinadler und Felsschluchten mit Cazorla.
  it:
    intro: >-
      Inizia come un filo d'acqua in una caverna allagata e diventa uno dei grandi fiumi di Spagna. Nelle
      Sierras de Cazorla, Segura y Las Villas nascono il Guadalquivir e il Segura: queste vette segnano lo
      spartiacque tra Atlantico e Mediterraneo. Con 214.336 ettari, il parco è la maggiore area protetta della
      Spagna e la seconda d'Europa, e racchiude la più estesa pineta continua del paese con cime oltre i 2.000
      metri.
    landscape: >-
      La morfologia è scoscesa e tipica di media montagna: pareti rocciose imponenti tra gole profonde e
      foreste di pino nero. Nel punto più elevato, il Cerro las Empanadas tocca i 2107 metri, mentre il parco
      scende fino a circa 500 metri presso il fiume Guadiana Menor. Tra queste quote si concentra un intero
      universo: El Yelmo, cima celebre per il parapendio, l'altopiano di Hernán Pelea, il più vasto di Spagna
      con oltre 5.000 ettari a circa 1.600 metri, e i brulli calares circostanti come il Calar de las Palomas.


      Poi c'è l'acqua, fondamento dell'intero paesaggio. Il Segura scaturisce da una grotta sommersa a Fuente
      Segura a 1413 metri di quota. Lungo la discesa, l'acqua modella calcari e dolomie generando sculture
      carsiche: la Cerrada de Elías e il Salto de los Órganos sul Borosa; La Toba, una bancata di travertino
      bianco con grotte d'acqua lungo il Segura; e le cavità degli Anguijones presso l'invaso di Anchuricas.
      Le cascate impreziosiscono la valle: La Osera, con 132 metri, è il salto più alto d'Andalusia.


      Il bosco sale a fasce altitudinali. Fino a 900 metri allignano il pino d'Aleppo con corbezzolo e
      lentisco. Più in alto compaiono lecci, querce faginette e pini marittimi. Nelle forre più umide vegetano
      tassi millenari e agrifogli, rarissimi in Andalusia, mentre le rive fluviali accolgono frassini, salici
      e pioppi. Tra tutte le conifere domina il [pino nero](/especie/pinus_nigra/): i più vetusti di Spagna,
      alcuni con più di mille anni, crescono a Puertollano. Lungo il sentiero dei tassi millenari sopravvive
      il tasso più longevo d'Europa, vecchio di circa 2.000 anni.
    wildlife: >-
      In alto sulle bastionate rocciose volteggiano l'aquila reale e il grifone. Il gipeto e il capovaccaio
      sono oggetto di reintroduzione attiva, e il parco ospita specie esclusive come la viola di Cazorla e la
      lucertola di Valverde. Lo [stambecco iberico](/especie/capra_pyrenaica/) è l'animale simbolo: raggiunse
      gli 11 000 capi nel 1988, prima che un'epidemia di scabbia ne riducesse fortemente la consistenza.
      Popolano i boschi anche cervi, cinghiali, volpi, daini e mufloni.


      Non tutte le presenze storiche sono scampate. Lupo, orso, capriolo, lince e avvoltoio monaco scomparvero
      a causa di caccia e bocconi avvelenati. Il gambero di fiume autoctono è quasi estinto a causa di un
      fungo parassita introdotto con il gambero americano.
    visit: >-
      Il punto d'accesso privilegiato è il centro visitatori di Torre del Vinagre, al chilometro 45 della
      A-319, tra Cazorla e Hornos de Segura. Il suo percorso espositivo illustra cinque ambienti del parco:
      roccia, acqua, pineta, alte quote e paesaggi rurali, riservando risalto al gipeto e al capovaccaio.
      Attorno sorgono giardini forestali con sequoie e l'orto botanico di Torre del Vinagre, che raccoglie la
      flora più peculiare del comprensorio con cartellini descrittivi.


      L'acqua invita a svariate attività: navigazione sul lago del Tranco, trekking lungo il río Borosa,
      visita alle sorgenti di Guadalquivir e Segura o al salto del Chorro Gil. Il tragitto integrale per la
      sorgente del Borosa è classificato di difficoltà elevata, richiedendo adeguata preparazione.
    history: >-
      Le pinete vantano trascorsi cantieristici. Dal 1748, quando la Sierra de Segura fu dichiarata provincia
      marittima, il suo legname servì per allestire navi per la marina militare, avviando i primi
      rimboschimenti. L'area è riserva della biosfera dal 1983, parco naturale dal 1986 e ZPS dal 1988.


      Gli incendi boschivi costituiscono il pericolo primario per fauna e vegetazione: nell'estate del 2005, a
      seguito di fulmini, oltre 5.000 ettari andarono in fumo nella sierra de Las Villas e presso El Tranco.
    before: >-
      Il percorso completo alla sorgente del Borosa è classificato di difficoltà alta. Il centro di Torre del
      Vinagre offre mappe, programmi educativi e assistenza per impostare l'itinerario.
    around: >-
      Più lontano, altri rilievi presentano la medesima associazione di stambecco e grifone: il [Parque
      Nacional Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/), il [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) e il [Parque Nacional da
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/), quest'ultimo con
      aquila reale e stambecco su terreno carsico. Il [Massiccio di Lefka Ori](/lugar/macizo-de-lefka-ori/)
      condivide gipeto, aquila reale e spettacolari forre con Cazorla.
  pt:
    intro: >-
      Começa como um fio de água numa gruta inundada e torna-se um dos grandes rios de Espanha. Nas Serras de
      Cazorla, Segura e Las Villas nascem o Guadalquivir e o Segura: estas montanhas constituem a divisória
      entre o Atlântico e o Mediterrâneo. Com 214.336 hectares, o parque é o maior espaço protegido de Espanha
      e o segundo da Europa, albergando a maior mancha contínua de pinhal do país e cumes com mais de 2.000
      metros.
    landscape: >-
      O relevo é alcantilado e de média montanha: escarpas rochosas muito altas entre vales fundos e bosques
      de pinheiro-larício. No ponto mais alto, o Cerro las Empanadas atinge 2107 metros, descendo o parque até
      cerca de 500 metros junto ao rio Guadiana Menor. Entre essas duas cotas encontra-se quase tudo: El
      Yelmo, um dos picos mais procurados para o voo livre, o planalto de Hernán Pelea, o maior de Espanha com
      mais de 5.000 hectares a cerca de 1.600 metros, e os calares despidos em redor como o Calar de las
      Palomas.


      Depois sobressai a água, elemento que tudo explica. O Segura brota de uma gruta natural inundada em
      Fuente Segura, a 1413 metros de altitude. Ao longo do curso, a água dissolve calcários e dolomitos,
      gerando monumentos cársticos: a Cerrada de Elías e o Salto de los Órganos no Borosa; La Toba, um socalco
      de travertino branco com algares junto ao Segura; e as grutas dos Anguijones perto da albufeira de
      Anchuricas. As cascatas coroam a paisagem: La Osera, com 132 metros, é a mais alta da Andaluzia.


      A floresta distribui-se por andares. Até aos 900 metros impera o pinheiro-de-alepo com medronheiros e
      aroeiras. Mais acima surgem azinheiras, carvalhos-cerquinhos e pinheiros-bravos. Nas zonas mais húmidas
      abrigam-se teixos milenares e azevinhos, raríssimos na Andaluzia, ladeando freixos, salgueiros e choupos
      as margens fluviais. Entre os pinhais destaca-se o [pinheiro-larício](/especie/pinus_nigra/): os mais
      velhos de Espanha, alguns com mais de mil anos, vivem em Puertollano. No trilho dos teixos milenares
      vegeta o teixo mais antigo da Europa, com cerca de 2.000 anos.
    wildlife: >-
      No alto dos penedos observa-se o planar da águia-real e do abutre-fouveiro. O quebra-ossos e o
      abutre-do-egito encontram-se em repovoamento, resguardando o parque espécies exclusivas como a
      violeta-de-cazorla e a lagartixa-de-valverde. A [cabra-montês-ibérica](/especie/capra_pyrenaica/) é o
      animal emblemático. Chegou aos 11 000 exemplares em 1988, antes de um surto de sarna reduzir
      drasticamente o seu efetivo. Habitam igualmente o parque veados, javalis, raposas, gamos e muflões.


      Nem todas as espécies históricas resistiram. Lobo, urso, corço, lince e abutre-preto desapareceram
      devido à caça e aos venenos. O lagostim-de-patas-brancas quase se extinguiu por causa de uma peste
      trazida pelo lagostim-americano.
    visit: >-
      A principal porta de entrada é o centro de visitantes de Torre del Vinagre, ao quilómetro 45 da A-319,
      entre Cazorla e Hornos de Segura. O seu espaço expositivo retrata cinco ambientes: a rocha, a água, o
      pinhal, os altos cumes e as paisagens culturais, com destaque para o quebra-ossos e o abutre-do-egito.
      No exterior existem jardins florestais com sequóias e o jardim botânico de Torre del Vinagre, que exibe
      a flora mais singular do parque devidamente identificada.


      A água possibilita inúmeras atividades: passeios de barco na albufeira do Tranco, caminhadas junto ao
      rio Borosa, excursões às nascentes do Guadalquivir e do Segura ou à cascata de Chorro Gil. O trilho
      completo à nascente do Borosa é classificado de dificuldade alta, requerendo bom preparo.
    history: >-
      Os pinhais possuem tradição naval. Desde 1748, quando a Sierra de Segura foi declarada província
      marítima, as suas madeiras serviram para a construção naval, impulsionando reflorestações. O parque é
      reserva da biosfera desde 1983, parque natural desde 1986 e ZEPA desde 1988.


      Os incêndios florestais são a principal ameaça para os ecossistemas: no verão de 2005, após uma trovoada
      seca, arderam mais de 5.000 hectares na serra de Las Villas e no Tranco.
    before: >-
      O trilho completo à nascente do Borosa está classificado com dificuldade alta. O centro de Torre del
      Vinagre faculta mapas, atividades na natureza e orientações para a caminhada.
    around: >-
      Mais longe situam-se outras serras com cabra-montês e abutre-fouveiro: o [Parque Nacional de Sierra de
      las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/), o [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/) e o [Parque Nacional da
      Peneda-Gerês](/lugar/parque-nacional-da-peneda-geres---baixa-limia-e-serra-do-xures/), este último com
      águia-real e cabra-montês em paisagem cárstica. O [Maciço de Lefka Ori](/lugar/macizo-de-lefka-ori/)
      partilha com Cazorla o quebra-ossos, a águia-real e desfiladeiros cársticos.
