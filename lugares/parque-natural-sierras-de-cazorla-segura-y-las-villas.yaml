    De más de 1.300 especies de plantas, 24 solo viven aquí, como la violeta de Cazorla, y entre ellas hay
    incluso una planta carnívora.
  en: >-
    Out of over 1,300 plant species, 24 grow only here, such as the Cazorla violet, and among them is even a
    carnivorous butterwort.
