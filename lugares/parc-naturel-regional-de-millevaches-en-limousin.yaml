resumen:
  es: >-
    La 'Meseta de las Mil Fuentes', castillo de agua granítico del suroeste de Francia repleto de turberas de
    esfagno y cabeceras de ríos.
  en: >-
    The "Plateau of a Thousand Springs", a granite water tower of south-west France teeming with sphagnum bogs
    and river headwaters.
  fr: >-
    Le « Plateau des Mille Sources », château d'eau granitique du sud-ouest de la France, riche en tourbières
    à sphaignes et en têtes de bassins versants.
  de: >-
    Das „Plateau der Tausend Quellen", ein Granit-Wasserschloss des südwestlichen Frankreichs, reich an
    Torfmoosmooren und Flussquellgebieten.
  it: >-
    L'« Altopiano delle Mille Sorgenti », castello d'acqua granitico del sud-ovest della Francia, ricco di
    torbiere a sfagni e di sorgenti fluviali.
  pt: >-
    O «Planalto das Mil Nascentes», castelo de água granítico do sudoeste de França repleto de turfeiras de
    esfagno e cabeceiras de rios.
unico:
  es: >-
    Es el «castillo de agua» del Limousin, una meseta de granito, turberas y landas donde nacen once ríos de
    más de 50 km y cuyo cielo nocturno es hoy Reserva Internacional de Cielo Estrellado.
  en: >-
    The "water tower" of the Limousin, a granite plateau of peat bogs and heathland where eleven rivers of
    more than 50 km are born and whose night sky is an International Starlight Reserve.
  fr: >-
    Le « château d'eau » du Limousin, un plateau de granit, tourbières et landes où naissent onze rivières de
    plus de 50 km et dont le ciel nocturne est Réserve Internationale de Ciel Étoilé.
  de: >-
    Das „Wasserschloss" des Limousin, ein Granitplateau mit Mooren und Heiden, auf dem elf Flüsse von mehr als
    50 km entspringen und dessen Nachthimmel ein Internationales Sternenreservat ist.
  it: >-
    Il « castello d'acqua » del Limousin, un altopiano di granito, torbiere e brughiere dove nascono undici
    fiumi di più di 50 km e il cui cielo notturno è Riserva Internazionale di Cielo Stellato.
  pt: >-
    O «castelo de água» do Limousin, um planalto de granito, turfeiras e charnecas onde nascem onze rios de
    mais de 50 km e cujo céu nocturno é Reserva Internacional de Céu Estrelado.
observaciones:
  es: >-
    Abrígate: puede nevar hasta abril y en las turberas puede helar incluso en agosto, al amanecer. En la
    turbera, quédate en los senderos acondicionados.
texto:
  es:
    intro: >-
      Mil vacas, mil fuentes o mil rocas: nadie se pone de acuerdo con el nombre. La explicación más popular
      en el territorio lo lee como «mil fuentes»; otra, de Ernest Nègre, ve en él las rocas de granito desnudo
      agrupadas como rebaños de vacas, y una leyenda cuenta que una pastora entregó al diablo sus mil vacas,
      que la tormenta había vuelto indóciles, y que él las convirtió en rocas una a una. Lo que sí está claro
      es el paisaje: la meseta de Millevaches, un macizo de granito, es la columna de este parque natural
      regional, creado por decreto el 18 de mayo de 2004 en Nueva Aquitania, entre Corrèze, Creuse y
      Haute-Vienne.
    landscape: >-
      La meseta es un macizo de granito de cristales grandes, de unos 300 millones de años y muy erosionado.
      Sobre él nacen el Vienne, el Creuse, el Vézère y otros ríos, once en total de más de 50 km. El monte
      Bessou es el punto más alto del parque y de todo el Limousin.


      El clima es oceánico con un toque de montaña: puede nevar hasta abril y en las turberas puede helar
      incluso en agosto al amanecer. Caen entre 1.600 y 1.700 mm de lluvia al año en la meseta, con una
      temperatura media anual en torno a 7,5 °C.


      El aspecto que ves hoy es relativamente reciente. A finales del siglo XIX el paisaje estaba casi
      completamente abierto, dominado por landas y pastos; en el siglo XX, con el abandono agrario, se
      plantaron resinosas como el abeto rojo, el alerce y el pino Douglas. El bosque del parque es sobre todo
      esa plantación, casi monoespecífica y que la fauna suele evitar, aunque quedan fragmentos de bosque
      antiguo, como los hayedos con acebo, ricos en biodiversidad, y árboles viejos y madera muerta que
      albergan escarabajos saproxílicos. Las landas y los pastos secos y húmedos, en mosaico con las turberas,
      dominaban la meseta y hoy son objetivos de conservación.
    wildlife: >-
      El emblema del parque es la [nutria](/especie/lutra_lutra/). Casi desaparecida de Francia en los años
      ochenta, recoloniza el país desde bastiones como esta meseta, y se detecta por sus huellas junto a los
      ríos. En los arroyos rápidos vive el [mejillón perlero](/especie/margaritifera_margaritifera/), cuya
      presencia indica que el agua está en muy buen estado. Hay también [gato
      montés](/especie/felis_silvestris/) y 22 de las 37 especies de murciélagos de Europa.


      Entre las aves nidificantes, el [pito negro](/especie/dryocopus_martius/) y el mochuelo boreal se han
      beneficiado de la expansión del bosque. En landas y pastos de manejo extensivo vive el alcaudón norteño,
      con una treintena de parejas a comienzos de los años 2010, mientras que el alcaudón dorsirrojo, mucho
      menos raro, hace escala en verano. En los espacios abiertos abundan la alondra común, el escribano
      cerillo, el bisbita pratense, la [tarabilla norteña](/especie/saxicola_rubetra/) y el [cernícalo
      vulgar](/especie/falco_tinnunculus/).


      Entre los hongos, en cuatro estaciones cerca de Meymac se registraron 260 especies de macromicetos en
      diez años de muestreos, un resultado alto.
    visit: >-
      El sitio estrella es la turbera del Longeyroux, a unos 900 metros de altitud: un humedal pastoril
      accesible, la mayor turbera del parque. Dos senderos acondicionados, de uno y de nueve kilómetros,
      recorren su paisaje abierto, y también hay paseos pastoriles. Allí viven la nutria y el lagarto
      vivíparo, y entre las plantas raras están el esfagno y la drosera, una planta insectívora. El
      mantenimiento incluye pastoreo de verano con un rebaño de unas quinientas ovejas acompañado por un
      pastor, y el alcaudón norteño encuentra su alimento entre lagartos vivíparos e insectos. La caminata de
      Millevaches a Longeroux es el itinerario más largo de la guía, con 16 kilómetros y cinco horas.


      Para más rutas, Rando Millevaches es una guía digital con más de 400 rutas que se filtran por tipo,
      longitud, puntos de interés y desnivel, y la guía Chamina propone 45 circuitos de paseo por todo el
      parque, con información sobre patrimonio, geología, economía y agricultura. La Maison du Parc, en el
      pueblo de Millevaches, es la puerta de entrada.


      De noche, el parque ha identificado 11 sitios accesibles muy propicios para observar el cielo. Lleva
      ropa de abrigo, porque en las alturas suele hacer fresco, una luz roja y un mapa del cielo.
    history: >-
      La zona de protección especial de la meseta de Millevaches (2006) alberga 42 especies de interés
      comunitario, como la alondra totovía, el mochuelo boreal y el alcaudón dorsirrojo. El parque definió 28
      sitios de interés ecológico mayor, y entre los paisajísticos están el lago de Lavaud-Gelade, el mont
      Gargan, el lago de los Bariousses y el macizo de los Monédières. La turbera de Longeyroux forma parte
      del sitio Natura 2000 Landes et zones humides de la Haute-Vézère.


      La historia humana también está en el suelo. De la villa galorromana de Les Cars, del siglo II, quedan
      dos edificios funerarios y una gran vivienda. Hasta finales del siglo XIX los tejados eran de paja de
      centeno, porque en la meseta no había carrizo; hoy las pizarras de Travassac y Allasac la han
      reemplazado.
    before: >-
      Abrígate: puede nevar hasta abril y en las turberas puede helar incluso en agosto, al amanecer. En la
      turbera, quédate en los senderos acondicionados.
    around: >-
      A 22 km están las [Gorges de la Sioule](/lugar/gorges-de-la-sioule/). Y, lejos, el [Parque Natural Hoces
      del Alto Ebro y Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) comparte con la meseta la
      nutria y el aguilucho cenizo.
  en:
    intro: >-
      A thousand cows, a thousand springs or a thousand rocks: nobody can agree on the name. The most popular
      explanation in the area reads it as "a thousand springs"; another, by Ernest Nègre, sees in it the bare
      granite rocks grouped like herds of cows; and a legend tells that a shepherdess handed over her thousand
      cows, made unruly by a storm, to the devil, who turned them into rocks one by one. What is clear is the
      landscape: the Millevaches plateau, a granite massif, is the backbone of this regional nature park,
      created by decree on 18 May 2004 in Nouvelle-Aquitaine, between Corrèze, Creuse and Haute-Vienne.
    landscape: >-
      The plateau is a massif of large-crystal granite, some 300 million years old and highly eroded. On it
      rise the Vienne, the Creuse, the Vézère and other rivers — eleven in total, each more than 50 km long.
      Mont Bessou is the highest point of the park and of the entire Limousin.


      The climate is oceanic with a touch of mountain: it can snow until April and in the peat bogs it can
      freeze even in August at dawn. Between 1,600 and 1,700 mm of rain falls per year on the plateau, with an
      average annual temperature of around 7.5 °C.


      The look you see today is relatively recent. At the end of the nineteenth century the landscape was
      almost completely open, dominated by heathland and pastures; in the twentieth century, with agricultural
      abandonment, conifers such as Norway spruce, larch and Douglas fir were planted. The park forest is
      mainly these plantations, almost monospecific and usually avoided by wildlife, although fragments of
      ancient woodland remain, such as holly beech woods rich in biodiversity, with old trees and dead wood
      hosting saproxylic beetles. The heathlands and dry and wet grasslands, in mosaic with the peat bogs,
      used to dominate the plateau and are today conservation targets.
    wildlife: >-
      The emblem of the park is the [otter](/especie/lutra_lutra/). Almost disappeared from France in the
      eighties, it is recolonising the country from strongholds such as this plateau, and is detected by its
      tracks along the rivers. In the fast streams lives the [freshwater pearl
      mussel](/especie/margaritifera_margaritifera/), whose presence indicates very high water quality. There
      is also the [wildcat](/especie/felis_silvestris/) and 22 of the 37 bat species of Europe.


      Among the breeding birds, the [black woodpecker](/especie/dryocopus_martius/) and the boreal owl have
      benefited from forest expansion. In heathlands and extensively managed grasslands lives the great grey
      shrike, with about thirty pairs at the beginning of the 2010s, while the red-backed shrike, much less
      rare, stops over in summer. In the open spaces the skylark, the yellowhammer, the meadow pipit, the
      [whinchat](/especie/saxicola_rubetra/) and the [common kestrel](/especie/falco_tinnunculus/) are
      plentiful.


      Among fungi, in four seasons near Meymac 260 species of macromycetes were recorded over ten years of
      sampling — a high result.
    visit: >-
      The star site is the Longeyroux bog, at around 900 metres altitude: an accessible pastoral wetland, the
      largest bog in the park. Two maintained trails, of one and nine kilometres, cross its open landscape,
      and there are also pastoral walks. Otter and viviparous lizard live there, and among the rare plants are
      sphagnum and sundew, an insectivorous plant. Maintenance includes summer grazing by a flock of around
      five hundred sheep accompanied by a shepherd, and the great grey shrike finds its food among viviparous
      lizards and insects. The walk from Millevaches to Longeroux is the longest itinerary in the guide, with
      16 kilometres and five hours.


      For more routes, Rando Millevaches is a digital guide with more than 400 routes filtered by type,
      length, points of interest and elevation, and the Chamina guide proposes 45 walking circuits throughout
      the park, with information on heritage, geology, economy and agriculture. La Maison du Parc, in the
      village of Millevaches, is the entry point.


      At night, the park has identified 11 accessible sites very propitious for observing the sky. Bring warm
      clothing, because it is usually cool at altitude, a red torch and a sky map.
    history: >-
      The Special Protection Area of the Millevaches plateau (2006) holds 42 species of community interest,
      such as the woodlark, the boreal owl and the red-backed shrike. The park defined 28 sites of major
      ecological interest, and among the scenic ones are the Lavaud-Gelade lake, Mont Gargan, the Bariousses
      lake and the Monédières massif. The Longeyroux bog is part of the Natura 2000 site Landes et zones
      humides de la Haute-Vézère.


      Human history is also in the soil. From the Gallo-Roman villa of Les Cars, from the second century, two
      funerary buildings and a large dwelling remain. Until the end of the nineteenth century roofs were
      thatched with rye straw, because there was no reed on the plateau; today the slates of Travassac and
      Allasac have replaced it.
    before: >-
      Dress warmly: it can snow until April and in the peat bogs it can freeze even in August, at dawn. On the
      bog, stay on the maintained trails.
    around: >-
      At 22 km are the [Gorges de la Sioule](/lugar/gorges-de-la-sioule/). And, far away, the [Parque Natural
      Hoces del Alto Ebro y Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) shares with the
      plateau the otter and the Montagu's harrier.
  fr:
    intro: >-
      Mille vaches, mille sources ou mille rochers : personne ne s'accorde sur le nom. L'explication la plus
      populaire dans le territoire le lit comme « mille sources » ; une autre, d'Ernest Nègre, y voit les
      rochers de granit nu groupés comme des troupeaux de vaches ; et une légende raconte qu'une bergère avait
      livré ses mille vaches, rendues indociles par l'orage, au diable, qui les avait transformées en rochers
      une à une. Ce qui est clair, c'est le paysage : le plateau de Millevaches, un massif de granit, est la
      colonne vertébrale de ce parc naturel régional, créé par décret le 18 mai 2004 en Nouvelle-Aquitaine,
      entre Corrèze, Creuse et Haute-Vienne.
    landscape: >-
      Le plateau est un massif de granit à grands cristaux, vieux d'environ 300 millions d'années et très
      érodé. Sur lui naissent la Vienne, la Creuse, la Vézère et d'autres rivières — onze au total, chacune de
      plus de 50 km. Le mont Bessou est le point culminant du parc et de tout le Limousin.


      Le climat est océanique avec une touche de montagne : il peut neiger jusqu'en avril et dans les
      tourbières il peut geler même en août à l'aube. Il tombe entre 1 600 et 1 700 mm de pluie par an sur le
      plateau, avec une température annuelle moyenne autour de 7,5 °C.


      L'aspect que vous voyez aujourd'hui est relativement récent. À la fin du dix-neuvième siècle, le paysage
      était presque complètement ouvert, dominé par des landes et des pâtures ; au vingtième siècle, avec
      l'abandon agricole, des résineux comme l'épicéa commun, le mélèze et le douglas furent plantés. La forêt
      du parc est surtout cette plantation, presque monospécifique et généralement évitée par la faune, bien
      que des fragments de forêt ancienne subsistent, comme les hêtraies à houx riches en biodiversité, avec
      de vieux arbres et du bois mort abritant des coléoptères saproxyliques. Les landes et les pelouses
      sèches et humides, en mosaïque avec les tourbières, dominaient le plateau et sont aujourd'hui des
      objectifs de conservation.
    wildlife: >-
      L'emblème du parc est la [loutre](/especie/lutra_lutra/). Presque disparue de France dans les années
      quatre-vingt, elle recolonise le pays depuis des bastions comme ce plateau, et se détecte à ses
      empreintes le long des rivières. Dans les ruisseaux rapides vit la [mulette
      perlière](/especie/margaritifera_margaritifera/), dont la présence indique que l'eau est en très bon
      état. Il y a aussi le [chat sauvage](/especie/felis_silvestris/) et 22 des 37 espèces de chauves-souris
      d'Europe.


      Parmi les oiseaux nicheurs, le [pic noir](/especie/dryocopus_martius/) et la chouette de Tengmalm ont
      bénéficié de l'expansion de la forêt. Dans les landes et les pâtures gérées de façon extensive vit la
      pie-grièche grise, avec une trentaine de couples au début des années 2010, tandis que la pie-grièche
      écorcheur, bien moins rare, fait escale en été. Dans les espaces ouverts abondent l'alouette des champs,
      le bruant jaune, le pipit des prés, le [tarier des prés](/especie/saxicola_rubetra/) et la [faucon
      crécerelle](/especie/falco_tinnunculus/).


      Parmi les champignons, en quatre saisons près de Meymac, 260 espèces de macromycètes ont été
      enregistrées en dix ans d'inventaires — un résultat élevé.
    visit: >-
      Le site vedette est la tourbière du Longeyroux, à environ 900 mètres d'altitude : une zone humide
      pastorale accessible, la plus grande tourbière du parc. Deux sentiers aménagés, d'un et de neuf
      kilomètres, parcourent son paysage ouvert, et il y a aussi des promenades pastorales. La loutre et le
      lézard vivipare y vivent, et parmi les plantes rares figurent la sphaigne et la droséra, une plante
      insectivore. L'entretien inclut un pâturage estival avec un troupeau d'environ cinq cents brebis
      accompagné d'un berger, et la pie-grièche grise trouve sa nourriture parmi les lézards vivipares et les
      insectes. La randonnée de Millevaches à Longeroux est le plus long itinéraire du guide, avec 16
      kilomètres et cinq heures.


      Pour plus de circuits, Rando Millevaches est un guide numérique avec plus de 400 itinéraires filtrés par
      type, longueur, points d'intérêt et dénivelé, et le guide Chamina propose 45 circuits de promenade dans
      tout le parc, avec des informations sur le patrimoine, la géologie, l'économie et l'agriculture. La
      Maison du Parc, dans le village de Millevaches, est le point d'entrée.


      La nuit, le parc a identifié 11 sites accessibles très propices pour observer le ciel. Habillez-vous
      chaudement, car il fait généralement frais en altitude, et prenez une lampe rouge et une carte du ciel.
    history: >-
      La zone de protection spéciale du plateau de Millevaches (2006) abrite 42 espèces d'intérêt
      communautaire, comme l'alouette lulu, la chouette de Tengmalm et la pie-grièche écorcheur. Le parc a
      défini 28 sites d'intérêt écologique majeur, et parmi les sites paysagers figurent le lac de
      Lavaud-Gelade, le mont Gargan, le lac des Bariousses et le massif des Monédières. La tourbière du
      Longeyroux fait partie du site Natura 2000 Landes et zones humides de la Haute-Vézère.


      L'histoire humaine est aussi dans le sol. De la villa gallo-romaine de Les Cars, du deuxième siècle,
      subsistent deux bâtiments funéraires et une grande demeure. Jusqu'à la fin du dix-neuvième siècle, les
      toits étaient couverts de chaume de seigle, car il n'y avait pas de roseau sur le plateau ; aujourd'hui
      les ardoises de Travassac et d'Allasac les ont remplacés.
    before: >-
      Couvrez-vous : il peut neiger jusqu'en avril et dans les tourbières il peut geler même en août, à
      l'aube. Dans la tourbière, restez sur les sentiers aménagés.
    around: >-
      À 22 km se trouvent les [Gorges de la Sioule](/lugar/gorges-de-la-sioule/). Et, loin, le [Parque Natural
      Hoces del Alto Ebro y Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) partage avec le
      plateau la loutre et le busard cendré.
  de:
    intro: >-
      Tausend Kühe, tausend Quellen oder tausend Felsen: Niemand einigt sich beim Namen. Die beliebteste
      Erklärung im Gebiet liest ihn als „tausend Quellen"; eine andere, von Ernest Nègre, sieht darin die
      kahlen Granitfelsen, die in Gruppen wie Kuhherde aussehen; und eine Legende erzählt, dass eine Hirtin
      ihre tausend Kühe, die der Sturm aufgewühlt hatte, dem Teufel übergab, der sie eine nach der anderen in
      Felsen verwandelte. Was klar ist, ist die Landschaft: das Plateau von Millevaches, ein Granitmassiv, ist
      das Rückgrat dieses Regionalen Naturparks, der per Dekret am 18. Mai 2004 in Nouvelle-Aquitaine
      geschaffen wurde, zwischen Corrèze, Creuse und Haute-Vienne.
    landscape: >-
      Das Plateau ist ein Massiv aus grobkristallinem Granit, rund 300 Millionen Jahre alt und stark erodiert.
      Auf ihm entspringen die Vienne, die Creuse, die Vézère und andere Flüsse — elf insgesamt, jeder mehr als
      50 km lang. Der Mont Bessou ist der höchste Punkt des Parks und des gesamten Limousin.


      Das Klima ist ozeanisch mit einem Hauch von Gebirge: Es kann bis April schneien und in den Torfmooren
      kann es selbst im August bei Tagesanbruch frieren. Zwischen 1 600 und 1 700 mm Regen fallen pro Jahr auf
      dem Plateau, bei einer durchschnittlichen Jahrestemperatur von rund 7,5 °C.


      Das heutige Aussehen ist relativ jung. Ende des neunzehnten Jahrhunderts war die Landschaft fast völlig
      offen, von Heiden und Weiden dominiert; im zwanzigsten Jahrhundert wurden mit dem Rückgang der
      Landwirtschaft Nadelbäume wie Fichte, Lärche und Douglasie angepflanzt. Der Parkwald besteht vor allem
      aus diesen Plantagen, fast monospezifisch und von der Tierwelt meist gemieden, obwohl Fragmente alter
      Wälder erhalten sind — Stechpalmen-Buchenwälder reich an Biodiversität, mit alten Bäumen und Totholz,
      das saproxylische Käfer beherbergt. Die Heiden und trockenen wie feuchten Weiden, im Mosaik mit den
      Torfmooren, dominierten das Plateau und sind heute Schutzziele.
    wildlife: >-
      Das Wahrzeichen des Parks ist der [Fischotter](/especie/lutra_lutra/). In den achtziger Jahren fast aus
      Frankreich verschwunden, rekolonisiert er das Land von Bastionen wie diesem Plateau aus und wird an
      seinen Spuren entlang der Flüsse entdeckt. In den schnellen Bächen lebt die
      [Flussperlmuschel](/especie/margaritifera_margaritifera/), deren Vorkommen sehr gutes Wasser anzeigt. Es
      gibt auch die [Wildkatze](/especie/felis_silvestris/) und 22 der 37 Fledermausarten Europas.


      Unter den Brutvögeln haben der [Schwarzspecht](/especie/dryocopus_martius/) und der Raufußkauz von der
      Waldausdehnung profitiert. In extensiv bewirtschafteten Heiden und Weiden lebt der Raubwürger, mit etwa
      dreißig Paaren zu Beginn der 2010er Jahre, während der Neuntöter, weit weniger selten, im Sommer rastet.
      In den offenen Flächen sind Feldlerche, Goldammer, Wiesenpieper,
      [Braunkehlchen](/especie/saxicola_rubetra/) und [Turmfalke](/especie/falco_tinnunculus/) häufig.


      Bei den Pilzen wurden in vier Saisons nahe Meymac in zehn Jahren 260 Arten von Großpilzen erfasst — ein
      hoher Wert.
    visit: >-
      Das Hauptziel ist das Moor Longeyroux, auf rund 900 Metern Höhe: ein zugängliches Hirtenteufelmoor, das
      größte Moor des Parks. Zwei ausgebaute Pfade, von einem und neun Kilometern, durchqueren seine offene
      Landschaft, und es gibt auch Hirtenspaziergänge. Otter und Waldeidechse leben dort, und zu den seltenen
      Pflanzen gehören Torfmoos und Sonnentau, eine fleischfressende Pflanze. Die Pflege umfasst
      Sommerbeweidung mit einer Herde von etwa fünfhundert Schafen in Begleitung eines Hirten, und der
      Raubwürger findet seine Nahrung unter Waldeidechsen und Insekten. Die Wanderung von Millevaches nach
      Longeroux ist die längste Route des Führers, mit 16 Kilometern und fünf Stunden.


      Für weitere Routen bietet Rando Millevaches einen digitalen Führer mit mehr als 400 Routen, die nach
      Typ, Länge, Sehenswürdigkeiten und Höhenunterschied gefiltert werden können, und der Chamina-Führer
      schlägt 45 Spaziergangsrundwege durch den gesamten Park vor, mit Informationen über Kulturerbe,
      Geologie, Wirtschaft und Landwirtschaft. La Maison du Parc im Dorf Millevaches ist das Eingangstor.


      Nachts hat der Park 11 zugängliche Standorte ermittelt, die sich besonders gut für die
      Himmelsbeobachtung eignen. Warme Kleidung mitbringen, da es auf dem Plateau meist kühl ist, sowie ein
      Rotlicht und eine Sternkarte.
    history: >-
      Das Vogelschutzgebiet des Millevaches-Plateaus (2006) beherbergt 42 Arten von gemeinschaftlichem
      Interesse, wie die Heidelerche, den Raufußkauz und den Neuntöter. Der Park definierte 28 Standorte von
      größtem ökologischen Interesse, und unter den landschaftlichen gehören der Lavaud-Gelade-See, der Mont
      Gargan, der Bariousses-See und das Monédières-Massiv. Das Longeyroux-Moor ist Teil des Natura
      2000-Gebiets Landes et zones humides de la Haute-Vézère.


      Auch die Menschheitsgeschichte steckt im Boden. Von der gallo-römischen Villa Les Cars, aus dem zweiten
      Jahrhundert, sind zwei Grabbauten und ein großes Wohnhaus erhalten. Bis Ende des neunzehnten
      Jahrhunderts waren die Dächer mit Roggenstroh gedeckt, da es auf dem Plateau kein Schilf gab; heute
      haben die Schiefer aus Travassac und Allasac es ersetzt.
    before: >-
      Zieh dich warm an: Es kann bis April schneien und in den Torfmooren kann es selbst im August bei
      Tagesanbruch frieren. Im Moor bleib auf den ausgebauten Pfaden.
    around: >-
      Bei 22 km liegen die [Gorges de la Sioule](/lugar/gorges-de-la-sioule/). Und weit entfernt teilt der
      [Parque Natural Hoces del Alto Ebro y Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) mit
      dem Plateau den Fischotter und den Wiesenweihe.
  it:
    intro: >-
      Mille vacche, mille sorgenti o mille rocce: nessuno si mette d'accordo sul nome. La spiegazione più
      popolare nel territorio lo legge come « mille sorgenti »; un'altra, di Ernest Nègre, vede nelle rocce di
      granito nudo raggruppate come mandrie di vacche; e una leggenda racconta che una pastora consegnò al
      diavolo le sue mille vacche, rese indocili dalla tempesta, e lui le trasformò in rocce una per una. Ciò
      che è chiaro è il paesaggio: l'altopiano di Millevaches, un massiccio di granito, è la colonna portante
      di questo parco naturale regionale, creato per decreto il 18 maggio 2004 in Nouvelle-Aquitaine, tra
      Corrèze, Creuse e Haute-Vienne.
    landscape: >-
      L'altopiano è un massiccio di granito a grandi cristalli, di circa 300 milioni di anni e molto eroso. Su
      di esso nascono la Vienne, la Creuse, la Vézère e altri fiumi — undici in totale, ognuno di più di 50
      km. Il monte Bessou è il punto più alto del parco e di tutto il Limousin.


      Il clima è oceanico con un tocco di montagna: può nevicare fino ad aprile e nelle torbiere può gelare
      persino in agosto all'alba. Cadono tra 1 600 e 1 700 mm di pioggia all'anno sull'altopiano, con una
      temperatura media annuale di circa 7,5 °C.


      L'aspetto che si vede oggi è relativamente recente. Alla fine del diciannovesimo secolo il paesaggio era
      quasi completamente aperto, dominato da brughiere e pascoli; nel ventesimo secolo, con l'abbandono
      agricolo, furono piantate conifere come l'abete rosso, il larice e il douglasia. La foresta del parco è
      soprattutto quella piantagione, quasi monospezifica e di solito evitata dalla fauna, anche se rimangono
      frammenti di bosco antico, come i faggeti con agrifoglio, ricchi di biodiversità, con alberi vecchi e
      legno morto che ospitano coleotteri saprosilici. Le brughiere e i pascoli secchi e umidi, in mosaico con
      le torbiere, dominavano l'altopiano e oggi sono obiettivi di conservazione.
    wildlife: >-
      L'emblema del parco è la [lontra](/especie/lutra_lutra/). Quasi scomparsa dalla Francia negli anni
      ottanta, sta ricolonizzando il paese da bastioni come questo altopiano, e si individua dalle sue tracce
      lungo i fiumi. Nei ruscelli veloci vive la [cozza perlata](/especie/margaritifera_margaritifera/), la
      cui presenza indica che l'acqua è in ottimo stato. C'è anche il [gatto
      selvatico](/especie/felis_silvestris/) e 22 delle 37 specie di pipistrelli d'Europa.


      Tra gli uccelli nidificanti, il [picchio nero](/especie/dryocopus_martius/) e la civetta capogrosso
      hanno beneficiato dell'espansione del bosco. In brughiere e pascoli a gestione estensiva vive l'averla
      cenerina, con una trentina di coppie agli inizi degli anni 2010, mentre l'averla piccola, molto meno
      rara, fa sosta in estate. Negli spazi aperti abbondano la allodola, lo zigolo giallo, il pispola, il
      [saltimpalo nordico](/especie/saxicola_rubetra/) e il [gheppio](/especie/falco_tinnunculus/).


      Tra i funghi, in quattro stagioni vicino a Meymac sono state registrate 260 specie di macromiceti in
      dieci anni di campionamenti — un risultato elevato.
    visit: >-
      Il sito di punta è la torbiera del Longeyroux, a circa 900 metri di altitudine: una zona umida pastorale
      accessibile, la più grande torbiera del parco. Due sentieri attrezzati, di uno e nove chilometri,
      percorrono il suo paesaggio aperto, e ci sono anche passeggiate pastorali. Lontra e lucertola vivipara
      vi abitano, e tra le piante rare ci sono lo sfagno e la drosera, una pianta insettivora. La gestione
      prevede un pascolo estivo con un gregge di circa cinquecento pecore accompagnate da un pastore, e
      l'averla cenerina trova il suo cibo tra lucertole vivipare e insetti. La camminata da Millevaches a
      Longeroux è l'itinerario più lungo della guida, con 16 chilometri e cinque ore.


      Per più percorsi, Rando Millevaches è una guida digitale con più di 400 itinerari filtrabili per tipo,
      lunghezza, punti di interesse e dislivello, e la guida Chamina propone 45 circuiti di passeggiata in
      tutto il parco, con informazioni su patrimonio, geologia, economia e agricoltura. La Maison du Parc, nel
      villaggio di Millevaches, è il punto di accesso.


      Di notte, il parco ha identificato 11 siti accessibili molto propizi per osservare il cielo. Porta abiti
      caldi, perché in quota di solito fa fresco, una luce rossa e una mappa del cielo.
    history: >-
      La zona di protezione speciale dell'altopiano di Millevaches (2006) ospita 42 specie di interesse
      comunitario, come la tottavilla, la civetta capogrosso e l'averla piccola. Il parco ha definito 28 siti
      di interesse ecologico maggiore, e tra quelli paesaggistici ci sono il lago di Lavaud-Gelade, il mont
      Gargan, il lago dei Bariousses e il massiccio dei Monédières. La torbiera del Longeyroux fa parte del
      sito Natura 2000 Landes et zones humides de la Haute-Vézère.


      Anche la storia umana è nel suolo. Dalla villa gallo-romana di Les Cars, del secondo secolo, restano due
      edifici funerari e una grande abitazione. Fino alla fine del diciannovesimo secolo i tetti erano di
      paglia di segale, perché sull'altopiano non c'era canna palustre; oggi le ardesie di Travassac e Allasac
      le hanno sostituite.
    before: >-
      Copriti bene: può nevicare fino ad aprile e nelle torbiere può gelare persino in agosto, all'alba. Nella
      torbiera, resta sui sentieri attrezzati.
    around: >-
      A 22 km si trovano le [Gorges de la Sioule](/lugar/gorges-de-la-sioule/). E, lontano, il [Parque Natural
      Hoces del Alto Ebro y Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) condivide con
      l'altopiano la lontra e il falco di palude.
  pt:
    intro: >-
      Mil vacas, mil nascentes ou mil rochas: ninguém se entende no nome. A explicação mais popular no
      território lê-o como «mil nascentes»; outra, de Ernest Nègre, vê nas rochas de granito nu agrupadas como
      rebanhos de vacas; e uma lenda conta que uma pastora entregou ao diabo as suas mil vacas, que a
      tempestade tornara indóceis, e ele transformou-as em rochas uma a uma. O que está claro é a paisagem: o
      planalto de Millevaches, um maciço de granito, é a coluna deste parque natural regional, criado por
      decreto a 18 de maio de 2004 na Nouvelle-Aquitaine, entre Corrèze, Creuse e Haute-Vienne.
    landscape: >-
      O planalto é um maciço de granito de cristais grandes, com cerca de 300 milhões de anos e muito erodido.
      Sobre ele nascem o Vienne, o Creuse, o Vézère e outros rios — onze ao todo, cada um com mais de 50 km. O
      monte Bessou é o ponto mais alto do parque e de todo o Limousin.


      O clima é oceânico com um toque de montanha: pode nevar até abril e nas turfeiras pode gelar mesmo em
      agosto ao amanhecer. Caem entre 1 600 e 1 700 mm de chuva por ano no planalto, com uma temperatura média
      anual de cerca de 7,5 °C.


      O aspecto que se vê hoje é relativamente recente. No final do século dezanove a paisagem estava quase
      completamente aberta, dominada por charnecas e pastagens; no século vinte, com o abandono agrário, foram
      plantadas resinosas como o abeto vermelho, o lariço e o pinheiro-de-douglas. A floresta do parque é
      sobretudo essa plantação, quase monoespecífica e normalmente evitada pela fauna, embora permaneçam
      fragmentos de floresta antiga, como os carvalhais-faiais com azevinho, ricos em biodiversidade, com
      árvores velhas e madeira morta que albergam coleópteros saproxílicos. As charnecas e os pastos secos e
      húmidos, em mosaico com as turfeiras, dominavam o planalto e são hoje objectivos de conservação.
    wildlife: >-
      O emblema do parque é a [lontra](/especie/lutra_lutra/). Quase desaparecida de França nos anos oitenta,
      recoloniza o país desde bastiões como este planalto, e detecta-se pelas suas pegadas ao longo dos rios.
      Nos ribeiros rápidos vive o [mexilhão perlífero de rio](/especie/margaritifera_margaritifera/), cuja
      presença indica que a água está em muito bom estado. Há também o
      [gato-bravo](/especie/felis_silvestris/) e 22 das 37 espécies de morcegos da Europa.


      Entre as aves nidificantes, o [pica-pau-preto](/especie/dryocopus_martius/) e o mocho-boreal
      beneficiaram da expansão da floresta. Em charnecas e pastagens de gestão extensiva vive a picanço-real,
      com uma trintena de casais no início dos anos 2010, enquanto o picanço-barreteiro, muito menos raro, faz
      paragem no verão. Nos espaços abertos abundam a cotovia, o escrevedeira-amarela, a petinha-dos-prados, o
      [cartaxo-nortenho](/especie/saxicola_rubetra/) e o [peneireiro-vulgar](/especie/falco_tinnunculus/).


      Entre os fungos, em quatro estações perto de Meymac foram registadas 260 espécies de macromicetos ao
      longo de dez anos de amostragens — um resultado elevado.
    visit: >-
      O local mais emblemático é a turfeira do Longeyroux, a cerca de 900 metros de altitude: uma zona húmida
      pastoril acessível, a maior turfeira do parque. Dois percursos preparados, de um e de nove quilómetros,
      atravessam a sua paisagem aberta, e há também passeios pastorais. A lontra e a lagartixa-vivípara vivem
      lá, e entre as plantas raras estão o esfagno e a drosera, uma planta insectívora. A manutenção inclui
      pastoreio de verão com um rebanho de cerca de quinhentas ovelhas acompanhado por um pastor, e o
      picanço-real encontra o seu alimento entre lagartixa-vivíparas e insectos. A caminhada de Millevaches a
      Longeroux é o itinerário mais longo do guia, com 16 quilómetros e cinco horas.


      Para mais percursos, Rando Millevaches é um guia digital com mais de 400 rotas filtradas por tipo,
      comprimento, pontos de interesse e desnível, e o guia Chamina propõe 45 circuitos de passeio por todo o
      parque, com informação sobre património, geologia, economia e agricultura. A Maison du Parc, na aldeia
      de Millevaches, é a porta de entrada.


      De noite, o parque identificou 11 locais acessíveis muito propícios para observar o céu. Leva roupa
      quente, porque nas alturas costuma fazer fresco, uma luz vermelha e um mapa do céu.
    history: >-
      A zona de protecção especial do planalto de Millevaches (2006) alberga 42 espécies de interesse
      comunitário, como a cotovia-de-poupa, o mocho-boreal e o picanço-barreteiro. O parque definiu 28 locais
      de interesse ecológico maior, e entre os paisagísticos estão o lago de Lavaud-Gelade, o mont Gargan, o
      lago dos Bariousses e o maciço dos Monédières. A turfeira do Longeyroux faz parte do sítio Natura 2000
      Landes et zones humides de la Haute-Vézère.


      A história humana também está no solo. Da villa galo-romana de Les Cars, do segundo século, restam dois
      edifícios funerários e uma grande habitação. Até ao final do século dezanove os telhados eram de palha
      de centeio, porque no planalto não havia caniço; hoje os xistos de Travassac e Allasac substituíram-na.
    before: >-
      Agasalha-te: pode nevar até abril e nas turfeiras pode gelar mesmo em agosto, ao amanhecer. Na turfeira,
      fica nos percursos preparados.
    around: >-
      A 22 km ficam as [Gorges de la Sioule](/lugar/gorges-de-la-sioule/). E, longe, o [Parque Natural Hoces
      del Alto Ebro y Rudrón](/lugar/parque-natural-hoces-del-alto-ebro-y-rudron/) partilha com o planalto a
      lontra e o tartaranhão-caçador.
