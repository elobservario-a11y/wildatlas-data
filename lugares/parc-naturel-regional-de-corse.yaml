resumen:
  es: >-
    Ocupa más del 40% de la isla de Córcega (375.000 ha), abarcando la espina dorsal del Monte Cinto (2.706 m)
    y los cañones del Restonica y Tavignano.
  en: >-
    Covers more than 40 % of the island of Corsica (375,000 ha), encompassing the backbone of Monte Cinto
    (2,706 m) and the canyons of the Restonica and Tavignano.
  fr: >-
    Couvre plus de 40 % de l'île de Corse (375 000 ha), englobant l'épine dorsale du Monte Cinto (2 706 m) et
    les gorges de la Restonica et du Tavignano.
  de: >-
    Bedeckt mehr als 40 % der Insel Korsika (375 000 ha), einschließlich der Hauptkette des Monte Cinto (2 706
    m) und der Schluchten der Restonica und des Tavignano.
  it: >-
    Copre più del 40 % dell'isola di Corsica (375 000 ha), inglobando la dorsale del Monte Cinto (2 706 m) e i
    canyon della Restonica e del Tavignano.
  pt: >-
    Ocupa mais de 40 % da ilha da Córsega (375 000 ha), abrangendo a espinha dorsal do Monte Cinto (2 706 m) e
    os canhões da Restonica e do Tavignano.
unico:
  es: >-
    Es la montaña de Córcega entera, con el GR20 y los demás itinerarios de largo recorrido de la isla, y con
    ciervos y muflones de vuelta en los bosques y las cumbres.
  en: >-
    The whole mountain of Corsica, with the GR20 and the other long-distance trails of the island, and with
    deer and mouflon back in the forests and on the summits.
  fr: >-
    Toute la montagne corse, avec le GR20 et les autres itinéraires de grande randonnée de l'île, et avec
    cerfs et mouflons de retour dans les forêts et sur les cimes.
  de: >-
    Das gesamte Gebirge Korsikas, mit dem GR20 und den anderen Fernwanderwegen der Insel, und mit Hirschen und
    Mufflons, die in die Wälder und auf die Gipfel zurückgekehrt sind.
  it: >-
    Tutta la montagna della Corsica, con il GR20 e gli altri itinerari di grande percorrenza dell'isola, e con
    cervi e mufloni tornati nelle foreste e sulle vette.
  pt: >-
    Toda a montanha da Córsega, com o GR20 e os outros percursos de grande rota da ilha, e com veados e
    muflões de volta nas florestas e nos cumes.
observaciones:
  es: >-
    En los refugios del parque la reserva de noche es obligatoria, incluso para bivac y tarimas, y se hace en
    la central de reservas del parque. El vivac libre está prohibido: solo se autoriza junto a los refugios o
    en áreas previstas. Los perros están muy desaconsejados en este recorrido por los pasos escarpados y los
    descensos en rappel, y no se admiten dentro de los refugios del parque. No pises los pozzi y pozzines,
    humedales muy sensibles, ni alimentes ni molestes a la fauna.


    Los profesionales de la montaña piden no ir nunca solo, no apartarse de los senderos balizados y
    desconfiar de los cambios de tiempo, porque incluso en verano hay tormentas violentas.
texto:
  es:
    intro: >-
      En 1969 abatieron al último ciervo de Córcega, en el bosque de Pinia. Cuando nació el parque regional,
      los pueblos de la montaña se vaciaban, los bancales de cultivo se cubrían de maquis y la isla veía morir
      su interior. De ahí salió la idea de un parque regional, reclamado por la propia Córcega: una política
      voluntarista para salvar el interior. El Parque Natural Regional de Córcega, el Parcu di Corsica, se
      asienta sobre la gran dorsal montañosa que cruza la isla de noroeste a sureste y culmina en el Monte
      Cintu (2.706 m); es sobre todo un parque rural y de montaña, que asocia a la Collectivité de Corse y a
      178 municipios.
    landscape: >-
      Además de la dorsal, tiene fachadas marítimas: la costa occidental, grandiosa y salvaje, del golfo de
      Porto-Girolata, y una muestra de las lagunas del litoral oriental. En esa vertiente occidental, la
      reserva de biosfera Falasorma–Dui Sevi abarca los valles del Fangu y del Portu y baja unos 1.500 metros
      de profundidad en el golfo de Portu hasta la Punta Minuta, a 2.556 m. El golfo de Porto está clasificado
      patrimonio mundial por la UNESCO, y el Corte–Ota termina en Ota justo con esa vista entre el mar y las
      montañas.


      La insularidad hizo que el parque sea un laboratorio de endemismos, altos para Europa: el [trepador
      corso](/especie/sitta_whiteheadi/), el muflón corso, la trucha corsa y el discoglosso de Montalent;
      entre las plantas, el [pino laricio](/especie/pinus_nigra/) y el ajo corso. La cultura de la isla sigue
      viva en la ganadería y en los castillos de la Edad del Bronce de Cucuruzzu y Capula, en el municipio de
      Livia, a los que se llega desde el sendero Mare a Mare.
    wildlife: >-
      Hay dos animales que cuentan la historia del parque. El [muflón](/especie/ovis_gmelini/) corso vive en
      dos áreas, el macizo del Cintu y el de Bavella, y las dos poblaciones son subespecies distintas según
      los estudios genéticos. Está amenazado por la depredación de corderos y por las molestias de las
      actividades en la naturaleza, y desde 2020 el parque suelta ejemplares del recinto de cría de Quenza
      para formar un núcleo nuevo. Si quieres verlo, lleva prismáticos, guarda silencio y mantén la distancia.


      El [ciervo](/especie/cervus_elaphus/) volvió de Cerdeña. En 1985 se reintrodujeron cuatro animales en el
      recinto de Quenza; de 1998 a 2017 hubo 20 sueltas con más de 300 ciervos, y hoy se calculan entre 4.000
      y 5.000. El parque instaló senderos temáticos con miradores para seguir su rastro y, con suerte, verlo.


      Y en el cielo hay un programa de refuerzo del [quebrantahuesos](/especie/gypaetus_barbatus/), «Altore»,
      coordinado por el parque, y un proyecto INTERREG para el [águila
      pescadora](/especie/pandion_haliaetus/). De mediados de junio a mediados de septiembre el acceso a
      algunos macizos puede ser peligroso según el tiempo, y pueden cerrarse al público si hay riesgo severo.
    visit: >-
      El parque es el primer operador de senderismo de la isla. El GR20 es el nombre que todos conocen: desde
      1972 lleva ese número, y el primer refugio de la ruta se construyó en 1971. Está señalizado con marcas
      blancas y rojas. La primera etapa, de Calenzana a Ortu di u Piobbu, dura seis horas y media: parte de la
      fuente de San’Antone, sigue un antiguo camino de mulas hasta la fuente de Ortiventi, pasa por el mirador
      de Arghjova a 820 metros y llega al refugio de Ortu di u Piobbu, a 1.520 metros.


      Pero hay más caminos, todos balizados en naranja:


      - El Mare è Monti va de Calenzana a Cargèse en diez jornadas de 4 a 6 h 30 y 121 km, bajo las cumbres
      pero cerca del mar. Se puede hacer todo el año, mejor en primavera y otoño; en verano, sal temprano y
      lleva agua de sobra.

      - El Corte–Ota dura cuatro días, 58 km y 2.500 m de desnivel positivo, entre pinares laricio, el valle
      del Niolu y antiguos caminos de trashumancia.

      - El sendero de la Trashumancia sigue el camino milenario de los pastores que unía la montaña del Niolu
      con la llanura: cinco días y 72 km, de mediados de abril a finales de octubre, con buena forma física.

      - El Mare a Mare Norte va de Moriani a Cargèse por Corte en 11 o 12 días y 139 km, al pie del Monte
      Cintu y la Paglia Orba.

      - Para algo más suave, el Mare è Monti Sur (Porticcio–Propriano, cinco días, 66 km) o el Mare a Mare Sur
      (Porto-Vecchio–Propriano, cinco días, 73 km), apto para quien tiene poca experiencia y practicable todo
      el año.
    history: >-
      En 1971 se aprobó la carta del parque, centrada en proteger la naturaleza y renovar la economía rural
      con ganadería y turismo. En 1972 se firmó el decreto que lo creó, se dio al GR20 su número y se creó el
      primer parque de muflones. Hoy el parque también cuida los lagos de montaña: regula el flujo de
      visitantes, vigila que no se acampe y organiza la recogida de residuos.
    before: >-
      En los refugios del parque la reserva de noche es obligatoria, incluso para bivac y tarimas, y se hace
      en la central de reservas del parque. El vivac libre está prohibido: solo se autoriza junto a los
      refugios o en áreas previstas. Los perros están muy desaconsejados en este recorrido por los pasos
      escarpados y los descensos en rappel, y no se admiten dentro de los refugios del parque. No pises los
      pozzi y pozzines, humedales muy sensibles, ni alimentes ni molestes a la fauna.


      Los profesionales de la montaña piden no ir nunca solo, no apartarse de los senderos balizados y
      desconfiar de los cambios de tiempo, porque incluso en verano hay tormentas violentas.
    around: >-
      A 19 km, el [Parc Naturel Marin du Cap Corse et de
      l'Agriate](/lugar/parc-naturel-marin-du-cap-corse-et-de-l-agriate/) es el parque marino vecino. Y con un
      muflón en común, aunque lejos, el [Εθνικό Δασικό Πάρκο Τροόδους](/lugar/troodos-national-forest-park/);
      con el quebrantahuesos, el [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/).
  en:
    intro: >-
      In 1969 the last deer of Corsica was shot, in the forest of Pinia. When the regional park was born,
      mountain villages were emptying, cultivation terraces were filling with maquis and the island was
      watching its interior die. From that came the idea of a regional park, demanded by Corsica itself: a
      proactive policy to save the interior. The Corsica Regional Nature Park, the Parcu di Corsica, is built
      on the great mountain ridge that crosses the island from north-west to south-east and culminates in
      Monte Cintu (2,706 m); it is above all a rural and mountain park, associating the Collectivité de Corse
      and 178 municipalities.
    landscape: >-
      Beyond the ridge, the park has maritime faces: the grandiose and wild western coast of the Gulf of
      Porto-Girolata, and a sample of the lagoons of the eastern shoreline. On that western flank, the
      Falasorma–Dui Sevi biosphere reserve covers the valleys of the Fangu and the Portu and drops some 1,500
      metres into the Gulf of Portu down to Punta Minuta at 2,556 m. The Gulf of Porto is classified as a
      UNESCO World Heritage Site, and the Corte–Ota route ends at Ota with that view between sea and
      mountains.


      Island isolation made the park a laboratory of endemisms, high for Europe: the [Corsican
      nuthatch](/especie/sitta_whiteheadi/), the Corsican mouflon, the Corsican trout and Montalent's painted
      frog; among plants, the [Laricio pine](/especie/pinus_nigra/) and the Corsican garlic. The island's
      culture stays alive in livestock farming and in the Bronze Age castles of Cucuruzzu and Capula, in the
      municipality of Livia, reached from the Mare a Mare trail.
    wildlife: >-
      Two animals tell the park's story. The Corsican [mouflon](/especie/ovis_gmelini/) lives in two areas,
      the Cintu massif and the Bavella massif, and the two populations are distinct subspecies according to
      genetic studies. It is threatened by lamb predation and disturbance from outdoor activities, and since
      2020 the park releases animals from the Quenza breeding enclosure to form a new nucleus. If you want to
      see it, bring binoculars, stay quiet and keep your distance.


      The [deer](/especie/cervus_elaphus/) came back from Sardinia. In 1985 four animals were reintroduced at
      the Quenza enclosure; from 1998 to 2017 there were 20 releases with more than 300 deer, and today the
      population is estimated at between 4,000 and 5,000. The park has set up thematic trails with viewpoints
      to track them and, with luck, see them.


      In the sky there is a reinforcement programme for the [bearded vulture](/especie/gypaetus_barbatus/),
      "Altore", coordinated by the park, and an INTERREG project for the
      [osprey](/especie/pandion_haliaetus/). From mid-June to mid-September access to some massifs may be
      dangerous depending on weather, and they may be closed to the public if severe risk exists.
    visit: >-
      The park is the island's leading hiking operator. The GR20 is the name everyone knows: since 1972 it has
      carried that number, and the first refuge on the route was built in 1971. It is waymarked with white and
      red markers. The first stage, from Calenzana to Ortu di u Piobbu, takes six and a half hours: it starts
      from the San'Antone spring, follows an old mule track to the Ortiventi spring, passes the Arghjova
      viewpoint at 820 metres and reaches the Ortu di u Piobbu refuge at 1,520 metres.


      But there are more trails, all waymarked in orange:


      - The Mare è Monti runs from Calenzana to Cargèse in ten days of 4 to 6 h 30 and 121 km, below the
      summits but close to the sea. It can be done year-round, best in spring and autumn; in summer, start
      early and carry plenty of water.

      - The Corte–Ota takes four days, 58 km and 2,500 m of ascent, through Laricio pine forests, the Niolu
      valley and old transhumance paths.

      - The Transhumance trail follows the age-old shepherd's path that linked the Niolu mountains with the
      plain: five days and 72 km, from mid-April to end of October, requiring good fitness.

      - The Mare a Mare Nord goes from Moriani to Cargèse via Corte in 11 or 12 days and 139 km, at the foot
      of Monte Cintu and the Paglia Orba.

      - For something gentler, the Mare è Monti Sud (Porticcio–Propriano, five days, 66 km) or the Mare a Mare
      Sud (Porto-Vecchio–Propriano, five days, 73 km), suitable for those with little experience and walkable
      all year.
    history: >-
      In 1971 the park charter was approved, focused on protecting nature and renewing the rural economy with
      livestock and tourism. In 1972 the decree creating it was signed, the GR20 was given its number and the
      first mouflon reserve was created. Today the park also looks after mountain lakes: it regulates visitor
      flow, monitors for wild camping and organises waste collection.
    before: >-
      At the park's refuges, overnight booking is compulsory, including for bivouacs and sleeping platforms,
      and is made through the park's central booking service. Wild camping is prohibited: it is only
      authorised next to refuges or in designated areas. Dogs are strongly discouraged on this route because
      of the steep passes and abseil descents, and are not admitted inside the park refuges. Do not walk on
      the pozzi and pozzines, very sensitive wetlands, and do not feed or disturb wildlife.


      Mountain professionals urge you never to go alone, never to stray from waymarked paths, and to be wary
      of weather changes, because even in summer there are violent storms.
    around: >-
      At 19 km, the [Parc Naturel Marin du Cap Corse et de
      l'Agriate](/lugar/parc-naturel-marin-du-cap-corse-et-de-l-agriate/) is the neighbouring marine park. And
      sharing a mouflon connection, though far away: the [Troodos National Forest
      Park](/lugar/troodos-national-forest-park/); sharing the bearded vulture: the [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/).
  fr:
    intro: >-
      En 1969, le dernier cerf de Corse fut abattu dans la forêt de Pinia. Quand le parc régional naquit, les
      villages de montagne se vidaient, les terrasses de culture se couvraient de maquis et l'île voyait
      mourir son intérieur. De là vint l'idée d'un parc régional, réclamé par la Corse elle-même : une
      politique volontariste pour sauver l'intérieur. Le Parc naturel régional de Corse, le Parcu di Corsica,
      est assis sur la grande dorsale montagneuse qui traverse l'île du nord-ouest au sud-est et culmine au
      Monte Cintu (2 706 m) ; c'est avant tout un parc rural et de montagne, qui associe la Collectivité de
      Corse et 178 communes.
    landscape: >-
      Au-delà de la dorsale, le parc a des façades maritimes : la côte occidentale, grandiose et sauvage, du
      golfe de Porto-Girolata, et un échantillon des lagunes du littoral oriental. Sur ce versant occidental,
      la réserve de biosphère Falasorma–Dui Sevi couvre les vallées du Fangu et du Portu et descend de quelque
      1 500 mètres dans le golfe de Portu jusqu'à la Punta Minuta, à 2 556 m. Le golfe de Porto est classé
      patrimoine mondial par l'UNESCO, et le Corte–Ota se termine à Ota avec cette vue entre mer et montagnes.


      L'insularité a fait du parc un laboratoire d'endémismes, élevés pour l'Europe : la [sittelle
      corse](/especie/sitta_whiteheadi/), le mouflon corse, la truite corse et le discoglosse de Montalent ;
      parmi les plantes, le [pin laricio](/especie/pinus_nigra/) et l'ail corse. La culture de l'île reste
      vivante dans l'élevage et dans les châteaux de l'Âge du Bronze de Cucuruzzu et Capula, dans la commune
      de Livia, que l'on atteint depuis le sentier Mare a Mare.
    wildlife: >-
      Deux animaux racontent l'histoire du parc. Le [mouflon](/especie/ovis_gmelini/) corse vit dans deux
      zones, le massif du Cintu et celui de Bavella, et les deux populations sont des sous-espèces distinctes
      selon les études génétiques. Il est menacé par la prédation des agneaux et par les dérangements des
      activités de nature, et depuis 2020 le parc relâche des individus du parc d'élevage de Quenza pour
      former un nouveau noyau. Si vous voulez le voir, munissez-vous de jumelles, gardez le silence et
      maintenez la distance.


      Le [cerf](/especie/cervus_elaphus/) est revenu de Sardaigne. En 1985, quatre animaux furent réintroduits
      dans l'enclos de Quenza ; de 1998 à 2017 il y eut 20 lâchers avec plus de 300 cerfs, et aujourd'hui la
      population est estimée entre 4 000 et 5 000. Le parc a installé des sentiers thématiques avec des
      belvédères pour suivre leur trace et, avec de la chance, les observer.


      Dans le ciel, il y a un programme de renforcement du [gypaète barbu](/especie/gypaetus_barbatus/), «
      Altore », coordonné par le parc, et un projet INTERREG pour le [balbuzard
      pêcheur](/especie/pandion_haliaetus/). De mi-juin à mi-septembre, l'accès à certains massifs peut être
      dangereux selon la météo, et ils peuvent être fermés au public en cas de risque sévère.
    visit: >-
      Le parc est le premier opérateur de randonnée de l'île. Le GR20 est le nom que tout le monde connaît :
      depuis 1972 il porte ce numéro, et le premier refuge du parcours fut construit en 1971. Il est balisé de
      marques blanches et rouges. La première étape, de Calenzana à Ortu di u Piobbu, dure six heures et demie
      : elle part de la source de San'Antone, suit un ancien chemin muletier jusqu'à la source d'Ortiventi,
      passe par le belvédère d'Arghjova à 820 mètres et rejoint le refuge d'Ortu di u Piobbu, à 1 520 mètres.


      Mais il y a d'autres chemins, tous balisés en orange :


      - Le Mare è Monti va de Calenzana à Cargèse en dix jours de 4 à 6 h 30 et 121 km, sous les cimes mais
      près de la mer. Il peut se faire toute l'année, mieux au printemps et en automne ; en été, partez tôt et
      emportez beaucoup d'eau.

      - Le Corte–Ota dure quatre jours, 58 km et 2 500 m de dénivelé positif, à travers les pinèdes de
      laricio, la vallée du Niolu et d'anciens chemins de transhumance.

      - Le sentier de la Transhumance suit le chemin millénaire des bergers qui reliait la montagne du Niolu à
      la plaine : cinq jours et 72 km, de mi-avril à fin octobre, avec une bonne condition physique.

      - Le Mare a Mare Nord va de Moriani à Cargèse via Corte en 11 ou 12 jours et 139 km, au pied du Monte
      Cintu et de la Paglia Orba.

      - Pour quelque chose de plus doux, le Mare è Monti Sud (Porticcio–Propriano, cinq jours, 66 km) ou le
      Mare a Mare Sud (Porto-Vecchio–Propriano, cinq jours, 73 km), adapté à ceux qui ont peu d'expérience et
      praticable toute l'année.
    history: >-
      En 1971, la charte du parc fut approuvée, centrée sur la protection de la nature et le renouveau de
      l'économie rurale avec l'élevage et le tourisme. En 1972, le décret le créant fut signé, le GR20 reçut
      son numéro et le premier parc à mouflons fut créé. Aujourd'hui le parc s'occupe aussi des lacs de
      montagne : il régule les flux de visiteurs, veille à ce qu'il n'y ait pas de camping sauvage et organise
      la collecte des déchets.
    before: >-
      Dans les refuges du parc, la réservation de nuit est obligatoire, même pour le bivouac et les
      plates-formes dormoir, et se fait auprès de la centrale de réservation du parc. Le bivouac libre est
      interdit : il n'est autorisé qu'à proximité des refuges ou dans les zones prévues. Les chiens sont très
      déconseillés sur ce parcours en raison des passages escarpés et des rappels, et ne sont pas admis dans
      les refuges du parc. Ne piétinez pas les pozzi et pozzines, zones humides très sensibles, et ne
      nourrissez pas ni ne dérangez la faune.


      Les professionnels de la montagne demandent de ne jamais partir seul, de ne pas s'écarter des sentiers
      balisés et de se méfier des changements de temps, car même en été il y a de violents orages.
    around: >-
      À 19 km, le [Parc Naturel Marin du Cap Corse et de
      l'Agriate](/lugar/parc-naturel-marin-du-cap-corse-et-de-l-agriate/) est le parc marin voisin. Et avec un
      mouflon en commun, bien que loin : le [Troodos National Forest
      Park](/lugar/troodos-national-forest-park/) ; avec le gypaète : le [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/).
  de:
    intro: >-
      Im Jahr 1969 wurde der letzte Hirsch Korsikas im Wald von Pinia erlegt. Als der Regionalpark entstand,
      leerten sich die Bergdörfer, Kulturbänder bedeckten sich mit Macchie, und die Insel sah ihr Inneres
      sterben. Daraus entstand die Idee eines Regionalparks, den Korsika selbst forderte: eine bewusste
      Politik zur Rettung des Inneren. Der Regionale Naturpark Korsika, der Parcu di Corsica, sitzt auf dem
      großen Gebirgsgrat, der die Insel von Nordwesten nach Südosten durchzieht und im Monte Cintu (2 706 m)
      gipfelt; er ist vor allem ein ländlicher und Bergpark, der die Collectivité de Corse und 178 Gemeinden
      zusammenbringt.
    landscape: >-
      Jenseits des Grats hat der Park Meeresseiten: die großartige und wilde Westküste des Golfs von
      Porto-Girolata und eine Auswahl der Lagunen der Ostküste. An diesem Westhang umfasst das
      Biosphärenreservat Falasorma–Dui Sevi die Täler von Fangu und Portu und taucht rund 1 500 Meter in den
      Golf von Portu hinunter bis zur Punta Minuta auf 2 556 m. Der Golf von Porto ist UNESCO-Welterbe, und
      die Route Corte–Ota endet in Ota genau mit dem Blick zwischen Meer und Berge.


      Die Insellage machte den Park zu einem Labor für Endemismen, hoch für Europa: der
      [Korsikakleiber](/especie/sitta_whiteheadi/), der korsische Mufflon, die korsische Forelle und der
      Montalent-Scheibenzüngler; unter den Pflanzen die [Lariziokiefer](/especie/pinus_nigra/) und der
      korsische Knoblauch. Die Kultur der Insel lebt weiter in der Viehzucht und in den Bronzezeit-Kastellen
      von Cucuruzzu und Capula, in der Gemeinde Livia, die man vom Mare-a-Mare-Weg aus erreicht.
    wildlife: >-
      Zwei Tiere erzählen die Geschichte des Parks. Der korsische [Mufflon](/especie/ovis_gmelini/) lebt in
      zwei Gebieten, dem Cintu-Massiv und dem Bavella-Massiv, und die beiden Populationen sind laut
      genetischen Studien verschiedene Unterarten. Er ist durch Lammprädation und Störungen durch
      Outdooraktivitäten bedroht, und seit 2020 setzt der Park Tiere aus dem Quenza-Zuchtgehege frei, um einen
      neuen Kern zu bilden. Wenn du ihn sehen möchtest, nimm Ferngläser mit, bleib ruhig und halte Abstand.


      Der [Hirsch](/especie/cervus_elaphus/) kehrte aus Sardinien zurück. Im Jahr 1985 wurden vier Tiere im
      Quenza-Gehege ausgesetzt; von 1998 bis 2017 gab es 20 Aussetzungen mit mehr als 300 Hirschen, und heute
      werden zwischen 4 000 und 5 000 Tiere geschätzt. Der Park hat thematische Wanderwege mit
      Aussichtspunkten angelegt, um ihre Spuren zu verfolgen und sie mit etwas Glück zu sehen.


      Am Himmel gibt es ein Verstärkungsprogramm für den [Bartgeier](/especie/gypaetus_barbatus/), „Altore",
      koordiniert vom Park, und ein INTERREG-Projekt für den [Fischadler](/especie/pandion_haliaetus/). Von
      Mitte Juni bis Mitte September kann der Zugang zu einigen Massiven je nach Wetter gefährlich sein, und
      sie können bei schwerem Risiko für die Öffentlichkeit gesperrt werden.
    visit: >-
      Der Park ist der führende Wanderanbieter der Insel. Der GR20 ist der Name, den alle kennen: seit 1972
      trägt er diese Nummer, und die erste Hütte der Route wurde 1971 erbaut. Er ist mit weißen und roten
      Markierungen beschildert. Die erste Etappe, von Calenzana nach Ortu di u Piobbu, dauert sechs Stunden
      und dreißig Minuten: sie beginnt an der San'Antone-Quelle, folgt einem alten Maultierpfad bis zur
      Ortiventi-Quelle, passiert den Arghjova-Aussichtspunkt auf 820 Metern und erreicht die Hütte Ortu di u
      Piobbu auf 1 520 Metern.


      Aber es gibt weitere Wege, alle orange markiert:


      - Der Mare è Monti führt von Calenzana nach Cargèse in zehn Tagen zu 4 bis 6 h 30 und 121 km, unter den
      Gipfeln, aber nahe am Meer. Er kann ganzjährig begangen werden, besser im Frühling und Herbst; im Sommer
      früh aufbrechen und viel Wasser mitnehmen.

      - Der Corte–Ota dauert vier Tage, 58 km und 2 500 Höhenmeter, durch Lariziokiefernwälder, das Niolu-Tal
      und alte Transhumantzpfade.

      - Der Transhumanzpfad folgt dem jahrtausendealten Hirtenweg, der das Niolu-Gebirge mit der Ebene
      verband: fünf Tage und 72 km, von Mitte April bis Ende Oktober, in guter körperlicher Verfassung.

      - Der Mare a Mare Nord führt von Moriani nach Cargèse über Corte in 11 oder 12 Tagen und 139 km, am Fuße
      des Monte Cintu und der Paglia Orba.

      - Für etwas Ruhigeres: der Mare è Monti Sud (Porticcio–Propriano, fünf Tage, 66 km) oder der Mare a Mare
      Sud (Porto-Vecchio–Propriano, fünf Tage, 73 km), geeignet für wenig Erfahrene und das ganze Jahr
      begehbar.
    history: >-
      Im Jahr 1971 wurde die Parkcharta verabschiedet, die auf den Schutz der Natur und die Erneuerung der
      ländlichen Wirtschaft mit Viehzucht und Tourismus ausgerichtet war. Im Jahr 1972 wurde das
      Gründungsdekret unterzeichnet, dem GR20 seine Nummer gegeben und das erste Mufflon-Reservat geschaffen.
      Heute kümmert sich der Park auch um die Bergseen: er regelt den Besucherfluss, überwacht, dass nicht
      wild gecampt wird, und organisiert die Müllentsorgung.
    before: >-
      In den Hütten des Parks ist die Nachtbuchung Pflicht, auch für Biwak und Schlafplattformen, und erfolgt
      über die zentrale Buchungsstelle des Parks. Wildes Biwakieren ist verboten: es ist nur neben den Hütten
      oder in vorgesehenen Bereichen erlaubt. Hunde sind auf dieser Route wegen der steilen Pässe und
      Abseilabstiege stark abzuraten und werden in den Parkhütten nicht zugelassen. Betritt nicht die Pozzi
      und Pozzines, sehr empfindliche Feuchtgebiete, und füttere und störe die Tierwelt nicht.


      Bergfachleute raten, nie allein zu gehen, nie von markierten Wegen abzuweichen, und Wetterveränderungen
      zu misstrauen, denn selbst im Sommer gibt es heftige Gewitter.
    around: >-
      Bei 19 km liegt der [Parc Naturel Marin du Cap Corse et de
      l'Agriate](/lugar/parc-naturel-marin-du-cap-corse-et-de-l-agriate/), der benachbarte Meerespark. Und mit
      einem gemeinsamen Mufflon, wenn auch weit entfernt: der [Troodos National Forest
      Park](/lugar/troodos-national-forest-park/); mit dem Bartgeier: der [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/).
  it:
    intro: >-
      Nel 1969 fu abbattuto l'ultimo cervo della Corsica, nel bosco di Pinia. Quando nacque il parco
      regionale, i villaggi di montagna si svuotavano, i terrazzamenti si ricoprivano di macchia e l'isola
      vedeva morire il suo interno. Da lì nacque l'idea di un parco regionale, reclamato dalla Corsica stessa:
      una politica volontarista per salvare l'interno. Il Parco Naturale Regionale della Corsica, il Parcu di
      Corsica, si appoggia sulla grande dorsale montuosa che attraversa l'isola da nord-ovest a sud-est e
      culmina nel Monte Cintu (2 706 m); è soprattutto un parco rurale e di montagna, che associa la
      Collectivité de Corse e 178 comuni.
    landscape: >-
      Oltre alla dorsale, il parco ha facciate marittime: la costa occidentale, grandiosa e selvaggia, del
      golfo di Porto-Girolata, e un campione delle lagune del litorale orientale. Su quel versante
      occidentale, la riserva della biosfera Falasorma–Dui Sevi comprende le valli del Fangu e del Portu e
      scende di circa 1 500 metri nel golfo di Portu fino alla Punta Minuta, a 2 556 m. Il golfo di Porto è
      classificato patrimonio mondiale dell'UNESCO, e il Corte–Ota termina a Ota proprio con quella vista tra
      mare e montagne.


      L'insularità ha fatto del parco un laboratorio di endemismi, elevati per l'Europa: il [picchio muratore
      corso](/especie/sitta_whiteheadi/), il muflone corso, la trota corsa e il discoglosso di Montalent; tra
      le piante, il [pino laricio](/especie/pinus_nigra/) e l'aglio corso. La cultura dell'isola è ancora viva
      nell'allevamento e nei castelli dell'Età del Bronzo di Cucuruzzu e Capula, nel comune di Livia,
      raggiungibili dal sentiero Mare a Mare.
    wildlife: >-
      Due animali raccontano la storia del parco. Il [muflone](/especie/ovis_gmelini/) corso vive in due zone,
      il massiccio del Cintu e quello di Bavella, e le due popolazioni sono sottospecie distinte secondo gli
      studi genetici. È minacciato dalla predazione degli agnelli e dai disturbi delle attività nella natura,
      e dal 2020 il parco rilascia esemplari dal recinto di allevamento di Quenza per formare un nuovo nucleo.
      Se vuoi vederlo, porta il binocolo, stai in silenzio e mantieni la distanza.


      Il [cervo](/especie/cervus_elaphus/) tornò dalla Sardegna. Nel 1985 furono reintrodotti quattro animali
      nel recinto di Quenza; dal 1998 al 2017 ci furono 20 rilasci con più di 300 cervi, e oggi se ne stimano
      tra 4 000 e 5 000. Il parco ha installato sentieri tematici con belvedere per seguirne le tracce e, con
      fortuna, vederli.


      In cielo c'è un programma di rafforzamento del [gipeto barbuto](/especie/gypaetus_barbatus/), "Altore",
      coordinato dal parco, e un progetto INTERREG per il [falco pescatore](/especie/pandion_haliaetus/). Da
      metà giugno a metà settembre l'accesso ad alcuni massicci può essere pericoloso a seconda del tempo, e
      possono essere chiusi al pubblico in caso di rischio grave.
    visit: >-
      Il parco è il primo operatore di trekking dell'isola. Il GR20 è il nome che tutti conoscono: dal 1972
      porta quel numero, e il primo rifugio del percorso fu costruito nel 1971. È segnalato con segni bianchi
      e rossi. La prima tappa, da Calenzana a Ortu di u Piobbu, dura sei ore e mezza: parte dalla sorgente di
      San'Antone, segue un antico sentiero mulattiero fino alla sorgente di Ortiventi, passa per il belvedere
      di Arghjova a 820 metri e raggiunge il rifugio di Ortu di u Piobbu, a 1 520 metri.


      Ma ci sono altri percorsi, tutti segnalati in arancione:


      - Il Mare è Monti va da Calenzana a Cargèse in dieci giorni di 4 a 6 h 30 e 121 km, sotto le vette ma
      vicino al mare. Si può fare tutto l'anno, meglio in primavera e autunno; in estate, partite presto e
      portate molta acqua.

      - Il Corte–Ota dura quattro giorni, 58 km e 2 500 m di dislivello positivo, tra foreste di pino laricio,
      la valle del Niolu e antichi sentieri di transumanza.

      - Il sentiero della Transumanza segue il cammino millenario dei pastori che collegava la montagna del
      Niolu con la pianura: cinque giorni e 72 km, da metà aprile a fine ottobre, con buona forma fisica.

      - Il Mare a Mare Nord va da Moriani a Cargèse via Corte in 11 o 12 giorni e 139 km, ai piedi del Monte
      Cintu e della Paglia Orba.

      - Per qualcosa di più tranquillo, il Mare è Monti Sud (Porticcio–Propriano, cinque giorni, 66 km) o il
      Mare a Mare Sud (Porto-Vecchio–Propriano, cinque giorni, 73 km), adatto a chi ha poca esperienza e
      percorribile tutto l'anno.
    history: >-
      Nel 1971 fu approvata la carta del parco, incentrata sulla protezione della natura e sul rinnovo
      dell'economia rurale con allevamento e turismo. Nel 1972 fu firmato il decreto che lo istituì, il GR20
      ricevette il suo numero e fu creata la prima riserva di mufloni. Oggi il parco si occupa anche dei laghi
      di montagna: regola il flusso dei visitatori, vigila che non si campeggino selvaggiamente e organizza la
      raccolta dei rifiuti.
    before: >-
      Nei rifugi del parco la prenotazione notturna è obbligatoria, anche per bivacco e piattaforme, e va
      fatta tramite la centrale prenotazioni del parco. Il bivacco libero è vietato: è autorizzato solo vicino
      ai rifugi o nelle aree previste. I cani sono fortemente sconsigliati su questo percorso per i passi
      scoscesi e le calate in corda, e non sono ammessi nei rifugi del parco. Non calpestare i pozzi e le
      pozzine, zone umide molto sensibili, e non nutrire né disturbare la fauna.


      I professionisti della montagna chiedono di non andare mai da soli, di non allontanarsi dai sentieri
      segnalati e di diffidare dei cambi di tempo, perché anche in estate ci sono violenti temporali.
    around: >-
      A 19 km, il [Parc Naturel Marin du Cap Corse et de
      l'Agriate](/lugar/parc-naturel-marin-du-cap-corse-et-de-l-agriate/) è il parco marino vicino. E con un
      muflone in comune, benché lontano: il [Troodos National Forest
      Park](/lugar/troodos-national-forest-park/); con il gipeto: il [Parc Natural dels
      Ports](/lugar/parc-natural-dels-ports/).
  pt:
    intro: >-
      Em 1969 foi abatido o último veado da Córsega, na floresta de Pinia. Quando nasceu o parque regional, as
      aldeias de montanha esvaziavam-se, os socalcos de cultivo cobriam-se de matagal e a ilha via morrer o
      seu interior. Daí surgiu a ideia de um parque regional, reclamado pela própria Córsega: uma política
      voluntarista para salvar o interior. O Parque Natural Regional da Córsega, o Parcu di Corsica, assenta
      sobre a grande dorsale montanhosa que atravessa a ilha de noroeste a sudeste e culmina no Monte Cintu (2
      706 m); é sobretudo um parque rural e de montanha, que associa a Collectivité de Corse e 178 municípios.
    landscape: >-
      Para além da dorsale, o parque tem fachadas marítimas: a costa ocidental, grandiosa e selvagem, do golfo
      de Porto-Girolata, e uma amostra das lagoas do litoral oriental. Nesse versante ocidental, a reserva de
      biosfera Falasorma–Dui Sevi abrange os vales do Fangu e do Portu e desce cerca de 1 500 metros no golfo
      de Portu até à Punta Minuta, a 2 556 m. O golfo de Porto está classificado como Património Mundial pela
      UNESCO, e o Corte–Ota termina em Ota exactamente com essa vista entre o mar e as montanhas.


      A insularidade fez do parque um laboratório de endemismos, elevados para a Europa: o
      [trepadeira-corso](/especie/sitta_whiteheadi/), o muflão corso, a truta corsa e o discoglosso de
      Montalent; entre as plantas, o [pinheiro larício](/especie/pinus_nigra/) e o alho corso. A cultura da
      ilha continua viva na pecuária e nos castelos da Idade do Bronze de Cucuruzzu e Capula, no município de
      Livia, aos quais se chega pelo trilho Mare a Mare.
    wildlife: >-
      Dois animais contam a história do parque. O [muflão](/especie/ovis_gmelini/) corso vive em duas áreas, o
      maciço do Cintu e o de Bavella, e as duas populações são subespécies distintas segundo os estudos
      genéticos. Está ameaçado pela predação de cordeiros e pelos distúrbios das actividades na natureza, e
      desde 2020 o parque solta exemplares do recinto de criação de Quenza para formar um novo núcleo. Se
      queres vê-lo, leva binóculos, mantém o silêncio e guarda distância.


      O [veado](/especie/cervus_elaphus/) voltou da Sardenha. Em 1985 foram reintroduzidos quatro animais no
      recinto de Quenza; de 1998 a 2017 houve 20 solturas com mais de 300 veados, e hoje estimam-se entre 4
      000 e 5 000. O parque instalou percursos temáticos com miradouros para seguir o seu rasto e, com sorte,
      vê-los.


      No céu há um programa de reforço do [abutre-barbudo](/especie/gypaetus_barbatus/), "Altore", coordenado
      pelo parque, e um projecto INTERREG para o [águia-pesqueira](/especie/pandion_haliaetus/). De meados de
      junho a meados de setembro o acesso a alguns maciços pode ser perigoso conforme o tempo, e podem ser
      encerrados ao público se houver risco grave.
    visit: >-
      O parque é o primeiro operador de caminhadas da ilha. O GR20 é o nome que toda a gente conhece: desde
      1972 tem esse número, e o primeiro refúgio do percurso foi construído em 1971. Está sinalizado com
      marcas brancas e vermelhas. A primeira etapa, de Calenzana a Ortu di u Piobbu, dura seis horas e meia:
      parte da fonte de San'Antone, segue um antigo caminho de mulas até à fonte de Ortiventi, passa pelo
      miradouro de Arghjova a 820 metros e chega ao refúgio de Ortu di u Piobbu, a 1 520 metros.


      Mas há mais caminhos, todos sinalizados a laranja:


      - O Mare è Monti vai de Calenzana a Cargèse em dez jornadas de 4 a 6 h 30 e 121 km, abaixo dos cumes mas
      perto do mar. Pode fazer-se todo o ano, melhor na primavera e outono; no verão, sai cedo e leva água de
      sobra.

      - O Corte–Ota dura quatro dias, 58 km e 2 500 m de desnível positivo, por pinheiral larício, o vale do
      Niolu e antigos caminhos de transumância.

      - O trilho da Transumância segue o caminho milenar dos pastores que ligava a montanha do Niolu à
      planície: cinco dias e 72 km, de meados de abril ao final de outubro, com boa forma física.

      - O Mare a Mare Norte vai de Moriani a Cargèse por Corte em 11 ou 12 dias e 139 km, ao pé do Monte Cintu
      e da Paglia Orba.

      - Para algo mais suave, o Mare è Monti Sul (Porticcio–Propriano, cinco dias, 66 km) ou o Mare a Mare Sul
      (Porto-Vecchio–Propriano, cinco dias, 73 km), apto para quem tem pouca experiência e praticável todo o
      ano.
    history: >-
      Em 1971 foi aprovada a carta do parque, centrada na protecção da natureza e na renovação da economia
      rural com pecuária e turismo. Em 1972 foi assinado o decreto que o criou, o GR20 recebeu o seu número e
      foi criada a primeira reserva de muflões. Hoje o parque também cuida dos lagos de montanha: regula o
      fluxo de visitantes, vigía que não se acampe e organiza a recolha de resíduos.
    before: >-
      Nos refúgios do parque a reserva de noite é obrigatória, incluindo para bivaque e plataformas, e faz-se
      na central de reservas do parque. O vivaque livre é proibido: só é autorizado junto dos refúgios ou em
      áreas previstas. Os cães são muito desaconselhados neste percurso pelos passos escarpados e as descidas
      em rappel, e não são admitidos nos refúgios do parque. Não pisas os pozzi e pozzines, zonas húmidas
      muito sensíveis, nem alimentes nem perturbes a fauna.


      Os profissionais da montanha pedem para nunca ir sozinho, não te afastares dos percursos sinalizados e
      desconfiares das mudanças de tempo, porque mesmo no verão há trovoadas violentas.
    around: >-
      A 19 km, o [Parc Naturel Marin du Cap Corse et de
      l'Agriate](/lugar/parc-naturel-marin-du-cap-corse-et-de-l-agriate/) é o parque marinho vizinho. E com um
      muflão em comum, embora longe: o [Troodos National Forest Park](/lugar/troodos-national-forest-park/);
      com o abutre-barbudo: o [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/).
