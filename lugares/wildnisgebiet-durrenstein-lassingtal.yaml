texto:
  es:
    intro: >-
      Hay bosques que se cuidan y bosques que se dejan en paz. En el Wildnisgebiet Dürrenstein-Lassingtal, en
      Baja Austria y Estiria, alrededor de las montañas Dürrenstein y Hochkar, se hizo lo segundo. Aquí está
      el Rothwald, el mayor resto de bosque virgen de todo el arco alpino, y desde 2017 forma parte del
      Patrimonio Mundial. Es un área salvaje, reconocida por la IUCN en las categorías Ia e Ib, hecha para que
      el bosque siga su propio camino. Tú entras con las reglas del bosque, no al revés.
    landscape: >-
      La base es caliza. La vegetación del área refleja los distintos tipos de emplazamiento de las montañas
      de los Alpes calcáreos del norte, y de ahí sale un mosaico: cada ladera, cada fondo de valle y cada
      risco tienen su propio bosque. El clima ayuda a explicarlo, porque es húmedo y recibe abundante nieve.
      El paisaje de hoy es, además, fruto de una recolonización vegetal posterior a la glaciación: el bosque
      volvió cuando el hielo se retiró.


      Lo que más extensión ocupa son los bosques de haya, abeto y pícea. En las laderas húmedas y empinadas
      mandan otros árboles: arce de montaña, fresno y olmo de montaña, árboles de hoja ancha que dominan el
      bosque de barranco. Hay turberas elevadas, como la de Leckermoos, y el proyecto europeo que dio origen
      al área recogía también turberas de transición y tapices flotantes entre sus hábitats.


      Y luego están los sitios donde el bosque no llega ni llegará. Las paredes de roca y los conos de
      derrubios están sin bosque por naturaleza. Por encima del arbolado cerrado crecen plantas de altura: la
      Silberwurz, la Steinraute, el Alpenquendel o Petergstamm.
    wildlife: >-
      Lo primero que tienes que saber es qué se pasea por aquí: [ciervos rojos](/especie/cervus_elaphus/),
      rebecos, liebres nivales y [jabalíes](/especie/sus_scrofa/). De vez en cuando pasa un
      [lince](/especie/lynx_lynx/), y esa visita ocasional explica que un sendero de gran recorrido lleve su
      nombre. El Luchs Trail atraviesa Dürrenstein-Lassingtal y los parques nacionales Kalkalpen y Gesäuse,
      siguiendo los rastros del lince.


      El bosque guarda a los especialistas. Entre las especies características están el tritón alpino, la
      salamandra alpina, la víbora, el [águila real](/especie/aquila_chrysaetos/), el escaso pico dorsiblanco
      y el papamoscas papirrojo. Aquí viven además las cuatro aves de montaña de la familia de los galliformes
      que hay en Austria: el [urogallo](/especie/tetrao_urogallus/), el gallo lira, el grévol y la perdiz
      nival.


      Entre los insectos destaca el escarabajo longicornio alpino, una especie prioritaria del Anexo II de la
      Directiva Hábitats. Si buscas búhos, hay un sendero pensado para ello: desde el Eulenweg, con paciencia,
      se pueden encontrar entre los árboles y las rocas.
    visit: >-
      Fuera de los senderos señalizados, solo se entra al área en caminatas guiadas. Esa es la regla que
      ordena toda la visita, y el gestor ofrece excursiones guiadas y caminatas, con puntos de encuentro e
      información de llegada publicados en su web.


      Para empezar sin guía, tienes tres senderos temáticos. El Wildnisweg parte justo del aparcamiento de
      Steinbachtal y te da una primera idea de la naturaleza salvaje y de sus habitantes. El Eulenweg es el de
      los búhos. El Moorweg rodea la turbera elevada de Leckermoos, cerca de la antigua Jausenstation Ablass,
      y allí hay visitas guiadas todos los martes por la mañana, a las 9:30. Quien quiera ir más lejos puede
      enlazar con el Luchs Trail.


      Antes o después de salir al monte, pasa por Lunz am See. Allí está la Haus der Wildnis, con una
      exposición dedicada a la relación entre bosque primario, naturaleza salvaje y agua. Tiene realidad
      virtual y estaciones interactivas, y toda ella está pensada sin barreras.
    history: >-
      Este bosque tiene una historia de fronteras. Los monasterios de Gaming y Admont mantuvieron una disputa
      territorial por este entorno, y en los alrededores sobreviven las Rothschildhäuser, casas forestales
      características de la región.


      La protección llegó con un proyecto LIFE inicial, que permitió crear la administración del área
      protegida. Hoy el Rothwald forma parte del espacio Natura 2000 Ötscher–Dürrenstein, y la administración
      de Baja Austria clasifica el sector oriental en la categoría Ia. La gestión también mira hacia delante:
      se permite transformar rodales secundarios de pícea en bosques más naturales hasta 2032.
    before: >-
      El acceso está regulado. Fuera de los senderos señalizados no se puede entrar por libre; solo con visita
      guiada. Mira en la web del gestor los puntos de encuentro y las excursiones programadas. Si quieres
      darte un baño en el río Lassing, solo se permite en los puntos señalizados.
    around: >-
      La [Hochschwabgruppe](/lugar/hochschwabgruppe/) es la vecina más cercana del atlas, y el [Nationalpark
      Gesäuse - Enns Gorge](/lugar/nationalpark-gesause---enns-gorge/) es la segunda. Este último es uno de
      los tres espacios protegidos que enlaza el Luchs Trail.
  en:
    intro: >-
      There are forests managed by humans, and forests left completely in peace. In the Wildnisgebiet
      Dürrenstein-Lassingtal, straddling Lower Austria and Styria around the massifs of Dürrenstein and
      Hochkar, the choice was the latter. Here lies the Rothwald, the largest relict primeval forest in the
      entire Alpine arc, inscribed on the UNESCO World Heritage list in 2017. It is a wilderness area
      recognized under IUCN categories Ia and Ib, set aside so natural forest processes can unfold unimpeded.
      You enter on the forest's terms, not your own.
    landscape: >-
      The bedrock is predominantly limestone. The area's vegetation reflects the varied microclimates and site
      conditions typical of the Northern Limestone Alps, creating an intricate mosaic: each slope, valley
      bottom, and karst crag fosters its own distinct forest community. The climate helps explain this
      richness, being wet with copious snowfall. Today's landscape also represents post-glacial revegetation:
      the forest reclaimed the terrain as Pleistocene glaciers retreated.


      Mature mixed stands of European beech, silver fir, and Norway spruce dominate the greatest area. Steep,
      shaded gullies favor broadleaf ravine forests of sycamore maple, European ash, and wych elm. The reserve
      shelters pristine raised bogs such as the Leckermoos, alongside transitional mires and floating quaking
      mats identified during initial European LIFE conservation inventories.


      Then there are rocky sectors where trees cannot take root. Sheer cliffs and scree slopes remain
      naturally treeless. Above the closed forest canopy thrive hardy subalpine plants: mountain avens
      (Silberwurz), rue (Steinraute), wild thyme (Alpenquendel), and auricula (Petergstamm).
    wildlife: >-
      The first thing you should know is what roams these slopes: [red deer](/especie/cervus_elaphus/),
      chamois, mountain hare, and [wild boar](/especie/sus_scrofa/). Occasionally a [Eurasian
      lynx](/especie/lynx_lynx/) passes through, an occurrence commemorated by a long-distance trekking trail
      bearing its name: the Luchs Trail crosses Dürrenstein-Lassingtal and the neighboring Kalkalpen and
      Gesäuse national parks following lynx territory.


      The forest shelters ecological specialists. Characteristic species include the alpine newt, alpine
      salamander, European adder, [golden eagle](/especie/aquila_chrysaetos/), the scarce white-backed
      woodpecker, and the red-breasted flycatcher. Furthermore, the area hosts all four native Alpine
      galliform birds found in Austria: the [western capercaillie](/especie/tetrao_urogallus/), black grouse,
      hazel grouse, and rock ptarmigan.


      Among invertebrates, the alpine longhorn beetle stands out as a priority Annex II species of the EU
      Habitats Directive. For owl enthusiasts, a dedicated trail exists: with patience along the Eulenweg,
      several owl species can be detected roosting among veteran hollow trees and limestone crags.
    visit: >-
      Outside of designated, signposted trails, you may only enter the wilderness area on guided ranger
      excursions. This strict rule governs all access, with the park management scheduling educational hikes,
      meeting points, and arrival information published directly on its website.


      To explore independently without a guide, three thematic trails are maintained. The Wildnisweg starts
      right from the Steinbachtal car park, offering an initial introduction to primeval wilderness and its
      inhabitants. The Eulenweg focuses on forest owls. The Moorweg circles the raised bog of Leckermoos near
      the former Jausenstation Ablass, where public guided tours depart every Tuesday morning at 9:30. Those
      seeking multi-day treks can connect directly with the regional Luchs Trail.


      Before or after heading into the mountains, stop in Lunz am See. There stands the Haus der Wildnis,
      housing an exhibition dedicated to the relationships between primeval forests, wilderness, and water. It
      features virtual reality experiences and interactive exhibits, all designed with complete barrier-free
      accessibility.
    history: >-
      These mountain forests share a long history of boundary disputes. The medieval monasteries of Gaming and
      Admont contested ownership of this territory, and nearby survive the historic Rothschildhäuser,
      traditional foresters' lodges distinctive to the region.


      Formal legal protection began with an initial EU LIFE project that established the wilderness
      administration. Today the Rothwald forms part of the Natura 2000 site Ötscher–Dürrenstein, with Lower
      Austria classifying the eastern core under IUCN Category Ia. Forest management also looks ahead: gradual
      ecological conversion of secondary spruce stands into natural mixed woodland is authorized through 2032.
    before: >-
      Access is strictly regulated. Wandering off marked trails is forbidden unless participating in an
      official guided tour. Check the park administration website for meeting points and scheduled excursions.
      If you wish to cool off in the Lassing river, bathing is permitted solely at designated access points.
    around: >-
      The [Hochschwabgruppe](/lugar/hochschwabgruppe/) is the closest neighbouring massif in the atlas,
      followed by [Nationalpark Gesäuse - Enns Gorge](/lugar/nationalpark-gesause---enns-gorge/). The latter
      is one of three protected areas connected across the Alps by the Luchs Trail.
  fr:
    intro: >-
      Il est des forêts que l'on exploite et d'autres que l'on laisse en paix. Dans le Wildnisgebiet
      Dürrenstein-Lassingtal, à cheval sur la Basse-Autriche et la Styrie autour du Dürrenstein et du Hochkar,
      c'est ce second parti qui fut choisi. C'est ici que survit le Rothwald, le plus vaste reliquat de forêt
      primaire de tout l'arc alpin, inscrit au Patrimoine mondial de l'UNESCO en 2017. Cette aire sauvage
      intégrale, reconnue par l'UICN sous les catégories Ia et Ib, garantit la libre évolution des processus
      naturels. On y pénètre selon les règles de la forêt, et non les siennes.
    landscape: >-
      Le socle est calcaire. La couverture végétale reflète la diversité des micro-stations des Préalpes
      orientales septentrionales, composant une mosaïque : chaque versant, chaque fond de combe et chaque
      arête rocheuse porte son propre peuplement. Le climat humide et très enneigé éclaire cette luxuriance.
      Le paysage actuel découle par ailleurs de la recolonisation post-glaciaire : la forêt a reconquis les
      vallées sitôt les glaciers retirés.


      Les hêtraies-sapinières à épicéa occupent les plus grandes surfaces. Sur les pentes escarpées et
      fraîches s'épanouit la forêt de ravin dominée par l'érable sycomore, le frêne élevé et l'orme de
      montagne. Des tourbières bombées intactes, comme celle de Leckermoos, des tourbières de transition et
      des tremblants complètent ce complexe d'habitats répertorié dès le projet européen fondateur.


      S'y ajoutent les secteurs où l'arbre ne pousse pas : falaises abruptes et cônes d'éboulis sont
      naturellement dépourvus de couvert boisé. Au-dessus de la limite des arbres prospèrent des plantes
      d'altitude spécialisées : la dryade à huit pétales (Silberwurz), la rue des montagnes (Steinraute), le
      serpolet alpin (Alpenquendel) et la primevère oreille-d'ours (Petergstamm).
    wildlife: >-
      Vous devez d'abord savoir quels animaux parcourent ces bois : [cerfs élaphes](/especie/cervus_elaphus/),
      chamois, lièvres variables et [sangliers](/especie/sus_scrofa/). De temps à autre un [lynx
      boréal](/especie/lynx_lynx/) traverse le massif, passage discret qui a valu son nom à un grand
      itinéraire : le Luchs Trail relie Dürrenstein-Lassingtal aux parcs nationaux de Kalkalpen et de Gesäuse
      sur les traces du grand félin.


      La forêt abrite des spécialistes exigeants. Parmi les espèces remarquables figurent le triton alpestre,
      la salamandre noire, la vipère péliade, l'[aigle royal](/especie/aquila_chrysaetos/), le rare pic à dos
      blanc et le gobe-mouche nain. La réserve accueille en outre les quatre galliformes de montagne indigènes
      d'Autriche : le [grand tétras](/especie/tetrao_urogallus/), le tétras-lyre, la gélinotte des bois et le
      lagopède alpin.


      Parmi les insectes se distingue la rosalie des Alpes, espèce prioritaire de l'Annexe II de la directive
      Habitats. Pour les rapaces nocturnes, un sentier a été conçu : sur l'Eulenweg, avec patience, chouettes
      et hiboux s'observent entre vieux arbres et rochers.
    visit: >-
      En dehors des sentiers balisés, l'accès à la réserve sauvage ne se fait que dans le cadre de randonnées
      accompagnées. Cette règle absolue encadre la fréquentation, l'administration organisant des sorties
      guidées dont les points de rendez-vous sont publiés sur son site web.


      Pour une découverte autonome sans guide, trois sentiers thématiques sont aménagés. Le Wildnisweg débute
      au parking du Steinbachtal et offre une première immersion dans la nature sauvage. L'Eulenweg est
      consacré aux chouettes. Le Moorweg contourne la tourbière de Leckermoos près de l'ancienne Jausenstation
      Ablass, avec des visites guidées tous les mardis matin à 9:30. Les randonneurs au long cours peuvent
      quant à eux rejoindre le Luchs Trail.


      Avant ou après votre sortie, arrêtez-vous à Lunz am See pour visiter la Haus der Wildnis, dont la
      muséographie explore les liens entre forêt primaire, nature sauvage et eau. Elle intègre des modules de
      réalité virtuelle et un parcours entièrement accessible aux personnes à mobilité réduite.
    history: >-
      Ces forêts portent la mémoire d'anciennes querelles territoriales entre les abbayes de Gaming et
      d'Admont, tandis que subsistent dans les parages les Rothschildhäuser, pittoresques pavillons forestiers
      construits par la famille Rothschild.


      La protection découle d'un projet LIFE pionnier qui permit d'asseoir la structure de gestion.
      Aujourd'hui, le Rothwald est intégré au site Natura 2000 Ötscher–Dürrenstein, et le Land de
      Basse-Autriche classe le secteur oriental en catégorie Ia. La gestion regarde vers l'avenir : la
      conversion écologique d'enrésinements secondaires vers des forêts naturelles est encadrée jusqu'en 2032.
    before: >-
      L'accès est rigoureusement réglementé. En dehors des itinéraires balisés, toute circulation libre est
      proscrite ; seules les excursions guidées sont permises. Consultez le calendrier des visites sur le site
      du gestionnaire. La baignade dans la rivière Lassing n'est tolérée que sur les accès spécialement
      indiqués.
    around: >-
      Le massif du [Hochschwabgruppe](/lugar/hochschwabgruppe/) est le voisin le plus proche dans l'atlas,
      suivi du [Nationalpark Gesäuse - Enns Gorge](/lugar/nationalpark-gesause---enns-gorge/). Ce dernier est
      l'un des trois espaces protégés reliés par le Luchs Trail.
  de:
    intro: >-
      Es gibt Wälder, die der Mensch bewirtschaftet, und Wälder, die er vollkommen in Ruhe lässt. Im
      Wildnisgebiet Dürrenstein-Lassingtal in Niederösterreich und der Steiermark rund um Dürrenstein und
      Hochkar geschah Zweiteres. Hier liegt der Rothwald, der größte Urwaldrest des gesamten Alpenbogens, seit
      2017 Teil des UNESCO-Welterbes. Als strenges Wildnisgebiet der IUCN-Kategorien Ia und Ib dient es dem
      ungestörten Ablauf natürlicher Prozesse. Du betrittst dieses Terrain nach den Spielregeln der Natur.
    landscape: >-
      Das Gebirgsfundament besteht aus Kalkstein. Die Vegetation spiegelt die vielfältigen
      Standortverhältnisse der Nördlichen Kalkalpen wider: Jeder Hang, jeder Graben und jeder Felszahn trägt
      eine eigene Waldgesellschaft. Das niederschlagsreiche, schneereiche Klima begünstigt diesen Reichtum.
      Die heutige Landschaft ist zudem das Ergebnis nacheiszeitlicher Wiederbesiedlung: Der Wald kehrte
      zurück, als die Gletscher wichen.


      Den größten Raum nehmen Buchen-Tannen-Fichten-Urwälder ein. An steilen Schatthängen dominieren
      Schluchtwälder aus Bergahorn, Gemeiner Esche und Bergulme. Intakte Hochmoore wie das Leckermoos,
      Übergangsmoore und Schwingrasen komplettieren das Mosaik schutzwürdiger Lebensräume.


      Und dann gibt es Bereiche, die von Natur aus waldfrei bleiben: Schroffe Felswände und Schutthalden
      tragen keinen Baumwuchs. Oberhalb der Waldgrenze behaupten sich alpine Spezialisten wie Silberwurz,
      Steinraute, Alpenquendel und Petergstamm (Aurikel).
    wildlife: >-
      Zunächst solltest du wissen, wer diese Wälder durchstreift: [Rothirsch](/especie/cervus_elaphus/),
      Gämse, Schneehase und [Wildschwein](/especie/sus_scrofa/). Gelegentlich wandert ein [Eurasischer
      Luchs](/especie/lynx_lynx/) durch das Gebiet; an diese Streifzüge erinnert der Weitwanderweg Luchs
      Trail, der das Wildnisgebiet mit den Nationalparks Kalkalpen und Gesäuse verbindet.


      Der Urwald bewahrt anspruchsvolle Spezialisten. Zu den Charakterarten zählen Alpensalamander, Bergmolch,
      Kreuzotter, [Steinadler](/especie/aquila_chrysaetos/), Weißrückenspecht und Zwergschnäpper. Zudem kommen
      hier alle vier in Österreich heimischen Raufußhühner vor: [Auerhuhn](/especie/tetrao_urogallus/),
      Birkhuhn, Haselhuhn und Alpenschneehuhn.


      Unter den Insekten sticht der Alpenbock hervor, eine prioritäre Art des Anhangs II der FFH-Richtlinie.
      Für Eulenbeobachter empfiehlt sich der Eulenweg, an dem sich mit Geduld verschiedene Eulenarten in
      Felsnischen und Baumhöhlen entdecken lassen.
    visit: >-
      Abseits der markierten Wanderwege darf das Wildnisgebiet nur im Rahmen geführter Touren betreten werden.
      Diese strikte Regelung schützt die Kernzone; die Schutzgebietsverwaltung bietet thematische Exkursionen
      an, deren Treffpunkte online veröffentlicht werden.


      Für eigenständige Wanderungen stehen drei Themenwege bereit: Der Wildnisweg beginnt am Parkplatz
      Steinbachtal und vermittelt erste Einblicke in die ungezähmte Wildnis. Der Eulenweg widmet sich den
      lautlosen Jägern der Nacht. Der Moorweg umrundet das Hochmoor Leckermoos nahe der ehemaligen
      Jausenstation Ablass, wo jeden Dienstagmorgen um 9:30 Uhr geführte Moorwanderungen starten. Weitwanderer
      können auf den Luchs Trail einschwenken.


      Vor oder nach der Tour lohnt ein Besuch im Haus der Wildnis in Lunz am See. Die interaktive Ausstellung
      mit Virtual-Reality-Stationen widmet sich dem Zusammenspiel von Urwald, Wasser und Wildnis und ist
      vollkommen barrierefrei zugänglich.
    history: >-
      Die Wälder blicken auf historische Grenzstreitigkeiten zwischen den Klöstern Gaming und Admont zurück;
      in der Umgebung zeugen die Rothschildhäuser von forstlicher Tradition.


      Der moderne Schutzstatus entstand aus einem LIFE-Projekt, das die Schutzgebietsverwaltung begründete.
      Heute gehört der Rothwald zum Natura-2000-Gebiet Ötscher–Dürrenstein; das Land Niederösterreich stuft
      den Ostsektor als Schutzgebiet der Kategorie Ia ein. Die schrittweise Überführung sekundärer
      Fichtenforste in naturnahe Mischwälder ist bis 2032 vorgesehen.
    before: >-
      Der Zugang ist reglementiert. Abseits der markierten Wege ist freies Wandern untersagt; Zutritt gibt es
      nur mit Führung. Bitte informiere dich vorab auf der Website der Verwaltung über Termine. Das Baden im
      Lassingtal ist ausschließlich an den gekennzeichneten Stellen gestattet.
    around: >-
      Die [Hochschwabgruppe](/lugar/hochschwabgruppe/) ist das nächstgelegene Massiv im Atlas, gefolgt vom
      [Nationalpark Gesäuse - Enns Gorge](/lugar/nationalpark-gesause---enns-gorge/). Letzterer gehört zu den
      drei Schutzgebieten, die der Luchs Trail miteinander verknüpft.
  it:
    intro: >-
      Ci sono foreste governate dall'uomo e foreste lasciate in pace. Nel Wildnisgebiet
      Dürrenstein-Lassingtal, tra Bassa Austria e Stiria attorno alle vette di Dürrenstein e Hochkar, si è
      scelta la seconda via. Qui si trova il Rothwald, il maggiore lembo di foresta primaria sopravvissuto
      nell'arco alpino, iscritto dal 2017 nel Patrimonio Mondiale UNESCO. È un'area selvaggia riconosciuta
      dall'IUCN nelle categorie Ia e Ib, creata affinché la foresta segua indisturbata il proprio corso. Vi si
      accede accettando le regole del bosco, non le proprie.
    landscape: >-
      Il substrato è calcareo. La vegetazione riflette la ricchezza stazionale delle Alpi Calcaree
      Settentrionali, componendo un mosaico: ogni versante, fondovalle o cresta rupestre esprime la propria
      comunità forestale. Il clima umido e intensamente nevoso ne favorisce la rigogliosità. Il paesaggio
      odierno è figlio della ricolonizzazione post-glaciale: il bosco riconquistò i rilievi non appena i
      ghiacci arretrarono.


      Le estensioni maggiori appartengono a fustaie miste di faggio, abete bianco e abete rosso. Sui versanti
      dirupati e freschi dominano i boschi di forra con acero di monte, frassino maggiore e olmo montano.
      Torbiere alte intatte, come il Leckermoos, torbiere di transizione e prati galleggianti completano gli
      habitat riconosciuti dal progetto europeo originario.


      Vi sono poi gli ambienti ove gli alberi non allignano: pareti rocciose e ghiaioni sono naturalmente
      spogli di bosco. Oltre il limite della vegetazione arborea resistono piante d'alta quota: il camedrio
      alpino (Silberwurz), la ruta di monte (Steinraute), il timo alpino (Alpenquendel) e l'orecchia d'orso
      (Petergstamm).
    wildlife: >-
      Occorre anzitutto sapere quali presenze abitano questi pendii: [cervi rossi](/especie/cervus_elaphus/),
      camosci, lepri bianche e [cinghiali](/especie/sus_scrofa/). Di tanto in tanto compare una
      [lince](/especie/lynx_lynx/), presenza elusiva celebrata da un sentiero a lunga percorrenza: il Luchs
      Trail attraversa il Dürrenstein-Lassingtal e i parchi nazionali Kalkalpen e Gesäuse sulle tracce del
      felino.


      La selva ospita specie altamente specializzate: tritone alpino, salamandra alpina, marasso, [aquila
      reale](/especie/aquila_chrysaetos/), picchio dorsobianco e pigliamosche pettirosso. Qui si riproducono
      inoltre i quattro galliformi alpini indigeni d'Austria: il [gallo cedrone](/especie/tetrao_urogallus/),
      il fagiano di monte, il francolino di monte e la pernice bianca.


      Tra gli insetti primeggia il cerambice del faggio (Rosalia alpina), specie prioritaria dell'Allegato II
      della Direttiva Habitat. Per gli amanti dei rapaci notturni, lungo l'Eulenweg è possibile individuare
      con pazienza diverse specie di gufi e civette tra le rupi e i tronchi marcescenti.
    visit: >-
      Al di fuori dei percorsi segnalati, si accede all'area selvaggia unicamente partecipando a escursioni
      guidate. È la norma che presidia l'intero comprensorio; l'ente gestore pianifica visite con guide del
      parco pubblicando date e ritrovi sul proprio sito internet.


      Per camminare in autonomia senza guida, puoi usufruire di tre sentieri didattici. Il Wildnisweg muove
      dal parcheggio della Steinbachtal offrendo un primo contatto con la natura primigenia. L'Eulenweg è
      dedicato ai rapaci notturni. Il Moorweg cinge la torbiera alta di Leckermoos vicino alla storica
      Jausenstation Ablass, dove ogni martedì mattina alle 9:30 si tengono visite guidate. Gli escursionisti
      più esperti possono connettersi al Luchs Trail.


      Prima o dopo l'escursione, visita Lunz am See per scoprire la Haus der Wildnis, allestimento dedicato al
      dialogo tra foresta primaria, natura selvaggia e risorsa idrica, dotato di visori di realtà virtuale e
      pienamente accessibile senza barriere.
    history: >-
      Questo bosco vanta un passato segnato da dispute confinarie tra le storiche abbazie di Gaming e Admont;
      nei dintorni resistono le Rothschildhäuser, caratteristiche residenze forestali dei baroni Rothschild.


      La protezione formale prese avvio con un progetto pilota LIFE che costituì la struttura di gestione.
      Oggi il Rothwald rientra nella rete Natura 2000 Ötscher–Dürrenstein, e il governo provinciale della
      Bassa Austria classifica il nucleo orientale in Categoria Ia. La riconversione ecologica delle peccete
      secondarie in foreste miste naturali è autorizzata fino al 2032.
    before: >-
      L'accesso è rigorosamente disciplinato. Fuori dai tracciati segnalati non è permesso vagare liberamente;
      l'accesso avviene solo con guida accreditata. Consulta il portale del parco per orari e punti di
      ritrovo. Se desideri fare il bagno nel torrente Lassing, è consentito unicamente nei varchi
      appositamente indicati.
    around: >-
      Il gruppo montuoso dell'[Hochschwabgruppe](/lugar/hochschwabgruppe/) rappresenta il rilievo più vicino
      nell'atlas, seguito dal [Nationalpark Gesäuse - Enns Gorge](/lugar/nationalpark-gesause---enns-gorge/).
      Quest'ultimo è uno dei tre spazi protetti uniti dall'itinerario transalpino del Luchs Trail.
  pt:
    intro: >-
      Há florestas sujeitas a exploração humana e florestas deixadas em livre evolução. No Wildnisgebiet
      Dürrenstein-Lassingtal, entre a Baixa Áustria e a Estíria, em redor dos maciços de Dürrenstein e
      Hochkar, optou-se pela segunda via. Aqui subsiste o Rothwald, o maior reduto de floresta virgem de todo
      o arco alpino, inscrito na lista do Património Mundial da UNESCO em 2017. Trata-se de uma área selvagem
      reconhecida nas categorias Ia e Ib da UICN, consagrada à evolução espontânea dos ecossistemas. Nela
      entras aceitando as regras do arvoredo, e não o inverso.
    landscape: >-
      A matriz rochosa assenta em calcários. A flora espelha a diversidade dos Alpes Calcários Setentrionais,
      compondo um intrincado mosaico: cada encosta, fundo de garganta ou crista escarpada acolhe a sua própria
      comunidade florestal. O clima húmido e com nevões copiosos potencia esta exuberância. A paisagem resulta
      ainda da recolonização vegetal pós-glaciar, tendo o arvoredo reconquistado as vertentes com o degelo
      pleistocénico.


      Os talhões mistos de faia, abeto-falso e espruce dominam as maiores extensões. Nas encostas íngremes e
      sombrias impõe-se a floresta de ravina com bordo-da-montanha, freixo-comum e olmo-da-montanha. Turfeiras
      altas intocadas, como o Leckermoos, turfeiras de transição e mantos flutuantes integram o leque de
      habitats inventariados no projeto LIFE pioneiro.


      Existem ainda biotopos onde a floresta não vinga: escarpas rochosas e cascalheiras desprovidas de
      coberto arbóreo. Acima do limite do bosque resistem plantas alpinas especializadas: a
      dríade-de-oito-pétalas (Silberwurz), a arruda-alpina (Steinraute), o serpão-dos-alpes (Alpenquendel) e a
      prímula-orelha-de-urso (Petergstamm).
    wildlife: >-
      Importa saber que fauna percorre estas matas: [veados-vermelhos](/especie/cervus_elaphus/), camurças,
      lebres-variáveis e [javalis](/especie/sus_scrofa/). De quando em vez cruza o território um
      [lince-euroasiático](/especie/lynx_lynx/), presença que batiza uma grande rota pedestre: o Luchs Trail
      percorre Dürrenstein-Lassingtal e os parques nacionais Kalkalpen e Gesäuse no encalço das pegadas do
      felino.


      A floresta alberga especialistas exigentes. Entre a fauna destacam-se a salamandra-dos-alpes, o
      tritão-alpino, a víbora-comum, a [águia-real](/especie/aquila_chrysaetos/), o raro
      pica-pau-de-dorso-branco e o papa-moscas-pequeno. O território acolhe ainda as quatro aves galiformes de
      montanha nativas da Áustria: o [tetraz-grande](/especie/tetrao_urogallus/), o tetraz-lira, a
      galinha-do-mato e a lagópode-branca.


      Entre os insetos sobressai o bicho-serpente-dos-alpes (Rosalia alpina), espécie prioritária do Anexo II
      da Diretiva Habitats. Para os amantes de rapinas noturnas existe o Eulenweg, onde com paciência se
      detetam mochos e corujas entre troncos ocos e escarpas.
    visit: >-
      Fora dos trilhos assinalados, só é permitido entrar na reserva selvagem em visitas guiadas. Esta regra
      fundamental disciplina a visitação, organizando a administração passeios temáticos cujos pontos de
      encontro e horários são divulgados no portal oficial.


      Para explorar de forma independente sem guia, existem três trilhos interpretativos. O Wildnisweg parte
      do parque de estacionamento de Steinbachtal, oferecendo um contacto inicial com a natureza virgem. O
      Eulenweg dedica-se às aves de rapina noturnas. O Moorweg circunda a turfeira alta de Leckermoos junto à
      antiga Jausenstation Ablass, onde ocorrem visitas guiadas todas as terças-feiras de manhã às 9:30. Os
      caminhantes de longo curso podem interligar-se com o Luchs Trail.


      Antes ou após a marcha na montanha, visita a Haus der Wildnis em Lunz am See. A estrutura museológica
      aborda os nexos entre floresta primária, vida selvagem e água, integrando realidade virtual e percursos
      integralmente acessíveis sem barreiras.
    history: >-
      Esta mata encerra uma história secular de disputas fronteiriças entre os mosteiros de Gaming e Admont,
      restando nas imediações as Rothschildhäuser, casas florestais erguidas pela família Rothschild.


      A tutela contemporânea nasceu de um projeto europeu LIFE que instituiu o corpo de gestão. Atualmente o
      Rothwald integra o sítio Natura 2000 Ötscher–Dürrenstein, classificando o governo da Baixa Áustria a
      zona oriental na Categoria Ia. A transição ecológica de talhões secundários de espruce para povoamentos
      autóctones mistos está balizada até 2032.
    before: >-
      O acesso obedece a regras restritas. Fora dos percursos assinalados não podes circular livremente; a
      entrada apenas se autoriza mediante visita guiada. Consulta previamente o sítio oficial para verificar
      datas e pontos de partida. Os banhos no rio Lassing apenas são permitidos nas áreas assinaladas para
      esse efeito.
    around: >-
      O maciço de [Hochschwabgruppe](/lugar/hochschwabgruppe/) constitui o vizinho mais próximo no atlas,
      secundado pelo [Nationalpark Gesäuse - Enns Gorge](/lugar/nationalpark-gesause---enns-gorge/). Este
      último integra o trio de áreas protegidas unificadas pelo Luchs Trail.
