unico:
  es: Es el mayor bosque virgen que queda en los Alpes, y solo se recorre por sendas marcadas o con guía.
  en: >-
    It is the largest virgin forest remaining in the Alps, accessible only along marked perimeter trails or
    with an authorized guide.
  fr: >-
    La plus grande forêt vierge subsistant dans les Alpes, accessible uniquement sur sentiers balisés ou avec
    un guide agréé.
  de: >-
    Der größte verbliebene Urwald der Alpen, nur auf markierten Wegen oder bei geführten Exkursionen
    zugänglich.
  it: >-
    È la più grande foresta vergine rimasta nelle Alpi, percorribile esclusivamente lungo i sentieri segnati o
    con visita guidata.
  pt: >-
    É a maior mata virgem sobrevivente nos Alpes, acessível apenas por trilhos balizados ou com acompanhamento
    de guia credenciado.
observaciones:
