resumen:
  es: >-
    El mayor santuario de protección y reproducción de la avutarda de Europa Central (más de 500 ejemplares en
    libertad).
  en: >-
    The foremost sanctuary for the protection and breeding of the great bustard in Central Europe (over 500
    wild individuals).
  fr: >-
    Le principal sanctuaire de protection et de reproduction de la grande outarde en Europe centrale (plus de
    500 individus sauvages).
  de: Das bedeutendste Schutz- und Brutgebiet der Großtrappe in Mitteleuropa (über 500 wildlebende Exemplare).
  it: >-
    Il più rilevante santuario di tutela e riproduzione dell’otarda comune nell’Europa centrale (oltre 500
    esemplari liberi).
  pt: >-
    O maior santuário de proteção e reprodução da abetarda na Europa Central (mais de 500 exemplares em
    liberdade).
unico:
  es: Aquí la agricultura se ordena en el espacio y en el tiempo para no poner en peligro los nidos de avutarda.
  en: >-
    Agricultural practices here are orchestrated in space and time to shield vulnerable great bustard ground
    nests from destruction.
  fr: >-
    L’agriculture y est rigoureusement planifiée dans l’espace et dans le temps afin d’épargner les nids de
    grande outarde.
  de: >-
    Die landwirtschaftliche Bewirtschaftung wird hier räumlich und zeitlich präzise gelenkt, um Bodennester
    der Großtrappe nicht zu gefährden.
  it: >-
    Qui le pratiche agricole vengono pianificate nello spazio e nel tempo per non danneggiare i nidi
    dell’otarda.
  pt: A atividade agrícola é aqui planeada no espaço e no tempo para evitar a destruição dos ninhos da abetarda.
observaciones:
  es: >-
    Las zonas de protección reforzada, al este de la torre, solo se visitan con guía o autorización, para
    asegurar la tranquilidad de las avutardas. Para el cortejo, ve entre finales de marzo y fines de mayo, a
    primera o última hora del día; para las rutas en bici, entre abril y octubre.
texto:
  es:
    intro: >-
      A finales de marzo, con la primera luz, los machos de [avutarda común](/especie/otis_tarda/) se exhiben
      en la llanura de Dévaványa ante las hembras. El cortejo se prolonga hasta fines de mayo, y el parque
      recomienda verlo al amanecer o al atardecer desde el entorno de la torre del sendero Réhelyi. Este es el
      sector más grande y más variado del Parque Nacional Körös-Maros: pastizales salinos, el río
      Hortobágy-Berettyó, campos de cultivo y bosquetes entre Dévaványa, Ecsegfalva, Túrkeve y Gyomaendrőd.
      Está protegido desde 1975 y ocupa 13.085 hectáreas.
    landscape: >-
      Antes de que se regularan los ríos, las crecidas del Tisza y del Berettyó alimentaban un humedal en el
      borde del antiguo Nagy-Sárrét. Lo que queda de él es una puszta: estepa salina con ajenjo en los suelos
      más secos, calveros salinos desnudos en menor extensión y prados salinos donde la tierra es más húmeda.
      En los restos del antiguo robledal salino crecen buenas poblaciones de *Peucedanum officinale* y de
      *Aster sedifolius*, ambas protegidas.


      El otro protagonista es el río. Su tramo dentro del parque mide unos 33 kilómetros y conserva sus
      grandes meandros, algo raro en Hungría tras las regulaciones fluviales. En los remansos crecen en gran
      cantidad plantas acuáticas protegidas como *Salvinia natans*, *Nymphoides peltata* y *Trapa natans*, y
      en las orillas hay carrizales y prados de siega.


      La puszta cambia de color con las estaciones: flores blancas y amarillas en primavera, amarillas en
      verano y lilas en otoño.
    wildlife: >-
      La avutarda manda en este territorio. Con más de quinientos ejemplares, la población de Dévaványa supone
      un tercio de la húngara y ha crecido moderadamente en diez años. Cría en los pastizales y también en
      cultivos, sobre todo de alfalfa y cereales, y no es la única que se beneficia: el [aguilucho
      cenizo](/especie/circus_pygargus/), el [alcaraván común](/especie/burhinus_oedicnemus/), la perdiz
      pardilla y el búho campestre también se ven favorecidos.


      Desde principios de abril se oye en los canales el canto del macho del sapillo de vientre rojo, que
      flota en el agua para llamar a las hembras. En los pastizales crían la alondra común, la avefría, la
      aguja colinegra y la avutarda. Los alrededores son hábitat importante de dos rapaces amenazadas a escala
      mundial: el [águila imperial oriental](/especie/aquila_heliaca/) y el [halcón
      sacre](/especie/falco_cherrug/).


      En el bosque de Farkas-zug hay una garcera con [garza real](/especie/ardea_cinerea/) y [martinete
      común](/especie/nycticorax_nycticorax/) como colonizadores, y unas pocas parejas de [garceta
      común](/especie/egretta_garzetta/) y garcilla cangrejera. En el río viven peces protegidos con
      poblaciones estables, como *Rhodeus amarus*, que esconde sus huevos en las conchas de los mejillones. Y
      la [nutria](/especie/lutra_lutra/) es una especie protegida en la zona. En total, en el parque se ha
      registrado cerca de dos tercios de las especies de aves detectadas en Hungría.
    visit: >-
      Empieza en el centro de visitantes Sterbetz István, que explica la llanura de Dévaványa y la
      conservación de la avutarda. De él parte el sendero Réhelyi, de 1,7 kilómetros, que se recorre en una
      hora y pasa junto a la pajarera donde se muestran avutardas: así se ve de cerca el ave voladora más
      pesada de Europa. Sus cinco estaciones tratan un canal cegado por la vegetación, la vida de la puszta
      salina, el hábitat y la observación de la avutarda, el hábitat de *Aster* y *Peucedanum* y un lago
      artificial. Desde la torre elevada se contempla uno de los cortejos de avutarda más importantes de
      Europa Central. En los espacios exteriores del centro se ven de cerca ganado gris húngaro, búfalo, oveja
      racka y cerdo mangalica.


      Para recorrer la llanura hay cinco rutas ciclistas señalizadas, recomendadas del 1 de abril al 30 de
      octubre, y el centro es su punto de partida y llegada, con bicicletas de alquiler. Gabonás-Szilasok mide
      veinte kilómetros y atraviesa parcelas donde puede verse la avutarda; Atyaszeg-Csordajárás-Dévaványa,
      diecisiete, bordea la zona sensible y cruza el antiguo pasto comunal; Kérsziget-Berettyó-Ecsegfalva,
      quince, recorre una gran llanura de hierba y sigue el dique del río. La más larga,
      Bala-Berettyó-Halastavak, tiene cuarenta y ocho kilómetros, con una variante de cuarenta y tres.
    history: >-
      El Ördögárok forma parte de un sistema de fortificación y terraplenes levantado por los sármatas entre
      los años 330 y 350. En tiempos más recientes, la protección del lugar se ha centrado en la avutarda: la
      estación de protección de la avutarda de Dévaványa recibe las puestas en riesgo de todo el país y las
      incuba, las cría y las suelta.
    before: >-
      Las zonas de protección reforzada, al este de la torre, solo se visitan con guía o autorización, para
      asegurar la tranquilidad de las avutardas. Para el cortejo, ve entre finales de marzo y fines de mayo, a
      primera o última hora del día; para las rutas en bici, entre abril y octubre.
    around: >-
      A diecinueve kilómetros está el [Parque Nacional de Hortobágy - La Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/). Más lejos, otros lugares comparten con Dévaványa la
      avutarda y la estepa: el [Parque Nacional Fertő-Hanság - Estepa de
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/), con aguilucho cenizo y búho campestre, y la
      [Reserva Natural Especial Pastizales de Veliki Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) y el
      [Parque Nacional Kiskunság - Estepas Salinas](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/), con
      cernícalo patirrojo.
  en:
    intro: >-
      In late March at first dawn, male [great bustards](/especie/otis_tarda/) strut across the open expanse
      of the Dévaványa plain to display before the females. The lekking spectacle continues into late May, and
      park rangers recommend observing at sunrise or sunset from the observation tower along the Réhelyi
      trail. This is the largest and most ecologically diverse sector of Körös-Maros National Park: alkaline
      steppes, the winding Hortobágy-Berettyó river, mosaic arable fields, and groves stretching across
      Dévaványa, Ecsegfalva, Túrkeve, and Gyomaendrőd. Protected since 1975, it covers 13,085 hectares.
    landscape: >-
      Before river engineering in the XIX century, seasonal floods of the Tisza and Berettyó fed an immense
      marshland along the historic Nagy-Sárrét basin. What endures today is a true puszta: artemisia-dominated
      alkali grasslands across drier knolls, bare alkaline salt-scars, and damp saline meadows in lower
      depressions. Relict saline pedunculate oak stands preserve healthy colonies of protected *Peucedanum
      officinale* and *Aster sedifolius*.


      The winding river is the other focal point. Its section within the park spans some 33 kilometres,
      retaining sweeping natural meanders—a rare survival in Hungary following extensive canalisation.
      Sheltered backwaters foster rich growths of protected floating plants like *Salvinia natans*,
      *Nymphoides peltata*, and *Trapa natans*, fringed by reedbeds and hay meadows.


      The puszta shifts colours through the seasons: white and yellow blossoms in spring, golden hues in
      summer, and delicate lilac tones in autumn.
    wildlife: >-
      The great bustard reigns over this open domain. Counting more than five hundred individuals, Dévaványa’s
      population accounts for a third of the national total and has grown steadily over the past ten years.
      They breed across native alkaline grasslands and arable crops, particularly alfalfa and cereals. Other
      ground-nesting steppe species benefit directly: [Montagu’s harriers](/especie/circus_pygargus/),
      [Eurasian stone-curlews](/especie/burhinus_oedicnemus/), grey partridges, and short-eared owls thrive
      here.


      From early April, male European fire-bellied toads can be heard calling from drainage channels,
      inflating their throats to entice females. Skylarks, northern lapwings, black-tailed godwits, and
      bustards nest across open pastures. Surrounding landscapes form crucial hunting territory for two
      globally threatened raptors: the [eastern imperial eagle](/especie/aquila_heliaca/) and the [saker
      falcon](/especie/falco_cherrug/).


      In the Farkas-zug woodland, a lively heronry is colonized by [grey herons](/especie/ardea_cinerea/) and
      [black-crowned night-herons](/especie/nycticorax_nycticorax/), along with several pairs of [little
      egrets](/especie/egretta_garzetta/) and squacco herons. The river shelters protected fishes with healthy
      populations, including *Rhodeus amarus*, which deposits its eggs inside living freshwater mussel shells.
      The [Eurasian otter](/especie/lutra_lutra/) is also strictly protected. Overall, close to two-thirds of
      all bird species recorded in Hungary have been documented within the park.
    visit: >-
      Start at the Sterbetz István Visitor Centre, which illustrates the natural history of the Dévaványa
      plain and the conservation of the great bustard. From the centre departs the Réhelyi educational trail,
      covering 1.7 kilometres in about an hour, passing outdoor aviaries where non-releasable bustards are
      tended—giving visitors a close view of the heaviest flying bird in Europe. Five interpretive stations
      detail old silted drainage canals, alkali steppe ecology, bustard courtship and habitat requirements,
      rare *Aster* and *Peucedanum* associations, and a constructed wetland. From the elevated observation
      tower, you can overlook one of the premier bustard lekking sites in Central Europe. Outdoor pens
      showcase historic Hungarian breeds including Grey cattle, water buffalo, Racka sheep, and Mangalica
      pigs.


      To explore the wider plain, five waymarked cycle routes operate from 1 April to 30 October, with rental
      bikes available at the visitor centre. The Gabonás-Szilasok circuit covers twenty kilometres through
      agricultural mosaics; Atyaszeg-Csordajárás-Dévaványa covers seventeen kilometres along the edge of
      protected core zones; Kérsziget-Berettyó-Ecsegfalva spans fifteen kilometres across sweeping grasslands
      and flood dikes. The longest route, Bala-Berettyó-Halastavak, spans forty-eight kilometres, with a
      shorter variant of forty-three.
    history: >-
      The Ördögárok forms part of a grand system of earthwork fortifications and defensive ditches raised by
      the Sarmatians between the years 330 and 350. In modern times, conservation has focused squarely on the
      great bustard: the Dévaványa rescue station gathers threatened clutches from across Hungary to incubate,
      rear, and return young bustards to the wild.
    before: >-
      Strict nature reserves east of the watchtower can only be visited with official permits or accompanied
      by a park ranger, ensuring complete tranquillity for breeding bustards. For the mating lek, visit
      between late March and late May at dawn or dusk; cycle paths are open from April through October.
    around: >-
      Nineteen kilometres away lies [Hortobágy National Park - The Hungarian
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/). Further afield, other atlas destinations share steppe
      landscapes and bustards: [Fertő-Hanság National Park - Hanság
      Steppe](/lugar/ferto-hansag-nemzeti-park---hansag/) with Montagu’s harriers, the [Veliki Rit Pastures
      Special Nature Reserve](/lugar/specijalni-rezervat-prirode-pasnjaci/), and [Kiskunság National Park -
      Saline Steppes](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/) with red-footed falcons.
  fr:
    intro: >-
      À la fin du mois de mars, aux premières lueurs du jour, les mâles de [grande
      outarde](/especie/otis_tarda/) paradent dans la plaine de Dévaványa sous le regard des femelles. Les
      parades nuptiales se poursuivent jusqu’à la fin mai ; le parc recommande de les observer à l’aube ou au
      crépuscule depuis la tour d’observation du sentier Réhelyi. C’est le secteur le plus étendu et le plus
      varié du parc national de Körös-Maros : steppes salines, rivière Hortobágy-Berettyó, parcelles cultivées
      et bosquets répartis entre Dévaványa, Ecsegfalva, Túrkeve et Gyomaendrőd. Protégé depuis 1975, il couvre
      13 085 hectares.
    landscape: >-
      Avant la régulation hydrographique, les crues régulières de la Tisza et du Berettyó alimentaient
      d’immenses marais en lisière de l’ancien Nagy-Sárrét. Il en subsiste une puszta authentique : pelouses
      salines à armoise sur les buttes sèches, cuvettes salifères dénudées et prairies humides inondables.
      Dans les reliques d’anciens boisements de chênes sur sols salins s’épanouissent de belles populations
      protégées de *Peucedanum officinale* et d’*Aster sedifolius*.


      Le cours d’eau joue également un rôle primordial. Son tronçon de 33 kilomètres au sein du parc conserve
      de larges méandres sauvages, une rareté en Hongrie après les grands travaux d’endiguement. Les bras
      calmes abritent des herbiers denses de plantes aquatiques protégées comme *Salvinia natans*, *Nymphoides
      peltata* et *Trapa natans*, ceinturés de roselières et de prairies de fauche.


      La puszta change d’aspect au fil des saisons : fleurs blanches et jaunes au printemps, teintes dorées en
      été et camaïeux mauves en automne.
    wildlife: >-
      La grande outarde règne sans partage sur ces étendues. Rassemblant plus de cinq cents individus, la
      colonie de Dévaványa représente un tiers du cheptel national et a progressé régulièrement en dix ans.
      Elle niche au sol dans les pâturages salins et dans les cultures de luzerne ou de céréales, profitant à
      d’autres espèces remarquables : le [busard cendré](/especie/circus_pygargus/), [l’œdicnème
      criard](/especie/burhinus_oedicnemus/), la perdrix grise et le hibou des marais.


      Dès le début du mois d’avril retentit dans les canaux le chant nuptial du sonneur à ventre de feu. Dans
      les prairies nichent alouettes des champs, vanneaux huppés et barges à queue noire. Les abords
      constituent le territoire de chasse de deux rapaces menacés : [l’aigle
      impérial](/especie/aquila_heliaca/) et le [faucon sacre](/especie/falco_cherrug/).


      Le bois de Farkas-zug abrite une colonie mixte de [hérons cendrés](/especie/ardea_cinerea/) et de
      [bihoreaux gris](/especie/nycticorax_nycticorax/), rejoints par des [aigrettes
      garzettes](/especie/egretta_garzetta/) et des crabiers chevelus. La rivière abrite des poissons
      remarquables comme la bouvière (*Rhodeus amarus*), qui dépose ses œufs dans les moules d’eau douce. La
      [loutre d’Europe](/especie/lutra_lutra/) est strictement protégée. Au total, près de deux tiers des
      espèces d’oiseaux recensées en Hongrie ont été observées dans le parc.
    visit: >-
      Rendez-vous au centre de visiteurs Sterbetz István, qui retrace l’écologie de la plaine de Dévaványa et
      les méthodes de sauvegarde de l’outarde. C’est le point de départ du sentier didactique Réhelyi, long de
      1,7 kilomètre et parcouru en une heure, longeant de vastes volières où des outardes blessées sont
      soignées—permettant d’approcher le plus lourd oiseau volant d’Europe. Ses cinq haltes abordent les
      anciens canaux colmatés, la vie de la steppe saline, la parade de l’outarde, les stations botaniques à
      *Aster* et un étang aménagé. Depuis la tour d’affût, la vue domine l’un des rassemblements nuptiaux
      majeurs d’Europe centrale. Les enclos extérieurs présentent du bétail traditionnel hongrois : bœuf gris,
      buffle domestique, brebis racka et porc mangalitza.


      Pour parcourir la plaine à vélo, cinq circuits balisés sont ouverts du 1 avril au 30 octobre avec
      location sur place. La boucle de Gabonás-Szilasok fait vingt kilomètres au milieu des champs ;
      Atyaszeg-Csordajárás-Dévaványa parcourt dix-sept kilomètres le long de la zone de quiétude ;
      Kérsziget-Berettyó-Ecsegfalva couvre quinze kilomètres sur les digues. La plus longue,
      Bala-Berettyó-Halastavak, atteint quarante-huit kilomètres avec une variante de quarante-trois.
    history: >-
      L’Ördögárok (le fossé du Diable) s’inscrit dans un impressionnant dispositif de remparts et de fossés
      défensifs érigé par les Sarmates entre les années 330 et 350. De nos jours, les efforts portent sur la
      survie de la grande outarde : le centre de sauvetage de Dévaványa recueille les pontes menacées de tout
      le pays pour les incuber et réintroduire les jeunes.
    before: >-
      Les zones de protection intégrale à l’est de la tour ne sont accessibles qu’avec une autorisation
      spéciale ou un guide du parc pour préserver le calme des couvées. Pour assister aux parades nuptiales,
      prévoyez votre venue entre fin mars et fin mai, à l’aube ou au coucher du soleil ; les parcours à vélo
      fonctionnent d’avril à octobre.
    around: >-
      À dix-neuf kilomètres s’étend le [parc national de Hortobágy - la puszta
      hongroise](/lugar/hortobagyi-nemzeti-park---puszta/). Plus loin, d’autres sites partagent steppes et
      outardes : le [parc national de Fertő-Hanság - steppe du
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) avec le busard cendré, la [réserve naturelle des
      pâturages de Veliki Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) et le [parc national de Kiskunság
      - steppes salines](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/) avec le faucon kobez.
  de:
    intro: >-
      Ende März in der ersten Morgendämmerung beginnen die Hähne der [Großtrappe](/especie/otis_tarda/) auf
      der Dévaványa-Ebene ihre spektakuläre Balz vor den Hennen. Die Balzzeit reicht bis Ende Mai; der
      Nationalpark empfiehlt die Beobachtung bei Sonnenaufgang oder in der Abenddämmerung vom Aussichtsturm
      des Réhelyi-Lehrpfads aus. Dies ist der größte und vielfältigste Teilbereich des
      Körös-Maros-Nationalparks: Salzsteppen, der Fluss Hortobágy-Berettyó, Ackerfluren und Gehölze zwischen
      Dévaványa, Ecsegfalva, Túrkeve und Gyomaendrőd. Das Gebiet steht seit 1975 unter Schutz und umfasst
      13.085 Hektar.
    landscape: >-
      Vor den Flussregulierungen speisten die Hochwässer von Theiß und Berettyó weite Feuchtgebiete am Rande
      des alten Nagy-Sárrét. Geblieben ist eine echte Puszta: Wermut-Salzsteppen auf trockeneren Erhebungen,
      vegetationslose Salzflecken und feuchte Salzwiesen in den Senken. In den Resten alter Salz-Eichenwälder
      gedeihen beachtliche Bestände der geschützten Pflanzenarten *Peucedanum officinale* und *Aster
      sedifolius*.


      Der Fluss ist die zweite Hauptattraktion. Sein 33 Kilometer langer Abschnitt im Schutzgebiet bewahrt
      weite Mäander, die nach den historischen Regulierungen in Ungarn selten geworden sind. In ruhigen
      Altarmen wachsen dichte Bestände geschützter Wasserpflanzen wie *Salvinia natans*, *Nymphoides peltata*
      und *Trapa natans*, gesäumt von Schilfröhrichten und Mähwiesen.


      Die Puszta wechselt im Jahreslauf ihr Gesicht: weiße und gelbe Blüten im Frühling, gelbe Sommersteppen
      und lilafarbene Asternteppiche im Herbst.
    wildlife: >-
      Die Großtrappe dominiert diese Weite. Mit über fünfhundert Individuen stellt die Population von
      Dévaványa ein Drittel des ungarischen Gesamtbestands und wuchs in den letzten zehn Jahren stetig. Sie
      brütet auf Salzwiesen und in Luzerne- oder Getreidefeldern. Davon profitieren auch
      [Wiesenweihe](/especie/circus_pygargus/), [Triel](/especie/burhinus_oedicnemus/), Rebhuhn und
      Sumpfohreule.


      Ab Anfang April ertönt in den Gräben der Ruf der Rotbauchunke. Auf den Weiden nisten Feldlerchen,
      Kiebitze und Uferschnepfen. Das Umland ist wichtiges Jagdgebiet zweier weltweit bedrohter
      Greifvogelarten: [Kaiseradler](/especie/aquila_heliaca/) und [Würgfalke](/especie/falco_cherrug/).


      Im Wäldchen Farkas-zug besteht eine Reiherkolonie mit [Graureiher](/especie/ardea_cinerea/) und
      [Nachtreiher](/especie/nycticorax_nycticorax/), ergänzt durch [Seidenreiher](/especie/egretta_garzetta/)
      und Rallenreiher. Im Fluss leben geschützte Fischarten wie der Bitterling (*Rhodeus amarus*), der seine
      Eier in Teichmuscheln ablegt. Auch der [Fischotter](/especie/lutra_lutra/) ist streng geschützt.
      Insgesamt wurden im Park rund zwei Drittel aller in Ungarn nachgewiesenen Vogelarten erfasst.
    visit: >-
      Erster Anlaufpunkt ist das Sterbetz-István-Besucherzentrum mit Ausstellungen zur Dévaványa-Puszta und
      zum Trappenschutz. Dort beginnt der Réhelyi-Lehrpfad über 1,7 Kilometer, der in einer Stunde begangen
      werden kann und an Volieren mit pflegebedürftigen Trappen vorbeiführt—so lässt sich der schwerste
      flugfähige Vogel Europas aus nächster Nähe betrachten. Fünf Stationen informieren über verlandete
      Kanäle, Steppenlebensräume, Trappenbiologie, seltene Pflanzen und ein künstliches Stillgewässer. Vom
      Aussichtsturm überblickst du einen der bedeutendsten Balzplätze Mitteleuropas. Im Außengelände weiden
      Ungarisches Steppenrind, Wasserbüffel, Zackelschafe und Wollschweine.


      Für Radtouren durch die Ebene gibt es fünf markierte Routen, empfohlen vom 1. April bis zum 30. Oktober;
      Leihräder stehen im Zentrum bereit. Die Runde Gabonás-Szilasok misst zwanzig Kilometer;
      Atyaszeg-Csordajárás-Dévaványa führt über siebzehn Kilometer am Schutzbereich entlang;
      Kérsziget-Berettyó-Ecsegfalva verläuft über fünfzehn Kilometer entlang des Flussdeichs. Die längste
      Strecke Bala-Berettyó-Halastavak umfasst achtundvierzig Kilometer mit einer Variante von dreiundvierzig.
    history: >-
      Der Ördögárok (Teufelsgraben) gehört zu einer befestigten Wallanlage, die von den Sarmaten zwischen den
      Jahren 330 und 350 errichtet wurde. In der Neuzeit konzentriert sich der Schutz auf die Großtrappe: Die
      Rettungsstation von Dévaványa nimmt gefährdete Gelege aus ganz Ungarn auf, erbrütet sie und wildert die
      Jungvögel wieder aus.
    before: >-
      Die Kernzonen östlich des Beobachtungsturms dürfen nur mit Genehmigung oder fachkundiger Führung
      betreten werden, um die Ruhe der Trappenbruten nicht zu stören. Für die Balzbeobachtung empfiehlt sich
      die Zeit von Ende März bis Ende Mai in den frühen Morgen- oder späten Abendstunden; Radrouten sind von
      April bis Oktober befahrbar.
    around: >-
      Neunzehn Kilometer entfernt liegt der [Hortobágy-Nationalpark - Die ungarische
      Puszta](/lugar/hortobagyi-nemzeti-park---puszta/). Weitere Steppengebiete mit Trappenvorkommen im Atlas
      sind der [Nationalpark Fertő-Hanság - Hanság-Steppe](/lugar/ferto-hansag-nemzeti-park---hansag/) mit
      Wiesenweihen, das [Sondernaturreservat Veliki-Rit-Weiden](/lugar/specijalni-rezervat-prirode-pasnjaci/)
      sowie der [Kiskunság-Nationalpark - Salzsteppen](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/) mit
      Rotfußfalken.
  it:
    intro: >-
      A fine marzo, alle prime luci dell’alba, i maschi di [otarda comune](/especie/otis_tarda/) danno inizio
      alle loro spettacolari parate nuziali nella pianura di Dévaványa. I corteggiamenti si protraggono fino a
      fine maggio; il parco suggerisce di ammirarli all’alba o al tramonto dalla torretta del sentiero
      Réhelyi. È il settore più vasto e diversificato del Parco Nazionale Körös-Maros: steppe salmastre, il
      fiume Hortobágy-Berettyó, coltivi e boscaglie tra Dévaványa, Ecsegfalva, Túrkeve e Gyomaendrőd.
      Istituito nel 1975, si estende su 13.085 ettari.
    landscape: >-
      Prima delle grandi bonifiche fluviali, le piene del Tibisco e del Berettyó alimentavano una vasta zona
      umida ai margini dell’antico Nagy-Sárrét. Ne resta una puszta intatta: steppe saline ad assenzio sui
      rilievi asciutti, chiazze salmastre prive di vegetazione e prati umidi allagati. Tra i lembi delle
      antiche querce su suolo salino prosperano consistenti colonie protette di *Peucedanum officinale* e
      *Aster sedifolius*.


      Il corso d’acqua è l’altro grande protagonista. Il suo tratto di 33 chilometri all’interno del parco
      mantiene anse tortuose originali, un tratto insolito in Ungheria dopo le rettificazioni idrauliche. Nei
      meandri quieti proliferano idrofite protette come *Salvinia natans*, *Nymphoides peltata* e *Trapa
      natans*, contornate da canneti e prati da sfalcio.


      La puszta muta cromie con le stagioni: fioriture bianche e dorate in primavera, steppe bionde d’estate e
      sfumature lilla in autunno.
    wildlife: >-
      L’otarda domina incontrastata questo territorio. Con oltre cinquecento individui, la colonia di
      Dévaványa racchiude un terzo dell’intera popolazione ungherese ed è cresciuta con regolarità in dieci
      anni. Nidifica nelle steppe e nei campi di erba medica e cereali, offrendo riparo ad altre specie:
      [l’albanella pirpignana](/especie/circus_pygargus/), [l’occhione](/especie/burhinus_oedicnemus/), la
      starna e il gufo di palude.


      Da inizio aprile risuona nei fossi il richiamo del maschio di ululone dal ventre rosso. Sui pascoli
      nidificano allodole, pavoncelle e pittime reali. Le campagne limitrofe sono territorio di caccia di due
      rapaci a rischio di estinzione: [l’aquila imperiale orientale](/especie/aquila_heliaca/) e il [falco
      sacro](/especie/falco_cherrug/).


      Nel bosco di Farkas-zug nidificano colonie di [airone cenerino](/especie/ardea_cinerea/) e
      [nitticora](/especie/nycticorax_nycticorax/), con coppie di [garzetta](/especie/egretta_garzetta/) e
      sgarza ciuffetto. Nel fiume vivono pesci protetti come il rodeo amaro (*Rhodeus amarus*), che depone le
      uova nei mitili di fiume. Anche la [lontra europea](/especie/lutra_lutra/) è rigorosamente tutelata. Nel
      parco sono state registrate quasi due terzi delle specie di uccelli note in Ungheria.
    visit: >-
      Il percorso comincia al centro visite Sterbetz István, dedicato alla natura della pianura di Dévaványa e
      alla tutela dell’otarda. Da qui parte il sentiero natura Réhelyi, lungo 1,7 chilometri e percorribile in
      un’ora, che costeggia voliere con esemplari in cura—permettendo di osservare da vicino l’uccello volante
      più pesante d’Europa. Cinque tappe didattiche illustrano i canali interriti, la vita della puszta
      salata, le parate dell’otarda, le stazioni di *Aster* e un invaso artificiale. Dalla torre
      d’avvistamento si domina uno dei principali siti di corteggiamento dell’Europa centrale. All’esterno
      pascolano animali rustici della tradizione magiara: bovini grigi, bufali d’acqua, pecore racka e maiali
      mangalica.


      Per pedalare nella pianura vi sono cinque percorsi ciclabili segnalati, consigliati dal 1 aprile al 30
      ottobre con noleggio biciclette presso il centro. L’anello Gabonás-Szilasok misura venti chilometri;
      Atyaszeg-Csordajárás-Dévaványa copre diciassette chilometri lungo la zona di quiete;
      Kérsziget-Berettyó-Ecsegfalva percorre quindici chilometri lungo gli argini. La variante più estesa,
      Bala-Berettyó-Halastavak, tocca quarantotto chilometri con una diramazione di quarantatré.
    history: >-
      L’Ördögárok (Fossa del Diavolo) fa parte di una complessa cinta di terrapieni e fossati difensivi eretti
      dai Sarmati tra gli anni 330 e 350. In epoca moderna la tutela si concentra sull’otarda: la stazione
      ornitologica di Dévaványa recupera le covate a rischio di tutto il paese per incubarle, allevarle e
      liberare i giovani in natura.
    before: >-
      Le riserve integrali a est della torretta sono accessibili unicamente con autorizzazione o accompagnati
      dal personale del parco, per garantire l’assoluta tranquillità delle otarde. Per assistere alle parate
      nuziali visita il sito tra fine marzo e fine maggio all’alba o al tramonto; gli itinerari cicloturistici
      sono praticabili da aprile a ottobre.
    around: >-
      A diciannove chilometri sorge il [Parco Nazionale di Hortobágy - La Puszta
      Ungherese](/lugar/hortobagyi-nemzeti-park---puszta/). Più lontano, altre aree condividono steppe e
      otarde: il [Parco Nazionale Fertő-Hanság - Steppa di Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/)
      con l’albanella pirpignana, la [Riserva Naturale Speciale Pascoli di Veliki
      Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) e il [Parco Nazionale Kiskunság - Steppe
      Salmastre](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/) con il falco grillaio.
  pt:
    intro: >-
      Em finais de março, logo às primeiras luzes do dia, os machos de [abetarda-comum](/especie/otis_tarda/)
      desfilam na planície de Dévaványa perante as fêmeas. A parada nupcial prolonga-se até finais de maio; o
      parque recomenda observá-la ao nascer ou ao pôr do sol a partir da torre do trilho Réhelyi. Este é o
      setor mais extenso e diversificado do Parque Nacional Körös-Maros: estepes salinas, o rio
      Hortobágy-Berettyó, campos agrícolas e soutos entre Dévaványa, Ecsegfalva, Túrkeve e Gyomaendrőd. Sob
      proteção desde 1975, abrange 13.085 hectares.
    landscape: >-
      Antes da regularização hidrográfica, as cheias do Tisza e do Berettyó alimentavam amplos pantanais no
      bordo do antigo Nagy-Sárrét. O que subsiste é uma autêntica puszta: estepe salina dominada por
      artemísias nos solos secos, clareiras salinas desprovidas de vegetação e prados salgados em depressões
      húmidas. Nos remanescentes do carvalhal salino desenvolvem-se povoamentos protegidos de *Peucedanum
      officinale* e *Aster sedifolius*.


      O rio é o outro elemento fundamental. O seu troço de 33 quilómetros no parque preserva meandros naturais
      intactos, uma raridade na Hungria após as canalizações históricas. Nos braços mortos abundam macrófitas
      aquáticas protegidas como *Salvinia natans*, *Nymphoides peltata* e *Trapa natans*, marginadas por
      caniçais e prados de feno.


      A puszta transforma as suas cores ao ritmo das estações: flores brancas e amarelas na primavera, tons
      dourados no verão e matizes lilases no outono.
    wildlife: >-
      A abetarda governa esta planura. Reunindo mais de quinhentos espécimes, a população de Dévaványa
      representa um terço do total húngaro e aumentou de forma sustentada em dez anos. Nidifica nas pastagens
      salinas e em searas de luzerna e cereais. Beneficiam também o
      [tartanhao-caçador](/especie/circus_pygargus/), o [alcaravão](/especie/burhinus_oedicnemus/), a
      perdiz-cinzenta e o bufo-pequeno.


      Desde o início de abril escuta-se nas valas o chamamento nupcial do bombina-de-barriga-vermelha. Nas
      pastagens nidificam lavercas, abibes e maçaricos-de-bico-direito. Os terrenos em redor constituem o
      território de caça de duas aves de rapina ameaçadas: a
      [águia-imperial-oriental](/especie/aquila_heliaca/) e o [falcão-sacre](/especie/falco_cherrug/).


      No bosque de Farkas-zug existe uma colónia de [garça-real](/especie/ardea_cinerea/) e
      [goraz](/especie/nycticorax_nycticorax/), com alguns casais de
      [garça-branca-pequena](/especie/egretta_garzetta/) e papa-ratos. O rio acolhe espécies piscícolas
      protegidas como o peixe-amargo (*Rhodeus amarus*), que desova no interior de mexilhões de água doce. A
      [lontra-europeia](/especie/lutra_lutra/) é espécie protegida. No total, o parque regista cerca de dois
      terços das espécies avifaunísticas recenseadas na Hungria.
    visit: >-
      Começa no centro de visitantes Sterbetz István, que documenta a paisagem de Dévaványa e as medidas de
      conservação da abetarda. Daí parte o percurso pedestre Réhelyi, de 1,7 quilómetros e percorrido numa
      hora, passando junto a viveiros com aves em reabilitação—permitindo admirar de perto a ave voadora mais
      pesada da Europa. Cinco paragens interpretativas explicam os canais assoreados, o ecossistema salino, o
      comportamento da abetarda, a flora rara e um lago artificial. Da torre avista-se um dos leks de abetarda
      mais notáveis da Europa Central. No exterior observam-se raças pecuárias tradicionais como bovinos
      cinzentos húngaros, búfalos, ovelhas racka e porcos mangalitza.


      Para explorar a estepe há cinco percursos cicláveis assinalados, recomendados de 1 de abril a 30 de
      outubro com aluguer de bicicletas no centro. O percurso Gabonás-Szilasok tem vinte quilómetros;
      Atyaszeg-Csordajárás-Dévaványa percorre dezassete quilómetros junto à reserva integral;
      Kérsziget-Berettyó-Ecsegfalva soma quinze quilómetros ao longo dos diques. A rota maior,
      Bala-Berettyó-Halastavak, alcança quarenta e oito quilómetros com variante de quarenta e três.
    history: >-
      O Ördögárok (Fosso do Diabo) integra um imenso complexo defensivo de muralhas e fossos de terra
      construído pelos sármatas entre os anos 330 e 350. Na época contemporânea, as atenções focam-se na
      conservação da abetarda: o centro de acolhimento de Dévaványa recolhe posturas em perigo de todo o país
      para as incubar, criar e devolver à natureza.
    before: >-
      As áreas de proteção integral a nascente da torre de observação só podem ser visitadas com autorização
      prévia ou na companhia de guias do parque, salvaguardando a tranquilidade dos ninhos. Para a época de
      paradas, programa a visita entre finais de março e finais de maio ao amanhecer ou ao crepúsculo; as
      rotas de bicicleta funcionam de abril a outubro.
    around: >-
      A dezanove quilómetros fica o [Parque Nacional de Hortobágy - A Puszta
      Húngara](/lugar/hortobagyi-nemzeti-park---puszta/). Mais distantes, outros pontos do atlas partilham
      habitats estepários e abetardas: o [Parque Nacional Fertő-Hanság - Estepe de
      Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) com tartanhão-caçador, a [Reserva Natural Especial
      das Pastagens de Veliki Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) e o [Parque Nacional
      Kiskunság - Estepes Salinas](/lugar/kiskunsagi-nemzeti-park---szikes-pusztak/) com o falcão-vespeiro.
