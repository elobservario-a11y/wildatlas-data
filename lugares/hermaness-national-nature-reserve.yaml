resumen:
  es: >-
    El promontorio más septentrional del Reino Unido (mirando al faro de Muckle Flugga), albergando la tercera
    mayor colonia de págalo grande (*skua*) del mundo.
  en: >-
    The northernmost headland of the United Kingdom (facing the Muckle Flugga lighthouse), hosting the world's
    third largest great skua colony.
  fr: >-
    Le promontoire le plus septentrional du Royaume-Uni (face au phare de Muckle Flugga), abritant la
    troisième colonie mondiale de grand labbe (*skua*).
  de: >-
    Die nördlichste Landspitze des Vereinigten Königreichs (mit Blick auf den Leuchtturm Muckle Flugga),
    Heimat der weltweit drittgrößten Kolonie der Großen Raubmöwe.
  it: >-
    Il promontorio più settentrionale del Regno Unito (affacciato sul faro di Muckle Flugga), sede della terza
    maggiore colonia al mondo di stercorario maggiore.
  pt: >-
    O promontório mais setentrional do Reino Unido (voltado para o farol de Muckle Flugga), abrigando a
    terceira maior colónia de moleiro-grande do mundo.
unico:
  es: >-
    En mayo la escila de primavera cubre de azul el pastizal costero, y a unos pasos los alcatraces cuelgan de
    los farallones.
  en: >-
    In May, spring squill blankets the coastal maritime grassland in vivid blue, while just paces away
    northern gannets cling to precipitous sea stacks.
  fr: >-
    En mai, la scille printanière drape les pelouses maritimes d'un bleu éclatant, tandis qu'à quelques pas
    les fous de Bassan s'agrippent aux récifs.
  de: >-
    Im Mai hüllt der Frühlings-Blaustern die Küstenweiden in leuchtendes Blau, während nur wenige Schritte
    entfernt Basstölpel an steilen Klippen nisten.
  it: >-
    A maggio la scilla di primavera tinge di blu i pascoli costieri, mentre a pochi passi le sule nidificano
    su vertiginosi faraglioni.
  pt: >-
    Em maio, a cila-da-primavera cobre os prados litorais de um azul vivo, enquanto a escassos passos os
    gansos-patola nidificam nas escarpas marinhas.
observaciones:
  es: >-
    Es un lugar expuesto, de acantilados y turbera sensible. Quédate en la pasarela y en los caminos, no te
    acerques a los bordes y comprueba con NatureScot el estado de los senderos antes de salir.
texto:
  es:
    intro: >-
      Más al norte de Hermaness solo quedan islotes. Es el extremo norte de Unst, la isla habitada más
      septentrional de Shetland: grandes acantilados al oeste, un páramo en el centro y, al fondo, los islotes
      de Muckle Flugga y Out Stack, con el faro. En unas 965 hectáreas caben más de 100.000 parejas de aves de
      15 especies, y el modo de recorrerlo es una pasarela de madera que cruza el páramo hasta el borde del
      mar.
    landscape: >-
      Hermaness son acantilados y páramo, y casi todo lo demás sale de ahí. La reserva abarca la península
      entera y los islotes de Muckle Flugga y Out Stack. En el centro, el páramo guarda una turbera extensa;
      en verano el brezal es una alfombra de brezo, camarina negra, arándano de pantano y musgos, y la hierba
      costera se llena de campanillas de primavera y siempreviva de mar. La pasarela existe por algo: protege
      la turbera, sensible a la erosión, y evita molestar a las aves que anidan.


      Muckle Flugga es una pequeña isla rocosa al norte de Unst, descrita a menudo como el punto más
      septentrional de las islas británicas, aunque el islote Out Stack está todavía más al norte. Su faro se
      automatizó en 1995, cuando se marcharon sus últimos habitantes.


      La leyenda local da otra versión del paisaje: dos gigantes, Herman y Saxa, se lanzaron rocas por una
      sirena, y de ahí vendrían los farallones que rodean el cabo.
    wildlife: >-
      Hermaness se vive por capas. Arriba, en el páramo, casi 1.000 [págalos
      grandes](/especie/stercorarius_skua/), los bonxies de Shetland, defienden su territorio, y de 3 a 9
      parejas de [colimbo chico](/especie/gavia_stellata/) crían en el páramo. La turbera interior es hábitat
      de limícolas reproductoras como el chorlito dorado, el correlimos común y la agachadiza.


      Abajo, en los acantilados, la escena es otra. Los [alcatraces](/especie/morus_bassanus/) anidan en
      repisas estrechas de cantiles y farallones: en 2018 había unas 26.000 parejas reproductoras. Entre
      20.000 y 30.000 parejas de [frailecillo](/especie/fratercula_arctica/) crían en madrigueras. Se contaron
      unas 3.700 parejas de [arao común](/especie/uria_aalge/) y 416 de [gaviota
      tridáctila](/especie/rissa_tridactyla/) en 2015, y los [cormoranes
      moñudos](/especie/phalacrocorax_aristotelis/) anidan en las playas de bloques de la costa oeste.


      La primavera trae fulmares, gaviotas, cormoranes moñudos, alcatraces, frailecillos y gaviotas
      tridáctilas. La mejor ventana para ver aves reproductoras va de mediados de mayo a mediados de julio. Al
      final del verano, en las costas rocosas, se ven [focas grises](/especie/halichoerus_grypus/). En el mar
      rondan la [marsopa común](/especie/phocoena_phocoena/), el [rorcual
      aliblanco](/especie/balaenoptera_acutorostrata/) y la [orca](/especie/orcinus_orca/), y alguna nutria se
      deja ver ocasionalmente.


      Entre 1972 y 1995, salvo en 1988 y 1989, Hermaness tuvo un visitante de lujo: un albatros de ceja negra,
      rarísimo en el hemisferio norte, apodado Albert.
    visit: >-
      Hay dos recorridos principales. El Saito Trail recorre siete kilómetros hasta los acantilados
      occidentales, con vistas de la colonia de alcatraces; la vuelta lleva unas tres horas. El Muckle Flugga
      Trail es una ruta circular de 7,7 km por el brezal, los acantilados y Hermaness Hill. La ruta completa
      por la reserva requiere entre tres y cuatro horas.


      Mantén a los perros con correa, sigue los caminos y respeta el borde de los acantilados.
    history: >-
      La protección empezó en 1831, cuando el propietario Lawrence Edmondston defendió los nidos de págalo
      grande de los coleccionistas de huevos: la población había caído a 3 parejas. En 1891 su familia
      contrató a un guarda y desde entonces los bonxies crecieron con fuerza; en 1906 asumió la vigilancia la
      RSPB. La reserva se declaró en 1955. Desde los años ochenta se cuentan las aves marinas de forma
      sistemática y cada seis años se hace un recuento de toda la reserva.


      La tierra sigue siendo privada, sobre todo de Buness Estate; NatureScot la gestiona. Hermaness es además
      SSSI y forma parte de la ZEPA Hermaness, Saxa Vord y Valla Field y del Área Escénica Nacional de
      Shetland.
    before: >-
      Es un lugar expuesto, de acantilados y turbera sensible. Quédate en la pasarela y en los caminos, no te
      acerques a los bordes y comprueba con NatureScot el estado de los senderos antes de salir.
    around: >-
      Hermaness comparte págalo grande y frailecillo con la [Reserva Natural de la Isla de
      Handa](/lugar/isle-of-handa/) y con [Fair Isle](/lugar/fair-isle/). Con la [Isla de Mykines (Islas
      Feroe)](/lugar/mykines/) y la [Reserva Natural de las
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) la une el alcatraz y el frailecillo.
  en:
    intro: >-
      North of Hermaness, only barren skerries remain. This is the northern tip of Unst, Shetland's
      northernmost inhabited isle: soaring sea cliffs to the west, an expanse of rolling moorland in the
      centre, and offshore, the rocky stacks of Muckle Flugga and Out Stack crowned by the lighthouse. Across
      some 965 hectares thrive more than 100,000 pairs of seabirds across 15 species, accessible via a timber
      boardwalk traversing the blanket bog all the way to the ocean edge.
    landscape: >-
      Hermaness is cliffs and blanket bog, and virtually everything else flows from that pairing. The reserve
      encompasses the entire peninsula along with the offshore islets of Muckle Flugga and Out Stack. In the
      centre, the moor shelters extensive peatlands; in summer the heath becomes a rich tapestry of heather,
      crowberry, bog bilberry, and mosses, while coastal grasslands fill with spring squill and sea pink. The
      wooden boardwalk serves a vital purpose: it shields fragile peat moss from erosion and avoids disturbing
      ground-nesting birds.


      Muckle Flugga is a jagged rocky islet off Unst, often described as the northernmost point of the British
      Isles, though Out Stack reef lies further north. Its lighthouse was automated in 1995 when the last
      keepers departed.


      Local lore explains the landscape differently: two giants, Herman and Saxa, hurled boulders at each
      other over a mermaid, forging the rugged sea stacks guarding the headland.
    wildlife: >-
      Hermaness reveals itself in layers. Up on the moorland, nearly 1,000 [great
      skuas](/especie/stercorarius_skua/), Shetland's fierce bonxies, defend their territory, while 3 to 9
      pairs of [red-throated divers](/especie/gavia_stellata/) breed on peat pools. The interior peatland also
      provides breeding habitat for waders such as golden plover, dunlin, and snipe.


      Down on the cliffs, the spectacle shifts. [Northern gannets](/especie/morus_bassanus/) nest crowded on
      narrow ledges and stacks: in 2018 there were around 26,000 breeding pairs. Between 20,000 and 30,000
      pairs of [puffins](/especie/fratercula_arctica/) burrow into turf slopes. Observers recorded some 3,700
      pairs of [common murres](/especie/uria_aalge/) and 416 pairs of [black-legged
      kittiwakes](/especie/rissa_tridactyla/) in 2015, while [European
      shags](/especie/phalacrocorax_aristotelis/) colonise boulder-strewn beaches on the west shore.


      Spring welcomes northern fulmars, gulls, shags, gannets, puffins, and kittiwakes. The peak window for
      breeding birds extends from mid-May to mid-July. By late summer, haul-outs of [grey
      seals](/especie/halichoerus_grypus/) appear along rocky shores. In the offshore waves, [harbour
      porpoises](/especie/phocoena_phocoena/), [minke whales](/especie/balaenoptera_acutorostrata/), and
      [killer whales](/especie/orcinus_orca/) are regularly spotted, alongside occasional otters hunting the
      shoreline.


      Between 1972 and 1995, except for 1988 and 1989, Hermaness hosted an extraordinary vagrant: a
      black-browed albatross, exceptionally rare in the northern hemisphere, nicknamed Albert.
    visit: >-
      There are two principal hiking routes. The Saito Trail covers seven kilometres to the western clifftops
      overlooking the gannetry; returning takes around three hours. The Muckle Flugga Trail is a 7.7 km
      circular loop across heathland, cliff edges, and Hermaness Hill. Walking the complete circuit through
      the reserve requires between three and four hours.


      Keep dogs on a short leash, stick to marked paths, and maintain a safe distance from cliff edges.
    history: >-
      Conservation began in 1831, when landowner Lawrence Edmondston stepped in to guard great skua nests
      against egg collectors after numbers collapsed to just 3 pairs. In 1891 his family employed a dedicated
      watcher, sparking a remarkable recovery for the bonxies; in 1906 the RSPB took over protection. The
      reserve was formally declared in 1955. Systematic seabird censuses have taken place since the eighties,
      with a comprehensive all-reserve count conducted every six years.


      The land remains privately held, primarily by the Buness Estate, and is managed by NatureScot. Hermaness
      is also designated a SSSI and forms part of the Hermaness, Saxa Vord and Valla Field SPA, as well as the
      Shetland National Scenic Area.
    before: >-
      This is an exposed maritime environment of precipitous cliffs and fragile peat bog. Stay on the
      boardwalk and designated trails, never approach cliff edges, and consult NatureScot for path updates
      before setting out.
    around: >-
      Hermaness shares great skua and puffin colonies with [Handa Island Nature
      Reserve](/lugar/isle-of-handa/) and with [Fair Isle](/lugar/fair-isle/). It is linked by northern
      gannets and puffins to [Mykines Island (Faroe Islands)](/lugar/mykines/) and [Sept-Îles Nature
      Reserve](/lugar/reserve-naturelle-des-sept-iles/).
  fr:
    intro: >-
      Plus au nord d'Hermaness, il n'y a plus que des écueils désolés. C'est l'extrémité septentrionale
      d'Unst, l'île habitée la plus septentrionale des Shetland : d'immenses falaises à l'ouest, une vaste
      lande au centre et, en arrière-plan, les récifs de Muckle Flugga et Out Stack couronnés par leur phare.
      Sur environ 965 hectares cohabitent plus de 100 000 couples d'oiseaux appartenant à 15 espèces,
      découverts grâce à un platelage en bois qui fend la tourbière jusqu'aux vagues.
    landscape: >-
      Hermaness se résume à ses falaises et à sa lande tourbeuse, d'où découle toute la vie insulaire. La
      réserve englobe l'ensemble de la péninsule ainsi que les îlots de Muckle Flugga et d'Out Stack. Au
      centre, la lande abrite une épaisse tourbière de couverture ; en été, la bruyère, la camarine noire, la
      canneberge des tourbières et les mousses forment un tapis végétal, tandis que l'herbe côtière s'illumine
      de scilles de printemps et d'œillets marins. La passerelle remplit un rôle essentiel : protéger la
      tourbière vulnérable au piétinement et éviter de déranger les nicheurs.


      Muckle Flugga est un récif escarpé au nord d'Unst, souvent qualifié de point le plus nordique des îles
      Britanniques, bien que l'îlot Out Stack s'avance encore plus au nord. Son phare a été automatisé en 1995
      avec le départ des derniers gardiens.


      La légende locale conte une autre naissance : deux géants, Herman et Saxa, se disputant une sirène, se
      seraient lancé d'immenses blocs de pierre, donnant naissance aux stacks déchiquetés bordant le cap.
    wildlife: >-
      Hermaness s'apprécie par étages. Sur la lande tourbeuse sommitale, près de 1 000 [grands
      labbes](/especie/stercorarius_skua/), les fameux bonxies des Shetland, veillent sur leur territoire,
      tandis que 3 à 9 couples de [plongeons catmarins](/especie/gavia_stellata/) nichent au bord des
      gouilles. La tourbière intérieure accueille des limicoles nicheurs comme le pluvier doré, le bécasseau
      variable et la bécassine des marais.


      Plus bas sur les falaises abruptes, le décor change du tout au tout. Les [fous de
      Bassan](/especie/morus_bassanus/) se pressent sur les corniches étroites des falaises et des pitons : en
      2018, on y recensait environ 26 000 couples reproducteurs. Entre 20 000 et 30 000 couples de [macareux
      moines](/especie/fratercula_arctica/) creusent leurs terriers dans les pentes herbeuses. On a dénombré
      environ 3 700 couples de [guillemots de Troïl](/especie/uria_aalge/) et 416 de [mouettes
      tridactyles](/especie/rissa_tridactyla/) en 2015, alors que les [cormorans
      huppés](/especie/phalacrocorax_aristotelis/) s'installent sur les plages d'éboulis de la côte ouest.


      Le printemps attire fulmars, goélands, cormorans huppés, fous, macareux et mouettes tridactyles. La
      meilleure période d'observation s'étend de la mi-mai à la mi-juillet. Vers la fin de l'été, des colonies
      de [phoques gris](/especie/halichoerus_grypus/) s'étirent sur les platiers rocheux. Au large
      patrouillent le [marsouin commun](/especie/phocoena_phocoena/), le [petit
      rorqual](/especie/balaenoptera_acutorostrata/) et l'[orque](/especie/orcinus_orca/), tandis qu'une
      loutre sillonne parfois l'estran.


      Entre 1972 et 1995, hormis en 1988 et 1989, Hermaness accueillit un hôte mythique : un albatros à
      sourcils noirs égaré dans l'hémisphère nord, surnommé affectueusement Albert.
    visit: >-
      Deux sentiers balisés permettent de découvrir la réserve. Le Saito Trail parcourt sept kilomètres
      jusqu'aux crêtes occidentales dominant la colonie de fous de Bassan ; l'aller-retour réclame environ
      trois heures. Le Muckle Flugga Trail forme une boucle de 7,7 km sillonnant la lande, le rebord des
      falaises et Hermaness Hill. Effectuer le grand tour de la réserve demande entre trois et quatre heures.


      Gardez vos chiens en laisse, demeurez impérativement sur les chemins et tenez-vous à bonne distance du
      vide.
    history: >-
      La préservation des lieux débuta en 1831, lorsque le propriétaire terrien Lawrence Edmondston protégea
      les pontes du grand labbe contre les pilleurs d'œufs, alors que la population était tombée à seulement 3
      couples. En 1891, sa famille engagea un garde assermenté et les effectifs de bonxies connurent un essor
      remarquable ; en 1906, la RSPB prit le relais de la surveillance. La réserve nationale fut proclamée en
      1955. Depuis les années quatre-vingt, des recensements marins systématiques sont menés, assortis d'un
      comptage exhaustif tous les six ans.


      Le domaine demeure privé, appartenant pour l'essentiel à Buness Estate, et se trouve géré par
      NatureScot. Hermaness est classé SSSI et s'intègre à la ZPS d'Hermaness, Saxa Vord et Valla Field ainsi
      qu'au site pittoresque national des Shetland.
    before: >-
      Le site est particulièrement exposé aux embruns, avec des falaises vertigineuses et une tourbière
      fragile. Restez sur le platelage et les sentiers aménagés, éloignez-vous des à-pics et consultez
      NatureScot pour connaître l'état des pistes avant de partir.
    around: >-
      Hermaness partage ses labbes et ses macareux avec la [Réserve naturelle de l'île de
      Handa](/lugar/isle-of-handa/) et avec [Fair Isle](/lugar/fair-isle/). La présence de fous de Bassan et
      de macareux la rapproche aussi de l'[Île de Mykines (Îles Féroé)](/lugar/mykines/) et de la [Réserve
      naturelle des Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/).
  de:
    intro: >-
      Nördlich von Hermaness ragen nur noch einsame Felsriffe aus dem Meer. Es ist die Nordspitze von Unst,
      der nördlichsten bewohnten Insel der Shetlands: gewaltige Kliffs im Westen, weite Heidemoorflächen im
      Zentrum und davor die von einem Leuchtturm gekrönten Schären Muckle Flugga und Out Stack. Auf etwa 965
      Hektar nisten mehr als 100.000 Vogelpaare aus 15 Arten, die du auf einem Holzsteg über das Moor bis zum
      Meeresrand erwandern kannst.
    landscape: >-
      Hermaness besteht aus Kliffs und Moorheiden, aus denen sich die gesamte Lebensvielfalt speist. Das
      Reservat umfasst die gesamte Halbinsel sowie die Schären Muckle Flugga und Out Stack. Im Inneren birgt
      die Hochebene ein ausgedehntes Deckenmoor; im Sommer überzieht ein Teppich aus Besenheide, Krähenbeere,
      Rauschbeere und Moosen das Land, während die Küstentrift von Frühlings-Blaustern und Grasnelken erblüht.
      Der Bohlenweg hat seinen Grund: Er bewahrt das trittempfindliche Torfmoos vor Erosion und schützt
      bodenbrütende Vögel.


      Muckle Flugga ist ein schroffes Felseiland nördlich von Unst, das oft als nördlichster Punkt der
      Britischen Inseln gilt, obgleich die Schäre Out Stack noch weiter im Norden liegt. Der Leuchtturm wurde
      1995 automatisiert, als die letzten Wärter das Eiland verließen.


      Die lokale Sage deutet die Landschaft auf ihre Weise: Zwei Riesen, Herman und Saxa, bewarfen sich im
      Streit um eine Meerjungfrau mit Felsbrocken, wodurch die zerrissenen Brandungspfeiler vor dem Kap
      entstanden.
    wildlife: >-
      Hermaness eröffnet sich in Schichten. Oben auf der Hochmoorheide verteidigen fast 1.000 [Große
      Raubmöwen](/especie/stercorarius_skua/), Shetlands legendäre Bonxies, ihr Revier, während 3 bis 9 Paare
      des [Sterntauchers](/especie/gavia_stellata/) an den Moortümpeln brüten. Das Binnenmoor bietet
      Brutlebensraum für Watvögel wie Goldregenpfeifer, Alpenstrandläufer und Bekassine.


      Unten an den Klippen bietet sich ein völlig anderes Schauspiel. [Basstölpel](/especie/morus_bassanus/)
      nisten dicht gedrängt auf schmalen Gesimsen und Felstürmen: 2018 zählte man rund 26.000 Brutpaare.
      Zwischen 20.000 und 30.000 Paare von [Papageitauchern](/especie/fratercula_arctica/) graben Bruthöhlen
      in die Grasnarbe. Im Jahr 2015 wurden etwa 3.700 Paare der [Trottellumme](/especie/uria_aalge/) und 416
      Paare der [Dreizehenmöwe](/especie/rissa_tridactyla/) erfasst, während
      [Krähenscharben](/especie/phalacrocorax_aristotelis/) an den Blockstränden der Westküste brüten.


      Der Frühling lockt Eissturmvögel, Möwen, Krähenscharben, Tölpel, Papageitaucher und Dreizehenmöwen an.
      Die beste Beobachtungszeit liegt zwischen Mitte Mai und Mitte Juli. Gegen Spätsommer ruhen
      [Kegelrobben](/especie/halichoerus_grypus/) auf den flachen Felsriffen. Vor der Küste ziehen der
      [Gewöhnliche Schweinswal](/especie/phocoena_phocoena/), der
      [Minkwal](/especie/balaenoptera_acutorostrata/) und der [Schwertwal](/especie/orcinus_orca/) vorbei, und
      gelegentlich streift ein Fischotter am Ufer entlang.


      Zwischen 1972 und 1995 – mit Ausnahme von 1988 und 1989 – beherbergte Hermaness einen berühmten Irrgast:
      einen Schwarzbrauenalbatros, im Norden extrem selten, liebevoll Albert genannt.
    visit: >-
      Zwei Hauptwanderwege erschließen das Reservat. Der Saito Trail führt über sieben Kilometer zu den
      westlichen Klippen mit Panoramablick auf die Basstölpelkolonie; für den Hin- und Rückweg solltest du
      etwa drei Stunden einplanen. Der Muckle Flugga Trail ist ein 7,7 km langer Rundweg über Heideflächen,
      Klippenkanten und den Hermaness Hill. Die gesamte Umrundung des Schutzgebiets erfordert zwischen drei
      und vier Stunden.


      Führe Hunde an der kurzen Leine, bleibe stets auf den markierten Wegen und halte gebührenden Abstand zu
      den Abbruchkanten.
    history: >-
      Der Schutz begann 1831, als Gutsbesitzer Lawrence Edmondston die Nester der Großen Raubmöwe vor
      Eiersammlern verteidigte, nachdem der Bestand auf nur noch 3 Paare geschrumpft war. Im Jahr 1891 stellte
      seine Familie einen hauptamtlichen Hüter an, woraufhin sich die Bonxies kräftig erholten; 1906 übernahm
      die Vogelschutzorganisation RSPB die Aufsicht. Das Naturschutzgebiet wurde 1955 förmlich proklamiert.
      Seit den achtziger Jahren finden regelmäßige Seevogelzählungen statt, ergänzt durch eine Gesamterfassung
      des Reservats alle sechs Jahre.


      Das Land befindet sich nach wie vor in Privatbesitz, überwiegend der Buness Estate, und wird von
      NatureScot betreut. Hermaness ist als SSSI geschützt und gehört zum Vogelschutzgebiet Hermaness, Saxa
      Vord and Valla Field sowie zum National Scenic Area Shetland.
    before: >-
      Es handelt sich um ein exponiertes Küstengebiet mit schwindelerregenden Kliffs und empfindlichem
      Torfmoor. Bleibe auf dem Holzbohlenweg und den Pfaden, meide Kantenabbrüche und erkundige dich vorab bei
      NatureScot nach der Wegeverfassung.
    around: >-
      Hermaness teilt große Kolonien von Raubmöwen und Papageitauchern mit dem [Naturschutzgebiet Handa
      Island](/lugar/isle-of-handa/) und mit [Fair Isle](/lugar/fair-isle/). Durch Basstölpel und
      Papageitaucher verbindet es sich zudem mit der [Insel Mykines (Färöer)](/lugar/mykines/) und dem
      [Naturschutzgebiet Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/).
  it:
    intro: >-
      Più a nord di Hermaness rimangono solo isolotti spazzati dai marosi. È l'estremità settentrionale di
      Unst, l'isola abitata più a nord delle Shetland: imponenti scogliere a ovest, una brughiera al centro e,
      sullo sfondo, i faraglioni di Muckle Flugga e Out Stack sormontati dal faro. Su circa 965 ettari
      nidificano oltre 100.000 coppie di uccelli marini appartenenti a 15 specie, che puoi ammirare
      percorrendo una passerella in legno attraverso la torbiera sino alla scogliera.
    landscape: >-
      Hermaness è una combinazione di scogliere e torbiera di brughiera, da cui discende ogni aspetto vitale.
      La riserva tutela l'intera penisola e gli isolotti di Muckle Flugga e Out Stack. Al centro, la landa
      custodisce una vasta torbiera di copertura; in estate il brugo, l'empétro nero, il mirtillo di palude e
      i muschi formano un soffice tappeto, mentre le praterie costiere si riempiono di scille primaverili e
      spilloni marini. La passerella ha un ruolo preciso: protegge la delicata torba dall'erosione e impedisce
      di disturbare i nidiacei a terra.


      Muckle Flugga è un piccolo sperone roccioso a nord di Unst, sovente considerato il punto più
      settentrionale delle isole britanniche, sebbene l'isolotto Out Stack sorga ancora più a nord. Il suo
      faro è stato automatizzato nel 1995 con l'abbandono degli ultimi guardiani.


      Il mito locale offre una diversa spiegazione dell'orografia: due giganti, Herman e Saxa, si scagliarono
      massi giganteschi per contendersi una sirena, forgiando i faraglioni che cingono il promontorio.
    wildlife: >-
      Hermaness si svela a strati sovrapposti. In alto, sulle alture della brughiera, quasi 1.000 [stercorari
      maggiori](/especie/stercorarius_skua/), i bonxies delle Shetland, difendono strenuamente il territorio,
      e da 3 a 9 coppie di [strolaghe minori](/especie/gavia_stellata/) nidificano negli specchi d'acqua della
      torbiera. Il suolo torboso interno ospita anche limicoli nidificanti come piviere dorato, piovanello
      pancianera e beccaccino.


      In basso, sulle falesie vertiginose, l'atmosfera muta completamente. Le [sule](/especie/morus_bassanus/)
      si addensano su strette cenge rocciose e faraglioni: nel 2018 si contavano circa 26.000 coppie
      riproduttive. Tra 20.000 e 30.000 coppie di [pulcinelle di mare](/especie/fratercula_arctica/) scavano
      nidi nei pendii erbosi. Nel 2015 sono state censite circa 3.700 coppie di [urie](/especie/uria_aalge/) e
      416 coppie di [gabbiani tridattili](/especie/rissa_tridactyla/), mentre i [marangoni dal
      ciuffo](/especie/phalacrocorax_aristotelis/) occupano le spiagge ciottolose della costa occidentale.


      La primavera richiama fulmari, gabbiani, cormorani, sule, pulcinelle e gabbiani tridattili. La migliore
      finestra temporale per le nidificazioni va da metà maggio a metà luglio. A fine estate le [foche
      grigie](/especie/halichoerus_grypus/) si adagiano sulle secche rocciose. Al largo nuotano la [focena
      comune](/especie/phocoena_phocoena/), la [balenottera minore](/especie/balaenoptera_acutorostrata/) e
      l'[orca](/especie/orcinus_orca/), con qualche lontra che perlustra sporadicamente la costa.


      Tra il 1972 e il 1995, salvo nel 1988 e nel 1989, Hermaness accolse un celebre visitatore: un albatro
      sopraccigliocorno, evento rarissimo nell'emisfero boreale, battezzato Albert.
    visit: >-
      La riserva propone due sentieri principali. Il Saito Trail si snoda per sette chilometri fino alle
      falesie occidentali affacciate sulla colonia di sule; il tragitto di andata e ritorno richiede circa tre
      ore. Il Muckle Flugga Trail è un tracciato ad anello di 7,7 km che attraversa la brughiera, il ciglio
      dei dirupi e Hermaness Hill. Il giro completo della riserva impegna tra tre e quattro ore.


      Tieni i cani al guinzaglio, cammina sui sentieri battuti e rispetta rigorosamente i margini dei
      precipizi.
    history: >-
      La salvaguardia del sito risale al 1831, quando il proprietario terriero Lawrence Edmondston intervenne
      per proteggere i nidi di stercorario maggiore dai raccoglitori di uova: la colonia era crollata a sole 3
      coppie. Nel 1891 i suoi eredi assunsero un guardiano dedicato e i bonxies prosperarono; nel 1906 la
      protezione passò alla RSPB. La riserva è stata istituita ufficialmente nel 1955. Dagli anni ottanta gli
      uccelli marini vengono censiti con cadenza sistematica, con un conteggio esaustivo ogni sei anni.


      Il terreno appartiene a privati, in massima parte alla Buness Estate, ed è gestito da NatureScot.
      Hermaness è classificato come SSSI e rientra nella ZPS di Hermaness, Saxa Vord e Valla Field nonché
      nella Shetland National Scenic Area.
    before: >-
      È un ambiente oceanico spoglio e impervio, caratterizzato da falesie a picco e torba delicata. Rimani
      sulla passerella e sui sentieri, allontanati dai cigli franosi e verifica lo stato dei percorsi con
      NatureScot prima di incamminarti.
    around: >-
      Hermaness condivide popolazioni di stercorario maggiore e pulcinella di mare con la [Riserva naturale
      dell'isola di Handa](/lugar/isle-of-handa/) e con [Fair Isle](/lugar/fair-isle/). La presenza di sule e
      pulcinelle la unisce inoltre all'[Isola di Mykines (Isole Fær Øer)](/lugar/mykines/) e alla [Riserva
      naturale delle Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/).
  pt:
    intro: >-
      Mais a norte de Hermaness restam apenas ilhéus desolados. É o extremo norte de Unst, a ilha habitada
      mais setentrional das Shetland: imponentes falésias a ocidente, uma vasta charneca no centro e, ao
      fundo, os penedos de Muckle Flugga e Out Stack coroados pelo farol. Em cerca de 965 hectares
      concentram-se mais de 100.000 casais de aves de 15 espécies, percorridos através de um passadiço de
      madeira que atravessa a turfeira até à beira-mar.
    landscape: >-
      Hermaness vive da simbiose entre as suas escarpas e a charneca turfosa, de onde brota quase toda a vida
      circundante. A reserva abrange a península inteira e os ilhéus de Muckle Flugga e Out Stack. No centro,
      o planalto resguarda uma densa turfeira de cobertura; no verão a charneca é um manto de urze,
      camarinha-negra, arando-dos-pauis e musgos, ao passo que as relvas costeiras se enchem de
      cila-da-primavera e relva-do-olimpo. O passadiço de madeira tem uma razão evidente: resguarda a turfa
      vulnerável à erosão e evita perturbar as aves que nidificam no solo.


      Muckle Flugga é um rochedo escarpado a norte de Unst, frequentemente descrito como o ponto mais a norte
      das ilhas britânicas, ainda que o recife de Out Stack se localize ligeiramente mais a norte. O seu farol
      foi automatizado em 1995, ano em que partiram os últimos faroleiros.


      A lenda local oferece outra perspetiva: dois gigantes, Herman e Saxa, atiraram penedos enormes um ao
      outro por causa de uma sereia, talhando os farilhões que rodeiam o cabo.
    wildlife: >-
      Hermaness observa-se por níveis. No cimo da charneca, quase 1.000
      [moleiros-grandes](/especie/stercorarius_skua/), os afamados bonxies das Shetland, defendem o seu
      território com ardor, e entre 3 e 9 casais de [mobelhas-pequenas](/especie/gavia_stellata/) nidificam
      nas lagoas da turfeira. A turfeira interior acolhe limícolas reprodutoras como a tarambola-dourada, o
      pilrito-comum e a narceja-comum.


      Em baixo, junto aos penhascos vertiginosos, o cenário muda por completo. Os
      [gansos-patola](/especie/morus_bassanus/) amontoam-se em pequenas saliências de rocha e farilhões: em
      2018 existiam cerca de 26.000 casais reprodutores. Entre 20.000 e 30.000 casais de
      [fradinhos](/especie/fratercula_arctica/) escavam tocas nas encostas verdejantes. Contaram-se cerca de
      3.700 casais de [airos](/especie/uria_aalge/) e 416 de
      [gaivotas-tridáctilas](/especie/rissa_tridactyla/) em 2015, enquanto os
      [corvos-marinhos-de-crista](/especie/phalacrocorax_aristotelis/) colonizam as praias pedregosas da costa
      ocidental.


      A primavera atrai fulmares, gaivotas, corvos-marinhos, gansos-patola, papagaios-do-mar e
      gaivotas-tridáctilas. A melhor época para avistar aves reprodutoras estende-se de meados de maio a
      meados de julho. No final do verão surgem [focas-cinzentas](/especie/halichoerus_grypus/) a descansar
      nas lajes costeiras. No mar patrulham a [toninha-comum](/especie/phocoena_phocoena/), a
      [baleia-de-minke](/especie/balaenoptera_acutorostrata/) e a [orca](/especie/orcinus_orca/), surgindo por
      vezes alguma lontra ao longo da rebentação.


      Entre 1972 e 1995, com exceção de 1988 e 1989, Hermaness recebeu um visitante de exceção: um
      albatroz-de-sobrancelha, raríssimo no hemisfério norte, a quem chamaram carinhosamente Albert.
    visit: >-
      Existem dois percursos pedestres principais. O Saito Trail estende-se por sete quilómetros até aos
      penhascos ocidentais, com vistas para a colónia de gansos-patola; a ida e volta demora cerca de três
      horas. O Muckle Flugga Trail é um circuito circular com 7,7 km através da charneca, das cristas das
      escarpas e de Hermaness Hill. A caminhada integral pela reserva demora entre três e quatro horas.


      Mantém os cães com trela curta, segue sempre os trilhos traçados e guarda distância prudente das
      vertentes abismais.
    history: >-
      A proteção da área começou em 1831, quando o proprietário Lawrence Edmondston defendeu os ninhos de
      moleiro-grande dos apanhadores de ovos: o efetivo tinha caído para meros 3 casais. Em 1891 a sua família
      contratou um guarda permanente e os bonxies multiplicaram-se de forma consistente; em 1906 a RSPB
      assumiu a tutela da vigilância. A reserva foi formalmente classificada em 1955. Desde a década de
      oitenta contam-se as aves marinhas com método rigoroso, realizando-se um censo exaustivo de seis em seis
      anos.


      A propriedade mantém-se privada, em grande parte sob a posse da Buness Estate, sendo gerida pela
      NatureScot. Hermaness está classificada como SSSI e integra a ZEPA de Hermaness, Saxa Vord e Valla
      Field, bem como a Área Cénica Nacional das Shetland.
    before: >-
      É um meio costeiro rigoroso e exposto, repleto de escarpas verticais e turfa sensível. Permanece no
      passadiço e nos caminhos autorizados, nunca te aproximes dos despenhadeiros e confirma o estado dos
      percursos junto da NatureScot antes da visita.
    around: >-
      Hermaness partilha colónias de moleiro-grande e de fradinho com a [Reserva Natural da Ilha de
      Handa](/lugar/isle-of-handa/) e com [Fair Isle](/lugar/fair-isle/). Pela presença de gansos-patola e
      fradinhos está também ligada à [Ilha de Mykines (Ilhas Faroé)](/lugar/mykines/) e à [Reserva Natural das
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/).
