resumen:
  es: >-
    Uno de los hayedos continuos más extensos de Bélgica, protegiendo las cabeceras fluviales del macizo
    ardenés.
  en: >-
    One of the most extensive contiguous beech forests in Belgium, safeguarding the headwater rivers of the
    Ardennes massif.
  fr: >-
    L'une des plus vastes hêtraies d'un seul tenant de Belgique, protégeant les têtes de bassin du massif
    ardennais.
  de: >-
    Einer der weitläufigsten zusammenhängenden Buchenwälder Belgiens, der die Quellflüsse des Ardennenmassivs
    schützt.
  it: >-
    Una delle faggete continue più vaste del Belgio, a protezione delle sorgenti fluviali del massiccio delle
    Ardenne.
  pt: Um dos mais vastos favais contínuos da Bélgica, protegendo as cabeceiras fluviais do maciço das Ardenas.
unico:
  es: >-
    El mayor bosque de frondosas sin cortes de Bélgica, con una cigüeña negra como emblema que anida en sus
    robles.
  en: >-
    Belgium's largest unbroken deciduous woodland, with the black stork as its emblem nesting in the ancient
    oaks.
  fr: >-
    Le plus grand massif feuillu ininterrompu de Belgique, ayant pour emblème la cigogne noire qui niche dans
    ses chênes.
  de: >-
    Das größte unzerschnittene Laubwaldgebiet Belgiens mit dem Schwarzstorch als Wappentier, der in den
    Eichenkronen nistet.
  it: >-
    Il più grande comprensorio boschivo di latifoglie compatto del Belgio, con la cicogna nera eletta a
    simbolo nidificante sulle querce.
  pt: >-
    O maior maciço de folhosas contínuo da Bélgica, ostentando a cegonha-preta como emblema nidificante nos
    seus carvalhais.
