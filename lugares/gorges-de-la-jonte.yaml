unico:
  es: >-
    Un cañón de caliza donde cuatro especies de buitres vuelan libres: tres reintroducidas por personas y una,
    el alimoche, que regresó sola.
  en: >-
    A limestone gorge where four European vulture species soar free: three successfully reintroduced and one,
    the Egyptian vulture, that returned on its own.
  fr: >-
    Un défilé calcaire où volent en liberté les quatre vautours européens : trois réintroduits avec succès et
    le percnoptère revenu de lui-même.
  de: >-
    Ein Kalkstein-Canyon, in dem vier europäische Geierarten frei kreisen: drei erfolgreich wiedereingebürgert
    und der Schmutzgeier von selbst zurückgekehrt.
  it: >-
    Una forra calcarea dove volano libere quattro specie di avvoltoi: tre reintrodotte con successo e il
    capovaccaio tornato spontaneamente.
  pt: >-
    Uma garganta calcária onde quatro espécies de abutres voam livres: três reintroduzidas com êxito e o
    abutre-do-egito regressado espontaneamente.
observaciones:
  es: >-
    El parque desaconseja el sendero de las Corniches a personas con vértigo, por el paso junto a las
    cornisas. Lleva agua y calzado firme, adapta el equipo a la meteorología y cierra las puertas y cercas
    tras el paso. La Maison des Vautours es el mejor lugar para quien no camine tanto.
texto:
  es:
    intro: >-
      A finales de los años cuarenta desaparecieron de Francia los últimos buitres leonados, sobre todo por el
      veneno y la caza. Hoy los ves planear sobre un cañón de caliza donde los buitres están presentes desde
      hace al menos 70.000 años. Las gargantas del Jonte, entre el causse Méjean y el causse Noir, son la cuna
      del primer programa de reintroducción de buitres leonados que salió bien, y desde entonces han ido
      llegando otras tres especies.
    landscape: >-
      El Jonte nace a 1440 m en el macizo del Aigoual y se echa al Tarn en el pueblo de Le Rozier. Entre
      medias talla un auténtico cañón, parecido al del Tarn pero algo menos profundo, entre 300 y 450 metros,
      y menos largo, unos 20 km. Lo flanquean al norte el causse Méjean y al sur el causse Noir.


      Casi todo es caliza del Dogger, salvo lo alto de las laderas, que es del Jurásico superior. Los
      acantilados de dolomía de Capluc protegen una ladera sur donde crece vegetación mediterránea: fresno
      mediterráneo, jazmín, arce de Montpellier y encina. Y el agua tiene una rareza: parte del río es
      subterránea. Se hunde a 3 km de Meyrueis y reaparece 7 km después en la surgencia de Les Douze; entre
      ambos puntos el lecho está seco, salvo en las grandes crecidas. El Jonte es un río cevenol, y tras una
      tormenta sus crecidas pueden ser violentas.
    wildlife: >-
      Los cuatro buitres tienen historia propia. El [buitre leonado](/especie/gyps_fulvus/) vive en colonias y
      cría en los acantilados: en 2017 se contaron casi 600 parejas en el territorio de los Grands Causses. El
      [buitre negro](/especie/aegypius_monachus/), la mayor rapaz de Europa, tiene unos 2,80 m de envergadura
      y cría en los árboles. El [alimoche](/especie/neophron_percnopterus/) es el único migratorio: volvió a
      Lozère por sus propios medios en 1986 y pasa el invierno en el África subsahariana. El
      [quebrantahuesos](/especie/gypaetus_barbatus/) llegó en junio de 2012 y se alimenta sobre todo de
      huesos; su envergadura va de 2,45 a 2,85 m.


      Con suerte también se ven otras aves, sobre todo carroñeras: cuervo grande, milanos, águilas, halcones y
      culebreras. Los buitres vuelan libres y se alejan a menudo hasta 150 km de los Causses; algunos han
      llegado a Senegal y a los Países Bajos, y los quebrantahuesos llevan balizas GPS. La temporada va de
      mayo a octubre.
    visit: >-
      La ruta circular de las Corniches du Méjean enlaza las gargantas del Jonte y del Tarn. Mide 11,5 km,
      lleva unas cuatro horas y media y tiene una dificultad media. Sale de la plaza del ayuntamiento de Le
      Rozier, sube por escaleras hasta tomar el GR6 y pasa por Capluc y por las cornisas. Desde el Balcon du
      Vertige el sendero domina el cauce del Jonte a casi 400 m de altura, y las formaciones de Vase de Chine
      y Vase de Sèvres marcan el paso. Hay muchas más rutas desde Le Rozier o desde el causse Méjean que
      dominan las gargantas.


      Para entender a los buitres, la Maison des Vautours, antes Belvédère des Vautours, está en
      Saint-Pierre-des-Tripiers, entre Le Truel y Le Rozier. Su terraza tiene varios telescopios y animadores
      que ayudan a ver las aves, que viven en total libertad. Desde 1998 hay tres cámaras móviles que siguen
      los vuelos, las voladeras y un nido en primer plano.
    history: >-
      Los buitres convivieron en paz con la gente hasta mediados del siglo XIX. En 1970, la LPO y el Parque
      Nacional de las Cévennes intentaron reintroducir el buitre leonado en las gargantas con cuatro
      ejemplares de origen español. Entre 1981 y 1986 se soltaron unos sesenta criados en cautividad, una
      primicia mundial. Los buitres negros se reintrodujeron entre 1992 y 2004; los quebrantahuesos, de 2012 a
      2021.


      Desde 1998 los ganaderos pueden tener sus propios puntos de alimentación para buitres: unos 130 en 2020
      en los Causses y alrededores. El sitio de Capluc, además, tuvo función defensiva y de observación
      gracias a un castillo que ya ha desaparecido. Las gargantas están en el límite del Parque Nacional de
      las Cévennes y del Parque Natural Regional de los Grands Causses.
    before: >-
      El parque desaconseja el sendero de las Corniches a personas con vértigo, por el paso junto a las
      cornisas. Lleva agua y calzado firme, adapta el equipo a la meteorología y cierra las puertas y cercas
      tras el paso. La Maison des Vautours es el mejor lugar para quien no camine tanto.
    around: >-
      Las gargantas lindan con el [Parque Nacional de las Cevenas](/lugar/parc-national-des-cevennes/). Lejos
      de allí, el [Parque Natural Regional del Verdon - Grandes
      Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/), el [Parque Natural de Els
      Ports](/lugar/parc-natural-dels-ports/), el [Parque Nacional de
      Monfragüe](/lugar/parque-nacional-de-monfrague/) y el [Parque Nacional Forestal de
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/) comparten buitre negro,
      alimoche y buitre leonado.
  en:
    intro: >-
      By the late nineteen-forties, the last griffon vultures had vanished from mainland France, eradicated by
      poisoned bait and shooting. Today you can watch them ride thermal updrafts over a limestone canyon where
      vultures have nested continuously for at least 70,000 years. The Jonte Gorges, slicing between Causse
      Méjean and Causse Noir, are the birthplace of the world’s first successful griffon vulture
      reintroduction project, paving the way for three other species.
    landscape: >-
      The Jonte rises at 1440 m on Mont Aigoual and joins the Tarn at the village of Le Rozier. Along its
      route it carves an authentic canyon, akin to the Tarn Gorges but somewhat shallower, dropping between
      300 and 450 metres, and slightly shorter, spanning roughly 20 km. It is flanked to the north by Causse
      Méjean and to the south by Causse Noir.


      The cliffs belong almost entirely to Dogger limestone, capped along the highest rim by Upper Jurassic
      strata. The towering dolomite cliffs of Capluc shelter a south-facing slope hosting Mediterranean
      vegetation: flowering ash, wild jasmine, Montpellier maple, and evergreen oak. The hydrology exhibits a
      peculiar phenomenon: the river goes subterranean, sinking underground 3 km below Meyrueis and
      resurfacing 7 km downstream at the Les Douze resurgence; between these points the bed remains bone-dry
      except during catastrophic Cévenol flash floods.
    wildlife: >-
      The four vulture species each possess their own history. The colonial [griffon
      vulture](/especie/gyps_fulvus/) nests in cliff hollows: in 2017 observers counted nearly 600 breeding
      pairs across the Grands Causses. The [cinereous vulture](/especie/aegypius_monachus/), Europe’s largest
      raptor with a wingspan around 2.80 m, builds its nests in tree crowns. The [Egyptian
      vulture](/especie/neophron_percnopterus/) is strictly migratory, recolonizing Lozère naturally in 1986
      to spend summers here before migrating to sub-Saharan Africa. The [bearded
      vulture](/especie/gypaetus_barbatus/) was reintroduced in June 2012, feeding exclusively on bones with a
      wingspan reaching from 2.45 to 2.85 m.


      Other scavengers frequently seen include common ravens, red and black kites, eagles, falcons, and
      short-toed snake eagles. These vultures range freely across southern France, foraging up to 150 km from
      the Causses; tracked birds have reached Senegal and the Netherlands via GPS telemetry. The prime
      watching season runs from May to October.
    visit: >-
      The circular Corniches du Méjean trail links the Jonte and Tarn gorges. Spanning 11.5 km and taking
      around four and a half hours, it offers a moderate trek. Departing from the town hall square in Le
      Rozier, it climbs via stone steps onto the GR6, skirting Capluc and traversing airy rock terraces. At
      the Balcon du Vertige, the path overhangs the riverbed almost 400 m below, highlighted by the iconic
      rock towers of Vase de Chine and Vase de Sèvres. Numerous alternative trails set out from Le Rozier or
      Causse Méjean.


      To learn about vulture ecology, visit the Maison des Vautours (formerly Belvédère des Vautours) at
      Saint-Pierre-des-Tripiers between Le Truel and Le Rozier. Its observation deck features high-powered
      telescopes and expert wildlife guides. Since 1998, three remotely operated cameras broadcast live
      footage of cliff ledges and active nests.
    history: >-
      Vultures and pastoralists coexisted harmoniously until the mid-XIX century. In 1970, the LPO and the
      Cévennes National Park launched a historic reintroduction programme using four Spanish griffon vultures.
      Between 1981 and 1986, roughly sixty captive-bred birds were released, marking a world first. Cinereous
      vultures were reintroduced between 1992 and 2004, followed by bearded vultures from 2012 to 2021.


      Since 1998, local farmers have maintained approved carcass feeding stations, numbering around 130 in
      2020 across the Causses. Capluc rock once supported a medieval watchtower. The gorges straddle the
      boundary between Cévennes National Park and Grands Causses Regional Natural Park.
    before: >-
      The national park advises against the Corniches trail for anyone suffering from vertigo due to exposed
      ledges. Carry sufficient water, wear sturdy hiking boots, adapt to changing mountain weather, and close
      pasture gates behind you. The Maison des Vautours offers the best alternative for non-hikers.
    around: >-
      The gorges border [Cévennes National Park](/lugar/parc-national-des-cevennes/). Further afield, [Verdon
      Regional Natural Park - Gorges](/lugar/parc-naturel-regional-du-verdon---gorges/), [Els Ports Natural
      Park](/lugar/parc-natural-dels-ports/), [Monfragüe National Park](/lugar/parque-nacional-de-monfrague/),
      and [Dadia-Lefkimi-Soufli Forest National
      Park](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/) also harbor cinereous, Egyptian, and
      griffon vultures.
  fr:
    intro: >-
      À la fin des années quarante, les derniers vautours fauves disparurent de France, victimes du poison et
      des tirs. Aujourd’hui, vous les voyez tournoyer au-dessus d’un canyon calcaire où les vautours
      prospèrent depuis au moins 70 000 ans. Les gorges de la Jonte, entaillant la roche entre le causse
      Méjean et le causse Noir, sont le berceau mondial du premier programme réussi de réintroduction du
      vautour fauve, rejoint depuis par trois autres espèces.
    landscape: >-
      La Jonte prend sa source à 1440 m sur le massif de l’Aigoual et se jette dans le Tarn au village du
      Rozier. Elle entaille un authentique canyon calcaire, semblable à celui du Tarn mais un peu moins
      profond, entre 300 et 450 mètres, et plus court, sur environ 20 km. Il est bordé au nord par le causse
      Méjean et au sud par le causse Noir.


      La roche appartient presque exclusivement au Dogger, surmonté sur les corniches par le Jurassique
      supérieur. Les falaises dolomitiques de Capluc abritent un versant sud à végétation méditerranéenne :
      frêne à fleurs, jasmin ligneux, érable de Montpellier et chêne vert. Le cours d’eau présente une
      curiosité hydrologique : une partie s’infiltre sous terre à 3 km de Meyrueis pour ne réapparaître que 7
      km plus bas à la résurgence des Douze ; entre les deux, le lit reste asséché hors épisodes cévenols
      majeurs.
    wildlife: >-
      Les quatre vautours possèdent leur propre épopée. Le [vautour fauve](/especie/gyps_fulvus/) niche en
      colonies sur les vires : en 2017, on comptait près de 600 couples reproducteurs sur les Grands Causses.
      Le [vautour moine](/especie/aegypius_monachus/), plus grand rapace d’Europe avec ses 2,80 m d’envergure,
      bâtit son nid dans les arbres. Le [percnoptère](/especie/neophron_percnopterus/) est le seul migrateur :
      revenu espontanément en Lozère en 1986, il hiverne en Afrique subsaharienne. Le [gypaète
      barbu](/especie/gypaetus_barbatus/) a été réintroduit en juin 2012 ; son envergure varie de 2,45 à 2,85
      m.


      On observe également le grand corbeau, les milans, aigles, faucons et circaètes. Les vautours parcourent
      de vastes espaces jusqu’à 150 km des causses, certains atteignant le Sénégal et les Pays-Bas. La saison
      idéale s’étend de mai à octobre.
    visit: >-
      La boucle des corniches du Méjean relie les gorges de la Jonte et celles du Tarn. Longue de 11,5 km,
      elle demande quatre heures et demie d’effort modéré. Elle part de la place de la mairie du Rozier, monte
      par des escaliers jusqu’au GR6 et longe les falaises de Capluc. Depuis le Balcon du Vertige, le sentier
      surplombe le lit de la rivière à près de 400 m d’à-pic, jalonné par le Vase de Chine et le Vase de
      Sèvres. Plusieurs sentiers partent également du Rozier ou du causse Méjean.


      Pour observer les oiseaux, la Maison des Vautours se trouve à Saint-Pierre-des-Tripiers, entre Le Truel
      et Le Rozier. Sa terrasse dispose de longues-vues et d’animateurs naturalistes. Depuis 1998, trois
      caméras mobiles retransmettent en direct la vie des falaises et des nids.
    history: >-
      Vautours et éleveurs vécurent en harmonie jusqu’au milieu du XIXe siècle. En 1970, la LPO et le parc
      national des Cévennes lancèrent la réintroduction du vautour fauve avec quatre spécimens espagnols.
      Entre 1981 et 1986, une soixantaine d’oiseaux nés en captivité furent relâchés, une première mondiale.
      Les vautours moines furent réintroduits de 1992 à 2004, et les gypaètes barbus de 2012 à 2021.


      Depuis 1998, les éleveurs gèrent des placettes d’équarrissage : environ 130 en 2020 sur les causses. Le
      piton de Capluc conserva une fonction militaire grâce à un château aujourd’hui disparu. Les gorges
      marquent la rencontre du parc national des Cévennes et du parc naturel régional des Grands Causses.
    before: >-
      Le parc déconseille le sentier des Corniches aux personnes sujettes au vertige. Emportez de l’eau, de
      bonnes chaussures, prévoyez des vêtements adaptés et refermez soigneusement les barrières pastorales. La
      Maison des Vautours est parfaite pour les non-marcheurs.
    around: >-
      Les gorges jouxtent le [parc national des Cévennes](/lugar/parc-national-des-cevennes/). Plus au loin,
      le [parc naturel régional du Verdon - gorges](/lugar/parc-naturel-regional-du-verdon---gorges/), le
      [parc naturel d’Els Ports](/lugar/parc-natural-dels-ports/), le [parc national de
      Monfragüe](/lugar/parque-nacional-de-monfrague/) et le [parc national forestier de
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/) accueillent aussi
      vautour moine, percnoptère et vautour fauve.
  de:
    intro: >-
      In den späten vierziger Jahren starben die letzten Gänsegeier in Frankreich aus, vertrieben durch
      Giftköder und Bejagung. Heute segeln sie wieder über einem Kalk-Canyon, in dem Geier seit mindestens
      70.000 Jahren heimisch sind. Die Jonte-Schlucht zwischen Causse Méjean und Causse Noir ist die Wiege des
      weltweit ersten erfolgreichen Wiederansiedlungsprojekts für Gänsegeier, dem drei weitere Arten folgten.
    landscape: >-
      Die Jonte entspringt auf 1440 m am Mont-Aigoual-Massiv und mündet bei Le Rozier in den Tarn. Dazwischen
      schneidet sie einen echten Canyon in den Fels, ähnlich den Gorges du Tarn, aber mit 300 bis 450 Metern
      etwas flacher und auf rund 20 km Länge kompakter. Sie wird nördlich vom Causse Méjean und südlich vom
      Causse Noir gesäumt.


      Das Gestein besteht fast durchgehend aus Dogger-Kalk, gekrönt von Oberjura-Schichten auf den
      Hochflächen. Die Dolomitfelsen von Capluc schützen einen Südhang mit mediterraner Flora: Blumen-Esche,
      Wilder Jasmin, Französischer Ahorn und Steineiche. Eine hydrogeologische Besonderheit: Ein Teil des
      Flusses versickert 3 km hinter Meyrueis im Karstuntergrund und tritt erst 7 km weiter flussabwärts an
      der Quelle Les Douze wieder zutage; dazwischen bleibt das Bett trocken, außer bei schweren Starkregen.
    wildlife: >-
      Jede der vier Geierarten hat ihre eigene Chronik. Der [Gänsegeier](/especie/gyps_fulvus/) brütet
      kolonieartig in Felsnischen: 2017 zählte man fast 600 Brutpaare auf den Grands Causses. Der
      [Mönchsgeier](/especie/aegypius_monachus/), mit 2,80 m Spannweite Europas größter Greifvogel, horstet
      auf Baumkronen. Der [Schmutzgeier](/especie/neophron_percnopterus/) zieht als einzige Art nach Afrika:
      Er kehrte 1986 aus eigener Kraft in die Lozère zurück. Der [Bartgeier](/especie/gypaetus_barbatus/)
      wurde im Juni 2012 angesiedelt und misst 2,45 bis 2,85 m Flügelspannweite.


      Auch Kolkraben, Milane, Adler und Schlangenadler lassen sich beobachten. Die Geier fliegen bis zu 150 km
      weit über die Causses; einzelne besendertes Tiere gelangten bis in den Senegal und die Niederlande.
      Beste Beobachtungszeit ist Mai bis Oktober.
    visit: >-
      Der Rundweg Corniches du Méjean verbindet die Schluchten von Jonte und Tarn. Er ist 11,5 km lang, dauert
      rund viereinhalb Stunden und weist mittlere Schwierigkeit auf. Start ist am Rathausplatz in Le Rozier,
      über Steintreppen hinauf zum GR6, an Capluc vorbei entlang der Felsbänder. Am Balcon du Vertige blickt
      man fast 400 m senkrecht auf das Flussbett, markiert durch Felszacken wie Vase de Chine und Vase de
      Sèvres.


      Das Informationszentrum Maison des Vautours liegt in Saint-Pierre-des-Tripiers zwischen Le Truel und Le
      Rozier. Von der Aussichtsterrasse unterstützen Fernrohre und Ranger die Vogelbeobachtung. Seit 1998
      übertragen drei Kameras Livebilder direkt von den Brutwänden.
    history: >-
      Geier und Bergbauern lebten bis Mitte des XIX. Jahrhunderts in Einklang. 1970 unternahmen LPO und
      Nationalpark Cevennen erste Versuche mit vier spanischen Gänsegeiern. Zwischen 1981 und 1986 wurden rund
      sechzig nachgezüchtete Tiere freigelassen – eine Weltpremiere. Mönchsgeier folgten 1992 bis 2004,
      Bartgeier von 2012 bis 2021.


      Seit 1998 dürfen Landwirte Futterplätze betreiben: rund 130 im Jahr 2020 auf den Causses. Der
      Capluc-Felsen diente einst als Festungswarte. Die Schlucht bildet die Grenze zwischen dem Nationalpark
      Cevennen und dem Regionalen Naturpark Grands Causses.
    before: >-
      Der Park rät Schwindelgefährdeten wegen ausgesetzter Felspassagen vom Corniches-Pfad ab. Nimm
      ausreichend Wasser mit, trage feste Bergschuhe und schließe Weidetore hinter dir. Die Maison des
      Vautours ist ideal für Gehschwache.
    around: >-
      Die Schlucht grenzt direkt an den [Nationalpark Cevennen](/lugar/parc-national-des-cevennes/). In
      weiterer Entfernung beherbergen auch der [Regionale Naturpark Verdon -
      Schluchten](/lugar/parc-naturel-regional-du-verdon---gorges/), der [Naturpark Els
      Ports](/lugar/parc-natural-dels-ports/), der [Nationalpark
      Monfragüe](/lugar/parque-nacional-de-monfrague/) und der [Nationalpark
      Dadia-Lefkimi-Soufli-Wald](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/) Mönchs-, Schmutz-
      und Gänsegeier.
  it:
    intro: >-
      Verso la fine degli anni quaranta gli ultimi grifoni scomparvero dalla Francia a causa di bocconi
      avvelenati e bracconaggio. Oggi puoi vederli volteggiare sopra un canyon calcareo dove gli avvoltoi
      nidificano da almeno 70.000 anni. Le gole della Jonte, incise tra il causse Méjean e il causse Noir,
      sono state la culla del primo programma al mondo di reintroduzione del grifone coronato da successo,
      seguito dall’arrivo di altre tre specie.
    landscape: >-
      La Jonte nasce a 1440 m sul massiccio dell’Aigoual e confluisce nel Tarn nel borgo di Le Rozier. Lungo
      il tragitto scava un canyon vero e proprio, simile a quello del Tarn ma profondo tra 300 e 450 metri, e
      lungo circa 20 km. È delimitato a nord dal causse Méjean e a sud dal causse Noir.


      La roccia è quasi interamente calcare del Dogger, coronato sui bordi superiori dal Giurassico superiore.
      Le falesie dolomitiche di Capluc proteggono un versante meridionale arricchito da flora mediterranea:
      orniello, gelsomino selvatico, acero minore e leccio. Il corso d’acqua presenta una singolarità
      idrologica: si inabissa nel sottosuolo a 3 km da Meyrueis per riemergere 7 km dopo alla risorgiva di Les
      Douze; tra i due punti l’alveo resta in secca salvo durante violente piene temporalesche.
    wildlife: >-
      I quattro avvoltoi vantano trascorsi unici. Il [grifone](/especie/gyps_fulvus/) nidifica in colonie
      sulle pareti: nel 2017 si censirono quasi 600 coppie riproduttive sui Grands Causses. L’[avvoltoio
      monaco](/especie/aegypius_monachus/), il rapace più imponente d’Europa con circa 2,80 m di apertura
      alare, edifica nidi sugli alberi. Il [capovaccaio](/especie/neophron_percnopterus/) è l’unico migratore:
      tornato spontaneamente in Lozère nel 1986, sverna nell’Africa subsahariana. Il
      [gipeto](/especie/gypaetus_barbatus/) è giunto nel giugno 2012 e misura da 2,45 a 2,85 m di apertura
      alare.


      Si ammirano anche corvi imperiali, nibbi, aquile e bianconi. Gli avvoltoi coprono regolarmente tragitti
      fino a 150 km dai Causses, con esemplari tracciati via GPS fino in Senegal e nei Paesi Bassi. Il periodo
      di osservazione ottimale va da maggio a ottobre.
    visit: >-
      L’anello delle Corniches du Méjean congiunge le gole della Jonte e quelle del Tarn. Misura 11,5 km,
      richiede quattro ore e mezza di cammino ed è di media difficoltà. Muove dal municipio di Le Rozier, sale
      lungo scalinate fino al sentiero GR6 costeggiando Capluc e le cenge. Dal Balcon du Vertige la traccia
      domina il letto della Jonte da quasi 400 m di altezza, sfiorando i torrioni di Vase de Chine e Vase de
      Sèvres.


      Per approfondire la biologia dei rapaci, la Maison des Vautours sorge a Saint-Pierre-des-Tripiers tra Le
      Truel e Le Rozier. La terrazza mette a disposizione cannocchiali e guide specializzate. Dal 1998 sono
      attive tre telecamere per seguire i voli e i nidi in parete.
    history: >-
      Avvoltoi e pastori hanno convissuto pacificamente fino alla metà del XIX secolo. Nel 1970 la LPO e il
      Parco Nazionale delle Cevenne avviarono la reintroduzione del grifone con quattro esemplari spagnoli.
      Tra il 1981 e il 1986 vennero rilasciati una sessantina di individui allevati in cattività, una pietra
      miliare mondiale. Gli avvoltoi monaci furono reintrodotti tra il 1992 e il 2004, e i gipeti dal 2012 al
      2021.


      Dal 1998 gli allevatori possono gestire carnai aziendali: circa 130 nel 2020 sui Causses. Lo sperone di
      Capluc svolse funzioni militari grazie a un castello oggi scomparso. Le gole segnano il confine tra il
      Parco Nazionale delle Cevenne e il Parco Naturale Regionale dei Grands Causses.
    before: >-
      L’ente parco sconsiglia il sentiero delle Corniches a chi soffre di vertigini. Porta acqua, scarpe
      robuste, attrezzatura per meteo mutevole e chiudi i varchi pastorali. La Maison des Vautours è perfetta
      per chi non cammina a lungo.
    around: >-
      Le gole confinano con il [Parco Nazionale delle Cevenne](/lugar/parc-national-des-cevennes/). Più
      distanti, il [Parco Naturale Regionale del Verdon -
      Gole](/lugar/parc-naturel-regional-du-verdon---gorges/), il [Parco Naturale di Els
      Ports](/lugar/parc-natural-dels-ports/), il [Parco Nazionale di
      Monfragüe](/lugar/parque-nacional-de-monfrague/) e il [Parco Nazionale Forestale di
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/) ospitano avvoltoio
      monaco, capovaccaio e grifone.
  pt:
    intro: >-
      Em finais dos anos quarenta extinguiram-se em França os últimos abutres-fouveiros, vitimados por venenos
      e perseguição. Hoje podes vê-los planar sobre um desfiladeiro calcário onde os abutres habitam há pelo
      menos 70.000 anos. As gargantas do Jonte, entre o causse Méjean e o causse Noir, foram o berço do
      primeiro programa bem-sucedido de reintrodução do abutre-fouveiro, servindo de modelo à chegada de
      outras três espécies.
    landscape: >-
      O Jonte nasce a 1440 m no maciço do Aigoual e desagua no Tarn na aldeia de Le Rozier. Pelo caminho
      entalha um desfiladeiro impressionante, vizinho do Tarn mas com 300 a 450 metros de profundidade e cerca
      de 20 km de extensão. Fica ladeado a norte pelo causse Méjean e a sul pelo causse Noir.


      A geologia compõe-se de calcários do Dogger encimados pelo Jurássico Superior. As escarpas dolomíticas
      de Capluc abrigam uma encosta sul com freixo-de-flores, jasmim-bravo, bordo-de-montpellier e azinheira.
      O rio tem um comportamento invulgar: parte do caudal afunda-se no subsolo a 3 km de Meyrueis e ressurge
      7 km adiante na ressurgência de Les Douze; entre estes dois pontos o leito permanece seco salvo em
      enxurradas cévenoles.
    wildlife: >-
      Os quatro abutres têm uma narrativa própria. O [abutre-fouveiro](/especie/gyps_fulvus/) nidifica em
      colónias nas fragas: em 2017 contavam-se quase 600 casais reprodutores nos Grands Causses. O
      [abutre-preto](/especie/aegypius_monachus/), a maior ave de rapina europeia com cerca de 2,80 m de
      envergadura, constrói ninhos em árvores. O [abutre-do-egito](/especie/neophron_percnopterus/) é o único
      migrador: regressou à Lozère por meios próprios em 1986 e inverna na África subsariana. O
      [abutre-barbudo](/especie/gypaetus_barbatus/) chegou em junho de 2012 e ostenta de 2,45 a 2,85 m de
      envergadura.


      Avistam-se ainda corvos-comuns, milhafres, águias e águias-cobreiras. Os abutres voam livremente até 150
      km dos Causses, existindo aves seguidas por satélite que atingiram o Senegal e os Países Baixos. A
      melhor época decorre de maio a outubro.
    visit: >-
      O circuito circular das Cornijas do Méjean liga as gargantas do Jonte e do Tarn. Tem 11,5 km de
      extensão, demora quatro horas e meia de caminhada moderada. Arranca no largo da câmara de Le Rozier,
      sobe por escadarias até encontrar o percurso GR6 e contorna Capluc. Do Balcon du Vertige o trilho domina
      o leito do rio a quase 400 m de altura, marcado pelos monólitos Vase de Chine e Vase de Sèvres.


      Para conhecer a ecologia destas aves, a Maison des Vautours localiza-se em Saint-Pierre-des-Tripiers,
      entre Le Truel e Le Rozier. O terraço dispõe de telescópios e guias ornitológicos. Desde 1998 que três
      câmaras móveis transmitem voos e ninhos em tempo real.
    history: >-
      Abutres e comunidades rurais coabitaram pacificamente até meados do século XIX. Em 1970, a LPO e o
      Parque Nacional de Cévennes iniciaram a reintrodução do abutre-fouveiro com quatro exemplares espanhóis.
      Entre 1981 e 1986 foram libertadas cerca de sessenta aves nascidas em cativeiro, numa estreia mundial. O
      abutre-preto foi reintroduzido entre 1992 e 2004, e o abutre-barbudo de 2012 a 2021.


      Desde 1998 que os criadores de gado podem gerir comedouros pecuários: cerca de 130 em 2020 nos Causses.
      A rocha de Capluc teve funções defensivas num castelo hoje desaparecido. O desfiladeiro situa-se no
      limite do Parque Nacional de Cévennes e do Parque Natural Regional dos Grands Causses.
    before: >-
      O parque desaconselha o trilho das Cornijas a pessoas propensas a vertigens. Leva água, calçado de
      montanha, adapta o vestuário às variações climatéricas e fecha as cancelas à passagem. A Maison des
      Vautours é a opção perfeita para quem prefere não caminhar.
    around: >-
      As gargantas confinam com o [Parque Nacional de Cévennes](/lugar/parc-national-des-cevennes/). Mais
      longe, o [Parque Natural Regional do Verdon -
      Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/), o [Parque Natural de Els
      Ports](/lugar/parc-natural-dels-ports/), o [Parque Nacional de
      Monfragüe](/lugar/parque-nacional-de-monfrague/) e o [Parque Nacional Florestal de
      Dadia-Lefkimi-Soufli](/lugar/parque-nacional-forestal-de-dadia-lefkimi-soufli/) acolhem também
      abutre-preto, abutre-do-egito e abutre-fouveiro.
