    Cañón salvaje y estrecho tributario del Tarn con impresionantes monolitos de piedra (Vase de Sèvres, Vase
    de Chine).
  en: >-
    Wild and narrow canyon tributary to the Tarn featuring dramatic stone monoliths (Vase de Sèvres, Vase de
    Chine).
  fr: >-
    Canyon sauvage et étroit affluent du Tarn hérissé d’impressionnants monolithes dolomitiques (Vase de
    Sèvres, Vase de Chine).
  de: Wilde, enge Nebenschlucht des Tarn mit spektakulären Felsmonolithen (Vase de Sèvres, Vase de Chine).
  it: >-
    Canyon selvaggio e stretto affluente del Tarn con impressionanti monoliti dolomitici (Vase de Sèvres, Vase
    de Chine).
  pt: >-
    Desfiladeiro bravio e estreito afluente do Tarn com impressionantes monólitos rochosos (Vase de Sèvres,
