    El único lugar del mundo donde sobrevive el pez fósil viviente *Romanichthys valsanicola* (asprete), de
    más de 65 millones de años de antigüedad.
  en: >-
    The only place in the world where the living fossil fish *Romanichthys valsanicola* (asprete), more than
    65 million years old, survives.
  fr: >-
    L'unique endroit au monde où survit le poisson fossile vivant *Romanichthys valsanicola* (asprete), vieux
    de plus de 65 millions d'années.
  de: >-
    Der weltweit einzige Ort, an dem das lebende Fossil *Romanichthys valsanicola* (Asprete), über 65
    Millionen Jahre alt, überlebt.
  it: >-
    L'unico luogo al mondo dove sopravvive il pesce fossile vivente *Romanichthys valsanicola* (asprete),
