observaciones:
  es: >-
    El asprete es diminuto y se oculta entre las piedras: no cuentes con verlo. Planifica la visita como una
    jornada de valle, de mayo a octubre, y pregunta antes por las condiciones y los sectores abiertos. Cuida
    el cauce: la extracción de piedras y el lavado en el río son parte del problema que se intenta frenar.
texto:
  es:
    intro: >-
      Mide entre diez y doce centímetros, vive bajo las piedras de un río de montaña y es el pez más raro de
      Europa. El asprete solo existe en el Vâlsan, un río que nace en una artesa glaciar de los montes Făgăraș
      y baja por la vertiente sur de los Cárpatos Meridionales. La reserva natural del río Vâlsan protege ese
      hilo de agua y el valle que lo rodea, y todo en ella gira alrededor de un solo animal.
    landscape: >-
      El Vâlsan nace entre los picos Picuiata y Scărișoara Mare, en una cubeta que dejó el hielo. Desde allí
      recorre 79 km, casi paralelo al Argeș, hasta desembocar en él cerca de Merișani, con una cuenca de 348
      kilómetros cuadrados. Es un curso de montaña típico: agua fría y rápida sobre lechos de piedras, grava,
      arena y grandes cantos.


      La reserva abarca unas 10.000 hectáreas aguas arriba de Brădetu y se reparte entre un sector de montaña
      y otro subcarpático. En las orillas crecen el sauce cabruno y el álamo temblón; en los prados, el
      cólquico, la anémona de los bosques y la melica uniflora. El conjunto es un mosaico de ecosistemas
      acuáticos y terrestres de gran diversidad de especies.
    wildlife: >-
      La protagonista no se deja ver. El asprete es un pez de fondo, sedentario, que vive en aguas de entre
      veinte y ochenta centímetros de profundidad, en tramos fríos y con corriente, y evita los lechos
      cubiertos de arcilla. Se esconde junto a las piedras medianas y grandes del centro del río. Comparte el
      agua con la trucha común y con el pez Cottus gobio.


      En el entorno del valle se citan el [oso pardo](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/), el [ciervo común](/especie/cervus_elaphus/), el corzo, el
      [rebeco](/especie/rupicapra_rupicapra/), el jabalí, la [nutria europea](/especie/lutra_lutra/), el [gato
      montés](/especie/felis_silvestris/) y el [lince boreal](/especie/lynx_lynx/). Entre los anfibios hay
      sapo de vientre amarillo, rana bermeja y [salamandra común](/especie/salamandra_salamandra/).
    visit: >-
      Aquí no hay un sendero famoso ni un observatorio al que ir. La visita es la del valle: seguir el río,
      mirar su cauce de piedras y entender por qué un animal tan pequeño necesita un lugar tan concreto. El
      plan nacional de acción del asprete propone actividades educativas y un centro especial de visita,
      formación e información para que visitantes y vecinos conozcan el problema de cerca.


      La cultura del valle también merece una parada. En Año Nuevo se representa el juego de la cabra: en
      Brădet y Brăduleț, durante la noche; en Costești y Valea Muscelului, en una versión que allí llaman «La
      cabra y el oso».
    history: >-
      El asprete lo descubrió en agosto de 1956 Nicolae Stoica, estudiante de segundo curso de Biología en
      Bucarest, Su nombre científico viene a decir «pez rumano del valle del Vâlsan», y «asprete» alude a sus
      escamas ásperas.


      Entonces vivía también en el Argeș y en el Râul Doamnei. Hoy solo queda en el Vâlsan, en un tramo de 1
      km aguas arriba de Brădetu. En 1967 se alteró el curso del río al construir un embalse y una central
      hidroeléctrica, y el plan nacional lo califica como en peligro crítico. En 2022 se encontraron 58
      ejemplares; en 2005 se estimaban unos cien.


      Las amenazas son concretas: vertidos domésticos y las aguas residuales del sanatorio de Brădet, el
      camping desordenado, el baño de ovejas, el lavado de lana y la extracción de piedra del cauce. Entre
      1977 y 1986 el zoólogo Gh. Stănescu luchó por proteger la especie y frenar esa extracción. Criarlo en
      cautividad, incluso en un instituto de Bonn, no ha logrado que se reproduzca. Por eso el plan fija como
      objetivo ampliar el hábitat y recuperar la población mediante restauración ecológica, reproducción
      dirigida y repoblación, y vigilar que se respete el caudal ecológico del Vâlsan y su afluente
      Dobroneagu. La recuperación histórica propuesta abarca más de 40-45 km de río entre Cheile Vâlsanului y
      Vâlsănești.
    before: >-
      El asprete es diminuto y se oculta entre las piedras: no cuentes con verlo. Planifica la visita como una
      jornada de valle, de mayo a octubre, y pregunta antes por las condiciones y los sectores abiertos. Cuida
      el cauce: la extracción de piedras y el lavado en el río son parte del problema que se intenta frenar.
    around: >-
      A veintitrés kilómetros está el [Desfiladero del Río Olt](/lugar/defileul-oltului/), y a la misma
      distancia el [Parque Nacional Cozia - Bosques
      Primarios](/lugar/parcul-national-cozia---codrii-seculari/).
  en:
    intro: >-
      It measures between ten and twelve centimetres, lives beneath the stones of a mountain river and is
      Europe's rarest fish. The asprete exists only in the Vâlsan, a river born in a glacial trough of the
      Făgăraș mountains that flows down the southern slope of the Southern Carpathians. The Vâlsan River
      Nature Reserve protects that thread of water and the valley around it, and everything in it revolves
      around a single animal.
    landscape: >-
      The Vâlsan rises between the peaks of Picuiata and Scărișoara Mare, in a hollow left by the ice. From
      there it flows 79 km, almost parallel to the Argeș, until joining it near Merișani, draining a basin of
      348 square kilometres. It is a classic mountain stream: cold, fast water over beds of stone, gravel,
      sand and large boulders.


      The reserve covers around 10,000 hectares upstream of Brădetu and is divided between a mountain sector
      and a sub-Carpathian one. On the banks grow goat willow and Eurasian aspen; in the meadows, autumn
      crocus, wood anemone and wood melick. Together they form a mosaic of aquatic and terrestrial ecosystems
      with high species diversity.
    wildlife: >-
      The main character does not show itself easily. The asprete is a bottom-dwelling, sedentary fish that
      lives in water between twenty and eighty centimetres deep, in cold, fast-flowing stretches, and avoids
      clay-covered beds. It hides beside medium and large stones in the middle of the river. It shares the
      water with brown trout and the European bullhead (*Cottus gobio*).


      In the surrounding valley [brown bear](/especie/ursus_arctos/), [grey wolf](/especie/canis_lupus/), [red
      deer](/especie/cervus_elaphus/), roe deer, [chamois](/especie/rupicapra_rupicapra/), wild boar,
      [Eurasian otter](/especie/lutra_lutra/), [European wildcat](/especie/felis_silvestris/) and [Eurasian
      lynx](/especie/lynx_lynx/) are recorded. Amphibians include yellow-bellied toad, common frog and [fire
      salamander](/especie/salamandra_salamandra/).
    visit: >-
      There is no famous trail or hide to head for here. The visit is the valley itself: following the river,
      looking at its stony bed and understanding why such a small animal needs such a specific place. The
      national action plan for the asprete proposes educational activities and a dedicated visiting, training
      and information centre so visitors and locals can get to know the issue up close.


      The valley's culture also deserves a pause. At New Year the goat play is performed: in Brădet and
      Brăduleț during the night, and in Costești and Valea Muscelului in a version locally called «The Goat
      and the Bear».
    history: >-
      The asprete was discovered in August 1956 by Nicolae Stoica, a second-year biology student in Bucharest.
      Its scientific name roughly means «Romanian fish of the Vâlsan valley», and «asprete» refers to its
      rough scales.


      Back then it also lived in the Argeș and the Râul Doamnei. Today it remains only in the Vâlsan, in a 1
      km stretch upstream of Brădetu. In 1967 the river's course was altered by building a dam and a
      hydroelectric plant, and the national plan classifies it as critically endangered. 58 individuals were
      found in 2022; in 2005 the estimate was around a hundred.


      The threats are specific: household sewage and wastewater from the Brădet sanatorium, unregulated
      camping, sheep dipping, wool washing and stone extraction from the riverbed. Between 1977 and 1986
      zoologist Gh. Stănescu fought to protect the species and halt that extraction. Captive breeding, even at
      an institute in Bonn, has not succeeded in getting it to reproduce. That is why the plan sets the goal
      of expanding habitat and recovering the population through ecological restoration, guided breeding and
      restocking, and monitoring that the ecological flow of the Vâlsan and its tributary Dobroneagu is
      respected. The proposed historic recovery covers more than 40-45 km of river between Cheile Vâlsanului
      and Vâlsănești.
    before: >-
      The asprete is tiny and hides among stones: do not count on seeing it. Plan your visit as a day in the
      valley, from May to October, and ask ahead about conditions and open sectors. Take care of the riverbed:
      stone extraction and washing in the river are part of the problem conservationists are trying to stop.
    around: >-
      Twenty-three kilometres away lies the [Olt River Gorge](/lugar/defileul-oltului/), and at the same
      distance is [Cozia National Park - Primeval Forests](/lugar/parcul-national-cozia---codrii-seculari/).
  fr:
    intro: >-
      Il mesure entre dix et douze centimètres, vit sous les pierres d'une rivière de montagne et est le
      poisson le plus rare d'Europe. L'asprete n'existe que dans le Vâlsan, une rivière qui naît dans un
      cirque glaciaire des monts Făgăraș et descend le versant sud des Carpates méridionales. La réserve
      naturelle de la rivière Vâlsan protège ce fil d'eau et la vallée qui l'entoure, et tout y tourne autour
      d'un seul animal.
    landscape: >-
      Le Vâlsan naît entre les sommets de Picuiata et de Scărișoara Mare, dans une cuvette laissée par la
      glace. De là il parcourt 79 km, presque parallèle à l'Argeș, avant de s'y jeter près de Merișani, avec
      un bassin de 348 kilomètres carrés. C'est un cours d'eau de montagne typique : eau froide et rapide sur
      des lits de pierres, graviers, sable et gros galets.


      La réserve couvre quelque 10 000 hectares en amont de Brădetu et se partage entre un secteur montagnard
      et un secteur subcarpatique. Sur les berges poussent le saule marsault et le peuplier tremble ; dans les
      prés, le colchique, l'anémone des bois et la mélique uniflore. L'ensemble forme une mosaïque
      d'écosystèmes aquatiques et terrestres d'une grande diversité d'espèces.
    wildlife: >-
      L'espèce phare ne se laisse pas voir. L'asprete est un poisson de fond, sédentaire, qui vit dans des
      eaux de vingt à quatre-vingts centimètres de profondeur, dans des tronçons froids et à courant, et évite
      les fonds couverts d'argile. Il se cache près des pierres moyennes et grandes au milieu du cours d'eau.
      Il partage l'eau avec la truite fario et le chabot commun (*Cottus gobio*).


      Dans les environs de la vallée sont cités l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/), le [cerf élaphe](/especie/cervus_elaphus/), le chevreuil, le
      [chamois](/especie/rupicapra_rupicapra/), le sanglier, la [loutre d'Europe](/especie/lutra_lutra/), le
      [chat forestier](/especie/felis_silvestris/) et le [lynx boréal](/especie/lynx_lynx/). Parmi les
      amphibiens vivent le sonneur à ventre jaune, la grenouille rousse et la [salamandre
      tachetée](/especie/salamandra_salamandra/).
    visit: >-
      Ici, pas de sentier célèbre ni d'observatoire vers lequel se diriger. La visite est celle de la vallée :
      suivre la rivière, observer son lit pierreux et comprendre pourquoi un animal si petit a besoin d'un
      lieu si précis. Le plan d'action national de l'asprete propose des activités éducatives et un centre
      spécial de visite, de formation et d'information pour que visiteurs et habitants connaissent le problème
      de près.


      La culture de la vallée mérite aussi une halte. Au Nouvel An est joué le jeu de la chèvre : à Brădet et
      Brăduleț pendant la nuit ; à Costești et Valea Muscelului dans une version que l'on y appelle « La
      chèvre et l'ours ».
    history: >-
      L'asprete fut découvert en août 1956 par Nicolae Stoica, étudiant de deuxième année de biologie à
      Bucarest. Son nom scientifique signifie en substance « poisson roumain de la vallée du Vâlsan », et «
      asprete » renvoie à ses écailles rugueuses.


      À l'époque, il vivait aussi dans l'Argeș et dans le Râul Doamnei. Aujourd'hui il ne subsiste que dans le
      Vâlsan, sur un tronçon de 1 km en amont de Brădetu. En 1967 le cours de la rivière fut modifié par la
      construction d'un barrage et d'une centrale hydroélectrique, et le plan national le classe en danger
      critique. 58 individus ont été trouvés en 2022 ; en 2005 on en estimait une centaine.


      Les menaces sont concrètes : rejets domestiques et eaux usées du sanatorium de Brădet, camping sauvage,
      baignade des moutons, lavage de la laine et extraction de pierres du lit. Entre 1977 et 1986, le
      zoologiste Gh. Stănescu lutta pour protéger l'espèce et freiner cette extraction. L'élevage en
      captivité, même dans un institut de Bonn, n'a pas réussi à le faire se reproduire. C'est pourquoi le
      plan fixe pour objectif d'étendre l'habitat et de restaurer la population par la restauration
      écologique, la reproduction dirigée et le repeuplement, tout en veillant au respect du débit écologique
      du Vâlsan et de son affluent le Dobroneagu. La restauration historique proposée couvre plus de 40-45 km
      de rivière entre Cheile Vâlsanului et Vâlsănești.
    before: >-
      L'asprete est minuscule et se cache parmi les pierres : ne comptez pas le voir. Planifiez la visite
      comme une journée de vallée, de mai à octobre, et renseignez-vous avant sur les conditions et les
      secteurs ouverts. Préservez le lit de la rivière : l'extraction de pierres et le lavage dans l'eau font
      partie du problème que l'on tente d'enrayer.
    around: >-
      À vingt-trois kilomètres se trouve le [Défilé de l'Olt](/lugar/defileul-oltului/), et à la même distance
      le [Parc national de Cozia - Forêts primaires](/lugar/parcul-national-cozia---codrii-seculari/).
  de:
    intro: >-
      Er misst zwischen zehn und zwölf Zentimeter, lebt unter den Steinen eines Gebirgsflusses und ist der
      seltenste Fisch Europas. Der Asprete existiert nur im Vâlsan, einem Fluss, der in einem Gletscherkar der
      Făgăraș-Berge entspringt und am Südhang der Südkarpaten hinabfließt. Das Naturreservat des Flusses
      Vâlsan schützt diesen Wasserlauf und das umliegende Tal, und alles darin dreht sich um ein einziges
      Tier.
    landscape: >-
      Der Vâlsan entspringt zwischen den Gipfeln Picuiata und Scărișoara Mare in einer vom Eis hinterlassenen
      Mulde. Von dort fließt er 79 km lang fast parallel zum Argeș, bis er nahe Merișani in ihn mündet, mit
      einem Einzugsgebiet von 348 Quadratkilometern. Es ist ein typischer Gebirgsfluss: kaltes, schnelles
      Wasser über Betten aus Steinen, Kies, Sand und großen Blöcken.


      Das Reservat umfasst rund 10.000 Hektar flussaufwärts von Brădetu und teilt sich in einen Gebirgs- und
      einen vorkarpatischen Abschnitt. An den Ufern wachsen Salweide und Zitterpappel; auf den Wiesen
      Herbstzeitlose, Buschwindröschen und Einblütiges Perlgras. Das Ganze bildet ein Mosaik aus aquatischen
      und terrestrischen Ökosystemen mit großer Artenvielfalt.
    wildlife: >-
      Die Hauptfigur lässt sich nicht blicken. Der Asprete ist ein bodenbewohnender, standorttreuer Fisch, der
      in zwanzig bis achtzig Zentimeter tiefem Wasser in kalten, strömungsreichen Abschnitten lebt und
      lehmbedeckte Sohlen meidet. Er versteckt sich neben mittleren und großen Steinen in der Flussmitte. Er
      teilt das Wasser mit der Bachforelle und der Groppe (*Cottus gobio*).


      Im Talumfeld werden [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/),
      [Rothirsch](/especie/cervus_elaphus/), Reh, [Gämse](/especie/rupicapra_rupicapra/), Wildschwein,
      [Eurasischer Fischotter](/especie/lutra_lutra/), [Wildkatze](/especie/felis_silvestris/) und
      [Eurasischer Luchs](/especie/lynx_lynx/) genannt. Unter den Amphibien gibt es Gelbbauchunke, Grasfrosch
      und [Feuersalamander](/especie/salamandra_salamandra/).
    visit: >-
      Hier gibt es keinen berühmten Wanderweg und keine Beobachtungshütte als Ziel. Der Besuch ist das Tal
      selbst: dem Fluss folgen, sein steiniges Bett betrachten und verstehen, warum ein so kleines Tier einen
      so besonderen Ort braucht. Der nationale Aktionsplan für den Asprete schlägt Bildungsaktivitäten und ein
      eigenes Besucher-, Schulungs- und Informationszentrum vor, damit Besucher und Anwohner das Problem aus
      der Nähe kennenlernen.


      Auch die Talkultur verdient einen Halt. Zu Neujahr wird das Ziegenspiel aufgeführt: in Brădet und
      Brăduleț nachts, in Costești und Valea Muscelului in einer dort «Die Ziege und der Bär» genannten
      Fassung.
    history: >-
      Entdeckt wurde der Asprete im August 1956 von Nicolae Stoica, einem Biologiestudenten im zweiten Jahr in
      Bukarest. Sein wissenschaftlicher Name bedeutet sinngemäß «rumänischer Fisch aus dem Tal des Vâlsan»,
      und «asprete» verweist auf seine rauen Schuppen.


      Damals lebte er auch im Argeș und im Râul Doamnei. Heute gibt es ihn nur noch im Vâlsan, auf einem 1 km
      langen Abschnitt flussaufwärts von Brădetu. 1967 wurde der Flusslauf durch den Bau eines Stausees und
      eines Wasserkraftwerks verändert, und der nationale Plan stuft ihn als vom Aussterben bedroht ein. 2022
      wurden 58 Exemplare gefunden; 2005 schätzte man etwa hundert.


      Die Bedrohungen sind konkret: häusliche Abwässer und die des Sanatoriums von Brădet, wildes Campen,
      Schafeschwemmen, Wollwaschen und Steinentnahme aus dem Flussbett. Zwischen 1977 und 1986 kämpfte der
      Zoologe Gh. Stănescu für den Schutz der Art und gegen diesen Abbau. Nachzucht in Gefangenschaft, selbst
      an einem Institut in Bonn, hat nicht zur Fortpflanzung geführt. Deshalb setzt der Plan das Ziel,
      Lebensraum zu erweitern und den Bestand durch ökologische Sanierung, gelenkte Nachzucht und Wiederbesatz
      zu erholen sowie den ökologischen Mindestabfluss des Vâlsan und seines Zuflusses Dobroneagu zu
      überwachen. Die vorgeschlagene historische Wiederherstellung umfasst über 40-45 km Fluss zwischen Cheile
      Vâlsanului und Vâlsănești.
    before: >-
      Der Asprete ist winzig und versteckt sich zwischen Steinen: Rechne nicht damit, ihn zu sehen. Plane den
      Besuch als Taltag von Mai bis Oktober und erkundige dich vorher nach den Bedingungen und offenen
      Abschnitten. Schone das Flussbett: Steinentnahme und Waschen im Fluss sind Teil des Problems, das man
      eindämmen will.
    around: >-
      Dreiundzwanzig Kilometer entfernt liegt die [Olt-Schlucht](/lugar/defileul-oltului/), und in gleicher
      Entfernung der [Nationalpark Cozia - Urwälder](/lugar/parcul-national-cozia---codrii-seculari/).
  it:
    intro: >-
      Misura tra dieci e dodici centimetri, vive sotto le pietre di un fiume di montagna ed è il pesce più
      raro d'Europa. L'asprete esiste soltanto nel Vâlsan, un fiume che nasce in un circo glaciale dei monti
      Făgăraș e scende lungo il versante meridionale dei Carpazi Meridionali. La riserva naturale del fiume
      Vâlsan protegge quel filo d'acqua e la valle che lo circonda, e tutto in essa ruota attorno a un solo
      animale.
    landscape: >-
      Il Vâlsan nasce tra le cime Picuiata e Scărișoara Mare, in una conca lasciata dal ghiaccio. Da lì
      percorre 79 km, quasi parallelo all'Argeș, fino a sfociarvi vicino a Merișani, con un bacino di 348
      chilometri quadrati. È un tipico corso d'acqua montano: acqua fredda e veloce su letti di pietre,
      ghiaia, sabbia e grandi ciottoli.


      La riserva copre circa 10.000 ettari a monte di Brădetu e si divide tra un settore montano e uno
      subcarpatico. Sulle rive crescono il salicone e il pioppo tremulo; nei prati, il colchico, l'anemone dei
      boschi e la melica uniflora. L'insieme è un mosaico di ecosistemi acquatici e terrestri di grande
      diversità di specie.
    wildlife: >-
      La protagonista non si lascia vedere. L'asprete è un pesce di fondo, sedentario, che vive in acque
      profonde tra venti e ottanta centimetri, in tratti freddi e con corrente, ed evita i fondali coperti di
      argilla. Si nasconde accanto alle pietre medie e grandi al centro del fiume. Condivide l'acqua con la
      trota fario e con lo scazzone (*Cottus gobio*).


      Nei dintorni della valle sono segnalati l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/), il [cervo](/especie/cervus_elaphus/), il capriolo, il [camoscio
      alpino](/especie/rupicapra_rupicapra/), il cinghiale, la [lontra europea](/especie/lutra_lutra/), il
      [gatto selvatico](/especie/felis_silvestris/) e la [lince](/especie/lynx_lynx/). Tra gli anfibi ci sono
      l'ululone dal ventre giallo, la rana temporaria e la [salamandra
      pezzata](/especie/salamandra_salamandra/).
    visit: >-
      Qui non c'è un sentiero celebre né un osservatorio verso cui dirigersi. La visita è quella della valle:
      seguire il fiume, osservare il suo letto di pietre e capire perché un animale così piccolo abbia bisogno
      di un luogo così preciso. Il piano d'azione nazionale dell'asprete propone attività educative e un
      centro speciale di visita, formazione e informazione affinché visitatori e residenti conoscano il
      problema da vicino.


      Anche la cultura della valle merita una sosta. A Capodanno si rappresenta il gioco della capra: a Brădet
      e Brăduleț durante la notte; a Costești e Valea Muscelului in una versione lì chiamata «La capra e
      l'orso».
    history: >-
      L'asprete fu scoperto nell'agosto 1956 da Nicolae Stoica, studente al secondo anno di biologia a
      Bucarest. Il suo nome scientifico significa in sostanza «pesce romeno della valle del Vâlsan», e
      «asprete» allude alle sue squame ruvide.


      Allora viveva anche nell'Argeș e nel Râul Doamnei. Oggi resta solo nel Vâlsan, in un tratto di 1 km a
      monte di Brădetu. Nel 1967 il corso del fiume fu alterato costruendo un invaso e una centrale
      idroelettrica, e il piano nazionale lo classifica in pericolo critico. Nel 2022 sono stati trovati 58
      esemplari; nel 2005 se ne stimavano circa cento.


      Le minacce sono concrete: scarichi domestici e le acque reflue del sanatorio di Brădet, campeggio
      disordinato, bagno delle pecore, lavaggio della lana ed estrazione di pietre dall'alveo. Tra il 1977 e
      il 1986 lo zoologo Gh. Stănescu lottò per proteggere la specie e frenare quell'estrazione. Allevarlo in
      cattività, persino in un istituto di Bonn, non ha portato alla riproduzione. Per questo il piano fissa
      l'obiettivo di ampliare l'habitat e recuperare la popolazione mediante ripristino ecologico,
      riproduzione guidata e ripopolamento, vigilando sul rispetto del deflusso ecologico del Vâlsan e del suo
      affluente Dobroneagu. Il recupero storico proposto copre oltre 40-45 km di fiume tra Cheile Vâlsanului e
      Vâlsănești.
    before: >-
      L'asprete è minuscolo e si nasconde tra le pietre: non contare di vederlo. Pianifica la visita come una
      giornata in valle, da maggio a ottobre, e informati prima sulle condizioni e sui settori aperti.
      Rispetta l'alveo: l'estrazione di pietre e il lavaggio nel fiume sono parte del problema che si cerca di
      fermare.
    around: >-
      A ventitré chilometri si trova la [Gola del Fiume Olt](/lugar/defileul-oltului/), e alla stessa distanza
      il [Parco Nazionale Cozia - Foreste Primarie](/lugar/parcul-national-cozia---codrii-seculari/).
  pt:
    intro: >-
      Mede entre dez e doze centímetros, vive debaixo das pedras de um rio de montanha e é o peixe mais raro
      da Europa. O asprete só existe no Vâlsan, um rio que nasce numa bacia glaciária dos montes Făgăraș e
      desce pela vertente sul dos Cárpatos Meridionais. A reserva natural do rio Vâlsan protege esse fio de
      água e o vale que o rodeia, e tudo nela gira em torno de um só animal.
    landscape: >-
      O Vâlsan nasce entre os picos Picuiata e Scărișoara Mare, numa depressão deixada pelo gelo. Daí percorre
      79 km, quase paralelo ao Argeș, até desaguar nele perto de Merișani, com uma bacia de 348 quilómetros
      quadrados. É um curso de montanha típico: água fria e rápida sobre leitos de pedras, cascalho, areia e
      grandes calhaus.


      A reserva abrange cerca de 10.000 hectares a montante de Brădetu e divide-se entre um setor de montanha
      e outro subcarpático. Nas margens crescem o salgueiro-branco-das-serras e o choupo-tremedor; nos prados,
      o cólquico, a anémona-dos-bosques e a mélica-uniflora. O conjunto é um mosaico de ecossistemas aquáticos
      e terrestres de grande diversidade de espécies.
    wildlife: >-
      A protagonista não se deixa ver. O asprete é um peixe de fundo, sedentário, que vive em águas entre
      vinte e oitenta centímetros de profundidade, em troços frios e com corrente, e evita os leitos cobertos
      de argila. Esconde-se junto às pedras médias e grandes do centro do rio. Partilha a água com a
      truta-fário e com o peixe *Cottus gobio*.


      Na envolvente do vale citam-se o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/), o [veado-vermelho](/especie/cervus_elaphus/), o corço, a
      [camurça](/especie/rupicapra_rupicapra/), o javali, a [lontra-europeia](/especie/lutra_lutra/), o
      [gato-bravo](/especie/felis_silvestris/) e o [lince-euroasiático](/especie/lynx_lynx/). Entre os
      anfíbios há sapo-de-barriga-amarela, rã-vermelha e
      [salamandra-de-fogo](/especie/salamandra_salamandra/).
    visit: >-
      Aqui não há um trilho famoso nem um observatório para onde ir. A visita é a do vale: seguir o rio, olhar
      para o seu leito de pedras e entender por que razão um animal tão pequeno precisa de um lugar tão
      específico. O plano nacional de ação do asprete propõe atividades educativas e um centro especial de
      visita, formação e informação para que visitantes e moradores conheçam o problema de perto.


      A cultura do vale também merece uma paragem. No Ano Novo representa-se o jogo da cabra: em Brădet e
      Brăduleț, durante a noite; em Costești e Valea Muscelului, numa versão a que ali chamam «A cabra e o
      urso».
    history: >-
      O asprete foi descoberto em agosto de 1956 por Nicolae Stoica, estudante do segundo ano de Biologia em
      Bucareste. O seu nome científico quer dizer aproximadamente «peixe romeno do vale do Vâlsan», e
      «asprete» alude às suas escamas ásperas.


      Então vivia também no Argeș e no Râul Doamnei. Hoje só resta no Vâlsan, num troço de 1 km a montante de
      Brădetu. Em 1967 alterou-se o curso do rio ao construir uma barragem e uma central hidroelétrica, e o
      plano nacional classifica-o como em perigo crítico. Em 2022 encontraram-se 58 exemplares; em 2005
      estimavam-se cerca de cem.


      As ameaças são concretas: descargas domésticas e as águas residuais do sanatório de Brădet, campismo
      desordenado, banho de ovelhas, lavagem de lã e extração de pedra do leito. Entre 1977 e 1986 o zoólogo
      Gh. Stănescu lutou para proteger a espécie e travar essa extração. Criá-lo em cativeiro, mesmo num
      instituto de Bona, não conseguiu fazê-lo reproduzir-se. Por isso o plano fixa como objetivo ampliar o
      habitat e recuperar a população mediante restauro ecológico, reprodução dirigida e repovoamento, e
      vigiar que se respeite o caudal ecológico do Vâlsan e do seu afluente Dobroneagu. A recuperação
      histórica proposta abrange mais de 40-45 km de rio entre Cheile Vâlsanului e Vâlsănești.
    before: >-
      O asprete é diminuto e esconde-se entre as pedras: não contes vê-lo. Planeia a visita como um dia de
      vale, de maio a outubro, e pergunta antes pelas condições e pelos setores abertos. Cuida do leito: a
      extração de pedras e a lavagem no rio fazem parte do problema que se tenta travar.
    around: >-
      A vinte e três quilómetros fica o [Desfiladeiro do Rio Olt](/lugar/defileul-oltului/), e à mesma
      distância o [Parque Nacional Cozia - Florestas
      Primárias](/lugar/parcul-national-cozia---codrii-seculari/).
