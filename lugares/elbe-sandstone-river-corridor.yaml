resumen:
  es: El río Elba abriéndose paso entre los monumentales torreones de arenisca de la Suiza Sajona y Checa.
  en: The Elbe River cutting through the monumental sandstone pillars of Saxon and Bohemian Switzerland.
  fr: L'Elbe se frayant un passage entre les pitons de grès monumentaux de la Suisse saxonne et tchèque.
  de: >-
    Die Elbe bahnt sich ihren Weg zwischen den monumentalen Sandsteintürmen der Sächsischen und Böhmischen
    Schweiz.
  it: Il fiume Elba si apre un varco tra i monumentali torrioni di arenaria della Svizzera Sassone e Boema.
  pt: O rio Elba abrindo caminho entre os pilares monumentais de arenito da Suíça Saxónica e Boémia.
unico:
  es: >-
    Un paisaje de arenisca cretácica, de torres, mesetas y gargantas, repartido entre dos parques nacionales
    vecinos, uno en Alemania y otro en Chequia.
  en: >-
    A Cretaceous sandstone landscape of towers, mesas, and gorges shared between two neighboring national
    parks, one in Germany and one in Czechia.
  fr: >-
    Un paysage de grès crétacé de tours, mesas et défilés partagé entre deux parcs nationaux voisins, en
    Allemagne et en Tchéquie.
  de: >-
    Eine kreidezeitliche Sandsteinlandschaft aus Felsnadeln, Tafelbergen und Schluchten, geteilt zwischen zwei
    benachbarten Nationalparks in Deutschland und Tschechien.
  it: >-
    Un paesaggio di arenaria cretacea fatto di pinnacoli, altipiani e forre, condiviso tra due parchi
    nazionali confinanti in Germania e Repubblica Ceca.
  pt: >-
    Uma paisagem de arenito cretácico com torres, mesas e desfiladeiros partilhada por dois parques nacionais
    vizinhos, na Alemanha e na Chéquia.
observaciones:
  es: >-
    En la Suiza Sajona solo se anda por los caminos existentes y, en la zona núcleo, por rutas señalizadas. El
    perro siempre con correa. Está prohibido dormir o acampar, también en caravana o coche; la única excepción
    es el vivac bajo un saliente de roca, el Boofen, del 16 de junio al 31 de enero, para escalar y en sitios
    oficiales. Tampoco se pueden usar drones, hacer fuego fuera de los fogones ni bañarse en el parque. Se
    pueden recoger pequeñas cantidades de setas y bayas sin salir del sendero. Las rutas de bici son las
    oficiales. Hay subidas muy empinadas, escaleras y tramos expuestos: lleva calzado firme y no te
    sobreestimes. Se escala solo en las cimas oficiales y nunca con la roca mojada o desmenuzada. La caída de
    árboles y ramas es un peligro típico del bosque.
texto:
  es:
    intro: >-
      Imagina el fondo de un mar del Cretácico: ríos que arrastran arena, capa sobre capa, hasta formar una
      placa de arenisca de hasta 600 metros de grosor. Ahora imagina lo que queda cuando el Elba y el tiempo
      la tallan. Eso son las montañas de arenisca del Elba, que cruzan la frontera entre Sajonia y el norte de
      Bohemia, con unas tres cuartas partes del territorio en el lado alemán. En el centro, a ambos lados de
      la frontera, hay dos parques nacionales: el de la Suiza Sajona y el de České Švýcarsko.
    landscape: >-
      Las montañas se extienden a ambos lados del Elba, desde Pirna, al noroeste, hasta Děčín, al sureste. Lo
      más llamativo es la variedad de terreno en muy poco espacio: llanuras, barrancos, mesas y zonas rocosas
      con bosque sin tocar. El parque de la Suiza Sajona, con dos zonas separadas que suman 93,5 km², ocupa el
      corazón de la parte alemana. Su cima, el Großer Winterberg, llega a 556 m, a poca distancia del valle
      del Elba, que está entre 110 y 120 m. Entre las cimas importantes figuran el Lilienstein, de 415 m, el
      Bastei, de 305 m, y el Brand, de 317 m.


      Del lado bohemio, la Pravčická brána es el mayor arco de arenisca de Europa y el símbolo de la Suiza
      Bohemia. Ese contraste de altura entre las mesas y las gargantas crea climas distintos: por eso la Suiza
      Sajona es conocida por tener especies montanas y ártico-alpinas a altitudes relativamente bajas, como la
      violeta de dos flores, la persicaria de tallo abrazador y la camarina negra. Los hayedos y pinares
      dominan los bosques seminaturales, y los valles frescos conservan abetales naturales. Pequeños brezales
      rocosos aparecen en el límite entre roca y bosque.
    wildlife: >-
      En los roquedos anidan la [cigüeña negra](/especie/ciconia_nigra/), el [búho real](/especie/bubo_bubo/)
      y el [halcón peregrino](/especie/falco_peregrinus/); en los bosques viven murciélagos poco comunes,
      entre ellos el murciélago de cueva y el de Bechstein. Los arroyos seminaturales de Kirnitzsch y sus
      afluentes conservan especies que desaparecieron de otros lugares por los vertidos de aguas residuales.
      El parque destaca también hongos raros, como el hongo barbudo nudoso y el barbudo de abeto.


      En el parque se conocen 13 especies de escarabajos relictos de bosques primarios. El parque deja que los
      árboles muertos formen parte del ciclo, y la plaga del escarabajo de la corteza ha hecho morir una gran
      parte de las píceas. La temporada va de mayo a octubre.
    visit: >-
      Para empezar, el Bastei: su puente es para muchos visitantes la primera vista del valle y es la zona más
      concurrida junto a Bad Schandau. Quien busque menos gente puede subir a las crestas altas.


      La cadena rocosa de Schrammsteine se recorre por una senda panorámica de cresta; desde Bad Schandau hay
      unos 350 m de desnivel con escaleras y peldaños empinados. Para llegar se toma el S-Bahn hasta Bad
      Schandau, Krippen o Schmilka-Hirschmühle y se sigue en ferry, a pie o en autobús. El Malersweg, el
      «camino de los pintores», mide 116 km: sale de Pirna, sigue el Elba hasta Schmilka y vuelve a Pirna. Hay
      más de cien miradores en la región y una ciclovía asfaltada junto al Elba.


      En el lado checo, el acceso solo se permite por senderos señalizados y entre las 6 y las 22 horas. El
      parque sajón ofrece programas educativos y recibe voluntarios.
    history: >-
      Las montañas son destino turístico desde hace más de doscientos años y de escaladores desde hace más de
      cien. El nombre «Suiza» viene de dos artistas suizos, Adrian Zingg y Anton Graff, a quienes el paisaje
      les recordó su tierra. El parque de la Suiza Sajona recibió su estatus en 1990, el de máxima protección
      natural de Alemania; el de České Švýcarsko se creó el 1 de enero de 2000 y es el más joven de Chequia,
      con casi ochenta kilómetros cuadrados. Su misión es dejar que prevalezcan los procesos naturales.
    before: >-
      En la Suiza Sajona solo se anda por los caminos existentes y, en la zona núcleo, por rutas señalizadas.
      El perro siempre con correa. Está prohibido dormir o acampar, también en caravana o coche; la única
      excepción es el vivac bajo un saliente de roca, el Boofen, del 16 de junio al 31 de enero, para escalar
      y en sitios oficiales. Tampoco se pueden usar drones, hacer fuego fuera de los fogones ni bañarse en el
      parque. Se pueden recoger pequeñas cantidades de setas y bayas sin salir del sendero. Las rutas de bici
      son las oficiales. Hay subidas muy empinadas, escaleras y tramos expuestos: lleva calzado firme y no te
      sobreestimes. Se escala solo en las cimas oficiales y nunca con la roca mojada o desmenuzada. La caída
      de árboles y ramas es un peligro típico del bosque.
  en:
    intro: >-
      Picture the floor of a Cretaceous sea: rivers washing down sand layer upon layer until forming a
      sandstone sheet up to 600 meters thick. Now picture what remains after the Elbe River and weathering
      have sculpted it over millennia. These are the Elbe Sandstone Mountains, straddling the frontier between
      Saxony and northern Bohemia, with roughly three-quarters of the terrain on the German side. At its core,
      flanking both sides of the border, lie two adjoining national parks: Saxon Switzerland and České
      Švýcarsko.
    landscape: >-
      The mountains flank both sides of the Elbe from Pirna in the northwest down to Děčín in the southeast.
      What strikes visitors most is the astonishing variety of relief within a compact area: rolling
      tablelands, rugged ravines, mesa formations, and wild forested cliffs. Saxon Switzerland National Park,
      divided into two distinct sections totaling 93.5 km², anchors the heart of the German sector. Its
      highest crest, the Großer Winterberg, rises to 556 m, only a short distance from the Elbe water level,
      which flows between 110 and 120 m. Other prominent peaks include the Lilienstein at 415 m, the Bastei at
      305 m, and the Brand at 317 m.


      On the Bohemian side, Pravčická brána stands as the largest natural sandstone arch in Europe and the
      iconic symbol of Bohemian Switzerland. The stark microclimatic contrast between dry, sun-baked plateau
      mesas and damp, shaded ravines produces thermal inversions: as a result, Saxon Switzerland is renowned
      for hosting montane and arctic-alpine species at unusually low altitudes, such as the twoflower violet,
      alpine bistort, and black crowberry. Semi-natural woodlands are dominated by beech and pine forests,
      while cool canyon bottoms preserve native fir stands. Scattered rocky heathlands cling to exposed cliff
      margins between stone and trees.
    wildlife: >-
      The sheer crags provide nesting sites for the [black stork](/especie/ciconia_nigra/), the [Eurasian
      eagle-owl](/especie/bubo_bubo/), and the [peregrine falcon](/especie/falco_peregrinus/); rare bats
      inhabit the old forests, including the common bent-wing bat and Bechstein's bat. The semi-natural
      mountain streams of the Kirnitzsch and its tributaries still support aquatic species that disappeared
      from adjacent regions due to sewage pollution. The park is also known for rare fungi, such as branched
      comb tooth and fir coral mushroom.


      Within the national park, scientists have identified 13 primeval forest relic beetle species. Management
      policy allows deadwood to cycle naturally through decay, and recent bark beetle outbreaks have led to
      the natural die-off of extensive spruce plantations. The season runs from May to October.
    visit: >-
      A classic first stop is the Bastei: for many visitors, its dramatic stone bridge provides their
      inaugural view of the river canyon, making it the most frequented viewpoint alongside Bad Schandau.
      Hikers seeking wilderness tranquility should head up onto the higher clifftop trails.


      The Schrammsteine rock chain is traversed via a scenic clifftop ridge path; ascending from Bad Schandau
      requires tackling some 350 m of elevation gain via steep ladders and stone stairways. To arrive by
      public transport, take the S-Bahn to Bad Schandau, Krippen, or Schmilka-Hirschmühle, connecting onwards
      by passenger ferry, foot, or bus. The Malerweg, or "Painters' Way," extends for 116 km: departing from
      Pirna, tracing the Elbe to Schmilka, and looping back to Pirna. The region counts more than one hundred
      scenic lookouts and features a paved riverside cycle path along the Elbe.


      On the Czech side, backcountry access is permitted only on designated marked trails between 6 and 22
      hours. The Saxon park authority also runs extensive environmental education programs and hosts volunteer
      conservation rangers.
    history: >-
      These mountains have attracted hikers and travellers for over two hundred years and rock climbers for
      more than one hundred. The moniker "Switzerland" was coined by two Swiss landscape artists, Adrian Zingg
      and Anton Graff, whom the sandstone towers reminded of their alpine homeland. Saxon Switzerland National
      Park gained its protected status in 1990, establishing the highest grade of nature reserve in Germany;
      České Švýcarsko was designated on 1 January 2000 as the youngest national park in Czechia, encompassing
      nearly eighty square kilometers. Their joint management mission is to let natural processes unfold
      freely.
    before: >-
      Inside Saxon Switzerland, visitors must stick to established footpaths, and within core wilderness
      zones, exclusively to designated marked routes. Dogs must remain on a leash at all times. Overnight
      camping or bivouacking is strictly forbidden, including in camper vans or cars; the sole authorized
      exception is traditional climbing bivouacking under sheltered rock overhangs (Boofen) from 16 June to 31
      January at officially designated sites. Drones, open campfires outside designated fireplaces, and wild
      swimming are prohibited. Foraging small personal amounts of mushrooms and wild berries is permitted
      without leaving the trail. Mountain biking is restricted to signposted cycle routes. Trails feature very
      steep ascents, exposed ladders, and narrow ledge sections: wear sturdy hiking footwear and do not
      overestimate your abilities. Rock climbing is permitted only on designated free-standing crags and never
      on wet or brittle rock. Falling dead timber and branches represent an objective woodland hazard.
  fr:
    intro: >-
      Imaginez le fond d'une mer crétacée : des cours d'eau charriant des sables, couche après couche, jusqu'à
      bâtir une dalle de grès de 600 mètres d'épaisseur. Imaginez ensuite ce qu'il en reste lorsque l'Elbe et
      les intempéries l'ont patiemment érodée. Tels sont les monts de grès de l'Elbe, qui enjambent la
      frontière entre la Saxe et le nord de la Bohême, les trois quarts du territoire s'étendant côté
      allemand. Au cœur de ce relief, de part et d'autre de la frontière, se dressent deux parcs nationaux
      contigus : celui de la Suisse saxonne et celui de České Švýcarsko.
    landscape: >-
      Le massif s'étire le long de l'Elbe depuis Pirna au nord-ouest jusqu'à Děčín au sud-est. La variété
      géomorphologique frappe dès l'abord sur un espace très réduit : plateaux, gorges ombragées, tables
      rocheuses et falaises boisées intactes. Le parc national de la Suisse saxonne, composé de deux zones
      distinctes totalisant 93,5 km², forme le noyau de la partie allemande. Son sommet, le Großer Winterberg,
      culmine à 556 m, à brève distance du lit de l'Elbe qui s'écoule entre 110 et 120 m d'altitude. Parmi les
      falaises célèbres figurent le Lilienstein à 415 m, le Bastei à 305 m et le Brand à 317 m.


      Côté bohémien, la Pravčická brána constitue la plus grande arche naturelle de grès d'Europe et l'emblème
      de la Suisse bohémienne. L'inversion thermique entre les plateaux ensoleillés et le fond frais des
      gorges permet la présence d'espèces montagnardes et arctico-alpines à basse altitude, telles que la
      pensée à deux fleurs, la renouée vivipare ou la camarine noire. Les hêtraies et pinèdes dominent les
      pentes, tandis que les gorges humides abritent des sapinières naturelles. De petites landes rocheuses
      s'accrochent aux vires dénudées.
    wildlife: >-
      Sur les parois rocheuses nichent la [cigogne noire](/especie/ciconia_nigra/), le [grand-duc
      d'Europe](/especie/bubo_bubo/) et le [faucon pèlerin](/especie/falco_peregrinus/) ; les forêts hébergent
      des chiroptères remarquables dont le minioptère de Schreibers et le murin de Bechstein. Les rivières
      sauvages de la Kirnitzsch et de ses affluents conservent des organismes aquatiques disparus ailleurs
      sous l'effet des pollutions. Le parc abrite également des champignons rares comme l'hydne coralliforme
      et l'hydne épineux du sapin.


      Dans le parc sont recensées 13 espèces de coléoptères reliques des forêts primaires. Les gestionnaires
      laissent le bois mort accomplir son rôle naturel, et les attaques de scolytes ont entraîné le
      dépérissement d'une grande partie des pessières plantées. La saison propice va de mai à octobre.
    visit: >-
      Pour débuter, découvrez le Bastei : son pont de pierre offre un belvédère spectaculaire sur la vallée et
      attire une forte fréquentation tout comme Bad Schandau. Les marcheurs en quête de solitude s'orienteront
      vers les sentiers des vires supérieures.


      Le massif rocheux des Schrammsteine se découvre le long d'un parcours de crête panoramique ; depuis Bad
      Schandau, l'itinéraire franchit environ 350 m de dénivelé par des escaliers et échelles métalliques
      raides. Pour y accéder, empruntez le S-Bahn jusqu'à Bad Schandau, Krippen ou Schmilka-Hirschmühle, puis
      poursuivez en bac, à pied ou en car. Le Malerweg (« sentier des peintres ») parcourt 116 km : partant de
      Pirna, il longe l'Elbe jusqu'à Schmilka avant de revenir à Pirna. On dénombre plus de cent belvédères
      dans la contrée, ainsi qu'une véloroute goudronnée suivant le fleuve.


      Côté tchèque, la circulation est limitée aux sentiers balisés entre 6 et 22 heures. Le parc saxon
      organise des sorties pédagogiques et s'appuie sur des écovolontaires.
    history: >-
      Ces montagnes attirent promeneurs et voyageurs depuis plus de deux cents ans et grimpeurs depuis plus de
      cent ans. L'appellation « Suisse » provient de deux peintres suisses, Adrian Zingg et Anton Graff, dont
      le relief rappelait le pays natal. Le parc de la Suisse saxonne a été créé en 1990 sous le statut de
      protection le plus élevé d'Allemagne ; celui de České Švýcarsko a vu le jour le 1 janvier 2000, le plus
      récent de Tchéquie, couvrant près de quatre-vingts kilomètres carrés. Leur mission est de laisser agir
      la dynamique naturelle.
    before: >-
      En Suisse saxonne, restez sur les chemins existants et, en zone centrale, sur les sentiers balisés. Les
      chiens doivent obligatoirement être tenus en laisse. Le camping sauvage et le stationnement de nuit en
      camping-car sont interdits ; la seule exception concerne le bivouac traditionnel sous surplomb rocheux
      (Boofen) réservé aux grimpeurs, du 16 juin au 31 janvier, sur des emplacements officiels. Les drones,
      les feux ouverts en dehors des foyers aménagés et la baignade sont prohibés. La cueillette de
      champignons et baies en faible quantité est tolérée sans quitter le chemin. Le vélo est restreint aux
      pistes balisées. Les dénivelés sont raides avec échelles et passages aériens : portez de bonnes
      chaussures et ne surestimez pas vos forces. L'escalade ne se pratique que sur les pitons autorisés et
      jamais sur roche humide ou friable. Les chutes d'arbres constituent un risque forestier fréquent.
  de:
    intro: >-
      Stelle dir den Grund eines kreidezeitlichen Meeres vor: Flüsse spülen Sand herbei, Schicht auf Schicht,
      bis eine Sandsteinplatte von bis zu 600 Metern Mächtigkeit entsteht. Dann stelle dir vor, wie die Elbe
      und die Witterung sie über Jahrtausende modellieren. Das ist das Elbsandsteingebirge, das die Grenze
      zwischen Sachsen und Nordböhmen überspannt, wobei rund drei Viertel des Areals auf deutscher Seite
      liegen. Im Zentrum erstrecken sich beiderseits der Landesgrenze zwei Nationalparks: die Sächsische
      Schweiz und České Švýcarsko.
    landscape: >-
      Das Gebirge begleitet die Elbe von Pirna im Nordwesten bis Děčín im Südosten. Besonders eindrücklich ist
      der Formenreichtum auf engem Raum: Ebenheiten, Felsenschluchten, Tafelberge und naturnahe Felswälder.
      Der Nationalpark Sächsische Schweiz nimmt mit zwei Teilgebieten von 93,5 km² das Herz des deutschen
      Sektors ein. Seine höchste Erhebung, der Große Winterberg, erreicht 556 m, kaum entfernt vom
      Elbtalgrund, der zwischen 110 und 120 m Meereshöhe liegt. Zu den markanten Landmarken zählen Lilienstein
      mit 415 m, Bastei mit 305 m und Brand mit 317 m.


      Auf böhmischer Seite erhebt sich das Prebischtor (Pravčická brána) als größte Sandsteinfelsbrücke
      Europas und Wahrzeichen der Böhmischen Schweiz. Das Reliefgefälle zwischen Hochebenen und feuchten
      Schluchten bedingt ein Umkehrklima: Daher beherbergt die Sächsische Schweiz montane und arktisch-alpine
      Pflanzenarten in ungewöhnlich tiefen Lagen, wie das Zweiblütige Veilchen, den Knöllchen-Knöterich oder
      die Schwarze Krähenbeere. Buchen- und Kiefernwälder prägen die Hänge, während in kühlen Gründen
      natürliche Weißtannenbestände überdauern.
    wildlife: >-
      In den Felsen brüten [Schwarzstorch](/especie/ciconia_nigra/), [Uhu](/especie/bubo_bubo/) und
      [Wanderfalke](/especie/falco_peregrinus/); alte Forste bieten seltenen Fledermäusen wie
      Langflügelfledermaus und Bechsteinfledermaus Quartier. Die naturnahen Gewässer der Kirnitzsch und ihrer
      Zuflüsse bewahren Gewässerorganismen, die andernorts durch Abwässer verschwanden. Auch seltene Pilze wie
      Ästiger Stachelbart und Tannen-Stachelbart sind im Park beheimatet.


      Im Nationalparkgebiet wurden 13 Urwaldreliktkäfer nachgewiesen. Die Nationalparkverwaltung überlässt
      Totholz dem natürlichen Kreislauf; Borkenkäferbefall führte zum Absterben weiter Fichtenforste. Die
      Saison dauert von Mai bis Oktober.
    visit: >-
      Als Auftakt empfiehlt sich die Bastei: Ihre historische Brücke eröffnet den berühmten Ausblick und
      bildet zusammen mit Bad Schandau den meistbesuchten Punkt. Wer Einsamkeit sucht, weicht auf die höheren
      Grate aus.


      Die Schrammsteine lassen sich auf einem aussichtsreichen Gratweg erkunden; ab Bad Schandau überwindet
      der Anstieg rund 350 m Höhenunterschied über steile Stiegen und Leitern. Die Anreise erfolgt bequem mit
      der S-Bahn bis Bad Schandau, Krippen oder Schmilka-Hirschmühle, gefolgt von Fähre, Fußweg oder Bus. Der
      Malerweg misst 116 km: Er startet in Pirna, folgt der Elbe bis Schmilka und kehrt nach Pirna zurück.
      Mehr als hundert Aussichtspunkte und der asphaltierte Elberadweg erschließen die Region.


      Auf tschechischer Seite ist das Betreten der Naturzone nur auf markierten Wegen zwischen 6 und 22 Uhr
      gestattet. Der sächsische Park bietet Umweltbildungsangebote und setzt auf ehrenamtliche
      Naturschutzhelfer.
    history: >-
      Seit über zweihundert Jahren ist das Gebirge ein Ziel von Wanderern und seit mehr als hundert Jahren ein
      Revier der Kletterer. Der Name «Schweiz» geht auf die Schweizer Maler Adrian Zingg und Anton Graff
      zurück, die sich an ihre Heimat erinnert fühlten. Der Nationalpark Sächsische Schweiz wurde 1990
      ausgewiesen; der Nationalpark České Švýcarsko entstand am 1. Januar 2000 als jüngster Nationalpark
      Tschechiens mit fast achtzig Quadratkilometern Fläche. Leitlinie beider Parks ist es, Natur Natur sein
      zu lassen.
    before: >-
      In der Sächsischen Schweiz darfst du nur bestehende Wege und in der Kernzone ausschließlich markierte
      Routen nutzen. Hunde gehören stets an die Leine. Zelten, Campen und Übernachten im Fahrzeug sind
      verboten; einzige Ausnahme ist das traditionelle Freiübernachten unter Felsüberhängen (Boofen) für
      Kletterer vom 16. Juni bis 31. Januar an amtlich festgelegten Plätzen. Drohnen, offenes Feuer und Baden
      im Nationalpark sind untersagt. Pilze und Beeren dürfen nur in geringen Mengen für den Eigenbedarf am
      Wegesrand gesammelt werden. Radfahren ist auf freigegebene Radrouten beschränkt. Ausgesetzte Leitern
      erfordern Trittsicherheit und festes Schuhwerk. Herabstürzendes Totholz stellt eine waldtypische Gefahr
      dar.
  it:
    intro: >-
      Immagina il fondale di un mare cretaceo: fiumi che depositano sabbia, strato su strato, fino a formare
      una bancata di arenaria spessa fino a 600 metri. Poi immagina il risultato dell'azione millenaria
      dell'Elba e delle intemperie. Queste sono le Montagne di arenaria dell'Elba, a cavallo tra la Sassonia e
      il nord della Boemia, con circa tre quarti del territorio sul versante tedesco. Nel cuore del massiccio
      sorgono due parchi nazionali adiacenti: quello della Svizzera Sassone e quello della Svizzera Boema
      (České Švýcarsko).
    landscape: >-
      Le montagne fiancheggiano l'Elba da Pirna a nord-ovest fino a Děčín a sud-est. A colpire è l'estrema
      varietà morfologica concentrata in poco spazio: altopiani ondulati, forre ombrose, tavolieri rocciosi e
      dirupi boscati. Il Parco Nazionale della Svizzera Sassone, diviso in due comprensori per complessivi
      93,5 km², occupa il baricentro dell'area tedesca. La quota culminante, il Großer Winterberg, tocca i 556
      m, a breve distanza dal pelo d'acqua dell'Elba che scorre tra 110 e 120 m. Tra i rilievi più noti
      spiccano il Lilienstein a 415 m, il Bastei a 305 m e il Brand a 317 m.


      Sul versante ceco la Pravčická brána costituisce il più grande arco naturale di arenaria d'Europa e
      l'emblema della Svizzera Boema. L'escursione termica tra le mesas soleggiate e le forre profonde crea un
      microclima peculiare: la Svizzera Sassone ospita specie montane e artico-alpine a quote molto basse,
      come la viola a due fiori, la bistorta alpina e il mirtillo nero boreale. Faggete e pinete dominano i
      versanti, mentre nei fondovalle umidi crescono abetine autoctone.
    wildlife: >-
      Sulle pareti verticali nidificano la [cicogna nera](/especie/ciconia_nigra/), il [gufo
      reale](/especie/bubo_bubo/) e il [falco pellegrino](/especie/falco_peregrinus/); i boschi vetusti
      offrono rifugio a chirotteri rari quali il miniottero e il vespertilio di Bechstein. I torrenti montani
      della Kirnitzsch e dei suoi affluenti conservano specie acquatiche altrove scomparse per l'inquinamento
      idrico. L'area protetta annovera inoltre funghi rari come l'idno corallo e l'idno spinoso dell'abete.


      Nel parco sono censite 13 specie di coleotteri relitti delle foreste primarie. La gestione lascia che il
      legno morto compia il suo ciclo ecologico naturale, e le infestazioni di bostrico hanno portato al
      deperimento spontaneo delle peccete piantumate. La stagione indicata va da maggio a ottobre.
    visit: >-
      Un punto di partenza obbligato è il Bastei: il suo celebre ponte in pietra regala una veduta vertiginosa
      sulla forra dell'Elba ed è la mèta più affollata assieme a Bad Schandau. Chi cerca tranquillità può
      risalire i sentieri alti di cengia.


      I bastioni rocciosi degli Schrammsteine si attraversano lungo un aereo sentiero di cresta; partendo da
      Bad Schandau si superano circa 350 m di dislivello con ripide scale metalliche. Per raggiungerli si
      utilizza la ferrovia S-Bahn fino a Bad Schandau, Krippen o Schmilka-Hirschmühle, proseguendo in
      traghetto, a piedi o in autobus. Il Malerweg («sentiero dei pittori») copre 116 km: parte da Pirna,
      costeggia l'Elba fino a Schmilka e torna a Pirna. La regione offre oltre cento punti panoramici e una
      pista ciclabile asfaltata lungo il fiume.


      Sul lato ceco l'accesso è consentito solo sui percorsi segnati tra le 6 e le 22. Il parco sassone
      propone attività didattiche e si avvale di guardiaparco volontari.
    history: >-
      Queste montagne attraggono escursionisti da oltre duecento anni e arrampicatori da più di cent'anni.
      L'appellativo «Svizzera» si deve ai pittori svizzeri Adrian Zingg e Anton Graff, ai quali il paesaggio
      ricordava i rilievi alpini nativi. Il Parco Nazionale della Svizzera Sassone è stato istituito nel 1990;
      quello di České Švýcarsko è nato il 1 gennaio 2000, il più giovane della Repubblica Ceca, con quasi
      ottanta chilometri quadrati di superficie. L'obiettivo comune è lasciare spazio alla libera evoluzione
      naturale.
    before: >-
      Nella Svizzera Sassone cammina solo sui tracciati esistenti e, nella zona centrale, lungo i sentieri
      segnati. I cani vanno tenuti sempre al guinzaglio. È vietato bivaccare, campeggiare o pernottare in
      auto; l'unica deroga ammessa è il bivacco alpinistico sotto roccia (Boofen) dal 16 giugno al 31 gennaio
      in siti censiti. Droni, fuochi liberi e balneazione nel fiume sono proibiti. È consentita la raccolta di
      funghi e frutti di bosco in quantità modesta senza allontanarsi dal sentiero. In bicicletta sono
      permesse solo le piste ufficiali. Gradinate e scale esposte impongono scarponi da trekking e prudenza.
      La caduta improvvisa di rami o alberi secchi costituisce un pericolo oggettivo.
  pt:
    intro: >-
      Imagina o leito de um mar do Cretácico: rios a depositar areia, camada sobre camada, até formarem uma
      bancada de arenito com até 600 metros de espessura. Agora imagina o que resta quando o Elba e a
      meteorização a esculpem ao longo dos milénios. Estas são as montanhas de arenito do Elba, que cruzam a
      fronteira entre a Saxónia e o norte da Boémia, com três quartos do território do lado alemão. Ao centro,
      ladeando a linha de fronteira, erguem-se dois parques nacionais contíguos: a Suíça Saxónica e České
      Švýcarsko.
    landscape: >-
      As montanhas ladeiam o curso do Elba desde Pirna, a noroeste, até Děčín, a sudeste. O que mais
      impressiona é a diversidade morfológica num espaço restrito: planaltos suaves, gargantas profundas,
      mesas rochosas e escarpas florestadas intactas. O Parque Nacional da Suíça Saxónica, composto por duas
      zonas distintas que somam 93,5 km², constitui o núcleo do setor alemão. O ponto mais elevado, o Großer
      Winterberg, atinge 556 m, a curta distância do leito do Elba, que corre entre 110 e 120 m de altitude.
      Entre as elevações mais imponentes destacam-se o Lilienstein com 415 m, o Bastei com 305 m e o Brand com
      317 m.


      Do lado boémio, a Pravčická brána representa o maior arco natural de arenito da Europa e o símbolo da
      Suíça Boémia. O contraste térmico acentuado entre os planaltos soalheiros e os desfiladeiros húmidos e
      frios origina inversões térmicas: por isso, a Suíça Saxónica é célebre por abrigar espécies montanas e
      ártico-alpinas a altitudes surpreendentemente baixas, tais como o amor-perfeito-amarelo, o
      bistorta-alpino e a camarinha-negra. Faias e pinheiros dominam as encostas, enquanto os fundos de vale
      abrigam abetais relíquias.
    wildlife: >-
      Nas escarpas rochosas nidificam a [cegonha-preta](/especie/ciconia_nigra/), o
      [bufo-real](/especie/bubo_bubo/) e o [falcão-peregrino](/especie/falco_peregrinus/); as florestas
      acolhem morcegos raros, entre os quais o morcego-de-peluche e o morcego-de-bechstein. As ribeiras
      naturais do rio Kirnitzsch e seus tributários conservam comunidades biológicas aquáticas desaparecidas
      de outros rios devido a poluição. O parque destaca também fungos invulgares como a hericium coraloide e
      a hericium de abeto.


      Estão inventariadas 13 espécies de escaravelhos relíquias de florestas virgens. A gestão do parque deixa
      que a madeira morta integre o ciclo biológico, e os surtos de escaravelho-da-casca ditaram a morte
      natural de vastas manchas de espruce. A melhor época vai de maio a outubro.
    visit: >-
      Para começar, visita o Bastei: a sua ponte de pedra proporciona a muitos viajantes o primeiro panorama
      da garganta e é o local mais frequentado juntamente com Bad Schandau. Quem procura tranquilidade deve
      subir aos trilhos das cristas elevadas.


      A cordilheira de Schrammsteine percorre-se através de um trilho cimeiro panorâmico; a partir de Bad
      Schandau vencem-se cerca de 350 m de desnível por escadarias e escadas metálicas verticais. Para chegar
      ao local, utiliza a linha de comboio suburbano S-Bahn até Bad Schandau, Krippen ou Schmilka-Hirschmühle,
      prosseguindo depois em ferry, a pé ou de autocarro. O Malerweg («Caminho dos Pintores») totaliza 116 km:
      parte de Pirna, acompanha o Elba até Schmilka e regressa a Pirna. A região conta com mais de cem
      miradouros panorâmicos e uma ecopista asfaltada junto ao rio.


      No setor checo, a circulação só é autorizada nos trilhos sinalizados entre as 6 e as 22 horas. O parque
      saxão oferece programas educativos e acolhe voluntários ambientais.
    history: >-
      Estas montanhas atraem viajantes há mais de duzentos anos e alpinistas há mais de cem anos. A designação
      «Suíça» deve-se a dois artistas helvéticos, Adrian Zingg e Anton Graff, a quem a paisagem recordava a
      terra natal. O Parque Nacional da Suíça Saxónica foi formalizado em 1990; o de České Švýcarsko foi
      criado a 1 de janeiro de 2000, sendo o mais jovem da Chéquia, com quase oitenta quilómetros quadrados de
      área. A sua prioridade reside em deixar que a dinâmica natural decorra sem entraves.
    before: >-
      Na Suíça Saxónica caminha apenas nos trilhos existentes e, na zona tampão e núcleo, exclusivamente nas
      rotas marcadas. Cães devem circular sempre com trela. É proibido acampar ou pernoitar em carrinhas ou
      tendas; a única exceção é o tradicional bivaque sob palas de rocha (Boofen) para alpinistas de 16 de
      junho a 31 de janeiro em locais autorizados. Drones, fogueiras fora de locais próprios e banhos no rio
      estão interditos. Permite-se a apanha de pequenas quantidades de cogumelos e bagas junto ao trilho. O
      uso de bicicleta limita-se às ciclovias oficiais. Existem escadas e troços aéreos íngremes: usa botas
      adequadas e não sobrestimes a tua condição física. A escalada só se pratica nos maciços autorizados e
      nunca com rocha molhada. A queda de árvores mortas é um risco florestal corrente.
