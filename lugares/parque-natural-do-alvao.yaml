unico:
  es: >-
    Un río que se despeña 250 metros en 1500 por una cuarcita ordovícica y deja a su paso un parque entero
    tallado por el agua.
  en: >-
    A river that plunges 250 metres over 1,500 metres of Ordovician quartzite and leaves in its wake an entire
    park carved by water.
  fr: >-
    Une rivière qui se précipite 250 mètres sur 1 500 mètres de quartzite ordovicien et laisse dans son
    sillage tout un parc taillé par l'eau.
  de: >-
    Ein Fluss, der 250 Meter über 1.500 Meter ordovizischen Quarzit stürzt und einen ganzen, vom Wasser
    geformten Park hinterlässt.
  it: >-
    Un fiume che precipita 250 metri su 1.500 metri di quarzite ordoviciana e lascia nel suo scia un intero
    parco scolpito dall'acqua.
  pt: >-
    Um rio que se precipita 250 metros em 1.500 metros de quartzito ordovícico e deixa no seu rasto um parque
    inteiro talhado pela água.
