    Cascada monumental de Fisgas do Ermelo (caída de 200 m sobre esquistos de cuarcita) y aldeas serranas de
    granito conservadas.
  en: >-
    The monumental Fisgas do Ermelo waterfall (a 200 m drop over quartzite schists) and well-preserved granite
    mountain villages.
