    Der monumentale Wasserfall Fisgas do Ermelo (200 m Fallhöhe über Quarzitschiefer) und gut erhaltene
    Granitbergdörfer.
  it: >-
    La monumentale cascata delle Fisgas do Ermelo (caduta di 200 m su scisti quarzitico) e villaggi montani in
    granito ben conservati.
  pt: >-
    A monumental cascata das Fisgas do Ermelo (queda de 200 m sobre xistos quartzíticos) e aldeias serranas de
