resumen:
  es: >-
    La vertiente francesa del Pirineo central, gemela de Ordesa: circos glaciares, quebrantahuesos, sarrio y
    desmán.
  en: >-
    The French slope of the central Pyrenees, twin to Ordesa: glacial cirques, bearded vultures, isards, and
    Pyrenean desmans.
  fr: >-
    Le versant français des Pyrénées centrales, jumeau d'Ordesa : cirques glaciaires, gypaètes barbus, isards
    et desmans.
  de: >-
    Die französische Flanke der Zentralpyrenäen, Zwillingsmassiv von Ordesa: Gletscherkare, Bartgeier,
    Pyrenäen-Gämsen und Desmane.
  it: >-
    Il versante francese dei Pirenei centrali, gemello di Ordesa: circhi glaciali, gipeti, camosci pirenaici e
    desman.
  pt: >-
    A vertente francesa dos Pirinéus centrais, gémea de Ordesa: circos glaciares, abutres-barbudos, camurças e
    toupeiras-da-água.
unico:
  es: >-
    Las glaciaciones excavaron aquí circos como el inmenso de Gavarnie, y hoy lo recorres al otro lado de la
    frontera con un parque hermano: Ordesa y Monte Perdido.
  en: >-
    Glaciations carved monumental amphitheaters here like the immense Cirque de Gavarnie, explored today just
    across the frontier from its twin park, Ordesa y Monte Perdido.
  fr: >-
    Les glaciations ont creusé ici des cirques monumentaux comme l'immense cirque de Gavarnie, que l'on
    parcourt aujourd'hui face à son parc jumeau d'outre-frontière : Ordesa et le Mont-Perdu.
  de: >-
    Die Eiszeiten gruben hier gewaltige Felskare wie den immensen Cirque de Gavarnie aus, den man heute direkt
    gegenüber seinem grenzüberschreitenden Schwesterpark Ordesa y Monte Perdido erwandert.
  it: >-
    Le glaciazioni scavarono qui circhi monumentali come l'immenso circo di Gavarnie, che oggi si percorre a
    ridosso del parco gemello oltreconfine: Ordesa e Monte Perdido.
  pt: >-
    As glaciações escavaram aqui circos monumentais como o imenso circo de Gavarnie, percorrido hoje frente a
    frente com o seu parque gémeo além-fronteira: Ordesa e Monte Perdido.
observaciones:
  es: >-
    El verano es la mejor época para la alta montaña. La afluencia es alta en el circo de Gavarnie y en el
    Pont d'Espagne, y baja en los valles altos de Aspe y Ossau, así que si buscas tranquilidad apunta allí.
    Sigue las normas del corazón del parque y consulta las condiciones de visita antes de organizar la salida.
texto:
  es:
    intro: >-
      Imagina un anfiteatro de roca de paredes altas y escarpadas, tallado por el hielo. Es el circo de
      Gavarnie, y es solo el más famoso de los que guarda el Parque Nacional de los Pirineos: una franja de
      alta montaña que corre de oeste a este desde el alto valle de Aspe y el pico del Midi d'Ossau hasta el
      pico de Néouvielle, pasando por el Balaïtous y el Vignemale, que con 3.298 m es el punto más alto de su
      corazón. Aquí hay 230 lagos de altura, las cumbres más altas de los Pirineos franceses y un país de
      pastos donde la actividad agropastoral sigue viva.
    landscape: >-
      Para entender el parque hay que mirar hacia atrás. La caliza que domina buena parte de estas montañas
      viene de los periodos Cretácico y Eoceno; después, el levantamiento tectónico abrió cañones profundos, y
      por fin llegaron las glaciaciones, repetidas, que esculpieron lo que ves ahora: circos y grandes valles
      en U. Por eso el parque protege formas calizas como valles kársticos y cuevas.


      Los circos de Gavarnie, Estaubé y Troumouse y la muralla de Barroude son los paisajes más
      característicos de la alta montaña. Son de origen glaciar y tienen paredes altas y escarpadas. El
      corazón del parque ocupa 45.707 ha en 15 municipios, desde los 1.273 m hasta los 3.298 m del Vignemale.


      Más abajo la montaña cambia de cara. Los pastos de media montaña y las bordas de altura muestran una
      actividad agropastoral que sigue viva, y esa mezcla de roca viva y paisaje trabajado por el hombre es lo
      que la UNESCO reconoce desde 1997 en el conjunto Pirineos-Monte Perdido, que el parque comparte con
      Ordesa y Monte Perdido.
    wildlife: >-
      La flora es de las más ricas de Francia: unas 2.500 especies de plantas superiores, más de 200
      endémicas, entre ellas el pensamiento de Lapeyrouse y la veza plateada. La fauna no se queda atrás, con
      4.000 especies animales, 250 de ellas vertebrados, y un símbolo claro, el sarrio o isard.


      En el cielo mandan las rapaces amenazadas: el [quebrantahuesos](/especie/gypaetus_barbatus/), el
      alimoche y el [águila real](/especie/aquila_chrysaetos/). En el suelo, el
      [sarrio](/especie/rupicapra_pyrenaica/) y la [marmota](/especie/marmota_marmota/), que se introdujo
      desde los Alpes en 1948. Y en el agua vive el [desmán de los Pirineos](/especie/galemys_pyrenaicus/), un
      mamífero semiacuático muy raro, casi imposible de ver directamente. Otros mamíferos del parque son la
      gineta y la cabra montés, presente desde 2013, con más de doscientos cincuenta ejemplares en 2020.


      El [oso pardo](/especie/ursus_arctos/) es la historia más delicada. Los últimos osos autóctonos del
      Pirineo, todos machos, vivían en los valles de Aspe y Ossau, y en los Pirineos centrales se
      reintrodujeron tres osos de Eslovenia: dos hembras en 1996 y un macho en 1997.


      En verano, los guardas-monitores guían salidas temáticas, como la de rapaces en el valle de
      Luz-Gavarnie.
    visit: >-
      El parque y los lagos de Néouvielle son un lugar propicio para el senderismo. Entre los sitios más
      visitados están el circo de Gavarnie, el lago de Orédon y el lago de Cap de Long; entre los valles, los
      de Luz, Aure y Néouvielle, Cauterets, Ossau, Azun y Aspe.


      Si buscas un paseo sencillo, el sendero de interpretación del plan d'Aste se presenta como accesible
      para todos los públicos.
    history: >-
      La conservación en estas montañas es anterior al parque. En 1935 la Sociedad nacional de aclimatación
      creó la reserva natural de Néouvielle, que en 1968 se integró en el parque, creado por decreto el 23 de
      marzo de 1967. Se concibió como un espacio natural sin barreras ni vallas, donde los animales son
      totalmente libres.


      El parque tiene dos zonas: el corazón y la zona periférica. En el corazón la reglamentación es estricta,
      porque busca preservar la belleza de los sitios y proteger las especies amenazadas; en la periférica es
      más flexible, y sirve para frenar el éxodo rural.
    before: >-
      El verano es la mejor época para la alta montaña. La afluencia es alta en el circo de Gavarnie y en el
      Pont d'Espagne, y baja en los valles altos de Aspe y Ossau, así que si buscas tranquilidad apunta allí.
      Sigue las normas del corazón del parque y consulta las condiciones de visita antes de organizar la
      salida.
    around: >-
      A solo 1 km, al otro lado de la frontera, está el [Parque Nacional de Ordesa y Monte
      Perdido](/lugar/parque-nacional-de-ordesa-y-monte-perdido/), con el que comparte el conjunto de la
      UNESCO y más de 100 km de comunicación. A unos quince kilómetros queda la [Selva de
      Irati](/lugar/foret-d-irati---selva-de-irati/).


      Más lejos, el [Parque Nacional de
      Aigüestortes](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) comparte con los Pirineos
      el sarrio, la marmota y el quebrantahuesos, y el [Parque Nacional del Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) y el [Parque Nacional de la
      Vanoise](/lugar/parc-national-de-la-vanoise/) la marmota, el quebrantahuesos y el águila real.
  en:
    intro: >-
      Imagine an amphitheater of sheer rock walls carved by glacial ice. That is the Cirque de Gavarnie, and
      it is merely the most famous among those preserved by Pyrénées National Park: an east-west high-mountain
      belt stretching from the upper Aspe valley and Pic du Midi d'Ossau to Pic de Néouvielle, by way of
      Balaïtous and the Vignemale, which at 3,298 m forms the highest summit of its core. Here lie 230
      high-altitude lakes, the loftiest peaks in the French Pyrenees, and pastoral landscapes where
      transhumant farming remains vibrant.
    landscape: >-
      Understanding the park requires peering back into geological deep time. The limestone dominating much of
      these ranges originated during the Cretaceous and Eocene epochs; subsequent tectonic uplift incised
      profound canyons, followed by repeated glaciations that carved the present amphitheaters and broad
      U-shaped valleys. The park thus protects striking karst landforms, including dry limestone valleys and
      caves.


      The cirques of Gavarnie, Estaubé, and Troumouse, alongside the Wall of Barroude, represent
      quintessential high-mountain sceneries, characterized by dizzying vertical precipices. The park core
      encompasses 45,707 ha across 15 municipalities, spanning from 1,273 m up to 3,298 m at the summit of
      Vignemale.


      Lower down, the mountain reveals a gentler face. Mid-altitude pastures and rustic stone barns reflect
      living agropastoral traditions—a harmonious blend of sheer wilderness and ancestral cultural landscape
      recognized by UNESCO in 1997 through the World Heritage designation Pyrénées-Mont Perdu, shared with
      Ordesa y Monte Perdido.
    wildlife: >-
      The flora ranks among France's richest: roughly 2,500 vascular plant species, over 200 of them endemic,
      including Lapeyrouse's pansy and silver vetch. Wildlife is equally remarkable, numbering 4,000 animal
      species, 250 of them vertebrates, centered around the park's emblem: the isard, or [Pyrenean
      chamois](/especie/rupicapra_pyrenaica/).


      The skies belong to threatened raptors: the [bearded vulture](/especie/gypaetus_barbatus/), Egyptian
      vulture, and [golden eagle](/especie/aquila_chrysaetos/). Across screes roam the chamois and [Alpine
      marmot](/especie/marmota_marmota/), introduced from the Alps in 1948. Mountain torrents harbor the
      [Pyrenean desman](/especie/galemys_pyrenaicus/), a bizarre, elusive semi-aquatic mammal rarely observed
      directly. Other mammals include common genets and the Iberian ibex, reintroduced since 2013, with over
      two hundred and fifty individuals counted in 2020.


      The [brown bear](/especie/ursus_arctos/) represents the park's most delicate conservation saga. The last
      indigenous Pyrenean bears, all males, clung to the valleys of Aspe and Ossau; in the central Pyrenees,
      three bears from Slovenia were reintroduced: two females in 1996 and a male in 1997.


      During summer, park rangers lead themed interpretive outings, including raptor walks in the Luz-Gavarnie
      valley.
    visit: >-
      The national park and the Néouvielle lakes offer sublime terrain for hiking. Among the most popular
      destinations are the Cirque de Gavarnie, Lac d'Orédon, and Lac de Cap de Long, spread across valleys
      including Luz, Aure, Néouvielle, Cauterets, Ossau, Azun, and Aspe.


      For an accessible stroll, the interpretive path at Plan d'Aste welcomes visitors of all walking
      abilities.
    history: >-
      Conservation here predates the national park. In 1935 the National Acclimatization Society established
      the Néouvielle Nature Reserve, integrated in 1968 into the national park, which was formally created by
      decree on 23 March 1967. It was conceived as an unfenced wilderness where wildlife moves without
      barriers.


      The park comprises two management zones: the core and the peripheral buffer zone. In the core, strict
      regulations safeguard natural beauty and threatened species; in the buffer zone, regulations are more
      flexible, designed to combat rural depopulation.
    before: >-
      Summer is the prime season for high-altitude trekking. Visitor numbers peak at the Cirque de Gavarnie
      and Pont d'Espagne, while the upper valleys of Aspe and Ossau remain peaceful. Comply with core zone
      regulations and check trail conditions before departure.
    around: >-
      Just 1 km away across the Spanish frontier lies [Ordesa y Monte Perdido National
      Park](/lugar/parque-nacional-de-ordesa-y-monte-perdido/), sharing the UNESCO designation and over 100 km
      of transboundary trails. Roughly fifteen kilometers away lies the [Irati
      Forest](/lugar/foret-d-irati---selva-de-irati/).


      Farther afield, [Aigüestortes National
      Park](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) shares chamois, marmots, and
      bearded vultures, while [Gran Paradiso National Park](/lugar/parco-nazionale-gran-paradiso/) and
      [Vanoise National Park](/lugar/parc-national-de-la-vanoise/) share marmots, bearded vultures, and golden
      eagles.
  fr:
    intro: >-
      Imaginez un amphithéâtre rocheux aux parois vertigineuses, sculpté par les glaces. C'est le cirque de
      Gavarnie, et ce n'est que le plus célèbre de ceux que protège le Parc national des Pyrénées : une haute
      barrière courant d'ouest en est depuis la haute vallée d'Aspe et le pic du Midi d'Ossau jusqu'au massif
      du Néouvielle, en passant par le Balaïtous et le Vignemale, qui culmine à 3 298 m au cœur du parc. On y
      compte 230 lacs d'altitude, les plus hauts sommets des Pyrénées françaises et un domaine pastoral où la
      transhumance reste bien vivante.
    landscape: >-
      Pour comprendre le massif, il faut sonder le temps géologique. Les calcaires qui dominent ces reliefs se
      sont déposés au Crétacé et à l'Éocène ; le soulèvement tectonique a ensuite ouvert de profondes
      entailles, puis les glaciations successives ont façonné les cirques et grandes vallées en U. Le parc
      préserve ainsi de remarquables modelés karstiques, entre gouffres et vallées sèches.


      Les cirques de Gavarnie, d'Estaubé et de Troumouse, ainsi que la muraille de Barroude, composent les
      décors les plus impressionnants de la haute montagne pyrénéenne. Le cœur du parc couvre 45 707 ha sur 15
      communes, s'élevant de 1 273 m jusqu'aux 3 298 m du Vignemale.


      Plus bas, la montagne prend un visage pastoral. Les estives de moyenne altitude et les granges foraines
      témoignent d'un pastoralisme vivant—mélange de roc brut et de paysages façonnés par l'homme distingué
      par l'UNESCO en 1997 au sein du bien Pyrénées-Mont Perdu, partagé avec Ordesa.
    wildlife: >-
      La flore figure parmi les plus riches de France : environ 2 500 espèces de plantes supérieures, dont
      plus de 200 endémiques, telles que la pensée de Lapeyrouse et la vesce argentée. La faune compte 4 000
      espèces animales, dont 250 vertébrés, incarnée par l'[isard](/especie/rupicapra_pyrenaica/).


      Dans les airs patrouillent les rapaces menacés : le [gypaète barbu](/especie/gypaetus_barbatus/), le
      vautour percnoptère et l'[aigle royal](/especie/aquila_chrysaetos/). Au sol courent l'isard et la
      [marmotte des Alpes](/especie/marmota_marmota/), réintroduite depuis les Alpes en 1948. Les torrents
      abritent le [desman des Pyrénées](/especie/galemys_pyrenaicus/), un petit mammifère semi-aquatique
      endémique très rare. Parmi les autres mammifères figurent la genette et le bouquetin ibérique, de retour
      depuis 2013 avec plus de deux cent cinquante individus recensés en 2020.


      L'[ours brun](/especie/ursus_arctos/) constitue le dossier le plus sensible. Les derniers ours
      autochtones survécurent en vallées d'Aspe et d'Ossau ; dans les Pyrénées centrales, trois ours de
      Slovénie furent réintroduits : deux femelles en 1996 et un mâle en 1997.


      En été, les gardes-moniteurs guident des sorties thématiques, notamment sur les rapaces en vallée de
      Luz-Gavarnie.
    visit: >-
      Le parc et les lacs du Néouvielle constituent un formidable domaine de randonnée. Parmi les sites
      emblématiques figurent le cirque de Gavarnie, le lac d'Orédon et le lac de Cap de Long, répartis entre
      les vallées de Luz, Aure, Néouvielle, Cauterets, Ossau, Azun et Aspe.


      Pour une découverte aisée, le sentier d'interprétation du plan d'Aste est accessible à tous les
      marcheurs.
    history: >-
      La préservation de ces massifs est antérieure au parc. En 1935, la Société nationale d'acclimatation
      créa la réserve naturelle du Néouvielle, intégrée en 1968 au parc national, officialisé par décret le 23
      mars 1967. Il fut pensé comme un vaste sanctuaire sans clôtures où la faune évolue en totale liberté.


      Le parc se divise entre zone cœur et aire d'adhésion. En cœur, la réglementation protège la beauté
      sauvage et les espèces menacées ; en périphérie, les mesures favorisent le maintien des activités
      agropastorales et le tissu rural.
    before: >-
      L'été reste la saison idéale pour la haute montagne. La fréquentation est intense à Gavarnie et au Pont
      d'Espagne, mais les hautes vallées d'Aspe et d'Ossau offrent un grand calme. Respectez la réglementation
      du cœur et renseignez-vous sur l'état des sentiers avant de partir.
    around: >-
      À seulement 1 km de l'autre côté de la frontière espagnole se déploie le [Parc national d'Ordesa et du
      Mont-Perdu](/lugar/parque-nacional-de-ordesa-y-monte-perdido/), avec lequel il partage le bien UNESCO et
      plus de 100 km de continuité. À une quinzaine de kilomètres s'étend la [Forêt
      d'Iraty](/lugar/foret-d-irati---selva-de-irati/).


      Plus loin, le [Parc national
      d'Aigüestortes](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) partage isard, marmotte
      et gypaète, tandis que le [Parc national du Grand Paradis](/lugar/parco-nazionale-gran-paradiso/) et le
      [Parc national de la Vanoise](/lugar/parc-national-de-la-vanoise/) partagent marmotte, gypaète et aigle
      royal.
  de:
    intro: >-
      Stell dir ein gigantisches Felsenamphitheater mit steil aufragenden Wänden vor, von eiszeitlichen
      Gletschern aus dem Kalk gefräst. Das ist der Cirque de Gavarnie, der berühmteste unter den Karen des
      Nationalparks Pyrenäen: ein Hochgebirgskamm von West nach Ost vom oberen Vallée d'Aspe und dem Pic du
      Midi d'Ossau bis zum Néouvielle-Massiv, vorbei an Balaïtous und dem Vignemale, der mit 3.298 m den
      höchsten Punkt der Kernzone markiert. Hier finden sich 230 Hochgebirgsseen, die höchsten Gipfel der
      französischen Pyrenäen und lebendige Almweiden.
    landscape: >-
      Um das Gebirge zu verstehen, muss man tief in die Erdgeschichte blicken. Die Kalke der Gipfel lagerten
      sich in Kreide und Eozän ab; tektonische Hebung schuf tiefe Canyons, bevor wiederkehrende Eiszeiten die
      heutigen Kare und U-Täler schliffen. Der Park schützt daher eindrucksvolle Karstphänomene wie
      Trockentäler und Höhlensysteme.


      Die Kare von Gavarnie, Estaubé und Troumouse sowie die Wand von Barroude sind unverwechselbare alpine
      Wahrzeichen mit senkrechten Abstürzen. Die Kernzone erstreckt sich über 45.707 ha in 15 Gemeinden, von
      1.273 m bis zu den 3.298 m des Vignemale.


      Weiter talwärts wandelt sich die Landschaft: Almen und Berghütten zeugen von lebendiger
      Weidewirtschaft—ein Zusammenspiel aus Urnatur und uralter Kulturlandschaft, das die UNESCO 1997 mit dem
      Welterbe Pyrénées-Mont Perdu würdigte.
    wildlife: >-
      Die Pflanzenwelt zählt zu den reichsten Frankreichs: rund 2.500 höhere Pflanzenarten, davon über 200
      Endemiten wie das Lapeyrouse-Stiefmütterchen und die Silber-Wicke. Die Tierwelt umfasst 4.000 Arten,
      darunter 250 Wirbeltiere, angeführt vom Wappentier des Parks: der
      [Pyrenäen-Gämse](/especie/rupicapra_pyrenaica/).


      Am Himmel kreisen bedrohte Greifvögel: [Bartgeier](/especie/gypaetus_barbatus/), Schmutzgeier und
      [Steinadler](/especie/aquila_chrysaetos/). Auf den Felsfluren leben Gämsen und das
      [Alpenmurmeltier](/especie/marmota_marmota/), das 1948 aus den Alpen angesiedelt wurde. In den
      Bergbächen schwimmt der [Pyrenäen-Desman](/especie/galemys_pyrenaicus/), ein seltenes semiaquatisches
      Säugetier. Weitere Säuger sind Ginsterkatze und Iberiensteinbock, der seit 2013 wieder heimisch ist und
      2020 über zweihundertfünfzig Tiere zählte.


      Der [Braunbär](/especie/ursus_arctos/) bildet das anspruchsvollste Schutzprojekt. Die letzten
      einheimischen Pyrenäenbären überlebten in Aspe und Ossau; in den Zentralpyrenäen wurden Bären aus
      Slowenien freigelassen: zwei Weibchen 1996 und ein Männchen 1997.


      Im Sommer bieten Parkranger thematische Exkursionen an, etwa zu Greifvögeln im Luz-Gavarnie-Tal.
    visit: >-
      Der Park und die Seen von Néouvielle sind ein Paradies für Wanderer. Zu den beliebtesten Zielen zählen
      der Cirque de Gavarnie, der Lac d'Orédon und der Lac de Cap de Long in Tälern wie Luz, Aure, Néouvielle,
      Cauterets, Ossau, Azun und Aspe.


      Für eine leichte Tour bietet sich der barrierefreie Naturlehrpfad am Plan d'Aste an.
    history: >-
      Der Naturschutz begann hier lange vor dem Nationalpark. 1935 gründete die Société nationale
      d'acclimatation das Schutzgebiet Néouvielle, das 1968 in den Nationalpark integriert wurde, der per
      Dekret am 23. März 1967 entstand. Er wurde als ungezähmter Freiraum ohne Zäune konzipiert.


      Der Park gliedert sich in Kernzone und Beitrittsgebiet. In der Kernzone schützt strenge Gesetzgebung
      Natur und bedrohte Arten; die Randzone fördert den Erhalt ländlicher Strukturen.
    before: >-
      Der Sommer ist die ideale Zeit für Hochtouren. Großer Andrang herrscht in Gavarnie und am Pont
      d'Espagne, während die oberen Täler von Aspe und Ossau stille Abgeschiedenheit bieten. Beachte die
      Regeln der Kernzone und informiere dich vorab über den Wegebau.
    around: >-
      Nur 1 km jenseits der spanischen Grenze liegt der [Nationalpark Ordesa y Monte
      Perdido](/lugar/parque-nacional-de-ordesa-y-monte-perdido/), der das UNESCO-Welterbe teilt und über 100
      km Wegverbindungen bietet. Rund fünfzehn Kilometer entfernt erstreckt sich der [Urwald von
      Irati](/lugar/foret-d-irati---selva-de-irati/).


      Weiter entfernt teilt der [Nationalpark
      Aigüestortes](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) Gämse, Murmeltier und
      Bartgeier, während der [Nationalpark Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) und der
      [Nationalpark Vanoise](/lugar/parc-national-de-la-vanoise/) Murmeltier, Bartgeier und Steinadler teilen.
  it:
    intro: >-
      Immagina un anfiteatro di roccia calcarea dalle pareti vertiginose, scavato dal ghiaccio per millenni. È
      il circo di Gavarnie, il più rinomato tra quelli tutelati dal Parco Nazionale dei Pirenei: una dorsale
      d'alta quota che corre da ovest a est dall'alta valle d'Aspe e dal Pic du Midi d'Ossau fino al massiccio
      del Néouvielle, toccando il Balaïtous e il Vignemale, che con 3.298 m costituisce la cima più elevata
      della zona centrale. Qui si contano 230 laghi d'alta montagna, le vette più imponenti dei Pirenei
      francesi e alpeggi dove la pastorizia transumante rimane fiorente.
    landscape: >-
      Per comprendere il territorio occorre risalire alle ere geologiche. I calcari dominanti risalgono al
      Cretacico e all'Eocene; il sollevamento tettonico scavò canyon profondi e le glaciazioni successive
      modellarono circhi e vallate a U. Il parco custodisce spettacolari forme carsiche, tra forre e cavità
      sotterranee.


      I circhi di Gavarnie, Estaubé e Troumouse e la parete di Barroude rappresentano i paesaggi più grandiosi
      dell'alta montagna pirenaica. La zona centrale copre 45.707 ettari distribuiti su 15 comuni, salendo da
      1.273 m fino ai 3.298 m del Vignemale.


      Più in basso il paesaggio assume una fisionomia rurale. I pascoli montani e le baite tradizionali
      testimoniano un'attività pastorale intatta—connubio di roccia selvaggia e lavoro umano iscritto
      dall'UNESCO nel 1997 nel sito transfrontaliero Pyrénées-Mont Perdu, condiviso con Ordesa.
    wildlife: >-
      La flora figura tra le più ricche di Francia: circa 2.500 specie vascolari, oltre 200 endemiche, tra cui
      la viola di Lapeyrouse e la veccia argentata. La fauna annovera 4.000 specie, di cui 250 vertebrati, con
      protagonista il [camoscio pirenaico](/especie/rupicapra_pyrenaica/).


      I cieli sono dominati da grandi rapaci: il [gipeto](/especie/gypaetus_barbatus/), il capovaccaio e
      l'[aquila reale](/especie/aquila_chrysaetos/). Sui pendii vivono il camoscio e la [marmotta
      alpina](/especie/marmota_marmota/), introdotta dalle Alpi nel 1948. Nelle acque fredde dei torrenti vive
      il [desman dei Pirenei](/especie/galemys_pyrenaicus/), singolare mammifero semi-acquatico assai elusivo.
      Tra gli altri mammiferi figurano genetta e stambecco iberico, reintrodotto dal 2013 con oltre
      duecentocinquanta capi censiti nel 2020.


      L'[orso bruno](/especie/ursus_arctos/) rappresenta la sfida conservazionistica cruciale. Gli ultimi orsi
      autoctoni trovarono rifugio nelle valli di Aspe e Ossau; nei Pirenei centrali vennero rilasciati tre
      orsi sloveni: due femmine nel 1996 e un maschio nel 1997.


      In estate i guardiaparco guidano escursioni tematiche, dedicate ad esempio ai rapaci nella valle di
      Luz-Gavarnie.
    visit: >-
      Il parco e i bacini lacustri del Néouvielle offrono un comprensorio escursionistico eccelso. Tra i
      luoghi più celebri figurano il circo di Gavarnie, il lago d'Orédon e il lago di Cap de Long, situati
      nelle valli di Luz, Aure, Néouvielle, Cauterets, Ossau, Azun e Aspe.


      Per una camminata rilassante, il percorso didattico del Plan d'Aste è fruibile da ogni categoria di
      visitatori.
    history: >-
      La conservazione in queste valli precede il parco. Nel 1935 la Società nazionale di acclimatazione
      istituì la riserva del Néouvielle, integrata nel 1968 nel parco nazionale, fondato con decreto il 23
      marzo 1967. Fu concepito come uno spazio naturale aperto senza recinzioni dove la fauna circola
      liberamente.


      Il territorio comprende cuore protetto e area contigua. Nella zona centrale regole severe tutelano
      paesaggi e specie minacciate; nella zona periferica le norme agevolano la permanenza delle comunità
      montane.
    before: >-
      L'estate è la stagione propizia per l'alta quota. L'affluenza è notevole a Gavarnie e al Pont d'Espagne,
      mentre le alte valli di Aspe e Ossau garantiscono solitudine. Rispetta le norme della zona centrale e
      accertati dello stato dei sentieri prima di partire.
    around: >-
      A solo 1 km oltre il confine si estende il [Parco Nazionale di Ordesa e Monte
      Perdido](/lugar/parque-nacional-de-ordesa-y-monte-perdido/), con cui condivide il sito UNESCO e oltre
      100 km di connessioni. A una quindicina di chilometri sorge la [Foresta di
      Irati](/lugar/foret-d-irati---selva-de-irati/).


      Più lontano, il [Parco Nazionale di
      Aigüestortes](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) condivide camoscio,
      marmotta e gipeto, mentre il [Parco Nazionale del Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/)
      e il [Parco Nazionale della Vanoise](/lugar/parc-national-de-la-vanoise/) condividono marmotta, gipeto e
      aquila reale.
  pt:
    intro: >-
      Imagina um anfiteatro rochoso de paredes alcantiladas, talhado pelos glaciares. É o circo de Gavarnie, e
      é apenas o mais célebre dos que resguarda o Parque Nacional dos Pirinéus: uma crista de alta montanha
      que corre de oeste a leste desde o alto vale de Aspe e o Pic du Midi d'Ossau até ao maciço de
      Néouvielle, passando pelo Balaïtous e pelo Vignemale, que com 3.298 m atinge o ponto culminante do seu
      coração. Reúne 230 lagoas de altitude, os picos mais elevados dos Pirinéus franceses e uma paisagem
      pastoril onde a transumância permanece viva.
    landscape: >-
      Compreender o maciço exige recuar no tempo geológico. Os calcários que dominam estas serranias
      formaram-se no Cretácico e Eocénico; o subsequente levantamento tectónico rasgou desfiladeiros fundos e
      as glaciações esculpiram os circos e vales em U. O parque preserva relevos cársticos notáveis, entre
      algares e vales secos.


      Os circos de Gavarnie, Estaubé e Troumouse e a muralha de Barroude constituem os cenários mais
      grandiosos da alta montanha pirenaica. O coração do parque abrange 45.707 ha repartidos por 15
      municípios, elevando-se dos 1.273 m até aos 3.298 m do Vignemale.


      Mais abaixo a montanha exibe uma vertente agropastoril. As pastagens montanas e as cabanas de pedra
      testemunham uma faina viva—simbiose de rocha agreste e labor humano reconhecida pela UNESCO em 1997 no
      conjunto transfronteiriço Pyrénées-Mont Perdu, partilhado com Ordesa.
    wildlife: >-
      A flora conta-se entre as mais ricas de França: cerca de 2.500 espécies de plantas superiores, mais de
      200 endémicas, como o amor-perfeito-de-lapeyrouse e a ervilhaca-prateada. A fauna soma 4.000 espécies,
      sendo 250 vertebrados, personificada pela [camurça-dos-pirineus](/especie/rupicapra_pyrenaica/).


      Nos céus plainam grandes rapinas: o [abutre-barbudo](/especie/gypaetus_barbatus/), o abutre-do-egito e a
      [águia-real](/especie/aquila_chrysaetos/). No solo encontram-se a camurça e a
      [marmota-alpina](/especie/marmota_marmota/), introduzida dos Alpes em 1948. Nas ribeiras gélidas vive a
      [toupeira-da-água](/especie/galemys_pyrenaicus/), um pequeno mamífero semiaquático muito raro. Outros
      mamíferos são a gineta e o íbex-ibérico, de regresso desde 2013 com mais de duzentos e cinquenta
      espécimes em 2020.


      O [urso-pardo](/especie/ursus_arctos/) protagoniza o historial mais delicado. Os derradeiros ursos
      autóctones resistiram nos vales de Aspe e Ossau; nos Pirinéus centrais foram libertados três ursos
      eslovenos: duas fêmeas em 1996 e um macho em 1997.


      No verão, os guardas do parque promovem visitas temáticas sobre as rapinas no vale de Luz-Gavarnie.
    visit: >-
      O parque e as lagoas de Néouvielle proporcionam um cenário privilegiado para caminhadas. Entre os pontos
      mais procurados contam-se o circo de Gavarnie, a lagoa de Orédon e a lagoa de Cap de Long, distribuídos
      por vales como Luz, Aure, Néouvielle, Cauterets, Ossau, Azun e Aspe.


      Para um percurso suave, o trilho de interpretação do Plan d'Aste encontra-se adaptado a todos os
      caminhantes.
    history: >-
      A proteção destas serras antecede a fundação do parque. Em 1935 a Sociedade Nacional de Aclimatação
      instituiu a reserva natural de Néouvielle, agregada em 1968 ao parque nacional, criado por decreto a 23
      de março de 1967. Foi concebido como um espaço livre sem vedações onde a fauna circula em total
      liberdade.


      O território reparte-se entre o coração protegido e a zona periférica. No núcleo as regras resguardam a
      paisagem e as espécies ameaçadas; na periferia as normas apoiam a fixação das gentes da montanha.
    before: >-
      O verão é a estação recomendada para a alta montanha. O afluxo é elevado em Gavarnie e na Pont
      d'Espagne, mas os vales altos de Aspe e Ossau garantem serenidade. Cumpre a regulamentação do coração do
      parque e confirma o estado dos percursos antes de partir.
    around: >-
      A apenas 1 km, do outro lado da fronteira, situa-se o [Parque Nacional de Ordesa e Monte
      Perdido](/lugar/parque-nacional-de-ordesa-y-monte-perdido/), com o qual partilha o sítio UNESCO e mais
      de 100 km de trilhos. A cerca de quinze quilómetros estende-se a [Floresta de
      Irati](/lugar/foret-d-irati---selva-de-irati/).


      Mais distante, o [Parque Nacional de
      Aigüestortes](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) partilha camurças, marmotas
      e abutre-barbudo, enquanto o [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) e o
      [Parque Nacional de Vanoise](/lugar/parc-national-de-la-vanoise/) partilham marmotas, abutre-barbudo e
      águia-real.
