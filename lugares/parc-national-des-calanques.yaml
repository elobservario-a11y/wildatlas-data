resumen:
  es: >-
    El primer parque nacional europeo a la vez terrestre, marino y periurbano: acantilados calizos y calas
    sobre praderas de posidonia a las puertas de Marsella.
  en: >-
    The first European national park that is at once terrestrial, marine and peri-urban: limestone cliffs and
    calanques above posidonia meadows at the gates of Marseille.
  fr: >-
    Le premier parc national européen à la fois terrestre, marin et périurbain : falaises calcaires et
    calanques sur des herbiers de posidonie aux portes de Marseille.
  de: >-
    Der erste europäische Nationalpark, der zugleich terrestrisch, marin und periurban ist: Kalksteinwände und
    Calanques über Posidonia-Wiesen vor den Toren Marseilles.
  it: >-
    Il primo parco nazionale europeo al contempo terrestre, marino e periurbano: falesie calcaree e calanques
    sulle praterie di posidonia alle porte di Marsiglia.
  pt: >-
    O primeiro parque nacional europeu ao mesmo tempo terrestre, marinho e periurbano: falésias calcárias e
    calanques sobre pradarias de posidónia às portas de Marselha.
unico:
  es: >-
    Acantilados de caliza blanca que se hunden en un mar con praderas de posidonia y paredes de coralígeno, a
    las puertas de Marsella.
  en: >-
    White limestone cliffs plunging into a sea with posidonia meadows and coralligenous walls, at the gates of
    Marseille.
  fr: >-
    Des falaises de calcaire blanc qui plongent dans une mer avec des herbiers de posidonie et des parois de
    coralligène, aux portes de Marseille.
  de: >-
    Weiße Kalksteinwände, die in ein Meer mit Posidonia-Wiesen und Korallenwänden stürzen, vor den Toren
    Marseilles.
  it: >-
    Falesie di calcare bianco che si tuffano in un mare con praterie di posidonia e pareti di coralligeno,
    alle porte di Marsiglia.
  pt: >-
    Falésias de calcário branco que mergulham num mar com pradarias de posidónia e paredes de coralogéneo, às
    portas de Marselha.
observaciones:
  es: >-
    Cada año, del 1 de junio al 30 de septiembre, el acceso a los macizos forestales de las Bouches-du-Rhône
    está regulado por decreto prefectoral por el riesgo de incendio, y con riesgo rojo queda prohibido. Con
    ese riesgo puedes seguir la costa en barco, pero está estrictamente prohibido desembarcar. Comprueba el
    estado antes de salir.


    Sugiton es el caso extremo. Se registraron picos de 2.500 visitantes al día, y el pisoteo hace resbalar la
    tierra hacia la playa y deja al descubierto las raíces de los pinos viejos. Para frenar la erosión, el
    parque exige una reserva gratuita en línea para entrar a las calanques de Sugiton y Pierres Tombées en
    temporada muy alta. Se abre con tres días de antelación, se cierra a las 18 h del día anterior y se anula
    si se cierran los macizos por riesgo de incendio.
texto:
  es:
    intro: >-
      En la cueva Cosquer quedan manos en negativo de hace 27.000 años, y hoy su entrada está a 37 metros de
      profundidad. El macizo de las Calanques cae a pico sobre el mar, a las puertas de Marsella. Es un parque
      nacional con tres caras a la vez, terrestre, marino y periurbano: 520 km², de los que 85 son tierra y el
      resto mar, con zonas núcleo de unas 8.500 hectáreas en tierra y 43.500 en el mar. El decreto de creación
      se firmó el 18 de abril de 2012.
    landscape: >-
      El macizo es sobre todo caliza del Mesozoico, de entre 250 y 65 millones de años, formada en mares
      cálidos del Jurásico y, sobre todo, del Cretácico. Los fósiles de algas, erizos y rudistas lo recuerdan.
      Los ríos hicieron el resto: excavaron valles hasta el mar y, con las variaciones del nivel marino, el
      litoral quedó cortado en decenas de calanques. La caliza, muy fisurada, está llena de grutas y
      cavidades, y de fuentes como Port-Miou y Bestouan, en Cassis.


      Bajo el agua se repite la historia en versión submarina: el coralígeno cubre las paredes y la posidonia
      las zonas llanas, y entre las especies con estatuto de protección o seguimiento científico están la
      posidonia, el coral rojo, el dátil de mar y la nacra. En tierra se han inventariado más de veintiséis
      medios naturales, unas novecientas especies de plantas y ochenta y tres especies protegidas.
    wildlife: >-
      En las aguas costeras se ven a veces tortugas y delfines, y entre los peces amenazados están el mero, el
      corvallo, el dentón y el [caballito de mar](/especie/hippocampus_guttulatus/) narigudo. La [foca
      monje](/especie/monachus_monachus/) es una historia perdida: la última de las Calanques fue abatida
      hacia 1945.


      En el aire y en tierra, el [águila de Bonelli](/especie/aquila_fasciata/), la [pardela
      cenicienta](/especie/calonectris_diomedea/) y la [pardela mediterránea](/especie/puffinus_yelkouan/)
      frecuentan el parque. Hay doce especies de reptiles y cuatro de anfibios, y el rinolofo se refugia en
      las cavidades kársticas del macizo. En la isla de Riou los halcones peregrinos se capturaban en la Edad
      Media para venderlos para la cetrería.


      En verano, el riesgo de incendio condiciona la visita: con riesgo rojo se cierra el acceso a los
      macizos.
    visit: >-
      Las Calanques se recorren a pie. El GR 51-98 cruza el macizo de oeste a este, y las calanques de
      Callelongue, Sormiou y Morgiou están habitadas y se llega por carretera; Cassis es otro punto de partida
      importante, desde Port-Miou. Los caminos son escarpados, con pasos de riesgo para caminantes sin
      experiencia y peligrosos con mistral.


      No hay puntos de agua en el macizo y apenas sombra: el parque pide al menos 1,5 litros por persona para
      media jornada. Tampoco hay papeleras, así que la basura se la lleva uno y se clasifica en casa. Respeta
      las zonas de regeneración de la vegetación, delimitadas con piquetas y alambre, y no muevas las piedras,
      que sirven de refugio a insectos y lagartos.
    history: >-
      La presencia humana es antiquísima. Las pinturas y grabados de la cueva Cosquer datan de entre 27.000 y
      19.000 años antes de Cristo y muestran animales terrestres y marinos, bisontes, íbices, caballos, focas
      y pingüinos; su entrada hoy está prohibida tras un accidente mortal de buceo. En la isla de Riou hay
      restos de ocupación de hace unos 8.000 años, cuando todavía era una península unida al macizo de
      Marseilleveyre. Más tarde llegaron los pastores, con rebaños en las tierras y en la isla de Riou, la
      «isla de las Cabras», y quemaban el monte para ganar pastos; hacia 1300 se levantaron torres de vigía en
      Marseilleveyre, en Maïre y en Riou para avisar a la ciudad de la llegada de piratas.


      La protección tiene raíces antiguas. A principios del siglo XX los Excursionnistes marseillais (1897) y
      el Club alpin promovieron el excursionismo y construyeron refugios y senderos, y ya en 1923 se fundó un
      comité de defensa para impedir la industrialización de En-Vau.
    before: >-
      Cada año, del 1 de junio al 30 de septiembre, el acceso a los macizos forestales de las Bouches-du-Rhône
      está regulado por decreto prefectoral por el riesgo de incendio, y con riesgo rojo queda prohibido. Con
      ese riesgo puedes seguir la costa en barco, pero está estrictamente prohibido desembarcar. Comprueba el
      estado antes de salir.


      Sugiton es el caso extremo. Se registraron picos de 2.500 visitantes al día, y el pisoteo hace resbalar
      la tierra hacia la playa y deja al descubierto las raíces de los pinos viejos. Para frenar la erosión,
      el parque exige una reserva gratuita en línea para entrar a las calanques de Sugiton y Pierres Tombées
      en temporada muy alta. Se abre con tres días de antelación, se cierra a las 18 h del día anterior y se
      anula si se cierran los macizos por riesgo de incendio.
    around: >-
      El atlas no tiene vecinos cercanos de las Calanques, pero sí lugares con los que comparte especies y
      hábitats, como la pardela mediterránea, la pardela cenicienta y la posidonia: el [Parco Nazionale
      dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/), el [Park prirode Lastovsko
      otočje](/lugar/park-prirode-lastovsko-otocje/) y [La Mola (Formentera)](/lugar/la-mola-formentera/).
  en:
    intro: >-
      In the Cosquer Cave, negative handprints remain from 27,000 years ago, and today its entrance is 37
      metres underwater. The Calanques massif falls sheer into the sea at the gates of Marseille. It is a
      national park with three faces at once — terrestrial, marine and peri-urban: 520 km², of which 85 are
      land and the rest sea, with core zones of about 8,500 hectares on land and 43,500 at sea. The founding
      decree was signed on 18 April 2012.
    landscape: >-
      The massif is mostly Mesozoic limestone, formed between 250 and 65 million years ago in the warm seas of
      the Jurassic and, above all, the Cretaceous. Fossils of algae, sea urchins and rudists are its
      witnesses. Rivers did the rest: they carved valleys to the sea, and with fluctuations in sea level the
      coastline was cut into dozens of calanques. The limestone, heavily fissured, is full of caves and
      cavities, and springs such as Port-Miou and Bestouan at Cassis.


      Underwater, history repeats in its submarine version: coralligenous communities cover the walls and
      posidonia covers the flats, and among the species with protected or scientifically monitored status are
      posidonia, red coral, date mussel and fan mussel. On land more than twenty-six natural habitats have
      been catalogued, along with about nine hundred plant species and eighty-three protected species.
    wildlife: >-
      In coastal waters turtles and dolphins are sometimes seen, and among threatened fish are the grouper,
      the brown meagre, the dentex and the long-snouted [seahorse](/especie/hippocampus_guttulatus/). The
      [monk seal](/especie/monachus_monachus/) is a lost story: the last one in the Calanques was shot around
      1945.


      In the air and on land, [Bonelli's eagle](/especie/aquila_fasciata/), the [Scopoli's
      shearwater](/especie/calonectris_diomedea/) and the [Yelkouan shearwater](/especie/puffinus_yelkouan/)
      frequent the park. There are twelve reptile species and four amphibian species, and the horseshoe bat
      shelters in the karstic cavities of the massif. On the island of Riou, peregrine falcons were captured
      in the Middle Ages to be sold for falconry.


      In summer, fire risk governs the visit: with red alert the massifs are closed.
    visit: >-
      The Calanques are explored on foot. The GR 51-98 crosses the massif from west to east, and the calanques
      of Callelongue, Sormiou and Morgiou are inhabited and reachable by road; Cassis is another important
      starting point, from Port-Miou. The paths are steep, with risky sections for inexperienced walkers and
      dangerous in the mistral.


      There are no water points in the massif and barely any shade: the park asks for at least 1.5 litres per
      person for half a day. There are no bins either, so you take your rubbish home and sort it there.
      Respect the vegetation regeneration zones, bounded by stakes and wire, and do not move the stones, which
      shelter insects and lizards.
    history: >-
      Human presence here is ancient. The paintings and engravings of the Cosquer Cave date from between
      27,000 and 19,000 years before Christ and depict terrestrial and marine animals — bison, ibex, horses,
      seals and penguins; entry today is forbidden following a fatal diving accident. On the island of Riou
      there are traces of occupation from about 8,000 years ago, when it was still a peninsula joined to the
      Marseilleveyre massif. Later came shepherds, with flocks on the land and on the island of Riou, the
      «island of the Goats», and they burned the scrub to gain pasture; around 1300 watchtowers were built at
      Marseilleveyre, Maïre and Riou to warn the city of approaching pirates.


      Protection has deep roots. At the beginning of the twentieth century the Excursionnistes marseillais
      (1897) and the Club alpin promoted hiking and built refuges and trails, and in 1923 a defence committee
      was founded to prevent the industrialisation of En-Vau.
    before: >-
      Each year, from 1 June to 30 September, access to the forested massifs of the Bouches-du-Rhône is
      regulated by prefectoral decree because of fire risk, and with red alert it is prohibited. With that
      alert you can still follow the coast by boat, but landing is strictly forbidden. Check conditions before
      setting out.


      Sugiton is the extreme case. Peaks of 2,500 visitors per day were recorded, and trampling sends soil
      sliding towards the beach and exposes the roots of old pines. To slow erosion, the park requires a free
      online reservation to enter the Sugiton and Pierres Tombées calanques during peak season. It opens three
      days in advance, closes at 18 h the day before and is cancelled if the massifs are closed due to fire
      risk.
    around: >-
      The atlas has no close neighbours to the Calanques, but it does share species and habitats — such as the
      Yelkouan shearwater, the Scopoli's shearwater and posidonia — with the [Tuscan Archipelago National
      Park](/lugar/parco-nazionale-arcipelago-toscano/), [Lastovo Archipelago Nature
      Park](/lugar/park-prirode-lastovsko-otocje/) and [La Mola (Formentera)](/lugar/la-mola-formentera/).
  fr:
    intro: >-
      Dans la grotte Cosquer restent des mains en négatif vieilles de 27 000 ans, et aujourd'hui son entrée
      est à 37 mètres de profondeur. Le massif des Calanques tombe à pic sur la mer, aux portes de Marseille.
      C'est un parc national avec trois visages à la fois — terrestre, marin et périurbain : 520 km², dont 85
      sont des terres et le reste de la mer, avec des zones cœur d'environ 8 500 hectares à terre et 43 500 en
      mer. Le décret de création a été signé le 18 avril 2012.
    landscape: >-
      Le massif est surtout du calcaire mésozoïque, formé entre 250 et 65 millions d'années, dans les mers
      chaudes du Jurassique et, surtout, du Crétacé. Les fossiles d'algues, d'oursins et de rudistes en
      témoignent. Les rivières ont fait le reste : elles ont creusé des vallées jusqu'à la mer, et avec les
      variations du niveau marin, le littoral a été découpé en dizaines de calanques. Le calcaire, très
      fissuré, est rempli de grottes et de cavités, et de sources comme Port-Miou et Bestouan, à Cassis.


      Sous l'eau, l'histoire se répète en version sous-marine : le coralligène couvre les parois et la
      posidonie les zones planes, et parmi les espèces avec un statut de protection ou de suivi scientifique
      figurent la posidonie, le corail rouge, la datte de mer et la grande nacre. À terre, plus de vingt-six
      milieux naturels ont été inventoriés, environ neuf cents espèces de plantes et quatre-vingt-trois
      espèces protégées.
    wildlife: >-
      Dans les eaux côtières on voit parfois des tortues et des dauphins, et parmi les poissons menacés
      figurent le mérou, le corb, la denté et l'[hippocampe](/especie/hippocampus_guttulatus/) à museau long.
      Le [phoque moine](/especie/monachus_monachus/) est une histoire perdue : le dernier des Calanques a été
      abattu vers 1945.


      Dans les airs et sur terre, l'[aigle de Bonelli](/especie/aquila_fasciata/), le [puffin
      cendré](/especie/calonectris_diomedea/) et le [puffin yelkouan](/especie/puffinus_yelkouan/) fréquentent
      le parc. Il y a douze espèces de reptiles et quatre d'amphibiens, et le rhinolophe se réfugie dans les
      cavités karstiques du massif. Sur l'île de Riou, des faucons pèlerins étaient capturés au Moyen Âge pour
      être vendus pour la fauconnerie.


      En été, le risque d'incendie conditionne la visite : avec un risque rouge, l'accès aux massifs est
      interdit.
    visit: >-
      Les Calanques se parcourent à pied. Le GR 51-98 traverse le massif d'ouest en est, et les calanques de
      Callelongue, Sormiou et Morgiou sont habitées et accessibles par la route ; Cassis est un autre point de
      départ important, depuis Port-Miou. Les sentiers sont escarpés, avec des passages risqués pour les
      randonneurs sans expérience et dangereux par mistral.


      Il n'y a pas de points d'eau dans le massif et presque pas d'ombre : le parc demande au moins 1,5 litre
      par personne pour une demi-journée. Il n'y a pas non plus de poubelles, alors les déchets, on les ramène
      chez soi et on les trie. Respectez les zones de régénération de la végétation, délimitées par des
      piquets et du fil de fer, et ne déplacez pas les pierres, qui servent de refuge aux insectes et aux
      lézards.
    history: >-
      La présence humaine est très ancienne. Les peintures et gravures de la grotte Cosquer datent de 27 000 à
      19 000 ans avant Jésus-Christ et montrent des animaux terrestres et marins — bisons, bouquetins,
      chevaux, phoques et pingouins ; son entrée est aujourd'hui interdite après un accident mortel de
      plongée. Sur l'île de Riou, des traces d'occupation remontent à environ 8 000 ans, quand elle était
      encore une péninsule reliée au massif de Marseilleveyre. Plus tard vinrent les bergers, avec des
      troupeaux sur les terres et sur l'île de Riou, «l'île des Chèvres», et ils brûlaient le maquis pour
      gagner des pâturages ; vers 1300, des tours de guet furent érigées à Marseilleveyre, Maïre et Riou pour
      avertir la ville de l'arrivée des pirates.


      La protection a des racines anciennes. Au début du vingtième siècle, les Excursionnistes marseillais
      (1897) et le Club alpin promurent la randonnée et construisirent des refuges et des sentiers, et dès
      1923 un comité de défense fut fondé pour empêcher l'industrialisation d'En-Vau.
    before: >-
      Chaque année, du 1er juin au 30 septembre, l'accès aux massifs forestiers des Bouches-du-Rhône est
      réglementé par arrêté préfectoral en raison du risque d'incendie, et avec un risque rouge il est
      interdit. Avec ce risque, vous pouvez longer la côte en bateau, mais il est strictement interdit de
      débarquer. Vérifiez la situation avant de partir.


      Sugiton est le cas extrême. Des pics de 2 500 visiteurs par jour ont été enregistrés, et le piétinement
      fait glisser la terre vers la plage et met à nu les racines des vieux pins. Pour freiner l'érosion, le
      parc exige une réservation gratuite en ligne pour entrer dans les calanques de Sugiton et des Pierres
      Tombées en très haute saison. Elle ouvre trois jours à l'avance, ferme à 18 h la veille et est annulée
      si les massifs sont fermés pour risque d'incendie.
    around: >-
      L'atlas n'a pas de voisins proches des Calanques, mais des lieux partageant des espèces et des habitats
      — comme le puffin yelkouan, le puffin cendré et la posidonie — avec le [Parc National de l'Archipel
      Toscan](/lugar/parco-nazionale-arcipelago-toscano/), le [Parc naturel du
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) et [La Mola (Formentera)](/lugar/la-mola-formentera/).
  de:
    intro: >-
      In der Höhle Cosquer sind Handabdrücke aus der Zeit vor 27 000 Jahren erhalten, und heute liegt ihr
      Eingang 37 Meter unter Wasser. Das Calanques-Massiv fällt steil ins Meer ab, vor den Toren Marseilles.
      Es ist ein Nationalpark mit drei Gesichtern zugleich — terrestrisch, marin und periurban: 520 km², davon
      85 Land und der Rest Meer, mit Kernzonen von rund 8 500 Hektar an Land und 43 500 im Meer. Das
      Gründungsdekret wurde am 18. April 2012 unterzeichnet.
    landscape: >-
      Das Massiv besteht hauptsächlich aus mesozoischem Kalkstein, der vor 250 bis 65 Millionen Jahren in den
      warmen Meeren des Jura und vor allem der Kreide entstanden ist. Fossilien von Algen, Seeigeln und
      Rudisten erinnern daran. Die Flüsse taten den Rest: Sie schnitten Täler bis zum Meer, und mit den
      Schwankungen des Meeresspiegels wurde die Küste in Dutzende von Calanques zerschnitten. Der stark
      zerklüftete Kalkstein ist voller Höhlen und Hohlräume sowie Quellen wie Port-Miou und Bestouan bei
      Cassis.


      Unter Wasser wiederholt sich die Geschichte in ihrer submarinen Version: Korallenwände bedecken die
      Flanken, Posidonia die Flachgebiete, und zu den Arten mit Schutzstatus oder wissenschaftlicher
      Überwachung zählen Posidonia, Rote Koralle, Dattelmuschel und Steckmuschel. An Land wurden mehr als
      sechsundzwanzig natürliche Lebensräume, rund neunhundert Pflanzenarten und dreiundachtzig geschützte
      Arten erfasst.
    wildlife: >-
      In den Küstengewässern werden manchmal Schildkröten und Delfine gesehen, und zu den bedrohten Fischen
      zählen der Zackenbarsch, der Umberfisch, der Zahnbrassen und das langschnäuzige
      [Seepferdchen](/especie/hippocampus_guttulatus/). Die [Mönchsrobbe](/especie/monachus_monachus/) ist
      eine verlorene Geschichte: Die letzte der Calanques wurde um 1945 getötet.


      In der Luft und an Land suchen der [Habichtsadler](/especie/aquila_fasciata/), der
      [Scopoli-Sturmtaucher](/especie/calonectris_diomedea/) und der
      [Yelkouan-Sturmtaucher](/especie/puffinus_yelkouan/) den Park auf. Es gibt zwölf Reptilienarten und vier
      Amphibienarten, und die Hufeisennase zieht sich in die Karsthöhlen des Massivs zurück. Auf der Insel
      Riou wurden im Mittelalter Wanderfalken gefangen, um sie für die Falknerei zu verkaufen.


      Im Sommer bestimmt die Brandgefahr den Besuch: Bei roter Warnstufe wird der Zugang zu den Massifs
      gesperrt.
    visit: >-
      Die Calanques werden zu Fuß erkundet. Der GR 51-98 durchquert das Massiv von West nach Ost, und die
      Calanques von Callelongue, Sormiou und Morgiou sind bewohnt und per Straße erreichbar; Cassis ist ein
      weiterer wichtiger Ausgangspunkt, von Port-Miou aus. Die Wege sind steil, mit riskanten Passagen für
      unerfahrene Wanderer und gefährlich bei Mistral.


      Im Massiv gibt es keine Wasserstellen und kaum Schatten: Der Park empfiehlt mindestens 1,5 Liter pro
      Person für einen halben Tag. Es gibt auch keine Mülleimer, also nimmt man den Abfall mit nach Hause und
      trennt ihn dort. Achte auf die Vegetationsregenerationszonen, die mit Pfählen und Draht abgegrenzt sind,
      und bewege keine Steine, die Insekten und Eidechsen Unterschlupf bieten.
    history: >-
      Die menschliche Präsenz ist uralt. Die Malereien und Gravierungen der Höhle Cosquer stammen aus der Zeit
      von 27 000 bis 19 000 vor Christus und zeigen Land- und Meerestiere — Bisons, Steinböcke, Pferde, Robben
      und Pinguine; der Eingang ist heute nach einem tödlichen Tauchunfall verboten. Auf der Insel Riou gibt
      es Spuren einer Besiedlung von vor rund 8 000 Jahren, als sie noch eine Halbinsel war, die mit dem
      Marseilleveyre-Massiv verbunden war. Später kamen Hirten mit Herden auf dem Festland und auf der Insel
      Riou, der «Insel der Ziegen», und brannten das Gestrüpp ab, um Weideland zu gewinnen; um 1300 wurden auf
      Marseilleveyre, Maïre und Riou Wachttürme errichtet, um die Stadt vor herannahenden Piraten zu warnen.


      Der Schutz hat alte Wurzeln. Zu Beginn des zwanzigsten Jahrhunderts förderten die Excursionnistes
      marseillais (1897) und der Club alpin das Wandern und bauten Hütten und Wege, und schon 1923 wurde ein
      Schutzkomitee gegründet, um die Industrialisierung von En-Vau zu verhindern.
    before: >-
      Jedes Jahr, vom 1. Juni bis 30. September, ist der Zugang zu den Waldmassifs der Bouches-du-Rhône durch
      präfekturalen Erlass wegen Brandgefahr geregelt, und bei roter Warnstufe ist er verboten. Bei dieser
      Stufe kannst du die Küste noch per Boot entlangfahren, aber das Anlanden ist streng verboten. Prüfe die
      Bedingungen vor dem Aufbruch.


      Sugiton ist der Extremfall. Spitzen von 2 500 Besuchern pro Tag wurden verzeichnet, und das Trampeln
      lässt Erde Richtung Strand rutschen und legt die Wurzeln alter Kiefern frei. Um die Erosion zu bremsen,
      verlangt der Park eine kostenlose Online-Reservierung für den Zugang zu den Calanques von Sugiton und
      Pierres Tombées in der Hochsaison. Sie öffnet drei Tage im Voraus, schließt um 18 Uhr am Vortag und wird
      annulliert, wenn die Massifs wegen Brandgefahr gesperrt sind.
    around: >-
      Der Atlas hat keine nahen Nachbarn der Calanques, teilt aber Arten und Lebensräume — wie den
      Yelkouan-Sturmtaucher, den Scopoli-Sturmtaucher und Posidonia — mit dem [Nationalpark Toskanischer
      Archipel](/lugar/parco-nazionale-arcipelago-toscano/), dem [Naturpark
      Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/) und [La Mola
      (Formentera)](/lugar/la-mola-formentera/).
  it:
    intro: >-
      Nella grotta Cosquer restano mani in negativo di 27 000 anni fa, e oggi l'ingresso è a 37 metri di
      profondità. Il massiccio delle Calanques cade a picco sul mare, alle porte di Marsiglia. È un parco
      nazionale con tre volti insieme — terrestre, marino e periurbano: 520 km², di cui 85 sono terra e il
      resto mare, con zone nucleo di circa 8 500 ettari a terra e 43 500 in mare. Il decreto istitutivo è
      stato firmato il 18 aprile 2012.
    landscape: >-
      Il massiccio è soprattutto calcare mesozoico, formatosi tra 250 e 65 milioni di anni fa nei mari caldi
      del Giurassico e, soprattutto, del Cretaceo. I fossili di alghe, ricci di mare e rudiste ne sono
      testimoni. I fiumi fecero il resto: scavarono valli fino al mare, e con le variazioni del livello marino
      la costa fu tagliata in decine di calanques. Il calcare, molto fessurato, è pieno di grotte e cavità, e
      di sorgenti come Port-Miou e Bestouan, a Cassis.


      Sotto l'acqua la storia si ripete in versione sottomarina: il coralligeno ricopre le pareti e la
      posidonia le zone piane, e tra le specie con statuto di protezione o sorveglianza scientifica ci sono la
      posidonia, il corallo rosso, la dattero di mare e la nacchera. A terra sono stati censiti più di
      ventisei ambienti naturali, circa novecento specie di piante e ottantatré specie protette.
    wildlife: >-
      Nelle acque costiere si vedono a volte tartarughe e delfini, e tra i pesci minacciati ci sono la cernia,
      il corvallo, il dentice e il [cavalluccio marino](/especie/hippocampus_guttulatus/) dal muso lungo. La
      [foca monaca](/especie/monachus_monachus/) è una storia perduta: l'ultima delle Calanques fu abbattuta
      verso il 1945.


      In aria e sulla terraferma, l'[aquila del Bonelli](/especie/aquila_fasciata/), la [berta
      maggiore](/especie/calonectris_diomedea/) e la [berta del Mediterraneo](/especie/puffinus_yelkouan/)
      frequentano il parco. Ci sono dodici specie di rettili e quattro di anfibi, e il ferro di cavallo si
      rifugia nelle cavità carsiche del massiccio. Sull'isola di Riou i falchi pellegrini venivano catturati
      nel Medioevo per essere venduti per la falconeria.


      D'estate, il rischio d'incendio condiziona la visita: con allerta rossa l'accesso ai massicci è vietato.
    visit: >-
      Le Calanques si percorrono a piedi. Il GR 51-98 attraversa il massiccio da ovest a est, e le calanques
      di Callelongue, Sormiou e Morgiou sono abitate e raggiungibili in auto; Cassis è un altro importante
      punto di partenza, da Port-Miou. I sentieri sono ripidi, con passaggi rischiosi per escursionisti senza
      esperienza e pericolosi con il maestrale.


      Non ci sono punti d'acqua nel massiccio e quasi nessuna ombra: il parco chiede almeno 1,5 litri a
      persona per mezza giornata. Non ci sono nemmeno cestini, quindi i rifiuti si portano a casa e si
      differenziano lì. Rispetta le zone di rigenerazione della vegetazione, delimitate con paletti e filo, e
      non spostare le pietre, che servono da rifugio a insetti e lucertole.
    history: >-
      La presenza umana è antichissima. Le pitture e le incisioni della grotta Cosquer datano tra 27 000 e 19
      000 anni avanti Cristo e mostrano animali terrestri e marini — bisonti, stambecchi, cavalli, foche e
      pinguini; l'ingresso è oggi vietato dopo un incidente mortale di immersione. Sull'isola di Riou ci sono
      tracce di insediamento di circa 8 000 anni fa, quando era ancora una penisola unita al massiccio di
      Marseilleveyre. Più tardi arrivarono i pastori, con greggi sulle terre e sull'isola di Riou, «l'isola
      delle Capre», e bruciavano la macchia per guadagnare pascoli; intorno al 1300 vennero erette torri di
      avvistamento a Marseilleveyre, Maïre e Riou per avvisare la città dell'arrivo dei pirati.


      La protezione ha radici antiche. All'inizio del ventesimo secolo gli Excursionnistes marseillais (1897)
      e il Club alpin promuovono l'escursionismo e costruirono rifugi e sentieri, e già nel 1923 fu fondato un
      comitato di difesa per impedire l'industrializzazione di En-Vau.
    before: >-
      Ogni anno, dal 1° giugno al 30 settembre, l'accesso ai massicci forestali delle Bouches-du-Rhône è
      regolato da decreto prefettizio a causa del rischio d'incendio, e con allerta rossa è vietato. Con tale
      allerta puoi ancora seguire la costa in barca, ma è severamente vietato sbarcare. Controlla le
      condizioni prima di partire.


      Sugiton è il caso estremo. Sono stati registrati picchi di 2 500 visitatori al giorno, e il calpestio fa
      scivolare la terra verso la spiaggia e scopre le radici dei pini vecchi. Per frenare l'erosione, il
      parco richiede una prenotazione gratuita online per accedere alle calanques di Sugiton e Pierres Tombées
      in alta stagione. Si apre tre giorni in anticipo, si chiude alle 18 del giorno precedente e viene
      annullata se i massicci sono chiusi per rischio d'incendio.
    around: >-
      L'atlas non ha vicini prossimi alle Calanques, ma condivide specie e habitat — come la berta del
      Mediterraneo, la berta maggiore e la posidonia — con il [Parco Nazionale Arcipelago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/), il [Parco naturale dell'arcipelago di
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) e [La Mola (Formentera)](/lugar/la-mola-formentera/).
  pt:
    intro: >-
      Na gruta Cosquer ficaram mãos em negativo de há 27 000 anos, e hoje a sua entrada está a 37 metros de
      profundidade. O maciço das Calanques cai a pique sobre o mar, às portas de Marselha. É um parque
      nacional com três faces ao mesmo tempo — terrestre, marinho e periurbano: 520 km², dos quais 85 são
      terra e o resto mar, com zonas núcleo de cerca de 8 500 hectares em terra e 43 500 no mar. O decreto de
      criação foi assinado a 18 de abril de 2012.
    landscape: >-
      O maciço é sobretudo calcário mesozoico, formado entre 250 e 65 milhões de anos atrás nos mares quentes
      do Jurássico e, sobretudo, do Cretácico. Os fósseis de algas, ouriços-do-mar e rudistas são testemunhas
      disso. Os rios fizeram o resto: escavaram vales até ao mar e, com as variações do nível marinho, o
      litoral ficou cortado em dezenas de calanques. O calcário, muito fissurado, está cheio de grutas e
      cavidades, e de nascentes como Port-Miou e Bestouan, em Cassis.


      Sob a água a história repete-se em versão submarina: o coralogéneo cobre as paredes e a posidónia as
      zonas planas, e entre as espécies com estatuto de proteção ou acompanhamento científico estão a
      posidónia, o coral vermelho, a tâmara-do-mar e a nacra. Em terra foram inventariados mais de vinte e
      seis meios naturais, cerca de novecentas espécies de plantas e oitenta e três espécies protegidas.
    wildlife: >-
      Nas águas costeiras veem-se às vezes tartarugas e golfinhos, e entre os peixes ameaçados estão o
      garoupa, o corvallo, o dentão e o [cavalo-marinho](/especie/hippocampus_guttulatus/) de focinho
      comprido. A [foca-monge](/especie/monachus_monachus/) é uma história perdida: a última das Calanques foi
      abatida por volta de 1945.


      No ar e em terra, a [águia de Bonelli](/especie/aquila_fasciata/), a
      [cagarra-de-Scopoli](/especie/calonectris_diomedea/) e a
      [cagarra-do-mediterrâneo](/especie/puffinus_yelkouan/) frequentam o parque. Há doze espécies de répteis
      e quatro de anfíbios, e o morcego-de-ferradura refugia-se nas cavidades cársicas do maciço. Na ilha de
      Riou, falcões-peregrinos eram capturados na Idade Média para serem vendidos para a falcoaria.


      No verão, o risco de incêndio condiciona a visita: com alerta vermelho fecha-se o acesso aos maciços.
    visit: >-
      As Calanques percorrem-se a pé. O GR 51-98 atravessa o maciço de oeste a leste, e as calanques de
      Callelongue, Sormiou e Morgiou são habitadas e acessíveis de carro; Cassis é outro ponto de partida
      importante, a partir de Port-Miou. Os caminhos são escarpados, com passagens de risco para caminhantes
      sem experiência e perigosos com o mistral.


      Não há pontos de água no maciço e quase nenhuma sombra: o parque pede pelo menos 1,5 litros por pessoa
      para meio dia. Também não há caixotes do lixo, por isso o lixo leva-se para casa e separa-se lá.
      Respeita as zonas de regeneração da vegetação, delimitadas com estacas e arame, e não mexas nas pedras,
      que servem de abrigo a insetos e lagartixas.
    history: >-
      A presença humana é antiquíssima. As pinturas e gravuras da gruta Cosquer datam de entre 27 000 e 19 000
      anos antes de Cristo e mostram animais terrestres e marinhos — bisões, íbices, cavalos, focas e
      pinguins; a sua entrada está hoje proibida após um acidente mortal de mergulho. Na ilha de Riou há
      vestígios de ocupação de há cerca de 8 000 anos, quando ainda era uma península unida ao maciço de
      Marseilleveyre. Mais tarde chegaram os pastores, com rebanhos nas terras e na ilha de Riou, a «ilha das
      Cabras», e queimavam o mato para ganhar pastagens; por volta de 1300 foram erguidas torres de vigia em
      Marseilleveyre, Maïre e Riou para avisar a cidade da chegada de piratas.


      A proteção tem raízes antigas. No início do século XX os Excursionnistes marseillais (1897) e o Club
      alpin promoveram o excursionismo e construíram abrigos e trilhos, e já em 1923 foi fundado um comité de
      defesa para impedir a industrialização de En-Vau.
    before: >-
      Todos os anos, de 1 de junho a 30 de setembro, o acesso aos maciços florestais das Bouches-du-Rhône é
      regulado por decreto prefeitural devido ao risco de incêndio, e com alerta vermelho é proibido. Com esse
      alerta podes ainda seguir a costa de barco, mas é estritamente proibido desembarcar. Verifica as
      condições antes de partir.


      Sugiton é o caso extremo. Foram registados picos de 2 500 visitantes por dia, e o pisoteio faz deslizar
      a terra em direção à praia e expõe as raízes dos pinheiros velhos. Para travar a erosão, o parque exige
      uma reserva gratuita online para entrar nas calanques de Sugiton e Pierres Tombées em época de grande
      afluência. Abre três dias de antecedência, fecha às 18 h do dia anterior e é cancelada se os maciços
      estiverem fechados por risco de incêndio.
    around: >-
      O atlas não tem vizinhos próximos das Calanques, mas partilha espécies e habitats — como a
      cagarra-do-mediterrâneo, a cagarra-de-Scopoli e a posidónia — com o [Parque Nacional do Arquipélago
      Toscano](/lugar/parco-nazionale-arcipelago-toscano/), o [Parque Natural do Arquipélago de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) e [La Mola (Formentera)](/lugar/la-mola-formentera/).
