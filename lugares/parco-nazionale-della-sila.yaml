resumen:
  es: >-
    El 'Gran Bosque de Italia', inmensa meseta boscosa de pino laricio (*Pinus nigra laricio*) centenario y
    los gigantescos lagos interiores Cecita y Arvo.
  en: >-
    The 'Great Forest of Italy', a colossal highland plateau of centuries-old Corsican pine (*Pinus nigra
    laricio*) and giant inland lakes Cecita and Arvo.
  fr: >-
    La « Grande Forêt d'Italie », immense plateau d'altitude voué aux pins laricio (*Pinus nigra laricio*)
    centenaires et aux grands lacs intérieurs Cecita et Arvo.
  de: >-
    Der 'Große Wald Italiens', eine weite Hochebene aus jahrhundertealten kalabrischen Schwarzkiefern (*Pinus
    nigra laricio*) und den Bergseen Cecita und Arvo.
  it: >-
    Il 'Gran Bosco d'Italia', immenso altopiano montano di pino laricio (*Pinus nigra laricio*) centenario e
    dei grandi laghi interni Cecita e Arvo.
  pt: >-
    A 'Grande Floresta de Itália', imenso planalto montanhoso de pinheiro-larício (*Pinus nigra laricio*)
    centenário e dos grandes lagos interiores Cecita e Arvo.
unico:
  es: >-
    Aquí el pino laricio, el «rey del bosque silano», se impone al haya, y bajo sus copas viven el lobo, el
    ciervo y una ardilla de pelaje negro.
  en: >-
    Here the Calabrian black pine, «king of the Sila woods», outcompetes the beech, and beneath its canopy
    live wolves, red deer, and an endemic black-furred squirrel.
  fr: >-
    Le pin laricio de Calabre, « roi de la forêt silane », y supplante le hêtre, abritant sous ses ramures le
    loup, le cerf et un écureuil noir endémique.
  de: >-
    Hier behauptet sich die kalabrische Schwarzkiefer als «Königin des Sila-Waldes» gegen die Buche; unter
    ihren Kronen leben Wolf, Hirsch und ein schwarzes Eichhörnchen.
  it: >-
    Qui il pino laricio, il «re del bosco silano», si impone sul faggio, e sotto le sue chiome vivono il lupo,
    il cervo e uno scoiattolo dal manto nero.
  pt: >-
    Aqui o pinheiro-larício, o «rei da floresta da Sila», impõe-se à faia, abrigando sob as suas copas o lobo,
    o veado e um esquilo de pelagem negra.
observaciones:
  es: >-
    Comprueba el estado de los senderos y la apertura de los centros antes de salir. Natura Italia, el portal
    del parque, sirve para elegir ruta según su desnivel y su duración.
texto:
  es:
    intro: >-
      Hay montañas que parecen otra tierra. La Sila, en pleno corazón de Calabria, se parece tanto a los Alpes
      por su estructura de granito que en 1898 alguien la bautizó «Alpi Calabresi». El Parque Nacional de la
      Sila reúne 73.695 hectáreas de ese país interior, con la sede en Lorica, y lo define un dato: es el
      parque nacional italiano con mayor proporción de bosque, cerca del 80 % de su superficie.
    landscape: >-
      La Sila es un macizo con núcleo de granito y rocas metamórficas, de estructura parecida a la de los
      Alpes. Su cima más alta es el Monte Botte Donato, con 1.929 metros. El parque abarca las tres comarcas
      silanas, la Greca, la Grande y la Piccola; la Grande es la más extensa y reúne las mayores cumbres y
      todos los principales embalses.


      Los lagos son obra humana, construidos en la primera mitad del siglo XX. Tres de ellos, Ampollino, Arvo
      y Ariamacina, quedan dentro del parque. Por el parque pasan el Crati y el Neto, los dos ríos más largos
      e importantes de Calabria.


      La vegetación sube en pisos. Entre los 1.100 y los 1.600 metros domina casi sin rival el pino laricio.
      Por encima de los 1.400 metros aparece el haya, a menudo con abeto blanco, y en las hondonadas húmedas,
      turberas con plantas que llegaron al sur durante las glaciaciones. Los pinares crecen sobre suelos
      graníticos, ácidos y arenosos, donde un pino tan rústico gana la partida al haya.
    wildlife: >-
      El lobo es el símbolo del parque. Se calculan tres manadas y entre 15 y 20 ejemplares en toda la Sila.
      El ciervo se había extinguido a principios del siglo XX y volvió en los años ochenta a la reserva de
      Golia-Corvo. Y por los bosques corre la ardilla negra meridional, el principal roedor de la montaña, que
      llega hasta los parques de los pueblos.


      Para los aficionados a las aves hay 113 especies registradas, 57 de ellas de interés de conservación.
      Vuelan el azor, el gavilán, el ratonero y los milanos; entre los pícidos destaca el pico negro, la
      especie más importante del grupo. Desde el invierno de 2016 se documentó además la invernada de la
      cigüeña negra, algo excepcional. Entre los animales pequeños, el parque tiene 12 especies de anfibios y
      10 de reptiles de interés herpetológico, entre ellos el sapillo de vientre amarillo apenino.
    visit: >-
      La puerta más completa es el centro Cupone, junto al lago Cecita, cerca de Camigliatello Silano. Es un
      «museo verde» con senderos naturalistas, observatorios de fauna, museo, jardín geológico y un jardín
      botánico accesible; en su reserva se puede ver el gamo en un recinto. El otro centro grande es el A.
      Garcea, junto a Villaggio Mancuso, y en Cotronei el Museo dell'Acqua e dell'Energia explica con medios
      interactivos los pueblos, la flora y la fauna del parque. Los centros incluyen también aulas verdes, un
      vivero de la biodiversidad silana y centros de aclimatación para lobo, ciervo, corzo y búho real.


      La red de senderos suma 600 kilómetros, con 66 senderos principales, 51 secundarios y cinco tramos del
      Sentiero Italia. Una ruta para empezar es el Sentiero dei Caprioli, un circuito de cinco horas por
      Fossiata, Cecita y Cozzo del Principe, en una de las zonas más protegidas del parque, refugio de
      ciervos, corzos y lobos. El parque la aconseja en julio y agosto. En el valle del Cecita vive el
      «Patriarca della Sila», un abeto blanco de más de seis metros de circunferencia en la base, entre los
      árboles más viejos del parque. Para elegir itinerario, el portal y la app Natura Italia dan la longitud,
      el desnivel, la dificultad y la duración de cada uno.
    history: >-
      La historia de la Sila es la de un bosque disputado. Desde finales del siglo XVIII, particulares
      usurparon tierras públicas y talaron para cultivar, y los campesinos veían en el bosque un «ladrón de
      tierra»: de ahí los incendios. La primera propuesta de parque nacional data de 1923, pero el decreto
      definitivo no llegó hasta el 14 de noviembre de 2002. Antes se había creado el Parque Nacional de
      Calabria con tres reservas separadas por decenas de kilómetros.


      Hoy el parque contiene nueve reservas naturales biogenéticas; Fallistro protege los Giganti della Sila y
      Golia-Corvo acoge los ciervos. En los valles, el pastoreo con trashumancia y alpeaje sigue vivo. La
      UNESCO reconoció además la Sila como la décima reserva de la biosfera de Italia.
    before: >-
      Comprueba el estado de los senderos y la apertura de los centros antes de salir. Natura Italia, el
      portal del parque, sirve para elegir ruta según su desnivel y su duración.
    around: >-
      La Sila no tiene vecinos publicados en el atlas, pero sí parientes lejanos. Comparte pico negro y lobo
      con el [Parque Nacional de Aspromonte](/lugar/parco-nazionale-dell-aspromonte/), también en Calabria, y
      con la [Reserva de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/).
  en:
    intro: >-
      There are mountains that evoke an entirely different land. In the heart of Calabria, the Sila resembles
      the Alps so closely in its granite structure that in 1898 it was dubbed the «Calabrian Alps». Sila
      National Park encompasses 73,695 hectares of this wild upland territory, headquartered in Lorica,
      distinguished by a striking metric: it is the Italian national park with the highest percentage of
      forest cover, nearly 80 % of its total area.
    landscape: >-
      The Sila is an ancient highland massif with a crystalline core of granites and metamorphic rocks,
      structurally akin to the Alps. Its highest apex is Monte Botte Donato, rising to 1,929 metres. The park
      spans all three historical sectors of the plateau: Sila Greca, Sila Grande, and Sila Piccola; Sila
      Grande is the most expansive, holding the highest summits and the largest artificial reservoirs.


      The lakes are twentieth-century creations built during the first half of the century. Three of
      them—Ampollino, Arvo, and Ariamacina—lie within the national park. Across the plateau run the Crati and
      Neto, the two longest and most vital rivers of Calabria.


      Vegetation arranges into distinct altitudinal belts. Between 1,100 and 1,600 metres dominates almost
      exclusively the Calabrian black pine (Pinus nigra laricio). Above 1,400 metres beech appears, often
      alongside silver fir, while damp depressions foster relict peat bogs harbouring plant species that
      migrated south during Pleistocene glaciations. The pine forests thrive on sandy, acidic granitic soils
      where this hardy conifer easily outcompetes beech.
    wildlife: >-
      The wolf is the proud symbol of the national park, with an estimated three packs and between 15 and 20
      individuals roaming the plateau. Red deer vanished early in the twentieth century and were successfully
      reintroduced in the nineteen-eighties in the Golia-Corvo reserve. Through the forest canopy scurries the
      southern black squirrel, the iconic arboreal rodent of these mountains, often venturing into village
      parks.


      For birdwatchers, the park records 113 avian species, 57 of which are of high conservation priority.
      Northern goshawk, Eurasian sparrowhawk, common buzzard, and kites hunt overhead; among woodpeckers, the
      black woodpecker stands out as the keystone forest species. Since the winter of 2016, ornithologists
      have documented wintering black storks, an exceptional biological phenomenon. Among smaller fauna, the
      park shelters 12 amphibian and 10 reptile species of herpetological interest, including the Apennine
      yellow-bellied toad.
    visit: >-
      The most comprehensive gateway is the Cupone Visitor Centre near Lake Cecita, close to Camigliatello
      Silano. It functions as an open-air eco-museum featuring nature trails, wildlife observatories, a
      geological garden, and a fully accessible botanical garden, with an adjacent enclosure for fallow deer.
      Another major hub is Centro Visite A. Garcea near Villaggio Mancuso, while in Cotronei the Museum of
      Water and Energy explains the park's cultural and natural heritage through interactive exhibits.
      Facilities also include nature classrooms, a native biodiversity nursery, and rehabilitation enclosures
      for wolf, deer, roe deer, and eagle-owl.


      The trail network totals 600 kilometres, featuring 66 primary paths, 51 secondary routes, and five
      sections of the Sentiero Italia. An ideal introductory walk is the Sentiero dei Caprioli, a five-hour
      loop traversing Fossiata, Lake Cecita, and Cozzo del Principe through pristine core habitats. Park
      managers recommend it in July and August. In the Cecita valley stands the «Patriarca della Sila», an
      immense silver fir measuring over six metres in basal circumference, one of the oldest living trees in
      the park. The official Natura Italia portal and mobile app detail distances, elevations, and durations
      for all trails.
    history: >-
      The history of the Sila is one of a long-contested woodland. From the late eighteenth century, private
      encroachers seized public commons and cleared ancient woods for agriculture, leading peasants to
      perceive the forest as a competitor for arable land and provoking intentional wildfires. The first
      proposal for a national park arose in 1923, though formal establishment did not occur until 14 November
      2002. Previously, the historic Calabria National Park had protected three separated forest sectors.


      Today the park encompasses nine state biogenetic nature reserves; Fallistro protects the ancient Giganti
      della Sila, and Golia-Corvo provides a sanctuary for red deer. In rural valleys, ancestral transhumance
      remains actively practised. UNESCO also designated the Sila as Italy's tenth Biosphere Reserve.
    before: >-
      Check trail conditions and visitor centre opening times before travelling. Use Natura Italia, the
      official park portal, to select routes suited to your fitness and schedule.
    around: >-
      The Sila has no immediate neighbouring atlas entries, but shares ancient fauna with distant parks: it
      shares the black woodpecker and grey wolf with [Aspromonte National
      Park](/lugar/parco-nazionale-dell-aspromonte/) in southern Calabria, and with the [Muniellos
      Reserve](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) in northern Spain.
  fr:
    intro: >-
      Il est des massifs qui dépaysent totalement. La Sila, au cœur même de la Calabre, rappelle à tel point
      les Alpes par son soubassement granitique qu'en 1898 on lui donna le surnom d'« Alpes calabraises ». Le
      parc national de la Sila rassemble 73 695 hectares de cette terre intérieure, avec siège à Lorica,
      caractérisé par un record : c'est le parc national italien présentant le plus fort taux de boisement,
      près de 80 % de son territoire.
    landscape: >-
      La Sila forme un haut plateau ancien au socle de granites et de roches métamorphiques, structuralement
      semblable aux Alpes. Son point culminant est le Monte Botte Donato, à 1 929 mètres d'altitude. Le parc
      englobe les trois régions traditionnelles : Sila Greca, Sila Grande et Sila Piccola ; la Sila Grande est
      la plus vaste, réunissant les plus hauts sommets et les principaux réservoirs artificiels.


      Les lacs sont des créations humaines de la première moitié du XXe siècle. Trois d'entre eux — Ampollino,
      Arvo et Ariamacina — s'étendent au sein du parc. Le plateau donne naissance au Crati et au Neto, les
      deux cours d'eau les plus longs de Calabre.


      La forêt s'étage selon la topographie. Entre 1 100 et 1 600 mètres domine sans rival le pin laricio de
      Calabre (Pinus nigra laricio). Au-dessus de 1 400 mètres apparaît le hêtre, souvent associé au sapin
      blanc, tandis que les bas-fonds humides abritent des tourbières relictuelles venues du nord durant les
      glaciations. Ces pinèdes prospèrent sur des arènes granitiques acides et filtrantes où ce conifère
      rustique domine le hêtre.
    wildlife: >-
      Le loup est l'emblème du parc national. On estime sa population à trois meutes et entre 15 et 20
      individus sur l'ensemble du plateau. Le cerf s'était éteint au début du XXe siècle avant d'être
      réintroduit dans les années quatre-vingt dans la réserve de Golia-Corvo. Dans la canopée bondit
      l'écureuil noir méridional, rongeur emblématique de ces montagnes qui fréquente jusque dans les parcs
      des villages.


      Les passionnés d'ornithologie recensent 113 espèces d'oiseaux, dont 57 d'intérêt patrimonial. On observe
      autour des palombes, épervier d'Europe, buse variable et milans ; chez les picidés, le pic noir
      s'affirme comme l'espèce maîtresse des vieilles forêts. Depuis l'hiver 2016 est documenté l'hivernage
      exceptionnel de la cigogne noire. Parmi la petite faune, le parc abrite 12 espèces d'amphibiens et 10 de
      reptiles remarquables, dont le sonneur à ventre jaune des Apennins.
    visit: >-
      La porte d'accès la plus complète est le centre Cupone, au bord du lac Cecita, près de Camigliatello
      Silano. C'est un musée de plein air doté de sentiers botaniques, d'observatoires fauniques, d'un jardin
      géologique et d'un jardin botanique accessible, complété par un enclos à daims. L'autre pôle majeur est
      le centre A. Garcea près de Villaggio Mancuso, tandis qu'à Cotronei le musée de l'eau et de l'énergie
      propose des expositions interactives. Le parc gère aussi des pépinières de biodiversité et des enclos
      d'acclimatation pour loup, cerf, chevreuil et hibou grand-duc.


      Le réseau de randonnée totalise 600 kilomètres, comptant 66 sentiers principaux, 51 secondaires et cinq
      tronçons du Sentiero Italia. Une belle introduction est le Sentiero dei Caprioli, boucle de cinq heures
      par Fossiata, Cecita et Cozzo del Principe au cœur d'espaces très protégés. Le parc la conseille en
      juillet et août. Dans la vallée du Cecita vit le « Patriarche de la Sila », un sapin blanc de plus de
      six mètres de circonférence à la base, parmi les plus vieux arbres du parc. Le portail et l'application
      Natura Italia précisent dénivelé, longueur et durée de chaque tracé.
    history: >-
      L'histoire de la Sila est celle d'une forêt âprement disputée. Dès la fin du XVIIIe siècle, des
      empiétements agricoles illégaux morcelèrent les bois communaux, les paysans considérant la forêt comme
      un obstacle à la survie agricole, d'où de nombreux incendies. La première proposition de parc national
      remonte à 1923, mais le décret définitif ne fut promulgué que le 14 novembre 2002, succédant à l'ancien
      parc national de Calabre.


      Aujourd'hui, le territoire englobe neuf réserves naturelles biogénétiques ; Fallistro abrite les
      monumentaux Giganti della Sila et Golia-Corvo accueille les cerfs. Dans les vallées, la transhumance
      pastorale demeure très vivante. L'UNESCO a par ailleurs classé la Sila comme la dixième réserve de
      biosphère d'Italie.
    before: >-
      Vérifiez l'ouverture des centres et l'état des pistes avant de partir. Utilisez Natura Italia, le
      portail officiel du parc, pour sélectionner votre itinéraire selon le dénivelé et le temps disponible.
    around: >-
      La Sila ne possède pas de voisins immédiats dans l'atlas, mais partage des espèces clés avec d'autres
      régions : le pic noir et le loup la relient au [Parque Nacional de
      Aspromonte](/lugar/parco-nazionale-dell-aspromonte/), également en Calabre, et à la [Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) en Espagne.
  de:
    intro: >-
      Es gibt Landschaften, die wie eine andere Welt wirken: Die Sila im Herzen Kalabriens erinnert mit ihren
      Granitkuppen so sehr an mitteleuropäische Gebirge, dass sie 1898 als «Kalabrische Alpen» bezeichnet
      wurde. Der Nationalpark Sila umfasst 73.695 Hektar dieses Binnenlands mit Verwaltungssitz in Lorica und
      hält einen bemerkenswerten Landesrekord: Er ist der waldreichste Nationalpark Italiens mit fast 80 %
      Waldanteil.
    landscape: >-
      Die Sila ist ein altes Hochplateau mit einem Kern aus Graniten und metamorphen Gesteinen von
      alpenähnlicher Struktur. Ihr höchster Punkt ist der Monte Botte Donato mit 1.929 Metern Höhe. Der Park
      erstreckt sich über alle drei historischen Sila-Landschaften: Sila Greca, Sila Grande und Sila Piccola;
      die Sila Grande ist die ausgedehnteste und vereinigt die höchsten Gipfel und größten Stauseen.


      Die Seen entstanden durch Menschenhand in der ersten Hälfte des zwanzigsten Jahrhunderts. Drei von ihnen
      — Ampollino, Arvo und Ariamacina — liegen im Nationalpark. Über die Hochfläche fließen Crati und Neto,
      die beiden längsten Flüsse Kalabriens.


      Die Höhenstufen gliedern den Bewuchs: Zwischen 1.100 und 1.600 Metern herrscht fast konkurrenzlos die
      Kalabrische Schwarzkiefer (Pinus nigra laricio). Ab 1.400 Metern tritt die Rotbuche hinzu, oft mit
      Weißtanne untermischt, während feuchte Senken eiszeitliche Moorrelikte bergen. Die Kiefernwälder wachsen
      auf sauren, sandigen Granitverwitterungsböden, auf denen dieser genügsame Nadelbaum die Buche mühelos
      überflügelt.
    wildlife: >-
      Der Wolf ist das Wappentier des Parks: Auf der gesamten Hochfläche leben geschätzt drei Rudel mit 15 bis
      20 Tieren. Der Rothirsch war Anfang des zwanzigsten Jahrhunderts ausgerottet und kehrte in den achtziger
      Jahren im Reservat Golia-Corvo zurück. In den Wipfeln klettert das süditalienische schwarze
      Eichhörnchen, das bis in die Dorfgärten vordringt.


      Vogelbeobachter registrieren 113 Arten, davon 57 von besonderem Schutzwert. Habicht, Sperber,
      Mäusebussard und Milane kreisen über den Wäldern; unter den Spechten ist der Schwarzspecht die Leitart
      urwüchsiger Wälder. Seit dem Winter 2016 überwintert hier sogar der seltene Schwarzstorch. Zu den
      Kleintieren zählen 12 Amphibien- und 10 Reptilienarten, darunter die Gelbbauchunke.
    visit: >-
      Wichtigstes Portal ist das Besucherzentrum Cupone am Cecita-See bei Camigliatello Silano: ein
      Naturmuseum mit Lehrpfaden, Beobachtungsständen, Geologiegarten, barrierefreiem botanischem Garten und
      Damwildgehege. Zweiter großer Anlaufpunkt ist das Zentrum A. Garcea bei Villaggio Mancuso; in Cotronei
      vermittelt das Wasser- und Energiemuseum Wissenswertes über Natur und Geschichte. Die Einrichtungen
      unterhalten Freiland-Lernstationen und Schutzgehege für Wolf, Hirsch, Reh und Uhu.


      Das Wegenetz misst 600 Kilometer mit 66 Hauptwegen, 51 Nebenrouten und fünf Abschnitten des Sentiero
      Italia. Ein empfehlenswerter Einstieg ist der Sentiero dei Caprioli, eine fünfstündige Rundwanderung
      über Fossiata, Cecita und Cozzo del Principe durch geschützte Kernzonen. Der Park empfiehlt diese Route
      im Juli und August. Im Cecita-Tal steht der «Patriarch der Sila», eine monumentale Weißtanne mit über
      sechs Metern Stammumfang an der Basis. Portal und App Natura Italia informieren über Distanzen,
      Höhenunterschiede und Gehzeiten.
    history: >-
      Die Geschichte der Sila war jahrhundertelang von Waldnutzungskonflikten geprägt: Ab dem späten
      achtzehnten Jahrhundert wurden Allmenden illegal gerodet und von Bauern als Ackerland beansprucht, was
      zu Waldbränden führte. Erste Schutzvorschläge datieren von 1923, doch erst am 14. November 2002 wurde
      der heutige Nationalpark per Dekret gegründet.


      Heute umfasst das Schutzgebiet neun staatliche biogenetische Reservate; Fallistro schützt die
      Monumentalbäume Giganti della Sila und Golia-Corvo dient als Hirschreservat. In den Tälern wird die
      traditionelle Wanderschafhaltung weiter gepflegt. Die UNESCO ernannte die Sila zudem zum zehnten
      Biosphärenreservat Italiens.
    before: >-
      Erkundige dich vor Touren über den Zustand der Pfade und Öffnungszeiten der Zentren. Das offizielle
      Portal Natura Italia hilft bei der Tourenauswahl nach Höhenprofil und Gehzeit.
    around: >-
      Die Sila hat keine unmittelbaren Nachbargebiete im Atlas, teilt aber Schwarzspecht und Wolf mit dem
      [Parque Nacional de Aspromonte](/lugar/parco-nazionale-dell-aspromonte/) in Südkalabrien sowie mit der
      [Reserva de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) in Nordspanien.
  it:
    intro: >-
      Ci sono montagne che sembrano appartenere a un'altra terra. La Sila, nel cuore della Calabria, richiama
      le Alpi per il suo basamento granitico, tanto che nel 1898 venne definita «Alpi Calabresi». Il Parco
      Nazionale della Sila racchiude 73.695 ettari di questo territorio interno, con sede a Lorica,
      contrassegnato da un primato: è il parco nazionale italiano con la più alta percentuale di superficie
      boscata, quasi l'80 % dell'intera estensione.
    landscape: >-
      La Sila è un altopiano montuoso dal nucleo di graniti e rocce metamorfiche, affine all'orogenesi alpina.
      La cima più elevata è il Monte Botte Donato con i suoi 1.929 metri. Il parco si estende sulle tre
      suddivisioni storiche: Sila Greca, Sila Grande e Sila Piccola; la Sila Grande è la più vasta e riunisce
      le vette principali e i maggiori invasi artificiali.


      I laghi sono bacini artificiali realizzati nella prima metà del Novecento. Tre di essi — Ampollino, Arvo
      e Ariamacina — ricadono nel perimetro del parco. Dai suoi rilievi scendono il Crati e il Neto, i due
      fiumi più lunghi della Calabria.


      La vegetazione sale a fasce altitudinali. Tra i 1.100 e i 1.600 metri domina incontrastato il pino
      laricio calabrese (Pinus nigra laricio). Oltre i 1.400 metri compare il faggio, spesso misto all'abete
      bianco, mentre nelle conche umide resistono torbiere montane giunte dal nord con le glaciazioni. Le
      pinete prosperano su suoli granitici acidi e sabbiosi dove la frugalità del pino prevale sul faggio.
    wildlife: >-
      Il lupo è il simbolo dell'area protetta: si stimano tre branchi stabili e tra 15 e 20 individui
      sull'intero altopiano. Il cervo si era estinto ai primi del Novecento ed è stato reintrodotto negli anni
      ottanta nella riserva di Golia-Corvo. Tra le fronde si muove lo scoiattolo nero meridionale, roditore
      arboricolo esclusivo che si spinge fin nei parchi urbani dei paesi montani.


      Per gli amanti dell'avifauna si contano 113 specie censite, 57 delle quali d'interesse
      conservazionistico. Nidificano astore, sparviere, poiana e nibbi; tra i picidi spicca il picchio nero,
      specie chiave dei boschi maturi. Dall'inverno del 2016 è stato inoltre accertato lo svernamento della
      rara cicogna nera. Tra la piccola fauna il parco conta 12 specie di anfibi e 10 di rettili, tra cui
      l'ululone appenninico dal ventre giallo.
    visit: >-
      Il punto informativo più articolato è il centro Cupone, affacciato sul lago Cecita nei pressi di
      Camigliatello Silano: un museo all'aperto con sentieri didattici, osservatori faunistici, museo
      naturalistico, giardino geologico e orto botanico accessibile, con recinto faunistico per daini. L'altro
      polo maggiore è il centro A. Garcea vicino a Villaggio Mancuso, mentre a Cotronei il Museo dell'Acqua e
      dell'Energia documenta l'ambiente silano con postazioni interattive. Non mancano aule verdi, vivai della
      biodiversità silana e centri di ambientamento per lupo, cervo, capriolo e gufo reale.


      La rete sentieristica conta 600 chilometri, con 66 sentieri principali, 51 secondari e cinque tratte del
      Sentiero Italia. Un itinerario ideale è il Sentiero dei Caprioli, anello di cinque ore tra Fossiata,
      Cecita e Cozzo del Principe in una delle aree a massima tutela. Il parco ne raccomanda la percorrenza a
      luglio e agosto. Nella valle del Cecita svetta il «Patriarca della Sila», un abete bianco con oltre sei
      metri di circonferenza alla base. Il portale e l'app Natura Italia riportano lunghezze, dislivelli e
      tempi di percorrenza.
    history: >-
      La storia della Sila è segnata da secolari contese forestali. Dalla fine del Settecento le usurpazioni
      private frammentarono le terre demaniali per ricavarne pascoli e coltivi, con frequenti incendi dolosi.
      La prima proposta istitutiva risale al 1923, ma il decreto definitivo giunse solo il 14 novembre 2002,
      raccogliendo l'eredità dello storico Parco Nazionale della Calabria.


      Oggi il parco racchiude nove riserve naturali biogenetiche; Fallistro custodisce i monumentali Giganti
      della Sila e Golia-Corvo ospita i cervi. Nelle valli la transumanza pastorale rimane viva e praticata.
      L'UNESCO ha inoltre riconosciuto la Sila come decima Riserva della Biosfera italiana.
    before: >-
      Controlla l'agibilità dei percorsi e l'orario dei centri visita prima dell'escursione. Il portale Natura
      Italia permette di calibrare la scelta dell'itinerario secondo dislivello e durata.
    around: >-
      La Sila non ha parchi contigui nell'atlante, ma condivide picchio nero e lupo con il [Parque Nacional de
      Aspromonte](/lugar/parco-nazionale-dell-aspromonte/), sempre in Calabria, e con la [Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) nelle Asturie.
  pt:
    intro: >-
      Há serras que aparentam pertencer a outro território. A Sila, no coração da Calábria, assemelha-se de
      tal modo aos relevos alpinos pelo seu soco granítico que em 1898 foi batizada de «Alpes Calabreses». O
      Parque Nacional da Sila reúne 73.695 hectares desta região montanhosa interior, sediado em Lorica,
      sobressaindo por um registo ímpar: é o parque nacional italiano com maior taxa de cobertura florestal,
      somando quase 80 % da sua área.
    landscape: >-
      A Sila é um maciço planáltico antigo com núcleo de granitos e rochas metamórficas de perfil alpino. O
      cume culminante é o Monte Botte Donato, com 1.929 metros de altitude. O território abrange os três
      setores tradicionais: Sila Greca, Sila Grande e Sila Piccola; a Sila Grande é a mais extensa, agregando
      as maiores cumeadas e as principais albufeiras.


      Os lagos foram erguidos pela mão humana na primeira metade do século XX. Três deles — Ampollino, Arvo e
      Ariamacina — repousam dentro do parque. Pelo planalto correm o Crati e o Neto, as duas bacias fluviais
      mais longas da Calábria.


      A vegetação escalona-se em andares térmicos. Entre os 1.100 e os 1.600 metros domina quase sem rival o
      pinheiro-larício (Pinus nigra laricio). Acima dos 1.400 metros surge a faia, com frequência consociada
      ao abeto-branco, enquanto as depressões húmidas acolhem turfeiras com flora relicta das glaciações. Os
      pinhais medram em solos graníticos arenosos e ácidos onde a robustez deste pinheiro supera a faia.
    wildlife: >-
      O lobo personifica o símbolo do parque: calcula-se a presença de três alcateias e entre 15 e 20
      espécimes em todo o planalto. O veado extinguira-se nos primórdios do século XX, tendo sido
      reintroduzido nos anos oitenta na reserva de Golia-Corvo. Nas ramagens habita o esquilo-negro
      meridional, roedor carismático da montanha que alcança as matas periurbanas das aldeias.


      Para a ornitologia contam-se 113 espécies de aves, 57 das quais com estatuto de conservação prioritário.
      Sobrevoam açor, gavião, águia-d'asa-redonda e milhafres; nos picídeos sobressai o pica-pau-preto como
      sentinela florestal. Desde o inverno de 2016 documenta-se a invernada da cegonha-preta, fenómeno raro
      nesta latitude. Na pequena fauna o parque abriga 12 espécies de anfíbios e 10 de répteis com valor
      herpetológico, incluindo o sapo-de-ventre-amarelo dos Apeninos.
    visit: >-
      A porta de acolhimento mais completa é o centro Cupone, junto ao lago Cecita, nas imediações de
      Camigliatello Silano. Constitui um museu ao ar livre com percursos didáticos, observatórios de fauna,
      jardim geológico e jardim botânico acessível, integrando um cercado com gamos. O outro grande polo é o
      centro A. Garcea junto a Villaggio Mancuso, e em Cotronei o Museu da Água e da Energia explora as
      vivências locais com recurso a meios interativos. As estruturas dispõem de núcleos pedagógicos e áreas
      de aclimatação para lobo, veado, corço e bufo-real.


      A rede de trilhos atinge 600 quilómetros, englobando 66 caminhos principais, 51 secundários e cinco
      troços do Sentiero Italia. Um roteiro de referência é o Sentiero dei Caprioli, circuito de cinco horas
      por Fossiata, Cecita e Cozzo del Principe através de florestas com proteção estrita. O parque aconselha
      a caminhada em julho e agosto. No vale do Cecita ergue-se o «Patriarca da Sila», um abeto-branco com
      mais de seis metros de perímetro na base. O portal e a aplicação móvel Natura Italia discriminam
      extensão, desnível e tempo de marcha.
    history: >-
      A história da Sila reflete um bosque secularmente disputado. A partir de finais do século XVIII, a
      apropriação indevida de baldios desbravou matas para agricultura, vendo as populações na floresta um
      entrave ao sustento e originando queimadas. O primeiro projeto de parque nacional surgiu em 1923, mas o
      decreto definitivo só foi assinado a 14 de novembro de 2002, herdando o legado do histórico Parque
      Nacional da Calábria.


      Atualmente o parque integra nove reservas naturais biogenéticas; Fallistro protege os Giganti della Sila
      e Golia-Corvo resguarda os veados. Nos vales a pastorícia com transumância mantém-se viva. A UNESCO
      consagrou ainda a Sila como a décima Reserva da Biosfera de Itália.
    before: >-
      Informa-te sobre a abertura dos centros e a transitabilidade dos caminhos antes de partires. O portal
      oficial Natura Italia permite selecionar o trilho segundo o desnível e a duração prevista.
    around: >-
      A Sila não tem reservas confinantes no atlas, mas partilha o pica-pau-preto e o lobo com o [Parque
      Nacional de Aspromonte](/lugar/parco-nazionale-dell-aspromonte/), também na Calábria, e com a [Reserva
      de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) nas Astúrias.
