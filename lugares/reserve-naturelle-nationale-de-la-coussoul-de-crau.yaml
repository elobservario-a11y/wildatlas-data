resumen:
  es: >-
    La única estepa esteparia genuina de cantos rodados de Europa del Norte y Central (*Coussoul*), antiguo
    delta fósil del río Durancia.
  en: >-
    The only genuine pebble steppe in Northern and Central Europe (*Coussoul*), an ancient fossil delta of the
    Durance river.
  fr: >-
    L'unique steppe pierreuse authentique d'Europe occidentale et centrale (*Coussoul*), ancien delta fossile
    de la Durance.
  de: Die einzige echte Kiessteppe West- und Mitteleuropas (*Coussoul*), ein uraltes fossiles Delta der Durance.
  it: >-
    L'unica steppa di ciottoli autentica dell'Europa centro-occidentale (*Coussoul*), antico delta fossile del
    fiume Durance.
  pt: >-
    A única estepe pedregosa autêntica da Europa Ocidental e Central (*Coussoul*), antigo delta fóssil do rio
    Durance.
unico:
  es: >-
    Un delta fósil convertido en estepa donde viven aves venidas de las estepas del norte de África y de la
    península ibérica.
  en: >-
    A fossil delta transformed into steppe inhabited by birds originating from North African and Iberian
    steppes.
  fr: >-
    Un delta fossile devenu steppe où cohabitent des oiseaux originaires des steppes d'Afrique du Nord et de
    la péninsule Ibérique.
  de: >-
    Ein fossiles Flussdelta als Trockensteppe, bewohnt von Vögeln aus nordafrikanischen und iberischen
    Steppenlandschaften.
  it: >-
    Un delta fluviale fossile trasformato in steppa arida dove convivono uccelli tipici delle steppe del
    Nordafrica e della penisola iberica.
  pt: >-
    Um delta fóssil transformado em estepe onde convivem aves vindas das estepes do Norte de África e da
    Península Ibérica.
