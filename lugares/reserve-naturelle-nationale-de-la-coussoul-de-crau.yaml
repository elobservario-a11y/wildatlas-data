texto:
  es:
    intro: >-
      Se cruza en coche sin pararse, y es un error. La Crau parece un páramo árido y desolado, pero a dos
      pasos de la Camargue esconde una estepa de piedras y hierba rala donde vive una fauna que en Francia no
      existe en ningún otro sitio. Es el coussoul, y la Reserva Natural Nacional de los Coussouls de Crau
      protege unas 7 500 ha de él, con la ganga cata y el cernícalo primilla como habitantes más celebrados y
      el rebaño de ovejas como jardinero.
    landscape: >-
      La historia empieza con un río. La Crau es una llanura aluvial de 60 000 ha a las puertas de Arlés,
      entre los Alpilles y el Mediterráneo, el delta fósil del Durance. Durante cinco millones de años el río
      arrastró cantos rodados desde los Alpes; hace 75 000 años su cauce se desvió por movimientos tectónicos,
      el delta se secó y dejó una estepa semiárida, el coussoul. Bajo la hierba, los antiguos cantos rodados
      forman, cementados, una capa de poudingue casi impermeable que aísla la flora y la fauna de la
      superficie de la capa freática.


      Vivir aquí no es fácil. Entre el diente de los rebaños, la sequía estival y el mistral, la vida de las
      plantas es una lucha continua, y a la vez el equilibrio es frágil: una vez alterado, el coussoul no se
      regenera solo y no se puede restaurar. Predomina el brachypode rameux, el alimento básico de las ovejas;
      el asfódelo fistuloso, el tomillo y la stipe chevelu forman una comunidad vegetal única en el mundo. El
      coussoul tiene pocas plantas raras, pero las charcas temporales, las praderas húmedas y los marjales de
      la reserva acogen al menos unas treinta plantas protegidas.
    wildlife: >-
      Esto es una estepa de aves. Muchas proceden de las estepas del norte de África o de la península
      ibérica; el [cernícalo primilla](/especie/falco_naumanni/) y el [sisón común](/especie/tetrax_tetrax/)
      tienen aquí gran parte de su población nacional, y la [ganga cata](/especie/pterocles_alchata/) y la
      calandria común, toda. De las 479 especies de aves de Francia, cerca de 300 se ven en la Crau y 150 en
      la reserva. Anidan el [alcaraván](/especie/burhinus_oedicnemus/), la carraca europea, la bisbita
      campestre y el mochuelo europeo.


      La Crau alberga la única población francesa de ganga cata, con unas cien parejas. En 2021 se contaban
      unas 250 parejas reproductoras de cernícalo primilla en la Crau, y se instalaron cajas nido para su
      conservación.


      Más abajo en la escala, la vida es igual de insólita. Los saltamontes alcanzan 60 000 individuos por
      hectárea en agosto, entre ellos el criquet de Crau, en vías de extinción; hay además 14 especies de
      hormigas, y entre la fauna del coussoul está el lagarto ocelado.


      En verano, desde el observatorio de la bergerie de Peau de Meau pueden buscarse la ganga cata, el sisón
      común, el alcaraván y la abubilla.
    visit: >-
      El sendero interpretativo de Peau de Meau tiene quince paneles que cuentan la geología, la fauna, la
      flora y la historia pastoral del coussoul. Recorre 4,7 km, tiene un observatorio en la bergerie y está
      abierto todo el año para visitas autónomas, sin vehículos motorizados. Se entra con una autorización y
      un plano que se recogen en el Écomusée de la Crau, en Saint-Martin-de-Crau; el permiso vale dos días,
      seguidos o no.


      Si prefieres ir acompañado, el equipo de la reserva organiza visitas comentadas para grupos de al menos
      diez personas, y el primer viernes de cada mes, salvo julio y agosto, hay una salida con un guarda. El
      Écomusée es accesible a personas con movilidad reducida y cierra todos los lunes y del 24 de diciembre
      al 5 de enero.
    history: >-
      El coussoul lo recorren las ovejas desde la Antigüedad, incluso desde el Neolítico, como muestran los
      restos de rediles romanos. Hoy 160 ganaderos llevan a pastar 100 000 ovejas, sobre todo en invierno y
      primavera, antes de subir en trashumancia hacia los Alpes. Ese pastoreo moldeó la vegetación y es
      indispensable para conservarla.


      En el siglo XX la industrialización, la urbanización y la agricultura intensiva redujeron la estepa, y
      agricultores y ecologistas decidieron protegerla juntos. La reserva se creó el 8 de octubre de 2001 y
      desde 2004 la cogestionan el conservatorio natural regional y la cámara agraria de Bouches-du-Rhône.


      Un golpe duro llegó el 7 de agosto de 2009: se rompió un oleoducto que cruza la reserva y derramó 5 400
      m³ de petróleo sobre unas 4,5 ha. La restauración retiró 72 000 toneladas de tierra, quitó el vallado en
      2014 para que volvieran las ovejas y reintrodujo la hormiga cosechadora Messor barbarus. Y un antiguo
      huerto de melocotoneros de 375 ha junto a la reserva se transformó en estepa mediterránea; desde 2010
      vuelven a pastar ovejas.
    before: >-
      Hay que permanecer en los senderos balizados. Están prohibidos los perros, cualquier recolección de
      fauna, flora o minerales, los fuegos, el vivac, el camping y las actividades ruidosas o motorizadas.
    around: >-
      El [Marais du Vigueirat](/lugar/marais-du-vigueirat/) está a 5 km. Más lejos, otras estepas comparten
      con la Crau el sisón común y la ganga cata: el [Parque Natural Bardenas Reales de
      Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) y la [Reserva Natural Dirigida de la Laguna
      de Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
  en:
    intro: >-
      People often drive past without stopping, and that is a mistake. La Crau looks like a bleak, barren
      wasteland, but just a stone's throw from the Camargue it conceals a steppe of stones and sparse grasses
      harboring wildlife found nowhere else in France. This is the coussoul, and the Coussouls de Crau
      National Nature Reserve protects some 7,500 ha of it, with the pin-tailed sandgrouse and lesser kestrel
      as its most renowned inhabitants and sheep flocks serving as its gardeners.
    landscape: >-
      The story begins with a river. La Crau is an alluvial plain of 60,000 ha at the gates of Arles, between
      the Alpilles and the Mediterranean: the fossil delta of the Durance. For five million years the river
      transported rounded pebbles down from the Alps; 75,000 years ago tectonic movements diverted its course,
      the delta dried out, leaving behind a semi-arid steppe known as the coussoul. Beneath the grass, these
      ancient pebbles are naturally cemented into an almost impermeable layer of puddingstone that seals
      surface flora and fauna off from groundwater.


      Surviving here is demanding. Between grazing flocks, summer droughts, and the fierce mistral, plant life
      is an ongoing struggle, yet the ecological balance is fragile: once disturbed, the coussoul cannot
      regenerate on its own and cannot be artificially restored. Stiff brome dominates as the staple forage
      for sheep; hollow-stemmed asphodel, thyme, and feather grass form a plant community unique in the world.
      The coussoul holds few rare plants, but the reserve's temporary pools, damp grasslands, and marshes
      shelter at least thirty protected plant species.
    wildlife: >-
      This is a steppe of birds. Many originate from the steppes of North Africa or the Iberian Peninsula; the
      [lesser kestrel](/especie/falco_naumanni/) and the [little bustard](/especie/tetrax_tetrax/) maintain a
      large part of their national populations here, while the [pin-tailed
      sandgrouse](/especie/pterocles_alchata/) and calandra lark are found exclusively here in France. Out of
      479 bird species in France, around 300 have been observed in La Crau and 150 within the reserve.
      Breeding birds include the [Eurasian stone-curlew](/especie/burhinus_oedicnemus/), European roller,
      tawny pipit, and little owl.


      La Crau hosts France's only population of pin-tailed sandgrouse, numbering around one hundred pairs. In
      2021 around 250 breeding pairs of lesser kestrels were counted in La Crau, supported by artificial nest
      boxes installed for their conservation.


      Further down the food chain, life is equally extraordinary. Grasshopper densities reach 60,000
      individuals per hectare in August, among them the endangered Crau bush-cricket; there are also 14 ant
      species, and the ocellated lizard thrives among the coussoul fauna.


      In summer, from the hide at the Peau de Meau sheepfold, you can watch for pin-tailed sandgrouse, little
      bustards, stone-curlews, and hoopoes.
    visit: >-
      The Peau de Meau nature trail features fifteen interpretive panels explaining the geology, wildlife,
      flora, and pastoral heritage of the coussoul. It covers 4.7 km, has a bird hide at the sheepfold, and is
      open year-round for self-guided exploration, without motorized vehicles. Entry requires a permit and
      trail map collected from the Écomusée de la Crau in Saint-Martin-de-Crau; the pass is valid for two
      days, consecutive or not.


      If you prefer a guided visit, reserve staff organizes commentary tours for groups of at least ten
      people, and on the first Friday of each month, except July and August, there is a field outing with a
      ranger. The Écomusée is accessible to persons with reduced mobility and is closed every Monday and from
      24 December to 5 January.
    history: >-
      Flocks of sheep have grazed the coussoul since antiquity and even since Neolithic times, as Roman
      sheepfold remains attest. Today 160 pastoralists bring 100,000 sheep to graze, mainly in winter and
      spring, before driving them in transhumance up into the Alps. This extensive grazing shaped the steppe
      vegetation and remains essential for its conservation.


      In the twentieth century, industrial expansion, urbanization, and intensive agriculture shrank the
      steppe, prompting farmers and conservationists to join forces to protect it. The reserve was established
      on 8 October 2001 and since 2004 has been co-managed by the regional nature conservatory and the
      Bouches-du-Rhône Chamber of Agriculture.


      A severe incident struck on 7 August 2009 when an oil pipeline crossing the reserve ruptured, spilling
      5,400 m³ of crude oil across roughly 4.5 ha. Ecological rehabilitation removed 72,000 tonnes of
      contaminated soil, took down fences in 2014 so sheep could return, and reintroduced the harvester ant
      Messor barbarus. Moreover, a former 375 ha peach orchard adjacent to the reserve was restored to
      Mediterranean steppe, where sheep have grazed again since 2010.
    before: >-
      Visitors must remain strictly on marked trails. Prohibited are dogs, any collecting of flora, fauna, or
      minerals, campfires, bivouacking, camping, and noisy or motorized activities.
    around: >-
      The [Marais du Vigueirat](/lugar/marais-du-vigueirat/) is 5 km away. Further afield, other steppe
      reserves share little bustards and pin-tailed sandgrouse with La Crau: the [Bardenas Reales Natural
      Park](/lugar/parque-natural-bardenas-reales-de-navarra/) in Navarre and the [Gallocanta Lagoon Nature
      Reserve](/lugar/reserva-natural-laguna-de-gallocanta/) in Aragon.
  fr:
    intro: >-
      On la traverse souvent en voiture sans s'arrêter, et c'est une erreur. La Crau ressemble à une étendue
      aride et désolée, mais à deux pas de la Camargue, elle abrite une steppe de galets et d'herbes rases
      abritant une faune introuvable ailleurs en France. C'est le coussoul, et la réserve naturelle nationale
      des Coussouls de Crau en protège environ 7 500 ha, le ganga cata et le faucon crécerellette étant ses
      résidents les plus célèbres et les troupeaux d'ovins ses jardiniers attitrés.
    landscape: >-
      L'histoire commence par une rivière. La Crau est une plaine alluviale de 60 000 ha aux portes d'Arles,
      entre Alpilles et Méditerranée, delta fossile de la Durance. Pendant cinq millions d'années, le cours
      d'eau a charrié des galets roulés depuis les Alpes ; il y a 75 000 ans, des mouvements tectoniques ont
      dévié son cours, le delta s'est asséché et a laissé place à une steppe semi-aride, le coussoul. Sous la
      végétation, les galets anciens se sont cimentés pour former un poudingue quasi imperméable qui isole la
      flore et la faune de surface de la nappe phréatique.


      Survivre ici exige des trésors d'adaptation. Entre la dent des troupeaux, la sécheresse estivale et le
      souffle du mistral, la vie végétale est une lutte constante, et l'équilibre reste très fragile : une
      fois dégradé, le coussoul ne se régénère pas seul et s'avère impossible à reconstituer. Le brachycode
      rameux domine, aliment de base des ovins ; l'asphodèle fistuleux, le thym et la stipe chevelue forment
      une communauté végétale unique au monde. Le coussoul compte peu d'espèces rares en soi, mais les mares
      temporaires, prairies humides et marais de la réserve abritent au moins une trentaine de plantes
      protégées.
    wildlife: >-
      C'est une steppe peuplée d'oiseaux d'exception. Nombre d'entre eux proviennent des steppes d'Afrique du
      Nord ou de la péninsule Ibérique ; le [faucon crécerellette](/especie/falco_naumanni/) et l'[outarde
      canepetière](/especie/tetrax_tetrax/) y concentrent une part majeure de leurs effectifs nationaux,
      tandis que le [ganga cata](/especie/pterocles_alchata/) et la calandre lulula n'existent nulle part
      ailleurs en France. Sur les 479 espèces d'oiseaux de France, près de 300 sont visibles en Crau et 150
      dans la réserve. Y nichent l'[œdicnème criard](/especie/burhinus_oedicnemus/), le rollier d'Europe, le
      pipit rousseline et la chevêche d'Athéna.


      La Crau abrite l'unique population française de ganga cata, avec une centaine de couples. En 2021 on
      comptait environ 250 couples nicheurs de faucon crécerellette en Crau, bénéficiant de nichoirs
      artificiels pour leur conservation.


      Plus bas dans la chaîne du vivant, l'entomofaune est tout aussi spectaculaire. Les criquets atteignent
      des densités de 60 000 individus par hectare en août, dont le criquet de Crau en danger critique
      d'extinction ; on y recense en outre 14 espèces de fourmis, et le lézard ocellé compte parmi les
      reptiles emblématiques du coussoul.


      En été, depuis l'observatoire de la bergerie de Peau de Meau, vous pouvez guetter le ganga cata,
      l'outarde canepetière, l'œdicnème criard et la huppe fasciée.
    visit: >-
      Le sentier d'interprétation de Peau de Meau compte quinze panneaux expliquant la géologie, la faune, la
      flore et l'histoire pastorale du coussoul. Il s'étend sur 4,7 km, dispose d'un observatoire dans la
      bergerie et s'ouvre toute l'année en visite libre, sans véhicules motorisés. L'accès requiert une
      autorisation et un plan à retirer à l'Écomusée de la Crau à Saint-Martin-de-Crau ; le laissez-passer est
      valable deux jours, consécutifs ou non.


      Si vous préférez une visite accompagnée, l'équipe de la réserve propose des visites guidées pour les
      groupes d'au moins dix personnes, et le premier vendredi de chaque mois, hors juillet et août, une
      sortie a lieu avec un garde. L'Écomusée est accessible aux personnes à mobilité réduite et ferme tous
      les lundis ainsi que du 24 décembre au 5 janvier.
    history: >-
      Le coussoul est parcouru par les ovins depuis l'Antiquité, voire le Néolithique, comme l'attestent les
      vestiges de bergeries romaines. Aujourd'hui, 160 éleveurs y font paître 100 000 brebis, principalement
      en hiver et au printemps, avant la transhumance estivale vers les Alpes. Ce pâturage séculaire a façonné
      le paysage végétal et demeure indispensable à sa préservation.


      Au cours du XXe siècle, l'industrialisation, l'urbanisation et les cultures intensives ont grignoté la
      steppe, incitant éleveurs et protecteurs de la nature à s'unir. La réserve a été créée le 8 octobre 2001
      et se trouve cogérée depuis 2004 par le Conservatoire d'espaces naturels de PACA et la Chambre
      d'agriculture des Bouches-du-Rhône.


      Une grave avarie est survenue le 7 août 2009 : la rupture d'un oléoduc traversant la réserve a déversé 5
      400 m³ de pétrole sur environ 4,5 ha. Les travaux de réhabilitation ont évacué 72 000 tonnes de terre
      souillée, déposé les clôtures en 2014 pour le retour des troupeaux et réintroduit la fourmi moissonneuse
      Messor barbarus. De plus, un ancien verger de pêchers de 375 ha jouxtant la réserve a été reconverti en
      steppe méditerranéenne, où les brebis paissent à nouveau depuis 2010.
    before: >-
      Il est impératif de rester sur les sentiers balisés. Sont rigoureusement interdits les chiens, tout
      prélèvement d'animaux, de plantes ou de minéraux, les feux, le bivouac, le camping ainsi que les
      activités bruyantes ou motorisées.
    around: >-
      Le [marais du Vigueirat](/lugar/marais-du-vigueirat/) se situe à 5 km. Plus loin, d'autres steppes
      partagent l'outarde canepetière et le ganga cata avec la Crau : le [parc naturel des Bardenas
      Reales](/lugar/parque-natural-bardenas-reales-de-navarra/) et la [réserve naturelle de la lagune de
      Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
  de:
    intro: >-
      Oft fährt man mit dem Auto daran vorbei, ohne anzuhalten – ein Fehler. Die Crau wirkt wie ein karges,
      ödes Ödland, doch nur einen Katzensprung von der Camargue entfernt verbirgt sich eine Stein- und
      Grassteppe, in der eine Tierwelt lebt, die es sonst nirgendwo in Frankreich gibt. Das ist der Coussoul,
      und das Nationale Naturschutzgebiet Coussouls de Crau bewahrt rund 7 500 ha davon, mit Spießflughuhn und
      Rötelfalke als bekanntesten Bewohnern und Schafherden als Landschaftspflegern.
    landscape: >-
      Die Entstehung begann mit einem Fluss. Die Crau ist eine Schwemmebene von 60 000 ha vor den Toren von
      Arles zwischen den Alpilles und dem Mittelmeer: das fossile Delta der Durance. Fünf Millionen Jahre lang
      transportierte der Fluss Geröll aus den Alpen talwärts; vor 75 000 Jahren lenkten tektonische
      Verschiebungen seinen Lauf um, das Delta fiel trocken und hinterließ eine Halbwüstensteppe, den
      Coussoul. Unter der Grasschicht bildeten die Kieselsteine durch Zementierung eine fast
      wasserundurchlässige Poudingue-Konglomeratschicht, die Flora und Fauna vom Grundwasser trennt.


      Hier zu überleben verlangt höchste Anpassung. Zwischen Beweidung, sommerlicher Dürre und dem
      peitschenden Mistral kämpfen Pflanzen beständig ums Überleben, und das Gleichgewicht ist äußerst
      empfindlich: Einmal gestört, regeneriert sich der Coussoul nicht von selbst und lässt sich kaum
      wiederherstellen. Die Ästige Zwenke dominiert als Hauptfutter der Schafe; Röhriger Affodill, Thymian und
      Echtes Federgras bilden eine weltweit einzigartige Pflanzengemeinschaft. Der Coussoul zählt selbst nur
      wenige seltene Pflanzen, doch temporäre Tümpel, Feuchtwiesen und Sümpfe im Reservat beherbergen
      mindestens dreißig geschützte Pflanzenarten.
    wildlife: >-
      Dies ist ein Steppenlebensraum für Vögel. Viele stammen aus den Steppen Nordafrikas oder der Iberischen
      Halbinsel; der [Rötelfalke](/especie/falco_naumanni/) und die [Zwergtrappe](/especie/tetrax_tetrax/)
      besitzen hier einen Großteil ihrer französischen Bestände, während das
      [Spießflughuhn](/especie/pterocles_alchata/) und die Kalanderlerche in Frankreich ausschließlich hier
      vorkommen. Von den 479 Vogelarten Frankreichs wurden rund 300 in der Crau und 150 im Schutzgebiet
      gesichtet. Hier brüten [Triel](/especie/burhinus_oedicnemus/), Blauracke, Brachpieper und Steinkauz.


      Die Crau beherbergt Frankreichs einzige Brutpopulation des Spießflughuhns mit rund einhundert Paaren. Im
      Jahr 2021 wurden rund 250 Brutpaare des Rötelfalken in der Crau gezählt, gefördert durch künstliche
      Nistkästen.


      Weiter unten im Nahrungsnetz ist die Artenvielfalt ebenso erstaunlich. Heuschrecken erreichen im August
      Dichten von 60 000 Tieren pro Hektar, darunter die vom Aussterben bedrohte Crau-Beißschrecke; zudem gibt
      es 14 Ameisenarten, und die Perleidechse gehört zu den bemerkenswerten Reptilien des Coussoul.


      Im Sommer kannst du vom Beobachtungsstand der Schäferei Peau de Meau aus Spießflughühner, Zwergtrappen,
      Triele und Wiedehopfe beobachten.
    visit: >-
      Der Lehrpfad von Peau de Meau bietet fünfzehn Informationstafeln zu Geologie, Tierwelt, Pflanzen und
      Weidewirtschaft des Coussoul. Er misst 4,7 km, besitzt einen Beobachtungsstand an der Schäferei und ist
      ganzjährig für individuelle Wanderungen ohne Motorfahrzeuge zugänglich. Für den Einlass benötigst du
      eine Zugangskarte und einen Plan, die im Écomusée de la Crau in Saint-Martin-de-Crau erhältlich sind;
      die Erlaubnis gilt für zwei Tage, ob aufeinanderfolgend oder getrennt.


      Wenn du eine geführte Tour bevorzugst: Das Reservatsteam bietet Führungen für Gruppen ab zehn Personen
      an, und an jedem ersten Freitag im Monat (außer im Juli und August) findet eine Exkursion mit einem
      Ranger statt. Das Écomusée ist barrierefrei zugänglich und montags sowie vom 24. Dezember bis zum 5.
      Januar geschlossen.
    history: >-
      Schafe beweiden den Coussoul seit der Antike, ja bereits seit der Jungsteinzeit, wie römische Pferche
      belegen. Heute treiben 160 Züchter rund 100 000 Schafe auf die Weide, vor allem im Winter und Frühjahr,
      bevor der Almauftrieb in die Alpen beginnt. Diese Wanderschäferei formte die Vegetation und bleibt für
      ihren Fortbestand unverzichtbar.


      Im zwanzigsten Jahrhundert verkleinerten Industrieansiedlungen, Zersiedelung und Intensivlandwirtschaft
      die Steppe, woraufhin Landwirte und Naturschützer gemeinsam Schutzmaßnahmen ergriffen. Das Reservat
      wurde am 8. Oktober 2001 gegründet und wird seit 2004 gemeinsam vom regionalen Naturschutzverband und
      der Landwirtschaftskammer Bouches-du-Rhône verwaltet.


      Ein schwerer Rückschlag ereignete sich am 7. August 2009: Eine Pipeline brach im Schutzgebiet und
      verströmte 5 400 m³ Rohöl auf etwa 4,5 ha. Die Sanierung trug 72 000 Tonnen kontaminierten Boden ab,
      entfernte 2014 die Zäune für die Rückkehr der Herden und siedelte die Ernteameise Messor barbarus wieder
      an. Zudem wurde eine angrenzende 375 ha große ehemalige Pfirsichplantage in Trockensteppe umgewandelt;
      seit 2010 weiden dort wieder Schafe.
    before: >-
      Es gilt ein striktes Gebot, auf den markierten Wegen zu bleiben. Hunde, jegliches Sammeln von Tieren,
      Pflanzen oder Mineralien, offenes Feuer, Biwakieren, Zelten sowie lärmintensive oder motorisierte
      Aktivitäten sind verboten.
    around: >-
      Das [Marais du Vigueirat](/lugar/marais-du-vigueirat/) liegt 5 km entfernt. Weiter entfernt teilen
      andere Steppengebiete Zwergtrappen und Spießflughühner mit der Crau: der [Naturpark Bardenas
      Reales](/lugar/parque-natural-bardenas-reales-de-navarra/) in Navarra und das [Naturschutzgebiet Laguna
      de Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/) in Aragonien.
  it:
    intro: >-
      La si attraversa spesso in auto senza fermarsi, ed è un errore. La Crau sembra una landa brulla e
      desolata, ma a due passi dalla Camargue cela una steppa di ciottoli ed erbe rade che ospita una fauna
      inesistente altrove in Francia. È il coussoul, e la riserva naturale nazionale dei Coussouls de Crau ne
      tutela circa 7 500 ha, con la grandule e il grillaio tra i suoi abitanti più celebri e le greggi di
      pecore a fare da instancabili giardinieri.
    landscape: >-
      La vicenda geologica ha inizio con un fiume. La Crau è una pianura alluvionale di 60 000 ha alle porte
      di Arles, stretta tra le Alpilles e il Mediterraneo: il delta fossile della Durance. Per cinque milioni
      di anni il corso d'acqua ha trascinato ciottoli arrotondati dalle Alpi; 75 000 anni fa movimenti
      tettonici ne deviarono il letto, il delta si prosciugò lasciando spazio a una steppa semiarida, il
      coussoul. Sotto la copertura vegetale, gli antichi ciottoli formano per cementazione uno strato di
      puddinga quasi impermeabile che isola flora e fauna superficiali dalla falda acquifera sotterranea.


      Sopravvivere in questo ambiente richiede adattamenti continui. Tra il morso delle greggi, l'aridità
      estiva e il soffio del maestrale, la vita vegetale combatte senza tregua, e l'equilibrio è fragile: se
      alterato, il coussoul non si rigenera autonomamente ed è impossibile da ricreare. Domina il falasco
      delle garighe, alimento basilare delle pecore; l'asfodelo fistoloso, il timo e il lino delle fate
      formano un'associazione vegetale unica al mondo. Il coussoul racchiude di per sé poche essenze rare, ma
      gli stagni temporanei, i prati umidi e le paludi della riserva accolgono almeno una trentina di piante
      protette.
    wildlife: >-
      È una terra dominata da volatili straordinari. Molti provengono dalle steppe dell'Africa settentrionale
      o della penisola iberica; il [grillaio](/especie/falco_naumanni/) e la [gallina
      prataiola](/especie/tetrax_tetrax/) vi concentrano gran parte della popolazione francese, mentre la
      [grandule](/especie/pterocles_alchata/) e la calandra vi trovano l'unico rifugio di tutta la Francia.
      Delle 479 specie di uccelli francesi, circa 300 sono segnalate nella Crau e 150 nella riserva. Vi
      nidificano l'[occhione](/especie/burhinus_oedicnemus/), la ghiandaia marina, il calandro e la civetta
      comune.


      La Crau ospita l'unica popolazione riproduttiva francese di grandule, con circa cento coppie. Nel 2021
      si contavano circa 250 coppie nidificanti di grillaio nella Crau, sostenute da cassette nido
      appositamente collocate per la tutela della specie.


      Più in basso nella piramide ecologica, la biodiversità è altrettanto stupefacente. Le cavallette
      raggiungono concentrazioni di 60 000 individui per ettaro ad agosto, tra cui il criquet de Crau in
      pericolo critico; si contano inoltre 14 specie di formiche, e la lucertola ocellata primeggia tra i
      rettili della steppa.


      In estate, dal capanno della bergerie di Peau de Meau, puoi osservare granduli, galline prataiole,
      occhioni e upupe.
    visit: >-
      Il percorso didattico di Peau de Meau comprende quindici pannelli che illustrano la geologia, la fauna,
      la flora e le tradizioni pastorali del coussoul. Si sviluppa per 4,7 km, possiede un osservatorio presso
      l'antica bergerie ed è accessibile tutto l'anno per visite autonome a piedi, senza veicoli a motore.
      L'accesso richiede un permesso e una mappa da ritirare all'Écomusée de la Crau a Saint-Martin-de-Crau;
      il lasciapassare vale per due giorni, consecutivi o separati.


      Se desideri una visita guidata, lo staff della riserva cura escursioni per gruppi di almeno dieci
      persone, e ogni primo venerdì del mese (esclusi luglio e agosto) si tiene un'uscita con un guardiaparco.
      L'Écomusée è accessibile alle persone a mobilità ridotta ed è chiuso tutti i lunedì e dal 24 dicembre al
      5 gennaio.
    history: >-
      Le pecore solcano il coussoul fin dall'antichità e persino dal Neolitico, come documentano i resti di
      recinti ovini romani. Oggi 160 allevatori portano al pascolo 100 000 capi, soprattutto in inverno e
      primavera, prima di salire in transumanza verso le Alpi. Questo pascolo estensivo ha plasmato la
      vegetazione ed è indispensabile per la sua salvaguardia.


      Nel ventesimo secolo l'avanzata industriale, l'espansione urbana e l'agricoltura intensiva hanno ridotto
      la steppa, spingendo allevatori e ambientalisti a coalizzarsi. La riserva è stata istituita l'8 ottobre
      2001 e dal 2004 è gestita congiuntamente dal conservatorio naturale regionale e dalla camera
      dell'agricoltura delle Bouches-du-Rhône.


      Un duro colpo è avvenuto il 7 agosto 2009: la rottura di un oleodotto che attraversa la riserva ha
      sversato 5 400 m³ di greggio su circa 4,5 ha. Le operazioni di bonifica hanno rimosso 72 000 tonnellate
      di terreno inquinato, smantellato le recinzioni nel 2014 per far tornare le greggi e reintrodotto la
      formica mietitrice Messor barbarus. Inoltre un vecchio frutteto di peschi di 375 ha adiacente alla
      riserva è stato convertito in steppa mediterranea; dal 2010 vi pascolano nuovamente le pecore.
    before: >-
      È tassativo non abbandonare i sentieri battuti. Sono vietati i cani, qualsiasi raccolta di flora, fauna
      o rocce, l'accensione di fuochi, il bivacco, il campeggio e ogni attività rumorosa o motorizzata.
    around: >-
      Il [Marais du Vigueirat](/lugar/marais-du-vigueirat/) dista 5 km. Più lontano, altre steppe accolgono
      galline prataiole e granduli in comune con la Crau: il [Parco naturale delle Bardenas
      Reales](/lugar/parque-natural-bardenas-reales-de-navarra/) in Navarra e la [Riserva naturale della
      laguna di Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/) in Aragona.
  pt:
    intro: >-
      Cruza-se muitas vezes de carro sem parar, e isso é um erro. A Crau parece uma charneca árida e desolada,
      mas a dois passos da Camarga esconde uma estepe de calhaus e vegetação rasteira onde vive uma fauna
      inexistente em qualquer outro ponto de França. É o coussoul, e a Reserva Natural Nacional dos Coussouls
      de Crau protege cerca de 7 500 ha desse bioma, tendo o cortiçol-de-barriga-branca e o
      francelho-das-torres como residentes mais emblemáticos e os rebanhos de ovelhas como incansáveis
      jardineiros.
    landscape: >-
      A história começou com um curso de água. A Crau é uma planície aluvial de 60 000 ha às portas de Arles,
      entre os Alpilles e o Mediterrâneo: o delta fóssil do Durance. Durante cinco milhões de anos o rio
      arrastou seixos rolados dos Alpes; há 75 000 anos movimentos tectónicos desviaram o seu leito, o delta
      secou e deu lugar a uma estepe semiárida, o coussoul. Sob as ervas, os antigos calhaus formam por
      cimentação natural uma camada de pudim quase impermeável que separa a flora e fauna de superfície do
      lençol freático.


      Viver nestas paragens é um desafio constante. Entre a pastagem das ovelhas, a secura do verão e o
      vendaval do mistral, a vida vegetal luta sem descanso, e o equilíbrio é muito delicado: uma vez
      alterado, o coussoul não se regenera por si só e torna-se impossível de reconstituir. O bromo-ramoso
      predomina como sustento das ovelhas; o asfódelo-fistuloso, o tomilho e a estipa-capilar formam uma
      comunidade vegetal única no mundo. O coussoul conta com poucas espécies raras, mas os charcos
      temporários, prados húmidos e sapais da reserva abrigam pelo menos trinta espécies de plantas
      protegidas.
    wildlife: >-
      Esta é uma estepe de aves. Muitas provêm das estepes do Norte de África ou da Península Ibérica; o
      [francelho-das-torres](/especie/falco_naumanni/) e o [sisão](/especie/tetrax_tetrax/) concentram aqui
      grande fatia do seu efetivo nacional, ao passo que o
      [cortiçol-de-barriga-branca](/especie/pterocles_alchata/) e a calhandra-comum têm aqui a sua única
      colónia em França. Das 479 espécies de aves de França, perto de 300 foram assinaladas na Crau e 150 na
      reserva. Nidificam o [alcaravão](/especie/burhinus_oedicnemus/), o rolieiro-europeu, o
      petinha-dos-campos e o mocho-galego.


      A Crau abriga a única população francesa de cortiçol-de-barriga-branca, rondando uma centena de casais.
      Em 2021 contavam-se cerca de 250 casais reprodutores de francelho-das-torres na Crau, beneficiando de
      caixas-ninho instaladas para a sua conservação.


      Nos degraus inferiores da teia alimentar, a vida é igualmente espantosa. Os gafanhotos chegam a
      densidades de 60 000 indivíduos por hectare em agosto, com destaque para o gafanhoto-da-crau em vias de
      extinção; encontram-se também 14 espécies de formigas, e o sardão figura entre os répteis notáveis do
      coussoul.


      No verão, a partir do abrigo da bergerie de Peau de Meau, podes procurar cortiçóis-de-barriga-branca,
      sisões, alcaravões e poupas.
    visit: >-
      O trilho de interpretação de Peau de Meau integra quinze painéis que explicam a geologia, a fauna, a
      flora e a tradição pastoril do coussoul. Estende-se por 4,7 km, dispõe de um posto de observação na
      antiga bergerie e abre todo o ano para caminhadas autónomas sem veículos motorizados. A entrada exige
      uma autorização e um mapa a levantar no Écomusée de la Crau em Saint-Martin-de-Crau; a licença é válida
      durante dois dias, consecutivos ou interpolados.


      Se preferires uma visita com guia, a equipa da reserva realiza percursos comentados para grupos de pelo
      menos dez pessoas, e na primeira sexta-feira de cada mês (exceto em julho e agosto) decorre uma saída de
      campo com um guarda florestal. O Écomusée é acessível a pessoas com mobilidade reduzida e encerra todas
      as segundas-feiras e de 24 de dezembro a 5 de janeiro.
    history: >-
      As ovelhas percorrem o coussoul desde a Antiguidade e mesmo desde o Neolítico, como provam os vestígios
      de redis romanos. Hoje 160 criadores de gado pastoreiam 100 000 ovelhas, em especial no inverno e na
      primavera, antes da subida da transumância para os Alpes. Este pastoreio tradicional moldou a vegetação
      e afigura-se indispensável à sua salvaguarda.


      No século XX, o avanço industrial, a pressão urbana e as culturas intensivas reduziram a estepe, levando
      criadores e ecologistas a unir esforços para a proteger. A reserva foi criada a 8 de outubro de 2001 e
      desde 2004 é cogestionada pelo conservatório natural regional e pela câmara agrícola de
      Bouches-du-Rhône.


      Um episódio grave aconteceu a 7 de agosto de 2009: a rutura de um oleoduto que cruza a reserva derramou
      5 400 m³ de petróleo sobre cerca de 4,5 ha. Os trabalhos de remediação retiraram 72 000 toneladas de
      terra contaminada, desmantelaram as vedações em 2014 para a volta dos rebanhos e reintroduziram a
      formiga Messor barbarus. Além disso, um antigo pomar de pessegueiros de 375 ha contíguo à reserva foi
      devolvido a estepe mediterrânica; desde 2010 pastam lá ovelhas novamente.
    before: >-
      É obrigatório caminhar exclusivamente pelos trilhos balizados. É proibido levar cães, colher espécimes
      da fauna, flora ou minerais, acender fogueiras, pernoitar, acampar e desenvolver atividades ruidosas ou
      com veículos motorizados.
    around: >-
      O [Marais du Vigueirat](/lugar/marais-du-vigueirat/) fica a 5 km. Mais longe, outras paragens estepárias
      partilham sisões e cortiçóis com a Crau: o [Parque Natural Bardenas
      Reales](/lugar/parque-natural-bardenas-reales-de-navarra/) e a [Reserva Natural da Lagoa de
      Gallocanta](/lugar/reserva-natural-laguna-de-gallocanta/).
