observaciones:
  es: >-
    Prepara el viaje con calma: el plan es un borrador y sus instalaciones aún no se dan por abiertas. Las
    pautas que propone son claras. No molestes a los animales ni interfieras con su reproducción, y evita el
    ruido. Evita las aguas someras donde desovan los peces y los bancos de grava, arena o barro que usan las
    aves para criar y descansar. Retira los residuos de las orillas y del agua, y llévatelos.
texto:
  es:
    intro: >-
      El Vjosa nace en Grecia y recorre 270 km, 190 de ellos en Albania, sin que ninguna presa lo detenga. Por
      eso fue el primer parque nacional de río salvaje de Europa, declarado el 15 de marzo de 2023 tras años
      de campaña contra las presas. El río sigue el curso que le marca el agua: pasa por cañones estrechos,
      rápidos, islas y meandros, abre cauces trenzados en el centro y termina en un delta casi natural junto
      al Adriático. Visitarlo es seguir un río vivo, no un monumento.
    landscape: >-
      Todo empieza en las rocas. El Vjosa se abre paso por el sector meridional de los Albánides, cruzando una
      serie de anticlinales y sinclinales afectados por líneas tectónicas activas. Entre Dragot y Poçem, en el
      curso medio, discurre sobre todo por depósitos de flysch de la zona tectónica Jónica. Y bajo tierra, la
      karstificación de los carbonatos alimenta 47 manantiales permanentes del valle.


      El agua dibuja el mosaico: gargantas estrechas arriba, cauces anchos y trenzados en el centro y un delta
      casi natural en la desembocadura. Las crecidas más espaciadas, de entre uno y cinco años, son decisivas
      para las llanuras bajas y moldean las zonas contiguas al cauce activo y las grandes islas. Solo el tramo
      medio reúne al menos ocho tipos de hábitat de la máxima importancia de conservación a escala europea.


      Sobre esa grava crece una vegetación que aguanta la corriente. Los sauces, álamos y tarajes colonizan
      como plantas pioneras las orillas y las islas, y en las llanuras de inundación crecen además plátanos,
      olmos y alisos, adaptados a la fuerza del agua y a sus subidas y bajadas bruscas. Detrás hay bosques y
      matorrales caducifolios, carrizales, praderas y plantas herbáceas.
    wildlife: >-
      El valle es un punto caliente de biodiversidad para Albania: alberga más de mil cien especies, entre
      ellas la [nutria](/especie/lutra_lutra/), el [alimoche](/especie/neophron_percnopterus/) y el lince
      balcánico, en peligro crítico. En la cuenca se han registrado 257 especies de aves. El río mantiene
      además poblaciones relativamente sanas de [anguila](/especie/anguilla_anguilla/) europea, en peligro
      crítico.


      Las aves se cuentan sobre todo en junio. El inventario de junio de 2023 encontró grandes colonias de
      avión zapador, con una estima de entre 12.940 y 14.672 parejas en el Vjosa y sus afluentes; una de las
      mayores colonias estaba junto a Selenica. Las graveras entre Kashishte y Memaliaj concentran
      [alcaravanes](/especie/burhinus_oedicnemus/), que prefieren esas grandes graveras. Y los bancos de
      guijarros junto a la corriente rápida son un hábitat perfecto para el chorlitejo chico, con sus
      principales parejas entre Mifol y la confluencia del Drino.


      El clima marca el resto: mediterráneo, con veranos secos y calurosos e inviernos suaves y húmedos. Los
      meses más cálidos son junio, julio y agosto, y los más fríos, de diciembre a febrero.
    visit: >-
      La mayor parte del río discurre junto a carreteras, así que el vehículo es el medio principal. El río
      atraviesa Përmet, Këlcyrë y Tepelenë, donde recibe al Drino, y sigue por Memaliaj, Selenicë y Novoselë.
      El parque comprende el Vjosa y los afluentes Drino con Kardhiq, Bënça y Shushica, con más de 400 km de
      ríos y 12.727 hectáreas.


      Más que rutas, el valle ofrece huellas humanas. Junto al Shushica, cerca de Brataj, un puente sigue
      sirviendo al paso peatonal. El acueducto de Bënça formaba parte del abastecimiento que construyó Alí
      Pachá en el siglo XIX. A la salida de los cañones de Këlcyrë queda el puente metálico de Dragot, de
      1936.


      El plan turístico prevé un centro de visitantes en Tepelenë y estaciones de información en Vlorë y
      Përmet, con exposiciones, recursos educativos y paneles interactivos; son propuestas, y la ubicación
      concreta está pendiente. También prevé que el centro de investigación de Tepelenë acoja visitantes.
    history: >-
      La categoría II de la UICN busca proteger el río de las presas, la extracción de grava y otras
      actividades dañinas. La declaración pretende afrontar la contaminación del agua y del suelo, la gestión
      de residuos y la deforestación.


      Las amenazas son concretas: la extracción de áridos, las molestias humanas y los animales asilvestrados
      afectan a las aves que crían, sobre todo entre Mifol y Dragot y en el Shushica. Aguas arriba, en Grecia,
      el nacimiento, llamado Aoos allí, está protegido por el Parque Nacional de Vikos-Aoos, pero ese tramo no
      forma parte del parque albanés.
    before: >-
      Prepara el viaje con calma: el plan es un borrador y sus instalaciones aún no se dan por abiertas. Las
      pautas que propone son claras. No molestes a los animales ni interfieras con su reproducción, y evita el
      ruido. Evita las aguas someras donde desovan los peces y los bancos de grava, arena o barro que usan las
      aves para criar y descansar. Retira los residuos de las orillas y del agua, y llévatelos.
    around: >-
      El [Gran Cañón del Río Osum](/lugar/kanioni-i-osumit/) está a unos 20 km. Más lejos, el [Río Drava y
      Llanura de Inundación](/lugar/drava-river---floodplain/) comparte avión zapador, chorlitejo chico y
      cigüeña negra, con corredor fluvial. El [Parque Natural de Els Ports](/lugar/parc-natural-dels-ports/)
      coincide en tortuga mediterránea, alimoche y nutria; el [Parque Natural de s'Albufera de
      Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/), en anguila y galápago europeo; y el [Parque
      Natural de Strandzha](/lugar/priroden-park-strandzha/), en tortuga mediterránea, cigüeña negra y nutria,
      además del corredor fluvial.
  en:
    intro: >-
      The Vjosa rises in the mountains of Greece and flows for 270 km, 190 of them across Albania, without
      encountering a single dam or reservoir. That free flow led to its declaration as Europe's first wild
      river national park on 15 March 2023, following years of dedicated international campaigns. The river
      shapes its course according to hydrology alone: carving narrow gorges, charging over rapids, skirting
      gravel bars and braided channels in its middle reaches, and forming a near-natural delta on the Adriatic
      coast. Exploring it means following a living, dynamic river rather than an artificial monument.
    landscape: >-
      The setting begins with geology. The Vjosa carves through the southern sector of the Albanides, crossing
      folded anticlines and synclines influenced by active tectonic faults. Between Dragot and Poçem, along
      its middle reach, it flows predominantly across flysch formations within the Ionian tectonic zone.
      Beneath the surface, the karstification of regional carbonates feeds 47 permanent freshwater springs
      throughout the valley.


      The river carves a dynamic mosaic: steep limestone canyons upstream, broad gravel plains with braided
      channels in the central valley, and an expansive delta at its mouth. Periodic major floods, occurring at
      intervals of one to five years, play a crucial role across the lower floodplains, continuously reshaping
      riparian margins and mid-channel islands. The middle reach alone encompasses at least eight habitat
      types of European conservation priority.


      Upon this shifting bed of gravel grows hardy vegetation adapted to violent currents. Willows, poplars,
      and tamarisks act as pioneer colonizers along shores and bars, while the wider alluvial floodplains
      support oriental planes, elms, and alders resilient to sharp water fluctuations. Beyond the riparian
      zone spread deciduous scrub, reedbeds, wet meadows, and diverse herbaceous plant communities.
    wildlife: >-
      The valley constitutes a major biodiversity hotspot in Albania, harboring more than eleven hundred
      recorded species, including the [Eurasian otter](/especie/lutra_lutra/), the [Egyptian
      vulture](/especie/neophron_percnopterus/), and the critically endangered Balkan lynx. The basin records
      257 bird species. The river also maintains robust populations of the critically endangered European
      [eel](/especie/anguilla_anguilla/).


      Bird monitoring peaks in June. Comprehensive surveys in June 2023 located enormous breeding colonies of
      sand martins, estimating between 12,940 and 14,672 pairs nesting along the Vjosa and its tributaries,
      with one of the largest concentrations near Selenica. Extensive gravel bars between Kashishte and
      Memaliaj support nesting [Eurasian stone-curlews](/especie/burhinus_oedicnemus/), which require broad,
      undisturbed expanses of shingle. Furthermore, dynamic gravel spits beside swift currents offer optimal
      nesting territory for little ringed plovers, with core populations recorded between Mifol and the Drino
      confluence.


      The Mediterranean climate brings hot, dry summers and mild, rainy winters. June, July, and August are
      the warmest months, while December to February register the lowest temperatures.
    visit: >-
      Because the river flows largely alongside regional highways, exploring by vehicle is the primary travel
      method. The corridor passes Përmet, Këlcyrë, and Tepelenë—where the Drino joins—and continues past
      Memaliaj, Selenicë, and Novoselë. The national park protects the Vjosa and its free-flowing tributaries,
      including the Drino with Kardhiq, Bënça, and Shushica, safeguarding over 400 km of river courses and
      12,727 hectares.


      Beyond formal trails, the valley offers notable historical monuments. Along the Shushica near Brataj, a
      historic stone bridge still serves pedestrians. The Bënça aqueduct formed part of the regional
      waterworks built under Ali Pasha in the nineteenth century. Near the exit of the Këlcyrë gorge stands
      the striking steel bridge of Dragot, constructed in 1936.


      The sustainable tourism concept envisions a primary visitor centre in Tepelenë and complementary
      information posts in Vlorë and Përmet featuring interactive displays and educational exhibits; these
      facilities remain planned developments. A proposed research centre in Tepelenë is also designed to
      welcome visitors.
    history: >-
      IUCN Category II designation aims to safeguard the entire catchment from hydroelectric dams, commercial
      gravel extraction, and industrial encroachment. The establishment also seeks to address water and soil
      contamination, municipal waste management, and catchment deforestation.


      Key conservation pressures include unregulated gravel quarrying, disturbance of nesting colonies by
      human activities, and feral animals, particularly between Mifol and Dragot and along the Shushica.
      Upstream in Greece, the headwaters—locally named the Aoos—are protected within the Vikos-Aoos National
      Park, though that stretch lies beyond the Albanian park boundary.
    before: >-
      Plan your trip with care: the national park management plan is an evolving framework and formal park
      visitor centres are still being developed. Key visitor guidelines are clear: avoid disturbing wildlife
      or interfering with breeding birds, and keep noise to a minimum. Steer clear of shallow spawning
      shallows and sensitive gravel bars used for nesting and roosting. Always carry out any litter you
      generate.
    around: >-
      The [Osum River Grand Canyon](/lugar/kanioni-i-osumit/) lies about 20 km away. Further afield, the
      [Drava River and Floodplain](/lugar/drava-river---floodplain/) shares sand martin, little ringed plover,
      and black stork along a dynamic river corridor. [Els Ports Natural
      Park](/lugar/parc-natural-dels-ports/) converges on Hermann's tortoise, Egyptian vulture, and otter;
      [S'Albufera de Mallorca Natural Park](/lugar/parc-natural-de-s-albufera-de-mallorca/) shares European
      eel and European pond turtle; and [Strandzha Natural Park](/lugar/priroden-park-strandzha/) shares
      Hermann's tortoise, black stork, otter, and protected river habitats.
  fr:
    intro: >-
      La Vjosa prend sa source en Grèce et parcourt 270 km, dont 190 en Albanie, sans qu'aucun barrage
      n'entrave son cours. C'est à ce titre qu'elle est devenue le premier parc national de rivière sauvage
      d'Europe, proclamé le 15 mars 2023 après des années de mobilisation citoyenne. Le fleuve suit la
      dynamique que lui imposent les crues : il traverse des défilés étroits, franchit des rapides, contourne
      des bancs d'alluvions et des chenaux tressés dans sa partie médiane, pour terminer en un delta quasi
      naturel sur l'Adriatique. Visiter ce parc, c'est contempler un fleuve vivant dans sa liberté
      d'écoulement.
    landscape: >-
      Le cadre s'ancre dans la géologie. La Vjosa se fraie un passage à travers les Albanides méridionales,
      recoupant des anticlinaux et synclinaux faillés par une tectonique active. Entre Dragot et Poçem, sur
      son cours moyen, elle serpente à travers des formations de flysch de la zone ionienne. En sous-sol, la
      karstification des massifs carbonatés alimente 47 sources permanentes dans la vallée.


      L'eau modèle un paysage mouvant : gorges encaissées en amont, lit large à chenaux tressés dans la plaine
      centrale et delta ouvert à l'embouchure. Les crues majeures, récurrentes tous les un à cinq ans,
      s'avèrent déterminantes pour la basse plaine en remodelant sans cesse les rives et les grands îlots de
      galets. Le seul tronçon moyen concentre au moins huit types d'habitats d'intérêt communautaire
      prioritaire.


      Sur ces bancs de graviers s'enracine une flore pionnière capable de résister aux crues. Les saules,
      peupliers et tamaris colonisent les atterrissements, tandis que les terrasses inondables accueillent des
      platanes d'Orient, des ormes et des aulnes habitués aux violentes sautes d'eau. En retrait s'étendent
      des boisements de feuillus, des roselières, des prairies humides et un tapis d'herbacées variées.
    wildlife: >-
      La vallée forme un réservoir de biodiversité exceptionnel en Albanie : elle abrite plus de onze cents
      espèces recensées, dont la [loutre d'Europe](/especie/lutra_lutra/), le [vautour
      percnoptère](/especie/neophron_percnopterus/) et le lynx des Balkans, en danger critique d'extinction.
      Le bassin fluvial accueille 257 espèces d'oiseaux. Les eaux hébergent en outre des populations
      d'[anguilles](/especie/anguilla_anguilla/) d'Europe, également en péril critique.


      L'avifaune se révèle particulièrement en juin. Les recensements de juin 2023 ont mis en évidence
      d'immenses colonies d'hirondelles de rivage, estimées entre 12 940 et 14 672 couples sur la Vjosa et ses
      affluents, dont une colonie spectaculaire à Selenica. Les grèves de galets entre Kashishte et Memaliaj
      abritent l'[œdicnème criard](/especie/burhinus_oedicnemus/), très inféodé à ces vastes étendues
      pierreuses. De leur côté, les gravières en eau vive offrent un biotope parfait pour le petit gravelot,
      dont les couples se concentrent entre Mifol et la confluence avec le Drino.


      Le climat méditerranéen apporte des étés chauds et arides et des hivers doux et pluvieux. Les mois les
      plus chauds sont juin, juillet et août, les plus froids allant de décembre à février.
    visit: >-
      La majeure partie du corridor fluvial longe des axes routiers, rendant l'automobile indispensable. Le
      cours d'eau arrose Përmet, Këlcyrë et Tepelenë — où conflue le Drino — avant de traverser Memaliaj,
      Selenicë et Novoselë. Le parc national englobe la Vjosa et ses affluents le Drino avec le Kardhiq, la
      Bënça et la Shushica, protégeant plus de 400 km de rivières vives sur 12 727 hectares.


      Au-delà de sentiers balisés, la vallée révèle d'anciens ouvrages d'art. Sur la Shushica, près de Brataj,
      un vieux pont en pierre assure toujours le passage des piétons. L'aqueduc de Bënça témoigne du réseau
      hydraulique édifié par Ali Pacha au XIXe siècle. À la sortie des défilés de Këlcyrë se dresse le
      remarquable pont métallique de Dragot, érigé en 1936.


      Le projet d'aménagement touristique prévoit un centre principal d'accueil à Tepelenë ainsi que des
      relais d'information à Vlorë et Përmet, équipés de bornes interactives ; ces équipements sont en cours
      de mise en œuvre. Le futur centre de recherche de Tepelenë prévoit également d'accueillir les visiteurs.
    history: >-
      Le statut de catégorie II de l'UICN vise à protéger l'intégralité du fleuve contre les barrages
      hydroélectriques, l'extraction de granulats et les dégradations industrielles. Le classement répond
      également aux défis de la pollution des eaux, du traitement des déchets et de la déforestation des
      berges.


      Les pressions directes sont avérées : le dragage des sédiments, le dérangement humain et la divagation
      d'animaux perturbent les colonies d'oiseaux nicheurs, notamment entre Mifol et Dragot ainsi que le long
      de la Shushica. En amont, en Grèce, la source nommée Aoos est protégée au sein du parc national de
      Vikos-Aoos, mais ce secteur demeure hors des limites du parc albanais.
    before: >-
      Organisez votre séjour avec précaution : les plans d'accueil sont récents et les structures
      muséographiques formelles ne sont pas encore toutes ouvertes. Respectez les règles de bonne conduite :
      ne dérangez pas la faune, respectez les périodes de reproduction et évitez les nuisances sonores. Évitez
      de piétiner les frayères et les bancs de graviers ou de sable où nichent les oiseaux. Remportez
      l'intégralité de vos déchets.
    around: >-
      Le [Grand Canyon de la rivière Osum](/lugar/kanioni-i-osumit/) se situe à environ 20 km. Plus au loin,
      la [rivière Drave et sa plaine d'inondation](/lugar/drava-river---floodplain/) partage l'hirondelle de
      rivage, le petit gravelot et la cigogne noire le long d'un corridor fluvial préservé. Le [parc naturel
      des Ports](/lugar/parc-natural-dels-ports/) partage la tortue d'Hermann, le vautour percnoptère et la
      loutre ; le [parc naturel de s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/)
      partage l'anguille et la cistude d'Europe ; et le [parc naturel de
      Strandzha](/lugar/priroden-park-strandzha/) la tortue d'Hermann, la cigogne noire et la loutre dans un
      corridor aquatique.
  de:
    intro: >-
      Die Vjosa entspringt im griechischen Gebirge und fließt über 270 km, davon 190 km auf albanischem Boden,
      ohne von einer einzigen Staustufe gezähmt zu werden. Aus diesem Grund wurde sie am 15. März 2023 nach
      langjährigem internationalem Widerstand gegen Staudammprojekte zum ersten Wildfluss-Nationalpark Europas
      erklärt. Der Fluss bestimmt seinen Verlauf ausschließlich durch eigene hydrologische Kraft: Er
      durchschneidet enge Felsschluchten, schäumt über Stromschnellen, bildet verzweigte Schotterbetten und
      Inseln im Mittellauf und mündet in einem naturnahen Delta in die Adria. Ihn zu erkunden bedeutet, einem
      lebendigen Flussgefüge zu begegnen.
    landscape: >-
      Den geologischen Rahmen bilden die südlichen Albaniden, wo der Fluss gefaltete Antiklinalen und
      Synklinalen entlang aktiver Störungslinien quert. Zwischen Dragot und Poçem verläuft der Mittellauf vor
      allem über Flyschserien der Ionischen Zone. Im Untergrund speist die Karstifizierung der umgebenden
      Karbonatgesteine 47 perennierende Quellen im Flusstal.


      Das Wasser gestaltet ein dynamisches Landschaftsmosaik: schmale Durchbruchstäler im Oberlauf, weit
      gefächerte Umlagerungsstrecken im Zentrum und ein naturbelassenes Mündungsdelta. Wiederkehrende
      Hochwässer in Intervallen von ein bis fünf Jahren sind entscheidend für die Auenlandschaft und
      modellieren Schotterbänke und Flussinseln permanent neu. Allein der mittlere Flussabschnitt umfasst
      mindestens acht Lebensraumtypen von europäischer Schutzpriorität.


      Auf den Umlagerungsstrecken siedelt eine an starke Strömungen angepasste Pionierflora. Weiden, Pappeln
      und Tamarisken besiedeln Kiesbänke und Flussinseln, während auf den Schwemmebenen Orientalische
      Platanen, Ulmen und Erlen wachsen, die an abrupte Pegelschwankungen gewöhnt sind. Daran schließen sich
      Laubmischwälder, Schilfröhrichte, Auwiesen und artenreiche Staudenfluren an.
    wildlife: >-
      Das Flusstal bildet einen herausragenden Biodiversitäts-Hotspot in Albanien mit über elfhundert
      nachgewiesenen Arten, darunter [Fischotter](/especie/lutra_lutra/),
      [Schmutzgeier](/especie/neophron_percnopterus/) und der vom Aussterben bedrohte Balkanluchs. Im gesamten
      Einzugsgebiet wurden 257 Vogelarten erfasst. Der Fluss beherbergt zudem vitale Populationen des stark
      gefährdeten Europäischen [Aals](/especie/anguilla_anguilla/).


      Besonders im Juni lohnt die Vogelbeobachtung. Erfassungen im Juni 2023 belegten gigantische Brutkolonien
      der Uferschwalbe mit geschätzten 12.940 bis 14.672 Brutpaaren an der Vjosa und ihren Zuflüssen; eine der
      größten Kolonien nistet bei Selenica. Auf den ausgedehnten Schotterfluren zwischen Kashishte und
      Memaliaj brütet der [Triel](/especie/burhinus_oedicnemus/), der breite Geröllbänke bevorzugt. Kiesbänke
      an strömungsreichen Flussarmen bieten dem Flussregenpfeifer ideale Brutplätze, vor allem zwischen Mifol
      und der Drino-Mündung.


      Das Klima ist typisch mediterran mit heißen, trockenen Sommern und milden, feuchten Wintern. Die
      heißesten Monate sind Juni, Juli und August, die kältesten reichen von Dezember bis Februar.
    visit: >-
      Da die Hauptverkehrswege weitgehend parallel zum Flussbett verlaufen, ist das Auto das bevorzugte
      Verkehrsmittel. Der Fluss passiert Përmet, Këlcyrë und Tepelenë — wo der Drino einmündet — und fließt
      weiter über Memaliaj, Selenicë und Novoselë. Der Nationalpark umfasst die Vjosa sowie die Zubringer
      Drino mit Kardhiq, Bënça und Shushica mit über 400 km Fließgewässern und 12.727 Hektar Schutzfläche.


      Neben Naturbeobachtungen birgt das Tal bemerkenswerte Kulturdenkmäler. An der Shushica bei Brataj
      überspannt eine historische Steinbogenbrücke den Fluss. Das Aquädukt von Bënça gehörte zur
      Wasserleitung, die Ali Pascha im neunzehnten Jahrhundert errichten ließ. Am Ausgang der Këlcyrë-Schlucht
      steht die stählerne Bogenbrücke von Dragot aus dem Jahr 1936.


      Das Tourismuskonzept sieht ein Hauptbesucherzentrum in Tepelenë sowie Informationsstellen in Vlorë und
      Përmet mit Bildungsangeboten vor; diese Einrichtungen befinden sich in der Planungsphase. Auch das
      geplante Forschungszentrum in Tepelenë soll Besuchern offenstehen.
    history: >-
      Die Schutzkategorie II der IUCN bezweckt, den Fluss vor Wasserkraftanlagen, Kiesabbau und
      Industrieansiedlungen zu bewahren. Zugleich soll die Unterschutzstellung Abwasserprobleme, illegale
      Mülldeponien und Uferabholzungen eindämmen.


      Reale Gefährdungen bestehen in Kiesentnahmen, Störungen der Brutvögel durch Freizeitnutzung und
      streunenden Hunden, vor allem zwischen Mifol und Dragot sowie an der Shushica. Flussaufwärts in
      Griechenland steht der dort Aoos genannte Quellfluss im Nationalpark Vikos-Aoos unter Schutz, gehört
      jedoch nicht zum albanischen Nationalpark.
    before: >-
      Plane deine Reise vorausschauend: Die Parkverwaltung befindet sich im Aufbau und feste Besucherzentren
      sind noch nicht flächendeckend eröffnet. Die Verhaltensregeln sind klar: Störe keine Wildtiere, vermeide
      Ruhestörungen und halte Abstand zu Brutkolonien. Betrete keine seichten Laichgewässer oder Schotterbänke
      während der Brutzeit. Nimm sämtliche Abfälle wieder mit.
    around: >-
      Der [Canyon des Flusses Osum](/lugar/kanioni-i-osumit/) liegt etwa 20 km entfernt. Weiter entfernt teilt
      die [Drau und ihre Auenlandschaft](/lugar/drava-river---floodplain/) Uferschwalbe, Flussregenpfeifer und
      Schwarzstorch entlang eines intakten Flusskorridors. Der [Naturpark Els
      Ports](/lugar/parc-natural-dels-ports/) weist Maurische Landschildkröte, Schmutzgeier und Fischotter
      auf; der [Naturpark s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) teilt Aal
      und Europäische Sumpfschildkröte; und der [Naturpark Strandscha](/lugar/priroden-park-strandzha/) teilt
      Landschildkröte, Schwarzstorch und Fischotter in naturnahen Flusskorridoren.
  it:
    intro: >-
      Il Vjosa nasce in Grecia e compie 270 km, di cui 190 in territorio albanese, senza che alcuna diga ne
      arresti la corsa. Per questa ragione è stato istituito come primo parco nazionale di fiume selvaggio
      d'Europa, proclamato il 15 marzo 2023 al culmine di una lunga mobilitazione civile. Il corso d'acqua
      segue il tragitto modellato dalle piene: attraversa gole aspre, salti d'acqua, banchi alluvionali e rami
      intrecciati nel settore centrale, per concludersi in un delta quasi vergine sull'Adriatico. Visitarlo
      significa seguire un fiume vivente, non un monumento statico.
    landscape: >-
      Il teatro naturale affonda le radici nella geologia. Il Vjosa si apre la via attraverso il settore
      meridionale delle Albanidi, incidendo anticlinali e sinclinali segnate da faglie tettoniche attive. Tra
      Dragot e Poçem, nel medio corso, scorre principalmente su sedimenti di flysch della zona ionica. Nel
      sottosuolo, la dissoluzione carsica delle formazioni carbonatiche alimenta 47 sorgenti perenni lungo la
      vallata.


      L'acqua compone un mosaico dinamico: forre dirupate a monte, ampi letti fluviali a canali intrecciati al
      centro e un delta naturale alla foce. Le piene periodiche, che ricorrono a intervalli di uno a cinque
      anni, sono decisive per le pianure alluvionali e ridisegnano continuamente sponde e isolotti ghiaiosi.
      Il solo tratto mediano ospita almeno otto tipologie di habitat di prioritaria rilevanza
      conservazionistica europea.


      Sui banchi di ghiaia attecchisce una vegetazione resistente alla corrente. Salici, pioppi e tamerici
      operano come specie pioniere sulle sponde e sulle isole fluviali, mentre sulle terrazze alluvionali
      allignano platani orientali, olmi e ontani capaci di sopportare violente oscillazioni di portata. Verso
      l'esterno si estendono macchie caducifoglie, canneti, prati umidi e formazioni erbacee.
    wildlife: >-
      La valle costituisce un primario centro di biodiversità per l'Albania: raccoglie oltre undicento specie
      censite, tra cui spiccano la [lontra](/especie/lutra_lutra/), il
      [capovaccaio](/especie/neophron_percnopterus/) e il lince balcanico, in pericolo critico di estinzione.
      Nel bacino sono state documentate 257 specie di uccelli. Il fiume accoglie inoltre popolazioni stabili
      di [anguilla](/especie/anguilla_anguilla/) europea, gravemente minacciata.


      L'avifauna risalta in particolare a giugno. I rilievi condotti a giugno 2023 hanno censito imponenti
      colonie di topino, stimate tra 12.940 e 14.672 coppie lungo il Vjosa e i suoi affluenti; una delle
      colonie principali sorge presso Selenica. Le ampie distese di ciottoli tra Kashishte e Memaliaj ospitano
      l'[occhione comune](/especie/burhinus_oedicnemus/), strettamente legato a questi ambienti ghiaiosi. Le
      lanche e le isole fluviali a corrente vivace forniscono l'habitat idoneo per il corriere piccolo, le cui
      coppie nidificano soprattutto fra Mifol e la confluenza del Drino.


      Il clima mediterraneo comporta estati calde e asciutte e inverni miti e piovosi. I mesi più torridi sono
      giugno, luglio e agosto, mentre i più freddi vanno da dicembre a febbraio.
    visit: >-
      Poiché il fiume scorre per gran parte lungo la viabilità ordinaria, l'automobile è il mezzo di
      spostamento primario. Il corso tocca i centri di Përmet, Këlcyrë e Tepelenë — dove riceve le acque del
      Drino — e prosegue verso Memaliaj, Selenicë e Novoselë. Il parco tutela il Vjosa e gli affluenti Drino
      con Kardhiq, Bënça e Shushica, vincolando oltre 400 km di corsi fluviali e 12.727 ettari.


      Accanto ai percorsi naturali emergono memorie storiche. Lungo il fiume Shushica, vicino a Brataj, un
      antico ponte in pietra è tuttora utilizzato per il transito pedonale. L'acquedotto di Bënça faceva parte
      dell'acquedotto fatto erigere da Alì Pascià nel XIX secolo. All'uscita delle gole di Këlcyrë resiste lo
      storico ponte metallico di Dragot, risalente al 1936.


      Il piano per il turismo sostenibile prevede la realizzazione di un centro visitatori principale a
      Tepelenë e presidi informativi a Valona e Përmet provvisti di supporti interattivi; tali strutture sono
      in corso di definizione. Si prevede inoltre che il polo scientifico di Tepelenë possa aprire le porte ai
      visitatori.
    history: >-
      L'inquadramento nella categoria II dell'IUCN mira a preservare l'intero corso d'acqua da dighe
      idroelettriche, estrazione commerciale di ghiaia e insediamenti industriali nocivi. L'istituzione
      intende fronteggiare l'inquinamento idrico, lo smaltimento dei rifiuti e la deforestazione delle ripe.


      Le criticità ambientali includono l'asportazione di inerti, il disturbo causato dalle attività
      antropiche e gli animali randagi ai danni dei volatili nidificanti, in particolare tra Mifol e Dragot e
      lungo la Shushica. A monte, in territorio greco, le sorgenti chiamate Aoos sono protette nel Parco
      Nazionale di Vikos-Aoos, ma tale tratto resta estraneo al parco albanese.
    before: >-
      Organizza l'escursione con anticipo: il piano di gestione è in fase iniziale e i centri di accoglienza
      non sono ancora tutti completati. Rispetta rigorosamente i canoni ambientali: non molestare gli animali,
      evita schiamazzi e non interferire con le nidificazioni. Non calpestare i bassifondi ghiaiosi dove i
      pesci depongono le uova o dove gli uccelli nidificano. Riporta con te tutti i rifiuti.
    around: >-
      Il [Gran Canyon del Fiume Osum](/lugar/kanioni-i-osumit/) dista circa 20 km. Più lontano, il [Fiume
      Drava e Pianura Alluvionale](/lugar/drava-river---floodplain/) condivide topino, corriere piccolo e
      cicogna nera lungo un corridoio fluviale integro. Il [Parco naturale di Els
      Ports](/lugar/parc-natural-dels-ports/) presenta testuggine di Hermann, capovaccaio e lontra; il [Parco
      naturale di s'Albufera de Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) condivide anguilla e
      testuggine palustre europea; e il [Parco naturale di Strandzha](/lugar/priroden-park-strandzha/)
      accoglie testuggine di Hermann, cicogna nera e lontra in ambienti fluviali.
  pt:
    intro: >-
      O Vjosa nasce nas montanhas da Grécia e percorre 270 km, dos quais 190 km em território albanês, sem que
      qualquer barragem trave as suas águas. Por essa razão tornou-se o primeiro parque nacional de rio
      selvagem da Europa, proclamado a 15 de março de 2023 após anos de luta cívica contra empreendimentos
      hidroelétricos. O rio desenha o leito que a dinâmica natural lhe impõe: rasga desfiladeiros apertados,
      salta rápidos, contorna ilhotas e esteiros entrelaçados no troço intermédio e culmina num delta quase
      virgem junto ao Adriático. Percorrê-lo é testemunhar um rio vivo e livre de canalizações.
    landscape: >-
      O cenário tem raízes na geologia. O Vjosa abre passagem através do setor meridional dos Albanides,
      transpondo anticlinais e sinclinais fraturados por falhas tectónicas ativas. Entre Dragot e Poçem, no
      seu curso médio, corre fundamentalmente sobre sequências de flysch da zona iónica. Em profundidade, a
      carsificação dos maciços calcários alimenta 47 nascentes perenes ao longo do vale.


      A força da corrente cinzela a paisagem: gargantas alcantiladas a montante, amplas planícies de canais
      entrelaçados no centro e um delta amplo na foz. As cheias cíclicas de grande amplitude, que ocorrem em
      intervalos de um a cinco anos, assumem papel decisivo na várzea ao remexerem continuamente as margens e
      as ilhas de cascalho. Só o setor médio concentra pelo menos oito tipologias de habitats com prioridade
      de conservação europeia.


      Sobre estes sedimentos fluviais desenvolve-se uma flora adaptada à violência das cheias. Salgueiros,
      choupos e tamargueiras colonizam praias e ilhotas como pioneiros, ao passo que nos terraços aluviais
      brotam plátanos-orientais, olmos e amieiros habituados a súbitas subidas de caudal. Mais recuados surgem
      matagais caducifólios, caniçais, prados húmidos e herbáceas ribeirinhas.
    wildlife: >-
      O vale constitui um santuário de biodiversidade na Albânia: congrega mais de onzecentas espécies
      registadas, entre as quais a [lontra](/especie/lutra_lutra/), o
      [abutre-do-egito](/especie/neophron_percnopterus/) e o lince-dos-balcãs, em perigo crítico. A bacia
      hidrográfica alberga 257 espécies de aves. As águas sustentam ainda comunidades saudáveis de
      [enguia](/especie/anguilla_anguilla/) europeia, igualmente em perigo crítico.


      A época de maior esplendor avifaunístico ocorre em junho. As campanhas de junho de 2023 identificaram
      colónias densas de andorinha-das-barreiras, estimando-se entre 12.940 e 14.672 casais nidificantes no
      Vjosa e tributários, com uma colónia de grande vulto junto a Selenica. Os extensos areais de calhaus
      entre Kashishte e Memaliaj concentram casais de [alcaravão](/especie/burhinus_oedicnemus/), dependentes
      dessas amplas cascalheiras. Paralelamente, as praias de gravilha junto à corrente rápida oferecem abrigo
      ao borrelho-pequeno-de-coleira, repartido sobretudo entre Mifol e o confluente do Drino.


      O clima mediterrânico traduz-se em verões quentes e secos e invernos suaves e chuvosos. Os meses mais
      quentes são junho, julho e agosto, e os mais frios estendem-se de dezembro a fevereiro.
    visit: >-
      Dado que a via rodoviária acompanha de perto grande parte da bacia, o automóvel constitui o meio de
      transporte essencial. O rio banha Përmet, Këlcyrë e Tepelenë — onde confluem as águas do Drino —
      prosseguindo para Memaliaj, Selenicë e Novoselë. O perímetro do parque engloba o Vjosa e os afluentes
      Drino com o Kardhiq, o Bënça e o Shushica, totalizando mais de 400 km de cursos hídricos e 12.727
      hectares.


      A par dos valores fluviais, o vale guarda património construído. Ao longo do Shushica, perto de Brataj,
      uma secular ponte de pedra continua a permitir a travessia apeada. O aqueduto de Bënça integrou a rede
      de abastecimento erigida por Ali Paxá no século XIX. À saída do desfiladeiro de Këlcyrë impõe-se a ponte
      metálica de Dragot, construída em 1936.


      O plano de desenvolvimento turístico prevê a abertura de um centro de visitantes em Tepelenë e polos de
      informação em Vlorë e Përmet dotados de exposições interativas, encontrando-se ainda em fase de
      implantação. Prevê-se também que o futuro laboratório de investigação de Tepelenë possa abrir as portas
      à comunidade.
    history: >-
      A classificação sob a Categoria II da UICN tem por fim blindar o rio contra aproveitamentos
      hidroelétricos, dragagens de inertes e efluentes industriais. O estatuto visa ainda mitigar a
      contaminação aquática, o despejo de resíduos e a desmatação das galerias ripícolas.


      Entre as ameaças contam-se a extração de cascalho, a perturbação humana das aves durante o choco e a
      presença de animais vadios, com particular incidência entre Mifol e Dragot e no Shushica. A montante, na
      Grécia, a cabeceira designada por Aoos goza de proteção no Parque Nacional de Vikos-Aoos, embora esse
      segmento permaneça fora da jurisdição albanesa.
    before: >-
      Organiza a tua viagem com antecedência: o plano de gestão está no início e as infraestruturas de apoio
      ainda não se encontram todas operacionais. Observa as diretrizes éticas: não perturbes a fauna, evita
      ruídos e respeita os períodos de reprodução. Abstém-te de calcar os baixios fluviais e as praias de
      cascalho onde peixes e aves nidificam. Recolhe e transporta contigo todo o lixo produzido.
    around: >-
      O [Grande Desfiladeiro do Rio Osum](/lugar/kanioni-i-osumit/) localiza-se a cerca de 20 km. Mais longe,
      o [Rio Drava e Planície Aluvial](/lugar/drava-river---floodplain/) partilha a andorinha-das-barreiras, o
      borrelho-pequeno-de-coleira e a cegonha-preta ao longo de um corredor fluvial preservado. O [Parque
      Natural de Els Ports](/lugar/parc-natural-dels-ports/) partilha a tartaruga-mediterrânica, o
      abutre-do-egito e a lontra; o [Parque Natural de s'Albufera de
      Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/) partilha a enguia e o
      cágado-de-carapaça-estriada; e o [Parque Natural de Strandzha](/lugar/priroden-park-strandzha/) acolhe a
      tartaruga-mediterrânica, a cegonha-preta e a lontra num ambiente ribeirinho.
