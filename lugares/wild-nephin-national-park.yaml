resumen:
  es: >-
    Una de las mayores turberas de cobertor de Europa occidental y montañas sin carreteras, con un proyecto de
    renaturalización de antiguas plantaciones.
  en: >-
    One of Western Europe’s largest blanket bogs and roadless mountain wildernesses, undergoing ambitious
    rewilding across former commercial timber plantations.
  fr: >-
    L’une des plus vastes tourbières de couverture d’Europe occidentale et des massifs sans routes, objet d’un
    réensauvagement de plantations forestières.
  de: >-
    Eines der größten Deckenmoore Westeuropas und straßenlose Bergwildnis mit ambitionierter Renaturierung
    vormaliger Holzplantagen.
  it: >-
    Una delle maggiori torbiere di copertura dell’Europa occidentale e montagne senza strade, al centro di un
    ambizioso progetto di rinaturazione.
  pt: >-
    Uma das maiores turfeiras de cobertura da Europa Ocidental e montanhas sem estradas, em processo de
    renaturalização de antigas plantações florestais.
unico:
  es: >-
    Una turbera intacta bajo algunos de los cielos nocturnos más oscuros del mundo, con certificación de
    Parque Internacional de Cielo Oscuro de categoría Oro.
  en: >-
    Pristine active blanket bog beneath some of the darkest night skies on Earth, certified as an
    International Dark Sky Park of Gold Tier status.
  fr: >-
    Une tourbière intacte sous l’un des ciels nocturnes les plus purs au monde, labellisé Parc international
    de ciel étoilé de niveau Or.
  de: >-
    Ein intaktes Deckenmoor unter einem der dunkelsten Nachthimmel der Welt, ausgezeichnet als Internationaler
    Sternenpark mit Gold-Status.
  it: >-
    Una torbiera intatta sotto uno dei cieli notturni più bui del pianeta, certificata Parco Internazionale
    del Cielo Buio di categoria Oro.
  pt: >-
    Uma turfeira intocada sob um dos céus noturnos mais límpidos do planeta, certificada como Parque
    Internacional de Céu Escuro de nível Ouro.
observaciones:
  es: >-
    Quien haga una ruta avanzada, a pie o con acampada, debe registrarse antes. Solo se puede acampar en
    campamentos designados y con el registro en línea. Las hogueras se permiten solo en las zonas de fuego de
    esos campamentos. Calza botas y lleva ropa de lluvia: los senderos se encharcan.
texto:
  es:
    intro: >-
      Dentro de Wild Nephin está el punto de tierra más remoto de la Irlanda continental. No es un dato de
      curiosidad: resume lo que es este parque del noroeste del condado de Mayo, unas 15 000 hectáreas de
      naturaleza deshabitada que domina la cordillera de Nephin Beg y que, al oeste de las montañas, tiene la
      turbera de Owenduff, uno de los últimos sistemas de turbera de cobertor activa e intacta de Europa
      occidental.


      Nació en 1998 como Parque Nacional de Ballycroy. En 2017 se añadieron 4 000 hectáreas de bosque de
      coníferas y montaña a las 11 000 originales, y el parque se rebautizó como Wild Nephin con la idea de
      renaturalizar esas tierras.
    landscape: >-
      La turbera de Owenduff ocupa unos 150 kilómetros cuadrados y es una de las mayores extensiones de
      turbera de Europa. Su río, el Owenduff, es el único de Europa occidental que todavía drena una turbera
      de cobertor relativamente intacta y extensa. Alrededor de ella el parque protege brezal alpino, pastizal
      de montaña, brezal, lagos y cuencas fluviales. Entre las plantas raras está el musgo Hamatocaulis
      vernicosus, y a lo largo de los ríos del parque crece la campanilla de hiedra, que en Irlanda solo se
      encuentra en el condado de Mayo. La saxífraga de los pantanos pone una mancha amarilla con puntos rojos
      en la turbera de julio a septiembre.


      Las tierras añadidas en 2017 eran plantaciones industriales de pino contorta y pícea, con pistas
      forestales por todas partes. Hoy se las trata de devolver a un paisaje más natural. En la orilla de
      Claggan, de hecho, el pasado asoma solo: tocones de pinos antiguos emergen de la turbera y de la costa,
      restos de bosques de hace mucho tiempo.
    wildlife: >-
      La zona de Owenduff es lugar de descanso, alimentación y cría del ánsar careto de Groenlandia. Entre la
      fauna importante del parque también están el [chorlito dorado europeo](/especie/pluvialis_apricaria/),
      el lagópodo escocés y la [nutria](/especie/lutra_lutra/). Otras aves raras son el [cisne
      cantor](/especie/cygnus_cygnus/) y el [halcón peregrino](/especie/falco_peregrinus/). El Owenduff es
      además un río importante para el [salmón atlántico](/especie/salmo_salar/) y la trucha de mar.


      En el sendero de Claggan se oyen limícolas como el [zarapito real](/especie/numenius_arquata/) y el
      chorlitejo grande, y se pueden ver nutrias y focas. En el Vary's Loop te acompañan la lavandera
      cascadeña y el [mirlo acuático](/especie/cinclus_cinclus/). De las 35 especies de mariposas de Irlanda,
      20 se han registrado en el parque, y los guías censan abejorros de marzo a octubre en el sendero Daithí
      Bán. Sin depredadores naturales, el aumento del [ciervo](/especie/cervus_elaphus/) presiona bosques y
      turberas, por lo que su población necesita gestión continua.


      El cielo marca otro calendario. En una noche despejada se ven a simple vista miles de estrellas, otros
      planetas, la Vía Láctea e incluso lluvias de meteoros. Los puntos de observación están abiertos todo el
      año.
    visit: >-
      El grueso del parque es para montañeros con experiencia, pero hay paseos más fáciles. El centro de
      visitantes de Ballycroy, con una exposición interactiva sobre la biodiversidad y parte del patrimonio
      cultural de la región, es la puerta de entrada. De él sale el sendero Tóchar Daithí Bán, un paseo de
      veinte a treinta minutos con vistas a la isla de Achill, a Nephin Beg y al Atlántico, accesible para
      todos. Se llama así por el gigante mítico Daithí Bán, que según la tradición levantó una fortaleza en la
      montaña más alta del parque, Corslieve o Slieve Carr, de 721 metros.


      Hacia el sur, el Claggan Mountain Coastal Trail, de 2 km, cruza turbera atlántica y una orilla
      resguardada con vistas a la bahía de Bellacragher y Achill. En el este, junto al refugio Brogan Carroll
      Bothy, en Letterkeen, salen recorridos señalizados de 2,5, 5, 10 y 12 km. El Vary's Loop sigue 2,5 km
      junto al río Altacooney. El Bothy Loop va por un viejo camino ganadero, cortafuegos, pistas y la orilla
      del río, sobre todo entre plantaciones forestales. El Bangor Trail es otra cosa: un viejo camino por
      Nephin Beg que fue la ruta principal de Bangor a Newport desde el siglo XVI, y que hoy es solo para
      excursionistas muy experimentados.
    history: >-
      En el fuerte de Lios na Gaoithe, uno de los mejor conservados de la zona, los terraplenes protegían a
      gente y ganado de las fieras, incluidos los lobos que recorrieron estas tierras hasta el siglo XVIII. La
      leyenda cuenta que el gigante Daithí se hundió en un lago turboso de Bellacorick que hoy lleva su
      nombre. Hoy un proyecto estudia recuperar bosque autóctono en tierras marginales del antiguo dominio
      forestal, con plantación de hasta 2 000 plántulas de pino silvestre. Cualquiera puede ayudar contando
      insectos polinizadores: basta observar un grupo de flores diez minutos y anotar los visitantes.
    before: >-
      Quien haga una ruta avanzada, a pie o con acampada, debe registrarse antes. Solo se puede acampar en
      campamentos designados y con el registro en línea. Las hogueras se permiten solo en las zonas de fuego
      de esos campamentos. Calza botas y lleva ropa de lluvia: los senderos se encharcan.
    around: >-
      A unos diez kilómetros está [Achill Island y los acantilados de Croaghaun](/lugar/achill-island/), la
      isla que se divisa desde el sendero Tóchar Daithí Bán. Más lejos, el parque comparte con [The Flow
      Country](/lugar/the-flow-country/) el chorlito dorado europeo y la nutria en un paisaje de turbera, y
      con [Parque Natural del Valle del Salaca](/lugar/salacas-ielejas-dabas-parks/) el salmón atlántico y la
      nutria.
  en:
    intro: >-
      Tucked within Wild Nephin lies the most remote point of land in mainland Ireland. This is no mere
      geographical trivia: it captures the essence of this northwest County Mayo wilderness, some 15,000
      hectares of uninhabited nature dominated by the Nephin Beg mountain range, holding to its west the vast
      Owenduff bog, one of the last extensive, intact active blanket bog systems in Western Europe.


      Established in 1998 as Ballycroy National Park, the reserve expanded in 2017 when 4,000 hectares of
      conifer plantation and uplands were added to the original 11,000 hectares, prompting its rechristening
      as Wild Nephin to reflect a visionary rewilding commitment.
    landscape: >-
      The Owenduff bog spans roughly 150 square kilometres, ranking among the largest unbroken blanket bogs in
      Europe. Its namesake river, the Owenduff, is the only river in Western Europe still draining an intact,
      extensive blanket bog catchment. Surrounding it, the park safeguards alpine heath, mountain grassland,
      moorland, glacial loughs, and river corridors. Rare botanical treasures include the moss Hamatocaulis
      vernicosus and ivy-leaved bellflower, which within Ireland grows exclusively in County Mayo. Yellow
      marsh saxifrage splashes gold and scarlet across the bog from July to September.


      The lands incorporated in 2017 were industrial plantations of lodgepole pine and Sitka spruce
      crisscrossed by logging tracks. Today work is underway to rewild them toward natural bog and native
      woodland. Along the Claggan shore, ancient history emerges unprompted: subfossil pine stumps weather out
      of the peat and tidal strand, relics of ancient primeval forests.
    wildlife: >-
      The Owenduff wilderness serves as a vital wintering, feeding, and staging ground for Greenland
      white-fronted geese. Notable resident fauna includes the [European golden
      plover](/especie/pluvialis_apricaria/), red grouse, and [Eurasian otter](/especie/lutra_lutra/). Other
      rare birds feature the [whooper swan](/especie/cygnus_cygnus/) and [peregrine
      falcon](/especie/falco_peregrinus/). The Owenduff remains an internationally renowned river for
      [Atlantic salmon](/especie/salmo_salar/) and sea trout.


      Along the Claggan trail, waders such as the [Eurasian curlew](/especie/numenius_arquata/) and common
      ringed plover call across the tidal inlet, where otters and harbour seals can be spotted. On the Vary's
      Loop, grey wagtails and [white-throated dippers](/especie/cinclus_cinclus/) flit beside the waters. Of
      Ireland’s 35 butterfly species, 20 have been recorded here, while rangers conduct bumblebee transects
      from March to October along the Daithí Bán trail. Lacking natural predators, expanding [red
      deer](/especie/cervus_elaphus/) herds exert heavy browsing pressure on woodlands and bogs, requiring
      continuous population management.


      The night sky offers a distinct celestial calendar. On clear nights thousands of stars, distant planets,
      the Milky Way, and vibrant meteor showers are visible to the naked eye. Dedicated viewing sites are
      accessible year-round.
    visit: >-
      While the rugged interior is suited for experienced wilderness navigators, gentle walks welcome
      everyone. The Ballycroy Visitor Centre, housing interactive displays on regional biodiversity and
      cultural history, serves as the main gateway. From it departs the Tóchar Daithí Bán trail, an easy
      twenty-to-thirty-minute looped boardwalk offering sweeping panoramas of Achill Island, Nephin Beg, and
      the Atlantic. It honours the mythical giant Daithí Bán, said to have held a mountaintop stronghold on
      Corslieve (Slieve Carr), the park’s highest peak at 721 metres.


      To the south, the 2 km Claggan Mountain Coastal Trail traverses Atlantic blanket bog and sheltered
      shoreline with views over Bellacragher Bay. In the east, starting near the Brogan Carroll Bothy in
      Letterkeen, marked looped trails stretch 2.5, 5, 10, and 12 km. The Vary's Loop covers 2.5 km along the
      Altacooney River. The Bothy Loop follows old cattle tracks and firebreaks through evolving woodlands. In
      contrast, the historic Bangor Trail is an arduous, remote trek across Nephin Beg, dating to the
      sixteenth century, strictly for seasoned hillwalkers.
    history: >-
      At Lios na Gaoithe ringfort, among the region’s best preserved, earthen ramparts once shielded families
      and livestock from predators, including wolves that roamed these wild glens until the eighteenth
      century. Folk tradition tells of the giant Daithí drowning in a deep peat tarn at Bellacorick that still
      bears his name. Today, conservation teams are testing native woodland regeneration on marginal
      plantation sites, planting up to 2,000 Scots pine saplings. Visitors can contribute through pollinator
      citizen science by logging flower visitors during ten-minute counts.
    before: >-
      Hikers undertaking advanced backcountry routes or wilderness wild camping must register in advance.
      Camping is permitted strictly at designated wilderness campsites following online registration.
      Campfires are allowed solely in designated fire pits. Sturdy waterproof hiking boots and rainproof
      clothing are essential, as peat trails quickly become waterlogged.
    around: >-
      Roughly ten kilometres away lies [Achill Island and Croaghaun Cliffs](/lugar/achill-island/), visible
      from the Tóchar Daithí Bán trail. Further afield, the park shares European golden plover and otter with
      [The Flow Country](/lugar/the-flow-country/) in peatland landscapes, and Atlantic salmon and otter with
      [Salaca Valley Nature Park](/lugar/salacas-ielejas-dabas-parks/).
  fr:
    intro: >-
      Au cœur de Wild Nephin se trouve le point le plus reculé de toute l’Irlande continentale. Loin d’être
      une simple curiosité, cette donnée résume la nature sauvage de ce parc du nord-ouest du comté de Mayo :
      quelque 15 000 hectares de terres inhabitées dominées par la chaîne de Nephin Beg, abritant à l’ouest la
      tourbière d’Owenduff, l’un des derniers ensembles de tourbières de couverture actives et préservées
      d’Europe occidentale.


      Créé en 1998 sous le nom de parc national de Ballycroy, il s’est agrandi en 2017 de 4 000 hectares de
      plantations de conifères et de crêtes montagnardes adjoints aux 11 000 hectares d’origine, prenant alors
      le nom de Wild Nephin pour porter un vaste projet de réensauvagement.
    landscape: >-
      La tourbière d’Owenduff couvre environ 150 kilomètres carrés, figurant parmi les plus vastes étendues
      tourbeuses d’Europe. Sa rivière éponyme, l’Owenduff, est la seule d’Europe occidentale à drainer un
      bassin versant de tourbière de couverture encore vaste et intact. Tout autour, le parc protège des
      landes alpines, des pelouses d’altitude, des tourbières, des lacs et des cours d’eau. Parmi les raretés
      botaniques figurent la mousse Hamatocaulis vernicosus et la wahlenbergie à feuilles de lierre, cantonnée
      en Irlande au seul comté de Mayo. La saxifrage des tourbières parsème la tourbe de touches jaune d’or
      d’août à septembre.


      Les parcelles intégrées en 2017 étaient des plantations industrielles d’épinettes de Sitka et de pins
      tordus striés de pistes forestières, aujourd’hui rendues à une dynamique naturelle. Sur le rivage de
      Claggan, le passé ressurgit : de vénérables souches de pins subfossiles émergent de la tourbe côtière,
      vestiges de forêts préhistoriques.
    wildlife: >-
      La zone d’Owenduff sert de halte, de gagnage et d’hivernage à l’oie rieuse du Groenland. La faune
      patrimoniale compte également le [pluvier doré](/especie/pluvialis_apricaria/), le lagopède d’Écosse et
      la [loutre d’Europe](/especie/lutra_lutra/). D’autres oiseaux remarquables incluent le [cygne
      chanteur](/especie/cygnus_cygnus/) et le [faucon pèlerin](/especie/falco_peregrinus/). L’Owenduff est en
      outre une rivière de référence pour le [saumon atlantique](/especie/salmo_salar/) et la truite de mer.


      Sur le sentier côtier de Claggan retentissent les cris de limicoles comme le [courlis
      cendré](/especie/numenius_arquata/) et le grand gravelot, et l’on y aperçoit loutres et phoques. Le long
      du Vary's Loop virevoltent la bergeronnette des ruisseaux et le [cincle
      plongeur](/especie/cinclus_cinclus/). Des 35 espèces de papillons d’Irlande, 20 sont présentes dans le
      parc, tandis que les gardes recensent les bourdons de mars à octobre le long du sentier Daithí Bán. En
      l’absence de prédateurs naturels, les hardes de [cerfs élaphes](/especie/cervus_elaphus/) exercent une
      forte pression sur la végétation, nécessitant une régulation suivie.


      La nuit ouvre un autre spectacle. Par temps clair, des milliers d’étoiles, des planètes, la Voie lactée
      et des pluies d’étoiles filantes s’observent à l’œil nu. Les postes d’observation astronomique sont
      accessibles toute l’année.
    visit: >-
      Si l’intérieur sauvage s’adresse aux randonneurs expérimentés, des promenades familiales sont aménagées.
      Le centre des visiteurs de Ballycroy, doté d’une muséographie interactive sur la biodiversité et
      l’histoire locale, constitue le point de départ idéal. De là part le sentier Tóchar Daithí Bán, une
      boucle accessible de vingt à trente minutes sur caillebotis offrant des vues panoramiques sur l’île
      d’Achill, le massif de Nephin Beg et l’océan. Son nom évoque le géant mythologique Daithí Bán, qui
      aurait érigé sa forteresse au sommet de Slieve Carr (721 mètres).


      Au sud, le Claggan Mountain Coastal Trail (2 km) longe le littoral abrité de Bellacragher Bay. À l’est,
      depuis le refuge Brogan Carroll Bothy à Letterkeen, s’élancent des boucles balisées de 2,5, 5, 10 et 12
      km. Le Vary's Loop suit la rivière Altacooney sur 2,5 km. Le Bothy Loop emprunte d’anciens chemins
      pastoraux. Le rude Bangor Trail, tracé historique à travers Nephin Beg remontant au XVIe siècle, est
      réservé aux randonneurs chevronnés.
    history: >-
      Au fort circulaire de Lios na Gaoithe, l’un des mieux préservés de la région, de hauts talus
      protégeaient familles et troupeaux des bêtes féroces, dont les loups qui hantèrent ces contrées jusqu’au
      XVIIIe siècle. Selon la légende, le géant Daithí périt enlisé dans un étang tourbeux de Bellacorick
      portant toujours son nom. Aujourd’hui, un programme pilote réintroduit des essences indigènes sur les
      anciennes coupes forestières en plantant jusqu’à 2 000 jeunes pins sylvestres. Chacun peut participer au
      suivi des pollinisateurs en notant les insectes butinant dix minutes durant.
    before: >-
      Les randonneurs s’engageant sur les itinéraires d’altitude ou en bivouac sauvage doivent impérativement
      s’enregistrer au préalable. Le camping sauvage est restreint aux zones autorisées sur réservation en
      ligne. Feux de camp autorisés uniquement dans les foyers aménagés. Prévoyez de bonnes chaussures de
      marche imperméables et des vêtements de pluie.
    around: >-
      À une dizaine de kilomètres se déploient [l’île d’Achill et les falaises de
      Croaghaun](/lugar/achill-island/), bien visibles depuis le sentier Tóchar Daithí Bán. Plus loin, le parc
      partage pluvier doré et loutre avec [The Flow Country](/lugar/the-flow-country/) en milieu tourbeux,
      ainsi que saumon atlantique et loutre avec le [Parc naturel de la vallée de la
      Salaca](/lugar/salacas-ielejas-dabas-parks/).
  de:
    intro: >-
      In Wild Nephin liegt der abgelegenste Punkt des irischen Festlands. Dies ist kein bloßes Kuriosum: Es
      beschreibt das Wesen dieses Nationalparks im Nordwesten des Countys Mayo – rund 15 000 Hektar
      unbesiedelte Wildnis, dominiert von der Nephin-Beg-Kette, mit dem Owenduff-Moor im Westen, einem der
      letzten intakten Deckenmoorsysteme Westeuropas.


      Gegründet 1998 als Ballycroy-Nationalpark, kamen 2017 rund 4 000 Hektar Nadelholzforste und Hochlagen zu
      den ursprünglichen 11 000 Hektar hinzu, woraufhin das Gebiet in Wild Nephin umbenannt wurde, um den Weg
      zu echter Wildnis einzuschlagen.
    landscape: >-
      Das Owenduff-Moor umfasst rund 150 Quadratkilometer und zählt zu den größten Moorgebieten Europas. Sein
      Hauptfluss, der Owenduff, ist das einzige Fließgewässer Westeuropas, das noch ein ausgedehntes, intaktes
      Deckenmooreinzugsgebiet entwässert. Rundherum schützt der Park alpine Zwergstrauchheiden, Bergweiden,
      Moorseen und Bachläufe. Zu den botanischen Kostbarkeiten gehören das Moos Hamatocaulis vernicosus und
      die Efeublättrige Moorglöckchen-Glockenblume, die in Irland nur im County Mayo vorkommt. Der
      Moor-Steinbrech tupft von Juli bis September gelbe Punkte ins Moor.


      Die 2017 hinzugekommenen Flächen waren industrielle Forste aus Küsten-Kiefern und Sitka-Fichten. Heute
      werden sie schrittweise renaturiert. Am Ufer von Claggan tritt die Erdgeschichte zutage: Jahrtausende
      alte Kiefernstubben wittern aus der Moor- und Küstenlinie heraus – Zeugen uralter Wälder.
    wildlife: >-
      Das Owenduff-Moor ist ein bedeutender Rast-, Äsungs- und Überwinterungsplatz der Grönländischen
      Blässgans. Zur Leitfauna zählen [Goldregenpfeifer](/especie/pluvialis_apricaria/), Schottisches
      Moorschneehuhn und [Eurasischer Fischotter](/especie/lutra_lutra/). Zu den seltenen Vögeln gehören
      [Singschwan](/especie/cygnus_cygnus/) und [Wanderfalke](/especie/falco_peregrinus/). Der Owenduff ist
      zudem ein hochrangiges Laichgewässer für den [Atlantischen Lachs](/especie/salmo_salar/) und die
      Meerforelle.


      Am Claggan-Pfad rufen Limikolen wie [Großer Brachvogel](/especie/numenius_arquata/) und
      Sandregenpfeifer; Robben und Fischotter lassen sich im Gezeitenbereich beobachten. Entlang des Vary's
      Loop begleiten Gebirgsstelze und [Wasseramsel](/especie/cinclus_cinclus/) die Wandernden. Von den 35
      irischen Tagfalterarten leben 20 im Park, und Ranger erfassen Hummeln von März bis Oktober am
      Daithí-Bán-Weg. Da natürliche Räuber fehlen, übt der wachsende Bestand an
      [Rothirschen](/especie/cervus_elaphus/) starken Verbissdruck auf Gehölze und Moor aus, weshalb die
      Population reguliert werden muss.


      Der Sternenhimmel bestimmt einen eigenen Kalender. In klaren Nächten funkeln Tausende Sterne, Planeten,
      die Milchstraße und Sternschnuppen mit bloßem Auge. Ausgewiesene Beobachtungsplätze sind ganzjährig
      zugänglich.
    visit: >-
      Während das Kerngebiet erfahrenen Bergwanderern vorbehalten ist, gibt es gut ausgebaute Spazierwege. Das
      Besucherzentrum Ballycroy mit interaktiver Ausstellung zu Biodiversität und Regionalgeschichte bildet
      das Eingangstor. Hier beginnt der barrierefreie Holzbohlenweg Tóchar Daithí Bán (zwanzig bis dreißig
      Minuten) mit weitem Panoramablick auf Achill Island, Nephin Beg und den Atlantik. Er ist nach dem
      mythologischen Riesen Daithí Bán benannt, der der Sage nach auf dem Slieve Carr (721 Meter) herrschte.


      Im Süden verläuft der 2 km lange Claggan Mountain Coastal Trail über atlantisches Moor mit Blicken auf
      die Bellacragher Bay. Im Osten starten an der Schutzhütte Brogan Carroll Bothy in Letterkeen Rundwege
      über 2,5, 5, 10 und 12 km. Der Vary's Loop folgt dem Altacooney-Fluss auf 2,5 km. Der Bothy Loop
      verläuft auf historischen Viehtriften. Der einsame Bangor Trail quer durch Nephin Beg ist eine fordernde
      historische Route, die nur für konditionsstarke Wandernde geeignet ist.
    history: >-
      Am Ringfort Lios na Gaoithe schützten Erdwälle Mensch und Vieh vor Raubtieren, darunter Wölfe, die hier
      bis ins achtzehnte Jahrhundert streiften. Einer Sage nach versank der Riese Daithí in einem Moorsee bei
      Bellacorick. Ein Renaturierungsprojekt erprobt heute die Wiederbegründung von Bergmischwäldern mit bis
      zu 2 000 Waldkiefern-Setzlingen. Gäste können sich am Bestäuber-Monitoring beteiligen, indem sie Blüten
      zehn Minuten lang beobachten.
    before: >-
      Wer anspruchsvolle Bergtouren unternimmt oder wild zeltet, muss sich vorab registrieren. Zelten ist
      ausschließlich auf ausgewiesenen Plätzen nach Online-Anmeldung gestattet. Offenes Feuer nur in
      vorgesehenen Feuerstellen. Feste Bergschuhe und Regenschutz sind unerlässlich.
    around: >-
      Rund zehn Kilometer entfernt liegen [Achill Island und die Klippen von
      Croaghaun](/lugar/achill-island/), die man vom Pfad Tóchar Daithí Bán erblickt. Weiter entfernt teilt
      der Park mit [The Flow Country](/lugar/the-flow-country/) Goldregenpfeifer und Fischotter im Moorland
      sowie mit dem [Naturpark Salaca-Tal](/lugar/salacas-ielejas-dabas-parks/) Atlantischen Lachs und
      Fischotter.
  it:
    intro: >-
      Nel cuore di Wild Nephin si trova il punto geografico più remoto dell’Irlanda continentale. Lungi
      dall’essere una semplice curiosità, questo dato riassume l’anima di questo parco del nord-ovest della
      contea di Mayo: circa 15 000 ettari di natura disabitata dominata dai monti Nephin Beg, che racchiudono
      a ovest la torbiera di Owenduff, uno degli ultimi ecosistemi di torbiera di copertura attiva e integra
      d’Europa.


      Istituito nel 1998 come Parco Nazionale di Ballycroy, nel 2017 ha accorpato 4 000 ettari di piantagioni
      di conifere e altipiani agli 11 000 ettari originari, assumendo il nome di Wild Nephin per sancire una
      svolta verso la rinaturazione.
    landscape: >-
      La torbiera di Owenduff copre circa 150 chilometri quadrati, attestandosi tra le distese torbose più
      estese d’Europa. Il suo asse idrografico, l’Owenduff, è l’unico fiume dell’Europa occidentale a drenare
      un bacino di torbiera di copertura ancora intatto. Attorno ad esso il parco tutela brughiere alpine,
      pascoli montani, torbiere, laghi e corsi d’acqua. Tra le rarità botaniche compaiono il muschio
      Hamatocaulis vernicosus e la campanula a foglie d’edera, circoscritta in Irlanda alla sola contea di
      Mayo. La sassifraga palustre accende la torba di riflessi gialli e rossi da luglio a settembre.


      I terreni annessi nel 2017 erano fitte piantagioni forestali di abete di Sitka e pino contorto solcate
      da piste d’esbosco, oggi riconvertite verso assetti naturali. Lungo la battigia di Claggan il passato
      riaffiora spontaneamente: ceppi fossili di pini preistorici emergono dalla torba costiera, testimoni di
      remote foreste scomparse.
    wildlife: >-
      La piana di Owenduff è sito di sosta, pascolo e svernamento per l’oca lombardella della Groenlandia. La
      fauna annovera inoltre il [piviere dorato](/especie/pluvialis_apricaria/), la pernice bianca di Scozia e
      la [lontra europea](/especie/lutra_lutra/). Altri volatili rari comprendono il [cigno
      selvatico](/especie/cygnus_cygnus/) e il [falco pellegrino](/especie/falco_peregrinus/). L’Owenduff è un
      santuario per la risalita del [salmone atlantico](/especie/salmo_salar/) e della trota di mare.


      Lungo il cammino di Claggan riecheggiano limicoli come il [chiurlo maggiore](/especie/numenius_arquata/)
      e il corriere grosso, ed è possibile avvistare lontre e foche. Sul Vary's Loop compaiono ballerina
      gialla e [merlo acquaiolo](/especie/cinclus_cinclus/). Delle 35 specie di farfalle irlandesi, 20 sono
      stanziali nel parco, mentre i ranger monitorano i bombi da marzo a ottobre lungo il sentiero Daithí Bán.
      Privo di predatori naturali, il [cervo nobile](/especie/cervus_elaphus/) esercita una forte pressione su
      boschi e brughiere, richiedendo una gestione faunistica costante.


      Il cielo notturno offre scenari primordiali. Nelle notti terse si scorgono a occhio nudo migliaia di
      stelle, pianeti, la Via Lattea e sciami meteorici. Le piazzole d’osservazione sono aperte tutto l’anno.
    visit: >-
      Mentre il cuore del parco richiede solide doti escursionistiche, vi sono passeggiate alla portata di
      tutti. Il centro visite di Ballycroy, con percorso interattivo su biodiversità e cultura locale, è la
      porta d’accesso principale. Da qui si dipana il sentiero Tóchar Daithí Bán, un anello su passerella in
      legno di venti-trenta minuti con scorci sull’isola di Achill, sul Nephin Beg e sull’Atlantico. Il nome
      rievoca il gigante mitologico Daithí Bán, che secondo la tradizione eresse la sua fortezza sulla vetta
      del Corslieve (Slieve Carr), a 721 metri.


      A sud, il Claggan Mountain Coastal Trail (2 km) si affaccia sulla baia di Bellacragher. A est, dal
      rifugio Brogan Carroll Bothy a Letterkeen, partono circuiti segnalati di 2,5, 5, 10 e 12 km. Il Vary's
      Loop costeggia il fiume Altacooney per 2,5 km. Il Bothy Loop segue antichi tratturi pastorali. Il Bangor
      Trail, storico tracciato attraverso il Nephin Beg risalente al Cinquecento, è riservato a trekker
      esperti.
    history: >-
      Nel forte circolare di Lios na Gaoithe, terrapieni difensivi proteggevano famiglie e armenti dagli
      assalti dei lupi che popolarono queste terre fino al Settecento. La tradizione narra che il gigante
      Daithí affondò in uno specchio torboso a Bellacorick. Un progetto pilota reintroduce boschi autoctoni
      impiantando fino a 2 000 giovani pini silvestri. Chiunque può contribuire al censimento degli insetti
      impollinatori osservando un gruppo di fiori per dieci minuti.
    before: >-
      Chi intraprende percorsi avanzati o bivacchi deve registrarsi preventivamente. Il campeggio libero è
      autorizzato solo nelle aree designate previa registrazione online. Fuochi accesi consentiti unicamente
      nei bracieri predisposti. Indossa scarponi impermeabili e giacca a vento.
    around: >-
      A circa dieci chilometri si trovano [l’Isola di Achill e le scogliere di
      Croaghaun](/lugar/achill-island/), visibili dal sentiero Tóchar Daithí Bán. Più distante, il parco
      condivide piviere dorato e lontra con [The Flow Country](/lugar/the-flow-country/) in paesaggi torbosi,
      e salmone atlantico e lontra con il [Parco Naturale della Valle del
      Salaca](/lugar/salacas-ielejas-dabas-parks/).
  pt:
    intro: >-
      No coração de Wild Nephin situa-se o ponto terrestre mais remoto de toda a Irlanda continental. Não se
      trata de uma simples curiosidade: resume a essência deste parque no noroeste do condado de Mayo, cerca
      de 15 000 hectares de natureza despovoada dominada pela cordilheira de Nephin Beg, que acolhe a oeste a
      turfeira de Owenduff, um dos derradeiros sistemas de turfeira de cobertura ativa e intacta da Europa
      Ocidental.


      Criado em 1998 como Parque Nacional de Ballycroy, integrou em 2017 cerca de 4 000 hectares de plantações
      de coníferas e relevos montanhosos aos 11 000 hectares originais, sendo rebatizado como Wild Nephin com
      o compromisso de devolver estas terras ao seu estado selvagem.
    landscape: >-
      A turfeira de Owenduff abrange cerca de 150 quilómetros quadrados, cotando-se entre as maiores extensões
      de turfeira da Europa. O seu rio principal, o Owenduff, é o único curso de água da Europa Ocidental que
      ainda drena uma bacia de turfeira de cobertura contínua e virgem. Ao redor, o parque resguarda charnecas
      alpinas, pastagens de montanha, turfeiras, lagoas glaciares e rios límpidos. A flora rara inclui o musgo
      Hamatocaulis vernicosus e a campainha-de-folhas-de-hera, exclusiva no território irlandês ao condado de
      Mayo. A saxífraga-dos-pauis salpica a turfa de tons amarelos de julho a setembro.


      As parcelas incorporadas em 2017 correspondiam a explorações industriais de pinheiro-bravo-americano e
      espruce-de-sitka entrecortadas por acessos florestais. Hoje decorre o seu restauro ecológico. Na margem
      costeira de Claggan, o passado ressurge à vista desarmada: cepos milenares de pinheiros emergem da turfa
      e do areal batido pela maré, testemunhos de remotas florestas primitivas.
    wildlife: >-
      O território de Owenduff funciona como área de repouso, alimentação e invernada para o
      ganso-de-bico-curto da Gronelândia. A fauna emblemática inclui a
      [tarambola-dourada-europeia](/especie/pluvialis_apricaria/), o tetraz-escocês e a
      [lontra-europeia](/especie/lutra_lutra/). Outras aves raras são o [cisne-bravo](/especie/cygnus_cygnus/)
      e o [falcão-peregrino](/especie/falco_peregrinus/). O rio Owenduff é uma artéria de reprodução vital
      para o [salmão atlântico](/especie/salmo_salar/) e a truta-marisca.


      No percurso costeiro de Claggan escutam-se limícolas como o [maçarico-real](/especie/numenius_arquata/)
      e o borrelho-grande-de-coleira, avistando-se lontras e focas. Ao longo do Vary's Loop surgem a
      alvéola-cinzenta e o [melro-d'água](/especie/cinclus_cinclus/). Das 35 espécies de borboletas da
      Irlanda, 20 ocorrem no parque, realizando os vigilantes censos de abelhões entre março e outubro no
      trilho Daithí Bán. Na ausência de predadores naturais, o acréscimo de
      [veados-vermelhos](/especie/cervus_elaphus/) fustiga a vegetação, exigindo controlo populacional
      contínuo.


      A abóbada celeste proporciona outro espetáculo singular. Em noites limpas avistam-se à vista desarmada
      milhares de estrelas, planetas, a Via Láctea e chuvas de meteoros. Os postos de observação astronómica
      estão abertos todo o ano.
    visit: >-
      Embora o interior agreste se destine a montanhistas experientes, existem trilhos suaves acessíveis a
      todos. O centro de visitantes de Ballycroy, com exposição interativa sobre a biodiversidade e o
      património cultural da região, é a porta de entrada. De lá parte o trilho Tóchar Daithí Bán, um circuito
      sobre passadiço de vinte a trinta minutos com vistas rasgadas para a ilha de Achill, Nephin Beg e o
      Atlântico. O nome evoca o gigante mítico Daithí Bán, que segundo a tradição ergueu a sua praça-forte no
      monte Corslieve (Slieve Carr), a 721 metros.


      A sul, o Claggan Mountain Coastal Trail (2 km) percorre turfeira atlântica e enseadas abrigadas com
      vista para a baía de Bellacragher. A leste, junto ao abrigo Brogan Carroll Bothy em Letterkeen, partem
      rotas sinalizadas de 2,5, 5, 10 e 12 km. O Vary's Loop acompanha o rio Altacooney ao longo de 2,5 km. O
      Bothy Loop segue antigas veredas pastoris. Já o histórico Bangor Trail é uma travessia exigente pelas
      cristas de Nephin Beg com origens no século XVI, destinada apenas a caminhantes tarimbados.
    history: >-
      No forte circular de Lios na Gaoithe, parapeitos de terra protegiam outrora colonos e rebanhos dos lobos
      que vaguearam pela região até ao século XVIII. Reza a lenda que o gigante Daithí se afundou numa lagoa
      de turfa em Bellacorick que ainda hoje conserva o seu nome. Atualmente, um projeto florestal ensaia a
      regeneração de arvoredo autóctone com a plantação de até 2 000 rebentos de pinheiro-silvestre. Os
      visitantes podem colaborar na monitorização de polinizadores registando insetos durante dez minutos de
      observação floral.
    before: >-
      Quem realizar travessias exigentes ou pernoitar em acampamento selvagem deve registar-se previamente. O
      acampamento só é permitido em locais designados mediante inscrição online. Fogueiras autorizadas apenas
      nos fogareiros fixos desses espaços. Leva botas de montanha impermeáveis e agasalhos para a chuva.
    around: >-
      A cerca de dez quilómetros localizam-se a [Ilha de Achill e as arribas de
      Croaghaun](/lugar/achill-island/), visíveis a partir do trilho Tóchar Daithí Bán. Mais longe, o parque
      partilha a tarambola-dourada-europeia e a lontra com [The Flow Country](/lugar/the-flow-country/) em
      habitats de turfeira, e o salmão atlântico e a lontra com o [Parque Natural do Vale do
      Salaca](/lugar/salacas-ielejas-dabas-parks/).
