resumen:
  es: 'El extremo sur de Istria: una península sin edificar de calas, matorral y orquídeas silvestres.'
  en: 'The southern tip of Istria: an undeveloped peninsula of coves, scrubland, and wild orchids.'
  fr: 'La pointe sud de l''Istrie : une péninsule préservée de criques, de garrigue et d''orchidées sauvages.'
  de: 'Die Südspitze Istriens: Eine unverbautes Halbinsel voller Buchten, Macchia und wilder Orchideen.'
  it: >-
    L'estrema punta meridionale dell'Istria: una penisola incontaminata tra calette, macchia e orchidee
    selvatiche.
  pt: 'O extremo sul da Ístria: uma península preservada de enseadas, matos costeiros e orquídeas bravas.'
unico:
  es: >-
    En una sola península se camina sobre huellas de dinosaurio, entre orquídeas que no existen más al norte y
    junto a un mar con delfines y praderas de posidonia.
  en: >-
    On a single peninsula you can walk on dinosaur footprints, wander among orchids found nowhere further
    north, and look out over seas frequented by dolphins and Posidonia meadows.
  fr: >-
    Sur une seule péninsule, vous marchez sur des empreintes de dinosaures, au milieu d'orchidées absentes
    plus au nord et face à une mer peuplée de dauphins et d'herbiers de posidonies.
  de: >-
    Auf einer einzigen Halbinsel spazierst du über Dinosaurierspuren, durchstreifst Orchideenwiesen, die es
    weiter nördlich nicht gibt, und blickst auf ein Meer mit Delfinen und Seegraswiesen.
  it: >-
    In un'unica penisola puoi camminare sulle orme dei dinosauri, tra orchidee che non crescono più a nord e
    davanti a un mare popolato da delfini e praterie di posidonia.
  pt: >-
    Numa única península caminhas sobre pegadas de dinossauro, entre orquídeas ausentes mais a norte e junto a
    um mar habitado por golfinhos e pradarias de posidónia.
observaciones:
  es: >-
    Hay que circular solo por caminos marcados, también las motos, y no aparcar sobre zonas verdes. Está
    prohibido acampar, salvo visitas organizadas con permiso del gestor, y los perros deben ir con correa.
    Arrancar o coleccionar especies estrictamente protegidas o sus huevos, larvas o semillas está prohibido:
    el gestor propone fotografiarlas. Hay que abandonar el área protegida antes de las 22 h.


    Las corrientes cerca del cabo son muy fuertes, sobre todo entre el cabo Kršine y el islote Fenoliga: no te
    alejes más de 100 metros de la orilla. Si ves delfines, acércate despacio y en paralelo, y no debe haber
    más de una embarcación a 100 m ni más de tres a 200 m. No eches el ancla sobre las praderas de posidonia.
    Y si vas a pie, mira dónde pisas: la víbora y la viuda negra no son necesariamente mortales, pero mejor no
    molestarlas.
texto:
  es:
    intro: >-
      Hace casi 100 millones de años pasaron dinosaurios por aquí, y todavía puedes seguir sus pisadas. Donji
      Kamenjak y el archipiélago de Medulin son el extremo sur de Istria, a unos 10 km de Pula: una península
      de roca blanca, pastizales y costa. Aquí se mezclan huellas fósiles, más de 600 especies de plantas,
      orquídeas que solo crecen en el sur de Istria y un mar donde pasan los delfines.
    landscape: >-
      La caliza blanca y gris del cabo es del Cenomaniense, del Cretácico tardío, de hace entre 98 y 93
      millones de años, cuando la zona estaba cubierta por el océano Tetis. En sus costas abundan los fósiles.
      En esa piedra quedaron las huellas de dinosaurio de la isla Fenoliga y del cabo Grakalovac, de gran
      importancia paleontológica: en Fenoliga hay unas 150. El yacimiento tiene huellas de carnívoros y de
      herbívoros, la mayoría ordenadas en rastros; el más largo mide 19,5 m y reúne 39 pisadas de un
      saurópodo.


      Encima de la roca, el paisaje es un mosaico de bosque, pastizal, jarales, maquia y roquedo. Antes todo
      eran encinares que el ser humano degradó durante siglos con la tala y el pastoreo, hasta que aparecieron
      los pastizales llenos de plantas. Esos hábitats abiertos están protegidos por la Directiva Hábitats de
      la UE, y mantenerlos abiertos es una prioridad: al abandonarse el pastoreo, los pastizales se cubren de
      pino carrasco y desaparecen las especies que dependen de ellos.


      El clima ayuda a que sea así. El gestor señala un clima mediterráneo seco: unos 210 mm de lluvia al año,
      frente a 872 mm en la vecina Pula o Medulin.
    wildlife: >-
      La primavera y el otoño son los meses que el gestor recomienda sobre todo, y para vivirlo entero, el
      final de la primavera y el comienzo del otoño.


      En primavera florecen los pastizales. Hay unas 30 especies de orquídeas, y dos solo crecen en el sur de
      Istria, entre ellas Serapias istriaca. Entre las plantas amenazadas está Ophioglossum lusitanicum: se
      citó por primera vez en Croacia a mediados del siglo XIX, pasó más de cien años sin aparecer, se volvió
      a ver en 1974 cerca de la bahía de Pomer y desde 1994 figura en el libro rojo de la flora de Croacia
      como especie en peligro crítico. Anthemis tomentosa y Cicendia filiformis completan la lista de rarezas.


      Por el aire, más de cincuenta especies de mariposas diurnas; la vanesa de los cardos y la vanesa
      atalanta llegan cada año desde África. El clima seco favorece a los reptiles: el lución europeo, el
      lagarto verde, y una lagartija italiana abundante todo el año. Entre las serpientes grandes están la
      [culebra de Esculapio](/especie/elaphe_longissima/) y la [culebra de cuatro
      rayas](/especie/elaphe_quatuorlineata/), ambas de más de dos metros, y también vive la [víbora de nariz
      chata](/especie/vipera_ammodytes/), una de las dos especies venenosas de la península, junto a la viuda
      negra. El [chacal dorado](/especie/canis_aureus/), el [jabalí](/especie/sus_scrofa/), el zorro, el
      [corzo](/especie/capreolus_capreolus/), el tejón y la [ardilla](/especie/sciurus_vulgaris/) completan
      los mamíferos.


      Bajo el agua, el delfín mular usa el mar del oeste de Istria sobre todo para alimentarse, y hay muchas
      madres con crías. En el fondo del cabo se han hallado solo tres nacras vivas, una especie diezmada por
      una mortandad masiva en el Mediterráneo, y las praderas de [posidonia](/especie/posidonia_oceanica/),
      una planta marina protegida, son casi imposibles de recuperar una vez destruidas. Para los hongos, otro
      motivo para visitar en primavera y en otoño: en Donji y Gornji Kamenjak se han registrado 97 especies de
      hongos con fructificación visible, 16 de ellas nuevas para Croacia.
    visit: >-
      Desde Premantura se llega en coche, en bici o en barco; el acceso a pie y en bicicleta es gratuito,
      mientras que en verano los vehículos a motor pagan entrada. La bicicleta es la manera que recomienda el
      gestor, porque hay un carril bici fuera de los caminos de los coches: el carril Orhideja recorre toda la
      costa en 12 km y es de dificultad media.


      Caminando, el sendero de los dinosaurios lleva en el cabo de Grakalovac a uno de los pocos yacimientos
      de huellas fósiles de dinosaurio, de 98 millones de años, y un sendero educativo explica los valores
      naturales del cabo. Desde la cala Školjić se puede alquilar un kayak para recorrer las islas del
      archipiélago de Medulin.


      El gestor organiza visitas guiadas todo el año para visitantes extranjeros, en inglés o alemán, con
      temas como el mundo marino, los dinosaurios, el bosque y los pastizales con orquídeas, y ofrece
      voluntariado, como la patrulla verde Zelena patrola.
    history: >-
      El gestor fomenta la ganadería de razas autóctonas y pastorea el territorio con oveja y vaca istrianas,
      porque la agricultura tradicional ayuda a conservar la biodiversidad. Cerca de la cala Polje una granja
      mantiene el buey istriano autóctono.


      El mar también está bajo cuidado: el mar del oeste de Istria, que abarca todo el mar del municipio de
      Medulin, es el mayor espacio Natura 2000 de Istria y el gestor del cabo se ocupa de sus lugares marinos.
    before: >-
      Hay que circular solo por caminos marcados, también las motos, y no aparcar sobre zonas verdes. Está
      prohibido acampar, salvo visitas organizadas con permiso del gestor, y los perros deben ir con correa.
      Arrancar o coleccionar especies estrictamente protegidas o sus huevos, larvas o semillas está prohibido:
      el gestor propone fotografiarlas. Hay que abandonar el área protegida antes de las 22 h.


      Las corrientes cerca del cabo son muy fuertes, sobre todo entre el cabo Kršine y el islote Fenoliga: no
      te alejes más de 100 metros de la orilla. Si ves delfines, acércate despacio y en paralelo, y no debe
      haber más de una embarcación a 100 m ni más de tres a 200 m. No eches el ancla sobre las praderas de
      posidonia. Y si vas a pie, mira dónde pisas: la víbora y la viuda negra no son necesariamente mortales,
      pero mejor no molestarlas.
    around: >-
      No hay lugares del atlas cercanos, pero sí otros espacios costeros con las mismas praderas de posidonia
      y el delfín mular: el [Parque Nacional de Port-Cros](/lugar/parc-national-de-port-cros/), el [Parque
      Nacional del Archipiélago Toscano](/lugar/parco-nazionale-arcipelago-toscano/), el [Parque Natural del
      Archipiélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/) y la [Meseta Kárstica y Acantilados de
      La Mola](/lugar/la-mola-formentera/).
  en:
    intro: >-
      Nearly 100 million years ago, dinosaurs roamed through here, and you can still trace their footprints.
      Donji Kamenjak and the Medulin archipelago form the southern extremity of Istria, about 10 km from Pula:
      an undeveloped peninsula of white rock, coastal grasslands, and rocky shorelines. Here fossil trackways
      blend with more than 600 plant species, wild orchids that grow nowhere else north of Istria, and open
      sea frequented by dolphins.
    landscape: >-
      The white and grey limestone of the cape dates from the Cenomanian stage of the Late Cretaceous, some 98
      to 93 million years ago, when the area lay submerged beneath the Tethys Ocean. Fossils are plentiful
      along its shores. Preserved in this stone are dinosaur tracks on the islet of Fenoliga and at Cape
      Grakalovac, holding immense palaeontological value: on Fenoliga alone around 150 prints have been
      recorded. The site contains tracks of both carnivores and herbivores, mostly aligned in trackways; the
      longest extends 19.5 m and comprises 39 footprints of a sauropod.


      Above the rock shelf, the landscape forms a mosaic of open pine forest, dry grassland, rockrose scrub,
      garrigue, and bare crags. It was once entirely holm oak woodland, degraded over centuries by human
      cutting and heavy grazing until rich grasslands developed. These open habitats are protected under the
      EU Habitats Directive, and keeping them open is a management priority: as grazing has waned, Aleppo pine
      encroaches, threatening the specialist species that depend on open grassland.


      The climate sustains these conditions. The reserve manager describes a dry Mediterranean climate: about
      210 mm of rain annually, compared to 872 mm in neighbouring Pula or Medulin.
    wildlife: >-
      Spring and autumn are the periods most strongly recommended by the reserve managers, particularly late
      spring and early autumn for the fullest experience.


      In spring, the dry meadows erupt into bloom. Around 30 species of orchids occur, and two are found
      exclusively in southern Istria, including Serapias istriaca. Among the threatened flora is Ophioglossum
      lusitanicum: first recorded in Croatia in the mid-nineteenth century, it went undetected for over a
      century before being rediscovered in 1974 near Pomer Bay, and since 1994 has been listed as critically
      endangered in the red book of Croatian flora. Anthemis tomentosa and Cicendia filiformis complete the
      register of rarities.


      In the air, more than fifty species of butterflies take flight; painted ladies and red admirals arrive
      every year on migration from Africa. The arid climate favours reptiles: the slow worm, the European
      green lizard, and Italian wall lizards common all year round. Among large serpents are the [Aesculapian
      snake](/especie/elaphe_longissima/) and the [four-lined snake](/especie/elaphe_quatuorlineata/), both
      growing over two metres in length, while the venomous [nose-horned viper](/especie/vipera_ammodytes/)
      also dwells here, representing one of the peninsula's two venomous creatures alongside the black widow
      spider. The [golden jackal](/especie/canis_aureus/), [wild boar](/especie/sus_scrofa/), red fox, [roe
      deer](/especie/capreolus_capreolus/), European badger, and [red squirrel](/especie/sciurus_vulgaris/)
      complete the mammalian fauna.


      Beneath the surface, the common bottlenose dolphin uses the waters off western Istria primarily for
      feeding, with numerous mothers and calves sighted. On the seabed around the cape, only three living
      noble pen shells have been found, a species decimated by Mediterranean-wide mortality, while beds of
      [Neptune grass](/especie/posidonia_oceanica/), a protected marine plant, are virtually impossible to
      restore once destroyed. For mycologists, another reason to visit in spring and autumn: in Donji and
      Gornji Kamenjak, 97 macrofungal species have been documented, 16 of which were newly recorded for
      Croatia.
    visit: >-
      From Premantura you can reach the reserve by car, bicycle, or boat; pedestrian and cyclist access is
      free, whereas motor vehicles pay an entrance fee in summer. Cycling is the method recommended by the
      park authority, as a dedicated bike path keeps away from vehicular tracks: the Orhideja cycle trail
      traces the entire coastline over 12 km and is of moderate difficulty.


      On foot, the dinosaur trail leads out to Cape Grakalovac to one of the few exposed dinosaur footprint
      sites, dating back 98 million years, while an educational path interprets the natural heritage of the
      headland. From Školjić cove you can hire a kayak to paddle among the islets of the Medulin archipelago.


      The park authority organizes guided tours year-round for international visitors, in English or German,
      focusing on marine life, dinosaurs, Mediterranean woodland, and orchid-strewn grasslands, and runs
      volunteer schemes such as the Zelena patrola eco-patrol.
    history: >-
      The park management promotes the farming of indigenous livestock, grazing the landscape with Istrian
      sheep and cattle, as traditional pastoralism directly maintains biodiversity. Near Polje cove, a
      farmstead preserves the native Istrian boškarin cattle.


      The surrounding sea receives equal protection: the western Istrian marine area, encompassing the entire
      maritime zone of Medulin municipality, forms the largest Natura 2000 marine site in Istria, overseen
      directly by the cape management authority.
    before: >-
      You must keep strictly to designated tracks, motorcycles included, and never park on vegetated ground.
      Camping is prohibited, except for organized groups with written permits, and dogs must be kept on a
      leash at all times. Picking or collecting strictly protected species, their eggs, larvae, or seeds is
      forbidden: the authority urges you to take photographs instead. You must exit the protected area before
      22 h.


      Sea currents around the cape run exceptionally strong, particularly between Cape Kršine and Fenoliga
      islet: never venture more than 100 metres from the shoreline. If you encounter dolphins, approach slowly
      and parallel to their course; no more than one boat should be within 100 m, and no more than three
      within 200 m. Never drop anchor on posidonia seagrass meadows. And on foot, watch where you step: the
      nose-horned viper and the black widow spider are rarely fatal, but are best left undisturbed.
    around: >-
      There are no immediate atlas places adjacent, but other coastal areas share similar posidonia meadows
      and bottlenose dolphins: [Port-Cros National Park](/lugar/parc-national-de-port-cros/), [National Park
      of the Tuscan Archipelago](/lugar/parco-nazionale-arcipelago-toscano/), [Lastovo Archipelago Nature
      Park](/lugar/park-prirode-lastovsko-otocje/), and [La Mola Karstic Plateau and
      Cliffs](/lugar/la-mola-formentera/).
  fr:
    intro: >-
      Il y a près de 100 millions d'années, des dinosaures foulaient cette terre, et vous pouvez encore suivre
      leurs pas. Donji Kamenjak et l'archipel de Medulin forment l'extrémité sud de l'Istrie, à environ 10 km
      de Pula : une presqu'île de calcaire blanc, de pelouses rases et de rivages rocheux. S'y mêlent des
      empreintes fossilisées, plus de 600 espèces végétales, des orchidées qui ne poussent nulle part plus au
      nord et une mer où croisent les dauphins.
    landscape: >-
      Le calcaire blanc et gris du cap remonte au Cénomanien, au Crétacé supérieur, il y a 98 à 93 millions
      d'années, quand la région était immergée sous l'océan Téthys. Les fossiles abondent sur ses côtes. C'est
      dans cette roche que se sont imprimées les traces de dinosaures de l'îlot Fenoliga et du cap Grakalovac,
      d'un intérêt paléontologique exceptionnel : Fenoliga en compte environ 150. Le gisement rassemble des
      empreintes de carnivores et d'herbivores, pour la plupart alignées en pistes ; la plus longue s'étire
      sur 19,5 m et réunit 39 empreintes d'un sauropode.


      Au-dessus du socle rocheux, le paysage compose une mosaïque de boisements, de pâturages secs, de
      cistaies, de maquis et d'éboulis. Jadis, des chênaies vertes couvraient tout l'espace, dégradées au fil
      des siècles par les coupes et le surpâturage jusqu'à faire naître des pelouses d'une grande diversité
      floristique. Ces milieux ouverts sont protégés par la directive Habitats de l'UE, et leur maintien
      constitue une priorité : avec l'abandon du pastoralisme, le pin d'Alep colonise les clairières et évince
      les espèces spécialisées.


      Le climat accentue cette physionomie. Les gestionnaires décrivent un climat méditerranéen aride :
      environ 210 mm de précipitations par an, contre 872 mm à Pula ou Medulin toutes proches.
    wildlife: >-
      Le printemps et l'automne sont les deux saisons recommandées par les gestionnaires, tout
      particulièrement la fin du printemps et le début de l'automne pour une découverte optimale.


      Au printemps, les pelouses s'illuminent de fleurs. On y recense environ 30 espèces d'orchidées, dont
      deux sont strictement limitées au sud de l'Istrie, parmi lesquelles Serapias istriaca. Parmi les espèces
      vulnérables figure Ophioglossum lusitanicum : signalée pour la première fois en Croatie au milieu du
      XIXe siècle, elle disparut des inventaires durant plus d'un siècle avant d'être retrouvée en 1974 près
      de la baie de Pomer, puis classée en danger critique dès 1994 dans le livre rouge de la flore croate.
      Anthemis tomentosa et Cicendia filiformis complètent cet inventaire remarquable.


      Dans les airs virevoltent plus de cinquante espèces de papillons diurnes ; la belle-dame et le vulcain
      arrivent chaque année d'Afrique en migration. L'aridité profite aux reptiles : l'orvet fragile, le
      lézard vert et le lézard des ruines omniprésent. Parmi les grands serpents vivent la [couleuvre
      d'Esculape](/especie/elaphe_longissima/) et la [couleuvre à quatre
      raies](/especie/elaphe_quatuorlineata/), qui dépassent toutes deux deux mètres de longueur, tandis que
      la [vipère ammodyte](/especie/vipera_ammodytes/) représente l'un des deux organismes venimeux du cap aux
      côtés de la veuve noire. Le [chacal doré](/especie/canis_aureus/), le [sanglier](/especie/sus_scrofa/),
      le renard roux, le [chevreuil](/especie/capreolus_capreolus/), le blaireau et l'[écureuil
      roux](/especie/sciurus_vulgaris/) forment le cortège des mammifères.


      Sous l'eau, le grand dauphin fréquente assidûment les eaux d'Istrie occidentale pour s'alimenter,
      souvent avec des mères et leurs petits. Sur les fonds marins du cap, seules trois grandes nacres
      vivantes ont pu être localisées, espèce décimée par une épidémie méditerranéenne, tandis que les
      herbiers de [posidonie](/especie/posidonia_oceanica/), plante marine protégée, sont quasi impossibles à
      régénérer une fois dégradés. Côté champignons, autre motif de visite saisonnière : Donji et Gornji
      Kamenjak totalisent 97 espèces de macromycètes, dont 16 s'avèrent nouvelles pour la Croatie.
    visit: >-
      Depuis Premantura, on rejoint le site en voiture, à vélo ou en bateau ; l'accès est libre pour les
      piétons et les cyclistes, tandis que les véhicules motorisés s'acquittent d'un droit d'entrée en période
      estivale. Le vélo reste le mode de visite privilégié par les gardes, car une piste cyclable évite le
      trafic automobile : l'itinéraire Orhideja longe le littoral sur 12 km avec un dénivelé modéré.


      À pied, le sentier des dinosaures vous mène au cap Grakalovac vers un rare gisement d'empreintes
      fossiles datant de 98 millions d'années, tandis qu'un parcours didactique explicite les richesses
      écologiques du cap. Depuis l'anse Školjić, vous pouvez louer un kayak pour naviguer entre les îlots de
      l'archipel de Medulin.


      L'organisme gestionnaire organise toute l'année des visites guidées en anglais ou en allemand axées sur
      le milieu marin, les dinosaures, la pinède et les prairies à orchidées, et propose des actions de
      bénévolat avec la patrouille verte Zelena patrola.
    history: >-
      La direction soutient l'élevage de races autochtones et entretient le terroir avec des brebis et des
      vaches d'Istrie, l'agriculture traditionnelle constituant un pilier de la biodiversité. Près de la
      crique de Polje, une exploitation élève le bœuf boškarin typique.


      Le milieu marin bénéficie de la même vigilance : les eaux d'Istrie occidentale, englobant tout l'espace
      maritime de la commune de Medulin, forment le plus vaste site marin Natura 2000 d'Istrie, placé sous la
      gestion directe du cap.
    before: >-
      Vous devez circuler uniquement sur les pistes balisées, deux-roues motorisés compris, et ne jamais
      stationner sur la végétation. Le bivouac est interdit en dehors des groupes autorisés, et les chiens
      doivent être tenus en laisse. Cueillir ou prélever des espèces protégées, leurs œufs, larves ou graines
      est proscrit : privilégiez la photographie. Vous devez quitter le parc avant 22 h.


      Les courants marins au large du cap sont redoutables, en particulier entre le cap Kršine et l'îlot
      Fenoliga : ne vous éloignez jamais à plus de 100 mètres du rivage. En présence de dauphins, naviguez
      lentement et parallèlement ; pas plus d'un navire à moins de 100 m et pas plus de trois embarcations à
      200 m. Ne jetez jamais l'ancre dans les herbiers de posidonie. Et sur les sentiers, regardez où vous
      marchez : la vipère ammodyte et la veuve noire sont rarement mortelles, mais il convient de ne pas les
      déranger.
    around: >-
      Aucun site de l'atlas ne se trouve à proximité immédiate, mais d'autres réserves côtières partagent les
      herbiers de posidonie et le grand dauphin : le [Parc national de
      Port-Cros](/lugar/parc-national-de-port-cros/), le [Parc national de l'archipel
      toscan](/lugar/parco-nazionale-arcipelago-toscano/), le [Parc naturel de l'archipel de
      Lastovo](/lugar/park-prirode-lastovsko-otocje/) et le [Plateau karstique et falaises de La
      Mola](/lugar/la-mola-formentera/).
  de:
    intro: >-
      Vor fast 100 Millionen Jahren zogen hier Dinosaurier vorüber, und du kannst ihren Fußspuren noch heute
      folgen. Donji Kamenjak und das Archipel von Medulin bilden die Südspitze Istriens, rund 10 km von Pula
      entfernt: eine Halbinsel aus weißem Kalk, Trockenrasen und Felsenküste. Hier vereinen sich fossile
      Fährten, mehr als 600 Pflanzenarten, wilde Orchideen, die nirgends weiter nördlich in Istrien vorkommen,
      und ein offenes Meer, in dem Delfine kreuzen.
    landscape: >-
      Der weiße und graue Kalkstein des Kaps stammt aus dem Cenomanium der oberen Kreidezeit vor 98 bis 93
      Millionen Jahren, als die Region vom Tethys-Ozean überflutet war. An den Küsten finden sich reichlich
      Fossilien. In diesem Stein blieben die Dinosaurierfährten auf der Insel Fenoliga und am Kap Grakalovac
      erhalten, die von herausragender paläontologischer Bedeutung sind: Auf Fenoliga existieren rund 150
      Abdrücke. Der Fundort birgt Spuren von Fleisch- und Pflanzenfressern, größtenteils in Fährtenzügen
      angeordnet; der längste misst 19,5 m und umfasst 39 Tritte eines Sauropoden.


      Über dem Kalkplateau erstreckt sich eine Landschaft aus lichten Kiefernwäldern, Trockenrasen,
      Zistrosengebüsch, Macchia und Felsfluren. Ursprünglich bedeckten Steineichenwälder das gesamte Kap, die
      über Jahrhunderte durch Rodung und Weidewirtschaft gelichtet wurden, bis artenreiche Trockenrasen
      entstanden. Diese offenen Lebensräume stehen unter dem Schutz der FFH-Richtlinie der EU, und ihr Erhalt
      hat Vorrang: Bei nachlassender Beweidung verbuschen die Flächen mit Aleppo-Kiefern, wodurch
      spezialisierte Arten verdrängt werden.


      Das Lokalklima begünstigt diese Entwicklung. Die Schutzgebietsverwaltung verzeichnet ein trockenes
      Mittelmeerklima mit etwa 210 mm Niederschlag im Jahr, verglichen mit 872 mm im nahen Pula oder Medulin.
    wildlife: >-
      Das Schutzgebietsmanagement empfiehlt vor allem das Frühjahr und den Herbst für einen Besuch,
      insbesondere das späte Frühjahr und den Frühherbst für das intensivste Naturerlebnis.


      Im Frühling blühen die Weiden auf. Rund 30 Orchideenarten kommen vor, und zwei gedeihen ausschließlich
      im Süden Istriens, darunter Serapias istriaca. Zu den bedrohten Pflanzen zählt Ophioglossum lusitanicum:
      Mitte des neunzehnten Jahrhunderts erstmals in Kroatien nachgewiesen, galt sie über ein Jahrhundert lang
      als verschollen, wurde 1974 nahe der Bucht von Pomer wiederentdeckt und ist seit 1994 im Roten Buch der
      Flora Kroatiens als vom Aussterben bedroht eingestuft. Anthemis tomentosa und Cicendia filiformis
      ergänzen die Liste botanischer Raritäten.


      In der Luft flattern über fünfzig Tagfalterarten; Distelfalter und Admiral treffen alljährlich aus
      Afrika ein. Das trockene Klima begünstigt Kriechtiere: Blindschleiche, Smaragdeidechse und die
      ganzjährig präsente Ruineneidechse. Zu den großen Schlangen gehören die
      [Äskulapnatter](/especie/elaphe_longissima/) und die
      [Vierstreifennatter](/especie/elaphe_quatuorlineata/), die beide über zwei Meter lang werden können,
      während die giftige [Europäische Hornotter](/especie/vipera_ammodytes/) neben der Schwarzen Witwe zu den
      wehrhaften Bewohnern zählt. [Goldschakal](/especie/canis_aureus/), [Wildschwein](/especie/sus_scrofa/),
      Rotfuchs, [Reh](/especie/capreolus_capreolus/), Dachs und [Eichhörnchen](/especie/sciurus_vulgaris/)
      vervollständigen die Säugetierfauna.


      Unter Wasser nutzen Große Tümmler das Küstenmeer Westistriens vor allem zur Nahrungssuche, häufig mit
      Jungtieren. Am Meeresgrund des Kaps wurden nur drei lebende Edle Steckmuscheln nachgewiesen, eine durch
      ein Massensterben dezimierte Art, während Bestände von [Neptungras](/especie/posidonia_oceanica/), einer
      geschützten Meerespflanze, nach ihrer Zerstörung kaum wiederherzustellen sind. Für Pilzbegeisterte lohnt
      sich der Besuch zur Übergangszeit: In Donji und Gornji Kamenjak wurden 97 Großpilzarten dokumentiert,
      davon 16 Neufunde für Kroatien.
    visit: >-
      Von Premantura aus erreichst du das Gebiet mit dem Auto, dem Fahrrad oder per Boot; für Fußgänger und
      Radfahrer ist der Eintritt frei, während im Sommer für Kraftfahrzeuge eine Maut erhoben wird. Das
      Fahrrad wird von der Verwaltung empfohlen, da ein eigener Radweg den Autoverkehr meidet: Die
      Orhideja-Radroute verläuft über 12 km entlang der Küste bei mittlerem Anspruch.


      Zu Fuß führt der Dinosaurierpfad am Kap Grakalovac zu einer der seltenen fossilen Fährtenfundstellen aus
      der Zeit vor 98 Millionen Jahren, während ein Naturlehrpfad die Besonderheiten der Halbinsel erläutert.
      In der Bucht Školjić lassen sich Kajaks mieten, um die Inseln des Archipels von Medulin auf dem
      Wasserweg zu erkunden.


      Die Schutzgebietsverwaltung veranstaltet ganzjährig Führungen auf Englisch und Deutsch zu Meeresthemen,
      Dinosauriern, Wäldern und Orchideenwiesen und bietet Freiwilligeneinsätze im Rahmen der grünen
      Patrouille Zelena patrola an.
    history: >-
      Die Verwaltung fördert traditionelle Haustierrassen und beweidet das Gelände mit istrischen Schafen und
      Rindern, da diese Bewirtschaftung den Artenreichtum bewahrt. Nahe der Bucht Polje hält ein
      Landwirtschaftsbetrieb das einheimische Boškarin-Rind.


      Auch der Meeresraum unterliegt strenger Fürsorge: Das Meeresgebiet Westistriens, das die gesamte
      Küstenzone der Gemeinde Medulin umfasst, ist das größte marine Natura 2000-Gebiet Istriens und wird von
      der Verwaltung des Kaps betreut.
    before: >-
      Bleibe stets auf den markierten Wegen, auch mit Motorrädern, und parke niemals auf bewachsenen Flächen.
      Camping ist abseits genehmigter Gruppen verboten, und Hunde müssen an der Leine geführt werden. Das
      Pflücken oder Entnehmen geschützter Arten, ihrer Eier, Larven oder Samen ist untersagt: Fotografieren
      wird empfohlen. Du musst das Schutzgebiet vor 22 h verlassen.


      Die Meeresströmungen an der Kapspitze sind tückisch, namentlich zwischen Kap Kršine und der Insel
      Fenoliga: Entferne dich nie weiter als 100 Meter vom Ufer. Nähere dich Delfinen nur langsam und
      parallel; nicht mehr als ein Boot darf sich auf 100 m und nicht mehr als drei auf 200 m nähern. Wirf
      niemals Anker in Neptungraswiesen. Und achte beim Gehen auf den Boden: Hornotter und Schwarze Witwe sind
      selten tödlich, sollten aber niemals gereizt werden.
    around: >-
      In unmittelbarer Nähe gibt es keine Atlas-Einträge, doch andere Meeresgebiete teilen vergleichbare
      Neptungraswiesen und Tümmlervorkommen: der [Nationalpark Port-Cros](/lugar/parc-national-de-port-cros/),
      der [Nationalpark Toskanischer Archipel](/lugar/parco-nazionale-arcipelago-toscano/), der [Naturpark
      Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/) und die [Karsthochfläche und Steilküste von La
      Mola](/lugar/la-mola-formentera/).
  it:
    intro: >-
      Quasi 100 milioni di anni fa qui passeggiavano i dinosauri, e ancora oggi puoi seguire le loro orme.
      Donji Kamenjak e l'arcipelago di Medulin formano l'estremità meridionale dell'Istria, a circa 10 km da
      Pola: una penisola di calcare candido, pascoli costieri e scogliere. Qui si fondono piste fossili, oltre
      600 specie vegetali, orchidee selvatiche esclusive dell'Istria meridionale e un mare aperto dove
      transitano i delfini.
    landscape: >-
      Il calcare bianco e grigio del promontorio risale al Cenomaniano, nel Cretacico superiore, tra 98 e 93
      milioni di anni fa, quando il territorio giaceva sommerso dall'oceano Tetide. Lungo le sue rive
      abbondano i fossili. In questa roccia si sono impresse le orme di dinosauro dell'isolotto di Fenoliga e
      di Capo Grakalovac, di primario valore paleontologico: a Fenoliga se ne contano circa 150. Il sito
      custodisce tracce di carnivori ed erbivori, in gran parte disposte lungo piste continue; la più estesa
      si sviluppa per 19,5 m e riunisce 39 impronte di sauropode.


      Sopra la scogliera, il paesaggio compone un mosaico di boschetti, pascoli aridi, cisteti, macchia e
      gariga rocciosa. In origine dominavano i lecceti, degradati nei secoli dal taglio e dal pascolo fino a
      formare praterie ricche di erbe spontanee. Questi ambienti aperti sono tutelati dalla Direttiva Habitat
      dell'UE e mantenerli sgombri è prioritario: col regredire del pascolo, il pino d'Aleppo invade le radure
      minacciando le specie specializzate.


      Il microclima favorisce questa conformazione. L'ente gestore rileva un clima mediterraneo arido: circa
      210 mm di precipitazioni annuali, contro gli 872 mm della vicina Pola o di Medulin.
    wildlife: >-
      La primavera e l'autunno sono le stagioni più raccomandate dai gestori, in particolare la tarda
      primavera e l'inizio dell'autunno per cogliere appieno la vitalità del luogo.


      In primavera i prati si coprono di fioriture. Si contano circa 30 specie di orchidee, due delle quali
      crescono solo nell'Istria meridionale, fra cui Serapias istriaca. Tra le piante minacciate risalta
      Ophioglossum lusitanicum: segnalata per la prima volta in Croazia a metà dell'Ottocento, rimase
      invisibile per oltre un secolo prima di essere ritrovata nel 1974 vicino alla baia di Pomer, figurando
      dal 1994 nel libro rosso della flora croata come specie in pericolo critico. Anthemis tomentosa e
      Cicendia filiformis completano la rassegna floristica.


      In volo compaiono oltre cinquanta specie di farfalle diurne; la vanessa del cardo e il vulcano giungono
      ogni anno in migrazione dall'Africa. L'aridità avvantaggia i rettili: l'orbettino, il ramarro e la
      lucertola campestre diffusa tutto l'anno. Tra i grandi serpenti vivono il [colubro di
      Esculapio](/especie/elaphe_longissima/) e il [cervone](/especie/elaphe_quatuorlineata/), entrambi capaci
      di superare i due metri, mentre la velenosa [vipera dal corno](/especie/vipera_ammodytes/) rappresenta
      una delle due specie velenose della penisola assieme alla malmignatta. Lo [sciacallo
      dorato](/especie/canis_aureus/), il [cinghiale](/especie/sus_scrofa/), la volpe, il
      [capriolo](/especie/capreolus_capreolus/), il tasso e lo [scoiattolo comune](/especie/sciurus_vulgaris/)
      integrano i mammiferi.


      Sott'acqua, il tursiope frequenta le acque dell'Istria occidentale soprattutto per nutrirsi, con
      frequenti avvistamenti di femmine con piccoli. Sui fondali del capo sono state censite solo tre nacchere
      vive, specie decimata da un'epidemia nel Mediterraneo, mentre le praterie di
      [posidonia](/especie/posidonia_oceanica/), pianta marina protetta, risultano pressoché impossibili da
      ripristinare dopo un danneggiamento. Per i funghi, un ulteriore motivo di visita stagionale: a Donji e
      Gornji Kamenjak sono state censite 97 specie di macromiceti, di cui 16 costituiscono una novità per la
      Croazia.
    visit: >-
      Da Premantura si accede in auto, in bicicletta o in barca; l'ingresso a piedi e su due ruote è gratuito,
      mentre in estate i veicoli a motore versano un pedaggio. La bicicletta è la modalità consigliata dai
      guardaparco, essendovi una pista ciclabile separata dalla viabilità ordinaria: l'itinerario Orhideja
      costeggia il mare per 12 km con difficoltà moderata.


      A piedi, il sentiero dei dinosauri conduce a Capo Grakalovac a uno dei rari affioramenti di impronte
      fossili risalenti a 98 milioni di anni fa, mentre un percorso didattico illustra le peculiarità
      naturalistiche del promontorio. Dalla cala Školjić è possibile noleggiare kayak per navigare tra gli
      isolotti di Medulin.


      L'ente gestore propone visite guidate tutto l'anno in inglese o tedesco su mondo marino, dinosauri,
      bosco e pascoli fioriti, oltre a iniziative di volontariato con la pattuglia verde Zelena patrola.
    history: >-
      La direzione favorisce l'allevamento di razze autoctone e pascola il territorio con pecore e vacche
      istriane, poiché la pastorizia tradizionale sostiene la biodiversità. Vicino alla caletta di Polje una
      fattoria preserva il bue boškarin autoctono.


      Anche l'ambiente marino gode di protezione: il mare dell'Istria occidentale, che racchiude l'intera
      fascia costiera del comune di Medulin, costituisce la più vasta area marina Natura 2000 dell'Istria ed è
      affidata all'ente gestore del promontorio.
    before: >-
      È d'obbligo muoversi esclusivamente lungo i sentieri tracciati, motocicli inclusi, evitando di
      parcheggiare sui prati. Il campeggio è vietato eccetto comitive con permesso scritto, e i cani devono
      essere tenuti al guinzaglio. Raccogliere specie strettamente protette o prelevarne uova, larve o semi è
      proibito: l'ente invita a fotografarle. Bisogna lasciare l'area protetta prima delle 22 h.


      Le correnti marine attorno al capo sono impetuose, specie tra Capo Kršine e l'isolotto di Fenoliga: non
      allontanarti a più di 100 metri dalla riva. Se scorgi delfini, naviga piano e parallelamente; mai più di
      una barca entro 100 m né più di tre entro 200 m. Non gettare mai l'ancora sulle praterie di posidonia. E
      a terra, guarda dove metti i piedi: la vipera dal corno e la malmignatta non sono per forza letali, ma è
      prudente non infastidirle.
    around: >-
      Non vi sono schede dell'atlante contigue, ma altri litorali condividono praterie di posidonia e
      popolazioni di tursiopi: il [Parco nazionale di Port-Cros](/lugar/parc-national-de-port-cros/), il
      [Parco nazionale dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/), il [Parco
      naturale dell'arcipelago di Lastovo](/lugar/park-prirode-lastovsko-otocje/) e l'[Altopiano carsico e
      falesie de La Mola](/lugar/la-mola-formentera/).
  pt:
    intro: >-
      Há quase 100 milhões de anos vagueavam dinossauros por aqui, e ainda hoje podes seguir os seus passos.
      Donji Kamenjak e o arquipélago de Medulin constituem o extremo sul da Ístria, a cerca de 10 km de Pula:
      uma península de rocha branca, pastagens costeiras e enseadas rochosas. Aqui conjugam-se pegadas
      fósseis, mais de 600 espécies de plantas, orquídeas bravas que não medram mais a norte na Ístria e um
      mar aberto onde cruzam golfinhos.
    landscape: >-
      O calcário branco e cinzento do cabo data do Cenomaniano, no Cretáceo Superior, de há entre 98 e 93
      milhões de anos, quando a região se encontrava submersa pelo oceano Tétis. Ao longo da costa abundam os
      fósseis. Nessa rocha ficaram gravadas as pegadas de dinossauro do ilhéu Fenoliga e do cabo Grakalovac,
      com elevado relevo paleontológico: em Fenoliga contam-se cerca de 150. A jazida exibe marcas de
      carnívoros e de herbívoros, na maioria organizadas em trilhos; o mais extenso mede 19,5 m e reúne 39
      pegadas de um saurópode.


      Sobre a laje rochosa, a paisagem forma um mosaico de pinhal, prados secos, estevais, maquis e zonas
      rochosas. Outrora imperavam os sobreirais e azinhais, degradados ao longo dos séculos pelo corte e
      pastoreio até surgirem prados ricos em herbáceas. Estes habitats abertos encontram-se protegidos pela
      Diretiva Habitats da UE e mantê-los abertos é prioridade: cessando o pastoreio, o pinheiro-de-alepo
      avança e as espécies dependentes do prado desaparecem.


      O clima reforça este equilíbrio. A entidade gestora descreve um clima mediterrânico seco: cerca de 210
      mm de chuva anual, em contraste com os 872 mm na vizinha Pula ou Medulin.
    wildlife: >-
      A primavera e o outono são os períodos mais recomendados pela gestão, em especial o final da primavera e
      o princípio do outono para usufruir do local em plenitude.


      Na primavera desabrocham os pastos. Ocorrem cerca de 30 espécies de orquídeas, duas das quais exclusivas
      do sul da Ístria, entre elas Serapias istriaca. Entre as espécies vegetais vulneráveis conta-se
      Ophioglossum lusitanicum: citada pela primeira vez na Croácia em meados do século XIX, permaneceu mais
      de cem anos sem registos até ser redescoberta em 1974 junto à baía de Pomer, constando desde 1994 do
      livro vermelho da flora da Croácia como criticamente em perigo. Anthemis tomentosa e Cicendia filiformis
      completam a lista de raridades.


      No ar voam mais de cinquenta espécies de borboletas diurnas; a bela-dama e o almirante-vermelho chegam
      todos os anos em migração desde África. O clima seco favorece répteis: o licranço, o sardão e uma
      osga-das-paredes abundante todo o ano. Entre as serpentes sobressaem a
      [cobra-de-Esculápio](/especie/elaphe_longissima/) e a
      [cobra-de-quatro-riscas](/especie/elaphe_quatuorlineata/), ambas ultrapassando os dois metros de
      comprimento, surgindo ainda a venenosa [víbora-cornuda](/especie/vipera_ammodytes/), uma das duas
      espécies perigosas da península a par da viúva-negra. O [chacal-dourado](/especie/canis_aureus/), o
      [javali](/especie/sus_scrofa/), a raposa, o [corço](/especie/capreolus_capreolus/), o texugo e o
      [esquilo-vermelho](/especie/sciurus_vulgaris/) completam a fauna mamífera.


      Sob a água, o roaz-corvineiro utiliza as águas da Ístria ocidental para caçar, registando-se mães com
      crias. No fundo do mar junto ao cabo foram localizados apenas três exemplares vivos da grande-nacra,
      espécie fustigada por uma vaga de mortalidade no Mediterrâneo, ao passo que as pradarias de
      [posidónia](/especie/posidonia_oceanica/), planta marinha protegida, são praticamente irrecuperáveis
      após destruição. Nos fungos surge outro motivo de visitação estacional: em Donji e Gornji Kamenjak
      registaram-se 97 espécies de macromicetes, 16 das quais constituem novidade para a Croácia.
    visit: >-
      A partir de Premantura chega-se de carro, bicicleta ou barco; o acesso pedestre e em bicicleta é
      gratuito, enquanto no verão os veículos motorizados pagam portagem. O velocípede é a forma sugerida pelo
      parque, já que existe uma ciclovia segregada do tráfego rodoviário: a pista Orhideja percorre toda a
      costa ao longo de 12 km com dificuldade média.


      A pé, o percurso dos dinossauros conduz no cabo Grakalovac a uma das poucas jazidas de pegadas fósseis
      com 98 milhões de anos, enquanto um roteiro didático elucida sobre os valores naturais do promontório.
      Na enseada Školjić é possível alugar caiaques para contornar as ilhas do arquipélago de Medulin.


      A equipa gestora dinamiza visitas guiadas o ano inteiro em inglês ou alemão sobre o ecossistema marinho,
      dinossauros, floresta e prados de orquídeas, providenciando voluntariado através da patrulha verde
      Zelena patrola.
    history: >-
      A direção fomenta a criação de raças pecuárias autóctones e apascenta o território com ovelha e vaca da
      Ístria, sustentando que o pastoreio tradicional resguarda a biodiversidade. Perto da cala Polje, uma
      exploração agrícola preserva o boi boškarin regional.


      O ambiente marinho conta com vigilância redobrada: o mar da Ístria ocidental, que abraça toda a zona
      marítima de Medulin, é a maior área marinha da rede Natura 2000 da Ístria, tutelada diretamente pela
      gestão do cabo.
    before: >-
      Circula unicamente pelos caminhos delimitados, motos incluídas, sem estacionar em áreas de vegetação.
      Acampar é proibido exceto para grupos credenciados, e os cães devem andar com trela. Arrancar espécies
      protegidas ou levar ovos, larvas e sementes é ilícito: a direção apela à recolha fotográfica. Deves
      abandonar a reserva antes das 22 h.


      As correntes marítimas junto ao cabo são intensas, em especial entre o cabo Kršine e o ilhéu Fenoliga:
      nunca te afastes mais de 100 metros da margem. Ao avistar golfinhos, avança lentamente e em paralelo;
      apenas uma embarcação a menos de 100 m e nunca mais de três a 200 m. Não fundeies sobre pradarias de
      posidónia. E ao caminhar, repara onde assentas os pés: a víbora e a viúva-negra raramente são fatais,
      mas convém não as perturbar.
    around: >-
      Não existem locais contíguos no atlas, mas outros litorais partilham idênticas pradarias de posidónia e
      a presença do roaz: o [Parque Nacional de Port-Cros](/lugar/parc-national-de-port-cros/), o [Parque
      Nacional do Arquipélago Toscano](/lugar/parco-nazionale-arcipelago-toscano/), o [Parque Natural do
      Arquipélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/) e o [Planalto Cársico e Falésias de La
      Mola](/lugar/la-mola-formentera/).
