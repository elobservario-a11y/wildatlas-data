    En la zona de reserva casi toda actividad económica está prohibida. Antes de ir, comprueba con el gestor
    el estado de las pasarelas.
texto:
  es:
    intro: >-
      Una turbera con manantiales de azufre que guarda tanques hundidos de la Segunda Guerra Mundial. Así de
      rara es la estampa que reúne el Parque Nacional de Ķemeri, al oeste de Jūrmala: bosques y turberas,
      antiguas lagunas del mar de Littorina convertidas en lagos, y manantiales sulfurosos y lodos que se usan
      desde hace siglos por sus propiedades curativas. Es el tercer parque nacional más grande de Letonia y se
      creó en 1997.
    landscape: >-
      La mitad del parque es bosque: el 57 %, con pinares secos sobre arena pobre en la costa del golfo de
      Riga. Las turberas ocupan un cuarto, con los tres tipos presentes (bajas, de transición y altas), y las
      dos mayores son la Gran Turbera de Ķemeri y Raganu purvs. La Gran Turbera, además, tiene cientos de
      pequeñas lagunas. Los lagos más grandes, Kaņieris, Dūņieris, Sloka y Valgums, son lagunas del mar de
      Littorina; Kaņieris es el mayor y Aklais ezers destaca por su poca profundidad, de 0,5 m de media.


      Las turberas de Letonia empezaron a formarse hace unos 10 000 años, al calentarse el clima tras la
      última glaciación. Aquí los manantiales nacen de una capa de yeso y de bacterias del suelo que producen
      sulfuro de hidrógeno: por eso el parque tiene tantos manantiales sulfurosos, casi treinta de ellos en
      los alrededores de Ķemeri. En las leyendas letonas se llamaban ojos del diablo y se usaban para curar
      desde tiempos remotos.
    wildlife: >-
      La turbera alta es austera: musgos como Sphagnum, Eriophorum vaginatum, Calluna vulgaris, Ledum
      palustre, Andromeda polifolia y drosera, la planta insectívora que aquí se ve y en otros sitios no. En
      Raganu purvs, junto a los manantiales sulfurosos, hay turberas bajas con muchos musgos, carrizos y
      orquídeas. Hay también bayas silvestres comestibles: arándanos rojos, empetros, moras de pantano y
      arándanos.


      Para las aves, Kaņieris es uno de los mejores sitios de Letonia: casi doscientas especies y, en
      migración, más de diez mil aves acuáticas. La torre de la península de Riekstu domina gran parte del
      lago. En la turbera crían la [grulla común](/especie/grus_grus/), el andarríos bastardo y el chorlito
      dorado; los dos últimos solo crían en turbera alta. En otoño se oyen las grullas a lo lejos desde la
      pasarela, y se pueden ver también el bisbita arbóreo y la lavandera blanca. En el río Slocene viven el
      martín pescador, la cigüeña negra, la [nutria](/especie/lutra_lutra/) y varios murciélagos de agua. El
      parque cuenta además entre sus especies con el [castor](/especie/castor_fiber/), el [pigargo
      europeo](/especie/haliaeetus_albicilla/) y el [alce](/especie/alces_alces/).
    visit: >-
      Empieza por la pasarela de la Gran Turbera, al norte de la turbera y a unos cuatro kilómetros de Ķemeri:
      tiene dos lazos, el pequeño de 1,4 km y el grande de 3,4 km, con torre de observación. Es muy buscada
      por fotógrafos al amanecer y al atardecer. Además, el mapa turístico municipal indica que la pasarela
      del bosque húmedo de Ķemeri es apta para cochecitos y sillas de ruedas.


      Otras rutas: la pasarela de Niedrāju, de 0,6 km y en parte sobre pontones, que deja ver las praderas
      calcáreas de la orilla y los carrizales; el sendero del castro de Kaņieris, un lazo de 1,3 km por bosque
      y turbera baja, con plataforma mirador al final; el sendero de Sēra dīķi, de 0,8 km por Raganu purvs,
      donde los manantiales forman estanques someros; y la ruta de 14 km a Zaļā kāpa, un cordón de dunas
      interior de varios kilómetros que quedó de cuando el mar de Littorina llegaba allí.
    history: >-
      Antes del parque hubo una reserva creada en 1957, y después se protegieron el refugio ornitológico de
      Kaņieris y el valle del Slocene en 1977, y la Gran Turbera en 1987, hasta que en 1997 se creó el parque.
      En 2005 se renaturalizó el río Slampe, con meandros donde antes estaba enderezado, y en 2006 se restauró
      el régimen hídrico de la Gran Turbera con un sistema de diques. Kaņieris es sitio Ramsar. Numerosos
      tanques de la Segunda Guerra Mundial se hundieron en la turbera, porque su profundidad llega a dos
      pisos.
    before: >-
      En la zona de reserva casi toda actividad económica está prohibida. Antes de ir, comprueba con el gestor
      el estado de las pasarelas.
    around: >-
      A treinta kilómetros está [Abavas Senlejas Dabas Parks](/lugar/abavas-senlejas-dabas-parks/). Con
      humedales, costa y lagos parecidos, comparten grullas, castores y pigargos el [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/), y grullas y alces el [Store Mosse National
      Park](/lugar/store-mosse-national-park/); más cerca en espíritu, el [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) comparte alce, castor y pigargo, y el [Teiču dabas
      rezervāts](/lugar/teicu-dabas-rezervats/), la grulla y el chorlito dorado.
  en:
    intro: >-
      A peat bog with sulphur springs concealing sunken tanks from the Second World War. Such is the
      extraordinary landscape united within Ķemeri National Park, west of Jūrmala: forests and bogs, former
      lagoons of the Littorina Sea converted into lakes, and mineral-rich sulphur springs and muds utilized
      for centuries for their curative properties. It is the third largest national park in Latvia and was
      established in 1997.
    landscape: >-
      Half of the park is forested: 57 %, featuring dry pine forests on poor sandy ground along the coast of
      the Gulf of Riga. Peat bogs account for a quarter, with all three bog types present (fens, transitional
      and raised bogs), the two largest being the Great Ķemeri Bog and Raganu purvs. The Great Bog, moreover,
      contains hundreds of tiny pools. The largest lakes, Kaņieris, Dūņieris, Sloka and Valgums, are relict
      lagoons of the Littorina Sea; Kaņieris is the largest and Aklais ezers stands out for its shallow depth,
      averaging 0.5 m.


      Latvia's peat bogs began forming around 10,000 years ago as the climate warmed following the last
      glaciation. Here the springs originate from a gypsum stratum and soil bacteria producing hydrogen
      sulphide: that is why the park harbors so many sulphur springs, almost thirty of them around Ķemeri. In
      Latvian folklore they were known as the devil's eyes and have been sought for healing since ancient
      times.
    wildlife: >-
      The raised bog is stark: mosses such as Sphagnum, Eriophorum vaginatum, Calluna vulgaris, Ledum
      palustre, Andromeda polifolia and sundew, the carnivorous plant found here while absent elsewhere. In
      Raganu purvs, by the sulphur springs, rich fens harbor diverse mosses, reeds and orchids. Edible wild
      berries also thrive: cranberries, crowberries, cloudberries and bog bilberries.


      For birds, Kaņieris is one of the premier sites in Latvia: nearly two hundred species and, during
      migration, more than ten thousand waterfowl. The observation tower on the Riekstu peninsula overlooks
      much of the lake. In the bog breed the [Common crane](/especie/grus_grus/), the wood sandpiper and the
      European golden plover; the latter two breed exclusively in raised bog habitats. In autumn you can hear
      cranes calling in the distance from the boardwalk, and meadow pipits and white wagtails are easily
      spotted. Along the Slocene river live the common kingfisher, the black stork, the [Eurasian
      otter](/especie/lutra_lutra/) and several water-dwelling bats. The park also counts among its
      inhabitants the [Eurasian beaver](/especie/castor_fiber/), the [White-tailed
      eagle](/especie/haliaeetus_albicilla/) and the [Moose](/especie/alces_alces/).
    visit: >-
      Begin with the Great Bog boardwalk, located on the northern edge of the peatland about four kilometres
      from Ķemeri: it offers two loops, the small loop of 1.4 km and the large loop of 3.4 km, equipped with
      an observation tower. It is highly sought by photographers at sunrise and sunset. In addition, the local
      tourist map notes that the Ķemeri wet forest boardwalk is accessible for strollers and wheelchairs.


      Other routes include: the Niedrāju boardwalk, 0.6 km long and partly on floating pontoons, revealing
      shoreline calcareous fen meadows and reedbeds; the Kaņieris hillfort trail, a 1.3 km loop through forest
      and fen, ending at a viewing platform; the Sēra dīķi trail, 0.8 km across Raganu purvs, where springs
      form shallow pools; and the 14 km trail to Zaļā kāpa, an inland sand dune ridge stretching several
      kilometres left behind when the Littorina Sea reached this inland shore.
    history: >-
      Prior to the park, a reserve was established in 1957, followed by protection of the Kaņieris bird
      sanctuary and the Slocene valley in 1977, and the Great Bog in 1987, culminating in the creation of the
      national park in 1997. In 2005 the Slampe river was re-meandered where it had previously been
      straightened, and in 2006 the hydrological regime of the Great Bog was restored with a system of dams.
      Kaņieris is a Ramsar site. Numerous tanks from the Second World War sank into the bog, where the peat
      reaches two storeys in depth.
    before: >-
      In the strict reserve zone almost all economic activities are prohibited. Before visiting, check with
      the park management on the condition of the boardwalks.
    around: >-
      Thirty kilometres away lies [Abavas Senlejas Dabas Parks](/lugar/abavas-senlejas-dabas-parks/). Sharing
      similar wetlands, coasts and lakes, cranes, beavers and white-tailed eagles are shared with [Słowiński
      Park Narodowy](/lugar/slowinski-park-narodowy/), while cranes and moose are shared with [Store Mosse
      National Park](/lugar/store-mosse-national-park/); closer in character, [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) shares moose, beaver and white-tailed eagle, and
      [Teiču dabas rezervāts](/lugar/teicu-dabas-rezervats/) shares the crane and golden plover.
  fr:
    intro: >-
      Une tourbière aux sources de soufre renfermant des chars immergés de la Seconde Guerre mondiale. Tel est
      le paysage singulier réuni au sein du parc national de Ķemeri, à l'ouest de Jūrmala : forêts et
      tourbières, anciennes lagunes de la mer Littorina transformées en lacs, ainsi que des sources
      sulfureuses et des boues exploitées depuis des siècles pour leurs vertus curatives. C'est le troisième
      plus grand parc national de Lettonie, créé en 1997.
    landscape: >-
      La moitié du parc est boisée : 57 %, avec des pinèdes sèches sur sables pauvres le long de la côte du
      golfe de Riga. Les tourbières couvrent un quart de la superficie, les trois types y étant représentés
      (basses, de transition et hautes), les deux plus vastes étant la Grande Tourbière de Ķemeri et Raganu
      purvs. La Grande Tourbière compte en outre des centaines de petites mares. Les plus grands lacs,
      Kaņieris, Dūņieris, Sloka et Valgums, sont des lagunes de la mer Littorina ; Kaņieris est le plus vaste
      et l'Aklais ezers se distingue par sa faible profondeur, de 0,5 m en moyenne.


      Les tourbières de Lettonie ont commencé à se former il y a environ 10 000 ans, au réchauffement
      climatique succédant à la dernière glaciation. Ici, les résurgences jaillissent d'une couche de gypse où
      des bactéries du sol produisent du sulfure d'hydrogène : voilà pourquoi le parc compte autant de sources
      de soufre, près d'une trentaine aux alentours de Ķemeri. Dans les légendes lettonnes, on les nommait les
      yeux du diable et on les employait pour guérir dès les temps reculés.
    wildlife: >-
      La tourbière haute est austère : des mousses comme Sphagnum, Eriophorum vaginatum, Calluna vulgaris,
      Ledum palustre, Andromeda polifolia et la droséra, cette plante insectivore bien visible ici et absente
      ailleurs. À Raganu purvs, près des sources sulfureuses, des tourbières basses abritent de multiples
      mousses, des roseaux et des orchidées. On y trouve aussi des baies sauvages comestibles : canneberges,
      camarine noire, plaqueminier et myrtilles des marais.


      Pour l'avifaune, le lac Kaņieris est l'un des meilleurs sites de Lettonie : près de deux cents espèces
      et, lors des passages migratoires, plus de dix mille oiseaux d'eau. La tour d'observation de la
      péninsule de Riekstu surplombe une grande partie du lac. Dans la tourbière nichent la [Grue
      cendrée](/especie/grus_grus/), le chevalier sylvain et le pluvier doré ; ces deux derniers ne se
      reproduisent qu'en tourbière haute. En automne, vous entendez au loin les grues depuis la passerelle, et
      vous pouvez aussi croiser le pipit des arbres et la bergeronnette grise. Le long de la rivière Slocene
      vivent le martin-pêcheur, la cigogne noire, la [Loutre d'Europe](/especie/lutra_lutra/) et diverses
      chauves-souris aquatiques. Le parc compte également parmi ses résidents le [Castor
      d'Europe](/especie/castor_fiber/), le [Pygargue à queue blanche](/especie/haliaeetus_albicilla/) et
      l'[Élan](/especie/alces_alces/).
    visit: >-
      Commencez par la passerelle de la Grande Tourbière, au nord du complexe et à environ quatre kilomètres
      de Ķemeri : elle propose deux boucles, la petite de 1,4 km et la grande de 3,4 km, équipée d'une tour
      d'observation. Elle est très prisée des photographes à l'aube et au crépuscule. Par ailleurs, le plan
      touristique municipal signale que la passerelle de la forêt humide de Ķemeri est accessible aux
      poussettes et aux fauteuils roulants.


      Autres itinéraires : la passerelle de Niedrāju, longue de 0,6 km et établie en partie sur pontons, qui
      permet de contempler les prairies calcaires rivulaires et les roselières ; le sentier du castro de
      Kaņieris, une boucle de 1,3 km entre forêt et tourbière basse munie d'une plateforme panoramique ; le
      sentier de Sēra dīķi, long de 0,8 km à travers Raganu purvs, où les sources forment des mares peu
      profondes ; et le circuit de 14 km vers Zaļā kāpa, un cordon dunaire intérieur de plusieurs kilomètres
      laissé là lorsque la mer Littorina baignait ces rivages.
    history: >-
      Avant la naissance du parc, une réserve fut créée en 1957, puis le refuge ornithologique de Kaņieris et
      la vallée de la Slocene furent protégés en 1977, et la Grande Tourbière en 1987, jusqu'à la constitution
      du parc en 1997. En 2005, la rivière Slampe a été renaturée par la recréation de méandres là où son
      cours était canalisé, et en 2006 le régime hydrique de la Grande Tourbière a été restauré grâce à un
      réseau de digues. Kaņieris est un site Ramsar. De nombreux chars de la Seconde Guerre mondiale ont
      sombré dans la tourbière, dont l'épaisseur atteint deux étages.
    before: >-
      Dans la zone de réserve intégrale, presque toute activité économique est proscrite. Avant votre visite,
      renseignez-vous auprès du gestionnaire sur l'état des passerelles.
    around: >-
      À trente kilomètres se trouve [Abavas Senlejas Dabas Parks](/lugar/abavas-senlejas-dabas-parks/).
      Partageant des zones humides, un littoral et des lacs comparables, le [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/) a en commun les grues, les castors et les pygargues, et le
      [Store Mosse National Park](/lugar/store-mosse-national-park/) les grues et les élans ; plus proche par
      son identité, le [Kuršių nerijos nacionalinis parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/)
      partage l'élan, le castor et le pygargue, tandis que le [Teiču dabas
      rezervāts](/lugar/teicu-dabas-rezervats/) abrite la grue et le pluvier doré.
  de:
    intro: >-
      Ein Hochmoor mit Schwefelquellen, in dem versunkene Panzer aus dem Zweiten Weltkrieg liegen. Ein solch
      außergewöhnliches Landschaftsbild vereint der Ķemeri-Nationalpark westlich von Jūrmala: Wälder und
      Moore, ehemalige Lagunen des Littorina-Meeres, die zu Seen wurden, sowie Schwefelquellen und
      Heilschlämme, die seit Jahrhunderten wegen ihrer lindernden Wirkung genutzt werden. Er ist der
      drittgrößte Nationalpark Lettlands und wurde 1997 gegründet.
    landscape: >-
      Die Hälfte des Parks ist Wald: 57 %, mit lichten Kiefernwäldern auf nährstoffarmen Sandböden an der
      Küste des Rigaer Meerbusens. Moore bedecken ein Viertel der Fläche, wobei alle drei Moortypen vertreten
      sind (Niedermoore, Übergangsmoore und Hochmoore); die beiden größten sind das Große Ķemeri-Moor und
      Raganu purvs. Das Große Moor weist zudem hunderte kleiner Mooraugen auf. Die größten Seen, Kaņieris,
      Dūņieris, Sloka und Valgums, sind Reliktlagunen des Littorina-Meeres; Kaņieris ist der größte, während
      der Aklais ezers durch seine geringe Wassertiefe von durchschnittlich 0,5 m auffällt.


      Die Moore Lettlands begannen sich vor rund 10 000 Jahren zu bilden, als sich das Klima nach der letzten
      Eiszeit erwärmte. Hier entspringen die Quellen einer Gipsschicht, in der Bodenbakterien
      Schwefelwasserstoff erzeugen: Deshalb birgt der Park so viele Schwefelquellen, beinahe dreißig davon
      rund um Ķemeri. In lettischen Volkssagen wurden sie Teufelsaugen genannt und schon in ferner Vorzeit zu
      Heilzwecken aufgesucht.
    wildlife: >-
      Das Hochmoor ist karg: Torfmoose wie Sphagnum, Scheiden-Wollgras, Besenheide, Sumpfporst, Rosmarinheide
      und Sonnentau, jene fleischfressende Pflanze, die hier wächst und andernorts fehlt. Im Raganu purvs bei
      den Schwefelquellen gedeihen Niedermoore mit artenreichen Moosen, Schilf und Orchideen. Auch essbare
      Waldbeeren gibt es: Moosbeeren, Krähenbeeren, Moltebeeren und Rauschbeeren.


      Für Vögel ist der Kaņieris-See eines der besten Gebiete Lettlands: fast zweihundert Arten und während
      des Zugs über zehntausend Wasservögel. Der Beobachtungsturm auf der Halbinsel Riekstu überblickt weite
      Teile des Sees. Im Moor brüten der [Kranich](/especie/grus_grus/), der Bruchwasserläufer und der
      Goldregenpfeifer; die beiden letztgenannten brüten ausschließlich im Hochmoor. Im Herbst hörst du die
      Kraniche von den Holzstegen aus der Ferne rufen, und auch Baumpieper und Bachstelze sind regelmäßig zu
      sehen. Entlang des Flusses Slocene leben Eisvogel, Schwarzstorch, der [Eurasische
      Fischotter](/especie/lutra_lutra/) und verschiedene Wasserfledermäuse. Zu den Tierarten des Parks
      gehören zudem der [Europäische Biber](/especie/castor_fiber/), der
      [Seeadler](/especie/haliaeetus_albicilla/) und der [Elch](/especie/alces_alces/).
    visit: >-
      Beginne am Holzsteg des Großen Moors, der am Nordrand des Moores etwa vier Kilometer von Ķemeri entfernt
      liegt: Er bietet zwei Rundwege, die kleine Schleife von 1,4 km und die große von 3,4 km mit
      Aussichtsturm. Er ist bei Sonnenaufgang und Sonnenuntergang ein begehrtes Ziel für Fotografen. Auf der
      Tourismuskarte der Gemeinde ist zudem vermerkt, dass der Holzsteg im Bruchwald von Ķemeri für
      Kinderwagen und Rollstühle geeignet ist.


      Weitere Routen: der Niedrāju-Steg, 0,6 km lang und teils auf Pontons schwimmend, der Einblicke in
      kalkreiche Uferwiesen und Schilfgürtel gewährt; der Burgwall-Pfad Kaņieris, eine 1,3 km lange Schleife
      durch Wald und Flachmoor mit Aussichtsplattform; der 0,8 km lange Lehrpfad Sēra dīķi im Raganu purvs, wo
      Quellen flache Teiche bilden; sowie der 14 km lange Wanderweg zur Zaļā kāpa, einem mehrere Kilometer
      langen Binnendünenzug, der davon zeugt, wie weit das Littorina-Meer einst ins Landesinnere reichte.
    history: >-
      Vor Gründung des Parks entstand 1957 ein erstes Schutzgebiet; 1977 wurden das Vogelschutzgebiet Kaņieris
      und das Slocene-Tal unter Schutz gestellt, 1987 folgte das Große Moor, bis 1997 der Nationalpark
      eingerichtet wurde. Im Jahr 2005 wurde der Fluss Slampe renaturiert und erhielt wieder Mäander, wo er
      zuvor begradigt war; 2006 wurde der Wasserhaushalt des Großen Moors durch ein System von Dämmen
      wiederhergestellt. Kaņieris ist ein Ramsar-Gebiet. Zahlreiche Panzer aus dem Zweiten Weltkrieg versanken
      im Moor, da der Torfkörper eine Tiefe von zwei Stockwerken erreicht.
    before: >-
      In der Kernzone des Reservats ist nahezu jede wirtschaftliche Nutzung untersagt. Erkundige dich vor
      deinem Besuch bei der Parkverwaltung über den Zustand der Stege.
    around: >-
      Dreißig Kilometer entfernt liegt der [Abavas Senlejas Dabas Parks](/lugar/abavas-senlejas-dabas-parks/).
      Mit vergleichbaren Feuchtgebieten, Küsten und Seen teilen Kraniche, Biber und Seeadler den Lebensraum im
      [Słowiński Park Narodowy](/lugar/slowinski-park-narodowy/), während Kraniche und Elche auch im [Store
      Mosse National Park](/lugar/store-mosse-national-park/) vorkommen; im Charakter noch näher verwandt,
      teilt der [Kuršių nerijos nacionalinis parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) Elch, Biber
      und Seeadler, während das [Teiču dabas rezervāts](/lugar/teicu-dabas-rezervats/) Kranich und
      Goldregenpfeifer beherbergt.
  it:
    intro: >-
      Una torbiera con sorgenti sulfuree che custodisce carri armati affondati della Seconda Guerra Mondiale.
      È questo il singolare scenario riunito nel Parco nazionale di Ķemeri, a ovest di Jūrmala: foreste e
      torbiere, antiche lagune del mare Littorina trasformate in laghi, sorgenti sulfuree e fanghi utilizzati
      da secoli per le loro proprietà terapeutiche. È il terzo parco nazionale più esteso della Lettonia ed è
      stato istituito nel 1997.
    landscape: >-
      La metà del parco è coperta da boschi: il 57 %, con pinete asciutte su sabbie povere lungo la costa del
      golfo di Riga. Le torbiere occupano un quarto della superficie, con la presenza di tutte e tre le
      tipologie (basse, di transizione e alte), e le due maggiori sono la Grande Torbiera di Ķemeri e Raganu
      purvs. La Grande Torbiera custodisce inoltre centinaia di piccoli specchi d'acqua. I laghi maggiori,
      Kaņieris, Dūņieris, Sloka e Valgums, sono antiche lagune del mare Littorina; Kaņieris è il più esteso e
      l'Aklais ezers si distingue per la sua scarsa profondità, pari a 0,5 m di media.


      Le torbiere lettoni iniziarono a formarsi circa 10 000 anni fa, con il riscaldamento climatico seguito
      all'ultima glaciazione. Qui le sorgenti scaturiscono da uno strato di gesso e dall'azione di batteri del
      suolo che producono idrogeno solforato: per questo il parco ospita così tante sorgenti sulfuree, quasi
      trenta nei soli dintorni di Ķemeri. Nelle leggende lettoni venivano chiamate occhi del diavolo e
      impiegate a fini curativi fin da epoche remote.
    wildlife: >-
      La torbiera alta è severa: muschi come Sphagnum, eriofori, brugo, ledum palustre, andromeda e drosera,
      la pianta insettivora che qui prospera mentre manca altrove. A Raganu purvs, vicino alle sorgenti
      sulfuree, le torbiere basse accolgono ricchi strati di muschi, canneti e orchidee. Vi crescono anche
      bacche selvatiche commestibili: mirtilli rossi, empetri, camemori e mirtilli di palude.


      Per gli uccelli il lago Kaņieris è uno dei luoghi più rinomati della Lettonia: quasi duecento specie e,
      durante le migrazioni, oltre diecimila uccelli acquatici. La torre sulla penisola di Riekstu domina
      buona parte del lago. Nella torbiera nidificano la [Gru](/especie/grus_grus/), il piro piro boschereccio
      e il piviere dorato; questi ultimi due nidificano esclusivamente nelle torbiere alte. In autunno puoi
      udire le gru in lontananza dalla passerella, scorgendo anche il prispolone e la ballerina bianca. Lungo
      il fiume Slocene abitano il martin pescatore, la cicogna nera, la [lontra
      europea](/especie/lutra_lutra/) e diversi pipistrelli d'acqua. Tra le specie stabili del parco figurano
      anche il [castoro europeo](/especie/castor_fiber/), l'[Aquila di mare](/especie/haliaeetus_albicilla/) e
      l'[alce](/especie/alces_alces/).
    visit: >-
      Comincia dalla passerella della Grande Torbiera, situata a nord del bacino e a circa quattro chilometri
      da Ķemeri: offre due anelli, quello breve da 1,4 km e quello principale da 3,4 km con torre panoramica.
      È un luogo gettonatissimo dai fotografi all'alba e al tramonto. Inoltre, la mappa turistica comunale
      segnala che la passerella della foresta allagata di Ķemeri è accessibile a passeggini e sedie a rotelle.


      Altri tracciati: la passerella di Niedrāju, lunga 0,6 km e in parte su pontili galleggianti, che
      consente di osservare i prati calcarei spondali e i canneti; il sentiero del castelliere di Kaņieris,
      anello di 1,3 km tra bosco e torbiera bassa con terrazza panoramica conclusiva; il sentiero di Sēra
      dīķi, 0,8 km attraverso Raganu purvs dove le risorgive formano stagni poco profondi; e il percorso di 14
      km verso Zaļā kāpa, un cordone dunale interno lungo diversi chilometri testimone di quando il mare
      Littorina bagnava l'entroterra.
    history: >-
      Prima del parco fu istituita una riserva nel 1957; in seguito vennero protetti il rifugio ornitologico
      di Kaņieris e la valle dello Slocene nel 1977, e la Grande Torbiera nel 1987, fino alla proclamazione
      del parco nel 1997. Nel 2005 il corso del fiume Slampe è stato rinaturato con nuovi meandri dove prima
      era canalizzato, e nel 2006 il regime idrico della Grande Torbiera è stato risanato grazie a un
      complesso di sbarramenti. Kaņieris è una zona umida Ramsar. Numerosi carri armati della Seconda Guerra
      Mondiale sprofondarono nella torbiera, la cui profondità raggiunge l'equivalente di due piani.
    before: >-
      Nella zona di riserva integrale quasi ogni attività economica è interdetta. Prima di partire, accertati
      presso l'ente gestore dell'agibilità delle passerelle.
    around: >-
      A trenta chilometri sorge [Abavas Senlejas Dabas Parks](/lugar/abavas-senlejas-dabas-parks/). Con zone
      umide, coste e laghi affini, condividono gru, castori e aquile di mare lo [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/), e gru e alci lo [Store Mosse National
      Park](/lugar/store-mosse-national-park/); ancor più affine nello spirito, il [Kuršių nerijos
      nacionalinis parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) condivide alce, castoro e aquila di
      mare, mentre il [Teiču dabas rezervāts](/lugar/teicu-dabas-rezervats/) ospita la gru e il piviere
      dorato.
  pt:
    intro: >-
      Uma turfeira com nascentes sulfurosas que guarda tanques afundados da Segunda Guerra Mundial. É este o
      cenário singular reunido no Parque Nacional de Ķemeri, a oeste de Jūrmala: florestas e turfeiras,
      antigas lagoas do mar de Littorina transformadas em lagos, e nascentes de enxofre e lamas utilizadas há
      séculos pelas suas propriedades curativas. É o terceiro maior parque nacional da Letónia e foi criado em
      1997.
    landscape: >-
      Metade do parque é floresta: 57 %, com pinhais secos sobre areias pobres na costa do golfo de Riga. As
      turfeiras cobrem um quarto da área, encontrando-se presentes os três tipos (baixas, de transição e
      altas), sendo as duas maiores a Grande Turfeira de Ķemeri e Raganu purvs. A Grande Turfeira tem, além
      disso, centenas de pequenas lagoas. Os maiores lagos, Kaņieris, Dūņieris, Sloka e Valgums, são lagoas do
      mar de Littorina; Kaņieris é o maior e o Aklais ezers destaca-se pela sua reduzida profundidade, com 0,5
      m em média.


      As turfeiras da Letónia começaram a formar-se há cerca de 10 000 anos, com o aquecimento climático após
      a última glaciação. Aqui as nascentes brotam de uma camada de gesso e da ação de bactérias do solo que
      libertam sulfureto de hidrogénio: por isso o parque reúne tantas nascentes sulfurosas, quase trinta
      delas nos arredores de Ķemeri. Nas lendas letãs eram chamadas olhos do diabo e usadas para curar desde
      tempos imemoriais.
    wildlife: >-
      A turfeira alta é austera: musgos como Sphagnum, Eriophorum vaginatum, Calluna vulgaris, Ledum palustre,
      Andromeda polifolia e a drósera, a planta insetívora que aqui se observa e que falta noutros locais. Em
      Raganu purvs, junto às nascentes sulfurosas, as turfeiras baixas acolhem numerosos musgos, caniços e
      orquídeas. Há também bagas silvestres comestíveis: oxicocos, camarinhas-negras, amoras-árticas e
      mirtilos-dos-pauis.


      Para as aves, Kaņieris é um dos melhores locais da Letónia: perto de duzentas espécies e, durante as
      migrações, mais de dez mil aves aquáticas. A torre da península de Riekstu domina grande parte do lago.
      Na turfeira nidificam o [Grou-comum](/especie/grus_grus/), o maçarico-bastardo e a tarambola-dourada; os
      dois últimos nidificam apenas em turfeiras altas. No outono ouvem-se os grous ao longe a partir do
      passadiço, avistando-se também a petinha-das-árvores e a alvéola-branca. Ao longo do rio Slocene habitam
      o guarda-rios, a cegonha-preta, a [Lontra-europeia](/especie/lutra_lutra/) e vários morcegos-de-água. O
      parque conta ainda entre as suas espécies com o [Castor-europeu](/especie/castor_fiber/), a
      [Águia-rabalva](/especie/haliaeetus_albicilla/) e o [Alce](/especie/alces_alces/).
    visit: >-
      Começa pelo passadiço da Grande Turfeira, a norte da turfeira e a cerca de quatro quilómetros de Ķemeri:
      tem dois circuitos, o pequeno de 1,4 km e o grande de 3,4 km, equipado com torre de observação. É muito
      procurado por fotógrafos ao amanhecer e ao entardecer. Além disso, o mapa turístico municipal indica que
      o passadiço da floresta húmida de Ķemeri é acessível a carrinhos de bebé e cadeiras de rodas.


      Outros percursos: o passadiço de Niedrāju, com 0,6 km e em parte sobre pontões flutuantes, que permite
      observar os prados calcários ribeirinhos e os caniçais; o trilho do castro de Kaņieris, um circuito de
      1,3 km por floresta e turfeira baixa com miradouro no final; o trilho de Sēra dīķi, de 0,8 km através de
      Raganu purvs, onde as nascentes formam lagoas pouco profundas; e o traçado de 14 km até Zaļā kāpa, um
      cordão dunar interior com vários quilómetros deixado de quando o mar de Littorina ali chegava.
    history: >-
      Antes do parque existiu uma reserva criada em 1957, protegendo-se depois o refúgio ornitológico de
      Kaņieris e o vale do Slocene em 1977, e a Grande Turfeira em 1987, até à criação do parque em 1997. Em
      2005 renaturalizou-se o rio Slampe, repondo meandros onde antes corria em linha reta, e em 2006
      restaurou-se o regime hídrico da Grande Turfeira com um sistema de diques. Kaņieris é um sítio Ramsar.
      Inúmeros tanques da Segunda Guerra Mundial afundaram-se na turfeira, cuja espessura atinge dois andares
      de profundidade.
    before: >-
      Na zona de reserva integral quase toda a atividade económica é proibida. Antes de ires, confirma com a
      administração o estado de conservação dos passadiços.
    around: >-
      A trinta quilómetros fica [Abavas Senlejas Dabas Parks](/lugar/abavas-senlejas-dabas-parks/).
      Partilhando zonas húmidas, costa e lagos semelhantes, encontram-se grous, castores e águias-rabalvas no
      [Słowiński Park Narodowy](/lugar/slowinski-park-narodowy/), e grous e alces no [Store Mosse National
      Park](/lugar/store-mosse-national-park/); mais próximo no seu espírito, o [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/) partilha o alce, o castor e a águia-rabalva, e o
      [Teiču dabas rezervāts](/lugar/teicu-dabas-rezervats/) o grou e a tarambola-dourada.
