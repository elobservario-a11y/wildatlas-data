resumen:
  es: >-
    Turberas elevadas, bosques pantanosos y lagunas costeras a media hora de Riga, con la pasarela de la Gran
    Turbera de Ķemeri.
  en: >-
    Raised bogs, swamp forests and coastal lagoons half an hour from Riga, featuring the Great Ķemeri Bog
    boardwalk.
  fr: >-
    Tourbières bombées, forêts marécageuses et lagunes côtières à une demi-heure de Riga, avec la passerelle
    de la Grande Tourbière de Ķemeri.
  de: >-
    Hochmoore, Bruchwälder und Küstenlagunen eine halbe Stunde von Riga entfernt, mit dem Holzsteg des Großen
    Ķemeri-Moors.
  it: >-
    Torbiere alte, foreste palustri e lagune costiere a mezz'ora da Riga, con la passerella della Grande
    Torbiera di Ķemeri.
  pt: >-
    Turfeiras altas, florestas pantanosas e lagoas costeiras a meia hora de Riga, com o passadiço da Grande
    Turfeira de Ķemeri.
unico:
  es: >-
    Una Gran Turbera que se recorre sobre pasarelas, junto a un lago de aves, a manantiales de azufre y a una
    duna que recuerda dónde llegó el mar.
  en: >-
    A Great Bog traversed on wooden boardwalks, alongside a bird-rich lake, sulphur springs and an inland dune
    tracing the ancient sea reach.
  fr: >-
    Une Grande Tourbière que l'on parcourt sur des passerelles, près d'un lac d'oiseaux, de sources
    sulfureuses et d'une dune témoignant de l'ancienne avancée de la mer.
  de: >-
    Ein Großes Moor, das auf Holzstegen durchquert wird, neben einem vogelreichen See, Schwefelquellen und
    einer Binnendüne, die daran erinnert, bis wohin einst das Meer reichte.
  it: >-
    Una Grande Torbiera attraversata da passerelle in legno, accanto a un lago ricco di avifauna, a sorgenti
    sulfuree e a una duna che ricorda fin dove giungeva il mare.
  pt: >-
    Uma Grande Turfeira percorrida em passadiços de madeira, junto a um lago de aves, a nascentes de enxofre e
    a uma duna que recorda até onde o mar chegou.
observaciones:
