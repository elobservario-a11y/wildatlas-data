    Una montaña fuera del alcance del excursionista corriente, en un grupo de cuatro que comparten un lago en
    el centro de un anfiteatro de rocas.
  en: >-
    A mountain beyond the reach of ordinary hikers, within a quartet of peaks sharing a glacial lake at the
    centre of a natural rock amphitheatre.
  fr: >-
    Une montagne hors de portée du randonneur ordinaire, au sein d’un groupe de quatre sommets partageant un
    lac au cœur d’un cirque rocheux.
  de: >-
    Ein rauer Berg abseits gewöhnlicher Wanderrouten in einer Vierergruppe, die einen See inmitten einer
    Felsenarena umschließt.
  it: >-
    Una montagna inaccessibile all’escursionista comune, in un gruppo di quattro vette che condividono un lago
    al centro di un anfiteatro di roccia.
  pt: >-
    Uma montanha fora do alcance do excursionista comum, num conjunto de quatro cumes que partilham um lago no
    centro de um anfiteatro rochoso.
observaciones:
  es: >-
    El lago Trnovačko es a menudo el punto de partida de los excursionistas hacia estas montañas. El bloque
    queda a caballo de la frontera entre Montenegro y Bosnia y Herzegovina.
texto:
  es:
    intro: >-
      En el noroeste de Montenegro hay cuatro montañas que no tienen un nombre común, aunque forman una sola
      unidad geológica y geomorfológica cuyo centro es un lago: el Trnovačko. Son Bioč, Maglić, Volujak y
      Vlasulja, y Bioč es la que cierra el grupo por el sureste. Su cumbre más alta, Veliki Vitao, también
      llamada Vitlovi, es la más alta de todo el conjunto. El macizo se reparte entre Montenegro y Bosnia y
      Herzegovina: queda en parte dentro del Parque Nacional de Sutjeska.
    landscape: >-
      Los límites de este grupo de montañas los dibujan tres valles: el cañón del Piva por el este, el valle
      del Sutjeska por el norte y el oeste y el del Vrbnica por el sur. Entre ellos, el paisaje cambia de tipo
      a cada paso: barras de grava, laderas verdes escalonadas, gargantas estrechas, bordes rocosos de mesetas
      altas y cumbres modeladas por la erosión glaciar. En el valle del Sutjeska, que separa Zelengora de
      Maglić, Volujak y Bioč, el río ha excavado un cañón de 1200 metros de profundidad.


      En el corazón del grupo está el lago Trnovačko, a 1.517 metros, verde azulado, de 700 metros de largo y
      400 de ancho, rodeado de cumbres de más de 2000 metros: Maglić, Bioč, Volujak, Vlasulja y Trnovački
      Durmitor. Es muy probablemente de origen glaciar, y recibe el agua de Maglić, Volujak y Bioč. En
      invierno suele helarse, y la nieve abundante puede durar hasta el verano. Es punto de partida frecuente
      de los excursionistas hacia Maglić, de 2386 metros.
    wildlife: >-
      En el parque de Sutjeska, al que Bioč llega en parte, laderas noroccidentales de bosque denso de
      coníferas y haya llegan hasta los 1.600 metros; por encima hay pastos en las mesetas. En su lado bosnio,
      el bosque primigenio de Perućica, al pie de Maglić, nunca ha sido talado y algunos árboles tienen 300
      años.


      Del parque se han avistado el [oso pardo](/especie/ursus_arctos/), el
      [rebeco](/especie/rupicapra_rupicapra/), el jabalí, el [lobo](/especie/canis_lupus/), la marta, el gato
      montés y el zorro, sobre todo en los bosques de Perućica. Tiene más de 300 especies de aves en sus lagos
      y humedales, y en Perućica se citan el [águila real](/especie/aquila_chrysaetos/), el halcón peregrino y
      la perdiz griega, además de un tetraónido.
    visit: >-
      Bioč se contempla sobre todo desde sus vecinas: desde Maglić se ven Volujak, Bioč, el lago Trnovačko y
      Durmitor, y desde Volujak se ve Bioč junto a Maglić, Durmitor, Lebršnik y Zelengora. Bioč, como Vlasulja
      y Lebršnik, queda fuera del alcance del excursionista corriente.
    history: >-
      El Parque Nacional de Sutjeska se cierra por el sureste con las montañas Maglić, Volujak y Bioč, y
      Volujak se apoya en Bioč, ya en Montenegro. El Sutjeska separa Zelengora de las tres.
    before: >-
      El lago Trnovačko es a menudo el punto de partida de los excursionistas hacia estas montañas. El bloque
      queda a caballo de la frontera entre Montenegro y Bosnia y Herzegovina.
    around: >-
      A unos dos kilómetros están el [Parque Nacional Durmitor - Cañón del Río
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) y el [Parque Nacional Durmitor - Macizo
      Montañoso](/lugar/nacionalni-park-durmitor---masiv/), y a veintiséis la [Meseta Kárstica de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  en:
    intro: >-
      In north-western Montenegro rise four mountains that lack a shared collective name, despite forming a
      single geological and geomorphological unit centred on a lake: Trnovačko. They are Bioč, Maglić,
      Volujak, and Vlasulja, with Bioč enclosing the group to the south-east. Its highest peak, Veliki Vitao
      (also called Vitlovi), is the loftiest summit in the entire complex. The massif straddles the border
      between Montenegro and Bosnia and Herzegovina, falling partly within Sutjeska National Park.
    landscape: >-
      The boundaries of this mountain group are carved by three valleys: the Piva canyon to the east, the
      Sutjeska valley to the north and west, and the Vrbnica to the south. Between them, the scenery shifts
      abruptly: gravel bars, stepped green pastures, narrow defiles, sheer limestone plateaus, and glacial
      cirques. Through the Sutjeska valley, which divides Zelengora from Maglić, Volujak, and Bioč, the river
      has carved a canyon 1200 metres deep.


      At the heart of the massif lies Trnovačko Lake at 1517 metres, an emerald-turquoise tarn 700 metres long
      and 400 wide, ringed by peaks exceeding 2000 metres: Maglić, Bioč, Volujak, Vlasulja, and Trnovački
      Durmitor. Highly likely of glacial origin, it is fed by waters descending from Maglić, Volujak, and
      Bioč. In winter it typically freezes solid, and heavy snowfields linger well into summer. It serves as
      the standard trail hub for hikers tackling Maglić at 2386 metres.
    wildlife: >-
      In Sutjeska National Park, where Bioč partly extends, north-western slopes of dense fir, spruce, and
      beech forest reach up to 1600 metres, giving way above to open high-altitude karst pastures. On the
      Bosnian side, the virgin primeval forest of Perućica at the foot of Maglić has never seen commercial
      felling, with monumental trees over 300 years old.


      Within the park, [brown bears](/especie/ursus_arctos/), [chamois](/especie/rupicapra_rupicapra/), wild
      boar, [wolves](/especie/canis_lupus/), pine martens, wildcats, and red foxes have all been recorded,
      primarily in Perućica. More than 300 bird species frequent its wetlands and tarns, and in Perućica
      naturalists report [golden eagles](/especie/aquila_chrysaetos/), peregrine falcons, rock partridges, and
      capercaillie.
    visit: >-
      Bioč is primarily admired from adjacent summits: standing on Maglić reveals Volujak, Bioč, Trnovačko
      Lake, and Durmitor; from Volujak one surveys Bioč alongside Maglić, Durmitor, Lebršnik, and Zelengora.
      Bioč itself, much like Vlasulja and Lebršnik, remains rugged backcountry outside the scope of casual
      hikers.
    history: >-
      Sutjeska National Park is bounded on the south-east by Maglić, Volujak, and Bioč; Volujak abuts Bioč as
      the terrain transitions into Montenegro. The Sutjeska river separates Zelengora from these three peaks.
    before: >-
      Trnovačko Lake frequently serves as the basecamp for alpine ascents in this group. The mountain massif
      lies directly across the international frontier separating Montenegro from Bosnia and Herzegovina.
    around: >-
      Roughly two kilometres away lie [Durmitor National Park - Tara River
      Canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/) and [Durmitor National Park - Mountain
      Massif](/lugar/nacionalni-park-durmitor---masiv/), while twenty-six kilometres distant extends the
      [Sinjajevina Karst Plateau](/lugar/sinjajevina-karst-plateau/).
  fr:
    intro: >-
      Au nord-ouest du Monténégro s’élèvent quatre montagnes sans nom d’ensemble officiel, formant pourtant
      une entité géologique et géomorphologique unique ordonnée autour d’un lac : le Trnovačko. Il s’agit du
      Bioč, du Maglić, du Volujak et de la Vlasulja ; le Bioč verrouille le massif au sud-est. Son point
      culminant, le Veliki Vitao (ou Vitlovi), domine l’ensemble du massif. Le relief se partage entre le
      Monténégro et la Bosnie-Herzégovine, s’étendant en partie sur le parc national de Sutjeska.
    landscape: >-
      Ce groupe montagneux est délimité par trois vallées : le canyon de la Piva à l’est, la vallée de la
      Sutjeska au nord et à l’ouest, et celle de la Vrbnica au sud. Entre ces cours d’eau, le relief varie
      constamment : bancs de graviers, gradins herbeux étagés, gorges étroites, crêtes calcaires ruiniformes
      et cirques glaciaires. Dans la vallée de la Sutjeska, qui sépare la Zelengora du groupe
      Maglić-Volujak-Bioč, la rivière a creusé des gorges atteignant 1200 mètres de profondeur.


      Au centre du massif scintille le lac Trnovačko à 1517 mètres d’altitude, nappe aux reflets turquoise
      longue de 700 mètres et large de 400 mètres, encadrée de cimes dépassant 2000 mètres : Maglić, Bioč,
      Volujak, Vlasulja et Trnovački Durmitor. D’origine glaciaire, il recueille les eaux issues des névés
      environnants. En hiver, la surface gèle totalement et les congères persistent jusqu’à l’été. C’est le
      point de départ privilégié pour gravir le Maglić et ses 2386 mètres.
    wildlife: >-
      Dans le parc de Sutjeska, auquel le Bioč se rattache en partie, les versants nord-ouest couverts
      d’épaisses forêts de sapins, d’épicéas et de hêtres montent jusqu’à 1600 mètres d’altitude, avant de
      céder la place aux pelouses alpines. Côté bosnien, la forêt primaire de Perućica, au pied du Maglić, n’a
      jamais subi d’exploitation sylvicole et compte des arbres vieux de 300 ans.


      Le parc abrite [l’ours brun](/especie/ursus_arctos/), le [chamois](/especie/rupicapra_rupicapra/), le
      sanglier, le [loup gris](/especie/canis_lupus/), la martre des pins, le chat sauvage et le renard roux,
      particulièrement dans les boisements de Perućica. Plus de 300 espèces d’oiseaux fréquentent ces zones
      humides montagnardes ; à Perućica sont signalés [l’aigle royal](/especie/aquila_chrysaetos/), le faucon
      pèlerin, la perdrix bartavelle et le grand tétras.
    visit: >-
      Le Bioč s’admire principalement depuis les cimes voisines : du sommet du Maglić, le regard embrasse le
      Volujak, le Bioč, le lac Trnovačko et le Durmitor ; depuis le Volujak apparaissent le Bioč, le Maglić,
      le Durmitor, le Lebršnik et la Zelengora. Le Bioč, tout comme la Vlasulja et le Lebršnik, reste un
      terrain d’aventure austère réservé aux alpinistes aguerris.
    history: >-
      Le parc national de Sutjeska s’achève au sud-est sur les crêtes du Maglić, du Volujak et du Bioč ; le
      Volujak s’appuie directement sur le Bioč en franchissant la frontière monténégrine. La vallée de la
      Sutjeska isole la Zelengora de cette trilogie calcaire.
    before: >-
      Le lac Trnovačko sert fréquemment de camp de base aux randonneurs qui abordent ces montagnes. Le massif
      s’étend à cheval sur la frontière internationale entre le Monténégro et la Bosnie-Herzégovine.
    around: >-
      À deux kilomètres se trouvent le [parc national du Durmitor - canyon de la
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) et le [parc national du Durmitor - massif
      montagneux](/lugar/nacionalni-park-durmitor---masiv/), tandis qu’à vingt-six kilomètres s’étend le
      [plateau karstique de la Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  de:
    intro: >-
      Im Nordwesten Montenegros erheben sich vier Berge ohne gemeinsamen Oberbegriff, die jedoch eine
      geologische Einheit mit dem Trnovačko-See im Zentrum bilden. Es sind Bioč, Maglić, Volujak und Vlasulja;
      Bioč schließt die Gruppe nach Südosten ab. Sein höchster Gipfel, Veliki Vitao (auch Vitlovi genannt),
      überragt alle anderen Gipfel des Massivs. Der Gebirgsstock teilt sich zwischen Montenegro und Bosnien
      und Herzegowina auf und reicht teilweise in den Nationalpark Sutjeska hinein.
    landscape: >-
      Die Grenzen dieser Gebirgsgruppe markieren drei Täler: der Piva-Canyon im Osten, das Sutjeska-Tal im
      Norden und Westen sowie das Vrbnica-Tal im Süden. Dazwischen wechselt die Hochgebirgslandschaft ständig:
      Schotterbänke, gestufte Grashänge, enge Schluchten, verkarstete Steilwände und eiszeitliche Karräume. Im
      Sutjeska-Tal, das die Zelengora von Maglić, Volujak und Bioč trennt, hat der Fluss eine 1200 Meter tiefe
      Schlucht gegraben.


      Im Mittelpunkt des Massivs liegt der Trnovačko-See auf 1517 Metern Höhe, ein blaugrünes Gewässer von 700
      Metern Länge und 400 Metern Breite, umrahmt von Gipfeln über 2000 Metern Höhe: Maglić, Bioč, Volujak,
      Vlasulja und Trnovački Durmitor. Der See ist glazialen Ursprungs und speist sich aus dem Schmelzwasser
      der Kare. Im Winter friert er komplett zu, Altschneefelder halten sich oft bis in den Hochsommer. Er ist
      beliebter Ausgangspunkt für die Besteigung des 2386 Meter hohen Maglić.
    wildlife: >-
      Im Nationalpark Sutjeska, zu dem Bioč anteilig gehört, reichen dichte Tannen-, Fichten- und Buchenwälder
      an den Nordwesthängen bis auf 1600 Meter Höhe hinauf; darüber erstrecken sich Almmatten. Auf bosnischer
      Seite wurde der Urwald Perućica am Fuße des Maglić niemals gerodet; etliche Baumriesen sind über 300
      Jahre alt.


      Im Nationalparkgebiet wurden [Braunbär](/especie/ursus_arctos/), [Gämse](/especie/rupicapra_rupicapra/),
      Wildschwein, [Wolf](/especie/canis_lupus/), Baummarder, Wildkatze und Rotfuchs nachgewiesen, vor allem
      im Schutzgebiet Perućica. Über 300 Vogelarten beleben die Gewässer und Feuchtgebiete; in Perućica brüten
      [Steinadler](/especie/aquila_chrysaetos/), Wanderfalke, Steinhuhn und Auerhuhn.
    visit: >-
      Den Bioč betrachtet man vor allem von den Nachbargipfeln: Vom Maglić aus blickt man auf Volujak, Bioč,
      den Trnovačko-See und das Durmitor-Gebirge; vom Volujak aus überblickt man Bioč neben Maglić, Durmitor,
      Lebršnik und Zelengora. Bioč selbst bleibt wie Vlasulja und Lebršnik anspruchsvolles Gelände abseits
      normaler Wanderwege.
    history: >-
      Der Nationalpark Sutjeska grenzt im Südosten an die Bergmassive Maglić, Volujak und Bioč; der Volujak
      geht auf montenegrinischem Gebiet direkt in den Bioč über. Das Tal der Sutjeska trennt die Zelengora von
      dieser Berggruppe.
    before: >-
      Der Trnovačko-See dient Bergsteigern häufig als Basislager für Touren in diesem Gebiet. Das Bergmassiv
      liegt direkt auf der Landesgrenze zwischen Montenegro und Bosnien und Herzegowina.
    around: >-
      Rund zwei Kilometer entfernt liegen der [Nationalpark Durmitor -
      Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/) und das [Nationalpark Durmitor -
      Bergmassiv](/lugar/nacionalni-park-durmitor---masiv/), sechsundzwanzig Kilometer weiter südöstlich die
      [Sinjajevina-Karsthochfläche](/lugar/sinjajevina-karst-plateau/).
  it:
    intro: >-
      Nel nord-ovest del Montenegro sorgono quattro montagne prive di un nome collettivo ufficiale, pur
      formando una sola unità geologica e geomorfologica raccolta attorno a uno specchio d’acqua: il lago
      Trnovačko. Sono Bioč, Maglić, Volujak e Vlasulja; il Bioč chiude il gruppo a sud-est. La sua vetta
      culminante, Veliki Vitao (detta anche Vitlovi), è la più elevata dell’intero gruppo. Il massiccio si
      divide tra Montenegro e Bosnia ed Erzegovina, rientrando in parte nel Parco Nazionale di Sutjeska.
    landscape: >-
      I confini di questo gruppo montuoso sono tracciati da tre vallate: il canyon della Piva a est, la valle
      della Sutjeska a nord e a ovest e quella della Vrbnica a sud. Tra questi solchi il paesaggio muta a ogni
      passo: greti ghiaiosi, terrazzi pascolivi, gole scoscese, bancate calcaree e circhi glaciali. Nella
      valle della Sutjeska, che separa Zelengora da Maglić, Volujak e Bioč, le acque hanno inciso una gola
      profonda 1200 metri.


      Nel cuore del massiccio giace il lago Trnovačko a 1517 metri di quota, bacino dalle acque azzurro-verdi
      lungo 700 metri e largo 400, cinto da vette che superano i 2000 metri: Maglić, Bioč, Volujak, Vlasulja e
      Trnovački Durmitor. Di origine glaciale, raccoglie le acque che scendono dalle conche sommitali. In
      inverno gela completamente e i nevai possono resistere fino all’estate. È la base di partenza più comune
      per scalare il Maglić, a quota 2386 metri.
    wildlife: >-
      Nel parco di Sutjeska, a cui il Bioč appartiene parzialmente, i versanti nord-occidentali coperti da
      fitte foreste di conifere e faggi risalgono fino a 1600 metri, lasciando spazio a praterie alpine
      sommitali. Sul lato bosniaco, la foresta primaria di Perućica ai piedi del Maglić non è mai stata
      disboscata e ospita alberi monumentali di 300 anni.


      Nel parco sono segnalati [l’orso bruno](/especie/ursus_arctos/), il
      [camoscio](/especie/rupicapra_rupicapra/), il cinghiale, il [lupo](/especie/canis_lupus/), la martora,
      il gatto selvatico e la volpe, soprattutto nei boschi di Perućica. Più di 300 specie di uccelli popolano
      laghi e zone umide; a Perućica nidificano [l’aquila reale](/especie/aquila_chrysaetos/), il falco
      pellegrino, la coturnice e il gallo cedrone.
    visit: >-
      Il Bioč si ammira principalmente dalle cime circostanti: dal Maglić lo sguardo spazia su Volujak, Bioč,
      il lago Trnovačko e il Durmitor; dal Volujak si scorgono il Bioč insieme a Maglić, Durmitor, Lebršnik e
      Zelengora. Il Bioč, come Vlasulja e Lebršnik, resta un terreno impervio fuori dalla portata
      dell’escursionismo ordinario.
    history: >-
      Il Parco Nazionale di Sutjeska è delimitato a sud-est dalle vette di Maglić, Volujak e Bioč; il Volujak
      si salda al Bioč entrando in territorio montenegrino. La gola della Sutjeska isola la Zelengora da
      questo blocco calcareo.
    before: >-
      Il lago Trnovačko è la base di partenza prediletta dagli escursionisti verso queste cime. Il massiccio
      si sviluppa a cavallo della linea di confine tra Montenegro e Bosnia ed Erzegovina.
    around: >-
      A circa due chilometri si trovano il [Parco Nazionale Durmitor - Canyon del Fiume
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e il [Parco Nazionale Durmitor - Massiccio
      Montuoso](/lugar/nacionalni-park-durmitor---masiv/), mentre a ventisei chilometri si estende
      [l’Altopiano Carsico di Sinjajevina](/lugar/sinjajevina-karst-plateau/).
  pt:
    intro: >-
      No noroeste de Montenegro erguem-se quatro montanhas sem designação conjunta oficial, embora formem uma
      unidade geológica e geomorfológica indivisível articulada em torno de um lago: o Trnovačko. Trata-se de
      Bioč, Maglić, Volujak e Vlasulja, cabendo ao Bioč fechar o conjunto a sudeste. O seu ponto mais alto,
      Veliki Vitao (também denominado Vitlovi), constitui o pico mais elevado de todo o maciço. A cordilheira
      reparte-se entre o Montenegro e a Bósnia e Herzegovina, integrando em parte o Parque Nacional de
      Sutjeska.
    landscape: >-
      Os limites deste grupo montanhoso são traçados por três vales fluviais: o desfiladeiro do Piva a leste,
      o vale do Sutjeska a norte e a oeste e o do Vrbnica a sul. Entre eles a paisagem alterna a cada passo:
      bancos de cascalho, socalcos de pastagens verdejantes, gargantas estreitas, cristas calcárias e circos
      glaciares. No vale do Sutjeska, que separa Zelengora de Maglić, Volujak e Bioč, o rio escavou um
      desfiladeiro de 1200 metros de profundidade.


      No centro do maciço repousa o lago Trnovačko a 1517 metros de altitude, com águas azul-turquesa
      estendendo-se por 700 metros de comprimento e 400 de largura, rodeado por picos que superam os 2000
      metros: Maglić, Bioč, Volujak, Vlasulja e Trnovački Durmitor. De génese glaciar, alimenta-se do degelo
      das cumeadas vizinhas. No inverno gela na totalidade e os campos de neve resistem até ao verão. É o
      ponto de partida habitual para a ascensão ao Maglić, aos 2386 metros.
    wildlife: >-
      No Parque Nacional de Sutjeska, ao qual o Bioč pertence parcialmente, as encostas noroeste cobertas por
      densas matas de coníferas e faias sobem até aos 1600 metros de altitude, dando lugar a pastagens
      alpinas. No lado bósnio, a floresta primária de Perućica no sopé do Maglić nunca sofreu corte comercial
      e alberga árvores centenárias com 300 anos.


      No parque foram confirmados o [urso-pardo](/especie/ursus_arctos/), o
      [camurça](/especie/rupicapra_rupicapra/), o javali, o [lobo](/especie/canis_lupus/), a marta, o
      gato-bravo e a raposa, com destaque para a reserva integral de Perućica. Mais de 300 espécies de aves
      habitam as zonas húmidas e lagoas; em Perućica nidificam a [águia-real](/especie/aquila_chrysaetos/), o
      falcão-peregrino, a perdiz-mourisca e o tetraz.
    visit: >-
      O Bioč contempla-se sobretudo a partir dos cumes vizinhos: do Maglić avistam-se o Volujak, o Bioč, o
      lago Trnovačko e o Durmitor; do Volujak avista-se o Bioč junto ao Maglić, Durmitor, Lebršnik e
      Zelengora. O Bioč, tal como Vlasulja e Lebršnik, permanece um terreno agreste inacessível ao
      excursionista casual.
    history: >-
      O Parque Nacional de Sutjeska confina a sudeste com os maciços de Maglić, Volujak e Bioč; o Volujak
      apoia-se no Bioč ao passar para o território montenegrino. O rio Sutjeska separa Zelengora desta
      imponente barreira calcária.
    before: >-
      O lago Trnovačko funciona como acampamento de eleição para os montanhistas nesta região. O maciço
      ergue-se sobre a linha de fronteira entre o Montenegro e a Bósnia e Herzegovina.
    around: >-
      A cerca de dois quilómetros encontram-se o [Parque Nacional Durmitor - Desfiladeiro do Rio
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e o [Parque Nacional Durmitor - Maciço
      Montanhoso](/lugar/nacionalni-park-durmitor---masiv/), e a vinte e seis estende-se o [Planalto Cársico
      de Sinjajevina](/lugar/sinjajevina-karst-plateau/).
