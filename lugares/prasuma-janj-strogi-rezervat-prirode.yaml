unico:
  es: Un bosque virgen de haya, abeto y pícea sobre dolomía, de acceso restringido, en las montañas dináricas.
  en: A primeval forest of beech, fir, and spruce on dolomite, under restricted access, in the Dinaric Alps.
  fr: >-
    Une forêt vierge de hêtre, sapin et épicéa sur roche dolomitique, à l’accès très restreint, dans les Alpes
    dinariques.
  de: Ein streng regulierter Urwald aus Rotbuche, Tanne und Fichte auf Dolomitgestein im Dinarischen Gebirge.
  it: >-
    Una foresta vergine di faggio, abete e abete rosso su dolomia, ad accesso regolamentato, nelle Alpi
    Dinariche.
  pt: Uma floresta virgem de faia, abeto e espruce sobre dolomite, de acesso condicionado, nos Alpes Dináricos.
observaciones:
  es: >-
    No se puede entrar sin autorización previa del gestor ni sin guía. La fotografía y las grabaciones de
    sonido y vídeo dentro de la reserva también necesitan autorización previa. No hay un edificio de recepción
    abierto al público: las gestiones se hacen con el gestor.
texto:
  es:
    intro: >-
      En Janj no se entra por la puerta de casa: se pide permiso, y entras con un guarda que custodia el
      bosque. La razón es sencilla. Esta reserva natural estricta, de categoría Ia de la IUCN, ocupa las
      laderas occidentales del monte Stolovaš, en el municipio de Šipovo, en República Srpska, y casi todo el
      componente protegido es bosque virgen. Entre 1.180 y 1.510 metros de altitud, haya, abeto y pícea forman
      un bosque que se cuida dejándolo en paz. Es uno de los componentes del bien de la UNESCO de los hayedos
      primarios que la UNESCO protege en varias regiones de Europa.
    landscape: >-
      Casi 300 hectáreas forman el área central, rodeadas por una zona tampón de 380 hectáreas. El suelo es de
      dolomía del Triásico, y sobre ella se han formado rendzinas, suelos pardos y lignohumus. El clima es de
      montaña, y en él chocan masas de aire marítimas y continentales.


      Con esa base crecen los bosques dináricos, ilirios y altimontanos de haya, abeto y pícea que dominan el
      área. Es un paisaje de árboles grandes y de transiciones: una pequeña superficie de pino blanco y pícea
      representa una fase de sucesión de la vegetación, es decir, un capítulo más del libro en el que el
      bosque va reescribiéndose.


      Al pie de los árboles, el inventario del gestor cita el lirio martagón (Lilium martagon), la Gentiana
      asclepiadea y la campanilla de invierno (Galanthus nivalis), entre otras plantas.
    wildlife: >-
      El inventario del gestor enumera la fauna del bosque. Entre los mamíferos aparecen el armiño, el corzo,
      el zorro, la [marta](/especie/martes_martes/), la ardilla, el lirón gris, la liebre y el jabalí; y,
      entre los grandes, el lince, el lobo y el oso pardo.


      Las aves completan el cuadro: el urogallo, las grévoles, los azores, los halcones peregrinos y la paloma
      torcaz.


      Nada de esto viene con fecha ni lugar de observación: son listas de lo que habita el bosque, no un
      calendario. Lo que sí se sabe de la visita es que se hace con un guarda, y que es él quien conoce el
      bosque.
    visit: >-
      Los visitantes solo pueden moverse por el área protegida con la autorización previa del gestor y
      acompañados por un guía, el guarda de la Prašuma Janj. Las visitas organizadas se hacen en grupos de
      hasta 20 participantes, con la supervisión de un guía.


      Las actividades educativas, como las escuelas en la naturaleza, las clases de campo, los seminarios y
      las excursiones especializadas, deben notificarse con tiempo al gestor. Las poblaciones más próximas son
      Pribeljci, Podobzir y Babići.
    history: >-
      En 1910 se redactó el primer documento de ordenación del territorio al que pertenece la reserva. En 1951
      Janj fue declarado reserva de bosque primario, y en 1954 se protegió como objeto de investigación
      científica y rareza natural. La reserva la gestiona ŠG Gorica, con sede en Šipovo y administración
      forestal en Novo Selo, y la evaluación ambiental del gobierno registra para Janj un plan de gestión
      2014–2029.


      La amenaza viene de fuera del límite: el gestor advierte de un aprovechamiento forestal intensivo junto
      al borde oriental, al otro lado de la frontera entre entidades.
    before: >-
      No se puede entrar sin autorización previa del gestor ni sin guía. La fotografía y las grabaciones de
      sonido y vídeo dentro de la reserva también necesitan autorización previa. No hay un edificio de
      recepción abierto al público: las gestiones se hacen con el gestor.
    around: >-
      Janj no tiene vecinos cercanos en el atlas, pero sí lugares afines. El [Parcul Național
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/) comparte el armiño, la marta y el urogallo.
      El [Parcul Național Defileul Jiului - Codrii
      seculari](/lugar/parcul-national-defileul-jiului-codrii-seculari/) coincide en el Galanthus nivalis, el
      azor y el halcón peregrino, además del bosque primario. La [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) suma el azor y la marta, de nuevo en
      bosque primario. Y el [Totes Gebirge - Karst Desert](/lugar/totes-gebirge---karst-desert/) comparte el
      grévol, el urogallo y el oso pardo.
  en:
    intro: >-
      You do not simply stroll into Janj: you request prior permission, and you enter alongside a forest
      ranger tasked with safeguarding it. The reason is elementary. This strict nature reserve, classified
      under IUCN Category Ia, blankets the western slopes of Mount Stolovaš in the municipality of Šipovo,
      within Republika Srpska, and nearly the entire protected enclave consists of virgin old-growth forest.
      Between 1,180 and 1,510 metres above sea level, European beech, silver fir, and Norway spruce form a
      forest ecosystem looked after purely by being left alone. It stands as a vital component part of the
      serial UNESCO primeval beech forests property safeguarded across multiple regions of Europe.
    landscape: >-
      Nearly 300 hectares constitute the core area, enveloped by a protective buffer zone of 380 hectares. The
      underlying bedrock consists of Triassic dolomite, which has weathered over millennia into rendzinas,
      brown forest soils, and thick lignohumus layers. The climate is montane, where moist maritime air masses
      collide directly with harsher continental weather fronts.


      Upon this geological foundation flourish the Dinaric, Illyrian, and high-montane beech, fir, and spruce
      woods that dominate the landscape. It is a world of towering veteran trees and natural ecological
      transitions: a modest stand of Scots pine and spruce illustrates a distinctive successional phase,
      another chapter in the unwritten book through which the virgin forest constantly renews itself.


      Beneath the sheltering boughs, official botanical inventories record the martagon lily (Lilium
      martagon), willow gentian (Gentiana asclepiadea), and common snowdrop (Galanthus nivalis), among diverse
      herbaceous plants.
    wildlife: >-
      Management records document the rich faunal communities of the forest. Resident mammals include the
      stoat, roe deer, red fox, [European pine marten](/especie/martes_martes/), red squirrel, edible
      dormouse, European hare, and wild boar; among apex predators, Eurasian lynx, grey wolf, and brown bear
      roam the massif.


      Forest birds complete this intact wilderness community: western capercaillie, hazel grouse, northern
      goshawk, peregrine falcon, and common wood pigeon nest within the old timber.


      None of these records come tied to fixed sightings or predictable calendars: they represent
      comprehensive inventories of what lives within this wild refuge. What is known with certainty is that
      visiting occurs solely alongside an official ranger, whose intimate knowledge guides every step through
      the woods.
    visit: >-
      Visitors may move within the protected area only with advance written authorization from the managing
      authority and accompanied by an official guide—the designated ranger of Prašuma Janj. Organized group
      visits are restricted to a maximum of 20 participants, conducted under strict ranger supervision.


      Educational activities, such as environmental field schools, nature study groups, seminars, and
      specialized field trips, require early notification and scheduling with the reserve management. The
      nearest rural settlements are Pribeljci, Podobzir, and Babići.
    history: >-
      In 1910 foresters drew up the earliest formal land management plan encompassing this territory. In 1951
      Janj was officially designated a primeval forest reserve, and in 1954 it was placed under statutory
      legal protection as an object of scientific research and a rare natural monument. The reserve is managed
      by ŠG Gorica, headquartered in Šipovo with local forest administration based in Novo Selo, and the state
      environmental assessment records an operative management plan spanning 2014–2029.


      The principal ecological threat originates outside the boundary line: park authorities warn of intensive
      industrial logging taking place directly along the eastern perimeter, just across the inter-entity
      administrative boundary.
    before: >-
      Entering without prior written permission from the reserve authority or without an official ranger guide
      is strictly prohibited. Photography, video recording, and audio capturing within the reserve likewise
      require prior official authorization. There is no public visitor reception building on site: all formal
      arrangements must be coordinated in advance with the managing enterprise.
    around: >-
      Janj has no contiguous neighbours within the atlas, yet it shares strong ecological kinship with several
      wild massifs. [Parcul Național Retezat](/lugar/parcul-national-retezat---masivul-muntos/) shares the
      stoat, pine marten, and capercaillie. [Parcul Național Defileul Jiului - Codrii
      seculari](/lugar/parcul-national-defileul-jiului-codrii-seculari/) coincides in Galanthus nivalis,
      northern goshawk, and peregrine falcon within primeval woods. [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) adds the goshawk and pine marten in
      virgin beech habitats. And [Totes Gebirge - Karst Desert](/lugar/totes-gebirge---karst-desert/) shares
      the hazel grouse, capercaillie, and brown bear.
  fr:
    intro: >-
      À Janj, on n'entre pas comme dans un moulin : il faut obtenir une autorisation préalable et cheminer aux
      côtés d'un garde forestier veilleur des lieux. La raison en est limpide. Cette réserve naturelle
      intégrale de catégorie Ia de l'UICN occupe les flancs occidentaux du mont Stolovaš, sur la commune de
      Šipovo en République serbe de Bosnie, et la quasi-totalité de son périmètre est constituée de forêt
      vierge. Entre 1 180 et 1 510 mètres d'altitude, hêtres, sapins et épicéas tissent un écosystème
      forestier préservé par la seule absence de perturbation humaine. Elle figure parmi les éléments
      constitutifs du bien sériel des forêts primaires de hêtres que l'UNESCO protège à travers plusieurs
      régions d'Europe.
    landscape: >-
      Près de 300 hectares forment la zone centrale intégrale, ceinturée par une zone tampon de 380 hectares.
      Le sous-sol est fait de dolomies triasiques qui ont engendré des rendzines, des sols bruns et des
      horizons d'humus forestier épais. Le climat montagnard voit s'affronter masses d'air maritimes et
      influences continentales rigoureuses.


      Sur ce socle géologique prospèrent les forêts dinariques, illyriennes et altimontagnardes de hêtres,
      sapins et épicéas qui caractérisent le massif. C'est un paysage d'arbres majestueux et de continuités
      écologiques : un petit peuplement de pin sylvestre et d'épicéa illustre un stade pionnier de succession
      végétale, simple chapitre d'un cycle naturel où le peuplement se réécrit sans cesse.


      Au pied des grands fûts, les inventaires de la réserve signalent le lis martagon (Lilium martagon), la
      gentiane asclépiade (Gentiana asclepiadea) et le perce-neige (Galanthus nivalis), entre autres taxons
      forestiers.
    wildlife: >-
      L'inventaire officiel détaille la richesse biologique des lieux. Parmi les mammifères forestiers sont
      recensés l'hermine, le chevreuil, le renard roux, la [martre des pins](/especie/martes_martes/),
      l'écureuil roux, le loir gris, le lièvre d'Europe et le sanglier ; parmi les prédateurs majeurs figurent
      le lynx, le loup et l'ours brun.


      L'avifaune complète ce tableau sylvestre : grand tétras, gélinotte des bois, autour des palombes, faucon
      pèlerin et pigeon ramier peuplent les vieux boisements.


      Aucune de ces mentions ne s'assortit de dates d'observation préétablies : ce sont des inventaires de la
      biodiversité locale, non un calendrier touristique. La seule certitude lors de la visite réside dans la
      présence du garde, qui connaît intimement chaque recoin du massif.
    visit: >-
      Les visiteurs ne peuvent circuler dans le périmètre protégé qu'avec l'accord préalable de l'organisme
      gestionnaire et impérativement guidés par le garde assermenté de la Prašuma Janj. Les sorties
      accompagnées s'effectuent en groupes limités à 20 personnes au maximum, sous encadrement officiel.


      Les activités pédagogiques, telles que classes vertes, stages de terrain, colloques et excursions
      spécialisées, doivent faire l'objet d'une demande anticipée auprès de la direction. Les localités
      rurales les plus proches sont Pribeljci, Podobzir et Babići.
    history: >-
      C'est en 1910 que fut rédigé le tout premier plan d'aménagement forestier couvrant ce territoire. En
      1951, Janj fut déclaré réserve de forêt primaire, avant d'être classé en 1954 au titre de la recherche
      scientifique et des raretés naturelles. La réserve est administrée par l'entreprise forestière ŠG
      Gorica, sise à Šipovo avec gestion locale à Novo Selo, et l'évaluation environnementale d'État mentionne
      un plan de gestion courant sur 2014–2029.


      La menace la plus tangible provient de l'extérieur des limites : le gestionnaire alerte sur des coupes
      de bois intensives menées en bordure orientale, de l'autre côté de la frontière administrative
      inter-entités.
    before: >-
      L'accès sans autorisation formelle du gestionnaire et sans guide officiel est strictement interdit. La
      prise de photographies ainsi que les enregistrements sonores et vidéos requièrent également une dispense
      écrite préalable. Il n'existe aucun bâtiment d'accueil ouvert au public : l'ensemble des démarches
      s'effectue directement auprès de la direction.
    around: >-
      Janj ne compte pas de voisins immédiats dans l'atlas, mais possède de proches correspondances
      écologiques. Le [Parcul Național Retezat](/lugar/parcul-national-retezat---masivul-muntos/) partage
      l'hermine, la martre des pins et le grand tétras. Le [Parcul Național Defileul Jiului - Codrii
      seculari](/lugar/parcul-national-defileul-jiului-codrii-seculari/) réunit Galanthus nivalis, l'autour
      des palombes et le faucon pèlerin au sein d'une forêt primaire. La [Národní přírodní rezervace
      Jizerskohorské bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) associe l'autour et la
      martre en hêtraie ancienne. Et le [Totes Gebirge - Karst Desert](/lugar/totes-gebirge---karst-desert/)
      rassemble la gélinotte des bois, le grand tétras et l'ours brun.
  de:
    intro: >-
      Janj betritt man nicht durch die offene Tür: Man benötigt eine behördliche Genehmigung und wandert in
      Begleitung eines Försters, der den Urwald hütet. Der Grund ist einleuchtend. Dieses strenge
      Naturreservat der IUCN-Kategorie Ia bedeckt die Westhänge des Berges Stolovaš in der Gemeinde Šipovo in
      der Republika Srpska, und nahezu die gesamte Fläche besteht aus echtem Primärwald. Zwischen 1.180 und
      1.510 Metern Seehöhe bilden Rotbuche, Tanne und Fichte ein Waldgefüge, dessen bester Schutz darin
      besteht, es vollkommen in Ruhe zu lassen. Es bildet einen Teilbereich des UNESCO-Weltnaturerbes der
      Buchenurwälder, die in mehreren Regionen Europas geschützt sind.
    landscape: >-
      Fast 300 Hektar bilden die Kernzone, umgeben von einer 380 Hektar großen Pufferzone. Der Untergrund
      besteht aus triassischem Dolomit, auf dem sich Rendzinen, Braunerden und tiefgründiger Lignohumus
      gebildet haben. Das Bergklima wird vom Aufeinandertreffen maritimer Luftströmungen und kontinentaler
      Wetterlagen geprägt.


      Auf dieser Grundlage gedeihen die dinarischen, illyrischen und hochmontanen Buchen-, Tannen- und
      Fichtenwälder des Gebiets. Es ist eine Waldlandschaft mächtiger Baumveteranen und dynamischer Übergänge:
      Eine kleine Fläche mit Waldkiefer und Fichte markiert ein Sukzessionsstadium – ein weiteres Kapitel in
      der steten Selbsterneuerung des Urwalds.


      Am Fuß der Baumriesen verzeichnet das botanische Inventar der Parkverwaltung unter anderem
      Türkenbund-Lilie (Lilium martagon), Schwalbenwurz-Enzian (Gentiana asclepiadea) und Schneeglöckchen
      (Galanthus nivalis).
    wildlife: >-
      Das Schutzgebietsinventar belegt die artenreiche Tierwelt des Urwalds. Unter den Säugetieren leben hier
      Hermelin, Reh, Rotfuchs, [Baummarder](/especie/martes_martes/), Eichhörnchen, Siebenschläfer, Feldhase
      und Wildschwein; an großen Beutegreifern streifen Luchs, Wolf und Braunbär durch das Massiv.


      Die Vogelwelt vervollständigt das Ökosystem: Auerhuhn, Haselhuhn, Habicht, Wanderfalke und Ringeltaube
      brüten in den alten Baumbeständen.


      Diese Nennungen sind als Artenverzeichnis des Urwalds zu verstehen, nicht als terminierter
      Beobachtungskalender. Sicher ist beim Besuch nur eines: Man erkundet den Wald mit einem staatlichen
      Ranger, der die Pfade und Eigenheiten der Wildnis genau kennt.
    visit: >-
      Besucher dürfen sich im Schutzgebiet ausschließlich mit vorheriger Genehmigung der Verwaltung und in
      ständiger Begleitung des zuständigen Rangers der Prašuma Janj bewegen. Organisierte Führungen sind auf
      Gruppen von maximal 20 Personen begrenzt.


      Bildungsveranstaltungen wie Waldschulen, Freilandseminare, Fachtagungen und wissenschaftliche
      Exkursionen müssen frühzeitig bei der Forstverwaltung angemeldet werden. Die nächstgelegenen Ortschaften
      sind Pribeljci, Podobzir und Babići.
    history: >-
      Im Jahr 1910 entstand das erste forstliche Bewirtschaftungsdokument für dieses Gebiet. 1951 wurde Janj
      zum Urwaldreservat erklärt und 1954 als Objekt wissenschaftlicher Forschung und Naturdenkmal unter
      Schutz gestellt. Verwaltet wird das Areal vom Forstbetrieb ŠG Gorica mit Sitz in Šipovo und Außenstelle
      in Novo Selo; die Umweltprüfung des Ministeriums dokumentiert für Janj einen Managementplan für den
      Zeitraum 2014–2029.


      Die größte Gefährdung droht von außen: Die Gebietsverwaltung warnt vor intensivem Holzeinschlag
      unmittelbar am Ostrand, jenseits der innerstaatlichen Entitätsgrenze.
    before: >-
      Das Betreten ohne vorherige Genehmigung der Verwaltung und ohne Rangerbegleitung ist strikt untersagt.
      Auch Foto-, Ton- und Videoaufnahmen im Inneren des Reservats bedürfen einer gesonderten schriftlichen
      Erlaubnis. Es gibt vor Ort kein öffentliches Besucherzentrum: Alle Abstimmungen erfolgen direkt über die
      Forstverwaltung.
    around: >-
      Janj hat keine direkten Nachbarn im Atlas, wohl aber verwandte Bergwälder. Der [Parcul Național
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/) teilt Hermelin, Baummarder und Auerhuhn. Der
      [Parcul Național Defileul Jiului - Codrii
      seculari](/lugar/parcul-national-defileul-jiului-codrii-seculari/) beherbergt Galanthus nivalis, Habicht
      und Wanderfalke im Primärwald. Das Reservat [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) vereint Habicht und Baummarder in
      alten Buchenwäldern. Und das [Totes Gebirge - Karst Desert](/lugar/totes-gebirge---karst-desert/) teilt
      Haselhuhn, Auerhuhn und Braunbär.
  it:
    intro: >-
      A Janj non si entra liberamente: serve richiedere un'autorizzazione preventiva e farsi scortare da un
      guardaboschi del parco. La ragione è semplice. Questa riserva naturale integrale di categoria Ia IUCN
      ricopre le pendici occidentali del monte Stolovaš, nel comune di Šipovo in Republika Srpska, e quasi
      l'intera superficie è composta da foresta vergine. Tra 1.180 e 1.510 metri di quota, faggio, abete
      bianco e abete rosso creano un ecosistema custodito lasciandolo alla sua totale quiete. È uno dei
      tasselli del sito seriale UNESCO delle faggete primarie protette in varie regioni d'Europa.
    landscape: >-
      Quasi 300 ettari compongono la zona centrale integrale, avvolta da una fascia cuscinetto di 380 ettari.
      Il substrato geologico è costituito da dolomia del Triassico, sulla quale si sono formate rendzine,
      suoli bruni e consistenti strati di lignoumus. Il clima montano vede convergere masse d'aria umide
      marittime e perturbazioni continentali.


      Su questa base si sviluppano i boschi dinarici, illirici e altimontani di faggio, abete e abete rosso
      che dominano l'area. È uno scenario di alberi colossali e dinamiche evolutive: un piccolo settore a pino
      silvestre e abete rosso rappresenta una fase pioniera della successione vegetale, un capitolo nel
      continuo rinnovarsi naturale della foresta.


      Ai piedi dei patriarchi arborei, gli elenchi floristici della riserva documentano il giglio martagone
      (Lilium martagon), la genziana asclepiadea (Gentiana asclepiadea) e il bucaneve (Galanthus nivalis),
      assieme a molte altre specie.
    wildlife: >-
      L'inventario dell'ente gestore testimonia la ricchezza faunistica dell'ecosistema. Tra i mammiferi
      compaiono l'ermellino, il capriolo, la volpe rossa, la [martora](/especie/martes_martes/), lo scoiattolo
      comune, il ghiro, la lepre comune e il cinghiale; tra i grandi carnivori si segnalano la lince, il lupo
      e l'orso bruno.


      L'avifauna forestale include il gallo cedrone, il francolino di monte, l'astore, il falco pellegrino e
      il colombaccio.


      Questi dati non corrispondono a un calendario prefissato di avvistamenti, bensì a una mappatura
      naturalistica degli abitanti della foresta. La visita si svolge sempre con il guardaparco, l'unico a
      conoscere ogni segreto del bosco.
    visit: >-
      I visitatori possono accedere all'area protetta esclusivamente previo rilascio di un'autorizzazione
      formale da parte dell'ente gestore e accompagnati dalla guida ufficiale della Prašuma Janj. I gruppi
      organizzati ammettono al massimo 20 partecipanti, sotto la vigilanza del personale forestale.


      Le iniziative didattiche, quali campi scuola, lezioni all'aperto, seminari ed escursioni specialistiche,
      richiedono una prenotazione anticipata presso la direzione. I centri abitati più vicini sono Pribeljci,
      Podobzir e Babići.
    history: >-
      Nel 1910 venne redatto il primo documento di pianificazione territoriale per l'area in cui ricade la
      riserva. Nel 1951 Janj fu dichiarata riserva di foresta primaria, e nel 1954 ottenne la protezione
      speciale come patrimonio di ricerca scientifica e rarità naturale. La riserva è gestita dall'ente
      forestale ŠG Gorica con sede a Šipovo e uffici a Novo Selo; la documentazione ambientale governativa
      attesta un piano di gestione operativo per il periodo 2014–2029.


      Le minacce principali provengono dall'esterno dei confini: l'ente gestore segnala tagli boschivi
      intensivi condotti lungo il margine orientale, oltre il confine amministrativo inter-entità.
    before: >-
      È vietato entrare senza preventiva autorizzazione del gestore e senza guida ufficiale. Anche scattare
      fotografie o effettuare registrazioni audio e video all'interno della riserva richiede un permesso
      scritto. Non è presente un centro accoglienza turistica in loco: ogni contatto va concordato
      preventivamente con l'amministrazione forestale.
    around: >-
      Janj non ha vicini diretti nell'atlas, ma vanta evidenti affinità ecologiche. Il [Parcul Național
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/) condivide ermellino, martora e gallo cedrone.
      Il [Parcul Național Defileul Jiului - Codrii
      seculari](/lugar/parcul-national-defileul-jiului-codrii-seculari/) ospita Galanthus nivalis, astore e
      falco pellegrino in foresta primaria. La [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) associa astore e martora in antiche
      faggete. E il massiccio [Totes Gebirge - Karst Desert](/lugar/totes-gebirge---karst-desert/) include
      francolino di monte, gallo cedrone e orso bruno.
  pt:
    intro: >-
      Em Janj não se entra sem aviso: solicita-se autorização prévia e ingressa-se na companhia de um guarda
      florestal que vigia a mata. A razão é direta. Esta reserva natural integral de categoria Ia da UICN
      ocupa as encostas ocidentais do monte Stolovaš, no município de Šipovo na República Sérvia da Bósnia, e
      quase toda a sua área protegida é floresta virgem intacta. Entre 1.180 e 1.510 metros de altitude, faia,
      abeto e espruce erguem um ecossistema que se conserva pelo simples facto de ser deixado em paz.
      Constitui um dos elementos do bem serial da UNESCO dedicado aos faiais primários protegidos em vários
      pontos da Europa.
    landscape: >-
      Cerca de 300 hectares formam a zona nuclear de reserva integral, envolvida por uma faixa de proteção de
      380 hectares. O solo assenta em dolomite do Triásico, sobre a qual evoluíram rendzinas, solos castanhos
      e espessas camadas de lenho-húmus. O clima montanhoso regista a confluência de massas de ar marítimas
      com frentes continentais rigorosas.


      Sobre este substrato erguem-se os bosques dináricos, ilíricos e altimontanos de faia, abeto e espruce
      que dominam a região. Trata-se de um mosaico de árvores monumentais e de transições dinâmicas: uma
      pequena mancha de pinheiro-silvestre e espruce documenta uma fase de sucessão ecológica, mais um
      capítulo no ciclo contínuo de regeneração do bosque virgem.


      Junto ao solo das árvores centenárias, os inventários botânicos referenciam o lírio-martagão (Lilium
      martagon), a genciana-asclepíade (Gentiana asclepiadea) e o lírio-dos-campos (Galanthus nivalis), entre
      outras plantas florestais.
    wildlife: >-
      O inventário elaborado pela tutela comprova a rica comunidade animal da floresta. Entre os mamíferos
      contam-se o arminho, o corço, a raposa, a [marta](/especie/martes_martes/), o esquilo, o
      leirão-cinzento, a lebre e o javali; entre os grandes predadores ocorrem o lince, o lobo e o urso-pardo.


      As aves completam o mosaico selvagem: o tetraz-grande, a galinha-do-mato, o açor, o falcão-peregrino e o
      pombo-torcaz nidificam nas velhas copas.


      Nenhuma destas informações traduz um calendário certo de avistamento: são listas de inventariação da
      vida selvagem local. A certeza na visita reside em ser acompanhado por um guarda oficial, conhecedor
      profundo de cada vereda.
    visit: >-
      Os visitantes só podem circular na área protegida mediante autorização antecipada da entidade gestora e
      acompanhados pelo guarda florestal da Prašuma Janj. As visitas organizadas realizam-se em grupos de até
      20 pessoas, com supervisão técnica.


      Iniciativas pedagógicas, tais como escolas de natureza, trabalhos de campo, colóquios e saídas
      científicas, exigem comunicação prévia à administração. As povoações vizinhas mais próximas são
      Pribeljci, Podobzir e Babići.
    history: >-
      Em 1910 foi elaborado o primeiro documento de ordenamento florestal para este perímetro. Em 1951 Janj
      foi declarado reserva de floresta primária e em 1954 foi classificado como objeto de investigação
      científica e raridade natural. A reserva é gerida pela empresa florestal ŠG Gorica com sede em Šipovo e
      administração em Novo Selo; a avaliação governamental regista para Janj um plano de gestão para o
      período 2014–2029.


      A principal ameaça provém do exterior: a administração alerta para abates industriais intensivos de
      madeira junto à bordadura oriental, do outro lado da fronteira administrativa interentidades.
    before: >-
      É expressamente proibido entrar sem autorização prévia da administração e sem guia oficial. Fotografar
      ou efetuar gravações sonoras e de vídeo dentro da reserva também exige consentimento formal. Não existe
      centro de acolhimento público no local: todos os contactos decorrem junto da empresa florestal.
    around: >-
      Janj não possui vizinhos imediatos no atlas, mas partilha traços ecológicos evidentes com outros
      maciços. O [Parcul Național Retezat](/lugar/parcul-national-retezat---masivul-muntos/) partilha o
      arminho, a marta e o tetraz-grande. O [Parcul Național Defileul Jiului - Codrii
      seculari](/lugar/parcul-national-defileul-jiului-codrii-seculari/) acolhe Galanthus nivalis, o açor e o
      falcão-peregrino em floresta primária. A reserva [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) soma o açor e a marta em faiais
      virgens. E o maciço [Totes Gebirge - Karst Desert](/lugar/totes-gebirge---karst-desert/) partilha a
      galinha-do-mato, o tetraz-grande e o urso-pardo.
