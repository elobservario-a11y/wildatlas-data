texto:
  es:
    intro: >-
      Una puerta abierta en la roca, un círculo de piedra de cinco metros para asomarse y, detrás, un cañón
      que se pierde hacia Prenj, Velež y Čabulja. Hajdučka vrata, protegida como monumento natural desde 1985,
      es el lugar más conocido del Parque Natural Blidinje, pero el parque es mucho más ancho que su puerta.
      Es una meseta kárstica de Herzegovina entre dos montañas, Čvrsnica y Vran, con un lago en el fondo del
      valle y pinares, pastos y crestas que se suben en jornadas de caminata.
    landscape: >-
      Todo parte del hielo. Durante las dos últimas glaciaciones, el deshielo de Čvrsnica creó el valle
      abierto y despejado en el que hoy se asienta la meseta. En su fondo, a 1184 m, está el lago de Blidinje,
      el mayor lago natural de Bosnia y Herzegovina y monumento natural geomorfológico que da nombre al
      parque. Ocupa entre 2,5 y 6 km², con una profundidad de uno a cuatro metros. Aún se discute su origen:
      puede ser glaciar o puede deberlo algo a los pastores que, a fines del siglo XIX, taparon los sumideros
      del campo.


      A un lado, Čvrsnica. Es la montaña más alta de los Dináricos centrales, y Pločno alcanza 2228 m. Tiene
      además otras 14 cimas por encima de los 2000 m. Al otro, Vran, más cónico y sin grandes contrastes de
      relieve, con su cima en Veliki Vran. Entre los dos queda Masna Luka, reserva natural gestionada, con la
      iglesia de San Elías y una galería franciscana.


      El suelo es caliza, y bajo ella hay varias decenas de cuevas, simas y sumideros dibujados en los mapas,
      aunque solo siete se han explorado. En el macizo de Čvrsnica destaca la reserva geomorfológica de Diva
      Grabovica, con acantilados de entre 100 y 200 m y un cañón fluvial profundo.


      Dos tercios del parque son bosque; el resto, prados, pastos y vegetación alpina. Entre los árboles manda
      el pino munika, un endemismo relicto que en las laderas sureste de Vran llega a su límite occidental en
      los Balcanes. En Masna Luka tiene su reserva, Masna Luka – Borićevac, con el mayor bosque de esta
      especie en Europa. Más arriba, sobre los 2100 m, por la cresta de Čvrsnica crecen líquenes y plantas de
      alta montaña, entre ellas Androsace lactea y Papaver kerneri. La flora vascular supera las 1500
      especies, y Čvrsnica y Vran, junto a Prenj y Čabulja, forman el centro endémico herzegovino, único a
      escala europea. La campanilla herzegovina (Campanula hercegovina) crece en Čvrsnica y otras montañas
      herzegovinas.
    wildlife: >-
      Los mamíferos que destaca el parque son el topillo ciego, el [oso pardo](/especie/ursus_arctos/) y el
      [rebeco](/especie/rupicapra_rupicapra/). En los acantilados de Veliki kuk, un terreno tan abrupto, se
      pueden observar rebecos. Entre los demás habitantes figuran [corzo](/especie/capreolus_capreolus/),
      marta, [gato montés](/especie/felis_silvestris/), [lince](/especie/lynx_lynx/),
      [lobo](/especie/canis_lupus/), zorro, tejón, comadreja, ardilla, liebre y
      [jabalí](/especie/sus_scrofa/).


      El agua guarda lo más delicado: el [tritón alpino](/especie/triturus_alpestris/) en Masna Luka, y en el
      lago peces endémicos muy amenazados, como Aulopyge hügeli y Leucaspius delineatus. El único reptil
      registrado en la bibliografía es la [víbora de Orsini](/especie/vipera_ursinii/). En Čvrsnica, Čabulja y
      Prenj se han registrado 109 especies de mariposas diurnas.


      La estación decide el plan. La zona está en el límite entre el clima mediterráneo y el continental, con
      cambios de tiempo bruscos, mucha lluvia en otoño y nieve en invierno.
    visit: >-
      El parque ofrece caminatas de todos los niveles.


      **Para una primera vez**, el paseo por Masna Luka son unos 6,5 km, dos horas y media y unos 200 m de
      desnivel, entre humedal y la fuente Jasle. La vuelta al lago de Blidinje son unos 10 km en tres horas
      con apenas 30 m de desnivel. Y la subida a Borova glava, una cima en el centro del parque, lleva media
      hora. Las colinas de Barzonja, Glavica y Grad no tienen senderos marcados, pero se caminan sin gran
      esfuerzo.


      **Para un día completo**, Hajdučka vrata desde Vitlenica son unos 16,5 km ida y vuelta, siete horas y
      unos 700 m de desnivel, de dificultad media y bien señalizada. La primera hora cruza el bosque de
      Muvarnica, de pinos y abetos centenarios con algún haya, donde se oyen aves. Después se pasa por
      Zaglavlje, a 1560 m, un antiguo poblado de pastores y ganaderos hoy abandonado.


      **Para los exigentes**, Veliki kuk (unos 17 km, nueve horas, 800 m de desnivel) y Pločno desde Masna
      Luka (unos 17 km, nueve horas, 1200 m de desnivel y sin agua en el camino). Con tiempo despejado, desde
      Pločno se ven montañas lejanas de Bosnia y de Montenegro, el mar y hasta el Durmitor. La ruta
      Barzonja–Jelinak, de unos 6 km y 600 m de desnivel, sube por una cresta con vistas al lago.
    history: >-
      El área se menciona por primera vez por escrito en 1408, en una carta del rey bosnio Ostoja, pero estaba
      habitada desde mucho antes: tumbas ilirias y calzadas romanas indican al menos 2500 años de presencia.
      Durante siglos, los pastores del sur de Herzegovina pasaron aquí los meses de verano. En 19 lugares se
      han localizado unos 160 edificios de majadas de montaña, de los que 85 están en buen estado y el resto
      en ruinas.


      De época medieval quedan los stećci, lápidas funerarias. El parque tiene cinco monumentos nacionales,
      necrópolis en Risovac, Dugo polje, Ponor, Barzonja y Donje Bare.


      La conservación, mientras tanto, tiene un caso claro: los tritones desaparecieron de las zonas donde se
      introdujo trucha, sobre todo para la pesca, porque los peces comen sus larvas.
    before: >-
      Hay nieve en invierno y lluvia abundante en otoño, con cambios de tiempo bruscos. En la ruta de Pločno
      no hay agua en el camino, así que sube con la que necesites.
    around: >-
      Pegadas al macizo están la [Planina Čabulja](/lugar/planina-cabulja/) y la [Planina
      Prenj](/lugar/planina-prenj/); a unos 25 km, los [Montes Kamešnica](/lugar/kamesnica-mountains/).
  en:
    intro: >-
      An open portal carved into stone, a circular rock aperture five metres across to peer through, and
      beyond it a canyon falling away toward Prenj, Velež and Čabulja. Hajdučka vrata, protected as a natural
      monument since 1985, is the most celebrated landmark of Blidinje Nature Park, yet the park spans far
      wider than its famous stone gate. It is a high karst plateau in Herzegovina set between two mountains,
      Čvrsnica and Vran, with a shallow lake on the valley floor, pine woods, meadows and high crests scaled
      on day-long treks.
    landscape: >-
      Everything originates from ice. During the last two ice ages, glacial meltwater from Čvrsnica shaped the
      broad, open valley floor where the plateau rests today. At its lowest point, at 1184 m, lies Lake
      Blidinje, the largest natural lake in Bosnia and Herzegovina and a geomorphological natural monument
      that lends its name to the park. It covers between 2.5 and 6 km², with depths ranging from one to four
      metres. Its genesis remains debated: it may be purely glacial or partly created by shepherds who, at the
      close of the nineteenth century, sealed swallow-holes in the karst plain.


      On one side rises Čvrsnica, the highest mountain in the central Dinarides, culminating at Pločno at 2228
      m. It features another 14 peaks exceeding 2000 m. On the opposite side stands Vran, more conical with
      gentler contours, topping out at Veliki Vran. Between them nestles Masna Luka, a managed natural reserve
      harbouring the Church of Saint Elijah and a Franciscan art gallery.


      The bedrock is limestone, honeycombed by several dozen mapped caves, chasms and sinkholes, though only
      seven have been speleologically explored. Within the Čvrsnica massif, the Diva Grabovica
      geomorphological reserve stands out with sheer cliffs dropping between 100 and 200 m into a deep river
      canyon.


      Two-thirds of the park is covered in woodland, the remainder divided among pastures, meadows and alpine
      tundra. Foremost among the trees is the Bosnian pine (Pinus heldreichii, local munika), a relict endemic
      reaching its western Balkan range limit on the south-eastern flanks of Vran. At Masna Luka it has its
      dedicated sanctuary, Masna Luka – Borićevac, holding the largest stand of this pine in Europe. Higher
      up, above 2100 m along the ridge of Čvrsnica, grow lichens and high-altitude specialists including
      Androsace lactea and Papaver kerneri. Vascular flora exceeds 1500 species; Čvrsnica and Vran, alongside
      Prenj and Čabulja, form an endemic hotspot unique on a European scale. The Herzegovinian bellflower
      (Campanula hercegovina) clings to rock clefts on Čvrsnica.
    wildlife: >-
      Prominent mammals highlighted by the park include the Balkan snow vole, the [brown
      bear](/especie/ursus_arctos/) and the [Balkan chamois](/especie/rupicapra_rupicapra/). Along the
      precipitous crags of Veliki kuk, chamois are regularly observed. Other residents comprise [roe
      deer](/especie/capreolus_capreolus/), pine marten, [wildcat](/especie/felis_silvestris/),
      [lynx](/especie/lynx_lynx/), [wolf](/especie/canis_lupus/), red fox, badger, weasel, red squirrel, brown
      hare and [wild boar](/especie/sus_scrofa/).


      The waters shelter rare aquatic life: the [alpine newt](/especie/triturus_alpestris/) in Masna Luka, and
      endangered endemic fish in the lake such as Aulopyge hügeli and Leucaspius delineatus. The only reptile
      recorded in scientific literature here is the [meadow viper](/especie/vipera_ursinii/). Across Čvrsnica,
      Čabulja and Prenj, 109 species of diurnal butterflies have been documented.


      The seasons govern your itinerary. The area sits on the boundary between Mediterranean and continental
      climates, prone to abrupt weather shifts, heavy autumn rains and deep winter snow.
    visit: >-
      The park provides hiking itineraries suited to all abilities.


      **For a gentle start**, the walk around Masna Luka spans some 6.5 km, taking two and a half hours with
      about 200 m of ascent, passing wetlands and the Jasle spring. A loop of Lake Blidinje covers around 10
      km in three hours with barely 30 m of elevation change. The climb to Borova glava, a summit in the
      centre of the park, requires half an hour. The hills of Barzonja, Glavica and Grad lack waymarked tracks
      but are easily roamed on foot.


      **For a full-day excursion**, Hajdučka vrata from Vitlenica takes about 16.5 km round trip, seven hours
      and some 700 m of climbing along a well-signposted medium-grade trail. The opening hour winds through
      the Muvarnica forest of ancient pines and firs with scattered beeches where woodland birds call, before
      reaching Zaglavlje at 1560 m, a deserted pastoral settlement.


      **For experienced mountaineers**, Veliki kuk (around 17 km, nine hours, 800 m of ascent) and Pločno from
      Masna Luka (some 17 km, nine hours, 1200 m of ascent, with no water on the trail). In clear weather,
      Pločno offers panoramas across distant Bosnian and Montenegrin ranges, the Adriatic Sea and even
      Durmitor. The Barzonja–Jelinak trail, covering around 6 km and 600 m of elevation gain, ascends along a
      scenic crest overlooking the lake.
    history: >-
      The area is first recorded in writing in 1408 in a royal charter by King Ostoja of Bosnia, though
      settled far earlier: Illyrian tumuli and Roman roads attest to at least 2500 years of human presence.
      For centuries, transhumant shepherds from southern Herzegovina spent the summer months here. Across 19
      distinct localities, around 160 stone pastoral huts have been documented, 85 of which remain well
      preserved.


      From the medieval era survive the stećci, monolithic carved gravestones. The park hosts five national
      monument necropolises at Risovac, Dugo polje, Ponor, Barzonja and Donje Bare.


      On the conservation front, native newt populations declined sharply in waters where brown trout were
      introduced for angling, as the fish prey heavily on their larvae.
    before: >-
      Expect snow in winter and copious rain in autumn, with sudden weather changes. The route to Pločno has
      no springs along the ascent, so carry all the water you need.
    around: >-
      Contiguous to the massif are [Planina Čabulja](/lugar/planina-cabulja/) and [Planina
      Prenj](/lugar/planina-prenj/); some 25 km away rise the [Kamešnica
      Mountains](/lugar/kamesnica-mountains/).
  fr:
    intro: >-
      Une porte découpée dans la falaise, un anneau de pierre de cinq mètres pour embrasser le vide et, en
      arrière-plan, un canyon plongeant vers Prenj, Velež et Čabulja. Hajdučka vrata, classée monument naturel
      depuis 1985, est le site emblématique du parc naturel de Blidinje, mais le territoire est bien plus
      vaste que cette arche. C'est un haut plateau karstique d’Herzégovine enchâssé entre deux massifs,
      Čvrsnica et Vran, avec un lac au fond du vallon, des pinèdes, des alpages et des crêtes à gravir lors de
      longues randonnées.
    landscape: >-
      Tout est né de la glace. Lors des deux dernières glaciations, la fonte des névés de Čvrsnica a façonné
      le fond de vallée dégagé où repose le plateau. En son point le plus bas, à 1184 m, s’étend le lac de
      Blidinje, plus grand lac naturel de Bosnie-Herzégovine et monument géomorphologique donnant son nom au
      parc. Il couvre entre 2,5 et 6 km², avec une profondeur d'un à quatre mètres. Son origine exacte demeure
      discutée : creusement glaciaire ou fermeture des pertes karstiques par les bergers à la fin du XIXe
      siècle.


      D’un côté se dresse Čvrsnica, point culminant des Dinarides centrales, dont le sommet de Pločno atteint
      2228 m. Il compte également 14 autres cimes dépassant les 2000 m. De l’autre s’élève Vran, cône plus
      régulier couronné par Veliki Vran. Entre les deux s’abrite Masna Luka, réserve naturelle gérée
      accueillant l’église Saint-Élie et une galerie d’art franciscaine.


      Le sous-sol calcaire recèle plusieurs dizaines de grottes et gouffres répertoriés, dont sept seulement
      ont été explorés. Sur Čvrsnica, la réserve géomorphologique de Diva Grabovica impressionne avec ses
      parois verticales hautes de 100 à 200 m surplombant une gorge fluviale étroite.


      Deux tiers du parc sont boisés ; le reste réunit pelouses, alpages et landes alpines. L’arbre roi est le
      pin de Bosnie (Pinus heldreichii, localement munika), endémisme relique qui atteint sur Vran sa limite
      occidentale dans les Balkans. À Masna Luka, la réserve de Masna Luka – Borićevac protège la plus vaste
      forêt de cette essence en Europe. Plus haut, au-delà de 2100 m sur les crêtes de Čvrsnica,
      s’épanouissent lichens et flore d’altitude, dont Androsace lactea et Papaver kerneri. La flore
      vasculaire dépasse 1500 espèces. La campanule d'Herzégovine (Campanula hercegovina) s'accroche aux
      rochers.
    wildlife: >-
      Parmi les mammifères phares protégés figurent le campagnol des neiges des Balkans, l’[ours
      brun](/especie/ursus_arctos/) et le [chamois](/especie/rupicapra_rupicapra/). Les falaises abruptes de
      Veliki kuk permettent d'observer facilement les hardes de chamois. On compte également le
      [chevreuil](/especie/capreolus_capreolus/), la martre, le [chat forestier](/especie/felis_silvestris/),
      le [lynx](/especie/lynx_lynx/), le [loup](/especie/canis_lupus/), le renard, le blaireau, l'écureuil et
      le [sanglier](/especie/sus_scrofa/).


      Les eaux abritent les raretés les plus sensibles : le [triton alpestre](/especie/triturus_alpestris/) à
      Masna Luka et des poissons endémiques menacés dans le lac, comme Aulopyge hügeli et Leucaspius
      delineatus. Le seul reptile cité dans la littérature locale est la [vipère
      d'Orsini](/especie/vipera_ursinii/). Sur Čvrsnica, Čabulja et Prenj, 109 espèces de papillons de jour
      ont été recensées.


      La saison dicte l'itinéraire. Le climat oscille entre influences méditerranéennes et continentales, avec
      des orages soudains, des pluies automnales et d'abondantes neiges hivernales.
    visit: >-
      Le parc propose des circuits pour chaque niveau de marcheur.


      **Pour une première découverte**, la boucle de Masna Luka compte environ 6,5 km, deux heures et demie et
      quelque 200 m de dénivelé, entre sources et zones humides. Le tour du lac de Blidinje représente environ
      10 km en trois heures pour à peine 30 m de dénivelé. La montée à Borova glava ne demande qu'une
      demi-heure. Les collines de Barzonja, Glavica et Grad s'explorent facilement hors sentier balisé.


      **Pour une journée complète**, Hajdučka vrata au départ de Vitlenica fait environ 16,5 km aller-retour,
      sept heures et 700 m de dénivelé sur un sentier bien jalonné. La première heure traverse la forêt de
      Muvarnica, peuplée de sapins et pins séculaires, avant de franchir l’ancien hameau pastoral de Zaglavlje
      à 1560 m.


      **Pour les montagnards expérimentés**, Veliki kuk (environ 17 km, neuf heures, 800 m de dénivelé) et
      Pločno depuis Masna Luka (environ 17 km, neuf heures, 1200 m de dénivelé sans point d'eau). Par ciel
      limpide, Pločno offre un panorama grandiose jusqu'à la mer Adriatique et au Durmitor. L’itinéraire
      Barzonja–Jelinak, long de 6 km pour 600 m de dénivelé, grimpe sur une crête dominant le lac.
    history: >-
      La première mention écrite date de 1408 dans une charte du roi Ostoja de Bosnie, mais le peuplement est
      bien antérieur : tumuli illyriens et voies romaines attestent d'au moins 2500 ans d'histoire humaine.
      Durant des siècles, les éleveurs y montaient en estive. Dans 19 secteurs distincts, environ 160 cabanes
      pastorales en pierre sèche ont été répertoriées, dont 85 en bon état de conservation.


      De l’époque médiévale subsistent les célèbres stećci. Le parc compte cinq nécropoles classées monuments
      nationaux à Risovac, Dugo polje, Ponor, Barzonja et Donje Bare.


      En matière de conservation, les tritons ont régressé dans les plans d'eau où la truite a été introduite
      pour la pêche, celle-ci dévorant leurs pontes.
    before: >-
      Attention aux chutes de neige en hiver et aux fortes précipitations en automne. L'ascension de Pločno
      est dépourvue de points d'eau, emportez des réserves suffisantes.
    around: >-
      Adjacents au massif se situent [Planina Čabulja](/lugar/planina-cabulja/) et [Planina
      Prenj](/lugar/planina-prenj/) ; à environ 25 km s'élèvent les [Monts
      Kamešnica](/lugar/kamesnica-mountains/).
  de:
    intro: >-
      Ein Felsenbogen hoch über dem Abgrund, ein fünf Meter weites Steinfenster mit Blick auf eine Schlucht,
      die sich in Richtung Prenj, Velež und Čabulja verliert. Hajdučka vrata, seit 1985 als Naturdenkmal
      geschützt, ist das Wahrzeichen des Naturparks Blidinje. Doch der Park reicht weit über das Tor hinaus:
      Er umfasst ein herzeckowinisches Hochplateau zwischen Čvrsnica und Vran mit einem flachen See im
      Talbecken, urigen Kiefernwäldern und Berggipfeln.
    landscape: >-
      Alles begann mit dem Eis. Während der letzten beiden Kaltzeiten schufen die Schmelzwasser der Čvrsnica
      das breite, offene Talbecken der heutigen Hochebene. Auf dem Talboden liegt auf 1184 m Höhe der
      Blidinje-See, das größte natürliche Gewässer Bosnien-Herzegowinas. Er bedeckt zwischen 2,5 und 6 km² bei
      einer Wassertiefe von einem bis vier Metern. Ob seine Entstehung rein glazial ist oder auf Hirten
      zurückgeht, die Ende des neunzehnten Jahrhunderts Schlucklöcher abdichteten, bleibt umstritten.


      Auf der einen Talseite ragt die Čvrsnica auf, das höchste Massiv der zentralen Dinariden, dessen Gipfel
      Pločno 2228 m erreicht. Weitere 14 Gipfel übersteigen 2000 m. Gegenüber liegt der ebenmäßigere Vran mit
      dem Veliki Vran. Dazwischen liegt Masna Luka, ein Naturschutzreservat mit der Eliaskirche und einer
      Franziskanergalerie.


      Der Kalkstein ist von Dutzenden Höhlen und Dolinen durchsetzt, von denen bisher sieben erforscht sind.
      Im Čvrsnica-Massiv beeindruckt das geomorphologische Schutzgebiet Diva Grabovica mit steilen Felswänden
      von 100 bis 200 m Höhe über einer tiefen Schlucht.


      Zwei Drittel der Fläche sind bewaldet; der Rest besteht aus Wiesen und alpinen Matten. Dominierende
      Baumart ist die Schlangenhaut-Kiefer (Pinus heldreichii, lokal Munika), die am Vran ihre westliche
      Arealgrenze am Balkan erreicht. Bei Masna Luka schützt das Reservat Masna Luka – Borićevac den größten
      geschlossenen Bestand dieser Baumart in Europa. Oberhalb von 2100 m wachsen auf den Graten
      arktisch-alpine Pflanzen wie Androsace lactea und Papaver kerneri. Die Gefäßpflanzenflora zählt über
      1500 Arten, darunter die zierliche Herzegowina-Glockenblume.
    wildlife: >-
      Zu den bemerkenswerten Säugetieren zählen Schneemaus, [Braunbär](/especie/ursus_arctos/) und die
      [Balkangämse](/especie/rupicapra_rupicapra/). An den steilen Felsabstürzen des Veliki kuk lassen sich
      Gämsen hervorragend beobachten. Zudem leben hier [Reh](/especie/capreolus_capreolus/), Baummarder,
      [Wildkatze](/especie/felis_silvestris/), [Luchs](/especie/lynx_lynx/), [Wolf](/especie/canis_lupus/),
      Rotfuchs, Dachs, Eichhörnchen und [Wildschwein](/especie/sus_scrofa/).


      Besonders empfindlich ist die Wasserfauna: der [Bergmolch](/especie/triturus_alpestris/) in Masna Luka
      sowie gefährdete endemische Fische im See wie Aulopyge hügeli und Leucaspius delineatus. Als einziges
      Kriechtier wird die [Wiesenotter](/especie/vipera_ursinii/) geführt. Auf Čvrsnica, Čabulja und Prenj
      wurden 109 Tagfalterarten nachgewiesen.


      Das Gebirgswetter wechselt rasch zwischen mediterranen und kontinentalen Einflüssen mit ergiebigen
      Herbstregen und schneereichen Wintern.
    visit: >-
      Der Park bietet Wanderungen verschiedener Schwierigkeitsgrade.


      **Für Einsteiger** empfiehlt sich die Runde um Masna Luka über 6,5 km in zweieinhalb Stunden mit rund
      200 m Höhenunterschied. Die Umrundung des Blidinje-Sees beansprucht etwa 10 km in drei Stunden bei
      lediglich 30 m Höhendifferenz. Der Aufstieg auf die Borova glava dauert eine halbe Stunde. Die Kuppen
      Barzonja, Glavica und Grad lassen sich weglos erkunden.


      **Als Tagestour** führt der Weg nach Hajdučka vrata ab Vitlenica über 16,5 km hin und zurück in sieben
      Stunden bei 700 m Höhenunterschied durch alten Bergmischwald und die verlassene Hirtensiedlung Zaglavlje
      auf 1560 m.


      **Für erfahrene Bergwanderer** stehen Touren zum Veliki kuk (rund 17 km, neun Stunden, 800 m Anstieg)
      sowie zum Pločno ab Masna Luka (etwa 17 km, neun Stunden, 1200 m Anstieg ohne Wasserstellen) bereit. Vom
      Pločno reicht der Blick bis zum Meer und zum Durmitor. Die Gratroute Barzonja–Jelinak über 6 km und 600
      m Anstieg bietet Tiefblicke auf den See.
    history: >-
      Erstmals schriftlich erwähnt wurde das Gebiet 1408 in einer Urkunde von König Ostoja. Illyrische Gräber
      und Römerstraßen belegen eine über 2500 Jahre währende Siedlungsgeschichte. An 19 Standorten finden sich
      rund 160 traditionelle Almhütten, davon 85 in gutem Zustand.


      Aus dem Mittelalter stammen die Stećci-Grabmonumente mit fünf Nationaldenkmal-Nekropolen in Risovac,
      Dugo polje, Ponor, Barzonja und Donje Bare.


      Im Gewässerschutz zeigte sich, dass Forellenbesatz die Bergmolchpopulationen stark dezimierte, da die
      Fische deren Larven fraßen.
    before: >-
      Im Winter liegt dichter Schnee, im Herbst fällt viel Regen. Auf dem Weg zum Pločno gibt es keine
      Quellen; nimm ausreichend Trinkwasser mit.
    around: >-
      Direkt an das Massiv grenzen [Planina Čabulja](/lugar/planina-cabulja/) und [Planina
      Prenj](/lugar/planina-prenj/); rund 25 km entfernt liegt das
      [Kamešnica-Gebirge](/lugar/kamesnica-mountains/).
  it:
    intro: >-
      Un portale aperto nella roccia viva, un anello di pietra di cinque metri da cui affacciarsi su un orrido
      che sprofonda verso Prenj, Velež e Čabulja. Hajdučka vrata, monumento naturale tutelato dal 1985, è il
      luogo simbolo del Parco Naturale di Blidinje, ma il comprensorio protetto è assai più vasto. È un
      altopiano carsico dell'Erzegovina incuneato tra due monti possenti, la Čvrsnica e il Vran, con un lago
      sul fondovalle, pinete relitte e panoramiche dorsali montane.
    landscape: >-
      Tutto ha origine dai ghiacci. Durante le ultime due glaciazioni, il disgelo della Čvrsnica scavò l'ampia
      vallata dove oggi riposa l'altopiano. Nel punto più depresso, a 1184 m, giace il lago di Blidinje, il
      bacino naturale più esteso della Bosnia-Erzegovina. Copre una superficie compresa fra 2,5 e 6 km², con
      profondità tra uno e quattro metri. Sulla sua genesi si dibatte ancora: origine glaciale oppure
      occlusione degli inghiottitoi operata dai pastori a fine Ottocento.


      Da un versante si staglia la Čvrsnica, vetta regina delle Dinaridi centrali, il cui picco di Pločno
      tocca 2228 m, accompagnato da altre 14 cime sopra i 2000 m. Di fronte sorge il Vran, di profilo conico,
      culminante nel Veliki Vran. Tra i due rilievi si adagia Masna Luka, riserva naturale gestita che
      accoglie la chiesa di Sant'Elia e una quadreria francescana.


      Il basamento calcareo cela decine di cavità sotterranee, di cui solo sette sono state esplorate. Sulla
      Čvrsnica risalta la riserva geomorfologica di Diva Grabovica, con balze rocciose tra 100 e 200 m a picco
      su una stretta forra fluviale.


      Due terzi del parco sono coperti da boschi; il resto è formato da pascoli e brughiere alpine. Tra gli
      alberi primeggia il pino loricato (Pinus heldreichii, localmente munika), relitto balcanico che sul Vran
      tocca il limite occidentale del suo areale. A Masna Luka la riserva di Masna Luka – Borićevac ne
      custodisce la più vasta foresta d'Europa. Più in alto, oltre i 2100 m sui crinali della Čvrsnica,
      crescono licheni e piante pioniere d'alta quota, tra cui Androsace lactea e Papaver kerneri. La flora
      vascolare supera le 1500 specie e comprende la rara campanula d'Erzegovina (Campanula hercegovina).
    wildlife: >-
      Tra i mammiferi spiccano l'arvicola delle nevi balcanica, l'[orso bruno](/especie/ursus_arctos/) e il
      [camoscio balcanico](/especie/rupicapra_rupicapra/). Sulle pareti verticali di Veliki kuk è frequente
      osservare i camosci. Popolano l'area anche il [capriolo](/especie/capreolus_capreolus/), la martora, il
      [gatto selvatico](/especie/felis_silvestris/), la [lince](/especie/lynx_lynx/), il
      [lupo](/especie/canis_lupus/), la volpe, il tasso, lo scoiattolo e il [cinghiale](/especie/sus_scrofa/).


      Nelle acque vivono presenze fragili: il [tritone alpino](/especie/triturus_alpestris/) a Masna Luka e
      pesci endemici minacciati nel lago quali Aulopyge hügeli e Leucaspius delineatus. L'unico rettile
      segnalato è la [vipera dell'Orsini](/especie/vipera_ursinii/). Tra Čvrsnica, Čabulja e Prenj sono state
      censite 109 specie di farfalle diurne.


      Il clima combina tratti mediterranei e continentali, con repentine variazioni meteorologiche, piogge
      copiose in autunno e abbondanti nevicate invernali.
    visit: >-
      Il parco offre itinerari escursionistici adatti a ogni preparazione.


      **Per una prima camminata**, l'anello di Masna Luka richiede circa 6,5 km, due ore e mezza e circa 200 m
      di salita tra sorgenti e torbiere. Il periplo del lago di Blidinje copre circa 10 km in tre ore con
      appena 30 m di dislivello. La salita a Borova glava dura mezz'ora. I colli di Barzonja, Glavica e Grad
      si possono percorrere liberamente senza tracciati obbligati.


      **Per una giornata intera**, la salita a Hajdučka vrata da Vitlenica misura 16,5 km andata e ritorno,
      sette ore di cammino e 700 m di dislivello su buon sentiero. La prima ora attraversa la faggeta-abietina
      di Muvarnica prima di toccare Zaglavlje a 1560 m, antico borgo d'alpeggio oggi disabitato.


      **Per escursionisti esperti**, Veliki kuk (circa 17 km, nove ore, 800 m di dislivello) e Pločno da Masna
      Luka (circa 17 km, nove ore, 1200 m di ascesa, senza fonti d'acqua). Dalla vetta di Pločno la vista
      spazia fino al mare e al Durmitor. La salita Barzonja–Jelinak, di circa 6 km e 600 m di salita, si snoda
      su cresta affacciata sul lago.
    history: >-
      La prima attestazione risale al 1408 in una bolla del re Ostoja di Bosnia, ma l'uomo vi abita da tempi
      remoti: tombe illiriche e selciati romani provano oltre 2500 anni di frequentazione. In 19 località sono
      state documentate circa 160 baite pastorali in pietra, 85 delle quali ben conservate.


      All'età medievale risalgono le stećci, monumenti funerari scolpiti. Il parco accoglie cinque necropoli
      dichiarate monumento nazionale a Risovac, Dugo polje, Ponor, Barzonja e Donje Bare.


      Sul piano della conservazione, l'introduzione di trote nei laghetti per la pesca sportiva ha causato la
      sparizione locale dei tritoni per predazione delle larve.
    before: >-
      In inverno sono frequenti bufere di neve e in autunno piogge battenti. L'ascesa a Pločno è priva di
      acqua potabile, porta con te scorte sufficienti.
    around: >-
      Contigui al massiccio sorgono la [Planina Čabulja](/lugar/planina-cabulja/) e la [Planina
      Prenj](/lugar/planina-prenj/); a circa 25 km si elevano i [Monti
      Kamešnica](/lugar/kamesnica-mountains/).
  pt:
    intro: >-
      Uma arcada esculpida na rocha, um vão de pedra de cinco metros de diâmetro aberto sobre um desfiladeiro
      que se alonga em direção a Prenj, Velež e Čabulja. Hajdučka vrata, monumento natural classificado desde
      1985, é o cartão-de-visita do Parque Natural de Blidinje, mas o território protegido estende-se muito
      além desta arcada. Trata-se de um planalto cárstico da Herzegovina entalado entre duas serras, Čvrsnica
      e Vran, com um lago de várzea, pinhais de altitude e cumeadas panorâmicas.
    landscape: >-
      Tudo decorre da ação do gelo. Durante as duas últimas glaciações, o degelo da Čvrsnica moldou o fundo de
      vale amplo onde assenta o planalto. Na sua depressão mais baixa, a 1184 m, repousa o lago de Blidinje, a
      maior albufeira natural da Bósnia e Herzegovina. Cobre entre 2,5 e 6 km², com profundidade de um a
      quatro metros. A sua génese permanece controversa: origem estritamente glaciar ou encerramento
      artificial de sumidouros por pastores nos finais do século XIX.


      De um lado ergue-se a Čvrsnica, o maciço mais elevado dos Dináricos centrais, cujo cimo em Pločno atinge
      2228 m. Ostenta ainda outros 14 cumes acima dos 2000 m. Do lado oposto eleva-se o Vran, de formato
      cónico, culminando no Veliki Vran. Entre ambos abriga-se Masna Luka, reserva florestal gerida onde se
      situam a igreja de Santo Elias e uma galeria franciscana.


      O substrato calcário é sulcado por dezenas de algares e grutas, das quais apenas sete se encontram
      exploradas. Na Čvrsnica destaca-se a reserva geomorfológica de Diva Grabovica, com escarpas verticais de
      100 a 200 m talhadas sobre um canhão fluvial.


      Dois terços da área estão florestados; o remanescente reparte-se por pastagens e charnecas alpinas. A
      árvore emblemática é o pinheiro-da-bósnia (Pinus heldreichii, localmente munika), relíquia balcânica que
      no Vran alcança o seu limite ocidental. Em Masna Luka a reserva Masna Luka – Borićevac alberga a maior
      mancha pura desta conífera na Europa. Acima dos 2100 m na crista da Čvrsnica despontam líquenes e
      espécies de altitude como Androsace lactea e Papaver kerneri. A flora vascular supera as 1500 espécies,
      destacando-se a campânula-da-herzegovina (Campanula hercegovina).
    wildlife: >-
      Entre os mamíferos de relevo contam-se a ratazana-das-neves-balcânica, o
      [urso-pardo](/especie/ursus_arctos/) e a [camurça-balcânica](/especie/rupicapra_rupicapra/). Nos penedos
      inacessíveis de Veliki kuk observam-se facilmente rebanhos de camurças. O elenco faunístico inclui ainda
      [corço](/especie/capreolus_capreolus/), marta, [gato-bravo](/especie/felis_silvestris/),
      [lince](/especie/lynx_lynx/), [lobo](/especie/canis_lupus/), raposa, texugo, esquilo e
      [javali](/especie/sus_scrofa/).


      As águas retêm as espécies mais frágeis: o [tritão-alpino](/especie/triturus_alpestris/) em Masna Luka e
      peixes endémicos vulneráveis na lagoa como Aulopyge hügeli e Leucaspius delineatus. O único réptil
      formalmente referenciado é a [víbora-de-orsini](/especie/vipera_ursinii/). Entre Čvrsnica, Čabulja e
      Prenj registam-se 109 espécies de borboletas diurnas.


      A transição entre os climas mediterrânico e continental provoca variações meteorológicas abruptas, com
      chuvadas fortes no outono e nevões no inverno.
    visit: >-
      O parque faculta percursos para diferentes graus de aptidão.


      **Para um primeiro contacto**, a volta a Masna Luka totaliza cerca de 6,5 km, duas horas e meia e cerca
      de 200 m de desnível positivo entre nascentes e brejos. O circuito em redor do lago de Blidinje perfaz
      perto de 10 km em três horas com apenas 30 m de desnível. A subida a Borova glava cumpre-se em meia
      hora. As elevações de Barzonja, Glavica e Grad percorrem-se sem caminhos marcados com facilidade.


      **Para uma caminhada de um dia**, o trilho a Hajdučka vrata a partir de Vitlenica soma cerca de 16,5 km
      ida e volta, sete horas e perto de 700 m de desnível por trilho bem sinalizado. A primeira hora cruza a
      mata secular de Muvarnica, passando depois pelo antigo aglomerado pastoril de Zaglavlje a 1560 m.


      **Para montanhistas experientes**, Veliki kuk (cerca de 17 km, nove horas, 800 m de desnível) e Pločno
      desde Masna Luka (cerca de 17 km, nove horas, 1200 m de desnível sem pontos de água). Do cume de Pločno
      a vista alcança o mar Adriático e o maciço do Durmitor. A subida Barzonja–Jelinak, de 6 km e 600 m de
      desnível, percorre uma crista aberta sobre a lagoa.
    history: >-
      A primeira menção escrita data de 1408 numa missiva régia do monarca bósnio Ostoja, mas a ocupação
      humana remonta a mamoas ilírias e calçadas romanas que atestam mais de 2500 anos de vivência. Em 19
      sítios foram recenseados cerca de 160 abrigos pastoris de montanha, 85 dos quais em bom estado de
      conservação.


      Da Idade Média perduram os stećci, monumentos fúnebres de pedra. O parque integra cinco necrópoles
      classificadas como monumentos nacionais em Risovac, Dugo polje, Ponor, Barzonja e Donje Bare.


      A conservação depara-se com o impacto da introdução de trutas para pesca desportiva, predadoras vorazes
      das larvas de tritão.
    before: >-
      A montanha regista neve espessa no inverno e temporais no outono. A ascensão a Pločno não possui
      nascentes de água, leva contigo todo o abastecimento necessário.
    around: >-
      Contíguas ao maciço erguem-se a [Planina Čabulja](/lugar/planina-cabulja/) e a [Planina
      Prenj](/lugar/planina-prenj/); a cerca de 25 km perfilam-se os [Montes
      Kamešnica](/lugar/kamesnica-mountains/).
