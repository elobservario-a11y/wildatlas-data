resumen:
  es: >-
    El Parque Nacional más pequeño de Noruega (23 km²), protegiendo un bosque virgen intacto de pino silvestre
    y abetos de varios siglos de antigüedad.
  en: >-
    Norway's smallest National Park (23 km²), protecting an untouched primeval forest of Scots pine and
    centuries-old spruces.
  fr: >-
    Le plus petit parc national de Norvège (23 km²), protégeant une forêt vierge intacte de pins sylvestres et
    d'épicéas pluricentenaires.
  de: >-
    Norwegens kleinster Nationalpark (23 km²), der einen unberührten Urwald aus Waldkiefern und
    jahrhundertealten Fichten schützt.
  it: >-
    Il parco nazionale più piccolo della Norvegia (23 km²), a protezione di una foresta vergine intatta di
    pino silvestre e abeti plurisecolari.
  pt: >-
    O Parque Nacional mais pequeno da Noruega (23 km²), protegendo uma floresta virgem intacta de
    pinheiro-silvestre e espruces pluricentenários.
unico:
  es: En un parque de 22 km² pasas de un bosque primario a una pradera de seter con casas de troncos.
  en: In a park of 22 km² you pass from primeval forest to an alpine seter meadow with historic log cabins.
  fr: >-
    Dans un parc de 22 km², vous passez d'une forêt primaire à une prairie de seter bordée de chalets en
    rondins.
  de: >-
    In einem Park von 22 km² gelangst du von einem Urwald direkt auf eine Seter-Alm mit historischen
    Blockhütten.
  it: In un parco di 22 km² passi da una foresta primaria a una radura di seter con baite di tronchi.
  pt: Num parque de 22 km² passas de uma floresta primária para uma campina de seter com cabanas de troncos.
observaciones:
  es: >-
    Del 15 de abril al 15 de septiembre está prohibido hacer fuego, salvo donde el fuego obviamente no pueda
    propagarse; hay zonas de acampada con leña y letrina en el sureste del Gutulisjøen. Todos los árboles
    están protegidos, vivos o muertos. Los perros deben ir atados del 1 de abril al 20 de agosto. Comprueba
    antes los programas de verano de la seter, porque los servicios y las visitas guiadas cambian cada
    temporada.
texto:
  es:
    intro: >-
      Gutulia es el parque nacional más pequeño de Noruega, y se nota en que cabe un mundo entero en poco
      espacio. Son poco más de 22 km² de abetos y pinos que han vivido cientos de años, de árboles caídos que
      siguen vivos por dentro de insectos, hongos y líquenes, y, en una esquina, un contrapunto inesperado:
      unas praderas de seter con cabañas de troncos donde durante dos siglos subieron los animales a pastar
      cada verano. Está entre Drevsjø y Elgå, al este del lago Femunden, y toca la frontera sueca.
    landscape: >-
      Es un bosque típico del este de Noruega, de gran altitud: va de los 615 a los 949 m, con el monte
      Gutulivola en el centro y el lago Gutulisjøen al oeste. El suelo es sobre todo arenisca pobre en
      nutrientes, así que lo que crece aquí lo hace despacio. Las laderas del Gutulivola tienen pinar abierto;
      las zonas más bajas, abetal denso, con muchos árboles muertos y caídos. Y casi todo el parque no ha sido
      talado.


      Eso importa más de lo que parece. Los bosques antiguos ofrecen muchos más nichos que los bosques
      gestionados para la madera, y aquí sostienen muchas especies amenazadas de hongos, líquenes, plantas y
      animales. Del tronco de los árboles cuelgan líquenes barbudos; en el suelo, los árboles muertos
      hormiguean de vida. Entre las especies características están el arrendajo siberiano, el [pico
      tridáctilo](/especie/picoides_tridactylus/) euroasiático, el liquen lobo y hongos poliporos. Todos los
      árboles del parque, vivos o muertos, en pie o caídos, están protegidos; los muertos dan hogar a
      insectos, hongos y líquenes raros.


      El fuego también ha dejado huella: Gutulia ha sufrido incendios forestales naturales muchas veces y por
      eso alberga especies ligadas a la ecología del fuego.
    wildlife: >-
      Aquí no se viene a buscar grandes manadas, sino a escuchar. El pico negro y el arrendajo siberiano,
      curioso, son los habitantes más fáciles de encontrar. Entre las aves más comunes están el pinzón real,
      el bisbita arbóreo y el mosquitero musical. En el bosque aparecen de forma esporádica casi todos los
      animales del bosque: [alce](/especie/alces_alces/), corzo, zorro rojo, [marta](/especie/martes_martes/),
      visón, [castor](/especie/castor_fiber/) y [nutria](/especie/lutra_lutra/). El [oso
      pardo](/especie/ursus_arctos/) aparece ocasionalmente, y en verano se puede oír el silbido del porrón
      osculado sobre el lago Gutulisjøen y, con suerte, ver un [águila
      pescadora](/especie/pandion_haliaetus/). Se citan unas cien especies de aves, entre ellas la perdiz
      nival y el [urogallo](/especie/tetrao_urogallus/).


      El reno salvaje desapareció de la zona hacia 1880, pero aún se cruzan renos domésticos de los sami
      meridionales: toda la zona es pasto de los propietarios de Svahken sitje, el distrito de pastoreo sami
      más meridional de Noruega. En primavera, en la época de cría, la fauna es especialmente sensible a las
      molestias.
    visit: >-
      Se llega en coche hasta la entrada junto al Gutulisjøen, que tiene aparcamiento, paneles, bancos y zonas
      para hacer fuego. En el edificio Stallen hay una exposición sobre el parque. De ahí son 3 km por un
      sendero natural hasta Gutulisetra, el área de seter: unos 45 minutos.


      En Gutulisetra se sale a pasear en serio. Hay un sendero interpretativo de 1,5 km con más de 20 puestos,
      donde se ven el Storgrana, el liquen lobo, animales y restos culturales. En la parte alta de la seter,
      Oppåvollen, hay una pequeña exposición sobre la vida en las setras a lo largo de 200 años, y en verano
      hay un anfitrión que responde a preguntas sobre la zona. Y si quieres vistas, el Jyltingsvola, de 874 m,
      está a solo 3,8 km de Gutulisetra: desde él se ve Femundsmarka al norte, Suecia al este y el Sølen al
      oeste. La subida empieza en el puente sobre el río Gutua y atraviesa el bosque viejo con pendiente
      regular hasta la cima.


      Fuera de ahí, el parque no tiene senderos acondicionados, de modo que se explora un bosque viejo y poco
      tocado, caminando o esquiando por donde se quiera. En Elgå está el centro de visitantes del parque
      nacional Femundsmarka y Gutulia, con una exposición sobre historia local, cría sami de renos y fauna.
    history: >-
      El nombre viene de guttu, «camino», y li, «ladera cubierta de bosque»: los comerciantes usaban los lagos
      y el río helados con caballo y trineo, por ejemplo hacia el mercado de Røros. Más tarde, desde mediados
      del siglo XVIII, la gente de las granjas de Lillebo y Sorken llevaba el ganado a pastar aquí cada
      verano, hasta 1949. Entre 1975 y 1983 se restauraron las 16 cabañas de troncos con técnicas artesanales
      antiguas.


      Las primeras propuestas de proteger Gutulia, por sus grandes pinos, son de 1916. El parque se creó el 20
      de diciembre de 1968 con unos 18 km²; en 2004 se amplió y hoy protege 22,563 km². Desde que el pequeño
      Ormtjernkampen se amplió a Langsua en 2011, es el parque nacional más pequeño de Noruega. Desde 1990 su
      naturaleza se vigila con el programa Terrestrisk naturovervåking, que mide el efecto de contaminantes de
      largo alcance.
    before: >-
      Del 15 de abril al 15 de septiembre está prohibido hacer fuego, salvo donde el fuego obviamente no pueda
      propagarse; hay zonas de acampada con leña y letrina en el sureste del Gutulisjøen. Todos los árboles
      están protegidos, vivos o muertos. Los perros deben ir atados del 1 de abril al 20 de agosto. Comprueba
      antes los programas de verano de la seter, porque los servicios y las visitas guiadas cambian cada
      temporada.
    around: >-
      A unos cinco kilómetros está el [Parque Nacional de Femundsmarka](/lugar/femundsmarka-nasjonalpark/),
      con el que comparte el centro de visitantes de Elgå. Más lejos, el [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), el [Parque Nacional de
      Hamra](/lugar/hamra-national-park/) y el [Parque Nacional de Muddus /
      Muttos](/lugar/muddus-national-park/) comparten con Gutulia el pico tridáctilo y el alce en bosque
      primario.
  en:
    intro: >-
      Gutulia is Norway's smallest national park, and its compact scale means an entire wilderness is
      concentrated in very little space. Spanning just over 22 km² of spruces and Scots pines that have stood
      for centuries, fallen trunks teem internally with insects, fungi, and lichens, while tucked in one
      corner lies an unexpected cultural contrast: historic seter meadows dotted with timber cabins where
      livestock were brought to graze every summer for two centuries. It lies between Drevsjø and Elgå, east
      of Lake Femunden, touching the Swedish border.
    landscape: "This is a quintessential high-elevation taiga forest of eastern Norway: rising from 615 to 949 m, centered on Mount Gutulivola with Lake Gutulisjøen spreading to the west. The bedrock is predominantly nutrient-poor sandstone, so whatever grows here does so slowly and tenaciously. The flanks of Gutulivola support open pine woodland, yielding in lower basins to dense spruce forests cluttered with standing dead snags and fallen logs. Almost the entire park has never experienced commercial logging.\r\n\r\nThat distinction matters profoundly. Ancient forests provide far more ecological niches than managed commercial timberlands, and here they harbor numerous threatened species of fungi, lichens, plants, and fauna. Beardless and beard lichens drape from weathered branches; on the ground, decaying wood hums with hidden activity. Distinctive species include the Siberian jay, Eurasian [three-toed woodpecker](/especie/picoides_tridactylus/), wolf lichen, and bracket polypores. Every single tree in the park, living or dead, standing or fallen, enjoys total legal protection, with deadwood sheltering rare invertebrates and lichens.\r\n\r\nWildfire has also set its seal on this landscape: Gutulia has weathered natural forest fires repeatedly through the centuries, creating habitats vital to fire-adapted ecology."
    wildlife: "One does not come here expecting great herds, but to listen in silence. The black woodpecker and inquisitive Siberian jay are the residents easiest to detect. Among common songbirds are the brambling, tree pipit, and willow warbler. Across the woodland wander most characteristic boreal creatures: [moose](/especie/alces_alces/), roe deer, red fox, [pine marten](/especie/martes_martes/), American mink, Eurasian [beaver](/especie/castor_fiber/), and Eurasian [otter](/especie/lutra_lutra/). [Brown bears](/especie/ursus_arctos/) make occasional appearances, while in summer the whistling wings of the common goldeneye echo over Lake Gutulisjøen and fortunate visitors may spot an [osprey](/especie/pandion_haliaetus/). Around one hundred bird species have been recorded, including willow ptarmigan and [western capercaillie](/especie/tetrao_urogallus/).\r\n\r\nWild reindeer disappeared from the district around 1880, but domestic reindeer belonging to the Southern Sami still roam these slopes: the entire area constitutes summer grazing pastures for the Svahken sitje, Norway's southernmost Sami reindeer-herding district. In spring, during calving, wildlife is exceedingly sensitive to human disturbance."
    visit: "You can drive directly to the park trailhead beside Lake Gutulisjøen, which features parking, information boards, benches, and designated campfire sites. The historic Stallen barn houses an exhibition about the park. From there, a marked nature trail leads 3 km to Gutulisetra, the traditional mountain dairy meadow: roughly 45 minutes on foot.\r\n\r\nAt Gutulisetra begins more immersive exploring. An interpretive loop of 1.5 km with more than 20 stations highlights the giant spruce Storgrana, wolf lichens, wildlife traces, and pastoral history. At the upper hamlet of Oppåvollen, a small exhibit recounts seasonal seter life over 200 years, with an on-site summer host answering visitor queries. If you want panoramic views, Mount Jyltingsvola at 874 m lies just 3.8 km from Gutulisetra: its summit commands sweeping vistas across Femundsmarka to the north, Sweden to the east, and Mount Sølen to the west. The ascent starts from the bridge over the River Gutua, climbing steadily through ancient forest to the tundra crest.\r\n\r\nBeyond these paths, the park maintains no manicured trails, allowing you to wander across untouched primeval forest on foot or touring skis wherever you please. In Elgå, the joint visitor centre for Femundsmarka and Gutulia features exhibitions on local heritage, Sami reindeer husbandry, and wildlife."
    history: "The name derives from guttu, «path», and li, «forested slope»: historic traders navigated the frozen rivers and lakes with horse and sleigh toward the winter market in Røros. Later, beginning in the mid-eighteenth century, farming families from Lillebo and Sorken brought dairy cattle here every summer until 1949. Between 1975 and 1983, the 16 historic log cabins were restored using traditional log-building techniques.\r\n\r\nThe earliest conservation proposals for Gutulia, prompted by its ancient pine stands, date to 1916. The national park was officially established on 20 December 1968 encompassing around 18 km²; in 2004 it was expanded to protect its current 22,563 km². Following the expansion of tiny Ormtjernkampen into Langsua in 2011, Gutulia became Norway's smallest national park. Since 1990 its ecosystem has been monitored under the Terrestrisk naturovervåking national programme, tracking long-range transboundary air pollutants."
    before: >-
      Between 15 April and 15 September open campfires are prohibited, except in designated spots where fire
      spread is impossible; designated camping sites with firewood and dry toilets are situated along the
      southeastern shore of Lake Gutulisjøen. All timber, standing or dead, is legally protected. Dogs must be
      kept on a leash from 1 April to 20 August. Check ahead for summer dairy schedules, as facilities and
      guided tours vary from year to year.
    around: >-
      About five kilometres away lies [Femundsmarka National Park](/lugar/femundsmarka-nasjonalpark/), with
      which it shares the visitor centre at Elgå. Further north, [Urho Kekkonen National
      Park](/lugar/urho-kekkonen-national-park/), [Hamra National Park](/lugar/hamra-national-park/), and
      [Muddus / Muttos National Park](/lugar/muddus-national-park/) share with Gutulia three-toed woodpeckers
      and moose roaming old-growth boreal forest.
  fr:
    intro: >-
      Gutulia est le plus petit parc national de Norvège, et sa modeste superficie concentre un monde sauvage
      intact. Un peu plus de 22 km² d'épicéas et de pins sylvestres pluricentenaires, d'arbres renversés
      grouillant de vie fongique et d'insectes, avec dans un coin un contraste pastoral inattendu : des
      alpages de seter parsemés de cabanes en rondins où, pendant deux siècles, le bétail montait paître
      chaque été. Il s'étend entre Drevsjø et Elgå, à l'est du lac Femunden, au contact direct de la frontière
      suédoise.
    landscape: "C'est une forêt boréale d'altitude typique de l'est de la Norvège, s'étageant de 615 à 949 m, adossée au mont Gutulivola et bordée à l'ouest par le lac Gutulisjøen. Le sous-sol est constitué de grès très pauvre en nutriments, si bien que la végétation pousse avec une grande lenteur. Les flancs du Gutulivola portent une pinède claire ; les dépressions plus basses abritent une pessière dense jonchée d'arbres morts et de troncs couchés. La quasi-totalité du parc n'a jamais fait l'objet d'exploitations forestières.\r\n\r\nCe caractère primaire est capital. Les vieilles forêts offrent infiniment plus de niches que les boisements exploités pour le bois, soutenant de multiples espèces menacées de champignons, de lichens, de plantes et d'animaux. Des branches pendent des lichens barbus ; au sol, le bois mort foisonne de vie. Parmi les espèces caractéristiques figurent le mésangeai imitateur, le [pic tridactyle](/especie/picoides_tridactylus/), le lichen des loups et de nombreux polypores. Tous les arbres, vivants ou morts, debout ou tombés, sont strictement protégés, offrant un refuge aux invertébrés et lichens rares.\r\n\r\nLe feu a également façonné ce massif : Gutulia a connu de multiples incendies naturels au cours des âges, abritant ainsi une faune et une flore tributaires des milieux incendiés."
    wildlife: "On ne vient pas ici contempler de grands troupeaux, mais pour écouter la solitude des bois. Le pic noir et le curieux mésangeai imitateur sont les hôtes les plus faciles à observer. Parmi les passereaux communs figurent le pinson du Nord, le pipit des arbres et le pouillot fitis. Presque toute la faune boréale fréquente ces forêts : l'[élan](/especie/alces_alces/), le chevreuil, le renard roux, la [martre des pins](/especie/martes_martes/), le vison, le [castor d'Europe](/especie/castor_fiber/) et la [loutre](/especie/lutra_lutra/). L'[ours brun](/especie/ursus_arctos/) y fait de discrètes apparitions, et en été le sifflement d'ailes du garrot à œil d'or résonne sur le lac Gutulisjøen, avec la chance d'apercevoir un [balbuzard pêcheur](/especie/pandion_haliaetus/). Une centaine d'espèces d'oiseaux y sont recensées, dont le lagopède des saules et le [grand tétras](/especie/tetrao_urogallus/).\r\n\r\nLe renne sauvage a disparu de la région vers 1880, mais des hardes de rennes domestiques des Samis du Sud arpentent toujours les lieux : toute la zone constitue les pâturages d'été de Svahken sitje, la communauté d'élevage sami la plus méridionale de Norvège. Au printemps, lors de la mise bas, la faune se révèle particulièrement vulnérable aux dérangements."
    visit: "On accède en voiture jusqu'au stationnement situé au bord du lac Gutulisjøen, pourvu de panneaux d'information, de bancs et d'aires à feu. Le bâtiment Stallen abrite une exposition sur le parc. De là, un sentier naturel de 3 km mène aux chalets d'alpage de Gutulisetra : environ 45 minutes de marche.\r\n\r\nÀ Gutulisetra s'amorce la découverte approfondie du site. Une boucle d'interprétation de 1,5 km jalonnée de plus de 20 stations permet de découvrir le grand épicéa Storgrana, le lichen des loups et les vestiges pastoraux. Dans la partie haute de l'alpage, à Oppåvollen, une exposition retrace la vie pastorale montagnarde au fil de 200 ans, un hôte répondant aux questions des randonneurs en saison estivale. Si vous souhaitez profiter d'un panorama étendu, le sommet du Jyltingsvola, culminant à 874 m, n'est qu'à 3,8 km de Gutulisetra : la vue embrasse Femundsmarka au nord, la Suède à l'est et le mont Sølen à l'ouest. La montée s'engage au pont sur la Gutua et traverse la vieille forêt en pente régulière jusqu'à la crête.\r\n\r\nEn dehors de ces aménagements, le parc est dépourvu de sentiers balisés, permettant d'explorer une taïga primitive et intacte, à pied ou en skis de randonnée. À Elgå, le centre d'accueil commun aux parcs nationaux de Femundsmarka et Gutulia présente la culture locale, l'élevage sami du renne et la faune."
    history: "Le toponyme provient de guttu (« chemin ») et li (« versant boisé ») : les colporteurs empruntaient les lacs et rivières gelés à traîneau tiré par des chevaux, notamment vers la foire hivernale de Røros. Plus tard, à partir du milieu du XVIIIe siècle, les fermiers de Lillebo et Sorken y montèrent leurs troupeaux chaque été jusqu'en 1949. Entre 1975 et 1983, les 16 chalets de troncos furent restaurés selon les techniques artisanales d'autrefois.\r\n\r\nLes premières démarches de protection de Gutulia, motivées par ses pins monumentaux, remontent à 1916. Le parc fut institué le 20 décembre 1968 sur environ 18 km² ; en 2004 il fut étendu pour englober ses 22,563 km² actuels. Depuis l'intégration de la réserve d'Ormtjernkampen dans le parc de Langsua en 2011, Gutulia est le plus petit parc national de Norvège. Depuis 1990, son écosystème fait l'objet d'un suivi scientifique dans le cadre du programme Terrestrisk naturovervåking, mesurant l'impact des polluants atmosphériques à longue distance."
    before: >-
      Du 15 avril au 15 septembre, les feux ouverts sont rigoureusement interdits en dehors des emplacements
      aménagés ; des zones de bivouac pourvues de bois et de latrines sèches sont établies au sud-est du lac
      Gutulisjøen. Tous les arbres, vivants ou morts, sont strictement protégés. Les chiens doivent
      impérativement être tenus en laisse du 1er avril au 20 août. Renseignez-vous au préalable sur les
      animations estivales de la seter, les visites guidées variant selon les années.
    around: >-
      À environ cinq kilomètres s'étend le [parc national de Femundsmarka](/lugar/femundsmarka-nasjonalpark/),
      avec lequel il partage le centre d'accueil d'Elgå. Plus au nord, le [parc national Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), le [parc national de Hamra](/lugar/hamra-national-park/)
      et le [parc national de Muddus / Muttos](/lugar/muddus-national-park/) partagent avec Gutulia la
      présence du pic tridactyle et de l'élan en forêt primaire boréale.
  de:
    intro: >-
      Gutulia ist Norwegens kleinster Nationalpark, und seine Überschaubarkeit bedeutet, dass sich eine ganze
      Naturwelt auf engstem Raum versammelt. Gut 22 km² Fichten und Waldkiefern, die viele Jahrhunderte
      überdauert haben, umgestürzte Bäume, in deren morschem Holz Insekten, Pilze und Flechten gedeihen, und
      in einer Ecke ein unerwarteter kulturhistorischer Kontrast: Seter-Almwiesen mit traditionellen
      Blockhütten, auf die zwei Jahrhunderte lang jeden Sommer Vieh zum Weiden getrieben wurde. Der Park liegt
      zwischen Drevsjø und Elgå östlich des Femundsees und stößt direkt an die schwedische Grenze.
    landscape: "Es ist ein typischer hochgelegener Nadelwald des östlichen Norwegens: Das Höhenprofil reicht von 615 bis 949 m, mit dem Gutulivola im Zentrum und dem See Gutulisjøen im Westen. Der Untergrund besteht überwiegend aus nährstoffarmem Sandstein, sodass die Vegetation langsam und knorrig wächst. Die Hänge des Gutulivola tragen lichten Kiefernwald; die tieferen Lagen dichten Fichtenwald voller Totholz und Windwurfflächen. Fast der gesamte Park wurde forstwirtschaftlich nie angetastet.\r\n\r\nDieser Urwaldcharakter ist von unschätzbarem Wert. Alte Naturwälder bieten unvergleichlich mehr ökologische Nischen als Wirtschaftswälder und sichern das Überleben zahlreicher bedrohter Pilz-, Flechten-, Pflanzen- und Tierarten. An den Ästen hängen Bartflechten; am Boden wimmelt Totholz von verborgenem Leben. Zu den Leitarten gehören Unglückshäher, [Dreizehenspecht](/especie/picoides_tridactylus/), Wolfsflechte und seltene Porlinge. Sämtliche Bäume des Parks, stehend oder liegend, lebend oder tot, sind geschützt; Totholz dient Insekten und seltenen Flechten als unverzichtbarer Lebensraum.\r\n\r\nAuch Waldbrände haben ihre Signatur hinterlassen: Gutulia erlebte über die Jahrtausende hinweg immer wieder natürliche Feuer und bietet daher feuerangepassten Spezialisten Rückzugsräume."
    wildlife: "Man kommt nicht hierher, um große Herden zu suchen, sondern um der Stille zu lauschen. Der Schwarzspecht und der neugierige Unglückshäher sind die am leichtesten zu beobachtenden Bewohner. Zu den häufigsten Vögeln zählen Bergfink, Baumpieper und Fitis. Im Wald streifen fast alle typischen Waldtiere umher: [Elch](/especie/alces_alces/), Reh, Rotfuchs, [Baummarder](/especie/martes_martes/), Nerz, [Biber](/especie/castor_fiber/) und [Fischotter](/especie/lutra_lutra/). Der [Braunbär](/especie/ursus_arctos/) zieht gelegentlich durch, im Sommer pfeift der Flügelschlag der Schellente über den Gutulisjøen und mit etwas Glück lässt sich ein [Fischadler](/especie/pandion_haliaetus/) erspähen. Rund einhundert Vogelarten sind nachgewiesen, darunter Moorschneehuhn und [Auerhuhn](/especie/tetrao_urogallus/).\r\n\r\nDas wilde Rentier verschwand um 1880 aus der Gegend, doch weiden hier zahme Rentiere der Südsami: Das gesamte Gebiet dient den Züchtern von Svahken sitje, der südlichsten samischen Rentierweidegemeinschaft Norwegens, als traditionelle Sommerweide. Im Frühjahr während der Kalbzeit reagiert das Wild besonders empfindlich auf Störungen."
    visit: "Man erreicht mit dem Auto den Parkplatz am Ufer des Gutulisjøen mit Informationstafeln, Rastbänken und Feuerstellen. Im Gebäude Stallen informiert eine Ausstellung über den Park. Von dort führt ein 3 km langer Naturpfad zur Almwiese Gutulisetra: etwa 45 Gehminuten.\r\n\r\nIn Gutulisetra beginnt das eigentliche Erkunden. Ein 1,5 km langer Lehrpfad mit mehr als 20 Stationen führt zur mächtigen Fichte Storgrana, zu Wolfsflechten, Tierspuren und Almgemäuern. Im oberen Almdorf Oppåvollen dokumentiert eine kleine Ausstellung das Leben auf den Almen über 200 Jahre hinweg; im Sommer steht ein Betreuer für Fragen bereit. Wenn du Weitblicke suchst, ist der Gipfel des Jyltingsvola mit 874 m nur 3,8 km von Gutulisetra entfernt: Von oben blickt man nach Norden auf Femundsmarka, nach Osten nach Schweden und nach Westen zum Sølen. Der Aufstieg beginnt an der Holzbrücke über die Gutua und zieht gleichmäßig durch den Urwald bergan.\r\n\r\nAbseits dieser Bereiche besitzt der Park keine markierten Wanderwege; man erkundet den unberührten Wald zu Fuß oder auf Tourenski nach eigenem Ermessen. In Elgå befindet sich das Besucherzentrum für die Nationalparks Femundsmarka und Gutulia mit Ausstellungen zu Lokalgeschichte, samischer Rentierwirtschaft und Natur."
    history: "Der Name geht auf guttu («Weg») und li («bewaldeter Hang») zurück: Händler nutzten die zugefrorenen Gewässer im Winter mit Pferdeschlitten, etwa auf dem Weg zum Markt von Røros. Später, ab Mitte des achtzehnten Jahrhunderts, trieben Bauern der Höfe Lillebo und Sorken jeden Sommer ihr Vieh hierher auf die Almweide, eine Tradition, die bis 1949 andauerte. Zwischen 1975 und 1983 wurden die 16 historischen Blockhütten mit traditioneller Handwerkstechnik saniert.\r\n\r\nErste Vorschläge, Gutulia wegen seiner monumentalen Kiefern unter Schutz zu stellen, stammen von 1916. Der Nationalpark wurde am 20. Dezember 1968 mit rund 18 km² gegründet; im Jahr 2004 wurde er erweitert und umfasst heute 22,563 km². Seit der kleine Ormtjernkampen 2011 im Langsua-Nationalpark aufging, ist Gutulia der kleinste Nationalpark Norwegens. Seit 1990 wird das Ökosystem im Rahmen des Programms Terrestrisk naturovervåking kontinuierlich auf Weitbereichs-Luftschadstoffe überwacht."
    before: >-
      Vom 15. April bis zum 15. September ist offenes Feuer verboten, ausgenommen an Stellen, wo ein
      Übergreifen offensichtlich ausgeschlossen ist; ausgewiesene Rastplätze mit Feuerholz und Trockentoilette
      befinden sich am Südostufer des Gutulisjøen. Sämtliche Bäume, lebend oder tot, stehen unter Schutz.
      Hunde müssen vom 1. April bis zum 20. August strikt angeleint werden. Erkundige dich vorab über das
      Sommerprogramm der Alm, da Angebote und Führungen saisonal variieren.
    around: >-
      Rund fünf Kilometer entfernt erstreckt sich der
      [Femundsmarka-Nationalpark](/lugar/femundsmarka-nasjonalpark/), mit dem sich Gutulia das Besucherzentrum
      in Elgå teilt. Weiter nördlich teilen der
      [Urho-Kekkonen-Nationalpark](/lugar/urho-kekkonen-national-park/), der
      [Hamra-Nationalpark](/lugar/hamra-national-park/) und der [Nationalpark Muddus /
      Muttos](/lugar/muddus-national-park/) mit Gutulia Dreizehenspecht und Elch in borealen Urwäldern.
  it:
    intro: >-
      Gutulia è il parco nazionale più compatto della Norvegia, e la sua estensione ridotta fa sì che un
      intero universo silvestre trovi posto in pochissimo spazio. Poco più di 22 km² di abeti rossi e pini
      silvestri plurisecolari, di colossi abbattuti brulicanti di funghi, licheni e insetti, e in un recesso
      un contrasto pastorale inatteso: radure di seter punteggiate da baite di tronchi dove per due secoli il
      bestiame saliva a pascolare ogni estate. Si colloca tra Drevsjø ed Elgå, a oriente del lago Femunden,
      toccando il confine svedese.
    landscape: "È una taiga montana tipica della Norvegia orientale, con quote comprese tra 615 e 949 m, dominata al centro dal monte Gutulivola e affacciata a ovest sul lago Gutulisjøen. Il suolo poggia su arenarie povere di sostanze nutritive, ragion per cui la vegetazione cresce con estrema lentezza. I versanti del Gutulivola ospitano pinete aperte; le quote basali accolgono fitte peccete costellate di schianti e tronchi caduti. Quasi l'intera superficie del parco non ha mai conosciuto disboscamenti produttivi.\r\n\r\nQuesta integrità primigenia è fondamentale. Le foreste vetuste offrono un ventaglio di nicchie ecologiche incomparabilmente superiore a quello dei boschi coltivati, sostenendo specie minacciate di funghi, licheni, piante e animali. Dai rami pendono licheni filamentosi; al suolo il legno morto fermenta di vita. Tra le specie più rappresentative spiccano la ghiandaia siberiana, il [picchio tridattilo](/especie/picoides_tridactylus/), il lichene dei lupi e funghi polipori. Ogni singolo albero, vivo o schiantato, in piedi o a terra, gode di tutela assoluta, costituendo dimora per insetti e crittogame rare.\r\n\r\nAnche il fuoco ha lasciato la sua impronta: Gutulia ha subito incendi boschivi naturali a più riprese, ospitando specie legate all'ecologia del fuoco."
    wildlife: "Non si viene a Gutulia per scorgere grandi branchi, ma per ascoltare la quiete del bosco. Il picchio nero e la curiosa ghiandaia siberiana sono gli abitatori più facili da avvicinare. Tra i passeriformi comuni spiccano la peppola, il prispolone e il luì fitis. Nel fitto del bosco compaiono quasi tutti i mammiferi della taiga: [alce](/especie/alces_alces/), capriolo, volpe rossa, [martora](/especie/martes_martes/), visone, [castoro](/especie/castor_fiber/) e [lontra](/especie/lutra_lutra/). L'[orso bruno](/especie/ursus_arctos/) vi compie saltuarie apparizioni, e in estate il frullo del quattrocchi si propaga sulle acque del Gutulisjøen, con la possibilità di avvistare un [falco pescatore](/especie/pandion_haliaetus/). Sono segnalate circa cento specie di uccelli, compresi la pernice bianca nordica e l'[urogallo](/especie/tetrao_urogallus/).\r\n\r\nLa renna selvatica si estinse in quest'area attorno al 1880, ma sui pascoli montani si incontrano le renne domestiche dei Sami meridionali: il comprensorio costituisce il pascolo estivo di Svahken sitje, il distretto di allevamento sami più a sud della Norvegia. In primavera, nel periodo dei parti, la fauna selvatica è particolarmente vulnerabile alle interferenze."
    visit: "Si giunge in automobile fino al parcheggio d'accesso presso la sponda del Gutulisjøen, dotato di bacheche, panche e punti fuoco. Nell'edificio storico Stallen è allestita una mostra sul parco. Da lì si snoda un sentiero naturalistico di 3 km fino a Gutulisetra, il nucleo delle malghe alpine: circa 45 minuti di cammino.\r\n\r\nA Gutulisetra ha inizio la perlustrazione della conca. Un percorso didattico di 1,5 km con oltre 20 tappe consente di ammirare l'abete secolare Storgrana, i licheni dei lupi e i manufatti pastorali. Nella parte alta dell'alpeggio, a Oppåvollen, un'esposizione ripercorre la vita estiva delle baite lungo l'arco di 200 anni, con un custode presente in estate per fornire chiarimenti. E se vuoi ammirare ampi panorami, la vetta del monte Jyltingsvola, a quota 874 m, dista appena 3,8 km da Gutulisetra: dalla cima lo sguardo spazia verso Femundsmarka a nord, la Svezia a est e il massiccio del Sølen a ovest. La salita parte dal ponte sul fiume Gutua e risale la foresta vetusta con pendenza regolare.\r\n\r\nAl di fuori di questi itinerari, il parco non possiede sentieri tracciati, consentendo di percorrere la taiga vergine a piedi o con gli sci secondo le proprie preferenze. A Elgå sorge il centro visitatori comune dei parchi nazionali di Femundsmarka e Gutulia, con sezioni dedicate alle tradizioni locali, all'allevamento delle renne e alla fauna."
    history: "Il toponimo deriva da guttu («sentiero») e li («pendio boscato»): mercanti e viandanti percorrevano d'inverno i fiumi e i laghi ghiacciati con slitte e cavalli verso la fiera di Røros. Successivamente, a partire dalla metà del secolo XVIII, i contadini dei poderi di Lillebo e Sorken condussero il bestiame all'alpeggio estivo fino al 1949. Tra il 1975 e il 1983 le 16 baite di tronchi furono restaurate mediante antiche tecniche di carpenteria.\r\n\r\nLe prime proposte di salvaguardia di Gutulia risalgono al 1916, incentrate sui suoi monumentali pini. Il parco fu istituito il 20 dicembre 1968 con un'estensione originaria di circa 18 km²; nel 2004 venne ampliato fino a raggiungere gli attuali 22,563 km². In seguito all'inglobamento del minuscolo Ormtjernkampen nel parco di Langsua nel 2011, Gutulia è il parco nazionale più piccolo della Norvegia. Dal 1990 il suo ecosistema è monitorato dal programma Terrestrisk naturovervåking per studiare gli effetti dei contaminanti atmosferici a lungo raggio."
    before: >-
      Dal 15 aprile al 15 settembre è proibito accendere fuochi liberi, eccetto laddove il fuoco non possa
      assolutamente propagarsi; piazzole attrezzate con legnaia e latrine a secco si trovano sulla riva
      sud-orientale del Gutulisjøen. Ogni pianta, viva o morta, è rigorosamente protetta. I cani devono essere
      tenuti al guinzaglio dal 1° aprile al 20 agosto. Si consiglia di verificare il calendario delle attività
      estive dell'alpeggio, poiché visite e aperture possono variare.
    around: >-
      A circa cinque chilometri si trova il [Parco Nazionale di
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/), con il quale Gutulia condivide il centro visite di
      Elgå. Più a nord, il [Parco Nazionale Urho Kekkonen](/lugar/urho-kekkonen-national-park/), il [Parco
      Nazionale di Hamra](/lugar/hamra-national-park/) e il [Parco Nazionale di Muddus /
      Muttos](/lugar/muddus-national-park/) condividono con Gutulia la presenza del picchio tridattilo e
      dell'alce nella foresta primaria boreale.
  pt:
    intro: >-
      Gutulia é o parque nacional mais pequeno da Noruega, e a sua escala reduzida concentra um mundo selvagem
      inteiro num espaço diminuto. Pouco mais de 22 km² de espruces e pinheiros-silvestres que perduram há
      centenas de anos, árvores caídas que continuam vivas por dentro repletas de insetos, fungos e líquenes
      e, a um canto, um contraponto pastoril inesperado: campinas de seter com cabanas de troncos onde durante
      dois séculos o gado subia para pastar a cada verão. Situa-se entre Drevsjø e Elgå, a leste do lago
      Femunden, confinando com a fronteira sueca.
    landscape: "Trata-se de uma taiga montana representativa do leste da Noruega: desenvolve-se entre os 615 e os 949 m de altitude, com o monte Gutulivola no centro e o lago Gutulisjøen a poente. O solo é dominado por arenitos pobres em nutrientes, pelo que a vegetação medra com extrema lentidão. As encostas do Gutulivola acolhem pinhais abertos; os vales mais baixos albergam espruciais densos pejados de madeira morta e árvores caídas. A quase totalidade do parque nunca foi alvo de cortes madeireiros.\r\n\r\nEsse caráter primitivo é de extrema importância. As florestas antigas oferecem muito mais nichos ecológicos do que os bosques explorados para fins madeireiros, albergando espécies ameaçadas de fungos, líquenes, plantas e animais. Dos ramos pendem líquenes-barbados; no solo, a madeira morta fervilha de vida oculta. Entre as espécies características contam-se a gaio-siberiano, o [pica-pau-tridáctilo](/especie/picoides_tridactylus/), o líquen-do-lobo e fungos políporos. Todas as árvores do parque, vivas ou mortas, em pé ou caídas, estão sob proteção integral; os troncos mortos fornecem abrigo a insetos e líquenes raros.\r\n\r\nO fogo também moldou esta paisagem: Gutulia sofreu incêndios florestais naturais com regularidade ao longo dos milénios, acolhendo espécies adaptadas à ecologia do fogo."
    wildlife: "Não se vem aqui à procura de grandes manadas, mas sim para escutar o silêncio. O pica-pau-preto e a curiosa gaio-siberiano são os habitantes alados mais fáceis de encontrar. Entre os passeriformes comuns contam-se o tentilhão-montês, a petinha-dos-prados e o felosa-musical. No bosque ocorrem quase todos os mamíferos boreais: [alce](/especie/alces_alces/), corço, raposa-vermelha, [marta](/especie/martes_martes/), visão, [castor](/especie/castor_fiber/) e [lontra](/especie/lutra_lutra/). O [urso-pardo](/especie/ursus_arctos/) surge esporadicamente, e no verão escuta-se o sibilo do pato-olho-d'ouro sobre as águas do Gutulisjøen, com a possibilidade de avistar uma [águia-pesqueira](/especie/pandion_haliaetus/). Registam-se cerca de cem espécies de aves, entre elas a lagópode-escocesa e o [tetraz-grande](/especie/tetrao_urogallus/).\r\n\r\nO rena-selvagem desapareceu da região por volta de 1880, mas ainda se cruzam renas domésticas dos Sami meridionais: toda a área constitui pastagem de verão dos criadores de Svahken sitje, o distrito de pastoreio sami mais a sul da Noruega. Na primavera, durante a época de parto, a fauna é especialmente vulnerável a perturbações."
    visit: "Chega-se de automóvel até ao parque de estacionamento junto à margem do Gutulisjøen, dotado de painéis, bancos e zonas para fogueiras. No edifício histórico Stallen existe uma exposição sobre o parque. A partir daí percorrem-se 3 km por um trilho natural até Gutulisetra, o conjunto de cabanas de montanha: cerca de 45 minutos a pé.\r\n\r\nEm Gutulisetra principia o passeio mais aprofundado. Um trilho interpretativo de 1,5 km com mais de 20 pontos de paragem permite observar o grande espruce Storgrana, o líquen-do-lobo e os vestígios pastoris. Na parte superior da seter, Oppåvollen, uma pequena mostra relata a vivência nas cabanas ao longo de 200 anos, com um guia presente no verão para esclarecer dúvidas. E se quiseres vistas panorâmicas, o cume do Jyltingsvola, com 874 m, dista apenas 3,8 km de Gutulisetra: do alto descortina-se Femundsmarka a norte, a Suécia a nascente e o maciço do Sølen a poente. A ascensão principia na ponte de madeira sobre o rio Gutua e sobe a floresta antiga em declive contínuo até ao topo.\r\n\r\nPara lá desses percursos, o parque não dispõe de caminhos balizados, possibilitando explorar a floresta virgem a pé ou em esquis de fundo por onde se desejar. Em Elgå situa-se o centro de acolhimento conjunto dos parques nacionais de Femundsmarka e Gutulia, com exposições sobre história local, pastorícia sami de renas e vida selvagem."
    history: "A designação provém de guttu («caminho») e li («encosta florestada»): os almocreves viajavam pelos rios e lagos gelados em trenós puxados a cavalo, demandando por exemplo o mercado invernal de Røros. Mais tarde, a partir de meados do século XVIII, os camponeses das herdades de Lillebo e Sorken conduziam o gado para as pastagens estivais até 1949. Entre 1975 e 1983 procedeu-se ao restauro das 16 cabanas de troncos segundo métodos artesanais tradicionais.\r\n\r\nAs propostas pioneiras de proteção de Gutulia, motivadas pelos seus imponentes pinheiros, datam de 1916. O parque foi instituído a 20 de dezembro de 1968 com cerca de 18 km²; em 2004 foi alargado, abrangendo hoje 22,563 km². Desde que a pequena reserva de Ormtjernkampen foi integrada no Parque Nacional de Langsua em 2011, Gutulia tornou-se o mais pequeno parque nacional da Noruega. Desde 1990 o seu ambiente é acompanhado pelo programa Terrestrisk naturovervåking, que quantifica a deposição de poluentes atmosféricos transfronteiriços."
    before: >-
      De 15 de abril a 15 de setembro é proibido acender fogueiras, salvo onde o fogo não possa manifestamente
      propagar-se; existem zonas de acampamento equipadas com lenha e sanitários secos a sudeste do lago
      Gutulisjøen. Todas as árvores, vivas ou mortas, encontram-se protegidas por lei. Os cães devem circular
      obrigatoriamente com trela de 1 de abril a 20 de agosto. Informa-te antecipadamente sobre o programa de
      verão da seter, dado que os serviços e passeios guiados variam a cada temporada.
    around: >-
      A cerca de cinco quilómetros situa-se o [Parque Nacional de
      Femundsmarka](/lugar/femundsmarka-nasjonalpark/), com o qual partilha o centro de visitantes em Elgå.
      Mais a norte, o [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/), o [Parque Nacional
      de Hamra](/lugar/hamra-national-park/) e o [Parque Nacional de Muddus /
      Muttos](/lugar/muddus-national-park/) partilham com Gutulia a presença do pica-pau-tridáctilo e do alce
      em floresta primária boreal.
