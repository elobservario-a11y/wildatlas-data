resumen:
  es: >-
    Cordillera suave boscosa de los Sudetes Centrales protegiendo turberas elevadas en la frontera
    checo-polaca.
  en: Gentle forested Sudetes ridge protecting raised bogs on the Czech-Polish border.
  fr: Doux versant boisé des Sudètes centraux protégeant des tourbières bombées à la frontière tchéco-polonaise.
  de: Sanfter bewaldeter Mittelsudetenkamm mit Hochmooren an der tschechisch-polnischen Grenze.
  it: Dolce catena boscosa dei Sudeti Centrali con torbiere alte al confine ceco-polacco.
  pt: Suave cordilheira boscosa dos Sudetos Centrais que protege turfeiras elevadas na fronteira checo-polaca.
unico:
  es: >-
    Una montaña de lomos redondeados cuyo emblema es una flor, la campanilla de primavera, y donde el lobo ha
    vuelto a quedarse.
  en: >-
    A mountain of rounded ridges whose emblem is a flower, the spring snowflake, and where the wolf has
    returned to stay.
  fr: >-
    Une montagne aux crêtes arrondies dont l'emblème est une fleur, le nivéole de printemps, et où le loup est
    revenu s'établir.
  de: >-
    Ein Gebirge mit gerundeten Kämmen, dessen Wahrzeichen eine Blume ist — das Frühlings-Knotenblümchen — und
    wo der Wolf zurückgekehrt ist.
  it: >-
    Una montagna di crinali arrotondati il cui emblema è un fiore, il campanellino di primavera, e dove il
    lupo è tornato a insediarsi.
  pt: >-
    Uma montanha de cumeadas arredondadas cujo emblema é uma flor, o nivéolo de primavera, e onde o lobo
    voltou a instalar-se.
observaciones:
  es: >-
    Las normas del gestor son concretas. En todo el paisaje protegido está prohibido entrar o aparcar con
    vehículos a motor fuera de carreteras, calles locales y lugares habilitados, y en las pistas forestales
    está prohibida la entrada. Los arándanos, las setas y otros frutos del bosque solo se recogen fuera de las
    áreas protegidas pequeñas. Los límites de las reservas se marcan con rayas rojas en los árboles: dos
    rayas, entras; una raya, sales. Los paneles de los senderos se instalan solo de primavera a otoño, salvo
    en Zemská brána.
texto:
  es:
    intro: >-
      Desde lejos, Orlické hory parecen una muralla de bosque tendida sobre Bohemia, un muro liso y sin picos.
      Acércate y la muralla se abre: aparece un lomo plano sin cumbres marcadas, cortado por valles profundos
      llenos de arroyos y ríos. Es el borde checo de una montaña fronteriza que se curva sobre el Divoká
      Orlice, y su paisaje protegido, de 204 km², llega a los 1115 metros entre mosaicos de turberas, prados
      húmedos floridos, pastos de montaña y bosque. Con ese relieve manso y esa mezcla de hábitats, es una
      montaña para caminar despacio.
    landscape: >-
      El bosque lo domina todo: cubre más de dos tercios del paisaje protegido. Sin la mano humana, lo que
      crecería aquí serían hayas y, en las partes altas, bosques de picea de montaña; pero el uso humano de la
      montaña cambió esa receta.


      La historia explica el resto. El paisaje y la naturaleza están marcados por el uso de recursos: vidrio,
      talleres textiles y minería. Un hito fue la expulsión de los alemanes de Bohemia tras la guerra y la
      repoblación forestal de tierras agrícolas abandonadas. En los años ochenta una calamidad por
      contaminación hundió grandes superficies de bosque de montaña, y en algunos sitios el bosque original se
      sustituyó mal por especies no autóctonas, como el pino mugo o la picea pungente. Hoy se trabaja por
      restaurar el régimen natural del agua y por bosques de composición más natural.


      En las flores se nota que no hay cumbres alpinas. A diferencia de Krkonoše, Jeseníky o Králický Sněžník,
      aquí falta el bosque natural sobre el límite arbóreo, y la flora tiene menos endemismos y relictos
      glaciares. Lo compensan los prados, que son obra humana: sin pastoreo o siega, se cubrirían de árboles.
      Y entre todas las flores destaca la campanilla de primavera, que crece en grandes extensiones y es el
      emblema del paisaje protegido.
    wildlife: >-
      Empieza por el agua. En los torrentes del Divoká Orlice, Bílá, Říčka y Zdobnice abundan la lamprea de
      arroyo y la vranka obecná; sobre ellos vuelan con frecuencia el [mirlo
      acuático](/especie/cinclus_cinclus/) y el [martín pescador](/especie/alcedo_atthis/), y la
      [nutria](/especie/lutra_lutra/) cava su madriguera en las orillas. En charcas y estanques se reproducen
      la rana bermeja, el sapo común y el tritón alpestre.


      Los prados húmedos son el territorio de las aves. Hay [guión de codornices](/especie/crex_crex/), cuyo
      reclamo, un constante «krex krex», se oye en las noches de verano, y la agachadiza común, el alcaudón
      dorsirrojo, el bramborníček hnědý, la linduška luční, el hýl rudý, el strnad luční y la [grulla
      común](/especie/grus_grus/). Para proteger al guión de codornices se declaró la zona de aves Orlické
      Záhoří. La mariposa modrásek bahenní, protegida en toda Europa, necesita la sanguisorba y las hormigas
      Myrmica, y por eso depende de que los prados se sieguen con cuidado.


      En el bosque profundo anidan el [búho real](/especie/bubo_bubo/) y la [cigüeña
      negra](/especie/ciconia_nigra/), y en huecos de árbol el [pito negro](/especie/dryocopus_martius/), el
      mochuelo boreal y la paloma zurita. Los murciélagos usan esos mismos huecos, sobre todo el netopýr
      severní, el černý, el ušatý y el vodní.


      La novedad es el [lobo](/especie/canis_lupus/): según el gestor, se ha asentado de forma permanente en
      Orlické hory desde 2020, un animal que antes pertenecía más al mundo de las leyendas. El gestor pide
      datos verificables, como fototrampeo o huellas con lugar y fecha, para el seguimiento.
    visit: >-
      La columna vertebral es la Jiráskova cesta, una ruta marcada de 42 km por la cresta principal del
      paisaje protegido, que pasa cerca de los mejores sitios de la montaña. Entra en el paisaje protegido en
      Zelené údolí, cerca de Olešnice v Orlických horách, y sube al mirador de Vrchmezí. Cerca de la frontera
      cruza la reserva nacional Bukačka, llamada el jardín botánico de Orlické hory por sus prados de montaña,
      y pasa junto al mirador de Velká Deštná, de 1115 m. Su tramo final atraviesa la reserva natural Zemská
      brána.


      Hay cuatro senderos educativos. Zemská brána mide menos de 2,5 km y atraviesa la reserva por el valle
      del Divoká Orlice; tiene 10 paradas con paneles y elementos interactivos para niños, y es el único cuyos
      paneles están todo el año. Bedřichovka, de menos de 3 km, es una ruta de aves: es apta para pie y bici y
      parte de la cabaña de montaña del mismo nombre, donde el sendero se ramifica, con 8 paradas sobre la
      zona de aves Orlické Záhoří, los prados húmedos, el río y la historia del poblamiento. Okolím Deštného
      son unos 17 km en dos circuitos enlazados, casi siempre paralelos al marcado turístico, con paradas
      sobre la flora y los bosques primarios de Sedloňovský vrch y Bukačka. Y el sendero de la cresta, de unos
      15 km a pie y 19 km en bici, va junto a la Jiráskova cesta desde el collado bajo Šerlich hasta Mezivrší;
      se hace en bici en verano y con esquís de fondo en invierno.
    history: >-
      La red Natura 2000 comprende aquí cinco lugares de importancia comunitaria y una zona de protección de
      aves. El paisaje protegido coincide por completo con la zona de acumulación natural de aguas CHOPAV,
      declarada en 1978. En Černý důl, una reserva natural, el núcleo es un bosque primario dejado a su
      evolución espontánea.
    before: >-
      Las normas del gestor son concretas. En todo el paisaje protegido está prohibido entrar o aparcar con
      vehículos a motor fuera de carreteras, calles locales y lugares habilitados, y en las pistas forestales
      está prohibida la entrada. Los arándanos, las setas y otros frutos del bosque solo se recogen fuera de
      las áreas protegidas pequeñas. Los límites de las reservas se marcan con rayas rojas en los árboles: dos
      rayas, entras; una raya, sales. Los paneles de los senderos se instalan solo de primavera a otoño, salvo
      en Zemská brána.
    around: >-
      La [reserva natural Peklo](/lugar/prirodni-rezervace-peklo-nove-mesto/) está a unos seis kilómetros y
      [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/), a unos diecisiete.
  en:
    intro: >-
      From a distance, Orlické hory looks like a wall of forest spread over Bohemia, a smooth, peak-free
      barrier. Draw closer and the wall opens: a flat ridge with no marked summits appears, cut by deep
      valleys filled with streams and rivers. This is the Czech edge of a border mountain that curves over the
      Divoká Orlice, and its protected landscape of 204 km² reaches 1115 metres across mosaics of bogs,
      flowering wet meadows, mountain pastures and forest. With such gentle relief and that mix of habitats,
      it is a mountain made for slow walking.
    landscape: >-
      Forest dominates everything: it covers more than two thirds of the protected landscape. Without human
      intervention, what would grow here are beeches and, on higher ground, montane spruce forest; but the
      human use of the mountain changed that recipe.


      History explains the rest. Landscape and nature bear the mark of resource use: glass, textile workshops
      and mining. A turning point was the expulsion of Bohemia's Germans after the war and the afforestation
      of abandoned farmland. In the eighties a pollution disaster brought down large areas of mountain forest,
      and in some places the original forest was poorly replaced by non-native species such as mountain pine
      or blue spruce. Today work is under way to restore the natural water regime and to create forests of
      more natural composition.


      The flowers show that there are no alpine summits here. Unlike Krkonoše, Jeseníky or Králický Sněžník,
      the natural forest above the treeline is absent, and the flora has fewer endemics and glacial relicts.
      The meadows make up for it — they are human-made: without grazing or mowing they would fill with trees.
      And among all the flowers the spring snowflake stands out, growing in large expanses and serving as the
      emblem of the protected landscape.
    wildlife: >-
      Start with the water. The torrents of the Divoká Orlice, Bílá, Říčka and Zdobnice are home to the brook
      lamprey and the bullhead; above them the [white-throated dipper](/especie/cinclus_cinclus/) and the
      [kingfisher](/especie/alcedo_atthis/) fly frequently, and the [otter](/especie/lutra_lutra/) digs its
      burrow in the banks. In ponds and pools the moor frog, common toad and alpine newt breed.


      Wet meadows are bird territory. You find the [corncrake](/especie/crex_crex/), whose call, a relentless
      «crex crex», is heard on summer nights, along with the common snipe, the red-backed shrike, the
      whinchat, the meadow pipit, the common rosefinch, the yellowhammer and the [common
      crane](/especie/grus_grus/). To protect the corncrake, the Orlické Záhoří bird area was designated. The
      marsh fritillary butterfly, protected across Europe, needs great burnet and Myrmica ants, and so depends
      on the meadows being mown carefully.


      Deep in the forest the [eagle owl](/especie/bubo_bubo/) and the [black stork](/especie/ciconia_nigra/)
      nest, and in tree cavities the [black woodpecker](/especie/dryocopus_martius/), the Tengmalm's owl and
      the stock dove. Bats use those same cavities, above all the northern bat, the barbastelle, the brown
      long-eared bat and the Daubenton's bat.


      The newcomer is the [wolf](/especie/canis_lupus/): according to the management authority, it has settled
      permanently in Orlické hory since 2020, an animal that before belonged more to the world of legends. The
      authority asks for verifiable data — camera-trap images or tracks with location and date — for
      monitoring.
    visit: >-
      The backbone is the Jiráskova cesta, a marked route of 42 km along the main ridge of the protected
      landscape, passing close to the best spots on the mountain. It enters the protected area at Zelené
      údolí, near Olešnice v Orlických horách, and climbs to the Vrchmezí viewpoint. Near the border it
      crosses the Bukačka national nature reserve, called the botanical garden of Orlické hory for its
      mountain meadows, and passes the Velká Deštná viewpoint at 1115 m. Its final stretch crosses the Zemská
      brána nature reserve.


      There are four nature trails. Zemská brána is under 2.5 km long and crosses the reserve through the
      Divoká Orlice valley; it has 10 stops with panels and interactive features for children, and is the only
      trail with panels up all year. Bedřichovka, under 3 km, is a bird trail: open to walkers and cyclists,
      it starts at the mountain hut of the same name, where the trail branches, with 8 stops about the Orlické
      Záhoří bird area, the wet meadows, the river and the history of settlement. Okolím Deštného covers about
      17 km in two linked loops, mostly running alongside the tourist markings, with stops on the flora and
      the ancient forests of Sedloňovský vrch and Bukačka. And the ridge trail, about 15 km on foot and 19 km
      by bike, runs beside the Jiráskova cesta from the saddle below Šerlich to Mezivrší; in summer it is done
      by bike, in winter on cross-country skis.
    history: >-
      The Natura 2000 network here covers five sites of community importance and one special protection area.
      The protected landscape coincides entirely with the CHOPAV natural water accumulation zone, designated
      in 1978. At Černý důl, a nature reserve, the core is an old-growth forest left to its own spontaneous
      development.
    before: >-
      The management rules are specific. Throughout the protected landscape it is forbidden to enter or park
      with motor vehicles off roads, local streets and designated areas, and entry on forest tracks is
      prohibited. Blueberries, mushrooms and other forest produce may only be gathered outside the small
      protected areas. Reserve boundaries are marked with red stripes on trees: two stripes means you are
      entering; one stripe means you are leaving. Trail panels are installed only from spring to autumn,
      except at Zemská brána.
    around: >-
      [Peklo nature reserve](/lugar/prirodni-rezervace-peklo-nove-mesto/) is about six kilometres away, and
      [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) about seventeen.
  fr:
    intro: >-
      De loin, Orlické hory ressemble à un mur de forêt tendu sur la Bohême, une barrière lisse et sans
      sommets. Approchez-vous et le mur s'ouvre : apparaît une crête plate sans cimes marquées, découpée par
      des vallées profondes remplies de ruisseaux et de rivières. C'est le versant tchèque d'une montagne
      frontalière qui se courbe sur la Divoká Orlice, et son paysage protégé de 204 km² s'élève jusqu'à 1115
      mètres entre des mosaïques de tourbières, de prairies humides fleuries, de pâturages de montagne et de
      forêt. Avec ce relief tranquille et ce mélange d'habitats, c'est une montagne à parcourir à pas lents.
    landscape: >-
      La forêt domine tout : elle couvre plus des deux tiers du paysage protégé. Sans intervention humaine,
      hêtres et, en altitude, forêts épicéas de montagne domineraient ; mais l'usage humain de la montagne a
      changé cette recette.


      L'histoire explique le reste. Le paysage et la nature portent la marque de l'exploitation des ressources
      : verre, ateliers textiles et mines. Un tournant fut l'expulsion des Allemands de Bohême après la guerre
      et le reboisement des terres agricoles abandonnées. Dans les années quatre-vingt, une catastrophe due à
      la pollution a détruit de grandes étendues de forêt de montagne, et dans certains endroits la forêt
      d'origine a été mal remplacée par des espèces non indigènes comme le pin de montagne ou l'épicéa bleu.
      Aujourd'hui, des efforts sont menés pour restaurer le régime naturel de l'eau et pour des forêts de
      composition plus naturelle.


      Les fleurs indiquent l'absence de sommets alpins. Contrairement à Krkonoše, Jeseníky ou Králický
      Sněžník, la forêt naturelle au-dessus de la limite forestière est absente, et la flore compte moins
      d'endémiques et de reliques glaciaires. Les prairies compensent — elles sont d'origine humaine : sans
      pâturage ni fauche, elles se couvririaient d'arbres. Et parmi toutes les fleurs, le nivéole de printemps
      se distingue, poussant en grandes étendues et servant d'emblème au paysage protégé.
    wildlife: >-
      Commencez par l'eau. Les torrents de la Divoká Orlice, de la Bílá, de la Říčka et de la Zdobnice
      abritent la lamproie de ruisseau et le chabot ; au-dessus d'eux volent fréquemment le [cincle
      plongeur](/especie/cinclus_cinclus/) et le [martin-pêcheur](/especie/alcedo_atthis/), et la
      [loutre](/especie/lutra_lutra/) creuse son terrier dans les berges. Dans les mares et étangs se
      reproduisent la grenouille des champs, le crapaud commun et le triton alpestre.


      Les prairies humides sont le territoire des oiseaux. On y trouve le [râle des
      genêts](/especie/crex_crex/), dont l'appel, un incessant «crex crex», s'entend les nuits d'été, ainsi
      que la bécassine des marais, la pie-grièche à dos roux, le tarier des prés, le pipit des prés, le
      bouvreuil cramoisi, le bruant des prés et la [grue cendrée](/especie/grus_grus/). Pour protéger le râle
      des genêts, la zone de protection des oiseaux d'Orlické Záhoří a été désignée. Le papillon azuré des
      paluds, protégé dans toute l'Europe, a besoin de la sanguisorbe et des fourmis Myrmica, et dépend donc
      d'une fauche soigneuse des prairies.


      Dans la forêt profonde nichent le [grand-duc d'Europe](/especie/bubo_bubo/) et la [cigogne
      noire](/especie/ciconia_nigra/), et dans les cavités d'arbres le [pic
      noir](/especie/dryocopus_martius/), la chouette de Tengmalm et le pigeon colombin. Les chauves-souris
      utilisent ces mêmes cavités, surtout la sérotine boréale, le grand murin, l'oreillard et le murin de
      Daubenton.


      La nouveauté est le [loup](/especie/canis_lupus/) : selon le gestionnaire, il s'est installé de façon
      permanente dans Orlické hory depuis 2020, un animal qui avant appartenait davantage au monde des
      légendes. Le gestionnaire demande des données vérifiables — images de pièges photographiques ou
      empreintes avec lieu et date — pour le suivi.
    visit: >-
      L'épine dorsale est la Jiráskova cesta, un itinéraire balisé de 42 km le long de la crête principale du
      paysage protégé, passant à proximité des meilleurs sites de la montagne. Il entre dans le paysage
      protégé à Zelené údolí, près d'Olešnice v Orlických horách, et monte jusqu'au belvédère de Vrchmezí.
      Près de la frontière, il traverse la réserve naturelle nationale de Bukačka, surnommée le jardin
      botanique d'Orlické hory pour ses prairies de montagne, et longe le belvédère de Velká Deštná à 1115 m.
      Son dernier tronçon traverse la réserve naturelle de Zemská brána.


      Il y a quatre sentiers éducatifs. Zemská brána fait moins de 2,5 km et traverse la réserve par la vallée
      de la Divoká Orlice ; il compte 10 stations avec des panneaux et des éléments interactifs pour les
      enfants, et est le seul dont les panneaux restent toute l'année. Bedřichovka, de moins de 3 km, est un
      sentier ornithologique : praticable à pied et à vélo, il part du chalet de montagne du même nom, où le
      sentier se divise, avec 8 stations sur la zone de protection des oiseaux d'Orlické Záhoří, les prairies
      humides, la rivière et l'histoire du peuplement. Okolím Deštného couvre environ 17 km en deux boucles
      reliées, presque toujours parallèles au balisage touristique, avec des stations sur la flore et les
      forêts primaires de Sedloňovský vrch et Bukačka. Et le sentier de crête, d'environ 15 km à pied et 19 km
      à vélo, longe la Jiráskova cesta du col sous Šerlich jusqu'à Mezivrší ; il se parcourt à vélo en été et
      à skis de fond en hiver.
    history: >-
      Le réseau Natura 2000 comprend ici cinq sites d'importance communautaire et une zone de protection
      spéciale pour les oiseaux. Le paysage protégé coïncide entièrement avec la zone d'accumulation naturelle
      d'eau CHOPAV, déclarée en 1978. À Černý důl, une réserve naturelle, le noyau est une forêt primaire
      laissée à son évolution spontanée.
    before: >-
      Les règles du gestionnaire sont précises. Dans tout le paysage protégé, il est interdit d'entrer ou de
      stationner avec des véhicules à moteur hors des routes, des rues locales et des emplacements prévus à
      cet effet, et l'accès aux pistes forestières est interdit. Les myrtilles, les champignons et autres
      produits forestiers ne peuvent être récoltés qu'en dehors des petites zones protégées. Les limites des
      réserves sont marquées par des rayures rouges sur les arbres : deux rayures signifient que vous entrez ;
      une rayure que vous sortez. Les panneaux des sentiers ne sont installés que du printemps à l'automne,
      sauf à Zemská brána.
    around: >-
      La [réserve naturelle de Peklo](/lugar/prirodni-rezervace-peklo-nove-mesto/) est à environ six
      kilomètres et [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) à environ dix-sept.
  de:
    intro: >-
      Aus der Ferne wirken Orlické hory wie eine Waldmauer über Böhmen, ein glatter Riegel ohne Gipfel. Komm
      näher, und die Mauer öffnet sich: Ein flacher Rücken ohne markante Gipfel erscheint, durchschnitten von
      tiefen Tälern voller Bäche und Flüsse. Das ist der böhmische Rand eines Grenzgebirges, das sich über der
      Divoká Orlice wölbt. Die Schutzlandschaft umfasst 204 km² und erreicht 1115 Meter inmitten von
      Hochmooren, blühenden Feuchtwiesen, Bergweiden und Wald. Mit diesem sanften Relief und dieser Mischung
      aus Lebensräumen ist es ein Gebirge zum langsamen Wandern.
    landscape: >-
      Der Wald beherrscht alles: Er bedeckt mehr als zwei Drittel der Schutzlandschaft. Ohne menschlichen
      Einfluss würden hier Buchen wachsen und in höheren Lagen Bergfichtenwälder; der menschliche Umgang mit
      dem Gebirge hat dieses Rezept verändert.


      Die Geschichte erklärt den Rest. Landschaft und Natur tragen die Spuren der Ressourcennutzung: Glas,
      Textilwerkstätten und Bergbau. Ein Einschnitt war die Vertreibung der Böhmiendeutschen nach dem Krieg
      und die Aufforstung verlassener Ackerflächen. In den achtziger Jahren vernichtete eine durch
      Luftverschmutzung ausgelöste Kalamität große Teile des Bergwalds, und mancherorts wurde der
      ursprüngliche Wald schlecht durch nicht heimische Arten wie Bergkiefer oder Stechfichte ersetzt. Heute
      wird daran gearbeitet, den natürlichen Wasserhaushalt wiederherzustellen und Wälder mit natürlicherer
      Zusammensetzung zu schaffen.


      An der Blumenwelt erkennt du, dass es hier keine Alpengipfel gibt. Anders als in Krkonoše, Jeseníky oder
      Králický Sněžník fehlt der natürliche Wald oberhalb der Baumgrenze, und die Flora hat weniger Endemiten
      und Glazialrelikte. Das gleichen die Wiesen aus — sie sind Menschenwerk: Ohne Beweidung oder Mahd würden
      sie von Bäumen überwachsen. Und unter allen Blumen sticht das Frühlings-Knotenblümchen hervor, das auf
      großen Flächen wächst und als Wahrzeichen der Schutzlandschaft gilt.
    wildlife: >-
      Beginne mit dem Wasser. In den Bächen der Divoká Orlice, Bílá, Říčka und Zdobnice leben Bachneunauge und
      Groppe; über ihnen fliegen häufig die [Wasseramsel](/especie/cinclus_cinclus/) und der
      [Eisvogel](/especie/alcedo_atthis/), und der [Fischotter](/especie/lutra_lutra/) gräbt seinen Bau in den
      Ufern. In Teichen und Weihern laichen Moorfrosch, Erdkröte und Alpenmolch.


      Die Feuchtwiesen sind Vogelgebiet. Dort lebt der [Wachtelkönig](/especie/crex_crex/), dessen Ruf, ein
      unaufhörliches «crex crex», in Sommernächten zu hören ist, sowie Bekassine, Neuntöter, Braunkehlchen,
      Wiesenpieper, Karmingimpel, Grauammer und [Kranich](/especie/grus_grus/). Zum Schutz des Wachtelkönigs
      wurde das Vogelschutzgebiet Orlické Záhoří ausgewiesen. Der Moorbläuling, europaweit geschützt, braucht
      Großen Wiesenknopf und Myrmica-Ameisen und ist damit auf sorgfältige Wiesenmahd angewiesen.


      Im tiefen Wald brüten der [Uhu](/especie/bubo_bubo/) und der [Schwarzstorch](/especie/ciconia_nigra/),
      und in Baumhöhlen der [Schwarzspecht](/especie/dryocopus_martius/), der Raufußkauz und die Hohltaube.
      Fledermäuse nutzen dieselben Höhlen, vor allem Nordfledermaus, Mopsfledermaus, Braunes Langohr und
      Wasserfledermaus.


      Die Neuigkeit ist der [Wolf](/especie/canis_lupus/): Laut der Verwaltungsbehörde hat er sich seit 2020
      dauerhaft in Orlické hory angesiedelt — ein Tier, das zuvor eher zur Welt der Legenden gehörte. Die
      Behörde bittet um verifizierbare Daten wie Kamerafallenbil­der oder Spuren mit Ort und Datum für das
      Monitoring.
    visit: >-
      Das Rückgrat ist die Jiráskova cesta, ein markierter Weg von 42 km entlang des Hauptkamms der
      Schutzlandschaft, der an den besten Stellen des Gebirges vorbeiführt. Er tritt bei Zelené údolí, nahe
      Olešnice v Orlických horách, in die Schutzlandschaft ein und steigt zum Aussichtspunkt Vrchmezí auf.
      Nahe der Grenze durchquert er das Nationalreservat Bukačka, das als botanischer Garten von Orlické hory
      gilt, und führt am Aussichtspunkt Velká Deštná auf 1115 m vorbei. Sein letzter Abschnitt führt durch das
      Naturreservat Zemská brána.


      Es gibt vier Lehrpfade. Zemská brána ist unter 2,5 km lang und durchquert das Reservat durch das Tal der
      Divoká Orlice; er hat 10 Stationen mit Tafeln und interaktiven Elementen für Kinder und ist der einzige,
      dessen Tafeln das ganze Jahr stehen. Bedřichovka, unter 3 km, ist ein Vogellehrpfad: für Fußgänger und
      Radfahrer geeignet, er beginnt an der gleichnamigen Berghütte, wo er sich verzweigt, mit 8 Stationen
      über das Vogelschutzgebiet Orlické Záhoří, die Feuchtwiesen, den Fluss und die Siedlungsgeschichte.
      Okolím Deštného umfasst etwa 17 km in zwei verbundenen Schleifen, fast immer parallel zur
      Touristenmarkierung, mit Stationen über Flora und Urwälder von Sedloňovský vrch und Bukačka. Und der
      Kammweg, etwa 15 km zu Fuß und 19 km mit dem Rad, verläuft neben der Jiráskova cesta vom Sattel
      unterhalb von Šerlich bis Mezivrší; im Sommer wird er mit dem Rad, im Winter auf Langlaufskiern
      befahren.
    history: >-
      Das Schutzgebietsnetz Natura 2000 umfasst hier fünf Gebiete gemeinschaftlicher Bedeutung und ein
      Vogelschutzgebiet. Die Schutzlandschaft stimmt vollständig mit dem natürlichen Wasseransammlungsgebiet
      CHOPAV überein, das 1978 ausgewiesen wurde. In Černý důl, einem Naturreservat, bildet ein Urwald den
      Kern, der sich seiner spontanen Entwicklung überlassen bleibt.
    before: >-
      Die Vorschriften der Verwaltungsbehörde sind konkret. In der gesamten Schutzlandschaft ist es verboten,
      mit Kraftfahrzeugen abseits von Straßen, Ortsdurchfahrten und ausgewiesenen Plätzen einzufahren oder zu
      parken, und auf Forstwegen ist die Einfahrt verboten. Heidelbeeren, Pilze und andere Waldprodukte dürfen
      nur außerhalb der kleinen Schutzgebiete gesammelt werden. Die Grenzen der Reservate sind mit roten
      Strichen an den Bäumen markiert: zwei Striche bedeuten, du betrittst das Gebiet; ein Strich, du verlässt
      es. Die Tafeln der Lehrpfade werden nur von Frühling bis Herbst aufgestellt, außer bei Zemská brána.
    around: >-
      Das [Naturreservat Peklo](/lugar/prirodni-rezervace-peklo-nove-mesto/) liegt etwa sechs Kilometer
      entfernt und [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) etwa siebzehn.
  it:
    intro: >-
      Da lontano, Orlické hory sembra un muro di foresta steso sulla Boemia, una barriera liscia e priva di
      cime. Avvicinati e il muro si apre: appare un crinale piatto senza vette marcate, tagliato da valli
      profonde piene di ruscelli e fiumi. È il margine boemo di una montagna di confine che si curva sulla
      Divoká Orlice, e il suo paesaggio protetto di 204 km² raggiunge i 1115 metri tra mosaici di torbiere,
      prati umidi fioriti, pascoli di montagna e foresta. Con quel rilievo mite e quella varietà di habitat, è
      una montagna pensata per camminare lentamente.
    landscape: >-
      La foresta domina tutto: copre più di due terzi del paesaggio protetto. Senza l'intervento umano, qui
      crescerebbero faggi e, nelle zone alte, foreste di abete rosso di montagna; ma l'uso umano della
      montagna ha cambiato quella ricetta.


      La storia spiega il resto. Il paesaggio e la natura portano i segni dello sfruttamento delle risorse:
      vetro, laboratori tessili e miniere. Una svolta fu l'espulsione dei tedeschi di Boemia dopo la guerra e
      il rimboschimento delle terre agricole abbandonate. Negli anni ottanta una calamità da inquinamento
      abbatté grandi superfici di bosco di montagna, e in alcuni posti la foresta originale fu malamente
      sostituita da specie non autoctone, come il pino mugo o l'abete pungente. Oggi si lavora per
      ripristinare il regime idrico naturale e per foreste di composizione più naturale.


      I fiori rivelano l'assenza di vette alpine. A differenza di Krkonoše, Jeseníky o Králický Sněžník, qui
      manca la foresta naturale sopra il limite degli alberi, e la flora conta meno endemismi e relitti
      glaciali. I prati compensano — sono opera umana: senza pascolo o sfalcio si coprirebbero di alberi. E
      tra tutti i fiori spicca il campanellino di primavera, che cresce in grandi estensioni ed è l'emblema
      del paesaggio protetto.
    wildlife: >-
      Inizia dall'acqua. Nei torrenti della Divoká Orlice, Bílá, Říčka e Zdobnice abbondano la lampreda di
      ruscello e lo scazzone; su di essi volano spesso il [merlo acquaiolo](/especie/cinclus_cinclus/) e il
      [martin pescatore](/especie/alcedo_atthis/), e la [lontra](/especie/lutra_lutra/) scava la sua tana
      nelle rive. In stagni e pozze si riproducono la rana di palude, il rospo comune e il tritone alpestre.


      I prati umidi sono territorio delle uccelli. Ci sono il [re di quaglie](/especie/crex_crex/), il cui
      verso, un incessante «crex crex», si sente nelle notti estive, e il beccaccino, l'averla piccola, lo
      stiaccino, il prispolone, il ciuffolotto scarlatto, lo zigolo di Lapponia e la [gru
      comune](/especie/grus_grus/). Per proteggere il re di quaglie è stata designata la zona di protezione
      speciale Orlické Záhoří. La farfalla icaro delle paludi, protetta in tutta Europa, ha bisogno della
      sanguisorba e delle formiche Myrmica, e dipende quindi dallo sfalcio attento dei prati.


      Nella foresta profonda nidificano il [gufo reale](/especie/bubo_bubo/) e la [cicogna
      nera](/especie/ciconia_nigra/), e nelle cavità degli alberi il [picchio
      nero](/especie/dryocopus_martius/), la civetta capogrosso e il colombo selvatico. I pipistrelli usano
      quelle stesse cavità, soprattutto il pipistrello di Nathusius, il vespertilio di Bechstein, l'orecchione
      bruno e il vespertilio di Daubenton.


      La novità è il [lupo](/especie/canis_lupus/): secondo il gestore, si è insediato in modo permanente a
      Orlické hory dal 2020, un animale che prima apparteneva più al mondo delle leggende. Il gestore chiede
      dati verificabili — immagini di fototrappole o tracce con luogo e data — per il monitoraggio.
    visit: >-
      La spina dorsale è la Jiráskova cesta, un percorso segnato di 42 km lungo la cresta principale del
      paesaggio protetto, che passa vicino ai posti migliori della montagna. Entra nel paesaggio protetto a
      Zelené údolí, vicino a Olešnice v Orlických horách, e sale al belvedere di Vrchmezí. Vicino al confine
      attraversa la riserva naturale nazionale di Bukačka, chiamata il giardino botanico di Orlické hory per i
      suoi prati di montagna, e passa accanto al belvedere di Velká Deštná a 1115 m. Il suo tratto finale
      attraversa la riserva naturale di Zemská brána.


      Ci sono quattro sentieri educativi. Zemská brána misura meno di 2,5 km e attraversa la riserva per la
      valle della Divoká Orlice; ha 10 soste con pannelli ed elementi interattivi per bambini, ed è l'unico i
      cui pannelli restano tutto l'anno. Bedřichovka, di meno di 3 km, è un percorso ornitologico: adatto a
      piedi e in bici, parte dal rifugio montano dello stesso nome, dove il sentiero si biforca, con 8 soste
      sulla zona di protezione degli uccelli di Orlické Záhoří, i prati umidi, il fiume e la storia
      dell'insediamento. Okolím Deštného copre circa 17 km in due anelli collegati, quasi sempre paralleli
      alla segnaletica turistica, con soste sulla flora e le foreste primarie di Sedloňovský vrch e Bukačka. E
      il sentiero di cresta, di circa 15 km a piedi e 19 km in bici, corre accanto alla Jiráskova cesta dal
      valico sotto Šerlich fino a Mezivrší; d'estate si percorre in bici, d'inverno sugli sci da fondo.
    history: >-
      La rete Natura 2000 comprende qui cinque siti di importanza comunitaria e una zona di protezione
      speciale per gli uccelli. Il paesaggio protetto coincide interamente con la zona di accumulo naturale
      delle acque CHOPAV, dichiarata nel 1978. A Černý důl, una riserva naturale, il nucleo è una foresta
      primaria lasciata alla sua evoluzione spontanea.
    before: >-
      Le norme del gestore sono precise. In tutto il paesaggio protetto è vietato entrare o parcheggiare con
      veicoli a motore fuori dalle strade, dalle vie locali e dai luoghi attrezzati, e sulle piste forestali
      l'accesso è vietato. Mirtilli, funghi e altri prodotti del bosco si raccolgono solo fuori dalle piccole
      aree protette. I confini delle riserve sono segnati con strisce rosse sugli alberi: due strisce indicano
      che stai entrando; una striscia che stai uscendo. I pannelli dei sentieri vengono installati solo dalla
      primavera all'autunno, tranne a Zemská brána.
    around: >-
      La [riserva naturale di Peklo](/lugar/prirodni-rezervace-peklo-nove-mesto/) si trova a circa sei
      chilometri e [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) a circa diciassette.
  pt:
    intro: >-
      De longe, Orlické hory parece uma muralha de floresta estendida sobre a Boémia, uma barreira lisa e sem
      picos. Aproxima-te e a muralha abre-se: surge uma cumeada plana sem cumes marcados, cortada por vales
      profundos cheios de ribeiros e rios. É a margem boémica de uma montanha fronteiriça que se curva sobre o
      Divoká Orlice, e a sua paisagem protegida de 204 km² atinge os 1115 metros entre mosaicos de turfeiras,
      prados húmidos floridos, pastagens de montanha e floresta. Com esse relevo suave e essa mistura de
      habitats, é uma montanha para caminhar devagar.
    landscape: >-
      A floresta domina tudo: cobre mais de dois terços da paisagem protegida. Sem intervenção humana,
      cresceriam aqui faias e, nas zonas altas, florestas de abeto de montanha; mas o uso humano da montanha
      mudou essa receita.


      A história explica o resto. A paisagem e a natureza estão marcadas pelo uso de recursos: vidro, oficinas
      têxteis e mineração. Um marco foi a expulsão dos alemães da Boémia após a guerra e o reflorestamento de
      terras agrícolas abandonadas. Nos anos oitenta, uma calamidade provocada pela poluição destruiu grandes
      superfícies de floresta de montanha, e em alguns locais a floresta original foi mal substituída por
      espécies não autóctones, como o pinheiro-de-montanha ou o abeto-azul. Hoje trabalha-se para restaurar o
      regime hídrico natural e criar florestas de composição mais natural.


      As flores revelam a ausência de cumes alpinos. Ao contrário de Krkonoše, Jeseníky ou Králický Sněžník,
      falta aqui a floresta natural acima do limite das árvores, e a flora tem menos endemismos e relíquias
      glaciares. Os prados compensam — são obra humana: sem pastoreio ou ceifa, cobrir-se-iam de árvores. E
      entre todas as flores destaca-se o nivéolo de primavera, que cresce em grandes extensões e é o emblema
      da paisagem protegida.
    wildlife: >-
      Começa pela água. Nos torrentes do Divoká Orlice, Bílá, Říčka e Zdobnice abundam a lampreia-de-riacho e
      o escalo; sobre eles voam frequentemente a [melro-d'água](/especie/cinclus_cinclus/) e o
      [guarda-rios](/especie/alcedo_atthis/), e a [lontra](/especie/lutra_lutra/) escava a sua toca nas
      margens. Em lagoas e charcos reproduzem-se a rã-de-pântano, o sapo-comum e o tritão-alpino.


      Os prados húmidos são o território das aves. Há o [codornizão](/especie/crex_crex/), cujo chamamento, um
      incessante «crex crex», se ouve nas noites de verão, e a narceja-comum, o picanço-de-dorso-vermelho, o
      cartaxo-nortenho, o pombo-das-rochas, o pintarroxo-de-peito-cor-de-rosa e a
      [grou-comum](/especie/grus_grus/). Para proteger o codornizão foi criada a zona de proteção de aves de
      Orlické Záhoří. A borboleta azul-dos-pântanos, protegida em toda a Europa, precisa da sanguisorba e das
      formigas Myrmica, dependendo, por isso, de uma ceifa cuidadosa dos prados.


      Na floresta profunda nidificam o [bufo-real](/especie/bubo_bubo/) e a
      [cegonha-preta](/especie/ciconia_nigra/), e em cavidades de árvores o
      [peto-preto](/especie/dryocopus_martius/), a coruja-de-Tengmalm e o pombo-das-rochas. Os morcegos usam
      essas mesmas cavidades, sobretudo o morcego-de-Nathusius, o morcego-de-Bechstein, o
      morcego-orelhudo-acastanhado e o morcego-de-Daubenton.


      A novidade é o [lobo](/especie/canis_lupus/): segundo o gestor, instalou-se de forma permanente em
      Orlické hory desde 2020, um animal que antes pertencia mais ao mundo das lendas. O gestor pede dados
      verificáveis — imagens de câmaras-armadilha ou rastos com local e data — para o acompanhamento.
    visit: >-
      A espinha dorsal é a Jiráskova cesta, um percurso marcado de 42 km ao longo da crista principal da
      paisagem protegida, que passa perto dos melhores locais da montanha. Entra na paisagem protegida em
      Zelené údolí, perto de Olešnice v Orlických horách, e sobe ao miradouro de Vrchmezí. Perto da fronteira,
      atravessa a reserva natural nacional de Bukačka, chamada o jardim botânico de Orlické hory pelas suas
      pradarias de montanha, e passa junto ao miradouro de Velká Deštná a 1115 m. O seu último troço atravessa
      a reserva natural de Zemská brána.


      Existem quatro percursos interpretativos. Zemská brána mede menos de 2,5 km e atravessa a reserva pelo
      vale do Divoká Orlice; tem 10 paragens com painéis e elementos interativos para crianças, e é o único
      cujos painéis estão colocados durante todo o ano. Bedřichovka, de menos de 3 km, é um percurso
      ornitológico: apto a pé e de bicicleta, parte da cabana de montanha do mesmo nome, onde o percurso se
      bifurca, com 8 paragens sobre a zona de proteção de aves de Orlické Záhoří, os prados húmidos, o rio e a
      história do povoamento. Okolím Deštného abrange cerca de 17 km em dois circuitos interligados, quase
      sempre paralelos à sinalização turística, com paragens sobre a flora e as florestas primárias de
      Sedloňovský vrch e Bukačka. E o percurso da crista, de cerca de 15 km a pé e 19 km de bicicleta, corre
      junto à Jiráskova cesta desde o colo sob Šerlich até Mezivrší; faz-se de bicicleta no verão e de esqui
      de fundo no inverno.
    history: >-
      A rede Natura 2000 compreende aqui cinco sítios de importância comunitária e uma zona de proteção
      especial para aves. A paisagem protegida coincide inteiramente com a zona de acumulação natural de águas
      CHOPAV, declarada em 1978. Em Černý důl, uma reserva natural, o núcleo é uma floresta primária deixada à
      sua evolução espontânea.
    before: >-
      As regras do gestor são concretas. Em toda a paisagem protegida é proibido entrar ou estacionar com
      veículos motorizados fora de estradas, ruas locais e locais autorizados, e nas pistas florestais a
      entrada é proibida. Os mirtilos, os cogumelos e outros produtos florestais só se recolhem fora das
      pequenas áreas protegidas. Os limites das reservas estão marcados com riscas vermelhas nas árvores: duas
      riscas indicam que estás a entrar; uma risca que estás a sair. Os painéis dos percursos só são
      instalados da primavera ao outono, exceto em Zemská brána.
    around: >-
      A [reserva natural de Peklo](/lugar/prirodni-rezervace-peklo-nove-mesto/) fica a cerca de seis
      quilómetros e [Králický Sněžník](/lugar/kralicky-sneznik---masyw-snieznika/) a cerca de dezassete.
