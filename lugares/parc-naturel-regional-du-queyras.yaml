resumen:
  es: >-
    Valle alpino elevado de alerce dominado por el pico Viso y salpicado por Saint-Véran, el municipio
    habitado más alto de Europa.
  en: >-
    A high alpine larch valley dominated by Mount Viso and punctuated by Saint-Véran, the highest inhabited
    village in Europe.
  fr: >-
    Haute vallée alpine de mélèzes dominée par le mont Viso et ponctuée par Saint-Véran, la plus haute commune
    habitée d'Europe.
  de: >-
    Hochalpines Lärchenhochtal unter der Pyramide des Monte Viso mit Saint-Véran, dem höchstgelegenen
    bewohnten Dorf Europas.
  it: >-
    Alta valle alpina di larici dominata dal Monviso e punteggiata da Saint-Véran, il comune abitato più
    elevato d'Europa.
  pt: >-
    Vale alpino elevado de lariços dominado pelo pico Viso e pontuado por Saint-Véran, o município habitado
    mais alto da Europa.
unico:
  es: >-
    Un valle seco y soleado donde conviven una salamandra que solo existe en el macizo del Viso, plantas de
    origen africano y el pueblo habitado más alto de los Alpes franceses.
  en: >-
    A dry and sunny valley where a salamander unique to the Viso massif coexists with plants of African origin
    and the highest inhabited village in the French Alps.
  fr: >-
    Une vallée sèche et ensoleillée où se côtoient une salamandre exclusive au massif du Viso, des végétaux
    d'origine africaine et le plus haut village habité des Alpes françaises.
  de: >-
    Ein trockenes, sonnenverwöhntes Hochtal, in dem ein endemischer Alpensalamander des Viso-Massivs, Pflanzen
    afrikanischen Ursprungs und das höchste dauerhaft bewohnte Dorf der französischen Alpen zusammenfinden.
  it: >-
    Una valle asciutta e soleggiata in cui convivono una salamandra esclusiva del massiccio del Monviso,
    specie vegetali di origine africana e il villaggio abitato più alto delle Alpi francesi.
  pt: >-
    Um vale seco e soalheiro onde coexistem uma salamandra exclusiva do maciço do Viso, plantas de linhagem
    africana e a povoação habitada mais alta dos Alpes franceses.
observaciones:
  es: >-
    En la reserva no se admiten perros, ni siquiera con correa. Hay que seguir los senderos balizados, porque
    salirse daña hábitats frágiles de altura, y solo se permite recoger especies comestibles en cantidad
    familiar y junto a los senderos. En alpajes y bosques los perros deben ir con correa, y los drones están
    prohibidos a menos de 200 metros de la fauna salvaje, los refugios, los lagos y el ganado.


    El vivac con tienda se tolera a más de una hora a pie del pueblo, una sola noche por sector, montado tras
    las 18 h y desmontado antes de las 9 h. Y desde 2022, las bicis de montaña no pueden circular por el
    vallon de Bouchouse de 8 h a 15 h en julio y agosto. Para elegir ruta, la web del parque ofrece las
    caminatas por municipio, duración, desnivel y tema, con perfil de elevación y traza GPS descargable.
texto:
  es:
    intro: >-
      Sube por el collado de Izoard y el mundo se vuelve de piedra. La Casse Déserte, un circo lunar de
      chimeneas de hadas, parece anunciar un desierto. Y de pronto, al otro lado, empiezan las estepas y los
      bosques. Esa es la puerta del Queyras, un valle de alta montaña de los Altos Alpes que el Parque Natural
      Regional del Queyras protege, con el Monviso como vecino de frontera y el alerce como árbol de cabecera.
    landscape: >-
      Todo empezó en un océano. Los corales fósiles del macizo de Rochebrune hablan de un mar cálido y poco
      profundo, y las amonitas del mármol de Guillestre nadaban en los bajíos. Luego África chocó con Eurasia,
      un choque que sigue desde hace 60 millones de años, y aquel fondo marino se plegó. Las rocas laminadas,
      los esquistos, dieron los valles muy abiertos del alto Queyras: Molines, Abriès y Saint-Véran. Después
      llegaron las aguas y los glaciares, que corrían hacia el Durance y esculpieron una cuenca interior
      abierta al oeste.


      El clima remata el cuadro. El Queyras recibe pocas borrascas atlánticas, y su aire seco da cielos
      limpios y fuertes contrastes de temperatura. Hay un fenómeno propio: la nebbia, el vapor de la cuenca
      del Po que sube con el calor y forma un mar de nubes hacia las 10 h, un día de cada tres en verano,
      hasta que se disipa al ponerse el sol. Por encima de 2.400 m el invierno dura más de nueve meses y los
      pastos alpinos apenas tienen tiempo de dar semillas.


      Las plantas cuentan de dónde vienen: el enebro de incienso, de origen africano, la salvia de Etiopía y
      la lavanda llegaron en el último gran calentamiento posglaciar. En la reserva de Ristolas–Mont Viso hay
      alerzales, pastos alpinos, prados, lagos y turberas, landas, acantilados y pedregales; unas 800 especies
      de plantas con flor, y el pastel de los Alpes, la grasilla de Arvet-Touvet y el circe de montaña,
      endémicos de los Alpes suroccidentales.
    wildlife: >-
      Cuando la nieve cede, a finales de marzo, la [marmota](/especie/marmota_marmota/) sale del letargo y se
      anuncia con silbidos. Su abundancia explica por qué hay tantas [águilas
      reales](/especie/aquila_chrysaetos/) en el Queyras, que la cazan. Las laderas de hierba alimentan a unas
      2.500 [gamuzas](/especie/rupicapra_rupicapra/).


      El [íbice](/especie/capra_ibex/) volvió de la mano del hombre. Se reintrodujeron 26 íbices alpinos en
      1995 y 1998, y el valle fue elegido porque es un nudo de colonización con muchos corredores ecológicos.
      En la reserva de Ristolas–Mont Viso puedes ver también chovas, águilas,
      [quebrantahuesos](/especie/gypaetus_barbatus/), gorrión alpino, collalba gris y acentor alpino. En
      invierno, la liebre variable y el [lagópodo alpino](/especie/lagopus_muta/) se vuelven blancos para
      fundirse con la nieve.


      El animal más discreto es la [salamandra de Lanza](/especie/salamandra_lanzai/): solo vive en el macizo
      del Viso, es el anfibio más longevo —más de 20 años— y solo sale unos diez días al año. Con la gamuza y
      el íbice comparte un problema: son muy sensibles a las molestias repetidas, sobre todo en la cría y la
      invernada.
    visit: >-
      Tres puertas dan entrada al parque: las gargantas del Guil, el collado Agnel y el collado de Izoard. Si
      buscas el corazón salvaje, el Haut-Guil: la reserva ocupa 2 295 hectáreas, entre 1700 m y 3287 m de
      altitud, y la única vía motorizada es la D947, una carretera sin salida que une Guillestre con Ristolas.
      A pie hay muchos pasos, sobre todo desde Italia: Vallante, Traversette, Asti, Couloir du Porc y Pas du
      Sellard. El refugio del Viso abre todo el verano y en marzo y abril, a unas tres horas a pie de la Roche
      Écroulée.


      En invierno, el esquí de travesía se permite en toda la reserva salvo en la zona Asti – Rocher mouloun –
      Clos Sablé, donde inverna el lagópodo alpino. La bici de montaña se puede usar en todos los senderos
      menos el que bordea el Guil entre el Grand Belvédère y el lago Lestio.


      Para entender lo que ves hay tres espacios museográficos del parque: el Soum, l'Arche des Cimes y el
      Moulin.
    history: >-
      Estas montañas llevan ocupadas desde el Neolítico, como muestran las excavaciones en la mina de cobre de
      Saint-Véran y en los pastos de Urine y del Monviso. Saint-Véran, a 2 042 m de altitud, tiene fama de ser
      el hábitat permanente más alto de los Alpes franceses.


      La conservación tiene dos historias. Una es la del íbice, que volvió. La otra es la de la mariposa
      isabelle de France: los coleccionistas la pusieron al borde de la extinción en los años 1970, y en 1975
      los alcaldes de cinco comunes prohibieron su captura, un año antes de la primera ley francesa de
      protección de la naturaleza. La recuperación incluyó cría y puesta de huevos sobre pinos silvestres
      locales, su hábitat y único alimento.
    before: >-
      En la reserva no se admiten perros, ni siquiera con correa. Hay que seguir los senderos balizados,
      porque salirse daña hábitats frágiles de altura, y solo se permite recoger especies comestibles en
      cantidad familiar y junto a los senderos. En alpajes y bosques los perros deben ir con correa, y los
      drones están prohibidos a menos de 200 metros de la fauna salvaje, los refugios, los lagos y el ganado.


      El vivac con tienda se tolera a más de una hora a pie del pueblo, una sola noche por sector, montado
      tras las 18 h y desmontado antes de las 9 h. Y desde 2022, las bicis de montaña no pueden circular por
      el vallon de Bouchouse de 8 h a 15 h en julio y agosto. Para elegir ruta, la web del parque ofrece las
      caminatas por municipio, duración, desnivel y tema, con perfil de elevación y traza GPS descargable.
    around: >-
      El [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/) queda a unos 2 km, con el que
      comparte el macizo del Viso. A seis kilómetros está el [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), a catorce el [Parc National des Écrins -
      Massif](/lugar/parc-national-des-ecrins---massif/) y a veinte el [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/), donde la salamandra de Lanza vuelve a asomar en su
      campaña de ciencia ciudadana.
  en:
    intro: >-
      Ascend via the Col d'Izoard and the world turns to mineral rock. La Casse Déserte, a lunar cirque
      studded with fairy chimneys, appears to foreshadow a desert. Yet suddenly, just over the pass, steppe
      grasslands and fragrant woods unfold. This is the gateway to Queyras, a high-mountain valley in the
      Hautes-Alpes protected by the Queyras Regional Natural Park, with Monviso standing as its frontier
      guardian and the larch as its signature tree.
    landscape: >-
      Everything originated in an ancient ocean. Fossil corals within the Rochebrune massif recall a warm,
      shallow sea, while ammonites preserved in Guillestre marble swam in primeval shoals. Then Africa
      collided with Eurasia—a collision ongoing for 60 million years—buckling and folding that seabed.
      Foliated schists gave rise to the wide, open valleys of upper Queyras: Molines, Abriès, and Saint-Véran.
      Later came torrents and glaciers flowing toward the Durance, carving an enclosed mountain basin draining
      westward.


      The climate puts the finishing touch on the scenery. Queyras receives few Atlantic weather systems, its
      dry air producing crystalline skies and stark thermal contrasts. A characteristic phenomenon occurs: the
      nebbia, mist rising from the Po basin under daytime warmth that forms a sea of clouds towards 10 h on
      roughly one day in three during summer, dispersing only at sundown. Above 2,400 m, winter lingers for
      more than nine months, leaving alpine pastures barely enough warmth to set seed.


      The flora reflects diverse geographic origins: incense juniper of African ancestry, Ethiopian sage, and
      lavender arrived during the last major postglacial warming. Within the Ristolas–Mont Viso reserve thrive
      larch forests, alpine grasslands, wetlands, and screes harbouring some 800 flowering plant species,
      alongside local endemics of the southwestern Alps such as the Queen of the Alps, Arvet-Touvet
      butterwort, and mountain thistle.
    wildlife: >-
      When snows recede in late March, the [alpine marmot](/especie/marmota_marmota/) emerges from torpor with
      piercing whistles. Its sheer abundance explains the high density of [golden
      eagles](/especie/aquila_chrysaetos/) patrolling the Queyras skies. The grassy slopes support some 2,500
      [chamois](/especie/rupicapra_rupicapra/).


      The [alpine ibex](/especie/capra_ibex/) returned through human stewardship: 26 individuals were
      reintroduced in 1995 and 1998, the valley being chosen as a vital biogeographical hub rich in ecological
      corridors. In the Ristolas–Mont Viso reserve you may also spot choughs, eagles, the [bearded
      vulture](/especie/gypaetus_barbatus/), white-winged snowfinch, northern wheatear, and alpine accentor.
      In winter, mountain hares and the [rock ptarmigan](/especie/lagopus_muta/) turn white to blend
      seamlessly with the snowfields.


      The most secretive inhabitant is [Lanza's alpine salamander](/especie/salamandra_lanzai/): endemic to
      the Viso massif, it is the longest-lived amphibian—exceeding 20 years—and remains active for only about
      ten days each year. Like chamois and ibex, it suffers acutely from recurring human disturbances during
      breeding and overwintering.
    visit: >-
      Three mountain portals grant entry: the Guil gorges, the Col Agnel, and the Col d'Izoard. If you seek
      the untamed heart of the park, head to the Haut-Guil: the nature reserve covers 2,295 hectares between
      1700 m and 3287 m in elevation, with the D947—a dead-end road linking Guillestre to Ristolas—as its sole
      motor route. On foot, multiple high passes cross from Italy: Vallante, Traversette, Asti, Couloir du
      Porc, and Pas du Sellard. The Refuge du Viso welcomes hikers throughout summer and in March and April,
      roughly three hours on foot from La Roche Écroulée.


      In winter, ski touring is permitted across the reserve except in the Asti–Rocher Mouloun–Clos Sablé
      sanctuary where the rock ptarmigan winters. Mountain biking is allowed on all designated trails except
      along the Guil path between the Grand Belvédère and Lake Lestio.


      To interpret what you encounter, three visitor centres welcome travellers: Le Soum, L'Arche des Cimes,
      and Le Moulin.
    history: >-
      These mountain valleys have been settled since the Neolithic, evidenced by archaeological excavations at
      the Saint-Véran copper mine and the high pastures of Urine and Monviso. Saint-Véran, perched at 2,042 m
      altitude, holds fame as the highest permanently inhabited commune in the French Alps.


      Conservation here tells two memorable stories. One is the ibex, successfully returned to its native
      heights. The other is the Spanish moon moth (Isabelle de France): collectors pushed it to the brink of
      local extinction in the 1970s, prompting the mayors of five communes to outlaw its capture in 1975—a
      full year ahead of France's inaugural nature protection law. Recovery entailed captive rearing and
      egg-laying on native Scots pines, its sole food plant.
    before: >-
      In the nature reserve dogs are strictly prohibited, even on a leash. Hikers must remain on marked trails
      to prevent trampling high-altitude habitats; gathering edible plants is restricted to modest family
      quantities immediately beside paths. In communal pastures and forests outside the reserve, dogs must be
      leashed, and drones are banned within 200 metres of wildlife, mountain refuges, lakes, and grazing
      herds.


      Bivouac camping in lightweight tents is tolerated at more than one hour's walk from the nearest village,
      for a single night per sector, pitched after 18 h and struck before 9 h. Since 2022, mountain bikes are
      barred in the Vallon de Bouchouse from 8 h to 15 h during July and August. To select your itinerary, the
      park website lists hikes by commune, duration, elevation, and theme with downloadable GPS tracks.
    around: >-
      The [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/) lies roughly 2 km away across the
      border, sharing the Viso massif. Six kilometres away lies [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), fourteen kilometres away stands [Parc National des
      Écrins - Massif](/lugar/parc-national-des-ecrins---massif/), and twenty kilometres away extends [Parc
      National du Mercantour](/lugar/parc-national-du-mercantour/), where Lanza's salamander features in
      collaborative citizen-science surveys.
  fr:
    intro: >-
      Franchissez le col d'Izoard et l'univers se métamorphose en pierre. La Casse Déserte, cirque minéral
      peuplé de cheminées de fées, semble annoncer un désert. Puis, sitôt la crête franchie, surgissent les
      steppes et les forêts de mélèzes. C'est l'entrée du Queyras, haute vallée des Hautes-Alpes protégée par
      le parc naturel régional du Queyras, adossée au mont Viso sur la frontière et coiffée par le mélèze en
      majesté.
    landscape: >-
      Tout débuta au fond d'un océan. Les coraux fossilisés du massif de Rochebrune témoignent d'une mer
      chaude et peu profonde, tandis que les ammonites du marbre de Guillestre nageaient dans des hauts-fonds.
      L'Afrique entra ensuite en collision avec l'Eurasie — un choc qui se poursuit depuis 60 millions
      d'années —, plissant ce plancher sédimentaire. Les schistes lustrés donnèrent naissance aux larges
      vallées ouvertes du haut Queyras : Molines, Abriès et Saint-Véran. Plus tard, torrents et glaciers
      s'écoulant vers la Durance ont sculpté un bassin montagnard orienté vers l'ouest.


      Le climat parachève le tableau. Le Queyras reçoit peu de perturbations atlantiques ; son air sec assure
      des ciels d'une grande pureté et de vifs contrastes thermiques. Un phénomène météorologique singulier
      s'y produit : la nebbia, vapeur venue du bassin du Pô qui s'élève avec l'échauffement et forme une mer
      de nuages vers 10 h, un jour sur trois en été, avant de s'évaporer au coucher du soleil. Au-delà de 2
      400 m, l'hiver persiste plus de neuf mois et les pelouses alpines disposent d'un répit infime pour
      grainer.


      La flore raconte ses pérégrinations : le genévrier thurifère d'ascendance africaine, la sauge d'Éthiopie
      et la lavande s'y sont établis lors du dernier réchauffement postglaciaire. Dans la réserve de
      Ristolas–Mont Viso se succèdent mélèzins, alpages, zones humides et éboulis abritant quelque 800 espèces
      de plantes à fleurs, ainsi que des endémiques des Alpes sud-occidentales comme la reine des Alpes, la
      grassette d'Arvet-Touvet et le cirse de Carniole.
    wildlife: >-
      Quand le manteau neigeux s'efface à la fin mars, la [marmotte des Alpes](/especie/marmota_marmota/) sort
      d'hibernation en sifflant. Son abondance justifie la densité remarquable d'[aigles
      royaux](/especie/aquila_chrysaetos/) qui patrouillent dans le Queyras. Les versants herbeux nourrissent
      environ 2 500 [chamois](/especie/rupicapra_rupicapra/).


      Le [bouquetin des Alpes](/especie/capra_ibex/) est revenu grâce à l'action humaine : 26 bouquetins ont
      été réintroduits en 1995 et 1998, la vallée constituant un carrefour biogéographique riche en corridors
      écologiques. Dans la réserve de Ristolas–Mont Viso, vous pouvez également observer chocards, grands
      corbeaux, le [gypaète barbu](/especie/gypaetus_barbatus/), la niverolle alpine, le traquet motteux et
      l'accenteur alpin. En hiver, le lièvre variable et le [lagopède alpin](/especie/lagopus_muta/)
      blanchissent pour se fondre dans les névés.


      L'hôte le plus discret est la [salamandre de Lanza](/especie/salamandra_lanzai/) : strictement inféodée
      au massif du Viso, c'est l'amphibien le plus longévif — plus de 20 ans d'espérance de vie — et elle
      n'est active qu'une dizaine de jours par an. Comme le chamois et le bouquetin, elle demeure vulnérable
      aux dérangements répétés en période d'hivernage et de reproduction.
    visit: >-
      Trois voies d'accès mènent au parc : les gorges du Guil, le col Agnel et le col d'Izoard. Pour atteindre
      le cœur sauvage, dirigez-vous vers le Haut-Guil : la réserve naturelle s'étend sur 2 295 hectares entre
      1700 m et 3287 m d'altitude, desservie uniquement par la D947, route en cul-de-sac reliant Guillestre à
      Ristolas. À pied, de nombreux cols frontaliers relient l'Italie : Vallante, Traversette, Asti, Couloir
      du Porc et Pas du Sellard. Le refuge du Viso accueille les randonneurs tout l'été ainsi qu'en mars et
      avril, à environ trois heures de marche de la Roche Écroulée.


      En hiver, le ski de randonnée est permis dans toute la réserve à l'exclusion du secteur Asti–Rocher
      Mouloun–Clos Sablé où hiverne le lagopède alpin. Le vélo tout-terrain est autorisé sur les sentiers
      balisés, hormis sur le chemin longeant le Guil entre le Grand Belvédère et le lac Lestio.


      Pour enrichir votre découverte, trois musées vous accueillent : Le Soum, L'Arche des Cimes et Le Moulin.
    history: >-
      Ces reliefs sont occupés depuis le Néolithique, comme l'ont prouvé les fouilles de la mine de cuivre de
      Saint-Véran et des alpages d'Urine et du mont Viso. Saint-Véran, perché à 2 042 m d'altitude, est réputé
      pour être la plus haute commune habitée en permanence des Alpes françaises.


      La préservation s'illustre par deux récits. Celui du bouquetin réintroduit avec succès, et celui de
      l'isabelle de France : les prélèvements d'amateurs mirent ce papillon nocturne en péril dans les années
      1970, conduisant les maires de cinq communes à en interdire la capture dès 1975, un an avant la première
      grande loi française sur la protection de la nature. La sauvegarde reposa sur l'élevage et la ponte sur
      les pins sylvestres locaux.
    before: >-
      Dans la réserve naturelle, les chiens sont formellement interdits, même tenus en laisse. Il est
      impératif de rester sur les sentiers balisés pour ne pas dégrader les pelouses d'altitude ; la
      cueillette de plantes comestibles n'est tolérée qu'en quantité familiale en bordure immédiate des
      sentiers. En alpages et forêts, les chiens doivent être tenus en laisse et les drones sont prohibés à
      moins de 200 mètres de la faune, des refuges et des troupeaux.


      Le bivouac sous tente légère est toléré à plus d'une heure de marche du dernier village, pour une seule
      nuit par emplacement, monté après 18 h et démonté avant 9 h. Depuis 2022, les VTT ne peuvent circuler
      dans le vallon de Bouchouse de 8 h à 15 h en juillet et août. Pour choisir vos sorties, le portail du
      parc détaille les randonnées avec tracés GPS téléchargeables.
    around: >-
      Le [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/) est distant d'environ 2 km de
      l'autre côté de la crête frontière. À six kilomètres se trouve le [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), à quatorze kilomètres le [Parc National des Écrins -
      Massif](/lugar/parc-national-des-ecrins---massif/) et à vingt kilomètres le [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/), où la salamandre de Lanza fait l'objet d'un suivi
      participatif.
  de:
    intro: >-
      Fahre über den Col d'Izoard und die Gebirgswelt wird zu nacktem Fels. Die Casse Déserte, ein mondartiger
      Kessel voller Felsnadeln, scheint eine Steinwüste anzukündigen. Doch jenseits der Passhöhe weichen die
      Schutthalden weiten Steppen und dichten Lärchenwäldern. Dies ist das Tor zum Queyras, einem
      Hochgebirgstal der Hautes-Alpes, das der Regionale Naturpark Queyras schützt — mit dem Monte Viso als
      Grenznachbarn und der Lärche als landschaftsprägendem Baum.
    landscape: >-
      Alles begann am Grund eines Ozeans. Fossile Korallen des Rochebrune-Massivs zeugen von einem flachen
      Warmwassermeer, während Ammoniten im Marmor von Guillestre durch ein urzeitliches Becken glitten. Vor 60
      Millionen Jahren begann die andauernde Kollision Afrikas mit Eurasien, die den Meeresboden auffaltete.
      Aus verformten Schiefern entstanden die offenen Hochtäler des oberen Queyras: Molines, Abriès und
      Saint-Véran. Später gruben Gletscher und Wildbäche zur Durance hin ein nach Westen entwässerndes
      Hochbecken aus.


      Das Klima vollendet das Landschaftsbild. Das Queyras wird von atlantischen Tiefdruckgebieten kaum
      berührt; trockene Luft sorgt für strahlende Fernsicht und kräftige Temperaturwechsel. Typisch ist die
      Nebbia: Dunst aus der Po-Ebene, der bei sommerlicher Erwärmung aufsteigt und gegen 10 h an jedem dritten
      Sommertag ein dichtes Wolkenmeer bildet, das sich erst bei Sonnenuntergang auflöst. Oberhalb von 2.400 m
      währt der Winter über neun Monate, sodass Almgräser kaum Zeit zur Samenreife finden.


      Die Pflanzenwelt erzählt von weiten Wanderungen: Der Weihrauch-Wacholder afrikanischer Herkunft, der
      Äthiopische Salbei und der Lavendel wanderten während der letzten Nacheiszeit ein. Im Schutzgebiet
      Ristolas–Mont Viso gedeihen Lärchenwälder, alpine Matten, Moore und Geröllfluren mit rund 800
      Blütenpflanzenarten sowie Endemiten der Südwestalpen wie die Alpen-Mannstreu, das Arvet-Touvet-Fettkraut
      und die Berggänsedistel.
    wildlife: >-
      Weicht der Schnee Ende März, erwacht das [Alpenmurmeltier](/especie/marmota_marmota/) pfeifend aus dem
      Winterschlaf. Seine Bestandsdichte erklärt die auffällige Häufigkeit kreisender
      [Steinadler](/especie/aquila_chrysaetos/). Auf den Grashängen weiden rund 2.500
      [Gämsen](/especie/rupicapra_rupicapra/).


      Der [Alpensteinbock](/especie/capra_ibex/) kehrte dank menschlicher Hilfe zurück: 26 Tiere wurden 1995
      und 1998 wiederangesiedelt, da das Tal als Knotenpunkt mit zahlreichen Wanderkorridoren ideale
      Bedingungen bietet. Im Schutzgebiet Ristolas–Mont Viso leben zudem Alpendohlen, der
      [Bartgeier](/especie/gypaetus_barbatus/), Schneesperlinge, Steinschmätzer und Alpenbraunellen. Im Winter
      wechseln Schneehase und [Alpenschneehuhn](/especie/lagopus_muta/) ihr Federkleid zu reinem Weiß.


      Der heimlichste Gebirgsbewohner ist [Lanzas Alpensalamander](/especie/salamandra_lanzai/): Er kommt
      ausschließlich im Viso-Massiv vor, erreicht als langlebigstes Amphibium über 20 Jahre Lebensalter und
      ist nur an rund zehn Tagen im Jahr oberirdisch aktiv. Wie Gämsen und Steinböcke leidet er empfindlich
      unter wiederkehrenden Störungen während der Winterruhe.
    visit: >-
      Drei Pässe erschließen das Gebiet: die Guil-Schlucht, der Col Agnel und der Col d'Izoard. Das unberührte
      Herzstück liegt im Haut-Guil: Das Naturschutzgebiet umfasst 2 295 Hektar zwischen 1700 m und 3287 m
      Meereshöhe. Einzige Zufahrtsstraße ist die D947, eine Sackgasse von Guillestre nach Ristolas. Zu Fuß
      führen historische Übergänge nach Italien: Vallante, Traversette, Asti, Couloir du Porc und Pas du
      Sellard. Die Schutzhütte Refuge du Viso öffnet im Sommer sowie im März und April, etwa drei Gehstunden
      von der Roche Écroulée entfernt.


      Im Winter sind Skitouren im gesamten Schutzgebiet gestattet, mit Ausnahme der Ruhezone Asti–Rocher
      Mouloun–Clos Sablé, wo das Alpenschneehuhn überwintert. Mountainbikes sind auf allen markierten Wegen
      erlaubt, ausgenommen der Uferpfad am Guil zwischen Grand Belvédère und dem Lestio-See.


      Drei Informationszentren vermitteln Wissenswertes: Le Soum, L'Arche des Cimes und Le Moulin.
    history: >-
      Die Besiedlung reicht bis in die Jungsteinzeit zurück, wie Ausgrabungen im Kupferbergwerk Saint-Véran
      und auf den Almen von Urine und Viso belegen. Saint-Véran gilt auf 2 042 m Höhe als höchstgelegene
      dauerhaft bewohnte Gemeinde der französischen Alpen.


      Der Artenschutz verzeichnet zwei Meilensteine: die erfolgreiche Rückkehr des Steinbocks und die Rettung
      des seltenen Nachtschmetterlings Isabelle de France. Weil Sammler die Art in den 1970er Jahren an den
      Rand des Aussterbens brachten, verboten die Bürgermeister von fünf Gemeinden 1975 den Fang — ein Jahr
      vor dem ersten französischen Naturschutzgesetz. Die Rettung gelang durch Nachzucht und Eiablage auf
      heimischen Waldkiefern.
    before: >-
      Im Naturschutzgebiet sind Hunde streng verboten, auch angeleint. Bleibe auf den markierten Pfaden, um
      hochalpine Matten zu schonen; das Sammeln von Speisepflanzen ist nur in haushaltsüblichen Mengen direkt
      am Wegrand gestattet. Auf Weiden außerhalb müssen Hunde an die Leine, und Drohnen sind im Umkreis von
      200 Metern um Wildtiere, Berghütten und Weidevieh untersagt.


      Notbiwaks im Zelt werden in mehr als einer Stunde Gehzeit vom Talort für eine Nacht geduldet, aufgebaut
      nach 18 h und abgebaut vor 9 h. Seit 2022 dürfen Mountainbikes das Vallon de Bouchouse im Juli und
      August zwischen 8 h und 15 h nicht befahren. Die Park-Website bietet detaillierte Tourenvorschläge mit
      GPS-Tracks zum Herunterladen.
    around: >-
      Der [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/) liegt rund 2 km jenseits des
      Hauptkamms. In sechs Kilometern Entfernung liegt der [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), vierzehn Kilometer entfernt der [Parc National des
      Écrins - Massif](/lugar/parc-national-des-ecrins---massif/) und zwanzig Kilometer entfernt der [Parc
      National du Mercantour](/lugar/parc-national-du-mercantour/), wo Lanzas Alpensalamander ebenfalls
      erforscht wird.
  it:
    intro: >-
      Sali per il colle dell'Izoard e lo spazio si trasforma in pietra nuda. La Casse Déserte, un anfiteatro
      lunare irto di camini delle fate, parrebbe preludere a un deserto. E all'improvviso, superato il valico,
      si aprono praterie steppiche e fitti boschi di larici. È la porta d'accesso al Queyras, una vallata
      d'alta quota delle Alte Alpi custodita dal Parco Naturale Regionale del Queyras, con il Monviso come
      sentinella di confine e il larice quale albero simbolo.
    landscape: >-
      Le origini affondano sul fondale di un oceano preistorico. I coralli fossili del massiccio di Rochebrune
      testimoniano un mare tropicale poco profondo, mentre le ammoniti racchiuse nel marmo di Guillestre
      nuotavano in antichi bassifondi. In seguito la placca africana entrò in collisione con l'Eurasia — uno
      scontro tettonico in atto da 60 milioni di anni — corrugando l'antico fondo marino. Gli scisti lucidi
      diedero forma alle ampie vallate aperte dell'alto Queyras: Molines, Abriès e Saint-Véran. Più tardi le
      acque torrentizie e i ghiacciai diretti verso la Durance modellarono una conca montuosa aperta a
      occidente.


      Il clima rifinisce la conformazione locale. Il Queyras riceve scarse perturbazioni atlantiche; l'aria
      secca favorisce cieli limpidissimi e marcate escursioni termiche. Si manifesta un fenomeno singolare: la
      nebbia, vapore proveniente dalla pianura padana che risale col calore formando un mare di nubi verso le
      10 h, un giorno su tre in estate, dissolvendosi al tramonto. Al di sopra dei 2.400 m la stagione fredda
      persiste più di nove mesi e i pascoli alpini hanno a stento il tempo di fruttificare.


      La flora svela origini remote: il ginepro fenicio di ceppo africano, la salvia d'Etiopia e la lavanda
      giunsero con l'ultimo riscaldamento postglaciale. Nella riserva di Ristolas–Mont Viso si avvicendano
      lariceti, pascoli alpini, torbiere e ghiaioni che contano circa 800 specie di piante vascolari, insieme
      a endemismi delle Alpi sudoccidentali come la regina delle Alpi, la pinguicola di Arvet-Touvet e il
      cardo alpino.
    wildlife: >-
      Quando il manto nevoso si ritira a fine marzo, la [marmotta](/especie/marmota_marmota/) si risveglia dal
      letargo facendosi udire con acuti fischi. La sua notevole diffusione attira numerose coppie di [aquila
      reale](/especie/aquila_chrysaetos/). I pendii erbosi sostengono circa 2.500 [camosci
      alpini](/especie/rupicapra_rupicapra/).


      Lo [stambecco](/especie/capra_ibex/) è tornato per mano dell'uomo: 26 stambecchi alpini furono
      reintrodotti nel 1995 e nel 1998, scegliendo la valle come nodo distributivo provvisto di ottimi
      corridoi ecologici. Nella riserva di Ristolas–Mont Viso si scorgono gracchi, aquile, il
      [gipeto](/especie/gypaetus_barbatus/), il fringuello alpino, il culbianco e il sordone. D'inverno la
      lepre variabile e la [pernice bianca](/especie/lagopus_muta/) mutano il piumaggio e il pelo in un
      candore mimetico.


      La creatura più elusiva è la [salamandra di Lanza](/especie/salamandra_lanzai/): endemica del massiccio
      del Monviso, è l'anfibio più longevo — oltre 20 anni di vita — e rimane attiva all'aperto solo per una
      decina di giorni all'anno. Assieme al camoscio e allo stambecco risente gravemente dei disturbi
      reiterati durante lo svernamento.
    visit: >-
      Tre passi montani consentono l'accesso: le gole del Guil, il colle dell'Agnello e il colle dell'Izoard.
      Se cerchi il cuore selvaggio, raggiungi l'Haut-Guil: la riserva naturale copre 2 295 ettari tra 1700 m e
      3287 m di quota, servita unicamente dalla D947, strada a fondo cieco che unisce Guillestre a Ristolas. A
      piedi si aprono numerosi colli verso l'Italia: Vallante, Traversette, Asti, Couloir du Porc e Pas du
      Sellard. Il rifugio del Viso apre tutta l'estate e nei mesi di marzo e aprile, a circa tre ore di
      cammino dalla Roche Écroulée.


      In inverno lo scialpinismo è consentito nell'intera riserva eccetto nel settore di tranquillità
      Asti–Rocher Mouloun–Clos Sablé dove sverna la pernice bianca. La mountain bike è praticabile su tutti i
      sentieri ad eccezione della traccia che costeggia il Guil tra il Grand Belvédère e il lago Lestio.


      Per comprendere il territorio sono allestiti tre centri museali: Le Soum, L'Arche des Cimes e Le Moulin.
    history: >-
      Queste cime furono abitate fin dal Neolitico, come documentano i reperti nella miniera di rame di
      Saint-Véran e nei pascoli di Urine e del Monviso. Saint-Véran, situato a 2 042 m di quota, vanta il
      primato di comune permanentemente abitato più alto delle Alpi francesi.


      La conservazione annovera due tappe memorabili: il ritorno dello stambecco e la salvaguardia della rara
      farfalla notturna isabella di Francia. I collezionisti la spinsero sull'orlo dell'estinzione negli anni
      1970, inducendo i sindaci di cinque comuni a vietarne la cattura nel 1975, un anno prima della legge
      quadro francese di protezione della natura. La tutela ha previsto la riproduzione in cattività e la
      deposizione sui pini silvestri locali.
    before: >-
      Nella riserva naturale i cani sono rigidamente vietati, anche al guinzaglio. È indispensabile seguire i
      tracciati segnati per non rovinare le delicate praterie; la raccolta di frutti e funghi è consentita
      solo per consumo familiare lungo i sentieri. Nei boschi e pascoli esterni i cani devono essere legati e
      i droni sono proibiti entro 200 metri da fauna selvatica, rifugi e mandrie.


      Il bivacco in tenda è tollerato a oltre un'ora a piedi dal villaggio più vicino per una sola notte,
      montato dopo le 18 h e smontato prima delle 9 h. Dal 2022 le biciclette non possono transitare nel
      vallone di Bouchouse dalle 8 h alle 15 h in luglio e agosto. Il portale web del parco propone itinerari
      filtrabili con tracce GPS.
    around: >-
      Il [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/) si trova a circa 2 km oltre il
      crinale di confine. A sei chilometri sorge il [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), a quattordici chilometri il [Parc National des
      Écrins - Massif](/lugar/parc-national-des-ecrins---massif/) e a venti chilometri il [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/), dove la salamandra di Lanza viene monitorata tramite
      progetti scientifici condivisi.
  pt:
    intro: >-
      Sobe pelo desfiladeiro de Izoard e o horizonte transforma-se em rocha pura. La Casse Déserte, um circo
      mineral eriçado de chaminés de fadas, parece prenunciar um deserto. Mas, mal transpões a crista, surgem
      estepes e frondosos bosques de lariços. Esta é a entrada de Queyras, um vale de alta montanha dos Altos
      Alpes protegido pelo Parque Natural Regional do Queyras, tendo o Monviso como sentinela de fronteira e o
      lariço como árvore tutelar.
    landscape: >-
      Tudo começou no leito de um oceano primordial. Os corais fósseis do maciço de Rochebrune atestam um mar
      tépido e pouco profundo, ao passo que as amonites do mármore de Guillestre nadavam em baixios antigos.
      Depois, a África colidiu com a Eurásia — choque geológico ativo há 60 milhões de anos —, pregueando
      esses fundos marinhos. Os xistos brilhantes deram origem aos vales amplos do alto Queyras: Molines,
      Abriès e Saint-Véran. Mais tarde, as torrentes e glaciares esculpiram uma bacia de montanha voltada para
      ocidente rumo ao rio Durance.


      O clima remata o cenário. O Queyras recebe raras frentes atlânticas; o ar seco proporciona céus límpidos
      e fortes amplitudes térmicas. Ocorre um fenómeno meteorológico característico: a nebbia, nevoeiro vindo
      da planície do Pó que sobe com o calor diurno e forma um mar de nuvens por volta das 10 h, um dia em
      cada três durante o verão, dissipando-se ao pôr do sol. Acima dos 2.400 m o inverno prolonga-se por mais
      de nove meses e os pastos alpinos mal dispõem de tempo para frutificar sementes.


      A flora patenteia origens diversas: o zimbro-turífero de raiz africana, a salva-etíope e a alfazema
      fixaram-se no último grande degelo pós-glaciar. Na reserva de Ristolas–Mont Viso sucedem-se lariçais,
      pastagens alpinas, turfeiras e cascalheiras acolhendo cerca de 800 espécies de plantas com flor, a par
      de endemismos dos Alpes do sudoeste como a rainha-dos-alpes, a pinguícula-de-Arvet-Touvet e o
      cardo-alpino.
    wildlife: >-
      Quando o manto de neve recua no final de março, a [marmota](/especie/marmota_marmota/) desperta do
      torpor com silvos penetrantes. A sua abundância justifica a densidade de
      [águias-reais](/especie/aquila_chrysaetos/) que caçam no vale. As encostas verdejantes sustentam cerca
      de 2.500 [camurças](/especie/rupicapra_rupicapra/).


      O [íbex](/especie/capra_ibex/) regressou pela mão humana: 26 íbexes-alpinos foram reintroduzidos em 1995
      e 1998, tendo o vale sido selecionado por constituir um nó de colonização rico em corredores ecológicos.
      Na reserva de Ristolas–Mont Viso podes também avistar gralhas, o
      [quebra-ossos](/especie/gypaetus_barbatus/), o pardal-alpino, o chasco-cinzento e a ferreirinha-alpina.
      No inverno, a lebre-variável e a [lagópode-branca](/especie/lagopus_muta/) tornam-se brancas para se
      camuflarem na neve.


      O animal mais esquivo é a [salamandra-de-Lanza](/especie/salamandra_lanzai/): exclusiva do maciço do
      Viso, é o anfíbio mais longevo — ultrapassando 20 anos de vida — e só se mostra à superfície cerca de
      dez dias por ano. Tal como a camurça e o íbex, sofre fortemente com perturbações reiteradas nos períodos
      de reprodução e hibernação.
    visit: >-
      Três portas naturais dão acesso ao parque: as gargantas do Guil, o col Agnel e o col d'Izoard. Se
      procuras a vertente mais intocada, ruma ao Haut-Guil: a reserva natural estende-se por 2 295 hectares
      entre os 1700 m e os 3287 m de altitude, tendo na D947 — uma estrada sem saída que liga Guillestre a
      Ristolas — a única via motorizada. A pé cruzam-se múltiplos passos com Itália: Vallante, Traversette,
      Asti, Couloir du Porc e Pas du Sellard. O refúgio do Viso abre durante todo o verão e nos meses de março
      e abril, a cerca de três horas a pé da Roche Écroulée.


      No inverno, o esqui de travessia é permitido em toda a reserva com exceção da zona protegida de
      Asti–Rocher Mouloun–Clos Sablé, onde inverna a lagópode-branca. O BTT é autorizado nos caminhos
      sinalizados, salvo na vereda que margeia o Guil entre o Grand Belvédère e o lago Lestio.


      Para aprofundar conhecimentos existem três centros museológicos: Le Soum, L'Arche des Cimes e Le Moulin.
    history: >-
      Estas montanhas conhecem ocupação humana desde o Neolítico, conforme atestam os vestígios na mina de
      cobre de Saint-Véran e nos pastos de Urine e do Monviso. Saint-Véran, empoleirado a 2 042 m de altitude,
      é afamado por ser o município permanente mais alto dos Alpes franceses.


      A história da conservação guarda dois marcos memoráveis: o regresso do íbex e a salvação da
      borboleta-isabelina (Isabelle de France). O assédio de colecionadores colocou esta espécie à beira do
      colapso nos anos 1970, levando os presidentes de cinco municípios a proibir a sua captura em 1975, um
      ano antes da primeira lei francesa de proteção da natureza. A recuperação combinou reprodução assistida
      e postura de ovos sobre os pinheiros-silvestres locais.
    before: >-
      Na reserva natural os cães são estritamente interditos, mesmo presos por trela. É imperioso caminhar
      apenas pelos trilhos marcados para não danificar a vegetação de altitude; a colheita de plantas
      comestíveis só é consentida em pequenas quantidades familiares junto aos trilhos. Nos pastos comunais e
      florestas os cães devem ir presos e os drones são proibidos a menos de 200 metros de fauna bravia,
      refúgios e gado.


      O bivaque em tenda ligeira é tolerado a mais de uma hora de marcha da aldeia mais próxima, por uma só
      noite, montado após as 18 h e desmontado antes das 9 h. Desde 2022, as bicicletas de montanha não podem
      circular no vale de Bouchouse das 8 h às 15 h em julho e agosto. O portal do parque disponibiliza fichas
      de percursos pedestres com traçados GPS.
    around: >-
      O [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/) dista cerca de 2 km do outro lado da
      fronteira, partilhando o maciço do Viso. A seis quilómetros localiza-se o [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), a catorze quilómetros o [Parc National des Écrins -
      Massif](/lugar/parc-national-des-ecrins---massif/) e a vinte quilómetros o [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/), onde a salamandra-de-Lanza é alvo de campanhas de
      ciência cidadã.
