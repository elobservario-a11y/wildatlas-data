resumen:
  es: >-
    Garganta de ranura kárstica en cuya desembocadura emergen las fuentes termales sulfurosas de Bënja bajo el
    puente otomano de Katiu.
  en: >-
    Karst slot canyon whose mouth gives rise to the sulfurous thermal springs of Bënja beneath the Ottoman
    Katiu bridge.
  fr: >-
    Gorge karstique étroite à l'embouchure de laquelle jaillissent les sources thermales sulfurées de Bënja
    sous le pont ottoman de Katiu.
  de: >-
    Karstige Schlucht, an deren Mündung unter der osmanischen Katiu-Brücke die schwefelhaltigen Thermalquellen
    von Bënja entspringen.
  it: >-
    Gola carsica alla cui foce sgorgano le sorgenti termali solfuree di Bënja sotto il ponte ottomano di
    Katiu.
  pt: >-
    Desfiladeiro cárstico estreito em cuja foz emergem as fontes termais sulfurosas de Bënja sob a ponte
    otomana de Katiu.
