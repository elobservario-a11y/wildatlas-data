observaciones:
  es: >-
    Elige la época según lo que busques: la primavera para la canoa, el verano para vadear la garganta con
    aguas bajas. Los mejores meses van de mayo a octubre.
texto:
  es:
    intro: >-
      Al pie de un puente otomano de piedra, de un solo arco, empieza una grieta de unos cuatro kilómetros por
      la que corre el río Langarica, y en su desembocadura brota agua caliente. El Kanioni i Langaricës está
      junto a Bënjë, en Përmet, en el sur de Albania: un cañón muy estrecho, con paredes de roca de más de
      cien metros, cuevas y, en la salida, las fuentes termales de Bënjë. Está declarado Monumento Natural por
      sus valores geomorfológicos, termales y turísticos, y la web oficial de turismo lo cuenta entre las
      maravillas naturales del sur.
    landscape: >-
      El río Langarica nace a unos 1500 metros en la ladera occidental del Maja Kamenik y acaba en el Vjosa,
      cerca de Petran, a unos cinco kilómetros al sureste de Përmet. En el tramo medio atraviesa la sierra de
      Postenan-Melesin, hecha de flysch y, más abajo, de caliza, y que prolonga hacia el sur la sierra del
      Tomorr. Ahí se forma la garganta: muy estrecha, de unos cuatro kilómetros y hasta cien metros de
      profundidad. En su punto más estrecho, con aguas bajas, tiene casi tres metros de anchura a la altura
      del agua.


      En la garganta hay varias cuevas, entre ellas Shpella e Pëllumbave. En una se hallaron restos de
      habitantes prehistóricos de la Edad del Cobre, y también la usaron los ilirios.
    wildlife: >-
      El caudal manda. En septiembre baja a 0,9 m³ por segundo y la media de enero es de 7,86 m³ por segundo.
      De ahí que la garganta cambie de cara según la estación: en primavera, con buen caudal, se puede
      recorrer en canoa; en pleno verano, con aguas muy bajas, se puede vadear.


      En el agua son frecuentes el alburno, la locha de arroyo y el pseudorasbora; también hay barbo y,
      raramente, anguila. Entre los anfibios viven la rana griega y la rana balcánica. Y en la garganta se ha
      detectado, en los últimos años, al murciélago de Bechstein, algo poco habitual en Albania.
    visit: >-
      La puerta es el puente Kadiu, de arco único, levantado hacia 1760-1770 por orden de un cadí otomano, de
      ahí su nombre. Servía de paso en el camino de caravanas hacia Voskopoja y hoy abre el camino al cañón y
      a las fuentes termales de Bënjë. Desde él se proponen paseos panorámicos para explorar el entorno
      natural y fotografiarlo.


      Las seis fuentes termales de Bënjë brotan con agua de hasta treinta grados, y con más de 160 litros por
      segundo son las más caudalosas de Albania. Las pozas son sencillos estanques de piedra natural, sin
      protección. Ya se conocían en época romana.
    history: >-
      El cañón y su entorno son Monumento Natural. El puente Kadiu, de época otomana, completa el conjunto, y
      las fuentes termales de Bënjë se conocían ya en época romana.
    before: >-
      Elige la época según lo que busques: la primavera para la canoa, el verano para vadear la garganta con
      aguas bajas. Los mejores meses van de mayo a octubre.
    around: >-
      A ocho kilómetros queda el [Gran Cañón del Río Osum](/lugar/kanioni-i-osumit/), a veintiuno el [Parque
      Nacional Vikos-Aoös](/lugar/vikos---aoos-national-park/) y a veintitrés el [Parque Nacional del Río
      Salvaje Vjosa](/lugar/vjosa-wild-river-national-park/), en cuyo río desemboca el Langarica.
  en:
    intro: >-
      At the foot of a single-arched stone Ottoman bridge begins a four-kilometer fissure carved by the
      Langarica River, where warm water bubbles up at its mouth. Kanioni i Langaricës lies near Bënjë, in
      Përmet in southern Albania: a remarkably narrow gorge flanked by rock walls towering over one hundred
      meters, pitted with caves, and opening onto the thermal springs of Bënjë. Designated a Natural Monument
      for its geomorphological, thermal, and recreational values, official tourism sources rank it among the
      foremost natural wonders of the south.
    landscape: >-
      The Langarica River rises at roughly 1,500 meters on the western slopes of Maja Kamenik and joins the
      Vjosa near Petran, some five kilometers southeast of Përmet. Along its middle reach it cuts through the
      Postenan-Melesin range, formed of flysch and lower down of limestone, extending the Tomorr range
      southward. Here the canyon takes shape: exceptionally narrow, stretching four kilometers long and
      plunging up to one hundred meters deep. At its tightest passage during low water, it narrows to scarcely
      three meters across at river level.


      Several caves perforate the gorge, including Shpella e Pëllumbave. In one cavern, archaeologists
      unearthed prehistoric traces from the Copper Age, and Illyrians later frequented the shelter.
    wildlife: >-
      The flow dictates everything. Discharge drops to 0.9 m³ per second in September, while the January
      average reaches 7.86 m³ per second. The canyon changes character with the seasons: in spring, running
      high, it can be negotiated by canoe; in high summer, with shallow water, you can wade through its
      depths.


      Common bleak, stone loach, and topmouth gudgeon inhabit the stream; barbel also occurs, while European
      eel is occasionally recorded. Amphibians include the Greek stream frog and the Balkan water frog. In
      recent years, Bechstein's bat has been documented inside the canyon, a notable record for Albania.
    visit: >-
      The entrance is marked by Kadiu bridge, a single-arch span erected around 1760–1770 on the orders of an
      Ottoman kadi, which gave the structure its name. It served caravan routes toward Voskopoja and today
      marks the starting point for exploring the canyon and the thermal springs of Bënjë. Scenic walks begin
      here to photograph and discover the surrounding wilderness.


      The six thermal springs of Bënjë emerge at temperatures up to thirty degrees Celsius, and discharging
      over 160 liters per second, they are the most copious in Albania. The bathing pools are simple basins
      made of natural stone, without fences. They were already used in Roman times.
    history: >-
      The canyon and its immediate setting are protected as a Natural Monument. The Ottoman-era Kadiu bridge
      complements the ensemble, and the thermal springs of Bënjë were known as far back as Roman antiquity.
    before: >-
      Choose your season according to your aims: spring for canoeing, summer for wading the canyon at low
      water. The best months run from May to October.
    around: >-
      The [Osum River Grand Canyon](/lugar/kanioni-i-osumit/) lies eight kilometers away, [Vikos–Aoös National
      Park](/lugar/vikos---aoos-national-park/) twenty-one kilometers, and the [Vjosa Wild River National
      Park](/lugar/vjosa-wild-river-national-park/), into which the Langarica empties, twenty-three
      kilometers.
  fr:
    intro: >-
      Au pied d'un pont ottoman en pierre à arche unique s'ouvre une faille d'environ quatre kilomètres où
      s'écoule la rivière Langarica, dont l'embouchure libère des eaux chaudes. Le Kanioni i Langaricës se
      situe près de Bënjë, à Përmet, dans le sud de l'Albanie : un défilé très étroit aux falaises rocheuses
      de plus de cent mètres, percé de grottes et débouchant sur les sources thermales de Bënjë. Classé
      Monument naturel pour ses valeurs géomorphologiques, thermales et paysagères, il figure parmi les
      merveilles naturelles du sud du pays.
    landscape: >-
      La Langarica prend sa source à environ 1 500 mètres d'altitude sur le versant ouest du Maja Kamenik et
      se jette dans la Vjosa près de Petran, à cinq kilomètres au sud-est de Përmet. Dans son cours moyen,
      elle traverse le chaînon de Postenan-Melesin, composé de flysch puis de calcaire, prolongeant le massif
      de Tomorr vers le sud. C'est là que se creuse la gorge : très resserrée, longue de quatre kilomètres et
      profonde de cent mètres par endroits. En étiage, son passage le plus étroit ne mesure que trois mètres
      d'une paroi à l'autre au fil de l'eau.


      Plusieurs cavernes percent le canyon, notamment Shpella e Pëllumbave. Des vestiges préhistoriques de
      l'âge du cuivre y ont été découverts, et les Illyriens l'ont également fréquentée.
    wildlife: >-
      Le débit dicte la vie du canyon. En septembre, il descend à 0,9 m³ par seconde, tandis que la moyenne de
      janvier s'établit à 7,86 m³ par seconde. La gorge change ainsi d'aspect selon les saisons : au
      printemps, avec de hautes eaux, elle se descend en canoë ; en plein été, avec un cours bas, on peut la
      remonter à gué.


      Dans l'eau abondent l'ablette, la loche franche et le goujon asiatique ; le barbeau s'y rencontre
      également et l'anguille d'Europe plus rarement. Parmi les amphibiens figurent la grenouille grecque et
      la grenouille balkanique. Ces dernières années, le murin de Bechstein a été inventorié dans le canyon,
      observation notable en Albanie.
    visit: >-
      L'accès s'effectue par le pont Kadiu, à arche unique, bâti vers 1760–1770 sur ordre d'un cadi ottoman,
      d'où son nom. Il servait au passage des caravanes vers Voskopoja et commande aujourd'hui l'entrée du
      défilé et des bains thermaux de Bënjë. Des belvédères y offrent des vues saisissantes pour photographier
      les parois rocheuses.


      Les six sources thermales de Bënjë jaillissent à des températures atteignant trente degrés, et leur
      débit cumulé de plus de 160 litres par seconde en fait les plus abondantes d'Albanie. Les bassins sont
      de simples vasques de pierre naturelle sans aménagement. Elles étaient déjà réputées à l'époque romaine.
    history: >-
      Le canyon et ses abords sont protégés comme Monument naturel. Le pont Kadiu, d'époque ottomane, complète
      l'ensemble, et les sources thermales de Bënjë étaient déjà exploitées dans l'Antiquité romaine.
    before: >-
      Choisissez votre période selon vos projets : le printemps pour le canoë, l'été pour remonter le canyon à
      gué à l'étiage. Les meilleurs mois s'étendent de mai à octobre.
    around: >-
      Le [grand canyon de la rivière Osum](/lugar/kanioni-i-osumit/) se trouve à huit kilomètres, le [parc
      national de Vikos-Aoös](/lugar/vikos---aoos-national-park/) à vingt et un kilomètres et le [parc
      national du fleuve sauvage Vjosa](/lugar/vjosa-wild-river-national-park/), où se jette la Langarica, à
      vingt-trois kilomètres.
  de:
    intro: >-
      Am Fuß einer einbogigen osmanischen Steinbrücke beginnt eine rund vier Kilometer lange Felsspalte, durch
      die der Fluss Langarica fließt und an deren Mündung warmes Quellwasser hervorsprudelt. Der Kanioni i
      Langaricës liegt nahe Bënjë bei Përmet im Süden Albaniens: eine extrem enge Schlucht mit über hundert
      Meter hohen Felswänden, Höhlen und den Thermalquellen von Bënja an ihrem Ausgang. Wegen seiner
      geomorphologischen, thermalen und landschaftlichen Besonderheiten ist er als Naturdenkmal geschützt und
      zählt zu den Naturwundern des Südens.
    landscape: >-
      Der Langarica entspringt auf etwa 1.500 Metern Höhe an den Westflanken des Maja Kamenik und mündet nahe
      Petran, fünf Kilometer südöstlich von Përmet, in die Vjosa. Im Mittellauf durchschneidet er den Höhenzug
      Postenan-Melesin aus Flysch und Kalkstein, der das Tomorr-Gebirge nach Süden fortsetzt. Dort bildet sich
      die Schlucht: sehr eng, vier Kilometer lang und bis zu hundert Meter tief. An der schmalsten Stelle bei
      Niedrigwasser misst der Durchlass auf Wasserhöhe kaum drei Meter.


      In der Schlucht verbergen sich mehrere Höhlen, darunter Shpella e Pëllumbave. In einer davon wurden
      bronzezeitliche Spuren früherer Bewohner entdeckt, und auch die Illyrer nutzten die Höhlen.
    wildlife: >-
      Die Wassermenge bestimmt den Rhythmus. Im September sinkt der Abfluss auf 0,9 m³ pro Sekunde, während
      das Januarmittel 7,86 m³ pro Sekunde erreicht. Daher wandelt die Schlucht im Jahreslauf ihr Gesicht: Im
      Frühjahr bei hohem Wasserstand lässt sie sich mit dem Kanu befahren, im Hochsommer bei Niedrigwasser
      durchwaten.


      Im Fluss leben Ukelei, Bachschmerle und Blaubandbärbling; auch Barben und seltener Aale kommen vor.
      Unter den Amphibien finden sich Griechischer Frosch und Balkan-Wasserfrosch. In den Höhlen der Schlucht
      wurde in den letzten Jahren die Bechsteinfledermaus nachgewiesen, ein bemerkenswerter Fund für Albanien.
    visit: >-
      Ausgangspunkt ist die Kadiu-Brücke, ein einbogiges Bauwerk, das um 1760–1770 auf Geheiß eines
      osmanischen Kadi errichtet wurde. Sie diente Karawanen auf dem Weg nach Voskopoja und öffnet heute den
      Zugang zur Schlucht und den Quellen von Bënjë. Von dort bieten sich Fotopunkte für die wilde
      Schluchtlandschaft an.


      Die sechs Thermalquellen von Bënjë treten mit Temperaturen von bis zu dreißig Grad hervor. Mit mehr als
      160 Litern Schüttung pro Sekunde sind sie die ergiebigsten Albaniens. Die Badebecken sind einfache
      Mulden aus Naturstein ohne künstliche Fassung. Schon in römischer Zeit waren sie geschätzt.
    history: >-
      Die Schlucht und ihre Umgebung sind als Naturdenkmal geschützt. Die osmanische Kadiu-Brücke ergänzt das
      Ensemble, und die Thermalquellen von Bënjë waren bereits in der römischen Epoche bekannt.
    before: >-
      Wähle die Reisezeit nach deinem Vorhaben: das Frühjahr für Kanufahrten, den Sommer zum Durchwaten bei
      Niedrigwasser. Die besten Monate reichen von Mai bis Oktober.
    around: >-
      Der [Große Osum-Canyon](/lugar/kanioni-i-osumit/) liegt acht Kilometer entfernt, der [Nationalpark
      Vikos-Aoös](/lugar/vikos---aoos-national-park/) einundzwanzig Kilometer und der [Nationalpark Wildfluss
      Vjosa](/lugar/vjosa-wild-river-national-park/), in den der Langarica mündet, dreiundzwanzig Kilometer.
  it:
    intro: >-
      Ai piedi di un ponte ottomano in pietra a una sola arcata comincia una fenditura di circa quattro
      chilometri scavata dal fiume Langarica, al cui sbocco affiorano acque calde. Il Kanioni i Langaricës si
      trova vicino a Bënjë, nel territorio di Përmet nel sud dell'Albania: una forra strettissima con pareti
      rocciose di oltre cento metri, caverne e, all'uscita, le sorgenti termali di Bënjë. È dichiarato
      Monumento naturale per i suoi pregi geomorfologici, termali e turistici, e le guide ufficiali lo
      annoverano tra i gioielli naturali del sud.
    landscape: >-
      Il fiume Langarica nasce a circa 1.500 metri d'altitudine sulle pendici occidentali del Maja Kamenik e
      confluisce nella Vjosa vicino a Petran, circa cinque chilometri a sud-est di Përmet. Nel suo corso medio
      incide la catena di Postenan-Melesin, formata da flysch e più in basso da calcare, che prolunga verso
      sud il massiccio del Tomorr. Qui si apre la gola: angusta, lunga quattro chilometri e profonda fino a
      cento metri. Nel punto più stretto, in regime di magra, misura appena tre metri di larghezza a filo
      d'acqua.


      Nella forra si aprono diverse grotte, tra cui Shpella e Pëllumbave. In una cavità sono stati rinvenuti
      reperti dell'età del rame, ed essa fu in seguito frequentata dagli Illiri.
    wildlife: >-
      La portata governa l'ambiente. A settembre scende a 0,9 m³ al secondo, mentre la media di gennaio tocca
      i 7,86 m³ al secondo. La forra muta d'aspetto con le stagioni: in primavera, con acque abbondanti, si
      discende in canoa; in piena estate, a livelli minimi, si risale a guado.


      Nel corso d'acqua nuotano alborelle, cobiti barbatelli e pseudorasbora; compaiono anche il barbo e,
      raramente, l'anguilla. Tra gli anfibi figurano la rana greca e la rana balcanica. Negli ultimi anni
      nella gola è stato censito il vespertilio di Bechstein, una presenza notevole per l'Albania.
    visit: >-
      Il punto di partenza è il ponte Kadiu, a campata unica, innalzato intorno al 1760–1770 per volere di un
      cadì ottomano, da cui ha preso il nome. Serviva da passaggio carovaniero verso Voskopoja e oggi immette
      nella forra e verso le sorgenti termali di Bënjë. Da qui partono percorsi per fotografare la gola.


      Le sei sorgenti termali di Bënjë sgorgano ad una temperatura che raggiunge i trenta gradi, e con oltre
      160 litri al secondo rappresentano le più copiose d'Albania. Le vasche sono semplici pozze in pietra
      naturale senza recinzioni. Erano frequentate già in epoca romana.
    history: >-
      Il canyon e l'area circostante sono protetti come Monumento naturale. Il ponte Kadiu di epoca ottomana
      completa lo scenario, e le sorgenti termali di Bënjë erano note fin dall'epoca romana.
    before: >-
      Scegli il periodo a seconda delle tue preferenze: la primavera per la canoa, l'estate per risalire la
      forra a piedi a bassi livelli d'acqua. I mesi migliori vanno da maggio a ottobre.
    around: >-
      A otto chilometri si trova il [Grand Canyon del Fiume Osum](/lugar/kanioni-i-osumit/), a ventuno il
      [Parco Nazionale Vikos-Aoös](/lugar/vikos---aoos-national-park/) e a ventitré il [Parco Nazionale del
      Fiume Selvaggio Vjosa](/lugar/vjosa-wild-river-national-park/), nel cui alveo sfocia il Langarica.
  pt:
    intro: >-
      Ao pé de uma ponte otomana de pedra de arco único abre-se uma fenda de cerca de quatro quilómetros por
      onde corre o rio Langarica, em cuja foz brota água quente. O Kanioni i Langaricës situa-se junto a
      Bënjë, em Përmet, no sul da Albânia: um desfiladeiro muito estreito, com escarpas de rocha com mais de
      cem metros, grutas e, na saída, as fontes termais de Bënjë. Está classificado como Monumento Natural
      pelos seus valores geomorfológicos, termais e turísticos, e o turismo oficial considera-o uma das
      maravilhas do sul.
    landscape: >-
      O rio Langarica nasce a cerca de 1.500 metros na encosta ocidental de Maja Kamenik e desagua no Vjosa
      perto de Petran, cinco quilómetros a sudeste de Përmet. No seu curso médio perfura a serra de
      Postenan-Melesin, formada por flysch e calcário, que prolonga o maciço de Tomorr para sul. É aí que se
      forma a garganta: muito apertada, com quatro quilómetros de extensão e até cem metros de profundidade.
      No ponto mais estreito, na época de estio, tem quase três metros de largura ao nível da água.


      Na garganta existem várias grutas, entre as quais Shpella e Pëllumbave. Numa delas encontraram-se
      vestígios de povoamento da Idade do Cobre, tendo sido igualmente utilizada pelos ilírios.
    wildlife: >-
      O caudal dita as condições. Em setembro desce para 0,9 m³ por segundo, enquanto a média de janeiro é de
      7,86 m³ por segundo. Por isso, a garganta transforma-se consoante a estação: na primavera, com caudal
      abundante, desce-se em canoa; em pleno verão, com o rio raso, percorre-se a vau.


      Na água abundam o alburno, a cobilha e o falso-rabora; há também barbos e, raramente, enguias. Entre os
      anfíbios contam-se a rã-grega e a rã-balcânica. Nos últimos anos foi identificado na garganta o
      morcego-de-bechstein, um achado invulgar na Albânia.
    visit: >-
      A porta de entrada é a ponte Kadiu, de arco único, erguida por volta de 1760–1770 por ordem de um cádi
      otomano, que lhe deu o nome. Servia de travessia na rota de caravanas para Voskopoja e hoje abre caminho
      ao canhão e às fontes termais de Bënjë. A partir dela existem miradouros para apreciar o enquadramento
      natural e fotografar.


      As seis fontes termais de Bënjë brotam com águas que atingem os trinta graus, e com mais de 160 litros
      por segundo são as mais caudalosas da Albânia. As piscinas são poças simples de pedra natural sem
      proteção. Eram já frequentadas na época romana.
    history: >-
      O canhão e a sua envolvente constituem um Monumento Natural. A ponte Kadiu, de traça otomana, remata o
      conjunto, e as fontes termais de Bënjë eram conhecidas desde o tempo dos romanos.
    before: >-
      Escolhe a época consoante o teu plano: a primavera para a canoa, o verão para caminhar no leito da
      garganta em águas baixas. Os melhores meses decorrem de maio a outubro.
    around: >-
      A oito quilómetros fica o [Grande Canhão do Rio Osum](/lugar/kanioni-i-osumit/), a vinte e um o [Parque
      Nacional Vikos-Aoös](/lugar/vikos---aoos-national-park/) e a vinte e três o [Parque Nacional do Rio
      Selvagem Vjosa](/lugar/vjosa-wild-river-national-park/), no qual desagua o Langarica.
