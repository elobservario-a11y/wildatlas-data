resumen:
  es: >-
    El área forestal más salvaje de Luxemburgo rodeando los cañones y el embalse del Alto Sûre en el macizo de
    Oesling.
  en: >-
    The wildest forested area in Luxembourg surrounding the canyons and reservoir of the Haute-Sûre in the
    Oesling massif.
  fr: >-
    La zone forestière la plus sauvage du Luxembourg entourant les gorges et le réservoir de la Haute-Sûre
    dans le massif de l'Oesling.
  de: >-
    Das wildeste Waldgebiet Luxemburgs rund um die Schluchten und den Stausee der Haute-Sûre im
    Oesling-Massiv.
  it: >-
    L'area forestale più selvaggia del Lussemburgo che circonda le gole e il serbatoio dell'Haute-Sûre nel
    massiccio dell'Oesling.
  pt: >-
    A área florestal mais selvagem do Luxemburgo em torno dos canhões e da albufeira da Haute-Sûre no maciço
    de Oesling.
unico:
  es: >-
    Es el parque de un embalse que da de beber a medio país y cuyas orillas, boscosas y casi vírgenes, se
    recorren a pie.
  en: >-
    A park built around a reservoir that supplies drinking water to half a country, whose wooded,
    near-pristine shores are explored on foot.
  fr: >-
    Un parc construit autour d'un réservoir qui alimente en eau potable la moitié d'un pays, dont les rives
    boisées et quasi-vierges se parcourent à pied.
  de: >-
    Ein Park rund um einen Stausee, der die Hälfte eines Landes mit Trinkwasser versorgt, dessen bewaldete,
    nahezu unberührte Ufer man zu Fuß erkundet.
  it: >-
    Un parco costruito attorno a un serbatoio che fornisce acqua potabile a metà nazione, le cui sponde
    boscose e quasi incontaminate si percorrono a piedi.
  pt: >-
    Um parque construído em torno de uma albufeira que abastece de água potável metade de um país, cujas
    margens arborizadas e quase intocadas se percorrem a pé.
observaciones:
  es: >-
    Por la protección del agua potable, en las zonas de protección 1 y 2a, desde la presa de Esch-Sauer hasta
    Lultzhausen, están prohibidas todas las actividades de ocio, salvo los senderos señalizados. En la zona
    2b, de Lultzhausen a la frontera belga, se permiten ocio y deportes acuáticos si no usan motor. Acampar en
    libertad está prohibido en todo Luxemburgo, también en las praderas del embalse, donde no se admiten
    perros salvo en Rommwiss, y hay que llevarse la basura o tirarla en los contenedores previstos.
texto:
  es:
    intro: >-
      Para llenar un embalse hubo que cerrar un valle, y de ese cierre nació un parque. Desde 1950, cuando se
      construyó la presa, se debatió crear aquí un «parque nacional» o un «parque natural». Tardó casi medio
      siglo: en 1999 se fundó oficialmente el Naturpark Öewersauer, el primer parque natural de Luxemburgo, en
      torno al lago de la Haute-Sûre, el mayor lago artificial del país. Con 380 hectáreas, el lago abastece
      de agua potable a dos tercios de la población luxemburguesa. Alrededor, el relieve del Oesling se vuelve
      bosque, arroyo y ladera empinada.
    landscape: >-
      El agua lo manda todo. La presa de Esch-sur-Sûre se construyó en los años cincuenta para cubrir las
      necesidades de agua potable y electricidad de Luxemburgo. Hoy, además, el embalse Obersauer es una zona
      de recreo, con laderas empinadas y boscosas que llegan a menudo hasta la orilla y dan un paisaje
      natural, casi intacto.


      Pero el embalse es solo el corazón. Muchos arroyos en valles escondidos, el río Sûre y sus afluentes,
      las praderas húmedas y los bosques aluviales forman el tejido del que se ocupa la red Natura 2000 de la
      zona. Las ocho zonas Natura 2000 del comité Uewersauer se articulan alrededor de ese tejido de agua. Y
      la mano humana también dejó su huella en los prados. El «Fléizen» era un método tradicional de inundar
      los prados desde arroyos y ríos mediante zanjas, para acelerar el crecimiento de la hierba y regar en
      verano. Las zanjas, los estanques «Fléizweiher» y las presas, junto con los prados inundados, forman hoy
      hábitats húmedos valiosos para muchas especies raras.
    wildlife: >-
      Entre las especies emblemáticas de los espacios Natura 2000 de Uewersauer figuran el [castor
      europeo](/especie/castor_fiber/), una mariposa, el cuivré de la bistorte, la [cigüeña
      negra](/especie/ciconia_nigra/) y los murciélagos. La cigüeña negra pesca en los cursos de agua y anida
      en bosques antiguos y tranquilos del valle de la Haute-Sûre. Entre las aves destacadas del sitio, el
      [águila pescadora](/especie/pandion_haliaetus/), el [mirlo acuático](/especie/cinclus_cinclus/), el
      grévol, el [martín pescador](/especie/alcedo_atthis/) y el [pico negro](/especie/dryocopus_martius/).


      Para quien sale de excursión con prismáticos, la primavera y el verano son buenos para los anfibios: el
      parque propone una ruta de anfibios que combina el barco solar con una caminata de unos 8 km por la
      orilla izquierda del embalse. Cada año, además, la acción «Schmuewelen am Naturpark» ayuda a las
      golondrinas y a otras aves que anidan en edificios.
    visit: >-
      El Centro del Parque Natural está en Esch-Sauer, en la antigua fábrica de paños, convertida en 1992:
      tiene oficina de turismo, una tienda de productos regionales, el museo de la fábrica y una exposición
      interactiva sobre el parque. Desde allí se puede organizar casi todo.


      Para caminar, el parque ofrece caminatas en grupo con un ranger que explica los principales paisajes y
      valores naturales. Entre los senderos temáticos fáciles están el Skulpturenweg y el camino de meditación
      Waassersenneswee. La red incluye dieciocho rutas circulares Éislek Pied de dificultad media, reconocidas
      como rutas de calidad por la Asociación Europea de Senderismo. El Circuit du Lac es un sendero de 44
      kilómetros cuyos paneles interpretativos pueden recorrerse a pie en etapas. Los paneles del proyecto
      L’histoire de la Haute-Sûre están en francés, alemán e inglés y cuentan los cambios del paisaje
      regional. En bicicleta también se puede descubrir, aunque el relieve hace que su red ciclista sea menos
      extensa que en el resto del país.


      Sobre el agua, el barco solar organiza una excursión guiada de naturaleza de dos horas, con parada en el
      centro Burfelt: allí se conocen la flora y fauna del embalse, su historia y la protección del agua
      potable. La ruta de anfibios pasa junto al legendario Hellekessel y cruza la presa auxiliar hacia
      Liefrange. El Schoofsbësch, una antigua cantera, es el corazón de una reserva natural.
    history: >-
      El parque se apoya en un contrato entre el Estado y los municipios, renovado por última vez en 2016 por
      diez años más. Desde 2012 abarca cuatro municipios, y desde 2016 también Wiltz. Sus medidas de
      conservación incluyen restaurar praderas y humedales, recuperar bosques aluviales y convertir
      plantaciones de coníferas en bosques mixtos, y prevén proteger orillas, restablecer franjas herbáceas y
      asegurar galerías subterráneas que usan para hibernar las colonias de murciélagos.
    before: >-
      Por la protección del agua potable, en las zonas de protección 1 y 2a, desde la presa de Esch-Sauer
      hasta Lultzhausen, están prohibidas todas las actividades de ocio, salvo los senderos señalizados. En la
      zona 2b, de Lultzhausen a la frontera belga, se permiten ocio y deportes acuáticos si no usan motor.
      Acampar en libertad está prohibido en todo Luxemburgo, también en las praderas del embalse, donde no se
      admiten perros salvo en Rommwiss, y hay que llevarse la basura o tirarla en los contenedores previstos.
    around: >-
      El [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) está pegado al Öewersauer, y a unos 9 km
      queda el [Bosque de Anlier](/lugar/foret-d-anlier/); a unos 10 km, el [Gran Bosque de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/). A unos veintiún kilómetros está el [Parc National
      de la Vallée de la Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), y a unos veintitrés, la
      región de la [Vallée de l’Ernz noire / Beaufort /
      Berdorf](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/).
  en:
    intro: >-
      To fill a reservoir, a valley had to be closed, and from that closure a park was born. Since 1950, when
      the dam was built, there had been debate about creating a "national park" or "nature park" here. It took
      nearly half a century: in 1999 the Naturpark Öewersauer was officially founded, Luxembourg's first
      nature park, around the Haute-Sûre lake, the largest artificial lake in the country. With 380 hectares,
      the lake supplies drinking water to two thirds of the Luxembourg population. Around it, the relief of
      the Oesling becomes forest, stream and steep slope.
    landscape: >-
      Water rules everything. The Esch-sur-Sûre dam was built in the nineteen-fifties to meet Luxembourg's
      drinking water and electricity needs. Today the Obersauer reservoir is also a recreational area, with
      steep, wooded slopes that often reach right down to the shore and give a natural, almost untouched
      landscape.


      But the reservoir is only the heart. Many streams in hidden valleys, the Sûre river and its tributaries,
      wet meadows and alluvial forests form the fabric managed by the Natura 2000 network of the area. The
      eight Natura 2000 sites of the Uewersauer committee are articulated around that web of water. And the
      human hand also left its mark on the meadows. The "Fléizen" was a traditional method of flooding meadows
      from streams and rivers through ditches, to speed up grass growth and irrigate in summer. The ditches,
      the "Fléizweiher" ponds and dams, together with the flooded meadows, now form valuable wetland habitats
      for many rare species.
    wildlife: >-
      Among the flagship species of the Uewersauer Natura 2000 sites are the [European
      beaver](/especie/castor_fiber/), a butterfly — the scarce copper — the [black
      stork](/especie/ciconia_nigra/) and bats. The black stork fishes in watercourses and nests in old,
      undisturbed forests of the Haute-Sûre valley. Among the notable birds of the site: the
      [osprey](/especie/pandion_haliaetus/), the [dipper](/especie/cinclus_cinclus/), the hazel grouse, the
      [common kingfisher](/especie/alcedo_atthis/) and the [black woodpecker](/especie/dryocopus_martius/).


      For those heading out with binoculars, spring and summer are good for amphibians: the park offers an
      amphibian route combining the solar boat with a walk of about 8 km along the left bank of the reservoir.
      Each year, the "Schmuewelen am Naturpark" action also helps swallows and other birds that nest in
      buildings.
    visit: >-
      The Nature Park Centre is in Esch-Sauer, in the former cloth mill, converted in 1992: it has a tourist
      office, a regional products shop, the mill museum and an interactive exhibition about the park. Almost
      everything can be organised from there.


      For walking, the park offers group hikes with a ranger who explains the main landscapes and natural
      values. Among the easy themed trails are the Skulpturenweg and the Waassersenneswee meditation path. The
      network includes eighteen medium-difficulty Éislek Pied circular routes, recognised as quality routes by
      the European Ramblers' Association. The Circuit du Lac is a 44-kilometre trail whose interpretive panels
      can be walked in stages. The panels of the L'histoire de la Haute-Sûre project are in French, German and
      English and recount changes in the regional landscape. The area can also be explored by bicycle, though
      the relief makes the cycling network less extensive than elsewhere in the country.


      On the water, the solar boat runs a two-hour guided nature excursion with a stop at the Burfelt centre:
      visitors learn about the reservoir's flora and fauna, its history and drinking-water protection. The
      amphibian route passes by the legendary Hellekessel and crosses the auxiliary dam towards Liefrange. The
      Schoofsbësch, a former quarry, is the heart of a nature reserve.
    history: >-
      The park rests on a contract between the State and the municipalities, most recently renewed in 2016 for
      ten more years. Since 2012 it has covered four municipalities, and since 2016 also Wiltz. Its
      conservation measures include restoring meadows and wetlands, recovering alluvial forests and converting
      conifer plantations into mixed forests, and plans to protect banks, re-establish herbaceous strips and
      secure underground galleries used by bat colonies for hibernation.
    before: >-
      For drinking-water protection, in protection zones 1 and 2a, from the Esch-Sauer dam to Lultzhausen, all
      leisure activities are prohibited except on marked paths. In zone 2b, from Lultzhausen to the Belgian
      border, leisure and water sports are permitted if they use no motor. Wild camping is prohibited
      throughout Luxembourg, including on the reservoir meadows, where dogs are not allowed except at
      Rommwiss, and litter must be taken away or placed in the designated bins.
    around: >-
      The [Naturpark Our — Ourtal](/lugar/naturpark-our---ourtal/) adjoins the Öewersauer, and about 9 km away
      is the [Anlier Forest](/lugar/foret-d-anlier/); about 10 km away, the [Great Forest of
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/). About twenty-one kilometres away is the [Parc
      Naturel de la Vallée de la Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), and about
      twenty-three kilometres away, the [Vallée de l'Ernz noire / Beaufort / Berdorf
      region](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/).
  fr:
    intro: >-
      Pour remplir un réservoir, il a fallu fermer une vallée, et de cette fermeture est né un parc. Depuis
      1950, date de construction du barrage, on a débattu de la création ici d'un « parc national » ou d'un «
      parc naturel ». Cela a pris près d'un demi-siècle : en 1999, le Naturpark Öewersauer a été
      officiellement fondé, premier parc naturel du Luxembourg, autour du lac de la Haute-Sûre, le plus grand
      lac artificiel du pays. Avec 380 hectares, le lac alimente en eau potable les deux tiers de la
      population luxembourgeoise. Alentour, le relief de l'Oesling se fait forêt, ruisseau et versant escarpé.
    landscape: >-
      L'eau commande tout. Le barrage d'Esch-sur-Sûre a été construit dans les années cinquante pour couvrir
      les besoins en eau potable et en électricité du Luxembourg. Aujourd'hui, le réservoir Obersauer est
      aussi un espace de loisirs, avec des pentes escarpées et boisées qui descendent souvent jusqu'au bord et
      donnent un paysage naturel, presque intact.


      Mais le réservoir n'est que le cœur. De nombreux ruisseaux dans des vallées cachées, la Sûre et ses
      affluents, les prairies humides et les forêts alluviales forment le tissu que gère le réseau Natura 2000
      de la zone. Les huit sites Natura 2000 du comité Uewersauer s'articulent autour de ce réseau d'eau. Et
      la main humaine a aussi laissé son empreinte sur les prairies. Le « Fléizen » était une méthode
      traditionnelle d'inondation des prairies depuis les ruisseaux et rivières par des fossés, pour accélérer
      la croissance de l'herbe et irriguer en été. Les fossés, les étangs « Fléizweiher » et les barrages,
      ainsi que les prairies inondées, forment aujourd'hui des habitats humides précieux pour de nombreuses
      espèces rares.
    wildlife: >-
      Parmi les espèces emblématiques des espaces Natura 2000 d'Uewersauer figurent le [castor
      européen](/especie/castor_fiber/), un papillon — le cuivré de la bistorte —, la [cigogne
      noire](/especie/ciconia_nigra/) et les chauves-souris. La cigogne noire pêche dans les cours d'eau et
      niche dans les forêts anciennes et tranquilles de la vallée de la Haute-Sûre. Parmi les oiseaux
      remarquables du site : le [balbuzard pêcheur](/especie/pandion_haliaetus/), le [cincle
      plongeur](/especie/cinclus_cinclus/), la gélinotte des bois, le
      [martin-pêcheur](/especie/alcedo_atthis/) et le [pic noir](/especie/dryocopus_martius/).


      Pour ceux qui sortent avec des jumelles, le printemps et l'été sont propices aux amphibiens : le parc
      propose un itinéraire amphibiens combinant le bateau solaire avec une marche d'environ 8 km sur la rive
      gauche du réservoir. Chaque année, l'action « Schmuewelen am Naturpark » aide également les hirondelles
      et d'autres oiseaux nichant dans les bâtiments.
    visit: >-
      Le Centre du Parc Naturel est à Esch-Sauer, dans l'ancienne fabrique de draps, reconvertie en 1992 : il
      comprend un office de tourisme, une boutique de produits régionaux, le musée de la fabrique et une
      exposition interactive sur le parc. Presque tout peut s'y organiser.


      Pour la marche, le parc propose des randonnées en groupe avec un ranger qui explique les principaux
      paysages et valeurs naturelles. Parmi les sentiers thématiques faciles, le Skulpturenweg et le sentier
      de méditation Waassersenneswee. Le réseau comprend dix-huit circuits Éislek Pied de difficulté moyenne,
      reconnus comme itinéraires de qualité par l'Association Européenne de Randonnée Pédestre. Le Circuit du
      Lac est un sentier de 44 kilomètres dont les panneaux interprétatifs peuvent être parcourus à pied par
      étapes. Les panneaux du projet L'histoire de la Haute-Sûre sont en français, allemand et anglais et
      racontent les changements du paysage régional. Le territoire se découvre aussi à vélo, bien que le
      relief rende son réseau cycliste moins étendu qu'ailleurs dans le pays.


      Sur l'eau, le bateau solaire propose une excursion guidée nature de deux heures, avec arrêt au centre
      Burfelt : on y découvre la flore et faune du réservoir, son histoire et la protection de l'eau potable.
      L'itinéraire amphibiens longe le légendaire Hellekessel et traverse le barrage auxiliaire vers
      Liefrange. Le Schoofsbësch, une ancienne carrière, est au cœur d'une réserve naturelle.
    history: >-
      Le parc repose sur un contrat entre l'État et les communes, renouvelé pour la dernière fois en 2016 pour
      dix ans supplémentaires. Depuis 2012, il couvre quatre communes, et depuis 2016 aussi Wiltz. Ses mesures
      de conservation comprennent la restauration de prairies et de zones humides, la reconstitution de forêts
      alluviales et la conversion de plantations de conifères en forêts mixtes, et prévoient de protéger les
      berges, rétablir des lisières herbacées et sécuriser des galeries souterraines utilisées par les
      colonies de chauves-souris pour l'hibernation.
    before: >-
      En raison de la protection de l'eau potable, dans les zones de protection 1 et 2a, du barrage
      d'Esch-Sauer à Lultzhausen, toutes les activités de loisirs sont interdites, sauf les sentiers balisés.
      En zone 2b, de Lultzhausen à la frontière belge, les loisirs et les sports nautiques sans moteur sont
      autorisés. Le camping sauvage est interdit dans tout le Luxembourg, y compris dans les prairies du
      réservoir, où les chiens ne sont pas admis sauf à Rommwiss, et les déchets doivent être remportés ou
      jetés dans les conteneurs prévus.
    around: >-
      Le [Naturpark Our — Ourtal](/lugar/naturpark-our---ourtal/) jouxte l'Öewersauer, et à environ 9 km se
      trouve la [Forêt d'Anlier](/lugar/foret-d-anlier/) ; à environ 10 km, la [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/). À environ vingt-et-un kilomètres se trouve le [Parc
      Naturel de la Vallée de la Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), et à environ
      vingt-trois kilomètres, la région de la [Vallée de l'Ernz noire / Beaufort /
      Berdorf](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/).
  de:
    intro: >-
      Um einen Stausee zu füllen, musste ein Tal verschlossen werden, und aus diesem Verschluss entstand ein
      Park. Seit 1950, als der Damm gebaut wurde, wurde über die Schaffung eines „Nationalparks" oder
      „Naturparks" hier diskutiert. Es dauerte fast ein halbes Jahrhundert: 1999 wurde der Naturpark
      Öewersauer offiziell gegründet, Luxemburgs erster Naturpark, rund um den Haute-Sûre-See, den größten
      Kunstsee des Landes. Mit 380 Hektar versorgt der See zwei Drittel der luxemburgischen Bevölkerung mit
      Trinkwasser. Ringsherum wird das Relief des Oesling zu Wald, Bach und Steilhang.
    landscape: >-
      Das Wasser regiert alles. Der Damm von Esch-sur-Sûre wurde in den fünfziger Jahren gebaut, um Luxemburgs
      Bedarf an Trinkwasser und Strom zu decken. Heute ist der Obersauer-Stausee auch ein Erholungsgebiet, mit
      steilen, bewaldeten Hängen, die oft bis ans Ufer reichen und eine natürliche, nahezu unberührte
      Landschaft ergeben.


      Doch der Stausee ist nur das Herzstück. Viele Bäche in verborgenen Tälern, die Sûre und ihre
      Nebenflüsse, Feuchtwiesen und Auwälder bilden das Gefüge, um das sich das Natura-2000-Netzwerk der
      Region kümmert. Die acht Natura-2000-Gebiete des Uewersauer-Komitees gliedern sich um dieses Wassernetz.
      Und auch die Menschenhand hinterließ ihre Spuren auf den Wiesen. Das „Fléizen" war eine traditionelle
      Methode, Wiesen über Gräben aus Bächen und Flüssen zu überfluten, um das Graswachstum zu beschleunigen
      und im Sommer zu bewässern. Die Gräben, die „Fléizweiher"-Teiche und Dämme bilden heute zusammen mit den
      überfluteten Wiesen wertvolle Feuchtlebensräume für viele seltene Arten.
    wildlife: >-
      Zu den Leitarten der Uewersauer Natura-2000-Gebiete zählen der [Europäische
      Biber](/especie/castor_fiber/), ein Schmetterling — der Ampferampfer-Feuerfalter —, der
      [Schwarzstorch](/especie/ciconia_nigra/) und Fledermäuse. Der Schwarzstorch fischt in Fließgewässern und
      nistet in alten, ruhigen Wäldern des Haute-Sûre-Tals. Zu den bemerkenswerten Vögeln des Gebiets: der
      [Fischadler](/especie/pandion_haliaetus/), die [Wasseramsel](/especie/cinclus_cinclus/), das Haselhuhn,
      der [Eisvogel](/especie/alcedo_atthis/) und der [Schwarzspecht](/especie/dryocopus_martius/).


      Für Ausflügler mit Fernglas sind Frühling und Sommer gut für Amphibien: Der Park bietet eine
      Amphibienroute an, die das Solarboot mit einer Wanderung von etwa 8 km am linken Ufer des Stausees
      kombiniert. Jedes Jahr hilft die Aktion „Schmuewelen am Naturpark" auch Schwalben und anderen
      Gebäudebrütern.
    visit: >-
      Das Naturparkzentrum befindet sich in Esch-Sauer, in der ehemaligen Tuchmühle, die 1992 umgewandelt
      wurde: Es umfasst ein Tourismusbüro, einen Laden mit regionalen Produkten, das Fabrikmuseum und eine
      interaktive Ausstellung über den Park. Von dort aus lässt sich fast alles organisieren.


      Für Wanderungen bietet der Park Gruppentouren mit einem Ranger an, der die wichtigsten Landschaften und
      Naturwerte erklärt. Zu den leichten Themenwegen zählen der Skulpturenweg und der Meditationsweg
      Waassersenneswee. Das Netz umfasst achtzehn mittelschwere Éislek-Pied-Rundwege, die von der Europäischen
      Wandervereinigung als Qualitätswege ausgezeichnet wurden. Der Circuit du Lac ist ein 44-Kilometer-Weg,
      dessen Informationstafeln etappenweise zu Fuß erkundet werden können. Die Tafeln des Projekts L'histoire
      de la Haute-Sûre sind auf Französisch, Deutsch und Englisch und berichten über die Veränderungen der
      regionalen Landschaft. Das Gebiet lässt sich auch mit dem Fahrrad entdecken, wobei das Relief das
      Radwegenetz weniger ausgebaut macht als anderswo im Land.


      Auf dem Wasser bietet das Solarboot eine zweistündige geführte Naturexkursion mit Halt am
      Burfelt-Zentrum: Dort erfährt man mehr über Flora und Fauna des Stausees, seine Geschichte und den
      Trinkwasserschutz. Die Amphibienroute führt am legendären Hellekessel vorbei und überquert den Hilfsdam
      in Richtung Liefrange. Der Schoofsbësch, ein ehemaliger Steinbruch, ist das Herzstück eines
      Naturschutzgebiets.
    history: >-
      Der Park stützt sich auf einen Vertrag zwischen dem Staat und den Gemeinden, zuletzt 2016 für zehn
      weitere Jahre erneuert. Seit 2012 umfasst er vier Gemeinden, seit 2016 auch Wiltz. Zu seinen
      Naturschutzmaßnahmen gehören die Wiederherstellung von Wiesen und Feuchtgebieten, die Renaturierung von
      Auwäldern und die Umwandlung von Nadelwaldplantagen in Mischwälder sowie Pläne zum Schutz von Ufern, zur
      Wiederherstellung von Krautsäumen und zur Sicherung unterirdischer Galerien, die Fledermauskolonien zum
      Überwintern nutzen.
    before: >-
      Zum Schutz des Trinkwassers sind in den Schutzzonen 1 und 2a, vom Esch-Sauer-Damm bis Lultzhausen, alle
      Freizeitaktivitäten außer auf markierten Wegen verboten. In Zone 2b, von Lultzhausen bis zur belgischen
      Grenze, sind motorfreie Freizeit- und Wassersportaktivitäten erlaubt. Wildes Campen ist in ganz
      Luxemburg verboten, auch auf den Stauseeuferwiesen, wo Hunde außer in Rommwiss nicht erlaubt sind, und
      Abfall muss mitgenommen oder in den vorgesehenen Behältern entsorgt werden.
    around: >-
      Der [Naturpark Our — Ourtal](/lugar/naturpark-our---ourtal/) grenzt direkt an den Öewersauer, etwa 9 km
      entfernt liegt der [Anlier-Wald](/lugar/foret-d-anlier/); etwa 10 km entfernt der [Große Wald von
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/). Etwa einundzwanzig Kilometer entfernt liegt der
      [Parc Naturel de la Vallée de la Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), und etwa
      dreiundzwanzig Kilometer entfernt die Region [Vallée de l'Ernz noire / Beaufort /
      Berdorf](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/).
  it:
    intro: >-
      Per riempire un serbatoio è stato necessario chiudere una valle, e da quella chiusura è nato un parco.
      Dal 1950, quando fu costruita la diga, si dibattè della creazione di un "parco nazionale" o di un "parco
      naturale" qui. Ci vollero quasi cinquant'anni: nel 1999 fu fondato ufficialmente il Naturpark
      Öewersauer, il primo parco naturale del Lussemburgo, attorno al lago dell'Haute-Sûre, il più grande lago
      artificiale del paese. Con 380 ettari, il lago fornisce acqua potabile ai due terzi della popolazione
      lussemburghese. Intorno, il rilievo dell'Oesling diventa bosco, ruscello e versante ripido.
    landscape: >-
      L'acqua comanda tutto. La diga di Esch-sur-Sûre fu costruita negli anni cinquanta per coprire i bisogni
      di acqua potabile ed elettricità del Lussemburgo. Oggi il serbatoio Obersauer è anche un'area
      ricreativa, con versanti ripidi e boscosi che spesso scendono fino alla riva e danno un paesaggio
      naturale, quasi intatto.


      Ma il serbatoio è solo il cuore. Molti ruscelli in valli nascoste, il fiume Sûre e i suoi affluenti, i
      prati umidi e le foreste alluviali formano il tessuto di cui si occupa la rete Natura 2000 della zona.
      Gli otto siti Natura 2000 del comitato Uewersauer si articolano attorno a quel reticolo d'acqua. E la
      mano dell'uomo ha lasciato il suo segno anche sui prati. Il "Fléizen" era un metodo tradizionale di
      allagamento dei prati da ruscelli e fiumi mediante fossati, per accelerare la crescita dell'erba e
      irrigare in estate. I fossati, gli stagni "Fléizweiher" e le dighe, insieme ai prati allagati, formano
      oggi preziosi habitat umidi per molte specie rare.
    wildlife: >-
      Tra le specie emblematiche dei siti Natura 2000 di Uewersauer figurano il [castoro
      europeo](/especie/castor_fiber/), una farfalla — il rame della bistorta —, la [cicogna
      nera](/especie/ciconia_nigra/) e i pipistrelli. La cicogna nera pesca nei corsi d'acqua e nidifica in
      antiche foreste tranquille della valle dell'Haute-Sûre. Tra gli uccelli più notevoli del sito: il [falco
      pescatore](/especie/pandion_haliaetus/), il [merlo acquaiolo](/especie/cinclus_cinclus/), il francolino
      di monte, il [martin pescatore](/especie/alcedo_atthis/) e il [picchio
      nero](/especie/dryocopus_martius/).


      Per chi esce con il binocolo, la primavera e l'estate sono buone per gli anfibi: il parco propone un
      itinerario per anfibi che combina la barca solare con una passeggiata di circa 8 km sulla riva sinistra
      del serbatoio. Ogni anno, l'azione "Schmuewelen am Naturpark" aiuta anche le rondini e altri uccelli che
      nidificano negli edifici.
    visit: >-
      Il Centro del Parco Naturale si trova a Esch-Sauer, nell'ex fabbrica di tessuti, convertita nel 1992: ha
      un ufficio turistico, un negozio di prodotti regionali, il museo della fabbrica e una mostra interattiva
      sul parco. Da lì si può organizzare quasi tutto.


      Per le escursioni a piedi, il parco offre camminate di gruppo con un ranger che spiega i principali
      paesaggi e valori naturali. Tra i sentieri tematici facili ci sono lo Skulpturenweg e il sentiero di
      meditazione Waassersenneswee. La rete comprende diciotto percorsi circolari Éislek Pied di difficoltà
      media, riconosciuti come percorsi di qualità dall'Associazione Europea di Escursionismo. Il Circuit du
      Lac è un sentiero di 44 chilometri i cui pannelli interpretativi possono essere percorsi a piedi a
      tappe. I pannelli del progetto L'histoire de la Haute-Sûre sono in francese, tedesco e inglese e
      raccontano i cambiamenti del paesaggio regionale. Il territorio si può scoprire anche in bicicletta,
      anche se il rilievo rende la rete ciclabile meno estesa che nel resto del paese.


      Sull'acqua, la barca solare organizza un'escursione guidata naturalistica di due ore con sosta al centro
      Burfelt: si conoscono flora e fauna del serbatoio, la sua storia e la protezione dell'acqua potabile.
      L'itinerario per anfibi passa accanto al leggendario Hellekessel e attraversa la diga ausiliaria verso
      Liefrange. Lo Schoofsbësch, un'ex cava, è il cuore di una riserva naturale.
    history: >-
      Il parco si basa su un contratto tra lo Stato e i comuni, rinnovato da ultimo nel 2016 per altri dieci
      anni. Dal 2012 comprende quattro comuni, e dal 2016 anche Wiltz. Le sue misure di conservazione
      includono il ripristino di prati e zone umide, il recupero di foreste alluviali e la conversione di
      piantagioni di conifere in foreste miste, e prevedono di proteggere le rive, ripristinare fasce erbose e
      mettere in sicurezza gallerie sotterranee utilizzate dalle colonie di pipistrelli per svernare.
    before: >-
      Per la protezione dell'acqua potabile, nelle zone di protezione 1 e 2a, dalla diga di Esch-Sauer a
      Lultzhausen, tutte le attività ricreative sono vietate, salvo sui sentieri segnalati. Nella zona 2b, da
      Lultzhausen al confine belga, sono consentiti tempo libero e sport acquatici senza motore. Il campeggio
      libero è vietato in tutto il Lussemburgo, anche nei prati del serbatoio, dove i cani non sono ammessi
      salvo a Rommwiss, e i rifiuti devono essere portati via o gettati negli appositi contenitori.
    around: >-
      Il [Naturpark Our — Ourtal](/lugar/naturpark-our---ourtal/) confina con l'Öewersauer, e a circa 9 km si
      trova la [Foresta di Anlier](/lugar/foret-d-anlier/); a circa 10 km, la [Grande Foresta di
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/). A circa ventuno chilometri si trova il [Parc
      Naturel de la Vallée de la Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), e a circa ventitrè
      chilometri, la regione della [Vallée de l'Ernz noire / Beaufort /
      Berdorf](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/).
  pt:
    intro: >-
      Para encher uma albufeira foi preciso fechar um vale, e desse encerramento nasceu um parque. Desde 1950,
      quando a barragem foi construída, debateu-se a criação de um "parque nacional" ou de um "parque natural"
      aqui. Demorou quase meio século: em 1999 foi fundado oficialmente o Naturpark Öewersauer, o primeiro
      parque natural do Luxemburgo, em torno do lago da Haute-Sûre, o maior lago artificial do país. Com 380
      hectares, o lago abastece de água potável dois terços da população luxemburguesa. Em redor, o relevo do
      Oesling transforma-se em floresta, riacho e encosta íngreme.
    landscape: >-
      A água manda tudo. A barragem de Esch-sur-Sûre foi construída nos anos cinquenta para cobrir as
      necessidades de água potável e eletricidade do Luxemburgo. Hoje, a albufeira Obersauer é também uma zona
      de lazer, com encostas íngremes e arborizadas que chegam muitas vezes até à margem e dão uma paisagem
      natural, quase intacta.


      Mas a albufeira é apenas o coração. Muitos ribeiros em vales escondidos, o rio Sûre e seus afluentes,
      prados húmidos e florestas aluviais formam o tecido de que se ocupa a rede Natura 2000 da zona. Os oito
      sítios Natura 2000 do comité Uewersauer articulam-se em torno dessa teia de água. E a mão humana também
      deixou a sua marca nos prados. O "Fléizen" era um método tradicional de inundar os prados a partir de
      riachos e rios através de valas, para acelerar o crescimento da erva e irrigar no verão. As valas, os
      açudes "Fléizweiher" e as barragens, juntamente com os prados inundados, formam hoje habitats húmidos
      valiosos para muitas espécies raras.
    wildlife: >-
      Entre as espécies emblemáticas dos espaços Natura 2000 de Uewersauer figuram o [castor
      europeu](/especie/castor_fiber/), uma borboleta — o licénio do bistorto —, a
      [cegonha-preta](/especie/ciconia_nigra/) e os morcegos. A cegonha-preta pesca nos cursos de água e
      nidifica em florestas antigas e tranquilas do vale da Haute-Sûre. Entre as aves mais notáveis do sítio:
      o [águia-pesqueira](/especie/pandion_haliaetus/), o [melro-d'água](/especie/cinclus_cinclus/), o
      galo-da-aveleira, o [guarda-rios](/especie/alcedo_atthis/) e o
      [pica-pau-preto](/especie/dryocopus_martius/).


      Para quem sai com binóculos, a primavera e o verão são bons para os anfíbios: o parque propõe uma rota
      de anfíbios que combina o barco solar com uma caminhada de cerca de 8 km pela margem esquerda da
      albufeira. Cada ano, a ação "Schmuewelen am Naturpark" também ajuda as andorinhas e outras aves que
      nidificam em edifícios.
    visit: >-
      O Centro do Parque Natural está em Esch-Sauer, na antiga fábrica de panos, convertida em 1992: tem
      gabinete de turismo, uma loja de produtos regionais, o museu da fábrica e uma exposição interativa sobre
      o parque. A partir dali é possível organizar quase tudo.


      Para caminhadas, o parque oferece passeios em grupo com um ranger que explica as principais paisagens e
      valores naturais. Entre os trilhos temáticos fáceis estão o Skulpturenweg e o caminho de meditação
      Waassersenneswee. A rede inclui dezoito percursos circulares Éislek Pied de dificuldade média,
      reconhecidos como percursos de qualidade pela Associação Europeia de Caminheiros. O Circuit du Lac é um
      trilho de 44 quilómetros cujos painéis interpretativos podem ser percorridos a pé por etapas. Os painéis
      do projeto L'histoire de la Haute-Sûre estão em francês, alemão e inglês e contam as mudanças da
      paisagem regional. O território pode também ser descoberto de bicicleta, embora o relevo torne a rede
      ciclável menos extensa do que noutras partes do país.


      Na água, o barco solar organiza uma excursão guiada de natureza de duas horas, com paragem no centro
      Burfelt: aí conhece-se a flora e fauna da albufeira, a sua história e a proteção da água potável. A rota
      de anfíbios passa pelo lendário Hellekessel e cruza a barragem auxiliar em direção a Liefrange. O
      Schoofsbësch, uma antiga pedreira, é o coração de uma reserva natural.
    history: >-
      O parque assenta num contrato entre o Estado e os municípios, renovado pela última vez em 2016 por mais
      dez anos. Desde 2012 abrange quatro municípios, e desde 2016 também Wiltz. As suas medidas de
      conservação incluem restaurar prados e zonas húmidas, recuperar florestas aluviais e converter
      plantações de coníferas em florestas mistas, e preveem proteger margens, restabelecer faixas herbáceas e
      assegurar galerias subterrâneas usadas por colónias de morcegos para hibernar.
    before: >-
      Pela proteção da água potável, nas zonas de proteção 1 e 2a, desde a barragem de Esch-Sauer até
      Lultzhausen, todas as atividades de lazer são proibidas, salvo nos trilhos assinalados. Na zona 2b, de
      Lultzhausen à fronteira belga, são permitidos lazer e desportos aquáticos sem motor. O campismo selvagem
      é proibido em todo o Luxemburgo, incluindo nos prados da albufeira, onde não são admitidos cães salvo em
      Rommwiss, e o lixo deve ser levado ou depositado nos contentores previstos.
    around: >-
      O [Naturpark Our — Ourtal](/lugar/naturpark-our---ourtal/) fica contíguo ao Öewersauer, e a cerca de 9
      km fica a [Floresta de Anlier](/lugar/foret-d-anlier/); a cerca de 10 km, a [Grande Floresta de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/). A cerca de vinte e um quilómetros fica o [Parc
      Naturel de la Vallée de la Semois](/lugar/parc-naturel-de-la-vallee-de-la-semois/), e a cerca de vinte e
      três quilómetros, a região de la [Vallée de l'Ernz noire / Beaufort /
      Berdorf](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/).
