resumen:
  es: >-
    El primer Parque Nacional de España (1918), tres macizos calizos alpinos emergiendo a 2.600 m a solo 15 km
    del mar Cantábrico.
  en: >-
    Spain's first National Park (1918), three alpine limestone massifs rising to 2,600 m just 15 km from the
    Cantabrian Sea.
  fr: >-
    Le premier parc national d'Espagne (1918), trois massifs calcaires alpins s'élevant à 2 600 m à seulement
    15 km de la mer Cantabrique.
  de: >-
    Spaniens erster Nationalpark (1918), drei alpine Kalksteinmassive, die nur 15 km vom Kantabrischen Meer
    entfernt bis auf 2.600 m aufragen.
  it: >-
    Il primo Parco Nazionale della Spagna (1918), tre massicci calcarei alpini che raggiungono 2.600 m a soli
    15 km dal mar Cantabrico.
  pt: >-
    O primeiro Parque Nacional de Espanha (1918), três maciços calcários alpinos que se erguem a 2.600 m a
    apenas 15 km do mar Cantábrico.
unico:
  es: >-
    La caliza de los tres macizos, el bosque atlántico que la rodea y el límite entre las especies del norte
    de Europa y las mediterráneas, todo a la vez.
  en: >-
    The limestone crags of the three massifs, the surrounding Atlantic temperate forest, and the
    biogeographical meeting ground between northern European and Mediterranean species, all in one place.
  fr: >-
    Le calcaire des trois massifs, la forêt atlantique environnante et la frontière biogéographique entre
    espèces d'Europe du Nord et méditerranéennes, réunis en un seul lieu.
  de: >-
    Der Kalkstein der drei Massive, der umgebende atlantische Bergwald und die biogeographische Grenze
    zwischen nordeuropäischen und mediterranen Arten an einem Ort vereint.
  it: >-
    La roccia calcarea dei tre massicci, la foresta atlantica circostante e il confine biogeografico tra
    specie nordeuropee e mediterranee, riuniti in un unico territorio.
  pt: >-
    O calcário dos três maciços, o bosque atlântico envolvente e a fronteira biogeográfica entre espécies do
    norte da Europa e mediterrânicas, reunidos num só território.
observaciones:
  es: >-
    La acampada libre no está permitida; el vivac se admite por encima de 1.600 m, con la tienda montada una
    hora antes de la puesta del sol y recogida una hora después de la salida. El terreno es
    extraordinariamente abrupto: no abandones los senderos ni tomes atajos, y lleva agua, porque la morfología
    kárstica deja áreas extremadamente secas en lo alto. El parque recomienda planificar las excursiones a pie
    y mantenerse en los senderos establecidos.
texto:
  es:
    intro: >-
      En los Picos de Europa los ríos caen del cielo al mar. En la vertiente norte, los nacimientos del Dobra,
      el Cares y el Sella bajan más de 1000 metros en apenas 10 kilómetros, y el pico Torrecerredo, a 2648 m,
      es la cota más alta del parque, mientras la más baja, a 75 m, está en el río Deva. Es una masa de caliza
      modelada por el agua y el hielo en cumbres agudas, barrancos y simas, en el centro de la Cordillera
      Cantábrica. Y fue el primer espacio protegido de España.
    landscape: >-
      Hace 65 millones de años, el levantamiento de estas tierras rejuveneció el paisaje, y los ríos y
      glaciares tuvieron la oportunidad de moldear estas montañas. Después trabajaron los hielos cuaternarios
      y los ríos que nacieron de ellos. De ahí salieron el desfiladero de los Beyos y la garganta del Cares,
      dos de las hoces más espectaculares de España, y en la caliza se abrieron simas que figuran entre las
      más profundas del mundo. Los valles en U, los circos y los lagos glaciares delatan una actividad glaciar
      que aún se manifiesta en nieves perpetuas.


      Bajo la roca, el clima. Conviven un macrobioclima templado oceánico y otro submediterráneo, y esa mezcla
      da una diversidad extraordinaria. El frío es serio: la Vega de Liordes registró -35,8 °C el 7 de enero
      de 2021. Dominan el bosque atlántico caducifolio, con haya, pino silvestre, avellano, acebo y muchas
      orquídeas, y hay pequeños bosques mediterráneos de encina, quejigo, sabina y madroño. Los hayedos,
      robledales y bosques mixtos de la Reserva incluyen abedules, fresnos y castaños. En Posada de Valdeón,
      el monte Corona es el único bosque autóctono de tilos de Europa.
    wildlife: >-
      Aquí está el límite sur de muchas especies del norte de Europa y el límite norte de muchas
      mediterráneas. Entre las protegidas, el [urogallo](/especie/tetrao_urogallus/) cantábrico, el [oso
      pardo](/especie/ursus_arctos/) y, cada vez más, el [quebrantahuesos](/especie/gypaetus_barbatus/), que
      está en fase de reintroducción.


      En las cumbres vive el [rebeco](/especie/rupicapra_pyrenaica/) cantábrico, uno de los animales más
      representativos del parque, y se ha reintroducido la [cabra montés](/especie/capra_pyrenaica/); por el
      aire pasan el [águila real](/especie/aquila_chrysaetos/) y la chova piquigualda. Entre las especies
      emblemáticas están además la perdiz pardilla, el acentor y el gorrión alpino, el pico mediano, el
      [lobo](/especie/canis_lupus/) ibérico y el coleóptero Rosalia alpina.


      Para observar la fauna, quédate quieto cuando llegues a un sitio: los animales retoman pronto su
      actividad. Con unos prismáticos de 7x u 8x se ven muchas especies, y las primeras horas de la mañana son
      las mejores para las aves. La temporada de visita va de junio a octubre.
    visit: >-
      Empieza por un centro. El más veterano es el Pedro Pidal, en Buferrera, junto a los Lagos de Covadonga;
      en Cantabria está el de Sotama, junto a Tama. Hay también oficinas de información en Casa Dago (Cangas
      de Onís) y en Posada de Valdeón (León), y del 1 de julio al 15 de septiembre, en Semana Santa y en
      puentes hay puntos de información en los accesos principales.


      El parque tiene 30 sendas homologadas de Pequeño Recorrido, y la red oficial enumera recorridos como la
      Ruta de Frassinelli, los Lagos de Covadonga y la Ruta del Cares; también Vega de Urriellu, Horcados
      Rojos, el Hayedo de las Ilces y el macizo de Ándara, y los GR 201 (Senda del Arcediano) y 202 (Ruta de
      la Reconquista). El Sendero Histórico GR-1 cruza el parque a lo largo de 62,5 km, en 5 etapas. Desde El
      Portal de Picos, a 1823 m, a donde sube el funicular de Fuente Dé, salen rutas al refugio Verónica o, en
      circular, de vuelta por el Chalet Real y el refugio Áliva. Las cuatro rutas de alta montaña requieren
      preparación física y equipo adecuados por sus desniveles, longitud y pasos expuestos.


      Los miradores completan el paseo. El mirador de la Reina, en la carretera de los Lagos, ve los pueblos
      de Onís y Cangas de Onís, la sierra de Cuera y, en días despejados, el Cantábrico. El del Urriellu,
      cerca de Bulnes, mira al Naranjo de Bulnes o Picu Urriellu. El de Ordiales, a 3,5 horas a pie desde los
      Lagos, mira al valle de Angón y guarda la tumba de Pedro Pidal. El parque ofrece además rutas guiadas
      con guías intérpretes, y la guía geológica divulgativa analiza catorce recorridos por parajes del
      parque.
    history: >-
      El macizo occidental se declaró parque nacional el 24 de julio de 1918, con el nombre de Montaña de
      Covadonga. Nació con 16 925 ha, se amplió en 1995 y el 3 de diciembre de 2014 llegó a las actuales 67
      127 ha. Por el parque pasan calzadas romanas, Reales Cañadas de ovejas trashumantes, viejos caminos
      carreteros y veredas por las que anduvieron maquis y guerrilleros, y su patrimonio incluye iglesias
      románicas y barrocas, molinos, batanes, fraguas, casas blasonadas y torres medievales.
    before: >-
      La acampada libre no está permitida; el vivac se admite por encima de 1.600 m, con la tienda montada una
      hora antes de la puesta del sol y recogida una hora después de la salida. El terreno es
      extraordinariamente abrupto: no abandones los senderos ni tomes atajos, y lleva agua, porque la
      morfología kárstica deja áreas extremadamente secas en lo alto. El parque recomienda planificar las
      excursiones a pie y mantenerse en los senderos establecidos.
    around: >-
      Lejos de aquí, el [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) comparte con los Picos
      el rebeco, el lobo y el oso pardo, y el [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) comparte el rebeco y el buitre
      leonado.
  en:
    intro: >-
      In the Picos de Europa, rivers plunge from sky to ocean. Across the northern watershed, headwaters of
      the Dobra, Cares, and Sella descend more than 1000 metres over barely 10 kilometres, while Torrecerredo
      peak, at 2648 m, stands as the park's crowning summit, contrasting with its lowest elevation of 75 m
      along the Deva river. This colossal limestone mass, sculpted by water and glacial ice into jagged
      crests, gorges, and chasms, forms the heart of the Cantabrian Range. It was the very first protected
      national space established in Spain.
    landscape: >-
      Roughly 65 million years ago, geological uplift rejuvenated these landforms, allowing rivers and
      glaciers to carve deep alpine features. Quaternary glaciations and meltwater streams subsequently
      deepened the relief. From this emerged the Desfiladero de los Beyos and the Cares Gorge, two of Spain's
      most spectacular limestone canyons, alongside subterranean shafts ranking among the deepest abysses on
      Earth. Glacial U-shaped valleys, cirques, and tarns demonstrate past glacial forces still reflected in
      perennial snow patches.


      Beneath the towering rock faces, climate drives diversity. A temperate oceanic macrobioclimate meets
      sub-Mediterranean conditions, yielding exceptional ecological richness. Winter temperatures can be
      severe: the Vega de Liordes recorded -35.8 °C on 7 January 2021. Deciduous Atlantic woods dominate,
      featuring beech, Scots pine, hazel, holly, and abundant orchids, alongside Mediterranean pockets of holm
      oak, Portuguese oak, juniper, and strawberry trees. Mixed woodlands harbor birch, ash, and chestnut. At
      Posada de Valdeón, Monte Corona preserves the only native linden woodland in Europe.
    wildlife: >-
      The park marks the southern limit for numerous northern European species and the northernmost frontier
      for Mediterranean flora and fauna. Among strictly protected creatures are the Cantabrian [western
      capercaillie](/especie/tetrao_urogallus/), the [brown bear](/especie/ursus_arctos/), and increasingly
      the [bearded vulture](/especie/gypaetus_barbatus/), currently undergoing reintroduction.


      High summits shelter the Cantabrian [Pyrenean chamois](/especie/rupicapra_pyrenaica/), one of the park's
      most iconic inhabitants, and the [Spanish ibex](/especie/capra_pyrenaica/) has been reintroduced;
      overhead soar the [golden eagle](/especie/aquila_chrysaetos/) and yellow-billed chough. Other emblematic
      species include the grey partridge, alpine accentor, snowfinch, middle spotted woodpecker, Iberian [grey
      wolf](/especie/canis_lupus/), and the rare beetle Rosalia alpina.


      To view wildlife, pause motionless upon arriving at a vantage point: animals quickly resume their
      natural habits. A pair of 7x or 8x binoculars reveals countless species, and early morning hours are
      ideal for bird observation. The main season extends from June to October.
    visit: >-
      Start your visit at one of the information hubs. The oldest is Pedro Pidal at Buferrera, near the
      Covadonga Lakes; in Cantabria stands Sotama near Tama. Permanent offices also operate at Casa Dago
      (Cangas de Onís) and Posada de Valdeón (León), while seasonal information kiosks staff major access
      roads from 1 July to 15 September, during Easter, and on holiday weekends.


      The park boasts 30 approved short-distance trails (PR), including celebrated routes like the Frassinelli
      trail, the Covadonga Lakes, and the Cares Gorge; other highlights include Vega de Urriellu, Horcados
      Rojos, the Ilces beechwood, and the Ándara massif, alongside long-distance trails GR 201 (Senda del
      Arcediano) and 202 (Ruta de la Reconquista). The historical footpath GR-1 crosses the park across 62.5
      km in 5 stages. From El Portal de Picos at 1823 m, reached by the Fuente Dé cable car, tracks head
      toward Refugio Verónica or loop via Chalet Real and Refugio Áliva. Four high-mountain trails require
      stout physical preparation and alpine gear due to rugged terrain, distance, and exposed ledges.


      Lookouts offer panoramic viewpoints. Mirador de la Reina along the Lakes road overlooks Onís, the Cuera
      range, and the sparkling Cantabrian Sea on clear mornings. The Urriellu lookout near Bulnes gazes
      straight at Picu Urriellu. The Ordiales viewpoint, 3.5 hours on foot from the Lakes, overlooks the Angón
      valley and shelters the tomb of Pedro Pidal. The park also provides guided hikes with interpreter
      rangers, while an educational geological guide details fourteen itineraries across scenic highlights.
    history: >-
      The western massif was proclaimed a national park on 24 July 1918 under the name Montaña de Covadonga.
      Originally covering 16,925 ha, it was expanded in 1995 and reached its current expanse of 67,127 ha on 3
      December 2014. Roman causeways, historic royal transhumance tracks, old cart roads, and mountain trails
      once walked by anti-fascist maquis cross the terrain, alongside romanesque churches, traditional
      watermills, fulling mills, and medieval stone towers.
    before: >-
      Wild camping is not permitted; bivouacking is allowed above 1,600 m, with tents pitched one hour before
      sunset and struck one hour after sunrise. The terrain is extraordinarily precipitous: never leave
      designated paths or take shortcuts, and carry sufficient water, as karst limestone terrain leaves high
      ridges completely arid. The park authority urges visitors to plan walks prudently and remain on marked
      footpaths.
    around: >-
      Further west, [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) shares with the Picos the
      chamois, wolf, and brown bear, while [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) shares the chamois and griffon
      vulture.
  fr:
    intro: >-
      Dans les Picos de Europa, les rivières dégringolent du ciel vers la mer. Sur le versant nord, les
      sources du Dobra, du Cares et du Sella descendent de plus de 1000 mètres sur à peine 10 kilomètres,
      tandis que le pic Torrecerredo, à 2648 m, constitue le point culminant du parc, en contraste avec le
      point le plus bas situé à 75 m sur les berges du Deva. C'est une imposante masse calcaire sculptée par
      l'eau et la glace en arêtes vives, canyons et gouffres au centre de la cordillère Cantabrique. Ce fut le
      tout premier espace protégé d'Espagne.
    landscape: >-
      Il y a 65 millions d'années, le soulèvement tectonique a rajeuni ces reliefs, offrant aux cours d'eau et
      aux glaciers l'occasion de façonner ces parois alpines. Par la suite, les glaces quaternaires et les
      torrents de fonte ont approfondi les vallées. De là sont nés le défilé des Beyos et la gorge du Cares,
      deux des plus spectaculaires canyons calcaires d'Espagne, tandis que s'ouvraient des gouffres parmi les
      plus profonds de la planète. Les vallées glaciaires en U, les cirques et les lacs témoignent d'une
      érosion glaciaire qui subsiste encore sous forme de névés éternels.


      Sous la roche s'exprime le climat. Un macrobioclimat tempéré océanique cohabite avec des influences
      subméditerranéennes, créant une diversité écologique remarquable. Les rigueurs hivernales sont intenses
      : la Vega de Liordes a enregistré -35,8 °C le 7 janvier 2021. La forêt atlantique caducifoliée domine,
      avec hêtres, pins sylvestres, noisetiers, houx et nombreuses orchidées, côtoyant des îlots
      méditerranéens de chênes verts, chênes faginés, genévriers et arbousiers. Les forêts mixtes abritent
      bouleaux, frênes et châtaigniers. À Posada de Valdeón, le monte Corona conserve l'unique forêt indigène
      de tilleuls d'Europe.
    wildlife: >-
      Le parc marque la limite méridionale de nombreuses espèces d'Europe du Nord et la frontière
      septentrionale d'éléments méditerranéens. Parmi la faune protégée figurent le [grand
      tétras](/especie/tetrao_urogallus/) cantabrique, l'[ours brun](/especie/ursus_arctos/) et, en nombre
      croissant, le [gypaète barbu](/especie/gypaetus_barbatus/), actuellement en réintroduction.


      Sur les sommets vit l'[isard](/especie/rupicapra_pyrenaica/) cantabrique, emblème du parc, aux côtés du
      [bouquetin d'Espagne](/especie/capra_pyrenaica/) réintroduit ; dans les airs planent l'[aigle
      royal](/especie/aquila_chrysaetos/) et le chocard à bec jaune. Parmi les espèces remarquables figurent
      également la perdrix grise, l'accenteur alpin, la niverolle alpine, le pic mar, le
      [loup](/especie/canis_lupus/) ibérique et la rosalie des Alpes.


      Pour observer la faune, restez immobile dès votre arrivée sur un poste d'affût : les animaux reprennent
      rapidement leurs activités. Des jumelles de grossissement 7x ou 8x permettent de déceler de nombreuses
      espèces, les premières lueurs du matin étant idéales pour les oiseaux. La saison de visite s'étend de
      juin à octobre.
    visit: >-
      Débutez par un centre d'accueil. Le plus ancien est Pedro Pidal à Buferrera, près des lacs de Covadonga
      ; en Cantabrie s'élève le centre de Sotama, près de Tama. Des bureaux permanents accueillent également
      les visiteurs à Casa Dago (Cangas de Onís) et Posada de Valdeón (León), complétés du 1er juillet au 15
      septembre, à Pâques et lors des jours fériés par des relais aux entrées principales.


      Le parc compte 30 sentiers balisés de Petite Randonnée (PR), dont des itinéraires réputés comme le
      sentier Frassinelli, les lacs de Covadonga et la gorge du Cares ; sans oublier la Vega de Urriellu,
      Horcados Rojos, la hêtraie des Ilces et le massif d'Ándara, ainsi que les GR 201 (Senda del Arcediano)
      et 202 (Ruta de la Reconquista). Le GR-1 traverse le parc sur 62,5 km en 5 étapes. Depuis El Portal de
      Picos, à 1823 m, atteint par le téléphérique de Fuente Dé, des sentiers mènent au refuge Verónica ou
      bouclent par le Chalet Real et Áliva. Les quatre itinéraires de haute montagne exigent une solide
      condition physique et un équipement adapté en raison des dénivelés et de passages escarpés.


      Les belvédères jalonnent la visite. Le mirador de la Reina, sur la route des lacs, embrasse les villages
      d'Onís, la sierra de Cuera et le golfe de Gascogne par temps clair. Celui d'Urriellu, près de Bulnes,
      fait face au Picu Urriellu. Celui d'Ordiales, à 3,5 heures de marche des lacs, surplombe la vallée
      d'Angón et abrite la sépulture de Pedro Pidal. Le parc propose en outre des excursions accompagnées par
      des guides-interprètes, et un livret géologique analyse quatorze itinéraires didactiques.
    history: >-
      Le massif occidental a été déclaré parc national le 24 juillet 1918 sous le nom de Montaña de Covadonga.
      Créé avec 16 925 ha, il a été étendu en 1995 pour atteindre ses 67 127 ha actuels le 3 décembre 2014. Le
      parc est sillonné de chaussées romaines, de chemins royaux de transhumance, d'anciennes voies
      carrossables et de sentes autrefois empruntées par les maquisards, intégrant un riche patrimoine
      d'églises romanes, moulins traditionnels et tours médiévales.
    before: >-
      Le camping sauvage est strictement interdit ; le bivouac est toléré au-dessus de 1 600 m, la tente
      devant être montée une heure avant le coucher du soleil et pliée une heure après son lever. Le relief
      est excessivement escarpé : ne quittez jamais les sentiers balisés et emportez de l'eau en réserve, car
      la nature calcaire assèche complètement les plateaux d'altitude. Le parc recommande de planifier
      méthodiquement chaque sortie à pied.
    around: >-
      Plus à l'ouest, le [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) partage avec les Picos
      l'isard, le loup et l'ours brun, tandis que le [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) partage l'isard et le vautour
      fauve.
  de:
    intro: >-
      In den Picos de Europa stürzen die Flüsse vom Himmel ins Meer. Auf der Nordseite überwinden die
      Quellbäche von Dobra, Cares und Sella mehr als 1000 Höhenmeter auf kaum 10 Kilometern Länge, während der
      Torre Cerredo auf 2648 m den höchsten Punkt des Parks markiert – im Kontrast zur tiefsten Stelle auf 75
      m am Río Deva. Es ist ein gewaltiges Kalksteinmassiv im Herzen des Kantabrischen Gebirges, geformt von
      Wasser und Eis zu messerscharfen Graten, Schluchten und Schächten. Und es war das allererste
      Schutzgebiet Spaniens.
    landscape: >-
      Vor rund 65 Millionen Jahren verjüngte die tektonische Hebung dieses Relief, sodass Flüsse und Gletscher
      diese Hochgebirgslandschaft formen konnten. Später vertieften eiszeitliche Gletscher und
      Schmelzwasserströme die Einschnitte. Daraus entstanden die Schlucht von Los Beyos und die
      Cares-Schlucht, zwei der eindrucksvollsten Kalksteinklammen Spaniens, während sich im Karst Schächte
      öffneten, die zu den tiefsten der Erde zählen. Trogtäler, Kare und Karseen bezeugen die eiszeitliche
      Prägung, die sich bis heute in ganzjährigen Firnfeldern manifestiert.


      Unter den Felswänden herrscht ein facettenreiches Klima. Ein gemäßigt-ozeanisches Makrobioklima trifft
      auf submediterrane Einflüsse, was eine erstaunliche Biodiversität hervorbringt. Die Winterkälte ist
      beachtlich: Die Vega de Liordes registrierte am 7. Januar 2021 frostige -35,8 °C. Es dominiert
      atlantischer Laubwald mit Rotbuche, Waldkiefer, Hasel, Stechpalme und zahlreichen Orchideenarten,
      durchsetzt von mediterranen Enklaven aus Steineiche, Portugiesischer Eiche, Wacholder und Erdbeerbaum.
      In Posada de Valdeón bewahrt der Monte Corona den einzigen autochthonen Lindenwald Europas.
    wildlife: >-
      Hier verläuft die Südgrenze vieler nordeuropäischer Arten und zugleich die Nordgrenze mediterraner
      Lebensformen. Zu den streng geschützten Tieren gehören das Kantabrische
      [Auerhuhn](/especie/tetrao_urogallus/), der [Braunbär](/especie/ursus_arctos/) und zunehmend der
      [Bartgeier](/especie/gypaetus_barbatus/), der derzeit wiederangesiedelt wird.


      Auf den Höhenzügen lebt die Kantabrische [Pyrenäen-Gämse](/especie/rupicapra_pyrenaica/), das Wappentier
      des Parks, während der [Iberiensteinbock](/especie/capra_pyrenaica/) erfolgreich wieder heimisch gemacht
      wurde; am Himmel kreisen [Steinadler](/especie/aquila_chrysaetos/) und Alpendohle. Weitere Leitarten
      sind Rebhuhn, Alpenbraunelle, Schneesperling, Mittelspecht, der Iberische [Wolf](/especie/canis_lupus/)
      und der Alpenbock-Käfer.


      Zur Tierbeobachtung empfiehlt es sich, an Aussichtspunkten ruhig zu verweilen: Die Tiere setzen ihr
      Verhalten bald ungestört fort. Ein Fernglas mit 7x oder 8x Vergrößerung erschließt viele Arten; die
      frühen Morgenstunden bieten die besten Bedingungen zur Vogelbeobachtung. Die Hauptbesuchszeit liegt
      zwischen Juni und Oktober.
    visit: >-
      Beginne deinen Besuch in einer Informationsstelle. Das traditionsreichste Zentrum ist Pedro Pidal in
      Buferrera nahe den Covadonga-Seen; in Kantabrien liegt das Zentrum Sotama bei Tama. Ganzjährige Büros
      bestehen in Casa Dago (Cangas de Onís) und Posada de Valdeón (León), ergänzt vom 1. Juli bis 15.
      September sowie an Ostern und Feiertagen durch Infopunkte an den Hauptzufahrten.


      Der Park verfügt über 30 markierte Kurzwanderwege (PR), darunter Klassiker wie die Frassinelli-Route,
      die Seen von Covadonga und der Cares-Schluchtweg; ebenso Vega de Urriellu, Horcados Rojos, der
      Buchenwald von Ilces und das Ándara-Massiv sowie die Weitwanderwege GR 201 (Senda del Arcediano) und 202
      (Ruta de la Reconquista). Der Fernwanderweg GR-1 durchquert den Park auf 62,5 km in 5 Etappen. Ab El
      Portal de Picos auf 1823 m, erreichbar mit der Seilbahn Fuente Dé, starten Routen zur Hütte Verónica
      oder Rundtouren über das Chalet Real und Áliva. Vier alpine Hochgebirgsrouten erfordern solide Kondition
      und Bergausrüstung wegen beträchtlicher Höhenunterschiede und ausgesetzter Passagen.


      Aussichtspunkte bereichern die Tour. Der Mirador de la Reina an der Seenstraße blickt auf Onís, die
      Sierra de Cuera und bei klarer Sicht auf das Kantabrische Meer. Der Urriellu-Blick bei Bulnes zeigt die
      Steilwand des Picu Urriellu. Der Aussichtspunkt Ordiales, 3,5 Gehstunden von den Seen entfernt,
      überblickt das Angón-Tal und birgt das Grab von Pedro Pidal. Der Park bietet zudem geführte Touren mit
      Rangern an, und ein geologischer Wanderführer beschreibt vierzehn Routen durch die Karstlandschaft.
    history: >-
      Das westliche Massiv wurde am 24. Juli 1918 unter dem Namen Montaña de Covadonga zum Nationalpark
      erklärt. Mit 16 925 ha gegründet, wurde das Gebiet 1995 erweitert und erreichte am 3. Dezember 2014
      seinen heutigen Umfang von 67 127 ha. Römerstraßen, königliche Viehtriebwege, alte Karrenwege und Pfade
      der historischen Widerstandskämpfer durchziehen das Gebirge, bereichert durch romanische Kirchen,
      traditionelle Wassermühlen und mittelalterliche Wehrtürme.
    before: >-
      Wildes Zelten ist untersagt; Biwakieren ist oberhalb von 1.600 m gestattet, sofern das Zelt eine Stunde
      vor Sonnenuntergang aufgebaut und eine Stunde nach Sonnenaufgang abgebaut wird. Das Gelände ist extrem
      unwegsam: Verlasse markierte Wege nicht und führe Trinkwasser mit, da der Kalkkarst im Hochgebirge
      völlig wasserlos ist. Die Parkverwaltung empfiehlt vorausschauende Tourenplanung auf den ausgewiesenen
      Steigen.
    around: >-
      Weiter westlich teilt der [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) mit den Picos
      Gämse, Wolf und Braunbär, während der [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) Gämse und Gänsegeier beherbergt.
  it:
    intro: >-
      Nei Picos de Europa i fiumi precipitano dal cielo verso il mare. Sul versante settentrionale, le
      sorgenti del Dobra, del Cares e del Sella scendono di oltre 1000 metri in appena 10 chilometri, mentre
      la cima di Torrecerredo, a 2648 m, è la quota più elevata del parco, in netto contrasto con i 75 m sul
      greto del fiume Deva. Si tratta di un'imponente bastionata calcarea scolpita da acqua e ghiaccio in
      vette aguzze, forre e abissi nel cuore della Cordigliera Cantabrica. Ed è stato il primo parco nazionale
      istituito in Spagna.
    landscape: >-
      Circa 65 milioni di anni fa, il sollevamento tettonico ringiovanì il paesaggio, offrendo a fiumi e
      ghiacciai l'opportunità di plasmare queste montagne. Successivamente operarono i ghiacci quaternari e i
      torrenti di disgelo. Da questo modellamento scaturirono la gola dei Beyos e la gola del Cares, due delle
      forre calcaree più spettacolari di Spagna, mentre nel calcare si aprirono abissi carsici tra i più
      profondi del pianeta. Le valli a U, i circhi e i laghi testimoniano un'attività glaciale visibile
      tuttora nei nevai perenni.


      Sotto la roccia governa il clima. Coesistono un macrobioclima temperato oceanico e influssi
      submediterranei, donando una straordinaria ricchezza biologica. Il gelo è pungente: la Vega de Liordes
      ha registrato -35,8 °C il 7 gennaio 2021. Dominano i boschi caducifogli atlantici con faggi, pini
      silvestri, noccioli, agrifogli e numerose orchidee, affiancati da stazioni mediterranee di leccio,
      rovere, ginepro e corbezzolo. I boschi misti comprendono betulle, frassini e castagni. A Posada de
      Valdeón, il monte Corona ospita l'unico bosco indigeno di tigli d'Europa.
    wildlife: >-
      Qui corre il limite meridionale di molte specie del nord Europa e la frontiera settentrionale di taxa
      mediterranei. Tra le specie protette spiccano il [gallo cedrone](/especie/tetrao_urogallus/) cantabrico,
      l'[orso bruno](/especie/ursus_arctos/) e, in crescita, il [gipeto](/especie/gypaetus_barbatus/),
      protagonista di un piano di reintroduzione.


      Sulle creste vive il [camoscio dei Pirenei](/especie/rupicapra_pyrenaica/) cantabrico, simbolo del
      parco, ed è stato reintrodotto lo [stambecco iberico](/especie/capra_pyrenaica/); nei cieli volteggiano
      l'[aquila reale](/especie/aquila_chrysaetos/) e il gracchio corallino. Tra le specie tipiche figurano
      starna, sordone, fringuello alpino, picchio rosso mezzano, il [lupo grigio](/especie/canis_lupus/)
      iberico e il coleottero Rosalia alpina.


      Per osservare gli animali, rimani fermo al tuo arrivo in un punto panoramico: la fauna riprende
      rapidamente le proprie attività. Con un binocolo 7x o 8x si scorgono molte specie, e le prime ore del
      mattino sono le migliori per l'avifauna. La stagione adatta alla visita va da giugno a ottobre.
    visit: >-
      Inizia da un punto informativo. Il più antico è Pedro Pidal a Buferrera, presso i laghi di Covadonga; in
      Cantabria si trova il centro di Sotama, vicino a Tama. Uffici stabili operano a Casa Dago (Cangas de
      Onís) e Posada de Valdeón (León), mentre dal 1º luglio al 15 settembre, a Pasqua e nei ponti festivi
      sono attivi presidi agli ingressi.


      Il parco dispone di 30 sentieri omologati di Piccolo Percorso (PR), tra cui la via Frassinelli, i laghi
      di Covadonga e la gola del Cares; nonché Vega de Urriellu, Horcados Rojos, la faggeta delle Ilces e il
      massiccio di Ándara, oltre ai percorsi GR 201 (Senda del Arcediano) e 202 (Ruta de la Reconquista). Il
      sentiero storico GR-1 traversa il parco per 62,5 km in 5 tappe. Da El Portal de Picos a 1823 m,
      raggiunto dalla funivia di Fuente Dé, partono itinerari per il rifugio Verónica o ad anello verso lo
      Chalet Real e Áliva. I quattro percorsi di alta montagna richiedono allenamento e attrezzatura adeguata
      per i dislivelli e i passaggi esposti.


      I belvederi completano la visita. Il mirador de la Reina sulla strada dei laghi spazia sui paesi di
      Onís, sulla sierra de Cuera e sul mar Cantabrico nelle giornate terse. Il belvedere dell'Urriellu presso
      Bulnes fronteggia il Picu Urriellu. Quello di Ordiales, a 3,5 ore a piedi dai laghi, domina la valle di
      Angón e custodisce la tomba di Pedro Pidal. Il parco propone escursioni guidate, e una guida geologica
      descrive quattordici itinerari didattici.
    history: >-
      Il massiccio occidentale fu dichiarato parco nazionale il 24 luglio 1918 con il nome di Montaña de
      Covadonga. Nacque con 16 925 ha, fu ampliato nel 1995 e il 3 dicembre 2014 ha raggiunto gli attuali 67
      127 ha. Il territorio è solcato da selciati romani, tratturi di transumanza, antiche vie carrarecce e
      sentieri percorsi dai maquis, conservando chiese romaniche, mulini tradizionali e torri medievali.
    before: >-
      Il campeggio libero è vietato; il bivacco notturno è consentito oltre 1.600 m di quota, montando la
      tenda un'ora prima del tramonto e smontandola un'ora dopo l'alba. Il terreno è assai impervio: non
      uscire dai sentieri battuti e porta acqua a sufficienza, poiché la natura carsica rende aride le creste
      superiori. Il parco raccomanda di pianificare accuratamente i percorsi a piedi rimanendo sui tracciati
      segnalati.
    around: >-
      Più a ovest, il [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) condivide con i Picos
      camoscio, lupo e orso bruno, mentre il [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) condivide camoscio e grifone.
  pt:
    intro: >-
      Nos Picos de Europa os rios precipitam-se do céu em direção ao mar. Na vertente setentrional, as
      nascentes do Dobra, do Cares e do Sella descem mais de 1000 metros em escassos 10 quilómetros, enquanto
      o pico Torrecerredo, a 2648 m, coroa o parque como a cota mais elevada, contrastando com os 75 m na
      margem do rio Deva. Trata-se de uma imensa massa calcária talhada pela água e pelo gelo em cristas
      pontiagudas, gargantas e algares no coração da Cordilheira Cantábrica. E constituiu a primeiríssima área
      protegida criada em Espanha.
    landscape: >-
      Há cerca de 65 milhões de anos, o soerguimento tectónico rejuvenesceu esta orografia, permitindo que
      rios e glaciares esculpissem relevos alpinos. Mais tarde atuaram os gelos quaternários e as torrentes de
      degelo. Deste processo nasceram o desfiladeiro dos Beyos e a garganta do Cares, dois dos canhões
      calcários mais grandiosos de Espanha, rasgando no relevo algares e grutas entre os mais profundos do
      planeta. Vales glaciares em U, circos e lagoas de altitude atestam uma ação glaciar ainda patente em
      neves perpétuas.


      Sob a rocha impera o clima. Coexistem um macrobioclima temperado oceânico e influências
      submediterrânicas, gerando uma variedade biológica ímpar. O rigor invernal é pronunciado: a Vega de
      Liordes atingiu -35,8 °C a 7 de janeiro de 2021. Prevalece o bosque atlântico caducifólio com faias,
      pinheiros-silvestres, aveleiras, azevinhos e orquídeas raras, ladeado por núcleos mediterrânicos de
      azinheiras, carvalhos, zimbros e medronheiros. As matas mistas congregam bétulas, freixos e
      castanheiros. Em Posada de Valdeón, o monte Corona resguarda o único bosque autóctone de tílias da
      Europa.
    wildlife: >-
      Aqui converge o limite sul de muitas espécies da Europa setentrional com a fronteira norte de taxonomia
      mediterrânica. Entre a fauna protegida figuram o [tetraz-grande](/especie/tetrao_urogallus/) cantábrico,
      o [urso-pardo](/especie/ursus_arctos/) e, de forma gradual, o
      [quebra-ossos](/especie/gypaetus_barbatus/), em plena fase de reintrodução.


      Nos píncaros habita a [camurça-dos-pirinéus](/especie/rupicapra_pyrenaica/) cantábrica, espécie
      emblemática do parque, tendo sido reintroduzida a [cabra-montês](/especie/capra_pyrenaica/); nos céus
      planam a [águia-real](/especie/aquila_chrysaetos/) e a gralha-de-bico-amarelo. Entre as espécies
      características destacam-se ainda a perdiz-cinzenta, a ferreirinha-alpina, o pardal-alpino, o
      pica-pau-médio, o [lobo-cinzento](/especie/canis_lupus/) ibérico e o escaravelho Rosalia alpina.


      Para observar a fauna, permanece quieto ao chegares a um posto de vigia: os animais retomam prontamente
      as suas rotinas. Binóculos de ampliação 7x ou 8x revelam numerosas espécies, sendo o início da manhã a
      melhor janela para a avifauna. A época de visitação vai de junho a outubro.
    visit: >-
      Inicia a visita num centro de acolhimento. O mais antigo é Pedro Pidal em Buferrera, junto aos lagos de
      Covadonga; na Cantábria situa-se o de Sotama, perto de Tama. Existem postos permanentes em Casa Dago
      (Cangas de Onís) e Posada de Valdeón (Leão), reforçados de 1 de julho a 15 de setembro, na Páscoa e
      feriados por postos nos acessos fundamentais.


      O parque possui 30 trilhos homologados de Pequena Rota (PR), englobando a rota de Frassinelli, os lagos
      de Covadonga e a rota do Cares; bem como Vega de Urriellu, Horcados Rojos, o faial das Ilces e o maciço
      de Ándara, além dos percursos de Grande Rota GR 201 (Senda del Arcediano) e 202 (Ruta de la
      Reconquista). O trilho histórico GR-1 cruza o território ao longo de 62,5 km em 5 etapas. A partir de El
      Portal de Picos, a 1823 m, acessível pelo teleférico de Fuente Dé, saem trajetos para o refúgio Verónica
      ou rotas circulares via Chalet Real e Áliva. Os quatro itinerários de alta montanha exigem preparação
      física e equipamento adequado por força das pendentes e passagens expostas.


      Os miradouros enriquecem o circuito. O miradouro de la Reina, na estrada dos lagos, contempla as aldeias
      de Onís, a serra de Cuera e o mar Cantábrico em dias soalheiros. O do Urriellu, próximo de Bulnes,
      avista o Picu Urriellu. O miradouro de Ordiales, a 3,5 horas a pé a partir dos lagos, abre-se para o
      vale de Angón e guarda o túmulo de Pedro Pidal. O parque oferece percursos acompanhados por guias e um
      roteiro geológico divulga catorze circuitos pelo relevo calcário.
    history: >-
      O maciço ocidental foi declarado parque nacional a 24 de julho de 1918 com o título Montaña de
      Covadonga. Começou com 16 925 ha, foi ampliado em 1995 e a 3 de dezembro de 2014 alcançou os atuais 67
      127 ha. Pelo parque passam calçadas romanas, canadas reais de ovelhas transumantes, antigos caminhos de
      rodagem e atalhos percorridos pelos maquis, integrando igrejas românicas, moinhos e torres medievais.
    before: >-
      O campismo selvagem não é permitido; o bivaque admite-se acima dos 1.600 m, armando a tenda uma hora
      antes do pôr do sol e recolhendo-a uma hora após o amanhecer. O terreno é bastante abrupto: não
      abandones os trilhos balizados nem tomes atalhos, levando água suficiente já que a morfologia cárstica
      seca completamente as zonas altas. O parque aconselha a planear as caminhadas e a circular nas rotas
      demarcadas.
    around: >-
      Mais a poente, o [Parque Natural de Somiedo](/lugar/parque-natural-de-somiedo/) partilha com os Picos a
      camurça, o lobo e o urso-pardo, enquanto o [Parc Nacional d'Aigüestortes i Estany de Sant
      Maurici](/lugar/parc-nacional-d-aiguestortes-i-estany-de-sant-maurici/) acolhe a camurça e o grifo.
