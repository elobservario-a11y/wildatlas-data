resumen:
  es: >-
    El mayor humedal de turbera continua del sudoeste de Alemania con una pasarela de madera de 1.6 km
    atravesando el carrizal.
  en: >-
    The largest contiguous mire wetland in south-western Germany, with a 1.6 km wooden boardwalk traversing
    the extensive reedbed.
  fr: >-
    La plus vaste zone humide tourbeuse continue du sud-ouest de l'Allemagne, dotée d'une passerelle sur
    pilotis de 1,6 km fendant la roselière.
  de: >-
    Das größte zusammenhängende Moorgebiet Südwestdeutschlands mit einem 1,6 km langen Holzsteg durch den
    Schilfgürtel.
  it: >-
    La più vasta zona umida torbosa continua della Germania sud-occidentale, con una passerella in legno di
    1,6 km attraverso il canneto.
  pt: >-
    A maior zona húmida de turfeira contínua do sudoeste da Alemanha, com um passadiço de madeira de 1,6 km a
    atravessar o caniçal.
unico:
  es: >-
    Un lago pequeño rodeado de un turbal enorme, donde la edad de hielo sigue viva en plantas y donde ciertas
    aves del suroeste de Alemania se concentran casi todas.
  en: >-
    A small open lake framed by a vast peat bog, where Ice Age relict plants still thrive and south-west
    Germany's specialized wetland birds gather.
  fr: >-
    Un lac d'eaux calmes ceinturé d'un immense marais tourbeux, où des plantes de l'ère glaciaire subsistent
    et où se rassemblent les oiseaux spécialisés du sud-ouest allemand.
  de: >-
    Ein kleiner See inmitten eines riesigen Moores, wo eiszeitliche Reliktpflanzen fortleben und sich die
    spezialisierte Vogelwelt Südwestdeutschlands ballt.
  it: >-
    Un piccolo lago cinto da un'immensa torbiera, dove le piante dell'era glaciale sopravvivono e si raduna
    gran parte dell'avifauna palustre del sud-ovest tedesco.
  pt: >-
    Um pequeno lago circundado por uma enorme turfeira, onde plantas da era glaciar subsistem e onde se
    congregam as aves mais especializadas do sudoeste alemão.
observaciones:
  es: >-
    En el espacio protegido rige durante todo el año la obligación de permanecer en los caminos. En todo el
    Federseemoor está prohibido reproducir cantos de aves, también desde la pasarela. Comprueba antes de ir
    los horarios del centro de visitantes y las condiciones de acceso a la pasarela.
texto:
  es:
    intro: >-
      Hace quince mil años un glaciar se paró justo al sur de lo que hoy es Bad Buchau, y lo que dejó al
      fundirse fue un muro de grava, arena y arcilla. Detrás, el agua de deshielo llenó una cubeta sin
      desagüe, y así nació el Federsee. Hoy el lago es solo el último resto de aquel espejo: unos 1,4 km² en
      medio del mayor turbal continuo del suroeste de Alemania, de 33 km². Alrededor se extiende un mosaico de
      carrizal, prados húmedos, turbera y bosque que atrae a más de 270 especies de aves.
    landscape: >-
      La historia del Federsee es la de un lago que se fue encogiendo. El lago poco profundo se colmató de
      forma natural, y sobre los terrenos colmatados se desarrollaron extensos turbales. En el siglo XVIII
      todavía ocupaba 10 km²; dos descensos artificiales del nivel, hace unos 200 años, lo redujeron a su
      tamaño actual. Esa historia también explica los restos humanos: los palafitos del Federsee forman parte,
      en parte, del Patrimonio Mundial de la UNESCO.


      Hoy el paisaje se lee en capas. El lago, el carrizal alto, las Streuwiesen —prados de siega tardía— y el
      turbal llegan hasta una zona protegida que lleva la distinción de Europareservat como reserva natural y
      zona de protección de aves. Se han cartografiado unas 700 especies de plantas superiores. Entre ellas
      hay reliquias de la edad de hielo: Karlszepter, Kriechweide, Moosbeere, Rosmarinheide y Strauchbirke,
      que sobreviven porque el turbal es abierto y su clima local es frío. Para el Karlszepter, la cuenca del
      Federsee es el puesto más suroccidental de su área.
    wildlife: >-
      La riqueza de aves es difícil de exagerar: más de 270 especies, y también 12 de murciélagos y unas 600
      de mariposas. El Federsee alberga más del 80 % del carricerín (Schilfrohrsänger) del suroeste de
      Alemania y más del 50 % de los [aguiluchos laguneros](/especie/circus_aeruginosus/) y las [tarabillas
      norteñas](/especie/saxicola_rubetra/). El Steinbeißer, un pez, y la hormiga Uralameise solo viven en el
      suroeste de Alemania en el Federsee.


      Para verlo, hay tres puestos. En el carrizal de la pasarela se buscan bigotudos y carriceros, y también
      rascón y [avetoro](/especie/botaurus_stellaris/). Desde la torre se observa la entrada de aguiluchos
      laguneros a su dormidero y de estorninos al carrizal. En la plataforma del lago hay charranes comunes y
      hasta diecisiete especies de patos, y también se ven nenúfares en flor. Los
      [corzos](/especie/capreolus_capreolus/) aparecen al comienzo del Federseesteg, donde las praderas de
      siega esconden una gran diversidad de insectos.


      La primavera marca el pico botánico. Hay 10 especies de orquídeas, y a finales de mayo, en plena
      floración, se ven desde los caminos; el mejor sitio es el claro del Banngebiet Staudacher. La siega
      tardía y sin purín beneficia a las orquídeas y a otras plantas raras de los prados húmedos. Y el
      [castor](/especie/castor_fiber/) deja su marca: con sus obras ha creado nuevos hábitats para aves
      acuáticas, libélulas y anfibios, y se registran actividades suyas en el Federseemoor desde 2002.
    visit: >-
      Casi todo sale del aparcamiento del Federsee. El Federseesteg es una pasarela cómoda de 1,5 km que cruza
      los prados y el carrizal hasta una plataforma en el lago; se puede recorrer con cochecitos, sillas de
      ruedas y andadores. El Wackelwald es un sendero de naturaleza de 600 m con 8 estaciones: aves cantoras,
      agujeros de pájaro carpintero y ardillas.


      Para dar la vuelta al lago está el Federsee-Rundweg, un camino de 16 km para bici y a pie, junto al
      límite de la reserva, con 14 estaciones. Es casi llano, de grava y asfalto, con torre de observación y
      mirador; desde la estación 10, junto a Brackenhofen, con vista clara se llega a ver los Alpes. El
      sendero arqueológico del turbal sur mide 9 km y tiene 11 estaciones que cuentan doce mil años de
      historia humana.


      La exposición del centro NABU permite informarse antes de la salida, y el personal aconseja dónde se
      puede observar algo de interés. También hay visitas guiadas.
    history: >-
      El turbal está siendo restaurado por partes: tras los turbales sur y norte, se planea revitalizar
      también la parte oeste, el Betzenweiler Ried. El Federseemoor sirve como uno de los últimos refugios
      regionales para muchas especies que escasean en otras zonas.
    before: >-
      En el espacio protegido rige durante todo el año la obligación de permanecer en los caminos. En todo el
      Federseemoor está prohibido reproducir cantos de aves, también desde la pasarela. Comprueba antes de ir
      los horarios del centro de visitantes y las condiciones de acceso a la pasarela.
    around: >-
      Otros humedales de aves comparten con el Federsee el aguilucho lagunero: el [Parc Natural dels
      Aiguamolls de l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/), que comparte también el
      avetoro, y el [Parque Nacional Weerribben-Wieden](/lugar/nationaal-park-weerribben-wieden/), con el
      avetoro.
  en:
    intro: >-
      Fifteen thousand years ago a glacier halted just south of modern Bad Buchau, leaving behind a morainic
      wall of gravel, sand, and clay as it melted. Behind this ridge, trapped meltwater filled a terminal
      drainage basin, creating the Federsee. Today the lake is merely the central vestige of that vast
      original waterbody: about 1.4 km² marooned within south-western Germany's largest continuous mire,
      spanning 33 km². All around stretches a wild mosaic of reedbeds, wet litter meadows, raised peat bogs,
      and mire woods attracting over 270 bird species.
    landscape: >-
      The story of Federsee is one of continuous shrinkage. The shallow lake basin silted up naturally over
      millennia, fostering extensive peat accumulation across the dried shallows. In the eighteenth century it
      still covered 10 km²; two artificial water level lowerings, about 200 years ago, curtailed it to its
      present footprint. This ancient landscape also explains prehistoric human presence: the Federsee stilt
      settlements form part of the UNESCO Prehistoric Pile Dwellings World Heritage Site.


      Today the landscape unfolds in distinct ecological zones. The open lake, dense tall reeds, traditional
      Streuwiesen—unfertilised late-mown wet meadows—and bog forests form a protected sanctuary designated as
      a European Reserve, nature reserve, and bird protection area. Around 700 species of higher vascular
      plants have been catalogued. Among them are glacial relicts: Karl's sceptre, creeping willow, cranberry,
      bog rosemary, and dwarf birch, surviving because the open moorland retains a harsh, cold local
      microclimate. For Karl's sceptre, the Federsee basin represents the extreme south-western outpost of its
      global distribution.
    wildlife: >-
      The ornithological diversity is hard to overstate: over 270 bird species, alongside 12 bat species and
      roughly 600 species of butterflies and moths. The Federsee safeguards more than 80% of south-west
      Germany's breeding sedge warbler population and over 50% of its [western marsh
      harriers](/especie/circus_aeruginosus/) and [whinchats](/especie/saxicola_rubetra/). The spined loach
      and the Ural ant are found nowhere else in south-western Germany except here.


      Three main stations allow observation. Along the boardwalk reedbeds one listens for bearded reedlings
      and reed warblers, with chances of spotted crake and [Eurasian bittern](/especie/botaurus_stellaris/).
      From the observation tower you can watch marsh harriers quartering before roosting and starlings
      settling into the reeds. At the lakehead viewing platform common terns and up to seventeen duck species
      congregate beside flowering white water lilies. [Roe deer](/especie/capreolus_capreolus/) browse near
      the start of the Federseesteg, where meadow grasses support high insect diversity.


      Spring represents the botanical climax. Around 10 wild orchid species occur, coming into magnificent
      bloom in late May right along the footpaths; the premier location is the Banngebiet Staudacher clearing.
      Traditional late mowing without slurry fertilization protects these orchids and fragile wet-meadow
      plants. The [Eurasian beaver](/especie/castor_fiber/) has also left its engineering mark: creating new
      pools and backwaters for waterfowl, dragonflies, and amphibians, with recorded activity documented in
      the Federseemoor since 2002.
    visit: >-
      Almost all explorations begin from the Federsee car park. The Federseesteg is a comfortable 1.5 km
      timber boardwalk crossing meadows and reedbeds to a floating lake platform; it is fully accessible for
      strollers, wheelchairs, and walking frames. The Wackelwald is a 600 m nature trail featuring 8
      interpretive stations focused on woodland songbirds, woodpecker cavity trees, and squirrels.


      To encircle the lake, the Federsee-Rundweg offers a 16 km cycling and walking route along the boundary
      of the reserve, equipped with 14 stations. It is mostly level on gravel and asphalt, featuring
      observation towers and scenic rests; from station 10 near Brackenhofen, clear days reveal the distant
      Alps. The southern bog archaeological trail runs for 9 km across 11 stations chronicling twelve thousand
      years of prehistoric human history.


      The NABU Nature Centre exhibition provides excellent orientation before setting out, with staff advising
      on current wildlife sightings. Guided ranger walks run regularly.
    history: >-
      The mire is undergoing stepwise ecological restoration: following works on the southern and northern
      moors, re-wetting is planned for the western Betzenweiler Ried. The Federseemoor functions as a vital
      regional refugium for species that have vanished across modern agricultural landscapes.
    before: >-
      Year-round path compliance is mandatory throughout the protected reserve. Playing audio bird recordings
      is strictly prohibited everywhere in the Federseemoor, including from the boardwalk. Check the visitor
      centre opening hours and boardwalk accessibility conditions before setting out.
    around: >-
      Other major wetland reserves share marsh harriers with Federsee: [Aiguamolls de l'Empordà Natural
      Park](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/), which also shares the bittern, and
      [Weerribben-Wieden National Park](/lugar/nationaal-park-weerribben-wieden/), also harbouring Eurasian
      bittern.
  fr:
    intro: >-
      Il y a quinze mille ans, un glacier s'arrêta juste au sud de l'actuelle Bad Buchau, abandonnant lors de
      sa fonte un rempart de graviers, de sables et d'argiles. Derrière ce cordon morainique, les eaux de
      fonte emplirent une dépression endoréique, donnant naissance au Federsee. Le lac actuel n'est que
      l'ultime vestige de cette nappe d'eau originelle : environ 1,4 km² isolés au cœur de la plus vaste
      tourbière continue du sud-ouest de l'Allemagne, qui s'étend sur 33 km². Autour s'ordonne une mosaïque de
      roselières, de prairies humides, de tourbières et de bois marécageux qui attire plus de 270 espèces
      d'oiseaux.
    landscape: >-
      L'histoire du Federsee est celle d'une lente contraction lacustre. Le plan d'eau peu profond s'est
      comblé naturellement au fil des millénaires, laissant proliférer d'épaisses tourbières. Au XVIIIe
      siècle, il occupait encore 10 km² ; deux abaissements artificiels du niveau d'eau, entrepris il y a
      environ 200 ans, l'ont réduit à ses dimensions actuelles. Cette genèse explique également la présence de
      sites palafittiques préhistoriques, inscrits en partie au patrimoine mondial de l'UNESCO.


      Aujourd'hui, le paysage se découvre par ceintures concentriques. Le miroir d'eau, la roselière haute,
      les Streuwiesen — prairies de fauche tardive — et les bois de tourbière composent un sanctuaire classé
      Europareservat au titre de réserve naturelle et de zone de protection des oiseaux. Près de 700 espèces
      de plantes vasculaires y ont été inventoriées. Parmi elles figurent d'authentiques reliques glaciaires :
      Karlszepter, saule rampant, canneberge, andromède et bouleau nain, qui se maintiennent grâce à
      l'ouverture du marais et à son climat local rigoureux. Pour le Karlszepter, la cuvette du Federsee
      constitue l'avant-poste le plus sud-occidental de son aire.
    wildlife: >-
      L'abondance ornithologique est exceptionnelle : plus de 270 espèces d'oiseaux, ainsi que 12 espèces de
      chauves-souris et environ 600 espèces de papillons. Le Federsee abrite plus de 80 % de la population
      nicheuse de phragmites des joncs du sud-ouest de l'Allemagne et plus de 50 % des [busards des
      roseaux](/especie/circus_aeruginosus/) et des [tariers des prés](/especie/saxicola_rubetra/). La loche
      de rivière et la fourmi Formica uralensis ne subsistent nulle part ailleurs dans le sud-ouest de
      l'Allemagne.


      Trois postes majeurs structurent l'observation. Dans la roselière de la passerelle, on guette panures à
      moustaches et rousserolles, sans oublier le râle d'eau et le [butor
      étoilé](/especie/botaurus_stellaris/). Depuis la tour, on contemple la rentrée des busards des roseaux
      au dortoir et des étourneaux dans les joncs. Sur la plateforme terminale s'observent sternes
      pierregarins et jusqu'à dix-sept espèces de canards parmi les nénuphars. Les
      [chevreuils](/especie/capreolus_capreolus/) apparaissent dès le début du ponton, où les prairies
      hébergent une myriade d'insectes.


      Le printemps marque le sommet floristique. On dénombre 10 espèces d'orchidées, visibles en pleine
      floraison fin mai en bordure des allées ; le secteur de clairière du Banngebiet Staudacher est le plus
      réputé. La fauche tardive non fertilisée favorise ces orchidées et les plantes rares de bas-marais.
      Enfin, le [castor d'Europe](/especie/castor_fiber/) imprime sa marque : ses barrages ont créé de
      nouveaux plans d'eau pour oiseaux aquatiques, libellules et batraciens, son activité étant suivie dans
      le Federseemoor depuis 2002.
    visit: >-
      La majorité des découvertes débute au parking du Federsee. Le Federseesteg est un ponton en bois
      confortable de 1,5 km traversant prés et roselières jusqu'à une plateforme sur le lac ; il est
      praticable en poussette, fauteuil roulant et déambulateur. Le Wackelwald est un sentier découverte de
      600 m jalonné de 8 stations dédiées aux passereaux forestiers, aux loges de pics et aux écureuils.


      Pour faire le tour du lac, le Federsee-Rundweg propose 16 km praticables à vélo et à pied en lisière de
      la réserve, pourvus de 14 stations. L'itinéraire est plat, alternant gravier et goudron, agrémenté de
      tours panoramiques ; depuis la borne 10 près de Brackenhofen, la vue porte par temps clair jusqu'aux
      Alpes. Le sentier archéologique de la tourbière sud s'étire sur 9 km et compte 11 bornes retraçant douze
      mille ans d'histoire humaine.


      L'exposition du centre de protection de la nature NABU permet de s'orienter avant le départ, et les
      animateurs conseillent les secteurs favorables. Des visites guidées sont régulièrement proposées.
    history: >-
      Le marais tourbeux fait l'objet d'une restauration écologique progressive : après les secteurs sud et
      nord, la revitalisation du secteur ouest, le Betzenweiler Ried, est programmée. Le Federseemoor sert de
      refuge régional ultime pour de multiples espèces devenues rarissimes ailleurs.
    before: >-
      L'obligation de ne pas quitter les chemins balisés s'applique toute l'année dans la réserve. La
      diffusion de chants d'oiseaux est formellement prohibée dans tout le Federseemoor, y compris sur la
      passerelle. Vérifiez les horaires du centre de découverte et les conditions de circulation sur le ponton
      avant votre visite.
    around: >-
      D'autres zones humides majeures partagent le busard des roseaux avec le Federsee : le [Parc naturel des
      Aiguamolls de l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/), qui accueille également le
      butor étoilé, et le [Parc national Weerribben-Wieden](/lugar/nationaal-park-weerribben-wieden/), où vit
      aussi le butor.
  de:
    intro: >-
      Vor fünfzehntausend Jahren kam ein Gletscher südlich des heutigen Bad Buchau zum Stehen und hinterließ
      beim Abschmelzen einen Wall aus Kies, Sand und Ton. Dahinter staute sich das Schmelzwasser in einem
      abflusslosen Becken – so entstand der Federsee. Heute ist der See nur noch der zentrale Rest jenes
      einstigen Gewässers: rund 1,4 km² inmitten des größten zusammenhängenden Moorkomplexes
      Südwestdeutschlands von 33 km² Fläche. Ringsum erstreckt sich ein Mosaik aus Schilfwäldern, Streuwiesen,
      Hochmoorresten und Bruchwäldern, das über 270 Vogelarten anzieht.
    landscape: >-
      Die Geschichte des Federsees ist die einer stetigen Verlandung. Der flache See schrumpfte auf natürliche
      Weise, und auf den verlandeten Flächen wuchsen mächtige Moorschichten heran. Im achtzehnten Jahrhundert
      maß er noch 10 km²; zwei künstliche Seespiegelabsenkungen vor etwa 200 Jahren verringerten ihn auf seine
      heutige Größe. Diese Entstehung erklärt auch die prähistorischen Pfahlbausiedlungen des Federsees, die
      zum UNESCO-Welterbe gehören.


      Heute gliedert sich die Landschaft in charakteristische Zonen. Der freie See, der hohe Schilfgürtel, die
      Streuwiesen und das Moor bilden ein als Europareservat, Naturschutzgebiet und Vogelschutzgebiet
      ausgezeichnetes Areal. Rund 700 Farn- und Blütenpflanzen wurden hier kartiert. Darunter finden sich
      Glazialrelikte: Karlszepter, Kriechweide, Moosbeere, Rosmarinheide und Strauchbirke, die überdauerten,
      weil das Moor offen ist und ein kühles Lokalklima bewahrt. Für das Karlszepter stellt das Federseebecken
      den südwestlichsten Vorposten seines weltweiten Areals dar.
    wildlife: >-
      Der Vogelreichtum ist überwältigend: über 270 Vogelarten, dazu 12 Fledermausarten und etwa 600
      Schmetterlingsarten. Der Federsee beherbergt über 80 % der südwestdeutschen Brutpopulation des
      Schilfrohrsängers und mehr als 50 % der [Rohrweihen](/especie/circus_aeruginosus/) und
      [Braunkehlchen](/especie/saxicola_rubetra/). Der Steinbeißer und die Uralameise kommen in
      Südwestdeutschland ausschließlich am Federsee vor.


      Drei Beobachtungsbereiche erschließen das Gebiet. Im Schilf des Stegs sucht man Bartmeisen und
      Rohrsänger sowie Wasserralle und [Rohrdommel](/especie/botaurus_stellaris/). Vom Turm aus lässt sich der
      abendliche Einflug der Rohrweihen zu ihren Schlafplätzen und der Stare ins Röhricht verfolgen. An der
      Aussichtsplattform zeigen sich Flussseeschwalben und bis zu siebzehn Entenarten zwischen Seerosen.
      [Rehe](/especie/capreolus_capreolus/) äsen am Beginn des Stegs, wo die Streuwiesen eine reiche
      Insektenwelt verbergen.


      Das Frühjahr bringt den botanischen Höhepunkt. Es kommen 10 Orchideenarten vor, die Ende Mai zur
      Hauptblüte direkt von den Wegen aus zu sehen sind; die beste Stelle ist die Lichtung im Banngebiet
      Staudacher. Die späte, ungedüngte Mahd schützt Orchideen und Feuchtwiesenflora. Auch der
      [Biber](/especie/castor_fiber/) prägt die Landschaft: Seine Dämme schufen neue Flachgewässer für
      Wasservögel, Libellen und Lurche; Aktivitäten im Federseemoor sind seit 2002 lückenlos dokumentiert.
    visit: >-
      Fast alle Unternehmungen starten am Federseeparkplatz. Der Federseesteg ist ein 1,5 km langer,
      barrierefreier Holzsteg über Streuwiesen und durch das Schilf zu einer Plattform auf dem See; er eignet
      sich für Kinderwagen, Rollstühle und Gehhilfen. Der Wackelwald ist ein 600 m langer Naturpfad mit 8
      Stationen zu Waldvögeln, Spechthöhlen und Eichhörnchen.


      Um den See herum führt der 16 km lange Federsee-Rundweg für Radler und Wanderer entlang der
      Schutzgebietsgrenze mit 14 Stationen. Er verläuft nahezu eben auf Kies und Asphalt mit Aussichtstürmen;
      von Station 10 bei Brackenhofen reicht der Blick bei klarer Sicht bis zu den Alpen. Der archäologische
      Moorlehrpfad im Südmoor misst 9 km und umfasst 11 Stationen zu zwölftausend Jahren
      Menschheitsgeschichte.


      Die Ausstellung im NABU-Naturschutzzentrum bietet eine fundierte Einführung vor dem Start, und
      Mitarbeiter geben tagesaktuelle Beobachtungstipps. Es finden regelmäßige Führungen statt.
    history: >-
      Das Moor wird schrittweise renaturiert: Nach dem Süd- und Nordmoor soll künftig auch der westliche
      Moorflügel, das Betzenweiler Ried, wiedervernässt werden. Das Federseemoor dient als unersetzliches
      Rückzugsgebiet für viele Arten, die aus der Kulturlandschaft verdrängt wurden.
    before: >-
      Im Naturschutzgebiet gilt ganzjähriges Wegegebot. Das Abspielen von Vogelstimmen ist im gesamten
      Federseemoor strengstens untersagt, auch auf dem Steg. Informiere dich vorab über Öffnungszeiten des
      Besucherzentrums und die Begehbarkeit des Stegs.
    around: >-
      Andere Feuchtgebiete teilen die Rohrweihe mit dem Federsee: der [Parc Natural dels Aiguamolls de
      l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/), der auch die Rohrdommel teilt, und der
      [Nationalpark Weerribben-Wieden](/lugar/nationaal-park-weerribben-wieden/), ebenfalls mit Vorkommen der
      Rohrdommel.
  it:
    intro: >-
      Quindicimila anni fa un ghiacciaio si arrestò appena a sud dell'attuale Bad Buchau, lasciando con la sua
      fusione un cordone di ghiaia, sabbia e argilla. Dietro questa sbarra morenica, le acque di disgelo
      colmarono un bacino chiuso generando il Federsee. Oggi il lago rappresenta solo il residuo centrale di
      quello specchio d'acqua: circa 1,4 km² incastonati nella torbiera continua più estesa della Germania
      sud-occidentale, ampia 33 km². All'intorno si allarga un mosaico di canneti, prati umidi, torbiere alte
      e boschi palustri che accoglie oltre 270 specie di uccelli.
    landscape: >-
      La storia del Federsee coincide con un graduale interrimento naturale. Il lago poco profondo si è
      colmato nel tempo e sui depositi si sono sviluppate potenti torbiere. Nel Settecento occupava ancora 10
      km²; due abbassamenti artificiali del livello idrico, circa 200 anni fa, lo ridussero alle dimensioni
      attuali. Questa evoluzione spiega anche i resti palafitticoli preistorici del Federsee, tutelati come
      patrimonio mondiale dell'UNESCO.


      Oggi il paesaggio si articola in cinture concentriche. Lo specchio d'acqua, il canneto compatto, i prati
      a sfalcio tardivo (Streuwiesen) e la torbiera formano una riserva protetta insignita del titolo di
      Europareservat e inserita nella rete ZPS. Vi sono state censite circa 700 specie di piante vascolari.
      Tra esse figurano autentici relitti glaciali: Karlszepter, salice strisciante, mirtillo palustre,
      rosmarino di palude e betulla nana, capaci di persistere grazie all'ambiente aperto e al rigido
      microclima locale. Per il Karlszepter, la conca del Federsee rappresenta la stazione più sud-occidentale
      del suo areale.
    wildlife: >-
      La varietà ornitica è ragguardevole: oltre 270 specie di uccelli, affiancate da 12 specie di chirotteri
      e circa 600 di farfalle. Il Federsee ospita oltre l'80% dei forapaglie comuni nidificanti nella Germania
      sud-occidentale e più del 50% dei [falchi di palude](/especie/circus_aeruginosus/) e delle
      [stiaccini](/especie/saxicola_rubetra/). Il cobite comune e la formica Formica uralensis non vivono in
      nessun'altra area della Germania sud-occidentale.


      Per l'avvistamento si utilizzano tre punti cardine. Nel canneto lungo la passerella si scorgono
      basettini e cannaioli, oltre al porciglione e al [tarabuso](/especie/botaurus_stellaris/). Dalla torre
      si osserva il rientro al dormitorio dei falchi di palude e degli stormi di storni nel canneto. Sulla
      terrazza lacustre sostano sterne comuni e fino a diciassette specie di anatre tra le ninfee. I
      [caprioli](/especie/capreolus_capreolus/) compaiono all'imbocco del Federseesteg, dove i prati celano
      una notevole diversità entomologica.


      La primavera segna il picco della vegetazione. Fioriscono 10 specie di orchidee, ben visibili a fine
      maggio dai sentieri; il sito d'elezione è la radura del Banngebiet Staudacher. Lo sfalcio tardivo e non
      concimato preserva queste orchidee e la flora igrofila rara. Il [castoro
      europeo](/especie/castor_fiber/) modella l'ambiente: i suoi sbarramenti hanno generato nuovi specchi
      d'acqua per uccelli acquatici, libellule e anfibi, con attività documentate nel Federseemoor dal 2002.
    visit: >-
      La maggior parte degli itinerari parte dal parcheggio del Federsee. Il Federseesteg è una comoda
      passerella in legno di 1,5 km che attraversa prati e canneti fino a un pontile galleggiante sul lago; è
      accessibile a passeggini, sedie a rotelle e deambulatori. Il Wackelwald è un percorso naturalistico di
      600 m dotato di 8 stazioni didattiche dedicate agli uccelli del bosco, alle cavità dei picchi e agli
      scoiattoli.


      Per compiere il periplo del lago vi è il Federsee-Rundweg, anello di 16 km percorribile a piedi o in
      bicicletta lungo il margine della riserva con 14 stazioni. È quasi pianeggiante su ghiaia e asfalto, con
      torri panoramiche; dalla stazione 10 presso Brackenhofen lo sguardo spazia nelle giornate limpide fino
      alle Alpi. Il sentiero archeologico della torbiera meridionale misura 9 km e comprende 11 tappe che
      ripercorrono dodicimila anni di storia umana.


      La mostra presso il centro naturalistico NABU offre un quadro dettagliato prima della partenza e gli
      operatori consigliano i punti di osservazione migliori. Vengono organizzate visite guidate periodiche.
    history: >-
      La torbiera è oggetto di ripristino ambientale a lotti: dopo i settori meridionale e settentrionale, è
      programmato il riallagamento del settore occidentale, il Betzenweiler Ried. Il Federseemoor funge da
      rifugio insostituibile per molte specie scomparse dalle campagne coltivate.
    before: >-
      Nella riserva vige l'obbligo inderogabile di restare sui sentieri per tutto l'anno. In tutto il
      Federseemoor è severamente vietato riprodurre richiami registrati di uccelli, compreso sulla passerella.
      Controlla prima della partenza gli orari del centro visite e l'agibilità del pontile.
    around: >-
      Altre celebri zone umide condividono il falco di palude con il Federsee: il [Parc Natural dels
      Aiguamolls de l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/), che ospita anche il
      tarabuso, e il [Parco nazionale Weerribben-Wieden](/lugar/nationaal-park-weerribben-wieden/), anch'esso
      con il tarabuso.
  pt:
    intro: >-
      Há quinze mil anos um glaciar deteve-se imediatamente a sul da atual Bad Buchau, deixando com o seu
      degelo uma muralha morénica de cascalho, areia e argila. Atrás desse cordão, as águas de degelo
      preencheram uma bacia sem escoamento, dando origem ao lago Federsee. Hoje a lagoa é apenas o reduto
      central daquele espelho de água primitivo: cerca de 1,4 km² inseridos na maior turfeira contínua do
      sudoeste da Alemanha, com 33 km². Em redor estende-se um mosaico de caniçais, prados húmidos, turfeiras
      e matas pantanosas que atrai mais de 270 espécies de aves.
    landscape: >-
      A história do Federsee traduz-se num encolhimento contínuo. A lagoa pouco profunda sofreu um
      assoreamento natural prolongado, sobre o qual se formaram espessas camadas de turfa. No século XVIII
      cobria ainda 10 km²; dois rebaixamentos artificiais do nível da água, há cerca de 200 anos, reduziram-na
      à área atual. Essa génese geomorfológica enquadra também os vestígios palafíticos pré-históricos do
      Federsee, integrados no Património Mundial da UNESCO.


      Atualmente a paisagem organiza-se em cinturas bem vincadas. O plano de água, o caniçal denso, as
      Streuwiesen — prados húmidos de feno tardio — e as matas de turfeira configuram um santuário
      classificado como Europareservat, reserva natural e zona de proteção especial para aves. Foram
      cartografadas cerca de 700 espécies de plantas vasculares. Entre elas sobressaem relíquias glaciares:
      Karlszepter, salgueiro-rasasteiro, arando-vermelho, andrómeda e bétula-anã, que resistem porque a
      turfeira permanece desafogada e com microclima frio. Para o Karlszepter, a bacia do Federsee constitui o
      limite mais sudoeste da sua distribuição global.
    wildlife: >-
      A abundância ornitológica é invulgar: mais de 270 espécies de aves, acompanhadas por 12 espécies de
      morcegos e cerca de 600 de borboletas. O Federsee alberga mais de 80% da população reprodutora de
      felosa-dos-juncos do sudoeste alemão e mais de 50% dos
      [tartaranhões-dos-pauis](/especie/circus_aeruginosus/) e dos
      [cartaxos-nortenhos](/especie/saxicola_rubetra/). O peixe Steinbeißer e a formiga Formica uralensis não
      ocorrem em mais nenhum sítio do sudoeste da Alemanha.


      Três pontos facilitam a observação. No caniçal do passadiço buscam-se chapins-de-bigodes e
      rouxinóis-dos-caniços, bem como o frango-d'água e o [abcaravão](/especie/botaurus_stellaris/). A partir
      da torre segue-se a entrada dos tartaranhões nos seus dormitórios e o pouso dos estorninhos no juncal.
      Na plataforma lacustre surgem andorinhas-do-mar-comuns e até dezassete espécies de patos junto a
      nenúfares. Os [corços](/especie/capreolus_capreolus/) pastam perto do início do Federseesteg, onde os
      prados ocultam grande riqueza de insetos.


      A primavera encerra o apogeu botânico. Registam-se 10 espécies de orquídeas bravas, avistáveis em plena
      floração no final de maio a partir dos trilhos; o local mais privilegiado é a clareira do Banngebiet
      Staudacher. O corte tardio sem estrume químico beneficia as orquídeas e a flora rara palustre. O
      [castor-europeu](/especie/castor_fiber/) também imprime a sua dinâmica: os seus diques geraram novos
      charcos para aves aquáticas, libélulas e anfíbios, com registos confirmados no Federseemoor desde 2002.
    visit: >-
      Quase todos os percursos começam no parque de estacionamento do Federsee. O Federseesteg é um cómodo
      passadiço de madeira de 1,5 km que cruza prados e caniçais até uma plataforma flutuante no lago; é
      acessível a carrinhos de bebé, cadeiras de rodas e andarilhos. O Wackelwald é um trilho botânico de 600
      m munido de 8 paragens sobre aves florestais, cavidades de pica-paus e esquilos.


      Para circum-navegar o lago existe o Federsee-Rundweg, um circuito de 16 km para bicicleta e
      pedestrianismo ao longo do limite da reserva com 14 estações. O traçado é praticamente plano em saibro e
      asfalto com torres de vigia; a partir da estação 10 perto de Brackenhofen avistam-se os Alpes em dias
      límpidos. O percurso arqueológico da turfeira sul percorre 9 km ao longo de 11 paragens que relatam doze
      mil anos de presença humana.


      A exposição do centro NABU faculta uma excelente contextualização prévia e os técnicos recomendam os
      melhores locais de vigia. Realizam-se visitas guiadas frequentes.
    history: >-
      A turfeira encontra-se em recuperação ecológica faseada: após as parcelas sul e norte, prevê-se
      revitalizar o setor ocidental, o Betzenweiler Ried. O Federseemoor funciona como refúgio insubstituível
      para espécies que desapareceram das zonas agrícolas vizinhas.
    before: >-
      No perímetro da reserva vigora durante o ano inteiro a proibição de sair dos trilhos. Em todo o
      Federseemoor é expressamente proibido reproduzir chamamentos sonoros de aves, inclusivamente sobre o
      passadiço. Confirma previamente o horário do centro de acolhimento e a acessibilidade ao passadiço.
    around: >-
      Outras zonas húmidas relevantes partilham o tartaranhão-dos-pauis com o Federsee: o [Parc Natural dels
      Aiguamolls de l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/), que alberga igualmente o
      abcaravão, e o [Parque Nacional Weerribben-Wieden](/lugar/nationaal-park-weerribben-wieden/), também com
      abcaravão.
