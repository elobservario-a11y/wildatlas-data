resumen:
  es: >-
    Mesetas cársticas con hayedos trasmochados, nacederos de ríos turquesas y pastizales de montaña en
    Navarra.
  en: >-
    Karst plateaus featuring pollarded beech groves, turquoise river resurgences, and alpine meadows in
    Navarre.
  fr: Plateaux karstiques, hêtraies émondées, résurgences turquoise et pâturages d’altitude en Navarre.
  de: Karsthochflächen mit Kopfbuchen, türkisblauen Flussquellen und Bergweiden in Navarra.
  it: Altipiani carsici con faggete a capitozza, risorgive turchesi e pascoli montani in Navarra.
  pt: >-
    Planaltos cársticos com faiais desbastados, nascentes de rios azul-turquesa e pastagens de montanha em
    Navarra.
unico:
  es: >-
    Aquí lo más importante del agua está bajo tierra: ríos que nacen en una roca y un monte donde la fauna
    silvestre y el ganado conviven desde tiempos inmemoriales.
  en: >-
    The most decisive water flows underground: subterranean rivers welling from rock faces and highland
    pastures where livestock and wildlife have coexisted since prehistory.
  fr: >-
    L’eau la plus précieuse coule sous terre : des rivières jaillissant des falaises et un haut plateau où
    faune sauvage et troupeaux cohabitent depuis la nuit des temps.
  de: >-
    Das Entscheidende spielt sich unter Tage ab: Flüsse, die unvermittelt aus Felswänden sprudeln, und
    Hochebenen, auf denen Vieh und Wildtiere seit Urzeiten zusammenleben.
  it: >-
    L’elemento idrico più prezioso scorre nel sottosuolo: fiumi che scaturiscono dalla viva roccia e altipiani
    dove pascoli e fauna coesistono dalla notte dei tempi.
  pt: >-
    A água mais importante corre debaixo do chão: rios que brotam das escarpas e serras onde o gado e a fauna
    bravia convivem desde a Pré-história.
observaciones:
  es: >-
    La reserva del Urederra es obligatoria, así que hazla antes. Los vehículos a motor solo circulan por la
    NA-718, la NA-120 y la pista de Otsaportillo; los perros van atados, y hay prohibición de perros sueltos
    en los montes. Se puede encender fuego solo en los fogones, y solo los días sin riesgo de incendio muy
    alto o extremo. La acampada y la pernocta en autocaravana solo se permiten en el camping de Urbasa.
    Consulta el tiempo, que varía mucho entre el norte y el sur; hay nieblas, el móvil no tiene cobertura en
    todo el parque y en los días de viento fuerte es mejor no entrar en el bosque. No te salgas de senderos y
    pistas: hay simas y cortados.
texto:
  es:
    intro: >-
      Llueve mucho en Urbasa y Andía, y sin embargo no verás un solo río. Cruzas una meseta caliza de hayedos
      y rasos de pasto, caminas por encima de un acuífero inmenso y el agua no aparece: se ha colado entre la
      roca y corre por dentro, y solo asoma al pie de las sierras, en surgencias que dan origen a ríos que
      acaban en el Mediterráneo. El Parque Natural de Urbasa y Andía reúne en 21.000 hectáreas del norte de
      Navarra cuatro zonas distintas: la sierra de Urbasa, la sierra de Andía, el Monte de Limitaciones de las
      Améscoas y la Reserva Natural del Nacedero del Urederra.
    landscape: >-
      Urbasa y Andía son sierras calizas modeladas como extensas altiplanicies, y esa forma lo explica casi
      todo. Favorecen las nieblas y las lluvias que llegan del Cantábrico, y en ellas conviven rasgos de la
      Navarra atlántica y de la mediterránea. Urbasa es una gran meseta: superados los cantiles que la bordean
      al norte y al sur, el relieve es prácticamente llano. Pero el agua que cae no se queda en la superficie.
      Se filtra, disuelve la caliza y, como una esponja inmensa, forma lagos y ríos subterráneos. En Andía
      pasa lo mismo, con cuevas y simas bajo tierra y dolinas profundas arriba.


      Sobre esa roca crece un paisaje que también hizo el hombre. Desde la Prehistoria, el bosque original de
      Urbasa se fue abriendo para dar pasto al ganado trashumante, y así se llegó al equilibrio que ves hoy
      entre rasos y arbolado. Andía, en cambio, está prácticamente desarbolada, probablemente por la
      intervención humana y no por la naturaleza. Los hayedos y los pastizales ocupan juntos más del 80 % del
      parque; el resto son robledales, brezales y espinares. En el Monte de Limitaciones, tejos, espinos,
      arces y serbales enriquecen el hayedo.


      El parque sube de los 565 m, en lo más bajo del Nacedero del Urederra, a los 1.493 m del monte Beriain,
      en San Donato.
    wildlife: >-
      Las aves son el grupo más rico y mejor representado: pájaros carpinteros en el bosque, aves de pastizal
      y grandes rapaces en los roquedos. Entre ellas, el [quebrantahuesos](/especie/gypaetus_barbatus/), el
      [buitre leonado](/especie/gyps_fulvus/) y el [alimoche](/especie/neophron_percnopterus/). Entre los
      mamíferos están el [jabalí](/especie/sus_scrofa/), el [corzo](/especie/capreolus_capreolus/), el zorro,
      el tejón, el [gato montés](/especie/felis_silvestris/), la garduña, la
      [gineta](/especie/genetta_genetta/) y la comadreja. El lobo y el oso vivieron aquí y han desaparecido.


      Los anfibios y reptiles son también uno de sus valores: el parque reúne más del 80 % de las especies
      presentes en Navarra. Hay insectos ligados a árboles viejos y madera muerta, murciélagos y una flora
      micológica rica, con más de 400 especies de hongos identificadas.
    visit: >-
      Empieza por el centro de acogida de visitantes, en la entrada norte de Urbasa, por la carretera NA-718.
      Dos exposiciones explican el parque: «Roca y agua, fuentes de vida», con el subsuelo, los rasos, el
      bosque y el roquedo, y «Un hogar natural», con el patrimonio cultural desde la prehistoria.


      La red de senderos ofrece desde paseos familiares hasta rutas para senderistas experimentados, con
      miradores, cascadas, dolinas y arquitectura pastoril. Están el Hayedo Encantado de Zelaiaundi, el
      paisaje quebrado de Ollide, las chabolas cupulares de Mirueta y el circo kárstico de Ubaba. El Sendero
      accesible de Morterutxo es circular, de 890 metros, y está adaptado a personas con discapacidad visual,
      intelectual o movilidad reducida.


      El gran espectáculo del agua es el Nacedero del Urederra. Es la salida del acuífero de Urbasa: varias
      surgencias en la roca con una caída de agua importante, y después cascadas, pozas y represas entre
      hayas, robles, olmos y arces. La cal disuelta le da sus colores. El paseo es de escasa dificultad, de
      unos 6 kilómetros ida y vuelta, y solo se entra por un único itinerario, con reserva previa obligatoria
      y gratuita. Se deja el coche en el Área de acogida de Baquedano.
    history: >-
      En Urbasa se conservan hasta veinte dólmenes, cuatro estructuras tumulares y dos menhires. También hay
      ermitas centenarias y la sima de Otsaportillo, con una escultura del Lugar de la Memoria Histórica.
      Urbasa y Andía son comunales de aprovechamiento libre y gratuito para todos los vecinos de Navarra,
      gestionados por el Gobierno de Navarra.


      La Ley Foral 3/1997 declaró el parque natural en 1997, y el parque se integró en la red Natura 2000 en
      2007. El Urederra es una de las reservas más visitadas de Navarra y es frágil, por eso exige reserva
      previa y pautas especiales de comportamiento.
    before: >-
      La reserva del Urederra es obligatoria, así que hazla antes. Los vehículos a motor solo circulan por la
      NA-718, la NA-120 y la pista de Otsaportillo; los perros van atados, y hay prohibición de perros sueltos
      en los montes. Se puede encender fuego solo en los fogones, y solo los días sin riesgo de incendio muy
      alto o extremo. La acampada y la pernocta en autocaravana solo se permiten en el camping de Urbasa.
      Consulta el tiempo, que varía mucho entre el norte y el sur; hay nieblas, el móvil no tiene cobertura en
      todo el parque y en los días de viento fuerte es mejor no entrar en el bosque. No te salgas de senderos
      y pistas: hay simas y cortados.
    around: >-
      Lejos de aquí hay lugares con los que comparte lo que dicen los datos: el [Parque Natural de Els
      Ports](/lugar/parc-natural-dels-ports/) y el [Parque Natural Regional del Verdon - Grandes
      Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/) comparten con el parque el karst, el
      quebrantahuesos, el buitre leonado y el búho real; el [Parque Nacional de los Abruzos, Lacio y
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/) comparte el karst, el quebrantahuesos, el buitre
      leonado y la rosalia alpina, y el [Bosque Primario de Krokar](/lugar/pragozd-krokar/) comparte el karst,
      el gato montés y la rosalia alpina.
  en:
    intro: >-
      Rainfall is heavy across Urbasa and Andía, yet not a single surface river flows across the heights.
      Walking across this limestone tableland of beech woods and open pastures means striding above a colossal
      subterranean aquifer where surface runoff immediately vanishes into the rock: it channels deep
      underground, only emerging along the foothills as powerful resurgences feeding rivers bound for the
      Mediterranean. The Urbasa and Andía Natural Park unites 21,000 hectares of northern Navarre divided into
      four sectors: the Sierra de Urbasa, the Sierra de Andía, the Monte de Limitaciones de las Améscoas, and
      the Nacedero del Urederra Nature Reserve.
    landscape: >-
      Urbasa and Andía are limestone massifs shaped as expansive undulating tablelands. This topography
      intercepts oceanic moisture sweeping in from the Bay of Biscay, fostering a confluence of Atlantic and
      Mediterranean biogeography. Urbasa presents a broad plateau: once past the peripheral scarp cliffs
      bounding it north and south, the terrain rolls gently. Yet falling rain cannot pool on the surface; it
      filters down through soluble limestone fissures, carving underground lakes and conduits like a vast
      stony sponge. In Andía the subterranean hydrology is identical, creating deep dolines on the surface
      above cave networks.


      Human pastoralism has shaped this terrain since prehistoric times. Settlers opened clearings across
      Urbasa’s primeval forest to create summer grazing for transhumant herds, producing the current
      equilibrium between open lawns and beech stands. Andía, by contrast, is largely deforested, a condition
      driven by centuries of grazing rather than natural causes. Together, beechwoods and upland pastures
      cover more than 80 % of the park; the remainder comprises oak woods, dry heaths, and scrub. In the Monte
      de Limitaciones, yew, hawthorn, maple, and rowan diversify the beech canopy.


      Elevations span from 565 m at the lowest pools of the Nacedero del Urederra up to 1,493 m atop Mount
      Beriain in San Donato.
    wildlife: >-
      Avifauna represents the most prominent animal group: woodpeckers in the mature beechwoods, meadow
      passerines across the rasos, and large raptors soaring over limestone crags. Prominent among them are
      the [bearded vulture](/especie/gypaetus_barbatus/), the [griffon vulture](/especie/gyps_fulvus/), and
      the [Egyptian vulture](/especie/neophron_percnopterus/). Mammals include the [wild
      boar](/especie/sus_scrofa/), the [roe deer](/especie/capreolus_capreolus/), red fox, European badger,
      [European wildcat](/especie/felis_silvestris/), stone marten, [common genet](/especie/genetta_genetta/),
      and least weasel. Wolves and brown bears once roamed here but were historically extirpated.


      Herpetofauna constitutes another major conservation asset, with the park hosting more than 80 % of all
      amphibian and reptile species found in Navarre. Deadwood-dependent saproxylic beetles, cave-roosting
      bats, and an exceptionally diverse fungal flora featuring over 400 catalogued mushroom species complete
      the ecosystem.
    visit: >-
      Begin at the visitor reception centre located at the northern road entrance to Urbasa along highway
      NA-718. Two permanent exhibitions explain the park: “Rock and Water, Sources of Life,” showcasing
      underground hydrology, pastures, and crags, alongside “A Natural Home,” exploring pastoral heritage from
      the Neolithic onward.


      The trail network ranges from family strolls to strenuous hikes past viewpoints, cascades, sinkholes,
      and pastoral stone huts. Key sights include the Enchanted Beechwood of Zelaiaundi, the labyrinthine
      karst of Ollide, the corbelled stone shelters of Mirueta, and the Ubaba cirque. The Morterutxo
      accessible trail is a level 890-metre circuit adapted for visitors with visual, cognitive, or mobility
      impairments.


      The crowning aquatic highlight is the Nacedero del Urederra. It marks the main spring outlet of the
      Urbasa karst aquifer: several sheer resurgences pour from the cliff, cascading down into turquoise pools
      shaded by beech, oak, elm, and maple. Dissolved minerals bestow its vivid coloration. The walk is easy,
      roughly 6 kilometres return along a single designated path; prior online reservation is mandatory and
      free of charge. Parking is restricted to the visitor area at Baquedano.
    history: >-
      Urbasa preserves up to twenty megalithic dolmens, four burial mounds, and two menhirs, alongside
      centuries-old pastoral hermitages and the Otsaportillo chasm, commemorated as a Historical Memory Site.
      Urbasa and Andía are historic commons with free pasturage rights granted to all residents of Navarre,
      managed by the Government of Navarre.


      Navarrese Foral Law 3/1997 designated the natural park in 1997, and the territory was incorporated into
      the Natura 2000 network in 2007. The fragile Urederra gorge is one of the most visited natural
      sanctuaries in Navarre, prompting strict visitor caps and conservation regulations.
    before: >-
      Prior booking for the Urederra trail is mandatory; ensure you reserve in advance. Motor vehicles are
      restricted to the NA-718, NA-120, and the Otsaportillo track. Dogs must remain leashed park-wide.
      Campfires are permitted solely in designated hearths, and prohibited during high or extreme wildfire
      hazard. Overnight camping and motorhome stays are allowed only at the Urbasa campsite. Weather shifts
      rapidly between north and south flanks; dense fogs occur, mobile phone reception is patchy, and entering
      woodland during severe windstorms is hazardous. Stay strictly on marked trails to avoid unseen sinkholes
      and drop-offs.
    around: >-
      Beyond Navarre, other protected areas documented in the atlas share similar karst and biodiversity
      traits: [Els Ports Natural Park](/lugar/parc-natural-dels-ports/) and [Verdon Regional Natural Park -
      Gorges](/lugar/parc-naturel-regional-du-verdon---gorges/) both host karst relief, bearded vultures,
      griffon vultures, and eagle owls. [Abruzzo, Lazio and Molise National
      Park](/lugar/parco-nazionale-d-abruzzo-lazio-e/) shares limestone karst, bearded vultures, griffons, and
      the Rosalia longicorn beetle, while [Krokar Virgin Forest](/lugar/pragozd-krokar/) preserves ancient
      karst beechwoods, wildcats, and Rosalia longicorns.
  fr:
    intro: >-
      Il pleut abondamment sur Urbasa et Andía, et pourtant aucun cours d’eau ne coule en surface. Parcourir
      ce plateau calcaire de hêtraies et de pelouses rases, c’est marcher au-dessus d’un aquifère gigantesque
      où l’eau de pluie s’engouffre dans la roche : elle circule sous terre et ne réapparaît qu’au pied des
      sierras, sous forme de résurgences spectaculaires donnant naissance à des rivières tributaires de la
      Méditerranée. Le parc naturel d’Urbasa et Andía rassemble sur 21 000 hectares du nord de la Navarre
      quatre secteurs : la sierra d’Urbasa, la sierra d’Andía, le Monte de Limitaciones des Améscoas et la
      réserve naturelle du Nacedero del Urederra.
    landscape: >-
      Urbasa et Andía forment de hauts plateaux calcaires ondulés. Cette barrière retient les brumes
      océaniques venues du golfe de Gascogne, créant un carrefour entre influences atlantiques et
      méditerranéennes. Urbasa est une immense table : franchies les falaises qui la ceinturent au nord et au
      sud, le relief est presque plat. Mais l’eau ne stagne jamais ; elle s’infiltre, dissout le calcaire et,
      telle une immense éponge, creuse des lacs et des rivières souterraines. Il en va de même en Andía, où de
      vastes dolines de surface surplombent gouffres et avens.


      Le pastoralisme a façonné ces paysages depuis la Préhistoire. Les premiers éleveurs ont ouvert la forêt
      d’Urbasa pour offrir des pâturages aux troupeaux transhumants, aboutissant à l’équilibre actuel entre
      clairières et boisements. Andía, en revanche, est presque entièrement dénudée sous l’effet d’un pâturage
      millénaire. Hêtraies et pelouses d’estive couvrent plus de 80 % du parc ; le reste comprend chênaies,
      landes sèches et buissons épineux. Dans le Monte de Limitaciones, ifs, érables, alisiers et aubépines
      enrichissent la hêtraie.


      L’altitude s’élève depuis 565 m au fond du ravin de l’Urederra jusqu’à 1 493 m au mont Beriain, à San
      Donato.
    wildlife: >-
      Les oiseaux constituent le groupe le plus remarquable : pics dans les hêtraies, passereaux dans les
      pelouses et grands rapaces sur les falaises. Parmi eux s’observent le [gypaète
      barbu](/especie/gypaetus_barbatus/), le [vautour fauve](/especie/gyps_fulvus/) et le
      [percnoptère](/especie/neophron_percnopterus/). Les mammifères comptent le
      [sanglier](/especie/sus_scrofa/), le [chevreuil](/especie/capreolus_capreolus/), le renard, le blaireau,
      le [chat forestier](/especie/felis_silvestris/), la fouine, la [genette
      commune](/especie/genetta_genetta/) et la belette. L’ours et le loup y vécurent jadis avant d’en
      disparaître.


      Les amphibiens et reptiles forment une autre richesse majeure : le parc concentre plus de 80 % des
      espèces recensées en Navarre. Des coléoptères saproxyliques liés aux vieux arbres, des chauves-souris
      troglophiles et plus de 400 espèces de champignons complètent la biodiversité.
    visit: >-
      Commencez par le centre d’accueil des visiteurs, situé à l’entrée nord d’Urbasa sur la route NA-718.
      Deux expositions présentent le parc : « Roche et eau, sources de vie », consacrée au sous-sol et aux
      pelouses, et « Un foyer naturel », retraçant le patrimoine pastoral depuis le Néolithique.


      Le réseau de sentiers propose des balades familiales comme des randonnées au long cours vers des
      belvédères, cascades et cabanes pastorales. À ne pas manquer : la hêtraie enchantée de Zelaiaundi, le
      relief tourmenté d’Ollide, les cabanes en coupole de Mirueta et le cirque d’Ubaba. Le sentier accessible
      de Morterutxo forme une boucle de 890 mètres adaptée aux personnes à mobilité réduite ou handicap
      visuel.


      Le grand joyau aquatique reste le Nacedero del Urederra. C’est l’exutoire de l’aquifère d’Urbasa :
      plusieurs résurgences jaillissent de la falaise en cascades successives et vasques d’un bleu turquoise
      laiteux sous les hêtres et érables. La promenade, très accessible, s’étend sur environ 6 kilomètres
      aller-retour sur un sentier unique ; la réservation en ligne préalable est obligatoire et gratuite. Le
      stationnement s’effectue sur l’aire d’accueil de Baquedano.
    history: >-
      Urbasa préserve jusqu’à vingt dolmens, quatre tertres funéraires et deux menhirs, ainsi que des
      ermitages pastoraux et le gouffre d’Otsaportillo, lieu de mémoire historique. Urbasa et Andía sont des
      terres communales dont la jouissance gratuite appartient à tous les habitants de Navarre, gérées par le
      gouvernement foral.


      La loi forale 3/1997 a déclaré le parc naturel en 1997, et le site a intégré le réseau Natura 2000 en
      2007. L’Urederra est l’un des espaces les plus fragiles et courus de Navarre, justifiant un encadrement
      strict des flux.
    before: >-
      La réservation pour l’Urederra est obligatoire : pensez à réserver en ligne avant de venir. Les
      véhicules ne peuvent circuler que sur la NA-718, la NA-120 et la piste d’Otsaportillo. Les chiens
      doivent être tenus en laisse. Les feux sont interdits en dehors des foyers aménagés et prohibés par
      risque d’incendie élevé. Le bivouac et les camping-cars ne sont autorisés qu’au camping d’Urbasa. La
      météo change vite entre versants nord et sud ; les brumes sont denses, le réseau téléphonique est
      irrégulier et il est déconseillé d’entrer dans la forêt par grand vent. Ne quittez pas les sentiers en
      raison des gouffres et falaises masqués.
    around: >-
      Plus loin, d’autres sites partagent ces affinités géologiques et faunistiques : le [parc naturel d’Els
      Ports](/lugar/parc-natural-dels-ports/) et le [parc naturel régional du Verdon -
      gorges](/lugar/parc-naturel-regional-du-verdon---gorges/) combinent karst, gypaète barbu, vautour fauve
      et grand-duc. Le [parc national des Abruzzes, Latium et
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/) réunit paysages karstiques, gypaète, vautour fauve et
      rosalie des Alpes, tandis que la [forêt vierge de Krokar](/lugar/pragozd-krokar/) préserve des hêtraies
      calcaires, le chat forestier et la rosalie.
  de:
    intro: >-
      In Urbasa und Andía regnet es ergiebig, und doch fließt an der Oberfläche kein einziger Fluss. Wer diese
      Kalkhochfläche aus Buchenwäldern und Hochweiden durchquert, wandert über einem gewaltigen unterirdischen
      Grundwasserleiter: Das Regenwasser versickert sofort im klüftigen Gestein, fließt im Berginneren ab und
      tritt erst am Fuß der Gebirgszüge in mächtigen Karstquellen zutage, die ins Mittelmeer entwässern. Der
      Naturpark Urbasa und Andía umfasst 21.000 Hektar im Norden Navarras, verteilt auf vier Zonen: die Sierra
      de Urbasa, die Sierra de Andía, den Monte de Limitaciones de las Améscoas und das Naturschutzgebiet
      Nacedero del Urederra.
    landscape: >-
      Urbasa und Andía sind als weitläufige Hochebenen geformte Kalksteinmassive. Diese Riegel fangen die
      feuchten Winde der Biskaya auf und vereinen atlantische mit mediterranen Klimazügen. Urbasa bildet eine
      riesige Tafel: Hinter den Steilabbrüchen im Norden und Süden ist das Relief nahezu eben. Doch
      Niederschläge bleiben nicht an der Oberfläche. Das Wasser löst das Gestein und formt wie in einem
      gigantischen Schwamm Höhlen und Karstflüsse. In Andía vollzieht sich derselbe Prozess mit ausgedehnten
      Dolinenfeldern über tiefen Klüften.


      Die Landschaft ist auch das Werk jahrtausendelanger Beweidung. Seit der Jungsteinzeit lichteten Hirten
      die Urwälder von Urbasa für Wanderherden, woraus das heutige Gleichgewicht zwischen Rasenflächen und
      Buchenforsten entstand. Andía hingegen ist fast völlig waldfrei, eine Folge menschlicher Eingriffe.
      Buchenwälder und Bergweiden nehmen zusammen über 80 % des Parks ein; der Rest besteht aus Eichenwäldern,
      Heiden und Dornsträuchern. Im Monte de Limitaciones bereichern Eiben, Ahorne, Weißdorne und Mehlbeeren
      die Buchenbestände.


      Die Höhenlagen reichen von 565 m im Talgrund des Urederra bis auf 1.493 m am Gipfel des Beriain bei San
      Donato.
    wildlife: >-
      Vögel stellen die artenreichste Gruppe: Spechte im Altholz, Wiesenbrüter auf den Hochebenen und
      Felsengreife an den Steilwänden. Herausragend sind [Bartgeier](/especie/gypaetus_barbatus/),
      [Gänsegeier](/especie/gyps_fulvus/) und [Schmutzgeier](/especie/neophron_percnopterus/). Unter den
      Säugetieren leben [Wildschwein](/especie/sus_scrofa/), [Reh](/especie/capreolus_capreolus/), Rotfuchs,
      Dachs, [Wildkatze](/especie/felis_silvestris/), Steinmarder,
      [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/) und Wiesel. Wolf und Braunbär sind historisch
      erloschen.


      Amphibien und Reptilien sind bemerkenswert vielfältig: Über 80 % aller in Navarra vorkommenden
      Herpetofauna-Arten leben im Park. Totholzkäfer, Fledermäuse und eine reiche Pilzflora mit über 400
      nachgewiesenen Pilzarten bereichern das Schutzgebiet.
    visit: >-
      Der beste Einstieg bietet das Besucherzentrum an der Nordzufahrt nach Urbasa an der Straße NA-718. Zwei
      Ausstellungen erschließen das Schutzgebiet: „Fels und Wasser, Quellen des Lebens“ zu Geologie und Weiden
      sowie „Eine natürliche Heimat“ zur Kulturgeschichte seit der Urgeschichte.


      Das Wegenetz reicht von Familienpfaden bis zu anspruchsvollen Bergtouren zu Aussichtspunkten, Dolinen
      und Hirtenhütten. Höhepunkte sind der Zauberhafte Buchenwald von Zelaiaundi, das Felsenlabyrinth Ollide,
      die Steinhütten von Mirueta und der Karstkessel Ubaba. Der barrierefreie Pfad Morterutxo bildet einen
      ebenen Rundweg von 890 Metern Länge für Menschen mit eingeschränkter Mobilität oder Sehbehinderung.


      Das Glanzlicht bildet der Nacedero del Urederra, die Hauptquelle des Urbasa-Aquifers: Mehrere
      Quellaustritte stürzen aus der Felswand und speisen milchig-türkise Gumpen zwischen Buchen und Ahornen.
      Der Spaziergang ist leicht und misst rund 6 Kilometer hin und zurück auf einem festen Pfad; die
      Online-Voranmeldung ist zwingend erforderlich und kostenlos. Parken ist nur am Besucherparkplatz
      Baquedano gestattet.
    history: >-
      In Urbasa zeugen bis zu zwanzig Dolmen, vier Grabhügel und zwei Menhire von uralter Besiedlung, ergänzt
      durch historische Einsiedeleien und die Doline Otsaportillo als Mahnmal historischer Erinnerung. Urbasa
      und Andía sind Gemeingüter mit freiem Nutzungsrecht für alle Einwohner Navarras, verwaltet durch die
      Foralregierung.


      Das Foralgesetz 3/1997 wies das Gebiet 1997 als Naturpark aus; 2007 folgte die Eingliederung ins Netz
      Natura 2000. Die Urederra-Schlucht zählt zu den meistbesuchten und empfindlichsten Schutzgebieten
      Navarras, was strikte Kontingente erfordert.
    before: >-
      Die Voranmeldung für den Urederra-Pfad ist verbindlich: Reserviere vorab online. Kraftfahrzeuge dürfen
      nur auf der NA-718, NA-120 und der Otsaportillo-Piste verkehren. Hunde sind stets an der Leine zu
      führen. Offenes Feuer ist nur an ausgewiesenen Grillplätzen erlaubt und bei hoher Waldbrandgefahr
      untersagt. Zelten und Wohnmobile sind nur auf dem Campingplatz Urbasa gestattet. Das Wetter schlägt
      rasch um; Nebel ist häufig, Mobilfunk lückenhaft und bei Sturm sollte der Wald gemieden werden. Bleibe
      auf den Pfaden wegen verborgener Klüfte und Felsabbrüche.
    around: >-
      In größerer Entfernung teilen andere Schutzgebiete vergleichbare Merkmale: Der [Naturpark Els
      Ports](/lugar/parc-natural-dels-ports/) und der [Regionale Naturpark Verdon -
      Schluchten](/lugar/parc-naturel-regional-du-verdon---gorges/) teilen Karst, Bartgeier, Gänsegeier und
      Uhu. Der [Nationalpark Abruzzen, Latium und Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/)
      beherbergt Karstlandschaften, Bartgeier, Geier und den Alpenbock, während der [Urwald
      Krokar](/lugar/pragozd-krokar/) urige Karstbuchenwälder, Wildkatzen und Alpenböcke schützt.
  it:
    intro: >-
      Piove con grande abbondanza su Urbasa e Andía, eppure in superficie non scorre un solo fiume. Camminare
      su questo altopiano calcareo coperto di faggete e pascoli aperti significa calpestare un immenso
      acquifero sotterraneo dove l’acqua piovana sparisce nelle fessure rocciose: scorre nelle viscere della
      terra per riaffiorare ai piedi dei monti con sorgenti impetuose che alimentano corsi d’acqua diretti al
      Mediterraneo. Il Parco Naturale di Urbasa e Andía protegge 21.000 ettari nel nord della Navarra
      suddivisi in quattro aree: la Sierra de Urbasa, la Sierra de Andía, il Monte de Limitaciones de las
      Améscoas e la Riserva Naturale del Nacedero del Urederra.
    landscape: >-
      Urbasa e Andía sono massicci calcarei conformati ad ampi altipiani ondulati. Questa muraglia trattiene
      le nebbie e le perturbazioni atlantiche dal Golfo di Biscaglia, creando un singolare punto d’incontro
      tra climi oceanici e mediterranei. Urbasa si presenta come una vasta tavola: superate le pareti rocciose
      che la cingono a nord e a sud, il dislivello interno è quasi nullo. Ma le precipitazioni non ristagnano;
      s’infiltrano solubilizzando il calcare e, come in una gigantesca spugna, scavano meandri e fiumi
      sotterranei. In Andía accade lo stesso, con profonde doline che costellano i rilievi sopra abissi
      oscuri.


      Il paesaggio porta l’impronta millenaria dell’uomo. Sin dalla preistoria i pastori aprirono ampie radure
      nella foresta primordiale di Urbasa per le greggi transumanti, raggiungendo l’equilibrio visibile oggi
      tra radure e boschi maturi. Andía è invece quasi del tutto priva di alberi per via del pascolo secolare.
      Faggete e pascoli coprono oltre l’80 % del parco; il resto è formato da querceti, brughiere e arbusteti
      spinosi. Nel Monte de Limitaciones, tassi, aceri, biancospini e sorbi arricchiscono il sottobosco.


      Le quote variano dai 565 m delle pozze basse dell’Urederra fino ai 1.493 m della cima del monte Beriain
      a San Donato.
    wildlife: >-
      L’avifauna domina per varietà e consistenza: picchi nelle faggete mature, passeriformi nei pascoli e
      grandi veleggiatori sulle pareti verticali. Tra questi spiccano il
      [gipeto](/especie/gypaetus_barbatus/), il [grifone](/especie/gyps_fulvus/) e il
      [capovaccaio](/especie/neophron_percnopterus/). I mammiferi annoverano il
      [cinghiale](/especie/sus_scrofa/), il [capriolo](/especie/capreolus_capreolus/), la volpe, il tasso, il
      [gatto selvatico](/especie/felis_silvestris/), la faina, la [genetta comune](/especie/genetta_genetta/)
      e la donnola. L’orso bruno e il lupo popolavano questi monti prima della loro scomparsa.


      Anfibi e rettili rappresentano un patrimonio di prim’ordine: il parco accoglie oltre l’80 % delle specie
      censite in Navarra. Completano il quadro coleotteri legati al legno vetusto, colonie di pipistrelli e
      una ricchissima micoflora con oltre 400 specie di funghi determinate.
    visit: >-
      Il punto di partenza consigliato è il centro visite all’ingresso nord di Urbasa, lungo la strada NA-718.
      Due allestimenti permanenti raccontano il parco: «Roccia e acqua, sorgenti di vita», su speleologia e
      pascoli, e «Una dimora naturale», sulla cultura pastorale dalla preistoria.


      La rete dei sentieri spazia da itinerari accessibili a camminate escursionistiche verso punti
      panoramici, doline e ripari pastorali in pietra a secco. Spiccano la Faggeta Incantata di Zelaiaundi, il
      terreno tormentato di Ollide, le capanne a cupola di Mirueta e il circo carsico di Ubaba. Il sentiero
      accessibile di Morterutxo è un anello di 890 metri fruibile da persone con disabilità visiva o ridotta
      mobilità.


      L’attrazione acquatica più celebre è il Nacedero del Urederra, risorgiva principale dell’acquifero di
      Urbasa: l’acqua sgorga dalla parete rocciosa riversandosi in pozze turchesi incorniciate da faggi e
      aceri. Il percorso è agevole, circa 6 chilometri tra andata e ritorno su tracciato unico; la
      prenotazione online anticipata è gratuita e obbligatoria. Le auto vanno lasciate nell’area di sosta di
      Baquedano.
    history: >-
      A Urbasa si conservano venti dolmen megalitici, quattro tumuli e due menhir, oltre a storici eremi
      pastorali e all’abisso di Otsaportillo, consacrato a Luogo della Memoria Storica. Urbasa e Andía sono
      beni demaniali ad uso civico gratuito per i cittadini della Navarra, amministrati dal governo forale.


      La legge forale 3/1997 ha istituito il parco naturale nel 1997, successivamente inserito nella rete
      Natura 2000 nel 2007. La forra dell’Urederra è uno degli ambienti più frequentati e delicati della
      regione, richiedendo contingenti precisi di accesso.
    before: >-
      La prenotazione per l’Urederra è tassativa: prenota online prima di raggiungere il sito. I veicoli a
      motore possono circolare unicamente sulle strade NA-718, NA-120 e sulla pista di Otsaportillo. I cani
      vanno condotti al guinzaglio. È vietato accendere fuochi fuori dai punti attrezzati e nei periodi ad
      alto rischio incendi. Campeggio e camper sono consentiti unicamente nel campeggio di Urbasa. Il meteo
      muta repentinamente tra versante nord e sud; le nebbie sono frequenti, la copertura telefonica assente
      in molte aree e con forte vento è sconsigliato inoltrarsi tra gli alberi. Non allontanarti dai tracciati
      per il pericolo di pozzi e salti di roccia nascosti.
    around: >-
      A maggiore distanza si trovano aree con affinità naturalistiche: il [Parco Naturale di Els
      Ports](/lugar/parc-natural-dels-ports/) e il [Parco Naturale Regionale del Verdon -
      Gole](/lugar/parc-naturel-regional-du-verdon---gorges/) condividono carsismo, gipeto, grifone e gufo
      reale. Il [Parco Nazionale d’Abruzzo, Lazio e Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/)
      presenta formazioni carsiche, gipeti, grifoni e la rosalia alpina, mentre la [Foresta Vergine di
      Krokar](/lugar/pragozd-krokar/) racchiude faggete primarie carsiche, gatti selvatici e rosalie alpine.
  pt:
    intro: >-
      Chove com frequência em Urbasa e Andía, mas à superfície não corre um único rio. Atravessar este
      planalto calcário de faiais e prados rasos equivale a caminhar sobre um aquífero colossal onde as águas
      da chuva se esgueiram pela rocha adentro: correm pelas entranhas da serra e só despontam no sopé, em
      nascentes impetuosas que dão corpo a rios com destino ao Mediterrâneo. O Parque Natural de Urbasa e
      Andía congrega 21.000 hectares do norte de Navarra distribuídos por quatro setores: a serra de Urbasa, a
      serra de Andía, o Monte de Limitaciones de las Améscoas e a Reserva Natural do Nacedero del Urederra.
    landscape: >-
      Urbasa e Andía são maciços calcários erguidos como vastos planaltos ondulados. Esta barreira retém os
      nevoeiros oceânicos chegados do mar Cantábrico, reunindo caraterísticas bioclimáticas atlânticas e
      mediterrânicas. Urbasa é uma extensa mesa: transpostas as escarpas marginais a norte e a sul, o relevo
      interno é quase chão liso. Porém, a água não permanece à superfície; infiltra-se dissolvendo a rocha e,
      como numa esponja imensa, esculpe rios e lagos subterrâneos. Em Andía passa-se o mesmo, abrindo-se
      dolinas profundas à superfície por cima de algares e fendas.


      A paisagem foi igualmente modelada pelo pastoreio ancestral. Desde a Pré-história que o bosque primitivo
      de Urbasa foi desbastado para criar pastagens para rebanhos transumantes, atingindo o equilíbrio visível
      hoje entre clareiras e arvoredo. Andía, em contrapartida, surge quase desprovida de árvores devido à
      pressão pastoril prolongada. Faiais e pastagens somam mais de 80 % do parque; o restante reparte-se por
      carvalhais, charnecas e matagais espinhosos. No Monte de Limitaciones, teixos, bordos, pilriteiros e
      sorveiras enriquecem a mancha florestal.


      A altitude ascende desde os 565 m no leito inferior do Urederra até aos 1.493 m no cume do monte
      Beriain, em San Donato.
    wildlife: >-
      As aves compõem o grupo mais diverso e representativo: pica-paus no interior da mata, passeriformes nos
      pastos e grandes rapinas nas escarpas alcantiladas. Destacam-se o
      [abutre-barbudo](/especie/gypaetus_barbatus/), o [abutre-fouveiro](/especie/gyps_fulvus/) e o
      [abutre-do-egito](/especie/neophron_percnopterus/). Entre os mamíferos encontram-se o
      [javali](/especie/sus_scrofa/), a [corça](/especie/capreolus_capreolus/), a raposa, o texugo, o
      [gato-bravo](/especie/felis_silvestris/), a fuinha, a [gineta](/especie/genetta_genetta/) e a doninha. O
      lobo e o urso habitaram estas paragens antes de serem extintos historicamente.


      Anfíbios e répteis constituem outro tesouro faunístico: o parque alberga mais de 80 % das espécies
      presentes em Navarra. Insetos saproxílicos associados a árvores velhas, morcegos cavernícolas e mais de
      400 espécies de fungos enriquecem a biodiversidade.
    visit: >-
      Começa pelo centro de acolhimento de visitantes, na entrada norte de Urbasa pela estrada NA-718. Duas
      exposições permanentes interpretam o parque: «Rocha e água, fontes de vida», focada no subsolo e nas
      pastagens, e «Um lar natural», abordando o património cultural desde os tempos pré-históricos.


      A rede de percursos pedestres disponibiliza desde passeios familiares a caminhadas para praticantes
      experientes, rumo a miradouros, cascatas, dolinas e abrigos pastoris de pedra solta. Destacam-se o Faial
      Encantado de Zelaiaundi, o relevo rendilhado de Ollide, as cabanas cupulares de Mirueta e o circo
      cárstico de Ubaba. O trilho acessível de Morterutxo é um circuito circular de 890 metros adaptado a
      pessoas com mobilidade reduzida ou limitações visuais.


      A grande maravilha das águas reside no Nacedero del Urederra. Trata-se da exsurgência do aquífero
      cárstico de Urbasa: vários jorros brotam da escarpa em sucessivas cascatas e poços azul-turquesa
      rodeados por faias e bordos. A caminhada é simples, com cerca de 6 quilómetros de ida e volta num
      trajeto exclusivo; a reserva prévia online é obrigatória e gratuita. O estacionamento fica circunscrito
      ao parque de acolhimento de Baquedano.
    history: >-
      Em Urbasa subsistem até vinte dólmenes, quatro mamoas e dois menires, a par de ermidas seculares e do
      algar de Otsaportillo, assinalado como Lugar de Memória Histórica. Urbasa e Andía são terrenos baldios
      comunitários de usufruto livre para todos os cidadãos de Navarra, sob tutela do governo foral.


      A Lei Foral 3/1997 instituiu o parque natural em 1997, tendo o espaço ingressado na rede Natura 2000 em
      2007. A garganta do Urederra é uma das reservas mais visitadas e frágeis de Navarra, o que justifica
      limites diários rigorosos de afluência.
    before: >-
      A reserva para o Urederra é obrigatória: agenda a tua vaga antes de partir. Os veículos a motor só podem
      circular na NA-718, NA-120 e na pista de Otsaportillo. Os cães têm de circular sempre com trela. Só é
      permitido fazer fogo nas lareiras autorizadas e fora dos períodos de perigo elevado de incêndio. O
      campismo e autocaravanas só são permitidos no parque de campismo de Urbasa. O tempo muda com rapidez
      entre vertentes; ocorrem nevoeiros densos, o sinal de telemóvel falha com frequência e com vento forte
      não deves entrar na mata. Não saias dos trilhos oficiais devido a algares e precipícios encobertos.
    around: >-
      A maior distância situam-se territórios que partilham traços ecológicos idênticos: o [Parque Natural de
      Els Ports](/lugar/parc-natural-dels-ports/) e o [Parque Natural Regional do Verdon -
      Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/) partilham formações cársticas,
      abutre-barbudo, abutre-fouveiro e bufo-real. O [Parque Nacional de Abruzzo, Lazio e
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/) reúne relevo cárstico, abutre-barbudo, abutres e
      rosalia-alpina, enquanto a [Floresta Virgem de Krokar](/lugar/pragozd-krokar/) preserva faiais
      primitivos sobre calcário, gato-bravo e rosalia-alpina.
