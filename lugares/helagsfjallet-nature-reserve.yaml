resumen:
  es: >-
    Alberga el glaciar más meridional de Suecia (Helagsglaciären) bajo la cumbre del macizo de Helags (1.796
    m) y es santuario reproductor del zorro ártico.
  en: >-
    Home to Sweden's southernmost glacier (Helagsglaciären) beneath the peak of the Helags massif (1,796 m)
    and a breeding stronghold for the Arctic fox.
  fr: >-
    Abrite le glacier le plus méridional de Suède (Helagsglaciären) sous le sommet du massif d'Helags (1 796
    m) et un sanctuaire pour le renard polaire.
  de: >-
    Beherbergt Schwedens südlichsten Gletscher (Helagsglaciären) unter dem Gipfel des Helags-Massivs (1.796 m)
    und ist ein Brutrefugium des Polarfuchses.
  it: >-
    Ospita il ghiacciaio più meridionale della Svezia (Helagsglaciären) sotto la cima del massiccio di Helags
    (1.796 m) ed è un rifugio per la volpe artica.
  pt: >-
    Alberga o glaciar mais meridional da Suécia (Helagsglaciären) sob o cume do maciço de Helags (1.796 m) e é
    um santuário reprodutor da raposa-do-ártico.
unico:
  es: >-
    La montaña más alta de Suecia al sur del círculo polar, con el glaciar más meridional del país en una
    ladera y el zorro ártico en sus pedregales.
  en: >-
    Sweden's highest mountain south of the Arctic Circle, harbouring the country's southernmost glacier on one
    flank and Arctic foxes across its screes.
  fr: >-
    La plus haute montagne de Suède au sud du cercle polaire, abritant le glacier le plus austral du pays et
    le renard polaire dans ses pierriers.
  de: >-
    Schwedens höchster Berg südlich des Polarkreises mit dem südlichsten Gletscher des Landes an einer Flanke
    und Polarfüchsen im Blockmeer.
  it: >-
    La montagna più alta della Svezia a sud del circolo polare, con il ghiacciaio più meridionale del paese su
    un versante e la volpe artica tra le pietraie.
  pt: >-
    A montanha mais alta da Suécia a sul do círculo polar, albergando o glaciar mais meridional do país numa
    vertente e a raposa-do-ártico nos pedregais.
observaciones:
  es: >-
    Se recomienda mirar el anemómetro y la cámara web del Consejo de Seguridad de Montaña al planificar el
    viaje. A lo largo de las rutas estatales hay refugios de emergencia, casi todos con teléfono, pero no
    están pensados para pernoctar de forma planificada. En el mapa de montaña, las rutas de verano van con
    línea de puntos y las de invierno con línea discontinua.
texto:
  es:
    intro: >-
      Hay un punto en Suecia al que, hacia el sur, ya no sube ninguna montaña más. Es Helags, que los sami del
      sur llaman Maajåelkie: una cima de 1797 metros en el noroeste de Härjedalen, cerca de la frontera con
      Jämtland y con Noruega, que se alza de golpe unos setecientos metros sobre la meseta. Es la montaña más
      alta de Suecia al sur del círculo polar y, con Sylarna, forma la zona de alta montaña más meridional del
      país. En su ladera este, la más empinada, queda el último glaciar al sur: el de Helags.
    landscape: >-
      Helags no se parece a las montañas suaves de alrededor. Tiene un perfil marcado y cae a pico sobre una
      alta meseta, en tierra sin carreteras, a unos veinte kilómetros al noroeste de Ljungdalen. En el flanco
      más empinado, el este, se aloja el glaciar de Helags, de seiscientos metros de largo y un espesor máximo
      estimado de cincuenta. Es un glaciar de nicho: nació de un nevero permanente en una hondonada de la
      ladera. Cuando se cartografió en 2008 medía casi medio kilómetro cuadrado, 0,48 km².


      Bajo la cima hay un circo central: en invierno desde allí se ve de cerca el glaciar, y en verano los
      lagos que forma el agua de deshielo. El nombre, Helags, viene del nórdico antiguo *helag*, que significa
      aproximadamente sagrado.
    wildlife: >-
      El animal de Helags es el [zorro ártico](/especie/vulpes_lagopus/). A pesar de la altura, los veranos
      son sorprendentemente ricos en flores, y Helags es uno de los mayores reductos del zorro ártico, especie
      amenazada, en Suecia. La otra presencia es el [reno](/especie/rangifer_tarandus/): la zona es terreno de
      pastoreo de renos del poblado sami de Mittådalen, y por eso las ascensiones guiadas a la cima solo se
      ofrecen en febrero y marzo, para no molestar a los rebaños.


      La vegetación cambia con la altitud. Hacia Ljungdalen, el sendero atraviesa primero brezales secos y
      luego un bosque de abedul de montaña.
    visit: >-
      El punto de partida habitual es Kläppen, a unos 12 km de la estación de montaña de Helags, con un
      sendero señalizado de tres o cuatro horas. En coche se aparca en Kläppen, a unos seis kilómetros de
      Ljungdalen, o en Torkilstöten, desde donde un remonte sube a la meseta. Sin coche, el transporte público
      llega a Ljungdalen y desde allí un taxi conecta con el inicio del sendero.


      La estación de montaña de Helags, en terreno sin carreteras al pie del macizo, es el punto de apoyo. Ya
      en 1897 se construyó aquí la primera cabaña para facilitar la subida a la cima, de 750 metros de
      desnivel.


      Desde la estación hay varias salidas. La excursión clásica sube a la cima si el tiempo lo permite, y
      aunque cambie se llega a la meseta o circo central. El sendero a la cabaña Fältjägaren cruza a los seis
      kilómetros el antiguo camino de peregrinos entre Jämtland y Noruega, que desde la Edad Media lleva a
      Nidaros, hoy Trondheim. Si se prefiere una travesía, el tramo Sylarna–Helags mide 19 km y lleva de seis
      a siete horas. Y la subida a Jalkedsåajja ofrece vistas de Krusetjärnarna, Gåsen, Härjångsåsen y Stora
      Härjångsstöten.
    history: >-
      La primera ascensión de la que hay constancia se hizo en 1868: el geólogo Edvard Erdmann subió a la cima
      con dos vecinos de Ljungdalen.


      La red estatal de senderos de montaña de Jämtland, con más de doscientas «mil» suecas, unos dos mil
      kilómetros, de rutas de verano y de invierno, la gestiona la Länsstyrelsen, que se ocupa de su seguridad
      por encargo de la agencia ambiental sueca.
    before: >-
      Se recomienda mirar el anemómetro y la cámara web del Consejo de Seguridad de Montaña al planificar el
      viaje. A lo largo de las rutas estatales hay refugios de emergencia, casi todos con teléfono, pero no
      están pensados para pernoctar de forma planificada. En el mapa de montaña, las rutas de verano van con
      línea de puntos y las de invierno con línea discontinua.
    around: >-
      Helags no tiene vecinos cercanos registrados, pero comparte el zorro ártico, el reno y el paisaje de
      alta montaña con el [Parque Nacional de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/), el [Parque Nacional de
      Hardangervidda](/lugar/hardangervidda-national-park/), el [Parque Nacional de
      Padjelanta](/lugar/padjelanta-national-park/) y, con glaciares, el [Parque Nacional de
      Vatnajökull](/lugar/vatnajokulsthjodgardur/).
  en:
    intro: >-
      There is a point in Sweden south of which no higher mountain rises. It is Helags, known to the southern
      Sami as Maajåelkie: a 1,797 m peak in northwestern Härjedalen, close to the borders with Jämtland and
      Norway, rising abruptly some seven hundred metres above the plateau. It stands as Sweden's highest
      mountain south of the Arctic Circle and, together with Sylarna, forms the country's southernmost
      high-mountain alpine tract. On its steepest eastern flank clings Sweden's southernmost glacier:
      Helagsglaciären.
    landscape: >-
      Helags looks nothing like the rounded mountains around it. It has a sharp, jagged profile dropping sheer
      onto an upland plateau in roadless wilderness roughly twenty kilometres northwest of Ljungdalen. On its
      steepest flank, the eastern wall, nestles Helagsglaciären, six hundred metres long and with an estimated
      maximum thickness of fifty metres. It is a niche glacier born from a perennial snowfield tucked into a
      hollow on the slope. When mapped in 2008, it spanned nearly half a square kilometre, 0.48 km².


      Beneath the summit lies a central amphitheatre: in winter the glacier is viewed up close from here, and
      in summer it gathers meltwater lakes. The name Helags derives from Old Norse *helag*, meaning roughly
      holy or sacred.
    wildlife: >-
      The emblematic animal of Helags is the [Arctic fox](/especie/vulpes_lagopus/). Despite the high
      altitude, summers are surprisingly rich in alpine flowers, and Helags represents one of the largest
      sanctuaries for the threatened Arctic fox in Sweden. The other major presence is the
      [caribou](/especie/rangifer_tarandus/): the area serves as reindeer grazing territory for the Mittådalen
      Sami community, which is why guided ascents to the summit are only offered in February and March to
      avoid disturbing the herds.


      Vegetation changes with elevation. Heading towards Ljungdalen, the trail winds first through dry
      dwarf-shrub heath and then through subalpine mountain birch forest.
    visit: >-
      The customary starting point is Kläppen, roughly 12 km from Helags mountain station, along a waymarked
      path taking three to four hours. By car you park at Kläppen, about six kilometres from Ljungdalen, or at
      Torkilstöten where a ski lift ascends to the plateau. Without a car, public transport reaches
      Ljungdalen, from where a local taxi connects to the trailhead.


      Helags mountain station, set in roadless terrain at the foot of the massif, serves as basecamp. Back in
      1897 the first shelter was built here to facilitate the summit climb, tackling 750 metres of elevation
      gain.


      From the station several routes branch out. The classic outing ascends to the summit if weather allows;
      even in foul weather hikers can reach the plateau or central cirque. The trail to the Fältjägaren cabin
      crosses, after six kilometres, the ancient pilgrimage route between Jämtland and Norway, which has led
      to Nidaros (now Trondheim) since the Middle Ages. For a longer trek, the Sylarna–Helags leg covers 19 km
      taking six to seven hours. The ascent of Jalkedsåajja rewards you with sweeping views of Krusetjärnarna,
      Gåsen, Härjångsåsen and Stora Härjångsstöten.
    history: >-
      The first recorded ascent took place in 1868, when geologist Edvard Erdmann reached the summit
      accompanied by two local guides from Ljungdalen.


      Jämtland's state mountain trail network, spanning more than two hundred Swedish «mil»—around two
      thousand kilometres—of summer and winter routes, is managed by the County Administrative Board
      (Länsstyrelsen), which oversees trail safety on behalf of the Swedish Environmental Protection Agency.
    before: >-
      Consult the anemometer and webcam of the Mountain Safety Council when planning your expedition.
      Emergency shelters, most equipped with emergency telephones, line the state trails, but they are not
      intended for planned overnight stays. On mountain maps, summer trails appear as dotted lines and winter
      routes as dashed lines.
    around: >-
      Helags has no close catalogued neighbours in the atlas, but it shares the Arctic fox, reindeer and high
      alpine tundra with [Dovrefjell-Sunndalsfjella National
      Park](/lugar/dovrefjell-sunndalsfjella-national-park/), [Hardangervidda National
      Park](/lugar/hardangervidda-national-park/), [Padjelanta National
      Park](/lugar/padjelanta-national-park/) and, for glaciated terrain, [Vatnajökull National
      Park](/lugar/vatnajokulsthjodgardur/).
  fr:
    intro: >-
      Il existe en Suède un point au sud duquel aucune montagne ne s'élève davantage. C'est Helags, que les
      Samis du Sud nomment Maajåelkie : un sommet de 1 797 m dans le nord-ouest du Härjedalen, près des
      frontières avec le Jämtland et la Norvège, qui jaillit abruptement de quelque sept cents mètres
      au-dessus du plateau. C'est le sommet suédois le plus haut au sud du cercle polaire et, avec Sylarna, il
      forme le massif de haute montagne le plus méridional du pays. Sur sa face est, la plus raide, subsiste
      le dernier glacier du sud : celui d'Helags.
    landscape: >-
      Helags ne ressemble en rien aux crêtes arrondies d'alentour. Son profil déchiqueté plonge à pic sur un
      haut plateau, en pleine terre sauvage sans routes, à une vingtaine de kilomètres au nord-ouest de
      Ljungdalen. Sur le flanc le plus abrupt, le versant est, se niche le glacier d'Helags, long de six cents
      mètres avec une épaisseur maximale estimée à cinquante mètres. C'est un glacier de cirque né d'un névé
      permanent abrité dans une dépression. Lors de sa cartographie en 2008, il s'étendait sur près d'un
      demi-kilomètre carré, 0,48 km².


      Sous la cime s'ouvre un cirque central : en hiver on y contemple le glacier de près, et en été les
      laquets alimentés par la fonte des glaces. Le nom d'Helags provient du vieux norrois *helag*, signifiant
      approximativement sacré.
    wildlife: >-
      L'animal emblématique d'Helags est le [renard polaire](/especie/vulpes_lagopus/). En dépit de
      l'altitude, les étés sont étonnamment fleuris, et Helags constitue l'un des derniers grands refuges de
      ce canidé menacé en Suède. L'autre hôte régulier est le [renne](/especie/rangifer_tarandus/) : le
      secteur sert de zone de pâturage aux troupeaux de la communauté samie de Mittådalen, raison pour
      laquelle les ascensions guidées ne sont proposées qu'en février et mars afin de ne pas déranger les
      bêtes.


      La végétation s'étage avec l'altitude. En descendant vers Ljungdalen, le sentier traverse d'abord des
      landes rases de bruyères puis une ceinture de bouleaux subalpins.
    visit: >-
      Le départ habituel s'effectue à Kläppen, à environ 12 km de la station de montagne d'Helags, par un
      itinéraire balisé de trois à quatre heures. En voiture, stationnez à Kläppen, à six kilomètres de
      Ljungdalen, ou à Torkilstöten où un téléski permet de gagner le plateau. Sans véhicule, les transports
      en commun desservent Ljungdalen, d'où un taxi rejoint le point de départ.


      La station de montagne d'Helags, isolée sans accès routier au pied du massif, sert de base. Dès 1897, le
      premier refuge y fut édifié pour faciliter l'ascension du sommet, qui totalise 750 mètres de dénivelé.


      Plusieurs itinéraires partent du refuge. L'excursion classique gagne la cime par temps favorable ; si la
      météo se dégrade, l'étape au plateau ou au cirque central reste remarquable. Le chemin menant au refuge
      de Fältjägaren croise au bout de six kilomètres l'antique sentier des pèlerins reliant le Jämtland à la
      Norvège, menant depuis le Moyen Âge à Nidaros (Trondheim). Pour une traversée, l'étape Sylarna–Helags
      compte 19 km en six à sept heures. La montée à Jalkedsåajja offre un vaste panorama sur Krusetjärnarna,
      Gåsen, Härjångsåsen et Stora Härjångsstöten.
    history: >-
      La première ascension attestée remonte à 1868 : le géologue Edvard Erdmann atteignit la cime accompagné
      de deux habitants de Ljungdalen.


      Le réseau public de sentiers de montagne du Jämtland, totalisant plus de deux cents « mil »
      suédoises—environ deux mille kilomètres—d'itinéraires d'été et d'hiver, est géré par la Länsstyrelsen,
      qui veille à la sécurité des aménagements pour le compte de l'agence suédoise de l'environnement.
    before: >-
      Pensez à consulter l'anémomètre et la webcam du Conseil de sécurité montagnarde avant le départ. Le long
      des pistes de l'État se trouvent des abris de secours, presque tous pourvus d'un poste téléphonique,
      mais ils ne sont pas destinés aux nuitées planifiées. Sur la carte topographique, les sentiers d'été
      sont en pointillés et les pistes hivernales en tirets.
    around: >-
      Helags ne compte aucun site proche dans l'atlas, mais il partage le renard polaire, le renne et la haute
      montagne avec le [Parc national de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/), le [Parc national de
      Hardangervidda](/lugar/hardangervidda-national-park/), le [Parc national de
      Padjelanta](/lugar/padjelanta-national-park/) et, côté glaciers, le [Parc national du
      Vatnajökull](/lugar/vatnajokulsthjodgardur/).
  de:
    intro: >-
      Es gibt einen Punkt in Schweden, südlich dessen kein höherer Berg mehr aufragt. Es ist der Helags, von
      den Südsami Maajåelkie genannt: ein 1.797 m hoher Gipfel im Nordwesten von Härjedalen, nahe der Grenze
      zu Jämtland und Norwegen, der sich jäh rund siebenhundert Meter über die Hochebene erhebt. Er ist
      Schwedens höchster Berg südlich des Polarkreises und bildet zusammen mit Sylarna das südlichste
      Hochgebirge des Landes. An seiner steilsten Ostflanke liegt der südlichste Gletscher Schwedens: der
      Helagsglaciären.
    landscape: >-
      Der Helags ähnelt den sanften Kuppen ringsum in keiner Weise. Er besitzt ein markantes, schroffes Profil
      und bricht steil auf ein wegloses Hochplateau ab, rund zwanzig Kilometer nordwestlich von Ljungdalen. An
      der steilen Ostflanke schmiegt sich der Helagsgletscher an den Fels, sechshundert Meter lang und mit
      einer geschätzten Maximaltiefe von fünfzig Metern. Es ist ein Nischengletscher, der aus einem
      Altschneefeld in einer Karwanne hervorging. Bei der Vermessung im Jahr 2008 maß er knapp einen halben
      Quadratkilometer, 0,48 km².


      Unterhalb des Gipfels liegt ein zentraler Karboden: Im Winter blickst du von dort aus nächster Nähe auf
      das Gletschereis, im Sommer auf Schmelzwasserseen. Der Name Helags stammt vom altnordischen *helag*, was
      heilig bedeutet.
    wildlife: >-
      Das Symboltier des Helags ist der [Polarfuchs](/especie/vulpes_lagopus/). Trotz der extremen Lage sind
      die Sommer überraschend blütenreich, und der Helags zählt zu den wichtigsten Zufluchtsorten für den
      bedrohten Polarfuchs in Schweden. Die andere prägende Art ist das [Ren](/especie/rangifer_tarandus/):
      Das Gebiet dient der Samigemeinschaft Mittådalen als Weideland, weshalb geführte Gipfeltouren nur im
      Februar und März angeboten werden, um die Tiere nicht zu stören.


      Die Vegetation staffelt sich nach Höhenlagen. Talwärts nach Ljungdalen führt der Pfad zunächst durch
      karge Zwergstrauchheiden und geht dann in Fjällbirkenwälder über.
    visit: >-
      Der gewöhnliche Ausgangspunkt ist Kläppen, etwa 12 km von der Bergstation Helags entfernt, auf einem
      markierten Pfad von drei bis vier Stunden. Mit dem Auto parkst du in Kläppen, sechs Kilometer von
      Ljungdalen, oder in Torkilstöten mit Liftauffahrt zur Hochebene. Ohne Pkw fahren öffentliche
      Verkehrsmittel nach Ljungdalen, von wo aus ein Zubringertaxi zum Wanderstart verkehrt.


      Die Bergstation Helags, ohne Straßenanbindung am Fuße des Massivs gelegen, dient als Quartier. Bereits
      1897 entstand hier die erste Hütte, um den Gipfelanstieg über 750 Höhenmeter zu erleichtern.


      Von der Station aus verzweigen sich verschiedene Touren. Der Klassiker führt bei gutem Wetter zum
      Gipfel, bei Umschwung bleibt das Hochplateau lohnend. Der Weg zur Hütte Fältjägaren kreuzt nach sechs
      Kilometern den alten Pilgerweg zwischen Jämtland und Norwegen, der seit dem Mittelalter nach Nidaros
      (Trondheim) zieht. Auf Fernwanderungen misst die Etappe Sylarna–Helags 19 km bei sechs bis sieben
      Stunden. Der Anstieg zum Jalkedsåajja bietet Blicke auf Krusetjärnarna, Gåsen, Härjångsåsen und Stora
      Härjångsstöten.
    history: >-
      Die erste belegte Besteigung fand 1868 statt, als der Geologe Edvard Erdmann den Gipfel mit zwei
      Begleitern aus Ljungdalen erklomm.


      Das staatliche Wegenetz in Jämtland mit über zweihundert schwedischen «Mil»—rund zweitausend
      Kilometern—an Sommer- und Winterrouten wird von der Länsstyrelsen instand gehalten, die im Auftrag der
      schwedischen Umweltbehörde für Wegesicherheit sorgt.
    before: >-
      Prüfe vor deiner Tour Windmesser und Webcams des Bergsicherheitsrats. Entlang der Routen stehen
      Nothütten mit Notruftelefonen, die jedoch nicht für geplante Übernachtungen gedacht sind. Auf
      Fjällkarten sind Sommerwege gepunktet und Winterrouten gestrichelt dargestellt.
    around: >-
      Helags besitzt keine nahen Nachbarn im Atlas, teilt aber Polarfuchs, Ren und arktische Tundra mit dem
      [Nationalpark Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/), dem
      [Nationalpark Hardangervidda](/lugar/hardangervidda-national-park/), dem [Nationalpark
      Padjelanta](/lugar/padjelanta-national-park/) und, bezüglich Gletscherwelten, dem [Nationalpark
      Vatnajökull](/lugar/vatnajokulsthjodgardur/).
  it:
    intro: >-
      C'è un punto in Svezia a sud del quale non sorge alcuna montagna più alta. È l'Helags, chiamato dai Sami
      meridionali Maajåelkie: una vetta di 1.797 m nel nord-ovest dell'Härjedalen, a ridosso del confine con
      lo Jämtland e la Norvegia, che svetta improvvisa di circa settecento metri sopra l'altopiano. È la cima
      più elevata della Svezia a sud del circolo polare e, assieme al Sylarna, costituisce l'area d'alta quota
      più meridionale del paese. Sul suo versante orientale, il più scosceso, resiste l'ultimo ghiacciaio a
      sud: l'Helagsglaciären.
    landscape: >-
      L'Helags non somiglia affatto ai rilievi arrotondati circostanti. Sfoggia un profilo aspro e strapiomba
      su un altopiano desolato e privo di strade, a una ventina di chilometri a nord-ovest di Ljungdalen. Sul
      versante più ripido, quello orientale, si adagia il ghiacciaio di Helags, lungo seicento metri e con uno
      spessore massimo stimato di cinquanta. È un ghiacciaio di nicchia formatosi da un nevaio perenne
      incassato nella parete. Quando fu mappato nel 2008 copriva quasi mezzo chilometro quadrato, 0,48 km².


      Sotto la vetta si apre un circo centrale: d'inverno da lì si osserva il ghiacciaio da vicino, mentre
      d'estate si formano laghetti di fusione. Il toponimo Helags deriva dall'antico norreno *helag*, che
      significa sacro.
    wildlife: >-
      L'animale simbolo dell'Helags è la [volpe artica](/especie/vulpes_lagopus/). Nonostante l'altitudine, le
      estati sono sorprendentemente ricche di fioriture, e l'Helags rappresenta uno dei principali baluardi
      della volpe artica in Svezia. L'altra presenza costante è la [renna /
      caribù](/especie/rangifer_tarandus/): l'area è terra di pascolo per le mandrie della comunità sami di
      Mittådalen, motivo per cui le salite guidate alla cima si effettuano solo a febbraio e marzo per non
      disturbare gli animali.


      La vegetazione muta con la quota. Scendendo verso Ljungdalen, il cammino attraversa dapprima brughiere
      aride e poi fitti boschi di betulla montana.
    visit: >-
      Il consueto punto di partenza è Kläppen, a circa 12 km dal rifugio alpino di Helags, lungo un sentiero
      segnato di tre o quattro ore. In auto si parcheggia a Kläppen, a sei chilometri da Ljungdalen, o a
      Torkilstöten dove uno skilift sale all'altopiano. Senza automobile, i trasporti pubblici arrivano a
      Ljungdalen e da lì un taxi conduce all'attacco del sentiero.


      Il rifugio STF di Helags, isolato ai piedi del massiccio, funge da punto d'appoggio. Già nel 1897 fu
      eretta qui la prima capanna per agevolare l'ascesa alla cima, superando 750 metri di dislivello.


      Dal rifugio si diramano vari percorsi. L'escursione classica punta alla vetta se il meteo è favorevole;
      in caso di maltempo si può raggiungere l'altopiano o il circo centrale. Il tracciato per la capanna
      Fältjägaren interseca dopo sei chilometri l'antica via dei pellegrini tra Jämtland e Norvegia, che dal
      Medioevo conduce a Nidaros (Trondheim). Se preferisci una traversata, la tappa Sylarna–Helags copre 19
      km in sei-sette ore. La salita al Jalkedsåajja offre scorci su Krusetjärnarna, Gåsen, Härjångsåsen e
      Stora Härjångsstöten.
    history: >-
      La prima ascensione documentata avvenne nel 1868: il geologo Edvard Erdmann salì in cima assieme a due
      abitanti di Ljungdalen.


      La rete pubblica di sentieri di montagna dello Jämtland, con oltre duecento «mil» svedesi—circa duemila
      chilometri—di percorsi estivi e invernali, è gestita dalla Länsstyrelsen, responsabile della sicurezza
      per conto dell'agenzia ambientale svedese.
    before: >-
      Consulta anemometro e webcam del Consiglio per la Sicurezza in Montagna prima di partire. Lungo i
      percorsi statali sono dislocati bivacchi di emergenza muniti di telefono, ma non sono intesi per
      pernottamenti programmati. Sulla mappa escursionistica, i percorsi estivi sono a puntini e quelli
      invernali a tratteggio.
    around: >-
      L'Helags non ha vicini catalogati nell'atlas, ma condivide la volpe artica, la renna e le tundre d'alta
      quota con il [Parco Nazionale di
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/), il [Parco Nazionale di
      Hardangervidda](/lugar/hardangervidda-national-park/), il [Parco Nazionale di
      Padjelanta](/lugar/padjelanta-national-park/) e, per i ghiacciai, con il [Parco Nazionale del
      Vatnajökull](/lugar/vatnajokulsthjodgardur/).
  pt:
    intro: >-
      Há um ponto na Suécia a sul do qual nenhuma montanha sobe mais alto. É o Helags, que os lapões do sul
      chamam Maajåelkie: um cume de 1.797 m no noroeste de Härjedalen, junto às fronteiras com Jämtland e com
      a Noruega, que se ergue subitamente cerca de setecentos metros acima do planalto. É a montanha mais alta
      da Suécia a sul do círculo polar e, com Sylarna, forma o maciço de alta montanha mais austral do país.
      Na sua encosta este, a mais abrupta, resiste o último glaciar a sul: o de Helags.
    landscape: >-
      O Helags em nada se assemelha às montanhas suaves em redor. Tem um perfil pontiagudo e cai a pique sobre
      um planalto elevado sem estradas, cerca de vinte quilómetros a noroeste de Ljungdalen. No flanco mais
      íngreme, o oriental, aninha-se o glaciar de Helags, com seiscentos metros de comprimento e espessura
      máxima estimada em cinquenta metros. É um glaciar de nicho nascido de um nevéu permanente numa cavidade
      da vertente. Quando foi cartografado em 2008 media quase meio quilómetro quadrado, 0,48 km².


      Sob o cume abre-se um circo central: no inverno avista-se dali o glaciar de perto, e no verão lagoas
      formadas pelo degelo. O nome Helags deriva do nórdico antigo *helag*, que significa sagrado.
    wildlife: >-
      O animal emblemático de Helags é a [raposa-do-ártico](/especie/vulpes_lagopus/). Apesar da altitude, os
      verões são surpreendentemente floridos, e Helags é um dos maiores redutos da raposa-do-ártico na Suécia.
      A outra grande presença é a [rena](/especie/rangifer_tarandus/): a área serve de pastagem para renas da
      comunidade sami de Mittådalen, razão pela qual as ascensões guiadas ao cume só se realizam em fevereiro
      e março para não perturbar os rebanhos.


      A vegetação muda com a altitude. Em direção a Ljungdalen, o trilho cruza primeiro charnecas secas e
      depois uma floresta de bétulas subalpinas.
    visit: >-
      O ponto de partida habitual é Kläppen, a cerca de 12 km da estação de montanha de Helags, através de um
      trilho marcado de três a quatro horas. De carro estaciona-se em Kläppen, a seis quilómetros de
      Ljungdalen, ou em Torkilstöten, de onde um teleférico sobe ao planalto. Sem carro, o transporte público
      chega a Ljungdalen, de onde um táxi assegura a ligação até ao início do caminho.


      A estação de montanha de Helags, situada em terreno sem estradas no sopé do maciço, é a base de apoio.
      Já em 1897 foi construída aqui a primeira cabana para facilitar a ascensão ao cume, com 750 metros de
      desnível.


      A partir da estação partem várias opções. A subida clássica atinge o cume se o tempo permitir; havendo
      nevoeiro alcança-se o planalto ou circo central. O caminho para a cabana Fältjägaren cruza ao fim de
      seis quilómetros a rota histórica de peregrinação entre Jämtland e a Noruega, que desde a Idade Média
      conduz a Nidaros (Trondheim). Para travessias, a etapa Sylarna–Helags mede 19 km e requer seis a sete
      horas. A subida a Jalkedsåajja oferece vistas para Krusetjärnarna, Gåsen, Härjångsåsen e Stora
      Härjångsstöten.
    history: >-
      A primeira ascensão registada realizou-se em 1868: o geólogo Edvard Erdmann atingiu o topo acompanhado
      por dois habitantes de Ljungdalen.


      A rede pública de trilhos de montanha de Jämtland, com mais de duzentas «mil» suecas—cerca de dois mil
      quilómetros—de itinerários de verão e de inverno, é gerida pela Länsstyrelsen, responsável pela
      segurança por delegação da agência ambiental sueca.
    before: >-
      Convém consultar o anemómetro e a webcam do Conselho de Segurança de Montanha ao planear a saída. Ao
      longo dos trilhos estatais existem abrigos de emergência equipados com telefone, mas não se destinam a
      pernoitas planeadas. No mapa de montanha, as rotas estivais surgem ponteadas e as de inverno tracejadas.
    around: >-
      Helags não tem vizinhos próximos catalogados no atlas, mas partilha a raposa-do-ártico, a rena e a
      paisagem alpina com o [Parque Nacional de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/), o [Parque Nacional de
      Hardangervidda](/lugar/hardangervidda-national-park/), o [Parque Nacional de
      Padjelanta](/lugar/padjelanta-national-park/) e, com glaciares, o [Parque Nacional de
      Vatnajökull](/lugar/vatnajokulsthjodgardur/).
