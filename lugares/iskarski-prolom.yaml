resumen:
  es: >-
    Garganta meandriforme de 65 km que atraviesa de sur a norte toda la cadena de Stara Planina cortando
    estratos calizos.
  en: >-
    A 65 km winding gorge that cuts south to north right through the entire Stara Planina range, slicing
    through limestone strata.
  fr: >-
    Gorge méandrique de 65 km traversant du sud au nord toute la chaîne du Grand Balkan en entaillant des
    strates calcaires.
  de: >-
    Eine 65 km lange gewundene Schlucht, die das gesamte Balkangebirge von Süd nach Nord durchbricht und
    Kalksteinschichten freilegt.
  it: >-
    Gola meandriforme di 65 km che incide da sud a nord l’intera catena dei Balcani tagliando profondi strati
    calcarei.
  pt: >-
    Garganta meândrica de 65 km que atravessa de sul a norte toda a cordilheira de Stara Planina cortando
    estratos calcários.
unico:
  es: >-
    Un río que atraviesa toda una cordillera y deja a su paso más de cien cuevas en los acantilados de
    Lakatnik y una planta cuya única población confirmada vive allí.
  en: >-
    A river that cleaves an entire mountain range, leaving over one hundred caves in the Lakatnik cliffs and a
    plant whose only confirmed population lives here.
  fr: >-
    Un fleuve qui traverse toute une chaîne et laisse plus de cent grottes dans les falaises de Lakatnik et
    une plante dont l’unique population vit ici.
  de: >-
    Ein Fluss, der eine ganze Gebirgskette spaltet, über hundert Höhlen in den Felsen von Lakatnik hinterlässt
    und einer weltweit einzigartigen Pflanze Zuflucht bietet.
  it: >-
    Un fiume che trapassa un’intera catena montuosa aprendo oltre cento grotte nelle falesie di Lakatnik e
    rifugio per una pianta endemica esclusiva.
  pt: >-
    Um rio que rasga uma cordilheira inteira deixando mais de cem grutas nas escarpas de Lakatnik e o reduto
    de uma planta única no mundo.
observaciones:
  es: >-
    La cueva Temnata Dupka solo se visita con guía y equipo. Las cuevas de la zona no están acondicionadas. La
    mejor época es primavera y otoño.
texto:
  es:
    intro: >-
      Hasta finales del siglo XIX el Iskar era casi un camino cerrado. El río corta de sur a norte los montes
      Balcanes y une la cuenca de Sofía con la llanura del Danubio, pero su desfiladero era casi intransitable
      y apenas se usaba, hasta que llegó el ferrocarril. Hoy ese tajo, el Iskarski prolom, se recorre en tren
      por casi ochenta kilómetros de la línea Sofía-Mezdra, entre paredes que en algunos puntos rozan los 300
      metros. Es un desfiladero que empieza al norte de Novi Iskar, a 520 m de altitud, y acaba al sur de
      Mezdra, a 210 m.
    landscape: >-
      El Iskar no esquivó los Balcanes: los cortó. Es lo que se llama un valle antecedente, el río fue
      excavando su cauce a medida que la cordillera se levantaba. En el Cuaternario fue dejando terrazas, seis
      o siete, de las que la más alta y antigua queda a 110-120 metros sobre el agua, y algunas coinciden con
      las salidas de las numerosas cuevas de las laderas. Las paredes son de caliza y arenisca, labradas
      durante miles de años hasta formar riscos y torres.


      El valle cambia de carácter. Al norte de la estación de Bov se estrecha y en algunos puntos, como en
      Lakatnik, parece un cañón. Allí está el recodo del río que dio nombre a la región, porque recuerda un
      codo doblado. Sobre él se alzan los acantilados de arenisca y caliza de Lakatnik, de unos 250 metros,
      donde el viento ha tallado torres, agujas y pirámides.
    wildlife: >-
      En Lakatnik vive una planta que no se conoce en ningún otro sitio: Silene velcevii, cuya única población
      confirmada se conserva en estas rocas. Fue una de las razones por las que los acantilados se declararon
      área protegida en 1966.


      El desfiladero queda, en un tramo, dentro del parque natural Vrachanski Balkan. En el conjunto del
      parque viven 22 de las 33 especies de murciélagos de Bulgaria, más de 180 especies de aves, el tejón, la
      [nutria](/especie/lutra_lutra/), el [gato montés](/especie/felis_silvestris/) y el
      [corzo](/especie/capreolus_capreolus/), y la Silene velcevii y la Centranthus kellereri reúnen allí
      cerca de la mitad de su población mundial. Bajo tierra, la cueva Temnata Dupka alberga 17 troglobios:
      caracoles acuáticos, crustáceos inferiores y escarabajos.


      Los mejores momentos son la primavera y el otoño. Los senderos junto a los acantilados se pueden
      recorrer todo el año, con vistas al desfiladero.
    visit: >-
      Un tren cruza el desfiladero, y una carretera lo sigue en paralelo, de modo que llegar es fácil. Para
      ver los acantilados de Lakatnik, la senda de acceso arranca en el manantial de Zhitolyub, junto a la
      estación de Lakatnik. Otros puntos de interés son la cascada de Bovska Skakalya, cerca de Zasele, la
      zona de cuevas de Zimevitsa y los Ritlite, paredes verticales al oeste de Lyutibrod.


      Las cuevas de la zona están sin acondicionar y solo se exploran con equipo y un guía con experiencia. Es
      el caso de Temnata Dupka, la tercera cueva más larga de Bulgaria, con nueve kilómetros de galerías, un
      laberinto de entradas, cascadas, rápidos, sumideros, ríos subterráneos y lagos. Está a unos 52 km al
      norte de Sofía y a 27 metros sobre el Iskar. No está adaptada para turistas, así que hay que ir con guía
      y equipo adecuado. Entre las otras cuevas figuran Kozarska, Zidanka, Rashishka y Svinska.
    history: >-
      Los acantilados de Lakatnik se protegieron en 1966 para conservar el paisaje, las rocas, las cuevas y
      las especies. La Temnata Dupka se declaró monumento natural el 10 de octubre de 1962.
    before: >-
      La cueva Temnata Dupka solo se visita con guía y equipo. Las cuevas de la zona no están acondicionadas.
      La mejor época es primavera y otoño.
  en:
    intro: >-
      Until the late nineteenth century the Iskar was virtually an impassable barrier. The river cuts south to
      north across the Balkan Mountains, linking the Sofia basin with the Danubian Plain, yet its gorge was
      nearly impenetrable and barely used until the arrival of the railway. Today this deep trench, the
      Iskarski prolom, can be travelled by train for nearly eighty kilometres along the Sofia–Mezdra line,
      between cliffs that in places soar close to 300 metres. The gorge begins north of Novi Iskar at 520 m
      altitude and ends south of Mezdra at 210 m.
    landscape: >-
      The Iskar did not circumvent the Balkans: it sliced right through them. It is what geologists call an
      antecedent river, cutting down its bed as the mountain chain uplifted. Over the Quaternary period it
      carved six or seven alluvial terraces, the highest and oldest standing 110–120 metres above the current
      water level, several coinciding with cave entrances along the slopes. The canyon walls are formed of
      limestone and sandstone, weathered over millennia into crags and spires.


      The valley shifts in character. North of Bov station it constricts, narrowing at Lakatnik into a
      dramatic chasm. Here lies the sharp river bend that gave the region its name, resembling a bent elbow
      (lakat). Above it loom the sandstone and limestone Lakatnik cliffs, rising some 250 metres, where wind
      and frost have sculpted rock towers, needles, and pyramids.
    wildlife: >-
      Lakatnik shelters a botanical rarity found nowhere else on Earth: Silene velcevii, whose sole confirmed
      population clings to these cliffs. This was a key motivation for declaring the crags a protected natural
      site in 1966.


      A section of the gorge falls within Vrachanski Balkan Nature Park. Across the park live 22 of Bulgaria’s
      33 bat species, more than 180 bird species, European badger, [Eurasian otter](/especie/lutra_lutra/),
      [European wildcat](/especie/felis_silvestris/), and [roe deer](/especie/capreolus_capreolus/). Silene
      velcevii and Centranthus kellereri concentrate nearly half of their world populations here.
      Subterraneously, the Temnata Dupka cave harbours 17 obligate troglobite species, including aquatic
      snails, primitive crustaceans, and cave beetles.


      The finest seasons are spring and autumn. Footpaths skirting the cliffs remain walkable throughout the
      year, offering panoramic views over the gorge.
    visit: >-
      A railway line threads the entire gorge, paralleled by a scenic road, making access very
      straightforward. To explore the Lakatnik cliffs, the hiking trail begins at the Zhitolyub karst spring
      beside Lakatnik station. Other highlights include the Bovska Skaklya waterfall near Zasele, the
      Zimevitsa cave area, and the Ritlite, vertical stone fins rising west of Lyutibrod.


      Caves in the area remain wild and undeveloped, requiring proper equipment and an experienced caving
      guide. Notable among them is Temnata Dupka, the third longest cave in Bulgaria, spanning nine kilometres
      of galleries with a labyrinth of chambers, waterfalls, rapids, siphons, underground streams, and
      subterranean lakes. Located some 52 km north of Sofia and 27 metres above the Iskar, it is entirely
      unlit and wild. Other caves include Kozarska, Zidanka, Rashishka, and Svinska.
    history: >-
      The Lakatnik cliffs were protected in 1966 to preserve their dramatic geology, rock towers, caves, and
      endemic flora. Temnata Dupka was declared a natural monument on 10 October 1962.
    before: >-
      Temnata Dupka cave can only be explored with an experienced guide and specialized caving gear.
      Surrounding caves are completely undeveloped. The best hiking seasons are spring and autumn.
  fr:
    intro: >-
      Jusqu’à la fin du XIXe siècle, l’Iskar était presque une voie condamnée. Le cours d’eau traverse du sud
      au nord les monts Balkans pour relier le bassin de Sofia à la plaine danubienne, mais son défilé était
      quasi impraticable jusqu’à l’arrivée du chemin de fer. Aujourd’hui, cette brèche, l’Iskarski prolom, se
      parcourt en train sur près de quatre-vingts kilomètres le long de la ligne Sofia–Mezdra, entre des
      parois frôlant par endroits 300 mètres de hauteur. Ce défilé débute au nord de Novi Iskar à 520 m
      d’altitude pour finir au sud de Mezdra à 210 m.
    landscape: >-
      L’Iskar n’a pas contourné les Balkans : il les a tranchés. C’est une vallée dite antécédente, la rivière
      ayant creusé son lit au rythme du soulèvement de la montagne. Au Quaternaire, elle a étagé six ou sept
      terrasses alluviales, dont la plus haute domine l’eau de 110-120 mètres, plusieurs coïncidant avec des
      entrées de grottes. Les falaises de calcaire et de grès ont été sculptées par les siècles en aiguilles
      et pitons.


      La vallée change d’aspect. Au nord de la gare de Bov, elle se resserre et prend à Lakatnik des allures
      de canyon. C’est là que se trouve le coude fluvial qui a donné son nom au site (lakat signifiant coude).
      Au-dessus s’élèvent les falaises de grès et de calcaire de Lakatnik, hautes d’environ 250 mètres, où le
      vent a taillé des tours, des flèches et des pyramides.
    wildlife: >-
      À Lakatnik vit une rareté botanique inconnue partout ailleurs : Silene velcevii, dont l’unique
      population confirmée subsiste sur ces parois. Ce fut l’une des raisons majeures du classement des
      falaises en aire protégée en 1966.


      Une partie du défilé s’intègre dans le parc naturel Vrachanski Balkan. L’ensemble du parc accueille 22
      des 33 espèces de chauves-souris de Bulgarie, plus de 180 espèces d’oiseaux, le blaireau, la [loutre
      d’Europe](/especie/lutra_lutra/), le [chat sauvage](/especie/felis_silvestris/) et le
      [chevreuil](/especie/capreolus_capreolus/), tandis que Silene velcevii et Centranthus kellereri y
      concentrent près de la moitié de leurs effectifs mondiaux. Sous terre, la grotte Temnata Dupka héberge
      17 troglobies stricts : escargots aquatiques, crustacés primitifs et coléoptères cavernicoles.


      Les saisons idéales sont le printemps et l’automne. Les sentiers longeant les falaises restent
      accessibles toute l’année avec des vues spectaculaires sur la gorge.
    visit: >-
      Une voie ferrée traverse le défilé, doublée d’une route panoramique, rendant l’accès très commode. Pour
      admirer les falaises de Lakatnik, le sentier s’élance depuis la source karstique de Zhitolyub, près de
      la gare de Lakatnik. Les autres curiosités incluent la cascade Bovska Skaklya près de Zasele, le secteur
      des grottes de Zimevitsa et les Ritlite, d’impressionnantes lames de calcaire dressées à l’ouest de
      Lyutibrod.


      Les grottes de la zone sont sauvages et nécessitent matériel et guide expérimenté. C’est le cas de
      Temnata Dupka, la troisième plus longue grotte de Bulgarie avec neuf kilomètres de galeries, réseau
      complexe de cascades souterraines, siphons et lacs. Située à 52 km au nord de Sofia et 27 mètres
      au-dessus de l’Iskar, elle est dépourvue d’aménagements. Parmi les cavités voisines figurent Kozarska,
      Zidanka, Rashishka et Svinska.
    history: >-
      Les falaises de Lakatnik ont été protégées en 1966 pour sauvegarder leur géologie remarquable, leurs
      pitons et leur flore endémique. Temnata Dupka a été classée monument naturel le 10 octobre 1962.
    before: >-
      La grotte Temnata Dupka ne se visite qu’avec un guide qualifié et un équipement spéléologique complet.
      Les cavités locales ne sont pas aménagées. Les meilleures saisons sont le printemps et l’automne.
  de:
    intro: >-
      Bis zum Ende des neunzehnten Jahrhunderts war der Iskar ein nahezu unpassierbarer Weg. Der Fluss
      schneidet von Süd nach Nord durch das Balkangebirge und verbindet das Sofia-Becken mit der
      Donautiefebene, doch seine Schlucht war kaum begehbar, bis die Eisenbahn gebaut wurde. Heute lässt sich
      dieser gewaltige Einschnitt, das Iskarski prolom, bequem per Zug auf fast achtzig Kilometern der Strecke
      Sofia–Mesdra bereisen, flankiert von Steilwänden, die stellenweise 300 Meter aufragen. Die Schlucht
      beginnt nördlich von Nowi Iskar auf 520 m Höhe und endet südlich von Mesdra auf 210 m.
    landscape: >-
      Der Iskar wich dem Balkangebirge nicht aus: er zersägte es. Es handelt sich um ein antezedentes Tal, in
      dem der Fluss sein Bett eintiefte, während sich das Gebirge allmählich heraushob. Im Quartär schuf er
      sechs bis sieben Flussterrassen, deren höchste 110-120 Meter über dem heutigen Flussbett liegt und an
      mehreren Stellen mit Höhleneingängen zusammenfällt. Die Schluchtwände aus Kalk- und Sandstein wurden
      über Jahrtausende zu bizarren Türmen und Zacken geformt.


      Das Tal wechselt seinen Charakter. Nördlich des Bahnhofs Bow verengt es sich und gleicht bei Lakatnik
      einer dramatischen Klamm. Hier liegt die charakteristische Flussschleife, die an einen gebeugten
      Ellbogen (lakat) erinnert. Darüber ragen die Sandstein- und Kalkfelsen von Lakatnik rund 250 Meter auf,
      aus denen Wind und Wetter Nadeln, Felsburgen und Pyramiden gemeißelt haben.
    wildlife: >-
      In Lakatnik wächst eine floristische Besonderheit, die nirgendwo sonst auf der Erde vorkommt: Silene
      velcevii, deren einzig bestätigte Weltpopulation an diesen Felsen siedelt. Dies war einer der
      Hauptgründe, die Felswände 1966 unter Schutz zu stellen.


      Ein Teil der Schlucht liegt im Naturpark Wrazianski Balkan. Im gesamten Park leben 22 der 33
      Fledermausarten Bulgariens, über 180 Vogelarten, Dachs, [Eurasischer Fischotter](/especie/lutra_lutra/),
      [Wildkatze](/especie/felis_silvestris/) und [Reh](/especie/capreolus_capreolus/), während Silene
      velcevii und Centranthus kellereri rund die Hälfte ihrer weltweiten Bestände hier konzentrieren. Unter
      Tage beherbergt die Höhle Temnata Dupka 17 echte Troglobionten: Wasserschnecken, niedere Krebstiere und
      Höhlenkäfer.


      Die schönsten Jahreszeiten sind Frühling und Herbst. Die Wanderwege oberhalb der Felsabstürze sind
      ganzjährig begehbar und bieten weite Tiefblicke auf den Schluchtverlauf.
    visit: >-
      Eine Bahnlinie und eine parallel verlaufende Straße durchziehen die Schlucht, sodass die Anreise
      unkompliziert ist. Zu den Felsen von Lakatnik führt ein Pfad ab der Karstquelle Schitoljub nahe dem
      Bahnhof Lakatnik. Weitere Sehenswürdigkeiten sind der Wasserfall Bowska Skakalja bei Sasele, das
      Höhlengebiet Simewiza sowie die Ritlite, markante senkrechte Kalksteinrippen westlich von Ljutibrod.


      Die Höhlen der Region sind unerschlossen und nur mit Höhlenausrüstung und ortskundiger Führung
      befahrbar. Das gilt insbesondere für Temnata Dupka, die drittlängste Höhle Bulgariens mit neun
      Kilometern Gängen, einem Labyrinth aus Wasserfällen, Siphons und unterirdischen Seen. Sie liegt rund 52
      km nördlich von Sofia und 27 Meter über dem Iskar. Sie ist nicht touristisch ausgebaut. Weitere Höhlen
      sind Kosarska, Sidanka, Raschischka und Swinska.
    history: >-
      Die Felsen von Lakatnik wurden 1966 zum Schutz der Landschaft, der Felsformationen, Höhlen und seltenen
      Pflanzenarten ausgewiesen. Die Höhle Temnata Dupka wurde am 10. Oktober 1962 zum Naturdenkmal erklärt.
    before: >-
      Die Höhle Temnata Dupka darf nur mit Führung und angemessener Ausrüstung betreten werden. Die Höhlen
      sind nicht ausgebaut. Die beste Wanderzeit liegt im Frühling und Herbst.
  it:
    intro: >-
      Fino alla fine dell’Ottocento l’Iskar rappresentava una via quasi impraticabile. Il fiume fende da sud a
      nord i monti Balcani collegando la conca di Sofia con il bassopiano danubiano, ma la sua forra risultava
      quasi inaccessibile fino alla posa della ferrovia. Oggi questa profonda incisione, l’Iskarski prolom, si
      percorre in treno per quasi ottanta chilometri lungo la linea Sofia–Mezdra, tra pareti che sfiorano in
      più punti i 300 metri di dislivello. La gola ha inizio a nord di Novi Iskar a 520 m di quota per
      terminare a sud di Mezdra a 210 m.
    landscape: >-
      L’Iskar non ha aggirato i Balcani: li ha recisi di netto. È una tipica valle antecedente, con il fiume
      che scavava il proprio alveo mentre il massiccio montuoso si sollevava. Nel Quaternario ha inciso sei o
      sette terrazzi fluviali, il più alto dei quali sovrasta il corso d’acqua di 110-120 metri, spesso in
      corrispondenza degli accessi a cavità carsiche. Le pareti di calcare e arenaria sono state modellate nei
      millenni in torrioni e guglie aguzze.


      La valle muta continuamente fisionomia. A nord della stazione di Bov si stringe trasformandosi a
      Lakatnik in una vera forra. Qui si trova la marcata ansa fluviale che ricorda un gomito piegato (lakat),
      da cui deriva il toponimo. Sopra di essa si stagliano le rupi di arenaria e calcare di Lakatnik per
      circa 250 metri d’altezza, intagliate dal vento in piramidi e pinnacoli.
    wildlife: >-
      A Lakatnik vegeta un tesoro botanico unico al mondo: la Silene velcevii, la cui unica popolazione
      documentata resiste aggrappata a queste falesie. È stata una delle ragioni primarie della tutela
      istituita nel 1966.


      Un tratto della forra ricade entro il parco naturale Vrachanski Balkan. Nell’intera area protetta vivono
      22 delle 33 specie di pipistrelli bulgare, oltre 180 specie d’uccelli, il tasso, la [lontra
      europea](/especie/lutra_lutra/), il [gatto selvatico](/especie/felis_silvestris/) e il
      [capriolo](/especie/capreolus_capreolus/), mentre la Silene velcevii e la Centranthus kellereri vi
      concentrano circa metà dei loro esemplari planetari. Nel sottosuolo, la grotta di Temnata Dupka ospita
      17 troglobi obbligati, tra gasteropodi acquatici, crostacei arcaici e coleotteri ciechi.


      I periodi più favorevoli sono la primavera e l’autunno. I sentieri che costeggiano le creste rocciose
      restano accessibili durante tutto l’anno con magnifici affacci sulla gola.
    visit: >-
      Una ferrovia percorre per intero la forra, affiancata da una strada panoramica che ne rende agevole
      l’accesso. Per esplorare le falesie di Lakatnik, la traccia escursionistica prende avvio dalla sorgente
      carsica di Zhitolyub, accanto alla stazione di Lakatnik. Altre mete di rilievo sono la cascata di Bovska
      Skaklya presso Zasele, l’area speleologica di Zimevitsa e i Ritlite, impressionanti muraglie calcaree
      verticali a ovest di Lyutibrod.


      Le grotte della zona sono totalmente selvagge ed esplorabili unicamente con casco, torcia e guida
      esperta. Tra queste spicca Temnata Dupka, terza cavità più estesa della Bulgaria con nove chilometri di
      gallerie, cascate sotterranee, sifoni e laghetti interni. Dista circa 52 km a nord di Sofia e si apre a
      27 metri sopra il livello dell’Iskar. Non è attrezzata per il turismo comune. Altre cavità comprendono
      Kozarska, Zidanka, Rashishka e Svinska.
    history: >-
      Le falesie di Lakatnik sono state poste sotto tutela nel 1966 per salvaguardare geomorfologia,
      formazioni rocciose, cavità e specie endemiche. Temnata Dupka è stata proclamata monumento naturale il
      10 ottobre 1962.
    before: >-
      La grotta Temnata Dupka è accessibile unicamente con guida esperta e attrezzatura speleologica adeguata.
      Le cavità locali non presentano allestimenti turistici. Le stagioni più indicate sono primavera e
      autunno.
  pt:
    intro: >-
      Até finais do século XIX o Iskar era praticamente uma barreira intransitável. O rio rasga de sul a norte
      os montes Balcãs ligando a bacia de Sófia à planície do Danúbio, mas o seu desfiladeiro era de travessia
      penosa até à chegada da ferrovia. Hoje este corte imponente, o Iskarski prolom, pode ser percorrido de
      comboio ao longo de quase oitenta quilómetros da linha Sófia–Mezdra, entre escarpas que atingem em
      certos pontos 300 metros de altura. O desfiladeiro tem início a norte de Novi Iskar a 520 m de altitude
      e termina a sul de Mezdra a 210 m.
    landscape: >-
      O Iskar não contornou os Balcãs: cortou-os de alto a baixo. Trata-se de um vale antecedente, tendo o rio
      cavado o leito à medida que a montanha se erguia. Durante o Quaternário esculpiu seis ou sete terraços
      aluviais, situando-se o mais antigo e elevado a 110-120 metros acima das águas, vários deles coincidindo
      com entradas de grutas. As paredes de calcário e arenito foram talhadas pela erosão em agulhas e
      torreões escarpados.


      O vale ganha contornos distintos ao longo do percurso. A norte da estação de Bov aperta-se,
      assemelhando-se em Lakatnik a um canhão imponente. Aí desenha-se a curva apertada do rio em forma de
      cotovelo (lakat), que deu o nome à localidade. Sobre ela elevam-se as falesias de arenito e calcário de
      Lakatnik, com cerca de 250 metros, onde o vento e o gelo esculpiram colunas, agulhas e pirâmides.
    wildlife: >-
      Em Lakatnik habita uma raridade botânica sem paralelo noutros pontos do globo: Silene velcevii, cuja
      única população confirmada subsiste nestas rochas. Foi uma das razões decisivas para a classificação das
      escarpas como área protegida em 1966.


      Um troço do desfiladeiro integra o Parque Natural Vrachanski Balkan. No conjunto do parque vivem 22 das
      33 espécies de morcegos da Bulgária, mais de 180 espécies de aves, o texugo, a
      [lontra-europeia](/especie/lutra_lutra/), o [gato-bravo](/especie/felis_silvestris/) e a
      [corça](/especie/capreolus_capreolus/), acolhendo quase metade da população mundial de Silene velcevii e
      Centranthus kellereri. No subsolo, a gruta Temnata Dupka abriga 17 troglóbios obrigatórios: caracóis
      aquáticos, crustáceos arcaicos e escaravelhos cegos.


      As melhores épocas são a primavera e o outono. Os trilhos junto às cristas rochosas podem ser
      percorridos durante todo o ano, com panorâmicas soberbas sobre a garganta.
    visit: >-
      Uma linha de comboio percorre o desfiladeiro, acompanhada por uma estrada paralela, tornando o acesso
      simples. Para contemplar as escarpas de Lakatnik, o trilho pedestre tem início na nascente cársica de
      Zhitolyub, junto à estação de Lakatnik. Outros pontos de interesse são a cascata Bovska Skaklya perto de
      Zasele, o setor de grutas de Zimevitsa e os Ritlite, imponentes lâminas verticais de calcário a oeste de
      Lyutibrod.


      As grutas da região encontram-se no seu estado natural e só devem ser exploradas com equipamento
      adequado e guia experiente. É o caso de Temnata Dupka, a terceira maior gruta da Bulgária com nove
      quilómetros de galerias, cascatas subterrâneas, sifões e lagos escuros. Fica a cerca de 52 km a norte de
      Sófia e 27 metros acima do rio Iskar, desprovida de iluminação artificial. Outras cavidades incluem
      Kozarska, Zidanka, Rashishka e Svinska.
    history: >-
      As escarpas de Lakatnik foram colocadas sob proteção em 1966 para preservar a paisagem cársica, as
      formações rochosas, as grutas e a flora rara. Temnata Dupka foi declarada monumento natural a 10 de
      outubro de 1962.
    before: >-
      A gruta Temnata Dupka só pode ser visitada com equipamento de espeleologia e acompanhamento de guia
      especializado. As grutas locais não estão adaptadas ao turismo. As épocas mais favoráveis são a
      primavera e o outono.
