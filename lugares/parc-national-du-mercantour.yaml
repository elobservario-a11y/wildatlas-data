resumen:
  es: >-
    Lugar histórico del retorno natural del lobo a Francia desde Italia (1992), abarcando desde los Alpes
    hasta el Mediterráneo.
  en: >-
    Historic site of the natural return of the wolf to France from Italy (1992), spanning from the Alps to the
    Mediterranean.
  fr: >-
    Lieu historique du retour naturel du loup en France depuis l'Italie (1992), s'étendant des Alpes à la
    Méditerranée.
  de: >-
    Historischer Ort der natürlichen Rückkehr des Wolfes nach Frankreich aus Italien (1992), von den Alpen bis
    zum Mittelmeer reichend.
  it: >-
    Luogo storico del ritorno spontaneo del lupo in Francia dall'Italia (1992), esteso dalle Alpi fino al
    Mediterraneo.
  pt: >-
    Palco histórico do regresso natural do lobo a França a partir de Itália (1992), estendendo-se dos Alpes ao
    Mediterrâneo.
unico:
  es: >-
    En un mismo macizo conviven el lobo que volvió solo, unos 36 000 grabados de la Edad del Bronce en la
    vallée des Merveilles y más de 2 300 especies de plantas, más de cien de ellas endémicas.
  en: >-
    Within a single massif coexist the wolf that returned on its own, some 36,000 Bronze Age rock engravings
    in the vallée des Merveilles, and over 2,300 plant species, more than one hundred of them endemic.
  fr: >-
    Au sein d'un même massif cohabitent le loup revenu de lui-même, quelque 36 000 gravures de l'âge du bronze
    dans la vallée des Merveilles et plus de 2 300 espèces végétales, dont plus d'une centaine endémiques.
  de: >-
    Im selben Massiv leben der selbstständig zurückgekehrte Wolf, rund 36 000 bronzezeitliche Felsgravuren im
    Vallée des Merveilles und über 2 300 Pflanzenarten, von denen mehr als hundert endemisch sind.
  it: >-
    Nello stesso massiccio convivono il lupo ritornato spontaneamente, circa 36 000 incisioni rupestri
    dell'età del bronzo nella vallée des Merveilles e oltre 2 300 specie di piante, con più di cento
    endemismi.
  pt: >-
    Num mesmo maciço convivem o lobo que regressou sozinho, cerca de 36 000 gravuras da Idade do Bronze na
    vallée des Merveilles e mais de 2 300 espécies de plantas, mais de cem delas endémicas.
observaciones:
  es: >-
    En la vallée des Merveilles, el GR 52 permite ver grabados desde el camino, pero salirse del sendero sin
    guía acreditado está prohibido. Grabar en la zona se considera dañar un sitio que es monumento histórico y
    zona central del parque nacional.


    Si miras al cielo, no te pierdas esto: en junio de 2026 todo el parque pasó a formar parte de la ampliada
    Reserva Internacional de Cielo Oscuro Alpes Azur Mercantour.
texto:
  es:
    intro: >-
      El 5 de noviembre de 1992, unos guardas del parque vieron dos lobos. Nadie los había soltado: habían
      llegado por su cuenta desde Italia, y con ellos el [lobo](/especie/canis_lupus/) volvía a Francia. El
      lugar donde pasó es el Parque Nacional del Mercantour, un macizo entre los Alpes Marítimos y los Alpes
      de Alta Provenza que va de las cumbres alpinas al Mediterráneo. Hoy comparte con Italia el seguimiento
      de sus animales y conserva lo que un día fue coto de caza de un rey.
    landscape: >-
      Todo lo que ves lo han tallado el hielo y el agua. Hasta principios del siglo XX, glaciares cubrían las
      alturas del macizo, y junto con los ríos modelaron los relieves y los valles. Por eso hay lagos de
      origen glaciar como el de Allos, a 2 230 metros, el mayor lago natural de alta montaña de Europa: ocupa
      un circo excavado por los glaciares cuaternarios del alto Verdon, está dominado por el monte Pelat y no
      tiene desagüe en superficie. Su agua sale por un paso subterráneo que acaba en la fuente del Chadoulin,
      y de ahí va a dar al Verdon.


      La roca cuenta lo mismo en dos tonos. El núcleo del macizo, junto a la frontera, es de rocas
      cristalinas, y lo rodean rocas sedimentarias. Seis valles principales lo recorren: Roya y Bévéra,
      Vésubie, Tinée, Haut-Var y Cians, Ubaye y Verdon. La zona central ocupa 68 500 hectáreas, y el punto más
      alto es la cima del Gélas, a 3 143 metros.


      Esa mezcla de rocas y de altitudes explica la flora. Los frondosos —roble pubescente, pino silvestre,
      encina— dan paso a las coníferas, con abeto, picea, alerce y pino cembro, hasta 2 200 metros, y más
      arriba empiezan las especies alpinas. Entre las plantas de área muy reducida están la saxífraga de
      flores numerosas, la fritilaria de Moggridge, la primavera de Allioni, la genciana de Liguria y la
      grasilla de Reichenbach. El macizo fue además refugio glaciar para especies alpinas, como la berardia
      lanosa. Junto al lago de Allos crecen pastos alpinos, amapola de los Alpes, rododendro ferrugíneo y
      alerces.
    wildlife: >-
      Camina con los oídos abiertos: en verano, los caminantes ven con facilidad
      [gamuzas](/especie/rupicapra_rupicapra/) —viven varios miles en el parque— y a menudo oyen silbar a las
      [marmotas](/especie/marmota_marmota/). Con suerte, [íbices](/especie/capra_ibex/) y muflones se dejan
      ver en las horas más frescas del día. Hay más de 8 000 gamuzas y 1 100 íbices, además de ciervos,
      jabalíes, corzos y multitud de marmotas.


      Los animales siguen un calendario que no entiende de fronteras. Los íbices pasan el verano en el
      Mercantour tras invernar en el Argentera, y los muflones hacen el trayecto contrario. Por eso el parque
      y su vecino italiano siguen juntos a los animales. Los íbices que llevan marcas en las orejas o collar
      sirven para entender esos movimientos, y el parque pide que se avise de cada observación: fecha, hora y
      lugar exacto.


      Arriba mandan las aves. El parque cuenta con 153 especies, y en él puedes observar el
      [quebrantahuesos](/especie/gypaetus_barbatus/), reintroducido desde 1993, el [águila
      real](/especie/aquila_chrysaetos/), el gallo lira, el lagópodo y, en altura, la chova piquigualda y la
      chova piquirroja. El quebrantahuesos sigue siendo vulnerable por lo pequeño de su población.


      Y está el lobo. Tras aquel primer avistamiento de 1992, el parque apoyó a los pastores con rediles
      nocturnos y perros patou de los Pirineos. En el rincón más discreto del macizo vive la [salamandra de
      Lanza](/especie/salamandra_lanzai/), de 15 cm: su distribución solo se conoce en parte y el parque pide
      a los excursionistas que, si la ven, anoten su posición y le hagan una foto.
    visit: >-
      El parque tiene 600 km de senderos balizados, entre ellos el GR 5, el GR 52A —el sendero panorámico del
      Mercantour, que cruza el valle de las Maravillas— y el GR 56.


      Para empezar suave, el lago de Allos: una hora de marcha ida y vuelta desde el aparcamiento de la meseta
      de Laus, y otra hora para rodearlo. Hay más lagos que visitar: Lauzanier, los de Vens, los de Morgon y
      los del valle de las Maravillas.


      Si lo tuyo es la historia, la vallée des Merveilles guarda unos 36 000 grabados rupestres prehistóricos
      del Neolítico y la Edad del Bronce antiguo. Están en siete valles altos a más de 2 000 m, en torno al
      monte Bégo, de 2 872 m. Lo ideal es empezar por el museo departamental de las Maravillas de Tende y
      después hacer una visita guiada. En Saint-Martin-Vésubie, además, un centro del lobo recibe visitantes.
    history: >-
      La protección viene de lejos. El corazón del macizo fue reserva real de caza en 1859, con Víctor Manuel
      II, y esa protección temprana es el origen del parque, creado en 1979. Desde 1987 está hermanado con el
      parque italiano Alpi Marittime, con el que comparte 33 km de frontera.


      Antes, el macizo ya tenía dueños humanos: alrededor del monte Bégo hay petroglifos picados en pizarra y
      granito, de finales del Neolítico y la Edad del Bronce, y la mayoría de los rebaños que suben hoy son
      trashumantes y solo pasan allí la época de pastos de verano. La oveja briguesa es una raza tradicional
      del territorio, hoy considerada amenazada. Más cerca en el tiempo, quedan vestigios militares de los
      siglos XVIII y XIX y de la Segunda Guerra Mundial, sobre todo alrededor del Authion y en el alto Tinée.


      La conservación sigue activa: en una translocación se desplazaron 19 íbices desde Vanoise a Vésubie para
      reforzar la diversidad genética de la población.
    before: >-
      En la vallée des Merveilles, el GR 52 permite ver grabados desde el camino, pero salirse del sendero sin
      guía acreditado está prohibido. Grabar en la zona se considera dañar un sitio que es monumento histórico
      y zona central del parque nacional.


      Si miras al cielo, no te pierdas esto: en junio de 2026 todo el parque pasó a formar parte de la
      ampliada Reserva Internacional de Cielo Oscuro Alpes Azur Mercantour.
    around: >-
      El [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) está a 1 km: es el
      parque italiano con el que el Mercantour comparte frontera y seguimiento de animales. A unos 20 km queda
      el [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/), y a 26 km el [Parco
      naturale del Monviso](/lugar/parco-naturale-del-monviso/).
  en:
    intro: >-
      On 5 November 1992, park rangers sighted two wolves. No one had released them: they had arrived on their
      own from Italy, and with them the [wolf](/especie/canis_lupus/) returned to France. The place where it
      happened is the Mercantour National Park, a massif between Alpes-Maritimes and Alpes-de-Haute-Provence
      stretching from alpine summits to the Mediterranean. Today it shares wildlife monitoring with Italy and
      preserves what was once a royal hunting preserve.
    landscape: >-
      Everything you see was carved by ice and water. Until the beginning of the twentieth century, glaciers
      covered the heights of the massif, and together with rivers shaped the reliefs and valleys. Hence
      glacial lakes like Lake Allos, at 2,230 metres, the largest natural high-mountain lake in Europe: it
      occupies a cirque hollowed out by Quaternary glaciers of the upper Verdon, is dominated by Mount Pelat,
      and has no surface outlet. Its water escapes through an underground passage that emerges at the
      Chadoulin spring, flowing from there into the Verdon.


      The rock tells the same story in two tones. The core of the massif along the border consists of
      crystalline rocks, surrounded by sedimentary strata. Six main valleys traverse it: Roya and Bévéra,
      Vésubie, Tinée, Haut-Var and Cians, Ubaye, and Verdon. The core zone covers 68,500 hectares, with its
      highest point at the summit of Gélas, at 3,143 metres.


      This blend of rock types and elevations explains the flora. Deciduous trees—downy oak, Scots pine, holm
      oak—give way to conifers, including silver fir, Norway spruce, European larch, and Swiss stone pine up
      to 2,200 metres, above which alpine species begin. Plants with very restricted distributions include the
      many-flowered saxifrage, Moggridge fritillary, Allioni primrose, Ligurian gentian, and Reichenbach
      butterwort. The massif also served as a glacial refuge for alpine relics such as woolly berardia. Beside
      Lake Allos grow alpine meadows, alpine poppy, rusty-leaved alpenrose, and larches.
    wildlife: >-
      Walk with attentive ears: in summer, hikers readily spot
      [chamois](/especie/rupicapra_rupicapra/)—several thousand live in the park—and often hear
      [marmots](/especie/marmota_marmota/) whistling. With luck, [alpine ibex](/especie/capra_ibex/) and
      mouflon reveal themselves during the cooler hours of the day. There are more than 8,000 chamois and
      1,100 ibex, alongside red deer, wild boar, roe deer, and abundant marmots.


      Animals follow a calendar that knows no borders. Ibex spend the summer in the Mercantour after
      overwintering in the Argentera, while mouflon make the reverse journey. For this reason, the park and
      its Italian neighbour monitor wildlife together. Ibex fitted with ear tags or GPS collars help
      researchers understand these movements, and the park asks hikers to report every sighting: date, time,
      and exact location.


      Up above, birds rule the skies. The park hosts 153 species, where you can watch the [bearded
      vulture](/especie/gypaetus_barbatus/), reintroduced since 1993, the [golden
      eagle](/especie/aquila_chrysaetos/), black grouse, ptarmigan, and at high altitudes, the yellow-billed
      chough and red-billed chough. The bearded vulture remains vulnerable due to its small population.


      And then there is the wolf. Following that first sighting in 1992, the park supported shepherds with
      nocturnal corrals and Pyrenean Mountain Dogs (patous). In the most discreet corners of the massif lives
      the [Lanza's alpine salamander](/especie/salamandra_lanzai/), measuring 15 cm: its range is only
      partially documented, and the park asks hikers who spot one to record its position and take a
      photograph.
    visit: >-
      The park has 600 km of marked trails, including the GR 5, the GR 52A—the panoramic Mercantour trail
      crossing the Valley of Wonders—and the GR 56.


      For an easy start, Lake Allos: a one-hour return walk from the Laus plateau car park, plus another hour
      to circuit the lake. There are many more lakes to explore: Lauzanier, the Vens lakes, Morgon lakes, and
      those of the Valley of Wonders.


      If history is your focus, the vallée des Merveilles holds some 36,000 prehistoric rock carvings dating
      from the Neolithic and Early Bronze Age. They are spread across seven high valleys above 2,000 m around
      Mount Bégo, at 2,872 m. The ideal approach begins at the Musée des Merveilles in Tende, followed by a
      guided tour. In Saint-Martin-Vésubie, a dedicated wolf centre also welcomes visitors.
    history: >-
      Protection here has deep roots. The heart of the massif became a royal hunting reserve in 1859 under
      Victor Emmanuel II, an early safeguard that laid the groundwork for the national park created in 1979.
      Since 1987 it has been twinned with Italy's Alpi Marittime park, sharing 33 km of border.


      Long before, human communities left their mark: around Mount Bégo, petroglyphs carved into slate and
      granite date from the Late Neolithic and Bronze Age, while most livestock grazing today are transhumant,
      spending only the summer pasture season high up. The Brigasque sheep is a traditional breed of this
      territory, now considered endangered. Closer to our era, military relics survive from the eighteenth and
      nineteenth centuries and World War II, particularly around the Authion massif and the upper Tinée.


      Active conservation continues: in one translocation, 19 ibex were moved from Vanoise to Vésubie to
      strengthen the genetic diversity of the population.
    before: >-
      In the vallée des Merveilles, the GR 52 allows you to view rock carvings from the trail, but stepping
      off the marked path without an accredited guide is strictly prohibited. Making engravings in the area is
      treated as criminal damage to a historic monument and the national park core zone.


      If you look up at night, don't miss this: in June 2026 the entire national park became part of the
      expanded Alpes Azur Mercantour International Dark Sky Reserve.
    around: >-
      The [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) is just 1 km
      away: it is the Italian park with which Mercantour shares its border and wildlife tracking. About 20 km
      away lies the [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/), and 26 km
      away the [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/).
  fr:
    intro: >-
      Le 5 novembre 1992, des gardes du parc observèrent deux loups. Nul ne les avait réintroduits : ils
      étaient arrivés d'eux-mêmes depuis l'Italie, et avec eux le [loup gris](/especie/canis_lupus/) faisait
      son retour en France. Le théâtre de cet événement est le parc national du Mercantour, un massif situé
      entre Alpes-Maritimes et Alpes-de-Haute-Provence qui s'étend des cimes alpines jusqu'à la Méditerranée.
      Aujourd'hui, il partage avec l'Italie le suivi de sa faune et protège ce qui fut autrefois la réserve de
      chasse d'un roi.
    landscape: >-
      Tout ce que vous observez a été façonné par la glace et l'eau. Jusqu'au début du XXe siècle, des
      glaciers coiffaient les hauteurs du massif et sculptèrent, de concert avec les cours d'eau, reliefs et
      vallées. C'est ainsi que subsistent des lacs d'origine glaciaire comme le lac d'Allos, à 2 230 mètres,
      le plus grand lac naturel de haute montagne d'Europe : il occupe un cirque creusé par les glaciers
      quaternaires du haut Verdon, dominé par le mont Pelat, et ne possède aucun exutoire en surface. Ses eaux
      s'infiltrent par un conduit souterrain pour jaillir à la source du Chadoulin avant de rejoindre le
      Verdon.


      La roche raconte la même histoire sur deux registres. Le cœur du massif, le long de la crête frontière,
      est composé de roches cristallines, ceinturées par des strates sédimentaires. Six vallées majeures le
      sillonnent : Roya et Bévéra, Vésubie, Tinée, Haut-Var et Cians, Ubaye et Verdon. La zone cœur s'étend
      sur 68 500 hectares, couronnée par la cime du Gélas à 3 143 mètres.


      Cette diversité géologique et altitudinale explique la richesse floristique. Les feuillus — chêne
      pubescent, pin sylvestre, chêne vert — cèdent le pas aux conifères, avec sapin, épicéa, mélèze et pin
      cembro jusqu'à 2 200 mètres, au-delà desquels règnent les espèces alpines. Parmi les plantes à aire très
      restreinte figurent la saxifrage à nombreuses fleurs, la fritillaire de Moggridge, la primevère
      d'Allioni, la gentiane de Ligurie et la grassette de Reichenbach. Le massif servit en outre de refuge
      glaciaire pour des reliques alpines comme la bérardie laineuse. Autour du lac d'Allos s'épanouissent
      pelouses alpines, pavot des Alpes, rhododendron ferrugineux et mélèzes.
    wildlife: >-
      Cheminez l'oreille aux aguets : en été, les randonneurs aperçoivent facilement des
      [chamois](/especie/rupicapra_rupicapra/) — plusieurs milliers peuplent le parc — et entendent
      fréquemment siffler les [marmottes des Alpes](/especie/marmota_marmota/). Avec un peu de chance,
      [bouquetins des Alpes](/especie/capra_ibex/) et mouflons se découvrent aux heures les plus fraîches de
      la journée. Le massif rassemble plus de 8 000 chamois et 1 100 bouquetins, aux côtés de cerfs,
      sangliers, chevreuils et une foule de marmottes.


      Les animaux suivent un calendrier qui ignore les frontières administratives. Les bouquetins passent
      l'été dans le Mercantour après avoir hiverné dans l'Argentera, tandis que les mouflons effectuent le
      trajet inverse. C'est pourquoi le parc et son voisin italien unissent leurs efforts pour le suivi de la
      faune. Les bouquetins bagués à l'oreille ou munis de colliers permettent d'élucider ces déplacements, et
      le parc invite chaque observateur à signaler ses rencontres : date, heure et localisation précise.


      En altitude, les oiseaux règnent en maîtres. Le parc dénombre 153 espèces aviennes ; vous pouvez y
      contempler le [gypaète barbu](/especie/gypaetus_barbatus/), réintroduit depuis 1993, l'[aigle
      royal](/especie/aquila_chrysaetos/), le tétras lyre, le lagopède alpin et, sur les crêtes escarpées, le
      chocard à bec jaune et le crave à bec rouge. Le gypaète barbu demeure vulnérable en raison de ses
      effectifs réduits.


      Et le loup est bien présent. Après cette première observation de 1992, le parc a accompagné les éleveurs
      en finançant des parcs de nuit et des chiens patous des Pyrénées. Dans les recoins les plus discrets du
      massif vit la [salamandre de Lanza](/especie/salamandra_lanzai/), longue de 15 cm : son aire de
      répartition n'est que partiellement connue et le parc sollicite les randonneurs pour relever ses
      coordonnées et la photographier.
    visit: >-
      Le parc compte 600 km de sentiers balisés, incluant le GR 5, le GR 52A — sentier panoramique du
      Mercantour traversant la vallée des Merveilles — et le GR 56.


      Pour une découverte en douceur, le lac d'Allos : une heure de marche aller-retour depuis le parking du
      plateau du Laus, complétée d'une heure pour en faire le tour. D'autres lacs méritent le détour : le
      Lauzanier, les lacs de Vens, de Morgon et ceux de la vallée des Merveilles.


      Si l'histoire vous passionne, la vallée des Merveilles recèle quelque 36 000 gravures rupestres
      préhistoriques du Néolithique et du début de l'âge du bronze. Réparties dans sept vallées d'altitude
      au-delà de 2 000 m autour du mont Bégo culminant à 2 872 m, leur visite commence idéalement au musée
      départemental des Merveilles de Tende avant de suivre une visite guidée. À Saint-Martin-Vésubie, un
      centre dédié au loup accueille par ailleurs le public.
    history: >-
      La protection des lieux est ancienne. Le cœur du massif fut constitué en réserve royale de chasse dès
      1859 sous Victor-Emmanuel II, un statut protecteur précurseur à l'origine du parc national créé en 1979.
      Depuis 1987, il est jumelé avec le parc italien des Alpi Marittime avec lequel il partage 33 km de
      frontière.


      Bien avant cela, l'homme avait apposé son empreinte : autour du mont Bégo, des pétroglyphes piqués sur
      schiste et granite témoignent des passages de la fin du Néolithique et de l'âge du bronze, tandis que la
      plupart des troupeaux actuels sont transhumants et ne montent qu'aux estives estivales. La brebis
      brigasque est une race rustique ancestrale du secteur, aujourd'hui considérée comme menacée. À une
      époque plus proche, des ouvrages militaires des XVIIIe et XIXe siècles ainsi que de la Seconde Guerre
      mondiale subsistent, notamment sur le massif de l'Authion et en haute Tinée.


      La conservation se poursuit activement : lors d'une opération de translocation, 19 bouquetins ont été
      transférés de la Vanoise vers la Vésubie afin de renforcer la diversité génétique de la population.
    before: >-
      Dans la vallée des Merveilles, le GR 52 permet d'observer les gravures depuis le sentier balisé, mais
      quitter la trace sans accompagnateur agréé est strictement défendu. Réaliser des gravures dans ce
      secteur constitue une dégradation passible de poursuites sur un site classé monument historique et en
      zone cœur de parc national.


      Si vous levez les yeux vers le ciel, ne manquez pas ceci : en juin 2026, l'ensemble du parc a intégré la
      Réserve internationale de ciel étoilé Alpes Azur Mercantour agrandie.
    around: >-
      Le [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) se situe à 1 km :
      c'est le parc italien limitrophe avec lequel le Mercantour partage sa frontière et la gestion de la
      faune. À environ 20 km s'étend le [Parc Naturel Régional du
      Queyras](/lugar/parc-naturel-regional-du-queyras/), et à 26 km le [Parco naturale del
      Monviso](/lugar/parco-naturale-del-monviso/).
  de:
    intro: >-
      Am 5. November 1992 sichteten Parkwächter zwei Wölfe. Niemand hatte sie ausgesetzt: Sie waren
      eigenständig aus Italien eingewandert, und mit ihnen kehrte der [Wolf](/especie/canis_lupus/) nach
      Frankreich zurück. Der Ort dieses Geschehens ist der Nationalpark Mercantour, ein Massiv zwischen den
      Departements Alpes-Maritimes und Alpes-de-Haute-Provence, das von alpinen Gipfeln bis zum Mittelmeer
      reicht. Heute teilt er mit Italien die Wildtierbeobachtung und bewahrt das einstige königliche
      Jagdrevier.
    landscape: >-
      Alles, was du siehst, haben Eis und Wasser geformt. Bis zum Beginn des zwanzigsten Jahrhunderts
      bedeckten Gletscher die Höhen des Massivs und gestalteten gemeinsam mit den Flüssen Reliefs und Täler.
      Daher rühren Gletscherseen wie der Lac d'Allos auf 2 230 Metern, der größte natürliche Hochgebirgssee
      Europas: Er füllt einen von eiszeitlichen Gletschern des oberen Verdon ausgeschürften Kessel unterhalb
      des Mont Pelat aus und besitzt keinen oberirdischen Abfluss. Sein Wasser fließt über einen
      unterirdischen Kanal ab, der in der Quelle des Chadoulin zutage tritt und in den Verdon mündet.


      Das Gestein erzählt dieselbe Geschichte in zwei Farbtönen. Der Kern des Massivs entlang der Grenze
      besteht aus kristallinem Gestein, umschlossen von Sedimentgesteinen. Sechs Haupttäler durchziehen das
      Gebiet: Roya und Bévéra, Vésubie, Tinée, Haut-Var und Cians, Ubaye sowie Verdon. Die Kernzone umfasst 68
      500 Hektar, und der höchste Punkt ist die Cime du Gélas mit 3 143 Metern.


      Diese Vielfalt an Höhenlagen und Gesteinen erklärt den Reichtum der Flora. Laubbäume — Flaumeiche,
      Waldkiefer, Steineiche — weichen Nadelwäldern aus Tanne, Fichte, Lärche und Zirbelkiefer bis auf 2 200
      Meter, über denen die alpine Mattenvegetation beginnt. Zu den Pflanzen mit stark begrenztem
      Verbreitungsgebiet gehören der Vielblütige Steinbrech, die Moggridge-Schachblume, die Allioni-Primel,
      der Ligurische Enzian und das Reichenbach-Fettkraut. Das Massiv diente zudem als eiszeitliches Refugium
      für alpine Reliktarten wie die Wollige Berardie. Am Lac d'Allos gedeihen alpine Weiden, Alpenmohn,
      Rostblättrige Alpenrose und Lärchen.
    wildlife: >-
      Wandere mit offenen Ohren: Im Sommer erspähen Wanderer mühelos [Gämsen](/especie/rupicapra_rupicapra/) —
      mehrere Tausend leben im Park — und vernehmen häufig das Pfeifen der
      [Alpenmurmeltiere](/especie/marmota_marmota/). Mit etwas Glück zeigen sich
      [Alpensteinböcke](/especie/capra_ibex/) und Mufflons in den kühleren Stunden des Tages. Der Park
      beherbergt über 8 000 Gämsen und 1 100 Steinböcke, dazu Rothirsche, Wildschweine, Rehe und unzählige
      Murmeltiere.


      Die Tiere folgen einem Jahreszyklus ohne Landesgrenzen. Steinböcke verbringen den Sommer im Mercantour
      nach der Überwinterung im Argentera-Massiv, während Mufflons den umgekehrten Weg nehmen. Deshalb
      überwachen der Park und sein italienischer Nachbar die Bestände gemeinsam. Mit Ohrmarken oder Sendern
      markierte Steinböcke helfen, diese Wanderungen zu verstehen, und der Park bittet Wanderer um Meldung
      jeder Sichtung: Datum, Uhrzeit und genauer Ort.


      Oben beherrschen Vögel die Lüfte. Der Park zählt 153 Vogelarten, darunter der seit 1993
      wiederangesiedelte [Bartgeier](/especie/gypaetus_barbatus/), der
      [Steinadler](/especie/aquila_chrysaetos/), das Birkhuhn, das Alpenschneehuhn sowie in Felsregionen
      Alpendohle und Alpenkrähe. Der Bartgeier bleibt wegen seiner geringen Bestandsgröße weiterhin gefährdet.


      Und schließlich der Wolf. Nach jener ersten Sichtung im Jahr 1992 unterstützte der Park die Hirten mit
      Nachtpferchen und Pyrenäen-Berghunden (Patous). Im unzugänglichsten Winkel des Massivs lebt der [Lanzas
      Alpensalamander](/especie/salamandra_lanzai/), der 15 cm misst: Sein Verbreitungsgebiet ist nur
      teilweise erforscht, und der Park bittet Bergsteiger, Funde mit Koordinaten und Foto zu melden.
    visit: >-
      Der Park bietet 600 km markierte Wanderwege, darunter den GR 5, den GR 52A — den Mercantour-Panoramaweg
      durch das Tal der Wunder — und den GR 56.


      Für einen gemächlichen Auftakt eignet sich der Lac d'Allos: eine Stunde Gehzeit hin und zurück vom
      Parkplatz auf dem Laus-Plateau, plus eine weitere Stunde für die Seeumrundung. Viele weitere Seen lohnen
      einen Besuch: Lauzanier, die Vens-Seen, die Morgon-Seen und jene im Vallée des Merveilles.


      Kulturinteressierte finden im Vallée des Merveilles rund 36 000 prähistorische Felsritzungen aus der
      Jungsteinzeit und der frühen Bronzezeit. Sie verteilen sich über sieben Hochtäler auf über 2 000 m Höhe
      rund um den 2 872 m hohen Mont Bégo. Am besten beginnt man im Musée des Merveilles in Tende und schließt
      eine geführte Tour an. In Saint-Martin-Vésubie empfängt zudem ein Wolfszentrum Besucher.
    history: >-
      Der Schutzgedanke reicht weit zurück. Das Herz des Massivs wurde 1859 unter Viktor Emanuel II. zum
      königlichen Jagdrevier erklärt — eine frühe Schutzzone, aus der 1979 der Nationalpark hervorging. Seit
      1987 besteht eine Partnerschaft mit dem italienischen Parco Naturale delle Alpi Marittime, mit dem er 33
      km Grenze teilt.


      Schon Jahrtausende zuvor hinterließen Menschen Spuren: Rund um den Mont Bégo zeugen in Schiefer und
      Granit eingemeißelte Petroglyphen vom Ende der Jungsteinzeit und der Bronzezeit. Die meisten Weidetiere
      heute sind Transhumanz-Herden, die nur den Sommer auf den Hochweiden verbringen. Das Brigasque-Schaf ist
      eine traditionelle Rasse des Gebiets, die heute als gefährdet gilt. Aus jüngerer Vergangenheit stammen
      militärische Anlagen aus dem achtzehnten und neunzehnten Jahrhundert sowie des Zweiten Weltkriegs,
      namentlich am Authion und im oberen Tinée-Tal.


      Der Artenschutz bleibt lebendig: Bei einer Umsiedlungsaktion wurden 19 Steinböcke aus der Vanoise in die
      Vésubie gebracht, um die genetische Vielfalt der Population zu stärken.
    before: >-
      Im Vallée des Merveilles gestattet der GR 52 das Betrachten der Gravuren vom Wanderweg aus, doch das
      Verlassen des Pfades ohne akkreditierten Bergführer ist streng verboten. Ritzungen in diesem Gebiet
      gelten als Beschädigung eines historischen Denkmals in der Kernzone des Nationalparks.


      Blickst du nachts zum Himmel, solltest du folgendes wissen: Im Juni 2026 wurde der gesamte Nationalpark
      Teil des erweiterten Internationalen Lichtschutzgebiets Alpes Azur Mercantour.
    around: >-
      Der [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) liegt nur 1 km
      entfernt: Es ist der italienische Nachbarpark, mit dem das Mercantour Grenze und Tierbeobachtung teilt.
      Rund 20 km entfernt erstreckt sich der [Parc Naturel Régional du
      Queyras](/lugar/parc-naturel-regional-du-queyras/), und in 26 km Entfernung der [Parco naturale del
      Monviso](/lugar/parco-naturale-del-monviso/).
  it:
    intro: >-
      Il 5 novembre 1992 alcuni guardiaparco avvistarono due lupi. Nessuno li aveva rilasciati: erano giunti
      autonomamente dall'Italia, e con loro il [lupo grigio](/especie/canis_lupus/) faceva ritorno in Francia.
      Il luogo in cui accadde è il Parco nazionale del Mercantour, un massiccio tra le Alpi Marittime e le
      Alpi dell'Alta Provenza che si spinge dalle vette alpine fino al Mediterraneo. Oggi condivide con
      l'Italia il monitoraggio della fauna e custodisce quella che un tempo fu riserva reale di caccia.
    landscape: >-
      Tutto ciò che vedi è stato scolpito dal ghiaccio e dall'acqua. Fino agli inizi del Novecento i ghiacciai
      ricoprivano le sommità del massiccio, modellando rilievi e valli insieme ai corsi d'acqua. Da qui
      derivano laghi d'origine glaciale come il lago d'Allos, a 2 230 metri, il più grande lago naturale
      d'alta quota d'Europa: occupa una conca scavata dai ghiacciai quaternari dell'alto Verdon, dominata dal
      monte Pelat, e non possiede emissari in superficie. Le sue acque defluiscono per via sotterranea
      sgorgando alla sorgente del Chadoulin, per confluire poi nel Verdon.


      La roccia esprime la stessa vicenda in due tonalità. Il cuore del massiccio lungo la linea di confine è
      formato da rocce cristalline, contornate da rilievi sedimentari. Sei valli principali lo attraversano:
      Roya e Bévéra, Vésubie, Tinée, Haut-Var e Cians, Ubaye e Verdon. La zona centrale si estende per 68 500
      ettari, con il punto culminante sulla Cime du Gélas a 3 143 metri.


      Tale varietà di altitudini e rocce spiega la ricchezza della flora. Le latifoglie — roverella, pino
      silvestre, leccio — lasciano il passo alle conifere con abete bianco, abete rosso, larice e pino cembro
      fino a 2 200 metri, al di sopra dei quali subentrano le specie alpine. Tra le piante a distribuzione
      molto ristretta figurano la sassifraga a molti fiori, la fritillaria di Moggridge, la primula di
      Allioni, la genziana di Liguria e la pinguicola di Reichenbach. Il massiccio fu inoltre rifugio glaciale
      per relitti alpini come la berardia lanosa. Presso il lago d'Allos vegetano pascoli alpini, papavero
      alpino, rododendro ferrugineo e larici.
    wildlife: >-
      Cammina prestando ascolto: d'estate si avvistano facilmente i [camosci
      alpini](/especie/rupicapra_rupicapra/) — varie migliaia popolano il parco — e si ode di frequente il
      fischio delle [marmotte](/especie/marmota_marmota/). Con un po' di fortuna,
      [stambecchi](/especie/capra_ibex/) e mufloni compaiono nelle ore più fresche della giornata. Il parco
      conta oltre 8 000 camosci e 1 100 stambecchi, oltre a cervi, cinghiali, caprioli e una miriade di
      marmotte.


      Gli animali seguono ritmi stagionali che ignorano i confini statali. Gli stambecchi trascorrono l'estate
      nel Mercantour dopo aver svernato nell'Argentera, mentre i mufloni compiono il percorso inverso. Per
      questa ragione il parco e il vicino italiano collaborano nel censimento faunistico. Gli stambecchi
      provvisti di marche auricolari o radiocollari consentono di decifrare questi spostamenti, e l'ente parco
      invita gli escursionisti a segnalare ogni avvistamento: data, ora e punto esatto.


      In alto dominano i volatili. Il parco annovera 153 specie di uccelli: vi si possono osservare il
      [gipeto](/especie/gypaetus_barbatus/), reintrodotto a partire dal 1993, l'[aquila
      reale](/especie/aquila_chrysaetos/), il fagiano di monte, la pernice bianca e, sulle creste rocciose, il
      gracchio corallino e il gracchio alpino. Il gipeto resta vulnerabile a causa dell'esiguità della sua
      popolazione.


      E c'è il lupo. Dopo quel primo avvistamento del 1992, il parco ha sostenuto i pastori dotandoli di
      recinti notturni e cani da pastore dei Pirenei (patou). Nell'angolo più appartato del massiccio vive la
      [salamandra di Lanza](/especie/salamandra_lanzai/), lunga 15 cm: il suo areale è noto solo parzialmente
      e il parco richiede agli escursionisti di fotografarla e geolocalizzarla in caso di incontro.
    visit: >-
      Il parco comprende 600 km di sentieri tracciati, tra cui il GR 5, il GR 52A — l'itinerario panoramico
      del Mercantour che attraversa la Valle delle Meraviglie — e il GR 56.


      Per iniziare agevolmente, il lago d'Allos: un'ora di cammino tra andata e ritorno dal parcheggio del
      Laus, più un'ulteriore ora per circumnavigarlo. Molti altri specchi d'acqua meritano un'escursione:
      Lauzanier, i laghi di Vens, i laghi di Morgon e quelli della Vallée des Merveilles.


      Se ami l'archeologia, la vallée des Merveilles custodisce circa 36 000 petroglifi preistorici del
      Neolitico e dell'antica età del bronzo. Sono distribuiti in sette valli d'alta quota oltre i 2 000 m
      attorno al monte Bégo, alto 2 872 m. L'approccio migliore prevede la visita al Musée des Merveilles di
      Tende prima di intraprendere l'escursione guidata. A Saint-Martin-Vésubie, inoltre, un centro faunistico
      dedicato al lupo è aperto ai visitatori.
    history: >-
      La tutela ha radici lontane. Il nucleo del massiccio divenne riserva reale di caccia nel 1859 con
      Vittorio Emanuele II: questa antica protezione pose le basi per il parco nazionale istituito nel 1979.
      Dal 1987 è gemellato con il Parco Naturale Alpi Marittime, con cui divide 33 km di frontiera.


      In epoche ben più remote l'uomo aveva già lasciato segni indelebili: attorno al monte Bégo le incisioni
      su scisto e granito testimoniano la presenza umana fin dal tardo Neolitico e dall'età del bronzo, mentre
      gran parte delle greggi odierne sono transumanti e sostano sui pascoli solo in estate. La pecora
      brigasca è una razza autoctona tradizionale del territorio, oggi minacciata di estinzione. In tempi più
      recenti restano manufatti militari risalenti al Settecento, all'Ottocento e alla seconda guerra
      mondiale, specie sull'Authion e nell'alta Tinée.


      Le iniziative di salvaguardia proseguono costanti: con un'operazione di traslocazione, 19 stambecchi
      sono stati trasferiti dalla Vanoise alla Vésubie per rinvigorire la varietà genetica della colonia
      locale.
    before: >-
      Nella vallée des Merveilles il sentiero GR 52 permette di ammirare le incisioni rupestri dal tracciato,
      ma abbandonare la pista senza una guida accreditata è severamente proibito. Incidere le rocce nella zona
      costituisce danneggiamento punibile di un monumento storico inserito nella zona centrale del parco
      nazionale.


      Se scruti il cielo notturno, tieni a mente questo: nel giugno 2026 l'intero parco è confluito nella
      Riserva Internazionale di Cielo Buio Alpes Azur Mercantour ampliata.
    around: >-
      Il [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) dista solo 1 km: è
      l'area protetta italiana con cui il Mercantour condivide il confine e il monitoraggio degli animali. A
      circa 20 km si trova il [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/), e
      a 26 km il [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/).
  pt:
    intro: >-
      A 5 de novembro de 1992, guardas do parque avistaram dois lobos. Ninguém os havia libertado: tinham
      chegado pelo seu próprio pé desde Itália, e com eles o [lobo](/especie/canis_lupus/) regressava a
      França. O local onde isto aconteceu é o Parque Nacional de Mercantour, um maciço entre os Alpes
      Marítimos e os Alpes da Alta Provença que vai dos cumes alpinos até ao Mediterrâneo. Hoje partilha com
      Itália o acompanhamento da fauna e conserva o que outrora foi coutada de caça de um rei.
    landscape: >-
      Tudo o que vês foi esculpido pelo gelo e pela água. Até ao início do século XX, os glaciares cobriam as
      alturas do maciço e, em conjunto com os rios, moldaram os relevos e os vales. É por isso que existem
      lagos de origem glaciar como o lago de Allos, a 2 230 metros, o maior lago natural de alta montanha da
      Europa: ocupa um circo escavado pelos glaciares quaternários do alto Verdon, dominado pelo monte Pelat,
      e não tem escoamento à superfície. A sua água escapa por uma galeria subterrânea que desagua na nascente
      do Chadoulin, seguindo daí para o Verdon.


      A rocha conta a mesma história em dois tons. O núcleo do maciço, junto à fronteira, é constituído por
      rochas cristalinas, rodeado por estratos sedimentares. Seis vales principais cruzam-no: Roya e Bévéra,
      Vésubie, Tinée, Haut-Var e Cians, Ubaye e Verdon. A zona central abrange 68 500 hectares, situando-se o
      ponto mais alto no cume do Gélas, a 3 143 metros.


      Essa variedade geológica e de altitudes explica a flora. As folhosas — carvalho-pubescente,
      pinheiro-silvestre, azinheira — dão lugar às coníferas, com abeto, espruce, lariço e pinheiro-suíço até
      aos 2 200 metros, acima dos quais começam as espécies alpinas. Entre a vegetação de distribuição muito
      restrita destacam-se a saxífraga-de-muitas-flores, a fritilária-de-Moggridge, a prímula-de-Allioni, a
      genciana-da-Ligúria e a pinguícula-de-Reichenbach. O maciço serviu ainda de refúgio glaciar para
      espécies relíquias alpinas como a berardia-lanosa. Junto ao lago de Allos desenvolvem-se pastos alpinos,
      papoila-dos-Alpes, rododendro-ferrugíneo e lariços.
    wildlife: >-
      Caminha atento aos sons: no verão, os caminhantes avistam com facilidade
      [camurças](/especie/rupicapra_rupicapra/) — vivem vários milhares no parque — e ouvem frequentemente o
      silvo das [marmotas](/especie/marmota_marmota/). Com alguma sorte, [íbexes](/especie/capra_ibex/) e
      muflões deixam-se ver nas horas mais frescas do dia. Existem mais de 8 000 camurças e 1 100 íbexes, para
      além de veados, javalis, corços e uma grande abundância de marmotas.


      Os animais regem-se por um calendário que não conhece fronteiras. Os íbexes passam o verão no Mercantour
      depois de invernarem na Argentera, e os muflões realizam o percurso oposto. Por essa razão o parque e o
      seu vizinho italiano monitorizam a fauna em conjunto. Os íbexes com marcas auriculares ou coleiras
      ajudam a decifrar essas deslocações, e a administração do parque pede aos visitantes que comuniquem
      qualquer observação: data, hora e local exato.


      Nas alturas imperam as aves. O parque acolhe 153 espécies, onde podes avistar o
      [quebra-ossos](/especie/gypaetus_barbatus/), reintroduzido desde 1993, a
      [águia-real](/especie/aquila_chrysaetos/), o tetraz-lira, a lagópode-branca e, nas escarpas elevadas, a
      gralha-de-bico-amarelo e a gralha-de-bico-vermelho. O quebra-ossos permanece vulnerável devido à
      escassez da sua população.


      E há o lobo. Após aquele primeiro registo em 1992, o parque apoiou os pastores com cercados noturnos e
      cães-de-montanha-dos-pirinéus (patous). No recanto mais resguardado do maciço habita a
      [salamandra-de-Lanza](/especie/salamandra_lanzai/), com 15 cm: a sua distribuição apenas é conhecida em
      parte, pelo que o parque pede aos montanhistas que fotografem e registem as coordenadas ao encontrá-la.
    visit: >-
      O parque dispõe de 600 km de trilhos sinalizados, incluindo o GR 5, o GR 52A — o trilho panorâmico de
      Mercantour que cruza o vale das Maravilhas — e o GR 56.


      Para um começo suave, o lago de Allos: uma hora de marcha ida e volta a partir do parque de
      estacionamento do planalto de Laus, e mais uma hora para circum-navegá-lo. Há muitos outros lagos para
      explorar: Lauzanier, os lagos de Vens, de Morgon e os da Vallée des Merveilles.


      Se o teu interesse é a história, a vallée des Merveilles resguarda cerca de 36 000 gravuras rupestres
      pré-históricas do Neolítico e do início da Idade do Bronze. Encontram-se espalhadas por sete vales
      elevados acima dos 2 000 m em redor do monte Bégo, com 2 872 m. O itinerário ideal arranca no museu
      departamental das Maravilhas de Tende, seguido de uma visita guiada. Em Saint-Martin-Vésubie, existe
      ainda um centro dedicado ao lobo aberto aos visitantes.
    history: >-
      A proteção remonta a tempos recuados. O coração do maciço foi declarado reserva real de caça em 1859 sob
      Vítor Emanuel II, um regime pioneiro que esteve na génese do parque nacional criado em 1979. Desde 1987
      está geminado com o parque italiano Alpi Marittime, com o qual partilha 33 km de fronteira.


      Muito antes, já o homem deixava marcas: ao redor do monte Bégo petróglifos picados em xisto e granito
      atestam a presença humana no final do Neolítico e na Idade do Bronze, ao passo que a maior parte dos
      rebanhos contemporâneos são transumantes e só aí passam a época das pastagens de verão. A ovelha
      brigasca é uma raça autóctone tradicional deste território, hoje considerada em perigo. Em períodos mais
      recentes, subsistem vestígios militares dos séculos XVIII e XIX e da Segunda Guerra Mundial, em especial
      em torno do Authion e no alto Tinée.


      A conservação permanece ativa: numa operação de translocação foram transferidos 19 íbexes da Vanoise
      para a Vésubie com o propósito de reforçar a diversidade genética da população.
    before: >-
      Na vallée des Merveilles, o GR 52 permite contemplar as gravuras a partir do caminho, mas afastar-se do
      trilho sem guia acreditado é terminantemente proibido. Efetuar gravações na área é considerado dano
      intencional num monumento histórico e na zona central do parque nacional.


      Se olhares o céu noturno, não percas isto: em junho de 2026 todo o parque passou a integrar a ampliada
      Reserva Internacional de Céu Escuro Alpes Azur Mercantour.
    around: >-
      O [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) fica a apenas 1 km:
      é o parque italiano com o qual Mercantour partilha a fronteira e o acompanhamento de animais. A cerca de
      20 km situa-se o [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/), e a 26 km
      o [Parco naturale del Monviso](/lugar/parco-naturale-del-monviso/).
