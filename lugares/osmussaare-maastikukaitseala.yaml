texto:
  es:
    intro: >-
      Hace entre 2000 y 3000 años, un pedazo de la gran escarpa caliza del Báltico asomó sobre las olas y se
      quedó solo. Eso es Osmussaar: una isla de piedra, grava y viento a la que se llega en barco desde el
      puerto de Dirhami, en veinte o treinta minutos. Los suecos de Estonia la llamaban Odensholm, la isla de
      Odín. Su reserva paisajística, creada en 1996, protege lo que ese aislamiento ha guardado: objetos
      geológicos, aves y la memoria de un pueblo que vivió aquí hasta 1944.
    landscape: >-
      En la costa norte puedes ver un tramo de la escarpa báltica, un acantilado que recorre 1200 km de costa
      y que aquí, en una isla, se muestra de cerca. No es una pared que se mantenga quieta: cambia despacio
      por la acción del mar. El sur, en cambio, es bajo y llano, y allí hay varios lagos, como Inahamne y
      Kappelkärre. Fueron bahías hasta que el terreno subió y las separó del mar. El ascenso sigue siendo
      visible en un detalle: la capilla, que se levantó junto al puerto, está hoy a kilómetro y medio de él.


      Entre las rocas hay algo menos habitual. Casi 60 bloques de brecha de gneis proceden de la explosión de
      un meteorito ocurrida hace 535 millones de años. Los más conocidos son Skarvan y los Gemelos, los
      Kaksikud.


      La reserva reúne lagunas costeras abiertas al mar, acantilados, prados, turberas bajas y viejos bosques
      de frondosas, y entre todos destacan los alvares, pastizales abiertos sobre la caliza. Para que sigan
      abiertos, en la isla pastan vacas de las Highlands escocesas. La flora es larga: entre 1885 y 1998 se
      registraron 607 especies de plantas vasculares, 25 de ellas protegidas, y de esas protegidas 14 son
      orquídeas. Hay además 129 especies de musgos.
    wildlife: >-
      Osmussaar está en la ruta migratoria del Atlántico oriental, por la que pasan millones de aves, y los
      números lo reflejan: se han observado 178 especies y en 2003 se encontraron 90 nidificantes, 63 de ellas
      protegidas. Por eso en mayo y junio hay que evitar molestar a las aves cerca del puerto sur, en el cabo
      Boan y en el lago Inahamne.


      En tierra viven el [castor](/especie/castor_fiber/), el zorro y varios murciélagos, y en la costa puedes
      ver la [foca gris](/especie/halichoerus_grypus/). Entre los anfibios hay tritón punteado, sapo común y
      rana campestre, y entre los reptiles la culebra de collar. Los insectos aportan cifras de otra escala:
      226 especies de macrolepidópteros y 158 de microlepidópteros.


      Si te interesan las plantas, hay una marcha guiada de las orquídeas en la que se enseña a reconocer
      distintas especies.
    visit: >-
      El camino de referencia es el sendero de RMK, de 9 km. Empieza en el puerto sur y sigue el camino hacia
      el noroeste, junto a la costa de acantilados. A lo largo del recorrido aparecen bloques de brecha, lagos
      relictos, extensas gravas, enebros y defensas militares. Tiene dos paneles informativos, uno en cada
      extremo de la isla, y seis puntos de interés. En el extremo noroeste se levanta el faro de franjas
      blancas y negras, que se admira desde fuera.


      Con un guía local puedes elegir el recorrido; la caminata tradicional ronda los 8 o 9 km y puede
      alargarse hasta seis horas. Hay también una ruta en coche por la costa, de unos 12 o 13 km, para quien
      no pueda caminar mucho.
    history: >-
      Antes de que los últimos suecos de Estonia huyeran en 1944, la isla tenía una sola aldea, Bien, de siete
      granjas. La capilla de piedra caliza se consagró en 1766 y las batallas de 1941 casi la destruyeron; hoy
      quedan sus ruinas restauradas. El faro actual, de hormigón armado y 35 metros, se terminó en 1954,
      después de que en 1941 las tropas soviéticas volaran el anterior. Antes, en la noche del 26 de agosto de
      1914, el crucero alemán Magdeburg había encallado frente a la isla y su tripulación lo voló.


      La isla se desminó entre 1996 y 1998 y es hoy una de las zonas de Estonia más limpias de restos
      explosivos. Desde 2001 viven en ella de nuevo habitantes permanentes.
    before: >-
      La llegada hay que concertarla de antemano con la fundación de la isla o con RMK: no se llega por cuenta
      propia. Solo se puede acampar y hacer fuego en los lugares que RMK habilita. No se recomienda llevar
      perros y hay que evitar molestar a las ovejas. Retira contigo todos tus residuos.
    around: >-
      Las otras reservas paisajísticas de la costa estonia quedan a una distancia parecida:
      [Pakri](/lugar/pakri-maastikukaitseala/), a unos veintiséis kilómetros, y
      [Vormsi](/lugar/vormsi-maastikukaitseala/), a unos veintiocho kilómetros.
  en:
    intro: >-
      Between 2000 and 3000 years ago, a section of the great Baltic limestone escarpment broke the surface
      and was left alone. That is Osmussaar: an island of rock, gravel and wind reached by boat from the port
      of Dirhami in twenty to thirty minutes. Estonia's Swedes called it Odensholm, the island of Odin. Its
      landscape reserve, created in 1996, protects what that isolation has preserved: geological features,
      birds and the memory of a people who lived here until 1944.
    landscape: >-
      On the north coast you can see a stretch of the Baltic klint, a cliff running 1200 km of coastline that
      here, on an island, can be seen close up. It is not a wall that stays still: it changes slowly under the
      action of the sea. The south, by contrast, is low and flat, and there several lakes lie, such as
      Inahamne and Kappelkärre. They were bays until the land rose and separated them from the sea. The rise
      is still visible in one detail: the chapel, built by the harbour, stands today a kilometre and a half
      from it.


      Among the rocks there is something less common. Nearly 60 boulders of gneiss breccia came from the
      explosion of a meteorite that occurred 535 million years ago. The best known are Skarvan and the Twins,
      the Kaksikud.


      The reserve brings together coastal lagoons open to the sea, cliffs, meadows, low bogs and old
      broadleaved forests, and among them the alvar grasslands stand out — open pastures on limestone. To keep
      them open, Highland cattle graze on the island. The flora is extensive: between 1885 and 1998 a total of
      607 species of vascular plants were recorded, 25 of them protected, and of those protected 14 are
      orchids. There are also 129 species of mosses.
    wildlife: >-
      Osmussaar lies on the Eastern Atlantic Flyway, through which millions of birds pass, and the numbers
      reflect it: 178 species have been observed and in 2003 a total of 90 breeding birds were found, 63 of
      them protected. For this reason in May and June you should avoid disturbing birds near the southern
      harbour, at Cape Boan and at Lake Inahamne.


      On land the [beaver](/especie/castor_fiber/), the fox and several bat species live, and on the coast you
      can see the [grey seal](/especie/halichoerus_grypus/). Among the amphibians there are the smooth newt,
      the common toad and the moor frog, and among the reptiles the grass snake. The insects contribute
      figures of another scale: 226 species of macro-lepidoptera and 158 of micro-lepidoptera.


      If you are interested in plants, there is a guided orchid walk where you learn to identify different
      species.
    visit: >-
      The reference route is the RMK trail, 9 km long. It starts at the southern harbour and follows the path
      to the northwest, beside the cliff coast. Along the way you encounter breccia boulders, relict lakes,
      extensive gravel banks, junipers and military defences. It has two information boards, one at each end
      of the island, and six points of interest. At the north-western tip stands the black-and-white striped
      lighthouse, admired from outside.


      With a local guide you can choose the route; the traditional walk is around 8 or 9 km and can last up to
      six hours. There is also a driving route along the coast, about 12 or 13 km, for those who cannot walk
      much.
    history: >-
      Before the last of Estonia's Swedes fled in 1944, the island had a single village, Bien, of seven farms.
      The limestone chapel was consecrated in 1766 and the battles of 1941 nearly destroyed it; today its
      restored ruins remain. The current lighthouse, of reinforced concrete and 35 metres tall, was completed
      in 1954, after Soviet troops blew up its predecessor in 1941. Earlier, on the night of 26 August 1914,
      the German cruiser Magdeburg ran aground off the island and its crew blew it up.


      The island was demined between 1996 and 1998 and is today one of the areas of Estonia most free of
      unexploded ordnance. Since 2001 permanent inhabitants have lived there again.
    before: >-
      Arrival must be arranged in advance with the island foundation or with RMK: you cannot get there on your
      own. Camping and fires are allowed only in the places RMK provides. It is not recommended to bring dogs,
      and you must avoid disturbing the sheep. Take all your waste back with you.
    around: >-
      The other landscape reserves on the Estonian coast are a similar distance away:
      [Pakri](/lugar/pakri-maastikukaitseala/), about twenty-six kilometres, and
      [Vormsi](/lugar/vormsi-maastikukaitseala/), about twenty-eight kilometres.
  fr:
    intro: >-
      Il y a entre 2000 et 3000 ans, un morceau de la grande escarpe calcaire de la Baltique a émergé des
      flots et s'est retrouvé seul. C'est Osmussaar : une île de pierre, de gravier et de vent à laquelle on
      accède en bateau depuis le port de Dirhami en vingt à trente minutes. Les Suédois d'Estonie l'appelaient
      Odensholm, l'île d'Odin. Sa réserve paysagère, créée en 1996, protège ce que cet isolement a préservé :
      des objets géologiques, des oiseaux et la mémoire d'un peuple qui a vécu ici jusqu'en 1944.
    landscape: >-
      Sur la côte nord, vous pouvez voir un tronçon de la klint baltique, une falaise qui court sur 1200 km de
      littoral et qui ici, sur une île, se montre de près. Ce n'est pas une paroi qui reste immobile : elle
      change lentement sous l'action de la mer. Le sud, en revanche, est bas et plat, et plusieurs lacs s'y
      trouvent, comme Inahamne et Kappelkärre. C'étaient des baies jusqu'à ce que le terrain remonte et les
      sépare de la mer. La remontée est encore visible dans un détail : la chapelle, construite près du port,
      se trouve aujourd'hui à un kilomètre et demi de lui.


      Parmi les roches, il y a quelque chose de moins courant. Près de 60 blocs de brèche de gneiss
      proviennent de l'explosion d'un météorite survenue il y a 535 millions d'années. Les plus connus sont
      Skarvan et les Jumeaux, les Kaksikud.


      La réserve réunit des lagunes côtières ouvertes sur la mer, des falaises, des prairies, des tourbières
      basses et de vieilles forêts de feuillus, et parmi tous ces milieux les pelouses alvar se distinguent —
      des pâturages ouverts sur le calcaire. Pour qu'elles restent ouvertes, des vaches des Highlands
      écossaises paissent sur l'île. La flore est longue : entre 1885 et 1998, un total de 607 espèces de
      plantes vasculaires ont été recensées, dont 25 protégées, et parmi ces protégées 14 sont des orchidées.
      Il y a aussi 129 espèces de mousses.
    wildlife: >-
      Osmussaar se trouve sur la voie de migration de l'Atlantique oriental, par laquelle passent des millions
      d'oiseaux, et les chiffres le reflètent : 178 espèces ont été observées et en 2003 un total de 90
      nicheurs ont été trouvés, dont 63 protégés. C'est pourquoi en mai et en juin il faut éviter de déranger
      les oiseaux près du port sud, au cap Boan et au lac Inahamne.


      Sur l'île vivent le [castor](/especie/castor_fiber/), le renard et plusieurs espèces de chauves-souris,
      et sur la côte vous pouvez voir le [phoque gris](/especie/halichoerus_grypus/). Parmi les amphibiens, on
      trouve le triton ponctué, le crapaud commun et la grenouille des champs, et parmi les reptiles la
      couleuvre à collier. Les insectes apportent des chiffres d'une autre échelle : 226 espèces de
      macrolépidoptères et 158 de microlépidoptères.


      Si vous vous intéressez aux plantes, il existe une sortie guidée sur les orchidées où l'on apprend à
      reconnaître différentes espèces.
    visit: >-
      Le parcours de référence est le sentier RMK, de 9 km. Il commence au port sud et suit le chemin vers le
      nord-ouest, le long de la côte à falaises. Tout au long du trajet apparaissent des blocs de brèche, des
      lacs relictes, de vastes bancs de gravier, des genévriers et des défenses militaires. Il comporte deux
      panneaux d'information, un à chaque extrémité de l'île, et six points d'intérêt. À l'extrémité
      nord-ouest se dresse le phare à rayures blanches et noires, que l'on admire de l'extérieur.


      Avec un guide local, vous pouvez choisir le parcours ; la marche traditionnelle fait environ 8 ou 9 km
      et peut durer jusqu'à six heures. Il existe aussi un circuit en voiture le long de la côte, d'environ 12
      ou 13 km, pour ceux qui ne peuvent pas beaucoup marcher.
    history: >-
      Avant que les derniers Suédois d'Estonie ne fuient en 1944, l'île comptait un seul village, Bien, de
      sept fermes. La chapelle de calcaire a été consacrée en 1766 et les combats de 1941 l'ont presque
      détruite ; il en reste aujourd'hui les ruines restaurées. Le phare actuel, en béton armé et haut de 35
      mètres, a été achevé en 1954, après que les troupes soviétiques ont fait sauter le précédent en 1941.
      Auparavant, dans la nuit du 26 août 1914, le croiseur allemand Magdeburg s'était échoué au large de
      l'île et son équipage l'avait fait sauter.


      L'île a été déminée entre 1996 et 1998 et est aujourd'hui l'une des zones d'Estonie les plus propres en
      ce qui concerne les restes explosifs. Depuis 2001, des habitants permanents y vivent à nouveau.
    before: >-
      L'arrivée doit être organisée à l'avance avec la fondation de l'île ou avec RMK : on n'y accède pas de
      façon autonome. Le camping et les feux ne sont autorisés que dans les emplacements qu'RMK prévoit. Il
      est déconseillé d'amener des chiens et il faut éviter de déranger les moutons. Remportez tous vos
      déchets.
    around: >-
      Les autres réserves paysagères de la côte estonienne se trouvent à une distance similaire :
      [Pakri](/lugar/pakri-maastikukaitseala/), à environ vingt-six kilomètres, et
      [Vormsi](/lugar/vormsi-maastikukaitseala/), à environ vingt-huit kilomètres.
  de:
    intro: >-
      Vor zwischen 2000 und 3000 Jahren tauchte ein Stück des großen baltischen Kalksteinsteilhangs aus den
      Wellen auf und blieb allein. Das ist Osmussaar: eine Insel aus Stein, Schotter und Wind, die man vom
      Hafen Dirhami aus in zwanzig bis dreißig Minuten per Boot erreicht. Estlands Schweden nannten sie
      Odensholm, die Insel Odins. Ihr Landschaftsschutzgebiet, 1996 geschaffen, schützt, was diese Isolation
      bewahrt hat: geologische Objekte, Vögel und die Erinnerung an ein Volk, das hier bis 1944 lebte.
    landscape: >-
      An der Nordküste kannst du einen Abschnitt des Baltischen Klints sehen, einer Steilküste, die sich über
      1200 km Küstenlinie erstreckt und hier auf einer Insel aus nächster Nähe zu erleben ist. Es ist keine
      Wand, die stillsteht: Sie verändert sich langsam durch die Einwirkung des Meeres. Der Süden hingegen ist
      flach und niedrig, und dort liegen mehrere Seen, wie Inahamne und Kappelkärre. Es waren Buchten, bis das
      Land sich hob und sie vom Meer trennte. Das Heben ist noch an einem Detail sichtbar: Die Kapelle, die am
      Hafen errichtet wurde, steht heute anderthalb Kilometer von ihm entfernt.


      Zwischen den Felsen findet sich etwas weniger Alltägliches. Fast 60 Gneis-Breccia-Blöcke stammen aus der
      Explosion eines Meteoriten, die vor 535 Millionen Jahren stattfand. Die bekanntesten sind Skarvan und
      die Zwillinge, die Kaksikud.


      Das Reservat vereint Küstenlagunen mit Zugang zum Meer, Steilküsten, Wiesen, Flachmoore und alte
      Laubwälder, und unter all dem stechen die Alvar-Grünlande hervor — offene Weiden auf Kalkstein. Damit
      sie offen bleiben, weiden auf der Insel Hochlandrinder. Die Flora ist artenreich: Zwischen 1885 und 1998
      wurden insgesamt 607 Gefäßpflanzenarten verzeichnet, davon 25 geschützte, und von diesen geschützten
      sind 14 Orchideen. Es gibt auch 129 Moosarten.
    wildlife: >-
      Osmussaar liegt auf dem Ostatlantischen Vogelzugweg, durch den Millionen von Vögeln ziehen, und die
      Zahlen spiegeln das wider: 178 Arten wurden beobachtet, und im Jahr 2003 wurden insgesamt 90
      Brutvogelarten gefunden, davon 63 geschützte. Deshalb sollte man im Mai und Juni die Vögel in der Nähe
      des Südhafens, am Kap Boan und am See Inahamne nicht stören.


      Auf der Insel leben der [Biber](/especie/castor_fiber/), der Fuchs und mehrere Fledermausarten, und an
      der Küste kannst du die [Kegelrobbe](/especie/halichoerus_grypus/) sehen. Zu den Amphibien zählen der
      Teichmolch, die Erdkröte und der Moorfrosch, und unter den Reptilien die Ringelnatter. Die Insekten
      liefern Zahlen einer anderen Größenordnung: 226 Arten von Makrolepidoptera und 158 von Mikrolepidoptera.


      Wer sich für Pflanzen interessiert, kann an einer geführten Orchideenwanderung teilnehmen, bei der man
      lernt, verschiedene Arten zu erkennen.
    visit: >-
      Der Referenzweg ist der RMK-Weg mit 9 km Länge. Er beginnt am Südhafen und folgt dem Weg nach Nordwesten
      entlang der Steilküste. Auf dem Weg begegnen dir Breccia-Blöcke, Reliktseen, ausgedehnte Kiesbänke,
      Wacholderbüsche und militärische Befestigungen. Er hat zwei Informationstafeln, eine an jedem Ende der
      Insel, und sechs Interessenpunkte. Am Nordwestzipfel steht der schwarz-weiß gestreifte Leuchtturm, den
      man von außen bewundert.


      Mit einem lokalen Führer kannst du die Route wählen; die traditionelle Wanderung umfasst etwa 8 oder 9
      km und kann bis zu sechs Stunden dauern. Es gibt auch eine Autoroute entlang der Küste von etwa 12 oder
      13 km für diejenigen, die nicht viel gehen können.
    history: >-
      Bevor die letzten Schweden Estlands 1944 flohen, hatte die Insel ein einziges Dorf, Bien, mit sieben
      Höfen. Die Kalksteinkapelle wurde 1766 geweiht und die Kämpfe von 1941 zerstörten sie fast; heute stehen
      ihre restaurierten Ruinen. Der heutige Leuchtturm aus Stahlbeton mit 35 Metern wurde 1954
      fertiggestellt, nachdem sowjetische Truppen seinen Vorgänger 1941 gesprengt hatten. Zuvor, in der Nacht
      des 26. August 1914, war der deutsche Kreuzer Magdeburg vor der Insel auf Grund gelaufen und seine
      Besatzung hatte ihn gesprengt.


      Die Insel wurde zwischen 1996 und 1998 entmint und ist heute eines der explosivmittelfreiesten Gebiete
      Estlands. Seit 2001 wohnen wieder Dauereinwohner dort.
    before: >-
      Die Ankunft muss im Voraus mit der Inselstiftung oder mit RMK abgesprochen werden: Man kommt nicht auf
      eigene Faust hin. Campen und Feuer machen ist nur an den von RMK ausgewiesenen Stellen erlaubt. Es wird
      nicht empfohlen, Hunde mitzubringen, und die Schafe dürfen nicht gestört werden. Nimm deinen gesamten
      Abfall wieder mit.
    around: >-
      Die anderen Landschaftsschutzgebiete der estnischen Küste liegen in ähnlicher Entfernung:
      [Pakri](/lugar/pakri-maastikukaitseala/), etwa sechsundzwanzig Kilometer, und
      [Vormsi](/lugar/vormsi-maastikukaitseala/), etwa achtundzwanzig Kilometer.
  it:
    intro: >-
      Tra 2000 e 3000 anni fa, un pezzo della grande scarpata calcarea del Baltico affiorò sulle onde e rimase
      da solo. Questo è Osmussaar: un'isola di pietra, ghiaia e vento raggiungibile in barca dal porto di
      Dirhami in venti o trenta minuti. Gli svedesi d'Estonia la chiamavano Odensholm, l'isola di Odino. La
      sua riserva paesaggistica, creata nel 1996, protegge ciò che quell'isolamento ha preservato: oggetti
      geologici, uccelli e la memoria di un popolo che visse qui fino al 1944.
    landscape: >-
      Sulla costa nord puoi vedere un tratto della scarpata baltica, una falesia che percorre 1200 km di costa
      e che qui, su un'isola, si mostra da vicino. Non è una parete che rimane ferma: cambia lentamente per
      l'azione del mare. Il sud, al contrario, è basso e piatto, e lì ci sono diversi laghi, come Inahamne e
      Kappelkärre. Erano baie finché il terreno si è sollevato e le ha separate dal mare. Il sollevamento è
      ancora visibile in un dettaglio: la cappella, costruita vicino al porto, si trova oggi a un chilometro e
      mezzo da esso.


      Tra le rocce c'è qualcosa di meno comune. Quasi 60 massi di breccia gneissica provengono dall'esplosione
      di un meteorite avvenuta 535 milioni di anni fa. I più noti sono Skarvan e i Gemelli, i Kaksikud.


      La riserva riunisce lagune costiere aperte al mare, falesie, prati, torbiere basse e vecchie foreste di
      latifoglie, e tra tutti spiccano le praterie alvar — pascoli aperti sul calcare. Per mantenerle aperte,
      sull'isola pascolano bovini delle Highland scozzesi. La flora è ricca: tra il 1885 e il 1998 furono
      censite in totale 607 specie di piante vascolari, 25 delle quali protette, e di queste protette 14 sono
      orchidee. Ci sono anche 129 specie di muschi.
    wildlife: >-
      Osmussaar si trova sulla rotta migratoria dell'Atlantico orientale, attraverso cui passano milioni di
      uccelli, e i numeri lo riflettono: sono state osservate 178 specie e nel 2003 furono trovati in totale
      90 nidificanti, 63 dei quali protetti. Per questo in maggio e giugno bisogna evitare di disturbare gli
      uccelli vicino al porto sud, al Capo Boan e al lago Inahamne.


      Sull'isola vivono il [castoro](/especie/castor_fiber/), la volpe e diversi pipistrelli, e sulla costa
      puoi vedere la [foca grigia](/especie/halichoerus_grypus/). Tra gli anfibi ci sono il tritone
      punteggiato, il rospo comune e la rana di palude, e tra i rettili la biscia dal collare. Gli insetti
      contribuiscono con cifre di un'altra scala: 226 specie di macrolepidotteri e 158 di microlepidotteri.


      Se ti interessano le piante, c'è un'escursione guidata alle orchidee in cui si impara a riconoscere le
      diverse specie.
    visit: >-
      Il percorso di riferimento è il sentiero RMK, di 9 km. Inizia al porto sud e segue il cammino verso
      nord-ovest, lungo la costa di falesie. Lungo il percorso appaiono massi di breccia, laghi relitti,
      estese ghiaiete, ginepri e difese militari. Ha due pannelli informativi, uno a ciascuna estremità
      dell'isola, e sei punti di interesse. All'estremità nord-ovest si erge il faro a strisce bianche e nere,
      ammirato dall'esterno.


      Con una guida locale puoi scegliere il percorso; la camminata tradizionale è di circa 8 o 9 km e può
      durare fino a sei ore. C'è anche un percorso in auto lungo la costa, di circa 12 o 13 km, per chi non
      può camminare molto.
    history: >-
      Prima che gli ultimi svedesi d'Estonia fuggissero nel 1944, l'isola aveva un solo villaggio, Bien, di
      sette fattorie. La cappella di calcare fu consacrata nel 1766 e le battaglie del 1941 quasi la
      distrussero; oggi ne rimangono le rovine restaurate. L'attuale faro, in cemento armato e di 35 metri, fu
      completato nel 1954, dopo che nel 1941 le truppe sovietiche avevano fatto saltare il precedente. Prima,
      nella notte del 26 agosto 1914, l'incrociatore tedesco Magdeburg era incagliato al largo dell'isola e il
      suo equipaggio lo aveva fatto esplodere.


      L'isola fu sminata tra il 1996 e il 1998 ed è oggi una delle zone dell'Estonia più pulite da residui
      esplosivi. Dal 2001 vi abitano di nuovo residenti permanenti.
    before: >-
      L'arrivo va organizzato in anticipo con la fondazione dell'isola o con RMK: non ci si arriva da soli. Il
      campeggio e i fuochi sono consentiti solo nei luoghi che RMK predispone. Non è consigliato portare cani
      e bisogna evitare di disturbare le pecore. Porta con te tutti i tuoi rifiuti.
    around: >-
      Le altre riserve paesaggistiche della costa estone si trovano a una distanza simile:
      [Pakri](/lugar/pakri-maastikukaitseala/), a circa ventisei chilometri, e
      [Vormsi](/lugar/vormsi-maastikukaitseala/), a circa ventotto chilometri.
  pt:
    intro: >-
      Há entre 2000 e 3000 anos, um pedaço da grande escarpa calcária do Báltico emergiu das ondas e ficou
      sozinho. Isso é Osmussaar: uma ilha de pedra, gravilha e vento que se alcança de barco a partir do porto
      de Dirhami em vinte a trinta minutos. Os suecos da Estónia chamavam-lhe Odensholm, a ilha de Odin. A sua
      reserva paisagística, criada em 1996, protege o que esse isolamento preservou: objetos geológicos, aves
      e a memória de um povo que viveu aqui até 1944.
    landscape: >-
      Na costa norte podes ver um trecho da escarpa báltica, uma falésia que percorre 1200 km de litoral e que
      aqui, numa ilha, se mostra de perto. Não é uma parede que fique quieta: muda lentamente pela ação do
      mar. O sul, pelo contrário, é baixo e plano, e lá existem vários lagos, como Inahamne e Kappelkärre.
      Foram baías até que o terreno subiu e as separou do mar. A subida ainda é visível num pormenor: a
      capela, erguida junto ao porto, está hoje a um quilómetro e meio dele.


      Entre as rochas há algo menos habitual. Quase 60 blocos de brecha de gnaisse provêm da explosão de um
      meteorito ocorrida há 535 milhões de anos. Os mais conhecidos são Skarvan e os Gémeos, os Kaksikud.


      A reserva reúne lagoas costeiras abertas ao mar, falésias, prados, turfeiras baixas e velhas florestas
      de folhosas, e entre todos destacam-se as pastagens alvar — pastagens abertas sobre o calcário. Para que
      se mantenham abertas, na ilha pastam bovinos das Terras Altas escocesas. A flora é extensa: entre 1885 e
      1998 foram registadas em total 607 espécies de plantas vasculares, 25 delas protegidas, e destas
      protegidas 14 são orquídeas. Há também 129 espécies de musgos.
    wildlife: >-
      Osmussaar encontra-se na rota migratória do Atlântico oriental, pela qual passam milhões de aves, e os
      números refletem-no: foram observadas 178 espécies e em 2003 foram encontradas em total 90 nidificantes,
      63 das quais protegidas. Por isso em maio e junho deves evitar perturbar as aves perto do porto sul, no
      cabo Boan e no lago Inahamne.


      Em terra vivem o [castor](/especie/castor_fiber/), a raposa e vários morcegos, e na costa podes ver a
      [foca-cinzenta](/especie/halichoerus_grypus/). Entre os anfíbios há o tritão-pontuado, o sapo-comum e a
      rã-de-pântano, e entre os répteis a cobra-de-água-de-colar. Os insetos contribuem com cifras de outra
      escala: 226 espécies de macrolepidópteros e 158 de microlepidópteros.


      Se te interessam as plantas, há uma caminhada guiada de orquídeas em que se aprende a reconhecer
      diferentes espécies.
    visit: >-
      O percurso de referência é o trilho RMK, de 9 km. Começa no porto sul e segue o caminho para noroeste,
      junto à costa de falésias. Ao longo do percurso aparecem blocos de brecha, lagos relíquias, extensas
      cascalheiras, zimbros e defesas militares. Tem dois painéis informativos, um em cada extremo da ilha, e
      seis pontos de interesse. Na ponta noroeste ergue-se o farol de riscas brancas e negras, admirado por
      fora.


      Com um guia local podes escolher o percurso; a caminhada tradicional ronda os 8 ou 9 km e pode durar até
      seis horas. Há também um percurso de carro pela costa, de cerca de 12 ou 13 km, para quem não consiga
      caminhar muito.
    history: >-
      Antes de os últimos suecos da Estónia fugirem em 1944, a ilha tinha uma única aldeia, Bien, de sete
      quintas. A capela de calcário foi sagrada em 1766 e as batalhas de 1941 quase a destruíram; hoje restam
      as suas ruínas restauradas. O atual farol, de betão armado e 35 metros, foi concluído em 1954, depois de
      em 1941 as tropas soviéticas terem feito explodir o anterior. Antes, na noite do 26 de agosto de 1914, o
      cruzador alemão Magdeburg encalhou ao largo da ilha e a sua tripulação fez-o explodir.


      A ilha foi desminada entre 1996 e 1998 e é hoje uma das zonas da Estónia mais limpas de restos
      explosivos. Desde 2001 voltam a viver lá habitantes permanentes.
    before: >-
      A chegada deve ser combinada com antecedência com a fundação da ilha ou com a RMK: não se chega por
      conta própria. Só se pode acampar e fazer fogueiras nos locais que a RMK disponibiliza. Não é
      recomendado levar cães e deve evitar-se perturbar as ovelhas. Leva contigo todos os teus resíduos.
    around: >-
      As outras reservas paisagísticas da costa estónia ficam a uma distância semelhante:
      [Pakri](/lugar/pakri-maastikukaitseala/), a cerca de vinte e seis quilómetros, e
      [Vormsi](/lugar/vormsi-maastikukaitseala/), a cerca de vinte e oito quilómetros.
