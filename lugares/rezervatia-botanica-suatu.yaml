texto:
  es:
    intro: >-
      En 1916, un briólogo descubrió cerca del pueblo de Suatu una planta nueva. Se llamaba Péterfi Márton, y
      *Astragalus peterfii* acabó llevando su nombre: un endemismo local de la llanura de Transilvania que
      durante varias décadas solo se conoció de este rincón del condado de Cluj. En 1932, el profesor
      Alexandru Borza fundó aquí una reserva botánica para protegerlo en su localidad clásica. Hoy, Fânațele
      Suatu, «los henares de Suatu», es una pequeña reserva de pratoestepa que guarda lo que casi nadie
      conserva ya en la región.
    landscape: >-
      Esto fue, hasta hace poco más de un siglo, el paisaje de toda la silvoestepa de la llanura de
      Transilvania: praderas segadas a mano como henares en las tierras de cada aldea. A principios del siglo
      veinte aún se conservaban bien. Después, las innovaciones agronómicas de los años veinte las destruyeron
      o las convirtieron en tierra de cultivo o en pastos de ganado.


      Lo que queda en la reserva y en el sitio protegido que la rodea son retazos: superficies muy bien
      conservadas de hábitats esteparios, con praderas halófilas en el segmento de Budaștău. Y un problema
      nuevo: los aldeanos que mantenían la siega a mano han desaparecido de los pueblos, y desde el siglo
      veintiuno los últimos henares se degradan en grandes superficies porque se alquilan como pasto de
      ovejas.
    wildlife: >-
      Aquí se viene por las plantas. La protagonista es *Astragalus peterfii*, una planta endémica de la
      llanura de Transilvania, cuya conservación es el objetivo principal de la reserva. Durante varias
      décadas, este sitio fue la única presencia conocida de la especie; en 1962 se localizó una segunda
      población, junto al pueblo de Căianu. Figura en la Directiva de Hábitats, en la Lista Roja de la UICN y
      en las listas nacionales de Rumanía.


      Junto a ella crece *Nepeta ucranica*, que plantó el propio Alexandru Borza en el periodo de
      entreguerras, un hecho que quedó sin publicar y que explica que su población esté en su mayoría en
      estado vegetativo. Entre las plantas raras de la reserva hay también *Iris pontica*, *Astragalus
      dasyanthus* y *Ephedra distachya*; entre las pratoestepas bien conservadas del sitio, *Serratula
      lycopifolia*, *Serratula wolffii* y *Bulbocodium vernum*, especies relictas hoy muy raras en el país por
      la destrucción de su hábitat. El endemismo regional *Cephalaria radiata* completa la lista de los
      taxones más valiosos del sitio. En las praderas halófilas de Budaștău aparecen *Peucedanum officinale*,
      *Plantago cornuti* e *Iris spuria*.


      La época para verlo va de abril a junio.
    visit: >-
      Es una visita de medio día. A Suatu se llega por la carretera DJ 161H desde la DN 16 y por la DC 48
      desde Dâmburile. Dentro del sitio protegido que rodea Suatu existe la reserva natural 2.326 Fânațele
      Suatu, donde el objetivo es conservar, no usar: en las reservas naturales no se permite aprovechar los
      recursos naturales, y solo se admiten las intervenciones que protejan el objetivo de la reserva.
    history: >-
      La planta lleva el nombre de quien la encontró, y la reserva botánica se fundó en 1932 para protegerla
      en su localidad clásica. El sitio protegido que la rodea se creó para recoger los retazos de pratoestepa
      que aún quedan en el sudoeste de la llanura de Transilvania. La amenaza hoy no es el arado de los años
      veinte, sino el pastoreo de ovejas sobre prados que antes se segaban a mano.
    before: Cuenta con medio día y con la época de abril a junio.
    around: >-
      A veinticinco kilómetros están los [Prados Secos de Cluj - Reserva
      Botánica](/lugar/fanelele-clujului---rezervatie-botanica/), otra reserva botánica de pratoestepa en el
      condado de Cluj.
  en:
    intro: >-
      In 1916, a bryologist exploring the gentle hills near Suatu village discovered a flowering plant
      entirely unknown to science. His name was Péterfi Márton, and *Astragalus peterfii* would ultimately
      carry his memory: an ultra-local endemic of the Transylvanian Plain that for several decades remained
      known solely from this hillside in Cluj County. In 1932, Professor Alexandru Borza founded a botanical
      reserve here to protect it at its locus classicus. Today, Fânațele Suatu—the hay meadows of Suatu—forms
      a compact meadow-steppe sanctuary preserving a relic that has vanished almost everywhere else across the
      region.
    landscape: >-
      Until just over a century ago, this was the prevailing face of the forest-steppe across the
      Transylvanian Plain: traditional hay meadows mown by scythe on communal village lands. In the early
      twentieth century they were still well preserved. Later, the agronomic developments of the
      nineteen-twenties ploughed them up or converted them into arable farmland and intensive sheep pasture.


      What survives within the botanical reserve and the wider protected Natura site are precious fragments:
      exceptionally preserved steppe habitats, including saline meadows in the Budaștău sector. Yet a modern
      pressure has emerged: the villagers who once mowed the sward by hand have departed, and in the
      twenty-first century the remaining hay meadows suffer widespread degradation as abandoned plots are
      leased out for intensive sheep grazing.
    wildlife: >-
      The primary attraction here is botanical. The star species is *Astragalus peterfii*, an endemic legume
      restricted to the Transylvanian Plain, whose survival forms the primary purpose of the reserve. For
      decades, this hillside represented the species' only known locality, until 1962 when a second station
      was discovered near Căianu. It is listed on the EU Habitats Directive, the IUCN Red List and Romanian
      national protected flora lists.


      Alongside it grows *Nepeta ucranica*, originally introduced here by Alexandru Borza himself during the
      interwar years—an undocumented planting that explains why its local stand persists largely in a
      vegetative state. Other rare steppe plants in the reserve include *Iris pontica*, *Astragalus
      dasyanthus* and *Ephedra distachya*; within surrounding steppe grasslands flourish *Serratula
      lycopifolia*, *Serratula wolffii* and *Bulbocodium vernum*, glacial and postglacial relicts now
      critically scarce in Romania due to habitat loss. The regional endemic *Cephalaria radiata* completes
      the inventory of prized taxa. In the saline pastures of Budaștău appear *Peucedanum officinale*,
      *Plantago cornuti* and *Iris spuria*.


      The ideal period for observation runs from April to June.
    visit: >-
      A visit typically takes half a day. Suatu is reached by road DJ 161H turning off the DN 16, or via DC 48
      from Dâmburile. Within the broader protected area lies nature reserve 2,326 Fânațele Suatu, where
      management focuses strictly on conservation: no natural resource extraction or grazing is permitted, and
      only targeted habitat interventions that serve the conservation objective are allowed.
    history: >-
      The endemic plant bears the name of the botanist who first found it, and the botanical reserve was
      established in 1932 to protect its locus classicus. The surrounding protected area was subsequently
      established to gather remaining meadow-steppe enclaves in the southwestern Transylvanian Plain. Today's
      threat is no longer the ploughs of the twenties, but heavy sheep grazing on slopes that were
      historically mown by scythe.
    before: Allow half a day and visit between April and June.
    around: >-
      Twenty-five kilometres away lie the [Cluj Steppe Meadows Botanical
      Reserve](/lugar/fanelele-clujului---rezervatie-botanica/), another cherished meadow-steppe sanctuary in
      Cluj County.
  fr:
    intro: >-
      En 1916, un bryologiste découvrit près du village de Suatu une plante inconnue. Il s'appelait Péterfi
      Márton, et *Astragalus peterfii* reçut son nom : un endémisme très localisé de la plaine de Transylvanie
      qui ne fut longtemps connu que de ce coteau du județ de Cluj. En 1932, le professeur Alexandru Borza y
      fonda une réserve botanique pour le préserver dans sa localité classique. Aujourd'hui, Fânațele Suatu,
      les « foins de Suatu », est une petite réserve de prairie steppique qui préserve ce que presque personne
      n'a conservé dans la région.
    landscape: >-
      Tel était, il y a un peu plus d'un siècle, le visage de la sylvosteppe de la plaine de Transylvanie :
      des prairies fauchées à la faux pour le foin communal de chaque village. Au début du vingtième siècle,
      elles étaient encore intactes. Puis les réformes agronomiques des années vingt les ont labourées ou
      converties en cultures et en pâturages ovins.


      Ce qui subsiste dans la réserve et le site protégé attenant forme de précieux lambeaux : des milieux
      steppiques bien préservés, avec des prairies halophiles dans le vallon de Budaștău. Mais un défi nouveau
      se pose : les villageois fauchant à la main ont disparu, et au cours du vingt et unième siècle les
      derniers foins se dégradent car les parcelles sont louées pour le pâturage ovin intensif.
    wildlife: >-
      On vient ici pour la flore. L'espèce emblématique est *Astragalus peterfii*, plante endémique de la
      plaine de Transylvanie, dont la survie constitue la raison d'être de la réserve. Pendant plusieurs
      décennies, ce site fut l'unique station connue de l'espèce, avant qu'une seconde population ne soit
      découverte en 1962 près de Căianu. Elle figure à la directive Habitats, sur la Liste rouge de l'UICN et
      dans la législation roumaine.


      À ses côtés pousse *Nepeta ucranica*, plantée par Alexandru Borza lui-même dans l'entre-deux-guerres,
      une initiative non publiée qui explique que sa population végète sans fleurir abondamment. Parmi les
      raretés botaniques figurent aussi *Iris pontica*, *Astragalus dasyanthus* et *Ephedra distachya* ; dans
      les prairies steppiques environnantes croissent *Serratula lycopifolia*, *Serratula wolffii* et
      *Bulbocodium vernum*, relictes devenues très rares en Roumanie. L'endémique régionale *Cephalaria
      radiata* complète cette liste. Dans les prés salés de Budaștău s'observent *Peucedanum officinale*,
      *Plantago cornuti* et *Iris spuria*.


      La floraison optimale s'observe d'avril à juin.
    visit: >-
      La visite s'effectue en une demi-journée. On gagne Suatu par la route DJ 161H depuis la DN 16 et par la
      DC 48 depuis Dâmburile. Au sein du site protégé s'individualise la réserve naturelle 2 326 Fânațele
      Suatu, où l'objectif exclusif est la conservation : aucun prélèvement ni pâturage n'y est autorisé,
      seules les opérations d'entretien écologique étant tolérées.
    history: >-
      La plante porte le patronyme de son découvreur, et la réserve botanique a été créée en 1932 pour
      sanctuariser sa localité type. Le périmètre protégé plus vaste a été délimité pour englober les derniers
      lambeaux steppiques du sud-ouest de la plaine de Transylvanie. La menace actuelle n'est plus la charrue
      des années vingt, mais le surpâturage des moutons sur des pentes jadis fauchées à la main.
    before: Comptez une demi-journée et venez entre avril et juin.
    around: >-
      À vingt-cinq kilomètres s'étendent les [prairies steppiques de Cluj - Réserve
      botanique](/lugar/fanelele-clujului---rezervatie-botanica/), autre conservatoire de flore steppique du
      județ de Cluj.
  de:
    intro: >-
      Im Jahr 1916 entdeckte ein Moosforscher nahe dem Dorf Suatu eine der Wissenschaft völlig unbekannte
      Pflanze. Sein Name war Péterfi Márton, und *Astragalus peterfii* sollte seinen Namen tragen: ein lokaler
      Endemit der Siebenbürgischen Tiefebene, der jahrzehntelang nur von diesem Hügelzug im Kreis Cluj bekannt
      war. Im Jahr 1932 gründete Professor Alexandru Borza hier ein botanisches Reservat, um die Art an ihrem
      Locus classicus zu schützen. Heute bildet Fânațele Suatu—die Heuwiesen von Suatu—ein kompaktes
      Wiesensteppen-Schutzgebiet, das eine floristische Welt bewahrt, die andernorts längst verschwunden ist.
    landscape: >-
      So sah bis vor etwas mehr als einem Jahrhundert die Waldsteppe der Siebenbürgischen Tiefebene aus:
      extensiv mit der Sense gemähte Heuwiesen der dörflichen Gemeinschaften. Zu Beginn des zwanzigsten
      Jahrhunderts waren sie noch intakt. Die agrarischen Umbrüche der zwanziger Jahre pflügten die Steppen um
      oder machten sie zu Ackerland und Schafweiden.


      Was im Reservat und im umgebenden Schutzgebiet überlebt hat, sind kostbare Reste: hervorragend erhaltene
      Steppenhabitate mit Salzrasen im Talabschnitt von Budaștău. Doch ein neues Problem droht: Die Bauern,
      die früher von Hand mähten, sind abgewandert, und im einundzwanzigsten Jahrhundert verarmen die letzten
      Heuwiesen, weil Flächen an Schafhalter verpachtet werden.
    wildlife: >-
      Man besucht diesen Ort der Pflanzen wegen. Die Hauptart ist *Astragalus peterfii*, ein Steppen-Tragant,
      der nur in der Siebenbürgischen Tiefebene heimisch ist. Über Jahrzehnte hinweg war dieser Hang das
      einzige bekannte Vorkommen weltweit, bis 1962 ein zweiter Bestand bei Căianu nachgewiesen wurde. Die Art
      ist in der FFH-Richtlinie, auf der Roten Liste der IUCN und im rumänischen Artenschutz verzeichnet.


      Neben ihr wächst die Ukrainische Katzenminze *Nepeta ucranica*, die Alexandru Borza in der
      Zwischenkriegszeit selbst anpflanzte—eine unveröffentlichte Maßnahme, die erklärt, warum der Bestand
      meist vegetativ bleibt. Zu den botanischen Kostbarkeiten gehören ferner *Iris pontica*, *Astragalus
      dasyanthus* und *Ephedra distachya*; in den Wiesensteppen stehen *Serratula lycopifolia*, *Serratula
      wolffii* und *Bulbocodium vernum*, eiszeitliche Reliktarten, die durch Biotopverlust extrem selten
      geworden sind. Der Regionalendemit *Cephalaria radiata* ergänzt die Liste. In den Salzfluren von
      Budaștău finden sich *Peucedanum officinale*, *Plantago cornuti* und *Iris spuria*.


      Die beste Beobachtungszeit liegt zwischen April und Juni.
    visit: >-
      Der Besuch nimmt etwa einen halben Tag in Anspruch. Suatu erreichst du über die Landstraße DJ 161H ab
      der DN 16 und über die DC 48 ab Dâmburile. Im geschützten Gebiet liegt das Naturschutzgebiet 2.326
      Fânațele Suatu, in dem strikter Artenschutz gilt: Eine wirtschaftliche Nutzung ist untersagt, lediglich
      gezielte Erhaltungsmaßnahmen sind erlaubt.
    history: >-
      Die Art trägt den Namen ihres Entdeckers, und das Schutzgebiet wurde 1932 gegründet, um ihren Locus
      classicus dauerhaft zu sichern. Das umgebende Schutzgebiet fasst die letzten Steppenwiesen im Südwesten
      der Siebenbürgischen Tiefebene zusammen. Die Gefahr von heute ist nicht mehr der Pflug der zwanziger
      Jahre, sondern die intensive Schafbeweidung ehemals handgemähter Hänge.
    before: Plane einen halben Tag ein und wähle die Monate April bis Juni zur Blütezeit.
    around: >-
      Fünfundzwanzig Kilometer entfernt liegen die [Trockenrasen von Cluj - Botanisches
      Reservat](/lugar/fanelele-clujului---rezervatie-botanica/), ein weiteres Refugium pontischer
      Steppenvegetation im Kreis Cluj.
  it:
    intro: >-
      Nel 1916 un briologo scoprì nei pressi del villaggio di Suatu una specie vegetale sconosciuta. Si
      chiamava Péterfi Márton, e *Astragalus peterfii* finì per portare il suo nome: un endemismo esclusivo
      della pianura transilvana rimasto per decenni confinato a questo solo pendio del distretto di Cluj. Nel
      1932 il professor Alexandru Borza istituì qui una riserva botanica per tutelarlo nella sua località
      classica. Oggi Fânațele Suatu, i «prati da fieno di Suatu», costituisce una preziosa riserva di
      steppa-prato che conserva ciò che è andato perduto altrove.
    landscape: >-
      Fino a poco più di un secolo fa, questo era il paesaggio consueto della steppa alberata transilvana:
      prati falciati a mano per ricavare il fieno nei fondi di ciascun villaggio. All'inizio del ventesimo
      secolo apparivano ancora intatti. Successivamente, le trasformazioni agronomiche degli anni venti li
      dissodarono per farne seminativi o pascoli per greggi.


      Quel che sopravvive nella riserva e nel sito circostante sono preziosi frammenti: habitat steppici ben
      preservati, con lembi alofili nel settore di Budaștău. Ma un nuovo problema incombe: gli abitanti che
      falciavano a mano sono scomparsi e nel ventunesimo secolo i prati residui si degradano poiché affittati
      al pascolo intensivo di pecore.
    wildlife: >-
      La ragione principale della visita risiede nella flora. La specie principe è *Astragalus peterfii*,
      leguminosa endemica della pianura di Transilvania, la cui tutela è l'obiettivo fondante dell'area. Per
      lungo tempo questa collina è stata l'unica stazione accertata, finché nel 1962 non venne individuata una
      seconda popolazione presso Căianu. È inserita nella direttiva Habitat, nella Lista Rossa IUCN e nelle
      normative rumene.


      Accanto a essa vegeta *Nepeta ucranica*, piantata da Alexandru Borza nel periodo tra le due guerre, un
      intervento non documentato che spiega lo stato prevalentemente vegetativo degli individui. Tra le rarità
      botaniche figurano *Iris pontica*, *Astragalus dasyanthus* ed *Ephedra distachya*; nelle steppe-prato
      compaiono *Serratula lycopifolia*, *Serratula wolffii* e *Bulbocodium vernum*, relitti oggi assai rari
      in Romania per la scomparsa del loro habitat. L'endemismo regionale *Cephalaria radiata* arricchisce
      l'elenco. Nei prati salmastri di Budaștău si trovano *Peucedanum officinale*, *Plantago cornuti* e *Iris
      spuria*.


      Il momento migliore per osservarle cade tra aprile e giugno.
    visit: >-
      La visita impegna mezza giornata. A Suatu si arriva lungo la strada DJ 161H imboccandola dalla DN 16 e
      tramite la DC 48 da Dâmburile. Nel perimetro tutelato si trova la riserva naturale 2.326 Fânațele Suatu,
      votata esclusivamente alla conservazione: non è consentito alcun prelievo né pascolo, ammettendo solo
      interventi finalizzati alla salvaguardia della specie.
    history: >-
      La pianta prende il nome dal suo scopritore e la riserva botanica fu istituita nel 1932 per preservarne
      il locus classicus. Il perimetro circostante è stato creato per tutelare i lembi residui di steppa-prato
      nella pianura transilvana sud-occidentale. La minaccia attuale non è più l'aratro degli anni venti, ma
      il pascolo ovino su versanti un tempo falciati a mano.
    before: Prevedi mezza giornata e visita tra aprile e giugno.
    around: >-
      A venticinque chilometri sorgono i [Prati Steppici di Cluj - Riserva
      Botanica](/lugar/fanelele-clujului---rezervatie-botanica/), altro presidio di flora steppica nel
      distretto di Cluj.
  pt:
    intro: >-
      Em 1916, um briólogo descobriu junto à aldeia de Suatu uma planta desconhecida para a ciência.
      Chamava-se Péterfi Márton, e *Astragalus peterfii* viria a eternizar o seu nome: um endemismo restrito
      da planície da Transilvânia que durante várias décadas apenas se conheceu deste morro do distrito de
      Cluj. Em 1932, o professor Alexandru Borza fundou aqui uma reserva botânica para salvaguardar a espécie
      na sua localidade clássica. Hoje, Fânațele Suatu, «os fenais de Suatu», constitui uma reserva de
      estepe-pradaria que conserva o que quase desapareceu da região.
    landscape: >-
      Até há pouco mais de um século, este era o traço característico da floresta-estepe da planície
      transilvana: prados de feno ceifados à foice pelas comunidades aldeãs. No início do século vinte ainda
      se mantinham intocados. Depois, as transformações agrícolas dos anos vinte arrotearam-nos para culturas
      cerealíferas ou pastoreio de ovelhas.


      O que resta na reserva e no sítio contíguo são retalhos preciosos: parcelas de estepe bem preservadas,
      com prados salgadiços no setor de Budaștău. Mas surgiu uma nova ameaça: os camponeses que ceifavam à mão
      deixaram as aldeias e, no século vinte e um, os fenais remanescentes degradam-se pelo sobrepastoreio
      ovino intensivo.
    wildlife: >-
      O grande motivo de visita são as plantas raras. A estrela é *Astragalus peterfii*, leguminosa endémica
      da planície da Transilvânia cuja preservação inspirou a reserva. Durante décadas, este local foi a sua
      única estação conhecida, até que em 1962 se descobriu um segundo núcleo perto de Căianu. Consta da
      Diretiva Habitats, da Lista Vermelha da UICN e das leis de conservação romenas.


      Ao seu lado cresce *Nepeta ucranica*, introduzida pelo próprio Alexandru Borza no período
      entreguerras—um registo não publicado que explica o predomínio vegetativo dos exemplares. Entre as
      raridades botânicas contam-se *Iris pontica*, *Astragalus dasyanthus* e *Ephedra distachya*; nas
      estepe-pradarias surgem *Serratula lycopifolia*, *Serratula wolffii* e *Bulbocodium vernum*, relíquias
      glaciares muito raras na Roménia devido à destruição de habitats. O endemismo regional *Cephalaria
      radiata* enriquece o património botânico. Nos prados halófilos de Budaștău ocorrem *Peucedanum
      officinale*, *Plantago cornuti* e *Iris spuria*.


      A época ideal de observação vai de abril a junho.
    visit: >-
      A visita realiza-se em meio dia. A Suatu chega-se pela estrada DJ 161H a partir da DN 16 e pela DC 48 a
      partir de Dâmburile. Dentro da área protegida situa-se a reserva natural 2 326 Fânațele Suatu, com
      objetivos estritos de conservação: não é permitida qualquer exploração ou pastoreio, admitindo-se apenas
      intervenções de salvaguarda dos habitats.
    history: >-
      A planta adotou o nome de quem a encontrou e a reserva foi estabelecida em 1932 para proteger o seu
      locus classicus. O sítio protegido em redor foi delimitado para congregar os últimos retalhos de
      estepe-pradaria no sudoeste da planície da Transilvânia. A ameaça contemporânea já não é o arado dos
      anos vinte, mas o pastoreio ovino em vertentes outrora ceifadas à mão.
    before: Reserva meio dia e visita o local entre abril e junho para apreciar as florações.
    around: >-
      A vinte e cinco quilómetros ficam os [Prados Secos de Cluj - Reserva
      Botânica](/lugar/fanelele-clujului---rezervatie-botanica/), outro relicto de flora estépica no distrito
      de Cluj.
