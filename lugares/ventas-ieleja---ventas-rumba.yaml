resumen:
  es: Alberga Ventas Rumba, la cascada más ancha de Europa (249 metros de ancho de piedra caliza).
  en: Home to Ventas Rumba, Europe's widest waterfall (249 metres wide across a natural dolomite ledge).
  fr: Abrite Ventas Rumba, la cascade la plus large d'Europe (249 mètres de large sur un seuil de dolomie).
  de: >-
    Beherbergt Ventas Rumba, den breitesten Wasserfall Europas (249 Meter Breite über einer natürlichen
    Dolomitkante).
  it: Custodisce Ventas Rumba, la cascata più ampia d'Europa (249 metri di larghezza su un gradino di dolomia).
  pt: >-
    Alberga Ventas Rumba, a cascata mais larga da Europa (249 metros de largura sobre uma bancada natural de
    dolomite).
unico:
  es: >-
    Según el caudal, el agua cubre la cornisa de dolomía por completo o solo en parte, y cada primavera los
    peces la saltan.
  en: >-
    Depending on seasonal river flow, water cascades across the dolomite ledge entirely or in ribboned
    sections, leaped every spring by migrating fish.
  fr: >-
    Selon le débit fluvial, l'eau nappe entièrement le rebord dolomitique ou s'y écoule en rideaux, franchie
    chaque printemps par les poissons sauteurs.
  de: >-
    Je nach Wasserstand überströmt der Fluss die Dolomitbank vollständig oder in Bändern, im Frühjahr
    spektakulär von Fischen übersprungen.
  it: >-
    A seconda della portata, l'acqua copre per intero o a veli il gradone dolomitico, risalito ogni primavera
    da pesci saltatori.
  pt: >-
    Consoante o caudal, as águas cobrem a cornija dolomítica por completo ou em cortinas, transposta em cada
    primavera por peixes saltadores.
observaciones:
  es: >-
    Una norma fija y sencilla: lo que traigas, te lo llevas, y si ves basura de otros, recógela. Comprueba
    antes de ir el estado de los senderos y las restricciones vigentes en la reserva.
texto:
  es:
    intro: >-
      Un río entero cayendo de orilla a orilla sobre un escalón de piedra. Ventas Rumba es la cascada más
      ancha de Europa, y no cae desde lo alto: el Venta se despeña apenas dos metros sobre una cornisa de
      dolomía, en pleno Kuldīga, en la región de Kurzeme. A su alrededor se extiende la reserva natural del
      valle del Venta, con sus afloramientos de roca, sus bosques de ladera y sus senderos junto al agua.
    landscape: >-
      Todo empieza en el fondo del valle, donde una capa densa de dolomía, con restos de corales y
      estromatolitos, resiste mejor que las rocas de debajo. El río arranca las capas más blandas y deja la
      dura asomando en un escalón que cruza todo el cauce. Eso explica por qué Ventas Rumba está donde está.
      Es un monumento natural geológico y geomorfológico, y se levanta en la llanura de Pieventa (Kursa), en
      el antiguo valle del Venta.


      La cascada no está quieta. La parte de abajo de la dolomía es más frágil y se erosiona antes, de modo
      que la de arriba queda colgando y a veces se desploma. Por eso, con los años, el centro del escalón
      retrocede despacio río arriba. En las orillas, los afloramientos enseñan los estratos de la dolomía, con
      fósiles sueltos y formaciones minerales como estromatolitos y drusas de calcita.


      El valle es más que la cascada. Las orillas se visten de bosques de ladera y de barranco, hay praderas
      secas sobre suelo calcáreo y afloramientos de arenisca. En la reserva hay quince hábitats europeos
      protegidos.
    wildlife: >-
      El gran espectáculo es un salto. El Venta es famoso por sus peces voladores, que brincan sobre la
      cascada en busca de mejores zonas de freza río arriba: en primavera la [vimba](/especie/vimba_vimba/), y
      en otoño el [salmón](/especie/salmo_salar/). Por eso mayo es buen momento para ir a ver la vimba. En el
      río viven también truchas, lampreas, lucios, brecas, rutilos, tencas y carpas.


      Lo que pasa a su alrededor no desmerece. En el recorrido por la reserva se pueden observar águilas
      pescadoras, aguiluchos laguneros y martines pescadores, además de mariposas macaón. Las zonas con
      carrizo y las orillas cubiertas de arbustos son las mejores para observar aves. Entre las especies raras
      observadas figuran también el cisne cantor y el águila real.
    visit: >-
      Empieza por el sendero de la orilla izquierda: son 2,4 km fáciles junto al río hasta el puente nuevo de
      Kuldīga, con aves, el cauce y la cascada a la vista. Puedes volver por el mismo camino o seguir por un
      circuito de 5,4 km. Más corto aún es el paseo del parque de Pārventa, con vistas sobre el Venta hacia el
      casco antiguo, la cascada del Alekšupīte, los molinos del castillo y el viejo puente de ladrillo.


      Para una jornada completa existe la Health Route: un circuito de 7 km de dificultad baja que pasa por
      Pārventa y ofrece varios miradores de la cascada, entre ellos el puente de ladrillo. El valle sirve
      también para pasear, ir en bici y, en invierno, esquiar, en cualquier estación del año.
    history: >-
      Kuldīga nació aquí porque la cascada cortaba la ruta medieval de navegación interior del Venta. Durante
      siglos se intentó rodearla. A mediados del siglo XVII, el duque de Curlandia Jacob Kettler quiso excavar
      un desvío por la orilla derecha, pero la dolomía era demasiado dura. En primavera el agua aún entra en
      ese canal poco profundo y forma la isla de Martin. Entre los siglos XVII y XIX se abrió en distintas
      épocas otro canal para rodear la cascada, pero el gestor señala que quedó sin acabar. En la cresta de la
      cascada se tallaron además varios canales para capturar peces, y el río sirvió para flotar madera hasta
      mediados de los años sesenta del siglo XX.


      El folclore tiene su versión: un diablo, asustado por los gallos, soltó sus piedras sobre el río y formó
      el umbral. Cerca queda el castro de Veckuldīga, el mayor conocido de la comarca.


      El valle es reserva natural desde 1957 y forma parte de la red Natura 2000 desde 2004. Se creó para
      conservar la diversidad de hábitats, las especies raras y el paisaje. Hoy el gestor cuida el río:
      restauró rápidos en más de seis hectáreas, en un tramo de unos tres kilómetros, y los nuevos rápidos
      sirven de zona de freza a los salmónidos. El trabajo terminó cuando Kuldīga entró en la lista del
      Patrimonio Mundial de la UNESCO. Se prevé vigilar el estado del río al menos hasta 2028.
    before: >-
      Una norma fija y sencilla: lo que traigas, te lo llevas, y si ves basura de otros, recógela. Comprueba
      antes de ir el estado de los senderos y las restricciones vigentes en la reserva.
    around: >-
      El [Parque Natural del Antiguo Valle del Abava](/lugar/abavas-senlejas-dabas-parks/) está a 1 km. Y
      lejos, en el mismo país, el [Parque Natural del Valle del Salaca](/lugar/salacas-ielejas-dabas-parks/)
      comparte con este valle el salmón y su condición de corredor fluvial.
  en:
    intro: >-
      An entire river plunging from bank to bank across a low stone step. Ventas Rumba is Europe's widest
      waterfall, yet it does not tumble from lofty heights: the Venta river drops barely two metres over a
      horizontal dolomite ledge in the very heart of Kuldīga, in the historical region of Kurzeme. Surrounding
      the rapids stretches the Venta Valley Nature Reserve, featuring dolomite bluffs, slope woodlands and
      peaceful trails hugging the water.
    landscape: >-
      The phenomenon begins in the riverbed, where a dense Upper Devonian dolomite layer packed with fossil
      corals and stromatolites resists erosion far better than the softer rocks beneath. As the river carves
      out the weaker substrate, the durable dolomite remains as a continuous shelf spanning the entire
      channel. This geological structure explains why Ventas Rumba exists where it does. Designated a
      geological and geomorphological natural monument, it lies within the ancient Venta meltwater valley on
      the Pieventa lowland.


      The waterfall is not static. The softer layers beneath the dolomite erode first, leaving the hard upper
      lip unsupported until it fractures and collapses. Consequently, the crest line slowly migrates upstream
      over centuries. Along the banks, bedrock exposures reveal dolomite strata containing solitary fossils
      and mineral druses of calcite and pyrite.


      The valley encompasses more than its cataract. The banks are cloaked in ravine and slope forests,
      calcareous dry grasslands and sandstone outcrops. Fifteen protected European habitats are safeguarded
      within the reserve.
    wildlife: >-
      The crowning spectacle is an airborne leap. The Venta is famous for its «flying fish», which leap the
      falls seeking headwater spawning grounds: in spring the [zarte](/especie/vimba_vimba/), and in autumn
      the [Atlantic salmon](/especie/salmo_salar/). For this reason, May is the premier month to watch the
      migrating vimba. The river also supports brown trout, river lamprey, northern pike, bream, roach, tench
      and carp.


      The surrounding habitats are equally rewarding. Walking through the reserve, visitors can spot ospreys,
      western marsh harriers and common kingfishers, alongside swallowtail butterflies. Reedy margins and
      willow-lined banks offer the best birdwatching. Rarer sightings include whooper swans and golden eagles.
    visit: >-
      Begin on the left bank trail: an easy 2.4 km riverside walk reaching Kuldīga's new bridge, offering
      continuous views of the riverbed and waterfall. You can retrace your steps or extend your hike into a
      5.4 km loop. Even shorter is the stroll through Pārventa park, taking in views across the Venta toward
      the old town, the Alekšupīte cascade, the castle mills and the historic red-brick bridge.


      For a full day's exploration, the Health Route forms a gentle 7 km circular route passing through
      Pārventa with several viewpoints of the falls and brick bridge. The valley is equally suited for
      walking, cycling and, in winter, cross-country skiing across all seasons.
    history: >-
      Kuldīga arose here because the waterfall severed medieval inland navigation along the Venta. For
      centuries, engineers attempted to bypass it. In the mid-seventeenth century, Duke Jacob Kettler of
      Courland sought to blast a canal along the right bank, but the dolomite proved too stubborn. In spring,
      high water still flows through this shallow channel, creating Martin's Island. Between the seventeenth
      and nineteenth centuries another bypass canal was attempted but remained unfinished. Channels were also
      carved into the ledge to set fish traps, and log driving continued until the mid-nineteen-sixties.


      Local folklore attributes the falls to a startled devil who dropped his stones into the current. Nearby
      rises the Veckuldīga hillfort, the largest ancient Curonian settlement in the region.


      The valley has been protected as a nature reserve since 1957 and incorporated into the Natura 2000
      network since 2004. Management has restored gravel rapids over more than six hectares across a
      three-kilometre stretch, providing vital spawning grounds for salmonids. The restoration culminated as
      Kuldīga was inscribed on the UNESCO World Heritage List. River monitoring is funded through at least
      2028.
    before: >-
      A simple standing rule: whatever you bring into the reserve, carry back out, and collect any litter left
      by others. Check trail conditions and local reserve regulations before setting out.
    around: >-
      The [Abava Ancient River Valley Nature Park](/lugar/abavas-senlejas-dabas-parks/) lies just 1 km away.
      Further afield within Latvia, the [Salaca Valley Nature Park](/lugar/salacas-ielejas-dabas-parks/)
      shares with this valley its salmon runs and river-corridor ecology.
  fr:
    intro: >-
      Une rivière entière chutant d'une rive à l'autre sur une marche de pierre. Ventas Rumba est la cascade
      la plus large d'Europe, sans pour autant tomber de haut : la Venta s'effondre d'à peine deux mètres sur
      un gradin dolomitique, en plein cœur de Kuldīga, dans la région de Kurzeme. Autour d'elle s'étend la
      réserve naturelle de la vallée de la Venta, avec ses affleurements rocheux, ses forêts de pente et ses
      chemins au bord de l'eau.
    landscape: >-
      Tout commence au fond du lit, où un banc dense de dolomie, riche en fossiles de coraux et stromatolites,
      résiste mieux à l'érosion que les roches sous-jacentes. Le fleuve déblaie les couches tendres et laisse
      la strate dure saillir en un seuil barrant tout le cours d'eau. Cela explique la présence de Ventas
      Rumba. Monument naturel géologique et géomorphologique, il s'élève dans la plaine de Pieventa, dans
      l'ancienne vallée glaciaire de la Venta.


      La cascade n'est pas figée. La base de la dolomie, plus friable, s'use en premier, de sorte que le
      rebord supérieur surplombe le vide et finit par céder. Ainsi, au fil des siècles, le centre de la
      corniche recule lentement vers l'amont. Sur les berges, les escarpements découvrent des strates
      dolomitiques truffées de fossiles et de géodes de calcite.


      La vallée dépasse le seul attrait de sa chute. Les berges se parent de forêts de ravin, de pelouses
      sèches sur calcaire et d'abrupts gréseux. La réserve protège quinze habitats d'intérêt communautaire.
    wildlife: >-
      Le grand spectacle est un envol aquatique. La Venta est réputée pour ses poissons volants, bondissant
      par-dessus le seuil rocheux pour atteindre leurs frayères d'amont : au printemps la
      [vimbe](/especie/vimba_vimba/), et à l'automne le [saumon atlantique](/especie/salmo_salar/). C'est
      pourquoi le mois de mai est idéal pour contempler ce saut migratoire. La rivière abrite aussi truites,
      lamproies, brochets, brèmes, gardons, tanches et carpes.


      Les abords ne sont pas en reste. Lors d'une promenade, on observe balbuzards pêcheurs, busards des
      roseaux et martins-pêcheurs, sans oublier le machaon. Les cariçaies et les berges buissonneuses
      constituent les meilleurs postes ornithologiques. Cygnes chanteurs et aigles royaux y sont parfois
      signalés.
    visit: >-
      Commencez par le sentier de la rive gauche : 2,4 km faciles au fil de l'eau jusqu'au nouveau pont de
      Kuldīga, avec vue constante sur le fleuve et la chute. Vous pouvez revenir sur vos pas ou poursuivre par
      une boucle de 5,4 km. Plus court encore est le parc de Pārventa, offrant un panorama sur la vieille
      ville, la cascade de l'Alekšupīte, les moulins et le vieux pont de briques.


      Pour une sortie complète, la Route de la Santé propose un circuit de 7 km de faible difficulté passant
      par Pārventa et plusieurs belvédères. La vallée se prête à la marche, au vélo et, l'hiver, au ski de
      fond en toute saison.
    history: >-
      Kuldīga est née ici parce que la chute interrompait la navigation fluviale médiévale sur la Venta.
      Durant des siècles, on tenta de la contourner. Au milieu du XVIIe siècle, le duc Jacob Kettler de
      Courlande voulut creuser un canal sur la rive droite, mais la roche résista. Au printemps, les eaux
      s'engouffrent encore dans cette tranchée et forment l'île Martin. D'autres tentatives eurent lieu entre
      les XVIIe et XIXe siècles sans aboutir. Des nasses furent creusées dans la roche, et le flottage du bois
      persista jusqu'au milieu des années soixante du XXe siècle.


      Une légende raconte qu'un diable surpris par le chant du coq laissa choir ses pierres dans le lit du
      fleuve. Tout près s'élève le castro de Veckuldīga, le plus vaste de la contrée.


      La vallée est réserve naturelle depuis 1957 et intégrée à Natura 2000 depuis 2004. Les gestionnaires y
      ont restauré des radiers sur plus de six hectares et trois kilomètres pour faciliter la reproduction des
      salmonidés. Kuldīga est aujourd'hui inscrite au patrimoine mondial de l'UNESCO. Le suivi écologique est
      prévu jusqu'en 2028 au moins.
    before: >-
      Une règle d'or : remportez tous vos déchets, et si vous en trouvez, ramassez-les. Renseignez-vous sur
      l'état des sentiers et les arrêtés municipaux avant de partir.
    around: >-
      Le [parc naturel de l'ancienne vallée de l'Abava](/lugar/abavas-senlejas-dabas-parks/) se trouve à 1 km.
      Plus loin, le [parc naturel de la vallée de la Salaca](/lugar/salacas-ielejas-dabas-parks/) partage les
      montaisons de saumons et le rôle de couloir biologique.
  de:
    intro: >-
      Ein ganzer Fluss stürzt von Ufer zu Ufer über eine Felsstufe. Ventas Rumba ist der breiteste Wasserfall
      Europas, fällt jedoch nicht aus schwindelnder Höhe: Die Venta stürzt kaum zwei Meter über ein
      Dolomitband, mitten im Zentrum von Kuldīga in der Region Kurzeme. Rundherum erstreckt sich das
      Naturschutzgebiet Venta-Tal mit Felswänden, Hangwäldern und Uferwegen.
    landscape: >-
      Alles beginnt im Flussbett, wo eine dichte Dolomitschicht mit fossilen Korallen und Stromatolithen der
      Verwitterung besser trotzt als das darunterliegende Gestein. Die Strömung räumt weichere Lagen aus und
      lässt die harte Bank quer über das Flussbett als Schwelle stehen. Das erklärt, warum Ventas Rumba genau
      hier liegt. Als geologisches und geomorphologisches Naturdenkmal gehört es zum Urstromtal der Venta in
      der Tiefebene von Pieventa.


      Der Wasserfall steht nicht still. Der untere Teil des Dolomits verwittert rascher, sodass die Oberkante
      überhängt und periodisch abbricht. So wandert die Kante über die Jahrhunderte langsam flussaufwärts. An
      den Ufern legen Felsaufschlüsse die Schichtung des Dolomits frei, mit Fossilien und Calcitdrusen.


      Das Tal bietet weit mehr als die Stromschnelle. An den Hängen wachsen Schluchtwälder, Trockenrasen über
      Kalk und Sandsteinwände. Fünfzehn geschützte europäische Lebensräume liegen im Reservat.
    wildlife: >-
      Das größte Schauspiel ist ein Sprung. Die Venta ist berühmt für ihre «fliegenden Fische», die
      flussaufwärts zu ihren Laichplätzen streben: im Frühjahr die [Zährte](/especie/vimba_vimba/) und im
      Herbst der [Atlantische Lachs](/especie/salmo_salar/). Deshalb ist der Mai die beste Zeit, um die
      Zährten zu sehen. Im Fluss leben zudem Forellen, Neunaugen, Hechte, Brachsen, Plötzen, Schleien und
      Karpfen.


      Auch die Vogelwelt ist bemerkenswert. Entlang der Routen lassen sich Fischadler, Rohrweihen und Eisvögel
      sowie Schwalbenschwänze beobachten. Schilf- und Weidenufer bieten beste Beobachtungsmöglichkeiten;
      gelegentlich rasten Singschwäne und Steinadler.
    visit: >-
      Beginne auf dem linken Uferweg: 2,4 km leichtes Gehen entlang des Wassers bis zur neuen Brücke von
      Kuldīga mit Blick auf Flussbett und Wasserfall. Du kannst umkehren oder die Runde auf 5,4 km erweitern.
      Kürzere Spaziergänge bietet der Park Pārventa mit Aussicht auf Altstadt, Alekšupīte-Wasserfall,
      Schlossmühlen und die alte Ziegelbrücke.


      Für einen ganzen Tag eignet sich die Health Route: ein 7 km langer Rundweg geringer Schwierigkeit durch
      Pārventa mit mehreren Aussichtspunkten. Das Tal lädt ganzjährig zum Spazieren, Radfahren und im Winter
      zum Skilanglauf ein.
    history: >-
      Kuldīga entstand an diesem Punkt, weil der Wasserfall die mittelalterliche Binnenschifffahrt auf der
      Venta unterbrach. Über Jahrhunderte versuchte man, ihn zu umgehen. Mitte des siebzehnten Jahrhunderts
      wollte Herzog Jakob Kettler von Kurland einen Kanal am rechten Ufer graben, doch das Dolomitgestein war
      zu widerstandsfähig. Im Frühjahr strömt noch immer Wasser durch die Rinne und bildet Martins Insel.
      Zwischen dem siebzehnten und neunzehnten Jahrhundert wurde ein weiterer Kanal begonnen, blieb jedoch
      unvollendet. In die Felskante wurden Fischfänge gemeißelt, und Flößerei wurde bis Mitte der sechziger
      Jahre des zwanzigsten Jahrhunderts betrieben.


      Der Volksmund erzählt von einem Teufel, der beim Hahnenschrei seine Steine in den Fluss fallen ließ.
      Nahebei liegt der Burgberg Veckuldīga, die größte Wallburg der Region.


      Das Tal ist seit 1957 Naturschutzgebiet und seit 2004 Teil von Natura 2000. Zur Förderung der
      Salmonidenlaichplätze wurden Stromschnellen auf über sechs Hektar und drei Kilometern renaturiert.
      Kuldīga zählt zum UNESCO-Welterbe; die Umweltüberwachung ist bis mindestens 2028 gesichert.
    before: >-
      Einfache Regel: Was du mitbringst, nimmst du wieder mit; Müll anderer bitte einsammeln. Informiere dich
      vorab über Wegeszustand und Schutzbestimmungen.
    around: >-
      Der [Naturpark Urstromtal der Abava](/lugar/abavas-senlejas-dabas-parks/) liegt 1 km entfernt. Weiter
      entfernt teilt der [Naturpark Salaca-Tal](/lugar/salacas-ielejas-dabas-parks/) den Lachsbestand und den
      Charakter als Flusstal-Korridor.
  it:
    intro: >-
      Un intero fiume che precipita da sponda a sponda lungo un gradino di pietra. Ventas Rumba è la cascata
      più larga d'Europa, pur senza gettarsi da grandi altezze: il Venta scende di appena due metri sopra una
      bancata dolomitica nel cuore di Kuldīga, nella regione della Curlandia. Attorno si sviluppa la riserva
      naturale della valle del Venta, con pareti rocciose, boschi di forra e sentieri lungo il pelo
      dell'acqua.
    landscape: >-
      Tutto ha origine sul fondo dell'alveo, dove un compatto strato dolomitico ricco di fossili corallini
      resiste all'erosione assai meglio dei sedimenti sottostanti. La corrente scalza le rocce tenere
      lasciando sporgere il ripiano duro che taglia l'intero corso d'acqua. È un monumento naturale geologico
      e geomorfologico inserito nell'antico solco fluviale della pianura di Pieventa.


      La cascata non è immobile. La base friabile cede per prima, lasciando la cornice superiore a sbalzo
      finché non crolla. Così, nei secoli, il fronte regredisce lentamente verso monte. Lungo le rive gli
      affioramenti mostrano gli strati della dolomia con fossili e geodi di calcite.


      La valle offre molto più del salto d'acqua: i versanti accolgono foreste di pendio e forra, praterie
      aride su substrato calcareo e falesie di arenaria. La riserva tutela quindici habitat protetti di
      interesse comunitario.
    wildlife: >-
      Lo spettacolo sommo è un balzo fuor d'acqua. Il Venta è celebre per i suoi pesci volanti che saltano la
      soglia per risalire alle aree di riproduzione: in primavera la [*Vimba vimba*](/especie/vimba_vimba/) e
      in autunno il [salmone atlantico](/especie/salmo_salar/). Maggio è il periodo d'elezione per ammirare la
      vimba. Nel fiume vivono anche trote, lamprede, lucci, abramidi, cavedani, tinche e carpe.


      I dintorni riservano altrettanto fascino. Lungo i sentieri si osservano falchi pescatori, falchi di
      palude, martin pescatori e farfalle macaone. I canneti e le rive boscose costituiscono le postazioni
      ideali per il birdwatching; tra le specie rare compaiono cigno selvatico e aquila reale.
    visit: >-
      Inizia dal tracciato sulla sponda sinistra: 2,4 km pianeggianti lungo il fiume fino al ponte nuovo di
      Kuldīga, con visuale continua su salto e alveo. Puoi rientrare per la stessa via o completare un
      circuito di 5,4 km. Più breve è la passeggiata nel parco di Pārventa con scorci sul centro storico, la
      cascata dell'Alekšupīte e il ponte ottocentesco in mattoni.


      Per un'intera giornata la Health Route disegna un anello di 7 km di bassa difficoltà toccando vari punti
      panoramici. La valle è ideale per passeggiate a piedi, cicloturismo e, nella stagione fredda, sci di
      fondo.
    history: >-
      Kuldīga nacque qui proprio perché la cascata interrompeva la navigazione medievale lungo il Venta. Nel
      XVII secolo il duca Jacob Kettler di Curlandia tentò di scavare un canale sul lato destro, ma la dolomia
      era troppo dura; in primavera le piene allagano ancora quella trincea creando l'isola di Martin. Altri
      canali furono avviati tra il XVII e il XIX secolo senza compimento. Si scolpirono vasche per catturare
      pesci e la fluitazione del legname proseguì sino a metà degli anni sessanta del Novecento.


      La leggenda narra di un diavolo spaventato dal gallo che lasciò cadere i massi nell'alveo. Vicino sorge
      il castelliere di Veckuldīga, il maggiore della regione.


      La valle è riserva naturale dal 1957 e parte di Natura 2000 dal 2004. Sono stati riqualificati fondali
      ghiaiosi su oltre sei ettari e tre chilometri per favorire la frega dei salmonidi. Kuldīga è patrimonio
      mondiale UNESCO; il monitoraggio è pianificato almeno fino al 2028.
    before: >-
      Regola inderogabile: riporta con te ogni rifiuto e raccogli quelli abbandonati. Verifica lo stato dei
      sentieri e le norme del parco prima di partire.
    around: >-
      Il [Parco naturale dell'antica valle dell'Abava](/lugar/abavas-senlejas-dabas-parks/) dista appena 1 km.
      Più lontana, la [Valle del fiume Salaca](/lugar/salacas-ielejas-dabas-parks/) condivide la risalita dei
      salmoni e la funzione di corridoio fluviale.
  pt:
    intro: >-
      Um rio inteiro a precipitar-se de margem a margem sobre um degrau de pedra. Ventas Rumba é a cascata
      mais larga da Europa, sem cair de grandes alturas: o rio Venta despenha-se apenas dois metros sobre uma
      cornija de dolomite, em pleno centro de Kuldīga, na região de Kurzeme. Em redor estende-se a reserva
      natural do vale do Venta, com escarpas rochosas, bosques de encosta e trilhos pedestres junto à água.
    landscape: >-
      Tudo nasce no fundo do leito, onde uma densa camada de dolomite com fósseis de corais e estromatólitos
      resiste melhor à erosão do que as rochas subjacentes. A corrente arranca as camadas brandas e deixa a
      bancada rija saliente a cortar toda a largura do rio. É um monumento natural geológico e geomorfológico
      erguido na planície de Pieventa, no antigo vale do Venta.


      A cascata não é estática. A parte inferior da dolomite é mais frágil e desgasta-se primeiro, deixando a
      cornija superior suspensa até desabar. Assim, ao longo dos séculos, o centro do degrau recua lentamente
      rio acima. Nas margens, os afloramentos expõem estratos com fósseis soltos e drusas de calcite.


      O vale oferece mais do que a queda de água: as margens acolhem florestas de ravina, prados secos em
      substrato calcário e falésias de arenito. A reserva protege quinze habitats europeus protegidos.
    wildlife: >-
      O grande espetáculo é um salto acrobático. O Venta é afamado pelos seus «peixes voadores», que galgam a
      cascata em busca de zonas de desova a montante: na primavera a [*Vimba vimba*](/especie/vimba_vimba/), e
      no outono o [salmão atlântico](/especie/salmo_salar/). Por isso maio é o momento ideal para ver a vimba.
      No rio vivem trutas, lampreias, lúcios, bremas, ruivacos, tencas e carpas.


      As margens circundantes completam o cenário. Nos percursos avistam-se águias-pesqueiras,
      tartaranhões-dos-pauis, guarda-rios e borboletas-macaão. Os caniçais e as margens com salgueiros são os
      melhores postos para avifauna; observam-se também cisnes-bravos e águias-reais.
    visit: >-
      Começa pelo trilho da margem esquerda: são 2,4 km fáceis junto ao rio até à ponte nova de Kuldīga, com
      vista contínua para o leito e a cascata. Podes regressar pelo mesmo caminho ou seguir um circuito de 5,4
      km. Mais curto é o passeio no parque de Pārventa, com panorâmica sobre o centro histórico, a cascata do
      Alekšupīte e a ponte antiga de tijolo vermelho.


      Para um dia completo, a Rota da Saúde desenha um anel de 7 km de baixa dificuldade por Pārventa com
      miradouros sobre o rio. O vale acolhe caminhadas, ciclismo e, no inverno, esqui de fundo em qualquer
      estação.
    history: >-
      Kuldīga nasceu neste sítio porque a cascata interrompia a navegação interior medieval no Venta. No
      século XVII, o duque Jacob Kettler da Curlândia tentou abrir um canal de desvio na margem direita, mas a
      rocha era demasiado dura; na primavera as cheias continuam a alagar essa vala rasa formando a ilha de
      Martin. Outro canal foi iniciado entre os séculos XVII e XIX sem conclusão. Abriram-se tanques de pesca
      na rocha e a flutuação de madeira manteve-se até meados dos anos sessenta do século XX.


      Reza a lenda que um diabo assustado pelo cantar do galo deixou cair as suas pedras no rio. Perto
      ergue-se o castro de Veckuldīga, o maior da região.


      O vale é reserva natural desde 1957 e integra a rede Natura 2000 desde 2004. Recuperaram-se fundos de
      cascalho em mais de seis hectares e três quilómetros para desova de salmonídeos. Kuldīga integra a lista
      do Património Mundial da UNESCO; a monitorização está prevista pelo menos até 2028.
    before: >-
      Regra de ouro: o lixo que trouxeres levas contigo e recolhe o que encontrares. Confirma o estado dos
      trilhos e regulamentos antes de partir.
    around: >-
      O [Parque Natural do Antigo Vale do Abava](/lugar/abavas-senlejas-dabas-parks/) fica a 1 km. Mais longe,
      o [Parque Natural do Vale do Salaca](/lugar/salacas-ielejas-dabas-parks/) partilha a subida do salmão e
      o perfil de corredor fluvial.
