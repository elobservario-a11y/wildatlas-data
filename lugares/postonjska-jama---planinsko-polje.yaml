resumen:
  es: >-
    El berce universal donde nació la ciencia de la Espeleología y el Karst, con los 24 km de galerías de
    Postojna y el hábitat del proteo (*Proteus anguinus*).
  en: >-
    The universal cradle where the science of Speleology and Karstology was born, featuring 24 km of Postojna
    passages and the olm (*Proteus anguinus*).
  fr: >-
    Le berceau universel où naquirent la spéléologie et la karstologie, avec les 24 km de galeries de Postojna
    et le protée anguillard (*Proteus anguinus*).
  de: >-
    Die universelle Wiege der Speläologie und Karstforschung mit den 24 km langen Gängen von Postojna und dem
    Grottenolm (*Proteus anguinus*).
  it: >-
    La culla universale dove nacquero la speleologia e il carsismo, con i 24 km di gallerie di Postumia e il
    proteo (*Proteus anguinus*).
  pt: >-
    O berço universal onde nasceu a ciência da Espeleologia e do Carso, com os 24 km de galerias de Postojna e
    o proteu (*Proteus anguinus*).
unico:
  es: >-
    Un mismo río escribe aquí la lección completa del karst: se traga una colina, esculpe una cueva, vuelve a
    la luz y se esconde otra vez.
  en: >-
    A single river writes the complete textbook on karst here: swallowing a hill, carving caverns, surfacing,
    and vanishing once more.
  fr: >-
    Une même rivière donne ici la leçon complète du karst : elle engloutit une colline, sculpte une grotte,
    reparaît au soleil et s'enfonce à nouveau.
  de: >-
    Ein einziger Fluss schreibt hier das Lehrbuch des Karstes: Er verschlingt einen Berg, gräbt Höhlen, tritt
    ans Licht und taucht erneut unter.
  it: >-
    Un unico fiume scrive qui il compendio del carsismo: inghiotte una collina, scava caverne, torna alla luce
    e si inabissa di nuovo.
  pt: >-
    Um mesmo rio dita aqui a lição integral do carso: engole uma colina, esculpe grutas, regressa à luz e
    volta a submergir.
observaciones:
  es: >-
    Dentro de la cueva hace diez grados todo el año: lleva ropa de abrigo y calzado deportivo. Se puede
    fotografiar y grabar, pero sin flash ni trípode. Los animales de compañía no pueden entrar, para proteger
    el frágil ecosistema, y hay que seguir los caminos marcados con el grupo y el guía. Llega con tiempo: el
    embarque en el tren es unos quince minutos antes de la hora de tu visita. La cueva de Planina solo se ve
    con acompañamiento de espeleólogos, previa coordinación.
texto:
  es:
    intro: >-
      Un río entra en la montaña por un lado, recorre kilómetros de oscuridad y sale por otro con distinto
      nombre. Eso es, en pocas palabras, el Karst clásico de Postojna y Planina: la Pivka se hunde bajo la
      colina Sovič, atraviesa la cueva de Postojna, se une al Rak en la cueva de Planina y emerge a la luz
      como Unica, para volver a desaparecer bajo tierra y reaparecer, ya con otro nombre, como Ljubljanica. En
      medio hay veinticuatro kilómetros de galerías, una llanura que se inunda varias veces al año y un
      anfibio ciego que desconcierta a los naturalistas desde 1797.
    landscape: >-
      Todo empieza con agua y paciencia. La Pivka lleva millones de años abriéndose camino y, mientras bajaba
      su cauce, fue dibujando los pisos de la cueva de Postojna. Después el agua que se filtra por la roca
      depositó calcita durante milenios y levantó estalagmitas, estalactitas y esas formaciones que parecen
      cortinas de tela plegada. La más famosa es el Brilliant, una estalagmita blanquísima de cinco metros que
      se ha convertido en el símbolo de la cueva y del Karst esloveno.


      La cueva mide más de veinticuatro kilómetros y es la segunda más larga de Eslovenia. A quinientos metros
      de la entrada de la cueva de Planina se juntan el Pivka, que viene de Postojna, y el Rak, que llega
      desde Rak Škocjan: uno de los mayores encuentros de ríos subterráneos de Europa. Las pruebas de trazado
      de aguas indican que ambos sistemas conectan, y los buceadores siguen explorando los sifones que los
      separan; unidas, las dos cuevas superarían los treinta y un kilómetros.


      Arriba, en la superficie, el paisaje cambia de escala. Planinsko polje es un polje, una cuenca kárstica
      de fondo perfectamente plano: unos cinco kilómetros de largo, dos y medio de ancho y más de diez
      kilómetros cuadrados de llanura a unos cuatrocientos cincuenta metros de altitud. El Unica nace en la
      cueva de Planina con un caudal medio de veinticuatro metros cúbicos por segundo, pero oscila entre
      apenas trescientos litros y cien metros cúbicos. Cuando sube, los sumideros del borde no dan abasto. El
      polje se inunda varias veces al año, las crecidas pueden durar hasta dos meses y el agua llega en
      algunos puntos a diez metros de altura. Por eso en el fondo no hay campos sino prados húmedos, y los
      cultivos y las aldeas, con Planina como la mayor, se sitúan en el borde ligeramente elevado.
    wildlife: >-
      La cueva es el gran laboratorio de la vida subterránea. En el sistema Postojna-Planina se han citado más
      de ciento setenta y cinco especies animales, ciento quince de ellas estrictamente cavernícolas, una
      cifra que la bibliografía presenta como récord mundial. Aquí se descubrió en 1831 el primer escarabajo
      de cueva conocido, y con él cayó la idea de que las cuevas estaban vacías de vida. La estrella es el
      [proteo](/especie/proteus_anguinus/), el olm: descubierto en la Črna jama en 1797, es el mayor animal
      cavernícola que puede pasar hasta diez años sin comer, y durante siglos alimentó la leyenda de los
      dragones bebé. En 2016 una hembra puso más de cincuenta huevos en la cueva, y entre finales de mayo y
      mediados de julio nacieron veintidós crías.


      En la superficie la vida se organiza en torno al agua. En el Unica, que cruza el polje, abundan la
      trucha y el tímalo. Los prados inundables guardan una rareza botánica: *Scilla litardierei*, un
      endemismo de los poljes dináricos que aquí alcanza su límite noroccidental.


      El calendario tiene dos ritmos. Bajo tierra no hay estaciones: la temperatura es de unos diez grados
      todo el año, así que la cueva es lo mismo en enero que en agosto. En el polje, en cambio, mandan las
      lluvias: sus crecidas cambian el paisaje de un mes a otro.
    visit: >-
      El recorrido clásico de la cueva de Postojna dura hora y media y enseña unos cinco kilómetros, de los
      cuales unos tres y medio se hacen en tren y algo más de uno a pie con guía. Es el único ferrocarril de
      doble vía en una cueva, con 3,7 km de trayecto. El camino es de hormigón antideslizante, pero incluye un
      tramo de doscientos metros con una pendiente del veinte por ciento. Si quieres ver más, hay recorridos
      de aventura por las zonas menos accesibles, algunos con exigencia física y experiencia previa en
      espeleología.


      Antes o después de bajar, el parque de la cueva ofrece dos paradas que explican lo que has visto. A
      cincuenta metros de la entrada está el vivario Proteusova jama, una estación de espeleobiología abierta
      a los visitantes. Y la exposición EXPO Postojnska jama - kras cuenta la historia geológica y turística
      del karst y los yacimientos arqueológicos de la zona.


      Para el polje cambia de ritmo. Planina tiene una torre, la torre Ravbar, restaurada, junto a la entrada
      de la cueva de Planina. Esa cueva, famosa por sus espeleotemas y por el proteo, no se visita por libre:
      solo con espeleólogos y por acuerdo previo. Los bordes del polje esconden manantiales y sumideros, entre
      ellos los pozos de Putick, que llevan el nombre del explorador del karst Viljem Putick.
    history: >-
      Las paredes de Postojna guardan grafitis de 1213, así que la gente bajaba allí mucho antes de que
      Valvasor la describiera en el siglo XVII. La visita organizada empezó cuando Luka Čeč, el hombre que
      encendía las lámparas, descubrió por casualidad una zona nueva y se convirtió en el primer guía. La
      cueva tuvo luz eléctrica en 1884, antes que Ljubljana, y su tren de vía en 1872.


      La guerra dejó su huella: los ocupantes alemanes guardaron casi mil barriles de combustible de aviación
      y los partisanos eslovenos los destruyeron en abril de 1944. El fuego ardió una semana, derribó
      formaciones y cubrió de hollín las paredes: de ahí el nombre de Črna jama, la cueva Negra.


      En el polje, la historia es la de convivir con el agua. Para frenar las inundaciones se desvió el cauce
      del Unica y se amurallaron muchos sumideros, aunque el proyecto de embalse hidroeléctrico nunca se hizo.
      Dos castillos en ruinas, el medieval Haasberg y el llamado Castillo Pequeño, completan el paisaje. La
      cueva de Planina y parte del polje están protegidas desde 1971, y el suroeste del polje, unas
      seiscientas sesenta y ocho hectáreas, es parque paisajístico.
    before: >-
      Dentro de la cueva hace diez grados todo el año: lleva ropa de abrigo y calzado deportivo. Se puede
      fotografiar y grabar, pero sin flash ni trípode. Los animales de compañía no pueden entrar, para
      proteger el frágil ecosistema, y hay que seguir los caminos marcados con el grupo y el guía. Llega con
      tiempo: el embarque en el tren es unos quince minutos antes de la hora de tu visita. La cueva de Planina
      solo se ve con acompañamiento de espeleólogos, previa coordinación.
    around: >-
      A un kilómetro está la [Meseta Kárstica de Nanos](/lugar/kraska-planota-nanos/) y, también a un
      kilómetro, los [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/). A ocho kilómetros se extiende el
      [Parque Paisajístico del Marjal de Liubliana](/lugar/krajinski-park-ljubljansko-barje/), a diez el
      [Complejo Forestal de Kočevsko](/lugar/kocevski-gozdni-kompleks/), a quince el [Macizo de
      Snježnik](/lugar/snjeznik-massif-croatia/) y a veinte las [Cuevas de
      Škocjan](/lugar/park-skocjanske-jame/). Dentro de la misma zona queda el [Lago Intermitente de
      Cerknica](/lugar/cerknisko-jezero/). Más lejos, el [Poljé de Popovo y Sistema Hidrokárstico de la Cueva
      Vjetrenica](/lugar/popovo-polje---pecina-vjetrenica/) comparte con este lugar el proteo y un mismo mundo
      de karst y humedales.
  en:
    intro: >-
      A river enters a mountain on one side, journeys through kilometers of total subterranean darkness, and
      emerges on the other under a different name. That, in essence, is the Classical Karst of Postojna and
      Planina: the Pivka river sinks beneath Sovič hill, threads Postojna Cave, joins the Rak within Planina
      Cave, and re-emerges into daylight as the Unica, only to vanish underground once more before reappearing
      as the Ljubljanica. Between these sinks lie twenty-four kilometers of galleries, a polje that floods
      several times each year, and a blind troglobitic amphibian that has puzzled naturalists since 1797.
    landscape: >-
      It all begins with water and patience. For millions of years the Pivka has carved its subterranean
      course and, as its bed lowered, etched the successive horizontal levels of Postojna Cave. In subsequent
      epochs, water percolating through the karst bedrock deposited calcite over millennia, building
      stalagmites, stalactites, and rippled curtain draperies resembling folded fabric. The most celebrated
      formation is the Brilliant, a five-meter-high pillar of pristine white calcite that has become the
      emblem of the cave and Slovenian Karst.


      The cave extends for more than twenty-four kilometers, ranking as the second longest in Slovenia. Five
      hundred meters from the portal of Planina Cave, the Pivka arriving from Postojna meets the Rak flowing
      from Rak Škocjan: one of the largest subterranean river junctions in Europe. Dye-tracing experiments
      confirm that both systems are hydrologically linked, and cave divers continue to explore the connecting
      water sumps; unified, the two caverns would surpass thirty-one kilometers.


      Up on the surface, the landscape shifts in scale. Planinsko polje is a classic polje, an expansive karst
      basin with a perfectly flat floor: roughly five kilometers long, two and a half kilometers wide, and
      covering more than ten square kilometers of alluvial plain at an altitude of around four hundred and
      fifty meters. The Unica emerges from Planina Cave with an average discharge of twenty-four cubic meters
      per second, fluctuating wildly between barely three hundred liters and one hundred cubic meters. When
      waters rise, swallow holes along the basin rim become overwhelmed. The polje floods multiple times each
      year, inundations can endure for up to two months, and floodwaters reach ten meters in depth in certain
      hollows. For this reason, the basin floor features damp hay meadows rather than arable fields, while
      settlements and crops, with Planina being the largest, occupy the gently raised margins.
    wildlife: >-
      The cave serves as the world's premier natural laboratory for subterranean biology. Over one hundred and
      seventy-five animal species have been documented across the Postojna-Planina system, one hundred and
      fifteen of which are obligate troglobites—a global record in speleobiology literature. Here in 1831, the
      world's first known cave beetle was discovered, shattering the belief that subterranean realms were
      barren. The flagship creature is the [olm](/especie/proteus_anguinus/): discovered in Črna jama in 1797,
      it is the largest obligate cave vertebrate, capable of surviving up to ten years without food, and the
      origin of ancient folk tales about baby dragons. In 2016, a female laid over fifty eggs in the cave
      aquarium, and between late May and mid-July, twenty-two hatchlings emerged successfully.


      On the surface, life revolves around water. The Unica meandering across the polje teems with brown trout
      and grayling. Flooded meadows shelter a botanical rarity: *Scilla litardierei*, a Dinaric polje endemic
      reaching its northwestern global limit here.


      The seasons operate on two distinct rhythms. Underground, there are no seasons: temperature rests at
      roughly ten degrees Celsius year-round. On the polje above, seasonal deluges dictate everything,
      reshaping the landscape from dry pasture to inland sea.
    visit: >-
      The standard tour of Postojna Cave takes an hour and a half and covers five kilometers, of which some
      three and a half kilometers are traversed aboard an underground train and just over one kilometer on
      foot with a guide. It is the only double-track railway in a cave, spanning 3.7 km of track. Pathways are
      paved in anti-slip concrete, though one section includes a two-hundred-meter incline at a twenty percent
      gradient. For greater adventure, specialized caving routes explore wilder galleries requiring good
      physical fitness and prior caving experience.


      Before or after descending, the cave park features two interpretation centers. Fifty meters from the
      entrance stands the Proteus Cave Vivarium, a speleobiological research station open to visitors. The
      EXPO Postojnska Jama Karst pavilion chronicles the geological and touristic evolution of the region.


      At Planina polje, slow down your pace. The restored Ravbar Tower stands sentinel beside the portal of
      Planina Cave. That cavern, celebrated for its speleothems and olm population, cannot be visited
      independently: access requires licensed caving guides and advance arrangements. Along the edges of the
      polje hide karst springs and swallow holes, notably the Putick shafts named after pioneer karst explorer
      Viljem Putick.
    history: >-
      Passage walls inside Postojna bear historic visitor graffiti dating back to 1213, confirming that
      explorers entered long before Valvasor described the chasm in the seventeenth century. Organized tourism
      began when lamplighter Luka Čeč accidentally discovered extensive inner chambers and became the first
      official guide. The cave received electric illumination in 1884—ahead of Ljubljana—and its first
      passenger railway in 1872.


      War left its scars: German forces stored nearly a thousand barrels of aircraft fuel inside the entrance
      passages, which Slovenian partisans destroyed in April 1944. The resulting inferno burned for a week,
      toppling stalagmites and coating walls in thick soot—giving rise to the name Črna jama (Black Cave).


      Across the polje, human history is defined by living with flooding. To mitigate inundations, sections of
      the Unica were canalized and swallow holes walled, though plans for a major hydroelectric dam were
      abandoned. Two ruined fortresses, medieval Haasberg and the Little Castle, complete the cultural
      heritage. Planina Cave and sectors of the polje have been protected since 1971, with the southwestern
      polje covering some six hundred and sixty-eight hectares as a landscape park.
    before: >-
      Inside the cave, temperature remains steady at ten degrees Celsius year-round: bring warm layers and
      comfortable walking shoes. Photography is permitted without flash or tripods. Pets are prohibited inside
      to safeguard the fragile subterranean habitat, and visitors must remain on designated pathways with
      their guide. Arrive early: train boarding begins fifteen minutes prior to tour departure. Planina Cave
      is accessible only with specialist speleologists by prior arrangement.
    around: >-
      One kilometer away lies the [Nanos Karst Plateau](/lugar/kraska-planota-nanos/) and, also one kilometer
      away, the [Javorniki Karst Plateau and Forests](/lugar/javorniski-gozdovi-karstna-planota-javorniki/).
      Eight kilometers away extends the [Ljubljana Marsh Landscape
      Park](/lugar/krajinski-park-ljubljansko-barje/), ten kilometers the [Kočevsko Forest
      Complex](/lugar/kocevski-gozdni-kompleks/), fifteen kilometers the [Snježnik
      Massif](/lugar/snjeznik-massif-croatia/), and twenty kilometers the [Škocjan
      Caves](/lugar/park-skocjanske-jame/). Within the immediate vicinity lies [Lake
      Cerknica](/lugar/cerknisko-jezero/). Further afield, the [Popovo Polje and Vjetrenica Cave Hydrological
      System](/lugar/popovo-polje---pecina-vjetrenica/) shares with Postojna the olm and an interconnected
      world of karst waters.
  fr:
    intro: >-
      Une rivière s'enfonce dans la montagne d'un côté, parcourt des kilomètres dans l'obscurité et ressort de
      l'autre sous un autre nom. Voilà résumé le Karst classique de Postojna et Planina : la Pivka disparaît
      sous la colline de Sovič, traverse la grotte de Postojna, s'unit au Rak dans la grotte de Planina et
      réapparaît à la lumière sous le nom d'Unica, avant de replonger sous terre pour ressurgir, avec un
      nouveau nom, sous les traits de la Ljubljanica. Entre les deux s'étirent vingt-quatre kilomètres de
      galeries, une plaine inondée plusieurs fois l'an et un amphibien aveugle qui fascine les naturalistes
      depuis 1797.
    landscape: >-
      Tout commence par l'eau et la patience. La Pivka s'est frayé un chemin depuis des millions d'années et,
      à mesure que son cours s'abaissait, a sculpté les étages superposés de la grotte de Postojna. Ensuite,
      l'eau d'infiltration a déposé de la calcite durant des millénaires, érigeant stalagmites, stalactites et
      concrétions plissées semblables à des draperies. La plus célèbre est le Brillant, une stalagmite d'un
      blanc éclatant haute de cinq mètres devenue l'emblème de la grotte et du Karst slovène.


      La grotte développe plus de vingt-quatre kilomètres de galeries, ce qui en fait la deuxième plus longue
      de Slovénie. À cinq cents mètres de l'entrée de la grotte de Planina se rencontrent la Pivka issue de
      Postojna et le Rak venu de Rak Škocjan : l'une des confluences fluviales souterraines les plus
      spectaculaires d'Europe. Les traçages hydrogéologiques démontrent que les deux réseaux communiquent, et
      les spéléoplongeurs explorent toujours les siphons intermédiaires ; reliées, les deux grottes
      dépasseraient trente et un kilomètres.


      À la surface, le paysage change d'échelle. Le Planinsko polje forme une vaste dépression karstique au
      fond rigoureusement plat : environ cinq kilomètres de long, deux et demi de large et plus de dix
      kilomètres carrés de plaine à quatre cent cinquante mètres d'altitude. L'Unica jaillit de la grotte de
      Planina avec un débit moyen de vingt-quatre mètres cubes par seconde, oscillant entre trois cents litres
      et cent mètres cubes. En crue, les pertes du pourtour sont saturées. Le poljé s'inonde plusieurs fois
      par an, les crues peuvent durer jusqu'à deux mois et l'eau atteint parfois dix mètres de hauteur. C'est
      pourquoi le fond n'accueille que des prairies inondables, tandis que cultures et villages, dont Planina
      est le principal, s'accrochent aux rebords surélevés.
    wildlife: >-
      La grotte constitue le grand laboratoire mondial de la vie souterraine. Dans le réseau Postojna-Planina,
      plus de cent soixante-quinze espèces animales ont été recensées, dont cent quinze strictement
      cavernicoles — un record mondial de biodiversité troglobie. C'est ici que fut découvert en 1831 le
      premier coléoptère cavernicole connu, balayant l'idée que le monde souterrain était stérile. L'emblème
      absolu est le [protée anguillard](/especie/proteus_anguinus/) : identifié dans la Črna jama en 1797, ce
      grand vertébré cavernicole peut jeûner dix ans et alimenta jadis le mythe des bébés dragons. En 2016,
      une femelle a pondu plus de cinquante œufs dans la grotte et vingt-deux petits ont vu le jour entre fin
      mai et mi-juillet.


      En surface, la vie s'organise autour de l'eau. L'Unica, serpentant sur le poljé, abonde en truites et
      ombres communs. Les prairies inondables abritent une rareté botanique : *Scilla litardierei*, endémique
      des poljés dinariques qui atteint ici sa limite nord-occidentale.


      Le calendrier vit à deux rythmes. Sous terre, pas de saisons : la température reste à dix degrés toute
      l'année. Sur le poljé, en revanche, les pluies commandent et transforment le paysage de mois en mois.
    visit: >-
      Le parcours classique de la grotte de Postojna dure une heure et demie et couvre environ cinq
      kilomètres, dont trois et demi en train et un peu plus d'un kilomètre à pied avec guide. C'est le seul
      train souterrain à double voie au monde, sur 3,7 km de voies ferrées. Le chemin est en béton
      antidérapant, mais comprend une section de deux cents mètres à vingt pour cent de pente. Des parcours
      spéléologiques d'aventure explorent les secteurs sauvages pour les marcheurs aguerris.


      Avant ou après la visite, le parc propose deux haltes explicatives : le vivarium Proteusova jama,
      station de spéléobiologie à cinquante mètres de l'entrée, et l'exposition EXPO Postojnska jama consacrée
      à la karstologie et à l'archéologie régionale.


      Au poljé de Planina, le rythme ralentit. La tour Ravbar restaurée garde l'entrée de la grotte de
      Planina. Cette cavité réputée pour ses concrétions et ses protées ne se visite qu'accompagné de
      spéléologues sur réservation. En lisière du poljé s'ouvrent résurgences et pertes, notamment les puits
      de Putick, baptisés d'après l'explorateur Viljem Putick.
    history: >-
      Les parois de Postojna portent des graffitis datés de 1213, attestant de visites bien antérieures aux
      écrits de Valvasor au XVIIe siècle. Le tourisme structuré débuta lorsque le préposé aux lampes Luka Čeč
      découvrit fortuitement de nouvelles galeries et devint le premier guide. La grotte reçut l'éclairage
      électrique en 1884, avant Ljubljana, et son chemin de fer dès 1872.


      La guerre y laissa sa trace : les forces d'occupation allemandes y entreposèrent près de mille fûts de
      carburant d'aviation, détruits par les partisans slovènes en avril 1944. L'incendie fit rage durant une
      semaine, noircissant les voûtes de suie et donnant son nom à la Črna jama (la Grotte Noire).


      Sur le poljé, l'histoire s'écrit avec les crues. Pour limiter les submersions, le cours de l'Unica fut
      canalisé et des pertes maçonnées. Deux châteaux en ruine, le Haasberg médiéval et le Petit Château,
      ponctuent les rives. La grotte de Planina et des secteurs du poljé sont protégés depuis 1971, le
      sud-ouest formant sur quelque six cent soixante-huit hectares un parc paysager.
    before: >-
      La température intérieure est constante à dix degrés toute l'année : prévoyez des vêtements chauds et de
      bonnes chaussures de marche. Photos autorisées sans flash ni trépied. Les animaux de compagnie sont
      interdits pour protéger l'écosystème cavernicole. Présentez-vous environ quinze minutes avant
      l'embarquement du train. La grotte de Planina se visite exclusivement avec des spéléologues sur
      rendez-vous.
    around: >-
      À un kilomètre s'élève le [Plateau karstique de Nanos](/lugar/kraska-planota-nanos/) et, également à un
      kilomètre, les [Forêts et plateau karstique de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/). À huit kilomètres s'étend le [Parc
      paysager du Marais de Ljubljana](/lugar/krajinski-park-ljubljansko-barje/), à dix le [Complexe forestier
      de Kočevsko](/lugar/kocevski-gozdni-kompleks/), à quinze le [Massif de
      Snježnik](/lugar/snjeznik-massif-croatia/) et à vingt les [Grottes de
      Škocjan](/lugar/park-skocjanske-jame/). Dans le même secteur s'étend le [Lac intermittent de
      Cerknica](/lugar/cerknisko-jezero/). Plus loin, le [Poljé de Popovo et réseau hydrokarstique de la
      grotte de Vjetrenica](/lugar/popovo-polje---pecina-vjetrenica/) partage avec ce site le protée et
      l'univers du karst dinarique.
  de:
    intro: >-
      Ein Fluss dringt auf der einen Seite in den Berg ein, durchquert kilometerlange Finsternis und tritt auf
      der anderen Seite unter neuem Namen wieder zutage. Das ist der Klassische Karst von Postojna und
      Planina: Die Pivka versinkt unter dem Hügel Sovič, durchquert die Höhle von Postojna, vereinigt sich in
      der Planina-Höhle mit dem Rak und tritt als Unica ans Licht, um bald darauf erneut im Boden zu
      verschwinden und schließlich als Ljubljanica aufzutauchen. Dazwischen liegen vierundzwanzig Kilometer
      Höhlengänge, eine mehrfach im Jahr überflutete Ebene und ein blinder Lurch, der die Wissenschaft seit
      1797 beschäftigt.
    landscape: >-
      Alles beginnt mit Wasser und Geduld. Seit Jahrmillionen bahnt sich die Pivka ihren Weg und zeichnete mit
      sinkendem Wasserspiegel die verschiedenen Höhlenstockwerke von Postojna in den Fels. Anschließend
      lagerte das einsickernde Sickerwasser über Jahrtausende Calcit ab und baute Stalagmiten, Stalaktiten und
      gefaltete Sintervorhänge auf. Die berühmteste Tropfsteinbildung ist der Brillant, ein fünf Meter hoher,
      blendend weißer Stalagmit, der zum Wahrzeichen der Höhle und des slowenischen Karstes wurde.


      Die Höhle misst über vierundzwanzig Kilometer und ist die zweitlängste Sloweniens. Fünfhundert Meter
      hinter dem Portal der Planina-Höhle vereinigen sich die von Postojna kommende Pivka und der aus dem Rak
      Škocjan herbeiströmende Rak: eine der gewaltigsten unterirdischen Flussvereinigungen Europas.
      Färbeversuche belegen die hydrologische Verbindung beider Höhlen, und Höhlentaucher erkunden weiterhin
      die trennenden Siphons; zusammengeschlossen würden beide Höhlensysteme einunddreißig Kilometer
      übertreffen.


      Oben auf der Oberfläche wechselt der Landschaftsmaßstab. Das Planinsko polje ist ein Polje, ein
      Karstbecken mit vollkommen ebenem Boden: rund fünf Kilometer lang, zweieinhalb Kilometer breit und über
      zehn Quadratkilometer groß auf etwa vierhundertfünfzig Metern Meereshöhe. Die Unica entspringt der
      Planina-Höhle mit einer durchschnittlichen Schüttung von vierundzwanzig Kubikmetern pro Sekunde,
      schwankt jedoch zwischen dreihundert Litern und einhundert Kubikmetern. Bei Hochwasser sind die
      Schlucklöcher am Beckenrand überfordert. Das Polje wird mehrfach im Jahr überschwemmt, Überflutungen
      dauern bis zu zwei Monate, und das Wasser steht stellenweise zehn Meter hoch. Aus diesem Grund liegen im
      Beckeninneren Feuchtwiesen statt Äcker, während Siedlungen und Kulturland – mit Planina als größtem Ort
      – den leicht erhöhten Beckenrand säumen.
    wildlife: >-
      Die Höhlenwelt dient als gigantisches Freilandlabor der Biospeläologie. Im Postojna-Planina-System
      wurden über einhundertfünfundsiebzig Tierarten nachgewiesen, davon einhundertfünfzehn echte Höhlentiere
      – ein weltweiter Spitzenwert. Hier wurde 1831 der weltweit erste Höhlenkäfer entdeckt, was die Annahme
      widerlegte, unter der Erde gebe es kein Leben. Die unbestrittene Leitart ist der
      [Grottenolm](/especie/proteus_anguinus/): 1797 in der Črna jama entdeckt, ist er das größte echte
      Höhlentier, kann zehn Jahre ohne Nahrung überdauern und nährte einst Drachensagen. 2016 legte ein
      Weibchen über fünfzig Eier im Höhlenaquarium ab, aus denen zwischen Ende Mai und Mitte Juli
      zweiundzwanzig Jungtiere schlüpften.


      Über Tage bestimmt das Wasser das Leben. In den Mäandern der Unica auf dem Polje leben Bachforellen und
      Äschen. Die Flutrasen bergen eine botanische Rarität: *Scilla litardierei*, ein Endemit dinarischer
      Karstebenen, der hier seine nordwestliche Verbreitungsgrenze erreicht.


      Das Jahr folgt zwei Rhythmen: Unter Tage herrschen ganzjährig konstante zehn Grad Celsius. Auf dem Polje
      hingegen bestimmen die Regenfälle den Wandel vom Weideland zur Wasserfläche.
    visit: >-
      Die reguläre Besichtigung der Höhle von Postojna dauert anderthalb Stunden und führt über fünf
      Kilometer, davon dreieinhalb Kilometer mit dem Höhlenzug und gut ein Kilometer zu Fuß mit Führung. Es
      ist die weltweit einzige zweigleisige Höhlenbahn mit 3,7 km Schienennetz. Die Wege sind rutschfest
      betoniert, weisen jedoch einen zweihundert Meter langen Anstieg mit zwanzig Prozent Steigung auf.
      Abenteuerführungen erschließen unerschlossene Höhlenbereiche für trittsichere Besucher.


      Vor oder nach der Einfahrt bieten das Vivarium Proteusova jama mit seiner biologischen Forschungsstation
      und die Karst-Erlebnisausstellung EXPO Postojnska jama vertiefende Einblicke.


      Auf dem Planina-Polje geht es beschaulicher zu. Der restaurierte Ravbar-Turm steht am Eingang der
      Planina-Höhle. Diese für ihre Tropfsteine und Grottenolme berühmte Höhle ist nur nach Voranmeldung mit
      Speläologen zugänglich. Am Rand des Poljes verbergen sich Karstquellen und Schlucklöcher, darunter die
      nach dem Karstforscher Viljem Putick benannten Schächte.
    history: >-
      Inschriften an den Höhlenwänden von Postojna reichen bis 1213 zurück und belegen frühe Abstiege lange
      vor den Berichten Valvasors im siebzehnten Jahrhundert. Der moderne Tourismus begann, als der
      Lampenwärter Luka Čeč neue Säle entdeckte und erster Höhlenführer wurde. Die Höhle erhielt 1884
      elektrisches Licht – noch vor Ljubljana – und 1872 ihre erste Bahn.


      Der Krieg hinterließ tiefe Spuren: Deutsche Besatzer lagerten fast tausend Fässer Flugbenzin ein, die
      slowenische Partisanen im April 1944 sprengten. Das Feuer wütete eine Woche lang, zerstörte Tropfsteine
      und schwärzte die Wände dauerhaft mit Ruß – woher der Name Črna jama (Schwarze Höhle) rührt.


      Auf dem Polje prägte der Hochwasserschutz die Geschichte: Die Unica wurde teils begradigt und Ponore
      wurden ummauert. Ruinen wie die mittelalterliche Burg Haasberg und das Kleine Schloss zeugen von alter
      Besiedlung. Die Planina-Höhle und Teile des Poljes stehen seit 1971 unter Naturschutz, wobei der
      südwestliche Teil auf rund sechshundertachtundsechzig Hektar als Landschaftspark ausgewiesen ist.
    before: >-
      In der Höhle herrschen ganzjährig konstant zehn Grad Celsius: Warme Kleidung und feste Schuhe sind
      erforderlich. Fotografieren ist ohne Blitz und Stativ gestattet. Haustiere sind zum Schutz des
      Höhlenbiotops nicht zugelassen. Finde dich etwa fünfzehn Minuten vor Tourbeginn am Höhlenzug ein. Die
      Planina-Höhle ist nur mit Höhlenführern nach vorheriger Absprache zugänglich.
    around: >-
      Einen Kilometer entfernt liegt die [Nanos-Karsthochfläche](/lugar/kraska-planota-nanos/) und ebenfalls
      einen Kilometer die [Wälder und Karsthochfläche
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/). Acht Kilometer entfernt erstreckt sich
      der [Landschaftspark Laibacher Moor](/lugar/krajinski-park-ljubljansko-barje/), zehn Kilometer der
      [Waldkomplex von Kočevsko](/lugar/kocevski-gozdni-kompleks/), fünfzehn Kilometer das
      [Snježnik-Massiv](/lugar/snjeznik-massif-croatia/) und zwanzig Kilometer die [Höhlen von
      Škocjan](/lugar/park-skocjanske-jame/). Im gleichen Raum liegt der [Intermittierende See von
      Cerknica](/lugar/cerknisko-jezero/). Weiter entfernt teilt das [Popovo-Polje und hydrokarstische System
      der Vjetrenica-Höhle](/lugar/popovo-polje---pecina-vjetrenica/) mit diesem Ort das Vorkommen des
      Grottenolms.
  it:
    intro: >-
      Un fiume entra nella montagna da un lato, percorre chilometri nell'oscurità e rispunta dall'altro
      versante con un nome diverso. Questo è il Carso classico di Postumia e Planina: la Pivka si inabissa
      sotto il colle Sovič, traversa le grotte di Postumia, si congiunge al Rak nella grotta di Planina ed
      emerge alla luce come Unica, per poi scomparire nuovamente sottoterra e riaffiorare, con un terzo nome,
      come Ljubljanica. Nel mezzo si aprono ventiquattro chilometri di gallerie, una pianura che si trasforma
      in lago varie volte l'anno e un anfibio cieco che interroga i naturalisti dal 1797.
    landscape: >-
      Tutto comincia con l'acqua e la pazienza. La Pivka scava il proprio cammino da milioni di anni e,
      abbassando il proprio alveo, ha disegnato i diversi livelli della grotta di Postumia. In epoche
      successive, l'acqua di stillicidio ha depositato calcite per millenni innalzando stalagmiti, stalattiti
      e cortine drappeggiate simili a tessuti pieghettati. La formazione più celebre è il Brillante, una
      candida stalagmite di cinque metri divenuta il simbolo della grotta e del Carso sloveno.


      La grotta si sviluppa per oltre ventiquattro chilometri ed è la seconda più estesa della Slovenia. A
      cinquecento metri dall'accesso della grotta di Planina confluiscono la Pivka, proveniente da Postumia, e
      il Rak, giunto da Rak Škocjan: una delle più grandiose confluenze di fiumi ipogei d'Europa. Le prove coi
      traccianti attestano che i due sistemi comunicano, e gli speleosub continuano a sondare i sifoni che li
      separano; congiunte, le due caverne supererebbero i trentuno chilometri.


      In superficie il paesaggio muta di scala. Il Planinsko polje è un polje classico, un bacino carsico dal
      fondovalle perfettamente piatto: circa cinque chilometri di lunghezza, due e mezzo di larghezza e oltre
      dieci chilometri quadrati di pianura a quattrocentocinquanta metri di quota. L'Unica sgorga dalla grotta
      di Planina con una portata media di ventiquattro metri cubi al secondo, oscillando tra appena trecento
      litri e cento metri cubi. Durante le piene gli inghiottitoi perimetrali non riescono a smaltire le
      acque. Il polje si allaga varie volte l'anno, le inondazioni possono protrarsi fino a due mesi e il
      livello idrico raggiunge in alcuni punti dieci metri di altezza. Per questo il fondo ospita prati
      stabili umidi anziché seminativi, mentre campi e villaggi, di cui Planina è il maggiore, sorgono sui
      bordi lievemente sopraelevati.
    wildlife: >-
      Le cavità costituiscono il più celebre laboratorio biologico del mondo sotterraneo. Nel complesso
      Postumia-Planina sono state censite oltre centosettantacinque specie animali, di cui centoquindici
      troglobie obbligate — un primato mondiale di biodiversità ipogea. Qui nel 1831 fu scoperto il primo
      coleottero cavernicolo al mondo, sfatando il mito che le viscere della terra fossero prive di vita.
      L'animale simbolo è il [proteo](/especie/proteus_anguinus/): scoperto nella Črna jama nel 1797, è il
      massimo vertebrato cavernicolo, capace di resistere dieci anni senza cibo e fonte di leggende sui
      cuccioli di drago. Nel 2016 una femmina ha deposto oltre cinquanta uova nell'acquario della grotta, e
      tra fine maggio e metà luglio sono nati ventidue piccoli.


      In superficie la vita gravita attorno all'acqua. L'Unica, serpeggiando nel polje, abbonda di trote e
      temoli. I prati umidi custodiscono una rarità floristica: *Scilla litardierei*, endemismo dei polje
      dinarici al suo limite nord-occidentale.


      Il calendario segue due ritmi: nel sottosuolo la temperatura resta stabile a dieci gradi tutto l'anno,
      mentre sul polje le precipitazioni mutano continuamente il paesaggio.
    visit: >-
      La visita classica delle grotte di Postumia richiede un'ora e mezza e copre circa cinque chilometri, di
      cui tre e mezzo a bordo del trenino e poco più di un chilometro a piedi con guida. È l'unica ferrovia
      sotterranea a doppio binario al mondo, con 3,7 km di tracciato. Il percorso è pavimentato in cemento
      antiscivolo, pur presentando una tratta di duecento metri con pendenza al venti per cento. Tour
      avventura conducono nelle aree meno accessibili per escursionisti esperti.


      All'esterno, il parco ospita il vivaio Proteusova jama, stazione di biospeleologia a cinquanta metri
      dall'accesso, e la mostra EXPO Postojnska jama dedicata alla geologia carsica.


      Nel polje di Planina i ritmi rallentano. La restaurata torre Ravbar sorge accanto all'ingresso della
      grotta di Planina. Questa cavità, rinomata per concrezioni e protei, si visita solo con speleologi
      autorizzati su prenotazione. Ai margini del polje si aprono sorgenti e inghiottitoi, tra cui i pozzi di
      Putick, intitolati all'esploratore Viljem Putick.
    history: >-
      I graffiti sulle pareti di Postumia risalgono al 1213, testimoniando frequentazioni assai precedenti
      alle descrizioni seicentesche di Valvasor. Le visite organizzate presero avvio quando il lampionaio Luka
      Čeč scoprì nuove gallerie divenendo la prima guida ufficiale. La grotta ebbe la luce elettrica nel 1884,
      prima di Lubiana, e il trenino già nel 1872.


      La guerra vi impresse il proprio segno: gli occupanti tedeschi vi stoccarono circa mille fusti di
      carburante avio, fatti esplodere dai partigiani sloveni nell'aprile 1944. L'incendio divampò per una
      settimana, annerendo le volte di fuliggine e originando il nome di Črna jama (Grotta Nera).


      Sul polje la storia è fatta di convivenza con le alluvioni: l'Unica fu parzialmente arginata e vari
      inghiottitoi vennero murati. I ruderi del castello medievale di Haasberg e del Piccolo Castello
      punteggiano il fondovalle. La grotta di Planina e parte del polje sono protette dal 1971, con il settore
      sud-occidentale istituito a parco paesaggistico su circa seicentosessantotto ettari.
    before: >-
      Nella grotta la temperatura è costante a dieci gradi tutto l'anno: porta abiti caldi e scarpe sportive
      comode. Foto ammesse senza flash né treppiede. Gli animali domestici non possono entrare per preservare
      il delicato ecosistema ipogeo. Presentati circa quindici minuti prima della partenza del convoglio. La
      grotta di Planina è accessibile unicamente con speleologi previo accordo.
    around: >-
      A un chilometro si trova l'[Altopiano Carsico di Nanos](/lugar/kraska-planota-nanos/) e, sempre a un
      chilometro, le [Foreste e Altopiano Carsico di
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/). A otto chilometri si stende il [Parco
      Paesaggistico della Palude di Lubiana](/lugar/krajinski-park-ljubljansko-barje/), a dieci il [Complesso
      Forestale di Kočevsko](/lugar/kocevski-gozdni-kompleks/), a quindici il [Massiccio di
      Snježnik](/lugar/snjeznik-massif-croatia/) e a venti le [Grotte di San
      Canziano](/lugar/park-skocjanske-jame/). Nel medesimo comprensorio ricade il [Lago Intermittente di
      Cerknica](/lugar/cerknisko-jezero/). Più lontano, il [Polje di Popovo e Sistema Idrocarsico della Grotta
      Vjetrenica](/lugar/popovo-polje---pecina-vjetrenica/) condivide con questo luogo la presenza del proteo.
  pt:
    intro: >-
      Um rio embrenha-se na montanha por um flanco, percorre quilómetros na escuridão e ressurge do outro lado
      com designação diferente. Este é o Carso clássico de Postojna e Planina: o rio Pivka afunda-se sob o
      monte Sovič, cruza a gruta de Postojna, junta-se ao Rak na gruta de Planina e brota à luz como Unica,
      voltando a sumir-se na rocha antes de reaparecer como Ljubljanica. Pelo meio somam-se vinte e quatro
      quilómetros de galerias, uma planície que alaga várias vezes por ano e um anfíbio cego que intriga a
      comunidade científica desde 1797.
    landscape: >-
      Tudo começa com a água e a paciência. O rio Pivka abre caminho há milhões de anos e, à medida que
      rebaixava o seu leito, desenhou os sucessivos pisos da gruta de Postojna. Posteriormente, a água de
      infiltração depositou calcite ao longo de milénios, erguendo estalagmites, estalactites e formações
      drapeadas semelhantes a tecidos ondulados. A mais afamada é o Brilhante, uma estalagmite branquíssima de
      cinco metros que se converteu no símbolo da caverna e do Carso esloveno.


      A gruta mede mais de vinte e quatro quilómetros, sendo a segunda mais extensa da Eslovénia. A quinhentos
      metros da entrada da gruta de Planina juntam-se o Pivka vindo de Postojna e o Rak chegado de Rak
      Škocjan: uma das maiores confluências fluviais subterrâneas da Europa. Os ensaios com traçadores
      comprovam a ligação entre os sistemas, prosseguindo os mergulhadores espeleológicos na exploração dos
      sifões; combinadas, as duas grutas ultrapassariam os trinta e um quilómetros.


      À superfície, o cenário muda de escala. O Planinsko polje é um polje, uma bacia cárstica de fundo
      perfeitamente plano: com cerca de cinco quilómetros de comprimento, dois e meio de largura e mais de dez
      quilómetros quadrados de planície a quatrocentos e cinquenta metros de altitude. O rio Unica nasce na
      gruta de Planina com um caudal médio de vinte e quatro metros cúbicos por segundo, oscilando entre meros
      trezentos litros e cem metros cúbicos. Nas cheias, os sumidouros periféricos não têm vazão suficiente. O
      polje inunda várias vezes ao ano, as águas podem permanecer até dois meses e a coluna de água atinge dez
      metros em certas zonas. Por esse motivo, no fundo só existem prados húmidos em vez de campos agrícolas,
      situando-se as aldeias e cultivos — com Planina à cabeça — nas orlas ligeiramente sobrelevadas.
    wildlife: >-
      O complexo subterrâneo atua como laboratório pioneiro da vida cavernícola. No sistema Postojna-Planina
      foram identificadas mais de cento e setenta e cinco espécies de fauna, das quais cento e quinze são
      troglóbias estritas — um recorde mundial de biodiversidade cavernícola. Aqui foi descoberto em 1831 o
      primeiro escaravelho de gruta conhecido, derrubando a tese de que os abismos eram estéreis. A grande
      referência é o [proteu](/especie/proteus_anguinus/): descoberto na Črna jama em 1797, é o maior
      vertebrado troglóbio do planeta, capaz de jejuar dez anos e inspirador de antigas lendas sobre crias de
      dragão. Em 2016 uma fêmea depositou mais de cinquenta ovos no aquário da gruta, nascendo vinte e duas
      crias entre o final de maio e meados de julho.


      À superfície a vida articula-se em torno da água. O rio Unica serpenteia pelo polje com trutas e tímalos
      abundantes. Os prados inundáveis albergam uma raridade florística: *Scilla litardierei*, endemismo dos
      poljes dináricos no seu limite norocidental.


      O calendário divide-se em dois mundos: no subsolo não existem estações, mantendo-se a temperatura em dez
      graus o ano inteiro; no polje, pelo contrário, as chuvas transformam a paisagem entre pastagem e lago.
    visit: >-
      O percurso turístico habitual da gruta de Postojna dura hora e meia e percorre cerca de cinco
      quilómetros, dos quais três e meio em comboio subterrâneo e pouco mais de um quilómetro a pé com guia. É
      o único caminho de ferro de via dupla numa gruta a nível mundial, com 3,7 km de extensão. O piso é em
      betão antiderrapante, incluindo uma rampa de duzentos metros com inclinação de vinte por cento.
      Circuitos de aventura conduzem a galerias remotas para praticantes experientes.


      À superfície, o recinto conta com o biotério Proteusova jama, estação de espeleobiologia a cinquenta
      metros da entrada, e o pavilhão EXPO Postojnska jama com exposições sobre carso e arqueologia.


      No polje de Planina os ritmos abrandam. A recuperada torre Ravbar ergue-se junto à entrada da gruta de
      Planina. Esta cavidade, famosa por espeleotemas e proteus, só é visitável com espeleólogos credenciados
      sob marcação prévia. Nas margens do polje abrem-se nascentes e sumidouros, incluindo os poços de Putick,
      batizados em homenagem ao pioneiro Viljem Putick.
    history: >-
      As inscrições nas paredes de Postojna remontam a 1213, documentando visitas muito anteriores aos relatos
      de Valvasor no século XVII. O turismo organizado começou quando o acendedor de candeeiros Luka Čeč
      descobriu novas salas e se tornou o primeiro guia. A gruta recebeu iluminação elétrica em 1884, antes de
      Liubliana, e a sua ferrovia em 1872.


      A guerra marcou o local: as tropas alemãs armazenaram quase mil barris de combustível de aviação nas
      galerias, destruídos pelos guerrilheiros eslovenos em abril de 1944. As chamas arderam durante uma
      semana, quebrando formações e cobrindo as rochas de fuligem — daí o nome Črna jama (Gruta Negra).


      No polje, a comunidade aprendeu a conviver com as cheias: o leito do Unica foi canalizado e fecharam-se
      vários sumidouros. As ruínas do castelo de Haasberg e do Castelo Pequeno completam a paisagem. A gruta
      de Planina e setores do polje estão protegidos desde 1971, com o sudoeste classificado como parque
      paisagístico em cerca de seiscentas e sessenta e oito hectares.
    before: >-
      Na gruta a temperatura cifra-se permanentemente em dez graus todo o ano: leva agasalhos e calçado
      confortável. São permitidas fotografias sem flash nem tripé. Não é permitida a entrada de animais de
      estimação para salvaguarda do ecossistema. Comparece cerca de quinze minutos antes do embarque no
      comboio. A gruta de Planina só pode ser visitada com acompanhamento de espeleólogos mediante contacto
      prévio.
    around: >-
      A um quilómetro ergue-se o [Planalto Cárstico de Nanos](/lugar/kraska-planota-nanos/) e, também a um
      quilómetro, as [Florestas e Planalto Cárstico de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/). A oito quilómetros estende-se o
      [Parque Paisagístico do Pântano de Liubliana](/lugar/krajinski-park-ljubljansko-barje/), a dez o
      [Complexo Florestal de Kočevsko](/lugar/kocevski-gozdni-kompleks/), a quinze o [Maciço de
      Snježnik](/lugar/snjeznik-massif-croatia/) e a vinte as [Grutas de
      Škocjan](/lugar/park-skocjanske-jame/). No mesmo território situa-se o [Lago Intermitente de
      Cerknica](/lugar/cerknisko-jezero/). Mais distante, o [Polje de Popovo e Sistema Hidrocárstico da Gruta
      Vjetrenica](/lugar/popovo-polje---pecina-vjetrenica/) partilha com este lugar o proteu e o universo das
      águas cársticas.
