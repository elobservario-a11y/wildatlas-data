texto:
  es:
    intro: >-
      Entre el fondo del cañón del Tara y la cima de Bobotov Kuk hay casi dos mil metros de desnivel, y todo
      cabe en un mismo parque. Durmitor, en el norte de Montenegro, reúne una meseta a unos 1500 metros, un
      macizo con más de 48 cumbres por encima de los 2000 y un río que corre encajado en uno de los cañones
      más profundos de Europa: entre 1000 y, en algunos puntos, 1300 metros de profundidad a lo largo de unos
      78 kilómetros.


      Hielo, caliza y agua hicieron el resto. El parque nacional, con parte del cañón del Tara, figura desde
      1980 en la Lista del Patrimonio Mundial natural de la UNESCO, y la cuenca del Tara está protegida desde
      1977 como reserva de la biosfera.
    landscape: >-
      El paisaje es una amplia meseta de montaña a unos 1500 metros de altitud, cortada por profundos valles
      de cañón, con el macizo de Durmitor en el centro. El macizo está cortado por cañones de ríos y arroyos y
      salpicado de dolinas, hondonadas y mesetas. La cima más alta es Bobotov Kuk, con 2523 metros, y es
      también el punto más alto del parque.


      La glaciación dejó aquí sus huellas bien conservadas, y de origen glaciar son los numerosos lagos de
      montaña, que se llaman «ojos de la montaña»: se cuentan dieciocho en el macizo. El Lago Negro, el más
      conocido, es además una divisoria de aguas: sus aguas subterráneas se reparten entre las cuencas del
      Tara y del Piva o Komarnica.


      La altura marca la vegetación. El macizo es uno de los centros de desarrollo de la flora balcánica, con
      elementos alpinos y alpino-árticos arriba; en las laderas sur, sobre todo en los valles del cañón, se
      mezclan plantas submediterráneas e incluso mediterráneas; y las turberas de algunos lagos son enclaves
      típicos de la taiga siberiana. Entre las plantas endémicas está Edraianthus tarae, del cañón del Tara.
      En las zonas más altas, sobre todo en vertientes sin sol y hondonadas, la nieve se mantiene incluso en
      pleno verano.
    wildlife: >-
      Durmitor figura entre las zonas ornitológicas más valiosas de Montenegro: se han registrado 172 especies
      de aves, 112 de ellas reproductoras. Entre las que crían están el [halcón
      abejero](/especie/pernis_apivorus/), el [águila real](/especie/aquila_chrysaetos/), el [halcón
      peregrino](/especie/falco_peregrinus/), el [cernícalo vulgar](/especie/falco_tinnunculus/) y la perdiz
      griega; también el [urogallo](/especie/tetrao_urogallus/), el [búho real](/especie/bubo_bubo/), el [pico
      tridáctilo](/especie/picoides_tridactylus/) y el mochuelo boreal. En los pastos y roquedos de alta
      montaña viven el águila real, la alondra cornuda y la chova piquigualda; en las paredes, el
      [treparriscos](/especie/tichodroma_muraria/) y el [buitre leonado](/especie/gyps_fulvus/); en los
      bosques de coníferas, el urogallo y el [pito negro](/especie/dryocopus_martius/); y en los de
      caducifolios de montaña, el [pico dorsiblanco](/especie/dendrocopos_leucotos/).


      Los mamíferos suman 43 especies registradas: 11 de murciélagos, 11 de roedores, 3 de artiodáctilos y 6
      de carnívoros, entre otros. Para proteger su fauna de grandes mamíferos, parte del macizo y el Lago
      Negro ya se declararon espacio protegido en 1907. En los ecosistemas alpinos de pastos y praderas viven
      [rebecos](/especie/rupicapra_rupicapra/), [osos pardos](/especie/ursus_arctos/) y [lobos
      grises](/especie/canis_lupus/).


      El Tara, en cambio, es el hogar de peces autóctonos: en su curso dentro del parque hay ocho especies,
      todas autóctonas, entre ellas el [salmón del Danubio](/especie/hucho_hucho/). Los lagos de Durmitor,
      aunque numerosos, solo tienen especies introducidas. Entre los anfibios, la salamandra alpina se
      menciona desde las primeras investigaciones. Entre los insectos hay 134 especies de mariposas diurnas,
      un número muy alto respecto al conjunto de Montenegro, y entre los insectos protegidos están el [ciervo
      volante](/especie/lucanus_cervus/) y la [rosalía alpina](/especie/rosalia_alpina/).
    visit: >-
      La puerta de entrada es Žabljak: allí están el edificio de administración y un centro de visitantes. El
      parque cuenta con 25 sendas peatonales y de montaña señalizadas, de longitud y dificultad variadas. Una
      ruta clásica va de Žabljak por Lokvice hasta Bobotov Kuk; otra, del Lago Negro por Struga hasta Mali
      Međed y Veliki Međed; una de varias jornadas enlaza Žabljak, el lago Žmijinje, Alisnica, Planinica y
      Škrka.


      La senda educativa alrededor del Lago Negro es la más visitada del parque, y hay además dos recorridos
      temáticos, la Staza mlinova y «En el abrazo del bosque y los tres lagos». En invierno hay una ruta
      señalizada para caminar con raquetas desde el centro de esquí de Savin Kuk hasta el Lago Negro.


      Para el cañón, los dos miradores acondicionados son Ćurevac y Nedajno; desde Ćurevac se contempla el
      cañón del Tara. La ruta panorámica Durmitorski prsten mide 76 km, u 83 si incluye el mirador de Ćurevac,
      y atraviesa también el Parque Natural de Piva. Para quien prefiera la bicicleta, el anillo ciclista de
      Durmitor es una ruta circular de montaña que exige buena preparación física.
    history: >-
      La huella humana más antigua se concentra en el cañón del Tara. Las necrópolis de stećci de los siglos
      XIV y XV son muy abundantes; las más valiosas, con figuras y escenas de caza, están en Novakovići, junto
      al lago Riblje y en Bare Žugića. En el cañón del Tara hay también tres monasterios: San Jorge en
      Dobrilovina, la Asunción en Dovolja y el Arcángel Miguel en Đurđevića Tara. Los pastores usaban los
      katuns, viviendas de verano en la montaña, y los vatans, de invierno.


      La protección actual combina zonas. Las reservas estrictas suman unas 3400 hectáreas, alrededor del 11 %
      del parque, e incluyen el bosque primario de abeto y pícea de la cuenca del Mlinski potok y el bosque de
      pino negro de Crna Poda.
    before: >-
      Dentro de las zonas de protección estricta hay que moverse sin hacer ruido y en grupos con guía. El
      camping solo está permitido en lugares determinados. La mejor época va de mayo a octubre.
    around: >-
      Pegado al parque, a un kilómetro, el [Parque Natural de Piva](/lugar/park-prirode-piva/) y las [Montañas
      de Volujak](/lugar/planina-volujak/); a dos, el [Macizo de Bioč](/lugar/masiv-bioca/), y a cuatro la
      [Meseta Kárstica de Sinjajevina](/lugar/sinjajevina-karst-plateau/). A catorce kilómetros está el
      [Parque Nacional Biogradska Gora](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), y a veinte
      el [Parque Nacional Sutjeska - Macizo de Maglić](/lugar/nacionalni-park-sutjeska---maglic/). El macizo
      montañoso del propio parque tiene su ficha: [Parque Nacional Durmitor - Macizo
      Montañoso](/lugar/nacionalni-park-durmitor---masiv/). Lejos de aquí, el [Parque Nacional
      Una](/lugar/nacionalni-park-una---gorji-tok/) comparte el salmón del Danubio, el oso pardo y el lobo en
      un paisaje de cañón.
  en:
    intro: >-
      Between the depths of the Tara canyon and the summit of Bobotov Kuk lies nearly two thousand metres of
      vertical relief, all contained within a single park. Durmitor, in northern Montenegro, unites a high
      plateau at some 1500 metres, a mountain massif with more than 48 peaks soaring above 2000, and a river
      rushing through one of Europe's deepest canyons: between 1000 and, in places, 1300 metres deep across
      some 78 kilometres.


      Ice, limestone and water sculpted the landscape. The national park, encompassing the Tara canyon, has
      featured on the UNESCO World Natural Heritage List since 1980, and the Tara basin has been protected
      since 1977 as a biosphere reserve.
    landscape: >-
      The terrain is an extensive highland plateau at roughly 1500 metres elevation, cleaved by deep canyon
      chasms, with the Durmitor massif rising at its heart. The massif is fractured by river gorges and dotted
      with sinkholes, hollows and hanging plateaus. Its crowning pinnacle is Bobotov Kuk at 2523 metres,
      forming the highest point in the park.


      Glacial forces left pristine footprints here, most visibly in the numerous glacial tarns locally called
      'mountain eyes': eighteen are scattered across the massif. Black Lake, the most renowned, functions as a
      hydrological divide: its subterranean outlets split between the drainage basins of the Tara and the Piva
      or Komarnica.


      Altitude strictly governs vegetation. The massif stands as an evolutionary cradle for Balkan flora,
      holding alpine and arctic-alpine elements on high ridges; southern canyon slopes shelter
      sub-Mediterranean and Mediterranean flora; while lake peat bogs represent relic enclaves of Siberian
      taiga. Endemics include Edraianthus tarae along the Tara canyon cliffs. In shaded cirques and
      north-facing hollows, snow patches persist throughout the heat of summer.
    wildlife: >-
      Durmitor ranks among the premier ornithological reserves in Montenegro, with 172 bird species recorded,
      112 of which breed here. Nesting species include the [European honey
      buzzard](/especie/pernis_apivorus/), [golden eagle](/especie/aquila_chrysaetos/), [peregrine
      falcon](/especie/falco_peregrinus/), [common kestrel](/especie/falco_tinnunculus/) and rock partridge,
      alongside the [western capercaillie](/especie/tetrao_urogallus/), [Eurasian
      eagle-owl](/especie/bubo_bubo/), [Eurasian three-toed woodpecker](/especie/picoides_tridactylus/) and
      boreal owl. Alpine screes and grasslands harbour golden eagles, horned larks and yellow-billed choughs;
      vertical cliffs shelter the [wallcreeper](/especie/tichodroma_muraria/) and [griffon
      vulture](/especie/gyps_fulvus/); conifer forests support capercaillie and [black
      woodpecker](/especie/dryocopus_martius/); while mountain deciduous woods shelter the [white-backed
      woodpecker](/especie/dendrocopos_leucotos/).


      Mammals number 43 recorded species: 11 bats, 11 rodents, 3 artiodactyls and 6 carnivores, among others.
      To safeguard this large mammal fauna, parts of the massif and Black Lake were declared protected
      territory as early as 1907. Alpine pastures and meadows support
      [chamois](/especie/rupicapra_rupicapra/), [brown bears](/especie/ursus_arctos/) and [grey
      wolves](/especie/canis_lupus/).


      The Tara River serves as a refuge for native fish: its waters within the park host eight native fish
      species, including the endangered [huchen](/especie/hucho_hucho/). By contrast, Durmitor's lakes support
      only introduced fish. Alpine salamanders feature in early biological literature. Insects comprise 134
      diurnal butterfly species—an exceptional diversity for Montenegro—alongside protected beetles like the
      [stag beetle](/especie/lucanus_cervus/) and [Rosalia longicorn](/especie/rosalia_alpina/).
    visit: >-
      The main gateway is Žabljak, home to park headquarters and a visitor centre. The park maintains 25
      marked footpaths and alpine routes of diverse difficulty and length. A classic trek leads from Žabljak
      through Lokvice to Bobotov Kuk; another from Black Lake via Struga to Mali Međed and Veliki Međed; while
      a multi-day traverse links Žabljak, Lake Žmijinje, Alisnica, Planinica and Škrka.


      The educational nature trail circling Black Lake is the most frequented in the park, complemented by two
      thematic routes, the Staza mlinova and 'In the embrace of the forest and three lakes'. In winter, a
      marked snowshoe trail connects Savin Kuk ski centre to Black Lake.


      For canyon panoramas, the two primary lookouts are Ćurevac and Nedajno; Ćurevac gazes straight down into
      the Tara canyon abyss. The scenic Durmitorski prsten driving loop spans 76 km, or 83 km including the
      detour to Ćurevac viewpoint, crossing into Piva Nature Park. For cyclists, the Durmitor mountain bike
      circuit offers an exhilarating, physically demanding loop.
    history: >-
      Human heritage is intimately tied to the Tara canyon. Medieval stećci necropolises from the XIV and XV
      centuries abound; the most ornate, carved with hunting scenes and geometric figures, lie at Novakovići,
      beside Lake Riblje and at Bare Žugića. Three historic monasteries grace the canyon: Saint George at
      Dobrilovina, the Dormition at Dovolja, and Archangel Michael at Đurđevića Tara. Mountain pastoralists
      relied on seasonal katuns for summer grazing and vatans for winter sheltering.


      Zoning balances conservation: strict nature reserves span some 3400 hectares, roughly 11% of the park,
      encompassing the virgin spruce-fir forest of Mlinski potok and the ancient black pine stand of Crna
      Poda.
    before: >-
      Travel in strict nature zones must be quiet and accompanied by licensed guides. Wild camping is
      prohibited outside designated campsites. Optimal conditions prevail from May to October.
    around: >-
      Bordering the park just one kilometre away lie [Piva Nature Park](/lugar/park-prirode-piva/) and the
      [Volujak Mountains](/lugar/planina-volujak/); two kilometres away sits the [Bioč
      Massif](/lugar/masiv-bioca/), and four kilometres the [Sinjajevina Karst
      Plateau](/lugar/sinjajevina-karst-plateau/). Fourteen kilometres away lies [Biogradska Gora National
      Park](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), and twenty kilometres [Sutjeska National
      Park – Maglić Massif](/lugar/nacionalni-park-sutjeska---maglic/). The park's mountain massif is profiled
      in [Durmitor National Park – Mountain Massif](/lugar/nacionalni-park-durmitor---masiv/). Further away,
      [Una National Park](/lugar/nacionalni-park-una---gorji-tok/) shares huchen, brown bear and wolf in a
      dramatic karst canyon landscape.
  fr:
    intro: >-
      Entre le fond du canyon de la Tara et le sommet du Bobotov Kuk s'étirent près de deux mille mètres de
      dénivelé, rassemblés dans un seul parc. Le Durmitor, au nord du Monténégro, réunit un haut plateau
      calcaire à 1500 mètres, un massif comptant plus de 48 sommets dépassant 2000 m d'altitude et une rivière
      encaissée dans l'un des défilés les plus vertigineux d'Europe : entre 1000 et, par endroits, 1300 mètres
      de profondeur sur quelque 78 kilomètres.


      La glace, le calcaire et l'eau ont fait le reste. Le parc national, incluant le canyon de la Tara, est
      inscrit depuis 1980 sur la Liste du patrimoine mondial de l'UNESCO, et le bassin versant de la Tara est
      classé depuis 1977 comme réserve de biosphère.
    landscape: >-
      Le décor est un vaste plateau d'altitude vers 1500 mètres, entaillé par de profondes gorges, dominé par
      le massif calcaire du Durmitor. Le relief est creusé de vallées et parsemé de dolines, dépressions et
      plateaux suspendus. La cime maîtresse est le Bobotov Kuk avec ses 2523 mètres, point culminant du parc.


      L'érosion glaciaire a sculpté des formes spectaculaires, notamment de nombreux lacs appelés localement
      les 'yeux de la montagne' : on en compte dix-huit dans le massif. Le Lac Noir, le plus célèbre, forme
      une ligne de partage des eaux : ses infiltrations souterraines s'écoulent à la fois vers le bassin de la
      Tara et vers celui de la Piva ou Komarnica.


      L'étagement dicte la flore. Le massif est un carrefour biogéographique balkanique, mêlant plantes
      alpines et arctico-alpines sur les crêtes ; les pentes méridionales des canyons hébergent une végétation
      subméditerranéenne ; tandis que les tourbières lacustres forment des enclaves de taïga sibérienne. Parmi
      les endémiques figure Edraianthus tarae, accroché aux falaises du canyon. Dans les combes d'ombrée, la
      neige subsiste tout l'été.
    wildlife: >-
      Le Durmitor figure parmi les espaces ornithologiques majeurs du Monténégro : 172 espèces d'oiseaux y
      sont observées, dont 112 nicheuses. Parmi les reproducteurs figurent la [bondrée
      apivore](/especie/pernis_apivorus/), l'[aigle royal](/especie/aquila_chrysaetos/), le [faucon
      pèlerin](/especie/falco_peregrinus/), le [faucon crécerelle](/especie/falco_tinnunculus/) et la perdrix
      bartavelle ; mais aussi le [grand tétras](/especie/tetrao_urogallus/), le [grand-duc
      d'Europe](/especie/bubo_bubo/), le [pic tridactyle](/especie/picoides_tridactylus/) et la chouette de
      Tengmalm. Les pierriers alpins abritent alouette hausse-col et chocard à bec jaune ; les parois
      accueillent le [tichodrome échelette](/especie/tichodroma_muraria/) et le [vautour
      fauve](/especie/gyps_fulvus/) ; les conifères abritent grand tétras et [pic
      noir](/especie/dryocopus_martius/) ; et les feuillus hébergent le [pic à dos
      blanc](/especie/dendrocopos_leucotos/).


      Les mammifères comptent 43 espèces : 11 de chauves-souris, 11 de rongeurs, 3 d'artiodactyles et 6 de
      carnivores. Pour protéger la grande faune, le Lac Noir et une partie du massif furent déclarés zone
      protégée dès 1907. Les alpages accueillent la [chamois](/especie/rupicapra_rupicapra/), l'[ours
      brun](/especie/ursus_arctos/) et le [loup](/especie/canis_lupus/).


      La Tara héberge huit espèces de poissons autochtones, dont le rare [saumon du
      Danube](/especie/hucho_hucho/). Les lacs du Durmitor ne comptent que des espèces introduites. La
      salamandre noire est documentée depuis les premières explorations. Les insectes comptent 134 espèces de
      papillons de jour, ainsi que le [lucane cerf-volant](/especie/lucanus_cervus/) et la [rosalie des
      Alpes](/especie/rosalia_alpina/).
    visit: >-
      La localité de Žabljak constitue le camp de base, avec le siège du parc et son centre d'accueil. On y
      trouve 25 sentiers de randonnée balisés de niveaux variés. Un grand classique relie Žabljak à Bobotov
      Kuk via Lokvice ; un autre mène du Lac Noir à Mali Međed et Veliki Međed par Struga ; tandis qu'une
      boucle de plusieurs jours relie Žabljak, le lac Žmijinje, Alisnica, Planinica et Škrka.


      Le sentier didactique autour du Lac Noir est le plus fréquenté, enrichi des circuits thématiques Staza
      mlinova et 'Au cœur de la forêt et des trois lacs'. En hiver, un tracé de raquettes relie la station de
      ski de Savin Kuk au Lac Noir.


      Pour admirer le gouffre, les deux belvédères phares sont Ćurevac et Nedajno ; Ćurevac surplombe
      directement le canyon de la Tara. La boucle routière panoramique Durmitorski prsten mesure 76 km, ou 83
      km en intégrant le promontoire de Ćurevac, traversant aussi le parc naturel de Piva. Les cyclistes
      aguerris apprécieront cette boucle d'altitude exigeante.
    history: >-
      Le patrimoine médiéval est ancré dans la vallée de la Tara. Les nécropoles de stećci des XIVe et XVe
      siècles sont nombreuses ; les plus ornées de scènes cynégétiques se trouvent à Novakovići, au lac Riblje
      et à Bare Žugića. Le canyon abrite trois monastères : Saint-Georges à Dobrilovina, la Dormition à
      Dovolja et l'Archange-Michel à Đurđevića Tara. Les bergers transhumants occupaient les katuns l'été et
      les vatans l'hiver.


      Les réserves intégrales couvrent 3400 hectares, soit environ 11 % du parc, protégeant la
      pessière-sapinière vierge de Mlinski potok et la pinède séculaire de pin noir de Crna Poda.
    before: >-
      En zone de protection intégrale, la progression doit être silencieuse et encadrée par des guides
      assermentés. Le bivouac sauvage est prohibé hors des terrains autorisés. La meilleure saison s'étend de
      mai à octobre.
    around: >-
      Attenants au parc, à un kilomètre, se trouvent le [Parc naturel de Piva](/lugar/park-prirode-piva/) et
      les [Montagnes de Volujak](/lugar/planina-volujak/) ; à deux kilomètres le [Massif de
      Bioč](/lugar/masiv-bioca/), et à quatre le [Plateau karstique de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/). À quatorze kilomètres s'étend le [Parc national de
      Biogradska Gora](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), et à vingt le [Parc national
      de Sutjeska – Massif du Maglić](/lugar/nacionalni-park-sutjeska---maglic/). Le relief montagneux fait
      l'objet d'une fiche spécifique : [Parc national du Durmitor – Massif
      montagneux](/lugar/nacionalni-park-durmitor---masiv/). Plus loin, le [Parc national
      d'Una](/lugar/nacionalni-park-una---gorji-tok/) partage saumon du Danube, ours et loup dans un
      impressionnant défilé karstique.
  de:
    intro: >-
      Zwischen der Sohle des Tara-Canyons und dem Gipfel des Bobotov Kuk liegen fast zweitausend Höhenmeter in
      einem einzigen Park. Der Durmitor im Norden Montenegros vereint ein Hochplateau auf 1500 Metern, ein
      Gebirgsmassiv mit mehr als 48 Gipfeln über 2000 Metern und einen Fluss, der durch eine der tiefsten
      Schluchten Europas rauscht: zwischen 1000 und stellenweise 1300 Meter tief auf einer Länge von rund 78
      Kilometern.


      Eis, Kalkstein und Wasser formten diese Kulisse. Der Nationalpark mitsamt der Tara-Schlucht steht seit
      1980 auf der UNESCO-Welterbeliste, und das Einzugsgebiet der Tara ist seit 1977 als Biosphärenreservat
      geschützt.
    landscape: >-
      Die Landschaft präsentiert sich als weite Hochebene auf etwa 1500 Metern Höhe, zerschnitten von tiefen
      Canyontälern, mit dem Durmitor-Massiv im Zentrum. Das Bergland ist von Flussschluchten durchschnitten
      und von Dolinen, Senken und Hochplateaus geprägt. Höchster Punkt des Massivs und des gesamten Parks ist
      der Bobotov Kuk mit 2523 Metern.


      Die Vergletscherung hinterließ zahlreiche Karseen, die als 'Augen der Berge' bezeichnet werden: achtzehn
      zählt man im Massiv. Der bekannteste, der Schwarze See, bildet eine hydrologische Wasserscheide: Seine
      unterirdischen Abflüsse verzweigen sich zwischen den Einzugsgebieten der Tara und der Piva oder
      Komarnica.


      Die Höhenstufen prägen die Vegetation. Das Massiv ist ein Entwicklungszentrum der Balkanflora mit
      alpinen und arktisch-alpinen Arten auf den Graten; die südlichen Felshänge der Schlucht tragen
      submediterrane Pflanzen; während Karseemoore Enklaven sibirischer Taiga darstellen. Zu den Endemiten
      gehört Edraianthus tarae an den Felswänden der Tara. In schattigen Mulden hält sich Altschnee bis in den
      Hochsommer.
    wildlife: >-
      Der Durmitor zählt zu den wertvollsten Vogelschutzgebieten Montenegros: 172 Vogelarten wurden erfasst,
      davon 112 Brutvögel. Zu den Brutvögeln gehören [Wespenbussard](/especie/pernis_apivorus/),
      [Steinadler](/especie/aquila_chrysaetos/), [Wanderfalke](/especie/falco_peregrinus/),
      [Turmfalke](/especie/falco_tinnunculus/) und Steinhuhn; ferner [Auerhuhn](/especie/tetrao_urogallus/),
      [Uhu](/especie/bubo_bubo/), [Dreizehenspecht](/especie/picoides_tridactylus/) und Raufußkauz. Alpine
      Matten beherbergen Steinadler, Ohrenlerche und Alpendohle; Steilwände bieten Lebensraum für
      [Mauerläufer](/especie/tichodroma_muraria/) und [Gänsegeier](/especie/gyps_fulvus/); Nadelwälder stützen
      Auerhuhn und [Schwarzspecht](/especie/dryocopus_martius/); und Bergwälder beherbergen den
      [Weißrückenspecht](/especie/dendrocopos_leucotos/).


      Säugetiere zählen 43 nachgewiesene Arten: 11 Fledermäuse, 11 Nagetiere, 3 Paarhufer und 6 Raubtiere. Zum
      Schutz des Großwilds wurden Teile des Gebirges und der Schwarze See bereits 1907 unter Schutz gestellt.
      Auf Almmatten leben [Gämse](/especie/rupicapra_rupicapra/), [Braunbär](/especie/ursus_arctos/) und
      [Wolf](/especie/canis_lupus/).


      Die Tara beherbergt acht einheimische Fischarten, darunter den bedrohten
      [Huchen](/especie/hucho_hucho/). In den Durmitor-Seen leben nur eingesetzte Fische. Alpensalamander sind
      seit frühen Forschungen bekannt. Zu den Insekten zählen 134 Tagfalterarten sowie geschützte Käfer wie
      [Hirschkäfer](/especie/lucanus_cervus/) und [Alpenbock](/especie/rosalia_alpina/).
    visit: >-
      Hauptort ist Žabljak mit der Parkverwaltung und einem Informationszentrum. 25 markierte Berg- und
      Wanderwege verschiedener Schwierigkeitsgrade erschließen die Gipfel. Eine klassische Bergtour führt von
      Žabljak über Lokvice auf den Bobotov Kuk; eine andere vom Schwarzen See über Struga zum Mali Međed und
      Veliki Međed; während eine Mehrtagestour Žabljak, Žmijinje-See, Alisnica, Planinica und Škrka verbindet.


      Der Lehrpfad um den Schwarzen See ist der meistbesuchte Weg, ergänzt durch die Themenrouten Staza
      mlinova und 'In der Umarmung von Wald und drei Seen'. Im Winter verbindet ein Schneeschuhtrail das
      Skizentrum Savin Kuk mit dem Schwarzen See.


      Für den Tiefblick in die Schlucht sorgen die Aussichtspunkte Ćurevac und Nedajno; Ćurevac blickt
      senkrecht in die Tara-Schlucht. Die Panoramastraße Durmitorski prsten misst 76 km, beziehungsweise 83 km
      mit Abstecher zum Ćurevac, und berührt auch den Naturpark Piva. Geübte Mountainbiker finden im Rundweg
      um das Massiv eine anspruchsvolle Herausforderung.
    history: >-
      Mittelalterliche Zeugnisse prägen das Tara-Tal. Stećci-Nekropolen des XIV. und XV. Jahrhunderts sind
      zahlreich; die kunstvollsten mit Jagdmotiven liegen bei Novakovići, am Riblje-See und in Bare Žugića. Im
      Tara-Canyon stehen drei Klöster: St. Georg in Dobrilovina, Mariä Himmelfahrt in Dovolja und Erzengel
      Michael bei Đurđevića Tara. Almhirten nutzten Katuns im Sommer und Vatans im Winter.


      Strenge Naturreservate umfassen etwa 3400 Hektar, rund 11 % der Parkfläche, darunter der
      Fichten-Tannen-Urwald von Mlinski potok und der alte Schwarzkiefernwald von Crna Poda.
    before: >-
      In Kernzonen ist ruhiges Verhalten Pflicht und der Zutritt nur in geführten Gruppen erlaubt. Wildzelten
      ist verboten. Die beste Reisezeit liegt zwischen Mai und Oktober.
    around: >-
      Direkt angrenzend, einen Kilometer entfernt, liegen der [Naturpark Piva](/lugar/park-prirode-piva/) und
      das [Volujak-Gebirge](/lugar/planina-volujak/); zwei Kilometer entfernt das
      [Bioč-Massiv](/lugar/masiv-bioca/) und vier Kilometer die
      [Sinjajevina-Karsthochfläche](/lugar/sinjajevina-karst-plateau/). Vierzehn Kilometer entfernt liegt der
      [Nationalpark Biogradska Gora](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/) und zwanzig
      Kilometer der [Nationalpark Sutjeska – Maglić-Massiv](/lugar/nacionalni-park-sutjeska---maglic/). Das
      Massiv selbst wird in [Nationalpark Durmitor – Gebirgsmassiv](/lugar/nacionalni-park-durmitor---masiv/)
      beschrieben. Weiter entfernt teilt der [Nationalpark Una](/lugar/nacionalni-park-una---gorji-tok/)
      Huchen, Braunbär und Wolf in einer Karstschluchtlandschaft.
  it:
    intro: >-
      Tra il fondo del canyon della Tara e la vetta del Bobotov Kuk si contano quasi duemila metri di
      dislivello, racchiusi in un unico parco. Il Durmitor, nel nord del Montenegro, accosta un altopiano a
      circa 1500 metri, un massiccio con oltre 48 cime sopra i 2000 metri e un fiume incassato in una delle
      forre più impressionanti d'Europa: profonda tra 1000 e, a tratti, 1300 metri lungo un corso di circa 78
      chilometri.


      Ghiaccio, calcare e acqua hanno plasmato il paesaggio. Il parco nazionale, comprendente il canyon della
      Tara, è iscritto dal 1980 nel Patrimonio Mondiale UNESCO, e il bacino della Tara è tutelato dal 1977
      come riserva della biosfera.
    landscape: >-
      L'orografia disegna un altopiano carsico a circa 1500 metri di quota, solcato da vallate a canyon,
      sovrastato dal massiccio del Durmitor. L'area è intagliata da forre e costellata da doline, conche e
      altipiani sospesi. La cima culminante è il Bobotov Kuk con 2523 metri, massima elevazione del parco.


      Il modellamento glaciale ha lasciato tracce intatte, visibili nei laghi d'alta quota detti 'occhi della
      montagna': se ne contano diciotto nel massiccio. Il Lago Nero, il più celebre, costituisce uno
      spartiacque idrologico: le sue perdite sotterranee si distribuiscono tra i bacini fluviali della Tara e
      della Piva o Komarnica.


      La quota governa la vegetazione. Il massiccio rappresenta un centro evolutivo per la flora balcanica con
      entità alpine e artico-alpine sulle creste; i versanti meridionali dei canyon ospitano piante
      submediterranee; mentre le torbiere lacustri formano relitti di taiga siberiana. Tra gli endemismi
      spicca Edraianthus tarae sulle pareti della forra. Nei canaloni esposti a nord i nevai resistono per
      tutta l'estate.
    wildlife: >-
      Il Durmitor è tra le riserve ornitologiche primarie del Montenegro: vi sono censite 172 specie di
      uccelli, 112 delle quali nidificanti. Tra le specie che vi nidificano si contano il [falco
      pecchiaiolo](/especie/pernis_apivorus/), l'[aquila reale](/especie/aquila_chrysaetos/), il [falco
      pellegrino](/especie/falco_peregrinus/), il [gheppio](/especie/falco_tinnunculus/) e la coturnice; oltre
      a [gallo cedrone](/especie/tetrao_urogallus/), [gufo reale](/especie/bubo_bubo/), [picchio
      tridattilo](/especie/picoides_tridactylus/) e civetta capogrosso. I pascoli rupestri d'alta quota
      ospitano aquila reale, allodola gola-gialla e gracchio corallino; le pareti rocciose accolgono il
      [picchio muraiolo](/especie/tichodroma_muraria/) e il [grifone](/especie/gyps_fulvus/); i boschi di
      conifere il gallo cedrone e il [picchio nero](/especie/dryocopus_martius/); e le latifoglie montane il
      [picchio dorsobianco](/especie/dendrocopos_leucotos/).


      I mammiferi contano 43 specie registrate: 11 pipistrelli, 11 roditori, 3 artiodattili e 6 carnivori. Per
      proteggere i grandi mammiferi, il Lago Nero e parte del massiccio furono dichiarati area protetta sin
      dal 1907. Sui pascoli alpini vivono [camoscio](/especie/rupicapra_rupicapra/), [orso
      bruno](/especie/ursus_arctos/) e [lupo](/especie/canis_lupus/).


      La Tara ospita otto specie di pesci autoctoni, tra cui il pregiato [salmone del
      Danubio](/especie/hucho_hucho/). I laghi del Durmitor contengono solo specie ittiche alloctone. La
      salamandra alpina è citata dalle prime spedizioni. Gli insetti comprendono 134 specie di farfalle diurne
      assieme a coleotteri protetti quali il [cervo volante](/especie/lucanus_cervus/) e la [rosalia
      alpina](/especie/rosalia_alpina/).
    visit: >-
      Il punto di riferimento è Žabljak, sede dell'ente parco e di un centro visite. La rete conta 25 sentieri
      alpini ed escursionistici ben tracciati. Un grande classico conduce da Žabljak attraverso Lokvice fino
      al Bobotov Kuk; un altro dal Lago Nero via Struga al Mali Međed e Veliki Međed; mentre un percorso di
      più giorni collega Žabljak, il lago Žmijinje, Alisnica, Planinica e Škrka.


      Il sentiero didattico intorno al Lago Nero è il più frequentato, affiancato dagli itinerari tematici
      Staza mlinova e 'Nell'abbraccio del bosco e dei tre laghi'. In inverno una traccia battuta per ciaspole
      collega Savin Kuk al Lago Nero.


      Per affacciarsi sulla gola i belvedere attrezzati sono Ćurevac e Nedajno; Ćurevac offre la vista più
      vertiginosa sul canyon della Tara. L'anello panoramico Durmitorski prsten misura 76 km, oppure 83 km
      includendo Ćurevac, attraversando anche il Parco naturale di Piva. Per gli amanti della mountain bike il
      circuito attorno al massiccio è un itinerario impegnativo.
    history: >-
      Il patrimonio medievale è legato al canyon della Tara. Le necropoli con stećci del XIV e XV secolo sono
      assai diffuse; le più ricche di bassorilievi venatori si trovano a Novakovići, presso il lago Riblje e a
      Bare Žugića. Nella forra sorgono tre monasteri storici: San Giorgio a Dobrilovina, la Dormizione a
      Dovolja e San Michele Arcangelo a Đurđevića Tara. I pastori utilizzavano i katun estivi e i vatan
      invernali.


      Le riserve integrali coprono 3400 ettari, circa l'11% del territorio, tutelando la foresta vergine di
      abete bianco e abete rosso di Mlinski potok e l'antica pineta di pino nero a Crna Poda.
    before: >-
      Nelle riserve integrali è richiesto silenzio assoluto e accompagnamento di guide autorizzate. Il
      campeggio libero è vietato fuori dalle aree autorizzate. Il periodo migliore va da maggio a ottobre.
    around: >-
      A un chilometro dal parco sorgono il [Parco naturale di Piva](/lugar/park-prirode-piva/) e i [Monti
      Volujak](/lugar/planina-volujak/); a due chilometri il [Massiccio di Bioč](/lugar/masiv-bioca/), e a
      quattro l'[Altopiano carsico di Sinjajevina](/lugar/sinjajevina-karst-plateau/). A quattordici
      chilometri si trova il [Parco nazionale Biogradska
      Gora](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), e a venti il [Parco nazionale Sutjeska –
      Massiccio del Maglić](/lugar/nacionalni-park-sutjeska---maglic/). Il massiccio montuoso del parco è
      trattato in [Parco nazionale del Durmitor – Massiccio
      montuoso](/lugar/nacionalni-park-durmitor---masiv/). Più distante, il [Parco nazionale
      Una](/lugar/nacionalni-park-una---gorji-tok/) condivide salmone del Danubio, orso e lupo in una profonda
      forra carsica.
  pt:
    intro: >-
      Entre o leito do desfiladeiro do Tara e o cume do Bobotov Kuk medeia quase dois mil metros de desnível,
      concentrados num único parque. O Durmitor, no norte do Montenegro, combina um planalto a cerca de 1500
      metros, um maciço com mais de 48 picos acima dos 2000 metros e um rio encaixado num dos desfiladeiros
      mais impressionantes da Europa: entre 1000 e, nalguns troços, 1300 metros de profundidade ao longo de
      cerca de 78 quilómetros.


      Gelo, calcário e água moldaram o relevo. O parque nacional, com o canhão do Tara, integra desde 1980 a
      Lista do Património Mundial da UNESCO, e a bacia do Tara está protegida desde 1977 como reserva da
      biosfera.
    landscape: >-
      O relevo consiste num vasto planalto de altitude a cerca de 1500 metros, sulcado por desfiladeiros
      fluviais profundos, com o maciço do Durmitor ao centro. O relevo exibe vales suspensos, dolinas e covas
      cársicas. O ponto culminante é o Bobotov Kuk, com 2523 metros, sendo o pico mais alto do parque.


      A glaciação talhou traços marcantes, evidenciados por numerosos lagos glaciares chamados 'olhos da
      montanha': contam-se dezoito no maciço. O Lago Negro, o mais afamado, atua como divisória de águas: as
      suas águas subterrâneas bifurcam-se entre as bacias do Tara e do Piva ou Komarnica.


      A altitude governa a vegetação. O maciço é um centro de diversificação da flora balcânica, com espécies
      alpinas e árctico-alpinas nos cumes; as encostas viradas a sul albergam flora submediterrânica; enquanto
      as turfeiras lacustres preservam redutos de taiga siberiana. Entre os endemismos salienta-se Edraianthus
      tarae nas escarpas do Tara. Nos circos sombrios, a neve permanece até ao pico do verão.
    wildlife: >-
      O Durmitor é um dos paraísos ornitológicos do Montenegro, registando 172 espécies de aves, 112 das quais
      reprodutoras. Entre os nidificantes figuram o [bútio-vespeiro](/especie/pernis_apivorus/), a
      [águia-real](/especie/aquila_chrysaetos/), o [falcão-peregrino](/especie/falco_peregrinus/), o
      [peneireiro-vulgar](/especie/falco_tinnunculus/) e a perdiz-mourisca; bem como o
      [tetraz-grande](/especie/tetrao_urogallus/), o [bufo-real](/especie/bubo_bubo/), o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/) e o mocho-boreal. Nas pastagens alpinas vivem a
      águia-real, a cotovia-cornuda e o gralha-de-bico-amarelo; nas escarpas habitam o
      [trepadeira-dos-muros](/especie/tichodroma_muraria/) e o [grifo](/especie/gyps_fulvus/); as coníferas
      sustentam o tetraz e o [pica-pau-preto](/especie/dryocopus_martius/); e as matas caducifólias acolhem o
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/).


      Os mamíferos somam 43 espécies registadas: 11 de morcegos, 11 de roedores, 3 de artiodáctilos e 6 de
      carnívoros. Para proteger os grandes herbívoros e predadores, o Lago Negro e setores adjacentes foram
      declarados área protegida logo em 1907. Nas pradarias de altitude pastam
      [camurças](/especie/rupicapra_rupicapra/), [ursos-pardos](/especie/ursus_arctos/) e
      [lobos](/especie/canis_lupus/).


      O rio Tara preserva oito espécies de peixes autóctones, com destaque para o ameaçado
      [salmão-do-danúbio](/especie/hucho_hucho/). Os lagos do Durmitor contêm apenas peixes introduzidos. A
      salamandra-alpina é assinalada desde os primeiros estudos. Os insetos somam 134 espécies de borboletas
      diurnas, acompanhadas por espécies protegidas como a [vaca-loura](/especie/lucanus_cervus/) e a
      [rosália-alpina](/especie/rosalia_alpina/).
    visit: >-
      A porta de entrada é Žabljak, onde funcionam a administração do parque e o centro de interpretação.
      Existem 25 trilhos de montanha sinalizados. Um percurso clássico vai de Žabljak por Lokvice até ao
      Bobotov Kuk; outro do Lago Negro via Struga ao Mali Međed e Veliki Međed; e uma grande travessia liga
      Žabljak, lago Žmijinje, Alisnica, Planinica e Škrka.


      O percurso pedagógico em volta do Lago Negro é o mais percorrido, complementado pelas rotas temáticas
      Staza mlinova e 'No abraço da floresta e dos três lagos'. No inverno há percursos com raquetes de neve
      entre o centro de esqui de Savin Kuk e o Lago Negro.


      Para avistar o canhão, os miradouros principais são Ćurevac e Nedajno; Ćurevac abre panorâmicas abruptas
      para o fundo do Tara. A rota panorâmica rodoviária Durmitorski prsten estende-se por 76 km, ou 83 km
      integrando o desvio a Ćurevac, entrando no Parque Natural de Piva. Para os ciclistas, o anel do Durmitor
      exige excelente condição atlética.
    history: >-
      Os vestígios medievais abundam no vale do Tara. As necrópoles de stećci dos séculos XIV e XV são
      numerosas; as mais ornamentadas com relevos cinegéticos situam-se em Novakovići, junto ao lago Riblje e
      em Bare Žugića. Na garganta erguem-se três mosteiros: São Jorge em Dobrilovina, a Dormição em Dovolja e
      São Miguel Arcanjo em Đurđevića Tara. Os pastores recorriam a katuns no verão e a vatans no inverno.


      As reservas integrais cobrem 3400 hectares, cerca de 11% do parque, abrangendo a floresta virgem de
      abetos de Mlinski potok e o centenário pinhal de pinheiro-negro em Crna Poda.
    before: >-
      Nas áreas de proteção integral o trânsito deve ser silencioso e acompanhado por guias autorizados. É
      proibido acampar fora dos parques designados. O período ideal vai de maio a outubro.
    around: >-
      Junto ao parque, a um quilómetro, situam-se o [Parque Natural de Piva](/lugar/park-prirode-piva/) e os
      [Montes Volujak](/lugar/planina-volujak/); a dois quilómetros o [Maciço de Bioč](/lugar/masiv-bioca/), e
      a quatro o [Planalto cársico de Sinjajevina](/lugar/sinjajevina-karst-plateau/). A catorze quilómetros
      dista o [Parque Nacional Biogradska Gora](/lugar/nacionalni-park-biogradska-gora-masiv-bjelasice/), e a
      vinte o [Parque Nacional Sutjeska – Maciço de Maglić](/lugar/nacionalni-park-sutjeska---maglic/). O
      relevo alpino possui ficha autónoma: [Parque Nacional Durmitor – Maciço
      Montanhoso](/lugar/nacionalni-park-durmitor---masiv/). Mais longe, o [Parque Nacional do
      Una](/lugar/nacionalni-park-una---gorji-tok/) partilha o salmão-do-danúbio, o urso e o lobo num cenário
      de desfiladeiro cársico.
