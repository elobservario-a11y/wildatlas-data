  es: El cañón más profundo de Europa (hasta 1.300 m) y el segundo del mundo tras el Gran Cañón del Colorado.
  en: Europe's deepest canyon (plunging up to 1,300 m) and second in the world after the Grand Canyon.
  fr: >-
    Le plus profond canyon d'Europe (jusqu'à 1 300 m) et le deuxième au monde après le Grand Canyon du
    Colorado.
  de: Europas tiefster Canyon (bis 1.300 m) und zweittiefster der Erde nach dem Grand Canyon in Colorado.
  it: Il canyon più profondo d'Europa (fino a 1.300 m) e il secondo al mondo dopo il Grand Canyon del Colorado.
  pt: O desfiladeiro mais profundo da Europa (até 1.300 m) e o segundo do mundo após o Grand Canyon do Colorado.
unico:
  es: Un macizo de alta montaña y un cañón de más de mil metros que se miran de frente desde un mismo mirador.
  en: >-
    A high-alpine massif and a gorge plunging over a thousand metres facing each other directly from a single
    vantage point.
  fr: >-
    Un massif d'altitude et une gorge de plus de mille mètres qui se toisent en face-à-face depuis un même
    belvédère.
  de: >-
    Ein Hochgebirgsmassiv und ein über tausend Meter tiefer Canyon blicken sich von einem gemeinsamen
    Aussichtspunkt direkt an.
  it: >-
    Un massiccio d'alta montagna e una forra di oltre mille metri che si fronteggiano direttamente da un unico
    punto panoramico.
  pt: >-
    Um maciço de alta montanha e um desfiladeiro de mais de mil metros que se olham frente a frente a partir
    de um mesmo miradouro.
