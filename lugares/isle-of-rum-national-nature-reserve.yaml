resumen:
  es: >-
    La mayor de las islas Small Isles, una reserva insular volcánica donde anida un tercio de la población
    mundial de la pardela pichoneta (*Puffinus puffinus*).
  en: >-
    The largest of the Small Isles, a volcanic island reserve where a third of the world's Manx shearwater
    (*Puffinus puffinus*) population nests.
  fr: >-
    La plus vaste des Small Isles, sanctuaire insulaire volcanique où niche un tiers de la population mondiale
    de puffin des Anglais (*Puffinus puffinus*).
  de: >-
    Die größte der Small Isles, ein vulkanisches Inselreservat, auf dem ein Drittel des weltweiten Bestands
    des Schwarzschnabel-Sturmtauchers brütet.
  it: >-
    La maggiore delle Small Isles, riserva insulare vulcanica in cui nidifica un terzo della popolazione
    mondiale di berta minore atlantica (*Puffinus puffinus*).
  pt: >-
    A maior das Small Isles, reserva insular vulcânica onde nidifica um terço da população reprodutora mundial
    de bobo-pequeno (*Puffinus puffinus*).
unico:
  es: >-
    Una sola colonia de pardelas pichonetas, anidando en lo alto de las montañas de la isla, representa
    aproximadamente el treinta por ciento de la población reproductora mundial.
  en: >-
    A single high-mountain colony of Manx shearwaters on the island accounts for roughly thirty percent of the
    global breeding population.
  fr: >-
    Une unique colonie de puffins des Anglais nichant au sommet des crêtes de l'île rassemble environ trente
    pour cent de la population mondiale.
  de: >-
    Eine einzige Hochgebirgskolonie von Schwarzschnabel-Sturmtauchern auf der Insel umfasst rund dreißig
    Prozent des weltweiten Brutbestands.
  it: >-
    Un'unica colonia d'alta quota di berte minori sull'isola concentra circa il trenta per cento dell'intera
    popolazione riproduttiva mondiale.
  pt: >-
    Uma única colónia de alta montanha de bobos-pequenos na ilha representa cerca de trinta por cento de toda
    a população reprodutora global.
observaciones:
  es: >-
    La isla es remota y llueve mucho, así que el tiempo manda. Planifica el viaje con el ferry y comprueba con
    NatureScot los accesos y las restricciones vigentes, sobre todo en la bahía de Kilmory durante la berrea.
texto:
  es:
    intro: >-
      Rùm es lo que queda de un volcán. Hace unos 60 millones de años, en el Paleógeno, ardía aquí un edificio
      que la erosión ha desmontado hasta dejar su núcleo: una isla de montañas rocosas, la mayor de las Small
      Isles, con unas 10.463 hectáreas. Hoy es reserva natural nacional, y dos nombres la definen: las
      pardelas pichonetas que crían en lo alto de las Cuillin y los ciervos rojos de Kilmory, estudiados desde
      hace años.
    landscape: >-
      Rùm es mayoritariamente de origen ígneo. Las Cuillin de Rùm son picos rocosos de gabro, y la isla es la
      más pequeña de Escocia con una cima por encima de 762 metros. Hallival y Askival se formaron cuando
      cristales de olivino y feldespato se acumularon en el fondo de una cámara magmática; esa cámara acabó
      hundiéndose en una caldera. En Bloodstone Hill, la lava dejó burbujas de gas que se rellenaron después
      de ágata verde con motas rojas.


      Llueve mucho: unos 1.800 mm al año en la costa y unos 3.000 mm en las montañas. En ese clima los
      brezales, los pastizales, los acantilados, las grietas rocosas y las turberas con lagos sostienen una
      gran variedad de vida. En 1960 se creó un vivero en Kinloch para reintroducir veinte especies de árboles
      nativos, como abedul, majuelo, serbal y acebo, y hoy hay más de un millón de árboles y arbustos. Entre
      las plantas raras figuran la arenaria ártica y el carraspique alpino, y se han registrado 590 taxones de
      plantas superiores y helechos.
    wildlife: >-
      En verano, las [pardelas pichonetas](/especie/puffinus_puffinus/) se reúnen frente a la costa y regresan
      al anochecer; durante el día se las ve alimentándose en el mar. Pasan el invierno en el Atlántico sur
      frente a Brasil y vuelven cada verano a criar en madrigueras de lo alto de las Cuillin.


      En primavera, más de noventa especies de aves anidan desde los acantilados hasta las cumbres. El [águila
      marina](/especie/haliaeetus_albicilla/) se extinguió en la isla en 1912; desde 1975 se reintrodujo, con
      82 jóvenes noruegos en diez años, y hoy hay una población reproductora en libertad. Entre las aves de la
      isla figuran también el [águila real](/especie/aquila_chrysaetos/), el esmerejón, el [colimbo
      chico](/especie/gavia_stellata/), el pardillo piquigualdo, la alondra común y el chorlito dorado.


      En otoño llega la berrea. Desde Kilmory o Harris se buscan los [ciervos
      rojos](/especie/cervus_elaphus/), y esa población lleva años estudiada desde la bahía de Kilmory. Un
      estudio de 45 años mostró que el cambio climático ha afectado a su acervo genético: las hembras paren,
      de media, tres días antes por cada década. La bahía de Kilmory se cierra de vez en cuando a los
      visitantes durante la berrea. Un hide para [nutrias](/especie/lutra_lutra/) queda en el bosque al sur
      del muelle principal.
    visit: >-
      El viaje habitual a Rùm es en barco desde Mallaig; el ferry de Caledonian MacBrayne une la isla con
      tierra firme. Los senderos más conocidos son la travesía de las Cuillin, una travesía de montaña
      destacada de Escocia, y el Coire Dubh Trail, un paseo corto para conocer la reserva si dispones de poco
      tiempo.


      Entre los restos humanos hay una huella muy antigua: en Farm Fields, junto a Kinloch, aparecieron
      cáscaras de avellana del Mesolítico, de 7700-7500 a. C., entre las pruebas más antiguas de ocupación
      humana en Escocia. En 1900 los Bullough construyeron el castillo de Kinloch.
    history: >-
      La población indígena, de más de 400 personas a finales del siglo XVIII, fue desalojada entre 1826 y
      1828, y la isla pasó a ser un coto de caza. En 1957 el Nature Conservancy Council compró Rùm con la
      condición de que fuera reserva natural nacional. Es SSSI desde 1987 y tiene diecisiete sitios
      catalogados como monumentos antiguos de importancia nacional. NatureScot gestiona la isla, de la que
      depende por completo su economía.


      Hay también animales domésticos y asilvestrados: pequeñas manadas de ponis, cabras asilvestradas y vacas
      Highland; los ponis tienen una raya oscura en el lomo y rayas de cebra en las patas delanteras. El único
      anfibio es el tritón palmeado y el único reptil nativo, el lagarto vivíparo.
    before: >-
      La isla es remota y llueve mucho, así que el tiempo manda. Planifica el viaje con el ferry y comprueba
      con NatureScot los accesos y las restricciones vigentes, sobre todo en la bahía de Kilmory durante la
      berrea.
    around: >-
      A 6 km queda [Canna](/lugar/canna/), y a unos 28 km, en tierra firme, la [Península de Knoydart - La
      Última Gran Naturaleza Salvaje de Escocia](/lugar/knoydart/).
  en:
    intro: >-
      Rùm is the monumental ruin of an ancient volcano. Some 60 million years ago, in the stormy dawn of the
      Paleogene, a fiery volcanic centre erupted here that subsequent erosion has dismantled down to its
      plutonic roots: an island of jagged peaks, the largest of the Small Isles, extending across 10,463
      hectares. Today it is a National Nature Reserve defined by two iconic ecological hallmarks: the Manx
      shearwaters nesting on high mountain ridges and the red deer of Kilmory, studied by scientists for
      decades.
    landscape: >-
      Rùm is overwhelmingly igneous in origin. The Rum Cuillin are jagged mountains of layered gabbro, making
      Rùm the smallest island in Scotland to possess a mountain peak rising above 762 metres. Hallival and
      Askival were formed when heavy olivine and feldspar crystals settled in the magma chamber beneath an
      active volcano, which subsequently collapsed into a caldera. On Bloodstone Hill, volcanic gas bubbles
      trapped in cooling basalt lavas later crystallised into green plasma agate flecked with red jasper.


      Rainfall is heavy: around 1,800 mm annually on the sheltered eastern coast and 3,000 mm over the montane
      heights. In this wet oceanic climate, heather moors, grasslands, maritime cliffs, and blanket mires with
      lochans nourish diverse ecosystems. In 1960, a native tree nursery was established at Kinloch to
      reintroduce twenty species of indigenous trees—including birch, hazel, rowan, and holly—and today more
      than a million trees thrive on the hillsides. Rare arctic-alpine flora includes arctic sandwort and
      alpine rock-cress, alongside 590 species of vascular plants and ferns.
    wildlife: >-
      In high summer, vast rafts of [Manx shearwaters](/especie/puffinus_puffinus/) gather offshore in the
      evening dusk before returning to their burrows; by day they forage across open pelagic waters. They
      winter off southern Brazil in the South Atlantic, flying thousands of miles each spring to breed in
      high-altitude burrows on the Cuillin peaks.


      In spring, more than ninety species of birds nest across habitats from coastal sea cliffs to rocky
      ridges. The [white-tailed eagle](/especie/haliaeetus_albicilla/) was extirpated from the island in 1912;
      starting in 1975 it was reintroduced through the release of 82 young Norwegian eaglets over ten years,
      establishing a self-sustaining wild population. Resident raptors and moorland birds also include [golden
      eagles](/especie/aquila_chrysaetos/), merlins, [red-throated divers](/especie/gavia_stellata/), twites,
      skylarks, and golden plovers.


      Autumn heralds the red deer rut. Around Kilmory and Harris, researchers observe the [red
      deer](/especie/cervus_elaphus/) herds, subject to long-running field studies in Kilmory Glen. A 45-year
      study showed that climate change has altered their phenology and genetics: hinds give birth, on average,
      three days earlier per decade. Kilmory Glen is periodically closed to walkers during peak rutting
      season. A dedicated hide for observing [Eurasian otters](/especie/lutra_lutra/) stands in woodland south
      of the main pier.
    visit: >-
      Travellers reach Rùm by ferry from Mallaig; the Caledonian MacBrayne passenger vessel links the Small
      Isles with the mainland. The most renowned hiking routes are the Rum Cuillin traverse, one of Scotland's
      classic mountain expeditions, and the gentle Coire Dubh Trail, an accessible circuit to discover reserve
      habitats in limited time.


      Human history stretches into deep antiquity: at Farm Fields near Kinloch, archaeologists unearthed
      charred Mesolithic hazelnut shells dating back to 7700-7500 BC, representing some of the oldest evidence
      of human presence in Scotland. In 1900, the wealthy industrialist Bullough family erected eccentric
      Kinloch Castle.
    history: >-
      The indigenous Gaelic population of over 400 people at the end of the eighteenth century was evicted
      during the Highland Clearances between 1826 and 1828 to transform the island into a private sporting
      estate. In 1957, the Nature Conservancy Council purchased Rùm on the strict condition that it remain a
      National Nature Reserve. Designated an SSSI in 1987, it encompasses seventeen scheduled ancient
      monuments. NatureScot manages the island and anchors its small community economy.


      Hardy domestic and feral animals roam the island: small herds of Rum ponies, feral goats, and Highland
      cattle; the indigenous ponies bear primitive dorsal eel-stripes and zebra barrings on their legs. The
      sole native amphibian is the palmate newt and the only native reptile the viviparous lizard.
    before: >-
      The island is isolated and experiences high rainfall, so oceanic mountain weather rules supreme.
      Coordinate with ferry timetables well in advance and consult NatureScot regarding local access advice,
      especially across Kilmory Glen during the autumn red deer rut.
    around: >-
      Just 6 km away lies [Canna](/lugar/canna/), while roughly 28 km to the east on the Scottish mainland
      lies the [Knoydart Peninsula - Scotland's Last Great Wilderness](/lugar/knoydart/).
  fr:
    intro: >-
      Rùm est le squelette érodé d'un ancien volcan. Il y a environ 60 millions d'années, à l'aube du
      Paléogène, grondait ici un édifice magmatique que l'érosion a patiemment démantelé jusqu'à son cœur
      plutonique : une île de crêtes acérées, la plus vaste des Small Isles, couvrant 10 463 hectares.
      Aujourd'hui réserve naturelle nationale, deux emblèmes la distinguent : les puffins des Anglais qui
      nichent sur les hauteurs des Cuillin et les cerfs élaphes de Kilmory, scrutés depuis des décennies par
      les biologistes.
    landscape: >-
      Rùm est presque entièrement d'origine ignée. Les Cuillin de Rùm forment des arêtes de gabbro étagé,
      faisant de l'île la plus petite d'Écosse à posséder un sommet dépassant 762 mètres. Hallival et Askival
      sont nés de la sédimentation de cristaux d'olivine et de feldspath au fond d'une chambre magmatique qui
      finit par s'effondrer en caldeira. À Bloodstone Hill, la lave a piégé des bulles de gaz comblées
      ultérieurement par de l'héliotrope verte mouchetée de rouge.


      Le climat est très pluvieux : environ 1 800 mm d'eau par an sur le littoral et 3 000 mm sur les massifs.
      Sous cette humidité océanique, landes, pelouses maritimes, falaises et tourbières à lochans nourrissent
      une riche biodiversité. En 1960, une pépinière fut implantée à Kinloch pour réintroduire vingt essences
      d'arbres indigènes — bouleaux, noisetiers, sorbiers et houx —, comptant aujourd'hui plus d'un million
      d'arbres. Parmi les raretés botaniques figurent la sabline arctique et l'arabette des Alpes, aux côtés
      de 590 taxons de plantes vasculaires et fougères.
    wildlife: >-
      En été, d'immenses radeaux de [puffins des Anglais](/especie/puffinus_puffinus/) se rassemblent en mer
      au crépuscule avant de regagner leurs terriers ; le jour, ils pêchent en haute mer. Ils hivernent dans
      l'Atlantique Sud au large du Brésil et parcourent des milliers de kilomètres chaque printemps pour
      élever leur unique poussin dans les terriers sommitaux des Cuillin.


      Au printemps, plus de quatre-vingt-dix espèces d'oiseaux nichent du littoral aux crêtes rocheuses. Le
      [pygargue à queue blanche](/especie/haliaeetus_albicilla/) s'était éteint sur l'île en 1912 ; à partir
      de 1975, il y fut réintroduit grâce à 82 aiglons norvégiens relâchés sur dix ans, formant aujourd'hui
      une population sauvage prospère. On compte aussi l'[aigle royal](/especie/aquila_chrysaetos/), le faucon
      émerillon, le [plongeon catmarin](/especie/gavia_stellata/), la linotte à bec jaune et le pluvier doré.


      L'automne marque le brame du cerf. Vers Kilmory ou Harris, on observe les grands [cerfs
      élaphes](/especie/cervus_elaphus/), étudiés minutieusement dans la baie de Kilmory. Un suivi mené sur 45
      ans a démontré l'impact du réchauffement climatique sur leur génétique : les biches mettent bas en
      moyenne trois jours plus tôt par décennie. La baie de Kilmory est ponctuellement fermée au public
      pendant le brame. Un affût pour observer les [loutres d'Europe](/especie/lutra_lutra/) est aménagé au
      sud du débarcadère.
    visit: >-
      La traversée classique vers Rùm s'effectue en bateau depuis Mallaig ; le ferry de la Caledonian
      MacBrayne relie les Small Isles au continent. Les randonnées vedettes comprennent la traversée des
      Cuillin, l'une des grandes courses d'arête d'Écosse, et le Coire Dubh Trail, une boucle courte pour
      découvrir la réserve en peu de temps.


      L'occupation humaine est plurimillénaire : à Farm Fields, près de Kinloch, des fouilles ont exhumé des
      noisettes carbonisées mésolithiques datées de 7700-7500 av. J.-C., parmi les plus anciens vestiges
      humains d'Écosse. En 1900, la famille d'industriels Bullough y édifia l'extravagant château de Kinloch.
    history: >-
      La population insulaire gaélique, comptant plus de 400 personnes à la fin du XVIIIe siècle, fut
      brutalement expulsée lors des Clearances entre 1826 et 1828 pour convertir l'île en domaine de chasse.
      En 1957, le Nature Conservancy Council fit l'acquisition de Rùm à la condition expresse de la préserver
      en réserve naturelle nationale. Classée SSSI en 1987, elle abrite dix-sept monuments antiques
      répertoriés. NatureScot gère l'île et en anime la petite communauté locale.


      Des animaux domestiques et féraux arpentent le paysage : des hardes de poneys de Rum, des chèvres
      sauvages et des vaches Highland ; les poneys portent une raie de mulet dorsale et des zébrures sur les
      pattes. Le triton palmé est le seul amphibien présent, et le lézard vivipare l'unique reptile indigène.
    before: >-
      L'île est sauvage et battue par les grains océaniques. Planifiez soigneusement vos traversées en ferry
      et renseignez-vous auprès de NatureScot sur les consignes d'accès, particulièrement dans la baie de
      Kilmory lors du brame automnal.
    around: >-
      À 6 km s'étend l'île de [Canna](/lugar/canna/), et à environ 28 km sur la terre ferme se déploie la
      [Péninsule de Knoydart - La dernière grande nature sauvage d'Écosse](/lugar/knoydart/).
  de:
    intro: >-
      Rùm ist das zerklüftete Überbleibsel eines uralten Vulkans. Vor rund 60 Millionen Jahren, im Paläogen,
      wütete hier ein gigantischer Vulkankomplex, den die Verwitterung bis auf seinen Tiefengesteinskern
      abgetragen hat: Eine gebirgige Felseninsel, die größte der Small Isles, mit 10.463 Hektar Fläche. Heute
      ist sie ein Nationales Naturschutzgebiet von Weltrang, berühmt für zwei Naturphänomene: die in den
      Cuillin-Bergen brütenden Sturmtaucher und die seit Jahrzehnten erforschten Rothirsche von Kilmory.
    landscape: >-
      Rùm ist fast rein magmatischen Ursprungs. Die Rum Cuillin sind schroffe Zackenberge aus Gabbrogestein,
      und Rùm ist die kleinste schottische Insel mit einem Berggipfel über 762 Metern. Hallival und Askival
      bildeten sich, als schwere Olivin- und Feldspatkristalle auf den Grund einer Magmakammer sanken, die
      später zur Caldera einbrach. Am Bloodstone Hill hinterließ die Lava Gasblasen, die sich später mit rotem
      Jaspis und grünem Blutstein füllten.


      Es regnet ausgiebig: rund 1.800 mm jährlich an der Ostküste und 3.000 mm in den Hochlagen. In diesem
      ozeanischen Klima nähren Heideflächen, Klippen, Berggrate und Moorlandschaften mit kleinen Seen eine
      reiche Artenvielfalt. Im Jahr 1960 legte man in Kinloch eine Baumschule an, um zwanzig heimische
      Gehölzarten wie Birke, Hasel, Eberesche und Stechpalme wieder anzupflanzen; heute gedeihen über eine
      Million Bäume an den Hängen. Zu den alpinen Pflanzen zählen Arktisches Sandkraut und Alpen-Gänsekresse
      neben 590 Farn- und Blütenpflanzenarten.
    wildlife: >-
      Im Hochsommer sammeln sich riesige Schwärme von
      [Schwarzschnabel-Sturmtauchern](/especie/puffinus_puffinus/) in der Abenddämmerung auf dem Meer, bevor
      sie zu ihren Bruthöhlen zurückkehren; tagsüber fischen sie auf hoher See. Sie überwintern vor der Küste
      Brasiliens und kehren jeden Frühling zurück, um hoch oben in den Cuillin-Gipfeln zu brüten.


      Im Frühjahr nisten über neunzig Vogelarten von den Meeresklippen bis zu den Graten. Der
      [Seeadler](/especie/haliaeetus_albicilla/) war 1912 auf der Insel ausgestorben; ab 1975 wurde er durch
      die Freilassung von 82 jungen norwegischen Adlern über zehn Jahre hinweg erfolgreich wiederangesiedelt.
      Auch [Steinadler](/especie/aquila_chrysaetos/), Merlin, [Sterntaucher](/especie/gavia_stellata/),
      Berghänfling und Goldregenpfeifer bereichern die Vogelwelt.


      Im Herbst beginnt die Brunft. Bei Kilmory und Harris beobachten Forscher die
      [Rothirsche](/especie/cervus_elaphus/), deren Kilmory-Herde seit Generationen studiert wird. Eine 45
      Jahre währende Langzeitstudie bewies den Einfluss der Klimaerwärmung: Hirschkühe kalben im Schnitt drei
      Tage früher pro Jahrzehnt. Die Kilmory Bay wird zur Brunftzeit zeitweise gesperrt. Eine
      Beobachtungshütte für [Fischotter](/especie/lutra_lutra/) liegt südlich des Fähranlegers im Wald.
    visit: >-
      Die Reise nach Rùm führt per Schiff ab Mallaig; die Fähre der Reederei Caledonian MacBrayne verbindet
      die Small Isles mit dem Festland. Zu den beliebtesten Wegen zählen die Cuillin-Überschreitung, eine
      legendäre alpine Bergtour Schottlands, und der Coire Dubh Trail, ein kurzer Rundweg zur Erkundung der
      Lebensräume bei wenig Zeit.


      Die menschliche Besiedlung reicht bis in die Steinzeit zurück: Bei Farm Fields nahe Kinloch entdeckte
      man verkohlte Haselnussschalen aus dem Mesolithikum aus den Jahren 7700-7500 v. Chr. – einer der
      ältesten Nachweise menschlicher Präsenz in Schottland. Im Jahr 1900 errichtete die Industriellenfamilie
      Bullough das schlossartige Kinloch Castle.
    history: >-
      Die gälische Inselbevölkerung von über 400 Menschen im späten achtzehnten Jahrhundert wurde während der
      Highland Clearances zwischen 1826 und 1828 gewaltsam vertrieben, um die Insel in eine private Jagddomäne
      umzuwandeln. Im Jahr 1957 erwarb der Nature Conservancy Council Rùm mit der Auflage, es als Nationales
      Naturschutzgebiet zu erhalten. Seit 1987 als SSSI geschützt, birgt die Insel siebzehn denkmalgeschützte
      Altertümer. NatureScot verwaltet die Insel und stützt die lokale Gemeinschaft.


      Auf der Insel weiden auch halbwilde Tiere: kleine Herden von Rum-Ponys, Wildziegen und Hochlandrinder;
      die Ponys tragen einen Aalstrich und Zebrastreifen an den Fesseln. Einzige Amphibie ist der Fadenmolch,
      einziges Reptil die Waldeidechse.
    before: >-
      Die Insel ist abgelegen und extrem niederschlagsreich; das raue Atlantikwetter bestimmt den Takt. Stimme
      die Reise sorgfältig mit dem Fährfahrplan ab und erkundige dich bei NatureScot nach
      Zugangsbeschränkungen in der Kilmory Bay während der Hirschbrunft.
    around: >-
      Nur 6 km entfernt liegt die Insel [Canna](/lugar/canna/), und rund 28 km östlich auf dem Festland
      erstreckt sich die [Halbinsel Knoydart – Schottlands letzte große Wildnis](/lugar/knoydart/).
  it:
    intro: >-
      Rùm è lo scheletro scolpito di un colossale vulcano spento. Circa 60 milioni di anni fa, agli albori del
      Paleogene, ardeva qui un imponente apparato magmatico che l'erosione millenaria ha smantellato fino alle
      sue radici plutoniche: un'isola di vette aguzze, la maggiore delle Small Isles, che abbraccia 10.463
      ettari. Oggi è una riserva naturale nazionale celebre per due presenze d'eccezione: le berte minori
      atlantiche che nidificano sulle alture delle Cuillin e i cervi nobili di Kilmory, seguiti da decenni
      dagli etologi.
    landscape: >-
      Rùm è quasi interamente di natura magmatica. Le Cuillin di Rùm formano creste dentellate di gabbro
      stratificato, e Rùm è la più piccola isola della Scozia a possedere una vetta oltre i 762 metri.
      Hallival e Askival si originarono dal deposito gravitativo di cristalli di olivina e feldspato sul fondo
      di una camera magmatica poi collassata in caldera. Sulla Bloodstone Hill, il basalto intrappolò bolle di
      gas riempite nel tempo da diaspro rosso e agata eliotropica.


      Le precipitazioni sono imponenti: circa 1.800 mm all'anno sulla costa riparata e 3.000 mm sui massicci
      montuosi. In questo clima atlantico, le brughiere a brugo, i pascoli rupestri e le torbiere con laghetti
      nutrono una ricca biodiversità. Nel 1960 nacque a Kinloch un vivaio per reintrodurre venti specie
      arboree autoctone tra cui betulle, noccioli, sorbi e agrifogli; oggi prosperano oltre un milione di
      alberi sui pendii. Tra le rarità botaniche figurano l'arenaria artica e l'arabetta alpina, accanto a 590
      specie di felci e piante vascolari.
    wildlife: >-
      In piena estate immense zattere di [berte minori atlantiche](/especie/puffinus_puffinus/) si radunano al
      largo al calar della sera per poi fare rientro ai nidi sotterranei; durante il giorno pescano in mare
      aperto. Svernano nell'Atlantico meridionale al largo del Brasile e tornano ogni primavera per nidificare
      nelle tane scavate sulle creste delle Cuillin.


      In primavera nidificano oltre novanta specie ornitiche dalle scogliere costiere alle pietraie sommitali.
      L'[aquila di mare](/especie/haliaeetus_albicilla/) si estinse sull'isola nel 1912; a partire dal 1975 fu
      reintrodotta liberando 82 giovani aquile norvegesi nell'arco di dieci anni, dando vita a una popolazione
      selvatica prolifica. Nidificano inoltre l'[aquila reale](/especie/aquila_chrysaetos/), lo smeriglio, la
      [strolaga minore](/especie/gavia_stellata/), il fanello e il piviere dorato.


      In autunno va in scena il bramito. Tra Kilmory e Harris si possono osservare i branchi di [cervi
      nobili](/especie/cervus_elaphus/), oggetto di ricerche continuative nella baia di Kilmory. Uno studio
      condotto su 45 anni ha documentato l'adattamento al riscaldamento globale: le cerve partoriscono in
      media tre giorni prima a ogni decennio. La baia di Kilmory viene temporaneamente interdetta al pubblico
      durante il culmine del bramito. Un capanno per avvistare le [lontre europee](/especie/lutra_lutra/)
      sorge nei boschi a sud del molo.
    visit: >-
      Il viaggio verso Rùm avviene in battello da Mallaig; il traghetto della Caledonian MacBrayne collega le
      Small Isles alla terraferma scozzese. I percorsi più noti sono la traversata delle Cuillin, tra le più
      rinomate creste alpine della Scozia, e il Coire Dubh Trail, un anello breve per apprezzare gli habitat
      montani della riserva.


      I reperti umani rivelano un passato antichissimo: a Farm Fields, vicino a Kinloch, sono stati rinvenuti
      gusci di nocciola carbonizzati del Mesolitico risalenti al 7700-7500 a.C., tra le più antiche
      testimonianze umane in terra scozzese. Nel 1900 la ricca famiglia Bullough vi fece erigere il singolare
      Kinloch Castle.
    history: >-
      La popolazione gaelica originaria, formata da oltre 400 persone a fine Settecento, fu scacciata con le
      Highland Clearances tra il 1826 e il 1828 per fare spazio a una tenuta di caccia aristocratica. Nel 1957
      il Nature Conservancy Council acquistò Rùm imponendo il vincolo di riserva naturale nazionale.
      Classificata come SSSI nel 1987, custodisce diciassette monumenti archeologici censiti. L'ente
      NatureScot gestisce l'isola sostenendone la comunità residente.


      Sull'isola vivono anche animali semiselvatici: pony di Rum, capre rinselvatichite e vacche Highland; i
      pony autoctoni presentano la riga mulina sul dorso e striature zebrate sulle zampe. L'unico anfibio è il
      tritone palmato e il solo rettile la lucertola vivipara.
    before: >-
      L'isola è aspra, remota e battuta da violente piogge atlantiche. Pianifica accuratamente le corse dei
      traghetti e informati con NatureScot sulle limitazioni d'accesso nella baia di Kilmory durante il
      periodo del bramito autunnale.
    around: >-
      A soli 6 km sorge l'isola di [Canna](/lugar/canna/), mentre a circa 28 km sulla terraferma si estende la
      [Penisola di Knoydart - L'ultima grande wilderness di Scozia](/lugar/knoydart/).
  pt:
    intro: >-
      Rùm é a ossatura fóssil de um antigo vulcão. Há cerca de 60 milhões de anos, na transição para o
      Paleogénico, operava aqui um formidável aparelho magmático que a erosão desmontou até revelar as suas
      entranhas rochosas: uma ilha de picos agrestes, a maior das Small Isles, com 10.463 hectares. Hoje
      constitui uma reserva natural nacional afamada por dois fenómenos ecológicos de topo: os bobos-pequenos
      que nidificam no cimo das Cuillin e os veados-vermelhos de Kilmory, investigados há décadas por
      cientistas.
    landscape: >-
      Rùm é quase integralmente de génese ígnea. As Cuillin de Rùm são cristas escarpadas de gabro acamado,
      sendo Rùm a mais pequena ilha da Escócia a possuir uma montanha que ultrapassa 762 metros de altitude.
      Hallival e Askival formaram-se pela acumulação de cristais de olivina e feldspato no fundo de uma câmara
      magmática que ruiu numa caldeira. Em Bloodstone Hill, a lava basáltica encerrou bolhas de gás
      preenchidas mais tarde por jaspe vermelho e heliotrópio verde.


      Chove com abundância: cerca de 1.800 mm anuais no litoral oriental e 3.000 mm nas zonas montanhosas. Sob
      este clima húmido, charnecas, prados marítimos, penhascos e turfeiras com lagoas alimentam uma vida
      diversa. Em 1960 instalou-se em Kinloch um viveiro para reintroduzir vinte espécies de árvores
      autóctones — bétulas, aveleiras, tramazeiras e azevinhos —, contando hoje mais de um milhão de árvores
      nas encostas. Entre as raridades botânicas contam-se a arenária-ártica e a arabeta-alpina, ao lado de
      590 taxa de plantas vasculares e fetos.
    wildlife: >-
      No pino do verão, enormes bandos de [bobos-pequenos](/especie/puffinus_puffinus/) congregam-se no mar ao
      cair da noite antes de regressarem aos ninhos; de dia pescam em alto-mar. Passam o inverno no Atlântico
      Sul junto à costa brasileira e voam milhares de quilómetros para criar o seu único pinto nas tocas
      cimeiras das montanhas Cuillin.


      Na primavera nidificam mais de noventa espécies de aves desde os cabos marítimos aos cumes rochosos. A
      [águia-rabalva](/especie/haliaeetus_albicilla/) extinguiu-se na ilha em 1912; a partir de 1975 foi
      reintroduzida mediante a libertação de 82 jovens águias norueguesas ao longo de dez anos, gerando uma
      colónia próspera. Registam-se também a [águia-real](/especie/aquila_chrysaetos/), o esmerilhão, a
      [mobelha-pequena](/especie/gavia_stellata/), o pintarroxo-de-bico-amarelo e a tarambola-dourada.


      O outono traz a brama. Entre Kilmory e Harris procuram-se as manadas de
      [veados-vermelhos](/especie/cervus_elaphus/), objeto de estudo pioneiro na baía de Kilmory. Uma
      investigação de 45 anos comprovou que as alterações climáticas aceleraram a gestação: as fêmeas dão à
      luz em média três dias mais cedo a cada década. A baía de Kilmory fecha temporariamente aos visitantes
      no auge da brama. Um abrigo para observar [lontras-europeias](/especie/lutra_lutra/) situa-se a sul do
      cais de Kinloch.
    visit: >-
      A viagem até Rùm realiza-se habitualmente por barco a partir de Mallaig; a travessia da Caledonian
      MacBrayne liga as Small Isles ao continente. As rotas pedestres mais célebres abrangem a travessia das
      Cuillin, uma das maiores caminhadas alpinas da Escócia, e o Coire Dubh Trail, um percurso curto e
      acessível para quem dispõe de pouco tempo.


      A ocupação humana mergulha em tempos pré-históricos: em Farm Fields, junto a Kinloch, escavações
      revelaram cascas de avelã queimadas do Mesolítico datadas de 7700-7500 a.C., entre os vestígios humanos
      mais recuados da Escócia. Em 1900 a família industrial Bullough mandou construir o palácio de Kinloch
      Castle.
    history: >-
      A comunidade gaélica local, com mais de 400 habitantes nos finais do século XVIII, foi brutalmente
      expulsa durante as Highland Clearances entre 1826 e 1828 para transformar a ilha num couto privado de
      caça. Em 1957 o Nature Conservancy Council comprou Rùm sob a condição expressa de constituir reserva
      natural nacional. Declarada SSSI em 1987, alberga dezassete monumentos antigos classificados. A
      NatureScot administra a ilha e apoia a comunidade permanente.


      Há também rebanhos semisselvagens: póneis de Rum, cabras bravias e gado bovino Highland; os póneis
      conservam uma risca dorsal de mula e zebrados nas patas. O único anfíbio é o tritão-palmado e o único
      réptil autóctone a lagartixa-vivípara.
    before: >-
      A ilha é isolada e as chuvas são constantes, dominando o tempo oceânico bravio. Planeia as ligações
      marítimas com antecedência e consulta a NatureScot para confirmar as restrições vigentes na baía de
      Kilmory na época da brama.
    around: >-
      A 6 km situa-se a ilha de [Canna](/lugar/canna/), e a cerca de 28 km, em terra firme, ergue-se a
      [Península de Knoydart - A Última Grande Wilderness da Escócia](/lugar/knoydart/).
