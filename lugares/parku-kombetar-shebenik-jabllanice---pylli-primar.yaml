texto:
  es:
    intro: >-
      El 21 de abril de 2011, un equipo de investigación consiguió la primera foto de un lince balcánico vivo
      dentro de este parque. Desde entonces el lince es su animal más emblemático, y sigue en peligro crítico.
      El parque cubre unas 34.507,9 hectáreas del este de Albania, pegadas a la frontera con Macedonia del
      Norte, y guarda dentro los hayedos mejor conservados con carácter de bosque primario: los de Rrajcë,
      declarados Patrimonio Mundial en 2017.
    landscape: >-
      El nombre une dos macizos, Shebenik y Jabllanica, y el relieve baja de más de 2.200 m a 300 m. Las
      montañas nacieron en la orogenia varisca y son sobre todo de rocas ultramáficas y metamórficas. Después
      llegaron los glaciares de la última glaciación y las moldearon: dejaron valles en U, circos y lagos. Hoy
      hay 14 lagos glaciares, y el más alto está entre los 1.500 y los 1.900 m. Por el parque corren los ríos
      Qarrishte y Bushtrice, de 22 km cada uno, y la lluvia media anual va de 1.300 a 1.800 mm según la zona.


      El bosque es lo que manda. Haya, abeto, pino y roble cubren el parque, y en las laderas norte aparecen
      el sauce purpúreo, el arce noruego, el abedul y el abeto blanco. Entre los pinos hay pino bosnio y pino
      macedonio, aunque el haya es siempre más abundante. En las laderas empinadas de Rrajcë el haya crece
      junto al abeto y al pino balcánico, y algunos restos de robledal termófilo muestran la influencia
      mediterránea. El sotobosque lo forman arbustos como el fresno de flor, el avellano y el enebro de
      Oxycedro.
    wildlife: >-
      El parque tiene unas 30 especies de mamíferos y el [lince](/especie/lynx_lynx/) balcánico, en peligro
      crítico, es el más emblemático. Zorro y [lobo](/especie/canis_lupus/) se ven con frecuencia; el [oso
      pardo](/especie/ursus_arctos/), con menos. En Rrajcë viven además el gato montés, la
      [nutria](/especie/lutra_lutra/) y el rebeco. También hay 18 especies de murciélagos, entre ellas tres de
      herradura.


      Las aves marcan otro registro: se han contado más de 88 especies. Entre ellas, el [águila
      real](/especie/aquila_chrysaetos/), el [urogallo](/especie/tetrao_urogallus/) y el grévol; el halcón
      peregrino cría en acantilados y roquedos. Con los anfibios y reptiles (10 especies de los primeros y 15
      de los segundos) aparecen la culebra lisa, la culebra de agua y la [tortuga
      mediterránea](/especie/testudo_hermanni/).
    visit: >-
      El parque es de los que se recorren a pie. Hay paseos y senderos de montaña, y se puede subir a explorar
      los lagos glaciares. Si quieres un mapa o un folleto de los senderos señalizados, hay que pasar antes
      por la Dirección de Bosques de Librazhd. El turismo está todavía en sus primeras fases: los visitantes
      son pocos y se organizan por su cuenta. De mayo a octubre es la temporada recomendada.


      Entre los lugares que merecen el desvío, el pueblo de Llange, con casas de piedra de tres plantas; la
      iglesia de Koshorisht, construida en una cueva; y los lagos kársticos de Shebenik. En los pueblos
      grandes se celebran fiestas tradicionales, con trajes, cantos y danzas propios de cada lugar.
    history: >-
      Los bosques de Rrajcë se incluyeron en 2017 en el Patrimonio Mundial de los hayedos antiguos y primarios
      de los Cárpatos y otras regiones de Europa, y el sitio ocupa unas 2.129,45 hectáreas del parque. El
      parque se amplió en enero de 2022 hasta las 34.507,9 hectáreas actuales y lo gestiona una dirección con
      sede en Librazhd y Prrenjas.


      Las amenazas son concretas: tala ilegal y falta de un plan de gestión sostenible. La fauna ha sufrido
      daños importantes, y especies como el lince, el gato montés, la nutria o la trucha de montaña están casi
      extinguidas en la zona. Se trabaja en desarrollar un turismo sostenible que ayude a conservar el
      ecosistema.
    before: >-
      Los visitantes son pocos y van por su cuenta, así que consigue antes el mapa o el folleto de los
      senderos en la Dirección de Bosques de Librazhd. El hayedo primario del valle de Bustrica es remoto y de
      difícil acceso.
    around: >-
      A unos diecinueve kilómetros queda el [Parque Nacional de Galičica](/lugar/nacionalen-park-galicica/) y
      a unos veinte el [Parque Nacional de Mavrovo](/lugar/nacionalen-park-mavrovo/), ambos en Macedonia del
      Norte, al otro lado de la frontera.
  en:
    intro: >-
      On 21 April 2011, a research team obtained the first photograph of a living Balkan lynx inside this
      park. Since then, the lynx has been its most iconic animal, though it remains critically endangered. The
      park covers some 34,507.9 hectares of eastern Albania, directly bordering North Macedonia, and protects
      within its borders the best-preserved ancient beech stands with primeval forest character: those of
      Rrajcë, inscribed as a UNESCO World Heritage Site in 2017.
    landscape: >-
      The name unites two massifs, Shebenik and Jabllanica, with elevations plunging from more than 2,200 m
      down to 300 m. The mountains originated during the Variscan orogeny and consist largely of ultramafic
      and metamorphic rocks. Subsequent glaciers during the last ice age carved U-shaped valleys, cirques, and
      tarns. Today there are 14 glacial lakes, the highest lying between 1,500 and 1,900 m. The Qarrishte and
      Bushtrice rivers, each 22 km long, rush through the park, and average annual rainfall ranges from 1,300
      to 1,800 mm depending on exposure.


      Forest dominates the landscape. Beech, fir, pine, and oak carpet the park, while northern slopes shelter
      purple willow, Norway maple, birch, and silver fir. Pines include Bosnian pine and Macedonian pine,
      though beech is consistently the most plentiful. On the steep slopes of Rrajcë, beech mingles with fir
      and Balkan pine, alongside thermophilous oak relicts reflecting Mediterranean influences. The
      understorey consists of shrubs such as flowering ash, hazel, and prickly juniper.
    wildlife: >-
      The park harbours about 30 mammal species, with the critically endangered Balkan [Eurasian
      lynx](/especie/lynx_lynx/) as its flagship resident. Red fox and [grey wolf](/especie/canis_lupus/) are
      observed frequently; the [brown bear](/especie/ursus_arctos/) less often. In Rrajcë you also find
      wildcats, the [Eurasian otter](/especie/lutra_lutra/), and chamois. There are also 18 bat species,
      including three horseshoe bat species.


      Birds add another dimension: more than 88 species have been recorded. Among them are the [golden
      eagle](/especie/aquila_chrysaetos/), [western capercaillie](/especie/tetrao_urogallus/), and hazel
      grouse; peregrine falcons breed on crags and cliffs. Amphibians and reptiles (10 species of the former
      and 15 of the latter) include smooth snakes, grass snakes, and [Hermann's
      tortoise](/especie/testudo_hermanni/).
    visit: >-
      This is a park designed to be explored on foot. There are mountain hikes and trails leading up to the
      glacial lakes. If you want a map or brochure of marked trails, you should stop beforehand at the
      Librazhd Forestry Directorate. Tourism is still in its earliest stages: visitors are few and must be
      self-sufficient. May to October is the recommended visiting window.


      Highlights worth a detour include the village of Llange with its three-storey stone houses; the church
      of Koshorisht, built inside a cave; and the karst lakes of Shebenik. Larger villages celebrate
      traditional festivals featuring local dress, songs, and dances.
    history: >-
      The forests of Rrajcë were inscribed in 2017 into the UNESCO World Heritage Site Ancient and Primeval
      Beech Forests of the Carpathians and Other Regions of Europe, with the protected site occupying some
      2,129.45 hectares of the park. In January 2022 the national park was expanded to its present 34,507.9
      hectares, managed by an administration based in Librazhd and Prrenjas.


      Conservation challenges are real: illegal logging and the need for a comprehensive sustainable
      management plan. Fauna has suffered historical losses, with species like the lynx, wildcat, otter, and
      mountain trout drastically reduced. Work continues to develop sustainable ecotourism to safeguard the
      ecosystem.
    before: >-
      Visitors are few and must travel independently, so pick up a trail map or guide at the Librazhd Forestry
      Directorate beforehand. The primeval beech forest of the Bustrica Valley is exceptionally remote and
      difficult to access.
    around: >-
      About nineteen kilometres away lies [Parque Nacional de Galičica](/lugar/nacionalen-park-galicica/) and
      about twenty kilometres away is [Parque Nacional de Mavrovo](/lugar/nacionalen-park-mavrovo/), both in
      North Macedonia, just across the border.
  fr:
    intro: >-
      Le 21 avril 2011, une équipe de chercheurs a obtenu la première photographie d'un lynx des Balkans
      vivant au cœur de ce parc. Depuis lors, le lynx en est l'animal le plus emblématique, bien qu'il demeure
      en danger critique. Le parc couvre environ 34 507,9 hectares dans l'est de l'Albanie, au contact direct
      de la frontière nord-macédonienne, et abrite les hêtraies les mieux conservées à caractère de forêt
      primaire : celles de Rrajcë, inscrites au patrimoine mondial en 2017.
    landscape: >-
      Le toponyme associe deux massifs, Shebenik et Jabllanica, où le relief s'abaisse de plus de 2 200 m à
      300 m. Ces montagnes, issues de l'orogenèse hercynienne, sont surtout composées de roches ultramafiques
      et métamorphiques. Les glaciers quaternaires les ont ensuite burinées, sculptant des vallées en U, des
      cirques et des cuvettes lacustres. On dénombre aujourd'hui 14 lacs glaciaires, le plus élevé se situant
      entre 1 500 et 1 900 m. Le parc est drainé par les rivières Qarrishte et Bushtrice, longues de 22 km
      chacune, avec une pluviométrie annuelle moyenne oscillant entre 1 300 et 1 800 mm.


      La forêt règne sans partage. Hêtre, sapin, pin et chêne tapissent le relief, tandis que les versants
      nord accueillent saule pourpre, érable plane, bouleau et sapin blanc. Parmi les résineux figurent le pin
      de Bosnie et le pin de Macédoine, le hêtre demeurant toujours prépondérant. Sur les pentes escarpées de
      Rrajcë, le hêtre côtoie sapins et pins des Balkans, quelques îlots de chênes thermophiles trahissant
      l'influence méditerranéenne. Le sous-bois rassemble frêne à fleurs, noisetier et genévrier cade.
    wildlife: >-
      Le parc rassemble environ 30 espèces de mammifères et le [lynx boréal](/especie/lynx_lynx/) des Balkans,
      en danger critique, en est la figure de proue. Renard et [loup](/especie/canis_lupus/) sont observés
      régulièrement ; l'[ours brun](/especie/ursus_arctos/) plus discrètement. À Rrajcë vivent également chat
      sauvage, [loutre d'Europe](/especie/lutra_lutra/) et chamois. On compte en outre 18 espèces de
      chauves-souris, dont trois rhinolophes.


      L'avifaune offre un autre inventaire remarquable avec plus de 88 espèces recensées. Parmi elles figurent
      l'[aigle royal](/especie/aquila_chrysaetos/), le [grand tétras](/especie/tetrao_urogallus/) et la
      gélinotte des bois ; le faucon pèlerin niche sur les parois rocheuses. Les amphibiens et reptiles (10
      espèces pour les premiers, 15 pour les seconds) comptent coronelle lisse, couleuvre à collier et [tortue
      d'Hermann](/especie/testudo_hermanni/).
    visit: >-
      Ce parc se découvre essentiellement à pied. Il offre des sentiers de montagne permettant d'explorer les
      lacs d'altitude. Si vous souhaitez une carte ou un dépliant des itinéraires balisés, passez au préalable
      par la direction des forêts de Librazhd. Le tourisme est encore balbutiant : les visiteurs sont rares et
      circulent en autonomie. La saison recommandée va de mai à octobre.


      Parmi les étapes incontournables figurent le village de Llange aux maisons de pierre à trois niveaux,
      l'église troglodytique de Koshorisht bâtie dans une grotte et les lacs karstiques de Shebenik. Les
      bourgs célèbrent des fêtes traditionnelles parées de costumes, chants et danses folkloriques.
    history: >-
      Les forêts de Rrajcë ont été inscrites en 2017 au patrimoine mondial des forêts primaires et anciennes
      de hêtres des Carpates et d'autres régions d'Europe, le site protégé occupant environ 2 129,45 hectares
      du parc. Le parc s'est agrandi en janvier 2022 pour atteindre 34 507,9 hectares et dépend d'une
      administration sise à Librazhd et Prrenjas.


      Les défis restent notables : exploitation illégale du bois et impératif d'une gestion durable. La faune
      a subi d'importantes dégradations, plusieurs espèces comme le lynx, la loutre ou la truite de montagne
      ayant fortement régressé. Des projets d'écotourisme se développent pour préserver l'équilibre naturel.
    before: >-
      Les visiteurs sont peu nombreux et doivent être autonomes ; procurez-vous au préalable la carte des
      sentiers auprès de la direction forestière de Librazhd. La hêtraie primaire de la vallée de Bustrica est
      isolée et d'accès très difficile.
    around: >-
      À environ dix-neuf kilomètres s'étend le [Parque Nacional de Galičica](/lugar/nacionalen-park-galicica/)
      et à environ vingt le [Parque Nacional de Mavrovo](/lugar/nacionalen-park-mavrovo/), tous deux en
      Macédoine du Nord, juste de l'autre côté de la frontière.
  de:
    intro: >-
      Am 21. April 2011 gelang einem Forscherteam das erste Foto eines lebenden Balkanluchses in diesem Park.
      Seither ist der Luchs sein Symboltier, bleibt jedoch vom Aussterben bedroht. Der Park umfasst rund
      34.507,9 Hektar im Osten Albaniens direkt an der Grenze zu Nordmazedonien und birgt die besterhaltenen
      Buchenbestände mit Urwaldcharakter: die Buchenwälder von Rrajcë, die 2017 zum UNESCO-Welterbe erklärt
      wurden.
    landscape: >-
      Der Name vereint zwei Massive, Shebenik und Jabllanica, deren Höhenstufen von über 2.200 m bis auf 300 m
      hinabreichen. Die Berge entstanden in der variszischen Orogenese und bestehen vor allem aus
      ultramafischen und metamorphen Gesteinen. Eiszeitliche Gletscher schufen Trogtäler, Kare und Seen. Heute
      gibt es 14 Gletscherseen, deren höchster zwischen 1.500 und 1.900 m liegt. Durch den Park fließen die
      Flüsse Qarrishte und Bushtrice mit je 22 km Länge, und der Jahresniederschlag reicht je nach Lage von
      1.300 bis 1.800 mm.


      Der Wald dominiert alles. Buche, Tanne, Kiefer und Eiche kleiden die Hänge; an Nordhängen wachsen
      Purpurweide, Spitzahorn, Birke und Weißtanne. Unter den Nadelbäumen finden sich Schlangenhaut-Kiefer und
      Mazedonische Kiefer, wenngleich die Buche stets vorherrscht. An den Steilhängen von Rrajcë mischt sich
      die Buche mit Tannen und Balkankiefern. Die Strauchschicht bilden Manna-Esche, Hasel und
      Stech-Wacholder.
    wildlife: >-
      Im Park leben rund 30 Säugetierarten, angeführt vom vom Aussterben bedrohten [Eurasischen
      Luchs](/especie/lynx_lynx/). Fuchs und [Wolf](/especie/canis_lupus/) werden regelmäßig gesichtet; der
      [Braunbär](/especie/ursus_arctos/) seltener. In Rrajcë leben auch Wildkatze, [Eurasischer
      Fischotter](/especie/lutra_lutra/) und Gämse. Zudem wurden 18 Fledermausarten nachgewiesen, darunter
      drei Hufeisennasen.


      Die Vogelwelt zählt über 88 Arten. Unter ihnen sind [Steinadler](/especie/aquila_chrysaetos/),
      [Auerhuhn](/especie/tetrao_urogallus/) und Haselhuhn; der Wanderfalke brütet in Felswänden. Unter den
      Amphibien und Reptilien (10 beziehungsweise 15 Arten) kommen Schlingnatter, Ringelnatter und
      [Griechische Landschildkröte](/especie/testudo_hermanni/) vor.
    visit: >-
      Der Park ist ein Terrain für Wanderer. Es gibt Bergpfade und Aufstiege zu den Gletscherseen. Wenn du
      Karten oder Broschüren zu den markierten Wegen suchst, wende dich an die Forstverwaltung in Librazhd.
      Der Tourismus steckt in den Anfängen: Besucher sind selten und meist auf sich allein gestellt. Von Mai
      bis Oktober ist die empfohlene Zeit.


      Zu den sehenswerten Zielen gehören das Dorf Llange mit dreistöckigen Steinhäusern, die Höhlenkirche von
      Koshorisht und die Karstseen von Shebenik. In größeren Dörfern finden traditionelle Feste mit Trachten,
      Liedern und Tänzen statt.
    history: >-
      Die Wälder von Rrajcë wurden 2017 in das UNESCO-Welterbe der alten Buchenwälder und Buchenurwälder der
      Karpaten und anderer Regionen Europas aufgenommen; die Kernzone umfasst rund 2.129,45 Hektar. Im Januar
      2022 wurde der Park auf die heutigen 34.507,9 Hektar erweitert und wird von einer Verwaltung in Librazhd
      und Prrenjas betreut.


      Illegale Abholzung und fehlende nachhaltige Bewirtschaftung bilden reale Gefahren. Die Tierbestände
      erlitten Einbußen; Arten wie Luchs, Wildkatze, Fischotter und Forelle sind stark dezimiert. Es wird am
      Aufbau eines sanften Tourismus gearbeitet.
    before: >-
      Da Besucher selten sind und auf sich gestellt reisen, hole vorab Wegkarten bei der Forstverwaltung in
      Librazhd ein. Der Buchenurwald im Bustrica-Tal ist entlegen und schwierig zu erreichen.
    around: >-
      Rund neunzehn Kilometer entfernt liegt der [Parque Nacional de
      Galičica](/lugar/nacionalen-park-galicica/) und rund zwanzig Kilometer entfernt der [Parque Nacional de
      Mavrovo](/lugar/nacionalen-park-mavrovo/), beide in Nordmazedonien jenseits der Grenze.
  it:
    intro: >-
      Il 21 aprile 2011 un gruppo di ricercatori ottenne la prima fotografia di una lince balcanica vivente
      all'interno di questo parco. Da allora la lince ne è il simbolo naturalistico, pur versando in pericolo
      critico. Il parco abbraccia circa 34.507,9 ettari nell'est dell'Albania, a ridosso del confine con la
      Macedonia del Nord, e custodisce le faggete meglio conservate con profilo di foresta primaria: quelle di
      Rrajcë, riconosciute Patrimonio Mondiale nel 2017.
    landscape: >-
      Il nome fonde due massicci, Shebenik e Jabllanica, dove le quote digradano da oltre 2.200 m fino a 300
      m. Le montagne si sono originate con l'orogenesi ercinica e sono formate in gran parte da rocce
      ultramafiche e metamorfiche. Le glaciazioni quaternarie hanno poi scavato vallate a U, circhi e conche
      lacustri. Oggi si contano 14 laghi glaciali, il più elevato dei quali compreso tra 1.500 e 1.900 m. Il
      parco è solcato dai fiumi Qarrishte e Bushtrice, di 22 km ciascuno, con precipitazioni medie annue tra
      1.300 e 1.800 mm.


      La foresta detta legge. Faggio, abete, pino e querce ammantano i rilievi; sui versanti esposti a nord
      allignano salice rosso, acero riccio, betulla e abete bianco. Tra i pini compaiono il pino loricato e il
      pino macedone, con il faggio sempre dominante. Sulle ripide pendici di Rrajcë il faggio convive con
      abeti e pini balcanici. Il sottobosco è ricco di orniello, nocciolo e ginepro rosso.
    wildlife: >-
      Il parco ospita circa 30 specie di mammiferi con la [lince](/especie/lynx_lynx/) balcanica, in pericolo
      critico, quale specie bandiera. Volpe e [lupo grigio](/especie/canis_lupus/) sono avvistati
      regolarmente; l'[orso bruno](/especie/ursus_arctos/) con minore frequenza. A Rrajcë vivono anche gatto
      selvatico, [lontra europea](/especie/lutra_lutra/) e camoscio. Sono censite 18 specie di chirotteri, tra
      cui tre specie di ferri di cavallo.


      L'avifauna offre oltre 88 specie registrate. Spiccano l'[aquila reale](/especie/aquila_chrysaetos/),
      l'[urogallo](/especie/tetrao_urogallus/) e il francolino di monte; il falco pellegrino nidifica sulle
      rupi. Tra anfibi e rettili (10 e 15 specie) compaiono il colubro liscio, la biscia dal collare e la
      [testuggine di Hermann](/especie/testudo_hermanni/).
    visit: >-
      Il parco è ideale da percorrere a piedi. Esistono sentieri montani che salgono verso i laghi d'alta
      quota. Per avere mappe o informazioni sui percorsi conviene rivolgersi alla Direzione delle Foreste di
      Librazhd. Il turismo è alle prime armi: gli escursionisti sono pochi e procedono in piena autonomia. Da
      maggio a ottobre è il periodo consigliato.


      Tra i punti d'interesse meritano menzione il villaggio di Llange con dimore in pietra a tre piani, la
      chiesetta rupestre di Koshorisht ricavata in una cavità e i laghi carsici dello Shebenik. Nei centri
      principali si tengono feste con canti, danze e costumi della tradizione locale.
    history: >-
      Le foreste di Rrajcë sono state iscritte nel 2017 nel Patrimonio Mondiale UNESCO delle antiche faggete
      europee, estendendosi per circa 2.129,45 ettari all'interno del parco. Nel gennaio 2022 l'area protetta
      è stata ampliata agli attuali 34.507,9 ettari, con gestione affidata alle sedi di Librazhd e Prrenjas.


      Le minacce vertono sui tagli boschivi abusivi e sull'urgenza di un piano di conservazione sostenibile.
      La fauna ha risentito storicamente di queste pressioni, e lince, lontra o trota sono fortemente calate.
      Si persegue uno sviluppo ecoturistico a tutela dell'habitat.
    before: >-
      I visitatori sono rari e viaggiano in autonomia; procurati prima mappa e relazioni presso la Direzione
      delle Foreste di Librazhd. La faggeta primaria della valle di Bustrica è isolata e di accesso impervio.
    around: >-
      A circa diciannove chilometri si trova il [Parque Nacional de
      Galičica](/lugar/nacionalen-park-galicica/) e a circa venti il [Parque Nacional de
      Mavrovo](/lugar/nacionalen-park-mavrovo/), entrambi nella Macedonia del Nord appena oltre confine.
  pt:
    intro: >-
      A 21 de abril de 2011, uma equipa de investigadores obteve a primeira fotografia de um lince-dos-balcãs
      vivo neste parque. Desde então, o lince converteu-se no seu animal mais emblemático, permanecendo em
      perigo crítico. O parque cobre cerca de 34.507,9 hectares no leste da Albânia, encostado à fronteira com
      a Macedónia do Norte, albergando os faiais mais bem conservados com estatuto de floresta primária: os de
      Rrajcë, declarados Património Mundial em 2017.
    landscape: >-
      O topónimo alia dois maciços, Shebenik e Jabllanica, com altitudes que descem de mais de 2.200 m até aos
      300 m. As montanhas formaram-se na orogenia varisca, sendo compostas por rochas ultramáficas e
      metamórficas. Posteriormente, os glaciares da última glaciação talharam vales em U, circos e lagoas.
      Atualmente existem 14 lagos glaciares, situando-se o mais alto entre os 1.500 e os 1.900 m. Pelo parque
      correm os rios Qarrishte e Bushtrice, com 22 km cada um, e a precipitação média anual varia entre 1.300
      e 1.800 mm consoante a zona.


      A floresta domina a paisagem. Faia, abeto, pinheiro e carvalho revestem o relevo; nas encostas viradas a
      norte ocorrem salgueiro-púrpura, bordo-da-noruega, bétula e abeto-branco. Entre os pinheiros surgem o
      pinheiro-da-bósnia e o pinheiro-da-macedónia, sendo a faia sempre mais abundante. Nas vertentes íngremes
      de Rrajcë a faia associa-se a abetos e pinheiros-dos-balcãs. O sub-bosque integra freixo-de-flor,
      aveleira e zimbro-oxicedro.
    wildlife: >-
      O parque acolhe cerca de 30 espécies de mamíferos, constituindo o
      [lince-euroasiático](/especie/lynx_lynx/) dos Balcãs, em perigo crítico, o seu símbolo maior. A raposa e
      o [lobo-cinzento](/especie/canis_lupus/) são avistados com frequência; o
      [urso-pardo](/especie/ursus_arctos/) com menor assiduidade. Em Rrajcë habitam também o gato-bravo, a
      [lontra-europeia](/especie/lutra_lutra/) e a camurça. Estão igualmente recenseadas 18 espécies de
      morcegos, incluindo três de ferradura.


      As aves perfazem mais de 88 espécies assinaladas. Entre elas contam-se a
      [águia-real](/especie/aquila_chrysaetos/), o [tetraz-grande](/especie/tetrao_urogallus/) e a
      galinha-do-mato; o falcão-peregrino nidifica nas escarpas rochosas. Com os anfíbios e répteis (10
      espécies dos primeiros e 15 dos segundos) surgem a cobra-lisa, a cobra-de-água e a
      [tartaruga-de-hermann](/especie/testudo_hermanni/).
    visit: >-
      O parque é feito para ser percorrido a pé. Dispõe de percursos pedestres que ascendem aos lagos
      glaciares. Se pretenderes um mapa ou folheto dos trilhos assinalados, deves passar pela Direção
      Florestal de Librazhd. O turismo encontra-se em fase inicial: os visitantes são escassos e deslocam-se
      autonomamente. De maio a outubro é o período aconselhado.


      Entre os locais recomendados contam-se a aldeia de Llange, com casas de pedra de três andares; a igreja
      rupestre de Koshorisht, construída numa gruta; e os lagos cársticos de Shebenik. Nas povoações maiores
      realizam-se festividades populares com trajes e danças tradicionais.
    history: >-
      As matas de Rrajcë foram incluídas em 2017 no Património Mundial da UNESCO das florestas primárias de
      faias dos Cárpatos e de outras regiões da Europa, abrangendo cerca de 2.129,45 hectares do parque. O
      parque foi ampliado em janeiro de 2022 para os atuais 34.507,9 hectares, sendo tutelado por serviços
      sedeados em Librazhd e Prrenjas.


      As ameaças prendem-se com o corte ilegal de madeira e a necessidade de gestão sustentável. A fauna
      sofreu decréscimos acentuados, estando espécies como o lince, o gato-bravo ou a lontra muito escassas.
      Fomenta-se o ecoturismo para apoiar a preservação do ecossistema.
    before: >-
      Os visitantes são raros e viajam por conta própria; recolhe previamente o mapa dos trilhos na Direção
      Florestal de Librazhd. O faial primário do vale de Bustrica é remoto e de acesso penoso.
    around: >-
      A cerca de dezanove quilómetros fica o [Parque Nacional de Galičica](/lugar/nacionalen-park-galicica/) e
      a cerca de vinte o [Parque Nacional de Mavrovo](/lugar/nacionalen-park-mavrovo/), ambos na Macedónia do
      Norte, do outro lado da fronteira.
