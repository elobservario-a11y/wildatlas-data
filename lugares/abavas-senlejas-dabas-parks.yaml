    The 'Switzerland of Kurzeme', a wooded glacial valley dotted with sandstone caves and travertine
    waterfalls.
  fr: >-
    La 'Suisse de Kurzeme', une vallée glaciaire boisée parsemée de grottes de grès et de cascades
    travertineuses.
  de: Die 'Schweiz von Kurzeme', ein bewaldetes Gletschertal mit Sandsteinhöhlen und Travertinwasserfällen.
  it: >-
    La 'Svizzera di Kurzeme', una valle glaciale boscosa punteggiata da grotte di arenaria e cascate
    travertinose.
  pt: A 'Suíça de Kurzeme', vale glaciar arborizado salpicado de grutas de arenito e cascatas de travertino.
unico:
