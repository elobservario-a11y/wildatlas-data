  fr: >-
    Une vallée glaciaire avec des cascades de dolomite, des grottes de grès, des tourbières aux eaux
    sulfureuses et une histoire habitée depuis le Néolithique.
  de: >-
    Ein Gletschertal mit Dolomit-Wasserfällen, Sandsteinhöhlen, Schwefelwasserbogs und einer Geschichte
    menschlicher Besiedlung seit dem Neolithikum.
  it: >-
    Una valle glaciale con cascate di dolomite, grotte di arenaria, torbiere di acqua solforosa e una storia
    abitata sin dal Neolitico.
  pt: >-
    Um vale glaciar com cascatas de dolomite, grutas de arenito, turfeiras de águas sulfurosas e uma história
    de ocupação humana desde o Neolítico.
observaciones:
  es: Consulta con el gestor las normas de uso del parque y la regulación de cada punto antes de ir.
texto:
  es:
    intro: >-
      Cuando el hielo se fundió, el agua de deshielo excavó el valle del Abava: laderas empinadas, valles
      laterales, afloramientos de roca madre, barrancos, manantiales y desembocaduras de afluentes. El
      resultado es un mosaico de paisajes tan marcado que el entorno se conoce como la «Suiza de Kurzeme». El
      Parque Natural del Valle de Abava, creado en 1957, cubre catorce mil ochocientas cincuenta y ocho
      hectáreas de ese valle labrado por el hielo.
    landscape: >-
      El valle del Abava se formó por la erosión de las aguas de deshielo de los glaciares, de ahí su gran
      variedad de paisajes. Lo que quedó a la vista es roca: los acantilados dolomíticos de Imula, Kalnamuižas
      kraujas, Cimmermaņu krauja, Muižarāju klintis y Langsēdes klintis, la cascada de Sudmaļi y las cascadas
      de Īvande, y la cueva Abavas Velnala.


      Entre todas, Abavas Rumba destaca. La cascada se forma sobre un escalón de dolomita de la serie Pļaviņu
      del Devónico superior: la presencia de una capa densa de dolomita en el fondo del valle, junto con la
      erosión de los estratos menos resistentes, mantiene el escalón. El salto mide un metro de alto y entre
      treinta y treinta y cinco metros de ancho, y empezó a formarse al final de la Edad de Hielo, durante la
      creación del valle antiguo Abava-Slocene. Es, además, uno de los poquísimos afloramientos donde hay
      datados sedimentos del final de la glaciación.


      En el pantano de Čužu brotan fuentes de agua sulfurosa, descubiertas a comienzos del siglo XX, y se
      puede probar el agua en el arroyo que sale de la fuente «Velna acs».
    wildlife: >-
      La biodiversidad del valle es alta y distinta de la de las zonas vecinas: el parque tiene 28 hábitats
      raros y 252 especies protegidas, entre ellas 109 aves, como el águila pescadora, el urogallo y el pico
      dorsiblanco. Entre los hábitats más raros hay turberas calcáreas con juncia de Devel y enebrales en
      praderas calcáreas. En flora, se ha registrado la planta Agrimonia pilosa, llamada spilvainais ancītis
      en letón.
    visit: >-
      Los senderos más conocidos llevan nombres de lugares concretos. El sendero del pantano de Čužu mide 4 km
      y es fácil. El de Imula mide 5 km y es de dificultad normal. La Mīlestības taka mide 1,5 km y es de
      dificultad media: ofrece una «caminata de montaña», y por su relieve marcado el entorno se conoce como
      la «Suiza de Kurzeme».


      La administración del área incluye el sendero natural Imula entre sus infraestructuras turísticas, y se
      recorre a pie. Abavas Rumba figura entre los recursos destacados para el turismo de naturaleza. Cerca
      del río están Kandava y Sabile, dos ciudades antiguas que enriquecen el territorio con monumentos
      naturales y culturales.
    history: >-
      El valle está poblado desde el Neolítico, y los castros, asentamientos, tumbas antiguas, castillos de
      caballeros en ruinas, mansiones e iglesias lo atestiguan. El parque se creó para proteger el valle de
      Abava, sus paisajes y su rico patrimonio cultural e histórico, además de hábitats de bosques, prados y
      especies raras de interés europeo. Incluye la reserva natural del pantano de Čužu y las fuentes de agua
      sulfurosa de Čužu como objeto geológico, y es zona Natura 2000. La gestiona la Administración Regional
      de Kurzeme de la Agencia de Protección de la Naturaleza, y se reparte entre los municipios de Ventspils,
      Kuldīga, Talsi y Tukums.
    before: Consulta con el gestor las normas de uso del parque y la regulación de cada punto antes de ir.
    around: >-
      A un kilómetro queda [Ventas Ieleja - Ventas Rumba](/lugar/ventas-ieleja---ventas-rumba/), otro espacio
      de cascadas de la región, y a unos treinta kilómetros, el [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/).
  en:
    intro: >-
      When the ice melted, meltwater carved the Abava valley: steep slopes, side valleys, bedrock outcrops,
      ravines, springs and tributary mouths. The result is a mosaic of landscapes so pronounced that the
      surroundings are known as the "Switzerland of Kurzeme". The Abava Valley Nature Park, created in 1957,
      covers fourteen thousand eight hundred and fifty-eight hectares of that valley carved by ice.
    landscape: >-
      The Abava valley was formed by erosion from glacial meltwater, hence its great variety of landscapes.
      What was left exposed is rock: the dolomite cliffs of Imula, Kalnamuižas kraujas, Cimmermaņu krauja,
      Muižarāju klintis and Langsēdes klintis, the Sudmaļi waterfall and the Īvande waterfalls, and the Abavas
      Velnala cave.


      Among them all, Abavas Rumba stands out. The waterfall forms over a dolomite step of the Pļaviņu series
      of the Upper Devonian: the presence of a dense dolomite layer at the valley floor, together with the
      erosion of less resistant strata, maintains the step. The drop is one metre high and between thirty and
      thirty-five metres wide, and began forming at the end of the Ice Age, during the creation of the ancient
      Abava-Slocene valley. It is also one of the very few outcrops where sediments from the end of the
      glaciation are dated.


      In the Čužu bog, sulphurous springs emerge, discovered in the early twentieth century, and the water can
      be tasted in the stream that flows from the "Velna acs" spring.
    wildlife: >-
      The biodiversity of the valley is high and distinct from that of neighbouring areas: the park has 28
      rare habitats and 252 protected species, including 109 birds such as the osprey, the capercaillie and
      the white-backed woodpecker. Among the rarest habitats are calcareous fens with Davall's sedge and
      juniper shrubland on calcareous grasslands. In terms of flora, the plant Agrimonia pilosa has been
      recorded, known in Latvian as spilvainais ancītis.
    visit: >-
      The best-known trails carry the names of specific places. The Čužu bog trail is 4 km long and easy. The
      Imula trail is 5 km long and of normal difficulty. The Mīlestības taka is 1.5 km long and of medium
      difficulty: it offers a "mountain walk", and because of its pronounced relief the surroundings are known
      as the "Switzerland of Kurzeme".


      The area administration includes the Imula nature trail among its tourist infrastructure, and it is
      walked on foot. Abavas Rumba is listed among the top resources for nature tourism. Near the river are
      Kandava and Sabile, two ancient towns that enrich the territory with natural and cultural monuments.
    history: >-
      The valley has been inhabited since the Neolithic, as evidenced by hill forts, settlements, ancient
      graves, ruined knights' castles, manor houses and churches. The park was created to protect the Abava
      valley, its landscapes and its rich cultural and historical heritage, as well as forest and meadow
      habitats and rare species of European interest. It includes the Čužu bog nature reserve and the Čužu
      sulphurous springs as a geological feature, and is a Natura 2000 site. It is managed by the Kurzeme
      Regional Administration of the Nature Protection Agency and is shared among the municipalities of
      Ventspils, Kuldīga, Talsi and Tukums.
    before: >-
      Check with the management authority the rules of use and the specific regulations for each area before
      visiting.
    around: >-
      One kilometre away is [Ventas Ieleja — Ventas Rumba](/lugar/ventas-ieleja---ventas-rumba/), another
      waterfall area in the region, and about thirty kilometres away, [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/).
  fr:
    intro: >-
      Lorsque la glace a fondu, les eaux de fonte ont creusé la vallée de l'Abava : pentes escarpées, vallées
      latérales, affleurements de roche mère, ravines, sources et embouchures d'affluents. Le résultat est une
      mosaïque de paysages si prononcée que les environs sont connus sous le nom de « Suisse de Kurzeme ». Le
      Parc Naturel de la Vallée de l'Abava, créé en 1957, couvre quatorze mille huit cent cinquante-huit
      hectares de cette vallée façonnée par la glace.
    landscape: >-
      La vallée de l'Abava s'est formée par l'érosion des eaux de fonte glaciaires, d'où sa grande variété de
      paysages. Ce qui a été mis à jour, c'est la roche : les falaises dolomitiques d'Imula, Kalnamuižas
      kraujas, Cimmermaņu krauja, Muižarāju klintis et Langsēdes klintis, la cascade de Sudmaļi et les
      cascades d'Īvande, et la grotte Abavas Velnala.


      Parmi toutes, Abavas Rumba se distingue. La cascade se forme sur un gradin de dolomite de la série
      Pļaviņu du Dévonien supérieur : la présence d'une couche dense de dolomite au fond de la vallée,
      associée à l'érosion des strates moins résistantes, maintient le gradin. La chute mesure un mètre de
      haut et entre trente et trente-cinq mètres de large, et a commencé à se former à la fin de l'ère
      glaciaire, lors de la création de l'ancienne vallée Abava-Slocene. C'est également l'un des très rares
      affleurements où des sédiments de la fin de la glaciation sont datés.


      Dans la tourbière de Čužu jaillissent des sources d'eau sulfureuse, découvertes au début du XXe siècle,
      et on peut goûter l'eau dans le ruisseau qui sort de la source « Velna acs ».
    wildlife: >-
      La biodiversité de la vallée est élevée et distincte de celle des zones voisines : le parc compte 28
      habitats rares et 252 espèces protégées, dont 109 oiseaux comme le balbuzard pêcheur, le grand tétras et
      le pic à dos blanc. Parmi les habitats les plus rares figurent les bas-marais calcaires à laîche de
      Davall et les formations à genévriers sur prairies calcaires. En flore, la plante Agrimonia pilosa a été
      enregistrée, appelée spilvainais ancītis en letton.
    visit: >-
      Les sentiers les plus connus portent les noms de lieux précis. Le sentier de la tourbière de Čužu mesure
      4 km et est facile. Celui d'Imula mesure 5 km et est de difficulté normale. La Mīlestības taka mesure
      1,5 km et est de difficulté moyenne : elle offre une « randonnée de montagne », et en raison de son
      relief prononcé, les environs sont connus sous le nom de « Suisse de Kurzeme ».


      L'administration de la zone inclut le sentier naturel d'Imula parmi ses infrastructures touristiques, et
      il se parcourt à pied. Abavas Rumba figure parmi les ressources phares pour le tourisme nature. Près de
      la rivière se trouvent Kandava et Sabile, deux villes anciennes qui enrichissent le territoire de
      monuments naturels et culturels.
    history: >-
      La vallée est peuplée depuis le Néolithique, comme en témoignent les oppida, les établissements, les
      tombes anciennes, les châteaux forts en ruines, les manoirs et les églises. Le parc a été créé pour
      protéger la vallée de l'Abava, ses paysages et son riche patrimoine culturel et historique, ainsi que
      des habitats forestiers, des prairies et des espèces rares d'intérêt européen. Il comprend la réserve
      naturelle de la tourbière de Čužu et les sources d'eau sulfureuse de Čužu comme objet géologique, et est
      une zone Natura 2000. Il est géré par l'Administration Régionale de Kurzeme de l'Agence de Protection de
      la Nature et est réparti entre les municipalités de Ventspils, Kuldīga, Talsi et Tukums.
    before: >-
      Renseignez-vous auprès du gestionnaire sur les règles d'utilisation et la réglementation spécifique de
      chaque zone avant de visiter.
    around: >-
      À un kilomètre se trouve [Ventas Ieleja — Ventas Rumba](/lugar/ventas-ieleja---ventas-rumba/), un autre
      espace de cascades de la région, et à environ trente kilomètres, le [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/).
  de:
    intro: >-
      Als das Eis schmolz, grub das Schmelzwasser das Abava-Tal: steile Hänge, Seitentäler, Felsaufschlüsse,
      Schluchten, Quellen und Mündungen von Nebenflüssen. Das Ergebnis ist ein Landschaftsmosaik, das so
      ausgeprägt ist, dass die Umgebung als die „Schweiz von Kurzeme" bekannt ist. Der Naturpark Abava-Tal,
      1957 gegründet, umfasst vierzehntausendachthundertachtundfünfzig Hektar dieses vom Eis geformten Tals.
    landscape: >-
      Das Abava-Tal entstand durch die Erosion der glazialen Schmelzwasser, daher seine große
      Landschaftsvielfalt. Was freigelegt wurde, ist Gestein: die Dolomitfelsen von Imula, Kalnamuižas
      kraujas, Cimmermaņu krauja, Muižarāju klintis und Langsēdes klintis, der Sudmaļi-Wasserfall und die
      Īvande-Wasserfälle sowie die Abavas-Velnala-Höhle.


      Unter allen sticht Abavas Rumba heraus. Der Wasserfall bildet sich an einer Dolomit-Stufe der
      Pļaviņu-Schichtfolge des Oberdevons: Das Vorhandensein einer dichten Dolomitschicht im Talgrund,
      kombiniert mit der Erosion der weniger widerstandsfähigen Schichten, erhält die Stufe. Der Absturz ist
      einen Meter hoch und zwischen dreißig und fünfunddreißig Meter breit und begann sich am Ende der Eiszeit
      zu bilden, während der Entstehung des alten Abava-Slocene-Tals. Es ist auch eines der ganz wenigen
      Aufschlüsse, in denen Sedimente vom Ende der Vereisung datiert sind.


      Im Čužu-Moor sprudeln Schwefelwasserquellen, die Anfang des zwanzigsten Jahrhunderts entdeckt wurden,
      und man kann das Wasser in dem Bach probieren, der aus der Quelle „Velna acs" fließt.
    wildlife: >-
      Die Biodiversität des Tals ist hoch und unterscheidet sich von der der benachbarten Gebiete: Der Park
      hat 28 seltene Lebensräume und 252 geschützte Arten, darunter 109 Vögel wie den Fischadler, das Auerhuhn
      und den Weißrückenspecht. Zu den seltensten Lebensräumen gehören Davall-Seggen-Kalkreiche Niedermoore
      und Wacholderheiden auf Kalkgrasland. In der Flora wurde die Pflanze Agrimonia pilosa nachgewiesen, auf
      Lettisch spilvainais ancītis genannt.
    visit: >-
      Die bekanntesten Wege tragen die Namen konkreter Orte. Der Čužu-Moorweg ist 4 km lang und leicht. Der
      Imula-Weg ist 5 km lang und von normaler Schwierigkeit. Die Mīlestības taka ist 1,5 km lang und von
      mittlerer Schwierigkeit: Sie bietet eine „Bergwanderung", und aufgrund ihres ausgeprägten Reliefs ist
      die Umgebung als die „Schweiz von Kurzeme" bekannt.


      Die Gebietsverwaltung führt den Imula-Naturlehrpfad zu ihrer touristischen Infrastruktur, der zu Fuß
      begangen wird. Abavas Rumba gehört zu den herausragenden Ressourcen für den Naturtourismus. In der Nähe
      des Flusses befinden sich Kandava und Sabile, zwei alte Städte, die das Gebiet mit Natur- und
      Kulturdenkmälern bereichern.
    history: >-
      Das Tal ist seit dem Neolithikum besiedelt, wie Hügelburgen, Siedlungen, alte Gräber, verfallene
      Ritterburgen, Herrenhäuser und Kirchen belegen. Der Park wurde gegründet, um das Abava-Tal, seine
      Landschaften und sein reiches kulturelles und historisches Erbe zu schützen, sowie Wald- und
      Wiesenlebensräume und seltene Arten von europäischem Interesse. Er umfasst das
      Čužu-Moor-Naturschutzgebiet und die Čužu-Schwefelquellen als geologisches Objekt und ist ein
      Natura-2000-Gebiet. Er wird von der Kurzeme-Regionalverwaltung der Naturschutzbehörde verwaltet und
      erstreckt sich über die Gemeinden Ventspils, Kuldīga, Talsi und Tukums.
    before: >-
      Erkundigen Sie sich beim Verwalter nach den Nutzungsregeln und den spezifischen Vorschriften für jeden
      Bereich, bevor Sie Ihren Besuch planen.
    around: >-
      Einen Kilometer entfernt liegt [Ventas Ieleja — Ventas Rumba](/lugar/ventas-ieleja---ventas-rumba/), ein
      weiteres Wasserfall-Gebiet der Region, und etwa dreißig Kilometer entfernt der [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/).
  it:
    intro: >-
      Quando il ghiaccio si sciolse, le acque di disgelo scavarono la valle dell'Abava: pendii ripidi, valli
      laterali, affioramenti di roccia madre, burroni, sorgenti e foci di affluenti. Il risultato è un mosaico
      di paesaggi così marcato che l'ambiente è noto come la «Svizzera di Kurzeme». Il Parco Naturale della
      Valle dell'Abava, creato nel 1957, copre quattordicimilaottocentocinquantotto ettari di quella valle
      scolpita dal ghiaccio.
    landscape: >-
      La valle dell'Abava si è formata per erosione delle acque di disgelo dei ghiacciai, da qui la sua grande
      varietà di paesaggi. Ciò che è rimasto esposto è la roccia: le scogliere dolomitiche di Imula,
      Kalnamuižas kraujas, Cimmermaņu krauja, Muižarāju klintis e Langsēdes klintis, la cascata di Sudmaļi e
      le cascate di Īvande, e la grotta Abavas Velnala.


      Tra tutte, Abavas Rumba spicca. La cascata si forma su un gradino di dolomite della serie Pļaviņu del
      Devoniano superiore: la presenza di uno strato denso di dolomite nel fondovalle, insieme all'erosione
      degli strati meno resistenti, mantiene il gradino. Il salto misura un metro di altezza e tra trenta e
      trentacinque metri di larghezza, e ha cominciato a formarsi al termine dell'Età Glaciale, durante la
      creazione dell'antica valle Abava-Slocene. È anche uno dei rarissimi affioramenti in cui sono datati i
      sedimenti della fine della glaciazione.


      Nella torbiera di Čužu sgorgano sorgenti di acqua solforosa, scoperte agli inizi del XX secolo, e si può
      assaggiare l'acqua nel ruscello che fuoriesce dalla sorgente «Velna acs».
    wildlife: >-
      La biodiversità della valle è elevata e distinta da quella delle zone vicine: il parco ha 28 habitat
      rari e 252 specie protette, tra cui 109 uccelli come l'osprey, il gallo cedrone e il picchio
      dorsobianco. Tra gli habitat più rari vi sono le torbiere basse calcaree con carice di Davall e
      ginepraie su praterie calcaree. In termini di flora, è stata registrata la pianta Agrimonia pilosa,
      chiamata spilvainais ancītis in lettone.
    visit: >-
      I sentieri più conosciuti portano i nomi di luoghi specifici. Il sentiero della torbiera di Čužu è lungo
      4 km ed è facile. Quello di Imula è lungo 5 km ed è di difficoltà normale. La Mīlestības taka è lunga
      1,5 km ed è di difficoltà media: offre una «camminata di montagna», e per il suo rilievo marcato
      l'ambiente è noto come la «Svizzera di Kurzeme».


      L'amministrazione dell'area include il sentiero naturale di Imula tra le sue infrastrutture turistiche,
      e si percorre a piedi. Abavas Rumba figura tra le risorse di punta per il turismo naturalistico. Vicino
      al fiume si trovano Kandava e Sabile, due antiche città che arricchiscono il territorio con monumenti
      naturali e culturali.
    history: >-
      La valle è abitata sin dal Neolitico, come testimoniano i castellieri, gli insediamenti, le tombe
      antiche, i castelli medievali in rovina, le ville signorili e le chiese. Il parco fu creato per
      proteggere la valle dell'Abava, i suoi paesaggi e il suo ricco patrimonio culturale e storico, oltre
      agli habitat forestali, ai prati e alle specie rare di interesse europeo. Include la riserva naturale
      della torbiera di Čužu e le sorgenti solforose di Čužu come oggetto geologico, ed è zona Natura 2000. È
      gestito dall'Amministrazione Regionale di Kurzeme dell'Agenzia per la Protezione della Natura e si
      divide tra i comuni di Ventspils, Kuldīga, Talsi e Tukums.
    before: >-
      Consultate il gestore per le norme di utilizzo del parco e la regolamentazione di ciascuna zona prima di
      visitarla.
    around: >-
      A un chilometro si trova [Ventas Ieleja — Ventas Rumba](/lugar/ventas-ieleja---ventas-rumba/), un altro
      spazio di cascate della regione, e a circa trenta chilometri il [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/).
  pt:
    intro: >-
      Quando o gelo derreteu, as águas de degelo escavaram o vale do Abava: encostas íngremes, vales laterais,
      afloramentos de rocha-mãe, ravinas, nascentes e fozões de afluentes. O resultado é um mosaico de
      paisagens tão marcado que a zona é conhecida como a «Suíça de Kurzeme». O Parque Natural do Vale do
      Abava, criado em 1957, cobre catorze mil oitocentas e cinquenta e oito hectares desse vale talhado pelo
      gelo.
    landscape: >-
      O vale do Abava formou-se pela erosão das águas de degelo dos glaciares, daí a sua grande variedade de
      paisagens. O que ficou à vista é rocha: as falésias de dolomite de Imula, Kalnamuižas kraujas,
      Cimmermaņu krauja, Muižarāju klintis e Langsēdes klintis, a cascata de Sudmaļi e as cascatas de Īvande,
      e a gruta Abavas Velnala.


      Entre todas, Abavas Rumba destaca-se. A cascata forma-se sobre um degrau de dolomite da série Pļaviņu do
      Devónico superior: a presença de uma camada densa de dolomite no fundo do vale, juntamente com a erosão
      dos estratos menos resistentes, mantém o degrau. A queda mede um metro de altura e entre trinta e trinta
      e cinco metros de largura, e começou a formar-se no final da Idade do Gelo, durante a criação do antigo
      vale Abava-Slocene. É também um dos pouquíssimos afloramentos onde estão datados sedimentos do final da
      glaciação.


      Na turfeira de Čužu brotam fontes de água sulfurosa, descobertas no início do século XX, e pode
      provar-se a água no ribeiro que sai da fonte «Velna acs».
    wildlife: >-
      A biodiversidade do vale é elevada e distinta da das zonas vizinhas: o parque tem 28 habitats raros e
      252 espécies protegidas, entre elas 109 aves, como a águia-pesqueira, o galo-silvestre e o
      pica-pau-de-dorso-branco. Entre os habitats mais raros há turfeiras calcárias com cárex de Davall e
      zimbrais em prados calcários. Em flora, foi registada a planta Agrimonia pilosa, chamada spilvainais
      ancītis em letão.
    visit: >-
      Os trilhos mais conhecidos têm nomes de lugares concretos. O trilho da turfeira de Čužu tem 4 km e é
      fácil. O de Imula tem 5 km e é de dificuldade normal. A Mīlestības taka tem 1,5 km e é de dificuldade
      média: oferece uma «caminhada de montanha», e pelo seu relevo acentuado a zona é conhecida como a «Suíça
      de Kurzeme».


      A administração da área inclui o trilho natural de Imula entre as suas infraestruturas turísticas, e
      percorre-se a pé. Abavas Rumba figura entre os recursos de destaque para o turismo de natureza. Perto do
      rio ficam Kandava e Sabile, duas cidades antigas que enriquecem o território com monumentos naturais e
      culturais.
    history: >-
      O vale está habitado desde o Neolítico, como o atestam os castros, aglomerados, sepulturas antigas,
      castelos medievais em ruínas, solares e igrejas. O parque foi criado para proteger o vale do Abava, as
      suas paisagens e o seu rico património cultural e histórico, bem como habitats de florestas, prados e
      espécies raras de interesse europeu. Inclui a reserva natural da turfeira de Čužu e as fontes de água
      sulfurosa de Čužu como objeto geológico, e é zona Natura 2000. É gerido pela Administração Regional de
      Kurzeme da Agência de Proteção da Natureza e distribui-se pelos municípios de Ventspils, Kuldīga, Talsi
      e Tukums.
    before: Consulta o gestor sobre as normas de uso do parque e a regulamentação de cada zona antes de ir.
    around: >-
      A um quilómetro fica [Ventas Ieleja — Ventas Rumba](/lugar/ventas-ieleja---ventas-rumba/), outro espaço
      de cascatas da região, e a cerca de trinta quilómetros, o [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/).
