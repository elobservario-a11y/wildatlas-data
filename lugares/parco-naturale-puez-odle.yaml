resumen:
  es: >-
    Las afiladísimas torres de dolomía de las Odle/Geisler alzándose sobre las praderas alpinas de la Val di
    Funes.
  en: The razor-sharp dolomitic spires of the Odle/Geisler towering above the alpine pastures of Val di Funes.
  fr: Les aiguilles dolomitiques effilées des Odle/Geisler dominant les prairies alpines du Val di Funes.
  de: Die messerscharfen Dolomitenzacken der Geislergruppe über den sonnigen Almen des Villnößtals.
  it: Le affilatissime guglie dolomitiche delle Odle/Geisler che dominano i pascoli alpini della Val di Funes.
  pt: As afiladas agulhas dolomíticas das Odle/Geisler erguendo-se sobre as pastagens alpinas do Val di Funes.
unico:
  es: >-
    En un mismo parque están todos los tipos de roca y todos los estratos típicos de las Dolomitas, desde el
    zócalo de pórfidos hasta los sedimentos del Jurásico y el Cretácico.
  en: >-
    Within a single park lie all the rock types and typical strata of the Dolomites, from the porphyry
    basement to Jurassic and Cretaceous sediments.
  fr: >-
    Un seul parc réunit tous les types de roches et toutes les strates représentatives des Dolomites, du socle
    de porphyres aux sédiments du Jurassique et du Crétacé.
  de: >-
    In einem einzigen Park sind sämtliche Gesteinsarten und typischen Schichten der Dolomiten vertreten, vom
    Quarzporphyrsockel bis zu Sedimenten des Jura und der Kreide.
  it: >-
    In un unico parco si incontrano tutti i tipi di roccia e tutti gli strati tipici delle Dolomiti, dal
    basamento porfirico ai sedimenti del Giurassico e del Cretacico.
  pt: >-
    Num mesmo parque reúnem-se todos os tipos de rocha e todos os estratos característicos das Dolomitas,
    desde o soco de pórfiro aos sedimentos do Jurássico e do Cretáceo.
