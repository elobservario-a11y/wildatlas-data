resumen:
  es: >-
    El mayor parque nacional de Macedonia del Norte: montañas de Bistra y Korab, cascadas y uno de los últimos
    núcleos del lince balcánico.
  en: >-
    North Macedonia's largest national park: the Bistra and Korab ranges, waterfalls and one of the last
    strongholds of the Balkan lynx.
  fr: >-
    Le plus grand parc national de Macédoine du Nord : massifs de Bistra et Korab, cascades et l'un des
    ultimes bastions du lynx des Balkans.
  de: >-
    Nordmazedoniens größter Nationalpark: Bistra- und Korab-Gebirge, Wasserfälle und eines der letzten
    Refugien des Balkanluchses.
  it: >-
    Il parco nazionale più esteso della Macedonia del Nord: massicci di Bistra e Korab, cascate e uno degli
    ultimi baluardi della lince balcanica.
  pt: >-
    O maior parque nacional da Macedónia do Norte: serras de Bistra e Korab, cascatas e um dos últimos redutos
    do lince-dos-balcãs.
unico:
  es: >-
    Aquí están la cascada más alta de los Balcanes, las turberas alpinas del Šar y el karst con cuevas de
    Bistra, además de uno de los tres refugios que quedan del lince de los Balcanes.
  en: >-
    Here lie the highest waterfall in the Balkans, alpine peat bogs on the Šar range and the karst caves of
    Bistra, alongside one of only three remaining refuges for the Balkan lynx.
  fr: >-
    Ici se déploient la plus haute cascade des Balkans, les tourbières alpines du Šar et le karst caverneux de
    Bistra, ainsi que l'un des trois derniers sanctuaires du lynx des Balkans.
  de: >-
    Hier liegen der höchste Wasserfall des Balkans, alpine Hochmoore der Šar Planina und der Höhlenkarst der
    Bistra sowie eines der drei letzten Rückzugsgebiete des Balkanluchses.
  it: >-
    Qui si trovano la cascata più alta dei Balcani, le torbiere alpine dello Šar e il paesaggio carsico con
    grotte di Bistra, oltre a uno dei tre ultimi rifugi della lince balcanica.
  pt: >-
    Aqui localizam-se a cascata mais alta dos Balcãs, as turfeiras alpinas de Šar e o carste cavernícola de
    Bistra, além de um dos três últimos santuários do lince-dos-balcãs.
observaciones:
  es: >-
    El gestor prohíbe encender fuego y acampar dentro de los límites del patrimonio natural, y pide moverse
    solo por senderos y pistas de montaña marcados. Está prohibido recoger muestras de especies silvestres o
    de sus partes, y destruir cuevas o minerales raros. La afluencia es media en la estación de esquí de
    Mavrovo en invierno. Mira antes en la web del gestor los sectores abiertos y las restricciones del
    momento.
texto:
  es:
    intro: >-
      Tres montañas se juntan en Mavrovo y entre ellas corre un río que ha tallado un cañón de más de 25 km.
      Son las montañas de Šar, Korab y Bistra, y el cañón es el del Radika, con acantilados verticales que
      superan los 300 m de altura. Este es el mayor de los cuatro parques nacionales de Macedonia del Norte:
      ocupa unos 780 km² en el oeste del país y debe su nombre al pueblo de Mavrovo, junto al lago.
    landscape: >-
      El Korab, de 2.764 m, es el pico más alto del país, y el Šar también supera los 2.700 m. Son cadenas de
      cumbres nevadas y dentadas con amplias mesetas de hierba en su base. El relieve guarda sorpresas de
      épocas muy distintas: turberas alpinas heredadas de la Edad de Hielo en el Šar, relieve kárstico raro
      con cuevas en Bistra y numerosos lagos glaciares por toda la zona alpina. Uno de ellos, el lago Lokuv,
      en la montaña Deshat, es el lago glaciar más bajo de Macedonia.


      La clave del paisaje es la altura. Los seis pisos de vida del parque, un fenómeno raro en un territorio
      tan pequeño, sostienen 22 ecosistemas de bosque y 16 de pastizal. Y como esta región ha sido una
      encrucijada geográfica donde el clima cambió mucho a lo largo de la historia, hay un gran número de
      especies relictas y endémicas. Entre las reliquias del Terciario figuran el pino macedonio y el pino
      bosnio, coníferas endémicas raras de los Balcanes centrales. Amplias zonas están cubiertas por abetares
      de abeto macedonio, que solo crece en esta parte de los Balcanes. En las laderas sur del monte Bistra
      queda uno de los pocos hábitats naturales del castaño de los Balcanes, y en un cañón inaccesible del Šar
      occidental hay un bosque de abeto rojo muy al sur del límite de la especie.
    wildlife: >-
      En el parque viven más de 1.300 especies de plantas herbáceas y 145 de árboles. Entre los animales hay
      osos, varias clases de ciervos, cabras salvajes, nutrias y lobos. El [oso
      pardo](/especie/ursus_arctos/), el [lince](/especie/lynx_lynx/) balcánico, el
      [lobo](/especie/canis_lupus/) y el [rebeco](/especie/rupicapra_rupicapra/) balcánico tienen aquí sus
      mayores poblaciones restantes en un país donde los bosques han resistido, aunque modificados.


      Para las aves, el dato más llamativo es el colirrojo de Güldenstädt: su registro en el parque fue la
      primera cita de la especie para la ornitofauna de Macedonia. Diecinueve de las aves registradas figuran
      en el anexo I de la Directiva de Aves de la UE. Y en los ríos de montaña, rápidos y fríos, viven las
      tres truchas autóctonas, Salmo farioides, Salmo montenegrinus y Salmo dentex, endemismos de los Balcanes
      occidentales.


      Los meses más recomendados para ir son de junio a octubre; en invierno, la estación de esquí de Mavrovo
      concentra la afluencia.
    visit: >-
      Hay planes para todos los ritmos. El más corto es la cueva Šarkova Dupka, junto a la estación de
      invierno de Mavrovo: se llega a pie en unos diez minutos por un camino con escaleras. Las cascadas de
      Duf, junto a Rostuše, están a unos treinta minutos andando por un sendero marcado y vallado; para llegar
      hay que atravesar el cañón de Duf, de hasta 60 m de altura.


      Para caminar más, el lago glaciar Lokuv se alcanza andando ocho kilómetros por senderos marcados. Otro
      paseo conduce por un sendero parcialmente marcado y bien transitable que atraviesa un pinar. Desde
      Lazaropole, uno de los pueblos más altos del país, a 1.350 m, se puede subir a la colina Čulovec, de
      1.728 m.


      El centro de cría de ciervo europeo de Bunec es un recinto vallado de 430 ha donde se ven ciervos y
      gamos, con una torre de observación pensada para ver fauna y fotografiarla. La cascada de Korab, en
      cambio, está en una de las zonas más difíciles e inaccesibles del parque, donde los guardas han tenido
      que evacuar a excursionistas.
    history: >-
      El parque nació por una ley de 1949 que declaró parque nacional los bosques alrededor del campo de
      Mavrovo por su belleza natural y su valor histórico y científico. Después se reorganizó en reservas
      estrictas, reservas gestionadas y una zona turística. Esa historia convive con otra más antigua en
      piedra y madera: el monasterio de San Juan Bigorski, con unos mil años y una iconostasis de madera
      tallada, y el puente otomano de Elen Skok, en el camino hacia Mala Reka. Una iglesia levantada en el
      campo de Mavrovo en 1857 quedó sumergida en 1957 al construirse los sistemas hidráulicos del lago.
    before: >-
      El gestor prohíbe encender fuego y acampar dentro de los límites del patrimonio natural, y pide moverse
      solo por senderos y pistas de montaña marcados. Está prohibido recoger muestras de especies silvestres o
      de sus partes, y destruir cuevas o minerales raros. La afluencia es media en la estación de esquí de
      Mavrovo en invierno. Mira antes en la web del gestor los sectores abiertos y las restricciones del
      momento.
    around: >-
      A 20 km está el [Parque Nacional Shebenik-Jabllanicë - Bosque Primario de
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/) y a 27 km el [Parque Nacional de la
      Cordillera de Šar](/lugar/nacionalni-park-sar-planina/).
  en:
    intro: >-
      Three mountain massifs converge in Mavrovo, cradling a wild river that has carved a canyon stretching
      over 25 km. These are the Šar, Korab and Bistra mountains, and the gorge is the Radika Canyon, flanked
      by sheer vertical limestone cliffs rising more than 300 m high. This is the largest of North Macedonia's
      four national parks: encompassing around 780 km² in the western highlands, taking its name from the
      lakeside village of Mavrovo.
    landscape: >-
      Mount Korab, towering at 2,764 m, marks the highest summit in the country, while the Šar crests also
      exceed 2,700 m. These are jagged, snow-capped ridges rising above vast highland pasture plateaus. The
      topography preserves striking relics from contrasting geological eras: alpine peat bogs inherited from
      the Ice Age in the Šar, rare karst formations riddled with caves in Bistra, and numerous glacial tarns
      scattered throughout the high-altitude zone. Among them, Lake Lokuv on Mount Deshat is the lowest
      glacial lake in North Macedonia.


      Altitude is the master architect here. Six distinct vertical life zones, an extraordinary phenomenon
      across such a compact area, support 22 forest and 16 grassland ecosystem types. Situated at an ancient
      biogeographical crossroads of changing climates, the park shelters an exceptional wealth of relict and
      endemic flora. Tertiary relicts include the Macedonian pine and Bosnian pine, rare conifers endemic to
      the central Balkans. Extensive slopes are blanketed in Macedonian fir forests, which grow only in this
      part of the Balkan Peninsula. On the southern flanks of Mount Bistra lies one of the few native stands
      of the Balkan horse-chestnut, while an isolated gorge in western Šar preserves a Norway spruce forest
      flourishing far south of its typical range.
    wildlife: >-
      More than 1,300 species of herbaceous plants and 145 species of trees thrive within the park boundaries.
      Mammals include brown bears, diverse deer, wild goats, otters and wolves. The [brown
      bear](/especie/ursus_arctos/), Balkan [lynx](/especie/lynx_lynx/), grey [wolf](/especie/canis_lupus/)
      and Balkan [chamois](/especie/rupicapra_rupicapra/) maintain their largest surviving national
      populations here, protected by resilient forest canopies.


      Among birds, the most exceptional record is Güldenstädt's redstart: its observation here represented the
      first confirmed sighting in the ornithology of North Macedonia. Nineteen bird species recorded in the
      park are listed in Annex I of the EU Birds Directive. In the cold, torrent-like mountain rivers live
      three native trout species—Salmo farioides, Salmo montenegrinus and Salmo dentex—all endemic to the
      western Balkans.


      The most rewarding months to visit run from June to October; during winter, visitors gather primarily
      around the Mavrovo ski resort.
    visit: >-
      The park caters to outings of all intensities. The shortest excursion leads to Šarkova Dupka Cave, right
      beside the Mavrovo ski area: reached in around ten minutes on foot via a stepped path. Duf Waterfall
      near Rostuše is reached within thirty minutes along a waymarked and fenced path winding through the
      dramatic Duf Canyon, whose rock walls soar up to 60 m high.


      For longer hikes, glacial Lake Lokuv is reached by walking eight kilometres along waymarked mountain
      paths. Another leisurely trail leads through fragrant pine woodland along a well-cleared path. From
      Lazaropole, among the highest highland villages in the country at 1,350 m, you can climb Čulovec Hill at
      1,728 m.


      The Bunec European Deer Breeding Centre encompasses a fenced reserve of 430 ha where you can observe red
      deer and fallow deer from a purpose-built wildlife photography tower. In contrast, the Korab Waterfall
      lies in one of the wildest and most remote sectors of the park, where park rangers have periodically
      assisted stranded hikers.
    history: >-
      The park was established under a 1949 law declaring the woodlands around Mavrovo Field a national park
      to preserve their exceptional scenic beauty and scientific value. It was subsequently organized into
      strict reserves, managed nature reserves and a recreational zone. This natural history exists alongside
      venerable cultural monuments: the thousand-year-old Saint John Bigorski Monastery with its intricately
      carved wooden iconostasis, and the Ottoman-era Elen Skok bridge on the road towards Mala Reka. A village
      church built in Mavrovo Field in 1857 was submerged in 1957 when the reservoir hydroelectric system was
      constructed.
    before: >-
      Park authorities strictly prohibit lighting campfires and pitching tents outside designated sites, and
      ask visitors to keep to marked mountain paths. Removing flora or natural specimens and damaging caves or
      rare minerals are strictly forbidden. Tourist numbers are moderate at the Mavrovo ski resort in winter.
      Check the park's official portal beforehand for current access conditions and local regulations.
    around: >-
      Located 20 km away lies [Shebenik-Jabllanicë National Park - Rrajcë Primeval
      Forest](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/) and 27 km away is [Šar Mountains
      National Park](/lugar/nacionalni-park-sar-planina/).
  fr:
    intro: >-
      Trois massifs montagneux se rejoignent à Mavrovo, enserrent une rivière tumultueuse qui a creusé des
      gorges s'étirant sur plus de 25 km. Ce sont les monts Šar, Korab et Bistra, encadrant le canyon de la
      Radika aux parois verticales hautes de plus de 300 m. Il s'agit du plus vaste des quatre parcs nationaux
      de Macédoine du Nord : il couvre près de 780 km² dans l'ouest du pays et tire son nom du bourg lacustre
      de Mavrovo.
    landscape: >-
      Le mont Korab culmine à 2 764 m, constituant le toit de la nation, tandis que les arêtes du Šar
      dépassent également 2 700 m d'altitude. Ce sont de fiers reliefs dentelés et enneigés surplombant de
      vastes plateaux d'estive herbeux. La topographie recèle des empreintes géologiques variées : des
      tourbières alpines héritées des glaciations dans le Šar, un karst singulier percé de grottes dans la
      Bistra et de nombreux lacs d'origine glaciaire. Parmi eux, le lac Lokuv sur le mont Deshat représente le
      lac glaciaire le plus bas de Macédoine du Nord.


      Le relief étagé modèle les paysages. Six ceintures de végétation superposées, phénomène remarquable sur
      un périmètre aussi ramassé, entretiennent 22 écosystèmes forestiers et 16 types de prairies
      montagnardes. Carrefour biogéographique soumis à d'anciennes variations climatiques, le massif abrite
      une foule d'espèces reliques et endémiques. Parmi les trésors tertiaires figurent le pin de Macédoine et
      le pin de Bosnie, conifères endémiques des Balkans centraux. De grands versants sont couverts par le
      sapin de Macédoine, essence endémique à cette région balkanique. Les pentes méridionales du mont Bistra
      conservent l'un des rares habitats spontanés du marronnier d'Inde sauvage, et une combe retirée du Šar
      occidental abrite une pessière située très au sud de l'aire normale de l'épicéa.
    wildlife: >-
      Le parc rassemble plus de 1 300 espèces de plantes herbacées et 145 essences d'arbres. La faune compte
      des ours, divers cervidés, des chèvres sauvages, des loutres et des loups. L'[ours
      brun](/especie/ursus_arctos/), le [lynx](/especie/lynx_lynx/) des Balkans, le
      [loup](/especie/canis_lupus/) et le [chamois](/especie/rupicapra_rupicapra/) des Balkans possèdent ici
      leurs effectifs les plus significatifs du pays au sein de massifs forestiers préservés.


      Côté avifaune, la mention la plus marquante concerne le rougequeue de Güldenstädt : sa découverte dans
      le parc a constitué la première mention de l'espèce en Macédoine du Nord. Dix-neuf espèces d'oiseaux
      recensées figurent à l'annexe I de la directive Oiseaux de l'Union européenne. Dans les cours d'eau
      montagnards vifs et frais vivent trois truites indigènes, Salmo farioides, Salmo montenegrinus et Salmo
      dentex, endémiques des Balkans occidentaux.


      La période la plus propice pour les randonnées court de juin à octobre ; en hiver, les visiteurs se
      concentrent autour de la station de ski de Mavrovo.
    visit: >-
      Le parc offre des itinéraires adaptés à chaque rythme. La halte la plus aisée mène à la grotte de
      Šarkova Dupka, tout près de la station de sports d'hiver : vous y accédez en dix minutes de marche par
      un sentier aménagé d'escaliers. Les cascades de Duf, proches de Rostuše, se découvrent en une demi-heure
      de marche le long d'un sentier sécurisé traversant le canyon de Duf aux falaises hautes de 60 m.


      Pour une marche plus soutenue, le lac glaciaire de Lokuv s'atteint après une randonnée de huit
      kilomètres sur sentier balisé. Un autre chemin balisé serpente à travers une agréable pinède. Depuis
      Lazaropole, l'un des plus hauts villages perchés du pays à 1 350 m, vous pouvez grimper au mont Čulovec
      à 1 728 m d'altitude.


      Le centre d'élevage de cerfs de Bunec est un enclos préservé de 430 ha où observer cerfs et daims depuis
      une tour d'affût photographique. À l'opposé, la cascade de Korab se situe dans un secteur
      particulièrement escarpé où les gardes ont parfois dû secourir des marcheurs imprudents.
    history: >-
      Le parc est né d'une loi promulguée en 1949 classant les forêts entourant la plaine de Mavrovo pour leur
      beauté pittoresque et leur grand intérêt scientifique. Il fut ensuite subdivisé en réserves intégrales,
      réserves dirigées et zone d'accueil touristique. Cette riche nature côtoie des témoins historiques
      séculaires : le monastère Saint-Jean Bigorski, vieux d'un millénaire avec son admirable iconostase
      sculptée sur bois, et le pont ottoman d'Elen Skok en direction de Mala Reka. Une église érigée dans la
      vallée en 1857 fut immergée en 1957 lors de la mise en eau du barrage hydroélectrique.
    before: >-
      La direction du parc interdit tout feu de camp ou bivouac sauvage au sein des espaces protégés,
      demandant d'emprunter exclusivement les sentiers balisés. Il est rigoureusement défendu de prélever des
      plantes sauvages, des minéraux ou de dégrader les cavités karstiques. La fréquentation est modérée dans
      la station de ski en hiver. Consultez préalablement le site officiel du parc pour vérifier l'ouverture
      des sentiers.
    around: >-
      À 20 km se situe le [parc national Shebenik-Jabllanicë - forêt primaire de
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/) et à 27 km le [parc national des
      monts Šar](/lugar/nacionalni-park-sar-planina/).
  de:
    intro: >-
      Drei mächtige Gebirge treffen in Mavrovo aufeinander und umschließen einen Fluss, der eine über 25 km
      lange Schlucht gegraben hat. Es sind die Gebirge Šar, Korab und Bistra, und die Schlucht ist der
      Radika-Canyon mit Steilwänden von über 300 m Höhe. Dies ist der größte der vier Nationalparks
      Nordmazedoniens: Er umfasst rund 780 km² im Westen des Landes und verdankt seinen Namen dem am See
      gelegenen Ort Mavrovo.
    landscape: >-
      Der Korab bildet mit 2.764 m den höchsten Gipfel des Landes, und auch der Gebirgskamm der Šar überragt
      2.700 m Höhe. Es sind schroffe, schneebedeckte Züge mit weiten Hochalmen an ihren Füßen. Das Relief
      birgt Zeugnisse unterschiedlichster erdgeschichtlicher Epochen: eiszeitliche Hochmoore in der Šar,
      seltener Höhlenkarst in der Bistra und zahlreiche Karseen in den alpinen Hochlagen. Einer von ihnen, der
      Lokuv-See im Deshat-Massiv, ist der tiefstgelegene Gletschersee Nordmazedoniens.


      Die Höhenstufung prägt die Landschaft. Sechs Höhenstufen auf engstem Raum tragen 22 Wald- und 16
      Grünlandökosysteme. Durch die Lage an einer uralten biogeographischen Schnittstelle wechselnder
      Klimaperioden gibt es viele Relikt- und Endemitenarten. Zu den tertiären Relikten gehören die
      Mazedonische Kiefer und die Schlangenhaut-Kiefer. Weite Hänge tragen Bestände der Mazedonischen Tanne,
      die nur in diesem Teil des Balkans gedeiht. An den Südhängen der Bistra überdauert eines der seltenen
      Wildvorkommen der Rosskastanie, und in einer abgelegenen Schlucht der westlichen Šar wächst ein
      Fichtenwald weit südlich seiner üblichen Verbreitungsgrenze.
    wildlife: >-
      Im Schutzgebiet leben über 1.300 Arten von Gefäßpflanzen und 145 Baumarten. Zur Tierwelt gehören
      Braunbären, Hirsche, Gämsen, Fischotter und Wölfe. Der [Braunbär](/especie/ursus_arctos/), der
      Balkan-[Luchs](/especie/lynx_lynx/), der [Wolf](/especie/canis_lupus/) und die
      Balkan-[Gämse](/especie/rupicapra_rupicapra/) besitzen hier ihre stabilsten Restbestände des Landes in
      ausgedehnten Waldmassiven.


      In der Vogelwelt ragt der Riesenrotschwanz heraus: Seine Entdeckung im Park war der Erstnachweis für
      Nordmazedoniens Ornis. Neunzehn Vogelarten stehen in Anhang I der EU-Vogelschutzrichtlinie. In den
      kalten Gebirgsflüssen schwimmen drei heimische Forellenarten—Salmo farioides, Salmo montenegrinus und
      Salmo dentex—Endemiten des westlichen Balkans.


      Die beste Wanderzeit reicht von Juni bis Oktober; im Winter verlagert sich das Besucheraufkommen auf das
      Skigebiet Mavrovo.
    visit: >-
      Der Park bietet Wanderungen für jeden Geschmack. Das kürzeste Ziel ist die Schauhöhle Šarkova Dupka nahe
      dem Wintersportort: Du erreichst sie zu Fuß in etwa zehn Minuten über angelegte Treppenwege. Die
      Duf-Wasserfälle bei Rostuše erreichst du in dreißig Minuten über einen gesicherten Steig durch die bis
      zu 60 m tiefe Schlucht.


      Für ausgedehntere Touren führt ein acht Kilometer langer markierter Bergweg zum Lokuv-Gletschersee. Ein
      weiterer aussichtsreicher Pfad verläuft durch lockere Kiefernforste. Vom Bergdorf Lazaropole auf 1.350 m
      Höhe lässt sich die Kuppe des Čulovec auf 1.728 m ersteigen.


      Das Hirschzuchtzentrum Bunec umfasst ein umzäuntes Areal von 430 ha, in dem du Rot- und Damwild von
      einem Beobachtungsturm aus beobachten kannst. Im Gegensatz dazu liegt der Korab-Wasserfall in schwer
      zugänglichem Berggelände, wo Ranger wiederholt Bergwanderern beistehen mussten.
    history: >-
      Der Nationalpark entstand durch ein Gesetz von 1949, das die Wälder um das Mavrovo-Becken wegen ihrer
      landschaftlichen Schönheit und ihres wissenschaftlichen Werts unter Schutz stellte. Später folgten
      Zonierungen in Kernzonen, Pflegezonen und Tourismusbereiche. Alte Kulturdenkmäler bereichern das Gebiet:
      das tausendjährige Kloster Sveti Jovan Bigorski mit seiner geschnitzten Ikonostase und die osmanische
      Steinbrücke Elen Skok am Weg nach Mala Reka. Eine 1857 im Tal errichtete Kirche versank 1957 im
      aufgestauten Stausee.
    before: >-
      Offenes Feuer und wildes Zelten sind im Park untersagt; bitte bleib stets auf den markierten Wegen. Das
      Sammeln von Wildpflanzen, das Beschädigen von Höhlen oder Entnehmen von Mineralien ist verboten. Das
      Besucheraufkommen im Skigebiet ist im Winter mäßig. Erkundige dich vorab auf der Website der
      Parkverwaltung über Wegesperrungen.
    around: >-
      In 20 km Entfernung liegt der [Nationalpark Shebenik-Jabllanicë - Urwald
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/) und in 27 km der [Nationalpark Šar
      Planina](/lugar/nacionalni-park-sar-planina/).
  it:
    intro: >-
      Tre catene montuose si congiungono a Mavrovo, cingendo un fiume che ha scavato una gola lunga oltre 25
      km. Sono i monti Šar, Korab e Bistra, che fanno da cornice al canyon della Radika, con pareti verticali
      che superano i 300 m d'altezza. È il maggiore dei quattro parchi nazionali della Macedonia del Nord: si
      estende per circa 780 km² nella regione occidentale, traendo il nome dal pittoresco abitato di Mavrovo
      affacciato sul lago.
    landscape: >-
      Il monte Korab tocca i 2.764 m ergendosi a tetto del paese, mentre anche le vette dello Šar oltrepassano
      quota 2.700 m. Sono creste aspre e innevate che si levano sopra estesi altipiani pascolivi. Il paesaggio
      custodisce formazioni di epoche remote: torbiere d'alta quota d'origine glaciale sullo Šar, rilievi
      carsici con grotte nella Bistra e svariati laghi glaciali nella fascia alpina. Tra questi, il lago Lokuv
      sul monte Deshat è il lago glaciale situato alla quota più bassa della Macedonia del Nord.


      La quota altimetrica è il fattore determinante. Sei fasce vegetazionali sovrapposte, fenomeno inconsueto
      in un territorio così compatto, nutrono 22 ecosistemi forestali e 16 tipologie di prateria. Crocevia
      biogeografico modellato da mutamenti climatici secolari, l'area vanta molteplici entità relitte ed
      endemiche. Tra i relitti del Terziario spiccano il pino di Macedonia e il pino loricato, conifere rare
      esclusive dei Balcani centrali. Ampi versanti sono ammantati da boschi di abete di Macedonia. Sui pendii
      meridionali del monte Bistra resiste uno dei rari popolamenti naturali di ippocastano selvatico, mentre
      in una remota forra dello Šar occidentale si conserva una pecceta situata molto più a sud del consueto
      areale della specie.
    wildlife: >-
      Nel parco vivono oltre 1.300 specie di piante erbacee e 145 specie di alberi. La fauna annovera orsi,
      diverse specie di cervidi, camosci, lontre e lupi. L'[orso bruno](/especie/ursus_arctos/), la
      [lince](/especie/lynx_lynx/) balcanica, il [lupo](/especie/canis_lupus/) e il
      [camoscio](/especie/rupicapra_rupicapra/) balcanico mantengono qui le popolazioni più numerose del paese
      tra foreste ancora integre.


      Tra i volatili spicca il codirosso di Güldenstädt: la sua osservazione nel parco ha rappresentato la
      prima segnalazione ufficiale per l'avifauna della Macedonia del Nord. Diciannove specie censite sono
      inserite nell'allegato I della Direttiva Uccelli. Nei fiumi montani, impetuosi e freddi, nuotano tre
      trote autoctone—Salmo farioides, Salmo montenegrinus e Salmo dentex—endemismi dei Balcani occidentali.


      I mesi più indicati per le escursioni vanno da giugno a ottobre; nei mesi invernali la frequentazione si
      concentra attorno agli impianti di Mavrovo.
    visit: >-
      Il parco offre itinerari adatti a ogni ritmo. L'escursione più breve conduce alla grotta Šarkova Dupka,
      adiacente al polo sciistico: si raggiunge in una decina di minuti a piedi lungo una comoda gradinata. Le
      cascate di Duf, vicino a Rostuše, si raggiungono in trenta minuti di cammino su sentiero attrezzato
      attraverso la gola di Duf, con falesie alte fino a 60 m.


      Per camminate più impegnative, il lago glaciale Lokuv si raggiunge percorrendo otto chilometri di
      sentieri segnalati. Un altro tracciato attraversa una pineta ombrosa. Da Lazaropole, tra i borghi più
      alti della nazione a 1.350 m, si può salire alla cima Čulovec a 1.728 m.


      Il centro faunistico di Bunec è un recinto tutelato di 430 ha dove osservare cervi e daini da un'altana
      fotografica. Al contrario, la cascata del Korab sorge in una forra remota dove i guardaparco sono dovuti
      intervenire per soccorrere escursionisti.
    history: >-
      Il parco è stato istituito con legge nel 1949 per tutelare i boschi attorno alla piana di Mavrovo per il
      loro pregio paesaggistico e scientifico. In seguito è stato strutturato in riserve integrali, riserve
      guidate e settori ricreativi. La natura dialoga con testimonianze storiche millenarie: il monastero di
      San Giovanni Bigorski, fondato mille anni fa e celebre per l'iconostasi lignea intagliata, e il ponte
      ottomano di Elen Skok verso Mala Reka. Una chiesa costruita nella valle nel 1857 fu sommersa nel 1957
      con l'invaso artificiale.
    before: >-
      È severamente vietato accendere fuochi e campeggiare fuori dalle aree attrezzate; muoviti unicamente
      lungo i percorsi segnati. È vietato raccogliere piante selvatiche, danneggiare cavità carsiche o
      asportare minerali. L'affluenza è media presso la stazione sciistica in inverno. Consulta il portale
      ufficiale per informazioni aggiornate sulla viabilità dei sentieri.
    around: >-
      A 20 km sorge il [Parco nazionale Shebenik-Jabllanicë - Foresta primaria di
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/) e a 27 km il [Parco nazionale dei
      monti Šar](/lugar/nacionalni-park-sar-planina/).
  pt:
    intro: >-
      Três maciços montanhosos convergem em Mavrovo, abraçando um rio que talhou um desfiladeiro com mais de
      25 km de extensão. São as serras de Šar, Korab e Bistra, emoldurando as gargantas do Radika, com
      escarpas verticais que ultrapassam os 300 m de altura. Trata-se do maior dos quatro parques nacionais da
      Macedónia do Norte: ocupa cerca de 780 km² no oeste montanhoso do país e deve o seu nome à povoação
      ribeirinha de Mavrovo.
    landscape: >-
      O monte Korab atinge os 2.764 m de altitude, sendo o cume mais elevado do país, enquanto os cumes de Šar
      também ultrapassam os 2.700 m. São cristas aguçadas e cobertas de neve que dominam amplos planaltos de
      pastagens alpinas. A geomorfologia revela vestígios de épocas contrastantes: turfeiras alpinas herdadas
      da Idade do Gelo em Šar, carste singular com grutas em Bistra e inúmeros lagos glaciares na faixa
      alpina. Entre eles, o lago Lokuv na serra de Deshat é o lago glaciar mais baixo da Macedónia do Norte.


      A variação altimétrica é determinante na paisagem. Seis andares ecológicos num espaço compacto sustentam
      22 ecossistemas de bosque e 16 comunidades de prados de montanha. Ponto de convergência biogeográfico
      marcado por antigas oscilações climáticas, o território alberga ricas comunidades relíquias e endémicas.
      Entre os elementos terciários figuram o pinheiro-da-macedónia e o pinheiro-da-bósnia, coníferas raras
      dos Balcãs centrais. Encostas extensas são cobertas por abeto-da-macedónia, árvore restrita a esta
      região balcânica. Nas vertentes meridionais de Bistra subsiste um dos escassos núcleos espontâneos de
      castanheiro-da-índia selvagem, e numa garganta remota do oeste de Šar resiste uma mata de espruces muito
      a sul do seu limite natural.
    wildlife: >-
      Mais de 1.300 espécies de plantas herbáceas e 145 espécies arbóreas vicejam no parque. A comunidade
      faunística inclui ursos, veados, camurças, lontras e lobos. O [urso-pardo](/especie/ursus_arctos/), o
      [lince](/especie/lynx_lynx/)-dos-balcãs, o [lobo](/especie/canis_lupus/) e a
      [camurça](/especie/rupicapra_rupicapra/)-dos-balcãs mantêm aqui os seus contingentes nacionais mais
      estáveis sob densos mantos florestais.


      Na avifauna salienta-se o rabirruivo-de-güldenstädt: o seu achado no parque constituiu a primeira
      citação da espécie na Macedónia do Norte. Dezanove aves inventariadas constam do anexo I da Diretiva
      Aves da União Europeia. Nos cursos de água montanhosos e gélidos habitam três trutas autóctones—Salmo
      farioides, Salmo montenegrinus e Salmo dentex—todas endémicas dos Balcãs ocidentais.


      Os meses mais favoráveis para caminhadas decorrem de junho a outubro; no inverno, a estância de esqui de
      Mavrovo concentra a afluência de visitantes.
    visit: >-
      O parque oferece passeios para todas as aptidões físicas. A caminhada mais suave conduz à gruta Šarkova
      Dupka, junto à estância de esqui: atinge-se a pé em cerca de dez minutos por um carreiro com degraus. As
      cascatas de Duf, perto de Rostuše, alcançam-se em trinta minutos de marcha por um trilho delimitado que
      atravessa o desfiladeiro de Duf, cujas fragas atingem 60 m de altura.


      Para percursos mais longos, o lago glaciar Lokuv dista oito quilómetros de marcha por caminhos de
      montanha sinalizados. Outro percurso tranquilo serpenteia por um pinhal agradável. A partir de
      Lazaropole, uma das aldeias mais elevadas do país a 1.350 m, podes subir à colina de Čulovec, a 1.728 m.


      O cercado de conservação de Bunec ocupa uma área vedada de 430 ha onde se avistam veados e gamos a
      partir de uma torre de observação fotográfica. Em contraste, a cascata de Korab ergue-se num setor
      inacessível onde os guardas florestais já tiveram de socorrer pedestrianistas.
    history: >-
      O parque foi estabelecido por diploma em 1949, que protegeu as matas do planalto de Mavrovo pelo seu
      valor cénico e científico. Mais tarde foi reordenado em reservas estritas, reservas dirigidas e zonas de
      recreio turístico. A envolvente natural dialoga com monumentos históricos veneráveis: o Mosteiro de São
      João Bigorski, erigido há mil anos com a sua famosa iconóstase em talha de madeira, e a ponte otomana de
      Elen Skok a caminho de Mala Reka. Uma igreja construída no vale em 1857 ficou submersa em 1957 aquando
      do enchimento da albufeira hidroelétrica.
    before: >-
      É expressamente proibido fazer fogueiras e acampar fora dos locais próprios; circula unicamente pelas
      rotas assinaladas. Não colhas espécimes botânicos nem danifiques grutas ou formações minerais. A
      afluência é média na estância de esqui no inverno. Informa-te previamente no portal do parque sobre
      restrições pontuais de percursos.
    around: >-
      A 20 km situa-se o [Parque Nacional Shebenik-Jabllanicë - Floresta Primária de
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/) e a 27 km o [Parque Nacional das
      Montanhas de Šar](/lugar/nacionalni-park-sar-planina/).
