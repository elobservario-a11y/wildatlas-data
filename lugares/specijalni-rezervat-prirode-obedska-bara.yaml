observaciones:
  es: >-
    La temporada va de abril a octubre. Buena parte de los senderos se puede recorrer en verano; fuera de esa
    época depende del tiempo, por lo que hay que llevar calzado adecuado a la estación.
texto:
  es:
    intro: >-
      Hace unos 6000 años, por aquí pasaba un antecesor del Sava. Hace 4500, un brazo secundario; hace 2000,
      el río abandonó su cauce y dejó un meandro muerto del que nació el pantano actual. Obedska Bara es ese
      cauce abandonado, un complejo de marisma y bosque en el sur del Srem, entre el Sava y los pueblos de
      Kupinovo, Obrež y Grabovci, a unos 40 km al oeste de Belgrado. Ocupa 9.820 hectáreas, y es sinónimo de
      aves: desde mediados del siglo XIX se la conoce en Europa como un verdadero reino de aves.
    landscape: >-
      El núcleo de la reserva lo forman el cauce llamado Potkovica (la Herradura) y la parte alta de la loma
      de Kupinovo, llamada Kopito. Cuando sube el Sava, la reserva se conecta con él por los canales Vok,
      Revenica y Vranj; cuando baja, el agua sale por el Vok. La mayoría de los meandros y charcas se secan en
      años de sequía y a finales del verano, así que el aspecto del lugar cambia con la estación y con el año.


      Obedska Bara es una de las pocas llanuras inundables que quedan, con bosques centenarios mixtos de roble
      pedunculado, fresno y olmo.
    wildlife: >-
      Las aves mandan. Hay 91 especies nidificantes y 128 de paso, invernantes o errantes, con unas 58.000
      parejas contadas. Las colonias mixtas de aves de humedal reúnen espátulas, garcetas, cigüeñas negras y
      blancas, y desde hace poco el morito y la espátula han vuelto a anidar. Entre las aves figuran la
      [espátula](/especie/platalea_leucorodia/), la [garceta común](/especie/egretta_garzetta/), la [cigüeña
      negra](/especie/ciconia_nigra/), la [cigüeña blanca](/especie/ciconia_ciconia/), el [morito
      común](/especie/plegadis_falcinellus/), el porrón pardo, el [águila
      pomerana](/especie/aquila_pomarina/), el [pigargo](/especie/haliaeetus_albicilla/), el milano negro y el
      alcotán.


      En el agua viven unas 16 especies de peces, entre las que destacan el [lucio](/especie/esox_lucius/), la
      locha, la carpa común y el carpín: la llanura inundada es su zona natural de freza. Entre los demás
      animales hay [gato montés](/especie/felis_silvestris/), [marta](/especie/martes_martes/),
      [nutria](/especie/lutra_lutra/) y varias especies de murciélagos. Entre las plantas raras figuran los
      nenúfares blanco y amarillo y la planta carnívora acuática aldrovanda, y un álamo negro está protegido
      como monumento natural.
    visit: >-
      El Centro de Información y Educación está a la salida de Obrež hacia Kupinovo, y se llega en cualquier
      vehículo de carretera. Tiene un aula educativa donde se hacen actividades y proyecciones sobre la
      reserva. Los guardas guían las visitas y presentan la riqueza vegetal y animal de Obedska Bara.


      Hay para varios días y para varias fuerzas. La torre de observación Obed está junto al centro; una
      visita corta con guía lleva a ella tras una película sobre la reserva. El sendero Lily of the Valley
      atraviesa un bosque de robles centenarios en 2 km, y el Horseshoe sigue el borde exterior de la
      Herradura entre robles viejos y álamos blancos, con una variante larga de 11 km y otra corta de 4; pasa
      por los miradores Matijevica, frente a la garcera, y Spomenik. El sendero circular de Kupinske Grede
      mide 7 km, dura unas tres horas y tiene tres refugios, mesas y bancos.


      Para las aves, hay un programa de tres horas con guía experto; se pide llevar telescopio o prismáticos y
      guías de campo. Desde el agua, un paseo en catamarán por el remanso de Krstonošić Oko incluye
      explicaciones de un guarda; y se pueden alquilar barcas de remo.


      En Kupinovo, la casa etnográfica conserva el núcleo original del pueblo, y allí se levanta la iglesia
      ortodoxa de San Lucas, que el gestor describe como la más antigua de Voivodina.
    history: >-
      En 1874 la corte austrohúngara declaró la zona coto imperial y la protegió. En 1951 se declaró reserva
      protegida y en 1993 obtuvo el estatus actual de reserva natural especial, con tres zonas de protección
      diferente. Obedska Bara figura en la lista Ramsar desde 1977 y fue declarada área importante para las
      aves en 1989.
    before: >-
      La temporada va de abril a octubre. Buena parte de los senderos se puede recorrer en verano; fuera de
      esa época depende del tiempo, por lo que hay que llevar calzado adecuado a la estación.
    around: >-
      A veintinueve kilómetros está la [Reserva Natural Especial
      Zasavica](/lugar/specijalni-rezervat-prirode-zasavica/), otro humedal serbio con castor y nutria. Más
      lejos, la [Reserva Natural del Humedal de Paúl do
      Boquilobo](/lugar/reserva-natural-do-paul-do-boquilobo/) comparte con Obedska Bara la garceta común y
      los humedales.
  en:
    intro: >-
      Some 6000 years ago, an ancestor of the Sava River flowed here. Around 4500 years ago, it was a
      secondary channel; 2000 years ago, the river shifted its course, leaving behind a severed oxbow that
      birthed the present-day wetland. Obedska Bara is that abandoned riverbed, an extensive marshland and
      floodplain forest complex in southern Srem between the Sava and the villages of Kupinovo, Obrež and
      Grabovci, about 40 km west of Belgrade. Covering 9,820 hectares, it is synonymous with birdlife: since
      the mid-nineteenth century, naturalists across Europe have celebrated it as an authentic bird kingdom.
    landscape: >-
      The reserve's core consists of the oxbow channel known as Potkovica (the Horseshoe) and the higher ridge
      of Kupinovo, known as Kopito. When the Sava rises, river water connects to the reserve through the Vok,
      Revenica and Vranj channels; when the flood recedes, water drains back through the Vok. Most oxbows and
      pools dry out during drought years and by late summer, so the landscape changes dramatically with the
      seasons and across years.


      Obedska Bara remains one of Europe's few surviving natural floodplains, sheltering ancient mixed forests
      of pedunculate oak, narrow-leaved ash and field elm.
    wildlife: >-
      Birds rule the marsh. There are 91 breeding species and 128 passage, wintering or vagrant species, with
      roughly 58,000 recorded breeding pairs. Mixed wetland colonies bring together spoonbills, egrets, black
      and white storks, and recently both the glossy ibis and spoonbill have returned to breed. Avian
      highlights include [Eurasian spoonbill](/especie/platalea_leucorodia/), [little
      egret](/especie/egretta_garzetta/), [black stork](/especie/ciconia_nigra/), [white
      stork](/especie/ciconia_ciconia/), [glossy ibis](/especie/plegadis_falcinellus/), ferruginous duck,
      [lesser spotted eagle](/especie/aquila_pomarina/), [white-tailed eagle](/especie/haliaeetus_albicilla/),
      black kite and Eurasian hobby.


      The waters sustain some 16 fish species, notably [pike](/especie/esox_lucius/), spined loach, common
      carp and Prussian carp, the inundated flood meadows serving as their natural spawning ground. Other
      wildlife includes [European wildcat](/especie/felis_silvestris/), [European pine
      marten](/especie/martes_martes/), [Eurasian otter](/especie/lutra_lutra/) and several bat species. Rare
      aquatic flora includes white and yellow water lilies and the carnivorous waterwheel plant (*Aldrovanda
      vesiculosa*), while an ancient black poplar is protected as a botanical monument.
    visit: >-
      The Information and Education Centre sits on the road leading from Obrež toward Kupinovo and is
      accessible by standard road vehicles. It features an educational hall hosting presentations and
      screenings about the reserve. Rangers lead visits and introduce the flora and fauna of Obedska Bara.


      Several days and various levels of physical fitness can be accommodated. The Obed observation tower
      stands right next to the centre; a brief guided tour reaches it following an introductory film. The Lily
      of the Valley trail traverses old-growth pedunculate oak forest over 2 km, while the Horseshoe trail
      traces the outer rim of the oxbow among ancient oaks and white poplars, offering an 11 km full loop and
      a shorter 4 km variant, stopping at the Matijevica viewpoint facing the heronry and the Spomenik
      shelter. The circular Kupinske Grede trail spans 7 km, takes about three hours and provides three
      covered rest shelters, tables and benches.


      For birdwatchers, a three-hour program led by a specialist guide is available; bring a spotting scope or
      binoculars and field identification guides. From the water, a catamaran excursion across the Krstonošić
      Oko pool includes ranger commentary, and rowing boats are available for hire.


      In Kupinovo, the ethnographic house preserves the village's original vernacular architecture, beside the
      Orthodox church of Saint Luke, celebrated locally as the oldest preserved church in Vojvodina.
    history: >-
      In 1874 the Austro-Hungarian imperial court declared the area an imperial hunting preserve and placed it
      under official protection. In 1951 it was established as a protected nature reserve, and in 1993 it
      received its current status as a special nature reserve with three distinct protection zones. Obedska
      Bara was designated a Ramsar wetland of international importance in 1977 and an Important Bird Area in
      1989.
    before: >-
      The main visiting season extends from April to October. Most trails are accessible during summer;
      outside that period trail conditions depend on recent rainfall, requiring sturdy seasonal footwear.
    around: >-
      Twenty-nine kilometres away lies the [Zasavica Special Nature
      Reserve](/lugar/specijalni-rezervat-prirode-zasavica/), another premier Serbian wetland home to beaver
      and otter. Further afield, the [Paúl do Boquilobo Nature
      Reserve](/lugar/reserva-natural-do-paul-do-boquilobo/) shares with Obedska Bara its little egret
      colonies and rich alluvial marsh habitats.
  fr:
    intro: >-
      Il y a quelque 6000 ans coulait ici un précurseur de la Save. Il y a 4500 ans, c'était un bras
      secondaire ; il y a 2000 ans, le cours d'eau délaissa son lit pour former le méandre mort qui donna
      naissance au marais actuel. Obedska Bara est cet ancien lit abandonné, un vaste ensemble marécageux et
      forestier du sud de la Syrmie, entre la Save et les villages de Kupinovo, Obrež et Grabovci, à environ
      40 km à l'ouest de Belgrade. Couvrant 9 820 hectares, le site est indissociable de l'avifaune : dès le
      milieu du XIXe siècle, les naturalistes d'Europe le saluaient comme un authentique royaume des oiseaux.
    landscape: >-
      Le cœur de la réserve se compose du lit en fer à cheval appelé Potkovica et de la crête de Kupinovo,
      appelée Kopito. Quand la Save monte, la réserve communique avec elle par les canaux Vok, Revenica et
      Vranj ; lors de la décrue, les eaux s'évacuent par le Vok. La plupart des méandres et des mares
      s'assèchent lors des étés arides, de sorte que la physionomie des lieux évolue profondément au fil des
      saisons.


      Obedska Bara forme l'une des rares plaines inondables préservées, couverte de futaies séculaires mêlant
      chêne pédonculé, frêne et orme.
    wildlife: >-
      Les oiseaux règnent en maîtres. On recense 91 espèces nicheuses et 128 migratrices, hivernantes ou de
      passage, représentant environ 58 000 couples. Les colonies mixtes de hérons rassemblent spatules,
      aigrettes, cigognes blanches et noires, et récemment l'ibis falcinelle a recommencé à nicher. Parmi les
      espèces remarquables figurent la [spatule blanche](/especie/platalea_leucorodia/), l'[aigrette
      garzette](/especie/egretta_garzetta/), la [cigogne noire](/especie/ciconia_nigra/), la [cigogne
      blanche](/especie/ciconia_ciconia/), l'[ibis falcinelle](/especie/plegadis_falcinellus/), le fuligule
      nyroca, l'[aigle pomarin](/especie/aquila_pomarina/), le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/), le milan noir et le faucon hobereau.


      Les eaux abritent quelque 16 espèces de poissons dont le [grand brochet](/especie/esox_lucius/), la
      loche, la carpe commune et le carassin, les prairies inondées constituant leur frayère naturelle. La
      faune terrestre compte le [chat sauvage](/especie/felis_silvestris/), la [martre des
      pins](/especie/martes_martes/), la [loutre d'Europe](/especie/lutra_lutra/) et diverses chauves-souris.
      La flore aquatique comprend nénuphars blancs et jaunes et l'aldrovande carnivore, tandis qu'un peuplier
      noir centenaire est protégé comme monument naturel.
    visit: >-
      Le centre d'information et d'éducation se situe à la sortie d'Obrež vers Kupinovo et s'atteint aisément
      en voiture. Il dispose d'une salle pédagogique avec projections. Les gardes animent les visites et
      présentent les écosystèmes d'Obedska Bara.


      Plusieurs itinéraires s'offrent à vous. La tour d'observation Obed jouxte le centre ; une courte visite
      guidée y mène après un film d'introduction. Le sentier Lily of the Valley traverse la chênaie séculaire
      sur 2 km, tandis que le circuit Horseshoe longe le méandre parmi chênes anciens et peupliers blancs,
      avec une variante longue de 11 km et une courte de 4 km, passant par le belvédère Matijevica face à la
      héronnière. Le sentier circulaire de Kupinske Grede parcourt 7 km en environ trois heures, pourvu de
      trois abris, tables et bancs.


      Pour les oiseaux, un programme de trois heures avec guide spécialisé est proposé ; munissez-vous de
      jumelles ou longue-vue. Sur l'eau, une promenade en catamaran sur le bras mort de Krstonošić Oko
      bénéficie des explications d'un garde, et des barques à rames se louent sur place.


      À Kupinovo, la maison ethnographique conserve le bâti traditionnel, à côté de l'église orthodoxe
      Saint-Luc, considérée comme la plus ancienne de Voïvodine.
    history: >-
      En 1874, la cour austro-hongroise déclara le domaine réserve impériale de chasse et lui accorda une
      protection précoce. En 1951, le site devint réserve naturelle protégée puis reçut en 1993 son statut
      actuel de réserve naturelle spéciale divisée en trois zones. Obedska Bara est inscrite sur la liste
      Ramsar depuis 1977 et reconnue zone importante pour la conservation des oiseaux depuis 1989.
    before: >-
      La saison de visite court d'avril à octobre. La plupart des pistes se parcourent sans peine en été ; en
      dehors de cette période, prévoyez des chaussures adaptées aux zones humides.
    around: >-
      À vingt-neuf kilomètres se trouve la [réserve naturelle spéciale de
      Zasavica](/lugar/specijalni-rezervat-prirode-zasavica/), un autre grand marais serbe à castor et loutre.
      Plus loin, la [réserve naturelle du marais de Paul do
      Boquilobo](/lugar/reserva-natural-do-paul-do-boquilobo/) partage avec Obedska Bara ses colonies
      d'aigrettes et ses zones humides alluviales.
  de:
    intro: >-
      Vor rund 6000 Jahren floss hier ein Urstrom der Save. Vor 4500 Jahren ein Nebenarm; vor 2000 Jahren
      verließ der Fluss sein Bett und hinterließ einen abgeschnürten Altarm, aus dem das heutige Feuchtgebiet
      hervorging. Obedska Bara ist dieses verlassene Flussbett, ein Mosaik aus Sümpfen und Auenwäldern im
      Süden der Region Srem zwischen der Save und den Dörfern Kupinovo, Obrež und Grabovci, etwa 40 km
      westlich von Belgrad. Es umfasst 9.820 Hektar und steht ganz im Zeichen der Vogelwelt: Seit Mitte des
      neunzehnten Jahrhunderts gilt das Gebiet in Europa als legendäres Vogelreich.
    landscape: >-
      Den Kern des Schutzgebiets bilden der hufeisenförmige Altarm Potkovica und der Höhenrücken Kupinovo,
      genannt Kopito. Steigt die Save an, füllt sich die Flussaue über die Kanäle Vok, Revenica und Vranj; bei
      fallendem Pegel fließt das Wasser über den Vok ab. In Trockenjahren und im Spätsommer trocknen die
      meisten Flachgewässer aus, sodass sich das Landschaftsbild mit den Jahreszeiten wandelt.


      Obedska Bara zählt zu den wenigen verbliebenen intakten Flussauen mit jahrhundertealten
      Eichenmischwäldern aus Stieleichen, Eschen und Ulmen.
    wildlife: >-
      Hier regieren die Vögel. Man zählt 91 Brutvogelarten und 128 Rast-, Durchzugs- und Wintergäste mit rund
      58.000 Brutpaaren. In den gemischten Kolonien brüten Löffler, Reiher sowie Schwarz- und Weißstörche, und
      in jüngster Zeit sind auch Brauner Sichler und Löffler zurückgekehrt. Zu den Vögeln gehören
      [Löffler](/especie/platalea_leucorodia/), [Seidenreiher](/especie/egretta_garzetta/),
      [Schwarzstorch](/especie/ciconia_nigra/), [Weißstorch](/especie/ciconia_ciconia/), [Brauner
      Sichler](/especie/plegadis_falcinellus/), Moorente, [Schreiadler](/especie/aquila_pomarina/),
      [Seeadler](/especie/haliaeetus_albicilla/), Schwarzmilan und Baumfalke.


      Im Wasser leben rund 16 Fischarten, darunter [Hecht](/especie/esox_lucius/), Schlammpeitzger, Karpfen
      und Giebel; die Überschwemmungswiesen dienen als Laichgebiet. An Säugetieren kommen
      [Wildkatze](/especie/felis_silvestris/), [Baummarder](/especie/martes_martes/), [Eurasischer
      Fischotter](/especie/lutra_lutra/) und Fledermausarten vor. Unter den seltenen Wasserpflanzen wachsen
      Weiße und Gelbe Seerose sowie die fleischfressende Wasserfalle, während eine alte Schwarz-Pappel als
      Naturdenkmal geschützt ist.
    visit: >-
      Das Informations- und Bildungszentrum liegt am Ortsausgang von Obrež in Richtung Kupinovo und ist mit
      jedem Straßenfahrzeug erreichbar. Ein Schulungsraum bietet Platz für Vorträge und Filmvorführungen. Die
      Ranger führen Besucher durch das Reservat und erläutern die biologische Vielfalt.


      Es gibt Touren für mehrere Tage und unterschiedliche Kondition. Der Aussichtsturm Obed steht direkt beim
      Zentrum; eine kurze Führung leitet nach einer Filmeinführung dorthin. Der Wanderweg Lily of the Valley
      führt über 2 km durch alte Eichenbestände, während der Horseshoe-Weg dem Bogen des Hufeisens folgt, mit
      einer langen Schleife von 11 km und einer kurzen von 4 km, vorbei an den Aussichtspunkten Matijevica
      gegenüber der Reiherkolonie und Spomenik. Der Rundweg Kupinske Grede misst 7 km, beansprucht rund drei
      Stunden und bietet drei Schutzhütten, Tische und Bänke.


      Für Vogelbeobachter gibt es dreistündige Spezialführungen; Spektiv oder Fernglas und Bestimmungsbuch
      mitbringen. Vom Wasser aus bietet eine Katamaranfahrt auf dem Krstonošić-Oko-Altarm Erläuterungen der
      Ranger; auch Ruderboote können gemietet werden.


      In Kupinovo bewahrt das Dorfmuseum alte Gehöfte, neben der orthodoxen Lukaskirche, die als älteste
      Kirche der Vojvodina gilt.
    history: >-
      Im Jahr 1874 erklärte der habsburgische Hof das Areal zum kaiserlichen Jagdrevier und stellte es
      frühzeitig unter Schutz. 1951 folgte die Ausweisung als Naturschutzgebiet und 1993 der heutige Status
      als Sondernaturschutzgebiet mit drei Schutzzonen. Obedska Bara ist seit 1977 Ramsar-Gebiet und seit 1989
      als Important Bird Area registriert.
    before: >-
      Die Saison reicht von April bis Oktober. Im Sommer sind die Wege gut begehbar; außerhalb dieser Monate
      hängt der Zustand vom Niederschlag ab, festes Schuhwerk ist ratsam.
    around: >-
      Neunundzwanzig Kilometer entfernt liegt das [Sondernaturschutzgebiet
      Zasavica](/lugar/specijalni-rezervat-prirode-zasavica/), ein weiteres serbisches Feuchtgebiet mit Biber
      und Fischotter. Weiter entfernt teilt das [Naturschutzgebiet Paúl do
      Boquilobo](/lugar/reserva-natural-do-paul-do-boquilobo/) mit Obedska Bara den Seidenreiher und
      artenreiche Auenlebensräume.
  it:
    intro: >-
      Circa 6000 anni fa scorreva qui un progenitore della Sava. Circa 4500 anni fa vi passava un ramo
      secondario; 2000 anni fa il fiume abbandonò il proprio alveo lasciando un meandro morto da cui nacque
      l'attuale palude. Obedska Bara è quel letto fluviale abbandonato, un complesso di acquitrini e foreste
      alluvionali nel sud dello Srem tra la Sava e i villaggi di Kupinovo, Obrež e Grabovci, a circa 40 km a
      ovest di Belgrado. Si estende per 9.820 ettari ed è sinonimo di uccelli: da metà Ottocento è celebrata
      in tutta Europa come un vero regno dell'avifauna.
    landscape: >-
      Il cuore della riserva è formato dall'antico meandro Potkovica (il Ferro di cavallo) e dal rilievo di
      Kupinovo, detto Kopito. Quando la Sava è in piena si collega all'area attraverso i canali Vok, Revenica
      e Vranj; durante la magra l'acqua defluisce tramite il Vok. La gran parte dei canali e degli stagni si
      prosciuga negli anni siccitosi e a fine estate, mutando l'aspetto del paesaggio a ogni stagione.


      Obedska Bara è una delle poche pianure alluvionali intatte rimaste, coperta da querco-frassineti
      secolari di farnia, frassino e olmo.
    wildlife: >-
      Qui comandano gli uccelli. Si contano 91 specie nidificanti e 128 migratrici, svernanti o di passo, per
      un totale di circa 58.000 coppie censite. Le colonie miste riuniscono spatole, garzette, cicogne bianche
      e nere, e di recente mignattaio e spatola sono tornati a nidificare. Tra i volatili figurano
      [spatola](/especie/platalea_leucorodia/), [garzetta](/especie/egretta_garzetta/), [cicogna
      nera](/especie/ciconia_nigra/), [cicogna bianca](/especie/ciconia_ciconia/),
      [mignattaio](/especie/plegadis_falcinellus/), moretta tabaccata, [*Aquila
      pomarina*](/especie/aquila_pomarina/), [aquila di mare](/especie/haliaeetus_albicilla/), nibbio bruno e
      lodolaio.


      Nelle acque vivono circa 16 specie di pesci, tra cui spiccano [luccio](/especie/esox_lucius/), cobite,
      carpa comune e carassio, per i quali la golena inondata costituisce l'area riproduttiva naturale. Tra
      gli altri animali si incontrano [gatto selvatico](/especie/felis_silvestris/),
      [martora](/especie/martes_martes/), [lontra europea](/especie/lutra_lutra/) e vari chirotteri. Tra la
      flora spiccano ninfee bianche e gialle e l'aldrovanda carnivora, mentre un pioppo nero secolare è
      tutelato come monumento naturale.
    visit: >-
      Il Centro visite ed educazione sorge all'uscita di Obrež verso Kupinovo ed è raggiungibile con qualunque
      veicolo. Comprende un'aula didattica con proiezioni. I guardaparco guidano le visite e illustrano flora
      e fauna di Obedska Bara.


      Ci sono itinerari per più giornate e livelli di allenamento. La torre d'avvistamento Obed sorge accanto
      al centro; una breve visita guidata vi conduce dopo un video introduttivo. Il sentiero Lily of the
      Valley attraversa la farniaia secolare per 2 km, mentre l'Horseshoe costeggia l'esterno del Ferro di
      cavallo tra querce vecchie e pioppi bianchi, con un anello lungo di 11 km e uno breve di 4 km, toccando
      i punti panoramici Matijevica di fronte alla garzaia e Spomenik. Il circuito Kupinske Grede misura 7 km,
      richiede circa tre ore ed è attrezzato con tre capanni di sosta, tavoli e panche.


      Per il birdwatching è attivo un programma di tre ore con guida esperta; porta binocolo o cannocchiale e
      guida di campo. Sull'acqua, un'escursione in catamarano sullo specchio d'acqua Krstonošić Oko include la
      spiegazione dei guardiaparco; si noleggiano anche barche a remi.


      A Kupinovo la casa etnografica conserva le testimonianze del borgo rurale, accanto alla chiesa ortodossa
      di San Luca, considerata la più antica della Voivodina.
    history: >-
      Nel 1874 la corte austro-ungarica dichiarò l'area riserva imperiale di caccia e la sottopose a tutela.
      Nel 1951 fu proclamata riserva naturale e nel 1993 ottenne l'attuale status di riserva naturale speciale
      articolata in tre zone di protezione. Obedska Bara è sito Ramsar dal 1977 e Important Bird Area dal
      1989.
    before: >-
      La stagione ideale va da aprile a ottobre. La gran parte dei sentieri è facilmente percorribile
      d'estate; nelle altre stagioni dipende dal fango, porta calzature adeguate.
    around: >-
      A ventinove chilometri si trova la [Riserva naturale speciale di
      Zasavica](/lugar/specijalni-rezervat-prirode-zasavica/), altro celebre bacino umido serbo con castoro e
      lontra. Più lontana, la [Riserva naturale della palude di Paúl do
      Boquilobo](/lugar/reserva-natural-do-paul-do-boquilobo/) condivide con Obedska Bara la presenza della
      garzetta e l'ambiente palustre.
  pt:
    intro: >-
      Há cerca de 6000 anos corria por aqui um predecessor do rio Sava. Há 4500 anos era um braço secundário;
      há 2000 anos o rio abandonou o leito e deixou um meandro morto de onde brotou o pântano atual. Obedska
      Bara é esse antigo leito fluvial abandonado, um vasto complexo de sapais e matas aluviais no sul do Srem
      entre o Sava e as aldeias de Kupinovo, Obrež e Grabovci, a cerca de 40 km a oeste de Belgrado. Abrange
      9.820 hectares e é sinónimo de aves: desde meados do século XIX é aclamada na Europa como um verdadeiro
      reino das aves.
    landscape: >-
      O núcleo da reserva compõe-se do meandro em ferradura chamado Potkovica e da colina de Kupinovo, chamada
      Kopito. Quando o Sava enche, liga-se à reserva através dos canais Vok, Revenica e Vranj; na vazante a
      água escoa pelo Vok. A maioria dos meandros e lagoas seca em anos de estiagem e no final do verão,
      mudando o cenário ao ritmo das estações.


      Obedska Bara preserva uma das raras planícies de inundação naturais do continente, com carvalhais
      centenários de carvalho-alvarinho, freixo e olmo.
    wildlife: >-
      Aqui reinam as aves. Registam-se 91 espécies nidificantes e 128 migradoras, invernantes ou de passagem,
      totalizando cerca de 58.000 casais contabilizados. As colónias mistas reúnem colhereiros, garças,
      cegonhas-pretas e brancas, e recentemente o íbis-preto regressou à nidificação. Destacam-se o
      [colhereiro-europeu](/especie/platalea_leucorodia/), a [garcinha-branca](/especie/egretta_garzetta/), a
      [cegonha-preta](/especie/ciconia_nigra/), a [cegonha-branca](/especie/ciconia_ciconia/), o
      [íbis-preto](/especie/plegadis_falcinellus/), o zarro-castanho, a [*Aquila
      pomarina*](/especie/aquila_pomarina/), a [águia-rabalva](/especie/haliaeetus_albicilla/), o
      milhafre-preto e o órbio.


      Nas águas vivem cerca de 16 espécies de peixes com destaque para o [lúcio](/especie/esox_lucius/), a
      cadoz-de-espinho, a carpa e o pimpão, servindo a várzea inundada de maternidade fluvial. Entre outros
      mamíferos contam-se o [gato-bravo](/especie/felis_silvestris/), a [marta do pinheiro
      europeia](/especie/martes_martes/), a [lontra-europeia](/especie/lutra_lutra/) e morcegos. Entre a flora
      rara contam-se nenúfares brancos e amarelos e a aldrovanda carnívora, estando um álamo-negro
      classificado como monumento natural.
    visit: >-
      O Centro de Informação e Educação situa-se à saída de Obrež rumo a Kupinovo e tem acesso por estrada.
      Conta com sala pedagógica e projeções. Os vigilantes orientam as visitas e apresentam os valores
      naturais de Obedska Bara.


      Há opções para vários dias e níveis de forma física. A torre de observação Obed fica junto ao centro;
      uma visita guiada curta conduz até ela após o filme introdutório. O trilho Lily of the Valley percorre a
      mata de carvalhos ao longo de 2 km, enquanto o Horseshoe contorna a Ferradura entre carvalhos vetustos e
      choupos-brancos, com variante longa de 11 km e curta de 4 km, passando pelos miradouros Matijevica
      frente à garceira e Spomenik. O trilho circular de Kupinske Grede tem 7 km, dura cerca de três horas e
      dispõe de três abrigos, mesas e bancos.


      Para observação de aves há um programa de três horas com guia especialista; traz binóculo ou telescópio
      e guia de identificação. Na água, um passeio de catamarã pelo esteiro de Krstonošić Oko inclui
      explicações de vigilante; alugam-se também barcos a remos.


      Em Kupinovo, a casa etnográfica preserva a traça aldeã, erguendo-se ao lado a igreja ortodoxa de São
      Lucas, tida como a mais antiga da Vojvodina.
    history: >-
      Em 1874 a corte austro-húngara declarou o local coutada imperial e conferiu-lhe proteção oficial. Em
      1951 foi classificado como reserva natural e em 1993 obteve o estatuto atual de reserva natural especial
      com três zonas de proteção. Obedska Bara integra a lista Ramsar desde 1977 e foi reconhecida como área
      importante para as aves em 1989.
    before: >-
      A época recomendada estende-se de abril a outubro. Grande parte dos percursos faz-se bem no verão; fora
      daí o terreno depende das chuvas, exige calçado apropriado à lama.
    around: >-
      A vinte e nove quilómetros fica a [Reserva Natural Especial de
      Zasavica](/lugar/specijalni-rezervat-prirode-zasavica/), outro grande paul sérvio com lontra e castor.
      Mais longe, a [Reserva Natural do Paul do Boquilobo](/lugar/reserva-natural-do-paul-do-boquilobo/)
      partilha com Obedska Bara a garcinha-branca e os habitats de sapal.
