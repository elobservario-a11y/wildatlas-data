resumen:
  es: Conjunto de 15 turberas elevadas rehumedecidas en la llanura del noroeste de Alemania.
  en: A mosaic of 15 re-wetted raised bogs across the low-lying plains of northwestern Germany.
  fr: Ensemble de 15 tourbières hautes réhumidifiées au cœur des plaines du nord-ouest de l’Allemagne.
  de: Verbund aus 15 wiedervernässten Hochmooren im nordwestdeutschen Tiefland.
  it: Mosaico di 15 torbiere alte riallagate nel bassopiano della Germania nord-occidentale.
  pt: Conjunto de 15 turfeiras altas recuperadas na planície do noroeste da Alemanha.
unico:
  es: >-
    Un tablero de turberas rehumedecidas donde las grullas duermen con los pies en el agua y comen en los
    campos de al lado.
  en: >-
    A patchwork of re-wetted raised bogs where cranes sleep with their feet in shallow waters and forage in
    adjacent stubble fields.
  fr: >-
    Un damier de tourbières réhumidifiées où les grues dorment les pattes dans l’eau et se nourrissent dans
    les champs de maïs voisins.
  de: >-
    Ein Mosaik wiedervernässter Hochmoore, wo Kraniche mit den Füßen im Wasser schlafen und auf benachbarten
    Feldern äsen.
  it: >-
    Una scacchiera di torbiere risanate dove le gru dormono con le zampe nell’acqua e si nutrono nei campi di
    mais adiacenti.
  pt: >-
    Um tabuleiro de turfeiras renaturalizadas onde os grous pernoitam com as patas na água e forrageiam nos
    campos agrícolas vizinhos.
observaciones:
  es: >-
    La grulla es esquiva, sobre todo en la cría. Observa desde las torres y los puestos, sin acercarte a los
    dormideros, y quédate en los caminos. Si ves una grulla anillada, puedes comunicarla en línea. La mejor
    época para ver la llegada de las grullas va de octubre a noviembre.
texto:
  es:
    intro: >-
      Al caer la tarde de octubre, las grullas vuelan hacia la turbera en bandadas y se dejan caer en el agua
      poco profunda para pasar la noche. Es el espectáculo de Diepholz: una depresión de turberas altas, en el
      noroeste de Alemania, que se ha convertido en una de las grandes paradas de la grulla común en su
      migración.


      Lo que hoy es refugio fue, durante décadas, turbera drenada y explotada. Desde los años setenta se
      rehumedecen las turberas altas, y la grulla, que estuvo en retroceso por la destrucción de sus hábitats,
      ha vuelto: primero a descansar, y desde 2001 también a criar.
    landscape: >-
      Diepholz es una depresión llana de arena de valle en el borde sur de la llanura del norte de Alemania,
      con pocas crestas de geest apenas elevadas, entre las ciudades de Bremen, Osnabrück y Hannover. Reúne
      unas 24.000 hectáreas de turberas repartidas en 15 turberas altas, y el lago Dümmer y su depresión en el
      suroeste. La región natural abarca unas 105.000 hectáreas, con muchas reservas y paisajes protegidos de
      distinto tamaño.


      La turba la ha marcado. El paisaje está formado por décadas de extracción, y parte de las turberas se
      sigue explotando de forma industrial. En Alemania las turberas se cuentan entre los hábitats más
      escasos, porque el 95 % se drenó, se extrajo, se edificó o se dedicó a la agricultura o a la
      silvicultura. Por eso Diepholz, una de las turberas altas mejor conservadas y renaturalizadas de Baja
      Sajonia, tiene un valor especial: el BUND, que la gestiona como estación ecológica por encargo de la
      administración, cuida 170 kilómetros cuadrados de turberas, prados húmedos y brezales arenosos
      protegidos.
    wildlife: >-
      El año de la [grulla común](/especie/grus_grus/) tiene dos tiempos. En primavera las grullas pasan
      deprisa hacia el norte; en otoño se quedan. A finales de septiembre las parejas locales, con sus crías y
      los jóvenes sin pareja, se reúnen en dormideros colectivos, y pronto llegan las del norte y el este. La
      mayoría llega en el paso de otoño; en primavera las cifras de descanso son mucho menores. En total,
      decenas de miles de grullas paran en esta turbera cada primavera y cada otoño.


      El escenario es siempre el mismo. De noche, las grullas duermen en las turberas rehumedecidas, en aguas
      someras y a salvo de depredadores. De día se reparten por los campos y buscan comida, sobre todo en los
      maizales ya cosechados. Las grullas que pasan por aquí descansan o invernan después en lugares como el
      lago Der-Chantecoq y Arjuzanx, en Francia, o Extremadura, en España.


      Desde 2001 también crían. Eligen islas de césped flotante, turba desnuda con hierba o antiguos prados
      húmedos con juncos, dentro del agua. Las hembras empiezan a poner huevos a partir del 10 de marzo, en un
      nido de aproximadamente 1 metro de diámetro y 20 centímetros de altura. El cortejo incluye saltos,
      aleteos y fuertes dúos de llamadas, y durante la cría las grullas son especialmente esquivas.


      Otras aves de la región son el [aguilucho cenizo](/especie/circus_pygargus/), el [aguilucho
      pálido](/especie/circus_cyaneus/), el [zarapito real](/especie/numenius_arquata/) y el [chorlito dorado
      europeo](/especie/pluvialis_apricaria/), además del alcaudón real y el búho campestre, para los que esta
      es la principal zona de cría del interior de Baja Sajonia. También hay chotacabras europeo, cerceta
      común, alcotán, agachadiza común, archibebe común y tarabilla común. Entre los reptiles, el BUND protege
      a la culebra lisa europea.
    visit: >-
      La mejor hora es el atardecer, cuando las grullas vuelan hacia sus dormideros. Lo mejor es verlo desde
      las torres de observación del Rehdener Geestmoor y del Neustädter Moor. Un puesto móvil del BUND se
      sitúa junto a la carretera entre Ströhen y Holzhausen, poco después del puente sobre Langer Graben.


      Para entender la turbera hay centros: el Centro Europeo de Turberas y Clima de Ströhen, que se abrió en
      octubre de 2014 con el centro de visitantes Moorwelten; el NIZ de Goldenstedt y la «Puerta a la turbera»
      de Essern. Y hay otra forma de recorrerla: en cuatro puntos, Essern, Ströhen, Freistatt y Goldenstedt,
      salen viajes programados en ferrocarril de campo por la turbera.
    history: >-
      La protección empezó con un grupo de naturalistas que fundó el grupo de fauna de turberas (FAM) para
      salvar las turberas altas que quedaban; el BUND asumió después su trabajo. Lo que ha hecho posible el
      regreso de las grullas es doble: la calidad de los sitios restaurados y la protección frente a molestias
      mediante la ordenación de visitantes. El BUND realiza recuentos regulares desde el año 2000, y las
      grullas anilladas permiten reconstruir sus desplazamientos.


      Quienes quieran ayudar pueden participar en las jornadas de voluntariado de cuidado de turberas: con
      tijeras, desbrozadoras y motosierras, se quita la maleza de las turberas para recuperar su carácter
      abierto.
    before: >-
      La grulla es esquiva, sobre todo en la cría. Observa desde las torres y los puestos, sin acercarte a los
      dormideros, y quédate en los caminos. Si ves una grulla anillada, puedes comunicarla en línea. La mejor
      época para ver la llegada de las grullas va de octubre a noviembre.
    around: >-
      A siete kilómetros están los [Humedales del Lago Dümmer](/lugar/dummer-wetlands/), dentro de la misma
      región natural. Más lejos, otros humedales comparten con Diepholz la grulla común: las [Reservas de
      Deurnsche Peel y Mariapeel](/lugar/deurnsche-peel---mariapeel/), la [Reserva Natural de
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) y los [Humedales de
      Rhinluch](/lugar/rhinluch-wetlands/).
  en:
    intro: >-
      As dusk settles on an October evening, cranes sweep into the bog in long calling skeins, alighting
      softly in shallow waters to roost for the night. This is the hallmark spectacle of Diepholz: a low-lying
      basin of raised bogs in northwestern Germany that has grown into one of Europe’s premier migratory
      staging posts for the common crane.


      What serves as a vibrant sanctuary today was for decades a drained and industrially extracted peatland.
      Since the seventies, targeted re-wetting programmes have revived the bogs; the crane, previously driven
      to local collapse through habitat loss, has staged a spectacular comeback: first using the waters as a
      safe rest stop, and since 2001 returning to breed.
    landscape: >-
      Diepholz forms a broad sand depression on the southern rim of the North German Plain, punctuated by low
      sandy geest ridges between Bremen, Osnabrück, and Hanover. It encompasses some 24,000 hectares of
      peatlands distributed across 15 raised bogs, anchored in the southwest by Lake Dümmer and its low-lying
      basin. The greater natural landscape spans roughly 105,000 hectares, dotted with numerous nature
      reserves and protected areas.


      Peat extraction has shaped every corner of this land. Decades of cutting have left their mark, and
      commercial milling still continues on specific concessions. In Germany, raised bogs rank among the most
      critically depleted ecosystems, 95% having been drained, cut over, built on, or converted to farmland
      and pine plantations. This makes Diepholz one of Lower Saxony’s finest preserved and restored raised bog
      complexes: BUND, managing the region as an ecological field station on behalf of public authorities,
      oversees 170 square kilometres of protected bogs, wet meadows, and sandy heaths.
    wildlife: >-
      The annual cycle of the [common crane](/especie/grus_grus/) unfolds in two distinct acts. In spring,
      migrant skeins push swiftly northwards; in autumn, they linger. By late September, resident breeding
      pairs, fledged chicks, and non-breeding immatures congregate at communal roosts, soon joined by tens of
      thousands arriving from Scandinavia and eastern Europe. Autumn migration brings peak numbers, whereas
      spring passage is swifter and less concentrated. In all, tens of thousands of cranes halt in these bogs
      each migration season.


      The daily rhythm remains constant. By night, cranes roost in shallow, re-flooded peat cuttings, safe
      from ground predators. By day, they disperse across surrounding agricultural fields to forage, gorging
      on harvested maize stubble. Cranes resting here subsequently continue along their flyway to wintering
      grounds at Lac du Der-Chantecoq and Arjuzanx in France, or Extremadura in Spain.


      Since 2001, cranes have also resumed nesting here. They build nests on floating peat mats, bare tussocky
      peat, or sedge marshes surrounded by water. Females begin laying around 10 March in a mound nest
      measuring about 1 metre across and 20 centimetres high. Courtship displays feature energetic leaps, wing
      flares, and loud unison duets, followed by secretive nesting behaviour.


      Other notable regional birds include [Montagu's harrier](/especie/circus_pygargus/), [hen
      harrier](/especie/circus_cyaneus/), [Eurasian curlew](/especie/numenius_arquata/), and [European golden
      plover](/especie/pluvialis_apricaria/), alongside great grey shrike and short-eared owl, for which this
      is the primary inland breeding haven in Lower Saxony. European nightjar, Eurasian teal, Eurasian hobby,
      common snipe, common redshank, and European stonechat also thrive. Among reptiles, BUND safeguards
      vulnerable smooth snakes.
    visit: >-
      The prime time to visit is sunset, when vast skeins of cranes drop into their roosting waters. The best
      vantage points are the observation towers at Rehdener Geestmoor and Neustädter Moor. A mobile
      information post run by BUND operates beside the road between Ströhen and Holzhausen, just past the
      bridge over Langer Graben.


      Several dedicated visitor centres help unpack the bog ecosystem: the European Peat and Climate Centre in
      Ströhen, opened in October 2014 alongside the Moorwelten interactive exhibition; the NIZ centre in
      Goldenstedt; and the «Gateway to the Bog» in Essern. Additionally, historic narrow-gauge peat railways
      run scheduled passenger excursions across the bog from four stations: Essern, Ströhen, Freistatt, and
      Goldenstedt.
    history: >-
      Conservation began when dedicated naturalists founded the Bog Fauna Working Group (FAM) to rescue
      surviving raised bogs; BUND later took over management. The cranes’ return stems from two factors:
      high-calibre wetland restoration and visitor management preventing disturbance at roosts. BUND has
      coordinated systematic roost counts since 2000, while colour-ringed birds allow researchers to track
      flyway movements.


      Volunteers can participate in seasonal bog-care work parties: wielding loppers, brush-cutters, and
      chainsaws, teams remove invasive birch and pine scrub to safeguard open bog expanses.
    before: >-
      Cranes are easily disturbed, especially during the nesting period. Observe them strictly from designated
      towers and hides without approaching roost pools, and stay on marked trails. If you spot a ringed crane,
      reports can be submitted online. The best window for autumn migration is October to November.
    around: >-
      Seven kilometres away lie the [Dümmer Wetlands](/lugar/dummer-wetlands/) within the same natural
      landscape. Further afield, other major wetlands sharing the common crane include the [Deurnsche Peel and
      Mariapeel Reserves](/lugar/deurnsche-peel---mariapeel/), [Fochteloërveen Nature
      Reserve](/lugar/fochteloorveen---natuurreservaat/), and the [Rhinluch
      Wetlands](/lugar/rhinluch-wetlands/).
  fr:
    intro: >-
      À la tombée d’un soir d’octobre, les grues gagnent la tourbière en longs vols et descendent se poser
      dans l’eau peu profonde pour passer la nuit. C’est le spectacle emblématique de Diepholz : une
      dépression de tourbières hautes du nord-ouest de l’Allemagne devenue l’une des plus formidables haltes
      migratoires de la grue cendrée en Europe.


      Ce sanctuaire d’aujourd’hui fut pendant des décennies une tourbière drainée et exploitée
      industriellement. Dès les années soixante-dix, des programmes de remise en eau ont ressuscité les
      tourbières hautes, et la grue, jadis chassée par la destruction de ses milieux, est revenue : d’abord en
      halte automnale, puis dès 2001 pour y nicher.
    landscape: >-
      Diepholz forme une cuvette sableuse sur la bordure méridionale de la plaine d’Allemagne du Nord, marquée
      de discrètes crêtes de geest sableux entre Brême, Osnabrück et Hanovre. Elle concentre environ 24 000
      hectares de tourbières répartis en 15 tourbières hautes, adossées au lac Dümmer et à sa dépression au
      sud-ouest. L’ensemble de la région naturelle englobe quelque 105 000 hectares ponctués de nombreuses
      réserves.


      L’extraction de la tourbe a profondément marqué les lieux. Des décennies d’exploitation mécanique ont
      modelé le relief, et certaines concessions demeurent exploitées industriellement. En Allemagne, les
      tourbières hautes comptent parmi les écosystèmes les plus raréfiés, 95 % ayant été drainées, exploitées,
      urbanisées ou livrées à l’agriculture et à la sylviculture. C’est pourquoi Diepholz, l’un des complexes
      les mieux préservés et restaurés de Basse-Saxe, revêt une valeur inestimable : l’association BUND y gère
      170 kilomètres carrés de tourbières, prés humides et landes sableuses protégées.
    wildlife: >-
      Le cycle annuel de la [grue cendrée](/especie/grus_grus/) s’articule en deux temps. Au printemps, les
      voiliers montent rapidement vers le nord ; en automne, ils s’attardent de longues semaines. Fin
      septembre, les couples locaux et leurs jeunes se rassemblent aux dortoirs, rejoints par les cohortes de
      Scandinavie et d’Europe orientale. Le passage automnal concentre l’essentiel des effectifs, bien plus
      massif qu’au printemps. Au total, des dizaines de milliers de grues font escale dans la tourbière chaque
      saison migratoire.


      Le rituel quotidien est immuable. La nuit, les grues dorment dans les zones réhumidifiées, à l’abri des
      prédateurs terrestres. De jour, elles gagnent les plaines agricoles périphériques pour glaner les restes
      de maïs après récolte. Les grues transitant par Diepholz poursuivent ensuite leur route vers le lac du
      Der-Chantecoq ou Arjuzanx en France, puis l’Estrémadure en Espagne.


      Depuis 2001, elles y nichent à nouveau. Elles installent leur nid sur des îlots de tourbe flottante ou
      des prairies à joncs inondées. La ponte débute dès le 10 mars au creux d’un monticule d’environ 1 mètre
      de diamètre et 20 centimètres de haut. Les parades associent sauts, battements d’ailes et sonores duos
      en trompette, avant une couvaison d’une extrême discrétion.


      Parmi les autres oiseaux nicheurs figurent le [busard cendré](/especie/circus_pygargus/), le [busard
      Saint-Martin](/especie/circus_cyaneus/), le [courlis cendré](/especie/numenius_arquata/) et le [pluvier
      doré](/especie/pluvialis_apricaria/), sans oublier la pie-grièche grise et le hibou des marais, dont
      c’est le bastion régional. L’engoulevent d’Europe, la sarcelle d’hiver, le faucon hobereau, la bécassine
      des marais, le chevalier gambette et le tarier pâtre animent également les lieux, tandis que la
      coronelle lisse y est protégée.
    visit: >-
      Le moment privilégié est le crépuscule, quand les vols de grues regagnent leurs dortoirs aquatiques. Les
      observatoires du Rehdener Geestmoor et du Neustädter Moor offrent des panoramas parfaits. Un stand
      d’information mobile du BUND s’installe en bordure de la route reliant Ströhen à Holzhausen, juste après
      le pont sur le Langer Graben.


      Plusieurs centres pédagogiques éclairent le fonctionnement de la tourbière : le Centre européen de la
      tourbe et du climat de Ströhen, ouvert en octobre 2014 avec l’espace interactif Moorwelten ; le centre
      NIZ de Goldenstedt et la « Porte de la tourbière » à Essern. Il est également possible d’embarquer à
      bord des petits trains de tourbière à voie étroite depuis quatre gares : Essern, Ströhen, Freistatt et
      Goldenstedt.
    history: >-
      La préservation débuta grâce à des naturalistes passionnés qui fondèrent le groupe faune des tourbières
      (FAM) pour sauver les reliques intactes ; le BUND a ensuite pris le relais. Ce succès repose sur la
      qualité des chantiers de réhumidification et la canalisation des visiteurs. Le BUND réalise des
      comptages coordonnés depuis l’an 2000, et le baguage des grues permet de reconstituer leurs trajectoires
      migratoires.


      Des chantiers bénévoles de débroussaillement sont organisés en saison : armés de cisailles et
      tronçonneuses, les volontaires éliminent bouleaux et pins pour maintenir les landes tourbeuses ouvertes.
    before: >-
      La grue cendrée est un oiseau très farouche, particulièrement en période de reproduction. Restez sur les
      sentiers balisés et observez depuis les tours sans vous approcher des dortoirs. Les bagues lues peuvent
      être signalées en ligne. La meilleure période pour assister aux grands rassemblements s’étend d’octobre
      à novembre.
    around: >-
      À sept kilomètres s’étendent les [Zones humides du lac Dümmer](/lugar/dummer-wetlands/), dans la même
      région naturelle. Plus loin, d’autres marais partagent la présence de la grue cendrée : les [Réserves du
      Deurnsche Peel et du Mariapeel](/lugar/deurnsche-peel---mariapeel/), la [Réserve naturelle de
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) et les [Zones humides du
      Rhinluch](/lugar/rhinluch-wetlands/).
  de:
    intro: >-
      Wenn die Oktobersonne sinkt, fliegen die Kraniche in langen Ketten rufend ins Moor ein und lassen sich
      ins seichte Flachwasser gleiten, um dort die Nacht zu verbringen. Das ist das alljährliche Schauspiel
      der Diepholzer Moorniederung: ein Hochmoorbecken im Nordwesten Deutschlands, das sich zu einem der
      bedeutendsten Rastplätze des Grauen Kranichs auf dem westeuropäischen Zugweg gewandelt hat.


      Was heute Zuflucht bietet, war über Jahrzehnte entwässert und industriell abgetorft. Seit den siebziger
      Jahren werden die Hochmoore systematisch wiedervernässt; der Kranich, der durch Lebensraumverlust fast
      verschwunden war, ist zurückgekehrt: zunächst als Rastvogel, seit 2001 auch wieder als Brutvogel.
    landscape: >-
      Diepholz ist eine Talsandniederung am Südrand der Norddeutschen Tiefebene, gegliedert durch flache
      Geestrücken zwischen Bremen, Osnabrück und Hannover. Sie vereint rund 24.000 Hektar Moorflächen in 15
      Hochmooren sowie den Dümmer-See im Südwesten. Der Naturraum umfasst etwa 105.000 Hektar mit zahlreichen
      Naturschutzgebieten.


      Der Torfabbau hat die Landschaft grundlegend verändert. Jahrzehntelanger Torfstich prägte das Relief,
      und auf Teilflächen läuft der industrielle Abbau noch weiter. In Deutschland gehören intakte Hochmoore
      zu den seltensten Biotopen, da 95 % entwässert, abgetorft oder forst- und landwirtschaftlich umgewandelt
      wurden. Umso wertvoller ist die Diepholzer Moorniederung als Vorzeigegebiet: Der BUND betreut hier als
      regionale Naturschutzstation 170 Quadratkilometer geschützte Moore, Feuchtwiesen und Sandheiden.
    wildlife: >-
      Das Jahr des [Kranichs](/especie/grus_grus/) teilt sich in zwei Phasen. Im Frühjahr ziehen die Vögel
      rasch nordwärts; im Herbst rasten sie wochenlang. Ab Ende September sammeln sich lokale Brutpaare und
      Jungvögel auf Schlafgewässern, bald verstärkt durch Schwärme aus Skandinavien und Osteuropa. Die
      Hauptmasse trifft im Herbst ein; im Frühling rasten weit geringere Zahlen. Insgesamt nutzen Zehntausende
      Kraniche die Moore in jeder Zugsaison.


      Der Tagesablauf ist eingespielt. Nachts schlafen die Kraniche im seichten Wasser wiedervernässter
      Pütten, geschützt vor Bodenfeinden wie dem Fuchs. Tagsüber fliegen sie auf umliegende Ackerflächen und
      fressen abgeernteten Mais. Nach der Rast ziehen die Vögel weiter an den Lac du Der-Chantecoq oder nach
      Arjuzanx in Frankreich und in die spanische Extremadura.


      Seit 2001 brüten Kraniche wieder erfolgreich im Gebiet. Sie bauen Nester auf Schwingrasen, nackten
      Torfflächen oder Röhrichtinseln im Wasser. Die Eiablage beginnt ab dem 10. März in einem Nesthügel von
      etwa 1 Meter Durchmesser und 20 Zentimetern Höhe. Zum Balzritual gehören Sprünge, Flügelschlagen und
      laute Duettrufe, gefolgt von heimlichem Brutverhalten.


      Weitere Leitarten sind [Wiesenweihe](/especie/circus_pygargus/), [Kornweihe](/especie/circus_cyaneus/),
      [Großer Brachvogel](/especie/numenius_arquata/) und [Goldregenpfeifer](/especie/pluvialis_apricaria/),
      dazu Raubwürger und Sumpfohreule, für die Diepholz das wichtigste niedersächsische Binnenlandbrutgebiet
      darstellt. Ziegenmelker, Krickente, Baumfalke, Bekassine, Rotschenkel und Schwarzkehlchen brüten
      ebenfalls hier; unter den Kriechtieren schützt der BUND die Schlingnatter.
    visit: >-
      Die beste Zeit für Naturbeobachter ist die Abenddämmerung beim Einflug der Kraniche. Empfehlenswert sind
      die Aussichtstürme im Rehdener Geestmoor und im Neustädter Moor. Ein mobiler Infostand des BUND steht an
      der Straße zwischen Ströhen und Holzhausen kurz hinter der Brücke über den Langen Graben.


      Zum Verständnis der Moorökologie laden Besucherzentren ein: das Europäische Fachzentrum Moor und Klima
      in Ströhen mit der Ausstellung Moorwelten (eröffnet im Oktober 2014), das Naturschutz- und
      Informationszentrum Goldenstedt sowie das «Tor zum Moor» in Essern. Zudem starten an vier Bahnhöfen –
      Essern, Ströhen, Freistatt und Goldenstedt – historische Moorbahnen zu Fahrten auf schmaler Spur.
    history: >-
      Der Schutz begann mit Naturfreunden, die den Arbeitskreis Moorfauna (FAM) gründeten; später übernahm der
      BUND die Betreuung. Der Bruterfolg beruht auf der Kombination aus großflächiger Wiedervernässung und
      gezielter Besucherlenkung. Seit 2000 führt der BUND koordinierte Zählungen durch; Farbringprogramme
      ermöglichen die Verfolgung individueller Zugwege.


      Ehrenamtliche können bei Moorpflegetagen mitwirken: mit Astschere, Freischneider und Motorsäge werden
      Birken und Kiefern entkusselt, um das Moor offen zu halten.
    before: >-
      Kraniche reagieren empfindlich auf Störungen, insbesondere zur Brutzeit. Beobachte die Vögel von den
      Aussichtstürmen aus, halte Abstand zu Schlafgewässern und bleibe auf den Wegen. Beringte Kraniche können
      online gemeldet werden. Die beste Besuchszeit liegt zwischen Oktober und November.
    around: >-
      In sieben Kilometern Entfernung liegen die [Dümmer-Feuchtgebiete](/lugar/dummer-wetlands/) im gleichen
      Naturraum. Weitere bedeutende Moorlebensräume mit Kranichrast sind die [Schutzgebiete Deurnsche Peel und
      Mariapeel](/lugar/deurnsche-peel---mariapeel/), das [Naturreservat
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) und das [Rhinluch](/lugar/rhinluch-wetlands/).
  it:
    intro: >-
      Al calare della sera di ottobre, le gru convergono verso la torbiera in lunghi stormi vociferanti,
      planando dolcemente nell’acqua bassa per trascorrervi la notte. È il grandioso spettacolo di Diepholz:
      una depressione di torbiere alte nella Germania nord-occidentale affermatasi come una delle principali
      stazioni di sosta migratoria per la gru cenerina in Europa.


      Ciò che oggi è un paradiso naturale è stato per decenni un territorio bonificato e sfruttato per
      l’estrazione industriale della torba. A partire dagli anni settanta, i progetti di riallagamento hanno
      rigenerato le torbiere alte, permettendo il ritorno della gru: inizialmente per sostare durante i
      viaggi, e dal 2001 anche per nidificare stabilmente.
    landscape: >-
      Diepholz è una vasta piana sabbiosa incastonata al margine meridionale del Bassopiano Germanico,
      movimentata da lievi cordoni sabbiosi tra Brema, Osnabrück e Hannover. Raccoglie circa 24.000 ettari di
      torbiere ripartiti in 15 torbiere alte, con il lago Dümmer a chiudere la depressione a sud-ovest. La
      regione biogeografica copre circa 105.000 ettari con numerose riserve naturali protette.


      La torba ne ha forgiato il destino. Il paesaggio porta i segni di decenni di scavo e porzioni di
      torbiera continuano a essere lavorate industrialmente. In Germania le torbiere alte figurano tra gli
      habitat più minacciati, poiché il 95% è stato prosciugato, cavato o trasformato in campi e piantagioni
      forestali. Per questo Diepholz riveste un valore ecologico eccezionale: l’associazione BUND, che
      gestisce l’area per conto delle autorità pubbliche, cura 170 chilometri quadrati di torbiere, prati
      allagati e brughiere sabbiose.
    wildlife: >-
      Il ciclo annuale della [gru](/especie/grus_grus/) si divide in due momenti. In primavera gli stormi
      transitano veloci verso nord; in autunno vi si trattengono a lungo. Verso fine settembre le coppie
      locali e i giovani si concentrano nei dormitori allagati, presto affiancati dalle migliaia di individui
      provenienti da Scandinavia e Russia. Il passaggio autunnale fa registrare i picchi più elevati; in
      primavera le presenze sono più fugaci. Nel complesso decine di migliaia di gru sostano in queste
      torbiere a ogni stagione.


      La routine è collaudata. Di notte le gru dormono nell’acqua bassa delle torbiere rinaturate, protette
      dai predatori. Di giorno si disperdono nei campi circostanti in cerca delle spighe di mais rimaste dopo
      il raccolto. Le gru che sostano a Diepholz proseguono poi verso il lago di Der-Chantecoq e Arjuzanx in
      Francia, o l’Estremadura in Spagna.


      Dal 2001 sono tornate a nidificare. Costruiscono i nidi su zolle galleggianti o ciuffi di giunchi
      isolati nell’acqua. Le femmine depongono a partire dal 10 marzo in nidi a monticello di circa 1 metro di
      diametro e 20 centimetri d’altezza. Le parate nuziali offrono salti spettacolari, battiti d’ali e
      squillanti richiami all’unisono, a cui segue una cova appartata.


      Tra gli altri volatili spiccano l’[albanella minore](/especie/circus_pygargus/), l’[albanella
      reale](/especie/circus_cyaneus/), il [chiurlo maggiore](/especie/numenius_arquata/) e il [piviere
      dorato](/especie/pluvialis_apricaria/), oltre ad averla maggiore e gufo di palude. Nidificano anche
      succiacapre, alzavola, lodolaio, beccaccino, pettegola e saltimpalo; tra i rettili il BUND protegge il
      colubro liscio.
    visit: >-
      Il momento magico coincide con l’imbrunire, quando le gru rientrano verso gli specchi d’acqua. Le
      migliori postazioni sono le torri d’osservazione del Rehdener Geestmoor e del Neustädter Moor. Un
      presidio informativo mobile del BUND staziona lungo la strada tra Ströhen e Holzhausen, subito dopo il
      ponte sul Langer Graben.


      Per comprendere l’ecosistema torboso sono presenti diversi centri: il Centro Europeo Torbiere e Clima a
      Ströhen, aperto nell’ottobre 2014 con il polo Moorwelten; il centro NIZ a Goldenstedt e la «Porta della
      Torbiera» a Essern. Vi è inoltre la possibilità di percorrere le torbiere a bordo dei caratteristici
      trenini a scartamento ridotto da quattro stazioni: Essern, Ströhen, Freistatt e Goldenstedt.
    history: >-
      L’azione conservazionista nacque da appassionati naturalisti che diedero vita al gruppo faunistico delle
      torbiere (FAM); il BUND ne ha poi ereditato la gestione. Il ritorno delle gru poggia sul riallagamento
      degli specchi d’acqua e sulla regolamentazione dei visitatori. Dal 2000 il BUND coordina censimenti
      regolari e i progetti di inanellamento aiutano a mappare le rotte migratorie.


      I volontari possono partecipare a giornate di ripristino ambientale: con decespugliatori e motoseghe si
      rimuovono betulle e pini per evitare l’imboschimento delle torbiere.
    before: >-
      La gru è un animale prudente, specialmente in riproduzione. Ammira gli stormi dalle torri e dai punti
      sosta senza avvicinarti all’acqua, camminando solo sui percorsi segnati. Le gru inanellate possono
      essere segnalate via web. Il periodo ideale per le grandi concentrazioni è tra ottobre e novembre.
    around: >-
      A sette chilometri si aprono le [Zone Umide del Lago Dümmer](/lugar/dummer-wetlands/), all’interno dello
      stesso comprensorio. Più lontano, altre torbiere ospitano la gru cenerina: le [Riserve di Deurnsche Peel
      e Mariapeel](/lugar/deurnsche-peel---mariapeel/), la [Riserva Naturale di
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) e le [Zone Umide del
      Rhinluch](/lugar/rhinluch-wetlands/).
  pt:
    intro: >-
      Ao cair da tarde num dia de outubro, os grous voam em direção à turfeira em longas formações e descem em
      águas pouco profundas para passar a noite. É o espetáculo singular de Diepholz: uma depressão de
      turfeiras altas no noroeste da Alemanha que se converteu numa das paragens mais vitais do grou-comum nas
      suas migrações europeias.


      O que hoje é um refúgio acolhedor foi, durante décadas, turfeira drenada e explorada intensivamente.
      Desde os anos setenta do século passado, programas de recuperação hídrica têm inundado as turfeiras
      altas; o grou, que entrara em declínio pelo desaparecimento dos seus biótopos, regressou: primeiro como
      local de descanso e, desde 2001, também para procriar.
    landscape: >-
      Diepholz estende-se numa bacia arenosa no limite meridional da Planície do Norte da Alemanha,
      entrecortada por suaves colinas arenosas de geest entre Bremen, Osnabrück e Hanôver. Reúne cerca de
      24.000 hectares de turfeiras distribuídas por 15 turfeiras altas, complementadas pelo lago Dümmer a
      sudoeste. A região natural totaliza cerca de 105.000 hectares com dezenas de reservas protegidas.


      A turfa moldou a paisagem. Décadas de extração deixaram marcas profundas e parcelas das turfeiras
      continuam sob exploração comercial. Na Alemanha as turfeiras altas figuram entre os habitats mais
      escassos, dado que 95% foram drenadas, escavadas ou adaptadas à agricultura e à silvicultura. Daí a
      importância de Diepholz: a organização ambiental BUND cuida de 170 quilómetros quadrados de turfeiras,
      prados húmidos e charnecas arenosas protegidas.
    wildlife: >-
      O ciclo do [grou-comum](/especie/grus_grus/) divide-se em duas épocas. Na primavera as aves cruzam o céu
      em ritmo célere rumo a norte; no outono permanecem longas semanas. No final de setembro os casais
      reprodutores locais reúnem-se nos dormitórios com as crias, acolhendo em breve milhares de migradores
      nórdicos e de leste. O passo outonal atinge números expressivos; na primavera as contagens de repouso
      são bem mais discretas. Ao todo, dezenas de milhares de grous fazem escala nesta depressão a cada
      temporada.


      A rotina diária é metódica. De noite, os grous descansam nas lagoas someiras das turfeiras recuperadas,
      fora do alcance de predadores terrestres. De dia, dispersam pelos campos agrícolas circundantes à
      procura de sementes nos restolhos de milho ceifado. Após repousarem em Diepholz, muitos seguem para o
      lago Der-Chantecoq ou Arjuzanx em França, e depois para a Estremadura em Espanha.


      Desde 2001 nidificam com sucesso na região. Instalam os ninhos sobre tapetes flutuantes de vegetação,
      turfa nua ou prados inundados de juncos. As posturas arrancam a partir de 10 de março em montículos com
      cerca de 1 metro de diâmetro e 20 centímetros de altura. As paradas nupciais incluem saltos, bater de
      asas e sonoros duetos, seguidos de postura discreta.


      Outras espécies notáveis são o [tartaranhão-caçador](/especie/circus_pygargus/), o
      [tartaranhão-azulado](/especie/circus_cyaneus/), o [maçarico-real](/especie/numenius_arquata/) e a
      [tarambola-dourada-europeia](/especie/pluvialis_apricaria/), além do picanço-real e do bufo-pequeno.
      Ocorrem também o noitibó-da-europa, a marrequinha-comum, o ólbio, a narceja-comum, o
      perna-vermelha-comum e o cartaxo-comum; entre os répteis protege-se a cobra-lisa-austríaca.
    visit: >-
      O momento alto é o crepúsculo, quando os bandos de grous chegam às lagoas de dormitório. Os melhores
      pontos de vista são as torres de observação de Rehdener Geestmoor e Neustädter Moor. Uma banca móvel da
      BUND instala-se junto à estrada entre Ströhen e Holzhausen, logo após a ponte sobre o Langer Graben.


      Para aprofundar os conhecimentos sobre as turfeiras existem centros interpretativos: o Centro Europeu de
      Turfeiras e Clima em Ströhen, inaugurado em outubro de 2014 com o espaço Moorwelten; o NIZ em
      Goldenstedt e a «Porta da Turfeira» em Essern. Existe ainda a experiência singular de percorrer as
      turfeiras a bordo de antigos comboios de via estreita com partida de Essern, Ströhen, Freistatt e
      Goldenstedt.
    history: >-
      A preservação arrancou por iniciativa de naturalistas que fundaram o grupo de fauna de turfeiras (FAM);
      a BUND assumiu depois a continuidade dos trabalhos. A recuperação dos grous resulta do restauro hídrico
      e da gestão eficaz do fluxo de visitantes. Desde 2000 a BUND realiza contagens sistemáticas, permitindo
      o programa de anilhagem reconstituir rotas migratórias.


      Os voluntários podem colaborar em jornadas de voluntariado de conservação: munidos de tesourões e
      motosserras, desbravam bétulas e pinheiros para conservar a turfeira aberta.
    before: >-
      O grou-comum é muito esquivo, em especial na época reprodutiva. Observa a partir das torres e abrigos
      sem te aproximares das lagoas de dormitório e mantém-te nos trilhos. Se avistares uma ave anilhada,
      podes submeter os dados online. O período mais favorável situa-se entre outubro e novembro.
    around: >-
      A sete quilómetros ficam as [Zonas Húmidas do Lago Dümmer](/lugar/dummer-wetlands/), integradas na mesma
      região. Mais distantes, outros complexos acolhem o grou-comum: as [Reservas de Deurnsche Peel e
      Mariapeel](/lugar/deurnsche-peel---mariapeel/), a [Reserva Natural de
      Fochteloërveen](/lugar/fochteloorveen---natuurreservaat/) e as [Zonas Húmidas de
      Rhinluch](/lugar/rhinluch-wetlands/).
