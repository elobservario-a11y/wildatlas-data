resumen:
  es: Llanura de inundación en la confluencia del Warta y el Oder habitada por decenas de miles de gansos.
  en: A floodplain at the confluence of the Warta and Oder rivers, home to tens of thousands of geese.
  fr: >-
    Une plaine inondable à la confluence de la Warta et de l'Oder, habitée par des dizaines de milliers
    d'oies.
  de: Eine Überschwemmungsaue an der Mündung der Warthe in die Oder, Heimat Zehntausender Gänse.
  it: Una pianura alluvionale alla confluenza del Warta e dell'Oder, abitata da decine di migliaia di oche.
  pt: Uma planície de inundação na confluência do Warta e do Oder, habitada por dezenas de milhares de gansos.
unico:
  es: >-
    Una llanura inundable donde duermen cada otoño decenas de miles de gansos y grullas, y donde el agua
    modela el paisaje con una amplitud de hasta cuatro metros.
  en: >-
    A floodplain where tens of thousands of geese and cranes roost each autumn, and where water shapes the
    landscape through a fluctuation of up to four metres.
  fr: >-
    Une plaine alluviale où des dizaines de milliers d'oies et de grues se rassemblent chaque automne, et où
    l'eau façonne le paysage avec une amplitude allant jusqu'à quatre mètres.
  de: >-
    Eine Flussaue, in der jeden Herbst Zehntausende Gänse und Kraniche übernachten und wo das Wasser die
    Landschaft mit einer Schwankung von bis zu vier Metern formt.
  it: >-
    Una pianura allagabile dove ogni autunno si radunano decine di migliaia di oche e gru, e dove l'acqua
    plasma il paesaggio con un'escursione fino a quattro metri.
  pt: >-
    Uma planície aluvial onde dezenas de milhares de gansos e grous pernoitam cada outono, e onde a água molda
    a paisagem com uma amplitude de até quatro metros.
observaciones:
  es: >-
    El parque se visita del amanecer al anochecer: no hay zonas de acampada ni lugares para pernoctar, y de
    noche está prohibido permanecer incluso en los aparcamientos. Los perros solo pueden pasear en el Polder
    Norte, la parte del parque al norte del Warta. En los accesos del dique Este hay pastores eléctricos que
    protegen a los animales en pastoreo: se abre la valla por el mango negro y se cierra al pasar. A Słońsk no
    llega transporte público, así que solo se puede ir en vehículo propio.
texto:
  es:
    intro: >-
      Al caer la tarde de otoño, las grullas aterrizan entre graznidos en los prados del Warta, hasta siete
      mil a la vez, y con ellas llegan los gansos: entre setenta mil y noventa mil duermen cada noche en el
      parque, a veces ciento cincuenta mil y, como máximo, doscientos mil. En noviembre de 2024 se contaron
      más de 280 mil, una cifra récord. Esto es el Parque Nacional Ujście Warty, en el tramo bajo del Warta,
      donde el río se encuentra con el Oder, que marca la frontera entre Polonia y Alemania.
    landscape: >-
      El Warta divide el parque en dos. Al sur está la antigua reserva de Słońsk; al norte, el llamado Polder
      Norte, separado del río por un dique y surcado de canales. En el sur el nivel del agua varía hasta
      cuatro metros a lo largo del año y el parque funciona como un lago estacional gigante: el agua sube a
      fines de otoño y llega al máximo en primavera, en marzo y abril.


      El resultado es un mosaico de hábitats húmedos modelado por el agua y por los usos humanos del valle: la
      tala, el drenaje, la siega y el pastoreo. Por eso las llanuras inundables del Warta son clave para
      muchas aves.
    wildlife: >-
      **Primavera.** Es el momento de la cría. El parque registra 270 especies de aves, 170 de ellas
      nidificantes. Entre los limícolas que crían con regularidad están la avefría, el archibebe, la
      agachadiza, la [aguja colinegra](/especie/limosa_limosa/), el zarapito, el chorlitejo chico y el
      ostrero. Cinco parejas de ostrero, ave rara en el interior de Polonia, son una curiosidad ornitológica.
      De los seis fumareles y charranes que crían con regularidad en Polonia, cinco lo hacen en el parque.
      Según el nivel del agua, entre 250 y 500 parejas de [ánsar común](/especie/anser_anser/) anidan aquí, y
      cuando sube el agua los cisnes vulgares levantan sus nidos por encima de la superficie, a veces enormes.
      El 10 % de todas las parejas de zampullín cuellinegro de Polonia viven en el parque, en grandes
      colonias.


      **Verano.** En junio y julio, entre los sauces se esconden patos, fochas, ánsares y cisnes en muda;
      entre la hierba alta, las grullas, que pierden el vuelo durante unos días. Junto a las colonias de
      cormoranes crían la garza real y, más raras, la garceta grande y el martinete.


      **Otoño.** Es el mejor momento para ver el paso de gansos y grullas. Las grullas llegan al atardecer,
      acompañadas de bandadas de gansos que también buscan dónde pasar la noche. Esa abundancia atrae a los
      pigargos, fáciles de ver en otoño e invierno.


      **Invierno.** Al empezar el invierno llegan del norte los [cisnes cantores](/especie/cygnus_cygnus/):
      hasta 3 000 invernan en el parque, una de las mayores concentraciones de Europa. En los prados secos del
      Polder Norte pasan el invierno los busardos calzados, que se quedan suspendidos en el aire al cazar, y
      aparecen también el aguilucho pálido y el esmerejón. De noche mandan el búho chico, la lechuza común y
      el búho campestre.
    visit: >-
      Lo mejor es empezar por Ornitovo, el centro de museo y educación de Słońsk, con una exposición moderna
      sobre la naturaleza y la historia de la región. Tiene ocho salas temáticas, un vuelo virtual en globo
      sobre el parque y un paseo en barca virtual por aguas a las que el turismo no accede.


      Después, las sendas. **Ptasim szlakiem** («Por el sendero de las aves») cruza una de las zonas de cría
      más atractivas, y su mejor época es primavera y otoño. Van bien unos prismáticos, un telescopio y un
      atlas de aves. Desde ella se ve por la mañana la salida de gansos y grullas hacia los comederos y por la
      tarde su vuelta al dormidero, y es uno de los principales lugares de invernada del cisne cantor de
      Polonia.


      **Mokradła** trata de las funciones de los humedales en la naturaleza y en la economía humana, y tiene
      ocho paradas con paneles. **Olszynki** atraviesa el único bosque del parque, una aliseda pantanosa, y el
      resto va por prados húmedos y carrizales; es una senda peatonal con pasarela de madera y dique, y las
      bicis pueden usarla pero hay que llevarlas a mano por las pasarelas. Para pedalear está **Na dwóch
      kółkach przez Polder Północny**, un circuito de unos 30 km con la posibilidad de tramos más cortos, 20
      paradas con paneles, 3 torres de observación y 6 cobertizos. **Torfianka** es una senda corta que une
      dos tramos del circuito y permite hacer un bucle más pequeño. En Chyrzyno, el Jardín de los Sentidos es
      un huerto didáctico con tareas de naturaleza, pensado para familias con niños pequeños y accesible para
      personas con discapacidad.
    history: >-
      El parque se creó el 19 de junio de 2001 en el tramo bajo del Warta, hasta su confluencia con el Oder.
      La senda «Mokradła» explica que el parque está cubierto por la Convención de Ramsar y por Natura 2000.
      La amenaza principal es el regreso de plantas grandes a los prados y pastos, que pone en peligro los
      nidos de las aves; el parque actúa contra ello.
    before: >-
      El parque se visita del amanecer al anochecer: no hay zonas de acampada ni lugares para pernoctar, y de
      noche está prohibido permanecer incluso en los aparcamientos. Los perros solo pueden pasear en el Polder
      Norte, la parte del parque al norte del Warta. En los accesos del dique Este hay pastores eléctricos que
      protegen a los animales en pastoreo: se abre la valla por el mango negro y se cierra al pasar. A Słońsk
      no llega transporte público, así que solo se puede ir en vehículo propio.
    around: >-
      Lejos de aquí hay otros humedales de gansos y pigargos: el [Parque Nacional de Wolin y Delta del Río
      Świna](/lugar/wolinski-park-narodowy---delta-swiny/) comparte el cisne cantor y el pigargo, y el [Parque
      Nacional de Słowiński](/lugar/slowinski-park-narodowy/), el ánsar común y el pigargo. Más lejos aún, el
      [Parque Nacional del Delta del Evros](/lugar/ethniko-parko-delta-evrou/) y la [Reserva de la Biosfera de
      Srebarna](/lugar/srebarna-biosphere-reserve/) los comparten también.
  en:
    intro: >-
      As autumn dusk falls, cranes land with calls among the Warta meadows — up to seven thousand at once —
      and with them come the geese: between seventy thousand and ninety thousand sleep each night in the park,
      sometimes a hundred and fifty thousand and at most two hundred thousand. In November 2024 more than 280
      thousand were counted, a record. This is Ujście Warty National Park, on the lower Warta where the river
      meets the Oder, which marks the border between Poland and Germany.
    landscape: >-
      The Warta divides the park in two. To the south lies the former Słońsk reserve; to the north, the
      so-called North Polder, separated from the river by a dike and criss-crossed with canals. In the south,
      the water level varies by up to four metres over the year and the park functions as a giant seasonal
      lake: water rises in late autumn and reaches its peak in spring, in March and April.


      The result is a mosaic of wet habitats shaped by water and by human uses of the valley: felling,
      drainage, mowing and grazing. That is why the Warta floodplains are critical for so many birds.
    wildlife: >-
      **Spring.** This is the breeding season. The park records 270 bird species, 170 of them nesting. Waders
      that breed regularly include lapwing, redshank, snipe, [black-tailed godwit](/especie/limosa_limosa/),
      curlew, little ringed plover and oystercatcher. Five oystercatcher pairs — a rarity inland in Poland —
      make for a remarkable ornithological curiosity. Of the six terns and skimmers that breed regularly in
      Poland, five do so in the park. Depending on water levels, between 250 and 500 pairs of [greylag
      goose](/especie/anser_anser/) nest here, and when water rises, mute swans build their nests above the
      surface — sometimes enormous ones. 10% of all black-necked grebe pairs in Poland live in the park, in
      large colonies.


      **Summer.** In June and July, ducks, coots, greylags and swans in moult hide among the willows; in the
      tall grass, cranes that temporarily lose the power of flight for a few days. Near cormorant colonies
      breed the grey heron and, more rarely, the great egret and the black-crowned night heron.


      **Autumn.** The best time to watch the goose and crane migration. Cranes arrive at dusk, accompanied by
      flocks of geese that also seek a night roost. This abundance attracts white-tailed eagles, easy to see
      in autumn and winter.


      **Winter.** At the onset of winter, [whooper swans](/especie/cygnus_cygnus/) arrive from the north: up
      to 3,000 winter in the park, one of the largest concentrations in Europe. In the dry meadows of the
      North Polder, rough-legged buzzards winter — hovering while hunting — and pallid harrier and merlin
      appear as well. At night, long-eared owl, barn owl and short-eared owl rule.
    visit: >-
      The best starting point is Ornitovo, the museum and education centre in Słońsk, with a modern exhibition
      on the nature and history of the region. It has eight themed rooms, a virtual hot-air balloon flight
      over the park and a virtual boat trip through waters inaccessible to tourism.


      Then the trails. **Ptasim szlakiem** ('Along the Bird Trail') crosses one of the most attractive
      breeding areas; the best seasons are spring and autumn. Binoculars, a telescope and a bird atlas are
      recommended. From it you can watch geese and cranes leaving for their feeding grounds in the morning and
      returning to their roost in the evening — it is one of the main wintering sites for whooper swans in
      Poland.


      **Mokradła** covers the functions of wetlands in nature and the human economy, with eight panels.
      **Olszynki** crosses the park's only forest, an alder carr, and continues through wet meadows and
      reedbeds; it is a walking trail with a wooden boardwalk and dike, bicycles may use it but must be walked
      over the boardwalk sections. For cycling there is **Na dwóch kółkach przez Polder Północny**, a circuit
      of around 30 km with shorter options, 20 information panels, 3 observation towers and 6 hides.
      **Torfianka** is a short trail linking two sections of the circuit and allows a smaller loop. In
      Chyrzyno, the Garden of the Senses is an educational orchard with nature activities, designed for
      families with young children and accessible to people with disabilities.
    history: >-
      The park was created on 19 June 2001 on the lower Warta, up to its confluence with the Oder. The
      Mokradła trail explains that the park is covered by the Ramsar Convention and by Natura 2000. The main
      threat is the return of tall plants to meadows and pastures, which endangers bird nests; the park works
      actively against this.
    before: >-
      The park is open from dawn to dusk: there are no camping areas or overnight facilities, and remaining in
      car parks at night is also prohibited. Dogs may only walk in the North Polder, the part of the park
      north of the Warta. At the Eastern Dike access points there are electric fences protecting grazing
      animals: open the gate by the black handle and close it after passing. Słońsk has no public transport,
      so a private vehicle is the only option.
    around: >-
      Further away are other wetlands for geese and eagles: [Wolin National Park and the Świna River
      Delta](/lugar/wolinski-park-narodowy---delta-swiny/) shares the whooper swan and white-tailed eagle, and
      [Słowiński National Park](/lugar/slowinski-park-narodowy/) shares the greylag goose and white-tailed
      eagle. Further still, [Evros Delta National Park](/lugar/ethniko-parko-delta-evrou/) and [Srebarna
      Biosphere Reserve](/lugar/srebarna-biosphere-reserve/) share them too.
  fr:
    intro: >-
      Au crépuscule d'automne, les grues atterrissent en criant dans les prairies de la Warta — jusqu'à sept
      mille à la fois — et avec elles arrivent les oies : entre soixante-dix mille et quatre-vingt-dix mille
      dorment chaque nuit dans le parc, parfois cent cinquante mille et au maximum deux cent mille. En
      novembre 2024, on en a dénombré plus de 280 mille, un record absolu. C'est le parc national d'Ujście
      Warty, dans le cours inférieur de la Warta, là où la rivière rejoint l'Oder, frontière naturelle entre
      la Pologne et l'Allemagne.
    landscape: >-
      La Warta divise le parc en deux. Au sud se trouve l'ancienne réserve de Słońsk ; au nord, le Polder
      Nord, séparé du fleuve par une digue et sillonné de canaux. Dans le secteur sud, le niveau de l'eau
      varie jusqu'à quatre mètres au cours de l'année et le parc fonctionne comme un gigantesque lac
      saisonnier : l'eau monte à la fin de l'automne pour atteindre son maximum au printemps, en mars et
      avril.


      Il en résulte une mosaïque de milieux humides modelée par l'eau et par les usages humains de la vallée :
      abattage, drainage, fauche et pâturage. C'est pourquoi les plaines alluviales de la Warta sont
      essentielles pour de nombreux oiseaux.
    wildlife: >-
      **Printemps.** C'est la période de reproduction. Le parc recense 270 espèces d'oiseaux, dont 170
      nicheuses. Parmi les limicoles qui nichent régulièrement : le vanneau huppé, le chevalier gambette, la
      bécassine des marais, la [barge à queue noire](/especie/limosa_limosa/), le courlis cendré, le petit
      gravelot et l'huîtrier pie. Cinq couples d'huîtriers pie — oiseau rare dans l'intérieur de la Pologne —
      constituent une curiosité ornithologique. Sur les six sternes et guifettes qui nichent régulièrement en
      Pologne, cinq le font dans le parc. Selon le niveau de l'eau, entre 250 et 500 couples d'[oie
      cendrée](/especie/anser_anser/) nichent ici, et quand l'eau monte, les cygnes tuberculés construisent
      leurs nids au-dessus de la surface, parfois immenses. 10 % de toutes les colonies de grèbe à cou noir de
      Pologne vivent dans le parc.


      **Été.** En juin et juillet, canards, foulques, oies cendrées et cygnes en mue se cachent dans les
      saulaies ; dans les hautes herbes, les grues perdent temporairement le vol quelques jours. Près des
      colonies de cormorans nichent le héron cendré et, plus rares, la grande aigrette et le bihoreau gris.


      **Automne.** C'est la meilleure saison pour observer la migration des oies et des grues. Les grues
      arrivent au crépuscule, accompagnées de bandes d'oies qui cherchent aussi un dortoir. Cette abondance
      attire les pygargues à queue blanche, faciles à observer en automne et en hiver.


      **Hiver.** Au début de l'hiver arrivent du nord les [cygnes chanteurs](/especie/cygnus_cygnus/) :
      jusqu'à 3 000 hivernent dans le parc, l'une des plus grandes concentrations d'Europe. Dans les prairies
      sèches du Polder Nord hivernent les buses pattues — qui restent en vol stationnaire pour chasser — et
      l'on voit aussi le busard pâle et le faucon émerillon. La nuit, le hibou moyen-duc, l'effraie et le
      hibou des marais règnent.
    visit: >-
      Le meilleur point de départ est Ornitovo, le centre muséal et éducatif de Słońsk, avec une exposition
      moderne sur la nature et l'histoire de la région. Il dispose de huit salles thématiques, d'un vol en
      montgolfière virtuel et d'une promenade en barque virtuelle sur des eaux inaccessibles au tourisme.


      Ensuite, les sentiers. **Ptasim szlakiem** (« Sur le sentier des oiseaux ») traverse l'une des zones de
      nidification les plus attractives ; le printemps et l'automne sont les meilleures saisons. Jumelles,
      longue-vue et atlas ornithologique sont recommandés. On peut y observer le matin le départ des oies et
      des grues vers leurs zones d'alimentation et le soir leur retour au dortoir — c'est l'un des principaux
      sites d'hivernage du cygne chanteur en Pologne.


      **Mokradła** porte sur les fonctions des zones humides dans la nature et l'économie humaine, avec huit
      panneaux. **Olszynki** traverse l'unique forêt du parc, une aulnaie marécageuse, puis continue par des
      prairies humides et des roselières ; sentier pédestre avec passerelle en bois et digue, les vélos
      peuvent l'emprunter mais doivent être poussés sur la passerelle. Pour le vélo, **Na dwóch kółkach przez
      Polder Północny** est un circuit d'environ 30 km avec des options plus courtes, 20 panneaux, 3 tours
      d'observation et 6 abris. **Torfianka** est un court sentier reliant deux tronçons du circuit et
      permettant une boucle plus petite. À Chyrzyno, le Jardin des Sens est un verger pédagogique à activités
      nature, conçu pour les familles avec de jeunes enfants et accessible aux personnes handicapées.
    history: >-
      Le parc a été créé le 19 juin 2001 sur le cours inférieur de la Warta, jusqu'à sa confluence avec
      l'Oder. Le sentier Mokradła explique que le parc est couvert par la Convention de Ramsar et par Natura
      2000. La menace principale est le retour des grandes plantes dans les prairies et pâturages, mettant en
      danger les nids des oiseaux ; le parc agit activement contre cela.
    before: >-
      Le parc est ouvert de l'aube au crépuscule : il n'y a pas de zones de camping ni de possibilités de
      nuit, et rester dans les parkings la nuit est également interdit. Les chiens ne sont autorisés qu'au
      Polder Nord, la partie du parc au nord de la Warta. Aux accès de la digue Est se trouvent des clôtures
      électriques protégeant les animaux en pâturage : on ouvre la barrière par la poignée noire et on la
      referme après être passé. Słońsk n'est desservi par aucun transport en commun, un véhicule personnel est
      donc indispensable.
    around: >-
      Plus loin, d'autres zones humides à oies et pygargues : le [Parc national de Wolin et le delta de la
      Świna](/lugar/wolinski-park-narodowy---delta-swiny/) partage le cygne chanteur et le pygargue, et le
      [Parc national de Słowiński](/lugar/slowinski-park-narodowy/) l'oie cendrée et le pygargue. Plus loin
      encore, le [Parc national du delta de l'Evros](/lugar/ethniko-parko-delta-evrou/) et la [Réserve de
      biosphère de Srebarna](/lugar/srebarna-biosphere-reserve/) les partagent aussi.
  de:
    intro: >-
      Wenn der Herbstabend anbricht, landen Kraniche mit lautem Rufen in den Warthe-Wiesen — bis zu sieben
      Tausend auf einmal — und mit ihnen kommen die Gänse: zwischen siebzigtausend und neunzigtausend schlafen
      jede Nacht im Park, manchmal hundertfünfzigtausend und maximal zweihunderttausend. Im November 2024
      wurden mehr als 280 Tausend gezählt, ein Rekord. Das ist der Nationalpark Ujście Warty im Unterlauf der
      Warthe, wo der Fluss auf die Oder trifft, die die Grenze zwischen Polen und Deutschland markiert.
    landscape: >-
      Die Warthe teilt den Park in zwei Hälften. Im Süden liegt das frühere Naturschutzgebiet Słońsk; im
      Norden der sogenannte Nordpolder, der durch einen Deich vom Fluss getrennt und von Kanälen durchzogen
      ist. Im Südteil schwankt der Wasserstand im Jahresverlauf um bis zu vier Meter und der Park funktioniert
      als gigantischer saisonaler See: Das Wasser steigt im späten Herbst und erreicht sein Maximum im
      Frühjahr, in März und April.


      Das Ergebnis ist ein Mosaik feuchter Lebensräume, das durch Wasser und menschliche Nutzungen des Tals
      geprägt wurde: Rodung, Entwässerung, Mahd und Beweidung. Deshalb sind die Warthe-Auen für so viele Vögel
      entscheidend.
    wildlife: >-
      **Frühjahr.** Das ist die Brutzeit. Der Park verzeichnet 270 Vogelarten, davon 170 Brutvögel. Regelmäßig
      brütende Watvögel sind Kiebitz, Rotschenkel, Bekassine, [Uferschnepfe](/especie/limosa_limosa/), Großer
      Brachvogel, Flussregenpfeifer und Austernfischer. Fünf Austernfischerpaare — ein Rarität im Inland
      Polens — sind eine ornithologische Besonderheit. Von den sechs Seeschwalbenarten, die regelmäßig in
      Polen brüten, tun fünf dies im Park. Je nach Wasserstand nisten hier zwischen 250 und 500 Paare der
      [Graugans](/especie/anser_anser/), und wenn das Wasser steigt, bauen Höckerschwäne ihre Nester über der
      Oberfläche, manchmal riesige. 10 % aller Schwarzhalstaucher-Paare Polens leben in großen Kolonien im
      Park.


      **Sommer.** Im Juni und Juli verstecken sich mausernde Enten, Blässhühner, Graugänse und Schwäne in den
      Weiden; im hohen Gras die Kraniche, die für einige Tage flugunfähig sind. Neben den Kormorankolonien
      brüten Graureiher und, seltener, Silberreiher und Nachtreiher.


      **Herbst.** Die beste Zeit, den Zug der Gänse und Kraniche zu beobachten. Kraniche landen in der
      Abenddämmerung, begleitet von Schwärmen ziehender Gänse, die ebenfalls einen Schlafplatz suchen. Diese
      Fülle zieht Seeadler an, die im Herbst und Winter leicht zu beobachten sind.


      **Winter.** Zu Winterbeginn kommen die [Singschwäne](/especie/cygnus_cygnus/) aus dem Norden: bis zu
      3.000 überwintern im Park, eine der größten Konzentrationen Europas. Im Nordpolder überwintern
      Raufußbussarde — beim Jagen im Rüttelflug stehend —, und Steppenweihe sowie Merlin treten ebenfalls auf.
      Nachts regieren Waldohreule, Schleiereule und Sumpfohreule.
    visit: >-
      Der beste Ausgangspunkt ist Ornitovo, das Museum und Bildungszentrum in Słońsk, mit einer modernen
      Ausstellung über Natur und Geschichte der Region. Es hat acht Themenräume, einen virtuellen Ballonflug
      über den Park und eine virtuelle Bootsfahrt durch für den Tourismus unzugängliche Gewässer.


      Dann die Wege. **Ptasim szlakiem** ('Auf dem Vogelpfad') durchquert eines der attraktivsten Brutgebiete;
      die besten Jahreszeiten sind Frühjahr und Herbst. Fernglas, Spektiv und Vogelatlas werden empfohlen. Von
      dort kann man morgens den Abflug der Gänse und Kraniche zu ihren Futterplätzen und abends ihre Rückkehr
      zum Schlafplatz beobachten — es ist einer der wichtigsten Singschwan-Überwinterungsplätze Polens.


      **Mokradła** behandelt die Funktion der Feuchtgebiete in Natur und Wirtschaft, mit acht
      Informationstafeln. **Olszynki** durchquert den einzigen Wald des Parks, ein Erlenbruch, und führt
      weiter durch Feuchtwiesen und Schilfflächen; Fußweg mit Holzsteg und Deich, Fahrräder sind erlaubt,
      müssen aber über die Stege geschoben werden. Zum Radfahren gibt es **Na dwóch kółkach przez Polder
      Północny**, eine Rundtour von etwa 30 km mit kürzeren Optionen, 20 Informationstafeln, 3 Aussichtstürmen
      und 6 Hütten. **Torfianka** verbindet zwei Abschnitte der Rundtour und ermöglicht eine kleinere
      Schleife. In Chyrzyno ist der Garten der Sinne ein Lehrpfad mit Naturaufgaben, für Familien mit kleinen
      Kindern konzipiert und barrierefrei.
    history: >-
      Der Park wurde am 19. Juni 2001 im Unterlauf der Warthe bis zu ihrer Mündung in die Oder gegründet. Der
      Mokradła-Weg erklärt, dass der Park unter die Ramsar-Konvention und Natura 2000 fällt. Die
      Hauptbedrohung ist die Rückkehr hochwüchsiger Pflanzen in Wiesen und Weiden, was Vogelnester gefährdet;
      der Park wirkt aktiv dagegen.
    before: >-
      Der Park ist von Sonnenaufgang bis Sonnenuntergang geöffnet: Es gibt keine Campingplätze oder
      Übernachtungsmöglichkeiten, und auch das nächtliche Verbleiben auf Parkplätzen ist verboten. Hunde sind
      nur im Nordpolder erlaubt, dem Parkteil nördlich der Warthe. An den Zugängen zum Ostdeich schützen
      Elektrozäune die Weidetiere: Öffnen Sie das Tor am schwarzen Griff und schließen Sie es nach dem
      Durchgang. Słońsk ist nicht mit öffentlichen Verkehrsmitteln erreichbar, ein privates Fahrzeug ist
      notwendig.
    around: >-
      Weiter entfernt liegen andere Feuchtgebiete für Gänse und Adler: Der [Nationalpark Wolin und das
      Świna-Flussdelta](/lugar/wolinski-park-narodowy---delta-swiny/) teilt den Singschwan und den Seeadler,
      und der [Słowiński-Nationalpark](/lugar/slowinski-park-narodowy/) die Graugans und den Seeadler. Noch
      weiter entfernt teilen der [Nationalpark Evros-Delta](/lugar/ethniko-parko-delta-evrou/) und das
      [Biosphärenreservat Srebarna](/lugar/srebarna-biosphere-reserve/) diese Arten ebenfalls.
  it:
    intro: >-
      Al calar del crepuscolo autunnale, le gru atterrano con i loro richiami nei prati del Warta — fino a
      settemila alla volta — e con loro arrivano le oche: tra settantamila e novantamila dormono ogni notte
      nel parco, a volte centocinquantamila e al massimo duecentomila. Nel novembre 2024 ne sono state contate
      più di 280 mila, un record assoluto. Questo è il Parco nazionale Ujście Warty, nel tratto inferiore del
      Warta, dove il fiume si incontra con l'Oder, che segna il confine tra Polonia e Germania.
    landscape: >-
      Il Warta divide il parco in due. A sud si trova l'ex riserva di Słońsk; a nord, il cosiddetto Polder
      Nord, separato dal fiume da un argine e percorso da canali. Nel settore sud, il livello dell'acqua varia
      fino a quattro metri nel corso dell'anno e il parco funziona come un gigantesco lago stagionale: l'acqua
      sale verso la fine dell'autunno e raggiunge il massimo in primavera, a marzo e aprile.


      Il risultato è un mosaico di habitat umidi modellato dall'acqua e dagli usi umani della valle: taglio,
      drenaggio, sfalcio e pascolo. Ecco perché le pianure alluvionali del Warta sono fondamentali per tanti
      uccelli.
    wildlife: >-
      **Primavera.** È il momento della riproduzione. Il parco registra 270 specie di uccelli, 170 delle quali
      nidificanti. Tra i limicoli che nidificano regolarmente: pavoncella, pettegola, beccaccino, [pittima
      reale](/especie/limosa_limosa/), chiurlo maggiore, corriere piccolo e beccaccia di mare. Cinque coppie
      di beccaccia di mare — specie rara nell'interno della Polonia — sono una curiosità ornitologica. Di sei
      specie di sterne e mignattini che nidificano regolarmente in Polonia, cinque lo fanno nel parco. A
      seconda del livello dell'acqua, tra 250 e 500 coppie di [oca selvatica](/especie/anser_anser/)
      nidificano qui, e quando l'acqua sale i cigni reali costruiscono i nidi sopra la superficie, a volte
      enormi. Il 10% di tutte le coppie di svasso piccolo della Polonia vive nel parco, in grandi colonie.


      **Estate.** In giugno e luglio, anatre, folaghe, oche selvatiche e cigni in muta si nascondono tra i
      salici; nell'erba alta, le gru che perdono temporaneamente la capacità di volare per alcuni giorni.
      Accanto alle colonie di cormorani nidificano l'airone cenerino e, più rari, la garzetta maggiore e il
      nitticora.


      **Autunno.** Il momento migliore per osservare il passo delle oche e delle gru. Le gru arrivano al
      tramonto, accompagnate da stormi di oche in cerca di un dormitorio. Questa abbondanza attira le aquile
      di mare, facili da vedere in autunno e in inverno.


      **Inverno.** All'inizio dell'inverno arrivano dal nord i [cigni selvatici](/especie/cygnus_cygnus/):
      fino a 3.000 svernano nel parco, una delle maggiori concentrazioni d'Europa. Nelle praterie asciutte del
      Polder Nord svernano le poiane calzate — che si librano in aria mentre cacciano — e compaiono anche
      l'albanella pallida e il lodolaio. Di notte regnano il gufo comune, il barbagianni e il gufo di palude.
    visit: >-
      Il punto di partenza migliore è Ornitovo, il centro museale e didattico di Słońsk, con una moderna
      esposizione sulla natura e la storia della regione. Ha otto sale tematiche, un volo in mongolfiera
      virtuale sul parco e una gita in barca virtuale su acque inaccessibili al turismo.


      Poi i sentieri. **Ptasim szlakiem** ('Sul sentiero degli uccelli') attraversa una delle zone di
      nidificazione più attraenti; le stagioni migliori sono primavera e autunno. Si raccomandano binocolo,
      cannocchiale e atlante degli uccelli. Da qui si osserva al mattino la partenza di oche e gru verso i
      luoghi di alimentazione e la sera il loro ritorno al dormitorio — è uno dei principali siti di
      svernamento del cigno selvatico in Polonia.


      **Mokradła** tratta le funzioni delle zone umide nella natura e nell'economia umana, con otto pannelli
      informativi. **Olszynki** attraversa l'unica foresta del parco, un'ontanaia paludosa, e prosegue per
      prati umidi e canneti; è un percorso pedonale con passerella in legno e argine, le biciclette possono
      usarlo ma vanno spinte sulle passerelle. Per il ciclismo c'è **Na dwóch kółkach przez Polder Północny**,
      un circuito di circa 30 km con possibilità di percorsi più brevi, 20 pannelli informativi, 3 torri di
      osservazione e 6 capanni. **Torfianka** è un breve sentiero che collega due tratti del circuito e
      permette un anello più piccolo. A Chyrzyno, il Giardino dei Sensi è un frutteto didattico con attività
      naturalistiche, pensato per famiglie con bambini piccoli e accessibile a persone con disabilità.
    history: >-
      Il parco è stato creato il 19 giugno 2001 nel tratto inferiore del Warta, fino alla sua confluenza con
      l'Oder. Il sentiero Mokradła spiega che il parco è tutelato dalla Convenzione di Ramsar e da Natura
      2000. La minaccia principale è il ritorno delle piante alte nei prati e nei pascoli, che mette in
      pericolo i nidi degli uccelli; il parco interviene attivamente contro questo fenomeno.
    before: >-
      Il parco è visitabile dall'alba al tramonto: non ci sono aree di campeggio né possibilità di
      pernottamento, e anche restare nei parcheggi di notte è vietato. I cani sono ammessi solo nel Polder
      Nord, la parte del parco a nord del Warta. Agli accessi dell'argine est ci sono recinti elettrici che
      proteggono gli animali al pascolo: si apre il cancello dall'impugnatura nera e si richiude dopo il
      passaggio. Słońsk non è raggiungibile con i mezzi pubblici, quindi è necessario un veicolo privato.
    around: >-
      Più lontano ci sono altre zone umide per oche e aquile: il [Parco nazionale di Wolin e il delta del
      fiume Świna](/lugar/wolinski-park-narodowy---delta-swiny/) condivide il cigno selvatico e l'aquila di
      mare, e il [Parco nazionale di Słowiński](/lugar/slowinski-park-narodowy/) l'oca selvatica e l'aquila di
      mare. Ancora più lontano, il [Parco nazionale del delta dell'Evros](/lugar/ethniko-parko-delta-evrou/) e
      la [Riserva della biosfera di Srebarna](/lugar/srebarna-biosphere-reserve/) li condividono anch'essi.
  pt:
    intro: >-
      Quando o crepúsculo de outono cai, os grous aterram com os seus chamamentos nos prados do Warta — até
      sete mil de uma vez — e com eles chegam os gansos: entre setenta mil e noventa mil dormem cada noite no
      parque, às vezes cento e cinquenta mil e no máximo duzentos mil. Em novembro de 2024 foram contados mais
      de 280 mil, um recorde absoluto. Este é o Parque Nacional Ujście Warty, no trecho inferior do Warta,
      onde o rio encontra o Oder, que marca a fronteira entre a Polónia e a Alemanha.
    landscape: >-
      O Warta divide o parque em dois. A sul fica a antiga reserva de Słońsk; a norte, o chamado Pôlder Norte,
      separado do rio por um dique e percorrido por canais. No sector sul, o nível da água varia até quatro
      metros ao longo do ano e o parque funciona como um gigantesco lago sazonal: a água sobe no final do
      outono e atinge o máximo na primavera, em março e abril.


      O resultado é um mosaico de habitats húmidos moldado pela água e pelos usos humanos do vale: corte,
      drenagem, ceifa e pastoreio. É por isso que as planícies aluviais do Warta são fundamentais para tantas
      aves.
    wildlife: >-
      **Primavera.** É o momento da reprodução. O parque regista 270 espécies de aves, 170 das quais
      nidificantes. Entre as limícolas que nidificam regularmente: abibe, perna-vermelha, narceja,
      [maçarico-de-bico-direito](/especie/limosa_limosa/), maçarico-real, borrelho-pequeno-de-coleira e
      ostraceiro. Cinco casais de ostraceiro — ave rara no interior da Polónia — são uma curiosidade
      ornitológica. Das seis espécies de andorinhas-do-mar e gaivinas que nidificam regularmente na Polónia,
      cinco fazem-no no parque. Dependendo do nível da água, entre 250 e 500 casais de
      [ganso-bravo](/especie/anser_anser/) nidificam aqui, e quando a água sobe, os cisnes-mudos constroem os
      seus ninhos acima da superfície, às vezes enormes. 10% de todos os casais de mergulhão-de-pescoço-preto
      da Polónia vivem no parque, em grandes colónias.


      **Verão.** Em junho e julho, patos, galinhas-d'água, gansos-bravos e cisnes em muda escondem-se entre os
      salgueiros; na erva alta, os grous que perdem temporariamente a capacidade de voar durante alguns dias.
      Perto das colónias de corvos-marinhos nidificam a garça-real e, mais raramente, a garça-branca-grande e
      o goraz.


      **Outono.** O melhor momento para observar a migração de gansos e grous. Os grous chegam ao entardecer,
      acompanhados de bandos de gansos que também procuram um dormitório. Esta abundância atrai as
      águias-de-cauda-branca, fáceis de ver no outono e inverno.


      **Inverno.** No início do inverno chegam do norte os [cisnes-cantores](/especie/cygnus_cygnus/): até
      3.000 invernado no parque, uma das maiores concentrações da Europa. Nos prados secos do Pôlder Norte
      invernam as águias-calçadas — que pairam no ar enquanto caçam — e aparecem também o tartaranhão-pálido e
      o falcão-esmerilhão. À noite reinam a coruja-do-mato, a coruja-das-torres e a coruja-do-nabal.
    visit: >-
      O melhor ponto de partida é o Ornitovo, o centro de museu e educação de Słońsk, com uma exposição
      moderna sobre a natureza e a história da região. Tem oito salas temáticas, um voo virtual em balão sobre
      o parque e um passeio virtual de barco por águas inacessíveis ao turismo.


      Depois, os trilhos. **Ptasim szlakiem** ('Pelo trilho das aves') atravessa uma das zonas de nidificação
      mais atrativas; as melhores épocas são primavera e outono. Recomenda-se binóculos, telescópio e atlas de
      aves. Daqui observa-se de manhã a partida de gansos e grous para os locais de alimentação e à tarde o
      regresso ao dormitório — é um dos principais locais de invernada do cisne-cantor na Polónia.


      **Mokradła** aborda as funções das zonas húmidas na natureza e na economia humana, com oito painéis
      informativos. **Olszynki** atravessa a única floresta do parque, um amieiro paludoso, e continua por
      prados húmidos e caniçais; é um percurso pedonal com passadiço de madeira e dique, as bicicletas podem
      usá-lo mas têm de ser empurradas nas passadeiras. Para pedalar existe **Na dwóch kółkach przez Polder
      Północny**, um circuito de cerca de 30 km com opções mais curtas, 20 painéis informativos, 3 torres de
      observação e 6 esconderijos. **Torfianka** é um curto trilho que liga dois troços do circuito e permite
      um anel mais pequeno. Em Chyrzyno, o Jardim dos Sentidos é um pomar didático com atividades de natureza,
      pensado para famílias com crianças pequenas e acessível a pessoas com deficiência.
    history: >-
      O parque foi criado a 19 de junho de 2001 no trecho inferior do Warta, até à sua confluência com o Oder.
      O trilho Mokradła explica que o parque está abrangido pela Convenção de Ramsar e pela Natura 2000. A
      principal ameaça é o regresso de plantas altas aos prados e pastagens, o que põe em perigo os ninhos das
      aves; o parque age ativamente contra isso.
    before: >-
      O parque está aberto do amanhecer ao anoitecer: não há zonas de campismo nem locais para pernoitar, e
      permanecer nos estacionamentos à noite também é proibido. Os cães só podem passear no Pôlder Norte, a
      parte do parque a norte do Warta. Nos acessos do dique Leste existem pastores elétricos que protegem os
      animais em pastoreio: abre-se a vedação pelo cabo preto e fecha-se ao passar. Słońsk não tem transporte
      público, pelo que só é possível ir de veículo próprio.
    around: >-
      Mais longe há outras zonas húmidas de gansos e águias: o [Parque Nacional de Wolin e o delta do rio
      Świna](/lugar/wolinski-park-narodowy---delta-swiny/) partilha o cisne-cantor e a águia-de-cauda-branca,
      e o [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) o ganso-bravo e a
      águia-de-cauda-branca. Ainda mais longe, o [Parque Nacional do Delta do
      Evros](/lugar/ethniko-parko-delta-evrou/) e a [Reserva da Biosfera de
      Srebarna](/lugar/srebarna-biosphere-reserve/) partilham-nos também.
