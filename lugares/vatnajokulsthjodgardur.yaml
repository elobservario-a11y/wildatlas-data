resumen:
  es: >-
    El mayor casquete glaciar de Europa fuera del Ártico y los volcanes que arden bajo él: fuego y hielo a
    escala continental.
  en: >-
    Europe's largest ice cap outside the Arctic and the volcanoes smouldering beneath it: fire and ice on a
    continental scale.
  fr: >-
    La plus grande calotte glaciaire d'Europe hors Arctique et les volcans qui grondent sous la glace : le feu
    et la glace à l'échelle d'un continent.
  de: >-
    Europas größte Eiskappe außerhalb der Arktis und die darunter glosenden Vulkane: Feuer und Eis in
    kontinentalem Maßstab.
  it: >-
    La più grande calotta glaciale d'Europa al di fuori dell'Artico e i vulcani che covano sotto il ghiaccio:
    fuoco e gelo a scala continentale.
  pt: >-
    A maior calota de gelo da Europa fora do Ártico e os vulcões que ardem sob ela: fogo e gelo à escala
    continental.
unico:
  es: >-
    Grandes crecidas glaciares excavaron el cañón de Jökulsárgljúfur, donde todavía retumba la cascada de
    Dettifoss.
  en: >-
    Cataclysmic glacial outburst floods carved the Jökulsárgljúfur canyon, where Dettifoss waterfall still
    thunders.
  fr: >-
    De titanesques débâcles glaciaires ont creusé le canyon de Jökulsárgljúfur, où tonne toujours la cascade
    de Dettifoss.
  de: >-
    Gigantische Gletscherläufe schufen den Canyon Jökulsárgljúfur, in dem bis heute der mächtige Dettifoss
    tosend herabstürzt.
  it: >-
    Imponenti piene glaciali scavarono la forra di Jökulsárgljúfur, dove ancora scroscia la potente cascata di
    Dettifoss.
  pt: >-
    Cheias glaciares catastróficas escavaram o desfiladeiro de Jökulsárgljúfur, onde ainda ecoa o estrondo da
    cascata de Dettifoss.
observaciones:
  es: >-
    Las pistas de las tierras altas, como Askja y Kverkfjöll, solo abren en verano. En Jökulsárlón y
    Fellsfjara están prohibidos los drones entre el 15 de abril y el 15 de julio por protección de aves. Si
    caminas por Hjallanes, cierra siempre las puertas de las cercas tras cruzarlas. Antes de salir, mira los
    avisos de apertura y restricciones del parque.
texto:
  es:
    intro: >-
      Debajo del hielo hay volcanes. Esa frase resume Vatnajökull mejor que cualquier cifra: el glaciar que da
      nombre al parque, con 8.100 km², es el mayor de Europa fuera del Ártico y esconde volcanes centrales
      activos, entre ellos Bárðarbunga, el mayor, y Grímsvötn, el más activo. Fuego y hielo en el mismo mapa.
      El parque se creó el 7 de junio de 2008 y cubre unos 14.967 km², alrededor del 14 % de Islandia, lo que
      lo convierte en el segundo parque nacional más extenso de Europa tras Yugyd Va. Fue inscrito como
      Patrimonio Mundial el 5 de julio de 2019.
    landscape: >-
      Aquí la geografía la escriben las erupciones y el agua. En el oeste del parque se produjeron dos de las
      mayores erupciones fisurales de la historia: Eldgjá, en 934, y Lakagígar, en 1783-1784. En 1362, el
      volcán bajo Öræfajökull entró en erupción y destruyó el asentamiento de la región de Öræfi. Y en el
      frente de Skeiðarárjökull, las crecidas glaciares repetidas han acumulado de forma masiva sedimentos
      glaciofluviales.


      El clima reparte la lluvia de forma desigual. Al norte del glaciar queda la zona más seca de Islandia,
      mientras que sus bordes suroccidental, sur y oriental reciben las mayores precipitaciones del país. De
      ahí que sobre las formaciones volcánicas más húmedas del suroeste mande el musgo, sobre todo
      *Racomitrium lanuginosum*, y que sobre las lavas de Krepputunga y Ódáðahraun prospere el liquen
      *Stereocaulon vesuvianum*.


      Entre llanura y llanura hay mucha variedad: llanuras glaciares sin plantas, vegetación continua de
      tierras altas, humedales, oasis exuberantes en el borde de los campos de lava, mantos de musgo, brezales
      y abedulares. Eyjabakkar guarda uno de los mayores humedales de las tierras altas. En Skaftafell, las
      laderas bajas son de abedul, con serbales dispersos, y por todas partes hay campanillas, saxífraga
      amarilla y saxífraga alpina. Svartifoss cae enmarcada por columnas de basalto gruesas y simétricas. Y en
      los manantiales y grietas subterráneas viven anfípodos que se originaron en la era glacial.
    wildlife: >-
      Los humedales en torno a Snæfell son un hábitat importante para el [reno](/especie/rangifer_tarandus/) y
      el ánsar piquicorto. En Heinaberg los renos se pueden ver sobre todo en invierno. Eyjabakkar es uno de
      los lugares más importantes donde se concentran los ánsares piquicortos para mudar el plumaje.


      En el sur, Skeiðarársandur y Breiðamerkursandur son áreas de cría del [págalo
      grande](/especie/stercorarius_skua/), el falaropo picogrueso y la barnacla cariblanca. En primavera y a
      comienzos del verano, el camino a Svartifoss tiene mucha vida de aves en cría: ve con cuidado, porque
      están criando. En el pie de las montañas del borde sureste vive el mayor escarabajo del país, *Carabus
      problematicus*, y los ríos y lagos conservan formas locales de salvelinos y truchas, algunas aisladas
      desde el final de la glaciación.


      El censo invernal de Skaftafell de enero recogió pardillos árticos y lagópodos entre las aves
      habituales.
    visit: >-
      Skaftafell es la entrada más fácil: está junto a la carretera 1, y las poblaciones más cercanas son
      Kirkjubæjarklaustur y Höfn. Skaftafellsstofa abre todo el año y sus guardas explican la naturaleza y las
      rutas. Desde allí parte la Jökulslóð, que acaba junto al glaciar Skaftafellsjökull y es una lección viva
      sobre cómo retrocede un glaciar. Del 15 de junio al 15 de agosto, los guardas organizan paseos
      interpretativos cortos y fáciles, adecuados para la mayoría.


      Hay más caminos. El Skógarstígur recorre cuatro kilómetros desde Gljúfrastofa y se calcula entre una y
      dos horas. El circuito de Hjallanes/Skálafellsjökull mide 8 km, lleva de tres a cuatro horas y tiene 140
      m de desnivel. En Heinabergslón, un sendero corto con paneles explica la desaparición de los glaciares,
      y en el fondo de Ásbyrgi hay una senda sobre los usos de las plantas y su folclore.


      Cada rincón tiene su centro. Gljúfrastofa, en Ásbyrgi, abre todo el año y alberga una exposición
      educativa sobre el parque. Gígur, en Mývatnssveit, abre todo el año. Skaftárstofa, junto a
      Kirkjubæjarklaustur, combina información territorial con la exposición *Life with Nature*.
      Snæfellsstofa, en Skriðuklaustur, presenta *The World's Wheel*, sobre ciclos naturales, flora, fauna y
      renos, y es accesible para personas con movilidad reducida. En verano, Hrauneyjar informa sobre las
      rutas y los caminos de Sprengisandur y Fjallabak. Además, las estaciones de guardas de Askja,
      Jökulsárlón, Eldgjá, Herðubreiðarlindir, Hvannalindir, Kverkfjöll, Laki, Nýidalur y Snæfell ejercen de
      puntos de información y educación.
    history: >-
      Skaftafell fue una granja señorial y lugar de asamblea local en la Edad Media. Hoy el reto es el hielo:
      la UNESCO advierte de que el retroceso del glaciar se ha acelerado por el calentamiento global. La
      tercera edición del plan de gestión entró en vigor el 5 de julio de 2022.
    before: >-
      Las pistas de las tierras altas, como Askja y Kverkfjöll, solo abren en verano. En Jökulsárlón y
      Fellsfjara están prohibidos los drones entre el 15 de abril y el 15 de julio por protección de aves. Si
      caminas por Hjallanes, cierra siempre las puertas de las cercas tras cruzarlas. Antes de salir, mira los
      avisos de apertura y restricciones del parque.
    around: >-
      Vatnajökull no tiene vecinos cercanos en el atlas, pero sí lugares afines. La [Reserva Natural de
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/) y el [Parque Nacional de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) comparten zorro ártico y
      reno, y ambientes glaciares y de alta montaña. [Fair Isle](/lugar/fair-isle/) y la [Reserva Natural
      Nacional de Hermaness](/lugar/hermaness-national-nature-reserve/) coinciden en págalo grande y
      frailecillo.
  en:
    intro: >-
      Beneath the ice lie active volcanoes. That simple fact encapsulates Vatnajökull better than any dry
      statistic: the ice cap that lends its name to the national park, covering 8,100 km², is Europe's largest
      outside the polar Arctic and conceals active central volcanoes, including Bárðarbunga, the highest, and
      Grímsvötn, the most frequently erupting. Fire and ice intertwine across the same map. The national park
      was established on 7 June 2008 and encompasses roughly 14,967 km²—around 14% of Iceland—making it
      Europe's second-largest national park after Yugyd Va. It was inscribed on the World Heritage List on 5
      July 2019.
    landscape: >-
      Here geographic reality is dictated by volcanism and meltwater. The western sector witnessed two of
      history's greatest basalt fissure eruptions: Eldgjá in 934 and Lakagígar in 1783-1784. In 1362, the
      subglacial volcano beneath Öræfajökull erupted violently, obliterating the historic settlement of Öræfi.
      Along the snout of Skeiðarárjökull, repeated jökulhlaups—catastrophic glacial outburst floods—have
      deposited vast plains of glaciofluvial outwash sediments.


      The climate distributes precipitation unevenly. North of the ice cap lies the most arid territory in
      Iceland, while the south-western, southern, and eastern margins receive the country's highest rainfall
      totals. Consequently, the damp volcanic slopes of the south-west are cushioned by deep moss carpets,
      particularly *Racomitrium lanuginosum*, while the barren lava fields of Krepputunga and Ódáðahraun are
      colonized by the lichen *Stereocaulon vesuvianum*.


      Between desolate outwash plains lie remarkable contrasting habitats: barren sandur plains, continuous
      upland tundra, wetlands, verdant oases nestled at lava margins, moss heaths, and subarctic birchwoods.
      Eyjabakkar protects one of Iceland's largest highland wetlands. At Skaftafell, lower mountain flanks are
      covered in downy birch interspersed with rowan, with harebell, yellow mountain saxifrage, and alpine
      saxifrage blooming across rock ledges. Svartifoss waterfall tumbles over towering, symmetrical hexagonal
      basalt columns. Subterranean springs and fissures even shelter endemic groundwater amphipods originating
      from the Ice Age.
    wildlife: >-
      The wetlands encircling Snæfell provide critical habitat for wild
      [reindeer](/especie/rangifer_tarandus/) and pink-footed geese. At Heinaberg reindeer herds are observed
      predominantly in winter. Eyjabakkar represents one of the world's most significant moulting gatherings
      for pink-footed geese.


      In the south, Skeiðarársandur and Breiðamerkursandur are vital nesting territories for the [great
      skua](/especie/stercorarius_skua/), red-necked phalarope, and barnacle goose. In spring and early
      summer, the trail leading to Svartifoss teems with breeding birds: take care to avoid disturbing nesting
      pairs. Beneath the south-eastern mountain margins lives Iceland's largest ground beetle, *Carabus
      problematicus*, while regional lakes and meltwater streams maintain unique relict populations of Arctic
      char and brown trout, isolated since the retreat of the Pleistocene ice.


      Winter bird surveys in Skaftafell in January regularly document Arctic redpolls and rock ptarmigan among
      resident species.
    visit: >-
      Skaftafell serves as the primary entrance hub, situated directly beside Route 1, with the closest
      service communities being Kirkjubæjarklaustur and Höfn. Skaftafellsstofa visitor centre remains open
      year-round, offering ranger guidance and trail updates. From here departs the Jökulslóð trail, leading
      to the terminus of Skaftafellsjökull glacier as a living showcase of glacial recession. From 15 June to
      15 August, park rangers conduct short, accessible interpretive walks suitable for all visitors.


      Further hiking trails branch across the park. The Skógarstígur covers four kilometres from Gljúfrastofa,
      taking between one and two hours. The Hjallanes/Skálafellsjökull loop measures 8 km, requiring three to
      four hours with 140 m of elevation change. At Heinabergslón, a brief interpretive path details the
      retreat of glaciers, while the sheltered floor of Ásbyrgi features an ethnobotanical trail on
      traditional plant lore.


      Each regional sector features a dedicated visitor facility. Gljúfrastofa in Ásbyrgi operates year-round
      with comprehensive interactive exhibits. Gígur in Mývatnssveit is open all year. Skaftárstofa near
      Kirkjubæjarklaustur pairs regional route guidance with the *Life with Nature* exhibition. Snæfellsstofa
      in Skriðuklaustur features *The World's Wheel*, exploring natural cycles, wildlife, and reindeer
      ecology, and is fully wheelchair accessible. In summer, Hrauneyjar provides real-time information for
      mountain tracks across Sprengisandur and Fjallabak. In addition, ranger outposts at Askja, Jökulsárlón,
      Eldgjá, Herðubreiðarlindir, Hvannalindir, Kverkfjöll, Laki, Nýidalur, and Snæfell act as local education
      and assistance stations.
    history: >-
      Skaftafell was an important manorial farm and local assembly site throughout the Middle Ages. Today the
      central challenge is ice dynamics: UNESCO underscores that glacial melting and retreat have accelerated
      dramatically under anthropogenic climate warming. The third edition of the park's integrated management
      plan entered into force on 5 July 2022.
    before: >-
      Mountain tracks in the interior highlands, including routes to Askja and Kverkfjöll, open strictly in
      summer. At Jökulsárlón and Fellsfjara, drone flying is prohibited between 15 April and 15 July to
      protect breeding bird colonies. When hiking trails in Hjallanes, always close all livestock gates after
      passing through. Consult official road opening conditions and weather alerts before venturing into the
      backcountry.
    around: >-
      Vatnajökull has no directly adjacent sites in the atlas, but shares ecological traits with comparable
      northern landscapes. [Helagsfjället Nature Reserve](/lugar/helagsfjallet-nature-reserve/) and
      [Dovrefjell-Sunndalsfjella National Park](/lugar/dovrefjell-sunndalsfjella-national-park/) share Arctic
      fox and wild reindeer alongside glacial and high-alpine biotopes. [Fair Isle](/lugar/fair-isle/) and
      [Hermaness National Nature Reserve](/lugar/hermaness-national-nature-reserve/) share nesting great skuas
      and Atlantic puffins.
  fr:
    intro: >-
      Sous la glace grondent des volcans. Cette formule résume le Vatnajökull mieux que tout discours : le
      glacier éponyme, couvrant 8 100 km², constitue la plus vaste calotte glaciaire d'Europe en dehors de
      l'Arctique et dissimule des volcans centraux actifs, dont le Bárðarbunga, point culminant, et le
      Grímsvötn, le plus actif du pays. Feu et glace réunis sur la même carte. Créé le 7 juin 2008, le parc
      national englobe environ 14 967 km² — près de 14 % du territoire islandais —, ce qui en fait le deuxième
      plus vaste parc national d'Europe après Yugyd Va. Il a été inscrit au Patrimoine mondial de l'UNESCO le
      5 juillet 2019.
    landscape: >-
      Ici, la géographie est façonnée par les éruptions et les eaux de fonte. L'ouest du parc fut le théâtre
      de deux des plus monumentales éruptions fissurales de l'histoire humaine : l'Eldgjá en 934 et les
      Lakagígar en 1783-1784. En 1362, le volcan sous-glaciaire de l'Öræfajökull entra en éruption explosive,
      anéantissant les communautés agricoles de l'Öræfi. Au front du Skeiðarárjökull, les crues glaciaires
      répétées (jökulhlaup) ont accumulé d'immenses plaines alluviales glaciofluviales.


      Le climat dispense les précipitations de façon très inégale. Au nord de la calotte s'étend la zone la
      plus sèche d'Islande, tandis que ses marges sud-ouest, sud et est enregistrent les records
      pluviométriques de l'île. C'est pourquoi les laves humides du sud-ouest s'habillent d'épais tapis de
      mousses, notamment *Racomitrium lanuginosum*, tandis que les coulées arides de Krepputunga et de
      l'Ódáðahraun sont colonisées par le lichen *Stereocaulon vesuvianum*.


      Entre ces étendues s'ordonne une variété saisissante : sandurs dénudés, toundras d'altitude, tourbières,
      oasis verdoyantes en bordure de coulées basaltiques, landes et bétulaies subarctiques. Eyjabakkar
      protège l'une des plus vastes zones humides des hautes terres. À Skaftafell, les pentes inférieures
      portent des forêts de bouleaux tortueux mêlés de sorbiers, égayées de campanules, de saxifrages jaunes
      et de saxifrages étoilées. La cascade de Svartifoss se jette d'une muraille d'orgues basaltiques
      hexagonales parfaites. Dans les sources et failles souterraines survivent des amphipodes d'eau douce
      relectuels de l'ère glaciaire.
    wildlife: >-
      Les tourbières et marais entourant le Snæfell constituent un sanctuaire majeur pour le
      [renne](/especie/rangifer_tarandus/) et l'oie à bec court. À Heinaberg, les hardes de rennes s'observent
      principalement au cours de l'hiver. Eyjabakkar accueille l'un des plus importants rassemblements de mue
      de l'oie à bec court au monde.


      Dans le sud, le Skeiðarársandur et le Breiðamerkursandur forment des aires de nidification réputées pour
      le [grand labbe](/especie/stercorarius_skua/), le phalarope à bec large et la bernache nonnette. Au
      printemps et au début de l'été, le sentier montant à Svartifoss abonde en oiseaux nicheurs : veillez à
      ne pas déranger les couvées. Au pied des montagnes du sud-est vit le plus grand coléoptère de l'île,
      *Carabus problematicus*, tandis que les ruisseaux et lacs conservent des formes endémiques d'ombles
      chevaliers et de truites, isolées depuis la fin de la dernière glaciation.


      Le recensement hivernal de janvier à Skaftafell enregistre régulièrement le sizerin blanchâtre et le
      lagopède alpin parmi les oiseaux sédentaires.
    visit: >-
      Skaftafell constitue la porte d'entrée la plus accessible : le site jouxte la route 1, à proximité de
      Kirkjubæjarklaustur et de Höfn. La maison du parc Skaftafellsstofa ouvre toute l'année et ses gardes
      vous orientent sur les sentiers et la météo. De là s'élance la Jökulslóð, menant au front glaciaire du
      Skaftafellsjökull, témoignage saisissant du recul des glaces. Du 15 juin au 15 août, les rangers animent
      des sorties d'interprétation courtes et accessibles à tous.


      D'autres itinéraires parcourent le territoire. Le Skógarstígur déroule quatre kilomètres depuis
      Gljúfrastofa pour une durée d'une à deux heures. La boucle de Hjallanes/Skálafellsjökull totalise 8 km,
      demande de trois à quatre heures et présente 140 m de dénivelé. À Heinabergslón, un sentier jalonné de
      panneaux illustre la fonte glaciaire, tandis qu'au fond du cirque d'Ásbyrgi un circuit explore les
      usages traditionnels des plantes.


      Chaque secteur dispose d'une infrastructure dédiée. Gljúfrastofa à Ásbyrgi ouvre toute l'année avec une
      exposition permanente. Gígur à Mývatnssveit accueille le public toute l'année. Skaftárstofa près de
      Kirkjubæjarklaustur allie conseils routiers et exposition *Life with Nature*. Snæfellsstofa à
      Skriðuklaustur présente *The World's Wheel*, dédiée aux cycles biologiques et aux rennes, et offre une
      accessibilité totale aux personnes à mobilité réduite. En été, Hrauneyjar renseigne sur l'état des
      pistes de Sprengisandur et Fjallabak. Enfin, les postes de gardes d'Askja, Jökulsárlón, Eldgjá,
      Herðubreiðarlindir, Hvannalindir, Kverkfjöll, Laki, Nýidalur et Snæfell assurent l'accueil sur le
      terrain.
    history: >-
      Skaftafell fut un important domaine seigneurial et lieu d'assemblée locale au Moyen Âge. Aujourd'hui,
      l'enjeu crucial réside dans la fonte des glaces : l'UNESCO rappelle que le recul glaciaire s'est
      spectaculairement accéléré sous l'effet du changement climatique global. La troisième mouture du plan de
      gestion est entrée en vigueur le 5 juillet 2022.
    before: >-
      Les pistes des hautes terres intérieures, comme celles d'Askja et de Kverkfjöll, ne sont praticables
      qu'en été. À Jökulsárlón et Fellsfjara, le survol en drone est formellement interdit du 15 avril au 15
      juillet pour préserver les colonies d'oiseaux marins. Si vous marchez à Hjallanes, refermez
      systématiquement les barrières après votre passage. Consultez scrupuleusement les avis d'ouverture des
      pistes avant tout déplacement.
    around: >-
      Le Vatnajökull ne compte pas de voisins directs dans l'atlas, mais partage des analogies avec d'autres
      espaces boréaux. La [réserve naturelle de Helagsfjället](/lugar/helagsfjallet-nature-reserve/) et le
      [parc national de Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) partagent
      le renard polaire et le renne en milieu glaciaire et alpin. [Fair Isle](/lugar/fair-isle/) et la
      [réserve naturelle nationale de Hermaness](/lugar/hermaness-national-nature-reserve/) hébergent
      également le grand labbe et le macareux moine.
  de:
    intro: >-
      Unter dem Eis brodeln Vulkane. Dieser Satz fasst den Vatnajökull treffender zusammen als jede Statistik:
      Der namensgebende Gletscher bedeckt 8.100 km² und ist damit Europas größte Eiskappe außerhalb der
      Arktis. Unter seinem Eispanzer schlummern aktive Zentralvulkane, darunter die Bárðarbunga als
      mächtigstes Massiv und die Grímsvötn als aktivster Vulkan. Feuer und Eis auf einer einzigen Landkarte.
      Der Nationalpark wurde am 7. Juni 2008 gegründet und umfasst rund 14.967 km² — etwa 14 % der
      Landesfläche Islands —, was ihn nach Jugyd Wa zum zweitgrößten Nationalpark Europas macht. Am 5. Juli
      2019 wurde das Gebiet in das UNESCO-Welterbe aufgenommen.
    landscape: >-
      Hier formen Vulkanausbrüche und Schmelzwasserströme die Landschaft. Im Westen des Schutzgebiets
      ereigneten sich zwei der verheerendsten Spalteneruptionen der Weltgeschichte: Eldgjá im Jahr 934 und die
      Laki-Krater (Lakagígar) in den Jahren 1783-1784. Im Jahr 1362 brach der Vulkan unter dem Öræfajökull aus
      und vernichtete die historische Siedlung Öræfi vollständig. Am Gletschertor des Skeiðarárjökull lagerten
      katastrophale Gletscherläufe (Jökulhlaups) gigantische Sedimentmengen in den Schwemmebenen ab.


      Das Gebirgsklima verteilt die Niederschläge extrem ungleichmäßig. Nördlich des Gletschers erstreckt sich
      die trockenste Region ganz Islands, während die Südwest-, Süd- und Ostflanken die ergiebigsten
      Regenfälle des Landes verzeichnen. Daher überziehen dichte Moosteppiche, insbesondere aus *Racomitrium
      lanuginosum*, die feuchten Laven im Südwesten, während auf den trockenen Lavafeldern von Krepputunga und
      Ódáðahraun die Flechte *Stereocaulon vesuvianum* dominiert.


      Die Landschaftsformen wechseln jäh: vegetationslose Sandurwüsten, geschlossene Hochlandtundren,
      ausgedehnte Moore, grüne Oasen an den Lavarändern, Zwergstrauchheiden und subarktische Birkenwälder.
      Eyjabakkar birgt eines der bedeutendsten Feuchtgebiete des Hochlands. Bei Skaftafell tragen die unteren
      Hänge Birkenwälder mit eingestreuten Vogelbeeren; an Felsbändern blühen Rundblättrige Glockenblumen,
      Moor-Steinbrech und Stern-Steinbrech. Der Svartifoss stürzt über vollkommen regelmäßige sechseckige
      Basaltsäulen ab. In unterirdischen Quellen und Basaltspalten überdauerten Grundwasser-Flohkrebse seit
      der letzten Eiszeit.
    wildlife: >-
      Die Feuchtgebiete rund um den Snæfell bilden einen vitalen Sommerlebensraum für wilde
      [Rentiere](/especie/rangifer_tarandus/) und Kurzschnabelgänse. Bei Heinaberg lassen sich Rentiere vor
      allem in den Wintermonaten antreffen. Eyjabakkar gilt weltweit als eines der bedeutendsten Mausergebiete
      der Kurzschnabelgans.


      Im Süden sind Skeiðarársandur und Breiðamerkursandur wichtige Brutreviere für die [Große
      Raubmöwe](/especie/stercorarius_skua/), das Thorshühnchen und die Weißwangengans. Im Frühjahr und
      Frühsommer herrscht entlang des Weges zum Svartifoss reges Brutgeschehen: Nimm bitte Rücksicht auf
      nistende Vögel. Am Fuß der Berge im Südosten lebt Islands größter Laufkäfer, *Carabus problematicus*,
      während Kaltwasserbäche und Gletscherseen relictäre Populationen von Seesaiblingen und Forellen
      bewahren, die seit dem Eiszeitalter isoliert sind.


      Die winterliche Vogelzählung im Januar in Skaftafell erfasst regelmäßig Polarbirkenzeisige und
      Alpenschneehühner unter den Standvögeln.
    visit: >-
      Skaftafell bietet den einfachsten Einstieg: Es liegt direkt an der Ringstraße 1, unweit von
      Kirkjubæjarklaustur und Höfn. Das Besucherzentrum Skaftafellsstofa ist ganzjährig geöffnet; die Ranger
      beraten dich zu Wetter und Wanderrouten. Hier beginnt der Lehrpfad Jökulslóð, der bis an die
      Gletscherzunge des Skaftafellsjökull führt und den rasanten Gletscherrückgang eindrücklich vor Augen
      führt. Vom 15. Juni bis zum 15. August bieten Parkranger kurze, leicht verständliche Naturführungen für
      jedermann an.


      Weitere Wanderwege erschließen die Umgebung. Der Skógarstígur misst vier Kilometer ab Gljúfrastofa bei
      einer Gehzeit von ein bis zwei Stunden. Der Rundweg Hjallanes/Skálafellsjökull erstreckt sich über 8 km,
      beansprucht drei bis vier Stunden und überwindet 140 m Höhenunterschied. Am Heinabergslón erläutert ein
      kurzer Pfad das Abschmelzen der Eismassen, und im Canyon Ásbyrgi vermittelt ein Lehrpfad die
      traditionelle Nutzung der Pflanzenwelt.


      Jeder Parksektor unterhält eigene Informationszentren. Gljúfrastofa in Ásbyrgi hat das ganze Jahr über
      geöffnet. Gígur im Mývatnssveit ist ganzjährig zugänglich. Skaftárstofa bei Kirkjubæjarklaustur vereint
      Reiseauskünfte mit der Ausstellung *Life with Nature*. Snæfellsstofa in Skriðuklaustur widmet sich mit
      der Schau *The World's Wheel* den Naturkreisläufen und Rentieren und ist vollständig barrierefrei
      gestaltet. Im Sommer informiert Hrauneyjar über die Hochlandpisten von Sprengisandur und Fjallabak.
      Zusätzlich dienen die Rangerstationen Askja, Jökulsárlón, Eldgjá, Herðubreiðarlindir, Hvannalindir,
      Kverkfjöll, Laki, Nýidalur und Snæfell als wichtige Anlaufstellen.
    history: >-
      Skaftafell war im Mittelalter ein wohlhabender Gutshof und regionaler Versammlungsort. Heute steht der
      Klimawandel im Fokus: Die UNESCO mahnt, dass das Abschmelzen der Gletscherzungen infolge der
      Erderwärmung dramatisch an Fahrt gewonnen hat. Die dritte Fassung des Nationalpark-Managementplans trat
      am 5. Juli 2022 in Kraft.
    before: >-
      Die Hochlandpisten im Inselinneren, darunter die Strecken nach Askja und Kverkfjöll, sind ausschließlich
      im Sommer befahrbar. An der Gletscherlagune Jökulsárlón und am Strand Fellsfjara gilt vom 15. April bis
      zum 15. Juli ein striktes Drohnenflugverbot zum Schutz der Brutvögel. Schließe auf der
      Hjallanes-Wanderung stets alle Weidegatter hinter dir. Prüfe vor jeder Tour die offiziellen
      Straßenzustandsberichte und Parkhinweise.
    around: >-
      Der Nationalpark hat keine unmittelbaren Nachbarn im Atlas, weist jedoch biogeographische Parallelen zu
      anderen arktisch-alpinen Räumen auf. Das [Naturreservat
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/) und der
      [Dovrefjell-Sunndalsfjella-Nationalpark](/lugar/dovrefjell-sunndalsfjella-national-park/) teilen
      Polarfuchs und Rentier in eiszeitlich geprägten Hochgebirgen. [Fair Isle](/lugar/fair-isle/) und das
      [Nationale Naturreservat Hermaness](/lugar/hermaness-national-nature-reserve/) teilen Große Raubmöwe und
      Papageitaucher an subpolaren Felsküsten.
  it:
    intro: >-
      Sotto la coltre di ghiaccio covano i vulcani. Questa constatazione descrive il Vatnajökull meglio di
      qualsiasi cifra: il ghiacciaio che dà il nome al parco, esteso per 8.100 km², è il più imponente
      d'Europa oltre l'Artico e cela vulcani centrali attivi, tra cui il Bárðarbunga, il più elevato, e il
      Grímsvötn, il più eruttivo. Fuoco e ghiaccio nello stesso comprensorio. Il parco fu istituito il 7
      giugno 2008 e racchiude circa 14.967 km², ossia circa il 14% dell'Islanda, affermandosi come il secondo
      parco nazionale più esteso d'Europa dopo Jugyd Va. È stato iscritto nel Patrimonio Mondiale dell'UNESCO
      il 5 luglio 2019.
    landscape: >-
      In questo territorio la geografia è dettata dalle eruzioni e dalle acque di fusione. Nel settore
      occidentale si verificarono due delle maggiori eruzioni fessurali della storia: Eldgjá nel 934 e
      Lakagígar nel 1783-1784. Nel 1362 il vulcano subglaciale sotto l'Öræfajökull eruttò violentemente
      distruggendo l'insediamento rurale di Öræfi. Presso la fronte dello Skeiðarárjökull, le ripetute piene
      glaciali catastrofiche (jökulhlaup) hanno depositato sterminate piane di sedimenti fluvioglaciali.


      Il clima ripartisce le precipitazioni in modo marcatamente difforme. A nord della calotta si colloca la
      regione più asciutta d'Islanda, mentre i margini sudoccidentale, meridionale e orientale registrano i
      massimi pluviometrici dell'isola. Ne consegue che sulle lave umide del sud-ovest prosperano spessi
      cuscini di muschio, in particolare *Racomitrium lanuginosum*, mentre sui campi lavici aridi di
      Krepputunga e Ódáðahraun predomina il lichene *Stereocaulon vesuvianum*.


      Tra una distesa e l'altra si schiude una notevole varietà: sandur privi di vegetazione, tundre
      d'altopiano, torbiere, oasi riparate al limite dei campi di lava, brughiere e boschi di betulla
      pubescente. Eyjabakkar racchiude una delle più estese zone umide montane d'Islanda. A Skaftafell i
      versanti basali accolgono betulle miste a rari sorbi, con campanule e sassifraghe fiorite sulle cenge.
      La cascata Svartifoss precipita incorniciata da prismi basaltici esagonali perfetti. Nelle sorgenti e
      spaccature sotterranee sopravvivono anfipodi relitti risalenti all'era glaciale.
    wildlife: >-
      Le zone umide intorno al massiccio dello Snæfell rappresentano un habitat insostituibile per la
      [renna](/especie/rangifer_tarandus/) selvatica e l'oca zamperosee. A Heinaberg le renne si concentrano
      in particolare durante la stagione invernale. Eyjabakkar è uno dei luoghi di muta più importanti al
      mondo per l'oca zamperosee.


      A sud, lo Skeiðarársandur e il Breiðamerkursandur costituiscono aree di cova cruciali per lo
      [stercorario maggiore](/especie/stercorarius_skua/), il falaropo beccolargo e l'oca facciabianca. In
      primavera e a inizio estate il sentiero per Svartifoss pullula di uccelli in cova: cammina con riguardo
      per non disturbarli. Ai piedi delle creste sud-orientali abita il coleottero più grande d'Islanda,
      *Carabus problematicus*, mentre laghi e corsi d'acqua conservano popolazioni endemiche di salmerino
      alpino e trota fario, rimaste isolate dal termine della glaciazione.


      Il censimento ornitologico invernale condotto a gennaio a Skaftafell registra regolarmente l'organetto
      artico e la pernice bianca tra le specie residenti.
    visit: >-
      Skaftafell costituisce il varco d'accesso più immediato: sorge lungo la strada statale 1, a breve
      distanza da Kirkjubæjarklaustur e Höfn. Il centro visitatori Skaftafellsstofa apre tutto l'anno; i
      guardaparco illustrano la rete dei sentieri e la sicurezza. Da qui parte il sentiero Jökulslóð, che
      giunge ai piedi del ghiacciaio Skaftafellsjökull mostrando dal vivo il ritiro della fronte glaciale. Dal
      15 giugno al 15 agosto i ranger organizzano brevi passeggiate naturalistiche guidate adatte a tutti.


      Vi sono altri itinerari. Il sentiero Skógarstígur copre quattro chilometri da Gljúfrastofa per una
      durata compresa tra una e due ore. Il percorso circolare di Hjallanes/Skálafellsjökull misura 8 km,
      richiede da tre a quattro ore e supera 140 m di dislivello. A Heinabergslón un tracciato con tabelle
      didattiche illustra l'arretramento dei ghiacci, mentre sul fondovalle di Ásbyrgi un percorso
      approfondisce gli usi tradizionali della flora locale.


      Ciascun comparto vanta la propria struttura. Gljúfrastofa ad Ásbyrgi è aperto tutto l'anno con mostre
      educative. Gígur a Mývatnssveit opera tutto l'anno. Skaftárstofa a Kirkjubæjarklaustur affianca alle
      indicazioni stradali la mostra *Life with Nature*. Snæfellsstofa a Skriðuklaustur propone l'esposizione
      *The World's Wheel*, imperniata su cicli stagionali e renne, con accessibilità per persone a mobilità
      ridotta. D'estate Hrauneyjar aggiorna sulla viabilità interna di Sprengisandur e Fjallabak. Inoltre, i
      presidi dei ranger ad Askja, Jökulsárlón, Eldgjá, Herðubreiðarlindir, Hvannalindir, Kverkfjöll, Laki,
      Nýidalur e Snæfell fungono da punti di supporto e divulgazione.
    history: >-
      Skaftafell fu una tenuta padronale e sede di assemblee legislative comunitarie durante il Medioevo. Oggi
      la sfida principale è la conservazione del ghiaccio: l'UNESCO sottolinea come il regresso dei fronti
      glaciali abbia subito una forte accelerazione a causa del riscaldamento climatico. La terza edizione del
      piano di gestione è entrata in vigore il 5 luglio 2022.
    before: >-
      Le piste sterrate degli altopiani centrali, come i raccordi per Askja e Kverkfjöll, aprono unicamente
      nei mesi estivi. A Jökulsárlón e Fellsfjara vige il divieto assoluto di pilotare droni dal 15 aprile al
      15 luglio per tutelare l'avifauna nidificante. Se percorri i recinti di Hjallanes, richiudi sempre i
      cancelli alle tue spalle. Verifica lo stato di transitabilità delle piste sul portale del parco prima di
      partire.
    around: >-
      Il Vatnajökull non confina con aree dell'atlas, ma condivide precise affinità biogeografiche con altri
      paesaggi nordici. La [Riserva naturale di Helagsfjället](/lugar/helagsfjallet-nature-reserve/) e il
      [Parco nazionale Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) condividono
      la volpe artica, la renna e gli habitat di tundra periglaciale. [Fair Isle](/lugar/fair-isle/) e la
      [Riserva naturale nazionale di Hermaness](/lugar/hermaness-national-nature-reserve/) ospitano lo
      stercorario maggiore e la pulcinella di mare.
  pt:
    intro: >-
      Debaixo do gelo ardem vulcões. Esta realidade traduz o Vatnajökull com mais vigor do que qualquer
      estatística: o glaciar que dá nome ao parque, com 8.100 km², constitui a maior calota de gelo da Europa
      além do Ártico e esconde vulcões centrais ativos, com destaque para o Bárðarbunga, o mais alto, e o
      Grímsvötn, o mais frequente em erupções. Fogo e gelo no mesmo enquadramento geográfico. O parque
      nacional foi estabelecido a 7 de junho de 2008 e abrange cerca de 14.967 km² — aproximadamente 14% do
      território islandês —, sendo o segundo maior parque nacional da Europa a seguir a Yugyd Va. Foi inscrito
      na lista do Património Mundial da UNESCO a 5 de julho de 2019.
    landscape: >-
      Aqui a geografia resulta de violentos episódios vulcânicos e caudais de degelo. No setor ocidental
      ocorreram duas das maiores erupções fissurais da história humana: Eldgjá em 934 e Lakagígar em
      1783-1784. Em 1362, o vulcão sob a calota de Öræfajökull entrou em violenta atividade, varrendo as
      povoações rurais de Öræfi. Junto à frente glaciar de Skeiðarárjökull, as repetidas cheias glaciares
      torrenciais (jökulhlaup) acumularam imensas planícies de aluviões glaciofluviais.


      O clima reparte a precipitação com enorme assimetria. A norte do glaciar estende-se a faixa mais seca da
      Islândia, ao passo que as orlas sudoeste, sul e este registam os índices de pluviosidade mais
      expressivos do país. Assim, sobre os campos de lava húmidos do sudoeste dominam grossos tapetes de
      musgo, sobretudo *Racomitrium lanuginosum*, enquanto nas escoadas áridas de Krepputunga e Ódáðahraun
      vinga o líquen *Stereocaulon vesuvianum*.


      Entre planícies e desfiladeiros abre-se um quadro diversificado: planícies aluviais desprovidas de
      vegetação, tundras contínuas de montanha, turfeiras, oásis abrigados na margem de campos de lava,
      charnecas e bosques de bétulas. Eyjabakkar preserva uma das maiores zonas húmidas de montanha do país.
      Em Skaftafell, as encostas inferiores acolhem bétulas acompanhadas por tramazeiras esparsas, florindo
      campânulas e saxífragas amarelas e alpinas nas fendas rochosas. A cascata de Svartifoss precipita-se
      emoldurada por colunas de basalto hexagonais perfeitas. Em nascentes e fendas subterrâneas habitam
      anfípodes relíquias da era glaciar.
    wildlife: >-
      As zonas húmidas em torno do monte Snæfell formam um biótopo primordial para a
      [rena](/especie/rangifer_tarandus/) selvagem e o ganso-de-bico-curto. Em Heinaberg as renas
      concentram-se sobretudo na estação invernal. Eyjabakkar figura entre os mais determinantes locais de
      concentração mundial do ganso-de-bico-curto durante a muda da plumagem.


      A sul, o Skeiðarársandur e o Breiðamerkursandur constituem zonas de nidificação fundamentais para o
      [moleiro-grande](/especie/stercorarius_skua/), o falaropo-de-bico-grosso e o ganso-de-faces-brancas. Na
      primavera e no início do estio, o percurso pedestre até Svartifoss regista intensa atividade de aves
      reprodutoras: caminha com precaução para não perturbar os ninhos. No sopé das cristas do sudeste vive o
      maior escaravelho da Islândia, *Carabus problematicus*, enquanto rios e lagoas conservam formas locais
      de salvelino-ártico e truta, isoladas desde o fim do período glaciar.


      O censo ornitológico invernal de janeiro em Skaftafell regista com frequência o
      pintarroxo-de-bico-amarelo e a lagópode-branca entre as aves residentes.
    visit: >-
      Skaftafell é a entrada mais cómoda: fica junto à estrada 1, situando-se nas imediações de
      Kirkjubæjarklaustur e Höfn. O centro Skaftafellsstofa está aberto todo o ano e a equipa de guardas
      esclarece sobre trajetos e meteorologia. Dali arranca o caminho Jökulslóð, que alcança a frente terminal
      do glaciar Skaftafellsjökull, ilustrando o recuo das massas de gelo. De 15 de junho a 15 de agosto, os
      vigilantes organizam caminhadas temáticas acessíveis a todos os visitantes.


      Existem outros trilhos balizados. O Skógarstígur perfaz quatro quilómetros a partir de Gljúfrastofa, com
      duração estimada entre uma e duas horas. O circuito de Hjallanes/Skálafellsjökull atinge 8 km, demora de
      três a quatro horas e supera 140 m de desnível. Em Heinabergslón, uma rota com painéis foca o degelo dos
      glaciares, e no fundo de Ásbyrgi há um trilho sobre os usos medicinais e folclore das plantas locais.


      Cada setor comarca dispõe de apoio ao visitante. Gljúfrastofa em Ásbyrgi funciona todo o ano. Gígur em
      Mývatnssveit está disponível o ano inteiro. Skaftárstofa, perto de Kirkjubæjarklaustur, conjuga
      informações de trânsito com a exposição *Life with Nature*. Snæfellsstofa em Skriðuklaustur acolhe a
      exposição *The World's Wheel*, dedicada aos ciclos ecológicos e às renas, contando com acessibilidade
      total para mobilidade reduzida. No verão, Hrauneyjar apoia os condutores nas pistas de Sprengisandur e
      Fjallabak. Além disso, postos de guardas em Askja, Jökulsárlón, Eldgjá, Herðubreiðarlindir,
      Hvannalindir, Kverkfjöll, Laki, Nýidalur e Snæfell prestam apoio presencial no terreno.
    history: >-
      Skaftafell foi uma abastada herdade senhorial e sede de assembleias judiciais na Idade Média. Hoje a
      preocupação maior foca-se no gelo: a UNESCO alerta para a aceleração substancial do recuo dos glaciares
      provocada pelo aquecimento global. A terceira versão do plano de gestão do parque entrou em vigor a 5 de
      julho de 2022.
    before: >-
      As pistas interiores do planalto central, como as ligações a Askja e Kverkfjöll, só abrem no verão. Em
      Jökulsárlón e Fellsfjara é expressamente proibido voar drones entre 15 de abril e 15 de julho para
      proteção das colónias de aves marinhas. No trilho de Hjallanes, fecha impreterivelmente todas as
      cancelas de pastagem após a tua passagem. Consulta o estado de abertura dos percursos antes de iniciar a
      travessia.
    around: >-
      Vatnajökull não possui áreas vizinhas no atlas, mas partilha características ecológicas com outras
      regiões setentrionais. A [Reserva Natural de Helagsfjället](/lugar/helagsfjallet-nature-reserve/) e o
      [Parque Nacional de Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/)
      partilham a raposa-do-ártico e a rena em ambientes glaciares de montanha. [Fair Isle](/lugar/fair-isle/)
      e a [Reserva Natural Nacional de Hermaness](/lugar/hermaness-national-nature-reserve/) coincidem no
      moleiro-grande e no papagaio-do-mar.
