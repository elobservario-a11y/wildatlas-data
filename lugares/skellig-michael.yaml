resumen:
  es: >-
    Monolito de pícacho piramidal de 218 m alzándose aislado en el Atlántico, monasterio gaélico del siglo VI
    Patrimonio Mundial de la UNESCO y colonia de miles de frailecillos.
  en: >-
    A dramatic 218 m pyramidal sea crag rising sheer from the Atlantic, crowned by a sixth-century Gaelic
    monastery (UNESCO World Heritage) and breeding seabird colonies.
  fr: >-
    Éperon rocheux pyramidal de 218 m émergeant de l’Atlantique, abritant un monastère gaélique du VIe siècle
    classé à l’UNESCO et des milliers de macareux.
  de: >-
    Eine 218 m hohe pyramidenförmige Felsnadel im offenen Atlantik mit einem gälischen Kloster des VI.
    Jahrhunderts (UNESCO-Welterbe) und riesigen Papageitaucher-Kolonien.
  it: >-
    Uno sperone piramidale di 218 m che sorge isolato nell’Atlantico, eremo gaelico del VI secolo Patrimonio
    dell’Umanità UNESCO e rifugio di migliaia di pulcinelle di mare.
  pt: >-
    Monólito piramidal de 218 m erguido no oceano Atlântico, mosteiro gaélico do século VI Património Mundial
    da UNESCO e colónia de milhares de papagaios-do-mar.
unico:
  es: >-
    Un monasterio de piedra seca, intacto después de mil años, encaramado a una roca en mitad del Atlántico
    donde hoy anidan miles de aves marinas.
  en: >-
    A dry-stone monastery, preserved intact after a thousand years, perched atop an oceanic pinnacle where
    thousands of seabirds now nest.
  fr: >-
    Un monastère de pierres sèches préservé intact après mille ans, juché au sommet d’un piton en plein océan
    où nichent des milliers d’oiseaux marins.
  de: >-
    Ein Trockenstein-Kloster, das nach tausend Jahren intakt auf einem einsamen Felsen im Atlantik thront, wo
    heute Tausende von Seevögeln brüten.
  it: >-
    Un monastero in pietra a secco conservato intatto dopo mille anni, arroccato su un dente di roccia
    oceanico dove nidificano migliaia di uccelli marini.
  pt: >-
    Um mosteiro de pedra seca preservado intacto após mil anos, alcandorado num rochedo no meio do Atlântico
    onde nidificam milhares de aves marinhas.
observaciones:
  es: >-
    Los desembarcos están muy regulados y dependen del mar: la temporada de cada año y las licencias de los
    barcos se comprueban antes de reservar. La afluencia es alta en las embarcaciones de pasaje diario desde
    Portmagee.
texto:
  es:
    intro: >-
      Los monjes dormían en celdas de piedra con forma de colmena, en una roca en mitad del Atlántico, y
      vivieron así durante siglos. Sceilg Mhichíl, la Skellig Michael de los mapas ingleses, es una roca
      piramidal que emerge del océano casi 12 km al oeste de la península de Iveragh, en el extremo noroeste
      de Europa. Allí, en la cumbre, está el monasterio de St Fionan. Se calcula que nunca vivieron más de
      doce monjes y un abad a la vez. Hoy es uno de los dos únicos Patrimonios Mundiales de la UNESCO de la
      República de Irlanda, inscrito en 1996.
    landscape: >-
      La isla es una roca piramidal de arenisca del Devónico con dos picos de 185 y 218 metros, separados por
      una depresión en forma de U a 130 metros sobre el mar: el Christ’s Saddle, o Christ’s Valley. Se formó
      por una falla de la arenisca. Las rocas, de arenisca roja antigua y pizarra, se formaron hace entre 360
      y 374 millones de años. La roca está muy erosionada por la exposición, pero casi no hiela.


      El monasterio, en una terraza, tiene dos oratorios, un cementerio, cruces, losas con cruces, seis celdas
      de colmena y una iglesia medieval. La ermita está en el pico sur. Tres puntos de desembarco comunican
      con el monasterio por escaleras, y se usan unos u otros según el tiempo.


      La historia es larga. La fundación del monasterio es incierta: monjes de la tradición cristiana celta lo
      levantaron entre los siglos VI y VIII, y se dedicó a san Miguel entre 950 y 1050. Los anales registran
      un ataque vikingo en el año 823, cuando Skellig fue saqueada y el abad Eitgal, raptado, murió de hambre.
      Con poca tierra para el grano, los monjes se apañaban con huertos y, de necesidad, con pescado y con la
      carne y los huevos de las aves que anidaban en las islas. Entre las causas del abandono se barajan un
      clima más frío y tormentoso, las incursiones vikingas y cambios en la estructura de la Iglesia
      irlandesa. Los monjes dejaron la isla en el siglo XIII; después fue lugar de peregrinación y, durante
      las Leyes Penales, refugio de católicos.
    wildlife: >-
      Sceilg Mhichíl es uno de los lugares más importantes de Irlanda para las aves marinas que crían, tanto
      por la diversidad como por el tamaño de las colonias. Anidan halcones peregrinos, y hay fulmares,
      [pardelas pichonetas](/especie/puffinus_puffinus/), [paíños europeos](/especie/hydrobates_pelagicus/),
      [alcatraces](/especie/morus_bassanus/), gaviotas tridáctilas, [araos comunes](/especie/uria_aalge/) y
      [frailecillos](/especie/fratercula_arctica/), con 4000 o más frailecillos solo en Great Skellig. Las
      [focas grises](/especie/halichoerus_grypus/) descansan en las repisas de la isla durante el verano.
      También se ven [chovas piquirrojas](/especie/pyrrhocorax_pyrrhocorax/), cuervos, bisbitas y collalbas.


      La vecina Little Skellig es otra cosa: la mayor colonia de alcatraz de Irlanda, con casi 30.000 parejas,
      y está cerrada al público.


      En las aguas de alrededor se han registrado tiburones peregrinos, rorcuales aliblancos, delfines, zifios
      y tortugas laúd. Los conejos y ratones domésticos son introducciones recientes, probablemente del siglo
      XIX, traídas por los encargados del faro; también hubo una manada de cabras.
    visit: >-
      Solo se puede llegar con operadores de barco autorizados, con embarcaciones que salen en la temporada de
      verano, de mayo a octubre, si el tiempo lo permite. La isla suele ser inaccesible, sobre todo entre
      octubre y mayo, por la distancia de la costa. Fuera del periodo que fija cada año la Oficina de Obras
      Públicas no se permite el acceso, y se desaconseja llegar con embarcación privada.


      Hay que subir 618 escalones empinados e irregulares hasta el monasterio. Una visita típica dura unas
      seis horas, y está prohibido subir si hace viento o el suelo está mojado. La ermita del pico sur solo es
      accesible tras concertarlo con antelación. Quédate en los senderos reconocidos.
    history: >-
      En la década de 1820 los constructores del faro alteraron la isla; esas obras constan por escrito. El
      islote está designado como reserva natural estatutaria y zona de protección especial.
    before: >-
      Los desembarcos están muy regulados y dependen del mar: la temporada de cada año y las licencias de los
      barcos se comprueban antes de reservar. La afluencia es alta en las embarcaciones de pasaje diario desde
      Portmagee.
    around: >-
      Skellig Michael no tiene vecinos cercanos en el atlas; comparten aves marinas con ella
      [Mykines](/lugar/mykines/) (paíño europeo, alcatraz y frailecillo), [Alderney](/lugar/alderney/),
      [Noss](/lugar/noss-national-nature-reserve/) y la [Réserve naturelle nationale des
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (alcatraz y frailecillo).
  en:
    intro: >-
      Monks once slept in beehive dry-stone cells on a jagged pinnacle in the midst of the Atlantic,
      sustaining this contemplative life for centuries. Sceilg Mhichíl, designated Skellig Michael on English
      maps, is a pyramidal ocean crag rising out of the sea nearly 12 km west of the Iveragh Peninsula on the
      far western fringe of Europe. Perched near the summit stands the monastery of Saint Fionán, calculated
      to have housed no more than twelve monks and an abbot at any given time. Today it is one of only two
      UNESCO World Heritage properties in the Republic of Ireland, inscribed in 1996.
    landscape: >-
      The island is a pyramidal monolith of Devonian sandstone featuring twin summits of 185 and 218 metres,
      separated by a U-shaped col situated 130 metres above the sea known as Christ’s Saddle or Christ’s
      Valley. It was sculpted along major regional fault lines in Old Red Sandstone and slate beds that formed
      between 360 and 374 million years ago. While maritime storms weather the exposed facets, oceanic
      buffering ensures frost is exceptionally rare.


      The monastic settlement occupies three terraces on the northeastern shoulder, comprising two oratories,
      a cemetery with carved stone crosses and cross-inscribed slabs, six beehive cells (*clocháin*) and a
      later medieval church. A precarious hermitage clings to the sheer southern peak. Three landing points on
      the island connect to the monastery via stone stairways, chosen according to prevailing winds and swell.


      Its history is steeped in mystery. Monks of the early Celtic Christian tradition founded the monastery
      between the sixth and eighth centuries, and the community was dedicated to Saint Michael between 950 and
      1050. The Irish Annals document a devastating Viking raid in the year 823, when Skellig was plundered
      and Abbot Eitgal was abducted, subsequently perishing of starvation. Lacking tillable ground for grain,
      the monks survived on terraced herb gardens, sea fishing, and harvesting seabird eggs and meat. Climate
      cooling, increased storm frequency and ecclesiastical reorganization prompted the community to withdraw
      to the mainland during the thirteenth century, after which the rock served as a pilgrimage site and
      Penal Laws haven.
    wildlife: >-
      Sceilg Mhichíl ranks among Ireland’s pre-eminent breeding seabird sanctuaries in both diversity and
      colony numbers. Breeding species include peregrine falcons, northern fulmars, [Manx
      shearwaters](/especie/puffinus_puffinus/), [European storm petrels](/especie/hydrobates_pelagicus/),
      [northern gannets](/especie/morus_bassanus/), black-legged kittiwakes, [common
      murres](/especie/uria_aalge/) and [Atlantic puffins](/especie/fratercula_arctica/), with 4000 or more
      puffins nesting across Great Skellig alone. Hauled-out [grey seals](/especie/halichoerus_grypus/) rest
      on lower tide-washed shelves during the summer. Resident landbirds include [red-billed
      choughs](/especie/pyrrhocorax_pyrrhocorax/), ravens, rock pipits and northern wheatears.


      Neighbouring Little Skellig hosts one of the largest gannet colonies in the North Atlantic, with nearly
      30,000 breeding pairs, and remains closed to human landings.


      Surrounding waters attract basking sharks, minke whales, dolphins, beaked whales and leatherback
      turtles. Introduced rabbits and house mice arrived in the nineteenth century with lighthouse keepers; a
      small herd of feral goats formerly grazed the slopes.
    visit: >-
      Access is possible exclusively via licensed boat operators departing during the summer season between
      May and October, strictly subject to ocean conditions. The island is entirely inaccessible during rough
      weather and throughout the winter half-year due to heavy swells. Outside the official landing season
      designated annually by the Office of Public Works, visiting is prohibited, and private landings are
      strongly discouraged.


      Visiting the monastic ruins requires ascending 618 steep, uneven stone steps without handrails. A
      typical visit lasts about six hours total, and climbing is forbidden in severe winds or when rain slicks
      the steps. The South Peak hermitage is accessible only by special advance arrangement. Stay strictly on
      waymarked stairways and designated terraces.
    history: >-
      During the 1820s, lighthouse builders constructed roadways and operational quarters that altered
      sections of the island; these works were documented in government surveyor records. The island is
      protected as a National Monument, statutory nature reserve and Special Protection Area.
    before: >-
      Landings are strictly regulated and dependent on Atlantic swell: confirm operator licensing and seasonal
      weather windows well before travelling. Advance reservations are essential due to high demand on
      passenger boats operating from Portmagee.
    around: >-
      Skellig Michael has no immediate neighbours in the atlas; shared North Atlantic seabird communities link
      it with [Mykines](/lugar/mykines/) (European storm petrel, northern gannet and Atlantic puffin),
      [Alderney](/lugar/alderney/), [Noss](/lugar/noss-national-nature-reserve/) and the [Sept-Îles National
      Nature Reserve](/lugar/reserve-naturelle-des-sept-iles/) (gannets and puffins).
  fr:
    intro: >-
      Les moines dormaient dans des cellules en pierre sèche en forme de ruches, au sommet d'un piton en plein
      océan, et vécurent ainsi durant des siècles. Sceilg Mhichíl, nommée Skellig Michael sur les cartes de
      langue anglaise, est un piton pyramidal émergeant de l'Atlantique à près de 12 km à l'ouest de la
      péninsule d'Iveragh, à l'extrémité occidentale de l'Europe. Au sommet se dresse le monastère de
      Saint-Fionán, où l'on estime que ne vécurent jamais plus de douze moines et un abbé à la fois. C'est
      aujourd'hui l'un des deux seuls biens du Patrimoine mondial de l'UNESCO en République d'Irlande, inscrit
      en 1996.
    landscape: >-
      L'île est un monolithe pyramidal de grès dévonien doté de deux cimes de 185 et 218 mètres, séparées par
      un col en U suspendu à 130 mètres au-dessus des flots appelé Christ’s Saddle. Elle s'est individualisée
      le long de failles dans les vieux grès rouges et schistes formés il y a entre 360 et 374 millions
      d'années. La roche subit une violente érosion maritime, mais le gel y est rarissime.


      Le monastère, établi sur des terrasses, comprend deux oratoires, un cimetière à dalles gravées de croix
      celtiques, six cellules en ruche (*clocháin*) et une chapelle médiévale. Un ermitage vertigineux
      s'accroche au pic sud. Trois débarcadères historiques reliés au monastère par des escaliers taillés dans
      la roche sont utilisés selon l'orientation de la houle.


      L'histoire s'enracine dans le haut Moyen Âge : des moines de tradition celtique fondèrent
      l'établissement entre le VIe et le VIIIe siècle, et le monastère fut dédié à saint Michel entre 950 et
      1050. Les annales rapportent un raid viking en l'an 823 au cours duquel Skellig fut pillée et l'abbé
      Eitgal, enlevé, mourut de faim. Sans terres labourables, les moines survivaient grâce à des potagers en
      terrasse, à la pêche et aux œufs et à la chair des oiseaux marins. Un climat plus froid et les réformes
      ecclésiales poussèrent la communauté à se replier sur le continent au XIIIe siècle, l'île devenant
      ensuite un lieu de pèlerinage.
    wildlife: >-
      Sceilg Mhichíl constitue l'un des sanctuaires d'oiseaux marins nicheurs les plus remarquables d'Irlande.
      On y trouve des faucons pèlerins, des fulmars boréaux, des [puffins des
      Anglais](/especie/puffinus_puffinus/), des [océanites tempêtes](/especie/hydrobates_pelagicus/), des
      [fous de Bassan](/especie/morus_bassanus/), des mouettes tridactyles, des [guillemots de
      Troïl](/especie/uria_aalge/) et des [macareux moines](/especie/fratercula_arctica/), avec 4000 macareux
      ou davantage sur la seule Great Skellig. Les [phoques gris](/especie/halichoerus_grypus/) se reposent
      sur les platiers rocheux en été. On observe aussi des [craves à bec
      rouge](/especie/pyrrhocorax_pyrrhocorax/), des grands corbeaux et des pipits maritimes.


      L'îlot voisin de Little Skellig accueille la plus grande colonie de fous de Bassan d'Irlande, forte de
      près de 30 000 couples, et reste rigoureusement interdit au débarquement.


      Dans les eaux environnantes croisent requins pèlerins, petits rorquals, dauphins et tortues luths.
      Lapins et souris furent introduits au XIXe siècle par les gardiens du phare.
    visit: >-
      L'accès est assuré exclusivement par des bateliers autorisés opérant en saison estivale, de mai à
      octobre, sous réserve d'une météo favorable. L'île est inaccessible l'hiver et par mer agitée en raison
      de la houle du large. En dehors de la période fixée annuellement par l'Office des travaux publics
      irlandais, le débarquement est interdit, et l'accès par bateau privé est formellement déconseillé.


      Il faut gravir 618 marches de pierre abruptes et irrégulières dépourvues de garde-corps pour atteindre
      le monastère. Une visite dure environ six heures au total, et la montée est proscrite par grand vent ou
      sol mouillé. L'accès à l'ermitage du pic sud requiert une autorisation spéciale préalable. Restez
      impérativement sur les escaliers balisés.
    history: >-
      Dans les années 1820, les constructeurs des phares aménagèrent l'île en taillant des chemins d'accès;
      ces travaux sont documentés par les archives administratives. L'îlot est classé monument national,
      réserve naturelle statutaire et zone de protection spéciale.
    before: >-
      Les débarquements sont strictement contingentés et soumis à l'état de la mer : vérifiez les
      autorisations des compagnies maritimes avant de réserver. La fréquentation est très soutenue sur les
      navettes au départ de Portmagee.
    around: >-
      Skellig Michael ne compte pas de voisins immédiats dans l'atlas ; elle partage ses oiseaux marins avec
      [Mykines](/lugar/mykines/) (océanite tempête, fou de Bassan et macareux moine),
      [Alderney](/lugar/alderney/), [Noss](/lugar/noss-national-nature-reserve/) et la [réserve naturelle des
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (fous et macareux).
  de:
    intro: >-
      Die Mönche schliefen in bienenkorbartigen Steinzellen auf einer Felsnadel im offenen Atlantik und lebten
      dort über Jahrhunderte. Sceilg Mhichíl, auf englischen Karten Skellig Michael genannt, ist ein
      pyramidenförmiger Felsen, der knapp 12 km westlich der Iveragh-Halbinsel am nordwestlichen Rand Europas
      aus dem Ozean ragt. Nahe dem Gipfel liegt das Kloster St. Fionan. Man schätzt, dass dort nie mehr als
      zwölf Mönche und ein Abt gleichzeitig lebten. Heute ist es eine von nur zwei UNESCO-Welterbestätten der
      Republik Irland, eingetragen im Jahr 1996.
    landscape: >-
      Die Insel ist ein pyramidenförmiger Monolith aus devonischem Sandstein mit zwei Gipfeln von 185 und 218
      Metern Höhe, getrennt durch einen U-förmigen Sattel auf 130 Metern über dem Meer, den Christ’s Saddle.
      Die Felsen aus Altem Roten Sandstein und Schiefer entstanden vor zwischen 360 und 374 Millionen Jahren.
      Das Gestein ist durch die Witterung stark verwittert, doch Frost kommt praktisch nicht vor.


      Das Kloster auf einer Felsenterrasse umfasst zwei Oratorien, einen Friedhof mit Kreuzplatten, sechs
      Bienenkorbhütten (*Clocháin*) und eine mittelalterliche Kirche. Eine kühne Einsiedelei klammert sich an
      den Südgipfel. Drei Anlegestellen verbinden historische Steintreppen mit dem Kloster, die je nach
      Wellengang genutzt werden.


      Die Ursprünge reichen weit zurück: Mönche der keltischen Tradition errichteten die Einsiedelei zwischen
      dem VI. und VIII. Jahrhundert; zwischen 950 und 1050 wurde sie dem Erzengel Michael geweiht. Die Annalen
      verzeichnen einen Wikingerüberfall im Jahr 823, bei dem Skellig geplündert wurde und Abt Eitgal in
      Gefangenschaft verhungerte. Ohne Ackerland überlebten die Mönche von Terrassengärten, Fischfang sowie
      Vogelfleisch und Eiern. Ein kälteres Meeresklima und Kirchenreformen führten im XIII. Jahrhundert zur
      Verlegung des Konvents aufs Festland.
    wildlife: >-
      Sceilg Mhichíl gehört zu Irlands bedeutendsten Brutgebieten für Seevögel. Hier brüten Wanderfalken,
      Eissturmvögel, [Atlantiksturmtaucher](/especie/puffinus_puffinus/),
      [Sturmschwalben](/especie/hydrobates_pelagicus/), [Basstölpel](/especie/morus_bassanus/),
      Dreizehenmöwen, [Trottellummen](/especie/uria_aalge/) und
      [Papageitaucher](/especie/fratercula_arctica/), mit 4000 oder mehr Papageitauchern allein auf Great
      Skellig. [Kegelrobben](/especie/halichoerus_grypus/) ruhen im Sommer auf den flachen Felsbänken. Zudem
      leben hier [Alpenkrähen](/especie/pyrrhocorax_pyrrhocorax/), Kolkraben und Steinschmätzer.


      Die benachbarte Felseninsel Little Skellig beherbergt mit fast 30.000 Paaren eine der größten
      Basstölpelkolonien der Welt und ist für Besucher gesperrt.


      In den Gewässern ziehen Riesenhaie, Zwergwale, Delfine und Lederschildkröten vorbei. Kaninchen und
      Hausmäuse wurden im XIX. Jahrhundert von den Leuchtturmwärtern eingeschleppt.
    visit: >-
      Die Anreise ist nur mit lizenzierten Ausflugsbooten während der Sommersaison von Mai bis Oktober bei
      ruhiger See möglich. Im Winterhalbjahr und bei schwerer Dünung ist die Insel unzugänglich. Außerhalb der
      von der Denkmalschutzbehörde festgelegten Saison ist das Betreten untersagt; private Boote dürfen nicht
      anlegen.


      Der Aufstieg zum Kloster führt über 618 steile, ungesicherte Steinstufen. Ein Ausflug dauert rund sechs
      Stunden; bei Starkwind oder Nässe ist der Aufstieg verboten. Die Einsiedelei am Südgipfel ist nur nach
      vorheriger Sondergenehmigung zugänglich. Bleibe stets auf den markierten Treppen.
    history: >-
      In den 1820er Jahren bauten Arbeiter Leuchttürme und Zugangswege auf der Insel, wie zeitgenössische
      Bauprotokolle belegen. Die Felseninsel ist als National Monument, Naturschutzgebiet und
      Vogelschutzgebiet ausgewiesen.
    before: >-
      Die Anlandungen sind streng limitiert und hängen vom Atlantikwetter ab: Überprüfe die Lizenzen und
      Wetterfenster vor der Buchung. Wegen der hohen Nachfrage auf den Passagierbooten ab Portmagee ist frühe
      Reservierung unerlässlich.
    around: >-
      Skellig Michael hat keine direkten Nachbarn im Atlas; atlantische Seevogelgemeinschaften teilt sie mit
      [Mykines](/lugar/mykines/) (Sturmschwalbe, Basstölpel und Papageitaucher), [Alderney](/lugar/alderney/),
      [Noss](/lugar/noss-national-nature-reserve/) und dem [Naturschutzgebiet
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (Tölpel und Papageitaucher).
  it:
    intro: >-
      I monaci riposavano in celle di pietra a forma di alveare, in cima a uno sperone in pieno oceano
      Atlantico, e vissero così per secoli. Sceilg Mhichíl, denominata Skellig Michael nelle carte inglesi, è
      una piramide di roccia che si erge dal mare quasi 12 km a ovest della penisola di Iveragh, all'estremità
      occidentale d'Europa. Là vicino alla cima sorge il monastero di St Fionan, dove si stima non abbiano mai
      vissuto più di dodici monaci e un abate contemporaneamente. Oggi è uno dei soli due siti Patrimonio
      Mondiale dell'UNESCO della Repubblica d'Irlanda, iscritto nel 1996.
    landscape: >-
      L'isola è un monolito di arenaria devoniana con due vette gemelle di 185 e 218 metri, separate da una
      sella a forma di U posta a 130 metri sul mare nota come Christ’s Saddle. Si è originata lungo faglie
      nelle Antiche Arenarie Rosse e negli scisti formatesi tra 360 e 374 milioni di anni fa. La roccia
      subisce un'intensa usura marina, ma il gelo è praticamente sconosciuto.


      Il complesso monastico poggia su terrazze rupestri e conta due oratori, un cimitero con croci incise su
      lastre, sei celle ad alveare (*clocháin*) e una chiesa medievale. Un romitorio ardito si arrampica sul
      picco meridionale. Tre approdi storici comunicano con il monastero mediante scalinate scavate nella
      pietra viva, alternati in base al mare.


      La vicenda storica ha radici remote: monaci della cristianità celtica edificarono il monastero tra il VI
      e l'VIII secolo, consacrandolo a san Michele tra il 950 e il 1050. Gli annali irlandesi registrano
      un'incursione vichinga nell'anno 823, quando Skellig fu saccheggiata e l'abate Eitgal morì di stenti
      dopo il rapimento. Privi di terre coltivabili a cereali, i monaci vivevano di orti terrazzati, pesca e
      uova e carne degli uccelli marini. Nel XIII secolo la comunità si trasferì sulla terraferma a causa del
      raffreddamento climatico.
    wildlife: >-
      Sceilg Mhichíl è uno dei più ragguardevoli santuari d'Irlanda per la riproduzione degli uccelli marini.
      Vi nidificano falchi pellegrini, fulmari, [berte minori](/especie/puffinus_puffinus/), [uccelli delle
      tempeste](/especie/hydrobates_pelagicus/), [sule bassane](/especie/morus_bassanus/), gabbiani
      tridattili, [urie comuni](/especie/uria_aalge/) e [pulcinelle di mare](/especie/fratercula_arctica/),
      con 4000 o più pulcinelle sulla sola Great Skellig. Le [foche grigie](/especie/halichoerus_grypus/)
      riposano sulle piattaforme rocciose estive. Si osservano anche [gracchi
      corallini](/especie/pyrrhocorax_pyrrhocorax/), corvi imperiali e culbianchi.


      La vicina Little Skellig ospita la maggiore colonia di sule d'Irlanda, con quasi 30.000 coppie
      nidificanti, ed è chiusa a qualsiasi sbarco.


      Nelle acque circostanti transitano squali elefante, balenottere minori, delfini e tartarughe liuto.
      Conigli e topi furono introdotti nel XIX secolo dai guardiani del faro.
    visit: >-
      L'accesso è consentito esclusivamente con barche passeggeri autorizzate nella stagione estiva tra maggio
      e ottobre, con condizioni marine favorevoli. L'isola è del tutto inaccessibile d'inverno e col mare
      mosso. Al di fuori del periodo stabilito annualmente dall'Office of Public Works l'accesso è interdetto,
      ed è sconsigliato l'attracco con imbarcazioni private.


      Per raggiungere il monastero occorre salire 618 gradini di pietra ripidi e privi di ringhiere.
      Un'escursione tipo dura circa sei ore; la salita è vietata con vento forte o gradini scivolosi. L'eremo
      della vetta sud è visitabile solo con permesso speciale preventivo. Resta sempre sui percorsi ufficiali.
    history: >-
      Nel decennio del 1820 i costruttori dei fari tracciarono strade e alloggi documentati dagli ingegneri
      civili. L'isolotto è classificato monumento nazionale, riserva naturale legale e zona di protezione
      speciale.
    before: >-
      Gli sbarchi sono severamente limitati e legati al moto ondoso dell'Atlantico: verifica licenze e
      disponibilità prima di metterti in viaggio. La domanda sulle barche passeggeri da Portmagee è molto
      elevata.
    around: >-
      Skellig Michael non ha vicini prossimi nell'atlante; condivide avifauna marina con
      [Mykines](/lugar/mykines/) (uccello delle tempeste, sula e pulcinella di mare),
      [Alderney](/lugar/alderney/), [Noss](/lugar/noss-national-nature-reserve/) e la [Riserva Naturale delle
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (sule e pulcinelle).
  pt:
    intro: >-
      Os monges dormiam em celas de pedra em forma de colmeia num pináculo rochoso no meio do Atlântico,
      mantendo este retiro contemplativo durante séculos. Sceilg Mhichíl, grafada Skellig Michael nas cartas
      inglesas, é um rochedo piramidal que emerge quase 12 km a oeste da península de Iveragh, no extremo
      noroeste da Europa. Junto ao cume ergue-se o mosteiro de Saint Fionan, estimando-se que nunca tenham
      vivido mais de doze monges e um abade em simultâneo. É hoje um dos dois únicos bens do Património
      Mundial da UNESCO na República da Irlanda, inscrito em 1996.
    landscape: >-
      A ilha é um monólito piramidal de arenito devoniano com dois picos de 185 e 218 metros, separados por
      uma depressão em U a 130 metros acima do mar conhecida por Christ’s Saddle. Formou-se ao longo de falhas
      tectónicas em arenitos vermelhos antigos e xistos esculpidos há entre 360 e 374 milhões de anos. O
      rochedo sofre intensa erosão oceânica, mas o gelo é praticamente inexistente.


      O mosteiro, assente em terraços rochosos, integra dois oratórios, um cemitério com cruzes e lajes
      gravadas, seis celas em colmeia (*clocháin*) e uma igreja medieval. Um eremitério vertiginoso debruça-se
      sobre o pico sul. Três pontos de atracagem comunicam com o mosteiro através de escadarias lajeadas,
      usadas alternadamente conforme a vaga.


      A fundação remonta aos séculos VI a VIII por monges da tradição cristã celta, sendo o santuário dedicado
      a São Miguel entre 950 e 1050. Os anais registam um assalto viquingue no ano 823, quando a ilha foi
      saqueada e o abade Eitgal faleceu de inanição após o rapto. Sem solos aráveis, os monges subsistiam com
      hortas em socalcos, pesca costeira e carne e ovos de aves marinhas. No século XIII, o arrefecimento
      climático levou a comunidade a recolher-se ao continente.
    wildlife: >-
      Sceilg Mhichíl constitui uma das mais prestigiadas colónias de aves marinhas da Irlanda. Aqui nidificam
      falcões-peregrinos, fulmares-boreais, [pardelas-sombrias](/especie/puffinus_puffinus/),
      [painhos-de-jesus](/especie/hydrobates_pelagicus/), [gansos-patolas](/especie/morus_bassanus/),
      gaivotas-tridáctilas, [airos-comuns](/especie/uria_aalge/) e
      [papagaios-do-mar](/especie/fratercula_arctica/), com 4000 ou mais papagaios-do-mar na Great Skellig. As
      [focas-cinzentas](/especie/halichoerus_grypus/) descansam nas plataformas de maré no verão. Observam-se
      ainda [gralhas-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/), corvos e petinhas-marítimas.


      A vizinha Little Skellig abriga a maior colónia de gansos-patolas da Irlanda, com quase 30.000 casais,
      mantendo-se vedada ao desembarque.


      Nas águas oceânicas circulam tubarões-frade, baleias-anãs, golfinhos e tartarugas-de-couro. Coelhos e
      ratos foram introduzidos no século XIX pelos faroleiros.
    visit: >-
      O acesso realiza-se exclusivamente através de operadores marítimos licenciados durante a temporada de
      verão entre maio e outubro, sujeito ao estado do mar. A ilha permanece inacessível no inverno e com
      ondulação forte. Fora do período estabelecido pelo Office of Public Works o desembarque é interdito,
      desaconselhando-se vivamente embarcações particulares.


      A subida ao mosteiro exige vencer 618 degraus de pedra íngremes e irregulares sem corrimão. Uma visita
      média dura cerca de seis horas; a subida é proibida com vento intenso ou degraus molhados. O eremitério
      do pico sul só pode ser visitado com autorização prévia. Mantém-te sempre nos degraus assinalados.
    history: >-
      Na década de 1820, operários construíram estradas e faróis documentados pelos arquivos das obras
      públicas. O ilhéu está classificado como monumento nacional, reserva natural e zona de proteção
      especial.
    before: >-
      Os desembarques estão estritamente regulamentados e dependem da ondulação: confirma licenças e condições
      meteorológicas com antecedência. A procura nas embarcações a partir de Portmagee é muito elevada.
    around: >-
      Skellig Michael não tem vizinhos imediatos no atlas; partilha aves marinhas com
      [Mykines](/lugar/mykines/) (painho-de-jesus, ganso-patola e papagaio-do-mar),
      [Alderney](/lugar/alderney/), [Noss](/lugar/noss-national-nature-reserve/) e a [Reserva Natural das
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) (gansos-patolas e papagaios-do-mar).
