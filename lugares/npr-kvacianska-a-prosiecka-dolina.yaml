resumen:
  es: >-
    Pareja de cañones kársticos profundos encajados en los montes Choč que albergan los históricos molinos de
    madera de Oblazy.
  en: >-
    A pair of deep karst canyons carved into the Choč Mountains sheltering the historic wooden watermills of
    Oblazy.
  fr: >-
    Deux canyons karstiques profonds taillés dans les monts Choč abritant les moulins à eau en bois
    historiques d’Oblazy.
  de: >-
    Zwei tiefe Karstschluchten in den Choč-Bergen, in denen die historischen Holzwassermühlen von Oblazy
    verborgen liegen.
  it: >-
    Una coppia di profonde forre carsiche scavate nei monti Choč che custodiscono gli storici mulini ad acqua
    in legno di Oblazy.
  pt: >-
    Dois desfiladeiros cársicos profundos encaixados nos montes Choč que abrigam os históricos moinhos de água
    em madeira de Oblazy.
unico:
  es: >-
    Dos cañones kársticos donde el frío se queda en el fondo: abajo viven las plantas de alta montaña y, sobre
    las peñas, las que aman el calor.
  en: >-
    Two karst canyons where the cold settles at the bottom: alpine plants thrive below, while heat-loving
    species cling to the crags above.
  fr: >-
    Deux canyons karstiques où le froid stagne au fond : les plantes de haute montagne s’épanouissent en bas
    et celles avides de chaleur sur les falaises.
  de: >-
    Zwei Karstschluchten mit Kaltluftseen am Talboden: unten wachsen hochalpine Pflanzen, während an den
    Felswänden wärmeliebende Arten gedeihen.
  it: >-
    Due canyon carsici dove il freddo ristagna sul fondo: in basso prosperano piante d’alta quota, mentre
    sulle rupi crescono specie termofile.
  pt: >-
    Dois desfiladeiros cársicos onde o frio se acumula no fundo: em baixo medram plantas alpinas e nas
    escarpas as que buscam o calor.
observaciones:
  es: >-
    Hay autobús desde Liptovský Mikuláš a Prosiek y a Kvačany, y el circuito empieza y termina en Prosiek. En
    Prosiecka la roca se supera a ratos con escaleras de acero, así que tenlo en cuenta si vas con niños. Las
    dos reservas son hábitat de plantas de montaña y de fauna protegida: quédate en los senderos marcados.
texto:
  es:
    intro: >-
      Para llegar al agua hay que cruzar primero una puerta de roca. En Prosiecka dolina esa puerta se llama
      Vráta, un paso rocoso sobre el que brota con fuerza el arroyo Prosiečanka, y detrás empieza un cañón de
      casi cuatro kilómetros encajado entre los macizos de Lomná y Prosečné. A su lado, paralelo, corre otro
      valle gemelo, Kvačianska dolina. Son dos reservas naturales nacionales de los montes Choč, en Liptov, y
      se enlazan en un solo circuito que se hace en un día. Los lectores de la revista Krásy Slovenska
      eligieron Prosiecka como el valle más bonito.
    landscape: >-
      Calizas y dolomías, como en el resto de los montes Choč. Sobre esa roca blanda el agua de la Prosiečanka
      hizo su trabajo: abrió cañones profundos, modeló torres y bloques de roca y dejó cascadas. Algunas de
      las peñas tienen nombre propio, y se les reconoce enseguida: Sova, Ťava, Sokol, Medveď, Jánošík.


      Prosiecka se recorre por tramos. Tras la entrada de Vráta, el valle se abre en el claro de Polhora, con
      grupos de peñas a los lados. Más arriba se bifurca: un ramal va hacia Červené piesky, con una cascada de
      quince metros, y el otro hacia las gargantas de Nižný y Vyšný Straz, los pasos más espectaculares del
      valle. Allí la roca se vence con escaleras de acero. Al final del cañón, el terreno se aplana en Svorad,
      una planicie kárstica con sumideros y surgencias, y es el punto más alto del circuito. En la zona hay
      cuevas; la más conocida del valle es la cueva de Prosiek.


      Kvačianska es de otro carácter: una garganta profunda con vegetación adaptada a los suelos calizos. En
      su parte alta, en Oblazy, se juntan los arroyos Kvačianka, Borovianka y Ráztocký. Y en el tramo bajo, el
      espolón de Roháč ofrece las vistas sobre todo el cañón.
    wildlife: >-
      Lo más sorprendente de estos valles crece a ras de suelo. El relieve quebrado, el fuerte encajonamiento
      y las inversiones térmicas, frecuentes aquí, mantienen plantas de frío y alpinas como comunidades
      relictas. En el fondo de Kvačianska crecen especies subalpinas y de alta montaña, y en lo alto de las
      laderas y las peñas, plantas amantes del sol y de la sequedad. El edelweiss baja hasta una de las cotas
      más bajas de Eslovaquia, 665 metros. También hay aster alpino, grasilla alpina y plantas endémicas o
      casi endémicas como Soldanella carpatica, Festuca tatrae, Dianthus nitidus y Saxifraga wahlenbergii.
      Entre las plantas de interés de la zona aparecen Cypripedium calceolus y Pulsatilla slavica.


      La fauna que enumera la ficha de la zona incluye al [lince boreal](/especie/lynx_lynx/), al
      [lobo](/especie/canis_lupus/), al [oso pardo](/especie/ursus_arctos/) y a la [nutria
      europea](/especie/lutra_lutra/). Entre los anfibios, el [tritón de los
      Cárpatos](/especie/triturus_montandoni/) y Bombina variegata, y entre los murciélagos, Barbastella
      barbastellus, Myotis myotis y Rhinolophus hipposideros.


      En estaciones, estos valles son sobre todo de verano. Prosiecka y Kvačianska están entre los lugares más
      visitados de Liptov durante el verano, y por su dificultad moderada gustan a las familias.
    visit: >-
      El circuito parte de Prosiek, al norte del embalse de Liptovská Mara. Primero se sube por Prosiecka, con
      sus escaleras de acero, hasta Svorad. De allí un sendero con marcas azules baja a Veľké Borové, y de
      Veľké Borové a Oblazy, por la garganta de Borovianka. Desde Oblazy se vuelve por Kvačianska hasta
      Kvačany, con una torre mirador sobre una peña que ofrece vistas al valle y a los montes cercanos. En
      total, unos veinte kilómetros y trescientos metros de desnivel.


      A lo largo de la ruta hay un sendero didáctico con doce paradas, cada una con un panel sobre geografía,
      biología o historia. En Prosiecka empieza en Prosiek y sigue la marca azul por todo el valle. En
      Kvačianska hay un sendero con marcas rojas entre Kvačany y Huty. Para subir más alto, desde Svorad parte
      un sendero verde a Prosečné, de 1.372 metros, que baja por el collado de Ostruky hasta el molino
      superior.


      Los molinos de Oblazy merecen una parada: son dos molinos de agua de madera, monumento técnico del siglo
      XIX que cuidan voluntarios. El inferior, con aserradero, está restaurado en funcionamiento y alberga una
      exposición de técnica molinera.
    history: >-
      Durante años, una antigua carretera de carros por el fondo de Kvačianska fue la única conexión de Veľké
      Borové y Huty con el exterior. En el tramo bajo, en 1860, se levantó una cruz de piedra sobre Roháč, el
      punto más alto del viejo camino, desde el que se ve todo el cañón. Los molinos, en cambio, siguen vivos
      gracias a los voluntarios.


      Prosiecka dolina forma parte de la reserva natural nacional del mismo nombre, y Kvačianska, de la suya.
    before: >-
      Hay autobús desde Liptovský Mikuláš a Prosiek y a Kvačany, y el circuito empieza y termina en Prosiek.
      En Prosiecka la roca se supera a ratos con escaleras de acero, así que tenlo en cuenta si vas con niños.
      Las dos reservas son hábitat de plantas de montaña y de fauna protegida: quédate en los senderos
      marcados.
    around: >-
      A tres kilómetros queda el [Parque Nacional de los Tatras (Eslovaquia)](/lugar/tatransky-narodny-park/),
      y a quince el [Parque Nacional de los Tatras (Polonia)](/lugar/tatrzanski-park-narodowy/).
  en:
    intro: >-
      To reach the water you must first cross a gateway of rock. In Prosiecka dolina that gateway is called
      Vráta, a rocky gorge where the Prosiečanka stream rushes out with force; behind it begins a canyon
      almost four kilometres long, wedged between the Lomná and Prosečné massifs. Running parallel alongside
      it is its twin valley, Kvačianska dolina. Both are national nature reserves in the Choč Mountains of
      Liptov, linked into a single circular day hike. Readers of the magazine Krásy Slovenska once voted
      Prosiecka the most beautiful valley in Slovakia.
    landscape: >-
      Limestones and dolomites shape the landscape here, just as across the rest of the Choč Mountains. Over
      this soft bedrock the waters of the Prosiečanka carved deep gorges, sculpted towering rock buttresses,
      and formed cascading waterfalls. Several rock formations bear well-known names: Sova (Owl), Ťava
      (Camel), Sokol (Falcon), Medveď (Bear), and Jánošík.


      Prosiecka is explored in distinct sections. Past the Vráta gateway, the valley opens into the Polhora
      meadow, flanked by towering rock spires. Higher up it forks: one branch leads to Červené piesky with its
      fifteen-metre waterfall, while the other ascends into the Nižný and Vyšný Straz gorges, the most
      dramatic passes of the valley. Steel ladders help you conquer the cliffs there. At the end of the
      canyon, the terrain levels out onto Svorad, a karst plateau pocked with sinkholes and springs, marking
      the highest point of the circuit. The area also conceals caves, the most renowned of which is Prosiek
      Cave.


      Kvačianska displays a different character: a deep forested gorge where lush vegetation thrives on
      limestone soils. High up at Oblazy, the Kvačianka, Borovianka, and Ráztocký streams converge. Lower
      down, the Roháč rock promontory commands sweeping views across the entire canyon.
    wildlife: >-
      The most extraordinary secret of these valleys grows right at ground level. Rugged terrain, extreme
      enclosed gorges, and frequent thermal inversions sustain cold-adapted and alpine plants as relic
      communities. In the cool depths of Kvačianska grow subalpine and high-mountain flora, while sun-loving,
      drought-resistant species thrive on the sunny upper cliffs and crags. Edelweiss descends to one of its
      lowest elevations in Slovakia at 665 metres. Alpine aster, alpine butterwort, and endemic or
      near-endemic species like Soldanella carpatica, Festuca tatrae, Dianthus nitidus, and Saxifraga
      wahlenbergii also flourish here. Notable botanical treasures include Cypripedium calceolus
      (lady’s-slipper orchid) and Pulsatilla slavica.


      The reserve’s protected fauna includes the [Eurasian lynx](/especie/lynx_lynx/), [grey
      wolf](/especie/canis_lupus/), [brown bear](/especie/ursus_arctos/), and [Eurasian
      otter](/especie/lutra_lutra/). Amphibians feature the [*Triturus
      montandoni*](/especie/triturus_montandoni/) (Carpathian newt) and Bombina variegata (yellow-bellied
      toad), while bats include Barbastella barbastellus, Myotis myotis, and Rhinolophus hipposideros.


      Seasonally, these valleys come alive primarily in summer. Prosiecka and Kvačianska rank among Liptov’s
      most popular summer excursions, and their moderate difficulty makes them very appealing for families.
    visit: >-
      The circuit starts from Prosiek, north of the Liptovská Mara reservoir. First ascend through Prosiecka,
      climbing its steel ladders to reach Svorad. From there, a blue-marked trail descends towards Veľké
      Borové, and continues through the Borovianka gorge down to Oblazy. From Oblazy, return along Kvačianska
      to Kvačany, passing a viewpoint atop a rocky outcrop that overlooks the valley and surrounding peaks. In
      total, the route covers about twenty kilometres with three hundred metres of elevation gain.


      An educational nature trail runs along the route featuring twelve interpretive stops, each with an
      information board detailing geography, biology, or history. In Prosiecka it begins in Prosiek and
      follows the blue trail throughout the valley. In Kvačianska a red-marked trail connects Kvačany and
      Huty. For a higher summit climb, a green trail branches off at Svorad towards Prosečné at 1,372 metres,
      descending via the Ostruky pass back to the upper mill.


      The watermills of Oblazy deserve a dedicated stop: two nineteenth-century wooden watermills designated
      as technical monuments and maintained by volunteers. The lower mill, complete with a sawmill, has been
      restored to full working order and houses an exhibition on traditional milling technology.
    history: >-
      For generations, an old cart track cutting through the depths of Kvačianska was the sole link connecting
      the remote villages of Veľké Borové and Huty to the outside world. On the lower section in 1860, a stone
      cross was erected on Roháč, the highest vantage point along the old trail, taking in the full length of
      the gorge. The mills, meanwhile, remain preserved thanks to dedicated volunteers.


      Prosiecka dolina forms part of the national nature reserve of the same name, as does Kvačianska.
    before: >-
      Buses run from Liptovský Mikuláš to Prosiek and Kvačany, and the circular trail begins and ends in
      Prosiek. In Prosiecka the rock faces are negotiated using steel ladders, so bear this in mind if hiking
      with young children. Both reserves are delicate habitats for mountain flora and protected wildlife:
      always stay on marked footpaths.
    around: >-
      Three kilometres away lies [Tatras National Park (Slovakia)](/lugar/tatransky-narodny-park/), and
      fifteen kilometres away is [Tatra National Park (Poland)](/lugar/tatrzanski-park-narodowy/).
  fr:
    intro: >-
      Pour atteindre l’eau, il faut d’abord franchir une porte de roche. Dans la Prosiecka dolina, cette porte
      s’appelle Vráta, un défilé rocheux d’où jaillit avec force le ruisseau Prosiečanka ; derrière s’ouvre un
      canyon de près de quatre kilomètres coincé entre les massifs de Lomná et Prosečné. À ses côtés court en
      parallèle sa vallée jumelle, Kvačianska dolina. Deux réserves naturelles nationales des monts Choč, dans
      le Liptov, réunies en une seule boucle réalisable en une journée. Les lecteurs du magazine Krásy
      Slovenska ont jadis élu Prosiecka comme la plus belle vallée de Slovaquie.
    landscape: >-
      Calcaires et dolomies dominent ici, comme dans le reste des monts Choč. Sur cette roche tendre, les eaux
      de la Prosiečanka ont accompli leur œuvre : ouvrir des gorges profondes, façonner des tours rocheuses et
      laisser des cascades. Certaines parois portent des noms familiers : Sova (Chouette), Ťava (Chameau),
      Sokol (Faucon), Medveď (Ours) ou Jánošík.


      Prosiecka se découvre par paliers. Après le goulet de Vráta, la vallée s’élargit dans la clairière de
      Polhora, bordée d’aiguilles rocheuses. Plus haut, le sentier bifurque : une branche mène à Červené
      piesky et sa cascade de quinze mètres, tandis que l’autre grimpe vers les défilés de Nižný et Vyšný
      Straz, les passages les plus spectaculaires de la vallée. Là, des échelles d’acier aident à vaincre le
      rocher. Au bout du canyon, le relief s’aplanit à Svorad, un plateau karstique truffé d’entonnoirs et de
      résurgences, point culminant du circuit. La région recèle aussi des grottes, la plus renommée étant la
      grotte de Prosiek.


      Kvačianska offre une ambiance différente : une gorge profonde à la végétation luxuriante adaptée aux
      sols calcaires. Dans sa partie haute, à Oblazy, confluent les ruisseaux Kvačianka, Borovianka et
      Ráztocký. Plus bas, l’éperon de Roháč offre un panorama grandiose sur l’ensemble du canyon.
    wildlife: >-
      Ce que ces vallées ont de plus surprenant pousse au ras du sol. Le relief tourmenté, l’encaissement
      prononcé et les inversions thermiques fréquentes y préservent des espèces froides et alpines sous forme
      de reliques. Dans le fond frais de Kvačianska prospèrent des espèces subalpines et d’altitude, tandis
      que sur les crêtes et parois ensoleillées s’installent des plantes xérophiles. L’edelweiss y descend à
      l’une de ses altitudes les plus basses de Slovaquie, à 665 mètres. On y croise aussi l’aster alpin, la
      grassette alpine et des endémiques ou quasi-endémiques carpatiques comme Soldanella carpatica, Festuca
      tatrae, Dianthus nitidus et Saxifraga wahlenbergii. Parmi les fleurs remarquables figurent Cypripedium
      calceolus (sabot de Vénus) et Pulsatilla slavica.


      La faune protégée répertoriée dans la réserve comprend le [lynx boréal](/especie/lynx_lynx/), le
      [loup](/especie/canis_lupus/), l’[ours brun](/especie/ursus_arctos/) et la [loutre
      d’Europe](/especie/lutra_lutra/). Côté amphibiens, le [*Triturus
      montandoni*](/especie/triturus_montandoni/) (triton de Montandon) et Bombina variegata côtoient des
      chauves-souris remarquables comme Barbastella barbastellus, Myotis myotis et Rhinolophus hipposideros.


      Au fil des saisons, ces vallées s’apprécient surtout l’été. Prosiecka et Kvačianska comptent parmi les
      randonnées estivales les plus prisées du Liptov, et leur difficulté modérée plaît beaucoup aux familles.
    visit: >-
      Le circuit part de Prosiek, au nord du réservoir de Liptovská Mara. On monte d’abord par Prosiecka et
      ses échelles d’acier jusqu’à Svorad. De là, un sentier balisé en bleu descend vers Veľké Borové, puis
      rejoint Oblazy par la gorge de Borovianka. Depuis Oblazy, le retour s’effectue par Kvačianska jusqu’à
      Kvačany, avec un promontoire perché sur un rocher offrant une vue superbe sur la vallée et les monts
      voisins. Au total, comptez environ vingt kilomètres et trois cents mètres de dénivelé.


      Un sentier pédagogique jalonne l’itinéraire avec douze stations d’information consacrées à la
      géographie, la biologie ou l’histoire. Dans Prosiecka, il part de Prosiek et suit le balisage bleu tout
      du long. Dans Kvačianska, un chemin balisé en rouge relie Kvačany et Huty. Pour prendre de la hauteur,
      un sentier vert part de Svorad vers le mont Prosečné, à 1 372 mètres d’altitude, et redescend par le col
      d’Ostruky vers le moulin supérieur.


      Les moulins d’Oblazy valent une halte prolongée : deux moulins à eau en bois du XIXe siècle, classés
      monuments techniques et entretenus par des bénévoles. Le moulin inférieur, doté d’une scierie, a été
      remis en parfait état de marche et abrite une exposition sur la meunerie traditionnelle.
    history: >-
      Pendant des générations, un ancien chemin de charrettes tracé au fond de Kvačianska fut l’unique voie
      reliant les villages isolés de Veľké Borové et Huty au reste du monde. Dans la partie basse, en 1860,
      une croix de pierre fut érigée sur l’éperon de Roháč, point culminant de l’ancien chemin qui embrasse
      tout le défilé. Les moulins, quant à eux, continuent de tourner grâce au dévouement de volontaires.


      Prosiecka dolina et Kvačianska dolina constituent chacune une réserve naturelle nationale.
    before: >-
      Des lignes de bus relient Liptovský Mikuláš à Prosiek et Kvačany ; la boucle complète commence et se
      termine à Prosiek. Dans Prosiecka, certains passages rocheux sont franchis grâce à des échelles
      métalliques : gardez-le à l’esprit si vous randonnez avec de jeunes enfants. Les deux réserves abritent
      une flore montagnarde et une faune sensibles : restez impérativement sur les sentiers balisés.
    around: >-
      À trois kilomètres s’étend le [Parc national des Tatras (Slovaquie)](/lugar/tatransky-narodny-park/), et
      à quinze kilomètres le [Parc national des Tatras (Pologne)](/lugar/tatrzanski-park-narodowy/).
  de:
    intro: >-
      Um ans Wasser zu gelangen, musst du zuerst ein Felsentor durchqueren. In der Prosiecka dolina heißt
      dieses Tor Vráta, eine Felsklamm, aus der der Bach Prosiečanka kraftvoll hervorbricht; dahinter beginnt
      ein fast vier Kilometer langer Cañon, eingezwängt zwischen den Massiven Lomná und Prosečné. Parallel
      dazu verläuft das Zwillingskarsttal Kvačianska dolina. Beide sind nationale Naturreservate in den
      Choč-Bergen in Liptov und lassen sich zu einer wunderbaren Tageswanderung verbinden. Die Leser der
      Zeitschrift Krásy Slovenska wählten Prosiecka einst zum schönsten Tal der Slowakei.
    landscape: >-
      Kalksteine und Dolomite prägen das Relief wie im gesamten Choč-Gebirge. Auf diesem weichen Gestein
      formte das Wasser der Prosiečanka tiefe Schluchten, meißelte markante Felstürme heraus und schuf
      rauschende Wasserfälle. Viele Felsen tragen eigene Namen: Sova (Eule), Ťava (Kamel), Sokol (Falke),
      Medveď (Bär) oder Jánošík.


      Das Prosiecka-Tal lässt sich in Etappen erkunden. Hinter dem Vráta-Engpass öffnet sich das Tal auf der
      Waldwiese Polhora, gesäumt von imposanten Felsgruppen. Weiter oben gabelt sich der Weg: ein Abstecher
      führt nach Červené piesky mit seinem fünfzehn Meter hohen Wasserfall, während der andere durch die
      Schluchten Nižný und Vyšný Straz hinaufzieht, die spektakulärsten Passagen des Tals. Dort überwinden
      Eisenleitern die Felsstufen. Am Ende der Klamm flacht das Gelände auf der Karsthochfläche Svorad ab,
      übersät mit Dolinen und Quellen – der höchste Punkt des Rundwegs. In der Umgebung gibt es auch Höhlen;
      die bekannteste ist die Prosiek-Höhle.


      Kvačianska besitzt einen ganz anderen Charakter: eine tiefe Waldschlucht mit dichter Vegetation auf
      Kalkböden. Im oberen Abschnitt, bei Oblazy, fließen die Bäche Kvačianka, Borovianka und Ráztocký
      zusammen. Im unteren Talabschnitt bietet die Felskanzel Roháč weite Ausblicke über die gesamte Schlucht.
    wildlife: >-
      Das Überraschendste dieser Täler wächst direkt am Boden. Das zerklüftete Relief, die extreme Enge und
      häufige Temperaturinversionen bewahren kälte- und alpenliebende Pflanzen als Reliktgesellschaften. Am
      schattigen Grund von Kvačianska wachsen subalpine und Hochgebirgsarten, während auf sonnigen Felsköpfen
      wärmeliebende und trockenheitsresistente Pflanzen siedeln. Das Edelweiß steigt hier auf eine seiner
      niedrigsten Höhenlagen in der Slowakei hinab, auf 665 Meter. Auch Alpen-Aster, Alpen-Fettkraut und
      Karpaten-Endemiten wie Soldanella carpatica, Festuca tatrae, Dianthus nitidus und Saxifraga wahlenbergii
      sind hier heimisch. Zu den geschützten Besonderheiten zählen Cypripedium calceolus (Frauenschuh) und
      Pulsatilla slavica.


      Die Tierwelt der Reservate umfasst den [Eurasischen Luchs](/especie/lynx_lynx/), den
      [Wolf](/especie/canis_lupus/), den [Braunbären](/especie/ursus_arctos/) und den [Eurasischen
      Fischotter](/especie/lutra_lutra/). Unter den Amphibien leben der [*Triturus
      montandoni*](/especie/triturus_montandoni/) (Karpatenmolch) und die Gelbbauchunke (Bombina variegata),
      begleitet von Fledermausarten wie Mopsfledermaus (Barbastella barbastellus), Großem Mausohr (Myotis
      myotis) und Kleiner Hufeisennase (Rhinolophus hipposideros).


      Saisonal entfalten die Täler vor allem im Sommer ihren Reiz. Prosiecka und Kvačianska gehören zu den
      beliebtesten Sommerausflügen in Liptov und begeistern dank mäßiger Schwierigkeit viele Familien.
    visit: >-
      Der Rundweg beginnt in Prosiek, nördlich des Stausees Liptovská Mara. Zunächst steigt man durch
      Prosiecka über Eisenleitern nach Svorad hinauf. Von dort führt ein blau markierter Pfad hinab nach Veľké
      Borové und durch die Borovianka-Schlucht weiter nach Oblazy. Von Oblazy geht es durch das Kvačianska-Tal
      zurück nach Kvačany, vorbei an einer Aussichtskanzel auf einem Felsvorsprung mit Panoramablick über
      Schlucht und Berge. Insgesamt umfasst die Route rund zwanzig Kilometer und dreihundert Höhenmeter.


      Entlang des Weges informiert ein Lehrpfad an zwölf Stationen über Geografie, Biologie und
      Regionalgeschichte. Im Prosiecka-Tal beginnt er in Prosiek und folgt der blauen Markierung durch das
      Tal. In Kvačianska verläuft ein rot markierter Weg zwischen Kvačany und Huty. Wer höher hinaus will,
      folgt ab Svorad der grünen Markierung auf den Prosečné (1.372 Meter) und steigt über den Sattel Ostruky
      zur oberen Mühle ab.


      Die Wassermühlen von Oblazy lohnen einen längeren Aufenthalt: zwei hölzerne Wassermühlen aus dem
      neunzehnten Jahrhundert, technische Denkmäler, die von Freiwilligen gepflegt werden. Die untere Mühle
      mit Sägewerk ist voll funktionsfähig restauriert und zeigt eine Ausstellung historischer Mühlentechnik.
    history: >-
      Über Generationen war ein alter Karrenweg auf dem Grund von Kvačianska die einzige Verbindung der
      Bergdörfer Veľké Borové und Huty mit der Außenwelt. Im unteren Abschnitt wurde 1860 auf dem Felsen
      Roháč, dem höchsten Punkt des alten Weges mit Blick über die gesamte Schlucht, ein Steinkreuz errichtet.
      Die Mühlen wiederum überlebten dank engagierter Freiwilliger.


      Sowohl Prosiecka dolina als auch Kvačianska dolina stehen als nationale Naturreservate unter strengem
      Schutz.
    before: >-
      Busse verkehren von Liptovský Mikuláš nach Prosiek und Kvačany; der Rundweg beginnt und endet in
      Prosiek. Im Prosiecka-Tal überwindet man Felsstufen über Eisenleitern – bedenke dies bei Wanderungen mit
      Kindern. Beide Reservate beherbergen empfindliche Gebirgspflanzen und geschützte Tierarten: bleibe stets
      auf den markierten Wegen.
    around: >-
      In drei Kilometern Entfernung liegt der [Nationalpark Tatra (Slowakei)](/lugar/tatransky-narodny-park/),
      und fünfzehn Kilometer entfernt der [Nationalpark Tatra (Polen)](/lugar/tatrzanski-park-narodowy/).
  it:
    intro: >-
      Per raggiungere l’acqua bisogna prima attraversare una porta di roccia. Nella Prosiecka dolina questa
      porta si chiama Vráta, una gola rocciosa da cui sgorga impetuoso il torrente Prosiečanka; alle sue
      spalle inizia un canyon lungo quasi quattro chilometri incastonato tra i massicci di Lomná e Prosečné.
      Parallelamente scorre la valle gemella, la Kvačianska dolina. Sono due riserve naturali nazionali dei
      monti Choč, nel Liptov, unite in un unico itinerario ad anello percorribile in una giornata. I lettori
      della rivista Krásy Slovenska elessero Prosiecka come la valle più bella della Slovacchia.
    landscape: >-
      Calcari e dolomie dominano la scena, proprio come nel resto dei monti Choč. Su questa roccia tenera
      l’acqua della Prosiečanka ha lavorato a lungo: ha scavato gole profonde, modellato torrioni e guglie
      rocciose e creato cascate scroscianti. Alcuni speroni hanno nomi popolari: Sova (Gufo), Ťava (Cammello),
      Sokol (Falco), Medveď (Orso) o Jánošík.


      La Prosiecka si esplora per tappe. Oltre la stretta di Vráta, la valle si apre nella radura di Polhora,
      incorniciata da gruppi di falesie. Più in alto il tracciato si biforca: un ramo conduce a Červené
      piesky, con una cascata di quindici metri, mentre l’altro sale verso le forre di Nižný e Vyšný Straz, i
      passaggi più spettacolari dell’intera forra. Lì scalette d’acciaio aiutano a superare i salti di roccia.
      Al termine del canyon il terreno spiana sull’altopiano carsico di Svorad, ricco di doline e risorgive,
      punto culminante dell’anello. Nei dintorni si aprono anche diverse grotte, la più celebre delle quali è
      la grotta di Prosiek.


      Kvačianska mostra un’altra personalità: una profonda gola coperta di boschi adagiati su terreni
      calcarei. Nella parte alta, a Oblazy, confluiscono i torrenti Kvačianka, Borovianka e Ráztocký. Più a
      valle, il belvedere dello sperone di Roháč regala scorci magnifici su tutto il canyon.
    wildlife: >-
      La sorpresa più grande di queste valli cresce a filo del terreno. Il rilievo tormentato, il forte
      incassamento delle forre e le frequenti inversioni termiche mantengono comunità relitte di piante alpine
      e amanti del freddo. Sul fondovalle umido di Kvačianska allignano specie subalpine e d’alta quota,
      mentre in cima ai crinali assolati crescono piante termofile e resistenti all’aridità. La stella alpina
      scende qui a una delle sue quote più basse in Slovacchia, a 665 metri. Si incontrano anche l’astro
      alpino, la pinguicola alpina ed endemismi carpatici quali Soldanella carpatica, Festuca tatrae, Dianthus
      nitidus e Saxifraga wahlenbergii. Tra i fiori protetti spiccano Cypripedium calceolus (pianella della
      Madonna) e Pulsatilla slavica.


      Tra i mammiferi protetti censiti nella riserva figurano la [lince eurasiatica](/especie/lynx_lynx/), il
      [lupo grigio](/especie/canis_lupus/), l’[orso bruno](/especie/ursus_arctos/) e la [lontra
      europea](/especie/lutra_lutra/). Tra gli anfibi compaiono il [*Triturus
      montandoni*](/especie/triturus_montandoni/) (tritone dei Carpazi) e Bombina variegata (ululone dal
      ventre giallo), mentre tra i chirotteri si segnalano Barbastella barbastellus, Myotis myotis e
      Rhinolophus hipposideros.


      Nelle varie stagioni, queste forre danno il meglio di sé soprattutto in estate. Prosiecka e Kvačianska
      sono tra le mete estive più frequentate del Liptov e, grazie alla loro difficoltà moderata, risultano
      ideali per le famiglie.
    visit: >-
      L’anello inizia da Prosiek, a nord del bacino artificiale di Liptovská Mara. Si risale dapprima la
      Prosiecka superando le scalette d’acciaio fino a Svorad. Da lì un sentiero con segnavia blu scende verso
      Veľké Borové e prosegue lungo la forra di Borovianka fino a Oblazy. Da Oblazy si rientra seguendo la
      Kvačianska verso Kvačany, incontrando una terrazza panoramica su uno sperone roccioso affacciata sulla
      gola e sulle vette circostanti. In totale il tragitto copre circa venti chilometri con trecento metri di
      dislivello.


      Lungo il cammino si snoda un sentiero didattico con dodici stazioni esplicative dedicate a geografia,
      biologia e storia locale. Nella Prosiecka parte da Prosiek seguendo i segnavia blu per tutta la valle.
      Nella Kvačianska un tracciato con segnavia rossi collega Kvačany e Huty. Chi desidera salire più in alto
      può imboccare a Svorad il sentiero verde che sale al monte Prosečné, a 1.372 metri, ridiscendendo poi
      dalla sella di Ostruky verso il mulino superiore.


      I mulini di Oblazy meritano una sosta attenta: due mulini ad acqua in legno dell’Ottocento, monumenti di
      archeologia tecnica custoditi da volontari. Quello inferiore, dotato di segheria, è stato completamente
      rimesso in funzione e ospita un’esposizione sulle antiche tecniche molitorie.
    history: >-
      Per generazioni un’antica carrareccia tracciata sul fondo della Kvačianska fu l’unica via di
      collegamento dei remoti villaggi di Veľké Borové e Huty con l’esterno. Nel settore inferiore, nel 1860,
      venne eretta una croce di pietra sullo sperone di Roháč, il punto più elevato del vecchio tragitto che
      domina l’intera forra. I mulini continuano a vivere grazie all’impegno instancabile dei volontari.


      Prosiecka dolina e Kvačianska dolina sono entrambe protette come riserve naturali nazionali.
    before: >-
      Gli autobus collegano Liptovský Mikuláš a Prosiek e Kvačany; l’itinerario ad anello inizia e termina a
      Prosiek. Nella Prosiecka alcuni risalti rocciosi si superano tramite scalette d’acciaio: tienine conto
      se cammini con bambini. Entrambe le riserve proteggono flora alpina e fauna vulnerabile: rimani sempre
      lungo i sentieri segnalati.
    around: >-
      A tre chilometri si trova il [Parco Nazionale dei Tatra (Slovacchia)](/lugar/tatransky-narodny-park/), e
      a quindici chilometri il [Parco Nazionale dei Tatra (Polonia)](/lugar/tatrzanski-park-narodowy/).
  pt:
    intro: >-
      Para alcançar a água é preciso transpor primeiro uma porta de rocha. Na Prosiecka dolina essa passagem
      chama-se Vráta, uma garganta rochosa de onde brota com ímpeto o ribeiro Prosiečanka; logo atrás começa
      um desfiladeiro com quase quatro quilómetros entalhado entre os maciços de Lomná e Prosečné. A seu lado
      corre em paralelo o vale gémeo, Kvačianska dolina. São duas reservas naturais nacionais dos montes Choč,
      em Liptov, articuladas num circuito circular para fazer num dia. Os leitores da revista Krásy Slovenska
      elegeram outrora Prosiecka como o vale mais bonito da Eslováquia.
    landscape: >-
      Calcários e dolomitos moldam a paisagem, tal como no resto dos montes Choč. Sobre essa rocha branda a
      água do Prosiečanka esculpiu gargantas profundas, talhou agulhas e blocos de pedra e formou cascatas.
      Vários rochedos têm nomes próprios populares: Sova (Coruja), Ťava (Camelo), Sokol (Falcão), Medveď
      (Urso) ou Jánošík.


      Prosiecka percorre-se por etapas. Após a entrada de Vráta, o vale alarga-se na clareira de Polhora,
      ladeada por imponentes falesias. Mais acima o trilho bifurca-se: um ramal conduz a Červené piesky com
      uma cascata de quinze metros, e o outro sobe em direção às gargantas de Nižný e Vyšný Straz, as
      passagens mais impressionantes do vale. Aí o relevo vence-se com escadas de aço. No fim do desfiladeiro,
      o terreno nivela-se em Svorad, um planalto cársico com sumidouros e ressurgências que marca o ponto mais
      alto do circuito. Na zona existem também grutas, sendo a mais conhecida a gruta de Prosiek.


      Kvačianska tem uma feição distinta: uma garganta profunda coberta de arvoredo adaptado a solos
      calcários. No topo, em Oblazy, unem-se as águas dos ribeiros Kvačianka, Borovianka e Ráztocký. No troço
      inferior, o esporão de Roháč descortina vistas amplas sobre todo o desfiladeiro.
    wildlife: >-
      O maior encanto destes vales cresce junto ao solo. O relevo acidentado, o estreitamento acentuado e as
      inversões térmicas frequentes conservam plantas alpinas e de ambientes frios como comunidades relíquias.
      No fundo fresco de Kvačianska surgem espécies subalpinas e de alta montanha, enquanto nos cumes e
      escarpas soalheiras habitam plantas termófilas e adaptadas à secura. O edelvaisse desce aqui a uma das
      suas cotas mais baixas na Eslováquia, aos 665 metros. Encontram-se também o áster-alpino, a
      pinguícula-alpina e endemismos cárpaticos como Soldanella carpatica, Festuca tatrae, Dianthus nitidus e
      Saxifraga wahlenbergii. Entre a flora notável destacam-se Cypripedium calceolus (sapatinho-de-vénus) e
      Pulsatilla slavica.


      A fauna protegida assinalada na reserva inclui o [lince-euroasiático](/especie/lynx_lynx/), o
      [lobo-cinzento](/especie/canis_lupus/), o [urso-pardo](/especie/ursus_arctos/) e a
      [lontra-europeia](/especie/lutra_lutra/). Entre os anfíbios ocorrem o [*Triturus
      montandoni*](/especie/triturus_montandoni/) (tritão-dos-cárpatos) e Bombina variegata, além de morcegos
      como Barbastella barbastellus, Myotis myotis e Rhinolophus hipposideros.


      Ao longo das estações, estes vales mostram todo o seu esplendor no verão. Prosiecka e Kvačianska
      contam-se entre os destinos mais concorridos de Liptov nos meses estivais e, pela sua dificuldade
      moderada, atraem muitas famílias.
    visit: >-
      O circuito circular parte de Prosiek, a norte da albufeira de Liptovská Mara. Sobe-se primeiro por
      Prosiecka, recorrendo a escadas de aço até Svorad. De lá, uma vereda com marcas azuis desce até Veľké
      Borové e continua pela garganta de Borovianka até Oblazy. De Oblazy regressa-se por Kvačianska em
      direção a Kvačany, passando por um miradouro sobre um rochedo com vistas desafogadas para o vale e as
      montanhas vizinhas. No total, são cerca de vinte quilómetros e trezentos metros de desnível acumulado.


      Ao longo do caminho existe um percurso didático com doze paragens informativas sobre geografia, biologia
      e história local. Em Prosiecka começa em Prosiek e segue a sinalização azul por todo o vale. Em
      Kvačianska um trilho de marcas vermelhas liga Kvačany e Huty. Para subir mais alto, parte de Svorad um
      trilho de marcas verdes rumo ao pico Prosečné, aos 1.372 metros, descendo depois pelo colo de Ostruky
      até ao moinho superior.


      Os moinhos de Oblazy justificam uma paragem demorada: dois moinhos de água em madeira do século XIX,
      declarados monumentos técnicos e zelados por voluntários. O inferior, equipado com serração, está
      completamente recuperado em funcionamento e acolhe uma exposição sobre técnicas tradicionais de moagem.
    history: >-
      Durante muito tempo, um velho caminho de carros de bois pelo fundo de Kvačianska foi a única ligação das
      aldeias isoladas de Veľké Borové e Huty ao mundo exterior. No troço inferior, em 1860, ergueu-se uma
      cruz de pedra no rochedo de Roháč, o ponto mais alto do antigo trilho com vista sobre todo o
      desfiladeiro. Os moinhos continuam de pé graças ao empenho de voluntários.


      Prosiecka dolina e Kvačianska dolina estão ambas classificadas como reservas naturais nacionais.
    before: >-
      Há autocarros regulares entre Liptovský Mikuláš e as aldeias de Prosiek e Kvačany; a rota circular
      começa e termina em Prosiek. Na Prosiecka as escarpas são vencidas pontualmente por escadas de aço, pelo
      que deves ter isso em conta se caminhares com crianças. Ambas as reservas constituem habitat de flora
      alpina e fauna protegida: não saias dos trilhos sinalizados.
    around: >-
      A três quilómetros fica o [Parque Nacional dos Tatras (Eslováquia)](/lugar/tatransky-narodny-park/), e a
      quinze quilómetros o [Parque Nacional dos Tatras (Polónia)](/lugar/tatrzanski-park-narodowy/).
