    La gran fortaleza caliza kárstica de Cerdeña, con dolinas colosales como la Tiscali y encinares
    ancestrales no alterados.
  en: >-
    Sardinia's immense limestone fortress, featuring monumental sinkholes like Tiscali and pristine old-growth
    holm oak forests.
  fr: >-
    L'immense forteresse calcaire de Sardaigne, aux dolines colossales comme Tiscali et aux chênaies vertes
    ancestrales préservées.
  de: >-
    Sardiniens gewaltige Kalksteinfestung mit monumentalen Dolinen wie Tiscali und unberührten uralten
    Steineichenwäldern.
  it: >-
    La grande fortezza calcareo-carsica della Sardegna, con doline colossali come Tiscali e leccete primigenie
    intatte.
  pt: >-
    A colossal fortaleza calcária da Sardenha, com dolinas monumentais como Tiscali e azinhais milenares
    intocados.
unico:
