texto:
  es:
    intro: >-
      Desde las calles de Oliena se ve la pared: una muralla de caliza que cierra el cielo y que se conoce
      también como las Dolomitas sardas. Detrás empieza el Supramonte, un enorme complejo calcáreo-dolomítico
      de altiplanos en el centro-este de Cerdeña, de unos trescientos cincuenta kilómetros cuadrados.
      Alrededor de novecientos metros de altitud media, el agua ha tallado gargantas y simas muy profundas;
      por debajo, una red de acuíferos kársticos alimenta cuevas y surgencias. Es un macizo duro, hecho de
      roca, encinas y silencio, que se descubre a pie.
    landscape: >-
      El techo del Supramonte es el Monte Corrasi, de 1463 metros. A su lado se alinean Ortu Hamminu,
      Carabidda, Sos Nidos y Punta Cusidore, cumbres de un macizo que cae sobre Oliena en bastiones
      extraplomados y que a su espalda se abre en valles, mesetas, dolinas y cañones. En las paredes hay
      torreones, agujas blancas y cuevas, el pico es áspero y pelado, la franja media está cubierta de encinas
      y a los pies hay olivos, viñas y almendros. Entre las paredes extraplomadas la más famosa es la de Badde
      Pentumas.


      Por dentro, el macizo es un mundo de cuevas. En el valle de Lanaitto, al pie del Corrasi, se abren las
      de Sa Oche, Su Bentu y Corbeddu. Las dos primeras comunican por un sifón natural y su río reaparece en
      la surgencia de Su Gologone tras recorrer unos treinta kilómetros bajo tierra; Su Gologone es la mayor
      surgencia kárstica de Cerdeña y está declarada monumento nacional. En la cueva Corbeddu se hallaron en
      1968 los restos de *Prolagus sardus*, un pequeño roedor extinto en época romana. En el otro lado del
      macizo, en Orgosolo, la dolina de Su Suercone, de cuatrocientos metros de diámetro, es monumento
      natural.


      El clima cambia con la altura: continental arriba, mediterráneo fresco en las faldas. Las primeras
      nevadas llegan a menudo en octubre y noviembre, y en los meses fríos la temperatura baja varios grados
      bajo cero.
    wildlife: >-
      El Corrasi parece árido y desolado, pero guarda unas seiscientas cincuenta especies botánicas, con
      numerosos endemismos, hasta el punto de que en los años setenta la Sociedad Botánica Italiana incluyó la
      montaña en su censo de biotopos de interés. Bajo las encinas de Sas Baddes, en el bosque de Montes,
      crecen ejemplares vetustos de encina, tejo, enebro y acebo, y en el sotobosque la peonía, de grandes
      flores púrpura. En Pradu, en una zona mínima, vive el endemismo *Ribes sardoum*.


      En el aire mandan las rapaces. En las paredes de Sos Nidos anidan varias; en el Corrasi se citan el
      [águila real](/especie/aquila_chrysaetos/), el ratonero, el [halcón de
      Eleonora](/especie/falco_eleonorae/) y el [halcón peregrino](/especie/falco_peregrinus/). También anidan
      sin molestias el cernícalo vulgar, el azor, el gavilán y la paloma torcaz. Entre los mamíferos, el
      [muflón](/especie/ovis_gmelini/) recorre libremente las laderas, y en el bosque de Montes viven el gato
      montés sardo, el lirón sardo, el zorro sardo, la marta, la liebre y el conejo.
    visit: >-
      La ruta más completa sube desde Oliena al Corrasi. Sale del barrio de Su Carmene, en la parte alta del
      pueblo, y es una subida constante: unas tres horas y media hacia arriba y unas dos horas cuarenta hacia
      abajo, con una pendiente media del diez al diecisiete por ciento. Atraviesa pinares y encinares,
      antiguas carboneras y claros panorámicos, hasta los campos de caliza de las cotas altas. A mitad de
      camino está el área de Tuones, con bancos y un antiguo refugio pastoril de piedra restaurado para
      resguardarse del mal tiempo. El último tramo es una pista expuesta a fuertes pendientes y al viento
      cuando sopla del noroeste.


      En Pradu, a más de mil doscientos metros, se abre la vista al macizo y empieza el ramal hacia el valle
      de Lanaitto, casi cuatro horas a pie. La ruta forma parte del Sentiero Italia, que cruza todo el
      Supramonte por las crestas principales. Desde la cresta del Corrasi se ven Nuoro, Orgosolo, Dorgali, la
      costa de Cala Gonone y el Gennargentu. Los senderos son exigentes y están pensados para excursionistas
      entrenados.
    history: >-
      Hoy es un paisaje áspero, pero los nuragicos lo habitaron. Solo en Dorgali dejaron huellas de setenta y
      ocho poblados, cuarenta y seis nuraghi, catorce dólmenes, cuarenta tumbas de gigantes y diecisiete pozos
      sagrados. En Urzulei, el poblado de Or Murales, de la Edad del Bronce, conserva un estado excepcional.
      En Su Mudrecu, los enebros centenarios secos recuerdan el incendio de 1931 que destruyó el bosque.
    before: >-
      Los senderos del Supramonte son exigentes. En el tramo alto sopla el viento, y las primeras nevadas
      pueden llegar en octubre y noviembre.
    around: >-
      La [Garganta de Gorropu - Cañón del Supramonte (Cerdeña)](/lugar/gola-di-gorropu/) está dentro del mismo
      macizo: la excava el río Flumineddu, que ha labrado durante veintidós kilómetros un cañón en la parte
      oriental del Supramonte, en el límite con Orgosolo.
  en:
    intro: >-
      Looking up from the streets of Oliena, the sheer limestone wall dominates the horizon: an imposing white
      battlement closing off the skyline, often nicknamed the Sardinian Dolomites. Behind it unfolds the
      Supramonte, a vast upland plateau complex of limestone and dolomite sprawling across roughly three
      hundred and fifty square kilometres in east-central Sardinia. At an average elevation of nine hundred
      metres, rain and subterranean streams have carved yawning gorges and deep chasms; beneath the surface, a
      labyrinthine karst aquifer feeds springs and submerged caves. It is an unyielding realm of stone, holm
      oaks, and solitude, best discovered on foot.
    landscape: >-
      The highest summit of the Supramonte is Monte Corrasi at 1463 metres. Flanking it stand Ortu Hamminu,
      Carabidda, Sos Nidos, and Punta Cusidore—peaks forming an abrupt barrier that drops precipitously over
      Oliena in sheer overhanging bastions while opening inward into valleys, high plateaus, dolines, and dry
      canyons. The cliff faces feature limestone towers, gleaming needles, and cave entrances; the crests are
      windswept and bare, the middle slopes cloaked in evergreen holm oaks, and the foothills terraced with
      olive groves, vineyards, and almond trees. Among its sheer walls, Badde Pentumas is the most renowned.


      Inside, the massif hollows out into an underworld of caves. In the Lanaitto valley at the foot of
      Corrasi open the caverns of Sa Oche, Su Bentu, and Corbeddu. The first two connect through a natural
      siphon, their subterranean river resurfacing at the karst spring of Su Gologone after traveling thirty
      kilometres underground; Su Gologone represents Sardinia's greatest karst resurgence, classified as a
      national monument. In Corbeddu Cave, excavators discovered in 1968 the fossil bones of Prolagus sardus,
      an extinct endemic lagomorph that survived into Roman times. On the opposite side of the massif near
      Orgosolo, the Su Suercone sinkhole measures four hundred metres across, protected as a natural monument.


      Climate changes with elevation: cool continental up high, temperate Mediterranean along the lower
      skirts. First snowfalls often arrive in October and November, and winter temperatures regularly drop
      several degrees below freezing.
    wildlife: >-
      Though Corrasi looks barren and forbidding, it shelters around six hundred and fifty plant species with
      numerous rarities, prompting the Italian Botanical Society in the nineteen-seventies to include the
      mountain on its list of priority conservation biotopes. Beneath the holm oaks of Sas Baddes in the
      Montes Forest grow ancient specimens of holm oak, yew, juniper, and holly, with wild peonies bearing
      deep magenta flowers in the understory. On the Pradu plateau, the rare endemic currant Ribes sardoum
      survives in a tiny localized enclave.


      Birds of prey rule the skies. In the crags of Sos Nidos nest multiple raptors; on Corrasi observers
      record the [golden eagle](/especie/aquila_chrysaetos/), common buzzard, [Eleonora's
      falcon](/especie/falco_eleonorae/), and [peregrine falcon](/especie/falco_peregrinus/). Common kestrels,
      northern goshawks, Eurasian sparrowhawks, and common wood pigeons breed undisturbed. Among mammals, wild
      [mouflon](/especie/ovis_gmelini/) roam rocky ledges, while the Montes Forest harbors the Sardinian
      wildcat, Sardinian dormouse, Sardinian fox, pine marten, mountain hare, and rabbit.
    visit: >-
      The definitive trekking ascent climbs from Oliena to the summit of Monte Corrasi. Starting from the Su
      Carmene quarter in the upper village, it involves a continuous uphill trek: roughly three and a half
      hours ascending and two hours and forty minutes descending, with average gradients ranging from ten to
      seventeen percent. It ascends through pine groves and holm oak woods, passing former charcoal-burning
      clearings and panoramic viewpoints before reaching the bare karst pavements of the upper crest. Midway
      sits the Tuones area, furnished with stone benches and a restored shepherd's shelter for refuge in foul
      weather. The final section follows an exposed mountain track vulnerable to steep drops and ferocious
      northwesterly gales.


      At Pradu, beyond twelve hundred metres elevation, the panorama widens across the interior plateaus and a
      branch trail descends into the Lanaitto valley, taking nearly four hours on foot. The trail forms part
      of the Sentiero Italia traversing the Supramonte crests. From the summit of Corrasi you can see Nuoro,
      Orgosolo, Dorgali, the coastline of Cala Gonone, and the Gennargentu massif. These trails are demanding
      and intended for fit, well-equipped hikers.
    history: >-
      Though today it appears desolate, ancient Nuragic communities inhabited these highlands. In the
      municipality of Dorgali alone, archaeologists have identified seventy-eight prehistoric villages,
      forty-six nuraghi, fourteen dolmens, forty giants' graves, and seventeen sacred wells. Near Urzulei, the
      Bronze Age village of Or Murales survives in an exceptional state of preservation. At Su Mudrecu,
      charred centuries-old juniper snags bear witness to a catastrophic wildfire in 1931 that razed the
      ancient woodland.
    before: >-
      Supramonte trails are remote and physically taxing. On high crests biting winds prevail, and the first
      autumn snows can arrive without warning in October and November.
    around: >-
      The [Gorropu Gorge – Supramonte Canyon (Sardinia)](/lugar/gola-di-gorropu/) lies within the same massif:
      excavated by the Flumineddu River, it has carved a dramatic twenty-two-kilometre canyon along the
      eastern flanks of the Supramonte bordering Orgosolo.
  fr:
    intro: >-
      Depuis les ruelles d'Oliena, la paroi s'impose au regard : une gigantesque muraille calcaire barrant
      l'horizon, souvent surnommée les Dolomites sardes. Derrière s'étend le Supramonte, un vaste ensemble de
      hauts plateaux calcaires et dolomitiques occupant environ trois cent cinquante kilomètres carrés dans le
      centre-est de la Sardaigne. Vers neuf cents mètres d'altitude moyenne, l'eau a façonné de profondes
      gorges et d'immenses avens ; sous terre, un réseau d'aquifères karstiques alimente cavités et
      résurgences. C'est un pays rude, fait de roche blanche, de chênes verts et de solitude, qui se découvre
      à pied.
    landscape: >-
      Le point culminant du Supramonte est le Monte Corrasi, dressé à 1463 mètres. À ses côtés s'alignent Ortu
      Hamminu, Carabidda, Sos Nidos et Punta Cusidore, cimes d'un massif plongeant sur Oliena en bastions
      vertigineux et s'ouvrant sur l'arrière en vallées suspendues, dolines et canyons arides. Les falaises
      arborent tours de pierre, aiguilles blanches et porches de grottes ; les crêtes sont nues et ventées,
      l'étage moyen garni de chênes verts et le piémont complanté d'oliviers, de vignes et d'amandiers. Parmi
      les parois rocheuses, Badde Pentumas est la plus renommée.


      Dans ses entrailles, la roche abrite un réseau spéléologique majeur. Dans la vallée de Lanaitto au pied
      du Corrasi s'ouvrent les grottes de Sa Oche, Su Bentu et Corbeddu. Les deux premières communiquent par
      un siphon naturel et leur rivière souterraine réapparaît à la résurgence de Su Gologone après un
      parcours souterrain de trente kilomètres ; Su Gologone constitue la plus importante exsurgence de
      Sardaigne, classée monument national. Dans la grotte Corbeddu furent découverts en 1968 les restes
      fossiles de Prolagus sardus, petit rongeur endémique disparu à l'époque romaine. Sur l'autre versant
      vers Orgosolo, la doline de Su Suercone, large de quatre cents mètres, est protégée comme monument
      naturel.


      Le climat varie avec l'altitude : continental frais sur les crêtes, méditerranéen tempéré au pied. Les
      premières neiges surviennent fréquemment en octobre et novembre, et en hiver les températures descendent
      souvent sous zéro.
    wildlife: >-
      Le Corrasi semble aride et désolé, mais il abrite environ six cent cinquante espèces végétales comptant
      de précieux endémismes, ce qui incita la Société botanique italienne dans les années soixante-dix à
      inscrire la montagne parmi ses biotopes prioritaires. Sous les chênes verts de Sas Baddes, dans la forêt
      de Montes, s'élèvent de vénérables spécimens de chêne vert, d'if, de genévrier et de houx, avec des
      pivoines sauvages aux fleurs pourpres en sous-bois. À Pradu, sur une surface minuscule, subsiste
      l'arbrisseau endémique rarissime Ribes sardoum.


      Dans les airs règnent les rapaces. Les falaises de Sos Nidos accueillent plusieurs nids ; sur le Corrasi
      nichent l'[aigle royal](/especie/aquila_chrysaetos/), la buse variable, le [faucon
      d'Éléonore](/especie/falco_eleonorae/) et le [faucon pèlerin](/especie/falco_peregrinus/). Le faucon
      crécerelle, l'autour des palombes, l'épervier et le pigeon ramier s'y reproduisent en toute
      tranquillité. Chez les mammifères, le [mouflon](/especie/ovis_gmelini/) parcourt librement les éboulis,
      tandis que la forêt de Montes abrite chat sauvage sarde, lérot sarde, renard sarde, martre, lièvre et
      lapin.
    visit: >-
      L'ascension classique part d'Oliena vers le sommet du Corrasi. Débutant au quartier de Su Carmene dans
      le haut du village, c'est une montée soutenue : environ trois heures et demie à l'aller et deux heures
      quarante au retour, avec une déclivité moyenne de dix à dix-sept pour cent. Le sentier grimpe entre
      pinèdes et chênaies, anciennes charbonnières et belvédères panoramiques, jusqu'aux lapiaz sommitaeaux. À
      mi-parcours, l'aire de Tuones offre des bancs et un abri pastoral restauré en pierre en cas
      d'intempéries. Le dernier tronçon suit une sente exposée aux pentes raides et au vent soufflant du
      nord-ouest.


      À Pradu, à plus de douze cents mètres d'altitude, la vue s'ouvre sur le massif et s'amorce la descente
      vers la vallée de Lanaitto, en près de quatre heures de marche. L'itinéraire s'intègre au Sentiero
      Italia parcourant les crêtes du Supramonte. Depuis la crête du Corrasi, on embrasse Nuoro, Orgosolo,
      Dorgali, le littoral de Cala Gonone et le Gennargentu. Les sentiers sont soutenus et s'adressent à des
      marcheurs entraînés.
    history: >-
      Aujourd'hui sauvage et minéral, le plateau fut intensément peuplé à l'époque nuragique. Sur la seule
      commune de Dorgali subsistent soixante-dix-huit villages antiques, quarante-six nuraghes, quatorze
      dolmens, quarante tombes des géants et dix-sept puits sacrés. À Urzulei, le village de l'âge du bronze
      d'Or Murales présente une conservation remarquable. À Su Mudrecu, des genévriers calcinés témoignent du
      terrible incendie de 1931 qui ravagea la forêt.
    before: >-
      Les sentiers du Supramonte sont exigeants et isolés. Sur les crêtes le vent souffle fort, et les
      premières chutes de neige peuvent survenir dès octobre et novembre.
    around: >-
      La [gorge de Gorropu – canyon du Supramonte (Sardaigne)](/lugar/gola-di-gorropu/) se situe dans ce même
      massif : façonnée par le Flumineddu, elle entaille un canyon spectaculaire de vingt-deux kilomètres sur
      le flanc oriental du Supramonte en limite d'Orgosolo.
  de:
    intro: >-
      Aus den Gassen von Oliena ragt die Felswand empor: ein massives weißes Kalkbollwerk, das den Horizont
      abschließt und oft als die sardischen Dolomiten bezeichnet wird. Dahinter erstreckt sich der Supramonte,
      ein riesiges Kalk- und Dolomithochplateau im mittleren Osten Sardiniens mit einer Fläche von rund
      dreihundertfünfzig Quadratkilometern. Auf durchschnittlich neunhundert Metern Meereshöhe haben Wasser
      und Verwitterung tiefe Schluchten und Klüfte gegraben; im Untergrund speist ein weit verzweigtes
      Karstsystem Höhlen und gewaltige Quellen. Es ist eine archaische Welt aus nacktem Stein, Steineichen und
      Einsamkeit, die zu Fuß erkundet werden will.
    landscape: >-
      Der höchste Gipfel des Supramonte ist der Monte Corrasi mit 1463 Metern. An seiner Seite reihen sich
      Ortu Hamminu, Carabidda, Sos Nidos und Punta Cusidore aneinander – Gipfel eines Massivs, das mit steilen
      Überhängen nach Oliena abfällt und sich nach hinten in Hochtäler, Plateaus, Dolinen und Canyons öffnet.
      Die Wände zeigen Felstürme, weiße Nadeln und Höhlenportale; die Grate sind kahl und sturmgepeitscht, die
      Mittelhänge von Steineichen bedeckt und die Ausläufer von Olivenhainen, Reben und Mandelbäumen gesäumt.
      Unter den Felswänden ist Badde Pentumas die berühmteste.


      Im Inneren birgt das Gebirge eine reiche Höhlenwelt. Im Lanaitto-Tal am Fuß des Corrasi öffnen sich die
      Höhlen Sa Oche, Su Bentu und Corbeddu. Die ersten beiden sind über einen Siphon verbunden, und ihr
      unterirdischer Fluss tritt nach dreißig Kilometern Fließweg in der Karstquelle Su Gologone zutage; Su
      Gologone ist die mächtigste Karstquelle Sardiniens und als Nationalmonument ausgewiesen. In der
      Corbeddu-Höhle wurden 1968 fossile Reste des sardischen Pfeifhasen Prolagus sardus gefunden, der in der
      Römerzeit ausstarb. Auf der anderen Seite des Massivs bei Orgosolo bildet die Doline Su Suercone mit
      vierhundert Metern Durchmesser ein Naturdenkmal.


      Das Klima wechselt mit der Höhe: rau und kontinental auf den Höhen, mediterran an den Hängen. Erste
      Schneefälle treten oft im Oktober und November auf, und im Winter sinken die Temperaturen unter den
      Gefrierpunkt.
    wildlife: >-
      Der Corrasi wirkt karg und öde, birgt aber rund sechshundertfünfzig Pflanzenarten mit zahlreichen
      Endemiten, weshalb die Italienische Botanische Gesellschaft den Berg in den siebziger Jahren in ihr
      Verzeichnis schutzwürdiger Biotope aufnahm. Unter den Steineichen von Sas Baddes im Wald von Montes
      wachsen uralte Steineichen, Eiben, Wacholder und Stechpalmen, im Unterholz blühen wilde Pfingstrosen mit
      purpurnen Blüten. Bei Pradu überlebt auf winziger Fläche die endemische Johannisbeere Ribes sardoum.


      Am Himmel herrschen Greifvögel. In den Felsabbrüchen von Sos Nidos brüten mehrere Paare; am Corrasi sind
      [Steinadler](/especie/aquila_chrysaetos/), Mäusebussard, [Eleonorenfalke](/especie/falco_eleonorae/) und
      [Wanderfalke](/especie/falco_peregrinus/) heimisch. Turmfalke, Habicht, Sperber und Ringeltaube nisten
      ungestört. Unter den Säugetieren zieht das [Mufflon](/especie/ovis_gmelini/) durch die Felshänge,
      während im Montes-Wald die sardische Wildkatze, der Gartenschläfer, der sardische Fuchs, Baummarder,
      Feldhase und Wildkaninchen leben.
    visit: >-
      Der klassische Aufstieg führt von Oliena auf den Gipfel des Monte Corrasi. Er beginnt im oberen Ortsteil
      Su Carmene und verlangt stetigen Anstieg: etwa dreieinhalb Stunden hinauf und zwei Stunden vierzig
      Minuten hinab bei durchschnittlich zehn bis siebzehn Prozent Steigung. Der Pfad quert Kiefern- und
      Eichenwälder, alte Köhlerplätze und Aussichtspunkte bis zu den Karrenfeldern der Gipfelregion. Auf
      halber Höhe bietet der Rastplatz Tuones Bänke und eine restaurierte Hirtenhütte aus Stein als Schutz bei
      Wetterstürzen. Das letzte Teilstück folgt einem felsigen Bergpfad, der steilen Abhängen und
      Nordwestwinden ausgesetzt ist.


      Bei Pradu auf über zwölfhundert Metern öffnet sich der Blick über das Hochland und es zweigt der Abstieg
      ins Lanaitto-Tal ab, eine Wanderung von fast vier Stunden. Die Route ist Teil des Sentiero Italia über
      die Hauptkämme des Supramonte. Vom Corrasi-Kamm blickst du auf Nuoro, Orgosolo, Dorgali, die Küste von
      Cala Gonone und das Gennargentu-Massiv. Die Pfade sind anspruchsvoll und verlangen Trittsicherheit.
    history: >-
      Heute erscheint die Landschaft einsam, doch in der Bronzezeit war sie dicht besiedelt. Allein im
      Gemeindegebiet von Dorgali zeugen achtundsiebzig Siedlungen, sechsundvierzig Nuraghen, vierzehn Dolmen,
      vierzig Gigantengräber und siebzehn Brunnenheiligtümer von der Nuraghenkultur. Bei Urzulei ist das Dorf
      Or Murales hervorragend erhalten. Bei Su Mudrecu erinnern verkohlte uralte Wacholder an den Waldbrand
      von 1931.
    before: >-
      Die Pfade im Supramonte sind anstrengend und einsam. Auf den Graten weht oft scharfer Wind, und erste
      Schneefälle können schon im Oktober und November niedergehen.
    around: >-
      Die [Gorropu-Schlucht – Supramonte-Canyon (Sardinien)](/lugar/gola-di-gorropu/) liegt im selben Massiv:
      Der Fluss Flumineddu hat dort über zweiundzwanzig Kilometer eine spektakuläre Felsschlucht an der
      Ostflanke des Supramonte an der Grenze zu Orgosolo eingegraben.
  it:
    intro: >-
      Dalle vie di Oliena la parete incombe maestosa: una bastonata calcarea candida che sbarra l'orizzonte,
      nota anche come le Dolomiti sarde. Alle sue spalle si estende il Supramonte, un immenso altopiano
      calcareo-dolomitico della Sardegna centro-orientale di circa trecentocinquanta chilometri quadrati.
      Attorno ai novecento metri di altitudine media, le acque hanno inciso forre e inghiottitoi
      profondissimi; nel sottosuolo, una complessa rete di falde carsiche alimenta sorgenti monumentali e
      caverne. È un massiccio severo, fatto di roccia viva, lecci e silenzio, che si scopre camminando.
    landscape: >-
      Il punto più alto del Supramonte è il Monte Corrasi, a quota 1463 metri. Accanto si ergono Ortu Hamminu,
      Carabidda, Sos Nidos e Punta Cusidore, cime di una barriera che precipita su Oliena con bastioni a
      strapiombo e sul retro si apre in valli interne, altipiani carsici, doline e forre solitarie. Sulle
      pareti risaltano torrioni, guglie bianche e imbocchi di grotte; la vetta è aspra e denudata, la fascia
      intermedia foderata di lecci e ai piedi allignano oliveti, vigne e mandorli. Tra le pareti a picco la
      più celebre è Badde Pentumas.


      All'interno il massiccio custodisce un labirinto ipogeo. Nella valle di Lanaitto ai piedi del Corrasi si
      aprono le grotte di Sa Oche, Su Bentu e Corbeddu. Le prime due comunicano attraverso un sifone naturale
      e il loro corso sotterraneo rispunta nella risorgiva di Su Gologone dopo aver percorso trenta chilometri
      sottoterra; Su Gologone è la maggiore sorgente carsica della Sardegna, dichiarata monumento nazionale.
      Nella grotta Corbeddu furono rinvenuti nel 1968 i resti fossili di Prolagus sardus, un lagomorfo
      estintosi in età romana. Sul versante opposto a Orgosolo, la dolina di Su Suercone, ampia quattrocento
      metri, è tutelata come monumento naturale.


      Il clima varia con la quota: fresco continentale sulle alture, mediterraneo temperato alle falde. Le
      prime nevicate si affacciano sovente a ottobre e novembre, e nei mesi invernali la colonnina di mercurio
      scende sotto lo zero.
    wildlife: >-
      Il Corrasi appare brullo e desolato, ma accoglie circa seicentocinquanta specie botaniche con rari
      endemismi, al punto che negli anni settanta la Società Botanica Italiana inserì la montagna nel
      censimento dei biotopi di prioritario interesse. Sotto i lecci di Sas Baddes nella foresta di Montes
      vegetano esemplari vetusti di leccio, tasso, ginepro e agrifoglio, con peonie selvatiche dai grandi
      fiori purpurei nel sottobosco. A Pradu, su una superficie minima, sopravvive l'endemismo rupicolo Ribes
      sardoum.


      In cielo dominano i rapaci. Sulle balze di Sos Nidos nidificano diverse specie; sul Corrasi sono censiti
      l'[aquila reale](/especie/aquila_chrysaetos/), la poiana, il [falco della
      Regina](/especie/falco_eleonorae/) e il [falco pellegrino](/especie/falco_peregrinus/). Vi nidificano
      indisturbati anche gheppio, astore, sparviero e colombaccio. Tra i mammiferi il
      [muflone](/especie/ovis_gmelini/) percorre le cenge rocciose, mentre nella foresta di Montes vivono il
      gatto selvatico sardo, il ghiro sardo, la volpe sarda, la martora, la lepre e il coniglio.
    visit: >-
      L'escursione regina sale da Oliena alla vetta del Corrasi. Partendo dal rione di Su Carmene nella parte
      alta del borgo, richiede una salita costante: circa tre ore e mezza a salire e due ore e quaranta a
      scendere, con pendenze medie comprese tra il dieci e il diciassette per cento. Risale pinete e boschi di
      leccio, toccando antiche aie carbonili e radure panoramiche fino ai campi carreggiati sommitali. A metà
      strada l'area di Tuones offre panchine e un antico ovile in pietra restaurato utile come ricovero in
      caso di maltempo. Il tratto conclusivo corre su una traccia esposta a forti pendenze e ai venti di
      maestrale.


      A Pradu, a oltre milleduecento metri, la visuale si apre sull'altopiano e si stacca il sentiero per la
      valle di Lanaitto, quasi quattro ore a piedi. L'itinerario fa parte del Sentiero Italia lungo le creste
      del Supramonte. Dal crinale del Corrasi si ammirano Nuoro, Orgosolo, Dorgali, la costa di Cala Gonone e
      il Gennargentu. I percorsi sono impegnativi e richiedono buon allenamento.
    history: >-
      Oggi il territorio appare selvaggio, ma le genti nuragiche lo abitarono intensamente. Nel solo comune di
      Dorgali si contano settantotto villaggi protostorici, quarantasei nuraghi, quattordici dolmen, quaranta
      tombe dei giganti e diciassette pozzi sacri. A Urzulei il villaggio dell'età del bronzo di Or Murales
      mostra uno stato di conservazione prodigioso. A Su Mudrecu i ginepri secolari carbonizzati testimoniano
      il rovinoso incendio del 1931 che incenerì la foresta.
    before: >-
      I percorsi del Supramonte sono faticosi e isolati. Sulle cime spira vento forte e le prime nevicate
      possono fare la loro comparsa già tra ottobre e novembre.
    around: >-
      La [Gola di Gorropu - Canyon del Supramonte (Sardegna)](/lugar/gola-di-gorropu/) fa parte dello stesso
      comprensorio: scavata dal rio Flumineddu, forma un canyon spettacolare di ventidue chilometri sul lato
      orientale del Supramonte al confine con Orgosolo.
  pt:
    intro: >-
      A partir do casario de Oliena, a muralha impõe-se de imediato: uma imensa parede calcária que fecha o
      horizonte, amiúde apelidada de Dolomitas sardas. Para lá desta barreira estende-se o Supramonte, um
      vasto planalto calcário-dolomítico da Sardenha centro-oriental com cerca de trezentos e cinquenta
      quilómetros quadrados. Em torno dos novecentos metros de altitude média, a água cavou gargantas e
      algares abissais; no subsolo, um intrincado aquífero cársico alimenta cavernas e nascentes vultuosas. É
      um maciço austero, feito de calcário branco, azinheiras e solidão, talhado para ser percorrido a pé.
    landscape: >-
      O cume mais elevado do Supramonte é o Monte Corrasi, a 1463 metros de altitude. Ao seu lado perfilam-se
      Ortu Hamminu, Carabidda, Sos Nidos e Punta Cusidore, vértices de uma cordilheira que despenca sobre
      Oliena em bastiões vertiginosos e para o interior se desdobra em vales suspensos, planaltos, dolinas e
      desfiladeiros secos. Nas escarpas sobressaem torreões, agulhas alvas e algares; o topo é pedregoso e
      batido pelo vento, a faixa intermédia coberta de azinheiras e a base ornamentada com olivais, vinhedos e
      amendoeiras. Entre os paredões aprumados, Badde Pentumas é o mais célebre.


      Por dentro, o maciço esconde um império subterrâneo. No vale de Lanaitto, ao sopé do Corrasi, abrem-se
      as grutas de Sa Oche, Su Bentu e Corbeddu. As duas primeiras comunicam por um sifão natural e o seu
      caudal reaparece na ressurgência de Su Gologone após percorrer trinta quilómetros no subsolo; Su
      Gologone constitui a maior nascente cársica da Sardenha, classificada como monumento nacional. Na
      caverna Corbeddu recolheram-se em 1968 ossadas fósseis de Prolagus sardus, pequeno mamífero extinto na
      era romana. Na vertente oposta, em Orgosolo, a dolina de Su Suercone, com quatrocentos metros de
      diâmetro, é monumento natural.


      O clima varia com a altitude: continental fresco nos cumes, mediterrânico temperado nas abas. As
      primeiras nevadas caem amiúde em outubro e novembro, e nos meses hibernais os termómetros descem abaixo
      de zero.
    wildlife: >-
      O Corrasi aparenta aridez, mas alberga cerca de seiscentas e cinquenta espécies botânicas com numerosos
      endemismos, a ponto de a Sociedade Botânica Italiana ter incluído a serra nos anos setenta no rol dos
      biótopos de conservação prioritária. Sob as azinheiras de Sas Baddes, na floresta de Montes, sobrevivem
      espécimes vetustos de azinheira, teixo, zimbro e azevinho, com peónias bravas de flores purpúreas no
      sub-bosque. Em Pradu, num enclave minúsculo, medra o raro endemismo arbustivo Ribes sardoum.


      Nos ares reinam as rapinas. Nos rochedos de Sos Nidos nidificam várias espécies; no Corrasi registam-se
      a [águia-real](/especie/aquila_chrysaetos/), a águia-de-asa-redonda, o
      [falcão-da-rainha](/especie/falco_eleonorae/) e o [falcão-peregrino](/especie/falco_peregrinus/). O
      peneireiro-vulgar, o açor, o gavião e o pombo-torcaz procriam sem distúrbios. Nos mamíferos, o
      [muflão](/especie/ovis_gmelini/) percorre as escarpas, ao passo que a mata de Montes alberga
      gato-bravo-sardo, arganaz-sardo, raposa-sarda, marta, lebre e coelho.
    visit: >-
      A rota mais afamada ascende de Oliena até ao cimo do Monte Corrasi. Partindo do bairro de Su Carmene na
      zona alta da vila, requer subida contínua: cerca de três horas e meia a subir e duas horas e quarenta a
      descer, com inclinações médias entre dez e dezassete por cento. Cruza pinhais e azinhais, antigas
      carvoarias e clareiras panorâmicas até aos lapiás calcários das cotas cimeiras. A meio percurso, a área
      de Tuones faculta bancos e um abrigo pastoril em pedra restaurado para proteção contra intempéries. O
      troço derradeiro segue uma vereda exposta a escarpas íngremes e a ventos fortes de noroeste.


      Em Pradu, acima dos mil e duzentos metros, descortina-se o planalto e desfralda-se o trilho rumo ao vale
      de Lanaitto, quase quatro horas a pé. O itinerário integra o Sentiero Italia pelas cristas do
      Supramonte. Do espinhaço do Corrasi avistam-se Nuoro, Orgosolo, Dorgali, o litoral de Cala Gonone e o
      Gennargentu. As veredas são exigentes e requerem boa condição física.
    history: >-
      Apesar da rudeza atual, os povos nurágicos povoaram densamente este relevo. Só no concelho de Dorgali
      subsistem vestígios de setenta e oito povoados, quarenta e seis nuragues, catorze dólmenes, quarenta
      túmulos de gigantes e dezassete poços sagrados. Em Urzulei, a aldeia da Idade do Bronze de Or Murales
      ostenta uma conservação ímpar. Em Su Mudrecu, zimbros centenários calcinados recordam o terrível
      incêndio de 1931 que consumiu a floresta.
    before: >-
      Os trilhos do Supramonte são exigentes e isolados. Nas cristas sopra vento impetuoso e as primeiras
      neves podem cair logo em outubro e novembro.
    around: >-
      O [Desfiladeiro de Gorropu – Canhão do Supramonte (Sardenha)](/lugar/gola-di-gorropu/) faz parte do
      mesmo relevo: esculpido pelo rio Flumineddu, rasga um canhão espetacular de vinte e dois quilómetros na
      vertente oriental do Supramonte no termo de Orgosolo.
