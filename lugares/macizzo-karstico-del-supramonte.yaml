    Una muralla de caliza que se eleva sobre una ciudad cualquiera de la isla y esconde dolinas, simas,
    bosques de encinas centenarias y cuevas profundas.
  en: >-
    A limestone rampart looming over everyday island towns, concealing colossal dolines, abysses,
    centuries-old holm oak woods, and profound caverns.
  fr: >-
    Une muraille calcaire dominant les bourgs sardes et dissimulant dolines, gouffres, forêts de chênes verts
    centenaires et grottes profondes.
  de: >-
    Eine monumentale Kalkmauer über sardischen Dörfern, die Dolinen, Schluchten, jahrhundertealte
    Steineichenwälder und tiefe Höhlen verbirgt.
  it: >-
    Una muraglia di calcare che si staglia sopra i paesi dell'isola celando doline, inghiottitoi, leccete
    secolari e grotte abissali.
  pt: >-
    Uma muralha calcária que se ergue sobre as povoações da ilha ocultando dolinas, algares, bosques de
    azinheiras centenárias e grutas profundas.
