resumen:
  es: >-
    El relicto de laurisilva subtropical fósil mejor conservado de Europa (Patrimonio Mundial UNESCO), un
    bosque humedecido continuamente por la niebla de los vientos alisios.
  en: >-
    The best-preserved relic of subtropical fossil laurisilva in Europe (UNESCO World Heritage), a forest
    continually kept humid by the mist of the trade winds.
  fr: >-
    Le vestige de laurisylve subtropicale fossile le mieux conservé d'Europe (patrimoine mondial de l'UNESCO),
    une forêt constamment baignée par la brume des alizés.
  de: >-
    Das am besten erhaltene Relikt des subtropischen fossilen Lorbeerwaldes in Europa (UNESCO-Welterbe), ein
    Wald, der durch die Passatnebel ständig feucht gehalten wird.
  it: >-
    Il relitto di laurisilva subtropicale fossile meglio conservato d'Europa (Patrimonio Mondiale UNESCO), una
    foresta costantemente umettata dalla nebbia dei venti alisei.
  pt: >-
    O reduto de laurissilva subtropical fóssil mais bem conservado da Europa (Património Mundial da UNESCO),
    uma floresta continuamente humedecida pelo nevoeiro dos ventos alísios.
unico:
  es: >-
    Aquí el mar de nubes mantiene una humedad casi constante, y bajo esa humedad crece el bosque de laurisilva
    más completo del Viejo Mundo.
  en: >-
    Here the sea of clouds maintains almost constant moisture, and beneath that humidity flourishes the most
    complete laurisilva cloud forest in the Old World.
  fr: >-
    Ici, la mer de nuages maintient une humidité presque constante sous laquelle s'épanouit la forêt de
    laurisylve la plus complète de l'Ancien Monde.
  de: >-
    Hier sorgt das Wolkenmeer für nahezu konstante Luftfeuchtigkeit, unter der der vollständigste Lorbeerwald
    der Alten Welt gedeiht.
  it: >-
    Qui il mare di nubi garantisce un'umidità pressoché costante, sotto la quale cresce la foresta di
    laurisilva più completa del Vecchio Mondo.
  pt: >-
    Aqui o mar de nuvens mantém uma humidade quase constante, sob a qual medra a floresta de laurissilva mais
    completa do Velho Mundo.
observaciones:
  es: >-
    No se permite la acampada ni el vivac. No fumes en el bosque ni enciendas fuego, salvo en los fogones de
    las áreas recreativas. El área recreativa de Laguna Grande, la mayor, es un calvero que se cubre de agua
    con lluvias fuertes; también hay áreas en la ermita del Cedro, Las Creces y Chorros de Epina. Desde
    Tenerife se llega a San Sebastián de la Gomera en barco, de 45 minutos a hora y media, y el parque es
    accesible por carretera desde toda la isla.
texto:
  es:
    intro: >-
      Hay un bosque que en el Terciario cubría casi toda Europa y que hoy sobrevive en La Gomera. Es la
      laurisilva, y el Parque Nacional de Garajonay guarda la mejor muestra conocida en el Viejo Mundo. Sube a
      la cumbre de la isla, el Alto de Garajonay, a 1487 m, y verás un terreno a menudo envuelto en niebla, de
      basalto, con roques y fortalezas. El parque ocupa 3984 hectáreas, se extiende por todos los municipios
      de la isla y no tiene ningún núcleo de población dentro.
    landscape: >-
      La laurisilva depende del clima: la variación anual de la temperatura es pequeña, la precipitación es
      abundante y la humedad casi constante, por el mar de nubes. En esas condiciones el monte verde canario
      cubre más del 85 % del parque, con cerca de 50 especies arbóreas.


      Hay dos bosques. En las partes más húmedas manda la laurisilva, con laurel, viñátigo, til, acebiño, palo
      blanco y durillo. Más seco y pobre en especies arbóreas es el fayal-brezal, donde fayas y brezos llegan
      a casi 20 m de altura, posiblemente las mayores tallas de la especie en todo el mundo. Los troncos van
      cubiertos de musgos y líquenes, y los helechos tapizan el suelo: señales de humedad.


      Debajo, el basalto. El parque está sobre coladas y piroclastos, y los roques y fortalezas son pitones
      volcánicos. Desde sus miradores se ven los apilamientos de coladas, los basaltos horizontales, y, en
      días apropiados, cascadas de niebla que se desprenden y se difuminan hacia el sur. En los barrancos de
      laurisilva madura, los árboles de más porte se encuentran junto a los cauces; por el del Cedro baja el
      riachuelo más caudaloso del parque.


      En los roques y paredones crecen plantas raras. Las plantas con flores incluyen en torno a 120
      endemismos canarios, algunos exclusivos del parque, y fenómenos de la evolución insular como el
      gigantismo.
    wildlife: >-
      Hay cerca de 1000 especies de invertebrados y 30 de vertebrados, sobre todo reptiles y aves. Las aves
      emblema son endémicas: la [paloma rabiche](/especie/columba_junoniae/) y la [paloma
      turqué](/especie/columba_bollii/), que representan a la laurisilva. El mirador del Bailadero, en la
      crestería, es un excelente lugar para verlas pasar.


      Los miradores del Rejo son el sitio para observar la vegetación rupícola que coloniza los paredones
      verticales. Y en mayo y junio es frecuente ver volar la mariposa vanesa libando flores. El parque se
      visita todo el año, con el mar de nubes constante que alimenta el bosque de niebla.
    visit: >-
      Empieza por el Centro de Visitantes, en Juego de Bolas, en La Palmita (Agulo), a 3 km del parque. Tiene
      tres salas de exposición y un audiovisual, y sus jardines muestran flora canaria y las plantas que se
      usaban como remedio y condimento; La Casa de la Memoria recoge el interior de la casa campesina, los
      aperos, el paisaje aterrazado, una cueva de enterramiento prehispánico, el silbo y el baile del tambor.
      El punto de información de Laguna Grande tiene un sendero autoguiado y exposiciones, y atiende todo el
      año.


      Los senderos son antiguos caminos por los que el gomero se desplazaba por necesidad, y se pueden
      combinar. Entre los circulares están Laguna Grande, Los Barranquillos, Las Creces, Cañada de Jorge y
      Contadero–Alto Garajonay; entre los lineales, El Bailadero, Ermita de Lourdes, La Meseta de Hermigua
      (las tres cascadas) y Agando–La Laja. El más corto es Ermita de Lourdes: dificultad baja, 40 minutos,
      0,7 km y 43 m de desnivel, con postes numerados para seguir la audioguía, a través de laurisilva madura.


      Descarga la audioguía antes de llegar, porque dentro del parque no hay cobertura. Las rutas guiadas por
      los guías del parque son gratuitas, todos los viernes del año y los miércoles también en verano, y se
      reservan en línea. Los grupos pueden solicitar visitas guiadas y charlas, y en el caserío de El Cedro
      hay un Aula de la Naturaleza.


      El mirador del Alto de Garajonay, en la cumbre más alta, da vistas de las islas cercanas y tiene
      yacimientos arqueológicos adaptados a la visita.
    history: >-
      El parque se declaró nacional el 25 de marzo de 1981, la UNESCO lo hizo Patrimonio Mundial en 1986 y es
      Reserva de la Biosfera desde 2012. Ese año, el 4 de agosto, un incendio entró en el parque tras cinco
      días y quemó casi 750 ha durante dos semanas.
    before: >-
      No se permite la acampada ni el vivac. No fumes en el bosque ni enciendas fuego, salvo en los fogones de
      las áreas recreativas. El área recreativa de Laguna Grande, la mayor, es un calvero que se cubre de agua
      con lluvias fuertes; también hay áreas en la ermita del Cedro, Las Creces y Chorros de Epina. Desde
      Tenerife se llega a San Sebastián de la Gomera en barco, de 45 minutos a hora y media, y el parque es
      accesible por carretera desde toda la isla.
    around: >-
      Lejos de aquí, el [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/), en Tenerife, comparte la
      paloma rabiche y la paloma turqué, las dos palomas de la laurisilva.
  en:
    intro: >-
      There is a forest that covered nearly all of Europe in the Tertiary period and today survives on La
      Gomera. It is the laurisilva, and Garajonay National Park preserves the finest known example in the Old
      World. Climb to the island's highest point, the Alto de Garajonay at 1487 m, and you will see a
      landscape often draped in mist, sculpted from basalt, with volcanic plugs and fortress-like massifs. The
      park encompasses 3984 hectares, reaching into every municipality across the island while containing no
      permanent human settlements within its borders.
    landscape: >-
      The laurisilva depends entirely on climate: annual temperature variation remains minimal, precipitation
      is generous, and humidity stays almost perpetual thanks to the sea of clouds. Under these conditions,
      the Canarian laurel woodland blankets more than 85 % of the park, encompassing nearly 50 tree species.


      There are two forest belts. In the wettest valleys the lush laurisilva dominates, composed of Azores
      laurel, Canary laurel, stinkwood, small-leaved holly, ironwood, and wild viburnum. Drier slopes support
      the heath forest (fayal-brezal), where firetree and tree heather reach up to 20 m in height, arguably
      among the tallest specimens of their kind in the world. Tree trunks are swathed in mosses and lichens,
      and ferns carpet the woodland floor: unmistakable signs of perpetual moisture.


      Beneath it lies ancient basalt. The park rests upon basalt flows and pyroclastic layers, with its
      dramatic roques and fortalezas standing as exposed volcanic necks. From viewpoints you can observe
      stacked lava strata, horizontal columnar basalt, and, on clear days, waterfalls of cloud spilling over
      ridges toward the south. Along mature laurel ravines, the largest trees line stream courses; down the
      Barranco del Cedro flows the park's most abundant permanent brook.


      Rare flora clings to crags and sheer rock walls. Flowering vegetation counts around 120 Canarian
      endemics, several exclusive to the park, showcasing classic island evolutionary phenomena such as
      botanical gigantism.
    wildlife: >-
      The park is home to around 1000 species of invertebrates and 30 vertebrate species, dominated by
      reptiles and birds. The flagship birds are island endemics: the [laurel
      pigeon](/especie/columba_junoniae/) and [Bolle's pigeon](/especie/columba_bollii/), which personify the
      ancient laurisilva. The Bailadero viewpoint along the ridgeline is an ideal vantage point to watch them
      glide between valleys.


      The Rejo viewpoints offer premier perches to observe chasmophytic plants clinging to vertical basalt
      walls. In May and June, painted lady and red admiral butterflies frequently flutter through clearings
      feeding on nectar. The park can be visited year-round, sustained by the constant sea of clouds that
      nourishes the cloud forest.
    visit: >-
      Begin at the Visitor Centre in Juego de Bolas, situated in La Palmita (Agulo), 3 km from the park
      boundary. It features three exhibition rooms, an audiovisual screening area, and landscaped gardens
      highlighting native Canarian flora and traditional medicinal herbs. The adjoining Casa de la Memoria
      displays the interior of a traditional peasant homestead, farming implements, terraced farming heritage,
      a pre-Hispanic burial cave, and exhibits on Gomero whistle language (silbo) and traditional drum dances.
      The information station at Laguna Grande features a self-guided nature trail and displays, operating
      year-round.


      Walking trails follow ancient pathways originally trodden by Gomero islanders out of necessity, easily
      linked for longer circuits. Circular options include Laguna Grande, Los Barranquillos, Las Creces,
      Cañada de Jorge, and Contadero–Alto Garajonay; linear routes include El Bailadero, Ermita de Lourdes, La
      Meseta de Hermigua (the three waterfalls), and Agando–La Laja. The shortest route is Ermita de Lourdes:
      easy difficulty, 40 minutes, 0.7 km, and 43 m of elevation change, equipped with numbered posts keyed to
      the audio guide through mature laurisilva.


      Download the audio guide in advance, as mobile reception within the park is virtually absent. Guided
      walking tours led by park rangers are free every Friday throughout the year and also on Wednesdays in
      summer, bookable online. Organised groups can arrange dedicated ranger talks, and the hamlet of El Cedro
      hosts a specialized Nature Learning Centre.


      The lookout atop Alto de Garajonay, the island's highest summit, provides sweeping panoramas toward
      neighbouring islands and showcases restored pre-Hispanic archaeological sites.
    history: >-
      The area was declared a national park on 25 March 1981, inscribed as a UNESCO World Heritage site in
      1986, and recognized as a Biosphere Reserve in 2012. That same year, on 4 August, a wildfire penetrated
      the park after five days of advancing flames and scorched nearly 750 ha over the course of two weeks.
    before: >-
      Wild camping and bivouacking are strictly prohibited. Do not smoke inside the woodland or light fires,
      except within authorized hearths in recreation areas. The primary picnic area at Laguna Grande occupies
      an open clearing that can collect standing water after intense rainfall; other facilities exist at
      Ermita del Cedro, Las Creces, and Chorros de Epina. From Tenerife, ferries reach San Sebastián de La
      Gomera in 45 minutes to an hour and a half, with the park conveniently accessible by road from all
      across the island.
    around: >-
      Far across the waters, [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/) on Tenerife also shelters
      the laurel pigeon and Bolle's pigeon, the two quintessential pigeons of the Macaronesian laurisilva.
  fr:
    intro: >-
      Il existe une forêt qui recouvrait presque toute l'Europe à l'ère tertiaire et qui subsiste aujourd'hui
      à La Gomera. C'est la laurisylve, et le parc national de Garajonay en préserve le témoin le plus complet
      de l'Ancien Monde. Montez au point culminant de l'île, l'Alto de Garajonay à 1487 m, et vous découvrirez
      un paysage souvent enveloppé de brume, taillé dans le basalte, parsemé de pitons rocheux et de
      forteresses naturelles. Le parc s'étend sur 3984 hectares, touche toutes les communes de l'île et
      n'abrite aucune localité permanente dans son périmètre.
    landscape: >-
      La laurisylve dépend étroitement du climat : la variation annuelle des températures reste faible, les
      précipitations sont généreuses et l'humidité presque constante grâce à la mer de nuages. Dans ces
      conditions, la forêt humide canarienne recouvre plus de 85 % du parc avec près de 50 espèces arborées.


      Il existe deux types de massifs forestiers. Dans les fonds de vallées les plus humides règne la
      laurisylve, peuplée de lauriers, viñátigos, tils, houx des Canaries, palos blancos et lauriers-tins.
      Plus sec et moins diversifié en grands arbres, le fayal-brezal voit les bruyères arborescentes et les
      fayas atteindre près de 20 m de hauteur, sans doute parmi les plus hautes tailles de l'espèce au monde.
      Les troncs se couvrent de mousses et de lichens, tandis que les fougères tapissent le sous-bois : autant
      d'indices d'une humidité permanente.


      En dessous se dresse le basalte. Le parc repose sur d'anciennes coulées et des dépôts pyroclastiques,
      tandis que les roques et fortalezas constituent d'anciens culots volcaniques déchaussés par l'érosion.
      Depuis les belvédères, on contemple les empilements de lave, les prismes de basalte et, par temps
      propice, des cascades de brume dévalant vers le sud. Au creux des ravins de laurisylve mature, les
      arbres les plus imposants bordent les ruisseaux ; par celui du Cedro s'écoule le cours d'eau le plus
      abondant du parc.


      Sur les falaises et parois abruptes poussent des espèces végétales exceptionnelles. La flore à fleurs
      compte environ 120 endémismes canariens, dont plusieurs exclusifs au parc, illustrant des adaptations
      remarquables de l'évolution insulaire comme le gigantisme végétal.
    wildlife: >-
      Le parc compte près de 1000 espèces d'invertébrés et 30 vertébrés, principalement des reptiles et des
      oiseaux. Les espèces emblématiques sont endémiques : le [pigeon des
      lauriers](/especie/columba_junoniae/) et le [pigeon de Bolle](/especie/columba_bollii/), symboles
      vivants de la laurisylve. Le belvédère du Bailadero, sur la crête centrale, constitue un poste
      remarquable pour les voir voler d'un vallon à l'autre.


      Les points de vue du Rejo permettent d'observer la végétation rupicole accrochée aux parois verticales.
      En mai et juin, les vanesses papillons butinent couramment les fleurs en lisière. Le parc se visite
      agréablement tout au long de l'année, grâce à la mer de nuages permanente qui régule la fraîcheur du
      sous-bois.
    visit: >-
      Commencez par le centre d'accueil de Juego de Bolas, situé à La Palmita (Agulo), à 3 km du parc. Il
      dispose de trois salles d'exposition et d'un espace audiovisuel, et ses jardins présentent la flore
      canarienne ainsi que les plantes aromatiques et médicinales traditionnelles. La Casa de la Memoria
      reconstitue l'habitat rural gomero traditionnel, les outils agricoles, les cultures en terrasses, une
      grotte funéraire préhispanique et les traditions du silbo et de la danse du tambour. Le point
      d'information de Laguna Grande propose un sentier d'interprétation autoguidé et des panneaux
      didactiques, ouvert en toute saison.


      Les chemins de randonnée empruntent d'anciens sentiers autrefois parcourus par les habitants de l'île
      pour leurs déplacements essentiels, faciles à combiner. Parmi les boucles figurent Laguna Grande, Los
      Barranquillos, Las Creces, Cañada de Jorge et Contadero–Alto Garajonay ; parmi les tracés linéaires, El
      Bailadero, Ermita de Lourdes, La Meseta de Hermigua (les trois cascades) et Agando–La Laja. Le plus
      accessible est Ermita de Lourdes : difficulté faible, 40 minutes, 0,7 km et 43 m de dénivelé, jalonné de
      bornes numérotées pour suivre l'audioguide à travers la laurisylve ancienne.


      Téléchargez l'audioguide avant votre arrivée, car le réseau mobile est inexistant au cœur du parc. Les
      excursions accompagnées par les guides du parc sont gratuites, chaque vendredi de l'année et les
      mercredis en été, sur réservation préalable en ligne. Les groupes peuvent solliciter des présentations
      thématiques, et le hameau d'El Cedro abrite une maison de la nature.


      Le mirador de l'Alto de Garajonay, sur le sommet de l'île, dévoile des panoramas sur les îles voisines
      et conserve des sites archéologiques préhispaniques aménagés pour la visite.
    history: >-
      Le site a été déclaré parc national le 25 mars 1981, inscrit au patrimoine mondial par l'UNESCO en 1986
      et reconnu réserve de biosphère en 2012. Cette même année, le 4 août, un feu de forêt a pénétré dans le
      parc après cinq jours d'incendie et a calciné près de 750 ha durant deux semaines.
    before: >-
      Le camping sauvage et le bivouac sont strictement interdits. Ne fumez pas en forêt et n'allumez aucun
      feu, sauf dans les foyers aménagés des aires récréatives. L'aire principale de Laguna Grande est une
      vaste clairière susceptible d'être inondée lors de fortes pluies ; d'autres haltes sont installées à
      l'ermitage du Cedro, à Las Creces et à Chorros de Epina. Depuis Tenerife, on rejoint San Sebastián de La
      Gomera en ferry en 45 minutes à une heure et demie de traversée, et le parc est facilement accessible
      par la route depuis toute l'île.
    around: >-
      Plus loin, le [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/), à Tenerife, accueille également le
      pigeon des lauriers et le pigeon de Bolle, les deux pigeons emblématiques de la laurisylve.
  de:
    intro: >-
      Es gibt einen Wald, der im Tertiär beinahe ganz Europa bedeckte und heute auf La Gomera fortbesteht. Es
      ist die Laurisilva, und der Nationalpark Garajonay bewahrt das besterhaltene Beispiel der Alten Welt.
      Steige auf den Inselgipfel, den Alto de Garajonay auf 1487 m Höhe, und du blickst über ein oft
      nebelverhangenes Basaltmassiv mit Vulkanschloten und Felsburgen. Der Park umfasst 3984 Hektar, erstreckt
      sich über alle Gemeinden der Insel und weist keine dauerhaften Siedlungen in seinem Inneren auf.
    landscape: >-
      Die Laurisilva ist eng an das Lokalklima gebunden: Die Jahresschwankungen der Temperatur sind gering,
      die Niederschläge ergiebig und die Luftfeuchtigkeit dank des Wolkenmeers beinahe dauerhaft hoch. Unter
      diesen Voraussetzungen bedeckt der kanarische Lorbeerwald über 85 % des Parks mit rund 50 Baumarten.


      Man unterscheidet zwei Waldgesellschaften. In den feuchtesten Tälern herrscht der eigentliche
      Lorbeerwald vor, gebildet aus Azoren-Lorbeer, Barbusano, Til-Baum, Kanaren-Stechpalme, Picconia und
      Viburnum. Trockener und artenärmer an Großbäumen ist der Fayal-Brezal-Buschwald, in dem Gagelbäume und
      Baumheide Wuchshöhen von fast 20 m erreichen – wahrscheinlich die stattlichsten Exemplare weltweit.
      Moospolster und Flechten umhüllen die Stämme, während Farne den Boden bedecken: untrügliche Zeichen
      ständiger Feuchte.


      Darunter lagert das Basaltgestein. Der Park ruht auf Lavadecken und Pyroklastika; die monumentalen
      Roques und Fortalezas sind erodierte Vulkanschlote. Von den Aussichtsplattformen blickt man auf
      geschichtete Lavaströme, Basaltsäulen und an günstigen Tagen auf Nebelkaskaden, die über die Kämme nach
      Süden abgleiten. In den tiefen Schluchten mit altem Lorbeerwald wachsen die mächtigsten Bäume entlang
      der Flussläufe; durch den Barranco del Cedro fließt der wasserreichste Bach des Parks.


      An den Klippen und Steilwänden gedeihen seltene Pflanzen. Die Blütenflora umfasst etwa 120 kanarische
      Endemiten, von denen einige ausschließlich im Park vorkommen und evolutionsbiologische Phänomene wie den
      Insel-Gigantismus zeigen.
    wildlife: >-
      Im Park leben rund 1000 Wirbellosen- und 30 Wirbeltierarten, vor allem Reptilien und Vögel. Die
      Leitarten sind inselendemisch: die [Lorbeertaube](/especie/columba_junoniae/) und [Bolles
      Lorbeertaube](/especie/columba_bollii/), Sinnbilder des intakten Nebelwaldes. Der Aussichtspunkt El
      Bailadero auf dem Hauptkamm ist ein hervorragender Platz, um die Tauben über den Kronen kreuzen zu
      sehen.


      Die Aussichtspunkte von El Rejo eignen sich bestens, um die Felsvegetation an den senkrechten
      Basaltwänden zu studieren. Im Mai und Juni fliegen Admirale und Distelfalter emsig durch die Lichtungen.
      Das Schutzgebiet lässt sich zu jeder Jahreszeit bereisen, getragen vom stetigen Wolkenmeer, das den
      Nebelwald mit Feuchtigkeit versorgt.
    visit: >-
      Beginne am Besucherzentrum Juego de Bolas in La Palmita (Agulo), 3 km vom Parkrand entfernt. Es verfügt
      über drei Ausstellungsräume, einen Filmsaal und botanische Gärten zur kanarischen Pflanzenwelt sowie zu
      Heil- und Gewürzkräutern. Die Casa de la Memoria veranschaulicht das traditionelle bäuerliche Leben auf
      La Gomera, landwirtschaftliche Geräte, Terrassenfeldbau, eine prähispanische Grabstätte sowie die
      Pfeifsprache Silbo und den Trommeltanz. Die Station Laguna Grande bietet einen selbsterklärenden
      Naturlehrpfad und ganzjährige Auskünfte.


      Die Wanderwege folgen historischen Pfaden, die einst von der Inselbevölkerung im Alltag angelegt wurden,
      und lassen sich flexibel verbinden. Zu den Rundwegen gehören Laguna Grande, Los Barranquillos, Las
      Creces, Cañada de Jorge und Contadero–Alto Garajonay; Streckenwanderungen umfassen El Bailadero, Ermita
      de Lourdes, La Meseta de Hermigua (die drei Wasserfälle) und Agando–La Laja. Der kürzeste Wanderweg
      führt zur Ermita de Lourdes: geringe Schwierigkeit, 40 Minuten, 0,7 km und 43 Höhenmeter, mit
      nummerierten Pflöcken für den Audioguide durch dichten, alten Lorbeerwald.


      Lade den Audioguide vorab herunter, da im Park kaum Mobilfunkempfang besteht. Die von Parkrangern
      geführten Exkursionen sind kostenlos, finden ganzjährig freitags sowie im Sommer zusätzlich mittwochs
      statt und erfordern eine Online-Anmeldung. Gruppen können geführte Fachvorträge buchen, und im Weiler El
      Cedro befindet sich ein Naturkundezentrum.


      Der Aussichtspunkt auf dem Alto de Garajonay, dem höchsten Gipfel, bietet weite Ausblicke auf die
      Nachbarinseln und birgt rekonstruierte prähispanische Kultstätten.
    history: >-
      Das Gebiet wurde am 25. März 1981 zum Nationalpark erklärt, 1986 von der UNESCO als Welterbe anerkannt
      und 2012 zum Biosphärenreservat ernannt. Im selben Jahr, am 4. August, griff nach fünf Tagen Branddauer
      ein verheerendes Feuer auf den Park über und vernichtete im Verlauf von zwei Wochen knapp 750 ha
      Waldfläche.
    before: >-
      Freies Zelten und Biwakieren sind streng verboten. Rauche keinesfalls im Wald und entzünde kein Feuer
      außerhalb der gemauerten Feuerstellen der Rastplätze. Das Erholungsgebiet Laguna Grande, die größte
      Raststätte, liegt auf einer Lichtung, die sich bei Starkregen rasch mit Wasser füllt; weitere Rastplätze
      gibt es an der Ermita del Cedro, Las Creces und Chorros de Epina. Von Teneriffa aus verkehren Fähren
      nach San Sebastián de La Gomera in 45 Minuten bis anderthalb Stunden, und der Park ist über das
      Straßennetz von allen Inselteilen aus gut erreichbar.
    around: >-
      Weiter entfernt auf Teneriffa teilt der [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/) das
      Vorkommen von Lorbeertaube und Bolles Lorbeertaube, den beiden charakteristischen Taubenarten des
      makaronesischen Nebelwaldes.
  it:
    intro: >-
      C'è una foresta che nel Terziario ricopriva quasi tutta l'Europa e che oggi sopravvive a La Gomera. È la
      laurisilva, e il Parco Nazionale di Garajonay ne custodisce il miglior esempio noto nel Vecchio Mondo.
      Sali sulla cima dell'isola, l'Alto de Garajonay a 1487 m, e vedrai un paesaggio spesso avvolto dalla
      nebbia, scolpito nel basalto, con picchi vulcanici e fortezze naturali. Il parco copre 3984 ettari,
      tocca tutti i comuni dell'isola e non include alcun insediamento abitato stabile al proprio interno.
    landscape: >-
      La laurisilva dipende strettamente dal clima: le escursioni termiche annuali sono minime, le
      precipitazioni abbondanti e l'umidità pressoché costante per via del mare di nubi. In queste condizioni
      ambientali il bosco umido canario ammanta oltre l'85 % del parco, annoverando circa 50 specie arboree.


      Vi sono due boschi distinti. Nelle valli più umide domina la laurisilva matura, con alloro delle
      Canarie, viñátigo, tilo, agrifoglio canario, palo blanco e viburno tino. Più arido e povero di grandi
      alberi è il fayal-brezal, dove faya ed erica arborea raggiungono quasi 20 m di altezza, toccando forse
      le dimensioni maggiori al mondo per queste essenze. I tronchi appaiono rivestiti da muschi e licheni,
      mentre le felci tappezzano il sottobosco: segni tangibili di umidità perenne.


      Sotto giace il basalto. Il parco sorge su antiche colate laviche e depositi piroclastici, con roques e
      fortezze che rappresentano antichi condotti vulcanici messi a nudo dall'erosione. Dalle terrazze
      panoramiche si ammirano le bancate di basalto, i blocchi orizzontali e, nelle giornate adatte,
      suggestive cascate di nebbia che scivolano verso sud. Nelle gole di laurisilva matura gli alberi più
      imponenti costeggiano i torrenti; lungo il Barranco del Cedro scorre il ruscello più copioso del parco.


      Sulle pareti verticali allignano piante rare. La flora vascolare comprende circa 120 endemismi canari,
      alcuni dei quali esclusivi del parco, con evidenti fenomeni evolutivi insulari quali il gigantismo
      vegetale.
    wildlife: >-
      Nel parco vivono circa 1000 specie di invertebrati e 30 di vertebrati, soprattutto rettili e uccelli. Le
      specie simbolo sono alate ed endemiche: la [colomba dei lauri](/especie/columba_junoniae/) e la [colomba
      di Bolle](/especie/columba_bollii/), ambasciatrici della laurisilva. Il belvedere del Bailadero, lungo
      la dorsale, rappresenta un luogo d'elezione per ammirarle in volo.


      I belvederi del Rejo sono ideali per esaminare la flora rupicola che colonizza le pareti basaltiche. In
      maggio e giugno si osservano con frequenza farfalle vanessa intente a bottinare sui fiori. Il parco è
      visitabile in ogni periodo dell'anno, favorito dal mare di nubi che mantiene fresca e vitale la foresta
      di nebbia.
    visit: >-
      Inizia dal Centro Visitatori di Juego de Bolas, a La Palmita (Agulo), a 3 km dal parco. La struttura
      conta tre sale espositive e uno spazio audiovisivo, con giardini didattici dedicati alla flora canaria e
      alle piante officinali tradizionali. La Casa de la Memoria documenta gli interni della casa rurale
      tradizionale, gli attrezzi agricoli, il paesaggio a terrazze, una grotta sepolcrale preispanica, il
      fischio silbo e il ballo del tamburo. Il punto informativo di Laguna Grande vanta un percorso
      autoguidato e mostre didattiche, operativo tutto l'anno.


      I sentieri ricalcano le antiche vie di comunicazione impiegate in passato dai gomeros per gli
      spostamenti quotidiani e si prestano a diverse combinazioni. Tra gli itinerari circolari figurano Laguna
      Grande, Los Barranquillos, Las Creces, Cañada de Jorge e Contadero–Alto Garajonay; tra quelli lineari,
      El Bailadero, Ermita de Lourdes, La Meseta de Hermigua (le tre cascate) e Agando–La Laja. Il più breve è
      Ermita de Lourdes: difficoltà bassa, 40 minuti, 0,7 km e 43 m di dislivello, dotato di paline numerate
      per seguire l'audioguida nel fitto della laurisilva.


      Scarica l'audioguida prima di arrivare sul posto, poiché all'interno del parco manca la copertura
      cellulare. Le escursioni guidate dal personale del parco sono gratuite, disponibili ogni venerdì
      dell'anno e di mercoledì anche d'estate, con prenotazione obbligatoria online. I gruppi organizzati
      possono richiedere incontri formativi, e presso la frazione di El Cedro sorge un'Aula della Natura.


      Il belvedere sulla vetta dell'Alto de Garajonay regala ampie vedute panoramiche sulle isole vicine e
      accoglie siti archeologici preispanici allestiti per la visita.
    history: >-
      Il territorio fu dichiarato parco nazionale il 25 marzo 1981, iscritto tra i patrimoni mondiali UNESCO
      nel 1986 ed è riserva della biosfera dal 2012. In quello stesso anno, il 4 agosto, un violento incendio
      boschivo penetrò nel parco dopo cinque giorni di avanzata, bruciando quasi 750 ha nell'arco di due
      settimane.
    before: >-
      Il campeggio libero e il bivacco non sono consentiti. Non fumare nei boschi né accendere fuochi, salvo
      nei punti cottura predisposti delle aree ricreative. L'area di sosta di Laguna Grande, la principale, è
      una radura aperta che può allagarsi in caso di acquazzoni torrenziali; altre aree attrezzate si trovano
      presso l'eremo del Cedro, Las Creces e Chorros de Epina. Da Tenerife si raggiunge San Sebastián de La
      Gomera via traghetto in 45 minuti o un'ora e mezza, e il parco è facilmente accessibile in auto da
      qualsiasi località isolana.
    around: >-
      Più distante, il [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/), a Tenerife, condivide la tutela
      della colomba dei lauri e della colomba di Bolle, le due colombe caratteristiche della laurisilva.
  pt:
    intro: >-
      Existe uma floresta que no Terciário cobria quase toda a Europa e que hoje sobrevive em La Gomera. É a
      laurissilva, e o Parque Nacional de Garajonay resguarda o melhor exemplar conhecido no Velho Mundo. Sobe
      ao cume da ilha, o Alto de Garajonay a 1487 m, e verás um relevo frequentemente envolto em nevoeiro,
      esculpido em basalto, com roques e fortalezas vulcânicas. O parque ocupa 3984 hectares, distribui-se por
      todos os municípios da ilha e não alberga povoações no seu interior.
    landscape: >-
      A laurissilva depende intimamente do clima: a oscilação térmica anual é reduzida, a precipitação
      abundante e a humidade quase constante devido ao mar de nuvens. Nestas condições o monte verde canário
      recobre mais de 85 % do parque, com cerca de 50 espécies arbóreas.


      Distinguem-se duas matas. Nas vertentes mais húmidas impera a laurissilva rica, com
      loureiro-das-canárias, vinhático, til, azevinho-canário, pau-branco e folhado. Mais seco e escasso em
      diversidade arbórea é o faial-urzal, onde faias-das-ilhas e urzes atingem quase 20 m de altura,
      constituindo porventura as maiores estaturas da espécie a nível mundial. Os troncos surgem atapetados de
      musgos e líquenes, e os fetos cobrem o solo: sinais expressivos de humidade.


      Por baixo assenta o basalto. O parque assenta em escoadas lávicas e depósitos piroclásticos,
      constituindo os roques e fortalezas antigas chaminés vulcânicas desnudadas pela erosão. Dos miradouros
      avistam-se acumulações de escoadas, prismas basálticos horizontais e, em dias propícios, autênticas
      cascatas de nevoeiro que deslizam em direção ao sul. Nas ravinas de laurissilva vetusta, os exemplares
      mais corpulentos alinham-se junto aos leitos; pela ravina do Cedro desce o ribeiro mais caudaloso do
      território.


      Nas escarpas e fragas brotam plantas singulares. A flora com flor abrange cerca de 120 endemismos
      canários, alguns exclusivos deste parque, ilustrando processos notáveis de evolução insular como o
      gigantismo vegetal.
    wildlife: >-
      O parque alberga perto de 1000 espécies de invertebrados e 30 vertebrados, maioritariamente répteis e
      aves. As aves emblemáticas são espécies endémicas: o [pombo-rabil](/especie/columba_junoniae/) e o
      [pombo-turqueza](/especie/columba_bollii/), fiéis representantes da laurissilva. O miradouro de El
      Bailadero, na crista da montanha, constitui um posto excelente para os observar em voo.


      Os miradouros de El Rejo são o local indicado para apreciar a flora rupícola que coloniza as paredes
      verticais. Em maio e junho é habitual avistar borboletas vanessa a sugar o néctar das flores. O parque
      pode ser percorrido durante todo o ano, mercê do mar de nuvens persistente que preserva a frescura da
      floresta.
    visit: >-
      Começa pelo Centro de Visitantes em Juego de Bolas, na localidade de La Palmita (Agulo), a 3 km do
      limite do parque. Possui três salas de exposição e uma sala audiovisual, dispondo de jardins botânicos
      com flora canária e plantas medicinais e aromáticas de uso tradicional. A Casa de la Memoria reconstitui
      o interior da habitação rural, alfaias agrícolas, socalcos tradicionais, uma gruta funerária
      pré-hispânica e manifestações culturais como o assobio silbo e a dança do tambor. O posto de acolhimento
      de Laguna Grande dispõe de percurso autoguiado e painéis interpretativos, atendendo o público o ano
      inteiro.


      Os trilhos seguem caminhos rurais históricos usados antigamente pelas gentes locais e podem ser
      combinados entre si. Entre os percursos circulares salientam-se Laguna Grande, Los Barranquillos, Las
      Creces, Cañada de Jorge e Contadero–Alto Garajonay; entre os lineares, El Bailadero, Ermita de Lourdes,
      La Meseta de Hermigua (as três cascatas) e Agando–La Laja. O percurso mais acessível é a Ermita de
      Lourdes: baixa dificuldade, 40 minutos, 0,7 km e 43 m de desnível, munido de postes numerados para
      acompanhar o audioguia no interior da laurissilva densa.


      Descarrega o audioguia antes de iniciares a visita, pois a cobertura de rede móvel é quase inexistente
      no interior do parque. As caminhadas guiadas pelos monitores são gratuitas, realizadas todas as
      sextas-feiras do ano e também às quartas-feiras no verão, carecendo de reserva antecipada online. Grupos
      organizados podem solicitar palestras educativas, existindo no lugar de El Cedro uma Aula da Natureza.


      O miradouro do Alto de Garajonay, no cume mais alto da ilha, descortina vistas amplas sobre as ilhas
      vizinhas e preserva sítios arqueológicos pré-hispânicos adaptados à visitação.
    history: >-
      A área foi classificada como parque nacional a 25 de março de 1981, inscrita como Património Mundial
      pela UNESCO em 1986 e declarada Reserva da Biosfera em 2012. Nesse mesmo ano, a 4 de agosto, um incêndio
      florestal atingiu o parque após cinco dias de chamas, consumindo quase 750 ha ao longo de duas semanas.
    before: >-
      O campismo selvagem e o bivaque são expressamente proibidos. Não fumes na floresta nem acendas
      fogueiras, exceto nos grelhadores instalados nas zonas recreativas. A área de lazer de Laguna Grande, a
      mais extensa, ocupa uma clareira suscetível de alagamento com chuvas copiosas; encontram-se outras zonas
      estruturadas na ermida do Cedro, em Las Creces e em Chorros de Epina. A partir de Tenerife chega-se a
      San Sebastián de La Gomera por via marítima em 45 minutos a hora e meia, sendo o parque facilmente
      acessível por estrada a partir de qualquer ponto da ilha.
    around: >-
      Distante deste arquipélago, o [Parque Rural de Anaga](/lugar/parque-rural-de-anaga/), em Tenerife,
      partilha o pombo-rabil e o pombo-turqueza, os dois pombos característicos da laurissilva macaronésica.
