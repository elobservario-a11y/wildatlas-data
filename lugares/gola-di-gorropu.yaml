resumen:
  es: >-
    El 'Gran Cañón de Cerdeña' y uno de los más profundos de Europa, con paredes de caliza de más de 500 m de
    desplome vertical continuo.
  en: >-
    The ‘Grand Canyon of Sardinia’ and one of Europe’s deepest defiles, with continuous limestone walls
    plunging over 500 m vertically.
  fr: >-
    Le « Grand Canyon de Sardaigne » et l’un des plus profonds d’Europe, avec des parois calcaires plongeant à
    pic sur plus de 500 m.
  de: >-
    Der „Grand Canyon Sardiniens“ und eine der tiefsten Schluchten Europas mit senkrechten Kalkwänden von über
    500 m Fallhöhe.
  it: >-
    Il ‘Grand Canyon della Sardegna’ e uno dei più profondi d’Europa, con pareti calcaree di oltre 500 m di
    dislivello a picco.
  pt: >-
    O ‘Grand Canyon da Sardenha’ e um dos mais fundos da Europa, com muralhas calcárias em queda vertical de
    mais de 500 m.
unico:
  es: >-
    Ninguna carretera, presa, teleférico ni puente cruza o bordea el cañón: por eso conserva un aspecto virgen
    y salvaje.
  en: >-
    Not a single road, dam, cableway, or bridge crosses or skirts the gorge, preserving an utterly primeval
    and untamed wilderness.
  fr: >-
    Aucune route, barrage, téléphérique ni pont ne franchit ni ne longe le canyon, lui conservant un aspect
    totalement vierge et sauvage.
  de: >-
    Weder Straße, Damm, Seilbahn noch Brücke queren oder säumen die Schlucht, weshalb sie ihren absolut
    unberührten, wilden Charakter bewahrt.
  it: >-
    Nessuna strada, diga, funivia o ponte attraversa né costeggia il canyon, preservandone l’aspetto
    primordiale e selvaggio.
  pt: >-
    Nenhuma estrada, barragem, teleférico ou ponte atravessa ou margeia o desfiladeiro, preservando uma feição
    totalmente virgem e bravia.
observaciones:
  es: >-
    Para los senderos que llevan al cañón se necesitan guías expertos y equipo adecuado: es el territorio más
    salvaje de la isla.
texto:
  es:
    intro: >-
      Gorropu significa, en sardo, despeñadero, o lugar excavado, y no hay nombre más honesto. Es una garganta
      de origen erosivo de un kilómetro y medio de largo que marca el límite entre Orgosolo y Urzulei, en
      pleno Supramonte. Las paredes pasan de los quinientos metros de altura y en los puntos más angostos el
      cañón mide apenas cuatro metros de ancho. Lo cavó el río Flumineddu, que sigue corriendo por el fondo,
      alimentado por aguas que cruzan el Supramonte.
    landscape: >-
      La historia de Gorropu empieza con una falla. La garganta nació cuando se abrió una fractura y el
      Flumineddu empezó a trabajar en ella; con el tiempo, el torrente ha erosionado la caliza hasta formar el
      cañón. Las paredes guardan fósiles que revelan un origen submarino, de hace entre ciento noventa y
      sesenta millones de años: lo que hoy es muralla de piedra fue antes fondo de mar.


      El cañón tiene zonas poco o nada expuestas al sol, de modo que los saltos de temperatura son fuertes.
      Ese clima de sombra genera un hábitat que acoge varios endemismos sardos. Aguas arriba, antes de la
      entrada, el Flumineddu brota de las rocas y forma pozas naturales en las que viven la trucha sarda y,
      sobre todo, el euprotto, el tritón sardo.
    wildlife: >-
      Gorropu es refugio de endemismos. La aquilegia nuragica es una especie herbácea endémica que la fuente
      considera única en el mundo, y el tritón sardo vive en los charcos del Flumineddu. Entre las plantas de
      matorral mediterráneo hay labiérnagos y, por los senderos, enebros y tejos milenarios.


      La fauna es la del Supramonte: la culebra de collar, la marta y el [águila
      real](/especie/aquila_chrysaetos/), que anida en la garganta, y colonias numerosas de
      [muflones](/especie/ovis_gmelini/), liebres sardas, zorros, erizos y jabalíes. El bosque de encinas,
      helechos y madroños acompaña el camino de acceso desde el paso de Genna Silana.
    visit: >-
      Hay varias formas de llegar, y cada una elige su ritmo.


      Desde el paso de Genna Silana, el acceso más inmediato desde el este, un sendero señalizado de unos
      cuatro kilómetros baja en una hora a la entrada del cañón, atravesando un bosque de encinas, helechos y
      madroños. Es panorámico, pero el desnivel es grande: el regreso supone subir unos seiscientos cincuenta
      metros, y se tarda el doble.


      Desde el sur, el sendero para expertos que sale de Sedda ar Baccas mide doce kilómetros, salva
      doscientos metros de desnivel y se hace en cinco horas entre ida y vuelta. Pasa por Pischina Urthaddala,
      un pequeño lago formado por el Flumineddu, y por la cascada de sa Giuntura, que marca la entrada a la
      garganta.


      Desde el norte se sale de Dorgali, se cruza en coche el valle hasta el puente de s'Abba Arva y se sigue
      a pie dos horas junto al río y el monte Oddeu, entre bloques calizos blancos y pulidos: unos siete
      kilómetros casi llanos. Se ofrece también una excursión guiada nocturna, del atardecer al amanecer.
    history: >-
      Los nuragicos conocieron bien este lugar. Los muchos nuraghi que hay indican que la civilización
      nurágica lo habitó y lo aprovechó desde la Edad del Bronce. El nuraghe Presetu Tortu está dominado por
      el Mereu, un coloso de caliza blanca sobre el verde del bosque, y el nuraghe Gorropu vigila la entrada.
      La inaccesibilidad de la garganta generó además leyendas sobre monstruos que vivían en sus cuevas.
    before: >-
      Para los senderos que llevan al cañón se necesitan guías expertos y equipo adecuado: es el territorio
      más salvaje de la isla.
    around: >-
      La garganta está dentro del [Macizo Kárstico del Supramonte
      (Cerdeña)](/lugar/macizzo-karstico-del-supramonte/), el gran complejo calcáreo que la rodea.
  en:
    intro: >-
      In the Sardinian language, Gorropu signifies an abyss or a hollowed place, and no name could be more
      truthful. It is an erosional gorge one and a half kilometres long marking the boundary between Orgosolo
      and Urzulei in the heart of Supramonte. Its limestone cliffs exceed five hundred metres in height, while
      at its narrowest pinch points the chasm contracts to scarcely four metres wide. It was carved by the
      Flumineddu torrent, which continues to stream through the boulder-choked floor fed by waters draining
      the high Supramonte karst.
    landscape: >-
      The genesis of Gorropu began with a tectonic fault line. The gorge opened along an ancient fracture that
      the Flumineddu began excavating; over vast expanses of geological time, running water scoured the
      limestone into a monumental canyon. The towering walls contain marine fossils dating between one hundred
      and ninety and sixty million years ago: what stands today as a colossal barrier was once submerged
      seabed.


      The deepest hollows receive little or no direct sunlight, resulting in extreme thermal contrasts. This
      cool, shaded microclimate nurtures an isolated habitat harbouring several Sardinian endemics. Upstream,
      just before the gorge portal, the Flumineddu wells from submerged fissures to create clear natural pools
      inhabited by native Sardinian trout and the rare Sardinian brook salamander (euprotto).
    wildlife: >-
      Gorropu forms an evolutionary sanctuary for rare endemic taxa. The Nuragica columbine (*Aquilegia
      nuragica*) is an herbaceous perennial considered entirely unique to these vertical crevices, while the
      endemic Sardinian brook salamander dwells in the gravel pools of the Flumineddu. Mediterranean scrub
      includes mock privet, with millennial junipers and twisted yews clinging to the cliffs.


      The fauna is quintessential Supramonte: grass snakes, pine martens, and [golden
      eagles](/especie/aquila_chrysaetos/) nesting directly on the crags, alongside herds of
      [mouflon](/especie/ovis_gmelini/), Sardinian hares, foxes, hedgehogs, and wild boars. Dense woods of
      holm oak, tree heather, and strawberry trees frame the descent from the Genna Silana pass.
    visit: >-
      Multiple hiking routes access the gorge, each offering its own character and pace.


      From the Genna Silana pass, the most direct approach from the east, a waymarked mountain trail of four
      kilometres descends in about one hour to the canyon entrance through shady holm oak and strawberry tree
      woods. The views are panoramic, but the return climb requires ascending roughly six hundred and fifty
      vertical metres, typically taking twice as long.


      From the south, a challenging trekking route for experienced hikers sets out from Sedda ar Baccas:
      twelve kilometres return with two hundred metres of elevation gain, taking roughly five hours. It passes
      the natural pool of Pischina Urthaddala and the sa Giuntura waterfall marking the upper portal of the
      gorge.


      From the north, departures leave Dorgali, driving across the valley to the s’Abba Arva bridge,
      continuing on foot for two hours along the riverbank past Monte Oddeu over polished white limestone
      boulders: roughly seven kilometres on nearly level terrain. Guided sunset-to-sunrise night excursions
      are also organized locally.
    history: >-
      The Nuragic civilization knew this gorge intimately. Numerous prehistoric nuraghes dot the surrounding
      rims, proving continuous settlement and exploitation since the Bronze Age. The Presetu Tortu nuraghe
      stands dominated by the Mereu crag, a colossus of white limestone rising above the green forest canopy,
      while the Gorropu nuraghe guards the eastern portal. The sheer inaccessibility of the abyss also birthed
      enduring Sardinian legends of cave-dwelling monsters.
    before: >-
      Trails accessing the gorge require experienced guidance and sturdy footwear: this represents the wilder,
      rougher heart of Sardinia.
    around: >-
      The gorge is entirely embraced by the [Supramonte Karst Massif
      (Sardinia)](/lugar/macizzo-karstico-del-supramonte/), the great limestone tableland that encloses it.
  fr:
    intro: >-
      En sarde, Gorropu signifie précipice ou lieu creusé, et nul toponyme n’est plus fidèle à la réalité.
      C’est une gorge d’érosion d’un kilomètre et demi de long délimitant les communes d’Orgosolo et d’Urzulei
      au cœur du Supramonte. Ses falaises dépassent les cinq cents mètres de hauteur et, dans ses passages les
      plus étroits, le canyon mesure à peine quatre mètres de large. Il a été taillé par le torrent Flumineddu
      qui coule au fond de la faille, alimenté par les eaux souterraines du karst.
    landscape: >-
      L’histoire de Gorropu trouve son origine dans une faille géologique. La gorge est née d’une fracture que
      le Flumineddu s’est mis à creuser ; au fil des millénaires, le torrent a érodé le calcaire pour façonner
      ce défilé spectaculaire. Les parois conservent des fossiles marins vieux de cent quatre-vingt-dix à
      soixante millions d’années : ce rempart de pierre fut autrefois un fond océanique.


      Le fond du canyon compte des secteurs presque privés d’ensoleillement direct, provoquant de brusques
      variations thermiques. Cette fraîcheur perpétuelle crée un biotope accueillant plusieurs espèces
      endémiques sardes. En amont, avant l’entrée du défilé, le Flumineddu jaillit des roches en vasques
      limpides où vivent la truite sarde et l’euprocte de Sardaigne, un triton endémique.
    wildlife: >-
      Gorropu forme un refuge exceptionnel d’endémismes. L’ancolie de Nurra (*Aquilegia nuragica*) est une
      espèce herbacée considérée comme unique au monde dans ces fentes rocheuses, et l’euprocte sarde peuple
      les cuvettes du Flumineddu. Le maquis méditerranéen compte des filaires, tandis que des genévriers et
      des ifs millénaires s’accrochent aux corniches.


      La faune sauvage est celle du grand Supramonte : couleuvre à collier, martre et [aigle
      royal](/especie/aquila_chrysaetos/) nichant sur les falaises, accompagnés de hardes de
      [mouflons](/especie/ovis_gmelini/), lièvres sardes, renards, hérissons et sangliers. Les boisements de
      chênes verts, fougères et arbousiers escortent le sentier descendant du col de Genna Silana.
    visit: >-
      Plusieurs itinéraires mènent à la gorge, chacun avec son niveau d’exigence.


      Depuis le col de Genna Silana, accès le plus direct par l’est, un sentier balisé d’environ quatre
      kilomètres descend en une heure vers l’entrée du canyon, à travers une forêt de chênes verts et
      d’arbousiers. Le panorama est splendide, mais la remontée exige de franchir environ six cent cinquante
      mètres de dénivelé et demande le double de temps.


      Par le sud, un itinéraire réservé aux randonneurs aguerris part de Sedda ar Baccas : douze kilomètres et
      deux cents mètres de dénivelé, réalisables en cinq heures aller-retour. Il passe par la Pischina
      Urthaddala, petite vasque formée par le torrent, et par la cascade de sa Giuntura à l’entrée amont du
      défilé.


      Par le nord, on part de Dorgali en voiture jusqu’au pont de s’Abba Arva, puis on chemine à pied deux
      heures le long du cours d’eau et du mont Oddeu, parmi de gros blocs calcaires polis : environ sept
      kilomètres presque plats. Des randonnées guidées nocturnes sont également proposées du coucher au lever
      du soleil.
    history: >-
      Les peuples nuragiques connurent parfaitement ce site. Les nombreux nuraghes des environs attestent une
      occupation dès l’âge du bronze. Le nuraghe Presetu Tortu est dominé par le Mereu, un colosse calcaire
      dressé sur la forêt, tandis que le nuraghe Gorropu surveille l’entrée. L’accès difficile de l’abîme a
      suscité de multiples légendes insulaires évoquant des créatures mystérieuses tapies dans ses grottes.
    before: >-
      Pour les sentiers conduisant au canyon, il est nécessaire de recourir à des guides expérimentés et
      d’emporter un équipement adapté : c’est le cœur le plus sauvage de l’île.
    around: >-
      La gorge est entièrement enclavée dans le [massif karstique du Supramonte
      (Sardaigne)](/lugar/macizzo-karstico-del-supramonte/), le vaste plateau calcaire qui la ceint de toutes
      parts.
  de:
    intro: >-
      Gorropu bedeutet auf Sardisch Abgrund oder ausgehöhlter Ort, und kein Name könnte treffender sein. Es
      ist eine anderthalb Kilometer lange Erosionsschlucht an der Grenze zwischen Orgosolo und Urzulei im
      Herzen des Supramonte. Die Felswände ragen über fünfhundert Meter empor, und an den engsten Engpässen
      misst der Canyon kaum vier Meter Breite. Gegraben hat ihn der Flumineddu, der noch immer über den
      Geröllgrund strömt, gespeist von Karstwässern des Supramonte.
    landscape: >-
      Die Entstehung von Gorropu begann an einer tektonischen Verwerfung. Die Schlucht öffnete sich entlang
      einer Bruchlinie, die der Flumineddu auszuwaschen begann; im Lauf der Jahrmillionen schuf das Wasser
      diesen monumentalen Canyon. In den Felswänden lagern Meeresfossilien aus der Zeit vor einhundertneunzig
      bis sechzig Millionen Jahren: Was sich heute als Felsmauer auftürmt, war einst Meeresboden.


      In den sonnenfernen Tiefen der Schlucht herrschen extreme Temperaturunterschiede. Dieses kühle
      Schattenklima bildet einen Rückzugsraum für sardische Endemiten. Flussaufwärts, vor dem Schluchteingang,
      entspringt der Flumineddu in natürlichen Felspools, in denen die Sardische Forelle und der seltene
      Sardische Gebirgsmolch (Euproctus) leben.
    wildlife: >-
      Gorropu ist ein Refugium seltener Pflanzen und Tiere. Die Nuraghen-Akelei (*Aquilegia nuragica*) wächst
      als weltweiter Endemit ausschließlich in diesen Felsspalten, und der Sardische Gebirgsmolch bewohnt die
      klaren Wasserbecken des Flumineddu. Zur mediterranen Macchia zählen Steinlinden, während uralte
      Wacholder und Eiben an den Klettersteigen wurzeln.


      Die Tierwelt ist typisch für den Supramonte: Ringelnattern, Baummarder und
      [Steinadler](/especie/aquila_chrysaetos/), die in der Schlucht nisten, neben Trupps von
      [Mufflons](/especie/ovis_gmelini/), Sardischen Hasen, Füchsen, Igeln und Wildschweinen. Steineichen-,
      Farn- und Erdbeerbaumwälder säumen den Abstieg vom Genna-Silana-Pass.
    visit: >-
      Mehrere Routen führen in die Schlucht, jede mit eigener Gangart.


      Vom Pass Genna Silana, dem direktesten Zugang von Osten, führt ein markierter Wanderweg von etwa vier
      Kilometern in einer Stunde hinab zum Schluchteingang, vorbei an Steineichen und Erdbeerbäumen. Der Pfad
      ist aussichtsreich, doch der Rückweg überwindet rund sechshundertfünfzig Höhenmeter bergauf und dauert
      doppelt so lange.


      Von Süden startet an der Sedda ar Baccas eine anspruchsvolle Tour für Geübte: zwölf Kilometer und
      zweihundert Höhenmeter bei etwa fünf Stunden Gehzeit hin und zurück. Sie passiert den Felsenpool
      Pischina Urthaddala und den Wasserfall sa Giuntura am oberen Talschluss.


      Von Norden fährt man ab Dorgali zur Brücke s’Abba Arva und wandert zwei Stunden am Flusslauf entlang am
      Monte Oddeu vorbei über weiße, glattgeschliffene Kalkblöcke: rund sieben Kilometer auf fast ebenem
      Grund. Auch geführte Nachtwanderungen vom Abend bis zum Sonnenaufgang werden angeboten.
    history: >-
      Die Nuraghen-Kultur kannte diesen Ort genau. Zahlreiche Nuraghen im Umland belegen eine Besiedlung seit
      der Bronzezeit. Die Nuraghe Presetu Tortu wird von der Felsbastion Mereu überragt, während die Nuraghe
      Gorropu den Zugang überwacht. Die Unzugänglichkeit der Felsspalten brachte zudem alte Sagen über
      Fabelwesen hervor, die in den Höhlen hausen sollten.
    before: >-
      Für die Zustiege zur Schlucht sind ortskundige Führer und feste Bergausrüstung ratsam: Es ist das
      wildeste Terrain Sardiniens.
    around: >-
      Die Schlucht liegt inmitten des [Supramonte-Karstmassivs
      (Sardinien)](/lugar/macizzo-karstico-del-supramonte/), des gewaltigen Kalkmassivs, das sie umschließt.
  it:
    intro: >-
      Gorropu significa, in sardo, dirupo o luogo scavato, e non esiste toponimo più schietto. È una gola
      d’origine erosiva lunga un chilometro e mezzo che segna il confine tra Orgosolo e Urzulei nel cuore del
      Supramonte. Le pareti superano i cinquecento metri di altezza e nei punti più stretti la forra misura
      appena quattro metri di larghezza. L’ha scavata il rio Flumineddu, che continua a scorrere sul fondo
      ciottoloso alimentato dalle acque sotterranee del massiccio.
    landscape: >-
      La storia di Gorropu ha origine lungo una faglia tettonica. La gola nacque quando si aprì una frattura
      nella quale il Flumineddu iniziò la propria opera erosiva; nel tempo, le piene hanno scavato la roccia
      calcarea fino a forgiare questo canyon monumentale. Le pareti custodiscono fossili marini risalenti a un
      arco temporale tra centonovanta e sessanta milioni di anni fa: quella che oggi è muraglia di pietra fu
      in passato fondo marino.


      Il fondo della gola presenta tratti pochissimo esposti alla luce solare, con marcate escursioni
      termiche. Questo microclima fresco e ombreggiato crea un habitat che ospita vari endemismi sardi. A
      monte, prima dell’ingresso della forra, il Flumineddu sgorga tra le rocce dando vita a pozze naturali in
      cui vivono la trota sarda e l’euprotto, il tritone sardo.
    wildlife: >-
      Gorropu è un santuario per specie endemiche. L’aquilegia nuragica è un’erba rupicola considerata unica
      al mondo in questi anfratti verticali, mentre il tritone sardo nuota nelle pozze chiare del Flumineddu.
      Tra la macchia mediterranea vegetano filliree e, lungo i sentieri d’accesso, ginepri e tassi millenari.


      La fauna è quella tipica del Supramonte: biscia dal collare, martora e [aquila
      reale](/especie/aquila_chrysaetos/), che nidifica sulle cenge, insieme a nuclei di
      [mufloni](/especie/ovis_gmelini/), lepri sarde, volpi, ricci e cinghiali. I boschi di leccio, felci e
      corbezzolo accompagnano la discesa dal valico di Genna Silana.
    visit: >-
      Esistono diversi itinerari per raggiungere la forra, ciascuno con il proprio impegno fisico.


      Dal passo di Genna Silana, l’accesso più diretto da est, una traccia segnata di circa quattro chilometri
      scende in un’ora all’ingresso del canyon, traversando lecci e corbezzoli. Il panorama è magnifico, ma la
      risalita richiede di superare circa seicentoquaranta o seicentocinquanta metri di dislivello, impiegando
      il doppio del tempo.


      Da sud, il tracciato escursionistico per esperti parte da Sedda ar Baccas: dodici chilometri e duecento
      metri di dislivello, percorribili in cinque ore tra andata e ritorno. Tocca Pischina Urthaddala, bacino
      naturale scavato dal torrente, e la cascata di sa Giuntura all’ingresso a monte della gola.


      Da nord si parte da Dorgali in auto fino al ponte di s’Abba Arva, proseguendo a piedi per due ore lungo
      il fiume e le pendici del monte Oddeu tra massi calcarei bianchi e levigati: circa sette chilometri
      quasi pianeggianti. Vengono organizzate anche escursioni notturne guidate dal tramonto all’alba.
    history: >-
      La civiltà nuragica frequentò intensamente questi anfratti. I diversi nuraghi circostanti attestano una
      presenza umana costante sin dall’età del bronzo. Il nuraghe Presetu Tortu è dominato dal monte Mereu,
      colosso di calcare bianco sul verde dei lecci, mentre il nuraghe Gorropu presidia la porta orientale.
      L’asprezza della gola generò inoltre leggende su mostri mitici rifugiati nelle sue caverne.
    before: >-
      I sentieri per il canyon richiedono accompagnatori esperti e calzature adeguate: è l’angolo più impervio
      della Sardegna.
    around: >-
      La forra è racchiusa all’interno del [Massiccio Carsico del Supramonte
      (Sardegna)](/lugar/macizzo-karstico-del-supramonte/), il superbo altopiano calcareo che la circonda.
  pt:
    intro: >-
      Gorropu significa, em língua sarda, despenhadeiro ou sítio escavado, e não há designação mais
      transparente. É uma garganta de origem erosiva com um quilómetro e meio de extensão que traça a
      fronteira entre Orgosolo e Urzulei no coração do Supramonte. As suas escarpas ultrapassam os quinhentos
      metros de altura e nos passos mais estreitos a fenda mede apenas quatro metros de largura. Foi rasgada
      pelo ribeiro Flumineddu, que corre no leito pedregoso alimentado pelas águas que drenam o planalto
      cárstico.
    landscape: >-
      A história geológica de Gorropu iniciou-se numa falha tectónica. A fenda abriu-se numa fratura onde o
      Flumineddu começou o seu labor erosivo; ao longo das eras, a torrente desbastou o calcário moldando este
      desfiladeiro colossal. As escarpas guardam fósseis marinhos formados entre cento e noventa e sessenta
      milhões de anos atrás: o que hoje avulta como muralha rochosa foi outrora leito submarino.


      O fundo do desfiladeiro possui setores quase desprovidos de radiação solar direta, originando contrastes
      térmicos pronunciados. Este microclima umbrio gera um biótopo singular que alberga vários endemismos da
      Sardenha. A montante, antes da entrada da fenda, o Flumineddu brota das rochas em poços naturais
      límpidos onde sobrevivem a truta-sarda e o tritão-sardo (euproto).
    wildlife: >-
      Gorropu constitui um reduto biológico de espécies raras. A aquilégia-nurágica é uma erva endémica
      considerada exclusiva mundial destas fendas verticais, e o tritão-sardo povoa as poças do Flumineddu. O
      matagal mediterrânico integra lentiscos-bastardos, enquanto zimbros e teixos milenares se agarram às
      lajes de pedra.


      A fauna espelha o Supramonte selvagem: cobra-de-água-de-colar, marta e a
      [águia-real](/especie/aquila_chrysaetos/) a nidificar nas escarpas, a par de rebanhos de
      [muflões](/especie/ovis_gmelini/), lebres-sardas, raposas, ouriços e javalis. A mata de azinheiras,
      fetos e medronheiros acompanha a descida a partir do colo de Genna Silana.
    visit: >-
      Existem vários acessos à garganta, cada qual com o seu nível de dificuldade.


      A partir do colo de Genna Silana, a aproximação mais direta pelo leste, um trilho sinalizado de cerca de
      quatro quilómetros desce em uma hora até à entrada da fenda, cruzando azinheiras e medronheiros. O
      percurso é panorâmico, mas o regresso exige subir cerca de seiscentos e cinquenta metros de desnível,
      demorando o dobro do tempo.


      Pelo sul, o trilho para montanhistas experientes parte de Sedda ar Baccas: doze quilómetros e duzentos
      metros de desnível, cumpridos em cinco horas de marcha de ida e volta. Cruza a Pischina Urthaddala, poço
      natural do ribeiro, e a cascata de sa Giuntura à entrada da garganta.


      Pelo norte, parte-se de Dorgali de carro até à ponte de s’Abba Arva e caminha-se a pé durante duas horas
      junto ao rio e ao monte Oddeu, por entre blocos calcários polidos: cerca de sete quilómetros quase
      planos. Realizam-se também caminhadas guiadas noturnas do entardecer ao amanhecer.
    history: >-
      A civilização nurágica conheceu bem este desfiladeiro. Os múltiplos nuragues circundantes comprovam uma
      ocupação humana desde a Idade do Bronze. O nurague Presetu Tortu surge encimado pela torre rochosa de
      Mereu, um colosso de calcário alvo sobre o verde da mata, enquanto o nurague Gorropu vigia o acesso. A
      inacessibilidade da garganta gerou ainda lendas sobre monstros míticos acolhidos nas suas cavernas.
    before: >-
      Para percorrer os acessos ao desfiladeiro são necessários guias credenciados e botas de montanha: é o
      coração mais selvagem da ilha.
    around: >-
      A garganta fica inteiramente encravada no [Maciço Cárstico do Supramonte
      (Sardenha)](/lugar/macizzo-karstico-del-supramonte/), o grande planalto calcário que a envolve.
