texto:
  es:
    intro: >-
      En 1991, en un rincón de este bosque, los líderes de Ucrania, Rusia y Bielorrusia firmaron el acuerdo
      que disolvió la Unión Soviética. Pero este bosque es mucho más viejo que cualquier frontera. El Parque
      Nacional Belovezhskaya Pushcha ocupa 150 069 ha de la parte bielorrusa, a 70 km al norte de Brest, y
      desde 1992 es parte del Patrimonio Mundial Bosque de Białowieża: el último fragmento de bosque primario
      de las tierras llanas de Europa. Aquí vive el bisonte europeo, el animal terrestre más pesado del
      continente, con una población que supera los 800 ejemplares en el conjunto del bosque.
    landscape: >-
      El relieve es de llanura, la nieve se queda entre 70 y 75 días, y a poca distancia pasa la divisoria de
      aguas entre el Báltico y el mar Negro. Los pinares ocupan el 59,3 % del bosque, sobre todo de arándano y
      de musgo; el bosque entero cubre el 86 % de la reserva.


      Dentro, conviven árboles de edades muy distintas. La edad media de los árboles es de 81 años, pero en
      algunos lugares tienen entre 250 y 350 años. La picea es el árbol más alto, con hasta 50 m. Entre los
      robles hay uno con nombre propio: el Patriarca, uno de los más viejos del parque bielorruso, de 31 m,
      más de 2 m de diámetro y más de 550 años, a 1 km de la residencia de Ded Moroz.


      Buena parte de la vida está en la madera muerta. Casi la mitad de la madera es madera muerta, diez veces
      más que en bosques gestionados, y la mitad de las 12 000 especies del bosque dependen de troncos en
      descomposición. En los pantanos, como en el recorrido de Lake ring, la turba oscurece el agua de
      pequeños lagos artificiales construidos para regular el régimen hidrológico.


      La flora es muy variada: 958 plantas vasculares, 260 musgos, más de 290 líquenes y 570 hongos. Entre las
      raras hay abeto blanco, roble albar, lirio martagón y astrancia mayor.
    wildlife: >-
      El bisonte es el emblema, y el bosque tiene más de 800. Pero hay más: entre los grandes herbívoros, el
      ciervo, el jabalí, el corzo y el alce; entre los carnívoros, el lobo, el zorro, el lince, el tejón, la
      marta y la nutria. El ciervo se había extinguido en la zona y se reintrodujo con éxito en la década de
      1890.


      Las aves son otra liga. El parque es Área Importante para las Aves por sus poblaciones de cigüeña negra
      y blanca, búho real, halcón abejero y águilas pomerana y moteada. Entre las aves del Libro Rojo
      bielorruso figuran el pigargo europeo, el águila culebrera, la grulla, el cárabo lapón, el mochuelo
      chico, el pico dorsiblanco, el pico tridáctilo, la carraca y el carricerín cejudo. Más de 250 especies
      de aves habitan el bosque y 186 crían allí. Desde Lake ring suelen verse azores y aguiluchos laguneros
      sobrevolando el recorrido.


      Hacia el otoño pueden encontrarse distintos tipos de setas en Lake ring.
    visit: >-
      El parque recibe unas 300 000 visitas al año y su sede está en Kamieniuki. Allí un zoo muestra en
      cercados bisontes (reintroducidos en 1929), konik, jabalíes y alces. El Centro de Eco-Educación acoge el
      Museo de la Naturaleza.


      Para ver bisontes en libertad, el recorrido peatonal de Dokudovo tiene seis kilómetros y atraviesa la
      ciénaga del mismo nombre; se observan bisontes, ciervos, corzos y jabalíes pastando por la mañana y al
      atardecer desde torres habilitadas para observar y fotografiar. Lake ring recorre 5,8 kilómetros y dura
      cinco horas. Northern Path mide 3,8 kilómetros y empieza junto a la casa del conde Tyshkevich.


      El bosque está partido por una frontera. Desde mayo de 2015, senderistas y ciclistas pueden cruzarla sin
      visado por el paso de Pierarova-Białowieża.
    history: >-
      El bosque ya aparece en la Crónica de Ipatiev en el año 983, y desde siglos atrás se protegió al
      bisonte: en 1553, Segismundo I estableció la pena de muerte por cazar furtivamente uno. La protección
      llegó tarde. En 1923 solo quedaban 54 bisontes europeos en zoos de todo el mundo, ninguno en Polonia.


      En 1991 el bosque adquirió su estatus actual de parque nacional estatal, y en 2009 celebró los 600 años
      de su estatus de reserva. En 1993 se declaró en la parte bielorrusa la reserva de la biosfera. El parque
      se divide en zonas: la central, estrictamente protegida, cubre el 39 %; la de uso regulado, el 25 %; y
      las zonas turística y económica, el 36 % entre ambas.
    before: >-
      Una parte del parque, el 39 %, es zona central estrictamente protegida, y otra, el 25 %, es de uso
      regulado.
    around: >-
      El [Parque Nacional de Białowieża - Reserva
      Estricta](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) está en el otro lado de la frontera, en
      la parte polaca del mismo bosque. A mayor distancia, el [Parque Nacional de
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), el [Complejo de Bosques Vírgenes de
      Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) y el [Parque Paisajístico del
      Bosque de Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) comparten bisonte europeo, lobo y
      lince. La [Reserva Natural Estricta Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) comparte
      bisonte y lince, y su bosque primario.
  en:
    intro: >-
      In 1991, in a secluded corner of this forest, the leaders of Ukraine, Russia, and Belarus signed the
      accord that dissolved the Soviet Union. Yet this woodland is far older than any state frontier.
      Belovezhskaya Pushcha National Park spans 150,069 ha of the Belarusian sector, 70 km north of Brest, and
      has formed part of the Białowieża Forest World Heritage site since 1992: the final remnant of primeval
      lowland forest in Europe. Here lives the European bison, the continent's heaviest land animal, with a
      forest-wide population exceeding 800 individuals.
    landscape: >-
      The terrain is lowland plain, where snow cover lingers between 70 and 75 days, and close by runs the
      continental watershed dividing the Baltic and Black seas. Pine forests occupy 59.3% of the woodland,
      dominated by bilberry and moss understoreys; woodland as a whole covers 86% of the reserve.


      Inside, trees of radically differing generations stand side by side. The average tree age is 81 years,
      yet in undisturbed stands specimens reach between 250 and 350 years. Norway spruce is the tallest
      species, climbing up to 50 m. Among the oaks, one stands out by name: the Patriarch, one of the oldest
      in the Belarusian park, reaching 31 m, over 2 m in trunk diameter, and more than 550 years old, situated
      1 km from the estate of Ded Moroz.


      A huge portion of forest life depends on coarse woody debris. Nearly half the wood volume is dead
      wood—ten times more than in commercial forestry—and half of the forest's 12,000 recorded species depend
      directly on decaying timber. In the mires, such as along the Lake Ring route, peat discolours the waters
      of small artificial reservoirs created to regulate hydrological flow.


      The flora is remarkably rich: 958 vascular plants, 260 mosses, over 290 lichens, and 570 fungi. Rare
      elements include silver fir, sessile oak, Turk's cap lily, and greater masterwort.
    wildlife: >-
      The wisent is the living emblem, with the forest harbouring over 800 animals. Yet large wildlife
      abounds: among big herbivores, red deer, wild boar, roe deer, and elk; among carnivores, wolf, red fox,
      lynx, badger, pine marten, and otter. Red deer had been extirpated locally and was successfully
      reintroduced in the 1890s.


      The avifauna is outstanding. The park ranks as an Important Bird Area for its breeding black and white
      storks, eagle owl, European honey buzzard, and lesser and greater spotted eagles. Species listed in the
      Belarusian Red Data Book include white-tailed eagle, short-toed snake eagle, common crane, great grey
      owl, Eurasian pygmy owl, white-backed woodpecker, three-toed woodpecker, European roller, and aquatic
      warbler. Over 250 bird species occur in the forest, with 186 breeding on site. From the Lake Ring path,
      northern goshawks and western marsh harriers are frequently observed circling overhead.


      Come autumn, varied wild mushrooms can be found along the Lake Ring.
    visit: >-
      The park welcomes around 300,000 visitors annually, with its headquarters in Kamieniuki. There, an
      open-air enclosure complex exhibits bison (reintroduced in 1929), konik horses, wild boars, and elk. The
      Eco-Education Centre houses the Nature Museum.


      To view bison in the wild, the Dokudovo walking trail spans six kilometres across the mire of the same
      name; bison, red deer, roe deer, and boar are frequently observed grazing at dawn and dusk from
      purpose-built observation towers. Lake Ring covers 5.8 kilometres and takes about five hours. Northern
      Path measures 3.8 kilometres, starting beside Count Tyshkevich's manor.


      The woodland is bisected by an international border. Since May 2015, hikers and cyclists can cross
      visa-free at the Pierarova-Białowieża border gate.
    history: >-
      The forest was first documented in the Hypatian Chronicle under the year 983, and royal decrees
      protected bison for centuries: in 1553, Sigismund I decreed capital punishment for poaching one.
      Comprehensive protection arrived late. By 1923 only 54 European bison survived in captivity worldwide,
      with none left in Poland.


      In 1991 the forest acquired its modern national park status, and in 2009 it marked 600 years of reserve
      protection. In 1993 the Belarusian section was designated a biosphere reserve. The park is partitioned
      into zones: the strictly protected core covers 39%; the regulated nature zone covers 25%; and
      recreational and economic zones together account for the remaining 36%.
    before: >-
      A substantial portion of the park, 39%, is a strictly protected core zone, while 25% is under regulated
      use.
    around: >-
      The [Białowieża National Park - Strict Reserve](/lugar/bialowieski-park-narodowy---rezerwat-scisly/)
      lies just across the border in the Polish sector of the same forest. Further afield, [Bieszczady
      National Park](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), the [Bukovské Vrchy Primeval Forest
      Complex](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/), and the [Knyszyn Forest Landscape
      Park](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) also support European bison, wolf, and lynx. The
      [Stužica Strict Nature Reserve](/lugar/narodna-prirodna-rezervacia-stuzica/) shares bison, lynx, and
      ancient virgin forest.
  fr:
    intro: >-
      En 1991, dans un recoin de cette forêt, les dirigeants de l'Ukraine, de la Russie et de la Biélorussie
      signèrent le traité qui dissolut l'Union soviétique. Mais ce massif forestier est bien plus ancien que
      toute frontière. Le parc national Belovejskaïa Pouchtcha couvre 150 069 ha du territoire biélorusse, à
      70 km au nord de Brest, et constitue depuis 1992 une part du site du patrimoine mondial Forêt de
      Białowieża : l'ultime relique de forêt primaire de plaine d'Europe. C'est ici que vit le bison d'Europe,
      plus lourd mammifère terrestre du continent, avec une harde dépassant les 800 individus sur l'ensemble
      du massif.
    landscape: >-
      Le relief est tabulaire, la neige persiste entre 70 et 75 jours par an, et tout près passe la ligne de
      partage des eaux séparant la Baltique de la mer Noire. Les pinèdes occupent 59,3 % du massif, dominées
      par les sous-bois de myrtilles et de mousses ; la forêt dans son ensemble couvre 86 % de la réserve.


      À l'intérieur se côtoient des arbres d'âges très disparates. L'âge moyen des peuplements est de 81 ans,
      mais dans certains secteurs vierges les arbres atteignent entre 250 et 350 ans. L'épicéa est l'essence
      la plus haute, s'élevant jusqu'à 50 m. Parmi les chênes, l'un porte un nom propre : le Patriarche, l'un
      des doyens du parc biélorusse, haut de 31 m, mesurant plus de 2 m de diamètre et âgé de plus de 550 ans,
      à 1 km du domaine de Ded Moroz.


      Une immense partie de la vie forestière repose sur le bois mort. Près de la moitié du cubage est
      constitué de bois mort — dix fois plus qu'en forêt exploitée — et la moitié des 12 000 espèces du massif
      dépendent des troncs en décomposition. Dans les tourbières, comme le long de l'itinéraire de Lake ring,
      la tourbe assombrit l'eau de petits étangs artificiels aménagés pour stabiliser le régime hydrologique.


      La flore est foisonnante : 958 plantes vasculaires, 260 mousses, plus de 290 lichens et 570 champignons.
      Parmi les raretés figurent le sapin blanc, le chêne sessile, le lis martagon et la grande astrance.
    wildlife: >-
      Le bison en est le symbole, et la forêt en abrite plus de 800. Mais la faune compte aussi de grands
      herbivores comme le cerf élaphe, le sanglier, le chevreuil et l'élan ; parmi les carnivores, le loup, le
      renard roux, le lynx, le blaireau, la martre des pins et la loutre. Le cerf élaphe avait disparu de la
      région et a été réintroduit avec succès dans la décennie 1890.


      L'avifaune est d'un niveau exceptionnel. Le parc est classé Zone importante pour la conservation des
      oiseaux grâce à ses cigognes noires et blanches, hiboux grands-ducs, bondrées apivores, ainsi qu'aux
      aigles pomarins et criards. Le Livre rouge biélorusse recense ici le pygargue à queue blanche, le
      circaète Jean-le-Blanc, la grue cendrée, la chouette lapone, la chevêchette d'Europe, le pic à dos
      blanc, le pic tridactyle, le rollier d'Europe et le phragmite aquatique. Plus de 250 espèces d'oiseaux
      peuplent la forêt et 186 y nichent. Depuis Lake ring, on observe régulièrement des autours des palombes
      et des busards des roseaux planant au-dessus du tracé.


      Vers l'automne, divers champignons s'observent le long de Lake ring.
    visit: >-
      Le parc enregistre environ 300 000 entrées par an et son siège se trouve à Kamieniuki. Là, un enclos
      animalier présente des bisons (réintroduits en 1929), des koniks, des sangliers et des élans. Le Centre
      d'éco-éducation héberge le Musée de la nature.


      Pour observer les bisons en liberté, l'itinéraire pédestre de Dokudovo parcourt six kilomètres à travers
      le marais éponyme ; bisons, cerfs, chevreuils et sangliers s'y nourrissent à l'aube et au crépuscule
      sous les yeux des visiteurs postés dans les tours d'affût. Lake ring s'étend sur 5,8 kilomètres et
      demande cinq heures. Le sentier Northern Path fait 3,8 kilomètres et commence près du manoir du comte
      Tychkévitch.


      La forêt est scindée par une frontière d'État. Depuis mai 2015, randonneurs et cyclistes peuvent la
      franchir sans visa au point de passage de Pierarova-Białowieża.
    history: >-
      La forêt est mentionnée dès la Chronique des temps passés en l'an 983, et le bison y fut protégé de
      longue date : en 1553, Sigismond Ier instaura la peine de mort pour tout braconnage d'un animal. La
      sauvegarde globale fut tardive. En 1923, il ne restait que 54 bisons d'Europe en captivité dans le monde
      entier, et aucun en Pologne.


      En 1991, la forêt a acquis son statut actuel de parc national d'État, et en 2009 elle a célébré 600 ans
      d'institution de réserve. En 1993, le secteur biélorusse a été reconnu réserve de biosphère. Le parc se
      structure en plusieurs zones : la réserve intégrale centrale couvre 39 % ; la zone d'usage régulé, 25 %
      ; et les secteurs touristiques et économiques réunissent 36 % à eux deux.
    before: >-
      Une proportion majeure du parc, 39 %, constitue une zone centrale de protection intégrale, tandis que 25
      % relève d'un usage régulé.
    around: >-
      Le [Parc national de Białowieża - Réserve
      intégrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) se situe de l'autre côté de la
      frontière, dans le secteur polonais du massif. Plus loin, le [Parc national de
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), le [Complexe forestier primaire des
      Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) et le [Parc paysager de la forêt
      de Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) partagent la présence du bison d'Europe, du
      loup et du lynx. La [Réserve naturelle intégrale de
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) partage également le bison, le lynx et une forêt
      primaire séculaire.
  de:
    intro: >-
      Im Jahr 1991 unterzeichneten die Spitzen von Ukraine, Russland und Belarus in einem Winkel dieses Waldes
      das Abkommen zur Auflösung der Sowjetunion. Doch dieser Wald ist unendlich älter als jede Landesgrenze.
      Der Nationalpark Belaweschskaja Puschtscha umfasst 150.069 ha des belarussischen Teils, 70 km nördlich
      von Brest, und gehört seit 1992 zum UNESCO-Welterbe Białowieża-Urwald: dem letzten Überrest echten
      Urwalds im europäischen Tiefland. Hier lebt der Wisent, das schwerste Landsäugetier des Kontinents, mit
      einem Bestand von über 800 Exemplaren im gesamten Waldgebiet.
    landscape: >-
      Das Relief ist eben, Schnee liegt an 70 bis 75 Tagen im Jahr, und unweit verläuft die europäische
      Hauptwasserscheide zwischen Ostsee und Schwarzem Meer. Kiefernwälder nehmen 59,3 % des Waldgebiets ein,
      vor allem mit Heidelbeer- und Moosunterwuchs; der Wald insgesamt bedeckt 86 % des Schutzgebiets.


      Im Inneren wachsen Bäume völlig unterschiedlicher Generationen nebeneinander. Das Durchschnittsalter der
      Bäume liegt bei 81 Jahren, an unberührten Stellen erreichen sie jedoch zwischen 250 und 350 Jahre. Die
      Gemeine Fichte ist mit bis zu 50 m die höchste Baumart. Unter den Eichen ragt eine mit eigenem Namen
      heraus: der Patriarch, eine der ältesten Eichen im belarussischen Parkteil mit 31 m Höhe, über 2 m
      Stammdurchmesser und mehr als 550 Jahren Alter, 1 km vom Anwesen des Väterchen Frost entfernt.


      Ein wesentlicher Teil des Lebenszyklus vollzieht sich im Totholz. Nahezu die Hälfte der Holzmasse
      besteht aus abgestorbenem Holz – zehnmal mehr als in Wirtschaftswäldern – und die Hälfte der 12.000 im
      Wald nachgewiesenen Arten ist auf morsches Holz angewiesen. In den Mooren, wie entlang des Rundwegs Lake
      Ring, verfärbt Torf das Wasser kleiner künstlicher Teiche, die zur hydrologischen Regulierung angelegt
      wurden.


      Die Flora ist außergewöhnlich artenreich: 958 Gefäßpflanzen, 260 Moose, über 290 Flechten und 570 Pilze.
      Zu den botanischen Kostbarkeiten gehören Weißtanne, Traubeneiche, Türkenbund-Lilie und Große Sterndolde.
    wildlife: >-
      Der Wisent ist das Wappentier, und das Waldgebiet beherbergt über 800 Tiere. Hinzu kommen kapitale
      Huftiere wie Rothirsch, Wildschwein, Reh und Elch; unter den Beutegreifern leben hier Wolf, Rotfuchs,
      Luchs, Dachs, Baummarder und Fischotter. Der Rothirsch war in der Region ausgestorben und wurde im
      Jahrzehnt um 1890 erfolgreich wieder angesiedelt.


      Die Vogelwelt ist spektakulär. Der Nationalpark ist als Important Bird Area für seine Bestände an
      Schwarz- und Weißstörchen, Uhus, Wespenbussarden sowie Schrei- und Schelladlern anerkannt. Im Roten Buch
      von Belarus stehen hier Seeadler, Schlangenadler, Kranich, Bartkauz, Sperlingskauz, Weißrückenspecht,
      Dreizehenspecht, Blauracke und Seggenrohrsänger. Mehr als 250 Vogelarten kommen im Wald vor, 186 brüten
      vor Ort. Vom Rundweg Lake Ring aus kreisen regelmäßig Habichte und Rohrweihen über den Wipfeln.


      Im Herbst lassen sich entlang des Lake Ring verschiedenste Pilzarten entdecken.
    visit: >-
      Der Park verzeichnet rund 300.000 Besucher im Jahr; das Verwaltungszentrum liegt in Kamieniuki. Dort
      zeigt ein Freigehege Wisente (wiederangesiedelt im Jahr 1929), Koniks, Wildschweine und Elche. Das
      Ökologische Bildungszentrum beherbergt das Naturmuseum.


      Um Wisente in freier Wildbahn zu beobachten, bietet sich der sechs Kilometer lange Fußweg Dokudowo durch
      das gleichnamige Moor an; Wisente, Hirsche, Rehe und Wildschweine weiden dort morgens und in der
      Dämmerung vor eigens errichteten Beobachtungstürmen. Lake Ring misst 5,8 Kilometer und dauert rund fünf
      Stunden. Der Northern Path ist 3,8 Kilometer lang und beginnt am Gutshof von Graf Tyszkiewicz.


      Der Wald wird durch eine Staatsgrenze geteilt. Seit Mai 2015 können Wanderer und Radfahrer am
      Grenzposten Pierarova-Białowieża visafrei die Grenze überqueren.
    history: >-
      Der Wald wird bereits in der Hypatiuschronik für das Jahr 983 erwähnt, und seit Jahrhunderten genoss der
      Wisent Schutz: 1553 verhängte Sigismund I. die Todesstrafe für Wilderei. Die Rettung erfolgte spät. 1923
      existierten weltweit nur noch 54 Wisente in Zoos, kein einziger mehr in Polen.


      Im Jahr 1991 erhielt der Wald seinen Rang als staatlicher Nationalpark, und 2009 feierte er das
      600-jährige Bestehen seines Schutzstatus. Im Jahr 1993 wurde der belarussische Teil zum
      Biosphärenreservat erklärt. Der Park gliedert sich in Zonen: Die Kernzone mit absolutem Schutz umfasst
      39 %; die kontrollierte Nutzungszone 25 %; auf Erholungs- und Wirtschaftszonen entfallen zusammen 36 %.
    before: >-
      Ein beträchtlicher Teil des Parks, 39 %, bildet die streng geschützte Kernzone, während 25 % der
      regulierten Nutzung unterliegen.
    around: >-
      Der [Nationalpark Białowieża – Strenges Reservat](/lugar/bialowieski-park-narodowy---rezerwat-scisly/)
      liegt direkt jenseits der Grenze im polnischen Teil desselben Waldmassivs. Weiter entfernt teilen auch
      der [Nationalpark Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), der [Urwaldkomplex
      Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) und der [Landschaftspark
      Knyszyn-Heide](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) Wisente, Wölfe und Luchse. Das [Strenge
      Naturreservat Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) teilt ebenfalls Wisent, Luchs und
      ursprünglichen Primärwald.
  it:
    intro: >-
      Nel 1991, in un angolo appartato di questa foresta, i governanti di Ucraina, Russia e Bielorussia
      siglarono l'intesa che sciolse l'Unione Sovietica. Ma questa foresta è infinitamente più antica di
      qualsiasi confine. Il Parco Nazionale Belovezhskaya Pushcha copre 150.069 ha del settore bielorusso, 70
      km a nord di Brest, e dal 1992 è Patrimonio Mondiale UNESCO come parte della Foresta di Białowieża:
      l'ultimo lembo di foresta primaria delle pianure d'Europa. Qui vive il bisonte europeo, il mammifero
      terrestre più massiccio del continente, con oltre 800 esemplari nell'intero comprensorio.
    landscape: >-
      Il rilievo è pianeggiante, la coltre nevosa permane tra 70 e 75 giorni all'anno, e a breve distanza
      corre lo spartiacque continentale tra il mar Baltico e il mar Nero. Le pinete coprono il 59,3 %
      dell'area boschiva, dominate da mirtilli e muschi; l'insieme dei boschi occupa l'86 % della riserva.


      All'interno convivono alberi di generazioni profondamente diverse. L'età media delle piante è di 81
      anni, ma nei lembi vergini gli esemplari contano tra 250 e 350 anni. Il peccio è l'albero più slanciato,
      superando i 50 m. Tra le querce una ha persino un proprio nome: il Patriarca, tra le più antiche del
      settore bielorusso, alta 31 m, con oltre 2 m di diametro e più di 550 anni d'età, situata a 1 km dalla
      residenza di Ded Moroz.


      Gran parte della vita pullula nel legno morto. Quasi la metà della massa legnosa è legno decomposto —
      dieci volte più che nei boschi gestiti — e metà delle 12.000 specie della foresta dipende direttamente
      dai tronchi marcescenti. Nelle torbiere, come lungo il percorso di Lake ring, la torba scurisce l'acqua
      di piccoli laghi artificiali creati per regolare il regime idrico.


      La flora presenta una ricchezza straordinaria: 958 piante vascolari, 260 muschi, oltre 290 licheni e 570
      funghi. Tra le specie rare spiccano abete bianco, rovere, giglio martagone e astranzia maggiore.
    wildlife: >-
      Il bisonte è il simbolo vivente, con una popolazione che supera gli 800 individui. Ma i boschi accolgono
      molti altri erbivori, tra cui cervo, cinghiale, capriolo e alce; tra i predatori figurano lupo, volpe
      rossa, lince, tasso, martora e lontra. Il cervo era scomparso dall'area ed è stato reintrodotto con
      successo negli anni 1890.


      L'avifauna riserva scorci eccezionali. Il parco è una Important Bird Area per le colonie di cicogna nera
      e bianca, gufo reale, pecchiaiolo, aquila anatraia minore e maggiore. Tra le specie del Libro Rosso
      bielorusso si annoverano aquila di mare, biancone, gru cenerina, allocco lappone, civetta nana, picchio
      dorsobianco, picchio tridattilo, ghiandaia marina e pagliarolo. Più di 250 specie di uccelli popolano il
      bosco e 186 vi nidificano regolarmente. Lungo il sentiero Lake ring si avvistano spesso astori e falchi
      di palude volteggiare sulle chiome.


      Verso l'autunno si possono scoprire svariati funghi lungo Lake ring.
    visit: >-
      Il parco accoglie circa 300.000 visitatori all'anno e la sua sede si trova a Kamieniuki. Lì un'area
      faunistica mostra in grandi recinti bisonti (reintrodotti nel 1929), cavalli konik, cinghiali e alci. Il
      Centro di Educazione Ecologica ospita il Museo della Natura.


      Per osservare bisonti allo stato brado, il sentiero pedonale di Dokudovo si snoda per sei chilometri
      attraverso la torbiera omonima; bisonti, cervi, caprioli e cinghiali pascolano al mattino e
      all'imbrunire sotto lo sguardo degli escursionisti dalle torrette di avvistamento. Lake ring copre 5,8
      chilometri e impegna per circa cinque ore. Il Northern Path misura 3,8 chilometri e parte accanto alla
      tenuta del conte Tyshkevich.


      La foresta è divisa da una frontiera statale. Da maggio 2015 escursionisti e ciclisti possono varcarla
      senza visto dal valico di Pierarova-Białowieża.
    history: >-
      La foresta è menzionata fin dalla Cronaca di Ipatiev nell'anno 983, e fin dal Medioevo il bisonte godeva
      di tutela: nel 1553 Sigismondo I sancì la pena capitale contro il bracconaggio. La protezione globale
      giunse tardi. Nel 1923 sopravvivevano solo 54 bisonti europei negli zoo di tutto il mondo, nessuno dei
      quali in Polonia.


      Nel 1991 la foresta ha ottenuto l'attuale rango di parco nazionale statale e nel 2009 ha celebrato i 600
      anni dal primo statuto di riserva. Nel 1993 è stata istituita la riserva della biosfera nel settore
      bielorusso. Il parco è suddiviso in zone: il nucleo a protezione integrale racchiude il 39 %; la fascia
      a uso controllato il 25 %; i settori ricreativi ed economici occupano insieme il 36 %.
    before: >-
      Una porzione cospicua del parco, il 39 %, costituisce la zona centrale a protezione integrale, mentre il
      25 % è destinato a uso regolamentato.
    around: >-
      Il [Parco Nazionale di Białowieża - Riserva
      Integrale](/lugar/bialowieski-park-narodowy---rezerwat-scisly/) sorge appena oltre confine, nel settore
      polacco dello stesso bosco. A maggior distanza, il [Parco Nazionale
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), il [Complesso Forestale Vergine di
      Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) e il [Parco Paesaggistico della
      Foresta di Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) ospitano anch'essi bisonti, lupi e
      linci. La [Riserva Naturale Integrale Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) condivide
      bisonti, linci e l'incomparabile foresta primaria.
  pt:
    intro: >-
      Em 1991, num recanto desta floresta, os líderes da Ucrânia, Rússia e Bielorrússia assinaram o acordo que
      dissolveu a União Soviética. Mas esta mata é incomparavelmente mais antiga do que qualquer fronteira. O
      Parque Nacional Belovezhskaya Pushcha cobre 150.069 ha no território bielorrusso, a 70 km a norte de
      Brest, e integra desde 1992 o sítio Património Mundial da Floresta de Białowieża: o último reduto de
      floresta primária de planície da Europa. Aqui habita o bisonte-europeu, o animal terrestre mais pesado
      do continente, com uma população superior a 800 exemplares em todo o maciço.
    landscape: >-
      O relevo é plano, o manto de neve permanece entre 70 e 75 dias por ano, e a pouca distância passa a
      linha divisória de águas entre o Báltico e o mar Negro. Os pinhais ocupam 59,3 % da floresta, dominados
      por urzais, mirtilos e musgos; o conjunto florestal cobre 86 % da reserva.


      No interior coexistem árvores de gerações muito díspares. A idade média dos povoamentos é de 81 anos,
      mas em setores virgens os espécimes alcançam entre 250 e 350 anos. O espruce é a espécie mais alta,
      atingindo até 50 m. Entre os carvalhos destaca-se um com nome próprio: o Patriarca, um dos mais antigos
      do parque bielorrusso, com 31 m de altura, mais de 2 m de diâmetro e mais de 550 anos, situado a 1 km da
      residência de Ded Moroz.


      Grande parte da cadeia biológica sustenta-se na madeira morta. Quase metade da madeira existente é
      madeira morta — dez vezes mais do que em florestas exploradas — e metade das 12.000 espécies da floresta
      depende diretamente de troncos caídos. Nos pântanos, como no percurso de Lake ring, a turfa escurece as
      águas de pequenas lagoas artificiais criadas para regular o balanço hidrológico.


      A flora exibe enorme riqueza: 958 plantas vasculares, 260 musgos, mais de 290 líquenes e 570 fungos.
      Entre as raridades encontram-se o abeto-branco, o carvalho-alvar, o lírio-martagão e a astrância-maior.
    wildlife: >-
      O bisonte é o emblema vivo, somando a floresta mais de 800 animais. Mas a fauna reúne outros grandes
      herbívoros como o veado-vermelho, o javali, o corço e o alce; entre os carnívoros encontram-se o lobo, a
      raposa, o lince, o texugo, a marta e a lontra. O veado-vermelho tinha desaparecido da região e foi
      reintroduzido com sucesso na década de 1890.


      As aves são um capítulo excecional. O parque é uma Área Importante para as Aves pelas suas colónias de
      cegonha-preta e branca, bufo-real, búteo-vespeiro e águias-pomarinas e grifinas. Entre as espécies do
      Livro Vermelho bielorrusso contam-se a águia-rabalva, a águia-cobreira, o grou-comum, a
      coruja-gavião-lapónica, o mocho-pigmeu, o pica-pau-de-dorso-branco, o pica-pau-tridáctilo, o rolieiro e
      o felosa-aquática. Mais de 250 espécies de aves habitam a floresta e 186 nidificam no local. A partir de
      Lake ring avistam-se com frequência açores e tartaranhões-ruivos sobrevoando as copas.


      Rumo ao outono encontram-se diversos cogumelos ao longo de Lake ring.
    visit: >-
      O parque recebe cerca de 300.000 visitantes por ano e a sua sede situa-se em Kamieniuki. Aí, um complexo
      de cercados exibe bisontes (reintroduzidos em 1929), cavalos konik, javalis e alces. O Centro de
      Eco-Educação alberga o Museu da Natureza.


      Para avistar bisontes em liberdade, o trilho pedestre de Dokudovo estende-se por seis quilómetros
      através do pântano do mesmo nome; bisontes, veados, corços e javalis pastam de manhã e ao cair da noite
      sob a vista dos caminhantes a partir de torres de observação. Lake ring percorre 5,8 quilómetros e
      demora cinco horas. O percurso Northern Path mede 3,8 quilómetros e começa junto ao solar do conde
      Tyshkevich.


      A floresta é cortada por uma fronteira de Estado. Desde maio de 2015, caminhantes e ciclistas podem
      cruzar sem visto a fronteira pelo posto de Pierarova-Białowieża.
    history: >-
      A floresta já figura na Crónica de Ipatiev no ano 983, e a proteção aos bisontes vem de séculos
      recuados: em 1553, Sigismundo I estabeleceu a pena de morte para os caçadores furtivos. A preservação
      global tardou. Em 1923 restavam somente 54 bisontes-europeus em jardins zoológicos de todo o mundo,
      nenhum na Polónia.


      Em 1991 a floresta alcançou o seu atual estatuto de parque nacional estatal e em 2009 comemorou 600 anos
      de estatuto de reserva. Em 1993 foi declarada a reserva da biosfera na secção bielorrussa. O parque
      reparte-se em zonas: o núcleo central estritamente protegido ocupa 39 %; a zona de utilização
      controlada, 25 %; e as áreas turísticas e económicas somam 36 % no seu conjunto.
    before: >-
      Uma fração substancial do parque, 39 %, é zona central sob proteção estrita, ao passo que 25 % se
      encontra sob uso regulamentado.
    around: >-
      O [Parque Nacional de Białowieża - Reserva Estrita](/lugar/bialowieski-park-narodowy---rezerwat-scisly/)
      situa-se do outro lado da fronteira, no setor polaco da mesma floresta. A maior distância, o [Parque
      Nacional Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), o [Complexo Florestal
      Primário de Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) e o [Parque
      Paisagístico da Floresta de Knyszyn](/lugar/park-krajobrazowy-puszczy-knyszynskiej/) albergam igualmente
      bisontes-europeus, lobos e linces. A [Reserva Natural Estrita
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) partilha bisontes, linces e uma mata primária
      intacta.
