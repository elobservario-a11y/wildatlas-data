resumen:
  es: >-
    Estrecha península volcánica desértica en el extremo oriental de Madeira con acantilados de toba roja y
    negra y refugio de la foca monje (*Monachus monachus*).
  en: >-
    Narrow, arid volcanic peninsula at the eastern tip of Madeira with red and black tuff cliffs and a haven
    for the Mediterranean monk seal (*Monachus monachus*).
  fr: >-
    Étroite péninsule volcanique aride à l'extrémité orientale de Madère aux falaises de tuf rouge et noir,
    refuge du phoque moine de Méditerranée (*Monachus monachus*).
  de: >-
    Schmale, aride Vulkanhalbinsel am östlichen Ende Madeiras mit Klippen aus rotem und schwarzem Tuffstein
    und Zufluchtsort der Mittelmeer-Mönchsrobbe (*Monachus monachus*).
  it: >-
    Stretta penisola vulcanica desertica all'estremità orientale di Madeira con scogliere di tufo rosso e nero
    e rifugio della foca monaca (*Monachus monachus*).
  pt: >-
    Estreita península vulcânica desértica no extremo oriental da Madeira com arribas de tufo vermelho e negro
    e refúgio da foca-monge (*Monachus monachus*).
unico:
  es: >-
    Un fin de isla desnudo, árido y volcánico donde anidan aves marinas protegidas y, con suerte, se deja ver
    la [foca monje](/especie/monachus_monachus/).
  en: >-
    A barren, windswept volcanic end of the island where protected seabirds nest and, with some luck, the
    [Mediterranean monk seal](/especie/monachus_monachus/) can be spotted.
  fr: >-
    Un bout d'île dénudé, aride et volcanique où nichent des oiseaux marins protégés et où, avec un peu de
    chance, s'observe le [phoque moine de Méditerranée](/especie/monachus_monachus/).
  de: >-
    Ein kahles, windiges vulkanisches Inselende, an dem geschützte Meeresvögel brüten und sich mit etwas Glück
    die [Mittelmeer-Mönchsrobbe](/especie/monachus_monachus/) zeigt.
  it: >-
    Un lembo d'isola spoglio, arido e vulcanico dove nidificano uccelli marini protetti e, con un pizzico di
    fortuna, si avvista la [foca monaca](/especie/monachus_monachus/).
  pt: >-
    Um fim de ilha despojado, árido e vulcânico onde nidificam aves marinhas protegidas e, com sorte, se
    avista a [foca-monge](/especie/monachus_monachus/).
observaciones:
  es: >-
    Para pernoctar en el área protegida hay que pedir autorización al Instituto das Florestas e da Conservação
    da Natureza. La entrada al área protegida tiene un coste para mayores de 12 años; consulta al gestor las
    condiciones antes de ir.
texto:
  es:
    intro: >-
      Madeira termina en una península pelada. Al llegar a la Ponta de São Lourenço desaparecen los árboles,
      en contraste con el resto de la isla: queda un filo de nueve kilómetros de roca volcánica, herbáceas y
      viento que acaba en los islotes do Desembarcadouro y do Farol. La vegetación baja no es un descuido, es
      consecuencia de la aridez y de los vientos del norte. Y fue lo primero que vieron los portugueses
      cuando, en 1419, avistaron la isla: la primera porción de tierra que apareció en el horizonte, bautizada
      con el nombre de la nao que llevaba a su descubridor.
    landscape: >-
      La península es de origen volcánico, formada sobre todo por basalto con algunos sedimentos calcáreos.
      Hay rocas piroclásticas y diques de basalto, y sus rocas datan del Pleistoceno tardío, hace unos 100.000
      años. El punto más alto es el Pico do Furado.


      Hacia el oeste, la Baía d'Abra, de gran extensión y excelentes condiciones de fondeo, marca el inicio
      del camino. Más allá de la marina de Quinta do Lorde está la Prainha, una pequeña playa de arena oscura,
      y sobre ella el Morro da Piedade, un cono volcánico con una capilla del siglo XVI. Al norte de la
      Prainha están las Dunas da Piedade, un edificio dunar con fósiles del Cuaternario de 300 mil años,
      registros únicos en Europa, con raíces fosilizadas.


      La vegetación natural es de herbáceas anuales y bienales, con algunos arbustos y rarísimos árboles
      pequeños. Hay unas 160 especies de plantas: 141 en la península y 71 en el islote do Desembarcadouro.
      Entre las más singulares están la estreleira, la perpétua y la vaqueira; también crecen *Matthiola
      maderensis*, *Echium nervosum* y *Andryala glandulosa*. El islote do Desembarcadouro es el último
      reducto de vegetación indígena del litoral de Madeira en buen estado, con amplias manchas de trevina.
    wildlife: >-
      Las aves marinas son lo más visible. Anidan protegidas la cagarra, la alma-negra, el roque-de-castro y
      el garajau-comum. El islote do Farol no tiene depredadores terrestres, por lo que es el lugar por
      excelencia de anidación de aves marinas. En el do Desembarcadouro, con ratas, la colonia es más difícil,
      pero allí anida una de las mayores de [gaviota patiamarilla](/especie/larus_michahellis/) de la región.
      La zona es Área Importante para las Aves por sus colonias de aves marinas, con la mayor colonia de
      gaviota de Cáspio de Madeira.


      Entre las aves terrestres son frecuentes el corre-caminhos y el pintassilgo, y entre las rapaces, la
      manta, el francelho y la coruja-das-torres. Muchas otras aves migratorias visitan la zona, y el maçarico
      es de las más representativas. Hay 35 especies de moluscos terrestres, 24 de ellas endémicas, y la
      lagartixa es un vertebrado nativo muy frecuente.


      Bajo el agua, en los fondos rocosos son frecuentes los pepinos y los erizos de mar. Entre los peces
      destacan el sargo, las castanhetas y el bodião. En estas aguas aparecen tortugas y varios mamíferos
      marinos, como delfines y el emblemático lobo-marinho, la foca monje.
    visit: >-
      La Vereda da Ponta de São Lourenço es el camino. Nace en la Baía d'Abra, accesible por la carretera
      regional 109, y acaba en el Cais do Sardinha. La visita a pie dura unas 2 horas por unos 4 km, es de
      fácil acceso y se aconseja hacerla durante todo el año. Quien quiera una visita interpretativa puede
      pedirla acompañada por un técnico.


      Al final del camino, junto al Cais do Sardinha, está el Centro de Receção Casa do Sardinha, con una
      exposición permanente sobre el área protegida. Funcionó como puesto de observación y vigilancia hasta
      2009. Las actividades de educación ambiental las coordina el Centro de Información del Núcleo dos
      Dragoeiros das Neves.
    history: >-
      La región adquirió en 1994 el islote do Desembarcadouro y el extremo de la península hasta el muro de
      piedra de la Baía d'Abra. La Casa do Sardinha la mandó construir Manuel Bettencourt Sardinha, tras
      levantar el Cais de Abra, como refugio y lugar de vacaciones, y en 1996 su nieta la vendió a la Región
      Autónoma de Madeira con la condición de que sirviera a la conservación de los valores naturales del
      sitio.


      La Ponta de São Lourenço es un Monumento Natural de la red de monumentos naturales de Madeira y forma
      parte de la Red Natura 2000 como zona especial de conservación. El plan de gestión fija áreas de
      protección total (los islotes), parcial (la península) y complementaria (playas, miradores y la capilla
      de la Piedade).
    before: >-
      Para pernoctar en el área protegida hay que pedir autorización al Instituto das Florestas e da
      Conservação da Natureza. La entrada al área protegida tiene un coste para mayores de 12 años; consulta
      al gestor las condiciones antes de ir.
    around: >-
      La [Reserva Natural da Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) queda a seis
      kilómetros, el [Pico Ruivo y Macizo Central de
      Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) a ocho y las [Islas
      Desertas](/lugar/islas-desertas/) a quince. Los tres lugares comparten con la Ponta de São Lourenço el
      mismo mundo volcánico de Madeira. La Ponta de São Lourenço está integrada en el [Parque Natural de la
      Madeira](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/).
  en:
    intro: >-
      Madeira ends in a barren peninsula. Arriving at Ponta de São Lourenço, the trees vanish in stark
      contrast to the rest of the island: what remains is a nine-kilometre ridge of volcanic rock, low
      vegetation, and wind ending at the islets of Desembarcadouro and Farol. The low vegetation is no
      accident; it is the natural consequence of aridity and relentless north winds. It was also the first
      sight that greeted Portuguese navigators when they sighted the island in 1419: the very first slice of
      land to rise on the horizon, named after the vessel that carried its discoverer.
    landscape: >-
      The peninsula is volcanic in origin, composed mainly of basalt alongside scattered calcareous sediments.
      Pyroclastic rocks and basalt dykes abound, with formations dating back to the Late Pleistocene, some
      100,000 years ago. Its highest point is Pico do Furado.


      To the west, Baía d'Abra, wide and offering sheltered anchorage, marks the start of the footpath. Beyond
      the Quinta do Lorde marina lies Prainha, a small dark-sand beach beneath Morro da Piedade, a volcanic
      cinder cone crowned by a sixteenth-century chapel. North of Prainha spread the Dunas da Piedade, a
      fossil dune system preserving Quaternary fossils 300 thousand years old—unique records in Europe, with
      calcified root structures.


      The natural vegetation consists of annual and biennial herbs, sparse shrubs, and exceedingly rare
      dwarfed trees. Around 160 plant species grow here: 141 on the peninsula itself and 71 on the islet of
      Desembarcadouro. Notable endemics include estreleira, perpétua, and vaqueira; *Matthiola maderensis*,
      *Echium nervosum*, and *Andryala glandulosa* also flourish. The islet of Desembarcadouro is the last
      pristine haven of indigenous Madeiran coastal flora, marked by sprawling carpets of trevina.
    wildlife: >-
      Seabirds are the most conspicuous inhabitants. Protected species nest along the ledges, including Cory's
      shearwater, Bulwer's petrel, band-rumped storm-petrel, and common tern. The islet of Farol is free of
      terrestrial predators, making it an undisturbed haven for nesting seabirds. On Desembarcadouro, where
      rats are present, nesting is tougher, yet it hosts one of the region's largest colonies of
      [yellow-legged gull](/especie/larus_michahellis/). The area is designated an Important Bird Area for its
      seabird colonies, harboring Madeira's largest colony of Caspian gulls.


      Among land birds, Berthelot's pipit and European goldfinch are common, while raptors include common
      buzzard (manta), common kestrel, and barn owl. Many migratory birds make stopovers here, with the
      whimbrel being especially typical. The reserve is home to 35 species of terrestrial molluscs, 24 of
      which are endemic, while the Madeiran wall lizard is an abundant native vertebrate.


      Beneath the surface, sea cucumbers and sea urchins coat the rocky seafloors. Prominent fish include
      white seabream, damselfish, and parrotfish. Sea turtles and several marine mammals frequent these
      coastal waters, including dolphins and the iconic lobo-marinho, the Mediterranean monk seal.
    visit: >-
      The trail is the Vereda da Ponta de São Lourenço. It begins at Baía d'Abra, reached via the regional
      road 109, and ends at Cais do Sardinha. The hike takes about 2 hours over approximately 4 km; it is easy
      to walk and recommended throughout the year. Those seeking an interpretive tour can request a guided
      visit accompanied by a park technician.


      At the end of the trail by Cais do Sardinha stands the Casa do Sardinha Visitor Reception Centre,
      featuring a permanent exhibition on the protected area. It served as an observation and surveillance
      post until 2009. Environmental education activities are run through the Núcleo dos Dragoeiros das Neves
      Information Centre.
    history: >-
      The regional government purchased the islet of Desembarcadouro and the far tip of the peninsula up to
      the stone wall of Baía d'Abra in 1994. Casa do Sardinha was built by Manuel Bettencourt Sardinha after
      he constructed Cais de Abra, intended as a retreat and summer home; in 1996 his granddaughter sold it to
      the Autonomous Region of Madeira on the condition that it serve the conservation of the area's natural
      values.


      Ponta de São Lourenço is a Natural Monument within Madeira's monument network and part of the Natura
      2000 network as a Special Area of Conservation. The management zoning establishes total protection areas
      (the islets), partial protection (the peninsula), and complementary zones (beaches, viewpoints, and the
      Chapel of Piedade).
    before: >-
      Spending the night within the protected area requires prior authorization from the Instituto das
      Florestas e da Conservação da Natureza. An entry fee applies for visitors older than 12; check the
      current conditions with the park administration before going.
    around: >-
      The [Reserva Natural da Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) lies six kilometres
      away, [Pico Ruivo y Macizo Central de
      Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) eight, and the [Islas
      Desertas](/lugar/islas-desertas/) fifteen. All three share the same volcanic origins with Ponta de São
      Lourenço. Ponta de São Lourenço is incorporated into the broader [Parque Natural de la
      Madeira](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/).
  fr:
    intro: >-
      Madère s'achève par une péninsule pelée. En arrivant à la Ponta de São Lourenço, les arbres
      disparaissent, contrastant fortement avec le reste de l'île : ne subsiste qu'un filon de neuf kilomètres
      de roche volcanique, d'herbacées et de vent qui s'achève aux îlots do Desembarcadouro et do Farol. Cette
      végétation basse n'est pas un hasard ; c'est le résultat de l'aridité et des vents du nord. C'est aussi
      la première terre qu'aperçurent les navigateurs portugais en 1419 : la toute première silhouette à
      surgir à l'horizon, baptisée du nom de la caravelle de son découvreur.
    landscape: >-
      La péninsule est d'origine volcanique, formée pour l'essentiel de basalte et de quelques sédiments
      calcaires. Les roches pyroclastiques et les dykes de basalte abondent, et les roches remontent au
      Pléistocène supérieur, il y a environ 100 000 ans. Le point culminant est le Pico do Furado.


      Vers l'ouest, la Baía d'Abra, très vaste et offrant d'excellentes conditions de mouillage, marque le
      point de départ du chemin. Au-delà du port de plaisance de Quinta do Lorde se trouve Prainha, une petite
      crique de sable noir dominée par le Morro da Piedade, un cône volcanique coiffé d'une chapelle du XVIe
      siècle. Au nord de Prainha s'étendent les Dunas da Piedade, un ensemble dunaire fossile renfermant des
      témoins du Quaternaire vieux de 300 mille ans, formations uniques en Europe avec des réseaux de racines
      fossilisées.


      La végétation naturelle est composée d'herbacées annuelles et bisannuelles, de quelques buissons et de
      très rares arbrisseaux. On compte environ 160 espèces végétales : 141 sur la péninsule et 71 sur l'îlot
      do Desembarcadouro. Parmi les plus remarquables figurent l'estreleira, la perpétua et la vaqueira ; y
      poussent aussi *Matthiola maderensis*, *Echium nervosum* et *Andryala glandulosa*. L'îlot do
      Desembarcadouro constitue l'ultime refuge en bon état de la flore littorale indigène de Madère, avec
      d'amples tapis de trèfle maritime.
    wildlife: >-
      Les oiseaux marins sont les hôtes les plus visibles. S'y reproduisent sous protection le puffin cendré,
      le pétrel de Bulwer, l'océanite de Castro et la sterne pierregarin. L'îlot do Farol ne compte aucun
      prédateur terrestre, ce qui en fait un sanctuaire exceptionnel pour la nidification. Sur
      Desembarcadouro, en présence de rats, l'installation est plus difficile mais abrite l'une des plus
      grandes colonies de [goéland leucophée](/especie/larus_michahellis/) de la région. Le secteur est classé
      Zone importante pour les oiseaux grâce à ces colonies, possédant notamment la plus grande population de
      goéland pontique de Madère.


      Parmi les oiseaux terrestres, le pipit de Berthelot et le chardonneret sont fréquents, et parmi les
      rapaces, la buse variable (manta), le faucon crécerelle et l'effraie des clochers. De nombreux
      migrateurs y font étape, le courlis corlieu étant l'un des plus typiques. On dénombre 35 espèces de
      mollusques terrestres, dont 24 endémiques, tandis que le lézard de Madère est un vertébré indigène
      omniprésent.


      Sous l'eau, les fonds rocheux regorgent d'holothuries et d'oursins. Parmi les poissons se distinguent le
      sar, les castagnoles et le labre perroquet. Dans ces eaux croisent des tortues marines et divers
      mammifères marins comme les dauphins et l'emblématique loup de mer, le phoque moine de Méditerranée.
    visit: >-
      Le sentier d'accès est la Vereda da Ponta de São Lourenço. Il débute à la Baía d'Abra, accessible par la
      route régionale 109, et se termine au Cais do Sardinha. La randonnée à pied dure environ 2 heures sur
      près de 4 km ; son accès est aisé et conseillé toute l'année. Si vous souhaitez une visite commentée,
      vous pouvez solliciter l'accompagnement d'un agent technique.


      À la fin du parcours, près du Cais do Sardinha, se dresse le centre d'accueil Casa do Sardinha, qui
      propose une exposition permanente consacrée à l'espace protégé. Il servit de poste d'observation et de
      surveillance jusqu'en 2009. Les activités d'éducation à l'environnement sont coordonnées par le centre
      d'information du Núcleo dos Dragoeiros das Neves.
    history: >-
      En 1994, la région fit l'acquisition de l'îlot do Desembarcadouro et de la pointe de la péninsule
      jusqu'au mur de pierre de la Baía d'Abra. La Casa do Sardinha fut édifiée par Manuel Bettencourt
      Sardinha après avoir aménagé le Cais de Abra, pour servir de villégiature ; en 1996, sa petite-fille la
      céda à la Région autonome de Madère à la condition expresse qu'elle contribue à la préservation du
      patrimoine naturel.


      La Ponta de São Lourenço est classée Monument naturel du réseau de Madère et intégrée au réseau Natura
      2000 en tant que zone spéciale de conservation. Le plan de gestion définit des secteurs de protection
      intégrale (les îlots), partielle (la péninsule) et complémentaire (plages, belvédères et la chapelle de
      la Piedade).
    before: >-
      Pour bivouaquer dans la zone protégée, il est obligatoire d'obtenir l'accord préalable de l'Instituto
      das Florestas e da Conservação da Natureza. L'accès est payant pour les visiteurs de plus de 12 ans ;
      renseignez-vous auprès du gestionnaire sur les modalités avant de vous déplacer.
    around: >-
      La [Reserva Natural da Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) se situe à six
      kilomètres, le [Pico Ruivo y Macizo Central de
      Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) à huit et les [Islas
      Desertas](/lugar/islas-desertas/) à quinze. Ces trois espaces partagent avec la Ponta de São Lourenço la
      même matrice volcanique madérienne. La Ponta de São Lourenço fait partie intégrante du [Parque Natural
      de la Madeira](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/).
  de:
    intro: >-
      Madeira endet in einer kargen Halbinsel. Wenn du die Ponta de São Lourenço erreichst, verschwinden die
      Bäume im krassen Kontrast zum Rest der Insel: Es bleibt ein neun Kilometer langer Grat aus
      Vulkangestein, Grasfluren und Wind, der an den Eilanden Desembarcadouro und Farol ausläuft. Die niedrige
      Vegetation ist kein Zufall, sondern Folge der Trockenheit und der Nordwinde. Und es war das Erste, was
      portugiesische Seefahrer sahen, als sie die Insel im Jahr 1419 sichteten: das allererste Stück Land am
      Horizont, benannt nach der Karavelle ihres Entdeckers.
    landscape: >-
      Die Halbinsel ist vulkanischen Ursprungs und besteht überwiegend aus Basalt mit vereinzelten
      Kalksedimenten. Pyroklastische Gesteine und Basaltgänge treten überall zutage; die Felsen stammen aus
      dem späten Pleistozän vor rund 100.000 Jahren. Der höchste Punkt ist der Pico do Furado.


      Nach Westen markiert die weite Baía d'Abra mit ihren guten Ankerbedingungen den Beginn des Wanderwegs.
      Jenseits des Jachthafens von Quinta do Lorde liegt die Prainha, ein kleiner Strand mit dunklem Sand,
      überragt vom Morro da Piedade, einem Vulkankegel mit einer Kapelle aus dem sechzehnten Jahrhundert.
      Nördlich der Prainha liegen die Dunas da Piedade, ein fossiles Dünensystem mit 300 Tausend Jahre alten
      Quartärfossilien und versteinerten Wurzeln, die in Europa einzigartig sind.


      Die natürliche Vegetation setzt sich aus ein- und zweijährigen Kräutern, wenigen Sträuchern und extrem
      seltenen Zwergbäumen zusammen. Hier wachsen rund 160 Pflanzenarten: 141 auf der Halbinsel und 71 auf der
      Ilhéu do Desembarcadouro. Zu den bemerkenswertesten zählen Estreleira, Perpétua und Vaqueira; ebenso
      gedeihen *Matthiola maderensis*, *Echium nervosum* und *Andryala glandulosa*. Das Eiland Desembarcadouro
      ist das letzte intakte Refugium ursprünglicher Küstenflora Madeiras mit ausgedehnten Teppichen des
      Kleeartigen Schneckenklees.
    wildlife: >-
      Die Meeresvögel sind die auffälligsten Bewohner. Unter Schutz brüten hier Gelbschnabel-Sturmtaucher,
      Bulwersturmvogel, Madeirawellenläufer und Flussseeschwalbe. Die Ilhéu do Farol kennt keine
      Landsäugetiere als Räuber und ist daher ein idealer Brutplatz. Auf Desembarcadouro erschweren Ratten das
      Nisten, doch existiert dort eine der größten Kolonien der [Mittelmeermöwe](/especie/larus_michahellis/)
      der Region. Das Gebiet ist als Important Bird Area ausgewiesen und beherbergt die bedeutendste Kolonie
      der Kaspimöwe auf Madeira.


      Unter den Landvögeln sind Kanarenpieper und Stieglitz häufig, bei den Greifvögeln Mäusebussard (Manta),
      Turmfalke und Schleiereule. Viele Zugvögel rasten hier, wobei der Regenbrachvogel zu den typischsten
      zählt. Es gibt 35 Arten von Landschnecken, davon 24 endemisch, und die Madeira-Eidechse ist ein
      allgegenwärtiges Wirbeltier.


      Unter Wasser bedecken Seegurken und Seeigel die felsigen Böden. Unter den Fischen stechen Geißbrasse,
      Mönchsfische und Papageifische hervor. In den Küstengewässern erscheinen Meeresschildkröten und
      verschiedene Meeressäuger wie Delfine und die berühmte Mittelmeer-Mönchsrobbe.
    visit: >-
      Der Hauptweg ist die Vereda da Ponta de São Lourenço. Sie beginnt an der Baía d'Abra, erreichbar über
      die Regionalstraße 109, und endet am Cais do Sardinha. Die Wanderung dauert etwa 2 Stunden über rund 4
      km, ist leicht begehbar und das ganze Jahr über empfehlenswert. Wenn du eine geführte Tour wünschst,
      kannst du eine Begleitung durch Parkpersonal anfordern.


      Am Ende des Weges am Cais do Sardinha steht das Besucherzentrum Casa do Sardinha mit einer
      Dauerausstellung zum Schutzgebiet. Es diente bis 2009 als Beobachtungs- und Wachposten.
      Umweltbildungsaktivitäten werden vom Informationszentrum Núcleo dos Dragoeiros das Neves koordiniert.
    history: >-
      Die Regionalregierung erwarb 1994 die Ilhéu do Desembarcadouro und die Spitze der Halbinsel bis zur
      Steinmauer an der Baía d'Abra. Die Casa do Sardinha ließ Manuel Bettencourt Sardinha nach dem Bau des
      Cais de Abra als Zufluchts- und Feriensitz errichten; 1996 verkaufte seine Enkelin das Anwesen an die
      Autonome Region Madeira unter der Bedingung, dass es dem Naturschutz dient.


      Die Ponta de São Lourenço ist ein Naturdenkmal des Denkmalnetzes von Madeira und Teil des
      Natura-2000-Netzes als besonderes Erhaltungsgebiet. Der Managementplan unterteilt das Gebiet in Zonen
      des Vollschutzes (die Eilande), des Teilschutzes (die Halbinsel) und ergänzende Zonen (Strände,
      Aussichtspunkte und die Piedade-Kapelle).
    before: >-
      Für Übernachtungen im Schutzgebiet ist eine vorherige Genehmigung des Instituto das Florestas e da
      Conservação da Natureza erforderlich. Der Eintritt in das Schutzgebiet ist für Besucher ab 12 Jahren
      kostenpflichtig; erkundige dich vorab bei der Verwaltung über die Bedingungen.
    around: >-
      Das [Reserva Natural da Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) liegt sechs Kilometer
      entfernt, der [Pico Ruivo y Macizo Central de
      Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) acht und die [Islas
      Desertas](/lugar/islas-desertas/) fünfzehn. Alle drei Landschaften teilen den vulkanischen Ursprung mit
      der Ponta de São Lourenço. Das Schutzgebiet ist dem übergeordneten [Parque Natural de la
      Madeira](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/) angegliedert.
  it:
    intro: >-
      Madeira si conclude con una penisola brulla. Arrivando a Ponta de São Lourenço gli alberi spariscono, in
      netto contrasto con il resto dell'isola: rimane una lama di nove chilometri di roccia vulcanica, erbe
      basse e vento che sfocia negli isolotti do Desembarcadouro e do Farol. La bassa vegetazione non è un
      caso, ma la conseguenza dell'aridità e dei venti di tramontana. Ed è stata la prima visione per i
      marinai portoghesi quando avvistarono l'isola nel 1419: il primissimo lembo di terra apparso
      all'orizzonte, battezzato con il nome della caravella del suo scopritore.
    landscape: >-
      La penisola è di origine vulcanica, costituita principalmente da basalto con alcuni sedimenti calcarei.
      Affiorano rocce piroclastiche e dicchi basaltici, e le formazioni risalgono al tardo Pleistocene, circa
      100.000 anni fa. Il punto più elevato è il Pico do Furado.


      Verso ovest, la Baía d'Abra, ampia e ottima come ancoraggio, segna l'inizio dell'itinerario. Oltre il
      porticciolo di Quinta do Lorde si trova la Prainha, una piccola spiaggia di sabbia scura dominata dal
      Morro da Piedade, un cono vulcanico con una cappella del sedicesimo secolo. A nord della Prainha si
      estendono le Dunas da Piedade, una duna fossile che racchiude testimonianze del Quaternario risalenti a
      300 mila anni fa, elementi unici in Europa con radici pietrificate.


      La vegetazione spontanea è formata da erbe annuali e biennali, rari cespugli e piccolissimi alberi
      eccezionali. Si contano circa 160 specie vegetali: 141 sulla penisola e 71 sull'isolotto do
      Desembarcadouro. Tra le più singolari spiccano estreleira, perpétua e vaqueira; crescono anche
      *Matthiola maderensis*, *Echium nervosum* e *Andryala glandulosa*. L'isolotto do Desembarcadouro
      rappresenta l'ultimo baluardo intatto della flora litoranea autoctona di Madeira, con fitte distese di
      trifoglio marino.
    wildlife: >-
      Gli uccelli marini sono i veri padroni del luogo. Nidificano protetti la berta maggiore, il petrello di
      Bulwer, l'uccello delle tempeste di Castro e la sterna comune. L'isolotto do Farol non ospita predatori
      terrestri ed è quindi un sito privilegiato di cova. Su Desembarcadouro la presenza di ratti rende la
      vita più dura, ma vi risiede una delle maggiori colonie di [Gabbiano reale](/especie/larus_michahellis/)
      dell'arcipelago. L'area è riconosciuta come Important Bird Area e ospita la più rilevante colonia di
      gabbiano del Caspio di Madeira.


      Tra gli uccelli terrestres sono abituali il calandro di Berthelot e il cardellino, e tra i rapaci la
      poiana comune (manta), il gheppio e il barbagianni. Molti uccelli migratori vi sostano, con il chiurlo
      piccolo tra i più tipici. Vi sono 35 specie di molluschi terrestri, di cui 24 endemiche, e la lucertola
      di Madeira è un vertebrato indigeno diffusissimo.


      Sott'acqua, i fondali rocciosi sono tappezzati da cetrioli e ricci di mare. Tra i pesci risaltano il
      sarago, le castagnole e il pesce pappagallo. In queste acque transitano tartarughe marine e diversi
      mammiferi marini come i delfini e l'emblematica foca monaca.
    visit: >-
      Il tracciato pedonale è la Vereda da Ponta de São Lourenço. Parte dalla Baía d'Abra, raggiungibile
      percorrendo la strada regionale 109, e si conclude al Cais do Sardinha. La camminata a piedi richiede
      circa 2 ore per coprire 4 km; è di facile accesso e consigliata tutto l'anno. Se cerchi una visita
      interpretativa, puoi concordarla con l'assistenza di una guida del parco.


      Alla fine del percorso, accanto al Cais do Sardinha, sorge il centro visitatori Casa do Sardinha, che
      ospita una mostra permanente sull'area protetta. Ha funzionato come postazione di avvistamento e guardia
      fino al 2009. I programmi didattici sono curati dal Centro Informativo del Núcleo dos Dragoeiros das
      Neves.
    history: >-
      Nel 1994 la regione acquistò l'isolotto do Desembarcadouro e la punta estrema della penisola fino al
      muro a secco della Baía d'Abra. La Casa do Sardinha fu edificata da Manuel Bettencourt Sardinha dopo
      aver realizzato il Cais de Abra, concepita come residenza estiva; nel 1996 la nipote la vendette alla
      Regione Autonoma di Madeira affinché contribuisse alla salvaguardia dei valori naturali del luogo.


      Ponta de São Lourenço è un Monumento Naturale della rete regionale di Madeira e rientra nella rete
      Natura 2000 come zona speciale di conservazione. Il piano di gestione distingue zone a protezione
      integrale (gli isolotti), parziale (la penisola) e complementare (spiagge, belvedere e la cappella della
      Piedade).
    before: >-
      Per pernottare nell'area protetta è necessario richiedere l'autorizzazione all'Instituto das Florestas e
      da Conservação da Natureza. L'accesso alla riserva prevede un biglietto d'ingresso per chi ha più di 12
      anni; verifica le condizioni con l'ente gestore prima della visita.
    around: >-
      La [Reserva Natural da Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) dista sei chilometri,
      il [Pico Ruivo y Macizo Central de Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/)
      otto e le [Islas Desertas](/lugar/islas-desertas/) quindici. Tutti e tre i territori appartengono allo
      stesso contesto vulcanico di Ponta de São Lourenço. L'area è compresa nel più ampio [Parque Natural de
      la Madeira](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/).
  pt:
    intro: >-
      A Madeira termina numa península despida. Ao chegar à Ponta de São Lourenço desaparecem as árvores, num
      forte contraste com o resto da ilha: resta um fio de nove quilómetros de rocha vulcânica, herbáceas e
      vento que culmina nos ilhéus do Desembarcadouro e do Farol. A vegetação rasteira não é um acaso, mas
      consequência da aridez e dos ventos de norte. E foi a primeira terra avistada pelos navegadores
      portugueses em 1419: a primeira porção de terra a surgir no horizonte, batizada com o nome da nau que
      transportava o seu descobridor.
    landscape: >-
      A península é de origem vulcânica, formada sobretudo por basalto com alguns sedimentos calcários.
      Abundam rochas piroclásticas e diques basálticos, e as suas formações datam do Plistocénico tardio, há
      cerca de 100.000 anos. O ponto mais elevado é o Pico do Furado.


      Para ocidente, a Baía d'Abra, de grande amplitude e excelentes condições de fundeio, marca o início do
      trilho. Para além da marina da Quinta do Lorde situa-se a Prainha, uma pequena enseada de areia escura
      coroada pelo Morro da Piedade, um cone vulcânico com uma capela do século XVI. A norte da Prainha
      estendem-se as Dunas da Piedade, um edifício dunar fóssil com registos do Quaternário de 300 mil anos,
      testemunhos ímpares na Europa com raízes fossilizadas.


      A vegetação natural é dominada por herbáceas anuais e bienais, alguns arbustos e raríssimas árvores
      anãs. Registam-se cerca de 160 espécies de plantas: 141 na península e 71 no ilhéu do Desembarcadouro.
      Entre as mais singulares destacam-se a estreleira, a perpétua e a vaqueira; medram também *Matthiola
      maderensis*, *Echium nervosum* e *Andryala glandulosa*. O ilhéu do Desembarcadouro é o último reduto de
      vegetação indígena do litoral da Madeira em bom estado, com vastos povoamentos de trevina.
    wildlife: >-
      As aves marinhas constituem a fauna mais visível. Nidificam sob proteção a cagarra, a alma-negra, o
      roque-de-castro e o garajau-comum. O ilhéu do Farol não possui predadores terrestres, sendo por isso um
      refúgio de eleição para a nidificação de aves marinhas. No Desembarcadouro, com a presença de ratos, a
      nidificação é mais difícil, mas abriga uma das maiores colónias de
      [gaivota-de-patas-amarelas](/especie/larus_michahellis/) do arquipélago. A zona está classificada como
      Área Importante para as Aves pelas suas colónias, com a maior colónia de gaivota-do-cáspio da Madeira.


      Entre as aves terrestres são frequentes o corre-caminhos e o pintassilgo, e entre as rapinas a manta, o
      francelho e a coruja-das-torres. Muitas outras aves migradoras frequentam a área, sendo o maçarico uma
      das mais representativas. Encontram-se 35 espécies de moluscos terrestres, 24 delas endémicas, e a
      lagartixa-da-madeira é um vertebrado nativo bastante abundante.


      Debaixo de água, os fundos rochosos estão povoados por pepinos e ouriços-do-mar. Entre os peixes
      destacam-se o sargo, as castanhetas e o bodião. Nestas águas ocorrem tartarugas e vários mamíferos
      marinhos, como golfinhos e o emblemático lobo-marinho, a foca-monge.
    visit: >-
      O percurso pedestre é a Vereda da Ponta de São Lourenço. Inicia-se na Baía d'Abra, com acesso pela
      estrada regional 109, e termina no Cais do Sardinha. O percurso a pé demora cerca de 2 horas ao longo de
      4 km; é de fácil progressão e aconselhável durante todo o ano. Quem pretender uma visita interpretativa
      pode solicitá-la com o acompanhamento de um técnico do parque.


      No fim do percurso, junto ao Cais do Sardinha, situa-se o Centro de Receção Casa do Sardinha, com uma
      exposição permanente sobre a área protegida. Serviu como posto de observação e vigilância até 2009. As
      ações de educação ambiental são coordenadas pelo Centro de Informação do Núcleo dos Dragoeiros das
      Neves.
    history: >-
      A Região adquiriu em 1994 o ilhéu do Desembarcadouro e o extremo da península até ao muro de pedra da
      Baía d'Abra. A Casa do Sardinha foi mandada edificar por Manuel Bettencourt Sardinha, após construir o
      Cais de Abra, como refúgio e casa de veraneio; em 1996 a sua neta vendeu-a à Região Autónoma da Madeira
      com a condição de ser afeta à conservação dos valores naturais do local.


      A Ponta de São Lourenço é um Monumento Natural da rede de monumentos naturais da Madeira e integra a
      Rede Natura 2000 como zona especial de conservação. O plano de gestão estabelece áreas de proteção total
      (os ilhéus), parcial (a península) e complementar (praias, miradouros e a capela da Piedade).
    before: >-
      Para pernoitar na área protegida é necessário solicitar autorização prévia ao Instituto das Florestas e
      da Conservação da Natureza. O acesso à área protegida está sujeito a pagamento para maiores de 12 anos;
      consulta a entidade gestora sobre as condições antes da visita.
    around: >-
      A [Reserva Natural da Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/) fica a seis
      quilómetros, o [Pico Ruivo y Macizo Central de
      Madeira](/lugar/pico-ruivo-e-macico-montanhoso-central-da-madeira/) a oito e as [Islas
      Desertas](/lugar/islas-desertas/) a quinze. Os três espaços partilham com a Ponta de São Lourenço a
      mesma matriz vulcânica da Madeira. A Ponta de São Lourenço encontra-se integrada no [Parque Natural de
      la Madeira](/lugar/parque-natural-da-madeira---floresta-de-laurissilva/).
