resumen:
  es: >-
    El oeste de la isla de Mljet: bosques mediterráneos de pino de Alepo y encina y dos lagos salados con un
    monasterio en una isla.
  en: >-
    The western end of the island of Mljet: Mediterranean forests of Aleppo pine and holm oak embracing two
    saltwater lakes with an island monastery.
  fr: >-
    L’extrémité ouest de l’île de Mljet : pinèdes d’Alep et chênaies vertes méditerranéennes enserrant deux
    lacs salés avec un monastère insulaire.
  de: >-
    Der Westen der Insel Mljet: mediterrane Wälder aus Aleppo-Kiefern und Steineichen, die zwei Salzwasserseen
    mit einem Inselkloster umschließen.
  it: >-
    L’estremità occidentale dell’isola di Mljet: foreste mediterranee di pino d’Aleppo e leccio che
    racchiudono due laghi salati con un monastero insulare.
  pt: >-
    O extremo ocidental da ilha de Mljet: bosques mediterrânicos de pinheiro-de-alepo e azinheira abraçando
    duas lagoas salgadas com um mosteiro insular.
unico:
  es: >-
    Dos lagos de agua salada, con un monasterio en una isla y la medusa Aurelia relicta, que no existe en
    ningún otro lugar del mundo.
  en: >-
    Two saltwater lakes, an island monastery, and the endemic jellyfish Aurelia relicta, which exists nowhere
    else on Earth.
  fr: >-
    Deux lacs d’eau salée, un monastère posé sur un îlot et la méduse endémique Aurelia relicta, qui n’existe
    nulle part ailleurs dans le monde.
  de: >-
    Zwei Salzwasserseen, ein Inselkloster und die endemische Qualle Aurelia relicta, die an keinem anderen Ort
    der Erde vorkommt.
  it: >-
    Due laghi d’acqua salata, un monastero su un isolotto e la medusa endemica Aurelia relicta, che non esiste
    in nessun altro luogo al mondo.
  pt: >-
    Duas lagoas de água salgada, um mosteiro num ilhéu e a alforreca endémica Aurelia relicta, que não existe
    em nenhum outro lugar do mundo.
observaciones:
  es: >-
    La pesca está totalmente prohibida en los lagos Grande y Pequeño y en el canal de Soline, y en los dos
    lagos no se permite bucear. Está prohibido acampar y moverse de noche por el bosque del parque. En verano
    hay mucha afluencia, con los catamaranes desde Dubrovnik.
texto:
  es:
    intro: >-
      Un lago que no es un lago. Los dos de Mljet, el Grande y el Pequeño, parecen aguas interiores rodeadas
      de pinar, pero son en realidad una bahía marina profunda que se formó cuando subió el nivel del mar tras
      la glaciación; antes fue una dolina kárstica. En medio del Grande hay un islote con un monasterio
      benedictino. Todo eso, y el bosque que baja hasta el agua, forma el Parque Nacional de Mljet, que ocupa
      casi 5300 hectáreas, con una franja marina de 500 metros desde la costa, y cubre aproximadamente un
      tercio de la isla.
    landscape: >-
      Casi todo el parque se asienta sobre caliza y dolomía, y el karst deja su huella: cuevas, semicuevas y
      simas, con una fauna endémica de invertebrados que lleva en algunos casos el nombre científico de Mljet,
      donde se hallaron por primera vez. El lago Grande tiene 145 hectáreas y hasta 46 metros de profundidad;
      el lago Pequeño, 24 hectáreas y hasta 29. Los dos son un fenómeno geológico y oceanográfico único en el
      karst. En el centro de la isla están las «blatine», lagunas salobres que a veces se secan y que son un
      hábitat importante a escala europea dentro de la red Natura 2000.


      El bosque lo domina el pino carrasco: alrededor de los lagos, de Goveđari y de la bahía de Pomena forma
      el bosque más bello y mejor conservado de su tipo en el Mediterráneo. El 90 % de la superficie del
      parque está cubierta de bosque. Entre las plantas endémicas de la isla están la dubrovačka zečina, la
      jupiterova brada y la drvenasta mlječika. El clima es mediterráneo, de veranos secos y cálidos e
      inviernos suaves; en verano sopla casi a diario el mistral, que hace llevadero el calor.
    wildlife: >-
      Lo más singular está bajo el agua. En los lagos hay muchos bivalvos: la vieira, el dátil de mar,
      protegido por ley, y la nacra Pinna nobilis, que sufre una mortandad masiva en todo el Mediterráneo.
      Solo en los lagos de Mljet vive la medusa endémica Aurelia relicta, que no se encuentra en ningún otro
      lugar del mundo y es inofensiva para los bañistas. Y en el lago Grande está el mayor arrecife del mundo
      de coral pétreo Cladocora caespitosa, sobre 650 m² y entre 5 y 18 metros de profundidad.


      En tierra, las aves son ricas y variadas, sobre todo en la migración; en primavera y verano se oye el
      ruiseñor. Entre las rapaces se ven cernícalo, gavilán, [abejero europeo](/especie/pernis_apivorus/) y
      [halcón peregrino](/especie/falco_peregrinus/), y entre las nocturnas, autillo, cárabo y [búho
      real](/especie/bubo_bubo/). Entre los mamíferos hay ratón, erizo, varias especies de murciélagos, lirón
      gris y garduña. Después de la Segunda Guerra Mundial se introdujeron en la isla la liebre y el gamo, y
      también el muflón y el [jabalí](/especie/sus_scrofa/). En la isla hay cuatro especies de serpientes y
      cuatro de lagartos, y las serpientes escasean desde que en 1910 se introdujo la mangosta india.


      Cada otoño se anillan aves como parte del seguimiento del parque; en la campaña más reciente se
      anillaron 604 aves de 13 especies, sobre todo currucas capirotadas y petirrojos.
    visit: >-
      Se llega en barco de línea desde Dubrovnik y desde Pelješac, y en barcos de excursión desde Korčula,
      Hvar y Split, que atracan sobre todo en Polače y Pomena. Solo se puede entrar por las entradas
      oficiales: Crna klada, Pomena y Polače. Una de las llegadas oficiales utiliza el ferri de Prapratno a
      Sobra.


      Hay tres maneras de recorrerlo. Desde Pomena es un paseo de 15 minutos hasta el lago Pequeño, 10 minutos
      más por el sendero que lo rodea, y de ahí barco solar desde el Puente Pequeño hasta el islote de Santa
      María. Desde Polače, una hora de sendero lleva al mirador de Montokuc, hay 30 minutos de bajada a Soline
      y 2,5 km junto al lago Grande hasta el Pristanište. Y desde el aparcamiento de Vrbovica, junto al lago
      Grande, se llega en 50 minutos al mirador de Montokuc. Desde Montokuc, o desde Veliki Sladin Gradac, las
      vistas abarcan todo el parque, Pelješac y el mar abierto hasta Korčula.


      La entrada incluye un viaje de ida y vuelta en barco solar al islote de Santa María. Se pueden descubrir
      playas y cuevas marinas en canoa, y recorrer el parque en bicicleta o a pie. El parque ofrece visitas
      guiadas interpretativas, también en bicicleta, en croata y en inglés; hay que pedirlas por escrito con
      antelación. Los meses más recomendables son mayo, junio, septiembre y octubre.
    history: >-
      La historia de Mljet llega al segundo milenio antes de Cristo, cuando se asentaron los ilirios del
      pueblo de los ardieos. Los romanos construyeron en la isla el tercer palacio más grande del Adriático,
      tras la Arena de Pula y el palacio de Diocleciano en Split.


      El monasterio benedictino del islote de Santa María se levantó entre 1177 y 1198, primero el monasterio
      y luego la iglesia; es el lugar más visitado del parque. En el Puente Grande, los benedictinos
      levantaron un molino movido por la corriente del canal; el puente se derribó en 1958 y se reconstruyó en
      2016. Con la monarquía austrohúngara se llevaron doce mangostas de Viena para acabar con las serpientes
      venenosas, y se lanzó el proyecto Naturschutzpark Meleda para proteger los lagos y el bosque.


      El parque se proclamó el 11 de noviembre de 1960. Mljet fue el primer área marina protegida de Croacia,
      y el científico Branimir Gušić ayudó mucho a su estatus especial de protección.
    before: >-
      La pesca está totalmente prohibida en los lagos Grande y Pequeño y en el canal de Soline, y en los dos
      lagos no se permite bucear. Está prohibido acampar y moverse de noche por el bosque del parque. En
      verano hay mucha afluencia, con los catamaranes desde Dubrovnik.
    around: >-
      [Park prirode Lastovsko otočje](/lugar/park-prirode-lastovsko-otocje/) está a 15 km. [Nacionalni park
      Kornati](/lugar/nacionalni-park-kornati/) comparte la posidonia y el halcón peregrino.
  en:
    intro: >-
      A lake that is not truly a lake. The two saltwater basins of Mljet, Veliko Jezero (Big Lake) and Malo
      Jezero (Small Lake), appear as tranquil inland waters embraced by pine woods, yet they are in fact a
      deep marine flooded depression formed when sea levels rose after the last Ice Age, occupying former
      karst sinkholes. In the middle of the Big Lake sits an islet crowned by a Romanesque Benedictine
      monastery. All this, alongside emerald woodlands spilling directly into the salt waters, forms Mljet
      National Park, spanning almost 5300 hectares, including a marine coastal belt extending 500 metres out
      to sea, encompassing roughly one-third of the island.
    landscape: >-
      Virtually the entire park rests upon Cretaceous limestone and dolomite, where karst erosion has left an
      extensive subterranean legacy: sea caves, grottos, and deep sinkholes inhabited by endemic cave fauna,
      several named scientifically after Mljet where they were first discovered. Veliko Jezero spans 145
      hectares and reaches depths of up to 46 metres; Malo Jezero covers 24 hectares with depths up to 29
      metres. Both constitute an extraordinary geological and oceanographical phenomenon within the Adriatic
      karst. In the interior lie the "blatine", brackish marsh pools that occasionally dry out in summer,
      representing an important Natura 2000 wetland habitat across Europe.


      Dense woodland is dominated by Aleppo pine: around the saltwater lakes, Goveđari, and Pomena bay, it
      forms the finest and most intact old-growth Aleppo pine forest in the Mediterranean basin. Forests
      blanket 90 % of the national park’s territory. Endemic coastal flora includes the Dubrovnik knapweed
      (dubrovačka zečina), Jupiter’s beard, and tree spurge. The climate is Mediterranean, marked by hot, dry
      summers and mild, rainy winters; in summer the maestral breeze blows almost daily, tempering midday
      heat.
    wildlife: >-
      The most extraordinary treasures lie beneath the waterline. The saltwater lakes shelter dense
      populations of bivalves: noble scallops, date mussels (strictly protected by law), and the noble pen
      shell (Pinna nobilis), which suffers mass mortality across the wider Mediterranean. Exclusively within
      the lakes of Mljet lives the endemic jellyfish Aurelia relicta, found nowhere else on the planet and
      harmless to swimmers. Furthermore, Veliko Jezero harbours the world’s largest bank of the colonial stony
      coral Cladocora caespitosa, sprawling over 650 m² at depths between 5 and 18 metres.


      On land, birdlife is diverse, especially during seasonal migrations; in spring and summer common
      nightingales sing through the woodlands. Raptors include common kestrel, Eurasian sparrowhawk, [European
      honey buzzard](/especie/pernis_apivorus/), and [peregrine falcon](/especie/falco_peregrinus/), alongside
      nocturnal owls such as Scops owl, tawny owl, and [Eurasian eagle-owl](/especie/bubo_bubo/). Terrestrial
      mammals include wood mouse, hedgehog, numerous bat species, edible dormouse, and stone marten. Following
      the Second World War, European hare and fallow deer were introduced to the island, alongside mouflon and
      [wild boar](/especie/sus_scrofa/). Four snake species and four lizard species inhabit the island, with
      snakes becoming very scarce following the introduction of the small Indian mongoose in 1910.


      Each autumn bird banding campaigns monitor avian migration across the park; during the most recent
      ringing effort, researchers ringed 604 individual birds belonging to 13 species, predominantly blackcaps
      and European robins.
    visit: >-
      Access is by scheduled passenger ferries from Dubrovnik and the Pelješac peninsula, and by day-trip
      excursion catamarans from Korčula, Hvar, and Split, which dock primarily at Polače and Pomena. Entry
      into the national park is permitted solely through official entry points: Crna Klada, Pomena, and
      Polače. A primary road connection links via the car ferry from Prapratno to Sobra.


      There are three main routes to explore the lakes. From Pomena, an easy stroll of 15 minutes reaches the
      Small Lake, followed by 10 minutes along the lakeside path to board the solar-powered boat at the Small
      Bridge across to Saint Mary’s Islet. From Polače, a one-hour path climbs to the Montokuc viewpoint,
      descending in 30 minutes to Soline before continuing 2.5 km along the Big Lake to Pristanište. From the
      Vrbovica car park by the Big Lake, a hike of 50 minutes reaches Montokuc. From Montokuc or Veliki Sladin
      Gradac, commanding vistas take in the entire park, the Pelješac channel, and open sea towards Korčula.


      The park admission ticket includes a return ride aboard the solar-powered boat to the Islet of Saint
      Mary. Kayaks and mountain bikes can be rented to explore sheltered sea coves and tracks. The park offers
      guided educational tours, also by bicycle, in Croatian and English upon advance written request. The
      most rewarding months for visiting are May, June, September, and October.
    history: >-
      Human habitation on Mljet dates back to the second millennium BC, when Illyrian Ardiaean tribes settled
      the island. During the Roman era, administrators built the third-largest Roman palace on the eastern
      Adriatic coast at Polače, surpassed in size only by the Pula Arena and Diocletian’s Palace in Split.


      The Benedictine monastery on the Islet of Saint Mary was erected between 1177 and 1198, beginning with
      the monastic cloister followed by the church of Saint Mary; it remains the most iconic sight in the
      park. At the Big Bridge, monks constructed a tidal mill powered by channel currents; the historic bridge
      was dismantled in 1958 and rebuilt in 2016. Under the Austro-Hungarian Empire, twelve Indian mongooses
      were brought from Vienna to eradicate venomous snakes, and the historic Naturschutzpark Meleda
      conservation initiative was proposed to protect the lakes and surrounding woodlands.


      The national park was officially proclaimed on 11 November 1960. Mljet became the first marine protected
      area in Croatia, following tireless scientific advocacy led by Academician Branimir Gušić.
    before: >-
      All fishing is strictly prohibited within Veliko and Malo Jezero and the Soline channel, and scuba
      diving is forbidden in both saltwater lakes. Wild camping and walking off trails through park woodlands
      at night are outlawed. Summer brings heavy visitor traffic from Dubrovnik catamarans.
    around: >-
      [Lastovo Islands Nature Park](/lugar/park-prirode-lastovsko-otocje/) lies 15 km away. [Kornati National
      Park](/lugar/nacionalni-park-kornati/) shares posidonia meadows and peregrine falcons with Mljet.
  fr:
    intro: >-
      Un lac qui n’en est pas un. Les deux plans d’eau de Mljet, le Grand Lac et le Petit Lac, ressemblent à
      des eaux intérieures bordées de pinèdes, mais ce sont en vérité de profondes dépressions marines nées de
      la remontée des océans après la dernière glaciation, occupant d’anciens gouffres karstiques. Au centre
      du Grand Lac se dresse un îlot couronné par un monastère bénédictin. Tout cela, complété par une forêt
      plongeant dans les flots salés, forme le parc national de Mljet, qui couvre près de 5300 hectares, avec
      une bande marine littorale de 500 mètres s’étendant au large, occupant environ un tiers de l’île.
    landscape: >-
      La quasi-totalité du parc repose sur des calcaires et des dolomies, où le karst a creusé grottes
      marines, gouffres et avens abritant une faune cavernicole endémique, portant parfois le nom scientifique
      de Mljet où elle fut identifiée. Le Grand Lac s’étend sur 145 hectares et atteint jusqu’à 46 mètres de
      profondeur ; le Petit Lac couvre 24 hectares pour une profondeur allant jusqu’à 29 mètres. Tous deux
      composent un phénomène géologique et océanographique unique dans le karst adriatique. Au cœur de l’île
      reposent les « blatine », des dépressions d’eaux saumâtres qui s’assèchent parfois en été et forment un
      habitat d’intérêt communautaire au sein du réseau Natura 2000.


      La forêt est dominée par le pin d’Alep : autour des lacs, de Goveđari et de la baie de Pomena, elle
      constitue la pinède ancienne la plus belle et la mieux préservée de Méditerranée. Le manteau forestier
      recouvre 90 % de la superficie du parc. Parmi les plantes endémiques figurent la centaurée de Dubrovnik
      (dubrovačka zečina), la barbe de Jupiter et l’euphorbe arborescente. Le climat est méditerranéen, avec
      des étés chauds et secs et des hivers tempérés ; en été, le mistral souffle presque quotidiennement,
      adoucissant la chaleur.
    wildlife: >-
      Les plus remarquables curiosités se trouvent sous l’eau. Les lacs hébergent de denses populations de
      mollusques bivalves : pétoncles, dattes de mer (strictement protégées) et grandes nacres Pinna nobilis,
      espèce frappée par une mortalité de masse en Méditerranée. Dans les seuls lacs de Mljet survit la méduse
      endémique Aurelia relicta, introuvable ailleurs sur Terre et parfaitement inoffensive pour les
      baigneurs. Enfin, le Grand Lac recèle le plus vaste récif au monde du corail colonial Cladocora
      caespitosa, s’étalant sur 650 m² entre 5 et 18 mètres de profondeur.


      À terre, l’avifaune est riche et diversifiée, en particulier lors des passages migratoires ; au
      printemps et en été retentit le chant du rossignol philomèle. Parmi les rapaces se rencontrent le faucon
      crécerelle, l’épervier d’Europe, la [bondrée apivore](/especie/pernis_apivorus/) et le [faucon
      pèlerin](/especie/falco_peregrinus/), ainsi que des nocturnes comme le petit-duc scops, la chouette
      hulotte et le [grand-duc d’Europe](/especie/bubo_bubo/). Côté mammifères vivent mulots, hérissons,
      plusieurs espèces de chauves-souris, loirs gris et martres. Après la Seconde Guerre mondiale ont été
      introduits le lièvre d’Europe, le daim, le mouflon et le [sanglier](/especie/sus_scrofa/). L’île abrite
      quatre espèces de serpents et quatre de lézards, les serpents s’étant considérablement raréfiés depuis
      l’introduction de la mangouste indienne en 1910.


      Chaque automne, des opérations de baguage permettent de suivre les migrateurs ; lors de la dernière
      campagne, 604 oiseaux de 13 espèces ont été bagués, surtout des fauvettes à tête noire et des
      rouges-gorges.
    visit: >-
      On y accède par des liaisons maritimes régulières depuis Dubrovnik et la presqu’île de Pelješac, ou par
      des catamarans touristiques depuis Korčula, Hvar et Split, accostant à Polače et Pomena. L’accès n’est
      autorisé que par les portes officielles : Crna Klada, Pomena et Polače. Une arrivée routière emprunte le
      bac de Prapratno à Sobra.


      Trois cheminements majeurs s’offrent à vous. Depuis Pomena, une promenade de 15 minutes rejoint le Petit
      Lac, prolongée de 10 minutes sur le sentier circulaire pour emprunter le bateau solaire au Petit Pont
      vers l’îlot Sainte-Marie. Depuis Polače, une heure de marche conduit au belvédère de Montokuc, suivie de
      30 minutes de descente vers Soline et 2,5 km longeant le Grand Lac jusqu’à Pristanište. Du parking de
      Vrbovica, au bord du Grand Lac, on gagne Montokuc en 50 minutes. Depuis Montokuc ou Veliki Sladin
      Gradac, les panoramas embrassent tout le parc, Pelješac et la mer jusqu’à Korčula.


      Le billet d’entrée comprend l’aller-retour en bateau solaire vers l’îlot Sainte-Marie. On peut explorer
      criques et grottes marines en kayak, ou parcourir les pistes à vélo ou à pied. Le parc propose des
      visites guidées d’interprétation, y compris à vélo, en croate et en anglais sur demande écrite
      préalable. Les mois les plus conseillés sont mai, juin, septembre et octobre.
    history: >-
      L’occupation humaine de Mljet remonte au deuxième millénaire avant notre ère, avec l’installation des
      tribus illyriennes des Ardiéens. Sous l’Antiquité romaine, les magistrats édifièrent à Polače le
      troisième plus vaste palais romain de l’Adriatique, après les arènes de Pula et le palais de Dioclétien
      à Split.


      Le monastère bénédictin de l’îlot Sainte-Marie fut bâti entre 1177 et 1198, d’abord le couvent puis
      l’église ; c’est le site historique le plus fréquenté du parc. Au Grand Pont, les moines construisirent
      un moulin actionné par les courants marins ; le pont fut démoli en 1958 et reconstruit en 2016. Sous
      l’Empire austro-hongrois, douze mangoustes furent apportées de Vienne pour éliminer les vipères, et le
      projet Naturschutzpark Meleda fut lancé pour préserver les lacs et la forêt.


      Le parc fut proclamé le 11 novembre 1960. Mljet devint la première aire marine protégée de Croatie,
      grâce aux travaux et à l’engagement du professeur Branimir Gušić.
    before: >-
      La pêche est totalement interdite dans le Grand Lac, le Petit Lac et le canal de Soline, et la plongée
      en scaphandre est prohibée dans les deux lacs. Le camping sauvage et la circulation nocturne en forêt
      sont interdits. En été, l’affluence est très soutenue avec les navettes maritimes depuis Dubrovnik.
    around: >-
      Le [Parc Naturel de l’Archipel de Lastovo](/lugar/park-prirode-lastovsko-otocje/) se trouve à 15 km. Le
      [Parc national de Kornati](/lugar/nacionalni-park-kornati/) partage la posidonie et le faucon pèlerin
      avec Mljet.
  de:
    intro: >-
      Ein See, der eigentlich gar kein See ist. Die beiden Gewässer von Mljet, der Große See und der Kleine
      See, wirken wie von Kiefernwäldern umrahmte Binnenseen, sind jedoch in Wahrheit tief eingeschnittene
      Meeresbuchten, die sich nach dem Anstieg des Meeresspiegels am Ende der Eiszeit in einstigen
      Karstdolinen bildeten. Mitten im Großen See liegt ein Eiland mit einem Benediktinerkloster. All dies,
      zusammen mit dem Wald, der bis ans Wasser reicht, bildet den Mljet-Nationalpark, der fast 5300 Hektar
      umfasst, einschließlich eines 500 Meter breiten Küstenmeeresstreifens, und etwa ein Drittel der Insel
      einnimmt.
    landscape: >-
      Fast der gesamte Park ruht auf Kalkstein und Dolomit, und der Karst hinterließ Höhlen, Halbhöhlen und
      Schlucklöcher mit einer endemischen Höhlenfauna, die teilweise nach Mljet benannt ist, wo sie erstmals
      entdeckt wurde. Der Große See bedeckt 145 Hektar und erreicht bis zu 46 Meter Tiefe; der Kleine See
      umfasst 24 Hektar bei Tiefen bis zu 29 Metern. Beide stellen ein einzigartiges geologisches und
      ozeanographisches Phänomen im Karst dar. Im Inselinneren liegen die „Blatine“, periodisch austrocknende
      Brackwasserlagunen, die im europäischen Natura-2000-Netzwerk einen bedeutenden Lebensraum bilden.


      Der Wald wird von der Aleppo-Kiefer beherrscht: Rund um die Seen, bei Goveđari und der Bucht von Pomena
      bildet sie die prächtigsten und besterhaltenen Bestände ihrer Art im gesamten Mittelmeerraum. Wald
      bedeckt 90 % der Parkfläche. Zu den endemischen Pflanzen zählen die Dubrovnik-Flockenblume (dubrovačka
      zečina), Jupitersbart und die Baum-Wolfsmilch. Das Klima ist mediterran mit heißen, trockenen Sommern
      und milden Wintern; im Sommer weht fast täglich der Mistral, der die Hitze erträglich macht.
    wildlife: >-
      Das Außergewöhnlichste verbirgt sich unter Wasser. In den Seen leben dichte Muschelbestände:
      Kammmuscheln, die gesetzlich geschützte Steindattel und die Edle Steckmuschel Pinna nobilis, die im
      gesamten Mittelmeer unter Massensterben leidet. Nur in den Seen von Mljet lebt die endemische Qualle
      Aurelia relicta, die weltweit nirgendwo sonst vorkommt und für Badende völlig harmlos ist. Im Großen See
      befindet sich zudem das weltweit größte Riff der Steinkoralle Cladocora caespitosa, das sich über 650 m²
      in Tiefen zwischen 5 und 18 Metern erstreckt.


      An Land ist die Vogelwelt artenreich, besonders zur Zugzeit; im Frühjahr und Sommer singt die
      Nachtigall. Zu den Greifvögeln zählen Turmfalke, Sperber, [Wespenbussard](/especie/pernis_apivorus/) und
      [Wanderfalke](/especie/falco_peregrinus/), zu den Eulen Zwergohreule, Waldkauz und
      [Uhu](/especie/bubo_bubo/). An Säugetieren kommen Waldmaus, Igel, mehrere Fledermausarten,
      Siebenschläfer und Steinmarder vor. Nach dem Zweiten Weltkrieg wurden Feldhase und Damhirsch eingeführt,
      ebenso Mufflon und [Wildschwein](/especie/sus_scrofa/). Auf der Insel leben vier Schlangenarten und vier
      Eidechsenarten, wobei Schlangen seit der Einführung des Kleinen Mungos im Jahr 1910 selten geworden
      sind.


      Jeden Herbst werden im Rahmen des Parkmonitorings Vögel beringt; bei der jüngsten Beringungsaktion
      wurden 604 Vögel aus 13 Arten beringt, vor allem Mönchsgrasmücken und Rotkehlchen.
    visit: >-
      Die Anreise erfolgt mit Linienfähren ab Dubrovnik und Pelješac sowie mit Ausflugsschiffen ab Korčula,
      Hvar und Split, die vor allem in Polače und Pomena anlegen. Der Zugang ist nur über die offiziellen
      Parkeingänge gestattet: Crna Klada, Pomena und Polače. Eine Zufahrt nutzt die Autofähre von Prapratno
      nach Sobra.


      Es gibt drei Hauptwege: Von Pomena führt ein Spaziergang von 15 Minuten zum Kleinen See, 10 Minuten
      weiter entlang des Ufers zum Solarboot an der Kleinen Brücke zur Marieninsel. Von Polače führt ein
      einstündiger Pfad zum Aussichtspunkt Montokuc, gefolgt von 30 Minuten Abstieg nach Soline und 2,5 km am
      Ufer des Großen Sees nach Pristanište. Vom Parkplatz Vrbovica am Großen See erreicht man in 50 Minuten
      den Montokuc. Von Montokuc oder Veliki Sladin Gradac reicht der Blick über den gesamten Park, Pelješac
      und das offene Meer bis nach Korčula.


      Im Eintrittspreis ist die Hin- und Rückfahrt mit dem Solarboot zur Marieninsel enthalten. Strände und
      Meereshöhlen lassen sich per Kajak erkunden, und Wege laden zum Radfahren oder Wandern ein. Der Park
      bietet Führungen, auch per Fahrrad, auf Kroatisch und Englisch nach vorheriger schriftlicher Anfrage an.
      Empfehlenswerte Monate sind Mai, Juni, September und Oktober.
    history: >-
      Die Besiedlung Mljets reicht bis ins zweite Jahrtausend vor Christus zurück, als illyrische Stämme der
      Ardiäer die Insel besiedelten. In römischer Zeit errichteten Verwalter in Polače den drittgrößten
      römischen Palast an der östlichen Adria nach der Arena von Pula und dem Diokletianspalast in Split.


      Das Benediktinerkloster auf der Marieninsel entstand zwischen 1177 und 1198, zuerst das Kloster, dann
      die Kirche; es ist das meistbesuchte Baudenkmal des Parks. An der Großen Brücke bauten die Mönche eine
      durch Gezeitenströmung angetriebene Mühle; die Brücke wurde 1958 abgetragen und 2016 originalgetreu
      wiedererrichtet. Unter der Donaumonarchie wurden zwölf Mungos aus Wien eingeführt, um Giftschlangen zu
      tilgen, und das Projekt Naturschutzpark Meleda wurde initiiert.


      Der Park wurde am 11. November 1960 feierlich ausgerufen. Mljet war das erste Meeresschutzgebiet
      Kroatiens, maßgeblich gefördert durch den Wissenschaftler Branimir Gušić.
    before: >-
      Fischfang ist im Großen und Kleinen See sowie im Soline-Kanal streng untersagt, und in beiden Seen ist
      Gerätetauchen verboten. Wildes Campen und nächtliche Wanderungen durch die Wälder des Parks sind
      untersagt. Im Sommer herrscht reger Besucherandrang durch Katamarane ab Dubrovnik.
    around: >-
      Der [Naturpark Lastovo-Archipel](/lugar/park-prirode-lastovsko-otocje/) liegt 15 km entfernt. Der
      [Kornati-Nationalpark](/lugar/nacionalni-park-kornati/) teilt Neptungras und Wanderfalken mit Mljet.
  it:
    intro: >-
      Un lago che in realtà non è un lago. I due bacini salati di Mljet, il Lago Grande e il Lago Piccolo,
      sembrano acque interne cinte da pinete, ma sono in verità profonde insenature marine generatesi con la
      risalita del mare dopo l’ultima glaciazione all’interno di doline carsiche. Nel mezzo del Lago Grande
      sorge un isolotto sormontato da un monastero benedettino. Tutto questo, assieme alla foresta che si
      tuffa nelle acque salmastre, compone il Parco Nazionale di Mljet, che copre quasi 5300 ettari, con una
      fascia marina costiera di 500 metri al largo, estendendosi per circa un terzo dell’isola.
    landscape: >-
      La quasi totalità del parco poggia su calcari e dolomie, dove il carsismo ha scavato grotte marine e
      abissi abitati da invertebrati troglobi endemici, talvolta battezzati scientificamente con il nome di
      Mljet dove vennero rinvenuti per la prima volta. Il Lago Grande si estende per 145 ettari toccando i 46
      metri di profondità; il Lago Piccolo copre 24 ettari con profondità fino a 29 metri. Entrambi
      costituiscono un fenomeno geologico e oceanografico straordinario nel carsismo adriatico.
      Nell’entroterra si trovano le «blatine», specchi d’acqua salmastra temporanei considerati habitat
      prioritari d’interesse comunitario nella rete Natura 2000.


      Il manto boschivo è dominato dal pino d’Aleppo: attorno ai laghi, a Goveđari e alla baia di Pomena dà
      vita alla pineta più spettacolare e integra del bacino mediterraneo. La foresta copre il 90 % del parco.
      Tra le piante endemiche spiccano il fiordaliso di Ragusa (dubrovačka zečina), la barba di Giove e
      l’euforbia arborea. Il clima è mediterraneo, con estati asciutte e calde e inverni miti; in estate spira
      quasi ogni giorno il maestrale, che rende piacevole la temperatura.
    wildlife: >-
      Il patrimonio più straordinario si cela sott’acqua. Nei laghi proliferano densi banchi di molluschi
      bivalvi: pettini, datteri di mare (rigorosamente protetti) e la nacchera Pinna nobilis, duramente
      colpita da mortalità di massa nel Mediterraneo. Solo nelle acque dei laghi di Mljet dimora la medusa
      endemica Aurelia relicta, assente in qualsiasi altro bacino del globo e del tutto innocua per i
      bagnanti. Nel Lago Grande si estende inoltre la più grande biocostruzione al mondo della madrepora
      coloniale Cladocora caespitosa, estesa su 650 m² tra i 5 e i 18 metri di profondità.


      A terra l’avifauna è varia e abbondante, soprattutto durante le migrazioni; in primavera e in estate
      risuona il canto delusignolo comune. Tra i rapaci compaiono il gheppio, lo sparviere, il [falco
      pecchiaiolo](/especie/pernis_apivorus/) e il [falco pellegrino](/especie/falco_peregrinus/), con rapaci
      notturni quali assiolo, allocco e [gufo reale](/especie/bubo_bubo/). Tra i mammiferi vivono topo
      selvatico, riccio, pipistrelli, ghiro e faina. Nel dopoguerra furono introdotti la lepre comune e il
      daino, nonché il muflone e il [cinghiale](/especie/sus_scrofa/). Sull’isola si contano quattro specie di
      serpenti e quattro di sauri, con i serpenti divenuti assai rari da quando nel 1910 venne introdotta la
      mangusta indiana.


      Ogni autunno vengono svolte campagne di inanellamento; nella sessione più recente sono stati inanellati
      604 esemplari appartenenti a 13 specie, in larga parte capinere e pettirossi.
    visit: >-
      Si arriva con traghetti di linea da Dubrovnik e dalla penisola di Pelješac, o con motonavi turistiche da
      Korčula, Hvar e Split, che approdano a Polače e Pomena. L’ingresso è consentito solo dai varchi
      ufficiali: Crna Klada, Pomena e Polače. Un accesso stradale impiega il traghetto da Prapratno a Sobra.


      Ci sono tre itinerari principali. Da Pomena una passeggiata di 15 minuti porta al Lago Piccolo,
      proseguendo per 10 minuti lungo la sponda per salire a bordo del battello solare al Ponte Piccolo verso
      l’isolotto di Santa Maria. Da Polače, un’ora di cammino sale al punto panoramico di Montokuc, con 30
      minuti di discesa verso Soline e 2,5 km a bordo del Lago Grande fino a Pristanište. Dal parcheggio di
      Vrbovica, presso il Lago Grande, si giunge a Montokuc in 50 minuti. Da Montokuc o da Veliki Sladin
      Gradac il panorama abbraccia l’intero parco, Pelješac e il mare aperto fino a Korčula.


      Il biglietto include la traversata di andata e ritorno in battello solare verso l’isolotto di Santa
      Maria. Si possono noleggiare kayak per scoprire calette marine o percorrere i sentieri a piedi e in
      bicicletta. Il parco organizza visite guidate anche su due ruote in croato e in inglese previa richiesta
      scritta. I mesi migliori per la visita sono maggio, giugno, settembre e ottobre.
    history: >-
      La presenza umana su Mljet risale al secondo millennio a.C., quando vi si insediarono gli Illiri Ardiei.
      In epoca romana fu costruito a Polače il terzo palazzo romano più grande dell’Adriatico, dopo l’Arena di
      Pola e il palazzo di Diocleziano a Spalato.


      Il complesso benedettino dell’isolotto di Santa Maria sorse tra il 1177 e il 1198, prima il monastero e
      poi la chiesa; è il monumento più celebre del parco. Presso il Ponte Grande i monaci costruirono un
      mulino azionato dalla corrente di marea; il ponte fu demolito nel 1958 e ricostruito nel 2016. Sotto
      l’Impero austro-ungarico vennero introdotte dodici manguste da Vienna per debellare le vipere velenose,
      e fu avviato il progetto Naturschutzpark Meleda.


      Il parco venne proclamato l’11 novembre 1960. Mljet fu la prima area marina protetta della Croazia,
      grazie all’impegno scientifico dell’accademico Branimir Gušić.
    before: >-
      La pesca è rigorosamente vietata nel Lago Grande, nel Lago Piccolo e nel canale di Soline, e nei due
      laghi non è consentito immergersi con le bombole. È vietato campeggiare liberamente e camminare di notte
      nei boschi del parco. In estate l’affluenza è sostenuta a causa dei catamarani da Dubrovnik.
    around: >-
      Il [Parco Naturale dell’Arcipelago di Lastovo](/lugar/park-prirode-lastovsko-otocje/) dista 15 km. Il
      [Parco Nazionale delle Incoronate](/lugar/nacionalni-park-kornati/) condivide praterie di posidonia e
      falchi pellegrini con Mljet.
  pt:
    intro: >-
      Um lago que não é verdadeiramente um lago. Os dois espelhos de água salgada de Mljet, o Lago Grande e o
      Lago Pequeno, assemelham-se a albufeiras interiores orladas de pinhais, mas são na realidade uma baía
      marinha profunda formada pela subida do nível do mar após a última glaciação em antigas dolinas
      cársticas. No centro do Lago Grande ergue-se um ilhéu coroado por um mosteiro beneditino. Tudo isto, em
      conjunto com o bosque que desce até à água salgada, compõe o Parque Nacional de Mljet, abrangendo quase
      5300 hectares, com uma faixa marítima de 500 metros a partir da costa, cobrindo cerca de um terço da
      ilha.
    landscape: >-
      Quase todo o parque assenta sobre calcários e dolomitos, onde o relevo cárstico deixou cavernas
      marinhas, algares e grutas povoadas por invertebrados troglóbios endémicos, alguns dos quais batizados
      com o nome científico de Mljet onde foram identificados pela primeira vez. O Lago Grande estende-se por
      145 hectares e atinge 46 metros de profundidade; o Lago Pequeno tem 24 hectares e atinge 29 metros de
      profundidade. Ambos constituem um fenómeno geológico e oceanográfico ímpar no carso adriático. No
      interior da ilha repousam as «blatine», lagoas salobras temporárias que representam um habitat de
      conservação prioritário na rede Natura 2000.


      A floresta é dominada pelo pinheiro-de-alepo: ao redor dos lagos, de Goveđari e da baía de Pomena forma
      o pinhal antigo mais admirável e bem preservado da bacia mediterrânica. A floresta cobre 90 % da área do
      parque nacional. Entre a flora endémica contam-se a centáurea-de-dubrovnik (dubrovačka zečina), a
      barba-de-júpiter e a eufórbia-arbórea. O clima é mediterrânico com verões quentes e secos e invernos
      amenos; no verão sopra diariamente o maestral, amenizando o calor.
    wildlife: >-
      O património mais excecional reside debaixo de água. Nas lagoas proliferam bivalves: vieiras,
      tâmaras-do-mar (rigorosamente protegidas por lei) e a grande-nacra Pinna nobilis, que enfrenta
      mortalidade em massa no Mediterrâneo. Exclusivamente nas águas de Mljet habita a alforreca endémica
      Aurelia relicta, que não existe em mais nenhum recanto do globo e é inofensiva para os banhistas. No
      Lago Grande localiza-se ainda o maior recife mundial do coral-pedregoso colonial Cladocora caespitosa,
      estendendo-se por 650 m² entre os 5 e os 18 metros de profundidade.


      Em terra, a avifauna é diversa, com relevo durante a migração; na primavera e verão escuta-se o
      rouxinol-comum. Entre as aves de rapina contam-se o francelho, o gavião-da-europa, o
      [tartaranhão-apívoro](/especie/pernis_apivorus/) e o [falcão-peregrino](/especie/falco_peregrinus/), a
      par de aves noturnas como o mocho-d’orelhas, a coruja-do-mato e o [bufo-real](/especie/bubo_bubo/). Nos
      mamíferos encontram-se o rato-do-campo, o ouriço, morcegos, o arganaz e a fuinha. No pós-guerra
      introduziram-se a lebre e o gamo, bem como o muflão e o [javali](/especie/sus_scrofa/). Na ilha residem
      quatro espécies de cobras e quatro de lagartos, tendo as serpentes rarefeito desde a introdução do
      mangusto-indiano em 1910.


      Em cada outono realizam-se campanhas de anilhagem; na mais recente foram anilhadas 604 aves de 13
      espécies, sobretudo toutinegras-de-barrete-preto e pisco-de-peito-ruivo.
    visit: >-
      Chega-se em barcos de carreira a partir de Dubrovnik e da península de Pelješac, ou através de catamarãs
      de excursão a partir de Korčula, Hvar e Split, que atracam sobretudo em Polače e Pomena. O acesso faz-se
      apenas pelas entradas oficiais: Crna Klada, Pomena e Polače. Uma das ligações rodoviárias recorre ao
      ferry de Prapratno para Sobra.


      Existem três formas clássicas de explorar a área. A partir de Pomena é um passeio de 15 minutos até ao
      Lago Pequeno, prolongando-se por 10 minutos junto à margem para apanhar o barco solar na Ponte Pequena
      até ao ilhéu de Santa Maria. A partir de Polače, uma hora de caminhada ascende ao miradouro de Montokuc,
      com 30 minutos de descida até Soline e 2,5 km junto ao Lago Grande até Pristanište. Do parque de
      estacionamento de Vrbovica, junto ao Lago Grande, alcança-se Montokuc em 50 minutos. Do Montokuc ou de
      Veliki Sladin Gradac as vistas descortinam todo o parque, Pelješac e o mar aberto até Korčula.


      O bilhete de ingresso inclui a travessia de ida e volta em barco solar até ao ilhéu de Santa Maria.
      Podem alugar-se caiaques para descobrir enseadas e grutas marinhas, ou percorrer as pistas de bicicleta
      ou a pé. O parque organiza visitas guiadas temáticas, incluindo de bicicleta, em croata e em inglês
      mediante marcação prévia. Os meses mais indicados são maio, junho, setembro e outubro.
    history: >-
      A ocupação de Mljet remonta ao segundo milénio a.C., com a fixação das tribos ilírias dos ardieus. Na
      época romana ergueu-se em Polače o terceiro maior palácio romano do mar Adriático, apenas superado pela
      Arena de Pula e pelo palácio de Diocleciano em Split.


      O mosteiro beneditino do ilhéu de Santa Maria foi erigido entre 1177 e 1198, primeiro o mosteiro e
      depois a igreja; é o ponto histórico mais concorrido do parque. Na Ponte Grande os monges construíram um
      moinho impulsionado pelas correntes de maré; a ponte foi demolida em 1958 e reconstruída em 2016. Sob a
      monarquia austro-húngara trouxeram-se doze mangustos de Viena para erradicar as víboras venenosas, e
      impulsionou-se o projeto Naturschutzpark Meleda.


      O parque foi formalmente instituído em 11 de novembro de 1960. Mljet foi a primeira área marinha
      protegida da Croácia, fruto da liderança científica do académico Branimir Gušić.
    before: >-
      A pesca é rigorosamente proibida no Lago Grande, no Lago Pequeno e no canal de Soline, e em ambas as
      lagoas não é consentido mergulho com garrafa. É proibido acampar e circular de noite nos bosques do
      parque. No verão regista-se afluência considerável devido aos catamarãs oriundos de Dubrovnik.
    around: >-
      O [Parque Natural do Arquipélago de Lastovo](/lugar/park-prirode-lastovsko-otocje/) situa-se a 15 km. O
      [Parque Nacional de Kornati](/lugar/nacionalni-park-kornati/) partilha pradarias de posidónia e
      falcões-peregrinos com Mljet.
