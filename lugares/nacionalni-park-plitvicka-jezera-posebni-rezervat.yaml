resumen:
  es: >-
    Reserva forestal estricta no intervenida con abetos y hayas centenarias contigua a las famosas cascadas de
    Plitvice.
  en: >-
    Untouched strict forest reserve of ancient beech and fir woodlands adjacent to Plitvice’s famous
    waterfalls.
  fr: >-
    Réserve forestière intégrale non exploitée de hêtres et de sapins séculaires jouxtant les célèbres
    cascades de Plitvice.
  de: >-
    Ungenutztes Totalreservat mit jahrhundertealten Buchen und Tannen direkt neben den berühmten Wasserfällen
    von Plitvice.
  it: >-
    Riserva forestale integrale non gestita con faggi e abeti secolari a ridosso delle celebri cascate di
    Plitvice.
  pt: >-
    Reserva florestal estrita não intervencionada com faias e abetos centenários contígua às célebres cascatas
    de Plitvice.
unico:
  es: Un bosque donde los ciclos naturales se miden en siglos y cada árbol caído es parte del paisaje.
  en: >-
    A primeval forest where natural rhythms are measured in centuries and every fallen trunk shapes the
    understorey landscape.
  fr: >-
    Une forêt primaire où les cycles naturels se mesurent en siècles et où chaque tronc abattu nourrit le
    sous-bois.
  de: >-
    Ein Urwald, in dem Naturzyklen in Jahrhunderten gemessen werden und jeder umgestürzte Stamm den Waldboden
    prägt.
  it: >-
    Una foresta primaria in cui i cicli naturali si contano in secoli e ogni albero caduto plasma il suolo
    forestale.
  pt: Uma mata virgem onde os ciclos naturais se medem em séculos e cada tronco tombado molda o coberto vegetal.
observaciones:
  es: >-
    Hay que ir por senderos marcados y no salirse de ellos. En el parque está prohibido hacer fuego, acampar,
    ir en bicicleta, molestar a los animales y llevar perros sueltos. En los senderos de montaña, el parque
    aconseja hablar lo bastante alto para que los animales te oigan y se aparten, no salir con previsión de
    mal tiempo, no ir solo y llevarte la basura.


    El mejor momento para el bosque va de junio a septiembre.
texto:
  es:
    intro: >-
      Cada vez que cae un árbol en Čorkova Uvala, nadie lo retira. Se queda en el suelo, abre un claro, y
      alrededor empieza otra generación. Así lleva siglos funcionando este bosque de 84 hectáreas, en el
      noroeste del Parque Nacional de los Lagos de Plitvice: un hayedo-abetal antiguo, entre 860 y 1.028
      metros de altitud, donde conviven árboles de todas las edades y alturas y se dan a la vez todas las
      fases de la vida de un bosque.


      Es una reserva estricta, y esa palabra importa. Las famosas cascadas del parque quedan al lado; aquí se
      viene a ver lo que pasa cuando nadie interviene.
    landscape: >-
      El Čorkova Uvala se considera un bosque antiguo secundario: se desarrolló con muy poco impacto humano, o
      sin él. Eso se nota en la estructura. No hay una masa uniforme de troncos iguales, sino un mosaico en
      parches, con árboles de distinta altura, grosor y edad, claros y mucha madera muerta. Los cambios
      afectan a las proporciones entre especies y a las capas del bosque, y tardan siglos en completarse.


      Domina el haya, con el abeto como compañero. Dentro del bosque hay un abeto plateado de más de
      quinientos años, 58 metros de altura y 150 centímetros de diámetro, y también hayas y píceas de tamaño
      imponente. En esta zona hay hayas y abetos de hasta setecientos años.


      El contexto lo explica. El parque ocupa las laderas más meridionales de Mala Kapela, entre 369 y 1.279
      metros, con un clima húmedo y templado, de unos 1.550 milímetros de lluvia al año, justo el que le gusta
      al haya. Los bosques cubren buena parte del territorio y están tan bien conservados que casi se
      consideran vírgenes.
    wildlife: >-
      Un bosque así es, antes que nada, un refugio para quienes necesitan tranquilidad. Los grandes carnívoros
      del parque, el [oso pardo](/especie/ursus_arctos/), el [lobo](/especie/canis_lupus/), el
      [lince](/especie/lynx_lynx/) y la [nutria](/especie/lutra_lutra/), prefieren lugares apartados con
      presas y refugio donde criar; el lince es el más exigente. También viven corzos, ciervos y gatos
      monteses.


      Lo que más se oye, sin embargo, son las aves. Entre los árboles centenarios cantan pájaros carpinteros y
      aves canoras, y el parque ha registrado nueve especies de pájaros carpinteros, doce de rapaces y ocho de
      búhos. Las más numerosas son el [ratonero común](/especie/buteo_buteo/), el [cárabo
      uralense](/especie/strix_uralensis/) y el cárabo común. El [pico
      tridáctilo](/especie/picoides_tridactylus/), el [pico dorsiblanco](/especie/dendrocopos_leucotos/) y el
      [mochuelo chico](/especie/glaucidium_passerinum/) crían en número suficiente para que el parque cuente
      en la red Natura como zona de aves. En los roquedos de los lagos inferiores anidan el [halcón
      peregrino](/especie/falco_peregrinus/) y el [búho real](/especie/bubo_bubo/), y junto a los arroyos se
      ve y se oye el [mirlo acuático](/especie/cinclus_cinclus/).


      La madera muerta tiene también su fauna: el escarabajo ermitaño y la [rosalía
      alpina](/especie/rosalia_alpina/), un longicornio, viven en el parque. Y en los prados del sur, fuera
      del bosque, cantan entre cuarenta y sesenta machos de [guion de codornices](/especie/crex_crex/).
    visit: >-
      La reserva no se recorre por libre. El inicio o el final de ruta en Čorkova Uvala solo es posible para
      grupos organizados, con transporte del parque y acompañados por un guardabosques.


      Lo que sí se puede hacer es acercarse por los senderos del entorno. La ruta de Čorkova Uvala (21 km)
      parte de Labudovac, va hacia Čorkova Uvala y regresa por Preka Kosa hasta el embarcadero P3; el parque
      recomienda llegar a Labudovac en el tren panorámico. Una opción más corta es la ruta Plitvica, de 9 km,
      que une Labudovac con el Gran Salto y el embarcadero P3 siguiendo el arroyo Plitvica. A lo largo de los
      itinerarios, paneles explican los hábitats de fauna y los lugares históricos y culturales.


      Para una salida de menos de una jornada, el sendero número 1 de Medveđak arranca en el aparcamiento
      Hladovina, en la entrada 2, y dura unas dos horas y media. El número 2 sube suavemente por terreno
      kárstico hasta Turčić.
    history: >-
      El Parque Nacional de los Lagos de Plitvice se proclamó el 8 de abril de 1949, el primero de Croacia, y
      en 1997 se ampliaron sus límites; hoy ocupa algo menos de trescientos kilómetros cuadrados. El estudio
      de la zona viene de lejos: los primeros estudios, de 1850, midieron la profundidad de los lagos y
      abordaron la geología, y el profesor Ivo Pevalek descubrió que musgos y algas son clave en la formación
      de las barreras de toba. La estación científica que lleva su nombre, abierta en 1975 en Mukinje,
      continuó ese trabajo.


      Dentro de ese esquema, Čorkova Uvala tiene un papel concreto: es un lugar de referencia para valorar si
      la gestión forestal funciona.
    before: >-
      Hay que ir por senderos marcados y no salirse de ellos. En el parque está prohibido hacer fuego,
      acampar, ir en bicicleta, molestar a los animales y llevar perros sueltos. En los senderos de montaña,
      el parque aconseja hablar lo bastante alto para que los animales te oigan y se aparten, no salir con
      previsión de mal tiempo, no ir solo y llevarte la basura.


      El mejor momento para el bosque va de junio a septiembre.
    around: >-
      A unos veintiún kilómetros está el [Parque Nacional Una - Curso Alto y
      Cascadas](/lugar/nacionalni-park-una---gorji-tok/). Muy lejos de aquí hay otros bosques antiguos con los
      que Čorkova Uvala comparte el pico tridáctilo, el lince y el oso: la [Reserva Estricta de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/), el [Bosque Virgen de
      Boubín](/lugar/boubinsky-prales/) y el [Parque Nacional de
      Skuleskogen](/lugar/skuleskogen-national-park/).
  en:
    intro: >-
      Whenever a veteran tree falls in Čorkova Uvala, no one removes it. The trunk remains on the forest
      floor, opening a sunlit canopy gap where the next woodland generation immediately sprouts. For
      centuries, this natural cycle has governed this 84-hectare reserve in the north-western sector of
      Plitvice Lakes National Park: an old-growth beech and fir forest situated between 860 and 1,028 metres
      in altitude, where trees of all ages and dimensions coexist simultaneously across every stage of forest
      dynamics.


      It is classified as a strict nature reserve, and that designation is fundamental. The park’s famous
      cascading lakes lie just beyond the ridge; visitors come here to witness what forest wilderness looks
      like when human intervention is entirely absent.
    landscape: >-
      Čorkova Uvala is regarded as a secondary primeval forest: it developed with minimal or zero direct human
      disturbance over centuries. That undisturbed lineage is visible in its structural complexity. Rather
      than an even-aged plantation, the forest forms an intricate mosaic of dense stands, light-filled gaps,
      massive rotting logs, and multi-layered canopies. Ecological shifts in species dominance unfold at a
      glacial pace, requiring centuries to run their natural course.


      European beech dominates the canopy, intimately intertwined with silver fir. Deep within the core stands
      an ancient silver fir over five hundred years old, measuring 58 metres in height and 150 centimetres in
      diameter, alongside monumental beeches and Norway spruces. Veteran trees in this sheltered valley reach
      ages of up to seven hundred years.


      The broader geographic setting explains this resilience. The national park occupies the southern slopes
      of the Mala Kapela range, spanning altitudes between 369 and 1,279 metres under a temperate, humid
      climate receiving roughly 1,550 millimetres of annual rainfall—ideal conditions for montane beech. These
      ancient forests cover much of the upper basin, preserved in near-virgin condition.
    wildlife: >-
      An undisturbed forest of this calibre is, above all, a vital haven for species demanding deep
      wilderness. The park’s apex carnivores—the [brown bear](/especie/ursus_arctos/), [grey
      wolf](/especie/canis_lupus/), [Eurasian lynx](/especie/lynx_lynx/), and [Eurasian
      otter](/especie/lutra_lutra/)—require expansive, secluded territories with abundant prey and undisturbed
      dens; the lynx is the most sensitive to human presence. Roe deer, red deer, and European wildcats also
      inhabit the woods.


      Birdsong, however, forms the dominant soundtrack. Woodpeckers and forest passerines forage among veteran
      snags; the park has recorded nine woodpecker species, twelve raptor species, and eight species of owls.
      The most abundant are the [common buzzard](/especie/buteo_buteo/), [Ural
      owl](/especie/strix_uralensis/), and tawny owl. The [three-toed
      woodpecker](/especie/picoides_tridactylus/), [white-backed woodpecker](/especie/dendrocopos_leucotos/),
      and [Eurasian pygmy-owl](/especie/glaucidium_passerinum/) breed in densities sufficient to qualify the
      park as a Natura Special Protection Area for birds. Along lower lake gorges nest [peregrine
      falcons](/especie/falco_peregrinus/) and [Eurasian eagle-owls](/especie/bubo_bubo/), while the
      [white-throated dipper](/especie/cinclus_cinclus/) frequents crystal cascades.


      Coarse woody debris sustains rare saproxylic insects, including the hermit beetle and the magnificent
      [Rosalia longicorn](/especie/rosalia_alpina/). In open meadows south of the forest, between forty and
      sixty calling male [corncrakes](/especie/crex_crex/) take up seasonal territory.
    visit: >-
      The strict core of the reserve cannot be explored independently. Access to Čorkova Uvala itself is
      permitted exclusively to organised groups accompanied by an official park ranger using designated park
      transit.


      Hikers, however, can skirt the edge of the wilderness on peripheral trails. The waymarked Čorkova Uvala
      route (21 km) sets out from Labudovac, approaches the forest margin, and returns via Preka Kosa to boat
      landing P3; the park advises taking the panoramic shuttle train to reach Labudovac. A shorter
      alternative is the 9 km Plitvica trail, connecting Labudovac to the Great Waterfall and boat landing P3
      along the Plitvica stream. Explanatory panels along these routes describe wildlife habitats, karst
      geomorphology, and cultural history.


      For a half-day excursion, trail number 1 on Medveđak starts at the Hladovina car park at entrance 2,
      taking about two and a half hours. Trail number 2 climbs gently over karst limestone to the Turčić
      viewpoint.
    history: >-
      Plitvice Lakes National Park was proclaimed on 8 April 1949 as Croatia’s first national park, with its
      boundaries expanded in 1997 to encompass just under three hundred square kilometres. Scientific
      investigation dates back to 1850, when surveyors first charted lake bathymetry and underlying geology.
      Later, Professor Ivo Pevalek established that aquatic mosses and algae are fundamental in precipitating
      tufa barriers. The scientific research station bearing his name, opened in 1975 at Mukinje, continues
      this legacy.


      Within this framework, Čorkova Uvala plays a vital scientific role as an unmanaged baseline control to
      evaluate the sustainability of regional forestry practices.
    before: >-
      Stay strictly on marked paths and never venture off-trail. Lighting fires, camping, cycling, disturbing
      wildlife, and walking off-leash dogs are strictly prohibited across the park. On upland forest paths,
      park authorities advise walking in small groups, speaking loud enough for bears to detect your presence,
      avoiding hikes during forecast storms, and packing out all litter.


      The optimal season for visiting the forest extends from June to September.
    around: >-
      Roughly twenty-one kilometres away lies [Una National Park - Upper Course and
      Waterfalls](/lugar/nacionalni-park-una---gorji-tok/). Farther across Europe, other primeval woodlands
      share old-growth biodiversity like three-toed woodpeckers, lynx, and brown bears: the [Białowieża Strict
      Reserve](/lugar/bialowieski-park-narodowy---rezerwat-scisly/), [Boubín Primeval
      Forest](/lugar/boubinsky-prales/), and [Skuleskogen National Park](/lugar/skuleskogen-national-park/).
  fr:
    intro: >-
      Chaque fois qu’un arbre s’effondre à Čorkova Uvala, nul ne le déplace. Il reste au sol, ouvre une
      clairière lumineuse et la génération suivante s’y enracine aussitôt. Ce cycle naturel fonctionne ainsi
      depuis des siècles sur ces 84 hectares du nord-ouest du parc national des lacs de Plitvice : une
      hêtraie-sapinière ancienne, entre 860 et 1 028 mètres d’altitude, où cohabitent tous les âges et toutes
      les strates d’un écosystème forestier accompli.


      C’est une réserve intégrale, au sens le plus strict. Les cascades réputées du parc scintillent à
      proximité immédiate ; on vient ici contempler la dynamique spontanée d’une forêt laissée à elle-même.
    landscape: >-
      Le massif de Čorkova Uvala est considéré comme une forêt ancienne secondaire : il a évolué sans
      exploitation sylvicole notable. Sa structure témoigne de cette intégrité. Loin d’un peuplement uniforme,
      c’est une mosaïque complexe mêlant troncs monumentaux, trouées de lumière, chicots dressés et bois mort
      au sol. L’équilibre des essences s’y ajuste sur des temps séculaires.


      Le hêtre domine, associé au sapin pectiné. Au cœur de la réserve s’élève un sapin blanc de plus de cinq
      cents ans, haut de 58 mètres pour 150 centimètres de diamètre, côtoyant des hêtres et épicéas
      gigantesques. Certains arbres de ce vallon protégé atteignent sept cents ans.


      La géographie éclaire cette luxuriance. Le parc occupe les versants méridionaux de la Mala Kapela, entre
      369 et 1 279 mètres d’altitude, sous un climat tempéré humide recevant près de 1 550 millimètres de
      pluie par an, idéal pour le hêtre. La forêt couvre la majorité du bassin versant dans un état proche de
      la virginité.
    wildlife: >-
      Un tel massif constitue un sanctuaire pour la grande faune sensible au dérangement. Les prédateurs
      emblématiques du parc, [l’ours brun](/especie/ursus_arctos/), le [loup gris](/especie/canis_lupus/), le
      [lynx boréal](/especie/lynx_lynx/) et la [loutre d’Europe](/especie/lutra_lutra/), y trouvent calme,
      proies et tanières ; le lynx demeure le plus farouche. Chevreuils, cerfs et chats forestiers parcourent
      également les sous-bois.


      Les oiseaux animent la canopée. Les pics et passereaux forestiers profitent des vieux arbres ; le parc
      recense neuf espèces de pics, douze de rapaces diurnes et huit de rapaces nocturnes. Les plus répandus
      sont la [buse variable](/especie/buteo_buteo/), la [chouette de l’Oural](/especie/strix_uralensis/) et
      la chouette hulotte. Le [pic tridactyle](/especie/picoides_tridactylus/), le [pic à dos
      blanc](/especie/dendrocopos_leucotos/) et la [chevêchette d’Europe](/especie/glaucidium_passerinum/) y
      nichent en densités remarquables justifiant le classement en zone Natura pour les oiseaux. Sur les
      falaises des lacs inférieurs nichent le [faucon pèlerin](/especie/falco_peregrinus/) et le [grand-duc
      d’Europe](/especie/bubo_bubo/), tandis que le [cincle plongeur](/especie/cinclus_cinclus/) pêche dans
      les cascades.


      Le bois mort abrite le pique-prune et la magnifique [rosalie des Alpes](/especie/rosalia_alpina/). Dans
      les prairies humides au sud de la forêt chantent entre quarante et soixante mâles de [râle des
      genêts](/especie/crex_crex/).
    visit: >-
      La réserve intégrale ne se visite pas en accès libre. L’accès à Čorkova Uvala est strictement réservé
      aux visites guidées accompagnées par un garde du parc avec transport officiel.


      Il est toutefois possible d’en approcher les lisières par les sentiers de randonnée. Le circuit balisé
      de Čorkova Uvala (21 km) part de Labudovac, longe la réserve et revient par Preka Kosa jusqu’à
      l’embarcadère P3 ; le parc conseille d’emprunter le train panoramique pour rejoindre Labudovac. Une
      alternative plus courte est le sentier Plitvica de 9 km, reliant Labudovac à la Grande Cascade et à
      l’embarcadère P3 le long du ruisseau. Des pupitres didactiques jalonnent ces itinéraires.


      Pour une sortie de quelques heures, le sentier numéro 1 de Medveđak part du parking Hladovina à l’entrée
      2 et dure deux heures et demie. Le sentier numéro 2 monte doucement à travers le relief karstique
      jusqu’au sommet de Turčić.
    history: >-
      Le parc national des lacs de Plitvice a été proclamé le 8 avril 1949, premier de Croatie, et agrandi en
      1997 pour atteindre un peu moins de trois cents kilomètres carrés. Les premières recherches
      scientifiques datent de 1850 pour mesurer les profondeurs lacustres et la géologie. Le professeur Ivo
      Pevalek démontra ensuite le rôle fondamental des mousses et algues dans l’édification des barrières de
      tuf. La station de recherche ouverte à Mukinje en 1975 poursuit ces travaux.


      Dans ce cadre, Čorkova Uvala sert de témoin écologique absolu pour évaluer la gestion forestière
      régionale.
    before: >-
      Restez impérativement sur les sentiers balisés. Il est interdit d’allumer du feu, de camper, de circuler
      à vélo, de déranger la faune et de laisser les chiens sans laisse. Sur les sentiers forestiers, le parc
      conseille de marcher en groupe, de parler pour signaler sa présence aux ours, d’éviter les jours d’orage
      et de remporter ses déchets.


      La meilleure saison pour visiter la forêt s’étend de juin à septembre.
    around: >-
      À vingt et un kilomètres se trouve le [parc national de l’Una - cours supérieur et
      cascades](/lugar/nacionalni-park-una---gorji-tok/). Plus loin, d’autres forêts anciennes partagent cette
      faune de pic tridactyle, d’ours et de lynx : la [réserve intégrale de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/), la [forêt vierge de
      Boubín](/lugar/boubinsky-prales/) et le [parc national de
      Skuleskogen](/lugar/skuleskogen-national-park/).
  de:
    intro: >-
      Fällt in Čorkova Uvala ein alter Baum um, räumt ihn niemand weg. Er bleibt am Boden liegen, reißt eine
      Lichtlücke ins Blätterdach und ringsum beginnt die nächste Baumgeneration. Seit Jahrhunderten
      funktioniert dieses 84 Hektar große Schutzgebiet im Nordwesten des Nationalparks Plitvicer Seen so: ein
      uralter Buchen-Tannen-Wald zwischen 860 und 1.028 Metern Meereshöhe, in dem Bäume aller Altersstufen und
      Wuchshöhen nebeneinander stehen.


      Es handelt sich um ein Totalreservat im strengsten Sinne. Die weltberühmten Kaskaden des Parks liegen
      direkt nebenan; hierher kommt man, um zu erleben, wie echter Urwald ohne menschliche Eingriffe gedeiht.
    landscape: >-
      Čorkova Uvala gilt als sekundärer Urwald: Er wuchs über Jahrhunderte ohne nennenswerte forstliche
      Eingriffe heran. Das zeigt sich in der heterogenen Struktur. Statt gleichförmiger Stangenhölzer herrscht
      ein Mosaik aus dicken Stämmen, Lichtungen, Totholzriesen und mehrschichtigen Kronen. Natürliche
      Verschiebungen im Artgefüge vollziehen sich über Jahrhunderte.


      Die Rotbuche dominiert, eng vergesellschaftet mit der Weißtanne. Mitten im Urwald steht eine über
      fünfhundert Jahre alte Tanne von 58 Metern Höhe und 150 Zentimetern Stammdurchmesser, umgeben von
      mächtigen Buchen und Fichten. Einzelne Urwaldbäume erreichen in dieser geschützten Mulde ein Alter von
      bis zu siebenhundert Jahren.


      Die Lage begünstigt diesen Waldreichtum. Der Nationalpark erstreckt sich an den Südhängen der Mala
      Kapela zwischen 369 und 1.279 Metern Meereshöhe in einem feucht-gemäßigten Bergklima mit rund 1.550
      Millimetern Jahresniederschlag—ideale Bedingungen für Buchenwälder. Dichte Wälder bedecken den Großteil
      des Parks und sind nahezu unberührt.
    wildlife: >-
      Ein solcher Urwald ist vor allem eine Zuflucht für störungsempfindliche Wildtiere. Die großen
      Beutegreifer des Parks—[Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/), [Eurasischer
      Luchs](/especie/lynx_lynx/) und [Fischotter](/especie/lutra_lutra/)—bevorzugen abgelegene Reviere mit
      Deckung für die Jungenaufzucht; der Luchs reagiert am empfindlichsten. Auch Rehe, Hirsche und Wildkatzen
      streifen durch die Bestände.


      Akustisch dominieren die Vögel. In den Althölzern hämmern Spechte und singen Waldvögel; neun
      Spechtarten, zwölf Greifvogelarten und acht Eulenarten wurden im Nationalpark nachgewiesen. Am
      häufigsten sind [Mäusebussard](/especie/buteo_buteo/), [Habichtskauz](/especie/strix_uralensis/) und
      Waldkauz. [Dreizehenspecht](/especie/picoides_tridactylus/),
      [Weißrückenspecht](/especie/dendrocopos_leucotos/) und [Sperlingskauz](/especie/glaucidium_passerinum/)
      brüten in so dichten Beständen, dass der Park als Natura-Vogelschutzgebiet ausgewiesen wurde. An den
      Felswänden der unteren Seen nisten [Wanderfalke](/especie/falco_peregrinus/) und
      [Uhu](/especie/bubo_bubo/), an den Wildbächen jagt die [Wasseramsel](/especie/cinclus_cinclus/).


      Das Totholz birgt Totholzkäfer wie den Eremiten und den prächtigen
      [Alpenbock](/especie/rosalia_alpina/). Auf den Waldwiesen im Süden rufen zwischen vierzig und sechzig
      Männchen des [Wachtelkönigs](/especie/crex_crex/).
    visit: >-
      Das Kernreservat ist für Individualbesucher gesperrt. Der Zugang nach Čorkova Uvala ist nur im Rahmen
      geführter Touren mit Nationalpark-Rangern und parkeigenem Shuttle gestattet.


      Auf markierten Randwegen lässt sich der Urwald jedoch umwandern. Die Čorkova-Uvala-Wanderroute (21 km)
      startet an der Station Labudovac, nähert sich dem Reservat und führt über Preka Kosa zum Bootsanleger P3
      zurück; der Panoramazug bringt Wanderer bequem nach Labudovac. Eine kürzere Variante ist der 9 km lange
      Plitvica-Weg, der Labudovac am Bach entlang mit dem Großen Wasserfall und dem Anleger P3 verbindet.
      Schautafeln erläutern Lebensräume und Geschichte.


      Für Halbtagestouren bietet sich der Wanderweg Nummer 1 am Medveđak an: Start am Parkplatz Hladovina bei
      Eingang 2, Dauer etwa zweieinhalb Stunden. Der Weg Nummer 2 steigt sanft zum Aussichtspunkt Turčić auf.
    history: >-
      Der Nationalpark Plitvicer Seen wurde am 8. April 1949 als erster Nationalpark Kroatiens gegründet und
      1997 auf knapp dreihundert Quadratkilometer erweitert. Erste hydrologische und geologische Messungen
      begannen bereits 1850. Später wies Professor Ivo Pevalek die entscheidende Rolle von Wassermoosen und
      Algen bei der Entstehung der Travertinbarrieren nach. Die 1975 in Mukinje eröffnete Forschungsstation
      setzt diese Arbeiten fort.


      Čorkova Uvala dient in diesem Gefüge als forstliche Referenzfläche, um natürliche Prozesse mit
      bewirtschafteten Wäldern zu vergleichen.
    before: >-
      Bleibe strikt auf den markierten Wanderwegen. Offenes Feuer, Zelten, Radfahren, Störung der Tierwelt und
      unangeleinte Hunde sind streng verboten. Auf einsamen Waldpfaden rät die Parkwacht, sich durch Sprechen
      bemerkbar zu machen, Unwetter zu meiden, nicht alleine zu wandern und Müll wieder mitzunehmen.


      Die beste Zeit für Waldwanderungen reicht von Juni bis September.
    around: >-
      Rund einundzwanzig Kilometer entfernt liegt der [Nationalpark Una - Oberlauf und
      Wasserfälle](/lugar/nacionalni-park-una---gorji-tok/). Weiter entfernt teilen Urwälder wie das
      [Totalreservat Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/), der [Urwald
      Boubín](/lugar/boubinsky-prales/) und der [Nationalpark Skuleskogen](/lugar/skuleskogen-national-park/)
      Specht-, Luchs- und Bärenvorkommen mit Plitvice.
  it:
    intro: >-
      Ogni volta che un albero si schianta a Čorkova Uvala, nessuno interviene a rimuoverlo. Resta sul
      terreno, apre una radura illuminata e tutt’attorno nasce una nuova generazione di piante. Funziona così
      da secoli in questa riserva di 84 ettari nel settore nord-occidentale del Parco Nazionale dei Laghi di
      Plitvice: una faggeta-abetaia vetusta, tra gli 860 e i 1.028 metri di quota, dove alberi di ogni
      dimensione convivono in tutte le fasi della vita del bosco.


      È una riserva integrale a tutti gli effetti. Le rinomate cascate del parco scorrono a poca distanza; qui
      si viene per osservare cosa accade quando l’uomo lascia campo libero alla natura.
    landscape: >-
      Čorkova Uvala è considerata una foresta primaria secondaria: si è sviluppata senza tagli selvicolturali
      né interferenze umane. Questa integrità è evidente nella struttura forestale. Nessuna fustaia uniforme,
      bensì un mosaico articolato di colossi arborei, chiarirure erbose, tronchi morti a terra e chiome
      stratificate. I mutamenti biologici richiedono secoli per compiersi.


      Il faggio domina la volta, accompagnato dall’abete bianco. Nel cuore della riserva vegeta un abete
      bianco di oltre cinquecento anni, alto 58 metri per 150 centimetri di diametro, affiancato da faggi e
      abeti rossi monumentali. Alcuni alberi in questa conca riparata toccano i settecento anni di età.


      Il contesto geografico spiega tale rigoglio. Il parco sorge sui versanti meridionali della Mala Kapela,
      tra 369 e 1.279 metri di altitudine, con un clima montano umido che riceve circa 1.550 millimetri di
      pioggia all’anno, ottimale per il faggio. Le foreste ricoprono gran parte del comprensorio in condizioni
      quasi vergini.
    wildlife: >-
      Un bosco vetusto è innanzitutto un rifugio per la fauna più schiva. I grandi predatori del parco—[l’orso
      bruno](/especie/ursus_arctos/), il [lupo](/especie/canis_lupus/), la [lince
      eurasiatica](/especie/lynx_lynx/) e la [lontra europea](/especie/lutra_lutra/)—esigono ampi territori
      tranquilli per riprodursi; la lince è la specie più esigente. Nei boschi dimorano anche caprioli, cervi
      e gatti selvatici.


      L’avifauna è particolarmente sonora. Nelle chiome cantano picchi e passeriformi; sono censite nove
      specie di picchi, dodici di rapaci diurni e otto di rapaci notturni. I più diffusi sono la
      [poiana](/especie/buteo_buteo/), [l’allocco degli Urali](/especie/strix_uralensis/) e l’allocco comune.
      Il [picchio tridattilo](/especie/picoides_tridactylus/), il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/) e il [civettino nano](/especie/glaucidium_passerinum/)
      nidificano con densità tali da qualificare l’area come ZPS della rete Natura per gli uccelli. Sulle rupi
      dei laghi inferiori nidificano il [falco pellegrino](/especie/falco_peregrinus/) e il [gufo
      reale](/especie/bubo_bubo/), mentre lungo le acque scorre il [merlo
      acquaiolo](/especie/cinclus_cinclus/).


      Il legno marcescente accoglie coleotteri rari come l’osmoderma eremita e la magnifica [rosalia
      alpina](/especie/rosalia_alpina/). Nelle praterie a sud della foresta cantano tra quaranta e sessanta
      maschi di [re di quaglie](/especie/crex_crex/).
    visit: >-
      Il cuore della riserva non è accessibile liberamente. L’ingresso a Čorkova Uvala è consentito soltanto a
      visite guidate organizzate dal parco con guardiaparco e mezzi ufficiali.


      È però possibile percorrere i sentieri perimetrali. Il tracciato di Čorkova Uvala (21 km) parte da
      Labudovac, costeggia la foresta e torna per Preka Kosa all’imbarcadero P3; si consiglia di salire a
      Labudovac con il trenino panoramico. L’alternativa più breve è il sentiero Plitvica di 9 km, che collega
      Labudovac alla Grande Cascata e all’imbarcadero P3 costeggiando il torrente. Lungo le vie, pannelli
      illustrano geologia, flora e fauna.


      Per un’escursione di mezza giornata, il sentiero numero 1 del Medveđak parte dal parcheggio Hladovina
      all’ingresso 2 e richiede due ore e mezza. Il sentiero numero 2 risale tra doline carsiche fino al colle
      Turčić.
    history: >-
      Il Parco Nazionale dei Laghi di Plitvice fu istituito l’8 aprile 1949, il primo della Croazia, ed esteso
      nel 1997 fino a raggiungere poco meno di trecento chilometri quadrati. Le prime indagini geologiche e
      batimetriche risalgono al 1850. In seguito il professor Ivo Pevalek dimostrò il ruolo essenziale di
      muschi e alghe nella genesi delle barriere di tufo. Il centro di ricerca a lui intitolato, fondato nel
      1975 a Mukinje, prosegue gli studi limnologici.


      In questo sistema, Čorkova Uvala funge da area di controllo per valutare la sostenibilità dei boschi
      produttivi circostanti.
    before: >-
      Resta rigorosamente sui sentieri tracciati. Nel parco è vietato accendere fuochi, campeggiare, usare
      biciclette, disturbare la fauna e lasciare i cani slegati. Sui percorsi di montagna il parco consiglia
      di camminare in gruppo parlando ad alta voce per avvertire gli orsi, non partire con temporali e
      riportare a valle i rifiuti.


      I mesi ideali per le escursioni nella foresta vanno da giugno a settembre.
    around: >-
      A circa ventuno chilometri si trova il [Parco Nazionale Una - Corso Superiore e
      Cascate](/lugar/nacionalni-park-una---gorji-tok/). Altre grandi foreste primarie europee che condividono
      con Čorkova Uvala la presenza di picchio tridattilo, lince e orso bruno sono la [Riserva Integrale di
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/), la [Foresta Vergine di
      Boubín](/lugar/boubinsky-prales/) e il [Parco Nazionale Skuleskogen](/lugar/skuleskogen-national-park/).
  pt:
    intro: >-
      Sempre que uma árvore tomba em Čorkova Uvala, ninguém a remove. Permanece no chão, rasga uma clareira de
      luz e em seu redor brota a geração seguinte. É assim há séculos nesta reserva de 84 hectares no noroeste
      do Parque Nacional dos Lagos de Plitvice: um faial-abetal antigo, entre os 860 e os 1.028 metros de
      altitude, onde coabitam árvores de todas as idades e dimensões em todas as fases dinâmicas da floresta.


      Trata-se de uma reserva integral no sentido estrito. As afamadas quedas de água do parque ficam logo ao
      lado; aqui vem-se testemunhar como evolui uma floresta quando o ser humano não interfere.
    landscape: >-
      Čorkova Uvala é considerada uma floresta antiga secundária: desenvolveu-se sem cortes comerciais nem
      interferências humanas duradouras. Essa virgindade espelha-se na estrutura. Em vez de uma mancha
      homogénea, exibe um mosaico de árvores gigantescas, clareiras, troncos caídos em decomposição e copas
      escalonadas. O equilíbrio das espécies ajusta-se em ritmos seculares.


      A faia domina, em estreita associação com o abeto-branco. No coração da reserva desponta um abeto-branco
      com mais de quinhentos anos, 58 metros de altura e 150 centímetros de diâmetro, junto a faias e espruces
      monumentais. Vários exemplares nesta depressão abrigada alcançam setecentos anos de vida.


      A geografia local esclarece este vigor. O parque ocupa as encostas meridionais de Mala Kapela, entre os
      369 e os 1.279 metros de altitude, sob um clima temperado húmido que recebe cerca de 1.550 milímetros de
      precipitação anual, ideal para o faial. A floresta cobre grande parte da bacia hidrográfica em estado
      quase primitivo.
    wildlife: >-
      Um ecossistema deste porte é um santuário para a fauna que exige tranquilidade. Os grandes carnívoros do
      parque—o [urso-pardo](/especie/ursus_arctos/), o [lobo](/especie/canis_lupus/), o
      [lince-euroasiático](/especie/lynx_lynx/) e a [lontra-europeia](/especie/lutra_lutra/)—necessitam de
      áreas remotas com presas e tocas sossegadas; o lince é o mais exigente. Corços, veados e gatos-bravos
      também povoam os bosques.


      As aves dominam o ambiente sonoro. Pica-paus e passeriformes nidificam nas árvores senescentes; o parque
      regista nove espécies de pica-paus, doze de rapinas diurnas e oito de rapinas noturnas. As mais comuns
      são a [águia-d’asa-redonda](/especie/buteo_buteo/), o [coruja-urálica](/especie/strix_uralensis/) e a
      coruja-do-mato. O [pica-pau-tridáctilo](/especie/picoides_tridactylus/), o
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/) e o
      [mocho-pigmeu](/especie/glaucidium_passerinum/) nidificam em densidades que justificam o estatuto de
      proteção da rede Natura para aves. Nas escarpas dos lagos inferiores nidificam o
      [falcão-peregrino](/especie/falco_peregrinus/) e o [bufo-real](/especie/bubo_bubo/), enquanto nas
      correntes caça o [melro-d’água](/especie/cinclus_cinclus/).


      A madeira morta sustenta térmitas e escaravelhos raros como a
      [rosália-alpina](/especie/rosalia_alpina/). Nos prados a sul da floresta cantam entre quarenta e
      sessenta machos de [codornizão](/especie/crex_crex/).
    visit: >-
      O núcleo da reserva não pode ser visitado em regime livre. O acesso a Čorkova Uvala realiza-se apenas em
      visitas organizadas com vigilantes do parque e transporte oficial.


      Contudo, é possível contornar a área por trilhos periféricos. O percurso de Čorkova Uvala (21 km) parte
      de Labudovac, aproxima-se da floresta e regressa por Preka Kosa ao ancoradouro P3; aconselha-se apanhar
      o comboio panorâmico até Labudovac. Uma alternativa mais curta é a rota Plitvica, com 9 km, ligando
      Labudovac à Grande Cascata e ao cais P3 ao longo do ribeiro. Painéis temáticos pontuam o trajeto.


      Para um passeio mais breve, o trilho número 1 de Medveđak inicia-se no parque Hladovina junto à entrada
      2, demorando cerca de duas horas e meia. O trilho número 2 sobe suavemente por relevo cársico até
      Turčić.
    history: >-
      O Parque Nacional dos Lagos de Plitvice foi proclamado a 8 de abril de 1949, o primeiro da Croácia, e
      alargado em 1997 até atingir pouco menos de trezentos quilómetros quadrados. As primeiras expedições
      científicas datam de 1850 para sondar profundidades e geologia lacustres. Mais tarde, o professor Ivo
      Pevalek demonstrou o papel fundamental de musgos e algas na formação das barreiras de travertino. O
      centro de investigação com o seu nome, inaugurado em 1975 em Mukinje, prossegue esses trabalhos.


      Neste enquadramento, Čorkova Uvala constitui uma parcela de referência para aferir o impacto da
      silvicultura comercial circundante.
    before: >-
      Permanece estritamente nos trilhos marcados. No parque é proibido acender fogueiras, acampar, circular
      de bicicleta, perturbar animais e levar cães soltos. Nas veredas de montanha, o parque recomenda
      caminhar em grupo conversando para alertar os ursos, evitar saídas com previsão de tempestade e recolher
      todo o lixo.


      A melhor época para caminhar na floresta decorre de junho a setembro.
    around: >-
      A cerca de vinte e um quilómetros fica o [Parque Nacional de Una - Curso Superior e
      Cascatas](/lugar/nacionalni-park-una---gorji-tok/). Noutras paragens da Europa existem florestas virgens
      com as quais Čorkova Uvala partilha o pica-pau-tridáctilo, o lince e o urso: a [Reserva Integral de
      Białowieża](/lugar/bialowieski-park-narodowy---rezerwat-scisly/), a [Floresta Virgem de
      Boubín](/lugar/boubinsky-prales/) e o [Parque Nacional de
      Skuleskogen](/lugar/skuleskogen-national-park/).
