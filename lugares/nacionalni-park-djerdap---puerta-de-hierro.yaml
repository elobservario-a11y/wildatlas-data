resumen:
  es: >-
    La gran brecha donde el río Danubio corta la cadena de los Cárpatos y los Balcanes a lo largo de 100 km de
    cañones.
  en: The great gorge where the Danube cuts through the Carpathian and Balkan chains across 100 km of canyons.
  fr: La grande percée où le Danube franchit les chaînes carpato-balkaniques sur 100 km de gorges.
  de: Die große Schlucht, in der die Donau auf 100 km durch die Karpaten und den Balkan bricht.
  it: La grande gola dove il Danubio taglia la catena dei Carpazi e dei Balcani lungo 100 km di canyon.
  pt: A grande gorge onde o Danúbio corta a cadeia dos Cárpatos e dos Balcãs ao longo de 100 km de canhões.
unico:
  es: >-
    Un río partiendo montañas, con una reserva viva de flora y fauna terciarias y un museo arqueológico al
    aire libre.
  en: >-
    A river cleaving mountains, with a living reserve of Tertiary flora and fauna and an open-air
    archaeological museum.
  fr: >-
    Un fleuve fendant les montagnes, abritant un refuge vivant de flore et faune tertiaires et un musée
    archéologique à ciel ouvert.
  de: >-
    Ein Fluss, der Berge durchbricht, mit einem lebendigen Refugium tertiärer Flora und Fauna und einem
    archäologischen Freiluftmuseum.
  it: >-
    Un fiume che spacca le montagne, con una riserva vivente di flora e fauna terziarie e un museo
    archeologico a cielo aperto.
  pt: >-
    Um rio que fende montanhas, com uma reserva viva de flora e fauna terciárias e um museu arqueológico a céu
    aberto.
observaciones:
  es: >-
    Se pide disfrutar del bosque en silencio, no arrancar flores, no romper ramas y no molestar a los animales
    ni dañar nidos. Casi todas las rutas exigen visita organizada: ponte en contacto con el parque antes de
    ir.
texto:
  es:
    intro: >-
      En Gospodjin vir el cauce del Danubio es muy estrecho y las orillas se elevan más de 500 metros; aguas
      abajo, en la cuenca de Donji Milanovac, el río se ensancha por encima de 2 km. Eso es Đerdap: el Danubio
      abriéndose paso a través de los Cárpatos en el mayor y más largo desfiladero de ruptura de Europa, la
      llamada Puerta de Hierro.


      El parque nacional sigue la margen derecha del río durante 100 km, desde la fortaleza de Golubac hasta
      Diana Karataš. Es una franja montañosa y boscosa de entre dos y ocho kilómetros de ancho, que se eleva
      de cincuenta a ochocientos metros, y protege el desfiladero y su entorno desde 1974. Se le llama el
      parque nacional «ribereño» porque una parte importante de él es el propio Danubio.
    landscape: >-
      El nombre ya lo dice todo. Đerdap viene de una palabra persa antigua, «girdap», que significa remolino;
      localmente se llama Puerta de Hierro. El desfiladero se compone de tres valles tipo cañón y garganta
      (Golubac, Gospođin vir y los cañones Veliki y Mali Kazan) y de tres cuencas. El Danubio entra en el
      tercer cañón, el más hermoso, formado por Veliki Kazan y Mali Kazan, entre acantilados calizos
      verticales.


      Esta geología tiene consecuencias para la vida. Su historia, un clima muy favorable y una red de
      gargantas y barrancos hacen de la zona una reserva europea de flora, vegetación y fauna terciarias. El
      desfiladero fue refugio de flora durante la última glaciación, uno de los más septentrionales de Europa.
      Se han registrado 13 especies de reliquias terciarias, como el tejo, el acebo, el nogal y la lila, que
      forma matorrales densos en las laderas calizas empinadas donde no crece el bosque. La flora, con 1.013
      especies y subespecies, supone algo más de una cuarta parte de la de Serbia, y hay 57 comunidades de
      bosque y matorral.


      Entre los árboles hay avellano turco, almez, nogal, tilo plateado, arce campestre y roble pubescente.
    wildlife: >-
      Al menos 55 especies de mamíferos habitan Đerdap, al menos la mitad de las registradas en Serbia. Entre
      los estrictamente protegidos están la [nutria](/especie/lutra_lutra/), el [lince](/especie/lynx_lynx/) y
      todos los murciélagos; también viven ciervos, lobos, chacales y águilas reales.


      Para las aves hay cerca de 270 especies. Entre las destacadas están el cormorán pigmeo, el águila
      pomerana, el águila calzada, el pigargo europeo, el [águila real](/especie/aquila_chrysaetos/), el
      [halcón peregrino](/especie/falco_peregrinus/) y el [guión de codornices](/especie/crex_crex/). También
      figuran la [cigüeña negra](/especie/ciconia_nigra/), el [búho real](/especie/bubo_bubo/), el cárabo
      uralense, el autillo europeo, el vencejo real y la golondrina dáurica. El [buitre
      leonado](/especie/gyps_fulvus/) reaparece en Štrpce; hasta 1956 fue residente habitual de Đerdap.


      En el agua hay unas 50 especies de peces en el Danubio y sus afluentes dentro del parque. Las presas
      hidroeléctricas Đerdap 1 y 2 cortaron las migraciones de peces del mar Negro y convirtieron el río en un
      lago en el parque.
    visit: >-
      La visita empieza en el centro de Donji Milanovac, donde una exposición interactiva explica la geología,
      la flora, la fauna y el patrimonio cultural de Đerdap. Abre todos los días de siete de la mañana a tres
      de la tarde; las tardes y los fines de semana requieren aviso previo. Incluye una exposición táctil de
      fósiles pensada para personas ciegas y con baja visión. En Tekija, el centro geointerpretativo ofrece
      interpretación geológica del lugar e información sobre senderos y visitas guiadas.


      Los senderos mantenidos son Mali y Veliki Štrbac, Greben, Gradašnica, Kovilovo, el cañón del río
      Boljetin, Ploče y Zlatno jezero. Salvo el sendero educativo Zlatno jezero, las demás rutas están en zona
      de protección de primer grado y requieren visitas organizadas y acompañadas. El sendero de Mali Štrbac
      mide 7.1 km de ida, de dificultad media, con una pendiente media del 20 %; sale de Golo Brdo a 254 m y
      termina en el mirador a 626 m, sobre Veliki Kazan, desde donde se ve en la orilla rumana la estatua de
      Decébalo. El de Veliki Štrbac mide 7,6 km de ida, sale de Pecka bara a 89 m y termina en la cima más
      alta del monte Miroč, a 768 m, con el Danubio en su punto más estrecho a tus pies.


      En bicicleta, la ruta Kožica-Boljetin mide 18 km por una antigua carretera casi sin tráfico, con su
      punto más alto a 510 m. Es el desvío número 12 de la EuroVelo 6; la ruta ciclista del Danubio por el
      parque mide unos 110 km.
    history: >-
      Hay presencia humana permanente, con hallazgos como el poblado de Lepenski Vir, la antigua ciudad de
      Golubac, restos de la calzada de Trajano, la Tabula Traiana y el limes romano. En Lepenski Vir las
      excavaciones de los años sesenta hallaron esculturas monumentales de entre 7000 y 6000 a. C. La
      fortaleza de Golubac, a la entrada de la Puerta de Hierro, tiene nueve torres de 25 m unidas por una
      muralla; su primera mención escrita es de 1335 y estuvo en manos húngaras y otomanas.


      El Geoparque Đerdap abarca 1330 km² y se ha presentado como primera candidata de Serbia a la Red Mundial
      de Geoparques de la UNESCO. A lo largo del desfiladero se ven sitios geológicos de casi todos los
      periodos, desde hace unos mil millones de años hasta hoy.
    before: >-
      Se pide disfrutar del bosque en silencio, no arrancar flores, no romper ramas y no molestar a los
      animales ni dañar nidos. Casi todas las rutas exigen visita organizada: ponte en contacto con el parque
      antes de ir.
    around: >-
      A seis kilómetros está el [Rewilding Meseta de Mehedinți](/lugar/rewilding-mehedinti-plateau/), a ocho
      la [Reserva Natural Bosque Primario Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/),
      a quince el [Parque Nacional Domogled - Valle del
      Cerna](/lugar/parcul-national-domogled---valea-cernei/) y a veintiuno el [Parque Nacional Gargantas del
      Nera - Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/).
  en:
    intro: >-
      At Gospodjin vir the Danube's channel is very narrow and its banks rise more than 500 metres;
      downstream, in the Donji Milanovac basin, the river widens to over 2 km. That is Đerdap: the Danube
      forcing its way through the Carpathians in the longest and deepest breakthrough gorge in Europe, known
      as the Iron Gate.


      The national park follows the right bank of the river for 100 km, from Golubac Fortress to Diana
      Karataš. It is a forested mountain strip two to eight kilometres wide, rising from fifty to eight
      hundred metres, protecting the gorge and its surroundings since 1974. It is called the 'riverine'
      national park because an important part of it is the Danube itself.
    landscape: >-
      The name says it all. Đerdap derives from an ancient Persian word, *girdap*, meaning whirlpool; locally
      it is called the Iron Gate. The gorge consists of three canyon-and-gorge valleys (Golubac, Gospođin vir
      and the Veliki and Mali Kazan canyons) and three basins. The Danube enters the third and most beautiful
      canyon, formed by Veliki Kazan and Mali Kazan, between vertical limestone cliffs.


      This geology has consequences for life. The area's ancient history, a highly favourable climate, and a
      network of gorges and ravines make it a European refuge of Tertiary flora, vegetation and fauna. The
      gorge served as a glacial refugium during the last ice age, one of the most northerly in Europe. 13
      Tertiary relict species have been recorded, including yew, holly, walnut and lilac, which forms dense
      thickets on steep limestone slopes where forest cannot grow. The flora counts 1,013 species and
      subspecies, representing just over a quarter of Serbia's total, with 57 woodland and scrub communities.


      Among the trees are Turkish hazel, hackberry, walnut, silver lime, field maple and downy oak.
    wildlife: >-
      At least 55 mammal species inhabit Đerdap, at least half of those recorded in Serbia. Among the strictly
      protected are the [otter](/especie/lutra_lutra/), the [lynx](/especie/lynx_lynx/) and all bats; deer,
      wolves, jackals and golden eagles also live here.


      For birds there are around 270 species. Among the highlights are the pygmy cormorant, lesser spotted
      eagle, booted eagle, white-tailed eagle, [golden eagle](/especie/aquila_chrysaetos/), [peregrine
      falcon](/especie/falco_peregrinus/) and [corn crake](/especie/crex_crex/). Also present are the [black
      stork](/especie/ciconia_nigra/), [Eurasian eagle-owl](/especie/bubo_bubo/), Ural owl, Eurasian scops
      owl, pallid swift and red-rumped swallow. The [griffon vulture](/especie/gyps_fulvus/) reappears at
      Štrpce; until 1956 it was a regular resident of Đerdap.


      In the water there are around 50 fish species in the Danube and its tributaries within the park. The
      Đerdap 1 and 2 hydroelectric dams cut fish migrations from the Black Sea and turned the river into a
      lake within the park.
    visit: >-
      The visit begins at the Donji Milanovac centre, where an interactive exhibition explains the geology,
      flora, fauna and cultural heritage of Đerdap. It opens daily from seven in the morning to three in the
      afternoon; afternoons and weekends require prior notice. It includes a tactile fossil exhibition
      designed for blind and partially sighted visitors. At Tekija, the geointerpretive centre offers
      geological interpretation and information on trails and guided visits.


      Maintained trails are Mali and Veliki Štrbac, Greben, Gradašnica, Kovilovo, the Boljetin River Canyon,
      Ploče and Zlatno jezero. Except for the Zlatno jezero educational trail, all other routes lie in
      first-degree protection zones and require organised, guided visits. The Mali Štrbac trail is 7.1 km one
      way, medium difficulty with an average gradient of 20%; it starts at Golo Brdo at 254 m and ends at the
      viewpoint at 626 m, overlooking Veliki Kazan, from where the Decebalus statue on the Romanian bank is
      visible. The Veliki Štrbac trail is 7.6 km one way, starting from Pecka bara at 89 m and ending at the
      highest summit of Mount Miroč at 768 m, with the Danube at its narrowest below.


      By bicycle, the Kožica–Boljetin route is 18 km along an old road with almost no traffic, its highest
      point at 510 m. It is detour number 12 of EuroVelo 6; the Danube cycling route through the park totals
      around 110 km.
    history: >-
      There is permanent human presence, with finds including the Lepenski Vir settlement, the ancient city of
      Golubac, remains of Trajan's road, the Tabula Traiana and the Roman limes. At Lepenski Vir, excavations
      in the sixties uncovered monumental sculptures dating between 7,000 and 6,000 BC. Golubac Fortress, at
      the entrance to the Iron Gate, has nine 25-metre towers linked by a wall; its first written mention is
      from 1335 and it passed through Hungarian and Ottoman hands.


      The Đerdap Geopark covers 1,330 km² and has been put forward as Serbia's first candidate for the UNESCO
      Global Geoparks Network. Along the gorge, geological sites from almost every period can be seen,
      spanning roughly one billion years to the present.
    before: >-
      Visitors are asked to enjoy the forest in silence, not to pick flowers, not to break branches, and not
      to disturb animals or damage nests. Almost all routes require an organised visit: contact the park
      before going.
    around: >-
      Six kilometres away is [Rewilding Mehedinți Plateau](/lugar/rewilding-mehedinti-plateau/), eight
      kilometres away the [Valea Mare Primary Forest Nature
      Reserve](/lugar/rezervatia-naturala-codrul-secular-valea-mare/), fifteen kilometres away [Domogled –
      Cerna Valley National Park](/lugar/parcul-national-domogled---valea-cernei/) and twenty-one kilometres
      away [Nera Gorges – Beușnița National Park](/lugar/parcul-national-cheile-nerei---beusnita/).
  fr:
    intro: >-
      À Gospodjin vir, le chenal du Danube est si étroit que les berges s'élèvent à plus de 500 mètres ; en
      aval, dans la cuvette de Donji Milanovac, le fleuve s'élargit sur plus de 2 km. Voilà Đerdap : le Danube
      se frayant un passage à travers les Carpates dans le plus long et le plus profond canyon de percée
      d'Europe, appelé les Portes de Fer.


      Le parc national longe la rive droite du fleuve sur 100 km, de la forteresse de Golubac à Diana Karataš.
      Il s'agit d'une bande montagneuse et boisée de deux à huit kilomètres de large, s'élevant de cinquante à
      huit cents mètres, protégeant le défilé et ses environs depuis 1974. On le surnomme le parc national «
      riverain » car une part importante en est le Danube lui-même.
    landscape: >-
      Le nom dit tout. Đerdap vient d'un vieux mot persan, *girdap*, signifiant tourbillon ; localement on
      l'appelle les Portes de Fer. Le défilé se compose de trois vallées canyon (Golubac, Gospođin vir et les
      canyons Veliki et Mali Kazan) et de trois bassins. Le Danube pénètre dans le troisième canyon, le plus
      beau, formé par Veliki Kazan et Mali Kazan, entre des falaises calcaires verticales.


      Cette géologie a des répercussions sur le vivant. L'histoire ancienne du site, un climat très favorable
      et un réseau de gorges font de la zone un refuge européen de flore, végétation et faune tertiaires. Le
      défilé servit de refuge glaciaire lors de la dernière glaciation, l'un des plus septentrionaux d'Europe.
      On y recense 13 espèces reliques tertiaires : if, houx, noyer et lilas, qui forme des taillis denses sur
      les versants calcaires abrupts où la forêt ne prend pas pied. La flore compte 1 013 espèces et
      sous-espèces, représentant un peu plus du quart de la flore serbe, avec 57 communautés forestières et
      arbustives.


      Parmi les arbres figurent le charme oriental, le micocoulier, le noyer, le tilleul argenté, l'érable
      champêtre et le chêne pubescent.
    wildlife: >-
      Au moins 55 espèces de mammifères peuplent Đerdap, soit au moins la moitié de celles recensées en
      Serbie. Parmi les strictement protégées : la [loutre](/especie/lutra_lutra/), le
      [lynx](/especie/lynx_lynx/) et tous les chiroptères ; cerfs, loups, chacals et aigles royaux y vivent
      également.


      L'avifaune atteint près de 270 espèces. Parmi les plus remarquables : le cormoran pygmée, l'aigle
      pomarin, l'aigle botté, le pygargue à queue blanche, l'[aigle royal](/especie/aquila_chrysaetos/), le
      [faucon pèlerin](/especie/falco_peregrinus/) et le [roi de cailles](/especie/crex_crex/). On y trouve
      aussi la [cigogne noire](/especie/ciconia_nigra/), le [grand-duc d'Europe](/especie/bubo_bubo/), la
      chouette de l'Oural, le petit-duc scops, le martinet pâle et l'hirondelle rousseline. Le [vautour
      fauve](/especie/gyps_fulvus/) réapparaît à Štrpce ; jusqu'en 1956 il était un résident habituel de
      Đerdap.


      Dans l'eau vivent environ 50 espèces de poissons dans le Danube et ses affluents du parc. Les barrages
      hydroélectriques Đerdap 1 et 2 ont interrompu les migrations depuis la mer Noire et transformé le fleuve
      en lac dans le parc.
    visit: >-
      La visite commence au centre de Donji Milanovac, où une exposition interactive présente la géologie, la
      faune, la flore et le patrimoine culturel de Đerdap. Ouvert tous les jours de sept heures du matin à
      quinze heures ; les après-midi et week-ends nécessitent une réservation préalable. Une exposition
      tactile de fossiles est prévue pour les personnes malvoyantes. À Tekija, le centre géo-interprétatif
      offre une lecture géologique du site et des informations sur les sentiers.


      Les sentiers balisés sont Mali et Veliki Štrbac, Greben, Gradašnica, Kovilovo, le canyon du Boljetin,
      Ploče et Zlatno jezero. À l'exception du sentier pédagogique Zlatno jezero, toutes les autres routes se
      trouvent en zone de protection de premier degré et exigent des visites guidées. Le sentier de Mali
      Štrbac mesure 7,1 km aller simple, difficulté moyenne, pente moyenne de 20 % ; il part de Golo Brdo à
      254 m et se termine au belvédère à 626 m sur Veliki Kazan, d'où la statue de Décébale sur la rive
      roumaine est visible. Celui de Veliki Štrbac mesure 7,6 km aller simple, depuis Pecka bara à 89 m
      jusqu'au sommet du mont Miroč à 768 m, avec le Danube en contrebas à son point le plus étroit.


      À vélo, l'itinéraire Kožica–Boljetin mesure 18 km sur une ancienne route quasi-déserte, son point
      culminant à 510 m. Il s'agit du décrochement n° 12 d'EuroVelo 6 ; la véloroute danubienne à travers le
      parc totalise environ 110 km.
    history: >-
      La présence humaine est permanente, attestée par le village de Lepenski Vir, l'ancienne ville de
      Golubac, les vestiges de la voie Trajane, la Tabula Traiana et le limes romain. Les fouilles des années
      soixante à Lepenski Vir ont mis au jour des sculptures monumentales datées entre 7 000 et 6 000 av.
      J.-C. La forteresse de Golubac, à l'entrée des Portes de Fer, compte neuf tours de 25 m reliées par un
      rempart ; sa première mention écrite remonte à 1335 et elle passa des mains hongroises aux ottomanes.


      Le Géoparc Đerdap couvre 1 330 km² et a été présenté comme premier candidat serbe au Réseau mondial des
      Géoparcs de l'UNESCO. Le long du défilé, des sites géologiques de presque toutes les périodes sont
      visibles, couvrant environ un milliard d'années.
    before: >-
      Il est demandé de profiter de la forêt en silence, de ne pas cueillir de fleurs, de ne pas casser de
      branches et de ne pas déranger les animaux ni endommager les nids. Presque tous les sentiers nécessitent
      une visite organisée : contactez le parc avant de vous y rendre.
    around: >-
      À six kilomètres se trouve le [Rewilding Plateau de Mehedinți](/lugar/rewilding-mehedinti-plateau/), à
      huit la [Réserve naturelle de la forêt vierge Valea
      Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/), à quinze le [Parc national Domogled –
      Vallée du Cerna](/lugar/parcul-national-domogled---valea-cernei/) et à vingt et un le [Parc national
      Gorges du Nera – Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/).
  de:
    intro: >-
      Bei Gospodjin vir ist das Flussbett der Donau sehr eng und die Ufer erheben sich auf über 500 Meter;
      flussabwärts, im Becken von Donji Milanovac, verbreitert sich der Fluss auf über 2 km. Das ist Đerdap:
      die Donau, die sich in der längsten und tiefsten Durchbruchsschlucht Europas durch die Karpaten bahnt –
      dem sogenannten Eisernen Tor.


      Der Nationalpark folgt dem rechten Flussufer über 100 km, von der Festung Golubac bis Diana Karataš. Er
      umfasst einen bewaldeten Gebirgsstreifen von zwei bis acht Kilometern Breite, der von fünfzig bis
      achthundert Meter ansteigt, und schützt die Schlucht seit 1974. Er wird als 'Ufer-Nationalpark'
      bezeichnet, weil ein wesentlicher Teil des Parks die Donau selbst ist.
    landscape: >-
      Der Name sagt alles. Đerdap leitet sich von einem alten persischen Wort, *girdap*, ab, das Strudel
      bedeutet; lokal wird es Eisernes Tor genannt. Die Schlucht besteht aus drei Canyon-Tälern (Golubac,
      Gospođin vir und die Canyons Veliki und Mali Kazan) sowie drei Becken. Die Donau tritt in den dritten
      und schönsten Canyon ein, der von Veliki Kazan und Mali Kazan zwischen senkrechten Kalkfelsen gebildet
      wird.


      Diese Geologie hat Folgen für das Leben. Die uralte Geschichte des Gebiets, ein sehr günstiges Klima und
      ein Netz aus Schluchten machen die Zone zu einem europäischen Refugium tertiärer Flora, Vegetation und
      Fauna. Die Schlucht diente während der letzten Eiszeit als eines der nördlichsten glazialen
      Rückzugsgebiete Europas. Es wurden 13 Tertiärrelikte nachgewiesen, darunter Eibe, Stechpalme, Walnuss
      und Flieder, der dichte Dickichte an steilen Kalkfelsen bildet, wo kein Wald wächst. Die Flora umfasst
      1.013 Arten und Unterarten, mehr als ein Viertel der serbischen Flora, mit 57 Wald- und
      Gebüschgesellschaften.


      Unter den Bäumen finden sich Hopfenbuche, Zürgelbaum, Walnuss, Silberlinde, Feldahorn und Flaumeiche.
    wildlife: >-
      Mindestens 55 Säugetierarten bewohnen Đerdap, mindestens die Hälfte der in Serbien erfassten. Zu den
      streng geschützten zählen [Fischotter](/especie/lutra_lutra/), [Luchs](/especie/lynx_lynx/) und alle
      Fledermäuse; auch Hirsche, Wölfe, Schakale und Steinadler leben hier.


      Bei den Vögeln sind etwa 270 Arten registriert. Zu den bemerkenswertesten gehören Zwergscharbe,
      Schreiadler, Zwergadler, Seeadler, [Steinadler](/especie/aquila_chrysaetos/),
      [Wanderfalke](/especie/falco_peregrinus/) und [Wachtelkönig](/especie/crex_crex/). Ebenfalls vertreten
      sind [Schwarzstorch](/especie/ciconia_nigra/), [Uhu](/especie/bubo_bubo/), Habichtskauz, Zwergohreule,
      Fahlsegler und Rötelschwalbe. Der [Gänsegeier](/especie/gyps_fulvus/) taucht bei Štrpce wieder auf; bis
      1956 war er ein regelmäßiger Bewohner von Đerdap.


      Im Wasser gibt es rund 50 Fischarten in der Donau und ihren Nebenflüssen im Park. Die Wasserkraftwerke
      Đerdap 1 und 2 unterbrachen die Wanderungen der Fische aus dem Schwarzen Meer und verwandelten den Fluss
      im Parkgebiet in einen See.
    visit: >-
      Die Besichtigung beginnt im Zentrum von Donji Milanovac, wo eine interaktive Ausstellung die Geologie,
      Flora, Fauna und das Kulturerbe von Đerdap erklärt. Täglich von sieben Uhr morgens bis fünfzehn Uhr
      geöffnet; Nachmittage und Wochenenden erfordern eine Voranmeldung. Eine taktile Fossilienausstellung ist
      für blinde und sehbehinderte Besucher vorgesehen. In Tekija bietet das Geointerpretationszentrum
      geologische Erläuterungen und Informationen zu Wanderungen.


      Gepflegte Wanderwege sind Mali und Veliki Štrbac, Greben, Gradašnica, Kovilovo, die
      Boljetin-Flussschlucht, Ploče und Zlatno jezero. Außer dem Bildungspfad Zlatno jezero liegen alle
      anderen Routen in Schutzzonen erster Ordnung und erfordern organisierte Führungen. Der Mali-Štrbac-Weg
      ist 7,1 km einfach, mittlere Schwierigkeit, mittlere Steigung 20%; er beginnt bei Golo Brdo auf 254 m
      und endet am Aussichtspunkt auf 626 m über Veliki Kazan, von wo die Decebalus-Statue am rumänischen Ufer
      sichtbar ist. Der Veliki-Štrbac-Weg ist 7,6 km einfach, von Pecka bara auf 89 m bis zum Gipfel des
      Berges Miroč auf 768 m, mit der Donau in ihrer schmalsten Stelle darunter.


      Mit dem Fahrrad ist die Strecke Kožica–Boljetin 18 km lang auf einer alten, fast verkehrsfreien Straße,
      höchster Punkt bei 510 m. Es ist Abzweig Nummer 12 des EuroVelo 6; die Donau-Fahrradroute durch den Park
      beträgt rund 110 km.
    history: >-
      Es gibt dauerhafte menschliche Präsenz, mit Funden wie der Siedlung Lepenski Vir, der antiken Stadt
      Golubac, Resten der Trajanstraße, der Tabula Traiana und dem römischen Limes. Bei Lepenski Vir brachten
      Ausgrabungen in den sechziger Jahren monumentale Skulpturen aus der Zeit zwischen 7.000 und 6.000 v.
      Chr. zutage. Die Festung Golubac, am Eingang zum Eisernen Tor, hat neun 25 m hohe Türme, verbunden durch
      eine Mauer; ihre erste schriftliche Erwähnung stammt von 1335 und sie wechselte zwischen ungarischem und
      osmanischem Besitz.


      Der Geopark Đerdap umfasst 1.330 km² und wurde als erster serbischer Kandidat für das UNESCO-Netzwerk
      der Geoparks eingereicht. Entlang der Schlucht sind geologische Stätten aus nahezu allen Epochen zu
      sehen, die rund eine Milliarde Jahre abdecken.
    before: >-
      Besucher werden gebeten, den Wald in Stille zu genießen, keine Blumen zu pflücken, keine Äste zu brechen
      und Tiere nicht zu stören oder Nester zu beschädigen. Fast alle Routen erfordern eine organisierte
      Führung: Kontaktieren Sie den Park vor Ihrer Anreise.
    around: >-
      Sechs Kilometer entfernt liegt das [Rewilding Mehedinți-Hochebene](/lugar/rewilding-mehedinti-plateau/),
      acht Kilometer die [Naturreservat Urwald Valea
      Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/), fünfzehn Kilometer der [Nationalpark
      Domogled – Cernatal](/lugar/parcul-national-domogled---valea-cernei/) und einundzwanzig Kilometer der
      [Nationalpark Nera-Schlucht – Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/).
  it:
    intro: >-
      A Gospodjin vir il corso del Danubio è strettissimo e le rive si innalzano a oltre 500 metri; più a
      valle, nel bacino di Donji Milanovac, il fiume si allarga oltre i 2 km. Questo è Đerdap: il Danubio che
      si apre un varco attraverso i Carpazi nel gorge di sfondamento più lungo e profondo d'Europa, chiamato
      la Porta di Ferro.


      Il parco nazionale segue la riva destra del fiume per 100 km, dalla fortezza di Golubac a Diana Karataš.
      È una fascia montuosa e boscosa larga da due a otto chilometri, che si eleva da cinquanta a ottocento
      metri, e protegge la gola e i suoi dintorni dal 1974. Viene chiamato il parco nazionale 'fluviale'
      perché una parte importante di esso è lo stesso Danubio.
    landscape: >-
      Il nome dice tutto. Đerdap deriva da un'antica parola persiana, *girdap*, che significa vortice;
      localmente è chiamata Porta di Ferro. La gola è composta da tre valli di tipo canyon (Golubac, Gospođin
      vir e i canyon Veliki e Mali Kazan) e da tre bacini. Il Danubio entra nel terzo canyon, il più bello,
      formato da Veliki Kazan e Mali Kazan, tra pareti calcaree verticali.


      Questa geologia ha conseguenze per la vita. L'antica storia dell'area, un clima molto favorevole e una
      rete di gole e burroni rendono la zona una riserva europea di flora, vegetazione e fauna terziarie. La
      gola fu rifugio glaciale durante l'ultima glaciazione, uno dei più settentrionali d'Europa. Sono state
      registrate 13 specie relitte terziarie, tra cui tasso, agrifoglio, noce e lillà, che forma fitti
      cespugli sui pendii calcarei ripidi dove il bosco non riesce ad attecchire. La flora conta 1.013 specie
      e sottospecie, che rappresentano poco più di un quarto di quella serba, con 57 comunità forestali e
      arbustive.


      Tra gli alberi si trovano nocciolo turco, bagolaro, noce, tiglio argentato, acero campestre e roverella.
    wildlife: >-
      Almeno 55 specie di mammiferi abitano Đerdap, almeno la metà di quelle registrate in Serbia. Tra le
      strettamente protette figurano la [lontra](/especie/lutra_lutra/), la [lince](/especie/lynx_lynx/) e
      tutti i chirotteri; qui vivono anche cervi, lupi, sciacalli e aquile reali.


      Per gli uccelli si contano circa 270 specie. Tra le più notevoli: il marangone minore, l'aquila
      anatraia, l'aquila calzata, l'aquila di mare, l'[aquila reale](/especie/aquila_chrysaetos/), il [falco
      pellegrino](/especie/falco_peregrinus/) e il [re di quaglie](/especie/crex_crex/). Sono presenti anche
      la [cicogna nera](/especie/ciconia_nigra/), il [gufo reale](/especie/bubo_bubo/), l'allocco degli Urali,
      l'assiolo, il rondone pallido e la rondine rossiccia. Il [grifone](/especie/gyps_fulvus/) ricompare a
      Štrpce; fino al 1956 era residente abituale di Đerdap.


      In acqua vivono circa 50 specie di pesci nel Danubio e nei suoi affluenti nel parco. Le dighe
      idroelettriche Đerdap 1 e 2 hanno interrotto le migrazioni dei pesci dal Mar Nero e trasformato il fiume
      in un lago nel parco.
    visit: >-
      La visita inizia al centro di Donji Milanovac, dove una mostra interattiva illustra la geologia, la
      flora, la fauna e il patrimonio culturale di Đerdap. Aperto tutti i giorni dalle sette alle quindici; i
      pomeriggi e i fine settimana richiedono preavviso. Include una mostra tattile di fossili pensata per
      persone cieche e ipovedenti. A Tekija, il centro geointerpretativo offre un'interpretazione geologica
      del sito e informazioni sui sentieri.


      I sentieri mantenuti sono Mali e Veliki Štrbac, Greben, Gradašnica, Kovilovo, il canyon del fiume
      Boljetin, Ploče e Zlatno jezero. Ad eccezione del sentiero didattico Zlatno jezero, tutte le altre route
      si trovano in zone di protezione di primo grado e richiedono visite organizzate con guida. Il sentiero
      di Mali Štrbac è lungo 7,1 km (sola andata), difficoltà media, pendenza media del 20%; parte da Golo
      Brdo a 254 m e termina al belvedere a 626 m su Veliki Kazan, da cui è visibile la statua di Decebalo
      sulla riva rumena. Quello di Veliki Štrbac è lungo 7,6 km (sola andata), da Pecka bara a 89 m fino alla
      vetta più alta del monte Miroč a 768 m, con il Danubio nel suo punto più stretto sotto di sé.


      In bicicletta, l'itinerario Kožica–Boljetin è lungo 18 km su una vecchia strada quasi priva di traffico,
      con il punto più alto a 510 m. È la deviazione numero 12 di EuroVelo 6; il percorso ciclistico danubiano
      attraverso il parco totalizza circa 110 km.
    history: >-
      La presenza umana è permanente, con ritrovamenti come il villaggio di Lepenski Vir, l'antica città di
      Golubac, resti della strada di Traiano, la Tabula Traiana e il limes romano. A Lepenski Vir, gli scavi
      degli anni Sessanta portarono alla luce sculture monumentali datate tra il 7.000 e il 6.000 a.C. La
      fortezza di Golubac, all'ingresso della Porta di Ferro, ha nove torri di 25 m collegate da una cinta
      muraria; la prima menzione scritta risale al 1335 e passò di mano tra ungheresi e ottomani.


      Il Geoparco Đerdap copre 1.330 km² ed è stato proposto come primo candidato serbo alla Rete mondiale dei
      Geoparchi UNESCO. Lungo la gola si trovano siti geologici di quasi tutte le epoche, coprendo circa un
      miliardo di anni.
    before: >-
      Si chiede ai visitatori di godere della foresta in silenzio, di non raccogliere fiori, di non spezzare
      rami e di non disturbare gli animali né danneggiare i nidi. Quasi tutti i percorsi richiedono una visita
      organizzata: contattare il parco prima di partire.
    around: >-
      A sei chilometri si trova il [Rewilding Altopiano di Mehedinți](/lugar/rewilding-mehedinti-plateau/), a
      otto la [Riserva naturale Foresta Primaria Valea
      Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/), a quindici il [Parco nazionale Domogled –
      Valle del Cerna](/lugar/parcul-national-domogled---valea-cernei/) e a ventuno il [Parco nazionale Gole
      del Nera – Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/).
  pt:
    intro: >-
      Em Gospodjin vir o leito do Danúbio é muito estreito e as margens elevam-se a mais de 500 metros; rio
      abaixo, na bacia de Donji Milanovac, o rio alarga-se para mais de 2 km. Isso é Đerdap: o Danúbio abrindo
      caminho pelos Cárpatos na mais longa e profunda garganta de ruptura da Europa, chamada a Porta de Ferro.


      O parque nacional acompanha a margem direita do rio por 100 km, desde a fortaleza de Golubac até Diana
      Karataš. É uma faixa montanhosa e florestal de dois a oito quilómetros de largura, elevando-se de
      cinquenta a oitocentos metros, e protege o desfiladeiro desde 1974. É chamado o parque nacional
      'ribeirinho' porque uma parte importante dele é o próprio Danúbio.
    landscape: >-
      O nome diz tudo. Đerdap deriva de uma antiga palavra persa, *girdap*, que significa redemoinho;
      localmente chama-se Porta de Ferro. O desfiladeiro é composto por três vales do tipo canhão (Golubac,
      Gospođin vir e os canhões Veliki e Mali Kazan) e três bacias. O Danúbio entra no terceiro canhão, o mais
      belo, formado por Veliki Kazan e Mali Kazan, entre falésias calcárias verticais.


      Esta geologia tem consequências para a vida. A história antiga da área, um clima muito favorável e uma
      rede de gargantas e ravinas fazem da zona uma reserva europeia de flora, vegetação e fauna terciárias. O
      desfiladeiro serviu de refúgio glaciar durante a última glaciação, um dos mais setentrionais da Europa.
      Foram registadas 13 espécies relíquia terciárias, incluindo teixo, azevinho, nogueira e lilás, que forma
      matagais densos em encostas calcárias íngremes onde a floresta não consegue crescer. A flora conta 1.013
      espécies e subespécies, representando pouco mais de um quarto da flora sérvia, com 57 comunidades
      florestais e arbustivas.


      Entre as árvores encontram-se avelã turca, lódão, nogueira, tília-prateada, bordo-campestre e
      carvalho-cerquinho.
    wildlife: >-
      Pelo menos 55 espécies de mamíferos habitam Đerdap, pelo menos metade das registadas na Sérvia. Entre as
      estritamente protegidas encontram-se a [lontra](/especie/lutra_lutra/), o [lince](/especie/lynx_lynx/) e
      todos os morcegos; também vivem aqui veados, lobos, chacais e águias-reais.


      Para as aves há cerca de 270 espécies. Entre as mais notáveis: o corvo-marinho-pigmeu, a
      águia-gritadeira, a águia-calçada, a águia-de-cauda-branca, a [águia-real](/especie/aquila_chrysaetos/),
      o [falcão-peregrino](/especie/falco_peregrinus/) e o [codornizão](/especie/crex_crex/). Também
      presentes: a [cegonha-preta](/especie/ciconia_nigra/), o [bufo-real](/especie/bubo_bubo/), a
      coruja-dos-urais, o noitibó-de-nuca-vermelha, o andorinhão-pálido e a andorinha-dáurica. O
      [grifo](/especie/gyps_fulvus/) reaparece em Štrpce; até 1956 era residente habitual de Đerdap.


      Na água há cerca de 50 espécies de peixes no Danúbio e seus afluentes dentro do parque. As barragens
      hidroelétricas Đerdap 1 e 2 interromperam as migrações de peixes do Mar Negro e transformaram o rio numa
      albufeira no interior do parque.
    visit: >-
      A visita começa no centro de Donji Milanovac, onde uma exposição interativa explica a geologia, a flora,
      a fauna e o património cultural de Đerdap. Aberto todos os dias das sete da manhã às quinze horas;
      tardes e fins de semana requerem aviso prévio. Inclui uma exposição tátil de fósseis pensada para
      pessoas cegas e com baixa visão. Em Tekija, o centro geointerpretativo oferece interpretação geológica
      do local e informações sobre trilhos e visitas guiadas.


      Os trilhos mantidos são Mali e Veliki Štrbac, Greben, Gradašnica, Kovilovo, o canhão do rio Boljetin,
      Ploče e Zlatno jezero. Exceto o trilho educativo Zlatno jezero, todas as outras rotas situam-se em zonas
      de proteção de primeiro grau e requerem visitas organizadas com guia. O trilho de Mali Štrbac tem 7,1 km
      de ida, dificuldade média, declive médio de 20%; parte de Golo Brdo a 254 m e termina no miradouro a 626
      m sobre Veliki Kazan, de onde é visível a estátua de Décebalo na margem romena. O de Veliki Štrbac tem
      7,6 km de ida, desde Pecka bara a 89 m até ao pico mais alto do monte Miroč a 768 m, com o Danúbio no
      seu ponto mais estreito lá em baixo.


      De bicicleta, a rota Kožica–Boljetin tem 18 km por uma antiga estrada quase sem tráfego, com o ponto
      mais alto a 510 m. É o desvio número 12 do EuroVelo 6; o percurso ciclístico do Danúbio pelo parque
      totaliza cerca de 110 km.
    history: >-
      Há presença humana permanente, com achados como o povoado de Lepenski Vir, a antiga cidade de Golubac,
      restos da via de Trajano, a Tabula Traiana e o limes romano. Em Lepenski Vir, as escavações dos anos
      sessenta descobriram esculturas monumentais datadas entre 7.000 e 6.000 a.C. A fortaleza de Golubac, à
      entrada da Porta de Ferro, tem nove torres de 25 m unidas por uma muralha; a sua primeira menção escrita
      é de 1335 e esteve em mãos húngaras e otomanas.


      O Geoparque Đerdap abrange 1.330 km² e foi apresentado como primeiro candidato sérvio à Rede Mundial de
      Geoparques da UNESCO. Ao longo do desfiladeiro encontram-se sítios geológicos de quase todos os
      períodos, cobrindo cerca de mil milhões de anos.
    before: >-
      Pede-se que se goze da floresta em silêncio, que não se colham flores, não se partam ramos e não se
      perturbem os animais nem se danifiquem ninhos. Quase todas as rotas exigem visita organizada: contacte o
      parque antes de ir.
    around: >-
      A seis quilómetros fica o [Rewilding Planalto de Mehedinți](/lugar/rewilding-mehedinti-plateau/), a oito
      a [Reserva Natural Floresta Primária Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/),
      a quinze o [Parque Nacional Domogled – Vale do Cerna](/lugar/parcul-national-domogled---valea-cernei/) e
      a vinte e um o [Parque Nacional Gargantas do Nera –
      Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/).
