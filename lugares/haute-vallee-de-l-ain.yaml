resumen:
  es: >-
    El curso alto del Ain discurre por profundas gargantas calizas, hoces y resurgencias kársticas en el
    Macizo del Jura.
  en: >-
    The upper course of the Ain flows through deep limestone defiles, box-canyons, and karst resurgences in
    the Jura Mountains.
  fr: >-
    Le cours supérieur de l’Ain s’encaisse dans de profondes gorges calcaires, des cluses et des résurgences
    karstiques dans le massif du Jura.
  de: Der Oberlauf des Ain durchschneidet tiefe Kalksteinschluchten, Klusen und Karstaufbrüche im Jura-Massiv.
  it: >-
    L’alto corso dell’Ain scorre tra profonde gole calcaree, chiuse e risorgenze carsiche nel massiccio del
    Giura.
  pt: >-
    O curso superior do Ain corre por desfiladeiros calcários profundos, gargantas e ressurgências cársicas no
    Maciço do Jura.
unico:
  es: >-
    Un río que nace de golpe en una cascada, desaparece bajo tierra en las Pertes de l'Ain y vuelve a salir
    con fuerza en gargantas estrechas.
  en: >-
    A river bursting into existence as an abrupt waterfall, vanishing underground at the Pertes de l’Ain, and
    re-emerging violently through narrow gorges.
  fr: >-
    Une rivière qui jaillit brusquement en cascade, disparaît sous terre aux Pertes de l’Ain et resurgit avec
    fracas dans d’étroits défilés.
  de: >-
    Ein Fluss, der unvermittelt aus einem Wasserfall entspringt, in den Pertes de l’Ain im Boden verschwindet
    und in engen Felsklammen wieder aufbricht.
  it: >-
    Un fiume che sgorga all’improvviso in una cascata, scompare nel sottosuolo alle Pertes de l’Ain e risorge
    con forza in gole anguste.
  pt: >-
    Um rio que nasce abruptamente numa cascata, desaparece sob terra nas Pertes de l’Ain e ressurge com fúria
    em gargantas estreitas.
observaciones:
  es: >-
    La temporada va de mayo a octubre. El caudal del Ain cambia deprisa tras la lluvia, y en el Jura el río es
    conocido para el piragüismo.
texto:
  es:
    intro: >-
      El Ain no empieza como un río: empieza como una cascada que sale de una garganta estrecha, entre
      árboles, a unos 800 m de altitud. Es una exsurgencia kárstica: el agua llega por ríos subterráneos que
      recogen lo que escurre de las mesetas de Nozeroy y de Frasne y de los bosques de la Haute-Joux. La alta
      cuenca del Ain, entre Conte y las Pertes de l'Ain, es un tramo donde el agua desaparece y reaparece.
    landscape: >-
      Todo se explica por la piedra. La cuenca se asienta sobre calizas permeables, así que el agua se
      infiltra, circula bajo tierra y sale por exsurgencias, pérdidas y dolinas. Por eso el régimen del Ain es
      irregular: la lluvia provoca reacciones repentinas y breves. El río nace entre Conte y La Favière, a 681
      m, y recorre 189,9 km hasta el Ródano.


      La Source de l'Ain brota al pie de la meseta de Nozeroy, entre bosque de frondosas y resinosas. Río
      abajo, cerca de Bourg-de-Sirod, el Ain desaparece de golpe en el suelo antes de reaparecer más lejos:
      son las Pertes de l'Ain. El agua se encaja en gargantas estrechas excavadas en la caliza, con pozas,
      marmitas gigantes y cascadas, y cuando el caudal sube surge con fuerza y baja al fondo con un borbotón
      sordo.
    wildlife: >-
      En las orillas viven ánades, garcetas, cisnes, garzas y agachadizas. La [nutria
      europea](/especie/lutra_lutra/) fue discreta mucho tiempo, pero se la ve cada vez más desde 2003, y el
      [castor europeo](/especie/castor_fiber/) está presente sobre todo en el curso bajo. Entre los peces
      destacan la [trucha común](/especie/salmo_trutta/) y el tímalo. En el circuito de las Pertes puedes
      encontrarte con un [rebeco](/especie/rupicapra_rupicapra/), si llevas los ojos bien abiertos.


      La primavera y el otoño son las estaciones ideales para ir: las gargantas están frescas y el río lleva
      mucho caudal. En primavera, el sendero hacia la cascada del Moulin du Saut aparece bordeado de musgo y
      orquídeas silvestres.
    visit: >-
      La Source de l'Ain, a la que se llega desde un aparcamiento pequeño de Conte, es un buen primer paseo en
      familia. Un sendero de descubrimiento y varios itinerarios señalizados llevan al pie de la cascada y
      luego a lo alto, para ver el cauce desde arriba. Desde ese aparcamiento parten tres itinerarios, y
      paneles educativos plantean enigmas sobre la trucha fario, la hidroelectricidad y la fuerza del agua. La
      ruta circular Source de l'Ain et cascade du Moulin du Saut mide 10,6 km y dura tres horas. En el Moulin
      du Saut, valle encajado alimentado por el Serpentine, hay una cascada espectacular, y cerca otra, la del
      Saut des Maillys.


      Para las Pertes hay opciones: el Tour des Pertes de l'Ain sale del aparcamiento de los Chamois, cerca de
      Bourg-de-Sirod, hacia la «Chambre d'eau», con vistas al Ain y al valle. Es muy fácil, de 3,8 km y una
      hora, con un desnivel de unos ciento ochenta metros. El recorrido pasa por una capilla, una presa, la
      fuente de las Tobas, una pasarela sobre las gargantas muy estrechas y las antiguas forjas. Hay un paseo
      de ida y vuelta de 3 km accesible para personas con movilidad reducida, y un circuito más largo de 4 km.
      Las Pertes son un sitio acondicionado y asegurado, con pasarelas y paneles que cuentan su historia
      industrial y natural.
    history: >-
      El agua movió el Jura. Las Pertes de l'Ain alimentaron antiguas forjas hasta principios del siglo XX y
      después una central hidroeléctrica; en el Moulin du Saut quedan las ruinas de un molino, recuerdo de la
      importancia de la energía hidráulica. Hacia 1940 se abandonó el pueblo fortificado de Richebourg, del
      que quedan la capilla y algunos vestigios de casas, junto a las ruinas del castillo Villain. Más abajo,
      el río alimenta los lagos de Vouglans y de Coiselet; el de Vouglans, lleno desde 1968, tiene una cola de
      35 km.
    before: >-
      La temporada va de mayo a octubre. El caudal del Ain cambia deprisa tras la lluvia, y en el Jura el río
      es conocido para el piragüismo.
    around: >-
      Pegado al valle, a cero kilómetros, está el [Parque Natural Regional del Alto
      Jura](/lugar/parc-naturel-regional-du-haut-jura/). A cinco kilómetros están el [Valle y Gargantas del
      Río Loue](/lugar/la-loue---vallee-et-gorges/), a ocho el [Parque Natural Regional del Jura
      Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) y a quince el [Bosque de
      Chaux](/lugar/foret-de-chaux/). Más lejos, las [Gargantas del Río
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) comparten con el Ain la trucha común y el mirlo
      acuático.
  en:
    intro: >-
      The Ain does not begin as a modest mountain brook: it bursts forth directly as a waterfall cascading
      from a sheer rock fissure, surrounded by mossy woodlands at roughly 800 m altitude. It is a textbook
      karst resurgence, fed by vast subterranean river networks draining runoff from the high plateaus of
      Nozeroy and Frasne and the forests of Haute-Joux. The upper Ain basin, stretching between Conte and the
      Pertes de l’Ain, is a dynamic realm where surface waters continuously disappear underground and
      resurface.
    landscape: >-
      The bedrock explains every feature of this landscape. The drainage basin rests upon heavily fissured
      Jurassic limestone, allowing rainwater to infiltrate deeply, circulate through flooded cavern conduits,
      and resurge via springs, swallow holes, and blind valleys. Consequently, the Ain exhibits a flash-flood
      hydrologic regime, reacting abruptly to heavy precipitation. The river has its source between Conte and
      La Favière at 681 m, flowing for 189.9 km before joining the Rhône.


      The Source de l’Ain emerges at the foot of the Nozeroy plateau, nestled among mixed beech, fir, and
      spruce woods. Downstream, near Bourg-de-Sirod, the entire river plunges precipitously into a
      subterranean chasm before re-emerging further down: these are the Pertes de l’Ain. The surging torrent
      churns through narrow limestone defiles, carving deep plunge pools, giant potholes, and cascades,
      crashing with a muffled subterranean roar during high water.
    wildlife: >-
      Along the riverbanks dwell mallards, little egrets, mute swans, grey herons, and common snipe. The
      [Eurasian otter](/especie/lutra_lutra/) was elusive for decades but has been increasingly documented
      since 2003, while the [Eurasian beaver](/especie/castor_fiber/) colonizes the lower reaches. Prime fish
      species include wild [brown trout](/especie/salmo_trutta/) and grayling. Along the rim of the Pertes de
      l’Ain circuit, alert hikers may even spot an [alpine chamois](/especie/rupicapra_rupicapra/) on the
      rocky ledges.


      Spring and autumn are the ideal seasons to explore: the limestone defiles remain pleasantly cool and the
      river runs with vigorous flow. In spring, the walking path towards the Moulin du Saut waterfall is
      fringed with lush mosses and wild woodland orchids.
    visit: >-
      The Source de l’Ain, reached from a small parking area in Conte, offers an excellent family walk. An
      interpretive nature path and waymarked walking loops lead to the base of the cascade before ascending to
      a panoramic platform overlooking the sunken riverbed. Three themed routes set out from the trailhead,
      featuring educational panels detailing brown trout biology, hydropower history, and karst hydrology. The
      circular Source de l’Ain and Moulin du Saut cascade circuit covers 10.6 km and takes three hours. At
      Moulin du Saut, a deep side valley carved by the Serpentine stream forms a spectacular cascade, near
      another waterfall, the Saut des Maillys.


      At the Pertes de l’Ain, multiple options exist: the Tour des Pertes departs the Chamois car park near
      Bourg-de-Sirod, climbing towards the “Chambre d’eau” viewpoint with sweeping panoramas of the gorge. It
      is an easy walk covering 3.8 km in an hour, with an elevation gain of roughly one hundred and eighty
      metres, taking in a chapel, an old weir, the Tufs spring, footbridges suspended over narrow slots, and
      historic iron forge ruins. An accessible 3 km out-and-back trail accommodates reduced-mobility visitors,
      while a longer circuit measures 4 km. The Pertes site is fully secured with engineered walkways,
      guardrails, and informative interpretive panels.
    history: >-
      Running water historically powered the Jura. The Pertes de l’Ain drove ironworks until the early XX
      century before conversion into a small hydro plant; at Moulin du Saut, crumbling millstones commemorate
      centuries of water-powered milling. Around 1940, the fortified medieval village of Richebourg was
      abandoned, leaving a chapel and stone foundations alongside the ruins of Château Villain. Further
      downstream, the river feeds the massive reservoirs of Vouglans and Coiselet; Vouglans, filled in 1968,
      extends upstream for 35 km.
    before: >-
      The prime visitor season runs from May through October. Water levels along the Ain rise swiftly
      following heavy rains, and the river is widely celebrated across the Jura for whitewater canoeing.
    around: >-
      Directly bordering the valley, zero kilometres away, lies [Haut-Jura Regional Natural
      Park](/lugar/parc-naturel-regional-du-haut-jura/). Five kilometres distant extends the [Loue River
      Valley and Gorges](/lugar/la-loue---vallee-et-gorges/), eight kilometres away is [Jura Vaudois Regional
      Natural Park](/lugar/parc-naturel-regional-jura-vaudois/), and fifteen kilometres away rises the [Chaux
      Forest](/lugar/foret-de-chaux/). Farther afield, the [Gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) share brown trout and dippers.
  fr:
    intro: >-
      L’Ain ne commence pas comme un ruisseau ordinaire : il jaillit directement sous la forme d’une cascade
      s’échappant d’une gorge étroite, au milieu des bois, à environ 800 m d’altitude. C’est une exsurgence
      karstique : l’eau provient de galeries souterraines drainant les pluies des plateaux de Nozeroy et de
      Frasne et des forêts de la Haute-Joux. Le haut bassin de l’Ain, entre Conte et les Pertes de l’Ain,
      constitue un secteur singulier où l’eau disparaît et réapparaît sans cesse.
    landscape: >-
      Le calcaire explique chaque facette du relief. Le bassin repose sur des couches calcaires fissurées où
      l’eau s’infiltre, chemine sous terre et ressort par exsurgences, pertes et dolines. Le régime de l’Ain
      s’avère donc contrasté : les pluies provoquent des crues subites et violentes. La rivière naît entre
      Conte et La Favière à 681 m d’altitude et parcourt 189,9 km jusqu’au Rhône.


      La source de l’Ain jaillit au pied du plateau de Nozeroy, au cœur d’une forêt mêlant feuillus et
      conifères. En aval, près de Bourg-de-Sirod, l’Ain s’engouffre d’un coup dans une fracture rocheuse avant
      de réapparaître plus loin : ce sont les Pertes de l’Ain. Les flots se resserrent dans des gorges
      taillées dans la roche, jalonnées de marmites de géants et de cascades, grondant sourdement en période
      de crue.
    wildlife: >-
      Les berges accueillent canards colverts, aigrettes, cygnes tuberculés, hérons et bécassines. La [loutre
      d’Europe](/especie/lutra_lutra/) y fut longtemps discrète mais s’observe plus régulièrement depuis 2003,
      tandis que le [castor d’Europe](/especie/castor_fiber/) peuple surtout les secteurs plus calmes. Parmi
      les poissons prédominent la [truite fario](/especie/salmo_trutta/) et l’ombre commun. Sur les
      escarpements du sentier des Pertes, un regard attentif peut surprendre un
      [chamois](/especie/rupicapra_rupicapra/).


      Le printemps et l’automne sont les saisons privilégiées : les gorges conservent une fraîcheur agréable
      et le débit reste soutenu. Au printemps, le sentier menant à la cascade du Moulin du Saut se pare de
      mousses épaisses et d’orchidées sauvages.
    visit: >-
      La source de l’Ain, accessible depuis un parking aménagé à Conte, constitue une promenade idéale en
      famille. Un sentier d’interprétation et plusieurs boucles balisées mènent au pied de la cascade puis sur
      le belvédère sommital dominant le lit du torrent. Trois circuits partent de ce point, équipés de bornes
      ludiques sur la truite, l’hydroélectricité et la force motrice de l’eau. La boucle Source de l’Ain et
      cascade du Moulin du Saut totalise 10,6 km en trois heures. Au Moulin du Saut, le vallon encaissé de la
      Serpentine forme une chute spectaculaire, voisine de la cascade du Saut des Maillys.


      Aux Pertes de l’Ain, le Tour des Pertes part du parking des Chamois près de Bourg-de-Sirod vers la «
      Chambre d’eau ». Ce parcours très facile fait 3,8 km en une heure pour un dénivelé d’environ cent
      quatre-vingts mètres, découvrant chapelle, barrage, source des Tufs, passerelles au-dessus du gouffre et
      vestiges d’anciennes forges. Un aller-retour accessible de 3 km est aménagé pour les personnes à
      mobilité réduite, complété par une boucle de 4 km. Le site est sécurisé par des platelages en bois et
      jalonné de panneaux historiques.
    history: >-
      L’eau a forgé l’artisanat jurassien. Les Pertes de l’Ain actionnèrent d’anciennes forges jusqu’au début
      du XXe siècle, converties ensuite en microcentrale ; au Moulin du Saut subsistent les vestiges de meules
      hydrauliques. Vers 1940, le village perché fortifié de Richebourg fut abandonné, laissant chapelle et
      soubassements près des ruines du château Villain. Plus bas, la rivière alimente les retenues de Vouglans
      et de Coiselet ; le lac de Vouglans, mis en eau en 1968, s’étire sur 35 km.
    before: >-
      La saison recommandée court de mai à octobre. Le débit de l’Ain varie très vite après les orages, et la
      rivière est un haut lieu du canoë-kayak jurassien.
    around: >-
      Contigu à la vallée, à zéro kilomètre, s’étend le [parc naturel régional du
      Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/). À cinq kilomètres se trouvent la [vallée et les
      gorges de la Loue](/lugar/la-loue---vallee-et-gorges/), à huit le [parc naturel régional Jura
      vaudois](/lugar/parc-naturel-regional-jura-vaudois/) et à quinze la [forêt de
      Chaux](/lugar/foret-de-chaux/). Plus loin, les [gorges du
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) partagent truites et cincles.
  de:
    intro: >-
      Der Ain beginnt nicht als Bergbach, sondern stürzt als Wasserfall aus einer Felsspalte mitten im
      Bergwald auf rund 800 m Meereshöhe empor. Es handelt sich um eine Karstexsurgienz: Unterirdische
      Wasserläufe sammeln Niederschläge der Hochebenen von Nozeroy und Frasne sowie der Wälder der Haute-Joux.
      Das obere Einzugsgebiet zwischen Conte und den Pertes de l’Ain ist eine Landschaft, in der das Wasser
      ständig im Untergrund verschwindet und wieder auftaucht.
    landscape: >-
      Der poröse Jurakalkstein prägt das Talbild. Wasser sickert in Klüfte ein, fließt unterirdisch und tritt
      an Quellen, Schlucklöchern und Dolinen zutage. Daher reagiert der Ain rasch auf Niederschläge mit
      starken Wasserstandsschwankungen. Der Fluss entspringt zwischen Conte und La Favière auf 681 m Höhe und
      fließt über 189,9 km zur Rhone.


      Die Source de l’Ain entspringt am Fuß des Plateaus von Nozeroy inmitten von Mischwäldern. Flussabwärts
      bei Bourg-de-Sirod versickert der Ain plötzlich im felsigen Untergrund, um weiter talabwärts wieder
      aufzutauchen: Das sind die Pertes de l’Ain. Das Wasser schießt durch enge Kalkklammen voller
      Auskolkungen, Gletschermühlen und Kaskaden und tost bei Hochwasser ohrenbetäubend.
    wildlife: >-
      An den Ufern leben Stockenten, Seidenreiher, Höckerschwäne, Graureiher und Bekassinen. Der
      [Fischotter](/especie/lutra_lutra/) war lange Zeit verschollen, wird jedoch seit 2003 wieder regelmäßig
      nachgewiesen, während der [Europäische Biber](/especie/castor_fiber/) vor allem die ruhigeren Abschnitte
      besiedelt. Unter den Fischen dominieren die [Bachforelle](/especie/salmo_trutta/) und die Äsche. Auf den
      Felsbändern der Klammstrecke lässt sich mit etwas Glück eine [Gämse](/especie/rupicapra_rupicapra/)
      erspähen.


      Frühling und Herbst bieten ideale Bedingungen: Die Schluchten bleiben angenehm kühl und der Fluss führt
      reichlich Wasser. Im Frühjahr säumen dichte Moospolster und wilde Waldorchideen den Wanderpfad zum
      Wasserfall Moulin du Saut.
    visit: >-
      Die Source de l’Ain mit Parkplatz bei Conte ist ein ideales Ausflugsziel für Familien. Ein Lehrpfad und
      markierte Rundwege führen zum Fuß des Wasserfalls und hinauf zu einer Aussichtsplattform über der Klamm.
      Drei Wanderrouten starten am Parkplatz, ergänzt durch Infotafeln zu Bachforelle, Wasserkraft und
      Geologie. Der Rundweg Source de l’Ain et cascade du Moulin du Saut misst 10,6 km und dauert drei
      Stunden. Am Moulin du Saut bildet der Serpentine-Bach eine malerische Kaskade nahe dem Wasserfall Saut
      des Maillys.


      An den Pertes de l’Ain startet die Tour des Pertes am Parkplatz Chamois bei Bourg-de-Sirod zur
      Aussichtsstelle „Chambre d’eau“. Diese leichte Runde misst 3,8 km in einer Stunde bei rund
      einhundertachtzig Höhenmetern und passiert eine Kapelle, ein Wehr, die Tuffquellen, Hängestege über der
      Felsklamm und historische Eisenhämmer. Ein 3 km langer barrierefreier Weg ist rollstuhlgerecht
      ausgebaut; eine erweiterte Runde umfasst 4 km. Holzstege und Schautafeln sichern und erklären das
      Naturdenkmal.
    history: >-
      Die Wasserkraft trieb die Industrialisierung im Jura an. Die Pertes de l’Ain trieben bis ins frühe XX.
      Jahrhundert Eisenhämmer und später ein Elektrizitätswerk an; am Moulin du Saut erinnern Mühlenruinen an
      die alte Wassernutzung. Um 1940 wurde das befestigte Höhendorf Richebourg aufgegeben; erhalten blieben
      die Kapelle und Mauerreste neben der Burgruine Villain. Flussabwärts speist der Ain die Stauseen
      Vouglans und Coiselet; der 1968 geflutete Lac de Vouglans staut den Fluss über 35 km auf.
    before: >-
      Die Saison reicht von Mai bis Oktober. Der Wasserstand des Ain ändert sich nach Gewittern rasch; der
      Fluss ist im Jura für Kanutouren bekannt.
    around: >-
      Direkt an das Tal grenzt in null Kilometern Entfernung der [Regionale Naturpark
      Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/). Fünf Kilometer entfernt liegt das [Loue-Tal mit
      Schluchten](/lugar/la-loue---vallee-et-gorges/), acht Kilometer der [Regionale Naturpark Jura
      vaudois](/lugar/parc-naturel-regional-jura-vaudois/) und fünfzehn Kilometer der [Wald von
      Chaux](/lugar/foret-de-chaux/). Weiter flussabwärts teilen die
      [Doubs-Schluchten](/lugar/gorges-du-doubs---franco-suisses/) Forellen- und Wasseramselvorkommen.
  it:
    intro: >-
      L’Ain non nasce come un normale ruscello di montagna: scaturisce direttamente come una cascata che balza
      da una stretta spaccatura tra i boschi, a circa 800 m di altitudine. Si tratta di un’esorgenza carsica:
      le acque affluiscono da condotti sotterranei che drenano le piogge degli altopiani di Nozeroy e di
      Frasne e delle foreste dell’Haute-Joux. L’alto bacino dell’Ain, tra Conte e le Pertes de l’Ain, è un
      territorio in cui il fiume scompare e rispunta in continuazione.
    landscape: >-
      La natura calcarea spiega ogni fenomeno geologico. Il bacino poggia su strati calcarei fessurati in cui
      l’acqua penetra, scorre nel sottosuolo e riemerge attraverso risorgive, inghiottitoi e doline. Di
      conseguenza il regime dell’Ain è discontinuo, con piene fulminee dopo i temporali. Il fiume nasce tra
      Conte e La Favière a 681 m di quota e percorre 189,9 km prima di confluire nel Rodano.


      La Source de l’Ain sgorga alla base dell’altopiano di Nozeroy, incorniciata da boschi misti di faggio e
      conifere. Più a valle, vicino a Bourg-de-Sirod, l’Ain sprofonda improvvisamente in una fenditura prima
      di ricomparire più avanti: sono le Pertes de l’Ain. Le acque si incanalano in forre erose nella roccia,
      tra marmitte dei giganti e cascate, producendo un cupo boato nei periodi di piena.
    wildlife: >-
      Lungo le sponde nidificano germani reali, garzette, cigni reali, aironi e beccaccini. La [lontra
      europea](/especie/lutra_lutra/) è stata elusiva per decenni ma viene segnalata regolarmente dal 2003,
      mentre il [castoro europeo](/especie/castor_fiber/) frequenta i tratti vallivi più lenti. Tra i pesci
      spiccano la [trota fario](/especie/salmo_trutta/) e il temolo. Lungo le cenge del sentiero delle Pertes,
      con un po’ di attenzione, si può scorgere il [camoscio](/especie/rupicapra_rupicapra/).


      Primavera e autunno rappresentano i periodi migliori: le gole rimangono fresche e il fiume scorre a
      pieno regime. In primavera il tracciato per la cascata del Moulin du Saut è ammantato di muschi e
      orchidee selvatiche.
    visit: >-
      La Source de l’Ain, accessibile da un parcheggio a Conte, costituisce una facile passeggiata per
      famiglie. Un percorso didattico e anelli segnalati portano alla base della cascata e poi al belvedere
      panoramico superiore. Dal parcheggio partono tre itinerari con pannelli esplicativi su trote,
      idroelettricità e forza motrice dell’acqua. L’anello Source de l’Ain e cascata del Moulin du Saut copre
      10,6 km in tre ore. Al Moulin du Saut la forra della Serpentine genera una cascata scenografica, vicina
      al salto dei Maillys.


      Per visitare le Pertes de l’Ain il Tour des Pertes parte dal parcheggio dei Chamois presso
      Bourg-de-Sirod verso la «Chambre d’eau». È un anello agevole di 3,8 km in un’ora con circa centottanta
      metri di dislivello, toccando una cappella, una chiusa, la sorgente dei Tufi, passerelle sospese
      sull’abisso e antiche fucine. Un percorso andata e ritorno di 3 km è fruibile per persone a mobilità
      ridotta, affiancato da un circuito lungo di 4 km. Il sito è interamente attrezzato con passerelle lignee
      e cartelli storici.
    history: >-
      L’energia idraulica ha mosso l’industria del Giura. Le Pertes de l’Ain azionarono ferriere fino a inizio
      Novecento, poi convertite in centrale idroelettrica; al Moulin du Saut restano macine che testimoniano
      secoli di molitura. Verso il 1940 venne abbandonato il borgo fortificato di Richebourg, di cui rimangono
      la cappella e murature accanto al castello Villain. Più a valle il fiume alimenta i bacini di Vouglans e
      Coiselet; il lago di Vouglans, creato nel 1968, si snoda per 35 km.
    before: >-
      La stagione consigliata va da maggio a ottobre. La portata dell’Ain muta repentinamente con i temporali;
      nel Giura il fiume è molto apprezzato per la canoa fluviale.
    around: >-
      Contiguo alla valle, a zero chilometri, si estende il [Parco Naturale Regionale
      dell’Haut-Jura](/lugar/parc-naturel-regional-du-haut-jura/). A cinque chilometri si trovano la [Valle e
      Gole della Loue](/lugar/la-loue---vallee-et-gorges/), a otto il [Parco Naturale Regionale del Jura
      Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) e a quindici la [Foresta di
      Chaux](/lugar/foret-de-chaux/). Più a valle le [Gole del
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) condividono trote e merli acquaioli.
  pt:
    intro: >-
      O Ain não principia como um regato comum: irrompe de imediato sob a forma de cascata a brotar de uma
      fenda estreita entre o arvoredo, a cerca de 800 m de altitude. Trata-se de uma exsurgência cársica: a
      água provém de galerias subterrâneas que drenam as chuvas dos planaltos de Nozeroy e Frasne e das matas
      da Haute-Joux. A alta bacia do Ain, entre Conte e as Pertes de l’Ain, é um território fascinante onde o
      curso de água desaparece e reaparece ciclicamente.
    landscape: >-
      O calcário jurássico explica todos os traços geomorfológicos. A bacia hidrográfica assenta em bancadas
      permeáveis onde as chuvas se infiltram, circulam no subsolo e emergem por nascentes, sumidouros e
      dolinas. Daí decorre o regime torrencial do Ain, sujeito a subidas repentinas após chuvadas. O rio nasce
      entre Conte e La Favière a 681 m de altitude e percorre 189,9 km até se juntar ao Ródano.


      A Source de l’Ain brota no sopé do planalto de Nozeroy, entre faiais e coníferas. Mais a jusante, perto
      de Bourg-de-Sirod, o Ain precipita-se abruptamente numa fenda antes de reaparecer mais longe: são as
      Pertes de l’Ain. As águas espremem-se por gargantas esculpidas no calcário, formando marmitas de gigante
      e cascatas, ribombando com violência nas épocas de cheia.
    wildlife: >-
      Nas margens habitam patos-reais, garças-brancas-pequenas, cisnes-mudos, garças-reais e narcejas. A
      [lontra-europeia](/especie/lutra_lutra/) permaneceu discreta durante décadas, mas é avistada com
      regularidade crescente desde 2003, enquanto o [castor-europeu](/especie/castor_fiber/) coloniza os
      setores mais calmos. Entre a ictiofauna avultam a [truta-fario](/especie/salmo_trutta/) e o tímalo. Nos
      declives escarpados do trilho das Pertes, com atenção apurada, pode avistar-se a
      [camurça](/especie/rupicapra_rupicapra/).


      A primavera e o outono proporcionam passeios ideais: os desfiladeiros mantêm uma frescura reconfortante
      e o caudal segue abundante. Na primavera, o trilho para a cascata do Moulin du Saut marginam-se de
      musgos e orquídeas bravas.
    visit: >-
      A Source de l’Ain, servida por parque de estacionamento em Conte, constitui um belo passeio familiar. Um
      percurso didático e anéis pedestres sinalizados descem até à cascata e sobem a um miradouro com vista
      superior sobre o leito. Do parque partem três itinerários dotados de painéis sobre a truta, a energia
      hidroelétrica e a força da água. O circuito circular Source de l’Ain e cascata do Moulin du Saut
      totaliza 10,6 km em três horas. No Moulin du Saut, a garganta recortada pela ribeira Serpentine forma
      uma imponente queda de água, próxima da cascata do Saut des Maillys.


      Nas Pertes de l’Ain, o Tour des Pertes parte do parque dos Chamois junto a Bourg-de-Sirod rumo à
      «Chambre d’eau». É um trilho fácil de 3,8 km em uma hora e cerca de cento e oitenta metros de desnível,
      visitando uma capela, açude, fonte das Tufas, passadiços sobre a ravina e antigas forjas. Um percurso de
      ida e volta de 3 km é acessível a pessoas com mobilidade condicionada, existindo ainda uma volta de 4
      km. O local dispõe de passadiços e sinalética histórica.
    history: >-
      A força motriz da água impulsionou o Jura. As Pertes de l’Ain alimentaram forjas tradicionais até ao
      início do século XX, transformadas depois em pequena central hidroelétrica; no Moulin du Saut persistem
      ruínas de azenhas históricas. Por volta de 1940 a povoação fortificada de Richebourg foi abandonada,
      restando a capela e alicerces perto do castelo Villain. A jusante, o rio alimenta as albufeiras de
      Vouglans e Coiselet; a de Vouglans, criada em 1968, prolonga-se por 35 km.
    before: >-
      A melhor época estende-se de maio a outubro. O caudal do Ain oscila muito depressa após trovoadas; no
      Jura o rio é bastante afamado para a canoagem.
    around: >-
      Contíguo ao vale, a zero quilómetros, situa-se o [Parque Natural Regional do Alto
      Jura](/lugar/parc-naturel-regional-du-haut-jura/). A cinco quilómetros fica o [Vale e Desfiladeiros do
      Rio Loue](/lugar/la-loue---vallee-et-gorges/), a oito o [Parque Natural Regional Jura
      Vaudois](/lugar/parc-naturel-regional-jura-vaudois/) e a quinze a [Floresta de
      Chaux](/lugar/foret-de-chaux/). Mais a jusante, as [Gargantas do
      Doubs](/lugar/gorges-du-doubs---franco-suisses/) partilham trutas e melros-d’água.
