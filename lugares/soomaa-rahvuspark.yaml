resumen:
  es: >-
    Grandes turberas elevadas separadas por ríos que se desbordan cada primavera: la «quinta estación», cuando
    se navega en canoa entre los árboles.
  en: >-
    Expansive raised bogs severed by meandering rivers that overflow each spring: the «fifth season», when
    canoeists paddle between submerged trees.
  fr: >-
    Vastes tourbières bombées ceinturées de rivières qui débordent chaque printemps : la «cinquième saison»,
    vécue en canoë à travers les forêts inondées.
  de: >-
    Ausgedehnte Hochmoore, getrennt durch mäandrierende Flüsse, die jeden Frühling über die Ufer treten: die
    «fünfte Jahreszeit», in der man im Kanu durch den Wald paddelt.
  it: >-
    Vaste torbiere alte separate da fiumi meandriformi che straripano ogni primavera: la «quinta stagione», da
    esplorare in canoa tra gli alberi allagati.
  pt: >-
    Grandes turfeiras altas separadas por rios meândricos que transbordam na primavera: a «quinta estação»,
    percorrida em canoa por entre as copas das árvores.
unico:
  es: >-
    Es probablemente el único lugar de Europa donde la tradición de las canoas monóxilas llegó viva al siglo
    XXI, y donde la crecida de primavera se ha convertido en una estación más.
  en: >-
    It is arguably the only place in Europe where the prehistoric tradition of dugout canoes survived intact
    into the twenty-first century, and where spring flooding constitutes a recognized fifth season.
  fr: >-
    C'est sans doute le seul endroit en Europe où la tradition millénaire des pirogues monoxyles est parvenue
    vivante au XXIe siècle, et où la crue printanière est devenue une véritable cinquième saison.
  de: >-
    Wohl der einzige Ort in Europa, an dem die uralte Tradition der Einbäume lebendig bis ins
    einundzwanzigsten Jahrhundert reichte und wo das Frühjahrshochwasser als eigenständige fünfte Jahreszeit
    gilt.
  it: >-
    È probabilmente l'unico luogo in Europa dove la tradizione ancestrale delle piroghe monossili è giunta
    intatta al XXI secolo e dove la piena primaverile è considerata una vera e propria quinta stagione.
  pt: >-
    É porventura o único recanto da Europa onde a tradição milenar das canoas monóxilas sobreviveu viva até ao
    século XXI e onde a cheia de primavera se consolidou como uma autêntica quinta estação.
observaciones:
  es: >-
    Usa solo caminos y aparcamientos señalados: las turbas blandas no aguantan el peso de los vehículos.
    Durante la crecida el agua cubre las carreteras y deja aisladas zonas del parque. Mejor época para las
    aguas altas: finales de marzo y principios de abril.
texto:
  es:
    intro: >-
      A finales de marzo o principios de abril, el agua sube. En algunos años ha llegado a subir un metro al
      día durante tres o cuatro días. Cubre las praderas, se mete entre los árboles, tapa las carreteras y
      deja aisladas zonas enteras del parque. En Soomaa a eso se le llama la quinta estación, y se vive en
      canoa. Soomaa significa «tierra de turberas»: un parque nacional de unos 398 km² formado por cinco
      turberas (Valgeraba, Öördi, Riisa, Kikepera y Kuresoo), separadas por los ríos Navesti, Halliste, Raudna
      y Lemmjõgi. Se creó en 1993 para proteger grandes turberas elevadas, praderas inundables, bosques
      pantanosos y ríos meándricos.
    landscape: >-
      La estación de las aguas altas tiene nombre propio: la zona inundable de Riisa llega a 175 km², la mayor
      inundada con regularidad de Estonia y del norte de Europa. Con el nivel máximo, la zona inundada puede
      medir 7-8 km de ancho, y las turberas elevadas, de pendientes empinadas, quedan como islas en el agua.
      Las crecidas vienen sobre todo con el deshielo rápido, cuando el agua de la nieve no cabe en los cauces.


      Cuando el agua baja, quedan las turberas. La de Kuresoo es una de las dos grandes turberas mejor
      conservadas de Estonia, y su ladera sur, sobre el Lemmejõgi, sube 8 metros en solo 100 m. Y en el borde
      este del parque están las dunas más altas de la Estonia continental, a unos 50 km de la costa actual;
      las de Ruunaraipe llegan a 12 metros.


      Las praderas aluviales y los bosques de ribera tienen gran valor botánico, con unas 200 especies, entre
      ellas Gladiolus imbricatus, Iris sibirica y Sedum telephium. En total, Soomaa tiene casi 540 especies de
      plantas vasculares, más de 200 de musgos y más de 360 de hongos, con al menos 29 protegidas.
    wildlife: >-
      En Soomaa vive buena parte de la gran fauna de Estonia. El corzo, el [alce](/especie/alces_alces/) y el
      [jabalí](/especie/sus_scrofa/) son los grandes mamíferos más numerosos, y el
      [castor](/especie/castor_fiber/), el [lince](/especie/lynx_lynx/), el [lobo](/especie/canis_lupus/) y el
      [oso pardo](/especie/ursus_arctos/) también son frecuentes. El parque es una de las principales zonas de
      estudio de grandes carnívoros y herbívoros de Estonia, con seguimiento telemétrico del lince y del lobo
      desde 2004. En total hay más de 40 especies de mamíferos, unas 150 de aves, 20 de peces, cuatro de
      reptiles, seis de anfibios y 35 de libélulas.


      Para las aves, la parada principal son los pasos migratorios. Mantiene con regularidad más del 1 % de
      las poblaciones de cisne chico y [grulla común](/especie/grus_grus/): en otoño paran unas 1.000 grullas
      y 500 cisnes, y en primavera unos 2.000 cisnes. Entre las aves registradas están el [águila
      real](/especie/aquila_chrysaetos/), el zarapito trinador (más de 100 parejas), el chorlito dorado
      europeo (unas 150), el esmerejón, el lagópodo y el aguilucho cenizo.
    visit: >-
      Empieza en el centro de visitantes, en el corazón del parque. Se terminó en 1998, en el antiguo cruce de
      caminos de invierno entre Pärnu y Viljandi. Su exposición permanente se titula «Viajando por Soomaa en
      una canoa monóxila», y junto a él empieza el sendero del Castor. Tiene información de varios senderos,
      guías y películas. El centro abre del 31 de agosto al 31 de mayo de martes a sábado de 10.00 a 16.00, y
      del 1 de junio al 30 de agosto de lunes a viernes de 09.00 a 17.00 y fines de semana de 10.00 a 18.00.


      Los senderos se hacen a pie y en tablas sobre la turbera. Riisa (5 km, unas 3 h) e Ingatsi (4,5 km, unas
      3 h) llevan a torres de observación sobre las turberas de Riisa y Kuresoo. El del Castor mide 2 km (1,5
      h) y recorre el hábitat del castor y un bosque encharcado. El de Tõramaa, de 2,5 km y unas 3 h, cruza la
      pradera de Halliste, rica en aves, y tiene torre de observación. El de Kuresoo, de 32 km y dos días,
      enlaza paisajes y lugares de interés cultural. La red del parque dispone de tramos de pasarela
      accesibles para sillas de ruedas y cochecitos.


      En canoa, la temporada va de abril a octubre; hay excursiones guiadas en canoas monóxilas tradicionales
      y campamentos de construcción en verano. En invierno, con la turbera helada, se organizan excursiones en
      raquetas y trineo y, con nieve, esquí de fondo.


      Desde la torre de la pradera arbolada de Tõramaa, junto al río Halliste, se ven animales y aves, robles
      antiguos y, con la crecida, el agua ondulante o la llanura helada.
    history: >-
      Soomaa es sitio Ramsar desde 1997 y Natura 2000 desde 2004. En 2009 se unió a la red de espacios
      salvajes PAN Parks como mayor sistema de turbera intacto de Europa conservado como naturaleza salvaje.
      La población humana ha caído más de diez veces; en 2011 vivían 87 personas.
    before: >-
      Usa solo caminos y aparcamientos señalados: las turbas blandas no aguantan el peso de los vehículos.
      Durante la crecida el agua cubre las carreteras y deja aisladas zonas del parque. Mejor época para las
      aguas altas: finales de marzo y principios de abril.
    around: >-
      Soomaa no tiene vecinos cercanos en el atlas, pero sí lugares lejanos con los que comparte hábitats y
      especies. El [Parque Nacional de Šumava](/lugar/narodni-park-sumava/) y el [Parque Nacional de Kampinos
      - Reserva Estricta](/lugar/kampinoski-park-narodowy---sektory/) comparten los humedales, los bosques
      maduros, el alce, el castor y el lince; el [Parque Nacional de
      Aukštaitija](/lugar/aukstaitijos-nacionalinis-parkas/) y el [Parque Nacional de
      Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/), el alce, el castor y el lobo.
  en:
    intro: >-
      In late March or early April, the waters rise abruptly. In certain years levels have surged by one meter
      a day for three or four days in succession. Floods submerge meadows, infiltrate forests, swallow roads,
      and leave entire sectors of the park cut off from dry land. In Soomaa this annual deluge is celebrated
      as the fifth season, and travel is by canoe. Soomaa literally means «land of bogs»: a national park of
      some 398 km² formed by five vast raised bogs (Valgeraba, Öördi, Riisa, Kikepera, and Kuresoo), separated
      by the Navesti, Halliste, Raudna, and Lemmjõgi rivers. It was established in 1993 to preserve raised
      bogs, floodplains, swamp forests, and meandering rivers.
    landscape: >-
      The high-water phenomenon is immense: the Riisa floodplain extends across 175 km², forming the largest
      regular seasonal inundation zone in Estonia and northern Europe. At peak water levels, the flooded
      expanse can measure 7-8 km in breadth, with steep-edged raised bogs standing out like isolated islands
      in a vast lake. Flooding is triggered by rapid spring snowmelt when swollen meltwater overwhelms river
      channels.


      When the floodwaters recede, the peat domes dominate the horizon. Kuresoo is one of the two
      best-preserved expansive raised bogs in Estonia; its southern margin drops 8 meters toward the Lemmjõgi
      across a span of only 100 m. Along the eastern fringe of the park rise the highest inland sand dunes in
      mainland Estonia, roughly 50 km from the current Baltic coast; the Ruunaraipe dunes reach 12 meters in
      height.


      Alluvial meadows and riparian woodlands hold tremendous botanical interest, supporting some 200 plant
      species including Gladiolus imbricatus, Iris sibirica, and Sedum telephium. In total, Soomaa sustains
      nearly 540 vascular plant species, over 200 bryophytes, and more than 360 fungi, with at least 29
      species under statutory protection.
    wildlife: >-
      Soomaa shelters a substantial share of Estonia's large mammal fauna. Roe deer,
      [moose](/especie/alces_alces/), and [wild boar](/especie/sus_scrofa/) represent the most abundant
      ungulates, while [Eurasian beaver](/especie/castor_fiber/), [Eurasian lynx](/especie/lynx_lynx/), [grey
      wolf](/especie/canis_lupus/), and [brown bear](/especie/ursus_arctos/) occur regularly. The park
      functions as a key research hub for Estonian large carnivores and herbivores, featuring continuous GPS
      tracking of lynx and wolves since 2004. Mammal species exceed 40, accompanied by roughly 150 bird
      species, 20 fish, four reptiles, six amphibians, and 35 dragonfly species.


      For avifauna, the park serves as a prime migratory staging ground. It consistently hosts over 1 % of
      regional populations of Bewick's swan and [common crane](/especie/grus_grus/): in autumn roughly 1,000
      cranes and 500 swans stage here, whereas spring passage gathers around 2,000 swans. Recorded nesting or
      staging raptors and waders include [golden eagle](/especie/aquila_chrysaetos/), whimbrel (over 100
      breeding pairs), European golden plover (about 150 pairs), merlin, willow ptarmigan, and Montagu's
      harrier.
    visit: >-
      Start at the visitor center in the heart of the park at Kõrtsi-Tõramaa. Completed in 1998 at a historic
      winter crossroads between Pärnu and Viljandi, it hosts the permanent exhibition «Travelling in Soomaa in
      an Expanded Dugout Canoe», with the Beaver Trail setting off directly outside. The center offers trail
      maps, guidebooks, and films. From 31 August to 31 May it opens Tuesday to Saturday from 10.00 to 16.00,
      and from 1 June to 30 August Monday to Friday from 09.00 to 17.00 and weekends from 10.00 to 18.00.


      Trails combine footpaths and raised wooden boardwalks across the wet peat. Riisa (5 km, about 3 h) and
      Ingatsi (4.5 km, about 3 h) lead to timber observation towers overlooking the Riisa and Kuresoo bogs.
      The Beaver Trail covers 2 km (1.5 h) through beaver habitat and flooded forest. The Tõramaa Trail, 2.5
      km long and requiring around 3 h, traverses the bird-rich Halliste floodplain meadow and features a
      wildlife viewing tower. The Kuresoo Trail, spanning 32 km over two days, links wilderness landscapes and
      cultural sites. The trail network includes boardwalk sections accessible for wheelchairs and strollers.


      Canoeing season spans from April to October; outfitters offer guided excursions in traditional aspen
      dugout canoes and summer dugout-building workshops. In winter, when bogs freeze solid, snowshoeing and
      kicksled trips take place, alongside cross-country skiing when snow cover allows.


      From the observation tower overlooking the wooded meadow of Tõramaa along the Halliste river, you can
      watch wildlife, ancient oaks, and seasonal high water or frozen floodplains.
    history: >-
      Soomaa has been designated a Ramsar wetland since 1997 and joined Natura 2000 in 2004. In 2009 it
      received PAN Parks wilderness certification as one of the largest pristine bog wilderness complexes in
      Europe. Human population density has plummeted more than tenfold; in 2011 only 87 residents lived within
      the park.
    before: >-
      Stick strictly to marked trails and designated parking areas: soft peat soils cannot support vehicular
      weight. During spring flooding water inundates access roads and isolates park sectors. The premier
      window for experiencing the high-water phenomenon is late March and early April.
    around: >-
      While Soomaa has no immediate neighbors in the atlas, it shares ecological affinities with distant
      wilderness areas. [Šumava National Park](/lugar/narodni-park-sumava/) in Czechia and [Kampinos National
      Park - Strict Protection Area](/lugar/kampinoski-park-narodowy---sektory/) in Poland share peatlands,
      mature woodlands, moose, beaver, and lynx; [Aukštaitija National
      Park](/lugar/aukstaitijos-nacionalinis-parkas/) and [Žemaitija National
      Park](/lugar/zemaitijos-nacionalinis-parkas/) in Lithuania share moose, beaver, and wolf.
  fr:
    intro: >-
      Fin mars ou début avril, les eaux montent brutalement. Certaines années, le niveau grimpe d'un mètre par
      jour pendant trois ou quatre jours consécutifs. La crue submerge les prairies, envahit les sous-bois,
      engloutit les routes et isole des pans entiers du parc. À Soomaa, cette inondation porte le nom de
      cinquième saison, et le canoë devient l'unique moyen de déplacement. Soomaa signifie «terre de
      tourbières» : un parc national d'environ 398 km² constitué de cinq grandes tourbières bombées
      (Valgeraba, Öördi, Riisa, Kikepera et Kuresoo), séparées par les rivières Navesti, Halliste, Raudna et
      Lemmjõgi. Il a été créé en 1993 pour préserver tourbières hautes, prairies inondables, forêts
      marécageuses et cours d'eau méandreux.
    landscape: >-
      La saison des hautes eaux impressionne : la plaine inondable de Riisa s'étend sur 175 km², formant la
      plus grande zone régulièrement inondée d'Estonie et du nord de l'Europe. Lors des crues maximales, la
      nappe d'eau peut atteindre 7-8 km de large, et les tourbières bombées aux versants raides émergent comme
      des îles au milieu des flots. La crue résulte d'un dégel brutal, lorsque les volumes de neige fondue
      excèdent la capacité des lits fluviaux.


      Lorsque l'eau reflue, le relief tourbeux réapparaît. Celle de Kuresoo figure parmi les deux tourbières
      bombées les mieux conservées d'Estonie ; son flanc méridional descend de 8 mètres vers la Lemmjõgi sur
      une distance de seulement 100 m. En bordure orientale du parc s'élèvent les plus hautes dunes
      intérieures d'Estonie continentale, à environ 50 km du littoral actuel ; celles de Ruunaraipe culminent
      à 12 mètres de hauteur.


      Les prairies alluviales et forêts riveraines abritent une remarquable richesse floristique avec environ
      200 espèces végétales, dont Gladiolus imbricatus, Iris sibirica et Sedum telephium. Au total, Soomaa
      compte près de 540 espèces de plantes vasculaires, plus de 200 mousses et plus de 360 champignons, avec
      au moins 29 espèces protégées.
    wildlife: >-
      Soomaa abrite une part essentielle de la grande faune estonienne. Le chevreuil,
      l'[élan](/especie/alces_alces/) et le [sanglier](/especie/sus_scrofa/) sont les grands mammifères les
      plus abondants, tandis que le [castor d'Europe](/especie/castor_fiber/), le [lynx
      boréal](/especie/lynx_lynx/), le [loup](/especie/canis_lupus/) et l'[ours brun](/especie/ursus_arctos/)
      sont fréquents. Le parc constitue un laboratoire privilégié pour l'étude des carnivores et ongulés
      d'Estonie, avec suivi télémétrique du lynx et du loup depuis 2004. On y recense plus de 40 espèces de
      mammifères, environ 150 d'oiseaux, 20 de poissons, quatre de reptiles, six d'amphibiens et 35 de
      libellules.


      Pour les oiseaux, le parc est une halte migratoire de premier ordre. Il accueille régulièrement plus de
      1 % des populations régionales de cygnes de Bewick et de [grues cendrées](/especie/grus_grus/) : en
      automne stationnent environ 1 000 grues et 500 cygnes, et au printemps près de 2 000 cygnes. Parmi les
      oiseaux observés figurent l'[aigle royal](/especie/aquila_chrysaetos/), le courlis corlieu (plus de 100
      couples), le pluvier doré (environ 150), le faucon émerillon, le lagopède et le busard cendré.
    visit: >-
      Commencez votre découverte au centre d'accueil de Kõrtsi-Tõramaa, au cœur du parc. Érigé en 1998 à un
      ancien carrefour hivernal entre Pärnu et Viljandi, il présente l'exposition «Voyager à Soomaa en pirogue
      monoxyle», et le sentier du Castor démarre à ses portes. Le centre propose cartes, dépliants et films.
      Du 31 août au 31 mai il ouvre du mardi au samedi de 10.00 à 16.00, et du 1 juin au 30 août du lundi au
      vendredi de 09.00 à 17.00 et le week-end de 10.00 à 18.00.


      Les itinéraires combinent pistes de terre et pontons de bois sur la tourbe. Riisa (5 km, environ 3 h) et
      Ingatsi (4,5 km, environ 3 h) mènent à des tours d'observation dominant les tourbières de Riisa et
      Kuresoo. Le sentier du Castor fait 2 km (1,5 h) à travers l'habitat du castor et la forêt inondée. Le
      sentier de Tõramaa, long de 2,5 km pour environ 3 h de marche, traverse la prairie inondable de
      Halliste, riche en oiseaux, et comporte une tour panoramique. Le circuit de Kuresoo, totalisant 32 km
      sur deux jours, relie milieux sauvages et sites culturels. Le réseau comporte des sections sur platelage
      accessibles aux fauteuils roulants et poussettes.


      La saison de canoë s'étend d'avril à octobre ; des sorties guidées en pirogues monoxyles traditionnelles
      et des stages de fabrication sont organisés en été. En hiver, sur la tourbière gelée, des randonnées en
      raquettes et traîneau trottinette sont proposées, ainsi que le ski de fond si l'enneigement le permet.


      Depuis la tour de la prairie boisée de Tõramaa, près de la rivière Halliste, on observe la faune, de
      vieux chênes et l'immensité des eaux de crue ou de la plaine glacée.
    history: >-
      Soomaa est zone humide Ramsar depuis 1997 et réseau Natura 2000 depuis 2004. En 2009, il a rejoint le
      réseau d'espaces sauvages PAN Parks comme le plus vaste complexe de tourbières intactes d'Europe
      préservé en milieu sauvage. La population locale a chuté de plus de dix fois ; en 2011 n'y vivaient que
      87 habitants.
    before: >-
      Empruntez exclusivement les sentiers et parkings balisés : la tourbe meuble ne supporte pas le poids des
      véhicules. Pendant la crue, les eaux submergent les voies d'accès et isolent des secteurs. La meilleure
      période pour observer les crues se situe fin mars et début avril.
    around: >-
      Soomaa ne compte aucun voisin immédiat dans l'atlas, mais partage des milieux et espèces avec des
      massifs distants. Le [parc national de Šumava](/lugar/narodni-park-sumava/) en République tchèque et le
      [parc national de Kampinos - Réserve intégrale](/lugar/kampinoski-park-narodowy---sektory/) en Pologne
      partagent zones humides, forêts matures, élan, castor et lynx ; le [parc national
      d'Aukštaitija](/lugar/aukstaitijos-nacionalinis-parkas/) et le [parc national de
      Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) en Lituanie partagent élan, castor et loup.
  de:
    intro: >-
      Ende März oder Anfang April steigt das Wasser rasant. In manchen Jahren kletterte der Pegel um einen
      Meter pro Tag über drei oder vier aufeinanderfolgende Tage. Die Flut überströmt Auen, dringt in Wälder
      vor, überflutet Straßen und schneidet ganze Parkbereiche von der Außenwelt ab. In Soomaa heißt dieses
      Naturschauspiel die fünfte Jahreszeit, und man erlebt es im Kanu. Soomaa bedeutet «Moorland»: ein
      Nationalpark von rund 398 km², gebildet aus fünf großen Hochmooren (Valgeraba, Öördi, Riisa, Kikepera
      und Kuresoo), die von den Flüssen Navesti, Halliste, Raudna und Lemmjõgi durchschnitten werden. Er wurde
      1993 gegründet, um Hochmoore, Überschwemmungswiesen, Bruchwälder und Flussmäander zu schützen.
    landscape: >-
      Das Hochwasserphänomen nimmt gewaltige Dimensionen an: Das Überschwemmungsgebiet Riisa dehnt sich über
      175 km² aus und bildet die größte regelmäßig überflutete Aue Estlands und Nordeuropas. Bei Höchststand
      kann die Wasserfläche 7-8 km breit sein, während die steil aufragenden Hochmoorkuppen wie Inseln aus der
      Flut ragen. Das Hochwasser entsteht bei rascher Schneeschmelze, wenn das Schmelzwasser die Flussbetten
      sprengt.


      Zieht sich das Wasser zurück, treten die Moore hervor. Kuresoo zählt zu den beiden am besten erhaltenen
      Hochmooren Estlands; sein Südabfall senkt sich zur Lemmjõgi hin auf nur 100 m Strecke um 8 Meter ab. Am
      Ostrand des Parks erheben sich die höchsten Binnendünen des estnischen Festlands, rund 50 km von der
      heutigen Küste entfernt; die Ruunaraipe-Dünen erreichen 12 Meter Höhe.


      Die Auenwiesen und Uferwälder besitzen herausragenden botanischen Wert mit rund 200 Pflanzenarten,
      darunter Gladiolus imbricatus, Iris sibirica und Sedum telephium. Insgesamt weist Soomaa fast 540
      Gefäßpflanzenarten, über 200 Moosarten und mehr als 360 Pilzarten auf, mit mindestens 29 geschützten
      Arten.
    wildlife: >-
      Soomaa beherbergt einen Großteil der Großfauna Estlands. Reh, [Elch](/especie/alces_alces/) und
      [Wildschwein](/especie/sus_scrofa/) sind die häufigsten Großsäuger, während [Europäischer
      Biber](/especie/castor_fiber/), [Eurasischer Luchs](/especie/lynx_lynx/), [Wolf](/especie/canis_lupus/)
      und [Braunbär](/especie/ursus_arctos/) regelmäßig vorkommen. Der Park dient als Forschungsgebiet für
      Großraubtiere und Huftiere mit GPS-Telemetrie von Luchs und Wolf seit 2004. Er zählt über 40
      Säugetierarten, rund 150 Vogelarten, 20 Fischarten, vier Reptilienarten, sechs Amphibienarten und 35
      Libellenarten.


      Für Vögel ist das Gebiet ein herausragender Rastplatz. Es beherbergt regelmäßig mehr als 1 % der
      Bestände von Zwergschwan und [Kranich](/especie/grus_grus/): Im Herbst rasten rund 1.000 Kraniche und
      500 Schwäne, im Frühjahr bis zu 2.000 Schwäne. Zu den nachgewiesenen Arten gehören
      [Steinadler](/especie/aquila_chrysaetos/), Regenbrachvogel (über 100 Brutpaare), Goldregenpfeifer (rund
      150 Paare), Merlin, Moorschneehuhn und Wiesenweihe.
    visit: >-
      Beginne am Besucherzentrum in Kõrtsi-Tõramaa im Herzen des Parks. Es wurde 1998 an einer historischen
      Winterkreuzung zwischen Pärnu und Viljandi errichtet und beherbergt die Dauerausstellung «Unterwegs in
      Soomaa im Einbaum»; direkt daneben beginnt der Biberpfad. Das Zentrum bietet Karten, Führer und
      Dokumentarfilme. Vom 31. August bis 31. Mai öffnet es Dienstag bis Samstag von 10.00 bis 16.00, vom 1.
      Juni bis 30. August Montag bis Freitag von 09.00 bis 17.00 und am Wochenende von 10.00 bis 18.00.


      Die Wege verlaufen über Pfade und Holzbohlenwege über den Moorboden. Riisa (5 km, ca. 3 h) und Ingatsi
      (4,5 km, ca. 3 h) führen zu Aussichtstürmen über den Hochmooren Riisa und Kuresoo. Der Biberpfad misst 2
      km (1,5 h) durch Biberreviere und Bruchwälder. Der Tõramaa-Pfad führt über 2,5 km und rund 3 h durch die
      artenreiche Halliste-Aue mit Aussichtsturm. Der Kuresoo-Pfad verbindet über 32 km in zwei Tagen
      Moorlandschaften und Kulturstätten. Abschnitte des Wegenetzes sind barrierefrei für Rollstühle und
      Kinderwagen ausgebaut.


      Kanusaison ist von April bis Oktober; im Sommer finden geführte Fahrten in traditionellen Espeneinbäumen
      und Bootsbaukurse statt. Im Winter werden bei gefrorenem Moor Schneeschuh- und Trettouren sowie
      Skilanglauf angeboten.


      Vom Turm an der bewaldeten Aue von Tõramaa am Fluss Halliste blickt man auf Wildtiere, alte Eichen und
      das saisonale Hochwasser oder vereiste Weiten.
    history: >-
      Soomaa ist seit 1997 Ramsar-Gebiet und seit 2004 Teil des Natura-2000-Netzes. 2009 wurde es als
      zertifizierter PAN-Parks-Wildnispark anerkannt, als eines der größten unberührten Moorwildnisgebiete
      Europas. Die Einwohnerzahl ging um mehr als das Zehnfache zurück; 2011 lebten nur noch 87 Menschen im
      Park.
    before: >-
      Nutze nur ausgewiesene Wege und Parkplätze: Weicher Moorboden trägt keine Fahrzeuge. Während des
      Hochwassers stehen Straßen unter Wasser und schneiden Teilbereiche ab. Beste Zeit für das Hochwasser:
      Ende März und Anfang April.
    around: >-
      Soomaa hat keine direkten Nachbarn im Atlas, teilt aber Lebensräume mit weit entfernten Schutzgebieten.
      Der [Nationalpark Šumava](/lugar/narodni-park-sumava/) in Tschechien und der [Nationalpark Kampinos -
      Totalreservat](/lugar/kampinoski-park-narodowy---sektory/) in Polen teilen Feuchtgebiete, Urwälder,
      Elch, Biber und Luchs; der [Nationalpark Aukštaitija](/lugar/aukstaitijos-nacionalinis-parkas/) und der
      [Nationalpark Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) in Litauen teilen Elch, Biber und Wolf.
  it:
    intro: >-
      A fine marzo o inizio aprile, le acque salgono repentinamente. In certi anni il livello è cresciuto di
      un metro al giorno per tre o quattro giorni consecutivi. L'inondazione sommerge i prati, penetra nei
      boschi, copre le strade e isola intere porzioni del parco. A Soomaa questo fenomeno è noto come la
      quinta stagione e si percorre in canoa. Soomaa significa «terra di torbiere»: un parco nazionale di
      circa 398 km² costituito da cinque ampie torbiere alte (Valgeraba, Öördi, Riisa, Kikepera e Kuresoo),
      solcate dai fiumi Navesti, Halliste, Raudna e Lemmjõgi. È stato istituito nel 1993 per tutelare torbiere
      alte, pianure alluvionali, boschi palustri e fiumi meandriformi.
    landscape: >-
      La portata dell'evento alluvionale è impressionante: la piana di Riisa si estende per 175 km²,
      costituendo la più vasta area periodicamente inondata dell'Estonia e del nord Europa. Al culmine della
      piena la distesa liquida può raggiungere una larghezza di 7-8 km, con i dossi torbosi che emergono come
      isole sulle acque. Le piene scaturiscono dal disgelo repentino, quando la neve fusa supera la capienza
      degli alvei.


      Quando le acque defluiscono, riaffiorano le torbiere. Quella di Kuresoo è una delle due grandi torbiere
      alte meglio preservate d'Estonia; il versante meridionale scende verso il Lemmjõgi di 8 metri nello
      spazio di appena 100 m. Sul margine orientale del parco si innalzano le dune continentali più elevate
      dell'Estonia interna, a circa 50 km dalla costa attuale; quelle di Ruunaraipe toccano i 12 metri
      d'altezza.


      I prati alluvionali e i boschi ripari presentano grande pregio floristico con circa 200 specie vegetali,
      tra cui Gladiolus imbricatus, Iris sibirica e Sedum telephium. Complessivamente Soomaa ospita quasi 540
      piante vascolari, oltre 200 muschi e più di 360 funghi, con almeno 29 specie protette.
    wildlife: >-
      A Soomaa è presente gran parte della grande fauna estone. Capriolo, [alce](/especie/alces_alces/) e
      [cinghiale](/especie/sus_scrofa/) sono gli ungulati più diffusi, mentre [castoro
      europeo](/especie/castor_fiber/), [lince europea](/especie/lynx_lynx/), [lupo
      grigio](/especie/canis_lupus/) e [orso bruno](/especie/ursus_arctos/) sono frequenti. Il parco è un
      territorio chiave per lo studio dei carnivori e grandi mammiferi estoni, con monitoraggio satellitare di
      lince e lupo dal 2004. Si contano oltre 40 specie di mammiferi, circa 150 di uccelli, 20 di pesci,
      quattro di rettili, sei di anfibi e 35 di libellule.


      Per l'avifauna il comprensorio costituisce una tappa migratoria fondamentale. Accoglie stabilmente oltre
      l'1 % delle popolazioni di cigno minore e [gru](/especie/grus_grus/): in autunno sostano circa 1.000 gru
      e 500 cigni, mentre in primavera transitano fino a 2.000 cigni. Tra le specie presenti spiccano
      l'[aquila reale](/especie/aquila_chrysaetos/), il chiurlo piccolo (oltre 100 coppie), il piviere dorato
      (circa 150 coppie), lo smeriglio, la pernice bianca nordica e l'albanella minore.
    visit: >-
      Il punto di partenza è il centro visite di Kõrtsi-Tõramaa nel cuore del parco. Realizzato nel 1998
      all'incrocio delle antiche vie invernali tra Pärnu e Viljandi, ospita la mostra «Viaggiare a Soomaa su
      una piroga monossile», mentre all'esterno inizia il sentiero del Castoro. La struttura fornisce carte,
      guide e filmati. Dal 31 agosto al 31 maggio è aperto dal martedì al sabato dalle 10.00 alle 16.00, e dal
      1 giugno al 30 agosto dal lunedì al venerdì dalle 09.00 alle 17.00 e nei fine settimana dalle 10.00 alle
      18.00.


      I tracciati si snodano su sentieri e passerelle in legno sulla torba. Riisa (5 km, circa 3 h) e Ingatsi
      (4,5 km, circa 3 h) salgono su torri di avvistamento affacciate sulle torbiere di Riisa e Kuresoo. Il
      sentiero del Castoro si sviluppa per 2 km (1,5 h) negli habitat del castoro e nelle foreste allagate. Il
      percorso di Tõramaa, lungo 2,5 km per circa 3 h di cammino, attraversa il prato alluvionale di Halliste
      ricco di avifauna e dispone di una torre panoramica. L'itinerario di Kuresoo, lungo 32 km su due
      giornate, collega ambienti naturali e testimonianze rurali. La rete sentieristica include tratti su
      passerella accessibili a passeggini e carrozzine.


      La stagione per la canoa va da aprile a ottobre; in estate si svolgono escursioni guidate su piroghe
      tradizionali e corsi di costruzione di imbarcazioni monossili. In inverno, con le torbiere gelate, si
      organizzano itinerari con racchette da neve e slitte tradizionali, oltre allo sci di fondo.


      Dalla torre panoramica del prato boscato di Tõramaa lungo il fiume Halliste si ammirano fauna, querce
      secolari e il paesaggio delle acque di piena o delle pianure ghiacciate.
    history: >-
      Soomaa è sito Ramsar dal 1997 e fa parte di Natura 2000 dal 2004. Nel 2009 è stato riconosciuto nella
      rete wilderness PAN Parks quale più vasto sistema intatto di torbiere alte d'Europa preservato allo
      stato selvaggio. La popolazione residente si è ridotta di oltre dieci volte; nel 2011 contava appena 87
      residenti.
    before: >-
      Segui rigorosamente sentieri e parcheggi segnalati: i suoli torbosi cedevoli non reggono il peso dei
      veicoli. Nei periodi di piena l'acqua allaga le vie carrabili isolando intere aree del parco. Il periodo
      migliore per assistere alle piene va da fine marzo a inizio aprile.
    around: >-
      Soomaa non ha vicini diretti nell'atlas ma condivide ambienti e specie con riserve distanti. Il [Parco
      Nazionale di Šumava](/lugar/narodni-park-sumava/) nella Repubblica Ceca e il [Parco Nazionale di
      Kampinos - Riserva Integrale](/lugar/kampinoski-park-narodowy---sektory/) in Polonia condividono
      torbiere, boschi maturi, alce, castoro e lince; il [Parco Nazionale di
      Aukštaitija](/lugar/aukstaitijos-nacionalinis-parkas/) e il [Parco Nazionale di
      Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) in Lituania condividono alce, castoro e lupo.
  pt:
    intro: >-
      Em finais de março ou princípios de abril, o nível das águas sobe abruptamente. Em determinados anos a
      água subiu um metro por dia durante três ou quatro dias sucessivos. As cheias submergem prados, inundam
      florestas, cobrem estradas e isolam setores inteiros do parque. Em Soomaa a este fenómeno chama-se a
      quinta estação, sendo percorrido em canoa. Soomaa significa «terra de turfeiras»: um parque nacional com
      cerca de 398 km² formado por cinco vastas turfeiras altas (Valgeraba, Öördi, Riisa, Kikepera e Kuresoo),
      separadas pelos rios Navesti, Halliste, Raudna e Lemmjõgi. Foi criado em 1993 com o objetivo de proteger
      turfeiras altas, várzeas inundáveis, florestas pantanosas e rios meândricos.
    landscape: >-
      O regime das cheias atinge proporções monumentais: a várzea de Riisa estende-se por 175 km²,
      constituindo a maior área regularmente inundada da Estónia e do norte da Europa. No pico da cheia, a
      lâmina de água pode atingir 7-8 km de largura, e as turfeiras altas de encostas íngremes sobressaem como
      ilhas na água. As cheias derivam do degelo primaveril repentino, quando o caudal de neve fundida
      ultrapassa os leitos fluviais.


      Quando as águas baixam, sobressaem as turfeiras. A de Kuresoo é uma das duas grandes turfeiras altas
      mais bem preservadas da Estónia; a sua vertente sul desce 8 metros em direção ao rio Lemmjõgi numa
      distância de apenas 100 m. No bordo oriental do parque erguem-se as dunas interiores mais altas da
      Estónia continental, a cerca de 50 km do litoral contemporâneo; as de Ruunaraipe atingem 12 metros de
      altura.


      Os prados aluviais e as matas ripícolas encerram grande interesse botânico, albergando cerca de 200
      espécies de plantas, entre as quais Gladiolus imbricatus, Iris sibirica e Sedum telephium. Ao todo,
      Soomaa abriga quase 540 espécies de plantas vasculares, mais de 200 de musgos e mais de 360 de fungos,
      com pelo menos 29 protegidas.
    wildlife: >-
      Em Soomaa ocorre grande parte da megafauna estoniana. O corço, o [alce](/especie/alces_alces/) e o
      [javali](/especie/sus_scrofa/) constituem os grandes mamíferos mais abundantes, sendo o
      [castor-europeu](/especie/castor_fiber/), o [lince-euroasiático](/especie/lynx_lynx/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [urso-pardo](/especie/ursus_arctos/) também regulares. O
      parque funciona como laboratório privilegiado para a investigação de grandes carnívoros e herbívoros na
      Estónia, com monitorização por telemetria de linces e lobos desde 2004. Ocorrem mais de 40 espécies de
      mamíferos, cerca de 150 de aves, 20 de peixes, quatro de répteis, seis de anfíbios e 35 de libélulas.


      Para a avifauna, o parque é um ponto de paragem migratória fundamental. Acolhe com regularidade mais de
      1 % dos efetivos populacionais de cisne-pequeno e [grou-comum](/especie/grus_grus/): no outono
      congregam-se cerca de 1.000 grous e 500 cisnes, e na primavera cerca de 2.000 cisnes. Entre as aves
      registadas figuram a [águia-real](/especie/aquila_chrysaetos/), o maçarico-galego (mais de 100 casais),
      a tarambola-dourada (cerca de 150), o esmerilhão, a perdiz-branca e o tartaranhão-caçador.
    visit: >-
      Inicia a visita no centro de acolhimento em Kõrtsi-Tõramaa, no coração do parque. Concluído em 1998 no
      cruzamento das antigas rotas de inverno entre Pärnu e Viljandi, acolhe a exposição permanente «Viajar em
      Soomaa numa canoa monóxila», iniciando-se junto ao edifício o trilho do Castor. A estrutura faculta
      mapas, guias e vídeos. De 31 de agosto a 31 de maio abre de terça a sábado das 10.00 às 16.00, e de 1 de
      junho a 30 de agosto de segunda a sexta das 09.00 às 17.00 e fins de semana das 10.00 às 18.00.


      Os percursos combinam trilhos de terra e passadiços sobre a turfa. Riisa (5 km, cerca de 3 h) e Ingatsi
      (4,5 km, cerca de 3 h) conduzem a torres de observação sobre as turfeiras de Riisa e Kuresoo. O trilho
      do Castor tem 2 km (1,5 h) pelo habitat do castor e bosque alagado. O de Tõramaa, com 2,5 km e cerca de
      3 h, cruza a várzea de Halliste, rica em aves, e dispõe de torre de observação. O de Kuresoo, com 32 km
      em dois dias, liga paisagens e património etnográfico. A rede possui troços de passadiço acessíveis para
      cadeiras de rodas e carrinhos de bebé.


      A época de canoagem prolonga-se de abril a outubro; organizam-se passeios guiados em pirogas monóxilas
      tradicionais e oficinas de construção no verão. No inverno, sobre a turfeira gelada, realizam-se
      passeios em raquetes e trenós tradicionais, bem como esqui de fundo quando a neve o permite.


      Da torre na várzea arborizada de Tõramaa, junto ao rio Halliste, observam-se aves e mamíferos, carvalhos
      seculares e o espelho de água das cheias ou a planície gelada.
    history: >-
      Soomaa é sítio Ramsar desde 1997 e integrou a rede Natura 2000 em 2004. Em 2009 associou-se à rede de
      áreas selvagens PAN Parks como o maior sistema intacto de turfeiras altas da Europa preservado como
      natureza selvagem. A densidade populacional caiu mais de dez vezes; em 2011 viviam apenas 87 pessoas no
      parque.
    before: >-
      Utiliza exclusivamente percursos e parques de estacionamento assinalados: os solos moles de turfa não
      suportam o peso de veículos. Durante as cheias a água corta as estradas e isola setores do parque. A
      melhor época para testemunhar as cheias decorre em finais de março e princípios de abril.
    around: >-
      Soomaa não tem vizinhos imediatos no atlas, mas partilha ecossistemas com reservas distantes. O [Parque
      Nacional de Šumava](/lugar/narodni-park-sumava/) na Chéquia e o [Parque Nacional de Kampinos - Reserva
      Integral](/lugar/kampinoski-park-narodowy---sektory/) na Polónia partilham zonas húmidas, bosques
      maduros, alce, castor e lince; o [Parque Nacional de
      Aukštaitija](/lugar/aukstaitijos-nacionalinis-parkas/) e o [Parque Nacional de
      Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) na Lituânia partilham alce, castor e lobo.
