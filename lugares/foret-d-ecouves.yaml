  de: >-
    Ein historisch wiederhergestellter Wald mit Laubmischwäldern, Weihern, Mooren und Heiden, der ein
    nutzungsfreies Reservat birgt.
  it: >-
    Una foresta strappata al degrado storico che alterna latifoglie, stagni, torbiere e brughiere umide, con
