resumen:
  es: El único lago de estepa endorreico de Europa Central y su cinturón de cubetas salinas de Seewinkel.
  en: Central Europe’s only endorheic steppe lake and its belt of saline shallow soda pans in Seewinkel.
  fr: Le seul lac de steppe endoréique d’Europe centrale et son chapelet de cuvettes salines du Seewinkel.
  de: Mitteleuropas einziger abflussloser Steppensee und sein Kranz flacher Salzlacken im Seewinkel.
  it: L’unico lago di steppa endoreico dell’Europa centrale e la sua corona di bacini salini nel Seewinkel.
  pt: O único lago esteépico endorreico da Europa Central e o seu anel de lagoas salinas em Seewinkel.
