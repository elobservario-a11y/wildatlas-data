resumen:
  es: >-
    El mayor campo de dunas de arena orgánica fósil de las Islas Canarias (2.600 ha), contrastando el mar
    turquesa con el paisaje desértico volcánico.
  en: >-
    The largest field of organic fossil sand dunes in the Canary Islands (2,600 ha), contrasting turquoise
    waters with volcanic desert landscapes.
  fr: >-
    Le plus grand champ de dunes de sable organique fossile des îles Canaries (2 600 ha), contrastant une mer
    turquoise avec un désert volcanique.
  de: >-
    Das größte Feld organischer fossiler Sanddünen der Kanarischen Inseln (2.600 ha), das türkisblaues Meer
    mit vulkanischer Wüstenlandschaft verbindet.
  it: >-
    Il più esteso campo di dune di sabbia organica fossile delle Isole Canarie (2.600 ha), in cui il mare
    turchese contrasta con il deserto vulcanico.
  pt: >-
    O maior campo de dunas de areia fóssil orgânica das Canárias (2.600 ha), contrastando o mar azul-turquesa
    com uma paisagem desértica vulcânica.
unico:
  es: >-
    Un mismo paseo une un campo de dunas blancas hecho de conchas pulverizadas y un sur volcánico de colores
    ocres y rojos.
  en: >-
    A single excursion connects an expansive white dune system made of pulverised marine shells with an arid
    volcanic south of dramatic ochre and crimson hues.
  fr: >-
    Une même balade relie un vaste champ de dunes blanches nées de coquillages pulvérisés à un sud volcanique
    aux teintes ocre et rougeoyantes.
  de: >-
    Ein einziger Spaziergang verbindet ein weißes Dünenfeld aus pulverisierten Muschelschalen mit einem
    vulkanischen Süden in Ocker- und Rottönen.
  it: >-
    Una sola escursione unisce un candido campo dunare formato da conchiglie polverizzate a un settore
    vulcanico meridionale dalle intense tonalità ocra e ruggine.
  pt: >-
    Um único passeio liga um vasto campo de dunas brancas geradas por conchas moídas a um setor vulcânico
    meridional de tons ocre e carmesim.
observaciones:
  es: >-
    Camina solo por los senderos señalizados y respeta la señalización: salirse de los caminos habilitados
    daña el entorno. No recojas piedras ni las apiles en torres, y no dejes restos de comida.
texto:
  es:
    intro: >-
      Imagina un desierto de arena blanca que termina, sin transición, en un mar turquesa. Esa es la primera
      impresión del Parque Natural de Corralejo, en el nordeste de Fuerteventura: una franja costera de 2,5
      por 10,5 kilómetros con las dunas más grandes de Canarias. Cuenta con más de 2600 hectáreas, pertenece
      al municipio de La Oliva y se clasificó como parque natural en 1994. Pero la arena es solo la mitad de
      la historia, porque el parque tiene dos sectores muy contrastados.
    landscape: >-
      Al norte, junto a la población de Corralejo, está el mayor campo de dunas de las Islas Canarias: una
      enorme extensión de arenas blancas bañada por aguas turquesas. Su origen es orgánico. Las dunas nacen de
      la disgregación y pulverización de conchas de moluscos y de otros organismos marinos, y la protección se
      debe, sobre todo, a un campo dunar móvil que cubre en parte dunas fósiles, probablemente del Pleistoceno
      superior. En varias zonas de la costa aflora, además, una playa fósil con restos de organismos marinos.


      Al sur todo cambia. El sector sur es volcánico, de colores ocres y rojos, de formas rugosas y
      dramáticas. Entre un extremo y otro, el parque combina zonas halófilas costeras, arenas móviles y
      consolidadas, arcillas y malpaís.


      La vegetación se adapta a cada franja. En la costa crecen balancón, pata de camello, corazoncillo,
      corregüela del mar y rabanillo de mar; en el malpaís aparecen verol, tabaiba salvaje y cuernúa.
    wildlife: >-
      Entre las aves más representativas del norte de Fuerteventura están la tarabilla canaria, exclusiva de
      la isla, la [hubara](/especie/chlamydotis_undulata/), el alcaraván, la ganga ortega, el camachuelo
      trompetero, el halcón tagarote y el guirre, una especie amenazada. El área importante para las aves del
      parque cuenta con hubara, alcaraván, corredor sahariano y bisbita caminero. En tierra viven también
      musarañas canarias, lagartijas atlánticas y perenquenes. En total, Fuerteventura reúne 2.672 especies
      terrestres, de las que 541 son endémicas de Canarias y 128 exclusivas de la isla.


      El mar añade otra mirada. En aguas de La Oliva se ven delfín mular, delfín listado, calderón gris, zifio
      de Cuvier, cachalote y rorcual tropical. El municipio recomienda diez lugares para observar la fauna,
      entre ellos el Faro del Tostón, el Charco de Bristol, los Bajíos de Corralejo y Majanicho.
    visit: >-
      La carretera FV-1 pasa por el parque, pero el coche se deja en un apartadero y se entra caminando. Para
      el lado volcánico, calza botas: se asciende en unos 300 metros el volcán Montaña Roja, y desde arriba se
      ven Lanzarote y La Graciosa sobre el mar. El Cabildo ha organizado un recorrido botánico de noventa
      minutos por las dunas, y el municipio de La Oliva tiene una guía de senderos, algunos de los cuales
      atraviesan el parque. Para conocer los valores naturales del parque hay folletos y recursos divulgativos
      del Cabildo.
    history: >-
      La zona de dunas figura como área de uso restringido en la zonificación del parque. Además, más de la
      mitad del municipio de La Oliva está protegido y todo él, costa incluida, es Reserva de la Biosfera. El
      Cabildo advierte contra el expolio de piedras, conchas y rodolitos, y los restos de comida favorecen a
      roedores y gatos asilvestrados, una grave amenaza para la fauna. Entre las aves más amenazadas están el
      guirre y la hubara.
    before: >-
      Camina solo por los senderos señalizados y respeta la señalización: salirse de los caminos habilitados
      daña el entorno. No recojas piedras ni las apiles en torres, y no dejes restos de comida.
    around: >-
      El [Parque Natural Marítimo-Terrestre del Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/) comparte con Corralejo la
      hubara y combina costa, estepa y medio marino.
  en:
    intro: >-
      Imagine a white sand desert meeting a turquoise sea without transition. That is the initial impression
      of Corralejo Natural Park in northeastern Fuerteventura: a coastal strip measuring 2.5 by 10.5
      kilometres sheltering the largest dune field in the Canary Islands. Spanning more than 2600 hectares
      within the municipality of La Oliva, it was classified as a natural park in 1994. Yet the sands tell
      only half the tale, as the park comprises two remarkably contrasting sectors.
    landscape: >-
      To the north, bordering the resort of Corralejo, unfolds the grandest sand field in the Canarian
      archipelago: a sweeping expanse of white sands washed by translucent turquoise shallows. Its genesis is
      entirely organic. The dunes arise from the fragmentation and fine pulverisation of mollusc shells and
      marine calcareous organisms, creating an active shifting dune field that partly blankets fossilised
      dunes likely dating to the Upper Pleistocene. In several shoreline zones, fossil beaches laden with
      ancient marine shells outcrop above the tide line.


      To the south the landscape transforms completely. The southern sector is ruggedly volcanic, exhibiting
      ochres, terracottas, and deep reds across jagged basalt slopes. Between these opposing poles, the park
      blends coastal halophytic flats, active and stabilised dunes, red clay basins, and volcanic malpaís.


      Vegetation adapts precisely to each sub-habitat. Along the coastline grow sea-grape, zygophyllum,
      birdsfoot trefoil, sea bindweed, and sea-rocket; in the rough basalt malpaís thrive balsam spurge,
      euphorbia, and caralluma.
    wildlife: >-
      Representative birds of northern Fuerteventura include the Canary Islands stonechat, strictly endemic to
      the island, alongside the [houbara bustard](/especie/chlamydotis_undulata/), stone-curlew, black-bellied
      sandgrouse, trumpeter finch, Barbary falcon, and the Egyptian vulture (guirre), a critically endangered
      island subspecies. The park's Important Bird Area shelters houbara bustard, stone-curlew, cream-coloured
      courser, and Berthelot's pipit. On land live Canarian shrews, Atlantic lizards, and East Canarian
      geckos. In all, Fuerteventura hosts 2,672 terrestrial species, of which 541 are Canarian endemics and
      128 exist nowhere else on Earth.


      The adjoining sea adds marine richness. Waters off La Oliva harbor bottlenose dolphins, striped
      dolphins, Risso's dolphins, Cuvier's beaked whales, sperm whales, and Bryde's whales. The municipality
      identifies ten choice spots for wildlife observation, including Tostón Lighthouse, Charco de Bristol,
      Bajíos de Corralejo, and Majanicho.
    visit: >-
      The FV-1 coastal highway skirts the park, but vehicles must pull into designated roadside laybys with
      access on foot. For the volcanic south, wear sturdy hiking footwear: a climb of roughly 300 metres
      scales the Montaña Roja volcano, rewarding hikers with views of Lanzarote and La Graciosa across the
      Bocaina strait. The island council (Cabildo) has organized a ninety-minute botanical trail across the
      sands, and La Oliva municipality publishes walking guides detailing pathways crossing the dunes.
      Informational leaflets on park geology and ecology are available from local offices.


      Take water and respect the fragile sands during your visit.
    history: >-
      The mobile dunes are designated as a restricted-use conservation zone under the park master plan.
      Moreover, more than half of La Oliva municipality is environmentally protected, and the entire island,
      shoreline included, is a UNESCO Biosphere Reserve. The Cabildo warns strictly against the gathering of
      stones, shells, and rhodoliths; left-behind food scraps sustain feral cats and rodents, which pose
      severe threats to ground-nesting birds like the guirre and houbara.
    before: >-
      Walk only along designated tracks and obey boundary signs: venturing off marked pathways causes severe
      erosion in fragile dunes. Do not collect stones or build stone cairns, and leave no food scraps behind.
    around: >-
      [Parque Natural Marítimo-Terrestre del Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/) shares the houbara bustard
      with Corralejo, uniting coastal, steppe, and marine environments.
  fr:
    intro: >-
      Imaginez un désert de sable blanc se jetant sans transition dans une mer turquoise. Telle est la
      première impression laissée par le parc naturel de Corralejo, au nord-est de Fuerteventura : une bande
      côtière de 2,5 sur 10,5 kilomètres abritant les plus vastes dunes des Canaries. Couvrant plus de 2600
      hectares sur la commune de La Oliva, il a été classé parc naturel en 1994. Mais le sable ne représente
      que la moitié du décor, car le parc oppose deux secteurs aux géologies contrastées.
    landscape: >-
      Au nord, en lisière de la localité de Corralejo, s'étend le plus grand champ de dunes des îles Canaries
      : une immense nappe de sables blancs bordée par des eaux limpides. Son origine est purement organique.
      Les dunes sont nées de la désagrégation et de la pulvérisation fine de coquilles de mollusques et
      d'organismes marins, formant un champ dunaire mobile qui recouvre en partie des dunes fossiles datant
      probablement du Pléistocène supérieur. En plusieurs points du littoral affleure une plage fossile riche
      en coquilles marines pétrifiées.


      Au sud, la scène change du tout au tout. Le secteur méridional est purement volcanique, drapé de teintes
      ocre, pourpre et rougeoyantes aux reliefs tourmentés. D'un bout à l'autre, le parc associe pelouses
      halophiles côtières, dunes vives et consolidées, dépressions argileuses et champs de lave (malpaís).


      La végétation s'adapte à chaque milieu. Sur la plage poussent le balancón, le lotier des Canaries, le
      liseron de mer et la roquette de mer ; sur les laves du malpaís apparaissent verol, euphorbes sauvages
      et caralluma.
    wildlife: >-
      Parmi les oiseaux emblématiques du nord de Fuerteventura figurent le tarier des Canaries, endémique
      exclusif de l'île, l'[outarde houbara](/especie/chlamydotis_undulata/), l'œdicnème criard, le ganga
      unibande, le roselin githagine, le faucon de Barbarie et le percnoptère des Canaries (guirre), espèce en
      danger critique. La zone d'importance pour les oiseaux rassemble outarde houbara, œdicnème, courvite
      isabelle et pipit de Berthelot. À terre vivent musaraignes des Canaries, lézards atlantiques et geckos
      indigènes. Au total, Fuerteventura compte 2 672 espèces terrestres, dont 541 endémiques des Canaries et
      128 exclusives à l'île.


      L'océan apporte une perspective marine. Les eaux de La Oliva accueillent grand dauphin, dauphin bleu et
      blanc, globicéphale de Risso, baleine à bec de Cuvier, grand cachalot et rorqual de Bryde. La
      municipalité répertorie dix points privilégiés pour observer la faune, dont le phare du Tostón et les
      récifs de Majanicho.
    visit: >-
      La route côtière FV-1 longe le parc, mais le véhicule doit être laissé sur les bas-côtés aménagés pour
      pénétrer à pied. Pour le secteur volcanique, prévoyez des chaussures de marche : une montée d'environ
      300 mètres permet de gravir le cône du volcan Montaña Roja, dévoilant Lanzarote et La Graciosa posées
      sur l'eau. Le Cabildo a balisé un sentier botanique de quatre-vingt-dix minutes dans les sables, et la
      mairie de La Oliva édite un guide de randonnées pédestres. Des brochures naturalistes sont disponibles
      dans les offices locaux.
    history: >-
      Le champ dunaire est classé en zone d'usage restreint au sein du plan de gestion du parc. De plus, plus
      de la moitié de la commune de La Oliva est protégée et l'île entière est réserve de biosphère. Le
      Cabildo met en garde contre le ramassage de pierres, coquillages et rhodolithes ; les restes d'aliments
      abandonnés favorisent prédateurs et rongeurs nuisibles, menaçant la faune aviaire indigène comme le
      guirre et l'outarde.
    before: >-
      Marchez exclusivement sur les sentiers balisés et respectez les délimitations : s'écarter des
      cheminements endommage la dynamique dunaire. Ne prélevez aucune pierre, n'érigez pas de cairns et ne
      laissez aucun déchet.
    around: >-
      Le [Parque Natural Marítimo-Terrestre del Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/) partage avec Corralejo
      l'outarde houbara, réunissant milieux côtiers, steppiques et marins.
  de:
    intro: >-
      Stelle dir eine weiße Sandwüste vor, die unvermittelt in ein türkisfarbenes Meer übergeht. Das ist der
      erste Eindruck des Naturparks Corralejo im Nordosten von Fuerteventura: ein Küstenstreifen von 2,5 mal
      10,5 Kilometern mit den größten Dünen der Kanarischen Inseln. Er umfasst mehr als 2600 Hektar im
      Gemeindegebiet von La Oliva und wurde 1994 zum Naturpark erklärt. Doch der Dünensand ist nur die halbe
      Wahrheit, denn der Park besitzt zwei geologisch gegensätzliche Bereiche.
    landscape: >-
      Im Norden, nahe der Ortschaft Corralejo, breitet sich das größte Dünenareal der Kanarischen Inseln aus:
      eine weite weiße Sandfläche an seichten Buchten. Ihr Ursprung ist organisch. Die Dünen entstehen durch
      Zerfall und feine Zerreibung von Muschelschalen und marinen Hartteilen und bilden ein aktives
      Wanderdünenfeld, das ältere fossile Dünen aus dem Jungpleistozän überlagert. Entlang der Küste treten
      zudem fossile Paläostrände mit marinen Schalenresten zutage.


      Im Süden wandelt sich das Bild vollkommen. Der südliche Bereich ist vulkanischer Natur, geprägt von
      Ocker- und Rottönen sowie schroffen Schlackenkegeln. Dazwischen vereint das Areal salztolerante
      Küstenstreifen, mobile und verfestigte Sande, Tonböden und Malpaís-Blocklava.


      Die Pflanzenwelt ist streng an die Standortbedingungen angepasst. An der Küste gedeihen Traganum,
      Zygophyllum, Meersenf und Strandwinden; im steinigen Malpaís wachsen Kanaren-Wolfsmilch,
      Dickblattgewächse und Seidenpflanzengewächse.
    wildlife: >-
      Zu den Leitvögeln Nord-Fuerteventuras gehören das endemische Kanarenschmätzer-Vögelchen, die
      [Kragentrappe](/especie/chlamydotis_undulata/), Triel, Sandflughuhn, Wüstengimpel, Berberfalke und der
      Schmutzgeier (guirre), eine bedrohte Inselunterart. Das Vogelschutzgebiet des Parks beherbergt
      Kragentrappe, Triel, Rennvogel und Kanarenpieper. An Land leben Kanarenspitzmäuse, Atlantikeidechsen und
      Mauergeckos. Insgesamt vereint Fuerteventura 2.672 Landlebewesen, von denen 541 kanarenweit endemisch
      und 128 ausschließlich auf dieser Insel heimisch sind.


      Das offene Meer eröffnet weitere Einblicke. In den Gewässern vor La Oliva werden Große Tümmler,
      Streifendelfine, Rundkopfdelfine, Cuvier-Schnabelwale, Pottwale und Brydewale gesichtet. Die Gemeinde
      empfiehlt zehn Beobachtungspunkte, darunter den Leuchtturm von El Tostón und die Lagunen von Majanicho.
    visit: >-
      Die Küstenstraße FV-1 quert den Park, doch Fahrzeuge müssen in ausgewiesenen Haltebuchten geparkt
      werden, um das Gelände zu Fuß zu betreten. Für den vulkanischen Süden sind feste Wanderschuhe ratsam:
      Ein Aufstieg von rund 300 Höhenmetern führt auf den Vulkan Montaña Roja mit Blick auf Lanzarote und La
      Graciosa. Das Inselparlament (Cabildo) hat einen neunzigminütigen botanischen Dünenlehrpfad angelegt,
      und die Gemeinde La Oliva gibt Wanderbroschüren zu den Pfaden heraus.
    history: >-
      Das Dünengebiet ist im Bewirtschaftungsplan als Schutzzone mit eingeschränkter Nutzung eingestuft. Mehr
      als die Hälfte der Gemeinde La Oliva steht unter Naturschutz, und die gesamte Insel ist
      UNESCO-Biosphärenreservat. Das Cabildo untersagt das Entwenden von Steinen, Fossilien und Korallenkalk;
      zurückgelassene Abfälle fördern Nager und streunende Katzen, die Bodenbrüter wie die Kragentrappe
      gefährden.
    before: >-
      Bewege dich ausschließlich auf den markierten Wegen und beachte die Hinweistafeln: Das Verlassen der
      Pfade schädigt die Dünenvegetation. Sammle keine Steine, schichte keine Steintürme auf und hinterlasse
      keine Speisereste.
    around: >-
      Der [Parque Natural Marítimo-Terrestre del Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/) teilt mit Corralejo die
      Kragentrappe und verknüpft Küsten-, Steppen- und Meeresbiotope.
  it:
    intro: >-
      Immagina un deserto di sabbia bianca che si tuffa senza transizione in un mare turchese. È questa la
      prima sensazione che offre il Parco Naturale di Corralejo, nel nord-est di Fuerteventura: una fascia
      costiera di 2,5 per 10,5 chilometri che racchiude le dune più grandi delle Canarie. Si estende su oltre
      2600 ettari nel comune di La Oliva ed è stato istituito come parco naturale nel 1994. Ma la sabbia
      dorata è solo metà del quadro, poiché il parco racchiude due settori paesaggisticamente opposti.
    landscape: >-
      A nord, a ridosso dell'abitato di Corralejo, si sviluppa il più vasto campo dunare delle Canarie: una
      sterminata distesa di sabbie bianche lambita da acque cristalline. L'origine è organica. Le dune nascono
      dalla frammentazione minuta di conchiglie di molluschi e gusci di organismi marini, originando un
      apparato dunare mobile che ricopre in parte formazioni sabbiose fossili risalenti al Pleistocene
      superiore. Lungo vari tratti di costa affiora inoltre una paleo-spiaggia fossilizzata ricca di resti
      marini.


      A sud lo scenario muta radicalmente. Il settore meridionale è vulcanico, sfumato in toni d'ocra, ruggine
      e rosso vivo, dal rilievo aspro. Tra i due estremi il parco accosta piane alofile costiere, sabbie
      mobili e consolidate, bacini argillosi e distese di malpaís lavico.


      La vegetazione si adatta a ciascun microambiente. Sulla fascia costiera vegetano loto delle Canarie,
      gramigna delle spiagge, vilucchio marino e ravastrello; sul malpaís compaiono euforbie selvatiche e
      succulente.
    wildlife: >-
      Tra i volatili più tipici di Fuerteventura spiccano la saltimpalo delle Canarie, endemica esclusiva
      dell'isola, l'[ubara africana](/especie/chlamydotis_undulata/), l'occhione, la grandule, il
      trombettiere, il falco pellegrino di Barberia e il capovaccaio delle Canarie (guirre), taxon minacciato
      di estinzione. L'area avifaunistica ospita ubara, occhione, corrione biondo e pispola di Berthelot. A
      terra vivono toporagni delle Canarie, lucertole atlantiche e gechi geco. Complessivamente Fuerteventura
      vanta 2.672 specie terrestri, delle quali 541 sono endemiche dell'arcipelago e 128 esclusive dell'isola.


      Il mare arricchisce la biodiversità. Le acque di La Oliva accolgono tursiopi, stenelle striate, grampi,
      zifi di Cuvier, capodogli e balenottere di Bryde. Il comune suggerisce dieci punti strategici per
      l'osservazione faunistica, tra cui il faro del Tostón e Majanicho.
    visit: >-
      La litoranea FV-1 taglia il parco, ma le auto vanno lasciate nelle piazzole laterali per procedere a
      piedi. Nel settore vulcanico servono scarponcini da trekking: con una salita di circa 300 metri si
      raggiunge la vetta della Montaña Roja, con vedute aperte su Lanzarote e La Graciosa. Il Cabildo insulare
      ha allestito un circuito botanico di novanta minuti tra le dune, e il comune di La Oliva pubblica guide
      escursionistiche per orientarsi sui tracciati.


      Porta sempre una scorta d'acqua per esplorare le sabbie.
    history: >-
      L'apparato dunare è classificato come zona a uso ristretto nel piano di gestione del parco. Oltre la
      metà del territorio di La Oliva è protetta e l'intera isola costituisce Riserva della Biosfera UNESCO.
      Il Cabildo diffida formalmente dal prelievo di pietre, conchiglie e noduli calcarei; gli scarti
      alimentari lasciati dai bagnanti attirano ratti e gatti randagi, letali per l'avifauna terricola come il
      guirre e l'ubara.
    before: >-
      Cammina solo sui percorsi battuti e rispetta le paline di confine: abbandonare i varchi danneggia la
      coltre dunare. Non raccogliere ciottoli, non erigere torrette di pietre e riporta via ogni rifiuto.
    around: >-
      Il [Parque Natural Marítimo-Terrestre del Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/) condivide con Corralejo
      l'ubara africana, associando litorali marini ed ecosistemi steppici.
  pt:
    intro: >-
      Imagina um deserto de areia branca que mergulha sem transição num mar turquesa. É essa a primeira
      panorâmica do Parque Natural de Corralejo, no nordeste de Fuerteventura: uma faixa costeira de 2,5 por
      10,5 quilómetros com o maior complexo dunar das Canárias. Reúne mais de 2600 hectares no município de La
      Oliva e foi classificado como parque natural em 1994. Contudo, a areia é apenas metade do cenário, já
      que o parque congrega duas áreas marcadamente contrastantes.
    landscape: >-
      A norte, junto à vila de Corralejo, estende-se o maior campo dunar das Ilhas Canárias: uma imensa mancha
      de areias claras banhada por águas transparentes. A sua génese é puramente biogénica. As dunas formam-se
      a partir da desagregação e pulverização de conchas de moluscos e esqueletos de organismos marinhos,
      criando um cordão móvel que cobre parcialmente dunas fósseis do Plistoceno superior. Em vários troços do
      litoral aflora uma antiga praia fóssil consolidada rica em vestígios marinhos.


      A sul o cenário transfigura-se. O setor meridional é vulcânico, exibindo tonalidades ocre, telha e
      vermelhas de relevo escarpado. Entre os dois setores, o parque acolhe zonas halófitas litorais, areias
      móveis e dunas fósseis, depressões argilosas e campos de lava áspera (malpaís).


      A vegetação reparte-se pelas faixas de terreno. Na orla costeira medram o balancón, o
      trevo-das-canárias, a couve-marinha e a corriola-das-praias; no malpaís pedregoso surgem eufórbias
      selvagens e plantas suculentas.
    wildlife: >-
      Entre as aves mais distintas do norte da ilha contam-se o cartaxo-das-canárias, endémico estrito de
      Fuerteventura, a [hubara](/especie/chlamydotis_undulata/), o alcaravão, o cortiçol-de-barriga-preta, o
      pintarroxo-trombeteiro, o falcão-da-barbária e o abutre-do-egito canário (guirre), espécie ameaçada. A
      Zona de Importância para as Aves acolhe hubaras, alcaravões, corredores-saharianos e
      petinhas-de-berthelot. Em terra habitam musaranhos-canários, lagartixas-atlânticas e osgas. No total,
      Fuerteventura acolhe 2.672 espécies terrestres, das quais 541 são endémicas das Canárias e 128
      exclusivas da ilha.


      O mar circundante proporciona avistamentos cetológicos. Nas águas de La Oliva observam-se
      roazes-corvineiros, golfinhos-riscados, grampos, zífios de Cuvier, cachalotes e baleias-de-bryde. O
      município sugere dez sítios preferenciais de observação da fauna, como o farol do Tostón e Majanicho.
    visit: >-
      A estrada litoral FV-1 cruza o parque, mas as viaturas devem ficar estacionadas nas bermas preparadas
      para se aceder a pé. Para o lado vulcânico convém levar calçado de caminhada: numa subida de cerca de
      300 metros atinge-se o topo do vulcão Montaña Roja, avistando-se Lanzarote e La Graciosa no mar. O
      Cabildo insular preparou um percurso botânico de noventa minutos pelas dunas, e a autarquia de La Oliva
      disponibiliza um guia de trilhos locais.


      Leva água e respeita as dunas durante o passeio.
    history: >-
      O campo dunar está catalogado como zona de uso restrito no plano de ordenamento do parque. Além disso,
      mais de metade do concelho de La Oliva encontra-se sob regime de conservação e toda a ilha é Reserva da
      Biosfera. O Cabildo proíbe a apanha de conchas, pedras e fósseis; os restos de comida deixados por
      visitantes favorecem roedores e gatos errantes, que predam espécies ameaçadas como o guirre e a hubara.
    before: >-
      Caminha apenas pelos trilhos marcados e respeita as vedações: sair dos percursos danifica a estrutura
      das dunas. Não recolhas pedras nem construas pilhas de calhaus, trazendo contigo todo o lixo.
    around: >-
      O [Parque Natural Marítimo-Terrestre del Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/) partilha com Corralejo a
      hubara, conjugando zonas costeiras, estepes e meio marinho.
