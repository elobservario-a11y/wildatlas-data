    Zona montañosa transfronteriza caracterizada por una alta densidad de hayedos maduros preservados del
    desarrollo urbano.
  en: >-
    Cross-border mountainous area characterized by a high density of mature beech forests preserved from urban
    development.
  fr: >-
    Espace montagnard transfrontalier caractérisé par une forte densité de hêtraies matures préservées du
    développement urbain.
  de: >-
    Grenzüberschreitende Bergregion mit einer hohen Dichte an alten Buchenwäldern, die vor städtischer
    Erschließung bewahrt wurden.
  it: >-
    Area montuosa transfrontaliera caratterizzata da un'alta densità di faggete mature preservate dallo
    sviluppo urbano.
  pt: >-
    Área montanhosa transfronteiriça caracterizada por uma elevada densidade de faiais maduros preservados da
    expansão urbana.
unico:
  es: >-
    La franja de exclusión militar del Telón de Acero protegió el bosque, sin proponérselo, durante cuarenta
    años.
  en: The military exclusion strip of the Iron Curtain inadvertently shielded the forest for forty years.
  fr: >-
    La zone d'exclusion militaire du rideau de fer a protégé la forêt, bien involontairement, pendant quarante
    ans.
  de: >-
    Der militärische Sperrstreifen des Eisernen Vorhangs schützte den Wald vierzig Jahre lang ganz
    unabsichtlich.
  it: >-
    La fascia di esclusione militare della Cortina di Ferro ha protetto il bosco, involontariamente, per
    quarant'anni.
  pt: >-
    A faixa de exclusão militar da Cortina de Ferro protegeu a floresta, sem o pretender, durante quarenta
    anos.
observaciones:
  es: >-
    Las mejores fechas van de mayo a octubre. El bosque de Žofín permanece cerrado al público desde 1991. Para
    las rutas con cumbres, la cima de Vysoká no tiene vistas, porque su antigua torre ya no existe.
texto:
  es:
    intro: >-
      Durante décadas casi nadie pudo pasar. La antigua frontera del Telón de Acero cortó el acceso a las
      Novohradské hory, la población germano-bohemia fue expulsada y la región quedó vedada a los turistas. El
      resultado fue involuntario: un bosque que siguió creciendo con mucha naturalidad. Hoy las Novohradské
      hory son una zona montañosa transfronteriza entre Chequia y Austria, de las que cerca de tres cuartas
      partes están cubiertas de bosque.
    landscape: >-
      El macizo se extiende por la frontera entre Chequia y Austria. En el lado checo las cumbres más altas
      son el Kamenec, la Myslivna y la Vysoká, entre 1034 y 1073 metros; la cima más alta del conjunto, el
      Viehberg, queda en Austria, con 1112 metros.


      La región forestal natural de Novohradské hory tiene 14455 hectáreas y un 81,7 % de cobertura boscosa, y
      ocupa el tercer lugar entre las áreas forestales naturales checas por proporción de bosque. Una figura
      de protección de gran escala cubre dos tercios de sus bosques, y la proporción de bosque incluida en la
      zona protegida de acumulación natural de agua es la mayor entre las regiones forestales naturales. En
      2007 el vendaval Kyrill dañó gravemente estos bosques.
    wildlife: >-
      La zona de aves de las Novohradské hory se declaró para proteger al grévol y al [pico
      tridáctilo](/especie/picoides_tridactylus/). También viven aquí la [cigüeña
      negra](/especie/ciconia_nigra/), el [picamaderos negro](/especie/dryocopus_martius/), la paloma zurita,
      el [guion de codornices](/especie/crex_crex/) y el [mochuelo chico](/especie/glaucidium_passerinum/).


      En el sendero Sokolí hnízdo hay extensas poblaciones de campanilla de primavera y arbustos protegidos
      como el torvisco y el tejo. Entre los animales protegidos están el [mirlo
      acuático](/especie/cinclus_cinclus/), el [martín pescador](/especie/alcedo_atthis/) y el murciélago
      orejudo. Un roble común del recorrido tiene 8 metros de perímetro y se estima entre 400 y 500 años. Se
      recomienda hacerlo en primavera, verano u otoño.
    visit: >-
      El sendero educativo Sokolí hnízdo recorre los alrededores de Nové Hrady y ecosistemas típicos del
      parque natural. Mide 3 km, dura entre dos y tres horas, discurre por caminos sin pavimentar y se
      clasifica como moderadamente fácil. Sale de la escuela primaria de Nové Hrady y permite conocer los
      ecosistemas naturales y cultivados del parque.


      Para las cumbres, la ruta «Primeras tres cumbres de las Novohradské hory» mide 9,4 km y se hace en unas
      cinco horas. La mejor base es el caserío de Hojná Voda, con autobús directo desde České Budějovice. En
      la cumbre de Kraví hora hay una torre mirador desde la que, con buena visibilidad, se ve casi toda
      Bohemia del Sur. Desde la ruta se puede desviar al bosque primario de Hojná Voda, que tiene un sendero
      educativo.
    history: >-
      Los dos bosques primarios más antiguos del país, Žofín y Hojná Voda, están aquí. En Žofínský prales los
      árboles más viejos tienen hasta 400 años, dominan las hayas con menos abetos rojos y abetos blancos, y
      desde 1991 el bosque está vallado y cerrado al público. Un abeto blanco famoso, la «reina de los
      abetos», llegó a 425 años y 51 m de altura antes de caer en una tormenta.
    before: >-
      Las mejores fechas van de mayo a octubre. El bosque de Žofín permanece cerrado al público desde 1991.
      Para las rutas con cumbres, la cima de Vysoká no tiene vistas, porque su antigua torre ya no existe.
    around: >-
      Dentro del macizo está el [Bosque Virgen de Žofín y Macizo
      Circundante](/lugar/zofinsky-prales---okolni-lesy/), que cuenta aparte la historia de ese bosque.
  en:
    intro: >-
      For decades almost no one could enter. The former Iron Curtain boundary severed access to the
      Novohradské hory, the German-Bohemian population was displaced, and the entire border range was closed
      to visitors. The unintended outcome was a vast forest landscape that continued to develop with
      undisturbed natural processes. Today the Novohradské hory form a transboundary mountain region between
      Czechia and Austria, with roughly three-quarters of the terrain cloaked in continuous woodland.
    landscape: >-
      The massif straddles the international border between Czechia and Austria. On the Czech side the highest
      summits include Kamenec, Myslivna, and Vysoká, rising between 1034 and 1073 metres; the overall highest
      peak, Viehberg, stands in Austria at 1112 metres.


      The natural forest district of Novohradské hory encompasses 14455 hectares with 81.7 % forest cover,
      ranking third among Czech natural forest areas in terms of woodland percentage. A large-scale protected
      landscape regime encompasses two-thirds of its woodlands, and the share of forest included within the
      protected zone of natural water accumulation is the highest among all natural forest regions. In 2007
      windstorm Kyrill inflicted severe damage on these woodlands.
    wildlife: >-
      The bird protection area of the Novohradské hory was designated to conserve hazel grouse and the
      [three-toed woodpecker](/especie/picoides_tridactylus/). Other resident species include the [black
      stork](/especie/ciconia_nigra/), [black woodpecker](/especie/dryocopus_martius/), stock dove,
      [corncrake](/especie/crex_crex/), and [pygmy owl](/especie/glaucidium_passerinum/).


      Along the Sokolí hnízdo educational path thrive extensive carpets of spring snowflakes alongside
      protected shrubs like mezereon and English yew. Protected animals include the [white-throated
      dipper](/especie/cinclus_cinclus/), [common kingfisher](/especie/alcedo_atthis/), and brown long-eared
      bat. A monumental pedunculate oak along the route boasts an 8-metre girth and is estimated at 400 to 500
      years old. Visits are best timed in spring, summer, or autumn.
    visit: >-
      The Sokolí hnízdo educational trail circles the environs of Nové Hrady and representative ecosystems of
      the natural park. It measures 3 km, takes between two and three hours, follows unpaved tracks, and is
      graded as moderately easy. Departing from the Nové Hrady elementary school, it introduces both natural
      and cultural landscape habitats.


      To reach the peaks, the 'First three summits of the Novohradské hory' trail covers 9.4 km and requires
      around five hours. The best starting base is the hamlet of Hojná Voda, serviced by direct bus from České
      Budějovice. Atop Kraví hora stands a lookout tower offering panoramic vistas across nearly all of South
      Bohemia in clear weather. From this itinerary you can detour to the Hojná Voda virgin forest, which
      features its own educational interpretive trail.
    history: >-
      The two oldest primeval forest reserves in the country, Žofín and Hojná Voda, are situated here. In
      Žofínský prales the oldest trees reach up to 400 years of age, dominated by beech with scattered Norway
      spruce and silver fir; since 1991 the core woodland has been fenced and barred from public access. A
      celebrated silver fir, dubbed the 'queen of firs', reached 425 years and 51 m in height before falling
      in a gale.
    before: >-
      The best months for hiking run from May to October. Žofín primeval forest remains strictly closed to the
      public since 1991. When climbing the peaks, note that Vysoká summit has no panoramic view because its
      historic observation tower is gone.
    around: >-
      Nested within the range lies [Žofín Primeval Forest and Surrounding
      Woodlands](/lugar/zofinsky-prales---okolni-lesy/), which recounts the specific history of that protected
      forest.
  fr:
    intro: >-
      Pendant plusieurs décennies, presque personne ne put franchir cette frontière. L'ancien rideau de fer
      ferma l'accès aux Novohradské hory, la population germano-bohémienne fut expulsée et la région resta
      totalement interdite aux visiteurs. Ce vide engendra une forêt qui continua d'évoluer en libre
      dynamique. Les Novohradské hory forment aujourd'hui un massif transfrontalier entre la Tchéquie et
      l'Autriche, dont environ les trois quarts de la superficie sont vêtus de boisements continus.
    landscape: >-
      Le massif s'étire de part et d'autre de la frontière tchéco-autrichienne. Du côté tchèque, les plus
      hauts sommets sont le Kamenec, la Myslivna et la Vysoká, qui oscillent entre 1034 et 1073 mètres ; le
      point culminant de l'ensemble, le Viehberg, se situe en Autriche à 1112 mètres d'altitude.


      La région forestière naturelle des Novohradské hory rassemble 14455 hectares avec 81,7 % de boisement,
      se classant au troisième rang des régions forestières naturelles tchèques pour son taux de couverture
      boisée. Une protection paysagère d'envergure englobe les deux tiers de ces forêts, et la part forestière
      inscrite dans la zone protégée d'accumulation naturelle d'eau est la plus haute du pays. En 2007, la
      tempête Kyrill a lourdement endommagé ces massifs boisés.
    wildlife: >-
      La zone de protection des oiseaux des Novohradské hory a été établie pour sauvegarder la gélinotte des
      bois et le [pic tridactyle](/especie/picoides_tridactylus/). Le site accueille également la [cigogne
      noire](/especie/ciconia_nigra/), le [pic noir](/especie/dryocopus_martius/), le pigeon colombin, le
      [râle des genêts](/especie/crex_crex/) et la [chevêchette d'Europe](/especie/glaucidium_passerinum/).


      Le sentier pédagogique Sokolí hnízdo héberge d'abondantes colonies de nivéoles de printemps et des
      arbustes protégés tels que le daphné bois-joli et l'if commun. Parmi les espèces remarquables figurent
      le [cincle plongeur](/especie/cinclus_cinclus/), le [martin-pêcheur d'Europe](/especie/alcedo_atthis/)
      et l'oreillard roux. Un chêne pédonculé monumental borde le parcours avec 8 mètres de circonférence et
      un âge estimé entre 400 et 500 ans. Randonnez-y de préférence au printemps, en été ou en automne.
    visit: >-
      Le sentier pédagogique Sokolí hnízdo fait le tour des environs de Nové Hrady et des milieux typiques du
      parc naturel. Long de 3 km, il requiert entre deux et trois heures, chemine sur des pistes de terre et
      se classe comme modéré. Partant de l'école primaire de Nové Hrady, il permet d'apprécier la diversité
      des écosystèmes forestiers et pastoraux.


      Pour gravir les sommets, le circuit des « Trois premiers sommets des Novohradské hory » mesure 9,4 km et
      s'effectue en environ cinq heures. Le point de départ idéal est le hameau de Hojná Voda, relié en bus
      direct à České Budějovice. Au sommet de Kraví hora se dresse une tour d'observation qui embrasse par
      temps clair presque toute la Bohême du Sud. L'itinéraire permet de faire un crochet par la forêt
      primaire de Hojná Voda, dotée de son propre sentier d'interprétation.
    history: >-
      Les deux plus anciennes réserves de forêts primaires du pays, Žofín et Hojná Voda, se trouvent ici. Dans
      le Žofínský prales, les plus vieux arbres atteignent 400 ans, dominés par les hêtres avec des épicéas et
      des sapins blancs ; depuis 1991, ce cœur boisé est entièrement clôturé et fermé au public. Un sapin
      blanc emblématique, nommé la « reine des sapins », a vécu 425 ans et culminé à 51 m de haut avant d'être
      renversé par un coup de vent.
    before: >-
      La période idéale va de mai à octobre. La réserve de Žofín reste rigoureusement close au public depuis
      1991. Sur les crêtes, le mont Vysoká est privé de point de vue dégagé car son ancienne tour de guet
      n'existe plus.
    around: >-
      Au cœur du massif s'étend la [forêt vierge de Žofín et les forêts
      environnantes](/lugar/zofinsky-prales---okolni-lesy/), qui retrace l'histoire singulière de ce boisement
      préservé.
  de:
    intro: >-
      Jahrzehntelang konnte kaum jemand dieses Grenzland betreten. Der Eiserne Vorhang schnitt den Zugang zu
      den Novohradské hory ab, die deutsch-böhmische Bevölkerung wurde vertrieben und die gesamte Region blieb
      für Besucher gesperrt. Das ungewollte Resultat war ein Waldgebiet, das sich ungestört und naturnah
      weiterentwickelte. Heute bilden die Novohradské hory ein grenzüberschreitendes Bergland zwischen
      Tschechien und Österreich, dessen Fläche zu fast drei Vierteln von dichten Wäldern bedeckt ist.
    landscape: >-
      Das Massiv erstreckt sich entlang der tschechisch-österreichischen Grenze. Auf tschechischer Seite
      gehören Kamenec, Myslivna und Vysoká mit 1034 bis 1073 Metern zu den höchsten Gipfeln; die höchste
      Erhebung des Gebirges, der Viehberg, liegt mit 1112 Metern in Österreich.


      Das Naturwaldgebiet Novohradské hory umfasst 14455 Hektar und weist einen Waldanteil von 81,7 % auf,
      womit es den dritten Platz unter den tschechischen Waldgebieten einnimmt. Ein großflächiges
      Landschaftsschutzgebiet deckt zwei Drittel der Wälder ab, und der Anteil an Wasserschutzwäldern ist der
      höchste im ganzen Land. Im Jahr 2007 richtete der Orkan Kyrill in diesen Beständen schwere Verwüstungen
      an.
    wildlife: >-
      Das Vogelschutzgebiet Novohradské hory wurde ausgewiesen, um das Haselhuhn und den
      [Dreizehenspecht](/especie/picoides_tridactylus/) zu schützen. Zudem brüten hier der
      [Schwarzstorch](/especie/ciconia_nigra/), der [Schwarzspecht](/especie/dryocopus_martius/), die
      Hohltaube, der [Wachtelkönig](/especie/crex_crex/) und der
      [Sperlingskauz](/especie/glaucidium_passerinum/).


      Entlang des Lehrpfads Sokolí hnízdo gedeihen reiche Vorkommen der Frühlingsknotenblume sowie geschützte
      Gehölze wie Seidelbast und Eibe. Zu den geschützten Tieren gehören die
      [Wasseramsel](/especie/cinclus_cinclus/), der [Eisvogel](/especie/alcedo_atthis/) und das Braune
      Langohr. Eine mächtige Stieleiche am Wegesrand besitzt einen Umfang von 8 Metern und wird auf 400 bis
      500 Jahre geschätzt. Wanderungen lohnen sich besonders im Frühjahr, Sommer oder Herbst.
    visit: >-
      Der Lehrpfad Sokolí hnízdo erkundet die Umgebung von Nové Hrady und charakteristische Lebensräume des
      Naturparks. Er ist 3 km lang, dauert zwei bis drei Stunden, führt über unbefestigte Waldwege und gilt
      als mittelschwer. Ausgehend von der Grundschule in Nové Hrady vermittelt er Einblicke in naturnahe und
      forstliche Ökosysteme.


      Für Gipfeltouren bietet sich die Route 'Erste drei Gipfel des Gratzen-Gebirges' an, die 9,4 km misst und
      etwa fünf Stunden erfordert. Der beste Ausgangspunkt ist Hojná Voda mit direkter Busverbindung aus České
      Budějovice. Auf der Kraví hora steht ein Aussichtsturm, der bei guter Fernsicht fast ganz Südböhmen
      überblickt. Von der Route aus lohnt ein Abstecher in den Urwald Hojná Voda mit eigenem Lehrpfad.
    history: >-
      Die beiden ältesten Urwaldreservate des Landes, Žofín und Hojná Voda, liegen hier. Im Žofínský prales
      erreichen die ältesten Bäume bis zu 400 Jahre, dominiert von Rotbuchen mit Fichten und Weißtannen; seit
      1991 ist der Kernbereich eingezäunt und für Besucher unzugänglich. Eine berühmte Tanne, die 'Königin der
      Tannen', erreichte 425 Jahre und 51 m Höhe, bevor sie in einem Sturm fiel.
    before: >-
      Die besten Monate für eine Reise sind Mai bis Oktober. Der Žofín-Urwald bleibt seit 1991 für die
      Öffentlichkeit gesperrt. Auf Bergtouren bietet der Gipfel der Vysoká keine Aussicht mehr, da der
      historische Turm nicht mehr steht.
    around: >-
      Mitten im Gebirge liegt der [Urwald Žofín und die umliegenden
      Wälder](/lugar/zofinsky-prales---okolni-lesy/), der die wechselvolle Schutzgeschichte dieses Urwalds
      dokumentiert.
  it:
    intro: >-
      Per decenni quasi nessuno ha potuto varcare questo confine. La vecchia Cortina di Ferro sbarrò l'accesso
      ai monti Novohradské, la popolazione tedesco-boema fu allontanata e l'intera regione rimase interdetta
      al turismo. Il risultato fu involontario: una grande foresta che ha continuato a crescere indisturbata.
      Oggi le Novohradské hory formano una zona montuosa transfrontaliera tra Cechia e Austria, coperta per
      circa tre quarti da boschi continui.
    landscape: >-
      Il massiccio si sviluppa lungo la frontiera tra Cechia e Austria. Sul versante ceco le cime più alte
      sono il Kamenec, la Myslivna e la Vysoká, comprese tra 1034 e 1073 metri; la vetta più elevata del
      gruppo, il Viehberg, si trova in Austria a 1112 metri.


      La regione forestale naturale delle Novohradské hory misura 14455 ettari con una copertura boschiva
      dell'81,7 %, posizionandosi al terzo posto tra i comprensori forestali cechi per densità di bosco. Una
      tutela paesaggistica su vasta scala interessa due terzi del territorio, e la quota di foresta compresa
      nella riserva idrica naturale è la più elevata del paese. Nel 2007 la tempesta Kyrill ha arrecato gravi
      danni a questi popolamenti.
    wildlife: >-
      L'area di protezione avifaunistica delle Novohradské hory è stata designata per tutelare il francolino
      di monte e il [picchio tridattilo](/especie/picoides_tridactylus/). Vi nidificano anche la [cicogna
      nera](/especie/ciconia_nigra/), il [picchio nero](/especie/dryocopus_martius/), la colombella, il [re di
      quaglie](/especie/crex_crex/) e la [civetta nana](/especie/glaucidium_passerinum/).


      Lungo il sentiero didattico Sokolí hnízdo crescono estesi popolamenti di campanellino primaverile e
      arbusti rari come il fior di stecco e il tasso. Tra la fauna protetta spiccano il [merlo
      acquaiolo](/especie/cinclus_cinclus/), il [martin pescatore](/especie/alcedo_atthis/) e il serotino
      bruno. Una farnia monumentale situata lungo il percorso misura 8 metri di circonferenza ed è stimata tra
      400 e 500 anni. Si consiglia di visitarla in primavera, estate o autunno.
    visit: >-
      Il sentiero didattico Sokolí hnízdo esplora i dintorni di Nové Hrady e gli ambienti del parco naturale.
      Misura 3 km, richiede tra due e tre ore, si sviluppa su carrarecce sterrate ed è valutato di difficoltà
      facile-moderata. Con partenza dalla scuola primaria di Nové Hrady, illustra la struttura degli habitat
      forestali e rurali.


      Per raggiungere le cime, l'anello delle 'Prime tre vette delle Novohradské hory' è lungo 9,4 km e si
      compie in circa cinque ore. Il miglior punto di partenza è la frazione di Hojná Voda, servita da autobus
      diretti da České Budějovice. Sulla vetta di Kraví hora sorge una torre panoramica da cui si domina quasi
      tutta la Boemia Meridionale nelle giornate limpide. Lungo il percorso è possibile deviare verso la
      foresta vergine di Hojná Voda, dotata di un percorso didattico.
    history: >-
      Le due riserve forestali vergini più antiche del paese, Žofín e Hojná Voda, si trovano qui. Nel Žofínský
      prales gli alberi più vetusti raggiungono i 400 anni, con dominanza di faggio e presenze di abete rosso
      e abete bianco; dal 1991 la riserva è recintata e interdetta al pubblico. Un celebre abete bianco, noto
      come la 'regina degli abeti', visse 425 anni raggiungendo 51 m d'altezza prima di cadere per una
      tempesta.
    before: >-
      Il periodo più indicato va da maggio a ottobre. La riserva vergine di Žofín resta interdetta alle visite
      dal 1991. Nelle escursioni verso le cime, la vetta di Vysoká non offre visuali aperte poiché la vecchia
      torre panoramica non esiste più.
    around: >-
      All'interno del comprensorio montano si trova la [foresta vergine di Žofín e foreste
      limitrofe](/lugar/zofinsky-prales---okolni-lesy/), che approfondisce la storia di questa riserva
      forestale.
  pt:
    intro: >-
      Durante décadas quase ninguém pôde atravessar esta fronteira. A antiga Cortina de Ferro cortou os
      acessos às Novohradské hory, a população germano-boémia foi forçada a partir e a região ficou vedada aos
      forasteiros. O efeito inesperado foi uma imensa floresta que continuou a crescer em ritmo natural. Hoje,
      as Novohradské hory constituem uma zona montanhosa transfronteiriça entre a Chéquia e a Áustria, onde
      cerca de três quartos do território estão cobertos por bosques densos.
    landscape: >-
      O maciço desenvolve-se ao longo da linha de fronteira entre a Chéquia e a Áustria. No lado checo, as
      elevações mais altas são o Kamenec, a Myslivna e a Vysoká, situadas entre 1034 e 1073 metros; o cume
      mais elevado de todo o conjunto, o Viehberg, fica na Áustria a 1112 metros.


      A região florestal natural de Novohradské hory abrange 14455 hectares com 81,7 % de densidade florestal,
      ocupando o terceiro lugar entre as áreas florestais checas em termos de área arborizada. Uma
      classificação paisagística de grande escala abrange dois terços das matas, e a proporção florestal
      inserida na bacia protegida de acumulação hídrica natural é a mais elevada do país. Em 2007, o vendaval
      Kyrill causou fortes estragos nestas florestas.
    wildlife: >-
      A zona de proteção de aves das Novohradské hory foi designada para salvaguardar a galinha-do-mato e o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/). Aqui habitam também a
      [cegonha-preta](/especie/ciconia_nigra/), o [pica-pau-preto](/especie/dryocopus_martius/), o
      pombo-bravo, o [codornizão](/especie/crex_crex/) e o [mocho-pigmeu](/especie/glaucidium_passerinum/).


      No trilho pedagógico Sokolí hnízdo surgem extensos mantos de campainhas-da-primavera e arbustos
      protegidos como o trovisco e o teixo. Entre a fauna protegida encontram-se o
      [melro-d'água](/especie/cinclus_cinclus/), o [guarda-rios](/especie/alcedo_atthis/) e o
      morcego-orelhudo. Um carvalho-roble monumental no caminho possui 8 metros de perímetro e uma idade
      estimada entre 400 e 500 anos. Recomenda-se a visita na primavera, verão ou outono.
    visit: >-
      O percurso interpretativo Sokolí hnízdo explora os arredores de Nové Hrady e os ecossistemas
      característicos do parque natural. Tem 3 km, requer entre duas e três horas, segue por caminhos de terra
      batida e é de dificuldade moderada. Com início na escola básica de Nové Hrady, dá a conhecer os habitats
      naturais e os espaços agrossilvícolas.


      Para atingir os cumes, o trilho dos 'Três primeiros picos das Novohradské hory' estende-se por 9,4 km e
      completa-se em cerca de cinco horas. O melhor ponto de partida é a aldeia de Hojná Voda, com autocarro
      direto desde České Budějovice. No cimo de Kraví hora ergue-se uma torre de vigia que descortina quase
      toda a Boémia do Sul com boa visibilidade. Do trilho pode aceder-se à mata virgem de Hojná Voda, que
      possui um circuito didático próprio.
    history: >-
      As duas florestas virgens mais antigas do país, Žofín e Hojná Voda, encontram-se aqui. No Žofínský
      prales as árvores mais antigas atingem 400 anos, predominando as faias acompanhadas de espruces e
      abetos-brancos; desde 1991 o bosque está vedado e encerrado ao público. Um abeto-branco histórico,
      cognominado a 'rainha dos abetos', atingiu 425 anos e 51 m de altura antes de tombar numa tempestade.
    before: >-
      A melhor época para caminhar decorre entre maio e outubro. A mata virgem de Žofín permanece estritamente
      interdita ao público desde 1991. Nas subidas aos picos, o cume de Vysoká não oferece panorama por já não
      possuir a antiga torre.
    around: >-
      Integrado neste maciço situa-se a [Floresta Virgem de Žofín e Matas
      Envolventes](/lugar/zofinsky-prales---okolni-lesy/), que apresenta a história detalhada deste bosque
      protegido.
