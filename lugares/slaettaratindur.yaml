resumen:
  es: >-
    La cumbre más alta del archipiélago de las Islas Feroe (880 m), una montaña de meseta de basalto volcánico
    con vistas de 360° al océano.
  en: >-
    The highest summit in the Faroe Islands archipelago (880 m), a volcanic basalt plateau mountain commanding
    360° ocean views.
  fr: >-
    Le point culminant de l'archipel des îles Féroé (880 m), une montagne tabulaire de basalte volcanique
    offrant une vue à 360° sur l'océan.
  de: >-
    Der höchste Gipfel des Färöer-Archipels (880 m), ein vulkanischer Basalt-Tafelberg mit 360°-Panoramablick
    über den Nordatlantik.
  it: >-
    La vetta più alta dell'arcipelago delle Isole Fær Øer (880 m), una montagna tabulare di basalto vulcanico
    con vista a 360° sull'oceano.
  pt: >-
    O cume mais alto do arquipélago das Ilhas Faroé (880 m), uma montanha planáltica de basalto vulcânico com
    vistas de 360° sobre o oceano.
unico:
  es: Una cumbre plana de 880 metros desde la que, en un día despejado, se ven las dieciocho islas Feroe.
  en: A flat summit rising 880 metres from which, on a clear day, all eighteen Faroe Islands can be seen.
  fr: Un sommet plat de 880 mètres d'où l'on embrasse, par temps clair, la totalité des dix-huit îles Féroé.
  de: Ein 880 Meter hoher Tafelberggipfel, von dem man an klaren Tagen alle achtzehn Färöer-Inseln überblickt.
  it: >-
    Una cima pianeggiante di 880 metri da cui, nelle giornate terse, si scorgono tutte le diciotto isole Fær
    Øer.
  pt: Um cume plano de 880 metros a partir do qual, em dias límpidos, se avistam as dezoito ilhas Faroé.
observaciones:
  es: >-
    Cerca de la cima el suelo es de grava y piedras sueltas. La grava seca resbala y las rocas mojadas
    también. La bajada se hace por el mismo camino, y como cuesta reconocer el punto exacto por donde subiste,
    deja una mochila o un pañuelo de color junto a la «escalera» de roca para encontrar el paso de descenso.


    Cuenta con el viento y con la pendiente que cae a la izquierda en los últimos metros.
texto:
  es:
    intro: >-
      Hay una montaña en medio del océano que se sube pasando una valla junto a un aparcamiento.
      Slættaratindur, «cumbre plana», es el monte más alto de las Feroe: 880 metros en el norte de Eysturoy,
      entre los pueblos de Eiði, Gjógv y Funningur. Lo que cuenta no es la cifra, sino lo que te espera arriba
      cuando el cielo se abre: las dieciocho islas del archipiélago a la vista, de una sola mirada.
    landscape: >-
      Funningur se acurruca a los pies del monte, y el terreno es tan empinado que desde el propio pueblo la
      cumbre ni se ve. Slættaratindur es uno de los diez montes del archipiélago que superan los ochocientos
      metros, y a su lado, hacia el nordeste, se alza Gráfelli, el segundo de las Feroe, con 856 metros.


      Esa cima achatada no es una rareza. Las cumbres planas aparecen por todas las islas y reciben el nombre
      de montañas tabulares. La causa está en el origen del archipiélago: hace entre cincuenta y sesenta
      millones de años, una intensa actividad volcánica fue apilando capas de lava basáltica, alternadas con
      finas capas de ceniza. La ceniza blanda se erosiona deprisa; el basalto duro que queda encima se
      desprende, y así se forman las terrazas escalonadas. Después, la actividad glaciar rebajó las
      superficies de meseta, sobre todo en las islas del norte.


      Lo que cubre esas laderas es una vegetación humilde y resistente: plantas árticas y alpinas, flores
      silvestres, hierbas, musgo y liquen. En las tierras bajas domina el pastizal, con algo de brezal de
      [brecina](/especie/calluna_vulgaris/).
    wildlife: >-
      En esta montaña los protagonistas son las ovejas. Pastan hasta lo alto y te acompañan durante toda la
      subida, y no es casualidad: el nombre de las islas, Færeyjar, se interpreta sobre todo como «islas de
      las ovejas», por su abundancia en el archipiélago. De las aves, lo que se sabe del conjunto de las Feroe
      es que dominan las marinas y las de terreno abierto, como las de brezal.


      La estación va de mayo a septiembre, y el día del año es el 21 de junio, el más largo. Ese día, por
      tradición, mucha gente de todo el país sube a la cumbre para ver cómo se pone el sol y, unas horas
      después, cómo vuelve a salir. Mientras esperan el amanecer practican el baile en cadena y el canto
      tradicionales.


      El tiempo manda. Las islas son ventosas, nubladas y frescas todo el año, con una media de doscientos
      diez días de lluvia o nieve; los días de sol son raros y los cubiertos, habituales. Por eso la vista de
      las dieciocho islas es una recompensa que no se puede dar por hecha.
    visit: >-
      Hay dos puntos de partida. Desde Eiðisskarð, el paso entre Eiði y Funningur, la subida lleva menos de
      una hora de marcha; desde Gjógv, unas cuatro. En cualquier caso es empinada, pero no hace falta técnica
      de escalada.


      Desde Eiðisskarð la cosa empieza sin sendero. Pasa la valla del aparcamiento, en el punto más alto del
      paso, y sube en línea recta con la valla a tu derecha. Tras unos treinta o cuarenta minutos, a unos 670
      metros de altitud, llegas al camino que sube a la cima, inclinado hacia la izquierda. Ya ves Haldórsvík,
      con su iglesia de ocho lados, y la cadena de montañas que rodea los pueblos del norte.


      Sigue el camino un kilómetro cuesta arriba. A unos treinta metros de la cumbre gira y vuelve a la
      derecha; ahí hay varias huellas, y lo recomendado es subir por la parte de atrás del monte, donde
      tuerces a la derecha, y seguir con la cima a tu derecha. Los últimos metros son como una escalera de
      roca, con precipicio a la izquierda.


      También se puede subir desde el nordeste, desde el paso entre Funningur y Gjógv, y esa vía pasa por
      Gráfelli.
    history: >-
      Antes se daba como altura 882 metros; hoy se mide 880. Más difícil de resolver es la leyenda de la vista
      lejana: se dice que con el aire muy limpio se ve el Vatnajökull islandés, a quinientos cincuenta
      kilómetros, aunque los expertos dudan y apuntan a un posible espejismo.
    before: >-
      Cerca de la cima el suelo es de grava y piedras sueltas. La grava seca resbala y las rocas mojadas
      también. La bajada se hace por el mismo camino, y como cuesta reconocer el punto exacto por donde
      subiste, deja una mochila o un pañuelo de color junto a la «escalera» de roca para encontrar el paso de
      descenso.


      Cuenta con el viento y con la pendiente que cae a la izquierda en los últimos metros.
    around: >-
      La isla de [Kalsoy](/lugar/kalsoy/) queda a unos dos kilómetros, [los acantilados de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) a unos seis y [Viðoy](/lugar/vidoy/) a unos trece. Más lejos,
      [Achill Island](/lugar/achill-island/) comparte con Slættaratindur el paisaje de alta montaña y costa.
  en:
    intro: >-
      There is an ocean mountain climbed by stepping past a fence beside a roadside parking area.
      Slættaratindur, meaning 'flat peak', is the highest summit of the Faroes: 880 metres in northern
      Eysturoy, between the villages of Eiði, Gjógv, and Funningur. What matters is not merely the altitude,
      but the reward when the maritime sky clears: all eighteen islands of the archipelago unfolding in a
      single panorama.
    landscape: >-
      Funningur huddles at the foot of the massif, where the ground rises so precipitously that the summit
      cannot be seen from the village below. Slættaratindur is one of only ten summits across the archipelago
      exceeding eight hundred metres, flanked to the northeast by Gráfelli, the second highest peak of the
      Faroes at 856 metres.


      Its flattened top is by no means an anomaly. Tabletop summits occur across the islands, known locally as
      tabular mountains. The morphology stems from volcanic origins: between fifty and sixty million years
      ago, immense volcanic eruptions layered basalt lava sheets separated by thin beds of volcanic ash. The
      soft ash layers erode quickly; the harder overlying basalt collapses along vertical fractures, producing
      stepped trapp terraces. Subsequent Quaternary glaciation planed down the high plateaus, particularly in
      the northern isles.


      The vegetation clothing these slopes is hardy and modest: arctic-alpine flora, hardy wildflowers,
      mosses, and lichens. Lowland slopes are carpeted in maritime grasslands with localized patches of
      [heather](/especie/calluna_vulgaris/).
    wildlife: >-
      On this mountain, sheep take centre stage. They graze right up to the grassy plateau and keep you
      company throughout the climb, which is fitting: the name of the archipelago, Færeyjar, translates as
      'Sheep Islands' reflecting their historic preponderance. Birdlife across the Faroes is dominated by
      pelagic seabirds and open-ground moorland species.


      The hiking season spans May to September, with the premier day being 21 June, the summer solstice. On
      that longest day, tradition draws locals from across the archipelago to the summit to watch the sun dip
      below the ocean horizon and re-emerge hours later. Awaiting dawn, gatherings join in traditional Faroese
      chain dancing and folk ballads.


      Weather dictates every ascent. The islands remain windy, cool, and cloud-draped year-round, recording an
      average of two hundred and ten days with rain or snow; sunny spells are fleeting and overcast skies the
      rule. Sighting all eighteen islands remains a rare privilege.
    visit: >-
      Two primary starting points serve the mountain. From Eiðisskarð, the mountain pass between Eiði and
      Funningur, the direct hike takes under an hour; from Gjógv, the walk requires around four hours. Both
      routes are steep, yet neither demands technical climbing.


      From Eiðisskarð the route begins without a defined path. Step past the sheep gate beside the car park at
      the saddle and walk uphill alongside the fence line on your right. After thirty to forty minutes, around
      670 metres in elevation, you join the main path ascending towards the crest, angling to the left. Below
      you can see Haldórsvík with its octagonal church and the mountain chain circling the northern
      settlements.


      Follow the path uphill for one kilometre. About thirty metres below the top it bends right around the
      backside of the mountain; here multiple tracks diverge, and the recommended way circles clockwise
      keeping the summit knoll to your right. The final metres resemble a rocky staircase with a drop to your
      left.


      Another ascent ascends from the pass between Funningur and Gjógv to the northeast, passing beneath
      Gráfelli.
    history: >-
      Historic surveys previously cited 882 metres as its elevation; modern cartography records 880 metres.
      More enduring is the legend of the distant vista: it is said that in exceptionally pure air Iceland's
      Vatnajökull ice cap can be glimpsed five hundred and fifty kilometres away, though scientists attribute
      this to atmospheric mirages.
    before: >-
      Near the summit the footing turns to loose scree and gravel. Dry scree slips easily and wet basalt slabs
      are very slick. The descent traces the same route; because the exit gully can be difficult to spot from
      above, place a distinctive marker beside the rock staircase to locate the downward trail.


      Watch out for sudden gusts and the steep drop to your left along the final summit crest.
    around: >-
      The island of [Kalsoy](/lugar/kalsoy/) lies roughly two kilometres away, [Vestmanna Bird
      Cliffs](/lugar/vestmanna-bird-cliffs/) six kilometres, and [Viðoy](/lugar/vidoy/) thirteen kilometres.
      Farther south across the Atlantic, [Achill Island](/lugar/achill-island/) shares with Slættaratindur a
      similar blend of coastal precipices and high maritime mountains.
  fr:
    intro: >-
      Il existe une montagne au milieu de l'océan que l'on gravit en franchissant une clôture au bord d'un
      parking. Le Slættaratindur, « sommet plat », est le point culminant des Féroé : 880 mètres au nord
      d'Eysturoy, entre les villages d'Eiði, Gjógv et Funningur. Ce qui compte n'est pas tant l'altitude que
      l'horizon quand la brume se lève : les dix-huit îles de l'archipel d'un seul regard.
    landscape: >-
      Funningur est niché au pied du mont, et la pente est si rude que depuis le village on n'aperçoit même
      pas le sommet. Le Slættaratindur est l'un des dix sommets féringiens dépassant huit cents mètres ; à ses
      côtés, vers le nord-est, se dresse le Gráfelli, deuxième sommet des Féroé avec 856 mètres.


      Cette cime aplatie n'est pas une exception. Les sommets tabulaires ponctuent l'archipel. L'origine
      remonte à cinquante ou soixante millions d'années, quand un volcanisme intense empila d'épaisses coulées
      de basalte entrecoupées de fins lits de cendres. La cendre tendre s'érode vite ; le basalte dur
      s'effondre en gradins verticaux. Plus tard, l'érosion glaciaire a raboté ces plateaux, surtout dans les
      îles du Nord.


      Une végétation rase et rustique tapisse les pentes : plantes arctiques et alpines, mousses et lichens.
      Dans le bas dominent les pâturages maritimes et quelques landes à [callune](/especie/calluna_vulgaris/).
    wildlife: >-
      Sur cette montagne, les reines sont les brebis. Elles paissent jusqu'au sommet et vous escortent tout au
      long de la montée : le nom même des Féroé, Færeyjar, signifie les « îles des brebis ». L'avifaune de
      l'archipel est quant à elle dominée par les oiseaux marins pélagiques et les espèces des landes rases.


      La saison de randonnée s'étend de mai à septembre, avec un point d'orgue le 21 juin, solstice d'été. Ce
      jour-là, la tradition rassemble de nombreux Féringiens au sommet pour contempler le soleil se coucher
      puis renaître quelques heures plus tard, en dansant la ronde et en entonnant des ballades
      traditionnelles.


      Le climat décide de tout. Les îles sont ventées, fraîches et couvertes presque toute l'année, comptant
      en moyenne deux cent dix jours de pluie ou neige. Apercevoir les dix-huit îles reste un privilège.
    visit: >-
      Deux départs existent. Depuis Eiðisskarð, le col reliant Eiði à Funningur, l'ascension demande moins
      d'une heure ; depuis Gjógv, environ quatre heures. Dans les deux cas la pente est raide mais sans
      difficulté technique.


      Depuis Eiðisskarð, la marche débute sans sentier. Franchissez la clôture près du parking et montez droit
      avec le grillage sur votre droite. Après trente ou quarante minutes, vers 670 mètres d'altitude, on
      rejoint le sentier de crête orienté vers la gauche. On aperçoit alors Haldórsvík et son église
      octogonale.


      Suivez le chemin montant sur un kilomètre. À une trentaine de mètres sous la cime, contournez par la
      droite : plusieurs traces existent, le mieux étant de passer par l'arrière de la crête pour garder le
      sommet à main droite. Les derniers mètres forment un escalier de roche bordé d'un ravin à gauche.


      On peut également partir du col reliant Funningur à Gjógv au nord-est, en passant sous le Gráfelli.
    history: >-
      Les anciennes cartes lui attribuaient 882 mètres ; on mesure aujourd'hui 880 mètres. Plus tenace est la
      légende affirmant que par temps limpide on peut distinguer le Vatnajökull en Islande à cinq cent
      cinquante kilomètres, bien qu'il s'agisse vraisemblablement d'un mirage atmosphérique.
    before: >-
      Sous la cime le sol est meuble et caillouteux. Les pierres glissent et les dalles humides sont
      traîtresses. La descente s'effectue par le même tracé ; repérez bien le couloir de descente en laissant
      un objet visible en haut de l'escalier rocheux.


      Méfiez-vous du vent et du vide sur la gauche dans les derniers mètres.
    around: >-
      L'île de [Kalsoy](/lugar/kalsoy/) se trouve à environ deux kilomètres, [les falaises de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) à six kilomètres et [Viðoy](/lugar/vidoy/) à treize. Plus au
      sud, [Achill Island](/lugar/achill-island/) partage avec le Slættaratindur ce mariage de falaises
      côtières et de hauts reliefs maritimes.
  de:
    intro: >-
      Mitten im Ozean ragt ein Berg empor, dessen Anstieg an einem Zaun neben einem Parkplatz beginnt. Der
      Slættaratindur, 'flacher Gipfel', ist mit 880 Metern der höchste Berg der Färöer im Norden von Eysturoy
      zwischen Eiði, Gjógv und Funningur. Entscheidend ist der Rundblick, wenn der Himmel aufreißt: alle
      achtzehn Inseln des Archipels auf einen einzigen Blick.
    landscape: >-
      Funningur schmiegt sich an den Fuß des Massivs; das Gelände steigt so steil an, dass der Gipfel vom Dorf
      aus gar nicht zu sehen ist. Der Slættaratindur ist einer von nur zehn Bergen der Färöer über achthundert
      Metern Höhe; nordöstlich flankiert ihn der Gráfelli, der zweithöchste Berg der Inseln mit 856 Metern.


      Das abgeflachte Gipfeldach ist typisch für die Inseln, wo man von Tafelbergen spricht. Ursache ist die
      Entstehung des Archipels vor fünfzig bis sechzig Millionen Jahren, als gewaltiger Vulkanismus
      Basaltschichten übereinanderstapelte, getrennt durch feine Tuffbänder. Die weiche Asche verwittert
      rasch, die harten Basaltdecken brechen stufenförmig ab. Später ebneten eiszeitliche Gletscher die
      Plateaus ein.


      Die Berghänge tragen genügsame arktisch-alpine Vegetation, Wildblumen, Moose und Flechten. In tieferen
      Lagen dominieren Grasweiden mit Vorkommen von [Besenheide](/especie/calluna_vulgaris/).
    wildlife: >-
      Auf diesem Berg bestimmen Schafe das Bild. Sie weiden bis zum Gipfelplateau hinauf und begleiten den
      Aufstieg: Der Name der Färöer, Færeyjar, bedeutet 'Schafsinseln'. Die Vogelwelt der Inseln wird von
      Meeresvögeln und Vögeln offener Heidelandschaften geprägt.


      Die Wandersaison reicht von Mai bis September; der Höhepunkt ist der 21. Juni, der längste Tag des
      Jahres. An diesem Tag steigen Einheimische aus dem ganzen Land zur Mittsommernacht auf den Gipfel, um
      Sonnenuntergang und Sonnenaufgang zu erleben, begleitet von traditionellem Kettentanz und
      Balladengesang.


      Das Wetter setzt die Bedingungen. Die Inseln sind ganzjährig windig, kühl und feucht, mit
      durchschnittlich zweihundertzehn Tagen Niederschlag. Freie Sicht auf alle achtzehn Inseln ist ein
      seltenes Geschenk.
    visit: >-
      Zwei Routen führen hinauf. Vom Pass Eiðisskarð zwischen Eiði und Funningur dauert der Anstieg knapp eine
      Stunde; von Gjógv aus etwa vier Stunden. Beide Steige sind steil, erfordern jedoch kein Klettern.


      Ab Eiðisskarð wandert man zunächst weglos. Am Parkplatz quert man den Zaun und steigt am Weidezaun
      entlang bergan. Nach dreißig bis vierzig Minuten erreicht man auf etwa 670 Metern Höhe den eigentlichen
      Steig. Im Tal blickt man auf Haldórsvík mit seiner achteckigen Kirche.


      Folge dem Pfad einen Kilometer bergauf. Rund dreißig Meter unter dem Gipfel biegt der Weg nach rechts um
      den Bergstock; halte dich rechts, um die Felsenkuppe gegen den Uhrzeigersinn zu umgehen. Die letzten
      Meter bilden eine Felsentreppe mit steilem Abgrund zur Linken.


      Ein alternativer Aufstieg beginnt nordöstlich am Pass zwischen Funningur und Gjógv unterhalb des
      Gráfelli.
    history: >-
      Frühere Vermessungen gaben 882 Meter an; heute wird die Höhe mit 880 Metern beziffert. Berühmt ist die
      Legende, man könne bei reinster Luft den isländischen Vatnajökull in fünfhundertfünfzig Kilometern
      Entfernung sehen, was Physiker einer Luftspiegelung zuschreiben.
    before: >-
      Am Gipfelaufbau liegt loser Schotter. Trockener Schutt rutscht leicht, nasse Basaltplatten sind
      tückisch. Der Abstieg erfolgt auf demselben Weg; markiere den Einstieg in die Felsentreppe gut, um den
      Rückweg nicht zu verfehlen.


      Achte auf Sturmböen und den steilen Abhang zur Linken am Schlussgrat.
    around: >-
      Die Insel [Kalsoy](/lugar/kalsoy/) liegt rund zwei Kilometer entfernt, die [Vogelklippen von
      Vestmanna](/lugar/vestmanna-bird-cliffs/) sechs Kilometer und [Viðoy](/lugar/vidoy/) dreizehn. Weiter
      südlich teilt [Achill Island](/lugar/achill-island/) die maritime Hochgebirgslandschaft am offenen
      Atlantik.
  it:
    intro: >-
      In mezzo all'oceano sorge una montagna a cui si sale varcando una recinzione presso un parcheggio. Lo
      Slættaratindur, «cima piatta», è il tetto delle Fær Øer: 880 metri nel nord di Eysturoy, tra i borghi di
      Eiði, Gjógv e Funningur. Ciò che conta non è solo la quota, ma la vista quando le nubi si aprono: tutte
      le diciotto isole dell'arcipelago raccolte in un solo colpo d'occhio.
    landscape: >-
      Funningur sorge proprio ai piedi del rilievo, e il pendio è talmente ripido che dal villaggio la vetta
      non è visibile. Lo Slættaratindur è una delle dieci vette dell'arcipelago che superano gli ottocento
      metri; verso nord-est gli fa eco il Gráfelli, seconda cima feroese con 856 metri.


      Questa sommità spianata non è un'eccezione. I monti tabulari sono frequenti in tutto l'arcipelago,
      originati cinquanta o sessanta milioni di anni fa quando imponenti colate basaltiche si sovrapposero a
      sottili strati di cenere vulcanica. Le ceneri friabili si erodono rapidamente, causando il crollo del
      basalto superiore in terrazze gradonate. In seguito i ghiacciai quaternari hanno spianato gli altipiani.


      Le chine ospitano una rada flora artico-alpina, muschi e licheni. Alle quote basse prevalgono i pascoli
      marittimi con macchie di [brugo](/especie/calluna_vulgaris/).
    wildlife: >-
      Le vere padrone di casa sono le pecore. Pascolano fino al pianoro sommitale e accompagnano tutta la
      salita: il nome stesso dell'arcipelago, Færeyjar, si traduce come «isole delle pecore». Tra gli uccelli
      dominano le specie marine pelagiche e quelle delle brughiere aperte.


      La stagione escursionistica va da maggio a settembre, con il culmine il 21 giugno, il solstizio
      d'estate. In quella notte magica molti abitanti salgono in vetta per osservare il sole calare e
      risorgere poco dopo, intonando canti e danze tradizionali a catena.


      Il meteo detta legge. Le isole sono ventose, fresche e coperte di nebbia quasi tutto l'anno, con oltre
      duecentodieci giorni di pioggia o neve. Ammirare tutte le diciotto isole rimane un privilegio raro.
    visit: >-
      Vi sono due punti di partenza. Dal valico di Eiðisskarð tra Eiði e Funningur l'ascesa richiede meno di
      un'ora; da Gjógv occorrono circa quattro ore. Entrambi i sentieri sono ripidi ma privi di difficoltà
      alpinistiche.


      Da Eiðisskarð la salita parte libera sui prati. Oltrepassa il cancello accanto al parcheggio e sali
      dritto tenendo la staccionata a destra. Dopo trenta o quaranta minuti, a circa 670 metri di quota, si
      intercetta la traccia principale verso sinistra. In basso si scorge Haldórsvík con la sua chiesa a
      pianta ottagonale.


      Segui la traccia in salita per un chilometro. A trenta metri dalla cima piega a destra per aggirare il
      blocco sommitale tenendo la vetta alla tua destra. Gli ultimi passi risalgono una scalinata rocciosa con
      salto a sinistra.


      Si può salire anche da nord-est, dal valico tra Funningur e Gjógv passando sotto il Gráfelli.
    history: >-
      In passato le carte indicavano 882 metri; oggi la quota ufficiale è di 880 metri. Suggestiva resta la
      leggenda secondo cui col cielo terso si possa scorgere il ghiacciaio islandese Vatnajökull a
      cinquecentocinquanta chilometri, fenomeno spiegato dalla scienza come miraggio ottico.
    before: >-
      Vicino alla cima il terreno è coperto di detrito mobile. La ghiaia asciutta e le lastre umide sono
      scivolose. La discesa segue la stessa via; posiziona un contrassegno ben visibile in cima al gradino
      roccioso per ritrovare il canale di discesa.


      Attenzione alle forti raffiche di vento e all'esposizione a sinistra sulla cresta sommitale.
    around: >-
      L'isola di [Kalsoy](/lugar/kalsoy/) dista circa due chilometri, le [scogliere di
      Vestmanna](/lugar/vestmanna-bird-cliffs/) sei chilometri e [Viðoy](/lugar/vidoy/) tredici. Più a sud,
      [Achill Island](/lugar/achill-island/) condivide con lo Slættaratindur una simile combinazione di
      scogliere atlantiche e vette marittime.
  pt:
    intro: >-
      Há uma montanha oceânica cuja subida começa transpondo uma cerca junto a um parque de estacionamento. O
      Slættaratindur, «cume plano», é a montanha mais alta das Faroé: 880 metros no norte de Eysturoy, entre
      as aldeias de Eiði, Gjógv e Funningur. O encanto reside na amplitude do horizonte quando o nevoeiro
      levanta: avistar as dezoito ilhas do arquipélago num relance.
    landscape: >-
      Funningur aninha-se na base da montanha, e a encosta ergue-se com tal inclinação que da própria aldeia o
      cimo nem se vislumbra. O Slættaratindur é um dos dez picos do arquipélago que ultrapassam os oitocentos
      metros, ladeado a nordeste pelo Gráfelli, o segundo cume das Faroé com 856 metros.


      Este topo aplanado não constitui exceção. Os cumes em meseta abundam nas ilhas, conhecidos como
      montanhas tabulares. A sua génese remonta a erupções vulcânicas ocorridas há cinquenta ou sessenta
      milhões de anos, sobrepondo espessas camadas de basalto intercaladas por cinzas. As cinzas brandas
      desgastam-se depressa; o basalto compacto abate em degraus verticais. Mais tarde, os glaciares
      afeiçoaram os planaltos.


      As encostas sustentam flora ártico-alpina humilde, musgos e líquenes. Nos patamares inferiores dominam
      as pastagens húmidas com manchas de [urze](/especie/calluna_vulgaris/).
    wildlife: >-
      Nesta montanha as ovelhas são soberanas. Pastam até ao planalto cimeiro e cruzam-se com os caminhantes
      na subida: o próprio étimo das ilhas, Færeyjar, traduz-se por «ilhas das ovelhas». A avifauna é dominada
      por aves marinhas e espécies de charneca aberta.


      A época propícia vai de maio a setembro, destacando-se o dia 21 de junho, solstício de verão. Nessa data
      comemora-se a tradição de subir ao topo para ver o pôr e o nascer do sol separados por escassas horas,
      dançando em roda e entoando baladas tradicionais.


      O clima governa as ilhas. O arquipélago regista vento forte, nevoeiros e temperaturas amenas o ano
      inteiro, com média de duzentos e dez dias de chuva ou neve. O privilégio de avistar as dezoito ilhas
      exige um dia sem nuvens.
    visit: >-
      Existem dois pontos de subida. Desde Eiðisskarð, o colo entre Eiði e Funningur, a caminhada cumpre-se em
      menos de uma hora; a partir de Gjógv demora cerca de quatro horas. Ambos os percursos são íngremes, mas
      sem passos de escalada técnica.


      A partir de Eiðisskarð a subida arranca sem trilho marcado. Transpõe a cancela junto ao parque e sobe a
      direito acompanhando a vedação à tua direita. Ao fim de trinta a quarenta minutos, cerca dos 670 metros
      de altitude, alcanças o caminho batido para a esquerda. Ao fundo avista-se Haldórsvík com a sua igreja
      octogonal.


      Segue o trilho a subir ao longo de um quilómetro. A cerca de trinta metros do cimo vira para a direita
      para contornar a vertente traseira mantendo o topo à direita. Os metros finais assemelham-se a uma
      escadaria de lajes sobre o abismo.


      É também possível ascender pelo colo entre Funningur e Gjógv a nordeste, contornando o Gráfelli.
    history: >-
      Medições antigas apontavam para 882 metros de altitude; hoje a cota é de 880 metros. Notável é a lenda
      segundo a qual se pode avistar o glaciar islandês Vatnajökull a quinhentos e cinquenta quilómetros com
      visibilidade extrema, fenómeno que os cientistas atribuem a miragens.
    before: >-
      Próximo do cume o solo torna-se pedregoso e instável. A brita solta e as lajes húmidas são
      escorregadias. A descida faz-se pelo mesmo caminho; deixa uma referência visível junto à escada de rocha
      para reencontrares a descida.


      Atenção ao vento forte e ao declive íngreme à tua esquerda no topo.
    around: >-
      A ilha de [Kalsoy](/lugar/kalsoy/) fica a cerca de dois quilómetros, as [escarpas de aves de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) a seis quilómetros e [Viðoy](/lugar/vidoy/) a treze. Mais a
      sul, a [Ilha Achill](/lugar/achill-island/) partilha com o Slættaratindur o relevo de falésias oceânicas
      e cumes costeiros.
