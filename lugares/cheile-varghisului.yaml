unico:
  es: >-
    Un cañón kárstico de cuatro kilómetros con casi 130 cuevas y la mayor, la Peștera Balázs Orbán, en el que
    viven murciélagos y osos protegidos a escala europea.
  en: >-
    A four-kilometre karst canyon with nearly 130 caves and the largest, Peștera Balázs Orbán, home to bats
    and bears protected at European level.
  fr: >-
    Un canyon karstique de quatre kilomètres abritant près de 130 grottes dont la plus vaste, la Peștera
    Balázs Orbán, refuge de chauves-souris et d'ours protégés à l'échelle européenne.
  de: >-
    Ein vier Kilometer langer Karstcanyon mit fast 130 Höhlen und der größten, der Peștera Balázs Orbán, in
    der europaweit geschützte Fledermäuse und Bären leben.
  it: >-
    Un canyon carsico di quattro chilometri con quasi 130 grotte e la maggiore, la Peștera Balázs Orbán, dove
    trovano rifugio pipistrelli e orsi protetti a livello europeo.
  pt: >-
    Um desfiladeiro cárstico de quatro quilómetros com quase 130 grutas e a maior, a Peștera Balázs Orbán, no
    qual vivem morcegos e ursos protegidos à escala europeia.
observaciones:
  es: >-
    Las cuevas exigen equipo; consulta las condiciones de acceso con el gestor o con el portal turístico del
    condado antes de salir.
texto:
  es:
    intro: >-
      Un arroyo, cuatro kilómetros de roca y más de un centenar de cuevas. Eso es Cheile Vârghișului: un
      desfiladero que el agua ha ido abriendo en calizas jurásicas, en el grupo sur de los Cárpatos
      Orientales, dentro de los montes Perșani. Se extiende entre Vârghiș, en el condado de Covasna, y
      Merești, en el de Harghita, y se recorre a pie, siguiendo el curso del arroyo entre las cuevas del
      desfiladero.
    landscape: >-
      El desfiladero se desarrolló sobre calizas jurásicas y mide cuatro kilómetros. El itinerario peatonal
      sigue el curso del arroyo entre las cuevas, una pequeña aventura de naturaleza. Hay cerca de 130 cuevas,
      cuatro de ellas abiertas al público; otra web turística cuenta 124 y sitúa como mayor del conjunto a la
      Peștera Balázs Orbán.


      El área protegida pertenece a la ecorregión alpina del norte de los montes Perșani y reúne siete
      hábitats naturales. Entre ellos hay laderas rocosas calcáreas con vegetación casmofítica, cuevas no
      explotadas turísticamente y hayedos de tipo Luzulo-Fagetum.
    wildlife: >-
      El sitio se designó por 17 especies de fauna protegidas a escala europea o incluidas en la lista roja de
      la UICN. Entre los mamíferos están el [oso pardo](/especie/ursus_arctos/), la
      [nutria](/especie/lutra_lutra/) y varios murciélagos: el barbastela, el [murciélago ratonero
      grande](/especie/myotis_myotis/) y el [murciélago grande de
      herradura](/especie/rhinolophus_ferrumequinum/), además del pequeño de herradura. Entre los
      invertebrados, el escarabajo de agua *Carabus variolosus*, el cucújido *Cucujus cinnaberinus*, el
      saltamontes transilvano y la [rosalía alpina](/especie/rosalia_alpina/).
    visit: >-
      La ruta por el arroyo es buena de mayo a octubre y se hace con equipo ligero de senderismo y linterna.
      Las cuatro cuevas abiertas no se pueden visitar sin equipo adecuado: casco, frontal y calzado de
      senderismo o botas de goma.


      Se llega desde Miercurea Ciuc por la DN13A hasta Vlăhița y luego por la DJ132 hacia Lueta y Merești; o
      desde Baraolt por Tălișoara hasta el pueblo de Vârghiș.
    history: >-
      El desfiladero y sus cuevas forman un área protegida nacional de categoría IV de la UICN, con 800
      hectáreas, que se solapa con Natura 2000. El sitio de importancia comunitaria (ROSCI0036) se declaró en
      diciembre de 2007 y desde junio de 2022 es también zona especial de conservación. Ocupa 866,5 hectáreas,
      todas en tierra firme, e incluye la reserva natural y las cuevas de las gargantas. Se designó para
      proteger la biodiversidad y mantener en buen estado de conservación la flora y la fauna silvestres y los
      hábitats de interés comunitario.
    before: >-
      Las cuevas exigen equipo; consulta las condiciones de acceso con el gestor o con el portal turístico del
      condado antes de salir.
    around: >-
      En el atlas no tiene vecinos cercanos, pero comparte murciélago ratonero grande y oso pardo con otros
      desfiladeros: el [Parcul Național Buila-Vânturarița - Cheile
      Bistriței](/lugar/parcul-national-buila-vanturarita---cheile/), la [NPR Kvačianska a Prosiecka
      dolina](/lugar/npr-kvacianska-a-prosiecka-dolina/) y el [Parcul Național Defileul Jiului - Codrii
      seculari](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Con el [Park Škocjanske
      jame](/lugar/park-skocjanske-jame/) comparte el murciélago ratonero grande y un paisaje kárstico.
  en:
    intro: >-
      A stream, four kilometres of rock, and more than a hundred caves. That is Cheile Vârghișului: a gorge
      carved by water into Jurassic limestones in the southern group of the Eastern Carpathians, within the
      Perșani Mountains. It stretches between Vârghiș in Covasna County and Merești in Harghita County, and
      you explore it on foot, tracing the stream bed amidst the cliffs and caverns.
    landscape: >-
      The gorge formed within Jurassic limestones and spans four kilometres. The walking trail follows the
      stream course among the caves—a pure nature adventure. There are close to 130 caves, four of them open
      to the public; another tourism site counts 124, citing Peștera Balázs Orbán as the largest in the
      complex.


      The protected area belongs to the alpine ecoregion of the northern Perșani Mountains and encompasses
      seven natural habitat types. These include calcareous rocky slopes with chasmophytic vegetation, caves
      not exploited for tourism, and Luzulo-Fagetum beech forests.
    wildlife: >-
      The site was designated for 17 fauna species protected at European scale or listed on the IUCN Red List.
      Mammals include the [brown bear](/especie/ursus_arctos/), the [Eurasian otter](/especie/lutra_lutra/),
      and several bats: the barbastelle, the [greater mouse-eared bat](/especie/myotis_myotis/), and the
      [greater horseshoe bat](/especie/rhinolophus_ferrumequinum/), along with the lesser horseshoe bat.
      Invertebrates include the water beetle *Carabus variolosus*, the flat bark beetle *Cucujus
      cinnaberinus*, the Transylvanian bush-cricket, and the [rosalia longicorn](/especie/rosalia_alpina/).
    visit: >-
      The trail along the stream is best from May to October with light hiking gear and a torch. The four open
      caves cannot be visited without appropriate equipment: helmet, headlamp, and sturdy hiking shoes or
      rubber boots.


      Access is from Miercurea Ciuc via the DN13A to Vlăhița and then along the DJ132 towards Lueta and
      Merești; or from Baraolt via Tălișoara to the village of Vârghiș.
    history: >-
      The gorge and its caves form an IUCN Category IV national protected area covering 800 hectares,
      overlapping with Natura 2000. The Site of Community Importance (ROSCI0036) was designated in December
      2007 and became a Special Area of Conservation in June 2022. It spans 866.5 hectares, entirely
      terrestrial, encompassing the nature reserve and the gorge caves. It was established to protect
      biodiversity and preserve wild flora, fauna, and habitats of Community interest in favourable
      conservation status.
    before: >-
      The caves require appropriate gear; check access conditions with the site administrator or the county
      tourism portal before heading out.
    around: >-
      In the atlas it has no immediate neighbours, but it shares the greater mouse-eared bat and brown bear
      with other gorges: [Buila-Vânturarița National Park - Bistrița
      Gorge](/lugar/parcul-national-buila-vanturarita---cheile/), [Kvačianska and Prosiecka Valleys
      NNR](/lugar/npr-kvacianska-a-prosiecka-dolina/), and [Jiu Gorge National Park - Ancient
      Forests](/lugar/parcul-national-defileul-jiului-codrii-seculari/). With [Škocjan
      Caves](/lugar/park-skocjanske-jame/) it shares the greater mouse-eared bat and a striking karst
      landscape.
  fr:
    intro: >-
      Un ruisseau, quatre kilomètres de roche et plus d'une centaine de grottes. Telles sont les Cheile
      Vârghișului : un défilé entaillé par les eaux dans des calcaires jurassiques, dans le groupe méridional
      des Carpates orientales, au cœur des monts Perșani. Il s'étend entre Vârghiș, dans le județ de Covasna,
      et Merești, dans celui de Harghita, et se découvre à pied, en suivant le cours du ruisseau au pied des
      cavités.
    landscape: >-
      Le défilé s'est développé dans des calcaires jurassiques et s'étend sur quatre kilomètres. L'itinéraire
      pédestre longe le cours du ruisseau d'une grotte à l'autre, offrant une véritable immersion nature. On
      dénombre près de 130 grottes, dont quatre sont accessibles au public ; un autre site touristique en
      recense 124 et place la Peștera Balázs Orbán au premier rang par sa taille.


      L'espace protégé appartient à l'écorégion alpine du nord des monts Perșani et réunit sept habitats
      naturels. On y trouve notamment des pentes rocheuses calcaires à végétation chasmophytique, des grottes
      non exploitées pour le tourisme et des hêtraies de type Luzulo-Fagetum.
    wildlife: >-
      Le site a été désigné pour 17 espèces de faune protégées au niveau européen ou inscrites sur la liste
      rouge de l'UICN. Parmi les mammifères figurent l'[ours brun](/especie/ursus_arctos/), la [loutre
      d'Europe](/especie/lutra_lutra/) et plusieurs chauves-souris : la barbastelle, le [grand
      murin](/especie/myotis_myotis/) et le [grand rhinolophe](/especie/rhinolophus_ferrumequinum/), ainsi que
      le petit rhinolophe. Côté invertébrés, on relève le carabe *Carabus variolosus*, le cucujide *Cucujus
      cinnaberinus*, la sauterelle de Transylvanie et la [rosalie des Alpes](/especie/rosalia_alpina/).
    visit: >-
      Le cheminement le long du ruisseau est idéal de mai à octobre avec un équipement léger de randonnée et
      une lampe. Les quatre grottes ouvertes ne peuvent être visitées sans matériel adéquat : casque, lampe
      frontale et chaussures de marche ou bottes en caoutchouc.


      L'accès s'effectue depuis Miercurea Ciuc par la DN13A jusqu'à Vlăhița, puis par la DJ132 vers Lueta et
      Merești ; ou depuis Baraolt via Tălișoara jusqu'au village de Vârghiș.
    history: >-
      Le défilé et ses grottes forment une aire protégée nationale de catégorie IV de l'UICN, s'étendant sur
      800 hectares, qui se superpose au réseau Natura 2000. Le site d'importance communautaire (ROSCI0036) a
      été désigné en décembre 2007 et constitue depuis juin 2022 une zone spéciale de conservation. Il couvre
      866,5 hectares, exclusivement terrestres, englobant la réserve naturelle et les grottes des gorges. Il a
      été créé pour protéger la biodiversité et maintenir dans un état de conservation favorable la faune, la
      flore et les habitats d'intérêt communautaire.
    before: >-
      Les grottes requièrent un équipement adapté ; vérifiez les conditions d'accès auprès du gestionnaire ou
      du portail touristique du județ avant votre départ.
    around: >-
      Dans l'atlas, le site n'a pas de voisins immédiats, mais il partage le grand murin et l'ours brun avec
      d'autres gorges : le [parc national Buila-Vânturarița - gorges de la
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/), la [RNN des vallées de Kvačianska et
      Prosiecka](/lugar/npr-kvacianska-a-prosiecka-dolina/) et le [parc national du défilé du Jiu - forêts
      séculaires](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Avec les [grottes de
      Škocjan](/lugar/park-skocjanske-jame/), il partage le grand murin et un relief karstique remarquable.
  de:
    intro: >-
      Ein Bach, vier Kilometer Fels und mehr als hundert Höhlen. Das ist die Cheile Vârghișului: Eine
      Schlucht, die das Wasser in jurassische Kalksteine der südlichen Ostkarpaten im Perșani-Gebirge gegraben
      hat. Sie erstreckt sich zwischen Vârghiș im Kreis Covasna und Merești im Kreis Harghita und wird zu Fuß
      erkundet, indem du dem Lauf des Baches zwischen den Höhlen folgst.
    landscape: >-
      Die Schlucht entstand in jurassischen Kalksteinen und ist vier Kilometer lang. Der Fußweg folgt dem
      Bachlauf von Höhle zu Höhle—ein kleines Naturabenteuer. Es gibt fast 130 Höhlen, von denen vier
      öffentlich zugänglich sind; eine andere Tourismusseite zählt 124 und führt die Peștera Balázs Orbán als
      größte des Ensembles auf.


      Das Schutzgebiet gehört zur alpinen Ökoregion des nördlichen Perșani-Gebirges und vereint sieben
      natürliche Lebensraumtypen. Dazu zählen kalkhaltige Felswände mit Felsspaltenvegetation, nicht
      touristisch erschlossene Höhlen und Hainsimsen-Buchenwälder vom Typ Luzulo-Fagetum.
    wildlife: >-
      Das Gebiet wurde zum Schutz von 17 Tierarten ausgewiesen, die europaweit geschützt sind oder auf der
      Roten Liste der IUCN stehen. Unter den Säugetieren leben hier der [Braunbär](/especie/ursus_arctos/),
      der [Fischotter](/especie/lutra_lutra/) und verschiedene Fledermäuse: die Mopsfledermaus, das [Große
      Mausohr](/especie/myotis_myotis/) und die [Große Hufeisennase](/especie/rhinolophus_ferrumequinum/)
      sowie die Kleine Hufeisennase. Unter den Wirbellosen finden sich der Wasserkäfer *Carabus variolosus*,
      der Scharlachkäfer *Cucujus cinnaberinus*, die Siebenbürgische Beißschrecke und der
      [Alpenbock](/especie/rosalia_alpina/).
    visit: >-
      Die Wanderung entlang des Baches empfiehlt sich von Mai bis Oktober mit leichter Wanderausrüstung und
      Taschenlampe. Die vier offenen Höhlen dürfen nicht ohne entsprechende Ausrüstung betreten werden: Helm,
      Stirnlampe und feste Wanderschuhe oder Gummistiefel.


      Die Anreise erfolgt von Miercurea Ciuc über die DN13A bis Vlăhița und weiter über die DJ132 nach Lueta
      und Merești; oder von Baraolt über Tălișoara zum Dorf Vârghiș.
    history: >-
      Die Schlucht und ihre Höhlen bilden ein nationales Schutzgebiet der IUCN-Kategorie IV mit 800 Hektar,
      das sich mit Natura 2000 überlagert. Das Gebiet von gemeinschaftlicher Bedeutung (ROSCI0036) wurde im
      Dezember 2007 ausgewiesen und ist seit Juni 2022 auch ein besonderes Erhaltungsgebiet. Es umfasst 866,5
      Hektar, rein terrestrisch, und schließt das Naturschutzgebiet sowie die Höhlen der Schlucht ein. Es
      wurde eingerichtet, um die Artenvielfalt zu bewahren und wildlebende Pflanzen, Tiere sowie Lebensräume
      von gemeinschaftlichem Interesse in einem günstigen Erhaltungszustand zu halten.
    before: >-
      Die Höhlen verlangen entsprechende Ausrüstung; informiere dich vor dem Aufbruch bei der Verwaltung oder
      dem Tourismusportal des Kreises über die Zugangsbedingungen.
    around: >-
      Im Atlas hat sie keine direkten Nachbarn, teilt aber Großes Mausohr und Braunbär mit anderen Schluchten:
      dem [Nationalpark Buila-Vânturarița -
      Bistrița-Schlucht](/lugar/parcul-national-buila-vanturarita---cheile/), den [Tälern Kvačianska und
      Prosiecka dolina](/lugar/npr-kvacianska-a-prosiecka-dolina/) und dem [Nationalpark Jiu-Schlucht -
      Urwälder](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Mit den [Höhlen von
      Škocjan](/lugar/park-skocjanske-jame/) teilt sie das Große Mausohr und die Karstlandschaft.
  it:
    intro: >-
      Un torrente, quattro chilometri di roccia e più di un centinaio di grotte. Questo è Cheile Vârghișului:
      una gola che l'acqua ha scavato nei calcari giurassici, nel gruppo meridionale dei Carpazi Orientali,
      all'interno dei monti Perșani. Si allunga tra Vârghiș, nel distretto di Covasna, e Merești, in quello di
      Harghita, e si visita a piedi, seguendo l'alveo del torrente fra le caverne del vallone.
    landscape: >-
      La gola si è sviluppata su calcari giurassici e misura quattro chilometri. Il tragitto a piedi segue il
      corso del torrente tra le cavità rocciose, configurandosi come una suggestiva avventura nella natura. Si
      contano circa 130 grotte, quattro delle quali aperte al pubblico; un altro portale turistico ne censisce
      124, indicando come maggiore la Peștera Balázs Orbán.


      L'area protetta appartiene all'ecoregione alpina della parte settentrionale dei monti Perșani e accoglie
      sette habitat naturali. Tra essi spiccano pareti calcaree con vegetazione casmofitica, grotte non
      turistiche e faggete del tipo Luzulo-Fagetum.
    wildlife: >-
      Il sito è stato designato per 17 specie faunistiche protette su scala europea o inserite nella lista
      rossa IUCN. Tra i mammiferi compaiono l'[orso bruno](/especie/ursus_arctos/), la [lontra
      europea](/especie/lutra_lutra/) e vari pipistrelli: il barbastello, il [vespertilio
      maggiore](/especie/myotis_myotis/) e il [ferro di cavallo
      maggiore](/especie/rhinolophus_ferrumequinum/), oltre al ferro di cavallo minore. Tra gli invertebrati
      figurano il coleottero acquatico *Carabus variolosus*, il cucujide *Cucujus cinnaberinus*, la cavalletta
      transilvana e la [rosalia alpina](/especie/rosalia_alpina/).
    visit: >-
      Il percorso lungo il torrente è consigliabile da maggio a ottobre con attrezzatura da trekking leggero e
      una torcia. Le quattro grotte aperte non possono essere visitate senza materiale idoneo: casco, torcia
      frontale e calzature da trekking o stivali di gomma.


      Si arriva da Miercurea Ciuc percorrendo la DN13A fino a Vlăhița e poi imboccando la DJ132 verso Lueta e
      Merești; oppure da Baraolt via Tălișoara fino al paese di Vârghiș.
    history: >-
      La gola e le sue grotte formano un'area protetta nazionale di categoria IV della IUCN di 800 ettari,
      sovrapposta alla rete Natura 2000. Il sito di importanza comunitaria (ROSCI0036) è stato istituito nel
      dicembre 2007 e dal giugno 2022 è anche zona speciale di conservazione. Copre 866,5 ettari, tutti
      terrestri, e comprende la riserva naturale e le grotte delle gole. È stato istituito per salvaguardare
      la biodiversità e mantenere in uno stato di conservazione soddisfacente la flora, la fauna selvatica e
      gli habitat di interesse comunitario.
    before: >-
      Le grotte richiedono un equipaggiamento adeguato; verifica le condizioni di accesso con l'ente gestore o
      tramite il portale turistico distrettuale prima di partire.
    around: >-
      Nell'atlas non conta vicini immediati, ma condivide il vespertilio maggiore e l'orso bruno con altre
      gole: il [Parco nazionale Buila-Vânturarița - Gola di
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/), la [Riserva naturale nazionale delle
      valli Kvačianska e Prosiecka](/lugar/npr-kvacianska-a-prosiecka-dolina/) e il [Parco nazionale della
      Gola del Jiu - Foreste secolari](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Con le
      [Grotte di San Canziano (Škocjan)](/lugar/park-skocjanske-jame/) condivide il vespertilio maggiore e un
      suggestivo paesaggio carsico.
  pt:
    intro: >-
      Um ribeiro, quatro quilómetros de rocha e mais de uma centena de grutas. Assim é Cheile Vârghișului: um
      desfiladeiro que a água foi escavando em calcários jurássicos, no grupo sul dos Cárpatos Orientais, nos
      montes Perșani. Estende-se entre Vârghiș, no distrito de Covasna, e Merești, no de Harghita, e
      percorre-se a pé, seguindo o curso do ribeiro entre as grutas das escarpas.
    landscape: >-
      O desfiladeiro desenvolveu-se sobre calcários jurássicos e estende-se por quatro quilómetros. O
      itinerário pedestre segue o curso do ribeiro entre as cavidades rochosas, numa autêntica aventura de
      natureza. Existem cerca de 130 grutas, quatro das quais abertas ao público; outro portal turístico
      contabiliza 124 e destaca como maior do conjunto a Peștera Balázs Orbán.


      A área protegida pertence à ecorregião alpina do norte dos montes Perșani e reúne sete habitats
      naturais. Entre eles encontram-se encostas rochosas calcárias com vegetação casmofítica, grutas não
      exploradas para turismo e faiais do tipo Luzulo-Fagetum.
    wildlife: >-
      O sítio foi classificado devido a 17 espécies de fauna protegidas à escala europeia ou integradas na
      lista vermelha da UICN. Entre os mamíferos contam-se o [urso-pardo](/especie/ursus_arctos/), a
      [lontra-europeia](/especie/lutra_lutra/) e vários morcegos: o morcego-de-franja, o
      [morcego-rato-grande](/especie/myotis_myotis/) e o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/), além do pequeno-de-ferradura. Nos
      invertebrados destacam-se o escaravelho-aquático *Carabus variolosus*, o besouro *Cucujus cinnaberinus*,
      o gafanhoto-da-transilvânia e a [rosália-alpina](/especie/rosalia_alpina/).
    visit: >-
      O percurso junto ao ribeiro é favorável de maio a outubro com calçado leve de caminhada e lanterna. As
      quatro grutas abertas não podem ser visitadas sem equipamento apropriado: capacete, frontal e calçado de
      caminhada seguro ou galochas de borracha.


      Chega-se a partir de Miercurea Ciuc pela DN13A até Vlăhița e depois pela DJ132 em direção a Lueta e
      Merești; ou desde Baraolt via Tălișoara até à aldeia de Vârghiș.
    history: >-
      O desfiladeiro e as suas grutas formam uma área protegida nacional de categoria IV da UICN, com 800
      hectares, que se sobrepõe à rede Natura 2000. O sítio de importância comunitária (ROSCI0036) foi
      declarado em dezembro de 2007 e desde junho de 2022 é também zona especial de conservação. Abrange 866,5
      hectares, todos em terra firme, incluindo a reserva natural e as grutas das gargantas. Foi instituído
      para proteger a biodiversidade e manter num estado de conservação favorável a flora, a fauna bravia e os
      habitats de interesse comunitário.
    before: >-
      As grutas requerem equipamento adequado; confirma as condições de visita com o gestor ou no portal
      turístico do distrito antes de saíres.
    around: >-
      No atlas não conta com vizinhos contíguos, mas partilha o morcego-rato-grande e o urso-pardo com outros
      desfiladeiros: o [Parque Nacional Buila-Vânturarița - Desfiladeiro de
      Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/), a [RRN dos Vales de Kvačianska e
      Prosiecka](/lugar/npr-kvacianska-a-prosiecka-dolina/) e o [Parque Nacional do Desfiladeiro do Jiu -
      Florestas Seculares](/lugar/parcul-national-defileul-jiului-codrii-seculari/). Com as [Grutas de
      Škocjan](/lugar/park-skocjanske-jame/) partilha o morcego-rato-grande e uma notável paisagem cárstica.
