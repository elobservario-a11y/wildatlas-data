resumen:
  es: >-
    Colonias de araos comunes y alcas entre las rocas calizas y los arrecifes de coral fósiles de Stora
    Karlsö.
  en: >-
    Silurian limestone table island off western Gotland, home to Sweden's oldest nature reserve and the
    Baltic's largest breeding colony of common murres and razorbills.
  fr: >-
    Île tabulaire calcaire du Silurien au large de Gotland, plus ancienne réserve naturelle de Suède abritant
    la plus grande colonie de guillemots et petits pingouins de la Baltique.
  de: >-
    Silurische Kalk-Tafelinsel vor West-Gotland mit Schwedens ältestem Naturreservat und der größten
    Trottellummen- und Tordalken-Brutkolonie der Ostsee.
  it: >-
    Isola tabulare di calcare siluriano al largo di Gotland, sede della più antica riserva naturale svedese e
    della maggiore colonia di urie e gazze marine del Baltico.
  pt: >-
    Ilha planáltica de calcário silúrico ao largo de Gotland, a mais antiga reserva natural da Suécia
    albergando a maior colónia de airos e tordas-mergulheiras do Báltico.
unico:
  es: >-
    Una isla de coral fósil donde cada primavera miles de parejas de araos y alcas anidan en la roca y miles
    de orquídeas cubren la meseta.
  en: >-
    A limestone block in the Baltic sheltering the largest seabird colony in Sweden, with thousands of murres
    nesting on the cliff ledges.
  fr: >-
    Un bloc calcaire de la Baltique abritant la plus importante colonie d'oiseaux marins de Suède, avec des
    milliers de guillemots nichant sur les corniches.
  de: >-
    Ein Kalkfelsen in der Ostsee, der die größte Seevogelkolonie Schwedens beherbergt, mit Tausenden von
    Lummen auf schmalen Felssimsen.
  it: >-
    Un blocco calcareo nel Baltico che ospita la più grande colonia di uccelli marini della Svezia, con
    migliaia di urie nidificanti sui cornicioni rocciosi.
  pt: >-
    Um bloco calcário no Báltico que alberga a maior colónia de aves marinhas da Suécia, com milhares de airos
    a nidificar nas saliências rochosas.
observaciones:
  es: >-
    Rodeando toda la isla hay un área de protección de aves, con prohibición de entrada del 15 de marzo al 15
    de agosto, salvo la playa de Norderhamn y Hien. Está prohibido recoger flores y llevarse fósiles o
    piedras. No se pueden desembarcar perros, gatos ni otros animales de compañía. La llegada depende del
    tiempo, y el mejor momento para las orquídeas es finales de mayo y comienzos de junio.
texto:
  es:
    intro: >-
      A unos seis kilómetros de la costa oeste de Gotland, una roca de caliza se levanta del Báltico con las
      aves como dueñas. Es Stora Karlsö: un rectángulo de unos 1,5 por 2 kilómetros y casi 2,5 km² de
      superficie, con una meseta de alvar y, en las repisas, una de las mayores colonias de álcidos de Europa.
      Se visita en una jornada.
    landscape: >-
      La isla es lo que queda de unos arrecifes de coral. Hace más de 400 millones de años, en el Silúrico,
      Gotland estaba a la altura del ecuador y los corales levantaron estos arrecifes, que luego se
      convirtieron en caliza. Los acantilados, de entre 25 y 45 metros en muchos tramos, rodean la isla.


      Frente al Jaktpaviljongen de Hien hay una colección de fósiles donde se ven corales de panal,
      estromatoporoideos y tallos de crinoideos. Se pueden mirar y estudiar cuanto se quiera; llevárselos está
      prohibido. En la isla hay más de veinte cuevas. La mayor, Stora Förvar, tiene 25 metros de profundidad y
      un yacimiento cultural de la Edad de Piedra.


      Arriba, la meseta es un alvar: una pradera casi sin árboles formada por siglos de pastoreo de ovejas.
      Hoy ese paisaje se ha restaurado: se han retirado arbustos y han vuelto las ovejas. Con el suelo fino
      que caracteriza el alvar, prosperan las plantas resistentes a la sequía y amantes de la luz, y ahí
      florecen las orquídeas.
    wildlife: >-
      En el último siglo se han observado más de 260 especies de aves en la isla, y algo más de 60 crían con
      regularidad. Lo más espectacular son las colonias de álcidos: el [arao común](/especie/uria_aalge/) y la
      [alca](/especie/alca_torda/) crían con miles de parejas cada uno. Un recuento de 2014-2015 estimó 15 700
      parejas de araos y 12 000 de alcas, y Stora Karlsö es una de las mayores colonias de álcidos de Europa;
      el arao común de aquí es la mitad de todo el Báltico.


      Los araos crían en pequeñas repisas y en cuevas de acantilado: Korphålet, Rindhålet, Mistlursgrottan y
      Lushålet, en Västerberget, bajo la meseta del faro. Desde Stornasar, entre mayo y julio, se ven cientos
      de parejas en sus repisas. Las alcas tienen su colonia en el arenal del oeste, protegida dentro del área
      de protección de aves. Y el arao aliblanco, que había criado con unas 40 parejas en los años sesenta,
      hoy apenas conserva unas pocas.


      La primavera tiene su calendario. En mayo cría el [eider común](/especie/somateria_mollissima/), el pato
      más frecuente, con unas mil parejas; la hembra incuba a pocos metros del sendero entre Hien y
      Norderhamn. Cuando los charranes árticos tienen pollos, se vuelven agresivos con los visitantes que se
      acercan demasiado. El camachuelo carmesí y la curruca gavilana son los pájaros pequeños más buscados por
      los ornitólogos. El [cormorán grande](/especie/phalacrocorax_carbo/) cría aquí desde 2001, y hay un nido
      de [pigargo europeo](/especie/haliaeetus_albicilla/).


      A finales de mayo y principios de junio, miles de orquídeas, entre ellas Dactylorhiza latifolia y Orchis
      mascula, forman praderas floridas. Antes, en abril y mayo, florece el adonis de primavera. Hay también
      una rareza botánica: Lactuca quercina, la lechuga de Karlsö, que no crece en ningún otro lugar de los
      países nórdicos fuera de las dos Karlsö. Los únicos mamíferos de la isla son una liebre y un par de
      especies de murciélagos.
    visit: >-
      Los barcos regulares parten de Klintehamn y tardan entre treinta y cuarenta minutos. La excursión de un
      día deja unas cuatro horas y media en la isla. Una visita guiada dura unas dos horas y media, a ritmo
      lento, y empieza en el museo; quien camine por su cuenta solo puede usar el sendero guiado y debe llevar
      mapa.


      El museo, inaugurado en 1966, cuenta la geología, la flora, la fauna y a las personas que, desde la Edad
      de Piedra, han ayudado a moldear la isla. En el recorrido, Stornasar y Lushålet son los miradores de las
      colonias de araos.


      También hay huellas humanas. Un gran túmulo de la Edad del Bronce, Lauphargi, se levanta en la esquina
      suroeste. En la cantera medieval se extraía la caliza rosa llamada mármol de Karlsö, que acabó en la
      catedral de Visby.
    history: >-
      En el siglo XIX la caza sin freno casi extinguió a los álcidos; en 1880 quedaban entre veinte y treinta
      araos. Entre 1880 y 1887 una sociedad compró la isla poco a poco y prohibió la caza de aves, lo que
      salvó la existencia del arao común. Por eso Stora Karlsö se considera una de las áreas naturales
      protegidas más antiguas del mundo.


      Hoy la isla es un campo de investigación: cámaras instaladas en la isla ayudan a los científicos a
      documentar la vida de los araos y de otras aves marinas, y el público puede aportar sus observaciones
      como ciencia ciudadana.
    before: >-
      Rodeando toda la isla hay un área de protección de aves, con prohibición de entrada del 15 de marzo al
      15 de agosto, salvo la playa de Norderhamn y Hien. Está prohibido recoger flores y llevarse fósiles o
      piedras. No se pueden desembarcar perros, gatos ni otros animales de compañía. La llegada depende del
      tiempo, y el mejor momento para las orquídeas es finales de mayo y comienzos de junio.
    around: >-
      No hay otros lugares del atlas cerca. Lejos de aquí, comparten arao común y alca los acantilados de
      [Marwick Head](/lugar/marwick-head/), las [Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), los
      [acantilados de Vestmanna](/lugar/vestmanna-bird-cliffs/) y [Fair Isle](/lugar/fair-isle/).
  en:
    intro: >-
      About six kilometres off the west coast of Gotland, a limestone rock rises out of the Baltic, ruled by
      seabirds. This is Stora Karlsö: a rectangle measuring roughly 1.5 by 2 kilometres with an area of nearly
      2.5 km², featuring an alvar plateau and, on its cliffs, one of the largest auk colonies in Europe. It is
      visited as a day trip.
    landscape: >-
      The island is the eroded remnant of ancient coral reefs. More than 400 million years ago, in the
      Silurian period, Gotland lay near the equator and corals built these reefs, which subsequently petrified
      into limestone. Sea cliffs rising between 25 and 45 metres in many sections surround the island.


      Opposite the Hien Jaktpaviljongen, an outdoor fossil collection displays honeycomb corals,
      stromatoporoids and crinoid stems. You are free to inspect and study them; removing them is prohibited.
      More than twenty caves riddle the island. The largest, Stora Förvar, plunges 25 metres deep and contains
      a Stone Age archaeological site.


      Above, the plateau forms an alvar: an open, windswept limestone plain shaped by centuries of sheep
      grazing. Today this landscape has been restored: invasive juniper scrub has been cleared and sheep have
      returned. In the thin soil typical of the alvar, drought-resistant, light-loving plants thrive and wild
      orchids flourish.
    wildlife: >-
      Over the past century more than 260 bird species have been recorded on the island, with over 60 breeding
      regularly. Most spectacular are the auk colonies: the [common murre](/especie/uria_aalge/) and the
      [razorbill](/especie/alca_torda/) nest in their thousands of pairs. A 2014–2015 census counted 15,700
      pairs of murres and 12,000 pairs of razorbills, establishing Stora Karlsö as one of Europe's premier auk
      colonies; its common murre population accounts for half of all Baltic breeders.


      Murres nest on narrow ledges and in cliff sea caves: Korphålet, Rindhålet, Mistlursgrottan and Lushålet
      on Västerberget beneath the lighthouse plateau. From Stornasar, between May and July, hundreds of pairs
      are visible on their perches. Razorbills nest in the western boulder fields, sheltered within the bird
      sanctuary. The black guillemot, which once numbered some 40 pairs in the sixties, barely maintains a
      remnant foothold today.


      Spring has its own calendar. In May the [common eider](/especie/somateria_mollissima/), the most
      abundant duck, breeds with roughly one thousand pairs; females incubate their nests just metres from the
      trail between Hien and Norderhamn. When Arctic terns hatch chicks, they vigorously mob visitors who
      wander too close. Common rosefinches and barred warblers are the passerines most prized by birdwatchers.
      The [great cormorant](/especie/phalacrocorax_carbo/) has nested here since 2001, and there is an active
      eyrie of the [white-tailed eagle](/especie/haliaeetus_albicilla/).


      In late May and early June, thousands of orchids, including *Dactylorhiza latifolia* and *Orchis
      mascula*, paint the alvar meadows. Earlier, in April and May, yellow spring pheasant's eye blossoms.
      There is also a botanical rarity: *Lactuca quercina* (Karlsö lettuce), which grows nowhere else in the
      Nordic countries outside the two Karlsö islands. The only resident mammals are mountain hares and two
      bat species.
    visit: >-
      Scheduled passenger ferries sail from Klintehamn, taking between thirty and forty minutes. A day trip
      allows around four and a half hours on the island. A guided walking tour lasts about two and a half
      hours at an easy pace, departing from the museum; unguided walkers must stick strictly to the marked
      trail network and carry a map.


      The museum, opened in 1966, interprets the geology, flora, fauna and human generations who have shaped
      the island since the Stone Age. Along the trail, Stornasar and Lushålet provide viewpoints overlooking
      the murre colonies.


      Human history has left its mark as well. A massive Bronze Age cairn, Lauphargi, stands on the
      southwestern bluff. The medieval quarry supplied pink Silurian limestone, known as Karlsö marble, used
      to carve columns and fonts in Visby Cathedral.
    history: >-
      In the XIX century unrestricted seabird hunting nearly eradicated the auk colonies; by 1880 only twenty
      to thirty murres survived. Between 1880 and 1887 a conservation society gradually purchased the island
      and banned all bird shooting, securing the salvation of the common murre. For this reason Stora Karlsö
      is celebrated as one of the world's oldest protected natural areas.


      Today the island is an active open-air laboratory: remotely operated cliff cameras assist biologists in
      monitoring murres and other seabirds, while visitors contribute field sightings through citizen science
      programs.
    before: >-
      A designated bird sanctuary surrounds the island with an entry ban from 15 March to 15 August, except
      for the landing beach at Norderhamn and Hien. Picking flowers and removing fossils or stones is
      prohibited. Dogs, cats and other pets are strictly barred from disembarking. Ferry crossings depend on
      weather, and the prime window for orchids falls in late May and early June.
    around: >-
      There are no catalogued atlas neighbours nearby. Farther away, common murres and razorbills share sea
      cliffs at [Marwick Head](/lugar/marwick-head/), the [Sept-Îles Nature
      Reserve](/lugar/reserve-naturelle-des-sept-iles/), the [Vestmanna Bird
      Cliffs](/lugar/vestmanna-bird-cliffs/) and [Fair Isle](/lugar/fair-isle/).
  fr:
    intro: >-
      À environ six kilomètres de la côte ouest de Gotland, un bloc calcaire émerge de la Baltique, royaume
      des oiseaux marins. C'est Stora Karlsö : un rectangle de 1,5 sur 2 kilomètres pour près de 2,5 km² de
      superficie, coiffé d'un alvar et abritant sur ses vires l'une des plus imposantes colonies d'alcidés
      d'Europe. L'île se découvre en excursion d'une journée.
    landscape: >-
      L'île constitue le vestige d'anciens récifs coralliens. Il y a plus de 400 millions d'années, au
      Silurien, Gotland se situait à la hauteur de l'équateur et des coraux édifièrent ces récifs pétrifiés
      ensuite en calcaire. Des falaises hautes de 25 à 45 mètres ceinturent l'île sur une large part du
      rivage.


      Face au Jaktpaviljongen de Hien, une collection de fossiles à ciel ouvert montre coraux alvéolaires,
      stromatoporoïdes et tiges d'encrines. Vous pouvez les observer à loisir ; les prélever est
      rigoureusement interdit. L'île recèle plus de vingt cavités. La plus vaste, Stora Förvar, s'enfonce sur
      25 mètres et abrite un gisement archéologique de l'âge de la pierre.


      Au sommet, le plateau forme un alvar : une prairie rase quasi dénuée d'arbres forgée par des siècles de
      pâturage ovin. Aujourd'hui ce milieu est restauré : les genévriers envahissants ont été coupés et les
      moutons réintroduits. Sur ce sol mince caractéristique, prospèrent plantes xérophiles et orchidées
      sauvages.
    wildlife: >-
      Au cours du dernier siècle, plus de 260 espèces d'oiseaux ont été répertoriées sur l'île, et plus de 60
      s'y reproduisent régulièrement. Le spectacle le plus saisissant est offert par les alcidés : le
      [guillemot de Troïl](/especie/uria_aalge/) et le [petit pingouin](/especie/alca_torda/) y nichent par
      milliers de couples. Un dénombrement mené en 2014-2015 a estimé 15 700 couples de guillemots et 12 000
      de petits pingouins, hissant Stora Karlsö au rang des plus grandes colonies d'Europe ; ses guillemots
      représentent la moitié des effectifs de la Baltique.


      Les guillemots nichent sur les vires et dans les grottes marines : Korphålet, Rindhålet, Mistlursgrottan
      et Lushålet, sur Västerberget sous le phare. Depuis Stornasar, entre mai et juillet, des centaines de
      couples s'observent sur leurs reposoirs. Les petits pingouins occupent les éboulis occidentaux, protégés
      dans la réserve ornithologique. Le guillemot à miroir, qui comptait une 40 couples dans les années
      soixante, ne compte plus que de très rares couples.


      Le printemps obéit à son propre rythme. En mai se reproduit l'[eider à
      duvet](/especie/somateria_mollissima/), le canard le plus répandu avec un millier de couples ; les canes
      couvent à quelques mètres du sentier reliant Hien à Norderhamn. Quand les sternes arctiques élèvent
      leurs poussins, elles fondent hardiment sur les promeneurs imprudents. Le roselin cramoisi et la
      fauvette épervière sont les passereaux les plus convoités des ornithologues. Le [grand
      cormoran](/especie/phalacrocorax_carbo/) niche sur l'île depuis 2001, et un couple de [pygargues à queue
      blanche](/especie/haliaeetus_albicilla/) y élève ses petits.


      Fin mai et début juin, des milliers d'orchidées comme *Dactylorhiza latifolia* et *Orchis mascula*
      émaillent les pelouses. Plus tôt, en avril et mai, fleurit l'adonis de printemps. On y rencontre une
      curiosité botanique : *Lactuca quercina* (laitue de Karlsö), absente de tous les pays nordiques hors des
      deux îles Karlsö. Les seuls mammifères terrestres sont le lièvre variable et deux espèces de
      chauves-souris.
    visit: >-
      Des navettes régulières appareillent de Klintehamn et effectuent la traversée en trente à quarante
      minutes. L'aller-retour laisse environ quatre heures et demie sur l'île. Une visite guidée dure environ
      deux heures et demie à un train paisible, partant du musée ; les promeneurs libres doivent
      obligatoirement emprunter le sentier guidé munis d'une carte.


      Le musée, inauguré en 1966, retrace la géologie, la flore, la faune et les populations qui ont façonné
      l'île depuis la préhistoire. En cours de route, Stornasar et Lushålet constituent les meilleurs
      belvédères sur les colonies d'oiseaux.


      Le patrimoine historique est bien présent. Un imposant cairn de l'âge du bronze, Lauphargi, domine
      l'angle sud-ouest. La carrière médiévale fournissait le marbre calcaire rose de Karlsö, utilisé pour
      tailler colonnes et fonts baptismaux de la cathédrale de Visby.
    history: >-
      Au XIX siècle, une chasse débridée faillit éradiquer les oiseaux marins ; en 1880 il ne subsistait
      qu'entre vingt et trente guillemots. Entre 1880 et 1887, une société pionnière acquit l'île
      progressivement et y interdit tout tir, sauvant in extremis le guillemot de Troïl. Stora Karlsö est
      ainsi considérée comme l'un des plus anciens territoires naturels protégés de la planète.


      De nos jours, l'île sert de laboratoire écologique : des caméras perchées sur les falaises aident les
      chercheurs à scruter la nidification des oiseaux marins, et les visiteurs peuvent transmettre leurs
      observations dans le cadre de programmes de sciences participatives.
    before: >-
      Une réserve ornithologique entoure l'île avec interdiction formelle de débarquer du 15 mars au 15 août,
      hormis le havre de Norderhamn et Hien. Il est défendu de cueillir des fleurs ou d'emporter fossiles et
      cailloux. Chiens, chats et animaux de compagnie sont interdits d'accès. La traversée dépend de la météo
      maritime, et l'apogée floral des orchidées s'étale de fin mai à début juin.
    around: >-
      Aucun site du guide n'est proche. Plus loin, guillemots de Troïl et petits pingouins partagent les
      falaises marines de [Marwick Head](/lugar/marwick-head/), de la [Réserve naturelle des
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), des [falaises de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) et de [Fair Isle](/lugar/fair-isle/).
  de:
    intro: >-
      Etwa sechs Kilometer vor der Westküste Gotlands erhebt sich ein Kalkfelsen aus der Ostsee, auf dem die
      Seevögel das Regiment führen. Es ist Stora Karlsö: ein Rechteck von 1,5 auf 2 Kilometern bei knapp 2,5
      km² Fläche mit einem Alvar-Plateau und einer der größten Alkenkolonien Europas auf den Felsbändern. Man
      besucht die Insel im Rahmen eines Tagesausflugs.
    landscape: >-
      Die Insel ist der erodierte Rest urzeitlicher Korallenriffe. Vor mehr als 400 Millionen Jahren, im
      Silur, lag Gotland nahe dem Äquator, und Korallen bauten diese Riffe auf, die später zu Kalkstein
      versteinerten. Steilküsten von 25 bis 45 Metern Höhe umrahmen die Insel auf weiten Strecken.


      Vor dem Jaktpaviljongen in Hien zeigt eine Fossiliensammlung Wabenkorallen, Stromatoporen und
      Seelilienstängel. Sie dürfen betrachtet und studiert werden; das Mitnehmen ist streng untersagt. Über
      zwanzig Höhlen durchziehen die Insel. Die größte, Stora Förvar, reicht 25 Meter tief und birgt eine
      steinzeitliche Siedlungsschicht.


      Oben bildet das Plateau ein Alvar: eine baumlose Kalkheide, geprägt von jahrhundertelanger
      Schafbeweidung. Heute ist diese Landschaft wiederhergestellt: Gebüsche wurden gerodet und Schafe weiden
      erneut. Auf den flachgründigen Böden gedeihen trockenheitsresistente Kräuter und wilde Orchideen.
    wildlife: >-
      Im letzten Jahrhundert wurden über 260 Vogelarten auf der Insel nachgewiesen, von denen mehr als 60
      regelmäßig brüten. Das eindrucksvollste Schauspiel bieten die Alkenvögel:
      [Trottellumme](/especie/uria_aalge/) und [Tordalk](/especie/alca_torda/) nisten mit Tausenden von
      Paaren. Eine Zählung von 2014–2015 ergab 15.700 Lummenpaare und 12.000 Tordalkenpaare; Stora Karlsö
      zählt damit zu den bedeutendsten Alkenkolonien Europas, und die hiesigen Lummen stellen die Hälfte des
      gesamten Ostseebestands.


      Die Lummen brüten auf schmalen Gesimsen und in Brandungshöhlen: Korphålet, Rindhålet, Mistlursgrottan
      und Lushålet am Västerberget unterhalb des Leuchtturms. Von Stornasar aus lassen sich zwischen Mai und
      Juli Hunderte Paare auf ihren Brutplätzen beobachten. Die Tordalken brüten im westlichen Blockfeld
      innerhalb der Vogelschutzzone. Die Gryllteiste, die in den sechziger Jahren noch mit rund 40 Paaren
      vorkam, zählt heute nur noch wenige Brutpaare.


      Der Frühling folgt einem festen Zeitplan. Im Mai brütet die [Eiderente](/especie/somateria_mollissima/),
      die häufigste Ente mit etwa tausend Paaren; die Weibchen brüten nur wenige Meter neben dem Weg zwischen
      Hien und Norderhamn. Führen Küstenseeschwalben Junge, greifen sie Spaziergänger an, die den Nestern zu
      nahe kommen. Karmingimpel und Sperbergrasmücke sind begehrte Beobachtungsziele für Ornithologen. Der
      [Kormoran](/especie/phalacrocorax_carbo/) brütet hier seit 2001, und ein
      [Seeadler](/especie/haliaeetus_albicilla/) horstet auf der Insel.


      Ende Mai und Anfang Juni verwandeln Tausende Orchideen, darunter *Dactylorhiza latifolia* und *Orchis
      mascula*, das Alvar in bunte Teppiche. Zuvor, im April und Mai, blüht das Frühlings-Adonisröschen. Hinzu
      kommt eine botanische Rarität: *Lactuca quercina*, der Karlsö-Lattich, der nirgends sonst in den
      nordischen Ländern außerhalb der beiden Karlsö-Inseln wächst. Die einzigen Säugetiere sind Schneehase
      und zwei Fledermausarten.
    visit: >-
      Fahrgastschiffe verkehren von Klintehamn aus und benötigen zwischen dreißig und vierzig Minuten. Ein
      Tagesausflug lässt rund viereinhalb Stunden Aufenthalt auf der Insel. Eine Führung dauert etwa
      zweieinhalb Stunden in gemächlichem Tempo und startet am Museum; wer auf eigene Faust wandert, darf nur
      den ausgewiesenen Pfad nutzen und benötigt eine Karte.


      Das 1966 eröffnete Museum veranschaulicht Geologie, Flora, Fauna und die Siedlungsgeschichte seit der
      Steinzeit. Entlang der Route sind Stornasar und Lushålet die wichtigsten Aussichtspunkte auf die
      Lummenkolonien.


      Kulturspuren sind allgegenwärtig. Ein bronzezeitlicher Grabhügel, Lauphargi, erhebt sich an der
      Südwestspitze. Im mittelalterlichen Steinbruch wurde der rosafarbene Karlsö-Marmor gebrochen, der im Dom
      zu Visby verbaut wurde.
    history: >-
      Im XIX Jahrhundert brachte hemmungslose Jagd die Alken fast zum Aussterben; 1880 überlebten nur zwanzig
      bis dreißig Lummen. Zwischen 1880 und 1887 kaufte eine Schutzgesellschaft die Insel schrittweise auf und
      verbot jede Vogeljagd, was die Trottellumme rettete. Deshalb gilt Stora Karlsö als eines der ältesten
      Schutzgebiete der Welt.


      Heute ist die Insel ein Freilandlabor: Installierte Kameras unterstützen Forscher bei der Dokumentation
      der Brutbiologie, und Gäste können eigene Beobachtungen über Citizen-Science-Portale einbringen.
    before: >-
      Rund um die Insel besteht vom 15. März bis 15. August ein Betretungsverbot für das Vogelschutzgebiet,
      ausgenommen die Anlegestelle Norderhamn und Hien. Blumenpflücken sowie das Mitnehmen von Fossilien oder
      Steinen ist verboten. Hunde, Katzen und andere Haustiere dürfen nicht an Land gebracht werden. Die
      Überfahrt ist wetterabhängig, und die beste Orchideenzeit liegt Ende Mai bis Anfang Juni.
    around: >-
      In der näheren Umgebung gibt es keine Nachbarorte im Atlas. Weiter entfernt teilen Trottellumme und
      Tordalk Steilklippen mit [Marwick Head](/lugar/marwick-head/), dem [Naturreservat
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), den [Vogelklippen von
      Vestmanna](/lugar/vestmanna-bird-cliffs/) und [Fair Isle](/lugar/fair-isle/).
  it:
    intro: >-
      A circa sei chilometri dalla costa occidentale di Gotland, uno scoglio calcareo sorge dal Baltico
      dominato dagli uccelli marini. È Stora Karlsö: un rettangolo di 1,5 per 2 chilometri con una superficie
      di quasi 2,5 km², sormontato da un altopiano di alvar e popolato sulle scogliere da una delle colonie di
      alcidi più imponenti d'Europa. Si visita con un'escursione in giornata.
    landscape: >-
      L'isola rappresenta il relitto erosivo di antiche scogliere coralline. Più di 400 milioni di anni fa,
      nel Siluriano, Gotland si trovava all'altezza dell'equatore e i coralli edificarono questi banchi poi
      pietrificatisi in calcare. Falesie verticali alte tra 25 e 45 metri cingono l'isola lungo gran parte del
      perimetro.


      Di fronte allo Jaktpaviljongen di Hien, una collezione di fossili all'aperto mostra coralli ad alveare,
      stromatoporoidi e peduncoli di crinoidi. Si possono osservare liberamente; asportarli è vietato. L'isola
      conta più di venti grotte. La principale, Stora Förvar, penetra per 25 metri e conserva un deposito
      preistorico dell'età della pietra.


      In cima, il pianoro costituisce un alvar: una brughiera aperta priva d'alberi modellata da secoli di
      pascolo ovino. Oggi questo paesaggio è stato recuperato: i ginepri invadenti sono stati tagliati e le
      pecore sono tornate. Nel suolo sottile tipico dell'alvar fioriscono erbe amanti della luce e splendide
      orchidee selvatiche.
    wildlife: >-
      Nel corso dell'ultimo secolo sono state censite oltre 260 specie avicole sull'isola, e più di 60
      nidificano abitualmente. La visione più impressionante la offrono gli alcidi:
      l'[uria](/especie/uria_aalge/) e la [gazza marina](/especie/alca_torda/) si riproducono con migliaia di
      coppie. Un censimento del 2014-2015 ha calcolato 15.700 coppie di urie e 12.000 di gazze marine,
      incoronando Stora Karlsö tra le prime colonie d'alcidi d'Europa; le urie locali costituiscono la metà
      dell'intera popolazione del Baltico.


      Le urie depongono le uova su esili cenge e in cavità d'abrasione: Korphålet, Rindhålet, Mistlursgrottan
      e Lushålet, su Västerberget sotto il faro. Da Stornasar, tra maggio e luglio, si ammirano centinaia di
      coppie appollaiate. Le gazze marine occupano le pietraie occidentali nell'area protetta. L'uria nera,
      che contava una 40 coppie negli anni Sessanta, oggi sopravvive a stento con rari esemplari.


      La primavera detta i suoi ritmi. In maggio nidifica l'[edredone](/especie/somateria_mollissima/),
      l'anatra più frequente con un migliaio di coppie; le femmine covano a ridosso del sentiero tra Hien e
      Norderhamn. Quando le sterne codalunga allevano i piccoli, attaccano i gitanti che oltrepassano il
      sentiero. Il ciuffolotto scarlatto e la bigia padovana sono i passeriformi più agognati dagli
      appassionati. Il [cormorano comune](/especie/phalacrocorax_carbo/) vi nidifica dal 2001, e vi è un nido
      attivo di [aquila di mare](/especie/haliaeetus_albicilla/).


      Tra fine maggio e inizio giugno, migliaia di orchidee tra cui *Dactylorhiza latifolia* e *Orchis
      mascula* creano fioriture spettacolari. Prima, in aprile e maggio, sboccia l'adonide primaverile. Da
      citare una gemma botanica: *Lactuca quercina*, la lattuga di Karlsö, assente dal resto dei paesi nordici
      al di fuori delle due isole Karlsö. Gli unici mammiferi stanziali sono la lepre bianca e due specie di
      pipistrelli.
    visit: >-
      Battelli di linea salpano da Klintehamn con traversate di trenta-quaranta minuti. La gita giornaliera
      assicura circa quattro ore e mezza di permanenza sull'isola. Una visita guidata impegna due ore e mezza
      a passo lento partendo dal museo; gli escursionisti solitari possono muoversi unicamente lungo il
      sentiero autorizzato muniti di mappa.


      Il museo, allestito nel 1966, racconta geologia, flora, fauna e le comunità umane che dall'età della
      pietra hanno abitato l'isola. Sul circuito, Stornasar e Lushålet offrono i migliori affacci sulle
      colonie di urie.


      Non mancano reperti archeologici. Un monumentale tumulo funerario dell'età del bronzo, Lauphargi, si
      erge nell'angolo sud-occidentale. Dalla cava medievale si estraeva il marmo rosa di Karlsö, impiegato
      nel duomo di Visby.
    history: >-
      Nel XIX secolo la caccia indiscriminata rischiò di sterminare gli uccelli marini; nel 1880 restavano
      appena tra venti e trenta urie. Tra il 1880 e il 1887 un consorzio di naturalisti acquistò gradualmente
      l'isola e mise al bando i fucili, salvando l'uria comune. Per questa ragione Stora Karlsö è ritenuta una
      delle prime aree naturali protette del pianeta.


      Oggi l'isola funge da osservatorio ecologico: telecamere fisse aiutano gli ornitologi a monitorare le
      colonie, mentre i visitatori possono inserire le proprie segnalazioni nelle piattaforme di citizen
      science.
    before: >-
      L'intera isola è cinta da una riserva ornitologica chiusa al transito dal 15 marzo al 15 agosto, salvo
      l'approdo di Norderhamn e Hien. È proibito cogliere fiori e prelevare sassi o fossili. È tassativamente
      vietato sbarcare cani, gatti o altri animali domestici. L'approdo è subordinato al mare, e il momento
      culmine per le orchidee è tra fine maggio e inizio giugno.
    around: >-
      Non ci sono altri luoghi dell'atlas nei pressi. Più lontano, urie e gazze marine popolano le falesie di
      [Marwick Head](/lugar/marwick-head/), la [Riserva Naturale delle
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), le [falesie di
      Vestmanna](/lugar/vestmanna-bird-cliffs/) e [Fair Isle](/lugar/fair-isle/).
  pt:
    intro: >-
      A cerca de seis quilómetros da costa ocidental de Gotland, um rochedo calcário emerge do Báltico
      entregue às aves marinhas. É Stora Karlsö: um retângulo de cerca de 1,5 por 2 quilómetros e quase 2,5
      km² de área, coroado por um planalto de alvar e albergando nas escarpas uma das maiores colónias de
      alcídeos da Europa. Visita-se numa excursão de um dia.
    landscape: >-
      A ilha é o testemunho fóssil de antigos recifes de coral. Há mais de 400 milhões de anos, no Silúrico,
      Gotland situava-se perto do equador e os corais ergueram estes recifes, posteriormente convertidos em
      calcário. Arribas abruptas entre 25 e 45 metros de desnível rodeiam a ilha na maior parte da sua orla.


      Fronteiro ao Jaktpaviljongen de Hien, um mostruário fóssil ao ar livre reúne corais em favo,
      estromatoporóides e caules de crinóides. Podem ser observados de perto; levá-los é expressamente
      interdito. A ilha esconde mais de vinte grutas. A maior, Stora Förvar, desce a 25 metros de profundidade
      e encerra uma jazida arqueológica da Idade da Pedra.


      No topo, o planalto forma um alvar: uma charneca rasteira quase desprovida de árvores forjada por
      séculos de pastoreio ovino. Hoje essa paisagem foi reabilitada: os zimbros invasores foram cortados e os
      rebanhos de ovelhas regressaram. No solo pedregoso raso proliferam plantas amantes da luz e orquídeas
      bravas.
    wildlife: >-
      No último século foram inventariadas mais de 260 espécies de aves na ilha, com mais de 60 a
      reproduzir-se com regularidade. O fenómeno mais grandioso é o dos alcídeos: o
      [airo](/especie/uria_aalge/) e a [torda-mergulheira](/especie/alca_torda/) nidificam em milhares de
      casais. Uma contagem de 2014-2015 apurou 15 700 casais de airos e 12 000 de tordas-mergulheiras,
      situando Stora Karlsö entre as colónias capitais da Europa; a colónia de airos representa metade de todo
      o efetivo do Báltico.


      Os airos nidificam em pequenas saliências rochosas e em furnas marinhas: Korphålet, Rindhålet,
      Mistlursgrottan e Lushålet, em Västerberget sob o farol. De Stornasar, entre maio e julho, contemplam-se
      centenas de casais nos seus poiso. As tordas ocupam o caos de blocos a ocidente na reserva ornitológica.
      A airo-d'asa-branca, que chegou a somar 40 casais nos anos sessenta, conserva hoje apenas escassos
      casais.


      A primavera segue um calendário preciso. Em maio nidifica o
      [eider-edredão](/especie/somateria_mollissima/), o pato mais assíduo com cerca de mil casais; as fêmeas
      chocam a escassos metros do trilho pedonal entre Hien e Norderhamn. Quando as andorinhas-do-ártico têm
      crias, investem agressivamente contra os viandantes demasiado próximos. O pintarroxo-carmesim e a
      felosa-gavião são as espécies mais procuradas pelos observadores. O
      [corvo-marinho-de-faces-brancas](/especie/phalacrocorax_carbo/) nidifica aqui desde 2001, e há um ninho
      de [águia-rabalva](/especie/haliaeetus_albicilla/).


      No final de maio e início de junho, milhares de orquídeas como *Dactylorhiza latifolia* e *Orchis
      mascula* alcatifam o alvar. Antes, em abril e maio, desabrocha a adonis-da-primavera. Descobre-se ainda
      uma raridade vegetal: *Lactuca quercina*, o alface-de-karlsö, inexistente no resto dos países nórdicos
      fora das duas ilhas Karlsö. Os únicos mamíferos são a lebre-do-ártico e duas espécies de morcegos.
    visit: >-
      Barcos regulares zarpam de Klintehamn e demoram entre trinta e quarenta minutos. A travessia de ida e
      volta faculta cerca de quatro horas e meia na ilha. Uma visita guiada percorre duas horas e meia em
      ritmo descontraído a partir do museu; quem caminhar autonomamente só pode utilizar o trilho delimitado
      com mapa obrigatório.


      O museu, inaugurado em 1966, elucida a geologia, flora, fauna e as gerações que moldaram a ilha desde os
      tempos pré-históricos. No itinerário, Stornasar e Lushålet são os miradouros cimeiros para as colónias
      marinhas.


      A presença humana tem raízes remotas. Uma grande mamoa da Idade do Bronze, Lauphargi, coroa o extremo
      sudoeste. Na pedreira medieval extraía-se o mármore rosa de Karlsö, talhado nos capitéis e pias da
      catedral de Visby.
    history: >-
      No século XIX a caça predatória levou os alcídeos à beira do colapso; em 1880 restavam apenas vinte a
      trinta airos. Entre 1880 e 1887 uma sociedade protetora adquiriu a ilha parcelarmente e baniu a caça,
      logrando salvar o airo. Por esse feito Stora Karlsö é tida como uma das reservas naturais mais antigas
      do mundo.


      Hojes em dia a ilha é um laboratório vivo: câmaras automáticas ajudam os biólogos a documentar a
      reprodução das aves, podendo o público colaborar com os seus avistamentos em projetos de ciência cidadã.
    before: >-
      A circundar a ilha estende-se uma reserva ornitológica de acesso interdito de 15 de março a 15 de
      agosto, salvaguardando a baía de Norderhamn e Hien. É interdito colher flores ou levar fósseis e
      calhaus. Não é permitido desembarcar cães, gatos ou animais de companhia. A navegação depende das
      condições marítimas, sendo o auge das orquídeas entre finais de maio e princípios de junho.
    around: >-
      Não há outros locais catalogados por perto no atlas. À distância, partilham airos e tordas-mergulheiras
      as falésias de [Marwick Head](/lugar/marwick-head/), a [Reserva Natural das
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), as [arribas de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) e [Fair Isle](/lugar/fair-isle/).
