resumen:
  es: >-
    Una de las gargantas calizas más largas y salvajes de Rumanía con hayedos vírgenes relictos (Izvoarele
    Nerei).
  en: >-
    One of Romania's longest and wildest limestone gorges alongside relict virgin beech forests (Izvoarele
    Nerei).
  fr: >-
    L'une des gorges calcaires les plus longues et sauvages de Roumanie avec des hêtraies vierges relictuelles
    (Izvoarele Nerei).
  de: >-
    Eine der längsten und wildesten Karstschluchten Rumäniens neben unberührten Reliktbuchenwäldern (Izvoarele
    Nerei).
  it: >-
    Una delle gole calcaree più lunghe e selvagge della Romania assieme a faggete vergini relitte (Izvoarele
    Nerei).
  pt: >-
    Uma das gargantas calcárias mais longas e selvagens da Roménia junto a faiais virgens relíquias (Izvoarele
    Nerei).
unico:
  es: >-
    Sus hayedos de Izvoarele Nerei forman parte de la red UNESCO de bosques primarios y antiguos de los
    Cárpatos, y solo se visitan a pie acompañado de un guarda.
  en: >-
    Its beech stands at Izvoarele Nerei are part of the UNESCO World Heritage primeval and ancient beech
    forests network, accessible only on foot with a ranger.
  fr: >-
    Ses hêtraies d'Izvoarele Nerei appartiennent au réseau UNESCO des forêts primaires et anciennes de hêtres,
    visitables uniquement à pied avec un garde.
  de: >-
    Die Buchenwälder von Izvoarele Nerei gehören zum UNESCO-Weltnaturerbe der alten Buchenwälder und dürfen
    nur zu Fuß mit Ranger begangen werden.
  it: >-
    Le faggete di Izvoarele Nerei fanno parte della rete UNESCO delle foreste primordiali e antiche di faggi,
    visitabili solo a piedi con un guardiaparco.
  pt: >-
    Os seus faiais de Izvoarele Nerei integram a rede UNESCO de florestas primárias e antigas de faias, sendo
    acessíveis apenas a pé acompanhado por um guarda florestal.
observaciones:
  es: >-
    Izvoarele Nerei, componente del sitio UNESCO, solo se visita a pie acompañado de un guarda del parque. El
    parque cobra una tarifa de visita, que puede pagarse por SMS. La cueva de Comarnic se visita de abril a
    octubre; hay guía los fines de semana para grupos de al menos cinco personas y entre semana solo con
    solicitud previa.
texto:
  es:
    intro: >-
      Dos montañas distintas comparten un mismo parque. Por un lado, los montes Semenic, de roca metamórfica y
      magmática, suaves y cubiertos de bosque; por otro, los montes Anina, de roca sedimentaria muy
      karstificada, cortados por gargantas y con más de 800 cuevas y simas. En el sudoeste de Rumanía, en el
      centro del condado de Caraș-Severin, el Parque Nacional Semenic-Cheile Carașului ocupa unas 36.051
      hectáreas.


      Es un parque de contrastes: el aire denso de un hayedo casi virgen, la humedad de una cueva a 10 grados,
      el vértigo de una de las gargantas más largas y salvajes de Rumanía.
    landscape: >-
      Los montes Semenic, el 55 % del parque, tienen laderas suaves y bosque, y de ellos nacen buena parte de
      los ríos importantes del Banato; su cota máxima es Gozna, de 1446,9 m. Los montes Anina, el 45 %, son
      otro mundo: roca sedimentaria muy karstificada, gargantas, valles de dolinas separados por mesetas con
      lapiaz. Allí está la Cheile Carașului, una de las gargantas más largas y salvajes de Rumanía, con flora
      y fauna ricas, y sobre su margen derecha, las ruinas del castillo de Grat, del siglo XIII.


      Los hayedos ocupan más del 80 % del parque. En Izvoarele Nerei, en la ladera sur del Semenic y en la
      cuenca alta del Nera, están algunos de los más extensos de bosque virgen que quedan en la Europa
      templada: un hayedo muy bien conservado, protegido por su aislamiento e inaccesibilidad. Allí los
      árboles más viejos alcanzan los 534 años, y el bosque se extiende entre 620 y 1400 m de altitud.
    wildlife: >-
      El parque alberga 1277 especies de plantas vasculares, entre ellas orquídeas, el lirio martagón y la
      fritilaria. En fauna se han registrado 672 especies, de las cuales más de 80 están protegidas por
      convenios internacionales y directivas europeas.


      Entre los mamíferos viven [oso pardo](/especie/ursus_arctos/), ciervo, corzo,
      [lobo](/especie/canis_lupus/) y [lince boreal](/especie/lynx_lynx/). Entre los reptiles figura la
      [víbora cornuda](/especie/vipera_ammodytes/), y entre las aves protegidas el [águila
      real](/especie/aquila_chrysaetos/) y el grévol. En los ríos Nera y Miniș viven la lamprea Eudontomyzon
      danfordi y los gobios Romanogobio kesslerii y Romanogobio uranoscopus, y sus tramos se asocian a hayedos
      del tipo Asperulo-Fagetum.
    visit: >-
      El parque tiene 10 rutas señalizadas que suman 130 km. La más larga, del lago Secu a Semenic, mide 30,8
      km y unas nueve horas. Para algo más corto, la ruta de Cruz Roja une Comarnic con Semenic en 13,9 km y
      unas tres horas y media, y la de Cruz Amarilla va de Carașova a Gârliște en 3,7 km. Hay además una ruta
      temática sobre la historia y las tradiciones de la comunidad croata del valle del Caraș y otra sobre la
      fauna del parque.


      Lo más especial bajo tierra es la cueva de Comarnic, considerada la más bella y salvaje del Banato y de
      Rumanía; con 6.201 m, es la segunda más larga del Banato tras la de Buhui. Los visitantes solo ven el
      nivel superior, seco, en 1750 metros; el nivel inferior lo recorre el arroyo subterráneo Ponicova. Es
      reserva espeleológica desde 1947 y está en el corazón de los montes del Banato, a medio camino entre
      Reșița y Anina. Al final de la pista se puede ir a pie, unos 45 minutos, o en coche. Dentro hace unos 10
      grados y mucha humedad, así que hace falta ropa y calzado de montaña; el parque presta casco y linterna
      frontal.
    history: >-
      La protección viene de lejos: en 1955 se declaró por primera vez la reserva mixta de Cheile Carașului,
      de 800 hectáreas, y el parque nacional se creó en 1982; ese mismo año nació la reserva integral de
      Izvoarele Nerei, para bosques casi vírgenes. Los bosques centenarios de Izvoarele Nerei forman parte
      desde 2017 de la red UNESCO.


      Hoy el parque contiene diez reservas naturales estrictamente protegidas, entre ellas Cheile Carașului,
      Cheile Gârliștei, Izvoarele Carașului, Izvoarele Nerei y varias cuevas. La presión humana es alta por la
      gran afluencia de turistas casi todo el año.
    before: >-
      Izvoarele Nerei, componente del sitio UNESCO, solo se visita a pie acompañado de un guarda del parque.
      El parque cobra una tarifa de visita, que puede pagarse por SMS. La cueva de Comarnic se visita de abril
      a octubre; hay guía los fines de semana para grupos de al menos cinco personas y entre semana solo con
      solicitud previa.
    around: >-
      Los vecinos más cercanos, por orden de distancia, son el [Parque Nacional Gargantas del Nera -
      Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/), las [Montañas de
      Godeanu](/lugar/muntii-godeanu/) y el [Parque Nacional Domogled - Valle del
      Cerna](/lugar/parcul-national-domogled---valea-cernei/). Más lejos, el [Parque Nacional Desfiladero del
      Jiu - Bosque Primario](/lugar/parcul-national-defileul-jiului-codrii-seculari/) comparte víbora cornuda,
      lince y oso, con gargantas y bosque primario; el [Desfiladero del Río Yantra](/lugar/yantraski-prolom/)
      comparte un gobio y garganta kárstica, y la [Garganta de Sohodol](/lugar/cheile-sohodolului/) comparte
      la víbora cornuda y garganta kárstica.
  en:
    intro: >-
      Two contrasting mountain realms share a single protected territory. On one side rise the Semenic
      Mountains, composed of metamorphic and magmatic rocks, gently undulating and draped in dense forest; on
      the other stand the Anina Mountains, heavily karstified sedimentary rock cleaved by deep ravines and
      harbouring more than 800 caves and sinkholes. Located in south-western Romania in the heart of
      Caraș-Severin County, Semenic-Cheile Carașului National Park covers some 36,051 hectares.


      It is a landscape of stark contrasts: the dense air of near-virgin beech woods, the damp stillness of a
      cave at 10 degrees, and the thrilling vertiginous drop into one of Romania's longest and wildest
      limestone gorges.
    landscape: >-
      The Semenic Mountains, making up 55 % of the park, feature rolling slopes cloaked in forest that give
      birth to most of the Banat's major rivers; their highest summit is Gozna at 1446.9 m. The Anina
      Mountains, accounting for the other 45 %, belong to an entirely different world: intensely karstified
      sedimentary rock, gorges, and dry valleys with sinkholes separated by limestone pavement plateaus. Here
      lie the Cheile Carașului, one of Romania's longest and wildest canyon complexes with exceptionally rich
      flora and fauna, topped on its right flank by the thirteenth-century ruins of Grat Castle.


      Beech forests cover over 80 % of the park. At Izvoarele Nerei, on the southern flank of Semenic within
      the upper Nera basin, survive some of the most extensive tracts of primary forest remaining in temperate
      Europe: an immaculate beech ecosystem shielded by extreme isolation and rugged terrain. The oldest trees
      here reach 534 years of age, with the forest stretching between 620 and 1400 m in altitude.
    wildlife: >-
      The park shelters 1277 vascular plant species, including delicate orchids, Martagon lily, and
      fritillary. In terms of wildlife, 672 species have been documented, more than 80 of which are strictly
      protected under international conventions and European directives.


      Among large mammals roam [brown bear](/especie/ursus_arctos/), red deer, roe deer,
      [wolf](/especie/canis_lupus/), and [Eurasian lynx](/especie/lynx_lynx/). Reptiles include the venomous
      [nose-horned viper](/especie/vipera_ammodytes/), while protected avian species feature the [golden
      eagle](/especie/aquila_chrysaetos/) and hazel grouse. In the pristine waters of the Nera and Miniș
      rivers thrive the Carpathian lamprey (Eudontomyzon danfordi) alongside Kessler's gudgeon (Romanogobio
      kesslerii) and Danubian longbarbel gudgeon (Romanogobio uranoscopus), their river corridors shaded by
      woodruff-beech woodlands of the Asperulo-Fagetum type.
    visit: >-
      The park is traversed by 10 waymarked trails totalling 130 km. The longest route, running from Lake Secu
      up to Semenic, spans 30.8 km and takes about nine hours. For a shorter outing, the Red Cross route
      connects Comarnic to Semenic over 13.9 km in about three and a half hours, while the Yellow Cross path
      links Carașova to Gârliște across 3.7 km. In addition, there is a themed trail focused on the history
      and cultural traditions of the Caraș Valley Croatian community, and another dedicated to the park's
      wildlife.


      Underground, the jewel of the park is Comarnic Cave, widely regarded as the most beautiful and wild
      subterranean chamber system in the Banat and across Romania; measuring 6,201 m in total passages, it is
      the Banat's second-longest cave after Buhui. Visitors explore only the dry upper level across 1750
      metres, while the lower level is carved out by the subterranean Ponicova stream. Protected as a
      speleological reserve since 1947, it lies in the heart of the Banat Mountains midway between Reșița and
      Anina. From the end of the unpaved track, you can reach the entrance on foot in roughly 45 minutes, or
      drive. Inside, temperatures linger around 10 degrees with high humidity, so sturdy mountain footwear and
      warm layers are essential; helmets and headlamps are provided by the park service.
    history: >-
      Formal protection began early: in 1955, the mixed reserve of Cheile Carașului was first established
      across 800 hectares, with the national park officially designated in 1982; that same year saw the
      creation of the Izvoarele Nerei strict nature reserve to safeguard these pristine old-growth stands. The
      ancient beech forests of Izvoarele Nerei were incorporated into the transnational UNESCO network in
      2017.


      Today the national park encompasses ten strictly protected nature reserves, including Cheile Carașului,
      Cheile Gârliștei, Izvoarele Carașului, Izvoarele Nerei, and several notable cavern systems. Human
      visitation pressure remains high due to heavy tourist flows throughout much of the year.
    before: >-
      Izvoarele Nerei, part of the UNESCO site, can only be entered on foot accompanied by an official park
      ranger. The park charges an admission fee, payable via SMS. Comarnic Cave is open from April to October,
      with guided visits on weekends for groups of at least five people and during weekdays only by prior
      arrangement.
    around: >-
      The closest neighbouring natural sites, by distance, are [Nera Gorges - Beușnița National
      Park](/lugar/parcul-national-cheile-nerei---beusnita/), the [Godeanu Mountains](/lugar/muntii-godeanu/),
      and [Domogled - Valea Cernei National Park](/lugar/parcul-national-domogled---valea-cernei/). Further
      afield, [Jiu Gorge National Park - Ancient Beech
      Forest](/lugar/parcul-national-defileul-jiului-codrii-seculari/) shares the nose-horned viper, lynx, and
      bear amidst rugged gorges and ancient woodland; [Yantra River Gorge](/lugar/yantraski-prolom/) shares a
      gudgeon species and limestone karst ravine, while [Sohodol Gorge](/lugar/cheile-sohodolului/) also
      harbours nose-horned vipers in a dramatic karst canyon.
  fr:
    intro: >-
      Deux massifs aux personnalités distinctes composent ce même parc. D'un côté, les monts Semenic, roches
      métamorphiques et magmatiques aux reliefs doux tapissés de forêts ; de l'autre, les monts Anina,
      calcaires sédimentaires intensément karstifiés, entaillés de gorges profondes et percés de plus de 800
      grottes et gouffres. Dans le sud-ouest de la Roumanie, au cœur du județ de Caraș-Severin, le parc
      national Semenic-Cheile Carașului couvre quelque 36 051 hectares.


      C'est un espace de contrastes saisissants : l'atmosphère dense d'une hêtraie quasi vierge, l'humidité
      souterraine d'une grotte à 10 degrés, et le vertige de l'un des défilés rocheux les plus longs et
      sauvages du pays.
    landscape: >-
      Les monts Semenic, représentant 55 % de la superficie, offrent des croupes douces forestières d'où
      jaillissent la plupart des rivières majeures du Banat ; leur point culminant est le Gozna, à 1 446,9 m.
      Les monts Anina, constituant les 45 % restants, forment un autre univers : calcaires hautement
      karstifiés, canyons, dolines et plateaux de lapiés arides. C'est là que serpentent les Cheile Carașului,
      gorge spectaculaire abritant une faune et une flore exceptionnelles, dominée sur sa rive droite par les
      vestiges du château de Grat, édifié au XIIIe siècle.


      Les forêts de hêtres couvrent plus de 80 % du parc. À Izvoarele Nerei, sur le versant sud du Semenic et
      dans le haut bassin de la Nera, subsistent certaines des plus vastes forêts primaires d'Europe tempérée
      : une hêtraie remarquable préservée par son isolement absolu et son accès difficile. Les arbres les plus
      vénérables y atteignent 534 ans, la forêt s'élevant entre 620 et 1 400 m d'altitude.
    wildlife: >-
      Le parc recense 1 277 espèces de plantes vasculaires, dont diverses orchidées, le lis martagon et la
      fritillaire. Côté faune, 672 espèces animales sont enregistrées, dont plus de 80 protégées par des
      conventions internationales et directives européennes.


      Parmi les mammifères évoluent l'[ours brun](/especie/ursus_arctos/), le cerf élaphe, le chevreuil, le
      [loup gris](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/). Les reptiles comptent la
      [vipère ammodyte](/especie/vipera_ammodytes/), et l'avifaune protégée inclut l'[aigle
      royal](/especie/aquila_chrysaetos/) et la gélinotte des bois. Dans les eaux pures de la Nera et du Miniș
      nagent la lamproie Eudontomyzon danfordi ainsi que les goujons Romanogobio kesslerii et Romanogobio
      uranoscopus, le long de vallées boisées associées aux hêtraies de type Asperulo-Fagetum.
    visit: >-
      Le parc compte 10 itinéraires balisés cumulant 130 km. Le plus étendu, reliant le lac Secu à Semenic,
      s'étire sur 30,8 km pour environ neuf heures de marche. Pour une sortie plus courte, le balisage Croix
      Rouge relie Comarnic à Semenic en 13,9 km et environ trois heures et demie, tandis que la Croix Jaune
      unit Carașova à Gârliște sur 3,7 km. Des sentiers thématiques explorent également l'histoire et les
      coutumes de la communauté croate de la vallée du Caraș ainsi que la biodiversité du parc.


      Sous terre, la merveille incontournable est la grotte de Comarnic, considérée comme la plus belle et
      sauvage du Banat et de Roumanie ; avec 6 201 m de galeries, c'est la deuxième plus longue de la région
      après Buhui. Les visiteurs parcourent l'étage supérieur fossile sur 1 750 mètres, l'étage inférieur
      étant drainé par le ruisseau souterrain Ponicova. Classée réserve spéléologique depuis 1947, elle se
      niche au cœur des monts du Banat, à mi-chemin entre Reșița et Anina. Depuis la fin de la piste
      forestière, vous pouvez y accéder à pied en environ 45 minutes, ou en voiture. La température y avoisine
      10 degrés sous une forte humidité : prévoyez de bonnes chaussures de marche et des vêtements chauds, le
      casque et la lampe frontale étant fournis sur place.
    history: >-
      La préservation des lieux remonte loin : en 1955 fut créée la réserve naturelle mixte de Cheile
      Carașului sur 800 hectares, prélude à la fondation du parc national en 1982 ; la même année, la réserve
      intégrale d'Izvoarele Nerei fut instituée pour sauvegarder ces massifs quasi intacts. Depuis 2017, les
      hêtraies séculaires d'Izvoarele Nerei sont inscrites au patrimoine mondial de l'UNESCO.


      Aujourd'hui, le parc abrite dix réserves naturelles strictement protégées, parmi lesquelles Cheile
      Carașului, Cheile Gârliștei, Izvoarele Carașului, Izvoarele Nerei et plusieurs cavités majeures. La
      fréquentation touristique est importante une grande partie de l'année.
    before: >-
      Le secteur d'Izvoarele Nerei, rattaché au site UNESCO, ne se découvre qu'à pied en compagnie obligatoire
      d'un garde forestier. Le parc applique un droit d'entrée payable par SMS. La grotte de Comarnic ouvre
      d'avril à octobre, avec visites guidées le week-end pour des groupes d'au moins cinq personnes, et en
      semaine uniquement sur réservation préalable.
    around: >-
      Les espaces protégés les plus proches par ordre de distance sont le [Parc national des gorges de la Nera
      - Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/), les [Monts
      Godeanu](/lugar/muntii-godeanu/) et le [Parc national Domogled - Vallée de la
      Cerna](/lugar/parcul-national-domogled---valea-cernei/). Plus loin, le [Parc national du défilé du Jiu -
      Forêts primaires](/lugar/parcul-national-defileul-jiului-codrii-seculari/) partage vipère ammodyte, lynx
      et ours dans un cadre de gorges sauvages ; les [Gorges de la rivière Yantra](/lugar/yantraski-prolom/)
      présentent une gorge karstique et une espèce de goujon parente, tandis que les [Gorges de
      Sohodol](/lugar/cheile-sohodolului/) partagent également la vipère ammodyte dans un canyon calcaire.
  de:
    intro: >-
      Zwei grundverschiedene Gebirgszüge teilen sich ein gemeinsames Schutzgebiet. Auf der einen Seite erhebt
      sich das Semenic-Gebirge aus metamorphen und magmatischen Gesteinen mit sanften, dicht bewaldeten
      Kuppen; auf der anderen Seite liegen die Anina-Berge aus stark verkarstetem Sedimentgestein, tief
      zerklüftet von Schluchten mit über 800 Höhlen und Dolinen. Im Südwesten Rumäniens, im Zentrum des
      Kreises Caraș-Severin, umfasst der Nationalpark Semenic-Cheile Carașului rund 36.051 Hektar.


      Es ist eine Landschaft voller Gegensätze: die schwere Waldluft fast unberührter Buchen, die feuchte
      Höhlenkühle bei 10 Grad und die Schwindel erregende Tiefe einer der wildesten Schluchten des Landes.
    landscape: >-
      Das Semenic-Gebirge, das 55 % der Parkfläche ausmacht, besitzt sanfte waldreiche Hänge, aus denen viele
      wichtige Flüsse des Banats entspringen; sein höchster Gipfel ist der Gozna mit 1446,9 m. Die
      Anina-Berge, die restlichen 45 %, bilden eine ganz andere Welt: intensiv verkarstete Sedimentgesteine,
      Schluchten und Dolinentäler, getrennt durch verkarstete Karrenplateaus. Hier zieht sich die Cheile
      Carașului entlang, eine der längsten und ursprünglichsten Schluchten Rumäniens mit artenreicher Flora
      und Fauna, überragt am rechten Ufer von den Ruinen der Burg Grat aus dem dreizehnten Jahrhundert.


      Buchenwälder bedecken mehr als 80 % des Parks. In Izvoarele Nerei, an den Südhängen des Semenic im
      oberen Einzugsgebiet der Nera, haben sich ausgedehnte Urwaldreste des gemässigten Europas erhalten: ein
      herausragend bewahrter Buchenwald, geschützt durch Abgeschiedenheit und Unwegsamkeit. Die ältesten Bäume
      erreichen dort ein Alter von 534 Jahren, und der Wald erstreckt sich zwischen 620 und 1400 m Höhe.
    wildlife: >-
      Der Park beherbergt 1277 Gefässpflanzenarten, darunter seltene Orchideen, Türkenbund-Lilie und
      Schachblume. Bei der Tierwelt wurden 672 Arten erfasst, von denen mehr als 80 unter dem Schutz
      internationaler Abkommen und europäischer Richtlinien stehen.


      Unter den Säugetieren leben [Braunbär](/especie/ursus_arctos/), Rothirsch, Reh,
      [Wolf](/especie/canis_lupus/) und [Eurasischer Luchs](/especie/lynx_lynx/). Bei den Reptilien sticht die
      [Sandotter](/especie/vipera_ammodytes/) hervor, bei den geschützten Vögeln
      [Steinadler](/especie/aquila_chrysaetos/) und Haselhuhn. In den klaren Flüssen Nera und Miniș kommen das
      Karpaten-Neunauge (Eudontomyzon danfordi) sowie die Gründlinge Romanogobio kesslerii und Romanogobio
      uranoscopus vor, gesäumt von Waldmeister-Buchenwäldern des Typs Asperulo-Fagetum.
    visit: >-
      Der Park verfügt über 10 markierte Routen mit insgesamt 130 km Länge. Die weiteste Route vom Secu-See
      nach Semenic erstreckt sich über 30,8 km und erfordert etwa neun Stunden Gehzeit. Kürzere Alternativen
      bieten die Rote-Kreuz-Route, die Comarnic mit Semenic über 13,9 km in etwa dreieinhalb Stunden
      verbindet, und die Gelbe-Kreuz-Route von Carașova nach Gârliște über 3,7 km. Zudem gibt es einen
      Lehrpfad zur Geschichte und Kultur der kroatischen Minderheit des Caraș-Tals sowie einen Pfad zur
      Tierwelt des Parks.


      Unter Tage gilt die Comarnic-Höhle als die schönste und wildeste Tropfsteinhöhle des Banats und ganz
      Rumäniens; mit 6.201 m Ganglänge ist sie nach Buhui die zweitlängste Höhle der Region. Besucher erkunden
      ausschliesslich die trockene obere Etage auf 1750 Metern Länge, während das untere Niveau vom Höhlenbach
      Ponicova durchflossen wird. Sie steht seit 1947 als speläologisches Reservat unter Schutz und liegt im
      Herzen des Banater Berglands zwischen Reșița und Anina. Vom Pistenende erreichst du den Eingang zu Fuss
      in etwa 45 Minuten oder per Auto. Drinnen herrschen rund 10 Grad und hohe Feuchtigkeit; feste
      Wanderschuhe und warme Kleidung sind nötig, Helm und Stirnlampe stellt die Parkverwaltung.
    history: >-
      Der Schutzgedanke reicht weit zurück: 1955 wurde zunächst das 800 Hektar grosse Schutzgebiet Cheile
      Carașului eingerichtet; der Nationalpark entstand schliesslich 1982, im selben Jahr wie das
      Totalreservat Izvoarele Nerei für die unberührten Altbestände. Seit 2017 gehören die uralten
      Buchenwälder von Izvoarele Nerei zum UNESCO-Welterbe.


      Heute umfasst der Nationalpark zehn streng geschützte Naturreservate, darunter Cheile Carașului, Cheile
      Gârliștei, Izvoarele Carașului, Izvoarele Nerei sowie bedeutende Höhlen. Durch den starken Besucherdruck
      während weiter Teile des Jahres steht das Schutzgebiet unter ständiger Beobachtung.
    before: >-
      Das UNESCO-Teilgebiet Izvoarele Nerei darf ausschliesslich zu Fuss in Begleitung eines Parkrangers
      betreten werden. Für den Parkbesuch fällt eine Eintrittsgebühr an, die per SMS bezahlt werden kann. Die
      Comarnic-Höhle ist von April bis Oktober geöffnet; Führungen finden an Wochenenden ab mindestens fünf
      Personen statt, wochentags nur nach vorheriger Anmeldung.
    around: >-
      Die nächstgelegenen Schutzgebiete in Entfernungsreihenfolge sind der [Nationalpark Nera-Schlucht -
      Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/), das
      [Godeanu-Gebirge](/lugar/muntii-godeanu/) und der [Nationalpark Domogled -
      Cerna-Tal](/lugar/parcul-national-domogled---valea-cernei/). Weiter entfernt vereint der [Nationalpark
      Jiu-Schlucht - Urwald](/lugar/parcul-national-defileul-jiului-codrii-seculari/) Sandotter, Luchs und Bär
      in schroffen Schluchten und Urwäldern; die [Jantra-Flussschlucht](/lugar/yantraski-prolom/) teilt
      Karstformationen und Gründlingsarten, während die [Sohodol-Schlucht](/lugar/cheile-sohodolului/)
      ebenfalls Sandottern in einer engen Kalkschlucht beherbergt.
  it:
    intro: >-
      Due montagne molto diverse condividono uno stesso parco protetto. Da una parte i monti Semenic, formati
      da rocce metamorfiche e magmatiche, dalle linee morbide e ammantati di boschi; dall'altra i monti Anina,
      composti da rocce sedimentarie fortemente carsificate, intagliati da gole profonde e con oltre 800
      grotte e voragini. Nel sud-ovest della Romania, al centro del distretto di Caraș-Severin, il Parco
      Nazionale Semenic-Cheile Carașului si estende per circa 36.051 ettari.


      È un parco di aspri contrasti: l'aria densa di una faggeta quasi intatta, l'umidità costante di una
      cavità sotterranea a 10 gradi, e il brivido vertiginoso di una delle gole più lunghe e selvagge del
      paese.
    landscape: >-
      I monti Semenic, che formano il 55 % del parco, presentano pendii boscosi arrotondati da cui scaturisce
      gran parte dei corsi d'acqua principali del Banato; la vetta più alta è il Gozna a 1446,9 m. I monti
      Anina, che costituiscono il restante 45 %, appartengono a una dimensione diversa: calcari fittamente
      carsificati, forre ripide, doline e pianori solcati da campi carreggiati. Qui si snodano le Cheile
      Carașului, tra i canyon più lunghi e incontaminati della Romania, dalla flora e fauna eccezionali,
      sormontati sul versante destro dalle rovine del castello di Grat risalenti al XIII secolo.


      Le faggete coprono più dell'80 % del territorio. A Izvoarele Nerei, sul versante meridionale del Semenic
      e nell'alto bacino del fiume Nera, sopravvivono tra i più vasti lembi di foresta vergine dell'Europa
      temperata: un ecosistema forestale perfettamente conservato grazie a isolamento e asperità. Gli alberi
      più vetusti raggiungono qui i 534 anni, con la foresta che si sviluppa tra 620 e 1400 m di altitudine.
    wildlife: >-
      Il parco accoglie 1277 specie di piante vascolari, tra cui orchidee spontanee, il giglio martagone e la
      fritillaria. Per la fauna sono state censite 672 specie, oltre 80 delle quali protette da accordi
      internazionali e direttive europee.


      Tra i mammiferi popolano i boschi l'[orso bruno](/especie/ursus_arctos/), il cervo, il capriolo, il
      [lupo](/especie/canis_lupus/) e la [lince europea](/especie/lynx_lynx/). I rettili annoverano la [vipera
      dal corno](/especie/vipera_ammodytes/), mentre tra i volatili protetti spiccano l'[aquila
      reale](/especie/aquila_chrysaetos/) e il francolino di monte. Nelle acque limpide dei fiumi Nera e Miniș
      vivono la lampreda Eudontomyzon danfordi e i ghiozzi Romanogobio kesslerii e Romanogobio uranoscopus,
      lungo corsi associati a faggete tipiche Asperulo-Fagetum.
    visit: >-
      Il parco comprende 10 itinerari segnalati per complessivi 130 km. Il tracciato più impegnativo, che va
      dal lago Secu al Semenic, si sviluppa per 30,8 km richiedendo circa nove ore. Per un'escursione più
      breve, la Croce Rossa congiunge Comarnic a Semenic in 13,9 km e circa tre ore e mezza, mentre la Croce
      Gialla collega Carașova a Gârliște per 3,7 km. Si trovano inoltre un itinerario tematico sulle
      tradizioni della comunità croata della valle del Caraș e uno dedicato alla fauna locale.


      Nel sottosuolo, la meraviglia per eccellenza è la grotta di Comarnic, ritenuta la più spettacolare e
      selvaggia del Banato e della Romania; con 6.201 m di sviluppo complessivo, è la seconda cavità del
      Banato dopo quella di Buhui. I visitatori accedono unicamente al livello superiore fossile per 1750
      metri, mentre il livello inferiore è percorso dal torrente sotterraneo Ponicova. Riserva speleologica
      fin dal 1947, si trova nel cuore dei monti del Banato a metà strada tra Reșița e Anina. Al termine della
      carrareccia puoi proseguire a piedi per circa 45 minuti o avanzare in auto. All'interno la temperatura è
      di circa 10 gradi con umidità elevata; servono scarponi da trekking e abbigliamento pesante, mentre
      casco e frontale vengono forniti dall'ente parco.
    history: >-
      La tutela ambientale ha radici storiche: nel 1955 venne istituita la prima riserva naturale mista di
      Cheile Carașului su 800 ettari; il parco nazionale vide la luce nel 1982, anno in cui nacque anche la
      riserva integrale di Izvoarele Nerei per i boschi vetusti. Dal 2017 le faggete secolari di Izvoarele
      Nerei rientrano nel patrimonio mondiale UNESCO.


      Attualmente il parco racchiude dieci riserve naturali a tutela integrale, tra cui Cheile Carașului,
      Cheile Gârliștei, Izvoarele Carașului, Izvoarele Nerei e diverse cavità carsiche. La pressione antropica
      è ragguardevole a causa dell'intenso afflusso turistico durante gran parte dell'anno.
    before: >-
      Il settore di Izvoarele Nerei, incluso nel sito UNESCO, si visita unicamente a piedi con la guida
      obbligatoria di un guardiaparco. Il parco richiede un biglietto d'ingresso pagabile tramite SMS. La
      grotta di Comarnic è aperta da aprile a ottobre, con visite guidate nei fine settimana per comitive di
      almeno cinque persone e nei giorni feriali solo su prenotazione anticipata.
    around: >-
      Le aree naturali più vicine in ordine di distanza sono il [Parco Nazionale delle Gole del Nera -
      Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/), i [Monti Godeanu](/lugar/muntii-godeanu/) e
      il [Parco Nazionale Domogled - Valle del Cerna](/lugar/parcul-national-domogled---valea-cernei/). Più
      distante, il [Parco Nazionale Gola del Jiu - Foresta
      Primordiale](/lugar/parcul-national-defileul-jiului-codrii-seculari/) condivide vipera dal corno, lince
      e orso in un contesto di gole fitte di faggete; la [Gola del Fiume Yantra](/lugar/yantraski-prolom/)
      condivide formazioni carsiche e specie di ghiozzo, mentre la [Gola di
      Sohodol](/lugar/cheile-sohodolului/) ospita anch'essa la vipera dal corno in un impressionante canyon
      roccioso.
  pt:
    intro: >-
      Duas montanhas distintas partilham um mesmo parque protegido. Por um lado, os montes Semenic, de rocha
      metamórfica e magmática, com relevos suaves cobertos por espesso arvoredo; por outro, os montes Anina,
      de rocha sedimentar intensamente cárstica, sulcados por gargantas profundas e abrigando mais de 800
      grutas e algares. No sudoeste da Roménia, no centro do distrito de Caraș-Severin, o Parque Nacional
      Semenic-Cheile Carașului ocupa cerca de 36.051 hectares.


      É um parque de marcados contrastes: o ar denso de um faial quase virgem, a humidade constante de uma
      gruta a 10 graus e a vertigem de uma das gargantas mais longas e selvagens do território romeno.
    landscape: >-
      Os montes Semenic, que somam 55 % da área do parque, apresentam encostas suaves florestadas donde brota
      boa parte dos rios importantes do Banato; o seu ponto culminante é Gozna, a 1446,9 m. Os montes Anina,
      os restantes 45 %, revelam um universo diferente: rocha sedimentar altamente carsificada, gargantas,
      vales de dolinas separados por planaltos com campos de lapiás. Ali estendem-se as Cheile Carașului, uma
      das gargantas mais extensas e primitivas da Roménia, com fauna e flora ricas, dominadas na margem
      direita pelas ruínas do castelo de Grat, do século XIII.


      Os faiais cobrem mais de 80 % do parque. Em Izvoarele Nerei, na encosta sul do Semenic e na bacia alta
      do Nera, preservam-se alguns dos maiores núcleos de floresta virgem remanescentes da Europa temperada:
      um faial imaculado mantido pelo isolamento geográfico e acesso difícil. Ali as árvores mais antigas
      atingem 534 anos de idade, desenvolvendo-se a floresta entre 620 e 1400 m de altitude.
    wildlife: >-
      O parque acolhe 1277 espécies de plantas vasculares, incluindo orquídeas bravas, o lírio-martagão e a
      fritilária. Em termos faunísticos registaram-se 672 espécies, das quais mais de 80 gozam de proteção sob
      convenções internacionais e diretivas comunitárias.


      Entre os mamíferos encontram-se o [urso-pardo](/especie/ursus_arctos/), o veado, o corço, o
      [lobo](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/). Os répteis incluem a
      [víbora-cornuda](/especie/vipera_ammodytes/), enquanto as aves protegidas contam com a
      [águia-real](/especie/aquila_chrysaetos/) e a galinha-do-mato. Nas águas límpidas dos rios Nera e Miniș
      vivem a lampreia Eudontomyzon danfordi e os góbios Romanogobio kesslerii e Romanogobio uranoscopus,
      associados a faiais do tipo Asperulo-Fagetum.
    visit: >-
      O parque dispõe de 10 percursos sinalizados somando 130 km. A travessia mais longa, do lago Secu a
      Semenic, estende-se por 30,8 km e leva cerca de nove horas. Como alternativa mais curta, a rota da Cruz
      Vermelha liga Comarnic a Semenic em 13,9 km e cerca de três horas e meia, enquanto a da Cruz Amarela vai
      de Carașova a Gârliște ao longo de 3,7 km. Existem ainda um percurso temático dedicado à história e
      tradições da comunidade croata do vale do Caraș e outro focado na fauna do parque.


      No subsolo, a atração maior é a gruta de Comarnic, considerada a mais bela e selvagem do Banato e da
      Roménia; com 6.201 m de desenvolvimento, é a segunda mais longa da região depois da de Buhui. Os
      visitantes percorrem apenas a galeria superior fóssil ao longo de 1750 metros, correndo no nível
      inferior o ribeiro subterrâneo Ponicova. Classificada como reserva espeleológica desde 1947, situa-se no
      coração das montanhas do Banato a meio caminho entre Reșița e Anina. No final da pista de terra podes
      seguir a pé cerca de 45 minutos ou ir de carro. No interior registam-se cerca de 10 graus com humidade
      elevada, sendo necessário calçado e agasalho de montanha; o capacete e a lanterna frontal são facultados
      pelo parque.
    history: >-
      A preservação formal teve início precoce: em 1955 foi estabelecida a primeira reserva mista de Cheile
      Carașului com 800 hectares, vindo o parque nacional a ser formalizado em 1982; nesse mesmo ano nasceu a
      reserva integral de Izvoarele Nerei para as matas intactas. Os faiais seculares de Izvoarele Nerei fazem
      parte da rede do Património Mundial da UNESCO desde 2017.


      Hoje o parque engloba dez reservas naturais sob proteção estrita, designadamente Cheile Carașului,
      Cheile Gârliștei, Izvoarele Carașului, Izvoarele Nerei e diversas cavernas cársticas. A pressão
      turística é assinalável devido ao elevado número de visitantes ao longo de quase todo o ano.
    before: >-
      A área de Izvoarele Nerei, integrada no sítio UNESCO, apenas pode ser explorada a pé com a companhia
      obrigatória de um guarda do parque. Cobra-se uma taxa de entrada no parque, passível de pagamento por
      SMS. A gruta de Comarnic funciona de abril a outubro, com visitas guiadas aos fins de semana para grupos
      de pelo menos cinco pessoas e nos dias úteis apenas mediante marcação prévia.
    around: >-
      As reservas mais próximas por ordem de distância são o [Parque Nacional das Gargantas do Nera -
      Beușnița](/lugar/parcul-national-cheile-nerei---beusnita/), as [Montanhas de
      Godeanu](/lugar/muntii-godeanu/) e o [Parque Nacional Domogled - Vale do
      Cerna](/lugar/parcul-national-domogled---valea-cernei/). Mais adiante, o [Parque Nacional do
      Desfiladeiro do Jiu - Floresta Primária](/lugar/parcul-national-defileul-jiului-codrii-seculari/)
      partilha a víbora-cornuda, o lince e o urso num cenário de gargantas selvagens; o [Desfiladeiro do Rio
      Yantra](/lugar/yantraski-prolom/) partilha espécies de góbio e canhões calcários, ao passo que a
      [Garganta de Sohodol](/lugar/cheile-sohodolului/) também alberga a víbora-cornuda num vale cárstico
      imponente.
