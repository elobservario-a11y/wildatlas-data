  es: Vasto macizo de pinares sobre arenas fluvioglaciares con lagos lobulados de aguas transparentes.
  en: A vast expanse of Scots pine forests on outwash sands with lobed lakes of crystal-clear water.
  fr: Vaste massif de pinèdes sur sables fluvioglaciaires émaillé de lacs lobés aux eaux cristallines.
  de: Ausgedehntes Kiefernwaldgebiet auf Sanderflächen mit buchtenreichen Seen von kristallklarer Transparenz.
  it: Vasto complesso di pinete su sabbie fluvioglaciali con laghi lobati dalle acque trasparenti.
  pt: >-
    Vasto maciço de pinhais sobre areias fluvioglaciares pontilhado por lagos lobulados de águas
    transparentes.
unico:
  es: >-
    En sus lagos lobelianos de aguas claras crece la lobelia de lago junto a plantas acuáticas tan raras como
    *Isoëtes lacustris* y *Luronium natans*.
  en: >-
    In its clear Lobelia lakes grows water lobelia alongside botanical rarities as exceptional as *Isoëtes
    lacustris* and *Luronium natans*.
  fr: >-
    Dans ses lacs lobéliens aux eaux claires pousse la lobélie de Dortmann aux côtés de raretés aquatiques
    telles qu'*Isoëtes lacustris* et *Luronium natans*.
  de: >-
    In seinen klaren Lobeliaseen wächst die Wasser-Lobelie neben seltenen Wasserpflanzen wie *Isoëtes
    lacustris* und *Luronium natans*.
  it: >-
    Nei suoi laghi a lobelia dalle acque limpide vegeta la lobelia d'acqua assieme a rarità botaniche come
    *Isoëtes lacustris* e *Luronium natans*.
  pt: >-
    Nos seus lagos com lobélia de águas límpidas viceja a lobélia-dos-lagos a par de raridades botânicas como
    *Isoëtes lacustris* e *Luronium natans*.
observaciones:
  es: >-
    De mayo a octubre es la mejor época. Los senderos tienen suelo arenoso y desniveles, con raíces que
    sobresalen, así que lleva calzado firme. Antes de ir, comprueba en la web del gestor las condiciones de
    acceso.
texto:
  es:
    intro: >-
      En el paso de otoño, hasta 2.300 grullas se concentran en el lago Ostrowite, y la escena dice mucho de
      este lugar: un pequeño parque de lagos transparentes y pinares en medio de Bory Tucholskie, el mayor
      bosque de Polonia. El Parque Nacional de Bory Tucholskie se creó en 1996 y ocupa 4613,04 ha, en el norte
      del país, en el condado de Chojnice.


      No es un parque grande, y casi nació más pequeño. La primera propuesta era de 130 km², pero tras hablar
      con las autoridades locales se acordó limitar los bordes a la zona de la Struga Siedmiu Jezior, el
      Arroyo de los Siete Lagos. Desde 2010 es el núcleo de la Reserva de la Biosfera de Bory Tucholskie,
      designada por la UNESCO.
    landscape: >-
      Todo empieza con el hielo. El glaciar escandinavo modeló la comarca, y por eso es en su mayor parte una
      llanura de arena, rota por dunas y lagos. Los lagos son largos y estrechos y forman canales, de los
      cuales el más largo mide 17 km. Dentro del parque hay 21 lagos; el mayor y más profundo es el Ostrowite,
      y siete están unidos y forman la Struga Siedmiu Jezior, un pequeño río de 13,9 km.


      Cuatro de ellos, Wielkie Gacno, Małe Gacno, Nierybno y Głuche, son lagos lobelianos: un hábitat muy
      raro, de aguas claras, donde crece la lobelia de lago, que en Polonia se encuentra en 130 lagos de
      Pomerania. Con ella viven *Isoëtes lacustris*, *Isoëtes echinospora*, *Litorella uniflora*,
      *Myriophyllum alterniflorum* y *Luronium natans*.


      Alrededor, el bosque cubre unas 3800 ha, cerca del 83 % del parque, y el 98 % de esos hábitats
      forestales son pinares. Los suelos son pobres y ácidos, pero la flora es sorprendentemente rica: 634
      especies de plantas vasculares, el 33 % de los líquenes registrados en Polonia y 483 especies de hongos.
    wildlife: >-
      Las cifras de fauna cuentan un parque de agua: 252 vertebrados y 1.686 invertebrados. En los lagos
      unidos por el arroyo hay 28 especies de peces; se han registrado anfibios (11 especies), reptiles (5) y
      37 especies de mamíferos. Entre los invertebrados hay 42 especies de mariposas diurnas, 17 de hormigas y
      45 de libélulas. En el agua viven también la locha y la *różanka*, ambas parcialmente protegidas.


      Las aves son lo mejor del calendario. Se han observado 130 especies, 98 de ellas reproductoras.
      Ostrowite, Płęsno y Skrzynka son lagos de descanso, alimentación y muda para las aves en las migraciones
      de primavera y otoño, y en el paso otoñal, la [grulla](/especie/grus_grus/) llega a reunirse hasta 2.300
      en Ostrowite. Entre las rapaces nocturnas están el búho real, el mochuelo chico, el cárabo común y el
      mochuelo boreal; entre las acuáticas, el cisne cantor, la cerceta, el ánsar campestre y la serreta
      chica, y también el pigargo y el aguilucho lagunero.


      El [lobo](/especie/canis_lupus/) está presente desde 2010. El urogallo, en cambio, el ave del logotipo
      del parque, ya no vive en su territorio.
    visit: >-
      El parque tiene sus senderos didácticos, y cada uno cuenta una cosa distinta. El sendero rojo de Łąki
      Józefowskie recorre unos 5,3 km en circuito y se completa en unas dos horas y media. El azul de Piła
      Młyn tiene trece paradas, desde los líquenes y los lagos hasta la protección de aves, murciélagos y
      anfibios. La senda botánica junto a la sede del parque permite conocer su flora regional y también la
      pueden usar personas en silla de ruedas. Y la senda verde de Wielkie Gacno interpreta la sucesión en
      dunas y ecotonos y el paisaje de lagos.


      El Centro de Educación Natural del parque está en Chociński Młyn, y la sede de la dirección en
      Charzykowy, a 3 km de Chojnice.
    history: >-
      El 7 % del parque tiene protección estricta, en 10 zonas, y solo dos de ellas se pueden visitar: Małe
      Gacno y Kacze Oko.
    before: >-
      De mayo a octubre es la mejor época. Los senderos tienen suelo arenoso y desniveles, con raíces que
      sobresalen, así que lleva calzado firme. Antes de ir, comprueba en la web del gestor las condiciones de
      acceso.
    around: >-
      Lejos de aquí, [The Flow Country — turberas de Caithness y Sutherland](/lugar/the-flow-country/)
      comparte con Bory Tucholskie los lagos con *Myriophyllum alterniflorum* y lobelia de lago.
  en:
    intro: >-
      During the autumn migration, up to 2,300 common cranes gather at Lake Ostrowite, a spectacle that
      captures the essence of this protected sanctuary: a compact park of pellucid lakes and pine woodlands
      tucked inside Bory Tucholskie, the largest forest complex in Poland. Bory Tucholskie National Park was
      established in 1996 and encompasses 4613.04 ha in the northern part of the country, within Chojnice
      County.


      It is not an expansive park, and it was nearly created on an even smaller footprint. An initial proposal
      envisioned 130 km², but negotiations with local communities agreed to delimit its boundaries around the
      basin of the Struga Siedmiu Jezior, the Stream of Seven Lakes. Since 2010 it forms the core zone of the
      UNESCO-designated Bory Tucholskie Biosphere Reserve.
    landscape: >-
      Everything stems from glacial ice. The Scandinavian ice sheet sculpted the terrain, leaving an outwash
      sandur plain interrupted by dunes and kettle basins. The lakes are elongated, narrow, and arranged in
      chain-like channels, the longest extending for 17 km. Within the park lie 21 lakes; the largest and
      deepest is Ostrowite, while seven are linked together by the Struga Siedmiu Jezior, a tranquil 13.9 km
      stream.


      Four of these basins—Wielkie Gacno, Małe Gacno, Nierybno, and Głuche—are Lobelia lakes: an
      extraordinarily rare oligotrophic freshwater habitat characterized by transparent waters where water
      lobelia thrives, known in Poland from just 130 lakes across Pomerania. Alongside it grow *Isoëtes
      lacustris*, *Isoëtes echinospora*, *Litorella uniflora*, *Myriophyllum alterniflorum*, and *Luronium
      natans*.


      Surrounding the waters, forest blankets some 3800 ha, nearly 83 % of the park's territory, and 98 % of
      these wooded habitats consist of pine stands. While soils are nutrient-poor and acidic, biodiversity is
      surprisingly high: 634 species of vascular plants, 33 % of all lichens recorded across Poland, and 483
      species of fungi.
    wildlife: >-
      Faunal statistics reflect an aquatic ecosystem: 252 vertebrates and 1,686 invertebrates. In the lakes
      linked by the stream live 28 fish species; records include amphibians (11 species), reptiles (5), and 37
      mammal species. Invertebrate diversity features 42 species of butterflies, 17 ant species, and 45
      species of dragonflies. The waters also harbour weatherfish and European bitterling (*różanka*), both
      enjoying partial protection.


      Avian life represents the true highlight of the calendar. A total of 130 bird species have been
      recorded, 98 of them breeding within the park. Ostrowite, Płęsno, and Skrzynka serve as crucial resting,
      feeding, and moulting stations during spring and autumn passages, and during autumn migration the
      [common crane](/especie/grus_grus/) gathers in congregations reaching up to 2,300 individuals on
      Ostrowite. Nocturnal raptors include Eurasian eagle-owl, Eurasian pygmy owl, tawny owl, and boreal owl;
      waterfowl feature whooper swan, common teal, bean goose, and smew, alongside white-tailed eagle and
      western marsh harrier.


      The [wolf](/especie/canis_lupus/) has been recolonizing the area since 2010. The western capercaillie,
      however, immortalized in the park's emblem, no longer inhabits the territory.
    visit: >-
      The park maintains educational interpretive trails, each highlighting a distinct ecological aspect. The
      red trail at Łąki Józefowskie covers a 5.3 km circuit that takes about two and a half hours to walk. The
      blue trail at Piła Młyn features thirteen interpretive stops spanning lichens, lake ecology, and
      conservation measures for birds, bats, and amphibians. A botanical path adjacent to park headquarters
      introduces regional flora and is fully accessible to wheelchair users. Meanwhile, the green trail at
      Wielkie Gacno illustrates sand dune succession, ecotones, and lake morphology.


      The Park Nature Education Centre is located in Chociński Młyn, while administrative headquarters reside
      in Charzykowy, 3 km outside Chojnice.
    history: >-
      A total of 7 % of the park enjoys strict protection across 10 designated reserves, only two of which may
      be entered by the public: Małe Gacno and Kacze Oko.
    before: >-
      May to October offers the most rewarding conditions. Trails feature sandy footpaths and uneven terrain
      with protruding tree roots, making sturdy footwear advisable. Before setting out, check access
      regulations on the managing authority's website.
    around: >-
      Far to the west, [The Flow Country — Caithness and Sutherland Peatlands](/lugar/the-flow-country/)
      shares with Bory Tucholskie freshwater lochs supporting *Myriophyllum alterniflorum* and water lobelia.
  fr:
    intro: >-
      Lors de la migration automnale, jusqu'à 2 300 grues se rassemblent sur le lac Ostrowite, résumant
      l'atmosphère de ce sanctuaire préservé : un parc compact de lacs transparents et de pinèdes au cœur de
      Bory Tucholskie, la plus vaste forêt de Pologne. Le parc national de Bory Tucholskie a été créé en 1996
      et s'étend sur 4 613,04 ha dans le nord du pays, dans le district de Chojnice.


      Ce n'est pas un grand parc, et il a failli naître encore plus réduit. La proposition initiale prévoyait
      130 km², mais les discussions avec les communes locales ont ramené le périmètre au bassin de la Struga
      Siedmiu Jezior, le ruisseau des Sept Lacs. Depuis 2010, il forme le cœur de la réserve de biosphère de
      Bory Tucholskie reconnue par l'UNESCO.
    landscape: >-
      Tout procède des glaces. L'inlandsis scandinave a façonné la contrée en une plaine d'épandage
      sablonneuse scandée de dunes et de cuvettes lacustres. Les lacs sont allongés, étroits et forment des
      chapelets de chenaux dont le plus développé atteint 17 km. Le parc compte 21 lacs ; le plus vaste et
      profond est l'Ostrowite, et sept sont interconnectés le long de la Struga Siedmiu Jezior, un cours d'eau
      de 13,9 km.


      Quatre de ces plans d'eau—Wielkie Gacno, Małe Gacno, Nierybno et Głuche—sont des lacs à lobélies : un
      milieu oligotrophe d'une insigne rareté aux eaux translucides où prospère la lobélie de Dortmann,
      présente en Pologne dans seulement 130 lacs de Poméranie. Elle y côtoie *Isoëtes lacustris*, *Isoëtes
      echinospora*, *Litorella uniflora*, *Myriophyllum alterniflorum* et *Luronium natans*.


      Tout autour, la forêt couvre environ 3 800 ha, soit près de 83 % du parc, et 98 % de ces peuplements
      sont des pinèdes de pin sylvestre. Sur ces sols acides et pauvres, la flore surprend par sa richesse :
      634 espèces de plantes vasculaires, 33 % des lichens recensés en Pologne et 483 espèces de champignons.
    wildlife: >-
      L'inventaire faunistique illustre la prépondérance des zones humides : 252 vertébrés et 1 686
      invertébrés. Les lacs reliés par le ruisseau abritent 28 espèces de poissons ; les inventaires signalent
      11 espèces d'amphibiens, 5 reptiles et 37 espèces de mammifères. Chez les invertébrés figurent 42
      espèces de papillons diurnes, 17 de fourmis et 45 d'odonates. Dans l'eau vivent également la loche
      d'étang et la bouvière (*różanka*), toutes deux partiellement protégées.


      L'avifaune offre le spectacle le plus marquant. Au total, 130 espèces d'oiseaux ont été observées, dont
      98 nicheuses. Les lacs Ostrowite, Płęsno et Skrzynka servent d'étapes de repos, d'alimentation et de mue
      lors des migrations, et à l'automne la [grue cendrée](/especie/grus_grus/) s'y regroupe jusqu'à 2 300
      individus sur l'Ostrowite. Parmi les rapaces nocturnes nichent le grand-duc d'Europe, la chevêchette
      d'Europe, la chouette hulotte et la nyctale de Tengmalm ; les oiseaux d'eau comptent le cygne chanteur,
      la sarcelle d'hiver, l'oie des moissons et le harle piette, côtoyant le pygargue à queue blanche et le
      busard des roseaux.


      Le [loup gris](/especie/canis_lupus/) est de retour depuis 2010. En revanche, le grand tétras, qui
      figure sur l'emblème officiel du parc, a déserté son territoire.
    visit: >-
      Le parc dispose de sentiers didactiques abordant chacun une thématique propre. Le sentier rouge des Łąki
      Józefowskie décrit une boucle de 5,3 km réalisable en deux heures et demie environ. Le sentier bleu de
      Piła Młyn compte treize haltes explicatives, des lichens aux lacs en passant par la protection des
      oiseaux, chauves-souris et amphibiens. Un sentier botanique aménagé près du siège permet d'observer la
      flore locale et demeure accessible aux personnes en fauteuil roulant. Le sentier vert de Wielkie Gacno
      décrypte la dynamique dunaire, les écotones et le paysage lacustre.


      Le centre d'éducation à la nature du parc est établi à Chociński Młyn, tandis que la direction générale
      siège à Charzykowy, à 3 km de Chojnice.
    history: >-
      Une part de 7 % du parc bénéficie d'une protection intégrale répartie en 10 réserves, dont deux
      seulement sont ouvertes aux visiteurs : Małe Gacno et Kacze Oko.
    before: >-
      La période de mai à octobre s'avère idéale pour la découverte. Les sentiers sablonneux présentent des
      racines apparentes, exigeant de bonnes chaussures de marche. Avant votre départ, renseignez-vous sur les
      conditions d'accès via le site officiel du parc.
    around: >-
      Bien plus à l'ouest, [The Flow Country — tourbières de Caithness et
      Sutherland](/lugar/the-flow-country/) partage avec Bory Tucholskie des lochs abritant *Myriophyllum
      alterniflorum* et la lobélie aquatique.
  de:
    intro: >-
      Während des Herbstzuges sammeln sich bis zu 2.300 Kraniche am Ostrowite-See – ein Bild, das den
      Charakter dieses Schutzgebietes prägt: ein kompakter Park aus transparenten Seen und Kiefernwäldern
      inmitten der Tucheler Heide (Bory Tucholskie), Polens grösstem zusammenhängenden Waldgebiet. Der
      Nationalpark Bory Tucholskie wurde 1996 gegründet und umfasst 4613,04 ha im Norden des Landes im Kreis
      Chojnice.


      Es ist kein grosser Park, und er wäre beinahe noch kleiner ausgefallen. Der erste Entwurf sah 130 km²
      vor, doch nach Abstimmung mit den Gemeinden einigte man sich auf das Einzugsgebiet der Struga Siedmiu
      Jezior, des Baches der Sieben Seen. Seit 2010 bildet er die Kernzone des von der UNESCO anerkannten
      Biosphärenreservats Bory Tucholskie.
    landscape: >-
      Alles begann mit dem Eis. Das skandinavische Inlandeis formte die Landschaft als sandige Sanderfläche,
      gegliedert durch Dünenzüge und Seewannen. Die Rinnenseen sind langgestreckt und schmal; die längste
      Kette misst 17 km. Im Park liegen 21 Seen; der grösste und tiefste ist der Ostrowite, und sieben bilden
      über die Struga Siedmiu Jezior ein zusammenhängendes Flusssystem von 13,9 km Länge.


      Vier dieser Gewässer—Wielkie Gacno, Małe Gacno, Nierybno und Głuche—sind sogenannte Lobeliaseen: ein
      sehr seltener, oligotropher Lebensraum klaren Wassers, in dem die Wasser-Lobelie gedeiht, die in ganz
      Polen auf 130 pommersche Seen beschränkt ist. Mit ihr wachsen *Isoëtes lacustris*, *Isoëtes
      echinospora*, *Litorella uniflora*, *Myriophyllum alterniflorum* und *Luronium natans*.


      Ringsum bedeckt der Wald rund 3800 ha, fast 83 % der Parkfläche, und 98 % dieser Waldhabitate sind
      Kiefernforste. Trotz nährstoffarmer, saurer Böden ist die Flora überraschend artenreich: 634
      Gefässpflanzenarten, 33 % der in Polen nachgewiesenen Flechten und 483 Pilzarten.
    wildlife: >-
      Die Tierwelt unterstreicht den Wasserreichtum: 252 Wirbeltier- und 1.686 Wirbellosenarten. In den durch
      den Bachlauf verbundenen Seen leben 28 Fischarten; erfasst sind zudem 11 Amphibienarten, 5
      Reptilienarten und 37 Säugetierarten. Unter den Wirbellosen finden sich 42 Tagfalterarten, 17
      Ameisenarten und 45 Libellenarten. Im Wasser leben Schlammpeitzger und Bitterling (*różanka*), beide
      teilweise geschützt.


      Die Vögel bilden den Höhepunkt des Jahreslaufs. Es wurden 130 Vogelarten nachgewiesen, von denen 98 im
      Gebiet brüten. Die Seen Ostrowite, Płęsno und Skrzynka dienen als Rast-, Nahrungs- und Mauserplätze auf
      dem Frühjahrs- und Herbstzug; im Spätherbst versammeln sich bis zu 2.300 Exemplare des
      [Kranichs](/especie/grus_grus/) am Ostrowite. Unter den Eulen brüten Uhu, Sperlingskauz, Waldkauz und
      Raufusskauz; zu den Wasservögeln zählen Singschwan, Krickente, Saatgans und Zwergsäger, begleitet von
      Seeadler und Rohrweihe.


      Der [Wolf](/especie/canis_lupus/) streift seit 2010 wieder durch die Forste. Das Auerhuhn hingegen,
      Wappenvogel des Parks, kommt hier nicht mehr vor.
    visit: >-
      Der Park erschliesst sich über thematische Lehrpfade. Der rote Wanderweg bei Łąki Józefowskie verläuft
      über 5,3 km als Rundkurs in etwa zweieinhalb Stunden. Der blaue Pfad bei Piła Młyn besitzt dreizehn
      Stationen von Flechten über Gewässerbiologie bis zum Schutz von Vögeln, Fledermäusen und Lurchen. Ein
      botanischer Pfad an der Parkverwaltung stellt die heimische Pflanzenwelt vor und ist rollstuhlgerecht
      ausgebaut. Der grüne Pfad am Wielkie Gacno erläutert Dünenökologie, Waldränder und Seeökosysteme.


      Das Natur- und Umweltbildungszentrum befindet sich in Chociński Młyn, während die Parkdirektion ihren
      Sitz in Charzykowy hat, 3 km von Chojnice entfernt.
    history: >-
      Ein Anteil von 7 % des Parks steht unter strengem Schutz, verteilt auf 10 Zonen, von denen nur zwei für
      Besucher zugänglich sind: Małe Gacno und Kacze Oko.
    before: >-
      Von Mai bis Oktober herrschen die besten Bedingungen. Die Wege weisen sandigen Untergrund mit
      freiliegenden Wurzeln auf; festes Schuhwerk wird empfohlen. Informiere dich vorab auf der Website der
      Parkverwaltung über aktuelle Zugangsbestimmungen.
    around: >-
      Weit im Nordwesten teilt [The Flow Country — Caithness and Sutherland
      Peatlands](/lugar/the-flow-country/) mit Bory Tucholskie Moorseen mit *Myriophyllum alterniflorum* und
      Wasser-Lobelien.
  it:
    intro: >-
      Durante il passo autunnale, fino a 2.300 gru si radunano sulle rive del lago Ostrowite: un'immagine che
      racconta lo spirito di questo spazio protetto, piccolo parco di acque limpide e pinete racchiuso nelle
      Bory Tucholskie, la foresta più vasta della Polonia. Il Parco Nazionale delle Bory Tucholskie è stato
      istituito nel 1996 e copre 4613,04 ha nella porzione settentrionale del paese, nel distretto di
      Chojnice.


      Non è un parco esteso, e rischiò di nascere ancora più contenuto. La bozza iniziale prevedeva 130 km²,
      ma il confronto con le amministrazioni locali ha circoscritto i confini al bacino della Struga Siedmiu
      Jezior, il Torrente dei Sette Laghi. Dal 2010 costituisce il cuore della Riserva della Biosfera delle
      Bory Tucholskie istituita dall'UNESCO.
    landscape: >-
      L'origine di tutto risiede nei ghiacci. L'inlandsis scandinavo ha modellato il comprensorio in una piana
      di depositi sabbiosi intervallata da dune e conche lacustri. I laghi glaciali sono allungati e stretti e
      formano canali di cui il maggiore misura 17 km. Nel territorio del parco si contano 21 laghi; il più
      vasto e profondo è l'Ostrowite, e sette specchi d'acqua sono inanellati dalla Struga Siedmiu Jezior, un
      corso d'acqua di 13,9 km.


      Quattro bacini—Wielkie Gacno, Małe Gacno, Nierybno e Głuche—sono laghi a lobelia: un ecosistema
      oligotrofico assai raro e dalle acque trasparenti dove vive la lobelia d'acqua, segnalata in Polonia in
      appena 130 laghi della Pomerania. Con essa crescono *Isoëtes lacustris*, *Isoëtes echinospora*,
      *Litorella uniflora*, *Myriophyllum alterniflorum* e *Luronium natans*.


      All'intorno, il manto forestale occupa circa 3800 ha, quasi l'83 % della superficie protetta, e il 98 %
      di questi boschi è costituito da pinete di pino silvestre. Sebbene i suoli siano poveri e acidi, la
      flora è di grande interesse: 634 specie di piante vascolari, il 33 % dei licheni censiti in Polonia e
      483 specie di funghi.
    wildlife: >-
      I dati faunistici riflettono una spiccata vocazione acquatica: 252 vertebrati e 1.686 invertebrati. Nei
      laghi collegati dal torrente nuotano 28 specie ittiche; sono registrati anfibi (11 specie), rettili (5)
      e 37 specie di mammiferi. Il popolamento di invertebrati vanta 42 specie di farfalle diurne, 17 di
      formiche e 45 di libellule. Nelle acque vivono anche il cobite barbatello e la *różanka*, entrambi
      sottoposti a parziale tutela.


      L'avifauna offre i momenti di maggiore suggestione. Si contano 130 specie di uccelli osservate, di cui
      98 nidificanti. I laghi Ostrowite, Płęsno e Skrzynka sono tappe vitali per sosta, alimentazione e muta
      durante i passaggi migratori, e in autunno la [gru](/especie/grus_grus/) forma dormitori che raggiungono
      2.300 presenze sull'Ostrowite. Tra i rapaci notturni compaiono gufo reale, civetta nana, allocco e
      civetta capogrosso; tra gli uccelli acquatici spiccano cigno selvatico, alzavola comune, oca granaiola e
      pesciaiola, affiancati da aquila di mare e falco di palude.


      Il [lupo](/especie/canis_lupus/) è stabilmente presente dal 2010. Il gallo cedrone, per contro,
      raffigurato nel logo del parco, non abita più questa foresta.
    visit: >-
      Il parco propone itinerari didattici ben strutturati, ciascuno focalizzato su aspetti naturalistici
      differenti. Il sentiero rosso delle Łąki Józefowskie descrive un anello di circa 5,3 km percorribile in
      circa due ore e mezza. Il tracciato blu di Piła Młyn comprende tredici tappe esplicative, dai licheni
      agli specchi d'acqua fino alla tutela di uccelli, chirotteri e anfibi. Una passerella botanica presso la
      sede permette di conoscere la flora regionale ed è adatta anche a persone su sedia a rotelle. Il
      percorso verde di Wielkie Gacno interpreta le dinamiche dunali, gli ecotoni e il paesaggio lacustre.


      Il Centro di Educazione Ambientale ha sede a Chociński Młyn, mentre gli uffici del parco si trovano a
      Charzykowy, a 3 km da Chojnice.
    history: >-
      Il 7 % del territorio è sottoposto a tutela integrale, suddiviso in 10 riserve di cui soltanto due sono
      accessibili ai visitatori: Małe Gacno e Kacze Oko.
    before: >-
      Da maggio a ottobre si incontra il periodo migliore per le escursioni. I sentieri presentano fondo
      sabbioso e radici affioranti, richiedendo calzature adeguate. Prima di pianificare la visita, verifica
      le normative di accesso sul portale ufficiale del parco.
    around: >-
      Lontano da qui, [The Flow Country — torbiere di Caithness e Sutherland](/lugar/the-flow-country/)
      condivide con le Bory Tucholskie laghi con *Myriophyllum alterniflorum* e lobelia d'acqua.
  pt:
    intro: >-
      Na passagem outonal, chegam a concentrar-se 2.300 grous no lago Ostrowite, num retrato expressivo deste
      recanto protegido: um pequeno parque de lagos cristalinos e pinhais no coração de Bory Tucholskie, a
      maior mancha florestal da Polónia. O Parque Nacional de Bory Tucholskie foi criado em 1996 e abrange
      4613,04 ha no norte do país, no concelho de Chojnice.


      Não é um parque extenso e quase nasceu ainda mais exíguo. A proposta inicial delineava 130 km², mas o
      entendimento com as autarquias locais limitou a área à bacia da Struga Siedmiu Jezior, o Ribeiro dos
      Sete Lagos. Desde 2010 constitui a zona tampão central da Reserva da Biosfera de Bory Tucholskie
      declarada pela UNESCO.
    landscape: >-
      Tudo principiou com os glaciares. O inlandsis escandinavo talhou a região numa planície de areias de
      degelo recortada por dunas e lagoas. Os lagos de origem glaciar são compridos e estreitos formando
      canais, o maior dos quais com 17 km. O parque alberga 21 lagos; o maior e mais fundo é o Ostrowite,
      estando sete deles encadeados pela Struga Siedmiu Jezior, uma linha de água de 13,9 km.


      Quatro destas massas de água—Wielkie Gacno, Małe Gacno, Nierybno e Głuche—são lagos de lobélia: um
      habitat oligotrófico muito invulgar de águas claras onde cresce a lobélia-dos-lagos, presente na Polónia
      em apenas 130 lagos da Pomerânia. Ao seu lado vicejam *Isoëtes lacustris*, *Isoëtes echinospora*,
      *Litorella uniflora*, *Myriophyllum alterniflorum* e *Luronium natans*.


      Em redor, o bosque ocupa cerca de 3800 ha, quase 83 % da área do parque, sendo 98 % destes povoamentos
      dominados pelo pinheiro-silvestre. Os solos são pobres e ácidos, mas a flora revela grande diversidade:
      634 espécies de plantas vasculares, 33 % dos líquenes registados na Polónia e 483 espécies de fungos.
    wildlife: >-
      O inventário de fauna traduz a relevância dos meios húmidos: 252 vertebrados e 1.686 invertebrados. Nos
      lagos ligados pelo ribeiro habitam 28 espécies piscícolas; contam-se anfíbios (11 espécies), répteis (5)
      e 37 espécies de mamíferos. A comunidade de invertebrados reúne 42 espécies de borboletas diurnas, 17 de
      formigas e 45 de libélulas. O bodião-de-água-doce e a *różanka* também povoam as águas, ambos com
      estatuto de proteção parcial.


      As aves protagonizam os momentos mais marcantes do ciclo anual. Foram assinaladas 130 espécies, 98 das
      quais nidificantes. Ostrowite, Płęsno e Skrzynka são áreas de refúgio, descanso e muda durante as
      migrações, congregando o [grou-comum](/especie/grus_grus/) até 2.300 indivíduos no Ostrowite durante o
      outono. Nas rapinas noturnas ocorrem o bufo-real, o mocho-pigmeu, a coruja-do-mato e o mocho-funéreo;
      nas aves aquáticas contam-se o cisne-bravo, a marreca-comum, o ganso-campestre e o merganso-pequeno,
      acompanhados pela águia-rabalva e pelo tartaranhão-dos-pauis.


      O [lobo](/especie/canis_lupus/) marca presença continuada desde 2010. Em contrapartida, o tetraz-grande,
      símbolo heráldico do parque, já não nidifica no território.
    visit: >-
      O parque dispõe de percursos didáticos que abordam facetas ecológicas distintas. O trilho vermelho de
      Łąki Józefowskie desenha um anel de 5,3 km que se completa em cerca de duas horas e meia. O percurso
      azul de Piła Młyn integra treze pontos de paragem, desde os líquenes aos lagos e à conservação de aves,
      morcegos e anfíbios. Um trilho botânico junto à sede possibilita conhecer a vegetação da região,
      adaptado a cadeiras de rodas. O trilho verde de Wielkie Gacno interpreta a dinâmica das dunas, ecótonos
      e o relevo lacustre.


      O Centro de Educação Ambiental localiza-se em Chociński Młyn e a sede administrativa em Charzykowy, a 3
      km de Chojnice.
    history: >-
      Cerca de 7 % da superfície do parque goza de proteção integral distribuída por 10 reservas, das quais
      apenas duas podem ser visitadas: Małe Gacno e Kacze Oko.
    before: >-
      O intervalo de maio a outubro constitui a melhor época. Os caminhos são arenosos e apresentam raízes
      salientes, sendo aconselhável calçado firme de caminhada. Consulta o sítio web oficial da administração
      para verificar eventuais restrições antes de partir.
    around: >-
      A grande distância, [The Flow Country — turfeiras de Caithness e Sutherland](/lugar/the-flow-country/)
      partilha com Bory Tucholskie lagos com *Myriophyllum alterniflorum* e lobélia aquática.
