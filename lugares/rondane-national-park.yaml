resumen:
  es: >-
    El Parque Nacional más antiguo de Noruega (1962), diez cumbres de más de 2.000 m separadas por valles
    secos y líquenes alpinos blancos.
  en: >-
    Norway's oldest national park (1962), featuring ten peaks rising above 2,000 m separated by arid
    high-mountain valleys and pale alpine lichens.
  fr: >-
    Le plus ancien parc national de Norvège (1962), comptant dix sommets dépassant 2 000 m séparés par des
    combes arides et des lichens blancs.
  de: >-
    Norwegens ältester Nationalpark (1962) mit zehn über 2.000 m hohen Gipfeln, kargen Gebirgstälern und
    weißen Rentierflechten.
  it: >-
    Il parco nazionale più antico della Norvegia (1962), con dieci vette oltre i 2.000 m separate da aride
    valli d'alta quota e candidi licheni alpini.
  pt: >-
    O mais antigo parque nacional da Noruega (1962), abrigando dez cumes acima dos 2.000 m separados por vales
    áridos e líquenes alpinos claros.
unico:
  es: >-
    Un macizo donde vive una de las últimas poblaciones originales de reno salvaje de Europa y donde se camina
    tras los pasos de cazadores de reno de hace más de mil años.
  en: >-
    A high-mountain massif home to one of Europe's last indigenous wild reindeer populations, where you tread
    trails used by prehistoric hunters over a thousand years ago.
  fr: >-
    Un massif d'altitude où survit l'une des ultimes hardes de rennes sauvages indigènes d'Europe, sur les
    traces de chasseurs préhistoriques vieux de plus de mille ans.
  de: >-
    Ein Hochgebirgsmassiv mit einer der letzten ursprünglichen Wildrentierpopulationen Europas, wo du auf
    Pfaden tausendjähriger Rentierjäger wanderst.
  it: >-
    Un massiccio che ospita una delle ultime popolazioni originarie di renne selvatiche d'Europa, dove si
    cammina sui sentieri di cacciatori preistorici di oltre mille anni fa.
  pt: >-
    Um maciço montanhoso onde reside uma das últimas populações autóctones de renas selvagens da Europa,
    percorrendo trilhos de caçadores com mais de mil anos.
observaciones:
  es: >-
    Hay normas claras. Entre el 1 de marzo y el 20 de agosto todos los perros van con correa. No se permiten
    drones en el parque nacional, y en bicicleta normal no se puede circular salvo excepciones. Hay poca agua
    para rellenar la cantimplora y el tiempo cambia muy rápido. La afluencia es media alrededor del refugio de
    Rondvassbu.
texto:
  es:
    intro: >-
      Rondane existe por una idea de la gente de la zona, no de las autoridades. A mediados de los años
      cincuenta, un guarda de montaña de Otta, Norman Heitkøtter, vio que el aumento de visitantes sería la
      mayor amenaza para el reno salvaje, y impulsó la protección del macizo. El 21 de diciembre de 1962 nació
      el primer parque nacional de Noruega, y hoy ocupa 963 km² de macizos redondeados, valles profundos y
      diez cumbres de más de 2.000 m.
    landscape: >-
      El paisaje de Rondane lo esculpió la última glaciación. El hielo, al rozar bajo los glaciares, formó
      valles redondeados en U, y los ríos de deshielo tallaron valles en V. Al fundirse el hielo, asomaron las
      montañas más altas, y en sus cumbres afloran antiguas capas de arenisca de cientos de millones de años.
      Hoy no queda ningún glaciar activo: nieva poco en invierno y los veranos se han suavizado. Quedan sus
      huellas, como depresiones dejadas por los últimos restos de hielo y pequeñas colinas llamadas eskers.


      El macizo tiene diez cumbres por encima de los 2.000 m, y la más alta es el Rondeslottet, de 2.178 m. En
      sus zonas altas, el terreno de canchales es de los más exigentes del parque; basta alejarse un poco de
      sus límites para encontrar valles verdes y terreno mucho más amable. En el centro está el lago
      Rondvatnet, desde el que se llega en menos de una jornada a pie a todos los picos de más de 2.000 m. El
      límite del bosque está hacia los 1.000-1.100 m, y por encima solo queda lo más duro: salvo el abedul
      blanco de las zonas bajas, el suelo se cubre de brezo y líquenes por falta de nutrientes.
    wildlife: >-
      El gran protagonista es el [reno salvaje](/especie/rangifer_tarandus/). Una de las poblaciones
      originales de reno salvaje de Europa vive aquí, recorre estas montañas desde hace más de 10.000 años,
      aguanta bien el clima pero es muy vulnerable a las molestias humanas. Es muy tímido y huye lejos si se
      asusta. Hoy la población de Rondane está dividida en tres por las barreras de la presencia humana, y por
      eso los senderos y las pistas de esquí se han adaptado para dejar partes de su hábitat sin tocar.


      El calendario manda. La época de parto y cría va de febrero a julio y, para algunas especies, a agosto;
      de mayo a mediados de junio las cabañas turísticas de Rondane cierran para reducir molestias al reno, y
      en esas semanas las condiciones de esquí y senderismo son además malas, así que el gestor sugiere elegir
      los pueblos de los alrededores. Los meses más recomendados para ir van de junio a septiembre. Entre los
      peces figuran la trucha y el salvelino.
    visit: >-
      Hay caminatas cortas y travesías de varios días por senderos señalizados que reducen el impacto sobre la
      naturaleza. La cumbre de Formokampen se alcanza en unas cuatro horas ida y vuelta; la ruta mide nueve
      kilómetros desde Putten Seter o trece desde Høvringen, con vistas de cuatro parques nacionales y trampas
      de reno antiguas. En la cima hay una placa para identificar las montañas del entorno, y la subida es
      fácil pero constante. Para cuatro días, el circuito triangular por Rondvassbu, Dørålseter y Bjørnhollia
      recorre 60,5 kilómetros alrededor de la mayor cadena continua del parque. Hay diez picos de más de 2.000
      m, y la mitad se alcanzan por senderos marcados con T.


      Las puertas de entrada son varias. Strømbu, en el valle de Atndalen, es la entrada principal desde el
      este, y de allí un sendero lleva a Bjørnhollia en unas dos horas y a Rondvassbu en unas seis. Mysuseter
      es una aldea de montaña tradicional y una entrada popular en verano y en invierno, con una caminata al
      salto de agua El Velo de Novia; el nombre viene de mysu, el suero que sale al hacer queso. En
      Fjellportalen, en Hjerkinn, se aprende sobre el reno con una exposición, cuestionarios y un esqueleto
      real. En invierno hay recorridos sobre nieve con pistas balizadas y otras preparadas a máquina: mejor
      esquís de montaña en las balizadas y bastan esquís estrechos en las preparadas.
    history: >-
      Rondane guarda siglos de caza de reno. Hay grandes trampas en Gravhø y Bløyvangen y por todo el parque,
      huellas de puestos de caza y fosos trampa, algunas de dos o tres mil años. Los monumentos culturales
      están protegidos: no se pueden mover piedras ni hacer mojones nuevos. En Grimsdalen se practica la
      ganadería estival de montaña desde el siglo dieciséis, y Grimsdalen, Mysuseter, Frydalen y Høvringen son
      antiguas aldeas de pastoreo de verano.


      Después llegaron los visitantes. Desde mediados del siglo diecinueve visitaron Rondane artistas; la obra
      más famosa es «Noche de invierno en Rondane», de Harald Sohlberg, de 1914, y en Sohlbergplassen, en
      Atndalen, puedes ponerte en el punto exacto donde la pintó. El Rondeslottet se escaló por primera vez en
      1875.
    before: >-
      Hay normas claras. Entre el 1 de marzo y el 20 de agosto todos los perros van con correa. No se permiten
      drones en el parque nacional, y en bicicleta normal no se puede circular salvo excepciones. Hay poca
      agua para rellenar la cantimplora y el tiempo cambia muy rápido. La afluencia es media alrededor del
      refugio de Rondvassbu.
    around: >-
      A veinte kilómetros está el [Parque Nacional de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) y a veinticinco kilómetros
      el [Parque Nacional de Reinheimen](/lugar/reinheimen-national-park/).
  en:
    intro: >-
      Rondane was born from local grassroots initiative rather than central government decree. In the
      mid-fifties, a mountain warden from Otta, Norman Heitkøtter, recognized that growing visitor numbers
      would pose the gravest threat to wild reindeer herds, successfully advocating for the protection of the
      massif. On 21 December 1962, Norway's very first national park was established; today it spans 963 km²
      of rounded massifs, deeply gouged valleys and ten peaks exceeding 2,000 m.
    landscape: >-
      Rondane's topography was sculpted during the last glacial epoch. Subglacial abrasion hollowed out
      rounded U-shaped troughs, while roaring meltwater torrents carved jagged V-shaped defiles. As the ice
      sheet vanished, the highest peaks emerged, revealing sandstone beds hundreds of millions of years old.
      Today no active glaciers persist: winter snowfall is modest and summers have mellowed. Yet glacial
      imprints endure everywhere, visible as dead-ice kettle holes and undulating gravel eskers.


      The massif boasts ten peaks rising above 2,000 m, crowned by Rondeslottet at 2,178 m. Across high
      summits, sprawling blockfields of coarse scree rank among the park's most demanding terrain; yet
      descending into peripheral valleys reveals gentle green basins and far friendlier walking terrain. Lake
      Rondvatnet occupies the central hollow, from whose shores every peak over 2,000 m can be tackled within
      a single day's hike. The tree line sits around 1,000-1,100 m; above it, harsh conditions prevail, with
      nutrient-poor ground carpets of dwarf birch, heather and pale reindeer lichens.
    wildlife: >-
      The undisputed monarch of these mountains is the [wild reindeer](/especie/rangifer_tarandus/). One of
      the last genetically pristine wild reindeer populations in Europe roams here, having traversed these
      heights for over 10,000 years. Superbly adapted to the subarctic climate, reindeer remain acutely
      sensitive to human disturbance, fleeing across vast distances when alarmed. Today the Rondane herd is
      fragmented into three sub-populations by human corridors; trailheads, summer paths and winter ski tracks
      have been relocated to safeguard undisturbed core sanctuaries.


      The seasonal calendar dictates travel. Calving and nursery periods run from February through July,
      extending for some herds into August; from May to mid-June, DNT tourist lodges close to shield cows and
      newborn calves from disturbance. Hiking and skiing conditions are also poor during spring thaw,
      prompting rangers to recommend lower gateway valleys. The most rewarding months run from June to
      September. Mountain streams and lakes support native brown trout and Arctic char.
    visit: >-
      Rondane offers day outings and multi-day hut-to-hut circuits along signposted paths designed to
      concentrate visitor footfall. The summit of Formokampen can be climbed in about four hours return; the
      trail covers nine kilometres from Putten Seter or thirteen from Høvringen, taking in panoramas of four
      national parks and ancient reindeer pitfall traps. A summit sighting dial identifies surrounding peaks
      along an easy yet steady ascent. For a classic four-day expedition, the triangular trek connecting
      Rondvassbu, Dørålseter and Bjørnhollia spans 60.5 kilometres around the largest continuous mountain
      mass. Five of the ten peaks over 2,000 m are accessible via T-marked routes.


      Several gateway settlements serve the park. Strømbu in the Atndalen valley is the eastern gateway, from
      where footpaths lead to Bjørnhollia in two hours and Rondvassbu in six. Mysuseter is a traditional
      summer hamlet serving as a popular summer and winter portal, with walks to the Bridal Veil waterfall;
      the name derives from *mysu*, the whey from traditional cheesemaking. At Fjellportalen in Hjerkinn,
      interactive displays, quizzes and a complete reindeer skeleton illustrate the species' biology. Winter
      trail networks feature machine-groomed tracks alongside waymarked backcountry routes.
    history: >-
      Centuries of reindeer hunting have etched Rondane's history. Massive pitfall trapping systems survive at
      Gravhø, Bløyvangen and throughout the passes, with stone-walled drive blinds and hunting blinds dating
      back two or three thousand years. Cultural monuments are strictly protected: moving stones or building
      new cairns is illegal. In Grimsdalen, seasonal transhumance (*seterdrift*) has been maintained since the
      sixteenth century; Grimsdalen, Mysuseter, Frydalen and Høvringen were historically summer dairy hamlets.


      Later came artists. Landscape painters discovered Rondane in the nineteenth century; Harald Sohlberg
      created his masterpiece 'Winter Night in the Mountains' in 1914, and you can stand at the exact
      viewpoint at Sohlbergplassen in Atndalen. Rondeslottet was first summited in 1875.
    before: >-
      Clear rules safeguard the massif. Dogs must be kept on a leash between 1 March and 20 August. Operating
      drones is prohibited, and cycling is banned off designated roads. Surface water can be scarce in high
      screes and mountain weather changes rapidly. Visitor numbers are moderate around Rondvassbu lodge.
    around: >-
      Twenty kilometres away lies [Dovrefjell-Sunndalsfjella National
      Park](/lugar/dovrefjell-sunndalsfjella-national-park/) and twenty-five kilometres away is [Reinheimen
      National Park](/lugar/reinheimen-national-park/).
  fr:
    intro: >-
      Rondane est né d'une initiative locale plutôt que d'une décision ministérielle. Au milieu des années
      cinquante, un garde montagnard d'Otta, Norman Heitkøtter, comprit que l'afflux touristique constituerait
      la pire menace pour le renne sauvage et engagea une campagne de sauvegarde. Le 21 décembre 1962 voyait
      le jour le tout premier parc national de Norvège ; il protège aujourd'hui 963 km² de massifs arrondis,
      de vallées encaissées et dix sommets s'élevant à plus de 2 000 m.
    landscape: >-
      Le relief de Rondane porte l'empreinte de la dernière glaciation. Les langues glaciaires ont modelé de
      profondes vallées en U, tandis que les torrents sous-glaciaires ont creusé des gorges en V. Lors du
      retrait des glaces, les plus hauts sommets émergèrent, découvrant des grès sédimentaires vieux de
      plusieurs centaines de millions d'années. Aucun glacier actif ne subsiste aujourd'hui : les chutes de
      neige hivernales sont modérées et les étés plus doux. Mais les modelés glaciaires abondent, tels les
      kettles et les eskers sinueux.


      Le massif réunit dix sommets dépassant 2 000 m, culminant au Rondeslottet à 2 178 m. Dans les hautes
      combes, les pierriers de quartzite comptent parmi les terrains les plus rudes du parc ; il suffit
      toutefois de descendre vers les périphéries pour trouver des vallées verdoyantes et un terrain beaucoup
      plus accueillant. Au cœur du massif s'étend le lac Rondvatnet, d'où chaque cime de 2 000 m peut être
      gravie en moins d'une journée de marche. La limite forestière se situe vers 1 000-1 100 m ; au-delà, les
      bouleaux tortueux cèdent la place à des landes de bruyères et d'épais tapis de lichens des rennes.
    wildlife: >-
      L'animal roi de ces montagnes est le [renne sauvage](/especie/rangifer_tarandus/). L'une des dernières
      hardes de souche génétique pure en Europe vit ici, parcourant ces hauts plateaux depuis plus de 10 000
      ans. Bien adapté au froid arctique, le renne s'avère particulièrement vulnérable au dérangement humain.
      Très farouche, il fuit au loin à la moindre alerte. La harde de Rondane se trouve aujourd'hui scindée en
      trois unités par les voies de communication ; les itinéraires pédestres et pistes de ski ont été
      réaménagés pour préserver leurs zones vitales.


      Le calendrier saisonnier rythme la fréquentation. La période de mise bas et d'élevage des faons s'étend
      de février à juillet, voire août ; de mai à la mi-juin, les refuges de la DNT ferment afin de garantir
      la quiétude des mères, période où les conditions nivologiques sont par ailleurs mauvaises. La meilleure
      saison de randonnée s'étend de juin à septembre. Les torrents abritent la truite fario et l'omble
      chevalier.
    visit: >-
      Rondane propose des randonnées à la journée et des traversées de refuge en refuge le long d'itinéraires
      balisés. Le sommet de Formokampen s'atteint en environ quatre heures aller-retour ; le sentier fait neuf
      kilomètres depuis Putten Seter ou treize depuis Høvringen, offrant une vue sur quatre parcs nationaux et
      d'anciennes fosses à rennes. Une table d'orientation orne le sommet, accessible par une pente régulière.
      Pour un circuit de quatre jours, la boucle reliant Rondvassbu, Dørålseter et Bjørnhollia totalise 60,5
      kilomètres autour du principal massif. Cinq des dix sommets de plus de 2 000 m sont accessibles par des
      sentiers balisés en T.


      Plusieurs bourgs servent d'accès. Strømbu dans la vallée d'Atndalen constitue la porte orientale, d'où
      un sentier gagne Bjørnhollia en deux heures et Rondvassbu en six. Mysuseter est un hameau d'alpage
      réputé en été et en hiver, point de départ vers la cascade du Voile de la Mariée ; le toponyme dérive de
      *mysu*, le petit-lait des fromageries. À Fjellportalen, à Hjerkinn, une muséographie présente la harde
      de rennes avec un squelette complet. En hiver, les pistes jalonnées et tracées s'ouvrent au ski
      nordique.
    history: >-
      Rondane conserve les vestiges de millénaires de chasse au renne. De spectaculaires systèmes de piégeage
      subsistent à Gravhø et Bløyvangen, avec des fosses d'affût et des pièges en pierre vieux de deux à trois
      mille ans. Les vestiges archéologiques sont protégés : il est interdit de déplacer des pierres ou
      d'ériger de nouveaux cairns. Dans la vallée de Grimsdalen, l'estive pastorale (*seterdrift*) perdure
      depuis le seizième siècle ; Grimsdalen, Mysuseter, Frydalen et Høvringen étaient d'anciens hameaux
      laitiers d'altitude.


      Puis vinrent les artistes au dix-neuvième siècle ; Harald Sohlberg y peignit sa célèbre toile « Nuit
      d'hiver dans les montagnes » en 1914, dont on peut contempler le panorama exact depuis Sohlbergplassen à
      Atndalen. Le Rondeslottet fut gravi pour la première fois en 1875.
    before: >-
      Des règles précises encadrent les visites. Du 1er mars au 20 août, les chiens doivent impérativement
      être tenus en laisse. Les drones sont formellement interdits dans le parc et le vélo n'est autorisé que
      sur quelques voies carrossables. Les points d'eau potable sont rares sur les pierriers et la météo varie
      brusquement. La fréquentation est moyenne autour du refuge de Rondvassbu.
    around: >-
      À vingt kilomètres s'étend le [parc national de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) et à vingt-cinq kilomètres
      le [parc national de Reinheimen](/lugar/reinheimen-national-park/).
  de:
    intro: >-
      Rondane verdankt sein Bestehen einer regionalen Bürgerinitiative. Mitte der fünfziger Jahre erkannte
      Norman Heitkøtter, ein Gebirgsaufseher aus Otta, dass der zunehmende Tourismus die größte Bedrohung für
      das wilde Rentier darstellen würde, und setzte sich für den Schutz des Massivs ein. Am 21. Dezember 1962
      wurde Norwegens erster Nationalpark gegründet; heute schützt er 963 km² weitläufiger Bergrücken,
      eiszeitlicher Täler und zehn Gipfel von über 2.000 m Höhe.
    landscape: >-
      Die Landschaft von Rondane wurde von den Gletschern der letzten Eiszeit gemeißelt. Das Eis schliff
      Trogtäler aus, während Schmelzwasserströme tiefe Kerbtäler einschnitten. Als das Eis schmolz, ragten die
      höchsten Massive heraus und legten Hunderte Millionen Jahre alte Sandsteinschichten frei. Heute gibt es
      keine aktiven Gletscher mehr: Im Winter schneit es mäßig und die Sommer sind milder geworden. Zahlreiche
      eiszeitliche Spuren wie Toteislöcher und Oser zeugen von der Vergangenheit.


      Das Massiv zählt zehn Gipfel jenseits der 2.000 m, gekrönt vom Rondeslottet mit 2.178 m. Auf den
      Höhenkämmen gehören ausgedehnte Blockmeere zum anspruchsvollsten Gelände des Parks; steigt man jedoch in
      die Randtäler ab, weichen die Geröllhalden sanften Tälern. Im Zentrum liegt der See Rondvatnet, von dem
      aus jeder Gipfel über 2.000 m innerhalb einer Tageswanderung bestiegen werden kann. Die Waldgrenze
      verläuft bei 1.000-1.100 m; darüber wachsen Zwergbirken, Heidekraut und weite Polster weißer
      Rentierflechten.
    wildlife: >-
      Das Wahrzeichen des Parks ist das [wilde Rentier](/especie/rangifer_tarandus/). Eine der letzten
      ursprünglichen Wildrentierpopulationen Europas zieht hier seit über 10.000 Jahren über die Hochebenen.
      Bestens an das arktische Klima angepasst, reagieren die Tiere äußerst empfindlich auf menschliche
      Störungen und flüchten bei Beunruhigung weit. Heute ist der Bestand durch Verkehrswege in drei
      Teilpopulationen gegliedert; Wanderpfade und Skirouten wurden verlegt, um unberührte Kernzonen
      freizuhalten.


      Der Jahreszyklus setzt die Rahmenbedingungen. Die Kalbungs- und Aufzuchtzeit reicht von Februar bis
      Juli; von Mai bis Mitte Juni schließen die DNT-Hütten, um Störungen der Muttertiere zu vermeiden. Auch
      die Tourenverhältnisse sind im Frühjahr schlecht. Die beste Wanderzeit umfasst die Monate Juni bis
      September. In den Gebirgsseen leben Bachforelle und Seesaibling.
    visit: >-
      Rondane bietet Tagestouren sowie Mehrtageswanderungen auf T-markierten Wegen. Der Gipfel des Formokampen
      lässt sich in vier Stunden Gehzeit besteigen; der Weg misst neun Kilometer ab Putten Seter oder dreizehn
      ab Høvringen und bietet Rundblicke über vier Nationalparks sowie historische Fanggruben. Eine
      Panoramatafel auf dem Gipfel benennt die umliegenden Berge. Für vier Tage empfiehlt sich die
      Dreieckstour über Rondvassbu, Dørålseter und Bjørnhollia über 60,5 Kilometer. Fünf der zehn Gipfel über
      2.000 m sind über markierte Bergsteige erreichbar.


      Ausgangsorte gibt es mehrere. Strømbu im Tal Atndalen bildet das östliche Portal, von dem Bergwege in
      zwei Stunden nach Bjørnhollia und in sechs nach Rondvassbu führen. Mysuseter ist ein traditionelles
      Almdorf und beliebtes Sommer- wie Winterportal mit Wegen zum Brautschleier-Wasserfall; der Name leitet
      sich von *mysu* ab, der Molke aus der Käseherstellung. Im Informationszentrum Fjellportalen in Hjerkinn
      vermitteln Ausstellungen und ein echtes Rentierskelett Wissenswertes zur Art. Im Winter stehen gespurte
      Loipen und markierte Skirouten bereit.
    history: >-
      Jahrhundertealte Rentierjagd prägt Rondane. Große Fangtrichteranlagen in Gravhø und Bløyvangen sowie
      Jagdunterstände datieren zwei- bis dreitausend Jahre zurück. Kulturdenkmäler stehen unter absolutem
      Schutz: Steine dürfen nicht bewegt und keine neuen Steinmännchen errichtet werden. Im Grimsdalen wird
      seit dem sechzehnten Jahrhundert Almwirtschaft betrieben; Grimsdalen, Mysuseter, Frydalen und Høvringen
      sind historische Almweiler.


      Im neunzehnten Jahrhundert entdeckten Maler das Gebirge; Harald Sohlberg schuf 1914 sein Meisterwerk
      'Winternacht in Rondane', dessen Aussichtspunkt Sohlbergplassen im Atndalen noch heute besucht werden
      kann. Der Rondeslottet wurde 1875 erstmals bestiegen.
    before: >-
      Vom 1. März bis zum 20. August gilt strikte Leinenpflicht für Hunde. Drohnen sind verboten und Radfahren
      ist nur auf wenigen Straßen gestattet. Trinkwasser ist auf den Blockmeeren rar und das Wetter schlägt
      schnell um. Rund um Rondvassbu herrscht im Sommer mäßiger Andrang.
    around: >-
      Zwanzig Kilometer entfernt liegt der [Nationalpark
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) und fünfundzwanzig Kilometer
      entfernt der [Nationalpark Reinheimen](/lugar/reinheimen-national-park/).
  it:
    intro: >-
      Rondane nacque dall'iniziativa della popolazione locale piuttosto che da decisioni burocratiche. A metà
      degli anni cinquanta un guardaparco di Otta, Norman Heitkøtter, comprese che l'aumento dei visitatori
      avrebbe costituito la minaccia più letale per la renna selvatica, promuovendo la tutela del massiccio.
      Il 21 dicembre 1962 vide la luce il primo parco nazionale della Norvegia, che oggi tutela 963 km² di
      dorsali arrotondate, vallate glaciali e dieci cime oltre i 2.000 m.
    landscape: >-
      Il paesaggio di Rondane fu modellato dall'ultima glaciazione quaternaria. I ghiacciai scavarono ampie
      valli a U, mentre le acque di fusione incisero gole a V. Con il ritiro dei ghiacci emersero le cime più
      elevate, mettendo a nudo strati di arenaria antichi centinaia di milioni di anni. Oggi non sopravvive
      alcun ghiacciaio attivo: nevica moderatamente in inverno e le estati sono divenute miti. Rimangono però
      vistose tracce glaciali, come laghetti morenici ed esker sabbiosi.


      Il massiccio racchiude dieci vette al di sopra dei 2.000 m, culminanti nei 2.178 m del Rondeslottet.
      Nelle zone sommitali, le vaste pietraie quarzitiche figurano tra i terreni più impegnativi del parco;
      basta tuttavia abbassarsi verso le valli periferiche per incontrare conche pascolive molto più agevoli.
      Al centro giace il lago Rondvatnet, dal quale è possibile raggiungere in meno di una giornata di marcia
      tutte le vette oltre i 2.000 m. Il limite degli alberi si attesta sui 1.000-1.100 m; oltre prosperano
      betulle nane, brughiere e distese di licheni delle renne.
    wildlife: >-
      Il dominatore incontrastato del massiccio è la [renna selvatica](/especie/rangifer_tarandus/). Una delle
      ultime popolazioni originarie d'Europa abita questi altopiani, che percorre da oltre 10.000 anni.
      Perfettamente adattata ai rigori climatici, la renna è vulnerabile al disturbo umano e fugge a grande
      distanza se allarmata. Oggi il nucleo di Rondane è diviso in tre sottopopolazioni a causa delle barriere
      antropiche; per questo motivo sentieri estivi e piste sciistiche sono stati delocalizzati per lasciare
      intatti i santuari riproduttivi.


      Il calendario naturale detta le regole. La stagione dei parti e delle cure parentali va da febbraio a
      luglio; da maggio a metà giugno i rifugi escursionistici DNT chiudono per ridurre il disturbo ai
      branchi, periodo in cui le condizioni di escursionismo sono peraltro sfavorevoli. I mesi migliori per la
      visita vanno da giugno a settembre. Nei laghi montani vivono la trota fario e il salmerino alpino.
    visit: >-
      Rondane propone escursioni giornaliere e trekking di più tappe lungo percorsi segnati. La cima del
      Formokampen si raggiunge in circa quattro ore tra andata e ritorno; il sentiero misura nove chilometri
      da Putten Seter o tredici da Høvringen, offrendo panorami su quattro parchi nazionali e antiche trappole
      per renne. Un disco panoramico sulla vetta illustra le montagne circostanti. Per un trekking di quattro
      giorni, l'anello triangolare tra Rondvassbu, Dørålseter e Bjørnhollia copre 60,5 chilometri attorno alla
      catena principale. Cinque delle dieci vette oltre i 2.000 m si raggiungono tramite sentieri segnati con
      la T.


      I varchi d'accesso sono molteplici. Strømbu nella valle di Atndalen è l'ingresso orientale, da cui si
      sale a Bjørnhollia in due ore e a Rondvassbu in sei. Mysuseter è un antico alpeggio frequentato in
      estate e inverno, con passeggiate verso la cascata del Velo da Sposa; il toponimo deriva da *mysu*, il
      siero residuo della caseificazione. A Fjellportalen, presso Hjerkinn, una mostra con uno scheletro reale
      di renna illustra l'ecologia della specie. In inverno la rete comprende piste tracciate per sci di
      fondo.
    history: >-
      Secoli di caccia alla renna segnano il territorio. Grandi sistemi di buche-trappola a Gravhø e
      Bløyvangen risalgono a due o tremila anni fa. I beni storici sono rigidamente protetti: è vietato
      spostare pietre o costruire nuovi ometti di segnalazione. Nella valle di Grimsdalen l'alpeggio estivo
      (*seterdrift*) è documentato dal sedicesimo secolo; Grimsdalen, Mysuseter, Frydalen e Høvringen erano
      storici insediamenti d'alpeggio.


      Nell'Ottocento giunsero i pittori; Harald Sohlberg dipinse qui nel 1914 il suo capolavoro 'Notte
      d'inverno a Rondane', il cui celebre punto di vista a Sohlbergplassen è visitabile nella valle di
      Atndalen. Il Rondeslottet fu scalato per la prima volta nel 1875.
    before: >-
      Vigono precise disposizioni di tutela. Dal 1° marzo al 20 agosto i cani vanno condotti al guinzaglio. È
      vietato l'uso di droni e il transito in bicicletta sui sentieri pedonali. I punti d'acqua sono rari
      sulle pietraie e il meteo cambia repentinamente. L'affluenza è media nei pressi del rifugio Rondvassbu.
    around: >-
      A venti chilometri si trova il [Parco nazionale di
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) e a venticinque chilometri
      il [Parco nazionale di Reinheimen](/lugar/reinheimen-national-park/).
  pt:
    intro: >-
      Rondane nasceu da determinação da comunidade local e não de despachos governamentais. Em meados dos anos
      cinquenta, um guarda de montanha de Otta, Norman Heitkøtter, alertou que o afluxo crescente de
      forasteiros representaria a maior ameaça para as renas selvagens, promovendo a salvaguarda do maciço. A
      21 de dezembro de 1962 foi criado o primeiro parque nacional da Noruega, protegendo atualmente 963 km²
      de cristas arredondadas, vales profundos e dez cumes com mais de 2.000 m.
    landscape: >-
      A orografia de Rondane foi talhada pela derradeira época glaciar. O atrito sob o manto de gelo escavou
      vales em U, enquanto torrentes subglaciares rasgaram desfiladeiros em V. Ao derreter o gelo despontaram
      os picos mais elevados, expondo bancadas de arenito com centenas de milhões de anos. Não restam geleiras
      ativas nos dias de hoje: as nevadas de inverno são moderadas e os verões tornaram-se mais amenos.
      Subsistem modelados glaciares singulares, como covas de gelo fóssil e moreias fluvioglaciares
      (*eskers*).


      O maciço congrega dez picos acima dos 2.000 m, destacando-se o Rondeslottet a 2.178 m. Nas cotas
      superiores, as vastas cascalheiras constituem dos terrenos mais exigentes do parque; contudo, basta
      descer às imediações para encontrar vales verdejantes bem mais acessíveis. No centro repousa o lago
      Rondvatnet, de onde é possível ascender em menos de uma jornada a todos os cumes de 2.000 m. O limite
      florestal situa-se por volta dos 1.000-1.100 m; acima dele a charneca é dominada por bétula-anã, urzes e
      tapetes esbranquiçados de líquenes das renas.
    wildlife: >-
      A grande figura das montanhas é a [rena selvagem](/especie/rangifer_tarandus/). Uma das últimas
      populações geneticamente puras da Europa habita aqui, deambulando por estes planaltos há mais de 10.000
      anos. Adaptada aos rigores gélidos, a rena é vulnerável à perturbação humana e debanda para longe ao
      menor sobressalto. A manada de Rondane encontra-se fragmentada em três núcleos devido a infraestruturas
      viárias; por essa razão, trilhos pedestres e circuitos de esqui foram adaptados para resguardar refúgios
      tranquilos.


      O ciclo biológico comanda o ritmo de visita. A época de partos e amamentação estende-se de fevereiro a
      julho; de maio a meados de junho os refúgios da DNT fecham portas para atenuar perturbações às fêmeas,
      coincidindo com mau estado da neve para esqui e pedestrianismo. O período mais recomendável vai de junho
      a setembro. Nos lagos de altitude ocorrem a truta e o salvelino-ártico.
    visit: >-
      Rondane oferece percursos curtos e travessias pedestres de refúgio em refúgio devidamente balizadas. A
      ascensão a Formokampen realiza-se em quatro horas de marcha; o percurso tem nove quilómetros a partir de
      Putten Seter ou treze desde Høvringen, oferecendo vistas de quatro parques nacionais e armadilhas
      ancestrais de caça à rena. No cimo existe uma placa indicativa dos relevos circundantes. Para uma
      aventura de quatro dias, o circuito triangular entre Rondvassbu, Dørålseter e Bjørnhollia estende-se por
      60,5 quilómetros em redor da cadeia principal. Cinco dos dez picos de 2.000 m são acessíveis por
      percursos marcados com T.


      Várias povoações funcionam como acesso. Strømbu, no vale de Atndalen, constitui a entrada oriental, com
      trilhos para Bjørnhollia em duas horas e para Rondvassbu em seis. Mysuseter é uma aldeia serrana
      tradicional e um acesso muito procurado em todas as estações, com passeios à cascata Véu de Noiva; o
      nome provém de *mysu*, o soro da confeção de queijo. Em Fjellportalen, em Hjerkinn, descobre-se a vida
      da rena com exposições interativas e um esqueleto real. No inverno abrem-se pistas balizadas para esqui
      de travessia.
    history: >-
      Milénios de caça à rena marcaram Rondane. Encontram-se grandes fossas de captura em Gravhø e Bløyvangen
      e por todo o parque, com vestígios de abrigos de caça datados de dois ou três mil anos. O património
      arqueológico está protegido: é interdito mover pedras ou empilhar novos marcos. No vale de Grimsdalen a
      transumância estival de gado (*seterdrift*) pratica-se desde o século dezasseis; Grimsdalen, Mysuseter,
      Frydalen e Høvringen foram povoados sazonais de pastores.


      No século dezanove chegaram pintores de paisagem; Harald Sohlberg concebeu a célebre tela 'Noite de
      Inverno em Rondane' em 1914, podendo contemplar-se a perspetiva exata no miradouro de Sohlbergplassen em
      Atndalen. O Rondeslottet foi escalado pela primeira vez em 1875.
    before: >-
      Cumpre as normas de proteção. Entre 1 de março e 20 de agosto todos os cães devem circular com trela.
      Não são permitidos drones e a circulação de bicicletas nos trilhos está interdita. As nascentes de água
      são escassas nas cascalheiras e as condições atmosféricas mudam com rapidez. A afluência é média nas
      imediações do refúgio de Rondvassbu.
    around: >-
      A vinte quilómetros situa-se o [Parque Nacional de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) e a vinte e cinco
      quilómetros o [Parque Nacional de Reinheimen](/lugar/reinheimen-national-park/).
