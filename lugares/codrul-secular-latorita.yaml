unico:
  es: >-
    Un rodal de alerce europeo de ejemplares longevos, pequeño y distinto del gran espacio Natura 2000 que lo
    rodea.
  en: >-
    A stand of long-lived European larch trees, small and distinct from the large Natura 2000 site surrounding
    it.
  fr: Un peuplement de mélèzes séculaires, petit et distinct du vaste site Natura 2000 qui l'entoure.
  de: >-
    Ein Bestand langlebiger Europäischer Lärchen, klein und eigenständig innerhalb des umgebenden großen
    Natura-2000-Gebiets.
  it: Un popolamento di larici europei longevi, piccolo e distinto dal vasto sito Natura 2000 che lo circonda.
  pt: >-
    Um maciço de lariços europeus de grande longevidade, pequeno e distinto do extenso sítio Natura 2000 que o
    envolve.
observaciones:
  es: >-
    El plan prohíbe arrojar residuos al agua y consolidar u hormigonar las orillas del Latorița y sus
    afluentes sin autorización del custodio. El rodal pertenece a la unidad forestal II Latorița, a cargo del
    Ocolul Silvic Voineasa, y es ese organismo y la administración ambiental quienes pueden confirmar el
    acceso.
texto:
  es:
    intro: >-
      Aquí el protagonista es un árbol, el alerce europeo, y hay un rodal entero. Pădurea Latorița protege un
      bosque de alerce europeo en la vertiente norte de Culmea Târnovului, en el noroeste de los montes
      Căpățânii, junto al valle del Latorița, en el condado de Vâlcea. Su interés es forestal: la descripción
      provincial destaca los ejemplares longevos de alerce, y la ley de marzo de 2000 lo declaró área
      protegida.
    landscape: >-
      La reserva se extiende aproximadamente entre ochocientos y mil trescientos cincuenta metros de altitud,
      en la parte nororiental del espacio Natura 2000 Târnovu Mare–Latorița. Ese espacio, mucho más amplio que
      el rodal, pertenece al dominio del manto tectónico gético: el cabalgamiento carpático y la erosión
      dejaron al descubierto formaciones del autóctono danubiano, y las calizas jurásicas del entorno
      sostienen pastos calcícolas, roquedos y canchales. El clima es de montaña y lluvioso, con precipitación
      durante todo el año.


      La vegetación forestal del valle incluye bosques antiguos de pícea y alerce. En el conjunto Natura hay
      bosques montanos de alerce y pinares de cembro como tipo de hábitat, y también bosques montanos
      acidófilos de pícea. Entre la flora rara se citan el alerce, la flor de colț (edelweiss), el rododendro,
      la angélica y la campánula serrada. Para la reserva se mencionan además Centaurea coziensis y Thymus
      comosus.
    wildlife: >-
      Los datos de fauna son del espacio Natura que la rodea, no del rodal. En él se registra el [águila
      real](/especie/aquila_chrysaetos/) en Piatra Târnovului, con reproducción probable, y el [busardo
      ratonero](/especie/buteo_buteo/) se puede ver todo el año. El [urogallo](/especie/tetrao_urogallus/) es
      raro y difícil de observar en los bosques de pícea, el [cárabo uralense](/especie/strix_uralensis/) cría
      con frecuencia y el [lince](/especie/lynx_lynx/) se registra en bosques mixtos de haya y pícea y en
      roquedos.


      Hay una escena de primavera: entre mediados de abril y comienzos de mayo, las hayas del ámbito del plan
      despliegan las hojas.
    visit: >-
      No hay aquí una ruta señalizada al rodal. La descripción provincial menciona una senda sin marcar que
      sale de Ciunget hacia Dealul Vătăjelul Mare, Șaua cu Larice, Izvorul Mierlei y Culmea Târnovului, pero
      no acredita autorización vigente ni condiciones de uso, así que antes de intentarla pregunta a la
      administración ambiental y forestal.


      Para llegar al conjunto Natura, el acceso se desvía de la carretera Brezoi–Petroșani hacia el valle del
      Latorița y pasa por Ciunget. El plan señala entradas desde el suroeste de Ciunget por Valea Satului y
      desde el valle de Repedea, al sur. Las vías del entorno conectan con Vaideeni, centro tradicional de
      pastoreo estival en Căpățânii.
    history: >-
      La reserva está identificada como área protegida nacional de categoría IV de la UICN, con el código
      2.805. Su superficie cambia según el documento: la ley y el plan ministerial recogen 7,1 hectáreas, el
      documento provincial 23,3 y el registro europeo casi veintitrés, de modo que no hay un límite
      definitivo.


      El plan recoge talas rasas antiguas y plantaciones en los alercedos del espacio Natura. Entre las
      presiones identifica las molestias de los vehículos motorizados en las pistas, que afectan a hábitats y
      fauna. El cembro que citaba la bibliografía no lo encontraron los autores del plan.
    before: >-
      El plan prohíbe arrojar residuos al agua y consolidar u hormigonar las orillas del Latorița y sus
      afluentes sin autorización del custodio. El rodal pertenece a la unidad forestal II Latorița, a cargo
      del Ocolul Silvic Voineasa, y es ese organismo y la administración ambiental quienes pueden confirmar el
      acceso.
    around: >-
      A catorce kilómetros están las [Montañas de Parâng](/lugar/muntii-parang/), a dieciocho el [Parque
      Nacional Buila-Vânturarița - Garganta del Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/)
      y el [Parque Natural de Cindrel](/lugar/parcul-natural-cindrel/), y a veintidós el [Desfiladero del Río
      Olt](/lugar/defileul-oltului/) y el [Parque Nacional Cozia - Bosques
      Primarios](/lugar/parcul-national-cozia---codrii-seculari/).


      Más lejos, el [Parque Nacional Bucegi - Ladera
      Occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) comparte la flor de colț y la
      Daphne blagayana.
  en:
    intro: >-
      The protagonist here is a tree, the European larch, and there is an entire stand of them. Pădurea
      Latorița protects a European larch forest on the northern slope of Culmea Târnovului, in the northwest
      of the Căpățânii Mountains, beside the Latorița valley in Vâlcea County. Its interest is silvicultural:
      the county description highlights the long-lived larch specimens, and the law of March 2000 declared it
      a protected area.
    landscape: >-
      The reserve extends at roughly eight hundred to thirteen hundred and fifty metres altitude, in the
      northeastern part of the Natura 2000 site Târnovu Mare–Latorița. That much larger site belongs to the
      domain of the Getic tectonic nappe: Carpathian overthrusting and erosion have exposed Danubian
      autochthon formations, and Jurassic limestones in the surroundings support calcareous grasslands, rocky
      outcrops and screes. The climate is mountain-type and rainy, with precipitation throughout the year.


      The valley's forest vegetation includes ancient spruce and larch forests. Within the broader Natura
      site, montane larch and arolla pine forests occur as a habitat type, alongside montane acidophilous
      spruce forests. Among the rare flora cited are larch, edelweiss (*floare de colț*), rhododendron,
      angelica and serrated bellflower. For the reserve itself, *Centaurea coziensis* and *Thymus comosus* are
      also mentioned.
    wildlife: >-
      The wildlife data relate to the surrounding Natura site rather than to the stand itself. Within it, the
      [golden eagle](/especie/aquila_chrysaetos/) has been recorded at Piatra Târnovului with probable
      breeding, and the [common buzzard](/especie/buteo_buteo/) can be seen year-round. The [western
      capercaillie](/especie/tetrao_urogallus/) is rare and hard to spot in the spruce forests, the [Ural
      owl](/especie/strix_uralensis/) breeds regularly, and the [Eurasian lynx](/especie/lynx_lynx/) is
      recorded in mixed beech–spruce forest and rocky terrain.


      There is a spring spectacle: between mid-April and early May, the beeches across the plan area unfurl
      their leaves.
    visit: >-
      There is no waymarked route to the stand. The county description mentions an unmarked path leaving
      Ciunget towards Dealul Vătăjelul Mare, Șaua cu Larice, Izvorul Mierlei and Culmea Târnovului, but it
      does not confirm current authorisation or access conditions; before attempting it, check with the
      environmental and forestry administration.


      To reach the broader Natura site, turn off the Brezoi–Petroșani road into the Latorița valley and pass
      through Ciunget. The plan identifies entry points from southwest of Ciunget along Valea Satului and from
      the Repedea valley to the south. Nearby roads connect to Vaideeni, a traditional summer pasturing centre
      in the Căpățânii range.
    history: >-
      The reserve is classified as a national protected area under IUCN Category IV, with the code 2,805. Its
      area varies between documents: the law and the ministerial plan record 7.1 hectares, the county document
      gives 23.3 and the European register almost twenty-three, so there is no definitive boundary.


      The plan records old clear-cuts and plantations in the larch stands within the Natura site. Among the
      pressures identified are disturbances from motorised vehicles on the tracks, affecting habitats and
      fauna. The arolla pine mentioned in earlier literature was not found by the plan's authors.
    before: >-
      The plan prohibits dumping waste in watercourses and consolidating or concreting the banks of the
      Latorița and its tributaries without the custodian's authorisation. The stand belongs to forestry unit
      II Latorița, managed by Ocolul Silvic Voineasa, and it is that body and the environmental administration
      that can confirm access.
    around: >-
      Fourteen kilometres away are the [Parâng Mountains](/lugar/muntii-parang/), eighteen kilometres from the
      [Buila-Vânturarița National Park — Bistrița Gorge](/lugar/parcul-national-buila-vanturarita---cheile/)
      and the [Cindrel Nature Park](/lugar/parcul-natural-cindrel/), and twenty-two kilometres from the [Olt
      River Gorge](/lugar/defileul-oltului/) and [Cozia National Park — Secular
      Forests](/lugar/parcul-national-cozia---codrii-seculari/).


      Further away, [Bucegi National Park — Western
      Slopes](/lugar/parcul-national-bucegi---vertientes-occidentales/) shares the edelweiss and *Daphne
      blagayana*.
  fr:
    intro: >-
      Le protagoniste est un arbre, le mélèze d'Europe, et c'est tout un peuplement qui est ici protégé.
      Pădurea Latorița abrite une forêt de mélèzes européens sur le versant nord de la Culmea Târnovului, dans
      le nord-ouest des monts Căpățânii, au bord du Latorița, dans le județ de Vâlcea. L'intérêt est sylvicole
      : la description provinciale met en avant des mélèzes d'âge vénérable, et la loi de mars 2000 en a fait
      une zone protégée.
    landscape: >-
      La réserve s'étend à une altitude approximative de huit cents à mille trois cent cinquante mètres, dans
      la partie nord-est du site Natura 2000 Târnovu Mare–Latorița. Ce périmètre beaucoup plus vaste relève du
      domaine de la nappe tectonique gétique : le chevauchement carpatique et l'érosion ont mis à nu les
      formations de l'autochtone danubien, et les calcaires jurassiques des environs accueillent des pelouses
      calcicoles, des escarpements et des éboulis. Le climat est montagnard et pluvieux, avec des
      précipitations tout au long de l'année.


      La végétation forestière de la vallée comprend d'anciennes pessières et mélézins. Dans le site Natura
      élargi, les forêts montagnardes de mélèze et d'arolle constituent un type d'habitat, aux côtés des
      pessières montagnardes acidiphiles. Parmi les plantes rares citées figurent le mélèze, l'edelweiss
      (*floare de colț*), le rhododendron, l'angélique et la campanule serrulée. Pour la réserve elle-même,
      *Centaurea coziensis* et *Thymus comosus* sont également mentionnés.
    wildlife: >-
      Les données faunistiques concernent le site Natura environnant plutôt que le peuplement lui-même.
      L'[aigle royal](/especie/aquila_chrysaetos/) y est noté à Piatra Târnovului avec reproduction probable,
      et la [buse variable](/especie/buteo_buteo/) s'observe toute l'année. Le [grand
      tétras](/especie/tetrao_urogallus/) est rare et difficile à observer dans les pessières, la [chouette de
      l'Oural](/especie/strix_uralensis/) niche régulièrement et le [lynx boréal](/especie/lynx_lynx/) est
      signalé dans les forêts mixtes hêtre-épicéa et sur les rochers.


      Il y a un spectacle printanier : entre la mi-avril et le début de mai, les hêtres du périmètre du plan
      déploient leurs feuilles.
    visit: >-
      Il n'existe pas de sentier balisé menant au peuplement. La description provinciale mentionne un chemin
      non balisé partant de Ciunget vers Dealul Vătăjelul Mare, Șaua cu Larice, Izvorul Mierlei et Culmea
      Târnovului, mais ne confirme aucune autorisation ni conditions d'accès en vigueur ; avant de tenter
      l'aventure, renseignez-vous auprès de l'administration environnementale et forestière.


      Pour rejoindre le site Natura, quittez la route Brezoi–Petroșani en direction du Latorița et traversez
      Ciunget. Le plan identifie des points d'entrée au sud-ouest de Ciunget par la Valea Satului et depuis la
      vallée de Repedea au sud. Les routes environnantes mènent à Vaideeni, centre traditionnel d'estivage
      dans les Căpățânii.
    history: >-
      La réserve est classée zone protégée nationale de catégorie IV de l'UICN, avec le code 2 805. Sa
      superficie varie selon les documents : la loi et le plan ministériel indiquent 7,1 hectares, le document
      provincial 23,3 et le registre européen près de vingt-trois, si bien qu'il n'existe pas de limite
      définitive.


      Le plan recense d'anciennes coupes rases et des plantations dans les mélézins du site Natura. Parmi les
      pressions identifiées figurent les nuisances des véhicules motorisés sur les pistes, qui perturbent
      habitats et faune. L'arolle mentionné dans la bibliographie ancienne n'a pas été retrouvé par les
      auteurs du plan.
    before: >-
      Le plan interdit de jeter des déchets dans les cours d'eau et de consolider ou bétonner les berges du
      Latorița et de ses affluents sans autorisation du gardien. Le peuplement appartient à l'unité forestière
      II Latorița, gérée par l'Ocolul Silvic Voineasa, et c'est cet organisme et l'administration
      environnementale qui peuvent confirmer l'accès.
    around: >-
      À quatorze kilomètres se trouvent les [monts Parâng](/lugar/muntii-parang/), à dix-huit le [Parc
      national Buila-Vânturarița — Gorges de la Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/)
      et le [Parc naturel de Cindrel](/lugar/parcul-natural-cindrel/), et à vingt-deux les [Gorges de
      l'Olt](/lugar/defileul-oltului/) et le [Parc national Cozia — Forêts
      primaires](/lugar/parcul-national-cozia---codrii-seculari/).


      Plus loin, le [Parc national Bucegi — Versant
      occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) partage l'edelweiss et le *Daphne
      blagayana*.
  de:
    intro: >-
      Der Protagonist ist ein Baum, die Europäische Lärche, und hier steht ein ganzer Bestand davon. Pădurea
      Latorița schützt einen Lärchenwald am Nordhang der Culmea Târnovului im Nordwesten des
      Căpățânii-Gebirges, am Latorița-Tal im Kreis Vâlcea. Das Interesse gilt dem Forstbestand: Die
      Kreisbeschreibung hebt langlebige Lärchen hervor, und das Gesetz vom März 2000 erklärte das Gebiet zum
      Schutzgebiet.
    landscape: >-
      Das Reservat erstreckt sich in ungefähr acht- bis dreizehnhundertfünfzig Metern Höhe im Nordostteil des
      Natura-2000-Gebiets Târnovu Mare–Latorița. Dieses weitaus größere Gebiet gehört dem Bereich der
      Getischen Decke an: Karpatische Überschiebung und Erosion haben Gesteine des Danubian-Autochthons
      freigelegt, und Jura-Kalke der Umgebung tragen Kalkrasen, Felsrippen und Schutthalden. Das Klima ist
      bergig und niederschlagsreich, mit Regen das ganze Jahr über.


      Die Waldvegetation des Tals umfasst alte Fichten- und Lärchenwälder. Im größeren Natura-Gebiet kommen
      montane Lärchen-Arvenwald-Gesellschaften als Lebensraumtyp vor, neben montanen azidophilen
      Fichtenwäldern. Unter den genannten Seltenheiten sind Lärche, Edelweiß (*floare de colț*), Rhododendron,
      Engelwurz und Zackige Glockenblume. Für das Reservat selbst werden zusätzlich *Centaurea coziensis* und
      *Thymus comosus* erwähnt.
    wildlife: >-
      Die Faunadaten beziehen sich auf das umgebende Natura-Gebiet, nicht auf den Bestand selbst. Dort wurde
      der [Steinadler](/especie/aquila_chrysaetos/) an Piatra Târnovului mit wahrscheinlicher Brut erfasst,
      der [Mäusebussard](/especie/buteo_buteo/) ist das ganze Jahr zu sehen. Das
      [Auerhuhn](/especie/tetrao_urogallus/) ist selten und im Fichtenwald schwer zu beobachten, der
      [Habichtskauz](/especie/strix_uralensis/) brütet regelmäßig, und der [Eurasische
      Luchs](/especie/lynx_lynx/) wird in gemischten Buchen-Fichten-Wäldern und Felsgebieten nachgewiesen.


      Es gibt ein Frühlingsschauspiel: Zwischen Mitte April und Anfang Mai entfalten die Buchen im Planbereich
      ihre Blätter.
    visit: >-
      Es gibt keinen markierten Weg zum Bestand. Die Kreisbeschreibung nennt einen nicht markierten Pfad ab
      Ciunget in Richtung Dealul Vătăjelul Mare, Șaua cu Larice, Izvorul Mierlei und Culmea Târnovului,
      bestätigt aber weder aktuelle Genehmigung noch Nutzungsbedingungen; frage vor dem Versuch bei der
      Umwelt- und Forstbehörde nach.


      Für das größere Natura-Gebiet zweigst du von der Straße Brezoi–Petroșani ins Latorița-Tal ab und fährst
      durch Ciunget. Der Plan nennt Zugänge südwestlich von Ciunget über die Valea Satului und vom Repedea-Tal
      im Süden. Die Umgebungsstraßen verbinden mit Vaideeni, einem traditionellen Sommerweideort im
      Căpățânii-Gebirge.
    history: >-
      Das Reservat ist als nationales Schutzgebiet der IUCN-Kategorie IV mit dem Code 2.805 eingetragen. Die
      Fläche variiert je nach Dokument: Gesetz und Ministerialerlass nennen 7,1 Hektar, die Kreisunterlagen
      23,3 und das europäische Register knapp dreiundzwanzig, sodass es keine endgültige Abgrenzung gibt.


      Der Plan verzeichnet alte Kahlschläge und Aufforstungen in den Lärchenwäldern des Natura-Gebiets. Als
      Druck wird die Störung durch Motorfahrzeuge auf den Forststraßen genannt, die Lebensräume und Fauna
      beeinträchtigt. Die in älterer Literatur erwähnte Arve wurde von den Planverfassern nicht gefunden.
    before: >-
      Der Plan verbietet das Einleiten von Abfällen in Gewässer sowie die Befestigung oder Betonierung der
      Ufer des Latorița und seiner Nebenflüsse ohne Zustimmung des Verwalters. Der Bestand gehört zur
      Forsteinheit II Latorița, die vom Ocolul Silvic Voineasa verwaltet wird; diese Stelle und die
      Umweltbehörde können den Zugang bestätigen.
    around: >-
      Vierzehn Kilometer entfernt liegen die [Parâng-Berge](/lugar/muntii-parang/), achtzehn Kilometer der
      [Nationalpark Buila-Vânturarița — Bistrița-Schlucht](/lugar/parcul-national-buila-vanturarita---cheile/)
      und der [Naturpark Cindrel](/lugar/parcul-natural-cindrel/), zweiundzwanzig Kilometer die
      [Olt-Schlucht](/lugar/defileul-oltului/) und der [Nationalpark Cozia —
      Urwälder](/lugar/parcul-national-cozia---codrii-seculari/).


      Weiter entfernt teilt der [Nationalpark Bucegi —
      Westhang](/lugar/parcul-national-bucegi---vertientes-occidentales/) Edelweiß und *Daphne blagayana*.
  it:
    intro: >-
      Il protagonista è un albero, il larice europeo, e qui c'è un intero popolamento. Pădurea Latorița
      protegge una foresta di larici europei sul versante nord della Culmea Târnovului, nel nordovest dei
      monti Căpățânii, lungo la valle del Latorița nella contea di Vâlcea. L'interesse è silvicolo: la
      descrizione provinciale sottolinea i larici plurisecolari, e la legge del marzo 2000 ne ha fatto un'area
      protetta.
    landscape: >-
      La riserva si estende a quote approssimative comprese tra ottocento e milletrecentocinquanta metri,
      nella parte nordorientale del sito Natura 2000 Târnovu Mare–Latorița. Quest'area molto più estesa
      appartiene al dominio della falda tettonica Getica: il sovrascorrimento carpatico e l'erosione hanno
      portato allo scoperto le formazioni dell'autoctono danubiano, e i calcari giurassici dell'intorno
      sostengono praterie calcaree, pareti rocciose e ghiaioni. Il clima è montano e piovoso, con
      precipitazioni distribuite tutto l'anno.


      La vegetazione forestale della valle comprende antiche foreste di abete rosso e larice. Nel sito Natura
      più ampio, le foreste montane di larice e pino cembro sono un tipo di habitat, insieme alle peccete
      montane acidofile. Tra la flora rara citata figurano il larice, la stella alpina (*floare de colț*), il
      rododendro, l'angelica e la campanula denticulata. Per la riserva stessa sono menzionati anche
      *Centaurea coziensis* e *Thymus comosus*.
    wildlife: >-
      I dati faunistici riguardano il sito Natura circostante più che il popolamento. In esso l'[aquila
      reale](/especie/aquila_chrysaetos/) è stata segnalata a Piatra Târnovului con riproduzione probabile, e
      la [poiana comune](/especie/buteo_buteo/) si osserva tutto l'anno. Il [gallo
      cedrone](/especie/tetrao_urogallus/) è raro e difficile da avvistare nelle peccete, l'[allocco degli
      Urali](/especie/strix_uralensis/) nidifica frequentemente e la [lince eurasiatica](/especie/lynx_lynx/)
      è registrata in boschi misti faggio-abete e in aree rocciose.


      Esiste uno spettacolo primaverile: tra metà aprile e i primi di maggio, i faggi dell'area del piano
      dispiegano le foglie.
    visit: >-
      Non esiste un sentiero segnalato fino al popolamento. La descrizione provinciale cita un percorso non
      segnalato che parte da Ciunget verso Dealul Vătăjelul Mare, Șaua cu Larice, Izvorul Mierlei e Culmea
      Târnovului, ma non conferma autorizzazioni vigenti né condizioni d'uso; prima di tentarlo, verifica con
      l'amministrazione ambientale e forestale.


      Per raggiungere il sito Natura, dalla strada Brezoi–Petroșani si svolta verso la valle del Latorița e si
      attraversa Ciunget. Il piano indica accessi dal sudovest di Ciunget per la Valea Satului e dalla valle
      di Repedea a sud. Le strade dell'intorno collegano con Vaideeni, centro tradizionale di pascolo estivo
      nei Căpățânii.
    history: >-
      La riserva è classificata come area protetta nazionale di categoria IV IUCN, con il codice 2.805. La
      superficie varia a seconda del documento: la legge e il piano ministeriale riportano 7,1 ettari, il
      documento provinciale 23,3 e il registro europeo quasi ventitré, per cui non esiste un confine
      definitivo.


      Il piano registra antichi tagli a raso e piantagioni nei lariceti del sito Natura. Tra le pressioni
      identificate figurano i disturbi dei veicoli a motore sulle piste, che incidono su habitat e fauna. Il
      cembro citato in letteratura non è stato ritrovato dagli autori del piano.
    before: >-
      Il piano vieta di gettare rifiuti nei corsi d'acqua e di consolidare o cementare le sponde del Latorița
      e dei suoi affluenti senza autorizzazione del custode. Il popolamento appartiene all'unità forestale II
      Latorița, gestita dall'Ocolul Silvic Voineasa, ed è questo ente e l'amministrazione ambientale a poter
      confermare l'accesso.
    around: >-
      A quattordici chilometri si trovano i [Monti Parâng](/lugar/muntii-parang/), a diciotto il [Parco
      Nazionale Buila-Vânturarița — Gola della Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/) e
      il [Parco Naturale di Cindrel](/lugar/parcul-natural-cindrel/), e a ventidue la [Gola del fiume
      Olt](/lugar/defileul-oltului/) e il [Parco Nazionale Cozia — Foreste
      primarie](/lugar/parcul-national-cozia---codrii-seculari/).


      Più lontano, il [Parco Nazionale Bucegi — Versante
      occidentale](/lugar/parcul-national-bucegi---vertientes-occidentales/) condivide la stella alpina e la
      *Daphne blagayana*.
  pt:
    intro: >-
      O protagonista é uma árvore, o lariço europeu, e aqui existe um maciço inteiro. Pădurea Latorița protege
      uma floresta de lariço europeu no vertente norte da Culmea Târnovului, no noroeste dos montes Căpățânii,
      junto ao vale do Latorița, no județ de Vâlcea. O interesse é silvícola: a descrição provincial destaca
      os exemplares longevos de lariço, e a lei de março de 2000 declarou-o área protegida.
    landscape: >-
      A reserva estende-se aproximadamente entre oitocentos e mil trezentos e cinquenta metros de altitude, na
      parte nordeste do sítio Natura 2000 Târnovu Mare–Latorița. Esse sítio, muito mais amplo que o maciço,
      pertence ao domínio do manto tectónico Gético: o cavalgamento carpático e a erosão expuseram formações
      do autóctone danubiano, e os calcários jurássicos da envolvente sustentam pastagens calcícolas,
      afloramentos rochosos e taludes de pedregulhos. O clima é de montanha e chuvoso, com precipitação ao
      longo de todo o ano.


      A vegetação florestal do vale inclui antigas florestas de abeto e lariço. No sítio Natura mais vasto, as
      florestas montanas de lariço e pinheiro-cembro surgem como tipo de habitat, a par das pinhais montanos
      acidófilos de abeto vermelho. Entre a flora rara citada contam-se o lariço, a flor-de-neve (*floare de
      colț*), o rododendro, a angélica e a campainha serrilhada. Para a reserva são ainda mencionados
      *Centaurea coziensis* e *Thymus comosus*.
    wildlife: >-
      Os dados faunísticos referem-se ao sítio Natura circundante e não ao maciço em si. Nele foi registada a
      [águia-real](/especie/aquila_chrysaetos/) em Piatra Târnovului com reprodução provável, e o
      [bútio-comum](/especie/buteo_buteo/) observa-se todo o ano. O
      [galo-silvestre](/especie/tetrao_urogallus/) é raro e difícil de avistar nas florestas de abeto, a
      [coruja-de-ural](/especie/strix_uralensis/) nidifica frequentemente e o
      [lince-euroasiático](/especie/lynx_lynx/) é registado em florestas mistas de faia e abeto e em
      afloramentos rochosos.


      Há um espetáculo primaveril: entre meados de abril e início de maio, as faias da área do plano desdobram
      as suas folhas.
    visit: >-
      Não existe trilho sinalizado até ao maciço. A descrição provincial menciona um caminho não marcado que
      parte de Ciunget em direção a Dealul Vătăjelul Mare, Șaua cu Larice, Izvorul Mierlei e Culmea
      Târnovului, mas não confirma autorização vigente nem condições de uso; antes de o tentar, consulta a
      administração ambiental e florestal.


      Para aceder ao sítio Natura, desvia-se da estrada Brezoi–Petroșani para o vale do Latorița e passa-se
      por Ciunget. O plano identifica entradas a sudoeste de Ciunget pela Valea Satului e pelo vale de Repedea
      a sul. As vias da envolvente ligam a Vaideeni, centro tradicional de pastoreio estival nos Căpățânii.
    history: >-
      A reserva está identificada como área protegida nacional de categoria IV da UICN, com o código 2.805. A
      sua superfície varia consoante o documento: a lei e o plano ministerial registam 7,1 hectares, o
      documento provincial 23,3 e o registo europeu quase vinte e três, pelo que não há um limite definitivo.


      O plano regista cortes rasos antigos e plantações nos lariceiros do sítio Natura. Entre as pressões
      identificam-se as perturbações dos veículos motorizados nas pistas, que afetam habitats e fauna. O
      pinheiro-cembro citado na bibliografia não foi encontrado pelos autores do plano.
    before: >-
      O plano proíbe lançar resíduos nos cursos de água e consolidar ou betonar as margens do Latorița e dos
      seus afluentes sem autorização do custódio. O maciço pertence à unidade florestal II Latorița, a cargo
      do Ocolul Silvic Voineasa, e é esse organismo e a administração ambiental quem pode confirmar o acesso.
    around: >-
      A catorze quilómetros ficam os [Montes Parâng](/lugar/muntii-parang/), a dezoito o [Parque Nacional
      Buila-Vânturarița — Garganta da Bistrița](/lugar/parcul-national-buila-vanturarita---cheile/) e o
      [Parque Natural de Cindrel](/lugar/parcul-natural-cindrel/), e a vinte e dois a [Garganta do Rio
      Olt](/lugar/defileul-oltului/) e o [Parque Nacional Cozia — Florestas
      Primárias](/lugar/parcul-national-cozia---codrii-seculari/).


      Mais longe, o [Parque Nacional Bucegi — Vertente
      Ocidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) partilha a flor-de-neve e a *Daphne
      blagayana*.
