texto:
  es:
    intro: >-
      Una montaña tan vieja que se llama así: Stara Planina, que en serbio significa montaña vieja. Es el
      extremo occidental de la gran cordillera del Balcán, que cruza Bulgaria entera, y en Serbia forma un
      parque natural de 142 219 hectáreas en el este del país, entre Zaječar, Knjaževac, Pirot y Dimitrovgrad.
      Las laderas del noreste son búlgaras; las del sureste, con sus colinas, son serbias. Aquí el decreto de
      protección reconoce 1200 especies y subespecies de plantas superiores, alrededor de doscientas especies
      de aves, cascadas, gargantas y meandros encajados.
    landscape: >-
      La cordillera arranca bajo Zaječar, se levanta de golpe sobre Knjaževac y alcanza su máxima altura en el
      pico Midžor. En las rocas se lee su historia: las jurásicas forman la mayor parte de la zona e incluyen
      amonitas, areniscas y calizas arenosas.


      El agua es protagonista. Piljski Skok y Bigar son la segunda y la tercera cascadas más altas de Serbia.
      Piljski Skok cae desde 64 metros en el arroyo Piljski, y Bigar mide 35 metros y desemboca en el río
      Stanjanska. Más abajo, el río Temštica ha excavado meandros encajados, la garganta de Vladikina Ploča
      queda entre Rsovci y Paklještica en un tramo de 2 kilómetros, y en la garganta del Rosomač hay las
      llamadas «ollas de Rosomač». Entre los roquedos, Babin Zub es un grupo de areniscas cuarcíticas.


      El clima es templado continental, de montaña y submontaña, con una precipitación media anual de unos
      960.5 mm. El decreto protege también las aguas superficiales y subterráneas y las formaciones rocosas.
    wildlife: >-
      La vegetación sube en pisos: roble, haya, pícea y matorral subalpino. Hay reservas con nombre propio:
      Golema Reka protege un hayedo de tipo bosque virgen; Smrče (Arbinje), los abetales de pícea mejor
      conservados de Serbia; Vražja Glava, la sucesión espontánea del bosque, sobre todo del arce de Heldreich
      (Acer heldreichii), un endemismo balcánico; Tri Čuke, el único bosquete conservado de pino mugo; y
      Kopren, las plantas carnívoras: la drosera redonda y especies del género Pinguicula. Cuarenta plantas
      están protegidas en Serbia como rarezas naturales, entre ellas el pino mugo, el aliso verde y el arce de
      montaña, y entre las rarezas hay genciana amarilla (Gentiana lutea) y genciana punteada (Gentiana
      punctata).


      Los pájaros mandan en las crestas. La montaña tiene 203 especies de aves, la mayor diversidad de
      cualquier montaña de Serbia y de la antigua Yugoslavia, y unas ciento cincuenta nidifican allí. Entre
      ellas destacan el mochuelo boreal y otros búhos, el [pico dorsiblanco](/especie/dendrocopos_leucotos/),
      el [busardo moro](/especie/buteo_rufinus/), el [halcón peregrino](/especie/falco_peregrinus/), el
      [águila real](/especie/aquila_chrysaetos/), el [halcón sacre](/especie/falco_cherrug/) y el urogallo; la
      chova piquigualda y la alondra cornuda (ušata ševa) completan la lista de aves que destaca el decreto.
      Stara Planina figura en el registro de zonas importantes para las aves, con 44 000 ha.


      De los 30 mamíferos destacan el [suslik europeo](/especie/spermophilus_citellus/), el topillo nival, el
      [lince](/especie/lynx_lynx/) y el [oso](/especie/ursus_arctos/). Y entre los pequeños, 116 especies de
      mariposas diurnas, 22 de ellas recién descubiertas y 6 reliquias glaciares, 18 de anfibios y reptiles (6
      y 12) y 26 de peces.
    visit: >-
      El centro de visitantes Vrelo, en la aldea de Brlog, a treinta y tres kilómetros del centro de Pirot, es
      la puerta del parque. Entró en funcionamiento en 2012. En dos salas se ven colecciones de mariposas
      diurnas y nocturnas de Stara Planina, fósiles y colecciones de plantas protegidas, y los paneles
      interpretan flora, mamíferos, herpetofauna, geología y senderos de montaña. Desde el centro se pueden
      recorrer en bicicleta de montaña los caminos del área protegida.
    history: >-
      La zona de Stara Planina se declaró parque natural en 1997 por su diversidad biológica y por sus rasgos
      geológicos, geomorfológicos e hidrológicos. El decreto reconoce cincuenta y dos comunidades forestales,
      arbustivas y herbáceas, y destaca cuatro plantas amenazadas en Europa, entre ellas bor krivulj (el pino
      mugo). La tradición de recolectar plantas medicinales y comestibles silvestres es un legado largo y
      rico, y muchas especies están protegidas por ley: en las laderas hay enebro común, asaro, celidonia y
      jabonera.
    before: >-
      Los mejores meses van de mayo a octubre; calcula entre dos y cuatro días. Es una montaña sin presión
      turística masiva. Respeta las reservas, donde las comunidades de plantas están protegidas.
    around: >-
      A cuatro kilómetros queda el [Desfiladero del Río Iskar y Garganta Alpina de Beli
      Iskar](/lugar/iskarski-prolom/), y a veinticinco la [Reserva Natural Especial Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/). Más lejos, el [Parque Natural de los Alpes
      Marítimos](/lugar/parco-naturale-delle-alpi-marittime/) comparte con Stara Planina el águila real, el
      halcón peregrino y la chova piquigualda en un paisaje de alta montaña.
  en:
    intro: >-
      A mountain so old it is simply named that: Stara Planina, which in Serbian means Old Mountain. It forms
      the western end of the great Balkan range, which traverses all of Bulgaria, and in Serbia it constitutes
      a nature park of 142 219 hectares in the east of the country, spanning Zaječar, Knjaževac, Pirot and
      Dimitrovgrad. The north-eastern slopes are Bulgarian; the south-eastern slopes, with their foothills,
      are Serbian. Here the protection decree recognizes 1200 species and subspecies of higher plants, around
      two hundred bird species, waterfalls, gorges and incised meanders.
    landscape: >-
      The range begins beneath Zaječar, rises steeply above Knjaževac and attains its greatest elevation at
      Midžor peak. The rocks chronicle its history: Jurassic formations make up most of the area, featuring
      ammonites, sandstones and sandy limestones.


      Water is the defining feature. Piljski Skok and Bigar are the second and third tallest waterfalls in
      Serbia. Piljski Skok plunges from 64 metres on the Piljski stream, while Bigar measures 35 metres and
      flows into the Stanjanska River. Further down, the Temštica River has carved incised meanders, the
      Vladikina Ploča gorge runs between Rsovci and Paklještica over a stretch of 2 kilometres, and the
      Rosomač gorge contains the so-called "Rosomač pots". Among the crags, Babin Zub is an imposing cluster
      of quartz sandstones.


      The climate is temperate continental, montane and submontane, with mean annual precipitation of around
      960.5 mm. The protection decree also shields surface and underground waters and distinctive rock
      formations.
    wildlife: >-
      Vegetation ascends in belts: oak, beech, Norway spruce and subalpine scrub. There are reserves with
      specific names: Golema Reka protects an old-growth beech forest; Smrče (Arbinje) safeguards the
      best-preserved spruce stands in Serbia; Vražja Glava preserves spontaneous forest succession,
      particularly of Heldreich's maple (*Acer heldreichii*), a Balkan endemic; Tri Čuke protects the only
      preserved stand of mountain pine; and Kopren harbours carnivorous plants: round-leaved sundew and
      species of the genus *Pinguicula*. Forty plants are protected in Serbia as natural rarities, among them
      mountain pine, green alder and sycamore maple, alongside yellow gentian (*Gentiana lutea*) and spotted
      gentian (*Gentiana punctata*).


      Birds rule the ridges. The mountain supports 203 bird species, the highest diversity of any mountain in
      Serbia and the former Yugoslavia, with about one hundred and fifty breeding here. Notable species
      include Tengmalm's owl and other owls, the [white-backed woodpecker](/especie/dendrocopos_leucotos/),
      [long-legged buzzard](/especie/buteo_rufinus/), [peregrine falcon](/especie/falco_peregrinus/), [golden
      eagle](/especie/aquila_chrysaetos/), [saker falcon](/especie/falco_cherrug/) and western capercaillie;
      alpine chough and horned lark complete the birds highlighted in the decree. Stara Planina is registered
      as an Important Bird Area, covering 44 000 ha.


      Among the 30 mammals are the [European ground squirrel](/especie/spermophilus_citellus/), European snow
      vole, [Eurasian lynx](/especie/lynx_lynx/) and [brown bear](/especie/ursus_arctos/). Smaller fauna
      includes 116 species of butterflies, 22 of them newly discovered and 6 glacial relicts, 18 amphibians
      and reptiles (6 and 12), and 26 fish species.
    visit: >-
      The Vrelo visitor centre, in the village of Brlog, thirty-three kilometres from the centre of Pirot, is
      the gateway to the park. It opened in 2012. Two exhibition rooms present collections of butterflies and
      moths of Stara Planina, fossils, and specimens of protected plants, while interpretive panels explain
      flora, mammals, herpetofauna, geology and hiking trails. Mountain bike routes across the protected area
      can be started directly from the centre.
    history: >-
      The Stara Planina area was designated a nature park in 1997 for its biological diversity and its
      geological, geomorphological and hydrological features. The decree recognizes fifty-two forest, shrub
      and herb communities and highlights four plant species threatened in Europe, including *bor krivulj*
      (mountain pine). The tradition of foraging wild medicinal and edible herbs is long and rich, with many
      species protected by law: common juniper, asarum, greater celandine and soapwort grow on the slopes.
    before: >-
      The best months run from May to October; plan for two to four days. This mountain experiences no mass
      tourist pressure. Respect the reserves, where plant communities enjoy strict protection.
    around: >-
      Four kilometres away lies the [Iskar River Gorge and Beli Iskar Alpine Gorge](/lugar/iskarski-prolom/),
      and twenty-five kilometres away is the [Suva Planina Special Nature
      Reserve](/lugar/specijalni-rezervat-prirode-suva-planina/). Further away, the [Maritime Alps Natural
      Park](/lugar/parco-naturale-delle-alpi-marittime/) shares with Stara Planina the golden eagle, peregrine
      falcon and alpine chough in a high-mountain setting.
  fr:
    intro: >-
      Une montagne si ancienne qu'elle porte ce nom : Stara Planina, ce qui signifie vieille montagne en
      serbe. C'est l'extrémité occidentale de la grande chaîne des Balkans qui traverse toute la Bulgarie,
      formant en Serbie un parc naturel de 142 219 hectares dans l'est du pays, entre Zaječar, Knjaževac,
      Pirot et Dimitrovgrad. Les versants nord-est sont bulgares ; ceux du sud-est, avec leurs collines, sont
      serbes. Le décret de protection y recense 1200 espèces et sous-espèces de plantes supérieures, environ
      deux cents espèces d'oiseaux, des cascades, des gorges et des méandres encaissés.
    landscape: >-
      La chaîne s'amorce sous Zaječar, s'élève brusquement au-dessus de Knjaževac et culmine au pic Midžor.
      Les roches racontent son histoire : les formations jurassiques constituent l'essentiel du secteur,
      composées d'ammonites, de grès et de calcaires gréseux.


      L'eau joue les premiers rôles. Piljski Skok et Bigar sont les deuxième et troisième plus hautes cascades
      de Serbie. Piljski Skok tombe de 64 mètres dans le ruisseau Piljski, tandis que Bigar mesure 35 mètres
      et rejoint la rivière Stanjanska. Plus bas, la Temštica a creusé des méandres encaissés, les gorges de
      Vladikina Ploča s'étirent entre Rsovci et Paklještica sur un tronçon de 2 kilomètres, et les gorges du
      Rosomač présentent les fameuses « marmites de Rosomač ». Parmi les parois rocheuses, Babin Zub est un
      remarquable groupe de grès quartzitiques.


      Le climat est continental tempéré, montagnard et submétropolitain, avec des précipitations annuelles
      moyennes d'environ 960.5 mm. Le décret protège également les eaux de surface et souterraines ainsi que
      les formations géologiques remarquables.
    wildlife: >-
      La végétation s'étage en ceintures : chêne, hêtre, épicéa et lande subalpine. Des réserves portent des
      noms évocateurs : Golema Reka abrite une hêtraie quasi vierge ; Smrče (Arbinje) les pessières d'épicéa
      les mieux conservées de Serbie ; Vražja Glava la régénération spontanée de la forêt, en particulier de
      l'érable de Heldreich (*Acer heldreichii*), un endémisme balkanique ; Tri Čuke l'unique peuplement
      préservé de pin mugo ; et Kopren des plantes carnivores : droséra à feuilles rondes et grassettes du
      genre *Pinguicula*. Quarante plantes sont protégées en Serbie comme raretés naturelles, dont le pin
      mugo, l'aulne vert et l'érable sycomore, accompagnés de la gentiane jaune (*Gentiana lutea*) et de la
      gentiane ponctuée (*Gentiana punctata*).


      Les oiseaux règnent sur les crêtes. La montagne compte 203 espèces d'oiseaux, la plus forte diversité de
      toutes les montagnes de Serbie et de l'ex-Yougoslavie, dont environ cent cinquante y nichent. Parmi
      elles figurent la chouette de Tengmalm, le [pic à dos blanc](/especie/dendrocopos_leucotos/), la [buse
      féroce](/especie/buteo_rufinus/), le [faucon pèlerin](/especie/falco_peregrinus/), l'[aigle
      royal](/especie/aquila_chrysaetos/), le [faucon sacre](/especie/falco_cherrug/) et le grand tétras ; le
      chocard à bec jaune et l'alouette hausse-col complètent la liste du décret. Stara Planina est classée
      Zone importante pour la conservation des oiseaux, sur 44 000 ha.


      Parmi les 30 mammifères figurent le [souslik d'Europe](/especie/spermophilus_citellus/), le campagnol
      des neiges, le [lynx boréal](/especie/lynx_lynx/) et l'[ours brun](/especie/ursus_arctos/). La petite
      faune compte 116 espèces de papillons de jour, dont 22 récemment découvertes et 6 reliques glaciaires,
      18 amphibiens et reptiles (6 et 12) et 26 espèces de poissons.
    visit: >-
      Le centre de visiteurs Vrelo, dans le village de Brlog, à trente-trois kilomètres du centre de Pirot,
      constitue la porte d'entrée du parc. Il a ouvert ses portes en 2012. Deux salles d'exposition présentent
      des collections de papillons diurnes et nocturnes de Stara Planina, des fossiles et des herbiers de
      plantes protégées, tandis que des panneaux interprètent la flore, les mammifères, l'herpétofaune, la
      géologie et les sentiers. Des circuits en VTT démarrent directement depuis le centre.
    history: >-
      La région de Stara Planina a été déclarée parc naturel en 1997 pour sa richesse biologique et ses
      particularités géologiques, géomorphologiques et hydrologiques. Le décret identifie cinquante-deux
      communautés végétales forestières, arbustives et herbacées, et met en avant quatre plantes menacées en
      Europe, dont le pin mugo (*bor krivulj*). La cueillette traditionnelle de plantes médicinales et
      comestibles est séculaire, de nombreuses espèces étant protégées par la loi : genévrier commun, asaret,
      chélidoine et saponaire prospèrent sur les pentes.
    before: >-
      Les mois les plus propices vont de mai à octobre ; prévoyez deux à quatre jours. C'est une montagne sans
      affluence touristique de masse. Respectez scrupuleusement les réserves intégrales où la flore est
      strictement protégée.
    around: >-
      À quatre kilomètres se trouvent les [gorges de l'Iskar et gorges alpines de Beli
      Iskar](/lugar/iskarski-prolom/), et à vingt-cinq la [réserve naturelle spéciale de Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/). Plus loin, le [parc naturel des Alpes
      maritimes](/lugar/parco-naturale-delle-alpi-marittime/) partage avec Stara Planina l'aigle royal, le
      faucon pèlerin et le chocard à bec jaune en milieu alpin.
  de:
    intro: >-
      Ein Gebirge so alt, dass es genau so heißt: Stara Planina bedeutet auf Serbisch Altes Gebirge. Es bildet
      den Westflügel des großen Balkankammes, der ganz Bulgarien durchquert, und umfasst in Serbien einen
      Naturpark von 142 219 Hektar im Osten des Landes zwischen Zaječar, Knjaževac, Pirot und Dimitrovgrad.
      Die Nordosthänge gehören zu Bulgarien, die Südwesthänge mit ihrem Hügelland zu Serbien. Das Schutzdekret
      verzeichnet hier 1200 Arten und Unterarten höherer Pflanzen, rund zweihundert Vogelarten, Wasserfälle,
      Schluchten und Talschlingen.
    landscape: >-
      Das Gebirge setzt unterhalb von Zaječar an, baut sich steil über Knjaževac auf und erreicht am
      Midžor-Gipfel seinen höchsten Punkt. Die Gesteine belegen seine Entstehung: Jurassische Formationen
      prägen den Großteil des Raumes, reich an Ammoniten, Sandsteinen und kalkigen Sandsteinen.


      Das Wasser gestaltet die Landschaft. Piljski Skok und Bigar sind der zweit- und dritthöchste Wasserfall
      Serbiens. Piljski Skok stürzt am Piljski-Bach über 64 Meter in die Tiefe, während der Bigar 35 Meter
      misst und in die Stanjanska mündet. Weiter talwärts hat die Temštica steile Schluchtmäander
      eingeschnitten, die Vladikina-Ploča-Schlucht verläuft zwischen Rsovci und Paklještica auf einer Länge
      von 2 Kilometern, und in der Rosomač-Klamm finden sich die sogenannten Rosomač-Kessel. Babin Zub bildet
      eine markante Felsengruppe aus Quarzsandsteinen.


      Das Klima ist gemäßigt kontinental, geprägt von Gebirgs- und Vorgebirgslagen, mit einem
      Jahresniederschlag von durchschnittlich 960.5 mm. Das Dekret stellt Oberflächen- und Grundwässer sowie
      geologische Sonderformen unter Schutz.
    wildlife: >-
      Die Vegetation gliedert sich in Höhenstufen: Eiche, Buche, Fichte und subalpine Zwergstrauchheide.
      Besondere Reservate tragen eigene Namen: Golema Reka schützt einen Buchenurwald; Smrče (Arbinje) die
      besterhaltenen Fichtenwälder Serbiens; Vražja Glava die natürliche Waldsukzession mit dem
      Heldreich-Ahorn (*Acer heldreichii*), einem Balkan-Endemiten; Tri Čuke den einzigen erhaltenen
      Bergkiefernbestand; und Kopren fleischfressende Pflanzen wie Rundblättrigen Sonnentau und Fettkräuter
      der Gattung *Pinguicula*. Vierzig Pflanzenarten gelten in Serbien als geschützte Naturraritäten,
      darunter Bergkiefer, Grünerle, Berg-Ahorn sowie Gelber Enzian (*Gentiana lutea*) und Punktierter Enzian
      (*Gentiana punctata*).


      Auf den Kämmen herrschen die Vögel vor. Das Gebirge beherbergt 203 Vogelarten – die höchste Vielfalt
      aller Gebirgsmassive Serbiens und des ehemaligen Jugoslawiens –, von denen rund einhundertfünfzig hier
      brüten. Hervorzuheben sind Raufußkauz, [Weißrückenspecht](/especie/dendrocopos_leucotos/),
      [Adlerbussard](/especie/buteo_rufinus/), [Wanderfalke](/especie/falco_peregrinus/),
      [Steinadler](/especie/aquila_chrysaetos/), [Würgfalke](/especie/falco_cherrug/) und Auerhuhn; Alpendohle
      und Ohrenlerche runden die Liste des Dekrets ab. Stara Planina ist als Important Bird Area auf 44 000 ha
      registriert.


      Unter den 30 Säugetierarten leben [Europäischer Ziesel](/especie/spermophilus_citellus/), Schneemaus,
      [Luchs](/especie/lynx_lynx/) und [Braunbär](/especie/ursus_arctos/). Zur Kleintierwelt zählen 116
      Tagfalterarten, davon 22 neu entdeckt und 6 Glazialrelikte, 18 Amphibien und Reptilien (6 und 12) sowie
      26 Fischarten.
    visit: >-
      Das Besucherzentrum Vrelo im Dorf Brlog, dreiunddreißig Kilometer vom Stadtzentrum von Pirot entfernt,
      bildet das Tor zum Park. Es nahm 2012 seinen Betrieb auf. Zwei Schauräume zeigen Sammlungen von Tag- und
      Nachtfaltern der Stara Planina, Fossilien und Herbarexemplare geschützter Pflanzen, während
      Informationstafeln Flora, Säugetiere, Herpetofauna, Geologie und Bergwanderwege veranschaulichen. Vom
      Zentrum aus lassen sich Mountainbiketouren auf den Wegen des Schutzgebiets unternehmen.
    history: >-
      Die Region Stara Planina wurde 1997 wegen ihrer biologischen Vielfalt und ihrer geologischen,
      geomorphologischen und hydrologischen Besonderheiten zum Naturpark erklärt. Das Schutzdekret weist
      zweiundfünfzig Wald-, Strauch- und Graslandgesellschaften aus und hebt vier europaweit gefährdete
      Pflanzenarten hervor, darunter die Bergkiefer (*bor krivulj*). Die Tradition des Sammelns von Heil- und
      Wildkräutern ist tief verwurzelt; viele Arten stehen unter Schutz: Wacholder, Haselwurz, Schöllkraut und
      Seifenkraut säumen die Hänge.
    before: >-
      Die besten Reisemonate reichen von Mai bis Oktober; plane zwei bis vier Tage ein. Das Gebirge kennt
      keinen Massentourismus. Schone die Kernreservate, in denen Pflanzengemeinschaften streng geschützt sind.
    around: >-
      Vier Kilometer entfernt liegt die [Iskar-Schlucht und alpine Klamm von Beli
      Iskar](/lugar/iskarski-prolom/) und fünfundzwanzig Kilometer entfernt das [Sondernaturreservat Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/). Weiter entfernt teilt der [Naturpark
      Seealpen](/lugar/parco-naturale-delle-alpi-marittime/) mit der Stara Planina Steinadler, Wanderfalke und
      Alpendohle in alpiner Hochgebirgslandschaft.
  it:
    intro: >-
      Una montagna talmente antica da chiamarsi proprio così: Stara Planina, che in serbo significa Vecchia
      Montagna. Costituisce l'estremità occidentale della grande catena dei Balcani che solca l'intera
      Bulgaria, e in Serbia forma un parco naturale di 142 219 ettari nell'oriente del paese, tra Zaječar,
      Knjaževac, Pirot e Dimitrovgrad. I versanti nordorientali appartengono alla Bulgaria; quelli
      sudorientali, con le loro balze collinari, alla Serbia. Il decreto di tutela vi riconosce 1200 specie e
      sottospecie di piante superiori, circa duecento specie ornitiche, cascate, gole e meandri incassati.
    landscape: >-
      La catena montuosa prende avvio sotto Zaječar, s'innalza ripida sopra Knjaževac e tocca la massima quota
      sulla cima del Midžor. Nelle rocce si legge la sua evoluzione: le formazioni giurassiche occupano la
      maggioranza dell'area, ricche di ammoniti, arenarie e calcari arenacei.


      L'acqua regna incontrastata. Piljski Skok e Bigar sono la seconda e la terza cascata più alte della
      Serbia. Piljski Skok precipita da 64 metri lungo il torrente Piljski, mentre Bigar misura 35 metri e
      sfocia nel fiume Stanjanska. Più a valle, il fiume Temštica ha scavato meandri incassati, la gola di
      Vladikina Ploča corre tra Rsovci e Paklještica per un tratto di 2 chilometri, e nella gola del Rosomač
      spiccano le caratteristiche "marmitte di Rosomač". Tra i bastioni rocciosi, Babin Zub è un
      impressionante torrione di arenarie quarzitiche.


      Il clima è continentale temperato, montano e submontano, con precipitazioni annue medie di circa 960.5
      mm. Il decreto protegge sia le acque superficiali e sotterranee sia i complessi geomorfologici di
      rilievo.
    wildlife: >-
      La vegetazione sale a fasce: quercia, faggio, abete rosso e brughiera subalpina. Vi sono riserve
      integrali con nomi propri: Golema Reka tutela una faggeta vetusta; Smrče (Arbinje) le peccete d'abete
      rosso meglio conservate della Serbia; Vražja Glava la successione spontanea del bosco, specie con
      l'acero di Heldreich (*Acer heldreichii*), endemismo balcanico; Tri Čuke l'unica pineta superstite di
      pino mugo; e Kopren le piante insettivore: drosera a foglie rotonde e specie del genere *Pinguicula*.
      Quaranta entità floristiche sono protette in Serbia come rarità, tra cui pino mugo, ontano verde e acero
      montano, accanto alla genziana maggiore (*Gentiana lutea*) e alla genziana punteggiata (*Gentiana
      punctata*).


      Gli uccelli padroneggiano le creste. La montagna annovera 203 specie di uccelli, la maggiore ricchezza
      di qualunque massiccio della Serbia e dell'ex Jugoslavia, con circa centocinquanta nidificanti. Spiccano
      la civetta capogrosso, il [picchio dorsobianco](/especie/dendrocopos_leucotos/), la [poiana
      codabianca](/especie/buteo_rufinus/), il [falco pellegrino](/especie/falco_peregrinus/), l'[aquila
      reale](/especie/aquila_chrysaetos/), il [falco sacro](/especie/falco_cherrug/) e il gallo cedrone; il
      gracchio corallino e l'allodola gola-gialla completano l'elenco del decreto. Stara Planina figura come
      Important Bird Area con 44 000 ha.


      Tra i 30 mammiferi figurano il [citello europeo](/especie/spermophilus_citellus/), l'arvicola delle
      nevi, la [lince eurasiatica](/especie/lynx_lynx/) e l'[orso bruno](/especie/ursus_arctos/). La
      microfauna vanta 116 specie di farfalle diurne, di cui 22 recentemente scoperte e 6 relitti glaciali, 18
      tra anfibi e rettili (6 e 12) e 26 specie ittiche.
    visit: >-
      Il centro visitatori Vrelo, nel borgo di Brlog, a trentatré chilometri dal centro di Pirot, è il varco
      d'accesso al parco. È stato aperto nel 2012. In due sale sono allestite collezioni di lepidotteri diurni
      e notturni di Stara Planina, reperti fossili ed essiccati di piante protette, mentre i pannelli tematici
      illustrano flora, mammiferi, erpetofauna, geologia e tracciati escursionistici. Dal centro partono
      percorsi per mountain bike lungo i sentieri dell'area protetta.
    history: >-
      L'area di Stara Planina è stata proclamata parco naturale nel 1997 per la sua biodiversità e per il
      valore geologico, geomorfologico e idrologico. Il decreto elenca cinquantadue associazioni forestali,
      arbustive ed erbacee e segnala quattro specie vegetali minacciate in Europa, fra cui il pino mugo (*bor
      krivulj*). La consuetudine della raccolta di erbe officinali e commestibili è secolare; molte piante
      sono tutelate per legge: ginepro comune, asaro, chelidonia e saponaria abbondano sui pendii.
    before: >-
      I mesi consigliati vanno da maggio a ottobre; metti in conto da due a quattro giorni. È una montagna
      lontana dal turismo massificato. Rispetta le riserve integrali in cui la vegetazione gode di rigorosa
      tutela.
    around: >-
      A quattro chilometri si trovano le [Gole del Fiume Iskar e Gola Alpina di Beli
      Iskar](/lugar/iskarski-prolom/), e a venticinque la [Riserva naturale speciale Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/). Più distante, il [Parco naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) condivide con Stara Planina l'aquila reale, il
      falco pellegrino e il gracchio corallino in un grandioso ambiente alpino.
  pt:
    intro: >-
      Uma montanha tão ancestral que o próprio nome o reflete: Stara Planina significa montanha velha em
      sérvio. Constitui o extremo ocidental da grande cordilheira dos Balcãs, que atravessa toda a Bulgária, e
      na Sérvia forma um parque natural de 142 219 hectares no leste do país, entre Zaječar, Knjaževac, Pirot
      e Dimitrovgrad. As vertentes a nordeste são búlgaras; as encostas a sudeste, com as suas colinas, são
      sérvias. Aqui o decreto de proteção reconhece 1200 espécies e subespécies de plantas vasculares, cerca
      de duzentas espécies de aves, cascatas, desfiladeiros e meandros encaixados.
    landscape: >-
      A cordilheira tem início abaixo de Zaječar, ergue-se abruptamente sobre Knjaževac e atinge o seu cume no
      pico Midžor. As rochas contam a sua génese: as formações jurássicas constituem a maior parte da área,
      integrando amonites, arenitos e calcários arenosos.


      A água assume papel primordial. Piljski Skok e Bigar são a segunda e a terceira cascatas mais altas da
      Sérvia. Piljski Skok despenha-se de 64 metros no ribeiro Piljski, enquanto Bigar atinge 35 metros e
      desagua no rio Stanjanska. Mais a jusante, o rio Temštica esculpiu meandros apertados, a garganta de
      Vladikina Ploča estende-se entre Rsovci e Paklještica numa extensão de 2 quilómetros, e no desfiladeiro
      de Rosomač encontram-se as chamadas "caldeiras de Rosomač". Entre os afloramentos, Babin Zub destaca-se
      como um imponente maciço de arenitos quartzíticos.


      O clima é temperado continental, montano e pré-montano, com precipitação média anual na ordem dos 960.5
      mm. O decreto tutela igualmente as águas superficiais e subterrâneas e os relevos rochosos notáveis.
    wildlife: >-
      A vegetação distribui-se por andares: carvalho, faia, espruce e matos subalpinos. Existem reservas
      integrais com designação própria: Golema Reka resguarda um faial virgem; Smrče (Arbinje) os povoamentos
      de abeto-falso mais conservados da Sérvia; Vražja Glava a sucessão florestal natural, mormente do
      bordo-de-heldreich (*Acer heldreichii*), endemismo balcânico; Tri Čuke o único núcleo preservado de
      pinheiro-raso; e Kopren espécies insetívoras: drósera-de-folhas-redondas e pinguículas do género
      *Pinguicula*. Quarenta plantas encontram-se protegidas na Sérvia como raridades biológicas, entre elas o
      pinheiro-raso, o amieiro-verde e o bordo-da-montanha, juntamente com a genciana-amarela (*Gentiana
      lutea*) e a genciana-pontuada (*Gentiana punctata*).


      As aves dominam as cristas rochosas. A montanha acolhe 203 espécies de aves, a maior diversidade de
      qualquer relevo da Sérvia e da antiga Jugoslávia, nidificando aqui cerca de cento e cinquenta.
      Destacam-se o mocho-funéreo e outras corujas, o
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/), o [búteo-mouro](/especie/buteo_rufinus/), o
      [falcão-peregrino](/especie/falco_peregrinus/), a [águia-real](/especie/aquila_chrysaetos/), o
      [falcão-sacre](/especie/falco_cherrug/) e o tetraz-grande; a gralha-de-bico-amarelo e a cotovia-cornuda
      completam as aves do decreto. Stara Planina figura como Zona Importante para as Aves com 44 000 ha.


      Entre os 30 mamíferos destacam-se o [esquilo-terrestre-europeu](/especie/spermophilus_citellus/), a
      ratazana-das-neves, o [lince-euroasiático](/especie/lynx_lynx/) e o
      [urso-pardo](/especie/ursus_arctos/). A fauna miúda inclui 116 espécies de borboletas diurnas, 22 delas
      descobertas recentemente e 6 relíquias glaciares, 18 anfíbios e répteis (6 e 12) e 26 espécies de
      peixes.
    visit: >-
      O centro de visitantes Vrelo, na aldeia de Brlog, a trinta e três quilómetros do centro de Pirot,
      constitui a porta do parque. Entrou em funcionamento em 2012. Em duas salas expõem-se coleções de
      borboletas diurnas e noturnas de Stara Planina, fósseis e herbários de plantas protegidas, ao passo que
      painéis interpretativos explicam flora, mamíferos, herpetofauna, geologia e trilhos de montanha. A
      partir do centro é possível realizar passeios de bicicleta de montanha pelos caminhos do parque.
    history: >-
      A área de Stara Planina foi designada parque natural em 1997 pela sua riqueza biológica e pelo valor
      geológico, geomorfológico e hidrológico. O decreto reconhece cinquenta e duas associações florestais,
      arbustivas e herbáceas e salienta quatro plantas ameaçadas na Europa, entre elas o pinheiro-raso (*bor
      krivulj*). A tradição da colheita de plantas medicinais e silvestres comestíveis é ancestral; muitas
      espécies encontram-se protegidas por lei: zimbro, asaro, celidónia e saboeira povoam as vertentes.
    before: >-
      Os meses mais recomendados vão de maio a outubro; prevê entre dois e quatro dias. É uma montanha livre
      de pressão turística maciça. Respeita as reservas naturais, onde a vegetação beneficia de proteção
      rigorosa.
    around: >-
      A quatro quilómetros fica o [Desfiladeiro do Rio Iskar e Garganta Alpina de Beli
      Iskar](/lugar/iskarski-prolom/), e a vinte e cinco a [Reserva Natural Especial Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/). Mais distante, o [Parque Natural dos Alpes
      Marítimos](/lugar/parco-naturale-delle-alpi-marittime/) partilha com Stara Planina a águia-real, o
      falcão-peregrino e a gralha-de-bico-amarelo num ambiente de alta montanha.
