unico:
  es: >-
    Es un cañón donde el agua sube desde el interior de la montaña, el aire pertenece a los buitres y los
    bosques de hayas crecen en un clima casi mediterráneo.
  en: >-
    It is a canyon where water wells up from deep within the mountain, the sky belongs to vultures, and beech
    forests thrive in a near-Mediterranean climate.
  fr: >-
    C'est un canyon où l'eau jaillit des entrailles de la montagne, où le ciel appartient aux vautours et où
    les hêtraies croissent sous un climat presque méditerranéen.
  de: >-
    Es ist eine Schlucht, in der das Wasser aus dem Erdinneren aufsteigt, die Luft den Geiern gehört und
    Buchenwälder in einem fast mediterranen Klima gedeihen.
  it: >-
    È un canyon dove l'acqua sgorga dal cuore della montagna, il cielo appartiene agli avvoltoi e le faggete
    prosperano in un clima quasi mediterraneo.
  pt: >-
    É um desfiladeiro onde a água brota do interior da montanha, o céu pertence aos abutres e os faiais medram
    num clima quase mediterrânico.
observaciones:
