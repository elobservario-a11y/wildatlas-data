    Espectacular cañón calizo de 500 m de profundidad labrado por el Tarn entre las mesetas kársticas de los
    Causses.
  en: Spectacular limestone canyon 500 m deep carved by the Tarn between the karstic plateaus of the Causses.
  fr: >-
    Spectaculaire canyon calcaire de 500 m de profondeur creusé par le Tarn entre les plateaux karstiques des
    Causses.
  de: >-
    Spektakuläre, 500 m tiefe Kalksteinschlucht, die der Tarn zwischen den verkarsteten Hochebenen der Causses
    eingegraben hat.
  it: Spettacolare canyon calcareo profondo 500 m scavato dal Tarn tra gli altopiani carsici dei Causses.
  pt: >-
    Espetacular desfiladeiro calcário de 500 m de profundidade escavado pelo Tarn entre os planaltos cársicos
