texto:
  es:
    intro: >-
      Un río que no tiene afluentes en 52 kilómetros y que, sin embargo, crece a cada paso. El Tarn entre
      Quézac y Le Rozier recibe agua de unas 170 surgencias kársticas, y ha excavado a lo largo de 53 km un
      cañón de 400 a 600 m de profundidad entre las mesetas calizas de los Grandes Causses. Son las Gargantas
      del Tarn: un tajo vertical con acantilados de dolomía, buitres planeando sobre los bordes, un clima casi
      mediterráneo en el fondo y un sendero que lo recorre de Florac a Le Rozier.
    landscape: >-
      Para entender las gargantas hay que ir al Mioceno, cuando el empuje de la orogenia alpina levantó el
      Macizo Central y los Causses subieron hasta una altura media de 800 m al norte y 1000 m al sur. La
      erosión intensa abrió después las gargantas. Las del Tarn, la Jonte, la Dourbie y la Vis cortan así los
      grandes espacios abiertos, de aire estepario, de los Causses. Entre Les Vignes y Le Rozier la
      arquitectura es sencilla: calizas del Secundario que terminan en grandes acantilados verticales de
      dolomía.


      El agua trabaja desde dentro. Se han contado unas cuarenta resurgencias a lo largo del Tarn; la de
      Cénaret alimenta un pequeño lago subterráneo de 30 m de diámetro y ocho de profundidad dentro de la
      cueva del mismo nombre. Las fallas de la zona de Sainte-Énimie originan dos surgencias de gran caudal,
      la fuente de Burle y la de Coussac, que cae en cascada al Tarn. En la fuente de Salce el óxido de hierro
      tiñe de rojo el agua, en una zona de contacto entre esquisto y caliza. Y en el Pas de Soucy un enorme
      derrumbe obstruye el valle y el Tarn desaparece bajo él para reaparecer un poco más allá.


      También hay huellas de volcanes: un doble neck de basalto en Sauveterre, sobre el que se levanta el
      pueblo, y otras intrusiones de basalto en Eglazines, dentro del propio cañón.


      El clima de las gargantas es mucho menos duro que el de las mesetas vecinas, con mucho sol y carácter
      mediterráneo. Por eso, al salir de Capluc, las terrazas orientadas al sur y protegidas por los
      acantilados dan la vegetación mediterránea más septentrional de la región: fresno de hoja estrecha,
      jazmín, arce de Montpellier y encina. En el valle crecen hayas, que ocupan un nicho inusual en un clima
      casi mediterráneo porque el agua del Tarn les aporta por las raíces la humedad que necesitan. En lo alto
      de las laderas, en lugares a menudo inaccesibles, quedan algunos bosquetes de pino de Salzmann.
    wildlife: >-
      Mira hacia arriba. En el aire se ven el [alimoche](/especie/neophron_percnopterus/), que reapareció solo
      tras una larga ausencia, el [buitre leonado](/especie/gyps_fulvus/), reintroducido, y el [buitre
      negro](/especie/aegypius_monachus/). La reintroducción del buitre leonado empezó en 1982 en esta zona;
      después se reintrodujeron el buitre negro (1992) y el [quebrantahuesos](/especie/gypaetus_barbatus/)
      (2012), y solo el alimoche volvió por sí solo en 1986. Más arriba, además de los buitres, vuelan el
      milano negro, el [águila pescadora](/especie/pandion_haliaetus/), la culebrera europea, el [halcón
      peregrino](/especie/falco_peregrinus/) y el [águila real](/especie/aquila_chrysaetos/).


      El año marca el ritmo. En la mala estación invernan en los acantilados el
      [treparriscos](/especie/tichodroma_muraria/) y el acentor alpino; cuando los días se alargan, el [mirlo
      acuático](/especie/cinclus_cinclus/) se afana junto al agua. En el río, el [castor
      europeo](/especie/castor_fiber/), reintroducido en el Tarn, tiene una población que crece deprisa; suele
      estar activo de noche y también al amanecer o al anochecer si no se le molesta. En el agua viven también
      la trucha común, el gobio y el barbo meridional.


      Las paredes y la vegetación de ribera reúnen muchas endémicas de los Causses, como la grassette des
      Causses, que crece en acantilados húmedos, la sabline de Lozère, la ancolie des Causses y la arméria de
      Girard. Las gargantas son muy ricas en orquídeas: Orchis bouffon, Orchis militaire, Orchis singe, Orchis
      pourpre y la especie endémica Ophrys d'Aymonin. Las cuevas albergan murciélagos raros, como el
      murciélago ratonero grande y los herraduras grande y pequeño, y en la de Castelbouc dos moluscos
      endémicos: Bythinella bouloti y Bythinella galerae.
    visit: >-
      Las gargantas se recorren a pie y, en algunos tramos, en canoa. El sendero de gran recorrido recorre la
      garganta desde Florac hasta Le Rozier en cinco jornadas: suma 66,9 km y está clasificado como moderado.
      Algunos tramos se pueden hacer en canoa. La etapa Les Vignes–Le Rozier recorre 12 km con 435 m de subida
      y pasa bajo acantilados donde anidan aves rapaces; en el tramo final, el sendero llega a Le Rozier por
      un camino más sencillo después de pasar sobre La Sablière.


      Si buscas una primera salida corta, el sendero interpretativo Birds of the Causses and Gorges es un
      circuito muy fácil de 2,8 km que requiere una hora y media y salva 91 m de subida y 92 m de bajada:
      permite escuchar y observar aves en los matorrales del borde del Causse Méjean, sobre el río Tarn, y
      buitres en vuelo. Para algo mayor, Corniches du Méjean es un circuito desde Le Rozier de 11,5 km, unas
      cuatro horas y media y 954 m de desnivel positivo, con vistas sobre los buitres europeos. Pasa por el
      Balcon du Vertige, el Pas du Loup, el Vase de Chine y el Vase de Sèvres; el Balcon du Vertige domina
      casi 400 m el cauce del Jonte y, a sus pies, está el Belvédère des vautours, abierto desde 1998. No se
      recomienda a quien sufra vértigo, porque bordea cornisas; hay que cerrar las vallas y portillos al
      pasar.


      La corniche del Causse Méjean, entre Le Rozier y Les Vignes, es una serie de rocas y arcos de dolomía
      sobre el Tarn; el Baousso del Biel es un arco de 40 m de altura. El Point Sublime es el mejor mirador
      sobre el cañón y debe su nombre a un punto semejante sobre el cañón del Colorado. Los Détroits son el
      punto más estrecho: el cañón tiene allí 500 m de profundidad y solo 1200 m separan los bordes de los dos
      causses; se llega en barca o canoa.


      Para informarte, la Maison du tourisme et du Parc national, en Florac, explica la oferta de
      descubrimiento y las reglas del corazón del parque, con una exposición interactiva, y abre todo el año.
      Cerca de Le Rozier, la Maison des vautours permite observar los buitres en directo y cuenta la
      reintroducción emprendida desde 1980 por el Parque Nacional de Cévennes.
    history: >-
      Los Causses y las Cévennes están inscritos juntos desde 2011 en el Patrimonio Mundial de la UNESCO como
      paisaje cultural del agropastoralismo mediterráneo. Los paisajes de las tierras altas de los Causses los
      ha modelado el agropastoralismo durante tres milenios, y desde el siglo IX los monjes practicaban la
      cría de ovejas y la trashumancia: sus monasterios acabaron poseyendo grandes pastos de recorrido y de
      verano en los causses Noir y Méjean.


      Un detalle práctico: el puente de Sainte-Énimie, que sustituyó a un vado, se construyó en el siglo XIII.
      Es el único acceso al Causse Méjean desde las gargantas del Tarn autorizado para autobuses y camiones de
      más de 19 toneladas.
    before: >-
      En las crecidas de primavera y otoño, el parque pide informarse del estado del Tarn y adaptar el equipo
      a las condiciones del día. La afluencia es alta en Sainte-Énimie en julio y agosto, y baja en primavera
      y otoño; la temporada recomendada va de mayo a octubre.
    around: >-
      El [Parque Nacional de las Cevenas](/lugar/parc-national-des-cevennes/) está pegado a las gargantas, y
      las [Gargantas del Jonte](/lugar/gorges-de-la-jonte/) forman parte de ellas.


      Más lejos, el [Parque Natural Regional del Verdon - Grandes
      Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/) comparte la chova piquirroja y los buitres;
      el [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) y el [Parque Natural de Els
      Ports](/lugar/parc-natural-dels-ports/), el buitre negro y el buitre leonado.
  en:
    intro: >-
      A river with no surface tributaries for 52 kilometres that nonetheless swells with every bend. Between
      Quézac and Le Rozier, the Tarn receives subterranean surges from some 170 karstic resurgences, having
      carved out over 53 km an imposing gorge 400 to 600 m deep between the vast limestone plateaus of the
      Grands Causses. These are the Gorges du Tarn: a sheer vertical rift with dolomite cliffs, vultures
      circling high overhead, a surprisingly Mediterranean microclimate along the valley floor, and a
      continuous trail threading from Florac to Le Rozier.
    landscape: "To grasp the origin of the gorges, one must look back to the Miocene, when the tectonic uplift of the Alpine orogeny hoisted the Massif Central, elevating the Causses to an average altitude of 800 m in the north and 1000 m in the south. Relentless fluvial erosion subsequently incised the valleys. The canyons of the Tarn, Jonte, Dourbie, and Vis slice through these sprawling, steppe-like limestone tablelands. Between Les Vignes and Le Rozier the geological architecture is stark: Mesozoic limestones capped by precipitous dolomite palisades.\r\n\r\nWater carves the canyon from within. Around forty resurgences have been inventoried along the Tarn; the spring at Cénaret feeds a small subterranean lake 30 m across and eight metres deep inside the cave of the same name. Fault zones near Sainte-Énimie produce two powerful springs—the Fontaine de Burle and Coussac, which cascades straight into the Tarn. At the Fontaine de Salce, iron oxide stains the water deep red along the boundary between schist and limestone. At Pas de Soucy, a colossal rock collapse has choked the chasm, forcing the Tarn entirely underground before it emerges downstream.\r\n\r\nVolcanic vestiges also endure: a twin basalt neck in Sauveterre, crowned by the village itself, and basalt intrusions at Eglazines within the gorge.\r\n\r\nThe canyon climate is far milder than that of the surrounding windswept highlands, bathed in intense sunlight. Emerging from Capluc, southern-facing terraces sheltered by cliffs nurture the northernmost Mediterranean vegetation in the region: narrow-leaved ash, wild jasmine, Montpellier maple, and holm oak. Along the riverbanks grow beeches, occupying an unusual niche in this warm microclimate because the Tarn waters their roots continuously. High up the crags, in nearly inaccessible breaches, cling relic groves of Salzmann pine."
    wildlife: "Cast your gaze skyward. Soaring on thermals are the [Egyptian vulture](/especie/neophron_percnopterus/), which recolonized naturally after a prolonged absence, the reintroduced [griffon vulture](/especie/gyps_fulvus/), and the [cinereous vulture](/especie/aegypius_monachus/). Griffon vulture reintroduction began in 1982 in these gorges, followed by cinereous vultures (1992) and the [bearded vulture](/especie/gypaetus_barbatus/) (2012), while only the Egyptian vulture returned unassisted in 1986. Sharing these skies are the black kite, [osprey](/especie/pandion_haliaetus/), short-toed snake eagle, [peregrine falcon](/especie/falco_peregrinus/), and [golden eagle](/especie/aquila_chrysaetos/).\r\n\r\nThe seasons dictate wildlife activity. During the colder months, the [wallcreeper](/especie/tichodroma_muraria/) and alpine accentor overwinter on the vertical rock faces; as days lengthen, the [white-throated dipper](/especie/cinclus_cinclus/) bobs vigorously along mountain currents. In the river itself, the [Eurasian beaver](/especie/castor_fiber/), reintroduced along the Tarn, maintains a rapidly growing population, active primarily at night, dawn, and dusk. River currents also support brown trout, gudgeon, and Mediterranean barbel.\r\n\r\nThe cliffs and riparian habitats nurture numerous Causses endemics, such as Pinguicula caussensis on dripping limestone walls, Arenaria hispida, Aquilegia viscosa, and Armeria girardii. The gorges are exceptionally rich in wild orchids: green-winged orchid, military orchid, monkey orchid, lady orchid, and the endemic Ophrys aymoninii. Underground caverns shelter scarce bats including greater mouse-eared bats and horseshoe bats, while the Castelbouc cave harbors two endemic aquatic snails: Bythinella bouloti and Bythinella galerae."
    visit: "The gorges can be experienced on foot and, along several reaches, by canoe or kayak. The long-distance foot trail traverses the entire canyon from Florac to Le Rozier across five walking stages: it totals 66.9 km and is rated moderate. Several sections are ideally suited to canoeing. The stage between Les Vignes and Le Rozier spans 12 km with 435 m of ascent, passing beneath crags where raptors nest; on its final approach, the trail reaches Le Rozier along an easier gradient after passing above La Sablière.\r\n\r\nFor an accessible initial excursion, the Birds of the Causses and Gorges interpretive trail is an easy loop of 2.8 km taking about an hour and a half, with 91 m of ascent and 92 m of descent: it offers wonderful birdwatching amid the rim scrub of Causse Méjean above the Tarn. For a longer challenge, the Corniches du Méjean circuit from Le Rozier spans 11.5 km, taking around four and a half hours with 954 m of positive elevation gain and breathtaking vantage points over soaring vultures. It takes in the Balcon du Vertige, Pas du Loup, Vase de Chine, and Vase de Sèvres; the Balcon du Vertige overhangs the Jonte canyon by nearly 400 m, with the Belvédère des vautours below, open to visitors since 1998. It is not recommended for those prone to vertigo; be sure to close all livestock gates.\r\n\r\nThe Causse Méjean cliff line between Le Rozier and Les Vignes features sculpted dolomite towers and natural arches, including the Baousso del Biel, a 40 m stone arch. The Point Sublime is the premier panoramic lookout over the canyon, named after its Colorado counterpart. Les Détroits form the narrowest gorge section: the canyon here plunges 500 m deep while barely 1200 m separate the opposing rim edges; it can be explored by boat or canoe.\r\n\r\nFor practical guidance, the Maison du tourisme et du Parc national in Florac provides interactive exhibits and park regulations, open year-round. Near Le Rozier, the Maison des vautours offers direct spotting scopes and chronicles the reintroduction programme led since 1980 by Cévennes National Park."
    history: "The Causses and Cévennes were collectively inscribed in 2011 on the UNESCO World Heritage list as an outstanding agro-pastoral cultural landscape. The highland plains of the Causses have been shaped by three millennia of grazing traditions, and from the ninth century monastic orders managed sheep rearing and seasonal transhumance, their abbeys eventually controlling extensive summer rangelands across Causse Noir and Causse Méjean.\r\n\r\nA practical architectural landmark: the bridge at Sainte-Énimie, replacing an ancient river ford, was erected in the thirteenth century. It remains the sole bridge across the Tarn gorges accessing Causse Méjean that accommodates buses and trucks exceeding 19 tonnes."
    before: >-
      During spring and autumn spates, park officials urge visitors to monitor the flow conditions of the Tarn
      and adapt equipment accordingly. Visitation peaks heavily in Sainte-Enimie throughout July and August,
      while remaining peaceful in spring and autumn; the recommended hiking season runs from May to October.
    around: "[Cévennes National Park](/lugar/parc-national-des-cevennes/) lies directly adjacent to the gorges, and the [Jonte Gorges](/lugar/gorges-de-la-jonte/) are an integral part of the same canyon system.\r\n\r\nFurther afield, [Verdon Regional Natural Park - Grand Canyon](/lugar/parc-naturel-regional-du-verdon---gorges/) shares red-billed choughs and breeding vultures, while [Monfragüe National Park](/lugar/parque-nacional-de-monfrague/) and [Els Ports Natural Park](/lugar/parc-natural-dels-ports/) share cinereous and griffon vultures."
  fr:
    intro: >-
      Une rivière sans le moindre affluent de surface sur 52 kilomètres et qui, pourtant, grossit à chaque
      pas. Entre Quézac et Le Rozier, le Tarn recueille les eaux d'environ 170 résurgences karstiques, ayant
      creusé sur 53 km un défilé de 400 à 600 m de profondeur entre les plateaux calcaires des Grands Causses.
      Ce sont les gorges du Tarn : une entaille vertigineuse aux falaises dolomitiques, des vautours planant
      le long des corniches, un microclimat presque méditerranéen au fond de la vallée et un sentier continu
      qui les relie de Florac au Rozier.
    landscape: "Pour comprendre la genèse des gorges, il faut remonter au Miocène, lorsque la poussée alpine souleva le Massif central et porta les Causses à une altitude moyenne de 800 m au nord et 1000 m au sud. Une érosion torrentielle acharnée entailla ensuite les plateaux. Les gorges du Tarn, de la Jonte, de la Dourbie et de la Vis tranchent ainsi ces vastes étendues calcaires aux allures de steppe. Entre Les Vignes et Le Rozier, l'architecture géologique est saisissante : calcaires secondaires couronnés de grandes parois verticales dolomitiques.\r\n\r\nL'eau façonne le relief de l'intérieur. On dénombre une quarantaine de résurgences le long du cours d'eau ; celle de Cénaret alimente un petit lac souterrain de 30 m de diamètre et huit mètres de profondeur au cœur de la grotte éponyme. Les failles du secteur de Sainte-Énimie engendrent deux émergences majeures, la source de Burle et celle de Coussac, qui cascade dans le Tarn. À la source de Salce, l'oxyde de fer teinte les eaux de rouille au contact entre schistes et calcaires. Et au Pas de Soucy, un gigantesque éboulement barre la vallée, contraignant le Tarn à disparaître sous les blocs avant de resurgir en aval.\r\n\r\nLe volcanisme a également laissé son empreinte : un double culot basaltique à Sauveterre, qui porte le village, et des filons de basalte à Eglazines, au sein même du canyon.\r\n\r\nLe climat des gorges s'avère bien plus doux que celui des causses balayés par les vents, bénéficiant d'un ensoleillement généreux. Dès la sortie de Capluc, les terrasses exposées au sud et abritées des falaises accueillent la végétation méditerranéenne la plus septentrionale de la contrée : frêne à feuilles étroites, jasmin sauvage, érable de Montpellier et chêne vert. En fond de gorge prospèrent des hêtres, occupant une niche singulière en ambiance subméditerranéenne grâce à l'humidité constante apportée à leurs racines par le Tarn. Tout en haut des falaises, dans des vires inaccessibles, subsistent des îlots de pin de Salzmann."
    wildlife: "Levez les yeux vers le ciel. Dans les airs évoluent le [vautour percnoptère](/especie/neophron_percnopterus/), revenu spontanément après une longue éclipse, le [vautour fauve](/especie/gyps_fulvus/), réintroduit, et le [vautour moine](/especie/aegypius_monachus/). La réintroduction du vautour fauve débuta en 1982 dans ces gorges, suivie de celle du vautour moine (1992) et du [gypaète barbu](/especie/gypaetus_barbatus/) (2012), seul le percnoptère ayant reconquis son territoire par ses propres moyens en 1986. Plus haut encore patrouillent le milan noir, le [balbuzard pêcheur](/especie/pandion_haliaetus/), le circaète Jean-le-Blanc, le [faucon pèlerin](/especie/falco_peregrinus/) et l'[aigle royal](/especie/aquila_chrysaetos/).\r\n\r\nLes saisons rythment la vie sauvage. En hivernage, le [tichodrome échelette](/especie/tichodroma_muraria/) et l'accenteur alpin hantent les à-pics ; dès les beaux jours, le [cincle plongeur](/especie/cinclus_cinclus/) s'active le long des rapides. Dans la rivière, le [castor d'Europe](/especie/castor_fiber/), réintroduit sur le Tarn, présente une population florissante, s'activant à la nuit tombée ou aux lueurs de l'aube. Les eaux abritent également la truite fario, le goujon et le barbeau méridional.\r\n\r\nLes parois et ripisylves rassemblent nombre d'endémiques caussenardes, telle la grassette des Causses sur les tufs suintants, la sabline de Lozère, l'ancolie des Causses et l'armérie de Girard. Les gorges se révèlent d'une richesse exceptionnelle en orchidées : orchis bouffon, orchis militaire, orchis singe, orchis pourpre et l'endémique ophrys d'Aymonin. Les grottes abritent des chauves-souris rares, grands murins et rhinolophes, tandis que la cavité de Castelbouc héberge deux mollusques aquatiques endémiques : Bythinella bouloti et Bythinella galerae."
    visit: "Les gorges se parcourent à pied et, sur de nombreux tronçons, en canoë. Le sentier de grande randonnée suit le fond du canyon de Florac au Rozier en cinq étapes : il cumule 66,9 km et présente une difficulté modérée. Divers tronçons se prêtent admirablement à la descente en canoë. L'étape Les Vignes–Le Rozier totalise 12 km pour 435 m de montée et passe sous d'immenses falaises où nichent les rapaces ; dans sa portion finale, le sentier gagne Le Rozier par un tracé aisé après avoir surplombé La Sablière.\r\n\r\nPour une première sortie familiale, le sentier d'interprétation Oiseaux des Causses et des Gorges est une boucle très accessible de 2,8 km nécessitant une heure et demie pour 91 m de dénivelé positif et 92 m de descente : il permet d'observer l'avifaune sur la bordure du causse Méjean au-dessus du Tarn et les vautours en vol. Pour une randonnée d'envergure, le circuit des Corniches du Méjean au départ du Rozier compte 11,5 km, environ quatre heures et demie de marche et 954 m de dénivelé cumulé, offrant des vues plongeantes spectaculaires sur les grands rapaces. Il franchit le balcon du Vertige, le pas du Loup, le vase de Chine et le vase de Sèvres ; le balcon du Vertige surplombe de près de 400 m les gorges de la Jonte et fait face au belvédère des vautours, inauguré en 1998. Cet itinéraire est déconseillé aux personnes sujettes au vertige ; veillez à refermer barrières et clôtures après votre passage.\r\n\r\nLa corniche du causse Méjean, entre Le Rozier et Les Vignes, déroule une succession de monolithes et d'arches dolomitiques au-dessus du Tarn ; le Baousso del Biel est une arche colossale de 40 m de haut. Le Point Sublime constitue le plus célèbre belvédère sur le canyon, baptisé en référence à un point de vue analogue sur le Colorado. Les Détroits forment le passage le plus resserré : le canyon y atteint 500 m de profondeur alors que seuls 1200 m séparent les rebords des deux causses ; on y accède en barque ou en canoë.\r\n\r\nPour organiser sa visite, la Maison du tourisme et du Parc national à Florac détaille les circuits de découverte et la réglementation avec une exposition interactive permanente. Près du Rozier, la Maison des vautours propose une observation directe aux longues-vues et retrace la réintroduction engagée depuis 1980 par le parc national des Cévennes."
    history: "Les Causses et les Cévennes sont inscrits depuis 2011 au patrimoine mondial de l'UNESCO au titre des paysages culturels de l'agropastoralisme méditerranéen. Les hauts plateaux caussenards ont été forgés par trois millénaires de pastoralisme, et dès le IXe siècle les ordres monastiques pratiquaient l'élevage ovin et la transhumance, leurs abbayes détenant d'immenses parcours d'estive sur le causse Noir et le causse Méjean.\r\n\r\nRepère pratique d'importance : le pont de Sainte-Énimie, qui a succédé à un ancien gué, fut édifié au XIIIe siècle. Il constitue l'unique accès routier au causse Méjean depuis les gorges du Tarn autorisé aux autocars et poids lourds de plus de 19 tonnes."
    before: >-
      Lors des crues de printemps et d'automne, le parc recommande de vérifier le débit du Tarn et d'adapter
      son équipement aux conditions météorologiques. L'affluence est très soutenue à Sainte-Énimie en juillet
      et août, redevenant paisible au printemps et à l'automne ; la période idéale s'étend de mai à octobre.
    around: "Le [parc national des Cévennes](/lugar/parc-national-des-cevennes/) jouxte directement les gorges, et les [gorges de la Jonte](/lugar/gorges-de-la-jonte/) s'intègrent dans le même ensemble paysager.\r\n\r\nPlus loin, le [parc naturel régional du Verdon - Grandes Gorges](/lugar/parc-naturel-regional-du-verdon---gorges/) accueille le crave à bec rouge et les vautours, tandis que le [parc national de Monfragüe](/lugar/parque-nacional-de-monfrague/) et le [parc naturel d'Els Ports](/lugar/parc-natural-dels-ports/) partagent les colonies de vautours moines et fauves."
  de:
    intro: >-
      Ein Fluss ohne jeden oberirdischen Zufluss auf 52 Kilometern, der dennoch mit jedem Kilometer
      anschwillt. Zwischen Quézac und Le Rozier speisen rund 170 Karstquellen den Tarn, der auf einer Länge
      von 53 km eine 400 bis 600 m tiefe Schlucht zwischen den Kalkhochflächen der Grands Causses
      herausgearbeitet hat. Es sind die Gorges du Tarn: eine gewaltige vertikale Felsspalte mit Dolomitwänden,
      kreisenden Geiern an den Felsrändern, einem fast mediterranen Talklima und einem durchgehenden Wanderweg
      von Florac bis Le Rozier.
    landscape: "Um die Schlucht zu verstehen, muss man ins Miozän blicken, als die alpidische Gebirgsbildung das Zentralmassiv emporhob und die Causses auf durchschnittlich 800 m im Norden und 1000 m im Süden anhob. Kraftvolle Tiefenerosion schnitt daraufhin die Täler ein. Die Canyons von Tarn, Jonte, Dourbie und Vis zerteilen diese weiten, steppenartigen Hochplateaus. Zwischen Les Vignes und Le Rozier ist der geologische Aufbau klar gegliedert: jurassische Kalke, die in senkrechten Felsbastionen aus Dolomit gipfeln.\r\n\r\nDas Wasser wirkt aus der Tiefe. Entlang des Tarns wurden rund vierzig Karstquellen gezählt; die Quelle von Cénaret speist einen unterirdischen See von 30 m Durchmesser und acht Metern Tiefe in der gleichnamigen Höhle. Bruchzonen bei Sainte-Énimie speisen zwei schüttungsstarke Quellen: die Fontaine de Burle und die Quelle von Coussac, die kaskadenartig in den Tarn stürzt. An der Quelle von Salce färbt Eisenoxid das Wasser rot, direkt an der Kontaktzone von Schiefer und Kalkstein. Am Pas de Soucy versperrt ein gewaltiger Felssturz das Tal, sodass der Tarn unter den Trümmern verschwindet und erst flussabwärts wieder austritt.\r\n\r\nAuch vulkanische Relikte sind präsent: ein doppelter Basaltschlot in Sauveterre, auf dem das Dorf thront, sowie Basaltgänge bei Eglazines im Canyon.\r\n\r\nDas Klima der Schlucht ist weitaus milder als das der windigen Hochflächen und verwöhnt von viel Sonne. Unterhalb von Capluc bieten südexponierte, von Felswänden geschützte Hangterrassen der nördlichsten mediterranen Pflanzengesellschaft der Region Zuflucht: Schmalblättrige Esche, Wilder Jasmin, Französischer Ahorn und Steineiche. Im Tal wachsen Rotbuchen, die hier in submediterranem Klima gedeihen, weil das Wasser des Tarn ihren Wurzeln kontinuierlich Feuchtigkeit zuführt. Hoch oben an unzugänglichen Felsvorsprüngen überdauern Reliktbestände der Salzmann-Kiefer."
    wildlife: "Blicke nach oben. Am Himmel kreisen der [Schmutzgeier](/especie/neophron_percnopterus/), der nach langer Abwesenheit spontan zurückkehrte, der wiederangesiedelte [Gänsegeier](/especie/gyps_fulvus/) und der [Mönchsgeier](/especie/aegypius_monachus/). Die Wiederansiedlung des Gänsegeiers begann 1982 in dieser Schlucht; später folgten Mönchsgeier (1992) und [Bartgeier](/especie/gypaetus_barbatus/) (2012), während der Schmutzgeier 1986 aus eigener Kraft zurückkehrte. Darüber hinaus fliegen Schwarzmilan, [Fischadler](/especie/pandion_haliaetus/), Schlangenadler, [Wanderfalke](/especie/falco_peregrinus/) und [Steinadler](/especie/aquila_chrysaetos/).\r\n\r\nDie Jahreszeiten bestimmen den Rhythmus. Im Winter überwintern an den Steilwänden der [Mauerläufer](/especie/tichodroma_muraria/) und die Alpenbraunelle; bei Frühlingsbeginn wird die [Wasseramsel](/especie/cinclus_cinclus/) am Wildwasser aktiv. Im Fluss weist der im Tarn wiederangesiedelte [Europäische Biber](/especie/castor_fiber/) eine stetig wachsende Population auf, meist dämmerungs- und nachtaktiv. Im Wasser leben Bachforelle, Gründling und Mittelmeerbarbe.\r\n\r\nFelswände und Ufersäume beherbergen Causses-Endemiten wie das Fettkraut Pinguicula caussensis an feuchten Felswänden, Arenaria hispida, Aquilegia viscosa und Armeria girardii. Die Schluchten sind außerordentlich reich an Orchideenarten: Kleines Knabenkraut, Helm-Knabenkraut, Affen-Knabenkraut, Purpur-Knabenkraut sowie die endemische Aymonin-Ragwurz. Die Karsthöhlen bieten seltenen Fledermäusen wie Mausohren und Hufeisennasen Unterschlupf, und die Höhle von Castelbouc beherbergt zwei endemische Wasserschnecken: Bythinella bouloti und Bythinella galerae."
    visit: "Die Schlucht lässt sich zu Fuß und in vielen Abschnitten auch mit dem Kanu erkunden. Der Hauptwanderweg führt in fünf Tagesetappen von Florac bis Le Rozier: Er umfasst 66,9 km und ist als mittelschwer eingestuft. Mehrere Passagen eignen sich hervorragend für Kanutouren. Der Abschnitt Les Vignes–Le Rozier erstreckt sich über 12 km mit 435 m Anstieg unter Nistwänden von Greifvögeln; auf dem letzten Teilstück erreicht der Pfad Le Rozier sanft absteigend oberhalb von La Sablière.\r\n\r\nFür eine kurze Einstiegstour bietet der Lehrpfad Birds of the Causses and Gorges eine leichte Runde von 2,8 km, die anderthalb Stunden beansprucht und 91 m Aufstieg sowie 92 m Abstieg überwindet: Er erlaubt Vogelbeobachtungen am Plateaurand des Causse Méjean über dem Tarn und Geiersichtungen. Ambitionierter ist die Rundwanderung Corniches du Méjean ab Le Rozier mit 11,5 km, rund vier Stunden und einer halben Stunde Gehzeit und 954 m Gesamtanstieg, die spektakuläre Blicke auf kreisende Geier bietet. Sie passiert den Balcon du Vertige, den Pas du Loup, die Felsformationen Vase de Chine und Vase de Sèvres; der Balcon du Vertige ragt fast 400 m über die Jonte-Schlucht empor, direkt über dem 1998 eröffneten Belvédère des vautours. Die Route ist schwindelfreien Wanderern vorbehalten; Weidegatter müssen geschlossen werden.\r\n\r\nDie Felskante des Causse Méjean zwischen Le Rozier und Les Vignes zeigt Dolomittürme und Naturtore über dem Fluss; der Baousso del Biel ist ein 40 m hohes Felsentor. Der Point Sublime ist der berühmteste Aussichtspunkt über den Canyon, benannt nach dem Colorado-Pendant. Les Détroits markieren die engste Schluchtpassage: Die Schlucht ist hier 500 m tief und nur 1200 m trennen die Ränder der beiden Hochebenen; erreichbar per Boot oder Kanu.\r\n\r\nFür Auskünfte informiert das Haus des Nationalparks in Florac ganzjährig mit einer Ausstellung über Touren und Schutzbestimmungen. Nahe Le Rozier ermöglicht das Geierzentrum Maison des vautours direkte Fernrohrbeobachtungen und dokumentiert das 1980 vom Nationalpark Cevennen initiierte Wiederansiedlungsprojekt."
    history: "Die Causses und die Cevennen wurden 2011 gemeinsam als mediterrane Kulturlandschaft der Wanderschäferei in das UNESCO-Welterbe aufgenommen. Die Hochflächen der Causses wurden über drei Jahrtausende von der Weidewirtschaft geformt, und ab dem neunten Jahrhundert betrieben Mönchsorden Schafzucht und Transhumanz, wobei ihre Klöster weitläufige Sommerweiden auf den Causses Noir und Méjean besaßen.\r\n\r\nEin verkehrstechnisches Denkmal: Die Brücke von Sainte-Énimie, die eine frühere Furt ersetzte, wurde im dreizehnten Jahrhundert erbaut. Sie ist die einzige Zufahrt von den Schluchten auf den Causse Méjean, die für Busse und Lastkraftwagen von mehr als 19 Tonnen zugelassen ist."
    before: >-
      Bei Hochwasser im Frühjahr und Herbst bittet die Parkverwaltung darum, den Pegelstand des Tarns zu
      prüfen und die Ausrüstung anzupassen. Der Besucherandrang ist in Sainte-Énimie im Juli und August hoch,
      im Frühjahr und Herbst dagegen beschaulich; die empfohlene Reisezeit erstreckt sich von Mai bis Oktober.
    around: "Der [Nationalpark Cevennen](/lugar/parc-national-des-cevennes/) grenzt unmittelbar an die Schluchten an, und die [Jonte-Schlucht](/lugar/gorges-de-la-jonte/) ist landschaftlich eng mit ihnen verbunden.\r\n\r\nWeiter entfernt teilt der [Regionale Naturpark Verdon - Grand Canyon](/lugar/parc-naturel-regional-du-verdon---gorges/) Alpenkrähen und Geierfelsen, während der [Nationalpark Monfragüe](/lugar/parque-nacional-de-monfrague/) und der [Naturpark Els Ports](/lugar/parc-natural-dels-ports/) Vorkommen von Mönchs- und Gänsegeiern gemein haben."
  it:
    intro: >-
      Un fiume privo di affluenti in superficie per 52 chilometri che, ciononostante, si accresce a ogni ansa.
      Tra Quézac e Le Rozier il Tarn riceve la portata di circa 170 risorgenze carsiche, avendo scavato lungo
      53 km una forra spettacolare profonda da 400 a 600 m tra gli altopiani calcarei dei Grands Causses. Sono
      le Gole del Tarn: una spaccatura verticale scandita da pareti dolomitiche, avvoltoi in volo circolare,
      un clima quasi mediterraneo sul fondo e un sentiero continuo che le solca da Florac a Le Rozier.
    landscape: "Per comprendere la genesi delle gole bisogna risalire al Miocene, quando il sollevamento dell'orogenesi alpina spinse verso l'alto il Massiccio Centrale elevando i Causses a una quota media di 800 m a nord e 1000 m a sud. Un'intensa erosione incise successivamente le valli. Le gole del Tarn, della Jonte, della Dourbie e della Vis sezionano questi vasti spazi aperti di fisionomia steppica. Tra Les Vignes e Le Rozier l'architettura geologica è lineare e maestosa: calcari secondari culminanti in alte bastionate dolomitiche verticali.\r\n\r\nL'acqua modella la gola dall'interno. Sono state censite una quarantina di risorgenze lungo il corso del fiume; quella di Cénaret alimenta un lago sotterraneo di 30 m di diametro e otto metri di profondità entro la cavità omonima. Le faglie della conca di Sainte-Énimie originano due scaturigini copiose: la fonte di Burle e quella di Coussac, che precipita a cascata nel Tarn. Presso la sorgente di Salce l'ossido di ferro tinge le acque di rosso, in una fascia di contatto tra scisti e calcari. E al Pas de Soucy una titanica frana ostruisce il fondovalle, inghiottendo il Tarn che scorre sotterraneo prima di riaffiorare poco oltre.\r\n\r\nNon mancano tracce vulcaniche: un duplice neck basaltico a Sauveterre, su cui si arrocca il paese, e intrusioni basaltiche a Eglazines, nel cuore del canyon.\r\n\r\nIl clima della gola è assai più mite di quello degli altopiani ventosi, beneficiando di un soleggiamento prolungato. Superata Capluc, le terrazze rivolte a mezzogiorno e riparate dalle falesie accolgono la vegetazione mediterranea più settentrionale della regione: frassino ossifillo, gelsomino selvatico, acero minore e leccio. Sul fondovalle allignano i faggi, che occupano una nicchia insolita in contesto submediterraneo grazie all'umidità costante che il Tarn assicura alle radici. Lungo i cornicioni sommitali delle pareti rocciose resistono isolate pinete di pino di Salzmann."
    wildlife: "Alza lo sguardo al cielo. Nelle correnti ascensionali volteggiano il [capovaccaio](/especie/neophron_percnopterus/), ricomparso spontaneamente dopo una lunga assenza, il [grifone](/especie/gyps_fulvus/), reintrodotto, e l'[avvoltoio monaco](/especie/aegypius_monachus/). La reintroduzione del grifone prese avvio nel 1982 in queste gole, seguita da quella dell'avvoltoio monaco (1992) e del [gipeto](/especie/gypaetus_barbatus/) (2012), mentre soltanto il capovaccaio è tornato autonomamente nel 1986. Nei cieli volteggiano anche il nibbio bruno, il [falco pescatore](/especie/pandion_haliaetus/), il biancone, il [falco pellegrino](/especie/falco_peregrinus/) e l'[aquila reale](/especie/aquila_chrysaetos/).\r\n\r\nL'avvicendarsi stagionale impone i ritmi. Nei mesi invernali stazionano sulle pareti il [picchio muraiolo](/especie/tichodroma_muraria/) e il sordone; con la bella stagione, il [merlo acquaiolo](/especie/cinclus_cinclus/) frequenta vivacemente le correnti rapide. Nelle acque del fiume, il [castoro europeo](/especie/castor_fiber/), reintrodotto nel Tarn, vanta una popolazione in costante espansione, attivo principalmente al crepuscolo e di notte. Il fiume ospita trote fario, ghiozzi e barbi meridionali.\r\n\r\nLe pareti e la vegetazione ripariale accolgono molte specie endemiche dei Causses, come la pinguicola dei Causses sui calcari stillicidiosi, la sabline di Lozère, l'aquilegia dei Causses e l'armeria di Girard. Le gole presentano una straordinaria concentrazione di orchidee selvatiche: orchide pagliaccio, orchide militare, orchide scimmia, orchide purpurea e l'endemica ophrys d'Aymonin. Le grotte offrono rifugio a chirotteri rari quali vespertili maggiori e ferri di cavallo, mentre la grotta di Castelbouc ospita due molluschi acquatici endemici: Bythinella bouloti e Bythinella galerae."
    visit: "Le gole si percorrono a piedi e, per lunghi tratti, in canoa. Il percorso escursionistico principale copre l'intero canyon da Florac a Le Rozier in cinque tappe: misura 66,9 km ed è classificato come moderato. Vari settori si prestano alla navigazione in canoa. La tappa Les Vignes–Le Rozier si snoda per 12 km con 435 m di dislivello positivo sotto le pareti dove nidificano i rapaci; nel tratto finale, il tracciato scende a Le Rozier con pendenza dolce dopo aver dominato La Sablière.\r\n\r\nPer una prima escursione di breve durata, il sentiero didattico Birds of the Causses and Gorges è un facile anello di 2,8 km che richiede un'ora e mezza con 91 m di salita e 92 m di discesa: consente di ascoltare l'avifauna arbustiva lungo l'orlo del Causse Méjean e ammirare gli avvoltoi. Per una camminata più impegnativa, il circuito delle Corniches du Méjean con partenza da Le Rozier si articola per 11,5 km, circa quattro ore e mezza di marcia e 954 m di dislivello, con scorci panoramici vertiginosi sui rapaci in volo. Attraversa il Balcon du Vertige, il Pas du Loup, il Vase de Chine e il Vase de Sèvres; il Balcon du Vertige strapiomba per quasi 400 m sulle gole della Jonte, sovrastando il Belvédère des vautours, aperto dal 1998. Il sentiero è sconsigliato a chi soffre di vertigini; si raccomanda di richiudere i cancelli dei pascoli.\r\n\r\nLa cornice del Causse Méjean tra Le Rozier e Les Vignes mostra monoliti e archi di dolomia a strapiombo sul Tarn; il Baousso del Biel è un arco naturale alto 40 m. Il Point Sublime costituisce il belvedere più celebre, chiamato così in richiamo al canyon del Colorado. I Détroits rappresentano la strozzatura massima: il canyon scende per 500 m di profondità mentre solo 1200 m separano i margini dei due altopiani; vi si accede in barca o in canoa.\r\n\r\nPer pianificare la visita, la Maison du tourisme et du Parc national a Florac illustra gli itinerari e i regolamenti con un'esposizione interattiva permanente. Vicino a Le Rozier, la Maison des vautours permette osservazioni dirette con cannocchiali e racconta il programma di reintroduzione promosso dal 1980 dal Parco Nazionale delle Cevenne."
    history: "I Causses e le Cevenne sono iscritti congiuntamente dal 2011 nel Patrimonio Mondiale dell'UNESCO quale paesaggio culturale dell'agropastorizia mediterranea. Gli altipiani dei Causses sono stati plasmati da tre millenni di pastorizia, e a partire dal secolo IX gli ordini monastici praticavano l'allevamento ovino e la transumanza, arrivando a possedere immense distese di pascolo estivo sui causses Noir e Méjean.\r\n\r\nUn'opera viaria di rilievo storico: il ponte di Sainte-Énimie, sorto al posto di un antico guado, fu eretto nel secolo XIII. Costituisce l'unico varco carrabile di accesso al Causse Méjean dalle gole del Tarn abilitato al transito di autobus e autocarri superiori a 19 tonnellate."
    before: >-
      In concomitanza con le piene primaverili e autunnali, il parco raccomanda di verificare il livello delle
      acque del Tarn e conformare l'attrezzatura alle condizioni meteo. L'afflusso turistico è molto intenso a
      Sainte-Énimie a luglio e agosto, tornando tranquillo in primavera e autunno; il periodo ottimale va da
      maggio a ottobre.
    around: "Il [Parco Nazionale delle Cevenne](/lugar/parc-national-des-cevennes/) è a ridosso immediato delle gole, e le [Gole della Jonte](/lugar/gorges-de-la-jonte/) fanno parte del medesimo contesto paesaggistico.\r\n\r\nPiù lontano, il [Parco Naturale Regionale del Verdon - Grandi Gole](/lugar/parc-naturel-regional-du-verdon---gorges/) ospita gracchi corallini e colonie di avvoltoi, mentre il [Parco Nazionale di Monfragüe](/lugar/parque-nacional-de-monfrague/) e il [Parco Naturale di Els Ports](/lugar/parc-natural-dels-ports/) condividono la presenza di avvoltoi monaci e grifoni."
  pt:
    intro: >-
      Um rio sem afluentes à superfície ao longo de 52 quilómetros e que, ainda assim, avoluma o caudal a cada
      curva. Entre Quézac e Le Rozier, o Tarn recebe a alimentação subterrânea de cerca de 170 ressurgências
      cársicas, rasgando em 53 km um desfiladeiro vertical de 400 a 600 m de profundidade entalhado entre os
      planaltos calcários dos Grandes Causses. São as Gargantas do Tarn: um canhão imponente com falésias de
      dolomite, abutres planando nas alturas, um clima quase mediterrânico no fundo do vale e um trilho
      pedestre que as percorre de Florac a Le Rozier.
    landscape: "Para entender o desfiladeiro é preciso recuar ao Mioceno, quando o impulso da orogenia alpina soergueu o Maciço Central e elevou os Causses a uma altitude média de 800 m a norte e 1000 m a sul. Uma erosão incisiva escavou posteriormente os canhões. As gargantas do Tarn, da Jonte, da Dourbie e do Vis retalham estes vastos planaltos abertos de feição estepe. Entre Les Vignes e Le Rozier a arquitetura litológica é nítida: calcários secundários coroados por abruptas escarpas verticais de dolomite.\r\n\r\nA água opera a partir das entranhas da rocha. Contam-se cerca de quarenta ressurgências ao longo do Tarn; a de Cénaret abastece um pequeno lago subterrâneo com 30 m de diâmetro e oito metros de profundidade no interior da gruta homónima. As falhas tectónicas de Sainte-Énimie alimentam duas nascentes caudalosas: a fonte de Burle e a de Coussac, que se precipita em cascata no Tarn. Na nascente de Salce, o óxido de ferro tinge a água de vermelho, num contacto entre xistos e calcários. E no Pas de Soucy, um colossal desmoronamento obstrui o leito, forçando o Tarn a sumir sob os blocos rochosos antes de reaparecer mais adiante.\r\n\r\nRestam igualmente vestígios vulcânicos: um pitão basáltico duplo em Sauveterre, sobre o qual assenta a aldeia, e diques de basalto em Eglazines, na própria garganta.\r\n\r\nO clima do desfiladeiro é consideravelmente mais ameno do que o dos planaltos batidos pelo vento, beneficiando de insolação generosa. À saída de Capluc, os socalcos voltados a sul e abrigados pelas arribas acolhem a flora mediterrânica mais setentrional da região: freixo-de-folhas-estreitas, jasmim-silvestre, bordo-de-montpellier e azinheira. No fundo do vale vicejam faias, que preenchem um nicho invulgar em ambiente submediterrânico porque o fluxo constante do Tarn irriga as suas raízes. No cimo das escarpas inacessíveis resistem pequenos bosquetes de pinheiro-de-salzmann."
    wildlife: "Olha para o céu. Nas correntes térmicas plainam o [abutre-do-egito](/especie/neophron_percnopterus/), regressado por via natural após longa ausência, o [abutre-fouveiro](/especie/gyps_fulvus/), reintroduzido, e o [abutre-preto](/especie/aegypius_monachus/). O programa de reintrodução do grifo teve início em 1982 neste canhão; seguiram-se o abutre-preto (1992) e o [abutre-barbudo](/especie/gypaetus_barbatus/) (2012), tendo apenas o abutre-do-egito retornado autonomamente em 1986. Pelo ar cruzam-se ainda o milhafre-preto, a [águia-pesqueira](/especie/pandion_haliaetus/), a águia-cobreira, o [falcão-peregrino](/especie/falco_peregrinus/) e a [águia-real](/especie/aquila_chrysaetos/).\r\n\r\nO calendário estacional dita as presenças. No inverno procuram as escarpas a [trepadeira-dos-muros](/especie/tichodroma_muraria/) e a ferreirinha-alpina; quando os dias aquecem, o [melro-d'água](/especie/cinclus_cinclus/) percorre as correntes fluviais. No rio, o [castor-europeu](/especie/castor_fiber/), reintroduzido no Tarn, regista uma população em franca expansão, ativo sobretudo ao lusco-fusco e de noite. O ecossistema aquático acolhe trutas-fário, góbios e barbos-meridionais.\r\n\r\nAs paredes e as margens reúnem inúmeros endemismos dos Causses, como a pinguícula dos Causses em fendas gotejantes, a sabline de Lozère, a aquilégia dos Causses e a arméria de Girard. O vale prima por extraordinária profusão de orquídeas: erva-mouca, orquídea-militar, orquídea-macaco, orquídea-púrpura e a endémica Ophrys d'Aymonin. As grutas albergam morcegos cavernícolas raros, e na cavidade de Castelbouc vivem dois moluscos aquáticos endémicos: Bythinella bouloti e Bythinella galerae."
    visit: "O desfiladeiro pode ser percorrido a pé e, em muitos troços, descido em canoa. O trilho de grande rota percorre o canhão de Florac a Le Rozier em cinco jornadas pedestres: perfaz 66,9 km e classifica-se como moderado. Vários setores prestam-se à navegação em canoa. A etapa Les Vignes–Le Rozier estende-se por 12 km com 435 m de subida sob falésias alcantiladas onde nidificam rapinas; na aproximação final, o caminho atinge Le Rozier com declive suave após contornar La Sablière.\r\n\r\nPara um primeiro contacto curto, o trilho interpretativo Birds of the Causses and Gorges forma um circuito fácil de 2,8 km com duração de uma hora e meia, vencendo 91 m de subida e 92 m de descida: proporciona observação de aves nas matas marginais do Causse Méjean e avistamento de abutres. Em alternativa mais longa, o circuito das Corniches du Méjean a partir de Le Rozier soma 11,5 km, cerca de quatro horas e meia de marcha e 954 m de desnível acumulado, brindando os caminhantes com vistas panorâmicas sobre os abutres. Passa pelo Balcon du Vertige, Pas du Loup, Vase de Chine e Vase de Sèvres; o Balcon du Vertige eleva-se quase 400 m acima das gargantas da Jonte e tem a seus pés o Belvédère des vautours, inaugurado em 1998. O percurso desaconselha-se a quem sofra de vertigens; é obrigatório fechar cancelas e portões ao passar.\r\n\r\nA cornija do Causse Méjean entre Le Rozier e Les Vignes exibe monólitos e arcos de dolomite sobre o leito; o Baousso del Biel atinge 40 m de envergadura. O Point Sublime é o miradouro mais prestigiado sobre a fenda, batizado por comparação ao desfiladeiro do Colorado. Os Détroits constituem o setor mais apertado: a garganta atinge aí 500 m de profundidade e distam apenas 1200 m entre os topos dos dois causses; visita-se de barco ou canoa.\r\n\r\nPara apoio aos visitantes, a Maison du tourisme et du Parc national em Florac disponibiliza exposição interativa com informações e normas do parque, aberta todo o ano. Próximo de Le Rozier, a Maison des vautours permite observar os abutres com telescópios e relata o projeto de reintrodução encetado desde 1980 pelo Parque Nacional das Cevenas."
    history: "Os Causses e as Cevenas encontram-se inscritos em conjunto desde 2011 no Património Mundial da UNESCO enquanto paisagem cultural do agropastoralismo mediterrânico. As terras altas dos Causses foram moldadas por três milénios de pastoreio extensivo, e desde o século IX as congregações monásticas praticavam a pastorícia e a transumância ovina, passando os seus mosteiros a deter vastas pastagens de montanha nos causses Noir e Méjean.\r\n\r\nUm marco estrutural relevante: a ponte de Sainte-Énimie, erigida no século XIII em substituição de um antigo vau fluvial. É o único acesso rodoviário ao Causse Méjean a partir das gargantas do Tarn homologado para veículos de transporte coletivo e pesados de mercadorias com mais de 19 toneladas."
    before: >-
      Nas cheias sazonais da primavera e do outono, as autoridades recomendam consultar previamente o caudal
      do Tarn e adaptar o vestuário às condições meteorológicas. A afluência é muito elevada em Sainte-Énimie
      em julho e agosto, tornando-se serena na primavera e no outono; a época ideal situa-se entre maio e
      outubro.
    around: "O [Parque Nacional das Cevenas](/lugar/parc-national-des-cevennes/) confina diretamente com as gargantas, e as [Gargantas da Jonte](/lugar/gorges-de-la-jonte/) são parte integrante deste mesmo relevo.\r\n\r\nMais além, o [Parque Natural Regional de Verdon - Grandes Gargantas](/lugar/parc-naturel-regional-du-verdon---gorges/) partilha gralhas-de-bico-vermelho e abutres, enquanto o [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) e o [Parque Natural de Els Ports](/lugar/parc-natural-dels-ports/) acolhem abutres-pretos e abutres-fouveiros."
