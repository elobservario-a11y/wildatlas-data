resumen:
  es: >-
    Reserva RSPB de acantilados verticales repleta de miles de araos y alcas en la costa occidental de las
    Orcadas con la torre conmemorativa de Lord Kitchener.
  en: >-
    RSPB reserve of sheer cliffs packed with thousands of guillemots and razorbills on Orkney's west coast
    with Lord Kitchener's memorial tower.
  fr: >-
    Réserve RSPB de falaises verticales peuplées de milliers de guillemots et de petits pingouins sur la côte
    ouest des Orcades, avec la tour commémorative de Lord Kitchener.
  de: >-
    RSPB-Reservat mit senkrechten Klippen voller Tausender Trottellummen und Tordalke an der Westküste von
    Orkney mit dem Gedenkturm für Lord Kitchener.
  it: >-
    Riserva RSPB di scogliere verticali gremite di migliaia di urie e gazze marine sulla costa occidentale
    delle Orcadi con la torre commemorativa di Lord Kitchener.
  pt: >-
    Reserva RSPB de falésias verticais repleta de milhares de airos e tordas-mergulheiras na costa ocidental
    das Órcades com a torre comemorativa de Lord Kitchener.
unico:
  es: Una colonia de aves marinas a pie de camino, y en lo alto una torre en memoria de Kitchener.
  en: A seabird colony right beside the footpath, and on the summit a tower in memory of Kitchener.
  fr: Une colonie d'oiseaux marins au bord du sentier et, au sommet, une tour à la mémoire de Kitchener.
  de: Eine Seevogelkolonie direkt am Weg und oben ein Turm zum Gedenken an Kitchener.
  it: Una colonia di uccelli marini lungo il sentiero e, in cima, una torre in memoria di Kitchener.
  pt: Uma colónia de aves marinhas à beira do trilho, e no alto uma torre em memória de Kitchener.
observaciones:
  es: >-
    Del uno de abril al quince de agosto, durante la cría de las aves que anidan en el suelo, la RSPB pide
    mantener al perro cerca y, mejor, con correa corta. No se permiten barbacoas en ningún momento, por el
    riesgo de incendio para las personas, la fauna y los hábitats.


    No te acerques al borde de los acantilados.
texto:
  es:
    intro: >-
      Un cielo azul, un mar color azur, una alfombra de flores de colores y, abajo, el escándalo de una
      colonia de aves marinas. Así describe la RSPB una tarde soleada en Marwick Head, un gran cabo al sur de
      Birsay, en el oeste de la isla de Mainland, en Orcadas. Los acantilados se elevan casi noventa metros
      sobre el Atlántico y forman parte de un tramo de costa que baja hasta Stromness. Es una reserva de la
      RSPB, y a su manera cuenta toda Orcadas en una caminata: naturaleza, fauna, historia y vistas al mar.
    landscape: >-
      El suelo de Orcadas es casi por completo arenisca roja antigua, sobre todo del Devónico medio, y Marwick
      Head se asienta sobre ella. En Mainland, Rousay y Hoy hay colinas de arenisca que se elevan bruscamente
      y, en algunas costas del oeste, escarpados acantilados. Aquí son frágiles y se desmenuzan, y la erosión
      puede volver peligroso el suelo bajo los pies.


      Desde lo alto, en un día claro, se ve a lo lejos el Old Man of Hoy, y a menudo se distinguen barcas que
      izan nasas de cangrejo y bogavante del fondo. Y arriba, junto a la colonia, la alfombra de flores de
      colores.
    wildlife: >-
      En los meses de verano, miles de aves marinas vuelan en remolino sobre la pared. En los acantilados
      anidan [fulmares](/especie/fulmarus_glacialis/), [araos comunes](/especie/uria_aalge/),
      [alcas](/especie/alca_torda/), cormoranes y [gaviotas tridáctilas](/especie/rissa_tridactyla/); desde el
      mirador de la cima ves de cerca la colonia, con gaviotas y págalos patrullando el cielo sobre ella.


      En invierno, el protagonista cambia. En la orilla de Choin se reúnen a descansar y comer vuelvepiedras,
      correlimos oscuros y chorlitejos grandes, y frente a la costa abundan los patos marinos.


      Y hay un habitante discreto: el abejorro amarillo grande (Bombus distinguendus), una abeja rara cuya
      población británica solo se encuentra en el norte de Escocia.
    visit: >-
      Hay dos aparcamientos: uno amplio en la bahía de Marwick y otro, para unos seis coches, en Cumlaquoy.
      Desde el de la bahía sale un paseo muy bonito que sube por los acantilados hasta el monumento a
      Kitchener; se llega a lo alto también desde Cumlaquoy. El camino es de hierba, con algunas subidas
      empinadas, y puede estar mojado y resbaladizo. En la segunda mitad hay dos portillos estrechos.


      Arriba, el mirador te deja mirar directamente al corazón de la colonia y ver el gran número de aves que
      nidifican.
    history: >-
      El monumento a Kitchener domina el cabo. Se levantó en 1926 en memoria del ministro de Guerra de la
      Primera Guerra Mundial, que murió el 5 de junio de 1916 a bordo del HMS Hampshire, cuando el barco chocó
      con una mina a pocas millas de la costa, camino de Rusia. Con él murieron 736 hombres; el crucero se
      hundió con 737 a bordo y solo hubo doce supervivientes.


      Tras la guerra, los habitantes de Orcadas recaudaron fondos para el monumento, que se inauguró el 2 de
      julio de 1926. Mide cuarenta y ocho pies; la Orkney Heritage Society lo restauró en 2016 y levantó un
      muro con los nombres de todos los militares perdidos, que incluye también a los que murieron en el
      Laurel Crown, un dragaminas, en la misma zona.


      La reserva la gestiona la RSPB, que da la bienvenida a un acceso responsable conforme al código de
      acceso al campo escocés.
    before: >-
      Del uno de abril al quince de agosto, durante la cría de las aves que anidan en el suelo, la RSPB pide
      mantener al perro cerca y, mejor, con correa corta. No se permiten barbacoas en ningún momento, por el
      riesgo de incendio para las personas, la fauna y los hábitats.


      No te acerques al borde de los acantilados.
    around: >-
      [Hoy y el Old Man of Hoy](/lugar/hoy---old-man-of-hoy/) quedan a unos dieciocho kilómetros, el único
      vecino cercano del atlas. A más distancia, la [Reserva Natural de las
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), los [acantilados de
      Vestmanna](/lugar/vestmanna-bird-cliffs/), [Fair Isle](/lugar/fair-isle/) y [Stora
      Karlsö](/lugar/gotland/) comparten con Marwick Head el arao común y la alca.
  en:
    intro: >-
      A blue sky, an azure sea, a carpet of colourful flowers and, below, the clamour of a seabird colony.
      That is how the RSPB describes a sunny afternoon at Marwick Head, a great headland south of Birsay on
      the west of Mainland, Orkney. The cliffs rise nearly ninety metres above the Atlantic and form part of a
      stretch of coast running down to Stromness. It is an RSPB reserve, and in its own way it tells all of
      Orkney in a single walk: nature, wildlife, history and sea views.
    landscape: >-
      Orkney's rock is almost entirely Old Red Sandstone, mostly from the Middle Devonian, and Marwick Head
      sits upon it. On Mainland, Rousay and Hoy there are sandstone hills that rise sharply and, on some
      western coasts, steep cliffs. Here they are fragile and crumbly, and erosion can make the ground
      underfoot treacherous.


      From the top, on a clear day, you can see the Old Man of Hoy in the distance, and you often spot boats
      hauling crab and lobster creels from the seabed. And up above, beside the colony, lies the carpet of
      colourful flowers.
    wildlife: >-
      In the summer months, thousands of seabirds wheel across the cliff face. On the ledges nest [northern
      fulmars](/especie/fulmarus_glacialis/), [common guillemots](/especie/uria_aalge/),
      [razorbills](/especie/alca_torda/), shags and [black-legged kittiwakes](/especie/rissa_tridactyla/);
      from the summit viewpoint you see the colony at close quarters, with gulls and skuas patrolling the sky
      above it.


      In winter, the cast changes. On the shore at Choin, turnstones, purple sandpipers and ringed plovers
      gather to roost and feed, while offshore sea ducks abound.


      And there is a quiet resident: the great yellow bumblebee (*Bombus distinguendus*), a rare bee whose
      British population is now found only in northern Scotland.
    visit: >-
      There are two car parks: a large one at Marwick Bay and another, for around six cars, at Cumlaquoy. From
      the bay car park a lovely walk climbs along the cliffs to the Kitchener Memorial; you can also reach the
      top from Cumlaquoy. The path is grassy, with some steep climbs, and can be wet and slippery. In the
      second half there are two narrow kissing gates.


      At the top, the viewpoint lets you look straight into the heart of the colony and see the sheer number
      of breeding birds.
    history: >-
      The Kitchener Memorial crowns the headland. It was raised in 1926 in memory of the First World War
      Secretary of State for War, who died on 5 June 1916 aboard HMS Hampshire when the ship struck a mine a
      few miles offshore while bound for Russia. With him died 736 men; the cruiser sank with 737 aboard and
      only twelve survived.


      After the war, the people of Orkney raised funds for the memorial, which was unveiled on 2 July 1926. It
      stands forty-eight feet tall; the Orkney Heritage Society restored it in 2016 and built a wall bearing
      the names of all the servicemen lost, including those who died on the minesweeper Laurel Crown in the
      same waters.


      The reserve is managed by the RSPB, which welcomes responsible access in line with the Scottish Outdoor
      Access Code.
    before: >-
      From the first of April to the fifteenth of August, during the ground-nesting bird season, the RSPB asks
      visitors to keep dogs close and preferably on a short lead. Barbecues are not permitted at any time, due
      to the fire risk to people, wildlife and habitats.


      Do not go near the cliff edge.
    around: >-
      [Hoy and the Old Man of Hoy](/lugar/hoy---old-man-of-hoy/) lie about eighteen kilometres away, the only
      close neighbour in the atlas. Further afield, the [Sept-Îles Nature
      Reserve](/lugar/reserve-naturelle-des-sept-iles/), the [Vestmanna Bird
      Cliffs](/lugar/vestmanna-bird-cliffs/), [Fair Isle](/lugar/fair-isle/) and [Stora
      Karlsö](/lugar/gotland/) share the common guillemot and razorbill with Marwick Head.
  fr:
    intro: >-
      Un ciel bleu, une mer d'azur, un tapis de fleurs colorées et, en contrebas, le vacarme d'une colonie
      d'oiseaux marins. C'est ainsi que la RSPB décrit un après-midi ensoleillé à Marwick Head, un grand cap
      au sud de Birsay, dans l'ouest de l'île de Mainland, aux Orcades. Les falaises s'élèvent à près de
      quatre-vingt-dix mètres au-dessus de l'Atlantique et font partie d'un littoral qui descend jusqu'à
      Stromness. C'est une réserve de la RSPB qui, à sa manière, raconte toutes les Orcades en une promenade :
      nature, faune, histoire et vues sur la mer.
    landscape: >-
      Le sol des Orcades est presque entièrement constitué de vieux grès rouge, surtout du Dévonien moyen, et
      Marwick Head repose dessus. Sur Mainland, Rousay et Hoy s'élèvent brusquement des collines de grès et,
      sur certaines côtes occidentales, des falaises escarpées. Ici elles sont fragiles et friables, et
      l'érosion peut rendre le sol dangereux sous les pas.


      D'en haut, par temps clair, on aperçoit au loin le Old Man of Hoy, et l'on distingue souvent des bateaux
      relevant des casiers à crabes et à homards du fond marin. Et tout en haut, près de la colonie, s'étend
      le tapis de fleurs colorées.
    wildlife: >-
      Durant les mois d'été, des milliers d'oiseaux marins tourbillonnent devant la paroi. Sur les falaises
      nichent [fulmars boréaux](/especie/fulmarus_glacialis/), [guillemots de Troïl](/especie/uria_aalge/),
      [petits pingouins](/especie/alca_torda/), cormorans et [mouettes
      tridactyles](/especie/rissa_tridactyla/) ; depuis le belvédère du sommet, vous voyez la colonie de près,
      avec goélands et labbes patrouillant le ciel au-dessus.


      En hiver, le décor change. Sur le rivage de Choin se rassemblent pour se reposer et se nourrir
      tournepierre à collier, bécasseau violet et grand gravelot, et au large abondent les canards marins.


      Et il y a un habitant discret : le grand bourdon jaune (*Bombus distinguendus*), une abeille rare dont
      la population britannique ne subsiste plus que dans le nord de l'Écosse.
    visit: >-
      Il y a deux parkings : un grand dans la baie de Marwick et un autre, pour environ six voitures, à
      Cumlaquoy. Depuis celui de la baie part une très belle balade qui monte le long des falaises jusqu'au
      monument à Kitchener ; on accède aussi au sommet depuis Cumlaquoy. Le chemin est herbeux, avec quelques
      montées raides, et peut être mouillé et glissant. Dans la seconde moitié se trouvent deux portillons
      étroits.


      En haut, le belvédère permet de plonger le regard directement au cœur de la colonie et de voir le grand
      nombre d'oiseaux nicheurs.
    history: >-
      Le monument à Kitchener domine le cap. Il fut érigé en 1926 à la mémoire du ministre de la Guerre de la
      Première Guerre mondiale, mort le 5 juin 1916 à bord du HMS Hampshire lorsque le navire heurta une mine
      à quelques milles de la côte, en route vers la Russie. Avec lui périrent 736 hommes ; le croiseur coula
      avec 737 personnes à bord et il n'y eut que douze survivants.


      Après la guerre, les habitants des Orcades réunirent des fonds pour le monument, inauguré le 2 juillet
      1926. Il mesure quarante-huit pieds ; l'Orkney Heritage Society le restaura en 2016 et éleva un mur
      portant les noms de tous les militaires disparus, incluant aussi ceux qui périrent sur le Laurel Crown,
      un dragueur de mines, dans la même zone.


      La réserve est gérée par la RSPB, qui encourage un accès responsable conforme au code d'accès à la
      campagne écossaise.
    before: >-
      Du premier avril au quinze août, pendant la nidification des oiseaux nichant au sol, la RSPB demande de
      garder les chiens près de soi et, de préférence, tenus en laisse courte. Les barbecues sont interdits à
      tout moment en raison du risque d'incendie pour les personnes, la faune et les habitats.


      Ne vous approchez pas du bord des falaises.
    around: >-
      [Hoy et le Old Man of Hoy](/lugar/hoy---old-man-of-hoy/) se trouvent à quelque dix-huit kilomètres, seul
      voisin proche dans l'atlas. Plus loin, la [Réserve naturelle des
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), les [falaises de
      Vestmanna](/lugar/vestmanna-bird-cliffs/), [Fair Isle](/lugar/fair-isle/) et [Stora
      Karlsö](/lugar/gotland/) partagent avec Marwick Head le guillemot de Troïl et le petit pingouin.
  de:
    intro: >-
      Ein blauer Himmel, ein azurblaues Meer, ein Teppich bunter Blumen und unten der Lärm einer
      Seevogelkolonie. So beschreibt die RSPB einen sonnigen Nachmittag am Marwick Head, einem großen Kap
      südlich von Birsay im Westen der Insel Mainland auf Orkney. Die Klippen ragen fast neunzig Meter über
      den Atlantik auf und gehören zu einem Küstenabschnitt, der bis nach Stromness hinabzieht. Es ist ein
      RSPB-Reservat und erzählt auf seine Weise ganz Orkney in einer Wanderung: Natur, Tierwelt, Geschichte
      und Meerblick.
    landscape: >-
      Der Untergrund von Orkney besteht fast vollständig aus Altem Rotem Sandstein, vor allem aus dem
      Mitteldevon, und Marwick Head ruht darauf. Auf Mainland, Rousay und Hoy erheben sich Sandsteinhügel
      steil und an manchen Westküsten schroffe Klippen. Hier sind sie brüchig und zerfallen leicht, und
      Erosion kann den Boden unter den Füßen gefährlich machen.


      Von oben sieht man an klaren Tagen in der Ferne den Old Man of Hoy, und oft erkennt man Boote, die
      Krebs- und Hummerkörbe vom Meeresgrund einholen. Und oben neben der Kolonie liegt der Teppich bunter
      Blumen.
    wildlife: >-
      In den Sommermonaten wirbeln Tausende Seevögel vor der Felswand. In den Klippen brüten
      [Eissturmvögel](/especie/fulmarus_glacialis/), [Trottellummen](/especie/uria_aalge/),
      [Tordalke](/especie/alca_torda/), Krähenscharben und [Dreizehenmöwen](/especie/rissa_tridactyla/); vom
      Aussichtspunkt oben siehst du die Kolonie aus der Nähe, während Möwen und Raubmöwen den Himmel darüber
      abfliegen.


      Im Winter wechselt die Besetzung. Am Ufer von Choin sammeln sich zum Rasten und Fressen Steinwälzer,
      Meerstrandläufer und Sandregenpfeifer, und vor der Küste gibt es viele Meeresenten.


      Und es gibt einen unauffälligen Bewohner: die Große Gelbe Hummel (*Bombus distinguendus*), eine seltene
      Biene, deren britischer Bestand nur noch im Norden Schottlands vorkommt.
    visit: >-
      Es gibt zwei Parkplätze: einen großen an der Marwick Bay und einen weiteren für etwa sechs Autos in
      Cumlaquoy. Vom Parkplatz an der Bucht führt ein sehr schöner Weg an den Klippen hinauf zum
      Kitchener-Denkmal; man erreicht die Höhe auch von Cumlaquoy aus. Der Pfad ist grasig, mit einigen
      steilen Anstiegen, und kann nass und rutschig sein. In der zweiten Hälfte gibt es zwei enge
      Durchlassgatter.


      Oben lässt dich der Aussichtspunkt direkt ins Herz der Kolonie blicken und die große Zahl brütender
      Vögel sehen.
    history: >-
      Das Kitchener-Denkmal beherrscht das Kap. Es wurde 1926 zum Gedenken an den Kriegsminister des Ersten
      Weltkriegs errichtet, der am 5. Juni 1916 an Bord der HMS Hampshire starb, als das Schiff wenige Meilen
      vor der Küste auf dem Weg nach Russland auf eine Mine lief. Mit ihm starben 736 Männer; der Kreuzer sank
      mit 737 Menschen an Bord, und es gab nur zwölf Überlebende.


      Nach dem Krieg sammelten die Einwohner von Orkney Geld für das Denkmal, das am 2. Juli 1926 eingeweiht
      wurde. Es ist achtundvierzig Fuß hoch; die Orkney Heritage Society restaurierte es 2016 und errichtete
      eine Mauer mit den Namen aller gefallenen Soldaten, einschließlich derer, die im selben Gebiet auf dem
      Minenräumer Laurel Crown starben.


      Das Reservat wird von der RSPB verwaltet, die einen verantwortungsvollen Zugang gemäß dem schottischen
      Outdoor Access Code begrüßt.
    before: >-
      Vom ersten April bis fünfzehnten August, während der Brutzeit der Bodenbrüter, bittet die RSPB darum,
      Hunde nah bei sich und am besten an kurzer Leine zu führen. Grillen ist wegen der Brandgefahr für
      Menschen, Tiere und Lebensräume jederzeit verboten.


      Tritt nicht an den Rand der Klippen.
    around: >-
      [Hoy und der Old Man of Hoy](/lugar/hoy---old-man-of-hoy/) liegen etwa achtzehn Kilometer entfernt, der
      einzige nahe Nachbar im Atlas. Weiter entfernt teilen das [Naturreservat
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), die [Vogelfelsen von
      Vestmanna](/lugar/vestmanna-bird-cliffs/), [Fair Isle](/lugar/fair-isle/) und [Stora
      Karlsö](/lugar/gotland/) mit Marwick Head die Trottellumme und den Tordalk.
  it:
    intro: >-
      Un cielo azzurro, un mare blu intenso, un tappeto di fiori colorati e, sotto, il frastuono di una
      colonia di uccelli marini. Così descrive la RSPB un pomeriggio di sole a Marwick Head, un grande
      promontorio a sud di Birsay, nell'ovest dell'isola di Mainland, nelle Orcadi. Le scogliere si alzano per
      quasi novanta metri sull'Atlantico e fanno parte di un tratto di costa che scende fino a Stromness. È
      una riserva della RSPB e, a suo modo, racconta tutte le Orcadi in una passeggiata: natura, fauna, storia
      e viste sul mare.
    landscape: >-
      Il suolo delle Orcadi è quasi interamente arenaria rossa antica, soprattutto del Devoniano medio, e
      Marwick Head poggia su di essa. A Mainland, Rousay e Hoy ci sono colline di arenaria che si alzano
      bruscamente e, su alcune coste occidentali, scogliere scoscese. Qui sono fragili e si sgretolano, e
      l'erosione può rendere pericoloso il terreno sotto i piedi.


      Dall'alto, in una giornata limpida, si vede in lontananza l'Old Man of Hoy, e spesso si distinguono
      barche che issano nasse per granchi e astici dal fondo. E lassù, accanto alla colonia, il tappeto di
      fiori colorati.
    wildlife: >-
      Nei mesi estivi, migliaia di uccelli marini volano in vortice davanti alla parete. Sulle scogliere
      nidificano [fulmari](/especie/fulmarus_glacialis/), [urie](/especie/uria_aalge/), [gazze
      marine](/especie/alca_torda/), marangoni dal ciuffo e [gabbiani tridattili](/especie/rissa_tridactyla/);
      dal belvedere in cima vedi da vicino la colonia, con gabbiani e stercorari che pattugliano il cielo
      sopra di essa.


      D'inverno cambia il protagonista. Sulla riva di Choin si radunano per riposare e nutrirsi voltapietre,
      piovanelli scuri e corrieri grossi, e al largo abbondano le anatre marine.


      E c'è un abitante discreto: il grande bombo giallo (*Bombus distinguendus*), un'ape rara la cui
      popolazione britannica si trova ormai solo nel nord della Scozia.
    visit: >-
      Ci sono due parcheggi: uno ampio nella baia di Marwick e un altro, per circa sei auto, a Cumlaquoy. Da
      quello della baia parte una passeggiata molto bella che sale lungo le scogliere fino al monumento a
      Kitchener; si arriva in cima anche da Cumlaquoy. Il sentiero è erboso, con alcune salite ripide, e può
      essere bagnato e scivoloso. Nella seconda metà ci sono due cancelletti stretti.


      In alto, il belvedere ti lascia guardare dritto nel cuore della colonia e vedere il gran numero di
      uccelli che nidificano.
    history: >-
      Il monumento a Kitchener domina il capo. Fu eretto nel 1926 in memoria del ministro della Guerra della
      Prima guerra mondiale, morto il 5 giugno 1916 a bordo della HMS Hampshire, quando la nave urtò una mina
      a poche miglia dalla costa, diretta in Russia. Con lui morirono 736 uomini; l'incrociatore affondò con
      737 persone a bordo e ci furono solo dodici superstiti.


      Dopo la guerra gli abitanti delle Orcadi raccolsero fondi per il monumento, inaugurato il 2 luglio 1926.
      È alto quarantotto piedi; la Orkney Heritage Society lo restaurò nel 2016 e costruì un muro con i nomi
      di tutti i militari caduti, includendo anche quelli morti sul Laurel Crown, un dragamine, nella stessa
      zona.


      La riserva è gestita dalla RSPB, che accoglie un accesso responsabile in linea con il codice scozzese di
      accesso alla campagna.
    before: >-
      Dal primo aprile al quindici agosto, durante la cova degli uccelli che nidificano a terra, la RSPB
      chiede di tenere il cane vicino e, meglio, al guinzaglio corto. Non sono consentiti barbecue in nessun
      momento, per il rischio d'incendio per le persone, la fauna e gli habitat.


      Non avvicinarti al bordo delle scogliere.
    around: >-
      [Hoy e l'Old Man of Hoy](/lugar/hoy---old-man-of-hoy/) distano circa diciotto chilometri, unico vicino
      prossimo nell'atlante. A maggiore distanza, la [Riserva Naturale delle
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), le [scogliere di
      Vestmanna](/lugar/vestmanna-bird-cliffs/), [Fair Isle](/lugar/fair-isle/) e [Stora
      Karlsö](/lugar/gotland/) condividono con Marwick Head l'uria e la gazza marina.
  pt:
    intro: >-
      Um céu azul, um mar cor de safira, um tapete de flores coloridas e, lá em baixo, o alarido de uma
      colónia de aves marinhas. Assim descreve a RSPB uma tarde de sol em Marwick Head, um grande cabo a sul
      de Birsay, no oeste da ilha de Mainland, nas Órcades. As falésias erguem-se quase noventa metros acima
      do Atlântico e fazem parte de um troço de costa que desce até Stromness. É uma reserva da RSPB e, à sua
      maneira, conta todas as Órcades numa caminhada: natureza, fauna, história e vistas sobre o mar.
    landscape: >-
      O solo das Órcades é quase por completo arenito vermelho antigo, sobretudo do Devónico médio, e Marwick
      Head assenta sobre ele. Em Mainland, Rousay e Hoy há colinas de arenito que se erguem abruptamente e,
      nalgumas costas do oeste, falésias escarpadas. Aqui são frágeis e esfarelam-se, e a erosão pode tornar
      perigoso o chão sob os pés.


      Do alto, num dia limpo, vê-se ao longe o Old Man of Hoy, e distinguem-se com frequência barcos que içam
      covos de caranguejo e lavagante do fundo. E em cima, junto à colónia, o tapete de flores coloridas.
    wildlife: >-
      Nos meses de verão, milhares de aves marinhas voam em turbilhão sobre a parede. Nas falésias nidificam
      [fulmares-glaciais](/especie/fulmarus_glacialis/), [airos](/especie/uria_aalge/),
      [tordas-mergulheiras](/especie/alca_torda/), corvos-marinhos-de-crista e
      [gaivotas-tridáctilas](/especie/rissa_tridactyla/); do miradouro do topo vês de perto a colónia, com
      gaivotas e moleiros a patrulhar o céu por cima dela.


      No inverno, o protagonista muda. Na margem de Choin juntam-se para descansar e comer rola-do-mar,
      pilrito-escuro e borrelho-grande-de-coleira, e ao largo abundam os patos marinhos.


      E há um habitante discreto: o zangão-amarelo-grande (*Bombus distinguendus*), uma abelha rara cuja
      população britânica só se encontra no norte da Escócia.
    visit: >-
      Há dois parques de estacionamento: um amplo na baía de Marwick e outro, para cerca de seis carros, em
      Cumlaquoy. Do da baía parte um passeio muito bonito que sobe pelas falésias até ao monumento a
      Kitchener; também se chega ao topo a partir de Cumlaquoy. O trilho é de erva, com algumas subidas
      íngremes, e pode estar molhado e escorregadio. Na segunda metade há dois portões estreitos.


      Em cima, o miradouro deixa-te olhar diretamente para o coração da colónia e ver o grande número de aves
      que nidificam.
    history: >-
      O monumento a Kitchener domina o cabo. Ergueu-se em 1926 em memória do ministro da Guerra da Primeira
      Guerra Mundial, que morreu a 5 de junho de 1916 a bordo do HMS Hampshire, quando o navio chocou com uma
      mina a poucas milhas da costa, a caminho da Rússia. Com ele morreram 736 homens; o cruzador afundou-se
      com 737 a bordo e houve apenas doze sobreviventes.


      Após a guerra, os habitantes das Órcades recolheram fundos para o monumento, inaugurado a 2 de julho de
      1926. Mede quarenta e oito pés; a Orkney Heritage Society restaurou-o em 2016 e ergueu um muro com os
      nomes de todos os militares perdidos, incluindo também os que morreram no Laurel Crown, um caça-minas,
      na mesma zona.


      A reserva é gerida pela RSPB, que acolhe um acesso responsável conforme o código de acesso ao campo
      escocês.
    before: >-
      Do primeiro de abril a quinze de agosto, durante a criação das aves que nidificam no chão, a RSPB pede
      que mantenhas o cão perto e, de preferência, com trela curta. Não são permitidos churrascos em momento
      algum, pelo risco de incêndio para as pessoas, a fauna e os habitats.


      Não te aproximes da beira das falésias.
    around: >-
      [Hoy e o Old Man of Hoy](/lugar/hoy---old-man-of-hoy/) ficam a cerca de dezoito quilómetros, o único
      vizinho próximo do atlas. A maior distância, a [Reserva Natural das
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/), as [falésias de
      Vestmanna](/lugar/vestmanna-bird-cliffs/), [Fair Isle](/lugar/fair-isle/) e [Stora
      Karlsö](/lugar/gotland/) partilham com Marwick Head o airo e a torda-mergulheira.
