resumen:
  es: >-
    Vasto sistema intermareal de llanuras de fango y saladares, refugio vital para millones de aves
    migratorias en la ruta atlántica.
  en: >-
    Vast intertidal system of mudflats and salt marshes, a vital lifeline for millions of migratory birds
    along the Atlantic flyway.
  fr: >-
    Vaste système intertidal de vasières et de prés salés, étape vitale pour des millions d'oiseaux migrateurs
    sur la voie atlantique.
  de: >-
    Riesiges Gezeitensystem aus Wattflächen und Salzwiesen, unverzichtbarer Rastplatz für Millionen Zugvögel
    auf der Ostatlantischen Route.
  it: >-
    Vasto sistema intertidale di piane di marea e barene salmastre, rifugio vitale per milioni di uccelli
    migratori lungo la rotta atlantica.
  pt: >-
    Vasto sistema intertidal de vasas e sapais litorais, porto de abrigo essencial para milhões de aves
    migradoras na rota atlântica.
unico:
  es: Aquí el suelo del mar sale a la luz dos veces al día, y te dejan pasear por él.
  en: Twice every day the seabed emerges into the open air, and you are permitted to walk across it.
  fr: Ici, le fond de la mer se dévoile deux fois par jour et l'on peut s'y promener à pied.
  de: Hier tritt der Meeresboden zweimal täglich ans Tageslicht, und man darf barfuß darauf wandern.
  it: Qui il fondale oceanico emerge alla luce del sole due volte al giorno e ci si può camminare sopra.
  pt: Aqui o leito do mar vem à luz duas vezes ao dia, e podes caminhar livremente sobre ele.
observaciones:
  es: >-
    Mantén distancia con las focas y las aves que descansan, sigue los senderos marcados, no tires basura y
    lleva el perro atado. Las mareas y los vientos mandan: por eso el wadlopen se hace con guía y no por
    libre.
texto:
  es:
    intro: >-
      Dos veces al día el mar se retira y deja al descubierto el suelo de un océano. No es una playa: es una
      llanura de fango y arena que se extiende hasta el horizonte, cruzada por canales, con bancos donde
      descansan las focas y, hacia tierra, franjas de hierba salada que solo se cubren cuando la marea es muy
      alta. Esas franjas son los saladares, los kwelders, y son la razón de que este tramo neerlandés del mar
      de Frisia, entre el Marsdiep, frente a Den Helder, y el Dollard, en Groninga, forme parte del Patrimonio
      Mundial. El mar de Frisia (Waddenzee) es el mayor sistema continuo de bancos intermareales de arena y
      fango del mundo, y el bien UNESCO suma 1.143.403 hectáreas entre tres países.
    landscape: >-
      Todo esto es joven. Hace unos 8000 años el ascenso del mar, que subía deprisa tras la última glaciación,
      empezó a frenarse, y entonces pudo nacer el mar de Frisia: una barrera de islas de dunas y bancos de
      arena delante, y detrás llanuras de marea y saladares. Las islas Frisias son lo que queda de las
      antiguas dunas costeras, y no están quietas. Vlieland y Ameland se han desplazado hacia el este a lo
      largo de los siglos, perdiendo tierra por un lado y ganándola por el otro.


      El que manda es el viento, junto con la marea. Con vientos fuertes del oeste el agua sube hasta 4 m por
      encima de lo normal y las llanuras pueden quedar sumergidas varios días; con vientos fuertes del este la
      bajamar baja más de lo normal, deja secos bancos que suelen cubrirse y obliga a algunos ferris a
      quedarse en puerto. Por eso la costa cambia a diario.


      Y el saladar nace del barro. Cada marea alta deja un poco de fango nuevo sobre la llanura, el suelo se
      va secando poco a poco y acaba cubriéndose de halófitas, plantas tolerantes a la sal que fijan los
      sedimentos y dan estabilidad al conjunto. Allí crecen la salicornia (zeekraal), el lamsoor, el Engels
      slijkgras y el schorrenkruid. La diversidad aumenta desde la zona pionera, que se inunda a menudo, hasta
      el saladar alto, que rara vez se cubre. Y como cada inundación deja sedimento, el saladar crece y sigue
      en gran medida el ritmo de subida del nivel del mar.
    wildlife: >-
      En el mar de Frisia viven unas 10.000 especies de flora y fauna, de ellas unas 2700 de origen marino. En
      los saladares solo, unas 2.300. Y es una de las paradas más importantes de aves costeras del mundo: más
      de una cuarta parte de las poblaciones europeas de [espátula común](/especie/platalea_leucorodia/),
      [avoceta](/especie/recurvirostra_avosetta/), charrán piquigrueso y charrán patinegro cría en el mar de
      Frisia. Casi toda la población de barnacla carinegra y de correlimos común de Europa y el oeste de Rusia
      lo usa. A finales del verano casi todos los [tarros blancos](/especie/tadorna_tadorna/) del norte y el
      oeste de Europa mudan aquí la pluma, en las zonas menos perturbadas.


      Cada estación trae algo distinto. Entre diez y doce millones de aves migratorias atraviesan el bien en
      un año medio, y hasta 6,1 millones pueden estar a la vez. Desde la costa de Groninga se ven miles de
      aves migratorias que se alimentan en el Wad y en los bordes del Dollard. En los saladares anidan
      charranes, archibebes comunes, avocetas y chorlitejos grandes; en las playas, el [chorlitejo
      patinegro](/especie/charadrius_alexandrinus/) y el [charrancito](/especie/sternula_albifrons/), ambas
      aves de la lista roja, que eligen justo las playas más atractivas para el recreo.


      Las focas cuentan una historia de recuperación. Se cazaron hasta mediados del siglo XX y quedaban menos
      de 4000 [focas comunes](/especie/phoca_vitulina/) y casi ninguna [foca
      gris](/especie/halichoerus_grypus/). Hoy el mar de Frisia acoge aproximadamente el 20 % de la subespecie
      de foca común del Atlántico nordeste, con unas 40.000 estimadas en 2018, y la mayor colonia de focas
      grises de todo el mar de Frisia está al oeste de Terschelling. En el sector neerlandés, más de una
      cuarta parte de las focas comunes utiliza sus aguas durante la muda. También vive aquí la [marsopa
      común](/especie/phocoena_phocoena/). El virus del moquillo de las focas diezmó la población en 1988,
      aunque estaban protegidas por ley.
    visit: >-
      La actividad estrella es caminar por el fondo del mar en bajamar, el wadlopen. Se hace siempre con un
      guía de wadlopen, que explica cómo andar sin molestar a las aves. Hay canales, arroyos y barrancos
      profundos que pueden cortar el paso. Con la bajamar es posible, por ejemplo, llegar caminando hasta
      Schiermonnikoog.


      La costa de Groninga ofrece lugares más tranquilos. En la península exterior de Punt van Reide, que es
      también una zona de cría de focas, hay charranes, archibebes comunes, avocetas y chorlitejos grandes. El
      hide Kiekkaaste, cerca de Nieuwe Statenzijl, abre la vista sobre llanuras donde comen las aves y, de vez
      en cuando, hay marsopas en el mar. En Lauwersoog, el Parque de Cielo Oscuro permite mirar estrellas,
      buscar murciélagos o recorrer en bici el «carril bici más oscuro» de los Países Bajos.


      Las cinco islas Frisias neerlandesas, Schiermonnikoog, Ameland, Terschelling, Vlieland y Texel, son las
      «cinco perlas» del norte del país, y las islas tienen más de 300 km de carriles bici; la ruta LF10
      Waddenzeeroute recorre la costa. El Afsluitdijk Vadehavscenter es el centro de visitantes UNESCO del
      lado neerlandés, y casi todos los centros de la región ofrecen actividades educativas sobre la
      naturaleza y la cultura del Wad.
    history: >-
      En 1932 los campos de zostera ocupaban más de 150 km²; hoy han desaparecido en su mayor parte y se
      intenta restaurarlos sembrando. En 2005 se prohibió la pesca mecánica de berberechos en el Wad
      neerlandés y la pesca de arrastre también está prohibida.


      El Wad fue declarado Patrimonio Mundial neerlandés-alemán el 26 de junio de 2009, y la parte danesa se
      añadió el 23 de junio de 2014. La mayor parte del Wad neerlandés es monumento natural protegido y
      reserva de la biosfera, y en él están los parques nacionales de Schiermonnikoog, Lauwersmeer y las Dunas
      de Texel. El turismo y los deportes náuticos molestan a menudo a los animales, aunque también ayudan a
      que la gente valore lo que hay en juego.
    before: >-
      Mantén distancia con las focas y las aves que descansan, sigue los senderos marcados, no tires basura y
      lleva el perro atado. Las mareas y los vientos mandan: por eso el wadlopen se hace con guía y no por
      libre.
    around: >-
      El [Parque Nacional del Mar de Wadden de Baja
      Sajonia](/lugar/nationalpark-niedersachsisches-wattenmeer/) continúa el mismo sistema al otro lado de la
      frontera, y el [Parque Nacional Lauwersmeer](/lugar/nationaal-park-lauwersmeer/) queda a unos dos
      kilómetros. Más lejos, el [Parque Nacional del Mar de Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) y el [Parque Nacional del
      Mar de Wadden (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/) comparten con él los saladares,
      las focas y las aves de la misma ruta migratoria.
  en:
    intro: >-
      Twice a day the tide withdraws, uncovering the floor of an ocean. This is no beach: it is a plain of
      silt and sand that stretches to the horizon, grooved by deep gulleys, with sandbanks where seals rest
      and, landward, fringes of salt-tolerant grasses that are inundated only on the highest spring tides.
      Those fringes are the salt marshes, the *kwelders*, and they are the prime reason this Dutch sector of
      the Wadden Sea—between the Marsdiep off Den Helder and the Dollard in Groningen—belongs to the UNESCO
      World Heritage list. The Wadden Sea (*Waddenzee*) is the world's largest unbroken expanse of intertidal
      sand and mud flats, and the trilateral UNESCO property encompasses 1,143,403 hectares across three
      nations.
    landscape: >-
      All of this is geologically young. Around 8000 years ago, postglacial sea level rise began to
      decelerate, allowing the Wadden Sea to form: an outer barrier chain of dune islands and shoals,
      shielding intertidal flats and salt marshes behind them. The Frisian barrier islands represent the
      eroded remains of ancient coastal dunes, and they are constantly in motion. Vlieland and Ameland have
      drifted eastward over the centuries, losing land on their western shores while gaining ground to the
      east.


      Wind joins with the tide to govern the waters. Fierce westerly gales push sea levels up to 4 m above
      normal, submerging the tidal flats for days; strong easterlies blow the low tide out further than usual,
      drying shoals that normally remain submerged and stranding interisland ferries in port. As a result, the
      coastline shifts day by day.


      Salt marshes are born of silt. Each flood tide deposits fine mud onto the flats; the ground gradually
      builds above daily high water and becomes colonized by halophytic plants that trap sediments and anchor
      the land. Glasswort (*zeekraal*), sea lavender (*lamsoor*), common cordgrass (*Engels slijkgras*), and
      sea blite (*schorrenkruid*) establish successively. Plant diversity increases steadily from the lower
      pioneer zone, inundated regularly, up to the high marsh, flooded only in storms. Because every flood
      deposits fresh silt, the salt marsh accretes upward, keeping pace with sea level rise.
    wildlife: >-
      The Wadden Sea shelters roughly 10,000 species of flora and fauna, including about 2700 of marine
      origin. In the salt marshes alone, some 2,300 species occur. It constitutes one of the premier staging
      grounds for shorebirds worldwide: over a quarter of the European populations of [Eurasian
      spoonbill](/especie/platalea_leucorodia/), [pied avocet](/especie/recurvirostra_avosetta/), gull-billed
      tern, and Sandwich tern nest in the Wadden Sea. Nearly the entire population of dark-bellied brent goose
      and red knot from Europe and western Russia depends on these mudflats. In late summer, nearly all
      [common shelduck](/especie/tadorna_tadorna/) from northern and western Europe congregate in undisturbed
      sanctuaries here to undergo their annual wing moult.


      Every season brings a distinct wave of life. Between ten and twelve million migratory birds traverse the
      World Heritage property in an average year, with up to 6.1 million present simultaneously at peak
      stopover. From the Groningen dike you can watch thousands of waders foraging across the mudflats and
      Dollard margins. Salt marshes host nesting colonies of common terns, redshanks, avocets, and ringed
      plovers; open beaches shelter the [Kentish plover](/especie/charadrius_alexandrinus/) and [little
      tern](/especie/sternula_albifrons/), both Red List species whose choice of breeding habitat coincides
      with high-recreation beaches.


      Seals embody an inspiring conservation recovery. Heavily hunted until the mid-twentieth century, their
      numbers plunged below 4000 [common seal](/especie/phoca_vitulina/) and almost no [grey
      seal](/especie/halichoerus_grypus/). Today the Wadden Sea harbors roughly 20 % of the Northeast Atlantic
      common seal population, estimated at some 40,000 animals in 2018, while the largest breeding colony of
      grey seals in the entire Wadden Sea breeds west of Terschelling. In the Dutch sector, more than a
      quarter of all common seals gather during their summer moult. The [common
      porpoise](/especie/phocoena_phocoena/) also frequents these shallow tidal waters. The phocine distemper
      virus epidemic dealt a severe blow to populations in 1988, despite prior statutory protection.
    visit: >-
      The definitive experience here is walking across the exposed seabed at low tide: *wadlopen*. It must
      always be undertaken accompanied by a certified mudflat guide, who navigates safe routes without
      disturbing roosting birds. Deep tidal gullies, soft mud patches, and incoming tides can swiftly cut off
      unwary walkers. On suitable tides, guided expeditions trek from the mainland all the way to
      Schiermonnikoog.


      The mainland coast of Groningen offers serene alternatives. The outer spit of Punt van Reide, an
      important seal nursery, overlooks nesting terns, redshanks, avocets, and plovers. The Kiekkaaste hide
      near Nieuwe Statenzijl commands views over feeding mudflats where porpoises occasionally surface
      offshore. At Lauwersoog, the Dark Sky Park invites visitors to stargaze, seek nocturnal bats, or cycle
      along the "darkest cycle path" in the Netherlands.


      The five Dutch Wadden Islands—Texel, Vlieland, Terschelling, Ameland, and Schiermonnikoog—are renowned
      as the "five pearls" of the north, threaded by over 300 km of designated cycle paths; the LF10
      Waddenzeeroute traces the mainland shore. The Afsluitdijk Wadden Sea Center serves as the primary UNESCO
      gateway on the Dutch coast, and visitor centers across the provinces offer field trips into the natural
      and cultural heritage of the Wad.
    history: >-
      In 1932, vast meadows of common eelgrass covered more than 150 km²; today they have largely vanished,
      with ongoing restoration efforts replanting beds by seed. In 2005, mechanized cockle dredging was
      outlawed across the Dutch Wadden Sea, and benthic bottom trawling is similarly restricted.


      The Dutch and German Wadden Sea was inscribed on the UNESCO World Heritage list on 26 June 2009, with
      the Danish sector added on 23 June 2014. Most of the Dutch sector enjoys protected natural monument and
      biosphere reserve status, incorporating Schiermonnikoog, Lauwersmeer, and Dunes of Texel National Parks.
      While tourism and water sports exert pressure on vulnerable wildlife, they also cultivate public
      appreciation for the conservation stakes.
    before: >-
      Maintain ample distance from resting seals and roosting flocks, follow marked paths, pack out all
      litter, and keep dogs on a leash. Tides and wind conditions are unpredictable: mudflat walking should
      always be done with a licensed guide, never independently.
    around: >-
      The [Lower Saxony Wadden Sea National Park](/lugar/nationalpark-niedersachsisches-wattenmeer/) continues
      the unbroken tidal system across the German frontier, while [Lauwersmeer National
      Park](/lugar/nationaal-park-lauwersmeer/) lies some two kilometres inland. Farther away, the
      [Schleswig-Holstein Wadden Sea National Park](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/)
      and [Wadden Sea National Park (Denmark)](/lugar/wadden-sea-national-park-dinamarca/) share salt marshes,
      marine seals, and flyway avifauna.
  fr:
    intro: >-
      Deux fois par jour la mer s'efface, dévoilant le plancher d'un océan. Ce n'est pas une simple plage :
      c'est une étendue de vase et de sable s'étirant à l'infini, sillonnée de chenaux de marée, avec des
      bancs où se reposent les phoques et, côté terre, des franges d'herbes salées recouvertes uniquement lors
      des plus grandes marées. Ces prés salés, appelés *kwelders*, constituent la raison majeure pour laquelle
      ce secteur néerlandais de la mer des Wadden, entre le Marsdiep face au Helder et le Dollard à Groningue,
      figure au Patrimoine mondial. La mer des Wadden (*Waddenzee*) est le plus vaste système continu
      d'estrans sableux et vaseux au monde, le bien UNESCO totalisant 1 143 403 hectares répartis sur trois
      pays.
    landscape: >-
      Ce paysage est jeune. Il y a environ 8000 ans, la montée des eaux postglaciaire commença à ralentir,
      permettant la formation de la mer des Wadden : un cordon d'îles dunaires et de bancs de sable en mer,
      abritant vasières et schorres en arrière. Les îles de la Frise représentent les vestiges de ces cordons
      dunaires, et elles sont perpétuellement mobiles. Vlieland et Ameland ont migré vers l'est au fil des
      siècles, s'érodant à l'ouest pour s'engraisser à l'est.


      Le vent et la marée sont les maîtres d'œuvre. Par forts vents d'ouest, l'eau s'élève jusqu'à 4 m
      au-dessus de la normale et submerge les vasières durant plusieurs jours ; à l'inverse, par bise d'est
      tenace, la marée descend plus bas que d'ordinaire, découvrant des chenaux et bloquant les ferries au
      port. Le littoral change ainsi chaque jour.


      Le pré salé s'édifie sur le limon. Chaque marée haute dépose une pellicule de vase ; le sol s'exhausse
      et se colonise d'halophytes qui fixent les alluvions. La salicorne (*zeekraal*), le lilas de mer
      (*lamsoor*), la spartine (*Engels slijkgras*) et la soude maritime (*schorrenkruid*) se succèdent. La
      diversité végétale augmente de la zone pionnière basse, submergée souvent, jusqu'au haut schorre inondé
      uniquement lors des tempêtes. Comme chaque crue apporte son lot de sédiments, le pré salé s'élève et
      compense en grande part la montée du niveau marin.
    wildlife: >-
      La mer des Wadden abrite environ 10 000 espèces floristiques et faunistiques, dont 2700 d'origine
      marine. Dans les seuls prés salés vivent près de 2 300 espèces. Elle représente une halte migratoire
      majeure au monde : plus d'un quart des populations européennes de [spatule
      blanche](/especie/platalea_leucorodia/), d'[avocette élégante](/especie/recurvirostra_avosetta/), de
      sterne hansel et de sterne caugek s'y reproduisent. La quasi-totalité de la population de bernaches
      cravants et de bécasseaux maubèches d'Europe et de Russie occidentale y séjourne. En fin d'été, la
      quasi-totalité des [tadornes de Belon](/especie/tadorna_tadorna/) d'Europe du Nord et de l'Ouest s'y
      rassemble pour muer dans les zones les plus calmes.


      Chaque saison renouvelle le spectacle. Entre dix et douze millions d'oiseaux migrateurs transitent par
      ce sanctuaire chaque année, avec des pointes simultanées atteignant 6,1 millions d'individus. Depuis la
      digue de Groningue, vous contemplerez des milliers de limicoles s'alimentant dans le Wad et au bord du
      Dollard. Dans les schorres nichent sternes, chevaliers gambettes, avocettes et grands gravelots ; sur
      les plages sablonneuses s'installent le [pluvier à collier
      interrompu](/especie/charadrius_alexandrinus/) et la [sterne naine](/especie/sternula_albifrons/), deux
      espèces menacées nichant précisément sur les laisses de mer les plus convoitées par les baigneurs.


      Les phoques témoignent d'une spectaculaire restauration. Chassés jusqu'au milieu du XXe siècle, leurs
      effectifs étaient tombés à moins de 4000 [phoques communs](/especie/phoca_vitulina/) et de rarissimes
      [phoques gris](/especie/halichoerus_grypus/). Aujourd'hui, le bassin accueille environ 20 % de la
      sous-espèce de phoque commun de l'Atlantique nord-est, estimée à 40 000 individus en 2018, tandis que la
      principale colonie de phoques gris se trouve à l'ouest de Terschelling. Dans le secteur néerlandais,
      plus d'un quart des phoques communs exploitent ces eaux pour leur mue estivale. Y vit également le
      [marsouin commun](/especie/phocoena_phocoena/). Le virus de la maladie de Carré des phoques avait décimé
      la population en 1988, malgré leur statut d'espèce protégée.
    visit: >-
      L'activité reine est la traversée de la vasière à pied à marée basse, le *wadlopen*. Elle s'effectue
      impérativement en compagnie d'un guide agréé qui enseigne la marche sans déranger les colonies
      d'oiseaux. Canaux profonds et vasières mouvantes peuvent en effet piéger le promeneur. À marée basse, il
      est possible par exemple de rallier l'île de Schiermonnikoog à pied depuis le continent.


      La côte de Groningue propose des sites plus confidentiels. Sur la presqu'île de Punt van Reide, qui sert
      également de pouponnière aux phoques, évoluent sternes, chevaliers gambettes et avocettes. L'affût de
      Kiekkaaste près de Nieuwe Statenzijl offre une vue plongeante sur les vasières nourricières avec parfois
      des marsouins au large. À Lauwersoog, le Parc de ciel étoilé permet d'observer la nuit noire, les
      chauves-souris ou de pédaler sur la piste cyclable la plus sombre des Pays-Bas.


      Les cinq îles frisonnes néerlandaises—Texel, Vlieland, Terschelling, Ameland et Schiermonnikoog—sont les
      perles du nord, parcourues par plus de 300 km de pistes cyclables ; l'itinéraire LF10 Waddenzeeroute
      longe toute la côte continentale. Le centre UNESCO de l'Afsluitdijk constitue la porte d'entrée
      officielle, et de nombreux centres locaux proposent sorties et animations de découverte.
    history: >-
      En 1932, les herbiers de zostère couvraient plus de 150 km² ; ils ont aujourd'hui presque disparu et
      font l'objet de programmes de réensemencement. En 2005, la pêche mécanique aux coques a été bannie du
      Wad néerlandais, et le chalutage de fond y est strictement encadré.


      Le Wad a été inscrit au Patrimoine mondial néerlando-allemand le 26 juin 2009, la section danoise ayant
      été ajoutée le 23 juin 2014. La majeure partie du secteur néerlandais est classée monument naturel et
      réserve de biosphère, abritant les parcs nationaux de Schiermonnikoog, du Lauwersmeer et des Dunes de
      Texel. Si les loisirs nautiques exercent une pression sur la faune, ils sensibilisent également le grand
      public à la fragilité de cet écosystème.
    before: >-
      Gardez vos distances avec les phoques et les reposoirs d'oiseaux, restez sur les tracés balisés,
      emportez vos déchets et tenez les chiens en laisse. Les marées et les vents imposent leur loi : le
      wadlopen ne s'improvise jamais sans guide.
    around: >-
      Le [Parc national de la mer des Wadden de Basse-Saxe](/lugar/nationalpark-niedersachsisches-wattenmeer/)
      prolonge immédiatement le système de l'autre côté de la frontière, et le [Parc national de
      Lauwersmeer](/lugar/nationaal-park-lauwersmeer/) se situe à deux kilomètres environ. Plus au nord, le
      [Parc national de la mer des Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) et le [Parc national de la
      mer des Wadden (Danemark)](/lugar/wadden-sea-national-park-dinamarca/) partagent prés salés, phoques et
      limicoles le long de la même route migratoire.
  de:
    intro: >-
      Zweimal am Tag zieht sich das Meer zurück und gibt den Grund eines Ozeans frei. Das ist kein
      gewöhnlicher Strand: Es ist eine Schlick- und Sandebene, die sich bis zum Horizont dehnt, durchzogen von
      Prielen, mit Sandbänken voll ruhender Robben und landeinwärts gelegenen Salzwiesen, die nur bei extremen
      Springfluten überspült werden. Diese Salzwiesen, die *Kwelders*, sind der Hauptgrund dafür, dass dieser
      niederländische Sektor des Wattenmeers zwischen dem Marsdiep vor Den Helder und dem Dollart in Groningen
      zum Welterbe gehört. Das Wattenmeer (*Waddenzee*) ist das weltweit größte zusammenhängende
      Gezeitensystem aus Sand- und Schlickwatten, und das dreiseitige Welterbegebiet umfasst 1.143.403 Hektar
      in drei Staaten.
    landscape: >-
      Diese Landschaft ist erdgeschichtlich jung. Vor rund 8000 Jahren verlangsamte sich der nacheiszeitliche
      Meeresspiegelanstieg, sodass das Wattenmeer entstehen konnte: eine schützende Barriere aus Düneninseln
      und Sandplaten, dahinter die geschützten Wattflächen und Salzwiesen. Die Westfriesischen Inseln sind
      Reste einstiger Strandwälle und bleiben ständig in Bewegung. Vlieland und Ameland wanderten im Laufe der
      Jahrhunderte ostwärts, indem sie im Westen Land verloren und im Osten anwuchsen.


      Wind und Gezeiten beherrschen das Geschehen. Bei schweren Weststürmen staut sich das Wasser bis zu 4 m
      über Normal auf und überflutet das Watt tagelang; Ostwinde hingegen drücken das Wasser hinaus, legen
      sonst überflutete Priele trocken und zwingen Inselfähren zum Verweilen im Hafen. So formt sich die Küste
      täglich neu.


      Die Salzwiese wächst aus dem Schlick. Jede Flut hinterlässt feine Schwebstoffe; der Schlickboden
      trocknet allmählich ab und wird von salztoleranten Pionierpflanzen besiedelt. Queller (*zeekraal*),
      Strandflieder (*lamsoor*), Schlickgras (*Engels slijkgras*) und Sode (*schorrenkruid*) folgen
      aufeinander. Die Artenvielfalt steigt von der häufig überfluteten Pionierzone bis zur oberen Salzwiese,
      die nur bei Sturmfluten nass wird. Da jede Flut Sediment heranführt, wächst die Salzwiese vertikal mit
      dem Meeresspiegelanstieg mit.
    wildlife: >-
      Im Wattenmeer leben rund 10.000 Pflanzen- und Tierarten, davon etwa 2700 marinen Ursprungs. In den
      Salzwiesen allein sind es rund 2.300 Arten. Es ist eine der bedeutendsten Drehscheiben für Küstenvögel
      weltweit: Mehr als ein Viertel der europäischen Bestände von [Löffler](/especie/platalea_leucorodia/),
      [Säbelschnäbler](/especie/recurvirostra_avosetta/), Lachseeschwalbe und Brandseeschwalbe brütet im
      Wattenmeer. Fast der gesamte Bestand an Ringelgänsen und Knuttstrandläufern aus Europa und Westrussland
      rastet hier. Im Spätsommer mausern fast alle [Brandgänse](/especie/tadorna_tadorna/) Nord- und
      Westeuropas in den ruhigen Schutzzonen des Watts ihr Gefieder.


      Jede Jahreszeit bringt ein anderes Bild. Zwischen zehn und zwölf Millionen Zugvögel durchqueren das
      Gebiet jährlich, mit bis zu 6,1 Millionen Individuen gleichzeitig zur Zugspitze. Vom Groninger Deich
      blickst du auf Tausende Limikolen, die im Watt und am Dollart Nahrung suchen. In den Salzwiesen nisten
      Flussseeschwalben, Rotschenkel, Säbelschnäbler und Sandregenpfeifer; an den Stränden brüten
      [Seeregenpfeifer](/especie/charadrius_alexandrinus/) und
      [Zwergseeschwalbe](/especie/sternula_albifrons/) – beides Rote-Liste-Arten, deren Brutplätze oft mit
      beliebten Badestränden kollidieren.


      Die Robben erzählen eine Erfolgsgeschichte des Artenschutzes. Bis zur Mitte des zwanzigsten Jahrhunderts
      stark bejagt, schrumpften die Zahlen auf unter 4000 [Seehunde](/especie/phoca_vitulina/) und kaum noch
      [Kegelrobben](/especie/halichoerus_grypus/). Heute beherbergt das Wattenmeer rund 20 % der
      nordostatlantischen Seehundpopulation mit geschätzten 40.000 Tieren im Jahr 2018; die größte
      Kegelrobbenkolonie des gesamten Wattenmeers liegt westlich von Terschelling. Im niederländischen Sektor
      nutzt mehr als ein Viertel aller Seehunde die Gewässer während der Sommermauser. Auch der [Gewöhnlicher
      Schweinswal](/especie/phocoena_phocoena/) ist hier heimisch. Die Seehundstaupe-Epidemie forderte 1988
      schwere Verluste, obgleich die Tiere bereits gesetzlich geschützt waren.
    visit: >-
      Das klassische Erlebnis ist die geführte Wattwanderung bei Niedrigwasser, das *Wadlopen*. Es wird stets
      mit lizenzierten Wattführern unternommen, die den Weg weisen, ohne Brut- und Rastvögel aufzuschrecken.
      Schlickfelder und tiefe Priele können sonst den Rückweg abschneiden. Bei geeigneter Tide kann man
      beispielsweise bis nach Schiermonnikoog wandern.


      Die Küste von Groningen bietet stille Naturbeobachtungen. Auf der Halbinsel Punt van Reide, einer
      wichtigen Robbenwiege, brüten Seeschwalben, Rotschenkel und Säbelschnäbler. Die Beobachtungshütte
      Kiekkaaste bei Nieuwe Statenzijl blickt weit über Schlickflächen, an denen zuweilen Schweinswale
      auftauchen. In Lauwersoog lädt der Dark Sky Park zu Sternbeobachtungen und Fledermaus-Exkursionen ein.


      Die fünf niederländischen Watteninseln Texel, Vlieland, Terschelling, Ameland und Schiermonnikoog gelten
      als die „fünf Perlen“ des Nordens und bieten über 300 km Radwege; die Fernroute LF10 Waddenzeeroute
      erschließt das Festland. Das UNESCO-Zentrum am Afsluitdijk ist das Haupttor auf niederländischer Seite,
      und zahlreiche regionale Stationen bieten Naturführungen an.
    history: >-
      Im Jahr 1932 bedeckten Seegraswiesen mehr als 150 km²; heute sind sie weitgehend verschwunden und werden
      mühsam wieder angesiedelt. Im Jahr 2005 wurde die mechanische Herzmuschelfischerei im niederländischen
      Watt verboten, und die Grundschleppnetzfischerei unterliegt strengen Beschränkungen.


      Das niederländisch-deutsche Wattenmeer wurde am 26. Juni 2009 zum UNESCO-Welterbe erklärt, der dänische
      Sektor am 23. Juni 2014 angegliedert. Der Großteil des Gebiets ist als Naturschutzgebiet und
      Biosphärenreservat ausgewiesen und umfasst die Nationalparks Schiermonnikoog, Lauwersmeer und Dünen von
      Texel. Wassersport und Tourismus fordern den Schutz der Tierwelt heraus, fördern jedoch auch das
      gesellschaftliche Bewusstsein für diesen Naturraum.
    before: >-
      Halte großen Abstand zu Robben und ruhenden Vogelschwärmen, bleibe auf markierten Routen, nimm Abfälle
      mit und führe Hunde stets an der Leine. Gezeiten und Winde bergen Gefahren: Wattwandern gehört immer in
      erfahrene Führung.
    around: >-
      Der [Nationalpark Niedersächsisches Wattenmeer](/lugar/nationalpark-niedersachsisches-wattenmeer/)
      schließt jenseits der Grenze nahtlos an, und der [Nationalpark
      Lauwersmeer](/lugar/nationaal-park-lauwersmeer/) liegt rund zwei Kilometer landeinwärts. Weiter nördlich
      teilen der [Nationalpark Schleswig-Holsteinisches
      Wattenmeer](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) und der [Nationalpark Wattenmeer
      (Dänemark)](/lugar/wadden-sea-national-park-dinamarca/) Salzwiesen, Robben und Zugvögel desselben
      Flyways.
  it:
    intro: >-
      Due volte al giorno il mare si ritira e spalanca il fondale di un oceano. Non è una comune spiaggia: è
      una distesa di fango e sabbia che corre verso l'orizzonte, incisa da profondi canali di marea, con
      banchi sabbiosi su cui riposano le foche e, verso terra, cinture di vegetazione alofila inondate
      unicamente dalle maree vive. Quelle fasce erbose sono le barene litoranee, i *kwelders*, e sono la
      ragione fondante per cui questo settore neerlandese del mare di Wadden, tra il Marsdiep al largo di Den
      Helder e il Dollard a Groninga, fa parte del Patrimonio Mondiale. Il mare di Wadden (*Waddenzee*) è il
      maggiore complesso ininterrotto di bassifondi intertidali del pianeta, e il bene UNESCO assomma a
      1.143.403 ettari suddivisi fra tre stati.
    landscape: >-
      È un paesaggio giovanissimo. Circa 8000 anni fa la risalita del livello marino postglaciale iniziò a
      rallentare, consentendo la genesi del mare di Wadden: una barriera esterna di isole dunose e secche
      sabbiose a protezione di piane fangose e barene salmastre. Le isole Frisoni costituiscono l'eredità
      delle antiche dune costiere e non restano mai immobili. Vlieland e Ameland sono scivolate verso oriente
      nei secoli, arretrando a ovest e accrescendosi a levante.


      I veri artefici sono il vento e le maree. Con forti venti occidentali la marea sale fino a 4 m oltre il
      livello medio e le piane rimangono sommerse per giorni; al contrario, quando spirano venti orientali le
      secche si prosciugano più del consueto, impedendo il transito ai traghetti insulari. Per questo il
      litorale si trasforma ogni giorno.


      La barena germoglia dal limo. Ogni colmo di marea lascia una patina di fango fresco; il terreno si
      consolida e viene colonizzato da specie alofile che ancorano i sedimenti. Salicornia (*zeekraal*),
      limonio (*lamsoor*), spartina (*Engels slijkgras*) e suaeda (*schorrenkruid*) si insediano in
      successione. La complessità ecologica cresce dalla barena bassa e fangosa fino al pascolo salmastro
      alto. Poiché ogni sommersione reca particelle terrigene, la barena cresce verticalmente compensando in
      larga misura l'innalzamento marino.
    wildlife: >-
      Nel mare di Wadden dimorano circa 10.000 specie floristiche e faunistiche, delle quali circa 2700 di
      ambiente marino. Nelle sole barene salmastre se ne contano circa 2.300. È uno dei nodi strategici
      primari per l'avifauna costiera mondiale: oltre un quarto degli effettivi europei di
      [Spatola](/especie/platalea_leucorodia/), [Avocetta](/especie/recurvirostra_avosetta/), sterna zampenere
      e beccapesci nidifica nel Wadden. L'intera popolazione di oca colombaccio e di piovanello maggiore
      dell'Europa e della Russia occidentale vi sosta. Nel tardo periodo estivo quasi tutte le
      [volpoche](/especie/tadorna_tadorna/) dell'Europa settentrionale e occidentale compiono la muta delle
      remiganti nei santuari più appartati del Wad.


      Ogni stagione offre arrivi differenti. Tra i dieci e i dodici milioni di uccelli migratori transitano
      nell'area protetta nell'arco di un anno medio, con presenze simultanee fino a 6,1 milioni di esemplari
      nelle fasi culminanti. Dalle arginature di Groninga si avvistano sciami di limicoli intenti a nutrirsi
      nelle secche del Wad e del Dollard. Nelle barene nidificano sterne, pettegole, avocette e corrieri
      grossi; sulle spiagge aperte depongono le uova il [Fratino](/especie/charadrius_alexandrinus/) e il
      [Fraticello](/especie/sternula_albifrons/), specie rare e vulnerabili che scelgono proprio i lidi più
      frequentati.


      Le foche raccontano una vicenda di tenace riscatto ecologico. Cacciate sino alla metà del XX secolo, la
      loro consistenza era calata a meno di 4000 [foca comune](/especie/phoca_vitulina/) e pochissime [Foca
      grigia](/especie/halichoerus_grypus/). Oggi il comprensorio accoglie circa il 20 % della popolazione
      nordorientale atlantica di foca comune, con circa 40.000 esemplari stimati nel 2018, mentre la colonia
      riproduttiva di foche grigie più vasta del mare di Wadden risiede a ovest di Terschelling. Nel settore
      olandese oltre un quarto delle foche comuni sfrutta queste acque per la muta estiva. È abituale pure la
      [focena](/especie/phocoena_phocoena/). L'epidemia da cimurro dei pinnipedi provocò pesanti morie nel
      1988, benché gli animali godessero già di rigorosa tutela legale.
    visit: >-
      L'esperienza identitaria è il cammino sul fondale emerso con la bassa marea: il *wadlopen*. Va compiuto
      tassativamente con una guida di wadlopen qualificata, che conosce i passaggi per non disturbare le
      colonie aviarie ed evitare insidiosi canali mobili. Nei giorni di marea favorevole è possibile persino
      raggiungere a piedi l'isola di Schiermonnikoog dalla terraferma.


      La costa di Groninga offre una dimensione appartata. Sulla lingua litoranea di Punt van Reide, che fa da
      nursery per le foche, si ammirano sterne, pettegole e avocette. Il capanno Kiekkaaste vicino a Nieuwe
      Statenzijl apre lo sguardo sulle piane alimentari dove non di rado emergono focene. A Lauwersoog il Dark
      Sky Park invita a contemplare cieli stellati o a pedalare lungo la pista ciclabile più buia dei Paesi
      Bassi.


      Le cinque isole Frisoni olandesi—Texel, Vlieland, Terschelling, Ameland e Schiermonnikoog—sono celebri
      come le "cinque perle" settentrionali, attraversate da oltre 300 km di percorsi ciclabili; la ciclovia
      LF10 Waddenzeeroute fiancheggia l'intera sponda continentale. L'Afsluitdijk Wadden Center funge da
      centro visite UNESCO sul versante olandese, proponendo escursioni naturalistiche in ogni stagione.
    history: >-
      Nel 1932 le praterie sommerse di zostera marina si estendevano per oltre 150 km²; attualmente sono quasi
      scomparse e si tenta di ripristinarle mediante risemina. Nel 2005 è stata bandita la raccolta
      industriale meccanizzata dei cuori di mare dal Wad olandese e la pesca a strascico è sottoposta a
      vincoli stringenti.


      Il Wad è stato proclamato Patrimonio Mondiale congiunto olandese-tedesco il 26 giugno 2009, con
      l'inclusione della Danimarca avvenuta il 23 giugno 2014. Gran parte delle acque olandesi è dichiarata
      monumento naturale protetto e riserva della biosfera, abbracciando i parchi nazionali di
      Schiermonnikoog, Lauwersmeer e delle Dune di Texel. Le attività ricreative comportano pressioni
      ecologiche, ma favoriscono pure la consapevolezza civica verso la tutela di questo fragile universo.
    before: >-
      Mantieni debita distanza da foche e dormitori di uccelli, cammina lungo i tracciati stabiliti, riporta a
      monte i rifiuti e tieni i cani sempre al guinzaglio. L'escursione di marea non va mai affrontata in
      solitaria.
    around: >-
      Il [Parque Nacional de Baja Sajonia](/lugar/nationalpark-niedersachsisches-wattenmeer/) prosegue il
      medesimo ambiente di marea oltre il confine tedesco, mentre il [Parco Nazionale
      Lauwersmeer](/lugar/nationaal-park-lauwersmeer/) sorge a circa due chilometri. Più distanti, il [Parco
      Nazionale del Mare di Wadden di
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) e il [Parco Nazionale del
      Mare di Wadden (Danimarca)](/lugar/wadden-sea-national-park-dinamarca/) condividono barene salmastre,
      foche e uccelli della medesima rotta migratoria atlantica.
  pt:
    intro: >-
      Duas vezes por dia o mar retira-se e desvenda o fundo de um oceano. Não é uma praia: é uma planície de
      vasa e areia que se estende até ao horizonte, sulcada por esteiros, com coroas de areia onde descansam
      focas e, junto a terra, orlas de vegetação halófila cobertas apenas nas marés vivas. Essas orlas são os
      sapais, os *kwelders*, e constituem o motivo principal pelo qual este setor neerlandês do mar de Wadden,
      entre o Marsdiep defronte de Den Helder e o Dollard em Groninga, pertence ao Património Mundial. O mar
      de Wadden (*Waddenzee*) é o maior sistema contínuo de baixios intertidais do planeta, e o sítio
      tripartido da UNESCO abrange 1.143.403 hectares repartidos por três países.
    landscape: >-
      Tudo isto é recente. Há cerca de 8000 anos a subida do nível do mar pós-glaciar começou a abrandar,
      permitindo a formação do mar de Wadden: uma cintura exterior de ilhas dunares e bancos arenosos a
      proteger baixios vasosos e sapais interiores. As ilhas Frísias constituem o remanescente dessas antigas
      cordas dunares e não permanecem imóveis. Vlieland e Ameland deslocaram-se para leste ao longo dos
      séculos, sofrendo erosão a poente e ganhando terreno a nascente.


      O vento alia-se à maré para governar as águas. Tempestades vigorosas de oeste elevam as águas até 4 m
      acima do normal mantendo os baixios inundados vários dias; ventos persistentes de leste esvaziam a maré
      vazante a cotas mínimas, encalhando os barcos de passageiros nos cais. Por isso o litoral transmuta-se
      diariamente.


      O sapal consolida-se a partir do lodo. Cada maré cheia deposita uma fina camada de vasa; o solo seca
      gradualmente e é colonizado por plantas halófitas que estabilizam os sedimentos. A salicórnia
      (*zeekraal*), a estátice (*lamsoor*), a espartina (*Engels slijkgras*) e a valeriana-marinha
      (*schorrenkruid*) sucedem-se no terreno. A riqueza botânica progride da zona pioneira diária até ao
      sapal superior, inundado apenas por temporais. Como cada maré aporta sedimentos novos, o sapal alteia-se
      verticalmente acompanhando a subida do mar.
    wildlife: >-
      No mar de Wadden ocorrem cerca de 10.000 espécies de flora e fauna, das quais cerca de 2700 de origem
      marinha. Apenas nos sapais contam-se cerca de 2.300 espécies. É um dos principais entrepostos mundiais
      para limícolas e anatídeos: mais de um quarto das populações europeias de
      [colhereiro-europeu](/especie/platalea_leucorodia/), [alfaiate](/especie/recurvirostra_avosetta/),
      gaivina-de-bico-preto e garajau-comum nidifica no mar de Wadden. Quase todo o contingente migrador de
      ganso-de-faces-pretas e pilrito-das-praias da Europa e Sibéria ocidental recorre a este banco alimentar.
      No final do verão quase todos os exemplares de [pato-branco](/especie/tadorna_tadorna/) do norte e
      ocidente da Europa realizam a muda das rémiges nos seus refúgios mais tranquilos.


      Cada época acolhe contingentes distintos. Entre dez e doze milhões de aves migradoras cruzam o bem em
      cada ano médio, com concentrações simultâneas que atingem 6,1 milhões de indivíduos nos picos
      migratórios. A partir do dique de Groninga podem ver-se milhares de limícolas a alimentar-se no Wad e no
      Dollard. Nos sapais nidificam andorinhas-do-mar, perna-vermelha-comum, alfaiates e
      borrelhos-grandes-de-coleira; nas praias arenosas nidificam o
      [borrelho-de-coleira-interrompida](/especie/charadrius_alexandrinus/) e a
      [chilreta](/especie/sternula_albifrons/), ambas espécies ameaçadas que elegem justamente as praias mais
      apelativas ao lazer.


      As focas ilustram um assinalável sucesso conservacionista. Alvo de intensa perseguição até meados do
      século XX, os seus efetivos desceram a menos de 4000 exemplares de
      [foca-comum](/especie/phoca_vitulina/) e quase nenhum de [foca-cinzenta](/especie/halichoerus_grypus/).
      Atualmente o mar de Wadden alberga cerca de 20 % da subespécie de foca-comum do Atlântico Nordeste,
      totalizando 40.000 animais estimados em 2018, enquanto a maior maternidade de focas-cinzentas de todo o
      Wadden se localiza a oeste de Terschelling. No setor neerlandês mais de um quarto das focas-comuns
      frequenta estas águas durante a muda estival. Ocorre igualmente a
      [toninha-comum](/especie/phocoena_phocoena/). A epidemia do vírus da esgana das focas vitimou duramente
      a população em 1988, apesar da proteção jurídica em vigor.
    visit: >-
      A atividade de referência consiste em caminhar pelo leito marinho exposto na maré baixa: o *wadlopen*.
      Faz-se obrigatoriamente com um guia de wadlopen habilitado, conhecedor dos canais seguros que não
      perturbam as colónias de aves. Existem esteiros profundos e lodaçais que podem barrar a retirada. Em
      marés favoráveis é possível, por exemplo, caminhar desde o continente até Schiermonnikoog.


      A costa continental de Groninga reserva paragens pacíficas. Na restinga de Punt van Reide, maternidade
      de focas, nidificam andorinhas-do-mar, pernas-vermelhas e alfaiates. O observatório Kiekkaaste junto a
      Nieuwe Statenzijl descortina os baixios onde se alimentam as aves e, pontualmente, surgem toninhas. Em
      Lauwersoog o Parque de Céu Escuro convida a admirar o firmamento noturno, observar morcegos ou pedalar
      na ciclovia mais escura dos Países Baixos.


      As cinco ilhas Frísias neerlandesas—Texel, Vlieland, Terschelling, Ameland e Schiermonnikoog—são
      apelidadas de "cinco pérolas" do norte, contando com mais de 300 km de ciclovias; a grande rota ciclável
      LF10 Waddenzeeroute acompanha a margem continental. O centro de interpretação do Afsluitdijk é a porta
      de entrada da UNESCO no lado holandês, disponibilizando programas de descoberta da natureza.
    history: >-
      Em 1932 as pradarias de erva-marinha estendiam-se por mais de 150 km²; hoje encontram-se quase
      dizimadas, decorrendo projetos de restauração por sementeira. Em 2005 foi banida a apanha mecânica de
      berbigão no Wad holandês e a pesca de arrasto de fundo encontra-se fortemente restringida.


      O Wad foi classificado Património Mundial germano-holandês a 26 de junho de 2009, tendo o setor
      dinamarquês sido associado a 23 de junho de 2014. A maior parte do território neerlandês é monumento
      natural protegido e reserva da biosfera, englobando os parques nacionais de Schiermonnikoog, Lauwersmeer
      e Dunas de Texel. O turismo náutico impõe desafios à tranquilidade da fauna, embora fomente a adesão
      cívica à preservação deste património.
    before: >-
      Mantém distância regulamentar das focas e dos bandos em repouso, caminha exclusivamente nos trilhos
      marcados, recolhe o lixo e conduz o cão com trela. As marés e os ventos impõem cautela estrita: o
      wadlopen realiza-se sempre sob orientação de guias credenciados.
    around: >-
      O [Parque Nacional da Baixa Saxónia](/lugar/nationalpark-niedersachsisches-wattenmeer/) dá seguimento
      contíguo ao ecossistema intertidal além-fronteira, e o [Parque Nacional
      Lauwersmeer](/lugar/nationaal-park-lauwersmeer/) fica a dois quilómetros de distância. Mais distantes, o
      [Parque Nacional do Mar de Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) e o [Parque Nacional do
      Mar de Wadden (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/) partilham sapais, focas e
      avifauna ao longo da mesma rota migratória atlántica.
