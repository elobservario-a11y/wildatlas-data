resumen:
  es: Pastos y roquedos alpinos entre los valles Po y Varaita, con el bosque de pino cembro de Alevè.
  en: >-
    Alpine pastures and rocky crags between the Po and Varaita valleys, harbouring the ancient stone pine
    forest of Alevè.
  fr: >-
    Pâturages et falaises alpines entre les vallées du Pô et de la Varaita, abritant la forêt de pin cembro de
    l’Alevè.
  de: >-
    Alpine Matten und Felswände zwischen den Tälern des Po und der Varaita mit dem Arvenurwald Bosco
    dell’Alevè.
  it: Pascoli e pareti rocciose alpine tra le valli Po e Varaita, custodi del cembreto storico dell’Alevè.
  pt: >-
    Pastagens alpinas e fragas escarpadas entre os vales Po e Varaita, albergando a floresta de pinheiro-suíço
    de Alevè.
unico:
  es: >-
    Una montaña de roca verde que da nacimiento al Po y guarda el bosque puro de pino cembro más meridional de
    Europa.
  en: A mountain of greenstone giving birth to the Po and cradling Europe’s southernmost pure Swiss pine forest.
  fr: >-
    Une montagne de roches vertes qui donne naissance au Pô et préserve la cembraie pure la plus méridionale
    d’Europe.
  de: >-
    Ein Grüngesteinsberg, an dessen Fuß der Po entspringt und der den südlichsten reinen Arvenwald Europas
    birgt.
  it: >-
    Una montagna di pietre verdi che dà i natali al Po e custodisce il bosco puro di pino cembro più
    meridionale d’Europa.
  pt: >-
    Uma montanha de rocha verde onde nasce o rio Pó e que preserva o bosque puro de pinheiro-suíço mais
    meridional da Europa.
observaciones:
  es: >-
    Los perros deben ir con correa. Se puede acampar con tienda desde una hora antes del ocaso hasta dos horas
    después del alba, salvo en las turberas alpinas. En las áreas clasificadas como Parque está prohibido
    coger flores y recoger cuernas de ciervo. En las turberas alpinas está prohibido el pastoreo. El estado de
    los senderos de alta montaña y la apertura de los centros de visitantes hay que comprobarlos antes de ir;
    la afluencia es alta en Pian del Re en pleno verano.
texto:
  es:
    intro: >-
      El Po nace a los pies de una montaña de piedra verde. En Pian del Re nace el Po, a los pies del Monviso,
      que con sus 3841 metros es la cumbre más alta de los Alpes Cocios. Alrededor se extiende el Parque
      Natural del Monviso, creado por la ley regional 19/2015, entre los valles del Po y del Varaita, desde
      los 1300 m hasta la cima. Coincide en buena parte con la zona de conservación «Gruppo del Monviso e
      Bosco dell’Alevé», y el área queda dentro de la Reserva de la Biosfera MaB UNESCO del Monviso.
    landscape: >-
      El Monviso pertenece al grupo geológico de las piedras verdes, rocas volcánicas oceánicas en parte
      metamorfizadas, formadas hace unos 80 millones de años. De ahí el color de algunos lagos: el Lago
      Chiaretto debe su turquesa a la esmaragdita, un mineral de esas ofiolitas del Monviso.


      El parque son dos mundos. En el alto valle del Po casi todo queda por encima del límite del bosque,
      entre roquedos y canchales; en el valle del Varaita hay además grandes superficies de bosque, el Bosco
      dell’Alevè. En conjunto predominan los ambientes alpinos: praderas de altura, matorrales, rocas,
      canchales y algún resto de glaciar. Muchos prados se usan todavía como pasto de alpe para vacas y
      ovejas.


      El Alevè ocupa unas 825 hectáreas en la vertiente sur del macizo, entre 1500 y 2500 m. Es la mayor
      formación de pino cembro puro, o con alerce, de los Alpes occidentales, y el bosque «puro» más
      meridional de toda Europa. Junto al refugio Bagnour está el cembro más viejo del bosque, de unos 550
      años, inscrito desde 2018 entre los Árboles Monumentales de Italia. Antes el cembro era mucho más común
      en los Alpes, pero el ser humano lo eliminó de forma sistemática para crear pastos. Desde 1949 el bosque
      figura en el Registro de bosques de semilla, y la semilla se recoge para crear nuevos bosques de cembro.
      Su nombre viene del occitano «èlvou», que significa pino cembro.
    wildlife: >-
      Casi todo aquí es de altura. El [íbice](/especie/capra_ibex/), la [marmota](/especie/marmota_marmota/),
      el [rebeco](/especie/rupicapra_rupicapra/) y el [ciervo](/especie/cervus_elaphus/) son los mamíferos más
      visibles; también hay [lobo](/especie/canis_lupus/) y varios murciélagos. Entre las aves se han citado
      117 especies, 48 de ellas con cría segura. Las zonas altas son buen hábitat del [lagópodo
      alpino](/especie/lagopus_muta/) y de la liebre variable, mientras el gallo lira y la perdiz griega viven
      más abajo. En el Alevè, el cascanueces esconde reservas de alimento y así ayuda a propagar el pino
      cembro.


      El verano trae los buitres. El buitre leonado, cada vez más presente, se ve entre julio y septiembre en
      los valles del Po y del Varaita, en grupos que buscan carroña. El
      [quebrantahuesos](/especie/gypaetus_barbatus/) se ve mejor en invierno y a principios de primavera,
      sobre todo en el Varaita; se extinguió en el siglo XIX y volvió con una reintroducción iniciada en 1986
      en el parque nacional austriaco de Hohe Tauern. El buitre negro es raro. Si ves uno, puedes compartir la
      foto en el proyecto iNaturalist de la Reserva de la Biosfera del Monviso.


      La estrella pequeña es la salamandra negra de Lanza, un endemismo de los Alpes Cocios que no existe en
      ningún otro lugar del mundo y es la especie más sensible del parque. Pian del Re es el sitio donde más
      fácil resulta verla, y en la orilla del Lago Fiorenza, sobre todo tras la lluvia, es fácil toparse con
      ella. Con tiempo húmedo o nuboso, hay que evitar pisar salamandras en los senderos y al aparcar en Pian
      del Re. También hay mariposas protegidas, como Parnassius apollo.
    visit: >-
      A Pian del Re se llega en coche o en la lanzadera desde Pian della Regina o Crissolo, la opción
      recomendada. Allí, un pequeño centro de visitantes en la antigua casermetta explica la flora y la fauna
      con paneles, y un local cercano de acceso libre ofrece paneles en cuatro idiomas. En Casteldelfino, el
      centro Alevè interpreta el bosque con un diorama a escala natural.


      El itinerario 1 del Giro dei Laghi parte de Pian del Re y pasa por los lagos Fiorenza, Chiaretto,
      Lausetto y Superiore: 7,45 km, 390 m de desnivel y unas 3 horas. Un tramo del circuito de lagos puede
      seguir cubierto de nieve hasta avanzada la temporada.


      La gran travesía es el Giro del Monviso. El primero del que hay constancia lo hizo el inglés D. Forbes
      con un guía local el 1 de julio de 1839. Hoy el anillo suma 45 km con 2600 m de desnivel acumulado,
      entre los 1900 y los 2950 m del Colle delle Traversette; es de dificultad E, con pequeños tramos para
      excursionistas expertos, y necesita de dos a cinco días según la preparación. Pasa por el Buco di Viso,
      un antiguo túnel que se puede recorrer y lleva a la vertiente francesa, mejor con linterna.
    history: >-
      La primera ascensión al Monviso la hicieron el 30 de agosto de 1861 William Mathews, Frederick Jacomb y
      los guías Jean-Baptiste y Michel Croz. El nombre viene del latín Mons Vesulus, «montaña muy visible» y
      aislada. Hoy el gestor señala las actividades turístico-recreativas como amenaza para las aves alpinas
      del parque.
    before: >-
      Los perros deben ir con correa. Se puede acampar con tienda desde una hora antes del ocaso hasta dos
      horas después del alba, salvo en las turberas alpinas. En las áreas clasificadas como Parque está
      prohibido coger flores y recoger cuernas de ciervo. En las turberas alpinas está prohibido el pastoreo.
      El estado de los senderos de alta montaña y la apertura de los centros de visitantes hay que
      comprobarlos antes de ir; la afluencia es alta en Pian del Re en pleno verano.
    around: >-
      A solo 2 km queda el [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/). A
      veintidós kilómetros está el [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), y a veintiséis, el [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/).
  en:
    intro: >-
      The Po is born at the foot of a greenstone pyramid. At Pian del Re rises the River Po, beneath Monviso,
      which at 3841 metres stands as the highest summit of the Cottian Alps. Surrounding it spreads the
      Monviso Natural Park, established by regional law 19/2015 across the Po and Varaita valleys, extending
      from 1300 m up to the crest. It coincides largely with the special conservation area «Gruppo del Monviso
      e Bosco dell’Alevé», encompassed within the UNESCO MaB Biosphere Reserve of Monviso.
    landscape: >-
      Monviso belongs geologically to the greenstones group—oceanic volcanic rocks metamorphosed roughly 80
      million years ago. This origin explains the turquoise hues of several high lakes: Lago Chiaretto owes
      its distinctive colour to smaragdite, a mineral derived from these local ophiolites.


      The park encompasses two distinct worlds. In the upper Po valley, almost everything rises above the
      timberline among crags, scree slopes and boulder fields; in the Varaita valley, extensive woodlands
      unfold within the Bosco dell’Alevè. Overall, alpine environments predominate: high meadows, dwarf-shrub
      heathlands, rocks, scree and glacial relicts. Many upland pastures are still grazed seasonally by cattle
      and sheep.


      The Alevè forest occupies some 825 hectares on the southern flank of the massif, between 1500 and 2500
      m. It constitutes the largest pure Swiss stone pine forest (partly intermingled with larch) in the
      Western Alps and the southernmost pure stone pine stand in Europe. Beside Rifugio Bagnour stands the
      oldest pine in the woods, around 550 years old, listed since 2018 among the Monumental Trees of Italy.
      Stone pine was formerly far more widespread throughout the Alps before systematic clearance for pasture.
      Since 1949 the forest has been entered into the National Register of Seed Forests, harvested to
      re-establish new stone pine stands. Its name derives from the Occitan «èlvou», meaning Swiss stone pine.
    wildlife: >-
      Almost all wildlife here belongs to high-altitude zones. The [Alpine ibex](/especie/capra_ibex/),
      [Alpine marmot](/especie/marmota_marmota/), [chamois](/especie/rupicapra_rupicapra/) and [red
      deer](/especie/cervus_elaphus/) are the most conspicuous mammals, alongside the
      [wolf](/especie/canis_lupus/) and several bat species. Among birds, 117 species have been recorded, with
      48 confirmed breeding. High ridges provide prime habitat for the [ptarmigan](/especie/lagopus_muta/) and
      mountain hare, while black grouse and rock partridge inhabit lower slopes. In the Alevè woods, the
      spotted nutcracker caches seed reserves, actively regenerating the stone pine canopy.


      Summer brings vultures. The griffon vulture is increasingly observed between July and September in the
      Po and Varaita valleys in scavenging groups. The [bearded vulture](/especie/gypaetus_barbatus/) is best
      seen in winter and early spring, particularly in the Varaita valley; it died out locally in the
      nineteenth century and returned following a reintroduction programme launched in 1986 in Austria's Hohe
      Tauern National Park. The cinereous vulture is a rare visitor; sightings can be logged on the park’s
      iNaturalist project.


      The jewel among small fauna is Lanza's alpine salamander, an endemic amphibian of the Cottian Alps found
      nowhere else on Earth and the park’s most sensitive species. Pian del Re is where it is most reliably
      encountered, often spotted near the shores of Lago Fiorenza after rain. In damp conditions, take special
      care not to step on salamanders along trails or when parking at Pian del Re. Protected butterflies such
      as Parnassius apollo are also found.
    visit: >-
      Pian del Re is reached by car or via the shuttle bus from Pian della Regina or Crissolo—the recommended
      choice. There, a small visitor centre in the historic casermetta explains flora and fauna with displays,
      and an adjacent room provides information panels in four languages. In Casteldelfino, the Alevè centre
      interprets the stone pine forest with a life-size diorama.


      Itinerary 1 of the Giro dei Laghi departs from Pian del Re, visiting lakes Fiorenza, Chiaretto, Lausetto
      and Superiore: 7.45 km, 390 m of elevation gain and about 3 hours. Sections of this lake circuit may
      remain snow-covered well into the summer season.


      The premier long-distance route is the Giro del Monviso. The earliest documented circumnavigation was
      completed by the Englishman D. Forbes with a local guide on 1 July 1839. Today the loop covers 45 km
      with 2600 m of cumulative ascent, traversing between 1900 and 2950 m at the Colle delle Traversette;
      graded E with short technical passages for experienced walkers, it requires between two and five days
      depending on pace. It passes through the Buco di Viso, an ancient tunnel leading through into France,
      for which a torch is recommended.
    history: >-
      The first ascent of Monviso was achieved on 30 August 1861 by William Mathews, Frederick Jacomb and
      guides Jean-Baptiste and Michel Croz. The name derives from the Latin Mons Vesulus, signifying a
      «prominent, isolated mountain». Today park managers cite intensive tourism recreation as a key pressure
      on sensitive alpine birdlife.
    before: >-
      Dogs must be kept on a leash at all times. Tenting is permitted from one hour before sunset until two
      hours after sunrise, except within alpine peatlands. In areas designated as Natural Park, picking wild
      flowers and collecting fallen deer antlers are prohibited. Grazing is prohibited across alpine bogs.
      Always verify trail conditions and visitor centre opening hours before setting out; summer crowds are
      high at Pian del Re.
    around: >-
      Just 2 km away lies [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/). At
      twenty-two kilometres is [Parco naturale della Val Troncea](/lugar/parco-naturale-della-val-troncea/),
      and at twenty-six, [Parc National du Mercantour](/lugar/parc-national-du-mercantour/).
  fr:
    intro: >-
      Le Pô prend sa source au pied d’une pyramide de roches vertes. C’est à Pian del Re que jaillit le
      fleuve, au pied du mont Viso dont les 3841 mètres forment le point culminant des Alpes cottiennes. Tout
      autour s’étend le parc naturel du mont Viso, institué par la loi régionale 19/2015 entre les vallées du
      Pô et de la Varaita, s’élevant depuis 1300 m jusqu’au sommet. Il coïncide largement avec la zone de
      conservation « Gruppo del Monviso e Bosco dell’Alevé », intégrée à la réserve de biosphère UNESCO du
      Mont-Viso.
    landscape: >-
      Le mont Viso appartient au groupe géologique des roches vertes (ophiolites), roches volcaniques
      océaniques métamorphisées voici environ 80 millions d’années. C’est à ces minéraux que le lac Chiaretto
      doit sa teinte turquoise, issue de la smaragdite.


      Le parc s’ouvre sur deux mondes contrastés. Dans la haute vallée du Pô, presque tout s’élève au-dessus
      de la limite des arbres, parmi pierriers et éboulis ; dans la vallée de la Varaita s’étendent les vastes
      boisements de l’Alevè. Partout dominent les paysages alpins : pelouses d’altitude, landes rases, parois
      rocheuses et vestiges glaciaires. De nombreux alpages restent pâturés en été par bovins et ovins.


      La forêt de l’Alevè s’étend sur environ 825 hectares sur le versant sud du massif, entre 1500 et 2500 m.
      Elle forme la plus vaste cembraie pure (mêlée de mélèzes) des Alpes occidentales et le peuplement pur le
      plus méridional de tout le continent. Près du refuge Bagnour s’élève le doyen des pins cembros, âgé
      d’environ 550 ans, répertorié depuis 2018 parmi les Arbres monumentaux d’Italie. Jadis très répandu dans
      l’arc alpin, le pin cembro fut défriché pour créer des pâtures. Depuis 1949, la forêt est inscrite au
      Registre national des forêts semencières. Son nom dérive de l’occitan « èlvou », qui désigne le pin
      cembro.
    wildlife: >-
      La faune est typiquement alpine. Le [bouquetin](/especie/capra_ibex/), la
      [marmotte](/especie/marmota_marmota/), le [chamois](/especie/rupicapra_rupicapra/) et le [cerf
      élaphe](/especie/cervus_elaphus/) figurent parmi les grands mammifères visibles, avec le
      [loup](/especie/canis_lupus/) et diverses chauves-souris. Côté avifaune, 117 espèces sont recensées,
      dont 48 nicheuses certaines. Les crêtes accueillent le [lagopède alpin](/especie/lagopus_muta/) et le
      lièvre variable, tandis que le tétras-lyre occupe l’étage inférieur. Dans l’Alevè, le cassenoix moucheté
      dissémine les graines de pin cembro en constituant ses réserves.


      L’été attire les vautours. Le vautour fauve s’observe entre juillet et septembre dans les vallées du Pô
      et de la Varaita. Le [gypaète barbu](/especie/gypaetus_barbatus/) se repère l’hiver et au début du
      printemps dans le haut Varaita ; disparu au XIXe siècle, il est revenu grâce au programme de
      réintroduction engagé en 1986 dans le parc autrichien des Hohe Tauern. Le vautour moine est plus rare.


      L’espèce la plus remarquable demeure la salamandre de Lanza, amphibien endémique des Alpes cottiennes
      inconnu ailleurs sur Terre. Pian del Re et les rives du lac Fiorenza constituent les lieux privilégiés
      pour l’observer par temps pluvieux. Lorsque le ciel est humide, veillez à ne pas écraser les salamandres
      sur les sentiers et sur les parkings. Les papillons comptent également l’Apollon.
    visit: >-
      Pian del Re se rejoint en voiture ou via la navette depuis Pian della Regina ou Crissolo, option
      recommandée. Sur place, la casermetta propose une scénographie sur la faune et la flore, complétée d’un
      espace en accès libre en quatre langues. À Casteldelfino, le centre Alevè retrace l’histoire de la
      cembraie avec un diorama à l’échelle.


      L’itinéraire 1 du Giro dei Laghi part de Pian del Re et relie les lacs Fiorenza, Chiaretto, Lausetto et
      Superiore : 7,45 km, 390 m de dénivelé pour environ 3 heures de marche. Certains passages peuvent rester
      enneigés jusqu’au cœur de l’été.


      Le grand défi est le Giro del Monviso. Le premier tour documenté fut accompli par l’Anglais D. Forbes et
      son guide le 1 juillet 1839. Aujourd’hui, la boucle totalise 45 km et 2600 m de dénivelé cumulé entre
      1900 et 2950 m au col de la Traversette ; classée en difficulté E, elle exige de deux à cinq jours. Elle
      franchit le Buco di Viso, tunnel historique percé sous la crête pour relier le versant français, à
      parcourir muni d’une lampe frontale.
    history: >-
      La première ascension du mont Viso fut réussie le 30 août 1861 par William Mathews, Frederick Jacomb et
      les guides Jean-Baptiste et Michel Croz. Le toponyme découle du latin Mons Vesulus (« mont visible de
      loin »). Le gestionnaire alerte sur la pression touristique qui menace les oiseaux d’altitude.
    before: >-
      Les chiens doivent impérativement être tenus en laisse. Le bivouac sous tente est toléré d’une heure
      avant le coucher du soleil à deux heures après l’aube, sauf dans les tourbières alpines. La cueillette
      de fleurs et le ramassage de mues de cerfs sont interdits. Le pâturage est prohibé dans les tourbières.
      Vérifiez l’état des sentiers de haute montagne et l’ouverture des centres d’accueil ; l’affluence est
      très soutenue à Pian del Re en plein été.
    around: >-
      À seulement 2 km se trouve le [Parc Naturel Régional du
      Queyras](/lugar/parc-naturel-regional-du-queyras/). À vingt-deux kilomètres s'étend le [Parco naturale
      della Val Troncea](/lugar/parco-naturale-della-val-troncea/), et à vingt-six, le [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/).
  de:
    intro: >-
      Der Po entspringt am Fuß einer Pyramide aus grünem Stein. In Pian del Re quillt die Quelle des Po empor,
      überragt vom Monte Viso, der mit 3841 Metern den höchsten Gipfel der Cottischen Alpen darstellt. Ringsum
      dehnt sich der durch das Regionalgesetz 19/2015 gegründete Naturpark Monviso zwischen Po- und
      Varaita-Tal aus, von 1300 m bis zum Gipfelgrat reichend. Er entspricht weitgehend dem Schutzgebiet
      «Gruppo del Monviso e Bosco dell’Alevé» innerhalb des UNESCO-Biosphärenreservats Monviso.
    landscape: >-
      Der Monviso gehört zur Gesteinsgruppe der Ophiolithe (Grüngesteine), ozeanischen Ursprungs, die vor rund
      80 Millionen Jahren metamorph überprägt wurden. Diesem Gestein verdankt der Lago Chiaretto sein Türkis,
      hervorgerufen durch das Mineral Smaragdit.


      Der Park vereint zwei Welten. Im oberen Po-Tal liegt fast das gesamte Terrain oberhalb der Waldgrenze
      inmitten von Blockhalden und Schuttkegeln; im Varaita-Tal breiten sich die geschlossenen Wälder des
      Bosco dell’Alevè aus. Es überwiegen alpine Lebensräume: Hochweiden, Zwergstrauchheiden, Felsen und
      Gletscherreste. Viele Almen dienen weiterhin der sommerlichen Rinder- und Schafbeweidung.


      Der Alevè-Wald bedeckt rund 825 Hektar an der Südflanke des Massivs zwischen 1500 und 2500 m Höhe. Er
      bildet das größte reine Arvenwaldgebiet (teils mit Lärche durchsetzt) der Westalpen und das südlichste
      reine Zirbelkiefernvorkommen Europas. Nahe dem Rifugio Bagnour steht die älteste Arve des Waldes, etwa
      550 Jahre alt, seit 2018 in das Register monumentaler Bäume Italiens eingetragen. Seit 1949 ist der Wald
      als Saatgutbestand registriert. Der Name stammt vom okzitanischen «èlvou» für Zirbelkiefer.
    wildlife: >-
      Fast die gesamte Tierwelt ist an das Hochgebirge angepasst. [Alpensteinbock](/especie/capra_ibex/),
      [Alpenmurmeltier](/especie/marmota_marmota/), [Gämse](/especie/rupicapra_rupicapra/) und
      [Rothirsch](/especie/cervus_elaphus/) sind leicht auszumachen, neben dem [Wolf](/especie/canis_lupus/)
      und Fledermäusen. Unter den Vögeln sind 117 Arten nachgewiesen, davon 48 gesicherte Brutvögel. Die Grate
      bieten Lebensraum für [Alpenschneehuhn](/especie/lagopus_muta/) und Schneehase, während Birkhuhn und
      Steinhuhn tiefer siedeln. Im Alevè-Wald sorgt der Tannenhäher durch seine Samenverstecke für die
      Naturverjüngung der Arven.


      Der Sommer lockt Geier an. Der Gänsegeier lässt sich von Juli bis September in Po- und Varaita-Tal
      beobachten. Der [Bartgeier](/especie/gypaetus_barbatus/) zeigt sich vor allem im Spätwinter im
      Varaita-Tal; nach seinem Erlöschen im neunzehnten Jahrhundert kehrte er dank des 1986 im Nationalpark
      Hohe Tauern begonnenen Wiederansiedlungsprojekts zurück. Der Mönchsgeier ist ein seltener Gast.


      Besonderes Aushängeschild ist der Lanza-Alpensalamander, eine endemische Amphibienart der Cottischen
      Alpen. Pian del Re und das Ufer des Lago Fiorenza bieten nach Regen günstige Beobachtungsbedingungen;
      achte bei Nässe darauf, keine Tiere auf Wegen oder Parkplätzen zu zertreten. Auch der Rote Apollofalter
      fliegt hier.
    visit: >-
      Pian del Re erreicht man mit dem Auto oder per Shuttlebus ab Pian della Regina oder Crissolo. Vor Ort
      bietet eine kleine Ausstellung in der historischen Kaserne Einblicke in Naturräume, ergänzt um
      Informationstafeln in vier Sprachen. In Casteldelfino veranschaulicht das Alevè-Zentrum den Arvenwald
      anhand eines Großdioramas.


      Die Route 1 des Giro dei Laghi startet in Pian del Re und führt zu den Seen Fiorenza, Chiaretto,
      Lausetto und Superiore: 7,45 km, 390 Höhenmeter und rund 3 Stunden Gehzeit. Teilstrecken können bis in
      den Hochsommer schneebedeckt bleiben.


      Die große Umrundung ist der Giro del Monviso. Die erste verbürgte Tour meisterte der Engländer D. Forbes
      am 1. Juli 1839. Die Schleife misst 45 km mit 2600 Höhenmetern Aufstieg zwischen 1900 und 2950 m Höhe am
      Colle delle Traversette; Schwierigkeitsgrad E, Gehzeit zwei bis fünf Tage. Sie durchquert das Buco di
      Viso, einen historischen Felstunnel nach Frankreich (Taschenlampe erforderlich).
    history: >-
      Die Erstbesteigung des Monviso glückte am 30. August 1861 William Mathews, Frederick Jacomb und den
      Bergführern Jean-Baptiste und Michel Croz. Der Name stammt vom lateinischen Mons Vesulus («weithin
      sichtbarer Berg»). Die Parkverwaltung sieht im Massentourismus eine ernste Bedrohung für die alpine
      Vogelwelt.
    before: >-
      Hunde müssen an der Leine geführt werden. Zelten ist von einer Stunde vor Sonnenuntergang bis zwei
      Stunden nach Sonnenaufgang gestattet, außer in alpinen Mooren. Das Pflücken von Blumen und Sammeln von
      Abwurfstangen ist untersagt. Das Beweiden alpiner Moore ist verboten. Zustand der Bergwege vorab prüfen;
      Pian del Re ist im Hochsommer stark frequentiert.
    around: >-
      In nur 2 km Entfernung liegt der [Parc Naturel Régional du
      Queyras](/lugar/parc-naturel-regional-du-queyras/). Zweiundzwanzig Kilometer entfernt liegt der [Parco
      naturale della Val Troncea](/lugar/parco-naturale-della-val-troncea/) und sechsundzwanzig Kilometer der
      [Parc National du Mercantour](/lugar/parc-national-du-mercantour/).
  it:
    intro: >-
      Il Po nasce ai piedi di una piramide di pietra verde. A Pian del Re sgorga il Po, ai piedi del Monviso,
      che con i suoi 3841 metri svetta come la cima più elevata delle Alpi Cozie. Tutt'intorno si allarga il
      Parco Naturale del Monviso, istituito dalla legge regionale 19/2015 tra le valli Po e Varaita,
      snodandosi dai 1300 m fino alla vetta. Coincide in gran parte con la zona di conservazione «Gruppo del
      Monviso e Bosco dell’Alevé», compresa nella Riserva della Biosfera MaB UNESCO del Monviso.
    landscape: >-
      Il Monviso appartiene al gruppo geologico delle pietre verdi (ofioliti), rocce vulcaniche oceaniche
      metamorfosate circa 80 milioni di anni fa. Da esse deriva la caratteristica sfumatura turchese di laghi
      come il Lago Chiaretto, colorato dalla smaragdite.


      Il parco accoglie due mondi distinti. Nell'alta valle Po quasi tutto si colloca oltre il limite della
      vegetazione arborea tra sfasciumi e pietraie; nella valle Varaita si distendono invece le fitte conifere
      del Bosco dell'Alevè. Prevalgono gli ecosistemi alpini d'alta quota: pascoli, brughiere a rododendro,
      creste rocciose e residui glaciali. Numerose malghe sono tuttora caricate per l'alpeggio estivo.


      L'Alevè copre circa 825 ettari sul versante meridionale del massiccio, fra 1500 e 2500 m. È la più vasta
      formazione di pino cembro puro (con larice sparso) delle Alpi occidentali e il cembreto puro più
      meridionale d'Europa. Accanto al rifugio Bagnour sorge il cembro più vetusto, di circa 550 anni, censito
      dal 2018 tra gli Alberi Monumentali d'Italia. Il cembro fu drasticamente ridotto dall'uomo per ricavare
      pascoli. Dal 1949 il bosco figura nel Registro dei boschi da seme. Il toponimo deriva dall'occitano
      «èlvou», che significa cembro.
    wildlife: >-
      La fauna è tipica dei grandi spazi alpini. Lo [stambecco](/especie/capra_ibex/), la
      [marmotta](/especie/marmota_marmota/), il [camoscio](/especie/rupicapra_rupicapra/) e il
      [cervo](/especie/cervus_elaphus/) sono i mammiferi più facili da scorgere, insieme al
      [lupo](/especie/canis_lupus/) e a vari pipistrelli. Fra l'avifauna si contano 117 specie, 48 delle quali
      nidificanti certe. Sulle balze sassose dimorano la [pernice bianca](/especie/lagopus_muta/) e la lepre
      variabile, mentre fagiano di monte e coturnice vivono più in basso. Nell'Alevè la nocciolaia accumula
      pinoli nel terreno agevolando la propagazione naturale del cembro.


      L'estate raduna gli avvoltoi. Il grifone si osserva con regolarità tra luglio e settembre nelle valli Po
      e Varaita. Il [gipeto](/especie/gypaetus_barbatus/) si avvista in inverno e a inizio primavera nella
      valle Varaita; estintosi nell'Ottocento, è ricomparso grazie al piano di reintroduzione avviato nel 1986
      negli Alti Tauri in Austria. Raro è l'avvoltoio monaco.


      Il gioiello faunistico è la salamandra di Lanza, anfibio endemico esclusivo delle Alpi Cozie. Pian del
      Re e il Lago Fiorenza ne costituiscono i siti di migliore osservazione nei giorni piovosi; con asfalto e
      sentieri bagnati occorre prestare la massima cura a non calpestarle. Tra i lepidotteri spicca il
      Parnassius apollo.
    visit: >-
      A Pian del Re si accede in auto o tramite navetta da Pian della Regina o Crissolo, soluzione caldamente
      consigliata. La casermetta ospita un centro visite didattico e uno spazio con pannelli in quattro
      lingue. A Casteldelfino il Centro Alevè approfondisce il cembreto con un diorama a grandezza reale.


      L'itinerario 1 del Giro dei Laghi si sviluppa da Pian del Re toccando i laghi Fiorenza, Chiaretto,
      Lausetto e Superiore: 7,45 km, 390 m di dislivello per circa 3 ore. Alcuni tratti del giro possono
      rimanere innevati fino a stagione inoltrata.


      Il grande classico d'alta quota è il Giro del Monviso. Il primo anello documentato fu compiuto
      dall'inglese D. Forbes con una guida locale il 1 luglio 1839. Oggi l'anello copre 45 km con 2600 m di
      dislivello positivo fra 1900 e 2950 m del Colle delle Traversette; di difficoltà E, richiede da due a
      cinque giorni. Attraversa il Buco di Viso, galleria scavata nella roccia per valicare il confine
      francese, percorribile con torcia.
    history: >-
      La prima ascensione del Monviso fu compiuta il 30 agosto 1861 da William Mathews, Frederick Jacomb e
      dalle guide Jean-Baptiste e Michel Croz. Il toponimo deriva dal latino Mons Vesulus («montagna ben
      visibile»). L'ente parco indica la pressione turistica fra i fattori di disturbo per l'avifauna alpina.
    before: >-
      I cani devono essere tenuti costantemente al guinzaglio. Il campeggio con tenda è consentito da un'ora
      prima del tramonto a due ore dopo l'alba, escluse le torbiere alpine. È proibito cogliere fiori e
      raccogliere palchi di cervo. Il pascolo è vietato nelle torbiere alpine. Verifica sempre lo stato dei
      sentieri; l'afflusso è elevato a Pian del Re in estate.
    around: >-
      A soli 2 km si trova il [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/). A
      ventidue chilometri sorge il [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), e a ventisei, il [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/).
  pt:
    intro: >-
      O rio Pó nasce aos pés de uma pirâmide de pedra verde. É em Pian del Re que brota o Pó, dominado pelo
      Monviso que com os seus 3841 metros é a montanha mais alta dos Alpes Cócios. Em redor estende-se o
      Parque Natural do Monviso, criado pela lei regional 19/2015 entre os vales do Po e do Varaita, desde os
      1300 m até ao cimo. Coincide largamente com a área de conservação «Gruppo del Monviso e Bosco
      dell’Alevé», integrada na Reserva da Biosfera MaB UNESCO do Monviso.
    landscape: >-
      O Monviso pertence ao grupo geológico das rochas verdes (ofiolitos), materiais vulcânicos oceânicos
      metamorfoseados há cerca de 80 milhões de anos. É dessa matriz que o Lago Chiaretto colhe a tonalidade
      turquesa, devida à presença de esmaragdite.


      O parque congrega dois mundos. No alto vale do Po quase todo o relevo se posiciona acima do limite
      arbóreo entre cascalheiras e escarpas; no vale do Varaita desdobram-se extensos mantos florestais no
      Bosco dell'Alevè. Prevalecem os biótopos alpinos: pastagens altas, charnecas de altitude, rochedos e
      resquícios glaciares. Vários alpages continuam ocupados no verão por vacas e ovelhas.


      O Alevè ocupa perto de 825 hectares na encosta sul do maciço, entre 1500 e 2500 m de altitude. É a maior
      mancha pura de pinheiro-suíço (com lariço disperso) dos Alpes ocidentais e a mata pura mais meridional
      da Europa. Perto do refúgio Bagnour ergue-se o pinheiro mais antigo da floresta, com cerca de 550 anos,
      averbado desde 2018 nas Árvores Monumentais de Itália. O pinheiro-suíço foi outrora abatido em larga
      escala para dar lugar a pastos. Desde 1949 a floresta está inscrita no Registo de Matas de Sementeira. A
      designação descende do occitano «èlvou», que significa pinheiro-suíço.
    wildlife: >-
      A fauna reflete a grande altitude. O [íbis-dos-alpes](/especie/capra_ibex/), a
      [marmota](/especie/marmota_marmota/), a [camurça](/especie/rupicapra_rupicapra/) e o
      [veado](/especie/cervus_elaphus/) são os mamíferos mais visíveis, a par do [lobo](/especie/canis_lupus/)
      e de vários morcegos. Entre as aves registam-se 117 espécies, 48 das quais nidificantes comprovadas. Os
      cumes acolhem a [lagópode-branca](/especie/lagopus_muta/) e a lebre-variável, enquanto o galo-lira e a
      perdiz-grega povoam níveis inferiores. No Alevè o quebra-nozes esconde sementes no solo e assegura a
      regeneração do arvoredo.


      O verão atrai abutres. O grifo surge entre julho e setembro nos vales do Po e do Varaita. O
      [quebra-ossos](/especie/gypaetus_barbatus/) avista-se sobretudo no inverno e início da primavera no alto
      Varaita; desaparecido no século XIX, regressou graças à reintrodução encetada em 1986 no Parque Nacional
      Hohe Tauern, na Áustria. O abutre-preto é visitante raro.


      A relíquia biológica é a salamandra-de-lanza, anfíbio endémico restrito aos Alpes Cócios. Pian del Re e
      as margens do Lago Fiorenza são os locais mais propícios para a avistar sob tempo chuvoso; com humidade
      acrescida, cuida para não as pisar nos caminhos ou no estacionamento de Pian del Re. Destacam-se também
      borboletas como a Parnassius apollo.
    visit: >-
      A Pian del Re acede-se em automóvel ou através do autocarro vaivém desde Pian della Regina ou Crissolo,
      a opção recomendada. No local, a antiga casermetta acolhe um pequeno centro interpretativo e uma sala
      aberta com painéis informativos em quatro línguas. Em Casteldelfino, o Centro Alevè explica o
      ecossistema florestal com um diorama à escala real.


      O itinerário 1 do Giro dei Laghi parte de Pian del Re contornando os lagos Fiorenza, Chiaretto, Lausetto
      e Superiore: 7,45 km, 390 m de desnível positivo e perto de 3 horas. Alguns troços da volta aos lagos
      podem reter neve até ao meio do verão.


      A grande travessia de montanha é o Giro del Monviso. O primeiro circuito certificado foi efetuado pelo
      inglês D. Forbes acompanhado por um guia a 1 de julho de 1839. O anel soma hoje 45 km e 2600 m de
      desnível acumulado entre os 1900 e os 2950 m no Colle delle Traversette; classificado com grau E, exige
      entre dois e cinco dias conforme o ritmo. Cruza o Buco di Viso, túnel ancestral cavado na rocha rumo à
      vertente francesa, recomendando-se lanterna.
    history: >-
      A primeira escalada ao Monviso ocorreu a 30 de agosto de 1861 por William Mathews, Frederick Jacomb e
      pelos guias Jean-Baptiste e Michel Croz. O nome deriva do latim Mons Vesulus («monte bem visível»). A
      entidade gestora aponta o turismo massificado como ameaça para as aves alpinas.
    before: >-
      Os cães devem circular sempre com trela. O acampamento em tenda é permitido desde uma hora antes do pôr
      do sol até duas horas após o alvorecer, exceto nas turfeiras alpinas. É interdito colher flores e
      recolher armações caídas de veado. O pastoreio é proibido nas turfeiras de altitude. Confirma o estado
      dos trilhos antes de partir; a afluência é muito elevada em Pian del Re no verão.
    around: >-
      A apenas 2 km fica o [Parc Naturel Régional du Queyras](/lugar/parc-naturel-regional-du-queyras/). A
      vinte e dois quilómetros situa-se o [Parco naturale della Val
      Troncea](/lugar/parco-naturale-della-val-troncea/), e a vinte e seis, o [Parc National du
      Mercantour](/lugar/parc-national-du-mercantour/).
