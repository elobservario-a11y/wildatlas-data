resumen:
  es: >-
    El techo de la península ibérica (Mulhacén 3.479 m y Veleta 3.396 m), Reserva de la Biosfera con más de 80
    especies botánicas endémicas exclusivas.
  en: >-
    The roof of the Iberian Peninsula (Mulhacén 3,479 m and Veleta 3,396 m), a Biosphere Reserve with over 80
    exclusive endemic plant species.
  fr: >-
    Le toit de la péninsule Ibérique (Mulhacén 3 479 m et Veleta 3 396 m), réserve de biosphère abritant plus
    de 80 espèces végétales endémiques exclusives.
  de: >-
    Das Dach der Iberischen Halbinsel (Mulhacén 3.479 m und Veleta 3.396 m), ein Biosphärenreservat mit über
    80 ausschließlich hier vorkommenden Pflanzenendemiten.
  it: >-
    Il tetto della penisola iberica (Mulhacén 3.479 m e Veleta 3.396 m), Riserva della Biosfera con oltre 80
    specie botaniche endemiche esclusive.
  pt: >-
    O teto da Península Ibérica (Mulhacén 3.479 m e Veleta 3.396 m), Reserva da Biosfera com mais de 80
    espécies botânicas endémicas exclusivas.
unico:
  es: >-
    Es un macizo donde la nieve de los neveros convive con una flora de endemismos que llegó huyendo de la
    glaciación y se quedó atrapada en las cumbres.
  en: >-
    A towering massif where perennial snow patches coexist with endemic flora that took refuge from ice-age
    glaciations and became trapped on the high summits.
  fr: >-
    Un massif où les névés d'altitude côtoient une flore endémique réfugiée lors des glaciations et restée
    isolée sur les plus hauts sommets.
  de: >-
    Ein Hochgebirgsmassiv, auf dem Firnfelder und Schneeflecken mit einer endemischen Eiszeitreliktflora
    koexistieren, die auf den Gipfeln isoliert wurde.
  it: >-
    Un maestoso massiccio dove i nevai perenni convivono con una flora endemica relitta sfuggita alle
    glaciazioni e rimasta confinata sulle vette.
  pt: >-
    Um imenso maciço onde os campos de neve perpétua convivem com uma flora endémica fóssil refugiada das
    glaciações e isolada nos píncaros.
observaciones:
  es: >-
    Dentro del parque no se puede hacer fuego, acampar sin autorización, llevar perros sueltos, recolectar
    animales, plantas o rocas ni circular campo a través con vehículos o bicicletas. Para ascensiones por la
    alta montaña sin experiencia se aconseja contratar un guía. Desde Granada se llega a la Alpujarra por la
    autovía N-323 hasta el cruce de Lanjarón y la carretera C-332, que cruza toda la vertiente sur.
texto:
  es:
    intro: >-
      Durante siglos, hubo un camino por el que la nieve bajaba a Granada. Se llama el camino de los neveros,
      y lleva ese nombre porque, hasta no hace demasiado, fue el recorrido habitual para traer la nieve a la
      capital. La sierra que la guardaba tiene otros nombres antiguos: los autores islámicos la llamaron Yabal
      Sulayr, monte del Sol o del Aire, y Yabal-al-Tay, monte de la Nieve. Hoy es el Parque Nacional y Natural
      de Sierra Nevada, un macizo compartido por Granada y Almería donde se alza el Mulhacén, de 3479 m, el
      pico más alto de la península ibérica.
    landscape: >-
      Sierra Nevada nació, como el resto de las sierras Béticas, en la orogenia alpina de la era Terciaria. Su
      núcleo central, el de las cumbres más altas, es de esquistos y pizarras, y se conoce como La Lastra.
      Después llegó el hielo: los antiguos glaciares dejaron circos, morrenas, lagunas y valles en artesa. En
      la vertiente sur, casi cincuenta lagunas de alta montaña son todavía hoy la huella de aquellos hielos.


      El clima es de contrastes. En verano casi no llueve, y en invierno las precipitaciones son casi siempre
      de nieve a partir de unos 2000 m. A partir de los 3000 m la temperatura media anual es inferior a 0 °C.
      De ahí la vegetación en pisos. Entre 1300 y 1900 m dominan los encinares; entre 1900 y 2700 m, los
      pinares y sabinares de pino silvestre y sabina rastrera. Más arriba, desde los 2600 u 2800 m, la nieve
      manda y no crecen leñosas: dominan los borreguiles, pastizales de alta montaña parecidos a la tundra
      ártica.


      Y entonces llega la sorpresa botánica. Tras la última glaciación, la sierra se convirtió en refugio de
      una gran cantidad de endemismos y de especies nórdicas impropias de latitudes medias. Hay 2.100 especies
      de plantas catalogadas, 116 de ellas amenazadas. Entre los endemismos están la manzanilla real, el
      narciso de Sierra Nevada y la estrella de las nieves, uno de los grandes símbolos del macizo.
    wildlife: >-
      La reina indiscutible de la fauna es la [cabra montés](/especie/capra_pyrenaica/), que suele pastar en
      los pastizales de alta montaña. En las cotas más altas viven pocas especies; las principales son el
      topillo nival y el acentor alpino. En los roquedos anidan escasas parejas de [águila
      perdicera](/especie/aquila_fasciata/), [águila real](/especie/aquila_chrysaetos/) y [búho
      real](/especie/bubo_bubo/). En los bosques hay [jabalí](/especie/sus_scrofa/), [gato
      montés](/especie/felis_silvestris/), zorro, comadreja, garduña y [jineta](/especie/genetta_genetta/).
      Hay 80 especies animales endémicas, y entre los invertebrados, más de 20 especies de mariposas.


      El año marca el ritmo de la sierra. En verano, de mayo a octubre, casi no llueve; en invierno la nieve
      cubre las cotas altas. En primavera y verano son frecuentes las tormentas eléctricas en montaña.
    visit: >-
      Empieza por un centro de visitantes. Los hay en El Dornajo y en Laujar de Andarax, y puntos de
      información en Pampaneira y en el Puerto de La Ragua. En la Hoya de la Mora, a unos 2500 m, el Jardín
      Botánico Universitario de Sierra Nevada, abierto desde 1965, se especializa en los endemismos de la
      sierra.


      Entre junio y octubre, si la nieve lo permite, un servicio de microbuses con guías sube a las altas
      cumbres: del albergue universitario, a 2500 m, a las Posiciones del Veleta, a 3100 m. En la vertiente
      sur, el mismo servicio sube de Capileira al Alto del Chorrillo, a 2740 m, en las estribaciones del
      Mulhacén.


      A pie, la red de senderos recoge la variedad de paisajes del macizo. El de Dornajo-Campos de Otero sale
      del centro de visitantes y se aparta de la zona masificada de la estación de esquí. El camino de la Hoya
      del Portillo al Refugio del Poqueira es la subida más asequible al refugio y entra en la cabecera del
      Barranco del Poqueira, bajo el Mulhacén y el Veleta, junto a lagunas glaciares como La Caldera y Río
      Seco. El Aguadero cruza pinares, encinares, castañares, alisedas y bosques de ribera. En Cerro Huenes
      los encuentros con fauna silvestre son frecuentes. Y en Monterrey recorres el bosque de ribera del
      Andarax, uno de los bosques de galería mejor conservados de la sierra, con álamos, alisos, fresnos y
      olmos.


      El Puerto de la Ragua, entre las dos vertientes, enseña el contraste de la sierra: al norte, una
      planicie ocre; al sur, cultivos abancalados que miran al Mediterráneo. El sendero de Río Bermejo
      atraviesa castañares naturalizados desde el siglo XVI.
    history: >-
      De la época musulmana quedan las acequias y regatos que recogen el agua del deshielo y la escorrentía en
      las laderas. En el Barranco del Poqueira, Pampaneira, Bubión y Capileira conservan la arquitectura
      tradicional alpujarreña y forman un Conjunto Histórico.


      La sierra se declaró parque natural en 1989 por las singularidades de su flora, fauna, geomorfología y
      paisaje. Como parque nacional, Sierra Nevada incorporó a la Red los ecosistemas de alta montaña
      mediterránea, hasta entonces sin representar.


      Conservar su flora no es sencillo: sobrepastoreo, coleccionismo, estación de esquí, infraestructuras
      viarias, deforestación, especies foráneas y turismo figuran entre las causas de vulnerabilidad. Se ha
      puesto en marcha la recuperación de la red tradicional de acequias para conservar el paisaje
      agroforestal de media montaña.
    before: >-
      Dentro del parque no se puede hacer fuego, acampar sin autorización, llevar perros sueltos, recolectar
      animales, plantas o rocas ni circular campo a través con vehículos o bicicletas. Para ascensiones por la
      alta montaña sin experiencia se aconseja contratar un guía. Desde Granada se llega a la Alpujarra por la
      autovía N-323 hasta el cruce de Lanjarón y la carretera C-332, que cruza toda la vertiente sur.
    around: >-
      El [Paraje Natural Desierto de Tabernas](/lugar/paraje-natural-desierto-de-tabernas/) está a unos cinco
      kilómetros. Más lejos, el [Parque Regional de la Sierra de
      Gredos](/lugar/parque-regional-de-la-sierra-de-gredos/) comparte cabra montés, águila real, alta montaña
      y glaciarismo, y el [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) reúne también cabra
      montés y águila real entre alta montaña y karst.
  en:
    intro: >-
      For centuries, an ancient pack trail brought mountain snow down to Granada. Known as the Camino de los
      Neveros, it earned its name because until relatively recent times it was the customary route for hauling
      ice blocks down to the provincial capital. Islamic scholars called this range Yabal Sulayr (Mountain of
      the Sun or Air) and Yabal-al-Tay (Mountain of Snow). Today it is the Sierra Nevada National and Natural
      Park, a sprawling massif shared between Granada and Almería crowned by Mulhacén at 3479 m, the highest
      summit on the Iberian Peninsula.
    landscape: >-
      Sierra Nevada formed, alongside the rest of the Betic ranges, during the Tertiary Alpine orogeny. Its
      central core, where the loftiest peaks rise, consists of dark schists and slates locally termed La
      Lastra. Then came the ice: Quaternary glaciers carved cirques, moraines, tarns, and U-shaped troughs. On
      the southern watershed, nearly fifty glacial tarns survive as living relics of those ancient icefields.


      The climate exhibits extreme seasonal contrasts. In summer precipitation is negligible, while in winter
      precipitation falls almost entirely as snow above 2000 m. Above 3000 m the annual mean temperature stays
      below 0 °C. Consequently, vegetation stratifies into distinct elevation bands. Between 1300 and 1900 m
      holm oak woodlands prevail; between 1900 and 2700 m stretch Scots pine stands and creeping savin juniper
      scrub. Higher up, from 2600 to 2800 m, intense cold prevents woody growth: borreguiles dominate, wet
      high-mountain bogs analogous to Arctic tundra.


      Then comes the botanical marvel. Following the retreat of the last glaciers, the massif became an
      isolated sanctuary for high-latitude northern flora and specialized local endemics. There are 2,100
      catalogued plant species, 116 of which are threatened. Famous endemics include royal chamomile, Sierra
      Nevada daffodil, and the iconic snow star (estrella de las nieves), the quintessential emblem of the
      range.
    wildlife: >-
      The undisputed monarch of the local fauna is the [Spanish ibex](/especie/capra_pyrenaica/), frequently
      grazing across high alpine pastures. Only a few hardy species endure on the uppermost crests,
      principally the snow vole and alpine accentor. Scattered crags host nesting pairs of [Bonelli's
      eagle](/especie/aquila_fasciata/), [golden eagle](/especie/aquila_chrysaetos/), and [Eurasian
      eagle-owl](/especie/bubo_bubo/). Forests shelter [wild boars](/especie/sus_scrofa/), [European
      wildcats](/especie/felis_silvestris/), red foxes, least weasels, stone martens, and the [common
      genet](/especie/genetta_genetta/). There are 80 endemic animal species, including over 20 endemic
      butterfly species among the invertebrates.


      The annual cycle governs mountain life. Summer, spanning May to October, brings dry skies; winter
      blankets the peaks under thick snow. Violent convective thunderstorms occur regularly during spring and
      summer afternoons.
    visit: >-
      Begin your exploration at a visitor centre. Main centres operate at El Dornajo and Laujar de Andarax,
      supplemented by information kiosks in Pampaneira and the Puerto de La Ragua pass. In Hoya de la Mora at
      roughly 2500 m, the Sierra Nevada University Botanical Garden, open since 1965, focuses on endemic
      mountain flora.


      From June to October, conditions permitting, an official guided shuttle bus ascends to the highest
      ridges: from the university hostel at 2500 m up to Posiciones del Veleta at 3100 m. On the southern
      slopes, a companion service runs from Capileira up to Alto del Chorrillo at 2740 m on the lower flanks
      of Mulhacén.


      On foot, a rich trail network traverses contrasting landscapes. The Dornajo-Campos de Otero trail leaves
      the visitor centre and bypasses the crowded ski station. The route from Hoya del Portillo to Refugio del
      Poqueira is the most gradual approach to the refuge, penetrating the headwaters of Barranco del Poqueira
      beneath Mulhacén and Veleta near glacial tarns like La Caldera and Río Seco. El Aguadero wanders through
      pine groves, oak woods, sweet chestnut forests, and alder corridors. Cerro Huenes offers frequent
      wildlife sightings, while at Monterrey you follow the lush gallery forest of the Andarax, lined with
      poplars, alders, ashes, and elms.


      The Puerto de la Ragua pass highlights regional contrasts: an arid northern plateau on one side, and
      terraced Mediterranean orchards on the other. The Río Bermejo trail wanders among sweet chestnut woods
      naturalized since the sixteenth century.
    history: >-
      Islamic heritage endures in the sophisticated network of mountain water-channels (acequias) that harvest
      snowmelt and surface runoff along steep slopes. In the Barranco del Poqueira, the whitewashed villages
      of Pampaneira, Bubión, and Capileira preserve flat-roofed Berber architecture, designated a Historic
      Site.


      The mountain was proclaimed a natural park in 1989 in recognition of its extraordinary flora, fauna, and
      geomorphology. As a national park, Sierra Nevada incorporated previously unrepresented Mediterranean
      high-mountain ecosystems into Spain's National Parks Network.


      Conserving this botanical treasure poses intricate challenges: overgrazing, illegal plant collecting,
      ski development, road infrastructure, deforestation, non-native species, and heavy tourism create acute
      vulnerability. Current stewardship focuses on revitalizing historic acequias to preserve the
      agroforestry cultural landscape.
    before: >-
      Inside the park, lighting fires, unauthorized camping, letting dogs off leash, taking rocks, plants, or
      animals, and cross-country cycling or driving are strictly prohibited. Inexperienced hikers attempting
      high peaks should hire an accredited mountain guide. From Granada, the Alpujarra is reached via the
      N-323 dual carriageway to the Lanjarón turnoff and then along the C-332 road traversing the entire
      southern slope.
    around: >-
      [Paraje Natural Desierto de Tabernas](/lugar/paraje-natural-desierto-de-tabernas/) lies roughly five
      kilometres away. Further afield, [Parque Regional de la Sierra de
      Gredos](/lugar/parque-regional-de-la-sierra-de-gredos/) shares the Spanish ibex, golden eagle, alpine
      terrain, and glacial landforms, while [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) also
      combines the ibex and golden eagle across rugged karst massifs.
  fr:
    intro: >-
      Pendant des siècles, un sentier permettait de descendre la neige jusqu'à Grenade. On l'appelle le chemin
      des glaciers (camino de los neveros), car il servit longtemps à approvisionner la capitale en glace. Les
      auteurs arabo-andalous désignaient ce massif sous le nom de Yabal Sulayr (mont du Soleil ou de l'Air) et
      Yabal-al-Tay (mont de la Neige). Aujourd'hui, le parc national et naturel de Sierra Nevada rassemble ce
      relief partagé entre Grenade et Almería, où culmine le Mulhacén à 3479 m, point le plus haut de la
      péninsule Ibérique.
    landscape: >-
      La Sierra Nevada est née, comme l'ensemble des cordillères Bétiques, lors de l'orogenèse alpine à l'ère
      tertiaire. Son arête centrale de hauts sommets se compose de schistes sombres connus sous le nom de La
      Lastra. Puis vint la glace : les glaciers quaternaires façonnèrent cirques, moraines, chapelets de lacs
      et auges glaciaires. Sur le versant sud, près de cinquante lacs d'altitude perpétuent le souvenir de ces
      glaces disparues.


      Le climat se caractérise par des contrastes vigoureux. En été, les pluies sont quasi absentes, tandis
      qu'en hiver les précipitations tombent sous forme de neige dès 2000 m d'altitude. Au-dessus de 3000 m,
      la température moyenne annuelle descend sous 0 °C. La végétation s'organise donc en étages réguliers.
      Entre 1300 et 1900 m dominent les chênaies vertes ; entre 1900 et 2700 m s'étendent pinèdes de pin
      sylvestre et genévriers nains. Plus haut, dès 2600 ou 2800 m, le froid exclut toute végétation ligneuse
      : règnent alors les borreguiles, pelouses humides de haute montagne comparables à la toundra arctique.


      C'est là que surgit l'exception botanique. Après le retrait des glaces, la sierra devint un refuge
      majeur pour une multitude d'espèces boréales et d'endémismes stricts. On dénombre 2 100 espèces de
      plantes recensées, dont 116 menacées. Parmi les endémismes phares figurent la camomille royale, le
      narcisse de Sierra Nevada et l'étoile des neiges, emblème floral du massif.
    wildlife: >-
      La souveraine incontestée de la faune est le [bouquetin d'Espagne](/especie/capra_pyrenaica/), qui
      pâture régulièrement sur les pelouses sommitales. Seules de rares espèces colonisent les plus hautes
      crêtes, en particulier le campagnol des neiges et l'accenteur alpin. Les parois rocheuses abritent
      quelques couples d'[aigle de Bonelli](/especie/aquila_fasciata/), d'[aigle
      royal](/especie/aquila_chrysaetos/) et de [hibou grand-duc](/especie/bubo_bubo/). Dans les forêts vivent
      [sangliers](/especie/sus_scrofa/), [chats sauvages](/especie/felis_silvestris/), renards, belettes,
      fouines et [genettes communes](/especie/genetta_genetta/). On compte 80 espèces animales endémiques,
      dont plus de 20 espèces de papillons chez les invertébrés.


      Le rythme annuel scande la montagne. En été, de mai à octobre, le temps reste sec ; en hiver la neige
      recouvre les crêtes. Au printemps et en été, de violents orages éclatent fréquemment en montagne.
    visit: >-
      Débutez par un centre d'accueil. Des structures existent à El Dornajo et Laujar de Andarax, avec des
      relais à Pampaneira et au col de La Ragua. À la Hoya de la Mora, vers 2500 m, le jardin botanique
      universitaire de Sierra Nevada, créé en 1965, se consacre aux endémismes d'altitude.


      Entre juin et octobre, si l'enneigement le permet, des navettes avec guides montent vers les crêtes : du
      refuge universitaire à 2500 m jusqu'aux Posiciones del Veleta à 3100 m. Sur le versant sud, un service
      analogue relie Capileira à l'Alto del Chorrillo à 2740 m, sur les contreforts du Mulhacén.


      À pied, le réseau de sentiers illustre la variété des paysages. L'itinéraire Dornajo-Campos de Otero
      part du centre d'accueil et s'écarte de la station de ski. Le tracé de la Hoya del Portillo au refuge de
      Poqueira constitue la voie la plus douce vers le refuge, pénétrant le haut vallon du Poqueira sous le
      Mulhacén et le Veleta, près des lacs glaciaires de La Caldera et Río Seco. Le sentier de l'Aguadero
      traverse pinèdes, chênaies, châtaigneraies et ripisylves. Au Cerro Huenes, les observations de faune
      sont régulières, tandis qu'à Monterrey serpente la forêt riveraine de l'Andarax, peuplée de peupliers,
      aulnes, frênes et ormes.


      Le col de La Ragua marque une saisissante ligne de partage : au nord, un haut plateau aride ; au sud,
      des terrasses tournées vers la Méditerranée. Le sentier du Río Bermejo chemine à travers de vieux
      châtaigniers naturalisés depuis le XVIe siècle.
    history: >-
      De la période musulmane subsiste le réseau d'irrigation traditionnel des acequias, qui captent les eaux
      de fonte sur les versants escarpés. Dans le ravin du Poqueira, les villages blancs de Pampaneira, Bubión
      et Capileira conservent une architecture d'origine berbère remarquable, classée ensemble historique.


      Le massif a été déclaré parc naturel en 1989 pour ses richesses floristiques, faunistiques et
      paysagères. En devenant parc national, la Sierra Nevada a apporté au réseau espagnol les écosystèmes
      méditerranéens de haute montagne jusqu'alors absents.


      La préservation de sa flore requiert une attention soutenue face au surpâturage, aux cueillettes
      illégales, aux aménagements de ski et au tourisme. La réhabilitation des acequias historiques permet de
      maintenir l'équilibre agroforestier traditionnel.
    before: >-
      Dans le parc, il est interdit d'allumer du feu, de camper sans autorisation, de laisser les chiens
      divaguer, de cueillir des plantes ou d'emporter des roches. Pour gravir les hauts sommets sans
      expérience alpine, l'encadrement par un guide est recommandé. Depuis Grenade, l'Alpujarra est accessible
      par la voie rapide N-323 jusqu'à Lanjarón puis la route C-332 longeant tout le versant sud.
    around: >-
      Le [Paraje Natural Desierto de Tabernas](/lugar/paraje-natural-desierto-de-tabernas/) se situe à environ
      cinq kilomètres. Plus au nord, le [Parque Regional de la Sierra de
      Gredos](/lugar/parque-regional-de-la-sierra-de-gredos/) partage le bouquetin d'Espagne, l'aigle royal et
      le modelé glaciaire alpin, tandis que le [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/)
      réunit également bouquetin et aigle royal au cœur de massifs karstiques.
  de:
    intro: >-
      Über Jahrhunderte existierte ein beschwerlicher Saumpfad, auf dem Schnee nach Granada transportiert
      wurde. Er heißt camino de los neveros, weil er bis vor nicht allzu langer Zeit die Hauptroute für den
      Eistransport in die Provinzhauptstadt war. Maurische Gelehrte nannten das Gebirge Yabal Sulayr (Berg der
      Sonne oder des Windes) und Yabal-al-Tay (Schneeberg). Heute bildet es den National- und Naturpark Sierra
      Nevada, ein gewaltiges Bergmassiv zwischen Granada und Almería, gekrönt vom Mulhacén mit 3479 m, dem
      höchsten Punkt des iberischen Festlands.
    landscape: >-
      Die Sierra Nevada entstand wie die übrigen Betischen Kordilleren während der alpidischen Orogenese im
      Tertiär. Ihr zentraler Kern aus den höchsten Gipfeln besteht aus Schiefern und Glimmerschiefern, genannt
      La Lastra. Später formte das Eis die Landschaft: Pleistozäne Gletscher hinterließen Kare, Moränenwälle,
      Bergseen und Trogtäler. An den Südhängen zeugen fast fünfzig Karseen bis heute von dieser eiszeitlichen
      Vergangenheit.


      Das Hochgebirgsklima ist extrem kontrastreich. Im Sommer herrscht ausgeprägte Dürre, während im Winter
      ab etwa 2000 m Höhe fast sämtliche Niederschläge als Schnee fallen. Oberhalb von 3000 m liegt die
      Jahresdurchschnittstemperatur unter 0 °C. Entsprechend staffelt sich die Flora in Vegetationsstufen.
      Zwischen 1300 und 1900 m dominieren Steineichenwälder; zwischen 1900 und 2700 m schließen sich Bestände
      aus Waldkiefern und Zwerg-Wacholder an. Darüber, ab 2600 bis 2800 m, verhindern Kälte und Wind
      Holzgewächse: Es herrschen Borreguiles vor, arktisähnliche alpine Feuchtwiesen.


      Hier offenbart sich die botanische Einzigartigkeit. Nach dem Rückzug des Eises diente das Massiv als
      Zufluchtsort für nordische Relikte und isolierte Endemiten. Man zählt 2.100 erfasste Pflanzenarten, von
      denen 116 als gefährdet gelten. Zu den Symbolarten gehören die Echte Kamille der Sierra Nevada, die
      Sierra-Nevada-Narzisse und der Schneestern (estrella de las nieves).
    wildlife: >-
      Der unbestrittene Herrscher der Tierwelt ist der [Iberiensteinbock](/especie/capra_pyrenaica/), der auf
      den Hochweiden grast. In den höchsten Lagen überleben nur wenige Spezialisten wie Schneemaus und
      Alpenbraunelle. An Steilwänden nisten einzelne Paare von [Habichtsadler](/especie/aquila_fasciata/),
      [Steinadler](/especie/aquila_chrysaetos/) und [Uhu](/especie/bubo_bubo/). Die Wälder beherbergen
      [Wildschwein](/especie/sus_scrofa/), [Wildkatze](/especie/felis_silvestris/), Rotfuchs, Mauswiesel,
      Steinmarder und [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/). Rund 80 Tierarten sind hier
      endemisch, darunter über 20 Schmetterlingsarten unter den Wirbellosen.


      Das Jahr bestimmt den Rhythmus. Von Mai bis Oktober bleibt es weitgehend trocken; im Winter herrscht
      Tiefschnee auf den Höhen. Im Frühling und Sommer treten im Gebirge häufig Wärmegewitter auf.
    visit: >-
      Beginne deinen Ausflug in einem Informationszentrum. Zentren bestehen in El Dornajo und Laujar de
      Andarax, ergänzt durch Infopunkte in Pampaneira und am Puerto de La Ragua. In der Hoya de la Mora auf
      rund 2500 m widmet sich der 1965 gegründete Botanische Universitätsgarten den Gebirgsendemiten.


      Von Juni bis Oktober verkehrt bei schneefreier Piste ein geführter Kleinbusdienst in die Hochlagen: von
      der Universitätsherberge auf 2500 m zu den Posiciones del Veleta auf 3100 m. An der Südflanke führt ein
      paralleler Zubringer von Capileira zum Alto del Chorrillo auf 2740 m am Fuß des Mulhacén.


      Zu Fuß erschließt ein dichtes Wegenetz die Hochgebirgswelt. Die Route Dornajo-Campos de Otero startet am
      Besucherzentrum abseits des Skigebiets. Der Weg von der Hoya del Portillo zur Poqueira-Hütte bildet den
      bequemsten Hüttenaufstieg im oberen Poqueira-Tal unterhalb von Mulhacén und Veleta nahe Karseen wie La
      Caldera und Río Seco. Der Pfad El Aguadero durchquert Kiefern-, Eichen- und Kastanieneinsprengsel. Am
      Cerro Huenes gelingen oft Wildbeobachtungen, während der Uferweg in Monterrey alte Galerieauen am Río
      Andarax mit Pappeln, Erlen und Eschen zeigt.


      Der Ragua-Pass verdeutlicht den Gegensatz des Gebirges: im Norden eine trockene Hochebene, im Süden
      mediterrane Terrassendörfer. Der Weg am Río Bermejo führt durch Kastanienwälder, die seit dem
      sechzehnten Jahrhundert gepflegt werden.
    history: >-
      Aus maurischer Zeit stammt das verzweigte Kanalsystem der Acequias, die das Schmelzwasser an den Hängen
      auffangen und leiten. Im Poqueira-Tal bewahren Pampaneira, Bubión und Capileira traditionelle
      Berber-Architektur als denkmalgeschütztes Ensemble.


      Die Sierra wurde 1989 wegen ihrer herausragenden Geomorphologie und Flora zum Naturpark erklärt. Mit der
      späteren Nationalparkausweisung schloss sie eine Lücke für mediterrane Hochgebirgsökosysteme im
      spanischen Parknetz.


      Der Artenschutz verlangt ständige Wachsamkeit gegenüber Überweidung, illegalem Pflanzensammeln,
      Skitourismus und Straßenbau. Die Restaurierung historischer Bewässerungsgräben dient der Bewahrung der
      traditionellen Kulturlandschaft.
    before: >-
      Im Park sind offenes Feuer, wildes Campieren, freilaufende Hunde und das Sammeln von Pflanzen oder
      Mineralien verboten. Für anspruchsvolle Hochtouren ohne alpine Erfahrung wird ein Bergführer empfohlen.
      Von Granada aus erreicht man die Alpujarra über die Autobahn N-323 bis Lanjarón und die Straße C-332
      entlang der Südflanke.
    around: >-
      Die Halbwüste [Paraje Natural Desierto de Tabernas](/lugar/paraje-natural-desierto-de-tabernas/) liegt
      rund fünf Kilometer entfernt. Weiter entfernt teilt der [Parque Regional de la Sierra de
      Gredos](/lugar/parque-regional-de-la-sierra-de-gredos/) Steinbock, Steinadler und glaziale
      Hochgebirgsformen, während der [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) Steinbock und
      Steinadler in schroffem Karst vereint.
  it:
    intro: >-
      Per secoli vi fu una via mulattiera lungo la quale la neve scendeva fino a Granada. È nota come il
      camino de los neveros, battezzata così perché fino a tempi non lontani costituì il tragitto abituale per
      recare il ghiaccio in città. Gli storici islamici la chiamarono Yabal Sulayr (monte del Sole o
      dell'Aria) e Yabal-al-Tay (monte della Neve). Oggi forma il Parco Nazionale e Naturale della Sierra
      Nevada, un colossale rilievo condiviso tra Granada e Almería culminante nei 3479 m del Mulhacén, la
      vetta più alta della penisola iberica.
    landscape: >-
      La Sierra Nevada nacque, al pari delle cordigliere Betiche, durante l'orogenesi alpina dell'era
      Terziaria. Il suo cuore sommitale è formato da scisti e ardesie scure, noto come La Lastra. Più tardi
      giunse il gelo: i ghiacciai quaternari modellarono circhi, cordoni morenici, laghetti e valli a trogolo.
      Sul versante meridionale, quasi cinquanta lagune d'alta quota testimoniano tuttora l'impronta dei
      ghiacci ancestrali.


      Il clima alpino evidenzia contrasti netti. In estate le precipitazioni sono pressoché nulle, mentre in
      inverno cadono quasi esclusivamente sotto forma di neve al di sopra dei 2000 m. Oltre i 3000 m la
      temperatura media annua è inferiore a 0 °C. Ne consegue una marcata zonazione vegetazionale. Tra i 1300
      e i 1900 m prevalgono le leccete; tra i 1900 e i 2700 m si estendono pinete di pino silvestre e
      boscaglie di ginepro nano. Più in alto, tra i 2600 e i 2800 m, il gelo inibisce le essenze legnose:
      dominano i borreguiles, pascoli umidi d'alta quota affini alla tundra artica.


      Qui risiede la sorpresa botanica. Con il ritiro dei ghiacci, la sierra divenne rifugio per
      un'eccezionale quantità di specie boreali e relitti isolati. Si contano 2.100 specie vegetali censite,
      di cui 116 a rischio di estinzione. Tra gli endemismi spiccano la camomilla di Sierra Nevada, il narciso
      locale e la celebre stella delle nevi, emblema vegetale del massiccio.
    wildlife: >-
      La regina indiscussa della fauna alpina è lo [stambecco iberico](/especie/capra_pyrenaica/), solito
      pascolare sulle praterie sommitali. Alle quote supreme resistono solo pochi specialisti, tra cui
      l'arvicola delle nevi e il sordone. Sugli speroni rocciosi nidificano isolate coppie di [aquila di
      Bonelli](/especie/aquila_fasciata/), [aquila reale](/especie/aquila_chrysaetos/) e [gufo
      reale](/especie/bubo_bubo/). Nelle boscaglie vivono [cinghiali](/especie/sus_scrofa/), [gatti
      selvatici](/especie/felis_silvestris/), volpi, donnole, faine e [genette](/especie/genetta_genetta/). Si
      contano 80 specie animali endemiche, con oltre 20 specie di farfalle tra gli invertebrati.


      L'anno cadenza la vita montana. Da maggio a ottobre il clima è asciutto; in inverno la neve copre i
      valichi. Nella tarda primavera e in estate non sono rari temporali pomeridiani in quota.
    visit: >-
      Inizia il percorso da un centro visitatori. Strutture dedicate sono presenti a El Dornajo e Laujar de
      Andarax, con punti informativi a Pampaneira e al passo de La Ragua. Nella conca della Hoya de la Mora a
      circa 2500 m, l'Orto Botanico Universitario, attivo dal 1965, documenta la flora relitta del parco.


      Tra giugno e ottobre, neve permettendo, una linea di navette con guide sale verso le vette: dall'ostello
      universitario a 2500 m fino alle Posiciones del Veleta a 3100 m. Sul versante meridionale, un servizio
      analogo collega Capileira all'Alto del Chorrillo a 2740 m, alle falde del Mulhacén.


      A piedi, la rete dei sentieri svela i diversi paesaggi. Il tracciato Dornajo-Campos de Otero parte dal
      centro visitatori lontano dagli impianti sciistici. La salita da Hoya del Portillo al rifugio Poqueira è
      la via più agevole verso il rifugio, entrando nell'alto vallone del Poqueira sotto il Mulhacén e il
      Veleta, vicino ai laghi di La Caldera e Río Seco. Il sentiero di El Aguadero attraversa pinete, querceti
      e castagneti secolari. A Cerro Huenes gli avvistamenti faunistici sono frequenti, mentre a Monterrey si
      segue il bosco ripariale del fiume Andarax con pioppi, ontani e frassini.


      Il passo de La Ragua mostra il contrasto geografico della sierra: a nord un altopiano asciutto, a sud
      coltivi a terrazze affacciati sul mare. Il sentiero del Río Bermejo attraversa castagneti coltivati fin
      dal XVI secolo.
    history: >-
      Dall'epoca islamica derivano le acequias, canali tradizionali in pietra che intercettano le acque di
      disgelo lungo i versanti. Nel vallone del Poqueira, i borghi di Pampaneira, Bubión e Capileira
      preservano l'architettura alpujarreña d'impronta berbera, tutelata come complesso storico.


      La sierra fu istituita parco naturale nel 1989 per il valore di flora, fauna e geomorfologia. Come parco
      nazionale, la Sierra Nevada integrò nella rete spagnola gli ecosistemi mediterranei di alta montagna.


      La salvaguardia botanica richiede sforzi costanti contro sovrapascolo, raccolta illegale e pressione
      turistica. Il restauro della rete storica dei canali di irrigazione mira a tutelare il paesaggio
      agro-silvo-pastorale montano.
    before: >-
      Nel parco è severamente vietato accendere fuochi, campeggiare senza autorizzazione, lasciare cani
      slegati o asportare specie e campioni geologici. Per escursioni alpinistiche senza esperienza è
      raccomandata una guida alpina. Da Granada si raggiunge l'Alpujarra tramite la superstrada N-323 fino a
      Lanjarón e la strada C-332 lungo l'intero versante sud.
    around: >-
      Il [Paraje Natural Desierto de Tabernas](/lugar/paraje-natural-desierto-de-tabernas/) dista circa cinque
      chilometri. Più distante, il [Parque Regional de la Sierra de
      Gredos](/lugar/parque-regional-de-la-sierra-de-gredos/) condivide stambecco iberico, aquila reale e
      morfologie glaciali, mentre il [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) accoglie
      anch'esso stambecco e aquila reale in paesaggi carsici d'alta quota.
  pt:
    intro: >-
      Durante séculos existiu um caminho ancestral pelo qual a neve descia em cargueiros até Granada.
      Chamam-lhe o caminho dos nevairos (camino de los neveros), batizado assim por ter sido a rota habitual
      para abastecer de gelo a capital provincial. Autores islâmicos chamavam a esta serra Yabal Sulayr (monte
      do Sol ou do Vento) e Yabal-al-Tay (monte da Neve). Hoje constitui o Parque Nacional e Natural da Serra
      Nevada, um maciço imponente repartido entre Granada e Almería encimado pelo Mulhacén a 3479 m, o ponto
      mais alto da Península Ibérica.
    landscape: >-
      A Serra Nevada formou-se, à semelhança das cordilheiras Béticas, na orogenia alpina da era Terciária. O
      seu núcleo central, onde avultam os cumes mais escarpados, é composto por xistos e lousas escuras
      conhecidos como La Lastra. Mais tarde chegou o gelo: os glaciares quaternários talharam circos, moreias,
      lagoas alpinas e vales em calha. Na vertente meridional, quase cinquenta lagoas de alta montanha
      conservam a pegada viva desses campos glaciares.


      O clima alpino pauta-se por fortes contrastes. No verão a estiagem é quase total, enquanto no inverno a
      precipitação cai quase invariavelmente em forma de neve acima dos 2000 m. A partir dos 3000 m a
      temperatura média anual situa-se abaixo dos 0 °C. A vegetação distribui-se em andares altitudinais.
      Entre os 1300 e os 1900 m predominam os azinhais; entre os 1900 e os 2700 m estendem-se pinhais de
      pinheiro-silvestre e zimbrais-rasteiros. Mais acima, dos 2600 aos 2800 m, a intempérie impede plantas
      lenhosas: dominam os borreguiles, pastagens húmidas de altitude análogas à tundra ártica.


      Eis a singularidade botânica. Após o recuo glaciar, a serra converteu-se em refúgio para espécies
      nórdicas e raros endemismos meridionais. Catalogam-se 2.100 espécies de plantas vasculares, estando 116
      sob ameaça. Entre os endemismos sobressaem a camomila-real, o narciso da Serra Nevada e a
      estrela-das-neves, autêntico emblema do maciço.
    wildlife: >-
      O soberano da fauna de montanha é a [cabra-montês](/especie/capra_pyrenaica/), avistada amiúde nas
      pastagens alpinas. Nos cumes mais elevados sobrevivem poucas espécies, destacando-se a
      toupeira-das-neves e a ferreirinha-alpina. Nas escarpas nidificam casais raros de
      [águia-de-bonelli](/especie/aquila_fasciata/), [águia-real](/especie/aquila_chrysaetos/) e
      [bufo-real](/especie/bubo_bubo/). Nos bosques ocorrem o [javali](/especie/sus_scrofa/), o
      [gato-bravo](/especie/felis_silvestris/), a raposa, a doninha, a fuinha e a
      [gineta](/especie/genetta_genetta/). Contam-se 80 espécies animais endémicas, incluindo mais de 20
      espécies de borboletas entre os invertebrados.


      As estações ditam o ritmo natural. De maio a outubro o tempo é seco; no inverno a neve cobre os
      planaltos. Na primavera e verão formam-se trovoadas repentinas de montanha.
    visit: >-
      Inicia a visita num centro de acolhimento. Existem estruturas em El Dornajo e Laujar de Andarax, bem
      como postos de informação em Pampaneira e no porto de montanha de La Ragua. Na Hoya de la Mora, a cerca
      de 2500 m, o Jardim Botânico Universitário da Serra Nevada, aberto desde 1965, estuda a flora endémica
      da serra.


      Entre junho e outubro, se a neve o permitir, funciona um serviço de miniautocarros guiados até aos
      cumes: do albergue universitário a 2500 m até às Posiciones del Veleta a 3100 m. No lado sul, um serviço
      homólogo liga Capileira ao Alto del Chorrillo a 2740 m, nas faldas do Mulhacén.


      A pé, a rede de trilhos abrange os contrastes da serra. O itinerário Dornajo-Campos de Otero parte do
      centro de visitantes e afasta-se da estância de esqui. A rota da Hoya del Portillo ao refúgio de
      Poqueira é a ascensão mais suave ao refúgio, subindo a cabeceira do vale do Poqueira sob o Mulhacén e o
      Veleta, junto a lagoas como La Caldera e Río Seco. O percurso de El Aguadero cruza pinhais, azinhais e
      soutos de castanheiros. No Cerro Huenes avista-se fauna com facilidade, enquanto em Monterrey se
      percorre a mata ripícola do rio Andarax com choupos, amieiros e freixos.


      O porto de La Ragua revela o contraste geográfico: a norte um planalto seco; a sul socalcos agrícolas
      virados para o mar. O trilho do Río Bermejo percorre soutos de castanheiros explorados desde o século
      XVI.
    history: >-
      Do período islâmico perduram as acequias tradicionais, canais de pedra que desviam a água do degelo
      pelas encostas. No vale do Poqueira, Pampaneira, Bubión e Capileira preservam a arquitetura típica
      alpujarreña de origem berbere, classificada como conjunto histórico.


      A serra foi declarada parque natural em 1989 em virtude do seu património botânico, faunístico e
      geomorfológico. Como parque nacional, a Serra Nevada integrou na rede espanhola ecossistemas
      mediterrânicos de alta montanha.


      A salvaguarda da flora enfrenta pressões como o sobrepastoreio, a colheita ilegal, as estâncias de esqui
      e o turismo intensivo. A recuperação das acequias tradicionais visa proteger a paisagem agroflorestal
      histórica.
    before: >-
      No parque é expressamente proibido fazer fogo, acampar sem licença, soltar animais domésticos ou colher
      espécimes biológicos e geológicos. Para subidas a alta montanha sem experiência recomenda-se contratar
      um guia habilitado. A partir de Granada chega-se à Alpujarra pela via rápida N-323 até ao desvio de
      Lanjarón e pela estrada C-332 ao longo da vertente sul.
    around: >-
      O [Paraje Natural Desierto de Tabernas](/lugar/paraje-natural-desierto-de-tabernas/) localiza-se a cerca
      de cinco quilómetros. Mais distante, o [Parque Regional de la Sierra de
      Gredos](/lugar/parque-regional-de-la-sierra-de-gredos/) partilha a cabra-montês, a águia-real e o
      modelado glaciar alpino, enquanto o [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/) reúne
      também a cabra-montês e a águia-real em maciços cársticos.
