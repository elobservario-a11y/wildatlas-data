resumen:
  es: >-
    Las milenarias estanques salineros y estrecho marino de Es Freus, salvaguardando las praderas submarinas
    de *Posidonia oceanica* Patrimonio Mundial UNESCO.
  en: >-
    Millenary saltpans and the marine strait of Es Freus, safeguarding UNESCO World Heritage submarine meadows
    of *Posidonia oceanica*.
  fr: >-
    Les salins millénaires et le détroit marin d'Es Freus, protégeant les herbiers sous-marins de *Posidonia
    oceanica* du patrimoine mondial de l'UNESCO.
  de: >-
    Jahrtausendealte Salzbecken und die Meerenge Es Freus mit submarinen *Posidonia oceanica*-Wiesen des
    UNESCO-Welterbes.
  it: >-
    Le millenarie saline e lo stretto marino di Es Freus, a tutela delle praterie sottomarine di *Posidonia
    oceanica* Patrimonio Mondiale UNESCO.
  pt: >-
    Salinas milenares e o estreito marítimo de Es Freus, salvaguardando prados submarinos de *Posidonia
    oceanica* Património Mundial da UNESCO.
unico:
  es: >-
    Un parque que es en un 85% mar, con praderas de posidonia entre las mejor conservadas del Mediterráneo y
    las salinas aún en marcha a su alrededor.
  en: >-
    A park that is 85% sea, with posidonia meadows among the best preserved in the Mediterranean and working
    saltpans around them.
  fr: >-
    Un parc composé à 85 % de mer, abritant des herbiers de posidonie parmi les mieux conservés de
    Méditerranée et des salines toujours actives.
  de: >-
    Ein Naturpark, der zu 85 % aus Meer besteht, mit den besterhaltenen Neptungraswiesen des Mittelmeers und
    aktiven Salinen.
  it: >-
    Un parco costituito per l'85% da mare, con praterie di posidonia tra le meglio conservate del Mediterraneo
    e saline tuttora attive.
  pt: >-
    Um parque que é 85% mar, com pradarias de posidónia entre as mais bem conservadas do Mediterrâneo e
    salinas ainda em atividade.
observaciones:
  es: >-
    El parque está abierto todos los días del año, las 24 horas. Quedan restringidos al paso los estanques
    salineros, las dunas, el Cap des Falcó en época de nidificación, del 1 de marzo al 31 de julio, los
    islotes y todo lo que esté fuera de los caminos autorizados. No se puede caminar por las dunas ni por los
    hábitats de interés fuera de pasarelas y sendas señalizadas.


    No se permite acampar ni pernoctar, ni en tienda ni en caravana. Los perros no se admiten fuera de las
    zonas urbanas. Está prohibida la extracción o recogida de fauna y flora, en tierra y en el mar. Está
    prohibido fondear sobre la posidonia: solo se puede fondear en las zonas de arena permitidas. Y los baños
    de barro en la laguna de s'Espalmador están totalmente prohibidos. En verano, el camino de sa Guía se
    recomienda a primera hora o por la tarde, porque hace mucho calor y no hay sombra.
texto:
  es:
    intro: >-
      Entre Ibiza y Formentera hay un brazo de mar poco profundo, un puñado de islotes y, a ambos lados,
      estanques donde el agua del mar se convierte en sal. Eso es ses Salines: un parque natural que empieza
      en el sur de Ibiza, cruza el estrecho y termina en el norte de Formentera. Reúne unas 2.752,5 hectáreas
      de tierra y 14.028 de mar, y es, como dice el propio parque, un área de descanso y de nidificación para
      las aves en sus migraciones. Aquí la sal no es un recuerdo: la industria salinera sigue en
      funcionamiento, y eso da al paisaje una singularidad paisajística e histórica.
    landscape: >-
      Casi todo el parque está bajo el agua. El medio marino ocupa cerca del 85% del territorio, y lo que lo
      define son las praderas submarinas de [Posidonia oceanica](/especie/posidonia_oceanica/), una planta
      marina que mantiene las poblaciones de peces y organismos marinos, oxigena el agua y la mantiene limpia
      y transparente, y protege las playas de la erosión del oleaje. Esas praderas, entre las mejor
      conservadas del Mediterráneo, son Patrimonio de la Humanidad de la UNESCO desde 1999.


      En tierra, el paisaje es otra cosa: pinares mediterráneos, sabinares costeros, salicornares y vegetación
      halófila alrededor de los estanques, dunas y vegetación litoral de acantilados. En total hay 178
      especies de plantas terrestres, la mayoría de las que existen en las Pitiüses. Y en medio de todo, los
      estanques. El Estany Pudent, en Formentera, tiene 3,5 km² y una profundidad máxima de 4 m; antes se
      llamaba lago de los Flamencos, por la abundancia de estas aves en sus humedales.
    wildlife: >-
      Es un parque de aves. Se han censado unas 210 especies, y entre las acuáticas destacan el
      [flamenco](/especie/phoenicopterus_roseus/), la cigüeñuela, el [tarro blanco](/especie/tadorna_tadorna/)
      y el [chorlitejo patinegro](/especie/charadrius_alexandrinus/). Entre las marinas, la [gaviota de
      Audouin](/especie/larus_audouinii/) y la pardela balear. Los flamencos se ven prácticamente todo el año
      en los distintos estanques, y las mejores épocas son al final del verano y en otoño. En el estanque
      Pudent de Formentera se reúne una de las mayores concentraciones europeas de zampullín cuellinegro.


      En tierra hay otros habitantes que no están en ningún otro sitio. La [lagartija
      pitiusa](/especie/podarcis_pityusensis/) es endémica de estas islas y presenta subespecies distintas en
      los islotes; en Formentera vive el lirón careto, y hay caracoles y escarabajos endémicos.
    visit: >-
      La visita se concentra en la zona cercana al mar: la finca pública de Can Marroig, las playas y calas,
      los caminos junto a los estanques y los equipamientos públicos. Para entenderlo, hay dos centros de
      interpretación. El de Sant Francesc, en Ibiza, tiene una exposición sobre la sal, con imágenes modernas
      y herramientas antiguas, y una proyección audiovisual del parque; se llega a pie, en vehículo, en
      bicicleta o en autobús. El de Can Marroig, en Formentera, presenta las praderas de posidonia más
      antiguas, dos explotaciones salineras y especies endémicas de las islas.


      En Formentera hay cuatro itinerarios señalizados que se hacen a pie sin guía. El de Can Marroig a la
      Torre de la Gavina mide 3.500 m y se hace en 60 minutos; recorre una finca pública de unas 149
      hectáreas, con un mosaico de ecosistemas fruto de una relación ancestral con el medio. El camino de
      s'Estany des Peix rodea una bahía natural en 3.000 m y 35 minutos, a pie o en bicicleta. El camino des
      Brolls bordea el Estany Pudent y deja ver la estructura de la antigua industria salinera de Formentera,
      en 4.000 m y 70 minutos. Y el de sa Guía a es Trucadors sigue el antiguo camino del tren de la sal y
      luego las dunas hasta el paso de es Trucadors, en 3.500 m y 70 minutos; su último tramo solo se hace a
      pie.


      El parque organiza visitas guiadas y actividades educativas durante todo el año, en grupos pequeños, con
      inscripción previa. Quien no pueda acceder al medio natural por dificultad física o psíquica puede pedir
      un itinerario con silla Joëlette.
    history: >-
      Hay historia profunda en estos estanques. En un promontorio del Estany Pudent se descubrió en 1974 el
      sepulcro megalítico de Ca na Costa. Las técnicas tradicionales de explotación de la sal, desde el siglo
      VIII a. C., han mantenido el ecosistema con una gran diversidad vegetal y animal. El tren de la sal
      llevaba el producto desde los estanques del norte hasta el embarcadero de La Savina, y hoy ese trazado
      da nombre a la Guía.


      La protección llegó despacio. En 1991 se aplicó la figura de Área Natural de Especial Interés; en 1995
      una ley estatal los convirtió en Reserva Natural, y la Ley 17/2001 los recalificó como parque natural.
    before: >-
      El parque está abierto todos los días del año, las 24 horas. Quedan restringidos al paso los estanques
      salineros, las dunas, el Cap des Falcó en época de nidificación, del 1 de marzo al 31 de julio, los
      islotes y todo lo que esté fuera de los caminos autorizados. No se puede caminar por las dunas ni por
      los hábitats de interés fuera de pasarelas y sendas señalizadas.


      No se permite acampar ni pernoctar, ni en tienda ni en caravana. Los perros no se admiten fuera de las
      zonas urbanas. Está prohibida la extracción o recogida de fauna y flora, en tierra y en el mar. Está
      prohibido fondear sobre la posidonia: solo se puede fondear en las zonas de arena permitidas. Y los
      baños de barro en la laguna de s'Espalmador están totalmente prohibidos. En verano, el camino de sa Guía
      se recomienda a primera hora o por la tarde, porque hace mucho calor y no hay sombra.
    around: >-
      A unos nueve kilómetros queda [La Mola, en Formentera](/lugar/la-mola-formentera/), el vecino más
      cercano del atlas. A distancia, comparten flamenco, chorlitejo patinegro y gaviota de Audouin el [Parque
      Natural da Ria Formosa](/lugar/parque-natural-da-ria-formosa/); aves de humedal como el tarro blanco y
      la cigüeñuela, [Rusanda](/lugar/park-prirode-rusanda/); y posidonia y cigüeñuela, el [Parque Nacional de
      Kornati](/lugar/nacionalni-park-kornati/).
  en:
    intro: >-
      Between Ibiza and Formentera lies a shallow sea passage, a scattering of islets and, on either side,
      evaporation ponds where seawater turns into salt. That is Ses Salines: a natural park that begins in
      southern Ibiza, crosses the marine strait and ends in northern Formentera. It encompasses some 2,752.5
      hectares of land and 14,028 hectares of sea, serving, as the park itself states, as a vital migratory
      stopover and nesting haven for birds. Salt is no museum relic here: the salt extraction industry
      continues actively, lending the cultural landscape unique historic authenticity.
    landscape: >-
      Almost the entire park lies submerged beneath the waves. The marine realm covers around 85% of its total
      area, defined by vast submarine meadows of [Neptune grass](/especie/posidonia_oceanica/). This marine
      flowering plant sustains rich fish populations, filters and oxygenates the water to crystal
      transparency, and shields sandy beaches from coastal swell erosion. These meadows, among the most
      pristine in the Mediterranean, were inscribed as a UNESCO World Heritage site in 1999.


      On land, the scenery shifts: Mediterranean pine groves, coastal juniper woods, glasswort scrub and
      halophytic communities around the saltpans, coastal dunes and cliffside vegetation. In total, 178
      terrestrial plant species thrive here, representing most of the native flora of the Pityusic Islands. At
      the centre of it all lie the saline lagoons. Estany Pudent on Formentera covers 3.5 km² with a maximum
      depth of 4 m; historically it was known as the Lake of Flamingos due to the seasonal wealth of
      waterbirds.
    wildlife: >-
      This is preeminently a bird park. Around 210 bird species have been recorded, with wetland species
      featuring the [greater flamingo](/especie/phoenicopterus_roseus/), black-winged stilt, [common
      shelduck](/especie/tadorna_tadorna/) and [Kentish plover](/especie/charadrius_alexandrinus/). Pelagic
      seabirds include [Audouin's gull](/especie/larus_audouinii/) and the critically endangered Balearic
      shearwater. Flamingos can be seen virtually year-round across the saltpans, peaking in late summer and
      autumn. On Estany Pudent gathers one of the largest wintering flocks of black-necked grebes in Europe.


      On land dwell unique creatures found nowhere else. The [Ibiza wall
      lizard](/especie/podarcis_pityusensis/) is endemic to these islands, exhibiting distinct subspecies
      isolated on individual offshore islets; Formentera harbours garden dormice, alongside endemic land
      snails and flightless beetles.
    visit: >-
      Visitor activity clusters along the coastal fringe: the public estate of Can Marroig, sandy beaches,
      perimeter trails around saltpans and visitor facilities. Two interpretation centres illuminate the park.
      The Sant Francesc centre in Ibiza displays salt-harvesting exhibitions with historical tools and screens
      documentary films; accessible on foot, by car, bicycle or bus. The Can Marroig centre on Formentera
      interprets the ancient posidonia meadows, two saltworks and island endemics.


      Formentera offers four self-guided waymarked routes. The Can Marroig to Torre de la Gavina trail spans
      3,500 m and takes 60 minutes, crossing a public estate of 149 hectares shaped by centuries of
      traditional stewardship. The path around s'Estany des Peix circles a natural lagoon in 3,000 m and 35
      minutes, suitable on foot or bicycle. The Camí des Brolls skirts Estany Pudent, revealing the historic
      layout of Formentera's salt extraction industry in 4,000 m and 70 minutes. The route from sa Guía to es
      Trucadors follows the former salt railway trackbed and sand dunes to es Trucadors spit in 3,500 m and 70
      minutes, its final section strictly pedestrian.


      The park conducts guided walks and educational programmes year-round for small groups by prior
      reservation. Visitors with reduced mobility can request all-terrain Joëlette wheelchairs.
    history: >-
      Deep human history is inscribed in these shores. On a promontory overlooking Estany Pudent, the
      megalithic tomb of Ca na Costa was excavated in 1974. Salt harvesting techniques practised since the
      eighth century BC have preserved a high-salinity ecosystem of exceptional biodiversity. A narrow-gauge
      salt railway once hauled harvested crystals from northern ponds to the La Savina wharf, giving its name
      to the modern Sa Guía route.


      Formal protection developed incrementally. In 1991 the territory was declared a Natural Area of Special
      Interest; a national law created the Natural Reserve in 1995, and Regional Law 17/2001 elevated it to
      Natural Park status.
    before: >-
      The park is accessible every day of the year, 24 hours a day. Entry is restricted across saltpan
      evaporation basins, fragile sand dunes, Cap des Falcó during bird breeding season from 1 March to 31
      July, offshore islets, and outside marked tracks. Walking through dunes outside boardwalks is strictly
      prohibited.


      Camping and overnight stays in tents or campervans are not permitted. Dogs are prohibited outside
      urbanised sectors. Collecting fauna, flora or minerals on land or underwater is illegal. Anchoring on
      posidonia meadows is strictly prohibited: vessels may anchor only on designated sand patches. Mud baths
      in the s'Espalmador lagoon are strictly forbidden. In summer, explore the Sa Guía trail in the early
      morning or late afternoon to avoid intense midday heat and sun exposure.
    around: >-
      Around nine kilometres away lies [La Mola on Formentera](/lugar/la-mola-formentera/), the nearest Atlas
      neighbor. Farther afield, greater flamingos, Kentish plovers and Audouin's gulls are shared with [Ria
      Formosa Natural Park](/lugar/parque-natural-da-ria-formosa/); wetland waterfowl like common shelduck and
      black-winged stilt with [Rusanda](/lugar/park-prirode-rusanda/); and posidonia with [Kornati National
      Park](/lugar/nacionalni-park-kornati/).
  fr:
    intro: >-
      Entre Ibiza et Formentera s'étire un bras de mer peu profond parsemé d'îlots et, de part et d'autre, de
      bassins où l'eau marine se transforme en sel. C'est le parc naturel de Ses Salines : il débute au sud
      d'Ibiza, franchit le détroit et s'achève au nord de Formentera. Il rassemble quelque 2 752,5 hectares
      terrestres et 14 028 hectares marins, constituant une halte migratoire et un site de nidification majeur
      pour l'avifaune. L'exploitation salicole y demeure pleinement active, conférant au paysage une valeur
      patrimoniale et historique singulière.
    landscape: >-
      La quasi-totalité du parc est sous-marine. Le milieu marin représente près de 85 % du territoire, dominé
      par de vastes herbiers de [posidonie](/especie/posidonia_oceanica/). Cette plante marine oxygène les
      eaux, assure leur transparence cristalline et protège les plages sableuses de l'érosion marine. Ces
      herbiers, parmi les plus remarquables de Méditerranée, sont inscrits au patrimoine mondial de l'UNESCO
      depuis 1999.


      À terre, le paysage déploie pinèdes méditerranéennes, genévriers sabulicoles, sansouires et végétations
      halophiles autour des bassins, cordons dunaires et falaises maritimes. On dénombre 178 espèces végétales
      terrestres, soit la majorité de la flore des îles Pityuses. Au centre se trouvent les lagunes salées :
      l'Estany Pudent à Formentera couvre 3,5 km² pour une profondeur maximale de 4 m ; il était jadis nommé
      lac des Flamants en raison de leur présence massive.
    wildlife: >-
      Le parc est un sanctuaire ornithologique réputé. Environ 210 espèces d'oiseaux y ont été recensées, avec
      au premier rang des espèces d'eau le [flamant rose](/especie/phoenicopterus_roseus/), l'échasse blanche,
      le [tadorne de Belon](/especie/tadorna_tadorna/) et le [gravelot à collier
      interrompu](/especie/charadrius_alexandrinus/). Côté marin figurent le [goéland
      d'Audouin](/especie/larus_audouinii/) et le puffin des Baléares. Les flamants s'observent quasiment
      toute l'année sur les étangs, avec un pic à la fin de l'été et en automne. L'Estany Pudent accueille
      l'une des plus grandes concentrations européennes de grèbes à cou noir.


      Sur la terre ferme vivent des animaux exclusifs. Le [lézard des
      Pityuses](/especie/podarcis_pityusensis/) est endémique de l'archipel et développe des sous-espèces
      distinctes sur chaque îlot ; Formentera héberge le lérot, ainsi que des mollusques et coléoptères
      endémiques.
    visit: >-
      La visite s'articule le long de la bande littorale : le domaine public de Can Marroig, les plages et
      criques, les berges des salines et les aménagements publics. Deux centres d'interprétation accueillent
      les visiteurs. Celui de Sant Francesc à Ibiza propose une exposition sur la récolte du sel et des
      projections documentaires ; on y accède à pied, en voiture, à vélo ou en bus. Celui de Can Marroig à
      Formentera met en valeur les herbiers de posidonie, l'exploitation salicole et les endémismes
      insulaires.


      À Formentera, quatre itinéraires balisés se parcourent à pied en autonomie. De Can Marroig à la tour de
      la Gavina, le sentier fait 3 500 m en 60 minutes à travers un domaine public de 149 hectares. Le chemin
      de s'Estany des Peix fait le tour d'une baie naturelle sur 3 000 m en 35 minutes, à pied ou à vélo. Le
      chemin des Brolls longe l'Estany Pudent sur 4 000 m en 70 minutes, dévoilant les ouvrages saliniers
      anciens. L'itinéraire de sa Guía à es Trucadors suit l'ancien tracé du train du sel et les dunes jusqu'à
      la pointe sur 3 500 m en 70 minutes, le tronçon final étant strictement piéton.


      Le parc propose toute l'année des visites guidées en petits groupes sur réservation. Les personnes à
      mobilité réduite peuvent solliciter un parcours adapté en fauteuil Joëlette.
    history: >-
      Ces lagunes possèdent une histoire séculaire. Sur un promontoire dominant l'Estany Pudent fut mis au
      jour en 1974 le dolmen mégalithique de Ca na Costa. L'exploitation artisanale du sel, attestée depuis le
      VIIIe siècle avant J.-C., a préservé des milieux hypersalins d'une haute biodiversité. Le train du sel
      acheminait jadis la récolte jusqu'à l'embarcadère de La Savina, donnant son nom à la piste actuelle de
      Sa Guía.


      La protection s'est mise en place par étapes. Le site fut classé zone naturelle d'intérêt spécial en
      1991, réserve naturelle par loi nationale en 1995, puis parc naturel par la loi 17/2001.
    before: >-
      Le parc est accessible tous les jours de l'année, 24 heures sur vingt-quatre. L'accès est strictement
      interdit dans les bassins saliniers, sur les dunes, au cap des Falcó en période de nidification du 1er
      mars au 31 juillet, sur les îlots et hors des chemins balisés. Il est défendu de fouler les dunes en
      dehors des passerelles en bois.


      Le camping et le bivouac en tente ou camping-car sont proscrits. Les chiens sont interdits en dehors des
      zones urbaines. La cueillette et le prélèvement d'espèces sont formellement prohibés. Le mouillage
      forain sur les herbiers de posidonie est strictement interdit : on ne peut jeter l'ancre que sur les
      zones sableuses autorisées. Les bains de boue dans la lagune d'Espalmador sont strictement interdits. En
      été, parcourez le sentier de Sa Guía tôt le matin ou en fin d'après-midi pour éviter la chaleur.
    around: >-
      À environ neuf kilomètres se dresse [La Mola à Formentera](/lugar/la-mola-formentera/), site le plus
      proche dans l'atlas. Plus loin, flamants roses, gravelots à collier interrompu et goélands d'Audouin se
      retrouvent dans le [parc naturel de la Ria Formosa](/lugar/parque-natural-da-ria-formosa/) ; oiseaux
      d'eau salée à [Rusanda](/lugar/park-prirode-rusanda/) ; et posidonies dans le [parc national des
      Kornati](/lugar/nacionalni-park-kornati/).
  de:
    intro: >-
      Zwischen Ibiza und Formentera liegt eine seichte Meeresstraße, eine Handvoll kleiner Inseln und auf
      beiden Seiten Salzbecken, in denen Meerwasser zu Salz verdunstet. Das ist Ses Salines: ein Naturpark,
      der im Süden Ibizas beginnt, die Meerenge überquert und im Norden Formenteras endet. Er umfasst rund
      2.752,5 Hektar Land und 14.028 Hektar Meeresfläche und dient Zugvögeln als Rast- und Brutgebiet. Das
      Salzsieden ist hier keine ferne Erinnerung: Die Salzgewinnung arbeitet bis heute aktiv, was dem Areal
      seine historische Prägung verleiht.
    landscape: >-
      Fast der gesamte Park liegt unter der Meeresoberfläche. Der marine Raum nimmt rund 85 % des
      Schutzgebiets ein, geprägt von submarinen Wiesen des [Neptungrases](/especie/posidonia_oceanica/). Diese
      Meerespflanze bietet Fischen Lebensraum, filtert das Wasser glasklar und schützt Strände vor
      Wellenerosion. Die Seegraswiesen gehören zu den besterhaltenen des Mittelmeers und sind seit 1999
      UNESCO-Welterbe.


      An Land zeigt sich ein anderes Bild: Pinienwälder, Küsten-Wacholder, Quellerfluren und Salzvegetation an
      den Lagunen, Dünen und Steilküstenflora. Insgesamt gedeihen 178 terrestrische Pflanzenarten, die
      Mehrzahl der Pityusen-Flora. Im Zentrum liegen die Salzteiche: Der Estany Pudent auf Formentera misst
      3,5 km² bei maximal 4 m Tiefe; früher hieß er Flamingo-See nach den zahlreichen Vögeln.
    wildlife: >-
      Ses Salines ist ein Refugium der Vogelwelt. Rund 210 Vogelarten wurden erfasst; an Feuchtgebietsarten
      ragen [Rosaflamingo](/especie/phoenicopterus_roseus/), Stelzenläufer,
      [Brandgans](/especie/tadorna_tadorna/) und [Seeregenpfeifer](/especie/charadrius_alexandrinus/) heraus.
      Unter den Meeresvögeln leben [Korallenmöwe](/especie/larus_audouinii/) und Balearen-Sturmtaucher.
      Flamingos sind fast das ganze Jahr über an den Teichen zu sehen, vor allem im Spätsommer und Herbst. Am
      Estany Pudent versammelt sich eine der größten Schwarzhalstaucher-Rastansammlungen Europas.


      An Land leben Endemiten: Die [Pityusen-Eidechse](/especie/podarcis_pityusensis/) kommt nur auf diesen
      Inseln vor und bildet auf einzelnen Eilanden eigene Unterarten aus; auf Formentera lebt der
      Gartenschläfer neben endemischen Landschnecken und Käfern.
    visit: >-
      Besucher halten sich vor allem an der Küste auf: am Landgut Can Marroig, an Stränden, Wegen entlang der
      Salzteiche und Informationszentren. Zwei Zentren erschließen das Gebiet: Das Zentrum in Sant Francesc
      auf Ibiza zeigt eine Ausstellung zum Salzwesen mit Werkzeugen und Filmen; erreichbar zu Fuß, mit dem
      Auto, Rad oder Bus. Das Zentrum Can Marroig auf Formentera informiert über Seegraswiesen, Salzgewinnung
      und Inselemdemiten.


      Auf Formentera gibt es vier markierte Wanderrouten: Von Can Marroig zum Torre de la Gavina führt ein
      3.500 m langer Weg in 60 Minuten durch ein 149 Hektar großes Landgut. Der Weg um s'Estany des Peix
      umrundet eine Bucht auf 3.000 m in 35 Minuten zu Fuß oder per Rad. Der Camí des Brolls säumt den Estany
      Pudent über 4.000 m in 70 Minuten. Der Weg von Sa Guía nach Es Trucadors folgt den alten Salzbahngleisen
      und Dünen über 3.500 m in 70 Minuten, im Schlussteil nur zu Fuß.


      Der Park bietet ganzjährig geführte Touren in Kleingruppen nach Anmeldung an. Für
      mobilitätseingeschränkte Gäste steht ein geländegängiger Joëlette-Rollstuhl bereit.
    history: >-
      Die Teiche blicken auf eine lange Geschichte zurück. Auf einer Anhöhe am Estany Pudent wurde 1974 die
      Megalithanlage Ca na Costa freigelegt. Die seit dem achten Jahrhundert v. Chr. betriebene Salzgewinnung
      bewahrte Salzlebensräume von hoher biologischer Vielfalt. Die Salzfrachtbahn transportierte das Salz
      einst zur Mole von La Savina, woraus der heutige Weg Sa Guía hervorging.


      Der Schutzstatus wuchs schrittweise: 1991 zum Naturgebiet von besonderem Interesse erklärt, folgte 1995
      die Ausweisung als staatliches Naturschutzgebiet und mit dem Gesetz 17/2001 die Aufwertung zum
      Naturpark.
    before: >-
      Der Park ist ganzjährig rund um die Uhr, 24 Stunden am Tag, zugänglich. Das Betreten der Salzbecken,
      Dünen, des Cap des Falcó während der Brutzeit vom 1. März bis zum 31. Juli, der kleinen Felsinseln und
      aller Bereiche abseits markierter Wege ist untersagt. Dünen dürfen nur auf Holzstegen gequert werden.


      Campen und Übernachten im Zelt oder Wohnmobil sind verboten. Hunde sind außerhalb geschlossener
      Ortschaften nicht gestattet. Das Sammeln von Pflanzen oder Tieren zu Lande und zu Wasser ist untersagt.
      Das Ankern auf Neptungraswiesen ist streng verboten: Ankern ist nur auf ausgewiesenen Sandflächen
      erlaubt. Schlammbäder in der Lagune von S'Espalmador sind untersagt. Im Sommer empfiehlt sich der Weg Sa
      Guía frühmorgens oder am späten Nachmittag.
    around: >-
      Rund neun Kilometer entfernt liegt [La Mola auf Formentera](/lugar/la-mola-formentera/). Weiter entfernt
      teilen Flamingo, Seeregenpfeifer und Korallenmöwe der [Naturpark Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/); Brandgans und Stelzenläufer das Schutzgebiet
      [Rusanda](/lugar/park-prirode-rusanda/); und Neptungras der [Nationalpark
      Kornati](/lugar/nacionalni-park-kornati/).
  it:
    intro: >-
      Tra Ibiza e Formentera si apre un braccio di mare poco profondo, un mosaico di isolotti e, su entrambe
      le sponde, vasche in cui l'acqua marina evapora trasformandosi in sale. Questo è Ses Salines: un parco
      naturale che ha inizio a sud di Ibiza, attraversa lo stretto e termina a nord di Formentera. Racchiude
      circa 2.752,5 ettari di terraferma e 14.028 ettari marini, offrendo rifugio e sosta migratoria a
      migliaia di uccelli. L'estrazione del sale è tuttora in piena attività, conferendo al territorio un
      valore paesaggistico e storico eccezionale.
    landscape: >-
      Quasi l'intero parco si estende sotto la superficie marina. L'ambiente marino occupa circa l'85% della
      superficie protetta, dominato da rigogliose praterie di [posidonia
      oceanica](/especie/posidonia_oceanica/). Questa fanerogama marina sostiene le comunità ittiche, ossigena
      e rende limpide le acque, e preserva le spiagge sabbiose dal moto ondoso. Tali fondali, tra i più
      integri del Mediterraneo, sono Patrimonio dell'Umanità UNESCO dal 1999.


      Sulla terraferma il paesaggio muta: pinete mediterranee, gineprai litoranei, salicornieti attorno agli
      stagni, dune e vegetazione rupicola costiera. Complessivamente si contano 178 specie vegetali terrestri,
      la gran parte della flora delle Pitiuse. Al centro del sistema sorgono i bacini saliferi: l'Estany
      Pudent a Formentera copre 3,5 km² con una profondità massima di 4 m; in passato era noto come lago dei
      Fenicotteri per l'abbondanza di questi trampolieri.
    wildlife: >-
      È un regno dell'avifauna. Sono state censite circa 210 specie di uccelli, tra cui spiccano il
      [fenicottero maggiore](/especie/phoenicopterus_roseus/), il cavaliere d'Italia, la
      [volpoca](/especie/tadorna_tadorna/) e il [fratino](/especie/charadrius_alexandrinus/). Tra gli uccelli
      marini nidificano il [gabbiano corso](/especie/larus_audouinii/) e la berta delle Baleari. I fenicotteri
      stazionano quasi tutto l'anno nelle saline, con picchi a fine estate e in autunno. Sull'Estany Pudent si
      raccoglie una delle più grandi concentrazioni europee di svassi piccoletti svernanti.


      Sulla terraferma vivono endemismi esclusivi. La [lucertola delle
      Baleari](/especie/podarcis_pityusensis/) è endemica dell'arcipelago e presenta sottospecie distinte sui
      vari isolotti; a Formentera vive il quercino, accanto a chiocciole e coleotteri endemici.
    visit: >-
      La fruizione si concentra lungo la costa: la tenuta pubblica di Can Marroig, le spiagge, i sentieri
      attorno ai bacini saliferi e i centri visita. Due strutture museali illustrano il parco: quella di Sant
      Francesc a Ibiza ospita un allestimento sulle tecniche estrattive del sale e proietta documentari; è
      raggiungibile a piedi, in auto, bicicletta o autobus. Quella di Can Marroig a Formentera illustra le
      praterie di posidonia, la storia delle saline e le specie endemiche.


      A Formentera si snodano quattro itinerari pedonali autoguidati. Da Can Marroig alla Torre de la Gavina
      il tracciato copre 3.500 m in 60 minuti attraverso una tenuta di 149 ettari. Il percorso attorno a
      s'Estany des Peix costeggia una laguna naturale su 3.000 m in 35 minuti, a piedi o in bici. Il Camí des
      Brolls segue l'Estany Pudent su 4.000 m in 70 minuti, svelando le strutture storiche delle saline.
      L'itinerario da Sa Guía a Es Trucadors ricalca la vecchia ferrovia del sale e le dune sabbiose per 3.500
      m in 70 minuti, con il tratto terminale percorribile solo a piedi.


      Il parco organizza visite guidate in piccoli gruppi su prenotazione. Le persone con disabilità motoria
      possono usufruire di carrozzine fuoristrada Joëlette.
    history: >-
      Le saline affondano le radici nell'antichità. Su un promontorio affacciato sull'Estany Pudent fu
      scoperto nel 1974 il sepolcro megalitico di Ca na Costa. Le tecniche tradizionali di raccolta del sale,
      attestate sin dall'VIII secolo a.C., hanno garantito la continuità di un ambiente ipersalino ad alta
      biodiversità. Il treno del sale trasportava i carichi dalle vasche settentrionali all'imbarcadero di La
      Savina, dando origine all'odierno percorso di Sa Guía.


      La salvaguardia è maturata per tappe successive: nel 1991 l'area fu dichiarata Area Naturale di Speciale
      Interesse; nel 1995 una legge statale istituì la Riserva Naturale e la Legge 17/2001 la trasformò in
      parco naturale.
    before: >-
      Il parco è aperto tutti i giorni dell'anno, 24 ore al giorno. L'accesso è vietato all'interno dei bacini
      saliferi, sulle dune, a Cap des Falcó durante il periodo di nidificazione dal 1° marzo al 31 luglio,
      sugli isolotti e al di fuori dei percorsi segnalati. Sulle dune è consentito transitare soltanto sulle
      passerelle in legno.


      Sono vietati il campeggio e il pernottamento in tenda o camper. I cani non sono ammessi all'esterno
      delle aree urbane. È proibita la raccolta di flora e fauna, terrestre e sottomarina. L'ancoraggio sulle
      praterie di posidonia è severamente vietato: le imbarcazioni possono ancorare unicamente sui fondali
      sabbiosi autorizzati. I bagni di fango nella laguna di s'Espalmador sono totalmente proibiti. In estate
      si consiglia di percorrere il cammino di Sa Guía nelle prime ore del mattino o al tardo pomeriggio.
    around: >-
      A circa nove chilometri sorge [La Mola a Formentera](/lugar/la-mola-formentera/). Più distante,
      fenicotteri, fratini e gabbiani corsi sono condivisi con il [Parco naturale di Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/); volpoche e cavalieri d'Italia con
      [Rusanda](/lugar/park-prirode-rusanda/); e fondali a posidonia con il [Parco nazionale delle
      Incoronate](/lugar/nacionalni-park-kornati/).
  pt:
    intro: >-
      Entre Ibiza e Formentera estende-se um estreito marítimo pouco profundo, um cordão de ilhéus e tanques
      cristalizadores onde a água do mar se converte em sal. Assim é Ses Salines: um parque natural que nasce
      no sul de Ibiza, atravessa o estreito e culmina no norte de Formentera. Reúne cerca de 2.752,5 hectares
      terrestres e 14.028 hectares marinhos, servindo de refúgio e escala migratória para a avifauna. A
      extração de sal permanece em plena laboração, imprimindo à paisagem uma autenticidade histórica ímpar.
    landscape: >-
      Quase todo o parque se encontra submerso. O ambiente marinho abrange cerca de 85% do espaço protegido,
      estruturado por densos prados submarinos de [erva-de-posidónia](/especie/posidonia_oceanica/). Esta
      planta marinha oxigena as águas, mantém a sua transparência e abriga as praias da erosão marítima. Estes
      prados, dos mais intocados do Mediterrâneo, foram declarados Património Mundial pela UNESCO em 1999.


      Em terra o cenário transforma-se: pinhais mediterrânicos, sabinais costeiros, sapais e vegetação
      halófila em redor das salinas, dunas e falésias marítimas. Registam-se 178 espécies de plantas
      vasculares terrestres, a grande maioria da flora das ilhas Pitiusas. Ao centro sobressaem as lagoas
      salinas: o Estany Pudent em Formentera abrange 3,5 km² e uma profundidade máxima de 4 m; chamava-se
      antigamente lago dos Flamingos devido à abundância destas aves.
    wildlife: >-
      É um santuário de aves aquáticas. Estão inventariadas cerca de 210 espécies, destacando-se o
      [flamengo-comum](/especie/phoenicopterus_roseus/), o pernilongo, o
      [pato-branco](/especie/tadorna_tadorna/) e o
      [borrelho-de-coleira-interrompida](/especie/charadrius_alexandrinus/). Entre as aves marinhas contam-se
      a [gaivota-de-audouin](/especie/larus_audouinii/) e a pardela-balear. Os flamingos observam-se quase
      todo o ano nas salinas, com maior concentração no fim do verão e no outono. No Estany Pudent reúne-se
      uma das maiores concentrações europeias de mergulhões-de-pescoço-preto invernantes.


      Em terra firme habitam endemismos zoológicos. A [lagartixa-das-pitiusas](/especie/podarcis_pityusensis/)
      é endémica deste arquipélago, apresentando subespécies exclusivas em vários ilhéus; em Formentera vive o
      leirão-careto, a par de caracóis e escaravelhos endémicos.
    visit: >-
      A visita concentra-se ao longo da faixa costeira: a herdade pública de Can Marroig, as praias de areia
      branca, os trilhos que circundam as salinas e os centros de interpretação. Existem dois centros de
      acolhimento: o de Sant Francesc em Ibiza exibe alfaias e fotografias históricas da colheita do sal e
      projeta documentários; acessível a pé, em viatura, bicicleta ou autocarro. O de Can Marroig em
      Formentera apresenta os prados de posidónia, o património salineiro e a flora endémica.


      Em Formentera existem quatro percursos pedestres sinalizados em regime livre. De Can Marroig à Torre de
      la Gavina são 3.500 m cumpridos em 60 minutos através de uma herdade pública de 149 hectares. O caminho
      de s'Estany des Peix circunda uma baía em 3.000 m e 35 minutos, a pé ou de bicicleta. O Camí des Brolls
      margeia o Estany Pudent em 4.000 m e 70 minutos. O percurso de Sa Guía a Es Trucadors percorre a antiga
      linha férrea do sal e os cordões dunares ao longo de 3.500 m e 70 minutos, com o troço final
      estritamente pedonal.


      O parque promove visitas guiadas para grupos reduzidos mediante inscrição. Pessoas com mobilidade
      condicionada podem solicitar a cadeira todo-o-terreno Joëlette.
    history: >-
      Estas salinas encerram um passado arqueológico profundo. Num promontório sobranceiro ao Estany Pudent
      foi descoberto em 1974 o sepulcro megalítico de Ca na Costa. As práticas tradicionais de recolha de sal,
      documentadas desde o século VIII a.C., preservaram ecossistemas de alta salinidade com grande
      biodiversidade. O comboio do sal transportava as colheitas das salinas do norte até ao porto de La
      Savina, dando origem ao atual trilho de Sa Guía.


      A proteção consolidou-se por etapas: em 1991 foi declarada Área Natural de Especial Interesse; em 1995
      uma lei estatal criou a Reserva Natural e a Lei 17/2001 elevou o espaço a parque natural.
    before: >-
      O parque encontra-se aberto todos os dias do ano, 24 horas por dia. O acesso é estritamente proibido nos
      tanques das salinas, nos sistemas dunares, no Cap des Falcó durante o período de nidificação de 1 de
      março a 31 de julho, nos ilhéus e fora dos trilhos sinalizados. É proibido pisar as dunas fora dos
      passadiços de madeira.


      Não é permitido acampar ou pernoitar em tendas ou autocaravanas. Não são admitidos cães fora dos
      perímetros urbanos. É proibida a colheita de flora e fauna terrestre e marinha. O fundeio sobre prados
      de posidónia é estritamente proibido: apenas se pode fundear nas manchas arenosas autorizadas. Os banhos
      de lama na lagoa de s'Espalmador estão totalmente interditos. No verão, percorre o caminho de Sa Guía de
      manhã cedo ou ao entardecer para evitar o calor.
    around: >-
      A cerca de nove quilómetros ergue-se [La Mola em Formentera](/lugar/la-mola-formentera/). Mais longe,
      flamingos, borrelhos-de-coleira-interrompida e gaivotas-de-audouin ocorrem no [Parque Natural da Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/); patos-brancos e pernilongos em
      [Rusanda](/lugar/park-prirode-rusanda/); e prados de posidónia no [Parque Nacional de
      Kornati](/lugar/nacionalni-park-kornati/).
