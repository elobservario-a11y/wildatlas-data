resumen:
  es: >-
    El 'Colorado Albanés', un desfiladero de 26 km de paredes calizas verticales de 100 m de altura salpicado
    de cascadas cayendo al río.
  en: >-
    The 'Albanian Colorado', a 26 km defile of vertical 100 m high limestone walls punctuated by cascading
    waterfalls.
  fr: >-
    Le « Colorado albanais », un défilé de 26 km aux parois calcaires verticales de 100 m arrosé de cascades
    plongeant dans la rivière.
  de: >-
    Der 'Albanische Colorado', eine 26 km lange Schlucht mit senkrechten, 100 m hohen Kalkwänden und
    herabstürzenden Wasserfällen.
  it: >-
    Il 'Colorado albanese', una gola di 26 km con pareti calcaree verticali di 100 m e cascate scroscianti nel
    fiume.
  pt: >-
    O 'Colorado Albanês', um desfiladeiro de 26 km com escarpas calcárias verticais de 100 m e cascatas que
    caem ao rio.
unico:
  es: Un cañón que, según se cree, fue un río subterráneo antes de que desapareciera la roca que lo cubría.
  en: >-
    A canyon widely believed to have formed as a subterranean river before its cavernous limestone ceiling
    collapsed.
  fr: >-
    Un canyon qui fut, selon les géologues, une rivière souterraine avant que sa voûte rocheuse ne s'effondre
    à ciel ouvert.
  de: Ein Canyon, der einst ein unterirdischer Fluss war, bevor die überdeckende Felsdecke einstürzte.
  it: Un canyon che, secondo gli studi, fu un fiume ipogeo prima che la volta rocciosa crollasse a cielo aperto.
  pt: Um canhão que, segundo se crê, foi um rio subterrâneo antes de ruir a abóbada rochosa que o cobria.
observaciones:
  es: >-
    La mejor época es la primavera para las cascadas y el cañón entero desde el río, y el final del verano
    para caminar y bañarse en las pozas. Con el agua baja no se puede recorrer toda la garganta por el cauce.
texto:
  es:
    intro: >-
      En primavera, cuando la nieve se derrite, el Osum crece tanto que se puede recorrer el cañón entero
      desde el propio río, mientras las cascadas caen desde lo alto de las paredes. A finales de verano, con
      el agua baja, ya no: el cauce deja de ser navegable de punta a punta y el cañón se explora a pie, entre
      pozas y arroyos donde bañarse. El Kanioni i Osumit está en el sur de Albania, junto a Çorovodë, y es una
      profunda garganta rocosa creada por el río, de más de veintiséis kilómetros de longitud y paredes de
      hasta ochenta metros. Está declarado Monumento Natural.
    landscape: >-
      La explicación que se da del cañón es sencilla y sorprendente: hace mucho el río corría bajo tierra, y
      con el tiempo la roca que lo cubría fue desapareciendo hasta dejar la garganta abierta. La erosión del
      agua lo habría formado hace entre dos y tres millones de años. En las paredes ha excavado pequeñas
      cuevas, y a lo largo del cañón hay numerosos pasadizos subterráneos y cuevas sin explorar. Algunas
      formaciones tienen nombres con carácter: la Catedral, el Ojo y la Puerta del Demonio.


      El cañón tiene seis estrechamientos, con un cauce que llega a tener solo un metro y medio de anchura y
      laderas que se abren hasta treinta y cinco metros. Está a unos cuatrocientos cincuenta metros de
      altitud.
    wildlife: >-
      Los márgenes del cañón mantienen la vegetación verde durante todo el año, un ecosistema poco habitual.
      Desde las laderas se ven brezos y otros arbustos mediterráneos, con una flora y fauna ricas.


      El calendario del Osum es el del agua. La primavera es la mejor época: el deshielo permite recorrer todo
      el cañón desde el río y hace que truenen las numerosas cascadas que caen desde los bordes. Al final del
      verano, cuando el nivel baja, es el momento de los paseos con pozas y arroyos.
    visit: >-
      El punto de partida es Çorovodë, donde el río entra en la garganta. Desde allí, los paseos del final del
      verano recorren pozas y arroyos del cañón, y es un destino conocido para caminar por la naturaleza. A
      cinco kilómetros al noreste de Çorovodë, el cañón de Gradec esconde Pirogosh, que se presume la mayor
      cueva de Albania.
    history: >-
      Los vecinos guardan leyendas: la del Mulliri i Babait, la de Vrima e Nuses y la de San Abaz Ali. El Osum
      nace cerca de Vithkuq y mide 161 km; pasa por Çorovodë, por el cañón, por Poliçan y por Berat, y al
      unirse al Devoll cerca de Kuçovë forma el río Seman. Como Monumento Natural, el cañón está protegido por
      sus valores geomorfológicos, científicos y estéticos.
    before: >-
      La mejor época es la primavera para las cascadas y el cañón entero desde el río, y el final del verano
      para caminar y bañarse en las pozas. Con el agua baja no se puede recorrer toda la garganta por el
      cauce.
    around: >-
      A ocho kilómetros está el [Cañón Termal del Río Langarica](/lugar/kanioni-i-langarices/), otra garganta
      del sur de Albania.
  en:
    intro: >-
      In spring, when the snow melts, the Osum swells so much that you can travel the whole canyon on the
      river itself, while waterfalls pour down from the top of the walls. By late summer, with the water low,
      that is no longer possible: the riverbed can't be navigated from end to end, and the canyon is explored
      on foot, between pools and streams where you can swim. Kanioni i Osumit lies in southern Albania, next
      to Çorovodë, and is a deep rocky gorge carved by the river, more than twenty-six kilometres long, with
      walls up to eighty metres high. It is protected as a Natural Monument.
    landscape: >-
      The explanation given for the canyon is simple and surprising: long ago the river ran underground, and
      over time the rock covering it wore away until the gorge lay open. Water erosion would have shaped it
      between two and three million years ago. The river has hollowed small caves into the walls, and along
      the canyon there are many underground passages and unexplored caves. Some formations have names with
      character: the Cathedral, the Eye and the Devil's Gate.


      The canyon narrows six times, with a channel that shrinks to just a metre and a half wide and slopes
      that open out to thirty-five metres. It lies at about four hundred and fifty metres above sea level.
    wildlife: >-
      The edges of the canyon stay green all year round, an unusual ecosystem. From the slopes you can see
      heather and other Mediterranean shrubs, with a rich flora and fauna.


      The Osum's calendar is the water's calendar. Spring is the best time: the snowmelt lets you travel the
      whole canyon on the river and makes the many waterfalls thunder as they drop from the rims. At the end
      of summer, when the level falls, it is time for walks among pools and streams.
    visit: >-
      The starting point is Çorovodë, where the river enters the gorge. From there, late-summer walks follow
      the canyon's pools and streams, and it is a well-known destination for nature walks. Five kilometres
      north-east of Çorovodë, the Gradec canyon hides Pirogosh, said to be the largest cave in Albania.
    history: >-
      Local people keep their legends: that of Mulliri i Babait, that of Vrima e Nuses and that of Saint Abaz
      Ali. The Osum rises near Vithkuq and is 161 km long; it flows past Çorovodë, through the canyon, past
      Poliçan and Berat, and where it joins the Devoll near Kuçovë it forms the Seman river. As a Natural
      Monument, the canyon is protected for its geomorphological, scientific and aesthetic value.
    before: >-
      The best time is spring for the waterfalls and for doing the whole canyon on the river, and late summer
      for walking and swimming in the pools. When the water is low you can't travel the whole gorge along the
      riverbed.
    around: >-
      Eight kilometres away is the [Langarica River Thermal Canyon](/lugar/kanioni-i-langarices/), another
      gorge in southern Albania.
  fr:
    intro: >-
      Au printemps, à la fonte des neiges, l'Osum grossit tant qu'on peut parcourir tout le canyon sur la
      rivière elle-même, tandis que les cascades tombent du haut des parois. À la fin de l'été, quand les eaux
      sont basses, ce n'est plus possible : le lit n'est plus navigable d'un bout à l'autre et le canyon se
      découvre à pied, entre vasques et ruisseaux où se baigner. Le Kanioni i Osumit se trouve dans le sud de
      l'Albanie, près de Çorovodë : c'est une profonde gorge rocheuse creusée par la rivière, longue de plus
      de vingt-six kilomètres, aux parois hautes de quatre-vingts mètres au plus. Il est classé monument
      naturel.
    landscape: >-
      L'explication qu'on donne du canyon est simple et surprenante : il y a longtemps, la rivière coulait
      sous terre, et la roche qui la recouvrait a peu à peu disparu jusqu'à laisser la gorge à ciel ouvert.
      L'érosion de l'eau l'aurait formée il y a deux à trois millions d'années. Elle a creusé de petites
      grottes dans les parois, et tout le long du canyon s'ouvrent de nombreux passages souterrains et des
      grottes inexplorées. Certaines formations portent des noms évocateurs : la Cathédrale, l'Œil et la Porte
      du Diable.


      Le canyon compte six étranglements, où le lit ne mesure parfois qu'un mètre et demi de large, et des
      versants qui s'écartent jusqu'à trente-cinq mètres. Il se situe à environ quatre cent cinquante mètres
      d'altitude.
    wildlife: >-
      Les rives du canyon restent vertes toute l'année, un écosystème peu commun. Depuis les versants, on voit
      des bruyères et d'autres arbustes méditerranéens, avec une flore et une faune riches.


      Le calendrier de l'Osum est celui de l'eau. Le printemps est la meilleure saison : la fonte des neiges
      permet de parcourir tout le canyon sur la rivière et fait gronder les nombreuses cascades qui tombent
      des rebords. À la fin de l'été, quand le niveau baisse, vient le temps des promenades entre vasques et
      ruisseaux.
    visit: >-
      Le point de départ est Çorovodë, là où la rivière entre dans la gorge. De là, les balades de fin d'été
      parcourent les vasques et les ruisseaux du canyon, une destination connue pour la randonnée nature. À
      cinq kilomètres au nord-est de Çorovodë, le canyon de Gradec cache Pirogosh, qui passe pour la plus
      grande grotte d'Albanie.
    history: >-
      Les habitants gardent leurs légendes : celle du Mulliri i Babait, celle de Vrima e Nuses et celle de
      saint Abaz Ali. L'Osum prend sa source près de Vithkuq et mesure 161 km ; il passe par Çorovodë, par le
      canyon, par Poliçan et par Berat, et, en rejoignant le Devoll près de Kuçovë, il forme le Seman. En tant
      que monument naturel, le canyon est protégé pour ses valeurs géomorphologiques, scientifiques et
      esthétiques.
    before: >-
      La meilleure saison est le printemps pour les cascades et pour parcourir tout le canyon sur la rivière,
      et la fin de l'été pour marcher et vous baigner dans les vasques. Quand les eaux sont basses, on ne peut
      pas parcourir toute la gorge par le lit.
    around: >-
      À huit kilomètres se trouve le [Canyon thermal de la rivière Langarica](/lugar/kanioni-i-langarices/),
      une autre gorge du sud de l'Albanie.
  de:
    intro: >-
      Im Frühling, wenn der Schnee schmilzt, schwillt der Osum so stark an, dass man den ganzen Canyon auf dem
      Fluss selbst befahren kann, während Wasserfälle von der Oberkante der Wände stürzen. Im Spätsommer, bei
      Niedrigwasser, geht das nicht mehr: Das Flussbett ist nicht mehr durchgehend befahrbar, und der Canyon
      wird zu Fuß erkundet, zwischen Gumpen und Bächen, in denen du baden kannst. Der Kanioni i Osumit liegt
      im Süden Albaniens bei Çorovodë und ist eine tiefe Felsschlucht, die der Fluss geschaffen hat: über
      sechsundzwanzig Kilometer lang, mit bis zu achtzig Meter hohen Wänden. Er ist als Naturdenkmal
      ausgewiesen.
    landscape: >-
      Die Erklärung für den Canyon ist einfach und überraschend: Vor langer Zeit floss der Fluss unterirdisch,
      und mit der Zeit verschwand das Gestein darüber, bis die Schlucht offen dalag. Die Erosion des Wassers
      soll sie vor zwei bis drei Millionen Jahren geformt haben. In die Wände hat der Fluss kleine Höhlen
      gegraben, und entlang des Canyons gibt es zahlreiche unterirdische Gänge und unerforschte Höhlen. Manche
      Formationen tragen markante Namen: die Kathedrale, das Auge und das Teufelstor.


      Der Canyon hat sechs Engstellen, an denen das Flussbett nur anderthalb Meter breit ist, und Hänge, die
      sich bis auf fünfunddreißig Meter öffnen. Er liegt auf etwa vierhundertfünfzig Metern Höhe.
    wildlife: >-
      Die Ränder des Canyons bleiben das ganze Jahr über grün, ein ungewöhnliches Ökosystem. Von den Hängen
      aus siehst du Heidekraut und andere mediterrane Sträucher, mit einer reichen Pflanzen- und Tierwelt.


      Der Kalender des Osum ist der des Wassers. Der Frühling ist die beste Zeit: Die Schneeschmelze erlaubt
      es, den ganzen Canyon auf dem Fluss zu befahren, und lässt die vielen Wasserfälle donnern, die über die
      Ränder stürzen. Am Ende des Sommers, wenn der Pegel sinkt, ist die Zeit für Wanderungen zwischen Gumpen
      und Bächen.
    visit: >-
      Ausgangspunkt ist Çorovodë, wo der Fluss in die Schlucht eintritt. Von dort führen die
      Spätsommerwanderungen durch die Gumpen und Bäche des Canyons, ein bekanntes Ziel für Naturwanderungen.
      Fünf Kilometer nordöstlich von Çorovodë verbirgt die Gradec-Schlucht Pirogosh, die als größte Höhle
      Albaniens gilt.
    history: >-
      Die Menschen hier bewahren ihre Legenden: die vom Mulliri i Babait, die von Vrima e Nuses und die vom
      heiligen Abaz Ali. Der Osum entspringt bei Vithkuq und ist 161 km lang; er fließt an Çorovodë vorbei,
      durch den Canyon, an Poliçan und Berat vorbei und bildet dort, wo er sich bei Kuçovë mit dem Devoll
      vereinigt, den Seman. Als Naturdenkmal ist der Canyon wegen seiner geomorphologischen,
      wissenschaftlichen und ästhetischen Werte geschützt.
    before: >-
      Die beste Zeit ist der Frühling für die Wasserfälle und den ganzen Canyon auf dem Fluss, und der
      Spätsommer zum Wandern und Baden in den Gumpen. Bei Niedrigwasser kannst du die Schlucht nicht
      durchgehend im Flussbett begehen.
    around: >-
      Acht Kilometer entfernt liegt die [Thermal-Schlucht des
      Langarica-Flusses](/lugar/kanioni-i-langarices/), eine weitere Schlucht im Süden Albaniens.
  it:
    intro: >-
      In primavera, quando la neve si scioglie, l'Osum si gonfia tanto che si può percorrere tutto il canyon
      sul fiume stesso, mentre le cascate precipitano dall'alto delle pareti. A fine estate, con l'acqua
      bassa, non più: l'alveo non è più navigabile da un capo all'altro e il canyon si esplora a piedi, tra
      pozze e ruscelli dove fare il bagno. Il Kanioni i Osumit si trova nel sud dell'Albania, vicino a
      Çorovodë, ed è una profonda gola rocciosa creata dal fiume, lunga più di ventisei chilometri, con pareti
      alte fino a ottanta metri. È dichiarato Monumento Naturale.
    landscape: >-
      La spiegazione che si dà del canyon è semplice e sorprendente: molto tempo fa il fiume scorreva
      sottoterra, e col tempo la roccia che lo copriva è scomparsa fino a lasciare la gola a cielo aperto.
      L'erosione dell'acqua l'avrebbe formato tra due e tre milioni di anni fa. Nelle pareti ha scavato
      piccole grotte, e lungo il canyon si aprono numerosi passaggi sotterranei e grotte inesplorate. Alcune
      formazioni hanno nomi di carattere: la Cattedrale, l'Occhio e la Porta del Diavolo.


      Il canyon ha sei strettoie, con un alveo che arriva a essere largo appena un metro e mezzo e versanti
      che si aprono fino a trentacinque metri. Si trova a circa quattrocentocinquanta metri di quota.
    wildlife: >-
      Le sponde del canyon restano verdi tutto l'anno, un ecosistema poco comune. Dai versanti si vedono
      eriche e altri arbusti mediterranei, con una flora e una fauna ricche.


      Il calendario dell'Osum è quello dell'acqua. La primavera è il periodo migliore: il disgelo permette di
      percorrere tutto il canyon sul fiume e fa tuonare le numerose cascate che cadono dai bordi. A fine
      estate, quando il livello cala, è il momento delle passeggiate tra pozze e ruscelli.
    visit: >-
      Il punto di partenza è Çorovodë, dove il fiume entra nella gola. Da lì, le passeggiate di fine estate
      percorrono pozze e ruscelli del canyon, una meta nota per le camminate nella natura. A cinque chilometri
      a nord-est di Çorovodë, il canyon di Gradec nasconde Pirogosh, ritenuta la grotta più grande
      dell'Albania.
    history: >-
      Gli abitanti custodiscono le loro leggende: quella del Mulliri i Babait, quella di Vrima e Nuses e
      quella di sant'Abaz Ali. L'Osum nasce vicino a Vithkuq ed è lungo 161 km; passa per Çorovodë, per il
      canyon, per Poliçan e per Berat e, unendosi al Devoll vicino a Kuçovë, forma il fiume Seman. Come
      Monumento Naturale, il canyon è tutelato per i suoi valori geomorfologici, scientifici ed estetici.
    before: >-
      Il periodo migliore è la primavera per le cascate e per percorrere tutto il canyon sul fiume, e la fine
      dell'estate per camminare e fare il bagno nelle pozze. Con l'acqua bassa non si può percorrere tutta la
      gola lungo l'alveo.
    around: >-
      A otto chilometri c'è il [Canyon termale del fiume Langarica](/lugar/kanioni-i-langarices/), un'altra
      gola del sud dell'Albania.
  pt:
    intro: >-
      Na primavera, quando a neve derrete, o Osum cresce tanto que se pode percorrer todo o desfiladeiro pelo
      próprio rio, enquanto as cascatas caem do alto das paredes. No fim do verão, com a água baixa, já não: o
      leito deixa de ser navegável de ponta a ponta e o desfiladeiro explora-se a pé, entre poças e ribeiros
      onde tomar banho. O Kanioni i Osumit fica no sul da Albânia, junto a Çorovodë, e é uma garganta rochosa
      profunda criada pelo rio, com mais de vinte e seis quilómetros de comprimento e paredes de até oitenta
      metros. Está classificado como Monumento Natural.
    landscape: >-
      A explicação que se dá para o desfiladeiro é simples e surpreendente: há muito tempo o rio corria
      debaixo da terra e, com o tempo, a rocha que o cobria foi desaparecendo até deixar a garganta a
      descoberto. A erosão da água tê-lo-á formado há entre dois e três milhões de anos. Nas paredes escavou
      pequenas grutas, e ao longo do desfiladeiro há numerosas passagens subterrâneas e grutas por explorar.
      Algumas formações têm nomes com carácter: a Catedral, o Olho e a Porta do Diabo.


      O desfiladeiro tem seis estreitamentos, com um leito que chega a ter apenas metro e meio de largura e
      encostas que se abrem até trinta e cinco metros. Fica a cerca de quatrocentos e cinquenta metros de
      altitude.
    wildlife: >-
      As margens do desfiladeiro mantêm a vegetação verde durante todo o ano, um ecossistema pouco habitual.
      Das encostas veem-se urzes e outros arbustos mediterrânicos, com uma flora e uma fauna ricas.


      O calendário do Osum é o da água. A primavera é a melhor época: o degelo permite percorrer todo o
      desfiladeiro pelo rio e faz trovejar as numerosas cascatas que caem das bordas. No fim do verão, quando
      o nível desce, é o momento dos passeios entre poças e ribeiros.
    visit: >-
      O ponto de partida é Çorovodë, onde o rio entra na garganta. Daí, os passeios do fim do verão percorrem
      poças e ribeiros do desfiladeiro, um destino conhecido para caminhadas na natureza. A cinco quilómetros
      a nordeste de Çorovodë, o desfiladeiro de Gradec esconde Pirogosh, tida como a maior gruta da Albânia.
    history: >-
      Os habitantes guardam as suas lendas: a do Mulliri i Babait, a de Vrima e Nuses e a de Santo Abaz Ali. O
      Osum nasce perto de Vithkuq e mede 161 km; passa por Çorovodë, pelo desfiladeiro, por Poliçan e por
      Berat e, ao juntar-se ao Devoll perto de Kuçovë, forma o rio Seman. Como Monumento Natural, o
      desfiladeiro está protegido pelos seus valores geomorfológicos, científicos e estéticos.
    before: >-
      A melhor época é a primavera para as cascatas e para percorrer todo o desfiladeiro pelo rio, e o fim do
      verão para caminhares e tomares banho nas poças. Com a água baixa não se pode percorrer toda a garganta
      pelo leito.
    around: >-
      A oito quilómetros fica o [Canhão Termal do Rio Langarica](/lugar/kanioni-i-langarices/), outra garganta
      do sul da Albânia.
