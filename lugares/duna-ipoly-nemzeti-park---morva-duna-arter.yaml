unico:
  es: Tres paisajes en uno, el valle, la montaña y la llanura, con un río, el Ipoly, que sigue su propio humor.
  en: >-
    Three contrasting landscapes in one—river valley, volcanic hills, and open plain—anchored by the
    capricious, free-flowing Ipoly.
  fr: >-
    Trois paysages en un seul espace — vallée fluviale, reliefs volcaniques et plaine ouverte — rythmés par
    les caprices de l'Ipoly.
  de: >-
    Drei Landschaftstypen in einem Schutzgebiet – Flusstal, Mittelgebirge und Ebene – geprägt vom
    unberechenbaren Flusslauf des Ipoly.
  it: >-
    Tre paesaggi distinti in una sola area — valle fluviale, rilievi vulcanici e pianura aperta — governati
    dalle piene mutevoli dell'Ipoly.
  pt: >-
    Três paisagens num único espaço — vale fluvial, montanhas vulcânicas e planície aberta — moldadas pelo
    curso caprichoso do rio Ipoly.
