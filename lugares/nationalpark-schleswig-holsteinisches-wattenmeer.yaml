resumen:
  es: >-
    El mayor parque nacional de Europa central: llanuras de marea, islas-dique (Halligen) y millones de aves
    limícolas en paso.
  en: >-
    Central Europe's largest national park: intertidal mudflats, dyked islets (Halligen) and millions of
    migratory waders on passage.
  fr: >-
    Le plus grand parc national d'Europe centrale : vasières de marée, îlots-digues (Halligen) et millions
    d'échassiers en migration.
  de: >-
    Mitteleuropas größter Nationalpark: Wattflächen, Halligen und Millionen rastende Watvögel auf dem
    Ostatlantischen Zugweg.
  it: >-
    Il parco nazionale più vasto dell'Europa centrale: piane di marea, isolotti arginati (Halligen) e milioni
    di limicoli di passo.
  pt: >-
    O maior parque nacional da Europa Central: planícies de maré, ilhotas com diques (Halligen) e milhões de
    limícolas em passagem.
unico:
  es: >-
    Un parque donde caminas por el fondo del mar con un guía y, en sus aguas, vive la marsopa, el único
    cetáceo autóctono del lugar.
  en: >-
    Dynamic mudflats and undyked Halligen where the North Sea reclaims and redraws the land with every single
    tide.
  fr: Vasières dynamiques et îlots Halligen non endigués où la mer du Nord remodèle le paysage à chaque marée.
  de: Dynamische Gezeitenwatten und unbedeichte Halligen, wo die Nordsee das Land mit jeder Flut neu formt.
  it: Piane tidali dinamiche e Halligen senza dighe dove il Mare del Nord rimodella il territorio a ogni marea.
  pt: >-
    Planícies de maré dinâmicas e ilhotas Halligen não protegidas por diques onde o mar do Norte remodela o
    terreno a cada maré.
observaciones:
  es: >-
    El Stockenstieg cierra de octubre a mayo. Cuando abre, se recorre solo a pie del faro al dique sin pisar
    los bordes.


    Los guías del parque conocen el tiempo y las mareas y deciden si una caminata debe suspenderse por un
    cambio brusco de tiempo. El tiempo puede cambiar rápido: ve con gorra y protector solar y lleva agua,
    porque el viento fresco disimula el sol fuerte.
texto:
  es:
    intro: >-
      Aquí el mapa se mueve dos veces al día. Cuando el agua se va, la costa de Schleswig-Holstein se
      convierte en una llanura de fango y arena que vuelve a inundarse con la pleamar. El Parque Nacional del
      Mar de Frisia de Schleswig-Holstein es el mayor de Alemania y el mayor entre el Cabo Norte y Sicilia:
      4.380 km² de costa del mar del Norte, desde la desembocadura del Elba hasta la frontera danesa. Se fundó
      el 1 de octubre de 1985 con la ley de parques nacionales del 22 de julio de 1985, y en Frisia del Norte
      las llanuras de marea alcanzan en algunos puntos 40 km de anchura.
    landscape: >-
      Todo empezó con el hielo. El mar de Frisia nació tras la última glaciación, hace 10.000 años: al
      fundirse los glaciares subió el nivel del agua y los sedimentos orgánicos e inorgánicos se depositaron
      en la costa llana, formando la llanura de fango fino y la de arena más gruesa. Más de dos tercios del
      parque están cubiertos permanentemente de agua, y alrededor del 30 % es llanura que queda seca con la
      bajamar. La marea sube y baja entre 1,5 m y 3,7 m, y esa diferencia aumenta de norte a sur.


      Dentro de ese mar hay tierra. Las islas de la Frisia del Norte se formaron sobre todo con trozos de
      continente que quedaron separados por inundaciones. Sylt, Amrum, Föhr, Pellworm y las cinco Halligen
      mayores quedan fuera del parque, igual que los diques; dentro hay islas e islotes deshabitados como
      Trischen y Blauort. Aun así viven personas dentro: una familia en la Hallig Süderoog todo el año, otra
      en verano en la Hallig Südfall y un vigilante de aves en la isla Trischen.
    wildlife: >-
      El mar de Frisia es el área con más aves de Europa central y una escala de la ruta migratoria del
      Atlántico oriental. Por el conjunto transfronterizo del mar de Frisia pasan de media entre 10 y 12
      millones de aves al año; Schleswig-Holstein es uno de sus sectores de descanso y cría. Los pájaros
      pequeños, como la collalba gris, también encuentran aquí un hábitat importante. Entre los patos destaca
      el [tarro blanco](/especie/tadorna_tadorna/).


      En el agua, las [focas comunes](/especie/phoca_vitulina/) y las [focas
      grises](/especie/halichoerus_grypus/) necesitan los bancos de arena para descansar y criar, y la
      [marsopa](/especie/phocoena_phocoena/) es el único cetáceo autóctono. Al oeste de Sylt hay una zona de
      protección de cetáceos pequeños y aves marinas, una zona de reproducción importante de la marsopa, cuya
      población bajó cerca de un 90 % en el mar del Norte en el siglo XX. En el parque abundan también las
      praderas de zostera.


      En los hábitats del parque hay unas 3.200 especies de animales, y unas 250 solo viven en las marismas
      saladas. En el conjunto de las marismas del Patrimonio Mundial hay unas 1.800 especies de arañas e
      insectos, entre ellas especialistas de ese hábitat. Se han contado 63 especies de peces, y el mar de
      Frisia es la guardería de la solla, el arenque y el lenguado del mar del Norte.
    visit: >-
      Empieza por el Multimar Wattforum de Tönning, el mayor centro de información del parque en
      Schleswig-Holstein, a orillas del Eider. Su exposición tiene un esqueleto de cachalote de 17,50 m y 37
      acuarios con 280 especies del mar del Norte, y en el exterior se pueden ver
      [nutrias](/especie/lutra_lutra/) con algo de suerte. En total hay unas 20 casas con puntos de
      información, y se hacen más de 5.000 excursiones de naturaleza al año.


      Para caminar, en Schleswig-Holstein se puede pasear largo por los diques, las marismas y las playas del
      continente, las islas y las Halligen. Se permiten algunas rutas para excursiones guiadas a pie por las
      llanuras de marea. También se puede ir por libre cerca de la costa, pero hay que vigilar con cuidado las
      horas de marea. En bici hay caminos firmes junto a los diques, a la Hamburger Hallig y al faro de
      Westerhever; el histórico Stockenstieg de Westerhever tiene un acceso peatonal regulado. Desde muchos
      puertos salen excursiones en barco para observar fauna, siempre en coordinación con la administración
      del parque.
    history: >-
      El parlamento de Schleswig-Holstein lo fundó en 1985; la nueva ley se aprobó en 1999 y entró en vigor en
      enero de 2000. Desde 1990 es reserva de la biosfera de la UNESCO, incluidas las Halligen de Frisia del
      Norte, y desde 2009 es Patrimonio Mundial junto a otras zonas del Wadden alemán y neerlandés; desde
      junio de 2014, todo el mar de Frisia del mar del Norte lo es. La zona 1 se reserva a la evolución sin
      molestias de la naturaleza y no se puede pisar, salvo cerca de la costa y en las rutas de llanura
      guiadas. El Nutzungsfreies Gebiet, de 125 km² entre Sylt y Föhr, debe quedar totalmente intacto.
    before: >-
      El Stockenstieg cierra de octubre a mayo. Cuando abre, se recorre solo a pie del faro al dique sin pisar
      los bordes.


      Los guías del parque conocen el tiempo y las mareas y deciden si una caminata debe suspenderse por un
      cambio brusco de tiempo. El tiempo puede cambiar rápido: ve con gorra y protector solar y lleva agua,
      porque el viento fresco disimula el sol fuerte.
    around: >-
      Al norte continúa el mismo sistema costero en el [Parque Nacional del Mar de Wadden
      (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/), y otro sector alemán es el [Parque Nacional
      del Mar de Frisia de Baja Sajonia](/lugar/nationalpark-niedersachsisches-wattenmeer/).


      Más lejos, las [Marismas Saladas del Mar de Frisia (Sector
      Neerlandés)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) comparten con él la foca común, la
      marsopa y el correlimos gordo; el [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/), la
      marsopa, el correlimos gordo y el tarro blanco; y [Great Blasket Island / An Blascaod
      Mór](/lugar/great-blasket-island/), la marsopa y la foca gris.
  en:
    intro: >-
      Here the map redraws itself twice a day. When the sea recedes, the coastline of Schleswig-Holstein turns
      into an expanse of mud and sand that floods anew with every high tide. The Schleswig-Holstein Wadden Sea
      National Park is Germany's largest, and the largest between the North Cape and Sicily: 4,380 km² of
      North Sea coast, stretching from the mouth of the Elbe to the Danish border. It was founded on 1 October
      1985 by the national parks act of 22 July 1985, and in North Frisia the tidal mudflats reach widths of
      up to 40 km in places.
    landscape: >-
      It all began with the ice. The Wadden Sea formed after the last ice age, 10,000 years ago: as glaciers
      melted, sea levels rose and organic and inorganic sediments settled along the shallow coast, shaping
      fine mudflats and coarser sand flats. More than two-thirds of the park remain permanently submerged
      beneath water, while roughly 30% consists of tidal flats exposed at low tide. The tide rises and falls
      between 1.5 m and 3.7 m, and that tidal range increases from north to south.


      Within this sea lies land. The North Frisian Islands were formed primarily from fragments of the
      mainland severed by storm surges. Sylt, Amrum, Föhr, Pellworm and the five largest Halligen lie outside
      the park boundary, as do sea dykes; within the park lie uninhabited islands and islets such as Trischen
      and Blauort. Even so, people reside within the park: one family lives on Hallig Süderoog year-round,
      another stays in summer on Hallig Südfall, and a bird warden watches over Trischen island.
    wildlife: >-
      The Wadden Sea is Central Europe's most bird-rich area and a vital staging post along the East Atlantic
      Flyway. Across the transboundary Wadden Sea system, an average of 10 to 12 million birds pass through
      each year; Schleswig-Holstein is one of their prime resting and breeding sectors. Small passerines, such
      as the northern wheatear, also find crucial habitat here. Among ducks, the [common
      shelduck](/especie/tadorna_tadorna/) stands out prominently.


      In the water, [common seals](/especie/phoca_vitulina/) and [grey seals](/especie/halichoerus_grypus/)
      rely on sandbanks to rest and pup, while the [harbour porpoise](/especie/phocoena_phocoena/) is the only
      native cetacean. West of Sylt lies a designated whale and seabird sanctuary, a critical breeding area
      for the harbour porpoise, whose population plummeted by around 90% in the North Sea during the twentieth
      century. Dense seagrass meadows also thrive across the park.


      Across the park's habitats live some 3,200 animal species, and about 250 reside exclusively in salt
      marshes. Across the World Heritage salt marshes as a whole, some 1,800 species of spiders and insects
      occur, including habitat specialists. Scientists have recorded 63 fish species, and the Wadden Sea
      functions as a vital nursery for North Sea plaice, herring and sole.
    visit: >-
      Begin at the Multimar Wattforum in Tönning, the park's largest information centre in Schleswig-Holstein,
      set beside the river Eider. Its exhibition features a 17.50 m sperm whale skeleton and 37 aquariums
      displaying 280 North Sea species, while outside you might spot [Eurasian otters](/especie/lutra_lutra/)
      with a little luck. In total there are around 20 information centres, and more than 5,000 nature
      excursions are conducted each year.


      For walking, Schleswig-Holstein offers long strolls along dykes, salt marshes and beaches on the
      mainland, islands and Halligen. Permitted routes are designated for guided mudflat walks. You can also
      walk independently near the shore, but you must monitor tidal schedules with extreme care. For cycling,
      well-paved tracks run beside dykes, out to the Hamburger Hallig and toward the Westerhever lighthouse;
      the historic Stockenstieg at Westerhever has strictly regulated pedestrian access. Boat excursions
      depart from many harbours to observe marine wildlife, always operated in close coordination with park
      management.
    history: >-
      The Schleswig-Holstein state parliament founded the park in 1985; a reformed statute was passed in 1999
      and took effect in January 2000. It has been a UNESCO biosphere reserve since 1990, including the North
      Frisian Halligen, and since 2009 a World Heritage site alongside other German and Dutch Wadden sectors;
      since June 2014, the entire North Sea Wadden Sea has shared that inscription. Zone 1 is dedicated to the
      undisturbed natural evolution of nature and cannot be entered, except near the coastline and along
      authorized guided mudflat routes. The Nutzungsfreies Gebiet, covering 125 km² between Sylt and Föhr,
      remains completely untrodden.
    before: >-
      The Stockenstieg closes from October to May. When open, it must be walked strictly on foot between the
      lighthouse and dyke without stepping off the edges.


      Park guides understand weather and tides and determine whether a walk must be cancelled due to sudden
      weather shifts. Weather can change swiftly: bring a sun hat and sunscreen and carry drinking water, as
      brisk sea breezes mask the strength of the sun.
    around: >-
      To the north, the same coastal system continues into [Wadden Sea National Park
      (Denmark)](/lugar/wadden-sea-national-park-dinamarca/), while another German sector is the [Lower Saxony
      Wadden Sea National Park](/lugar/nationalpark-niedersachsisches-wattenmeer/).


      Further away, the [Wadden Sea Salt Marshes (Dutch
      Sector)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) share the common seal, harbour porpoise
      and red knot; [Słowiński National Park](/lugar/slowinski-park-narodowy/) shares the harbour porpoise,
      red knot and common shelduck; and [Great Blasket Island / An Blascaod Mór](/lugar/great-blasket-island/)
      shares the harbour porpoise and grey seal.
  fr:
    intro: >-
      Ici, la carte géographique se redessine deux fois par jour. Quand la mer se retire, le littoral du
      Schleswig-Holstein se transforme en une immense plaine de vase et de sable qui s'inonde à nouveau à
      marée haute. Le parc national de la mer des Wadden de Schleswig-Holstein est le plus vaste d'Allemagne
      et le plus grand entre le cap Nord et la Sicile : 4 380 km² de côte en mer du Nord, de l'embouchure de
      l'Elbe jusqu'à la frontière danoise. Il a été créé le 1 octobre 1985 par la loi sur les parcs nationaux
      du 22 juillet 1985, et en Frise du Nord les vasières découvrantes atteignent par endroits 40 km de
      largeur.
    landscape: >-
      Tout a commencé avec les glaces. La mer des Wadden est née après la dernière glaciation, il y a 10 000
      ans : la fonte des glaciers a fait monter le niveau marin et les sédiments fins ou grossiers se sont
      déposés sur la côte basse, sculptant vasières et bancs de sable. Plus des deux tiers du parc demeurent
      recouverts en permanence par les eaux, et près de 30 % forment un estran découvert à basse mer. Le
      marnage oscille entre 1,5 m et 3,7 m, s'accentuant du nord vers le sud.


      Au cœur de ces flots émerge la terre. Les îles de la Frise du Nord sont nées de lambeaux continentaux
      détachés par les raz-de-marée. Sylt, Amrum, Föhr, Pellworm et les cinq grandes Halligen restent en
      dehors du parc, tout comme les digues littorales ; à l'intérieur s'étendent des îles inhabitées comme
      Trischen et Blauort. Pour autant des hommes y vivent : une famille réside à l'année sur la Hallig
      Süderoog, une autre passe l'été sur la Hallig Südfall, et un garde d'oiseaux veille sur l'île de
      Trischen.
    wildlife: >-
      La mer des Wadden est le site le plus riche en avifaune d'Europe centrale et une escale vitale sur la
      voie migratoire de l'Atlantique oriental. À l'échelle de l'écosystème transfrontalier des Wadden, ce
      sont en moyenne 10 à 12 millions d'oiseaux qui transitent chaque année ; le Schleswig-Holstein constitue
      l'un de leurs principaux secteurs de repos et de reproduction. De petits passereaux, tel le traquet
      motteux, y trouvent également un habitat de premier ordre. Parmi les anatidés, le [tadorne de
      Belon](/especie/tadorna_tadorna/) se distingue tout particulièrement.


      Dans les eaux, les [phoques communs](/especie/phoca_vitulina/) et les [phoques
      gris](/especie/halichoerus_grypus/) ont impérativement besoin des bancs de sable pour se reposer et
      élever leurs petits, tandis que le [marsouin commun](/especie/phocoena_phocoena/) est le seul cétacé
      indigène. À l'ouest de Sylt s'étend une zone de protection des cétacés et oiseaux marins, aire de
      reproduction essentielle pour le marsouin, dont la population a chuté de près de 90 % en mer du Nord au
      cours du XXe siècle. Les herbiers de zostères abondent également dans le parc.


      Les milieux du parc hébergent environ 3 200 espèces animales, dont 250 sont inféodées aux seuls prés
      salés. Au sein des marais salés du patrimoine mondial, on compte environ 1 800 espèces d'araignées et
      d'insectes spécialisés. Pas moins de 63 espèces de poissons y ont été dénombrées, la mer des Wadden
      faisant office de nourricerie pour la plie, le hareng et la sole de mer du Nord.
    visit: >-
      Commencez par le Multimar Wattforum de Tönning, le plus grand centre d'interprétation du parc dans le
      Schleswig-Holstein, sur les rives de l'Eider. Sa scénographie expose un squelette de cachalot de 17,50 m
      et 37 aquariums abritant 280 espèces marines, et en extérieur on peut observer des [loutres
      d'Europe](/especie/lutra_lutra/) avec un peu de chance. Au total, environ 20 maisons d'information
      accueillent le public, et plus de 5 000 excursions nature sont organisées chaque année.


      Pour la marche, le Schleswig-Holstein permet de longues promenades sur les digues, les prés salés et les
      plages du continent, des îles et des Halligen. Des itinéraires précis sont balisés pour les traversées
      guidées à pied sur l'estran. On peut aussi cheminer librement près du rivage, en surveillant
      scrupuleusement les horaires de marée. À vélo, de bons chemins longent les digues vers la Hamburger
      Hallig et le phare de Westerhever ; l'historique Stockenstieg de Westerhever est soumis à un accès
      pédestre réglementé. Depuis de nombreux ports partent des sorties en mer pour observer la faune,
      toujours coordonnées avec la direction du parc.
    history: >-
      Le parlement du Schleswig-Holstein a créé le parc en 1985 ; la nouvelle loi votée en 1999 est entrée en
      vigueur en janvier 2000. Réserve de biosphère de l'UNESCO depuis 1990, incluant les Halligen de Frise du
      Nord, le parc est classé au patrimoine mondial depuis 2009 avec d'autres portions allemandes et
      néerlandaises ; depuis juin 2014, toute la mer des Wadden de la mer du Nord partage ce label. La zone 1
      est dédiée à la libre évolution de la nature sans perturbation et ne peut être foulée, sauf le long du
      rivage et sur les circuits guidés d'estran. La réserve intégrale Nutzungsfreies Gebiet, couvrant 125 km²
      entre Sylt et Föhr, demeure strictement intouchée.
    before: >-
      Le sentier Stockenstieg est fermé d'octobre à mai. Lorsqu'il est ouvert, on le parcourt exclusivement à
      pied du phare à la digue sans poser le pied hors du platelage.


      Les guides du parc connaissent parfaitement la météo et les marées et décident si une sortie doit être
      annulée en cas de dégradation soudaine. Le temps change vite : munissez-vous d'un chapeau, d'une crème
      solaire et d'eau, car la brise marine masque l'ardeur du soleil.
    around: >-
      Au nord, le même complexe côtier se prolonge dans le [Parc national de la mer des Wadden
      (Danemark)](/lugar/wadden-sea-national-park-dinamarca/), et un autre secteur allemand est le [Parc
      national de la mer des Wadden de Basse-Saxe](/lugar/nationalpark-niedersachsisches-wattenmeer/).


      Plus loin, les [Marais salés de la mer des Wadden (secteur
      néerlandais)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) partagent le phoque commun, le
      marsouin commun et le bécasseau maubèche ; le [Parc national de
      Słowiński](/lugar/slowinski-park-narodowy/) réunit le marsouin commun, le bécasseau maubèche et le
      tadorne de Belon ; et [Great Blasket Island / An Blascaod Mór](/lugar/great-blasket-island/) accueille
      le marsouin commun et le phoque gris.
  de:
    intro: >-
      Hier zeichnet sich die Landkarte zweimal täglich neu. Weicht das Wasser zurück, verwandelt sich die
      Küste Schleswig-Holsteins in eine weite Schlick- und Sandlandschaft, die bei Flut erneut überflutet
      wird. Der Nationalpark Schleswig-Holsteinisches Wattenmeer ist der größte Deutschlands und der größte
      zwischen Nordkap und Sizilien: 4.380 km² Nordseeküste von der Elbmündung bis zur dänischen Grenze. Er
      wurde am 1. Oktober 1985 mit dem Nationalparkgesetz vom 22. Juli 1985 gegründet; in Nordfriesland
      erreichen die Wattflächen an manchen Stellen 40 km Breite.
    landscape: >-
      Alles begann mit dem Eis. Das Wattenmeer entstand nach der letzten Kaltzeit vor 10.000 Jahren:
      Schmelzende Gletscher ließen den Meeresspiegel steigen, und mineralische sowie organische Sedimente
      lagerten sich an der Flachküste ab – so bildeten sich Schlick- und Sandwatten. Mehr als zwei Drittel der
      Parkfläche sind dauerhaft von Wasser bedeckt, und rund 30 % fallen bei Ebbe trocken. Der Tidenhub
      schwankt zwischen 1,5 m und 3,7 m und nimmt von Norden nach Süden zu.


      Mitten in diesem Meer liegt festes Land. Die Nordfriesischen Inseln entstanden überwiegend aus
      Festlandsresten, die durch verheerende Sturmfluten abgetrennt wurden. Sylt, Amrum, Föhr, Pellworm und
      die fünf großen Halligen liegen außerhalb des Nationalparks, ebenso wie die Deiche; im Park liegen
      unbewohnte Inseln und Sände wie Trischen und Blauort. Dennoch leben Menschen im Gebiet: eine Familie
      ganzjährig auf der Hallig Süderoog, eine weitere im Sommer auf Südfall sowie ein Vogelwart auf Trischen.
    wildlife: >-
      Das Wattenmeer ist das vogelreichste Gebiet Mitteleuropas und Drehscheibe des Ostatlantischen Vogelzugs.
      Durch das trinationale Wattenmeer ziehen jährlich im Schnitt 10 bis 12 Millionen Vögel;
      Schleswig-Holstein ist einer ihrer zentralen Rast- und Mauserplätze. Auch Kleinvögel wie der
      Steinschmätzer finden hier wertvolle Rastbiotope. Unter den Entenvögeln sticht die
      [Brandgans](/especie/tadorna_tadorna/) hervor.


      Im Wasser sind [Seehunde](/especie/phoca_vitulina/) und [Kegelrobben](/especie/halichoerus_grypus/) auf
      Sandbänke angewiesen, um zu ruhen und Junge zu säugen; der [Gewöhnliche
      Schweinswal](/especie/phocoena_phocoena/) ist die einzige heimische Walart. Westlich von Sylt liegt ein
      Schutzgebiet für Kleinwale und Seevögel, ein zentrales Fortpflanzungsgebiet des Schweinswals, dessen
      Bestand in der Nordsee im zwanzigsten Jahrhundert um rund 90 % einbrach. Auch ausgedehnte Seegraswiesen
      gedeihen im Park.


      In den Lebensräumen leben rund 3.200 Tierarten, davon etwa 250 ausschließlich auf Salzwiesen. Auf den
      Salzwiesen des Weltnaturerbes kommen rund 1.800 Spinnen- und Insektenarten vor. Bisher wurden 63
      Fischarten gezählt; das Wattenmeer dient Scholle, Hering und Seezunge der Nordsee als Kinderstube.
    visit: >-
      Beginne deinen Besuch im Multimar Wattforum in Tönning an der Eider, dem größten Nationalpark-Zentrum in
      Schleswig-Holstein. Die Ausstellung zeigt ein 17,50 m langes Pottwalskelett und 37 Aquarien mit 280
      Nordseearten; im Außengehege lassen sich mit etwas Glück [Eurasische Fischotter](/especie/lutra_lutra/)
      beobachten. Insgesamt gibt es rund 20 Informationsstellen, und jährlich werden über 5.000 naturkundliche
      Führungen angeboten.


      Zum Wandern laden Deiche, Salzwiesen und Strände des Festlands, der Inseln und Halligen ein.
      Ausgewiesene Routen erlauben geführte Wattwanderungen. In Küstennähe kannst du auch auf eigene Faust
      wandern, musst jedoch die Gezeitenzeiten stets strikt beachten. Radfahrer finden befestigte Deichwege
      zur Hamburger Hallig und zum Leuchtturm Westerheversand; der historische Stockenstieg in Westerhever
      unterliegt einer Besucherlenkung. Von vielen Häfen legen Ausflugsschiffe zur Tierbeobachtung ab, stets
      in Absprache mit der Nationalparkverwaltung.
    history: >-
      Der Schleswig-Holsteinische Landtag gründete den Park 1985; das neue Gesetz wurde 1999 beschlossen und
      trat im Januar 2000 in Kraft. Seit 1990 ist das Gebiet einschließlich der nordfriesischen Halligen
      UNESCO-Biosphärenreservat, seit 2009 zusammen mit niederländischen und niedersächsischen Teilen
      Weltnaturerbe; seit Juni 2014 ist das gesamte Nordseewattenmeer Welterbe. Die Zone 1 dient der
      ungestörten Naturdynamik und darf nicht betreten werden, ausgenommen Uferbereiche und geführte
      Wattrouten. Das 125 km² große Nutzungsfreie Gebiet zwischen Sylt und Föhr bleibt gänzlich unberührt.
    before: >-
      Der Stockenstieg ist von Oktober bis Mai gesperrt. Im Sommer darf er nur zu Fuß vom Leuchtturm zum Deich
      begangen werden, ohne die Bohlenwege zu verlassen.


      Die Nationalpark-Wattführer kennen Wetter und Gezeiten und brechen Touren bei Wetterumschwüngen
      rechtzeitig ab. Das Wetter schlägt schnell um: Nimm Kopfbedeckung, Sonnencreme und Trinkwasser mit, da
      der kühle Seewind die Sonnenstrahlung trügerisch mildert.
    around: >-
      Nördlich setzt sich das Küstensystem im [Nationalpark Wattenmeer
      (Dänemark)](/lugar/wadden-sea-national-park-dinamarca/) fort, südlich schließt der [Nationalpark
      Niedersächsisches Wattenmeer](/lugar/nationalpark-niedersachsisches-wattenmeer/) an.


      Weiter entfernt teilen die [Wattenmeer-Salzwiesen (Niederländischer
      Sektor)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) Seehund, Schweinswal und Knutt; der
      [Slowinzische Nationalpark](/lugar/slowinski-park-narodowy/) Schweinswal, Knutt und Brandgans; und
      [Great Blasket Island / An Blascaod Mór](/lugar/great-blasket-island/) Schweinswal und Kegelrobbe.
  it:
    intro: >-
      Qui la mappa geografica si ridisegna due volte al giorno. Quando le acque si ritirano, la costa dello
      Schleswig-Holstein si tramuta in una sterminata piana di fango e sabbia che torna a sommergersi con
      l'alta marea. Il Parco Nazionale del Mar dei Wadden dello Schleswig-Holstein è il maggiore della
      Germania e il più grande tra Capo Nord e la Sicilia: 4.380 km² di litorale del Mare del Nord, dalla foce
      dell'Elba fino al confine danese. È stato istituito il 1 ottobre 1985 con la legge sui parchi nazionali
      del 22 luglio 1985, e nella Frisia Settentrionale le piane di marea raggiungono in alcuni tratti 40 km
      di larghezza.
    landscape: >-
      Tutto è iniziato con il ghiaccio. Il Mar dei Wadden si è formato dopo l'ultima glaciazione, 10.000 anni
      fa: lo scioglimento dei ghiacciai innalzò il livello marino e sedimenti fini e sabbiosi si depositarono
      lungo la costa bassa, forgiando piane di fango e banchi di sabbia. Più di due terzi del parco rimangono
      perennemente sommersi dalle acque, mentre circa il 30% è costituito da piane tidali che emergono con la
      bassa marea. L'escursione di marea oscilla tra 1,5 m e 3,7 m, aumentando da nord a sud.


      Nel cuore di queste acque sorge la terraferma. Le Isole Frisone Settentrionali si sono originate da
      frammenti continentali staccati dalle grandi mareggiate storiche. Sylt, Amrum, Föhr, Pellworm e le
      cinque maggiori Halligen sorgono all'esterno del parco, così come le grandi dighe; all'interno si
      trovano isole disabitate come Trischen e Blauort. Ciononostante vi risiedono alcune persone: una
      famiglia vive tutto l'anno sulla Hallig Süderoog, un'altra trascorre l'estate sulla Hallig Südfall e un
      guardiano ornitologico vigila sull'isola di Trischen.
    wildlife: >-
      Il Mar dei Wadden è la zona più ricca di avifauna dell'Europa centrale e uno snodo primario della rotta
      migratoria dell'Atlantico orientale. Attraverso l'intero bacino transfrontaliero dei Wadden transitano
      ogni anno in media da 10 a 12 milioni di uccelli; lo Schleswig-Holstein è uno dei loro cardini per la
      sosta e la riproduzione. Anche piccoli passeriformi, come il culbianco, trovano qui un habitat
      fondamentale. Tra le anatre si distingue la [volpoca](/especie/tadorna_tadorna/).


      Nelle acque, la [foca comune](/especie/phoca_vitulina/) e la [foca grigia](/especie/halichoerus_grypus/)
      necessitano dei banchi di sabbia per riposare e allattare i piccoli, mentre la [focena
      comune](/especie/phocoena_phocoena/) è l'unico cetaceo indigeno. A ovest di Sylt si estende un'area di
      tutela per piccoli cetacei e uccelli marini, essenziale per la riproduzione della focena, la cui
      consistenza si era ridotta di circa il 90% nel Mare del Nord durante il XX secolo. Nel parco prosperano
      anche vaste praterie di zostera.


      Negli ambienti protetti vivono circa 3.200 specie animali, di cui circa 250 vincolate alle sole barene
      salmastre. Nel complesso delle barene del Patrimonio Mondiale si contano circa 1.800 specie di ragni e
      insetti altamente specializzati. Sono state censite 63 specie ittiche, e il Mar dei Wadden funge da
      fondamentale nursery per passera pianuzza, aringa e sogliola del Mare del Nord.
    visit: >-
      Comincia dal Multimar Wattforum di Tönning, il centro visite principale del parco nello
      Schleswig-Holstein, sulle sponde dell'Eider. La mostra ospita uno scheletro di capodoglio lungo 17,50 m
      e 37 vasche d'acquario con 280 specie del Mare del Nord, mentre all'esterno si possono avvistare con un
      po' di fortuna le [lontre europee](/especie/lutra_lutra/). In totale sono attivi circa 20 punti
      informativi, e ogni anno si svolgono oltre 5.000 escursioni naturalistiche guidate.


      Per camminare, lo Schleswig-Holstein offre passeggiate lungo argini, barene e lidi della terraferma,
      delle isole e delle Halligen. Sono autorizzati tracciati specifici per escursioni guidate a piedi sulla
      piana di marea. È possibile camminare in autonomia vicino alla riva, controllando con scrupolo gli orari
      delle maree. In bici si percorrono piste pavimentate lungo le dighe verso l'Hamburger Hallig e il faro
      di Westerhever; lo storico Stockenstieg di Westerhever è regolato per l'accesso a piedi. Da molti porti
      salpano battelli per l'osservazione faunistica, sempre coordinati con l'ente parco.
    history: >-
      Il parlamento dello Schleswig-Holstein ha istituito il parco nel 1985; la nuova legge è stata varata nel
      1999 ed è entrata in vigore nel gennaio 2000. Dal 1990 è riserva della biosfera UNESCO comprese le
      Halligen, e dal 2009 è Patrimonio Mondiale assieme ai settori olandese e della Bassa Sassonia; dal
      giugno 2014 l'intero Mar dei Wadden del Mare del Nord gode di questo riconoscimento. La zona 1 è
      destinata all'evoluzione indisturbata della natura ed è inaccessibile, salvo lungo riva e sui percorsi
      tidali guidati. L'area Nutzungsfreies Gebiet, estesa su 125 km² tra Sylt e Föhr, deve rimanere
      totalmente intatta.
    before: >-
      Lo Stockenstieg è chiuso da ottobre a maggio. Quando è accessibile si percorre unicamente a piedi dal
      faro all'argine senza scendere dai pontili lignei.


      Le guide del parco conoscono le condizioni meteorologiche e le maree e dispongono l'interruzione
      dell'escursione in caso di repentino peggioramento del tempo. Il meteo muta in fretta: porta copricapo,
      protezione solare e scorta d'acqua, poiché il vento fresco attenua la percezione del sole battente.
    around: >-
      A nord il medesimo arco costiero prosegue nel [Parco Nazionale del Mar dei Wadden
      (Danimarca)](/lugar/wadden-sea-national-park-dinamarca/), e un altro settore tedesco è il [Parco
      Nazionale del Mar dei Wadden della Bassa Sassonia](/lugar/nationalpark-niedersachsisches-wattenmeer/).


      Più lontano, le [Barene del Mar dei Wadden (settore
      olandese)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) condividono la foca comune, la focena
      comune e il piovanello maggiore; il [Parco Nazionale Słowiński](/lugar/slowinski-park-narodowy/)
      accoglie la focena comune, il piovanello maggiore e la volpoca; e [Great Blasket Island / An Blascaod
      Mór](/lugar/great-blasket-island/) ospita la focena comune e la foca grigia.
  pt:
    intro: >-
      Aqui o mapa desenha-se de novo duas vezes por dia. Quando as águas recuam, o litoral de
      Schleswig-Holstein transforma-se numa planície de vasa e areia que volta a submergir na preia-mar. O
      Parque Nacional do Mar de Wadden de Schleswig-Holstein é o maior da Alemanha e o mais vasto entre o Cabo
      Norte e a Sicília: 4.380 km² de costa do mar do Norte, desde a foz do Elba até à fronteira dinamarquesa.
      Foi fundado a 1 de outubro de 1985 pela lei de parques nacionais de 22 de julho de 1985, e na Frísia do
      Norte as planícies de maré atingem por vezes 40 km de largura.
    landscape: >-
      Tudo começou com o gelo. O mar de Wadden surgiu após a última glaciação, há 10.000 anos: o degelo fez
      subir o nível do mar e os sedimentos finos e grosseiros depositaram-se na costa baixa, criando lodaçais
      e bancos arenosos. Mais de dois terços do parque encontram-se permanentemente cobertos por água, e cerca
      de 30% correspondem a planícies de maré expostas na baixa-mar. A amplitude de maré oscila entre 1,5 m e
      3,7 m, aumentando de norte para sul.


      No meio das águas ergue-se terra firme. As ilhas da Frísia do Norte formaram-se a partir de fragmentos
      continentais separados por galgamentos e tempestades violentas. Sylt, Amrum, Föhr, Pellworm e as cinco
      grandes Halligen ficam fora do parque, bem como os diques de proteção; no interior situam-se ilhas e
      restingas desabitadas como Trischen e Blauort. Ainda assim vivem pessoas na área: uma família reside o
      ano inteiro na Hallig Süderoog, outra passa o verão na Hallig Südfall e um guarda de aves vigia a ilha
      de Trischen.
    wildlife: >-
      O mar de Wadden é a região com maior concentração de aves da Europa Central e uma escala decisiva na
      rota migratória do Atlântico Oriental. Pelo conjunto transfronteiriço do mar de Wadden transitam em
      média entre 10 e 12 milhões de aves por ano; Schleswig-Holstein é um dos seus principais santuários de
      repouso e reprodução. Pequenos passeriformes, como o chasco-cinzento, encontram aqui habitats de
      refúgio. Entre os patos evidencia-se o [pato-branco](/especie/tadorna_tadorna/).


      Nas águas marinhas, a [foca-comum](/especie/phoca_vitulina/) e a
      [foca-cinzenta](/especie/halichoerus_grypus/) necessitam dos bancos de areia para descansar e amamentar
      as crias, enquanto a [toninha-comum](/especie/phocoena_phocoena/) é o único cetáceo autóctone. A oeste
      de Sylt situa-se uma zona de proteção de cetáceos e aves marinhas, área de reprodução vital para a
      toninha-comum, cuja população colapsou cerca de 90% no mar do Norte durante o século XX. No parque
      abundam igualmente os prados submarinos de zostera.


      Nos habitats do parque contam-se cerca de 3.200 espécies de animais, das quais cerca de 250 habitam
      exclusivamente os sapais. No conjunto dos sapais do Património Mundial ocorrem cerca de 1.800 espécies
      de aranhas e insetos especialistas deste meio. Foram recenseadas 63 espécies de peixes, sendo o mar de
      Wadden a maternidade da solha, do arenque e do linguado do mar do Norte.
    visit: >-
      Começa pelo Multimar Wattforum em Tönning, o maior centro interpretativo do parque em
      Schleswig-Holstein, nas margens do Eider. A sua exposição exibe um esqueleto de cachalote com 17,50 m e
      37 aquários com 280 espécies marinhas, e no exterior avistam-se
      [lontras-europeias](/especie/lutra_lutra/) com um pouco de sorte. No total funcionam cerca de 20 postos
      informativos, realizando-se mais de 5.000 passeios guiados por ano.


      Para caminhar, Schleswig-Holstein proporciona longos passeios nos diques, sapais e praias do continente,
      das ilhas e das Halligen. Existem percursos autorizados para caminhadas guiadas a pé pelos lodaçais de
      maré. Podes também passear autonomamente junto à costa, mas vigiando sempre as horas da maré. Em
      bicicleta há percursos pavimentados junto aos diques, até à Hamburger Hallig e ao farol de Westerhever;
      o histórico passadiço Stockenstieg de Westerhever possui acesso pedonal regulado. De vários portos
      partem passeios de barco para observação de fauna, sempre em articulação com a gestão do parque.
    history: >-
      O parlamento de Schleswig-Holstein criou o parque em 1985; a lei revista foi aprovada em 1999 e entrou
      em vigor em janeiro de 2000. Desde 1990 é reserva da biosfera da UNESCO, integrando as Halligen da
      Frísia do Norte, e desde 2009 é Património Mundial com outros setores alemães e neerlandeses; desde
      junho de 2014, todo o mar de Wadden do mar do Norte detém esse estatuto. A zona 1 destina-se à livre
      dinâmica da natureza sem perturbações e não pode ser pisada, salvo junto ao litoral e nas rotas guiadas
      de maré. O setor Nutzungsfreies Gebiet, com 125 km² entre Sylt e Föhr, deve permanecer totalmente
      intacto.
    before: >-
      O trilho Stockenstieg encerra de outubro a maio. Quando está aberto, percorre-se exclusivamente a pé
      entre o farol e o dique sem sair do estrado de madeira.


      Os guias do parque conhecem a fundo as marés e o estado do tempo, decidindo pela suspensão da atividade
      perante mudanças atmosféricas bruscas. O tempo muda com rapidez: leva chapéu, protetor solar e água,
      pois a brisa marítima fresca disfarça a intensidade do sol.
    around: >-
      Para norte, o mesmo complexo litoral continua no [Parque Nacional do Mar de Wadden
      (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/), e outro setor alemão é o [Parque Nacional do
      Mar de Wadden da Baixa Saxónia](/lugar/nationalpark-niedersachsisches-wattenmeer/).


      Mais longe, os [Sapais do Mar de Wadden (Setor
      Neerlandês)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) partilham a foca-comum, a
      toninha-comum e a seixoeira; o [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) partilha
      a toninha-comum, a seixoeira e o pato-branco; e [Great Blasket Island / An Blascaod
      Mór](/lugar/great-blasket-island/) partilha a toninha-comum e a foca-cinzenta.
