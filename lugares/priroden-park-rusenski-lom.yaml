    Cañón calizo serpenteante de meseta caliza que alberga las célebres Iglesias Rupestres de Ivanovo
    (Patrimonio Mundial UNESCO).
  en: >-
    A winding limestone canyon carved into the plateau, sheltering the celebrated Ivanovo Rock-Hewn Churches
    (UNESCO World Heritage).
  fr: >-
    Canyon calcaire sinueux de plateau calcaire abritant les célèbres Églises rupestres d'Ivanovo (Patrimoine
    mondial UNESCO).
  de: >-
    Gewundener Kalksteincanyon auf einer Hochebene, der die berühmten Felsenkirchen von Ivanovo
    (UNESCO-Welterbe) birgt.
  it: >-
    Sinuoso canyon calcareo dell'altopiano che ospita le celebri Chiese rupestri di Ivanovo (Patrimonio
    mondiale UNESCO).
  pt: >-
    Desfiladeiro calcário sinuoso de planalto calcário que alberga as célebres Igrejas Rupestres de Ivanovo
    (Património Mundial UNESCO).
unico:
  es: >-
    Un cañón calizo con cientos de cuevas, más de 190 especies de aves y monasterios excavados en la roca por
    monjes medievales.
  en: >-
    A limestone canyon with hundreds of caves, over 190 bird species and medieval rock-cut monasteries
    excavated by monks of the Second Bulgarian Empire.
  fr: >-
    Un canyon calcaire parsemé de centaines de grottes, plus de 190 espèces d'oiseaux et des monastères
    médiévaux taillés dans la roche vive par les moines du Second Empire bulgare.
  de: >-
    Ein Kalksteincanyon mit Hunderten von Höhlen, über 190 Vogelarten und mittelalterlichen Felsenklöstern,
    die Mönche des Zweiten Bulgarischen Reiches in den Fels gehauen haben.
  it: >-
    Un canyon calcareo con centinaia di grotte, oltre 190 specie di uccelli e monasteri medievali scavati
    nella roccia viva dai monaci del Secondo Impero bulgaro.
  pt: >-
    Um desfiladeiro calcário com centenas de grutas, mais de 190 espécies de aves e mosteiros medievais
    escavados na rocha viva pelos monges do Segundo Império Búlgaro.
