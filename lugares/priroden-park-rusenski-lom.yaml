texto:
  es:
    intro: >-
      A pocos kilómetros de una ciudad ruidosa, un río ha tallado un cañón en la caliza y ha dejado un mundo
      aparte. El Parque Natural de Rusenski Lom está a veinte kilómetros de Ruse, en el norte de Bulgaria, y
      protege el cañón del Rusenski Lom, el último afluente importante del Danubio por la derecha, con los
      valles de sus afluentes Cherni Lom, Beli Lom y Mali Lom. Es un valle aislado, un oasis donde se mezclan
      especies de origen centroeuropeo, esteparias y submediterráneas, y donde monjes del Segundo Imperio
      Búlgaro excavaron sus monasterios en la roca.
    landscape: >-
      Domina la caliza, y eso importa: la biodiversidad de los terrenos kársticos es dos o tres veces mayor
      que la de otros paisajes. En el valle hay cientos de cuevas pequeñas sin ramificaciones. El relieve
      variado, el microclima, las rocas y los humedales explican la mezcla de especies de tres orígenes.


      En las laderas abruptas sobre el río crece un bosque con roble, olmo, arce, fresno y tilo, con un rico
      sotobosque de espino, rosal silvestre, cerezo de racimos y lilas. La flora del parque reúne 902
      especies, el 23 % de la de Bulgaria, con 30 endemismos balcánicos y uno búlgaro. Entre los más
      restringidos está Verbascum dieckianum, cuya población vive solo en la cuenca del Rusenski Lom. A lo
      largo de la ruta roja se encuentran además hábitats protegidos de ríos con plantas acuáticas, prados
      calcícolas y laderas rocosas calizas.
    wildlife: >-
      Las aves mandan. Se han registrado más de 190 especies, y anidan 110. Muchas están amenazadas en toda
      Europa, y por eso la zona está declarada lugar ornitológicamente importante. Las cavidades y cornisas de
      la roca acogen [águila real](/especie/aquila_chrysaetos/), [alimoche](/especie/neophron_percnopterus/),
      [busardo moro](/especie/buteo_rufinus/), halcón sacre, cernícalos y vencejo real, entre otras. En el
      bosque y los prados viven águila pomerana, gavilán, abejero europeo y mochuelo boreal, y casi todos los
      pájaros carpinteros. Las rapaces de los cañones son sensibles a las molestias: observa con prismáticos
      desde el sendero y no te acerques a las paredes.


      También hay anfibios y reptiles en abundancia: 10 especies de anfibios, 5 de ellas protegidas, y 19 de
      reptiles. El gecko nocturno es el único gecko de Bulgaria, y se cuentan dos tortugas terrestres y varias
      culebras. Entre los insectos, mantis pequeña y escarabajos raros como el [ciervo
      volante](/especie/lucanus_cervus/); la zona está declarada lugar importante para las mariposas de
      Bulgaria. Y de los 90 mamíferos del país, 70 se han registrado en el valle, incluidas 26 de las 29
      especies de murciélagos de Bulgaria y 12 de carnívoros. En el río viven 22 especies de peces.
    visit: >-
      El centro de información turística y el centro de visitantes están en el edificio del municipio de
      Ivanovo,.


      La ruta roja, de unos veinte kilómetros dentro del parque, recorre los cañones del Rusenski Lom y el
      Cherni Lom entre las reservas arqueológicas de las iglesias rupestres de Ivanovo y la ciudad medieval de
      Cherven. Pasa junto al monasterio de Gramovets, los monasterios Malki Ray y Golyam Ray y nichos
      rupestres usados por monjes, junto a plantas protegidas y a un punto de observación de aves. El
      itinerario pasa además junto a dos refugios.


      Hay recorridos más cortos. El itinerario histórico de las iglesias rupestres de Ivanovo mide de 1 a 9 km
      según el punto de salida, por camino llano de tierra y asfalto; junto al aparcamiento hay un guía
      permanente del Museo Histórico de Ruse. El de la fortaleza de Cherven mide 2 km y sube por escalones
      hasta la entrada; se ven nichos de roca de la extracción de salitre. En la Muralla Blanca (Byalata
      stena), a unos 3 km de Svalenik, la leyenda dice que las huellas de Krali Marko quedaron grabadas en las
      rocas.
    history: >-
      Entre los siglos XII y XIV, en el Segundo Imperio Búlgaro, los monjes fundaron aquí varios monasterios
      en cuevas. Cuando los otomanos conquistaron la zona, empezaron a decaer. Hoy sus restos forman parte del
      sitio Patrimonio Mundial de las iglesias rupestres de Ivanovo, dentro del parque. El monasterio de San
      Arcángel Miguel está a 2 km al este de Ivanovo, en el paraje Pismata. En Smesite, donde se unen el Beli
      Lom y el Cherni Lom, hay en lo alto del peñasco un santuario tracio con nichos en la roca.


      El parque se creó el 26 de febrero de 1970 para proteger el cañón.
    before: >-
      Los itinerarios del parque están señalizados de acuerdo con asociaciones turísticas y deportivas
      locales. Comprueba con el parque los accesos y las condiciones antes de ir.
    around: >-
      Más lejos, el [Parque Natural Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) y el
      [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) comparten con Rusenski Lom el
      alimoche y el búho real, y el cañón y el karst.
  en:
    intro: >-
      A short distance from a bustling city, a river has carved a canyon through the limestone and left a
      world apart. Rusenski Lom Nature Park lies about twenty kilometres from Ruse in northern Bulgaria,
      protecting the canyon of the Rusenski Lom — the last major right-bank tributary of the Danube — together
      with the valleys of its tributaries: Cherni Lom, Beli Lom and Mali Lom. It is an isolated valley, an
      oasis where species of central European, steppe and sub-Mediterranean origin intermingle, and where
      monks of the Second Bulgarian Empire excavated their monasteries into the living rock.
    landscape: >-
      Limestone dominates, and that matters: the biodiversity of karst terrain is two to three times greater
      than that of other landscapes. Hundreds of small, unbranched caves honeycomb the valley walls. The
      varied relief, local microclimate, rock types and wetland patches explain the blending of species from
      three biogeographical origins.


      On the steep riverside slopes grows a mixed deciduous forest of oak, elm, maple, ash and lime, with a
      rich understorey of hawthorn, wild rose, bird cherry and lilac. The park's flora totals 902 species — 23
      % of Bulgaria's national flora — including 30 Balkan endemics and one Bulgarian endemic: Verbascum
      dieckianum, whose entire population is confined to the Rusenski Lom basin. The red trail also passes
      through protected habitats of aquatic-plant rivers, calcareous grasslands and limestone rocky slopes.
    wildlife: >-
      Birds are the headline act. Over 190 species have been recorded, with 110 breeding here — many
      threatened across Europe, earning the site recognition as an Important Bird Area. Rock faces and ledges
      host the [golden eagle](/especie/aquila_chrysaetos/), [Egyptian
      vulture](/especie/neophron_percnopterus/), [long-legged buzzard](/especie/buteo_rufinus/), saker falcon,
      kestrels and pallid swift. Woodland and meadow species include greater spotted eagle, sparrowhawk, honey
      buzzard and boreal owl, together with almost all European woodpecker species. The raptors of the canyons
      are sensitive to disturbance: watch with binoculars from the path and keep away from the rock walls.


      Amphibians and reptiles are equally impressive: 10 amphibian species, 5 of them legally protected, and
      19 reptile species. The nocturnal gecko is Bulgaria's only gecko species; two land tortoise species and
      several snake species complete the herpetofauna. Among invertebrates, the praying mantis and rare
      beetles including the [stag beetle](/especie/lucanus_cervus/) are recorded, and the valley is designated
      an Important Butterfly Area for Bulgaria. Of Bulgaria's 90 mammal species, 70 have been recorded in the
      valley, among them 26 of Bulgaria's 29 bat species and 12 carnivore species. The river holds 22 fish
      species.
    visit: >-
      The tourist information office and visitor centre are located in the Ivanovo municipality building.


      The red trail, running about twenty kilometres through the park, traverses the Rusenski Lom and Cherni
      Lom canyons between the Ivanovo Rock-Hewn Churches archaeological reserve and the medieval fortress town
      of Cherven. It passes Gramovets Monastery, the small cave monasteries of Malki Ray and Golyam Ray, and
      monk's rock niches, together with protected plants and a dedicated birdwatching point. Two mountain huts
      lie along the route.


      Shorter circuits are also available. The historical trail of the Ivanovo Rock-Hewn Churches covers 1 to
      9 km depending on your starting point, along a flat mix of earth and asphalt tracks; a permanent guide
      from the Ruse Historical Museum is stationed at the car park. The Cherven fortress trail is 2 km and
      climbs a staircase to the entrance, passing rock niches carved during saltpetre extraction. At the White
      Wall (Byalata stena), about 3 km from Svalenik, legend holds that the footprints of the hero Krali Marko
      were left imprinted in the stone.
    history: >-
      Between the twelfth and fourteenth centuries, during the Second Bulgarian Empire, monks founded several
      cave monasteries along these canyon walls. After the Ottoman conquest the monasteries fell into decline.
      Their remains today form part of the Ivanovo Rock-Hewn Churches UNESCO World Heritage Site, located
      within the park. The Monastery of Saint Archangel Michael stands 2 km east of Ivanovo at the site known
      as Pismata. At Smesite, where the Beli Lom and Cherni Lom rivers meet, a Thracian sanctuary with rock
      niches crowns the clifftop.


      The park was established on 26 February 1970 to protect the canyon.
    before: >-
      Park trails are waymarked in coordination with local hiking and sports associations. Check access
      conditions and any trail closures directly with the park before visiting.
    around: >-
      Further afield, [Hoces del Río Duratón Nature Park](/lugar/parque-natural-hoces-del-rio-duraton/) and
      [Monfragüe National Park](/lugar/parque-nacional-de-monfrague/) share with Rusenski Lom the Egyptian
      vulture and eagle-owl, as well as canyon and karst landscapes.
  fr:
    intro: >-
      À quelques kilomètres d'une ville bruyante, une rivière a creusé un canyon dans le calcaire et dessiné
      un monde à part. Le parc naturel de Rusenski Lom est situé à une vingtaine de kilomètres de Ruse, dans
      le nord de la Bulgarie. Il protège le canyon du Rusenski Lom — le dernier affluent important de la rive
      droite du Danube — ainsi que les vallées de ses propres affluents : Cherni Lom, Beli Lom et Mali Lom.
      C'est une vallée isolée, un oasis où coexistent des espèces d'origine centroeuropéenne, steppique et
      subméditerranéenne, et où les moines du Second Empire bulgare ont creusé leurs monastères dans la roche.
    landscape: >-
      Le calcaire domine, et c'est essentiel : la biodiversité des milieux karstiques est deux à trois fois
      supérieure à celle d'autres paysages. Des centaines de petites grottes sans ramifications perforent les
      parois du canyon. Le relief varié, le microclimat local, la nature des roches et les zones humides
      expliquent le mélange d'espèces issues de trois origines biogéographiques.


      Sur les versants abrupts dominant la rivière prospère une forêt mêlant chênes, ormes, érables, frênes et
      tilleuls, avec un riche sous-bois d'aubépines, rosiers sauvages, cerisiers à grappes et lilas. La flore
      du parc compte 902 espèces, soit 23 % de la flore bulgare, avec 30 endémiques balkaniques et un
      endémique strictement bulgare : Verbascum dieckianum, dont toute la population mondiale est confinée au
      bassin du Rusenski Lom. Le sentier rouge traverse en outre des habitats protégés de cours d'eau à
      plantes aquatiques, pelouses calcicoles et pentes rocheuses calcaires.
    wildlife: >-
      Les oiseaux règnent en maîtres. Plus de 190 espèces ont été recensées, dont 110 se reproduisent ici, et
      beaucoup sont menacées à l'échelle européenne, valant au site le statut de zone ornithologique
      importante. Les parois et corniches rocheuses accueillent l'[aigle royal](/especie/aquila_chrysaetos/),
      le [percnoptère d'Égypte](/especie/neophron_percnopterus/), la [buse féroce](/especie/buteo_rufinus/),
      le faucon sacre, les crécerelles et le martinet pâle. En forêt et prairies on retrouve l'aigle pomarin,
      l'épervier, la bondrée apivore, la chouette de Tengmalm et presque tous les pics d'Europe. Les rapaces
      des canyons sont sensibles au dérangement : observez-les aux jumelles depuis le sentier et ne vous
      approchez pas des parois.


      Amphibiens et reptiles sont tout aussi remarquables : 10 espèces d'amphibiens, 5 légalement protégées,
      et 19 espèces de reptiles. Le gecko nocturne est l'unique gecko bulgare ; deux espèces de tortues
      terrestres et plusieurs couleuvres complètent l'herpétofaune. Parmi les invertébrés, la mante religieuse
      et de rares coléoptères comme le [lucane cerf-volant](/especie/lucanus_cervus/) sont répertoriés, et la
      vallée est désignée zone importante pour les papillons de Bulgarie. Sur les 90 espèces de mammifères
      bulgares, 70 ont été identifiées dans la vallée, dont 26 des 29 espèces de chauves-souris du pays et 12
      espèces de carnivores. La rivière héberge 22 espèces de poissons.
    visit: >-
      L'office d'information touristique et le centre de visiteurs sont installés dans le bâtiment de la
      mairie d'Ivanovo.


      Le sentier rouge, long d'une vingtaine de kilomètres dans le parc, parcourt les canyons du Rusenski Lom
      et du Cherni Lom entre la réserve archéologique des Églises rupestres d'Ivanovo et la ville forteresse
      médiévale de Cherven. Il longe le monastère de Gramovets, les petits monastères rupestres de Malki Ray
      et Golyam Ray et des niches de moines creusées dans la roche, près de plantes protégées et d'un
      observatoire ornithologique. Deux refuges jalonnent l'itinéraire.


      Des circuits plus courts sont disponibles. L'itinéraire historique des Églises rupestres d'Ivanovo
      mesure de 1 à 9 km selon le point de départ, sur chemin plat de terre et de bitume ; un guide permanent
      du Musée historique de Ruse est présent au parking. Celui de la forteresse de Cherven mesure 2 km et
      gravit des marches jusqu'à l'entrée, en passant devant des niches rupestres creusées lors de
      l'extraction du salpêtre. À la Muraille Blanche (Byalata stena), à environ 3 km de Svalenik, la légende
      veut que les empreintes du héros Krali Marko soient restées gravées dans la pierre.
    history: >-
      Entre les XIIe et XIVe siècles, sous le Second Empire bulgare, des moines fondèrent ici plusieurs
      monastères rupestres. Après la conquête ottomane, ils tombèrent en déclin. Leurs vestiges font
      aujourd'hui partie du site du Patrimoine mondial des Églises rupestres d'Ivanovo, inscrit à l'UNESCO. Le
      monastère de Saint-Archange-Michel se trouve à 2 km à l'est d'Ivanovo, sur le site dit Pismata. À
      Smesite, là où le Beli Lom et le Cherni Lom se rejoignent, un sanctuaire thrace à niches rocheuses
      couronne le promontoire.


      Le parc fut créé le 26 février 1970 pour protéger le canyon.
    before: >-
      Les sentiers du parc sont balisés en coopération avec les associations sportives et de randonnée
      locales. Vérifiez les conditions d'accès et les éventuelles fermetures directement auprès du parc avant
      votre visite.
    around: >-
      Plus loin, le [parc naturel des Gorges du Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) et le
      [parc national de Monfragüe](/lugar/parque-nacional-de-monfrague/) partagent avec Rusenski Lom le
      percnoptère d'Égypte et le grand-duc d'Europe, ainsi que des paysages de canyon et de karst.
  de:
    intro: >-
      Wenige Kilometer von einer lebhaften Stadt entfernt hat ein Fluss einen Canyon in den Kalkstein gegraben
      und eine Welt für sich geschaffen. Der Naturpark Rusenski Lom liegt rund zwanzig Kilometer von Ruse im
      Norden Bulgariens und schützt den Canyon des Rusenski Lom — des letzten bedeutenden rechten
      Donaunebenflusses — samt den Tälern seiner Zuflüsse Cherni Lom, Beli Lom und Mali Lom. Es ist ein
      abgeschlossenes Tal, eine Oase, in der Arten mitteleuropäischer, steppischer und submediterraner
      Herkunft aufeinandertreffen, und wo Mönche des Zweiten Bulgarischen Reiches ihre Klöster in den
      lebendigen Fels gruben.
    landscape: >-
      Kalkstein beherrscht das Bild, und das hat Konsequenzen: Die Biodiversität von Karstlandschaften ist
      zwei- bis dreimal höher als die anderer Landschaftstypen. Hunderte kleiner, unverzweigter Höhlen
      durchziehen die Canyonwände. Das wechselhafte Relief, das lokale Mikroklima, die Gesteinsvielfalt und
      die Feuchtgebiete erklären die Mischung von Arten dreier biogeografischer Herkunftsgebiete.


      Auf den steilen Hängen über dem Fluss wächst ein Mischwald aus Eiche, Ulme, Ahorn, Esche und Linde mit
      einem artenreichen Unterwuchs aus Weißdorn, Wildrose, Traubenkirsche und Flieder. Die Parkflora umfasst
      902 Arten — 23 % der bulgarischen Nationalflora — darunter 30 Balkanendemitten und ein ausschließlich
      bulgarisches Endemit: Verbascum dieckianum, dessen Gesamtbestand auf das Rusenski-Lom-Becken beschränkt
      ist. Der rote Wanderweg führt zudem durch geschützte Lebensräume von Fließgewässern mit Wasserpflanzen,
      Kalkmagerrasen und Kalkfelsabhängen.
    wildlife: >-
      Vögel stehen im Mittelpunkt. Über 190 Arten wurden nachgewiesen, 110 brüten hier — viele in ganz Europa
      bedroht, was dem Gebiet den Status eines Important Bird Area eingebracht hat. Felswände und Gesimse
      beherbergen [Steinadler](/especie/aquila_chrysaetos/), [Schmutzgeier](/especie/neophron_percnopterus/),
      [Adlerbussard](/especie/buteo_rufinus/), Sakerfalke, Turmfalken und Fahlsegler. In Wald und Wiesen leben
      Schelladler, Sperber, Wespenbussard, Raufußkauz und nahezu alle europäischen Spechtarten. Die Greifvögel
      der Schluchten reagieren empfindlich auf Störungen: Beobachten Sie sie mit dem Fernglas vom Weg aus und
      halten Sie Abstand zu den Felswänden.


      Amphibien und Reptilien sind ebenso bemerkenswert: 10 Amphibienarten, davon 5 gesetzlich geschützt, und
      19 Reptilienarten. Der Nachtgecko ist Bulgariens einzige Geckoart; zwei Landschildkrötenarten und
      mehrere Schlangenarten vervollständigen die Herpetofauna. Unter den Wirbellosen sind die Gottesanbeterin
      und seltene Käfer wie der [Hirschkäfer](/especie/lucanus_cervus/) verzeichnet; das Tal ist als
      bedeutendes Schmetterlingsgebiet Bulgariens ausgewiesen. Von Bulgariens 90 Säugetierarten wurden 70 im
      Tal nachgewiesen, darunter 26 der 29 bulgarischen Fledermausarten und 12 Raubtierarten. Der Fluss
      beherbergt 22 Fischarten.
    visit: >-
      Das Touristeninformationsbüro und das Besucherzentrum befinden sich im Gebäude der Gemeindeverwaltung
      Ivanovo.


      Der rote Weg, der im Park etwa zwanzig Kilometer lang ist, verbindet die archäologische Reserve der
      Felsenkirchen von Ivanovo mit der mittelalterlichen Festungsstadt Cherven und durchquert dabei die
      Canyons des Rusenski Lom und des Cherni Lom. Er führt am Kloster Gramovets, den kleinen Felsenklöstern
      Malki Ray und Golyam Ray sowie an Mönchsnischen vorbei, daneben an geschützten Pflanzen und einem
      Vogelbeobachtungspunkt. Zwei Schutzhütten liegen am Weg.


      Kürzere Touren stehen ebenfalls zur Auswahl. Der historische Rundweg der Felsenkirchen von Ivanovo ist
      je nach Startpunkt 1 bis 9 km lang und verläuft auf flachen Erd- und Asphaltwegen; am Parkplatz ist
      dauerhaft ein Reiseführer des Historischen Museums Ruse stationiert. Der Weg zur Festung Cherven misst 2
      km und führt über eine Treppe bis zum Eingang, vorbei an Felsnischen der historischen Salpetergewinnung.
      An der Weißen Mauer (Byalata stena), rund 3 km von Svalenik entfernt, sollen der Legende nach die
      Fußabdrücke des Helden Krali Marko in den Fels eingeprägt sein.
    history: >-
      Zwischen dem zwölften und vierzehnten Jahrhundert gründeten Mönche des Zweiten Bulgarischen Reiches
      mehrere Felsenklöster in diesem Canyon. Nach der osmanischen Eroberung verfielen sie. Ihre Überreste
      bilden heute Teil des UNESCO-Welterbes der Felsenkirchen von Ivanovo innerhalb des Parks. Das Kloster
      des Heiligen Erzengels Michael liegt 2 km östlich von Ivanovo an der Stätte Pismata. In Smesite, wo Beli
      Lom und Cherni Lom zusammenfließen, krönt ein thrakisches Heiligtum mit Felsnischen den Felsvorsprung.


      Der Park wurde am 26. Februar 1970 zum Schutz des Canyons gegründet.
    before: >-
      Die Parkwanderwege sind in Abstimmung mit lokalen Wander- und Sportvereinen ausgeschildert. Erkundige
      dich vor dem Besuch beim Park über aktuelle Zugangsbedingungen und allfällige Sperrungen.
    around: >-
      Weit entfernt teilen der [Naturpark Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/)
      und der [Nationalpark Monfragüe](/lugar/parque-nacional-de-monfrague/) mit dem Rusenski Lom den
      Schmutzgeier und den Uhu sowie Canyon- und Karstlandschaften.
  it:
    intro: >-
      A pochi chilometri da una città rumorosa, un fiume ha intagliato un canyon nel calcare creando un mondo
      a sé. Il Parco Naturale di Rusenski Lom si trova a circa venti chilometri da Ruse, nel nord della
      Bulgaria, e tutela il canyon del Rusenski Lom — l'ultimo importante affluente di destra del Danubio —
      insieme alle valli dei suoi affluenti Cherni Lom, Beli Lom e Mali Lom. È una valle isolata, un'oasi dove
      convivono specie di origine centroeuropea, steppica e submediterranea, e dove i monaci del Secondo
      Impero bulgaro scavarono i loro monasteri nella roccia viva.
    landscape: >-
      Il calcare domina il paesaggio, e questo ha conseguenze importanti: la biodiversità dei suoli carsici è
      due o tre volte superiore a quella degli altri paesaggi. Centinaia di piccole grotte senza diramazioni
      perforano le pareti del canyon. Il rilievo vario, il microclima locale, la diversità delle rocce e le
      zone umide spiegano la mescolanza di specie di tre diverse origini biogeografiche.


      Sulle ripide sponde fluviali cresce una foresta mista di querce, olmi, aceri, frassini e tigli, con un
      ricco sottobosco di biancospino, rosa selvatica, ciliegio a grappoli e lillà. La flora del parco
      annovera 902 specie — il 23 % di quella bulgara — con 30 endemismi balcanici e uno strettamente bulgaro:
      Verbascum dieckianum, la cui intera popolazione mondiale è confinata nel bacino del Rusenski Lom. Il
      sentiero rosso percorre anche habitat protetti di fiumi con piante acquatiche, praterie calcaree e
      versanti rocciosi calcarei.
    wildlife: >-
      Gli uccelli sono i protagonisti assoluti. Sono state registrate oltre 190 specie, con 110 nidificanti —
      molte minacciate a livello europeo, tanto da far designare la zona come Important Bird Area. Pareti e
      cornici rocciose ospitano l'[aquila reale](/especie/aquila_chrysaetos/), il
      [capovaccaio](/especie/neophron_percnopterus/), la [poiana codabianca](/especie/buteo_rufinus/), il
      falco sacro, gheppi e rondone pallido. Nei boschi e nei prati vivono l'aquila pomarina, lo sparviere, il
      falco pecchiaiolo, la civetta capogrosso e quasi tutti i picchi europei. I rapaci dei canyon sono
      sensibili al disturbo: osservali con il binocolo dal sentiero e non avvicinarti alle pareti rocciose.


      Anfibî e rettili sono ugualmente notevoli: 10 specie di anfibi, 5 legalmente protette, e 19 specie di
      rettili. Il geco notturno è l'unico geco della Bulgaria; due specie di tartarughe terrestri e vari
      serpenti completano l'erpetofauna. Tra gli invertebrati si segnalano la mantide religiosa e rari
      coleotteri come il [cervo volante](/especie/lucanus_cervus/); la valle è riconosciuta come area
      importante per le farfalle di Bulgaria. Delle 90 specie di mammiferi bulgari, 70 sono state censite
      nella valle, tra cui 26 delle 29 specie di pipistrelli del paese e 12 specie di carnivori. Il fiume
      ospita 22 specie di pesci.
    visit: >-
      L'ufficio informazioni turistiche e il centro visitatori si trovano nell'edificio del municipio di
      Ivanovo.


      Il sentiero rosso, lungo circa venti chilometri nel parco, percorre i canyon del Rusenski Lom e del
      Cherni Lom tra la riserva archeologica delle Chiese rupestri di Ivanovo e la città fortezza medievale di
      Cherven. Passa accanto al monastero di Gramovets, ai piccoli monasteri rupestri di Malki Ray e Golyam
      Ray e a nicchie di monaci scavate nella roccia, oltre che presso piante protette e un punto di
      osservazione ornitologica. Due rifugi si trovano lungo il percorso.


      Sono disponibili anche circuiti più brevi. L'itinerario storico delle Chiese rupestri di Ivanovo è lungo
      da 1 a 9 km a seconda del punto di partenza, su percorso pianeggiante di terra e asfalto; una guida
      permanente del Museo Storico di Ruse è presente al parcheggio. L'itinerario della fortezza di Cherven è
      di 2 km e risale una scalinata fino all'ingresso, passando davanti a nicchie rupestri scavate durante
      l'estrazione del salnitro. Alla Muraglia Bianca (Byalata stena), a circa 3 km da Svalenik, la leggenda
      vuole che le impronte dell'eroe Krali Marko siano rimaste impresse nella roccia.
    history: >-
      Tra il dodicesimo e il quattordicesimo secolo, durante il Secondo Impero bulgaro, i monaci fondarono
      diversi monasteri rupestri lungo le pareti di questo canyon. Dopo la conquista ottomana cominciarono a
      decadere. I loro resti fanno oggi parte del sito UNESCO delle Chiese rupestri di Ivanovo. Il Monastero
      di San Michele Arcangelo sorge a 2 km a est di Ivanovo, nella località chiamata Pismata. A Smesite, dove
      il Beli Lom e il Cherni Lom confluiscono, un santuario tracio con nicchie rupestri corona il
      promontorio.


      Il parco fu istituito il 26 febbraio 1970 per proteggere il canyon.
    before: >-
      I sentieri del parco sono segnalati in coordinamento con le associazioni sportive e di escursionismo
      locali. Verifica le condizioni di accesso e le eventuali chiusure direttamente con il parco prima della
      visita.
    around: >-
      Più lontano, il [Parco Naturale Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) e
      il [Parco Nazionale di Monfragüe](/lugar/parque-nacional-de-monfrague/) condividono con Rusenski Lom il
      capovaccaio e il gufo reale, oltre a paesaggi di canyon e carsismo.
  pt:
    intro: >-
      A poucos quilómetros de uma cidade agitada, um rio abriu um desfiladeiro no calcário e deixou um mundo à
      parte. O Parque Natural de Rusenski Lom fica a cerca de vinte quilómetros de Ruse, no norte da Bulgária,
      e protege o desfiladeiro do Rusenski Lom — o último afluente importante da margem direita do Danúbio —
      com os vales dos seus afluentes Cherni Lom, Beli Lom e Mali Lom. É um vale isolado, um oásis onde se
      cruzam espécies de origem centro-europeia, estépica e submediterrânica, e onde os monges do Segundo
      Império Búlgaro escavaram os seus mosteiros na rocha viva.
    landscape: >-
      O calcário domina tudo, e isso importa: a biodiversidade dos terrenos cársicos é duas a três vezes
      superior à de outras paisagens. Centenas de pequenas grutas sem ramificações perfuram as paredes do
      desfiladeiro. O relevo variado, o microclima local, as rochas e as zonas húmidas explicam a mistura de
      espécies de três origens biogeográficas.


      Nas encostas abruptas sobre o rio cresce uma floresta de carvalhos, ulmeiros, bordos, freixos e tílias,
      com um rico sub-bosque de espinheiro, roseira brava, cerejeira de cachos e lilás. A flora do parque
      reúne 902 espécies — 23 % da flora búlgara — com 30 endemismos balcânicos e um endemismo exclusivamente
      búlgaro: Verbascum dieckianum, cuja população vive unicamente na bacia do Rusenski Lom. O trilho
      vermelho atravessa também habitats protegidos de rios com plantas aquáticas, prados calcários e encostas
      rochosas calcárias.
    wildlife: >-
      As aves são as protagonistas. Foram registadas mais de 190 espécies, sendo 110 nidificantes — muitas
      ameaçadas em toda a Europa —, o que valeu ao local o estatuto de Área Importante para as Aves. Paredes e
      cornijas rochosas acolhem a [águia-real](/especie/aquila_chrysaetos/), o
      [abutre-do-egito](/especie/neophron_percnopterus/), o [búteo-de-cauda-branca](/especie/buteo_rufinus/),
      o falcão-sáquer, peneireiros e andorinhão-pálido. Em florestas e prados vivem a águia-pomarina, o
      gavião, o búteo-vespeiro, a corujinha-boreal e quase todos os pica-paus europeus. As aves de rapina dos
      desfiladeiros são sensíveis ao incómodo: observe-as com binóculos a partir do trilho e não se aproxime
      das paredes rochosas.


      Anfíbios e répteis são igualmente notáveis: 10 espécies de anfíbios, 5 legalmente protegidas, e 19
      espécies de répteis. O osga-nocturno é o único osga da Bulgária; duas espécies de tartarugas-terrestres
      e várias cobras completam a herpetofauna. Entre os invertebrados registam-se o louva-a-deus e besouros
      raros como o [cervo-voador](/especie/lucanus_cervus/); o vale é designado área importante para as
      borboletas da Bulgária. Das 90 espécies de mamíferos búlgaros, 70 foram registadas no vale, entre elas
      26 das 29 espécies de morcegos do país e 12 espécies de carnívoros. O rio alberga 22 espécies de peixe.
    visit: >-
      O posto de informação turística e o centro de visitantes ficam no edifício da junta de freguesia de
      Ivanovo.


      O trilho vermelho, com cerca de vinte quilómetros dentro do parque, percorre os desfiladeiros do
      Rusenski Lom e do Cherni Lom entre a reserva arqueológica das Igrejas Rupestres de Ivanovo e a cidade
      fortaleza medieval de Cherven. Passa junto ao mosteiro de Gramovets, aos pequenos mosteiros rupestres de
      Malki Ray e Golyam Ray e a nichos de monges escavados na rocha, além de plantas protegidas e um posto de
      observação de aves. Dois abrigos situam-se ao longo do percurso.


      Estão disponíveis percursos mais curtos. O itinerário histórico das Igrejas Rupestres de Ivanovo mede de
      1 a 9 km conforme o ponto de partida, por caminho plano de terra e asfalto; um guia permanente do Museu
      Histórico de Ruse encontra-se no estacionamento. O percurso da fortaleza de Cherven tem 2 km e sobe por
      escadas até à entrada, passando por nichos rupestres da extração de salitre. Na Muralha Branca (Byalata
      stena), a cerca de 3 km de Svalenik, diz a lenda que as pegadas do herói Krali Marko ficaram gravadas
      nas rochas.
    history: >-
      Entre os séculos XII e XIV, durante o Segundo Império Búlgaro, os monges fundaram aqui vários mosteiros
      rupestres. Com a conquista otomana, entraram em declínio. Os seus vestígios fazem hoje parte do sítio
      Património Mundial das Igrejas Rupestres de Ivanovo. O Mosteiro de São Miguel Arcanjo fica a 2 km a
      leste de Ivanovo, no lugar designado Pismata. Em Smesite, onde confluem o Beli Lom e o Cherni Lom, um
      santuário trácio com nichos rupestres coroa o penedo.


      O parque foi criado a 26 de fevereiro de 1970 para proteger o desfiladeiro.
    before: >-
      Os trilhos do parque estão sinalizados em coordenação com associações locais de caminhada e desporto.
      Verifica com o parque as condições de acesso e eventuais encerramentos antes de visitar.
    around: >-
      Mais longe, o [Parque Natural Hoces del Río Duratón](/lugar/parque-natural-hoces-del-rio-duraton/) e o
      [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) partilham com Rusenski Lom o
      abutre-do-egito e o bufo-real, bem como paisagens de desfiladeiro e carso.
