resumen:
  es: >-
    Turbera cuaternaria y praderías inundables a las puertas de la capital eslovena con palafitos
    prehistóricos UNESCO.
  en: >-
    A Quaternary peat basin and flooded meadows at the doorstep of Slovenia's capital, featuring UNESCO
    prehistoric pile dwellings.
  fr: >-
    Tourbière quaternaire et prairies inondables aux portes de la capitale slovène, avec palafittes
    préhistoriques UNESCO.
  de: >-
    Quartäres Moorbecken und Feuchtwiesen vor den Toren der slowenischen Hauptstadt mit prähistorischen
    UNESCO-Pfahlbauten.
  it: >-
    Bacino torboso quaternario e prati umidi alle porte della capitale slovena, con palafitte preistoriche
    UNESCO.
  pt: >-
    Bacia turfosa quaternária e prados inundáveis às portas da capital eslovena com palafitas pré-históricas
    UNESCO.
unico:
  es: >-
    Un pantano al sur de una capital europea donde cría el guion de codornices y de cuyo suelo salió la rueda
    de madera más antigua hallada en Europa.
  en: >-
    A wetland basin south of a European capital where corn crakes breed and the oldest wooden wheel in Europe
    was unearthed.
  fr: >-
    Un marais au sud d'une capitale européenne où niche le râle des genêts et d'où provient la plus ancienne
    roue de bois d'Europe.
  de: >-
    Ein Feuchtgebiet südlich einer europäischen Hauptstadt, Brutplatz des Wachtelkönigs und Fundort des
    ältesten Holzrades Europas.
  it: >-
    Una palude a sud di una capitale europea dove nidifica il re di quaglie e da cui è emersa la più antica
    ruota di legno d'Europa.
  pt: >-
    Um paul a sul de uma capital europeia onde nidifica o codornizão e de cujo solo emergiu a mais antiga roda
    de madeira da Europa.
observaciones:
  es: >-
    La mayor parte de las rutas no tiene sombra: en verano lleva protección contra el sol, los mosquitos y los
    tábanos. Pot na Mah cruza una zona de inundaciones anuales, y parte del camino queda varias veces al año
    bajo el agua. Si llevas perro, que no vaya suelto: el zarapito real anida en el suelo, en la hierba alta,
    y un perro suelto puede acabar con el nido. Para ver aves, silencio y paciencia.
texto:
  es:
    intro: >-
      Hace dos millones de años el suelo se hundió más de 200 m justo donde chocan los Alpes y los Dináridas,
      y desde entonces ese hueco no ha dejado de llenarse: de sedimentos, de agua, de turba. Al sur de
      Liubliana, el resultado es el Ljubljansko barje, el mayor pantano de Eslovenia, un mosaico de prados
      húmedos, canales, setos de aliso y bosques inundables en el que el parque paisajístico protege 135 km²
      de los 163 km² totales. Aquí la primavera se mide por el violeta de las fritilarias y por el regreso de
      las aves.
    landscape: >-
      El barje es una cubeta, y todo en él depende de cómo se llena. Del borde sur llega la Ljubljanica, que
      nace en varios manantiales kársticos y recorre unos 20 km por el marjal con una pendiente casi
      inexistente, de ahí que las inundaciones sean una constante: las de primavera y otoño pueden cubrir una
      buena parte del marjal.


      La turba creció hasta el siglo XIX, cuando empezaron los grandes trabajos de drenaje, y en las últimas
      décadas se cortó para leña y huertos. De la antigua turbera alta solo quedan restos en torno a Bevke, en
      Goričica y Kostanjevica. Los lugareños todavía lo llaman «Mah», por los musgos que caracterizan el
      pantano alimentado por la lluvia; el nombre actual, «barje», se lo dio el escritor Fran Levstik, que lo
      rebautizó cuando hasta entonces se hablaba del Ljubljansko močvirje.


      Lo que ves hoy es un paisaje de bandas. Franjas de aliso negro de hasta dos metros de ancho, largas como
      los canales, separan las parcelas de distintos propietarios por todo el marjal. Los prados húmedos son
      el hábitat más valioso, y a su lado cuentan los bosques inundables, los canales de drenaje, los cursos
      de agua y los setos.
    wildlife: >-
      **Primavera.** Es la mejor estación para las aves, porque coinciden la cría y la migración, los machos
      marcan territorio cantando o con vuelos nupciales y la vegetación aún no es espesa. Al principio de la
      estación las fritilarias tiñen de violeta los prados húmedos, y hacia esas fechas empiezan a volver los
      viajeros de África: la [tarabilla norteña](/especie/saxicola_rubetra/) llega en la segunda quincena de
      abril o a primeros de mayo y se posa sobre los juncos altos a vigilar, y el alcaudón dorsirrojo regresa
      en mayo y caza desde lo alto de un arbusto o de una cerca. Las grullas hacen escala para descansar y
      comer durante sus viajes; vuelan en grandes bandadas en V y se oyen antes de verse.


      **Verano.** El [guion de codornices](/especie/crex_crex/) pasa aquí solo unos meses, de primeros de mayo
      a septiembre, y es la única especie globalmente amenazada que cría hoy en el marjal. Su canto recuerda
      al afilado de una guadaña, y su mayor enemigo es segar los prados demasiado pronto, porque anida en el
      suelo, tapado por la hierba alta. El [zarapito real](/especie/numenius_arquata/) también depende de esos
      prados: unas diez parejas forman la única población nidificante estable de Eslovenia.


      **Todo el año.** Hay 107 especies de aves nidificantes, regulares u ocasionales, y el marjal es también
      lugar de invernada y de paso. Entre los mamíferos, unas 45 especies, la [nutria](/especie/lutra_lutra/)
      se ve de vez en cuando junto a la Ljubljanica y el Iščica. El [galápago
      europeo](/especie/emys_orbicularis/), adaptado al mundo del pantano, se ha vuelto muy raro. Los biólogos
      han registrado más de seis mil especies, y el barjanski okarček, casi extinguido, se reintrodujo con
      éxito en el Iški morost en 2021.


      Para observar aves, el momento es la mañana, incluso antes del amanecer, y en menor medida el atardecer.
      A mediodía, sobre todo en verano, cuesta oír y ver a casi todas.
    visit: >-
      El parque propone seis rutas temáticas: Pot na Mah, Pot Morostig, Pot med jelšami, Pot Barjanska okna,
      Učna pot Bevke y Pot ob reki Iški – Okljuk. Dos sirven para entender el lugar.


      **Pot na Mah** es un recorrido circular de 3,8 km, casi todo de tierra, apto para ir a pie o en bici.
      Empieza en el parque de bomberos de Goričica pod Krimom, sube a un cerro aislado y baja después con algo
      más de pendiente. Recorre la reserva natural Goriški mah, resto de turbera alta con buenas capas de
      turba, y en su observatorio de aves se explican las especies de los prados húmedos. También tiene un
      aula en la naturaleza.


      **Pot Morostig** mide 1,5 km por camino de tierra, pista agrícola y pasarela de madera. Sale del centro
      de interpretación de Morostig, en Ig, y se sigue por marcas en el suelo con forma de casa palafítica.
      Lleva hasta la reconstrucción de una aldea palafítica, a la que solo se entra en horas fijadas y con
      guía. Quien llegue en autobús urbano o deje el coche junto a la carretera Ig–Škofljica camina unos 600 m
      por una pista hasta el inicio.


      El parque también organiza visitas guiadas a las rutas temáticas, pensadas para escuelas y grupos
      organizados, y en su web hay un mapa interactivo con las rutas, los puntos de interés y los palafitos.
    history: >-
      En abril de 2002 aparecieron los de una rueda de madera con eje de unos 5150 años, la más antigua
      hallada en Europa. Dos conjuntos de palafitos prehistóricos están inscritos en la lista de la UNESCO, y
      el área forma parte de Natura 2000 desde 2004.


      El parque paisajístico se estableció por decreto, en vigor desde el 13 de diciembre de 2008, y pertenece
      a la categoría V de la UICN. Dentro hay 15 áreas de protección más estricta: nueve monumentos naturales
      y seis reservas naturales, entre ellas Goriški mah y el Iški morost.


      Las amenazas son concretas. La intensificación agrícola ha reducido de forma notable los prados húmedos
      y los setos, y algunas especies ligadas a ellos están en situación crítica. Las especies exóticas
      invasoras son otra amenaza para la biodiversidad.
    before: >-
      La mayor parte de las rutas no tiene sombra: en verano lleva protección contra el sol, los mosquitos y
      los tábanos. Pot na Mah cruza una zona de inundaciones anuales, y parte del camino queda varias veces al
      año bajo el agua. Si llevas perro, que no vaya suelto: el zarapito real anida en el suelo, en la hierba
      alta, y un perro suelto puede acabar con el nido. Para ver aves, silencio y paciencia.
    around: >-
      A unos 10 km queda la [Meseta Kárstica de Nanos](/lugar/kraska-planota-nanos/), a 16 km el [Lago
      Intermitente de Cerknica](/lugar/cerknisko-jezero/) y a unos 20 km los [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) y el [Complejo Forestal de
      Kočevsko](/lugar/kocevski-gozdni-kompleks/). Lejos de aquí, el [Parque Nacional
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) comparte con el barje el guion de codornices y
      el humedal.
  en:
    intro: >-
      Two million years ago, tectonic forces dropped the valley floor by more than 200 m right where the Alps
      collide with the Dinarides, and ever since, that tectonic depression has steadily filled with sediments,
      groundwater, and peat. Just south of Ljubljana, the outcome is the Ljubljansko barje, the largest
      wetland in Slovenia, an intricate mosaic of wet meadows, ditch networks, alder hedgerows, and riparian
      woods where the landscape park protects 135 km² out of 163 km² in total. Here spring is measured by the
      purple bloom of snake's head fritillaries and the return of migratory birds.
    landscape: >-
      The marsh forms a shallow geological basin, and its character is dictated by fluctuating water levels.
      Entering from the southern hills comes the Ljubljanica River, emerging from multiple karst springs and
      meandering for roughly 20 km through the peatland with a negligible gradient; seasonal inundations
      remain a defining rhythm, with spring and autumn floods submerging vast expanses of the basin floor.


      Peat layers accumulated until the nineteenth century, when large drainage schemes were launched,
      followed in recent decades by peat cutting for fuel and gardening. Today remnants of the former raised
      bog survive primarily around Bevke, at Goričica and Kostanjevica. Locals still refer to the land as
      "Mah", commemorating the peat mosses that built the rain-fed bog; the modern name "barje" was
      popularized by nineteenth-century author Fran Levstik, replacing the older term *Ljubljansko močvirje*.


      What you see today is a landscape structured in linear bands. Belts of black alder up to two metres
      wide, mirroring the drainage canals, partition property boundaries across the marsh. Wet meadows
      represent the most ecologically precious habitat, flanked by wet woodlands, drainage canals, slow
      waterways, and dense hedgerows.
    wildlife: >-
      Spring is the prime season for birdlife: nesting and migration coincide, territorial males display
      vigorously from dawn, and marsh vegetation remains low. Early in the season, fritillaries tint the
      meadows purple, coinciding with the arrival of trans-Saharan migrants: the
      [whinchat](/especie/saxicola_rubetra/) arrives during late April or early May to perch atop tall reeds
      on lookout, while the red-backed shrike returns in May to hunt from fenceposts and bushes. Common cranes
      pause during migration flights, flying in majestic V-formations audible long before they appear.


      In summer, the elusive [corn crake](/especie/crex_crex/) spends several months here, from early May into
      September, representing the sole globally threatened bird species nesting in the marsh. Its rhythmic
      rasping call echoes like a whetstone sharpening a scythe; untimely mechanical mowing of tall grass poses
      its gravest peril. The [Eurasian curlew](/especie/numenius_arquata/) also depends upon wet meadows, with
      roughly ten pairs constituting the only stable breeding population in Slovenia.


      Throughout the year, 107 bird species breed regularly or occasionally across the marsh, which also
      provides key wintering grounds. Mammals number some 45 species, with the [European
      otter](/especie/lutra_lutra/) seen periodically along the Ljubljanica and Iščica. The [European pond
      turtle](/especie/emys_orbicularis/) has become exceedingly rare. Biologists have recorded over six
      thousand species, and the false ringlet butterfly was successfully reintroduced into the Iški morost
      reserve in 2021.


      For birdwatching, the early morning hours, even before sunrise, offer the finest viewing. At midday,
      especially during midsummer, wetland wildlife remains largely concealed.
    visit: >-
      The park features six themed interpretive trails: Pot na Mah, Pot Morostig, Pot med jelšami, Pot
      Barjanska okna, Učna pot Bevke, and Pot ob reki Iški – Okljuk. Two trails provide an ideal introduction.


      **Pot na Mah** is a 3.8 km circular trail, largely unpaved, suitable for walking or cycling. Starting at
      the Goričica pod Krimom volunteer fire station, it ascends an isolated hill before descending gently
      through the Goriški mah nature reserve, displaying ancient peat layers and an observation blind
      explaining meadow wildlife, complete with an outdoor classroom.


      **Pot Morostig** measures 1.5 km along unpaved lanes and wooden boardwalks. Beginning at the Morostig
      interpretation centre in Ig, it follows trail markers shaped like prehistoric stilt houses to a
      reconstructed pile-dwelling settlement, accessible during guided visiting hours. Visitors arriving by
      public bus or parking along the Ig–Škofljica road walk about 600 m along an access track to the
      trailhead.


      The park organizes guided excursions for educational groups, and its website features an interactive map
      detailing trailheads, nature reserves, and prehistoric pile-dwelling locations.
    history: >-
      In April 2002, archaeologists discovered the remains of a prehistoric wooden wheel with an axle dating
      back approximately 5150 years, the oldest known wooden wheel in Europe. Two clusters of prehistoric pile
      dwellings are inscribed on the UNESCO World Heritage list, and the marsh has been part of Natura 2000
      since 2004.


      The landscape park was formally established by government decree in force since 13 December 2008,
      classified as an IUCN Category V protected landscape. It contains 15 areas under strict municipal
      protection: nine natural monuments and six nature reserves, including Goriški mah and Iški morost.


      Conservation challenges are pressing. Agricultural intensification has reduced wet meadow expanse and
      hedgerow connectivity, threatening ground-nesting birds. Invasive alien species represent an additional
      ecological strain.
    before: >-
      Most trails provide little tree shade: bring reliable sun protection, mosquito repellent, and water in
      summer. Pot na Mah traverses seasonally flooded lowlands that may lie under water several times a year.
      If accompanied by a dog, keep it securely leashed: curlews nest directly upon the ground among tall
      grasses and loose dogs can destroy clutches. For birdwatching, silence and patience are essential.
    around: >-
      Around 10 km away rises the [Nanos Karst Plateau](/lugar/kraska-planota-nanos/), at 16 km lies [Lake
      Cerknica Intermittent Karst Lake](/lugar/cerknisko-jezero/), and roughly 20 km away are the [Javorniki
      Forest and Karst Plateau](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) and the [Kočevsko Forest
      Complex](/lugar/kocevski-gozdni-kompleks/). Further afield, [Fertő-Hanság National
      Park](/lugar/ferto-hansag-nemzeti-park---hansag/) shares with the Barje the corn crake and alluvial
      wetland habitats.
  fr:
    intro: >-
      Il y a deux millions d'années, le substrat s'est affaissé de plus de 200 m au point de rencontre entre
      les Alpes et les Dinarides, et depuis lors cette dépression n'a cessé de se combler de sédiments, d'eau
      et de tourbe. Au sud de Ljubljana, le résultat est le Ljubljansko barje, le plus vaste marais de
      Slovénie, un damier de prairies humides, canaux, haies d'aulnes et forêts alluviales dont le parc
      paysager protège 135 km² sur les 163 km² au total. Ici, le printemps se signale par l'éclosion pourpre
      des fritillaires pintades et le retour des oiseaux migrateurs.
    landscape: >-
      Le marais forme une cuvette dont toute la dynamique découle des crues. Depuis le rebord méridional
      arrive la rivière Ljubljanica, issue de résurgences karstiques, qui serpente sur environ 20 km à travers
      le marais avec une pente presque nulle ; les inondations printanières et automnales recouvrent
      fréquemment une large part du plancher alluvial.


      La tourbe s'est développée jusqu'au XIXe siècle, époque des grands chantiers de drainage, avant d'être
      exploitée pour le chauffage et le maraîchage. De la tourbière ombrotrophique historique ne subsistent
      que des témoins vers Bevke, Goričica et Kostanjevica. Les habitants désignent encore le site sous le nom
      de « Mah », en référence aux sphaignes ; le nom actuel « barje » fut popularisé par l'écrivain Fran
      Levstik en remplacement de l'ancien *Ljubljansko močvirje*.


      Le paysage actuel se présente en lanières régulières. Des cordons d'aulnes noirs larges de deux mètres,
      parallèles aux canaux, matérialisent les limites parcellaires. Les prés humides constituent l'habitat le
      plus précieux, côtoyant forêts inondables, fossés et cours d'eau lents.
    wildlife: >-
      Le printemps est la saison la plus faste pour l'avifaune : reproduction et migration se chevauchent, les
      mâles paradent et la végétation herbacée reste rase. Dès le début de saison, les fritillaires colorent
      les prés, coïncidant avec le retour des espèces migratrices : le [tarier des
      prés](/especie/saxicola_rubetra/) arrive fin avril ou début mai, posté sur les tiges de joncs, tandis
      que la pie-grièche écorcheur s'installe en mai. Les grues cendrées font escale lors de leurs traversées
      en V.


      En été, le discret [râle des genêts](/especie/crex_crex/) séjourne ici de mai à septembre, seule espèce
      mondialement vulnérable nichant dans le marais. Son chant grinçant évoque l'aiguisage d'une faux, et la
      fauche précoce des prairies menace ses pontes au sol. Le [courlis cendré](/especie/numenius_arquata/)
      dépend également de ces prés humides : environ dix couples forment l'unique population nidificatrice
      stable de Slovénie.


      Toute l'année, 107 espèces d'oiseaux nichent régulièrement ou occasionnellement, le marais servant aussi
      d'hivernage. Parmi les 45 espèces de mammifères, la [loutre d'Europe](/especie/lutra_lutra/) est
      observée le long de la Ljubljanica et de l'Iščica. La [cistude d'Europe](/especie/emys_orbicularis/) y
      est devenue très rare. Les biologistes ont recensé plus de six mille espèces vivantes, et le fadet des
      tourbières a été réintroduit avec succès dans la réserve d'Iški morost en 2021.


      L'aube matinale constitue le moment idéal pour observer l'avifaune. À la mi-journée, les oiseaux restent
      invisibles.
    visit: >-
      Le parc compte six sentiers thématiques : Pot na Mah, Pot Morostig, Pot med jelšami, Pot Barjanska okna,
      Učna pot Bevke et Pot ob reki Iški – Okljuk. Deux circuits permettent une excellente découverte.


      Le sentier **Pot na Mah** est une boucle de 3,8 km praticable à pied ou à vélo. Partant du centre de
      secours de Goričica pod Krimom, il gravit une butte isolée avant de redescendre vers la réserve de
      Goriški mah, témoin de tourbière haute avec un observatoire et une salle pédagogique en plein air.


      Le sentier **Pot Morostig** s'étend sur 1,5 km sur chemins de terre et passerelles en bois. Débutant au
      centre d'interprétation Morostig à Ig, il suit un balisage au sol en forme de cité lacustre jusqu'à la
      reconstitution d'un village palafittique accessible en visite guidée. Les visiteurs en bus ou stationnés
      sur la route Ig–Škofljica parcourent environ 600 m sur une piste pour rejoindre le départ.


      Le parc organise des sorties pour groupes scolaires et son site web propose une cartographie interactive
      des itinéraires et des sites préhistoriques.
    history: >-
      En avril 2002 ont été exhumés les vestiges d'une roue en bois avec son essieu vieille d'environ 5150
      ans, la plus ancienne découverte en Europe. Deux ensembles de cités lacustres sont inscrits sur la liste
      du patrimoine mondial de l'UNESCO, et le marais est intégré à Natura 2000 depuis 2004.


      Le parc paysager a été créé par décret officiel en vigueur depuis le 13 décembre 2008, classé en
      catégorie V de l'UICN. Il regroupe 15 zones de protection renforcée : neuf monuments naturels et six
      réserves naturelles, dont Goriški mah et Iški morost.


      L'intensification agricole a restreint les prés de fauche humides et les haies, fragilisant la faune
      spécialisée. La prolifération de végétaux exotiques envahissants constitue une menace supplémentaire.
    before: >-
      La plupart des parcours sont dépourvus d'ombrage : prévoyez protection solaire et répulsif
      anti-moustiques en été. Le sentier Pot na Mah traverse une zone submersible inondée plusieurs fois par
      an. Les chiens doivent impérativement être tenus en laisse : le courlis cendré niche au sol dans les
      herbes hautes. Pour observer les oiseaux, patience et silence sont requis.
    around: >-
      À environ 10 km s'élève le [plateau karstique de Nanos](/lugar/kraska-planota-nanos/), à 16 km s'étend
      le [lac intermittent de Cerknica](/lugar/cerknisko-jezero/) et à environ 20 km les [forêts et plateau
      karstique de Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) ainsi que le [massif
      forestier de Kočevsko](/lugar/kocevski-gozdni-kompleks/). Au loin, le [parc national de
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) partage avec le marais le râle des genêts et
      les prairies inondables.
  de:
    intro: >-
      Vor zwei Millionen Jahren senkte sich der Boden um mehr als 200 m genau dort ab, wo Alpen und Dinariden
      aufeinandertreffen, und seither füllte sich dieses Becken mit Sedimenten, Grundwasser und Torf. Südlich
      von Ljubljana entstand so das Ljubljansko barje, das größte Moor Sloweniens, ein Mosaik aus
      Feuchtwiesen, Kanälen, Schwarzerlenhecken und Auwäldern, in dem der Landschaftspark 135 km² der
      insgesamt 163 km² schützt. Hier kündigt sich der Frühling durch das violette Blütenmeer der Schachblumen
      und die Rückkehr der Zugvögel an.
    landscape: >-
      Das Moor bildet eine tektonische Senke, deren Charakter vom Wasserstand bestimmt wird. Vom Südrand
      fließt die Ljubljanica ein, die aus mehreren Karstquellen entspringt und das Moor auf rund 20 km Länge
      bei minimalem Gefälle durchquert; Frühjahrs- und Herbsthochwässer setzen weite Teile des Beckens
      regelmäßig unter Wasser.


      Der Torf wuchs bis ins neunzehnte Jahrhundert heran, als umfangreiche Entwässerungsmaßnahmen begannen,
      gefolgt vom Torfstich für Heizzwecke. Vom ursprünglichen Hochmoor blieben Reste um Bevke, bei Goričica
      und Kostanjevica erhalten. Einheimische nennen das Gebiet bis heute „Mah“ nach den Torfmoosen; der
      heutige Name „barje“ wurde von Schriftsteller Fran Levstik anstelle des Begriffs *Ljubljansko močvirje*
      geprägt.


      Das heutige Landschaftsbild ist streng streifenförmig gegliedert. Bis zu zwei Meter breite
      Schwarzerlenhecken begleiten die Kanäle und markieren die Grundstücksgrenzen. Feuchtwiesen stellen den
      wertvollsten Biotoptyp dar, ergänzt von Auwäldern, Gräben und Heckenstrukturen.
    wildlife: >-
      Der Frühling ist die beste Jahreszeit für die Vogelbeobachtung: Brut- und Zugzeit fallen zusammen,
      Balzflüge beleben den Himmel und die Vegetation steht noch niedrig. Früh im Jahr färben Schachblumen die
      Wiesen violett, während Weitstreckenzieher eintreffen: Das [Braunkehlchen](/especie/saxicola_rubetra/)
      erscheint Ende April oder Anfang Mai auf hohen Schilfstängeln, der Neuntöter folgt im Mai. Kraniche
      rasten auf ihren Flügen in V-Formation.


      Im Sommer weilt der scheue [Wachtelkönig](/especie/crex_crex/) von Mai bis September im Gebiet, die
      einzige weltweit bedrohte Vogelart, die im Moor brütet. Sein schnarrender Ruf erinnert an das Wetzen
      einer Sense; frühe Wiesenmahd bedroht die Gelege am Boden. Auch der [Große
      Brachvogel](/especie/numenius_arquata/) ist auf ungemähte Feuchtwiesen angewiesen: Rund zehn Paare
      bilden das einzige beständige Brutvorkommen Sloweniens.


      Ganzjährig brüten 107 Vogelarten im Moor, das zudem als Winterquartier dient. Unter den rund 45
      Säugetierarten lebt der [Fischotter](/especie/lutra_lutra/) an der Ljubljanica und der Iščica. Die
      [Europäische Sumpfschildkröte](/especie/emys_orbicularis/) ist sehr selten geworden. Biologen erfassten
      über sechstausend Arten; der Stromtal-Wiesenvogel wurde 2021 im Reservat Iški morost wiederangesiedelt.


      Frühmorgens vor Sonnenaufgang gelingen die besten Vogelbeobachtungen. Um die Mittagszeit ruht die
      Tierwelt.
    visit: >-
      Der Park bietet sechs Themenwege: Pot na Mah, Pot Morostig, Pot med jelšami, Pot Barjanska okna, Učna
      pot Bevke und Pot ob reki Iški – Okljuk. Zwei Routen vermitteln ideale Einblicke.


      **Pot na Mah** ist ein 3,8 km langer Rundweg für Fußgänger und Radfahrer. Er beginnt am Feuerwehrhaus
      von Goričica pod Krimom, führt über eine Anhöhe und erschließt das Naturreservat Goriški mah mit
      Torfschichten, Beobachtungshütte und Freiluft-Klassenzimmer.


      **Pot Morostig** misst 1,5 km auf Pfaden und Holzstegen. Ausgehend vom Besucherzentrum Morostig in Ig
      folgt der Weg Pfahlbaumarkierungen zu einer rekonstruierten Pfahlbausiedlung, die mit Führung zugänglich
      ist. Wer mit dem Bus anreist oder an der Straße Ig–Škofljica parkt, geht etwa 600 m bis zum Start.


      Der Park führt Schulklassen und Besuchergruppen, während die Website interaktive Karten zu Routen und
      Ausgrabungsstätten bereithält.
    history: >-
      Im April 2002 entdeckten Archäologen ein rund 5150 Jahre altes Holzrad mit Achse, das älteste Holzrad
      Europas. Zwei Pfahlbaufundplätze stehen auf der UNESCO-Welterbeliste, und das Areal ist seit 2004 Teil
      von Natura 2000.


      Der Landschaftspark wurde per Regierungsdekret mit Wirkung vom 13. Dezember 2008 gegründet und
      entspricht der IUCN-Kategorie V. Er umfasst 15 strenger geschützte Bereiche: neun Naturdenkmäler und
      sechs Naturschutzgebiete wie Goriški mah und Iški morost.


      Die fortschreitende landwirtschaftliche Intensivierung verringerte Feuchtwiesen und Hecken. Invasive
      Neophyten stellen eine zusätzliche ökologische Belastung dar.
    before: >-
      Die meisten Wege bieten keinen Baumschatten: Führe im Sommer Sonnenschutz und Mückenschutz mit. Der Weg
      Pot na Mah verläuft durch Überflutungsgebiete, die mehrfach im Jahr unter Wasser stehen können. Hunde
      müssen an der Leine geführt werden: Der Große Brachvogel brütet am Boden im hohen Gras. Für
      Vogelbeobachtungen sind Stille und Geduld unerlässlich.
    around: >-
      Rund 10 km entfernt ragt das [Nanos-Karstplateau](/lugar/kraska-planota-nanos/) auf, in 16 km Entfernung
      liegt der [Sickersee von Cerknica](/lugar/cerknisko-jezero/) und in etwa 20 km Entfernung die [Wälder
      und das Karstplateau von Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) sowie das
      [Waldgebiet Kočevsko](/lugar/kocevski-gozdni-kompleks/). Weiter entfernt teilt der [Nationalpark
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) mit dem Moor Wachtelkönig und Feuchtwiesen.
  it:
    intro: >-
      Due milioni di anni fa il substrato sprofondò di oltre 200 m lungo la linea di contatto tra le Alpi e le
      Dinaridi, e da allora quella depressione ha continuato a colmarsi di sedimenti, acque sorgive e torba. A
      sud di Lubiana il risultato è il Ljubljansko barje, la più vasta zona umida della Slovenia, un mosaico
      di prati allagati, canali, siepi di ontano e boschi ripari in cui il parco paesaggistico tutela 135 km²
      su 163 km² complessivi. Qui la primavera si riconosce dalla fioritura viola delle mezzelune e dal
      ritorno dell'avifauna migratrice.
    landscape: >-
      La palude forma una conca poco profonda il cui assetto dipende dal regime idrico. Dal margine
      meridionale scende la Ljubljanica, alimentata da varie risorgenze carsiche, che serpeggia per circa 20
      km attraverso la torbiera con pendenza quasi impercettibile; le esondazioni primaverili e autunnali
      allagano regolarmente ampie superfici del bacino.


      La torba si è accumulata fino al XIX secolo, quando ebbero inizio le grandi bonifiche idrauliche seguite
      dall'estrazione di torba da combustibile. Dell'antica torbiera alta sopravvivono lembi presso Bevke,
      Goričica e Kostanjevica. La gente del posto la chiama ancora «Mah» in ricordo degli sfagni; l'odierno
      toponimo «barje» fu coniato dallo scrittore Fran Levstik per sostituire la vecchia voce *Ljubljansko
      močvirje*.


      Il paesaggio contemporaneo è suddiviso in fasce geometriche. Siepi di ontano nero larghe due metri,
      allineate ai fossi, delimitano le parcelle agricole. I prati umidi rappresentano l'habitat di maggior
      pregio, affiancati da boschi golenali, canali di scolo e corsi d'acqua lenti.
    wildlife: >-
      La primavera è il periodo ideale per l'avifauna: nidificazione e transito si sovrappongono, i canti
      territoriali risuonano all'alba e l'erba è ancora bassa. All'inizio della stagione le fritillarie
      tingono di viola i prati, coincidendo con il rientro dei migratori africani: lo
      [stiaccino](/especie/saxicola_rubetra/) giunge a fine aprile o inizio maggio posandosi sui giunchi,
      mentre l'averla piccola arriva a maggio. Le gru cenerine sostano durante le trasvolate in formazione a
      V.


      In estate il timido [re di quaglie](/especie/crex_crex/) frequenta il parco da maggio a settembre, unica
      specie globalmente minacciata nidificante nella palude. Il suo verso caratteristico ricorda l'affilatura
      di una falce; lo sfalcio precoce dell'erba alta mette a rischio le nidiate a terra. Anche il [chiurlo
      maggiore](/especie/numenius_arquata/) dipende da questi prati: una decina di coppie costituisce l'unica
      popolazione nidificante della Slovenia.


      Durante tutto l'anno 107 specie di uccelli vi nidificano, e il marjal funge da quartiere di svernamento.
      Tra i 45 mammiferi censiti, la [lontra europea](/especie/lutra_lutra/) appare lungo la Ljubljanica e
      l'Iščica. La [testuggine palustre europea](/especie/emys_orbicularis/) è divenuta rarissima. I biologi
      contano oltre seimila specie viventi, e la farfalla ninfa delle torbiere è stata reintrodotta con
      successo a Iški morost nel 2021.


      Le prime ore del mattino offrono le migliori condizioni per il birdwatching. Nelle ore centrali gli
      uccelli restano nascosti.
    visit: >-
      Il parco propone sei percorsi tematici: Pot na Mah, Pot Morostig, Pot med jelšami, Pot Barjanska okna,
      Učna pot Bevke e Pot ob reki Iški – Okljuk. Due itinerari offrono una sintesi perfetta.


      **Pot na Mah** è un anello di 3,8 km, quasi interamente sterrato, percorribile a piedi o in bici. Muove
      dalla stazione dei pompieri di Goričica pod Krimom, sale su una collina isolata e discende nella riserva
      di Goriški mah, residuo di torbiera alta dotato di capanno d'avvistamento e aula didattica nel verde.


      **Pot Morostig** si sviluppa per 1,5 km tra carrarecce e passerelle lignee. Parte dal centro visite
      Morostig a Ig e segue sagome di palafitte sul terreno fino alla ricostruzione di un villaggio
      palafitticolo, accessibile con guida in orari stabiliti. Chi arriva in bus urbano o parcheggia lungo la
      direttrice Ig–Škofljica percorre circa 600 m su pista sterrata fino all'imbocco.


      Il parco cura visite guidate per scuole e sul proprio portale offre mappe interattive dei percorsi e
      delle testimonianze palafitticole.
    history: >-
      Nell'aprile 2002 sono stati portati alla luce i resti di una ruota in legno con asse di circa 5150 anni
      fa, la più antica mai scoperta in Europa. Due complessi di palafitte preistoriche sono iscritti nel
      Patrimonio Mondiale UNESCO, e l'area fa parte di Natura 2000 dal 2004.


      Il parco paesaggistico è stato istituito con decreto governativo in vigore dal 13 dicembre 2008,
      classificato in Categoria V IUCN. Racchiude 15 aree a tutela rafforzata: nove monumenti naturali e sei
      riserve integrali, tra cui Goriški mah e Iški morost.


      L'agricoltura intensiva ha ridotto i prati stabili umidi e le siepi arbustive. La penetrazione di specie
      botaniche aliene costituisce un'ulteriore criticità ecologica.
    before: >-
      Gran parte dei sentieri è esposta al sole: in estate porta cappello e repellente per insetti. Il
      sentiero Pot na Mah attraversa settori golenali soggetti a inondazioni periodiche. Conduci i cani al
      guinzaglio: il chiurlo maggiore nidifica al suolo nell'erba alta. Per il birdwatching sono richieste
      discrezione e pazienza.
    around: >-
      A circa 10 km si eleva l'[Altopiano carsico del Nanos](/lugar/kraska-planota-nanos/), a 16 km si trova
      il [Lago intermittente di Cerknica](/lugar/cerknisko-jezero/) e a circa 20 km i [Boschi e Altopiano
      carsico di Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) e il [Complesso forestale di
      Kočevsko](/lugar/kocevski-gozdni-kompleks/). Più lontano, il [Parco nazionale
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) condivide con il barje il re di quaglie e le
      praterie inondabili.
  pt:
    intro: >-
      Há dois milhões de anos, as forças tectónicas afundaram o solo mais de 200 m na zona de colisão entre os
      Alpes e os Dináridos, e desde essa época essa bacia não cessou de se atulhar com sedimentos, águas
      freáticas e turfa. A sul de Liubliana, o resultado é o Ljubljansko barje, o maior paul da Eslovénia, um
      mosaico de prados húmidos, valas de drenagem, sebes de amieiro e matas ripícolas no qual o parque
      paisagístico tutela 135 km² dos 163 km² globais. Aqui a primavera assinala-se pelo roxo das fritilárias
      e pelo retorno das aves migradoras.
    landscape: >-
      O paul forma uma depressão aluvial e a sua fisionomia oscila ao ritmo dos regimes hídricos. Do bordo sul
      chega o rio Ljubljanica, brotando de várias nascentes cársticas e serpenteando cerca de 20 km pelo paul
      com um desnível quase nulo; as cheias da primavera e do outono submergem habitualmente largas parcelas
      da planície.


      A turfeira desenvolveu-se até ao século XIX, altura em que se iniciaram grandes obras de dessecação
      seguidas da extração de turfa para combustível. Da antiga turfeira alta restam retalhos em redor de
      Bevke, em Goričica e Kostanjevica. Os habitantes locais denominam a zona de «Mah» pelas esfagnáceas; o
      vocábulo contemporâneo «barje» foi vulgarizado pelo escritor Fran Levstik, substituindo o termo
      tradicional *Ljubljansko močvirje*.


      A paisagem contemporânea surge dividida em faixas lineares. Alas de amieiro-negro com dois metros de
      largura, paralelas aos canais, delimitam os talhões rurais. Os prados húmidos formam o habitat mais
      valioso, contíguos a florestas de inundação, canais e sebes.
    wildlife: >-
      A primavera é a melhor altura para a avifauna: nidificação e migração coincidem, os machos marcam
      território em cantos nupciais e o estrato herbáceo mantém-se rasteiro. No início da estação as
      fritilárias pintam os prados de violeta, acompanhando o regresso das aves: o
      [cartaxo-nortenho](/especie/saxicola_rubetra/) chega no final de abril ou início de maio empoleirando-se
      nos juncos, enquanto o picanço-de-dorso-ruivo regressa em maio. Os grous-comuns realizam paragens
      migratórias em bandos em V.


      No verão, o esquivo [codornizão](/especie/crex_crex/) estagia de maio a setembro, sendo a única ave
      globalmente vulnerável a nidificar no paul. O seu canto assemelha-se ao afiar de uma foice; as ceifas
      prematuras ameaçam os ninhos ocultos no solo. O [maçarico-real](/especie/numenius_arquata/) depende
      igualmente destes prados: cerca de dez casais formam a única população nidificante estável da Eslovénia.


      Ao longo de todo o ano, 107 espécies de aves nidificam com regularidade no paul, que serve também de
      área de invernada. Entre os 45 mamíferos, a [lontra-europeia](/especie/lutra_lutra/) surge junto ao
      Ljubljanica e ao Iščica. O [cágado-de-carapaça-estriada](/especie/emys_orbicularis/) tornou-se muito
      raro. Os biólogos inventariaram mais de seis mil espécies vivas, tendo a borboleta das turfeiras sido
      reintroduzida com êxito em Iški morost em 2021.


      O início da manhã proporciona as melhores observações. A meio do dia as aves recolhem ao resguardo.
    visit: >+
      O parque dispõe de seis percursos temáticos: Pot na Mah, Pot Morostig, Pot med jelšami, Pot Barjanska
      okna, Učna pot Bevke e Pot ob reki Iški – Okljuk. Dois trajetos facultam uma introdução compreensiva.


      O trilho **Pot na Mah** forma um circuito de 3,8 km em terra batida para caminhada ou bicicleta. Tem
      início no quartel de bombeiros de Goričica pod Krimom, transpõe uma elevação e desce para a reserva
      natural de Goriški mah, testemunho de turfeira com posto de observação de aves e sala de aula ao ar
      livre.


      O trilho **Pot Morostig** estende-se por 1,5 km entre caminhos rurais e passadiços de madeira. Parte do
      centro de interpretação Morostig em Ig e segue marcas em forma de palafita até à reconstituição de uma
      aldeia pré-histórica acessível com guia. Quem viaja de autocarro ou estaciona na estrada Ig–Škofljica
      percorre cerca de 600 m por caminho de terra até ao início.


      O parque promove visitas acompanhadas para escolas e disponibiliza mapas interativos dos percursos e
      estações arqueológicas.

    history: >-
      Em abril de 2002 foram desenterrados os restos de uma roda de madeira com eixo com cerca de 5150 anos, a
      mais antiga descoberta na Europa. Dois sítios de palafitas pré-históricas estão inscritos na Lista do
      Património Mundial da UNESCO, e o paul integra a rede Natura 2000 desde 2004.


      O parque paisagístico foi instituído por decreto governamental com efeitos a partir de 13 de dezembro de
      2008, enquadrado na Categoria V da UICN. Compreende 15 áreas de proteção estrita: nove monumentos
      naturais e seis reservas naturais, entre as quais Goriški mah e Iški morost.


      A intensificação agrícola provocou a redução dos prados húmidos e das sebes ripícolas. As plantas
      invasoras representam um fator adicional de perturbação ecológica.
    before: >-
      A maioria dos caminhos carece de sombra: no verão leva proteção solar e repelente de insetos. O trilho
      Pot na Mah atravessa zonas periodicamente inundadas várias vezes por ano. Os cães devem circular sempre
      presos por trela: o maçarico-real nidifica no chão na erva alta. Para observar aves requer-se silêncio e
      paciência.
    around: >-
      A cerca de 10 km ergue-se o [Planalto Cársico de Nanos](/lugar/kraska-planota-nanos/), a 16 km
      estende-se o [Lago Intermitente de Cerknica](/lugar/cerknisko-jezero/) e a cerca de 20 km os [Bosques e
      Planalto Cársico de Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) e o [Complexo
      Florestal de Kočevsko](/lugar/kocevski-gozdni-kompleks/). Longe daqui, o [Parque Nacional
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) partilha com o barje o codornizão e os prados
      alagados.
