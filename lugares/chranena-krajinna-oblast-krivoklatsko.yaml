resumen:
  es: Mosaico excepcional de bosques de roble y haya en las gargantas sinuosas del río Berounka.
  en: Exceptional mosaic of oak and beech forests draping the winding canyon gorges of the Berounka River.
  fr: Mosaïque forestière exceptionnelle de chênaies et hêtraies drapant les gorges sinueuses de la Berounka.
  de: Außergewöhnliches Mosaik aus Eichen- und Buchenwäldern in den gewundenen Felsschluchten der Berounka.
  it: Mosaico forestale di querceti e faggete che fascia le gole tortuose scavate dal fiume Berounka.
  pt: Mosaico excecional de carvalhais e faiais debruçados sobre as gargantas meandriformes do rio Berounka.
unico:
  es: Un bosque que fue coto real y sigue guardando tejos, trilobites y estepas diminutas en las cumbres.
  en: >-
    A former royal hunting preserve that still shelters yew woodlands, Cambrian trilobites, and miniature
    steppe enclaves along rocky crests.
  fr: >-
    Un ancien domaine de chasse royal abritant ifs sauvages, trilobites cambriens et îlots de steppe rocheuse
    au sommet des falaises.
  de: >-
    Ein ehemaliges königliches Jagdrevier, das bis heute Eibenbestände, kambrische Trilobiten und
    Felsensteppen auf Bergkuppen bewahrt.
  it: >-
    Un bosco nato come riserva di caccia reale che conserva tassi secolari, trilobiti fossili e oasi steppiche
    sulle creste.
  pt: >-
    Uma mata outrora coutada real que preserva teixos seculares, trilobites fósseis e diminutos enclaves
    estepários nas cumeadas.
observaciones:
  es: >-
    Las normas del gestor son claras. Está prohibido coger fósiles; para conocer el pasado paleontológico, usa
    el sendero Po stopě trilobita, en Skryje. En las reservas naturales nacionales hay que ceñirse a los
    caminos señalizados. Los perros van con correa para no poner en peligro a la fauna, y la bicicleta se usa
    solo por caminos y ciclorrutas señalizadas. Mira la web del gestor antes de salir por si hay avisos o
    restricciones.
texto:
  es:
    intro: >-
      Antes de ser parque, esto fue el coto del rey. Desde la Edad Media temprana Křivoklátsko era un bosque
      de caza real, y por eso sus grandes masas de árbol se conservaron a propósito, mientras el resto de
      Bohemia se talaba y se aró. Hoy el resultado es un país de bosques de hoja caduca en el centro de
      Chequia, cortado por el cañón del Berounka, con laderas rocosas, pedregales y, en algunas cumbres,
      claros abiertos donde crecen plantas de estepa. Las cifras lo dicen mejor que el adjetivo: los bosques
      cubren el 62 % del territorio, muy por encima de la media del país, y se han contado más de 1800 taxones
      de plantas vasculares.
    landscape: >-
      Dos fenómenos mandan aquí. El primero es el del río: el Berounka se ha encajado en un valle profundo,
      con laderas escarpadas y, en los meandros, terrazas fluviales. El segundo es el de las cumbres, claros
      sin bosque que llaman *pleše* y donde crecen hierbas secas y matorrales de estepa. Entre esos dos mundos
      queda el bosque: caducifolio, con robledales y bosques de roble y haya, además de tejos.


      La roca explica buena parte de esta diversidad. En el Cámbrico el mar llegó hasta los alrededores de
      Skryje, y dejó pizarras ricas en fósiles de trilobites, braquiópodos y equinodermos. La lluvia es algo
      inferior a la media del país, porque el territorio queda al borde de la sombra pluviométrica de los
      Montes Metálicos.


      La vegetación sigue el mapa de la roca. En los pedregales, antes de que los árboles echen hoja, las
      anémonas y las campanillas de primavera cubren el suelo en alfombras. Arriba, en las cumbres abiertas,
      viven robles enanos y plantas de estepa cálida como Dictamnus albus y Pulsatilla pratensis. El gestor
      mantiene incluso una página, «Co tu kvete?», con lo que está en flor en cada momento: sirve para elegir
      la fecha de la visita.
    wildlife: >-
      La riqueza animal sale de la mezcla de hábitats. Se han registrado 120 especies de aves nidificantes y
      35 de paso migratorio, 60 de mamíferos, 8 de reptiles, 12 de anfibios, 750 de mariposas y 1500 de
      escarabajos.


      Para las aves, mira primero a las rocas y luego al bosque. En los afloramientos desnudos anidan el [búho
      real](/especie/bubo_bubo/) y el cernícalo vulgar. En los robledales con hayas crían el [milano
      real](/especie/milvus_milvus/), el [halcón abejero](/especie/pernis_apivorus/) y el azor, junto al [pito
      negro](/especie/dryocopus_martius/). La zona es un lugar importante de cría de la [cigüeña
      negra](/especie/ciconia_nigra/), y entre las rapaces nocturnas anida el
      [mochuelo](/especie/glaucidium_passerinum/) kulíšek nejmenší y, con rareza, el sýc rousný. Junto al río
      puedes ver el [águila pescadora](/especie/pandion_haliaetus/) en paso, el [martín
      pescador](/especie/alcedo_atthis/) y el [mirlo acuático](/especie/cinclus_cinclus/); el [pigargo
      europeo](/especie/haliaeetus_albicilla/) anida de forma rara.


      Entre los mamíferos manda el [ciervo](/especie/cervus_elaphus/), el gran vertebrado dominante del
      bosque, y son abundantes el [corzo](/especie/capreolus_capreolus/) y el [jabalí](/especie/sus_scrofa/).
      Hay salamandras comunes junto a los arroyos y manantiales, y entre los escarabajos vive el [ciervo
      volante](/especie/lucanus_cervus/), el mayor del país. En el agua destacan el bivalvo velevrub tupý y el
      cangrejo de las piedras, con poblaciones numerosas.


      Cada reserva tiene su carácter. En la reserva nacional Týřov, un mosaico de hábitats, hay una población
      numerosa de tejo y una fauna rica de invertebrados. La de Nezabudické skály es un lugar
      extraordinariamente rico en reptiles, y la de Kabečnice, sobre las rocas y laderas del Berounka, alberga
      la orquídea vstavač kukačka, que la agencia califica de críticamente amenazada.
    visit: >-
      Lo mejor es hacerlo con los senderos didácticos del gestor. Brdatka mide siete kilómetros, lleva 17
      paneles sobre la reserva, la fauna, la flora y el bosque, y regala vistas del valle del Berounka. Si
      prefieres un paseo fácil, hay uno de 7,5 km entre Zbečno y Křivoklát, en parte por el mismo sendero.


      Para el cañón, la excursión Kaňonem Berounky za eremitem recorre casi 10 km por el valle y dos reservas,
      U Eremita y Nezabudické skály. Empieza y acaba en el mismo aparcamiento; en U Eremita el camino se
      estrecha en una ladera empinada y exige mucho cuidado. En U Eremita hay además una senda que ayuda a
      reconocer treinta y cinco especies de árboles y arbustos.


      Los amantes de la paleontología tienen dos citas en Skryje. El sendero Po stopě trilobita empieza en el
      museo, termina en el aparcamiento de la iglesia y tiene paneles de cómic, miradores y un punto sobre el
      puente para buscar un fósil. La ruta Okolí Skryj mide 10 km, empieza en el aparcamiento, donde hay
      parada de autobús, y llega a la reserva Jezírka, al Památník Joachima Barranda y a las ruinas de Týřov.


      Para algo más largo y distinto, el sendero acuático del Berounka mide 58 km y tiene 14 paradas con
      paneles sobre el río, la naturaleza, la historia y personajes locales. Empieza en Zvíkovec y está
      pensado para quienes recorren el río.
    history: >-
      El coto real preservó las masas forestales a propósito. Mucho antes, en Stradonice hubo un oppidum celta
      de la época de La Tène tardía, de importancia centroeuropea.


      La UNESCO reconoció el territorio como reserva de la biosfera en 1977, dentro del programa Hombre y
      Biosfera, y la red Natura 2000 comprende aquí 16 lugares de importancia comunitaria y una zona de
      protección de aves. Las amenazas son actuales: el aumento del visón americano asilvestrado causa
      problemas a la fauna, y las altas poblaciones de ungulados dañan a las comunidades más expuestas, por lo
      que el estudio faunístico pide reducirlas de forma dirigida.
    before: >-
      Las normas del gestor son claras. Está prohibido coger fósiles; para conocer el pasado paleontológico,
      usa el sendero Po stopě trilobita, en Skryje. En las reservas naturales nacionales hay que ceñirse a los
      caminos señalizados. Los perros van con correa para no poner en peligro a la fauna, y la bicicleta se
      usa solo por caminos y ciclorrutas señalizadas. Mira la web del gestor antes de salir por si hay avisos
      o restricciones.
  en:
    intro: >-
      Before it became a protected landscape, this was royal hunting domain. From the early Middle Ages
      Křivoklátsko was preserved deliberately as a sovereign hunting forest, shielding vast contiguous
      canopies while much of Bohemia was cleared and turned by the plough. Today the legacy is a magnificent
      deciduous heartland in Central Bohemia, carved deeply by the meandering Berounka canyon with precipitous
      screes and open hilltop clearings hosting steppe flora. The statistics reveal its ecological caliber:
      woodlands cover 62 % of the territory, far exceeding national averages, and over 1800 vascular plant
      taxa have been documented.
    landscape: >-
      Two geological dynamics govern the landscape. The first is fluvial incision: the Berounka River has
      gouged a deep winding canyon flanked by rocky talus and terraced meanders. The second is the presence of
      unwooded summit bald spots called *pleše*, where dry grasses and xerothermic steppe shrubs thrive.
      Between these extremes flourishes diverse deciduous woodland: thermophilous oakwoods, oak-hornbeam,
      mountain beechwoods, and native yews.


      Bedrock explains this richness. During the Cambrian period ancient seas reached modern Skryje, laying
      down fossiliferous shales packed with trilobites, brachiopods, and echinoderms. Precipitation is
      slightly lower than national means, shadowed by the Ore Mountains.


      Vegetation faithfully maps geology. On scree slopes before trees leaf out, spring snowflakes and wood
      anemones spread dense flower carpets. Up on exposed rocky bluffs thrive stunted oaks and steppe plants
      like Dictamnus albus and Pulsatilla pratensis. The agency even maintains a live «Co tu kvete?» seasonal
      flowering bulletin to help visitors choose excursion dates.
    wildlife: >-
      Habitat diversity generates extraordinary faunal abundance. Records document 120 breeding bird species
      and 35 migratory passage species, 60 mammals, 8 reptiles, 12 amphibians, 750 butterflies, and 1500
      beetles.


      For birds, scan crags and then forest canopies. Bare rocky bastions accommodate the [Eurasian
      eagle-owl](/especie/bubo_bubo/) and common kestrel. Mature mixed oak-beech stands shelter the [red
      kite](/especie/milvus_milvus/), [European honey buzzard](/especie/pernis_apivorus/), northern goshawk,
      and [black woodpecker](/especie/dryocopus_martius/). The reserve forms a vital breeding area for the
      [black stork](/especie/ciconia_nigra/), while small nocturnal owls include the [Eurasian pygmy
      owlet](/especie/glaucidium_passerinum/) (*kulíšek nejmenší*) and rare boreal owls. River corridors
      attract passing [ospreys](/especie/pandion_haliaetus/), the [common
      kingfisher](/especie/alcedo_atthis/), and [white-throated dipper](/especie/cinclus_cinclus/); the
      [white-tailed eagle](/especie/haliaeetus_albicilla/) is an occasional breeder.


      Mammals are dominated by [red deer](/especie/cervus_elaphus/), the primary forest ungulate, alongside
      plentiful [roe deer](/especie/capreolus_capreolus/) and [wild boar](/especie/sus_scrofa/). Fire
      salamanders frequent headwater springs, while deadwood stands support the [stag
      beetle](/especie/lucanus_cervus/), Central Europe's largest coleopteran. River shoals harbor
      thick-shelled river mussels and stone crayfish.


      Each reserve retains individual character: Týřov National Nature Reserve preserves ancient yews and rich
      insect faunas; Nezabudické skály crags shelter abundant reptiles; Kabečnice protects the critically
      endangered green-winged orchid (*Anacamptis morio*).
    visit: >-
      The best approach is via educational nature trails. The Brdatka trail spans seven kilometres with 17
      interpretive panels on forest ecology, geology, and wildlife, offering panoramic river views. A gentle
      7.5 km walk links Zbečno to Křivoklát, partly tracing this path.


      To explore the canyon, the Kaňonem Berounky za eremitem loop covers nearly 10 km through U Eremita and
      Nezabudické skály reserves from a central parking area; through U Eremita the footpath narrows along
      steep rock ledges and requires sure footwork. An arboretum path in U Eremita identifies thirty-five
      native tree and shrub species.


      Paleontology enthusiasts should visit Skryje. The Po stopě trilobita trail starts at the museum, ending
      at the church with comic-strip panels, viewpoints, and a bridge fossil locality. The 10 km Okolí Skryj
      circuit links Jezírka pools, the Joachim Barrande Memorial, and Týřov castle ruins.


      For paddlers, the 58 km Berounka water trail features 14 riverside information stops on local ecology
      and history from Zvíkovec downstream.
    history: >-
      Royal hunting tenure deliberately protected these vast woodlands from feudal forest clearing. Much
      earlier, Stradonice was the site of a celebrated late Iron Age Celtic oppidum of European prominence.


      UNESCO designated Křivoklátsko a biosphere reserve in 1977 under the Man and the Biosphere programme,
      and the Natura 2000 network encompasses 16 Sites of Community Importance and a Special Protection Area.
      Invasive American mink and overabundant ungulate herds currently pose management challenges requiring
      controlled population culls.
    before: >-
      The reserve regulations are unambiguous. Collecting fossils is strictly prohibited; to discover the
      palaeontological heritage, follow the Po stopě trilobita educational trail in Skryje. In the national
      nature reserves you must keep strictly to marked trails. Dogs must be kept on a leash to avoid
      disturbing wildlife, and bicycles are permitted only on marked paths and designated cycle routes.
      Consult the administration website before setting out for any current notices or seasonal restrictions.
  fr:
    intro: >-
      Avant d'être une réserve paysagère, ce territoire fut le domaine privé des rois de Bohême. Dès le haut
      Moyen Âge, Křivoklátsko constituait une forêt royale réservée à la vénerie, ce qui permit de conserver
      de vastes massifs boisés continus alors que le reste du pays était défriché et labouré. Aujourd'hui, le
      paysage déploie un royaume de feuillus au cœur de la Tchéquie, entaillé par le canyon sauvage de la
      Berounka, ponctué d'éboulis rocheux et de clairières sommitales steppiques. Les chiffres témoignent de
      cette vigueur : la forêt couvre 62 % du territoire, bien au-delà des moyennes nationales, et abrite plus
      de 1800 taxons de plantes vasculaires.
    landscape: >-
      Deux dynamiques majeures régissent la région. La première est fluviale : la Berounka a creusé une vallée
      encaissée aux versants abrupts découpés de méandres et de terrasses alluviales. La seconde est sommital
      : des clairières herbeuses perchées appelées *pleše*, où prospèrent graminées xérophiles et buissons
      steppiques. Entre ces deux mondes règne la forêt de feuillus : chênaies thermophiles, forêts mixtes de
      chênes et hêtres, et peuplements d'ifs indigènes.


      La géologie éclaire cette abondance. Au Cambrien, une mer chaude occupait les environs de Skryje,
      déposant des schistes mondialement réputés pour leurs fossiles de trilobites, brachiopodes et
      échinodermes. La pluviométrie reste modérée en raison de l'ombre pluviométrique des monts Métallifères.


      La flore épouse la mosaïque des sols. Sur les éboulis, avant la feuillaison, anémones et nivéoles
      printanières forment des tapis continus. Sur les crêtes rocheuses ensoleillées croissent des chênes
      rabougris et des espèces de steppe chaude comme Dictamnus albus et Pulsatilla pratensis. Le gestionnaire
      publie même une page d'actualité florale pour guider les naturalistes.
    wildlife: >-
      La diversité des biotopes engendre une remarquable faune sauvage : 120 espèces d'oiseaux nicheurs et 35
      migratrices, 60 mammifères, 8 reptiles, 12 amphibiens, 750 papillons et 1500 coléoptères.


      Pour l'avifaune, observez les falaises puis la futaie. Sur les parois rocheuses nichent le [hibou
      grand-duc](/especie/bubo_bubo/) et le faucon crécerelle. Dans les chênaies-hêtraies se reproduisent le
      [milan royal](/especie/milvus_milvus/), la [bondrée apivore](/especie/pernis_apivorus/), l'autour des
      palombes et le [pic noir](/especie/dryocopus_martius/). Le secteur est un bastion pour la [cigogne
      noire](/especie/ciconia_nigra/), tandis que parmi les rapaces nocturnes nichent la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/) et la chouette de Tengmalm. En bordure de rivière s'observent
      le [balbuzard pêcheur](/especie/pandion_haliaetus/) de passage, le [martin-pêcheur
      d'Europe](/especie/alcedo_atthis/) et le [cincle plongeur](/especie/cinclus_cinclus/) ; le [pygargue à
      queue blanche](/especie/haliaeetus_albicilla/) y hiverne et niche occasionnellement.


      Parmi les mammifères règne le [cerf élaphe](/especie/cervus_elaphus/), le grand herbivore emblématique,
      aux côtés de nombreux [chevreuils](/especie/capreolus_capreolus/) et [sangliers](/especie/sus_scrofa/).
      La salamandre tachetée fréquente ruisseaux et suintements, et le [lucane
      cerf-volant](/especie/lucanus_cervus/) habite le vieux bois mort. Les eaux vives abritent denses
      populations d'écrevisses de torrent et de moules de rivière.


      Chaque réserve présente une identité marquée : Týřov conserve de vénérables ifs et une riche faune
      entomologique ; Nezabudické skály abrite une herpétofaune abondante ; Kabečnice protège l'orchis
      bouffon, hautement menacé.
    visit: >-
      Les sentiers didactiques offrent d'excellents parcours. Le sentier de Brdatka s'étire sur sept
      kilomètres et propose 17 stations thématiques sur la forêt et la faune, avec des belvédères sur la
      Berounka. Un parcours familial de 7,5 km relie Zbečno à Křivoklát.


      Pour parcourir le canyon, l'itinéraire Kaňonem Berounky za eremitem forme une boucle de près de 10 km à
      travers les réserves d'U Eremita et de Nezabudické skály ; à U Eremita, le sentier longe des corniches
      rocheuses escarpées demandant une attention vigilante. Un arboretum y détaille trente-cinq espèces
      d'arbres et arbustes.


      À Skryje, le sentier Po stopě trilobita initie petits et grands aux fouilles paléontologiques avec
      panneaux illustrés. Le circuit Okolí Skryj (10 km) dessert les étangs de Jezírka, le mémorial Joachim
      Barrande et les ruines du château de Týřov.


      Pour les navigateurs, le parcours nautique de la Berounka s'étend sur 58 km jalonné de 14 panneaux
      d'interprétation au départ de Zvíkovec.
    history: >-
      Le privilège cynégétique des souverains préserva délibérément les forêts de l'exploitation agricole.
      Bien antérieurement, Stradonice fut un oppidum celte majeur de la période de La Tène.


      L'UNESCO a classé Křivoklátsko réserve de biosphère en 1977, et le réseau Natura 2000 y compte 16 sites
      d'intérêt communautaire et une zone de protection spéciale. La prolifération du vison d'Amérique et les
      surdensités d'ongulés constituent des défis de gestion actuels.
    before: >-
      Les consignes de gestion sont sans ambiguïté. Il est formellement interdit de prélever des fossiles ;
      pour explorer ce patrimoine paléontologique, parcourez le sentier didactique Po stopě trilobita à
      Skryje. Dans les réserves naturelles nationales, vous devez rester strictement sur les chemins balisés.
      Les chiens doivent être tenus en laisse afin de préserver la faune, et le vélo n'est autorisé que sur
      les pistes et véloroutes balisées. Consultez le site internet du gestionnaire avant votre départ pour
      vérifier d'éventuelles alertes ou restrictions temporaires.
  de:
    intro: >-
      Bevor es Schutzgebiet wurde, war dies königlicher Jagdbannforst. Seit dem frühen Mittelalter war
      Křivoklátsko ein herrschaftliches Jagdrevier, weshalb seine zusammenhängenden Waldmassive geschont
      wurden, während das böhmische Umland gerodet und umgepflügt wurde. Heute präsentiert sich die Region als
      mitteleuropäische Waldlandschaft, tief eingeschnitten vom Canyon der Berounka mit Felsbändern,
      Schutthalden und unbewaldeten Kuppen mit Steppenflora. Wälder bedecken 62 % der Fläche – weit über dem
      Landesschnitt –, und mehr als 1800 Gefäßpflanzensippen wurden nachgewiesen.
    landscape: >-
      Zwei Landschaftsphänomene prägen das Gebiet: Zum einen das Flusstal, in dem sich die Berounka tief
      zwischen Steilhängen und Terrassenmäandern eingegraben hat; zum anderen waldfreie Trockenkuppen, die
      *pleše*, auf denen Steppengräser und wärmeliebende Gebüsche gedeihen. Dazwischen dominieren
      wärmeliebende Eichenwälder, Eichen-Hainbuchenwälder, Buchenwälder und Eibenvorkommen.


      Die Geologie erklärt diese Vielfalt. Im Kambrium reichte ein Flachmeer bis Skryje und hinterließ
      Schieferbänke voller Trilobiten, Brachiopoden und Stachelhäuter. Die Niederschläge liegen unter dem
      böhmischen Durchschnitt, bedingt durch den Regenschatten des Erzgebirges.


      Die Vegetation folgt den Gesteinen: Auf Schutthalden blühen vor dem Laubaustrieb Frühlings-Knotenblumen
      und Buschwindröschen in dichten Teppichen. Auf sonnigen Felsköpfen überdauern Krüppeleichen und
      Steppenpflanzen wie Dictamnus albus und Wiesen-Kuhschelle. Die Verwaltung bietet auf «Co tu kvete?»
      aktuelle Blühberichte zur Tourenplanung.
    wildlife: >-
      Die Strukturvielfalt bedingt eine reiche Tierwelt: 120 Brutvogelarten und 35 Durchzügler, 60
      Säugetierarten, 8 Reptilien, 12 Amphibien, 750 Schmetterlinge und 1500 Käferarten sind dokumentiert.


      An Felswänden brüten [Uhu](/especie/bubo_bubo/) und Turmfalke. In alten Eichen- und Buchenwäldern nisten
      [Rotmilan](/especie/milvus_milvus/), [Wespenbussard](/especie/pernis_apivorus/), Habicht und
      [Schwarzspecht](/especie/dryocopus_martius/). Das Gebiet ist ein wichtiges Brutzentrum für den
      [Schwarzstorch](/especie/ciconia_nigra/), während unter den Eulen der
      [Sperlingskauz](/especie/glaucidium_passerinum/) und Raufußkauz vorkommen. Am Fluss jagen durchziehende
      [Fischadler](/especie/pandion_haliaetus/), [Eisvogel](/especie/alcedo_atthis/) und
      [Wasseramsel](/especie/cinclus_cinclus/); der [Seeadler](/especie/haliaeetus_albicilla/) brütet
      vereinzelt.


      Unter den Säugetieren dominiert der [Rothirsch](/especie/cervus_elaphus/) neben zahlreichen
      [Rehen](/especie/capreolus_capreolus/) und [Wildschweinen](/especie/sus_scrofa/). Feuersalamander
      bewohnen Quellbäche, Totholzbestände den [Hirschkäfer](/especie/lucanus_cervus/). In sauberen Gewässern
      leben Gemeine Flussmuschel und Steinkrebs in stabilen Vorkommen.


      Die einzelnen Reservate besitzen eigene Schwerpunkte: Týřov schützt alte Eiben und Totholzkäfer;
      Nezabudické skály beherbergt eine reiche Reptilienfauna; Kabečnice bewahrt das Kleine Knabenkraut.
    visit: >-
      Lehrpfade erschließen die Landschaft ideal. Der Brdatka-Weg umfasst sieben Kilometer mit 17 Schautafeln
      zu Flora, Fauna und Geologie und Ausblicken ins Berounka-Tal. Eine leichtere 7,5 km lange Wanderung
      verbindet Zbečno mit Křivoklát.


      Für den Canyon bietet die Tour Kaňonem Berounky za eremitem knapp 10 km durch die Reservate U Eremita
      und Nezabudické skály; bei U Eremita führt der Pfad an steilen Felshängen entlang und erfordert
      Trittsicherheit. Ein Gehölzlehrpfad stellt dort fünfunddreißig heimische Baum- und Straucharten vor.


      Fossilienfreunde finden in Skryje den Pfad Po stopě trilobita mit Infotafeln und Aussichtspunkten. Der
      10 km lange Rundweg Okolí Skryj erschließt die Jezírka-Schlucht, das Joachim-Barrande-Denkmal und die
      Burgruine Týřov.


      Für Wasserwanderer bietet der 58 km lange Berounka-Wasserlehrpfad ab Zvíkovec 14 Informationspunkte zu
      Flussökologie und Regionalgeschichte.
    history: >-
      Der fürstliche Jagdbann schützte die Wälder vor mittelalterlicher Rodung. Zuvor lag bei Stradonice ein
      spätlatènezeitliches keltisches Oppidum von überregionaler Bedeutung.


      Die UNESCO erkannte Křivoklátsko 1977 als Biosphärenreservat an; das Natura-2000-Netz umfasst 16
      FFH-Gebiete und ein Vogelschutzgebiet. Die Ausbreitung des Minks und hoher Wildverbiss erfordern
      gezielte Hegemaßnahmen.
    before: >-
      Die Vorgaben der Schutzgebietsverwaltung sind eindeutig. Das Sammeln von Fossilien ist verboten; um die
      paläontologische Vergangenheit zu erkunden, nutze den Lehrpfad Po stopě trilobita in Skryje. In den
      nationalen Naturreservaten musst du stets auf den markierten Wegen bleiben. Hunde sind zwingend an der
      Leine zu führen, um die Tierwelt nicht zu gefährden, und Radfahren ist nur auf gekennzeichneten Wegen
      und Radrouten gestattet. Sieh vor dem Aufbruch auf der Website der Gebietsverwaltung nach, ob aktuelle
      Warnungen oder Einschränkungen vorliegen.
  it:
    intro: >-
      Prima di diventare area protetta, queste selve appartennero alla corona. Sin dall'alto Medioevo
      Křivoklátsko fu riserva venatoria reale, preservando vaste foreste continue mentre il resto della Boemia
      veniva disboscato e coltivato. Oggi il risultato è un regno di latifoglie nel cuore della Repubblica
      Ceca, inciso dal canyon della Berounka tra balze rocciose, macereti e radure sommitali steppiche. I
      boschi coprono il 62 % del territorio, ben al di sopra delle medie ceche, ospitando oltre 1800 specie di
      piante vascolari.
    landscape: >-
      La morfologia è guidata da due forze. La prima è fluviale: la Berounka si è incassata in una forra
      meandriforme con versanti ripidi e terrazzi alluvionali. La seconda è sommitale: radure rocciose prive
      di alberi denominate *pleše*, dove vegetano erbe xerofile e cespuglieti di steppa. Tra questi ambienti
      si estende il manto forestale: querceti termofili, boschi misti di cerro, farnia e faggio, con cospicue
      formazioni di tasso.


      La geologia chiarisce tale ricchezza. Nel Cambriano il mare sommergeva i dintorni di Skryje, lasciando
      argilliti celebri per i giacimenti di trilobiti, brachiopodi ed echinodermi. Le piogge sono moderate per
      l'ombra pluviometrica dei Monti Metalliferi.


      La vegetazione riflette i suoli: sui ghiaioni fioriscono a inizio primavera anemoni e campanellini in
      estesi tappeti. Sui crinali assolati allignano querce nane e piante steppiche come Dictamnus albus e
      Pulsatilla pratensis. L'ente gestore pubblica il bollettino «Co tu kvete?» con lo stato delle fioriture
      per pianificare l'uscita.
    wildlife: >-
      La compenetrazione degli ambienti sostiene una fauna pregevole: 120 specie di uccelli nidificanti e 35
      di passo, 60 mammiferi, 8 rettili, 12 anfibi, 750 farfalle e 1500 coleotteri.


      Per gli uccelli, osserva le rupi e i boschi maturi. Sulle balze scoperte nidificano il [gufo
      reale](/especie/bubo_bubo/) e il gheppio. Nei querceti montani nidificano il [nibbio
      reale](/especie/milvus_milvus/), il [falco pecchiaiolo](/especie/pernis_apivorus/), l'astore e il
      [picchio nero](/especie/dryocopus_martius/). L'area è un caposaldo per la [cicogna
      nera](/especie/ciconia_nigra/), mentre tra gli strigiformi spiccano la [civetta
      nana](/especie/glaucidium_passerinum/) e la civetta capogrosso. Lungo l'acqua transitano il [falco
      pescatore](/especie/pandion_haliaetus/), il [martin pescatore](/especie/alcedo_atthis/) e il [merlo
      acquaiolo](/especie/cinclus_cinclus/); l'[aquila di mare](/especie/haliaeetus_albicilla/) vi nidifica
      raramente.


      Tra i mammiferi primeggia il [cervo](/especie/cervus_elaphus/), dominante nei boschi, assieme ad
      abbondanti [caprioli](/especie/capreolus_capreolus/) e [cinghiali](/especie/sus_scrofa/). La salamandra
      pezzata popola i ruscelli, e nel legno morto alligna il [cervo volante](/especie/lucanus_cervus/). Nei
      torrenti non mancano gamberi di fiume e bivalvi d'acqua dolce.


      Ogni riserva vanta una propria vocazione: Týřov protegge tassi secolari e insetti xilofagi; Nezabudické
      skály ospita una densa fauna erpetologica; Kabečnice tutela l'orchidea alata minacciata.
    visit: >-
      I sentieri didattici rappresentano il modo ideale di visita. Il percorso di Brdatka copre sette
      chilometri con 17 pannelli illustrativi su boschi e fauna, aprendo scorci sulla Berounka. Un tratto
      agevole di 7,5 km collega Zbečno a Křivoklát.


      Nel canyon, l'anello Kaňonem Berounky za eremitem copre circa 10 km attraverso le riserve U Eremita e
      Nezabudické skály partendo da un comodo parcheggio; a U Eremita il sentiero si fa stretto lungo pareti
      rocciose richiedendo cautela. Vi si trova anche un arboreto didattico con trentacinque specie legnose
      autoctone.


      A Skryje gli appassionati di fossili possono percorrere il sentiero Po stopě trilobita, arricchito da
      pannelli didattici. L'anello Okolí Skryj (10 km) tocca i laghetti Jezírka, il memoriale Barrande e le
      rovine del castello di Týřov.


      Per i canoisti, l'itinerario nautico della Berounka si snoda per 58 km con 14 soste informative a
      partire da Zvíkovec.
    history: >-
      Il privilegio di caccia reale salvò i boschi dai disboscamenti medievali. In epoca preromana a
      Stradonice sorse un celebre oppidum celtico di epoca tardolaeteniana.


      L'UNESCO ha insignito Křivoklátsko del titolo di riserva della biosfera nel 1977; la rete Natura 2000
      conta 16 siti di interesse comunitario e una ZPS. La diffusione del visone americano e l'eccessivo
      carico di ungulati rappresentano attuali criticità ambientali.
    before: >-
      Le prescrizioni dell'ente gestore sono categoriche. È severamente vietato raccogliere fossili; per
      approfondire il passato paleontologico, percorri il sentiero didattico Po stopě trilobita a Skryje.
      Nelle riserve naturali nazionali occorre attenersi scrupolosamente ai percorsi tracciati. I cani vanno
      tenuti sempre al guinzaglio per non arrecare danno alla fauna selvatica, e le biciclette possono
      circolare solo sui sentieri e sulle ciclovie segnate. Consulta il sito web dell'ente prima di partire
      per verificare avvisi o limitazioni in corso.
  pt:
    intro: >-
      Antes de ser classificada, esta mata constituiu coutada exclusiva dos reis da Boémia. Desde a Alta Idade
      Média Křivoklátsko funcionou como reserva de caça régia, permitindo salvaguardar extensos maciços
      florestais contínuos enquanto o resto da Boémia era arroteado e lavrado. O resultado contemporâneo é um
      território de folhosas no centro da Chéquia, rasgado pelo desfiladeiro do Berounka entre arribas
      rochosas, cascalheiras e clareiras estepárias nas cumeadas. As matas cobrem 62 % do território, bem
      acima da média nacional, abrigando mais de 1800 táxones de plantas vasculares.
    landscape: >-
      O relevo é condicionado por dois elementos fundamentais: o entalhe do Berounka num vale profundo com
      encostas abruptas e meandros socalcados; e as clareiras desarborizadas nas cristas chamadas *pleše*,
      onde vingam gramíneas secas e matos estepários. Entre estes horizontes floresce a floresta caducifólia:
      carvalhais termófilos, matas mistas de carvalho e faia, e teixos autóctones.


      A geologia fundamenta esta variedade: no Câmbrico o mar banhou as imediações de Skryje, depositando
      xistos afamados pelos fósseis de trilobites, braquiópodes e equinodermes. A pluviosidade é moderada
      devido à barreira orográfica dos Montes Metalíferos.


      A flora acompanha a litologia: nas cascalheiras, antes de as copas rebentarem, anémonas e
      campainhas-brancas alcatifam o chão. Nas cristas soalheiras subsistem carvalhos anões e plantas de
      estepe quente como Dictamnus albus e Pulsatilla pratensis. A administração disponibiliza o boletim «Co
      tu kvete?» para planear excursões botânicas.
    wildlife: >-
      O entrelaçamento de biótopos sustenta expressiva biodiversidade faunística: 120 espécies de aves
      nidificantes e 35 migradoras, 60 mamíferos, 8 répteis, 12 anfíbios, 750 borboletas e 1500 escaravelhos.


      Nas escarpas desnudas nidificam o [bufo-real](/especie/bubo_bubo/) e o peneireiro-vulgar. Nas matas
      maduras criam o [milhafre-real](/especie/milvus_milvus/), o
      [tartaranhão-apívoro](/especie/pernis_apivorus/), o açor e o
      [pica-pau-preto](/especie/dryocopus_martius/). Constitui reduto basilar para a
      [cegonha-preta](/especie/ciconia_nigra/), nidificando entre as rapinas noturnas o
      [mocho-pigmeu](/especie/glaucidium_passerinum/) e o mocho-de-tengmalm. Pelo rio ocorrem a [águia
      pescadora](/especie/pandion_haliaetus/) em passagem, o [guarda-rios-comum](/especie/alcedo_atthis/) e o
      [melro-d'água](/especie/cinclus_cinclus/); a [águia-rabalva](/especie/haliaeetus_albicilla/) nidifica
      pontualmente.


      Nos mamíferos domina o [veado-vermelho](/especie/cervus_elaphus/), coexistindo com abundantes
      [corças](/especie/capreolus_capreolus/) e [javalis](/especie/sus_scrofa/). A
      salamandra-de-pintas-amarelas habita as nascentes e a madeira morta alberga a
      [vaca-loura](/especie/lucanus_cervus/). Nas águas correntes persistem mexilhões-de-rio e
      lagostins-de-patas-brancas.


      Cada reserva preserva particularidades: Týřov acolhe teixos seculares e coleópteros raros; Nezabudické
      skály abriga rica comunidade de répteis; Kabečnice protege a orquídea orquis-folhosa ameaçada.
    visit: >-
      Os trilhos interpretativos constituem a melhor forma de exploração. A rota de Brdatka soma sete
      quilómetros com 17 painéis sobre a floresta, a fauna e a geologia, abrindo vistas sobre o Berounka. Um
      percurso suave de 7,5 km une Zbečno a Křivoklát.


      Para percorrer o canhão, a rota Kaňonem Berounky za eremitem perfaz cerca de 10 km através das reservas
      de U Eremita e Nezabudické skály partindo de um estacionamento comum; em U Eremita o trilho estreita-se
      em arribas íngremes requerendo passo firme. Um percurso botânico ilustra trinta e cinco espécies de
      árvores e arbustos autóctones.


      Em Skryje, o trilho Po stopě trilobita aborda o passado paleontológico com painéis didáticos. O anel
      Okolí Skryj (10 km) liga as lagoas Jezírka, o memorial Joachim Barrande e as ruínas de Týřov.


      Para canoístas, o percurso fluvial do Berounka conta com 58 km e 14 paragens com painéis temáticos desde
      Zvíkovec.
    history: >-
      A coutada real preservou os maciços florestais da destruição agrícola medieval. Muito antes, em
      Stradonice ergueu-se um opulento oppidum celta da época de La Tène tardia.


      A UNESCO homologou Křivoklátsko como reserva da biosfera em 1977, congregando a rede Natura 2000 um
      conjunto de 16 sítios de importância comunitária e uma ZPE. A proliferação do visão-americano e as
      densidades de ungulados exigem controlo cinegético.
    before: >-
      As diretrizes da administração são inequívocas. É estritamente proibido recolher fósseis; para conhecer
      o passado paleontológico, segue o trilho didático Po stopě trilobita em Skryje. Nas reservas naturais
      nacionais deves cingir-te com rigor aos trilhos balizados. Os cães devem circular com trela para não pôr
      em perigo a fauna bravia, e a bicicleta utiliza-se apenas em estradas e ciclovias assinaladas. Consulta
      a página oficial da gestão antes da partida para verificar avisos ou eventuais restrições em vigor.
