resumen:
  es: Uno de los tres últimos bosques primarios de Europa montana envolviendo un lago glaciar cristalino.
  en: >-
    One of the last three primeval temperate rainforests in montane Europe wrapping around a pristine glacial
    lake.
  fr: >-
    L’une des trois dernières forêts primaires d’Europe montagnarde enlaçant un lac glaciaire d’une pureté
    cristalline.
  de: >-
    Einer der drei letzten gemäßigten Urwälder Europas, der sich um einen kristallklaren Gletschersee
    schmiegt.
  it: Una delle tre ultime foreste primarie dell’Europa montana adagiata attorno a un limpido lago glaciale.
  pt: Uma das três últimas florestas primárias da Europa de montanha abraçando um lago glaciar cristalino.
unico:
  es: >-
    Una de las tres últimas selvas vírgenes de Europa, con árboles de más de cuatro siglos, y a su lado un
    lago glaciar con un sendero educativo de unos cuarenta minutos.
  en: >-
    One of the last three virgin forests in Europe, boasting trees over four centuries old, alongside a
    pristine glacial lake circled by a forty-minute interpretive path.
  fr: >-
    L’une des trois dernières forêts vierges d’Europe, aux arbres plus que quadricentenaires, bordée par un
    lac glaciaire doté d’un sentier d’interprétation d’une quarantaine de minutes.
  de: >-
    Einer der drei letzten Urwälder Europas mit über vierhundert Jahre alten Bäumen, daneben ein Gletschersee
    mit einem vierzigminütigen Lehrpfad.
  it: >-
    Una delle tre ultime foreste vergini d’Europa, con alberi che superano i quattro secoli, e accanto un lago
    glaciale con un percorso didattico di circa quaranta minuti.
  pt: >-
    Uma das três últimas florestas virgens da Europa, com árvores de mais de quatro séculos, e ao lado um lago
    glaciar com um percurso pedagógico de cerca de quarenta minutos.
observaciones:
  es: >-
    Los grupos organizados de escolares y visitantes deben avisar al centro al menos un día antes. Comprueba
    además con el gestor el estado del parque antes de salir.
texto:
  es:
    intro: >-
      Hay un bosque en Montenegro que lleva protegido desde 1878, cuando la gente de Morača y Rovca regaló
      parte de él al rey Nicolás I, y desde entonces está protegido. Es el bosque primigenio de Biogradska
      Gora, el corazón del Parque Nacional Biogradska Gora, en la montaña de Bjelasica, entre los ríos Tara y
      Lim. Alrededor de la reserva, el parque suma lagos glaciares, pastos de verano y cumbres de más de 2000
      metros.
    landscape: >-
      Bjelasica no se parece al resto de Montenegro. Es de origen volcánico, de formas suaves y redondeadas, a
      diferencia de la mayoría de las montañas calizas y kársticas del país, y su macizo tiene diez cumbres de
      más de 2000 m, la mayor Crna glava, con 2139 m. Bjelasica se compone de cuatro cordales, con tres
      cumbres altas: Crna glava (2139 m), Zekova glava (2117 m) y Troglava (2072 m).


      Entre ellas, los lagos. Además del lago Biogradsko, en el centro del parque, hay otros lagos glaciares:
      Pešića, Ursulovačko (grande y pequeño) y Šiško (grande y pequeño). La lluvia es muy alta, de hasta 100
      pulgadas al año, y permite que crezca un bosque templado húmedo. Junto al lago dominan el haya, el arce
      blanco y el fresno europeo; en las laderas, el haya y el [abeto plateado](/especie/abies_alba/). La
      reserva de bosque primigenio abarca 1600 ha, es estrictamente protegida y está en la cuenca del
      Biogradska y el Jezerštica.
    wildlife: >-
      La primavera es la época de flores en el sotobosque: la floración de srijemuš cubre el hayedo junto al
      lago Biogradsko. El parque tiene unas 2000 especies de plantas, el 20 % endemismos de los Balcanes, y
      unas 90 de árboles. Barbarea balcana crece bajo Zekova glava, cerca del nacimiento del río Biogradska, y
      el arce aparece alrededor del río y del lago.


      La fauna incluye unas 200 especies de aves, 80 de mariposas, 350 de insectos y mamíferos típicos como
      [lobo](/especie/canis_lupus/), [oso pardo](/especie/ursus_arctos/), zorro,
      [ciervo](/especie/cervus_elaphus/), ardilla y lirón. En el lago Biogradsko y la desembocadura del río
      Biogradska vive la rana griega, un endemismo balcánico. En las aguas del parque hay tres especies de
      trucha. El centro educativo de Kolašin está dedicado a la vida silvestre del parque, con especial
      atención a la biología y ecología del oso, y muestra vídeos de cámaras instaladas en un punto de
      alimentación de osos.
    visit: >-
      Casi ochenta kilómetros de senderos señalizados, sobre todo de dificultad media y unos doce kilómetros
      de media, llevan a las cumbres y lagos. El parque tiene seis senderos de montaña señalizados que llegan
      a Crna glava, Troglava y Zekova glava, además de varios lagos glaciares. Por el parque pasa un tramo de
      la transversal de montaña CT-1, de 120 km en total.


      Para una primera visita, el sendero educativo que rodea el lago Biogradsko mide 3,3 km, requiere unos 40
      minutos y es fácil; tiene seis puntos interactivos sobre la flora y la fauna. El sendero temático
      circular Ljeto u katunu mide 2,5 km, es fácil y dura aproximadamente una hora. Hay también una ruta de
      bicicleta de montaña señalizada y una de cross-country, y se puede recorrer el lago en kayak.


      Más alto hay miradores en Crna Glava, Zekova Glava y Bendovac. Por el camino se ven las construcciones
      tradicionales de los pastos y pueblos de Bjelasica, y en verano los pastores ocupan los katunes de
      Pešica rupe, Vranjak, Siska y Vragodo y las laderas se llenan de cencerros.
    history: >-
      Es parque nacional desde 1952, y la UNESCO añadió en 1977 la protección internacional, dentro del
      programa Hombre y Biosfera. Una leyenda cuenta que el lago nació de la maldición de una madre, tras la
      muerte de un hermano a manos de otro en el campo que compartían.
    before: >-
      Los grupos organizados de escolares y visitantes deben avisar al centro al menos un día antes. Comprueba
      además con el gestor el estado del parque antes de salir.
    around: >-
      A nueve kilómetros están el [Nacionalni park Durmitor - Kanjon
      Tare](/lugar/nacionalni-park-durmitor---kanjon-tare/) y, a catorce, el [Nacionalni park Durmitor -
      Masiv](/lugar/nacionalni-park-durmitor---masiv/); a trece queda el [Park prirode
      Komovi](/lugar/park-prirode-komovi/), y a veintidós, el [Kanjon Morače](/lugar/kanjon-morace/).
  en:
    intro: >-
      There is a forest in Montenegro that has enjoyed protection since 1878, when the clans of Morača and
      Rovca gifted a tract of primeval woodland to King Nikola I, and it has remained safeguarded ever since.
      This is the primeval forest of Biogradska Gora, the ecological heart of Biogradska Gora National Park on
      Mount Bjelasica, wedged between the Tara and Lim river basins. Enclosing this ancient woodland reserve,
      the national park gathers jewel-like glacial tarns, highland summer pastures, and mountain peaks rising
      above 2000 metres.
    landscape: >-
      Bjelasica stands out from the rest of Montenegro. Volcanic in origin, it displays gentle, rolling, and
      rounded contours, contrasting sharply with the jagged limestone and karst massifs typical of the
      country; its range boasts ten summits exceeding 2000 m, culminated by Crna Glava at 2139 m. Bjelasica
      comprises four main mountain ridges crowned by three pre-eminent peaks: Crna Glava (2139 m), Zekova
      Glava (2117 m), and Troglava (2072 m).


      Cradled between these crests lie glacial lakes. Beyond Lake Biogradsko at the core of the park, several
      high tarns dot the massif: Pešića Lake, Ursulovačko (Big and Little), and Šiško (Big and Little).
      Precipitation is exceptionally heavy, reaching up to 100 inches annually, nurturing a rare temperate
      rainforest. Around the main lake, European beech, sycamore maple, and European ash predominate; on the
      steeper slopes, beech mingles with [silver fir](/especie/abies_alba/). The strictly protected primeval
      forest reserve spans 1600 ha across the pristine headwaters of the Biogradska and Jezerštica rivers.
    wildlife: >-
      Spring triggers a spectacular floral display across the forest floor: blossoming wild garlic (srijemuš)
      carpets the beech groves bordering Lake Biogradsko. The park shelters some 2000 plant species, with 20 %
      representing regional Balkan endemics, alongside roughly 90 tree species. Barbarea balcana thrives
      beneath Zekova Glava near the source of the Biogradska river, and wild maples flourish along the river
      banks and lake shores.


      Fauna includes approximately 200 bird species, 80 butterfly species, 350 insect taxa, and quintessential
      European forest mammals such as [wolf](/especie/canis_lupus/), [brown bear](/especie/ursus_arctos/), red
      fox, [red deer](/especie/cervus_elaphus/), red squirrel, and dormouse. The Greek stream frog, a Balkan
      endemic, inhabits Lake Biogradsko and the mouth of the Biogradska river. Three species of trout thrive
      within the park’s pristine waterways. The Kolašin education centre showcases park wildlife, focusing
      extensively on brown bear ecology, featuring live camera feeds from a remote bear feeding station.
    visit: >-
      Nearly eighty kilometres of waymarked hiking trails, mostly of moderate grade and averaging twelve
      kilometres in length, lead towards panoramic summits and glacial lakes. The park features six marked
      mountain routes climbing to Crna Glava, Troglava, and Zekova Glava, as well as multiple tarns. A scenic
      section of the CT-1 national mountain transversal, spanning 120 km in total, traverses the park.


      For an introductory walk, the educational nature trail encircling Lake Biogradsko measures 3.3 km, takes
      roughly 40 minutes, and is graded easy; it features six interactive interpretive stations exploring
      local flora and fauna. The circular themed trail Ljeto u katunu spans 2.5 km, is easy, and lasts about
      an hour. There is also a marked mountain biking route and a cross-country trail, and visitors can rent
      wooden rowing boats or kayaks on the lake.


      Higher up, scenic lookouts grace Crna Glava, Zekova Glava, and Bendovac. Along the way hikers discover
      traditional pastoral architecture across Bjelasica’s seasonal settlements; in summer, shepherds reoccupy
      the katuns of Pešića Rupe, Vranjak, Šiška, and Vragodo, filling the slopes with the chime of livestock
      bells.
    history: >-
      The area was declared a national park in 1952, and in 1977 UNESCO granted it international recognition
      under the Man and the Biosphere programme. Local folklore recounts that the lake originated from a
      grieving mother’s curse following a fatal feud between two brothers over their shared wheat field.
    before: >-
      Organised school and visitor groups must notify the park visitor centre at least one day prior to
      arrival. Verify current road and weather conditions with park management before setting out.
    around: >-
      Nine kilometres away lie [Durmitor National Park - Tara River
      Canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/) and, fourteen kilometres distant, [Durmitor
      National Park - Mountain Massif](/lugar/nacionalni-park-durmitor---masiv/); thirteen kilometres away
      stands [Komovi Nature Park](/lugar/park-prirode-komovi/), and twenty-two kilometres away lies [Morača
      River Canyon](/lugar/kanjon-morace/).
  fr:
    intro: >-
      Il existe au Monténégro une forêt protégée depuis 1878, date à laquelle les clans de Morača et de Rovca
      en firent don au roi Nicolas Ier, et qui n’a cessé d’être préservée depuis lors. C’est la forêt primaire
      de Biogradska Gora, cœur battant du parc national de Biogradska Gora, sur le massif de Bjelasica, lové
      entre les bassins de la Tara et du Lim. Tout autour de cette réserve intégrale, le parc réunit lacs
      glaciaires, alpages d’été et sommets culminant à plus de 2000 mètres.
    landscape: >-
      La Bjelasica ne ressemble en rien au reste du Monténégro. D’origine volcanique, elle déploie des reliefs
      doux et arrondis, contrastant avec les massifs calcaires et karstiques dominants du pays ; son massif
      compte dix sommets dépassant 2000 m, le plus haut étant Crna Glava à 2139 m. La Bjelasica se compose de
      quatre crêtes principales, jalonnées de trois grands pics : Crna Glava (2139 m), Zekova Glava (2117 m)
      et Troglava (2072 m).


      Entre ces cimes reposent des lacs glaciaires. Outre le lac Biogradsko, joyau central du parc, se nichent
      d’autres plans d’eau : le lac Pešića, les lacs Ursulovačko (grand et petit) et les lacs Šiško (grand et
      petit). La pluviométrie y est exceptionnellement élevée, atteignant jusqu’à 100 pouces par an,
      nourrissant une véritable forêt tempérée humide. Près du lac prédominent le hêtre, l’érable sycomore et
      le frêne élevé ; sur les versants, le hêtre s’associe au [sapin blanc](/especie/abies_alba/). La réserve
      de forêt primaire couvre 1600 ha rigoureusement protégés dans le bassin versant de la Biogradska et de
      la Jezerštica.
    wildlife: >-
      Le printemps déclenche une floraison spectaculaire sous les futaies : l’ail des ours (srijemuš) tapisse
      les sous-bois de hêtres autour du lac Biogradsko. Le parc abrite environ 2000 espèces végétales, dont 20
      % d’endémismes balkaniques, et près de 90 espèces d’arbres. Barbarea balcana pousse sous Zekova Glava,
      près des sources de la Biogradska, tandis que l’érable se rencontre le long des rives et du lac.


      La faune compte quelque 200 espèces d’oiseaux, 80 espèces de papillons, 350 d’insectes et des mammifères
      emblématiques tels que le [loup](/especie/canis_lupus/), l’[ours brun](/especie/ursus_arctos/), le
      renard, le [cerf élaphe](/especie/cervus_elaphus/), l’écureuil et le loir. Dans le lac Biogradsko et à
      l’embouchure de la rivière vit la grenouille grecque, endémique des Balkans. Trois espèces de truites
      prospèrent dans les eaux du parc. Le centre d’interprétation de Kolašin met en valeur la faune du parc,
      s’attachant particulièrement à l’écologie de l’ours, et diffuse les enregistrements de caméras
      automatiques placées sur un point d’affouragement.
    visit: >-
      Près de quatre-vingts kilomètres de sentiers balisés, de difficulté moyenne et longs d’une douzaine de
      kilomètres en moyenne, conduisent aux sommets et aux lacs. Le parc offre six chemins balisés rejoignant
      Crna Glava, Troglava et Zekova Glava ainsi que divers plans d’eau. Un tronçon de la traversée de
      montagne CT-1, totalisant 120 km, sillonne le parc.


      Pour une première découverte, le sentier pédagogique qui fait le tour du lac Biogradsko mesure 3,3 km,
      demande environ 40 minutes et est très accessible ; il compte six stations interactives dédiées à la
      faune et à la flore. La boucle thématique Ljeto u katunu fait 2,5 km, est facile et dure environ une
      heure. On trouve également un circuit balisé de VTT et une piste de cross-country, et l’on peut explorer
      le lac en barque ou en kayak.


      Plus haut se dévoilent des panoramas grandioses à Crna Glava, Zekova Glava et Bendovac. En chemin
      subsistent les constructions pastorales traditionnelles des katuns de Bjelasica ; en été, les bergers
      réoccupent Pešića Rupe, Vranjak, Šiška et Vragodo, et les pentes s’animent du tintement des sonnailles.
    history: >-
      Classé parc national dès 1952, le site a reçu en 1977 la reconnaissance internationale de l’UNESCO dans
      le cadre du programme sur l’Homme et la Biosphère. Une légende raconte que le lac est né de la
      malédiction d’une mère, après qu’un frère eut tué son cadet dans le champ de blé qu’ils partageaient.
    before: >-
      Les groupes scolaires et organisés doivent avertir le centre d’accueil au moins un jour avant leur
      venue. Vérifiez en outre les conditions d’accès auprès du gestionnaire avant de partir.
    around: >-
      À neuf kilomètres se déploie le [Parc National de Durmitor - Canyon de la
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) et, à quatorze kilomètres, le [Parc National de
      Durmitor - Massif](/lugar/nacionalni-park-durmitor---masiv/) ; à treize kilomètres s’élève le [Parc
      Naturel de Komovi](/lugar/park-prirode-komovi/), et à vingt-deux kilomètres s’ouvre le [Canyon de la
      Morača](/lugar/kanjon-morace/).
  de:
    intro: >-
      In Montenegro existiert ein Wald, der bereits seit 1878 geschützt ist, als die Bewohner von Morača und
      Rovca König Nikola I. einen Teil des Urwalds schenkten, und seither ununterbrochen bewahrt wird. Es ist
      der Urwald von Biogradska Gora, das Herzstück des Nationalparks Biogradska Gora im Bjelasica-Gebirge
      zwischen den Tälern von Tara und Lim. Um dieses Reservat herum vereint der Park eiszeitliche Bergseen,
      Sommeralmen und Gipfel über 2000 Metern.
    landscape: >-
      Die Bjelasica unterscheidet sich grundlegend vom übrigen Montenegro. Sie ist vulkanischen Ursprungs und
      weist sanfte, geschwungene und gerundete Formen auf, ganz im Gegensatz zu den schroffen Kalk- und
      Karstgebirgen des Landes; ihr Massiv zählt zehn Gipfel von über 2000 m Höhe, überragt von der Crna Glava
      mit 2139 m. Die Bjelasica gliedert sich in vier Hauptkämme mit drei markanten Gipfeln: Crna Glava (2139
      m), Zekova Glava (2117 m) und Troglava (2072 m).


      In ihren Hochmulden ruhen Karseen. Neben dem Biogradsko-See im Zentrum des Parks liegen weitere
      Gletscherseen: der Pešića-See, die Ursulovačko-Seen (groß und klein) sowie die Šiško-Seen (groß und
      klein). Die Niederschlagsmengen sind mit bis zu 100 Zoll im Jahr extrem hoch und ermöglichen das
      Gedeihen eines gemäßigten Regenwalds. Am See dominanieren Rotbuche, Bergahorn und Gemeine Esche; an den
      Hängen mischt sich die Buche mit der [Weißtanne](/especie/abies_alba/). Das streng geschützte
      Urwaldreservat umfasst 1600 ha im Einzugsgebiet der Flüsse Biogradska und Jezerštica.
    wildlife: >-
      Im Frühjahr entfaltet sich am Waldboden eine prächtige Blütenpracht: Blühender Bärlauch (Srijemuš)
      bedeckt den Buchenwald am Biogradsko-See. Der Park beherbergt rund 2000 Pflanzenarten, davon 20 %
      balkanische Endemiten, sowie etwa 90 Baumarten. Barbarea balcana wächst unterhalb der Zekova Glava nahe
      den Quellen der Biogradska, während Ahorne das Ufer säumen.


      Die Tierwelt zählt rund 200 Vogelarten, 80 Schmetterlingsarten, 350 Insektenarten und typische
      Säugetiere wie [Wolf](/especie/canis_lupus/), [Braunbär](/especie/ursus_arctos/), Rotfuchs,
      [Rothirsch](/especie/cervus_elaphus/), Eichhörnchen und Siebenschläfer. Im Biogradsko-See und an der
      Mündung der Biogradska lebt der Griechische Frosch, ein balkanischer Endemit. In den Gewässern des Parks
      schwimmen drei Forellenarten. Das Bildungszentrum in Kolašin widmet sich der Tierwelt des Parks,
      insbesondere der Bärenforschung, und zeigt Aufnahmen von Wildkameras an einer Bärenfütterung.
    visit: >-
      Fast achtzig Kilometer markierte Wanderwege, überwiegend von mittlerer Schwierigkeit und
      durchschnittlich zwölf Kilometer lang, erschließen Gipfel und Seen. Der Park bietet sechs markierte
      Bergpfade zu Crna Glava, Troglava und Zekova Glava sowie zu mehreren Karseen. Ein Abschnitt der
      Bergtransversale CT-1 mit insgesamt 120 km Länge durchquert den Park.


      Für einen ersten Eindruck empfiehlt sich der Naturlehrpfad um den Biogradsko-See: Er misst 3,3 km,
      dauert rund 40 Minuten und ist leicht begehbar; sechs interaktive Stationen vermitteln Wissenswertes
      über Fauna und Flora. Der thematische Rundweg Ljeto u katunu umfasst 2,5 km, ist einfach und nimmt etwa
      eine Stunde in Anspruch. Zudem gibt es ausgewiesene Mountainbike- und Cross-Country-Strecken, und der
      See lässt sich im Ruderboot oder Kajak befahren.


      Weiter oben bieten Crna Glava, Zekova Glava und Bendovac weite Aussichten. Unterwegs trifft man auf
      traditionelle Holzbauten der Almen Bjelasicas; im Sommer bewirtschaften Hirten die Katune Pešića Rupe,
      Vranjak, Šiška und Vragodo, und das Geläut der Weideglocken erfüllt die Hänge.
    history: >-
      Der Nationalpark wurde 1952 ausgewiesen und erhielt 1977 internationale Anerkennung durch das
      UNESCO-Programm „Der Mensch und die Biosphäre“. Eine alte Sage berichtet, der See sei aus dem Fluch
      einer Mutter entstanden, nachdem ein Bruder den anderen auf dem gemeinsamen Weizenfeld erschlagen hatte.
    before: >-
      Organisierte Schul- und Reisegruppen müssen ihren Besuch mindestens einen Tag im Voraus im
      Besucherzentrum anmelden. Erkundige dich vorab bei der Parkverwaltung über den aktuellen Zustand der
      Wege.
    around: >-
      Neun Kilometer entfernt liegen der [Nationalpark Durmitor -
      Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/) und in vierzehn Kilometern Entfernung das
      [Nationalpark Durmitor - Bergmassiv](/lugar/nacionalni-park-durmitor---masiv/); dreizehn Kilometer
      entfernt liegt der [Naturpark Komovi](/lugar/park-prirode-komovi/), und nach zweiundzwanzig Kilometern
      erreicht man die [Morača-Schlucht](/lugar/kanjon-morace/).
  it:
    intro: >-
      In Montenegro esiste una foresta protetta fin dal 1878, quando gli abitanti di Morača e Rovca ne
      donarono una porzione al re Nicola I, e da allora è sempre rimasta tutelata. È la foresta primigenia di
      Biogradska Gora, il cuore pulsante del Parco Nazionale Biogradska Gora, sulla montagna di Bjelasica, tra
      i fiumi Tara e Lim. Attorno a questa riserva integrale, il parco racchiude laghi glaciali, pascoli
      estivi e cime che oltrepassano i 2000 metri.
    landscape: >-
      La Bjelasica non assomiglia al resto del Montenegro. Di origine vulcanica, presenta forme morbide, dolci
      e arrotondate, in netto contrasto con i rilievi calcarei e carsici del paese; il massiccio vanta dieci
      cime superiori ai 2000 m, culminanti nei 2139 m della Crna Glava. La Bjelasica è formata da quattro
      dorsali principali con tre cime dominanti: Crna Glava (2139 m), Zekova Glava (2117 m) e Troglava (2072
      m).


      Tra queste vette si annidano laghi glaciali. Oltre al lago Biogradsko, posto al centro del parco, si
      trovano altri specchi d’alta quota: il lago Pešića, i laghi Ursulovačko (grande e piccolo) e i laghi
      Šiško (grande e piccolo). Le precipitazioni sono eccezionalmente copiose, fino a 100 pollici all’anno, e
      consentono lo sviluppo di una vera foresta pluviale temperata. Vicino al lago dominano il faggio,
      l’acero di monte e il frassino maggiore; sui pendii il faggio si associa all’[abete
      bianco](/especie/abies_alba/). La riserva di foresta vergine copre 1600 ha rigidamente protetti nel
      bacino dei fiumi Biogradska e Jezerštica.
    wildlife: >-
      La primavera porta un’incredibile fioritura nel sottobosco: l’aglio orsino (srijemuš) ricopre la faggeta
      che cinge il lago Biogradsko. Il parco accoglie circa 2000 specie di piante, con un 20 % di endemismi
      balcanici, e circa 90 specie arboree. Barbarea balcana vegeta sotto la Zekova Glava vicino alle sorgenti
      della Biogradska, mentre l’acero costeggia il corso d’acqua e il lago.


      La fauna annovera circa 200 specie di uccelli, 80 specie di farfalle, 350 di insetti e mammiferi tipici
      quali il [lupo](/especie/canis_lupus/), l’[orso bruno](/especie/ursus_arctos/), la volpe, il
      [cervo](/especie/cervus_elaphus/), lo scoiattolo e il ghiro. Nel lago Biogradsko e alla foce del fiume
      abita la rana greca, endemismo dei Balcani. Nelle acque del parco vivono tre specie di trote. Il centro
      didattico di Kolašin è dedicato alla fauna selvatica, con un focus approfondito sulla biologia
      dell’orso, e proietta registrazioni di fototrappole collocate presso un punto di foraggiamento.
    visit: >-
      Quasi ottanta chilometri di sentieri segnalati, per lo più di media difficoltà e lunghi in media dodici
      chilometri, conducono a vette e laghi. Il parco dispone di sei percorsi escursionistici che raggiungono
      Crna Glava, Troglava e Zekova Glava, oltre a vari laghi glaciali. Un tratto della traversata montuosa
      CT-1, lunga 120 km in totale, attraversa il parco.


      Per un primo approccio, il sentiero educativo che compie il giro del lago Biogradsko misura 3,3 km,
      richiede circa 40 minuti ed è facile; presenta sei punti interattivi dedicati a flora e fauna. L’anello
      tematico Ljeto u katunu misura 2,5 km, è facile e dura all’incirca un’ora. Sono presenti inoltre una
      pista segnalata per mountain bike e un tracciato di cross-country, ed è possibile navigare sul lago in
      kayak o barca a remi.


      Più in alto si aprono punti panoramici a Crna Glava, Zekova Glava e Bendovac. Lungo il cammino si
      scorgono le baite tradizionali dei katun di Bjelasica; d’estate i pastori risalgono a Pešića Rupe,
      Vranjak, Šiška e Vragodo, e i versanti risuonano dei campanacci delle greggi.
    history: >-
      Divenne parco nazionale nel 1952 e nel 1977 l’UNESCO ne sancì la rilevanza internazionale inserendolo
      nel programma Uomo e Biosfera. Un’antica leggenda narra che il lago ebbe origine dalla maledizione di
      una madre disperata, dopo che un fratello uccise l’altro nel campo di grano che condividevano.
    before: >-
      Le scolaresche e i gruppi organizzati devono comunicare la visita al centro parco con almeno un giorno
      di anticipo. Verifica inoltre con l’ente gestore le condizioni dei percorsi prima di metterti in
      cammino.
    around: >-
      A nove chilometri si trova il [Parco Nazionale del Durmitor - Canyon del
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e a quattordici il [Parco Nazionale del Durmitor -
      Massiccio](/lugar/nacionalni-park-durmitor---masiv/); a tredici chilometri sorge il [Parco Naturale di
      Komovi](/lugar/park-prirode-komovi/), e a ventidue chilometri si apre il [Canyon del
      Morača](/lugar/kanjon-morace/).
  pt:
    intro: >-
      Existe uma floresta em Montenegro protegida desde 1878, quando os clãs de Morača e Rovca ofereceram uma
      parcela do bosque ao rei Nicolau I, permanecendo sob salvaguarda desde essa data. É a floresta virgem de
      Biogradska Gora, o coração do Parque Nacional Biogradska Gora, na montanha de Bjelasica, entalada entre
      as bacias dos rios Tara e Lim. Ao redor desta reserva integral, o parque congrega lagoas glaciares,
      pastos de verão e cumes que superam os 2000 metros.
    landscape: >-
      A Bjelasica difere profundamente do restante território montenegrino. De génese vulcânica, apresenta
      formas suaves, boleadas e arredondadas, em claro contraste com os relevos calcários e cársticos do país;
      o seu maciço conta com dez cumes acima dos 2000 m, culminando na Crna Glava a 2139 m. A Bjelasica
      estrutura-se em quatro cumeadas principais com três vértices dominantes: Crna Glava (2139 m), Zekova
      Glava (2117 m) e Troglava (2072 m).


      Entre essas cristas repousam lagoas glaciares. Além do lago Biogradsko, no núcleo do parque, existem
      outras lagoas de altitude: Pešića, Ursulovačko (grande e pequena) e Šiško (grande e pequena). A
      precipitação é extraordinariamente elevada, atingindo até 100 polegadas anuais, sustentando uma floresta
      temperada húmida. Junto ao lago dominam a faia, o bordo-bastardo e o freixo-comum; nas encostas, a faia
      consorcia-se com o [abeto-branco](/especie/abies_alba/). A reserva florestal virgem abrange 1600 ha
      estritamente protegidos na bacia hidrográfica dos rios Biogradska e Jezerštica.
    wildlife: >-
      A primavera despoleta um manto floral no sub-bosque: a floração de alho-bravo (srijemuš) recobre o faial
      contíguo ao lago Biogradsko. O parque alberga cerca de 2000 espécies vegetais, sendo 20 % endemismos dos
      Balcãs, e cerca de 90 espécies arbóreas. Barbarea balcana viceja sob Zekova Glava, junto às nascentes do
      Biogradska, ao passo que os bordos orlam as margens fluviais e lacustres.


      A fauna inclui perto de 200 espécies de aves, 80 de borboletas, 350 de insetos e mamíferos como o
      [lobo](/especie/canis_lupus/), o [urso-pardo](/especie/ursus_arctos/), a raposa, o
      [veado-vermelho](/especie/cervus_elaphus/), o esquilo e o arganaz. No lago Biogradsko e na foz do rio
      habita a rã-grega, um endemismo balcânico. Nas águas do parque nadam três espécies de truta. O centro
      interpretativo de Kolašin dedica-se à vida selvagem, com particular destaque para a ecologia do urso,
      exibindo gravações de câmaras instaladas num comedouro.
    visit: >-
      Quase oitenta quilómetros de trilhos pedestres marcados, na maioria de dificuldade moderada e com cerca
      de doze quilómetros de extensão média, conduzem a cumes e lagoas. O parque dispõe de seis percursos de
      montanha que atingem Crna Glava, Troglava e Zekova Glava, além de vários lagos glaciares. Um troço da
      travessia alpina CT-1, com 120 km no total, cruza o parque.


      Para uma primeira incursão, o trilho pedagógico que contorna o lago Biogradsko mede 3,3 km, requer cerca
      de 40 minutos e é fácil; possui seis estações interativas consagradas à flora e à fauna. O circuito
      temático Ljeto u katunu tem 2,5 km, é acessível e dura aproximadamente uma hora. Há ainda percursos
      sinalizados de BTT e pistas de cross-country, sendo possível navegar no lago em caiaque ou barco a
      remos.


      Em cotas superiores abrem-se miradouros em Crna Glava, Zekova Glava e Bendovac. Pelo caminho avistam-se
      as habitações pastoris tradicionais dos katuns da Bjelasica; no verão, os pastores sobem a Pešića Rupe,
      Vranjak, Šiška e Vragodo, e as encostas enchem-se com o eco dos chocalhos.
    history: >-
      Foi declarado parque nacional em 1952 e a UNESCO atribuiu-lhe em 1977 o estatuto de proteção
      internacional no âmbito do programa O Homem e a Biosfera. Uma lenda ancestral relata que o lago brotou
      da maldição de uma mãe, após um dos seus filhos ter matado o irmão no trigal que partilhavam.
    before: >-
      Os grupos escolares e excursões organizadas devem comunicar a visita ao centro com pelo menos um dia de
      antecedência. Confirma também o estado dos percursos junto dos serviços do parque antes de partir.
    around: >-
      A nove quilómetros localiza-se o [Parque Nacional Durmitor - Desfiladeiro do
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) e, a catorze quilómetros, o [Parque Nacional
      Durmitor - Maciço](/lugar/nacionalni-park-durmitor---masiv/); a treze quilómetros ergue-se o [Parque
      Natural de Komovi](/lugar/park-prirode-komovi/), e a vinte e dois quilómetros abre-se o [Desfiladeiro do
      Morača](/lugar/kanjon-morace/).
