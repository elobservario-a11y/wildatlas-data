resumen:
  es: >-
    Arcos de piedra kársticos gigantes de más de 45 m de altura creados por el colapso de una antigua cueva
    sobre el río Erkyupriya.
  en: >-
    Giant karst stone arches over 45 m high created by the collapse of an ancient cave above the Erkyupriya
    River.
  fr: >-
    Arches rocheuses karstiques géantes de plus de 45 m de haut, créées par l'effondrement d'une ancienne
    grotte au-dessus de la rivière Erkyupriya.
  de: >-
    Riesige Karststeinbögen von über 45 m Höhe, entstanden durch den Einsturz einer Höhle über dem Fluss
    Erkjuprija.
  it: Archi di pietra carsici giganti alti oltre 45 m, nati dal crollo di un'antica grotta sul fiume Erkyupriya.
  pt: >-
    Arcos de pedra cársicos gigantes com mais de 45 m de altura, formados pelo colapso de uma antiga gruta
    sobre o rio Erkyupriya.
unico:
  es: >-
    Un río que tardó miles de años en convertir una cueva en dos puentes de mármol, y que más abajo desaparece
    bajo tierra.
  en: >-
    A river that took thousands of years to turn a cave into two marble bridges, and disappears underground
    further downstream.
  fr: >-
    Une rivière qui a mis des millénaires à façonner deux ponts de marbre à partir d'une grotte, avant de
    disparaître sous terre en aval.
  de: >-
    Ein Fluss, der Jahrtausende brauchte, um eine Höhle in zwei Marmorbrücken zu formen, und talwärts
    unterirdisch versickert.
  it: >-
    Un fiume che ha impiegato millenni per trasformare una grotta in due ponti di marmo, per poi sparire
    sottoterra a valle.
  pt: >-
    Um rio que levou milhares de anos a transformar uma gruta em duas pontes de mármore e que, mais abaixo,
    desaparece debaixo do chão.
