texto:
  es:
    intro: >-
      Había una cueva, y se cayó el techo. Eso es, en esencia, lo que cuentan los geólogos de los Puentes
      Maravillosos: una cavidad kárstica profunda abierta por un río en el mármol, un fuerte terremoto que
      probablemente derrumbó la bóveda y unas aguas bravas que arrastraron las rocas. Lo que quedó son dos
      puentes naturales de mármol en los Ródope occidentales, a 1450 m de altitud, en un bosque de abetos
      rojos de siglos de edad. En búlgaro se llaman Chudnite Mostove, y se pueden atravesar caminando por
      debajo.
    landscape: >-
      La bóveda del puente mayor se eleva 45 m sobre el río. Tiene tres arcos; el más alto mide 45 m de alto y
      40 de ancho, y el río pasa bajo el arco intermedio. La roca de mármol tiene entre 12 y 15 m de ancho. El
      puente menor está río abajo y alcanza 50 m de altura. Después viene una tercera formación, pequeña e
      inaccesible: la entrada de una sima donde el agua desaparece bajo tierra y llega a un sifón a 3 km.


      En las paredes del puente mayor hay dos cuevas comunicadas y muchas cavidades kársticas. No son un
      detalle menor: sirven de refugio a aves y murciélagos. Por eso es un lugar para mirar hacia arriba,
      hacia las grietas del mármol donde anidan las aves.


      Alrededor, el bosque son coníferas centenarias, sobre todo abetos rojos, y por la zona se conocen muchas
      cuevas kársticas, aunque la mayoría no están acondicionadas para visitar.
    wildlife: >-
      Las fuentes hablan de aves que anidan en el mármol y de murciélagos que se refugian en las cavidades,
      sin dar especies concretas. Es una escena más de roca y sombra que de safari: mirar la bóveda, escuchar
      el río y asomarse a las grietas. Los murciélagos están protegidos por ley; si te acercas a una cavidad,
      no los molestes.
    visit: >-
      Desde el pueblo de Hvoyna parte una ecoruta transfronteriza de doscientos kilómetros que pasa por los
      Puentes Maravillosos. Cerca hay dos refugios de montaña, «Chudnite Mostove» y «Skalnite Mostove», de la
      sociedad turística Studenets de Chepelare, y se llega por una carretera asfaltada. El entorno de los
      puentes tiene barandillas y escalones de piedra para facilitar el acceso, y puedes pasar bajo las
      bóvedas del puente mayor.


      Para entender lo que ves, el Museo del Karst de los Ródope, en Chepelare, explica la espeleología y la
      riqueza kárstica de los Ródope y de Bulgaria en cinco temas. Muestra que los Ródope son la tierra más
      antigua de los Balcanes, dedica una sección a los murciélagos y guarda un esqueleto completo de oso de
      las cavernas, una especie desaparecida hace unos 22.500 años.
    history: >-
      El lugar se declaró monumento natural el 18 de julio de 1949, y hoy ocupa 38,92 hectáreas. Figura entre
      los 100 lugares turísticos nacionales de la Unión Turística Búlgara, con el número 85. La ley prohíbe
      pintar o escribir inscripciones dentro del monumento, pero la tradición de firmar con carbón bajo el
      puente ha persistido.
    before: >-
      Comprueba el estado de la carretera de acceso y de los refugios antes de salir. No escribas ni pintes en
      la roca: está prohibido.
    around: >-
      A poco más de veinte kilómetros está [Smolyanski ezera](/lugar/smolyanski-ezera/). Más lejos, la
      [Portitsa Gorge](/lugar/portitsa-gorge/) comparte los hábitats de karst y cañón.
  en:
    intro: >-
      There was once a cave, and the roof fell in. That is essentially what geologists say about the Wonderful
      Bridges: a deep karst cavity carved through marble by a river, a violent earthquake that likely brought
      down the vault, and raging floodwaters that carried away the fallen rock. What remains are two natural
      marble arches in the Western Rhodopes, at an altitude of 1450 m, set within centuries-old Norway spruce
      forest. In Bulgarian they are called Chudnite Mostove, and you can walk right underneath them.
    landscape: >-
      The arch of the larger bridge rises 45 m above the riverbed. It features three openings; the highest
      reaches 45 m in height and 40 in width, with the stream flowing beneath the middle arch. The marble span
      measures between 12 and 15 m across. Downstream stands the smaller bridge, reaching a height of 50 m.
      Beyond it lies a third formation, tiny and inaccessible: the mouth of a chasm where the stream vanishes
      underground, reaching a siphon 3 km away.


      Two interconnected caves and numerous karst hollows pit the walls of the main bridge. Far from being
      trivial details, they provide shelter for birds and bats. It is a place to gaze upward, watching the
      fissures in the marble where birds build their nests.


      Surrounding the arches, the woodland consists of centennial conifers, dominated by Norway spruce, and
      many karst caves honeycomb the surrounding area, though most are not developed for visitors.
    wildlife: >-
      Sources note nesting birds in the marble fissures and bats roosting within the cavities, without listing
      specific species. The experience is more about rock and shadow than a typical safari: watching the
      vault, listening to the rushing water, and peering into the crevices. Bats are strictly protected by
      law; if you approach a cavity, do not disturb them.
    visit: >-
      From the village of Hvoyna, a two-hundred-kilometre cross-border eco-trail passes directly by the
      Wonderful Bridges. Nearby stand two mountain huts, «Chudnite Mostove» and «Skalnite Mostove», run by the
      Studenets tourist society of Chepelare, accessible by paved road. The immediate grounds around the
      arches feature railings and stone steps to ease access, and you can walk beneath the vaults of the great
      bridge.


      To grasp what you see, the Museum of Rhodope Karst in Chepelare illustrates the speleology and karst
      wealth of the Rhodopes and Bulgaria across five themes. It shows that the Rhodopes are the oldest
      landmass in the Balkans, dedicates a section to bats, and preserves a complete skeleton of a cave bear,
      a species that vanished some 22,500 years ago.
    history: >-
      The site was declared a natural monument on 18 July 1949 and today covers 38.92 hectares. It ranks among
      the 100 National Tourist Sites of the Bulgarian Tourist Union, listed as number 85. The law forbids
      painting or carving inscriptions within the monument, though the tradition of signing with charcoal
      beneath the bridge has long endured.
    before: >-
      Check the condition of the access road and the mountain huts before setting out. Do not write or paint
      on the rocks: it is strictly forbidden.
    around: >-
      Just over twenty kilometres away lies [Smolyanski ezera](/lugar/smolyanski-ezera/). Further afield,
      [Portitsa Gorge](/lugar/portitsa-gorge/) shares similar karst and canyon habitats.
  fr:
    intro: >-
      Il y avait là une grotte, dont la voûte s'est effondrée. C'est, pour l'essentiel, ce que racontent les
      géologues au sujet des Ponts merveilleux : une profonde cavité karstique creusée dans le marbre par une
      rivière, un puissant séisme qui a probablement provoqué la chute du plafond et des crues torrentielles
      qui ont déblayé les blocs rocheux. Ce qui subsiste, ce sont deux arches naturelles de marbre dans les
      Rhodopes occidentales, à 1450 m d'altitude, au cœur d'une forêt d'épicéas plusieurs fois centenaires. En
      bulgare, on les nomme Chudnite Mostove, et vous pouvez marcher directement sous leurs arches.
    landscape: >-
      La voûte du grand pont s'élève à 45 m au-dessus de la rivière. Elle compte trois arches ; la plus haute
      mesure 45 m de haut sur 40 de large, et le cours d'eau s'écoule sous l'ouverture intermédiaire. La lame
      de marbre a entre 12 et 15 m d'épaisseur. En aval s'élève le petit pont, atteignant 50 m de hauteur.
      Vient ensuite une troisième structure, minuscule et inaccessible : l'entrée d'un gouffre où l'eau
      s'engouffre sous terre pour rejoindre un siphon situé à 3 km.


      Dans les parois du grand pont s'ouvrent deux grottes communicantes et de multiples cavités karstiques.
      Loin d'être secondaires, elles abritent oiseaux et chauves-souris. C'est un site où l'on lève les yeux
      vers les failles du marbre où nichent les volatiles.


      À l'entour, la forêt réunit des conifères centenaires, dominés par l'épicéa commun, et le secteur recèle
      de nombreuses grottes karstiques, bien que la plupart ne soient pas aménagées pour la visite.
    wildlife: >-
      Les documents signalent des oiseaux nichant dans les failles du marbre et des chauves-souris logeant
      dans les cavités, sans détailler les espèces. L'ambiance relève davantage du minéral et de l'ombre que
      du safari : observer la voûte, écouter le torrent et scruter les fissures. Les chauves-souris sont
      rigoureusement protégées par la loi ; si vous approchez d'une anfractuosité, ne les dérangez pas.
    visit: >-
      Depuis le village de Hvoyna part un sentier écotouristique transfrontalier de deux cents kilomètres qui
      passe par les Ponts merveilleux. Tout près se trouvent deux refuges de montagne, « Chudnite Mostove » et
      « Skalnite Mostove », gérés par la société touristique Studenets de Chepelare, accessibles par une route
      goudronnée. Les abords immédiats des ponts sont pourvus de garde-corps et de marches taillées dans la
      roche pour faciliter l'accès, et vous pouvez passer sous les voûtes du grand pont.


      Pour saisir toute l'histoire des lieux, le musée du Karst des Rhodopes, à Chepelare, décrypte la
      spéléologie et le patrimoine géologique de la région et de la Bulgarie à travers cinq thématiques. Il
      montre que les Rhodopes constituent la terre la plus ancienne des Balkans, consacre une salle aux
      chauves-souris et conserve un squelette entier d'ours des cavernes, disparu voilà quelque 22 500 ans.
    history: >-
      Le site a été classé monument naturel le 18 juillet 1949 et couvre aujourd'hui 38,92 hectares. Il figure
      parmi les 100 sites touristiques nationaux de l'Union touristique bulgare, sous le numéro 85. La loi
      proscrit d'inscrire ou de peindre quoi que ce soit dans l'enceinte du monument, bien que la coutume
      d'apposer son nom au charbon sous la voûte ait longtemps persisté.
    before: >-
      Vérifiez l'état de la route d'accès et des refuges avant de partir. Ne gravez ni ne peignez rien sur la
      roche : c'est formellement interdit.
    around: >-
      À un peu plus de vingt kilomètres se trouve [Smolyanski ezera](/lugar/smolyanski-ezera/). Plus loin, la
      [Portitsa Gorge](/lugar/portitsa-gorge/) partage les mêmes biotopes de karst et de gorge.
  de:
    intro: >-
      Einst gab es hier eine Höhle, deren Decke einstürzte. So erklären Geologen im Kern die Entstehung der
      Wunderbrücken: ein tiefer, vom Fluss in den Marmor gewaschener Karsthohlraum, ein heftiges Erdbeben, das
      das Gewölbe wahrscheinlich zum Einsturz brachte, und reißende Fluten, die die herabgestürzten Blöcke
      fortschwemmten. Zurück blieben zwei natürliche Marmorbögen in den westlichen Rhodopen auf 1450 m Höhe,
      eingebettet in jahrhundertealte Fichtenwälder. Auf Bulgarisch heißen sie Tschudnite Mostowe, und du
      kannst direkt unter ihnen hindurchwandern.
    landscape: >-
      Das Gewölbe der größeren Brücke ragt 45 m über den Fluss auf. Sie besitzt drei Öffnungen; die höchste
      misst 45 m in der Höhe und 40 in der Breite, wobei das Wasser unter dem mittleren Bogen hindurchfließt.
      Die Felswand aus Marmor ist zwischen 12 und 15 m dick. Flussabwärts steht die kleinere Brücke mit einer
      Höhe von 50 m. Dahinter folgt eine dritte Formation, winzig und unzugänglich: die Öffnung einer Doline,
      in der das Wasser im Untergrund verschwindet und nach 3 km einen Siphon erreicht.


      In den Wänden der großen Brücke liegen zwei miteinander verbundene Höhlen und zahlreiche Karstspalten.
      Sie sind keineswegs nebensächlich: Vögeln und Fledermäusen bieten sie wertvollen Unterschlupf. Daher
      lohnt es sich, den Blick nach oben zu richten, hin zu den Felsklüften, in denen Vögel brüten.


      Ringsum besteht der Wald aus uralten Nadelbäumen, vor allem Gemeinen Fichten, und in der gesamten
      Umgebung sind viele Karsthöhlen bekannt, auch wenn die meisten nicht für Besucher erschlossen sind.
    wildlife: >-
      Die Quellen berichten von Felsbrütern im Marmor und Fledermäusen in den Klüften, ohne einzelne Arten
      namentlich aufzuführen. Es ist mehr eine Kulisse aus Stein und Schatten als eine klassische Tiersafari:
      Schau zum Gewölbe hinauf, lausche dem Fluss und beobachte die Felsspalten. Fledermäuse stehen unter
      strengem Schutz; näherst du dich einer Spalte, störe sie keinesfalls.
    visit: >-
      Vom Dorf Chwojna aus verläuft ein zweihundert Kilometer langer grenzüberschreitender Ökowanderweg, der
      direkt an den Wunderbrücken vorbeiführt. In der Nähe stehen zwei Berghütten, «Tschudnite Mostowe» und
      «Skalnite Mostowe», betrieben vom Touristenverein Studenez aus Tschepelare, erreichbar über eine
      asphaltierte Straße. Das Areal um die Brücken ist mit Geländern und Steinstufen versehen, um das Begehen
      zu erleichtern, und du kannst direkt unter den Bögen der großen Brücke hindurchgehen.


      Um das Gesehene zu verstehen, veranschaulicht das Karstmuseum der Rhodopen in Tschepelare die
      Speläologie und die Karstphänomene der Rhodopen und Bulgariens in fünf Themenbereichen. Es zeigt, dass
      die Rhodopen das älteste Festland des Balkans darstellen, widmet den Fledermäusen eine eigene Abteilung
      und bewahrt ein vollständiges Höhlenbärenskelett auf, einer vor etwa 22.500 Jahren ausgestorbenen Art.
    history: >-
      Der Ort wurde am 18. Juli 1949 zum Naturdenkmal erklärt und umfasst heute 38,92 Hektar. Er zählt zu den
      100 nationalen touristischen Objekten des Bulgarischen Tourismusverbands unter der Nummer 85. Das Gesetz
      verbietet jegliche Beschriftungen oder Bemalungen im Schutzgebiet, doch die Gewohnheit, sich mit Kohle
      unter der Brücke zu verewigen, hat sich lange gehalten.
    before: >-
      Prüfe vor dem Aufbruch den Zustand der Zufahrtsstraße und der Berghütten. Beschrifte oder bemale den
      Fels nicht: Es ist streng verboten.
    around: >-
      Etwas mehr als zwanzig Kilometer entfernt liegt [Smolyanski ezera](/lugar/smolyanski-ezera/). Weiter
      entfernt bietet die [Portitsa Gorge](/lugar/portitsa-gorge/) vergleichbare Karst- und Schluchthabitate.
  it:
    intro: >-
      C'era una grotta e ne è crollata la volta. Questo è in sintesi ciò che spiegano i geologi sui Ponti
      Meravigliosi: una profonda cavità carsica scavata da un fiume nel marmo, un violento terremoto che ne ha
      fatto precipitare il soffitto e piene furiose che hanno portato via i massi. Quel che resta sono due
      ponti naturali di marmo nei Rodopi occidentali, a 1450 m di altitudine, immersi in una foresta di abeti
      rossi plurisecolari. In bulgaro si chiamano Chudnite Mostove, e puoi attraversarli camminando proprio
      sotto le loro arcate.
    landscape: >-
      La volta del ponte principale si innalza per 45 m sul letto del fiume. Mostra tre aperture; la più
      elevata misura 45 m di altezza e 40 di larghezza, e il corso d'acqua scorre sotto l'arco intermedio. Lo
      sperone di marmo ha uno spessore compreso tra 12 e 15 m. Più a valle sorge il ponte minore, che tocca i
      50 m di altezza. Segue una terza formazione, piccola e inaccessibile: l'imbocco di un inghiottitoio dove
      l'acqua sparisce sottoterra per raggiungere un sifone a 3 km di distanza.


      Nelle pareti del ponte maggiore si aprono due grotte comunicanti e numerose cavità carsiche. Non sono un
      dettaglio secondario: offrono rifugio a uccelli e pipistrelli. È un luogo dove alzare lo sguardo verso
      le fessure del marmo in cui nidifica l'avifauna.


      Tutt'intorno, il bosco è popolato da conifere secolari, soprattutto abeti rossi, e nei dintorni si
      contano molte grotte carsiche, sebbene la maggior parte non sia attrezzata per le visite.
    wildlife: >-
      Le testimonianze citano uccelli nidificanti nel marmo e pipistrelli insediati nelle cavità, senza
      precisare le specie. L'atmosfera è fatta di roccia e penombra più che di un safari convenzionale:
      osservare la volta, ascoltare la corrente e guardare dentro le fessure. I chirotteri sono protetti dalla
      legge; se ti avvicini a un anfratto, non disturbarli.
    visit: >-
      Dal paese di Hvoyna parte un percorso ecologico transfrontaliero di duecento chilometri che transita per
      i Ponti Meravigliosi. Vicino sorgono due rifugi alpini, «Chudnite Mostove» e «Skalnite Mostove», della
      società turistica Studenets di Chepelare, raggiungibili tramite una strada asfaltata. L'area attorno ai
      ponti è attrezzata con ringhiere e gradini in pietra per agevolare il passaggio, e puoi camminare
      comodamente sotto le volte del ponte grande.


      Per comprendere ciò che osservi, il Museo del Carsismo dei Rodopi a Chepelare illustra la speleologia e
      i tesori carsici dei Rodopi e della Bulgaria attraverso cinque percorsi tematici. Racconta che i Rodopi
      costituiscono la terra più antica dei Balcani, ospita una sezione dedicata ai pipistrelli ed espone uno
      scheletro intatto di orso delle caverne, specie scomparsa circa 22.500 anni fa.
    history: >-
      L'area è stata proclamata monumento naturale il 18 luglio 1949 e occupa oggi 38,92 ettari. Rientra fra i
      100 siti turistici nazionali dell'Unione Turistica Bulgara con il numero 85. La legge vieta di incidere
      o dipingere scritte dentro il monumento, anche se l'abitudine di firmare con il carboncino sotto la
      volta è proseguita a lungo.
    before: >-
      Verifica le condizioni della strada di accesso e dei rifugi prima di partire. Non scrivere né dipingere
      sulla roccia: è severamente vietato.
    around: >-
      A poco più di venti chilometri si trova [Smolyanski ezera](/lugar/smolyanski-ezera/). Più lontana, la
      [Portitsa Gorge](/lugar/portitsa-gorge/) presenta habitat analoghi di forra e carsismo.
  pt:
    intro: >-
      Havia ali uma gruta e o teto ruiu. É isso, no essencial, o que contam os geólogos sobre as Pontes
      Maravilhosas: uma cavidade cársica profunda esculpida no mármore por um rio, um terramoto violento que
      terá feito ruir a abóbada e águas torrenciais que arrastaram os blocos caídos. O que restou foram duas
      pontes naturais de mármore nos Ródope ocidentais, a 1450 m de altitude, num bosque de
      espruces-da-noruega com séculos de vida. Em búlgaro chamam-se Chudnite Mostove, e podes caminhar
      diretamente por baixo delas.
    landscape: >-
      A abóbada da ponte maior eleva-se 45 m acima do leito do rio. Apresenta três arcos; o mais alto atinge
      45 m de altura e 40 de largura, correndo o curso de água sob o arco central. A rocha de mármore mede
      entre 12 e 15 m de espessura. Mais a jusante ergue-se a ponte pequena, alcançando 50 m de altura.
      Segue-se uma terceira estrutura, minúscula e inacessível: a entrada de um algar por onde a água se esvai
      para o subsolo, alcançando um sifão a 3 km de distância.


      Nas paredes da ponte maior abrem-se duas grutas comunicantes e muitas concavidades cársicas. Não são
      pormenores menores: servem de refúgio a aves e morcegos. Por isso, é um sítio para olhar para cima, em
      direção às fendas do mármore onde nidificam as aves.


      Em redor, o arvoredo é formado por coníferas seculares, sobretudo espruces, e por toda a zona
      conhecem-se muitas grutas cársicas, ainda que a grande maioria não esteja adaptada para visitas.
    wildlife: >-
      Os registos assinalam aves nidificantes no mármore e morcegos abrigados nas cavidades, sem discriminar
      espécies concretas. O cenário é mais de rocha e sombra do que de um safari: contemplar a abóbada,
      escutar a corrente e espreitar as fendas. Os morcegos estão protegidos por lei; se te aproximares de uma
      cavidade, não os perturbes.
    visit: >-
      A partir da aldeia de Hvoyna parte um percurso pedestre transfronteiriço de duzentos quilómetros que
      cruza as Pontes Maravilhosas. Perto existem dois abrigos de montanha, «Chudnite Mostove» e «Skalnite
      Mostove», pertencentes à associação turística Studenets de Chepelare, com acesso por estrada asfaltada.
      O perímetro em torno das pontes dispõe de corrimões e degraus de pedra para facilitar a passagem,
      permitindo caminhar sob as abóbadas da ponte maior.


      Para compreender o que observas, o Museu do Carste dos Ródope, em Chepelare, expõe a espeleologia e a
      riqueza geológica dos Ródope e da Bulgária através de cinco temas. Mostra que os Ródope formam a terra
      mais antiga dos Balcãs, reserva uma secção aos morcegos e acolhe o esqueleto completo de um
      urso-das-cavernas, espécie extinta há cerca de 22 500 anos.
    history: >-
      O local foi classificado como monumento natural em 18 de julho de 1949 e ocupa atualmente 38,92
      hectares. Consta dos 100 locais turísticos nacionais da União Turística Búlgara, com o número 85. A lei
      proíbe pintar ou gravar inscrições no interior do monumento, embora a tradição de assinar a carvão sob a
      ponte tenha persistido longamente.
    before: >-
      Confirma o estado da estrada de acesso e dos abrigos antes de partir. Não escrevas nem pintes nas
      rochas: é estritamente proibido.
    around: >-
      A pouco mais de vinte quilómetros fica [Smolyanski ezera](/lugar/smolyanski-ezera/). Mais além, a
      [Portitsa Gorge](/lugar/portitsa-gorge/) partilha habitats cársicos e de desfiladeiro semelhantes.
