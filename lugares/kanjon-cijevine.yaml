resumen:
  es: Estrecho cañón en miniatura labrado en la roca caliza pura camino del lago Skadar.
  en: Narrow miniature canyon carved into pure limestone on the way to Lake Skadar.
  fr: Étroit canyon miniature creusé dans le calcaire pur sur le chemin du lac Skadar.
  de: Schlanker Miniaturcanyon, der auf dem Weg zum Skadar-See in reinen Kalkstein gegraben wurde.
  it: Stretto canyon in miniatura scavato nella pura roccia calcarea verso il lago di Scutari.
  pt: Estreito desfiladeiro em miniatura esculpido no calcário puro a caminho do lago Skadar.
unico:
  es: >-
    Un cañón calizo, con un encinar mediterráneo muy bien conservado y una planta carnívora que en Montenegro
    vive en muy pocos sitios, por el que pasó durante siglos una ruta de caravanas entre el este y el oeste.
  en: >-
    A limestone canyon with a well-preserved Mediterranean holm oak wood and a carnivorous plant found in very
    few places in Montenegro, through which an east-west caravan route passed for centuries.
  fr: >-
    Un canyon calcaire abritant une chênaie verte méditerranéenne très bien préservée et une plante carnivore
    présente dans très peu d'endroits au Monténégro, où est passée pendant des siècles une route de caravanes
    reliant l'est et l'ouest.
  de: >-
    Ein Kalkstein-Canyon mit einem hervorragend erhaltenen mediterranen Steineichenwald und einer
    fleischfressenden Pflanze, die in Montenegro nur an sehr wenigen Orten vorkommt, durch den über
    Jahrhunderte hinweg eine Karawanenroute zwischen Ost und West führte.
  it: >-
    Un canyon calcareo con una lecceta mediterranea ottimamente conservata e una pianta carnivora presente in
    pochissimi luoghi in Montenegro, attraversato per secoli da una via di carovane tra est e ovest.
  pt: >-
    Um desfiladeiro calcário com um sobreiral mediterrânico muito bem conservado e uma planta carnívora
    presente em raros locais de Montenegro, por onde passou durante séculos uma rota de caravanas entre o
    leste e o oeste.
observaciones:
  es: >-
    Las sendas antiguas no están señalizadas y hay que ir con guía local; comprueba antes con el gestor qué
    tramos se pueden recorrer.
texto:
  es:
    intro: >-
      Durante millones de años un río fue cortando la caliza hasta dejar paredes de varios cientos de metros.
      Ese río es el Cijevna, afluente del Morača, y su cañón es hoy un monumento natural pegado a la frontera
      con Albania, en el municipio de Tuzi. Ocupa 2022 hectáreas, tiene 12 km de largo y 903 m de profundidad,
      y es uno de los espacios protegidos más valiosos de Montenegro.
    landscape: >-
      Durante millones de años el Cijevna excavó su cauce en caliza maciza y abrió un cañón de paredes
      verticales y muchas formas kársticas. El sustrato son rocas carbonatadas del Mesozoico, sobre todo
      calizas y dolomías de los Dinárides externos, y las paredes alcanzan en algunos puntos varios cientos de
      metros de altura. Al acercarse al Morača, el clima de la zona pasa de continental a mediterráneo.


      Esa mezcla se nota en las plantas. En poco espacio se encuentran elementos mediterráneos,
      submediterráneos y continentales, con muchos endemismos y especies relictas. Hay un encinar (Quercus
      ilex) muy bien conservado en algunos puntos, ejemplo raro de vegetación mediterránea autóctona, y la
      planta emblema es la grasilla Pinguicula hirtiflora, rara, protegida y registrada en Montenegro en muy
      pocos lugares. En el cañón se describió una comunidad vegetal de culantrillo y Pinguicula hirtiflora
      conocida solo de este lugar.
    wildlife: >-
      El cañón es un buen sitio para mirar aves. Hasta ahora se han registrado 106 especies, y los acantilados
      sirven de nido al [águila real](/especie/aquila_chrysaetos/), el [búho real](/especie/bubo_bubo/) y el
      [halcón peregrino](/especie/falco_peregrinus/). El [alimoche](/especie/neophron_percnopterus/) vivió
      aquí, pero hoy ya no cría o ha desaparecido de Montenegro. Al caminar se ven desde pequeñas aves del
      bosque y los espacios abiertos hasta rapaces que sobrevuelan los acantilados. Es además Zona Importante
      para las Aves por especies como la culebrera europea y el gavilán de Levante.


      Entre los mamíferos, la [nutria](/especie/lutra_lutra/) es señal de que el río conserva su calidad,
      aunque pasa casi toda la vida oculta y rara vez se deja ver. En lo alto de los acantilados vive el
      rebeco balcánico, que se mueve por paredes casi verticales. Gato montés, zorro, tejón, marta y liebre
      son sobre todo crepusculares o nocturnos, y las cámaras trampa han confirmado su paso. Los murciélagos
      usan cuevas, grietas y tramos tranquilos, y según los vecinos hay más de cien cuevas y simas en los
      alrededores, muchas sin explorar.


      En el agua vive la [trucha marmórea](/especie/salmo_marmoratus/), uno de los salmónidos más amenazados
      de la región, que necesita agua muy limpia, fría y oxigenada. Hay 9 especies de anfibios, más de la
      mitad de las de Montenegro, y 19 de reptiles, casi la mitad; entre ellas, la [tortuga
      mediterránea](/especie/testudo_hermanni/), a la que amenazan sobre todo los incendios y la pérdida de
      hábitat.
    visit: >-
      La mejor manera de entenderlo es caminarlo. Un sendero señalizado va de Cijevna Zatrijebačka al pueblo
      de Stjepovo: empieza junto al puente del camino de Dinoša a la frontera, sube por viejas serpentinas,
      lleva unas tres horas y salva unos 730 m. Desde arriba se ven el cañón, el Prokletije, el lago de Skadar
      y la Rumija. Hay también una ruta mixta de senderismo y bici de Dinoša a Kučka Korita y al lago Rikavac,
      por Stjepovo y Poprat hacia el katun de Zatrijebač.


      Las sendas antiguas son otra cosa. La de Gryka Mužečka, Ljerza y Kakarić baja al río en unos 5 km y
      entre 2 y 3 horas, y no está despejada ni señalizada; la de Ćeu Rases a Dolina Ljipovice baja unos 6 km
      y tarda de 3 a 4 horas; las de Škala Smedec y Kodra Cukthit a Dolina Smedec miden unos 5 km. El gestor
      advierte que no están preparadas para recorrerse por cuenta propia: hay que ir con guía local y equipo
      de montaña.
    history: >-
      Por el cañón pasaba un ramal de la ruta romana Via Egnatia, que en la Edad Media se llamó Via de Zenta;
      en Montenegro cruzaba el Cijevna por el puente de Ljemaja y seguía por Dinoša y Ćemovsko polje hacia la
      llanura. Junto a la ruta se levantaron puentes, posadas, molinos de grano y talleres textiles. En
      algunos tramos los vecinos aún la llaman Rruga e Arit, el camino de oro.


      El área es Área Clave para la Biodiversidad, Área Importante para las Aves y para las Plantas, y forma
      parte de la reserva de la biosfera de la cuenca del lago de Skadar. En 2025 el municipio de Tuzi creó la
      empresa DOO Spomenik prirode Kanjon Cijevne y le encargó gestionar el área protegida. El Cem es uno de
      los últimos ríos de Europa que corre libre; lo amenazan la industrialización, las pequeñas centrales
      hidroeléctricas y el cambio climático.
    before: >-
      Las sendas antiguas no están señalizadas y hay que ir con guía local; comprueba antes con el gestor qué
      tramos se pueden recorrer.
    around: >-
      Muy cerca están [Kanjon Morače](/lugar/kanjon-morace/), a cinco kilómetros, y el [Nacionalni park
      Skadarsko jezero](/lugar/nacionalni-park-skadarsko-jezero/), a ocho; a once kilómetros queda el [Parku
      Kombëtar i Alpeve të Shqipërisë - Valbonë & Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/), y a
      quince, el [Park prirode Komovi](/lugar/park-prirode-komovi/).
  en:
    intro: >-
      For millions of years a river cut through limestone to carve walls several hundred metres high. That
      river is the Cijevna, a tributary of the Morača, and its canyon is now a natural monument right by the
      border with Albania, in the municipality of Tuzi. It covers 2022 hectares, is 12 km long and 903 m deep,
      making it one of the most valuable protected areas in Montenegro.
    landscape: >-
      Over millions of years the Cijevna carved its channel into solid limestone, opening a canyon of vertical
      walls and varied karst formations. The bedrock consists of Mesozoic carbonate rocks, mostly limestones
      and dolomites of the outer Dinarides, and the walls reach several hundred metres in height in some
      places. Approaching the Morača, the local climate transitions from continental to Mediterranean.


      This mix is reflected in the plant life. In a compact area one finds Mediterranean, sub-Mediterranean
      and continental elements, with many endemics and relict species. There is an exceptionally
      well-preserved holm oak wood (Quercus ilex) in places, a rare example of native Mediterranean
      vegetation, and the flagship plant is the butterwort Pinguicula hirtiflora, rare, protected and recorded
      in Montenegro in very few locations. A plant community of maidenhair fern and Pinguicula hirtiflora
      known only from this site was described in the canyon.
    wildlife: >-
      The canyon is a prime spot for birdwatching. To date 106 species have been recorded, and the cliffs
      provide nesting sites for the [Golden eagle](/especie/aquila_chrysaetos/), the [Eurasian
      eagle-owl](/especie/bubo_bubo/) and the [Peregrine falcon](/especie/falco_peregrinus/). The [Egyptian
      vulture](/especie/neophron_percnopterus/) once lived here, but no longer breeds or has vanished from
      Montenegro. Walking along the gorge you can spot everything from small woodland and open-country birds
      to raptors soaring over the precipices. It is also an Important Bird Area for species such as the
      short-toed snake eagle and the Levant sparrowhawk.


      Among mammals, the [Eurasian otter](/especie/lutra_lutra/) signals the enduring water quality of the
      river, though it spends almost its entire life hidden and is rarely glimpsed. High on the cliffs lives
      the Balkan chamois, moving along near-vertical faces. Wildcat, fox, badger, pine marten and brown hare
      are primarily crepuscular or nocturnal, and trail cameras have documented their presence. Bats utilize
      caves, fissures and sheltered stretches, and local residents report more than a hundred caves and chasms
      in the surroundings, many unexplored.


      In the water lives the [marble trout](/especie/salmo_marmoratus/), one of the most threatened salmonids
      in the region, requiring pristine, cold and oxygen-rich water. There are 9 amphibian species, more than
      half of Montenegro's total, and 19 reptile species, nearly half; among them is [Hermann's
      tortoise](/especie/testudo_hermanni/), threatened primarily by fires and habitat loss.
    visit: >-
      The finest way to understand it is to hike it. A waymarked path runs from Cijevna Zatrijebačka to the
      village of Stjepovo: it starts beside the bridge on the road from Dinoša to the border, climbs along old
      switchbacks, takes about three hours and tackles some 730 m of elevation gain. From the top you look out
      across the canyon, the Prokletije, Lake Skadar and Rumija. There is also a combined hiking and cycling
      route from Dinoša to Kučka Korita and Lake Rikavac, passing through Stjepovo and Poprat towards the
      katun of Zatrijebač.


      The ancient trails are another undertaking entirely. The path from Gryka Mužečka, Ljerza and Kakarić
      descends to the river over about 5 km and takes between 2 and 3 hours, and is neither cleared nor
      waymarked; that from Ćeu Rases to Dolina Ljipovice drops about 6 km and takes from 3 to 4 hours; those
      from Škala Smedec and Kodra Cukthit to Dolina Smedec measure around 5 km. The managing authority
      cautions that they are not suitable for independent exploration: you must go with a local guide and
      mountaineering gear.
    history: >-
      A branch of the Roman Via Egnatia once traversed the canyon, known in the Middle Ages as the Via de
      Zenta; in Montenegro it crossed the Cijevna at the Ljemaja bridge and continued through Dinoša and
      Ćemovsko polje towards the plains. Along the route bridges, inns, grain mills and textile workshops
      sprang up. In some sections locals still refer to it as Rruga e Arit, the golden road.


      The area is a Key Biodiversity Area, an Important Bird Area and Important Plant Area, and forms part of
      the Lake Skadar basin biosphere reserve. In 2025 the municipality of Tuzi established the municipal
      enterprise DOO Spomenik prirode Kanjon Cijevne and tasked it with managing the protected area. The Cem
      is one of the last free-flowing rivers in Europe; it faces threats from industrial development, small
      hydropower plants and climate change.
    before: >-
      The historic paths are unmarked and you must go with a local guide; check beforehand with the managing
      authority which sections can be visited.
    around: >-
      Very close by are [Kanjon Morače](/lugar/kanjon-morace/), five kilometres away, and [Nacionalni park
      Skadarsko jezero](/lugar/nacionalni-park-skadarsko-jezero/), eight kilometres away; eleven kilometres
      off lies [Parku Kombëtar i Alpeve të Shqipërisë - Valbonë &
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/), and fifteen kilometres away, [Park prirode
      Komovi](/lugar/park-prirode-komovi/).
  fr:
    intro: >-
      Pendant des millions d'années, une rivière a entaillé le calcaire pour créer des parois de plusieurs
      centaines de mètres. Cette rivière est la Cijevna, affluent de la Morača, et son canyon est aujourd'hui
      un monument naturel adossé à la frontière albanaise, dans la municipalité de Tuzi. Il couvre 2022
      hectares, s'étire sur 12 km de long et atteint 903 m de profondeur, constituant l'un des espaces
      protégés les plus précieux du Monténégro.
    landscape: >-
      Durant des millions d'années, la Cijevna a creusé son lit dans le calcaire massif, ouvrant un canyon aux
      parois verticales et aux multiples formes karstiques. Le socle se compose de roches carbonatées du
      Mésozoïque, principalement des calcaires et des dolomies des Dinarides externes, dont les parois
      culminent par endroits à plusieurs centaines de mètres de hauteur. En approchant de la Morača, le climat
      local passe du continental au méditerranéen.


      Ce mélange se reflète dans la flore. Sur un espace restreint se côtoient des éléments méditerranéens,
      subméditerranéens et continentaux, avec de nombreux endémismes et espèces relictes. Une chênaie verte
      (Quercus ilex) remarquablement préservée subsiste par endroits, exemple rare de végétation
      méditerranéenne indigène, et la plante emblématique est la grassette Pinguicula hirtiflora, rare,
      protégée et recensée au Monténégro dans de très rares stations. Une communauté végétale de capillaire et
      de Pinguicula hirtiflora connue uniquement de ce site a été décrite dans le canyon.
    wildlife: >-
      Le canyon est un site remarquable pour l'observation des oiseaux. À ce jour, 106 espèces y ont été
      recensées, et les falaises accueillent les nids de l'[Aigle royal](/especie/aquila_chrysaetos/), du
      [Hibou grand-duc](/especie/bubo_bubo/) et du [Faucon pèlerin](/especie/falco_peregrinus/). Le
      [Percnoptère](/especie/neophron_percnopterus/) y a niché autrefois, mais il ne s'y reproduit plus ou a
      disparu du Monténégro. En chemin, vous observez des petits passereaux forestiers et de milieux ouverts
      jusqu'aux rapaces planant au-dessus des parois. Le site est en outre classé Zone importante pour la
      conservation des oiseaux grâce à des espèces comme le circaète Jean-le-Blanc et l'épervier à pieds
      courts.


      Parmi les mammifères, la [Loutre d'Europe](/especie/lutra_lutra/) témoigne de la qualité persistante des
      eaux, bien qu'elle passe l'essentiel de sa vie dissimulée et ne s'observe que très rarement. Sur les
      hauteurs des falaises évolue le chamois des Balkans, arpentant des parois quasi verticales. Chat
      sauvage, renard, blaireau, martre et lièvre brun sont avant tout crépusculaires ou nocturnes, et les
      pièges photographiques attestent de leurs passages. Les chauves-souris profitent des grottes, des
      fissures et des portions calmes, et les habitants signalent plus d'une centaine de cavités et gouffres
      aux alentours, dont beaucoup restent inexplorés.


      Dans l'eau vit la [truite marbrée](/especie/salmo_marmoratus/), l'un des salmonidés les plus menacés de
      la région, inféodée à des cours d'eau limpides, froids et très oxygénés. On compte 9 espèces
      d'amphibiens, soit plus de la moitié de celles du Monténégro, et 19 espèces de reptiles, soit près de la
      moitié, parmi lesquelles la [Tortue d'Hermann](/especie/testudo_hermanni/), principalement menacée par
      les incendies et la dégradation de son habitat.
    visit: >-
      La meilleure manière de l'appréhender est de le parcourir à pied. Un sentier balisé relie Cijevna
      Zatrijebačka au village de Stjepovo : il démarre près du pont sur la route reliant Dinoša à la
      frontière, s'élève par d'anciens lacets, requiert environ trois heures de marche et franchit quelque 730
      m de dénivelé. Du sommet, vous embrassez d'un seul regard le canyon, les monts Prokletije, le lac Skadar
      et la Rumija. Il existe également un itinéraire mixte de randonnée et VTT reliant Dinoša à Kučka Korita
      et au lac Rikavac, traversant Stjepovo et Poprat vers le katun de Zatrijebač.


      Les sentiers historiques relèvent d'une toute autre aventure. Celui de Gryka Mužečka, Ljerza et Kakarić
      descend vers la rivière sur environ 5 km en 2 à 3 heures, et n'est ni dégagé ni balisé ; celui de Ćeu
      Rases à Dolina Ljipovice descend sur environ 6 km et demande de 3 à 4 heures ; ceux de Škala Smedec et
      Kodra Cukthit à Dolina Smedec mesurent environ 5 km. L'organisme gestionnaire avertit qu'ils ne sont pas
      adaptés à une visite autonome : vous devez obligatoirement recourir à un guide local et disposer d'un
      équipement montagnard.
    history: >-
      Un embranchement de la voie romaine Via Egnatia traversait jadis le canyon, désigné au Moyen Âge sous le
      nom de Via de Zenta ; au Monténégro, elle franchissait la Cijevna au pont de Ljemaja et continuait par
      Dinoša et le Ćemovsko polje vers la plaine. Au fil de cet axe se sont dressés des ponts, des auberges,
      des moulins à grains et des ateliers textiles. Sur certains tronçons, les habitants la nomment encore
      Rruga e Arit, la route de l'or.


      La zone est désignée Zone clé pour la biodiversité, Zone importante pour les oiseaux et pour les
      plantes, et s'intègre dans la réserve de biosphère du bassin du lac Skadar. En 2025, la municipalité de
      Tuzi a créé la société publique DOO Spomenik prirode Kanjon Cijevne chargée de gérer l'espace protégé.
      Le Cem compte parmi les dernières rivières libres d'Europe ; il reste menacé par l'industrialisation,
      les microcentrales hydroélectriques et le dérèglement climatique.
    before: >-
      Les anciens sentiers ne sont pas balisés et requièrent l'accompagnement d'un guide local ; informez-vous
      auprès du gestionnaire avant votre départ pour vérifier les tronçons praticables.
    around: >-
      Tout proches se trouvent [Kanjon Morače](/lugar/kanjon-morace/), à cinq kilomètres, et le [Nacionalni
      park Skadarsko jezero](/lugar/nacionalni-park-skadarsko-jezero/), à huit kilomètres ; à onze kilomètres
      se dresse le [Parku Kombëtar i Alpeve të Shqipërisë - Valbonë &
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/), et à quinze kilomètres, le [Park prirode
      Komovi](/lugar/park-prirode-komovi/).
  de:
    intro: >-
      Über Millionen von Jahren schnitt sich ein Fluss durch den Kalkstein und schuf mehrere hundert Meter
      hohe Wände. Dieser Fluss ist die Cijevna, ein Nebenfluss der Morača, und ihr Canyon ist heute ein
      Naturdenkmal direkt an der Grenze zu Albanien in der Gemeinde Tuzi. Er umfasst 2022 Hektar, ist 12 km
      lang und 903 m tief, womit er zu den wertvollsten Schutzgebieten Montenegros gehört.
    landscape: >-
      Über Jahrmillionen grub die Cijevna ihr Bett in massiven Kalkstein und schuf einen Canyon mit
      senkrechten Wänden und vielfältigen Karstformen. Das Ausgangsgestein besteht aus mesozoischen
      Karbonatgesteinen, vor allem Kalksteinen und Dolomiten der äußeren Dinariden, deren Wände stellenweise
      mehrere hundert Meter emporragen. Bei der Annäherung an die Morača wandelt sich das Lokalklima von
      kontinental zu mediterran.


      Diese Mischung spiegelt sich in der Pflanzenwelt wider. Auf engem Raum treffen mediterrane,
      submediterrane und kontinentale Elemente aufeinander, darunter zahlreiche Endemiten und Reliktarten.
      Stellenweise ist ein Steineichenwald (Quercus ilex) bemerkenswert gut erhalten, ein seltenes Beispiel
      autochthoner Mittelmeervegetation, und die Leitart ist das Fettkraut Pinguicula hirtiflora, selten,
      geschützt und in Montenegro nur an wenigen Wuchsorten nachgewiesen. Im Canyon wurde eine
      Pflanzengesellschaft aus Frauenhaarfarn und Pinguicula hirtiflora beschrieben, die nur von diesem
      Standort bekannt ist.
    wildlife: >-
      Der Canyon ist ein erstklassiges Revier zur Vogelbeobachtung. Bislang wurden 106 Arten erfasst, und die
      Steilwände dienen dem [Steinadler](/especie/aquila_chrysaetos/), dem [Uhu](/especie/bubo_bubo/) und dem
      [Wanderfalken](/especie/falco_peregrinus/) als Brutplatz. Der
      [Schmutzgeier](/especie/neophron_percnopterus/) lebte einst hier, brütet heute jedoch nicht mehr oder
      ist in Montenegro verschwunden. Beim Wandern lassen sich kleine Wald- und Offenlandvögel ebenso
      beobachten wie Greifvögel, die über den Klippen kreisen. Zudem ist das Gebiet als Important Bird Area
      für Arten wie den Schlangenadler und den Kurzfangsperber ausgewiesen.


      Unter den Säugetieren belegt der [Eurasische Fischotter](/especie/lutra_lutra/) die hohe Gewässergüte
      des Flusses, obgleich er fast sein ganzes Leben verborgen verbringt und kaum je zu Gesicht zu bekommen
      ist. Hoch oben an den Klippen lebt die Balkangams, die sich an fast senkrechten Wänden bewegt.
      Wildkatze, Fuchs, Dachs, Baummarder und Feldhase sind überwiegend dämmerungs- oder nachtaktiv, und
      Fotofallen haben ihre Anwesenheit belegt. Fledermäuse nutzen Höhlen, Felsspalten und ruhige
      Flussabschnitte; laut Anwohnern gibt es mehr als hundert Höhlen und Schlünde in der Umgebung, viele
      davon unerforscht.


      Im Wasser lebt die [Marmorierte Forelle](/especie/salmo_marmoratus/), einer der am stärksten gefährdeten
      Salmoniden der Region, der auf sauberes, kaltes und sauerstoffreiches Wasser angewiesen ist. Es gibt 9
      Amphibienarten, mehr als die Hälfte aller montenegrinischen Arten, und 19 Reptilienarten, fast die
      Hälfte; darunter die [Griechische Landschildkröte](/especie/testudo_hermanni/), die vor allem durch
      Brände und Lebensraumverlust bedroht ist.
    visit: >-
      Am besten lässt sich der Canyon zu Fuß erkunden. Ein markierter Wanderweg führt von Cijevna Zatrijebačka
      zum Dorf Stjepovo: Er beginnt an der Brücke der Straße von Dinoša zur Grenze, steigt in alten
      Serpentinen empor, erfordert etwa drei Stunden Gehzeit und überwindet rund 730 m Höhenunterschied. Von
      oben blickst du auf den Canyon, das Prokletije-Gebirge, den Skadar-See und die Rumija. Zudem gibt es
      eine kombinierte Wander- und Radroute von Dinoša nach Kučka Korita und zum Rikavac-See über Stjepovo und
      Poprat zum Katun von Zatrijebač.


      Die alten Saumpfade sind eine ganz andere Herausforderung. Der Weg von Gryka Mužečka, Ljerza und Kakarić
      führt über rund 5 km in 2 bis 3 Stunden zum Fluss hinab und ist weder freigeschnitten noch markiert;
      jener von Ćeu Rases nach Dolina Ljipovice führt über etwa 6 km hinunter und beansprucht 3 bis 4 Stunden;
      die Pfade von Škala Smedec und Kodra Cukthit nach Dolina Smedec messen etwa 5 km. Die Parkverwaltung
      warnt eindringlich davor, diese Wege auf eigene Faust zu begehen: Du musst dich einem einheimischen
      Führer anvertrauen und alpine Bergsteigerausrüstung mitführen.
    history: >-
      Ein Abzweig der römischen Via Egnatia verlief einst durch den Canyon, der im Mittelalter Via de Zenta
      genannt wurde; in Montenegro überquerte er die Cijevna an der Ljemaja-Brücke und führte über Dinoša und
      das Ćemovsko polje zur Ebene. Entlang der Route entstanden Brücken, Gasthäuser, Getreidemühlen und
      Textilwerkstätten. Auf manchen Abschnitten nennen die Einheimischen den Weg bis heute Rruga e Arit, die
      Goldstraße.


      Das Gebiet ist als Key Biodiversity Area, Important Bird Area und Important Plant Area ausgewiesen und
      gehört zum Biosphärenreservat des Skadar-See-Beckens. Im Jahr 2025 gründete die Gemeinde Tuzi das
      Kommunalunternehmen DOO Spomenik prirode Kanjon Cijevne zur Verwaltung des Schutzgebiets. Der Cem ist
      einer der letzten frei fließenden Flüsse Europas; Bedrohungen gehen von Industrialisierung,
      Kleinwasserkraftwerken und dem Klimawandel aus.
    before: >-
      Die historischen Pfade sind unmarkiert und dürfen nur mit einheimischem Führer begangen werden; kläre
      vorab mit der Verwaltung, welche Abschnitte freigegeben sind.
    around: >-
      Ganz in der Nähe liegen der [Kanjon Morače](/lugar/kanjon-morace/) in fünf Kilometern und der
      [Nacionalni park Skadarsko jezero](/lugar/nacionalni-park-skadarsko-jezero/) in acht Kilometern
      Entfernung; elf Kilometer entfernt liegt der [Parku Kombëtar i Alpeve të Shqipërisë - Valbonë &
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/) und fünfzehn Kilometer der [Park prirode
      Komovi](/lugar/park-prirode-komovi/).
  it:
    intro: >-
      Per milioni di anni un fiume ha inciso il calcare creando pareti alte diverse centinaia di metri. Quel
      fiume è il Cijevna, affluente del Morača, e il suo canyon è oggi un monumento naturale a ridosso del
      confine con l'Albania, nel comune di Tuzi. Si estende su 2022 ettari, è lungo 12 km e profondo 903 m,
      risultando una delle aree protette più preziose del Montenegro.
    landscape: >-
      Nel corso di milioni di anni il Cijevna ha scavato il proprio alveo nel calcare compatto, aprendo un
      canyon dalle pareti verticali e ricche di forme carsiche. Il substrato è costituito da rocce
      carbonatiche del Mesozoico, soprattutto calcari e dolomie dei Dinaridi esterni, con pareti che in alcuni
      punti toccano diverse centinaia di metri d'altezza. Avvicinandosi al Morača, il clima della zona passa
      da continentale a mediterraneo.


      Questa commistione si riflette nella vegetazione. In poco spazio si incontrano elementi mediterranei,
      submediterranei e continentali, con molti endemismi e specie relitte. Vi è una lecceta (Quercus ilex)
      ottimamente conservata in alcuni settori, raro esempio di vegetazione mediterranea autoctona, e la
      pianta simbolo è la pinguicola Pinguicula hirtiflora, rara, protetta e documentata in Montenegro in
      pochissime stazioni. Nel canyon è stata descritta una comunità vegetale di capelvenere e Pinguicula
      hirtiflora nota esclusivamente in questo luogo.
    wildlife: >-
      Il canyon è un punto privilegiato per il birdwatching. Finora sono state censite 106 specie, e le
      falesie offrono siti di nidificazione all'[Aquila reale](/especie/aquila_chrysaetos/), al [Gufo
      reale](/especie/bubo_bubo/) e al [Falco pellegrino](/especie/falco_peregrinus/). Il
      [Capovaccaio](/especie/neophron_percnopterus/) viveva qui in passato, ma oggi non nidifica più o è
      scomparso dal Montenegro. Camminando puoi avvistare dai piccoli passeriformi del bosco e delle radure
      fino ai rapaci che volteggiano sui dirupi. L'area è inoltre classificata come Important Bird Area per
      specie come il biancone e il sparviere levantino.


      Tra i mammiferi, la [Lontra europea](/especie/lutra_lutra/) è indice dell'integrità delle acque
      fluviali, sebbene trascorra quasi tutta la vita nascosta e si lasci avvistare assai di rado. Sulle cenge
      rocciose più elevate vive il camoscio balcanico, capace di muoversi su pareti pressoché verticali. Gatto
      selvatico, volpe, tasso, martora e lepre comune sono principalmente crepuscolari o notturni, e le
      fototrappole ne hanno attestato il passaggio. I pipistrelli sfruttano grotte, fessure e tratti riparati,
      e secondo gli abitanti della zona vi sono più di cento grotte e inghiottitoi nei dintorni, molti
      inesplorati.


      Nelle acque vive la [trota marmorata](/especie/salmo_marmoratus/), uno dei salmonidi più minacciati
      della regione, bisognoso di acque purissime, fredde e ossigenate. Si contano 9 specie di anfibi, più
      della metà di quelle presenti in Montenegro, e 19 di rettili, quasi la metà; tra queste, la [testuggine
      di Hermann](/especie/testudo_hermanni/), minacciata anzitutto dagli incendi e dalla perdita di habitat.
    visit: >-
      Il modo migliore per comprenderlo è percorrerlo a piedi. Un sentiero segnalato collega Cijevna
      Zatrijebačka al villaggio di Stjepovo: parte accanto al ponte sulla strada che va da Dinoša al confine,
      sale lungo vecchi tornanti, richiede circa tre ore di cammino e supera circa 730 m di dislivello.
      Dall'alto il panorama abbraccia il canyon, i monti Prokletije, il lago di Scutari e la Rumija. Esiste
      anche un itinerario misto escursionistico e ciclabile da Dinoša a Kučka Korita e al lago Rikavac,
      toccando Stjepovo e Poprat verso il katun di Zatrijebač.


      I tracciati storici richiedono ben altra cautela. Quello di Gryka Mužečka, Ljerza e Kakarić scende al
      fiume per circa 5 km in un tempo compreso tra 2 e 3 ore, e non è né ripulito né segnato; quello da Ćeu
      Rases a Dolina Ljipovice scende per circa 6 km e richiede da 3 a 4 ore; quelli di Škala Smedec e Kodra
      Cukthit verso Dolina Smedec misurano circa 5 km. L'ente gestore avverte che non sono adatti a escursioni
      in autonomia: devi andare con una guida locale e attrezzatura da montagna.
    history: >-
      Lungo il canyon transitava una diramazione della via romana Via Egnatia, che nel Medioevo prese il nome
      di Via de Zenta; in territorio montenegrino scavalcava il Cijevna al ponte di Ljemaja e proseguiva per
      Dinoša e il Ćemovsko polje verso la pianura. Accanto alla via sorsero ponti, locande, mulini da grano e
      laboratori tessili. In alcuni tratti gli abitanti la chiamano ancora Rruga e Arit, la via dell'oro.


      Il territorio è classificato come Key Biodiversity Area, Important Bird Area e Important Plant Area, e
      fa parte della riserva della biosfera del bacino del lago di Scutari. Nel 2025 il comune di Tuzi ha
      istituito l'azienda municipale DOO Spomenik prirode Kanjon Cijevne per gestire l'area protetta. Il Cem è
      uno degli ultimi fiumi liberi d'Europa; su di esso incombono l'industrializzazione, le piccole centrali
      idroelettriche e i cambiamenti climatici.
    before: >-
      I tracciati storici non sono segnalati e richiedono una guida locale; verifica previamente con l'ente
      gestore quali tratti siano praticabili.
    around: >-
      A brevissima distanza si trovano il [Kanjon Morače](/lugar/kanjon-morace/), a cinque chilometri, e il
      [Nacionalni park Skadarsko jezero](/lugar/nacionalni-park-skadarsko-jezero/), a otto chilometri; a
      undici chilometri si estende il [Parku Kombëtar i Alpeve të Shqipërisë - Valbonë &
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/), e a quindici il [Park prirode
      Komovi](/lugar/park-prirode-komovi/).
  pt:
    intro: >-
      Durante milhões de anos, um rio foi cortando o calcário até talhar paredes com várias centenas de
      metros. Esse rio é o Cijevna, afluente do Morača, e o seu desfiladeiro é hoje um monumento natural junto
      à fronteira com a Albânia, no município de Tuzi. Ocupa 2022 hectares, tem 12 km de comprimento e 903 m
      de profundidade, sendo uma das áreas protegidas mais valiosas de Montenegro.
    landscape: >-
      Ao longo de milhões de anos, o Cijevna escavou o seu leito em calcário maciço e abriu um desfiladeiro de
      paredes verticais e múltiplas formações cársticas. O substrato é formado por rochas carbonatadas do
      Mesozoico, sobretudo calcários e dolomias dos Dináridos externos, cujas paredes atingem em alguns pontos
      várias centenas de metros de altura. Ao aproximar-se do Morača, o clima local transita de continental
      para mediterrânico.


      Essa mistura torna-se evidente na vegetação. Num espaço reduzido convivem elementos mediterrânicos,
      submediterrânicos e continentais, com muitos endemismos e espécies relíquias. Existe um sobreiral
      (Quercus ilex) excepcionalmente preservado em alguns setores, exemplo raro de vegetação mediterrânica
      autóctone, e a planta emblemática é a pinguícula Pinguicula hirtiflora, rara, protegida e registada em
      Montenegro em raríssimas localidades. No desfiladeiro foi descrita uma comunidade vegetal de avenca e
      Pinguicula hirtiflora conhecida exclusivamente deste local.
    wildlife: >-
      O desfiladeiro é um excelente local para a observação de aves. Até à data foram registadas 106 espécies,
      e as arribas servem de refúgio e nidificação para a [Águia-real](/especie/aquila_chrysaetos/), o
      [Bufo-real](/especie/bubo_bubo/) e o [Falcão-peregrino](/especie/falco_peregrinus/). O
      [Abutre-do-egito](/especie/neophron_percnopterus/) viveu aqui, mas hoje já não nidifica ou desapareceu
      de Montenegro. Ao caminhar podes avistar desde pequenas aves florestais e de espaços abertos até rapinas
      que planam sobre as escarpas. É também Área Importante para as Aves por acolher espécies como a
      águia-cobreira e o gavião-de-levante.


      Entre os mamíferos, a [Lontra-europeia](/especie/lutra_lutra/) atesta a qualidade contínua da água do
      rio, embora passe quase toda a vida escondida e raramente se deixe avistar. No cimo das arribas vive a
      camurça-balcânica, que se desloca por paredes quase verticais. Gato-bravo, raposa, texugo, marta e
      lebre-comum são sobretudo crepusculares ou noturnos, e as câmaras de armadilhagem fotográfica têm
      documentado a sua passagem. Os morcegos aproveitam grutas, fendas e troços tranquilos, e segundo os
      habitantes locais existem mais de cem grutas e algares nas redondezas, muitas por explorar.


      Na água vive a [truta-marmorada](/especie/salmo_marmoratus/), um dos salmonídeos mais ameaçados da
      região, que requer águas muito límpidas, frias e oxigenadas. Ocorrem 9 espécies de anfíbios, mais de
      metade das existentes em Montenegro, e 19 de répteis, quase metade; entre elas, a
      [tartaruga-mediterrânica](/especie/testudo_hermanni/), ameaçada principalmente pelos incêndios e pela
      perda de habitat.
    visit: >-
      A melhor forma de o compreender é percorrê-lo a pé. Um trilho sinalizado liga Cijevna Zatrijebačka à
      aldeia de Stjepovo: começa junto à ponte no caminho de Dinoša para a fronteira, sobe por antigas curvas
      em ziguezague, demora cerca de três horas e supera cerca de 730 m de desnível. Do topo avistam-se o
      desfiladeiro, os montes Prokletije, o lago Skadar e a Rumija. Existe também uma rota mista de caminhada
      e ciclismo de Dinoša até Kučka Korita e ao lago Rikavac, passando por Stjepovo e Poprat em direção ao
      katun de Zatrijebač.


      Os caminhos históricos exigem outra preparação. O trilho de Gryka Mužečka, Ljerza e Kakarić desce até ao
      rio ao longo de cerca de 5 km e demora entre 2 e 3 horas, não estando desimpedido nem sinalizado; o de
      Ćeu Rases para Dolina Ljipovice desce cerca de 6 km e demora de 3 a 4 horas; os de Škala Smedec e Kodra
      Cukthit até Dolina Smedec medem cerca de 5 km. A entidade gestora adverte que não estão preparados para
      visitas autónomas: deves ir acompanhado por um guia local e com equipamento de montanha.
    history: >-
      Pelo desfiladeiro passava um ramal da estrada romana Via Egnatia, que na Idade Média se chamou Via de
      Zenta; em Montenegro atravessava o Cijevna pela ponte de Ljemaja e seguia por Dinoša e Ćemovsko polje em
      direção à planície. Ao longo do traçado ergueram-se pontes, estalagens, moinhos de cereais e oficinas
      têxteis. Em certos troços, as gentes locais ainda lhe chamam Rruga e Arit, o caminho de ouro.


      A área está classificada como Área-Chave para a Biodiversidade, Área Importante para as Aves e para as
      Plantas, e integra a reserva da biosfera da bacia do lago Skadar. Em 2025, o município de Tuzi criou a
      empresa pública DOO Spomenik prirode Kanjon Cijevne, incumbindo-a de gerir a área protegida. O Cem é um
      dos últimos rios livres da Europa; encontra-se ameaçado pela industrialização, por pequenas centrais
      hidroelétricas e pelas alterações climáticas.
    before: >-
      Os trilhos antigos não estão sinalizados e exigem a companhia de um guia local; confirma previamente com
      a entidade gestora quais os troços praticáveis.
    around: >-
      Muito perto ficam o [Kanjon Morače](/lugar/kanjon-morace/), a cinco quilómetros, e o [Nacionalni park
      Skadarsko jezero](/lugar/nacionalni-park-skadarsko-jezero/), a oito quilómetros; a onze quilómetros
      ergue-se o [Parku Kombëtar i Alpeve të Shqipërisë - Valbonë &
      Theth](/lugar/parku-kombetar-i-alpeve-te-shqiperise/), e a quinze o [Park prirode
      Komovi](/lugar/park-prirode-komovi/).
