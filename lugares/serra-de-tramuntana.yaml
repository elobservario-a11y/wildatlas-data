resumen:
  es: >-
    La espina dorsal calcárea de Mallorca (Puig Major 1.445 m), cañones profundos como el Torrent de Pareis y
    único refugio mundial insular del buitre negro y del ferreret (*Alytes muletensis*).
  en: >-
    Mallorca's limestone backbone (Puig Major 1,445 m), deep gorges like Torrent de Pareis, and the world's
    only island redoubt for black vultures and the Majorcan midwife toad (*Alytes muletensis*).
  fr: >-
    L'échine calcaire de Majorque (Puig Major 1 445 m), ses canyons comme le Torrent de Pareis et l'unique
    refuge insulaire mondial du vautour moine et du ferreret (*Alytes muletensis*).
  de: >-
    Mallorcas Kalkstein-Rückgrat (Puig Major 1.445 m), tiefe Canyons wie der Torrent de Pareis und weltweit
    einziges Inselrefugium für Mönchsgeier und Mallorca-Geburtshelferkröte (*Alytes muletensis*).
  it: >-
    La spina dorsale calcarea di Maiorca (Puig Major 1.445 m), canyon profondi come il Torrent de Pareis e
    unico rifugio insulare al mondo per avvoltoio monaco e ferreret (*Alytes muletensis*).
  pt: >-
    A espinha dorsal calcária de Maiorca (Puig Major 1.445 m), desfiladeiros fundos como o Torrent de Pareis e
    único reduto insular mundial do abutre-preto e do ferreret (*Alytes muletensis*).
unico:
  es: >-
    Es una sierra donde milenios de agricultura en un entorno de recursos escasos han tallado terrazas,
    canales y construcciones de piedra seca sobre un macizo calcáreo.
  en: >-
    A mountain range where millennia of farming in a water-scarce environment carved terraces, aqueducts, and
    dry-stone structures directly into a limestone massif.
  fr: >-
    Une sierra où des millénaires d'agriculture en milieu aride ont sculpté terrasses, rigoles et ouvrages en
    pierre sèche sur un massif calcaire.
  de: >-
    Ein Gebirgszug, in dem jahrtausendelange Trockenlandwirtschaft Terrassen, Aquädukte und Trockensteinbauten
    auf steilem Kalkmassiv errichtet hat.
  it: >-
    Una dorsale montana dove millenni di agricoltura in un ambiente privo di risorse idriche hanno modellato
    terrazzamenti, canali e muri a secco su un massiccio calcareo.
  pt: >-
    Uma serra onde milénios de agricultura num ambiente de escassez hídrica esculpiram socalcos, aquedutos e
    construções de pedra seca sobre um maciço calcário.
observaciones:
  es: >-
    Muchas fincas tienen ganado: hay que dejar las barreras y verjas como se encuentran y llevar los perros
    atados. Los vuelos de dron y las filmaciones comerciales necesitan autorización del espacio protegido, y
    pasar por fincas privadas exige permiso de la propiedad. Para caminar, lleva ropa y calzado adecuados,
    agua abundante y protección solar; en una emergencia, llama al 112. Evita los ruidos estridentes que
    molesten a la fauna, recoge la basura y no hagas atajos, que aumentan la erosión.


    La época de peligro de incendios forestales va del 1 de mayo al 15 de octubre. La afluencia es alta en
    Valldemossa, Sóller, Formentor y Sa Calobra en verano.
texto:
  es:
    intro: >-
      Imagina una pared de roca caliza en la que se alza la cima más alta de las Baleares, el Puig Major, a
      1.436 m. Eso es la Serra de Tramuntana: una sierra de 62.403 ha de superficie terrestre y 1.123 ha de
      mar, repartida entre 20 municipios. Fue declarada Paraje Natural el 16 de marzo de 2007, y el 27 de
      junio de 2011 la UNESCO la declaró Patrimonio Mundial como paisaje cultural.
    landscape: >-
      La lluvia es la escultora. La Serra de Tramuntana recibe más lluvia que el resto de Mallorca, hasta 1507
      mm al año, frente a menos de 400 mm en otras partes de la isla, y en invierno es normal que nieve
      algunos días. Esa agua actúa sobre materiales mayoritariamente calcáreos y forma un relieve de rocas
      estriadas llamado karst, el lapiaz, con simas, cuevas y grietas: la Cova de sa Campana, de -358 m, es la
      cueva más profunda de Mallorca, y la sierra tiene además el lago subterráneo más profundo. En el Torrent
      de Pareis las paredes verticales llegan a 300 m.


      También la vegetación sigue la lluvia: en la sierra están los encinares mejor conservados de la isla.
      Los hábitats más valiosos son los de las zonas más inaccesibles, donde se concentran buena parte de los
      endemismos y las especies amenazadas: hay 25 especies botánicas endémicas y 7 endemismos exclusivamente
      mallorquines. Algunos ejemplares aislados en peñascos son reliquias vivientes de épocas anteriores más
      frías, y hay hábitats especiales en zonas sombrías, con fuentes y manantiales, fisuras profundas de las
      rocas y encinares espesos.


      El mar también cuenta. La parte marina tiene praderas de posidonia, fondos de maërl y comunidades de
      coralígeno.
    wildlife: >-
      Empieza por los acantilados. Allí está la única población mundial insular de [buitre
      negro](/especie/aegypius_monachus/), y el [águila pescadora](/especie/pandion_haliaetus/) destaca por su
      técnica de pesca. El [halcón de Eleonora](/especie/falco_eleonorae/) es una rapaz que migra al
      archipiélago balear en otoño, al revés de lo habitual entre las rapaces. El [milano
      real](/especie/milvus_milvus/) anida en las copas de los pinos y, aunque estuvo a punto de extinguirse,
      hoy es habitual verlo volando.


      En los torrentes más inaccesibles vive el [sapillo balear](/especie/alytes_muletensis/), un anfibio
      endémico hoy muy amenazado por la serpiente de agua; se describió primero como fósil, hasta que años
      después aparecieron ejemplares vivos. En el sur, entre bosques y cultivos, vive la [tortuga
      mora](/especie/testudo_graeca/), catalogada como vulnerable y amenazada por la destrucción de su hábitat
      y por su captura. Las cuevas son refugio y lugar de cría de murciélagos cavernícolas.


      Entre los mamíferos introducidos hay [gineta](/especie/genetta_genetta/),
      [marta](/especie/martes_martes/), comadreja y mapache. Los mejores meses para ir son los de primavera y
      otoño.
    visit: >-
      La mejor manera de acceder es la carretera Ma-10, que cruza el paraje de Andratx, al sur, a Pollença, al
      norte, y por la que se llega a los 20 municipios del paraje. Empieza por Lluc, donde el centro de
      interpretación de Ca s'Amitger está antes del aparcamiento del Santuario, a la izquierda, y abre todos
      los días de 9 a 16 h salvo Navidad, Año Nuevo y Reyes. Tiene una exposición permanente sobre los valores
      naturales y culturales del espacio, con guías y folletos para hacer itinerarios autoguiados.


      El camino de fondo es el GR221, con 183,3 kilómetros abiertos y señalizados, 102,3 de ellos en el
      itinerario principal. El coll de ses Cases de sa Neu es el punto más alto del recorrido, a poco más de
      mil doscientos metros, y la ruta puede recorrerse casi todo el año por el clima de la isla. Entre sus
      tramos, el itinerario de Cúber a Biniaraix pasa por el embalse de Cúber, a 750 m de altitud y rodeado
      por las montañas más altas de la sierra, y el barranco de Biniaraix es una de las maravillas
      paisajísticas de la sierra y Bien de Interés Cultural.


      Hay itinerarios accesibles con silla Joëlette, como Ses Fonts Ufanes, las casas de Planicia y Sa Volta
      des General; el préstamo de la silla es gratuito.
    history: >-
      El Consell mantiene un plan de gestión para coordinar acciones de conservación del Patrimonio Mundial.
      La UNESCO subraya que milenios de agricultura en un entorno de recursos escasos transformaron el
      terreno; el paisaje está marcado por terrazas agrícolas, obras hidráulicas con molinos de agua,
      construcciones de piedra seca y fincas.


      La propiedad es privada en casi el 95 % de la superficie protegida; el resto son fincas públicas. El
      paraje engloba además los monumentos naturales de Ses Fonts Ufanes y de los torrentes de Pareis, Gorg
      Blau y Lluc, y espacios de la red Natura 2000.
    before: >-
      Muchas fincas tienen ganado: hay que dejar las barreras y verjas como se encuentran y llevar los perros
      atados. Los vuelos de dron y las filmaciones comerciales necesitan autorización del espacio protegido, y
      pasar por fincas privadas exige permiso de la propiedad. Para caminar, lleva ropa y calzado adecuados,
      agua abundante y protección solar; en una emergencia, llama al 112. Evita los ruidos estridentes que
      molesten a la fauna, recoge la basura y no hagas atajos, que aumentan la erosión.


      La época de peligro de incendios forestales va del 1 de mayo al 15 de octubre. La afluencia es alta en
      Valldemossa, Sóller, Formentor y Sa Calobra en verano.
    around: >-
      A unos trece kilómetros está el [Parque Natural de s'Albufera de
      Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/).


      Más lejos, la [Reserva Natural de la Sierra de Malcata](/lugar/reserva-natural-da-serra-da-malcata/)
      comparte con la sierra la gineta y el buitre negro.
  en:
    intro: >-
      Picture a wall of limestone culminating in the highest peak of the Balearics, Puig Major at 1,436 m.
      That is the Serra de Tramuntana: a mountain territory spanning 62,403 ha of land and 1,123 ha of sea,
      spread across 20 municipalities. It was designated a Natural Site on 16 March 2007, and on 27 June 2011
      UNESCO declared it a World Heritage Site in the cultural landscape category.
    landscape: >-
      Rainfall is the master sculptor. The Serra de Tramuntana catches significantly more precipitation than
      the rest of Mallorca, up to 1507 mm annually compared to less than 400 mm elsewhere on the island, and
      snowfall is regular in winter. This water dissolves predominantly limestone bedrock, sculpting a fluted
      karst landscape of lapiaz, chasms, and caverns: Cova de sa Campana, at -358 m, is the deepest cave in
      Mallorca, and the range also holds the island's deepest subterranean lake. In the Torrent de Pareis,
      vertical cliffs soar 300 m high.


      Vegetation mirrors the rainfall pattern: the range shelters Mallorca's finest holm oak forests. The most
      valuable botanical habitats thrive in the most inaccessible cliffs, concentrating endemics and
      threatened flora: 25 endemic plant species and 7 taxa found exclusively on Mallorca. Isolated specimens
      clinging to crags represent living relicts of colder climatic eras, with specialized communities
      inhabiting shady gullies, karst springs, deep fissures, and dense oak groves.


      The sea is equally vital. The marine perimeter preserves extensive Posidonia oceanica meadows, maërl
      beds, and rich coralligenous reefs.
    wildlife: >-
      Begin on the cliffs. Here resides the world's only island breeding population of the [cinereous
      vulture](/especie/aegypius_monachus/), and the [osprey](/especie/pandion_haliaetus/) stands out with its
      plunging fishing technique. [Eleonora's falcon](/especie/falco_eleonorae/) is a unique raptor that
      migrates to breed in the Balearic archipelago in late summer and autumn, unlike almost all other
      European birds of prey. The [red kite](/especie/milvus_milvus/) nests in pine canopies, and having once
      hovered near regional extinction, it is now commonly seen soaring overhead.


      In the most secluded torrent gorges lives the [Majorcan midwife toad](/especie/alytes_muletensis/), an
      endemic amphibian today severely threatened by the introduced viperine water snake; it was initially
      described as a fossil before living specimens were discovered years later. In the south, among scrub and
      dry farmland, lives the [Moorish tortoise](/especie/testudo_graeca/), classified as vulnerable and
      threatened by habitat degradation and illegal collection. Deep caves provide winter roosts and nursery
      colonies for cave-dwelling bats.


      Introduced mammals include [common genet](/especie/genetta_genetta/), [European pine
      marten](/especie/martes_martes/), least weasel, and feral raccoon. The best months to visit are spring
      and autumn.
    visit: >-
      The premier access corridor is the Ma-10 mountain highway, winding through the range from Andratx in the
      south to Pollença in the north, connecting all 20 municipalities. Begin at Lluc, where the Ca s'Amitger
      interpretation center sits just before the Sanctuary car park on the left, open daily from 9 to 16 h
      except Christmas, New Year's Day, and Epiphany. It features an informative permanent exhibition on the
      natural and cultural values of the massif, with self-guided trail pamphlets.


      The backbone hiking route is the GR221 Dry Stone Route, with 183.3 kilometers open and waymarked, 102.3
      of which form the continuous main trail. Coll de ses Cases de sa Neu is the trail's highest pass,
      sitting just above twelve hundred meters, and can be walked almost year-round thanks to Mallorca's mild
      climate. Highlights include the section from Cúber to Biniaraix past the Cúber reservoir at 750 m
      surrounded by the highest peaks, and the Barranc de Biniaraix, a stepped dry-stone gorge designated an
      Asset of Cultural Interest.


      Accessible Joëlette all-terrain wheelchair routes exist at Ses Fonts Ufanes, Planícia, and Sa Volta des
      General; equipment loan is free of charge.
    history: >-
      The Island Council maintains a management plan to coordinate conservation actions for the World Heritage
      site. UNESCO emphasizes that millennia of farming in a resource-scarce environment transformed the
      landscape, leaving agricultural terraces, water mills, dry-stone structures, and traditional estates.


      Nearly 95 % of the protected area is privately owned, with the remainder consisting of public estates.
      The protected site also encompasses the natural monuments of Ses Fonts Ufanes and the gorges of Torrent
      de Pareis, Gorg Blau, and Lluc, alongside areas of the European Natura 2000 network.
    before: >-
      Many estates graze livestock: always leave gates as you find them and keep dogs on a leash. Drone
      flights and commercial filming require prior authorization from the protected area, and crossing private
      land requires permission from landowners. For hiking, wear suitable clothing and footwear, carry plenty
      of water and sun protection; in an emergency, call 112. Avoid loud noises that disturb wildlife, pack
      out all litter, and never use shortcuts that worsen erosion.


      The wildfire risk season runs from 1 May to 15 October. Visitor numbers are high in Valldemossa, Sóller,
      Formentor, and Sa Calobra in summer.
    around: >-
      About thirteen kilometers away lies the [S'Albufera de Mallorca Natural
      Park](/lugar/parc-natural-de-s-albufera-de-mallorca/).


      Farther away, the [Serra da Malcata Nature Reserve](/lugar/reserva-natural-da-serra-da-malcata/) in
      Portugal shares the common genet and black vulture with the range.
  fr:
    intro: >-
      Imaginez un immense mur de calcaire culminant au sommet des Baléares, le Puig Major, à 1 436 m. Telle
      est la Serra de Tramuntana : un ensemble montagneux de 62 403 ha terrestres et 1 123 ha marins, réparti
      sur 20 communes. Déclarée Site naturel le 16 mars 2007, l'UNESCO l'a inscrite le 27 juin 2011 au
      patrimoine mondial comme paysage culturel.
    landscape: >-
      La pluie en est l'architecte. La Serra de Tramuntana reçoit bien plus d'eau que le reste de Majorque,
      jusqu'à 1507 mm par an contre moins de 400 mm ailleurs sur l'île, et la neige y fait des apparitions
      hivernales régulières. Cette eau s'infiltre dans les roches calcaires et sculpte un relief karstique
      remarquable de lapiés, gouffres et cavernes : la Cova de sa Campana, à -358 m, est la grotte la plus
      profonde de Majorque, et la sierra abrite aussi le plus profond lac souterrain insulaire. Dans le défilé
      du Torrent de Pareis, les parois s'élèvent à pic sur 300 m.


      La végétation s'adapte à ces contrastes : la sierra conserve les plus belles yeuseraies de l'île. Les
      falaises et ravins inaccessibles concentrent la flore la plus remarquable : 25 espèces végétales
      endémiques et 7 endémiques strictes de Majorque. Plusieurs plantes réfugiées sur les crêtes sont des
      reliques d'ères glaciaires passées, côtoyant des milieux ombragés précieux près des résurgences, sources
      et fentes rocheuses.


      Le domaine marin est tout aussi remarquable, abritant de vastes herbiers de posidonies, des fonds de
      maërl et des communautés coralligènes.
    wildlife: >-
      Commencez par scruter les falaises. On y trouve l'unique population insulaire au monde de [vautour
      moine](/especie/aegypius_monachus/), tandis que le [balbuzard pêcheur](/especie/pandion_haliaetus/)
      s'illustre par ses spectaculaires plongeons en mer. Le [faucon d'Éléonore](/especie/falco_eleonorae/)
      est un rapace singulier qui migre aux Baléares à la fin de l'été pour nicher en automne. Le [milan
      royal](/especie/milvus_milvus/) installe ses nids dans la cime des pins et, après avoir frôlé
      l'extinction insulaire, tournoie aujourd'hui couramment dans le ciel.


      Dans les vasques des torrents les plus reculés survit le [crapaud accoucheur de
      Majorque](/especie/alytes_muletensis/) (ferreret), un amphibien endémique menacé par la couleuvre
      vipérine ; décrit d'abord à l'état de fossile, des spécimens vivants furent découverts des années plus
      tard. Au sud, dans les garrigues, vit la [tortue mauresque](/especie/testudo_graeca/), vulnérable et
      menacée par la dégradation des milieux et les prélèvements illégaux. Les cavernes constituent des gîtes
      majeurs pour les chauves-souris troglophiles.


      Parmi les mammifères introduits figurent la [genette commune](/especie/genetta_genetta/), la [martre des
      pins](/especie/martes_martes/), la belette et le raton laveur. Le printemps et l'automne sont les
      meilleures saisons pour la découverte.
    visit: >-
      L'artère principale est la route Ma-10, qui serpente d'Andratx au sud jusqu'à Pollença au nord, reliant
      les 20 municipalités. Faites étape à Lluc, où le centre d'accueil de Ca s'Amitger se trouve juste avant
      le sanctuaire sur la gauche, ouvert tous les jours de 9 à 16 h sauf à Noël, au Nouvel An et à
      l'Épiphanie. Son exposition permanente détaille le patrimoine naturel et culturel, avec guides et
      dépliants d'itinéraires.


      Le grand axe pédestre est le GR221 (Route de la pierre sèche), fort de 183,3 kilomètres balisés, dont
      102,3 sur le tracé principal. Le col de ses Cases de sa Neu en constitue le point culminant, à un peu
      plus de mille deux cents mètres, praticable presque toute l'année grâce à la douceur insulaire. L'étape
      de Cúber à Biniaraix longe le lac de Cúber à 750 m au pied des plus hauts sommets, avant de plonger dans
      le spectaculaire ravin de Biniaraix, classé bien d'intérêt culturel.


      Des parcours sont praticables en fauteuil tout-terrain Joëlette à Ses Fonts Ufanes, Planícia et Sa Volta
      des General, avec prêt gratuit au centre d'interprétation.
    history: >-
      Le Consell gère un plan de gestion pour coordonner les actions de conservation du patrimoine mondial.
      L'UNESCO souligne que des millénaires d'agriculture dans un milieu aux ressources rares ont façonné le
      paysage, marqué par des terrasses de culture, des moulins à eau, des murs en pierre sèche et des
      domaines ruraux.


      La propriété privée couvre près de 95 % de la superficie protégée, le reste relevant du domaine public.
      Le site intègre en outre les monuments naturels de Ses Fonts Ufanes et des torrents de Pareis, Gorg Blau
      et Lluc, ainsi que des zones du réseau Natura 2000.
    before: >-
      De nombreuses propriétés accueillent du bétail : refermez soigneusement barrières et clôtures et tenez
      les chiens en laisse. Les vols de drones et tournages commerciaux requièrent une autorisation, et la
      traversée de domaines privés nécessite l'accord des propriétaires. Pour marcher, prévoyez vêtements et
      chaussures adaptés, eau abondante et protection solaire ; en cas d'urgence, composez le 112. Évitez les
      bruits excessifs dérangeant la faune, emportez vos déchets et évitez les raccourcis qui accélèrent
      l'érosion.


      La saison à risque d'incendie s'étend du 1 mai au 15 octobre. L'affluence est forte à Valldemossa,
      Sóller, Formentor et Sa Calobra en été.
    around: >-
      À environ treize kilomètres se trouve le [parc naturel de s'Albufera de
      Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/).


      Plus loin, la [réserve naturelle de la Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/) au
      Portugal partage avec le massif la genette et le vautour moine.
  de:
    intro: >-
      Stell dir eine gewaltige Kalkfelswand vor, die im höchsten Gipfel der Balearen gipfelt, dem Puig Major
      mit 1.436 m. Das ist die Serra de Tramuntana: ein Berggebiet mit 62.403 ha Landfläche und 1.123 ha
      Meeresfläche, verteilt auf 20 Gemeinden. Am 16. März 2007 zum Naturraum erklärt, nahm die UNESCO sie am
      27. Juni 2011 als Kulturlandschaft in das Welterbe auf.
    landscape: >-
      Der Regen ist der Landschaftsbildner. Die Serra de Tramuntana empfängt erheblich mehr Niederschlag als
      das übrige Mallorca, bis zu 1507 mm im Jahr gegenüber weniger als 400 mm in anderen Inselteilen, und im
      Winter schneit es regelmäßig auf den Höhen. Das Wasser löst den Kalk und schuf Karstreliefs mit
      Karrenfeldern, Dolinen und Höhlen: Die Cova de sa Campana ist mit -358 m die tiefste Höhle Mallorcas,
      und die Serra birgt zudem den tiefsten unterirdischen See der Insel. Im Canyon des Torrent de Pareis
      ragen senkrechte Wände 300 m empor.


      Die Vegetation folgt dem Regenreichtum: Hier wachsen die dichtesten Steineichenwälder Mallorcas. Die
      unzugänglichsten Steilwände beherbergen 25 endemische Pflanzenarten, darunter 7 Exklusiv-Endemiten
      Mallorcas. Manche Reliktarten auf Felsvorsprüngen stammen aus kälteren Erdzeitaltern; schattige
      Schluchten, Quellen und Felsspalten bilden geschützte Mikrohabitate.


      Auch der Meeresbereich ist von herausragendem Wert mit Seegraswiesen aus Posidonia oceanica,
      Maërl-Gründen und Korallengemeinschaften.
    wildlife: >-
      Beginne an den Steilküsten. Hier brütet die weltweit einzige Inselpopulation des
      [Mönchsgeiers](/especie/aegypius_monachus/), und der [Fischadler](/especie/pandion_haliaetus/)
      demonstriert spektakuläre Stoßtauchgänge. Der [Eleonorenfalke](/especie/falco_eleonorae/) ist ein
      Greifvogel, der im Spätsommer auf die Balearen zieht, um erst im Herbst zu brüten. Der
      [Rotmilan](/especie/milvus_milvus/) nistet in Kiefernkronen und kreist nach erfolgreicher Erholung
      wieder regelmäßig am Himmel.


      In abgelegenen Sturzbächen lebt die [Mallorca-Geburtshelferkröte](/especie/alytes_muletensis/)
      (Ferreret), ein gefährdeter Endemit, der durch die eingeschleppte Vipernatter bedroht wird; sie wurde
      zunächst als Fossil beschrieben, bevor Jahre später lebende Tiere entdeckt wurden. Im Süden lebt die
      [Maurische Landschildkröte](/especie/testudo_graeca/) in lichten Wäldern und Kulturland, gefährdet durch
      Biotopverlust und Wildfänge. Karsthöhlen dienen Fledermäusen als Winterquartiere und Wochenstuben.


      Zu den eingeführten Säugern zählen [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/),
      [Baummarder](/especie/martes_martes/), Mauswiesel und Waschbär. Frühling und Herbst bieten die besten
      Reisezeiten.
    visit: >-
      Hauptverkehrsachse ist die Panoramastraße Ma-10, die das Gebirge von Andratx im Süden bis Pollença im
      Norden durchzieht und alle 20 Gemeinden erschließt. Beginne in Lluc am Besucherzentrum Ca s'Amitger kurz
      vor dem Klosterparkplatz, täglich von 9 bis 16 h geöffnet außer an Weihnachten, Neujahr und Dreikönig.
      Eine Dauerausstellung veranschaulicht Natur- und Kulturwerte mit Wanderführern für individuelle Touren.


      Die Fernwanderroute schlechthin ist der Trockensteinweg GR221 mit 183,3 markierten Kilometern, davon
      102,3 auf der Hauptroute. Der Coll de ses Cases de sa Neu bildet mit etwas über zwölfhundert Metern den
      höchsten Pass, der fast ganzjährig begangen werden kann. Zu den Höhepunkten zählt der Abschnitt von
      Cúber nach Biniaraix am Cúber-Stausee auf 750 m Höhe sowie die Schlucht Barranc de Biniaraix mit ihren
      gepflasterten Serpentinen, ein geschütztes Kulturgut.


      Barrierefreie Pfade mit geländegängigen Joëlette-Rollstühlen gibt es bei Ses Fonts Ufanes, Planícia und
      Sa Volta des General; Leihgeräte sind am Besucherzentrum kostenlos verfügbar.
    history: >-
      Der Inselrat unterhält einen Managementplan zur Koordination der Erhaltungsmaßnahmen des Welterbes. Die
      UNESCO hebt hervor, dass jahrtausendelange Landwirtschaft in einem ressourcenarmen Umfeld die Landschaft
      prägte, gekennzeichnet durch Terrassenkulturen, Wassermühlen, Trockensteinmauern und Landgüter.


      Fast 95 % der geschützten Fläche befinden sich in Privatbesitz; der Rest entfällt auf öffentliche Güter.
      Das Gebiet umfasst zudem die Naturdenkmäler Ses Fonts Ufanes sowie die Sturzbäche Pareis, Gorg Blau und
      Lluc sowie Gebiete des Netzes Natura 2000.
    before: >-
      Auf vielen Gütern weidet Vieh: Schließe Gatter stets sorgfältig und führe Hunde an der Leine.
      Drohnenflüge und kommerzielle Dreharbeiten bedürfen einer Genehmigung, und das Queren von Privatland
      erfordert die Zustimmung der Eigentümer. Zum Wandern sind wetterfeste Kleidung, Wanderschuhe, reichlich
      Wasser und Sonnenschutz unerlässlich; im Notfall wähle die 112. Vermeide lauten Lärm zum Schutz der
      Tiere, nimm Abfälle mit und meide Abkürzungen, die die Erosion verstärken.


      Die Waldbrandgefahr-Saison dauert vom 1. Mai bis 15. Oktober. Das Besucheraufkommen ist in Valldemossa,
      Sóller, Formentor und Sa Calobra im Sommer hoch.
    around: >-
      Etwa dreizehn Kilometer entfernt liegt der [Naturpark S'Albufera de
      Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/).


      Weiter entfernt liegt das Schutzgebiet [Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/)
      in Portugal, das Ginsterkatze und Mönchsgeier mit der Tramuntana teilt.
  it:
    intro: >-
      Immagina una bastionata di roccia calcarea culminante nella cima più alta delle Baleari, il Puig Major a
      1.436 m. Questa è la Serra de Tramuntana: un rilievo montuoso di 62.403 ha di superficie terrestre e
      1.123 ha di mare, ripartito tra 20 comuni. È stata dichiarata Sito Naturale il 16 marzo 2007, e il 27
      giugno 2011 l'UNESCO l'ha iscritta nel Patrimonio Mondiale come paesaggio culturale.
    landscape: >-
      La pioggia ne è l'artefice principale. La Serra de Tramuntana riceve molte più precipitazioni rispetto
      al resto di Maiorca, fino a 1507 mm annui contro meno di 400 mm in altre parti dell'isola, e in inverno
      la neve imbianca regolarmente le vette. L'acqua erode i banchi calcarei forgiando paesaggi carsici
      ricchi di campi carreggiati, inghiottitoi e grotte: la Cova de sa Campana, a -358 m, è la cavità più
      profonda di Maiorca, e la catena racchiude anche il lago ipogeo più profondo. Nella forra del Torrent de
      Pareis le pareti verticali toccano i 300 m.


      La copertura vegetale riflette l'umidità: la catena custodisce le leccete più vetuste dell'isola. Le
      pareti rupestri inaccessibili concentrano specie endemiche e protette: 25 essenze botaniche endemiche e
      7 esclusive di Maiorca. Piante isolate sulle cenge sono relitti di epoche glaciali, mentre microclimi
      umidi si sviluppano presso sorgenti, spaccature rocciose e formazioni boscose fitte.


      Anche il mare circostante è prezioso, con praterie di Posidonia oceanica, fondali a maërl e formazioni a
      coralligeno.
    wildlife: >-
      Inizia dalle falesie costiere. Qui vive l'unica colonia insulare al mondo di [avvoltoio
      monaco](/especie/aegypius_monachus/), e il [falco pescatore](/especie/pandion_haliaetus/) si distingue
      per le sue spettacolari picchiate in mare. Il [falco della Regina](/especie/falco_eleonorae/) è un
      rapace che migra nell'arcipelago balearico a fine estate per nidificare in autunno. Il [nibbio
      reale](/especie/milvus_milvus/) nidifica sulle chiome dei pini e, dopo aver rischiato l'estinzione
      locale, volteggia oggi regolarmente nei cieli.


      Nelle forre più impervie vive il [rospo ostetrico di Maiorca](/especie/alytes_muletensis/) (ferreret),
      anfibio endemico minacciato dalla natrice tassellata; fu descritto come fossile prima del ritrovamento
      di esemplari viventi anni dopo. Al sud, nella macchia e nei coltivi, abita la [testuggine
      greca](/especie/testudo_graeca/), specie vulnerabile minacciata dalla distruzione degli habitat e dal
      bracconaggio. Le grotte offrono ricovero e siti riproduttivi ai pipistrelli cavernicoli.


      Tra i mammiferi introdotti figurano [genetta](/especie/genetta_genetta/),
      [martora](/especie/martes_martes/), donnola e procione. Le stagioni più favorevoli per le escursioni
      sono primavera e autunno.
    visit: >-
      La via d'accesso privilegiata è la statale panoramica Ma-10, che traversa il comprensorio da Andratx a
      sud fino a Pollença a nord, toccando tutti i 20 comuni. Conviene fare tappa a Lluc, dove il centro
      visite di Ca s'Amitger sorge poco prima del parcheggio del santuario sulla sinistra, aperto tutti i
      giorni dalle 9 alle 16 h tranne a Natale, Capodanno e per l'Epifania. Ospita un percorso espositivo sui
      valori naturali e culturali dell'area, con mappe e guide per itinerari a piedi.


      L'itinerario escursionistico cardine è la Ruta de Pedra en Sec GR221, con 183,3 chilometri aperti e
      tracciati, 102,3 dei quali sul percorso principale. Il Coll de ses Cases de sa Neu ne rappresenta il
      valico più alto, a poco più di milleduecento metri, percorribile quasi tutto l'anno grazie al clima
      mite. Tra i tratti più suggestivi, la tappa da Cúber a Biniaraix costeggia il lago di Cúber a 750 m al
      cospetto delle vette maggiori, per poi discendere nella gola del Barranc de Biniaraix, monumento
      paesaggistico tutelato.


      Vi sono sentieri attrezzati per carrozzine fuoristrada Joëlette a Ses Fonts Ufanes, Planícia e Sa Volta
      des General, con noleggio gratuito al centro visite.
    history: >-
      Il Consell mantiene un piano di gestione per coordinare le azioni di conservazione del sito Patrimonio
      Mondiale. L'UNESCO sottolinea che millenni di agricoltura in un ambiente con scarse risorse hanno
      modellato il territorio, caratterizzato da terrazzamenti agricoli, mulini ad acqua, opere in pietra a
      secco e poderi storici.


      La proprietà privata copre quasi il 95 % della superficie tutelata, mentre il resto è costituito da
      tenute pubbliche. Il sito include inoltre i monumenti naturali di Ses Fonts Ufanes e delle forre di
      Torrent de Pareis, Gorg Blau e Lluc, oltre a zone della rete Natura 2000.
    before: >-
      Molti poderi ospitano bestiame: richiudi sempre cancelli e recinzioni e tieni i cani al guinzaglio. Il
      volo di droni e le riprese commerciali richiedono l'autorizzazione dell'area protetta, e l'accesso ai
      fondi privati richiede il consenso dei proprietari. Per camminare, porta abbigliamento e calzature
      adeguati, abbondante acqua e protezione solare; in caso di emergenza, chiama il 112. Evita rumori
      molesti che disturbino la fauna, riporta indietro i rifiuti ed evita scorciatoie che alimentano
      l'erosione.


      Il periodo a rischio di incendi boschivi va dal 1 maggio al 15 ottobre. L'affluenza è elevata a
      Valldemossa, Sóller, Formentor e Sa Calobra in estate.
    around: >-
      A circa tredici chilometri si trova il [Parco Naturale di S'Albufera de
      Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/).


      Più lontano, la [Riserva Naturale della Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/)
      in Portogallo condivide con la serra la genetta e l'avvoltoio monaco.
  pt:
    intro: >-
      Imagina uma muralha de rocha calcária encimada pelo cume mais alto das Baleares, o Puig Major, a 1.436 m
      de altitude. Assim é a Serra de Tramuntana: um território montanhoso com 62.403 ha de superfície
      terrestre e 1.123 ha de mar, repartido por 20 municípios. Foi declarada Sítio Natural a 16 de março de
      2007, e a 27 de junho de 2011 a UNESCO classificou-a como Património Mundial na categoria de paisagem
      cultural.
    landscape: >-
      A precipitação é a grande escultora do relevo. A Serra de Tramuntana recebe muito mais chuva do que o
      resto de Maiorca, até 1507 mm anuais face a menos de 400 mm noutros pontos da ilha, e no inverno neva
      com regularidade nos cumes. Essa água infiltra-se nos calcários gerando formações cársicas com campos de
      lapiás, algares e grutas: a Cova de sa Campana, a -358 m, é a cavidade mais profunda de Maiorca,
      acolhendo a serra o lago subterrâneo mais fundo. No desfiladeiro do Torrent de Pareis as escarpas
      verticais erguem-se a 300 m de altura.


      A vegetação acompanha a pluviosidade: na serra encontram-se os sobreirais e azinhais mais bem
      conservados da ilha. As falésias inacessíveis abrigam 25 espécies botânicas endémicas e 7 endemismos
      exclusivos de Maiorca. Diversos exemplares isolados em penhascos são relíquias de épocas glaciares
      passadas, existindo habitats ripícolas e florestais de grande valor em barrancos sombrios e nascentes.


      O mar circundante é igualmente rico, albergando pradarias de Posidonia oceanica, fundos de maërl e
      comunidades de coralígeno.
    wildlife: >-
      Começa pelas escarpas litorais. Aí nidifica a única população insular do planeta de
      [abutre-preto](/especie/aegypius_monachus/), e a [águia-pesqueira](/especie/pandion_haliaetus/)
      sobressai pela perícia dos seus mergulhos piscatórios. O [falcão-da-rainha](/especie/falco_eleonorae/) é
      uma rapina singular que migra para o arquipélago das Baleares no final do verão para criar em pleno
      outono. O [milhafre-real](/especie/milvus_milvus/) nidifica nas copas dos pinheiros e, depois de ter
      estado à beira da extinção regional, voa hoje regularmente nos céus maiorquinos.


      Nos ribeiros mais recônditos sobrevive o [sapo-parteiro-de-maiorca](/especie/alytes_muletensis/)
      (ferreret), um anfíbio endémico ameaçado pela cobra-de-água-viperina; foi identificado inicialmente como
      fóssil antes de serem encontrados espécimes vivos anos mais tarde. No sul, em matagais e campos
      agrícolas, ocorre a [tartaruga-grega](/especie/testudo_graeca/), catalogada como vulnerável pela perda
      de habitat e capturas ilegais. As grutas proporcionam abrigo a colónias de morcegos cavernícolas.


      Entre os mamíferos introduzidos contam-se a [gineta](/especie/genetta_genetta/), a [marta do pinheiro
      europeia](/especie/martes_martes/), a doninha e o guaxinim. A primavera e o outono são as melhores
      épocas para a visitação.
    visit: >-
      A principal via de circulação é a estrada cénica Ma-10, que atravessa a serra de Andratx, a sul, até
      Pollença, a norte, servindo os 20 municípios. Convém parar em Lluc, onde o centro de interpretação de Ca
      s'Amitger se situa antes do parque do santuário, à esquerda, abrindo diariamente das 9 às 16 h exceto no
      Natal, Ano Novo e Dia de Reis. Apresenta uma mostra permanente sobre o património natural e etnográfico,
      com brochuras e mapas para percursos pedestres.


      O grande trilho estruturante é a Ruta de Pedra en Sec GR221, com 183,3 quilómetros sinalizados, 102,3
      dos quais no itinerário principal. O Coll de ses Cases de sa Neu é o passo de montanha mais alto, a
      pouco mais de mil e duzentos metros de altitude, percorrível em quase todas as estações graças ao clima
      ameno. Entre os troços cénicos avultam a ligação de Cúber a Biniaraix junto à albufeira de Cúber a 750 m
      de altitude e a descida do Barranc de Biniaraix, monumento paisagístico classificado.


      Existem percursos adaptados para cadeiras de rodas Joëlette em Ses Fonts Ufanes, Planícia e Sa Volta des
      General, com empréstimo gratuito facultado no centro de interpretação.
    history: >-
      O Consell mantém um plano de gestão para coordenar as ações de conservação do sítio classificado como
      Património Mundial. A UNESCO salienta que milénios de agricultura num ambiente de escassez hídrica
      transformaram o relevo, pontuado por socalcos de cultivo, moinhos de água, construções de pedra seca e
      propriedades rurais.


      A propriedade é privada em quase 95 % da área protegida, sendo o restante constituído por herdades
      públicas. O espaço abrange ainda os monumentos naturais de Ses Fonts Ufanes e dos desfiladeiros de
      Torrent de Pareis, Gorg Blau e Lluc, bem como setores da rede Natura 2000.
    before: >-
      Muitas herdades têm gado: deixa sempre portões e cancelas como os encontraste e conduz os cães pela
      trela. Os voos com drones e as filmagens comerciais exigem autorização da área protegida, e a travessia
      de propriedades privadas carece de autorização dos proprietários. Para caminhar, leva roupa e calçado
      adequados, água abundante e protetor solar; numa emergência, liga para o 112. Evita ruídos estridentes
      que perturbem a fauna, recolhe o lixo e não faças atalhos que aceleram a erosão.


      A época de risco de incêndios florestais decorre de 1 de maio a 15 de outubro. A afluência é elevada em
      Valldemossa, Sóller, Formentor e Sa Calobra no verão.
    around: >-
      A cerca de treze quilómetros estende-se o [Parque Natural de S'Albufera de
      Mallorca](/lugar/parc-natural-de-s-albufera-de-mallorca/).


      Mais longe, a [Reserva Natural da Serra da Malcata](/lugar/reserva-natural-da-serra-da-malcata/) em
      Portugal partilha a gineta e o abutre-preto com a serra.
