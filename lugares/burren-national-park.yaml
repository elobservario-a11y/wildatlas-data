resumen:
  es: >-
    Pavimentos de caliza donde crecen juntas plantas árticas, alpinas y mediterráneas, junto a lagos que
    aparecen y desaparecen (turloughs).
  en: >-
    Limestone pavements where Arctic, alpine, and Mediterranean plants mingle beside ephemeral lakes known as
    turloughs.
  fr: >-
    Pavements calcaires où se mêlent flores arctique, alpine et méditerranéenne, au bord de lacs éphémères
    (turloughs).
  de: >-
    Kalksteinplateaus, auf denen arktische, alpine und mediterrane Pflanzen nebeneinander wachsen, gesäumt von
    periodischen Turlough-Seen.
  it: >-
    Campi carreggiati di calcare dove convivono piante artiche, alpine e mediterranee, accanto a laghi carsici
    effimeri (turlough).
  pt: >-
    Pavimentos de calcário onde convivem plantas árticas, alpinas e mediterrânicas, junto a lagoas cársicas
    efémeras (turloughs).
unico:
  es: >-
    Plantas árticas, mediterráneas, de cal y de ácido crecen una al lado de otra sobre un suelo que parece
    solo roca.
  en: Arctic, Mediterranean, calcicole, and acid-loving flora thrive side by side upon bare stone.
  fr: >-
    Plantes arctiques, méditerranéennes, calcicoles et acidophiles prospèrent côte à côte sur une roche nue en
    apparence.
  de: >-
    Arktische, mediterrane, kalkliebende und säureliebende Pflanzen gedeihen nebeneinander auf scheinbar
    nacktem Fels.
  it: >-
    Specie vegetali artiche, mediterranee, calcicole e acidofile crescono fianco a fianco su una roccia in
    apparenza sterile.
  pt: >-
    Plantas árticas, mediterrânicas, calcícolas e acidófilas prosperam lado a lado sobre um solo que parece
    pura rocha.
observaciones:
  es: >-
    El terreno calizo puede ser accidentado y empinado, y cada sendero se señala con marcas de colores. No hay
    que mover ni llevarse rocas o fósiles, ni arrancar plantas ni molestar a la fauna. Los perros solo se
    admiten con correa. En los días cálidos y húmedos puede haber nubes de mosquitos, y fuera de los caminos
    hay riesgo de garrapatas, que pueden transmitir la enfermedad de Lyme. Comprueba antes de ir los horarios
    del punto de información y del autobús.
texto:
  es:
    intro: >-
      Parece solo piedra, y es uno de los sitios más ricos en flores de Irlanda. El Parque Nacional del Burren
      ocupa el rincón sureste del Burren, en el condado de Clare, y su nombre viene del irlandés Boíreann,
      «lugar rocoso». Es el más pequeño de los ocho parques nacionales de Irlanda y el único que se gestiona
      como un paisaje: su flora y su fauna dependen de la ganadería y de un mantenimiento continuo.
    landscape: >-
      Empieza por lo que ves: roca gris. La caliza se formó como sedimento en un mar tropical hace unos 350
      millones de años y guarda corales, erizos, lirios de mar y amonites fósiles. Después llegó el hielo, que
      redondeó las colinas y dejó grandes bloques erráticos sobre el lapiaz de Rockforest, al este de
      Mullaghmór. El Burren es uno de los mejores ejemplos de paisaje glaciokárstico del mundo, y la
      karstificación que ves hoy solo ocurre desde la última edad de hielo, hace unos 10.000 años: es
      relativamente joven comparada con el karst de Europa oriental.


      Esa roca no es una sola cosa. El parque reúne ejemplos de todos los hábitats mayores del Burren: lapiaz,
      pastizal calcáreo, matorral de avellano, bosque de fresno y avellano, turloughs, lagos, fuentes
      petrificantes, acantilados y turbera baja. Los turloughs son un buen ejemplo de lo raro del lugar: zonas
      que se inundan en invierno o con lluvias fuertes, alimentadas por agua subterránea, cuyo nombre irlandés
      significa «lago que desaparece». Y mientras muchos humedales similares del país se han perdido por el
      drenaje, el Burren conserva extensas áreas intactas de turbera baja.


      Grandes extensiones del sur están cubiertas de matorral de avellano, que da refugio a tejones, martas,
      zorros, ardillas rojas, ratones y musarañas.
    wildlife: >-
      Lo primero es la flor. Aproximadamente el 75 % de las plantas de Irlanda están representadas aquí,
      incluidas 23 de las 27 orquídeas autóctonas. Las flores que simbolizan el Burren son la genciana de
      primavera, la dryas de montaña, la potentilla arbustiva y el geranio sanguíneo, y en las terrazas altas
      el heliantemo canoso. La dryas, propia de zonas subárticas y de montaña, crece junto al geranio
      sanguíneo y la orquídea de flores densas, de distribución mediterránea.


      Y hay calendario. La genciana de primavera, la más pequeña de las gencianas, florece de abril a junio.
      Las primeras orquídeas del año son la orquídea púrpura temprana y la de flores densas. La orquídea mosca
      florece en mayo y junio sobre lapiaz, matorral y suelos calcáreos secos; la orquídea abeja se busca en
      junio y julio; y la elleborina de hoja de espada, una orquídea rara, abre en junio y julio.


      Entre los animales, el parque tiene noventa y cinco especies de aves registradas, al menos 50 de ellas
      reproductoras. Destacan el cuervo, el [halcón peregrino](/especie/falco_peregrinus/), el cernícalo, el
      esmerejón y el aguilucho pálido. En invierno, con lagos y turloughs llenos, invernan aves acuáticas como
      el [zarapito real](/especie/numenius_arquata/), el avefría y el chorlito dorado, y llegan los [cisnes
      cantores](/especie/cygnus_cygnus/).


      La mayoría de los mamíferos son nocturnos, pero de día pueden verse liebres, zorros, cabras
      asilvestradas y musarañas pigmeas; el armiño aparece entre los muros de piedra. Hay siete especies de
      murciélagos, entre ellas el murciélago pequeño de herradura, amenazado a escala internacional; las
      cuevas pequeñas del parque le sirven para hibernar. Las cabras asilvestradas, descendientes de cabras
      domésticas escapadas, se ven con sol en las laderas y con mal tiempo se refugian en el bosque y el
      matorral. También viven aquí las dos especies de reptiles de Irlanda, y alrededor de Mullaghmore está el
      mejor sitio de mariposas del país: veintisiete de las 33 especies residentes y migratorias regulares.
    visit: >-
      La mejor entrada es el punto de información de Corofin, un pueblo a 8 km del parque. Allí los guías
      ayudan a elegir sendero, informan del estado de los caminos y dan mapas. De mayo a septiembre, un
      autobús gratuito conecta Corofin con el inicio de los senderos en Kenny’s Cross/Gortlecka, que está en
      una zona rural tranquila, sin aparcamiento señalizado ni servicios.


      Hay siete senderos señalizados en el parque y en la reserva de Slieve Carran, más un camino verde. Van
      de un paseo de 30 minutos a tres horas sobre colinas de caliza. Para empezar, el Knockaunroe Turlough
      (ruta naranja) es un circuito de 1,3 km por bosque de fresno y avellano, pastizal seco y un turlough,
      apto para todas las edades. El Nature Trail (ruta blanca) mide 1,5 km por bosque en una dolina, prados
      de siega y lapiaz, con vistas a Mullaghmore y al lago Gealáin. Para quien quiera más, el Mullaghmore
      Loop (ruta azul) rodea la cumbre en 7,5 km por la orilla del lago Gealáin y amplios lapiaces.


      Al otro lado, en la reserva de Slieve Carran, la ruta marrón de 2,5 km incluye un oratorio de piedra,
      una cueva y un pozo sagrado de san Colman MacDuagh, que según la tradición fundó aquí un eremitorio en
      el siglo VII.
    history: >-
      En el Neolítico, hacia el 4000 a. C., llegaron colonos que cambiaron el paisaje talando y quemando, y
      levantaron monumentos megalíticos como el dolmen de Poulnabrone. El parque se fundó y abrió al público
      en 1991, dentro de un territorio más amplio donde el Burren y los acantilados de Moher forman un
      geoparque.


      Hoy se gestiona sobre todo para conservar la naturaleza, y eso incluye una práctica antigua: el ganado
      pasta en las colinas en invierno, para que la hierba esté corta en primavera y florezcan muchas
      especies. Se llama «winterage» o trashumancia inversa.
    before: >-
      El terreno calizo puede ser accidentado y empinado, y cada sendero se señala con marcas de colores. No
      hay que mover ni llevarse rocas o fósiles, ni arrancar plantas ni molestar a la fauna. Los perros solo
      se admiten con correa. En los días cálidos y húmedos puede haber nubes de mosquitos, y fuera de los
      caminos hay riesgo de garrapatas, que pueden transmitir la enfermedad de Lyme. Comprueba antes de ir los
      horarios del punto de información y del autobús.
  en:
    intro: >-
      It looks like barren rock, yet it is one of the most botanically prolific landscapes in Ireland. Burren
      National Park occupies the south-eastern corner of the Burren in County Clare, taking its name from the
      Irish Boíreann, "a rocky place". It is the smallest of Ireland's eight national parks and the only one
      managed as an integrated cultural landscape: its flora and fauna depend directly on cattle grazing and
      enduring rural tradition.
    landscape: >-
      Begin with what lies before your eyes: grey rock. The limestone formed as seabed sediment in a warm
      tropical ocean some 350 million years ago, entombing fossil corals, crinoids, sea urchins, and
      ammonites. Then came the ice sheets, smoothing the hills into terraced contours and depositing massive
      granite erratics across the limestone pavement of Rockforest, east of Mullaghmór. The Burren ranks among
      the world's finest glaciokarst landscapes, and the surface karstification visible today dates only from
      the retreat of the last ice age, some 10,000 years ago: geologically youthful compared with Eastern
      European karst.


      That rock is far from uniform. The park assembles examples of every major Burren habitat:
      clint-and-grike pavement, calcareous grasslands, hazel scrub, ash-hazel woodland, turloughs, springs,
      limestone cliffs, and low fen peatlands. The turloughs exemplify the hydrological quirk of the region:
      depressions that fill during wet winters and drain through underground conduits, their Irish name
      translating as "disappearing lake". While many comparable wetlands across Ireland have been lost to land
      drainage, the Burren preserves extensive, undisturbed fens.


      Vast tracts in the south are cloaked in dense hazel scrub, offering cover to European badgers, pine
      martens, red foxes, red squirrels, wood mice, and pygmy shrews.
    wildlife: >-
      The flora is paramount. Approximately 75% of Ireland's native plant species are represented here,
      including 23 of the island's 27 native orchids. Iconic flowers emblematic of the Burren include the
      spring gentian, mountain avens, shrubby cinquefoil, and bloody cranesbill, joined on high terraces by
      hoary rockrose. Mountain avens, characteristic of subarctic and alpine tundra, grows in direct contact
      with bloody cranesbill and dense-flowered orchid, both of Mediterranean lineage.


      Timing follows a precise botanical calendar. The vivid spring gentian, smallest of the gentians,
      blossoms from April to June. Earliest among the orchids are early-purple orchid and dense-flowered
      orchid. Fly orchid blooms in May and June across sheltered grikes, scrub, and dry rendzinas; bee orchid
      peaks in June and July; and the rare sword-leaved helleborine opens in June and July.


      Among fauna, ninety-five bird species have been recorded in the park, with at least 50 breeding locally.
      Standouts include common raven, [peregrine falcon](/especie/falco_peregrinus/), common kestrel, merlin,
      and hen harrier. In winter, when turloughs and lakes fill, wetland visitors arrive: [Eurasian
      curlew](/especie/numenius_arquata/), northern lapwing, European golden plover, and overwintering
      [whooper swans](/especie/cygnus_cygnus/).


      Most mammals are crepuscular, though Irish hares, foxes, feral goats, and pygmy shrews are frequently
      encountered by day; stoats hunt along stone field boundaries. Seven bat species occur, notably the
      internationally threatened lesser horseshoe bat, which uses small solution caves for hibernation. Feral
      herds of Old Irish goats forage along crags in fair weather and shelter in hazel thickets during
      Atlantic gales. Ireland's two native reptile species occur, and the hills around Mullaghmore constitute
      the country's premier butterfly stronghold: twenty-seven of Ireland's 33 resident and regular migrant
      butterflies occur on site.
    visit: >-
      The principal gateway is the information point in Corofin, a village 8 km from the park boundary.
      Resident guides assist with trail selection, trail conditions, and maps. From May to September, a free
      shuttle bus operates between Corofin and the main trailheads at Kenny’s Cross/Gortlecka, situated in
      quiet countryside devoid of dedicated parking or facilities.


      Seven waymarked trails cross the national park and the adjacent Slieve Carran Nature Reserve, alongside
      an unmarked green road. They range from a 30-minute stroll to a three-hour hike across terraced
      limestone hills. For an introductory walk, the Knockaunroe Turlough loop (orange route) covers 1.3 km
      through ash-hazel woods, dry meadow, and a turlough bed, suitable for all ages. The Nature Trail (white
      route) spans 1.5 km across doline woodland, hay meadows, and clints, with views toward Mullaghmore and
      Lough Gealáin. For a longer trek, the Mullaghmore Loop (blue route) circles the peak over 7.5 km along
      Lough Gealáin and wild limestone benches.


      Across at Slieve Carran, the 2.5 km brown trail leads to a stone oratory, hermit cave, and sacred well
      dedicated to Saint Colman MacDuagh, who according to tradition founded a hermitage here in the seventh
      century.
    history: >-
      During the Neolithic, around 4000 BC, early farming settlers reshaped the landscape through woodland
      clearance and burning, raising megalithic chamber tombs such as the Poulnabrone portal dolmen. The
      national park was established and opened to the public in 1991, forming part of the wider Burren and
      Cliffs of Moher UNESCO Global Geopark.


      Today habitat management relies on an ancient pastoral mechanism: cattle graze the upland limestone
      terraces throughout the winter months, keeping fast-growing grasses cropped so that light can reach
      delicate seedlings in spring. This centuries-old practice is known as "winterage".
    before: >-
      The limestone terrain is uneven, fissured, and occasionally steep; stick strictly to colour-coded trail
      markers. Do not disturb, collect, or remove stones or fossils, and leave all wild plants and animals
      unharmed. Dogs must be kept on leads at all times. On warm, humid days midges can be troublesome, and
      traversing rough scrub carries risk of tick bites and Lyme disease. Check visitor centre opening hours
      and shuttle schedules before travelling.
  fr:
    intro: >-
      On n'y voit d'abord que de la pierre grise, et c'est pourtant l'un des espaces les plus riches en fleurs
      d'Irlande. Le parc national du Burren occupe le quart sud-est de la région du Burren, dans le comté de
      Clare ; son nom dérive du gaélique irlandais Boíreann, « lieu pierreux ». C'est le plus petit des huit
      parcs nationaux irlandais et le seul géré comme un paysage agricole vivant : sa flore et sa faune
      dépendent d'un pâturage séculaire et d'un entretien constant.
    landscape: >-
      Tout commence par la roche grise. Le calcaire s'est déposé au fond d'une mer tropicale chaude il y a
      environ 350 millions d'années, piégeant coraux, oursins, lys de mer et ammonites fossiles. Puis vinrent
      les glaciers, qui rabotèrent les collines en gradins et abandonnèrent d'immenses blocs erratiques sur le
      lapiaz de Rockforest, à l'est du Mullaghmór. Le Burren constitue l'un des plus remarquables paysages
      glaciokarstiques au monde, et la karstification superficielle visible aujourd'hui date seulement du
      recul de la dernière glaciation, il y a environ 10 000 ans : un karst géologiquement très jeune comparé
      à celui d'Europe de l'Est.


      Cette pierre n'est pas uniforme. Le parc réunit tous les grands milieux du Burren : lapiéz sculptés,
      pelouses calcaires, taillis de noisetiers, bois de frênes, turloughs, lacs temporaires, sources
      pétrifiantes, falaises et tourbières basses alcalines. Les turloughs illustrent l'étrangeté hydrologique
      des lieux : des dépressions inondées en hiver ou lors de fortes pluies par résurgence souterraine, dont
      le nom irlandais signifie « lac qui disparaît ». Alors que tant de zones humides ont disparu en Irlande
      par drainage, le Burren préserve de vastes tourbières intactes.


      De larges étendues au sud sont couvertes d'un épais maquis de noisetiers abritant blaireaux, martres des
      pins, renards, écureuils roux, mulots et musaraignes.
    wildlife: >-
      La flore est la reine des lieux. Près de 75 % des plantes indigènes d'Irlande sont représentées ici,
      dont 23 des 27 orchidées sauvages de l'île. Les emblèmes végétaux du Burren sont la gentiane
      printanière, la dryade à huit pétales, la potentille arbustive et le géranium sanguin, rejoints sur les
      hauts gradins par l'hélianthème blanc. La dryade, relique subarctique et montagnarde, fleurit à côté du
      géranium sanguin et de l'orchis à fleurs denses, d'affinité méditerranéenne.


      Le calendrier s'égrène mois par mois. La gentiane printanière, la plus menue des gentianes, éclot
      d'avril à juin. Les premières orchidées de l'année sont l'orchis mâle et l'orchis à fleurs denses.
      L'orchis mouche fleurit en mai et juin dans les fissures et friches calcaires ; l'orchis abeille
      s'observe en juin et juillet ; et la rare épipactis à feuilles de sabre s'ouvre en juin et juillet.


      Côté faune, quatre-vingt-quinze espèces d'oiseaux ont été recensées, dont au moins 50 nicheuses. On y
      remarque le grand corbeau, le [faucon pèlerin](/especie/falco_peregrinus/), le faucon crécerelle, le
      faucon émerillon et le busard Saint-Martin. En hiver, les dépressions inondées accueillent des
      hivernants comme le [courlis cendré](/especie/numenius_arquata/), le vanneau huppé, le pluvier doré et
      des vols de [cygnes chanteurs](/especie/cygnus_cygnus/).


      La plupart des mammifères sont nocturnes, mais lièvres d'Irlande, renards, chèvres férales et
      musaraignes pygmées se laissent voir de jour ; l'hermine chasse le long des murets de pierre sèche. Sept
      espèces de chauves-souris hantent le parc, dont le petit rhinolophe, menacé à l'échelle européenne, qui
      hiberne dans les petites cavités karstiques. Deux espèces de reptiles peuplent aussi le site, et les
      abords du Mullaghmore forment le plus riche sanctuaire de papillons d'Irlande : vingt-sept des 33
      espèces sédentaires et migratrices régulières du pays.
    visit: >-
      Le meilleur point d'accès est le bureau d'information de Corofin, un village situé à 8 km du parc. Des
      guides vous orientent sur le choix des chemins, l'état des itinéraires et remettent des cartes. De mai à
      septembre, une navette gratuite relie Corofin aux points de départ de Kenny’s Cross/Gortlecka, situés
      dans un secteur rural paisible sans parking aménagé ni commodités.


      Sept sentiers balisés parcourent le parc et la réserve voisine de Slieve Carran, en plus d'un chemin
      vert. Ils s'échelonnent d'une promenade de 30 minutes à une marche de trois heures sur les collines
      calcaires. Pour débuter, la boucle du Knockaunroe Turlough (sentier orange) propose 1,3 km à travers
      bois de frênes et de noisetiers, pelouses sèches et fond de turlough, accessible à tous. Le Nature Trail
      (sentier blanc) parcourt 1,5 km au milieu d'une doline boisée, de prés de fauche et de lapiés, avec vue
      sur le Mullaghmore et le Lough Gealáin. Pour aller plus loin, le Mullaghmore Loop (sentier bleu) fait le
      tour du dôme sur 7,5 km le long du Lough Gealáin et de vastes dalles rocheuses.


      Sur l'autre versant, dans la réserve de Slieve Carran, le sentier marron de 2,5 km mène à un oratoire de
      pierre, une grotte et une source sacrée dédiée à saint Colman MacDuagh, qui y établit un ermitage au
      VIIe siècle selon la tradition.
    history: >-
      Au Néolithique, vers 4000 av. J.-C., les premiers agriculteurs modifièrent le paysage par défrichement
      et écobuage, édifiant des monuments mégalithiques comme le dolmen de Poulnabrone. Le parc a été fondé et
      ouvert au public en 1991, au sein d'un territoire élargi où le Burren et les falaises de Moher forment
      un géoparc mondial UNESCO.


      Aujourd'hui, la gestion est axée sur la biodiversité grâce à une coutume pastorale séculaire : le bétail
      paît sur les plateaux calcaires en hiver (« winterage »), maintenant l'herbe rase pour permettre aux
      graines de germer et de fleurir au soleil du printemps.
    before: >-
      Le relief calcaire est accidenté, fissuré et glissant par pluie ; suivez rigoureusement le balisage de
      couleur. Il est interdit de déplacer ou d'emporter pierres et fossiles, comme de cueillir des fleurs ou
      de perturber la faune. Les chiens sont admis exclusivement tenus en laisse. Par temps lourd et humide,
      les moucherons peuvent être gênants, et les tiques abondent dans les broussailles : inspectez-vous
      contre la maladie de Lyme. Vérifiez les horaires du bureau d'accueil et des navettes avant votre venue.
  de:
    intro: >-
      Auf den ersten Blick wirkt alles wie nackter Stein, und doch ist es eine der blütenreichsten
      Landschaften Irlands. Der Burren-Nationalpark erstreckt sich in der südöstlichen Ecke des Burren im
      County Clare; sein Name geht auf das irische Boíreann zurück, was „felsiger Ort“ bedeutet. Er ist der
      kleinste der acht irischen Nationalparks und der einzige, der als Kultur- und Weidelandschaft
      bewirtschaftet wird: Seine Flora und Fauna hängen von traditioneller Rinderbeweidung und stetiger Pflege
      ab.
    landscape: >-
      Der erste Eindruck gehört dem nackten Gestein. Der Kalkstein entstand vor rund 350 Millionen Jahren als
      Meeresbodensediment eines warmen tropischen Meeres und birgt versteinerte Korallen, Seelilien, Seeigel
      und Ammoniten. Später kamen die Gletscher, schliffen die Hügel in weite Terrassen und ließen gewaltige
      Granitfindlinge auf den Karrenfeldern von Rockforest östlich des Mullaghmór zurück. Der Burren ist eines
      der weltweit herausragenden Glaziokarstgebiete, und die heutige Oberflächenkarstifizierung begann erst
      nach dem Rückzug der letzten Eiszeit vor rund 10.000 Jahren: ein geologisch sehr junger Karst verglichen
      mit Osteuropa.


      Das Gestein birgt erstaunliche Vielfalt. Der Park vereint alle prägenden Lebensräume des Burren:
      Karrenfelder, Kalkmagerrasen, Haselgebüsche, Eschen-Hasel-Wälder, Turloughs, Quellaustritte, Kalkklippen
      und Niedermoore. Die Turloughs verdeutlichen die hydrologische Einzigartigkeit: Senken, die im nassen
      Winter über unterirdische Karstgänge vollaufen und im Sommer versickern – ihr irischer Name bedeutet
      „verschwindender See“. Während viele irische Feuchtgebiete entwässert wurden, bewahrt der Burren intakte
      Niedermoore.


      Weite Bereiche im Süden sind von Haselgebüsch bedeckt, das Dachsen, Baummardern, Rotfüchsen,
      Eichhörnchen, Waldmäusen und Spitzmäusen Schutz bietet.
    wildlife: >-
      Im Mittelpunkt steht die Flora. Rund 75 % aller in Irland vorkommenden Pflanzenarten sind hier
      vertreten, darunter 23 der 27 heimischen Orchideenarten. Wahrzeichen des Burren sind der
      Frühlings-Enzian, die Weiße Silberwurz, das Strauchige Fingerkraut und der Blutrote Storchschnabel, auf
      höheren Bändern ergänzt durch das Graue Sonnenröschen. Die Silberwurz als arkto-alpine Reliktart wächst
      unmittelbar neben dem wärmeliebenden Storchschnabel und der Dichtblütigen Orchidee mit mediterranem
      Ursprung.


      Die Blüte folgt einem festen Zeitplan. Der Frühlings-Enzian, der zierlichste aller Enziane, blüht von
      April bis Juni. Zu den ersten Orchideen des Jahres gehören das Stattliche Knabenkraut und die
      Dichtblütige Orchidee. Die Fliegen-Ragwurz blüht im Mai und Juni in Klüften und Trockenrasen; die
      Bienen-Ragwurz folgt im Juni und Juli; und die seltene Schwertblättrige Sumpfwurz öffnet ihre Blüten im
      Juni und Juli.


      Unter den Tieren wurden fünfundneunzig Vogelarten nachgewiesen, von denen mindestens 50 im Park brüten.
      Zu den Höhepunkten zählen Kolkrabe, [Wanderfalke](/especie/falco_peregrinus/), Turmfalke, Merlin und
      Kornweihe. Im Winter rasten an überfluteten Turloughs [Großer Brachvogel](/especie/numenius_arquata/),
      Kiebitz, Goldregenpfeifer und truppweise [Singschwäne](/especie/cygnus_cygnus/).


      Die meisten Säugetiere sind dämmerungsaktiv, doch Schneehasen, Füchse, verwilderte Ziegen und
      Zwergspitzmäuse lassen sich auch tagsüber blicken; Hermeline jagen entlang alter Steinmauern. Sieben
      Fledermausarten kommen vor, allen voran die international bedrohte Kleine Hufeisennase, die in
      Karsthöhlen überwintert. Im Burren leben auch die zwei heimischen Reptilienarten Irlands, und die Hänge
      um den Mullaghmore bilden das beste Tagfalterrevier der Insel: siebenundzwanzig der 33 residenten und
      regelmäßig wandernden Schmetterlingsarten Irlands kommen hier vor.
    visit: >-
      Als Ausgangspunkt empfiehlt sich das Informationszentrum in Corofin, einem Dorf 8 km vor dem Park.
      Guides helfen bei der Routenwahl, informieren über Wegzustände und halten Karten bereit. Von Mai bis
      September verkehrt ein kostenloser Shuttlebus zwischen Corofin und den Wanderstarts bei Kenny’s
      Cross/Gortlecka, die in ruhiger Landschaft ohne regulären Parkplatz liegen.


      Sieben markierte Wanderwege erschließen den Nationalpark und das angrenzende Schutzgebiet Slieve Carran,
      ergänzt durch alte Karrenwege. Die Spanne reicht vom 30-minütigen Spaziergang bis zur dreistündigen
      Bergtour über Kalkstufen. Der Knockaunroe Turlough Loop (orange Route) misst 1,3 km durch
      Eschen-Hasel-Gehölze und das Bett eines Turloughs und eignet sich für alle Altersstufen. Der Nature
      Trail (weiße Route) führt auf 1,5 km über Dolinenwälder, Magerwiesen und Karrenfelder mit Blick auf den
      Mullaghmore und den Lough Gealáin. Wer weiter will, wählt den Mullaghmore Loop (blaue Route) über 7,5 km
      rund um den Kalkberg.


      Drüben im Reservat Slieve Carran führt der 2,5 km lange braune Pfad zu einer steinernen Klause, einer
      Einsiedlerhöhle und der heiligen Quelle des heiligen Colman MacDuagh, der hier der Überlieferung nach im
      siebten Jahrhundert lebte.
    history: >-
      Bereits im Neolithikum, um 4000 v. Chr., veränderten frühe Ackerbauern die Landschaft durch Rodung und
      Brand und errichteten Megalithbauten wie den Portal Tomb von Poulnabrone. Der Nationalpark wurde 1991
      gegründet und eröffnet, eingebettet in den größeren UNESCO Global Geopark Burren and Cliffs of Moher.


      Heute beruht der Naturschutz auf einem uralten Beweidungssystem: Das Vieh weidet während der
      Wintermonate auf den Kalksteinterrassen („Winterage“), damit das Gras im Frühling kurz bleibt und
      konkurrenzschwache Blumen im Sonnenlicht aufkeimen können.
    before: >-
      Das Karstgelände ist zerklüftet, uneben und bei Nässe rutschig; folge stets den farbigen
      Pfadmarkierungen. Steine und Fossilien dürfen weder versetzt noch mitgenommen werden; Pflanzen und
      Wildtiere sind streng geschützt. Hunde sind ausnahmslos an der Leine zu führen. An warmen, feuchten
      Tagen können Gnitzen lästig werden, und im Gebüsch drohen Zeckenbisse (Borreliosegefahr). Prüfe vorab
      die Öffnungszeiten des Besucherzentrums und die Busfahrpläne.
  it:
    intro: >-
      A prima vista sembra soltanto roccia nuda, eppure è uno dei luoghi più floridi di tutta l'Irlanda. Il
      Parco Nazionale del Burren occupa l'angolo sud-orientale del Burren, nella contea di Clare, e deve il
      nome al gaelico Boíreann, «luogo pietroso». È il più raccolto degli otto parchi nazionali irlandesi e
      l'unico gestito come paesaggio rurale vivo: flora e fauna dipendono dal pascolo continuo e da una cura
      secolare.
    landscape: >-
      Si comincia da ciò che colpisce lo sguardo: la roccia grigia. Il calcare si depositò come sedimento sui
      fondali di un mare tropicale circa 350 milioni di anni fa e racchiude coralli, crinoidi, ricci e
      ammoniti fossili. Successivamente giunsero i ghiacci quaternari, che modellarono i rilievi a gradinate e
      depositarono massi erratici di granito sui campi carreggiati di Rockforest, a est di Mullaghmór. Il
      Burren rappresenta uno dei massimi esempi mondiali di paesaggio glaciocarsico, e la dissoluzione
      superficiale che si osserva oggi risale soltanto al ritiro dell'ultima glaciazione, circa 10.000 anni
      fa: un carsismo giovane rispetto a quello dell'Europa orientale.


      Quella roccia è tutt'altro che uniforme. Il parco accoglie tutti gli habitat maggiori del Burren:
      lastronate a fessure, praterie calcaree, boscaglie di nocciolo, boschi misti di frassino, turlough,
      sorgenti pietrificanti, pareti rocciose e torbiere basse alcaline. I turlough incarnano la singolarità
      idrologica della regione: depressioni che si allagano durante l'inverno alimentate da falde sotterranee,
      il cui nome gaelico significa «lago che scompare». E mentre molte zone umide irlandesi sono andate
      distrutte dalle bonifiche, il Burren serba torbiere perfettamente integre.


      Vasti settori meridionali sono ammantati da un fitto intrico di noccioli che dà rifugio a tassi,
      martore, volpi, scoiattoli rossi, topi selvatici e toporagni.
    wildlife: >-
      La regina del paesaggio è la flora. Circa il 75 % delle specie vegetali d'Irlanda è presente qui,
      comprese 23 delle 27 orchidee spontanee dell'isola. I simboli botanici del Burren sono la genziana
      primaverile, il camedrio alpino, la potentilla arbustiva e il geranio sanguigno, affiancati sui terrazzi
      alti dall'eliantemo bianco. Il camedrio alpino, pianta subartica e di alta quota, fiorisce a contatto
      col geranio sanguigno e l'orchidea a fiori densi, tipiche dell'areale mediterraneo.


      La fioritura scandisce un calendario esatto. La genziana primaverile, la più minuta tra le genziane,
      sboccia tra aprile e giugno. Le prime orchidee dell'anno sono l'orchidea maschia e l'orchidea a fiori
      densi. L'orchidea moscaria fiorisce in maggio e giugno nelle fessure calcaree; l'orchidea ape compare in
      giugno e luglio; e la rara elleborina a foglie di spada apre i petali in giugno e luglio.


      Tra gli uccelli si contano novantacinque specie censite, di cui almeno 50 nidificanti nel parco.
      Spiccano il corvo imperiale, il [falco pellegrino](/especie/falco_peregrinus/), il gheppio, lo smeriglio
      e l'albanella reale. D'inverno, con laghi e turlough colmi d'acqua, compaiono uccelli acquatici
      svernanti come il [chiurlo maggiore](/especie/numenius_arquata/), la pavoncella, il piviere dorato e
      stormi di [cigni selvatici](/especie/cygnus_cygnus/).


      I mammiferi sono perlopiù elusivi, ma di giorno non è raro scorgere lepri irlandesi, volpi, capre
      rinselvatichite e toporagni; l'ermellino caccia lungo i muretti a secco. Si contano sette specie di
      pipistrelli, tra cui il ferro di cavallo minore, rigorosamente protetto, che sverna nei meati carsici.
      Nei dintorni di Mullaghmore vive il miglior nucleo di farfalle d'Irlanda: ventisette delle 33 specie
      stanziali e migratrici abituali dell'isola.
    visit: >-
      L'accesso privilegiato è il centro visite di Corofin, villaggio situato a 8 km dal parco. Le guide
      forniscono indicazioni sui percorsi, sulla percorribilità e distribuiscono mappe. Da maggio a settembre,
      una navetta gratuita collega Corofin con i punti di partenza di Kenny’s Cross/Gortlecka, posti in aperta
      campagna privi di parcheggi dedicati o servizi.


      Sette sentieri segnalati attraversano il parco e la riserva di Slieve Carran, oltre a una pista
      sterrata. Spaziano da passeggiate di 30 minuti a escursioni di tre ore sui gradoni calcarei. Per
      cominciare, l'anello di Knockaunroe Turlough (sentiero arancione) copre 1,3 km tra frassini, noccioli e
      il letto asciutto del turlough, adatto a tutti. Il Nature Trail (sentiero bianco) misura 1,5 km tra
      boschi di dolina, prati falciabili e lastronate, con visuale su Mullaghmore e Lough Gealáin. Per chi
      cerca itinerari più ampi, il Mullaghmore Loop (sentiero blu) compie il periplo del rilievo per 7,5 km
      lungo il lago e vaste superfici fessurate.


      Sul versante opposto, a Slieve Carran, il sentiero marrone di 2,5 km conduce a un oratorio medievale, a
      una grotta e alla fonte sacra di san Colman MacDuagh, che vi fondò un eremo nel VII secolo.
    history: >-
      Nel Neolitico, verso il 4000 a.C., i primi coloni agricoltori dissodarono il territorio col fuoco e vi
      eressero sepolture megalitiche come il dolmen di Poulnabrone. Il parco è stato istituito e aperto al
      pubblico nel 1991, integrato nel più vasto Geoparco Mondiale UNESCO Burren and Cliffs of Moher.


      Oggi la gestione preserva la natura attraverso una pratica pastorale arcaica: il bestiame pascola sulle
      alture calcaree durante i mesi invernali («winterage»), mantenendo l'erba corta in primavera affinché i
      fiori rari possano ricevere luce e prosperare.
    before: >-
      Il calcare carsico presenta fessure profonde e può risultare scivoloso; segui scrupolosamente i segnavia
      colorati. È severamente proibito asportare o spostare rocce e fossili, così come raccogliere fiori o
      molestare la fauna. I cani sono ammessi esclusivamente al guinzaglio. Nelle giornate calde e umide i
      moscerini possono rivelarsi fastidiosi, e tra la vegetazione sussiste il rischio zecche (trasmissione
      della malattia di Lyme). Verifica gli orari del centro informazioni e delle navette prima di partire.
  pt:
    intro: >-
      À primeira vista parece apenas pedra desolada, e contudo é um dos locais mais opulentos em botânica de
      toda a Irlanda. O Parque Nacional do Burren ocupa o extremo sudeste da região do Burren, no condado de
      Clare; o seu nome provém do irlandês Boíreann, «lugar pedregoso». É o mais reduzido dos oito parques
      nacionais da Irlanda e o único gerido como uma paisagem agrária viva: a sua flora e fauna dependem de
      pastoreio contínuo e de uma conservação atenta.
    landscape: >-
      Tudo começa no que tens diante dos olhos: rocha cinzenta. O calcário depositou-se no fundo de um oceano
      tropical quente há cerca de 350 milhões de anos, fossilizando corais, ouriços-do-mar, crinoides e
      amonites. Depois avançaram os glaciares, afeiçoando as colinas em socalcos e abandonando blocos
      erráticos de granito sobre o campo de lapiás de Rockforest, a leste de Mullaghmór. O Burren constitui um
      dos mais notáveis exemplos de relevo glaciocársico do mundo, e a carstificação superficial que hoje se
      vislumbra remonta apenas ao recuo da última glaciação, há cerca de 10.000 anos: um carste recente em
      comparação com o da Europa Oriental.


      Essa lajeada está longe de ser monótona. O parque congrega todos os principais biótopos do Burren:
      lajedos com fendas profundas, pastagens calcárias, matos de aveleira, bosques de freixo, turloughs,
      nascentes petrificantes, escarpas e turfeiras baixas alcalinas. Os turloughs traduzem a peculiaridade
      hidrológica local: depressões inundadas no inverno por águas subterrâneas cujo nome em irlandês
      significa «lago que desaparece». Ao passo que inúmeras zonas húmidas irlandesas sucumbiram à drenagem
      artificial, o Burren preserva turfeiras intactas.


      Amplos setores do sul acham-se cobertos por denso mato de aveleiras que serve de abrigo a texugos,
      martas, raposas, esquilos-vermelhos, ratos-do-campo e musaranhos.
    wildlife: >-
      O maior encanto reside na flora. Cerca de 75 % de todas as plantas nativas da Irlanda ocorrem aqui,
      incluindo 23 das 27 orquídeas autóctones da ilha. As flores emblemáticas do Burren são a
      genciana-da-primavera, a faia-ártica, o trevo-arbustivo e o gerânio-sanguíneo, acompanhadas nos
      patamares cimeiros pela heliantemo-cinzento. A faia-ártica, espécie relíquia das tundras montanhosas,
      floresce em contacto direto com o gerânio-sanguíneo e a orquídea-de-flores-densas, de matriz
      mediterrânica.


      As florações obedecem a uma cadência rigorosa. A genciana-da-primavera, a mais diminuta das gencianas,
      abre entre abril e junho. As primeiras orquídeas a despontar são a orquídea-macho e a
      orquídea-de-flores-densas. A orquídea-mosca floresce em maio e junho nas fendas rochosas e matos secos;
      a orquídea-abelha destaca-se em junho e julho; e a rara heléborine-de-folhas-estreitas abre em junho e
      julho.


      Na avifauna, noventa e cinco espécies de aves foram identificadas, das quais pelo menos 50 nidificam no
      parque. Sobressaem o corvo-comum, o [falcão-peregrino](/especie/falco_peregrinus/), o peneireiro-vulgar,
      o esmerilhão e o tartaranhão-azulado. No inverno, com os turloughs inundados, chegam aves aquáticas
      invernantes como o [maçarico-real](/especie/numenius_arquata/), o abibe-comum, a tarambola-dourada e
      bandos de [cisnes-bravos](/especie/cygnus_cygnus/).


      A maioria dos mamíferos tem hábitos noturnos, mas de dia avistam-se com frequência lebres-irlandesas,
      raposas, cabras assilvestradas e musaranhos-anões; a doninha-anã patrulha os muros de pedra solta.
      Registam-se sete espécies de morcegos, incluindo o morcego-de-ferradura-pequeno, ameaçado a nível
      global, que hiberna nas fendas cársicas. O relevo de Mullaghmore acolhe o mais rico núcleo de
      lepidópteros do país: vinte e sete das 33 espécies de borboletas residentes e migradoras regulares da
      Irlanda.
    visit: >-
      O ponto de acolhimento primordial situa-se em Corofin, uma aldeia a 8 km do parque. Guias especializados
      ajudam a selecionar trajetos, informam sobre o piso e fornecem mapas. De maio a setembro, um serviço de
      autocarro gratuito liga Corofin aos pontos de partida de Kenny’s Cross/Gortlecka, localizados em plena
      paisagem rural sem parque automóvel delimitado nem instalações sanitárias.


      Existem sete percursos assinalados no parque e na reserva de Slieve Carran, além de uma antiga estrada
      rural. Variam entre um passeio de 30 minutos e uma caminhada de três horas pelas cristas calcárias. Para
      começar, o trilho de Knockaunroe Turlough (rota cor-de-laranja) percorre 1,3 km por bosque de freixos,
      prado seco e leito de turlough, apto para todas as idades. O Nature Trail (rota branca) tem 1,5 km por
      bosques em dolinas, prados de feno e lapiás, avistando-se o Mullaghmore e o lago Gealáin. Para uma
      experiência completa, o Mullaghmore Loop (rota azul) contorna o monte ao longo de 7,5 km por lajes
      calcárias e pela margem do lago.


      Na reserva de Slieve Carran, o percurso castanho de 2,5 km dá acesso a um oratório de pedra, a uma gruta
      eremítica e à nascente sagrada de São Colman MacDuagh, que fundou ali uma ermida no século VII segundo a
      tradição.
    history: >-
      No Neolítico, por volta de 4000 a.C., os primeiros colonos agrícolas alteraram o meio através de corte e
      queimadas, erigindo monumentos megalíticos como a anta de Poulnabrone. O parque nacional foi instituído
      e aberto ao público em 1991, integrado no Geoparque Mundial da UNESCO Burren and Cliffs of Moher.


      Atualmente a gestão visa a conservação dos habitats através de um uso pastoril imemorial: o gado pasta
      nas colinas calcárias durante o inverno («winterage»), garantindo que as gramíneas permanecem curtas na
      primavera para permitir que as orquídeas e flores raras recebam luz solar.
    before: >-
      O pavimento calcário apresenta fendas traiçoeiras e torna-se escorregadio com a chuva; segue sempre a
      sinalização colorida dos trilhos. É expressamente proibido mexer ou retirar rochas e fósseis, bem como
      colher plantas ou incomodar os animais. Os cães são permitidos unicamente presos pela trela. Em dias
      abafados e húmidos podem surgir nuvens de mosquitos, e na vegetação rasteira existe risco de carraças
      (transmissoras da doença de Lyme). Consulta previamente os horários do centro de informação e dos
      autocarros.
