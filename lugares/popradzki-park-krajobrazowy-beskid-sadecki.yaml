texto:
  es:
    intro: >-
      Cuatro de cada cinco metros cuadrados de este parque son bosque. El Parque Paisajístico del Poprad cubre
      la mayor parte del Beskid Sądecki, desde Krynica y Tylicz hasta Krościenko y Łącko, y se llama así por
      el río Poprad, que atraviesa la cordillera por un valle estrecho entre las dos grandes cumbres,
      Radziejowa y Jaworzyna Krynicka. Es el mayor de su tipo en la región de Małopolska y uno de los mayores
      de Polonia. En esos bosques de abeto y haya viven el oso pardo, el lobo y el lince.
    landscape: >-
      Las cumbres de Radziejowa y Jaworzyna Krynicka están hechas de arenisca de Magura, una roca dura que
      resiste la erosión, y por eso mandan sobre el paisaje. La más alta, Radziejowa, mide 1262 metros. Desde
      allí el parque baja en pisos, como una escalera de vegetación.


      Abajo, hasta el piso montano bajo, que llega a 1100 metros, dominan los campos y los prados, y a orillas
      del Poprad y del Dunajec crecen alisedas y carrizales. Después viene el reino del abeto y el haya, que
      forman el hayedo carpático. Por encima de 1100 metros aparece una pícea poco variada con arándanos, y
      hasta en esa altura asoman rarezas: el parque tiene los únicos lugares de Polonia donde florece en otoño
      un espino de fruto grande.
    wildlife: >-
      El gran protagonista es el bosque, con sus compactos complejos que dan cobijo a corzos, ciervos y
      jabalíes, y también a lobos, zorros, martas y turones. El [lince](/especie/lynx_lynx/) y el [gato
      montés](/especie/felis_silvestris/) representan a los felinos y el [oso pardo](/especie/ursus_arctos/)
      es el mayor depredador. Con algo de suerte se ven el tejón, el armiño o la comadreja. En los torrentes
      que bajan al Dunajec y al Poprad viven el [castor](/especie/castor_fiber/) y la
      [nutria](/especie/lutra_lutra/).


      Las aves superan las 160 especies. Entre ellas hay gallináceas forestales raras en Polonia, como el
      [urogallo](/especie/tetrao_urogallus/), y otras de valor: el [búho real](/especie/bubo_bubo/), el
      [cárabo uralense](/especie/strix_uralensis/), el [águila real](/especie/aquila_chrysaetos/), la [cigüeña
      negra](/especie/ciconia_nigra/), que anida en el parque, y el [pito negro](/especie/dryocopus_martius/).
      El parque tiene además unas 65 especies de mariposas de colores en los prados del bosque.


      Cuando la primavera llega al piso montano bajo, el sotobosque se llena de campanillas de invierno,
      Corydalis y ajo de oso. Más tarde, en los prados del bosque, florecen la carlina protegida y numerosas
      orquídeas. Entre los reptiles y los anfibios, los senderos del bosque dejan ver la culebra de collar y
      la rara culebra de Esculapio, y en los arroyos de montaña vive la [salamandra
      común](/especie/salamandra_salamandra/).
    visit: >-
      Un buen primer paseo es el sendero Rogasiowy, que sigue los arroyos Roztoka Wielka y Mała por el valle
      de Roztoka, al oeste de Rytro, y pasa cerca de la reserva de Baniska. A lo largo del camino hay paneles
      didácticos con información sobre la naturaleza de la zona.


      Si prefieres un día entero, la ruta de Hala Łabowska sale de Piwniczna-Zdrój: son 20,8 km de dificultad
      media, lejos del turismo masivo. En el camino hay un refugio turístico en la Hala Łabowska, la formación
      de Diabelskie Ściany, de arenisca de Magura, y la reserva de Barnowiec.


      Para observar fauna sin molestarla, la reserva Bobrowisko, en las antiguas graveras de Stary Sącz, tiene
      pasarelas de madera y dos puntos de observación con dos catalejos: allí se ven cisne vulgar, garza real,
      pito negro, ánade real y madrigueras de castor, y con suerte el propio castor. En Las Lipowy Obrożyska
      hay un sendero natural con siete paradas con paneles y unas dos horas y media de recorrido. Y en
      bicicleta de montaña, la subida a Radziejowa desde Rytro mide 30,5 km y salva 900 metros de desnivel.
    history: >-
      Varios pueblos del parque conservan iglesias ortodoxas de madera: la de Powroźnik, por ejemplo, se
      construyó a comienzos del siglo XVII. En Jarmuta, cerca de Szczawnica, quedan dos galerías de una mina
      de plata del siglo XVIII; una no se puede visitar para proteger a los murciélagos.


      El parque se creó en 1987 y su protección se completa con 13 reservas naturales, casi 130 monumentos
      naturales y cuatro espacios ecológicos. Natura 2000 Ostoja Popradzka coincide en gran parte con el
      parque. Natura 2000 Krynica protege una de las colonias más importantes de [murciélago ratonero
      grande](/especie/myotis_myotis/) de los Cárpatos. La reserva Uhryń guarda un viejo bosque de haya y
      abeto, resto de la antigua selva de los Cárpatos.
    before: >-
      En las reservas naturales del parque solo se permite circular por los senderos turísticos o didácticos
      señalizados.
    around: >-
      El [Parque Nacional Pieniny - Garganta del Río Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/)
      queda a tres kilómetros, y a veinticinco los [Tatras de Eslovaquia](/lugar/tatransky-narodny-park/). Más
      lejos, el [Bosque Primario de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) y el [Bosque Primario
      de Krokar](/lugar/pragozd-krokar/) comparten con él el cárabo uralense y el gato montés.
  en:
    intro: >-
      Four out of every five square meters in this park are forest. Poprad Landscape Park covers most of the
      Beskid Sądecki, from Krynica and Tylicz to Krościenko and Łącko. It takes its name from the river
      Poprad, which slices through the range along a narrow gorge between two imposing summits, Radziejowa and
      Jaworzyna Krynicka. It is the largest park of its type in Małopolska and one of the largest in Poland.
      In these fir and beech woodlands live brown bears, wolves, and lynx.
    landscape: >-
      The summits of Radziejowa and Jaworzyna Krynicka are forged of Magura sandstone—a tough rock that
      resists erosion—which is why they dominate the landscape. The highest, Radziejowa, stands at 1,262
      meters. From there, the park descends in tiers, like a staircase of vegetation.


      Down below, up to the lower montane belt reaching 1,100 meters, fields and pastures prevail, while alder
      groves and reedbeds thrive along the banks of the Poprad and Dunajec rivers. Higher up begins the domain
      of fir and beech, together forming the Carpathian beech forest. Above 1,100 meters, a uniform spruce
      woodland appears alongside bilberry shrubs, and even at that elevation rarities emerge: the park harbors
      Poland's only spots where a large-fruited hawthorn blossoms in autumn.
    wildlife: >-
      The towering forest is the true protagonist, its dense tracts providing cover for roe deer, red deer,
      and wild boar, as well as wolves, red foxes, martens, and European polecats. The [Eurasian
      lynx](/especie/lynx_lynx/) and the [wildcat](/especie/felis_silvestris/) represent the felines, while
      the [brown bear](/especie/ursus_arctos/) is the top predator. With some luck you may spot European
      badgers, stoats, or least weasels. The fast mountain streams rushing down to the Dunajec and Poprad
      shelter the [Eurasian beaver](/especie/castor_fiber/) and the [Eurasian otter](/especie/lutra_lutra/).


      Birdlife exceeds 160 species. Among them are forest gamebirds rare in Poland, such as the [western
      capercaillie](/especie/tetrao_urogallus/), along with notable birds of prey: the [Eurasian
      eagle-owl](/especie/bubo_bubo/), the [Ural owl](/especie/strix_uralensis/), the [golden
      eagle](/especie/aquila_chrysaetos/), the [black stork](/especie/ciconia_nigra/) (which breeds in the
      park), and the [black woodpecker](/especie/dryocopus_martius/). The park also hosts about 65 butterfly
      species fluttering across woodland clearings.


      When spring reaches the lower montane slopes, snowdrops, Corydalis, and wild garlic blanket the forest
      floor. Later in the season, protected carline thistles and abundant orchids bloom in forest meadows.
      Reptiles and amphibians seen along woodland tracks include grass snakes and the rare Aesculapian snake,
      while mountain burns run with the [fire salamander](/especie/salamandra_salamandra/).
    visit: >-
      An excellent introductory walk is the Rogasiowy trail, which traces the Roztoka Wielka and Mała streams
      through the Roztoka Valley west of Rytro, brushing past the Baniska reserve. Educational boards with
      information on local nature line the way.


      If you prefer a full day out, the Hala Łabowska route starts in Piwniczna-Zdrój: 20.8 km of moderate
      hiking far from mass tourism. Along the way you will find a mountain refuge at Hala Łabowska, the
      striking Diabelskie Ściany rock outcrops sculpted from Magura sandstone, and the Barnowiec reserve.


      To observe wildlife without disturbance, the Bobrowisko reserve, established in former gravel pits at
      Stary Sącz, features wooden boardwalks and two observation hides equipped with two spotting scopes: mute
      swans, grey herons, black woodpeckers, mallards, and beaver lodges are regularly observed, and with a
      bit of luck, the beavers themselves. In Las Lipowy Obrożyska, an interpretive nature trail with seven
      stops takes about two and a half hours. For mountain bikers, the ascent to Radziejowa from Rytro covers
      30.5 km with 900 meters of elevation gain.
    history: >-
      Several villages in the park preserve traditional wooden Orthodox churches; the church in Powroźnik, for
      instance, dates back to the early seventeenth century. At Jarmuta near Szczawnica, two adits of an
      eighteenth-century silver mine remain; one is kept closed to visitors to protect wintering bat colonies.


      The park was established in 1987, and its protection is bolstered by 13 nature reserves, nearly 130
      natural monuments, and four ecological areas. Natura 2000 Ostoja Popradzka largely overlaps with the
      park territory. Natura 2000 Krynica protects one of the most critical Carpathian roosts of the [greater
      mouse-eared bat](/especie/myotis_myotis/). The Uhryń reserve protects an ancient beech-fir stand, a
      living fragment of the primeval Carpathian forest.
    before: Inside the park's nature reserves, visitors may only walk on marked tourist or educational trails.
    around: >-
      The [Pieniny National Park - Dunajec River Gorge](/lugar/pieninski-park-narodowy---dunajec-gorge/) lies
      three kilometers away, while the [Tatra National Park](/lugar/tatransky-narodny-park/) across the Slovak
      border is twenty-five kilometers distant. Farther afield, the [Strâmbu-Băiuț Primeval Beech
      Forest](/lugar/codrul-secular-strambu-baiut/) and the [Krokar Virgin Forest](/lugar/pragozd-krokar/)
      also share its Ural owls and wildcats.
  fr:
    intro: >-
      Quatre mètres carrés sur cinq de ce parc sont occupés par la forêt. Le parc paysager de Poprad couvre la
      plus grande partie du Beskid Sądecki, de Krynica et Tylicz jusqu'à Krościenko et Łącko. Il tire son nom
      de la rivière Poprad, qui franchit le massif par une gorge étroite entre deux grands sommets, Radziejowa
      et Jaworzyna Krynicka. C'est le plus grand parc de ce type en Petite-Pologne et l'un des plus vastes de
      Pologne. Dans ces forêts de sapins et de hêtres vivent l'ours brun, le loup et le lynx.
    landscape: >-
      Les sommets de Radziejowa et de Jaworzyna Krynicka sont formés de grès de Magura, une roche dure qui
      résiste à l'érosion et structure le relief. Le point culminant, Radziejowa, atteint 1 262 mètres. De là,
      le parc s'étage en niveaux de végétation successifs.


      En bas, jusqu'à l'étage montagnard inférieur qui monte à 1 100 mètres, dominent les prairies et les
      cultures, tandis que le long du Poprad et du Dunajec s'épanouissent aulnaies et roselières. Vient
      ensuite le domaine du sapin et du hêtre, formant la hêtraie carpatique. Au-dessus de 1 100 mètres
      apparaît une pessière clairsemée accompagnée de myrtilliers, et même à cette altitude percent des
      raretés : le parc abrite les seules stations de Pologne où fleurit en automne une aubépine à gros
      fruits.
    wildlife: >-
      La forêt majestueuse est l'élément central, offrant son couvert serré aux chevreuils, cerfs élaphes et
      sangliers, ainsi qu'aux loups, renards, martres et putois. Le [lynx boréal](/especie/lynx_lynx/) et le
      [chat forestier](/especie/felis_silvestris/) incarnent les félins, tandis que [l'ours
      brun](/especie/ursus_arctos/) est le plus grand prédateur. Avec de la chance, vous observerez blaireaux,
      hermines ou belettes. Dans les torrents qui rejoignent le Dunajec et le Poprad vivent le [castor
      d'Europe](/especie/castor_fiber/) et la [loutre d'Europe](/especie/lutra_lutra/).


      L'avifaune dépasse 160 espèces. Parmi elles se trouvent des galliformes forestiers rares en Pologne
      comme le [grand tétras](/especie/tetrao_urogallus/), ainsi que des rapaces remarquables : le [grand-duc
      d'Europe](/especie/bubo_bubo/), la [chouette de l'Oural](/especie/strix_uralensis/), [l'aigle
      royal](/especie/aquila_chrysaetos/), la [cigogne noire](/especie/ciconia_nigra/), qui niche dans le
      parc, et le [pic noir](/especie/dryocopus_martius/). Le parc accueille en outre environ 65 espèces de
      papillons diurnes dans ses clairières.


      Au printemps, le sous-bois montagnard inférieur se tapisse de perce-neige, de corydales et d'ail des
      ours. Plus tard, les prés forestiers voient s'épanouir la carline protégée et diverses orchidées. Les
      sentiers forestiers permettent d'apercevoir la couleuvre à collier et la rare couleuvre d'Esculape,
      tandis que les ruisseaux d'altitude abritent la [salamandre tachetée](/especie/salamandra_salamandra/).
    visit: >-
      Pour une première promenade agréable, empruntez le sentier Rogasiowy, qui suit les ruisseaux Roztoka
      Wielka et Mała à travers la vallée de Roztoka, à l'ouest de Rytro, à proximité de la réserve de Baniska.
      Des panneaux thématiques jalonnent le parcours.


      Si vous souhaitez marcher toute la journée, l'itinéraire de Hala Łabowska part de Piwniczna-Zdrój : 20,8
      km de difficulté moyenne, à l'écart de l'affluence touristique. Vous y trouverez un refuge montagnard à
      Hala Łabowska, les escarpements de Diabelskie Ściany en grès de Magura et la réserve de Barnowiec.


      Pour observer les oiseaux en toute discrétion, la réserve Bobrowisko, aménagée dans d'anciennes
      gravières à Stary Sącz, dispose de passerelles de bois et de deux observatoires munis de deux
      longues-vues : on y observe cygnes tuberculés, hérons cendrés, pics noirs, canards colverts et huttes de
      castors, voire le castor lui-même. Dans le Las Lipowy Obrożyska, un sentier de découverte à sept
      stations demande environ deux heures et demie de marche. En VTT, l'ascension de Radziejowa au départ de
      Rytro fait 30,5 km pour 900 mètres de dénivelé.
    history: >-
      Plusieurs villages du parc conservent des églises orthodoxes en bois : celle de Powroźnik a été bâtie au
      début du XVIIe siècle. À Jarmuta, près de Szczawnica, subsistent deux galeries d'une mine d'argent du
      XVIIIe siècle ; l'une d'elles reste inaccessible au public afin de protéger les chauves-souris.


      Le parc a été créé en 1987 et sa protection s'appuie sur 13 réserves naturelles, près de 130 monuments
      naturels et quatre zones d'intérêt écologique. Le site Natura 2000 Ostoja Popradzka coïncide en grande
      partie avec le parc. Le site Natura 2000 Krynica protège l'une des plus importantes colonies de [grand
      murin](/especie/myotis_myotis/) des Carpates. La réserve d'Uhryń préserve une vieille forêt de sapins et
      de hêtres, témoin de la forêt primaire carpatique.
    before: >-
      Dans les réserves naturelles du parc, la circulation n'est autorisée que sur les sentiers touristiques
      ou didactiques balisés.
    around: >-
      Le [parc national des Piénines - gorges de la rivière
      Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) est à trois kilomètres, et le [parc national
      des Tatras](/lugar/tatransky-narodny-park/) en Slovaquie à vingt-cinq kilomètres. Plus loin, la [forêt
      primaire de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) et la [forêt vierge de
      Krokar](/lugar/pragozd-krokar/) partagent avec lui la chouette de l'Oural et le chat forestier.
  de:
    intro: >-
      Vier von fünf Quadratmetern dieses Parks sind Wald. Der Landschaftspark Poprad bedeckt den Großteil der
      Sandezer Beskiden (Beskid Sądecki), von Krynica und Tylicz bis Krościenko und Łącko. Er verdankt seinen
      Namen dem Fluss Poprad, der das Gebirge durch ein enges Tal zwischen den beiden markanten Gipfeln
      Radziejowa und Jaworzyna Krynicka durchbricht. Er ist der größte seiner Art in Kleinpolen und einer der
      weitläufigsten Polens. In diesen Tannen- und Buchenwäldern streifen Braunbären, Wölfe und Luchse umher.
    landscape: >-
      Die Kämme von Radziejowa und Jaworzyna Krynicka bestehen aus Magura-Sandstein, einem harten Gestein, das
      der Erosion trotzt und das Relief bestimmt. Der höchste Punkt, die Radziejowa, misst 1.262 Meter. Von
      dort fällt der Park in Höhenstufen wie über eine Pflanzentreppe ab.


      Unten, bis zur unteren Montanstufe auf 1.100 Metern, herrschen Wiesen und Felder vor, während an den
      Ufern von Poprad und Dunajec Erlenwälder und Röhrichte wachsen. Darüber schließt sich das Reich der
      Tannen und Buchen an, die den Karpaten-Buchenwald bilden. Oberhalb von 1.100 Metern lichtet sich der
      Wald zu Fichtenbeständen mit Heidelbeeren, und selbst in dieser Höhe treten Seltenheiten auf: Der Park
      birgt die einzigen Standorte Polens, an denen im Herbst ein großfrüchtiger Weißdorn blüht.
    wildlife: >-
      Der dichte Wald ist der eigentliche Herrscher; seine geschlossenen Bestände bieten Rehwild, Rothirschen
      und Wildschweinen Schutz, aber auch Wölfen, Füchsen, Mardern und Iltissen. Der [Eurasische
      Luchs](/especie/lynx_lynx/) und die [Wildkatze](/especie/felis_silvestris/) vertreten die Katzen,
      während der [Braunbär](/especie/ursus_arctos/) das größte Raubtier ist. Mit etwas Geduld lassen sich
      Dachs, Hermelin oder Mauswiesel entdecken. In den Wildbächen zum Dunajec und Poprad leben der
      [Europäische Biber](/especie/castor_fiber/) und der [Fischotter](/especie/lutra_lutra/).


      Die Vogelwelt umfasst mehr als 160 Arten. Darunter befinden sich seltene Waldhühner wie das
      [Auerhuhn](/especie/tetrao_urogallus/) sowie eindrucksvolle Greifvögel: [Uhu](/especie/bubo_bubo/),
      [Habichtskauz](/especie/strix_uralensis/), [Steinadler](/especie/aquila_chrysaetos/), der im Park
      brütende [Schwarzstorch](/especie/ciconia_nigra/) und der [Schwarzspecht](/especie/dryocopus_martius/).
      Auf den Waldwiesen flattern zudem rund 65 Tagfalterarten.


      Im Frühling überzieht die untere Montanstufe ein Teppich aus Schneeglöckchen, Lerchensporn und Bärlauch.
      Später blühen geschützte Eberwurzen und zahlreiche Orchideen. An den Waldwegen lassen sich Ringelnatter
      und die seltene Äskulapnatter blicken, während in den klaren Bergbächen der
      [Feuersalamander](/especie/salamandra_salamandra/) heimisch ist.
    visit: >-
      Ein schöner erster Spaziergang ist der Rogasiowy-Pfad, der den Bächen Roztoka Wielka und Mała durch das
      Roztoka-Tal westlich von Rytro folgt und nahe am Schutzgebiet Baniska vorbeiführt. Informationstafeln
      säumen den Weg.


      Suchst du eine Tagestour, startet die Route zur Hala Łabowska in Piwniczna-Zdrój: 20,8 km von mittlerem
      Anspruch, abseits des Massentourismus. Unterwegs passierst du die Berghütte auf der Hala Łabowska, die
      Sandsteinformation Diabelskie Ściany und das Schutzgebiet Barnowiec.


      Zur Vogelbeobachtung eignet sich das Reservat Bobrowisko in ehemaligen Kiesgruben bei Stary Sącz:
      Holzstege und zwei Beobachtungshütten mit zwei Spektiven gestatten Blicke auf Höckerschwan, Graureiher,
      Schwarzspecht, Stockente und Biberburgen. Im Las Lipowy Obrożyska informiert ein Naturlehrpfad mit
      sieben Stationen auf zweieinhalb Stunden Gehzeit. Mit dem Mountainbike überwindet der Anstieg auf die
      Radziejowa ab Rytro 30,5 km und 900 Höhenmeter.
    history: >-
      Mehrere Dörfer des Parks bewahren hölzerne orthodoxe Kirchen; diejenige von Powroźnik stammt aus dem
      frühen siebzehnten Jahrhundert. In Jarmuta bei Szczawnica blieben zwei Stollen eines Silberbergwerks aus
      dem achtzehnten Jahrhundert erhalten; einer davon ist zum Schutz der Fledermäuse verschlossen.


      Der Landschaftspark wurde 1987 eingerichtet. Sein Schutznetz umfasst 13 Naturschutzgebiete, fast 130
      Naturdenkmale und vier ökologische Flächen. Das Gebiet Natura 2000 Ostoja Popradzka deckt sich
      weitgehend mit dem Park. Natura 2000 Krynica schützt eine der wichtigsten Karpatenkolonien des [Großen
      Mausohrs](/especie/myotis_myotis/). Das Reservat Uhryń bewahrt einen alten Tannen-Buchen-Wald als Relikt
      des ursprünglichen Karpaten-Urwalds.
    before: >-
      In den Naturschutzgebieten des Parks darf man sich ausschließlich auf den markierten Wander- oder
      Lehrpfaden bewegen.
    around: >-
      Der [Pieninen-Nationalpark - Dunajec-Durchbruch](/lugar/pieninski-park-narodowy---dunajec-gorge/) liegt
      drei Kilometer entfernt, und fünfundzwanzig Kilometer trennen dich vom slowakischen
      [Tatra-Nationalpark](/lugar/tatransky-narodny-park/). Weiter entfernt teilen der [Urwald
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) und der [Urwald Krokar](/lugar/pragozd-krokar/)
      Habichtskauz und Wildkatze.
  it:
    intro: >-
      Quattro metri quadrati su cinque di questo parco sono foresta. Il Parco paesaggistico di Poprad copre la
      maggior parte del Beskid Sądecki, da Krynica e Tylicz fino a Krościenko e Łącko, prendendo il nome dal
      fiume Poprad, che attraversa la dorsale lungo una stretta gola tra due rilievi principali, Radziejowa e
      Jaworzyna Krynicka. È la riserva più estesa del suo genere nella Piccola Polonia e una delle maggiori
      dell'intero Paese. In questi boschi di abeti e faggi vivono l'orso bruno, il lupo e la lince.
    landscape: >-
      Le cime di Radziejowa e Jaworzyna Krynicka sono formate da arenaria di Magura, una roccia compatta che
      resiste all'erosione e modella il paesaggio. La vetta più elevata, Radziejowa, tocca i 1.262 metri. Da
      qui il parco digrada a gradoni, come una scala di piani vegetazionali.


      In basso, fino alla fascia montana inferiore che raggiunge i 1.100 metri, prevalgono pascoli e coltivi,
      mentre lungo le sponde del Poprad e del Dunajec crescono ontanete e canneti. Più in quota si estende il
      regno dell'abete bianco e del faggio, che compongono la faggeta carpatica. Oltre i 1.100 metri compare
      una pecceta aperta arricchita da mirtilli, e persino a quell'altitudine si scorgono rarità: il parco
      custodisce gli unici siti della Polonia in cui fiorisce in autunno un biancospino a frutti grossi.
    wildlife: >-
      Il vero protagonista è il bosco fitto, i cui complessi indisturbati danno rifugio a caprioli, cervi e
      cinghiali, ma anche a lupi, volpi, martore e puzzole. La [lince europea](/especie/lynx_lynx/) e il
      [gatto selvatico](/especie/felis_silvestris/) rappresentano i felini, mentre [l'orso
      bruno](/especie/ursus_arctos/) è il vertice della catena alimentare. Con un po' di fortuna si osservano
      tassi, ermellini o donnole. Nei torrenti montani che confluiscono nel Dunajec e nel Poprad vivono il
      [castoro europeo](/especie/castor_fiber/) e la [lontra europea](/especie/lutra_lutra/).


      Gli uccelli superano le 160 specie. Tra queste spiccano galliformi forestali assai rari in Polonia come
      il [gallo cedrone](/especie/tetrao_urogallus/), oltre a rapaci di rilievo: il [gufo
      reale](/especie/bubo_bubo/), l' [allocco degli Urali](/especie/strix_uralensis/), l' [aquila
      reale](/especie/aquila_chrysaetos/), la [cicogna nera](/especie/ciconia_nigra/), che nidifica nell'area
      protetta, e il [picchio nero](/especie/dryocopus_martius/). Le radure forestali ospitano inoltre circa
      65 specie di farfalle diurne.


      Quando la primavera tocca il piano montano, il sottobosco si copre di bucaneve, colombine e aglio
      orsino. Più tardi, nei prati montani, sbocciano carline protette e varie orchidee. Lungo i sentieri si
      scorgono la biscia dal collare e il raro colubro di Esculapio, mentre nei ruscelli di quota trova
      rifugio la [salamandra pezzata](/especie/salamandra_salamandra/).
    visit: >-
      Una prima passeggiata consigliata è il sentiero Rogasiowy, che risale i torrenti Roztoka Wielka e Mała
      lungo la valle di Roztoka, a ovest di Rytro, sfiorando la riserva di Baniska. Il tracciato è arricchito
      da pannelli informativi.


      Se preferisci un'escursione di un'intera giornata, l'itinerario di Hala Łabowska muove da
      Piwniczna-Zdrój: sono 20,8 km di media difficoltà lontani dal turismo di massa. Lungo il cammino trovi
      un rifugio alpino a Hala Łabowska, i torrioni di arenaria di Diabelskie Ściany e la riserva di
      Barnowiec.


      Per osservare la fauna senza disturbarla, la riserva Bobrowisko, ricavata in vecchie cave di ghiaia a
      Stary Sącz, offre passerelle in legno e due capanni provvisti di due cannocchiali: vi si avvistano cigni
      reali, aironi cenerini, picchi neri, germani reali e tane di castori. A Las Lipowy Obrożyska un percorso
      didattico con sette soste si compie in circa due ore e mezza. In mountain bike, la salita a Radziejowa
      da Rytro richiede 30,5 km superando 900 metri di dislivello.
    history: >-
      Diversi villaggi del parco conservano chiese ortodosse in legno: quella di Powroźnik risale agli inizi
      del XVII secolo. A Jarmuta, vicino a Szczawnica, restano due gallerie di una miniera d'argento del XVIII
      secolo; una non è accessibile per tutelare i pipistrelli svernanti.


      Il parco è stato istituito nel 1987 e la sua salvaguardia si articola in 13 riserve naturali, quasi 130
      monumenti naturali e quattro aree ecologiche. Il sito Natura 2000 Ostoja Popradzka coincide in buona
      parte con il parco. Natura 2000 Krynica protegge una delle più importanti colonie carpatiche di
      [vespertilio maggiore](/especie/myotis_myotis/). La riserva di Uhryń tutela un bosco vetusto di faggi e
      abeti, relitto dell'antica foresta vergine dei Carpazi.
    before: >-
      Nelle riserve naturali del parco è consentito muoversi solo lungo i sentieri escursionistici o didattici
      segnalati.
    around: >-
      Il [Parco Nazionale Pieniny - Gola del Fiume Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/)
      dista tre chilometri, e a venticinque chilometri sorgono i [Monti Tatra](/lugar/tatransky-narodny-park/)
      in Slovacchia. Più lontane, la [Foresta Primaria di Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/)
      e la [Foresta Vergine di Krokar](/lugar/pragozd-krokar/) condividono l'allocco degli Urali e il gatto
      selvatico.
  pt:
    intro: >-
      Quatro em cada cinco metros quadrados deste parque são floresta. O Parque Paisagístico de Poprad cobre a
      maior parte de Beskid Sądecki, desde Krynica e Tylicz até Krościenko e Łącko. O seu nome provém do rio
      Poprad, que atravessa a cordilheira por um vale estreito entre dois cumes de destaque, Radziejowa e
      Jaworzyna Krynicka. É o maior parque do seu género na região de Małopolska e um dos maiores da Polónia.
      Nestas florestas de abeto e faia vivem o urso-pardo, o lobo e o lince.
    landscape: >-
      Os cumes de Radziejowa e Jaworzyna Krynicka são compostos por arenito de Magura, uma rocha dura que
      resiste à erosão e domina a paisagem. O ponto mais alto, Radziejowa, atinge 1.262 metros. A partir daí o
      parque desce em patamares sucessivos de vegetação.


      Na parte inferior, até ao piso montano baixo que alcança 1.100 metros, predominam pastagens e campos
      agrícolas, enquanto nas margens do Poprad e do Dunajec prosperam amiais e caniçais. Segue-se o domínio
      do abeto e da faia, que compõem o faial cárpato. Acima de 1.100 metros surge um esprucial com mirtilos,
      e até a essa altitude despontam raridades: o parque reúne os únicos locais da Polónia onde floresce no
      outono um pilriteiro de fruto grande.
    wildlife: >-
      A grande protagonista é a floresta densa, cujos blocos contínuos acolhem corços, veados e javalis, assim
      como lobos, raposas, martas e toirões. O [lince-euroasiático](/especie/lynx_lynx/) e o
      [gato-bravo](/especie/felis_silvestris/) representam os felinos, e o
      [urso-pardo](/especie/ursus_arctos/) constitui o maior predador. Com sorte avistam-se texugos, arminhos
      ou doninhas. Nos ribeiros caudalosos que descem para o Dunajec e o Poprad habitam o
      [castor-europeu](/especie/castor_fiber/) e a [lontra-europeia](/especie/lutra_lutra/).


      As aves ultrapassam as 160 espécies. Entre elas figuram galiformes florestais raros na Polónia como o
      [tetraz-grande](/especie/tetrao_urogallus/), além de aves de rapina de relevo: o
      [bufo-real](/especie/bubo_bubo/), a [coruja-uralense](/especie/strix_uralensis/), a
      [águia-real](/especie/aquila_chrysaetos/), a [cegonha-preta](/especie/ciconia_nigra/), que nidifica no
      parque, e o [pitéu-preto](/especie/dryocopus_martius/). O parque acolhe também cerca de 65 espécies de
      borboletas diurnas nos prados florestais.


      Na primavera, o solo do piso montano cobre-se de campainhas-brancas, corriolas e alho-ursino. Mais
      tarde, nos prados, desabrocham carlinas protegidas e diversas orquídeas. Nos trilhos florestais surgem a
      cobra-de-água-de-colar e a rara cobra-de-esculápio, enquanto nos ribeiros de montanha vive a
      [salamandra-de-pintas-amarelas](/especie/salamandra_salamandra/).
    visit: >-
      Um bom primeiro passeio é o trilho Rogasiowy, que acompanha as ribeiras de Roztoka Wielka e Mała pelo
      vale de Roztoka, a oeste de Rytro, passando perto da reserva de Baniska. O caminho conta com painéis
      didáticos sobre a natureza envolvente.


      Se preferes uma caminhada de um dia inteiro, a rota de Hala Łabowska parte de Piwniczna-Zdrój: são 20,8
      km de dificuldade média longe do turismo de massas. Pelo caminho encontras um refúgio de montanha em
      Hala Łabowska, os afloramentos rochosos de Diabelskie Ściany em arenito e a reserva de Barnowiec.


      Para observar a vida selvagem com calma, a reserva Bobrowisko, nas antigas cascalheiras de Stary Sącz,
      dispõe de passadiços de madeira e dois postos com dois telescópios: avistam-se cisnes-mudos,
      garças-reais, pitéus-pretos, patos-reais e tocas de castores. Em Las Lipowy Obrożyska, um trilho
      interpretativo com sete paragens cumpre-se em cerca de duas horas e meia. Em bicicleta de montanha, a
      subida a Radziejowa a partir de Rytro totaliza 30,5 km e supera 900 metros de desnível.
    history: >-
      Várias povoações do parque guardam igrejas ortodoxas de madeira: a de Powroźnik, por exemplo, foi
      erguida no início do século XVII. Em Jarmuta, perto de Szczawnica, restam duas galerias de uma mina de
      prata do século XVIII; uma permanece interdita para proteger morcegos.


      O parque foi criado em 1987 e a sua proteção apoia-se em 13 reservas naturais, quase 130 monumentos
      naturais e quatro áreas de interesse ecológico. O sítio Natura 2000 Ostoja Popradzka abrange grande
      parte do território do parque. Natura 2000 Krynica protege uma das colónias de
      [morcego-rato-grande](/especie/myotis_myotis/) mais importantes dos Cárpatos. A reserva de Uhryń
      preserva um bosque secular de faias e abetos, fragmento da antiga selva carpatiana.
    before: >-
      Nas reservas naturais do parque só é permitido circular nos trilhos turísticos ou didáticos devidamente
      sinalizados.
    around: >-
      O [Parque Nacional Pieniny - Desfiladeiro do Rio
      Dunajec](/lugar/pieninski-park-narodowy---dunajec-gorge/) fica a três quilómetros, e a vinte e cinco
      quilómetros situam-se os [Montes Tatras](/lugar/tatransky-narodny-park/) na Eslováquia. Mais longe, a
      [Floresta Primária de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) e a [Floresta Virgem de
      Krokar](/lugar/pragozd-krokar/) partilham a coruja-uralense e o gato-bravo.
