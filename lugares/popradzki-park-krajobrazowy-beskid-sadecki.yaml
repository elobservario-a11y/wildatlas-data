    Montañas de los Cárpatos Polacos cubiertas de abetales y hayedos con linces, osos y manantiales minerales
    en el valle de Poprad.
  en: >-
    Polish Carpathian mountains carpeted with fir and beech forests harboring lynx, brown bears, and mineral
    springs in the Poprad Valley.
  fr: >-
    Montagnes des Carpates polonaises couvertes de sapinières et de hêtraies abritant lynx, ours et sources
    minérales dans la vallée du Poprad.
  de: >-
    Polnische Karpatenberge mit ausgedehnten Tannen- und Buchenwäldern, Luchsen, Braunbären und Mineralquellen
    im Poprad-Tal.
  it: >-
    Montagne dei Carpazi polacchi coperte da abetine e faggete con linci, orsi bruni e sorgenti minerali nella
    valle del Poprad.
  pt: >-
    Montanhas dos Cárpatos polacos cobertas de abetais e faiais com linces, ursos-pardos e nascentes minerais
    no vale do Poprad.
unico:
  es: >-
    Un parque de bosques de abeto y haya donde sobreviven restos de la antigua selva de los Cárpatos, con
    iglesias ortodoxas de madera en sus pueblos.
  en: >-
    A park of fir and beech forests where fragments of the ancient Carpathian primeval woodland survive,
    beside wooden Orthodox churches in the villages.
  fr: >-
    Un parc de forêts de sapins et de hêtres où subsistent des reliques de la forêt primaire des Carpates,
    avec des églises orthodoxes en bois dans ses villages.
  de: >-
    Ein Park mit Tannen- und Buchenwäldern, in dem Reste des alten Karpatenurwalds überdauern, umgeben von
    hölzernen orthodoxen Kirchen in den Dörfern.
  it: >-
    Un parco di foreste di abeti e faggi in cui sopravvivono lembi dell'antica foresta primaria dei Carpazi,
    con chiese ortodosse in legno nei suoi villaggi.
  pt: >-
    Um parque de florestas de abeto e faia onde sobrevivem vestígios da antiga floresta virgem dos Cárpatos,
    com igrejas ortodoxas de madeira nas suas aldeias.
