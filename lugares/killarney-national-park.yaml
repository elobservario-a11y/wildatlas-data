resumen:
  es: >-
    El primer parque nacional de Irlanda: robledales atlánticos cubiertos de musgo, lagos y la única manada
    nativa de ciervo rojo de la isla.
  en: >-
    Ireland's first national park: moss-draped ancient Atlantic oakwoods, lakes, and the island's sole native
    red deer herd.
  fr: >-
    Le premier parc national d'Irlande : chênaies atlantiques moussues, lacs et l'unique harde autochtone de
    cerf élaphe de l'île.
  de: >-
    Irlands erster Nationalpark: moosüberzogene atlantische Eichenurwälder, Seen und das einzige autochthone
    Rothirschrudel der Insel.
  it: >-
    Il primo parco nazionale d'Irlanda: querce atlantiche ammantate di muschio, laghi e l'unico branco nativo
    di cervo nobile dell'isola.
  pt: >-
    O primeiro parque nacional da Irlanda: carvalhais atlânticos cobertos de musgo, lagos e a única manada
    nativa de veado-vermelho da ilha.
unico:
  es: >-
    Es el único sitio de Irlanda con una manada autóctona de ciervo rojo, entre lagos, robledales y la mayor
    tejeda de Europa occidental.
  en: >-
    The only place in Ireland harbouring an indigenous red deer herd, amidst lakes, oak woodlands, and western
    Europe's largest yew forest.
  fr: >-
    Le seul endroit en Irlande abritant une harde indigène de cerf élaphe, entre lacs, chênaies et la plus
    vaste yeuseraie d'Europe occidentale.
  de: >-
    Der einzige Ort in Irland mit einem einheimischen Rothirschrudel, inmitten von Seen, Eichenwäldern und
    Westeuropas größtem Eibenwald.
  it: >-
    L'unico comprensorio in Irlanda con una popolazione autoctona di cervo nobile, tra laghi, cerrete e la più
    vasta lecceta-tasseta d'Europa occidentale.
  pt: >-
    É o único local da Irlanda com uma manada autóctone de veado-vermelho, entre lagos, carvalhais e o maior
    teixedo da Europa ocidental.
observaciones:
  es: >-
    Octubre es la berrea; la afluencia es alta junto a Muckross House y en el Gap of Dunloe. Los perros son
    bienvenidos pero deben ir con correa, y no se permiten fuegos de ningún tipo. En días cálidos y húmedos
    puede haber nubes de jejenes, y quien se sale de los caminos puede recibir picaduras de garrapatas, que en
    raros casos transmiten la enfermedad de Lyme.
texto:
  es:
    intro: >-
      Hay un ciervo en Irlanda que lleva aquí desde el Neolítico. Todos los demás ciervos del país descienden
      de animales reintroducidos; el de Killarney es el último de una manada autóctona. Este es además el
      primer parque nacional de Irlanda, nacido en 1932 cuando se donó al Estado la finca de Muckross. Entre
      los lagos de Killarney, en Kerry, hay montañas, robledales, aliseda y la mayor tejeda de Europa
      occidental.
    landscape: >-
      Aquí hay tres paisajes en uno. En el centro, los Lagos de Killarney: Lough Leane, el mayor, con más de
      30 islas; Muckross Lake, el más profundo, con 73.5 m máximos junto a la ladera del monte Torc; y el
      Upper Lake. Los tres juntos ocupan casi una cuarta parte del parque. Alrededor se levantan las montañas
      Mangerton, Torc, Shehy y Purple, y por debajo se extienden los bosques.


      El motivo de tanta variedad está en la geología: en el parque se cruzan la arenisca roja del Devónico y
      la caliza del Carbonífero. De ahí que haya tres tipos de bosque: un robledal ácido sobre arenisca, una
      tejeda cubierta de musgo sobre caliza y una aliseda húmeda junto a los lagos. Es de los pocos lugares de
      Irlanda cubiertos de bosque de forma continua desde la última glaciación, hace unos 10.000 años, y los
      robledales son la mayor extensión de bosque autóctono que queda en el país. El madroño forma parte
      destacada de estos bosques.


      En el bosque de tejos de Reenadinna, entre Muckross Lake y Lough Leane, los árboles tienen entre 200 y
      250 años; es la mayor tejeda de Europa occidental. Hay otras rarezas: el helecho de Killarney, diezmado
      en el siglo XIX por la recolección comercial de la fiebre victoriana por los helechos; la col de San
      Patricio y la saxífraga reniforme, que viven en el oeste de Irlanda y en el norte de España y Portugal.
    wildlife: >-
      Todo gira en torno al [ciervo rojo](/especie/cervus_elaphus/). A principios de junio las hembras suben a
      la montaña a parir y el personal del parque marca a las crías. En agosto los machos empiezan a separarse
      unos de otros, y en octubre llega la berrea: durante varias semanas defienden su territorio con gran
      despliegue de fuerza, se avisan bramando, caminan en paralelo y al final traban las cuernas. El ciervo
      sika, en cambio, vino de Japón en 1865 y su población ha crecido mucho desde entonces.


      Entre el resto de la fauna destaca el sábalo de Killarney, llamado goureen, único del Lough Leane. Un
      tricóptero raro, Setodes argentipunctellus, solo se encuentra en Irlanda en Killarney, y la libélula
      esmeralda boreal, la más rara del país, se limita a dos pequeñas zonas del parque; se ve de mayo a
      septiembre y sobre todo en junio y julio. La [nutria](/especie/lutra_lutra/) es esquiva y nocturna: se
      la ve al amanecer o al atardecer. Y sobre el Lough Leane vuelve a verse el [águila de cola
      blanca](/especie/haliaeetus_albicilla/), que no se veía en Irlanda desde principios del siglo XX hasta
      que un programa de reintroducción la trajo de vuelta aquí.


      De las más de 450 especies de aves de Irlanda, se han registrado en el parque más de 140, entre
      residentes y migratorias. En mayo de 2023 se siguió por satélite a tres cucos de Killarney y uno del
      Burren.
    visit: >-
      Se recorre sobre todo a pie. El Knockreer Circular Walk mide 5 km, es fácil, sale de Killarney House and
      Gardens y ofrece vistas del Lough Leane y de los MacGillycuddy Reeks. El sendero de Dundag a Torc
      recorre vistas del Muckross Lake y de los campos de Torc, a menudo con ciervos rojos, y termina cerca de
      la famosa cascada de Torc. Un paseo bordea la península de Muckross entre robledal, un prado abierto y
      el bosque de tejos de Reenadinna, uno de los tres que hay en Europa. El Lakeside Walk sigue la orilla
      del Lough Leane hasta Muckross House, con la posibilidad de visitar Muckross Abbey por el camino, y el
      Mining Trail, de 3 km, es fácil y llano. El Old Kenmare Road cruza las tierras altas del parque y forma
      parte del Kerry Way.


      Sobre el agua, hay excursiones en barca desde The Old Boat House, junto a Muckross House, y desde Ross
      Castle, con rutas por el Lough Leane, la isla de Innisfallen, Lord Brandon’s Cottage y la península de
      Dinis. También se puede ir en canoa o kayak, pero hace falta permiso y hay que lavar a presión la
      embarcación antes.


      Se hacen visitas guiadas profesionales en Muckross House, Killarney House y Ross Castle.
    history: >-
      La finca de Muckross se donó al Estado en 1932 y con ella nació el primer parque nacional de Irlanda.
      Mucho antes ya había minería: hay indicios de extracción de cobre en Ross Island en la Edad del Bronce.
      Ross Castle, a orillas del Lough Leane, es una torre del siglo XV construida por el jefe irlandés
      O’Donoghue Mor, y en el patio de Muckross Abbey crece un tejo antiguo, que se dice que tiene la edad de
      la abadía.


      Hoy el parque es reserva de la biosfera y Zona Especial de Conservación para tejedas y especies como la
      babosa de Kerry, el mejillón perlero y la lamprea marina. El rododendro invasor afecta a unos dos
      tercios de los robledales y hay un programa en marcha para eliminarlo.
    before: >-
      Octubre es la berrea; la afluencia es alta junto a Muckross House y en el Gap of Dunloe. Los perros son
      bienvenidos pero deben ir con correa, y no se permiten fuegos de ningún tipo. En días cálidos y húmedos
      puede haber nubes de jejenes, y quien se sale de los caminos puede recibir picaduras de garrapatas, que
      en raros casos transmiten la enfermedad de Lyme.
    around: >-
      Killarney no tiene vecinos cercanos en el atlas. Comparten especies y hábitats con él el [Parque
      Nacional Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) (tejo, nutria y águila
      real), el [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) (madroño y águila real),
      el [Parque Nacional del Olimpo](/lugar/ethnikos-drymos-olympou/) y [Cheile
      Râmețului](/lugar/cheile-rametului/) (tejo y águila real).
  en:
    intro: >-
      There is a red deer herd in Ireland that has grazed these hills since the Neolithic. All other red deer
      in the country descend from reintroduced stock; Killarney's herd is the last surviving remnant of the
      original indigenous lineage. This was also Ireland's very first national park, created in 1932 when the
      historic Muckross Estate was presented to the nation. Between the Lakes of Killarney in County Kerry
      rise sandstone mountains, sessile oakwoods, alder carrs, and western Europe's finest yew forest.
    landscape: >-
      Here you encounter three distinct landscapes in one. At the heart lie the Lakes of Killarney: Lough
      Leane, the largest, dotted with over 30 islands; Muckross Lake, the deepest, plunging to a maximum depth
      of 73.5 m beneath Torc Mountain; and the serene Upper Lake. Together the three lakes cover nearly a
      quarter of the park's territory. Enclosing them rise Mangerton, Torc, Shehy, and Purple Mountain,
      beneath which old-growth woods stretch to the shorelines.


      This rich diversity is rooted in geology: Devonian Old Red Sandstone collides with Carboniferous
      limestone. This yields three contrasting woodland types: acid oakwoods on sandstone, a moss-cushioned
      yew wood on karst limestone, and waterlogged alder woods fringing the lake margins. It is one of the
      rare places in Ireland continuously wooded since the retreat of the glaciers some 10,000 years ago, with
      the oakwoods representing the largest surviving tract of semi-natural native forest in the country. The
      strawberry tree (Arbutus unedo) forms a celebrated component of these woods.


      In the Reenadinna yew wood, tucked between Muckross Lake and Lough Leane, ancient yews date between 200
      and 250 years old, comprising the largest stand of its kind in western Europe. Other botanical treasures
      include the rare Killarney fern, decimated in the nineteenth century during the Victorian
      fern-collecting craze, and Lusitanian relict flora such as St Patrick's cabbage and kidney saxifrage,
      native to western Ireland and northern Iberia.
    wildlife: >-
      Life in the park centres on the [red deer](/especie/cervus_elaphus/). In early June, hinds climb into
      high corries to calve, where park rangers tag the newborn calves. In August stags separate into bachelor
      groups, and October brings the dramatic rut: for weeks stags defend their harems through displays of
      strength, roaring challenges, parallel walking, and clashing antlers. Sika deer, introduced from Japan
      in 1865, have multiplied substantially across the woodlands.


      Other notable fauna includes the Killarney shad (known locally as the goureen), a landlocked fish found
      only in Lough Leane. A rare caddisfly, Setodes argentipunctellus, is confined in Ireland solely to
      Killarney, while the northern emerald dragonfly, the country's rarest odonate, survives in just two
      small park bogs, flying from May to September. [Eurasian otters](/especie/lutra_lutra/) hunt along lake
      shores at dawn and dusk. Over Lough Leane, the [white-tailed eagle](/especie/haliaeetus_albicilla/)
      soars once more, having been absent from Ireland since the early twentieth century until an ambitious
      reintroduction project brought it back.


      Of Ireland's more than 450 bird species, over 140 have been recorded within the park. In May 2023,
      satellite transmitters were fitted to three Killarney cuckoos and one from the Burren to track their
      African migrations.
    visit: >-
      The park is best explored on foot. The Knockreer Circular Walk spans 5 km, offering gentle walking from
      Killarney House and Gardens with views over Lough Leane and the MacGillycuddy's Reeks. The path from
      Dundag to Torc affords panoramic vistas of Muckross Lake and the meadows of Torc, often dotted with
      grazing red deer, leading to Torc Waterfall. A trail loops the Muckross Peninsula through oakwoods, open
      meadows, and the Reenadinna yew wood—one of only three such woodlands in Europe. The Lakeside Walk
      traces the shore of Lough Leane to Muckross House, passing historic Muckross Abbey, while the Mining
      Trail covers an easy 3 km. The rugged Old Kenmare Road traverses the uplands as part of the Kerry Way.


      On the water, open boat trips depart from the Old Boat House near Muckross House and from Ross Castle,
      touring Lough Leane, Innisfallen Island, Lord Brandon's Cottage, and Dinis Peninsula. Canoeing and
      kayaking are permitted, subject to prior permit and biosecurity power-washing.


      Guided tours operate regularly at Muckross House, Killarney House, and Ross Castle.
    history: >-
      The Muckross Estate was gifted to the Irish Free State in 1932, establishing Ireland's inaugural
      national park. Human exploitation stretches back millennia: copper extraction at Ross Island dates to
      the early Bronze Age. Ross Castle on the shores of Lough Leane is a fifteenth-century tower house built
      by chieftain O'Donoghue Mór, while in the cloister of Muckross Abbey flourishes a venerable yew tree
      reputedly planted when the abbey was founded.


      Today the park is designated a UNESCO Biosphere Reserve and Special Area of Conservation protecting yew
      woods, the Kerry slug, freshwater pearl mussels, and sea lampreys. Invasive rhododendron affects about
      two-thirds of the oakwoods, where eradication teams work continuously.
    before: >-
      October is the peak red deer rutting season; visitor traffic is high around Muckross House and through
      the Gap of Dunloe. Dogs are welcome on a short lead, but open flames and campfires are strictly
      forbidden. On warm, still days midges can be troublesome, and walking off-trail carries a risk of tick
      bites, which can transmit Lyme disease.
    around: >-
      Killarney has no direct neighbours in the atlas. It shares species and ancient woodland habitats with
      [Sierra de las Nieves National Park](/lugar/parque-nacional-sierra-de-las-nieves/) (yew, otter, golden
      eagle), [Monfragüe National Park](/lugar/parque-nacional-de-monfrague/) (strawberry tree and golden
      eagle), [Mount Olympus National Park](/lugar/ethnikos-drymos-olympou/), and [Cheile
      Râmețului](/lugar/cheile-rametului/) (yew and golden eagle).
  fr:
    intro: >-
      Il existe en Irlande une harde de cerfs installée ici depuis le Néolithique. Tous les autres cerfs du
      pays descendent de bêtes réintroduites ; celui de Killarney est l'ultime représentant de la souche
      autochtone. C'est également le tout premier parc national d'Irlande, né en 1932 lors du don à l'État du
      domaine de Muckross. Entre les lacs de Killarney, dans le Kerry, se déploient montagnes gréseuses,
      chênaies sessiliflores, aulnaies marécageuses et la plus remarquable yeuseraie d'Europe occidentale.
    landscape: >-
      Ce territoire réunit trois paysages en un. Au cœur reposent les lacs de Killarney : le Lough Leane, le
      plus vaste, parsemé de plus de 30 îles ; le lac Muckross, le plus profond, plongeant à 73,5 m au pied du
      mont Torc ; et l'Upper Lake. À eux trois, ils couvrent près d'un quart de la superficie du parc. Autour
      se dressent les monts Mangerton, Torc, Shehy et Purple, au pied desquels la forêt descend jusqu'aux
      grèves.


      Cette diversité découle de la géologie : les Vieux Grès Rouges dévoniens y croisent les calcaires
      carbonifères. Trois types forestiers coexistent ainsi : une chênaie acide sur grès, une yeuseraie sur
      calcaire tapissée de mousses et une aulnaie humide riveraine. C'est l'un des rares massifs d'Irlande
      resté boisé sans interruption depuis le retrait glaciaire il y a 10 000 ans, et ses chênaies constituent
      le plus grand massif de forêt indigène subsistant dans l'île. L'arbousier y trouve une place de premier
      plan.


      Dans la yeuseraie de Reenadinna, entre Muckross Lake et Lough Leane, les ifs ont entre 200 et 250 ans ;
      c'est le plus vaste peuplement d'ifs d'Europe occidentale. D'autres trésors botaniques s'y rencontrent :
      le trichomanès de Killarney, décimé au XIXe siècle par la folie victorienne des fougères, ainsi que la
      saxifrage réniforme et le chou de Saint-Patrick, plantes lusitaniennes d'Irlande et de la péninsule
      Ibérique.
    wildlife: >-
      La vie sauvage gravite autour du [cerf élaphe](/especie/cervus_elaphus/). Début juin, les biches gagnent
      les combes d'altitude pour mettre bas et les agents baguent les faons. En août, les mâles se séparent,
      et en octobre éclate le brame : des semaines durant, les grands cerfs défendent leur territoire,
      brament, marchent en parallèle et finissent par entrechoquer leurs ramures. Le cerf sika, introduit du
      Japon en 1865, a quant à lui largement prospéré.


      Parmi le reste de la faune figure l'alose de Killarney (appelée goureen), confinée au Lough Leane. Un
      trichoptère rare, Setodes argentipunctellus, ne subsiste en Irlande qu'à Killarney, tandis que la
      cordulie arctique, la libellule la plus rare du pays, est cantonnée à deux tourbières du parc, volant de
      mai à septembre. La [loutre d'Europe](/especie/lutra_lutra/) est crépusculaire le long des rives.
      Au-dessus des eaux plane de nouveau le [pygargue à queue blanche](/especie/haliaeetus_albicilla/),
      disparu d'Irlande au début du XXe siècle avant d'être réintroduit avec succès.


      Sur plus de 450 espèces d'oiseaux connues en Irlande, plus de 140 ont été recensées dans le parc. En mai
      2023, trois coucous de Killarney et un du Burren ont été équipés de balises satellites.
    visit: >-
      Le parc se découvre idéalement à pied. Le Knockreer Circular Walk propose 5 km d'allées faciles depuis
      Killarney House and Gardens avec vue sur le Lough Leane et les MacGillycuddy's Reeks. Le sentier de
      Dundag à Torc longe le lac Muckross et les prairies fréquentées par les cerfs avant de rejoindre la
      cascade de Torc. Une boucle parcourt la péninsule de Muckross entre chênaies, clairières et la yeuseraie
      de Reenadinna, l'un des trois bois d'ifs remarquables d'Europe. Le Lakeside Walk suit les rives jusqu'à
      Muckross House en côtoyant l'abbaye de Muckross, tandis que le Mining Trail offre 3 km de balade plane.
      L'Old Kenmare Road parcourt les hauteurs sur le tracé du Kerry Way.


      Sur l'eau, des promenades en bateau partent de l'Old Boat House près de Muckross House et de Ross Castle
      vers Innisfallen et Dinis. Le canoë-kayak est autorisé sur permis après nettoyage sous pression de
      l'embarcation.


      Des visites guidées sont proposées à Muckross House, Killarney House et Ross Castle.
    history: >-
      Le domaine de Muckross fut cédé à l'État en 1932, fondant le premier parc national irlandais. Les traces
      d'extraction de cuivre sur Ross Island remontent à l'âge du bronze. Ross Castle, sur les rives du Lough
      Leane, est une tour-résidence du XVe siècle érigée par le chef de clan O'Donoghue Mór, et un if
      multiséculaire s'élève dans le cloître de l'abbaye de Muckross.


      Aujourd'hui réserve de biosphère et ZSC, le parc protège l'if, la limace de Kerry, la moule perlière et
      la lamproie marine. Le rhododendron pontique invasif dégrade environ deux tiers des chênaies, faisant
      l'objet d'un vaste programme d'arrachage.
    before: >-
      Le brame bat son plein en octobre ; l'affluence est marquée autour de Muckross House et dans le Gap of
      Dunloe. Les chiens doivent impérativement être tenus en laisse et les feux sont prohibés. Par temps
      chaud, les moucherons peuvent incommoder les marcheurs, et quitter les sentiers expose aux morsures de
      tiques vectrices de la maladie de Lyme.
    around: >-
      Killarney est isolé dans l'atlas. Il partage ses milieux de vieilles forêts et d'ifs avec le [Parc
      national Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) (if, loutre et aigle
      royal), le [Parc national de Monfragüe](/lugar/parque-nacional-de-monfrague/) (arbousier et aigle
      royal), le [Parc national de l'Olympe](/lugar/ethnikos-drymos-olympou/) et [Cheile
      Râmețului](/lugar/cheile-rametului/) (if et aigle royal).
  de:
    intro: >-
      In Irland lebt ein Rothirschrudel, dessen Ahnen bereits im Neolithikum diese Wälder durchstreiften. Alle
      anderen Hirsche der Insel stammen von Wiedereinbürgerungen ab; die Tiere von Killarney bilden die letzte
      autochthone Population. Hier entstand 1932 auch Irlands erster Nationalpark, als das Muckross-Gut dem
      Staat geschenkt wurde. Zwischen den Seen von Killarney in der Grafschaft Kerry erheben sich Berge,
      Traubeneichenwälder, Erlenbrüche und der größte Eibenbestand Westeuropas.
    landscape: >-
      Hier verschmelzen drei Landschaften zu einer Einheit. Im Zentrum ruhen die Seen von Killarney: Lough
      Leane, der größte See mit über 30 Inseln; Muckross Lake, der tiefste mit 73,5 m Maximaltiefe am Fuß des
      Torc Mountain; sowie der Upper Lake. Die drei Seen nehmen fast ein Viertel des Parks ein. Ringsum ragen
      Mangerton, Torc, Shehy und Purple Mountain auf, an deren Flanken die Altwälder bis an die Ufer reichen.


      Der Grund für diesen Reichtum liegt im Zusammentreffen von devonischem Sandstein und Karbonkalk. Daraus
      erwachsen drei Waldtypen: saure Eichenwälder auf Sandstein, moosgepolsterte Eibenwälder auf Karstkalk
      und nasse Erlenwälder an den Seen. Es ist einer der seltenen Orte Irlands mit kontinuierlicher
      Waldbedeckung seit der Eiszeit vor rund 10.000 Jahren, und die Eichenbestände sind die größten
      verbliebenen Urwälder des Landes. Der Westliche Erdbeerbaum prägt diese Wälder.


      Im Eibenwald von Reenadinna zwischen Muckross Lake und Lough Leane zählen die Bäume zwischen 200 und 250
      Jahre; es ist der bedeutendste Eibenwald Westeuropas. Weitere Besonderheiten sind der Killarney-Farn,
      der im neunzehnten Jahrhundert der viktorianischen Farnsammeltollwut zum Opfer fiel, sowie der
      Porzellanblümchen-Steinbrech und das Nierenblättrige Löffelkraut.
    wildlife: >-
      Alles dreht sich um den [Rothirsch](/especie/cervus_elaphus/). Anfang Juni ziehen die Hirschkühe in die
      Hochtäler zum Setzen, wo Ranger die Kälber markieren. Im August trennen sich die Hirsche, und im Oktober
      folgt die Brunft: Wochenlang verteidigen Platzhirsche ihr Kahlwildrudel durch Röhren, Parallelläufe und
      Geweihduelle. Sikahirsche, 1865 aus Japan eingeführt, haben sich seither stark ausgebreitet.


      Unter den weiteren Tierarten sticht die Killarney-Finte hervor, ein Fisch, der endemisch im Lough Leane
      lebt. Die Köcherfliege Setodes argentipunctellus kommt in Irland ausschließlich hier vor, und die
      Arktische Smaragdlibelle, Irlands seltenste Libelle, beschränkt sich auf zwei Moorgebiete im Park und
      fliegt von Mai bis September. Der [Fischotter](/especie/lutra_lutra/) jagt in der Dämmerung am Seeufer.
      Über dem Lough Leane kreist wieder der [Seeadler](/especie/haliaeetus_albicilla/), der nach seinem
      Erlöschen Anfang des zwanzigsten Jahrhunderts erfolgreich wiederangesiedelt wurde.


      Von Irlands über 450 Vogelarten wurden mehr als 140 im Park dokumentiert. Im Mai 2023 rüstete man drei
      Kuckucke aus Killarney und einen aus dem Burren mit Satellitensendern aus.
    visit: >-
      Der Park lässt sich ideal zu Fuß erkunden. Der Knockreer Circular Walk führt über 5 km von Killarney
      House and Gardens mit Ausblick auf den Lough Leane und die Bergkette der MacGillycuddy's Reeks. Der Weg
      von Dundag nach Torc bietet Panoramablicke auf den Muckross Lake und Hirschwiesen nahe dem
      Torc-Wasserfall. Ein Rundweg führt über die Muckross-Halbinsel durch Eichenwälder, Wiesen und den
      Reenadinna-Eibenwald – einen von nur drei solchen Beständen in Europa. Der Lakeside Walk folgt dem Ufer
      des Lough Leane zu Muckross House und Muckross Abbey, während der Mining Trail 3 km eben verläuft. Die
      Old Kenmare Road durchquert das Hochland als Teilstück des Kerry Way.


      Auf dem Wasser verkehren offene Boote ab dem Old Boat House und Ross Castle nach Innisfallen und zur
      Dinis-Halbinsel. Kanus und Kajaks sind nach Genehmigung und Desinfektion gestattet.


      Führungen finden in Muckross House, Killarney House und Ross Castle statt.
    history: >-
      Mit der Übergabe des Muckross-Guts an den Staat im Jahr 1932 wurde Irlands erster Nationalpark
      begründet. Bergbau hat uralte Tradition: Auf Ross Island wurde bereits in der Bronzezeit Kupfer
      gewonnen. Ross Castle am Ufer des Lough Leane ist ein Wohnturm aus dem fünfzehnten Jahrhundert, erbaut
      von Häuptling O'Donoghue Mór, und im Kreuzgang von Muckross Abbey wurzelt eine uralte Eibe.


      Heute ist das Gebiet Biosphärenreservat und FFH-Gebiet zum Schutz von Eibenwäldern, Kerry-Schnecke und
      Flussperlmuschel. Der invasive Pontische Rhododendron überwuchert etwa zwei Drittel der Eichenwälder und
      wird systematisch gerodet.
    before: >-
      Im Oktober herrscht Brunftzeit; der Besucherandrang ist an Muckross House und im Gap of Dunloe hoch.
      Hunde gehören zwingend an die kurze Leine, offenes Feuer ist verboten. An warmen Tagen schwärmen
      Gnitzen, und abseits der Wege besteht Zeckengefahr.
    around: >-
      Killarney liegt isoliert im Atlas. Es teilt alte Eiben- und Eichenwälder mit dem [Nationalpark Sierra de
      las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) (Eibe, Fischotter, Steinadler), dem
      [Nationalpark Monfragüe](/lugar/parque-nacional-de-monfrague/) (Erdbeerbaum, Steinadler), dem
      [Nationalpark Olymp](/lugar/ethnikos-drymos-olympou/) und [Cheile Râmețului](/lugar/cheile-rametului/)
      (Eibe und Steinadler).
  it:
    intro: >-
      C'è un cervo in Irlanda che abita queste valli sin dal Neolitico. Tutti gli altri cervi dell'isola
      discendono da esemplari reintrodotti; quello di Killarney rappresenta l'ultimo ceppo indigeno puro.
      Questo è anche il primo parco nazionale d'Irlanda, fondato nel 1932 con la donazione allo Stato della
      tenuta di Muckross. Tra i laghi di Killarney, nella contea di Kerry, si susseguono monti arenacei,
      querceti atlantici, ontanete palustri e la più estesa tasseta d'Europa occidentale.
    landscape: >-
      Il parco compendia tre paesaggi in uno. Al centro si distendono i laghi di Killarney: il Lough Leane, il
      più grande, costellato di oltre 30 isole; il Muckross Lake, il più profondo, che raggiunge 73,5 m di
      profondità massima sotto il monte Torc; e l'Upper Lake. Insieme occupano quasi un quarto del territorio.
      All'intorno svettano Mangerton, Torc, Shehy e Purple Mountain, da cui i boschi scendono fitti verso
      l'acqua.


      La ragione di tanta biodiversità affonda nella geologia: l'arenaria rossa devoniana incontra i calcari
      carboniferi. Ne derivano tre tipi di foresta: la cerreta acida su arenaria, la tasseta muscosa su
      calcare e l'ontaneta riparia lungo i laghi. È uno dei pochissimi siti irlandesi boscati
      ininterrottamente dall'ultima glaciazione di 10.000 anni fa, e i querceti costituiscono il lembo di
      bosco indigeno più vasto d'Irlanda. Il corbezzolo vi cresce spontaneo.


      Nel bosco di tassi di Reenadinna, incastonato tra Muckross Lake e Lough Leane, gli alberi hanno tra 200
      e 250 anni; è la più grande tasseta d'Europa occidentale. Tra le altre rarità figura la felce di
      Killarney, decimata nel XIX secolo dalla frenesia botanica vittoriana, oltre a endemismi lusitanici come
      la sassifraga reniforme e il cavolo di San Patrizio.
    wildlife: >-
      La fauna ruota intorno al [cervo nobile](/especie/cervus_elaphus/). All'inizio di giugno le femmine
      salgono nei valloni d'alta quota per partorire e i guardaparco marcano i cerbiatti. Ad agosto i maschi
      formano branchi separati e a ottobre scoppia il bramito: per settimane i grandi maschi difendono l'harem
      con parate di forza, bramiti e scontri di palchi. Il cervo sika, introdotto dal Giappone nel 1865, ha
      nel tempo moltiplicato la propria presenza.


      Tra gli altri elementi faunistici spicca l'alosa di Killarney (il goureen), endemica del Lough Leane. Un
      tricottero raro, Setodes argentipunctellus, sopravvive in Irlanda solo qui, mentre la smeralda boreale,
      la libellula più rara del paese, è ristretta a due torbiere del parco e vola da maggio a settembre. La
      [lontra europea](/especie/lutra_lutra/) perlustra le sponde all'alba. Nei cieli del Lough Leane è
      tornata a volare l'[aquila di mare](/especie/haliaeetus_albicilla/), estinta in Irlanda a inizio
      Novecento e felicemente reintrodotta.


      Sulle oltre 450 specie avicole irlandesi, più di 140 sono censite nel parco. A maggio 2023 tre cuculi di
      Killarney e uno del Burren sono stati dotati di trasmettitori satellitari.
    visit: >-
      Il parco si visita a piedi. Il Knockreer Circular Walk copre 5 km agevoli da Killarney House and Gardens
      con panorama sul Lough Leane e sui MacGillycuddy's Reeks. Il tracciato da Dundag a Torc regala viste sul
      Muckross Lake e sui pascoli dei cervi, portando alla cascata di Torc. Un anello cinge la penisola di
      Muckross tra querce, radure e la tasseta di Reenadinna, uno dei tre boschi di tasso più insigni
      d'Europa. Il Lakeside Walk segue la riva fino a Muckross House sfiorando l'abbazia, mentre il Mining
      Trail misura 3 km piani. La Old Kenmare Road attraversa le alture lungo il Kerry Way.


      Sull'acqua si effettuano gite in barca dalla Old Boat House e da Ross Castle verso l'isola di
      Innisfallen e la penisola di Dinis. Canoa e kayak sono consentiti previa autorizzazione e lavaggio
      scafi.


      Visite guidate si svolgono a Muckross House, Killarney House e Ross Castle.
    history: >-
      La tenuta di Muckross venne ceduta allo Stato nel 1932, fondando il primo parco nazionale d'Irlanda.
      L'attività mineraria ha origini antichissime: a Ross Island si estraeva rame nell'Età del Bronzo. Ross
      Castle, affacciato sul Lough Leane, è una casatorre del XV secolo eretta dal capoclan O'Donoghue Mór,
      mentre nel chiostro di Muckross Abbey vegeta un tasso secolare piantato alla fondazione dell'abbazia.


      Oggi riserva della biosfera e ZSC, il parco tutela la tasseta, la lumaca di Kerry, la margheritifera
      d'acqua dolce e la lampreda di mare. Il rododendro pontico infesta circa due terzi dei querceti,
      contrastato da un assiduo piano di eradicazione.
    before: >-
      A ottobre il bramito attira folti visitatori; l'afflusso è elevato a Muckross House e nel Gap of Dunloe.
      I cani vanno tenuti rigorosamente al guinzaglio e i fuochi sono vietati. Nelle giornate calde e umide i
      moscerini possono pungere, e fuori sentiero sussiste il rischio di zecche.
    around: >-
      Killarney non ha vicini diretti nell'atlante. Condivide tassete e cerrete secolari con il [Parco
      nazionale Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) (tasso, lontra e aquila
      reale), il [Parco nazionale di Monfragüe](/lugar/parque-nacional-de-monfrague/) (corbezzolo e aquila
      reale), il [Parco nazionale dell'Olimpo](/lugar/ethnikos-drymos-olympou/) e [Cheile
      Râmețului](/lugar/cheile-rametului/) (tasso e aquila reale).
  pt:
    intro: >-
      Existe na Irlanda uma manada de veados que habita estes vales desde o Neolítico. Todos os restantes
      veados do país descendem de animais reintroduzidos; a manada de Killarney é o derradeiro reduto da
      linhagem indígena. Este é igualmente o primeiro parque nacional da Irlanda, criado em 1932 aquando da
      doação ao Estado da herdade de Muckross. Entre os lagos de Killarney, no condado de Kerry, erguem-se
      montanhas de arenito, carvalhais caducifólios, amiais pantanosos e o mais imponente teixedo da Europa
      ocidental.
    landscape: >-
      Aqui convergem três paisagens distintas. No centro repousam os lagos de Killarney: Lough Leane, o maior,
      salpicado por mais de 30 ilhas; Muckross Lake, o mais fundo, atingindo 73,5 m de profundidade máxima
      junto ao sopé do monte Torc; e o Upper Lake. No seu conjunto ocupam quase um quarto do parque. Em redor
      elevam-se as montanhas Mangerton, Torc, Shehy e Purple, sob cujas encostas o bosque se estende até às
      margens lacustres.


      Esta variedade provém da geologia: o Arenito Vermelho Velho devoniano contacta com os calcários
      carboníferos. Daí brotam três matas distintas: o carvalhal ácido sobre arenito, o teixedo coberto de
      musgo sobre calcário e o amial húmido junto às águas. É dos raros sítios da Irlanda arborizados sem
      quebra desde a última glaciação há cerca de 10.000 anos, representando os carvalhais a maior mancha de
      floresta autóctone sobrevivente no país. O medronheiro marca presença constante nestas matas.


      No bosque de teixos de Reenadinna, entre Muckross Lake e Lough Leane, as árvores têm entre 200 e 250
      anos; é o maior povoamento de teixo da Europa ocidental. Outras preciosidades incluem o
      feto-de-killarney, fustigado no século XIX pela febre vitoriana dos fetos, além de endemismos
      lusitânicos como a saxifraga-reniforme e a couve-de-são-patrício.
    wildlife: >-
      A fauna gravita em torno do [veado-vermelho](/especie/cervus_elaphus/). No início de junho as fêmeas
      sobem às montanhas para parir e os guardas anilham as crias. Em agosto os machos separam-se em bandos e
      em outubro eclode a brama: ao longo de semanas defendem o harém com demonstrações de força, bramidos
      potentes, marchas paralelas e embates de hastes. O veado-sika, trazido do Japão em 1865, proliferou
      largamente desde então.


      Na restante fauna sobressai o sável-de-killarney (o goureen), peixe confinado ao Lough Leane. Um
      tricóptero raro, Setodes argentipunctellus, só sobrevive na Irlanda em Killarney, enquanto a
      libélula-esmeralda-boreal, a mais rara do país, se circunscreve a duas turfeiras do parque, voando de
      maio a setembro. A [lontra-europeia](/especie/lutra_lutra/) caça discretamente nas margens ao
      crepúsculo. Sobre o Lough Leane voltou a planar a [águia-rabalva](/especie/haliaeetus_albicilla/),
      extinta na Irlanda no dealbar do século XX até que um projeto pioneiro a restabeleceu.


      Das mais de 450 aves registadas na Irlanda, mais de 140 foram documentadas no parque. Em maio de 2023
      três cucos de Killarney e um de Burren foram equipados com emissores de satélite.
    visit: >-
      O parque percorre-se sobretudo a pé. O Knockreer Circular Walk estende-se por 5 km a partir de Killarney
      House and Gardens com vista sobre o Lough Leane e os montes MacGillycuddy's Reeks. O percurso de Dundag
      a Torc oferece vistas para Muckross Lake e pastagens povoadas por veados, culminando junto à cascata de
      Torc. Uma vereda contorna a península de Muckross entre carvalhais, clareiras e o teixedo de Reenadinna,
      um dos três bosques de teixo de referência na Europa. O Lakeside Walk acompanha a orla lacustre até
      Muckross House passando pela abadia, enquanto o Mining Trail perfaz 3 km planos. A Old Kenmare Road
      transpõe as terras altas integrando o Kerry Way.


      Nas águas realizam-se passeios de barco a partir da Old Boat House e de Ross Castle rumo a Innisfallen e
      à península de Dinis. É autorizada a canoagem mediante licença e desinfeção prévia.


      Realizam-se visitas guiadas em Muckross House, Killarney House e Ross Castle.
    history: >-
      A propriedade de Muckross foi doada ao Estado em 1932, instituindo o primeiro parque nacional da
      Irlanda. A exploração de cobre em Ross Island recua à Idade do Bronze. Ross Castle, junto ao lago, é uma
      torre medieval do século XV mandada edificar pelo chefe O'Donoghue Mór, crescendo no claustro de
      Muckross Abbey um teixo milenar.


      Atualmente reserva da biosfera e ZEC, o parque protege os teixedos, a lesma-de-kerry, o
      mexilhão-perlífero e a lampreia-marinha. O rododendro invasor coloniza cerca de dois terços dos
      carvalhais, decorrendo ações sistemáticas para a sua erradicação.
    before: >-
      Outubro é a época da brama; a afluência de visitantes é alta junto a Muckross House e no desfiladeiro de
      Dunloe. Os cães devem andar com trela curta e é proibido atear fogueiras. Em dias quentes e húmidos
      proliferam mosquitos-pólvora, existindo carraças fora dos trilhos.
    around: >-
      Killarney não possui vizinhos contíguos no atlas. Partilha florestas relíquias de teixo e carvalhos com
      o [Parque Nacional Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) (teixo, lontra e
      águia-real), o [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) (medronheiro e
      águia-real), o [Parque Nacional do Olimpo](/lugar/ethnikos-drymos-olympou/) e [Cheile
      Râmețului](/lugar/cheile-rametului/) (teixo e águia-real).
