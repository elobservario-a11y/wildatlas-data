resumen:
  es: >-
    El Parque Nacional más extenso de Finlandia (2.860 km²), valles fluviales salvajes de taiga primigenia y
    el legendario río de oro de Lemmenjoki.
  en: >-
    The largest national park in Finland (2,860 km²), wild river valleys of primeval taiga and the legendary
    gold-bearing Lemmenjoki river.
  fr: >-
    Le plus grand parc national de Finlande (2 860 km²), de sauvages vallées fluviales de taïga originelle et
    la légendaire rivière aurifère de Lemmenjoki.
  de: >-
    Finnlands größter Nationalpark (2.860 km²), wilde Flusstäler der Ur-Taiga und der legendäre Goldfluss
    Lemmenjoki.
  it: >-
    Il parco nazionale più esteso della Finlandia (2.860 km²), selvagge vallate fluviali di taiga primigenia e
    il leggendario fiume aurifero Lemmenjoki.
  pt: >-
    O maior parque nacional da Finlândia (2860 km²), vales fluviais selvagens de taiga primordial e o lendário
    rio de ouro de Lemmenjoki.
unico:
  es: >-
    Es el valle del río del oro, donde bosques de pino, turberas aapa y tradición sami se encuentran en el
    mayor parque nacional de Finlandia.
  en: >-
    It is the valley of the river of gold, where pine forests, aapa mires and Sámi heritage converge in
    Finland's largest national park.
  fr: >-
    C'est la vallée de la rivière de l'or, où pinèdes, tourbières aapa et traditions sâmes se rencontrent dans
    le plus vaste parc national de Finlande.
  de: >-
    Es ist das Tal des Goldflusses, in dem Kiefernurwälder, Aapa-Moore und samische Traditionen im größten
    Nationalpark Finnlands aufeinandertreffen.
  it: >-
    È la valle del fiume dell'oro, dove pinete, torbiere aapa e tradizioni sami si incontrano nel parco
    nazionale più grande della Finlandia.
  pt: >-
    É o vale do rio do ouro, onde pinhais, turfeiras aapa e tradições sami se encontram no maior parque
    nacional da Finlândia.
observaciones:
  es: >-
    Se puede caminar, ir en raquetas, esquiar, remar y navegar en canoa por el parque, salvo en la zona
    restringida de Ravadasköngäs, donde solo se puede ir por los senderos marcados. En el valle del Lemmenjoki
    entre Njurkulahti y Kultahamina solo se puede acampar junto a las áreas de descanso, hogueras y cabañas
    marcadas.


    La cobertura móvil varía y en el valle del río no hay señal. No cuentes con el teléfono. La temporada para
    ir es de junio a septiembre.
texto:
  es:
    intro: >-
      Puedes pasar días sin cruzarte con otra persona. Eso es Lemmenjoki: el mayor parque nacional de
      Finlandia, con 2.858 km² de fells sin árboles, bosques antiguos y turberas, en el corazón de Sápmi, el
      territorio de los sami. Quien se aparta de los senderos marcados puede disfrutar de paz y soledad
      durante semanas.
    landscape: >-
      El terreno va de valles fluviales exuberantes a bosques viejos y fells abiertos, y la vegetación cambia
      con la altura. Subir por un fell es atravesar zonas de vegetación: el pino es el primero en llegar a su
      límite, a unos 300 o 400 m de altitud, y el abedul marca el último límite del bosque. En el extremo sur,
      en Kittilä, el abeto marca el límite del bosque en algunas colinas, pero en cuanto entras en Inari el
      bosque es ya de pinos y abedules.


      Entre los fells, los valles son más exuberantes. Una de las abedulares más espectaculares está en
      Kultasatama, en la cabecera del Lemmenjoki, y casi compite en frondosidad con los del sur de Finlandia.
      Más al sur, casi una cuarta parte del parque son turberas: las mayores, como Naskama-aapa y Sallivuoma,
      están en la parte menos visitada.


      El agua organiza todo. El río Lemmenjoki, que da nombre al parque, mide 80 km, y las cabeceras de los
      sistemas del Tana y del Pasvik llegan hasta aquí. La cascada de Ravadasköngäs y la garganta que la
      precede fueron esculpidas en parte por el agua de deshielo de la Edad de Hielo, y el río sigue
      trabajando hoy.
    wildlife: >-
      Este es el reino del [glotón](/especie/gulo_gulo/), emblema del parque. Con suerte verás sus rastros o
      los del [oso pardo](/especie/ursus_arctos/), aunque puedes ir días sin encontrarte con otra persona y
      sin verlos a ellos. Las aguas, claras y pobres en nutrientes, albergan solo nueve especies de peces en
      el Lemmenjoki, entre ellas el [salmón](/especie/salmo_salar/) y la perca.


      Las turberas son un refugio para muchas aves, y el parque es una de las zonas de nidificación más
      importantes de varias aves de turbera por las que Finlandia tiene una responsabilidad especial según las
      directivas europeas. Entre las más comunes están la lavandera boyera, la agachadiza común y la cerceta
      común. En los bosques de ribera ricos en hierbas, se oye por ejemplo el mosquitero boreal.


      El calendario manda. La temporada alta va de finales de junio a finales de septiembre, y en el parque la
      mayoría de visitantes llegan en verano. En invierno, durante más de seis meses al año Lemmenjoki es el
      reino del esquí de travesía.
    visit: >-
      Se recorre a pie, en barco o en canoa. El valle del Lemmenjoki es un tramo de 22 km entre Njurkulahti y
      Kultasatama, con barcos regulares en verano y un sendero marcado en la orilla. Desde Njurkulahti,
      Joenkielinen es un fell a unos 9 km con sendero marcado y buena vista sobre el valle.


      Fuera de ese eje, la mayor parte del parque es territorio silvestre donde puedes elegir tu propio
      recorrido. Hay opciones desde un sendero de naturaleza hasta varias semanas de travesía, pero para los
      tramos más salvajes se necesitan buenas habilidades: hay pocas cabañas abiertas y no hay infraestructura
      de ruta. En total hay unos 60 km de senderos marcados, algunos puentes y barcas, más de diez cabañas
      libres y tres de pago con reserva.


      Otra opción es la Ruta del Oro, que cruza la zona de buscadores de oro; de Kultasatama a Ravadasjärvi
      hay 20 km de sendero marcado, y su señalización explica métodos de prospección, leyendas y geología.
      Para la historia sami, un sendero marcado de 6 km sale del río Repojoki, junto a la carretera
      Inari-Kittilä, hasta el recinto tradicional de renos de Sallivaara; ida y vuelta son 12 km.


      Para el agua, la ruta en canoa desde Muddusjärvi o Solojärvi hasta Njurkulahti y Kultahamina es una
      opción sencilla para iniciarse. Quienes tienen más experiencia pueden remar por los ríos Vaskojoki,
      Kietsimäjoki, Ivalojoki y Repojoki.
    history: >-
      Las huellas humanas más antiguas son cientos de trampas-foso para cazar renos salvajes, de la Edad de
      Piedra y la del Hierro: uno de los mayores sistemas de Finlandia está aquí. Mucho después, el cierre de
      la frontera entre Finlandia y Noruega en 1852 detuvo las migraciones tradicionales de los pastores de
      [renos](/especie/rangifer_tarandus/) entre la costa noruega y los bosques finlandeses. El cercado de
      Sallivaara, construido en los años treinta, es hoy un importante sitio de patrimonio cultural del
      parque. Y la casa de Kaapin Jouni, en Njurkulahti, es una antigua vivienda de pastor de renos importante
      para los sami.


      Después llegó el oro. En 1945 los Ranttila hallaron oro en Morgamoja y empezó la fiebre del oro de
      Lemmenjoki; en los años cincuenta había casi cien concesiones activas. El parque se estableció en 1956
      para proteger los bosques bien conservados y el hermoso valle, se amplió en 1971 y alcanzó su tamaño
      actual en 1981. A finales de los ochenta y principios de los noventa la minería mecánica enturbiaba las
      aguas río abajo y generó un conflicto entre los buscadores y el parque. En 2020 se prohibió la minería
      mecanizada del oro: hoy solo se permiten métodos manuales como el bateo y la pala.
    before: >-
      Se puede caminar, ir en raquetas, esquiar, remar y navegar en canoa por el parque, salvo en la zona
      restringida de Ravadasköngäs, donde solo se puede ir por los senderos marcados. En el valle del
      Lemmenjoki entre Njurkulahti y Kultahamina solo se puede acampar junto a las áreas de descanso, hogueras
      y cabañas marcadas.


      La cobertura móvil varía y en el valle del río no hay señal. No cuentes con el teléfono. La temporada
      para ir es de junio a septiembre.
    around: >-
      Lemmenjoki no tiene vecinos cercanos en el atlas, pero comparte reno y águila real con otros grandes
      espacios nórdicos. El [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) comparte con
      él el reno, el águila real y el oso pardo, y el [Parque Nacional
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) el reno y el oso pardo. Más lejos, la
      [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) y el [Parque Nacional de Stora
      Sjöfallet](/lugar/stora-sjofallet-national-park/) comparten el reno y el águila real.
  en:
    intro: >-
      You can hike for days without crossing paths with another soul. That is Lemmenjoki: Finland's largest
      national park, spanning 2,858 km² of treeless fells, ancient pine woods and sweeping peatlands in the
      heart of Sápmi, the homeland of the Sámi people. Those stepping off the marked paths can immerse
      themselves in unbroken solitude and wilderness for weeks on end.
    landscape: >-
      The terrain transitions from lush river gorges to old-growth taiga and windswept fells, its vegetation
      distinctly stratified by altitude. Ascending a fell takes you through classic arctic life zones: Scots
      pine is the first to reach its ecological limit, at around 300 or 400 m above sea level, with mountain
      birch defining the ultimate tree line. In the far south, in Kittilä, spruce crowns occasional hills, but
      upon entering Inari the forest resolves into pure pine and birch.


      Tucked between the fells, sheltered river valleys are remarkably verdant. One of the most lush birch
      stands flourishes at Kultasatama at the headwaters of the Lemmenjoki, rivaling southern Finnish woods in
      vigour. Further south, nearly a quarter of the park consists of aapa mires: the most vast, such as
      Naskama-aapa and Sallivuoma, lie in the most remote, seldom-trodden backcountry.


      Water carves and governs the wilderness. The Lemmenjoki river, lending the park its name, flows for 80
      km, and headwaters of the great Tana and Pasvik drainage basins rise right here. The dramatic
      Ravadasköngäs waterfall and its approach canyon were carved in part by torrential glacial meltwaters of
      the Ice Age, a sculpting process the river continues today.
    wildlife: >-
      This vast expanse is the stronghold of the [Wolverine](/especie/gulo_gulo/), the park's iconic emblem.
      With luck you may detect its tracks or those of the [Brown bear](/especie/ursus_arctos/), though you can
      travel for days on end without meeting another person or catching sight of either predator. The clear,
      nutrient-poor waters sustain only nine fish species in the Lemmenjoki, notable among them the [Atlantic
      salmon](/especie/salmo_salar/) and European perch.


      The mires provide vital sanctuaries for waterfowl and waders, with the park serving as one of northern
      Europe's premier breeding grounds for peatland species for which Finland bears special international
      conservation responsibility. Widespread nesters include the western yellow wagtail, common snipe and
      Eurasian teal. Along herb-rich riverbank alder woods, the arctic warbler can be heard singing in summer.


      The seasons govern all visitation. The peak window runs from late June through late September, when the
      majority of visitors experience the park. In winter, for more than six months of the year, Lemmenjoki
      transforms into an untouched realm for wilderness ski touring.
    visit: >-
      The park is explored on foot, by riverboat or in a canoe. The Lemmenjoki valley forms a 22 km river
      corridor between Njurkulahti and Kultasatama, serviced by scheduled wooden riverboats in summer and
      paralleled by a marked shore path. From Njurkulahti, the fell Joenkielinen rises some 9 km away along a
      marked trail, offering sweeping panoramas across the taiga valley.


      Beyond this river axis, most of the park remains trackless wilderness where you chart your own course.
      Treks range from short nature loop walks to multi-week self-supported expeditions, demanding robust
      navigational skills: open wilderness huts are sparse and waymarking is absent. In total, the park
      maintains around 60 km of marked trails, several footbridges and river-crossing rowboats, more than ten
      open wilderness huts and three reservable huts.


      Another historic option is the Gold Trail, tracing active and historic placer mining grounds; from
      Kultasatama to Ravadasjärvi runs a 20 km marked trail with interpretive boards recounting prospecting
      techniques, lore and geology. For Sámi cultural history, a marked 6 km trail leads from the Repojoki
      river off the Inari–Kittilä road to the historic reindeer round-up site of Sallivaara; the round trip is
      12 km.


      For water lovers, the canoe route from Muddusjärvi or Solojärvi to Njurkulahti and Kultahamina offers a
      straightforward entry into paddling. Experienced canoeists can navigate the more challenging wilderness
      rapids of the Vaskojoki, Kietsimäjoki, Ivalojoki and Repojoki.
    history: >-
      The oldest human traces consist of hundreds of prehistoric pit-trap systems used to hunt wild forest
      reindeer, dating to the Stone and Iron Ages: one of the largest pit networks in Finland is preserved
      here. Centuries later, the closure of the Finland–Norway border in 1852 severed the traditional nomadic
      migrations of Sámi pastoralists herding [reindeer](/especie/rangifer_tarandus/) between the Arctic coast
      and inland taiga. The historic round-up corral of Sallivaara, constructed in the nineteen thirties,
      stands as a premier cultural landmark. At Njurkulahti, the preserved Kaapin Jouni homestead commemorates
      a legendary Sámi reindeer pastoralist family.


      Then came the gold. In 1945 the Ranttila brothers discovered gold along the Morgamoja brook, triggering
      the legendary Lemmenjoki gold rush; by the nineteen fifties nearly a hundred active placer claims were
      worked. The national park was created in 1956 to preserve pristine boreal woodlands and the wild canyon
      valley, expanded in 1971 and reaching its present dimensions in 1981. In the late nineteen eighties and
      early nineteen nineties mechanized gold mining muddied downstream waters, sparking decades of
      controversy. In 2020 mechanized extraction was permanently outlawed: today only traditional artisanal
      panning with shovel and pan is permitted.
    before: >-
      You are free to hike, snowshoe, ski, row and paddle throughout the park, except within the restricted
      nature sanctuary of Ravadasköngäs, where you must keep strictly to marked trails. In the Lemmenjoki
      river corridor between Njurkulahti and Kultahamina camping is only allowed at designated rest areas,
      campfire sites and huts.


      Mobile phone coverage is patchy and completely absent within the deep river canyons. Never rely on a
      phone. The main trekking season extends from June to September.
    around: >-
      Lemmenjoki has no immediate neighbours in the atlas, yet it shares reindeer and golden eagles with other
      vast arctic reserves. [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) shares
      reindeer, golden eagles and brown bears, and [Parque Nacional
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) shares reindeer and brown bears. Further
      south across Scandinavia, [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) and
      [Parque Nacional de Stora Sjöfallet](/lugar/stora-sjofallet-national-park/) share reindeer and golden
      eagles.
  fr:
    intro: >-
      Vous pouvez marcher des jours entiers sans croiser la moindre âme qui vive. Tel est Lemmenjoki : le plus
      vaste parc national de Finlande, déployant 2 858 km² de fells dénudés, de forêts primaires et de
      tourbières au cœur du Sápmi, la terre des Sâmes. Quiconque quitte les sentiers balisés peut goûter à une
      solitude et à une sérénité absolues pendant des semaines.
    landscape: >-
      Le relief s'échelonne des vallées fluviales luxuriantes aux forêts séculaires et aux fells dénudés, avec
      une végétation étagée par l'altitude. Gravir un fell revient à traverser plusieurs ceintures végétales :
      le pin sylvestre est le premier à atteindre sa limite vers 300 ou 400 m d'altitude, tandis que le
      bouleau pubescent marque la limite ultime des arbres. À l'extrémité sud, vers Kittilä, l'épicéa couronne
      quelques collines, mais dès l'entrée dans l'Inari la forêt n'est plus faite que de pins et de bouleaux.


      Nichées entre les fells, les vallées sont bien plus luxuriantes. L'une des bétulaies les plus
      spectaculaires prospère à Kultasatama, à la source du Lemmenjoki, rivalisant de verdure avec les bois du
      sud de la Finlande. Plus au sud, près d'un quart du parc est constitué de tourbières aapa : les plus
      monumentales, comme Naskama-aapa et Sallivuoma, s'étendent dans la partie la moins visitée.


      L'eau dicte chaque recoin du paysage. La rivière Lemmenjoki, qui donne son nom au parc, s'étire sur 80
      km, et les cours supérieurs des réseaux du Tana et du Pasvik prennent leur source ici. La cascade de
      Ravadasköngäs et sa gorge d'accès ont été taillées pour partie par les torrents de fonte de la
      glaciation, travail que la rivière poursuit encore aujourd'hui.
    wildlife: >-
      C'est le royaume du [Glouton](/especie/gulo_gulo/), emblème du parc national. Avec un peu de chance,
      vous relèverez ses empreintes ou celles de l'[Ours brun](/especie/ursus_arctos/), bien que l'on puisse
      cheminer des jours sans rencontrer personne et sans les apercevoir. Les eaux, cristallines et
      oligotrophes, n'abritent que neuf espèces de poissons dans le Lemmenjoki, parmi lesquelles le [Saumon
      atlantique](/especie/salmo_salar/) et la perche.


      Les tourbières offrent un havre précieux pour de nombreux oiseaux, et le parc constitue l'une des aires
      de nidification les plus remarquables pour les espèces palustres au titre desquelles la Finlande porte
      une responsabilité particulière selon les directives européennes. Parmi les plus courantes figurent la
      bergeronnette printanière, la bécassine des marais et la sarcelle d'hiver. Dans les boisements alluviaux
      humides, vous entendrez chanter le pouillot boréal.


      Le climat dicte le rythme des séjours. La haute saison s'étend de la fin juin à la fin septembre,
      période où se concentre l'essentiel des visiteurs. En hiver, pendant plus de six mois par an, Lemmenjoki
      devient le paradis du ski de randonnée nordique.
    visit: >-
      On le parcourt à pied, en barque fluviale ou en canoë. La vallée du Lemmenjoki forme un tronçon de 22 km
      entre Njurkulahti et Kultasatama, desservi par des bateaux réguliers en été et longé par un sentier
      balisé. Depuis Njurkulahti, le fell Joenkielinen s'atteint en environ 9 km de sentier balisé offrant un
      vaste panorama sur la vallée.


      En dehors de cet axe principal, la quasi-totalité du parc est une vaste étendue sauvage où vous tracez
      votre propre itinéraire. Les possibilités vont de la courte boucle naturaliste à des traversées de
      plusieurs semaines en totale autonomie, exigeant une solide expérience de l'orientation : les cabanes
      ouvertes sont rares et tout balisage disparaît. Au total, le parc compte environ 60 km de chemins
      balisés, quelques passerelles et barques de passage, plus de dix cabanes libres et trois refuges payants
      sur réservation.


      Une autre option est la Route de l'Or, qui traverse la zone des orpailleurs : de Kultasatama à
      Ravadasjärvi court un sentier balisé de 20 km jalonné de panneaux sur les techniques de prospection, les
      légendes et la géologie. Pour découvrir l'histoire sâme, un sentier balisé de 6 km part de la rivière
      Repojoki, près de la route Inari–Kittilä, jusqu'au corral historique de rassemblement des rennes de
      Sallivaara ; l'aller-retour totalise 12 km.


      Sur l'eau, le parcours en canoë de Muddusjärvi ou Solojärvi jusqu'à Njurkulahti et Kultahamina offre une
      initiation accessible. Les pagayeurs chevronnés peuvent quant à eux descendre les rivières Vaskojoki,
      Kietsimäjoki, Ivalojoki et Repojoki.
    history: >-
      Les vestiges humains les plus anciens sont des centaines de fosses-pièges pour la chasse aux rennes
      sauvages, remontant à l'âge de la pierre et à l'âge du fer : l'un des plus vastes ensembles de Finlande
      se trouve ici. Bien plus tard, la fermeture de la frontière entre la Finlande et la Norvège en 1852
      interrompit les transhumances traditionnelles des éleveurs de [rennes](/especie/rangifer_tarandus/)
      entre le littoral norvégien et les forêts finlandaises. Le grand enclos de Sallivaara, bâti dans les
      années trente, constitue un site patrimonial majeur du parc. À Njurkulahti, la ferme historique de
      Kaapin Jouni témoigne du mode de vie traditionnel des éleveurs sâmes.


      Puis vint l'or. En 1945, les frères Ranttila trouvèrent de l'or à Morgamoja, déclenchant la ruée vers
      l'or du Lemmenjoki ; dans les années cinquante, on dénombrait près de cent concessions en activité. Le
      parc fut créé en 1956 pour préserver ces forêts remarquables et la vallée, agrandi en 1971 pour
      atteindre sa superficie actuelle en 1981. À la fin des années quatre-vingt et au début des années
      quatre-vingt-dix, l'extraction mécanisée troublait les eaux en aval, générant un conflit prolongé. En
      2020, l'orpaillage mécanisé a été définitivement banni : seuls restent autorisés les procédés manuels à
      la bâtée et à la pelle.
    before: >-
      La marche, les raquettes, le ski, l'aviron et le canoë sont autorisés dans le parc, sauf dans la réserve
      intégrale de Ravadasköngäs où il est obligatoire de ne pas quitter les sentiers balisés. Dans la vallée
      du Lemmenjoki entre Njurkulahti et Kultahamina, vous ne pouvez bivouaquer qu'auprès des aires de repos,
      foyers et cabanes désignés.


      La couverture mobile est aléatoire et totalement absente au fond des vallées. Ne comptez pas sur votre
      téléphone. La saison propice s'étend de juin à septembre.
    around: >-
      Lemmenjoki n'a pas de voisins immédiats dans l'atlas, mais partage le renne et l'aigle royal avec
      d'autres grands sanctuaires nordiques. Le [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) a en commun le renne, l'aigle royal et l'ours brun, tout
      comme le [Parque Nacional Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) pour le renne
      et l'ours brun. Plus au sud, la [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/)
      et le [Parque Nacional de Stora Sjöfallet](/lugar/stora-sjofallet-national-park/) partagent le renne et
      l'aigle royal.
  de:
    intro: >-
      Du kannst tagelang wandern, ohne einer Menschenseele zu begegnen. Das ist Lemmenjoki: Finnlands größter
      Nationalpark mit 2.858 km² baumloser Fjellweiten, alter Wälder und Moore im Herzen von Sápmi, dem Land
      der Samen. Wer die markierten Pfade verlässt, kann wochenlang ungestörte Ruhe und Einsamkeit erleben.
    landscape: >-
      Das Gelände reicht von üppigen Flusstälern bis zu alten Taigawäldern und offenen Fjells, wobei sich die
      Vegetation mit der Höhe wandelt. Ein Aufstieg auf einen Fjell führt durch typische Vegetationsstufen:
      Die Waldkiefer erreicht als erste ihre Grenze in etwa 300 bis 400 m Höhe, während die Moorbirke die
      äußerste Waldgrenze markiert. Im äußersten Süden bei Kittilä bildet die Fichte an einigen Hängen die
      Waldgrenze, doch sobald du Inari erreichst, besteht der Wald nur noch aus Kiefern und Birken.


      Eingebettet zwischen den Fjells präsentieren sich die Täler erstaunlich grün. Einer der dichtesten
      Birkenwälder gedeiht in Kultasatama am Oberlauf des Lemmenjoki und steht südfinnischen Wäldern an
      Wuchskraft kaum nach. Weiter südlich macht Aapa-Moor fast ein Viertel des Parks aus: Die gewaltigsten
      Moore wie Naskama-aapa und Sallivuoma liegen im am wenigsten besuchten Südteil.


      Das Wasser prägt das gesamte Gebilde. Der Fluss Lemmenjoki, der dem Park seinen Namen leiht, misst 80 km
      Länge, und hier entspringen die Quellbäche der Tana- und Pasvik-Flusssysteme. Der Wasserfall
      Ravadasköngäs und die vorgelagerte Schlucht wurden einst vom Schmelzwasser der Eiszeit geformt, und der
      Fluss arbeitet bis heute an seinem Bett.
    wildlife: >-
      Dies ist das Kerngebiet des [Vielfraß](/especie/gulo_gulo/)es, des Wappentiers des Parks. Mit Glück
      siehst du seine Spuren oder jene des [Braunbär](/especie/ursus_arctos/)en, wenngleich du tagelang
      unterwegs sein kannst, ohne Menschen oder Großraubtiere zu erblicken. Die klaren, nährstoffarmen
      Gewässer des Lemmenjoki beherbergen lediglich neun Fischarten, darunter den [Atlantischer
      Lachs](/especie/salmo_salar/) und den Flussbarsch.


      Die Moore dienen vielen Vögeln als Zuflucht, und der Park zählt zu den herausragenden Brutgebieten für
      Moorvögel, für die Finnland nach europäischen Richtlinien eine besondere Schutzverantwortung trägt. Zu
      den häufigsten Arten gehören Schafstelze, Bekassine und Krickente. In krautreichen Uferwäldern lässt
      sich im Sommer der Nordische Laubsänger vernehmen.


      Die Jahreszeiten bestimmen den Rhythmus. Die Hauptsaison dauert von Ende Juni bis Ende September, wenn
      der überwiegende Teil der Gäste eintrifft. Im Winter verwandelt sich Lemmenjoki für mehr als sechs
      Monate in ein unberührtes Revier für mehrtägige Skiwanderungen.
    visit: >-
      Der Park wird zu Fuß, im traditionellen Holzboot oder im Kanu erkundet. Das Lemmenjoki-Tal bildet einen
      22 km langen Flusskorridor zwischen Njurkulahti und Kultasatama, der im Sommer mit Ausflugsbooten
      befahren wird und von einem markierten Uferpfad begleitet wird. Von Njurkulahti aus erreichst du nach
      rund 9 km markiertem Weg den Fjell Joenkielinen mit herrlichem Weitblick über das Flusstal.


      Außerhalb dieses Flusskorridors erstreckt sich weglose Wildnis, in der du deine Route frei wählst. Das
      Spektrum reicht von kurzen Naturlehrpfaden bis zu mehrwöchigen Wildnistouren, die Orientierungsvermögen
      erfordern: Offene Schutzhütten sind spärlich gesät und Markierungen fehlen. Insgesamt gibt es im Park
      rund 60 km markierte Wanderwege, Hängebrücken, Übersetzboote, mehr als zehn offene Wildnishütten und
      drei reservierbare Miethütten.


      Eine weitere Möglichkeit bietet der Goldgräberweg durch die historischen Seifengebiete: Von Kultasatama
      nach Ravadasjärvi führt ein 20 km langer markierter Lehrpfad zu Schürfmethoden, Sagen und Geologie. Zur
      samischen Geschichte führt ein markierter 6 km langer Weg vom Repojoki an der Straße Inari–Kittilä zur
      historischen Rentierscheideanlage Sallivaara; hin und zurück sind es 12 km.


      Auf dem Wasserweg ist die Kanustrecke von Muddusjärvi oder Solojärvi nach Njurkulahti und Kultahamina
      ein idealer Einstieg. Erfahrene Paddler befahren die Wildflüsse Vaskojoki, Kietsimäjoki, Ivalojoki und
      Repojoki.
    history: >-
      Die ältesten Spuren menschlicher Nutzung sind hunderte Fanggruben zur Jagd auf wilde Waldrentiere aus
      der Stein- und Eisenzeit: Eines der größten Fallengrubensysteme Finnlands befindet sich hier.
      Jahrhunderte später unterbrach die Schließung der Grenze zwischen Finnland und Norwegen im Jahr 1852 die
      traditionellen Wanderungen der Rentierhirten, die ihre [Ren](/especie/rangifer_tarandus/)tiere zwischen
      Eismeerküste und Taiga führten. Das historische Rentiergehege von Sallivaara aus den dreißiger Jahren
      ist heute ein bedeutendes Kulturdenkmal. Bei Njurkulahti erinnert der alte Hof Kaapin Jouni an eine
      traditionsreiche samische Hirtenfamilie.


      Dann kam das Gold. 1945 fanden die Ranttila-Brüder am Morgamoja Gold und lösten den
      Lemmenjoki-Goldrausch aus; in den fünfziger Jahren bestanden fast einhundert aktive Schürfgründe. Der
      Park wurde 1956 gegründet, um die Wälder und das Tal zu schützen, 1971 vergrößert und erreichte 1981
      seine heutige Ausdehnung. Ende der achtziger und Anfang der neunziger Jahre trübte mechanischer Abbau
      die Flussläufe und führte zu Spannungen. Im Jahr 2020 wurde der Maschineneinsatz endgültig verboten:
      Heute ist nur noch das traditionelle manuelle Waschen mit Pfanne und Schaufel erlaubt.
    before: >-
      Wandern, Schneeschuhgehen, Skilaufen, Rudern und Kanufahren sind im Park überall gestattet, außer im
      strengen Schutzgebiet Ravadasköngäs, wo du auf den markierten Wegen bleiben musst. Im Lemmenjoki-Tal
      zwischen Njurkulahti und Kultahamina darfst du nur an den offiziellen Rastplätzen, Feuerstellen und
      Hütten zelten.


      Der Mobilfunkempfang ist lückenhaft und in den tiefen Tälern völlig abwesend. Verlasse dich nicht auf
      das Telefon. Die beste Besuchszeit reicht von Juni bis September.
    around: >-
      Lemmenjoki hat im Atlas keine direkten Nachbarn, teilt aber Ren und Steinadler mit anderen nordischen
      Großschutzgebieten. Der [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) teilt
      Rentier, Steinadler und Braunbär, ebenso wie der [Parque Nacional
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) Rentier und Braunbär beherbergt. Weiter
      südlich in Skandinavien teilen das [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) und der [Parque Nacional de Stora
      Sjöfallet](/lugar/stora-sjofallet-national-park/) Rentier und Steinadler.
  it:
    intro: >-
      Puoi camminare per giorni interi senza scorgere alcun altro essere umano. Questo è Lemmenjoki: il parco
      nazionale più grande della Finlandia, con 2.858 km² di fell spogli, foreste primigenie e torbiere nel
      cuore del Sápmi, la terra ancestrale dei sami. Chi si allontana dai sentieri tracciati può godere di
      pace e solitudine assoluta per intere settimane.
    landscape: >-
      Il paesaggio spazia da gole fluviali verdeggianti a foreste secolari e rilievi aperti, con una netta
      differenziazione altitudinale della flora. Salire su un fell significa attraversare fasce vegetazionali
      distinte: il pino silvestre tocca per primo il limite di crescita attorno a 300 o 400 m di altitudine,
      mentre la betulla artica segna l'estremo confine della foresta. All'estremità meridionale, verso
      Kittilä, l'abete rosso incorona alcune alture, ma non appena si entra a Inari il manto boschivo si
      compone unicamente di pini e betulle.


      Incastonate tra i rilievi, le valli presentano una lussureggiante vegetazione. Uno dei boschi di betulle
      più maestosi sorge a Kultasatama, alla testata del Lemmenjoki, rivaleggiando in densità con le boscaglie
      della Finlandia meridionale. Più a sud, quasi un quarto del territorio è coperto da torbiere aapa: le
      maggiori, quali Naskama-aapa e Sallivuoma, giacciono nel settore più appartato e inviolato.


      L'acqua modella ogni aspetto dell'ambiente. Il fiume Lemmenjoki, che dà nome al parco, si snoda per 80
      km, e qui hanno origine i bacini sorgentizi del Tana e del Pasvik. La cascata di Ravadasköngäs e
      l'orrido che la precede furono incisi in parte dalle acque di fusione dell'era glaciale, opera che la
      corrente continua a plasmare tuttora.
    wildlife: >-
      Questo è il feudo del [Ghiottone](/especie/gulo_gulo/), emblema del parco. Con un po' di fortuna ne
      scorgerai le tracce, oppure quelle dell'[Orso bruno](/especie/ursus_arctos/), benché si possa camminare
      per giorni senza incrociare persone né avvistare questi predatori. Le acque, limpidissime e oligotrofe,
      accolgono appena nove specie ittiche nel Lemmenjoki, tra cui il [salmone
      atlantico](/especie/salmo_salar/) e il persico reale.


      Le torbiere fungono da rifugio vitale per l'avifauna, e il parco è una delle aree di riproduzione
      primarie per diverse specie palustri per le quali la Finlandia detiene una responsabilità
      conservazionistica specifica nell'ambito delle direttive europee. Tra le più diffuse compaiono la
      cutrettola, il beccaccino e l'alzavola. Nei boschetti ripariali ricchi di erbe si può udire il canto del
      luì boreale.


      Le stagioni scandiscono la frequentazione. Il picco dei visitatori si concentra da fine giugno a fine
      settembre. In inverno, per oltre sei mesi all'anno, Lemmenjoki si trasforma nel regno inviolato dello
      sci escursionistico.
    visit: >-
      Il parco si visita a piedi, a bordo delle tradizionali imbarcazioni fluviali o in canoa. La valle del
      Lemmenjoki costituisce un corridoio di 22 km tra Njurkulahti e Kultasatama, servito in estate da
      regolari barche in legno e affiancato da un sentiero segnato. Da Njurkulahti, il fell Joenkielinen dista
      circa 9 km su sentiero marcato, offrendo una magnifica veduta panoramica sulla vallata.


      Al di fuori di quest'asse, la maggior parte del parco è un territorio selvaggio dove puoi scegliere
      liberamente la tua rotta. Le opzioni spaziano da brevi anelli didattici a traversate di varie settimane,
      ma per i settori più remoti sono richieste eccellenti doti di orientamento: i bivacchi aperti sono pochi
      e la segnaletica è assente. Nel complesso si contano circa 60 km di sentieri segnati, alcuni ponti
      sospesi, barche a remi per traversate fluviali, più di dieci rifugi aperti gratuiti e tre capanne
      prenotabili.


      Un'altra meta classica è la Via dell'Oro, che attraversa i vecchi campi dei cercatori d'oro: da
      Kultasatama a Ravadasjärvi corre un sentiero segnato di 20 km corredato da pannelli esplicativi su
      tecniche, miti e geologia. Per la storia sami, un sentiero di 6 km parte dal fiume Repojoki, lungo la
      strada Inari-Kittilä, conducendo all'antico recinto di raduno delle renne di Sallivaara; andata e
      ritorno misurano 12 km.


      Per le vie d'acqua, la discesa in canoa da Muddusjärvi o Solojärvi verso Njurkulahti e Kultahamina
      rappresenta un itinerario agevole per iniziare. I canoisti più esperti possono invece pagaiare lungo i
      corsi più impervi dei fiumi Vaskojoki, Kietsimäjoki, Ivalojoki e Repojoki.
    history: >-
      I segni antropici più arcaici consistono in centinaia di buche-trappola per la caccia alle renne
      selvatiche, risalenti all'età della pietra e del ferro: uno dei sistemi più estesi della Finlandia sorge
      proprio qui. Molto tempo dopo, la chiusura del confine tra Finlandia e Norvegia nel 1852 interruppe le
      secolari transumanze dei pastori di [renne](/especie/rangifer_tarandus/) tra le coste artiche norvegesi
      e le foreste interne. Il recinto storico di Sallivaara, eretto negli anni trenta, rappresenta una delle
      massime testimonianze culturali del parco. A Njurkulahti, la fattoria storica di Kaapin Jouni custodisce
      la memoria di un celebre nucleo familiare sami.


      Successivamente comparve l'oro. Nel 1945 i fratelli Ranttila rinvennero pagliuzze d'oro lungo il
      Morgamoja scatenando la corsa all'oro di Lemmenjoki; negli anni cinquanta operavano quasi cento
      concessioni minerarie. Il parco fu istituito nel 1956 per salvaguardare le foreste intatte e la vallata,
      ampliato nel 1971 e giunto ai confini odierni nel 1981. Tra la fine degli anni ottanta e l'inizio dei
      novanta l'estrazione meccanizzata intorbidì i corsi d'acqua a valle provocando forti attriti. Nel 2020
      le draghe a motore sono state definitivamente vietate: oggi sono ammessi esclusivamente i metodi
      tradizionali con piatto e pala.
    before: >-
      Puoi camminare, procedere con le ciaspole, sciare e navigare liberamente in canoa nel parco, ad
      eccezione della riserva integrale di Ravadasköngäs dove è imposto l'obbligo di rimanere sui sentieri
      tracciati. Nella valle del Lemmenjoki tra Njurkulahti e Kultahamina è consentito campeggiare
      esclusivamente accanto alle aree di sosta, ai focolari e ai rifugi segnati.


      La copertura telefonica è discontinua e del tutto assente nelle forre fluviali. Non fare affidamento sul
      cellulare. Il periodo consigliato va da giugno a settembre.
    around: >-
      Lemmenjoki non ha vicini immediati nell'atlas, ma condivide renna e aquila reale con altri grandi spazi
      del Grande Nord. Il [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) ha in comune
      renna, aquila reale e orso bruno, e il [Parque Nacional
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) ospita renna e orso bruno. Più a sud, la
      [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) e il [Parque Nacional de Stora
      Sjöfallet](/lugar/stora-sjofallet-national-park/) condividono la renna e l'aquila reale.
  pt:
    intro: >-
      Podes caminhar dias a fio sem cruzar vivalma. Isso é Lemmenjoki: o maior parque nacional da Finlândia,
      com 2858 km² de fells desprovidos de árvores, florestas ancestrais e turfeiras no coração de Sápmi, a
      terra do povo sami. Quem se afasta dos trilhos assinalados pode desfrutar de paz e isolamento absoluto
      durante semanas.
    landscape: >-
      O relevo varia desde vales fluviais luxuriantes até florestas velhas e fells abertos, com a vegetação a
      estratificar-se com a cota. Subir um fell equivale a cruzar zonas de vida bem marcadas: o
      pinheiro-silvestre é o primeiro a atingir o seu limite altitudinal, por volta dos 300 ou 400 m de
      altitude, sendo a bétula a espécie que define a linha superior das árvores. No extremo sul, em Kittilä,
      o abeto-falso assinala o limite do bosque em certas colinas, mas logo que se entra em Inari o coberto
      florestal resume-se a pinheiros e bétulas.


      Encaixados entre os fells, os vales mostram-se bem mais luxuriantes. Um dos bosques de bétulas mais
      notáveis medra em Kultasatama, na cabeceira do Lemmenjoki, rivalizando em verdura com as matas do sul da
      Finlândia. Mais a sul, quase um quarto da área do parque é formado por turfeiras aapa: as mais extensas,
      como Naskama-aapa e Sallivuoma, situam-se no setor mais recôndito e menos percorrido.


      A água rege toda a paisagem. O rio Lemmenjoki, que dá o nome ao parque, estende-se por 80 km, e as
      cabeceiras das bacias hidrográficas dos rios Tana e Pasvik nascem aqui. A cascata de Ravadasköngäs e a
      garganta que a antecede foram talhadas em parte pelas águas de degelo da Idade do Gelo, trabalho de
      erosão que o rio continua a esculpir hoje em dia.
    wildlife: >-
      Este é o domínio do [Glutão](/especie/gulo_gulo/), emblema do parque. Com sorte avistarás os seus rastos
      ou os do [Urso-pardo](/especie/ursus_arctos/), muito embora possas passar dias seguidos sem encontrar
      vivalma nem vislumbrar nenhum destes predadores. As águas, puras e oligotróficas, albergam apenas nove
      espécies de peixes no Lemmenjoki, entre elas o [Salmão atlântico](/especie/salmo_salar/) e a perca.


      As turfeiras constituem um refúgio fulcral para muitas aves, sendo o parque uma das áreas de nidificação
      mais prestigiadas para espécies palustres em relação às quais a Finlândia assume responsabilidade
      internacional ao abrigo das diretivas europeias. Entre as mais comuns figuram a alvéola-amarela, a
      narceja-comum e o marreco-d'asa-azul. Nas matas ribeirinhas ricas em herbáceas ouve-se o canto estival
      da felosa-boreal.


      O calendário dita a frequência de visitas. A época alta estende-se do final de junho ao fim de setembro,
      concentrando a quase totalidade dos viajantes. No inverno, durante mais de seis meses ao ano, Lemmenjoki
      converte-se no território intocado do esqui de travessia.
    visit: >-
      Percorre-se a pé, de barco fluvial tradicional ou em canoa. O vale do Lemmenjoki constitui um corredor
      de 22 km entre Njurkulahti e Kultasatama, dispondo de barcos de passageiros no verão e ladeado por um
      trilho marcado na margem. Desde Njurkulahti, o monte Joenkielinen ergue-se a cerca de 9 km por caminho
      sinalizado, abrindo um amplo horizonte sobre o vale.


      Fora desse eixo, a maior parte do parque é território estritamente selvagem onde podes traçar o teu
      próprio rumo. As opções vão desde pequenos circuitos botânicos até travessias autónomas de várias
      semanas, que exigem excelente capacidade de orientação: os abrigos abertos são raros e não há
      sinalização. No conjunto existem cerca de 60 km de trilhos marcados, algumas pontes suspensas e barcos
      de transposição fluvial, mais de dez cabanas de uso livre e três abrigos pagos mediante reserva.


      Outra alternativa clássica é a Rota do Ouro, atravessando as concessões de garimpo: de Kultasatama até
      Ravadasjärvi estende-se um trilho sinalizado de 20 km com painéis explicativos sobre métodos de
      prospeção, mitos e geologia. Para a memória histórica sami, um trilho marcado de 6 km parte do rio
      Repojoki, junto à estrada Inari-Kittilä, rumo ao tradicional cercado de renas de Sallivaara; ida e volta
      somam 12 km.


      Na água, a descida em canoa desde Muddusjärvi ou Solojärvi até Njurkulahti e Kultahamina proporciona um
      início sereno de navegação. Quem tiver mais experiência pode descer os rápidos mais bravios dos rios
      Vaskojoki, Kietsimäjoki, Ivalojoki e Repojoki.
    history: >-
      Os vestígios humanos mais recuados consistem em centenas de fossas-armadilha para a caça a renas
      selvagens, herdadas da Idade da Pedra e do Ferro: um dos maiores sistemas de captura da Finlândia
      localiza-se aqui. Séculos volvidos, o encerramento da fronteira entre a Finlândia e a Noruega em 1852
      interrompeu as transumâncias seculares dos pastores de [renas](/especie/rangifer_tarandus/) entre o
      oceano Ártico e as florestas da taiga. O cercado de Sallivaara, erigido nos anos trinta, é hoje um
      monumento cultural fundamental do parque. Em Njurkulahti, a herdade tradicional de Kaapin Jouni ilustra
      a vivência de uma influente família sami de criadores de renas.


      Depois eclodiu o ouro. Em 1945 os irmãos Ranttila descobriram ouro no ribeiro de Morgamoja e deflagrou a
      corrida ao ouro de Lemmenjoki; nos anos cinquenta existiam quase cem concessões ativas. O parque foi
      estabelecido em 1956 para salvaguardar as florestas e o belo vale, ampliado em 1971 e alcançando a
      extensão atual em 1981. Nos finais dos anos oitenta e inícios dos anos noventa a exploração mecânica
      turvava as águas a jusante, gerando conflitos. Em 2020 a extração mecanizada de ouro foi proibida por
      lei: atualmente só se autorizam métodos artesanais manuais com bateia e pá.
    before: >-
      Podes caminhar, progredir em raquetes de neve, esquiar, remar e navegar de canoa pelo parque, com
      exceção da reserva integral de Ravadasköngäs, onde é obrigatório não sair dos caminhos marcados. No vale
      do Lemmenjoki entre Njurkulahti e Kultahamina só é permitido acampar junto aos locais de descanso,
      fogueiras e cabanas assinalados.


      A rede de telemóvel é intermitente e totalmente nula nos vales profundos. Não contes com o telemóvel. A
      época ideal decorre entre junho e setembro.
    around: >-
      Lemmenjoki não dispõe de vizinhos imediatos no atlas, mas partilha a rena e a águia-real com outras
      vastas áreas do Grande Norte. O [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/)
      partilha a rena, a águia-real e o urso-pardo, e o [Parque Nacional
      Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) acolhe a rena e o urso-pardo. Mais a sul
      na Escandinávia, a [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) e o [Parque
      Nacional de Stora Sjöfallet](/lugar/stora-sjofallet-national-park/) partilham a rena e a águia-real.
