resumen:
  es: >-
    El Parque Nacional más antiguo y extenso de Letonia, famoso por sus afloramientos de arenisca devónica
    roja sobre valles boscosos.
  en: >-
    Latvia's oldest and largest National Park, famous for its red Devonian sandstone cliffs rising above
    forested valleys.
  fr: >-
    Le plus ancien et vaste parc national de Lettonie, réputé pour ses falaises de grès dévonien rouge
    surplombant des vallées boisées.
  de: >-
    Lettlands ältester und größter Nationalpark, berühmt für rote devonische Sandsteinfelsen über bewaldeten
    Tälern.
  it: >-
    Il più antico e vasto parco nazionale della Lettonia, celebre per le scogliere di arenaria devonica rossa
    su valli boscose.
  pt: >-
    O maior e mais antigo Parque Nacional da Letónia, célebre pelas escarpas de grés devónico vermelho sobre
    vales florestados.
unico:
  es: >-
    Acantilados de arenisca devónica, a veces de hasta noventa metros, que el río deja al descubierto a lo
    largo de su valle.
  en: >-
    Devonian sandstone cliffs, occasionally rising up to ninety metres, exposed by the river along its winding
    valley.
  fr: >-
    Des falaises de grès dévonien, atteignant parfois quatre-vingt-dix mètres, que la rivière met à nu le long
    de sa vallée.
  de: >-
    Klippen aus devonischem Sandstein, stellenweise bis zu neunzig Meter hoch, die der Fluss entlang seines
    Tals freilegt.
  it: >-
    Pareti rocciose di arenaria devonica, talora alte fino a novanta metri, che il fiume porta alla luce lungo
    la sua valle.
  pt: >-
    Escarpas de grés devónico, por vezes com até noventa metros de altura, que o rio deixa a descoberto ao
    longo do seu vale.
observaciones:
  es: >-
    Las reservas naturales ocupan una parte pequeña del parque y no están abiertas a las visitas. Si piensas
    ir a Līgatne, comprueba antes con el gestor cuándo están abiertos los senderos.
texto:
  es:
    intro: >-
      Hay valles que se cavan en siglos y otros que llevan más de trescientos cincuenta millones de años en la
      memoria. El del Gauja es de los segundos: un antiguo valle cuyos barrancos actuales los modeló el agua
      de deshielo al final de la Edad de Hielo, y por el que corre el río más largo de Letonia, de 452 km. El
      Parque Nacional de Gauja lo protege desde el 14 de septiembre de 1973, y es el primero y más antiguo del
      país.
    landscape: >-
      El parque ocupa 91786 ha y se divide en cinco zonas funcionales. Los bosques cubren el 47 % de la
      superficie, y lo que ves en las orillas del Gauja y de sus afluentes son areniscas devónicas, casi
      siempre monumentos geomorfológicos naturales. Aguas arriba de Cēsis los afloramientos más conocidos son
      Kazu iezis y los acantilados de Ērgļi, en la orilla izquierda, y los de Raiskums o Rojos, en la derecha.
      Junto a Sigulda, al pie de las laderas, hay cuevas en la arenisca: Gūtmaņa, Velna, Kraukļu y Pētera.


      El valle cambia de carácter a lo largo del río. Junto a Sigulda el Gauja atraviesa una puerta de
      dolomita donde el valle se estrecha hasta un kilómetro y alcanza más de ochenta y cinco metros de
      profundidad. Cerca de Vildoga y Nurmiži la red de barrancos y cárcavas es la más densa de Letonia. Y el
      propio río tiene fama de traicionero: cambia deprisa de cauce y forma rápidos de cantos rodados en Kazu,
      Raiskuma, Rakšu y Ķūķu. Algunos brazos se han aislado y son hoy lagunas en forma de media luna; en la
      llanura de inundación son típicos los sauces. Los mayores lagos del parque son Ungura, Vaidava y
      Raiskums.
    wildlife: >-
      La agencia registra más de 800 especies de plantas vasculares en el parque, 149 de aves y 48 de
      mamíferos. Para ver animales sin salir de un paseo corto, los senderos naturales de Līgatne permiten
      observarlos desde plataformas en recintos que reproducen su hábitat. Allí se ven oso pardo, jabalí,
      zorro, lince, corzo, ciervo, alce y aves como el búho real y el cárabo uralense. La mayoría llegaron
      heridos, o criados por personas de cachorros, y no podrían sobrevivir sin cuidados: los primeros
      residentes fueron seis ciervos rojos, a los que se unieron dos jabalíes al año siguiente.


      Los senderos de Līgatne se crearon en 1975 para enseñar a los visitantes la naturaleza de Letonia y
      suman unos 4–5 km, que llevan de media entre dos y tres horas. Los gestiona la Agencia de Conservación
      de la Naturaleza y cruzan los barrancos y montículos del antiguo valle.
    visit: >-
      El parque tiene una red de senderos peatonales de más de cien kilómetros. En la zona de Sigulda se
      camina con bastón por los senderos desde el siglo XIX. La web turística del parque propone recorrerlo
      despacio: a pie, en bicicleta, a caballo o en barca por la corriente suave del Gauja.


      Hay además más de quinientos monumentos de historia y cultura, entre ellos castros, castillos de piedra,
      iglesias, mansiones y molinos de agua y de viento. En el siglo XIII se alzaron aquí castillos de piedra
      protegidos por laderas empinadas y valles hondos, y en torno a ellos crecieron las ciudades.
    history: >-
      El río fue ruta comercial y los livonios levantaron sus poblados en sus orillas. El parque se creó para
      proteger zonas naturales poco alteradas, fomentar el turismo de naturaleza y asegurar un desarrollo
      sostenible, y desde 2004 forma parte de la red Natura 2000. Con su entorno cercano recibe más de un
      millón de visitas al año.
    before: >-
      Las reservas naturales ocupan una parte pequeña del parque y no están abiertas a las visitas. Si piensas
      ir a Līgatne, comprueba antes con el gestor cuándo están abiertos los senderos.
  en:
    intro: >-
      There are valleys hollowed out over centuries, and others carrying more than three hundred and fifty
      million years of geological memory. The Gauja belongs firmly to the latter: a primeval ancient valley
      whose dramatic ravines were sculpted by meltwater at the close of the Ice Age, traversed by Latvia's
      longest river at 452 km. Gauja National Park has safeguarded it since 14 September 1973, standing as the
      nation's first and oldest national park.
    landscape: "The park spans 91786 ha and is organized into five functional zones. Forests mantle 47 % of its surface, and what you behold along the banks of the Gauja and its tributaries are towering Devonian sandstones, designated as protected geomorphological monuments. Upstream from Cēsis, the most famous outcrops include Kazu iezis and the Ērgļi cliffs along the left bank, alongside Raiskums rock on the right. Around Sigulda, at the base of the bluffs, caves hollow out the sandstone: Gūtmaņa, Velna, Kraukļu, and Pētera.\r\n\r\nThe valley shifts character along the waterway. Near Sigulda the Gauja flows through a dolomite gateway where the chasm narrows to about one kilometre and plummets over eighty-five metres deep. Near Vildoga and Nurmiži the maze of gullies and wooded ravines is the densest in all Latvia. The river itself has a reputation for unpredictability, shifting course swiftly and churning over boulder rapids at Kazu, Raiskuma, Rakšu, and Ķūķu. Oxbow lakes cut off from the main channel form peaceful crescent lagoons, while willow thickets thrive across the floodplain. The park's largest bodies of water are lakes Ungura, Vaidava, and Raiskums."
    wildlife: "The managing agency has recorded more than 800 species of vascular plants in the park, 149 of birds, and 48 of mammals. To observe native wildlife within an easy walking excursion, the nature trails of Līgatne allow visitors to watch animals from elevated viewpoints in spacious, semi-wild enclosures replicating their native habitat. Here live brown bears, wild boar, foxes, Eurasian lynx, roe deer, red deer, moose, and birds such as eagle owls and Ural owls. Most arrived injured or were reared by hand as orphaned cubs, unable to survive in the wild: the very first inhabitants were six red deer, joined the following year by two wild boar.\r\n\r\nThe Līgatne trails were established in 1975 to showcase Latvia's indigenous wildlife and cover roughly 4–5 km, typically requiring between two and three hours to explore. Managed by the Nature Conservation Agency, they wind through the steep gullies and sand knolls of the ancient valley."
    visit: "The park features a foot trail network extending over more than one hundred kilometres. Walking sticks have accompanied ramblers along the Sigulda paths since the nineteenth century. The park's visitor network encourages exploring at an unhurried pace: on foot, by touring bicycle, on horseback, or paddling canoes along the gentle current of the Gauja.\r\n\r\nThere are also more than five hundred historical and cultural monuments, including fortified hillforts, medieval stone castles, churches, manor estates, and water- and windmills. In the thirteenth century, formidable stone fortresses were raised on sheer cliff spurs guarded by deep ravines, forming the kernels around which vibrant towns eventually grew."
    history: >-
      The river served as a vital trade artery, and ancient Livonian clans established fortified villages
      along its bluffs. The national park was created to safeguard pristine landscapes, cultivate nature
      tourism, and ensure sustainable development, joining the Natura 2000 network in 2004. Together with its
      surrounding recreation areas, it welcomes over one million visitors annually.
    before: >-
      Strict nature reserves encompass a small percentage of the park and remain entirely closed to casual
      visitors. If you plan to visit Līgatne, check opening hours with the park authority beforehand.
  fr:
    intro: >-
      Il est des vallées qui se creusent en quelques siècles, et d'autres qui portent en elles plus de trois
      cent cinquante millions d'années d'histoire géologique. Celle de la Gauja appartient à cette seconde
      lignée : une ancienne vallée dont les gorges spectaculaires furent taillées par les eaux de fonte à la
      fin de la période glaciaire, arrosée par le plus long fleuve de Lettonie sur 452 km. Le parc national de
      Gauja la protège depuis le 14 septembre 1973, constituant le premier et plus ancien parc national du
      pays.
    landscape: "Le parc couvre 91786 ha et se divise en cinq zones fonctionnelles. Les forêts occupent 47 % de son territoire, et les parois rocheuses qui bordent la Gauja et ses affluents sont faites de grès dévoniens remarquables, classés pour la plupart comme monuments géomorphologiques naturels. En amont de Cēsis, les escarpements les plus célèbres sont Kazu iezis et les falaises d'Ērgļi sur la rive gauche, ainsi que la paroi de Raiskums sur la rive droite. Près de Sigulda, au pied des versants, des cavités s'ouvrent dans la roche : Gūtmaņa, Velna, Kraukļu et Pētera.\r\n\r\nLa vallée change de visage au fil de l'eau. Aux abords de Sigulda, la Gauja franchit un défilé dolomitique où le val se rétrécit sur environ un kilomètre et s'enfonce à plus de quatre-vingt-cinq mètres de profondeur. Vers Vildoga et Nurmiži, le réseau de ravines boisées est le plus dense de Lettonie. Le fleuve lui-même passe pour capricieux : il déplace rapidement son lit et forme des rapides encombrés de galets à Kazu, Raiskuma, Rakšu et Ķūķu. D'anciens bras morts isolés forment désormais des méandres en croissant, tandis que les saules dominent la plaine inondable. Les plus grands lacs du parc sont ceux d'Ungura, de Vaidava et de Raiskums."
    wildlife: "Les gestionnaires recensent plus de 800 espèces de plantes vasculaires, 149 espèces d'oiseaux et 48 espèces de mammifères au sein du parc. Pour contempler la faune sans entreprendre de longue expédition, les sentiers nature de Līgatne permettent d'observer les animaux depuis des plates-formes aménagées dans de vastes enclos reproduisant leur biotope naturel. On y observe l'ours brun, le sanglier, le renard, le lynx d'Eurasie, le chevreuil, le cerf élaphe, l'élan, ainsi que le grand-duc d'Europe et la chouette de l'Oural. La plupart y ont été accueillis blessés ou orphelins : les premiers pensionnaires furent six cerfs élaphes, rejoints l'année suivante par deux sangliers.\r\n\r\nAménagés en 1975 pour faire découvrir la nature lettone, les sentiers de Līgatne totalisent environ 4–5 km, dont la visite dure en moyenne entre deux et trois heures. Gérés par l'Agence de protection de la nature, ils parcourent les combes et monticules de l'ancienne vallée."
    visit: "Le parc est maillé par un réseau de sentiers pédestres de plus de cent kilomètres. Dans les environs de Sigulda, la coutume de cheminer avec une canne de marche remonte au XIXe siècle. Le réseau touristique incite à une découverte lente : à pied, à vélo, à cheval ou au fil de l'eau en canoë sur le cours paisible de la Gauja.\r\n\r\nOn dénombre en outre plus de cinq cents monuments historiques et culturels, parmi lesquels des collines fortifiées préhistoriques, des châteaux médiévaux en pierre, des églises, des manoirs et des moulins à eau ou à vent. Au XIIIe siècle, de puissantes forteresses en maçonnerie furent érigées sur des éperons escarpés ceinturés de vallées profondes, donnant naissance aux villes actuelles."
    history: >-
      Le fleuve constitua une voie commerciale majeure sur les rives de laquelle les populations livoniennes
      fondèrent leurs villages. Le parc national fut instauré pour sauvegarder des écosystèmes peu altérés,
      encourager un tourisme doux et assurer un développement durable, rejoignant le réseau Natura 2000 en
      2004. Avec ses abords immédiats, il accueille plus d'un million de visiteurs chaque année.
    before: >-
      Les réserves naturelles intégrales couvrent une portion minime du parc et demeurent strictement fermées
      aux visiteurs. Si vous prévoyez de vous rendre à Līgatne, vérifiez au préalable les horaires d'accès
      auprès de l'administration.
  de:
    intro: >-
      Es gibt Täler, die sich in wenigen Jahrhunderten eintiefen, und andere, die mehr als dreihundertfünfzig
      Millionen Jahre Erdgeschichte in sich tragen. Das Tal der Gauja gehört zur zweiten Gruppe: ein uraltes
      Urstromtal, dessen steile Schluchten am Ende der Eiszeit von gewaltigen Schmelzwassermengen geformt
      wurden und durch das mit 452 km der längste Fluss Lettlands fließt. Der Gauja-Nationalpark schützt
      dieses Naturwunder seit dem 14. September 1973 als erster und ältester Nationalpark des Landes.
    landscape: "Der Nationalpark umfasst 91786 ha und gliedert sich in fünf funktionale Zonen. Wälder bedecken 47 % des Gebiets, und an den Ufern der Gauja und ihrer Zuflüsse treten mächtige devonische Sandsteinformationen zutage, die fast durchweg als geomorphologische Naturdenkmäler geschützt sind. Flussaufwärts von Cēsis zählen Kazu iezis und die Ērgļi-Klippen am linken Ufer sowie die Felswand Raiskums am rechten Ufer zu den bekanntesten Aufschlüssen. Nahe Sigulda öffnen sich am Hangfuß Höhlen im Sandstein: Gūtmaņa, Velna, Kraukļu und Pētera.\r\n\r\nDas Tal wandelt seinen Charakter im Flusslauf. Bei Sigulda passiert die Gauja eine Dolomitpforte, an der sich das Tal auf etwa einen Kilometer verengt und über fünfundachtzig Meter tief einscheidet. Nahe Vildoga und Nurmiži ist das Netz an bewaldeten Schluchten und Erosionsrinnen das dichteste in ganz Lettland. Der Fluss selbst gilt als unberechenbar: Er verlagert rasch seine Sandbänke und bildet an Kazu, Raiskuma, Rakšu und Ķūķu geröllreiche Stromschnellen. Altarme haben sich zu sichelförmigen Stillgewässern abgeschnürt, und in den Auen dominieren Weidengebüsche. Die größten Seen des Parks sind Ungura, Vaidava und Raiskums."
    wildlife: "Die Schutzgebietsverwaltung verzeichnet über 800 Gefäßpflanzenarten, 149 Vogelarten und 48 Säugetierarten im Park. Um die heimische Tierwelt ohne weite Wanderungen zu erleben, bieten die Naturpfade von Līgatne Beobachtungsplattformen an großzügigen Freigehegen, die den natürlichen Lebensraum nachbilden. Hier leben Braunbär, Wildschwein, Rotfuchs, Luchs, Reh, Rothirsch, Elch sowie Vögel wie Uhu und Habichtskauz. Die meisten Tiere gelangten verletzt oder als verwaiste Jungtiere hierher: Zu den ersten Pfleglingen zählten sechs Rothirsche, zu denen im Folgejahr zwei Wildschweine stießen.\r\n\r\nDie Naturpfade von Līgatne wurden 1975 eingerichtet, um Besuchern die Tierwelt Lettlands nahezubringen, und umfassen etwa 4–5 km, für die man durchschnittlich zwei bis drei Stunden benötigt. Sie werden von der Naturschutzbehörde unterhalten und führen durch die Schluchten und Sandmoränen des Urstromtals."
    visit: "Der Park verfügt über ein Wanderwegenetz von mehr als einhundert Kilometern Länge. In der Gegend von Sigulda ist das Spazierengehen mit kunstvoll geschnitzten Wanderstöcken schon seit dem neunzehnten Jahrhundert Tradition. Die Parkverwaltung empfiehlt eine entschleunigte Erkundung: zu Fuß, mit dem Tourenrad, auf dem Pferderücken oder mit dem Kanu auf der gemächlichen Strömung der Gauja.\r\n\r\nDarüber hinaus gibt es mehr als fünfhundert historische und kulturelle Denkmäler, darunter vorzeitliche Wallburgen, steinerne Ritterburgen, Kirchen, Gutshäuser sowie Wasser- und Windmühlen. Im dreizehnten Jahrhundert entstanden auf steilen Talspornen massive Steinburgen, um die herum die heutigen historischen Städte heranwuchsen."
    history: >-
      Der Fluss diente früh als Handelsweg, und livische Stämme errichteten befestigte Siedlungen an seinen
      Ufern. Der Nationalpark wurde gegründet, um naturnahe Landschaften zu bewahren, schonenden
      Naturtourismus zu fördern und eine nachhaltige Entwicklung zu sichern; seit 2004 gehört er zum
      europäischen Schutzgebietsnetz Natura 2000. Zusammen mit dem nahen Umland zählt das Tal über eine
      Million Besucher pro Jahr.
    before: >-
      Die strengen Totalreservate nehmen nur einen kleinen Flächenanteil ein und sind für die Öffentlichkeit
      vollständig gesperrt. Wenn du nach Līgatne reisen möchtest, informiere dich vorab bei der Parkverwaltung
      über die Öffnungszeiten der Naturpfade.
  it:
    intro: >-
      Vi sono valli scavate nell'arco di pochi secoli, e altre che racchiudono oltre trecentocinquanta milioni
      di anni di storia della terra. Quella del Gauja appartiene a quest'ultima categoria: un'antica valle
      glaciale le cui forre boscose furono modellate dalle acque di disgelo alla fine dell'era glaciale,
      solcata dal fiume più lungo della Lettonia con i suoi 452 km. Il Parco Nazionale di Gauja la tutela dal
      14 settembre 1973, figurando come il primo e più antico parco del Paese.
    landscape: "Il parco si estende per 91786 ha ed è ripartito in cinque zone funzionali. I boschi coprono il 47 % del territorio, e ciò che si ammira lungo le rive del Gauja e dei suoi tributari sono imponenti arenarie devoniche, dichiarate monumenti geomorfologici naturali. A monte di Cēsis gli affioramenti più noti sono Kazu iezis e le pareti di Ērgļi sulla sponda sinistra, oltre alla rupe di Raiskums sulla destra. Presso Sigulda, al piede dei versanti, si aprono grotte nell'arenaria: Gūtmaņa, Velna, Kraukļu e Pētera.\r\n\r\nLa valle muta fisionomia lungo il corso d'acqua. Presso Sigulda il Gauja valica una soglia dolomitica dove la valle si restringe a circa un chilometro e raggiunge oltre ottantacinque metri di profondità. Nei dintorni di Vildoga e Nurmiži la trama di forre boscose e calanchi è la più densa di tutta la Lettonia. Lo stesso fiume è noto per essere mutevole: sposta rapidamente i propri banchi di sabbia e origina rapide ciottolose a Kazu, Raiskuma, Rakšu e Ķūķu. Alcuni meandri abbandonati costituiscono lanche a mezzaluna, mentre la piana alluvionale è colonizzata da salici. I bacini lacustri maggiori sono i laghi Ungura, Vaidava e Raiskums."
    wildlife: "L'ente gestore registra oltre 800 specie di piante vascolari, 149 specie di uccelli e 48 specie di mammiferi all'interno del parco. Per osservare gli animali senza compiere lunghe camminate, i sentieri naturalistici di Līgatne consentono di ammirarli da punti panoramici in ampi recinti che ne ricreano l'ambiente naturale. Vi dimorano l'orso bruno, il cinghiale, la volpe, la lince europea, il capriolo, il cervo nobile, l'alce e rapaci quali il gufo reale e l'allocco degli Urali. Gran parte degli esemplari è giunta ferita o orfana: i primi ospiti furono sei cervi nobili, cui si aggiunsero l'anno successivo due cinghiali.\r\n\r\nI sentieri di Līgatne furono istituiti nel 1975 per far conoscere la natura lettone e si sviluppano per circa 4–5 km, richiedendo in media tra due e tre ore di visita. Gestiti dall'Agenzia per la Conservazione della Natura, si snodano tra i valloncelli e le colline sabbiose dell'antica valle."
    visit: "Il parco dispone di una rete di percorsi pedonali che supera i cento chilometri. Nell'area di Sigulda passeggiare con il bastone da cammino è una consuetudine documentata fin dal secolo XIX. La promozione turistica invita a una fruizione rilassata: a piedi, in bicicletta, a cavallo o scivolando in canoa sulle dolci correnti del Gauja.\r\n\r\nSi contano inoltre oltre cinquecento monumenti storici e culturali, fra cui castelli in pietra medievali, siti fortificati preromani, chiese, tenute nobiliari e mulini a vento e ad acqua. Nel secolo XIII sorsero su spuntoni rocciosi difesi da profonde gole imponenti fortezze in pietra, attorno alle quali crebbero i centri abitati."
    history: >-
      Il fiume fu un'importante via di commercio fluviale e le genti livoni fondarono villaggi lungo i suoi
      terrazzi. Il parco nazionale venne istituito per proteggere ecosistemi naturali poco alterati,
      promuovere il turismo naturalistico e garantire uno sviluppo sostenibile, confluendo nel 2004 nella rete
      Natura 2000. Insieme alle aree limitrofe accoglie più di un milione di visitatori ogni anno.
    before: >-
      Le riserve naturali integrali coprono una porzione ristretta del parco e restano precluse alle visite.
      Se intendi visitare Līgatne, verifica previamente gli orari di apertura dei sentieri con l'ente gestore.
  pt:
    intro: >-
      Há vales que se escavam ao longo de séculos e outros que preservam na sua memória mais de trezentos e
      cinquenta milhões de anos de evolução geológica. O do Gauja enquadra-se no segundo grupo: um vale
      primitivo cujos barrancos abruptos foram cinzelados pelo degelo no fim da Idade do Gelo, percorrido pelo
      rio mais extenso da Letónia ao longo de 452 km. O Parque Nacional de Gauja protege-o desde 14 de
      setembro de 1973, constituindo o primeiro e mais antigo parque nacional do país.
    landscape: "O parque abrange 91786 ha e reparte-se por cinco zonas funcionais. As matas recobrem 47 % da superfície territorial, e as arribas que se erguem nas margens do Gauja e dos seus afluentes são imponentes formações de grés devónico, na sua maioria classificadas como monumentos geomorfológicos. A montante de Cēsis, os afloramentos mais emblemáticos são Kazu iezis e as escarpas de Ērgļi na margem esquerda, além da escarpa de Raiskums na direita. Perto de Sigulda, na base das encostas, rasgam-se grutas no arenito: Gūtmaņa, Velna, Kraukļu e Pētera.\r\n\r\nO vale vai transformando a sua morfologia ao longo do percurso fluvial. Junto a Sigulda, o Gauja atravessa um desfiladeiro dolomítico onde o vale se estreita até cerca de um quilómetro e ultrapassa os oitenta e cinco metros de profundidade. Próximo de Vildoga e Nurmiži, a rede de ravinas e barrancos arborizados é a mais densa de toda a Letónia. O próprio rio tem fama de imprevisível: altera depressa os bancos arenosos e forma rápidos rochosos em Kazu, Raiskuma, Rakšu e Ķūķu. Alguns meandros abandonados transformaram-se em lagoas em crescente, sendo os salgueiros característicos na planície aluvial. Os maiores lagos do parque são Ungura, Vaidava e Raiskums."
    wildlife: "O serviço de conservação regista no parque mais de 800 espécies de plantas vasculares, 149 de aves e 48 de mamíferos. Para observar os animais sem fazer percursos extenuantes, os trilhos naturais de Līgatne facultam a sua observação a partir de passadiços e miradouros instalados em amplos cercados que reproduzem o seu habitat natural. Aí habitam o urso-pardo, o javali, a raposa, o lince-euroasiático, o corço, o veado-vermelho, o alce e aves como o bufo-real e a coruja-dos-urales. Quase todos deram entrada feridos ou foram criados à mão em orfandade: os primeiros residentes foram seis veados-vermelhos, aos quais se juntaram no ano seguinte dois javalis.\r\n\r\nOs trilhos de Līgatne foram inaugurados em 1975 para divulgar a fauna autóctone letã e somam cerca de 4–5 km, percorrendo-se em média entre duas e três horas. Geridos pela Agência de Conservação da Natureza, cruzam as ravinas e colinas arenosas do vale primitivo."
    visit: "O parque dispõe de uma malha de trilhos pedestres com mais de cem quilómetros de extensão. Na zona de Sigulda, a tradição de caminhar com bordão talhado perdura desde o século XIX. O portal turístico do parque recomenda uma descoberta sem pressas: a pé, em bicicleta de turismo, a cavalo ou remando em canoa ao sabor da corrente suave do Gauja.\r\n\r\nContam-se adicionalmente mais de quinhentos monumentos históricos e culturais, incluindo castros pré-históricos, castelos medievais de pedra, igrejas, casas solarengas e moinhos de água e de vento. No século XIII foram erguidas fortalezas de cantaria em esporões alcantilados protegidos por vales fundos, em redor dos quais floresceram as povoações."
    history: >-
      O rio constituiu uma via comercial fundamental, tendo as populações livónias erguido aldeamentos
      fortificados nas suas colinas. O parque nacional foi criado para resguardar biótopos pouco alterados,
      impulsionar o turismo de natureza e fomentar o desenvolvimento sustentável, integrando a rede Natura
      2000 desde 2004. Com as suas imediações atrai mais de um milhão de visitantes anualmente.
    before: >-
      As reservas naturais integrais compreendem uma fração reduzida do parque e encontram-se encerradas ao
      público. Se tencionas visitar Līgatne, confirma antecipadamente junto da administração os horários em
      que os trilhos se encontram transitáveis.
