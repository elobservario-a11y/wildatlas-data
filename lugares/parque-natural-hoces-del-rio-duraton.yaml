resumen:
  es: >-
    Meandros encajados de 100 m de profundidad labrados en caliza roja por el río Duratón con la célebre
    ermita rupestre de San Frutos.
  en: >-
    Incised meanders 100 m deep carved into red limestone by the Duratón River, featuring the renowned
    cliffside hermitage of San Frutos.
  fr: >-
    Méandres encaissés de 100 m de profondeur sculptés dans le calcaire rouge par le río Duratón, avec le
    célèbre ermitage rupestre de San Frutos.
  de: >-
    Eingeschnittene, 100 m tiefe Mäander, die der Duratón in roten Kalkstein gegraben hat, mit der berühmten
    Felsen-Einsiedelei San Frutos.
  it: >-
    Meandri incassati di 100 m di profondità scavati nel calcare rosso dal fiume Duratón, con il celebre eremo
    rupestre di San Frutos.
  pt: >-
    Meandros encaixados de 100 m de profundidade lavrados em calcário vermelho pelo rio Duratón, com a célebre
    ermida rupestre de San Frutos.
unico:
  es: >-
    Un cañón de meandros donde el ocre de la roca, el verde de la ribera y el vuelo de cientos de buitres se
    miran de frente.
  en: >-
    A meander canyon where ochre rocks, riparian green and the flight of hundreds of vultures meet face to
    face.
  fr: >-
    Un canyon de méandres où l'ocre de la roche, le vert des rives et le vol de centaines de vautours se
    côtoient face à face.
  de: >-
    Ein Canyon aus Flussschlingen, in dem das Ocker der Felsen, das Grün der Flussauen und der Flug von
    Hunderten von Geiern aufeinandertreffen.
  it: >-
    Un canyon di meandri dove l'ocra della roccia, il verde delle rive e il volo di centinaia di avvoltoi si
    fronteggiano da vicino.
  pt: >-
    Um desfiladeiro de meandros onde o ocre da rocha, o verde ribeirinho e o voo de centenas de abutres se
    encontram frente a frente.
observaciones:
  es: Planifica la visita desde la Casa del Parque, que gestiona los permisos y entrega mapas y sendas.
texto:
  es:
    intro: >-
      En la pared de un cañón segoviano anidan casi 768 parejas de buitre leonado. Son tantas que el
      espectáculo no está en buscarlas, sino en alzar la vista. El Parque Natural de las Hoces del río Duratón
      está en el noreste de Segovia, aguas abajo de la villa de Sepúlveda, donde el río se ha encajado en un
      cañón con más de 100 metros de desnivel. Y alrededor de la naturaleza, la historia: la ermita románica
      de San Frutos, cuevas con grabados de la Edad del Bronce y el conjunto arquitectónico de Sepúlveda.
    landscape: >-
      El Duratón se instaló sobre una superficie de caliza y la decapitó, y así nació la hoz. Describe un
      curso meandriforme, en terrenos duros de calizas y dolomías cretácicas, y sus escarpes pueden superar
      los 100 m de desnivel. Entre Sepúlveda y el embalse de Burgomillodo, unos 27 km de hoces de fondo plano
      dejan un contraste claro: el colorido ocre de las rocas frente a la cinta verde de la vegetación
      ribereña. El agua sigue trabajando: la erosión modela el cañón desde hace millones de años y continúa.
      En el suroeste, otra historia: arenas eólicas con forma de dunas, orientadas por los vientos dominantes
      del noroeste.


      Cuatro ambientes ordenan el parque. La paramera, arriba, tiene sabinares y enebrales abiertos,
      degradados por la acción humana y sustituidos en muchas zonas por tomillares y aulagares de aspecto de
      pseudoestepa; es un lugar de condiciones extremas, con frío y viento intensos en invierno, calor en
      verano y una sequía estival prolongada. Sobre las arenas del suroeste crecen pinares de repoblación de
      pino resinero. En los cortados prosperan plantas muy originales: las sedas, el ombligo de Venus y
      endemismos ibéricos como Biscutella valentina, Dianthus pungens y Campanula hispanica. Y en el fondo del
      valle quedan restos de bosque de ribera con sauces, fresnos, álamos, olmos y alisos.
    wildlife: >-
      Mira a los cortados. Además del [buitre leonado](/especie/gyps_fulvus/), que es el ave más emblemática,
      anidan el [alimoche](/especie/neophron_percnopterus/), el [halcón
      peregrino](/especie/falco_peregrinus/), el cernícalo vulgar, el [águila
      real](/especie/aquila_chrysaetos/) y el [búho real](/especie/bubo_bubo/), y hay colonias de grajilla y
      [chova piquirroja](/especie/pyrrhocorax_pyrrhocorax/). Entre las rapaces forestales destacan el águila
      calzada, el azor, el ratonero, los milanos negro y real y el alcotán. La paramera mantiene una comunidad
      de paseriformes en la que destaca la alondra de Dupont.


      En el suelo, el parque tiene corzos, jabalíes y zorros en los pinares, y también tejón, garduña,
      comadreja, liebre y conejo; hay alguna observación aislada de [nutria](/especie/lutra_lutra/). Entre los
      reptiles figuran el lagarto ocelado, la lagartija colilarga y las culebras bastarda, de escalera y
      viperina.
    visit: >-
      Empieza por la Casa del Parque, en Sepúlveda, en la antigua iglesia de Santiago. Su recepción ofrece
      mapas, sendas y gestión de permisos, y la exposición es un paseo imaginario por el cañón: paneles que
      imitan la vega, los cortados y el páramo, una réplica de la Cueva de los Siete Altares con altares
      visigodos y una zona dedicada a los oficios de ganaderos, canteros, agricultores y resineros. La Casa
      propone además voluntariado para colocar cajas nido y visitas guiadas.


      La Senda de los Dos Ríos es un circuito de cinco kilómetros que empieza y termina en la Casa del Parque,
      y es donde el parque propuso observar aves y donde su programa educativo describía un itinerario para
      seguir rastros de mamíferos. La Senda de la Molinilla, de dificultad baja, recorre 3,7 kilómetros de ida
      en unos cuarenta y cinco minutos. El recorrido más sencillo por las hoces parte de la explanada donde
      acaba el camino de Villaseca y va al espolón rocoso de la ermita de San Frutos. La senda a la ermita es
      lineal, mide novecientos veinticinco metros por sentido y dura una hora en total. En el camino, un
      puente de piedra cruza una grieta llamada La Cuchillada y lleva al antiguo cenobio benedictino, con
      tumbas antropomórficas altomedievales en su cementerio.
    history: >-
      Ganaderos, canteros, agricultores y resineros han vivido históricamente del Duratón, y de ese modo de
      vida queda el paisaje que hoy se protege. Cuevas con grabados de la Edad del Bronce, la ermita de San
      Frutos y la villa de Sepúlveda completan el interés del parque.
    before: Planifica la visita desde la Casa del Parque, que gestiona los permisos y entrega mapas y sendas.
    around: >-
      El [Parque Natural Hoces del Río Riaza](/lugar/parque-natural-hoces-del-rio-riaza/) está a unos
      veintiséis kilómetros y el [Parque Nacional de la Sierra de Guadarrama y Montes de
      Valsaín](/lugar/parque-nacional-de-la-sierra-de-guadarrama/) a unos veintisiete. Más lejos, el [Parque
      Natural Bardenas Reales de Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) comparte
      alimoche, búho real y buitre leonado entre cañones y karst, igual que el [Parc Natural de la Serra de
      Montsant](/lugar/parc-natural-de-la-serra-de/) con búho real, buitre leonado y halcón peregrino, y el
      [Priroden Park Rusenski Lom](/lugar/priroden-park-rusenski-lom/) con alimoche y búho real.
  en:
    intro: >-
      On the wall of a Segovian canyon nest almost 768 pairs of griffon vultures. There are so many that the
      spectacle lies not in seeking them, but simply in looking up. Hoces del Río Duratón Natural Park is
      located in north-eastern Segovia, downstream from the town of Sepúlveda, where the river has cut into a
      canyon with over 100 metres of vertical drop. Surrounding this nature lies rich history: the Romanesque
      hermitage of San Frutos, caves with Bronze Age engravings and the historic ensemble of Sepúlveda.
    landscape: >-
      The Duratón settled over a limestone surface and sliced through it, giving birth to the gorge. It
      follows a meandering course carved into hard Cretaceous limestone and dolomite, where cliff faces can
      exceed 100 m of vertical relief. Between Sepúlveda and the Burgomillodo reservoir, some 27 km of
      flat-bottomed gorges present a striking contrast: warm ochre cliffs alongside a lush green ribbon of
      riverside forest. Water never stops carving: erosion has shaped this canyon over millions of years and
      still continues. To the south-west, a different story unfolds: windblown sands forming dunes aligned
      with prevailing north-westerly winds.


      Four distinct environments organise the park. The plateau above features open juniper and savin
      woodlands, degraded by human activity and largely replaced by thyme and gorse pseudo-steppes; it is a
      realm of harsh extremes, with bitter cold and fierce winds in winter, intense summer heat and prolonged
      drought. Over the south-western sands grow reforested maritime pine woods. Original rupicolous flora
      thrives along the crags: stonecrops, navelworts and Iberian endemics such as Biscutella valentina,
      Dianthus pungens and Campanula hispanica. Along the valley floor linger remnants of gallery forest with
      willows, ashes, poplars, elms and alders.
    wildlife: >-
      Look to the cliffs. Alongside the [griffon vulture](/especie/gyps_fulvus/), the park's most iconic bird,
      there are nesting [Egyptian vultures](/especie/neophron_percnopterus/), [peregrine
      falcons](/especie/falco_peregrinus/), common kestrels, [golden eagles](/especie/aquila_chrysaetos/) and
      [Eurasian eagle-owls](/especie/bubo_bubo/), as well as colonies of western jackdaws and [red-billed
      choughs](/especie/pyrrhocorax_pyrrhocorax/). Forest raptors include booted eagles, northern goshawks,
      common buzzards, black and red kites and Eurasian hobbys. The high plateau supports a passerine
      community highlighted by Dupont's lark.


      On the ground, roe deer, wild boars and red foxes roam the pine woods, alongside European badgers, stone
      martens, least weasels, European hares and European rabbits; occasional isolated sightings of the
      [Eurasian otter](/especie/lutra_lutra/) also occur. Reptiles include the ocellated lizard, large
      psammodromus and Montpellier, ladder and viperine snakes.
    visit: >-
      Start at the Casa del Parque in Sepúlveda, housed in the ancient church of Santiago. Its reception
      provides maps, route guidance and permit management, while the exhibition offers an imaginary journey
      through the canyon: displays recreating the fertile valley, cliffs and plateau, a replica of the Cave of
      the Seven Altars with Visigothic carvings, and a section dedicated to traditional trades of goatherds,
      quarrymen, farmers and resin tappers. The centre also organizes nest-box volunteer programs and guided
      tours.


      The Senda de los Dos Ríos is a five-kilometre circuit starting and ending at the visitor centre,
      designed for birdwatching and mammal track identification. The Senda de la Molinilla, an easy trail,
      covers 3.7 kilometres one-way in about forty-five minutes. The simplest walk into the gorges begins at
      the car park where the Villaseca track ends and leads out along the rocky spur to the hermitage of San
      Frutos. The path to the hermitage is linear, measuring nine hundred and twenty-five metres each way and
      taking one hour in total. Along the path, a stone bridge spans a cleft known as La Cuchillada and leads
      to the ancient Benedictine priory, featuring anthropomorphic early medieval tombs in its cemetery.
    history: >-
      Goatherds, stonecutters, farmers and resin workers historically made their living from the Duratón,
      shaping the cultural landscape protected today. Caves with Bronze Age engravings, the San Frutos
      hermitage and the historic town of Sepúlveda complete the park's heritage.
    before: >-
      Plan your visit starting from the Casa del Parque, which manages permits and distributes maps and route
      guides.
    around: >-
      [Hoces del Río Riaza Natural Park](/lugar/parque-natural-hoces-del-rio-riaza/) lies about twenty-six
      kilometres away and [Sierra de Guadarrama and Montes de Valsaín National
      Park](/lugar/parque-nacional-de-la-sierra-de-guadarrama/) about twenty-seven. Farther afield, [Bardenas
      Reales Natural Park](/lugar/parque-natural-bardenas-reales-de-navarra/) shares the Egyptian vulture,
      eagle-owl and griffon vulture across canyons and karst, as does [Serra de Montsant Natural
      Park](/lugar/parc-natural-de-la-serra-de/) with eagle-owls, griffon vultures and peregrine falcons, and
      [Priroden Park Rusenski Lom](/lugar/priroden-park-rusenski-lom/) with Egyptian vultures and eagle-owls.
  fr:
    intro: >-
      Sur la falaise d'un canyon de Ségovie nichent près de 768 couples de vautours fauves. Ils sont si
      nombreux que le spectacle ne consiste pas à les chercher, mais simplement à lever les yeux. Le parc
      naturel des Hoces del río Duratón se situe dans le nord-est de Ségovie, en aval de Sepúlveda, où le
      cours d'eau s'est enfoncé dans un canyon de plus de 100 mètres de dénivelé. Autour de la nature rayonne
      l'histoire : l'ermitage roman de San Frutos, des grottes gravées de l'âge du bronze et le patrimoine
      architectural de Sepúlveda.
    landscape: >-
      Le Duratón s'est installé sur un plateau calcaire avant de l'entailler profondément, donnant naissance à
      la gorge. Il décrit des méandres encaissés dans les calcaires et dolomies du Crétacé, bordés
      d'escarpements qui dépassent parfois 100 m de commandement. Entre Sepúlveda et le lac de Burgomillodo,
      quelque 27 km de gorges au fond plat offrent un contraste saisissant : les teintes ocres des falaises
      face au ruban vert de la ripisylve. L'eau ne cesse d'agir : l'érosion façonne le canyon depuis des
      millions d'années. Au sud-ouest s'étend un autre milieu : des sables éoliens formant des dunes orientées
      par les vents dominants du nord-ouest.


      Quatre milieux structurent le parc. La lande d'altitude, en haut, porte des boisements clairs de
      genévrier sabine et cade, dégradés par les activités humaines et remplacés par des pelouses à thym et
      ajoncs d'allure pseudo-steppique ; c'est un espace aux conditions rudes, battu par le froid et le vent
      en hiver, écrasé de chaleur en été et marqué par une sécheresse estivale sévère. Sur les sables du
      sud-ouest poussent des pinèdes plantées de pin maritime. Dans les falaises prospèrent des plantes
      originales : orpins, nombrils-de-Vénus et endémiques ibériques comme Biscutella valentina, Dianthus
      pungens et Campanula hispanica. Au fond de la gorge subsistent des galeries rivulaires de saules,
      frênes, peupliers, ormes et aulnes.
    wildlife: >-
      Regardez les falaises. Outre le [vautour fauve](/especie/gyps_fulvus/), oiseau emblématique du parc, y
      nichent le [percnoptère](/especie/neophron_percnopterus/), le [faucon
      pèlerin](/especie/falco_peregrinus/), le faucon crécerelle, l'[aigle royal](/especie/aquila_chrysaetos/)
      et le [hibou grand-duc](/especie/bubo_bubo/), aux côtés de colonies de choucas des tours et de [craves à
      bec rouge](/especie/pyrrhocorax_pyrrhocorax/). Parmi les rapaces forestiers figurent l'aigle botté,
      l'autour des palombes, la buse variable, les milans noir et royal et le faucon hobereau. La lande abrite
      un cortège de passereaux où se distingue l'alouette de Dupont.


      Au sol, le parc accueille chevreuils, sangliers et renards dans les pinèdes, ainsi que le blaireau, la
      fouine, la belette, le lièvre et le lapin de garenne ; des observations isolées de la [loutre
      d'Europe](/especie/lutra_lutra/) sont signalées. Parmi les reptiles figurent le lézard ocellé, le
      psammodrome d'Edwards et les couleuvres de Montpellier, à échelons et vipérine.
    visit: >-
      Commencez par la Casa del Parque à Sepúlveda, établie dans l'ancienne église de Santiago. L'accueil
      propose cartes, sentiers et délivrance des autorisations, tandis que l'exposition offre une promenade
      imaginaire au cœur des gorges : décors évoquant la plaine alluviale, les parois rocheuses et le plateau,
      reconstitution de la Cueva de los Siete Altares avec ses autels wisigothiques et section dédiée aux
      anciens métiers de bergers, carriers, paysans et résiniers. Le centre propose également des actions de
      bénévolat pour installer des nichoirs et des visites guidées.


      La Senda de los Dos Ríos forme une boucle de cinq kilomètres qui part et revient à la maison du parc,
      idéale pour l'observation des oiseaux et le pistage des mammifères. La Senda de la Molinilla, de faible
      dénivelé, parcourt 3,7 kilomètres aller en quarante-cinq minutes environ. L'itinéraire le plus
      accessible démarre sur l'aire de stationnement au bout de la piste de Villaseca pour rejoindre l'éperon
      rocheux de l'ermitage de San Frutos. Ce sentier linéaire mesure neuf cent vingt-cinq mètres par sens
      pour une durée d'une heure au total. En chemin, un pont de pierre franchit la faille de La Cuchillada
      menant à l'ancien prieuré bénédictin et à ses sépultures anthropomorphes du haut Moyen Âge.
    history: >-
      Éleveurs, tailleurs de pierre, agriculteurs et résiniers ont façonné au fil des siècles les paysages
      préservés aujourd'hui. Grottes ornées de l'âge du bronze, ermitage de San Frutos et bourg de Sepúlveda
      complètent l'intérêt patrimonial du parc.
    before: >-
      Préparez votre excursion depuis la Casa del Parque, qui délivre les autorisations nécessaires et fournit
      cartes et itinéraires.
    around: >-
      Le [Parc naturel Hoces del Río Riaza](/lugar/parque-natural-hoces-del-rio-riaza/) se trouve à vingt-six
      kilomètres et le [Parc national de la Sierra de Guadarrama et Montes de
      Valsaín](/lugar/parque-nacional-de-la-sierra-de-guadarrama/) à environ vingt-sept. Plus loin, le [Parque
      Natural Bardenas Reales de Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) partage le
      percnoptère, le grand-duc et le vautour fauve entre canyons et karst, tout comme le [Parc Natural de la
      Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) avec le grand-duc, le vautour fauve et le faucon
      pèlerin, et le [Priroden Park Rusenski Lom](/lugar/priroden-park-rusenski-lom/) avec le percnoptère et
      le grand-duc.
  de:
    intro: >-
      An der Wand einer Schlucht in Segovia nisten fast 768 Gänsegeierpaare. Es sind so viele, dass man sie
      nicht suchen muss, sondern einfach nur nach oben schauen braucht. Der Naturpark Hoces del Río Duratón
      liegt im Nordosten der Provinz Segovia flussabwärts des Städtchens Sepúlveda, wo sich der Fluss in eine
      Schlucht mit mehr als 100 Metern Höhenunterschied eingegraben hat. Rings um die Natur entfaltet sich
      Geschichte: die romanische Einsiedelei San Frutos, Höhlen mit Felsritzungen aus der Bronzezeit und die
      Architektur von Sepúlveda.
    landscape: >-
      Der Duratón lag einst auf einer Kalkfläche und schnitt sie ein; so entstand der Canyon. Er beschreibt
      gewundene Mäander in hartem kreidezeitlichem Kalkstein und Dolomit, flankiert von Felsabbrüchen von über
      100 m Höhe. Zwischen Sepúlveda und dem Stausee Burgomillodo bieten rund 27 km Schluchten mit flachem
      Talboden einen klaren Kontrast: die ockerfarbenen Felswände gegenüber dem grünen Band der
      Ufervegetation. Das Wasser arbeitet unaufhörlich weiter: Die Erosion formt den Canyon seit Millionen von
      Jahren. Im Südwesten herrscht eine andere Welt vor: äolische Sande in Form von Dünen, geformt von den
      vorherrschenden Nordwestwinden.


      Vier Lebensräume gliedern den Park. Die Hochebene oben trägt lichte Sadebaum- und Wacholderbestände, die
      durch menschliche Eingriffe aufgelichtet und vielerorts durch Thymian- und Ginsterheiden mit
      steppenartigem Charakter ersetzt wurden; hier herrschen extreme Bedingungen mit klirrender Kälte und
      Sturm im Winter, sengender Sommerhitze und monatelanger Trockenheit. Auf den Sandböden im Südwesten
      wachsen aufgeforstete See-Kiefernwälder. An den Steilwänden gedeihen bemerkenswerte Felsenpflanzen:
      Fetthennen, Nabelkräuter und iberische Endemiten wie Biscutella valentina, Dianthus pungens und
      Campanula hispanica. Am Talboden säumen Reste von Auwäldern aus Weiden, Eschen, Pappeln, Ulmen und Erlen
      das Wasser.
    wildlife: >-
      Blicke zu den Felsen hinauf. Neben dem [Gänsegeier](/especie/gyps_fulvus/), dem Wahrzeichen des Parks,
      brüten hier [Schmutzgeier](/especie/neophron_percnopterus/), [Wanderfalke](/especie/falco_peregrinus/),
      Turmfalke, [Steinadler](/especie/aquila_chrysaetos/) und [Uhu](/especie/bubo_bubo/), dazu Kolonien von
      Dohlen und [Alpenkrähen](/especie/pyrrhocorax_pyrrhocorax/). Unter den Waldgreifvögeln fallen
      Zwergadler, Habicht, Mäusebussard, Schwarz- und Rotmilan sowie Baumfalke auf. Die Hochebene beherbergt
      eine Singvogelgemeinschaft, in der die Dupontlerche herausragt.


      Am Boden durchstreifen Rehe, Wildschweine und Füchse die Kiefernwälder, begleitet von Dachs,
      Steinmarder, Mauswiesel, Feldhase und Wildkaninchen; vereinzelt gibt es Beobachtungen des [Eurasischen
      Fischotters](/especie/lutra_lutra/). Bei den Reptilien kommen Perleidechse, Fransenfinger und
      Eidechsennatter, Treppennatter sowie Vipernatter vor.
    visit: >-
      Beginne im Besucherzentrum Casa del Parque in Sepúlveda in der ehemaligen Kirche Santiago. Der Empfang
      bietet Karten, Wegepläne und Genehmigungen, während die Ausstellung einem Spaziergang durch den Canyon
      gleicht: Schautafeln stellen Aue, Felsen und Hochfläche dar, ergänzt durch eine Nachbildung der Höhle
      Cueva de los Siete Altares mit westgotischen Altären und einen Bereich über die traditionellen Berufe
      der Hirten, Steinmetze, Bauern und Harzgewinner. Das Zentrum bietet zudem
      Nistkasten-Freiwilligenprogramme und Führungen an.


      Die Senda de los Dos Ríos ist ein fünf Kilometer langer Rundweg, der am Besucherzentrum beginnt und
      endet; hier empfiehlt der Park Vogelbeobachtungen und Spurensuche nach Säugetieren. Die einfache Senda
      de la Molinilla führt über 3,7 Kilometer in etwa fünfundvierzig Minuten one-way durch das Tal. Der
      leichteste Zugang zu den Schluchten beginnt am Parkplatz am Ende des Weges von Villaseca und führt zur
      Felszunge der Einsiedelei San Frutos. Der Pfad zur Einsiedelei ist geradlinig, misst
      neunhundertfünfundzwanzig Meter je Richtung und beansprucht eine Stunde insgesamt. Unterwegs überquert
      eine Steinbrücke die Felsspalte La Cuchillada zum ehemaligen Benediktinerkloster mit
      frühmittelalterlichen anthropomorphen Gräbern.
    history: >-
      Viehzüchter, Steinmetze, Bauern und Harzsammler lebten historisch vom Duratón und prägten die
      Kulturlandschaft, die heute geschützt ist. Bronzezeitliche Höhlenritzungen, die Einsiedelei San Frutos
      und das historische Sepúlveda runden das Kulturgut ab.
    before: >-
      Plane deinen Besuch über die Casa del Parque, die Genehmigungen vergibt sowie Karten und
      Wegbeschreibungen aushändigt.
    around: >-
      Der [Parque Natural Hoces del Río Riaza](/lugar/parque-natural-hoces-del-rio-riaza/) liegt rund
      sechsundzwanzig Kilometer entfernt und der [Parque Nacional de la Sierra de Guadarrama y Montes de
      Valsaín](/lugar/parque-nacional-de-la-sierra-de-guadarrama/) etwa siebenundzwanzig. Weiter entfernt
      teilen die [Parque Natural Bardenas Reales de
      Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) Schmutzgeier, Uhu und Gänsegeier in
      Schluchten und Karst, ebenso wie der [Parc Natural de la Serra de
      Montsant](/lugar/parc-natural-de-la-serra-de/) mit Uhu, Gänsegeier und Wanderfalke sowie der [Priroden
      Park Rusenski Lom](/lugar/priroden-park-rusenski-lom/) mit Schmutzgeier und Uhu.
  it:
    intro: >-
      Sulla parete di una gola di Segovia nidificano quasi 768 coppie di grifoni. Sono così tante che la
      meraviglia non sta nel cercarle, ma semplicemente nell'alzare lo sguardo. Il Parco naturale Hoces del
      Río Duratón si trova nel nord-est di Segovia, a valle del borgo di Sepúlveda, dove il fiume si è scavato
      un canyon con più di 100 metri di dislivello. E attorno alla natura scorre la storia: l'eremo romanico
      di San Frutos, grotte con incisioni dell'Età del Bronzo e l'insieme monumentale di Sepúlveda.
    landscape: >-
      Il Duratón si impostò su una superficie calcarea incidendola fino a decapitarla: così nacque la gola.
      Descrive un corso a meandri serrati in calcari duri e dolomie del Cretacico, con pareti scoscese che
      superano i 100 m di altezza. Tra Sepúlveda e il bacino di Burgomillodo, circa 27 km di gole a fondo
      piatto offrono un netto contrasto: i toni ocra delle scogliere contro la striscia verde della
      vegetazione di ripa. L'acqua continua a scavare: l'erosione plasma il canyon da milioni di anni. A
      sud-ovest il paesaggio muta: sabbie eoliche formano dune allineate ai venti dominanti di nord-ovest.


      Quattro ambienti scandiscono il parco. L'altopiano sommitale accoglie boschetti aperti di ginepro e
      sabina, degradati dall'uomo e sostituiti da garighe di timo e ginestra spinosa ad aspetto
      pseudosteppico; è un ambiente estremo, con gelo e vento pungente d'inverno, arsura in estate e
      prolungata siccità. Sulle sabbie sud-occidentali crescono pinete impiantate di pino marittimo. Sulle
      rupi prosperano piante originali: borracine, ombelichi di Venere ed endemismi iberici come Biscutella
      valentina, Dianthus pungens e Campanula hispanica. Sul fondo della valle resistono residui di bosco
      ripariale con salici, frassini, pioppi, olmi e ontani.
    wildlife: >-
      Guarda le pareti rocciose. Oltre al [grifone](/especie/gyps_fulvus/), il rapace più rappresentativo, vi
      nidificano il [capovaccaio](/especie/neophron_percnopterus/), il [falco
      pellegrino](/especie/falco_peregrinus/), il gheppio, l'[aquila reale](/especie/aquila_chrysaetos/) e il
      [gufo reale](/especie/bubo_bubo/), con colonie di taccole e [gracchi
      corallini](/especie/pyrrhocorax_pyrrhocorax/). Tra i rapaci di bosco figurano l'aquila minore, l'astore,
      la poiana, il nibbio bruno e reale e il lodolaio. L'altopiano sostiene una comunità di passeriformi in
      cui spicca l'allodola di Dupont.


      Sul terreno, caprioli, cinghiali e volpi popolano le pinete, assieme a tassi, faine, donnole, lepri e
      conigli selvatici; si registra qualche avvistamento isolato della [lontra
      europea](/especie/lutra_lutra/). Tra i rettili compaiono la lucertola ocellata, il colubro lacertino e
      le vipere e bisce d'acqua.
    visit: >-
      Inizia dalla Casa del Parque a Sepúlveda, nell'antica chiesa di Santiago. L'accoglienza fornisce mappe,
      itinerari e gestione dei permessi, e la mostra propone un percorso guidato nel canyon: pannelli su
      fondovalle, rupi e altopiano, una riproduzione della grotta Cueva de los Siete Altares con altari
      visigoti e una sezione dedicata agli antichi mestieri di pastori, scalpellini, contadini e resinatori.
      Il centro organizza anche volontariato per installare nidi artificiali e visite guidate.


      La Senda de los Dos Ríos è un anello di cinque chilometri che parte e termina al centro visite, ideale
      per il birdwatching e il riconoscimento delle tracce dei mammiferi. La Senda de la Molinilla, facile,
      copre 3,7 chilometri all'andata in circa quarantacinque minuti. Il percorso più agevole nelle gole parte
      dal parcheggio al termine della strada sterrata di Villaseca e conduce allo sperone roccioso dell'eremo
      di San Frutos. Il sentiero per l'eremo è lineare, misura novecentoventicinque metri per senso di marcia
      e richiede un'ora in tutto. Lungo il cammino, un ponte di pietra valica la fenditura di La Cuchillada e
      introduce all'antico cenobio benedettino, con tombe antropomorfe altomedievali nel cimitero.
    history: >-
      Pastori, scalpellini, agricoltori e raccoglitori di resina hanno vissuto per secoli del Duratón,
      forgiando il paesaggio protetto odierno. Grotte con incisioni dell'Età del Bronzo, l'eremo di San Frutos
      e il borgo di Sepúlveda impreziosiscono il parco.
    before: >-
      Pianifica l'escursione partendo dalla Casa del Parque, che gestisce le autorizzazioni e distribuisce
      mappe e guide ai sentieri.
    around: >-
      Il [Parque Natural Hoces del Río Riaza](/lugar/parque-natural-hoces-del-rio-riaza/) dista circa ventisei
      chilometri e il [Parque Nacional de la Sierra de Guadarrama y Montes de
      Valsaín](/lugar/parque-nacional-de-la-sierra-de-guadarrama/) circa ventisette. Più lontano, il [Parque
      Natural Bardenas Reales de Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) condivide
      capovaccaio, gufo reale e grifone tra gole e formazioni carsiche, così come il [Parc Natural de la Serra
      de Montsant](/lugar/parc-natural-de-la-serra-de/) con gufo reale, grifone e falco pellegrino, e il
      [Priroden Park Rusenski Lom](/lugar/priroden-park-rusenski-lom/) con capovaccaio e gufo reale.
  pt:
    intro: >-
      Nas arribas de um desfiladeiro de Segóvia nidificam quase 768 casais de abutre-fouveiro. São tantos que
      o espetáculo não consiste em procurá-los, mas simplesmente em erguer os olhos. O Parque Natural Hoces
      del Río Duratón situa-se no nordeste de Segóvia, a jusante da vila de Sepúlveda, onde o rio se encaixou
      num desfiladeiro com mais de 100 metros de desnível. Ao redor da natureza pulsa a história: a ermida
      românica de San Frutos, grutas com gravuras da Idade do Bronze e o conjunto monumental de Sepúlveda.
    landscape: >-
      O Duratón assentou sobre uma superfície calcária e degolou-a, dando origem ao desfiladeiro. Descreve um
      curso em meandros talhados em calcários duros e dolomitos cretácicos, com escarpas que podem superar os
      100 m de desnível. Entre Sepúlveda e a albufeira de Burgomillodo, cerca de 27 km de gargantas de fundo
      plano criam um forte contraste: os tons ocre das arribas frente à faixa verde da mata ribeirinha. A água
      continua a esculpir: a erosão modela o desfiladeiro há milhões de anos. A sudoeste desenha-se outro
      cenário: areias eólicas em forma de dunas, orientadas pelos ventos dominantes de noroeste.


      Quatro ambientes estruturam o parque. O planalto cimeiro ostenta sabinais e zimbrais abertos, degradados
      pela atividade humana e substituídos por tomilhais e tojeiras de feição pseudoestépica; é um espaço de
      condições extremas, com frio e vento cortantes no inverno, calor tórrido no verão e seca estival
      prolongada. Nas areias do sudoeste medram pinhais de pinheiro-bravo plantados pelo homem. Nas escarpas
      prosperam plantas singulares: fiteiras, umbigos-de-vénus e endemismos ibéricos como Biscutella
      valentina, Dianthus pungens e Campanula hispanica. No fundo do vale subsistem restos de mata ripícola
      com salgueiros, freixos, choupos, olmos e amieiros.
    wildlife: >-
      Olha para as escarpas. Além do [abutre-fouveiro](/especie/gyps_fulvus/), a ave mais emblemática,
      nidificam aqui o [abutre-do-egito](/especie/neophron_percnopterus/), o
      [falcão-peregrino](/especie/falco_peregrinus/), o francelho-comum, a
      [águia-real](/especie/aquila_chrysaetos/) e o [bufo-real](/especie/bubo_bubo/), além de colónias de
      gralhas-de-nuca-cinzenta e de [gralhas-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/). Entre as
      rapinas florestais destacam-se a águia-calçada, o açor, a águia-de-asa-redonda, os milhafres preto e
      real e o óstio. O planalto sustenta uma comunidade de passeriformes onde avulta a calhandra-de-dupont.


      No solo, o parque abriga corços, javalis e raposas nos pinhais, bem como texugos, doninhas, fuinhas,
      lebres e coelhos-bravos; regista-se alguma observação isolada da
      [lontra-europeia](/especie/lutra_lutra/). Entre os répteis contam-se o sardão, a
      lagartixa-de-dedos-denteados e várias cobras.
    visit: >-
      Começa pela Casa del Parque, em Sepúlveda, na antiga igreja de Santiago. A receção disponibiliza mapas,
      percursos e gestão de autorizações, e a exposição é um passeio imaginário pelas gargantas: painéis que
      recriam a várzea, as arribas e o planalto, uma réplica da Cueva de los Siete Altares com altares
      visigóticos e um setor dedicado aos ofícios de pastores, canteiros, agricultores e resineiros. O centro
      propõe ainda voluntariado para colocação de caixas-ninho e visitas guiadas.


      A Senda de los Dos Ríos é um circuito de cinco quilómetros com início e fim no centro de acolhimento,
      ideal para observação de aves e itinerário para seguir pegadas de mamíferos. A Senda de la Molinilla, de
      baixa dificuldade, percorre 3,7 quilómetros só de ida em cerca de quarenta e cinco minutos. O percurso
      mais acessível pelas gargantas parte do parque de estacionamento onde termina o caminho de Villaseca e
      dirige-se ao esporão rochoso da ermida de San Frutos. O caminho para a ermida é linear, mede novecentos
      e vinte e cinco metros por sentido e demora uma hora no total. Pelo caminho, uma ponte de pedra cruza a
      fenda de La Cuchillada e conduz ao antigo cenóbio beneditino, com sepulturas antropomórficas
      altomedievais no seu cemitério.
    history: >-
      Pastores, canteiros, lavradores e resineiros viveram historicamente do Duratón, forjando a paisagem
      cultural hoje protegida. Grutas com gravuras da Idade do Bronze, a ermida de San Frutos e a vila de
      Sepúlveda enriquecem o valor histórico do parque.
    before: >-
      Planeia a visita a partir da Casa del Parque, que gere as autorizações e fornece mapas e guiões de
      percursos.
    around: >-
      O [Parque Natural Hoces del Río Riaza](/lugar/parque-natural-hoces-del-rio-riaza/) fica a cerca de vinte
      e seis quilómetros e o [Parque Nacional de la Sierra de Guadarrama y Montes de
      Valsaín](/lugar/parque-nacional-de-la-sierra-de-guadarrama/) a cerca de vinte e sete. Mais longe, o
      [Parque Natural Bardenas Reales de Navarra](/lugar/parque-natural-bardenas-reales-de-navarra/) partilha
      o abutre-do-egito, o bufo-real e o abutre-fouveiro entre desfiladeiros e relevo cárstico, tal como o
      [Parc Natural de la Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) com bufo-real,
      abutre-fouveiro e falcão-peregrino, e o [Priroden Park Rusenski Lom](/lugar/priroden-park-rusenski-lom/)
      com abutre-do-egito e bufo-real.
