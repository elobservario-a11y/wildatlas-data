resumen:
  es: >-
    El primer Parque Nacional de Alemania (1970), que forma junto a Šumava la mayor masa boscosa no
    interrumpida de Europa Central.
  en: >-
    Germany's first National Park (1970), forming alongside Šumava the largest unbroken forest tract in
    Central Europe.
  fr: >-
    Le premier parc national d’Allemagne (1970), formant avec la Šumava le plus grand massif forestier continu
    d’Europe centrale.
  de: >-
    Der erste Nationalpark Deutschlands (1970), der zusammen mit Šumava das größte zusammenhängende Waldgebiet
    Mitteleuropas bildet.
  it: >-
    Il primo Parco Nazionale della Germania (1970), che forma insieme alla Šumava la più vasta copertura
    forestale continua dell’Europa centrale.
  pt: >-
    O primeiro Parque Nacional da Alemanha (1970), formando junto a Šumava o maior maciço florestal contínuo
    da Europa Central.
