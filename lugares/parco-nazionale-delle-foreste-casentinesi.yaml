resumen:
  es: >-
    Una de las masas forestales más antiguas y mejor conservadas de Europa, albergando el nacimiento del río
    Arno en el Monte Falterona.
  en: >-
    One of the oldest and best-preserved forest tracts in Europe, cradling the source of the Arno River on
    Monte Falterona.
  fr: >-
    L'un des massifs forestiers les plus anciens et les mieux préservés d'Europe, abritant la source du fleuve
    Arno sur le Monte Falterona.
  de: >-
    Eines der ältesten und am besten erhaltenen Waldgebiete Europas, in dem die Quelle des Arno am Monte
    Falterona entspringt.
  it: >-
    Uno dei complessi forestali più antichi e meglio conservati d'Europa, custode delle sorgenti del fiume
    Arno sul Monte Falterona.
  pt: >-
    Uma das manchas florestais mais antigas e mais bem preservadas da Europa, acolhendo a nascente do rio Arno
    no Monte Falterona.
