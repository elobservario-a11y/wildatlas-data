texto:
  es:
    intro: >-
      A fines de septiembre, cuando cae la tarde en los bosques de Ridracoli, empieza un sonido que se oye de
      lejos: el bramido del ciervo. Es una de las razones por las que el Parque Nacional de las Foreste
      Casentinesi, Monte Falterona y Campigna se visita en otoño, cuando los verdes del bosque se vuelven
      ámbar y rojizo. El parque cubre las dos vertientes del Apenino tosco-romañolo, entre Emilia-Romaña y
      Toscana, y el 80 % de su territorio es bosque.
    landscape: >-
      El parque se apoya en la cresta del Apenino. Las altitudes van de 400 a 1.658 metros: el Monte Falco
      (1.658 m) y el Monte Falterona (1.654 m), de donde nace el Arno, son las cimas más altas. Del lado
      romañolo domina la formación margoso-arenácea, de sedimentos marinos profundos con grandes bancos de
      arenisca; de allí nacen todos los cursos de agua. No hay lagos naturales, solo el embalse de Ridracoli.


      La geología se deja ver en una ruta concreta: la cascada del Acquacheta, de más de 70 metros, que cita
      Dante en la Divina Comedia. Cae sobre un afloramiento rocoso donde alternan areniscas y margas, y
      arranca en la Piana dei Romiti, que es el relleno de un antiguo lago formado cuando un deslizamiento
      cerró el curso del Fosso Acquacheta. Es una de las unas ochenta singularidades geomorfológicas que el
      parque ha catalogado.
    wildlife: >-
      El haya manda desde los 900 o 1.000 metros hacia arriba, a veces con el abeto blanco que el hombre
      favoreció. La flora es rica: 1.357 especies de plantas, 44 de ellas orquídeas, y 845 de hongos, algunos
      nuevos para la ciencia, hallados en Sasso Fratino. En esa reserva el bosque se deja a su evolución
      natural, y por eso viven allí invertebrados xilófagos, hongos y descomponedores que no se encuentran en
      otras partes.


      El [lobo](/especie/canis_lupus/) tiene aquí la mayor población del Apenino septentrional, unos cincuenta
      ejemplares en nueve manadas posibles. De los ciervos hay unos 2.000 en el parque, casi 400 de ellos
      machos reproductores. Entre las aves se han registrado 139 especies, 77 nidificantes. El [pico
      negro](/especie/dryocopus_martius/), único en el Apenino septentrional, se detecta desde el año 2000; y
      de las rapaces diurnas, siete nidifican con seguridad, entre ellas el [águila
      real](/especie/aquila_chrysaetos/). Los anfibios y reptiles suman 25 especies, y entre ellas hay un
      endemismo apenino, el sapillo de vientre amarillo.


      El otoño es la estación grande: el color del bosque a fines de octubre y la berrea del ciervo a fines de
      septiembre.
    visit: >-
      Para empezar, los Sentieri Natura: nueve senderos pensados para recorrerse con facilidad, con puntos de
      observación y paneles sobre geomorfología, vegetación, fauna e historia. El de Acquacheta tiene nueve
      kilómetros y 250 metros de desnivel. Para quienes quieren más, el Sentiero delle Foreste Sacre recorre
      más de 90 km en siete etapas, desde el Lago di Ponte di Tredozio hasta La Verna.


      Para entender la fauna hay varios recursos. En Ridracoli se organiza una caminata de atardecer, de unas
      dos horas y cinco kilómetros, para escuchar la berrea y conocer cómo se monitoriza. En Moggiona hay un
      recorrido del lobo con la guarida reconstruida y, al final, un pequeño observatorio en un claro del
      bosque. El parque ofrece sesiones didácticas de wolf howling, limitadas a 24 y solo con guías
      autorizados, en noviembre, diciembre y enero. Los voluntarios participan en el censo del ciervo y hay
      turnos de voluntariado repartidos por todo el año.


      Los centros de visita explican el territorio: Premilcuore trata la fauna y el agua como un «museo para
      los más pequeños»; el de Londa, a orillas del lago artificial, el paisaje y su transformación; el Punto
      de Información de Camaldoli incluye un museo ornitológico. Los jardines botánicos de Valbonella, a tres
      kilómetros de Corniolo, y el Museo y Arboreto Carlo Siemoni, en Badia Prataglia, ayudan a conocer la
      flora.
    history: >-
      Los etruscos ya veneraban a sus dioses en el Lago degli Idoli, al pie del Falterona. Siglos después, el
      bosque lo cuidaron los monjes: San Romualdo en Camaldoli desde 1012 y San Francisco en La Verna en 1213.
      La madera de Campigna dio mástiles a los barcos de Pisa y Livorno.


      El parque protege siete reservas naturales estatales, tres integrales y cuatro biogenéticas. Sasso
      Fratino es la primera reserva integral de Italia (1959), y desde el 7 de julio de 2017 ella y las hayas
      vetustas del parque son Patrimonio Mundial de la UNESCO. El Passo dei Mandrioli reúne además la primera
      zona wilderness de Italia, el Fosso del Capanno, creada en 1988.
    before: >-
      Consulta el estado de los senderos antes de salir: el parque lo publica y recomienda mirar la
      transitabilidad. La recogida de setas está regulada y solo se permite ciertos días de la semana.
    around: >-
      No hay vecinos publicados en el atlas, pero comparte pico negro y lobo con la [Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), con el [Badínsky
      Prales](/lugar/badinsky-prales-primeval-forest/), con
      [Aspromonte](/lugar/parco-nazionale-dell-aspromonte/) y con la
      [Sila](/lugar/parco-nazionale-della-sila/).
  en:
    intro: >-
      In late September, as dusk falls over the forests of Ridracoli, a distant call echoes through the trees:
      the rutting roar of the red deer. It is one of the main reasons to visit the Foreste Casentinesi, Monte
      Falterona and Campigna National Park in autumn, when the green canopy turns shades of amber and russet.
      The park spans both slopes of the Tuscan-Romagnolo Apennines, between Emilia-Romagna and Tuscany, and 80
      % of its territory is forest.
    landscape: >-
      The park straddles the ridge of the Apennines. Altitudes range from 400 to 1,658 metres: Monte Falco
      (1,658 m) and Monte Falterona (1,654 m), where the Arno rises, are the highest peaks. On the Romagna
      flank, the marly-arenaceous formation dominates, formed by deep marine sediments with thick sandstone
      strata from which all watercourses spring. There are no natural lakes, only the Ridracoli reservoir.


      The geology reveals itself along a specific trail: the Acquacheta waterfall, tumbling more than 70
      metres, famously cited by Dante in the Divine Comedy. It cascades over a rocky ledge of alternating
      sandstone and marl, starting at the Piana dei Romiti, the bed of an ancient lake formed when a landslide
      dammed the Fosso Acquacheta. It is one of around eighty geomorphological landmarks catalogued by the
      park.
    wildlife: >-
      Beech takes over from 900 or 1,000 metres upward, occasionally accompanied by silver fir favored by
      human management. The flora is exceptionally rich: 1,357 plant species, including 44 orchids, and 845
      fungi, some new to science, discovered in Sasso Fratino. In that reserve the forest is left to its
      natural evolution, providing habitat for saproxylic invertebrates, fungi, and decomposers found nowhere
      else.


      The [grey wolf](/especie/canis_lupus/) has its largest northern Apennine population here, about fifty
      individuals across nine possible packs. There are around 2,000 red deer in the park, almost 400 of them
      breeding stags. Among birds, 139 species have been recorded, 77 of which breed here. The [black
      woodpecker](/especie/dryocopus_martius/), unique in the northern Apennines, has been recorded since the
      year 2000; and among daytime raptors, seven breed with certainty, including the [golden
      eagle](/especie/aquila_chrysaetos/). Amphibians and reptiles total 25 species, among them an Apennine
      endemic, the yellow-bellied toad.


      Autumn is the highlight season: the vibrant canopy in late October and the deer rut in late September.
    visit: >-
      To begin, try the Sentieri Natura: nine easy nature trails featuring observation points and panels on
      geomorphology, flora, fauna, and local history. The Acquacheta trail covers nine kilometres with a
      250-metre elevation gain. For longer treks, the Sentiero delle Foreste Sacre traverses more than 90 km
      in seven stages, from Lago di Ponte di Tredozio to La Verna.


      There are several ways to experience the wildlife. In Ridracoli, an evening walk of about two hours and
      five kilometres lets you listen to the deer rut and learn how herds are monitored. In Moggiona, a wolf
      discovery trail features a reconstructed den and a small woodland clearing observatory. The park offers
      educational wolf howling sessions, limited to 24 participants and led exclusively by licensed guides in
      November, December, and January. Volunteers participate in the annual deer census, with volunteer shifts
      scheduled throughout the year.


      Visitor centres showcase the region: Premilcuore highlights wildlife and water with an interactive
      museum for younger visitors; Londa, by the artificial lake, focuses on landscape transformations; the
      Camaldoli Information Point includes an ornithological museum. The Valbonella botanical gardens, three
      kilometres from Corniolo, and the Carlo Siemoni Museum and Arboretum in Badia Prataglia offer deep
      insight into the local flora.
    history: >-
      The Etruscans already worshipped their gods at Lago degli Idoli, at the foot of Falterona. Centuries
      later, monks took care of the forest: Saint Romuald at Camaldoli from 1012 and Saint Francis at La Verna
      in 1213. The timber of Campigna supplied masts for ships from Pisa and Livorno.


      The park protects seven state nature reserves, three strict and four biogenetic. Sasso Fratino is
      Italy's first strict nature reserve (1959), and since 7 July 2017 it and the park's ancient beech woods
      have been a UNESCO World Heritage Site. Passo dei Mandrioli also holds Italy's first wilderness area,
      the Fosso del Capanno, created in 1988.
    before: >-
      Check trail conditions before setting out: the park publishes updates and recommends checking whether
      routes are passable. Mushroom picking is regulated and only permitted on certain days of the week.
    around: >-
      There are no neighbours published in the atlas, but it shares black woodpecker and wolf with the
      [Reserva de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), with [Badínsky
      Prales](/lugar/badinsky-prales-primeval-forest/), with
      [Aspromonte](/lugar/parco-nazionale-dell-aspromonte/) and with
      [Sila](/lugar/parco-nazionale-della-sila/).
  fr:
    intro: >-
      À la fin de septembre, quand le soir tombe sur les forêts de Ridracoli, s'élève un son venu de loin : le
      brame du cerf. C'est l'une des raisons pour lesquelles le parc national des Foreste Casentinesi, Monte
      Falterona et Campigna se visite en automne, quand la parure verte du bois tourne à l'ambre et au roux.
      Le parc s'étend sur les deux versants de l'Apennin tosco-romagnol, entre l'Émilie-Romagne et la Toscane,
      et 80 % de son territoire est boisé.
    landscape: >-
      Le parc repose sur la crête des Apennins. Les altitudes s'échelonnent de 400 à 1 658 mètres : le Monte
      Falco (1 658 m) et le Monte Falterona (1 654 m), d'où sourd l'Arno, sont les plus hauts sommets. Sur le
      versant romagnol domine la formation marno-gréseuse, issue de sédiments marins profonds aux épais bancs
      de grès d'où naissent tous les cours d'eau. Il n'y a aucun lac naturel, seulement la retenue de
      Ridracoli.


      La géologie se révèle au long d'un parcours emblématique : la cascade de l'Acquacheta, haute de plus de
      70 mètres, citée par Dante dans la Divine Comédie. Elle chute sur un abrupt rocheux alternant grès et
      marnes, et prend naissance à la Piana dei Romiti, ancien lit lacustre comblé après qu'un glissement de
      terrain eut barré le Fosso Acquacheta. C'est l'une des quelque quatre-vingts singularités
      géomorphologiques répertoriées par le parc.
    wildlife: >-
      Le hêtre règne à partir de 900 ou 1 000 mètres d'altitude, parfois associé au sapin blanc favorisé par
      l'homme. La flore y est foisonnante : 1 357 espèces de plantes, dont 44 orchidées, et 845 champignons,
      certains nouveaux pour la science, découverts à Sasso Fratino. Dans cette réserve, la forêt évolue
      librement, abritant invertébrés saproxyliques, champignons et décomposeurs introuvables ailleurs.


      Le [loup](/especie/canis_lupus/) possède ici la plus forte population du nord des Apennins, avec une
      cinquantaine d'individus répartis en neuf meutes possibles. Le cerf compte environ 2 000 individus dans
      le parc, dont près de 400 mâles reproducteurs. Parmi les oiseaux, 139 espèces ont été recensées, dont 77
      nicheuses. Le [pic noir](/especie/dryocopus_martius/), unique dans le nord de l'Apennin, y est repéré
      depuis l'an 2000 ; et parmi les rapaces diurnes, sept nichent avec certitude, dont l'[aigle
      royal](/especie/aquila_chrysaetos/). Les amphibiens et reptiles rassemblent 25 espèces, dont un
      endémisme apennin, le sonneur à ventre jaune.


      L'automne constitue la grande saison : la parure flamboyante de la forêt fin octobre et le brame du cerf
      fin septembre.
    visit: >-
      Pour débuter, découvrez les Sentieri Natura : neuf sentiers faciles équipés de points d'observation et
      de panneaux sur la géomorphologie, la végétation, la faune et l'histoire. Celui d'Acquacheta fait neuf
      kilomètres et 250 mètres de dénivelé. Pour les randonneurs plus endurants, le Sentiero delle Foreste
      Sacre franchit plus de 90 km en sept étapes, du Lago di Ponte di Tredozio jusqu'à La Verna.


      Plusieurs options s'offrent à vous pour observer la faune. À Ridracoli, une marche au crépuscule
      d'environ deux heures et cinq kilomètres permet d'écouter le brame et de comprendre le suivi des hardes.
      À Moggiona, un itinéraire dédié au loup propose la reconstitution d'une tanière et un affût dans une
      clairière. Le parc organise des séances pédagogiques de hurlement au loup, limitées à 24 participants et
      encadrées uniquement par des guides agréés, en novembre, décembre et janvier. Des bénévoles participent
      au comptage du cerf, avec des sessions de volontariat toute l'année.


      Les maisons du parc éclairent le territoire : Premilcuore aborde la faune et l'eau avec un espace pensé
      pour les plus jeunes ; Londa, au bord du plan d'eau artificiel, expose l'évolution des paysages ; le
      point d'information de Camaldoli comprend un musée ornithologique. Le jardin botanique de Valbonella, à
      trois kilomètres de Corniolo, et le musée arborétum Carlo Siemoni à Badia Prataglia dévoilent la
      richesse végétale.
    history: >-
      Les Étrusques vénéraient déjà leurs dieux au Lago degli Idoli, au pied du Falterona. Des siècles plus
      tard, les moines prirent soin des bois : saint Romuald à Camaldoli dès 1012 et saint François à La Verna
      en 1213. Le bois de Campigna fournit des mâts aux navires de Pise et de Livourne.


      Le parc protège sept réserves naturelles domaniales, trois intégrales et quatre biogénétiques. Sasso
      Fratino est la première réserve intégrale d'Italie (1959), et depuis le 7 juillet 2017, elle et les
      hêtres séculaires du parc sont inscrits au patrimoine mondial de l'UNESCO. Le Passo dei Mandrioli
      rassemble en outre la première zone wilderness d'Italie, le Fosso del Capanno, créée en 1988.
    before: >-
      Consultez l'état des sentiers avant de partir : le parc le publie et recommande de vérifier la
      praticabilité. La cueillette des champignons est réglementée et autorisée seulement certains jours de la
      semaine.
    around: >-
      Il n'y a pas de voisins publiés dans l'atlas, mais il partage le pic noir et le loup avec la [Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), avec [Badínsky
      Prales](/lugar/badinsky-prales-primeval-forest/), avec
      [Aspromonte](/lugar/parco-nazionale-dell-aspromonte/) et avec la
      [Sila](/lugar/parco-nazionale-della-sila/).
  de:
    intro: >-
      Ende September, wenn die Dämmerung über die Wälder von Ridracoli hereinbricht, setzt ein weithin
      hallender Klang ein: das Röhren des Hirsches. Es ist einer der Hauptgründe, den Nationalpark Foreste
      Casentinesi, Monte Falterona und Campigna im Herbst zu besuchen, wenn sich das Laubwerk bernsteinfarben
      und rötlich färbt. Der Park erstreckt sich über beide Flanken des toskanisch-romagnolischen Apennins
      zwischen der Emilia-Romagna und der Toskana, und 80 % seiner Fläche sind bewaldet.
    landscape: >-
      Der Park lehnt sich an den Hauptkamm des Apennins an. Die Höhenlagen reichen von 400 bis 1.658 Meter:
      Der Monte Falco (1.658 m) und der Monte Falterona (1.654 m), an dem der Arno entspringt, sind die
      höchsten Erhebungen. Auf der Seite der Romagna überwiegt die mergelig-sandige Schichtenfolge aus tiefen
      Meeressedimenten mit mächtigen Sandsteinbänken, aus denen sämtliche Wasserläufe quellen. Natürliche Seen
      gibt es nicht, nur den Ridracoli-Stausee.


      Die Geologie tritt auf einer berühmten Route offen zutage: am über 70 Meter hohen Acquacheta-Wasserfall,
      den Dante in der Göttlichen Komödie erwähnt. Er stürzt über Felsbänke aus wechsellagerndem Sandstein und
      Mergel und nimmt seinen Ausgang in der Piana dei Romiti, dem Becken eines ehemaligen Sees, der entstand,
      als ein Bergsturz den Fosso Acquacheta aufstaute. Er zählt zu den rund achtzig geomorphologischen
      Besonderheiten, die der Park katalogisiert hat.
    wildlife: >-
      Ab 900 oder 1.000 Metern Höhe dominiert die Buche, teils vergesellschaftet mit der vom Menschen
      geförderten Weißtanne. Die Flora ist außerordentlich artenreich: 1.357 Pflanzenarten, darunter 44
      Orchideen, sowie 845 Pilzarten, von denen einige in Sasso Fratino neu für die Wissenschaft entdeckt
      wurden. In diesem Reservat bleibt der Wald seiner natürlichen Dynamik überlassen, weshalb dort
      totholzbewohnende Wirbellose, Pilze und Zersetzer leben, die andernorts fehlen.


      Der [Wolf](/especie/canis_lupus/) weist hier die dichteste Population des nördlichen Apennins auf, rund
      fünfzig Tiere in neun möglichen Rudeln. Vom Rothirsch leben etwa 2.000 Tiere im Park, davon fast 400
      fortpflanzungsfähige Hirsche. Unter den Vögeln wurden 139 Arten nachgewiesen, von denen 77 hier brüten.
      Der [Schwarzspecht](/especie/dryocopus_martius/), einzigartig im nördlichen Apennin, wird seit dem Jahr
      2000 erfasst; unter den Taggreifvögeln brüten sieben Arten sicher, darunter der
      [Steinadler](/especie/aquila_chrysaetos/). Amphibien und Reptilien zählen 25 Arten, darunter ein
      Apennin-Endemit, die Gelbbauchunke.


      Der Herbst ist der Höhepunkt: die Färbung der Wälder Ende Oktober und die Hirschbrunft Ende September.
    visit: >-
      Für den Einstieg eignen sich die Sentieri Natura: neun leicht begehbare Naturpfade mit Aussichtspunkten
      und Schautafeln zu Geomorphologie, Vegetation, Tierwelt und Geschichte. Der Acquacheta-Pfad umfasst neun
      Kilometer und 250 Höhenmeter. Wer mehr sucht, wandert auf dem Sentiero delle Foreste Sacre in sieben
      Etappen über mehr als 90 km vom Lago di Ponte di Tredozio bis nach La Verna.


      Um die Tierwelt kennenzulernen, gibt es mehrere Angebote. In Ridracoli wird eine Abendwanderung von rund
      zwei Stunden und fünf Kilometern organisiert, um die Brunft zu hören und das Monitoring zu verstehen. In
      Moggiona führt ein Wolfspfad an einer rekonstruierten Höhle vorbei zu einer kleinen Beobachtungskanzel
      auf einer Waldlichtung. Der Park veranstaltet im November, Dezember und Januar didaktische
      Wolfsheul-Termine, die auf 24 Plätze begrenzt sind und nur von autorisierten Führern geleitet werden.
      Freiwillige unterstützen die Hirschzählung bei ganzjährig organisierten Einsätzen.


      Die Besucherzentren erschließen das Gebiet: Premilcuore widmet sich Tierwelt und Wasser als
      Mitmachmuseum für Kinder; Londa am Stauseeufer zeigt die Landschaftsentwicklung; der Infopunkt Camaldoli
      besitzt ein Vogelkundemuseum. Der Botanische Garten von Valbonella, drei Kilometer von Corniolo
      entfernt, sowie das Museum und Arboretum Carlo Siemoni in Badia Prataglia stellen die Baum- und
      Pflanzenwelt vor.
    history: >-
      Schon die Etrusker verehrten ihre Götter am Lago degli Idoli am Fuß des Falterona. Jahrhunderte später
      hüteten Mönche den Wald: der heilige Romuald in Camaldoli seit 1012 und Franz von Assisi auf La Verna im
      Jahr 1213. Das Holz von Campigna lieferte Masten für die Schiffe aus Pisa und Livorno.


      Der Park schützt sieben staatliche Naturreservate, drei Totalreservate und vier biogenetische
      Schutzgebiete. Sasso Fratino ist Italiens erstes Totalreservat (1959), und seit dem 7. Juli 2017 gehören
      es und die uralten Buchen des Parks zum UNESCO-Welterbe. Am Passo dei Mandrioli liegt zudem Italiens
      erstes Wilderness-Gebiet, der 1988 geschaffene Fosso del Capanno.
    before: >-
      Erkundige dich vor dem Aufbruch nach dem Wegzustand: Der Park veröffentlicht Berichte und rät zur
      Prüfung der Begehbarkeit. Das Sammeln von Pilzen ist geregelt und nur an bestimmten Wochentagen
      gestattet.
    around: >-
      Im Atlas sind keine direkten Nachbarn verzeichnet, doch teilt der Park Schwarzspecht und Wolf mit der
      [Reserva de Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), mit [Badínsky
      Prales](/lugar/badinsky-prales-primeval-forest/), mit
      [Aspromonte](/lugar/parco-nazionale-dell-aspromonte/) und mit der
      [Sila](/lugar/parco-nazionale-della-sila/).
  it:
    intro: >-
      A fine settembre, quando cala la sera sui boschi di Ridracoli, si leva un richiamo che echeggia in
      lontananza: il bramito del cervo. È uno dei motivi per cui il Parco Nazionale delle Foreste Casentinesi,
      Monte Falterona e Campigna si visita in autunno, quando i toni verdi della foresta virano all'ambra e al
      ruggine. Il parco si estende sui due versanti dell'Appennino tosco-romagnolo, tra Emilia-Romagna e
      Toscana, e l'80 % del territorio è coperto da boschi.
    landscape: >-
      Il parco si sviluppa lungo il crinale appenninico. Le quote variano da 400 a 1.658 metri: il Monte Falco
      (1.658 m) e il Monte Falterona (1.654 m), dove nasce l'Arno, sono le vette più alte. Sul versante
      romagnolo prevale la formazione marnoso-arenacea, derivata da sedimenti marini profondi con spessi
      banchi di arenaria da cui sgorgano tutti i corsi d'acqua. Non esistono laghi naturali, soltanto il
      bacino artificiale di Ridracoli.


      La geologia si svela lungo un itinerario emblematico: la cascata dell'Acquacheta, con un salto di oltre
      70 metri celebrato da Dante nella Divina Commedia. Precipita su pareti rocciose in cui si alternano
      arenarie e marne, originandosi dalla Piana dei Romiti, antico bacino lacustre colmatosi dopo che una
      frana sbarrò il corso del Fosso Acquacheta. È una delle circa ottanta peculiarità geomorfologiche
      censite dal parco.
    wildlife: >-
      Il faggio domina a partire dai 900 o 1.000 metri di quota, talvolta associato all'abete bianco favorito
      dalle cure dell'uomo. La flora è straordinaria: 1.357 specie vegetali, tra cui 44 orchidee, e 845 specie
      di funghi, alcune scoperte per la prima volta a Sasso Fratino. In questa riserva il bosco segue la sua
      evoluzione spontanea, offrendo rifugio a invertebrati xilofagi, funghi e decompositori assenti altrove.


      Il [lupo grigio](/especie/canis_lupus/) conta qui la popolazione più densa dell'Appennino
      settentrionale, con una cinquantina di esemplari distribuiti in nove possibili branchi. I cervi sono
      circa 2.000 nel parco, con quasi 400 maschi riproduttori. Tra gli uccelli sono state censite 139 specie,
      delle quali 77 nidificanti. Il [picchio nero](/especie/dryocopus_martius/), unico nell'Appennino
      settentrionale, vi è segnalato dall'anno 2000; e tra i rapaci diurni ne nidificano con certezza sette
      specie, compresa l'[aquila reale](/especie/aquila_chrysaetos/). Anfibi e rettili assommano a 25 specie,
      tra cui un endemismo appenninico, l'ululone dal ventre giallo.


      L'autunno è la stagione regina: il foliage di fine ottobre e il bramito del cervo a fine settembre.
    visit: >-
      Per iniziare, scegli i Sentieri Natura: nove percorsi facili arricchiti da punti di sosta e pannelli su
      geomorfologia, flora, fauna e storia. Quello dell'Acquacheta misura nove chilometri e presenta 250 metri
      di dislivello. Per chi desidera cammini più impegnativi, il Sentiero delle Foreste Sacre copre oltre 90
      km in sette tappe, dal Lago di Ponte di Tredozio fino alla Verna.


      Per comprendere la fauna selvatica esistono varie opportunità. A Ridracoli si tiene un'escursione serale
      di circa due ore e cinque chilometri per ascoltare il bramito e scoprire le tecniche di monitoraggio. A
      Moggiona un percorso dedicato al lupo include la ricostruzione di una tana e un punto di avvistamento in
      una radura. Il parco propone uscite didattiche di wolf howling, riservate a un massimo di 24 persone e
      guidate solo da accompagnatori autorizzati nei mesi di novembre, dicembre e gennaio. I volontari
      collaborano ai censimenti del cervo con turni distribuiti in tutto l'anno.


      I centri visita interpretano il territorio: Premilcuore affronta la fauna e l'acqua con allestimenti per
      ragazzi; quello di Londa, sulle rive dell'invaso, illustra il paesaggio e le sue trasformazioni; il
      Punto Informazioni di Camaldoli comprende un museo ornitologico. Il giardino botanico di Valbonella, a
      tre chilometri da Corniolo, e il Museo e Arboreto Carlo Siemoni a Badia Prataglia illustrano la flora
      appenninica.
    history: >-
      Gli Etruschi celebravano i loro culti già al Lago degli Idoli, ai piedi del Falterona. Secoli più tardi,
      i boschi furono custoditi dai monaci: san Romualdo a Camaldoli dal 1012 e san Francesco alla Verna nel
      1213. Il legname di Campigna fornì gli alberi maestri per le imbarcazioni di Pisa e Livorno.


      Il parco tutela sette riserve naturali statali, tre integrali e quattro biogenetiche. Sasso Fratino è la
      prima riserva integrale d'Italia (1959), e dal 7 luglio 2017 essa e le faggete vetuste del parco sono
      Patrimonio Mondiale UNESCO. Il Passo dei Mandrioli accoglie inoltre la prima area wilderness d'Italia,
      il Fosso del Capanno, istituita nel 1988.
    before: >-
      Controlla lo stato dei sentieri prima di partire: il parco diffonde bollettini aggiornati e consiglia di
      verificare la percorribilità. La raccolta dei funghi è regolamentata ed è permessa solo in precisi
      giorni della settimana.
    around: >-
      Non ci sono vicini registrati nell'atlas, ma il parco condivide picchio nero e lupo con la [Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), con [Badínsky
      Prales](/lugar/badinsky-prales-primeval-forest/), con
      l'[Aspromonte](/lugar/parco-nazionale-dell-aspromonte/) e con la
      [Sila](/lugar/parco-nazionale-della-sila/).
  pt:
    intro: >-
      No final de setembro, ao cair da tarde nas matas de Ridracoli, começa um som que se escuta ao longe: o
      bramido do veado. É uma das razões pelas quais o Parque Nacional das Foreste Casentinesi, Monte
      Falterona e Campigna se visita no outono, quando o verde do arvoredo dá lugar a tons de âmbar e ruivo. O
      parque abrange as duas vertentes dos Apeninos tosco-romanhóis, entre a Emília-Romanha e a Toscana, e 80
      % do seu território é floresta.
    landscape: >-
      O parque assenta na crista dos Apeninos. As altitudes variam entre os 400 e os 1.658 metros: o Monte
      Falco (1.658 m) e o Monte Falterona (1.654 m), onde nasce o Arno, são os cumes mais elevados. Na
      vertente da Romanha domina a formação marnoso-arenítica, composta por sedimentos marinhos profundos com
      espessos bancos de arenito donde brotam todas as linhas de água. Não existem lagos naturais, apenas a
      albufeira de Ridracoli.


      A geologia revela-se num trilho marcante: a cascata de Acquacheta, com mais de 70 metros de
      despenhadeiro, mencionada por Dante na Divina Comédia. Precipita-se sobre bancadas rochosas onde
      alternam arenitos e margas, nascendo na Piana dei Romiti, o leito de um antigo lago formado quando um
      deslizamento travou o Fosso Acquacheta. Trata-se de uma das cerca de oitenta singularidades
      geomorfológicas catalogadas pelo parque.
    wildlife: >-
      A faia domina a partir dos 900 ou 1.000 metros de altitude, associando-se por vezes ao abeto-branco que
      o homem favoreceu. A flora é riquíssima: 1.357 espécies de plantas, entre as quais 44 orquídeas, e 845
      de fungos, alguns inéditos para a ciência, descobertos em Sasso Fratino. Nessa reserva a floresta evolui
      sem interferência, abrigando invertebrados xilófagos, cogumelos e decompositores que não existem noutros
      locais.


      O [lobo-cinzento](/especie/canis_lupus/) concentra aqui a população mais densa dos Apeninos
      setentrionais, com cerca de cinquenta exemplares em nove alcateias possíveis. No parque vivem cerca de
      2.000 veados, dos quais quase 400 são machos reprodutores. Entre a avifauna foram inventariadas 139
      espécies, 77 das quais nidificantes. O [pica-pau-preto](/especie/dryocopus_martius/), único nos Apeninos
      do norte, é registado desde o ano 2000; e quanto a rapinas diurnas, sete nidificam com segurança, entre
      elas a [águia-real](/especie/aquila_chrysaetos/). Os anfíbios e répteis somam 25 espécies, incluindo um
      endemismo apenínico, o bombina-de-barriga-amarela.


      O outono é a grande estação: as cores do bosque no final de outubro e a brama do veado no fim de
      setembro.
    visit: >-
      Para começar, percorre os Sentieri Natura: nove percursos concebidos para caminhadas acessíveis, com
      miradouros e painéis sobre geomorfologia, flora, fauna e história. O de Acquacheta tem nove quilómetros
      e 250 metros de desnível. Para quem procura percursos longos, o Sentiero delle Foreste Sacre cobre mais
      de 90 km em sete etapas, desde o Lago di Ponte di Tredozio até La Verna.


      Para conhecer a fauna existem vários programas. Em Ridracoli organiza-se uma caminhada ao entardecer, de
      cerca de duas horas e cinco quilómetros, para ouvir a brama e conhecer a monitorização dos animais. Em
      Moggiona existe um percurso dedicado ao lobo com uma toca reconstituída e um pequeno posto de observação
      numa clareira. O parque promove sessões didáticas de wolf howling, limitadas a 24 participantes e
      orientadas exclusivamente por guias certificados, em novembro, dezembro e janeiro. Voluntários
      participam no censo do veado ao longo de várias épocas do ano.


      Os centros de interpretação esclarecem o território: Premilcuore aborda a fauna e a água como um espaço
      lúdico para os mais novos; o de Londa, junto à albufeira, retrata a transformação da paisagem; o Posto
      de Informação de Camaldoli alberga um museu ornitológico. O jardim botânico de Valbonella, a três
      quilómetros de Corniolo, e o Museu e Arboreto Carlo Siemoni, em Badia Prataglia, mostram a vegetação da
      serra.
    history: >-
      Os etruscos já veneravam os seus deuses no Lago degli Idoli, no sopé do Falterona. Séculos mais tarde, a
      floresta ficou a cargo dos monges: São Romualdo em Camaldoli desde 1012 e São Francisco em La Verna em
      1213. A madeira de Campigna forneceu mastros para os navios de Pisa e Livorno.


      O parque protege sete reservas naturais estatais, três integrais e quatro biogenéticas. Sasso Fratino é
      a primeira reserva integral de Itália (1959), e desde 7 de julho de 2017 ela e as faias vetustas do
      parque são Património Mundial da UNESCO. O Passo dei Mandrioli reúne ainda a primeira área wilderness de
      Itália, o Fosso del Capanno, criada em 1988.
    before: >-
      Consulta o estado dos trilhos antes de sair: o parque publica boletins e recomenda verificar as
      condições de passagem. A apanha de cogumelos está regulamentada e só é permitida em determinados dias da
      semana.
    around: >-
      Não existem vizinhos publicados no atlas, mas partilha o pica-pau-preto e o lobo com a [Reserva de
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), com [Badínsky
      Prales](/lugar/badinsky-prales-primeval-forest/), com o
      [Aspromonte](/lugar/parco-nazionale-dell-aspromonte/) e com a
      [Sila](/lugar/parco-nazionale-della-sila/).
