resumen:
  es: >-
    El humedal más extenso de las Islas Baleares (1.700 ha), laguna de carrizales salobres con observatorios
    de aves estelares en el bahía de Alcúdia.
  en: >-
    The largest wetland in the Balearic Islands (1,700 ha), a lagoon of brackish reedbeds with outstanding
    bird observation hides in the Bay of Alcúdia.
  fr: >-
    La plus grande zone humide des Îles Baléares (1 700 ha), lagune de roselières saumâtres avec des
    observatoires d'oiseaux remarquables dans la baie d'Alcúdia.
  de: >-
    Das größte Feuchtgebiet der Balearischen Inseln (1 700 ha), eine Lagune aus salzhaltigen Schilfflächen mit
    hervorragenden Vogelbeobachtungsposten in der Bucht von Alcúdia.
  it: >-
    La più grande zona umida delle Isole Baleari (1 700 ha), laguna di canneti salmastri con osservatori
    ornitologici d'eccezione nella baia di Alcúdia.
  pt: >-
    O maior húmido das Ilhas Baleares (1 700 ha), lagoa de caniçais salobros com excelentes observatórios de
    aves na baía de Alcúdia.
unico:
  es: Un humedal con 303 especies de aves y una red de canales obra de una empresa inglesa, en una isla seca.
  en: A wetland with 303 bird species and a network of canals built by a British company, on a dry island.
  fr: >-
    Une zone humide avec 303 espèces d'oiseaux et un réseau de canaux réalisé par une entreprise anglaise, sur
    une île sèche.
  de: >-
    Ein Feuchtgebiet mit 303 Vogelarten und einem Kanalnetz, das eine britische Gesellschaft anlegte, auf
    einer trockenen Insel.
  it: >-
    Una zona umida con 303 specie di uccelli e una rete di canali realizzata da una società inglese, su
    un'isola arida.
  pt: Uma zona húmida com 303 espécies de aves e uma rede de canais obra de uma empresa inglesa, numa ilha seca.
observaciones:
  es: >-
    Se necesita un permiso gratuito, que se pide en el Centro de Información y que incluye mapa y normas de
    uso público. No se pueden coger plantas, animales ni hongos, ni llevarse restos de ellos. Solo se admiten
    perros guía de personas invidentes. Acampar está prohibido en los espacios naturales protegidos de
    Baleares, y tampoco se permiten actividades deportivas como correr, circuitos ecuestres o bicicleta de
    montaña. La vuelta perimetral no es recomendable en los meses de calor intenso, y para disfrutar de la paz
    del parque son mejores los meses de temporada baja. Comprueba antes de ir que el parque esté abierto y su
    horario.
texto:
  es:
    intro: >-
      En una isla seca, un paisaje de puentes y canales. S'Albufera no ofrece cumbres ni grandes animales de
      zoo: ofrece el vuelo ágil de la arpella, el chapoteo de los ánades, el viento moviendo el carrizo y la
      mirada tímida de una tortuga, para quien tenga tiempo de verlos. Es el humedal más extenso e importante
      de las Baleares, un humedal de origen muy antiguo, en la bahía de Alcúdia. Quien cruza sus barreras a
      pie o en bicicleta entra en un mundo tranquilo que pide dejar la prisa fuera.
    landscape: >-
      El agua lo explica todo. La lluvia llega al parque por torrentes y por ullals, afloramientos de aguas
      subterráneas, y en verano entra algo de agua marina que afecta a la vegetación y a la fauna. La humedad
      del suelo mantiene la vegetación viva todo el año, y esta cambia con la profundidad, la cercanía del mar
      y el tipo de terreno. Parte del prado se originó en la era terciaria, pero el humedal actual se formó
      hace menos de 100.000 años; las dunas litorales son más recientes, de unos 10.000.


      Dominan el carrizo, la masiega y la enea. En los canales hay plantas sumergidas como el herbero de hilo
      y la cola de caballo de agua; en las zonas salobres, juncos y plantas halófilas; y entre los árboles
      destacan el álamo blanco, el olmo y el taray. En las dunas, el lirio de mar y otras especies viven
      adaptadas a las difíciles condiciones del arenal. Los hongos suman 205 especies, y una de ellas,
      Psathyrella halofila, nueva para la ciencia, se descubrió aquí en 1992.
    wildlife: >-
      Se han observado hasta 303 especies de aves y 64 crían en el parque, entre sedentarias y estivales. En
      invierno hay más de 10.000 aves, entre ellas ánades y grandes bandadas de estorninos; en los pasos
      migratorios, aves que paran pocos días, y de forma ocasional visitas de divagantes como las
      [grullas](/especie/grus_grus/). La primavera y el otoño, especialmente abril y octubre, coinciden con el
      punto álgido de la migración.


      En el agua destacan la [anguila](/especie/anguilla_anguilla/) y los mugílidos; la rana común es
      abundante y hay culebra viperina y [galápago europeo](/especie/emys_orbicularis/). Hay 22 especies de
      mamíferos, como murciélagos, ratones y ratas, y entre los invertebrados libélulas, escarabajos y más de
      450 especies de mariposas nocturnas.
    visit: >-
      La entrada principal está en la carretera Ma-12, a la altura del Pont dels Anglesos, en Platja de Muro,
      y se cruza a pie o en bicicleta; hay dos entradas más solo para quien va a pie o en bicicleta:
      s'Amarador, por Muro, y el puente de Can Blau, por sa Pobla. Los cuatro itinerarios están señalizados
      con un código de colores y números: sa Roca, es Colombars, Camí d'Enmig-ses Puntes y es Cibollar. El de
      sa Roca llega al montículo de sa Roca tras cruzar un pequeño puente de madera. El de es Colombars se
      desvía a la izquierda pasado un kilómetro, junto al canal Ferragut. El Camí d'Enmig-ses Puntes llega al
      puente de sa Font, bajo el que corre el agua más limpia del parque, y se recomienda en bicicleta. La
      vuelta perimetral, el itinerario tres, mide 12 km. Todo el parque es muy llano: el desnivel es
      prácticamente inexistente.


      En Can Bateman, que fue estación de bombeo y luego fábrica de papel, está hoy el centro de
      interpretación del parque, con pantallas interactivas sobre su patrimonio ambiental, histórico y
      cultural. El parque programa además visitas guiadas y actividades educativas.
    history: >-
      Albufera viene del árabe al-Buhayra, la mar pequeña. Las primeras citas son de época romana, cuando el
      humedal llegaba casi a las puertas de Pollentia. Su aspecto actual se debe, sobre todo, a las obras de
      desecación que hizo entre 1863 y 1871 la New Majorca Land Company, una empresa inglesa con más de 1.500
      obreros. De entonces quedan la red de canales y acequias, como el Gran Canal, y los caminos y puentes,
      entre ellos el de los Anglesos. Fue declarado parque natural el 28 de enero de 1988 y es también zona
      húmeda Ramsar y parte de la red Natura 2000.
    before: >-
      Se necesita un permiso gratuito, que se pide en el Centro de Información y que incluye mapa y normas de
      uso público. No se pueden coger plantas, animales ni hongos, ni llevarse restos de ellos. Solo se
      admiten perros guía de personas invidentes. Acampar está prohibido en los espacios naturales protegidos
      de Baleares, y tampoco se permiten actividades deportivas como correr, circuitos ecuestres o bicicleta
      de montaña. La vuelta perimetral no es recomendable en los meses de calor intenso, y para disfrutar de
      la paz del parque son mejores los meses de temporada baja. Comprueba antes de ir que el parque esté
      abierto y su horario.
    around: >-
      La [Serra de Tramuntana](/lugar/serra-de-tramuntana/), a unos trece kilómetros, ofrece el contraste de
      la montaña frente al humedal llano. Más lejos, la [Laguna de Venecia](/lugar/laguna-di-venezia/)
      comparte con s'Albufera el galápago europeo y su carácter de humedal costero.
  en:
    intro: >-
      On a dry island, a landscape of bridges and canals. S'Albufera does not offer summits or large zoo
      animals: it offers the agile flight of the marsh harrier, the splashing of mallards, the wind moving the
      reeds and the shy glance of a tortoise, for those who have time to see them. It is the largest and most
      important wetland in the Balearics, a wetland of very ancient origin, in the Bay of Alcúdia. Those who
      cross its barriers on foot or by bicycle enter a quiet world that asks you to leave haste behind.
    landscape: >-
      Water explains everything. Rainfall reaches the park through torrents and through ullals, springs of
      groundwater, and in summer some seawater enters, affecting vegetation and fauna. Soil moisture keeps
      vegetation alive all year, and it changes with depth, proximity to the sea and terrain type. Part of the
      meadow originated in the Tertiary, but the current wetland formed less than 100,000 years ago; the
      coastal dunes are more recent, about 10,000 years old.


      Reed, bulrush and cattail dominate. In the canals there are submerged plants such as water hornwort and
      water horsetail; in the brackish zones, rushes and halophyte plants; and among the trees white poplar,
      elm and tamarisk stand out. On the dunes, the sea iris and other species live adapted to the harsh
      conditions of the sandy terrain. Fungi number 205 species, and one of them, Psathyrella halofila, new to
      science, was discovered here in 1992.
    wildlife: >-
      Up to 303 bird species have been observed and 64 breed in the park, including resident and summer
      species. In winter there are more than 10,000 birds, including mallards and large starling flocks;
      during migration, birds that stop for a few days, and occasionally vagrant visitors such as
      [cranes](/especie/grus_grus/). Spring and autumn, especially April and October, coincide with the peak
      of migration.


      In the water the [eel](/especie/anguilla_anguilla/) and mullets stand out; the marsh frog is abundant
      and there are the viperine snake and the [European pond turtle](/especie/emys_orbicularis/). There are
      22 mammal species, such as bats, mice and rats, and among the invertebrates dragonflies, beetles and
      more than 450 moth species.
    visit: >-
      The main entrance is on the Ma-12 road, at the level of the Pont dels Anglesos in Platja de Muro, and is
      crossed on foot or by bicycle; there are two more entrances only for those going on foot or by bicycle:
      s'Amarador from Muro, and the Pont de Can Blau bridge from sa Pobla. The four colour-coded and numbered
      routes are: Sa Roca, Es Colombars, Camí d'Enmig-ses Puntes and Es Cibollar. The Sa Roca route reaches
      the Sa Roca hillock after crossing a small wooden bridge. The Es Colombars route turns left after one
      kilometre, beside the Ferragut canal. The Camí d'Enmig-ses Puntes reaches the Pont de sa Font bridge,
      under which flows the cleanest water in the park, and is recommended by bicycle. The perimeter circuit,
      route three, is 12 km long. The whole park is very flat: the elevation change is virtually nil.


      At Can Bateman, once a pumping station and later a paper factory, the park interpretation centre now
      stands, with interactive displays on its environmental, historical and cultural heritage. The park also
      runs guided visits and educational activities.
    history: >-
      Albufera comes from the Arabic al-Buhayra, the small sea. The first references date from Roman times,
      when the wetland almost reached the gates of Pollentia. Its current appearance is due above all to the
      drainage works carried out between 1863 and 1871 by the New Majorca Land Company, a British company with
      more than 1,500 workers. From that time the network of canals and ditches remains, such as the Gran
      Canal, and roads and bridges, including the Pont dels Anglesos. It was declared a natural park on 28
      January 1988 and is also a Ramsar wetland and part of the Natura 2000 network.
    before: >-
      A free permit is needed, obtainable at the Information Centre, which includes a map and rules for public
      use. Plants, animals and fungi may not be collected, nor remains of them taken away. Only guide dogs for
      blind people are admitted. Camping is prohibited in the protected natural spaces of the Balearics, and
      sports activities such as running, equestrian circuits or mountain biking are not permitted either. The
      perimeter circuit is not recommended in months of intense heat, and the quieter months are better for
      enjoying the park's peace. Check that the park is open and its opening hours before visiting.
    around: >-
      The [Serra de Tramuntana](/lugar/serra-de-tramuntana/), about thirteen kilometres away, offers the
      contrast of mountain against flat wetland. Further afield, the [Venice
      Lagoon](/lugar/laguna-di-venezia/) shares with s'Albufera the European pond turtle and its character as
      a coastal wetland.
  fr:
    intro: >-
      Sur une île sèche, un paysage de ponts et de canaux. S'Albufera n'offre pas de sommets ni de grands
      animaux de zoo : elle offre le vol agile du busard, les éclaboussures des canards, le vent qui fait
      onduler les roseaux et le regard timide d'une tortue, pour qui a le temps de les voir. C'est la plus
      grande et la plus importante zone humide des Baléares, une zone humide d'origine très ancienne, dans la
      baie d'Alcúdia. Celui qui traverse ses barrières à pied ou à vélo entre dans un monde tranquille qui
      demande de laisser la hâte derrière soi.
    landscape: >-
      L'eau explique tout. La pluie arrive au parc par des torrents et par des ullals, des sources d'eaux
      souterraines, et en été un peu d'eau marine entre, affectant la végétation et la faune. L'humidité du
      sol maintient la végétation vivante toute l'année, et elle change selon la profondeur, la proximité de
      la mer et le type de terrain. Une partie de la prairie s'est formée à l'ère tertiaire, mais la zone
      humide actuelle s'est constituée il y a moins de 100 000 ans ; les dunes littorales sont plus récentes,
      d'environ 10 000 ans.


      Le roseau, la massette et la jonchée dominent. Dans les canaux il y a des plantes submergées comme
      l'élodée et la prêle aquatique ; dans les zones saumâtres, des joncs et des plantes halophiles ; et
      parmi les arbres ressortent le peuplier blanc, l'orme et le tamaris. Sur les dunes, l'iris de mer et
      d'autres espèces vivent adaptées aux rudes conditions de l'arène. Les champignons comptent 205 espèces,
      et l'une d'elles, Psathyrella halofila, nouvelle pour la science, a été découverte ici en 1992.
    wildlife: >-
      Jusqu'à 303 espèces d'oiseaux ont été observées et 64 nichent dans le parc, parmi les sédentaires et les
      estivaux. En hiver il y a plus de 10 000 oiseaux, dont des canards et de grands vols d'étourneaux ; lors
      des passages migratoires, des oiseaux qui s'arrêtent quelques jours, et de façon occasionnelle des
      visiteurs erratiques comme les [grues](/especie/grus_grus/). Le printemps et l'automne, en particulier
      avril et octobre, coïncident avec le pic de la migration.


      Dans l'eau ressortent l'[anguille](/especie/anguilla_anguilla/) et les mulets ; la grenouille des champs
      est abondante et il y a la couleuvre vipérine et la [cistude d'Europe](/especie/emys_orbicularis/). Il y
      a 22 espèces de mammifères, comme des chauves-souris, des souris et des rats, et parmi les invertébrés
      des libellules, des coléoptères et plus de 450 espèces de papillons de nuit.
    visit: >-
      L'entrée principale se trouve sur la route Ma-12, au niveau du Pont dels Anglesos à Platja de Muro, et
      se traverse à pied ou à vélo ; il y a deux autres entrées uniquement pour les piétons et cyclistes :
      s'Amarador, par Muro, et le pont de Can Blau, par sa Pobla. Les quatre itinéraires sont balisés avec un
      code couleur et des numéros : Sa Roca, Es Colombars, Camí d'Enmig-ses Puntes et Es Cibollar. Celui de Sa
      Roca atteint la butte de Sa Roca après avoir traversé un petit pont en bois. Celui d'Es Colombars
      bifurque à gauche après un kilomètre, le long du canal Ferragut. Le Camí d'Enmig-ses Puntes atteint le
      pont de Sa Font, sous lequel coule l'eau la plus propre du parc, et est recommandé à vélo. Le tour
      périphérique, itinéraire trois, mesure 12 km. Tout le parc est très plat : le dénivelé est pratiquement
      nul.


      À Can Bateman, ancienne station de pompage puis fabrique de papier, se trouve aujourd'hui le centre
      d'interprétation du parc, avec des écrans interactifs sur son patrimoine environnemental, historique et
      culturel. Le parc propose aussi des visites guidées et des activités éducatives.
    history: >-
      Albufera vient de l'arabe al-Buhayra, la petite mer. Les premières citations datent de l'époque romaine,
      quand la zone humide atteignait presque les portes de Pollentia. Son aspect actuel est dû surtout aux
      travaux de dessèchement réalisés entre 1863 et 1871 par la New Majorca Land Company, une entreprise
      anglaise avec plus de 1 500 ouvriers. De cette époque restent le réseau de canaux et de fossés, comme le
      Gran Canal, et les chemins et ponts, dont le Pont dels Anglesos. Elle a été déclarée parc naturel le 28
      janvier 1988 et est aussi zone humide Ramsar et partie du réseau Natura 2000.
    before: >-
      Un permis gratuit est nécessaire, à demander au Centre d'Information et qui inclut carte et règles
      d'utilisation publique. Il n'est pas permis de cueillir des plantes, des animaux ni des champignons, ni
      d'emporter leurs restes. Seuls les chiens guides pour aveugles sont admis. Le camping est interdit dans
      les espaces naturels protégés des Baléares, et les activités sportives comme la course à pied, les
      circuits équestres ou le vélo tout terrain ne sont pas non plus autorisées. Le tour périphérique n'est
      pas recommandé pendant les mois de grande chaleur, et pour profiter de la paix du parc les mois de basse
      saison sont préférables. Vérifiez avant de partir que le parc est ouvert et ses horaires.
    around: >-
      La [Serra de Tramuntana](/lugar/serra-de-tramuntana/), à environ treize kilomètres, offre le contraste
      de la montagne face à la zone humide plate. Plus loin, la [Lagune de Venise](/lugar/laguna-di-venezia/)
      partage avec s'Albufera la cistude d'Europe et son caractère de zone humide côtière.
  de:
    intro: >-
      Auf einer trockenen Insel eine Landschaft aus Brücken und Kanälen. S'Albufera bietet keine Gipfel und
      keine großen Zootiere: Es bietet den agilen Flug des Rohrweihens, das Planschen der Stockenten, den
      Wind, der das Schilf bewegt, und den scheuen Blick einer Schildkröte — für diejenigen, die Zeit haben,
      sie zu sehen. Es ist das größte und wichtigste Feuchtgebiet der Balearen, ein Feuchtgebiet sehr alten
      Ursprungs in der Bucht von Alcúdia. Wer seine Schranken zu Fuß oder mit dem Fahrrad überquert, tritt in
      eine ruhige Welt ein, in der man die Hast draußen lassen soll.
    landscape: >-
      Das Wasser erklärt alles. Regen gelangt über Sturzbäche und durch Ullals, Quellen des Grundwassers, in
      den Park, und im Sommer dringt etwas Meerwasser ein, das Vegetation und Fauna beeinflusst. Die
      Bodenfeuchte hält die Vegetation das ganze Jahr lebendig, sie verändert sich je nach Tiefe, Meeresnähe
      und Geländetyp. Ein Teil der Wiese entstand im Tertiär, aber das heutige Feuchtgebiet bildete sich vor
      weniger als 100 000 Jahren; die Küstendünen sind jünger, etwa 10 000 Jahre alt.


      Röhricht, Rohrkolben und Teichbinse dominieren. In den Kanälen gibt es untergetauchte Pflanzen wie
      Hornkraut und Teichschachtelhalm; in den Salzwasserzonen Binsen und Salzmarschen; und unter den Bäumen
      stechen Weißpappel, Ulme und Tamariske hervor. Auf den Dünen leben die Meeres-Schwertlilie und andere
      Arten, angepasst an die harten Bedingungen des Sandbodens. Pilze zählen 205 Arten, und eine davon,
      Psathyrella halofila, neu für die Wissenschaft, wurde hier 1992 entdeckt.
    wildlife: >-
      Bis zu 303 Vogelarten wurden beobachtet und 64 brüten im Park, darunter Stand- und Sommervögel. Im
      Winter gibt es mehr als 10 000 Vögel, darunter Stockenten und große Starenschwärme; während der
      Zugzeiten Vögel, die nur wenige Tage rasten, und gelegentlich Irrgäste wie
      [Kraniche](/especie/grus_grus/). Frühling und Herbst, besonders April und Oktober, fallen mit dem
      Höhepunkt des Vogelzugs zusammen.


      Im Wasser stechen [Aal](/especie/anguilla_anguilla/) und Meeräschen hervor; der Teichfrosch ist häufig,
      und es gibt die Vipernatter und die [Europäische Sumpfschildkröte](/especie/emys_orbicularis/). Es gibt
      22 Säugetierarten wie Fledermäuse, Mäuse und Ratten, und unter den Wirbellosen Libellen, Käfer und mehr
      als 450 Nachtfalterarten.
    visit: >-
      Der Haupteingang liegt an der Ma-12-Straße, auf Höhe des Pont dels Anglesos in Platja de Muro, und wird
      zu Fuß oder mit dem Fahrrad überquert; es gibt zwei weitere Eingänge nur für Fußgänger und Radfahrer:
      s'Amarador von Muro aus und die Brücke Pont de Can Blau von sa Pobla aus. Die vier farbkodierten und
      nummerierten Routen sind: Sa Roca, Es Colombars, Camí d'Enmig-ses Puntes und Es Cibollar. Die Route Sa
      Roca erreicht den Hügel Sa Roca nach dem Überqueren einer kleinen Holzbrücke. Die Route Es Colombars
      biegt nach einem Kilometer links ab, neben dem Kanal Ferragut. Der Camí d'Enmig-ses Puntes erreicht die
      Brücke Pont de Sa Font, unter der das sauberste Wasser des Parks fließt, und wird mit dem Fahrrad
      empfohlen. Der Umfangsrundweg, Route drei, ist 12 km lang. Der gesamte Park ist sehr flach: der
      Höhenunterschied ist nahezu null.


      In Can Bateman, einst eine Pumpstation und später eine Papierfabrik, befindet sich heute das
      Interpretationszentrum des Parks mit interaktiven Bildschirmen zu seinem natürlichen, historischen und
      kulturellen Erbe. Der Park bietet auch geführte Besichtigungen und Bildungsaktivitäten an.
    history: >-
      Albufera kommt vom Arabischen al-Buhayra, das kleine Meer. Die ersten Erwähnungen stammen aus der
      Römerzeit, als das Feuchtgebiet fast bis vor die Tore von Pollentia reichte. Sein heutiges Aussehen
      verdankt es vor allem den Entwässerungsarbeiten, die zwischen 1863 und 1871 von der New Majorca Land
      Company, einem britischen Unternehmen mit mehr als 1 500 Arbeitern, durchgeführt wurden. Aus dieser Zeit
      stammt das Netz von Kanälen und Gräben, wie dem Gran Canal, sowie Wege und Brücken, darunter der Pont
      dels Anglesos. Es wurde am 28. Januar 1988 zum Naturpark erklärt und ist auch ein Ramsar-Feuchtgebiet
      und Teil des Natura-2000-Netzes.
    before: >-
      Es wird eine kostenlose Genehmigung benötigt, die im Informationszentrum beantragt wird und eine Karte
      sowie Nutzungsregeln enthält. Es ist nicht erlaubt, Pflanzen, Tiere oder Pilze zu sammeln oder ihre
      Überreste mitzunehmen. Nur Blindenhunde werden zugelassen. Campen ist in den geschützten Naturräumen der
      Balearen verboten, und Sportaktivitäten wie Laufen, Reitrunden oder Mountainbiking sind ebenfalls nicht
      gestattet. Der Umfangsrundweg ist in den Monaten intensiver Hitze nicht empfehlenswert, und für Ruhe im
      Park sind die Nebensaisonmonate besser. Überprüfe vor dem Besuch, ob der Park geöffnet ist und seine
      Öffnungszeiten.
    around: >-
      Die [Serra de Tramuntana](/lugar/serra-de-tramuntana/), etwa dreizehn Kilometer entfernt, bietet den
      Kontrast des Gebirges gegenüber dem flachen Feuchtgebiet. Weiter entfernt teilt die [Lagune von
      Venedig](/lugar/laguna-di-venezia/) mit s'Albufera die Europäische Sumpfschildkröte und ihren Charakter
      als Küstenfeuchtgebiet.
  it:
    intro: >-
      Su un'isola arida, un paesaggio di ponti e canali. S'Albufera non offre cime né grandi animali da zoo:
      offre il volo agile del falco di palude, lo sguazzare delle anatre, il vento che muove il canneto e lo
      sguardo timido di una tartaruga, per chi ha tempo di vederli. È la zona umida più grande e importante
      delle Baleari, una zona umida di origine molto antica, nella baia di Alcúdia. Chi attraversa le sue
      barriere a piedi o in bicicletta entra in un mondo tranquillo che chiede di lasciare la fretta fuori.
    landscape: >-
      L'acqua spiega tutto. La pioggia raggiunge il parco attraverso torrenti e ullals, sorgenti di acque
      sotterranee, e in estate entra un po' d'acqua marina che influisce sulla vegetazione e sulla fauna.
      L'umidità del suolo mantiene la vegetazione viva tutto l'anno, e cambia con la profondità, la vicinanza
      al mare e il tipo di terreno. Parte del prato ha avuto origine nell'era terziaria, ma l'attuale zona
      umida si è formata meno di 100 000 anni fa; le dune litorali sono più recenti, di circa 10 000 anni.


      Dominano canneto, tifa e giunco. Nei canali ci sono piante sommerse come la ceratofilla e l'equiseto
      acquatico; nelle zone salmastre, giunchi e piante alofile; e tra gli alberi spiccano il pioppo bianco,
      l'olmo e il tamerice. Sulle dune, il gladiolo di mare e altre specie vivono adattate alle difficili
      condizioni dell'arena. I funghi sommaano 205 specie, e una di esse, Psathyrella halofila, nuova per la
      scienza, fu scoperta qui nel 1992.
    wildlife: >-
      Fino a 303 specie di uccelli sono state osservate e 64 nidificano nel parco, tra sedentarie e estive. In
      inverno ci sono più di 10 000 uccelli, tra cui anatre e grandi storni; durante le migrazioni, uccelli
      che si fermano pochi giorni, e occasionalmente visitatori vagabondi come le [gru](/especie/grus_grus/).
      La primavera e l'autunno, in particolare aprile e ottobre, coincidono con il culmine della migrazione.


      Nell'acqua spiccano l'[anguilla](/especie/anguilla_anguilla/) e i mugilidi; la rana di lago è abbondante
      e ci sono la biscia viperina e la [tartaruga palustre europea](/especie/emys_orbicularis/). Ci sono 22
      specie di mammiferi, come pipistrelli, topi e ratti, e tra gli invertebrati libellule, coleotteri e più
      di 450 specie di falene.
    visit: >-
      L'ingresso principale si trova sulla strada Ma-12, all'altezza del Pont dels Anglesos a Platja de Muro,
      e si attraversa a piedi o in bicicletta; ci sono altri due ingressi solo per chi va a piedi o in
      bicicletta: s'Amarador, da Muro, e il ponte di Can Blau, da sa Pobla. I quattro itinerari sono segnalati
      con un codice colore e numeri: Sa Roca, Es Colombars, Camí d'Enmig-ses Puntes ed Es Cibollar. Quello di
      Sa Roca raggiunge il monticello di Sa Roca dopo aver attraversato un piccolo ponte di legno. Quello di
      Es Colombars svolta a sinistra dopo un chilometro, accanto al canale Ferragut. Il Camí d'Enmig-ses
      Puntes raggiunge il ponte di Sa Font, sotto il quale scorre l'acqua più pulita del parco, e si consiglia
      in bicicletta. Il giro perimetrale, itinerario tre, misura 12 km. Tutto il parco è molto pianeggiante:
      il dislivello è praticamente nullo.


      A Can Bateman, che fu stazione di pompaggio e poi fabbrica di carta, si trova oggi il centro di
      interpretazione del parco, con schermi interattivi sul suo patrimonio ambientale, storico e culturale.
      Il parco organizza anche visite guidate e attività educative.
    history: >-
      Albufera viene dall'arabo al-Buhayra, il piccolo mare. Le prime citazioni risalgono all'epoca romana,
      quando la zona umida arrivava quasi alle porte di Pollentia. Il suo aspetto attuale si deve soprattutto
      ai lavori di bonifica effettuati tra il 1863 e il 1871 dalla New Majorca Land Company, una società
      inglese con più di 1 500 operai. Da allora resta la rete di canali e fossati, come il Gran Canal, e
      strade e ponti, tra cui il Pont dels Anglesos. Fu dichiarato parco naturale il 28 gennaio 1988 ed è
      anche zona umida Ramsar e parte della rete Natura 2000.
    before: >-
      È necessario un permesso gratuito, da richiedere al Centro Informazioni, che include mappa e norme di
      fruizione pubblica. Non è consentito raccogliere piante, animali né funghi, né portarne via resti. Sono
      ammessi solo i cani guida per non vedenti. Il campeggio è vietato negli spazi naturali protetti delle
      Baleari, e non sono ammesse nemmeno attività sportive come la corsa, i percorsi equestri o la mountain
      bike. Il giro perimetrale non è consigliato nei mesi di caldo intenso, e per godere della pace del parco
      sono migliori i mesi di bassa stagione. Verifica prima di andare che il parco sia aperto e i suoi orari.
    around: >-
      La [Serra de Tramuntana](/lugar/serra-de-tramuntana/), a circa tredici chilometri, offre il contrasto
      della montagna rispetto alla zona umida pianeggiante. Più lontano, la [Laguna di
      Venezia](/lugar/laguna-di-venezia/) condivide con s'Albufera la tartaruga palustre europea e il suo
      carattere di zona umida costiera.
  pt:
    intro: >-
      Numa ilha seca, uma paisagem de pontes e canais. S'Albufera não oferece cumes nem grandes animais de
      jardim zoológico: oferece o voo ágil do tartaranhão-ruivo, o chapinhar dos patos, o vento a mover o
      caniço e o olhar tímido de uma tartaruga, para quem tiver tempo de os ver. É a zona húmida mais extensa
      e importante das Baleares, de origem muito antiga, na baía de Alcúdia. Quem atravessa as suas barreiras
      a pé ou de bicicleta entra num mundo tranquilo que pede para deixar a pressa de fora.
    landscape: >-
      A água explica tudo. A chuva chega ao parque por torrentes e por ullals, afloramentos de águas
      subterrâneas, e no verão entra alguma água marina que afeta a vegetação e a fauna. A humidade do solo
      mantém a vegetação viva todo o ano, e esta muda com a profundidade, a proximidade ao mar e o tipo de
      terreno. Parte do prado teve origem na era terciária, mas a zona húmida atual formou-se há menos de 100
      000 anos; as dunas litorais são mais recentes, de cerca de 10 000 anos.


      Dominam o caniço, a tábua e o junco. Nos canais há plantas submersas como a ceratofila e a
      cavalinha-aquática; nas zonas salobras, juncos e plantas halófilas; e entre as árvores destacam-se o
      choupo-branco, o ulmeiro e o tamargueiro. Nas dunas, o gladíolo-do-mar e outras espécies vivem adaptadas
      às difíceis condições do areão. Os fungos somam 205 espécies, e uma delas, Psathyrella halofila, nova
      para a ciência, foi descoberta aqui em 1992.
    wildlife: >-
      Foram observadas até 303 espécies de aves e 64 nidificam no parque, entre sedentárias e estivais. No
      inverno há mais de 10 000 aves, entre elas patos-reais e grandes bandos de estorninhos; nas migrações,
      aves que param poucos dias, e ocasionalmente visitantes divagantes como [grous](/especie/grus_grus/). A
      primavera e o outono, especialmente abril e outubro, coincidem com o pico da migração.


      Na água destacam-se a [enguia](/especie/anguilla_anguilla/) e os mugílidos; a rã-verde é abundante e há
      a cobra-de-água-viperina e o [cágado-mediterrânico](/especie/emys_orbicularis/). Há 22 espécies de
      mamíferos, como morcegos, ratos e ratazanas, e entre os invertebrados libélulas, escaravelhões e mais de
      450 espécies de mariposas.
    visit: >-
      A entrada principal está na estrada Ma-12, ao nível da Pont dels Anglesos, em Platja de Muro, e
      atravessa-se a pé ou de bicicleta; há mais duas entradas só para quem vai a pé ou de bicicleta:
      s'Amarador, por Muro, e a ponte de Can Blau, por sa Pobla. Os quatro itinerários estão sinalizados com
      um código de cores e números: Sa Roca, Es Colombars, Camí d'Enmig-ses Puntes e Es Cibollar. O de Sa Roca
      chega ao montículo de Sa Roca depois de atravessar uma pequena ponte de madeira. O de Es Colombars
      desvia à esquerda após um quilómetro, junto ao canal Ferragut. O Camí d'Enmig-ses Puntes chega à ponte
      de Sa Font, sob a qual corre a água mais limpa do parque, e recomenda-se de bicicleta. O percurso
      perimetral, itinerário três, mede 12 km. Todo o parque é muito plano: o desnível é praticamente
      inexistente.


      Em Can Bateman, que foi estação de bombagem e depois fábrica de papel, está hoje o centro de
      interpretação do parque, com ecrãs interativos sobre o seu património ambiental, histórico e cultural. O
      parque organiza também visitas guiadas e atividades educativas.
    history: >-
      Albufera vem do árabe al-Buhayra, o mar pequeno. As primeiras referências datam da época romana, quando
      a zona húmida chegava quase às portas de Pollentia. O seu aspeto atual deve-se, sobretudo, às obras de
      drenagem realizadas entre 1863 e 1871 pela New Majorca Land Company, uma empresa inglesa com mais de 1
      500 operários. Desse período restam a rede de canais e valas, como o Gran Canal, e os caminhos e pontes,
      entre eles o Pont dels Anglesos. Foi declarado parque natural a 28 de janeiro de 1988 e é também zona
      húmida Ramsar e parte da rede Natura 2000.
    before: >-
      É necessária uma licença gratuita, pedida no Centro de Informação, que inclui mapa e regras de uso
      público. Não se podem colher plantas, animais nem fungos, nem levar os seus restos. Só se admitem
      cães-guia de pessoas cegas. Acampar é proibido nos espaços naturais protegidos das Baleares, e tampouco
      se permitem atividades desportivas como correr, percursos equestres ou bicicleta de montanha. O percurso
      perimetral não é recomendável nos meses de calor intenso, e para desfrutar da paz do parque são melhores
      os meses de época baixa. Verifica antes de ir que o parque está aberto e o seu horário.
    around: >-
      A [Serra de Tramuntana](/lugar/serra-de-tramuntana/), a cerca de treze quilómetros, oferece o contraste
      da montanha face à zona húmida plana. Mais longe, a [Lagoa de Veneza](/lugar/laguna-di-venezia/)
      partilha com s'Albufera o cágado-mediterrânico e o seu carácter de zona húmida costeira.
