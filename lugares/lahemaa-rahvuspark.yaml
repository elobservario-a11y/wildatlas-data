resumen:
  es: >-
    El Parque Nacional más antiguo de Estonia (1971), protegiendo 4 penínsulas del Báltico, taigas boreales de
    pino y la turbera de Viru Raba.
  en: >-
    Estonia's oldest National Park (1971), protecting 4 Baltic peninsulas, boreal pine taiga, and the Viru
    bog.
  fr: >-
    Le plus ancien parc national d'Estonie (1971), protégeant 4 péninsules baltiques, la taïga de pins et la
    tourbière de Viru.
  de: >-
    Ältester Nationalpark Estlands (1971) zum Schutz von 4 Ostsee-Halbinseln, borealer Taiga und dem Moor Viru
    Raba.
  it: >-
    Il più antico parco nazionale d'Estonia (1971), a tutela di 4 penisole baltiche, taiga di pino silvestre e
    della torbiera di Viru.
  pt: >-
    O Parque Nacional mais antigo da Estónia (1971), tutelando 4 penínsulas bálticas, taiga de
    pinheiro-silvestre e a turfeira de Viru.
unico:
  es: >-
    En un solo parque conviven la costa de bahías, los bosques de pino que cubren más del 70 por ciento del
    territorio y turberas de miles de años.
  en: >-
    Within a single park, bay-indented coasts, pine taiga covering over 70 percent of the land, and
    millennia-old raised bogs converge seamlessly.
  fr: >-
    Dans un seul parc cohabitent littoral découpé de baies, pinèdes couvrant plus de 70 pour cent des terres
    et tourbières millénaires.
  de: >-
    In einem einzigen Park begegnen sich buchtenreiche Ostseeküsten, zu über 70 Prozent bewaldete Taiga und
    jahrtausendealte Hochmoore.
  it: >-
    In un unico parco convivono coste frastagliate da baie, foreste di pino che coprono oltre il 70 percento
    del territorio e torbiere millenarie.
  pt: >-
    Num único parque confluem costas recortadas por enseadas, pinhais que cobrem mais de 70 por cento do
    território e turfeiras milenares.
observaciones:
  es: >-
    En el pantano de Viru camina solo por la pasarela, para proteger la vegetación y el suelo, y no vayas en
    bicicleta por ella. Aunque hay mucha agua, el pantano es muy inflamable: una chispa en la turba puede
    provocar un gran incendio. En la planta alta de la torre caben a la vez hasta 25 personas, y está
    prohibido subir durante las tormentas.
texto:
  es:
    intro: >-
      En Lahemaa, la «tierra de bahías», el mar entra en el bosque. Cuatro grandes penínsulas, Juminda,
      Pärispea, Käsmu y Vergi, quedan separadas por cuatro bahías, Kolga, Hara, Eru y Käsmu, y la costa del
      golfo de Finlandia dentro del parque, muy recortada, suma unos 145 km. A unos 70 km al este de Tallin,
      este parque nacional abarca 747 km², de ellos 274,9 km² de mar. Fue la primera zona declarada parque
      nacional de la antigua Unión Soviética y es el parque más grande de Estonia.
    landscape: >-
      Un relieve destacado del área es el klint de Estonia del Norte. Más allá del mar, el interior es un país
      de bosque: los bosques cubren más del 70 por ciento de Lahemaa, y el pino silvestre domina y cubre
      alrededor del 60 por ciento de su superficie. Entre ellos hay muchas turberas altas, como la de
      Laukasoo, de 7000 años. También hay agua corriente, con cuatro cascadas: Turjekeldri, Vasaristi,
      Nõmmeveski y Joaveski.


      La costa tiene su propia historia. Antes de 1991 la Unión Soviética tenía una gran base secreta de
      submarinos en Hara. Y la gente dejó cuatro mansiones en el parque: Palmse, Vihula, Kolga y la barroca
      Sagadi.
    wildlife: >-
      El parque tiene poblaciones de [jabalí](/especie/sus_scrofa/), [ciervo](/especie/cervus_elaphus/),
      [lobo](/especie/canis_lupus/), [oso pardo](/especie/ursus_arctos/) y [lince](/especie/lynx_lynx/). En el
      bosque antiguo de Oandu se ven huellas de [alces](/especie/alces_alces/), jabalíes, osos, linces y otros
      animales, o rastros de su actividad, y con suerte los propios animales. En verano, los alces frecuentan
      prados inundables y matorrales de sauce, donde encuentran plantas de ribera y acuáticas.


      En las riberas, el [castor](/especie/castor_fiber/) europeo se ha convertido en el habitante más común.
      En la bahía, la [foca anillada](/especie/pusa_hispida/) es probablemente el único mamífero que vive allí
      de forma permanente. Y en el calendario de las aves, las [grullas](/especie/grus_grus/) usan cada año
      las rocas y bloques de la costa como parada en su viaje hacia el Bósforo y Egipto.
    visit: >-
      Dos senderos de la RMK resumen el parque: uno de pantano y otro de bosque antiguo.


      El del pantano de Viru mide 3,5 km, está marcado con colores blanco y verde en los árboles y forma parte
      de la ruta de largo recorrido Oandu-Aegviidu-Ikla. Se puede hacer circular: si al final del sendero por
      el pantano se gira a la izquierda por la rama de puntos azules, el total es de 5,5 km. Tiene 3 km de
      pasarela, paneles informativos grandes y pequeños y una torre de observación. Los paneles explican la
      formación de las turberas y sus plantas: el té de Labrador, el camemoro, el romero de turbera, el
      algodón de cola de liebre y las droseras. Al final hay charcas y un área restaurada sobre una antigua
      zona de extracción de turba, con paneles sobre la restauración. A mitad del sendero hay un mirador
      cubierto con vistas a todo el pantano, y la torre de observación se alcanza en silla de ruedas o con
      cochecito por una rampa.


      El de Oandu mide 4,7 km y atraviesa un bosque primario. Hay árboles caídos por todas partes, y los
      troncos en descomposición son el hogar de hongos, líquenes, musgos e insectos raros. Donde caen los
      árboles viejos empiezan a crecer arbustos de frondosas o abetos jóvenes. El sendero baja del pinar seco
      y luminoso por el escarpe Koljaku-Oandu al bosque húmedo de turbera drenada, donde brotan manantiales
      limpios; entre las dunas de la antigua costa crecen rodales de abeto, álamo temblón y aliso, de varias
      generaciones humanas de edad, y en las laderas más altas hay pinos antiguos de corteza gruesa y
      escamosa. Se recomienda empezar por la exposición «Path to the Virgin Forest» del centro de visitantes
      de Oandu, que muestra el ciclo de vida de un bosque antiguo y lo que se puede encontrar. El sendero
      atraviesa zonas húmedas por pasarelas y tiene paneles informativos, bancos y señalización.
    history: >-
      El parque nacional se creó en 1971. Hoy el trabajo de conservación también mira las turberas: los
      paneles del final del sendero Viru explican la restauración de un antiguo campo de fresado de turba.
    before: >-
      En el pantano de Viru camina solo por la pasarela, para proteger la vegetación y el suelo, y no vayas en
      bicicleta por ella. Aunque hay mucha agua, el pantano es muy inflamable: una chispa en la turba puede
      provocar un gran incendio. En la planta alta de la torre caben a la vez hasta 25 personas, y está
      prohibido subir durante las tormentas.
  en:
    intro: >-
      In Lahemaa, the "land of bays", the Baltic Sea reaches deep into the boreal forest. Four major
      peninsulas—Juminda, Pärispea, Käsmu, and Vergi—are separated by four sweeping bays—Kolga, Hara, Eru, and
      Käsmu—framing an intricately indented Gulf of Finland coastline totaling around 145 km within the park.
      Located some 70 km east of Tallinn, this national park encompasses 747 km², including 274.9 km² of
      marine waters. It was established as the very first national park in the entire Soviet Union and remains
      Estonia's largest.
    landscape: >-
      A prominent geological feature is the North Estonian Klint, a limestone escarpment rising back from the
      coast. Inland, forest blankets the landscape: woodlands cover over 70 percent of Lahemaa, with Scots
      pine dominating roughly 60 percent of the territory. Nestled among these woods are expansive raised
      bogs, including the 7000-year-old Laukasoo peatland. Flowing waters carve valleys punctuated by four
      waterfalls: Turjekeldri, Vasaristi, Nõmmeveski, and Joaveski.


      The coast preserves compelling historical heritage. Prior to 1991, the Soviet Navy operated a secret
      submarine degaussing base at Hara. The cultural landscape also features four historic manor estates:
      Palmse, Vihula, Kolga, and the baroque Sagadi manor.
    wildlife: >-
      The national park sustains robust populations of [wild boar](/especie/sus_scrofa/), [red
      deer](/especie/cervus_elaphus/), grey [wolf](/especie/canis_lupus/), [brown
      bear](/especie/ursus_arctos/), and Eurasian [lynx](/especie/lynx_lynx/). In the primeval forest of
      Oandu, visitors frequently encounter tracks of [moose](/especie/alces_alces/), boar, bears, and lynx, or
      occasionally glimpse the animals themselves. During summer, moose feed in flooded coastal meadows and
      willow thickets rich in aquatic vegetation.


      Along rivers and streams, the Eurasian [beaver](/especie/castor_fiber/) has become the most conspicuous
      resident engineer. In the sheltered bays, the [ringed seal](/especie/pusa_hispida/) represents the only
      marine mammal living year-round in these waters. On the avian calendar, [common
      cranes](/especie/grus_grus/) gather each autumn along boulder-strewn headlands as a vital staging post
      on their migration toward the Bosphorus and Egypt.
    visit: >-
      Two flagship State Forest Management Centre (RMK) trails capture the essence of the park: one traversing
      raised bog, the other winding through old-growth forest.


      The Viru Bog trail measures 3.5 km, marked with green and white blazes on trees, and forms part of the
      long-distance Oandu-Aegviidu-Ikla hiking route. It can be completed as a circular walk: turning left at
      the end of the boardwalk onto the blue-dotted forest path yields a total loop of 5.5 km. The route
      incorporates 3 km of boardwalk, comprehensive interpretive boards, and an observation tower. Displays
      detail bog formation and specialized flora: Labrador tea, cloudberry, bog rosemary, hare's-tail
      cottongrass, and sundews. The far end features peat hollow pools and an actively restored former
      commercial extraction field with explanatory panels. Halfway along stands a covered shelter overlooking
      the expanse, and the observation tower is accessible via ramp for wheelchair and stroller users.


      The Oandu old-growth trail covers 4.7 km through virgin forest. Lichen-clad fallen trunks lie strewn
      across the forest floor, where decaying wood provides habitat for rare fungi, mosses, and saproxylic
      beetles. Where canopy giants collapse, young spruce and deciduous saplings take root. The trail descends
      from dry lichen pine heath across the Koljaku-Oandu scarp into moist drained bog woodland fed by clear
      springs; ancient shoreline dunes support multi-generational stands of spruce, aspen, and alder, while
      upper slopes carry veteran Scots pines with deeply furrowed bark. Begin at the Oandu visitor centre
      exhibition "Path to the Virgin Forest", introducing the lifecycle of boreal woods. The path traverses
      wet sectors via boardwalks, equipped with benches, markers, and educational displays.
    history: >-
      The national park was founded in 1971. Ongoing conservation prioritizes peatland hydrology: educational
      boards at the terminus of Viru Bog explain current ecological restoration across historic milling
      fields.
    before: >-
      In Viru Bog, stay strictly on the wooden boardwalk to protect fragile peat mosses and soft terrain, and
      never ride bicycles on the walkway. Despite standing water, dry summer bogs are highly combustible: a
      single spark on dried peat can trigger an uncontrollable underground fire. The top viewing platform of
      the tower holds up to 25 people simultaneously, and climbing is strictly forbidden during thunderstorms.
  fr:
    intro: >-
      À Lahemaa, le « pays des baies », la Baltique s'immisce au cœur de la forêt boréale. Quatre grandes
      péninsules — Juminda, Pärispea, Käsmu et Vergi — sont délimitées par quatre baies profondes — Kolga,
      Hara, Eru et Käsmu —, déployant un littoral très découpé d'environ 145 km sur le golfe de Finlande.
      Situé à environ 70 km à l'est de Tallinn, ce parc national s'étend sur 747 km², dont 274,9 km² d'espaces
      marins. Il fut le tout premier parc national décrété en Union soviétique et demeure le plus vaste
      d'Estonie.
    landscape: >-
      Le relief est dominé au sud par le klint d'Estonie septentrionale, un escarpement calcaire fossile.
      L'intérieur est un royaume forestier : les forêts recouvrent plus de 70 pour cent de Lahemaa, le pin
      sylvestre dominant environ 60 pour cent de la superficie totale. Entre les bois s'étendent de vastes
      tourbières ombrotrophes, telle celle de Laukasoo âgée de 7000 ans. L'eau vive façonne quatre cascades
      pittoresques : Turjekeldri, Vasaristi, Nõmmeveski et Joaveski.


      Le littoral possède une riche mémoire historique. Avant 1991, la marine soviétique exploitait une base
      secrète de démagnétisation sous-marine à Hara. Les domaines seigneuriaux ont légué quatre manoirs
      remarquables : Palmse, Vihula, Kolga et le château baroque de Sagadi.
    wildlife: >-
      Le parc abrite d'importantes hardes de [sangliers](/especie/sus_scrofa/), [cerfs
      élaphes](/especie/cervus_elaphus/), [loups](/especie/canis_lupus/), [ours bruns](/especie/ursus_arctos/)
      et [lynx boréaux](/especie/lynx_lynx/). Dans la forêt ancienne d'Oandu, les empreintes
      d'[élans](/especie/alces_alces/), sangliers, ours et félins jalonnent les sentiers. En été, les élans
      fréquentent les prés humides et les fourrés de saules le long des cours d'eau.


      Sur les berges, le [castor d'Eurasie](/especie/castor_fiber/) est devenu l'artisan le plus répandu des
      zones humides. Dans les baies, le [phoque marbré](/especie/pusa_hispida/) constitue le seul mammifère
      marin résident à l'année. À l'automne, les [grues cendrées](/especie/grus_grus/) font escale par
      milliers sur les écueils côtiers lors de leur grande traversée vers le Bosphore et l'Afrique.
    visit: >-
      Deux sentiers didactiques de l'Office national des forêts (RMK) synthétisent le parc : l'un en
      tourbière, l'autre en forêt primaire.


      Celui de la tourbière de Viru mesure 3,5 km, balisé en blanc et vert sur les troncs, et s'intègre dans
      la grande traversée Oandu-Aegviidu-Ikla. Il peut se parcourir en boucle : en tournant à gauche au bout
      du caillebotis vers la piste aux points bleus, le circuit totalise 5,5 km. Il comprend 3 km de platelage
      en bois, des panneaux explicatifs et une tour d'observation. Les stations décrivent la genèse de la
      tourbière et sa flore : thé du Labrador, plaquebière, andromède, linaigrette et drosères carnivores.
      L'extrémité dévoile des fosses et un secteur réhabilité sur une ancienne tourbière exploitée. À
      mi-chemin se dresse un abri couvert dominant l'étendue, et la tour est accessible en fauteuil roulant
      grâce à une rampe.


      Le sentier d'Oandu mesure 4,7 km au sein d'une taïga primaire. Des chablis monumentaux jonchent le
      sous-bois, où le bois pourrissant nourrit champignons rares, lichens et insectes xylophages. Là où les
      vieux arbres tombent, de jeunes épicéas germent dans la lumière. Le tracé descend de la pinède sableuse
      par l'escarpement de Koljaku-Oandu vers des sous-bois marécageux alimentés par des sources pures ; entre
      les dunes fossiles se succèdent épicéas, trembles et aulnes séculaires, tandis que les hauteurs portent
      des pins à l'écorce écailleuse. Visitez d'abord l'exposition « Path to the Virgin Forest » au centre
      d'accueil d'Oandu. Le sentier traverse les fondrières sur caillebotis et comporte bancs et panneaux.
    history: >-
      Le parc national a été établi en 1971. La gestion écologique moderne privilégie la restauration des
      tourbières : les pupitres au terme du sentier de Viru retracent la revégétalisation des anciennes zones
      de fraisage de tourbe.
    before: >-
      Dans la tourbière de Viru, marchez exclusivement sur les passerelles en bois pour préserver les
      sphaignes, et ne circulez pas à vélo. Malgré la présence d'eau, la tourbe sèche est extrêmement
      inflammable : une simple étincelle peut allumer un vaste incendie souterrain. La plateforme sommitale de
      la tour accueille au maximum 25 personnes à la fois, et son accès est interdit par temps d'orage.
  de:
    intro: >-
      In Lahemaa, dem „Land der Buchten“, greift das Meer tief in die borealen Wälder hinein. Vier große
      Halbinseln – Juminda, Pärispea, Käsmu und Vergi – werden durch vier weite Buchten – Kolga, Hara, Eru und
      Käsmu – getrennt, wodurch die zerklüftete Küste des Finnischen Meerbusens im Park rund 145 km misst.
      Etwa 70 km östlich von Tallinn gelegen, umfasst dieser Nationalpark 747 km², davon 274,9 km²
      Meeresfläche. Er war das erste ausgewiesene Großschutzgebiet der Sowjetunion und ist der größte
      Nationalpark Estlands.
    landscape: >-
      Prägendes Landschaftselement im Hinterland ist der Nordestnische Klint, eine markante
      Kalkstein-Steilstufe. Das Binnenland ist dicht bewaldet: Wälder bedecken über 70 Prozent von Lahemaa,
      wobei die Waldkiefer etwa 60 Prozent der Gesamtfläche einnimmt. Dazwischen dehnen sich weite Hochmoore
      aus, darunter das 7000 Jahre alte Laukasoo. Fließgewässer schneiden Schluchten mit vier Wasserfällen
      ein: Turjekeldri, Vasaristi, Nõmmeveski und Joaveski.


      Die Küste besitzt historische Besonderheiten. Vor 1991 unterhielt die sowjetische Marine eine geheime
      U-Boot-Entmagnetisierungsbasis bei Hara. Zudem prägen vier historische Gutshöfe den Park: Palmse,
      Vihula, Kolga und das barocke Sagadi.
    wildlife: >-
      Im Park leben vitale Populationen von [Wildschwein](/especie/sus_scrofa/),
      [Rothirsch](/especie/cervus_elaphus/), [Wolf](/especie/canis_lupus/), [Braunbär](/especie/ursus_arctos/)
      und [Luchs](/especie/lynx_lynx/). Im Urwald von Oandu lassen sich frische Fährten von
      [Elchen](/especie/alces_alces/), Wildschweinen, Bären und Luchsen entdecken. Im Sommer weiden Elche
      bevorzugt in Weidengebüschen und Überflutungswiesen.


      An den Fließgewässern ist der Europäische [Biber](/especie/castor_fiber/) zum alltäglichen Baumeister
      geworden. In den Meeresbuchten lebt die [Ringelrobbe](/especie/pusa_hispida/) als einziges ganzjährig
      heimisches Meeressäugetier. Im Herbst nutzen Tausende [Kraniche](/especie/grus_grus/) die küstennahen
      Findlinge als Rastplatz auf ihrem Zugweg nach Süden.
    visit: >-
      Zwei RMK-Lehrpfade fassen die Natur des Parks idealtypisch zusammen: einer durch das Hochmoor, der
      andere durch urtümliche Taiga.


      Der Pfad im Viru-Moor ist 3,5 km lang, mit grün-weißen Markierungen an Bäumen versehen und Teil der
      Fernwanderroute Oandu-Aegviidu-Ikla. Er lässt sich als Rundweg gehen: Biegt man am Ende des Holzstegs
      links auf den blau markierten Waldweg ab, beträgt die Gesamtstrecke 5,5 km. Er bietet 3 km
      Holzbohlenwege, Informationstafeln und einen Aussichtsturm. Tafeln erläutern Moorgenese und Moorflora:
      Sumpfporst, Moltebeere, Rosmarinheide, Wollgras und Sonnentau. Am Ende liegen Moortümpel und ein
      renaturiertes Torfabbaugebiet. Auf halber Strecke steht eine Schutzhütte mit Weitblick, und der Turm ist
      über eine Rampe barrierefrei erreichbar.


      Der Oandu-Urwaldpfad misst 4,7 km und führt durch unberührten Naturwald. Moosüberzogenes Totholz bietet
      Lebensraum für seltene Pilze, Flechten und Urwaldinsekten. Wo Baumriesen fallen, verjüngt sich der Wald
      von selbst. Der Pfad steigt von trockenen Kieferndünen über die Koljaku-Oandu-Steilstufe in feuchte
      Quellwälder ab; alte Küstendünen tragen urige Bestände aus Fichte, Zitterpappel und Erle. Besuche vorab
      die Ausstellung „Path to the Virgin Forest“ im Besucherzentrum Oandu. Der Pfad überquert Moorzonen auf
      Bohlen und verfügt über Rastbänke und Schautafeln.
    history: >-
      Der Nationalpark wurde 1971 gegründet. Heutige Naturschutzprojekte widmen sich der Wiedervernässung der
      Moore: Schautafeln am Viru-Pfad dokumentieren die Renaturierung ehemaliger Torfflächen.
    before: >-
      Bleibe im Viru-Moor strikt auf den Holzbohlenwegen, um Torfmoose zu schonen; das Befahren mit Fahrrädern
      ist verboten. Trotz Nässe ist getrockneter Torf hochexplosiv: Ein Funke kann verheerende Schwelbrände
      auslösen. Auf der oberen Plattform des Turms dürfen sich maximal 25 Personen gleichzeitig aufhalten; bei
      Gewitter ist der Aufstieg untersagt.
  it:
    intro: >-
      A Lahemaa, la «terra delle baie», il Mar Baltico penetra nella foresta boreale. Quattro grandi penisole
      — Juminda, Pärispea, Käsmu e Vergi — sono intervallate da quattro ampie baie — Kolga, Hara, Eru e Käsmu
      —, disegnando sul golfo di Finlandia una linea di costa frastagliata di circa 145 km all'interno del
      parco. Situato a circa 70 km a est di Tallinn, questo parco nazionale copre 747 km², di cui 274,9 km² di
      acque marine. È stato il primo parco nazionale istituito nell'Unione Sovietica ed è il più esteso
      d'Estonia.
    landscape: >-
      Elemento geomorfologico di spicco è il klint dell'Estonia settentrionale, una falesia calcarea fossile.
      L'entroterra è interamente ammantato da boschi: le foreste coprono oltre il 70 percento di Lahemaa, con
      il pino silvestre a dominare circa il 60 percento del territorio. Tra le pinete si allargano vaste
      torbiere alte ombrotrofe, come quella di Laukasoo risalente a 7000 anni fa. Le acque correnti formano
      quattro suggestive cascate: Turjekeldri, Vasaristi, Nõmmeveski e Joaveski.


      Il litorale vanta una storia singolare. Prima del 1991 la marina sovietica vi mantenne una base segreta
      per la smagnetizzazione di sottomarini a Hara. Il patrimonio storico include quattro celebri manieri
      feudali: Palmse, Vihula, Kolga e la dimora barocca di Sagadi.
    wildlife: >-
      Il parco accoglie popolazioni stabili di [cinghiale](/especie/sus_scrofa/), [cervo
      nobile](/especie/cervus_elaphus/), [lupo grigio](/especie/canis_lupus/), [orso
      bruno](/especie/ursus_arctos/) e [lince europea](/especie/lynx_lynx/). Nella foresta vetusta di Oandu si
      rinvengono di continuo tracce di [alci](/especie/alces_alces/), cinghiali, orsi e felini. In estate gli
      alci pascolano nei saliceti e nei prati alluvionali ricchi di piante acquatiche.


      Lungo i fiumi il [castoro europeo](/especie/castor_fiber/) è divenuto l'abitante più diffuso. Nelle baie
      riparate la [foca anellata](/especie/pusa_hispida/) rappresenta l'unico mammifero marino stanziale. In
      autunno le [gru cenerine](/especie/grus_grus/) sostano a migliaia sui massi erratici della battigia
      durante la rotta verso il Bosforo e l'Africa.
    visit: >-
      Due itinerari dell'ente forestale RMK riassumono il parco: uno nella torbiera alta e l'altro nella
      foresta primaria.


      Quello della torbiera di Viru misura 3,5 km, segnalato con tacche bianche e verdi sugli alberi, e forma
      parte della grande traversata Oandu-Aegviidu-Ikla. Può compiersi ad anello: svoltando a sinistra al
      termine della passerella sul sentiero a punti blu, lo sviluppo complessivo è di 5,5 km. Dispone di 3 km
      di camminamento in legno, pannelli tematici e una torretta d'avvistamento. Le illustrazioni spiegano la
      genesi della torba e la flora specializzata: tè del Labrador, camemoro, rosmarino di torbiera, erioforo
      e drosera carnivora. Sul fondo si aprono specchi d'acqua e una zona ripristinata su una vecchia cava di
      torba. A metà percorso una tettoia offre riparo panoramico, e la torretta è accessibile con rampa per
      carrozzine e passeggini.


      Il sentiero di Oandu copre 4,7 km nel fitto della taiga primaria. Tronchi caduti coperti di muschi
      alimentano funghi rari, licheni e insetti lignicoli. Dove cadono i patriarchi, giovani pecci rinascono
      alla luce. Il sentiero scende dalla pineta sabbiosa lungo la scarpata Koljaku-Oandu verso boschi
      acquitrinosi alimentati da risorgive; tra le dune litoranee crescono pecci, pioppi tremuli e ontani
      centenari, mentre sulle dorsali svettano pini arcaici. Si consiglia di iniziare dal centro visite di
      Oandu con la mostra «Path to the Virgin Forest». Passerelle in legno consentono di superare le zone
      umide.
    history: >-
      Il parco nazionale fu fondato nel 1971. I progetti di tutela odierni si concentrano sul ripristino
      idrologico delle torbiere: i pannelli al termine del sentiero Viru illustrano la rinaturalizzazione dei
      vecchi bacini di estrazione.
    before: >-
      Nella torbiera di Viru cammina esclusivamente sulle passerelle in legno per non alterare gli sfagni, ed
      evita di percorrerle in bicicletta. Nonostante l'acqua superficiale, la torba secca è infiammabile: una
      scintilla può innescare roghi sotterranei indomabili. Sulla piattaforma alta della torretta possono
      sostare contemporaneamente fino a 25 persone; è vietato salire durante i temporali.
  pt:
    intro: >-
      Em Lahemaa, a «terra das baías», o Mar Báltico penetra na floresta boreal. Quatro grandes penínsulas —
      Juminda, Pärispea, Käsmu e Vergi — surgem separadas por quatro baías amplas — Kolga, Hara, Eru e Käsmu
      —, delineando no golfo da Finlândia um recorte litoral de cerca de 145 km no interior do parque. Situado
      a cerca de 70 km a leste de Taline, este parque nacional abrange 747 km², incluindo 274,9 km² de área
      marinha. Foi o primeiro parque nacional declarado em toda a União Soviética e continua a ser o maior da
      Estónia.
    landscape: >-
      Um relevo emblemático da região é o klint do norte da Estónia, uma imponente escarpa calcária fóssil.
      Para o interior estende-se um vasto domínio florestal: as matas cobrem mais de 70 por cento de Lahemaa,
      com o pinheiro-silvestre a dominar cerca de 60 por cento da área total. Entre as florestas espalham-se
      turfeiras altas ombrótrofas, como a de Laukasoo com 7000 anos de evolução. Quatro cascatas marcam a
      hidrografia do parque: Turjekeldri, Vasaristi, Nõmmeveski e Joaveski.


      A costa conserva episódios singulares. Antes de 1991, a marinha soviética manteve em Hara uma base
      secreta de desmagnetização de submarinos. O homem ergueu quatro solares históricos integrados na
      paisagem: Palmse, Vihula, Kolga e a propriedade barroca de Sagadi.
    wildlife: >-
      O parque mantém populações consistentes de [javali](/especie/sus_scrofa/),
      [veado-vermelho](/especie/cervus_elaphus/), [lobo-cinzento](/especie/canis_lupus/),
      [urso-pardo](/especie/ursus_arctos/) e [lince-euroasiático](/especie/lynx_lynx/). No bosque virgem de
      Oandu encontram-se pegadas de [alces](/especie/alces_alces/), javalis, ursos e linces. No verão, os
      alces alimentam-se em prados inundáveis e salgueirais ribeirinhos ricos em flora aquática.


      Nas margens dos rios, o [castor-europeu](/especie/castor_fiber/) tornou-se o arquiteto mais comum. Nas
      enseadas marítimas, a [foca-anelada](/especie/pusa_hispida/) é o único mamífero marinho com residência
      permanente. No outono, milhares de [grous-comuns](/especie/grus_grus/) pousam nos blocos erráticos do
      litoral em escala migratória para o Bósforo e África.
    visit: >-
      Dois trilhos da autoridade florestal RMK sintetizam o parque: um em turfeira e outro em floresta
      primária.


      O trilho da turfeira de Viru mede 3,5 km, sinalizado a branco e verde nas árvores, fazendo parte da
      grande rota pedestre Oandu-Aegviidu-Ikla. Pode ser percorrido em circuito circular: virando à esquerda
      no final do passadiço pelo ramo assinalado com pontos azuis, perfaz 5,5 km. Conta com 3 km de passadiços
      de madeira, painéis didáticos e uma torre panorâmica. Os painéis abordam a formação das turfeiras e a
      sua flora caraterística: chá-do-labrador, amora-ártica, alecrim-das-turfeiras, algodão-dos-pauis e
      dróseras carnívoras. No extremo abrem-se lagoachos e uma parcela restaurada sobre uma antiga exploração
      de turfa. A meio do trilho há um miradouro coberto, e a torre de observação possui rampa para cadeiras
      de rodas e carrinhos de bebé.


      O trilho de Oandu tem 4,7 km e atravessa floresta antiga intocada. Troncos tombados cobertos de musgo
      servem de alimento a cogumelos raros, líquenes e insetos xilófagos. Quando as velhas árvores caem,
      abetos jovens e folhosas regeneram-se no clareador. O percurso desce da mata seca de dunas arenosas pela
      escarpa Koljaku-Oandu até bosques paludosos alimentados por nascentes; entre dunas litorais sucedem-se
      espruces e amieiros seculares. Recomenda-se iniciar no centro de visitantes de Oandu com a exposição
      «Path to the Virgin Forest». Pontes de madeira transpõem as zonas encharcadas.
    history: >-
      O parque nacional foi criado em 1971. A conservação moderna foca-se na hidrologia das turfeiras: painéis
      didáticos no final do trilho de Viru documentam a recuperação ambiental de antigas áreas de extração de
      turfa.
    before: >-
      Na turfeira de Viru caminha exclusivamente sobre os passadiços de madeira para salvaguardar a vegetação
      de esfagno, e não circules de bicicleta. Apesar da abundância de água, a turfa seca é extremamente
      combustível: uma faúlha pode provocar um incêndio subterrâneo grave. O piso superior da torre tem
      capacidade para até 25 pessoas em simultâneo, sendo terminantemente proibido subir durante trovoadas.
