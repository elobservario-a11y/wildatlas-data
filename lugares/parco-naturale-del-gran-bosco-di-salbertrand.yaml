resumen:
  es: Bosque mixto de abeto blanco y pícea en la ladera de el valle de Susa, recorrido por senderos señalizados.
  en: Mixed silver fir and spruce woodland across the Susa Valley slopes, threaded by waymarked trails.
  fr: Forêt mixte de sapin blanc et d’épicéa sur le versant de la vallée de Suse, sillonnée de sentiers balisés.
  de: Mischwald aus Weißtanne und Fichte an den Hängen des Susatals, erschlossen durch markierte Wanderwege.
  it: >-
    Bosco misto di abete bianco e abete rosso sulle pendici della valle di Susa, percorso da sentieri
    segnalati.
  pt: >-
    Floresta mista de abeto-branco e espruce nas vertentes do vale de Susa, percorrida por trilhos
    assinalados.
unico:
  es: Un bosque donde el abeto blanco y el abeto rojo crecen juntos, algo raro en los Alpes occidentales.
  en: >-
    A montane forest where silver fir and Norway spruce grow together, a rare ecological occurrence in the
    Western Alps.
  fr: >-
    Une forêt montagnarde où sapin blanc et épicéa commun poussent ensemble, une association rare dans les
    Alpes occidentales.
  de: >-
    Ein Bergwald, in dem Weißtanne und Gemeine Fichte gemeinsam gedeihen—ein seltener Waldbestand in den
    Westalpen.
  it: >-
    Una foresta montana in cui abete bianco e abete rosso crescono insieme, un’associazione assai rara nelle
    Alpi occidentali.
  pt: >-
    Uma mata montícola onde o abeto-branco e o espruce crescem juntos, associação botânica rara nos Alpes
    ocidentais.
observaciones:
  es: >-
    La entrada al parque es libre, solo por sus accesos, las pistas internas o los senderos señalizados. Los
    perros están prohibidos fuera de las áreas equipadas y señalizadas, y deben ir con correa.
texto:
  es:
    intro: >-
      Ya en el siglo XVIII, de estos abetales salían las grandes vigas de las obras más importantes de la casa
      de Saboya: el Arsenal de Turín, la basílica de Superga, la Reggia de Venaria Reale. Lo que entonces era
      madera de ingeniería militar y civil es hoy un bosque protegido, 700 hectáreas de abeto blanco y abeto
      rojo mezclados, único en la vegetación piamontesa.


      El Parque Natural del Gran Bosco de Salbertrand lo creó la Región del Piamonte en 1980. Protege 3775
      hectáreas en la margen derecha del valle de Susa, entre los 1000 metros y los 2600 de la divisoria con
      el valle del Chisone. El bosque que le da nombre es solo una parte: aproximadamente el 70% del
      territorio es bosque y el resto, pastos y praderas.
    landscape: >-
      Se cree que esos abetos prosperan por dos causas: un microclima particular, con humedad atmosférica
      estancada, y un ecotipo resistente a la sequía estival. Los rodales de abeto rojo, pino cembro y alerce
      del Gran Bosco son tan buenos que figuran en el Libro nacional de bosques de semilla, para repoblar el
      resto de los Alpes.


      El paisaje cambia con la altura. En el fondo del valle hay frondosas como fresnos, abedules, arces y
      alisos, con pequeños núcleos de tejo. Desde los 1300 metros mandan las coníferas: hasta los 1800
      predominan abeto blanco y abeto rojo, y más arriba el pino cembro y el alerce, con un cembral puro en el
      Piccolo Bosco. En las zonas más áridas aparece el pino silvestre. Por encima del límite del bosque hay
      arbustedas de rododendro y arándano y, más arriba, praderas alpinas. La flora supera las 600 especies;
      la Torbiera del Blegier alberga la única estación confirmada en el Piamonte de Utricularia minor, y hay
      28 especies de orquídeas silvestres que florecen de mayo a septiembre.
    wildlife: >-
      En el parque hay unas 140 especies de aves, ochenta de ellas nidificantes, con muchas aves alpinas.
      Entre las rapaces están el azor, el gavilán, el [ratonero común](/especie/buteo_buteo/), el [cernícalo
      vulgar](/especie/falco_tinnunculus/), el [quebrantahuesos](/especie/gypaetus_barbatus/) y una pareja de
      [águila real](/especie/aquila_chrysaetos/); de noche, el cárabo, el [búho real](/especie/bubo_bubo/) y
      el mochuelo boreal. El cascanueces vive ligado al pino cembro y en las praderas alpinas paran muchos
      migrantes, entre ellos el chorlito carambolo.


      Entre los mamíferos no es raro ver liebre, ardilla, [marmota](/especie/marmota_marmota/), zorro, armiño,
      comadreja, garduña, marta y tejón, y cuatro ungulados: [rebeco](/especie/rupicapra_rupicapra/), jabalí,
      [ciervo](/especie/cervus_elaphus/) y [corzo](/especie/capreolus_capreolus/). Los dos últimos,
      reintroducidos para la caza en los años sesenta, aumentaron sin depredadores hasta amenazar a los abetos
      que motivaron el parque. En 1997 el [lobo](/especie/canis_lupus/) se instaló en el Gran Bosco y formó la
      primera manada estable de los Alpes Cocios.


      El año tiene su calendario. En septiembre y octubre el gestor programa salidas de berrea al bosque; la
      salida tiene dificultad media y regreso nocturno. Las orquídeas florecen de mayo a septiembre. Los
      senderos fueron concebidos sobre todo para el uso estival, y en invierno las pistas internas se recorren
      con esquís o raquetas.
    visit: >-
      Dieciséis senderos señalizados, de unos 70 km en total, recorren el parque del fondo del valle a la
      cresta y de este a oeste. Por él pasan itinerarios de relevancia internacional como la Via Alpina, el
      Glorioso Rimpatrio de los valdenses, la Grande Traversata delle Alpi y la Via Francigena. Todas las
      pistas de tierra interiores están cerradas al tráfico motorizado y se pueden recorrer a pie, en
      bicicleta, con esquís o con raquetas de nieve. La panorámica carretera militar del Assietta está cerrada
      a los vehículos de motor los miércoles y los sábados.


      La puerta de entrada es Salbertrand. Se puede llegar en tren a su estación y, desde ella, una corta
      caminata lleva al aparcamiento Pinea, de donde parten los senderos. Entre el pueblo y el parque hay un
      itinerario circular de unos 7 km y unas 2 horas por edificios que cuentan la cultura material de la
      comunidad. La Strada dei Cannoni tiene un tiempo publicado de dos horas y media.


      El centro de visitas, en la sede de Salbertrand, es el punto de acogida del parque. De él parten el
      sendero forestal didáctico Oreste Rey y Fulvio Norse, el recorrido del Ecomuseo Colombano Romean y el
      Jardín de las mariposas.
    history: >-
      El Ecomuseo Colombano Romean recoge el paisaje, la arquitectura, el saber hacer y los testimonios orales
      del Alto Valle de Susa. En la cresta están las trincheras del Assietta, escenario de la batalla del 19
      de julio de 1747, y entre 1938 y 1942 se construyeron búnkeres del Vallo Alpino para proteger la
      frontera italiana.
    before: >-
      La entrada al parque es libre, solo por sus accesos, las pistas internas o los senderos señalizados. Los
      perros están prohibidos fuera de las áreas equipadas y señalizadas, y deben ir con correa.
    around: >-
      A tres kilómetros está el [Parque Natural Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) y
      a siete el [Parque Natural de Val Troncea](/lugar/parco-naturale-della-val-troncea/). El [Parque Natural
      Regional del Queyras](/lugar/parc-naturel-regional-du-queyras/) queda a diecinueve kilómetros y el
      [Parque Nacional de la Vanoise](/lugar/parc-national-de-la-vanoise/) a veintidós.
  en:
    intro: >-
      Back in the XVIII century, these dense fir forests supplied colossal timber beams for the House of
      Savoy’s grandest architectural works: the Turin Arsenal, the Basilica of Superga, and the Reggia of
      Venaria Reale. What was once a strategic reservoir for military and civil engineering is today a
      protected regional reserve—700 hectares of co-dominant silver fir and Norway spruce, unique in
      Piedmont’s alpine landscape.


      The Gran Bosco di Salbertrand Natural Park was established by Piedmont in 1980. It protects 3775
      hectares along the right flank of the Susa Valley, climbing from 1000 metres up to the 2600-metre
      watershed dividing it from Val Chisone. The forest that lends the park its name forms only a core:
      approximately 70% of the territory is forested, while the rest consists of alpine pastures and rock
      crags.
    landscape: >-
      These firs are thought to thrive thanks to two distinct factors: a localized microclimate trapping
      stagnant atmospheric humidity, and an ecotype exceptionally resistant to summer drought. The seed stands
      of Norway spruce, Swiss stone pine, and European larch within the Gran Bosco are of such superior
      genetic quality that they are officially enrolled in the National Seed Forest Register to reforest the
      broader alpine arc.


      The flora changes dramatically with altitude. On the valley floor grow broadleaves such as ash, birch,
      maple, and alder, alongside isolated pockets of English yew. From 1300 metres upwards conifers take
      over: between here and 1800 metres silver fir and Norway spruce dominate, succeeded higher up by Swiss
      stone pine and larch, culminating in a pure stone pine stand at Piccolo Bosco. On drier, rocky ribs
      Scots pine takes root. Above the timberline, dense thickets of rusty-leaved alpenrose and bilberry give
      way to alpine grasslands. The vascular flora exceeds 600 species; the Blegier peat bog hosts the only
      documented station of *Utricularia minor* in Piedmont, and 28 species of wild orchids flower from May to
      September.
    wildlife: >-
      The park is home to some 140 bird species, with eighty nesting locally, dominated by specialized montane
      avifauna. Birds of prey include the northern goshawk, Eurasian sparrowhawk, [common
      buzzard](/especie/buteo_buteo/), [common kestrel](/especie/falco_tinnunculus/), [bearded
      vulture](/especie/gypaetus_barbatus/), and a resident breeding pair of [golden
      eagles](/especie/aquila_chrysaetos/); by night, tawny owls, [Eurasian eagle-owls](/especie/bubo_bubo/),
      and boreal owls take over. Spotted nutcrackers live in tight association with stone pine cones, while
      high alpine plateaus welcome migrating dots such as the dotterel.


      Among mammals, visitors frequently encounter mountain hares, red squirrels, [alpine
      marmots](/especie/marmota_marmota/), red foxes, stoats, least weasels, stone martens, pine martens, and
      badgers, alongside four ungulates: [chamois](/especie/rupicapra_rupicapra/), wild boar, [red
      deer](/especie/cervus_elaphus/), and [roe deer](/especie/capreolus_capreolus/). The latter two,
      reintroduced for hunting during the sixties, multiplied in the absence of predators until heavy browsing
      threatened the regeneration of the very fir forests the park was created to protect. In 1997 the [grey
      wolf](/especie/canis_lupus/) naturally recolonized the Gran Bosco, establishing the first stable
      breeding pack in the Cottian Alps.


      The ecological calendar is distinct. In September and October, rangers lead evening deer rut excursions;
      these moderate hikes return after dusk. Wild orchids bloom between May and September. The paths were
      conceived primarily for summer walking, while in winter unpaved forestry tracks provide excellent
      terrain for snowshoeing and ski touring.
    visit: >-
      Sixteen waymarked trails, totalling roughly 70 km, traverse the park from the valley bottom to the high
      crests, east to west. Several international routes pass through, including the Via Alpina, the Glorious
      Return of the Waldensians, the Grande Traversata delle Alpi, and the Via Francigena. All internal
      unpaved tracks are closed to unauthorised motor vehicles and may be explored on foot, by mountain bike,
      or in winter on skis and snowshoes. The panoramic Assietta military road is closed to motorised traffic
      on Wednesdays and Saturdays.


      The main trailhead is Salbertrand, easily reached by train; from the railway station a short walk leads
      to the Pinea car park where hiking trails begin. A heritage loop between the village and the lower park
      covers roughly 7 km in about 2 hours, visiting historical sites illustrating traditional alpine
      livelihoods. The Strada dei Cannoni path has an estimated walking time of two and a half hours.


      The park visitor centre at Salbertrand headquarters serves as the primary reception point, where you can
      access the Oreste Rey and Fulvio Norse nature trail, the Colombano Romean Ecomuseum circuit, and the
      thematic Butterfly Garden.
    history: >-
      The Colombano Romean Ecomuseum documents traditional landscapes, vernacular architecture, hydraulic
      craftsmanship, and oral heritage in the Upper Susa Valley. Along the high ridge lie the historic
      Assietta entrenchments, scene of the epic battle of 19 July 1747, while between 1938 and 1942 extensive
      Vallo Alpino artillery bunkers were excavated into the rock to reinforce the alpine border.
    before: >-
      Park entry is free, permitted only via designated access points, internal forestry tracks, and waymarked
      footpaths. Dogs are prohibited outside equipped picnic grounds and must remain on a leash at all times.
    around: >-
      Three kilometres away lies [Orsiera-Rocciavrè Natural Park](/lugar/parco-naturale-orsiera-rocciavre/)
      and seven kilometres distant is [Val Troncea Natural Park](/lugar/parco-naturale-della-val-troncea/).
      [Queyras Regional Natural Park](/lugar/parc-naturel-regional-du-queyras/) is nineteen kilometres away
      and [Vanoise National Park](/lugar/parc-national-de-la-vanoise/) lies twenty-two kilometres away.
  fr:
    intro: >-
      Dès le XVIIIe siècle, ces forêts de conifères fournissaient les poutres maîtresses des grands chantiers
      de la maison de Savoie : l’Arsenal de Turin, la basilique de Superga, la Reggia de Venaria Reale. Ce qui
      fut un réservoir stratégique de bois d’œuvre est aujourd’hui une forêt protégée : 700 hectares où se
      mêlent sapin blanc et épicéa commun, un peuplement singulier dans la végétation piémontaise.


      Le parc naturel du Gran Bosco de Salbertrand a été créé par la Région Piémont en 1980. Il protège 3775
      hectares sur la rive droite de la vallée de Suse, s’étageant de 1000 mètres jusqu’aux 2600 mètres de la
      crête séparant la vallée du Chisone. Le bois éponyme n’en constitue qu’une partie : environ 70 % du
      territoire est boisé, le reste se partageant entre alpages et falaises.
    landscape: >-
      Cette prospérité forestière découle de deux facteurs : un microclimat retenant une humidité
      atmosphérique stagnante et un écotype particulièrement résistant aux sécheresses estivales. Les
      peuplements d’épicéa, de pin cembro et de mélèze du Gran Bosco sont d’une telle qualité génétique qu’ils
      sont inscrits au Registre national des forêts semencières pour approvisionner les reboisements alpins.


      Le paysage varie selon l’altitude. Au fond de la vallée poussent des feuillus comme le frêne, le
      bouleau, l’érable et l’aune, accompagnés d’ifs épars. À partir de 1300 mètres règnent les conifères :
      jusqu’à 1800 mètres dominent sapin blanc et épicéa commun, relayés plus haut par le pin cembro et le
      mélèze, avec une cembraie pure au Piccolo Bosco. Sur les versants rocheux arides s’installe le pin
      sylvestre. Au-dessus de la forêt, les landes à rhododendrons et myrtilles cèdent la place aux pelouses
      alpines. La flore compte plus de 600 espèces ; la tourbière du Blegier abrite l’unique station
      piémontaise d’*Utricularia minor*, et 28 espèces d’orchidées fleurissent de mai à septembre.
    wildlife: >-
      Le parc recense environ 140 espèces d’oiseaux, dont quatre-vingts nicheuses alpines. Parmi les rapaces
      figurent l’autour des palombes, l’épervier d’Europe, la [buse variable](/especie/buteo_buteo/), le
      [faucon crécerelle](/especie/falco_tinnunculus/), le [gypaète barbu](/especie/gypaetus_barbatus/) et un
      couple d’[aigles royaux](/especie/aquila_chrysaetos/) ; la nuit résonnent la chouette hulotte, le
      [grand-duc d’Europe](/especie/bubo_bubo/) et la chouette de Tengmalm. Le cassenoix moucheté vit en
      étroite symbiose avec le pin cembro, tandis que le pluvier guignard fait escale sur les crêtes.


      Les mammifères comptent le lièvre variable, l’écureuil, la [marmotte des
      Alpes](/especie/marmota_marmota/), le renard roux, l’hermine, la belette, la fouine, la martre et le
      blaireau, ainsi que quatre ongulés : [chamois](/especie/rupicapra_rupicapra/), sanglier, [cerf
      élaphe](/especie/cervus_elaphus/) et [chevreuil](/especie/capreolus_capreolus/). Ces deux derniers,
      réintroduits pour la chasse dans les années soixante, ont proliféré faute de prédateurs au point
      d’altérer la régénération des sapins. En 1997, le [loup gris](/especie/canis_lupus/) a recolonisé
      naturellement le massif, y fondant la première meute stable des Alpes cottiennes.


      Le rythme saisonnier est bien marqué. En septembre et octobre, le parc organise des sorties pour écouter
      le brame du cerf, de niveau moyen avec retour nocturne. Les orchidées fleurissent de mai à septembre.
      Les sentiers sont conçus pour l’été, tandis qu’en hiver les pistes forestières se parcourent à skis ou
      en raquettes.
    visit: >-
      Seize sentiers balisés, totalisant environ 70 km, parcourent le parc du fond de vallée jusqu’aux crêtes.
      De grands itinéraires le traversent, dont la Via Alpina, le Glorieux Retour des Vaudois, la Grande
      Traversata delle Alpi et la Via Francigena. Toutes les pistes en terre battue sont interdites à la
      circulation automobile et accessibles à pied, à vélo, à skis ou en raquettes. La route militaire
      panoramique de l’Assietta est fermée aux véhicules à moteur les mercredis et samedis.


      La porte d’entrée est Salbertrand, desservie par le train ; une courte marche mène au parking Pinea d’où
      partent les randonnées. Une boucle patrimoniale de 7 km reliant le village au parc s’effectue en 2
      heures environ le long d’ouvrages historiques. Le sentier de la Strada dei Cannoni demande environ deux
      heures et demie de marche.


      Le centre d’accueil de Salbertrand centralise les informations du parc. De là partent le sentier
      didactique Oreste Rey et Fulvio Norse, le parcours de l’Écomusée Colombano Romean et le Jardin des
      papillons.
    history: >-
      L’Écomusée Colombano Romean documente les paysages, l’architecture vernaculaire, l’artisanat hydraulique
      et les traditions orales de la haute vallée de Suse. Sur la crête subsistent les retranchements de
      l’Assietta, théâtre de la bataille du 19 juillet 1747, tandis qu’entre 1938 et 1942 de puissants
      blockhaus du Vallo Alpino furent creusés pour fortifier la frontière alpine.
    before: >-
      L’accès au parc est libre, mais s’effectue impérativement par les entrées officielles, pistes et chemins
      balisés. Les chiens sont interdits en dehors des aires aménagées et doivent y être tenus en laisse.
    around: >-
      À trois kilomètres se trouve le [parc naturel
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) et à sept kilomètres le [parc naturel de
      Val Troncea](/lugar/parco-naturale-della-val-troncea/). Le [parc naturel régional du
      Queyras](/lugar/parc-naturel-regional-du-queyras/) se situe à dix-neuf kilomètres et le [parc national
      de la Vanoise](/lugar/parc-national-de-la-vanoise/) à vingt-deux kilomètres.
  de:
    intro: >-
      Bereits im XVIII. Jahrhundert stammten die mächtigen Bauhölzer für die repräsentativsten Monumente des
      Hauses Savoyen aus diesen Forsten: das Turiner Zeughaus, die Basilika von Superga und das Schloss
      Venaria Reale. Was einst Holzreservoir des Staats war, ist heute ein Schutzgebiet: 700 Hektar Mischwald
      aus Weißtanne und Fichte, einzigartig in der piemontesischen Vegetation.


      Der Naturpark Gran Bosco di Salbertrand wurde 1980 von der Region Piemont gegründet. Er schützt 3775
      Hektar am rechten Ufer des Susatals und reicht von 1000 Metern Höhe bis auf 2600 Meter an der
      Wasserscheide zum Chisone-Tal. Der namensgebende Wald bildet den Kern: Ungefähr 70 % des Gebiets sind
      bewaldet, der Rest verteilt sich auf Almweiden und Felsfluren.
    landscape: >-
      Die Tannenwälder verdanken ihr Gedeihen zwei Faktoren: einem speziellen Mikroklima mit stauender
      Luftfeuchtigkeit und einem trockenheitsresistenten Ökotyp. Die Samenbestände von Fichte, Zirbelkiefer
      und Lärche im Gran Bosco sind von so herausragender Qualität, dass sie im Nationalen
      Saatgut-Waldregister eingetragen sind, um Aufforstungen im gesamten Alpenraum zu versorgen.


      Das Landschaftsbild wandelt sich mit der Höhe. Im Talgrund wachsen Laubhölzer wie Eschen, Birken, Ahorne
      und Erlen mit Eibenbeständen. Ab 1300 Metern übernehmen die Nadelbäume: Bis 1800 Meter dominieren
      Weißtanne und Gemeine Fichte, darüber Zirbelkiefer und Lärche, gekrönt von einem reinen Zirbenwald im
      Piccolo Bosco. An trockenen Felsrippen fasst die Waldkiefer Fuß. Über der Waldgrenze folgen
      Zwergstrauchheiden aus Alpenrosen und Heidelbeeren sowie alpine Rasen. Die Flora zählt über 600 Arten;
      das Moor Torbiera del Blegier birgt den einzigen gesicherten piemontesischen Standort von *Utricularia
      minor*, und 28 Wildorchideenarten blühen von Mai bis September.
    wildlife: >-
      Im Naturpark leben rund 140 Vogelarten, davon achtzig Brutvogelarten der Alpen. Unter den Greifvögeln
      jagen Habicht, Sperber, [Mäusebussard](/especie/buteo_buteo/), [Turmfalke](/especie/falco_tinnunculus/),
      [Bartgeier](/especie/gypaetus_barbatus/) und ein Brutpaar des
      [Steinadlers](/especie/aquila_chrysaetos/); nachts rufen Waldkauz, [Uhu](/especie/bubo_bubo/) und
      Raufußkauz. Der Tannenhäher ist eng an die Zirbelkiefer gebunden, während der Mornellregenpfeifer auf
      den Hochweiden rastet.


      Bei den Säugetieren begegnet man Schneehase, Eichhörnchen, [Alpenmurmeltier](/especie/marmota_marmota/),
      Rotfuchs, Hermelin, Mauswiesel, Steinmarder, Baummarder und Dachs sowie vier Schalenwildarten:
      [Gämse](/especie/rupicapra_rupicapra/), Wildschwein, [Rothirsch](/especie/cervus_elaphus/) und
      [Reh](/especie/capreolus_capreolus/). Hirsch und Reh wurden in den sechziger Jahren für die Jagd
      ausgesetzt und vermehrten sich mangels Beutegreifern so stark, dass sie die Tannenverjüngung bedrohten.
      Im Jahr 1997 kehrte der [Wolf](/especie/canis_lupus/) eigenständig zurück und bildete das erste feste
      Rudel der Cottischen Alpen.


      Das Jahr folgt einem festen Rhythmus: Im September und Oktober bietet der Park Exkursionen zur
      Hirschbrunft an, mittelschwer mit nächtlicher Rückkehr. Die Orchideenblüte reicht von Mai bis September.
      Die Wege sind für den Sommer ausgelegt; im Winter werden die Forstwege mit Langlaufskiern oder
      Schneeschuhen begangen.
    visit: >-
      Sechzehn markierte Wanderwege mit rund 70 km Gesamtlänge durchziehen das Schutzgebiet vom Tal bis zu den
      Graten. Bedeutende Weitwanderwege wie die Via Alpina, die Glorieuse Rentrée der Waldenser, die Grande
      Traversata delle Alpi und die Via Francigena berühren den Park. Alle Forststraßen sind für den
      motorisierten Verkehr gesperrt und zu Fuß, per Rad oder im Winter auf Skiern und Schneeschuhen
      passierbar. Die Assietta-Militärstraße ist mittwochs und samstags für Motorfahrzeuge gesperrt.


      Ausgangspunkt ist Salbertrand mit Bahnanschluss; vom Bahnhof führt ein kurzer Spaziergang zum
      Wanderparkplatz Pinea. Ein historischer Rundweg zwischen Dorf und Schutzgebiet führt über 7 km in rund 2
      Stunden an montanen Kulturdenkmälern vorbei. Die Route Strada dei Cannoni ist mit zweieinhalb Stunden
      Gehzeit veranschlagt.


      Das Besucherzentrum am Parksitz in Salbertrand bildet die Hauptanlaufstelle mit dem Naturlehrpfad Oreste
      Rey und Fulvio Norse, dem Ecomuseo Colombano Romean und dem Schmetterlingsgarten.
    history: >-
      Das Ecomuseo Colombano Romean widmet sich der Kulturlandschaft, Wasserarchitektur und den Traditionen
      des oberen Susatals. Auf dem Passkamm zeugen Schanzen von der Schlacht am Assietta-Pass vom 19. Juli
      1747, und zwischen 1938 und 1942 wurden Festungsanlagen des Vallo Alpino zur Grenzsicherung errichtet.
    before: >-
      Der Zutritt zum Park ist frei, darf jedoch nur über die offiziellen Zugänge, Forstwege und markierten
      Pfade erfolgen. Hunde sind außerhalb ausgewiesener Rastzonen verboten und müssen stets angeleint
      bleiben.
    around: >-
      Drei Kilometer entfernt liegt der [Naturpark
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) und sieben Kilometer entfernt der
      [Naturpark Val Troncea](/lugar/parco-naturale-della-val-troncea/). Der [Regionale Naturpark
      Queyras](/lugar/parc-naturel-regional-du-queyras/) liegt neunzehn Kilometer und der [Nationalpark
      Vanoise](/lugar/parc-national-de-la-vanoise/) zweiundzwanzig Kilometer entfernt.
  it:
    intro: >-
      Già nel XVIII secolo da queste abetaie provenivano le grandi travi per i cantieri sabaudi più
      prestigiosi: l’Arsenale di Torino, la Basilica di Superga, la Reggia di Venaria Reale. Quello che fu un
      bacino strategico di legname da carpenteria è oggi un’area protetta di 700 ettari in cui convivono abete
      bianco e abete rosso, un’eccezione nella vegetazione piemontese.


      Il Parco Naturale del Gran Bosco di Salbertrand è stato istituito dalla Regione Piemonte nel 1980.
      Tutela 3775 ettari sulla destra orografica della valle di Susa, sviluppandosi dai 1000 metri di quota
      fino ai 2600 metri dello spartiacque con la Val Chisone. La foresta da cui prende il nome ne forma il
      cuore: all’incirca il 70% della superficie è coperto da boschi, mentre la quota restante comprende
      alpeggi e pietraie.
    landscape: >-
      Si ritiene che questi abeti prosperino grazie a due fattori: un microclima umido con nebbie persistenti
      e un ecotipo resistente all’aridità estiva. I popolamenti di abete rosso, pino cembro e larice del Gran
      Bosco vantano una qualità genetica tale da essere iscritti nel Libro nazionale dei boschi da seme per i
      rimboschimenti dell’arco alpino.


      La vegetazione si trasforma salendo di quota. Nel fondovalle crescono latifoglie come frassini, betulle,
      aceri e ontani, con tassi isolati. Dai 1300 metri dominano le conifere: fino a 1800 metri prevalgono
      abete bianco e abete rosso, sostituiti più in alto da pino cembro e larice, con una cembreta pura al
      Piccolo Bosco. Nei settori aridi e rocciosi alligna il pino silvestre. Oltre il limite degli alberi si
      sviluppano brughiere a rododendro e mirtillo e pascoli d’alta quota. La flora supera le 600 specie; la
      Torbiera del Blegier costituisce l’unica stazione confermata in Piemonte di *Utricularia minor*, e 28
      specie di orchidee fioriscono da maggio a settembre.
    wildlife: >-
      Nel parco si contano circa 140 specie di uccelli, di cui ottanta nidificanti d’ambiente alpino. Tra i
      rapaci compaiono l’astore, lo sparviere, la [poiana](/especie/buteo_buteo/), il
      [gheppio](/especie/falco_tinnunculus/), il [gipeto](/especie/gypaetus_barbatus/) e una coppia
      nidificante di [aquila reale](/especie/aquila_chrysaetos/); di notte cacciano l’allocco, il [gufo
      reale](/especie/bubo_bubo/) e la civetta capogrosso. La nocciolaia vive associata alle cembrete, mentre
      il piviere tortolino sosta sui pascoli sommitali.


      Tra i mammiferi popolano i boschi lepre variabile, scoiattolo, [marmotta](/especie/marmota_marmota/),
      volpe, ermellino, donnola, faina, martora e tasso, oltre a quattro ungulati:
      [camoscio](/especie/rupicapra_rupicapra/), cinghiale, [cervo](/especie/cervus_elaphus/) e
      [capriolo](/especie/capreolus_capreolus/). Cervo e capriolo, reintrodotti a fini venatori negli anni
      sessanta, proliferarono senza predatori minacciando la rigenerazione naturale dell’abetaia. Nel 1997 il
      [lupo](/especie/canis_lupus/) ha ricolonizzato il Gran Bosco, insediandovi il primo branco stabile delle
      Alpi Cozie.


      Il calendario offre appuntamenti peculiari: a settembre e ottobre il parco organizza uscite serali per
      ascoltare il bramito dei cervi, di media difficoltà con rientro notturno. Le orchidee fioriscono da
      maggio a settembre. I percorsi sono tracciati per la stagione estiva, mentre in inverno le piste
      innevate si percorrono con sci o ciaspole.
    visit: >-
      Sedici sentieri segnalati, per circa 70 km complessivi, solcano il parco dal fondovalle ai crinali. Vi
      transitano percorsi di respiro internazionale quali la Via Alpina, il Glorioso Rimpatrio dei valdesi, la
      Grande Traversata delle Alpi e la Via Francigena. Tutte le carrarecce sterrate interne sono interdette
      ai veicoli a motore e si percorrono a piedi, in bicicletta, con gli sci o con le racchette da neve. La
      strada militare dell’Assietta è chiusa ai mezzi a motore il mercoledì e il sabato.


      Il varco principale è Salbertrand, servita dalla ferrovia; dalla stazione una breve camminata conduce al
      parcheggio Pinea, punto di partenza delle escursioni. Un anello storico-culturale di 7 km tra paese e
      parco richiede circa 2 ore tra testimonianze della vita rurale alpina. La Strada dei Cannoni ha un tempo
      stimato di due ore e mezza.


      Il centro visite presso la sede di Salbertrand costituisce il punto informativo principale, da cui
      partono il sentiero didattico Oreste Rey e Fulvio Norse, l’itinerario dell’Ecomuseo Colombano Romean e
      il Giardino delle farfalle.
    history: >-
      L’Ecomuseo Colombano Romean valorizza il paesaggio, l’architettura rurale, la tecnologia idraulica e la
      memoria dell’Alta Valle di Susa. Sul crinale si stagliano i trinceramenti dell’Assietta, teatro della
      battaglia del 19 luglio 1747, mentre tra il 1938 e il 1942 vennero scavati bunker del Vallo Alpino a
      presidio del confine.
    before: >-
      L’accesso al parco è libero, consentito esclusivamente attraverso i varchi ufficiali, le piste forestali
      e i sentieri tracciati. I cani sono vietati al di fuori delle aree attrezzate e devono essere sempre
      condotti al guinzaglio.
    around: >-
      A tre chilometri sorge il [Parco Naturale Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) e
      a sette il [Parco Naturale della Val Troncea](/lugar/parco-naturale-della-val-troncea/). Il [Parco
      Naturale Regionale del Queyras](/lugar/parc-naturel-regional-du-queyras/) dista diciannove chilometri e
      il [Parco Nazionale della Vanoise](/lugar/parc-national-de-la-vanoise/) ventidue.
  pt:
    intro: >-
      Já no século XVIII, destes abetais saíam as grandes vigas mestras para os edifícios mais emblemáticos da
      Casa de Saboia: o Arsenal de Turim, a Basílica de Superga e o Palácio Real de Venaria. O que outrora
      constituía uma coutada florestal estratégica é hoje uma reserva protegida: 700 hectares onde convivem o
      abeto-branco e o espruce, uma composição singular no coberto vegetal piemontês.


      O Parque Natural do Gran Bosco di Salbertrand foi criado pela Região do Piemonte em 1980. Abrange 3775
      hectares na margem direita do vale de Susa, estendendo-se dos 1000 metros de altitude até aos 2600
      metros na cumeada que delimita o vale de Chisone. A mata que lhe dá o nome é apenas o núcleo: cerca de
      70% do território é floresta, distribuindo-se o restante por pastagens alpinas e rochedos.
    landscape: >-
      Estima-se que estes abetos prosperem devido a dois fatores: um microclima específico com humidade
      atmosférica retida e um ecótipo resistente às secas estivais. Os povoamentos de espruce, pinheiro-suíço
      e lariço do Gran Bosco revelam tal excelência genética que constam do Registo Nacional de Florestas
      Produtoras de Sementes para repovoar os Alpes.


      A vegetação transforma-se com a altitude. No fundo do vale ocorrem folhosas como freixos, bétulas,
      áceres e amieiros, pontuados por teixos. A partir dos 1300 metros dominam as coníferas: até aos 1800
      metros prevalecem o abeto-branco e o espruce, sucedendo-se em altitude o pinheiro-suíço e o lariço, com
      um pinhal puro de pinheiro-suíço no Piccolo Bosco. Nas zonas pedregosas secas fixa-se o
      pinheiro-silvestre. Acima do limite das árvores surgem urzais de rododendros e mirtilos, seguidos de
      prados alpinos. A flora supera as 600 espécies; a turfeira de Blegier acolhe a única estação confirmada
      de *Utricularia minor* no Piemonte, e 28 espécies de orquídeas selvagens florescem de maio a setembro.
    wildlife: >-
      O parque alberga cerca de 140 espécies de aves, das quais oitenta são nidificantes de montanha. Entre as
      rapinas figuram o açor, o gavião-da-europa, a [águia-d’asa-redonda](/especie/buteo_buteo/), o
      [peneireiro-vulgar](/especie/falco_tinnunculus/), o [quebra-ossos](/especie/gypaetus_barbatus/) e um
      casal de [águias-reais](/especie/aquila_chrysaetos/); à noite caçam a coruja-do-mato, o
      [bufo-real](/especie/bubo_bubo/) e o mocho-funéreo. O quebra-nozes associa-se estritamente ao
      pinheiro-suíço e nas pastagens de altitude descansam migradores como o borrelho-ruivo.


      Nos mamíferos registam-se lebre-variável, esquilo, [marmota-alpina](/especie/marmota_marmota/), raposa,
      arminho, doninha, fuinha, marta e texugo, além de quatro ungulados:
      [camurça](/especie/rupicapra_rupicapra/), javali, [veado-vermelho](/especie/cervus_elaphus/) e
      [corço](/especie/capreolus_capreolus/). Estes dois últimos, introduzidos nos anos sessenta para fins
      venatórios, multiplicaram-se sem predadores até prejudicarem a regeneração dos abetos. Em 1997 o
      [lobo](/especie/canis_lupus/) regressou ao Gran Bosco, formando a primeira alcateia estável dos Alpes
      Cócios.


      O calendário ecológico tem tempos próprios: em setembro e outubro realizam-se percursos guiados para
      escutar a brama do veado, de dificuldade média e regresso noturno. As orquídeas florescem de maio a
      setembro. Os trilhos destinam-se ao verão; no inverno as pistas percorrem-se em esquis ou raquetes de
      neve.
    visit: >-
      Dezasseis trilhos sinalizados, totalizando cerca de 70 km, cruzam o parque do vale até aos cumes. É
      atravessado por rotas de relevo internacional como a Via Alpina, o Glorioso Retorno dos Valdenses, a
      Grande Traversata delle Alpi e a Via Francigena. Todos os caminhos de terra estão interditos ao tráfego
      motorizado e podem ser explorados a pé, de bicicleta, com esquis ou raquetes de neve. A panorâmica
      estrada militar da Assietta encerra a veículos motorizados às quartas-feiras e aos sábados.


      A porta de entrada é Salbertrand, servida por caminho-de-ferro; da estação uma curta caminhada leva ao
      parque de estacionamento Pinea, de onde partem os percursos. Entre a aldeia e o parque desenvolve-se um
      trilho circular de 7 km em cerca de 2 horas por marcos da cultura alpina. A Strada dei Cannoni cumpre-se
      em duas horas e meia.


      O centro de acolhimento na sede de Salbertrand funciona como posto informativo, acolhendo o trilho
      didático Oreste Rey e Fulvio Norse, o percurso do Ecomuseu Colombano Romean e o Jardim das Borboletas.
    history: >-
      O Ecomuseu Colombano Romean preserva o património etnográfico, a arquitetura hidráulica e a memória
      comunitária do Alto Vale de Susa. Na cumeada subsistem as trincheiras da Assietta, palco da célebre
      batalha de 19 de julho de 1747, enquanto entre 1938 e 1942 foram escavados búnkeres da muralha alpina
      (Vallo Alpino) para defesa fronteiriça.
    before: >-
      A entrada no parque é livre, realizando-se exclusivamente pelos pontos de acesso, pistas florestais e
      trilhos assinalados. É proibida a circulação de cães fora das áreas de merendas, devendo permanecer
      sempre com trela.
    around: >-
      A três quilómetros fica o [Parque Natural Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) e
      a sete o [Parque Natural do Val Troncea](/lugar/parco-naturale-della-val-troncea/). O [Parque Natural
      Regional do Queyras](/lugar/parc-naturel-regional-du-queyras/) dista dezanove quilómetros e o [Parque
      Nacional da Vanoise](/lugar/parc-national-de-la-vanoise/) vinte e dois.
