resumen:
  es: Pinares antiguos, abedulares y montañas de formas glaciares en el paisaje cultural sami de Laponia.
  en: Ancient pine stands, subalpine birch, and glacial landforms within the Sami cultural landscape of Lapland.
  fr: Pinèdes anciennes, bétulaies et modelés glaciaires au cœur du paysage culturel sami de Laponie.
  de: >-
    Uralte Kiefernwälder, Birkenbestände und glaziale Geländeformen in der samischen Kulturlandschaft
    Lapplands.
  it: Pinete vetuste, betulle subalpine e rilievi glaciali nel paesaggio culturale sami della Lapponia.
  pt: Pinhais ancestrais, bétulas e relevos glaciares na paisagem cultural sami da Lapónia.
unico:
  es: >-
    Sus bosques viejos dan paso a abedulares y alta montaña en un paisaje de formas glaciares que también
    recorrieron las caravanas de renos de los sami.
  en: >-
    Old-growth forests transition into birch woods and high alpine peaks shaped by glaciers, once traversed by
    Sami reindeer caravans.
  fr: >-
    Ses forêts anciennes cèdent le pas aux bouleaux et à la haute montagne glaciaire, jadis sillonnée par les
    caravanes de rennes samies.
  de: >-
    Uralte Nadelwälder weichen Birkenhainen und hochalpinen Kämmen mit Gletscherspuren, einst durchquert von
    den Rentierkarawanen der Samen.
  it: >-
    Le sue foreste primarie cedono il passo a boschi di betulle e vette alpine modellate dai ghiacci, solcate
    un tempo dalle carovane di renne dei sami.
  pt: >-
    As suas matas primitivas dão lugar a bétulas e alta montanha com marcas glaciares, outrora percorridas
    pelas caravanas de renas dos samis.
observaciones:
  es: >-
    Confirma el calendario de Naturum y consulta las condiciones de la excursión antes de salir. Los paseos
    adaptados son los del entorno del centro y Sjöfallsudden; el resto es montaña. Entre enero y abril se
    admiten perros con correa en el parque; fuera de ese periodo rige una zona permitida delimitada.
texto:
  es:
    intro: >-
      Cinco grandes cascadas caían antes por la franja mårka hacia el lago Láŋas, y por ellas se creó en 1909
      el Parque Nacional de Stora Sjöfallet, o Stuor Muorkke. Hoy el salto es mucho menor, pero el parque
      sigue ahí, en Norrbotten, en la Laponia sueca, parte del Patrimonio Mundial de Laponia. Se extiende a
      ambos lados del embalse Áhkkájávrre y combina cordilleras, valles profundos, mesetas pedregosas, cumbres
      y glaciares. Una carretera lo atraviesa y acerca al visitante a algunos de sus sectores.
    landscape: >-
      La geografía se lee casi como un mapa. Al norte, Dievssávágge forma el límite; al sur se alza Áhkká con
      sus glaciares, y el macizo ocupa la parte occidental del parque. Akkajaure atraviesa buena parte del
      área y separa los sectores de Gällivare y Jokkmokk. Por el oeste, el parque limita con Sarek, y por el
      este con la reserva de Sjaunja.


      Casi todo lo que ves lo hizo el hielo. Bietsávrre descansa en un valle en U excavado por el hielo
      continental, y los ríos de deshielo depositaron arenas en su sandur. El desfiladero de Áhusjgårsså se
      formó cuando se derritió ese mismo hielo. Las terrazas de Áhkká son antiguos deltas de lagos glaciares:
      al retirarse el hielo y el agua, quedaron en seco. Y desde las cimas de Giergav se pueden observar Sarek
      y Kebnekaisefjällen.


      Subir por el parque es atravesar escalones de vida. Junto a la carretera de entrada aparece un pinar
      antiguo, con árboles muy viejos y pinos secos de color plateado. Más arriba vienen los abedulares de
      montaña, los brezales alpinos y las cumbres con neveros y glaciares. La nieve decide el reparto: en las
      zonas expuestas crecen krypljung y fjällgröna, y en los neveros, dvärgvide y mossljung. La angélica de
      montaña es una de las plantas útiles frecuentes en Teusadalen y en las laderas meridionales de
      Áhkkájávvre, y el pueblo sami utilizaba skvattram como repelente de mosquitos.
    wildlife: >-
      Los grandes mamíferos que se citan para el parque son el [alce](/especie/alces_alces/), el
      [glotón](/especie/gulo_gulo/), el [oso](/especie/ursus_arctos/) y el [lince](/especie/lynx_lynx/).
      Ninguno es fácil de ver, aunque el alce es el que más probabilidades ofrece. En la garganta de
      Áhusjgårsså pueden buscarse huellas de lince entre los roquedos. Entre las aves características están el
      escribano nival, el escribano lapón, la collalba gris, el [chorlito
      dorado](/especie/pluvialis_apricaria/) y el [lagópodo alpino](/especie/lagopus_muta/); en Ippátjåhkkå se
      puede encontrar busardo calzado y lagópodos durante la caminata.


      El calendario lo marca la nieve. La duración del manto crea contrastes entre lomas y depresiones, que no
      quedan descubiertas al mismo tiempo ni siquiera en verano, así que una misma salida puede reunir
      vegetación en fases distintas.


      Y en el paisaje trabaja gente. Sirges y Unna tjerusj tienen asentamientos sami y pastos de renos dentro
      del área, y en verano los rebaños usan los valles de montaña. El [reno](/especie/rangifer_tarandus/) es
      parte de un espacio de trabajo y continuidad cultural.
    visit: >-
      Gällivare y Jokkmokk son los puntos de partida; desde ellos se continúa en autobús o coche por la
      carretera 827, el Camino hacia el Oeste, en dirección a Ritsem. Esa carretera atraviesa el parque y
      conecta áreas de descanso con Naturum Laponia. Si vas en autobús, comprueba las conexiones de ida y
      vuelta.


      Naturum Laponia está en Viedásnjárgga, junto al lago Láŋas. Sus exposiciones explican las montañas, los
      bosques, las turberas, las estaciones y el lugar del reno en la cultura sami; hay actividades
      infantiles, charlas sobre el modo sami de convivir con la naturaleza y préstamo de prismáticos. Las
      exposiciones y el aseo están adaptados para personas con movilidad reducida, y cerca del edificio hay
      una senda informativa de pasarelas y grava compactada.


      Para caminar, el sendero de Ippátjåhkkå sigue una antigua vía de traslado de caravanas de renos. Parte
      del bosque viejo, cruza el abedular y llega a la montaña abierta: unos dos kilómetros, para media
      jornada. Världsarvsstigen recorre alrededor de un kilómetro con paneles sobre el bosque viejo y sus
      huellas humanas. Y Sjöfallsudden ofrece un paseo de hasta dos horas por un camino apto para cochecitos y
      sillas de ruedas.
    history: >-
      El parque se declaró en 1909 sobre todo por la cascada. Después, desde 1919, los límites se redujeron
      para permitir el desarrollo hidroeléctrico, que redujo la cascada que dio nombre al parque. El salto que
      se ve hoy es el de un río regulado.


      El plan de Laponia incluye un documento de manejo y normas aplicables a Stora Sjöfallet. En el parque no
      se permite cortar ramas ni talar árboles vivos o muertos para hacer fuego.
    before: >-
      Confirma el calendario de Naturum y consulta las condiciones de la excursión antes de salir. Los paseos
      adaptados son los del entorno del centro y Sjöfallsudden; el resto es montaña. Entre enero y abril se
      admiten perros con correa en el parque; fuera de ese periodo rige una zona permitida delimitada.
    around: >-
      Stora Sjöfallet casi se toca con sus vecinos: el [Parque Nacional de
      Padjelanta](/lugar/padjelanta-national-park/) está a 1 km y el [Parque Nacional de
      Sarek](/lugar/sarek-national-park/) a 2 km. Más lejos, otros lugares comparten con él el reno y el
      águila real, como el [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/), que además
      comparte el alce, con alta montaña y bosque primario; el [Parque Nacional de
      Jotunheimen](/lugar/jotunheimen-national-park/), con alta montaña y glaciares; el [Parque Nacional de
      Lemmenjoki](/lugar/lemmenjoki-national-park/), con alta montaña y bosque primario; y el [Parque Nacional
      de Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), también con alta montaña y
      glaciares.
  en:
    intro: >-
      Five mighty waterfalls once cascaded across the mårka strip into Lake Láŋas, prompting the creation of
      Stora Sjöfallet National Park, or Stuor Muorkke, in 1909. While hydroelectric diversion has
      significantly reduced the falls today, the national park endures in Norrbotten, Swedish Lapland, forming
      an integral part of the Laponian World Heritage area. Spanning both flanks of the Áhkkájávrre reservoir,
      it unites jagged cordilleras, deep glacial troughs, stony plateaus, high peaks, and cirque glaciers. A
      paved road bisects the park, offering direct access into several sectors.
    landscape: >-
      The geography reads almost like a relief map. To the north, Dievssávágge defines the park boundary; to
      the south rises Áhkká with its glacier crowns, dominating the western territory. Akkajaure divides the
      bulk of the park between the municipalities of Gällivare and Jokkmokk. On the west, the boundary borders
      Sarek, while to the east lies the vast Sjaunja Nature Reserve.


      Nearly every landform reflects glacial action. Bietsávrre rests within a U-shaped trough gouged by
      continental ice, where meltwater rivers spread wide gravel sandurs. The Áhusjgårsså canyon was excavated
      by catastrophic glacial drainage. The perched terraces of Áhkká represent ancient glacial-lake deltas
      left high and dry after ice and water receded. From the summits of Giergav, sweeping vistas extend
      toward Sarek and the Kebnekaisefjällen.


      Climbing through the park reveals ascending ecological tiers. Beside the entry highway stands ancient
      Scots pine forest, rich with old-growth relics and silvered snags. Higher up, mountain birchwoods give
      way to alpine dwarf shrub heaths, snowfields, and glaciated summits. Snow cover dictates plant
      distribution: wind-scoured ridges support krypljung and fjällgröna, while late snowbeds nurture
      dvärgvide and mossljung. Mountain angelica is widespread across Teusadalen and the south-facing slopes
      of Áhkkájávvre, and skvattram was traditionally gathered by Sami herders as a natural mosquito
      repellent.
    wildlife: >-
      Large mammals documented in the park include the [moose](/especie/alces_alces/), the
      [wolverine](/especie/gulo_gulo/), the [brown bear](/especie/ursus_arctos/), and the [Eurasian
      lynx](/especie/lynx_lynx/). Sightings demand luck and patience, though moose are the most regularly
      encountered. In the Áhusjgårsså gorge, lynx tracks can occasionally be spotted among the crags.
      Characteristic avifauna features the snow bunting, Lapland longspur, northern wheatear, [European golden
      plover](/especie/pluvialis_apricaria/), and [rock ptarmigan](/especie/lagopus_muta/); rough-legged
      buzzards and ptarmigan are often noted along the Ippátjåhkkå trail.


      The seasons follow the snowpack. Lingering snowdrifts create sharp microclimates between exposed knolls
      and shaded hollows that thaw weeks apart, even in midsummer, allowing one to observe plants at varied
      phenological stages during a single excursion.


      This remains a living cultural landscape. The Sirges and Unna tjerusj Sami communities maintain
      traditional settlements and grazing ranges within the park, driving herds into the high mountain valleys
      during summer. The [caribou](/especie/rangifer_tarandus/) is an active pillar of heritage and pastoral
      continuity.
    visit: >-
      Gällivare and Jokkmokk serve as primary gateways; from either town, travel continues by car or bus along
      Route 827, known as the Road to the West, toward Ritsem. This artery crosses the park and links roadside
      trailheads with Naturum Laponia. If traveling by bus, verify round-trip timetables carefully.


      Naturum Laponia is located at Viedásnjárgga beside Lake Láŋas. Interpretive exhibits illustrate high
      mountains, taiga forests, bogs, changing seasons, and the central role of reindeer in Sami culture;
      staff offer children’s activities, talks on traditional Sami ecological knowledge, and binocular loans.
      Displays and restrooms are wheelchair accessible, and an interpretive gravel boardwalk trail begins
      outside the visitor centre.


      For hiking, the Ippátjåhkkå trail follows an ancient reindeer migration route. Climbing out of old pine
      woods through mountain birch to open tundra, it spans about two kilometres, ideal for a half-day outing.
      Världsarvsstigen offers an informative one-kilometre loop detailing old-growth forest history and
      cultural traces. Sjöfallsudden provides an easy stroll of up to two hours along an accessible path
      suitable for wheelchairs and prams.
    history: >-
      The park was gazetted in 1909 primarily to protect the thunderous waterfall. Beginning in 1919, however,
      its boundaries were redrawn to accommodate hydroelectric dam construction, which drastically reduced the
      cascade that gave the park its name. The falls visible today flow under regulated release.


      The Laponia Management Plan outlines specific conservation guidelines for Stora Sjöfallet. Within park
      boundaries, breaking branches or cutting living or dead trees for firewood is strictly prohibited.
    before: >-
      Check Naturum opening hours and weather advisories prior to heading out. Wheelchair-accessible paths are
      limited to the immediate vicinity of the visitor centre and Sjöfallsudden; all other routes enter rugged
      wilderness. Dogs on leash are permitted park-wide between January and April; outside these months,
      restrictions apply to designated corridors.
    around: >-
      Stora Sjöfallet adjoins major wild areas: [Padjelanta National Park](/lugar/padjelanta-national-park/)
      lies 1 km away and [Sarek National Park](/lugar/sarek-national-park/) just 2 km away. Further afield,
      other northern reserves share reindeer and golden eagles, such as [Urho Kekkonen National
      Park](/lugar/urho-kekkonen-national-park/), which also hosts moose amidst old-growth forest;
      [Jotunheimen National Park](/lugar/jotunheimen-national-park/), with alpine crests and glaciers;
      [Lemmenjoki National Park](/lugar/lemmenjoki-national-park/), featuring virgin taiga and open fells; and
      [Saltfjellet-Svartisen National Park](/lugar/saltfjellet-svartisen-nasjonalpark/), renowned for mountain
      wilderness and glaciers.
  fr:
    intro: >-
      Cinq grandes cascades franchissaient jadis le verrou rocheux du mårka pour se jeter dans le lac Láŋas,
      motivant en 1909 la création du parc national de Stora Sjöfallet, ou Stuor Muorkke. Bien que leur débit
      ait été considérablement réduit par les aménagements hydroélectriques, le parc subsiste en Norrbotten,
      en Laponie suédoise, inscrit au patrimoine mondial de la région de Laponie. Il s’étend de part et
      d’autre de la retenue d’Áhkkájávrre, combinant crêtes déchiquetées, auges glaciaires profondes, hauts
      plateaux caillouteux, cimes et glaciers. Une route le traverse de part en part, facilitant l’accès à
      plusieurs secteurs.
    landscape: >-
      La géographie des lieux se lit comme une carte d’état-major. Au nord, Dievssávágge marque la limite ; au
      sud se dresse l’imposant massif d’Áhkká et ses glaciers, dominant la partie occidentale du parc.
      L’Akkajaure sépare une grande partie de l’espace entre les communes de Gällivare et de Jokkmokk. À
      l’ouest, le parc jouxte le Sarek, tandis qu’à l’est il borde la vaste réserve de Sjaunja.


      Presque tous les reliefs portent l’empreinte des glaces. Bietsávrre repose au fond d’une vallée en U
      creusée par l’inlandsis, où les torrents glaciaires ont étalé des sandurs sablonneux. La gorge
      d’Áhusjgårsså s’est formée lors de la vidange brutale des eaux de fonte. Les terrasses étagées d’Áhkká
      correspondent à d’anciens deltas lacustres perchés lors du retrait glaciaire. Depuis les hauteurs de
      Giergav, le regard embrasse les crêtes du Sarek et le massif du Kebnekaise.


      Gravir les pentes du parc revient à franchir les étages de végétation arctique. En bordure de la route
      d’accès s’étend une pinède ancienne jalonnée de chicots argentés séculaires. Plus haut s’épanouissent
      les forêts de bouleaux tortueux, puis les landes alpines et les névés sommeliers. L’enneigement
      détermine la flore : les crêtes ventées accueillent krypljung et fjällgröna, tandis que les combes à
      neige abritent dvärgvide et mossljung. L’angélique des bois abonde dans la Teusadalen et sur les
      versants sud d’Áhkkájávvre, et le lédon des marais était récolté par les Samis comme répulsif
      antimoustique.
    wildlife: >-
      Les grands mammifères fréquentant le parc comprennent l’[élan](/especie/alces_alces/), le
      [glouton](/especie/gulo_gulo/), l’[ours brun](/especie/ursus_arctos/) et le [lynx
      boréal](/especie/lynx_lynx/). Tous restent discrets, bien que l’élan s’observe plus régulièrement. Dans
      la gorge d’Áhusjgårsså, des empreintes de lynx se repèrent parfois dans les éboulis. Parmi les oiseaux
      typiques figurent le bruant des neiges, le plectrophane lapon, le traquet motteux, le [pluvier
      doré](/especie/pluvialis_apricaria/) et le [lagopède alpin](/especie/lagopus_muta/) ; la buse pattue
      s’observe fréquemment le long des sentiers d’Ippátjåhkkå.


      Le manteau neigeux rythme le calendrier écologique. La fonte inégale crée des contrastes marqués entre
      crêtes dégagées et dépressions encore gelées en plein été, permettant d’observer des stades de floraison
      très divers au cours d’une même randonnée.


      Le territoire demeure habité et exploité. Les communautés samies de Sirges et d’Unna tjerusj y
      perpétuent l’élevage du renne et déplacent leurs troupeaux vers les pâturages d’estive. Le
      [renne](/especie/rangifer_tarandus/) s’inscrit pleinement dans cet espace de vie et de continuité
      culturelle.
    visit: >-
      Gällivare et Jokkmokk constituent les portes d’entrée principales ; de là, liaisons en bus ou voiture
      empruntent la route 827, surnommée la Voie de l’Ouest, en direction de Ritsem. Cette chaussée traverse
      le parc et relie plusieurs départs de randonnée au Naturum Laponia. En bus, vérifiez soigneusement les
      horaires aller et retour.


      Le Naturum Laponia se situe à Viedásnjárgga, au bord du lac Láŋas. Ses expositions permanentes dévoilent
      la montagne, les forêts, les tourbières, le cycle des saisons et le rôle primordial du renne dans la
      culture samie ; des animations pour enfants, des conférences et des prêts de jumelles y sont proposés.
      Les espaces d’exposition et les sanitaires sont accessibles aux personnes à mobilité réduite, et un
      sentier pédagogique sur platelage entoure le bâtiment.


      Pour randonner, le sentier d’Ippátjåhkkå emprunte une ancienne piste de migration de rennes. Partant de
      la forêt ancienne, il franchit la bétulaie et atteint les landes d’altitude : environ deux kilomètres,
      parfaits pour une demi-journée. Le sentier Världsarvsstigen parcourt près d’un kilomètre jalonné de
      panneaux sur la forêt séculaire et les traces pastorales. Enfin, Sjöfallsudden offre une agréable
      promenade de près de deux heures sur chemin roulant adapté aux poussettes et fauteuils.
    history: >-
      Le parc a été fondé en 1909 essentiellement pour préserver la grande cascade. Dès 1919 toutefois, ses
      frontières furent réduites afin de permettre des aménagements hydroélectriques qui diminuèrent
      drastiquement la chute éponyme. La cascade observable aujourd’hui dépend du régime régulé du barrage.


      Le plan de gestion de Laponie encadre strictement les usages à Stora Sjöfallet. Il est formellement
      interdit de couper des branches ou d’abattre du bois mort ou vif pour allumer des feux.
    before: >-
      Consultez les horaires du Naturum et l’état des sentiers avant de partir. Seuls les abords immédiats du
      centre et Sjöfallsudden sont aménagés pour les personnes à mobilité réduite ; le reste du parc relève de
      la haute montagne sauvage. Les chiens tenus en laisse sont autorisés de janvier à avril ; en dehors de
      cette période, la circulation canine est cantonnée à des zones strictes.
    around: >-
      Stora Sjöfallet jouxte de vastes sanctuaires voisins : le [parc national de
      Padjelanta](/lugar/padjelanta-national-park/) se trouve à 1 km et le [parc national de
      Sarek](/lugar/sarek-national-park/) à 2 km. Plus loin, d’autres contrées abritent le renne et l’aigle
      royal, à l’image du [parc national Urho Kekkonen](/lugar/urho-kekkonen-national-park/), qui héberge
      aussi l’élan au cœur de taïgas vierges ; du [parc national de
      Jotunheimen](/lugar/jotunheimen-national-park/), célèbre pour ses hauts sommets et glaciers ; du [parc
      national de Lemmenjoki](/lugar/lemmenjoki-national-park/), alliant forêts primaires et monts arctiques ;
      et du [parc national de Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), riche en
      paysages glaciaires alpins.
  de:
    intro: >-
      Fünf gewaltige Wasserfälle stürzten einst über die Geländestufe des mårka in den See Láŋas, weshalb 1909
      der Nationalpark Stora Sjöfallet, auf Samisch Stuor Muorkke, gegründet wurde. Zwar ist die Fallhöhe
      durch Wasserkraftnutzung stark reduziert, doch der Park im nordschwedischen Norrbotten bleibt ein
      Kernstück des UNESCO-Welterbes Laponia. Er erstreckt sich zu beiden Seiten des Stausees Áhkkájávrre und
      vereint schroffe Gebirgskämme, tiefe Trogtäler, felsige Hochflächen, Gipfel und Gletscher. Eine Straße
      durchquert das Gebiet und erschließt mehrere Abschnitte für Besucher.
    landscape: >-
      Die Geografie lässt sich wie eine Geländekarte lesen. Im Norden bildet Dievssávágge die Parkgrenze; im
      Süden ragt das vergletscherte Áhkká-Massiv empor und beherrscht den westlichen Teil des Parks. Der
      Akkajaure teilt das Areal zwischen den Gemeinden Gällivare und Jokkmokk. Im Westen grenzt der Park an
      Sarek, im Osten an das Naturreservat Sjaunja.


      Fast jede Geländeform zeugt vom Inlandeis. Bietsávrre ruht in einem glazialen Trogtal, dessen
      Schmelzwasserströme breite Sanderflächen ablagerte. Die Klamm Áhusjgårsså entstand beim katastrophalen
      Abfluss der Schmelzwasser. Die Hangterrassen des Áhkká sind ehemalige Deltas eiszeitlicher Stauseen, die
      nach dem Rückzug des Eises trockenfielen. Von den Graten des Giergav reicht der Blick bis nach Sarek und
      zum Kebnekaisefjällen.


      Beim Aufstieg durch den Park durchquert man unterschiedliche Höhenstufen arktischen Lebens. Entlang der
      Zugangsstraße wächst lichter Urwald mit jahrhundertealten Kiefern und silbergrauen Baumruinen. Weiter
      oben folgen Fjällbirkenwälder, Zwergstrauchheiden, Schneetälchen und eisbedeckte Gipfel. Die Schneedecke
      entscheidet über die Vegetation: An windgefegten Kämmen trotzen krypljung und fjällgröna der Kälte,
      während in feuchten Schneetälchen dvärgvide und mossljung gedeihen. Die Arznei-Engelwurz wächst
      verbreitet im Teusadalen und an den Südhängen des Áhkkájávvre; skvattram nutzten die Samen traditionell
      zur Mückenabwehr.
    wildlife: >-
      Zu den großen Säugetieren des Nationalparks zählen [Elch](/especie/alces_alces/),
      [Vielfraß](/especie/gulo_gulo/), [Braunbär](/especie/ursus_arctos/) und [Eurasischer
      Luchs](/especie/lynx_lynx/). Sichtungen erfordern Geduld, wobei der Elch am ehesten zu beobachten ist.
      In der Schlucht Áhusjgårsså lassen sich gelegentlich Luchsspuren im Geröll finden. Typische Vögel der
      Tundra sind Schneeammer, Spornammer, Steinschmätzer, [Goldregenpfeifer](/especie/pluvialis_apricaria/)
      und [Alpenschneehuhn](/especie/lagopus_muta/); Raufußbussarde kreisen regelmäßig über dem
      Ippátjåhkkå-Pfad.


      Der Jahresverlauf wird vom Schnee bestimmt. Da Schneewehen an Hängen und in Mulden oft bis in den
      Hochsommer überdauern, liegen Vegetationszonen mit unterschiedlichem Blühstadium eng nebeneinander.


      Das Gebiet ist eine lebendige Kulturlandschaft. Die samischen Gemeinschaften Sirges und Unna tjerusj
      besitzen hier traditionelle Siedlungsplätze und Rentierweiden; im Sommer ziehen die Herden durch die
      Gebirgstäler. Das [Ren](/especie/rangifer_tarandus/) bildet das Herzstück dieser kontinuierlichen
      Bewirtschaftung.
    visit: >-
      Gällivare und Jokkmokk dienen als Ausgangsorte; von dort führt der Weg mit Bus oder Auto über die Straße
      827, den Vägen västerut, in Richtung Ritsem. Diese Route durchquert den Park und verbindet Rastplätze
      mit dem Naturum Laponia. Bei Busreisen solltest du Hin- und Rückfahrtzeiten genau abstimmen.


      Das Naturum Laponia liegt in Viedásnjárgga am See Láŋas. Die Ausstellungen erläutern Hochgebirge,
      Wälder, Moore, Jahreszeiten und die Bedeutung des Rentiers in der samischen Kultur; vor Ort gibt es
      Angebote für Kinder, Vorträge und Fernglasverleih. Die Räume und Toiletten sind barrierefrei zugänglich,
      und vor dem Gebäude beginnt ein rollstuhlgerechter Holzbohlenpfad mit Infotafeln.


      Der Wanderweg Ippátjåhkkå folgt einer historischen Rentierzugroute. Er führt vom Kiefernurwald durch den
      Birkenwald ins offene Fjäll: etwa zwei Kilometer Strecke für einen Halbtagesausflug. Der
      Världsarvsstigen vermittelt auf rund einem Kilometer Wissenswertes über Urwaldrelikte und menschliche
      Spuren. Sjöfallsudden bietet einen bis zu zwei Stunden langen, barrierearmen Spaziergang auf befestigtem
      Untergrund.
    history: >-
      Der Park wurde 1909 hauptsächlich zum Schutz der gewaltigen Wasserfälle eingerichtet. Ab 1919
      verkleinerte man jedoch die Parkgrenzen zugunsten der Wasserkraftnutzung, was die namensgebenden
      Kaskaden auf ein Rinnsal reduzierte. Der heutige Abfluss unterliegt strenger Regulierung.


      Der Laponia-Managementplan regelt den Naturschutz in Stora Sjöfallet verbindlich. Das Brechen von Ästen
      oder Fällen lebender oder toter Bäume für Lagerfeuer ist im gesamten Park strengstens verboten.
    before: >-
      Prüfe vorab die Öffnungszeiten des Naturums und die Wetterlage. Barrierefreie Wege beschränken sich auf
      das Gelände um das Naturum und Sjöfallsudden; alle übrigen Pfade führen in alpines Gelände. Hunde an der
      Leine sind von Januar bis April im ganzen Park gestattet; in den übrigen Monaten gelten strenge
      Zonenvorgaben.
    around: >-
      Stora Sjöfallet grenzt unmittelbar an weitere Wildnisgebiete: Der [Nationalpark
      Padjelanta](/lugar/padjelanta-national-park/) liegt 1 km entfernt und der [Nationalpark
      Sarek](/lugar/sarek-national-park/) 2 km. In größerer Entfernung beherbergen weitere Schutzgebiete
      Rentiere und Steinadler, etwa der [Urho-Kekkonen-Nationalpark](/lugar/urho-kekkonen-national-park/), wo
      auch Elche in Taigawäldern leben; der [Nationalpark Jotunheimen](/lugar/jotunheimen-national-park/) mit
      schroffen Gletschern; der [Lemmenjoki-Nationalpark](/lugar/lemmenjoki-national-park/) mit unberührten
      Nadelwäldern; sowie der [Saltfjellet-Svartisen-Nationalpark](/lugar/saltfjellet-svartisen-nasjonalpark/)
      mit alpinen Eis- und Gebirgslandschaften.
  it:
    intro: >-
      Cinque imponenti cascate precipitavano un tempo lungo la fascia rocciosa del mårka verso il lago Láŋas,
      e per tutelarle fu istituito nel 1909 il Parco Nazionale di Stora Sjöfallet, o Stuor Muorkke. Benché la
      portata dei salti sia oggi ridotta dallo sfruttamento idroelettrico, il parco resiste nel Norrbotten,
      nella Lapponia svedese, integrato nel Patrimonio Mondiale della Lapponia. Si allunga su entrambe le
      sponde dell’invaso di Áhkkájávrre, combinando creste aguzze, valli glaciali profonde, altipiani
      detritici, vette e ghiacciai. Una strada carrozzabile lo attraversa consentendo di raggiungerne diversi
      settori.
    landscape: >-
      La conformazione del territorio si legge quasi come una mappa geografica. A nord, Dievssávágge segna il
      confine; a sud svetta l’Áhkká con la sua corona di ghiacciai, occupando la porzione occidentale del
      parco. Il bacino di Akkajaure divide la maggior parte dell’area tra i comuni di Gällivare e Jokkmokk. A
      ovest il confine tocca il Sarek, a est la riserva naturale di Sjaunja.


      Quasi tutte le forme del rilievo sono state modellate dal ghiaccio. Il lago Bietsávrre occupa una valle
      a U scavata dall’inlandsis, dove le acque di fusione hanno accumulato ampi banchi di sabbia e ghiaia. La
      forra di Áhusjgårsså si formò durante il disgelo tumultuoso. Le terrazze pensili dell’Áhkká
      rappresentano antichi delta lacustri rimasti all’asciutto dopo il ritiro delle calotte. Dalle creste del
      Giergav lo sguardo spazia fino alle vette del Sarek e del Kebnekaisefjällen.


      Risalire le pendici significa attraversare i piani altitudinali della tundra. Lungo la strada di
      fondovalle si estendono pinete secolari con alberi vetusti e tronchi disseccati dal tipico colore
      argenteo. Più in alto subentrano le betulle alpine, le brughiere montane e le cime rocciose con nevai
      perenni. Il manto nevoso determina la flora: sui crinali ventosi crescono krypljung e fjällgröna, mentre
      nei valloni nivali attecchiscono dvärgvide e mossljung. L’angelica selvatica è comune nella Teusadalen e
      sui versanti meridionali dell’Áhkkájávvre, mentre lo skvattram veniva impiegato tradizionalmente dai
      sami come repellente per zanzare.
    wildlife: >-
      Tra i grandi mammiferi censiti nel parco figurano l’[alce](/especie/alces_alces/), il
      [ghiottone](/especie/gulo_gulo/), l’[orso bruno](/especie/ursus_arctos/) e la [lince
      boreale](/especie/lynx_lynx/). Gli avvistamenti richiedono fortuna, ma l’alce è quello che offre
      maggiori probabilità. Nella gola di Áhusjgårsså è possibile scorgere orme di lince tra i massi. Tra i
      volatili nidificanti spiccano lo zigolo delle nevi, lo zigolo di Lapponia, il culbianco, il [piviere
      dorato](/especie/pluvialis_apricaria/) e la [pernice bianca](/especie/lagopus_muta/); la poiana calzata
      è frequente lungo i sentieri dell’Ippátjåhkkå.


      I ritmi biologici sono scanditi dal manto nevoso. Il disgelo discontinuo crea forti differenze
      fenologiche tra dossi aridi e avvallamenti ancora innevati in piena estate, consentendo di osservare
      fioriture in stadi differenti durante una singola escursione.


      Il parco è anche una terra vissuta e lavorata. Le comunità sami di Sirges e Unna tjerusj mantengono
      accampamenti tradizionali e pascoli per le renne all’interno dell’area, conducendo le mandrie nelle
      vallate estive. La [renna](/especie/rangifer_tarandus/) è parte fondamentale di questo paesaggio vivo e
      della continuità culturale locale.
    visit: >-
      Gällivare e Jokkmokk sono i centri di riferimento principali; da lì si prosegue in autobus o in
      automobile lungo la strada 827, detta la Via dell’Ovest, in direzione di Ritsem. L’arteria attraversa il
      parco collegando aree di sosta e il Naturum Laponia. Se utilizzi i mezzi pubblici, verifica gli orari di
      andata e ritorno.


      Il Naturum Laponia si trova a Viedásnjárgga, in riva al lago Láŋas. Gli allestimenti didattici
      illustrano le montagne, le foreste, le torbiere, l’avvicendarsi delle stagioni e il posto della renna
      nella cultura sami; vengono organizzate attività didattiche, incontri culturali e noleggio di binocoli.
      Le sale espositive e i servizi igienici sono accessibili a persone con mobilità ridotta, e all’esterno
      parte un percorso tematico su passerelle di legno e ghiaia battuta.


      Per camminare, il tracciato dell’Ippátjåhkkå segue un antico sentiero di transumanza delle renne.
      Salendo dal bosco vetusto attraverso la betullaia fino ai pascoli aperti, copre circa due chilometri,
      ideale per mezza giornata. Il Världsarvsstigen si sviluppa per circa un chilometro con pannelli sulla
      foresta vergine e sulle testimonianze umane. Sjöfallsudden consente una piacevole passeggiata fino a due
      ore lungo una pista agevole adatta a passeggini e sedie a rotelle.
    history: >-
      Il parco fu istituito nel 1909 proprio a tutela delle poderose cascate. Dal 1919 tuttavia i confini
      vennero ridotti per consentire lo sviluppo di centrali idroelettriche, riducendo drasticamente la
      portata dei salti originari. Il flusso visibile oggi è quello di un corso d’acqua regimato.


      Il piano di gestione della Lapponia definisce norme vincolanti per Stora Sjöfallet. All’interno del
      parco è severamente vietato spezzare rami o abbattere alberi vivi o morti per accendere fuochi.
    before: >-
      Verifica gli orari del Naturum e le condizioni meteorologiche prima di partire. I tracciati accessibili
      sono limitati ai dintorni del centro visite e a Sjöfallsudden; tutti gli altri percorsi affrontano
      terreni alpini impervi. I cani al guinzaglio sono ammessi in tutto il parco da gennaio ad aprile; nei
      restanti mesi valgono aree delimitate consentite.
    around: >-
      Stora Sjöfallet confina direttamente con celebri riserve alpine: il [Parco Nazionale di
      Padjelanta](/lugar/padjelanta-national-park/) dista 1 km e il [Parco Nazionale di
      Sarek](/lugar/sarek-national-park/) 2 km. Più distanti, altre aree condividono renne e aquile reali,
      come il [Parco Nazionale Urho Kekkonen](/lugar/urho-kekkonen-national-park/), che ospita anche l’alce
      tra foreste primarie e altipiani; il [Parco Nazionale di
      Jotunheimen](/lugar/jotunheimen-national-park/), dominato da vette e ghiacciai; il [Parco Nazionale di
      Lemmenjoki](/lugar/lemmenjoki-national-park/), tra taiga incontaminata e rilievi montani; e il [Parco
      Nazionale di Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), ricco di ghiacciai e
      paesaggi boreali.
  pt:
    intro: >-
      Cinco grandes quedas de água precipitavam-se outrora pela faixa do mårka em direção ao lago Láŋas,
      motivando em 1909 a criação do Parque Nacional de Stora Sjöfallet, ou Stuor Muorkke. Embora o caudal se
      encontre hoje muito reduzido pelas barragens hidroelétricas, o parque perdura em Norrbotten, na Lapónia
      sueca, integrado no Património Mundial da Lapónia. Estende-se por ambas as margens da albufeira de
      Áhkkájávrre, combinando cordilheiras escarpadas, vales glaciares profundos, planaltos rochosos, cumes e
      glaciares. Uma estrada atravessa o parque, aproximando os visitantes de vários setores.
    landscape: >-
      A geografia local lê-se quase como um mapa físico. A norte, Dievssávágge marca a fronteira; a sul
      ergue-se o maciço de Áhkká e os seus glaciares, dominando o setor ocidental do parque. A albufeira de
      Akkajaure cinde a área protegida entre os municípios de Gällivare e Jokkmokk. A oeste o parque confina
      com Sarek e a leste com a grande reserva de Sjaunja.


      Praticamente tudo o que se observa foi esculpido pelo gelo. Bietsávrre repousa num vale em U cavado pelo
      glaciar continental, onde as águas de degelo espalharam extensos sandurs de areia e cascalho. O
      desfiladeiro de Áhusjgårsså rasgou-se durante o degelo repentino. Os socalcos de Áhkká são antigos
      deltas de lagos glaciares que ficaram a seco com a retirada das calotas. Dos cumes de Giergav
      vislumbram-se as serranias de Sarek e do maciço de Kebnekaise.


      Subir as encostas do parque equivale a percorrer diferentes andares de vegetação árctica. Junto à
      estrada de entrada surge um pinhal primitivo, salpicado de árvores seculares e troncos secos prateados.
      Mais acima sucedem-se os bosquetes de bétula-anã, as charnecas alpinas e os cumes coroados de neves
      perpétuas. O manto de neve comanda a vegetação: nas cristas expostas ao vento medram krypljung e
      fjällgröna, enquanto nos covões navais brotam dvärgvide e mossljung. A angélica-selvagem é comum em
      Teusadalen e nas encostas viradas a sul de Áhkkájávvre, tendo o povo sami usado o skvattram como
      repelente natural de mosquitos.
    wildlife: >-
      Entre os grandes mamíferos assinalados no parque contam-se o [alce](/especie/alces_alces/), o
      [glutão](/especie/gulo_gulo/), o [urso-pardo](/especie/ursus_arctos/) e o
      [lince-euroasiático](/especie/lynx_lynx/). Observá-los exige sorte e discrição, sendo o alce a espécie
      mais frequente. No desfiladeiro de Áhusjgårsså podem procurar-se pegadas de lince no cascalho. Entre as
      aves características encontram-se a escrevedeira-das-neves, a escrevedeira-lapónica, o chasco-cinzento,
      a [tarambola-dourada-europeia](/especie/pluvialis_apricaria/) e o
      [lagópode-branco](/especie/lagopus_muta/); a águia-calçada e os lagópodes surgem habitualmente no
      percurso de Ippátjåhkkå.


      O calendário ecológico é pautado pela neve. A fusão desigual cria marcados contrastes entre lombas
      desnudadas e depressões geladas mesmo no pico do verão, permitindo observar plantas em estados
      fenológicos distintos numa só caminhada.


      O parque constitui um território vivo de trabalho tradicional. As comunidades samis de Sirges e Unna
      tjerusj mantêm acampamentos e pastagens de renas no seu interior, conduzindo os rebanhos aos vales de
      montanha durante o verão. A [rena](/especie/rangifer_tarandus/) é uma peça vital da economia e
      continuidade cultural deste espaço.
    visit: >-
      Gällivare e Jokkmokk funcionam como pontos de partida principais; a partir de qualquer uma destas
      localidades prossegue-se de autocarro ou de carro pela estrada 827, a Rota para o Oeste, rumo a Ritsem.
      Esta via atravessa o parque e liga vários estacionamentos ao Naturum Laponia. Se viajares de autocarro,
      certifica-te dos horários de ida e volta.


      O Naturum Laponia fica em Viedásnjárgga, junto ao lago Láŋas. As suas exposições explicam as montanhas,
      as florestas, as turfeiras, as estações do ano e o papel central da rena na cultura sami; há programas
      para crianças, palestras sobre saberes ecológicos tradicionais e aluguer de binóculos. Os espaços e
      sanitários estão adaptados para pessoas com mobilidade reduzida, existindo no exterior um passadiço de
      madeira e saibro.


      Para caminhar, o trilho de Ippátjåhkkå acompanha uma rota ancestral de transumância de renas. Saindo do
      pinhal antigo e cruzando o bosque de bétulas até à tundra aberta, estende-se por cerca de dois
      quilómetros, sendo ótimo para meio dia. O Världsarvsstigen percorre cerca de um quilómetro com painéis
      sobre a mata primordial e a presença humana. Por fim, Sjöfallsudden faculta um passeio de até duas horas
      num caminho plano apto para carrinhos de bebé e cadeiras de rodas.
    history: >-
      O parque foi criado em 1909 com vista a salvaguardar a magnífica cascata. A partir de 1919, contudo, os
      seus limites foram reduzidos para viabilizar empreendimentos hidroelétricos, o que enfraqueceu
      drasticamente a catarata original. O caudal observado hoje decorre do regime artificial da albufeira.


      O plano de ordenamento da Lapónia estabelece diretrizes estritas para Stora Sjöfallet. É totalmente
      proibido cortar ramos ou abater árvores vivas ou secas para fogueiras.
    before: >-
      Confirma o horário do Naturum e o estado das pistas antes de iniciar a marcha. Os percursos acessíveis
      restringem-se às imediações do centro e a Sjöfallsudden; o restante território exige calçado de
      montanha. Cães com trela são aceites entre janeiro e abril em todo o parque; no resto do ano vigoram
      áreas restritas.
    around: >-
      Stora Sjöfallet quase confina com grandes áreas protegidas vizinhas: o [Parque Nacional de
      Padjelanta](/lugar/padjelanta-national-park/) dista 1 km e o [Parque Nacional de
      Sarek](/lugar/sarek-national-park/) escassos 2 km. Mais distantes, outros territórios partilham a
      presença da rena e da águia-real, tais como o [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/), que também acolhe alces em florestas primárias; o
      [Parque Nacional de Jotunheimen](/lugar/jotunheimen-national-park/), com agulhas alpinas e glaciares; o
      [Parque Nacional de Lemmenjoki](/lugar/lemmenjoki-national-park/), com taiga virgem; e o [Parque
      Nacional de Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), igualmente marcado por
      maciços e glaciares.
