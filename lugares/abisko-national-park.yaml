resumen:
  es: >-
    El gran cañón del río Abiskojåkka desembocando en el lago Torneträsk y la famosa formación de 'Lapporten'
    (La Puerta de Laponia).
  en: >-
    The grand canyon of the Abiskojåkka emptying into Lake Torneträsk and the iconic mountain pass of
    Lapporten (The Gate of Lapland).
  fr: >-
    Le grand canyon de la rivière Abiskojåkka se jetant dans le lac Torneträsk et la célèbre brèche de
    Lapporten (La Porte de Laponie).
  de: >-
    Der imposante Canyon des Flusses Abiskojåkka bei seiner Mündung in den See Torneträsk und das berühmte
    Bergtor Lapporten.
  it: >-
    Il grandioso canyon dell’Abiskojåkka che sfocia nel lago Torneträsk e l’iconica sella montana di Lapporten
    (La Porta della Lapponia).
  pt: >-
    O grande desfiladeiro do rio Abiskojåkka desaguando no lago Torneträsk e a icónica formação de Lapporten
    (A Porta da Lapónia).
unico:
  es: >-
    Aquí, a la sombra de lluvia de la cordillera, vive la única población sueca de la orquídea protegida
    lappfela.
  en: >-
    Here, in the mountain rain shadow, thrives Sweden’s only population of the protected mountain slipper
    orchid (lappfela).
  fr: >-
    Ici, à l’abri des pluies derrière la cordillère, s’épanouit l’unique colonie suédoise de l’orchidée
    protégée lappfela.
  de: >-
    Hier, im Regenschatten des Skandengebirges, wächst Schwedens einziges Vorkommen der seltenen
    Berg-Frauenschuhorchidee lappfela.
  it: >-
    Qui, all’ombra pluviometrica della catena montuosa, vive l’unica popolazione svedese della rara orchidea
    alpina lappfela.
  pt: >-
    Aqui, à sombra de chuva da cordilheira, vive a única população sueca da orquídea alpina protegida
    lappfela.
observaciones:
  es: >-
    El delta del Abiskojåkka está cerrado a las visitas del 1 de mayo al 31 de julio para proteger a las aves.
    Está prohibido acampar fuera de las zonas señaladas, arrancar plantas o dañar el suelo, y molestar a los
    renos que pastan o el trabajo de los pastores. Los grupos de más de 35 personas, por ejemplo en visitas
    guiadas, pueden necesitar permiso de la Administración de Norrbotten.


    Entre principios de mayo y principios de junio, y en octubre, hay menos actividades y varias instalaciones
    cierran para que la naturaleza descanse. La carretera E10 y la línea ferroviaria atraviesan el parque.
texto:
  es:
    intro: >-
      En Abisko casi nunca llueve. Es el lugar con menos precipitación de toda Suecia, unos 300 mm al año, y
      de los más soleados, porque las montañas del oeste se quedan con la humedad que llega del Atlántico y al
      valle apenas le llega lo que sobra. De ese cielo limpio vive un valle de abedulares que se abre entre
      grandes macizos, con el lago Torneträsk al fondo y el río Abiskojåkka bajando entre ambos por un cañón.


      Es uno de los nueve primeros parques de Suecia, los primeros de Europa, creado en 1909. Ocupa 7.700
      hectáreas en las que caben bosque de abedul, brezales abiertos, praderas y monte pelado, y es el
      arranque del Kungsleden.
    landscape: >-
      Para entender Abisko hay que mirar las paredes del cañón del Abiskojåkka: muestran, como un corte de
      pastel, cómo está hecha toda la montaña. Esas rocas se alzaron del antiguo océano Atlántico y se
      desplazaron hacia el este como grandes láminas cuando se formó la cordillera, hace 400 millones de años.
      El resultado es un lecho rocoso rico en cal, y la cal explica la flora: muchas especies raras que en
      otros puntos de la cordillera no aparecen.


      El abedular de montaña cubre 3.900 de las 7.700 hectáreas y llega hasta los 650 metros en las laderas
      norte y hacia los 800 en las del sur; por encima empieza el monte pelado, que ocupa 2.800 hectáreas. En
      medio de los abedules, donde el Kårsajåkka desemboca en el Abiskojåkka, queda un pinar viejo que no
      debería estar tan alto ni tan al norte: es un resto de una época más cálida, cuando el pino era más
      común.


      El clima también cuenta una historia. En las últimas décadas Abisko se ha calentado: el permafrost cede
      en las zonas bajas y el límite del abedul de montaña ha subido unos 50 metros. Y en los años cincuenta
      las orugas de la polilla otoñal de montaña dejaron sin hojas buena parte del abedular, que sigue ralo,
      con muchos árboles muertos.
    wildlife: >-
      Este es un parque de plantas. Junto al borde del cañón se extienden brezales de lapsk alpros, y en las
      paredes crecen polarblära, fjällarnika y tuvbräcka. La montaña Njullá recibe el nombre de «montaña de
      las flores» por la abundancia de plantas que florecen, y en verano, cuando las flores y las aves están
      en su mejor momento, es cuando más merece la pena subir.


      De las aves se ocupan el abedular y la tundra. Entre los abedules se mezclan pardillos, pinzones reales
      y [pechiazules](/especie/luscinia_svecica/) con acentores, currucas y petirrojos; sobre el monte pelado
      se pueden encontrar escribano nival, [lagópodo alpino](/especie/lagopus_muta/) y chorlito carambolo. La
      rapaz más común es el halcón esmerejón, y el [águila real](/especie/aquila_chrysaetos/) aparece en menor
      medida. Los grandes mamíferos escasean: [zorro ártico](/especie/vulpes_lagopus/),
      [glotón](/especie/gulo_gulo/) y [lince](/especie/lynx_lynx/) pasan solo de vez en cuando, mientras que
      el [alce](/especie/alces_alces/) es mucho más común y sus huellas se ven por todas partes.


      El año tiene tres caras. En verano hay sol de medianoche durante algo más de ocho semanas en torno al
      solsticio, y a comienzos de verano los arroyos pueden llevar mucha agua. A principios de otoño el
      abedular arde en colores, ya no hay mosquitos y el aire es fresco. En invierno llega la oscuridad de
      mediodía, unas cuatro semanas, y con ella las auroras: la falta de contaminación lumínica y el tiempo a
      menudo despejado hacen de Abisko un destino popular para verlas. Hacia diciembre el hielo del Torneträsk
      permite patinar, y a finales del invierno se recorre el parque con raquetas o esquís.
    visit: >-
      La mayoría llega en tren. La estación se llama Abisko Turist, está dentro del parque, y desde ella hay
      unos 800 metros hasta el naturum y la estación de montaña de la STF. El parque está a unos 100
      kilómetros al oeste de Kiruna, en el norte de Suecia.


      El naturum explica con una exposición permanente las plantas, la fauna, la geología y la historia del
      parque. Su personal informa también sobre Vadvetjåkka y en verano ofrece visitas guiadas y otras
      actividades. Alrededor del naturum hay nueve puntos de descubrimiento.


      Para una primera salida, el cañón de Abiskoeatnu es una garganta espectacular y de fácil acceso junto al
      naturum, y fue una de las razones para crear el parque. Hay un sendero a la orilla del Torneträsk de
      unos 1,2 kilómetros por trayecto en el que se ven lavandera boyera y pechiazul. Y si quieres caminar
      más, el Kungsleden, de 440 km, sigue la cordillera escandinava y arranca junto a la estación turística
      de Abisko. Hay senderos adaptados, como el que lleva al cañón y al símbolo del parque, con zona de
      descanso.
    history: >-
      La STF ya había abierto una estación turística en Abisko en 1902, junto a la línea del mineral. La
      estación científica se levantó en su sitio actual en 1912 tras un incendio en 1910 y abrió en 1913.
    before: >-
      El delta del Abiskojåkka está cerrado a las visitas del 1 de mayo al 31 de julio para proteger a las
      aves. Está prohibido acampar fuera de las zonas señaladas, arrancar plantas o dañar el suelo, y molestar
      a los renos que pastan o el trabajo de los pastores. Los grupos de más de 35 personas, por ejemplo en
      visitas guiadas, pueden necesitar permiso de la Administración de Norrbotten.


      Entre principios de mayo y principios de junio, y en octubre, hay menos actividades y varias
      instalaciones cierran para que la naturaleza descanse. La carretera E10 y la línea ferroviaria
      atraviesan el parque.
    around: >-
      Abisko tiene parientes lejanos que comparten especies y hábitats. [Sarek](/lugar/sarek-national-park/)
      reúne zorro ártico, glotón y alce, con montaña alta y cañones.
      [Børgefjell](/lugar/borgefjell-national-park/) comparte zorro ártico y glotón, con montaña alta, lagos y
      bosque maduro. La [Reserva de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) también tiene zorro
      ártico y glotón, con montaña alta y bosque maduro, y [Femundsmarka](/lugar/femundsmarka-nasjonalpark/)
      suma glotón y alce, con lagos y bosque maduro.
  en:
    intro: >-
      In Abisko it hardly ever rains. It is the place with the lowest precipitation in all of Sweden, about
      300 mm a year, and one of the sunniest, because the western peaks intercept Atlantic moisture, leaving
      little more than scraps for the valley. Beneath this bright sky lies a mountain birch valley flanked by
      soaring massifs, with Lake Torneträsk in the background and the Abiskojåkka rushing through a canyon
      between them.


      It is one of Sweden's nine original national parks, the earliest established in Europe, created in 1909.
      It spans 7,700 hectares encompassing birch forest, open heathland, lush meadows, and bare alpine fell,
      serving as the official northern gateway to the Kungsleden.
    landscape: >-
      To understand Abisko, look at the vertical walls of the Abiskojåkka canyon: like a slice of cake, they
      reveal the geological anatomy of the entire mountain. These rocks were uplifted from the ancient lapetus
      Ocean and thrust eastward as vast thrust sheets when the Caledonian range formed 400 million years ago.
      The resulting bedrock is exceptionally rich in lime, which explains the unique alpine flora: numerous
      rare species that grow nowhere else along the chain.


      Subalpine birch woodland covers 3,900 of the 7,700 hectares, climbing to 650 metres on northern slopes
      and up to 800 on southern aspects; above lies the bare alpine tundra, covering 2,800 hectares. Amidst
      the birch stands where the Kårsajåkka joins the Abiskojåkka remains an ancient pine stand that should
      biologically not exist so high or so far north: a living relic of a warmer postglacial epoch when Scots
      pine was far more widespread.


      The climate also chronicles recent change. Over recent decades Abisko has warmed noticeably: lowland
      permafrost is thawing and the birch tree line has advanced roughly 50 metres uphill. In the fifties,
      severe caterpillar outbreaks of the autumnal moth stripped birch foliage across vast areas, leaving
      stands sparse and littered with standing deadwood.
    wildlife: >-
      This is a botanist's dream. Along the rim of the canyon sprawl dwarf rhododendron heaths (lapsk alpros),
      while rocky ledges shelter *polarblära*, *fjällarnika*, and tufted saxifrage. Mount Njullá is celebrated
      as the "flower mountain" for its astonishing variety of blooms; midsummer, when alpine wildflowers and
      subarctic birds peak together, is the ideal time to ascend.


      Birds animate the birch woods and windswept tundra. Among the birches, common redpolls, bramblings, and
      [bluethroats](/especie/luscinia_svecica/) mingle with dunnocks, willow warblers, and European robins; on
      the stony alpine fell you may spot snow buntings, [rock ptarmigans](/especie/lagopus_muta/), and
      Eurasian dotterels. The most common raptor is the merlin, with the [golden
      eagle](/especie/aquila_chrysaetos/) patrolling higher crags. Large carnivores are scarce: [Arctic
      fox](/especie/vulpes_lagopus/), [wolverine](/especie/gulo_gulo/), and [Eurasian
      lynx](/especie/lynx_lynx/) roam through only occasionally, whereas [moose](/especie/alces_alces/) are
      widespread and their tracks everywhere.


      The year shows three distinct faces. Midsummer brings midnight sun for over eight weeks around the
      solstice, with swollen meltwater streams early in the season. Early autumn turns the birch forest into
      fiery gold with crisp air and no mosquitoes. Winter brings midday twilight for four weeks alongside
      optimal northern lights: lack of light pollution and frequent clear skies make Abisko a premier global
      aurora destination. By December, black ice on Torneträsk invites Nordic skaters, followed by winter
      snowshoeing and ski touring.
    visit: >-
      Most visitors arrive by rail. The station, named Abisko Turist, lies inside the park, about 800 metres
      from the naturum visitor centre and the STF mountain station. The park is situated roughly 100
      kilometres west of Kiruna in northern Sweden.


      The naturum features permanent exhibitions on local flora, fauna, geology, and cultural history. Staff
      provide information on nearby Vadvetjåkka and lead guided walks in summer. Around the naturum are nine
      discovery points.


      For a first excursion, the Abiskojåkka canyon is a spectacular, easily accessible gorge right beside the
      naturum that served as a founding reason for the park. A trail along the shores of Torneträsk runs about
      1.2 kilometres each way, where you can watch yellow wagtails and bluethroats. For longer journeys, the
      440 km Kungsleden trails southward along the Scandinavian mountains, starting right by the tourist
      station. Accessible paths lead to canyon overlooks and park landmarks with rest areas.
    history: >-
      The STF opened its first tourist station in Abisko in 1902 alongside the Iron Ore Railway line. The
      scientific research station was rebuilt at its present site in 1912 after a fire in 1910 and opened in
      1913.
    before: >-
      The Abiskojåkka river delta is closed to public access from 1 May to 31 July to protect ground-nesting
      birds. Pitching tents outside designated camping grounds, uprooting plants, disturbing the soil, and
      disrupting grazing reindeer or herding activities are strictly prohibited. Organized groups of more than
      35 participants may require prior authorization from the County Administrative Board of Norrbotten.


      Between early May and early June, and during October, tourist services pause and several facilities
      close to allow nature to rest. The E10 road and the railway line run through the park.
    around: >-
      Abisko shares species and habitats with distant arctic parks. [Sarek](/lugar/sarek-national-park/)
      gathers Arctic fox, wolverine, and moose amidst high peaks and canyons.
      [Børgefjell](/lugar/borgefjell-national-park/) shares Arctic fox and wolverine with high alpine
      wilderness, tarns, and old-growth taiga. The [Vindelfjällen Nature
      Reserve](/lugar/vindelfjallens-naturreservat/) also shelters Arctic fox and wolverine with alpine
      plateaus and mature forests, while [Femundsmarka](/lugar/femundsmarka-nasjonalpark/) combines wolverine
      and moose with wilderness lakes and ancient pines.
  fr:
    intro: >-
      À Abisko, il ne pleut presque jamais. C'est le lieu le plus sec de toute la Suède, avec environ 300 mm
      par an, et l'un des plus ensoleillés, car les massifs occidentaux retiennent l'humidité atlantique, ne
      laissant au fond de la vallée que des miettes. Sous ce ciel pur s'ouvre une vallée de bouleaux tortueux
      entre de hauts reliefs, avec le lac Torneträsk à l'horizon et la rivière Abiskojåkka franchissant un
      canyon spectaculaire.


      C'est l'un des neuf parcs fondateurs de Suède et d'Europe, créé en 1909. Il couvre 7 700 hectares
      englobant bétulaies, landes ouvertes, prairies fleuries et fells dénudés, marquant le départ du mythique
      Kungsleden.
    landscape: >-
      Pour comprendre Abisko, il faut observer les parois du canyon de l'Abiskojåkka : elles révèlent, telle
      une tranche géologique, l'anatomie de toute la montagne. Ces roches se sont soulevées de l'ancien océan
      Iapetus et ont glissé vers l'est sous forme de nappes de charriage lors de la formation de la chaîne
      calédonienne il y a 400 millions d'années. Le substrat calcaire qui en résulte explique l'exceptionnelle
      flore : de nombreuses espèces rares absentes du reste de la cordillère s'y épanouissent.


      La bétulaie montagnarde couvre 3 900 des 7 700 hectares, montant jusqu'à 650 mètres sur les versants
      nord et 800 sur les versants sud ; au-delà débute la toundra de fell, qui occupe 2 800 hectares. Au cœur
      des bouleaux, là où la Kårsajåkka rejoint l'Abiskojåkka, subsiste une pinède ancestrale qui ne devrait
      pas pousser si haut ni si au nord : vestige d'une période postglaciaire plus douce où le pin sylvestre
      dominait.


      Le climat témoigne aussi du réchauffement. Ces dernières décennies, le pergélisol de plaine recule et la
      limite des bouleaux est montée d'environ 50 mètres. Dans les années cinquante, les chenilles de la
      géomètre automnale ont défolié une large part de la bétulaie, qui demeure clairsemée avec de nombreux
      troncs morts sur pied.
    wildlife: >-
      C'est un sanctuaire botanique réputé. Sur le rebord du canyon s'étendent des landes de rhododendrons
      lapons, tandis que les parois abritent silène boréale, arnica des montagnes et saxifrage cespiteuse. Le
      mont Njullá est surnommé la « montagne aux fleurs » en raison de son exubérance végétale ; le plein été,
      lorsque fleurs et oiseaux battent leur plein, est le meilleur moment pour gravir ses pentes.


      Les oiseaux animent les boisements et la lande d'altitude. Parmi les bouleaux se mêlent sizerins
      flammés, pinsons du Nord et [gorgesbleues à miroir](/especie/luscinia_svecica/) avec accenteurs
      mouchets, fauvettes et rougegorges ; sur les fells dénudés nichent le plectrophane des neiges, le
      [lagopède alpin](/especie/lagopus_muta/) et le pluvier guignard. Le faucon émerillon est le rapace le
      plus familier, accompagné par l'[aigle royal](/especie/aquila_chrysaetos/). Les grands prédateurs sont
      discrets : [renard polaire](/especie/vulpes_lagopus/), [glouton](/especie/gulo_gulo/) et [lynx
      boréal](/especie/lynx_lynx/) ne font que passer, alors que l'[élan](/especie/alces_alces/) est très
      abondant et laisse des pistes visibles partout.


      L'année offre trois visages. En été, le soleil de minuit brille durant un peu plus de huit semaines
      autour du solstice, avec des torrents impétueux au début de la saison. Au début de l'automne, la
      bétulaie s'embrase de couleurs vives sans aucun moustique. L'hiver apporte quatre semaines d'obscurité
      crépusculaire propices aux aurores boréales : l'absence de pollution lumineuse et la clarté du ciel font
      d'Abisko un site mondial d'observation privilégié. Vers décembre, la glace vive du Torneträsk permet le
      patinage nordique avant le ski et les raquettes.
    visit: >-
      La majorité des visiteurs arrivent par le train. La gare d'Abisko Turist se trouve au cœur du parc, à
      environ 800 mètres du naturum et de la station de montagne de la STF. Le parc se situe à environ 100
      kilomètres à l'ouest de Kiruna, tout au nord de la Suède.


      Le naturum propose une exposition permanente sur la flore, la faune, la géologie et l'histoire locale.
      Ses animateurs informent sur le parc voisin de Vadvetjåkka et proposent des visites guidées en été.
      Autour du centre rayonnent neuf points de découverte.


      Pour une première sortie, le canyon de l'Abiskoeatnu est une gorge impressionnante et facile d'accès à
      côté du naturum, qui motiva la création originelle du parc. Un sentier longeant le Torneträsk court sur
      1,2 kilomètres par trajet et permet d'observer bergeronnettes printanières et gorgesbleues. Pour marcher
      plus loin, le Kungsleden s'étire sur 440 km le long de la chaîne scandinave au départ de la station
      touristique. Des tronçons aménagés mènent au canyon avec aires de repos.
    history: >-
      La STF avait ouvert une station touristique à Abisko dès 1902, le long de la ligne ferroviaire du
      minerai de fer. La station de recherche scientifique fut réédifiée sur son site actuel en 1912 après un
      incendie en 1910 et inaugurée en 1913.
    before: >-
      Le delta de l'Abiskojåkka est fermé à toute visite du 1 mai au 31 juillet pour protéger la nidification
      des oiseaux. Bivouaquer hors des aires prévues, cueillir des plantes et déranger les rennes au pâturage
      ou le travail des éleveurs est rigoureusement interdit. Les groupes de plus de 35 personnes peuvent
      nécessiter une autorisation préalable de la préfecture de Norrbotten.


      Entre début mai et début juin, ainsi qu'en octobre, plusieurs services ferment pour laisser respirer la
      nature. La route E10 et la voie ferrée traversent le parc.
    around: >-
      Abisko partage des affinités avec de grands parcs arctiques. [Sarek](/lugar/sarek-national-park/) réunit
      renard polaire, glouton et élan parmi de hauts massifs et des vallées profondes.
      [Børgefjell](/lugar/borgefjell-national-park/) abrite renard polaire et glouton entre hauts plateaux et
      vieilles forêts. La [Réserve naturelle de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) protège
      également renard polaire et glouton, tandis que [Femundsmarka](/lugar/femundsmarka-nasjonalpark/)
      associe glouton et élan autour de lacs sauvages et de pinèdes millénaires.
  de:
    intro: >-
      In Abisko regnet es fast nie. Es ist mit rund 300 mm Jahresniederschlag der trockenste Ort ganz
      Schwedens und einer der sonnigsten, weil die westlichen Gipfel die atlantischen Wolken abfangen und dem
      Tal kaum Feuchtigkeit überlassen. Unter diesem klaren Himmel öffnet sich ein Fjällbirken-Tal zwischen
      hohen Massiven, mit dem See Torneträsk im Hintergrund und dem Fluss Abiskojåkka, der durch einen Canyon
      herabstürzt.


      Abisko gehört zu den ersten neun Nationalparks Schwedens und ganz Europas, gegründet 1909. Er umfasst
      7.700 Hektar mit Birkenwald, Heiden, alpinen Wiesen und kargem Kahlfjäll und ist der Startpunkt des
      Fernwanderwegs Kungsleden.
    landscape: >-
      Um Abisko zu verstehen, muss man die Wände des Abiskojåkka-Canyons betrachten: Sie zeigen wie ein
      geologischer Kuchenanschnitt den Aufbau der gesamten Skanden. Diese Gesteine wurden vor 400 Millionen
      Jahren beim Entstehen des Gebirges aus dem Iapetus-Ozean emporgehoben und als mächtige Decken nach Osten
      geschoben. Das kalkreiche Festgestein erklärt den botanischen Reichtum: Viele seltene Arten wachsen in
      Schweden nur an diesem Standort.


      Der Fjällbirkenwald bedeckt 3.900 der 7.700 Hektar und reicht an Nordhängen bis 650 Meter, an Südhängen
      bis etwa 800 Meter hinauf; darüber beginnt das baumlose Kahlfjäll, das 2.800 Hektar einnimmt. Mitten im
      Birkenwald, an der Mündung des Kårsajåkka in den Abiskojåkka, hat ein alter Kiefernbestand überdauert,
      der so weit im Norden nicht existieren dürfte: ein Relikt wärmerer nacheiszeitlicher Epochen.


      Auch der Klimawandel hinterlässt Spuren. In den vergangenen Jahrzehnten hat sich Abisko spürbar erwärmt:
      Der Tal-Permafrost taut auf und die Birkenwaldgrenze ist um rund 50 Meter emporgewandert. In den
      fünfziger Jahren vernichteten Massenvermehrungen des Herbstspanners weite Teile des Birkenwalds, der bis
      heute lückenhaft geblieben ist.
    wildlife: >-
      Abisko ist ein Paradies für Pflanzenfreunde. An den Canyonkanten breiten sich Bestände des
      Lappland-Alpenrosengebüschs aus, an den Felswänden gedeihen Polar-Leimkraut, Berg-Arnika und
      Polster-Steinbrech. Der Berg Njullá trägt wegen seiner Blütenfülle den Beinamen „Blumenberg“; im
      Hochsommer, wenn Flora und arktische Vögel ihren Höhepunkt erreichen, lohnt sich der Aufstieg besonders.


      Die Vogelwelt bevölkert Birkenwälder und Tundra. Zwischen den Birken mischen sich Birkenzeisige,
      Bergfinken und [Blaukehlchen](/especie/luscinia_svecica/) mit Heckenbraunellen, Laubsängern und
      Rotkehlchen; auf dem Kahlfjäll brüten Schneeammer, [Alpenschneehuhn](/especie/lagopus_muta/) und
      Mornellregenpfeifer. Häufigster Greifvogel ist der Merlin, seltener kreist der
      [Steinadler](/especie/aquila_chrysaetos/). Große Raubtiere sind scheu:
      [Polarfuchs](/especie/vulpes_lagopus/), [Vielfraß](/especie/gulo_gulo/) und [Eurasischer
      Luchs](/especie/lynx_lynx/) streifen nur gelegentlich durchs Schutzgebiet, während der
      [Elch](/especie/alces_alces/) allgegenwärtig ist.


      Das Jahr zeigt drei ausgeprägte Gesichter. Im Sommer scheint die Mitternachtssonne über acht Wochen rund
      um die Sonnenwende, während Schneeschmelzbäche zu Saisonbeginn tosen. Der Frühherbst lässt die
      Birkenwälder feurig leuchten – mückenfrei und bei klarer Luft. Im Winter herrscht vier Wochen lang
      Mittagsdämmerung mit spektakulären Polarlichtern: Dank fehlender Lichtverschmutzung ist Abisko weltweit
      eines der besten Auroraziele. Ab Dezember lockt das Schwarzeis des Torneträsk Schlittschuhläufer,
      gefolgt von Skitouren und Schneeschuhwanderungen.
    visit: >-
      Die meisten Besucher reisen mit der Bahn an. Die Station Abisko Turist liegt direkt im Park, rund 800
      Meter vom Naturum-Besucherzentrum und der STF-Bergstation entfernt. Der Park liegt etwa 100 Kilometer
      westlich von Kiruna im Norden Schwedens.


      Das Naturum präsentiert Ausstellungen zu Flora, Fauna, Geologie und Kulturgeschichte des Parks. Die
      Ranger informieren auch über den nahen Vadvetjåkka und bieten Sommerführungen an. Rund um das Zentrum
      liegen neun Entdeckerpunkte.


      Als erste Wanderung bietet sich der Canyon des Abiskoeatnu an: eine eindrucksvolle, leicht erreichbare
      Schlucht direkt am Naturum, die ausschlaggebend für die Parkgründung war. Ein Uferpfad am Torneträsk
      führt über 1,2 Kilometer je Richtung durch Brutgebiete von Schafstelze und Blaukehlchen. Wer weit
      wandern will, wählt den 440 km langen Kungsleden, der an der Touristenstation beginnt. Barrierefreie
      Wege führen zur Schlucht und Aussichtspunkten.
    history: >-
      Die STF eröffnete bereits 1902 eine Touristenstation an der Erzbahnlinie in Abisko. Die
      wissenschaftliche Station wurde 1912 nach einem Brand im Jahr 1910 am heutigen Standort neu errichtet
      und 1913 eingeweiht.
    before: >-
      Das Flussdelta des Abiskojåkka ist vom 1. Mai bis 31. Juli zum Schutz nistender Vögel für Besucher
      gesperrt. Zelten außerhalb der ausgewiesenen Plätze, das Ausgraben von Pflanzen und die Störung
      weidender Rentiere sind streng verboten. Gruppen von mehr als 35 Personen benötigen eine vorherige
      Genehmigung der Provinzialverwaltung Norrbotten.


      Zwischen Anfang Mai und Anfang Juni sowie im Oktober ruhen viele Einrichtungen, damit die Natur sich
      erholen kann. Die Europastraße E10 und die Erzbahnlinie queren den Park.
    around: >-
      Abisko teilt Lebensräume mit anderen nordischen Nationalparks. Im [Nationalpark
      Sarek](/lugar/sarek-national-park/) leben Polarfuchs, Vielfraß und Elch in unberührter
      Hochgebirgslandschaft. Der [Nationalpark Børgefjell](/lugar/borgefjell-national-park/) teilt Polarfuchs
      und Vielfraß mit Seen und alten Wäldern. Das [Naturreservat
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) birgt ebenfalls Polarfuchs und Vielfraß, während
      der [Nationalpark Femundsmarka](/lugar/femundsmarka-nasjonalpark/) Vielfraß und Elch in alten
      Kiefernwäldern schützt.
  it:
    intro: >-
      Ad Abisko non piove quasi mai. È il luogo con le minori precipitazioni di tutta la Svezia, circa 300 mm
      all'anno, e uno dei più soleggiati, poiché le vette occidentali trattengono l'umidità atlantica
      lasciando al fondovalle solo le briciole. Sotto questo cielo limpido si apre una valle di betulle
      montane incastonata tra massicci, con il lago Torneträsk sullo sfondo e il fiume Abiskojåkka che
      precipita in una forra spettacolare.


      È uno dei primi nove parchi nazionali della Svezia e d'Europa, istituito nel 1909. Copre 7.700 ettari
      tra foreste di betulla, brughiere aperte, prati fioriti e tundra d'alta quota, costituendo l'accesso
      settentrionale al leggendario cammino Kungsleden.
    landscape: >-
      Per capire Abisko bisogna osservare le pareti del canyon dell'Abiskojåkka: mostrano, come una fetta di
      torta geologica, la struttura dell'intera montagna. Queste rocce si sollevarono dall'antico oceano
      Iapeto e scivolarono verso est come grandi falde di ricoprimento quando si formò la catena caledoniana
      400 milioni di anni fa. Ne deriva un basamento calcareo ricchissimo che spiega la straordinaria flora:
      numerose specie rare assenti in altri settori delle Alpi Scandinave.


      La foresta di betulla montana copre 3.900 dei 7.700 ettari e sale fino a 650 metri sui versanti nord e
      verso gli 800 su quelli sud; più in alto comincia la tundra rocciosa, che occupa 2.800 ettari. Nel cuore
      delle betulle, alla confluenza del Kårsajåkka nell'Abiskojåkka, sopravvive una pineta secolare che non
      dovrebbe trovarsi a quote e latitudini così elevate: un relitto di epoche postglaciali calde in cui il
      pino silvestre dominava.


      Anche il clima racconta un mutamento rapido. Negli ultimi decenni Abisko si è riscaldata: il permafrost
      di fondovalle si scioglie e il limite superiore delle betulle è salito di circa 50 metri. Negli anni
      Cinquanta le brucate di massa della falena autunnale spogliarono gran parte della foresta, rimasta rada
      e costellata di tronchi secchi.
    wildlife: >-
      Questo è un parco celebre per la botanica. Lungo il bordo del canyon si estendono brughiere a rododendro
      lappone, mentre sulle rocce fioriscono silene artica, arnica montana e sassifraga cespitosa. Il monte
      Njullá è noto come la «montagna dei fiori» per la straordinaria ricchezza botanica; in piena estate,
      quando fioriture e avifauna toccano l'apice, la salita è memorabile.


      Gli uccelli popolano boschi e tundra. Tra le betulle cantano organetti, peppole e
      [pettazzurri](/especie/luscinia_svecica/) assieme a passere scopaiole, luì e pettirossi; sul fell
      roccioso nidificano lo zigolo delle nevi, la [pernice bianca](/especie/lagopus_muta/) e il piviere
      tortolino. Il rapace più comune è lo smeriglio, mentre l'[aquila reale](/especie/aquila_chrysaetos/)
      sorvola le creste. I grandi carnivori sono rari: [volpe artica](/especie/vulpes_lagopus/),
      [ghiottone](/especie/gulo_gulo/) e [lince boreale](/especie/lynx_lynx/) compaiono solo di passaggio,
      mentre l'[alce](/especie/alces_alces/) è abbondante e lascia tracce ovunque.


      L'anno ha tre volti. In estate il sole di mezzanotte splende per oltre otto settimane intorno al
      solstizio, con torrenti impetuosi a inizio stagione. A inizio autunno i boschi di betulla si accendono
      di colori dorati in un'aria tersa e senza zanzare. L'inverno porta quattro settimane di crepuscolo a
      mezzogiorno e magnifiche aurore boreali: l'assenza di inquinamento luminoso fa di Abisko una meta
      privilegiata al mondo per ammirarle. Verso dicembre il ghiaccio limpido del Torneträsk consente il
      pattinaggio su ghiaccio, seguito dallo sci escursionistico.
    visit: >-
      La maggior parte dei viaggiatori arriva in treno. La stazione si chiama Abisko Turist, è situata
      all'interno del parco e dista circa 800 metri dal centro visite naturum e dalla stazione alpina della
      STF. Il parco si trova a circa 100 chilometri a ovest di Kiruna, nell'estremo nord svedese.


      Il naturum espone mostre permanenti su flora, fauna, geologia e storia locale. Gli operatori forniscono
      indicazioni sul parco di Vadvetjåkka e guidano escursioni in estate. Intorno al centro sorgono nove
      punti informativi.


      Per una prima escursione, il canyon di Abiskoeatnu è una gola spettacolare e comoda accanto al naturum
      che fu motivo fondante del parco. Un sentiero lungo il Torneträsk di 1,2 chilometri a tratta permette di
      scorgere cutrettole e pettazzurri. Per itinerari a lungo raggio, il Kungsleden percorre 440 km lungo la
      catena scandinava partendo dalla stazione turistica. Tracciati accessibili raggiungono il canyon con
      punti di sosta panoramici.
    history: >-
      La STF aprì una prima foresteria turistica ad Abisko nel 1902 lungo la ferrovia mineraria. La stazione
      scientifica venne edificata nella sede attuale nel 1912 dopo un incendio nel 1910 e inaugurata nel 1913.
    before: >-
      Il delta dell'Abiskojåkka è chiuso alle visite dal 1 maggio al 31 luglio per proteggere la riproduzione
      dell'avifauna. È severamente vietato campeggiare fuori dalle aree dedicate, strappare piante, alterare
      il suolo o disturbare le renne al pascolo e il lavoro dei pastori. I gruppi superiori a 35 persone
      possono necessitare di apposita autorizzazione della prefettura di Norrbotten.


      Tra inizio maggio e inizio giugno, nonché in ottobre, diverse strutture chiudono per garantire riposo
      alla natura. La strada E10 e la ferrovia attraversano il parco.
    around: >-
      Abisko condivide affinità ambientali con remoti parchi boreali. [Sarek](/lugar/sarek-national-park/)
      unisce volpe artica, ghiottone e alce in un paesaggio alpino solcato da forre.
      [Børgefjell](/lugar/borgefjell-national-park/) ospita volpe artica e ghiottone tra laghi e foreste
      vergini. La [Riserva naturale di Vindelfjällen](/lugar/vindelfjallens-naturreservat/) tutela anch'essa
      volpe artica e ghiottone, mentre [Femundsmarka](/lugar/femundsmarka-nasjonalpark/) accoglie ghiottone e
      alce tra laghi incontaminati e antiche pinete.
  pt:
    intro: >-
      Em Abisko quase nunca chove. É o recanto com menor precipitação de toda a Suécia, cerca de 300 mm por
      ano, e um dos mais soalheiros, dado que as montanhas a ocidente retêm a humidade atlântica, deixando ao
      vale apenas o que sobra. Sob este céu límpido estende-se um vale de bétulas montanas entre massivos
      imponentes, com o lago Torneträsk ao fundo e o rio Abiskojåkka a precipitar-se num desfiladeiro
      monumental.


      É um dos primeiros nove parques nacionais da Suécia e da Europa, criado em 1909. Abrange 7.700 hectares
      onde cabem bosques de bétulas, charnecas abertas, prados floridos e tundra alpina descarnada, marcando o
      arranque do Kungsleden.
    landscape: >-
      Para compreender Abisko importa olhar para as escarpas do canhão do Abiskojåkka: mostram, como uma fatia
      de bolo, a anatomia de toda a montanha. Estas rochas ergueram-se do antigo oceano Jápeto e deslizaram
      para este sob a forma de mantos de cavalgamento aquando da formação da cordilheira caledoniana há 400
      milhões de anos. O substrato rochoso rico em cal resultante explica a flora singular: inúmeras espécies
      raras inexistentes noutros pontos da cadeia montanhosa.


      A bétula-das-montanhas cobre 3.900 dos 7.700 hectares e atinge os 650 metros nas encostas norte e cerca
      de 800 nas encostas sul; acima estende-se o fell desértico, que ocupa 2.800 hectares. No meio das
      bétulas, onde o Kårsajåkka desagua no Abiskojåkka, sobrevive um pinhal secular que não deveria subsistir
      tão alto nem tão a norte: é uma relíquia de épocas pós-glaciares mais quentes em que o pinheiro era
      vulgar.


      O clima também espelha mutações recentes. Nas últimas décadas Abisko aqueceu: o permafrost de vale está
      a ceder e o limite arbóreo da bétula subiu cerca de 50 metros. Nos anos cinquenta, os ataques em massa
      de lagartas da traça-outonal desfolharam grande parte da bétula, que continua rala e com muitas árvores
      mortas de pé.
    wildlife: >-
      Este é um parque de botânica excecional. Junto ao bordo do canhão estendem-se charnecas de
      rododendro-lapónico, e nas paredes rochosas crescem silene-polar, árnica-das-montanhas e
      saxífraga-tufada. O monte Njullá é apelidado de «montanha das flores» pela exuberância da sua vegetação;
      no pleno verão, quando flores e aves atingem o esplendor, subir ao topo é imperdível.


      As aves povoam o bosque e a tundra alpina. Entre as bétulas misturam-se pintassilgos-de-bico-amarelo,
      tentilhões-monteses e [pisco-de-peito-azul](/especie/luscinia_svecica/) com ferreirinhas, felosas e
      pisco-de-peito-ruivo; nos planaltos rochosos nidificam a escrevedeira-das-neves, o
      [lagópode-branco](/especie/lagopus_muta/) e o borrelho-ruivo. A ave de rapina mais frequente é o
      esmerilhão, surgindo a [águia-real](/especie/aquila_chrysaetos/) em menor número. Os grandes mamíferos
      são esquivos: [raposa-do-ártico](/especie/vulpes_lagopus/), [glutão](/especie/gulo_gulo/) e
      [lince-euroasiático](/especie/lynx_lynx/) passam apenas esporadicamente, enquanto o
      [alce](/especie/alces_alces/) é abundante e deixa pegadas por toda a parte.


      O ano reparte-se em três tempos. No verão desfruta-se de sol da meia-noite durante mais de oito semanas
      em redor do solstício, com ribeiros caudalosos no degelo. No início do outono o bosque de bétulas arde
      em tons dourados, já sem mosquitos e com ar fresco. No inverno chegam quatro semanas de penumbra ao
      meio-dia e com ela as auroras boreais: a escassez de poluição luminosa e o céu limpo fazem de Abisko um
      dos melhores destinos do mundo para as observar. Por volta de dezembro o gelo límpido do Torneträsk
      permite patinar, sucedendo-se raquetes de neve e esquis.
    visit: >-
      A maioria chega de comboio. A estação chama-se Abisko Turist, fica dentro do parque e dista cerca de 800
      metros do centro de visitantes naturum e da estação alpina da STF. O parque situa-se a cerca de 100
      quilómetros a oeste de Kiruna, no extremo norte sueco.


      O naturum dispõe de exposições permanentes sobre flora, fauna, geologia e história humana. A equipa
      informa sobre o vizinho Vadvetjåkka e promove visitas guiadas no verão. Em redor do centro existem nove
      pontos de observação interpretativos.


      Para um primeiro contacto, o canhão de Abiskoeatnu é uma garganta cénica e de fácil acesso junto ao
      naturum que esteve na génese do parque. Um trilho à beira do Torneträsk estende-se por 1,2 quilómetros
      em cada sentido permitindo avistar alvéolas-amarelas e piscos-de-peito-azul. Para caminhadas de fôlego,
      o Kungsleden perfaz 440 km ao longo da cordilheira escandinava partindo da estação turística. Há
      passadiços adaptados que acedem ao canhão com áreas de descanso.
    history: >-
      A STF inaugurara uma hospedaria turística em Abisko logo em 1902, junto à linha do minério de ferro. A
      estação de investigação científica foi instalada na sua localização atual em 1912 após um incêndio em
      1910, abrindo em 1913.
    before: >-
      O delta do Abiskojåkka está interdito a visitas de 1 de maio a 31 de julho para salvaguardar a
      nidificação das aves. É proibido acampar fora das áreas indicadas, arrancar plantas, degradar o solo e
      perturbar as renas em pastoreio ou a faina dos pastores. Grupos com mais de 35 participantes podem
      necessitar de autorização da Administração de Norrbotten.


      Entre o início de maio e o início de junho, bem como em outubro, as atividades abrandam e várias
      estruturas fecham para repouso da natureza. A estrada E10 e a linha férrea atravessam o parque.
    around: >-
      Abisko partilha laços ecológicos com outros parques boreais. [Sarek](/lugar/sarek-national-park/)
      congrega raposa-do-ártico, glutão e alce entre altas montanhas e canhões.
      [Børgefjell](/lugar/borgefjell-national-park/) partilha raposa-do-ártico e glutão com lagos cristalinos
      e matas virgens. A [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/) acolhe
      igualmente raposa-do-ártico e glutão, e [Femundsmarka](/lugar/femundsmarka-nasjonalpark/) reúne glutão e
      alce entre pinhais ancestrais.
