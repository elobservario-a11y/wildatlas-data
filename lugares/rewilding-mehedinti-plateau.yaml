unico:
  es: >-
    Un karst de caliza jurásica donde una pasarela de piedra de verdad, el Puente de Dios, es el mayor puente
    natural del país y el segundo de Europa.
  en: >-
    A Jurassic limestone karst where the Ponoarele Natural Bridge — the country's largest and Europe's
    second-largest natural arch — is not a metaphor but a genuine stone walkway.
  fr: >-
    Un karst de calcaire jurassique où le Pont de Dieu de Ponoarele — le plus grand pont naturel du pays et le
    deuxième d'Europe — est véritablement une passerelle de pierre.
  de: >-
    Ein Jurakalk-Karst, in dem die Naturbrücke von Ponoarele — die größte des Landes und zweitgrößte Europas —
    kein Bild, sondern ein echter Steinweg ist.
  it: >-
    Un karst di calcare giurassico dove il Ponte di Dio di Ponoarele — il più grande ponte naturale del paese
    e il secondo d'Europa — è una passerella di pietra vera e propria.
  pt: >-
    Um carso de calcário jurássico onde a Ponte de Deus de Ponoarele — a maior ponte natural do país e a
    segunda da Europa — é uma passagem de pedra verdadeira.
observaciones:
  es: >-
    Las mejores épocas son primavera y principio de otoño. Plantea entre dos y tres días. Los hábitats de
