    Strehaia y Drobeta-Turnu Severin, y después por la DN67 hacia Malovăț.
texto:
  es:
    intro: >-
      Aquí el suelo se hunde, se abre y se esconde. En el norte del distrito de Mehedinți, en el sudoeste de
      Rumanía, una meseta de colinas bajas y suaves guarda debajo de su hierba dolinas, lapiaces, gargantas y
      cuevas. Es el Geoparque de la Meseta de Mehedinți, un área protegida que se extiende por varios
      municipios entre los montes Mehedinți, en los Cárpatos Meridionales, y el piedemonte Getic, y que no es
      un páramo vacío: es una zona de colinas bastante habitada, con pueblos, iglesias de madera y prados que
      siguen segándose.
    landscape: >-
      La roca lo explica casi todo. Las colinas son de esquistos cristalinos y de calizas atribuidas al
      Jurásico, y sobre las calizas el agua ha ido tallando formaciones kársticas raras: dolinas, lapiaces,
      valles, gargantas y lagos como el Zătonul Mare y el Zătonul Mic. Bajo tierra se abren las cuevas de
      Izverna y de Ponoarele.


      El gran emblema está en Ponoarele: el Puente de Dios, o Puente de los Gigantes, el mayor puente natural
      de Rumanía y el segundo de Europa por tamaño. Forma parte del complejo kárstico de Ponoarele, una
      reserva natural geológica, paisajística, florística y faunística donde también se ve el campo de
      lapiaces.


      Los hábitats cambian con la piedra y la altura. Hay bosques de haya y abeto blanco del sudeste de los
      Cárpatos, hayedos de tipo Luzulo-Fagetum, bosques ilirios de roble y carpe, y bosques de tilos y arces
      en pendientes y barrancos. En los claros, prados secos seminaturales y matorral sobre sustrato calcáreo,
      y prados de siega de montaña. Dentro del parque hay además cuevas con acceso público prohibido,
      protegidas como hábitat.
    wildlife: >-
      Dominan la haya y el roble albar, con fresno de flor, cornejo macho y carpe oriental. A ras de suelo
      crecen orquídeas, entre ellas Himantoglossum caprinum, y una fritilaria de montaña, Fritillaria montana.
      La primavera y el principio del otoño son las épocas indicadas para ir despacio y mirar hacia abajo.


      La fauna es larga y variada. El plan de gestión reconoce en el geoparque ochenta y cuatro especies de
      fauna de interés para la conservación, y la lista de mamíferos incluye al [lobo](/especie/canis_lupus/)
      y al [oso pardo](/especie/ursus_arctos/), junto con el [ciervo](/especie/cervus_elaphus/), el corzo, el
      [gato montés](/especie/felis_silvestris/) y la marta. Las cuevas del karst acogen murciélagos, como el
      [murciélago grande de herradura](/especie/rhinolophus_ferrumequinum/), el de bosque y el ratonero
      grande. Entre las aves aparecen la abubilla, la oropéndola y el ruiseñor común.


      Entre los reptiles, la [víbora cornuda](/especie/vipera_ammodytes/) y la [tortuga
      mediterránea](/especie/testudo_hermanni/) están en la lista de la meseta, junto con la culebra lisa
      europea, la lución y, entre los anfibios, el sapo de vientre amarillo y el tritón crestado.
    visit: >-
      La meseta se recorre a pie o en bici por caminos locales. Un circuito de montaña que conecta pueblos de
      la zona, en parte por la Via Transilvanica y en parte por el recorrido de bicicleta de montaña de la
      competición GeoPark Mehedinți Adventure, sale y llega a Isverna y mide 50,1 km. La ruta montañosa de
      Cerna, que sigue la Via Transilvanica, tiene 69,6 km entre Obârșia Cloșani y Drobeta Turnu Severin,
      donde termina este sendero de largo recorrido de 1.428 km.


      Para entender el karst, la parada obligada es Ponoarele. Y para ver cómo vivía la gente, los pueblos
      guardan iglesias de madera, como la de San Nicolás de Ponoarele, de 1766.
    history: >-
      El geoparque se declaró área protegida por decisión del Gobierno el 30 de noviembre de 2004 y abarca
      106.500 hectáreas. En la mitad noroccidental se solapa con el espacio Natura ROSCI0198 y con áreas
      naturales protegidas nacionales, y dentro del parque quedan reservas menores como las gargantas de
      Coșuștei, la cueva y garganta de Topolnița y la cueva de Epuran. El plan de gestión reconoce trece
      categorías de hábitat de interés para la conservación.


      La huella humana también es patrimonio. El conjunto del monasterio de Baia de Aramă data de entre 1699 y
      1703, y el del Schitul Topolnița se construyó entre 1600 y 1611.
    before: >-
      Las mejores épocas son primavera y principio de otoño. Plantea entre dos y tres días. Los hábitats de
      cuevas con acceso público prohibido no se visitan. Desde Craiova se llega por la DN6, pasando por
      Filiași, Strehaia y Drobeta-Turnu Severin, y después por la DN67 hacia Malovăț.
    around: >-
      A pocos kilómetros están las [Montañas de Godeanu](/lugar/muntii-godeanu/) y el [Parque Nacional
      Domogled - Valle del Cerna](/lugar/parcul-national-domogled---valea-cernei/). A unos seis kilómetros
      queda el [Parque Nacional Đerdap - Puerta de
      Hierro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), y a veinte el [Parque Nacional
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Más lejos, el [Bosque Primario de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) comparte con la meseta el abeto blanco, el haya y
      el lobo.
  en:
    intro: >-
      Here the ground sinks, opens and hides. In northern Mehedinți County, in southwestern Romania, a plateau
      of low rolling hills conceals beneath its grass a world of dolines, lapiaz fields, gorges and caves.
      This is the Mehedinți Plateau Geopark, a protected area spanning several municipalities between the
      Mehedinți Mountains of the Southern Carpathians and the Getic Piedmont. It is not a barren wasteland: it
      is a fairly densely settled hill landscape of villages, wooden churches and meadows still cut by scythe.
    landscape: >-
      The rock explains almost everything. The hills are made of crystalline schists and limestones attributed
      to the Jurassic, and on the limestones water has carved rare karst formations: dolines, lapiaz fields,
      valleys, gorges and lakes such as Zătonul Mare and Zătonul Mic. Underground lie the caves of Izverna and
      Ponoarele.


      The great emblem is at Ponoarele: the Podul lui Dumnezeu (Bridge of God), or Bridge of Giants, the
      largest natural arch in Romania and second-largest in Europe. It forms part of the Ponoarele karst
      complex, a geological, landscape, floristic and faunal nature reserve where the lapiaz field is also
      visible.


      Habitats change with the substrate and altitude. There are southeastern Carpathian beech and silver fir
      forests, Luzulo-Fagetum beech woods, Illyrian oak-hornbeam forests and lime-maple woods on slopes and
      ravines. In clearings, semi-natural dry grasslands and scrub on calcareous substrate, and mountain hay
      meadows. The park also protects caves off-limits to the public.
    wildlife: >-
      Beech and sessile oak dominate, with flowering ash, Cornelian cherry and eastern hornbeam. At ground
      level grow orchids including *Himantoglossum caprinum*, and a mountain fritillary, *Fritillaria
      montana*. Spring and early autumn are the seasons to slow down and look low.


      The fauna is long and varied. The management plan recognises eighty-four wildlife conservation species
      in the geopark; mammals include [grey wolf](/especie/canis_lupus/) and [brown
      bear](/especie/ursus_arctos/), alongside [red deer](/especie/cervus_elaphus/), roe deer, [European
      wildcat](/especie/felis_silvestris/) and pine marten. The karst caves shelter bats including the
      [greater horseshoe bat](/especie/rhinolophus_ferrumequinum/), Bechstein's bat and the greater
      mouse-eared bat. Among birds, hoopoe, Eurasian golden oriole and common nightingale.


      Among reptiles, [nose-horned viper](/especie/vipera_ammodytes/) and [Hermann's
      tortoise](/especie/testudo_hermanni/) are on the plateau list, alongside European smooth snake, slow
      worm, and among amphibians, yellow-bellied toad and great crested newt.
    visit: >-
      The plateau is explored on foot or by bike along local tracks. A mountain circuit connecting area
      villages, partly along the Via Transilvanica and partly on the GeoPark Mehedinți Adventure mountain-bike
      race route, starts and ends at Isverna and measures 50.1 km. The Cerna mountain route following the Via
      Transilvanica runs 69.6 km between Obârșia Cloșani and Drobeta Turnu Severin, where this 1,428 km
      long-distance trail ends.


      To understand the karst, the essential stop is Ponoarele. And to see how people lived, the villages hold
      wooden churches, like the Church of St Nicholas at Ponoarele, built in 1766.
    history: >-
      The geopark was declared a protected area by government decision on 30 November 2004 and covers 106,500
      hectares. Its northwestern half overlaps with the Natura site ROSCI0198 and national protected areas;
      smaller reserves within the park include the Coșuștea gorges, the Topolnița cave and gorge, and the
      Epuran cave. The management plan recognises thirteen categories of conservation habitat.


      Human heritage is also protected. The Baia de Aramă monastery complex dates from 1699 to 1703, and the
      Schitul Topolnița hermitage was built between 1600 and 1611.
    before: >-
      Best seasons are spring and early autumn. Allow two to three days. Cave habitats closed to the public
      are not visited. From Craiova take the DN6 through Filiași, Strehaia and Drobeta-Turnu Severin, then the
      DN67 toward Malovăț.
    around: >-
      A few kilometres away are the [Godeanu Mountains](/lugar/muntii-godeanu/) and the [Domogled-Cerna Valley
      National Park](/lugar/parcul-national-domogled---valea-cernei/). About six kilometres away lies the
      [Đerdap - Iron Gates National Park](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), and twenty
      kilometres away the [Retezat National Park](/lugar/parcul-national-retezat---masivul-muntos/). Further
      off, the [Strâmbu-Băiuț Old-Growth Forest](/lugar/codrul-secular-strambu-baiut/) shares with the plateau
      silver fir, beech and wolf.
  fr:
    intro: >-
      Ici le sol s'enfonce, s'ouvre et se dérobe. Dans le nord du département de Mehedinți, au sud-ouest de la
      Roumanie, un plateau de collines basses et douces dissimule sous ses herbes un monde de dolines, de
      lapiaz, de gorges et de grottes. C'est le Géoparc du Plateau de Mehedinți, une aire protégée s'étendant
      sur plusieurs communes entre les monts Mehedinți, dans les Carpates méridionales, et le piémont Gétic.
      Ce n'est pas un désert vide : c'est un paysage de collines assez habité, avec des villages, des églises
      en bois et des prairies encore fauchées à la main.
    landscape: >-
      La roche explique presque tout. Les collines sont faites de schistes cristallins et de calcaires
      attribués au Jurassique, et sur les calcaires l'eau a sculpté des formations karstiques rares : dolines,
      lapiaz, vallées, gorges et lacs comme le Zătonul Mare et le Zătonul Mic. Sous terre s'ouvrent les
      grottes d'Izverna et de Ponoarele.


      Le grand emblème se trouve à Ponoarele : le Podul lui Dumnezeu (Pont de Dieu), ou Pont des Géants, le
      plus grand pont naturel de Roumanie et le deuxième d'Europe. Il fait partie du complexe karstique de
      Ponoarele, une réserve naturelle géologique, paysagère, floristique et faunistique où l'on voit aussi le
      champ de lapiaz.


      Les habitats changent avec la roche et l'altitude. On trouve des forêts de hêtres et de sapins blancs du
      sud-est des Carpates, des hêtraies de type Luzulo-Fagetum, des chênaies-charmaies illyriennes et des
      forêts de tilleuls et d'érables sur pentes et ravins. Dans les clairières, des pelouses sèches
      semi-naturelles et des fourrés calcaires, et des prairies de fauche de montagne. Le parc protège aussi
      des grottes interdites au public.
    wildlife: >-
      Le hêtre et le chêne sessile dominent, avec le frêne à fleurs, le cornouiller mâle et le charme
      oriental. Au ras du sol poussent des orchidées dont *Himantoglossum caprinum*, et une fritillaire de
      montagne, *Fritillaria montana*. Le printemps et le début de l'automne sont les saisons où ralentir et
      regarder vers le bas.


      La faune est longue et variée. Le plan de gestion reconnaît quatre-vingt-quatre espèces faunistiques
      d'intérêt pour la conservation dans le géoparc ; les mammifères comptent le
      [loup](/especie/canis_lupus/) et l'[ours brun](/especie/ursus_arctos/), ainsi que le [cerf
      élaphe](/especie/cervus_elaphus/), le chevreuil, le [chat sauvage](/especie/felis_silvestris/) et la
      martre. Les grottes du karst abritent des chauves-souris dont le [grand rhinolophe fer à
      cheval](/especie/rhinolophus_ferrumequinum/), le vespertilion de Bechstein et le grand murin. Parmi les
      oiseaux : la huppe, le loriot d'Europe et le rossignol commun.


      Parmi les reptiles, la [vipère cornue](/especie/vipera_ammodytes/) et la [tortue
      d'Hermann](/especie/testudo_hermanni/) figurent sur la liste du plateau, avec le coronelle lisse,
      l'orvet et, parmi les amphibiens, le sonneur à ventre jaune et le triton crêté.
    visit: >-
      Le plateau se parcourt à pied ou à vélo par des chemins locaux. Un circuit de montagne reliant des
      villages de la zone, en partie par la Via Transilvanica et en partie par la route VTT du GeoPark
      Mehedinți Adventure, part et arrive à Isverna et mesure 50,1 km. La route de montagne Cerna, qui suit la
      Via Transilvanica, couvre 69,6 km entre Obârșia Cloșani et Drobeta Turnu Severin, où se termine ce
      sentier de grande randonnée de 1 428 km.


      Pour comprendre le karst, l'arrêt incontournable est Ponoarele. Et pour voir comment vivaient les gens,
      les villages conservent des églises en bois, comme celle de Saint-Nicolas de Ponoarele, construite en
      1766.
    history: >-
      Le géoparc a été déclaré aire protégée par décision gouvernementale le 30 novembre 2004 et couvre 106
      500 hectares. Sa moitié nord-ouest chevauche le site Natura ROSCI0198 et des aires naturelles protégées
      nationales, et le parc contient des réserves plus petites comme les gorges de Coșuștea, la grotte et les
      gorges de Topolnița et la grotte d'Epuran. Le plan de gestion reconnaît treize catégories d'habitat
      d'intérêt pour la conservation.


      L'empreinte humaine est aussi patrimoine. L'ensemble du monastère de Baia de Aramă date de 1699 à 1703,
      et celui du Schitul Topolnița a été bâti entre 1600 et 1611.
    before: >-
      Les meilleures saisons sont le printemps et le début de l'automne. Prévoyez deux à trois jours. Les
      habitats souterrains fermés au public ne se visitent pas. Depuis Craiova, prenez la DN6 par Filiași,
      Strehaia et Drobeta-Turnu Severin, puis la DN67 vers Malovăț.
    around: >-
      À quelques kilomètres se trouvent les [monts Godeanu](/lugar/muntii-godeanu/) et le [parc national
      Domogled - Vallée du Cerna](/lugar/parcul-national-domogled---valea-cernei/). À environ six kilomètres
      se trouve le [parc national Đerdap - Portes de Fer](/lugar/nacionalni-park-djerdap---puerta-de-hierro/),
      et à vingt kilomètres le [parc national Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Plus
      loin, la [forêt vierge de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) partage avec le plateau
      le sapin blanc, le hêtre et le loup.
  de:
    intro: >-
      Hier versinkt, öffnet und verbirgt sich der Boden. Im Norden des Kreises Mehedinți, im Südwesten
      Rumäniens, birgt ein Plateau niedriger, sanfter Hügel unter seinem Gras Dolinen, Karrenfelder,
      Schluchten und Höhlen. Das ist der Geopark Mehedinți-Plateau, ein Schutzgebiet über mehrere Gemeinden
      zwischen den Mehedinți-Bergen in den Südkarpaten und dem Getischen Vorland. Kein leeres Ödland: eine
      recht dicht besiedelte Hügellandschaft mit Dörfern, Holzkirchen und noch immer von Hand gemähten Wiesen.
    landscape: >-
      Das Gestein erklärt fast alles. Die Hügel bestehen aus Kristallschiefern und Jurakalksteinen, auf denen
      das Wasser seltene Karstformen geschaffen hat: Dolinen, Karrenfelder, Täler, Schluchten und Seen wie den
      Zătonul Mare und den Zătonul Mic. Unterirdisch öffnen sich die Höhlen von Izverna und Ponoarele.


      Das große Wahrzeichen steht bei Ponoarele: der Podul lui Dumnezeu (Gottesbrücke) oder Riesenbrücke, die
      größte Naturbrücke Rumäniens und die zweitgrößte Europas. Sie gehört zum Karstkomplex von Ponoarele,
      einem geologischen, landschaftlichen, floristischen und faunistischen Naturreservat, in dem auch das
      Karrenfeld zu sehen ist.


      Die Lebensräume wechseln je nach Untergrund und Höhe. Es gibt südostkarpathische
      Buchen-Weißtannenwälder, Luzulo-Fagetum-Buchenwälder, Illyrische Eichen-Hainbuchenwälder und
      Linden-Ahornwälder an Hängen und in Schluchten. In Lichtungen halbnatürliches Trockengrünland und
      Gebüsch auf Kalk sowie Bergmähwiesen. Der Park schützt auch für die Öffentlichkeit gesperrte Höhlen.
    wildlife: >-
      Buche und Traubeneiche dominieren, mit Fraxinus ornus, Cornus mas und Ostrya carpinifolia. Bodennah
      wachsen Orchideen darunter *Himantoglossum caprinum* und eine Bergschachblume, *Fritillaria montana*.
      Frühling und früher Herbst sind die Jahreszeiten zum langsamen Gehen und Hinschauen.


      Die Fauna ist lang und vielfältig. Der Managementplan erkennt vierundachtzig tierschutzrelevante Arten
      im Geopark; zu den Säugetieren zählen [Wolf](/especie/canis_lupus/) und
      [Braunbär](/especie/ursus_arctos/), dazu [Rothirsch](/especie/cervus_elaphus/), Reh,
      [Wildkatze](/especie/felis_silvestris/) und Baummarder. Die Karsthöhlen beherbergen Fledermäuse wie die
      [Große Hufeisennase](/especie/rhinolophus_ferrumequinum/), Bechsteinfledermaus und Großes Mausohr. Unter
      den Vögeln: Wiedehopf, Pirol und Nachtigall.


      Bei den Reptilien stehen [Europäische Hornotter](/especie/vipera_ammodytes/) und [Griechische
      Landschildkröte](/especie/testudo_hermanni/) auf der Liste der Hochebene, dazu Glattnatter,
      Blindschleiche und unter den Amphibien Gelbbauchunke und Kammmolch.
    visit: >-
      Das Plateau erkundet man zu Fuß oder mit dem Rad auf Ortsstraßen. Ein Gebirgsrundkurs der Dörfer der
      Region, teils auf der Via Transilvanica und teils auf der Mountainbike-Strecke des GeoPark Mehedinți
      Adventure, startet und endet in Isverna und misst 50,1 km. Die Cerna-Bergstrecke auf der Via
      Transilvanica umfasst 69,6 km zwischen Obârșia Cloșani und Drobeta Turnu Severin, wo dieser 1 428 km
      lange Fernwanderweg endet.


      Für das Karst-Verständnis ist Ponoarele unerlässlich. Und um zu sehen, wie die Menschen lebten, bewahren
      die Dörfer Holzkirchen, wie die St.-Nikolaus-Kirche von Ponoarele aus dem Jahr 1766.
    history: >-
      Der Geopark wurde durch Regierungsbeschluss vom 30. November 2004 zum Schutzgebiet erklärt und umfasst
      106.500 Hektar. Seine nordwestliche Hälfte überlappt mit dem Natura-Gebiet ROSCI0198 und nationalen
      Naturschutzgebieten; kleinere Reservate innerhalb des Parks sind die Coșuștea-Schluchten, die
      Topolnița-Höhle und -Schlucht und die Epuran-Höhle. Der Managementplan erkennt dreizehn
      Lebensraumkategorien von Erhaltungsinteresse an.


      Auch das menschliche Erbe ist geschützt. Der Klosterkomplex Baia de Aramă stammt aus den Jahren 1699 bis
      1703, und das Schitul Topolnița wurde zwischen 1600 und 1611 erbaut.
    before: >-
      Die besten Jahreszeiten sind Frühling und früher Herbst. Plane zwei bis drei Tage ein. Höhlenbiotope mit
      Besuchsverbot werden nicht betreten. Von Craiova über die DN6 durch Filiași, Strehaia und Drobeta-Turnu
      Severin, dann DN67 Richtung Malovăț.
    around: >-
      Wenige Kilometer entfernt liegen die [Godeanu-Berge](/lugar/muntii-godeanu/) und der [Nationalpark
      Domogled - Cernatal](/lugar/parcul-national-domogled---valea-cernei/). Etwa sechs Kilometer entfernt
      liegt der [Nationalpark Đerdap - Eisernes Tor](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), und
      zwanzig Kilometer entfernt der [Nationalpark Retezat](/lugar/parcul-national-retezat---masivul-muntos/).
      Weiter entfernt teilt der [Urwald Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) mit der Hochebene
      Weißtanne, Buche und Wolf.
  it:
    intro: >-
      Qui il suolo sprofonda, si apre e si nasconde. Nel nord del distretto di Mehedinți, nel sud-ovest della
      Romania, un altopiano di colline basse e dolci cela sotto l'erba un mondo di doline, campi di carren,
      gole e grotte. È il Geoparco dell'Altopiano di Mehedinți, un'area protetta che si estende su diversi
      comuni tra i Monti Mehedinți, nei Carpazi Meridionali, e il piede dei Carpe Getici. Non è una landa
      desolata: è un paesaggio collinare abbastanza abitato, con villaggi, chiese di legno e prati ancora
      falciati a mano.
    landscape: >-
      La roccia spiega quasi tutto. Le colline sono di scisti cristallini e calcari attribuiti al Giurassico,
      e sui calcari l'acqua ha scolpito rare formazioni carsiche: doline, campi di carren, vallate, gole e
      laghi come Zătonul Mare e Zătonul Mic. Sottoterra si aprono le grotte di Izverna e Ponoarele.


      Il grande emblema è a Ponoarele: il Podul lui Dumnezeu (Ponte di Dio), o Ponte dei Giganti, il più
      grande ponte naturale della Romania e il secondo d'Europa per dimensione. Fa parte del complesso carsico
      di Ponoarele, una riserva naturale geologica, paesaggistica, floristica e faunistica dove si vede anche
      il campo di carren.


      Gli habitat cambiano con la roccia e l'altitudine. Ci sono foreste di faggio e abete bianco del sud-est
      carpatico, faggete di tipo Luzulo-Fagetum, boschi illirici di quercia e carpino e boschi di tigli e
      aceri su pendii e burroni. Nelle radure, praterie asciutte semi-naturali e macchia su substrato
      calcareo, e prati da sfalcio di montagna. Il parco protegge anche grotte inaccessibili al pubblico.
    wildlife: >-
      Faggio e rovere dominano, con orniello, corniolo e carpino orientale. A livello del suolo crescono
      orchidee tra cui *Himantoglossum caprinum* e un fritillario montano, *Fritillaria montana*. La primavera
      e l'inizio dell'autunno sono le stagioni per rallentare e guardare in basso.


      La fauna è lunga e variegata. Il piano di gestione riconosce ottantaquattro specie faunistiche di
      interesse conservativo nel geoparco; i mammiferi comprendono il [lupo grigio](/especie/canis_lupus/) e
      l'[orso bruno](/especie/ursus_arctos/), con il [cervo](/especie/cervus_elaphus/), il capriolo, il [gatto
      selvatico](/especie/felis_silvestris/) e la martora. Le grotte del karst ospitano pipistrelli tra cui il
      [*Rhinolophus ferrumequinum*](/especie/rhinolophus_ferrumequinum/), il vespertilio di Bechstein e il
      vespertilio maggiore. Tra gli uccelli: upupa, rigogolo e usignolo comune.


      Tra i rettili, la [vipera cornuta](/especie/vipera_ammodytes/) e la [testuggine di
      Hermann](/especie/testudo_hermanni/) sono nella lista dell'altopiano, con il colubro liscio europeo,
      l'orbettino e, tra gli anfibi, il bombinator e il tritone crestato.
    visit: >-
      L'altopiano si percorre a piedi o in bici su strade locali. Un circuito montano che collega i villaggi
      della zona, in parte sulla Via Transilvanica e in parte sul tracciato mountain bike della competizione
      GeoPark Mehedinți Adventure, parte e arriva a Isverna e misura 50,1 km. Il percorso montano Cerna, che
      segue la Via Transilvanica, copre 69,6 km tra Obârșia Cloșani e Drobeta Turnu Severin, dove si conclude
      questo sentiero di grande percorrenza di 1 428 km.


      Per capire il karst, la tappa obbligata è Ponoarele. E per vedere come viveva la gente, i villaggi
      conservano chiese di legno, come quella di San Nicola di Ponoarele, costruita nel 1766.
    history: >-
      Il geoparco è stato dichiarato area protetta per decisione del Governo il 30 novembre 2004 e comprende
      106 500 ettari. La metà nord-occidentale si sovrappone al sito Natura ROSCI0198 e ad aree naturali
      protette nazionali; all'interno del parco si trovano riserve minori come le gole di Coșuștea, la grotta
      e la gola di Topolnița e la grotta di Epuran. Il piano di gestione riconosce tredici categorie di
      habitat di interesse conservativo.


      Anche l'impronta umana è patrimonio. Il complesso del monastero di Baia de Aramă risale al periodo
      1699-1703, e quello dello Schitul Topolnița fu costruito tra il 1600 e il 1611.
    before: >-
      Le stagioni migliori sono la primavera e l'inizio dell'autunno. Pianifica due o tre giorni. Gli habitat
      delle grotte con divieto d'accesso non si visitano. Da Craiova si arriva via DN6, passando per Filiași,
      Strehaia e Drobeta-Turnu Severin, poi per la DN67 verso Malovăț.
    around: >-
      A pochi chilometri si trovano i [Monti Godeanu](/lugar/muntii-godeanu/) e il [Parco nazionale Domogled -
      Valle del Cerna](/lugar/parcul-national-domogled---valea-cernei/). A circa sei chilometri si trova il
      [Parco nazionale Đerdap - Porte di Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), e a venti
      chilometri il [Parco nazionale Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Più lontana,
      la [Foresta vergine di Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) condivide con l'altopiano
      l'abete bianco, il faggio e il lupo.
  pt:
    intro: >-
      Aqui o solo afunda, abre-se e esconde-se. No norte do condado de Mehedinți, no sudoeste da Roménia, um
      planalto de colinas baixas e suaves guarda debaixo da relva dolinas, lapiás, gargantas e grutas. É o
      Geoparque do Planalto de Mehedinți, uma área protegida que se estende por vários municípios entre os
      Montes Mehedinți, nos Cárpatos Meridionais, e o sopé Gético. Não é um ermo desabitado: é uma paisagem de
      colinas bastante habitada, com aldeias, igrejas de madeira e prados que continuam a ser ceifados.
    landscape: >-
      A rocha explica quase tudo. As colinas são de xistos cristalinos e calcários atribuídos ao Jurássico, e
      sobre os calcários a água foi talhando formações cársicas raras: dolinas, lapiás, vales, gargantas e
      lagos como o Zătonul Mare e o Zătonul Mic. Sob a terra abrem-se as grutas de Izverna e de Ponoarele.


      O grande emblema está em Ponoarele: o Podul lui Dumnezeu (Ponte de Deus), ou Ponte dos Gigantes, a maior
      ponte natural da Roménia e a segunda da Europa em tamanho. Integra o complexo cársico de Ponoarele, uma
      reserva natural geológica, paisagística, florística e faunística onde também se vê o campo de lapiás.


      Os habitats mudam com a pedra e a altitude. Há florestas de faia e abeto-branco do sudeste dos Cárpatos,
      faiais do tipo Luzulo-Fagetum, florestas ilíricas de carvalho e carpino, e florestas de tílias e bordos
      em encostas e ravinas. Nas clareiras, prados secos seminaturais e matos sobre substrato calcário, e
      prados de corte de montanha. Dentro do parque há também grutas com acesso público proibido, protegidas
      como habitat.
    wildlife: >-
      Dominam a faia e o carvalho-alvarinho, com freixo-de-flor, corniso e carpino-oriental. Ao nível do solo
      crescem orquídeas, entre elas *Himantoglossum caprinum*, e uma fritilária de montanha, *Fritillaria
      montana*. A primavera e o início do outono são as épocas indicadas para ir devagar e olhar para baixo.


      A fauna é longa e variada. O plano de gestão reconhece oitenta e quatro espécies de fauna de interesse
      para a conservação no geoparque; a lista de mamíferos inclui o [lobo-cinzento](/especie/canis_lupus/) e
      o [urso-pardo](/especie/ursus_arctos/), juntamente com o [veado-vermelho](/especie/cervus_elaphus/), o
      corço, o [gato-bravo](/especie/felis_silvestris/) e a marta. As grutas do carso acolhem morcegos, como o
      [*Rhinolophus ferrumequinum*](/especie/rhinolophus_ferrumequinum/), o morcego-de-bechstein e o
      morcego-rato-grande. Entre as aves, a poupa, o papa-figos e o rouxinol-comum.


      Entre os répteis, a [*Vipera ammodytes*](/especie/vipera_ammodytes/) e a
      [tartaruga-de-Hermann](/especie/testudo_hermanni/) constam da lista do planalto, juntamente com a
      cobra-lisa-europeia, o licranço e, entre os anfíbios, o sapo-de-barriga-amarela e o tritão-de-crista.
    visit: >-
      O planalto percorre-se a pé ou de bicicleta por caminhos locais. Um circuito de montanha que liga
      aldeias da zona, em parte pela Via Transilvanica e em parte pelo percurso de bicicleta de montanha da
      competição GeoPark Mehedinți Adventure, parte e chega a Isverna e mede 50,1 km. A rota montanhosa de
      Cerna, que segue a Via Transilvanica, tem 69,6 km entre Obârșia Cloșani e Drobeta Turnu Severin, onde
      termina este trilho de longa distância de 1 428 km.


      Para entender o carso, a paragem obrigatória é Ponoarele. E para ver como vivia a gente, as aldeias
      guardam igrejas de madeira, como a de São Nicolau de Ponoarele, de 1766.
    history: >-
      O geoparque foi declarado área protegida por decisão do Governo de 30 de novembro de 2004 e abrange 106
      500 hectares. A metade noroeste sobrepõe-se ao espaço Natura ROSCI0198 e a áreas naturais protegidas
      nacionais; dentro do parque ficam reservas menores como as gargantas de Coșuștea, a gruta e garganta de
      Topolnița e a gruta de Epuran. O plano de gestão reconhece treze categorias de habitat de interesse para
      a conservação.


      A pegada humana é também património. O conjunto do mosteiro de Baia de Aramă data de 1699 a 1703, e o do
      Schitul Topolnița foi construído entre 1600 e 1611.
    before: >-
      As melhores épocas são a primavera e o início do outono. Planeia dois a três dias. Os habitats de grutas
      com acesso público proibido não se visitam. De Craiova chega-se pela DN6, passando por Filiași, Strehaia
      e Drobeta-Turnu Severin, e depois pela DN67 em direção a Malovăț.
    around: >-
      A poucos quilómetros estão os [Montes Godeanu](/lugar/muntii-godeanu/) e o [Parque Nacional Domogled -
      Vale do Cerna](/lugar/parcul-national-domogled---valea-cernei/). A cerca de seis quilómetros fica o
      [Parque Nacional Đerdap - Portas de Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/), e a
      vinte quilómetros o [Parque Nacional Retezat](/lugar/parcul-national-retezat---masivul-muntos/). Mais
      longe, a [Floresta Primária de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) partilha com o
      planalto o abeto-branco, a faia e o lobo.
