  es: Lagos de origen glaciar, carrizales y humedal de Mareschi en la baja valle de Susa.
  en: Glacial lakes, reedbeds, and the Mareschi wetland in the lower Susa Valley.
  fr: Lacs d’origine glaciaire, roselières et zone humide des Mareschi dans la basse vallée de Suse.
  de: Gletscherseen, Schilfgürtel und das Mareschi-Feuchtgebiet im unteren Susatal.
  it: Laghi di origine glaciale, canneti e zona umida dei Mareschi nella bassa valle di Susa.
