unico:
  es: >-
    Dos lagos de origen glaciar a las puertas de Turín, con un carrizal de aves acuáticas, una palude de
    anfibios y los restos de una fábrica de dinamita.
  en: >-
    Two glacial lakes on Turin’s doorstep, featuring waterfowl reedbeds, an amphibian marsh, and the ruins of
    a historic dynamite factory.
  fr: >-
    Deux lacs d’origine glaciaire aux portes de Turin, avec une roselière à oiseaux d’eau, un marais à
    amphibiens et les vestiges d’une poudrerie historique.
  de: >-
    Zwei eiszeitliche Seen vor den Toren Turins mit Wasservogel-Schilfgürteln, einem Amphibienmoor und den
    Ruinen einer historischen Dynamitfabrik.
  it: >-
    Due laghi di origine glaciale alle porte di Torino, con un canneto per avifauna acquatica, una palude per
    anfibi e i ruderi di uno storico dinamitificio.
  pt: >-
    Dois lagos de origem glaciar às portas de Turim, com um caniçal de aves aquáticas, um sapal de anfíbios e
    as ruínas de uma fábrica histórica de dinamite.
observaciones:
