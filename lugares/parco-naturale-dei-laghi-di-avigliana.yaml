    salidas de observación de anfibios tienen más demanda que plazas.
texto:
  es:
    intro: >-
      Entre finales del invierno y principios de la primavera, los somormujos lavancos de los lagos de
      Avigliana ejecutan su parada nupcial, la danza del espejo. Después viene el nido flotante y, más tarde,
      los polluelos transportados sobre el dorso de los padres, un espectáculo que se ve fácilmente desde las
      orillas. Todo ocurre a poco más de 20 km de Turín, en un parque natural encajado en un contexto urbano.


      Los Lagos de Avigliana están en el bajo valle de Susa, en el borde de la llanura de Turín. El parque lo
      creó en 1980 y protege dos lagos y la palude de los Mareschi. Sus motivos de protección son salvaguardar
      esa zona húmeda y recuperar las condiciones hidrobiológicas de los lagos.
    landscape: >-
      Los lagos nacieron cuando se retiró el hielo que ocupaba el valle en el Pleistoceno, entre 750 000 y 10
      000 años atrás: son cubetas intramorrénicas típicas. Probablemente las glaciaciones generaron cuatro
      cuencas, pero dos se colmataron con los sedimentos de las colinas. Quedan dos lagos, muy distintos entre
      sí. El Lago Piccolo, de 60 hectáreas y 356 metros de altitud, vierte sus aguas al Lago Grande, de 90
      hectáreas y 352 metros. El Piccolo es el más natural: lo rodean bosques, prados y un cinturón de
      carrizal que da refugio a las principales especies de peces y aves del área.


      En el extremo norte está la palude de los Mareschi, la zona húmeda por la que las aguas de los lagos
      salen hacia el Dora Riparia y la zona palustre más occidental de Italia. Las colinas completan el
      cuadro. Las del oeste del Lago Piccolo son más húmedas, con monte bajo de roble, castaño, carpe y
      fresno. Las del norte del Lago Grande son más secas, con flora xerotermófila, roble pubescente, robinia,
      olmo y cerezo, y con grandes bloques erráticos que testimonian los antiguos glaciares.
    wildlife: >-
      Es un parque de otoño e invierno. Centenares de aves como el [porrón común](/especie/aythya_ferina/), el
      porrón moñudo, la cerceta, el silbón, la gallineta y el cuchara se concentran en los lagos en esas
      estaciones, y el parque es importante para las aves acuáticas, sobre todo las invernantes. De las 54
      especies de aves censadas, 13 figuran en los anexos de la Directiva de Aves de la Unión Europea.


      En primavera cambia el protagonismo. Anida el somormujo lavanco, y en la zona palustre de los Mareschi
      se instalan el rascón, el carricero, el escribano palustre y la [garza real](/especie/ardea_cinerea/).
      Entre las rapaces hay aguiluchos laguneros, ratoneros y milanos, y entre los mamíferos, corzos, zorros,
      tejones, [ardillas rojas](/especie/sciurus_vulgaris/) y garduñas. En los lagos viven peces autóctonos
      del Piamonte: cavedano, carpa, escardinio, lucio italiano, alborella, tenca, perca y triotto. En los
      arroyos del Lago Piccolo se ha señalado el raro cangrejo de río. En las zonas húmedas hay ranas,
      ranitas, sapos, salamandras y tritones.


      A finales del invierno, los anfibios cruzan la carretera que separa la colina donde pasan el invierno de
      la palude donde se reproducen. En la campaña SOS Anfibi, con ecovoluntarios, se instala un paso para
      dirigirlos hacia subterráneos bajo la calzada, y en la Notte dei Rospi los guardas guían con frontales
      por los caminos junto a los Mareschi para ver sapos, ranas ágiles y especies invasoras.
    visit: >-
      El Anello dei Laghi rodea los dos lagos para descubrir las diferencias entre ambas cubetas; su tiempo
      publicado es de unas seis horas y el gestor lo clasifica como fácil. Para ver aves, las orillas de los
      lagos son el sitio, sobre todo en otoño e invierno. La Notte dei Rospi, en las dos salidas de una
      campaña, reunió a 200 personas, y el gestor no pudo atender todas las solicitudes.


      En el territorio del parque quedan restos de la mayor fábrica de dinamita de Europa, junto a los
      Mareschi, y el castillo de Avigliana, sobre el casco medieval, está dentro del parque natural.
    history: >-
      La fábrica de dinamita se construyó en 1872 por iniciativa de cinco banqueros parisinos y de la Società
      Alfred Nobel de Amburgo, funcionó hasta 1965 y se recuperó en parte como ecomuseo. En la antigua fábrica
      de pinturas Duco-Montecatini trabajó el escritor Primo Levi tras la guerra. El castillo, por su parte,
      fue destruido por el mariscal francés Catinat en 1691.


      Hoy el reto es otro. Entre las especies invasoras de los lagos hay siluro, pez gato punteado y cangrejo
      rojo de Luisiana, y el balance del gestor documenta una reducción efectiva de la biomasa de siluro en
      ambos lagos. Los anfibios, golosos devoradores de larvas de mosquito, están en fuerte declive por el
      cambio climático.
    before: >-
      Hay normas de comportamiento en el parque y una normativa propia para la navegación en los lagos. Las
      salidas de observación de anfibios tienen más demanda que plazas.
    around: A once kilómetros está el [Parque Natural Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/).
  en:
    intro: >-
      Between late winter and early spring, great crested grebes on the lakes of Avigliana perform their
      mirrored courtship dance. Soon after, floating nests appear and parents ferry downy chicks on their
      backs—a wildlife spectacle easily admired from the lakeside paths. All of this takes place barely 20 km
      from Turin, within a regional natural park nestled alongside an urban setting.


      The Lakes of Avigliana lie in the lower Susa Valley, right where alpine foothills meet the western Po
      Plain. The park was established in 1980 to protect both glacial lakes and the Mareschi marshland, with
      core mandates to safeguard this critical wetland and restore the lakes’ limnological balance.
    landscape: >-
      The lakes were formed during the retreat of Pleistocene glaciers that occupied the valley between
      750,000 and 10,000 years ago, representing classic intramorainic hollows. Glacial pulses originally
      carved four distinct basins, though two eventually filled with sediments eroded from surrounding hills.
      Two contrasting lakes remain today. Lago Piccolo, covering 60 hectares at 356 metres above sea level,
      discharges into Lago Grande, which covers 90 hectares at 352 metres. Lago Piccolo remains in a pristine,
      semi-natural state, hemmed in by woods, meadows, and an unbroken belt of reeds that provides crucial
      spawning and nesting habitat for regional fish and waterfowl.


      At the northern edge lies the Mareschi marsh, through which water drains towards the Dora
      Riparia—forming the westernmost surviving peatland in Italy. Wooded morainic hills complete the
      topography. The western slopes above Lago Piccolo are damp and cool, shaded by coppiced oak, sweet
      chestnut, hornbeam, and ash. The northern slopes flanking Lago Grande are drier, dominated by
      thermophilous downy oak, black locust, elm, and wild cherry, scattered with massive glacial erratics
      left by retreating ice sheets.
    wildlife: >-
      The park comes into its own during autumn and winter. Hundreds of diving ducks and wildfowl, including
      [common pochards](/especie/aythya_ferina/), tufted ducks, Eurasian teals, Eurasian wigeons, common
      moorhens, and northern shovelers, congregate on open water, making the reserve an indispensable
      wintering haven. Among the 54 documented bird species, 13 are protected under the European Birds
      Directive.


      Spring brings a shift in ecological focus. Great crested grebes nest along the reeds, while water rails,
      reed warblers, reed buntings, and [grey herons](/especie/ardea_cinerea/) establish breeding territories
      in the Mareschi marsh. Raptors quartering the basin include western marsh harriers, common buzzards, and
      black kites, alongside roe deer, red foxes, European badgers, [red
      squirrels](/especie/sciurus_vulgaris/), and stone martens. Indigenous Piedmontese fish thrive in the
      lakes, such as Italian chub, carp, rudd, southern pike, bleak, tench, European perch, and South European
      roach. Streams feeding Lago Piccolo still harbor rare native white-clawed crayfish. Wet pastures support
      vibrant populations of agile frogs, tree frogs, common toads, fire salamanders, and newts.


      In late winter, amphibians migrate across the perimeter road from wooded hills to their breeding ponds
      in the marsh. During the volunteer SOS Anfibi initiative, temporary drift fences guide toads toward
      under-road amphibian tunnels; during the Notte dei Rospi, park rangers lead headlamp-lit night walks
      along the Mareschi to monitor toads, agile frogs, and invasive alien species.
    visit: >-
      The Anello dei Laghi circuit loops around both lakes to highlight their distinct limnological features;
      official park guides estimate a walking time of about six hours on an easy trail. For birdwatching, the
      lakeside footpaths offer prime vantage points, especially during autumn and winter. The guided amphibian
      walks during the Notte dei Rospi attracted 200 participants across two nocturnal sessions, exceeding
      available ranger capacity.


      Within park boundaries stand the brick remains of what was once Europe’s largest dynamite manufactory,
      situated beside the Mareschi, while medieval Avigliana Castle perches high above the historic core
      overlooking the nature reserve.
    history: >-
      The Nobel dynamite manufactory was founded in 1872 by a consortium of five Parisian financiers and
      Alfred Nobel’s Hamburg company; it operated until 1965 and parts of the industrial site now form an
      eco-museum. At the adjacent Duco-Montecatini chemical paint works, chemist and writer Primo Levi worked
      following his return after the war. The hilltop fortress, meanwhile, was blown up by French Marshal
      Catinat back in 1691.


      Modern ecological challenges centre on invasive species. The waters contain introduced wels catfish,
      channel catfish, and red swamp crayfish, though systematic trapping has achieved documented reductions
      in catfish biomass across both basins. Native amphibians, important predators of mosquito larvae, face
      ongoing stress from climate fluctuations.
    before: >-
      Visitors must abide by park environmental regulations and municipal ordinances governing non-motorised
      navigation on the lakes. Guided nocturnal amphibian walks fill up rapidly and require advance booking.
    around: Eleven kilometres away lies [Orsiera-Rocciavrè Natural Park](/lugar/parco-naturale-orsiera-rocciavre/).
  fr:
    intro: >-
      Entre la fin de l’hiver et le début du printemps, les grèbes huppés des lacs d’Avigliana exécutent leur
      parade nuptiale face à face, la danse du miroir. Viennent ensuite les nids flottants puis les poussins
      juchés sur le dos des parents, spectacle aisé à observer depuis les berges. La scène se déroule à un peu
      plus de 20 km de Turin, au cœur d’un parc naturel enchâssé dans un environnement périurbain.


      Les lacs d’Avigliana occupent la basse vallée de Suse, au débouché de la plaine du Pô. Le parc a été
      créé en 1980 pour préserver deux lacs glaciaires et le marais des Mareschi, afin de protéger cette zone
      humide et de restaurer l’équilibre trophique des plans d’eau.
    landscape: >-
      Les lacs sont nés du retrait des glaciers pléistocènes qui occupaient la vallée entre 750 000 et 10 000
      ans avant notre ère : ce sont des cuvettes intramorainiques typiques. Les glaciations successives
      avaient creusé quatre bassins, mais deux d’entre eux ont été comblés par les alluvions des collines.
      Subsistent deux lacs très contrastés. Le Lago Piccolo, de 60 hectares et 356 mètres d’altitude, s’écoule
      dans le Lago Grande, qui couvre 90 hectares à 352 mètres. Le Lago Piccolo est le plus sauvage : il est
      ceinturé de boisements, de prairies et d’une bande continue de roseaux servant de frayère et de refuge
      aviaire.


      À l’extrémité septentrionale s’étend le marais des Mareschi, exutoire des lacs vers la Doire Ripaire et
      zone marécageuse la plus occidentale d’Italie. Les reliefs morainiques complètent l’ensemble. Les
      collines à l’ouest du Lago Piccolo sont fraîches, couvertes d’un taillis de chênes, châtaigniers,
      charmes et frênes. Celles au nord du Lago Grande sont plus sèches, colonisées par le chêne pubescent, le
      robinier, l’orme et le merisier, parsemées de blocs erratiques déposés par les anciens glaciers.
    wildlife: >-
      C’est un parc de prédilection en automne et en hiver. Des centaines de canards plongeurs et d’oiseaux
      d’eau, tels le [fuligule milouin](/especie/aythya_ferina/), le fuligule morillon, la sarcelle d’hiver,
      le canard siffleur, la poule d’eau et le canard souchet, hivernent sur les lacs, conférant au site un
      rôle d’hivernage primordial. Sur les 54 espèces d’oiseaux recensées, 13 figurent aux annexes de la
      directive Oiseaux de l’Union européenne.


      Au printemps, le décor change. Le grèbe huppé niche en nombre, tandis que le râle d’eau, la rousserolle
      effarvatte, le bruant des roseaux et le [héron cendré](/especie/ardea_cinerea/) s’installent dans les
      Mareschi. Parmi les rapaces patrouillent le busard des roseaux, la buse variable et le milan noir ; les
      bois abritent chevreuils, renards, blaireaux, [écureuils roux](/especie/sciurus_vulgaris/) et fouines.
      Les eaux hébergent des poissons autochtones du Piémont : chevesne, carpe, rotengle, brochet italien,
      ablette, tanche, perche commune et triotto. Dans les ruisseaux du Lago Piccolo survit la rare écrevisse
      à pattes blanches. Les fossés regorgent de grenouilles rousses, rainettes, crapauds, salamandres et
      tritons.


      À la fin de l’hiver, les amphibiens franchissent la route entre la colline d’hivernage et le marais de
      ponte. L’opération bénévole SOS Anfibi installe des filets pour les canaliser vers des crapauducs
      souterrains ; lors de la Notte dei Rospi, les gardes guident le public à la lampe frontale pour observer
      crapauds communs, grenouilles agiles et espèces introduites.
    visit: >-
      L’Anello dei Laghi fait le tour des deux plans d’eau pour apprécier les particularités de chaque bassin
      ; sa durée indicative est d’environ six heures sur un sentier facile. Pour l’ornithologie, les berges
      sont idéales en automne et en hiver. Les sorties nocturnes de la Notte dei Rospi ont réuni 200
      participants sur deux sessions, affichant complet.


      Le territoire du parc abrite les vestiges de la plus grande usine de dynamite d’Europe, près des
      Mareschi, tandis que le château médiéval d’Avigliana domine le bourg historique au sein du parc.
    history: >-
      La fabrique d’explosifs Nobel fut édifiée en 1872 sous l’impulsion de cinq banquiers parisiens et de la
      société d’Alfred Nobel à Hambourg ; elle cessa son activité en 1965 et a été réhabilitée en partie en
      écomusée. Dans l’usine chimique voisine Duco-Montecatini travailla l’écrivain Primo Levi après la
      guerre. La forteresse médiévale fut quant à elle rasée par le maréchal français Catinat en 1691.


      Les enjeux contemporains portent sur les espèces invasives : le silure glane, la barbue d’Amérique et
      l’écrevisse de Louisiane colonisent les eaux, bien que les campagnes de piégeage réduisent efficacement
      la biomasse de silure. Les amphibiens indigènes régressent face aux sécheresses.
    before: >-
      Respectez la réglementation environnementale du parc ainsi que les consignes relatives à la navigation
      sans moteur sur les lacs. Les animations nocturnes d’observation des amphibiens nécessitent une
      réservation préalable.
    around: >-
      À onze kilomètres se trouve le [parc naturel
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/).
  de:
    intro: >-
      Zwischen Spätwinter und Frühlingsbeginn führen die Haubentaucher auf den Seen von Avigliana ihren
      Spiegeltanz auf. Bald darauf folgen schwimmende Nester und Dunenküken, die auf dem Rücken der Eltern
      mitreisen—ein Naturschauspiel, das sich bequem vom Uferweg aus beobachten lässt. Dies geschieht kaum 20
      km von Turin entfernt in einem Naturpark, der direkt an städtischen Raum grenzt.


      Die Seen von Avigliana liegen im unteren Susatal am Übergang zur Poebene. Der Park wurde 1980
      eingerichtet, um zwei Gletscherseen und das Feuchtgebiet Mareschi zu sichern, mit dem Ziel, die
      Verlandungszonen zu bewahren und das Gewässergleichgewicht wiederherzustellen.
    landscape: >-
      Die Seen entstanden beim Rückzug der eiszeitlichen Talgletscher vor 750.000 bis 10.000 Jahren als
      typische Zungenbecken im Moränenampel. Ursprünglich schnitten die Vergletscherungen vier Becken ein, von
      denen zwei durch Hangschutt verlandeten. Zwei grundverschiedene Gewässer blieben übrig: Der 60 Hektar
      große Lago Piccolo auf 356 Metern Meereshöhe speist den 90 Hektar großen Lago Grande auf 352 Metern. Der
      Lago Piccolo hat seinen naturnahen Charakter bewahrt: Er wird von Wäldern, Wiesen und einem dichten
      Schilfgürtel gesäumt, der Fischen und Wasservögeln unverzichtbare Rückzugsräume bietet.


      Am Nordrand breitet sich das Moor Mareschi aus, durch das die Seen zur Dora Riparia entwässern—das
      westlichste Torfmoorgebiet Italiens. Moränenhügel rahmen die Becken ein. Die Hänge westlich des Lago
      Piccolo sind feuchter und tragen Eichen-, Edelkastanien-, Hainbuchen- und Eschenwald. Die Kuppen
      nördlich des Lago Grande sind trockener und wärmer, bestanden mit Flaumeichen, Robinien, Ulmen und
      Vogelkirschen, übersät mit riesigen Findlingen aus der Eiszeit.
    wildlife: >-
      Im Herbst und Winter entfaltet der Park seine ornithologische Bedeutung. Hunderte Wasservögel wie
      [Tafelente](/especie/aythya_ferina/), Reiherente, Krickente, Pfeifente, Teichhuhn und Löffelente rasten
      auf den freien Wasserflächen. Unter den 54 nachgewiesenen Vogelarten sind 13 in den Anhängen der
      EU-Vogelschutzrichtlinie gelistet.


      Im Frühling beleben Brutvögel das Schilf: Haubentaucher nisten, während in den Mareschi Wasserralle,
      Teichrohrsänger, Rohrammer und [Graureiher](/especie/ardea_cinerea/) heimisch sind. Zu den Greifvögeln
      zählen Rohrweihe, Mäusebussard und Schwarzmilan; in den Wäldern leben Rehe, Rotfüchse, Dachse,
      [Eichhörnchen](/especie/sciurus_vulgaris/) und Steinmarder. Die Seen beherbergen einheimische Fischarten
      des Piemont wie Döbel, Karpfen, Rotfeder, Italienischen Hecht, Ukelei, Schleie, Flussbarsch und Triotto.
      In Zuflüssen des Lago Piccolo überdauert der seltene Steinkrebs. In Gräben laichen Springfrösche,
      Laubfrösche, Erdkröten, Feuersalamander und Molche.


      Im Spätwinter queren Amphibien die Uferstraße vom Winterquartier im Hangwald zum Laichgewässer im Moor.
      Beim Projekt SOS Anfibi leiten Ehrenamtliche Erdkröten durch Schutzzäune in Krötentunnel unter der
      Straße; bei der Notte dei Rospi führen Ranger Nachtexkursionen entlang der Mareschi durch.
    visit: >-
      Der Rundweg Anello dei Laghi umrundet beide Seen und erschließt ihre landschaftlichen Unterschiede; die
      Gehzeit beträgt rund sechs Stunden auf leichten Wegen. Für Vogelbeobachter sind die Uferwege im Herbst
      und Winter ideal. Die abendlichen Amphibienführungen der Notte dei Rospi zählten 200 Teilnehmer bei zwei
      Terminen und waren restlos ausgebucht.


      Im Parkareal liegen neben den Mareschi die Backsteinruinen der einst größten Dynamitfabrik Europas,
      während die Burgruine von Avigliana auf einem Hügel über der Altstadt innerhalb des Naturparks thront.
    history: >-
      Die Dynamitfabrik Nobel entstand 1872 auf Initiative von fünf Pariser Finanziers und der Hamburger
      Nobel-Gesellschaft; sie produzierte bis 1965 und ist heute in Teilen ein Freilichtmuseum. Im
      benachbarten Lackwerk Duco-Montecatini arbeitete nach dem Krieg der Schriftsteller Primo Levi. Die
      Festung Avigliana wurde 1691 durch den französischen Marschall Catinat geschleift.


      Aktuell bereiten invasive Arten Sorgen: Wels, Getüpfelter Gabelwels und Roter Amerikanischer Sumpfkrebs
      breiten sich aus, wenngleich gezielte Fänge die Welsbiomasse spürbar senken konnten. Die
      Amphibienbestände leiden unter sommerlichen Trockenperioden.
    before: >-
      Im Park gelten strikte Naturschutzregeln sowie Vorschriften für den motorlosen Wassersport auf den Seen.
      Für geführte Amphibienexkursionen ist eine frühzeitige Anmeldung erforderlich.
    around: >-
      Elf Kilometer entfernt liegt der [Naturpark
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/).
  it:
    intro: >-
      Tra la fine dell’inverno e l’inizio della primavera, gli svassi maggiori dei laghi di Avigliana mettono
      in scena la loro parata nuziale, la suggestiva danza dello specchio. Seguono i nidi galleggianti e poi i
      piccoli trasportati sul dorso dei genitori, spettacolo facilmente osservabile dai sentieri lungolago.
      Tutto questo si svolge a poco più di 20 km da Torino, in un parco naturale incastonato in una cornice
      periurbana.


      I Laghi di Avigliana si trovano nella bassa valle di Susa, allo sbocco verso la pianura torinese. Il
      parco è stato istituito nel 1980 per tutelare i due specchi lacustri e la palude dei Mareschi, con
      l’obiettivo di salvaguardare la zona umida e recuperare l’equilibrio idrobiologico dei bacini.
    landscape: >-
      I laghi si formarono con il ritiro dei ghiacciai pleistocenici che occupavano la valle tra 750.000 e
      10.000 anni fa, costituendo tipiche conche intramoreniche. Le fasi glaciali scavarono originariamente
      quattro bacini, ma due vennero colmati dalle alluvioni collinari. Rimangono due laghi dalle
      caratteristiche assai diverse. Il Lago Piccolo, con 60 ettari a 356 metri di altitudine, sversa le
      proprie acque nel Lago Grande, che copre 90 ettari a 352 metri. Il Lago Piccolo è il più integro: è
      circondato da boschi, prati e da una fascia continua di canneto che offre rifugio a pesci e uccelli
      acquatici.


      All’estremità settentrionale si apre la palude dei Mareschi, via d’uscita delle acque verso la Dora
      Riparia e biotopo palustre più occidentale d’Italia. I rilievi morenici completano il paesaggio. I colli
      a ovest del Lago Piccolo sono umidi e freschi, popolati da querce, castagni, carpini e frassini. Quelli
      a nord del Lago Grande sono più aridi e soleggiati, con roverelle, robinie, olmi e ciliegi selvatici,
      costellati da imponenti massi erratici lasciati dalle glaciazioni.
    wildlife: >-
      È un parco che esprime il massimo valore in autunno e in inverno. Centinaia di anatre tuffatrici e
      uccelli acquatici come il [moriglione](/especie/aythya_ferina/), la moretta, l’alzavola, il fischione,
      la gallinella d’acqua e il mestolone svernano sui bacini, conferendo all’area un ruolo chiave per
      l’avifauna svernante. Delle 54 specie di uccelli censite, 13 sono incluse negli allegati della Direttiva
      Uccelli europea.


      In primavera il quadro si rinnova. Nidifica lo svasso maggiore, mentre nei Mareschi si stabiliscono
      porciglioni, cannareccioni, migliarini di palude e [l’airone cenerino](/especie/ardea_cinerea/). Tra i
      rapaci compaiono il falco di palude, la poiana e il nibbio bruno; nei boschi dimorano caprioli, volpi,
      tassi, [scoiattoli rossi](/especie/sciurus_vulgaris/) e faine. I laghi ospitano pesci autoctoni
      piemontesi: cavedano, carpa, scardola, luccio italico, alborella, tinca, pesce persico e triotto. Negli
      immissari del Lago Piccolo sopravvive il raro gambero di fiume autoctono. Nelle zone acquitrinose
      pullulano rane rosse, raganelle, rospi, salamandre e tritoni.


      A fine inverno gli anfibi attraversano la provinciale dalla collina di svernamento alla palude di
      riproduzione. Con il progetto ecovolontario SOS Anfibi vengono posate barriere per convogliare i rospi
      nei sottopassi stradali; durante la Notte dei Rospi i guardaparco guidano escursioni serali con torce
      per censire rospi comuni, rane agili e specie alloctone.
    visit: >-
      L’Anello dei Laghi costeggia entrambi i bacini per apprezzarne le differenti caratteristiche ecologiche;
      il tempo di percorrenza stimato è di circa sei ore su sentieri facili. Per il birdwatching i percorsi
      rivieraschi sono ideali in autunno e inverno. Le uscite serali della Notte dei Rospi hanno registrato
      200 presenze in due appuntamenti, esaurendo i posti disponibili.


      All’interno dell’area protetta sorgono i resti del più grande dinamitificio d’Europa, presso i Mareschi,
      mentre il castello medievale di Avigliana domina il borgo storico compreso nel parco.
    history: >-
      Il dinamitificio Nobel fu fondato nel 1872 da cinque banchieri parigini e dalla Società Alfred Nobel di
      Amburgo; rimase attivo fino al 1965 ed è stato in parte riconvertito in ecomuseo. Nello stabilimento
      chimico Duco-Montecatini lavorò nel dopoguerra lo scrittore e chimico Primo Levi. Il castello medievale
      fu invece smantellato dal maresciallo francese Catinat nel 1691.


      Le minacce odierne riguardano le specie esotiche invasive: siluro, pesce gatto punteggiato e gambero
      rosso della Louisiana colonizzano le acque, benché le catture selettive abbiano ridotto la biomassa di
      siluri in entrambi i laghi. Gli anfibi autoctoni risentono dei periodi di siccità.
    before: >-
      Rispetta il regolamento ambientale del parco e le norme che disciplinano la navigazione a remi o a vela
      sui laghi. Le visite guidate notturne per gli anfibi richiedono la prenotazione.
    around: >-
      A undici chilometri si trova il [Parco Naturale
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/).
  pt:
    intro: >-
      Entre o final do inverno e o início da primavera, os mergulhões-de-crista dos lagos de Avigliana exibem
      a sua parada nupcial, a conhecida dança do espelho. Seguem-se os ninhos flutuantes e os pequenos
      transportados no dorso dos progenitores, espetáculo facilmente avistado a partir das margens. Tudo
      acontece a pouco mais de 20 km de Turim, num parque natural integrado numa envolvente periurbana.


      Os Lagos de Avigliana situam-se no baixo vale de Susa, no limite com a planície de Turim. O parque foi
      criado em 1980 para proteger dois lagos glaciares e o sapal dos Mareschi, visando salvaguardar esta zona
      húmida e recuperar as condições ecológicas dos planos de água.
    landscape: >-
      Os lagos formaram-se com o recuo dos glaciares pleistocénicos que preenchiam o vale há entre 750.000 e
      10.000 anos, constituindo bacias intramorénicas características. As glaciações originaram inicialmente
      quatro bacias, mas duas acabaram colmatadas pelos sedimentos colinares. Restam dois lagos com
      caraterísticas muito distintas. O Lago Piccolo, com 60 hectares a 356 metros de altitude, desagua no
      Lago Grande, que abrange 90 hectares a 352 metros. O Lago Piccolo é o mais bem conservado: está rodeado
      de arvoredo, prados e um cinturão de caniçal que serve de abrigo a peixes e aves aquáticas.


      No extremo norte estende-se o sapal dos Mareschi, zona de escoamento para o rio Dora Riparia e o paul
      mais ocidental de Itália. As colinas morénicas completam o cenário. As vertentes a oeste do Lago Piccolo
      são frescas e húmidas, com carvalhos, castanheiros, cárpinos e freixos. As colinas a norte do Lago
      Grande são mais quentes e secas, povoadas por carvalhos-brancos, robínias, olmos e cerejeiras-bravas,
      com grandes blocos erráticos trazidos pelas geleiras.
    wildlife: >-
      É um parque com grande destaque no outono e no inverno. Centenas de patos mergulhadores e aves aquáticas
      como o [tarrango-comum](/especie/aythya_ferina/), o zarro-negrinha, o marreco-comum, a piadeira, a
      galinha-d’água e o pato-trombeteiro procuram os lagos nestas estações. Das 54 espécies de aves
      recenseadas, 13 constam dos anexos da Diretiva Aves da União Europeia.


      Na primavera o protagonismo muda. O mergulhão-de-crista nidifica ativamente, enquanto nos Mareschi se
      instalam o frango-d’água, o rouxinol-pequeno-dos-caniços, a escrevedeira-dos-caniços e a
      [garça-real](/especie/ardea_cinerea/). Entre as rapinas figuram o tartaranhão-dos-pauis, a
      águia-d’asa-redonda e o milhafre-preto; nos bosques habitam corços, raposas, texugos,
      [esquilos-vermelhos](/especie/sciurus_vulgaris/) e fuinhas. Os lagos sustentam peixes autóctones do
      Piemonte como o escalo-italiano, a carpa, a pardelha, o lúcio-itálico, o ablete, a tenca, a perca e o
      triotto. Nos ribeiros do Lago Piccolo subsiste o raro lagostim-de-patas-brancas. Nos charcos abundam
      rãs, rela, sapos, salamandras e tritões.


      No final do inverno, os anfíbios atravessam a estrada entre as colinas de invernação e a zona húmida de
      reprodução. Na campanha voluntária SOS Anfibi colocam-se barreiras para encaminhar os sapos para túneis
      sob o asfalto; na Notte dei Rospi os guardas orientam percursos noturnos para observar sapos-comuns,
      rãs-ágeis e espécies exóticas.
    visit: >-
      O percurso pedestre Anello dei Laghi contorna ambos os lagos para revelar os contrastes entre as duas
      bacias; o tempo previsto é de cerca de seis horas em trilho fácil. Para observação de aves, as margens
      constituem o local ideal no outono e inverno. As saídas noturnas da Notte dei Rospi acolheram 200
      pessoas em duas sessões, esgotando a lotação disponível.


      No perímetro protegido subsistem as ruínas da maior fábrica de dinamite da Europa, junto aos Mareschi, e
      o castelo medieval de Avigliana ergue-se numa colina dentro do parque natural.
    history: >-
      A fábrica de dinamite Nobel foi fundada em 1872 por iniciativa de cinco financeiros parisienses e da
      sociedade Alfred Nobel de Hamburgo; laborou até 1965 e parte das instalações acolhe hoje um ecomuseu. Na
      fábrica química contígua Duco-Montecatini trabalhou o escritor Primo Levi após a guerra. Já o castelo
      medieval foi destruído pelo marechal francês Catinat em 1691.


      Os desafios atuais prendem-se com espécies invasoras: o peixe-gato-europeu, o peixe-gato-pontuado e o
      lagostim-vermelho-do-louisiana colonizam as águas, embora capturas orientadas tenham reduzido a biomassa
      do peixe-gato. As secas afetam as populações de anfíbios.
    before: >-
      Segue as normas de proteção do parque e os regulamentos para a navegação sem motor nos lagos. As saídas
      noturnas de observação de anfíbios exigem marcação atempada.
    around: >-
      A onze quilómetros situa-se o [Parque Natural
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/).
