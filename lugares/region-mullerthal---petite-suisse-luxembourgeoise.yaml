resumen:
  es: >-
    Bosques de larga continuidad histórica y relieves de arenisca en la ZEC del Ernz Negro, Beaufort y
    Berdorf.
  en: >-
    Ancient continuous woodlands and sculpted sandstone relief within the Black Ernz, Beaufort and Berdorf
    SAC.
  fr: >-
    Forêts anciennes et reliefs de grès sculptés dans la ZSC de la Vallée de l'Ernz noire, Beaufort et
    Berdorf.
  de: Altwaldgebiete und zerklüftete Sandsteinformationen im FFH-Gebiet Schwarze Ernz, Beaufort und Berdorf.
  it: >-
    Foreste a continuità storica e formazioni arenacee nella ZSC della Valle dell'Ernz Nera, Beaufort e
    Berdorf.
  pt: Florestas de continuidade secular e relevos de arenito na ZEC do Vale do Ernz Negro, Beaufort e Berdorf.
unico:
  es: >-
    Aquí viven los únicos rodales relictos de pino silvestre autóctono de Luxemburgo, sobre una arenisca
    tallada en gargantas y pasos estrechos.
  en: >-
    Home to Luxembourg's only relict stands of native Scots pine, clinging to sandstone sculpted into gorges
    and narrow slot passes.
  fr: >-
    Ici survivent les seuls peuplements reliques de pin sylvestre autochtone du Luxembourg, accrochés à un
    grès taillé en gorges et défilés étroits.
  de: >-
    Hier wachsen die einzigen autochthonen Waldkiefern-Relikte Luxemburgs auf Sandsteinfelsen, die von engen
    Schluchten und Felsenlabyrinthen durchzogen sind.
  it: >-
    Qui allignano gli unici popolamenti relitti di pino silvestre autoctono del Lussemburgo, abbarbicati su
    arenarie intagliate in gole e fessure.
  pt: >-
    Aqui vivem os únicos núcleos relíquia de pinheiro-silvestre autóctone do Luxemburgo, fixados em arenitos
    esculpidos em gargantas e corredores estreitos.
observaciones:
  es: >-
    La regulación de escalada y accesos en Wanterbaach (Berdorf) está fijada por el municipio: consúltala
    antes de ir. Y mira el folleto del sendero Wanterbaach–Siweschloeff.
texto:
  es:
    intro: >-
      Hace unos 245 millones de años, aquí había un mar. Granos de arena se fueron depositando en el fondo y
      acabaron solidificándose en roca; luego el mar se retiró y los ríos hicieron el resto. Lo que hoy se ve
      es una región de rocas imponentes, valles hondos y mesetas extensas, donde la arenisca de Luxemburgo
      manda en el paisaje. Es el Mëllerdall, el «valle de los molineros», que debe el nombre a los muchos
      molinos de sus ríos y arroyos, y al que se conoce como la «pequeña Suiza» de Luxemburgo. Esta guía se
      centra en el espacio Natura 2000 de la Vallée de l'Ernz noire, Beaufort y Berdorf, en el corazón de la
      región.
    landscape: >-
      La arenisca de Luxemburgo da forma al relieve. El valle de los arroyos Haupeschbaach y Halerbaach, cerca
      de Beaufort y Haller, está excavado en ella y muestra las formas típicas de esos valles. Otras rocas
      cuentan otras historias. En Gefale Leeën, «las piedras caídas», el paisaje es el resultado de un enorme
      desprendimiento en dolomías del Triásico medio. Las rocas de Noumerleeën marcan el límite de la
      extensión de la arenisca de Luxemburgo en el geoparque. En el Schéissendëmpel, con su puente de piedra,
      el agua del Ernz negro baja sobre grandes bloques que la corriente no puede arrastrar. Y una mardel, una
      pequeña depresión al menos temporalmente llena de agua, es típica de la disolución de lentes de yeso o
      de calizas.


      Los bosques de larga continuidad histórica cubren buena parte del espacio. El 42% de la región son áreas
      Natura 2000, con grandes bosques, una flora única de helechos y musgos y reservas forestales naturales.
      Los manantiales de toba calcárea son hábitats raros, protegidos en toda la UE por la Directiva Hábitats,
      con especies especializadas. Y en los prados con frutales tradicionales, los «bongerten», se conservan
      cientos de variedades de fruta.
    wildlife: >-
      El [gato montés](/especie/felis_silvestris/) es la especie con nombre propio de esta zona. Aquí la vida
      salvaje se descubre por el hábitat más que por un animal concreto: los bosques de larga continuidad, las
      aguas limpias del Ernz negro, cuya calidad hidromorfológica la ZEC exige mantener o restaurar, y los
      manantiales de toba. Y el calendario es sencillo: el Mullerthal Trail se puede recorrer durante todo el
      año.
    visit: >-
      La columna vertebral es el Mullerthal Trail, de 112 km, que recorre el corazón de la región por bosques,
      paisajes abiertos y valles, entre formaciones de arenisca, pasos estrechos y gargantas. Está certificado
      como «Leading Quality Trail – Best of Europe» por la Asociación Europea de Senderismo y se divide en
      tres rutas de 36, 38 y 38 km. Entre los hitos hay formaciones con nombres difíciles, como Piteschkummer,
      Geierslee o Huel Lee. La ExtraTour B del Mullerthal Trail tiene una duración publicada de tres horas y
      cuarenta y cinco minutos, y la ExtraTour A, de seis horas y cincuenta minutos.


      Para un paseo concreto en Berdorf, el sendero Wanterbaach–Siweschloeff muestra formaciones rocosas de
      arenisca. Parte cerca del camping de Berdorf y la administración lo clasifica como difícil; la
      Administración de Naturaleza y Bosques publica un folleto del recorrido. En bicicleta, algunos carriles
      bici, sobre todo los del Sûre, siguen antiguas líneas de ferrocarril y son aptos para familias.


      Antes de ir a las rutas, la Geo-Expo, en Beaufort, explica la formación del subsuelo geológico como
      fondo marino y el uso humano de los recursos naturales desde la Edad de Piedra. Los lugares geológicos
      destacados llevan en los postes de los senderos el letrero «GEO TOP».
    history: >-
      El 13 de abril de 2022, la UNESCO anunció que el Natur- & Geopark Mëllerdall entraba en la red de
      Geoparques Mundiales. Un Natur- & Geopark, sin embargo, no es un área protegida ni debe confundirse con
      un parque nacional: la protección de este espacio viene de Natura 2000. Con la región alemana de
      Felsenland Südeifel, la región ha creado el «NaturWanderPark Delux», con cuatro rutas transfronterizas.
    before: >-
      La regulación de escalada y accesos en Wanterbaach (Berdorf) está fijada por el municipio: consúltala
      antes de ir. Y mira el folleto del sendero Wanterbaach–Siweschloeff.
    around: >-
      El [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) queda a unos 6 km, y a unos veintitrés, el
      [Naturpark Öewersauer - Haute-Sûre Forests](/lugar/naturpark-oewersauer---haute-sure-forests/).
  en:
    intro: >-
      Some 245 million years ago, a shallow sea covered this region. Grains of sand settled on the seabed and
      gradually consolidated into stone; the sea then receded and rivers sculpted the rest. What meets the eye
      today is a landscape of monumental rock formations, deep wooded valleys and broad plateaus dominated by
      Luxembourg Sandstone. This is the Mëllerdall, the «valley of millers», named for the many watermills
      along its streams, popularly known as Luxembourg's «Little Switzerland». This guide focuses on the
      Natura 2000 Special Area of Conservation of the Black Ernz Valley, Beaufort and Berdorf, in the heart of
      the region.
    landscape: >-
      Luxembourg Sandstone dictates the relief. The valley of the Haupeschbaach and Halerbaach brooks, near
      Beaufort and Haller, is incised into this rock, displaying the characteristic landforms of these
      ravines. Other rocks tell different tales: at Gefale Leeën («the fallen stones»), the chaotic landscape
      resulted from a massive rockfall in Middle Triassic dolomites. The Noumerleeën rocks mark the outer
      limit of Luxembourg Sandstone in the geoparque. At the Schéissendëmpel waterfall, with its picturesque
      stone bridge, the waters of the Black Ernz cascade over giant boulders the current cannot shift. Small
      depressions known as *mardelles*, seasonally holding water, formed through the dissolution of underlying
      gypsum or limestone lenses.


      Ancient continuous forests cover much of the area. Fully 42% of the region lies within Natura 2000
      reserves, sheltering mature woodland, unique ferns and mosses, and strictly protected forest reserves.
      Calcareous tufa springs are rare priority habitats, guarded across the EU by the Habitats Directive and
      hosting specialized flora. In traditional orchard meadows (*bongerten*), hundreds of heirloom fruit
      varieties are preserved.
    wildlife: >-
      The [European wildcat](/especie/felis_silvestris/) is the signature animal of these woods. Yet wildlife
      here is discovered through habitat rather than single sightings: ancient forest continuity, the clean
      waters of the Black Ernz — whose hydromorphological quality the SAC is mandated to maintain or restore —
      and delicate tufa springs. The trail calendar is welcoming: the Mullerthal Trail can be walked in any
      season of the year.
    visit: >-
      The geographic spine is the 112 km Mullerthal Trail, threading through the heart of the region across
      forests, open farmland and river valleys, among weathered sandstone towers, slot passes and narrow
      crevices. Certified as a «Leading Quality Trail – Best of Europe» by the European Ramblers' Association,
      it divides into three stages of 36, 38 and 38 km. Landmark rock formations bear evocative names such as
      Piteschkummer, Geierslee and Huel Lee. ExtraTour B has an official walking time of three hours and
      forty-five minutes, while ExtraTour A requires six hours and fifty minutes.


      For a focused day walk in Berdorf, the Wanterbaach–Siweschloeff trail explores striking sandstone
      labyrinths. Starting near the Berdorf campsite, it is classified as demanding by the forestry
      administration, which publishes an interpretive guide. For cyclists, dedicated trails — notably along
      the Sûre — follow former railway lines and are well suited to family outings.


      Before hiking, the Geo-Expo in Beaufort introduces the geological seabed origin of the bedrock and human
      use of natural stone since the Stone Age. Notable geological sites along the way bear the «GEO TOP»
      marker on trail posts.
    history: >-
      On 13 April 2022, UNESCO announced that the Natur- & Geopark Mëllerdall had officially joined the Global
      Geoparks Network. A Natur- & Geopark, however, is a regional development framework rather than a strict
      nature reserve: core environmental protection here derives from Natura 2000. In partnership with the
      neighbouring German Felsenland Südeifel, the region created the «NaturWanderPark Delux», featuring four
      cross-border hiking loops.
    before: >-
      Climbing regulations and access rules at Wanterbaach (Berdorf) are set by the local municipality: check
      current rules before visiting. Review the trail brochure for the Wanterbaach–Siweschloeff route.
    around: >-
      The [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) lies about 6 km away, and some twenty-three
      kilometres off sits the [Upper Sûre Natural Park - Haute-Sûre
      Forests](/lugar/naturpark-oewersauer---haute-sure-forests/).
  fr:
    intro: >-
      Il y a quelque 245 millions d'années, une mer recouvrait cette contrée. Des grains de sable se sont
      déposés au fond pour former une roche compacte ; la mer s'est retirée et les cours d'eau ont sculpté le
      reste. Ce que l'on contemple aujourd'hui est une région de roches imposantes, de vallons encaissés et de
      vastes plateaux dominés par le Grès de Luxembourg. C'est le Mëllerdall, la « vallée des meuniers »,
      nommée d'après les moulins de ses rivières, communément appelée la « Petite Suisse » luxembourgeoise. Ce
      guide met l'accent sur la zone Natura 2000 de la Vallée de l'Ernz noire, Beaufort et Berdorf, au cœur de
      la région.
    landscape: >-
      Le Grès de Luxembourg façonne le relief. La vallée des ruisseaux Haupeschbaach et Halerbaach, près de
      Beaufort et Haller, est creusée dans cette roche et en illustre la morphologie typique. D'autres pierres
      racontent d'autres histoires : à Gefale Leeën (« les pierres tombées »), le paysage résulte d'un
      éboulement colossal dans les dolomies du Trias moyen. Les rochers de Noumerleeën marquent la limite du
      grès luxembourgeois dans le géoparc. Au Schéissendëmpel, avec son pont de pierre pittoresque, les eaux
      de l'Ernz noire cascadent sur de gros blocs immuables. Des dépressions humides temporaires appelées
      *mardelles* témoignent de la dissolution souterraine de lentilles de gypse ou de calcaire.


      Les forêts anciennes recouvrent une part majeure du territoire. 42% de la région est classée en zones
      Natura 2000, abritant de grands massifs forestiers, une flore remarquable de mousses et de fougères, et
      des réserves forestières intégrales. Les sources pétrifiantes à tuf calcaire sont des habitats rares,
      protégés dans toute l'Union européenne par la directive Habitats. Dans les vergers traditionnels
      (*bongerten*), des centaines de variétés de fruits sont préservées.
    wildlife: >-
      Le [chat sauvage](/especie/felis_silvestris/) est l'espèce emblématique de ce secteur. Ici, la vie
      sauvage se découvre par l'ambiance forestière plus que par un animal isolé : l'ancienneté des
      boisements, les eaux vives de l'Ernz noire dont la ZSC veille à restaurer l'intégrité
      hydromorphologique, et les sources tuffeuses. Le calendrier est universel : le Mullerthal Trail se
      parcourt agréablement en toute saison.
    visit: >-
      La colonne vertébrale est le Mullerthal Trail de 112 km, traversant le cœur du pays entre forêts,
      paysages ouverts et vallons ombragés, au fil de tours de grès et d'étroits couloirs rocheux. Labellisé «
      Leading Quality Trail – Best of Europe » par la Fédération européenne de randonnée, il se décompose en
      trois boucles de 36, 38 et 38 km. Des curiosités aux noms singuliers jalonnent le tracé, tels
      Piteschkummer, Geierslee ou Huel Lee. L'ExtraTour B affiche une durée de marche de trois heures et
      quarante-cinq minutes, tandis que l'ExtraTour A demande six heures et cinquante minutes.


      Pour une excursion ciblée à Berdorf, le sentier Wanterbaach–Siweschloeff explore les dédales de grès.
      Partant près du camping de Berdorf, il est classé difficile par l'administration de la nature et des
      forêts qui en édite le guide. À bicyclette, plusieurs pistes cyclables, notamment le long de la Sûre,
      réutilisent d'anciennes voies ferrées et conviennent aux familles.


      Avant de marcher, la Géo-Expo de Beaufort explique la genèse marine des grès et l'exploitation des
      roches depuis l'âge de la pierre. Les géosites majeurs sont signalés sur les balises par le label « GEO
      TOP ».
    history: >-
      Le 13 avril 2022, l'UNESCO officialisait l'entrée du Natur- & Geopark Mëllerdall au sein du réseau des
      Géoparcs mondiaux. Un Natur- & Geopark ne constitue pas une réserve intégrale : la protection juridique
      de ce territoire provient du réseau Natura 2000. En association avec la région allemande du Felsenland
      Südeifel, la région a conçu le « NaturWanderPark Delux », fort de quatre circuits transfrontaliers.
    before: >-
      La réglementation de l'escalade et des accès à Wanterbaach (Berdorf) relève de la commune :
      informez-vous avant votre visite. Consultez le dépliant officiel du sentier Wanterbaach–Siweschloeff.
    around: >-
      Le [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) se trouve à environ 6 km, et à quelque
      vingt-trois kilomètres s'étend le [Naturpark Öewersauer - Haute-Sûre
      Forests](/lugar/naturpark-oewersauer---haute-sure-forests/).
  de:
    intro: >-
      Vor rund 245 Millionen Jahren erstreckte sich hier ein flaches Meer. Sandkörner lagerten sich am
      Meeresgrund ab und verfestigten sich zu massivem Gestein; das Meer zog sich zurück und Flüsse schufen
      das heutige Relief. Was sich heute darbietet, ist ein Land majestätischer Felsen, tiefer Schluchten und
      weiter Hochebenen, beherrscht vom Luxemburger Sandstein. Dies ist das Mëllerdall («Müllertal»), benannt
      nach den historischen Mühlen an Flüssen und Bächen, weithin bekannt als die «Kleine Luxemburger
      Schweiz». Dieser Führer widmet sich dem Natura 2000-Gebiet Vallée de l'Ernz noire, Beaufort und Berdorf
      im Herzen der Region.
    landscape: >-
      Der Luxemburger Sandstein prägt das Relief. Das Tal der Bäche Haupeschbaach und Halerbaach bei Beaufort
      und Haller schneidet sich tief in den Fels und zeigt typische Erosionsformen. Andere Gesteine erzählen
      eigene Geschichten: Bei Gefale Leeën («Gefallene Steine») entstand die Landschaft durch einen gewaltigen
      Felssturz in Mitteltrias-Dolomiten. Die Felsen von Noumerleeën markieren die Ausdehnungsgrenze des
      Sandsteins im Geopark. Am Schéissendëmpel mit seiner Steinbrücke stürzt die Schwarze Ernz über
      Felsblöcke, die die Strömung nicht fortbewegen kann. Mardellen — flache, periodisch wassergefüllte
      Hohlformen — entstanden durch Subrosion von Gips- oder Kalksteinlinsen.


      Altwaldgebiete von langer Kontinuität bedecken weite Teile. 42% der Region sind als Natura 2000-Gebiete
      ausgewiesen, mit ausgedehnten Laubwäldern, seltenen Moosen und Farnen sowie Naturwaldreservaten.
      Kalktuffquellen bilden seltene Lebensräume von EU-weitem Schutzrang. In den traditionellen
      Streuobstwiesen (*bongerten*) haben Hunderte alter Obstsorten überdauert.
    wildlife: >-
      Die [Wildkatze](/especie/felis_silvestris/) ist das Leitwildtier der Region. Doch das Naturerlebnis
      erschließt sich vor allem über die Lebensräume: naturnahe Buchenwälder, das saubere Wasser der Schwarzen
      Ernz, deren Hydromorphologie die Schutzgebietsverwaltung bewahrt und renaturiert, und seltene
      Tuffquellen. Der Wanderkalender kennt keine Schranken: Der Mullerthal Trail ist das ganze Jahr über
      zugänglich.
    visit: >-
      Das Rückgrat bildet der 112 km lange Mullerthal Trail, der durch dichte Wälder, offene Landschaften und
      schmale Felsspalten führt. Von der Europäischen Wandervereinigung als «Leading Quality Trail – Best of
      Europe» zertifiziert, gliedert er sich in drei Routen von 36, 38 und 38 km Länge. Markante
      Felsformationen tragen Namen wie Piteschkummer, Geierslee oder Huel Lee. Die ExtraTour B erfordert drei
      Stunden und fünfundvierzig Minuten Gehzeit, die ExtraTour A sechs Stunden und fünfzig Minuten.


      Für eine kompakte Wanderung bei Berdorf bietet der Pfad Wanterbaach–Siweschloeff enge Felsenlabyrinthe.
      Er startet nahe dem Campingplatz Berdorf und wird von der Natur- und Forstverwaltung als anspruchsvoll
      eingestuft. Für Radfahrer verlaufen sanfte Radwege, namentlich entlang der Sauer, auf stillgelegten
      Bahntrassen.


      Vor der Tour veranschaulicht die Geo-Expo in Beaufort die Meeresgenese der Sandsteine und die Nutzung
      durch den Menschen seit der Steinzeit. Herausragende Geotope sind an den Wegweisern mit dem Zeichen «GEO
      TOP» versehen.
    history: >-
      Am 13. April 2022 gab die UNESCO bekannt, dass der Natur- & Geopark Mëllerdall in das weltweite
      Geopark-Netzwerk aufgenommen wurde. Ein Natur- & Geopark ist kein Vollnaturschutzgebiet: Der rechtliche
      Biotopschutz erwächst aus dem Netzwerk Natura 2000. Gemeinsam mit dem Felsenland Südeifel schuf die
      Region den «NaturWanderPark Delux» mit vier grenzüberschreitenden Rundwanderwegen.
    before: >-
      Kletterregeln und Zutrittsbedingungen am Wanterbaach (Berdorf) werden von der Gemeinde festgelegt:
      Erkundige dich vorab. Beachte das Faltblatt zum Pfad Wanterbaach–Siweschloeff.
    around: >-
      Der [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) liegt rund 6 km entfernt, und etwa
      dreiundzwanzig Kilometer entfernt liegt der [Naturpark Öewersauer -
      Haute-Sûre-Wälder](/lugar/naturpark-oewersauer---haute-sure-forests/).
  it:
    intro: >-
      Circa 245 milioni di anni fa un mare basso ricopriva questa contrada. Granelli di sabbia si depositarono
      sul fondale cementandosi in roccia; il mare si ritirò e i torrenti modellarono il resto. Ciò che si
      ammira oggi è una regione di formazioni rocciose ardite, valloni incassati e altopiani dominati
      dall'Arenaria del Lussemburgo. È il Mëllerdall, la «valle dei mugnai», così chiamata per i numerosi
      mulini fluviali, nota come la «Piccola Svizzera» lussemburghese. Questa guida si concentra sul sito
      Natura 2000 della Vallée de l'Ernz noire, Beaufort e Berdorf, nel cuore dell'area.
    landscape: >-
      L'Arenaria del Lussemburgo plasma la morfologia. Il vallone dei torrenti Haupeschbaach e Halerbaach,
      presso Beaufort e Haller, è profondamente scavato nella roccia e ne mostra le forme tipiche. Altre rocce
      raccontano vicende diverse: a Gefale Leeën («le pietre cadute») il paesaggio deriva da una gigantesca
      frana nelle dolomie del Triassico medio. Le rupi di Noumerleeën segnano il limite di espansione
      dell'arenaria nel geoparco. Presso la cascata dello Schéissendëmpel, con il ponte in pietra ad arco,
      l'Ernz nera scorre su grossi macigni inamovibili. Piccole depressioni temporaneamente allagate chiamate
      *mardelle* testimoniano la dissoluzione carsica di lenti gessose o calcaree.


      Foreste a lunga continuità storica ammantano gran parte del comprensorio. Il 42% della regione ricade in
      aree Natura 2000, con vaste faggete, una flora singolare di felci e muschi e riserve forestali
      integrali. Le sorgenti pietrificanti con tufi calcarei sono habitat prioritari tutelati in tutta
      l'Unione Europea. Nei frutteti tradizionali (*bongerten*) si tramandano centinaia di varietà frutticole
      antiche.
    wildlife: >-
      Il [gatto selvatico](/especie/felis_silvestris/) è l'animale simbolo di questi boschi. La natura
      selvatica si apprezza negli ambienti intatti più che nei singoli avvistamenti: la continuità biologica
      delle faggete, le acque limpide dell'Ernz nera di cui la ZSC impone il recupero idromorfologico, e le
      delicate sorgenti pietrificanti. Il calendario è privo di limitazioni: il Mullerthal Trail si cammina
      piacevolmente in ogni mese dell'anno.
    visit: >-
      L'itinerario cardine è il Mullerthal Trail di 112 km, che attraversa il cuore della regione fra boschi
      ombrosi, radure e forre d'arenaria. Certificato come «Leading Quality Trail – Best of Europe» dalla
      Federazione Europea Escursionisti, si suddivide in tre anelli di 36, 38 e 38 km. Formazioni curiose
      portano nomi come Piteschkummer, Geierslee o Huel Lee. L'ExtraTour B richiede una camminata di tre ore e
      quarantacinque minuti, mentre l'ExtraTour A copre sei ore e cinquanta minuti.


      Per un'escursione a Berdorf, il sentiero Wanterbaach–Siweschloeff esplora fessure e gole d'arenaria.
      Inizia vicino al campeggio di Berdorf ed è classificato impegnativo dalla forestale lussemburghese. Per
      i cicloturisti, comode piste ciclabili lungo la Sûre ripercorrono vecchi tracciati ferroviari adatti a
      famiglie.


      Prima di partire, la Geo-Expo di Beaufort illustra la formazione sedimentaria marina e l'impiego umano
      della pietra fin dalla preistoria. I geotopi più significativi recano sulle paline il contrassegno «GEO
      TOP».
    history: >-
      Il 13 aprile 2022 l'UNESCO ha decretato l'ingresso del Natur- & Geopark Mëllerdall nella rete dei
      Geoparchi Mondiali. Un Natur- & Geopark non costituisce una riserva integrale: la salvaguardia biologica
      discende dalla rete Natura 2000. Insieme al comprensorio tedesco del Felsenland Südeifel è nato il
      «NaturWanderPark Delux», con quattro percorsi transfrontalieri.
    before: >-
      L'arrampicata e l'accesso alle pareti di Wanterbaach (Berdorf) sono regolati dal comune: verifica le
      norme prima di arrampicare. Consulta l'opuscolo ufficiale del sentiero Wanterbaach–Siweschloeff.
    around: >-
      Il [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) dista circa 6 km, e a circa ventitré
      chilometri si trova il [Naturpark Öewersauer - Haute-Sûre
      Forests](/lugar/naturpark-oewersauer---haute-sure-forests/).
  pt:
    intro: >-
      Há cerca de 245 milhões de anos um mar pouco profundo cobria esta paragem. Grãos de areia foram
      assentando no fundo e consolidaram-se em rocha; o mar recuou e as linhas de água esculpiram o resto. O
      que hoje se contempla é uma região de rochas imponentes, vales profundos e planaltos dominados pelo
      Arenito do Luxemburgo. É o Mëllerdall, o «vale dos moleiros», nome herdado dos moinhos de água das suas
      ribeiras, popularmente aclamado como a «Pequena Suíça» luxemburguesa. Este guia foca-se no espaço Natura
      2000 da Vallée de l'Ernz noire, Beaufort e Berdorf, no coração da região.
    landscape: >-
      O Arenito do Luxemburgo desenha a paisagem. O vale dos ribeiros Haupeschbaach e Halerbaach, próximo de
      Beaufort e Haller, está talhado nesta rocha e reflete as formas típicas de erosão. Outras rochas guardam
      histórias distintas: em Gefale Leeën («as pedras caídas»), o relevo resultou de um grande desabamento em
      dolomitos do Triássico médio. As rochas de Noumerleeën balizam a fronteira do arenito no geoparque. No
      Schéissendëmpel, com a sua ponte de pedra em arco, as águas do Ernz negro despenham-se sobre grandes
      blocos que a corrente não move. Pequenas depressões inundadas sazonalmente, as *mardelles*, resultam da
      dissolução cársica subterrânea de gesso ou calcário.


      Florestas de grande antiguidade cobrem boa parte da área. Cerca de 42% da região integra áreas Natura
      2000, com densos bosques caducifólios, fetos e musgos singulares e reservas florestais integrais. As
      nascentes de tufos calcários são habitats raros, protegidos em toda a UE pela Diretiva Habitats. Nos
      pomares tradicionais (*bongerten*) mantêm-se centenas de variedades antigas de fruteiras.
    wildlife: >-
      O [gato-bravo](/especie/felis_silvestris/) é o animal de maior relevo no ecossistema florestal. Contudo,
      a vida selvagem aprecia-se no conjunto dos seus habitats: as matas seculares, as águas limpas do Ernz
      negro — cuja integridade hidromorfológica a ZEC tem por missão preservar — e as nascentes de tufos
      calcários. A rota não tem época estrita: o Mullerthal Trail pode ser percorrido durante todo o ano.
    visit: >-
      O eixo essencial é o Mullerthal Trail, com 112 km, que atravessa o centro da região por matas densas,
      paisagens abertas e vales fluviais, entre blocos de arenito e passagens estreitas. Distinguido como
      «Leading Quality Trail – Best of Europe» pela Associação Europeia de Caminhantes, articula-se em três
      etapas de 36, 38 e 38 km. Formações rochosas afamadas ostentam nomes como Piteschkummer, Geierslee ou
      Huel Lee. O ExtraTour B regista um tempo oficial de três horas e quarenta e cinco minutos, enquanto o
      ExtraTour A totaliza seis horas e cinquenta minutos.


      Para um percurso em Berdorf, o trilho Wanterbaach–Siweschloeff percorre desfiladeiros de arenito. Tem
      início junto ao parque de campismo de Berdorf e é considerado exigente pelos serviços florestais
      luxemburgueses. Para passeios de bicicleta, ciclovias planas ao longo do rio Sûre aproveitam antigos
      traçados de caminhos de ferro.


      Antes da caminhada, a Geo-Expo de Beaufort expõe a génese sedimentar dos arenitos e o aproveitamento
      humano das rochas desde a Pré-História. Os sítios geológicos de relevo exibem a placa «GEO TOP» nos
      postes sinalizadores.
    history: >-
      A 13 de abril de 2022 a UNESCO oficializou a integração do Natur- & Geopark Mëllerdall na Rede Mundial
      de Geoparques. Um Natur- & Geopark é uma estrutura de dinamização regional: o estatuto de proteção
      ambiental provém da rede Natura 2000. Em cooperação com a região alemã de Felsenland Südeifel, foi
      criado o «NaturWanderPark Delux», integrando quatro rotas transfronteiriças.
    before: >-
      A escalada e os acessos em Wanterbaach (Berdorf) são regulados pelo município: confirma as regras antes
      de partir. Consulta o folheto informativo do trilho Wanterbaach–Siweschloeff.
    around: >-
      O [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) fica a cerca de 6 km, e a uns vinte e três
      quilómetros encontra-se o [Naturpark Öewersauer - Haute-Sûre
      Forests](/lugar/naturpark-oewersauer---haute-sure-forests/).
