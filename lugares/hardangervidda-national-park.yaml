resumen:
  es: >-
    La altiplanicie de alta montaña alpina (*peneplain*) más extensa de Europa (3.400 km²), albergando la
    mayor población de reno salvaje del continente.
  en: >-
    The largest alpine high-mountain plateau (*peneplain*) in Europe (3,400 km²), home to the continent's
    largest wild reindeer population.
  fr: >-
    Le plus vaste haut plateau de montagne alpine (*pénéplaine*) d'Europe (3 400 km²), abritant la plus grande
    population de rennes sauvages du continent.
  de: >-
    Europas größte alpine Hochgebirgshochebene (*Peneplain*) (3.400 km²), Heimat der größten wilden
    Rentierpopulation des Kontinents.
  it: >-
    Il più vasto altopiano alpino d'alta montagna (*peneplain*) d'Europa (3.400 km²), che ospita la maggiore
    popolazione continentale di renne selvatiche.
  pt: >-
    O maior planalto alpino de alta montanha (*peneplanície*) da Europa (3.400 km²), acolhendo a maior
    população de renas selvagens do continente.
unico:
  es: >-
    Hardangervidda es el hábitat más meridional de varias especies árticas, entre ellas el zorro ártico y el
    búho nival.
  en: >-
    Hardangervidda is the southernmost habitat for several Arctic species, including the Arctic fox and the
    snowy owl.
  fr: >-
    Le Hardangervidda est l'habitat le plus méridional de plusieurs espèces arctiques, dont le renard polaire
    et le harfang des neiges.
  de: >-
    Hardangervidda ist der südlichste Lebensraum mehrerer arktischer Arten, darunter der Polarfuchs und die
    Schnee-Eule.
  it: >-
    L'Hardangervidda è l'habitat più meridionale di diverse specie artiche, tra cui la volpe artica e il gufo
    delle nevi.
  pt: >-
    Hardangervidda é o habitat mais meridional de várias espécies árticas, entre as quais a raposa-do-ártico e
    o bufo-real-das-neves.
observaciones:
  es: >-
    Hardangervidda es un lugar sensible. Sigue los senderos marcados y evita pisar musgos, líquenes y plantas
    de montaña. Mantén buena distancia de los animales, sobre todo en la época de parto y cría, y lleva a los
    perros con correa todo el año. Está prohibido arrancar plantas o llevarse objetos culturales del parque.
    Del 15 de abril al 15 de septiembre rige en general la prohibición de encender fuego en el monte noruego.
texto:
  es:
    intro: >-
      Imagina una llanura de montaña tan grande que el horizonte no tiene árboles. Hardangervidda es eso: la
      meseta de montaña más grande de Europa, una penillanura de unos 6.500 km² a una altitud media de 1.100
      m, repartida entre Vestland, Telemark y Buskerud. Su parque nacional, creado por resolución real el 10
      de abril de 1981, es el mayor de la Noruega continental.
    landscape: >-
      Todo empezó con una llanura. En el Mioceno la planicie actual se formó al nivel del mar, y a principios
      del Plioceno se elevó más de mil metros. Después, los glaciares de las glaciaciones fueron desgastando
      las montañas hasta dejar estas colinas ondulantes. Toda la meseta está por encima del límite del bosque,
      con un clima alpino frío todo el año, y su paisaje es de páramo sin árboles, salpicado de charcas,
      lagos, ríos y arroyos. El punto más alto es el Sandfloegga, de 1.721 m, y el pico de Hårteigen, de 1.690
      m, se ve desde buena parte de la meseta.


      El oeste y el este son dos mundos. El oeste es de roca desnuda y el este, más llano y con más
      vegetación; y mientras el oeste es mucho más húmedo y en algunas zonas supera los 1.000 mm anuales, el
      este es más seco. Por eso la flora es más rica en el oeste húmedo que en el este seco. Lo que hoy es
      páramo no siempre lo fue: hace entre nueve mil y cinco mil años, con un clima más cálido, buena parte de
      la meseta estaba poblada de bosque, y aún se conservan troncos de pino en las turberas muy por encima
      del límite actual.
    wildlife: >-
      La clave es el frío del norte llevado muy al sur. El clima alpino permite que haya animales y plantas
      árticos más al sur que en cualquier otro lugar de Europa, y Hardangervidda es el último rincón al sur
      del [zorro ártico](/especie/vulpes_lagopus/) y del [búho nival](/especie/bubo_scandiacus/).


      Y por encima de todos, el [reno salvaje](/especie/rangifer_tarandus/). Los renos se mueven por la meseta
      a lo largo del año: sus pastos de invierno están en el este, donde comen líquenes, y sus zonas de cría
      en el oeste, más fértil. El centro del parque explica que el reno de Hardangervidda tiene la peor
      condición de todos los de Noruega, por unos pastos pobres y demasiadas molestias humanas, y que los
      animales han cambiado poco a poco sus rutas y ya no usan los pastos estacionales de hace unas décadas.


      Los meses más recomendados para ir son julio, agosto y septiembre.
    visit: >-
      La meseta se recorre sobre todo con las cabañas de la Asociación Noruega de Montaña (DNT), que tiene
      muchas en la zona, y es popular ir de cabaña en cabaña en Semana Santa y en verano. Pero también se
      puede disfrutar sin entrar en lo más sensible: los valles y pueblos de los alrededores permiten
      acercarse a la naturaleza sin pisar las zonas núcleo del reno. Rjukan es la puerta de la meseta por el
      este.


      El primer paso es el centro del parque en Skinnarbu, el único centro nacional autorizado por el Estado,
      abierto en 2013. Su exposición interactiva ocupa 600 m² y 22 instalaciones en siete secciones sobre el
      reno, sus rutas de migración y la vida humana en la meseta, y el centro ofrece visitas guiadas, cursos
      de insectos y educación ambiental en los alrededores. Es el mejor sitio para empezar a planear: allí se
      consiguen mapas y datos al día sobre el estado de la meseta.
    history: >-
      La meseta lleva habitada miles de años. Se han hallado cientos de asentamientos nómadas de la Edad de
      Piedra, probablemente ligados a la migración del reno, y hay muchas trampas de caza de alce y de reno de
      épocas pasadas. La Nordmannsslepa, la ruta interior más antigua entre el este y el oeste de Noruega,
      cruza la meseta.


      La conservación depende de las normas. Seis autoridades de protección, tres gobernaciones regionales y
      tres juntas de supervisión son propietarias del proyecto del plan de gestión de las áreas protegidas de
      la meseta.
    before: >-
      Hardangervidda es un lugar sensible. Sigue los senderos marcados y evita pisar musgos, líquenes y
      plantas de montaña. Mantén buena distancia de los animales, sobre todo en la época de parto y cría, y
      lleva a los perros con correa todo el año. Está prohibido arrancar plantas o llevarse objetos culturales
      del parque. Del 15 de abril al 15 de septiembre rige en general la prohibición de encender fuego en el
      monte noruego.
    around: >-
      Lugares lejanos comparten con Hardangervidda el zorro ártico y el reno, y algunos también el búho nival:
      la [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/), la [Reserva Natural de
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/), el [Parque Nacional de la Península de
      Varanger](/lugar/varanger-peninsula-national-park/) y el [Parque Nacional de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/).
  en:
    intro: >-
      Imagine a mountain plain so immense that the horizon is completely devoid of trees. Hardangervidda is
      just that: Europe's largest mountain plateau, a peneplain of around 6,500 km² at an average altitude of
      1,100 m, spread across Vestland, Telemark and Buskerud. Its national park, established by royal decree
      on 10 April 1981, is the largest in mainland Norway.
    landscape: >-
      It all began as a flat plain. In the Miocene, the current peneplain formed at sea level, and in the
      early Pliocene it was uplifted by more than a thousand metres. Later, ice age glaciers wore down the
      mountains, sculpting these rolling hills. The entire plateau lies above the tree line under a cold
      alpine climate year-round, forming a treeless moorland landscape dotted with pools, lakes, rivers and
      streams. The highest point is Sandfloegga at 1,721 m, and the prominent summit of Hårteigen, reaching
      1,690 m, is visible across much of the plateau.


      West and east are two distinct worlds. The western side is dominated by bare rock, while the east is
      flatter and richer in vegetation; while the west is far wetter, exceeding 1,000 mm of annual
      precipitation in places, the east is considerably drier. Consequently, plant life is richer in the humid
      west than in the arid east. What is moorland today was not always so: between nine thousand and five
      thousand years ago, during a warmer climatic era, much of the plateau was covered in forest, and
      preserved pine logs can still be found in peat bogs well above the modern tree line.
    wildlife: >-
      The defining factor is northern cold brought far to the south. The alpine climate enables Arctic fauna
      and flora to thrive further south than anywhere else in Europe, making Hardangervidda the southernmost
      haven for the [Arctic fox](/especie/vulpes_lagopus/) and the [snowy owl](/especie/bubo_scandiacus/).


      Above all stands the [wild reindeer](/especie/rangifer_tarandus/). Reindeer roam the plateau throughout
      the seasons: winter grazing grounds lie in the lichen-rich east, whereas calving areas occupy the more
      fertile west. Park centre specialists note that Hardangervidda reindeer endure the poorest body
      condition in Norway due to degraded pastures and human disturbance, causing herds to gradually alter
      their routes and abandon traditional seasonal pastures from past decades.


      The most recommended months to visit are July, August and September.
    visit: >-
      Exploring the plateau is traditionally done using the mountain huts run by the Norwegian Trekking
      Association (DNT), which maintains an extensive network here; hut-to-hut trekking is especially popular
      during Easter and summer. Yet you can also enjoy the region without venturing into sensitive core zones:
      peripheral valleys and gateway towns let you experience nature without disturbing vital reindeer
      habitats. Rjukan serves as the main eastern gateway.


      Your journey should begin at the park visitor centre in Skinnarbu, the only state-authorised national
      centre, opened in 2013. Its interactive exhibition spans 600 m² and 22 exhibits across seven themed
      sections covering wild reindeer, migration corridors and human history on the plateau. The centre also
      provides guided outings, insect workshops and environmental education programmes. It is the best place
      to plan your route, pick up detailed trail maps and check current mountain conditions.
    history: >-
      Human presence on the plateau dates back thousands of years. Archaeologists have discovered hundreds of
      nomadic Stone Age encampments closely tied to reindeer migrations, alongside numerous ancient pitfalls
      and traps used for hunting reindeer and elk. The Nordmannsslepa, Norway's oldest inland route linking
      east and west, traverses the plateau.


      Conservation relies on clear governance. Six local management authorities, three regional governorships
      and three supervisory boards share responsibility for implementing the protected area management
      framework.
    before: >-
      Hardangervidda is a fragile ecosystem. Always stay on marked trails and avoid trampling mosses, lichens
      and delicate alpine vegetation. Maintain a respectful distance from wildlife, particularly during
      calving and breeding seasons, and keep dogs leashed throughout the year. Picking plants or removing
      cultural relics is strictly prohibited. An open-fire ban applies across Norwegian forests and open land
      between 15 April and 15 September.
    around: >-
      Distant landscapes share with Hardangervidda the Arctic fox and the wild reindeer, and some also the
      snowy owl: the [Vindelfjällen Nature Reserve](/lugar/vindelfjallens-naturreservat/), the [Helagsfjället
      Nature Reserve](/lugar/helagsfjallet-nature-reserve/), the [Varanger Peninsula National
      Park](/lugar/varanger-peninsula-national-park/) and the [Dovrefjell-Sunndalsfjella National
      Park](/lugar/dovrefjell-sunndalsfjella-national-park/).
  fr:
    intro: >-
      Imaginez une immense plaine d'altitude où l'horizon ne laisse entrevoir aucun arbre. Le Hardangervidda
      est précisément cela : le plus vaste plateau de montagne d'Europe, une pénéplaine d'environ 6 500 km² à
      une altitude moyenne de 1 100 m, répartie entre le Vestland, le Telemark et le Buskerud. Son parc
      national, instauré par décret royal le 10 avril 1981, est le plus étendu de Norvège continentale.
    landscape: >-
      Tout a commencé par une vaste plaine. Au Miocène, la surface actuelle s'est formée au niveau de la mer
      avant de s'élever de plus de mille mètres au début du Pliocène. Par la suite, les glaciers des périodes
      glaciaires ont érodé les reliefs jusqu'à façonner ces douces collines ondulées. L'ensemble du plateau
      s'élève au-dessus de la limite des arbres sous un rude climat alpin tout au long de l'année, dessinant
      une lande dépourvue d'arbres ponctuée de mares, de lacs, de rivières et de torrents. Le point culminant
      est le Sandfloegga à 1 721 m, et le mont Hårteigen, haut de 1 690 m, se détache à l'horizon depuis la
      majeure partie du haut plateau.


      L'ouest et l'est forment deux univers contrastés. L'ouest est dominé par la roche nue tandis que l'est
      est plus plat et garni de végétation ; si l'ouest est particulièrement arrosé avec des précipitations
      dépassant 1 000 mm par an, l'est est beaucoup plus sec. La flore se révèle donc plus abondante dans
      l'ouest humide que dans l'est aride. Cette lande actuelle n'a pas toujours existé : il y a entre neuf
      mille et cinq mille ans, lors d'un réchauffement climatique, de larges portions étaient couvertes de
      forêts, et l'on retrouve encore des troncs de pins fossiles dans les tourbières bien au-dessus de la
      limite forestière contemporaine.
    wildlife: >-
      L'originalité du lieu tient à ce froid boréal descendu si loin au sud. Le climat alpin permet à des
      plantes et animaux arctiques de subsister à des latitudes plus méridionales que partout ailleurs en
      Europe, faisant du Hardangervidda l'ultime refuge au sud pour le [renard
      polaire](/especie/vulpes_lagopus/) et le [harfang des neiges](/especie/bubo_scandiacus/).


      Au centre de cet écosystème trône le [renne sauvage](/especie/rangifer_tarandus/). Les troupeaux se
      déplacent sur le plateau au fil des saisons : leurs pâturages d'hiver se trouvent à l'est, où abondent
      les lichens, tandis que les zones de mise bas occupent l'ouest plus nourricier. Le centre du parc
      souligne que les rennes du Hardangervidda présentent l'état corporel le plus vulnérable de Norvège en
      raison de pâturages appauvris et de dérangements humains, poussant les hardes à modifier leurs
      itinéraires historiques et à délaisser certains pâturages séculaires.


      Les mois les plus propices pour une visite s'étendent de juillet à septembre.
    visit: >-
      La traversée du plateau s'effectue principalement grâce au réseau de refuges de l'Association
      norvégienne de randonnée (DNT), particulièrement fréquenté à Pâques et en été. Mais vous pouvez
      également profiter du massif sans pénétrer dans ses secteurs les plus sensibles : les vallées et
      villages périphériques offrent un magnifique contact avec la nature sans piétiner le domaine vital du
      renne. Rjukan constitue la principale porte d'entrée orientale.


      Une halte préalable au centre d'accueil de Skinnarbu, unique centre national agréé par l'État et ouvert
      en 2013, est vivement conseillée. Son exposition interactive s'étend sur 600 m² à travers 22
      installations réparties en sept sections consacrées au renne, à ses routes migratoires et aux traditions
      humaines du plateau. Le centre propose également des visites accompagnées, des initiations naturalistes
      et des ateliers d'éducation à l'environnement. C'est l'endroit idéal pour concevoir votre itinéraire et
      vous procurer des cartes topographiques actualisées.
    history: >-
      Le plateau est fréquenté par l'homme depuis plusieurs millénaires. Les archéologues y ont mis au jour
      des centaines de campements nomades de l'âge de la pierre liés aux migrations du renne, ainsi que
      d'innombrables fosses et pièges ancestraux pour l'élan et le renne. La Nordmannsslepa, plus ancienne
      voie de communication intérieure reliant l'est et l'ouest de la Norvège, sillonne la lande.


      La préservation s'appuie sur une gestion partagée. Six autorités de protection, trois préfectures
      régionales et trois conseils de surveillance coordonnent l'application du plan de gestion des aires
      protégées du plateau.
    before: >-
      Le Hardangervidda est un espace naturel extrêmement sensible. Restez scrupuleusement sur les sentiers
      balisés pour ne pas dégrader les mousses, lichens et plantes alpines. Gardez une distance généreuse avec
      la faune, surtout en période de reproduction et de mise bas, et tenez toujours vos chiens en laisse. Il
      est formellement interdit d'arracher des végétaux ou de prélever des vestiges historiques. Du 15 avril
      au 15 septembre, l'allumage de feux est rigoureusement interdit dans la nature norvégienne.
    around: >-
      Des contrées lointaines partagent avec le Hardangervidda le renard polaire et le renne, et pour
      certaines le harfang des neiges : la [réserve naturelle de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/), la [réserve naturelle de
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/), le [parc national de la péninsule de
      Varanger](/lugar/varanger-peninsula-national-park/) et le [parc national de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/).
  de:
    intro: >-
      Stell dir eine Hochgebirgsebene vor, die so gewaltig ist, dass am Horizont kein einziger Baum zu sehen
      ist. Hardangervidda ist genau das: Europas größte Hochebene, eine Rumpffläche von etwa 6.500 km² auf
      einer durchschnittlichen Höhe von 1.100 m, aufgeteilt auf Vestland, Telemark und Buskerud. Der am 10.
      April 1981 durch königlichen Erlass gegründete Nationalpark ist das größte Schutzgebiet auf dem
      norwegischen Festland.
    landscape: >-
      Alles begann mit einer Flachlandschaft. Im Miozän entstand die heutige Ebene auf Meereshöhe, bevor sie
      sich zu Beginn des Pliozäns um über tausend Meter heraushob. Später schliffen die Gletscher der
      Eiszeiten die Berge ab und hinterließen diese sanft welligen Hügel. Das gesamte Hochland liegt oberhalb
      der Baumgrenze unter einem ganzjährig kalten Alpinklima; die baumlose Tundra ist von zahllosen Tümpeln,
      Seen, Flüssen und Bächen durchzogen. Der höchste Punkt ist der Sandfloegga mit 1.721 m, und der markante
      Gipfel des Hårteigen mit seinen 1.690 m ragt weithin sichtbar über die Ebene.


      West und Ost sind zwei völlig unterschiedliche Welten. Der Westen besteht überwiegend aus nacktem Fels,
      während der Osten flacher und üppiger bewachsen ist; während der Westen sehr feucht ist und mancherorts
      1.000 mm Jahresniederschlag übersteigt, bleibt der Osten spürbar trockener. Entsprechend ist die Flora
      im feuchten Westen artenreicher als im trockenen Osten. Doch die Vidda war nicht immer Tundra: Vor neun-
      bis fünftausend Jahren, in einer wärmeren Epoche, trug das Plateau weite Wälder, und bis heute finden
      sich alte Kiefernstämme tief in den Hochmooren weit über der aktuellen Baumgrenze.
    wildlife: >-
      Das Geheimnis liegt in der Kälte des Nordens, die hier tief in den Süden reicht. Das hochalpine Klima
      erlaubt es arktischen Tieren und Pflanzen, weiter südlich als sonst irgendwo in Europa zu existieren.
      Hardangervidda ist die südlichste Zuflucht für den [Polarfuchs](/especie/vulpes_lagopus/) und die
      [Schnee-Eule](/especie/bubo_scandiacus/).


      Über allem steht das [wilde Rentier](/especie/rangifer_tarandus/). Die Rentiere ziehen im Jahresverlauf
      quer über die Hochebene: Ihre Winterweiden liegen im flechtenreichen Osten, während die fruchtbareren
      westlichen Hochtäler als Kalbungsgebiete dienen. Fachleute des Nationalparkzentrums weisen darauf hin,
      dass die Rentiere hier unter den schwierigsten Bedingungen Norwegens leben, bedingt durch magere Weiden
      und menschliche Beunruhigung. Infolgedessen haben die Herden ihre Routen schrittweise verlagert und
      historische Einstände früherer Jahrzehnte aufgegeben.


      Die beste Reisezeit umfasst die Monate Juli, August und September.
    visit: >-
      Am besten erkundest du die Hochebene über das dichte Hüttennetz des Norwegischen Wandervereins (DNT);
      Wanderungen von Hütte zu Hütte sind an Ostern und im Hochsommer sehr beliebt. Doch du kannst die Vidda
      auch erleben, ohne die empfindlichsten Bereiche zu betreten: Die umliegenden Täler und Orte erlauben
      Naturerlebnisse abseits der Kernzonen des Rentiers. Rjukan gilt als das östliche Tor zur Hochebene.


      Ein idealer Startpunkt ist das 2013 eröffnete Nationalparkzentrum in Skinnarbu, das einzige staatlich
      autorisierte Informationszentrum des Gebiets. Die interaktive Ausstellung erstreckt sich über 600 m² mit
      22 Stationen in sieben Themenbereichen rund um das Rentier, seine Wanderrouten und die Kulturgeschichte
      der Vidda. Hier werden auch geführte Wanderungen, Insektenkurse und Umweltbildungsprogramme angeboten.
      Dort erhältst du aktuelle Karten und verlässliche Hinweise zur aktuellen Witterung.
    history: >-
      Menschen nutzen das Plateau seit Jahrtausenden. Archäologen entdeckten Hunderte nomadischer
      Siedlungsplätze aus der Steinzeit, die eng mit den Rentierzügen verknüpft waren, sowie zahlreiche
      historische Fallgruben zur Jagd auf Elch und Rentier. Mit der Nordmannsslepa durchzieht der älteste
      historische Handelsweg zwischen Ost- und Westnorwegen die Vidda.


      Der Naturschutz baut auf klaren Regelungen auf. Sechs Schutzbehörden, drei Provinzialverwaltungen und
      drei Aufsichtsräte lenken gemeinsam den Schutz- und Bewirtschaftungsplan für die Hochebene.
    before: >-
      Hardangervidda ist ein hochsensibler Naturraum. Bleib auf den markierten Wegen und schone Moose,
      Flechten und alpine Zwergsträucher. Halte großen Abstand zu Wildtieren, besonders zur Setz- und
      Aufzuchtzeit, und führe Hunde das ganze Jahr über an der Leine. Das Ausgraben von Pflanzen und das
      Mitnehmen kulturhistorischer Funde sind verboten. Vom 15. April bis zum 15. September gilt in ganz
      Norwegen ein generelles Verbot für offenes Feuer in Wald und Flur.
    around: >-
      Entfernte Gebiete teilen mit der Hardangervidda den Polarfuchs und das Rentier, manche auch die
      Schnee-Eule: das [Naturreservat Vindelfjällen](/lugar/vindelfjallens-naturreservat/), das [Naturreservat
      Helagsfjället](/lugar/helagsfjallet-nature-reserve/), der [Nationalpark
      Varanger-Halbinsel](/lugar/varanger-peninsula-national-park/) und der [Nationalpark
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/).
  it:
    intro: >-
      Immagina un altopiano montano così sterminato che la linea dell'orizzonte è del tutto priva di alberi.
      L'Hardangervidda è proprio questo: il più grande altopiano montuoso d'Europa, un penepiano di circa
      6.500 km² a una quota media di 1.100 m, diviso tra Vestland, Telemark e Buskerud. Il suo parco
      nazionale, istituito con decreto reale il 10 aprile 1981, è il più vasto della Norvegia continentale.
    landscape: >-
      Tutto è iniziato da una pianura. Nel Miocene l'attuale penepiano si formò al livello del mare, per poi
      sollevarsi all'inizio del Pliocene di oltre mille metri. In seguito, le glaciazioni modellarono i
      rilievi lasciando queste dolci colline ondulate. L'intero altopiano si trova oltre il limite del bosco,
      sotto un clima alpino rigido in ogni stagione; il paesaggio è una brughiera priva di alberi costellata
      di pozze, laghi, fiumi e ruscelli. Il punto più elevato è il Sandfloegga a 1.721 m, mentre l'iconica
      cima dello Hårteigen, a 1.690 m, svetta visibile da gran parte della pianura d'alta quota.


      L'ovest e l'est costituiscono due mondi distinti. La parte occidentale è dominata da roccia nuda, mentre
      l'est è più pianeggiante e coperto di vegetazione; se a ovest il clima è marcatamente umido e supera
      localmente i 1.000 mm di pioggia all'anno, l'est appare molto più secco. Per questo motivo la flora è
      assai più varia nell'ovest umido che nell'arido settore orientale. Questa brughiera non è sempre stata
      tale: tra novemila e cinquemila anni fa, durante una fase climatica più mite, gran parte del territorio
      ospitava fitti boschi, e ancora oggi affiorano tronchi di pino fossili dalle torbiere ben al di sopra
      dell'attuale limite della vegetazione arborea.
    wildlife: >-
      L'elemento fondamentale è il freddo artico spinto a latitudini insolitamente meridionali. Il clima
      d'alta montagna permette a piante e animali artici di resistere più a sud che in qualunque altra parte
      d'Europa: l'Hardangervidda costituisce infatti l'estremo rifugio meridionale per la [volpe
      artica](/especie/vulpes_lagopus/) e per il [gufo delle nevi](/especie/bubo_scandiacus/).


      Ma il vero protagonista è la [renna selvatica](/especie/rangifer_tarandus/). Le mandrie si spostano
      sull'altopiano nell'arco dell'anno: i pascoli invernali ricchi di licheni si trovano a est, mentre le
      zone primaverili di parto e allattamento sono situate nell'ovest più fertile. Gli esperti del parco
      segnalano che le renne dell'Hardangervidda mostrano la condizione fisica più delicata della Norvegia a
      causa di pascoli impoveriti e disturbo antropico, spingendo gli animali a mutare rotte e ad abbandonare
      i siti storici usati decenni fa.


      I mesi più raccomandati per la visita sono luglio, agosto e settembre.
    visit: >-
      L'altopiano si esplora camminando da un rifugio all'altro lungo la rete dell'Associazione Norvegese di
      Montagna (DNT); il trekking a tappe è molto amato sia durante le vacanze pasquali sia in piena estate.
      Tuttavia puoi apprezzare la natura senza penetrare nelle aree più vulnerabili: le valli e i villaggi
      perimetrali offrono splendidi scorci senza calpestare i corridoi essenziali delle renne. Rjukan funge da
      porta d'accesso orientale.


      Il punto di partenza ideale è il centro visite di Skinnarbu, unico centro nazionale approvato dallo
      Stato, inaugurato nel 2013. Il suo percorso espositivo si sviluppa su 600 m² con 22 installazioni
      multimediali suddivise in sette sale tematiche dedicate alla renna, alle sue migrazioni e alla presenza
      umana sulla montagna. Il centro organizza escursioni guidate, laboratori didattici ed educazione
      naturalistica. È la sede ideale in cui reperire mappe aggiornate e informazioni sullo stato dei
      sentieri.
    history: >-
      La frequentazione umana risale a migliaia di anni fa. Gli archeologi hanno documentato centinaia di
      accampamenti dell'età della pietra legati alla caccia ai branchi di renne, oltre a trappole tradizionali
      destinate alla cattura di alci e renne. La Nordmannsslepa, l'antichissima via di comunicazione interna
      tra l'est e l'ovest del paese, attraversa per intero la brughiera.


      La salvaguardia dell'altopiano si basa su una gestione rigorosa. Sei autorità ambientali locali, tre
      prefetture regionali e tre consigli direttivi sovrintendono all'attuazione del piano di tutela
      territoriale.
    before: >-
      L'Hardangervidda è un ecosistema straordinariamente fragile. Rimani sempre lungo i tracciati segnati ed
      evita di calpestare muschi, licheni e arbusti nani d'alta quota. Mantieni un'ampia distanza dagli
      animali selvatici, soprattutto durante le nascite primaverili, e conduci i cani al guinzaglio tutto
      l'anno. È vietato raccogliere piante o asportare reperti storici. Dal 15 aprile al 15 settembre è
      proibito accendere fuochi nei boschi e nei territori naturali di tutta la Norvegia.
    around: >-
      Territori lontani condividono con l'Hardangervidda la volpe artica e la renna, e in alcuni casi il gufo
      delle nevi: la [Riserva naturale di Vindelfjällen](/lugar/vindelfjallens-naturreservat/), la [Riserva
      naturale di Helagsfjället](/lugar/helagsfjallet-nature-reserve/), il [Parco nazionale della penisola di
      Varanger](/lugar/varanger-peninsula-national-park/) e il [Parco nazionale di
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/).
  pt:
    intro: >-
      Imagina uma vasta planície montanhosa onde o horizonte não exibe uma única árvore. Hardangervidda é
      exatamente isso: o maior planalto alpino da Europa, uma peneplanície com cerca de 6.500 km² a uma
      altitude média de 1.100 m, repartida pelos condados de Vestland, Telemark e Buskerud. O seu parque
      nacional, criado por resolução real a 10 de abril de 1981, é o maior da Noruega continental.
    landscape: >-
      Tudo começou com uma imensa planície. No Miocénico, a superfície atual formou-se ao nível do mar e, no
      início do Pliocénico, ergueu-se mais de mil metros. Mais tarde, as geleiras das glaciações desgastaram
      os relevos rochosos, modelando estas colinas onduladas. Todo o planalto situa-se acima do limite das
      árvores, num clima alpino frio durante todo o ano; a paisagem é uma charneca desprovida de árvores
      salpicada de lagoas, lagos, rios e ribeiros. O ponto culminante é o Sandfloegga com 1.721 m, enquanto a
      silhueta imponente do pico Hårteigen, a 1.690 m, domina a vista em grande parte do planalto.


      O oeste e o leste formam dois mundos distintos. O oeste apresenta afloramentos de rocha nua, ao passo
      que o leste é mais plano e rico em coberto vegetal; além disso, enquanto o setor ocidental é bastante
      chuvoso e ultrapassa em vários pontos os 1.000 mm anuais de precipitação, o leste revela-se bem mais
      seco. Por essa razão, a flora é mais abundante no oeste húmido do que no leste árido. Esta charneca nem
      sempre existiu: há entre nove mil e cinco mil anos, sob um clima mais temperado, grande parte do
      planalto estava arborizada, preservando-se ainda troncos de pinheiro nas turfeiras bem acima do atual
      limite da floresta.
    wildlife: >-
      A chave reside no rigor do frio do norte projetado para latitudes meridionais. O clima alpino permite
      que animais e plantas árticos prosperem mais a sul do que em qualquer outro local da Europa, tornando
      Hardangervidda o último refúgio meridional da [raposa-do-ártico](/especie/vulpes_lagopus/) e do
      [bufo-real-das-neves](/especie/bubo_scandiacus/).


      No topo desta cadeia ecológica encontra-se a [rena selvagem](/especie/rangifer_tarandus/). As manadas
      percorrem o planalto ao longo das estações: as pastagens de inverno situam-se a leste, onde abundam
      líquenes, enquanto os vales férteis do oeste acolhem o nascimento das crias. Os relatórios do parque
      sublinham que as renas de Hardangervidda apresentam a condição física mais frágil da Noruega devido a
      pastagens degradadas e perturbações humanas, levando os animais a alterar gradualmente as suas rotas e a
      abandonar pastos sazonais históricos de décadas passadas.


      Os meses mais recomendados para uma visita são julho, agosto e setembro.
    visit: >-
      Explorar o planalto faz-se habitualmente recorrendo à rede de refúgios da Associação Norueguesa de
      Montanhismo (DNT); a travessia de cabana em cabana é muito popular na Páscoa e no verão. Contudo, podes
      desfrutar da região sem invadir as áreas mais delicadas: os vales e povoações periféricas proporcionam
      uma excelente aproximação à natureza sem pisar os habitats vitais da rena. Rjukan funciona como o
      principal acesso pelo leste.


      O ponto de partida ideal é o centro de visitantes de Skinnarbu, o único centro nacional oficializado
      pelo Estado, inaugurado em 2013. A exposição interativa ocupa 600 m² e conta com 22 instalações
      temáticas em sete salas sobre a rena, os seus corredores de migração e a vivência humana no planalto. O
      centro proporciona visitas guiadas, ações de formação e programas ambientais. É o melhor local para
      obter mapas atualizados e recomendações sobre o percurso.
    history: >-
      A ocupação humana remonta a vários milénios. Arqueólogos descobriram centenas de acampamentos nómadas da
      Idade da Pedra associados às migrações das renas, bem como fossas e armadilhas antigas para a caça de
      alces e renas. A Nordmannsslepa, a rota terrestre histórica mais antiga entre o leste e o oeste da
      Noruega, atravessa o planalto.


      A conservação apoia-se em regulamentos partilhados. Seis autoridades de proteção, três governos
      distritais e três conselhos de supervisão coordenam conjuntamente o plano de gestão das áreas protegidas
      do planalto.
    before: >-
      Hardangervidda é um território extremamente vulnerável. Caminha sempre pelos trilhos assinalados e evita
      pisar musgos, líquenes e pequenos arbustos alpinos. Guarda uma distância prudente dos animais, sobretudo
      na época de nascimento das crias, e conduz os cães sempre com trela. É expressamente proibido colher
      plantas ou recolher artefactos culturais. De 15 de abril a 15 de setembro vigora a proibição geral de
      fazer fogueiras nos espaços naturais da Noruega.
    around: >-
      Lugares distantes partilham com Hardangervidda a raposa-do-ártico e a rena, e alguns também o
      bufo-real-das-neves: a [Reserva Natural de Vindelfjällen](/lugar/vindelfjallens-naturreservat/), a
      [Reserva Natural de Helagsfjället](/lugar/helagsfjallet-nature-reserve/), o [Parque Nacional da
      Península de Varanger](/lugar/varanger-peninsula-national-park/) e o [Parque Nacional de
      Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/).
