resumen:
  es: >-
    El 'Sáhara de Europa', la mayor extensión de dunas de arena continentales del continente (35.000 ha) fija
    por bosques de pino.
  en: >-
    The 'Sahara of Europe', the continent's largest expanse of inland continental sand dunes (35,000 ha)
    stabilized by pine forests.
  fr: >-
    Le « Sahara de l'Europe », la plus vaste étendue de dunes de sable continentales d'Europe (35 000 ha)
    stabilisée par des forêts de pins.
  de: >-
    Die 'Sahara Europas', das größte Binnendünengebiet des Kontinents (35.000 ha), befestigt durch
    Kiefernwälder.
  it: >-
    Il 'Sahara d'Europa', la più vasta distesa di dune continentali del continente (35.000 ha) consolidata da
    pinete.
  pt: >-
    O 'Sara da Europa', a maior extensão de dunas de areia continentais do continente (35.000 ha) fixada por
    pinhais.
unico:
  es: >-
    Un desierto de arena en plena Europa, convertido en refugio de estepa donde viven la peonía del Banato, el
    suslik y el águila imperial.
  en: >-
    A sand desert in the heart of Europe, transformed into a steppe sanctuary where Banat peonies, ground
    squirrels and imperial eagles thrive.
  fr: >-
    Un désert de sable au cœur de l'Europe, refuge steppique où prospèrent pivoine du Banat, souslik d'Europe
    et aigle impérial.
  de: Eine Sandwüste mitten in Europa, Steppenrefugium für Banater Pfingstrose, Ziesel und Kaiseradler.
  it: >-
    Un deserto sabbioso nel cuore d'Europa, rifugio steppico dove convivono peonia del Banato, citello e
    aquila imperiale.
  pt: >-
    Um deserto de areia no coração da Europa, transformado em refúgio estépico onde coabitam peónia-do-banato,
    esquilo-terrestre e águia-imperial.
observaciones:
  es: >-
    Está prohibido encender fuego al aire libre salvo en un lugar previsto, señalizado y seguro. Cuenta con
    uno o dos días, y la primavera y el otoño son las mejores épocas.
texto:
  es:
    intro: >-
      Hubo un tiempo en que el viento de Deliblato se llevaba la arena hasta Viena y Pest. Hoy esas mismas
      arenas, que son uno de los mayores terrenos arenosos de Europa y los restos de un desierto prehistórico
      nacido cuando se retiró el mar Panónico, forman una reserva de casi treinta y cinco mil hectáreas en el
      Banato, en el sureste de la llanura panónica. Dunas de entre setenta y doscientos metros, estepa
      arenosa, bosque y humedales del Danubio caben en un mismo mapa.
    landscape: >-
      Todo parte del viento. El Košava ha modelado dunas entre setenta y doscientos metros sobre depósitos de
      arena eólica glacial, y el clima moderadamente continental, el suelo arenoso y la ausencia de cursos de
      agua superficiales han hecho el resto: comunidades ecológicas que solo existen aquí, los llamados
      Deliblaticum. El resultado es un mosaico de estepa arenosa, bosque y vegetación de humedal que antes
      dominaba toda la llanura panónica y que en otros lugares de Europa se ha cultivado, plantado o
      transformado. En Deliblato, en cambio, buena parte se ha conservado.


      Esa arena quiso domarse. En mil setecientos ochenta y nueve, las autoridades austriacas enviaron a un
      ingeniero forestal a medir las arenas, y el plan de forestación que redactó para fijarlas se aprobó en
      mil ochocientos dieciocho. Para sujetarlas se plantaron robinias, pino negro, pino silvestre y distintas
      frondosas. Al sureste, el lago Kraljevac es uno de los embalses creados en el borde de la región para
      frenar el avance de la arena. En el extremo sur, donde las arenas llegan al Danubio, empieza otro mundo:
      marismas, brazos de río y humedales.
    wildlife: >-
      La reserva reúne más de novecientas plantas, entre ellas la peonía del Banato, la peonía de estepa, el
      ajenjo de Pančić, *Prunus tenella* y unas veinte especies de orquídeas. Es una flora de arena y de
      estepa que en otras zonas del continente ha desaparecido.


      Las praderas abiertas son la despensa de los depredadores. La [ardilla terrestre
      europea](/especie/spermophilus_citellus/) alimenta a rapaces amenazadas como el halcón del Banato, el
      [halcón sacre](/especie/falco_cherrug/), el [águila imperial oriental](/especie/aquila_heliaca/) y el
      águila pomerana. Hasta finales de los años ochenta, Deliblato fue el hábitat más importante del águila
      imperial oriental en Serbia; hoy un comedero llamado «Orlovac», en la estepa de Korn, atiende a rapaces
      protegidas. También hay hormigas del desierto, hormigaleones, rata topo, turón estepario y, entre los
      grandes mamíferos, el [lobo](/especie/canis_lupus/).


      Entre las aves más hermosas de la reserva se citan la abubilla, el abejaruco, el [martín pescador
      común](/especie/alcedo_atthis/), el águila imperial oriental y el halcón del Banato. En el Danubio, el
      tramo de Labudovo okno es una de las grandes estaciones de paso de aves de Europa: cuando el río se
      hiela, pasan el invierno unas trescientas mil aves, entre patos, gansos y cisnes salvajes. Allí crían
      aves de humedal raras, como el morito, el cormorán pigmeo, la garceta común y la garcilla cangrejera, y
      donde las arenas caen al río, en un talud de diez metros, los aviones zapadores han excavado sus nidos.


      Las estaciones de visita son la primavera y el otoño, de abril a junio y en septiembre y octubre.
    visit: >-
      El punto de partida es el centro educativo Čardak, en el corazón de la reserva, a siete kilómetros del
      pueblo de Deliblato y cerca de Kovin. Sus instalaciones sirven a las actividades educativas, y desde
      allí salen los senderos: son circulares, están bien señalizados, tienen paneles informativos, bancos y
      mesas, y cruzan un terreno de dunas suavemente onduladas.


      El más largo es Borovi breg, en forma de ocho, con quince kilómetros y dificultad media. El
      Čardak–Vrela, el número uno, es circular, tiene doce kilómetros y también sirve para ir en bici, con
      posibilidad de enlazar con el Eurovelo. Koprivić es circular, de siete kilómetros y exige una forma
      física media. Si vas con niños, el sendero ecológico, circular y de tres kilómetros y medio, y el
      Bracina, lineal y de cinco kilómetros solo de ida, son fáciles. Hay además una escuela en la naturaleza
      que incluye un paseo de hasta dos horas con un guía especializado.


      Las arenas están cruzadas por incontables pistas y caminitos que pueden desviar al visitante, así que
      hay que seguir la ruta marcada o saber exactamente adónde se va.
    history: >-
      El ser humano lleva aquí mucho tiempo: en Židovar se han hallado restos de la Edad del Bronce. Durante
      la Segunda Guerra Mundial, los partisanos yugoslavos usaron las arenas de refugio, y de todos sus
      escondites solo se conserva uno, un hospital improvisado en Čardak. En Devojački Bunar, uno de los
      lugares de excursión, se alza la única iglesia de madera de Vojvodina.


      El incendio de mil novecientos noventa y seis destruyó casi por completo el verde de la región, y el
      fuego sigue siendo la gran amenaza para los espacios de bosque y estepa, sobre todo en los meses secos
      del verano.
    before: >-
      Está prohibido encender fuego al aire libre salvo en un lugar previsto, señalizado y seguro. Cuenta con
      uno o dos días, y la primavera y el otoño son las mejores épocas.
    around: >-
      No hay vecinos cercanos con ficha, pero sí lugares lejanos que comparten con Deliblato el suslik y el
      halcón sacre: el [Parque Nacional Montañas de Măcin](/lugar/parcul-national-muntii-macinului/), el
      [Parque Nacional Körös-Maros](/lugar/koros-maros-nemzeti-park/) y la [Meseta de
      Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/). Con el [Parque Natural Stara
      Planina](/lugar/park-prirode-stara-planina/) comparte el halcón sacre y el lobo.
  en:
    intro: >-
      There was a time when the howling wind of Deliblato blew sand as far as Vienna and Pest. Today those
      very dunes, representing one of Europe's largest sandy expanses and the relics of a prehistoric desert
      born as the Pannonian Sea receded, form a protected reserve of nearly thirty-five thousand hectares in
      the Banat, in the southeastern Pannonian basin. Dunes between seventy and two hundred metres high, sandy
      steppe, woodland and Danube floodplains all share a single expanse.
    landscape: >-
      Everything begins with the wind. The Košava wind has sculpted dunes between seventy and two hundred
      metres high out of glacial aeolian sand deposits, while the moderately continental climate, permeable
      sandy ground and complete lack of surface streams did the rest, creating endemic plant associations
      known as the Deliblaticum. The resulting mosaic of sand steppe, open oak woods and wetland margins once
      carpeted the entire Pannonian plain but was elsewhere ploughed, planted or heavily altered. At
      Deliblato, a substantial portion survives intact.


      Efforts to tame the drifting sands have a long history. In seventeen eighty-nine, Austrian authorities
      dispatched a forestry engineer to survey the sands, and the afforestation plan he devised to bind them
      was ratified in eighteen eighteen. To stabilize the dunes, black locust, black pine, Scots pine and
      diverse broadleaves were planted. To the southeast, Lake Kraljevac was created as a perimeter reservoir
      to halt drifting sands. At the southern edge, where sand meets the Danube, a distinct aquatic world
      unfolds: marshes, river branches and wetlands.
    wildlife: >-
      The reserve gathers over nine hundred plant species, including the Banat peony, steppe peony, Pančić's
      wormwood, dwarf Russian almond and some twenty wild orchid species. It represents a specialized
      psammophytic and steppe flora largely lost elsewhere across Europe.


      Open grasslands serve as hunting grounds for apex predators. The [European ground
      squirrel](/especie/spermophilus_citellus/) nourishes threatened raptors such as the [saker
      falcon](/especie/falco_cherrug/), the [eastern imperial eagle](/especie/aquila_heliaca/) and the lesser
      spotted eagle. Until the late nineteen eighties, Deliblato was Serbia's premier stronghold for the
      eastern imperial eagle; today a supplementary feeding station named «Orlovac» on the Korn steppe
      supports protected raptors. Desert ants, antlions, lesser mole-rats, steppe polecats and large mammals
      like the [grey wolf](/especie/canis_lupus/) also inhabit the reserve.


      Among the reserve's most striking birds are hoopoe, European bee-eater, [common
      kingfisher](/especie/alcedo_atthis/), eastern imperial eagle and saker falcon. Along the Danube, the
      Labudovo okno wetland is a premier European migratory crossroads: when the river freezes, up to three
      hundred thousand wintering ducks, geese and swans gather. Rare marsh birds nest there, including glossy
      ibis, pygmy cormorant, little egret and squacco heron, while sand martins excavate nesting burrows into
      ten-metre river bluffs.


      Visiting seasons are spring and autumn, from April to June and September to October.
    visit: >-
      The primary base is the Čardak educational centre in the heart of the reserve, seven kilometres from
      Deliblato village and close to Kovin. Its facilities support educational programs, and waymarked walking
      loops depart from the grounds across gently rolling dunes, equipped with interpretive boards, benches
      and resting tables.


      The longest route is Borovi breg, a figure-eight loop of fifteen kilometres and moderate difficulty. The
      Čardak–Vrela trail (number one) is a circular twelve-kilometre route also suitable for cycling,
      connecting to the EuroVelo network. Koprivić is a circular seven-kilometre trail requiring moderate
      fitness. For families with children, the Eco-path (a circular three-and-a-half-kilometre walk) and the
      Bracina trail (a five-kilometre linear path) are easy strolls. Specialized nature school walks last up
      to two hours with an expert ranger.


      The dunes are criss-crossed by countless unmarked forestry tracks that easily disorient walkers; stick
      strictly to signposted routes or navigate with care.
    history: >-
      Human habitation has deep roots: Bronze Age remains were excavated at Židovar. During World War II,
      Yugoslav partisans used the sands as a hiding place, and of all their secret shelters only one survives:
      an improvised field hospital at Čardak. At Devojački Bunar, a popular picnic area, stands the only
      wooden church in Vojvodina.


      A devastating wildfire in nineteen ninety-six scorched vast tracts of greenery, and fire remains the
      gravest threat to the woodland and steppe communities, especially during parched summer months.
    before: >-
      Lighting open fires is prohibited outside designated, signposted and secure campfire rings. Plan for one
      or two days; spring and autumn are the most rewarding seasons.
    around: >-
      While there are no catalogued neighbours close by in the atlas, distant steppe reserves share the ground
      squirrel and saker falcon: [Măcin Mountains National Park](/lugar/parcul-national-muntii-macinului/),
      [Körös-Maros National Park](/lugar/koros-maros-nemzeti-park/) and the [Casimcea
      Plateau](/lugar/podisul-casimcea---podisul-dobrogean/). [Stara Planina Nature
      Park](/lugar/park-prirode-stara-planina/) shares the saker falcon and the wolf.
  fr:
    intro: >-
      Il fut un temps où le vent de Deliblato emportait le sable jusqu'à Vienne et Pest. Aujourd'hui ces mêmes
      sables, qui constituent l'une des plus vastes étendues dunaires d'Europe et les vestiges d'un désert
      préhistorique né du retrait de la mer pannonienne, forment une réserve de près de trente-cinq mille
      hectares dans le Banat. Dunes de soixante-dix à deux cents mètres, steppe sableuse, forêts et zones
      humides danubiennes composent un même paysage.
    landscape: >-
      Tout procède du vent. Le Košava a sculpté des dunes de soixante-dix à deux cents mètres dans des dépôts
      éoliens glaciaires, tandis que le climat continental, le substrat sableux et l'absence d'eaux de surface
      ont engendré des communautés végétales endémiques, le Deliblaticum. Il en résulte une mosaïque de steppe
      sableuse, de chênaies claires et de milieux humides qui couvrait jadis la plaine pannonienne et qui a
      disparu ailleurs sous la charrue. À Deliblato, une part majeure demeure préservée.


      Les hommes ont cherché à fixer ce sable. En dix-sept cent quatre-vingt-neuf, l'administration
      autrichienne dépêcha un ingénieur forestier pour mesurer les dunes, et le plan de reboisement fut
      entériné en dix-huit cent dix-huit. Des robiniers, pins noirs, pins sylvestres et feuillus variés furent
      plantés. Au sud-est, le lac Kraljevac fut aménagé pour contenir l'avancée du sable. Au sud, là où les
      dunes rejoignent le Danube, s'ouvre un dédale de marécages et de bras morts.
    wildlife: >-
      La réserve rassemble plus de neuf cents plantes, dont la pivoine du Banat, la pivoine des steppes,
      l'armoise de Pančić, le prunier nain et une vingtaine d'orchidées. C'est une flore arénicole et
      steppique disparue du reste du continent.


      Les pelouses ouvertes nourrissent les prédateurs. Le [souslik d'Europe](/especie/spermophilus_citellus/)
      alimente des rapaces menacés comme le [faucon sacre](/especie/falco_cherrug/), l'[aigle
      impérial](/especie/aquila_heliaca/) et l'aigle pomarin. Jusqu'à la fin des années quatre-vingt,
      Deliblato fut le principal bastion serbe de l'aigle impérial ; un charnier nommé « Orlovac » sur la
      steppe de Korn nourrit aujourd'hui ces rapaces protégés. On y rencontre fourmis du désert, fourmilions,
      rat-taupe, putois des steppes et le [loup](/especie/canis_lupus/).


      L'avifaune compte la huppe, le guêpier, le [martin-pêcheur d'Europe](/especie/alcedo_atthis/) et l'aigle
      impérial. Le long du Danube, le site de Labudovo okno est une escale majeure : quand le fleuve gèle,
      jusqu'à trois cent mille oiseaux d'eau y hivernent. Y nichent des espèces rares comme l'ibis falcinelle,
      le cormoran pygmée et le crabier chevelu, tandis que les hirondelles de rivage creusent leurs galeries
      dans des falaises de sable de dix mètres.


      Les meilleures périodes de visite sont le printemps et l'automne, d'avril à juin et en
      septembre-octobre.
    visit: >-
      Le point d'accueil est le centre éducatif de Čardak, au cœur de la réserve, à sept kilomètres du village
      de Deliblato près de Kovin. Plusieurs sentiers en boucle balisés partent du centre à travers des dunes
      ondulées, équipés de panneaux explicatifs et d'aires de repos.


      Le circuit de Borovi breg, en huit, fait quinze kilomètres et présente une difficulté moyenne. Le
      parcours Čardak–Vrela (numéro un), long de douze kilomètres, est praticable à vélo et se connecte à
      l'EuroVelo. Le Koprivić est une boucle de sept kilomètres demandant une forme moyenne. Pour les
      familles, le sentier écologique de trois kilomètres et demi et le Bracina de cinq kilomètres sont très
      accessibles. Des visites guidées de deux heures sont assurées par des guides forestiers.


      Les sables sont sillonnés d'innombrables pistes sans repères : suivez rigoureusement les balises.
    history: >-
      Le site est habité de longue date : Židovar recèle des vestiges de l'âge du bronze. Durant la Seconde
      Guerre mondiale, les partisans yougoslaves s'y cachèrent, laissant un hôpital de campagne clandestin à
      Čardak. À Devojački Bunar s'élève l'unique église en bois de Voïvodine.


      Un incendie majeur en dix-neuf cent quatre-vingt-seize ravagea le couvert végétal, et le feu demeure la
      pire menace pour ces milieux steppiques lors des canicules.
    before: >-
      Il est interdit d'allumer du feu hors des emplacements aménagés et sécurisés. Prévoyez un à deux jours,
      de préférence au printemps ou en automne.
    around: >-
      Aucun site du guide n'est proche, mais des espaces steppiques lointains partagent le souslik et le
      faucon sacre : le [Parc national des monts Măcin](/lugar/parcul-national-muntii-macinului/), le [Parc
      national de Körös-Maros](/lugar/koros-maros-nemzeti-park/) et le [Plateau de
      Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/). Le [Parc naturel de Stara
      Planina](/lugar/park-prirode-stara-planina/) partage le faucon sacre et le loup.
  de:
    intro: >-
      Es gab eine Zeit, da trug der Sturm von Deliblato den Sand bis nach Wien und Pest. Heute bilden
      dieselben Dünen—eines der größten Sandgebiete Europas und Relikt einer Urwüste nach dem Rückzug des
      Pannonischen Meeres—ein Reservat von fast fünfunddreißigtausend Hektar im Banat. Siebzig bis zweihundert
      Meter hohe Dünen, Sandsteppe, Wald und Donauauen vereinen sich hier.
    landscape: >-
      Alles geht vom Wind aus. Der Košava-Sturm formte Dünen zwischen siebzig und zweihundert Metern Höhe aus
      glazialem Flugsandsediment, während trockenes Kontinentalklima und das Fehlen von Oberflächengewässern
      endemische Pflanzengesellschaften hervorbrachten, das sogenannte Deliblaticum. Es entstand ein Mosaik
      aus Sandsteppe, lichten Eichenwäldern und Feuchtgebieten, wie es einst die gesamte Pannonische Tiefebene
      prägte und andernorts der Landwirtschaft weichen musste. In Deliblato blieb vieles bewahrt.


      Die Zähmung des Sandes begann früh: Siebzehnhundertneunundachtzig entsandten die österreichischen
      Behörden Forstingenieure zur Vermessung, und der Aufforstungsplan wurde achtzehnhundertachtzehn
      genehmigt. Zur Befestigung wurden Robinien, Schwarzföhren, Waldkiefern und Laubhölzer gepflanzt. Im
      Südosten hält der Kraljevac-See den Wanderflug auf. Am Südrand, wo die Dünen die Donau erreichen,
      erstreckt sich eine amphibische Welt aus Altarmen und Auen.
    wildlife: >-
      Über neunhundert Pflanzenarten wachsen hier, darunter die Banater Pfingstrose, Steppen-Pfingstrose,
      Pančić-Wermut, Zwergmandel und rund zwanzig Orchideenarten. Es ist eine Sand- und Steppenflora, die im
      restlichen Europa weitgehend erloschen ist.


      Offene Steppenrasen sind die Speisekammer der Räuber. Der [Europäische
      Ziesel](/especie/spermophilus_citellus/) ernährt bedrohte Greifvögel wie
      [Sakerfalke](/especie/falco_cherrug/), [Östlicher Kaiseradler](/especie/aquila_heliaca/) und
      Schreiadler. Bis in die späten achtziger Jahre war Deliblato Serbiens wichtigstes Kaiseradlergebiet;
      heute versorgt ein Luderplatz namens «Orlovac» auf der Korn-Steppe seltene Greife. Auch Wüstenameisen,
      Ameisenjungfern, Blindmäuse, Steppeniltisse und der [Wolf](/especie/canis_lupus/) leben hier.


      Zur Vogelwelt gehören Wiedehopf, Bienenfresser, [Eisvogel](/especie/alcedo_atthis/) und Kaiseradler. An
      der Donau ist Labudovo okno ein europäischer Zugvogel-Knotenpunkt: Bei Frost überwintern bis zu
      dreihunderttausend Enten, Gänse und Singschwäne. Uferschwalben graben ihre Brutröhren in zehn Meter hohe
      Sandsteilwände.


      Beste Reisezeiten sind Frühling und Herbst von April bis Juni sowie September und Oktober.
    visit: >-
      Ausgangsort ist das Bildungszentrum Čardak im Schutzgebietszentrum, sieben Kilometer vom Ort Deliblato
      bei Kovin. Rundwege führen vom Zentrum über sanft gewellte Dünen, ausgestattet mit Schautafeln und
      Rastbänken.


      Der Weg Borovi breg beschreibt eine Acht von fünfzehn Kilometern mittlerer Schwierigkeit. Der
      Čardak–Vrela-Weg (Nummer eins) misst zwölf Kilometer und eignet sich auch fürs Fahrrad mit Anschluss an
      den EuroVelo. Koprivić ist ein Sieben-Kilometer-Rundweg. Für Familien eignen sich der Öko-Rundweg über
      dreieinhalb Kilometer sowie der Bracina-Pfad (fünf Kilometer einfach). Geführte Touren dauern bis zu
      zwei Stunden mit Rangern.


      Zahllose unmarkierte Fahrwege kreuzen die Sandflächen: Bleibe unbedingt auf den markierten Pfaden.
    history: >-
      Die Besiedlung reicht weit zurück: Bei Židovar wurden bronzezeitliche Funde geborgen. Im Zweiten
      Weltkrieg dienten die Sanddünen Partisanen als Versteck; ein getarntes Feldlazarett in Čardak ist
      erhalten. In Devojački Bunar steht die einzige Holzkirche der Vojvodina.


      Ein Großbrand im Jahr neunzehnhundertsechsundneunzig zerstörte weite Teile der Vegetation; Wald- und
      Steppenbrände bleiben die größte Gefahr in trockenen Sommern.
    before: >-
      Offenes Feuer ist außerhalb ausgewiesener Grillplätze streng verboten. Plane ein bis zwei Tage ein;
      Frühling und Herbst bieten das angenehmste Klima.
    around: >-
      In direkter Nähe fehlen erfasste Gebiete, doch teilen ferne Steppenreservate Ziesel und Sakerfalke: der
      [Nationalpark Măcin-Gebirge](/lugar/parcul-national-muntii-macinului/), der [Nationalpark
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) und das
      [Casimcea-Plateau](/lugar/podisul-casimcea---podisul-dobrogean/). Mit dem [Naturpark Stara
      Planina](/lugar/park-prirode-stara-planina/) teilt Deliblato Sakerfalke und Wolf.
  it:
    intro: >-
      Vi fu un'epoca in cui il vento di Deliblato spingeva la sabbia fino a Vienna e Pest. Oggi quelle stesse
      sabbie, tra i maggiori terreni dunali d'Europa e residuo di un deserto preistorico formatosi con il
      ritiro del mare Pannonico, compongono una riserva di quasi trentacinquemila ettari nel Banato. Dune tra
      settanta e duecento metri, steppa sabbiosa, boschi e zone umide danubiane convivono su una medesima
      superficie.
    landscape: >-
      Tutto scaturisce dal vento. Il Košava ha modellato dune tra settanta e duecento metri su depositi eolici
      glaciali, mentre il clima continentale, il terreno sabbioso e l'assenza di corsi d'acqua superficiali
      hanno generato biocenosi esclusive, il Deliblaticum. Ne risulta un mosaico di steppa arida, querce rade
      e paludi che un tempo ammantava l'intera pianura pannonica e che altrove è stato bonificato. A Deliblato
      gran parte è giunta intatta.


      L'uomo cercò di arrestare l'avanzata delle sabbie. Nel millesettecentottantanove le autorità austriache
      inviarono un forestale a rilevare le dune, approvando il piano di rimboschimento nel
      milleottocentodiciotto. Furono piantate robinie, pino nero, pino silvestre e latifoglie. A sud-est il
      lago Kraljevac fu creato per sbarrare il fronte dunale. All'estremità meridionale, dove la sabbia
      incontra il Danubio, inizia un labirinto di meandri e golene.
    wildlife: >-
      La riserva accoglie oltre novecento essenze vegetali, incluse la peonia del Banato, la peonia di steppa,
      l'assenzio di Pančić, il mandorlo nano e una ventina di orchidee selvatiche. È una flora xerofila e
      steppica scomparsa altrove.


      Le radure aperte sono la dispensa dei predatori. Il [citello](/especie/spermophilus_citellus/) nutre
      rapaci minacciati come il [sacro](/especie/falco_cherrug/), l'[aquila
      imperiale](/especie/aquila_heliaca/) e l'aquila anatina. Fino a fine anni ottanta Deliblato fu il
      caposaldo serbo dell'aquila imperiale; oggi un carnaio a Korn foraggia i rapaci protetti. Vi vivono
      formiche del deserto, formicaleoni, spalaci, puzzole delle steppe e il [lupo
      grigio](/especie/canis_lupus/).


      Tra i volatili compaiono upupa, gruccione, [martin pescatore](/especie/alcedo_atthis/) e aquila
      imperiale. Lungo il Danubio, Labudovo okno è un crocevia migratorio europeo: col gelo invernale vi
      sostano fino a trecentomila anatre, oche e cigni selvatici. Nei dieci metri di falesie sabbiose le rive
      accolgono colonie di topini.


      I periodi ideali sono primavera e autunno, da aprile a giugno e a settembre-ottobre.
    visit: >-
      Punto di partenza è il centro didattico Čardak nel cuore dell'oasi, a sette chilometri dal borgo di
      Deliblato vicino a Kovin. Dalla struttura si dipartono sentieri ad anello ben tracciati su dune
      ondulate, corredati da bacheche e aree sosta.


      Il più esteso è Borovi breg, ad anello a otto di quindici chilometri di media difficoltà. Il tracciato
      Čardak–Vrela (numero uno) è un anello di dodici chilometri percorribile in bicicletta e raccordabile con
      l'EuroVelo. Koprivić è un anello di sette chilometri per escursionisti medi. Per famiglie, il sentiero
      ecologico di tre chilometri e mezzo e il Bracina di cinque chilometri sono facili passeggiate. Sono
      disponibili escursioni guidate di due ore con guardaparco.


      Le sabbie sono solcate da innumerevoli carrarecce prive di segnavia: mantieniti rigorosamente sui
      percorsi segnati.
    history: >-
      La presenza umana ha radici remote: a Židovar sono stati rinvenuti reperti dell'età del bronzo. Durante
      la seconda guerra mondiale i partigiani jugoslavi vi trovarono rifugio, conservando a Čardak un ospedale
      da campo sotterraneo. A Devojački Bunar sorge l'unica chiesa in legno della Voivodina.


      Un incendio devastante nel millenovecentonovantasei distrusse gran parte della copertura vegetale, e il
      fuoco rimane il pericolo primario nei mesi torridi.
    before: >-
      È proibito accendere fuochi al di fuori delle postazioni predisposte e autorizzate. Prevedi uno o due
      giorni, preferendo primavera o autunno.
    around: >-
      Non vi sono siti vicini nell'atlas, ma aree steppiche distanti condividono citello e falco sacro: il
      [Parco Nazionale Monti Măcin](/lugar/parcul-national-muntii-macinului/), il [Parco Nazionale di
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) e l'[Altopiano di
      Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/). Con il [Parco Naturale di Stara
      Planina](/lugar/park-prirode-stara-planina/) condivide falco sacro e lupo.
  pt:
    intro: >-
      Houve um tempo em que as rajadas de Deliblato transportavam poeira de areia até Viena e Pest. Hoje essas
      mesmas dunas, que constituem uma das maiores extensões arenosas da Europa e vestígio de um deserto
      pré-histórico resultante do recuo do mar da Panónia, formam uma reserva de quase trinta e cinco mil
      hectares no Banato. Dunas entre setenta e duzentos metros de altura, estepe arenosa, bosques e zonas
      húmidas danubianas coexistem num só mapa.
    landscape: >-
      Tudo parte do vento. O vendaval Košava esculpiu dunas entre setenta e duzentos metros sobre depósitos
      eólicos glaciares, enquanto o clima continental moderado, o substrato permeável e a ausência de cursos
      de água superficiais criaram comunidades ecológicas exclusivas, o chamado Deliblaticum. O mosaico de
      estepe arenosa, carvalhais e vegetação palustre outrora dominava toda a Panónia e noutros pontos foi
      lavrado. Em Deliblato uma vasta porção resistiu intacta.


      A fixação das areias remonta a tempos históricos. Em mil setecentos e oitenta e nove as autoridades
      austríacas enviaram engenheiros florestais para delimitar os areais, sendo o plano de arborização
      aprovado em mil oitocentos e dezoito. Plantaram-se robínias, pinheiro-bravo, pinheiro-silvestre e
      folhosas. A sudeste, o lago Kraljevac conteve a progressão eólica. A sul, onde a areia toca o Danúbio,
      despontam sapais e braços mortos.
    wildlife: >-
      A reserva congrega mais de novecentas espécies vegetais, como a peónia-do-banato, a peónia-de-estepe, o
      absinto de Pančić, a amendoeira-anã e cerca de vinte orquídeas bravas. É uma flora arenosa e estépica
      extinta em quase todo o continente.


      As pastagens abertas constituem a despensa das rapinas. O
      [esquilo-terrestre](/especie/spermophilus_citellus/) sustenta aves raras como o
      [falcão-sacre](/especie/falco_cherrug/), a [águia-imperial-oriental](/especie/aquila_heliaca/) e a
      águia-pomerana. Até ao final dos anos oitenta Deliblato foi o grande núcleo reprodutor da águia-imperial
      na Sérvia; hoje um comedouro em Korn apoia as rapinas protegidas. Ocorrem formigas-do-deserto,
      formigas-leão, o rato-toupeira, o tourão-estépico e o [lobo-cinzento](/especie/canis_lupus/).


      Entre as aves destacam-se a poupa, o abelharuco, o [guarda-rios-comum](/especie/alcedo_atthis/) e a
      águia-imperial. No Danúbio, Labudovo okno é um cruzamento migratório europeu: no inverno acolhe
      trezentas mil aves aquáticas entre patos, gansos e cisnes. Nas arribas arenosas de dez metros nidificam
      andorinhas-das-barreiras.


      As épocas de visita recomendadas são a primavera e o outono, de abril a junho e setembro a outubro.
    visit: >-
      O ponto de acolhimento é o centro pedagógico de Čardak no coração da reserva, a sete quilómetros da
      povoação de Deliblato junto a Kovin. Daqui partem trilhos circulares balizados através de dunas
      onduladas, providos de painéis, mesas e bancos.


      O trilho mais longo é o Borovi breg, em oito, com quinze quilómetros e dificuldade média. O percurso
      Čardak–Vrela (número um) tem doze quilómetros e é ciclável com ligação à EuroVelo. Koprivić é uma rota
      circular de sete quilómetros. Para famílias, o percurso ecológico de três quilómetros e meio e o trilho
      de Bracina com cinco quilómetros são fáceis. O centro faculta passeios guiados de até duas horas com
      vigilantes.


      As areias estão sulcadas por inúmeras pistas florestais secundárias: segue com rigor o traçado marcado.
    history: >-
      A ocupação humana é ancestral: em Židovar recolheram-se vestígios da Idade do Bronze. Na Segunda Guerra
      Mundial os guerrilheiros partisans refugiaram-se nas dunas, restando um hospital de campanha camuflado
      em Čardak. Em Devojački Bunar ergue-se a única igreja de madeira da Vojvodina.


      Um grande incêndio em mil novecentos e noventa e seis consumiu vasta mancha verde, mantendo-se o fogo
      como o principal perigo estival.
    before: >-
      É estritamente proibido fazer fogueiras fora dos locais autorizados e sinalizados. Reserva um a dois
      dias, com preferência para a primavera e o outono.
    around: >-
      Sem vizinhos imediatos catalogados, estepes longínquas partilham esquilo-terrestre e falcão-sacre: o
      [Parque Nacional dos Montes Măcin](/lugar/parcul-national-muntii-macinului/), o [Parque Nacional
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) e o [Planalto de
      Casimcea](/lugar/podisul-casimcea---podisul-dobrogean/). O [Parque Natural de Stara
      Planina](/lugar/park-prirode-stara-planina/) acolhe falcão-sacre e lobo.
