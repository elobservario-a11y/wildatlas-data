resumen:
  es: >-
    La mayor meseta de turbera alta de Europa Occidental (600 km²), que alberga el punto más elevado de
    Bélgica.
  en: The largest raised bog plateau in Western Europe (600 km²), home to the highest point in Belgium.
  fr: >-
    Le plus grand plateau de tourbière haute d'Europe occidentale (600 km²), qui abrite le point culminant de
    la Belgique.
  de: Das größte Hochmoorplateau Westeuropas (600 km²) mit dem höchsten Punkt Belgiens.
  it: >-
    Il più grande altopiano di torbiera alta dell'Europa occidentale (600 km²), che ospita il punto più alto
    del Belgio.
  pt: >-
    O maior planalto de turfeira alta da Europa Ocidental (600 km²), que alberga o ponto mais elevado da
    Bélgica.
unico:
  es: Una turbera de hace 7500 años donde el urogallo negro resiste en el extremo occidental de su área.
  en: >-
    A peat bog dating back 7,500 years where the black grouse holds on at the western edge of its range, and
    Belgium's highest point.
  fr: >-
    Une tourbière vieille de 7 500 ans où le tétras lyre résiste à l'extrémité occidentale de son aire, et le
    point culminant de la Belgique.
  de: >-
    Ein Hochmoor aus der Zeit vor 7 500 Jahren, wo das Birkhuhn am westlichen Rand seines Verbreitungsgebiets
    überlebt, und Belgiens höchster Punkt.
  it: >-
    Una torbiera di 7 500 anni dove il fagiano di monte resiste al limite occidentale del suo areale, e il
    punto più alto del Belgio.
  pt: >-
    Uma turfeira com 7 500 anos onde o galo-lira resiste no limite ocidental da sua área de distribuição, e o
    ponto mais alto da Bélgica.
observaciones:
  es: >-
    El acceso está zonificado. Las zonas B abren de día; para entrar en las C hace falta un guía reconocido;
    las D están cerradas al público. Con tiempo seco se cierran todas las turberas salvo el pequeño Poleûr, y
    en los accesos se izan banderas rojas: no entres. Está prohibido encender fuego, acampar y vivaquear fuera
    de las zonas previstas, y en las reservas no se puede recolectar nada. En las pasarelas y senderos
    estrechos no se puede ir en bicicleta ni a caballo.
texto:
  es:
    intro: >-
      Subes por el «Venndach», entre abetos, y de golpe el bosque se acaba. Delante se abre una meseta de
      turberas y brezales sin cultivar, con la hierba de las turberas ondulando hasta donde alcanza la vista.
      Es el plateau de las Hautes Fagnes, el mayor macizo de turberas de Bélgica y el corazón del Parque
      Natural Hautes Fagnes-Eifel, que se extiende por 72.000 hectáreas y doce municipios. Aquí, a 694 m en el
      signo de Botrange, está la cumbre de Bélgica.
    landscape: >-
      La historia empieza con el hielo. Al final de la última glaciación, hace unos 7500 años, las plantas,
      sobre todo los esfagnos, crecían y se descomponían a medias en un suelo empapado, y fueron formando
      capas gruesas de turba. De las turberas originales, de unas 1000 hectáreas, hoy solo unas cien están
      casi libres de influencia humana. En el paisaje hay además palsas, hoyos casi circulares de la época
      glaciar, de varios metros de profundidad, donde los esfagnos se instalaron pronto y hoy hay turberas
      pequeñas y muy antiguas.


      El agua lo manda todo. La turba absorbe la lluvia como una esponja, y lo que no retiene alimenta por
      arroyos los embalses de la Eifel vecina.


      El color cambia con la estación. En otoño la hierba de las turberas se vuelve naranja oxidado; en
      invierno y primavera, de un amarillo pálido. Abedules retorcidos, sauces de orejitas, algún abeto y
      serbales dan siluetas extrañas. Y bajo ellos, los brezales secos tienen arándano, arándano rojo y brezo;
      en la turbera alta crecen romero de pantano, camarina, drosera de hoja redonda y esfagnos.
    wildlife: >-
      El [urogallo negro](/especie/tetrao_tetrix/) es el símbolo. Es un relicto de la última glaciación, y las
      Hautes Fagnes son uno de sus últimos refugios en el extremo occidental de su área. El último recuento
      contó unos veinte machos en sus áreas de cortejo. Su retroceso se debe sobre todo al clima: inviernos
      suaves y primaveras frescas con demasiada humedad en las primeras semanas de vida de los pollos. Los
      zorros, además, reducen las crías.


      Alrededor, la vida es discreta. [Ciervos](/especie/cervus_elaphus/) y
      [corzos](/especie/capreolus_capreolus/) pastan en los brezales; el turón es el carnívoro que más visita
      la turbera, seguido del armiño. Entre las aves anida el bisbita pratense bajo las macollas de hierba;
      entre las rapaces, el busardo ratonero, el [aguilucho pálido](/especie/circus_cyaneus/), el búho
      campestre y el mochuelo boreal, que anida en los abetales viejos desde 1963. Hay tres tritones, entre
      ellos el [tritón alpino](/especie/triturus_alpestris/), y solo tres reptiles: lagartija de turbera,
      lución y culebra de collar. Y la oruga de una mariposa, Boloria aquilonaris, se alimenta casi solo del
      arándano rojo de las turberas.


      Las zonas C del parque se cierran casi cada año de mediados de marzo a finales de junio por la cría del
      urogallo negro, incluso para grupos con guía.
    visit: >-
      Empieza por el centro de Botrange, sede administrativa del parque. Tiene exposiciones, películas y
      folletos, visitas guiadas regulares a turberas, brezales y bosques en fines de semana y festivos, y
      préstamo de botas de goma para quien quiera un paseo corto. A petición hay visitas por caminos
      accesibles en silla de ruedas. En el Haus Ternell, entre Eupen y Mützenich, hay un programa anual y un
      pequeño museo sobre el bosque.


      Hay tres senderos interpretativos: el del Poleûr, con un libro de acompañamiento que se vende en el
      centro; el de Neûr Lowé; y el de Ternell, de contenido geológico. Para caminar, los itinerarios de largo
      recorrido GR 573 y GR 56. Con AVES Ostkantone hay visitas ornitológicas guiadas. En invierno, el esquí
      de fondo se permite solo en pistas preparadas, situadas en los bordes o fuera de las reservas; la
      bicicleta se limita a una red señalizada en los bosques que rodean las reservas.


      Lleva botas de goma y paraguas: aquí llueve y nieva mucho.
    history: >-
      Hay huellas humanas desde hace siglos. El camino empedrado sobre una base de madera que cruza la turbera
      se creyó romano, pero se construyó en el siglo VII u VIII; los vecinos lo llaman «Pavée de Charlemagne».
      Los usos tradicionales (pastoreo, siega, extracción de turba) transformaron la mayor parte del bosque de
      frondosas en el brezal actual. En Baraque Michel, una familia tocaba cada tarde una campana para guiar a
      los viajeros perdidos en la niebla.


      La protección vino después. En 1966 el Consejo de Europa concedió a la zona su Diploma de Protección de
      la Naturaleza, y en 1971 se trazaron los límites del parque siguiendo elementos naturales y no
      administrativos. Las turberas que quedan sufren la contaminación del aire y las viejas zanjas que les
      quitan el agua; desde 1994 hay parcelas de prueba para reactivar las que se mueren. Se cerraron los
      caminos que cruzaban turberas intactas.
    before: >-
      El acceso está zonificado. Las zonas B abren de día; para entrar en las C hace falta un guía reconocido;
      las D están cerradas al público. Con tiempo seco se cierran todas las turberas salvo el pequeño Poleûr,
      y en los accesos se izan banderas rojas: no entres. Está prohibido encender fuego, acampar y vivaquear
      fuera de las zonas previstas, y en las reservas no se puede recolectar nada. En las pasarelas y senderos
      estrechos no se puede ir en bicicleta ni a caballo.
    around: >-
      El [Naturpark Our - Ourtal](/lugar/naturpark-our---ourtal/) queda a unos treinta kilómetros. Más lejos,
      el [Parque Natural de los Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/) comparte con las
      Hautes Fagnes el urogallo negro y los bosques maduros.
  en:
    intro: >-
      You climb through the "Venndach", between firs, and suddenly the forest ends. Before you opens a plateau
      of unfarmed peat bogs and heathland, with bog grass rippling as far as the eye can see. This is the
      Hautes Fagnes plateau, the largest peat bog massif in Belgium and the heart of the Hautes Fagnes–Eifel
      Nature Park, which extends over 72,000 hectares and twelve municipalities. Here, at 694 m at the Signal
      de Botrange, lies the summit of Belgium.
    landscape: >-
      The story begins with ice. At the end of the last glaciation, around 7,500 years ago, plants —
      especially sphagnum mosses — grew and decomposed incompletely in waterlogged soil, gradually building up
      thick layers of peat. Of the original peat bogs, covering around 1,000 hectares, today only about a
      hundred remain almost free of human influence. The landscape also features palsas, nearly circular
      hollows from the glacial era, several metres deep, where sphagnum established early and now hosts small,
      very ancient bogs.


      Water rules everything. The peat absorbs rain like a sponge, and what it cannot hold feeds the
      reservoirs of the neighbouring Eifel through streams.


      The colour changes with the season. In autumn the bog grass turns rusty orange; in winter and spring, a
      pale yellow. Twisted birches, eared willows, the odd fir and rowans give strange silhouettes. And
      beneath them, the dry heathland holds bilberry, bog bilberry and heather; on the raised bog grow bog
      rosemary, crowberry, round-leaved sundew and sphagnum mosses.
    wildlife: >-
      The [black grouse](/especie/tetrao_tetrix/) is the symbol. It is a relic of the last glaciation, and the
      Hautes Fagnes are one of its last refuges at the western edge of its range. The last count found about
      twenty males at their lekking sites. Its decline is due mainly to climate: mild winters and cool springs
      with too much moisture in the first weeks of the chicks' lives. Foxes also reduce breeding success.


      Around it, life is discreet. [Red deer](/especie/cervus_elaphus/) and [roe
      deer](/especie/capreolus_capreolus/) graze on the heathland; the polecat is the carnivore that most
      frequently visits the bog, followed by the stoat. Among the nesting birds is the meadow pipit, hidden in
      grass tussocks; among raptors the common buzzard, the [hen harrier](/especie/circus_cyaneus/), the
      short-eared owl and the boreal owl, which has nested in old fir stands since 1963. There are three newt
      species, including the [Alpine newt](/especie/triturus_alpestris/), and only three reptile species: the
      viviparous lizard, the slow worm and the grass snake. And the caterpillar of the butterfly Boloria
      aquilonaris feeds almost exclusively on bog bilberry.


      The C zones of the park close almost every year from mid-March to the end of June for the black grouse
      breeding season, even for guided groups.
    visit: >-
      Start at the Botrange centre, the park's administrative headquarters. It has exhibitions, films and
      leaflets, regular guided visits to bogs, heathlands and forests at weekends and on public holidays, and
      rubber boot loans for those wanting a short walk. Wheelchair-accessible path visits are available on
      request. At Haus Ternell, between Eupen and Mützenich, there is an annual programme and a small forest
      museum.


      There are three interpretive trails: the Poleûr trail, with a companion booklet sold at the centre; the
      Neûr Lowé trail; and the Ternell trail, with geological content. For longer walks, the GR 573 and GR 56
      long-distance routes. With AVES Ostkantone there are guided birdwatching visits. In winter,
      cross-country skiing is only allowed on prepared tracks, located at the edges of or outside the
      reserves; cycling is restricted to a signposted network in the forests surrounding the reserves.


      Bring rubber boots and an umbrella: it rains and snows a lot here.
    history: >-
      Human traces go back centuries. The stone road on a wooden base crossing the bog was believed to be
      Roman, but was actually built in the seventh or eighth century; locals call it the "Pavée de
      Charlemagne". Traditional uses — grazing, mowing, peat extraction — transformed most of the broadleaf
      forest into the current heathland. At Baraque Michel, a family rang a bell every evening to guide
      travellers lost in the fog.


      Protection came later. In 1966 the Council of Europe granted the area its Nature Protection Diploma, and
      in 1971 the park boundaries were drawn following natural rather than administrative features. The
      remaining bogs suffer from air pollution and old drainage ditches; since 1994 there have been trial
      plots to reactivate dying bogs. Tracks crossing intact bogs were closed.
    before: >-
      Access is zoned. B zones are open during the day; entering C zones requires a recognised guide; D zones
      are closed to the public. In dry weather all bogs except the small Poleûr are closed, and red flags are
      raised at the entrances: do not enter. It is forbidden to light fires, camp or bivouac outside
      designated areas, and nothing may be collected in the reserves. On the boardwalks and narrow paths,
      cycling and horse-riding are not permitted.
    around: >-
      The [Naturpark Our – Ourtal](/lugar/naturpark-our---ourtal/) lies about thirty kilometres away. Further
      afield, the [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) shares
      with the Hautes Fagnes the black grouse and mature forest habitats.
  fr:
    intro: >-
      Vous montez par le « Venndach », entre les sapins, et soudain la forêt s'arrête. Devant vous s'ouvre un
      plateau de tourbières et de landes incultes, avec l'herbe des tourbières ondulant à perte de vue. C'est
      le plateau des Hautes Fagnes, le plus grand massif tourbeux de Belgique et le cœur du Parc naturel
      Hautes Fagnes–Eifel, qui s'étend sur 72 000 hectares et douze communes. Ici, à 694 m au signal de
      Botrange, se trouve le sommet de la Belgique.
    landscape: >-
      L'histoire commence avec la glace. À la fin de la dernière glaciation, il y a environ 7 500 ans, les
      plantes — surtout les sphaignes — poussaient et se décomposaient à moitié dans un sol gorgé d'eau,
      formant progressivement d'épaisses couches de tourbe. Des tourbières d'origine, d'environ 1 000
      hectares, seules une centaine sont aujourd'hui presque exemptes d'influence humaine. Le paysage présente
      aussi des palsas, des creux presque circulaires de l'époque glaciaire, de plusieurs mètres de
      profondeur, où les sphaignes se sont installées tôt et où se trouvent aujourd'hui de petites tourbières
      très anciennes.


      L'eau règne en maître. La tourbe absorbe la pluie comme une éponge, et ce qu'elle ne retient pas
      alimente par des ruisseaux les réservoirs de l'Eifel voisine.


      La couleur change avec la saison. En automne, l'herbe des tourbières vire à l'orange rouillé ; en hiver
      et au printemps, à un jaune pâle. Des bouleaux tordus, des saules à oreillettes, quelques sapins et des
      sorbiers donnent des silhouettes étranges. Et sous eux, les landes sèches abritent myrtille, airelle
      rouge et bruyère ; sur la tourbière haute poussent romarin des marais, camarine, droséra à feuilles
      rondes et sphaignes.
    wildlife: >-
      Le [tétras lyre](/especie/tetrao_tetrix/) en est le symbole. C'est un relicte de la dernière glaciation,
      et les Hautes Fagnes sont l'un de ses derniers refuges à l'extrémité occidentale de son aire. Le dernier
      recensement a compté environ vingt mâles sur leurs places de parade. Son déclin est dû surtout au climat
      : hivers doux et printemps froids avec trop d'humidité dans les premières semaines de vie des poussins.
      Les renards réduisent également les nichées.


      Autour, la vie est discrète. [Cerfs](/especie/cervus_elaphus/) et
      [chevreuils](/especie/capreolus_capreolus/) paissent dans les landes ; le putois est le carnivore qui
      visite le plus la tourbière, suivi de l'hermine. Parmi les oiseaux nicheurs, le pipit des prés se cache
      sous les touffes d'herbe ; parmi les rapaces, la buse variable, le [busard
      Saint-Martin](/especie/circus_cyaneus/), le hibou des marais et la chouette de Tengmalm, qui niche dans
      les vieilles sapinières depuis 1963. Il y a trois espèces de tritons, dont le [triton
      alpestre](/especie/triturus_alpestris/), et seulement trois reptiles : le lézard vivipare, l'orvet et la
      couleuvre à collier. Et la chenille du papillon Boloria aquilonaris se nourrit presque exclusivement de
      l'airelle rouge des tourbières.


      Les zones C du parc ferment presque chaque année de mi-mars à fin juin pour la nidification du tétras
      lyre, même pour les groupes accompagnés.
    visit: >-
      Commencez par le centre de Botrange, siège administratif du parc. Il propose des expositions, des films
      et des dépliants, des visites guidées régulières des tourbières, des landes et des forêts les week-ends
      et jours fériés, et un prêt de bottes en caoutchouc pour ceux qui souhaitent une courte promenade. Des
      visites sur chemins accessibles en fauteuil roulant sont disponibles sur demande. À la Haus Ternell,
      entre Eupen et Mützenich, il y a un programme annuel et un petit musée sur la forêt.


      Trois sentiers interprétatifs existent : celui du Poleûr, avec un livret vendu au centre ; celui de Neûr
      Lowé ; et celui de Ternell, à contenu géologique. Pour la randonnée, les GR 573 et GR 56. Avec AVES
      Ostkantone, des sorties ornithologiques guidées sont proposées. En hiver, le ski de fond n'est autorisé
      que sur des pistes préparées, situées en bordure ou hors des réserves ; le vélo est limité à un réseau
      balisé dans les forêts entourant les réserves.


      Prenez des bottes en caoutchouc et un parapluie : il pleut et neige beaucoup ici.
    history: >-
      Des traces humaines remontent à des siècles. Le chemin pavé sur une base en bois qui traverse la
      tourbière a longtemps été cru romain, mais il a été construit au VII° ou VIII° siècle ; les habitants
      l'appellent « Pavée de Charlemagne ». Les usages traditionnels — pâturage, fauche, extraction de tourbe
      — ont transformé la majorité de la forêt feuillue en la lande actuelle. À Baraque Michel, une famille
      sonnait chaque soir une cloche pour guider les voyageurs égarés dans le brouillard.


      La protection est venue ensuite. En 1966, le Conseil de l'Europe a accordé à la zone son Diplôme de
      protection de la nature, et en 1971 les limites du parc ont été tracées en suivant des éléments naturels
      plutôt qu'administratifs. Les tourbières restantes souffrent de la pollution atmosphérique et des
      vieilles tranchées de drainage ; depuis 1994, des parcelles d'essai visent à réactiver celles qui
      dépérissent. Les chemins qui traversaient des tourbières intactes ont été fermés.
    before: >-
      L'accès est zoné. Les zones B sont ouvertes de jour ; pour entrer dans les zones C, un guide reconnu est
      nécessaire ; les zones D sont fermées au public. Par temps sec, toutes les tourbières sauf le petit
      Poleûr sont fermées, et des drapeaux rouges sont hissés aux accès : n'entrez pas. Il est interdit
      d'allumer un feu, de camper ou de bivouaquer hors des zones prévues, et rien ne peut être cueilli dans
      les réserves. Sur les passerelles et les sentiers étroits, le vélo et l'équitation sont interdits.
    around: >-
      Le [Naturpark Our – Ourtal](/lugar/naturpark-our---ourtal/) se trouve à une trentaine de kilomètres.
      Plus loin, le [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) partage
      avec les Hautes Fagnes le tétras lyre et les forêts matures.
  de:
    intro: >-
      Du steigst durch das „Venndach" zwischen Fichten auf, und plötzlich hört der Wald auf. Vor dir öffnet
      sich ein Plateau aus unbearbeiteten Mooren und Heiden, mit Moorwollgras, das bis zum Horizont wogt. Das
      ist das Plateau der Hautes Fagnes, Belgiens größter Moorkomplex und das Herz des Naturparks Hohes
      Venn–Eifel, der sich über 72 000 Hektar und zwölf Gemeinden erstreckt. Hier, auf 694 m am Signal de
      Botrange, liegt der Gipfel Belgiens.
    landscape: >-
      Die Geschichte beginnt mit dem Eis. Am Ende der letzten Eiszeit, vor etwa 7 500 Jahren, wuchsen Pflanzen
      — vor allem Torfmoose — und zersetzen sich nur zur Hälfte in durchnässtem Boden, und bildeten so nach
      und nach dicke Torfschichten. Von den ursprünglichen Mooren mit etwa 1 000 Hektar sind heute nur noch
      rund hundert Hektar nahezu frei von menschlichem Einfluss. In der Landschaft gibt es auch Palsas, nahezu
      kreisförmige Vertiefungen aus der Eiszeit von mehreren Metern Tiefe, in denen sich Torfmoose früh
      ansiedelten und die heute kleine, sehr alte Moore beherbergen.


      Wasser regiert alles. Der Torf saugt den Regen wie ein Schwamm auf, und was er nicht zurückhalten kann,
      speist über Bäche die Talsperren der benachbarten Eifel.


      Die Farbe wechselt mit den Jahreszeiten. Im Herbst wird das Moorwollgras rostbraun; im Winter und
      Frühling blassgelb. Verdrehte Birken, Ohrweiden, vereinzelte Fichten und Vogelbeerbäume geben seltsame
      Silhouetten. Und darunter beherbergen die trockenen Heiden Heidelbeere, Rauschbeere und Heidekraut; auf
      dem Hochmoor wachsen Sumpfrosmarin, Krähenbeere, Rundblättriger Sonnentau und Torfmoose.
    wildlife: >-
      Das [Birkhuhn](/especie/tetrao_tetrix/) ist das Symbol. Es ist ein Relikt der letzten Eiszeit, und das
      Hohe Venn ist eines seiner letzten Rückzugsgebiete am westlichen Rand seines Verbreitungsgebiets. Die
      letzte Zählung erfasste etwa zwanzig Hähne an ihren Balzplätzen. Sein Rückgang ist vor allem auf das
      Klima zurückzuführen: milde Winter und kühle Frühjahre mit zu viel Feuchtigkeit in den ersten
      Lebenswochen der Küken. Füchse reduzieren zusätzlich den Bruterfolg.


      Ringsherum ist das Leben unauffällig. [Rothirsche](/especie/cervus_elaphus/) und
      [Rehe](/especie/capreolus_capreolus/) grasen in den Heiden; der Iltis ist das Raubtier, das das Moor am
      häufigsten besucht, gefolgt vom Hermelin. Unter den Brutvögeln nistet der Wiesenpieper versteckt in
      Grashorsten; unter den Greifvögeln der Mäusebussard, die [Kornweihe](/especie/circus_cyaneus/), die
      Sumpfohreule und die Rauhfußkauz, die seit 1963 in alten Fichtenbeständen brütet. Es gibt drei
      Molcharten, darunter den [Bergmolch](/especie/triturus_alpestris/), und nur drei Reptilienarten:
      Waldeidechse, Blindschleiche und Ringelnatter. Und die Raupe des Schmetterlings Boloria aquilonaris
      ernährt sich fast ausschließlich von der Rauschbeere der Hochmoore.


      Die C-Zonen des Parks schließen fast jedes Jahr von Mitte März bis Ende Juni für die Birkhuhns Brutzeit,
      selbst für geführte Gruppen.
    visit: >-
      Beginne im Zentrum Botrange, dem Verwaltungssitz des Parks. Es bietet Ausstellungen, Filme und
      Broschüren, regelmäßige geführte Besuche von Mooren, Heiden und Wäldern an Wochenenden und Feiertagen
      sowie Gummistiefelverleih für einen kurzen Spaziergang. Rollstuhlgerechte Wegbesuche sind auf Anfrage
      möglich. Im Haus Ternell zwischen Eupen und Mützenich gibt es ein Jahresprogramm und ein kleines
      Waldmuseum.


      Es gibt drei Lehrpfade: den Poleûr-Pfad mit einem Begleitheft, das im Zentrum verkauft wird; den
      Neûr-Lowé-Pfad; und den Ternell-Pfad mit geologischem Schwerpunkt. Für Wanderungen bieten sich die
      Fernwanderwege GR 573 und GR 56 an. Mit AVES Ostkantone gibt es geführte Vogelbeobachtungsausflüge. Im
      Winter ist Langlauf nur auf präparierten Loipen erlaubt, die an den Rändern oder außerhalb der Reservate
      liegen; Fahrradfahren ist auf ein ausgeschildertes Netz in den Wäldern um die Reservate beschränkt.


      Bring Gummistiefel und einen Regenschirm: hier regnet und schneit es viel.
    history: >-
      Menschliche Spuren reichen Jahrhunderte zurück. Der gepflasterte Weg auf einem Holzunterbau, der das
      Moor überquert, galt lange als römisch, wurde aber tatsächlich im siebten oder achten Jahrhundert
      erbaut; die Einwohner nennen ihn „Pavée de Charlemagne". Traditionelle Nutzungen — Beweidung, Mahd,
      Torfstich — verwandelten den größten Teil des Laubwaldes in die heutige Heide. In der Baraque Michel
      läutete eine Familie jeden Abend eine Glocke, um im Nebel verirrte Wanderer zu führen.


      Der Schutz kam später. Im Jahr 1966 verlieh der Europarat der Zone sein Naturschutzdiplom, und im Jahr
      1971 wurden die Parkgrenzen entlang natürlicher statt administrativer Elemente gezogen. Die
      verbleibenden Moore leiden unter Luftverschmutzung und alten Entwässerungsgräben; seit 1994 gibt es
      Versuchsflächen zur Renaturierung absterbender Moore. Wege, die intakte Moore kreuzten, wurden
      geschlossen.
    before: >-
      Der Zugang ist in Zonen eingeteilt. B-Zonen sind tagsüber geöffnet; das Betreten der C-Zonen erfordert
      einen anerkannten Führer; D-Zonen sind für die Öffentlichkeit gesperrt. Bei trockener Witterung werden
      alle Moore außer dem kleinen Poleûr gesperrt, und rote Flaggen werden an den Zugängen gehisst: Zutritt
      verboten. Es ist verboten, Feuer zu machen, außerhalb der vorgesehenen Zonen zu zelten oder zu
      biwakieren; in den Reservaten darf nichts gesammelt werden. Auf den Stegbrücken und schmalen Wegen sind
      Fahrräder und Pferde nicht erlaubt.
    around: >-
      Der [Naturpark Our – Ourtal](/lugar/naturpark-our---ourtal/) liegt etwa dreißig Kilometer entfernt.
      Weiter weg teilt der [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/)
      mit dem Hohen Venn das Birkhuhn und alte Waldlebensräume.
  it:
    intro: >-
      Sali attraverso il "Venndach", tra gli abeti, e all'improvviso la foresta finisce. Davanti a te si apre
      un altopiano di torbiere e brughiere incolte, con la graminacea delle torbiere che ondeggia a perdita
      d'occhio. È l'altopiano delle Hautes Fagnes, il più grande massiccio torboso del Belgio e il cuore del
      Parco naturale Hautes Fagnes–Eifel, che si estende su 72 000 ettari e dodici comuni. Qui, a 694 m al
      Signal de Botrange, si trova la vetta del Belgio.
    landscape: >-
      La storia inizia con il ghiaccio. Alla fine dell'ultima glaciazione, circa 7 500 anni fa, le piante —
      soprattutto gli sfagni — crescevano e si decomponevano a metà in un suolo impregnato d'acqua, formando
      progressivamente spessi strati di torba. Delle torbiere originarie, di circa 1 000 ettari, oggi solo
      circa un centinaio sono quasi libere dall'influenza umana. Il paesaggio presenta anche palsa, cavità
      quasi circolari dell'era glaciale, di diversi metri di profondità, dove gli sfagni si sono insediati
      presto e oggi ospitano piccole torbiere molto antiche.


      L'acqua comanda tutto. La torba assorbe la pioggia come una spugna, e ciò che non trattiene alimenta
      attraverso ruscelli i bacini della vicina Eifel.


      Il colore cambia con la stagione. In autunno l'erba delle torbiere diventa arancione rugginoso; in
      inverno e primavera, giallo pallido. Betulle contorte, salici orecchiuti, qualche abete e sorbi danno
      sagome strane. E sotto di loro, le brughiere secche ospitano mirtillo, uva orsina e erica; sulla
      torbiera alta crescono rosmarino di palude, empetro, drosera a foglie rotonde e sfagni.
    wildlife: >-
      Il [fagiano di monte](/especie/tetrao_tetrix/) ne è il simbolo. È un relitto dell'ultima glaciazione, e
      le Hautes Fagnes sono uno dei suoi ultimi rifugi al margine occidentale del suo areale. L'ultimo
      censimento ha contato circa venti maschi nei loro siti di lekking. Il suo declino è dovuto soprattutto
      al clima: inverni miti e primavere fresche con troppa umidità nelle prime settimane di vita dei pulcini.
      Le volpi riducono inoltre il successo riproduttivo.


      Intorno, la vita è discreta. [Cervi](/especie/cervus_elaphus/) e
      [caprioli](/especie/capreolus_capreolus/) pascolano nelle brughiere; la puzzola è il carnivoro che
      visita più spesso la torbiera, seguito dall'ermellino. Tra gli uccelli nidificanti, il pispola si
      nasconde sotto i cespi d'erba; tra i rapaci, la poiana comune, il [nibbio
      reale](/especie/circus_cyaneus/), il gufo di palude e la civetta capogrosso, che nida nelle vecchie
      abetaie dal 1963. Ci sono tre specie di tritoni, tra cui il [tritone
      alpestre](/especie/triturus_alpestris/), e solo tre specie di rettili: la lucertola vivipara, il
      luscengola e il colubro a collare. E il bruco della farfalla Boloria aquilonaris si nutre quasi
      esclusivamente di uva orsina delle torbiere.


      Le zone C del parco chiudono quasi ogni anno da metà marzo a fine giugno per la nidificazione del
      fagiano di monte, anche per i gruppi con guida.
    visit: >-
      Inizia dal centro di Botrange, sede amministrativa del parco. Propone mostre, film e depliant, visite
      guidate regolari a torbiere, brughiere e foreste nei fine settimana e nei giorni festivi, e il prestito
      di stivali di gomma per chi vuole una breve passeggiata. Le visite su percorsi accessibili in sedia a
      rotelle sono disponibili su richiesta. Alla Haus Ternell, tra Eupen e Mützenich, ci sono un programma
      annuale e un piccolo museo della foresta.


      Esistono tre sentieri interpretativi: quello del Poleûr, con un libretto in vendita al centro; quello di
      Neûr Lowé; e quello di Ternell, con contenuto geologico. Per escursioni più lunghe, i sentieri di grande
      percorrenza GR 573 e GR 56. Con AVES Ostkantone ci sono uscite ornitologiche guidate. In inverno, lo sci
      di fondo è consentito solo su piste preparate, ai margini o fuori dalle riserve; la bicicletta è
      limitata a una rete segnalata nelle foreste che circondano le riserve.


      Porta stivali di gomma e un ombrello: qui piove e nevica molto.
    history: >-
      Le tracce umane risalgono a secoli fa. Il percorso lastricato su una base di legno che attraversa la
      torbiera era ritenuto romano, ma fu costruito nel settimo o ottavo secolo; gli abitanti lo chiamano
      "Pavée de Charlemagne". Gli usi tradizionali — pascolo, sfalcio, estrazione della torba — hanno
      trasformato la maggior parte della foresta decidua nell'attuale brughiera. Alla Baraque Michel, una
      famiglia suonava ogni sera una campana per guidare i viandanti smarriti nella nebbia.


      La protezione è arrivata dopo. Nel 1966 il Consiglio d'Europa ha assegnato alla zona il suo Diploma di
      protezione della natura, e nel 1971 i confini del parco sono stati tracciati seguendo elementi naturali
      anziché amministrativi. Le torbiere rimaste soffrono dell'inquinamento atmosferico e dei vecchi fossi di
      drenaggio; dal 1994 ci sono parcelle sperimentali per riattivare quelle che stanno morendo. I sentieri
      che attraversavano torbiere intatte sono stati chiusi.
    before: >-
      L'accesso è suddiviso in zone. Le zone B sono aperte di giorno; per entrare nelle zone C occorre una
      guida riconosciuta; le zone D sono chiuse al pubblico. Con tempo secco tutte le torbiere tranne il
      piccolo Poleûr vengono chiuse, e alle entrate vengono issate bandiere rosse: non entrare. È vietato
      accendere fuochi, campeggiare o bivaccare fuori dalle zone previste, e nelle riserve non si può
      raccogliere nulla. Sulle passerelle e sui sentieri stretti non sono consentite biciclette né cavalli.
    around: >-
      Il [Naturpark Our – Ourtal](/lugar/naturpark-our---ourtal/) si trova a circa trenta chilometri. Più
      lontano, il [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) condivide
      con le Hautes Fagnes il fagiano di monte e le foreste mature.
  pt:
    intro: >-
      Subes pelo "Venndach", entre abetos, e de repente a floresta acaba. À tua frente abre-se um planalto de
      turfeiras e charnecas incultas, com a gramínea das turfeiras a ondular até onde a vista alcança. É o
      planalto das Hautes Fagnes, o maior maciço turfoso da Bélgica e o coração do Parque Natural Hautes
      Fagnes–Eifel, que se estende por 72 000 hectares e doze municípios. Aqui, a 694 m no Signal de Botrange,
      fica o cume da Bélgica.
    landscape: >-
      A história começa com o gelo. No final da última glaciação, há cerca de 7 500 anos, as plantas —
      sobretudo os esfagnos — cresciam e decompunham-se a meias num solo encharcado, formando progressivamente
      espessas camadas de turfa. Das turfeiras originais, com cerca de 1 000 hectares, hoje apenas cerca de
      cem estão quase livres de influência humana. A paisagem apresenta também palsas, cavidades quase
      circulares da era glaciar, de vários metros de profundidade, onde os esfagnos se instalaram cedo e hoje
      albergam pequenas e muito antigas turfeiras.


      A água manda em tudo. A turfa absorve a chuva como uma esponja, e o que não retém alimenta através de
      ribeiros as albufeiras da vizinha Eifel.


      A cor muda com a estação. No outono a gramínea das turfeiras fica cor de ferrugem; no inverno e
      primavera, amarelo pálido. Bétulas retorcidas, salgueiros-de-orelha, algum abeto e sorveiras dão
      silhuetas estranhas. E por baixo delas, as charnecas secas têm mirtilo, uva-do-monte e urze; na turfeira
      alta crescem rosmaninho-do-pântano, camarina, drosera-de-folha-redonda e esfagnos.
    wildlife: >-
      O [galo-lira](/especie/tetrao_tetrix/) é o símbolo. É uma relíquia da última glaciação, e as Hautes
      Fagnes são um dos seus últimos refúgios no limite ocidental da sua área de distribuição. O último
      recenseamento contou cerca de vinte machos nos seus locais de exibição. O seu declínio deve-se sobretudo
      ao clima: invernos suaves e primaveras frescas com demasiada humidade nas primeiras semanas de vida das
      crias. As raposas reduzem também o sucesso reprodutor.


      À volta, a vida é discreta. [Veados](/especie/cervus_elaphus/) e [corços](/especie/capreolus_capreolus/)
      pastam nas charnecas; o furão-europeu é o carnívoro que mais frequentemente visita a turfeira, seguido
      do arminho. Entre as aves nidificantes, a petinha-dos-prados esconde-se sob as touceiras de erva; entre
      os raptores, o açor-comum, o [tartaranhão-cinzento](/especie/circus_cyaneus/), o mocho-do-nabal e o
      mocho-boreal, que nidifica em abetais velhos desde 1963. Há três espécies de tritões, incluindo o
      [tritão-alpino](/especie/triturus_alpestris/), e apenas três espécies de répteis: a lagartixa-vivípara,
      o licranço e a cobra-de-água. E a lagarta da borboleta Boloria aquilonaris alimenta-se quase
      exclusivamente da uva-do-monte das turfeiras.


      As zonas C do parque fecham quase todos os anos de meados de março ao final de junho para a nidificação
      do galo-lira, mesmo para grupos com guia.
    visit: >-
      Começa pelo centro de Botrange, sede administrativa do parque. Tem exposições, filmes e folhetos,
      visitas guiadas regulares a turfeiras, charnecas e florestas aos fins de semana e feriados, e empréstimo
      de galochas para quem quiser uma pequena caminhada. As visitas em percursos acessíveis a cadeira de
      rodas estão disponíveis mediante pedido. Na Haus Ternell, entre Eupen e Mützenich, há um programa anual
      e um pequeno museu sobre a floresta.


      Existem três trilhos interpretativos: o do Poleûr, com um caderno de acompanhamento à venda no centro; o
      de Neûr Lowé; e o de Ternell, de conteúdo geológico. Para caminhadas mais longas, os percursos de grande
      rota GR 573 e GR 56. Com a AVES Ostkantone há saídas ornitológicas guiadas. No inverno, o esqui de fundo
      só é permitido em pistas preparadas, situadas nas margens ou fora das reservas; a bicicleta fica
      limitada a uma rede sinalizada nas florestas em redor das reservas.


      Leva galochas e chapéu de chuva: aqui chove e neva muito.
    history: >-
      Os vestígios humanos remontam a séculos. O caminho empedrado sobre uma base de madeira que atravessa a
      turfeira foi durante muito tempo considerado romano, mas foi construído no século sete ou oito; os
      moradores chamam-lhe "Pavée de Charlemagne". Os usos tradicionais — pastoreio, ceifa, extracção de turfa
      — transformaram a maior parte da floresta de folha caduca na charneca actual. Na Baraque Michel, uma
      família tocava todas as noites um sino para guiar os viajantes perdidos no nevoeiro.


      A protecção veio depois. Em 1966 o Conselho da Europa atribuiu à zona o seu Diploma de Protecção da
      Natureza, e em 1971 os limites do parque foram traçados seguindo elementos naturais e não
      administrativos. As turfeiras restantes sofrem com a poluição do ar e os velhos valas de drenagem; desde
      1994 há parcelas de ensaio para reactivar as que estão a morrer. Os caminhos que atravessavam turfeiras
      intactas foram fechados.
    before: >-
      O acesso é zonado. As zonas B estão abertas de dia; para entrar nas zonas C é necessário um guia
      reconhecido; as zonas D estão encerradas ao público. Com tempo seco todas as turfeiras à excepção do
      pequeno Poleûr são fechadas e içam-se bandeiras vermelhas nas entradas: não entres. É proibido acender
      fogueiras, acampar ou bivouacar fora das zonas previstas, e nas reservas nada pode ser colhido. Nas
      passarelas e caminhos estreitos não são permitidas bicicletas nem cavalos.
    around: >-
      O [Naturpark Our – Ourtal](/lugar/naturpark-our---ourtal/) fica a cerca de trinta quilómetros. Mais
      longe, o [Parco Naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/) partilha com
      as Hautes Fagnes o galo-lira e as florestas maduras.
