resumen:
  es: >-
    El único Parque Nacional de Cataluña, meca de los lagos de circo glaciar albergando más de 200 estanques
    (*estanys*) bajo las icónicas cumbres de Els Encantats.
  en: >-
    The only National Park in Catalonia, a glacial circus wonderland harboring over 200 tarns (*estanys*)
    beneath the iconic twin summits of Els Encantats.
  fr: >-
    L'unique parc national de Catalogne, haut lieu des lacs de cirque glaciaire abritant plus de 200 étangs
    (*estanys*) sous les aiguilles emblématiques des Encantats.
  de: >-
    Kataloniens einziger Nationalpark, ein Mekka glazialer Karstseen mit über 200 Bergseen (*estanys*) unter
    den markanten Felszacken der Encantats.
  it: >-
    L'unico parco nazionale della Catalogna, autentica mecca dei laghi glaciali d'alta quota con oltre 200
    specchi d'acqua (*estanys*) ai piedi delle vette di Els Encantats.
  pt: >-
    O único Parque Nacional da Catalunha, santuário de lagoas glaciares albergando mais de 200 lagoas
    (*estanys*) sob os picos icónicos de Els Encantats.
unico:
  es: >-
    En un solo recinto de alta montaña conviven los lagos glaciares, los agudos Encantats junto al lago de
    Sant Maurici y un llano, el de Aigüestortes, que fue lago y dio nombre a todo.
  en: >-
    Within a single high-mountain sanctum coexist glacial tarns, the jagged peaks of Els Encantats beside Lake
    Sant Maurici, and a braided alluvial plain—Aigüestortes—that was once a lake and gave the park its name.
  fr: >-
    Dans un seul sanctuaire de haute montagne coexistent des lacs glaciaires, les pics acérés des Encantats
    dominant le lac de Sant Maurici et une plaine alluviale, celle d'Aigüestortes, qui fut jadis un lac et
    donna son nom à l'ensemble.
  de: >-
    In einem einzigen Hochgebirgsrefugium vereinen sich eiszeitliche Karseen, die steilen Encantats-Gipfel am
    See Sant Maurici und die Schwemmebene von Aigüestortes, die einst ein See war und dem Park seinen Namen
    gab.
  it: >-
    In un unico santuario d'alta montagna coesistono laghi glaciali, le vette aguzze di Els Encantats a
    ridosso del lago di Sant Maurici e una piana alluvionale, quella di Aigüestortes, che fu un lago e diede
    il nome all'intera area.
  pt: >-
    Num único enclave de alta montanha coexistem lagoas glaciares, os picos pontiagudos de Els Encantats junto
    ao lago de Sant Maurici e uma planície aluvial, a de Aigüestortes, que outrora foi lago e deu nome ao
    conjunto.
observaciones:
  es: >-
    Dentro del parque no se puede cazar, pescar ni capturar animales, y tampoco encender fuego. No se permite
    el baño ni las actividades acuáticas en ríos, barrancos y lagos, y hay que seguir los caminos señalizados.
    Lleva equipo adecuado: en la alta montaña el tiempo cambia bruscamente. En caso de emergencia, todos los
    refugios de montaña tienen una radio conectada con los Bomberos de la Generalitat de Catalunya. En
    invierno, antes de salir, consulta con alguna de las dos Casas del Parque el estado de los accesos.
texto:
  es:
    intro: >-
      Los glaciares excavaron los valles de este sector de los Pirineos y dejaron el paisaje que hoy recorres:
      picos puntiagudos, crestas recortadas, grandes circos en las cabeceras de los valles y lagos excavados
      en la roca. El Parque Nacional de Aigüestortes y Estany de Sant Maurici guarda numerosos lagos, un
      granito de unos 300 millones de años y una llanura donde un río hace meandros entre ciénagas, prados y
      pinos negros.
    landscape: >-
      Empieza por la roca. El núcleo del parque es una gran masa de granito de unos 300 millones de años que
      afloró por la tectónica y la erosión; alrededor, pizarras y calizas metamorfizadas ocupan los márgenes.
      De esas calizas metamórficas son los Encantats, las cimas más emblemáticas del parque.


      Después vinieron los glaciares. Excavaron los circos, que tienen forma de anfiteatro y paredes casi
      verticales: destacan los de Amitges, con sus famosas agujas, y el de Colomèrs, uno de los mayores. Los
      lagos ocupan distintas posiciones en ese relieve: la mayoría están en la base de los circos y suelen ser
      los más profundos, mientras que los de Sant Maurici y Llong ocupan el fondo de valles.


      El llano de Aigüestortes tiene su propia historia. Fue un antiguo lago que los sedimentos de ríos y
      barrancos acabaron rellenando por completo. Hoy el río de Sant Nicolau serpentea por él entre ciénagas,
      prados y pinos negros, y unas pasarelas de madera permiten recorrerlo incluso en silla de ruedas.


      La altura lo ordena todo. Entre las cotas bajas, de 1200 m, y la cumbre más alta, de 3029 m, se suceden
      los pisos de vegetación. En el montano, hasta unos 1800 m, crecen bosques caducifolios con roble
      pubescente y haya, muchas veces sustituidos por pinares de pino silvestre. Los abetos ocupan las umbrías
      y no suben mucho más de 2000 m; por encima, el pino negro forma bosques claros con rododendro y
      arándano. Y arriba están los prados alpinos, con la genciana alpina, el ranúnculo de los Pirineos y la
      silene acaule. En los lagos, las fuentes y las turberas florecen el ranúnculo acuático y las orquídeas,
      y vive una planta carnívora, la atrapamoscas. En el entorno del parque, al norte del Pallars Sobirà,
      está el abetar de la Mata de València.
    wildlife: >-
      En el parque viven 200 especies de vertebrados, aunque verlas exige agudizar los sentidos. Entre los
      mamíferos destacan el [rebeco](/especie/rupicapra_pyrenaica/), el [jabalí](/especie/sus_scrofa/), el
      armiño, la [marmota](/especie/marmota_marmota/) y el [corzo](/especie/capreolus_capreolus/).


      Las aves son el grupo más numeroso. En los bosques más inaccesibles habitan el [pito
      negro](/especie/dryocopus_martius/), el [urogallo](/especie/tetrao_urogallus/), la lechuza de Tengmalm y
      el piquituerto. Sobre las laderas y las crestas sin vegetación vuelan el [buitre
      leonado](/especie/gyps_fulvus/), el [águila real](/especie/aquila_chrysaetos/) y el
      [quebrantahuesos](/especie/gypaetus_barbatus/). Y en los prados alpinos, la [perdiz
      nival](/especie/lagopus_muta/), el [acentor alpino](/especie/prunella_collaris/), el gorrión alpino y la
      chova piquigualda.


      El agua guarda lo más raro: el tritón pirenaico destaca por su rareza entre los anfibios, y la [trucha
      común](/especie/salmo_trutta/) encuentra su hábitat en las aguas limpias y frías. De los reptiles, la
      víbora áspid y la culebra lisa europea; la primera es venenosa.


      El calendario es el de la montaña. Entre finales de noviembre y principios de mayo casi todo el parque
      está nevado y hace falta equipo de invierno y conocimientos de nieve y aludes. Dentro del parque se
      practican también las raquetas de nieve y el esquí de travesía. Para caminar, la temporada va de junio a
      octubre.
    visit: >-
      Las dos puertas tradicionales son Boí y Espot. Desde Boí se llega al llano de Aigüestortes; desde Espot,
      al lago de Sant Maurici. Ir de un lado a otro en coche son unas dos horas por carreteras de montaña, así
      que lo primero es decidir qué valle visitar. El acceso a pie está permitido; las bicicletas solo llegan
      hasta los puntos de información de Sant Maurici y Aigüestortes. En Espot y Boí hay transporte público
      autorizado para subir al lago de Sant Maurici y al llano de Aigüestortes, respectivamente.


      Empieza por la Casa del Parque de Boí o la de Espot. Informan todo el año, tienen una exposición
      permanente (la de Espot presenta a los tres protagonistas del parque: la roca, el agua y la vida) y
      reparten folletos con los itinerarios más recomendables de cada valle, que se hacen en una mañana o,
      como máximo, en un día. En Llessui está el Ecomuseo de los Pastores de la Vall d'Àssua; en Senet, una
      exposición sobre la relación del hombre y los animales; y en la estación superior del teleférico del
      lago Gento, abierto en verano, un pequeño centro con excursiones guiadas y una exposición sobre el agua.


      Para empezar por Boí, las pasarelas del llano de Aigüestortes permiten recorrer sus meandros; el tramo
      adaptado se encuentra dentro del llano. En el sector de Espot, el camino del aparcamiento del Prat de
      Pierró al lago de Sant Maurici requiere 1 h 15 min de ida y salva 260 m. Desde el lago, el circuito por
      la cascada de Ratera, su lago y el mirador de Sant Maurici lleva 2 h 30 min y tiene 300 m de desnivel.
      La subida a las Agujas de Amitges es otra opción desde Ratera. El GR-11, el sendero transpirenaico,
      cruza el parque de lado a lado.


      Para quien tenga más días, Camins vius da la vuelta al parque por los pueblos de alrededor y recupera
      los antiguos caminos anteriores a las carreteras. Carros de foc enlaza refugios guardados en un
      circuito: para recorrerlo caminando se recomienda un mínimo de cuatro días.
    history: >-
      Se declaró parque nacional el 21 de octubre de 1955 con 9851 ha, el quinto de España y el segundo de los
      Pirineos tras Ordesa. La zona interna, la de parque nacional estricto, tiene hoy 14.119 hectáreas, y una
      zona periférica la rodea con protección gradual.


      La explotación hidroeléctrica de los Pirineos, desde la primera mitad del siglo XX, alteró profundamente
      el paisaje; los aprovechamientos del agua forman parte de su historia junto con la ganadería. En la Vall
      de Boí, el conjunto románico, con iglesias como Sant Climent y Santa Maria de Taüll, es Patrimonio
      Mundial de la UNESCO desde el 30 de noviembre de 2000.
    before: >-
      Dentro del parque no se puede cazar, pescar ni capturar animales, y tampoco encender fuego. No se
      permite el baño ni las actividades acuáticas en ríos, barrancos y lagos, y hay que seguir los caminos
      señalizados. Lleva equipo adecuado: en la alta montaña el tiempo cambia bruscamente. En caso de
      emergencia, todos los refugios de montaña tienen una radio conectada con los Bomberos de la Generalitat
      de Catalunya. En invierno, antes de salir, consulta con alguna de las dos Casas del Parque el estado de
      los accesos.
    around: >-
      Lejos, otros parques de alta montaña comparten con Aigüestortes sus especies y paisajes glaciares: el
      [Parc national des Pyrénées](/lugar/parc-national-des-pyrenees/), con rebeco y marmota, y el [Parco
      Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), con marmota y quebrantahuesos.
  en:
    intro: >-
      Glaciers gouged out the valleys of this Pyrenean sector, leaving the rugged landscape you traverse
      today: sharp horns, jagged ridgelines, sweeping amphitheatres at valley heads, and rock-carved tarns.
      Aigüestortes and Estany de Sant Maurici National Park preserves countless alpine lakes,
      300-million-year-old granite batholiths, and a wide meadowed plain where a river meanders freely among
      peat bogs, lush meadows, and mountain pines.
    landscape: >-
      Begin with the stone. The core of the park is a massive granite pluton around 300 million years old that
      surfaced through tectonic uplift and continuous erosion; metamorphic slates and limestones frame the
      outer edges. It is from these metamorphic limestones that Els Encantats—the park's most emblematic twin
      peaks—are carved.


      Then came the glaciers. They scooped out deep cirques with near-vertical amphitheatre walls, most
      notably Amitges with its famous granite needles, and Colomèrs, one of the largest in the range. Alpine
      tarns occupy different tiers within this topography: most lie nested at the base of high cirques and
      plunge to the greatest depths, while Sant Maurici and Estany Llong occupy lower valley floors.


      The plain of Aigüestortes tells its own story. It was once a large glacial lake that river sediments and
      mountain torrents gradually filled completely. Today the river of Sant Nicolau meanders lazily across it
      between wetlands, boggy lawns, and mountain pines, where wooden boardwalks allow you to explore even in
      a wheelchair.


      Elevation orchestrates everything. Between lower elevations at 1200 m and the highest peak at 3029 m,
      vegetation belts succeed one another with precision. In the montane belt up to roughly 1800 m grow
      deciduous woodlands of downy oak and beech, frequently replaced by Scots pine forests. Silver firs favor
      sheltered north-facing slopes, rarely rising above 2000 m; above them, mountain pine forms open
      subalpine forests carpeted with rhododendron and bilberry. Higher still stretch alpine meadows speckled
      with alpine gentian, Pyrenean buttercup, and moss campion. In lakes, springs, and peat bogs thrive
      water-crowfoot, delicate wild orchids, and a small carnivorous plant, the round-leaved sundew. Bordering
      the park to the north of Pallars Sobirà lies the expansive fir forest of Mata de València.
    wildlife: >-
      Some 200 vertebrate species inhabit the park, though spotting them requires keen patience. Notable
      mammals include the [Pyrenean chamois](/especie/rupicapra_pyrenaica/), [wild
      boar](/especie/sus_scrofa/), ermine, [Alpine marmot](/especie/marmota_marmota/), and [roe
      deer](/especie/capreolus_capreolus/).


      Birds are the most diverse group. Deep in inaccessible forests dwell the [black
      woodpecker](/especie/dryocopus_martius/), [western capercaillie](/especie/tetrao_urogallus/), boreal
      owl, and red crossbill. Soaring above scree slopes and barren ridges are the [griffon
      vulture](/especie/gyps_fulvus/), [golden eagle](/especie/aquila_chrysaetos/), and [bearded
      vulture](/especie/gypaetus_barbatus/). Across alpine grasslands you can encounter the [rock
      ptarmigan](/especie/lagopus_muta/), [Alpine accentor](/especie/prunella_collaris/), white-winged
      snowfinch, and yellow-billed chough.


      Cold mountain waters hold rare gems: the Pyrenean brook salamander is an endemic amphibian of clean
      torrents, while [sea trout](/especie/salmo_trutta/) thrives in the pristine, icy currents. Among
      reptiles, look out for the asp viper and smooth snake; the former is venomous.


      The mountain calendar dictates access. From late November through early May nearly the entire park lies
      buried under deep snow, demanding winter mountaineering gear and thorough avalanche knowledge.
      Snowshoeing and ski mountaineering are popular winter pursuits. For foot hiking, the main season runs
      from June to October.
    visit: >-
      The two traditional gateways are Boí and Espot. Boí provides access to the Aigüestortes plain; Espot
      leads to Lake Sant Maurici. Driving between them takes around two hours along winding mountain roads, so
      your first task is choosing which valley to explore. Access on foot is free; bicycles are only permitted
      as far as the information checkpoints at Sant Maurici and Aigüestortes. Authorized public shuttle taxi
      services operate from Espot and Boí up to Lake Sant Maurici and the Aigüestortes plain, respectively.


      Begin your trip at the Park House in Boí or Espot. Open year-round, they feature permanent exhibits
      (Espot interprets the park's three pillars: rock, water, and life) and provide trail leaflets for the
      best itineraries in each valley, designed for half-day or full-day excursions. In Llessui you will find
      the Shepherd Ecomuseum of the Vall d'Àssua; in Senet, an exhibit exploring human-wildlife relationships;
      and at the top station of the Lake Gento cable car, open in summer, an information hut offering guided
      outings and an exhibit on hydropower.


      From Boí, wooden boardwalks allow you to walk among the braided meanders of Aigüestortes, with an
      accessible adapted section right across the meadow. On the Espot side, the trail from Prat de Pierró car
      park up to Lake Sant Maurici takes 1 h 15 min and climbs 260 m. From the lake, a loop via the Ratera
      waterfall, its upper tarn, and the Sant Maurici viewpoint takes 2 h 30 min with 300 m of ascent. Hiking
      up to the Needles of Amitges is another classic extension. The GR 11 trans-Pyrenean route crosses the
      park from east to west.


      For trekkers with several days, Camins vius circles the perimeter connecting historic villages along
      ancient mule tracks. The famous Carros de Foc connects staffed mountain huts in a high-altitude circuit:
      completing it on foot requires at least four days.
    history: >-
      The area was declared a national park on 21 October 1955 encompassing 9851 ha, becoming Spain's fifth
      national park and the second in the Pyrenees after Ordesa. The inner national park core spans 14,119
      hectares today, wrapped by a peripheral buffer zone providing graduated protection.


      Hydroelectric development in the Pyrenees during the first half of the twentieth century profoundly
      reshaped the landscape; water harnessing remains an integral part of local history alongside traditional
      pastoral livestock grazing. In the Vall de Boí, the cluster of Catalan Romanesque churches, including
      Sant Climent and Santa Maria de Taüll, was declared a UNESCO World Heritage Site on 30 November 2000.
    before: >-
      Hunting, fishing, capturing wildlife, and lighting open fires are strictly prohibited within the park.
      Swimming and water sports in rivers, tarns, and streams are forbidden, and you must remain on designated
      trails. Carry alpine equipment: mountain weather changes abruptly. In an emergency, all mountain huts
      are equipped with emergency radio links to the Catalan Fire and Rescue Service. In winter, always check
      road and trail conditions with one of the two Park Houses before setting out.
    around: >-
      Farther afield, other high-mountain national parks share glacial landscapes and Pyrenean wildlife: the
      [Pyrénées National Park](/lugar/parc-national-des-pyrenees/), with Pyrenean chamois and marmots, and the
      [Gran Paradiso National Park](/lugar/parco-nazionale-gran-paradiso/), with marmots and bearded vultures.
  fr:
    intro: >-
      Les glaciers ont façonné les vallées de ce secteur pyrénéen, sculptant le relief que vous parcourez
      aujourd'hui : cimes aiguës, arêtes dentelées, vastes cirques en tête de vallée et lacs creusés dans le
      roc. Le parc national d'Aigüestortes et du lac Saint-Maurice rassemble d'innombrables lacs, un granite
      vieux de 300 millions d'années et une plaine alluviale où une rivière serpente en méandres entre
      tourbières, prairies et pins à crochets.
    landscape: >-
      Tout commence par la roche. Le cœur du parc est un vaste batholite de granite vieux d'environ 300
      millions d'années, mis au jour par la tectonique et l'érosion ; tout autour, schistes et calcaires
      métamorphisés bordent le massif. C'est dans ces calcaires métamorphiques que sont taillés les Encantats,
      les aiguilles jumelles les plus emblématiques du parc.


      Puis vinrent les glaciers. Ils ont creusé des cirques en amphithéâtre aux parois quasi verticales :
      remarquables sont ceux d'Amitges, avec ses célèbres aiguilles, et de Colomèrs, l'un des plus vastes de
      la chaîne. Les lacs occupent différents étages : la plupart nichent au fond des cirques et comptent
      parmi les plus profonds, tandis que ceux de Sant Maurici et d'Estany Llong s'étalent en fond de vallée.


      Le plateau d'Aigüestortes possède sa propre genèse. C'était un ancien lac glaciaire que les alluvions
      des torrents ont fini par combler entièrement. Aujourd'hui, la rivière de Sant Nicolau y serpente au
      milieu des marais, des pelouses tourbeuses et des pins à crochets, et des passerelles en bois permettent
      de le parcourir même en fauteuil roulant.


      L'altitude commande la vie végétale. Entre les points bas à 1200 m et le point culminant à 3029 m se
      succèdent les étages écologiques. À l'étage montagnard, jusqu'à environ 1800 m, croissent des forêts de
      chêne pubescent et de hêtre, souvent relayées par des pinèdes de pin sylvestre. Le sapin pectiné
      s'épanouit sur les versants ombragés et ne dépasse guère 2000 m ; au-dessus, le pin à crochets forme des
      bois clairs à sous-bois de rhododendron et de myrtille. Plus haut s'étendent les pelouses alpines où
      fleurissent la gentiane alpine, la renoncule des Pyrénées et la silène acaule. Dans les tourbières et
      étangs prospèrent renoncules aquatiques, orchidées sauvages et une plante carnivore, la droséra. En
      bordure nord du parc, dans le Pallars Sobirà, se dresse la remarquable sapinière de la Mata de València.
    wildlife: >-
      Le parc héberge 200 espèces de vertébrés, même si leur observation exige un sens aigu de l'affût. Parmi
      les mammifères figurent l'[isard](/especie/rupicapra_pyrenaica/), le [sanglier](/especie/sus_scrofa/),
      l'hermine, la [marmotte des Alpes](/especie/marmota_marmota/) et le
      [chevreuil](/especie/capreolus_capreolus/).


      Les oiseaux représentent le groupe le plus riche. Dans les vieilles forêts vivent le [pic
      noir](/especie/dryocopus_martius/), le [grand tétras](/especie/tetrao_urogallus/), la chouette de
      Tengmalm et le bec-croisé des sapins. Au-dessus des crêtes dénudées planent le [vautour
      fauve](/especie/gyps_fulvus/), l'[aigle royal](/especie/aquila_chrysaetos/) et le [gypaète
      barbu](/especie/gypaetus_barbatus/). Dans les alpages nichent le [lagopède
      alpin](/especie/lagopus_muta/), l'[accenteur alpin](/especie/prunella_collaris/), la niverolle alpine et
      le chocard à bec jaune.


      Les eaux pures recèlent des trésors : le calotriton des Pyrénées est un amphibien endémique des
      ruisseaux froids, tandis que la [truite fario](/especie/salmo_trutta/) s'épanouit dans les torrents
      limpides. Chez les reptiles, la vipère aspic et la coronelle lisse sont présentes ; la première est
      venimeuse.


      Le rythme est dicté par la haute montagne. De fin novembre à début mai, la majeure partie du parc est
      enneigée et exige matériel d'hiver et connaissance des avalanches. Raquettes et ski de randonnée y sont
      très pratiqués. Pour la randonnée pédestre, la saison s'étend de juin à octobre.
    visit: >-
      Les deux portes d'entrée historiques sont Boí et Espot. Boí donne accès au plateau d'Aigüestortes ;
      Espot dessert le lac Saint-Maurice. Passer d'un versant à l'autre en voiture demande deux heures par les
      routes d'altitude, il convient donc de choisir sa vallée. L'accès à pied est libre ; les vélos ne sont
      autorisés que jusqu'aux postes d'accueil de Sant Maurici et d'Aigüestortes. À Espot et Boí, des navettes
      et taxis autorisés permettent de monter respectivement au lac Saint-Maurice et au plateau
      d'Aigüestortes.


      Commencez par la Maison du Parc de Boí ou d'Espot. Ouvertes toute l'année, elles proposent des
      expositions permanentes (celle d'Espot détaille les trois piliers du parc : le rocher, l'eau et la vie)
      et des topos-guides pour des sorties d'une demi-journée ou d'un jour. À Llessui se visite l'Écomusée des
      bergers de la Vall d'Àssua ; à Senet, un espace dédié aux rapports homme-animal ; et au terminus du
      téléphérique du lac Gento, ouvert l'été, un centre propose sorties guidées et exposition sur
      l'hydroélectricité.


      Côté Boí, les passerelles d'Aigüestortes parcourent les méandres alluviaux avec un tracé accessible aux
      personnes à mobilité réduite. Côté Espot, le chemin reliant le parking de Prat de Pierró au lac
      Saint-Maurice demande 1 h 15 min de montée pour 260 m de dénivelé. Depuis le lac, la boucle vers la
      cascade de Ratera, son étang et le belvédère de Sant Maurici requiert 2 h 30 min et 300 m de dénivelé.
      L'ascension vers les aiguilles d'Amitges est un prolongement classique. Le GR 11, grande traversée
      pyrénéenne, traverse le parc de part en part.


      Pour les marcheurs au long cours, Camins vius fait le tour du parc en reliant les villages par les
      chemins muletiers ancestraux. Le circuit Carros de Foc relie les refuges gardés en altitude : comptez au
      minimum quatre jours pour en faire le tour complet.
    history: >-
      Le site a été déclaré parc national le 21 octobre 1955 sur 9851 ha, devenant le cinquième parc national
      d'Espagne et le deuxième des Pyrénées après Ordesa. La zone centrale compte aujourd'hui 14 119 hectares,
      entourée d'une vaste zone périphérique de protection.


      L'essor hydroélectrique pyrénéen dès la première moitié du XXe siècle a fortement transformé les
      paysages d'altitude ; l'aménagement des eaux fait partie intégrante de l'histoire locale aux côtés de
      l'agropastoralisme traditionnel. Dans la Vall de Boí, les églises romanes catalanes, dont Sant Climent
      et Santa Maria de Taüll, sont classées au Patrimoine mondial de l'UNESCO depuis le 30 novembre 2000.
    before: >-
      À l'intérieur du parc, chasse, pêche, capture d'animaux et feux sont rigoureusement interdits. La
      baignade et les activités nautiques dans les rivières, torrents et lacs sont prohibées, et vous devez
      rester sur les chemins balisés. Prévoyez un équipement de montagne : la météo change brutalement. En cas
      d'urgence, tous les refuges disposent d'une liaison radio directe avec les secours de Catalogne. En
      hiver, consultez l'une des Maisons du Parc pour vérifier la praticabilité des accès.
    around: >-
      D'autres grands massifs alpins et pyrénéens partagent ces paysages glaciaires et cette faune d'altitude
      : le [Parc national des Pyrénées](/lugar/parc-national-des-pyrenees/), avec l'isard et la marmotte, et
      le [Parc national du Grand Paradis](/lugar/parco-nazionale-gran-paradiso/), avec la marmotte et le
      gypaète barbu.
  de:
    intro: >-
      Gletscher gruben einst die Täler dieses Pyrenäensektors aus und schufen das Hochgebirgsrelief, das du
      heute durchwanderst: steile Hörner, schroffe Grate, gewaltige Kare an den Talschlüssen und tief ins
      Gestein geschliffene Bergseen. Der Nationalpark Aigüestortes i Estany de Sant Maurici birgt unzählige
      Karseen, rund 300 Millionen Jahre alten Granit und eine weite Schwemmebene, auf der ein Fluss zwischen
      Mooren, Wiesen und Bergkiefern mäandriert.
    landscape: >-
      Alles beginnt beim Gestein. Das Herzstück des Parks bildet ein mächtiger Granitpluton von etwa 300
      Millionen Jahren Alter, der durch Hebung und Erosion freigelegt wurde; schiefrige und kalkige metamorphe
      Gesteine säumen die Ränder. Aus diesen metamorphen Kalken ragen die Encantats empor, die markantesten
      Doppelgipfel des Schutzgebiets.


      Später folgten die Gletscher. Sie frästen tiefe Talkare mit fast senkrechten Felswänden heraus:
      herausragend sind Amitges mit seinen berühmten Granitnadeln und Colomèrs, eines der größten Kare der
      Pyrenäen. Die Seen staffeln sich in verschiedenen Höhenlagen: die meisten ruhen auf dem Grund der
      Hochkare und zählen zu den tiefsten Gewässern, während Sant Maurici und Estany Llong weite Talböden
      ausfüllen.


      Die Hochebene von Aigüestortes besitzt eine eigene Entstehungsgeschichte. Sie war einst ein großer
      Gletschersee, den Geröll und Schwebstoffe im Lauf der Jahrtausende vollständig auffüllten. Heute
      mäandriert der Fluss Sant Nicolau träge zwischen Feuchtgebieten, Wollgrasmooren und Bergkiefern;
      Holzstege ermöglichen die Erkundung sogar mit dem Rollstuhl.


      Die Höhenstufen gliedern die Vegetation. Zwischen den Talgründen auf 1200 m und dem höchsten Gipfel auf
      3029 m wechseln die Vegetationsgürtel. In der montanen Stufe bis etwa 1800 m wachsen Flaumeichen- und
      Buchenwälder, oft ersetzt durch Bestände der Waldkiefer. Die Weißtanne meidet Südhänge und steigt kaum
      über 2000 m; darüber bildet die Bergkiefer lichte Nadelwälder mit Rhododendron- und
      Heidelbeerunterwuchs. Ganz oben breiten sich alpine Rasen mit Alpen-Enzian, Pyrenäen-Hahnenfuß und
      Stängellosem Leimkraut aus. In Mooren und Quellen blühen Wasserhahnenfuß, Knabenkräuter und der
      fleischfressende Sonnentau. Nördlich im Pallars Sobirà schließt der monumentale Tannenurwald Mata de
      València an.
    wildlife: >-
      Rund 200 Wirbeltierarten leben im Park, deren Beobachtung Geduld erfordert. Zu den Säugetieren zählen
      [Pyrenäen-Gämse](/especie/rupicapra_pyrenaica/), [Wildschwein](/especie/sus_scrofa/), Hermelin,
      [Alpenmurmeltier](/especie/marmota_marmota/) und [Reh](/especie/capreolus_capreolus/).


      Die Vögel stellen die artenreichste Gruppe. In abgelegenen Wäldern brüten
      [Schwarzspecht](/especie/dryocopus_martius/), [Auerhuhn](/especie/tetrao_urogallus/), Raufußkauz und
      Fichtenkreuzschnabel. Über den Schutthalden und Graten kreisen [Gänsegeier](/especie/gyps_fulvus/),
      [Steinadler](/especie/aquila_chrysaetos/) und [Bartgeier](/especie/gypaetus_barbatus/). Auf den
      Hochweiden triffst du auf [Alpenschneehuhn](/especie/lagopus_muta/),
      [Alpenbraunelle](/especie/prunella_collaris/), Schneesperling und Alpendohle.


      Die kalten Berggewässer beherbergen Besonderheiten: Der Pyrenäen-Gebirgsmolch ist ein seltener
      endemischer Lurch kristallklarer Bäche, während die [Forelle](/especie/salmo_trutta/) in den sauberen
      Fluten reichlich Nahrung findet. An Reptilien kommen Aspisviper und Schlingnatter vor; erstere ist
      giftig.


      Das Gebirgsklima bestimmt den Rhythmus. Von Ende November bis Anfang Mai liegt der Park unter tiefem
      Schnee und erfordert Winterausrüstung sowie alpine Lawinenkenntnis. Schneeschuhtouren und Skibergsteigen
      sind weit verbreitet. Die Wandersaison zu Fuß reicht von Juni bis Oktober.
    visit: >-
      Die beiden traditionellen Zugänge sind Boí und Espot. Von Boí gelangst du zur Schwemmebene Aigüestortes;
      von Espot zum See Sant Maurici. Die Fahrt von einem Tal ins andere dauert mit dem Auto über
      Gebirgsstraßen rund zwei Stunden; wähle daher vorab dein Zieltal. Der Zugang zu Fuß ist frei; Fahrräder
      sind nur bis zu den Kontrollpunkten Sant Maurici und Aigüestortes gestattet. Von Espot und Boí verkehren
      konzessionierte Sammeltaxis hinauf zum See Sant Maurici beziehungsweise zur Ebene Aigüestortes.


      Beginne deine Tour im Parkzentrum in Boí oder Espot. Beide informieren ganzjährig, zeigen
      Dauerausstellungen (in Espot zu den drei Säulen Fels, Wasser und Leben) und geben Routenflyer für
      halbtägige oder ganztägige Wanderungen aus. In Llessui informiert das Hirtenmuseum der Vall d'Àssua; in
      Senet eine Schau zur Mensch-Tier-Beziehung; an der Bergstation der Seilbahn zum Estany Gento (im Sommer)
      gibt es Führungen und eine Wasserkraft-Ausstellung.


      Von Boí erschließen die Holzstege von Aigüestortes die Flussmäander; ein barrierefreier Abschnitt liegt
      direkt in der Ebene. Auf der Espot-Seite führt der Wanderweg vom Parkplatz Prat de Pierró zum See Sant
      Maurici in 1 h 15 min bei 260 Höhenmetern. Ab dem See dauert der Rundweg zum Ratera-Wasserfall, dem
      Ratera-See und dem Maurici-Aussichtspunkt 2 h 30 min bei 300 m Aufstieg. Der Aufstieg zu den Nadeln von
      Amitges ist eine lohnende Verlängerung. Der Fernwanderweg GR 11 quert den Park von Ost nach West.


      Für mehrtägige Trekkingtouren verbindet der Rundweg Camins vius die umliegenden Bergdörfer auf alten
      Saumpfaden. Die berühmte Hüttenrunde Carros de Foc verknüpft bewirtschaftete Berghütten: Für die
      komplette Begehung solltest du mindestens vier Tage einplanen.
    history: >-
      Das Gebiet wurde am 21. Oktober 1955 mit 9851 ha zum Nationalpark erklärt—Spaniens fünfter Nationalpark
      und nach Ordesa der zweite der Pyrenäen. Die Kernzone umfasst heute 14.119 Hektar, umgeben von einer
      schützenden Pufferzone.


      Der Ausbau der Wasserkraft in den Pyrenäen seit der ersten Hälfte des zwanzigsten Jahrhunderts prägte
      das Landschaftsbild maßgeblich; Speicherseen gehören ebenso zur Historie wie traditionelle
      Almwirtschaft. Im Tal Vall de Boí zählt das Ensemble romanischer Kirchen, darunter Sant Climent und
      Santa Maria de Taüll, seit dem 30. November 2000 zum UNESCO-Welterbe.
    before: >-
      Im Nationalpark sind Jagd, Fischfang, das Fangen wilder Tiere und offenes Feuer strikt untersagt. Baden
      und Wassersport in Flüssen, Seen und Bächen sind verboten; bleibe stets auf den markierten Wegen. Führe
      hochalpine Kleidung mit: Das Wetter schlägt rasch um. Für Notfälle verfügt jede Berghütte über eine
      direkte Funkverbindung zur katalanischen Bergwacht. Erkundige dich im Winter vorab in den Parkzentren
      über Schneelage und Lawinengefahr.
    around: >-
      Weitere Hochgebirgs-Nationalparks teilen eiszeitliche Kare und Pyrenäenfauna: der [Nationalpark
      Pyrenäen](/lugar/parc-national-des-pyrenees/) mit Gämse und Murmeltier sowie der [Nationalpark Gran
      Paradiso](/lugar/parco-nazionale-gran-paradiso/) mit Murmeltier und Bartgeier.
  it:
    intro: >-
      I ghiacciai plasmarono le vallate di questo settore dei Pirenei, lasciando impressa la morfologia che
      percorri oggi: vette acuminate, creste frastagliate, immensi circhi alle testate dei bacini e conche
      lacustri scavate nella roccia viva. Il Parco Nazionale di Aigüestortes e del Lago di San Maurizio
      custodisce innumerevoli laghi, graniti vecchi di circa 300 milioni di anni e una pianura alluvionale in
      cui un torrente serpeggia tra torbiere, pascoli e pini uncinati.
    landscape: >-
      Tutto ha origine dalla roccia. Il nucleo centrale del parco è un maestoso plutone granitico di circa 300
      milioni di anni fa, venuto alla luce grazie alla tettonica e all'erosione; lungo i margini compaiono
      scisti e calcari metamorfosati. Proprio da tali calcari metamorfici sono forgiati Els Encantats, i
      rilievi più rappresentativi del parco.


      In seguito giunsero i ghiacciai. Scavarono circhi ad anfiteatro dalle pareti verticali: spiccano quelli
      di Amitges, con le sue celebri guglie granitiche, e quello di Colomèrs, tra i più estesi dei Pirenei. I
      laghi occupano diversi gradini morfologici: gran parte si annida sul fondo dei circhi sommitali
      raggiungendo notevoli profondità, mentre Sant Maurici ed Estany Llong si distendono sui fondivalle
      glaciali.


      La piana di Aigüestortes vanta un'evoluzione singolare. Fu in origine un lago glaciale che i depositi
      torrentizi colmarono gradualmente nei millenni. Oggi il torrente Sant Nicolau vi disegna meandri sinuosi
      tra acquitrini, torbiere a erioforo e pini uncinati; passerelle in legno consentono di ammirarla
      comodamente anche in sedia a rotelle.


      La quota governa la vegetazione. Tra le quote inferiori a 1200 m e la cima più elevata a 3029 m si
      susseguono fasce distinte. Nel piano montano, fino a circa 1800 m, allignano boschi di roverella e
      faggio, frequentemente rimpiazzati da pinete di pino silvestre. L'abete bianco predilige i versanti
      ombrosi e raramente supera i 2000 m; oltre tale soglia, il pino uncinato compone boscaglie rade con
      sottobosco di rododendro e mirtillo. Più in alto dominano le praterie alpine, punteggiate da genziana
      alpina, ranuncolo dei Pirenei e silene acaule. Negli specchi d'acqua e nelle torbiere fioriscono
      ranuncoli acquatici, orchidee e la minuscola pianta carnivora drosera. Al margine settentrionale del
      parco, nel Pallars Sobirà, si estende la monumentale abetina della Mata de València.
    wildlife: >-
      Nel parco vivono circa 200 specie di vertebrati, la cui osservazione richiede attenzione. Tra i
      mammiferi primeggiano il [camoscio pirenaico](/especie/rupicapra_pyrenaica/), il
      [cinghiale](/especie/sus_scrofa/), l'ermellino, la [marmotta alpina](/especie/marmota_marmota/) e il
      [capriolo](/especie/capreolus_capreolus/).


      Gli uccelli formano la classe più varia. Nelle foreste vetuste nidificano il [picchio
      nero](/especie/dryocopus_martius/), l'[urogallo](/especie/tetrao_urogallus/), la civetta capogrosso e il
      crociere. Sopra creste e ghiaioni veleggiano il [grifone](/especie/gyps_fulvus/), l'[aquila
      reale](/especie/aquila_chrysaetos/) e il [gipeto](/especie/gypaetus_barbatus/). Nelle praterie d'alta
      quota vivono la [pernice bianca](/especie/lagopus_muta/), il [sordone](/especie/prunella_collaris/), il
      fringuello alpino e il gracchio corallino o gracchio montano.


      Le acque incontaminate racchiudono rarità: il tritone pirenaico è un anfibio endemico esclusivo delle
      sorgenti limpide, mentre la [trota atlantica](/especie/salmo_trutta/) prospera nelle correnti fredde.
      Tra i rettili figurano la vipera comune o aspide e il colubro liscio; la vipera è velenosa.


      Le stagioni seguono i rigori della montagna. Da fine novembre a inizio maggio gran parte del territorio
      giace sepolto sotto la neve, richiedendo equipaggiamento invernale e padronanza del rischio valanghe.
      Molto diffuse sono le escursioni con le ciaspole e lo scialpinismo. La stagione per camminare a piedi
      copre il periodo da giugno a ottobre.
    visit: >-
      I due ingressi consueti sono Boí ed Espot. Da Boí si sale alla piana di Aigüestortes; da Espot al lago
      di Sant Maurici. Il tragitto in auto tra i due versanti dura circa due ore per strade montane, rendendo
      prioritaria la scelta del versante da esplorare. L'accesso a piedi è libero; le biciclette possono
      spingersi soltanto fino ai centri informativi di Sant Maurici e Aigüestortes. A Espot e Boí operano
      trasporti pubblici autorizzati che trasportano gli escursionisti rispettivamente al lago di Sant Maurici
      e alla piana di Aigüestortes.


      Inizia la visita dai centri parco di Boí o Espot. Aperti tutto l'anno, allestiscono mostre permanenti
      (quella di Espot illustra roccia, acqua e vita) e distribuiscono cartoguide per itinerari di mezza
      giornata o di una giornata intera. A Llessui puoi visitare l'Ecomuseo dei pastori della Vall d'Àssua; a
      Senet uno spazio espositivo sul rapporto uomo-fauna; e alla stazione a monte della funivia dell'Estany
      Gento (in estate) un punto informativo organizza uscite guidate ed espone la storia idroelettrica.


      Dal versante di Boí, le passerelle di Aigüestortes attraversano i meandri fluviali con tratti adatti a
      persone con mobilità ridotta. Sul versante di Espot, la salita dal parcheggio di Prat de Pierró al lago
      di Sant Maurici richiede 1 h 15 min per 260 m di dislivello. Dal lago, l'anello per la cascata di
      Ratera, il laghetto e il belvedere dura 2 h 30 min con 300 m di dislivello. L'escursione verso le guglie
      di Amitges è un classico prolungamento. La traversata GR 11 solca il parco da est a ovest.


      Per chi ha più giorni a disposizione, Camins vius compie il periplo del parco toccando i borghi storici
      lungo vecchie mulattiere. La celebre alta via Carros de Foc unisce i rifugi d'alta quota: per compierla
      integralmente a piedi occorrono almeno quattro giorni.
    history: >-
      Venne istituito come parco nazionale il 21 ottobre 1955 su 9851 ha, divenendo il quinto parco nazionale
      spagnolo e il secondo dei Pirenei dopo Ordesa. La riserva centrale copre oggi 14.119 ettari, circondata
      da una fascia periferica di salvaguardia.


      Lo sviluppo idroelettrico pirenaico dalla prima metà del Novecento mutò radicalmente i bacini lacustri;
      lo sfruttamento delle acque si intreccia alla secolare tradizione della pastorizia d'alpeggio. Nella
      Vall de Boí, il mirabile complesso di chiese romaniche, con Sant Climent e Santa Maria de Taüll, è
      Patrimonio Mondiale dell'UNESCO dal 30 novembre 2000.
    before: >-
      Nel parco sono tassativamente vietati caccia, pesca, cattura di animali e accensione di fuochi. È
      proibito fare il bagno o praticare sport acquatici in laghi e torrenti, ed è obbligatorio non
      abbandonare i tracciati segnati. Munisciti di abbigliamento da alta quota: il meteo muta repentinamente.
      In caso di emergenza, ogni rifugio è collegato via radio con il soccorso alpino catalano. In inverno
      consulta sempre i centri parco per verificare lo stato di strade e sentieri.
    around: >-
      Più lontano, altri grandi parchi d'alta quota condividono specie pirenaiche e scenari glaciali: il
      [Parco Nazionale dei Pirenei](/lugar/parc-national-des-pyrenees/), con camoscio e marmotta, e il [Parco
      Nazionale del Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), con marmotta e gipeto.
  pt:
    intro: >-
      Os glaciares escavaram os vales deste setor dos Pirenéus, forjando o relevo que hoje percorres: agulhas
      alcantiladas, cristas recortadas, amplos circos nas cabeceiras dos vales e lagoas escavadas na rocha
      pura. O Parque Nacional de Aigüestortes e Lago de Sant Maurici preserva inúmeras lagoas, granitos com
      cerca de 300 milhões de anos e uma planície onde um rio serpenteia por entre turfeiras, prados e
      pinheiros-das-rochas.
    landscape: >-
      Tudo principia na rocha. O coração do parque é um colossal batólito de granito com cerca de 300 milhões
      de anos que aflorou por via da tectónica e da erosão; ao redor, xistos e calcários metamorfizados
      delimitam as margens. É desses calcários metamórficos que são talhados Els Encantats, os picos gémeos
      mais carismáticos do parque.


      Mais tarde vieram os glaciares. Escavaram circos em anfiteatro com vertentes quase verticais: sobressaem
      os de Amitges, com as suas célebres agulhas, e o de Colomèrs, um dos maiores dos Pirenéus. As lagoas
      escalonam-se por diferentes patamares: a maioria repousa no fundo dos circos alcantilados e atinge as
      maiores profundidades, ao passo que as de Sant Maurici e Estany Llong ocupam os fundos de vale.


      A campina de Aigüestortes encerra uma história singular. Foi um antigo lago glaciar que os aluviões e
      sedimentos fluviais acabaram por atulhar integralmente. Hoje em dia o rio Sant Nicolau serpenteia pela
      campina por entre charcos, relvados turfosos e pinheiros-das-rochas, onde passadiços de madeira facultam
      a visita inclusive a pessoas em cadeira de rodas.


      A altitude estrutura a vegetação. Entre as cotas inferiores a 1200 m e o cume culminante a 3029 m
      sucedem-se andares botânicos bem demarcados. No andar montano, até cerca de 1800 m, medram carvalhais de
      carvalho-negral ou pubescente e faias, amiúde substituídos por pinhais de pinheiro-silvestre. O
      abeto-branco coloniza as encostas umbrias e raramente ultrapassa os 2000 m; acima desta cota, o
      pinheiro-das-rochas forma bosques abertos com sub-bosque de rododendro e mirtilo. No cimo estendem-se os
      prados alpinos, salpicados de genciana-alpina, ranúnculo-dos-pirenéus e silene-acaule. Nas lagoas e
      turfeiras florescem ranúnculos-aquáticos, orquídeas bravias e uma planta carnívora minúscula, a drósera.
      Na periferia norte do parque, no Pallars Sobirà, estende-se o imponente abetal da Mata de València.
    wildlife: >-
      O parque acolhe cerca de 200 espécies de vertebrados, exigindo paciência para a sua observação. Entre os
      mamíferos relevam a [camurça-dos-pirineus](/especie/rupicapra_pyrenaica/), o
      [javali](/especie/sus_scrofa/), a arminho, a [marmota-alpina](/especie/marmota_marmota/) e a
      [corça](/especie/capreolus_capreolus/).


      As aves perfazem o grupo mais numeroso. Nos bosques mais inacessíveis habitam o
      [pica-pau-preto](/especie/dryocopus_martius/), o [tetraz-grande](/especie/tetrao_urogallus/), o
      mocho-de-tengmalm e o cruza-bico. Sobre as encostas escarpadas e cristas sem arvoredo planam o
      [abutre-fouveiro](/especie/gyps_fulvus/), a [águia-real](/especie/aquila_chrysaetos/) e o
      [abutre-barbudo](/especie/gypaetus_barbatus/). E nas pastagens alpinas nidificam o
      [lagópode-branco](/especie/lagopus_muta/), a [ferreirinha-alpina](/especie/prunella_collaris/), o
      pardal-alpino e a gralha-de-bico-amarelo.


      As águas cristalinas guardam raridades: o tritão-dos-pirenéus é um anfíbio endémico de riachos gélidos,
      enquanto a [truta](/especie/salmo_trutta/) encontra nas correntes límpidas o seu habitat de eleição. Nos
      répteis contam-se a víbora-áspide e a cobra-lisa-europeia; a víbora é venenosa.


      O calendário segue as regras da alta montanha. Entre o final de novembro e o início de maio quase todo o
      parque permanece coberto por um espesso manto de neve, reclamando equipamento de inverno e conhecimentos
      de segurança em avalanches. O uso de raquetes de neve e o esqui de travessia são muito praticados. Para
      caminhadas a pé, a temporada recomendada estende-se de junho a outubro.
    visit: >-
      As duas portas de entrada tradicionais são Boí e Espot. A partir de Boí atinge-se a campina de
      Aigüestortes; a partir de Espot, o lago de Sant Maurici. Percorrer a distância entre os dois vales de
      automóvel demora cerca de duas horas por estradas sinuosas, pelo que deves eleger previamente a tua
      vertente. A circulação a pé é livre; as bicicletas só podem circular até aos postos de informação de
      Sant Maurici e Aigüestortes. Em Espot e Boí existem serviços autorizados de transportes públicos
      autorizados até ao lago de Sant Maurici e à planície de Aigüestortes, respetivamente.


      Inicia o roteiro na Casa do Parque de Boí ou de Espot. Abertas todo o ano, dispõem de exposições
      permanentes (a de Espot aborda a rocha, a água e a vida) e distribuem mapas com percursos adequados de
      meio dia ou dia inteiro. Em Llessui situa-se o Ecomuseu dos Pastores da Vall d'Àssua; em Senet, um
      espaço temático sobre a convivência homem-fauna; e na estação superior do teleférico do lago Gento (no
      verão), um centro informativo organiza passeios guiados e expõe a história hidroelétrica.


      Por Boí, os passadiços de Aigüestortes percorrem os meandros fluviais com troços adaptados a mobilidade
      reduzida. Pelo setor de Espot, a subida do parque de estacionamento do Prat de Pierró ao lago de Sant
      Maurici demora 1 h 15 min com 260 m de desnível. A partir do lago, o circuito pela cascata de Ratera,
      lagoa superior e miradouro de Sant Maurici cumpre-se em 2 h 30 min com 300 m de subida. A extensão até
      às Agulhas de Amitges é outro traçado de referência. A travessia GR 11 cruza o parque de lés a lés.


      Para quem dispõe de mais dias, Camins vius contorna o parque unindo as aldeias serranas através de
      caminhos ancestrais. O reputado circuito Carros de Foc interliga os refúgios de montanha vigiados: para
      o percorrer na íntegra a pé recomenda-se um mínimo de quatro dias.
    history: >-
      Foi declarado parque nacional a 21 de outubro de 1955 com 9851 ha, constituindo o quinto parque nacional
      de Espanha e o segundo dos Pirenéus após Ordesa. A área central abrange hoje 14.119 hectares, envolta
      por uma zona periférica de salvaguarda gradual.


      O aproveitamento hidroelétrico dos Pirenéus a partir da primeira metade do século XX modificou
      profundamente a paisagem lacustre; as barragens coexistem com a tradição agropastoril ancestral. Na Vall
      de Boí, o conjunto de igrejas românicas, com Sant Climent e Santa Maria de Taüll, é Património Mundial
      da UNESCO desde 30 de novembro de 2000.
    before: >-
      No interior do parque é expressamente proibido caçar, pescar, capturar espécimes animais e atear fogo.
      Não são permitidos banhos nem atividades náuticas nos rios, lagoas e torrentes, sendo obrigatório
      circular nos trilhos sinalizados. Leva equipamento de alta montanha: o tempo muda repentinamente. Em
      caso de aflição, todos os refúgios dispõem de radiocomunicação direta com o corpo de bombeiros catalão.
      No inverno informa-te junto das Casas do Parque acerca da transitabilidade das vias.
    around: >-
      Mais longe, outros parques de alta montanha partilham paisagens glaciares e fauna pirenaica: o [Parque
      Nacional dos Pirinéus](/lugar/parc-national-des-pyrenees/), com camurça e marmota, e o [Parco Nazionale
      Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), com marmota e abutre-barbudo.
