observaciones:
  es: >-
    Ante el oso, el gestor aconseja evitar andar al anochecer y al amanecer, ir por los senderos marcados y
    avisar de tu presencia sin ruido; el perro, atado. Se puede hacer fuego fuera de los núcleos urbanos solo
    en hogueras designadas, cerca de edificaciones y a menos de 10 metros de ellas. Comprueba con la
    administración del parque las condiciones del sendero antes de ir.
texto:
  es:
    intro: >-
      Rožok es uno de los hayedos más productivos de Eslovaquia, y no por casualidad: sus suelos, ricos en
      humus, dan una madera tan abundante que en la fase de óptimo se han medido 1029,42 m³ por hectárea, el
      máximo de los hayedos primarios del país. Está en los montes Bukovské vrchy, al noreste de Ulič y al
      sureste de Uličské Krivé, dentro del Parque Nacional Poloniny, y es la más pequeña de las tres reservas
      de bosque primario del parque. Y tiene un sendero didáctico propio para verlo.
    landscape: >-
      La reserva se extiende entre los 500 y los 790 m de altitud, y su zona de amortiguación llega a la
      frontera entre Eslovaquia y Ucrania. Predomina un hayedo primario casi puro, de estructura variable en
      altura y diámetro de tronco. La especie principal es el haya, y solo en las zonas altas aparece, de
      forma ocasional, el arce blanco. La mayor parte del bosque está en las fases de crecimiento y óptimo.


      El bosque sigue un ciclo cerrado de tres fases: crecimiento, óptimo y desintegración. Los hayedos
      primarios de los Cárpatos son ejemplo de bosques de haya intactos de la zona templada, con la mayor
      diversidad según las condiciones del medio. Y bajo todo esto hay roca de flysch: capas rítmicas de
      arcillas y areniscas que se depositaron entre hace 70 y 42 millones de años, cuando el mar Tetis cubría
      la zona.
    wildlife: >-
      Como todo bosque primario, Rožok vive de la madera muerta: más de un tercio de los animales forestales y
      más de la mitad de los hongos del bosque dependen de ella. El inventario cuenta 278 especies de hongos
      en Rožok, sobre todo en troncos y ramas caídas de haya. En el parque viven el
      [lobo](/especie/canis_lupus/), el [oso pardo](/especie/ursus_arctos/) y el [lince](/especie/lynx_lynx/),
      y es el único lugar de Eslovaquia donde vive en libertad el [bisonte europeo](/especie/bison_bonasus/).


      En invierno, la nieve dura de noviembre a abril en el parque, y en las crestas más de 160 días.
    visit: >-
      A Rožok se llega por un sendero didáctico circular, marcado en verde, de dificultad media y con cinco
      paradas con paneles informativos. Bajo el lugar llamado Hukovo, el sendero se cruza con el sendero rojo
      Ubľa-Nová Sedlica, por el que se puede volver a Uličské Krivé o ir a la aldea de Ulič.
    history: >-
      Rožok y Stužica se declararon reservas en 1965; son de las zonas protegidas pequeñas más antiguas del
      parque. La UNESCO inscribió el 28 de junio de 2007 el bosque de Rožok junto con Havešová, Stužica,
      Vihorlat y seis bosques ucranianos. Hoy el bien en serie «Bosques de hayas antiguos y primarios de los
      Cárpatos y otras regiones de Europa» tiene 93 componentes en dieciocho países.
    before: >-
      Ante el oso, el gestor aconseja evitar andar al anochecer y al amanecer, ir por los senderos marcados y
      avisar de tu presencia sin ruido; el perro, atado. Se puede hacer fuego fuera de los núcleos urbanos
      solo en hogueras designadas, cerca de edificaciones y a menos de 10 metros de ellas. Comprueba con la
      administración del parque las condiciones del sendero antes de ir.
    around: >-
      Rožok forma parte del [Complejo de Bosques Vírgenes de Bukovské Vrchy - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). A 9 km queda la [Reserva Natural
      Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/); a 11 km, la [Reserva Natural Estricta
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/); a 13 km, el [Parque Nacional de
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/); y a 20 km, el [Bosque Virgen de
      Vihorlat](/lugar/prales-vihorlat---morske-oko/).
  en:
    intro: >-
      Rožok is one of the most productive beech forests in Slovakia, and for good reason: its humus-rich soils
      yield such abundant wood that in the optimal phase 1029.42 m³ per hectare have been measured, the
      highest among the country's primeval beech forests. It lies in the Bukovské vrchy mountains, northeast
      of Ulič and southeast of Uličské Krivé, inside Poloniny National Park, and is the smallest of the park's
      three primeval forest reserves. It also has its own educational trail to explore it.
    landscape: >-
      The reserve spans altitudes between 500 and 790 m, and its buffer zone reaches the border between
      Slovakia and Ukraine. A nearly pure primeval beech forest predominates, with varying trunk height and
      diameter. The primary species is beech, and sycamore maple appears only occasionally at higher
      elevations. Most of the forest is in the growth and optimal phases.


      The woodland follows a closed three-phase cycle: growth, optimum, and decay. The primeval beech forests
      of the Carpathians serve as prime examples of intact temperate beech forests, displaying maximum
      diversity shaped by site conditions. Beneath all this lies flysch bedrock: rhythmic layers of claystones
      and sandstones deposited between 70 and 42 million years ago, when the Tethys Ocean covered the region.
    wildlife: >-
      Like every primeval forest, Rožok thrives on deadwood: more than a third of woodland animals and over
      half of forest fungi depend on it. The inventory records 278 species of fungi in Rožok, mostly on fallen
      beech trunks and branches. Poloniny National Park is home to the [grey wolf](/especie/canis_lupus/), the
      [brown bear](/especie/ursus_arctos/), and the [Eurasian lynx](/especie/lynx_lynx/), and is the only
      place in Slovakia where the [European bison](/especie/bison_bonasus/) roams freely.


      In winter, snow lasts from November to April across the park, and on ridge crests for more than 160
      days.
    visit: >-
      Rožok is reached via a green-marked circular educational trail of moderate difficulty, featuring five
      stops with information boards. Below the spot known as Hukovo, the trail intersects the red Ubľa–Nová
      Sedlica trail, which you can take to return to Uličské Krivé or continue to the village of Ulič.
    history: >-
      Rožok and Stužica were declared nature reserves in 1965; they are among the park's oldest small
      protected areas. UNESCO inscribed the Rožok forest on 28 June 2007 alongside Havešová, Stužica,
      Vihorlat, and six Ukrainian forests. Today, the serial property "Ancient and Primeval Beech Forests of
      the Carpathians and Other Regions of Europe" comprises 93 components across eighteen countries.
    before: >-
      Regarding bears, the park authority advises avoiding hiking at dusk and dawn, sticking to marked paths,
      and making your presence known without loud noise; keep dogs on a leash. Open fires outside built-up
      areas are permitted only at designated campfire pits near buildings and less than 10 metres from them.
      Check trail conditions with park administration before heading out.
    around: >-
      Rožok is part of the [Bukovské Vrchy Primeval Forest Complex - Poloniny
      NP](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). 9 km away lies [Havešová Strict Nature
      Reserve](/lugar/narodna-prirodna-rezervacia-havesova/); at 11 km, [Stužica Strict Nature
      Reserve](/lugar/narodna-prirodna-rezervacia-stuzica/); at 13 km, [Bieszczady National
      Park](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/); and at 20 km, [Vihorlat Primeval
      Forest](/lugar/prales-vihorlat---morske-oko/).
  fr:
    intro: >-
      Rožok compte parmi les hêtraies les plus productives de Slovaquie, et non par hasard : ses sols riches
      en humus produisent un bois si abondant qu'en phase optimale on a mesuré 1029,42 m³ par hectare, un
      record pour les hêtraies primaires du pays. Elle s'étend dans les monts Bukovské vrchy, au nord-est
      d'Ulič et au sud-est d'Uličské Krivé, au sein du parc national des Poloniny, et constitue la plus petite
      des trois réserves de forêt primaire du parc. Elle dispose d'un sentier pédagogique propre pour la
      découvrir.
    landscape: >-
      La réserve s'étage entre 500 et 790 m d'altitude, et sa zone tampon atteint la frontière entre la
      Slovaquie et l'Ukraine. Une hêtraie primaire presque pure y prédomine, présentant une hauteur et un
      diamètre de troncs variables. L'essence principale est le hêtre, tandis que l'érable sycomore n'apparaît
      qu'occasionnellement sur les hauteurs. La plus grande partie de la forêt se trouve en phases de
      croissance et d'optimum.


      La forêt suit un cycle fermé en trois phases : croissance, optimum et décomposition. Les hêtraies
      primaires des Carpates constituent des modèles de forêts de hêtres tempérées intactes, avec une
      diversité maximale modulée par les conditions du milieu. Sous tout cela s'étend un substrat de flysch :
      des couches alternées d'argilites et de grès déposées il y a 70 à 42 millions d'années, lorsque l'océan
      Téthys recouvrait la région.
    wildlife: >-
      Comme toute forêt primaire, Rožok se nourrit de bois mort : plus d'un tiers des animaux forestiers et
      plus de la moitié des champignons de la forêt en dépendent. L'inventaire dénombre 278 espèces de
      champignons à Rožok, principalement sur les troncs et branches de hêtre tombés. Le parc abrite le
      [loup](/especie/canis_lupus/), l'[ours brun](/especie/ursus_arctos/) et le [lynx
      boréal](/especie/lynx_lynx/), et c'est le seul endroit de Slovaquie où vit en liberté le [bison
      d'Europe](/especie/bison_bonasus/).


      En hiver, la neige persiste de novembre à avril dans le parc, et plus de 160 jours sur les crêtes.
    visit: >-
      On accède à Rožok par un sentier didactique circulaire balisé en vert, de difficulté moyenne et ponctué
      de cinq arrêts dotés de panneaux informatifs. Sous le lieu-dit Hukovo, le sentier croise le tracé rouge
      Ubľa–Nová Sedlica, par lequel vous pouvez revenir à Uličské Krivé ou rejoindre le village d'Ulič.
    history: >-
      Rožok et Stužica ont été déclarées réserves en 1965 ; elles comptent parmi les plus anciennes petites
      zones protégées du parc. L'UNESCO a inscrit la forêt de Rožok le 28 juin 2007 aux côtés de Havešová,
      Stužica, Vihorlat et de six massifs ukrainiens. Aujourd'hui, le bien sériel « Forêts primaires et
      anciennes de hêtres des Carpates et d'autres régions d'Europe » réunit 93 composantes dans dix-huit
      pays.
    before: >-
      Face à l'ours, le gestionnaire conseille d'éviter de marcher à l'aube et au crépuscule, de suivre les
      sentiers balisés et de signaler votre présence sans crier ; tenez votre chien en laisse. Le feu en
      dehors des agglomérations n'est permis qu'aux emplacements désignés, à proximité de constructions et à
      moins de 10 mètres de celles-ci. Vérifiez les conditions du sentier auprès de l'administration du parc
      avant votre départ.
    around: >-
      Rožok fait partie du [complexe forestier primaire des Bukovské Vrchy - PN
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). À 9 km se trouve la [réserve naturelle
      intégrale de Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) ; à 11 km, la [réserve naturelle
      intégrale de Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) ; à 13 km, le [parc national de
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) ; et à 20 km, la [forêt vierge de
      Vihorlat](/lugar/prales-vihorlat---morske-oko/).
  de:
    intro: >-
      Rožok ist einer der produktivsten Buchenwälder der Slowakei, und das aus gutem Grund: Seine humusreichen
      Böden bringen so viel Holz hervor, dass in der Optimalphase 1029,42 m³ pro Hektar gemessen wurden – der
      Höchstwert unter den Buchenurwäldern des Landes. Er liegt in den Bukovské vrchy, nordöstlich von Ulič
      und südöstlich von Uličské Krivé, innerhalb des Nationalparks Poloniny, und ist das kleinste der drei
      Urwaldreservate des Parks. Ein eigener Lehrpfad erschließt ihn für Besucher.
    landscape: >-
      Das Reservat erstreckt sich zwischen 500 und 790 m Höhe, und seine Pufferzone reicht bis an die Grenze
      zwischen der Slowakei und der Ukraine. Es überwiegt ein fast reiner Buchenurwald mit wechselnden
      Stammhöhen und -durchmessern. Hauptbaumart ist die Rotbuche; nur in den oberen Lagen tritt vereinzelt
      der Berg-Ahorn auf. Der Großteil des Waldes befindet sich in den Wachstums- und Optimalphasen.


      Der Wald durchläuft einen geschlossenen Dreiphasenzyklus: Wachstum, Optimum und Zerfall. Die
      Karpaten-Buchenurwälder gelten als Musterbeispiel intakter Buchenwälder der gemäßigten Zone mit größter
      Vielfalt je nach Standortbedingungen. Darunter liegt Flyschgestein: rhythmische Wechsellagen aus
      Tonsteinen und Sandsteinen, die vor 70 bis 42 Millionen Jahren abgelagert wurden, als das Tethysmeer das
      Gebiet bedeckte.
    wildlife: >-
      Wie jeder Urwald lebt Rožok von Totholz: Mehr als ein Drittel der Waldtiere und über die Hälfte der
      Pilze des Waldes sind darauf angewiesen. Das Inventar verzeichnet 278 Pilzarten in Rožok, überwiegend an
      umgestürzten Buchenstämmen und Ästen. Im Park leben der [Wolf](/especie/canis_lupus/), der
      [Braunbär](/especie/ursus_arctos/) und der [Eurasische Luchs](/especie/lynx_lynx/), und es ist der
      einzige Ort der Slowakei, an dem der [Wisent](/especie/bison_bonasus/) frei umherstreift.


      Im Winter hält sich der Schnee im Park von November bis April und auf den Kämmen mehr als 160 Tage.
    visit: >-
      Rožok erreicht man über einen grün markierten Rund-Lehrpfad mittlerer Schwierigkeit mit fünf Stationen
      samt Schautafeln. Unterhalb der Flur Hukovo kreuzt der Pfad die rote Route Ubľa–Nová Sedlica, auf der du
      nach Uličské Krivé zurückkehren oder ins Dorf Ulič weitergehen kannst.
    history: >-
      Rožok und Stužica wurden 1965 zu Reservaten erklärt; sie gehören zu den ältesten kleineren
      Schutzgebieten des Parks. Die UNESCO nahm den Urwald von Rožok am 28. Juni 2007 zusammen mit Havešová,
      Stužica, Vihorlat und sechs ukrainischen Wäldern in das Welterbe auf. Heute umfasst die serielle
      Welterbestätte „Alte Buchenwälder und Buchenurwälder der Karpaten und anderer Regionen Europas“ 93
      Teilgebiete in achtzehn Ländern.
    before: >-
      In Bezug auf Bären rät die Parkverwaltung, Wanderungen in der Morgen- und Abenddämmerung zu meiden, auf
      den markierten Pfaden zu bleiben und die eigene Anwesenheit ohne lautes Geschrei anzukündigen; Hunde
      gehören an die Leine. Offenes Feuer außerhalb geschlossener Ortschaften ist nur an ausgewiesenen
      Feuerstellen nahe an Gebäuden und weniger als 10 Meter von ihnen entfernt gestattet. Erkundige dich
      vorab bei der Parkverwaltung nach dem Wegzustand.
    around: >-
      Rožok gehört zum [Urwaldkomplex Bukovské Vrchy - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). 9 km entfernt liegt das [Nationale
      Naturreservat Havešová](/lugar/narodna-prirodna-rezervacia-havesova/); in 11 km Entfernung das
      [Nationale Naturreservat Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/); in 13 km der
      [Nationalpark Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/); und in 20 km der [Urwald
      Vihorlat](/lugar/prales-vihorlat---morske-oko/).
  it:
    intro: >-
      Rožok è una delle faggete più produttive della Slovacchia, e non a caso: i suoi suoli ricchi di humus
      danno un legname così abbondante che nella fase di ottimo sono stati misurati 1029,42 m³ per ettaro, il
      massimo tra le faggete primarie del paese. Si trova nei monti Bukovské vrchy, a nord-est di Ulič e a
      sud-est di Uličské Krivé, all'interno del Parco Nazionale Poloniny, ed è la più piccola delle tre
      riserve di foresta primaria del parco. Dispone inoltre di un proprio sentiero didattico per visitarla.
    landscape: >-
      La riserva si estende tra 500 e 790 m di quota, e la sua fascia tampone raggiunge il confine tra
      Slovacchia e Ucraina. Domina una faggeta primaria quasi pura, con altezza e diametro dei tronchi
      variabili. La specie principale è il faggio, mentre solo nelle zone sommitali compare sporadicamente
      l'acero montano. La maggior parte del bosco attraversa le fasi di crescita e di ottimo.


      La foresta segue un ciclo chiuso a tre fasi: crescita, ottimo e degradazione. Le faggete primarie dei
      Carpazi sono un esempio di foreste integre di faggio della zona temperata, con la massima diversità
      determinata dalle condizioni stazionali. Sotto tutto questo si trova roccia flyschoide: strati ritmici
      di argille e arenarie depositatisi tra 70 e 42 milioni di anni fa, quando il mare della Tetide copriva
      l'area.
    wildlife: >-
      Come ogni bosco primario, Rožok trae linfa dal legno morto: oltre un terzo degli animali forestali e più
      della metà dei funghi del bosco dipendono da esso. L'inventario conta 278 specie di funghi a Rožok,
      soprattutto su tronchi e rami caduti di faggio. Nel parco vivono il [lupo
      grigio](/especie/canis_lupus/), l'[orso bruno](/especie/ursus_arctos/) e la
      [lince](/especie/lynx_lynx/), ed è l'unico luogo della Slovacchia in cui vive in libertà il [bisonte
      europeo](/especie/bison_bonasus/).


      In inverno la neve persiste da novembre ad aprile nel parco, e sulle creste per oltre 160 giorni.
    visit: >-
      A Rožok si accede tramite un sentiero didattico circolare segnato in verde, di media difficoltà, con
      cinque tappe corredate da pannelli esplicativi. Sotto la località di Hukovo il tracciato incrocia il
      sentiero rosso Ubľa–Nová Sedlica, con cui puoi tornare a Uličské Krivé o raggiungere il villaggio di
      Ulič.
    history: >-
      Rožok e Stužica sono state dichiarate riserve nel 1965; figurano tra le aree protette minori più antiche
      del parco. L'UNESCO ha iscritto la foresta di Rožok il 28 giugno 2007 insieme a Havešová, Stužica,
      Vihorlat e a sei foreste ucraine. Oggi il sito seriale «Antiche faggete primarie dei Carpazi e di altre
      regioni d'Europa» conta 93 componenti distribuite in diciotto paesi.
    before: >-
      In presenza dell'orso, l'ente gestore consiglia di evitare di camminare all'alba e all'imbrunire, di
      seguire i sentieri segnati e di segnalare la propria presenza senza schiamazzi; tieni il cane al
      guinzaglio. È consentito accendere fuochi all'esterno dei centri abitati solo nei focolari autorizzati,
      vicino a edifici e a meno di 10 metri da essi. Verifica lo stato dei sentieri con l'amministrazione del
      parco prima di partire.
    around: >-
      Rožok fa parte del [Complesso di Foreste Primarie di Bukovské Vrchy - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). A 9 km si trova la [Riserva Naturale
      Statale di Havešová](/lugar/narodna-prirodna-rezervacia-havesova/); a 11 km, la [Riserva Naturale
      Statale di Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/); a 13 km, il [Parco Nazionale di
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/); e a 20 km, la [Foresta Vergine di
      Vihorlat](/lugar/prales-vihorlat---morske-oko/).
  pt:
    intro: >-
      Rožok é um dos fagetos mais produtivos da Eslováquia, e não por acaso: os seus solos ricos em húmus
      produzem uma madeira tão abundante que na fase de ótimo foram medidos 1029,42 m³ por hectare, o valor
      máximo registado nos fagetos primários do país. Situa-se nos montes Bukovské vrchy, a nordeste de Ulič e
      a sudeste de Uličské Krivé, dentro do Parque Nacional Poloniny, constituindo a menor das três reservas
      de floresta primária do parque. Possui ainda um trilho didático próprio para o visitar.
    landscape: >-
      A reserva estende-se entre os 500 e os 790 m de altitude, e a sua zona tampão atinge a fronteira entre a
      Eslováquia e a Ucrânia. Predomina um fageto primário quase puro, com variação de altura e diâmetro dos
      troncos. A espécie dominante é a faia, surgindo apenas esporadicamente nas zonas mais elevadas o
      bordo-bastardo. A maior parte da floresta encontra-se nas fases de crescimento e ótimo.


      A floresta segue um ciclo fechado de três fases: crescimento, ótimo e decomposição. Os fagetos primários
      dos Cárpatos são exemplares intactos de florestas de faia da zona temperada, exibindo a máxima
      diversidade consoante as condições do meio. Sob tudo isto repousa uma formação de flysch: camadas
      rítmicas de argilitos e arenitos depositadas há entre 70 e 42 milhões de anos, quando o oceano de Tétis
      cobria a região.
    wildlife: >-
      Como qualquer floresta primária, Rožok depende da madeira morta: mais de um terço dos animais florestais
      e mais de metade dos fungos da floresta dependem dela. O inventário assinala 278 espécies de fungos em
      Rožok, sobretudo sobre troncos e ramos caídos de faia. No parque habitam o
      [lobo-cinzento](/especie/canis_lupus/), o [urso-pardo](/especie/ursus_arctos/) e o
      [lince-euroasiático](/especie/lynx_lynx/), sendo este o único local da Eslováquia onde o
      [bisonte-europeu](/especie/bison_bonasus/) vive em liberdade.


      No inverno, a neve permanece de novembro a abril no parque e mais de 160 dias nas cumeadas.
    visit: >-
      O acesso a Rožok faz-se por um percurso didático circular marcado a verde, de dificuldade média e com
      cinco paragens providas de painéis informativos. Sob o sítio de Hukovo, o trilho cruza a rota vermelha
      Ubľa–Nová Sedlica, pela qual podes regressar a Uličské Krivé ou seguir até à aldeia de Ulič.
    history: >-
      Rožok e Stužica foram declaradas reservas em 1965; contam-se entre as zonas protegidas de pequena
      dimensão mais antigas do parque. A UNESCO inscreveu a floresta de Rožok a 28 de junho de 2007 em
      conjunto com Havešová, Stužica, Vihorlat e seis florestas ucranianas. Hoje, o sítio serial «Florestas
      primárias e ancestrais de faias dos Cárpatos e de outras regiões da Europa» inclui 93 componentes em
      dezoito países.
    before: >-
      Perante o urso, a administração aconselha a evitar caminhar ao amanhecer e ao anoitecer, seguir pelos
      trilhos marcados e assinalar a tua presença sem gritaria; o cão deve ir preso por trela. Só é permitido
      fazer fogo fora dos aglomerados em fogueiras autorizadas, perto de construções e a menos de 10 metros
      delas. Confirma com a administração do parque as condições do percurso antes de partires.
    around: >-
      Rožok integra o [Complexo de Florestas Virgens de Bukovské Vrchy - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). A 9 km fica a [Reserva Natural Estrita
      de Havešová](/lugar/narodna-prirodna-rezervacia-havesova/); a 11 km, a [Reserva Natural Estrita de
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/); a 13 km, o [Parque Nacional de
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/); e a 20 km, a [Floresta Virgem de
      Vihorlat](/lugar/prales-vihorlat---morske-oko/).
