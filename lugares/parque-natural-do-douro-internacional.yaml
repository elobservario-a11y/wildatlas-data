resumen:
  es: >-
    El gran cañón del río Duero de más de 120 km de longitud que marca la frontera entre España y Portugal con
    cortes verticales de granito de 400 m de caída.
  en: >-
    The great canyon of the Douro River over 120 km in length that marks the border between Spain and Portugal
    with vertical granite cliffs of 400 m drop.
  fr: >-
    Le grand canyon du fleuve Douro de plus de 120 km de long qui marque la frontière entre l'Espagne et le
    Portugal avec des falaises verticales de granit de 400 m de dénivelé.
  de: >-
    Der große Canyon des Duero von über 120 km Länge, der die Grenze zwischen Spanien und Portugal markiert,
    mit vertikalen Granitwänden von 400 m Abbruch.
  it: >-
    Il grande canyon del fiume Duero di oltre 120 km di lunghezza che segna il confine tra Spagna e Portogallo
    con pareti verticali di granito di 400 m di dislivello.
  pt: >-
    O grande desfiladeiro do rio Douro com mais de 120 km de extensão que marca a fronteira entre Espanha e
    Portugal com arribas verticais de granito com 400 m de desnível.
unico:
  es: >-
    Un territorio de cañones de más de ciento veinte kilómetros que sirve de frontera, con paredes verticales
    de más de 150 metros y aves de roca criando en sus cortados.
  en: >-
    A canyon territory stretching more than one hundred and twenty kilometres that forms an international
    border, with vertical cliffs rising over 150 metres and cliff-nesting birds breeding on its rock faces.
  fr: >-
    Un territoire de gorges de plus de cent vingt kilomètres servant de frontière, avec des parois verticales
    de plus de 150 mètres et des oiseaux rupicoles nichant sur ses falaises.
  de: >-
    Ein über einhundertzwanzig Kilometer langes Schluchtgebiet als Staatsgrenze, mit Steilwänden von über 150
    Metern und Felsvögeln, die an den Abgründen brüten.
  it: >-
    Un territorio di gole di oltre centoventi chilometri che funge da confine, con pareti verticali di oltre
    150 metri e uccelli rupicoli che nidificano sulle sue rupi.
  pt: >-
    Um território de canhões com mais de cento e vinte quilómetros que serve de fronteira, com paredes
    verticais de mais de 150 metros e aves rupícolas a nidificar nas suas escarpas.
observaciones:
  es: >-
    Calcula entre dos y cuatro días para el conjunto. Las dos rutas con datos concretos son tramos de ocho y
    nueve kilómetros con sus propios puntos de partida: elige un solo sector por jornada.
texto:
  es:
    intro: >-
      En este tramo, el río Duero es una frontera. Los cañones que excavan el Duero y el Águeda hacen de
      límite natural entre España y Portugal en casi toda la zona, y a su alrededor se extiende, en línea, un
      territorio de más de 120 kilómetros. El Duero es río fronterizo desde la presa de Castro hasta Barca de
      Alba, donde se le une el Águeda, que lo es hasta su unión con el Turones. En la orilla portuguesa, el
      parque natural abarca terrenos de Mogadouro, Miranda do Douro, Freixo de Espada à Cinta y Figueira de
      Castelo Rodrigo, y se creó para proteger el paisaje de la región y su flora y fauna.
    landscape: >-
      El parque integra grandes cañones fluviales, escarpes y la meseta mirandesa. La meseta mirandesa tiene
      suelos de esquisto y, a veces, de granito, y el río se encaja en ella y deja gargantas. En el tramo de
      Paradela a São João das Arribas, el camino discurre por el borde de un cañón con paredes verticales de
      más de 150 metros. En Paradela, el punto más oriental de Portugal, pequeñas crestas de cuarcita destacan
      sobre un entorno de esquistos; en São João das Arribas, en cambio, dominan escarpes graníticos vigorosos
      y abruptos donde el Duero se encaja en la meseta. Allí el valle se ve recto, encajado y condicionado por
      la fracturación regional.


      Las arribas altas, encajadas y de difícil acceso del concejo de Miranda favorecen especies que de otro
      modo estarían extintas. La garganta del Duero actúa además como un condensador de calor: inviernos
      cortos y suaves y veranos largos y calurosos frente a la meseta fría.
    wildlife: >-
      El río y sus cortados son hogar de aves. En la orilla española, el parque natural de Arribes del Duero
      comparte cañón y especies con el portugués, y allí la [cigüeña negra](/especie/ciconia_nigra/) es el ave
      más emblemática y anida en huecos y recodos de los cortados. Las especies que motivaron la zona de
      protección para las aves fueron el [águila perdicera](/especie/aquila_fasciata/), el [águila
      real](/especie/aquila_chrysaetos/), el [alimoche común](/especie/neophron_percnopterus/), el [búho
      real](/especie/bubo_bubo/), el [buitre leonado](/especie/gyps_fulvus/), la [chova
      piquirroja](/especie/pyrrhocorax_pyrrhocorax/), la cigüeña negra y el [halcón
      peregrino](/especie/falco_peregrinus/).


      El avión roquero permanece allí todo el año gracias al microclima; también anidan el cuervo, la
      golondrina dáurica, la grajilla, el roquero solitario y el vencejo real. En las riberas se ven el
      chorlitejo chico, la focha común, la gallina de agua, la garza real, el [martín pescador
      común](/especie/alcedo_atthis/) y el mirlo acuático. Entre los mamíferos hay al menos catorce clases de
      murciélagos, que aprovechan el abrigo de los roquedales y el clima benigno. La [nutria
      europea](/especie/lutra_lutra/), escasa en Europa, casi desapareció del Duero por los embalses y se va
      recuperando poco a poco, y el [lobo](/especie/canis_lupus/) sigue presente, aunque en menor medida que
      antaño.


      Las mejores épocas son la primavera y el otoño.
    visit: >-
      Los miradores son la manera más directa de asomarse al cañón. Miranda do Douro tiene el Miradouro do
      Centro de Interpretação junto a otros dos, el del Castrilhouço y el de la Sé Catedral; Picote tiene los
      de Fraga do Puio y Fraga Amarela; Poiares, los de Assumadouro y Penedo Durão. En Sendim, el mirador do
      Carreirão das Arribas deja ver las arribas y caminar junto al río entre vegetación propia del parque.


      Para caminar hay dos rutas del municipio de Miranda do Douro con datos concretos. La primera es un
      circuito de Miranda do Douro a São João das Arribas que se puede hacer a pie, en bici o a caballo: mide
      8 kilómetros y lleva unas dos horas y media. Sale de la oficina de turismo de Miranda do Douro, va al
      norte por Vale de Águia y Aldeia Nova hasta la capilla de São João das Arribas, sobre el valle del
      Duero, y vuelve por Aldeia Nova y Pena Branca, siguiendo en el último tramo el río Fresno. La segunda,
      de Paradela a São João das Arribas, mide 9 kilómetros y lleva unas tres horas: parte del mirador de
      Paradela (Penha das Torres) y acaba en el de São João das Arribas, cerca de Aldeia Nova. Además, el plan
      del parque identifica cuatro recorridos pedestres señalizados.


      Entre los lugares singulares destaca la cascada de la Haya de Agua Alta, en Bemposta. Para profundizar,
      en la orilla española hay dos Casas del Parque, una en el convento de San Francisco de Fermoselle y otra
      en el torreón de Sobradillo.
    history: >-
      España y Portugal acordaron en 1927 repartirse el aprovechamiento hidroeléctrico del Duero internacional
      en dos tramos. El Gobierno portugués incorporó este territorio a su red de espacios protegidos el 11 de
      mayo de 1998. Los incendios son la principal amenaza para los ecosistemas y hábitats; también preocupan
      nuevos embalses, vertidos y grandes tendidos eléctricos.
    before: >-
      Calcula entre dos y cuatro días para el conjunto. Las dos rutas con datos concretos son tramos de ocho y
      nueve kilómetros con sus propios puntos de partida: elige un solo sector por jornada.
    around: >-
      El atlas no tiene vecinos cercanos de este parque, pero comparte especies y paisaje con otros lugares
      lejanos: el [Parque Nacional de Monfragüe](/lugar/parque-nacional-de-monfrague/) y la [Garganta de Demir
      Kapija - Puerta de Hierro del Vardar](/lugar/demir-kapiska-klisura/) tienen también alimoche y cigüeña
      negra, en cañones y corredores fluviales.
  en:
    intro: >-
      Along this stretch, the Douro River is a border. The canyons carved by the Douro and the Águeda form the
      natural boundary between Spain and Portugal across nearly the entire area, extending in a corridor of
      more than 120 kilometres. The Douro serves as the border river from the Castro dam to Barca de Alva,
      where the Águeda joins it, itself acting as the frontier up to its confluence with the Turones. On the
      Portuguese bank, the natural park spans territory in Mogadouro, Miranda do Douro, Freixo de Espada à
      Cinta and Figueira de Castelo Rodrigo, and was established to protect the region's landscape and its
      flora and fauna.
    landscape: >-
      The park brings together vast river canyons, escarpments and the Miranda plateau. The Miranda plateau
      features schist and occasional granite soils, through which the river incises itself, leaving gorges
      behind. Along the section from Paradela to São João das Arribas, the trail traces the edge of a canyon
      with vertical walls over 150 metres high. At Paradela, the easternmost point of Portugal, small
      quartzite crests stand out against a schist terrain; at São João das Arribas, by contrast, rugged and
      abrupt granite escarpments dominate where the Douro bites into the plateau. There the valley runs
      straight, narrow and governed by regional faulting.


      The high, sheer and inaccessible cliffs of the Miranda district shelter species that would otherwise
      face local extinction. The Douro gorge also acts as a thermal trap: short, mild winters and long, hot
      summers compared to the chilly plateau above.
    wildlife: >-
      The river and its cliffs are home to birds. On the Spanish bank, the Arribes del Duero Natural Park
      shares the canyon and species with the Portuguese side, and there the [black
      stork](/especie/ciconia_nigra/) is the most emblematic bird, nesting in hollows and ledges of the rock
      faces. The species that led to the Special Protection Area designation were the [Bonelli's
      eagle](/especie/aquila_fasciata/), the [golden eagle](/especie/aquila_chrysaetos/), the [Egyptian
      vulture](/especie/neophron_percnopterus/), the [Eurasian eagle-owl](/especie/bubo_bubo/), the [griffon
      vulture](/especie/gyps_fulvus/), the [red-billed chough](/especie/pyrrhocorax_pyrrhocorax/), the black
      stork and the [peregrine falcon](/especie/falco_peregrinus/).


      The crag martin remains year-round thanks to the microclimate; common raven, red-rumped swallow, western
      jackdaw, blue rock thrush and alpine swift also nest here. Along the riverbanks one finds little ringed
      plover, Eurasian coot, common moorhen, grey heron, the [common kingfisher](/especie/alcedo_atthis/) and
      white-throated dipper. Among mammals there are at least fourteen bat species, taking advantage of rock
      shelters and the benign climate. The [Eurasian otter](/especie/lutra_lutra/), scarce in Europe, nearly
      vanished from the Douro due to dams and is slowly recovering, while the [grey
      wolf](/especie/canis_lupus/) remains present, though less abundant than in the past.


      The best times to visit are spring and autumn.
    visit: >-
      Viewpoints provide the most direct perspective on the canyon. Miranda do Douro features the Miradouro do
      Centro de Interpretação alongside two others: Castrilhouço and Sé Catedral; Picote offers Fraga do Puio
      and Fraga Amarela; Poiares has Assumadouro and Penedo Durão. In Sendim, the Carreirão das Arribas
      viewpoint looks out across the cliffs and allows walking beside the river among native park vegetation.


      For walking, two routes in the municipality of Miranda do Douro offer concrete specifications. The first
      is a circular route from Miranda do Douro to São João das Arribas that can be done on foot, by bike or
      on horseback: it measures 8 kilometres and takes about two and a half hours. It departs from the Miranda
      do Douro tourist office, heads north through Vale de Águia and Aldeia Nova to the chapel of São João das
      Arribas above the Douro valley, and returns via Aldeia Nova and Pena Branca, following the Fresno River
      in the final stretch. The second, from Paradela to São João das Arribas, measures 9 kilometres and takes
      about three hours: it begins at the Paradela viewpoint (Penha das Torres) and finishes at São João das
      Arribas near Aldeia Nova. In addition, the park master plan identifies four signposted walking trails.


      Among noteworthy sites, the Faia da Água Alta waterfall in Bemposta stands out. For further insights,
      the Spanish bank houses two visitor centres (Casas del Parque), one in the convent of San Francisco in
      Fermoselle and another in the tower of Sobradillo.
    history: >-
      Spain and Portugal agreed in 1927 to divide the hydroelectric exploitation of the international Douro
      into two stretches. The Portuguese government incorporated this territory into its network of protected
      areas on 11 May 1998. Wildfires pose the primary threat to ecosystems and habitats; further concerns
      include new dams, pollution discharges and major power lines.
    before: >-
      Allow between two and four days for the area as a whole. The two routes with concrete details are
      stretches of eight and nine kilometres with their own starting points: focus on a single sector per day.
    around: >-
      The atlas has no immediate neighbours for this park, but it shares species and landscape traits with
      distant sites: [Monfragüe National Park](/lugar/parque-nacional-de-monfrague/) and the [Demir Kapija
      Gorge — Iron Gate of the Vardar](/lugar/demir-kapiska-klisura/) also feature Egyptian vulture and black
      stork within canyon and river corridors.
  fr:
    intro: >-
      Sur ce tronçon, le fleuve Douro est une frontière. Les canyons creusés par le Douro et l'Águeda font
      office de limite naturelle entre l'Espagne et le Portugal sur la quasi-totalité de la zone, formant un
      couloir linéaire de plus de 120 kilomètres. Le Douro sert de fleuve frontalier depuis le barrage de
      Castro jusqu'à Barca de Alva, où l'Águeda le rejoint, faisant lui-même office de frontière jusqu'à sa
      confluence avec le Turones. Sur la rive portugaise, le parc naturel s'étend sur les communes de
      Mogadouro, Miranda do Douro, Freixo de Espada à Cinta et Figueira de Castelo Rodrigo, créé pour protéger
      le paysage de la région ainsi que sa flore et sa faune.
    landscape: >-
      Le parc associe de grands canyons fluviaux, des escarpements et le plateau mirandais. Le plateau
      mirandais présente des sols de schiste et parfois de granit, dans lesquels le fleuve s'encaisse en
      laissant des gorges. Sur le tronçon de Paradela à São João das Arribas, le chemin longe le bord d'un
      canyon aux parois verticales de plus de 150 mètres. À Paradela, le point le plus oriental du Portugal,
      de petites crêtes de quartzite se détachent sur un environnement de schistes ; à São João das Arribas,
      en revanche, dominent des escarpements granitiques vigoureux et abrupts là où le Douro s'enfonce dans le
      plateau. La vallée y apparaît rectiligne, encaissée et conditionnée par la fracturation régionale.


      Les falaises hautes, encaissées et d'accès difficile du canton de Miranda favorisent des espèces qui
      auraient autrement disparu. La gorge du Douro agit en outre comme un condensateur thermique : hivers
      courts et doux, étés longs et chauds face au plateau froid environnant.
    wildlife: >-
      Le fleuve et ses falaises constituent le royaume des oiseaux. Sur la rive espagnole, le parc naturel des
      Arribes del Duero partage canyon et espèces avec le côté portugais ; la [cigogne
      noire](/especie/ciconia_nigra/) y est l'oiseau le plus emblématique, nichant dans les anfractuosités des
      parois. Les espèces ayant motivé le classement en zone de protection spéciale sont l'[aigle de
      Bonelli](/especie/aquila_fasciata/), l'[aigle royal](/especie/aquila_chrysaetos/), le [vautour
      percnoptère](/especie/neophron_percnopterus/), le [grand-duc d'Europe](/especie/bubo_bubo/), le [vautour
      fauve](/especie/gyps_fulvus/), le [crave à bec rouge](/especie/pyrrhocorax_pyrrhocorax/), la cigogne
      noire et le [faucon pèlerin](/especie/falco_peregrinus/).


      L'hirondelle de rochers y réside toute l'année grâce au microclimat ; le grand corbeau, l'hirondelle
      rousseline, le choucas des tours, le monticole merle-bleu et le martinet à ventre blanc y nichent
      également. Sur les berges, on observe le petit gravelot, la foulque macroule, la poule d'eau, le héron
      cendré, le [martin-pêcheur d'Europe](/especie/alcedo_atthis/) et le cincle plongeur. Parmi les
      mammifères, on compte au moins quatorze espèces de chauves-souris profitant de l'abri des falaises et du
      climat clément. La [loutre d'Europe](/especie/lutra_lutra/), rare en Europe, avait presque disparu du
      Douro à cause des barrages et se rétablit peu à peu, tandis que le [loup gris](/especie/canis_lupus/)
      demeure présent, bien qu'en moindre effectif qu'autrefois.


      Les meilleures saisons pour la visite sont le printemps et l'automne.
    visit: >-
      Les belvédères sont le moyen le plus direct d'admirer le canyon. Miranda do Douro propose le Miradouro
      do Centro de Interpretação ainsi que deux autres : Castrilhouço et Sé Catedral ; Picote offre ceux de
      Fraga do Puio et Fraga Amarela ; Poiares ceux d'Assumadouro et Penedo Durão. À Sendim, le belvédère do
      Carreirão das Arribas permet de contempler les falaises et de marcher le long du fleuve parmi la
      végétation typique du parc.


      Pour la marche, deux itinéraires de la municipalité de Miranda do Douro disposent de données précises.
      Le premier est un circuit de Miranda do Douro à São João das Arribas praticable à pied, à vélo ou à
      cheval : il mesure 8 kilomètres et demande environ deux heures et demie. Il part de l'office de tourisme
      de Miranda do Douro, file vers le nord par Vale de Águia et Aldeia Nova jusqu'à la chapelle de São João
      das Arribas au-dessus de la vallée du Douro, puis revient par Aldeia Nova et Pena Branca en suivant le
      fleuve Fresno sur le dernier tronçon. Le second, de Paradela à São João das Arribas, mesure 9 kilomètres
      et nécessite environ trois heures : il part du belvédère de Paradela (Penha das Torres) pour s'achever à
      celui de São João das Arribas près d'Aldeia Nova. De plus, le plan du parc recense quatre sentiers
      pédestres balisés.


      Parmi les sites remarquables, citons la cascade de la Faia da Água Alta à Bemposta. Pour approfondir, la
      rive espagnole compte deux maisons du parc (Casas del Parque), l'une dans le couvent San Francisco de
      Fermoselle et l'autre dans la tour de Sobradillo.
    history: >-
      L'Espagne et le Portugal sont convenus en 1927 de se partager l'exploitation hydroélectrique du Douro
      international en deux tronçons. Le gouvernement portugais a intégré ce territoire à son réseau d'espaces
      protégés le 11 mai 1998. Les incendies représentent la principale menace pour les écosystèmes et les
      habitats ; de nouveaux barrages, rejets polluants et lignes électriques à haute tension suscitent
      également des inquiétudes.
    before: >-
      Prévoyez deux à quatre jours pour explorer l'ensemble. Les deux itinéraires aux données précises
      constituent des tronçons de huit et neuf kilomètres disposant de leurs propres points de départ :
      privilégiez un seul secteur par journée.
    around: >-
      L'atlas ne compte pas de voisins immédiats pour ce parc, mais celui-ci partage espèces et traits
      paysagers avec des sites plus distants : le [Parc national de
      Monfragüe](/lugar/parque-nacional-de-monfrague/) et la [Gorge de Demir Kapija — Porte de Fer du
      Vardar](/lugar/demir-kapiska-klisura/) abritent également le percnoptère et la cigogne noire au sein de
      canyons et corridors fluviaux.
  de:
    intro: >-
      In diesem Abschnitt ist der Duero eine Grenze. Die von Duero und Águeda gegrabenen Canyons bilden fast
      im gesamten Gebiet die natürliche Trennlinie zwischen Spanien und Portugal und erstrecken sich
      linienförmig über mehr als 120 Kilometer. Der Duero fungiert von der Talsperre Castro bis Barca de Alva
      als Grenzfluss, wo der Águeda einmündet, der seinerseits bis zur Vereinigung mit dem Turones die Grenze
      markiert. Auf der portugiesischen Uferseite umfasst der Naturpark Flächen in Mogadouro, Miranda do
      Douro, Freixo de Espada à Cinta und Figueira de Castelo Rodrigo und wurde geschaffen, um die Landschaft
      der Region sowie deren Flora und Fauna zu schützen.
    landscape: >-
      Der Park vereint gewaltige Flussschluchten, Felsabstürze und die Hochebene von Miranda. Die Hochebene
      von Miranda weist Schiefer- und vereinzelt Granitböden auf, in die sich der Fluss eingräbt und
      Schluchten hinterlässt. Im Abschnitt von Paradela nach São João das Arribas verläuft der Weg am Rand
      eines Canyons mit senkrechten Felswänden von über 150 Metern Höhe. In Paradela, dem östlichsten Punkt
      Portugals, ragen kleine Quarzitkämme aus der Schieferlandschaft hervor; bei São João das Arribas
      hingegen dominieren wuchtige, steile Granitwände, an denen sich der Duero in die Hochebene schneidet.
      Das Tal wirkt dort geradlinig, eingetieft und durch regionale Bruchlinien geprägt.


      Die hohen, unzugänglichen Steilufer des Bezirks Miranda begünstigen Arten, die andernfalls lokal
      verschwunden wären. Die Duero-Schlucht dient zudem als Wärmespeicher: kurze, milde Winter und lange,
      heiße Sommer im Kontrast zur kühlen Hochebene.
    wildlife: >-
      Der Fluss und seine Steilwände sind das Reich der Vögel. Am spanischen Ufer teilt der Naturpark Arribes
      del Duero Canyon und Artenreichtum mit der portugiesischen Seite; dort ist der
      [Schwarzstorch](/especie/ciconia_nigra/) der symbolträchtigste Vogel, der in Nischen und Absätzen der
      Wände nistet. Ausschlaggebend für die Ausweisung als Vogelschutzgebiet waren der
      [Habichtsadler](/especie/aquila_fasciata/), der [Steinadler](/especie/aquila_chrysaetos/), der
      [Schmutzgeier](/especie/neophron_percnopterus/), der [Uhu](/especie/bubo_bubo/), der
      [Gänsegeier](/especie/gyps_fulvus/), die [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/), der
      Schwarzstorch und der [Wanderfalke](/especie/falco_peregrinus/).


      Die Felsenschwalbe verweilt dank des Mikroklimas ganzjährig; Kolkrabe, Rötelschwalbe, Dohle, Blaumerle
      und Alpensegler brüten ebenfalls hier. An den Ufern trifft man auf Flussregenpfeifer, Blässhuhn,
      Teichhuhn, Graureiher, den [Eisvogel](/especie/alcedo_atthis/) und die Wasseramsel. Unter den
      Säugetieren gibt es mindestens vierzehn Fledermausarten, die Felsspalten und das milde Klima nutzen. Der
      in Europa seltene [Fischotter](/especie/lutra_lutra/) war durch Talsperrenbauten am Duero beinahe
      verschwunden und erholt sich allmählich, während der [Wolf](/especie/canis_lupus/) nach wie vor
      vorkommt, wenn auch seltener als früher.


      Die besten Besuchszeiten sind Frühling und Herbst.
    visit: >-
      Aussichtspunkte sind der unmittelbarste Weg, den Canyon zu überblicken. Miranda do Douro bietet den
      Miradouro do Centro de Interpretação sowie Castrilhouço und Sé Catedral; Picote verfügt über Fraga do
      Puio und Fraga Amarela; Poiares über Assumadouro und Penedo Durão. In Sendim erlaubt der Aussichtspunkt
      Carreirão das Arribas weite Blicke auf die Steilwände und Uferspaziergänge inmitten parktypischer Flora.


      Zum Wandern bieten zwei Routen der Gemeinde Miranda do Douro exakte Kenndaten. Die erste ist ein Rundweg
      von Miranda do Douro nach São João das Arribas zu Fuß, per Rad oder zu Pferd: Er misst 8 Kilometer und
      dauert rund zweieinhalb Stunden. Er startet am Tourismusbüro in Miranda do Douro, führt nordwärts über
      Vale de Águia und Aldeia Nova zur Kapelle São João das Arribas hoch über dem Duerotal und kehrt über
      Aldeia Nova und Pena Branca zurück, im Schlussabschnitt dem Fluss Fresno folgend. Die zweite Route, von
      Paradela nach São João das Arribas, misst 9 Kilometer und benötigt etwa drei Stunden: Sie beginnt am
      Miradouro von Paradela (Penha das Torres) und endet an jenem von São João das Arribas nahe Aldeia Nova.
      Zudem führt der Parkplan vier markierte Wanderwege auf.


      Zu den Höhepunkten zählt der Wasserfall Faia da Água Alta in Bemposta. Zur Vertiefung stehen am
      spanischen Ufer zwei Besucherzentren (Casas del Parque) offen: im Franziskanerkloster von Fermoselle und
      im Wehrturm von Sobradillo.
    history: >-
      Spanien und Portugal vereinbarten 1927 die Aufteilung der Wasserkraftnutzung des internationalen Duero
      in zwei Zonen. Die portugiesische Regierung gliederte dieses Territorium am 11. Mai 1998 in ihr
      Schutzgebietsnetz ein. Waldbrände bilden die größte Gefahr für Ökosysteme und Lebensräume; Besorgnis
      erregen zudem neue Staudämme, Einleitungen und Hochspannungsleitungen.
    before: >-
      Planen Sie zwei bis vier Tage für das Gesamtgebiet ein. Die beiden detaillierten Wanderrouten sind
      Abschnitte von acht und neun Kilometern mit eigenen Startpunkten: Beschränken Sie sich pro Tag auf einen
      Sektor.
    around: >-
      Der Atlas führt keine unmittelbaren Nachbarn dieses Parks, er teilt jedoch Arten und Landschaftszüge mit
      entfernten Gebieten: Der [Nationalpark Monfragüe](/lugar/parque-nacional-de-monfrague/) und die
      [Demir-Kapija-Schlucht — Eisernes Tor des Vardar](/lugar/demir-kapiska-klisura/) beherbergen ebenfalls
      Schmutzgeier und Schwarzstorch in Canyon- und Flusskorridoren.
  it:
    intro: >-
      In questo tratto il fiume Duero è un confine. I canyon scavati dal Duero e dall'Águeda fungono da limite
      naturale tra Spagna e Portogallo su quasi tutta l'area, estendendosi linearmente per oltre 120
      chilometri. Il Duero è fiume di confine dalla diga di Castro fino a Barca de Alva, dove confluisce
      l'Águeda, che a sua volta segna la frontiera fino all'unione con il Turones. Sulla sponda portoghese il
      parco naturale abbraccia terreni di Mogadouro, Miranda do Douro, Freixo de Espada à Cinta e Figueira de
      Castelo Rodrigo, istituito per salvaguardare il paesaggio della regione assieme a flora e fauna.
    landscape: >-
      Il parco racchiude vasti canyon fluviali, scarpate e l'altopiano mirandese. L'altopiano mirandese
      presenta suoli di scisto e talvolta di granito, in cui il fiume si incassa lasciando gole profonde. Nel
      tratto da Paradela a São João das Arribas il sentiero corre sul ciglio di un canyon con pareti verticali
      di oltre 150 metri. A Paradela, punto più orientale del Portogallo, piccole creste di quarzite risaltano
      sull'ambiente scistoso; a São João das Arribas dominano invece scarpate granitiche vigorose e scoscese
      dove il Duero intaglia l'altopiano. La valle vi appare rettilinea, incassata e condizionata dalla
      tettonica regionale.


      Le rupi alte, incassate e di difficile accesso del comune di Miranda favoriscono specie che altrimenti
      sarebbero estinte localmente. La gola del Duero agisce inoltre come trappola termica: inverni brevi e
      miti ed estati lunghe e calde a confronto con il freddo altopiano soprastante.
    wildlife: >-
      Il fiume e le sue rupi sono il regno dei volatili. Sulla sponda spagnola il parco naturale di Arribes
      del Duero condivide canyon e specie con il versante portoghese; la [cicogna
      nera](/especie/ciconia_nigra/) vi rappresenta l'uccello più emblematico, nidificando negli anfratti
      delle pareti. Le specie all'origine della zona di protezione speciale sono l'[aquila del
      Bonelli](/especie/aquila_fasciata/), l'[aquila reale](/especie/aquila_chrysaetos/), il
      [capovaccaio](/especie/neophron_percnopterus/), il [gufo reale](/especie/bubo_bubo/), il
      [grifone](/especie/gyps_fulvus/), il [gracchio corallino](/especie/pyrrhocorax_pyrrhocorax/), la cicogna
      nera e il [falco pellegrino](/especie/falco_peregrinus/).


      Il rondone montano vi soggiorna tutto l'anno grazie al microclima; vi nidificano pure corvo imperiale,
      rondine rossiccia, taccola, passero solitario e rondone maggiore. Lungo i fiumi si osservano corriere
      piccolo, folaga, gallinella d'acqua, airone cenerino, [martin pescatore comune](/especie/alcedo_atthis/)
      e merlo acquaiolo. Tra i mammiferi si contano almeno quattordici specie di pipistrelli al riparo delle
      rupi e del clima mite. La [lontra europea](/especie/lutra_lutra/), rara in Europa, era quasi sparita dal
      Duero a causa dei bacini artificiali e si sta riprendendo gradualmente, mentre il
      [lupo](/especie/canis_lupus/) è ancora presente, sebbene in densità inferiore al passato.


      Le stagioni ideali per la visita sono primavera e autunno.
    visit: >-
      I punti panoramici offrono il contatto più diretto con il canyon. Miranda do Douro vanta il Miradouro do
      Centro de Interpretação assieme a Castrilhouço e Sé Catedral; Picote dispone di Fraga do Puio e Fraga
      Amarela; Poiares di Assumadouro e Penedo Durão. A Sendim il belvedere di Carreirão das Arribas consente
      di ammirare le rupi e camminare lungo il fiume tra la vegetazione caratteristica.


      Per camminare, due itinerari del comune di Miranda do Douro presentano dati precisi. Il primo è un
      anello da Miranda do Douro a São João das Arribas percorribile a piedi, in bici o a cavallo: misura 8
      chilometri e richiede circa due ore e mezza. Parte dall'ufficio del turismo di Miranda do Douro, procede
      a nord per Vale de Águia e Aldeia Nova fino alla cappella di São João das Arribas a picco sul Duero,
      tornando per Aldeia Nova e Pena Branca lungo il fiume Fresno nell'ultimo tratto. Il secondo, da Paradela
      a São João das Arribas, misura 9 chilometri e impegna circa tre ore: prende avvio dal belvedere di
      Paradela (Penha das Torres) per terminare a São João das Arribas vicino ad Aldeia Nova. Il piano del
      parco individua inoltre quattro percorsi pedonali segnalati.


      Tra i punti di rilievo spicca la cascata della Faia da Água Alta a Bemposta. Per approfondire, sulla
      sponda spagnola sorgono due centri visitatori (Casas del Parque): uno nell'antico convento di San
      Francisco a Fermoselle e l'altro nel torrione di Sobradillo.
    history: >-
      Spagna e Portogallo concordarono nel 1927 la suddivisione dello sfruttamento idroelettrico del Duero
      internazionale in due settori. Il governo portoghese ha inserito questo territorio nella propria rete di
      aree protette l'11 maggio 1998. Gli incendi costituiscono la principale minaccia per ecosistemi e
      habitat; destano preoccupazione anche nuove dighe, scarichi inquinanti e grandi elettrodotti.
    before: >-
      Calcolate tra due e quattro giorni per visitare l'intero comprensorio. Le due rotte con dettagli
      puntuali sono percorsi di otto e nove chilometri con distinti punti di partenza: consigliabile dedicarsi
      a un unico settore per giornata.
    around: >-
      L'atlas non include aree contigue a questo parco, ma esso condivide specie e fisionomia con mete remote:
      il [Parco Nazionale di Monfragüe](/lugar/parque-nacional-de-monfrague/) e la [Gola di Demir Kapija —
      Porta di Ferro del Vardar](/lugar/demir-kapiska-klisura/) accolgono capovaccaio e cicogna nera in
      ambienti fluviali e forre rupestri.
  pt:
    intro: >-
      Neste troço, o rio Douro é uma fronteira. Os desfiladeiros escavados pelo Douro e pelo Águeda formam o
      limite natural entre Espanha e Portugal em quase toda a zona, estendendo-se em linha ao longo de mais de
      120 quilómetros. O Douro faz de rio fronteiriço desde a barragem de Castro até Barca de Alva, onde se
      lhe junta o Águeda, que o é até à confluência com o Turones. Na margem portuguesa, o parque natural
      abrange terrenos de Mogadouro, Miranda do Douro, Freixo de Espada à Cinta e Figueira de Castelo Rodrigo,
      tendo sido criado para proteger a paisagem regional e a sua flora e fauna.
    landscape: >-
      O parque integra grandes canhões fluviais, escarpas e o planalto mirandês. O planalto mirandês possui
      solos de xisto e, por vezes, de granito, nos quais o rio se encaixa rasgando gargantas. No troço de
      Paradela a São João das Arribas, o caminho corre à beira de um desfiladeiro com paredes verticais de
      mais de 150 metros. Em Paradela, o ponto mais oriental de Portugal, pequenas cristas de quartzito
      destacam-se sobre a paisagem xistosa; em São João das Arribas, pelo contrário, dominam escarpas
      graníticas vigorosas e abruptas onde o Douro morde o planalto. O vale apresenta-se ali retilíneo,
      encaixado e condicionado pela fraturação regional.


      As arribas altas, encaixadas e de acesso difícil do concelho de Miranda favorecem espécies que de outro
      modo estariam extintas localmente. A garganta do Douro funciona também como condensador térmico:
      invernos curtos e suaves e verões longos e quentes em contraste com o planalto frio.
    wildlife: >-
      O rio e as suas escarpas são o reino das aves. Na margem espanhola, o parque natural de Arribes del
      Duero partilha desfiladeiro e espécies com o lado português, sendo a
      [cegonha-preta](/especie/ciconia_nigra/) a ave mais emblemática, nidificando em reentrâncias e patamares
      das escarpas. As espécies que justificaram a classificação como Zona de Proteção Especial foram a
      [águia-perdigueira](/especie/aquila_fasciata/), a [águia-real](/especie/aquila_chrysaetos/), o
      [abutre-do-egito](/especie/neophron_percnopterus/), o [bufo-real](/especie/bubo_bubo/), o
      [grifo](/especie/gyps_fulvus/), a [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/), a
      cegonha-preta e o [falcão-peregrino](/especie/falco_peregrinus/).


      O andorinhão-das-rochas permanece o ano inteiro graças ao microclima; nidificam também o corvo, a
      andorinha-dáurica, a gralha-de-nuca-cinzenta, o melro-azul e o andorinhão-real. Nas margens avistam-se o
      borrelho-pequeno, a galeirão-comum, a galinha-d'água, a garça-real, o
      [guarda-rios-comum](/especie/alcedo_atthis/) e o melro-d'água. Entre os mamíferos registam-se pelo menos
      catorze espécies de morcegos, aproveitando o abrigo das escarpas e a amenidade térmica. A
      [lontra-europeia](/especie/lutra_lutra/), rara na Europa, quase desapareceu do Douro devido às barragens
      e recupera paulatinamente, mantendo-se a presença do [lobo](/especie/canis_lupus/), embora com menor
      abundância do que outrora.


      As melhores épocas para a visita são a primavera e o outono.
    visit: >-
      Os miradouros constituem a via mais imediata para contemplar o canhão. Miranda do Douro oferece o
      Miradouro do Centro de Interpretação junto a outros dois: Castrilhouço e Sé Catedral; Picote acolhe
      Fraga do Puio e Fraga Amarela; Poiares apresenta Assumadouro e Penedo Durão. Em Sendim, o miradouro do
      Carreirão das Arribas desvenda as escarpas e permite caminhar junto às margens entre vegetação
      autóctone.


      Para percursos pedestres, dois trilhos do município de Miranda do Douro contam com dados detalhados. O
      primeiro é um circuito de Miranda do Douro a São João das Arribas que pode realizar-se a pé, de
      bicicleta ou a cavalo: mede 8 quilómetros e demora cerca de duas horas e meia. Tem partida no posto de
      turismo de Miranda do Douro, segue para norte por Vale de Águia e Aldeia Nova até à capela de São João
      das Arribas sobre o vale do Douro, regressando por Aldeia Nova e Pena Branca, acompanhando no troço
      final o rio Fresno. O segundo, de Paradela a São João das Arribas, mede 9 quilómetros e requer cerca de
      três horas: tem início no miradouro de Paradela (Penha das Torres) e termina no de São João das Arribas
      perto de Aldeia Nova. O plano do parque contempla ainda quatro percursos pedestres sinalizados.


      Entre os locais notáveis destaca-se a cascata da Faia da Água Alta, em Bemposta. Para aprofundar, a
      margem espanhola dispõe de duas Casas del Parque: uma no convento de San Francisco de Fermoselle e outra
      no torreão de Sobradillo.
    history: >-
      Espanha e Portugal acordaram em 1927 repartir o aproveitamento hidroelétrico do Douro internacional em
      dois setores. O governo português integrou este território na sua rede de áreas protegidas a 11 de maio
      de 1998. Os incêndios constituem a principal ameaça aos ecossistemas e habitats; preocupam igualmente
      novas barragens, descargas poluentes e grandes linhas elétricas.
    before: >-
      Calcule entre dois e quatro dias para visitar a globalidade do território. Os dois percursos com dados
      práticos compreendem troços de oito e nove quilómetros com partidas distintas: selecione apenas um setor
      por jornada.
    around: >-
      O atlas não contempla áreas vizinhas imediatas a este parque, mas partilha espécies e feição
      paisagística com destinos distantes: o [Parque Nacional de
      Monfragüe](/lugar/parque-nacional-de-monfrague/) e a [Garganta de Demir Kapija — Porta de Ferro do
      Vardar](/lugar/demir-kapiska-klisura/) acolhem igualmente o abutre-do-egito e a cegonha-preta em
      gargantas e corredores fluviais.
