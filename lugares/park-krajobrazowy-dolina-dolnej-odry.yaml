unico:
  es: >-
    Un laberinto de canales y brazos muertos de más de doscientos kilómetros entre dos brazos de un gran río,
    que desde hace más de cincuenta años crece sin que nadie lo corte.
  en: >-
    A labyrinth of channels and oxbows stretching over two hundred kilometres between two arms of a great
    river, growing untouched for over fifty years.
  fr: >-
    Un dédale de canaux et de bras morts de plus de deux cents kilomètres entre deux bras d'un grand fleuve,
    évoluant librement depuis plus de cinquante ans.
  de: >-
    Ein Labyrinth aus Kanälen und Altarmen von über zweihundert Kilometern Länge zwischen zwei Flussarmen, das
    seit über fünfzig Jahren ungestört wächst.
  it: >-
    Un labirinto di canali e lanche di oltre duecento chilometri tra due rami di un grande fiume, che da più
    di cinquant'anni cresce senza interventi umani.
  pt: >-
    Um labirinto de canais e braços mortos com mais de duzentos quilómetros entre dois braços de um grande
    rio, que há mais de cinquenta anos cresce sem intervenção humana.
observaciones:
  es: >-
    En el parque está prohibido utilizar embarcaciones a motor fuera de los cauces principales, salvo para
    servicios autorizados. Los canales, las esclusas inactivas y los terrenos pantanosos hacen imposible
    caminar por buena parte del interior del Międzyodrze.
texto:
  es:
    intro: >-
      Hay un lugar en el bajo Oder donde el río se parte en dos, y entre los dos brazos queda un mundo propio.
      Cerca de Widuchowa el Oder se divide en el Oder Occidental y el Regalica, y entre ambos se extiende el
      Międzyodrze, una llanura plana de turbera cruzada por más de doscientos kilómetros de canales, brazos
      muertos y zanjas. Es la mayor turbera baja fluvial de Europa Occidental y Central, y alberga plantas y
      animales que ya no existen en otros grandes valles fluviales. El parque paisajístico Dolina Dolnej Odry,
      creado el 1 de abril de 1993, protege su parte polaca; al sur, en el lado alemán, el valle está
      protegido también como parque nacional.
    landscape: >-
      El Międzyodrze mide entre unos 2 km de ancho en el sur y hasta 12 km cerca de Szczecin. Su forma actual
      nació tras la última glaciación, y el cauce múltiple se debe al rápido crecimiento de la turba desde
      hace unos 6 mil años.


      Las obras de regulación del Oder de 1904 rompieron el ritmo natural del valle, y en 1932 la zona entre
      los dos brazos se hizo apta para uso agrícola. Para controlar el agua se construyeron diques, una red de
      canales nuevos y 36 esclusas, estaciones de bombeo y otras obras. La guerra destruyó la mayoría de
      ellas, y desde finales de los años sesenta la naturaleza empezó a volver. Hoy el 81 % de la superficie
      está cubierta por vegetación de pantano sin árboles, y sobre los diques artificiales han crecido
      valiosos bosques de ribera. Desde hace más de 50 años los hábitats se desarrollan sin perturbación
      humana.


      Desde las laderas del valle, que cerca de Szczecin y Widuchowa llegan a los 70 m de altitud, se ven las
      islas del Międzyodrze.
    wildlife: >-
      El parque es parada de las migraciones anuales hacia el sur y lugar de descanso para miles de patos,
      gansos y grullas. Hasta 20 000 gansos y 13 000 [grullas](/especie/grus_grus/) pasan por aquí en ciertas
      épocas, y la mayor parte de las más de 250 especies de aves viven aquí todo el año.


      **Primavera.** Es zona de cría de limícolas y patos. **Verano.** Tras la cría se convierte en lugar de
      muda. Entre las aves nidificantes amenazadas en Europa están el [pigargo
      europeo](/especie/haliaeetus_albicilla/), el [águila pescadora](/especie/pandion_haliaetus/), el
      [aguilucho cenizo](/especie/circus_pygargus/), el búho campestre, el bigotudo, el [carricerín
      cejudo](/especie/acrocephalus_paludicola/) y el rascón. **Otoño.** Las aves de paso duermen en este
      lugar seguro y poco accesible, y el [martín pescador](/especie/alcedo_atthis/), que fue símbolo del
      parque, sigue siendo abundante durante la migración. **Invierno.** Los canales se convierten en zonas de
      invernada.


      Entre los mamíferos, el [castor](/especie/castor_fiber/) construye sus madrigueras con ramas y barro, y
      se ven sobre todo desde el agua. La [nutria](/especie/lutra_lutra/) también vive aquí. Al anochecer se
      ve cuántos murciélagos hay: cazan sobre la superficie del agua. El [alce](/especie/alces_alces/) es un
      visitante raro y se registra solo de forma esporádica.


      Entre los anfibios más valiosos están el sapo corredor, la rana, el [sapillo de vientre de
      fuego](/especie/bombina_bombina/) y el tritón crestado. De junio a septiembre se ve en los canales una
      libélula estrictamente protegida (en polaco, trzepla zielona). Y la flora no es menos notable: se han
      hallado más de 400 especies de plantas, entre ellas la salvinia flotante, el helecho de agua más pequeño
      y raro en Europa, y la castaña de agua. Los nenúfares blancos y amarillos y otras plantas forman
      alfombras flotantes, a veces tan densas que impiden remar.
    visit: >-
      El parque aconseja el kayak y el turismo acuático como la mejor forma de recorrerlo, porque los canales
      y las esclusas inactivas impiden ir a pie. La mayor parte del parque es accesible a los turistas, salvo
      las reservas. Hay que llevar mapa, teléfono móvil y agua.


      La ruta **Żabnica–Moczyły** es un circuito entre el Oder Occidental y el Regalica por antiguos cauces y
      brazos muertos, considerado por muchos el más bello del Międzyodrze, aunque en pleno verano se vuelve
      más difícil por la vegetación acuática que hay que atravesar. La salida clásica parte del embarcadero de
      Siadło Dolne y pasa por el Kanał Kwiatowy, de agua cristalina que deja ver el mundo submarino. En ella
      aparece el lago Samotne, que nació al construir el terraplén de la autopista y cuyo punto más hondo está
      a 16 m bajo la superficie. Desde la playa de Gryfino se puede remar por el Kanał Długi, donde aparecen
      madrigueras de castor.


      A pie y en bici, la ruta ciclista **Zielona Odra** va de Gryfino a Widuchowa por el Bosque Torcido y
      mide unos 18 km: 2 horas en bici o 4 a pie. Casi toda va por caminos asfaltados o firmes y sin grandes
      desniveles. Antes de Widuchowa hay que subir a una plataforma de observación en la Góra Słowiańska, con
      vistas al borde sur del parque y al parque nacional alemán. Para caminar por el Międzyodrze, se
      recomienda hacerlo en las tierras altas y el borde del valle, porque los puentes, pasarelas y esclusas
      del interior están en muy mal estado.
    history: >-
      Cerca de Gartz, en Alemania, todavía quedan los pilares de un viejo puente sobre el Oder Occidental
      destruido en abril de 1945. El parque paisajístico y el parque nacional alemán de Unteres Odertal forman
      juntos el Parque Internacional del Valle del Bajo Oder.
    before: >-
      En el parque está prohibido utilizar embarcaciones a motor fuera de los cauces principales, salvo para
      servicios autorizados. Los canales, las esclusas inactivas y los terrenos pantanosos hacen imposible
      caminar por buena parte del interior del Międzyodrze.
    around: >-
      Lejos de aquí, el [Parque Nacional de Narew](/lugar/narwianski-park-narodowy/) comparte con el Bajo Oder
      el aguilucho cenizo y el castor, y como él es un valle fluvial de humedales; también el [Parque Nacional
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) comparte el aguilucho cenizo y el búho
      campestre.
  en:
    intro: >-
      There is a place in the lower Oder where the river splits in two, holding its own separate world between
      both branches. Near Widuchowa, the Oder divides into the Western Oder and the Regalica, embracing the
      Międzyodrze: a vast peatland plain crossed by more than two hundred kilometres of canals, oxbow lakes
      and drainage channels. It is the largest riverine fen peatland in Western and Central Europe, sheltering
      plants and animals that have vanished from other great river corridors. The Dolina Dolnej Odry Landscape
      Park, designated on 1 April 1993, protects the Polish portion, while directly southward on the German
      side the valley is preserved as a national park.
    landscape: >-
      The Międzyodrze spans roughly 2 km across in the south and widens up to 12 km near Szczecin. Its current
      topography emerged after the last ice age, and its braided network of multiple channels formed through
      the rapid accumulation of fen peat over the past 6 thousand years.


      River engineering works carried out in 1904 altered the natural hydrological rhythm of the valley, and
      by 1932 the land between both branches had been reclaimed for agricultural use. Dykes, a dense canal
      grid and 36 sluices, pumping stations and regulatory structures were built to manage water levels. World
      War II destroyed most of these works, and from the late sixties onward natural processes reclaimed the
      floodplain. Today, 81 % of the surface is cloaked in treeless wetland mire, while mature riparian
      woodlands thrive along former artificial dykes. For more than 50 years these habitats have evolved
      without human disturbance.


      From the valley slopes, which rise to 70 m in altitude near Szczecin and Widuchowa, you can look out
      across the islands of the Międzyodrze.
    wildlife: >-
      The park serves as a major staging ground along southern migration routes and a resting haven for
      thousands of ducks, geese and cranes. Up to 20,000 geese and 13,000 [common cranes](/especie/grus_grus/)
      gather here during seasonal peaks, while the majority of the more than 250 bird species recorded reside
      throughout the year.


      **Spring.** The fen provides nesting territory for wading birds and waterfowl. **Summer.** Post-breeding
      flocks gather for their annual moult. Threatened breeding species in Europe include the [white-tailed
      eagle](/especie/haliaeetus_albicilla/), [osprey](/especie/pandion_haliaetus/), [Montagu's
      harrier](/especie/circus_pygargus/), short-eared owl, bearded reedling, [aquatic
      warbler](/especie/acrocephalus_paludicola/) and water rail. **Autumn.** Migrating flocks roost safely in
      this secluded terrain, and the [common kingfisher](/especie/alcedo_atthis/), historic emblem of the
      park, remains abundant on passage. **Winter.** Ice-free channels offer crucial wintering water.


      Among mammals, the [Eurasian beaver](/especie/castor_fiber/) builds substantial lodges of branches and
      mud, spotted best from the water. The [Eurasian otter](/especie/lutra_lutra/) also thrives here. At
      dusk, numerous bats emerge to forage low over the water. The [moose](/especie/alces_alces/) is a rare
      wanderer, appearing only sporadically.


      Notable amphibians include the natterjack toad, pool frog, [European fire-bellied
      toad](/especie/bombina_bombina/) and northern crested newt. From June to September, the strictly
      protected green snaketail dragonfly (*trzepla zielona*) patrols the canals. Plant life is equally
      distinguished: over 400 plant species have been identified, including floating watermoss, Europe's
      smallest and rarest aquatic fern, alongside water chestnut. White and yellow water lilies form sprawling
      floating carpets that can temporarily block kayak paddles.
    visit: >-
      The park recommends kayaking and water-based touring as the ideal way to explore the terrain, as
      channels and disused sluices make overland foot travel impossible. Most of the park is open to visitors,
      except designated strict reserves. Always carry a topographical map, mobile phone and drinking water.


      The **Żabnica–Moczyły** trail is a loop between the Western Oder and the Regalica through meandering old
      river arms, widely regarded as the most picturesque route in the Międzyodrze, though dense summer weed
      growth can demand extra effort. A classic put-in is the slipway at Siadło Dolne, heading down Kanał
      Kwiatowy, whose clear water reveals aquatic vegetation below. En route lies Lake Samotne, formed during
      motorway embankment construction, reaching a depth of 16 m. From the riverside beach at Gryfino, you can
      paddle along Kanał Długi past active beaver lodges.


      On foot and by bicycle, the **Zielona Odra** cycle trail connects Gryfino to Widuchowa via the Crooked
      Forest over roughly 18 km: 2 hours by bicycle or 4 on foot, mostly along paved or firm surfaces with
      gentle gradients. Approaching Widuchowa, climb the observation platform on Góra Słowiańska for panoramic
      views across the southern park boundary into the German national park. If you wish to walk the
      Międzyodrze, stick to the bluffs and valley rim, as interior bridges and sluice walkways are in severe
      disrepair.
    history: >-
      Near Gartz on the German bank, the stone piers of an old bridge blown up in April 1945 still stand in
      the Western Oder. Together, the Polish landscape park and the German Unteres Odertal National Park form
      the Lower Oder Valley International Park.
    before: >-
      Motorised watercraft are forbidden within the park outside the main shipping fairways, except for
      authorised patrol services. Intersecting channels, decayed sluice infrastructure and flooded peat bog
      make walking impossible through much of the interior Międzyodrze.
    around: >-
      Further afield, [Narew National Park](/lugar/narwianski-park-narodowy/) shares with the lower Oder the
      Montagu's harrier and beaver across its wetland floodplain; [Fertő-Hanság National
      Park](/lugar/ferto-hansag-nemzeti-park---hansag/) also shares the Montagu's harrier and short-eared owl.
  fr:
    intro: >-
      Il existe sur la basse Oder un endroit où le fleuve se divise en deux, abritant entre ses bras un monde
      à part. Près de Widuchowa, l'Oder se sépare entre l'Oder occidentale et la Regalica, enserrant le
      Międzyodrze : une vaste plaine tourbeuse sillonnée par plus de deux cents kilomètres de canaux, de bras
      morts et de fossés. C'est la plus grande tourbière basse fluviale d'Europe occidentale et centrale,
      refuge d'espèces végétales et animales disparues des autres grandes vallées fluviales. Le parc paysager
      de la vallée de la Basse-Oder, créé le 1 avril 1993, protège la partie polonaise, tandis qu'au sud, côté
      allemand, la vallée est classée parc national.
    landscape: >-
      Le Międzyodrze s'étend sur environ 2 km de large au sud et atteint jusqu'à 12 km près de Szczecin. Sa
      morphologie actuelle est née après la dernière glaciation, et ses multiples bras résultent de la
      croissance rapide de la tourbe depuis environ 6 mille ans.


      Les aménagements hydrauliques de 1904 ont rompu le rythme naturel du fleuve, et en 1932 les terres entre
      les deux bras ont été asséchées pour l'agriculture. Pour maîtriser les eaux, des digues, un réseau de
      canaux et 36 écluses, stations de pompage et ouvrages d'art furent construits. La guerre en détruisit la
      majeure partie, et dès la fin des années soixante la nature a repris ses droits. Aujourd'hui, 81 % de la
      superficie est couverte d'une végétation marécageuse sans arbres, tandis que de riches ripisylves ont
      poussé sur les digues. Depuis plus de 50 ans, ces milieux évoluent sans perturbation humaine.


      Depuis les versants de la vallée, qui culminent à 70 m d'altitude près de Szczecin et Widuchowa, vous
      découvrirez le panorama sur les îles du Międzyodrze.
    wildlife: >-
      Le parc est une étape majeure sur les voies migratoires vers le sud et un havre de repos pour des
      milliers de canards, d'oies et de grues. Jusqu'à 20 000 oies et 13 000 [grues
      cendrées](/especie/grus_grus/) s'y rassemblent lors des passages, et la plupart des plus de 250 espèces
      d'oiseaux recensées y vivent toute l'année.


      **Printemps.** Le marais accueille la nidification des limicoles et des canards. **Été.** Après la
      reproduction s'ouvre la mue estivale. Parmi les nicheurs menacés en Europe figurent le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/), le [balbuzard pêcheur](/especie/pandion_haliaetus/), le
      [busard cendré](/especie/circus_pygargus/), le hibou des marais, la panure à moustaches, le [phragmite
      aquatique](/especie/acrocephalus_paludicola/) et le râle d'eau. **Automne.** Les migrateurs dorment dans
      ce havre tranquille et peu accessible, et le [martin-pêcheur d'Europe](/especie/alcedo_atthis/), emblème
      historique du parc, reste abondant en escale. **Hiver.** Les chenaux servent de zone d'hivernage.


      Parmi les mammifères, le [castor d'Europe](/especie/castor_fiber/) bâtit d'imposantes huttes de
      branchages et de boue, bien visibles depuis l'eau. La [loutre d'Europe](/especie/lutra_lutra/) y est
      également chez elle. Au crépuscule, de nombreuses chauves-souris chassent au ras des flots.
      L'[élan](/especie/alces_alces/) est un visiteur rare, signalé de façon sporadique.


      Parmi les amphibiens remarquables se trouvent le crapaud calamite, la grenouille verte, le [sonneur à
      ventre de feu](/especie/bombina_bombina/) et le triton crêté. De juin à septembre, les canaux sont
      patrouillés par une libellule strictement protégée (*trzepla zielona*). La flore compte plus de 400
      espèces, dont la salvinie nageante, la plus petite fougère aquatique d'Europe, et la mâcre nageante.
      Nénuphars blancs et jaunes forment des tapis flottants si denses qu'ils ralentissent parfois les
      pagaies.
    visit: >-
      Le parc préconise le kayak et les embarcations légères comme le meilleur moyen d'explorer les lieux, les
      canaux et les écluses désaffectées barrant l'accès à pied. La majorité du parc est accessible, hors
      réserves intégrales. Emportez carte, téléphone portable et eau potable.


      Le circuit **Żabnica–Moczyły** relie l'Oder occidentale et la Regalica par d'anciens bras sinueux ;
      c'est le parcours le plus réputé du Międzyodrze, même si la végétation aquatique complique la traversée
      au cœur de l'été. Le départ classique s'effectue à l'embarcadère de Siadło Dolne pour emprunter le Kanał
      Kwiatowy, aux eaux limpides laissant admirer la flore subaquatique. On y croise le lac Samotne, né du
      remblai autoroutier et profond de 16 m. Depuis la plage de Gryfino, pagayez sur le Kanał Długi près des
      huttes de castors.


      À pied ou à vélo, l'itinéraire cyclable **Zielona Odra** relie Gryfino à Widuchowa par la Forêt tordue
      sur environ 18 km : 2 heures à vélo ou 4 à pied, essentiellement sur revêtements carrossables au
      dénivelé modéré. Avant Widuchowa, montez sur la plateforme panoramique de Góra Słowiańska, avec vue sur
      la frange sud du parc et le parc national allemand. Pour marcher dans le Międzyodrze, privilégiez les
      hauteurs de la vallée, car ponts et passerelles intérieurs sont dégradés.
    history: >-
      Près de Gartz, en Allemagne, subsistent les piles d'un ancien pont sur l'Oder occidentale détruit en
      avril 1945. Le parc paysager polonais et le parc national allemand de l'Unteres Odertal forment ensemble
      le Parc international de la vallée de la Basse-Oder.
    before: >-
      Les embarcations à moteur sont interdites dans le parc en dehors des chenaux principaux de navigation,
      sauf dérogation de service. Les canaux, les écluses hors d'usage et les tourbières inondées rendent
      impossible la progression à pied dans la majeure partie de l'intérieur du Międzyodrze.
    around: >-
      Plus loin, le [parc national de la Narew](/lugar/narwianski-park-narodowy/) partage avec la basse Oder
      le busard cendré et le castor au sein d'une vaste plaine inondable ; le [parc national de
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) abrite lui aussi le busard cendré et le hibou
      des marais.
  de:
    intro: >-
      An der unteren Oder teilt sich der Fluss in zwei Arme, zwischen denen eine ganz eigene Welt liegt. Nahe
      Widuchowa gabelt sich der Strom in Westoder und Regalica, und dazwischen erstreckt sich das Międzyodrze:
      eine weite Niedermoorlandschaft, durchzogen von mehr als zweihundert Kilometern an Kanälen, Altarmen und
      Gräben. Es ist das größte Fluss-Niedermoor West- und Mitteleuropas und bewahrt Tier- und Pflanzenarten,
      die aus anderen großen Flusstälern längst verschwunden sind. Der am 1. April 1993 gegründete
      Landschaftspark Dolina Dolnej Odry schützt den polnischen Teil, während das Tal südlich auf deutscher
      Seite als Nationalpark unter Schutz steht.
    landscape: >-
      Das Międzyodrze misst im Süden rund 2 km in der Breite und weitet sich bei Szczecin auf bis zu 12 km
      auf. Seine heutige Gestalt entstand nach der letzten Eiszeit; die Verzweigung des Flussbettes geht auf
      das rasche Moorwachstum der letzten 6 Tausend Jahre zurück.


      Die Regulierungsarbeiten an der Oder von 1904 durchbrachen den natürlichen Puls der Aue, und 1932 wurde
      das Zwischenstromland für die Landwirtschaft nutzbar gemacht. Deiche, ein dichtes Kanalnetz und 36
      Schleusen, Pumpstationen und Wehrbauten wurden errichtet. Der Krieg zerstörte die meisten dieser
      Anlagen, und seit dem Ende der sechziger Jahre kehrte die Wildnis zurück. Heute sind 81 % der Fläche von
      baumloser Sumpfvegetation bedeckt, während auf den Deichen wertvolle Auenwälder herangewachsen sind.
      Seit mehr als 50 Jahren entwickeln sich diese Lebensräume ohne menschlichen Eingriff.


      Von den Talhängen, die bei Szczecin und Widuchowa Höhen von 70 m erreichen, überblickst du die Inselwelt
      des Międzyodrze.
    wildlife: >-
      Der Park ist eine zentrale Raststation auf den Vogelzügen nach Süden und Zufluchtsort für Tausende
      Enten, Gänse und Kraniche. Bis zu 20.000 Gänse und 13.000 [Kraniche](/especie/grus_grus/) rasten hier zu
      Spitzenzeiten, und die meisten der über 250 nachgewiesenen Vogelarten sind das ganze Jahr über heimisch.


      **Frühling.** Brutgebiet für Watvögel und Enten. **Sommer.** Nach der Brutzeit dient das Moor als
      Mauserplatz. Zu den europaweit gefährdeten Brutvögeln gehören
      [Seeadler](/especie/haliaeetus_albicilla/), [Fischadler](/especie/pandion_haliaetus/),
      [Wiesenweihe](/especie/circus_pygargus/), Sumpfohreule, Bartmeise,
      [Seggenrohrsänger](/especie/acrocephalus_paludicola/) und Wasserralle. **Herbst.** Zugvögel übernachten
      in dieser geschützten Weite, und der [Eisvogel](/especie/alcedo_atthis/), einst Wappenvogel des Parks,
      ist zur Zugzeit häufig anzutreffen. **Winter.** Eisfreie Wasserläufe dienen als Überwinterungsquartier.


      Unter den Säugetieren errichtet der [Europäische Biber](/especie/castor_fiber/) mächtige Burgen aus
      Ästen und Schlick, die sich am besten vom Wasser aus beobachten lassen. Auch der [Eurasische
      Fischotter](/especie/lutra_lutra/) lebt hier. In der Dämmerung jagen zahlreiche Fledermäuse über der
      Wasseroberfläche. Der [Elch](/especie/alces_alces/) ist ein seltener Gast und wird nur vereinzelt
      gesichtet.


      Zu den wertvollen Amphibien zählen Kreuzkröte, Moorfrosch, [Rotbauchunke](/especie/bombina_bombina/) und
      Kammmolch. Von Juni bis September patrouilliert die streng geschützte Grüne Keiljungfer (*trzepla
      zielona*) an den Kanälen. Die Flora umfasst über 400 Pflanzenarten, darunter den Schwimmfarn (*Salvinia
      natans*), Europas kleinsten und seltensten Wasserfarn, sowie die Wassernuss. Weiße und gelbe Seerosen
      bilden dichte Blütenteppiche, die das Paddeln mitunter spürbar erschweren.
    visit: >-
      Der Park empfiehlt Kajak und Kanu als beste Art der Erkundung, da Wasserläufe und verfallene Schleusen
      das Vorankommen zu Fuß verhindern. Der Großteil des Parks ist frei zugänglich, ausgenommen die
      Schutzreservate. Führe stets Karte, Mobiltelefon und Trinkwasser mit.


      Die Route **Żabnica–Moczyły** ist ein Rundkurs zwischen Westoder und Regalica über verträumte Altarme,
      der als schönste Wasserstrecke des Międzyodrze gilt, auch wenn dichter Wasserpflanzenwuchs im Hochsommer
      Kraft erfordert. Beliebter Startpunkt ist die Anlegestelle Siadło Dolne in den Kanał Kwiatowy, dessen
      klares Wasser den Blick auf Unterwasserwiesen freigibt. Unterwegs liegt der See Samotne, der beim Bau
      des Autobahndamms entstand und eine Tiefe von 16 m erreicht. Vom Strand in Gryfino aus kannst du den
      Kanał Długi entlangpaddeln, vorbei an bewohnten Biberburgen.


      Zu Fuß oder per Rad führt die Route **Zielona Odra** von Gryfino über den Krummen Wald nach Widuchowa
      über rund 18 km: 2 Stunden mit dem Rad oder 4 zu Fuß auf meist befestigten Wegen ohne große Steigungen.
      Vor Widuchowa lohnt der Aussichtsturm auf der Góra Słowiańska mit Blick auf den Südrand des Parks und
      den deutschen Nationalpark. Wanderungen im Międzyodrze unternimmst du am besten auf den Talrandhöhen, da
      Stege und Schleusen im Inneren baufällig sind.
    history: >-
      Bei Gartz auf deutscher Seite ragen noch heute Pfeiler einer im April 1945 zerstörten Brücke über die
      Westoder auf. Der polnische Landschaftspark und der deutsche Nationalpark Unteres Odertal bilden
      gemeinsam den Internationalpark Unteres Odertal.
    before: >-
      Motorboote sind im Park abseits der Hauptschifffahrtswege untersagt, ausgenommen autorisierte Rettungs-
      und Kontrolldienste. Wasserläufe, verfallene Wehre und morastige Moorböden machen ein Begehen des
      inneren Międzyodrze weitgehend unmöglich.
    around: >-
      Weiter entfernt teilt der [Nationalpark Narew](/lugar/narwianski-park-narodowy/) mit dem unteren Odertal
      die Wiesenweihe und den Biber in einer naturnahen Flussaue; auch der [Nationalpark
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) beherbergt Wiesenweihe und Sumpfohreule.
  it:
    intro: >-
      C'è un punto nel basso corso dell'Oder dove il fiume si biforca, racchiudendo tra i due rami un mondo a
      sé stante. Vicino a Widuchowa l'Oder si divide nell'Oder Occidentale e nella Regalica, stringendo il
      Międzyodrze: una vasta pianura torbosa percorsa da più di duecento chilometri di canali, lanche e
      fossati. È la più estesa torbiera bassa fluviale dell'Europa centro-occidentale e conserva piante e
      animali ormai scomparsi dalle altre grandi vallate fluviali. Il Parco paesaggistico Dolina Dolnej Odry,
      istituito il 1 aprile 1993, tutela il versante polacco, mentre a sud, sul lato tedesco, la valle è
      protetta come parco nazionale.
    landscape: >-
      Il Międzyodrze misura da circa 2 km di larghezza a sud fino a 12 km nei pressi di Stettino. La sua
      configurazione attuale si è formata dopo l'ultima era glaciale, e la ramificazione dei canali si deve
      alla rapida crescita della torba negli ultimi 6 mila anni.


      Le opere di rettifica dell'Oder del 1904 alterarono il ritmo naturale della valle, e nel 1932 l'area tra
      i due rami fu bonificata a scopo agricolo. Per regolare il livello delle acque vennero innalzati argini,
      scavata una fitta rete di canali e costruite 36 chiuse, stazioni di pompaggio e paratie. La guerra
      distrusse gran parte delle strutture e dalla fine degli anni sessanta la natura ha ripreso il
      sopravvento. Oggi l'81 % della superficie è ricoperto da paludi aperte prive di alberi, mentre sui
      vecchi argini sono cresciuti pregiati boschi ripariali. Da più di 50 anni questi habitat si sviluppano
      senza interferenze umane.


      Dai versanti della valle, che vicino a Stettino e Widuchowa toccano i 70 m di quota, puoi ammirare il
      panorama sulle isole del Międzyodrze.
    wildlife: >-
      Il parco costituisce una sosta primaria lungo le rotte migratorie verso sud e un rifugio per migliaia di
      anatre, oche e gru. Fino a 20 000 oche e 13 000 [gru](/especie/grus_grus/) vi sostano nei periodi di
      passo, e la maggior parte delle oltre 250 specie di uccelli censite risiede qui tutto l'anno.


      **Primavera.** Luogo di nidificazione per trampolieri e anatre. **Estate.** Dopo la cova diventa area di
      muta. Tra gli uccelli nidificanti minacciati in Europa spiccano l'[aquila di
      mare](/especie/haliaeetus_albicilla/), il [falco pescatore](/especie/pandion_haliaetus/), l'[albanella
      minore](/especie/circus_pygargus/), il gufo di palude, il basettino, il
      [pagliarolo](/especie/acrocephalus_paludicola/) e il porciglione. **Autunno.** Gli uccelli di passo
      pernottano in questo rifugio appartato, e il [martin pescatore](/especie/alcedo_atthis/), storico
      emblema del parco, è abbondante durante la migrazione. **Inverno.** I canali fungono da aree di
      svernamento.


      Tra i mammiferi, il [castoro](/especie/castor_fiber/) edifica tane monumentali con rami e fango,
      visibili soprattutto dall'acqua. Anche la [lontra europea](/especie/lutra_lutra/) è stabilmente
      presente. Al tramonto molti pipistrelli cacciano a pelo d'acqua. L'[alce](/especie/alces_alces/) è un
      visitatore insolito, registrato solo sporadicamente.


      Tra gli anfibi più preziosi figurano il rospo smeraldino, la rana verde, l'[ululone dal ventre
      rosso](/especie/bombina_bombina/) e il tritone crestato. Da giugno a settembre nei canali vola una
      libellula rigorosamente protetta (*trzepla zielona*). La flora conta oltre 400 specie, tra cui la felce
      natante, la più piccola e rara felce acquatica d'Europa, e la castagna d'acqua. Ninfee bianche e gialle
      formano tappeti galleggianti così densi da ostacolare a tratti la pagaiata.
    visit: >-
      Il parco indica il kayak e le escursioni in canoa come il mezzo ideale per la visita, poiché canali e
      chiuse abbandonate impediscono il transito a piedi. La maggior parte del parco è aperta ai visitatori, a
      eccezione delle riserve integrali. Porta sempre mappa, cellulare e scorta d'acqua.


      L'itinerario ad anello **Żabnica–Moczyły** collega l'Oder Occidentale e la Regalica attraverso vecchi
      meandri; è considerato il percorso più suggestivo del Międzyodrze, sebbene in piena estate la
      vegetazione acquatica richieda qualche sforzo in più. Il punto di imbarco classico è Siadło Dolne sul
      Kanał Kwiatowy, dalle acque limpide che svelano i fondali. Lungo il tragitto si tocca il lago Samotne,
      formatosi durante la costruzione del rilevato autostradale e profondo fino a 16 m. Dalla spiaggia di
      Gryfino puoi pagaiare lungo il Kanał Długi costeggiando le tane dei castori.


      A piedi o in bicicletta, il percorso **Zielona Odra** collega Gryfino a Widuchowa attraversando la
      Foresta Storta per circa 18 km: 2 ore in bici o 4 a piedi su piste battute prive di forti pendenze.
      Prima di Widuchowa sali sulla torre panoramica di Góra Słowiańska per ammirare il margine meridionale
      del parco e il parco nazionale tedesco. Se desideri camminare nel Międzyodrze, resta sulle alture del
      bordo valle, data la precarietà di ponticelli e chiuse interne.
    history: >-
      Presso Gartz, in Germania, restano i piloni di un vecchio ponte sull'Oder Occidentale fatto saltare
      nell'aprile 1945. Il parco paesaggistico polacco e il parco nazionale tedesco dell'Unteres Odertal
      costituiscono insieme il Parco Internazionale della Valle del Basso Oder.
    before: >-
      È vietato l'uso di imbarcazioni a motore all'interno del parco al di fuori dei canali navigabili
      principali, salvo mezzi di servizio autorizzati. Canali, chiuse in disuso e suoli acquitrinosi rendono
      impraticabile a piedi gran parte del cuore del Międzyodrze.
    around: >-
      Più lontano, il [Parco Nazionale del Narew](/lugar/narwianski-park-narodowy/) condivide con il Basso
      Oder l'albanella minore e il castoro nei suoi meandri fluviali; anche il [Parco Nazionale
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) ospita l'albanella minore e il gufo di palude.
  pt:
    intro: >-
      Há um lugar no baixo Óder onde o rio se divide em dois, guardando entre os seus braços um mundo próprio.
      Perto de Widuchowa, o Óder bifurca-se no Óder Ocidental e no Regalica, acolhendo entre ambos o
      Międzyodrze: uma planície turfosa atravessada por mais de duzentos quilómetros de canais, braços mortos
      e valas. É a maior turfeira baixa fluvial da Europa Ocidental e Central, abrigando plantas e animais já
      desaparecidos de outros grandes vales fluviais. O Parque Paisagístico Dolina Dolnej Odry, criado em 1 de
      abril de 1993, protege a vertente polaca; a sul, do lado alemão, o vale está protegido como parque
      nacional.
    landscape: >-
      O Międzyodrze tem cerca de 2 km de largura a sul e estende-se até 12 km junto a Szczecin. A sua
      configuração atual formou-se após a última glaciação, resultando a sua rede de canais da rápida
      acumulação de turfa ao longo dos últimos 6 mil anos.


      As obras de regularização do Óder em 1904 alteraram a dinâmica fluvial e, em 1932, a zona entre os dois
      braços foi drenada para uso agrícola. Para controlar as águas construíram-se diques, uma rede de canais
      e 36 eclusas, estações elevatórias e comportas. A guerra destruiu a maioria dessas infraestruturas e, a
      partir de finais dos anos sessenta, a natureza reconquistou a várzea. Hoje, 81 % da superfície está
      coberta por pântanos sem árvores, enquanto sobre os antigos diques cresceram ricas matas ripícolas. Há
      mais de 50 anos que estes habitats evoluem sem perturbação humana.


      A partir das encostas do vale, que perto de Szczecin e Widuchowa atingem 70 m de altitude, podes
      contemplar o arquipélago fluvial do Międzyodrze.
    wildlife: >-
      O parque é um ponto de paragem crucial nas rotas migratórias rumo ao sul e refúgio de descanso para
      milhares de patos, gansos e grous. Até 20 000 gansos e 13 000 [grous-comuns](/especie/grus_grus/)
      concentram-se aqui em certas épocas, e a maioria das mais de 250 espécies de aves registadas reside aqui
      todo o ano.


      **Primavera.** Zona de nidificação para limícolas e patos. **Verão.** Após a reprodução, as aves
      reúnem-se para a muda de penas. Entre as espécies nidificantes ameaçadas na Europa contam-se a
      [águia-rabalva](/especie/haliaeetus_albicilla/), a [águia pescadora](/especie/pandion_haliaetus/), o
      [tartaranhão-caçador](/especie/circus_pygargus/), o bufo-pequeno-das-turfeiras, o chapim-de-bigodes, a
      [felosa-aquática](/especie/acrocephalus_paludicola/) e o frango-d'água. **Outono.** As aves de passagem
      pernoitam neste refúgio inacessível, e o [guarda-rios-comum](/especie/alcedo_atthis/), histórico símbolo
      do parque, continua abundante. **Inverno.** Os canais tornam-se zonas de invernada.


      Entre os mamíferos, o [castor-europeu](/especie/castor_fiber/) constrói tocas monumentais de ramos e
      lodo, avistadas sobretudo a partir da água. A [lontra-europeia](/especie/lutra_lutra/) também habita o
      parque. Ao cair da noite, numerosos morcegos caçam rente à água. O [alce](/especie/alces_alces/) é um
      visitante raro, registado apenas de forma esporádica.


      Entre os anfíbios mais valiosos encontram-se o sapo-corredor, a rã-verde, o
      [bombina-de-ventre-vermelho](/especie/bombina_bombina/) e o tritão-de-crista. De junho a setembro,
      patrulha os canais uma libélula estritamente protegida (*trzepla zielona*). A flora ultrapassa as 400
      espécies, destacando-se a salva-flutuante, o menor feto aquático da Europa, e a castanha-d'água.
      Nenúfares brancos e amarelos formam mantos flutuantes tão cerrados que chegam a travar os remos.
    visit: >-
      O parque recomenda o caiaque e as embarcações ligeiras como a melhor forma de exploração, uma vez que os
      canais e as eclusas desativadas impedem a passagem a pé. A maior parte do parque é visitável, exceto as
      reservas integrais. Leva mapa, telemóvel e água.


      O circuito **Żabnica–Moczyły** liga o Óder Ocidental e o Regalica por antigos meandros, sendo
      considerado o percurso aquático mais belo do Międzyodrze, embora no auge do verão a densa vegetação
      exija esforço acrescido. A partida clássica faz-se no cais de Siadło Dolne pelo Kanał Kwiatowy, de águas
      transparentes que deixam entrever os fundos. Pelo caminho surge o lago Samotne, criado pelas obras do
      aterro da autoestrada, com 16 m de profundidade. A partir da praia fluvial de Gryfino podes remar pelo
      Kanał Długi junto a tocas ativas de castores.


      A pé ou em bicicleta, a rota ciclável **Zielona Odra** une Gryfino a Widuchowa pela Floresta Torta ao
      longo de cerca de 18 km: 2 horas de bicicleta ou 4 a pé, quase sempre em pisos firmes e planos. Antes de
      Widuchowa, sobe à plataforma de observação da Góra Słowiańska, com vistas panorâmicas sobre a margem sul
      e o parque nacional alemão. Se quiseres caminhar no Międzyodrze, mantém-te nos pontos altos da encosta,
      pois pontões e eclusas interiores estão muito degradados.
    history: >-
      Perto de Gartz, na Alemanha, permanecem os pilares de uma antiga ponte sobre o Óder Ocidental destruída
      em abril de 1945. O parque paisagístico polaco e o parque nacional alemão do Unteres Odertal formam em
      conjunto o Parque Internacional do Vale do Baixo Óder.
    before: >-
      É proibido utilizar embarcações a motor no parque fora das vias de navegação principais, salvo
      embarcações de serviço autorizadas. Os canais, as eclusas inativas e os solos pantanosos tornam
      impossível caminhar em grande parte do interior do Międzyodrze.
    around: >-
      Mais longe, o [Parque Nacional de Narew](/lugar/narwianski-park-narodowy/) partilha com o Baixo Óder o
      tartaranhão-caçador e o castor na sua várzea inundável; também o [Parque Nacional
      Fertő-Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) partilha o tartaranhão-caçador e a
      coruja-dos-pauis.
