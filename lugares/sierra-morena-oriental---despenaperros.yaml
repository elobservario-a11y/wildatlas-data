    El histórico paso de Despeñaperros (Monumento Natural de los Org organos de Despeñaperros) y la cascada de
    La Cimbarra.
  en: >-
    The historic mountain gorge of Despeñaperros (Los Órganos Natural Monument) and the dramatic La Cimbarra
    waterfall.
  fr: >-
    Le défilé historique de Despeñaperros (Monument naturel de Los Órganos) et la spectaculaire cascade de La
    Cimbarra.
  de: >-
    Der historische Gebirgspass von Despeñaperros (Naturdenkmal Los Órganos) und der spektakuläre Wasserfall
    La Cimbarra.
  it: >-
    La gola storica di Despeñaperros (Monumento Naturale di Los Órganos) e la suggestiva cascata de La
    Cimbarra.
  pt: >-
    O desfiladeiro histórico de Despeñaperros (Monumento Natural de Los Órganos) e a impressionante cascata de
    La Cimbarra.
unico:
  es: >-
    Un río que baja de norte a sur ha tallado la cuarcita hasta dejar los Órganos, una pared de tubos
    verticales, y ha abierto el paso por donde se mueve la historia entre la Meseta y Andalucía.
  en: >-
    A south-flowing river carved the Armorican quartzite into Los Órganos, a colossal cliff of vertical
    pipe-like columns that formed the historic gateway between the Castilian Meseta and Andalusia.
  fr: >-
    Une rivière s’écoulant du nord au sud a entaillé la quartzite pour former Los Órganos, gigantesque
    muraille d’orgues rocheux et passage historique entre la Meseta et l’Andalousie.
  de: >-
    Ein nach Süden fließender Fluss hat den Quarzit zu den Órganos zersägt, einer Wand senkrechter
    Felsenorgelpfeifen am historischen Übergang von der Meseta nach Andalusien.
  it: >-
    Un fiume con deflusso da nord a sud ha intagliato la quarzite creando Los Órganos, una bastionata di canne
    d’organo rocciose sul varco storico tra Meseta e Andalusia.
  pt: >-
    Um rio caudaloso que corre de norte para sul entalhou o quartzito até erguer Los Órganos, uma muralha de
    colunas verticais no passo histórico entre a Meseta e a Andaluzia.
observaciones:
  es: >-
    Todos los equipamientos de uso público son zonas de seguridad frente a la actividad cinegética: infórmate
    antes de salir. En el Balcón lleva agua, protección solar, ropa y calzado adecuados, y no salgas solo sin
    avisar de tu recorrido.
texto:
  es:
    intro: >-
      Durante siglos, quien iba de la Meseta a Andalucía tenía que pasar por aquí. El río Despeñaperros, que
      baja de norte a sur, abrió en Sierra Morena un desfiladero de paredes casi verticales, con desniveles de
      más de 500 m, y lo dejó como el paso natural entre dos mundos. El Parque Natural Despeñaperros, en el
      municipio jiennense de Santa Elena, es uno de los de menor superficie de Andalucía y, sin embargo,
      concentra un extraordinario patrimonio geológico, natural e histórico.
    landscape: >-
      Todo empieza hace unos 500 millones de años, en un mar. Allí se formó la cuarcita armoricana, de gran
      dureza, y todavía hoy, en sus estratos, a veces asoman ondulitas, rizaduras de oleaje como las de un
      fondo marino somero. Después, la roca se elevó y el río hizo el resto: erosionó, abrió cañones y fallas
      y dejó formaciones como Los Órganos, el Salto del Fraile y Las Correderas. Los Órganos, de cuarcitas tan
      duras, parecen enormes tubos verticales.


      La vegetación se reparte según el sol. Las zonas más soleadas son el reino de la encina, entre pino,
      coscoja y jara. En las umbrías de los cortados, en cambio, viven especies más delicadas. En el Barranco
      de Valdeazores domina el monte mediterráneo con perales silvestres, madroños y durillos, que tiñen el
      otoño de colores distintos. La umbría del Collado de la Estrella conserva un robledal de quejigos y
      melojos. Y junto a los ríos y arroyos, más húmedos, aparecen bosques de galería con alisos, fresnos y
      sauces.
    wildlife: >-
      Entre la encina y el roquedo se refugian el [ciervo](/especie/cervus_elaphus/) y el
      [jabalí](/especie/sus_scrofa/), y sobre ellos vuelan rapaces como el [águila
      imperial](/especie/aquila_adalberti/) y el [buitre leonado](/especie/gyps_fulvus/). Entre las especies
      emblemáticas de sus límites figuran el [lince ibérico](/especie/lynx_pardinus/) y la [cigüeña
      negra](/especie/ciconia_nigra/). Hay además zorro, meloncillo y [gato
      montés](/especie/felis_silvestris/). La flora catalogada suma más de 870 especies y los vertebrados
      superan los 180.


      El otoño reúne dos citas. A principios de la estación se oye en silencio la berrea del ciervo, el
      reclamo y la lucha de los machos en la época de apareamiento. Y las setas empiezan a salir: el primer
      tramo del Balcón de Despeñaperros, en zona arbolada y libre de matorral, es ideal para buscarlas. El
      otoño es también cuando madroños, perales y durillos del Barranco de Valdeazores cambian de color.
    visit: >-
      Empieza por el centro de visitantes Llano de las Américas, que atiende al parque y al Paraje Natural de
      la Cascada de la Cimbarra. Su exposición explica la evolución geológica y humana del lugar, y una
      reproducción a tamaño real del águila imperial recibe a los visitantes. Se llega por la salida 257 de la
      A-4 y la carretera JA-7102, que une Santa Elena con Miranda del Rey. El centro conecta con el sendero de
      Los Estrechos de Miranda, que entra a pie en el parque.


      Las rutas son variadas. El Balcón de Despeñaperros es un sendero circular de casi 4 km, de dificultad
      baja y prácticamente llano, apto para ir con niños pequeños. Parte de Santa Elena, cruza un pinar y
      llega a un mirador que da una vista de 180 grados del monte Despeñaperros. El del Barranco de
      Valdeazores destaca por su riqueza botánica y por sus enclaves para observar fauna. El Empedraillo y el
      Molino del Batán muestran el monte mediterráneo entre pinar de repoblación y huellas de otras
      civilizaciones; Estrechos de Miranda y La Campana, la vegetación de ribera; y el Barranco de la Niebla
      es para senderistas más experimentados, con grandes diferencias de altitud.
    history: >-
      Esta tierra fue escenario de la batalla de Las Navas de Tolosa. Mucho antes, los íberos dejaban ofrendas
      de bronce, los «muñecos», en lugares sagrados como el santuario del Collado de los Jardines, donde está
      la Cueva de los Muñecos, cuyo sendero recorre las huellas de ese santuario. Hay arte rupestre en cuevas
      como la del Santo y las de Vacas de Retamoso, y el sendero del Empedraillo sigue una antigua calzada
      romana empedrada.


      El parque y la Cimbarra se declararon protegidos en 1989. Los pinares de repoblación densos favorecen la
      propagación rápida del fuego, y la Consejería aclara masas para recuperar el monte mediterráneo y sacar
      a la luz alcornoques antes ocultos.
    before: >-
      Todos los equipamientos de uso público son zonas de seguridad frente a la actividad cinegética:
      infórmate antes de salir. En el Balcón lleva agua, protección solar, ropa y calzado adecuados, y no
      salgas solo sin avisar de tu recorrido.
    around: >-
      A quince kilómetros está el [Parque Natural del Valle de Alcudia y Sierra
      Madrona](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), y a diecinueve kilómetros el
      [Parque Natural Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/). Más lejos, el [Parque
      Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/), la [Zona Especial de Conservación Montes
      de Toledo](/lugar/zec-montes-de-toledo/) y la [Reserva Natural de la Sierra de
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) comparten con Despeñaperros el lince ibérico y el
      buitre negro.
  en:
    intro: >-
      For centuries, anyone travelling between the Castilian Meseta and Andalusia had to pass through this
      gorge. The Despeñaperros river, flowing from north to south, carved an amphitheatre of near-vertical
      cliffs through Sierra Morena, with sheer drops exceeding 500 m, establishing the natural crossroads
      between two distinct worlds. Despeñaperros Natural Park, in the Jaén municipality of Santa Elena, is
      among the smallest protected areas in Andalusia yet preserves exceptional geological, ecological and
      historical heritage.
    landscape: >-
      The geological origins trace back roughly 500 million years to an ancient seabed where exceptionally
      hard Armorican quartzite was deposited; fossil ripple marks left by gentle prehistoric waves remain
      visible in rock strata today. Subsequent tectonic uplift and river incision did the rest, cutting deep
      gorges, fault scarps and dramatic rock formations including Los Órganos, Salto del Fraile and Las
      Correderas. Los Órganos, sculpted from resistant quartzite beds, resembles monumental cathedral organ
      pipes.


      Vegetation mirrors sunlight exposure. Sunny south-facing slopes are the domain of holm oak woodlands
      mingled with maritime pine, kermes oak and rockroses. In contrast, sheltered shady canyon aspects
      harbour delicate deciduous communities: Barranco de Valdeazores is dominated by dense Mediterranean
      woods with wild pear, strawberry tree and laurestine, turning brilliant shades in autumn. Shaded slopes
      at Collado de la Estrella preserve Pyrenean oak and gall oak stands, while humid river corridors support
      riparian galleries of alders, narrow-leaved ashes and willows.
    wildlife: >-
      Between oak woodlands and quartzite crags seek refuge the [red deer](/especie/cervus_elaphus/) and [wild
      boar](/especie/sus_scrofa/), beneath skies patrolled by soaring raptors like the [Spanish imperial
      eagle](/especie/aquila_adalberti/) and [griffon vulture](/especie/gyps_fulvus/). Flagship species on the
      periphery include the [Iberian lynx](/especie/lynx_pardinus/) and [black
      stork](/especie/ciconia_nigra/). Red foxes, Egyptian mongooses and [European
      wildcat](/especie/felis_silvestris/) also inhabit the territory. Documented vascular plants exceed 870
      species and vertebrate fauna surpasses 180 species.


      Autumn brings two seasonal highlights. Early in the season the red deer rut echoes across quiet valleys
      as stags contest territory. Soon after, wild mushrooms emerge: the upper open pine woodland along the
      Balcón de Despeñaperros path offers prime foraging terrain, while wild pears, strawberry trees and
      laurestine turn deep crimson in the Valdeazores ravine.
    visit: >-
      Begin at the Llano de las Américas Visitor Centre, which interprets both the natural park and the La
      Cimbarra Waterfall Natural Site. Exhibits explain local geology and cultural history, welcomed by a
      life-sized replica of an imperial eagle. Access is via exit 257 off the A-4 motorway onto road JA-7102,
      connecting Santa Elena to Miranda del Rey. The centre connects directly to the Los Estrechos de Miranda
      footpath entering the park.


      Trail offerings cater to all levels. The Balcón de Despeñaperros is a circular route of nearly 4 km,
      gentle and largely flat, ideal for families with young children. Starting in Santa Elena, it winds
      through pine woods to a clifftop viewpoint presenting a panoramic 180 degree view over the Despeñaperros
      gorge. The Barranco de Valdeazores trail is renowned for botanical richness and wildlife viewing; El
      Empedraillo and Molino del Batán showcase Mediterranean scrub amidst reforestation pines and historic
      Roman roads; Estrechos de Miranda and La Campana highlight riparian greenery; while Barranco de la
      Niebla provides a challenging hike with substantial elevation changes.
    history: >-
      This strategic landscape witnessed the pivotal Battle of Las Navas de Tolosa. Millennia earlier, Iberian
      tribes deposited bronze votive offerings (*muñecos*) at cliff sanctuaries such as Collado de los
      Jardines and Cueva de los Muñecos, visited by an interpretive trail. Prehistoric rock art adorns caves
      including Cueva del Santo and Vacas de Retamoso, while the Empedraillo trail traces a preserved Roman
      paved highway.


      Despeñaperros Natural Park and the Cimbarra falls were gazetted for protection in 1989. Overly dense
      twentieth-century pine plantations pose acute wildfire risks, prompting forestry thinning programs to
      restore native Mediterranean oak scrub and liberate shaded veteran cork oaks.
    before: >-
      All public facilities and waymarked trails are designated safety buffer zones during hunting seasons;
      check local hunting activity notices before departing. For the Balcón trail, carry drinking water, sun
      protection, sturdy footwear and appropriate clothing, and avoid solitary hikes without notifying someone
      of your route.
    around: >-
      Fifteen kilometres away lies [Sierra Madrona and Alcudia Valley Natural
      Park](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), and nineteen kilometres distant
      stands [Sierra de Andújar Natural Park](/lugar/parque-natural-sierra-de-andujar/). Further afield,
      [Cabañeros National Park](/lugar/parque-nacional-de-cabaneros/), [Montes de Toledo Special Area of
      Conservation](/lugar/zec-montes-de-toledo/) and [Serra da Malcata Nature
      Reserve](/lugar/reserva-natural-da-serra-da-malcata/) share with Despeñaperros the Iberian lynx and
      black vulture.
  fr:
    intro: >-
      Pendant des siècles, quiconque voyageait de la Meseta vers l'Andalousie devait obligatoirement franchir
      ce passage. La rivière Despeñaperros, qui descend du nord au sud, a ouvert dans la Sierra Morena un
      défilé aux parois presque verticales aux dénivelés dépassant 500 m, devenant le verrou naturel entre
      deux mondes. Le parc naturel de Despeñaperros, situé dans la commune de Santa Elena (Jaén), est l'un des
      plus petits d'Andalousie par sa superficie, mais concentre un patrimoine géologique, écologique et
      historique hors du commun.
    landscape: >-
      Tout commence il y a environ 500 millions d'années au fond d'une mer paléozoïque où s'est déposée une
      quartzite armoricaine d'une dureté extrême ; aujourd'hui encore, les rides de courant fossiles du ressac
      marin se lisent dans les bancs rocheux. Le soulèvement tectonique puis l'érosion torrentielle ont
      ensuite façonné canyons et failles, sculptant des formations telles que Los Órganos, le Salto del Fraile
      et Las Correderas. Los Órganos, dressés en prismes verticaux, évoquent d'immenses tuyaux d'orgues
      d'église.


      La végétation s'adapte à l'exposition au soleil. Les versants ensoleillés sont le royaume de la chênaie
      verte mêlée de pins, chênes kermès et cistes. À l'inverse, les ubacs ombragés des falaises accueillent
      des cortèges plus frais : le ravin de Valdeazores abrite une forêt méditerranéenne riche en poiriers
      sauvages, arbousiers et viornes tin qui parent l'automne de teintes chaleureuses. L'ubac du Collado de
      la Estrella conserve une chênaie de chênes zéens et tauzins, tandis que les cours d'eau sont bordés de
      ripisylves d'aulnes, frênes et saules.
    wildlife: >-
      Entre chênaies et escarpements rocheux se réfugient le [cerf élaphe](/especie/cervus_elaphus/) et le
      [sanglier](/especie/sus_scrofa/), survolés par des rapaces remarquables comme l'[aigle
      ibérique](/especie/aquila_adalberti/) et le [vautour fauve](/especie/gyps_fulvus/). Parmi les espèces
      emblématiques fréquentant ses confins figurent le [lynx pardelle](/especie/lynx_pardinus/) et la
      [cigogne noire](/especie/ciconia_nigra/). Renards, mangoustes et [chat
      forestier](/especie/felis_silvestris/) parcourent le massif. La flore vasculaire compte plus de 870
      espèces répertoriées et les vertébrés dépassent les 180 taxons.


      L'automne offre deux temps forts naturalistes. Au début de la saison résonne le brame du cerf dans la
      quiétude des vallées lors des joutes nuptiales. Puis débute la saison des champignons : le début du
      sentier du Balcón de Despeñaperros, sous une pinède dégagée de sous-bois, constitue un terrain de
      prospection réputé, tandis que poiriers et arbousiers du ravin de Valdeazores rougissent.
    visit: >-
      Commencez par le centre de visiteurs Llano de las Américas, qui présente le parc naturel et le site
      naturel de la cascade de la Cimbarra. La muséographie détaille l'évolution géologique et humaine du
      défilé, avec une reproduction grandeur nature d'aigle ibérique. On y accède par la sortie 257 de
      l'autoroute A-4 puis la route JA-7102 reliant Santa Elena à Miranda del Rey. Le centre rejoint le
      sentier de Los Estrechos de Miranda qui pénètre à pied dans le parc.


      Les itinéraires sont variés. Le Balcón de Despeñaperros est une boucle de presque 4 km, facile et plate,
      adaptée aux familles avec enfants. Partant de Santa Elena, il traverse une pinède pour atteindre un
      belvédère offrant une vue circulaire de 180 degrés sur le défilé. Le sentier du Barranco de Valdeazores
      brille par sa richesse botanique ; El Empedraillo et le Molino del Batán dévoilent d'anciennes voies
      romaines sous les pins de reboisement ; tandis que le Barranco de la Niebla s'adresse aux randonneurs
      aguerris en raison de son fort relief.
    history: >-
      Cette contrée fut le théâtre de la bataille historique de Las Navas de Tolosa. Bien avant, les
      populations ibères déposaient des ex-voto de bronze (*muñecos*) dans des sanctuaires rupestres comme au
      Collado de los Jardines et à la Cueva de los Muñecos, dont un sentier retrace les vestiges. Des
      peintures rupestres ornent les grottes du Santo et des Vacas de Retamoso, et le chemin de l'Empedraillo
      longe une chaussée romaine pavée remarquablement conservée.


      Le parc naturel et la cascade de la Cimbarra ont été protégés en 1989. Les pinèdes de reboisement denses
      accroissant le risque d'incendie, l'administration forestière procède à des éclaircies ciblées pour
      restaurer le maquis méditerranéen et redécouvrir de vieux chênes-lièges enfouis sous les pins.
    before: >-
      Les équipements et sentiers balisés constituent des zones de sécurité face aux battues de chasse :
      renseignez-vous avant de partir. Sur le sentier du Balcón, emportez eau, protection solaire, vêtements
      adaptés et évitez de partir seul sans prévenir de votre itinéraire.
    around: >-
      À quinze kilomètres s'étend le [parc naturel de la Sierra Madrona et de la vallée
      d'Alcudia](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), et à dix-neuf kilomètres le
      [parc naturel de la Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/). Plus loin, le [parc
      national de Cabañeros](/lugar/parque-nacional-de-cabaneros/), la [zone spéciale de conservation des
      Montes de Toledo](/lugar/zec-montes-de-toledo/) et la [réserve naturelle de la Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) partagent avec Despeñaperros le lynx ibérique et
      le vautour moine.
  de:
    intro: >-
      Jahrhundertelang musste jeder Reisende zwischen der kastilischen Hochebene und Andalusien diese
      Engstelle passieren. Der von Norden nach Süden fließende Fluss Despeñaperros grub in die Sierra Morena
      eine fast senkrechte Felsenschlucht mit Steilwänden von über 500 m Höhenunterschied und schuf damit das
      natürliche Tor zwischen zwei Welten. Der Naturpark Despeñaperros im Gemeindegebiet von Santa Elena
      (Provinz Jaén) zählt flächenmäßig zu den kleinsten Naturparks Andalusiens, birgt jedoch herausragendes
      geologisches und geschichtliches Erbe.
    landscape: >-
      Die Erdgeschichte begann vor rund 500 Millionen Jahren am Grund eines Flachmeeres, wo extrem harter
      armorikanischer Quarzit abgelagert wurde; noch heute sind fossile Wellenrippeln urzeitlicher Brandung in
      den Gesteinsbänken sichtbar. Spätere Gebirgshebungen und Flusserosion schufen Klüfte, Verwerfungen und
      Felsformationen wie Los Órganos, Salto del Fraile und Las Correderas. Die vertikalen Quarzitsäulen der
      Órganos erinnern an monumentale Pfeifen einer Kirchenorgel.


      Die Vegetation folgt der Sonneneinstrahlung. Auf sonnigen Südhängen gedeiht Steineichenwald mit
      Seekiefern, Kermeseichen und Zistrosen. An den kühlen Schatthängen überleben anspruchsvollere
      Waldgemeinschaften: Im Barranco de Valdeazores wächst dichter mediterraner Mischwald mit Wildbirnen,
      Erdbeerbäumen und Schneeballsträuchern, der sich im Herbst leuchtend färbt. Die Schattflanke des Collado
      de la Estrella bewahrt Bestände von Portugiesischen Eichen und Pyrenäen-Eichen, während die Flussufer
      von Auengalerien aus Erlen, Eschen und Weiden gesäumt werden.
    wildlife: >-
      Zwischen Eichenwäldern und Felswänden finden [Rothirsch](/especie/cervus_elaphus/) und
      [Wildschwein](/especie/sus_scrofa/) Einstand, über denen seltene Greifvögel wie [Spanischer
      Kaiseradler](/especie/aquila_adalberti/) und [Gänsegeier](/especie/gyps_fulvus/) kreisen. An den Rändern
      des Gebiets streifen [Pardelluchs](/especie/lynx_pardinus/) und
      [Schwarzstorch](/especie/ciconia_nigra/). Rotfuchs, Ichneumon und [Europäische
      Wildkatze](/especie/felis_silvestris/) sind heimisch. Die Gefäßpflanzenflora zählt mehr als 870 Arten
      und die Wirbeltiere übersteigen 180 Arten.


      Der Herbst vereint zwei Höhepunkte. Zu Beginn der Jahreszeit hallt die Hirschbrunft durch die einsamen
      Schluchten. Kurz darauf sprießen die Waldpilze: Der lichte Kiefernwald am Beginn des Wanderwegs Balcón
      de Despeñaperros gilt als ideales Sammelrevier, während die Wildbirnen und Erdbeerbäume im
      Valdeazores-Tal in kräftigen Rottönen leuchten.
    visit: >-
      Beginne am Besucherzentrum Llano de las Américas, das sowohl über den Naturpark als auch über das
      Naturdenkmal des Cimbarra-Wasserfalls informiert. Ausstellungen erläutern Geologie und Kulturgeschichte,
      empfangen von einer lebensgroßen Kaiseradler-Nachbildung. Die Anfahrt erfolgt über die Ausfahrt 257 der
      Autobahn A-4 und die Straße JA-7102, die Santa Elena mit Miranda del Rey verbindet. Vom Zentrum führt
      der Wanderweg Los Estrechos de Miranda direkt in den Park.


      Die Wanderrouten bieten breite Abwechslung. Der Balcón de Despeñaperros ist ein Rundweg von knapp 4 km
      Länge, leicht und weitgehend eben, ideal für Familien mit Kindern. Er startet in Santa Elena, durchquert
      Kiefernwald und erreicht einen Aussichtspunkt mit weitem 180 Grad Panoramablick auf die Schlucht. Der
      Weg durch den Barranco de Valdeazores besticht durch botanischen Artenreichtum; El Empedraillo folgt
      historischen Römerstraßen; während der Pfad im Barranco de la Niebla geübten Wanderern vorbehalten ist.
    history: >-
      Dieses Grenzgebirge war Schauplatz der Entscheidungsschlacht bei Las Navas de Tolosa. Jahrtausende zuvor
      hinterließen iberische Stämme bronzene Votivfiguren (*Muñecos*) in Felsenheiligtümern am Collado de los
      Jardines und in der Cueva de los Muñecos. Höhlenmalereien finden sich in der Cueva del Santo, und der
      Weg Empedraillo folgt einer antiken römischen Pflasterstraße.


      Der Naturpark und die Cimbarra-Wasserfälle wurden 1989 unter Schutz gestellt. Dichte Forste aus
      Wiederaufforstungskiefern begünstigen Waldbrände, weshalb Forstbehörden gezielte Auflichtungen
      durchführen, um mediterrane Buschwälder und alte Korkeichen wieder freizustellen.
    before: >-
      Alle öffentlichen Wege und Rastplätze gelten als Sicherheitszonen während Jagdzeiten: Informiere dich
      vorab über Termine. Nimm auf dem Balcón-Weg ausreichend Trinkwasser, Sonnenschutz und festes Schuhwerk
      mit und unternimm keine Alleintouren ohne Benachrichtigung Dritter.
    around: >-
      Fünfzehn Kilometer entfernt liegt der [Naturpark Valle de Alcudia und Sierra
      Madrona](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), und neunzehn Kilometer entfernt
      der [Naturpark Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/). Weiter entfernt teilen der
      [Nationalpark Cabañeros](/lugar/parque-nacional-de-cabaneros/), das [FFH-Gebiet Montes de
      Toledo](/lugar/zec-montes-de-toledo/) und das [Naturschutzgebiet Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) Pardelluchs und Mönchsgeier mit Despeñaperros.
  it:
    intro: >-
      Per secoli, chiunque viaggiasse dalla Meseta verso l'Andalusia doveva necessariamente transitare da
      questa forra. Il fiume Despeñaperros, scorrendo da nord a sud, scavò nella Sierra Morena una gola dalle
      pareti quasi verticali con salti di quota superiori a 500 m, trasformandola nel corridoio naturale tra
      due mondi. Il Parco Naturale Despeñaperros, nel comune di Santa Elena (provincia di Jaén), è tra le aree
      protette più raccolte dell'Andalusia, ma concentra uno straordinario patrimonio geologico, biologico e
      storico.
    landscape: >-
      Le origini geologiche risalgono a circa 500 milioni di anni fa sui fondali di un mare ancestrale dove si
      depositarono banchi durissimi di quarzite armoricana; ancora oggi nei piani di strato affiorano
      increspature ondulate originate dal moto ondoso primitivo. Il sollevamento montuoso e l'erosione
      fluviale plasmarono forre, faglie e torri rupestri come Los Órganos, il Salto del Fraile e Las
      Correderas. Los Órganos, modellati nella quarzite resistente, somigliano a grandiose canne verticali
      d'organo.


      La vegetazione si distribuisce secondo l'esposizione al sole. I versanti più assolati sono il regno del
      leccio, misto a pino, quercia spinosa e cisto. Nelle ombrose forre rocciose vivono invece comunità
      forestali più esigenti. Nel Barranco de Valdeazores domina la macchia mediterranea con peri selvatici,
      corbezzoli e lentaggine, che accendono l'autunno di sfumature cromatiche. Il versante in ombra del
      Collado de la Estrella preserva un querceto di roverelle e cerri, mentre lungo i corsi d'acqua si
      sviluppano foreste a galleria con ontani, frassini e salici.
    wildlife: >-
      Tra querceti e balze rocciose trovano riparo il [cervo nobile](/especie/cervus_elaphus/) e il
      [cinghiale](/especie/sus_scrofa/), mentre in cielo planano rapaci rari come l'[aquila imperiale
      iberica](/especie/aquila_adalberti/) e il [grifone](/especie/gyps_fulvus/). Ai margini dell'area
      protetta compaiono la [lince iberica](/especie/lynx_pardinus/) e la [cicogna
      nera](/especie/ciconia_nigra/). Vivono nel parco anche volpe, mangusta e [gatto
      selvatico](/especie/felis_silvestris/). La flora vascolare censita supera 870 specie e i vertebrati
      contano oltre 180 taxa.


      L'autunno unisce due momenti significativi. All'inizio della stagione echeggia nel silenzio delle
      vallate il bramito del cervo durante le contese riproduttive. Poco dopo compaiono i funghi spontanei: la
      prima parte del sentiero Balcón de Despeñaperros, sotto una pineta pulita, è ideale per la ricerca,
      mentre peri selvatici e corbezzoli del vallone di Valdeazores tingono i versanti di rosso.
    visit: >-
      Inizia dal centro visitatori Llano de las Américas, che illustra il parco naturale e il monumento
      naturale della cascata de La Cimbarra. L'esposizione permanente ripercorre l'evoluzione geologica e
      umana dei luoghi, accolti da una replica a grandezza naturale dell'aquila imperiale. Si accede
      dall'uscita 257 dell'autostrada A-4 imboccando la strada JA-7102 che connette Santa Elena a Miranda del
      Rey. Dal centro parte il sentiero Los Estrechos de Miranda che si addentra a piedi nella forra.


      Le escursioni sono adatte a ogni livello. Il Balcón de Despeñaperros è un percorso circolare di quasi 4
      km, agevole e pianeggiante, ideale per famiglie con bambini. Parte da Santa Elena, attraversa una pineta
      e giunge a un belvedere che offre una visuale aperta a 180 gradi sulle gole. Il sentiero del Barranco de
      Valdeazores spicca per la varietà floristica; El Empedraillo segue un'antica via consolare lastricata;
      mentre il Barranco de la Niebla è riservato a escursionisti allenati data la ripida ascesa.
    history: >-
      Questa terra fu teatro della storica battaglia di Las Navas de Tolosa. Molto tempo prima, le popolazioni
      iberiche deponevano offerte votive in bronzo (*muñecos*) in santuari rupestri come il Collado de los
      Jardines e la Cueva de los Muñecos. Pitture rupestri preistoriche si conservano nella Cueva del Santo, e
      il percorso dell'Empedraillo ricalca una strada romana pavimentata in pietra.


      Il parco naturale e la cascata della Cimbarra furono istituiti nel 1989. I rimboschimenti densi a pino
      favoriscono la propagazione degli incendi estivi, per cui i servizi forestali eseguono diradamenti
      selettivi per favorire la macchia mediterranea autoctona e liberare querce da sughero secolari.
    before: >-
      I sentieri e le aree di sosta costituiscono fasce di sicurezza durante le battute venatorie: informati
      prima di partire. Sul sentiero del Balcón porta acqua, copricapo protettivo, calzature da trekking ed
      evita escursioni solitarie senza avvisare del percorso.
    around: >-
      A quindici chilometri sorge il [Parco Naturale della Valle di Alcudia e Sierra
      Madrona](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), e a diciannove chilometri il
      [Parco Naturale Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/). Più lontano, il [Parco
      Nazionale di Cabañeros](/lugar/parque-nacional-de-cabaneros/), la [Zona Speciale di Conservazione Montes
      de Toledo](/lugar/zec-montes-de-toledo/) e la [Riserva Naturale della Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) condividono con Despeñaperros la lince iberica e
      l'avvoltoio monaco.
  pt:
    intro: >-
      Durante séculos, quem viajava da Meseta para a Andaluzia tinha de atravessar este desfiladeiro. O rio
      Despeñaperros, correndo de norte para sul, rasgou na Sierra Morena uma garganta de escarpas quase
      verticais com desníveis superiores a 500 m, transformando-a no desfiladeiro natural entre dois mundos. O
      Parque Natural de Despeñaperros, no município de Santa Elena (província de Jaén), é dos mais pequenos da
      Andaluzia em extensão territorial, acolhendo todavia um património geológico, natural e histórico
      invulgar.
    landscape: >-
      A origem geológica remonta a cerca de 500 milhões de anos num mar antigo onde se depositou quartzito
      armoricano de extrema dureza; ainda hoje, nos seus estratos rochosos, sobressaem marcas onduladas das
      marés primitivas. O soerguimento tectónico e a erosão fluvial completaram o trabalho, abrindo
      desfiladeiros, falhas e formações como Los Órganos, o Salto del Fraile e Las Correderas. As bancadas de
      Los Órganos, esculpidas no quartzito rijo, assemelham-se a imponentes tubos de órgão de igreja.


      A vegetação reparte-se consoante a exposição solar. As encostas ensolaradas abrigam montados de
      azinheira com pinheiro-bravo, carrasco e estevas. Nos recantos umbrosos das fendas rochosas sobrevivem
      formações mais exigentes em humidade: o Barranco de Valdeazores ostenta mata mediterrânica com
      pereiras-bravas, medronheiros e folhados que tingem o outono de cores outonais. A encosta sombria do
      Collado de la Estrella preserva carvalhais de carvalho-cerquinho e carvalho-negral, margeando os rios
      galerias de amieiros, freixos e salgueiros.
    wildlife: >-
      Entre azinhais e penhascos abrigam-se o [veado-vermelho](/especie/cervus_elaphus/) e o
      [javali](/especie/sus_scrofa/), sob o voo de rapinas ameaçadas como a
      [águia-imperial-ibérica](/especie/aquila_adalberti/) e o [grifo](/especie/gyps_fulvus/). Nos limites do
      maciço assinalam-se presenças de [lince-ibérico](/especie/lynx_pardinus/) e
      [cegonha-preta](/especie/ciconia_nigra/). Ocorrem ainda raposas, sacarrabos e
      [gato-bravo](/especie/felis_silvestris/). A flora vascular catalogada ultrapassa 870 espécies e os
      vertebrados superam 180 táxones.


      O outono congrega dois momentos marcantes. No início da estação escuta-se no silêncio da serra a brama
      dos veados durante os confrontos reprodutivos. Pouco depois surgem os cogumelos silvestres: o troço
      inicial do Balcón de Despeñaperros, em pinhal aberto de sub-bosque rasteiro, é propício para observação
      micológica, enquanto medronheiros e pereiras do barranco de Valdeazores mudam de tonalidade.
    visit: >-
      Inicia a visita no centro de visitantes Llano de las Américas, que serve o parque natural e o sítio
      natural da cascata de La Cimbarra. O espaço expositivo explica a evolução geomorfológica e arqueológica,
      recebendo os caminhantes com uma réplica em tamanho real de uma águia-imperial. O acesso faz-se pela
      saída 257 da autoestrada A-4 e pela estrada JA-7102, que liga Santa Elena a Miranda del Rey. Do centro
      parte o trilho de Los Estrechos de Miranda, que entra a pé no parque.


      Os trilhos oferecem opções para vários perfis. O Balcón de Despeñaperros é um circuito de quase 4 km,
      suave e plano, adequado para famílias com crianças. Tem início em Santa Elena, atravessa um pinhal e
      atinge um miradouro com perspetiva panorâmica de 180 graus sobre as gargantas. A rota do Barranco de
      Valdeazores destaca-se pelo valor botânico; El Empedraillo e o Molino del Batán revelam calçadas
      romanas; enquanto o Barranco de la Niebla desafia caminhantes experientes devido ao forte desnível.
    history: >-
      Esta garganta histórica foi palco da célebre batalha de Las Navas de Tolosa. Milénios antes, povos
      ibéricos depositavam oferendas de bronze (*muñecos*) em santuários rupestres como o Collado de los
      Jardines e a Cueva de los Muñecos, visitáveis através de um trilho histórico. Existem pinturas rupestres
      na Cueva del Santo, e o percurso de El Empedraillo acompanha uma via romana lajeada em pedra.


      O parque natural e a cascata da Cimbarra foram classificados em 1989. Os pinhais de reflorestação densos
      potenciam fogos florestais, pelo que os serviços de conservação procedem a desbastes seletivos para
      recuperar a mata mediterrânica autóctone e libertar velhos sobreiros cobertos pela copa dos pinheiros.
    before: >-
      Todos os equipamentos e trilhos oficiais constituem zonas de segurança face à caça maior: informa-te
      antes de sair. No trilho do Balcón leva água, protetor solar e calçado apropriado, evitando deslocações
      solitárias sem comunicar o itinerário.
    around: >-
      A quinze quilómetros fica o [Parque Natural do Vale de Alcudia e Sierra
      Madrona](/lugar/parque-natural-de-sierra-madrona-y-valle-de-alcudia/), e a dezanove quilómetros o
      [Parque Natural da Sierra de Andújar](/lugar/parque-natural-sierra-de-andujar/). Mais longe, o [Parque
      Nacional de Cabañeros](/lugar/parque-nacional-de-cabaneros/), a [Zona Especial de Conservação Montes de
      Toledo](/lugar/zec-montes-de-toledo/) e a [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) partilham com Despeñaperros o lince-ibérico e o
      abutre-preto.
