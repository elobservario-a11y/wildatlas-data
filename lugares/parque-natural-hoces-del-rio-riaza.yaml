unico:
  es: >-
    Más de 700 parejas de buitre leonado crían en estas hoces, y en la Casa del Parque puedes seguir en
    directo uno de sus nidos.
  en: >-
    More than 700 pairs of griffon vultures breed in these gorges, and at the Casa del Parque you can watch
    one of their nests live on camera.
  fr: >-
    Plus de 700 couples de vautours fauves nichent dans ces gorges, et la Maison du parc permet de suivre en
    direct l'un de leurs nids.
  de: >-
    Mehr als 700 Gänsegeierpaare brüten in diesen Schluchten, und im Besucherzentrum kannst du eines ihrer
    Nester per Live-Kamera beobachten.
  it: >-
    Più di 700 coppie di grifoni nidificano in queste gole, e nella Casa del Parque puoi seguire dal vivo uno
    dei loro nidi tramite webcam.
  pt: >-
    Mais de 700 casais de abutre-fouveiro nidificam nestas gargantas, e na Casa del Parque podes acompanhar um
    dos seus ninhos em direto.
observaciones:
  es: >-
    La Senda del Río atraviesa la zona de reserva y entre el 1 de enero y el 31 de julio hace falta
    autorización, con grupos de 10 personas como máximo. La autorización se pide en la Casa del Parque de
    Montejo de la Vega, que también la tramita para otras zonas durante la época de cría. En la Senda de las
    Tenadas la cobertura de telefonía móvil es reducida. Primavera y otoño son las épocas más recomendables, y
    el parque es mucho más tranquilo que las hoces del Duratón.
texto:
  es:
    intro: >-
      Un río manso, un embalse y, de pronto, una pared de roca de 150 metros con buitres girando encima. Eso
      es el Parque Natural Hoces del Río Riaza, en el noreste de Segovia. Son 6470 hectáreas repartidas entre
      Montejo de la Vega de la Serrezuela, Valdevacas de Montejo y Maderuelo, y su fama viene de las aves: el
      [buitre leonado](/especie/gyps_fulvus/) cría aquí en una de las mayores colonias de Europa.
    landscape: >-
      El Riaza recorre el parque de sureste a noroeste y, por el camino, cambia de carácter tres veces.
      Primero, entre Maderuelo y la presa de Linares del Arroyo, el relieve es suave y el río está embalsado
      desde 1951. Después, entre la presa y el arroyo de El Casuar, el agua se encaja en la caliza durante 5,5
      kilómetros y forma un cañón de hasta 150 metros de profundidad y entre 200 y 300 de anchura. Por último,
      pasado el Casuar, el río abandona las calizas y se abre en un valle asimétrico con una vega fértil en el
      fondo, hasta Montejo de la Vega.


      Cómo nació el cañón se lee en la roca. El río cortó la caliza turonense, llegó a las margas cenomanenses
      y labró allí su lecho, ayudado por una red de fallas y por procesos kársticos. En un tramo de 2,5
      kilómetros cambia de dirección una y otra vez y dibuja cuatro meandros encajados, de tamaño y curvatura
      muy parecidos. Los cortados, con sus repisas y oquedades, son justo lo que buscan las aves de roquedo
      para asentarse.


      Arriba, en el páramo, domina la estepa, con manchas de sabinar, encinar y algo de quejigar adaptadas a
      un clima de continentalidad extrema. Manda la sabina albar, y la encina, por encima de los 900 metros
      sobre suelo calizo, no pasa de su etapa arbustiva, la carrasca. Abajo, en el fondo del valle, el río
      sostiene un soto de chopos, sauces, álamos, alisos y fresnos.
    wildlife: >-
      Las aves son la razón de ser del parque. Hay catalogadas más de 20 especies del Anexo 1 de la Directiva
      de Aves, y entre ellas destacan el alimoche, el avión roquero, la [chova
      piquirroja](/especie/pyrrhocorax_pyrrhocorax/) y el [búho real](/especie/bubo_bubo/). Los riscos con más
      concentración de aves de presa son el cerro del Portillo, la peña de la Zorra y la Murcielaguera, que
      además guarda una gran colonia de murciélagos ratoneros.


      El año del buitre empieza en invierno. En noviembre y diciembre se ven parejas volando en paralelo, a
      veces hasta rozarse, en vuelos de cortejo. Desde diciembre empiezan a llevar ramas a las repisas, y cada
      pareja pone un solo huevo al año, de modo que todo el esfuerzo se juega en una cría. Por eso el acceso
      al parque está regulado durante la época de cría.


      Fuera del roquedo, el paisaje cambia de público. En la paramera abundan el chotacabras pardo, el
      esmerejón, la alondra de Dupont y la collalba rubia. En el bosque de encinas, sabinas y pinos viven el
      azor, el cárabo y el [águila real](/especie/aquila_chrysaetos/). Y en el río y el embalse de Linares del
      Arroyo, que cada año es la principal zona de invernada de aves acuáticas de la provincia, se reúnen el
      ánade real, el porrón común, el somormujo lavanco y la garza real. Entre los mamíferos hay
      [nutria](/especie/lutra_lutra/), corzo, tejón, [gineta](/especie/genetta_genetta/), garduña y gato
      montés.
    visit: >-
      Empieza por la Casa del Parque, en Montejo de la Vega. Allí te explican las rutas y las zonas de interés
      cercanas, y su exposición ayuda a entender el sitio antes de salir: paneles sobre la formación del cañón
      y sobre los habitantes del río, del cortado y del bosque, reproducciones a tamaño real de buitre
      leonado, alimoche, águila real, búho real y halcón peregrino, y una cámara en tiempo real sobre un nido
      de buitre.


      Después, a pie. La Senda entre Puentes es un circuito fácil de 6 km que empieza y termina en Montejo de
      la Vega y se puede hacer todo el año; pasa por el cortado de Peña Portillo, donde se observa al buitre
      leonado, y por ejemplares de sabina albar y pino laricio. Otro sendero sale de la propia Casa del
      Parque, cruza el Riaza por una pasarela de madera y llega al cortado de las Torres. Y si prefieres un
      paseo entre pastores y sabinas, la Senda de las Tenadas de Valdevacas es circular, de 4,5 km, con 1 hora
      y 18 minutos de duración y 100 metros de desnivel; las tenadas que le dan nombre son corrales de campo
      levantados por pastores para resguardar el ganado ovino.


      La Senda del Río es la más larga: 11,5 km lineales, de dificultad media, desde Montejo de la Vega hasta
      la presa de Linares del Arroyo. Recorre el cañón entre un encinar espeso y un bosquete abierto de
      sabinas, junto a la nutria que acompaña al río, y un panel explica cómo se formó antes del descenso al
      valle.
    history: >-
      Desde el 18 de enero de 2005 es parque natural. El pasado humano asoma en el paisaje: la ermita de
      Casuar, una iglesia románica del siglo XII en la vega del Riaza, es Bien de Interés Cultural desde 1997.
      Del pueblo de Linares del Arroyo, inundado por el embalse, quedan los restos de una iglesia románica que
      asoman más o menos según el nivel del agua; en la Casa del Parque, sus vecinos cuentan en un vídeo cómo
      se construyó el pantano. Fuera del parque, Maderuelo es Conjunto Histórico y Bien de Interés Cultural
      desde 1993, con restos de muralla, torres e iglesias románicas.
    before: >-
      La Senda del Río atraviesa la zona de reserva y entre el 1 de enero y el 31 de julio hace falta
      autorización, con grupos de 10 personas como máximo. La autorización se pide en la Casa del Parque de
      Montejo de la Vega, que también la tramita para otras zonas durante la época de cría. En la Senda de las
      Tenadas la cobertura de telefonía móvil es reducida. Primavera y otoño son las épocas más recomendables,
      y el parque es mucho más tranquilo que las hoces del Duratón.
    around: >-
      A unos 26 km queda el [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/), la otra gran garganta caliza segoviana, más
      concurrida. Más lejos, [Gorges de la Jonte](/lugar/gorges-de-la-jonte/) comparte con el Riaza el cañón
      kárstico y los buitres, el alimoche y el buitre leonado.
  en:
    intro: >-
      A gentle river, a reservoir and, suddenly, a 150-metre rock wall with vultures wheeling overhead. That
      is Hoces del Río Riaza Natural Park, in north-eastern Segovia. It encompasses 6470 hectares spread
      between Montejo de la Vega de la Serrezuela, Valdevacas de Montejo and Maderuelo, and its renown comes
      from birds: the [griffon vulture](/especie/gyps_fulvus/) breeds here in one of Europe's largest
      colonies.
    landscape: >-
      The Riaza traverses the park from south-east to north-west, changing character three times along the
      way. First, between Maderuelo and the Linares del Arroyo dam, the topography is gentle and the river has
      been dammed since 1951. Next, between the dam and El Casuar stream, water cuts into the limestone for
      5.5 kilometres, carving a canyon up to 150 metres deep and between 200 and 300 metres wide. Finally,
      beyond El Casuar, the river leaves the limestone behind and opens into an asymmetrical valley with a
      fertile floodplain, reaching Montejo de la Vega.


      The canyon's creation can be read in the rock. The river sliced through Turonian limestone, reached
      Cenomanian marls and excavated its bed, aided by fault lines and karst processes. Along a stretch of 2.5
      kilometres it twists repeatedly, etching four incised meanders of remarkably similar size and curvature.
      The sheer walls, stepped ledges and cavities provide ideal nesting sites for cliff-dwelling birds.


      Above on the plateau, open steppe dominates, with pockets of Spanish juniper, holm oak and some gall oak
      adapted to a harsh continental climate. Spanish juniper rules, while holm oak above 900 metres on
      limestone soils rarely exceeds a stunted shrub form. Below along the valley floor, the river supports a
      riparian woodland of black poplars, willows, white poplars, alders and ashes.
    wildlife: >-
      Birds are the very essence of the park. Over 20 species listed under Annex 1 of the Birds Directive are
      catalogued here, prominently including the Egyptian vulture, crag martin, [red-billed
      chough](/especie/pyrrhocorax_pyrrhocorax/) and [Eurasian eagle-owl](/especie/bubo_bubo/). The cliffs
      with the heaviest raptor concentrations are Cerro del Portillo, Peña de la Zorra and La Murcielaguera,
      which also shelters a major colony of mouse-eared bats.


      The vulture year begins in winter. In November and December, courting pairs can be seen flying
      wingtip-to-wingtip. Starting in December they carry nesting sticks to cliff ledges, each pair laying
      just one single egg per year, meaning an entire season's effort rests on one fledgling. This is why park
      access is regulated throughout the breeding season.


      Away from the cliffs, wildlife changes with the terrain. Across the moors abound red-necked nightjars,
      merlins, Dupont's larks and black-eared wheatears. Northern goshawks, tawny owls and [golden
      eagles](/especie/aquila_chrysaetos/) inhabit woodlands of holm oak, juniper and pine. At the river and
      the Linares del Arroyo reservoir, the province's prime waterbird wintering area, mallards, common
      pochards, great crested grebes and grey herons congregate. Mammals include the [Eurasian
      otter](/especie/lutra_lutra/), roe deer, badger, [common genet](/especie/genetta_genetta/), stone marten
      and wildcat.
    visit: >-
      Start at the Casa del Parque in Montejo de la Vega. The staff explain trails and nearby areas of
      interest, while the interpretive exhibits provide essential background before setting out: displays
      illustrate the canyon's geological formation and riparian, cliff and woodland wildlife, life-size
      replicas show griffon vultures, Egyptian vultures, golden eagles, eagle-owls and peregrine falcons, and
      a live web camera points directly into a vulture nest.


      Then, explore on foot. The Senda entre Puentes is an easy 6 km circuit starting and finishing in Montejo
      de la Vega, feasible year-round; it passes the Peña Portillo cliffs for vulture viewing, as well as
      Spanish junipers and black pines. Another path leads from the visitor centre across a wooden footbridge
      over the Riaza towards the Las Torres cliffs. If you prefer walking among shepherd heritage and
      junipers, the circular Senda de las Tenadas de Valdevacas covers 4.5 km, taking 1 hour and 18 minutes
      with 100 metres of elevation change; the tenadas are traditional stone pens built by shepherds to
      shelter sheep.


      The Senda del Río is the longest option: a linear 11.5 km moderate trail from Montejo de la Vega to the
      Linares del Arroyo dam. It threads the gorge between dense holm oaks and open juniper groves alongside
      the river's otter habitat, while an interpretive panel explains the canyon's formation before descending
      to the valley.
    history: >-
      The area has been protected as a natural park since 18 January 2005. Human history is woven into the
      landscape: the hermitage of Casuar, a twelfth-century Romanesque church in the Riaza valley, has been a
      designated Cultural Heritage Site since 1997. Of the village of Linares del Arroyo, drowned by the
      reservoir, remains of a Romanesque church emerge depending on water levels; at the visitor centre,
      former residents recount the dam's construction in a documentary video. Outside the park, Maderuelo is a
      Historic-Artistic Ensemble and Heritage Site designated in 1993, with medieval town walls, towers and
      Romanesque churches.
    before: >-
      The Senda del Río traverses the core nature reserve; between 1 January and 31 July prior authorization
      is required, with groups limited to a maximum of 10 people. Authorization is requested at the Casa del
      Parque in Montejo de la Vega, which also regulates other zones during bird breeding periods. Mobile
      reception is limited along the Senda de las Tenadas. Spring and autumn are the best seasons to visit,
      and the park is much quieter than the Duratón gorges.
    around: >-
      About 26 km away lies [Hoces del Río Duratón Natural
      Park](/lugar/parque-natural-hoces-del-rio-duraton/), the region's other major limestone gorge, which is
      more frequented. Farther afield, [Gorges de la Jonte](/lugar/gorges-de-la-jonte/) shares with Riaza
      karst canyons, soaring vultures, the Egyptian vulture and the griffon vulture.
  fr:
    intro: >-
      Une rivière paisible, une retenue d'eau et, soudain, une muraille de roche de 150 mètres au-dessus de
      laquelle tournoient des vautours. C'est le parc naturel Hoces del Río Riaza, dans le nord-est de
      Ségovie. Il s'étend sur 6470 hectares répartis entre Montejo de la Vega de la Serrezuela, Valdevacas de
      Montejo et Maderuelo, et sa notoriété vient de ses oiseaux : le [vautour fauve](/especie/gyps_fulvus/) y
      niche au sein de l'une des plus importantes colonies d'Europe.
    landscape: >-
      Le Riaza traverse le parc du sud-est au nord-ouest et change trois fois de visage en chemin. D'abord,
      entre Maderuelo et le barrage de Linares del Arroyo, le relief est doux et le cours d'eau est retenu
      depuis 1951. Ensuite, entre le barrage et le ruisseau d'El Casuar, l'eau s'encaisse dans le calcaire sur
      5,5 kilomètres et forme un canyon atteignant 150 mètres de profondeur et entre 200 et 300 de largeur.
      Enfin, passé El Casuar, le cours d'eau quitte les calcaires pour s'ouvrir en une vallée asymétrique au
      fond alluvial fertile, jusqu'à Montejo de la Vega.


      La genèse du canyon se déchiffre dans la roche. La rivière a incisé le calcaire turonien, atteint les
      marnes cénomaniennes et y a façonné son lit, aidée par un réseau de failles et par les processus
      karstiques. Sur un tronçon de 2,5 kilomètres, elle change sans cesse de direction et dessine quatre
      méandres encaissés, de taille et courbure très proches. Les falaises, avec leurs vires et leurs cavités,
      offrent exactement l'habitat recherché par les oiseaux rupicoles.


      En haut, sur le causse, s'étend la steppe, ponctuée de bosquets de genévrier thurifère, de chêne vert et
      de chêne faginé adaptés à un climat d'extrême continentalité. Le genévrier domine, tandis que le chêne
      vert, au-dessus de 900 mètres sur sol calcaire, ne dépasse guère le stade d'arbuste trapu. En bas, au
      fond de la vallée, la rivière nourrit un cordon de peupliers noirs, saules, peupliers blancs, aulnes et
      frênes.
    wildlife: >-
      Les oiseaux sont la raison d'être du parc. Plus de 20 espèces inscrites à l'annexe 1 de la directive
      Oiseaux y sont recensées, parmi lesquelles se détachent le percnoptère, l'hirondelle de rochers, le
      [crave à bec rouge](/especie/pyrrhocorax_pyrrhocorax/) et le [hibou grand-duc](/especie/bubo_bubo/). Les
      escarpements concentrant le plus de rapaces sont le cerro del Portillo, la peña de la Zorra et La
      Murcielaguera, qui abrite en outre une vaste colonie de murins.


      L'année du vautour s'ouvre en hiver. En novembre et décembre, on observe les couples voler côte à côte
      lors de parades nuptiales. Dès décembre, ils apportent des branchages sur les corniches, chaque couple
      ne pondant qu'un seul œuf par an, de sorte que tous les efforts reposent sur un unique jeune. C'est
      pourquoi l'accès au parc fait l'objet d'une stricte réglementation en période de reproduction.


      Hors des parois, la faune se diversifie selon les milieux. Sur le causse abondent l'engoulevent
      d'Europe, l'émerillon, l'alouette de Dupont et le traquet oreillard. Les bois de chênes, genévriers et
      pins abritent l'autour des palombes, la chouette hulotte et l'[aigle
      royal](/especie/aquila_chrysaetos/). Sur la rivière et le lac de Linares del Arroyo, premier site
      d'hivernage d'oiseaux d'eau de la province, se rassemblent canard colvert, fuligule milouin, grèbe huppé
      et héron cendré. Les mammifères comptent la [loutre d'Europe](/especie/lutra_lutra/), le chevreuil, le
      blaireau, la [genette commune](/especie/genetta_genetta/), la fouine et le chat forestier.
    visit: >-
      Commencez par la Maison du parc à Montejo de la Vega. L'équipe y détaille les circuits et les curiosités
      voisines, et son exposition permet d'appréhender le site avant de partir : panneaux sur la formation du
      canyon et sur la faune des rives, des falaises et des forêts, reproductions grandeur nature de vautour
      fauve, percnoptère, aigle royal, grand-duc et faucon pèlerin, et caméra retransmettant en direct
      l'intérieur d'un nid de vautour.


      Partez ensuite à pied. La Senda entre Puentes est une boucle facile de 6 km qui commence et se termine à
      Montejo de la Vega et peut s'effectuer toute l'année ; elle passe devant la falaise de Peña Portillo où
      nichent les vautours fauves, ainsi que devant des genévriers thurifères et des pins laricios
      remarquables. Un autre sentier part directement du centre, franchit le Riaza par une passerelle de bois
      et gagne la falaise de Las Torres. Si vous aimez les paysages pastoraux et les genévriers, la boucle
      Senda de las Tenadas de Valdevacas s'étend sur 4,5 km, avec 1 heure et 18 minutes de marche pour 100
      mètres de dénivelé ; les tenadas sont des enclos en pierre sèche bâtis par les bergers pour abriter
      leurs troupeaux.


      La Senda del Río est la plus longue : 11,5 km linéaires, de difficulté moyenne, depuis Montejo de la
      Vega jusqu'au barrage de Linares del Arroyo. Elle parcourt le canyon entre une yeuseraie dense et un
      boisement ouvert de genévriers, le long des berges fréquentées par la loutre, un panneau expliquant la
      formation de la faille avant la descente vers la vallée.
    history: >-
      Le territoire est classé parc naturel depuis le 18 janvier 2005. L'empreinte humaine ponctue le paysage
      : l'ermitage de Casuar, église romane du XIIe siècle dans la plaine du Riaza, est classé bien d'intérêt
      culturel depuis 1997. Du village de Linares del Arroyo, englouti par la retenue, subsistent les ruines
      d'une église romane qui affleurent selon le niveau des eaux ; à la Maison du parc, d'anciens habitants
      évoquent dans une vidéo la construction du barrage. Hors du parc, Maderuelo est un ensemble historique
      classé bien d'intérêt culturel depuis 1993, doté de remparts, de tours et d'églises romanes.
    before: >-
      La Senda del Río traverse la zone de réserve intégrale et nécessite une autorisation entre le 1er
      janvier et le 31 juillet, pour des groupes de 10 personnes au maximum. La demande s'effectue auprès de
      la Maison du parc de Montejo de la Vega, qui réglemente aussi d'autres secteurs en période de
      nidification. Sur la Senda de las Tenadas, la couverture mobile est faible. Le printemps et l'automne
      sont les saisons idéales, et le parc est nettement plus paisible que les gorges du Duratón.
    around: >-
      À environ 26 km se trouve le [Parc naturel Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/), l'autre grande gorge calcaire de Ségovie, plus
      fréquentée. Plus loin, les [Gorges de la Jonte](/lugar/gorges-de-la-jonte/) partagent avec le Riaza le
      canyon karstique et les rapaces, avec percnoptère et vautour fauve.
  de:
    intro: >-
      Ein sanfter Fluss, ein Stausee und plötzlich eine 150 Meter hohe Felswand, über der Geier kreisen. Das
      ist der Naturpark Hoces del Río Riaza im Nordosten von Segovia. Er umfasst 6470 Hektar auf den
      Gemeindegebieten von Montejo de la Vega de la Serrezuela, Valdevacas de Montejo und Maderuelo. Seine
      Bekanntheit verdankt er den Vögeln: Der [Gänsegeier](/especie/gyps_fulvus/) brütet hier in einer der
      größten Kolonien Europas.
    landscape: >-
      Der Riaza durchfließt den Park von Südosten nach Nordwesten und wandelt dabei dreimal seinen Charakter.
      Zunächst, zwischen Maderuelo und der Talsperre von Linares del Arroyo, ist das Relief sanft und der
      Fluss seit 1951 aufgestaut. Danach schneidet sich das Wasser zwischen der Talsperre und dem Bach El
      Casuar auf 5,5 Kilometern in den Kalkstein ein und bildet einen Canyon von bis zu 150 Metern Tiefe und
      zwischen 200 und 300 Metern Breite. Hinter El Casuar schließlich verlässt der Fluss den Kalkstein und
      öffnet sich in ein asymmetrisches Tal mit fruchtbarer Flussaue bis Montejo de la Vega.


      Wie der Canyon entstand, lässt sich im Gestein ablesen. Der Fluss durchschnitt Turon-Kalksteine, stieß
      auf Cenoman-Mergel und grub dort sein Bett ein, unterstützt von Verwerfungen und Karstprozessen. Auf
      einem 2,5 Kilometer langen Abschnitt wechselt er wiederholt die Richtung und bildet vier eingeschnittene
      Mäander von verblüffend ähnlicher Größe und Biegung. Die Felsabstürze mit ihren Bändern und Nischen sind
      genau das, was felsbrütende Vögel suchen.


      Oben auf der Hochfläche dominiert offenes Steppenland mit Beständen von Sadebaum, Steineiche und etwas
      Pyrenäen-Eiche, angepasst an extremes Kontinentalklima. Der Sadebaum herrscht vor, während die
      Steineiche oberhalb von 900 Metern auf Kalkstein kaum über Kriechbuschformen hinauskommt. Unten am
      Talboden nährt der Fluss Auwälder aus Schwarz-Pappeln, Weiden, Silber-Pappeln, Erlen und Eschen.
    wildlife: >-
      Die Vögel sind das Herzstück des Parks. Mehr als 20 im Anhang 1 der Vogelschutzrichtlinie geführte Arten
      sind hier nachgewiesen, darunter Schmutzgeier, Felsenschwalbe,
      [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/) und [Uhu](/especie/bubo_bubo/). Die Felsen mit den
      dichtesten Greifvogelbeständen sind der Cerro del Portillo, die Peña de la Zorra und La Murcielaguera,
      die zudem eine riesige Mausohr-Fledermauskolonie beherbergt.


      Das Geierjahr beginnt im Winter. Im November und Dezember sieht man Paare bei Balzflügen flügelnah
      nebeneinander segeln. Ab Dezember tragen sie Nistmaterial zu den Felsbändern, und jedes Paar legt nur
      ein einziges Ei im Jahr, sodass der gesamte Jahreserfolg an einem Jungvogel hängt. Daher ist der Zugang
      zum Park während der Brutzeit streng reglementiert.


      Abseits der Felswände verändert sich die Vogelwelt je nach Lebensraum. Auf den Hochflächen leben
      Rothals-Ziegenmelker, Merlin, Dupontlerche und Mittelmeer-Steinschmätzer. In den Eichen-, Wacholder- und
      Kiefernwäldern hausen Habicht, Waldkauz und [Steinadler](/especie/aquila_chrysaetos/). Am Fluss und
      Stausee Linares del Arroyo, dem wichtigsten Überwinterungsgewässer der Provinz, versammeln sich
      Stockente, Tafelente, Haubentaucher und Graureiher. Bei den Säugetieren kommen [Eurasische
      Fischotter](/especie/lutra_lutra/), Reh, Dachs, [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/),
      Steinmarder und Wildkatze vor.
    visit: >-
      Beginne im Besucherzentrum Casa del Parque in Montejo de la Vega. Dort erläutert man Routen und nahe
      Sehenswürdigkeiten, und die Ausstellung vermittelt wertvolles Wissen vor dem Aufbruch: Schautafeln zur
      Entstehung des Canyons und zu den Bewohnern von Fluss, Fels und Wald, lebensgroße Nachbildungen von
      Gänsegeier, Schmutzgeier, Steinadler, Uhu und Wanderfalke sowie eine Live-Kamera direkt an einem
      Geiernest.


      Anschließend geht es zu Fuß weiter. Die Senda entre Puentes ist ein einfacher 6 km langer Rundweg ab
      Montejo de la Vega, der ganzjährig begangen werden kann; er führt am Felsen Peña Portillo mit Blick auf
      Gänsegeier sowie an alten Sadebäumen und Schwarzkiefern vorbei. Ein anderer Pfad führt direkt vom
      Besucherzentrum über einen Holzsteg über den Riaza zu den Felsen von Las Torres. Wer einen Spaziergang
      zwischen Hirtenkultur und Wacholdern bevorzugt, wählt die kreisförmige Senda de las Tenadas de
      Valdevacas über 4,5 km, Gehzeit 1 Stunde und 18 Minuten bei 100 Höhenmetern; die namensgebenden Tenadas
      sind historische Steinhürden, die Hirten zum Schutz der Schafe errichteten.


      Die Senda del Río ist die längste Route: 11,5 km einfache Strecke von mittlerem Anspruch von Montejo de
      la Vega bis zur Staumauer von Linares del Arroyo. Sie folgt der Schlucht zwischen dichtem
      Steineichenwald und lichten Sadebaumbeständen entlang des Fischotterreviers am Fluss, während eine
      Infotafel die Entstehung des Cañons erläutert.
    history: >-
      Seit dem 18. Januar 2005 ist das Gebiet als Naturpark geschützt. Spuren menschlicher Geschichte prägen
      die Landschaft: Die Einsiedelei Casuar, eine romanische Kirche aus dem zwölften Jahrhundert im
      Riaza-Tal, steht seit 1997 als Kulturgut unter Denkmalschutz. Vom Dorf Linares del Arroyo, das im
      Stausee versank, ragen je nach Wasserstand Reste einer romanischen Kirche hervor; im Besucherzentrum
      berichten Zeitzeugen in einem Dokumentarfilm vom Bau der Talsperre. Außerhalb des Parks ist Maderuelo
      ein historisches Ensemble und seit 1993 geschütztes Kulturgut mit Wehrmauern, Türmen und romanischen
      Kirchen.
    before: >-
      Die Senda del Río durchquert die Kernzone; vom 1. Januar bis zum 31. Juli ist eine Genehmigung für
      Gruppen von höchstens 10 Personen erforderlich. Sie wird im Besucherzentrum von Montejo de la Vega
      beantragt, das auch andere Zonen während der Brutzeit schützt. Auf der Senda de las Tenadas ist der
      Mobilfunkempfang gering. Frühling und Herbst sind ideal, und der Park ist ungleich ruhiger als die
      Schluchten des Duratón.
    around: >-
      Etwa 26 km entfernt liegt der [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/), Segovias andere große Kalksteinschlucht, die
      stärker besucht ist. Weiter entfernt teilen die [Gorges de la Jonte](/lugar/gorges-de-la-jonte/)
      Karstschluchten, Geier, Schmutzgeier und Gänsegeier mit dem Riaza.
  it:
    intro: >-
      Un fiume tranquillo, un bacino artificiale e, all'improvviso, una muraglia rocciosa di 150 metri su cui
      volteggiano gli avvoltoi. È il Parco naturale Hoces del Río Riaza, nel nord-est di Segovia. Si sviluppa
      su 6470 ettari ripartiti tra Montejo de la Vega de la Serrezuela, Valdevacas de Montejo e Maderuelo, e
      la sua fama si deve ai volatili: il [grifone](/especie/gyps_fulvus/) vi nidifica in una delle maggiori
      colonie d'Europa.
    landscape: >-
      Il Riaza attraversa il parco da sud-est a nord-ovest cambiando volto tre volte lungo il cammino.
      Dapprima, tra Maderuelo e la diga di Linares del Arroyo, il rilievo è dolce e il fiume è invasato dal
      1951. Poi, tra la diga e il torrente El Casuar, l'acqua si incassa nel calcare per 5,5 chilometri
      aprendo una forra profonda fino a 150 metri e larga tra 200 e 300 metri. Infine, oltrepassato El Casuar,
      il fiume esce dai calcari e si distende in una vallata asimmetrica con una fertile pianura alluvionale
      fino a Montejo de la Vega.


      L'origine del canyon è incisa nella roccia. Il corso d'acqua ha inciso i calcari turoniani fino alle
      marne cenomaniane modellandovi il proprio alveo, agevolato da faglie tettoniche e fenomeni carsici. Su
      un tratto di 2,5 chilometri muta direzione a più riprese, disegnando quattro meandri incassati di
      dimensioni e raggio molto simili. Le falesie, con cenge e anfratti, offrono l'habitat perfetto per i
      volatili rupicoli.


      In alto, sull'altopiano arido, domina la steppa con macchie di ginepro fenicio, leccio e roverella
      adattate a un rigido clima continentale. Prevale il ginepro comune e liscio, mentre il leccio, oltre i
      900 metri su suolo calcareo, mantiene portamento arbustivo. In basso, nel fondovalle, il fiume alimenta
      un bosco ripariale di pioppi neri, salici, pioppi bianchi, ontani e frassini.
    wildlife: >-
      Gli uccelli costituiscono il fulcro del parco. Sono censite oltre 20 specie incluse nell'Allegato 1
      della Direttiva Uccelli, tra cui capovaccaio, rondine montana, [gracchio
      corallino](/especie/pyrrhocorax_pyrrhocorax/) e [gufo reale](/especie/bubo_bubo/). Le falesie con la
      massima densità di rapaci sono il cerro del Portillo, la peña de la Zorra e La Murcielaguera, che
      protegge inoltre una cospicua colonia di pipistrelli vespertilioni.


      L'annata dei grifoni si apre in inverno. A novembre e dicembre si ammirano le coppie volare appaiate
      sfiorandosi nelle parate nuziali. Da dicembre iniziano a portare rami sulle cenge, e ogni coppia depone
      un solo uovo all'anno, cosicché ogni sforzo si concentra su un unico pulcino. Per questo l'accesso al
      parco è rigorosamente regolamentato durante la riproduzione.


      Fuori dalle pareti, la fauna varia con l'ambiente. Sull'altopiano abbondano succiacapre, smeriglio,
      allodola di Dupont e monachella. Nei boschi di leccio, ginepro e pino vivono astore, allocco e [aquila
      reale](/especie/aquila_chrysaetos/). Lungo il fiume e nel lago di Linares del Arroyo, polo d'elezione
      per lo svernamento provinciale di uccelli acquatici, stazionano germano reale, moriglione, svasso
      maggiore e airone cenerino. Tra i mammiferi si annoverano la [lontra europea](/especie/lutra_lutra/), il
      capriolo, il tasso, la [genetta comune](/especie/genetta_genetta/), la faina e il gatto selvatico.
    visit: >-
      Inizia dalla Casa del Parque a Montejo de la Vega. Gli operatori illustrano i sentieri e i punti
      d'interesse dei dintorni, e l'allestimento museale permette di comprendere il territorio prima della
      partenza: pannelli sull'evoluzione della forra e sugli abitanti di fiume, rupi e boschi, sagome a
      grandezza naturale di grifone, capovaccaio, aquila reale, gufo reale e falco pellegrino, e una
      telecamera puntata in diretta su un nido d'avvoltoio.


      Poi muoviti a piedi. La Senda entre Puentes è un comodo anello di 6 km con partenza e arrivo a Montejo
      de la Vega, praticabile tutto l'anno; transita per la rupe di Peña Portillo, ideale per osservare i
      grifoni, e tra esemplari secolari di ginepro e pino nero. Un altro tragitto muove dal centro visite,
      valica il Riaza su una passerella lignea e raggiunge le pareti delle Torres. Se preferisci una
      passeggiata tra testimonianze pastorali e ginepri, l'anello della Senda de las Tenadas de Valdevacas
      copre 4,5 km, con 1 ora e 18 minuti di cammino e 100 metri di dislivello; le tenadas sono tradizionali
      recinti in pietra eretti dai pastori per riparare le greggi.


      La Senda del Río è il tracciato più impegnativo: 11,5 km lineari, di media difficoltà, da Montejo de la
      Vega alla diga di Linares del Arroyo. Si addentra nel canyon tra una fitta lecceta e rade boscaglie di
      ginepri costeggiando le acque della lontra, con un pannello esplicativo della faglia prima della discesa
      verso la valle.
    history: >-
      Dal 18 gennaio 2005 l'area è parco naturale. Il trascorso umano affiora nel paesaggio: l'eremo di
      Casuar, edificio romanico del XII secolo nella pianura del Riaza, è Bene di Interesse Culturale dal
      1997. Dell'abitato di Linares del Arroyo, sommerso dal bacino, restano i ruderi di una chiesa romanica
      che emergono a seconda del livello idrico; alla Casa del Parque, gli ex abitanti rievocano in video la
      costruzione dell'invaso. All'esterno del parco, Maderuelo è Complesso Storico e Bene di Interesse
      Culturale dal 1993, munito di cinta muraria, torrioni e chiese romaniche.
    before: >-
      La Senda del Río attraversa la riserva integrale e tra il 1° gennaio e il 31 luglio esige
      un'autorizzazione, con gruppi limitati a 10 persone al massimo. L'autorizzazione va richiesta alla Casa
      del Parque di Montejo de la Vega, che regolamenta anche altri settori nel periodo riproduttivo. Lungo la
      Senda de las Tenadas la ricezione telefonica è scarsa. Primavera e autunno sono i periodi migliori, e il
      parco è molto più pacifico rispetto alle gole del Duratón.
    around: >-
      A circa 26 km si trova il [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/), l'altra grande forra calcarea di Segovia,
      maggiormente frequentata. Più distante, le [Gorges de la Jonte](/lugar/gorges-de-la-jonte/) condividono
      con il Riaza gole carsiche, avvoltoi volteggianti, capovaccaio e grifone.
  pt:
    intro: >-
      Um rio manso, uma albufeira e, subitamente, uma muralha de rocha de 150 metros com abutres a planar por
      cima. É o Parque Natural Hoces del Río Riaza, no nordeste de Segóvia. São 6470 hectares repartidos entre
      Montejo de la Vega de la Serrezuela, Valdevacas de Montejo e Maderuelo, e o seu renome provém das aves:
      o [abutre-fouveiro](/especie/gyps_fulvus/) nidifica aqui numa das maiores colónias da Europa.
    landscape: >-
      O Riaza percorre o parque de sudeste para noroeste e transforma o seu aspeto três vezes ao longo do
      percurso. Primeiro, entre Maderuelo e a barragem de Linares del Arroyo, o relevo é suave e o rio está
      represado desde 1951. Depois, entre a barragem e o ribeiro de El Casuar, a água encaixa-se no calcário
      ao longo de 5,5 quilómetros e rasga um desfiladeiro com até 150 metros de profundidade e entre 200 e 300
      de largura. Por fim, ultrapassado El Casuar, o rio abandona os calcários e alarga-se num vale
      assimétrico com uma várzea fértil até Montejo de la Vega.


      A génese do desfiladeiro lê-se na pedra. O rio talhou o calcário turoniano, alcançou as margas
      cenomanianas e escavou aí o seu leito, auxiliado por fraturas e processos cársticos. Num troço de 2,5
      quilómetros muda reiteradamente de rumo, desenhando quatro meandros encaixados de configuração muito
      semelhante. As escarpas, com as suas saliências e covas, constituem o sítio predileto das aves
      rupícolas.


      No topo, no planalto, impera a estepe, com manchas de sabina-da-praia, azinheira e carvalho-cerquinho
      adaptadas à rudeza continental. Manda a sabina, ao passo que a azinheira, acima dos 900 metros sobre
      solos calcários, se fica pelo porte arbustivo. No fundo do vale, o rio irriga uma mata ripícola de
      choupos-negros, salgueiros, choupos-brancos, amieiros e freixos.
    wildlife: >-
      As aves são a verdadeira alma do parque. Encontram-se catalogadas mais de 20 espécies do Anexo 1 da
      Diretiva Aves, sobressaindo o abutre-do-egito, o andorinhão-das-rochas, a
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/) e o [bufo-real](/especie/bubo_bubo/). As
      escarpas com maior concentração de rapinas são o cerro del Portillo, a peña de la Zorra e La
      Murcielaguera, que alberga também uma importante colónia de morcegos-rato.


      O ciclo anual do abutre principia no inverno. Em novembro e dezembro observam-se casais a voar
      emparelhados em corte nupcial. A partir de dezembro transportam galhos para as cornijas, e cada casal
      põe apenas um ovo por ano, concentrando todo o sucesso reprodutor numa única cria. Por essa razão, a
      circulação no parque é estritamente condicionada durante a época de reprodução.


      Fora das arribas, a fauna renova-se conforme o terreno. No planalto proliferam o
      noitibó-de-nuca-vermelha, o esmerilhão, a calhandra-de-dupont e o chasco-ruivo. Nos bosques de
      azinheiras, sabinas e pinheiros habitam o açor, a coruja-do-mato e a
      [águia-real](/especie/aquila_chrysaetos/). No rio e na albufeira de Linares del Arroyo, principal
      estância de invernada de aves aquáticas da província, reúnem-se patos-reais, zarros-comuns,
      mergulhões-de-crista e garças-reais. Entre os mamíferos marcam presença a
      [lontra-europeia](/especie/lutra_lutra/), o corço, o texugo, a [gineta](/especie/genetta_genetta/), a
      fuinha e o gato-bravo.
    visit: >-
      Começa pela Casa del Parque em Montejo de la Vega. Ali esclarecem os trilhos e os locais de interesse
      das redondezas, e a exposição ajuda a compreender o sítio antes da caminhada: painéis sobre a formação
      do desfiladeiro e os povoadores do rio, das fragas e dos bosques, modelos em tamanho real de
      abutre-fouveiro, abutre-do-egito, águia-real, bufo-real e falcão-peregrino, e uma câmara em direto
      apontada a um ninho de abutre.


      Depois, explora a pé. A Senda entre Puentes é um circuito acessível de 6 km com partida e termo em
      Montejo de la Vega, praticável todo o ano; contorna a escarpa de Peña Portillo, excelente para observar
      o abutre-fouveiro, e passa por exemplares de sabina e pinheiro-larício. Outro percurso arranca da
      própria Casa del Parque, transpõe o Riaza por um passadiço de madeira e alcança a escarpa de Las Torres.
      Se preferires caminhar entre tradições pastoris e sabinas, o circuito da Senda de las Tenadas de
      Valdevacas tem 4,5 km, demorando 1 hora e 18 minutos com 100 metros de desnível; as tenadas são currais
      de pedra erguidos pelos pastores para abrigar o gado ovino.


      A Senda del Río é a mais extensa: 11,5 km lineares, de exigência média, desde Montejo de la Vega até à
      barragem de Linares del Arroyo. Segue a garganta entre azinheiras e sabinais abertos ao lado dos
      habitats da lontra, com um painel informativo a detalhar a formação geológica antes da descida ao vale.
    history: >-
      Desde 18 de janeiro de 2005 que o território está classificado como parque natural. A herança humana
      pontua a paisagem: a ermida de Casuar, templo românico do século XII na várzea do Riaza, é Bem de
      Interesse Cultural desde 1997. Da aldeia de Linares del Arroyo, submersa pela albufeira, subsistem
      ruínas de uma igreja românica que afloram conforme o nível das águas; na Casa del Parque, os antigos
      moradores relatam num vídeo a construção da barragem. Fora do parque, Maderuelo constitui Conjunto
      Histórico e Bem de Interesse Cultural desde 1993, com muralhas, torreões e igrejas românicas.
    before: >-
      A Senda del Río cruza a zona de reserva e entre 1 de janeiro e 31 de julho exige autorização prévia, com
      grupos limitados a 10 pessoas no máximo. A licença solicita-se na Casa del Parque de Montejo de la Vega,
      que também tutela outras zonas na fase de nidificação. Na Senda de las Tenadas a rede móvel é limitada.
      A primavera e o outono são os períodos mais favoráveis, sendo o parque muito mais calmo do que as
      gargantas do Duratón.
    around: >-
      A cerca de 26 km fica o [Parque Natural Hoces del Río
      Duratón](/lugar/parque-natural-hoces-del-rio-duraton/), o outro grande desfiladeiro calcário de Segóvia,
      com maior afluência. Mais longe, as [Gorges de la Jonte](/lugar/gorges-de-la-jonte/) partilham com o
      Riaza o relevo cárstico e as grandes rapinas, com abutre-do-egito e abutre-fouveiro.
