    Limestone gorge hosting the historic Montejo de la Vega Raptor Refuge founded by Félix Rodríguez de la
    Fuente in 1975.
  fr: >-
    Gorge calcaire abritant l'historique refuge de rapaces de Montejo de la Vega, fondé par Félix Rodríguez de
    la Fuente en 1975.
  de: >-
    Kalksteinschlucht mit dem historischen Greifvogel-Schutzgebiet von Montejo de la Vega, 1975 von Félix
    Rodríguez de la Fuente gegründet.
  it: >-
    Gola calcarea con lo storico Rifugio per Rapaci di Montejo de la Vega, fondato da Félix Rodríguez de la
    Fuente nel 1975.
  pt: >-
    Garganta calcária com o histórico Refúgio de Rapinas de Montejo de la Vega, fundado por Félix Rodríguez de
