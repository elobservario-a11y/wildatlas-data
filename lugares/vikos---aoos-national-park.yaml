resumen:
  es: >-
    El desfiladero de Vikos, acreditado por el Libro Guinness como el más profundo del mundo en relación a su
    anchura (casi 1.000 m de caída libre).
  en: >-
    The Vikos Gorge, recorded by the Guinness Book of Records as the world’s deepest gorge relative to its
    width (almost 1,000 m of sheer drop).
  fr: >-
    Les gorges de Vikos, inscrites au Livre Guinness des records comme les plus profondes du monde par rapport
    à leur largeur (près de 1 000 m de paroi verticale).
  de: >-
    Die Vikos-Schlucht, vom Guinness-Buch als tiefste Schlucht der Erde im Verhältnis zu ihrer Breite gewertet
    (fast 1.000 m senkrechter Abbruch).
  it: >-
    La gola di Vikos, certificata dal Guinness dei primati come la più profonda del mondo in proporzione alla
    larghezza (quasi 1.000 m di salto verticale).
  pt: >-
    O desfiladeiro de Vikos, reconhecido pelo Livro Guinness dos Recordes como o mais profundo do mundo em
    relação à largura (quase 1.000 m de queda vertical).
unico:
  es: >-
    Dos gargantas profundas y una montaña entre ellas, donde el oso pardo encuentra uno de los últimos
    bastiones europeos.
  en: >-
    Two monumental gorges with a jagged mountain massif between them, where the brown bear maintains one of
    its southern European bastions.
  fr: >-
    Deux gorges monumentales séparées par un massif montagneux où l’ours brun conserve l’un de ses derniers
    bastions méridionaux en Europe.
  de: >-
    Zwei monumentale Felsschluchten und ein gewaltiges Bergmassiv dazwischen, in dem der Braunbär eine seiner
    letzten südeuropäischen Bastionen findet.
  it: >-
    Due gole vertiginose separate da un massiccio montuoso, dove l’orso bruno mantiene uno dei suoi ultimi
    bastioni nell’Europa meridionale.
  pt: >-
    Duas gargantas monumentais e um maciço montanhoso entre elas, onde o urso-pardo conserva um dos seus
    últimos redutos no sul da Europa.
observaciones:
  es: >-
    La entrada al bosque se permite solo por las carreteras existentes, y la estancia se limita de sol a sol.
    Por el riesgo de los arroyos y acantilados, se pide permanecer en las áreas recreativas y los senderos
    señalados. Los menores de 14 años deben ir acompañados.


    En el núcleo del parque está prohibido acampar de cualquier forma, y en los arroyos del núcleo no se puede
    pescar ni bañarse.
texto:
  es:
    intro: >-
      Imagina asomarte a un borde y mirar hacia abajo 900 metros, con la pared opuesta a solo 1.100 de
      distancia. En ese punto, la garganta de Vikos alcanza su máxima hondura, y el Libro Guinness la recoge
      como el cañón más profundo del mundo en proporción a su anchura, aunque se discute. El Parque Nacional
      Vikos-Aoös, en el Epiro, al norte de Ioánina, protege esa garganta y la del río Aoös, y entre las dos,
      la montaña de Tymphe: 12.600 hectáreas de ríos, lagos, cuevas y cañones, con un núcleo de 3.400
      hectáreas, la garganta, que el Voidomatis excavó durante millones de años.
    landscape: >-
      La garganta de Vikos tiene unos 12 kilómetros en el núcleo del parque, y se lee como un corte en la
      montaña. Los primeros 200 metros de pared son caliza del Eoceno, relativamente joven; en el fondo domina
      la dolomía gris del Jurásico. El Voidomatis, que la recorre, es sobre todo estacional: solo lleva agua
      todo el año en la parte baja. La caliza se disuelve con el agua y deja un drenaje subterráneo con cuevas
      y canales; por eso hay poca agua en la superficie. El parque tiene cinco cuevas, la mayoría verticales,
      y la sima Provatina alcanza 407 metros de profundidad.


      La garganta del Aoös, de 10 kilómetros, pasa entre Trapezitsa, Tymphe y Raidovouni, y tiene puentes de
      piedra de un solo arco de los siglos XVII a XIX y monasterios. Entre las dos gargantas se alza Tymphe,
      con cumbres como Gamila (2.497 m), Astraka (2.436 m), Ploskos (2.400 m) y Lapatos (2.251 m). A 2.000
      metros está Drakolimni, el «lago del Dragón», el mayor del parque, formado al retirarse los glaciares.
      Los tritones alpinos que viven en los lagos de Tymphe, sobre todo en Drakolimni, están ligados a
      leyendas de dragones.
    wildlife: >-
      A comienzos de la primavera, bosques, arroyos, prados alpinos y roquedos se llenan de flores. El parque
      tiene más de mil setecientas especies y subespecies de plantas, entre ellas cinco endémicas y diecinueve
      endémicas de Grecia. En el valle, el plátano oriental forma un bosque de galería a orillas del
      Voidomatis; en las colinas altas domina el enebro Juniperus foetidissima, con árboles de más de 10 m.
      Durante siglos, curanderos conocidos como «médicos de Vikos» recogieron muchas de sus hierbas como
      medicina; en Koukouli, el museo de historia natural expone una colección de 2.500 plantas y hierbas
      locales secas.


      Entre los animales, el [oso pardo](/especie/ursus_arctos/) es el rey: el Pindo es el punto más
      meridional del hábitat europeo del oso y el [lince](/especie/lynx_lynx/). También hay
      [jabalí](/especie/sus_scrofa/), [corzo](/especie/capreolus_capreolus/), [lobo](/especie/canis_lupus/),
      [nutria](/especie/lutra_lutra/) y [rebeco](/especie/rupicapra_rupicapra/), que vive a gran altura, lejos
      de la gente, en los acantilados de las gargantas, por ejemplo en Megas Lakos, un barranco secundario de
      Vikos.


      Mira también hacia arriba. Hay quince especies de rapaces y aves de distribución limitada en Grecia,
      como el grévol y el [treparriscos](/especie/tichodroma_muraria/). El [buitre
      leonado](/especie/gyps_fulvus/), el [alimoche](/especie/neophron_percnopterus/) y el [halcón
      peregrino](/especie/falco_peregrinus/) buscan comida en una zona amplia. La [víbora de
      Orsini](/especie/vipera_ursinii/) vive en los prados subalpinos y se considera amenazada.
    visit: >-
      Cruzar la garganta de Vikos dura de seis a siete horas y se considera de dificultad media; también se
      camina por las cumbres de Tymphe. El pueblo de Vikos es uno de los puntos de inicio del sendero por la
      garganta, y se encuentra sobre los manantiales del Voidomatis, con vistas a la garganta. Los miradores
      de Oxya y Beloe, y el monasterio de San Paraskevi, del siglo XV, tienen vistas de la garganta y solo se
      alcanzan a pie.


      Dentro del parque hay cuatro pueblos, y otros nueve cerca de los límites. Los puentes de piedra del
      Zagori fueron la única conexión con el exterior hasta que se hicieron carreteras en los años cincuenta;
      dieciséis de ellos están protegidos como monumentos.
    history: >-
      Del siglo XVII al XIX, el Zagori tuvo estatus autónomo bajo el dominio otomano, y sus vecinos quedaron
      libres de los impuestos fuertes que pagaban las tierras bajas.


      El parque nacional se creó en 1973 para proteger la fauna entre las gargantas de Vikos y Aoos y el monte
      Tymfi. En el núcleo, la ley prohíbe la actividad forestal, el pastoreo, la caza y la pesca. Dentro del
      Parque Nacional del Pindo Septentrional, la garganta de Vikos y la del Aoös son, junto al bosque de
      Valia Calda, tres núcleos de máxima protección, donde el objetivo es mantener el estado natural y dejar
      que evolucione sin intervención humana. Entre los peligros para el parque están la erosión, los
      corrimientos de tierra, los incendios y el efecto del turismo de las últimas décadas.
    before: >-
      La entrada al bosque se permite solo por las carreteras existentes, y la estancia se limita de sol a
      sol. Por el riesgo de los arroyos y acantilados, se pide permanecer en las áreas recreativas y los
      senderos señalados. Los menores de 14 años deben ir acompañados.


      En el núcleo del parque está prohibido acampar de cualquier forma, y en los arroyos del núcleo no se
      puede pescar ni bañarse.
    around: >-
      No hay vecinos cercanos en el atlas. El [Specijalni rezervat prirode Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/), lejos de aquí, comparte el alimoche y el
      rebeco, con karst y alta montaña.
  en:
    intro: >-
      Imagine standing on an abyss rim peering 900 metres straight down, with the facing rock wall barely
      1,100 metres away. At this dramatic point, the Vikos Gorge plunges to its maximum depth, recorded in the
      Guinness Book of Records as the deepest gorge in the world relative to its width, though local
      geographers continue to debate the measure. The Vikos-Aoös National Park in Epirus, north of Ioannina,
      protects this chasm alongside the rugged canyon of the Aoös River and, sandwiched between them, the
      formidable Mount Tymphe: 12,600 hectares of raging torrents, alpine tarns, caves, and gorges, enclosing
      a strictly protected core of 3,400 hectares carved out by the Voidomatis over millions of years.
    landscape: >-
      The Vikos Gorge extends for some 12 kilometres through the park's core, cutting a dramatic slice into
      the limestone massif. The upper 200 metres of the cliff face consist of relatively young Eocene
      limestone, while the gorge floor is dominated by grey Jurassic dolomite. The Voidomatis River, which
      flows along the chasm bottom, is largely seasonal, carrying permanent water year-round only in its lower
      reaches. Rainwater swiftly dissolves the porous karst rock, feeding a subterranean drainage network of
      labyrinthine caves and conduits; consequently, surface water remains scarce. The park harbours five
      major vertical shafts, with the Provatina chasm descending to an impressive 407 metres in depth.


      The Aoös Gorge, running for 10 kilometres, cuts between Mount Trapezitsa, Mount Tymphe, and Raidovouni,
      graced by historic single-arch stone bridges built between the seventeenth and nineteenth centuries and
      isolated cliffside monasteries. Between the two gorges towers the Tymphe massif, crowned by peaks such
      as Gamila (2,497 m), Astraka (2,436 m), Ploskos (2,400 m), and Lapatos (2,251 m). At 2,000 metres lies
      Drakolimni, the renowned "Dragon Lake" and largest alpine tarn in the park, hollowed out by retreating
      glaciers. The alpine newts inhabiting Tymphe's lakes, especially Drakolimni, are deeply woven into
      mountain legends of fire-breathing dragons.
    wildlife: >-
      In early spring, woodlands, glacial streams, alpine meadows, and cliffs burst into vibrant bloom. The
      park preserves more than seventeen hundred plant species and subspecies, including five local endemics
      and nineteen Greek endemics. In the river valleys, oriental planes form dense gallery forests along the
      banks of the Voidomatis; higher slopes are dominated by Grecian juniper (Juniperus foetidissima), with
      ancient trees exceeding 10 m in height. For centuries, herbal healers known as "Vikos doctors" harvested
      these mountain slopes for therapeutic herbs; in Koukouli, a natural history museum displays an
      extraordinary herbarium of 2,500 dried local medicinal plants.


      Among wildlife, the [brown bear](/especie/ursus_arctos/) reigns supreme: the Pindus range marks the
      southernmost outpost in Europe for both the brown bear and the [Eurasian lynx](/especie/lynx_lynx/). The
      woodlands also shelter [wild boar](/especie/sus_scrofa/), [roe deer](/especie/capreolus_capreolus/),
      [wolf](/especie/canis_lupus/), [Eurasian otter](/especie/lutra_lutra/), and the agile Balkan
      [chamois](/especie/rupicapra_rupicapra/), which grazes remote ledges far from human paths in side
      canyons like Megas Lakos.


      Look up toward the cliffs. Fifteen raptor species hunt here alongside localized cliff birds such as the
      hazel grouse and the elusive [wallcreeper](/especie/tichodroma_muraria/). The [griffon
      vulture](/especie/gyps_fulvus/), [Egyptian vulture](/especie/neophron_percnopterus/), and [peregrine
      falcon](/especie/falco_peregrinus/) patrol extensive foraging territories across the ravines. The rare
      [meadow viper](/especie/vipera_ursinii/) inhabits subalpine screes and is regarded as highly endangered.
    visit: >-
      Trekking through the Vikos Gorge takes six to seven hours and is rated of medium difficulty; you can
      also ascend the high trails crossing the summits of Tymphe. The village of Vikos serves as a primary
      trailhead for the canyon trek, perched directly above the Voidomatis springs with commanding views down
      the gorge. The scenic viewpoints of Oxya and Beloe, as well as the fifteenth-century Monastery of Agia
      Paraskevi, provide breathtaking panoramic vistas of the abyss and are reached only on foot.


      Four traditional stone villages lie inside the park boundaries, with another nine nestled near its
      perimeter. Zagori's arched stone bridges provided the sole access to the outside world until modern
      roads were constructed in the fifties; sixteen of these bridges enjoy formal protection as historical
      monuments.
    history: >-
      From the seventeenth to the nineteenth centuries, Zagori enjoyed broad autonomous privileges under
      Ottoman rule, exempting its inhabitants from the crushing taxes imposed across the lowlands.


      The national park was established in 1973 to safeguard wildlife between the Vikos and Aoös gorges and
      Mount Tymphe. Within the core zone, statutory regulations prohibit all forestry, livestock grazing,
      hunting, and fishing. Under the broader Northern Pindos National Park, the Vikos Gorge and Aoös Gorge
      constitute, alongside the Valia Calda forest, three core reserves of maximum legal protection where
      natural processes evolve free of human interference. Modern pressures include slope erosion, landslides,
      forest wildfires, and the impact of expanding tourism over recent decades.
    before: >-
      Entry into the forest is permitted solely along designated roadways, and your stay is restricted to
      daylight hours between sunrise and sunset. Given the sheer drop-offs and swift currents, you are urged
      to remain strictly on designated trails and recreational areas. Children under 14 years of age must be
      accompanied by adults at all times.


      All forms of wild camping are prohibited within the park core, and swimming or fishing in the streams of
      the core zone is strictly forbidden.
    around: >-
      There are no immediate neighbours in this atlas. Further away, the [Specijalni rezervat prirode Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/) shares the Egyptian vulture, chamois, rugged
      karst terrain, and high mountain wilderness.
  fr:
    intro: >-
      Imaginez-vous au bord du vide contemplant un gouffre de 900 mètres de profondeur, avec la paroi d'en
      face distante de seulement 1 100 mètres. C'est là que la gorge de Vikos atteint son abîme maximal,
      répertoriée par le Livre Guinness des records comme le canyon le plus profond du monde
      proportionnellement à sa largeur, bien que la mesure fasse débat. Le parc national de Vikos-Aoös, en
      Épire, au nord d'Ioannina, protège cette entaille gigantesque et celle de l'Aoös, séparées par le mont
      Tymphe : 12 600 hectares de torrents, de lacs d'altitude, de grottes et de falaises, avec un cœur de 3
      400 hectares creusé patiemment par le Voidomatis au fil des millénaires.
    landscape: >-
      La gorge de Vikos s'étire sur environ 12 kilomètres dans le cœur du parc, entaillant la montagne comme
      un coup de sabre. Les 200 premiers mètres de paroi sont en calcaire de l'Éocène, relativement récent ;
      au fond affleure la dolomie grise du Jurassique. Le Voidomatis, qui serpente au creux du défilé, est
      essentiellement saisonnier : il ne coule en continu toute l'année que dans sa partie aval. Le calcaire
      se dissout sous l'eau et crée un drainage souterrain fait de cavités et de gouffres ; c'est pourquoi
      l'eau de surface est si rare. Le parc abrite cinq gouffres verticaux majeurs, le gouffre de Provatina
      atteignant 407 mètres de profondeur.


      La gorge de l'Aoös, longue de 10 kilomètres, se fraye un passage entre le Trapezitsa, le Tymphe et le
      Raidovouni, jalonnée de ponts de pierre à arche unique bâtis du XVIIe au XIXe siècle et de monastères
      suspendus. Entre les deux défilés s'élève le massif du Tymphe, avec des sommets comme la Gamila (2 497
      m), l'Astraka (2 436 m), le Ploskos (2 400 m) et le Lapatos (2 251 m). À 2 000 mètres d'altitude repose
      Drakolimni, le « lac du Dragon », le plus vaste du parc, né du retrait des glaciers. Les tritons
      alpestres qui peuplent les lacs du Tymphe, notamment Drakolimni, sont au cœur des légendes locales de
      dragons.
    wildlife: >-
      Au début du printemps, forêts, torrents, prairies alpines et falaises se couvrent d'une profusion
      florale. Le parc abrite plus de mille sept cents espèces et sous-espèces de plantes, dont cinq
      endémiques locales et dix-neuf endémiques de Grèce. Dans la vallée, le platane d'Orient forme une
      ripisylve majestueuse au bord du Voidomatis ; sur les hauteurs domine le genévrier fétide (Juniperus
      foetidissima), avec des arbres dépassant 10 m de haut. Durant des siècles, des herboristes appelés «
      médecins de Vikos » ont récolté ces simples à des fins médicinales ; à Koukouli, un musée d'histoire
      naturelle expose un herbier de 2 500 plantes locales séchées.


      Chez les mammifères, l'[ours brun](/especie/ursus_arctos/) est le seigneur des lieux : le Pinde
      représente la limite méridionale européenne de l'ours et du [lynx boréal](/especie/lynx_lynx/). On y
      rencontre également le [sanglier](/especie/sus_scrofa/), le [chevreuil](/especie/capreolus_capreolus/),
      le [loup](/especie/canis_lupus/), la [loutre d'Europe](/especie/lutra_lutra/) et le
      [chamois](/especie/rupicapra_rupicapra/), qui s'abrite en altitude loin des hommes dans les ravins comme
      le Megas Lakos.


      Levez aussi les yeux vers le ciel. Quinze espèces de rapaces y chassent, aux côtés d'oiseaux montagnards
      tels que la gélinotte et le [tichodrome échelette](/especie/tichodroma_muraria/). Le [vautour
      fauve](/especie/gyps_fulvus/), le [percnoptère](/especie/neophron_percnopterus/) et le [faucon
      pèlerin](/especie/falco_peregrinus/) parcourent de vastes territoires. La rare [vipère
      d'Orsini](/especie/vipera_ursinii/) vit dans les pelouses subalpines et figure parmi les espèces les
      plus vulnérables.
    visit: >-
      La traversée de la gorge de Vikos demande de six à sept heures de marche et relève d'un niveau moyen ;
      il est aussi possible de randonner sur les crêtes du Tymphe. Le village de Vikos constitue l'un des
      points de départ du sentier de fond de gorge, perché au-dessus des résurgences du Voidomatis. Les
      belvédères d'Oxya et de Beloe, ainsi que le monastère d'Agia Paraskevi fondé au XVe siècle, offrent des
      panoramas vertigineux sur le gouffre et ne sont accessibles qu'à pied.


      Le parc compte quatre villages en son sein et neuf autres en périphérie immédiate. Les ponts de pierre
      voûtés du Zagori formaient l'unique liaison avec l'extérieur avant l'ouverture des routes dans les
      années cinquante ; seize d'entre eux sont classés monuments historiques.
    history: >-
      Du XVIIe au XIXe siècle, la région du Zagori a bénéficié d'un statut d'autonomie remarquable sous
      domination ottomane, exemptant ses habitants des lourdes taxes pesant sur les plaines.


      Le parc national a été créé en 1973 afin de sauvegarder la faune entre les gorges de Vikos et de l'Aoös
      et le mont Tymphe. Dans le cœur du parc, la loi interdit l'exploitation forestière, le pâturage, la
      chasse et la pêche. Au sein du vaste parc national du Pinde septentrional, les gorges de Vikos et de
      l'Aoös forment, avec la forêt de Valia Calda, trois zones de protection intégrale vouées à l'évolution
      naturelle spontanée. Parmi les périls actuels figurent l'érosion des pentes, les glissements de terrain,
      les incendies et la pression touristique récente.
    before: >-
      L'accès aux espaces boisés n'est autorisé que par les voies carrossables existantes, du lever au coucher
      du soleil. En raison du danger des falaises et des crues, il est demandé de rester sur les sentiers
      balisés et les aires aménagées. Les mineurs de moins de 14 ans doivent impérativement être accompagnés.


      Toute forme de camping sauvage est strictement interdite dans le cœur du parc, de même que la baignade
      et la pêche dans les torrents de la zone centrale.
    around: >-
      Le parc n'a pas de voisins immédiats dans l'atlas. Plus loin, la [Specijalni rezervat prirode Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/) partage le percnoptère, le chamois, les
      parois karstiques et la haute montagne.
  de:
    intro: >-
      Stell dir vor, du trittst an eine Felskante und blickst 900 Meter senkrecht in die Tiefe, während die
      gegenüberliegende Steilwand gerade einmal 1.100 Meter entfernt aufragt. An dieser Stelle erreicht die
      Vikos-Schlucht ihre größte Tiefe und wird im Guinness-Buch der Rekorde als tiefster Canyon der Welt im
      Verhältnis zu seiner Breite geführt, wenngleich Geographen die Messmethodik diskutieren. Der
      Vikos-Aoös-Nationalpark im Epirus, nördlich von Ioannina, schützt diesen gigantischen Einschnitt sowie
      die Schlucht des Aoös und das dazwischen aufragende Tymphe-Massiv: 12.600 Hektar Flüsse, Bergseen,
      Höhlen und Felswände mit einer 3.400 Hektar großen Kernzone, die der Voidomatis über Jahrmillionen ins
      Gestein sägte.
    landscape: >-
      Die Vikos-Schlucht zieht sich über rund 12 Kilometer durch die Kernzone des Parks und wirkt wie ein
      gewaltiger Schnitt durch den Gebirgsstock. Die oberen 200 Meter der Felswand bestehen aus
      vergleichsweise jungem Eozän-Kalkstein; am Grund dominiert grauer Jura-Dolomit. Der Voidomatis, der die
      Schlucht durchfließt, führt weitgehend periodisch Wasser: Nur im unteren Abschnitt strömt er ganzjährig.
      Das Karstgestein löst sich im Niederschlagswasser auf und lässt ein unterirdisches Höhlensystem
      entstehen, weshalb oberflächlich kaum Wasser fließt. Fünf vertikale Schacht-Höhlen sind bekannt; der
      Provatina-Schacht stürzt 407 Meter tief in den Berg hinab.


      Die Aoös-Schlucht windet sich über 10 Kilometer zwischen Trapezitsa, Tymphe und Raidovouni hindurch,
      geschmückt von einbogigen Steinbrücken des siebzehnten bis neunzehnten Jahrhunderts und Klöstern.
      Zwischen beiden Schluchten ragt das Tymphe-Massiv auf, gekrönt von Gipfeln wie Gamila (2.497 m), Astraka
      (2.436 m), Ploskos (2.400 m) und Lapatos (2.251 m). Auf 2.000 Metern Höhe liegt der Drakolimni, der
      sagenhafte „Drachensee“ und größte Hochgebirgssee des Parks, ein Relikt eiszeitlicher Gletscher. Die
      Alpentolche in den Gewässern des Tymphe sind Gegenstand uralter Drachensagen.
    wildlife: >-
      Im Frühjahr verwandeln sich Bergwälder, Bäche, Hochweiden und Felswände in ein buntes Blütenmeer. Über
      siebzehnhundert Pflanzenarten und -unterarten wachsen im Park, darunter fünf lokale und neunzehn
      griechische Endemiten. Im Flusstal bilden Morgenländische Platanen dichte Auwälder am Ufer des
      Voidomatis; auf den Höhen dominiert der Stinkende Wacholder (Juniperus foetidissima) mit über 10 m hohen
      Baumgestalten. Über Jahrhunderte sammelten Heilkundige, die legendären „Vikos-Ärzte“, hier Heilkräuter;
      in Koukouli zeigt ein Naturkundemuseum eine Sammlung von 2.500 getrockneten einheimischen Pflanzen.


      Unter den Säugetieren ist der [Braunbär](/especie/ursus_arctos/) das Wappentier: Das Pindos-Gebirge
      bildet den südlichsten Vorposten des europäischen Verbreitungsgebiets von Bär und [Eurasischem
      Luchs](/especie/lynx_lynx/). Hinzu kommen [Wildschwein](/especie/sus_scrofa/),
      [Reh](/especie/capreolus_capreolus/), [Wolf](/especie/canis_lupus/), [Fischotter](/especie/lutra_lutra/)
      und die scheue [Gämse](/especie/rupicapra_rupicapra/), die hoch oben in unzugänglichen Seitenschluchten
      wie Megas Lakos lebt.


      Blicke auch nach oben: Fünfzehn Greifvogelarten und montane Felsvögel wie Haselhuhn und
      [Mauerläufer](/especie/tichodroma_muraria/) leben an den Wänden. [Gänsegeier](/especie/gyps_fulvus/),
      [Schmutzgeier](/especie/neophron_percnopterus/) und [Wanderfalke](/especie/falco_peregrinus/) streifen
      auf Nahrungssuche weit umher. Die seltene [Wiesenotter](/especie/vipera_ursinii/) besiedelt subalpine
      Rasen und gilt als stark bedroht.
    visit: >-
      Die Durchquerung der Vikos-Schlucht dauert sechs bis sieben Stunden und gilt als mittelschwer; lohnend
      sind auch Touren auf die Gipfel des Tymphe. Das Bergdorf Vikos liegt direkt über den Quellen des
      Voidomatis und ist ein beliebter Ausgangspunkt für die Schluchtwanderung. Die Aussichtspunkte Oxya und
      Beloe sowie das im fünfzehnten Jahrhundert erbaute Kloster Agia Paraskevi bieten Schwindel erregende
      Tiefblicke und sind nur zu Fuß erreichbar.


      Vier historische Dörfer liegen im Park, neun weitere an seinen Rändern. Die bogenförmigen
      Natursteinbrücken von Zagori waren bis zum Straßenbau in den fünfziger Jahren die einzige Verbindung zur
      Außenwelt; sechzehn von ihnen stehen unter Denkmalschutz.
    history: >-
      Vom siebzehnten bis zum neunzehnten Jahrhundert genoss die Region Zagori weitreichende Autonomie unter
      osmanischer Herrschaft, was die Bewohner von den drückenden Abgaben der Ebenen befreite.


      Der Nationalpark wurde 1973 gegründet, um die Tierwelt zwischen den Schluchten Vikos und Aoös und dem
      Tymphe-Massiv zu schützen. In der Kernzone untersagt das Gesetz forstwirtschaftliche Nutzung, Weidegang,
      Jagd und Fischerei. Innerhalb des großflächigen Nördlichen Pindos-Nationalparks bilden die
      Vikos-Schlucht und das Aoös-Tal zusammen mit dem Waldgebiet Valia Calda drei Kernzonen strengsten
      Schutzes für ungestörte Naturprozesse. Gefahren drohen durch Hangabtrag, Erdrutsche, Waldbrände und den
      zunehmenden Tourismus der vergangenen Jahrzehnte.
    before: >-
      Der Zutritt zum Wald ist ausschließlich auf bestehenden Wegen von Sonnenaufgang bis Sonnenuntergang
      gestattet. Wegen der Absturzgefahr an Steilwänden und unberechenbaren Bachläufen wird dringend geraten,
      auf markierten Pfaden und Rastplätzen zu bleiben. Kinder unter 14 Jahren dürfen sich nur in Begleitung
      Erwachsener im Park aufhalten.


      In der Kernzone ist wildes Campen ausnahmslos verboten; das Angeln und Baden in den Gewässern der
      Kernzone ist untersagt.
    around: >-
      In diesem Atlas gibt es keine unmittelbaren Nachbarn. Weiter entfernt teilt das [Specijalni rezervat
      prirode Suva Planina](/lugar/specijalni-rezervat-prirode-suva-planina/) Schmutzgeier, Gämse, Karstwände
      und Hochgebirgslandschaften.
  it:
    intro: >-
      Immagina di affacciarti su una voragine e guardare verso il basso per 900 metri, con la parete opposta
      distante appena 1.100 metri. In quel punto la gola di Vikos tocca il suo massimo dislivello, registrata
      dal Guinness dei primati come il canyon più profondo del mondo in rapporto alla larghezza, sebbene il
      criterio susciti dibattiti. Il Parco Nazionale Vikos-Aoös, nell'Epiro a nord di Giannina, tutela questa
      profonda spaccatura e quella del fiume Aoös, racchiudendo tra le due la mole del monte Timfi: 12.600
      ettari di fiumi impetuosi, laghi d'alta quota, grotte e forre, con un nucleo primario di 3.400 ettari
      scavato dal Voidomatis nel corso di ere geologiche.
    landscape: >-
      La gola di Vikos misura circa 12 chilometri nel cuore del parco, aprendosi come una cicatrice nella
      montagna. I primi 200 metri di parete sono calcari dell'Eocene, relativamente giovani; sul fondo prevale
      la dolomia grigia del Giurassico. Il Voidomatis, che percorre il canyon, ha carattere essenzialmente
      stagionale: porta acqua perenne tutto l'anno solo nella parte terminale. Il calcare si scioglie a
      contatto con l'acqua piovana creando una circolazione sotterranea carsica ricca di condotti; per questo
      l'acqua scarseggia in superficie. Il parco racchiude cinque voragini verticali di rilievo, tra cui
      l'abisso di Provatina che sprofonda per 407 metri.


      La gola dell'Aoös, estesa per 10 chilometri, serpeggia tra Trapezitsa, Timfi e Raidovouni, punteggiata
      da ponti in pietra a campata unica costruiti tra i secoli XVII e XIX e da monasteri arroccati. Tra i due
      canyon troneggia il massiccio del Timfi, con vette maestose quali Gamila (2.497 m), Astraka (2.436 m),
      Ploskos (2.400 m) e Lapatos (2.251 m). A quota 2.000 metri si annida Drakolimni, il «lago del Drago», il
      maggiore del parco, scavato dai ghiacciai in ritiro. I tritoni alpini che popolano i laghetti del Timfi
      sono al centro di leggende montane su antichi draghi.
    wildlife: >-
      A inizio primavera boschi, torrenti, pascoli d'alta quota e pareti rocciose si vestono di una fioritura
      spettacolare. Il parco vanta più di mille settecento specie e sottospecie di piante, tra cui cinque
      endemismi locali e diciannove endemismi ellenici. Nel fondovalle il platano orientale forma gallerie
      ombrose lungo le sponde del Voidomatis; sui colli elevati prevale il ginepro fetido (Juniperus
      foetidissima) con esemplari alti oltre 10 m. Per secoli guaritori popolari noti come «medici di Vikos»
      raccolsero qui erbe officinali; a Koukouli un museo di storia naturale custodisce un erbario di 2.500
      piante locali essiccate.


      Tra i mammiferi regna l'[orso bruno](/especie/ursus_arctos/): la catena del Pindo rappresenta il limite
      meridionale dell'areale europeo dell'orso e della [lince boreale](/especie/lynx_lynx/). Si avvistano
      inoltre [cinghiale](/especie/sus_scrofa/), [capriolo](/especie/capreolus_capreolus/), [lupo
      grigio](/especie/canis_lupus/), [lontra europea](/especie/lutra_lutra/) e il [camoscio
      alpino](/especie/rupicapra_rupicapra/), che vive in quota lontano dalla presenza umana, lungo pareti
      inaccessibili come il vallone secondario di Megas Lakos.


      Alza lo sguardo alle pareti: quindici specie di rapaci solcano i cieli assieme a volatili montani come
      il francolino di monte e il [picchio muraiolo](/especie/tichodroma_muraria/). Il
      [grifone](/especie/gyps_fulvus/), il [capovaccaio](/especie/neophron_percnopterus/) e il [falco
      pellegrino](/especie/falco_peregrinus/) perlustrano ampi territori alla ricerca di cibo. La rara [vipera
      dell'Orsini](/especie/vipera_ursinii/) abita i ghiaioni subalpini ed è considerata vulnerabile.
    visit: >-
      La traversata della gola di Vikos richiede da sei a sette ore di cammino ed è di media difficoltà; si
      snodano anche magnifici percorsi sulle cime del Timfi. Il borgo di Vikos è uno dei punti di avvio
      dell'itinerario nel canyon, arroccato proprio sopra le sorgenti del Voidomatis. I belvedere panoramici
      di Oxya e Beloe e il monastero di Santa Parasceve, eretto nel XV secolo, offrono scorci vertiginosi
      sull'abisso e sono raggiungibili unicamente a piedi.


      All'interno del parco sorgono quattro borghi storici, e altri nove nelle immediate vicinanze. I ponti ad
      arco in pietra dello Zagori hanno costituito l'unico collegamento col mondo esterno fino alla
      realizzazione delle strade negli anni Cinquanta; sedici di essi sono tutelati come monumenti storici.
    history: >-
      Tra il XVII e il XIX secolo lo Zagori beneficiò di ampia autonomia sotto l'impero ottomano, esentando le
      comunità locali dai pesanti tributi imposti nelle pianure.


      Il parco nazionale venne istituito nel 1973 per salvaguardare la fauna tra le gole di Vikos e dell'Aoös
      e il monte Timfi. Nella zona nucleare la legge vieta disboscamenti, pascolo, caccia e pesca. Nel più
      ampio Parco Nazionale del Pindo Settentrionale, le gole di Vikos e dell'Aoös formano assieme alla
      foresta di Valia Calda tre riserve integrali destinate all'evoluzione spontanea degli ecosistemi. Tra i
      pericoli ambientali figurano l'erosione, gli smottamenti, gli incendi e la pressione turistica degli
      ultimi decenni.
    before: >-
      L'accesso alle zone boschive è consentito esclusivamente lungo le strade esistenti, dall'alba al
      tramonto. Per la pericolosità delle pareti a strapiombo e delle piene improvvise, si raccomanda di
      rimanere sui tracciati segnalati e nelle aree di sosta. I minori di 14 anni devono essere sempre
      accompagnati da adulti.


      Nel cuore del parco è vietato qualsiasi tipo di campeggio libero, così come la pesca e la balneazione
      nei corsi d'acqua della zona centrale.
    around: >-
      Non vi sono riserve limitrofe nel nostro atlas. Più a nord, la [Specijalni rezervat prirode Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/) condivide capovaccaio, camoscio, forre
      carsiche e vette impervie.
  pt:
    intro: >-
      Imagina debruçares-te sobre um precipício e contemplares 900 metros de queda livre, com a escarpa oposta
      a escassos 1.100 metros de distância. Nesse ponto, o desfiladeiro de Vikos atinge a sua profundidade
      máxima, registada pelo Livro Guinness dos Recordes como a garganta mais funda do mundo em proporção à
      sua largura, não obstante o debate científico. O Parque Nacional de Vikos-Aoös, no Épiro a norte de
      Ioannina, protege esta fenda colossal e a do rio Aoös, intercaladas pela montanha de Timfi: 12.600
      hectares de torrentes alpinas, lagoas glaciares, cavernas e canhões, integrando uma zona nuclear de
      3.400 hectares escavada pacientemente pelo Voidomatis ao longo de milhões de anos.
    landscape: >-
      A garganta de Vikos estende-se por cerca de 12 quilómetros no coração do parque, abrindo-se como um
      rasgão monumental na montanha. Os primeiros 200 metros da parede rochosa são de calcário do Eoceno,
      geologicamente jovem; no fundo predomina o dolomito cinzento do Jurássico. O Voidomatis, que corre pelo
      fundo do abismo, tem caudal predominantemente estacional: só mantém fluxo perene durante todo o ano no
      troço inferior. O calcário dissolve-se na água pluvial, alimentando uma rede cárstica subterrânea de
      galerias e poços; por isso a água de superfície é tão escassa. O parque alberga cinco grandes algares
      verticais, com o abismo de Provatina a atingir 407 metros de profundidade.


      A garganta do Aoös, com 10 quilómetros, serpenteia entre Trapezitsa, Timfi e Raidovouni, ornamentada por
      pontes de pedra em arco único erguidas entre os séculos XVII e XIX e mosteiros empoleirados. Entre ambos
      os canhões ergue-se o maciço de Timfi, coroado por picos como Gamila (2.497 m), Astraka (2.436 m),
      Ploskos (2.400 m) e Lapatos (2.251 m). A 2.000 metros de altitude repousa Drakolimni, o mítico «lago do
      Dragão», a maior lagoa alpina do parque, originada pelo degelo glaciar. Os tritões-alpinos que povoam as
      águas de Timfi encontram-se intimamente ligados a lendas de dragões.
    wildlife: >-
      No início da primavera, matas, ribeiros, pastagens alpinas e fragas explodem numa profusão botânica. O
      parque alberga mais de mil e setecentas espécies e subespécies de plantas, incluindo cinco endemismos
      locais e dezanove endemismos gregos. No vale, o plátano-oriental forma galerias ripícolas frondosas nas
      margens do Voidomatis; nos planaltos elevados predomina o zimbro Juniperus foetidissima, com árvores que
      superam 10 m de altura. Durante séculos, curandeiros apelidados de «médicos de Vikos» colheram ervas
      medicinais nestas encostas; em Koukouli, um museu de história natural expõe um acervo de 2.500 plantas
      locais secas.


      Nos mamíferos, o [urso-pardo](/especie/ursus_arctos/) é a espécie rainha: a cordilheira do Pindo
      representa o limite meridional europeu para o urso e o [lince-euroasiático](/especie/lynx_lynx/).
      Ocorrem ainda o [javali](/especie/sus_scrofa/), a [corça](/especie/capreolus_capreolus/), o
      [lobo-cinzento](/especie/canis_lupus/), a [lontra-europeia](/especie/lutra_lutra/) e a
      [camurça](/especie/rupicapra_rupicapra/), que habita escarpas remotas fora do alcance humano em
      desfiladeiros secundários como Megas Lakos.


      Ergue também os olhos para o céu. Quinze espécies de rapinas caçam no território, a par de aves
      montícolas como a galinha-do-mato e a [trepadeira-dos-muros](/especie/tichodroma_muraria/). O
      [abutre-fouveiro](/especie/gyps_fulvus/), o [abutre-do-egito](/especie/neophron_percnopterus/) e o
      [falcão-peregrino](/especie/falco_peregrinus/) patrulham vastas áreas de busca. A esquiva
      [víbora-de-orsini](/especie/vipera_ursinii/) ocorre nos prados subalpinos e figura entre os répteis mais
      ameaçados.
    visit: >-
      Cruzar a garganta de Vikos demora seis a sete horas e apresenta dificuldade moderada; é igualmente
      possível caminhar pelos cumes escarpados de Timfi. A aldeia de Vikos constitui um ponto privilegiado de
      acesso ao fundo do canhão, situada mesmo acima das nascentes do Voidomatis. Os miradouros de Oxya e
      Beloe e o mosteiro de Santa Paraskevi, fundado no século XV, desfrutam de vistas panorâmicas sobre o
      abismo e só são acessíveis a pé.


      No interior do parque situam-se quatro aldeias tradicionais, e outras nove nas imediações dos seus
      limites. As pontes de pedra em arco de Zagori constituíram a única ligação com o exterior até à
      construção de estradas na década de cinquenta; dezasseis dessas pontes encontram-se protegidas como
      monumentos históricos.
    history: >-
      Entre os séculos XVII e XIX, a região de Zagori beneficiou de um estatuto autónomo sob o domínio
      otomano, livrando os habitantes dos tributos pesados que recaíam sobre as planícies.


      O parque nacional foi criado em 1973 para salvaguardar a fauna entre as gargantas de Vikos e do Aoös e o
      monte Timfi. No núcleo estrito, a legislação proíbe o corte florestal, o pastoreio, a caça e a pesca. No
      âmbito do Parque Nacional do Pindo Setentrional, as gargantas de Vikos e do Aoös formam, juntamente com
      o vale de Valia Calda, três núcleos de reserva integral destinados à evolução natural livre de
      intervenção humana. Entre os riscos ambientais contam-se a erosão dos solos, os aluimentos de terras, os
      fogos florestais e o impacto do turismo recente.
    before: >-
      A entrada no bosque é estritamente permitida apenas pelas estradas existentes, desde o nascer até ao pôr
      do sol. Devido ao perigo das arribas verticais e das correntes perigosas, solicita-se que permaneças nos
      trilhos balizados e nas áreas recreativas. Menores de 14 anos têm de ser obrigatoriamente acompanhados
      por adultos.


      No núcleo estrito é totalmente interdito qualquer tipo de campismo livre, sendo proibido pescar ou tomar
      banho nas linhas de água da zona central.
    around: >-
      Não existem áreas protegidas vizinhas neste atlas. Mais distante, a [Specijalni rezervat prirode Suva
      Planina](/lugar/specijalni-rezervat-prirode-suva-planina/) partilha o abutre-do-egito, a camurça, o
      relevo cárstico e a alta montanha.
