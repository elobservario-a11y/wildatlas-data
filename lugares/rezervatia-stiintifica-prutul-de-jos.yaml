resumen:
  es: >-
    La primera Reserva de la Biosfera de Moldavia alrededor del lago Beleu, lugar de descanso de pelícanos
    blancos.
  en: >-
    Moldova's first Biosphere Reserve centered around Lake Beleu, a vital staging post for great white
    pelicans.
  fr: La première réserve de biosphère de Moldavie autour du lac Beleu, halte privilégiée des pélicans blancs.
  de: Moldawiens erstes Biosphärenreservat rund um den Beleu-See, wichtiger Rastplatz für Rosapelikane.
  it: La prima riserva della biosfera della Moldavia attorno al lago Beleu, tappa vitale per i pellicani comuni.
  pt: A primeira Reserva da Biosfera da Moldávia em redor do lago Beleu, local de descanso de pelicanos-brancos.
unico:
  es: >-
    Un antiguo limán de agua dulce del Danubio convertido en un santuario de aves que anidan, descansan e
    invernan en una gran ruta migratoria.
  en: >-
    An ancient freshwater Danube liman transformed into a sanctuary for birds that nest, rest and winter along
    a major European flyway.
  fr: >-
    Un ancien liman d'eau douce du Danube mué en sanctuaire pour les oiseaux qui nichent, font halte et
    hivernent sur une grande voie de migration.
  de: >-
    Ein alter Süßwasserliman der Donau, verwandelt in ein Vogelschutzgebiet zum Brüten, Rasten und Überwintern
    an einer großen europäischen Zugroute.
  it: >-
    Un antico liman d'acqua dolce del Danubio divenuto santuario per uccelli che nidificano, sostano e
    svernano lungo una grande rotta migratoria.
  pt: >-
    Um antigo limane de água doce do Danúbio transformado em santuário para aves que nidificam, descansam e
    invernam numa grande rota migratória.
observaciones:
  es: >-
    El itinerario cruza llanura inundable: calzado impermeable en la época fría, repelente de mosquitos, agua
    potable, gafas y sombrero. En barca hay que seguir las indicaciones del guía. En época de inundaciones se
    opta por el recorrido acuático y el resto del año por el terrestre. La temporada ideal es la primavera y
    el otoño.
texto:
  es:
    intro: >-
      Cuando empieza abril, el cielo del sur de Moldavia se llena de aves que han volado miles de kilómetros
      para criar aquí. Lo hacen en la Reserva Científica del Bajo Prut, un rincón de Moldavia junto a la
      frontera rumana: un lago poco profundo, el Beleu, rodeado de carrizales, sauzales y praderas que se
      inundan con el río. Es la primera reserva de la biosfera de Moldavia.
    landscape: >-
      El lago Beleu es un vestigio de los limanes del Danubio, formados hace cinco o seis mil años por el
      avance del mar, y el aluvión del Prut lo ha ido colmatando. Mide unos 5 km de largo por 2 de ancho y es
      muy somero, de medio metro a metro y medio de profundidad media. Ocupa 628 ha, unos dos tercios de la
      reserva, y su nivel sube y baja con el del Danubio y el del Prut.


      Alrededor se extiende la llanura aluvial: carrizales y eneales, sauzales y una alfombra de plantas
      acuáticas, con espadañas, nenúfares y lenteja de agua. Los robledales solo ocupan las zonas más altas,
      las que rara vez se inundan. La reserva forma la entrada de la Reserva de la Biosfera del Delta del
      Danubio, que comparten Rumanía y Ucrania.
    wildlife: >-
      Las aves son las dueñas del lugar. Se han contado más de 220 especies, 47 de ellas en el Libro Rojo de
      Moldavia. En el agua se ven garcetas, cormoranes, gaviotas, ánades, gansos, cisnes, fochas, garzas y
      colonias de cientos o miles de [pelícanos comunes](/especie/pelecanus_onocrotalus/). Desde abril se ven
      de lejos numerosas especies llegadas desde miles de kilómetros para criar, y el sitio, en una gran ruta
      migratoria, sirve de zona de cría, de escala y de invernada.


      El corazón de la cría es Cioroiu, una zona intacta del lago donde anidan el cormorán pigmeo, la garcilla
      cangrejera y la garceta. Su nombre viene de los cormoranes que secan las alas al sol y que los
      antepasados confundían con cuervos. Allí está prohibido el acceso a las personas: las colonias mixtas
      necesitan calma.


      Bajo el agua, el lago alberga más de 27 especies de peces, entre ellas el salmón del Danubio, y nueve de
      anfibios, como el tritón crestado y el sapo verde. En los sauzales del canal Manolescu se citan la
      [nutria europea](/especie/lutra_lutra/), el gato montés, el [galápago
      europeo](/especie/emys_orbicularis/), el corzo, el jabalí y la rata almizclera. Y desde 2019 hay rastros
      de [castor europeo](/especie/castor_fiber/): en 2020 se confirmó su presencia con vídeos, unos 200 años
      después de desaparecer del país.
    visit: >-
      Hay dos maneras de llegar al lago, y cuál se hace depende del nivel del agua. El itinerario terrestre
      mide 3 km, ida y vuelta, y lleva unas dos horas. Empieza en una plataforma sobre la ladera, desde donde
      se ve el Beleu desde arriba, y sigue por la orilla; en la sede de la reserva crecen algunos nenúfares
      blancos.


      Cuando el nivel hidrológico lo permite, y para grupos pequeños de adultos, se hace en barca por el canal
      Manolescu, que nace en el Prut junto a Văleni y desagua en el lago en Chiscul Mare. También son 3 km. El
      agua clara deja ver a simple vista la lenteja de agua y la saeta de agua, y los visitantes disponen de
      prismáticos para recorrer el lago; los aficionados a la observación de aves son bienvenidos.
    history: >-
      La reserva se creó el 23 de abril de 1991 para proteger el ecosistema de laguna y llanura inundable y
      favorecer la reproducción de especies raras y amenazadas. El gestor la sitúa en el Convenio Ramsar, con
      el número 1029, y el 13 de noviembre de 2018 la UNESCO la inscribió como reserva de la biosfera.


      El agua turbia del canal Manolescu trae arena y arcilla que se depositan en el lago. Entre las plantas
      amenazadas figuran el nenúfar blanco, la salvinia flotante y la castaña de agua. En el pueblo de Văleni,
      la Casa Dorului, una casa campesina con museo, acoge fiestas y ferias de artesanos.
    before: >-
      El itinerario cruza llanura inundable: calzado impermeable en la época fría, repelente de mosquitos,
      agua potable, gafas y sombrero. En barca hay que seguir las indicaciones del guía. En época de
      inundaciones se opta por el recorrido acuático y el resto del año por el terrestre. La temporada ideal
      es la primavera y el otoño.
    around: >-
      La reserva está en el sur de Moldavia, pero se parece a otros humedales: el [Pequeño
      Balatón](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/), el [Parque Nacional de
      Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/) y la [Reserva Natural Especial Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/) comparten con ella garcetas, nutrias o galápagos
      europeos. Con Carska Bara, además, el pelícano común.
  en:
    intro: >-
      When April begins, the skies of southern Moldova fill with birds that have travelled thousands of
      kilometres to breed here. They arrive at the Lower Prut Scientific Reserve, a peaceful corner of Moldova
      hugging the Romanian border: a shallow lake, Lake Beleu, surrounded by reedbeds, willow groves and flood
      meadows inundated by the river. It stands as Moldova's very first biosphere reserve.
    landscape: >-
      Lake Beleu is a relic of the ancient Danube limans, formed five to six thousand years ago by marine
      transgression, gradually silted up by alluvial deposits from the Prut. It spans roughly 5 km in length
      by 2 km across and remains exceptionally shallow, with an average depth between half a metre and a metre
      and a half. Covering 628 ha, roughly two-thirds of the reserve, its water level rises and falls in
      tandem with the Danube and the Prut.


      All around stretches the floodplain: dense reeds, cat-tails, willow brakes and a floating carpet of
      aquatic vegetation featuring water lilies, water soldier and duckweed. Pedunculate oak woods only occupy
      the highest knolls that escape all but exceptional floods. The reserve forms the gateway to the Danube
      Delta Biosphere Reserve shared between Romania and Ukraine.
    wildlife: >-
      Birds rule this landscape. Over 220 species have been recorded, 47 of which are listed in the Red Data
      Book of Moldova. Out on the water you will spot egrets, cormorants, gulls, wild ducks, geese, swans,
      coots, herons and colonies numbering hundreds or thousands of [great white
      pelicans](/especie/pelecanus_onocrotalus/). From April onward, flock after flock arrives from thousands
      of kilometres away to nest; situated along a premier migratory corridor, the site provides nesting
      grounds, staging resting areas and winter refuge.


      The heart of breeding activity is Cioroiu, an undisturbed bay of the lake where pygmy cormorants,
      squacco herons and little egrets nest. Its name derives from cormorants drying their outspread wings in
      the sun, which locals once mistook for crows. Human access is strictly barred here: mixed waterbird
      colonies require total tranquility.


      Beneath the surface, the lake sustains over 27 fish species, including the Danube salmon, alongside nine
      amphibian species such as the crested newt and European green toad. Among the willows lining the
      Manolescu channel, naturalists record the [Eurasian otter](/especie/lutra_lutra/), wildcat, [European
      pond turtle](/especie/emys_orbicularis/), roe deer, wild boar and muskrat. Since 2019, feeding signs of
      the [Eurasian beaver](/especie/castor_fiber/) have appeared: in 2020 camera traps confirmed its return,
      some 200 years after its extirpation from Moldova.
    visit: >-
      There are two ways to explore the lake, chosen according to water levels. The walking trail covers 3 km
      out and back, taking about two hours. It begins on an elevated viewing platform on the hillside
      overlooking Beleu from above, then traces the shoreline; white water lilies bloom around the reserve
      headquarters.


      When water levels permit, small adult groups can take a boat excursion along the Manolescu channel,
      which branches from the Prut near Văleni and flows into the lake at Chiscul Mare. This also covers 3 km.
      The transparent water allows views of submerged hornwort and water arrowhead, and visitors are provided
      with binoculars to scan the open water; birdwatchers are especially welcome.
    history: >-
      The reserve was established on 23 April 1991 to safeguard the floodplain lake ecosystem and support
      reproduction of rare and endangered wildlife. It was designated a Ramsar Wetland of International
      Importance under site number 1029, and on 13 November 2018 UNESCO officially inscribed it as a Biosphere
      Reserve.


      Turbid flows entering through the Manolescu canal deposit sand and clay into the lake basin. Rare flora
      includes white water lily, floating watermoss and water chestnut. In nearby Văleni, the Casa Dorului
      traditional peasant museum hosts seasonal artisan gatherings and folk celebrations.
    before: >-
      The route traverses seasonal floodplain: wear waterproof footwear during damp months and bring mosquito
      repellent, drinking water, sunglasses and a sun hat. On boat trips you must follow guide instructions.
      During high-water stages the water route is preferred, while land trails operate the rest of the year.
      Spring and autumn are the ideal visiting seasons.
    around: >-
      While situated in southern Moldova, the reserve shares ecological affinities with distant wetlands:
      [Kis-Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/), [Hortobágy National
      Park](/lugar/hortobagyi-nemzeti-park---puszta/) and [Carska Bara Special Nature
      Reserve](/lugar/specijalni-rezervat-prirode-carska-bara/) share egrets, otters and European pond
      turtles. Carska Bara also hosts the great white pelican.
  fr:
    intro: >-
      Dès les premiers jours d'avril, le ciel du sud de la Moldavie s'anime d'oiseaux ayant franchi des
      milliers de kilomètres pour nicher. Ils se rassemblent dans la réserve scientifique du Bas-Prut, à la
      frontière roumaine : un vaste lac peu profond, le Beleu, ceinturé de roselières, de saulaies et de
      prairies inondables. C'est la première réserve de biosphère de Moldavie.
    landscape: >-
      Le lac Beleu est un vestige des anciens limans danubiens, formés il y a cinq ou six mille ans lors de la
      transgression marine, peu à peu comblé par les alluvions du Prut. Il mesure environ 5 km de long sur 2
      de large et demeure très peu profond, n'affichant qu'un demi-mètre à un mètre et demi de profondeur
      moyenne. Occupant 628 ha, soit deux tiers de la réserve, son niveau fluctue au rythme du Danube et du
      Prut.


      Tout autour s'étend la plaine alluviale : roselières, massettes, saulaies et tapis de plantes aquatiques
      où s'entremêlent nénuphars et lentilles d'eau. Les chênaies n'occupent que les buttes les plus hautes,
      rarement submergées. La réserve constitue la porte d'entrée de la réserve de biosphère du delta du
      Danube, partagée entre la Roumanie et l'Ukraine.
    wildlife: >-
      Les oiseaux sont les maîtres des lieux. Plus de 220 espèces y ont été recensées, dont 47 inscrites au
      Livre rouge de Moldavie. Sur l'eau évoluent aigrettes, cormorans, mouettes, canards, oies, cygnes,
      foulques, hérons et des colonies de centaines ou milliers de [pélicans
      blancs](/especie/pelecanus_onocrotalus/). Dès le mois d'avril, de nombreux migrateurs arrivent de
      milliers de kilomètres pour nicher ; situé sur une voie migratoire majeure, le site sert d'aire de
      reproduction, d'escale et d'hivernage.


      Le cœur de la nidification se nomme Cioroiu, un secteur sauvage du lac où nichent le cormoran pygmée, le
      crabier chevelu et l'aigrette garzette. Son nom évoque les cormorans séchant leurs ailes au soleil, que
      les anciens prenaient pour des corbeaux. L'accès y est strictement interdit pour préserver le calme des
      colonies.


      Sous l'eau, le lac abrite plus de 27 espèces de poissons, dont le saumon du Danube, et neuf d'amphibiens
      comme le triton crêté et le crapaud vert. Dans les saulaies du canal Manolescu sont signalés la [loutre
      d'Europe](/especie/lutra_lutra/), le chat sauvage, la [cistude d'Europe](/especie/emys_orbicularis/), le
      chevreuil, le sanglier et le rat musqué. Depuis 2019, des indices du [castor
      d'Europe](/especie/castor_fiber/) ont été relevés : en 2020 sa présence a été confirmée par vidéo,
      environ 200 ans après sa disparition du pays.
    visit: >-
      Il existe deux manières de découvrir le lac, selon le niveau des eaux. Le parcours pédestre s'étend sur
      3 km aller-retour et demande environ deux heures. Il part d'un belvédère aménagé sur la colline
      surplombant le Beleu, puis longe les rives ; près de la maison de la réserve s'épanouissent quelques
      nénuphars blancs.


      Lorsque le niveau hydrologique le permet, des sorties en barque pour petits groupes d'adultes sillonnent
      le canal Manolescu, qui naît dans le Prut près de Văleni pour rejoindre le lac à Chiscul Mare. Ce
      circuit compte également 3 km. Les eaux claires laissent observer lentilles d'eau et sagittaires, et des
      jumelles sont mises à disposition ; les ornithologues amateurs sont les bienvenus.
    history: >-
      La réserve a été créée le 23 avril 1991 afin de sauvegarder l'écosystème lagunaire et alluvial et
      favoriser la faune menacée. Elle est inscrite à la convention de Ramsar sous le numéro 1029, et le 13
      novembre 2018 l'UNESCO l'a classée réserve de biosphère.


      Le canal Manolescu charrie sables et argiles qui décantent dans la cuvette. Parmi la flore menacée
      figurent le nénuphar blanc, la salvinie nageante et la mâcre. À Văleni, la Casa Dorului, maison paysanne
      abritant un musée, accueille fêtes et artisans.
    before: >-
      Le parcours traverse une plaine inondable : prévoyez des chaussures imperméables par temps frais, du
      répulsif antimoustiques, de l'eau, des lunettes de soleil et un chapeau. En barque, respectez les
      consignes du guide. En période de crue on privilégie l'itinéraire nautique, et la terre ferme le reste
      de l'année. Les saisons recommandées sont le printemps et l'automne.
    around: >-
      Bien qu'isolée au sud de la Moldavie, la réserve rappelle d'autres grandes zones humides : le
      [Kis-Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/), le [parc national de
      Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/) et la [réserve naturelle spéciale de Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/) partagent aigrettes, loutres et cistudes
      d'Europe. Carska Bara accueille aussi le pélican blanc.
  de:
    intro: >-
      Anfang April füllt sich der Himmel im Süden Moldawiens mit Vögeln, die Tausende Kilometer geflogen sind,
      um hier zu brüten. Sie sammeln sich im Wissenschaftlichen Reservat Unterer Pruth an der rumänischen
      Grenze: ein flacher See, der Beleu-See, gesäumt von Röhrichten, Weidengebüschen und periodisch
      überfluteten Flussauen. Es ist das erste Biosphärenreservat Moldawiens.
    landscape: >-
      Der Beleu-See ist ein Relikt der ehemaligen Donaulimane, die vor fünf bis sechs Tausend Jahren durch
      Meeresvorstöße entstanden und durch Anschwemmungen des Pruth verlandet sind. Er misst etwa 5 km in der
      Länge bei 2 km Breite und ist mit durchschnittlich einem halben bis eineinhalb Metern Wassertiefe sehr
      flach. Er bedeckt 628 ha, rund zwei Drittel des Reservats, und sein Wasserstand schwankt mit Donau und
      Pruth.


      Ringsum dehnt sich die Flussaue: Schilf, Rohrkolben, Weichholzauen und schwimmende Blütenteppiche aus
      Seerosen und Wasserlinsen. Stieleichenwälder besetzen nur die höchsten, selten überfluteten Terrassen.
      Das Reservat bildet das Eingangstor zum Biosphärenreservat Donaudelta, das sich Rumänien und die Ukraine
      teilen.
    wildlife: >-
      Die Vogelwelt beherrscht das Areal. Mehr als 220 Vogelarten wurden erfasst, davon 47 im Roten Buch
      Moldawiens. Auf dem Wasser versammeln sich Reiher, Kormorane, Möwen, Enten, Gänse, Schwäne, Blässhühner
      und Kolonien von Hunderten oder Tausenden [Rosapelikanen](/especie/pelecanus_onocrotalus/). Ab April
      treffen Scharen aus Tausenden Kilometern Entfernung ein; an einer Hauptzugroute gelegen, dient das
      Gewässer als Brut-, Rast- und Überwinterungsplatz.


      Das Brutzentrum ist die Bucht Cioroiu, wo Zwergscharben, Rallenreiher und Seidenreiher nisten. Der Name
      rührt von Kormoranen her, die ihre Schwingen in der Sonne trocknen und früher für Krähen gehalten
      wurden. Das Betreten ist streng untersagt: Gemischte Kolonien verlangen absolute Ruhe.


      Unter Wasser leben über 27 Fischarten, darunter der Huchen, sowie neun Amphibienarten wie Kammmolch und
      Wechselkröte. In den Uferwäldern des Manolescu-Kanals finden sich [Eurasischer
      Fischotter](/especie/lutra_lutra/), Wildkatze, [Europäische
      Sumpfschildkröte](/especie/emys_orbicularis/), Reh, Wildschwein und Bisamratte. Seit 2019 gibt es
      Nagespuren des [Europäischen Bibers](/especie/castor_fiber/): 2020 bestätigten Videoaufnahmen sein
      Vorkommen rund 200 Jahre nach seiner Ausrottung in Moldawien.
    visit: >-
      Es gibt zwei Wege, den See zu erkunden, je nach Wasserstand. Der Fußweg umfasst 3 km hin und zurück und
      dauert etwa zwei Stunden. Er beginnt auf einer Aussichtsplattform am Hang mit Blick über den Beleu und
      folgt dem Ufer; an der Station wachsen weiße Seerosen.


      Bei ausreichendem Wasserstand führen Bootsausflüge für kleine Gruppen über den Manolescu-Kanal, der bei
      Văleni vom Pruth abzweigt und bei Chiscul Mare in den See mündet. Auch diese Tour misst 3 km. Klares
      Wasser gewährt Einblicke in Unterwasserpflanzen, und Besuchern stehen Ferngläser zur Verfügung;
      Vogelbeobachter sind herzlich willkommen.
    history: >-
      Das Reservat wurde am 23. April 1991 zum Schutz des Lagunen- und Auenökosystems und zur Förderung
      gefährdeter Tierarten gegründet. Es ist als Ramsar-Gebiet mit der Nummer 1029 gelistet und wurde am 13.
      November 2018 von der UNESCO als Biosphärenreservat anerkannt.


      Das Sediment des Manolescu-Kanals lagert Sand und Ton im See ab. Zu den geschützten Pflanzen gehören
      Weiße Seerose, Schwimmfarn und Wassernuss. Im Dorf Văleni empfängt die Casa Dorului, ein Bauernhaus mit
      Museum, Handwerker und Kulturfeste.
    before: >-
      Die Route quert Auenland: Festes Schuhwerk in kühleren Monaten, Mückenschutz, Trinkwasser, Sonnenbrille
      und Kopfbedeckung mitnehmen. Im Boot den Anweisungen des Führers folgen. Bei Hochwasser wählst du den
      Wasserweg, sonst die Uferpfade. Frühling und Herbst bieten ideale Bedingungen.
    around: >-
      Trotz der Lage in Südmoldawien ähnelt das Schutzgebiet anderen Auen: Der
      [Klein-Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/), der [Nationalpark
      Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/) und das [Sonder-Naturreservat Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/) teilen Reiher, Fischotter und Sumpfschildkröten.
      In Carska Bara rastet zudem der Rosapelikan.
  it:
    intro: >-
      All'inizio di aprile i cieli del sud della Moldavia si popolano di uccelli che hanno percorso migliaia
      di chilometri per riprodursi qui. Giungono nella Riserva scientifica del Basso Prut, un angolo appartato
      a ridosso del confine rumeno: un lago poco profondo, il Beleu, contornato da canneti, saliceti e golene
      allagate dalle piene fluviali. È la prima riserva della biosfera della Moldavia.
    landscape: >-
      Il lago Beleu è un residuo degli antichi liman danubiani, originatisi cinque o sei mila anni fa per
      trasgressione marina e progressivamente colmati dai sedimenti del Prut. Misura circa 5 km di lunghezza
      per 2 di larghezza ed è assai poco profondo, con livelli medi compresi tra mezzo metro e un metro e
      mezzo. Esteso su 628 ha, circa due terzi dell'area protetta, il suo livello idrico sale e scende
      congiuntamente a quelli di Danubio e Prut.


      All'intorno si sviluppa la pianura alluvionale: canneti, tife, boschi ripariali di salice e una coltre
      di idrofite galleggianti con ninfee e lenticchie d'acqua. I boschi di farnia allignano unicamente sui
      dossi più rilevati, raramente lambiti dalle piene. La riserva costituisce l'avamposto della Riserva
      della biosfera del Delta del Danubio, condivisa tra Romania e Ucraina.
    wildlife: >-
      L'avifauna regna sovrana in questi specchi d'acqua. Sono state censite oltre 220 specie, 47 delle quali
      incluse nel Libro Rosso della Moldavia. In acqua nuotano garzette, cormorani, gabbiani, anatre
      selvatiche, oche, cigni, folaghe, aironi e concentrazioni di centinaia o migliaia di [pellicani
      comuni](/especie/pelecanus_onocrotalus/). Da aprile compaiono specie giunte da migliaia di chilometri
      per nidificare; situato lungo una direttrice primaria, il sito offre rifugio per cova, sosta e
      svernamento.


      Il fulcro riproduttivo è Cioroiu, un'ansa tranquilla del lago dove nidificano il marangone minore, la
      sgarza ciuffetto e la garzetta. Il toponimo richiama i cormorani che asciugano le ali al sole, un tempo
      scambiati per corvi. L'accesso è vietato per garantire la tranquillità delle colonie.


      Sott'acqua il bacino ospita più di 27 specie ittiche, tra cui il salmone del Danubio, e nove di anfibi
      tra cui tritone crestato e rospo smeraldino. Nei saliceti lungo il canale Manolescu sono segnalati la
      [lontra europea](/especie/lutra_lutra/), il gatto selvatico, la [testuggine palustre
      europea](/especie/emys_orbicularis/), il capriolo, il cinghiale e il topo muschiato. Dal 2019 sono
      riapparse tracce del [castoro europeo](/especie/castor_fiber/): nel 2020 video-trappole ne hanno
      attestato la presenza, circa 200 anni dopo la sua scomparsa dal territorio moldavo.
    visit: >-
      Ci sono due modi per esplorare il lago, a seconda del livello idrico. Il sentiero a terra copre 3 km tra
      andata e ritorno e richiede circa due ore. Comincia da una terrazza panoramica sulla collina che domina
      il Beleu dall'alto, proseguendo lungo la sponda; presso la sede crescono alcune ninfee bianche.


      Quando le condizioni idrologiche lo consentono, piccoli gruppi di adulti possono navigare in barca lungo
      il canale Manolescu, che si stacca dal Prut vicino a Văleni e sfocia nel lago a Chiscul Mare. Anche
      questo tragitto misura 3 km. Le acque trasparenti permettono di osservare la vegetazione sommersa e i
      visitatori possono usufruire di binocoli; gli appassionati di birdwatching sono benvenuti.
    history: >-
      La riserva è stata istituita il 23 aprile 1991 per salvaguardare gli habitat lacustri e favorire la
      riproduzione delle specie minacciate. È riconosciuta nella Convenzione di Ramsar con il numero 1029, e
      il 13 novembre 2018 l'UNESCO l'ha iscritta come riserva della biosfera.


      Le acque torbide del canale Manolescu apportano sabbie e limi che si depositano nel bacino. Tra le
      piante rare figurano la ninfea bianca, la salvinia natante e la castagna d'acqua. A Văleni, la Casa
      Dorului, dimora contadina con museo, ospita manifestazioni folcloristiche e mercati artigianali.
    before: >-
      L'itinerario attraversa suoli golenali: indossa calzature impermeabili nelle stagioni umide, porta
      repellente per zanzare, acqua, occhiali da sole e cappello. In barca rispetta le indicazioni della
      guida. Nei periodi di piena si privilegia l'escursione nautica, a terra nel resto dell'anno. Primavera e
      autunno sono i periodi migliori.
    around: >-
      Pur trovandosi nel sud della Moldavia, la riserva presenta analogie con altri complessi umidi: il
      [Piccolo Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/), il [Parco Nazionale di
      Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/) e la [Riserva Naturale Speciale Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/) condividono garzette, lontre e testuggini
      palustri. A Carska Bara fa sosta anche il pellicano comune.
  pt:
    intro: >-
      Quando abril desponta, os céus do sul da Moldávia enchem-se de aves que voaram milhares de quilómetros
      para nidificar aqui. Concentram-se na Reserva Científica do Baixo Prute, um refúgio moldavo junto à
      fronteira romena: uma lagoa pouco profunda, o Beleu, cercada por caniçais, salgueirais e várzeas
      alagadas pelas cheias do rio. É a primeira reserva da biosfera da Moldávia.
    landscape: >-
      O lago Beleu é um vestígio dos antigos limanes do Danúbio, formados há cinco a seis mil anos pelo avanço
      marinho e progressivamente colmatados pelas aluviões do Prute. Mede cerca de 5 km de comprimento por 2
      de largura e é muito raso, oscilando entre meio metro e metro e meio de profundidade média. Ocupa 628
      ha, cerca de dois terços da reserva, e as suas águas sobem e descem em sintonia com o Danúbio e o Prute.


      Em redor estende-se a planície aluvial: caniçais, bunhais, salgueirais e um manto de plantas aquáticas
      onde proliferam nenúfares e lentilhas-de-água. Os carvalhais cingem-se aos outeiros mais elevados, que
      raramente se inundam. A reserva funciona como pórtico de entrada para a Reserva da Biosfera do Delta do
      Danúbio, partilhada por Roménia e Ucrânia.
    wildlife: >-
      As aves dominam a paisagem. Foram contabilizadas mais de 220 espécies, 47 das quais no Livro Vermelho da
      Moldávia. Na água avistam-se garças, corvos-marinhos, gaivotas, patos, gansos, cisnes, galeirões e
      colónias de centenas ou milhares de [pelicanos-brancos](/especie/pelecanus_onocrotalus/). A partir de
      abril afluem espécies vindas de milhares de quilómetros para criar; situada num grande corredor
      migratório, a lagoa serve de área de nidificação, escala e refúgio de inverno.


      O núcleo da reprodução é Cioroiu, uma enseada intocada onde nidificam o corvo-marinho-pigmeu, o
      papa-ratos e a garça-branca-pequena. O topónimo evoca os corvos-marinhos que secam as asas ao sol, que
      antigamente eram confundidos com corvos. O acesso humano é estritamente proibido para manter o sossego
      das colónias mistas.


      Sob a lâmina de água subsistem mais de 27 espécies de peixes, incluindo o salmão-do-danúbio, e nove de
      anfíbios como o tritão-de-crista e o sapo-verde. Nos salgueirais do canal Manolescu ocorrem a
      [lontra-europeia](/especie/lutra_lutra/), o gato-bravo, o [cágado-europeu](/especie/emys_orbicularis/),
      o corço, o javali e a ratazana-almiscarada. Desde 2019 detetam-se vestígios do
      [castor-europeu](/especie/castor_fiber/): em 2020 a sua presença foi confirmada por vídeo, cerca de 200
      anos após ter desaparecido da Moldávia.
    visit: >-
      Há duas formas de visitar a lagoa, dependendo do caudal das águas. O percurso pedestre tem 3 km de ida e
      volta e faz-se em cerca de duas horas. Parte de um miradouro na encosta sobranceira ao Beleu e segue
      pela margem; junto à sede desabrocham nenúfares brancos.


      Quando o nível das águas o permite, pequenos grupos de adultos podem navegar em batelão pelo canal
      Manolescu, que nasce no Prute junto a Văleni e desagua no lago em Chiscul Mare. São igualmente 3 km. A
      água límpida deixa ver plantas submersas e os visitantes dispõem de binóculos; os entusiastas de
      observação de aves são bem-vindos.
    history: >-
      A reserva foi criada em 23 de abril de 1991 para proteger o ecossistema lagunar e favorecer a reprodução
      de espécies vulneráveis. Encontra-se classificada na Convenção de Ramsar sob o número 1029, e a 13 de
      novembro de 2018 a UNESCO declarou-a reserva da biosfera.


      As águas do canal Manolescu trazem areia e argila que se depositam na bacia. Entre a flora sob proteção
      contam-se o nenúfar-branco, a salva-flutuante e a castanha-d'água. Na aldeia de Văleni, a Casa Dorului,
      habitação tradicional com museu, acolhe feiras e mostras de artesanato.
    before: >-
      O trilho atravessa várzeas inundáveis: usa calçado impermeável na época fria, repelente de mosquitos,
      água, óculos escuros e chapéu. No barco deves cumprir as orientações do guia. Nas cheias opta-se pelo
      percurso aquático, fazendo-se o terrestre no resto do ano. Primavera e outono são os períodos ideais.
    around: >-
      Embora no sul da Moldávia, a reserva tem semelhanças com outras zonas húmidas: o [Pequeno
      Balaton](/lugar/kis-balaton---balaton-felvideki-nemzeti-park/), o [Parque Nacional de
      Hortobágy](/lugar/hortobagyi-nemzeti-park---puszta/) e a [Reserva Natural Especial Carska
      Bara](/lugar/specijalni-rezervat-prirode-carska-bara/) partilham garças, lontras e cágados-europeus. Com
      Carska Bara partilha ainda o pelicano-branco.
