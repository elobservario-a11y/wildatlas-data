resumen:
  es: >-
    Garganta alpina kárstica encajada entre el macizo de Durmitor y la frontera bosnia con aguas azul
    turquesa.
  en: Alpine karst gorge nestled between the Durmitor massif and the Bosnian border with turquoise waters.
  fr: >-
    Gorge alpine karstique enchâssée entre le massif du Durmitor et la frontière bosnienne aux eaux bleu
    turquoise.
  de: Alpine Karstschlucht zwischen dem Durmitor-Massiv und der bosnischen Grenze mit türkisblauem Wasser.
  it: >-
    Gola alpina carsica incastonata tra il massiccio del Durmitor e il confine bosniaco con acque blu
    turchese.
  pt: Garganta alpina cársica encaixada entre o maciço do Durmitor e a fronteira bósnia com águas azul-turquesa.
unico:
  es: >-
    Aquí el aire cálido de los cañones deja crecer plantas y animales mediterráneos a pocos kilómetros de
    cumbres con flora alpina.
  en: >-
    Here the warm canyon air allows Mediterranean plants and animals to thrive just miles away from peaks with
    alpine flora.
  fr: >-
    Ici, l'air chaud des canyons permet à des plantes et animaux méditerranéens de prospérer à quelques
    kilomètres de cimes à la flore alpine.
  de: >-
    Hier lässt die warme Schluchtluft mediterrane Pflanzen und Tiere nur wenige Kilometer von Gipfeln mit
    alpiner Flora gedeihen.
  it: >-
    Qui l'aria calda dei canyon consente a piante e animali mediterranei di prosperare a pochi chilometri da
    vette con flora alpina.
  pt: >-
    Aqui o ar quente dos canhões permite que plantas e animais mediterrânicos prosperem a poucos quilómetros
    de cumes com flora alpina.
observaciones:
