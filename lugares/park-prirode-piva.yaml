texto:
  es:
    intro: >-
      Para ver la Piva hay que bajar: se entra por arriba, por una meseta de pastos y bosques, y el río está
      al fondo de un cañón de hasta 1.200 m de profundidad. El Parque Natural de Piva ocupa el extremo
      noroeste de Montenegro, entre la frontera con Bosnia y Herzegovina y el límite del Parque Nacional
      Durmitor, y abarca una parte importante del municipio de Plužine. Es el eslabón natural entre Durmitor,
      en Montenegro, y Sutjeska, en Bosnia y Herzegovina.
    landscape: >-
      El relieve es muy variado. Hay mesetas de montaña con ricos pastos y bosques, los hondos cañones del
      Tara, el Piva y el Sušica, y los lagos de montaña Stabanjska y Trnovačko. Pivska Površ, la meseta caliza
      que rodea el cañón, está entre el Durmitor, Maglić, Lebršnik, Golija y Vojnik. Es un terreno de dolinas
      y simas, con una población muy dispersa.


      El cañón del Piva se abre entre Bioč, Volujak, Maglić y Pivska Planina, y tiene unos 33 km de largo. En
      1975 la presa de Mratinje, de 220 m de altura, lo cerró y creó el lago de Piva, el segundo mayor de
      Montenegro. El lago inundó el emplazamiento antiguo del monasterio de Piva, del siglo XVI, que hubo que
      trasladar. Aguas abajo, el Piva se junta con el Tara en Šćepan Polje, en la frontera con Bosnia y
      Herzegovina, y los dos forman el Drina.


      Los ecosistemas cambian con la altura. En las cumbres y mesetas altas hay flora y fauna alpinas; a lo
      largo de los cañones y los valles del Piva y el Tara, el aire cálido permite elementos mediterráneos.
    wildlife: >-
      El parque reúne más de 1.500 especies de plantas, de las que más de 80 están registradas como raras o
      amenazadas, y unas 2.000 especies de hongos. Los bosques están bien conservados: pino albar y pino
      negro, haya y abeto, arce, pícea y fresno.


      En esos bosques viven el [oso pardo](/especie/ursus_arctos/), el [jabalí](/especie/sus_scrofa/) y, en
      los de frondosas, el [corzo](/especie/capreolus_capreolus/). Los ríos Piva y Tara son ricos en trucha de
      arroyo, tímalo y [hucha](/especie/hucho_hucho/). En los lagos naturales de montaña viven los tritones,
      los animales más característicos de los lagos de alta montaña de Montenegro. Según el gestor, en el
      parque se mantienen algunos de los últimos representantes de especies raras y protegidas.
    visit: >-
      La mejor forma de ver el parque es subir a los miradores. El de vrh Soko, a 1.439 m, en Crkvičko Polje,
      se alcanza por una senda fácil de 2,7 km y ofrece vistas de la meseta de Pivska Planina, el Durmitor,
      Vučevo y parte del cañón del Piva. En Sokolina la panorámica es completa: Durmitor, Bioč, Volujak,
      Maglić, Vučevo y Zelengora, con una vista especial del cañón del Tara. Y un mirador del cañón del Piva
      queda a unos 1,7 km al noroeste del área de descanso de Babići, con vistas hacia la presa.


      Para una caminata de media jornada, la ruta Stabna–Kručica mide 5,50 km, con 720 m de desnivel. Está en
      la categoría de senderos más fáciles y se recomienda a principiantes, aunque exige una condición física
      media. Se tarda en subir unas dos horas y veinte minutos. Sale de Stabna, sube en zigzag por un hayedo
      en la ladera empinada hasta el pasto del pintoresco katun de Stabna. Desde Kručica un sendero marcado
      sigue al norte hasta el pico Veliki Vitao, y otro baja al oeste hacia el lago grande de Stabna y el
      pueblo. También hay una ruta ciclista de unos 21 km junto al lago y el cañón de Piva, entre Unač y
      Crkvičko Polje.


      Otra opción exigente sale de Plužine, sigue el río Vrbnica y pasa por los lagos Stabanska hasta el lago
      Trnovačko; se tarda de 5 a 6 horas.
    history: >-
      Unos veinte pueblos pequeños, con arquitectura tradicional, y numerosos katuns ganaderos son parte del
      paisaje cultural del parque. La ganadería, sobre todo de ovejas, sigue desarrollada en la meseta. Piva
      forma además un corredor natural entre los parques nacionales de Durmitor y Sutjeska.
    before: >-
      Consulta el estado de las carreteras en la web del parque antes de salir, y comprueba si hay avisos
      sobre las rutas.
    around: >-
      Pegados a Piva están el [Parque Nacional Durmitor - Cañón del Río
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), el [Parque Nacional Sutjeska - Macizo de
      Maglić](/lugar/nacionalni-park-sutjeska---maglic/) y el [Bosque Virgen de Perućica - Parque Nacional
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). A 1 km están el [Parque Nacional
      Durmitor - Macizo Montañoso](/lugar/nacionalni-park-durmitor---masiv/) y el [Parque Nacional Sutjeska -
      Montañas de Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/). La [Meseta Kárstica de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/) queda algo más lejos.
  en:
    intro: >-
      To see the Piva you have to descend: you enter from above, across a plateau of pastures and forests, and
      the river lies at the bottom of a canyon up to 1,200 m deep. Piva Nature Park occupies the north-western
      tip of Montenegro, between the border with Bosnia and Herzegovina and the boundary of Durmitor National
      Park, covering a significant part of the municipality of Plužine. It is the natural link between
      Durmitor, in Montenegro, and Sutjeska, in Bosnia and Herzegovina.
    landscape: >-
      The relief is very diverse. There are mountain plateaus with rich pastures and forests, the deep canyons
      of the Tara, Piva and Sušica, and the mountain lakes Stabanjska and Trnovačko. Pivska Površ, the
      limestone plateau surrounding the canyon, lies between Durmitor, Maglić, Lebršnik, Golija and Vojnik. It
      is a landscape of sinkholes and chasms, with a very dispersed population.


      The Piva canyon opens between Bioč, Volujak, Maglić and Pivska Planina, stretching some 33 km in length.
      In 1975 the Mratinje dam, 220 m high, closed it off and created Lake Piva, the second largest in
      Montenegro. The lake flooded the ancient site of the sixteenth-century Piva Monastery, which had to be
      relocated. Downstream, the Piva meets the Tara at Šćepan Polje on the border with Bosnia and
      Herzegovina, and together they form the Drina.


      Ecosystems shift with altitude. On the peaks and high plateaus there is alpine flora and fauna; along
      the canyons and valleys of the Piva and Tara, warm air supports Mediterranean elements.
    wildlife: >-
      The park brings together more than 1,500 plant species, of which more than 80 are recorded as rare or
      endangered, and around 2,000 species of fungi. The forests are well preserved: Scots pine and black
      pine, beech and fir, maple, spruce and ash.


      In these forests live the [brown bear](/especie/ursus_arctos/), the [wild boar](/especie/sus_scrofa/)
      and, in deciduous woods, the [roe deer](/especie/capreolus_capreolus/). The Piva and Tara rivers are
      rich in brook trout, grayling and [huchen](/especie/hucho_hucho/). In the natural mountain lakes live
      newts, the most characteristic animals of Montenegro's high mountain lakes. According to the park
      authority, some of the last representatives of rare and protected species survive in the park.
    visit: >-
      The best way to see the park is to climb to the viewpoints. The one at vrh Soko, at 1,439 m, in Crkvičko
      Polje, is reached via an easy 2.7 km path and offers views of the Pivska Planina plateau, Durmitor,
      Vučevo and part of the Piva canyon. At Sokolina the panorama is complete: Durmitor, Bioč, Volujak,
      Maglić, Vučevo and Zelengora, with a special view of the Tara canyon. And a viewpoint over the Piva
      canyon lies about 1.7 km north-west of the Babići rest area, with views toward the dam.


      For a half-day hike, the Stabna–Kručica trail measures 5.50 km, with 720 m of elevation gain. It falls
      into the easiest trail category and is recommended for beginners, although it requires moderate physical
      fitness. The ascent takes about two hours and twenty minutes. It starts from Stabna, climbs in zigzags
      through a beech forest on a steep slope to the pasture of the picturesque Stabna katun. From Kručica a
      marked trail continues north to Veliki Vitao peak, while another descends west towards large Stabna lake
      and the village. There is also a cycling route of about 21 km alongside the lake and Piva canyon,
      between Unač and Crkvičko Polje.


      Another demanding option leaves from Plužine, follows the Vrbnica river and passes the Stabanska lakes
      up to Lake Trnovačko; it takes 5 to 6 hours.
    history: >-
      Around twenty small villages, with traditional architecture, and numerous pastoral katuns form part of
      the cultural landscape of the park. Livestock farming, especially sheep grazing, remains well developed
      on the plateau. Piva also forms a natural corridor between Durmitor and Sutjeska national parks.
    before: Check road conditions on the park website before setting out, and look for any route notices.
    around: >-
      Bordering Piva are the [Durmitor National Park - Tara River
      Canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/), the [Sutjeska National Park - Maglić
      Massif](/lugar/nacionalni-park-sutjeska---maglic/) and the [Perućica Primeval Forest - Sutjeska National
      Park](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). At 1 km are the [Durmitor National Park -
      Mountain Massif](/lugar/nacionalni-park-durmitor---masiv/) and the [Sutjeska National Park - Zelengora
      Mountains](/lugar/nacionalni-park-sutjeska---zelengora/). The [Sinjajevina Karst
      Plateau](/lugar/sinjajevina-karst-plateau/) lies somewhat further away.
  fr:
    intro: >-
      Pour voir la Piva, il faut descendre : on y entre par le haut, à travers un plateau de pâturages et de
      forêts, et la rivière coule au fond d'un canyon atteignant jusqu'à 1 200 m de profondeur. Le Parc
      naturel de la Piva occupe l'extrémité nord-ouest du Monténégro, entre la frontière avec la
      Bosnie-Herzégovine et la limite du Parc national du Durmitor, couvrant une part importante de la
      municipalité de Plužine. C'est le maillon naturel entre le Durmitor, au Monténégro, et Sutjeska, en
      Bosnie-Herzégovine.
    landscape: >-
      Le relief est très varié. Il y a des plateaux de montagne aux riches pâturages et forêts, les profonds
      canyons de la Tara, de la Piva et de la Sušica, ainsi que les lacs de montagne Stabanjska et Trnovačko.
      Pivska Površ, le plateau calcaire entourant le canyon, s'étend entre le Durmitor, Maglić, Lebršnik,
      Golija et Vojnik. C'est un terrain de dolines et d'avens, avec une population très dispersée.


      Le canyon de la Piva s'ouvre entre Bioč, Volujak, Maglić et Pivska Planina, long d'environ 33 km. En
      1975, le barrage de Mratinje, haut de 220 m, l'a fermé et a créé le lac de Piva, le deuxième plus grand
      du Monténégro. Le lac a submergé l'ancien emplacement du monastère de Piva, du XVIe siècle, qu'il a
      fallu déplacer. En aval, la Piva rejoint la Tara à Šćepan Polje, à la frontière avec la
      Bosnie-Herzégovine, et toutes deux forment la Drina.


      Les écosystèmes changent avec l'altitude. Sur les sommets et hauts plateaux se trouvent une flore et une
      faune alpines ; le long des canyons et des vallées de la Piva et de la Tara, l'air chaud autorise des
      éléments méditerranéens.
    wildlife: >-
      Le parc rassemble plus de 1 500 espèces de plantes, dont plus de 80 sont répertoriées comme rares ou
      menacées, et environ 2 000 espèces de champignons. Les forêts sont bien préservées : pin sylvestre et
      pin noir, hêtre et sapin, érable, épicéa et frêne.


      Dans ces forêts vivent l'[ours brun](/especie/ursus_arctos/), le [sanglier](/especie/sus_scrofa/) et,
      dans les bois de feuillus, le [chevreuil](/especie/capreolus_capreolus/). Les rivières Piva et Tara sont
      riches en truite fario, ombre commun et [huchon](/especie/hucho_hucho/). Dans les lacs naturels de
      montagne vivent les tritons, animaux les plus caractéristiques des lacs de haute montagne du Monténégro.
      Selon le gestionnaire, certains des derniers représentants d'espèces rares et protégées subsistent dans
      le parc.
    visit: >-
      La meilleure façon de découvrir le parc est de monter aux belvédères. Celui du vrh Soko, à 1 439 m, à
      Crkvičko Polje, est accessible par un sentier facile de 2,7 km et offre une vue sur le plateau de Pivska
      Planina, le Durmitor, Vučevo et une partie du canyon de la Piva. À Sokolina, le panorama est complet :
      Durmitor, Bioč, Volujak, Maglić, Vučevo et Zelengora, avec une vue remarquable sur le canyon de la Tara.
      Et un belvédère sur le canyon de la Piva se trouve à environ 1,7 km au nord-ouest de l'aire de repos de
      Babići, avec vue vers le barrage.


      Pour une randonnée d'une demi-journée, l'itinéraire Stabna–Kručica mesure 5,50 km, avec 720 m de
      dénivelé. Il appartient à la catégorie des sentiers les plus faciles et est recommandé aux débutants,
      bien qu'il exige une condition physique moyenne. La montée prend environ deux heures et vingt minutes.
      Il part de Stabna, monte en lacets à travers une hêtraie sur une pente escarpée jusqu'au pâturage du
      pittoresque katun de Stabna. Depuis Kručica, un sentier balisé continue vers le nord jusqu'au pic Veliki
      Vitao, tandis qu'un autre descend vers l'ouest vers le grand lac de Stabna et le village. Il existe
      également un circuit vélo d'environ 21 km le long du lac et du canyon de la Piva, entre Unač et Crkvičko
      Polje.


      Une autre option exigeante part de Plužine, longe la rivière Vrbnica et passe par les lacs Stabanska
      jusqu'au lac Trnovačko ; compter de 5 à 6 heures.
    history: >-
      Environ vingt petits villages, à l'architecture traditionnelle, et de nombreux katuns pastoraux font
      partie du paysage culturel du parc. L'élevage, en particulier de moutons, reste bien développé sur le
      plateau. La Piva constitue en outre un couloir naturel entre les parcs nationaux du Durmitor et de
      Sutjeska.
    before: >-
      Consultez l'état des routes sur le site du parc avant de partir, et vérifiez s'il y a des avis sur les
      itinéraires.
    around: >-
      Attenants à la Piva se trouvent le [Parc national du Durmitor - Canyon de la rivière
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), le [Parc national de Sutjeska - Massif du
      Maglić](/lugar/nacionalni-park-sutjeska---maglic/) et la [Forêt vierge de Perućica - Parc national de
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). À 1 km se trouvent le [Parc national du
      Durmitor - Massif montagneux](/lugar/nacionalni-park-durmitor---masiv/) et le [Parc national de Sutjeska
      - Monts de Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/). Le [Plateau karstique de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/) se trouve un peu plus loin.
  de:
    intro: >-
      Um die Piva zu sehen, muss man hinabsteigen: Man betritt das Gebiet von oben, über eine Hochebene mit
      Weiden und Wäldern, und der Fluss fließt am Grund einer bis zu 1.200 m tiefen Schlucht. Der Naturpark
      Piva nimmt den nordwestlichen Zipfel Montenegros ein, zwischen der Grenze zu Bosnien und Herzegowina und
      der Grenze des Nationalparks Durmitor, und umfasst einen bedeutenden Teil der Gemeinde Plužine. Er ist
      das natürliche Bindeglied zwischen Durmitor in Montenegro und Sutjeska in Bosnien und Herzegowina.
    landscape: >-
      Das Relief ist sehr abwechslungsreich. Es gibt Berghochebenen mit reichen Weiden und Wäldern, die tiefen
      Schluchten von Tara, Piva und Sušica sowie die Bergseen Stabanjska und Trnovačko. Die Pivska Površ, das
      Kalkplateau rund um die Schlucht, liegt zwischen Durmitor, Maglić, Lebršnik, Golija und Vojnik. Es ist
      ein Gelände mit Dolinen und Schlünden bei sehr verstreuter Besiedlung.


      Die Piva-Schlucht öffnet sich zwischen Bioč, Volujak, Maglić und der Pivska Planina und ist rund 33 km
      lang. 1975 riegelte der 220 m hohe Mratinje-Damm sie ab und schuf den Pivasee, den zweitgrößten See
      Montenegros. Der See überflutete den alten Standort des Piva-Klosters aus dem sechzehnten Jahrhundert,
      das versetzt werden musste. Flussabwärts vereinigt sich die Piva bei Šćepan Polje an der Grenze zu
      Bosnien und Herzegowina mit der Tara zur Drina.


      Die Ökosysteme wechseln mit der Höhe. Auf den Gipfeln und Hochplateaus gibt es alpine Flora und Fauna;
      entlang der Schluchten und Täler von Piva und Tara ermöglicht warme Luft mediterrane Elemente.
    wildlife: >-
      Der Park versammelt mehr als 1.500 Pflanzenarten, von denen über 80 als selten oder bedroht eingestuft
      sind, sowie rund 2.000 Pilzarten. Die Wälder sind gut erhalten: Waldkiefer und Schwarzkiefer, Buche und
      Tanne, Ahorn, Fichte und Esche.


      In diesen Wäldern leben der [Braunbär](/especie/ursus_arctos/), das [Wildschwein](/especie/sus_scrofa/)
      und in Laubwäldern das [Reh](/especie/capreolus_capreolus/). Die Flüsse Piva und Tara sind reich an
      Bachforellen, Äschen und dem [Huchen](/especie/hucho_hucho/). In den natürlichen Bergseen leben Molche,
      die charakteristischsten Tiere der montenegrinischen Hochgebirgsseen. Nach Angaben der Verwaltung
      überleben im Park einige der letzten Vertreter seltener und geschützter Arten.
    visit: >-
      Die beste Art, den Park zu erkunden, ist der Aufstieg zu den Aussichtspunkten. Der auf dem vrh Soko, auf
      1.439 m in Crkvičko Polje, ist über einen einfachen 2,7 km langen Pfad erreichbar und bietet Ausblicke
      auf das Pivska-Planina-Plateau, den Durmitor, Vučevo und Teile der Piva-Schlucht. In Sokolina ist das
      Panorama vollständig: Durmitor, Bioč, Volujak, Maglić, Vučevo und Zelengora mit einem besonderen Blick
      auf die Tara-Schlucht. Ein Aussichtspunkt auf die Piva-Schlucht liegt etwa 1,7 km nordwestlich des
      Rastplatzes Babići mit Blick auf den Damm.


      Für eine Halbtagswanderung misst die Route Stabna–Kručica 5,50 km mit 720 m Höhenunterschied. Sie zählt
      zur leichtesten Wegekategorie und wird Anfängern empfohlen, erfordert aber mittlere Kondition. Der
      Aufstieg dauert etwa zwei Stunden und zwanzig Minuten. Sie startet in Stabna, steigt im Zickzack durch
      einen Buchenwald am Steilhang zur Weide des malerischen Stabna-Katuns auf. Von Kručica führt ein
      markierter Weg nach Norden zum Gipfel Veliki Vitao, während ein anderer nach Westen zum großen
      Stabna-See und ins Dorf hinabführt. Zudem gibt es eine Radroute von rund 21 km entlang des Sees und der
      Piva-Schlucht zwischen Unač und Crkvičko Polje.


      Eine weitere anspruchsvolle Option startet in Plužine, folgt dem Fluss Vrbnica und führt an den
      Stabanska-Seen vorbei zum Trnovačko-See; Dauer 5 bis 6 Stunden.
    history: >-
      Rund zwanzig kleine Dörfer mit traditioneller Architektur und zahlreiche Viehhütten (Katuns) sind Teil
      der Kulturlandschaft des Parks. Die Viehwirtschaft, vor allem die Schafzucht, ist auf dem Plateau nach
      wie vor lebendig. Die Piva bildet zudem einen natürlichen Korridor zwischen den Nationalparks Durmitor
      und Sutjeska.
    before: >-
      Prüfen Sie den Straßenzustand vor Reiseantritt auf der Park-Website und achten Sie auf Hinweise zu den
      Routen.
    around: >-
      Direkt an Piva angrenzend liegen der [Nationalpark Durmitor -
      Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/), der [Nationalpark Sutjeska -
      Maglić-Massiv](/lugar/nacionalni-park-sutjeska---maglic/) und der [Urwald Perućica - Nationalpark
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). 1 km entfernt liegen der [Nationalpark
      Durmitor - Gebirgsmassiv](/lugar/nacionalni-park-durmitor---masiv/) und der [Nationalpark Sutjeska -
      Zelengora-Gebirge](/lugar/nacionalni-park-sutjeska---zelengora/). Das [Karstplateau von
      Sinjajevina](/lugar/sinjajevina-karst-plateau/) liegt etwas weiter entfernt.
  it:
    intro: >-
      Per vedere la Piva bisogna scendere: si entra dall'alto, attraverso un altopiano di pascoli e foreste, e
      il fiume scorre sul fondo di un canyon profondo fino a 1.200 m. Il Parco Naturale della Piva occupa
      l'estremità nord-occidentale del Montenegro, tra il confine con la Bosnia ed Erzegovina e il confine del
      Parco Nazionale del Durmitor, coprendo una parte consistente del comune di Plužine. È il legame naturale
      tra il Durmitor, in Montenegro, e Sutjeska, in Bosnia ed Erzegovina.
    landscape: >-
      Il rilievo è molto vario. Vi sono altopiani montani con ricchi pascoli e boschi, i profondi canyon del
      Tara, del Piva e del Sušica, e i laghi alpini Stabanjska e Trnovačko. Pivska Površ, l'altopiano calcareo
      che circonda il canyon, si trova tra Durmitor, Maglić, Lebršnik, Golija e Vojnik. È un terreno di doline
      e voragini con una popolazione molto dispersa.


      Il canyon del Piva si apre tra Bioč, Volujak, Maglić e Pivska Planina, estendendosi per circa 33 km di
      lunghezza. Nel 1975 la diga di Mratinje, alta 220 m, lo sbarrò creando il lago di Piva, il secondo più
      grande del Montenegro. Il lago sommerse l'antico sito del monastero di Piva, del XVI secolo, che dovette
      essere trasferito. A valle, il Piva si unisce al Tara a Šćepan Polje, sul confine con la Bosnia ed
      Erzegovina, e insieme formano la Drina.


      Gli ecosistemi mutano con la quota. Sulle cime e sui pianori elevati si trova flora e fauna alpina;
      lungo i canyon e le valli del Piva e del Tara l'aria calda consente la presenza di elementi
      mediterranei.
    wildlife: >-
      Il parco riunisce oltre 1.500 specie vegetali, di cui oltre 80 censite come rare o minacciate, e circa
      2.000 specie di funghi. Le foreste sono ben preservate: pino silvestre e pino nero, faggio e abete
      bianco, acero, abete rosso e frassino.


      In questi boschi vivono l'[orso bruno](/especie/ursus_arctos/), il [cinghiale](/especie/sus_scrofa/) e,
      nelle latifoglie, il [capriolo](/especie/capreolus_capreolus/). I fiumi Piva e Tara sono ricchi di trote
      di torrente, temoli e del [salmone del Danubio](/especie/hucho_hucho/). Nei laghi naturali di montagna
      vivono i tritoni, gli animali più tipici dei laghi d'alta montagna montenegrini. Secondo l'ente gestore,
      nel parco sopravvivono alcuni degli ultimi esemplari di specie rare e protette.
    visit: >-
      Il modo migliore per ammirare il parco è salire ai belvederi. Quello di vrh Soko, a 1.439 m a Crkvičko
      Polje, si raggiunge tramite un facile sentiero di 2,7 km e offre vedute sull'altopiano di Pivska
      Planina, sul Durmitor, su Vučevo e su parte del canyon del Piva. A Sokolina la panoramica è completa:
      Durmitor, Bioč, Volujak, Maglić, Vučevo e Zelengora, con una vista speciale sul canyon del Tara. E un
      belvedere sul canyon del Piva si trova a circa 1,7 km a nord-ovest dell'area di sosta di Babići, con
      vista verso la diga.


      Per un'escursione di mezza giornata, il percorso Stabna–Kručica misura 5,50 km con 720 m di dislivello.
      Rientra nella categoria dei sentieri più facili ed è consigliato ai principianti, pur richiedendo una
      forma fisica media. La salita richiede circa due ore e venti minuti. Parte da Stabna, sale a tornanti in
      una faggeta su pendio ripido fino al pascolo del pittoresco katun di Stabna. Da Kručica un sentiero
      segnato prosegue a nord verso la cima Veliki Vitao, mentre un altro scende a ovest verso il lago grande
      di Stabna e il villaggio. Vi è anche un percorso ciclabile di circa 21 km lungo il lago e il canyon del
      Piva, tra Unač e Crkvičko Polje.


      Un'altra opzione impegnativa parte da Plužine, risale il fiume Vrbnica e tocca i laghi Stabanska fino al
      lago Trnovačko; richiede da 5 a 6 ore.
    history: >-
      Circa venti piccoli villaggi con architettura tradizionale e numerosi katun pastorali fanno parte del
      paesaggio culturale del parco. La pastorizia, specie ovina, rimane attiva sull'altopiano. Piva
      costituisce inoltre un corridoio naturale tra i parchi nazionali di Durmitor e Sutjeska.
    before: >-
      Controllate lo stato della viabilità sul sito web del parco prima di partire, e verificate gli avvisi
      sui percorsi.
    around: >-
      Attigui a Piva si trovano il [Parco Nazionale Durmitor - Canyon del Fiume
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), il [Parco Nazionale Sutjeska - Massiccio di
      Maglić](/lugar/nacionalni-park-sutjeska---maglic/) e la [Foresta Vergine di Perućica - Parco Nazionale
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). A 1 km si trovano il [Parco Nazionale
      Durmitor - Massiccio Montuoso](/lugar/nacionalni-park-durmitor---masiv/) e il [Parco Nazionale Sutjeska
      - Monti di Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/). L'[Altopiano Carsico di
      Sinjajevina](/lugar/sinjajevina-karst-plateau/) si trova un po' più lontano.
  pt:
    intro: >-
      Para ver a Piva é preciso descer: entra-se por cima, através de um planalto de pastagens e florestas, e
      o rio corre no fundo de um canhão com até 1.200 m de profundidade. O Parque Natural da Piva ocupa o
      extremo noroeste do Montenegro, entre a fronteira com a Bósnia e Herzegovina e o limite do Parque
      Nacional do Durmitor, cobrindo uma parte importante do município de Plužine. É o elo natural entre o
      Durmitor, no Montenegro, e Sutjeska, na Bósnia e Herzegovina.
    landscape: >-
      O relevo é muito variado. Há planaltos de montanha com ricas pastagens e florestas, os profundos canhões
      do Tara, da Piva e do Sušica, e os lagos alpinos Stabanjska e Trnovačko. Pivska Površ, o planalto
      calcário que rodeia o canhão, estende-se entre o Durmitor, Maglić, Lebršnik, Golija e Vojnik. É um
      terreno de dolinas e algares com uma povoação muito dispersa.


      O canhão da Piva abre-se entre Bioč, Volujak, Maglić e Pivska Planina, estendendo-se por cerca de 33 km
      de extensão. Em 1975, a barragem de Mratinje, de 220 m de altura, fechou-o e criou o lago de Piva, o
      segundo maior do Montenegro. O lago inundou a antiga localização do mosteiro de Piva, do século XVI, que
      teve de ser transladado. A jusante, a Piva junta-se ao Tara em Šćepan Polje, na fronteira com a Bósnia e
      Herzegovina, formando ambos o Drina.


      Os ecossistemas mudam com a altitude. Nos cumes e planaltos elevados há flora e fauna alpinas; ao longo
      dos canhões e vales da Piva e do Tara, o ar quente permite a presença de elementos mediterrânicos.
    wildlife: >-
      O parque reúne mais de 1.500 espécies de plantas, das quais mais de 80 estão registadas como raras ou
      ameaçadas, e cerca de 2.000 espécies de fungos. As florestas estão bem conservadas: pinheiro-silvestre e
      pinheiro-negro, faia e abeto, bordo, espruce e freixo.


      Nessas matas vivem o [urso-pardo](/especie/ursus_arctos/), o [javali](/especie/sus_scrofa/) e, nas
      folhosas, o [corço](/especie/capreolus_capreolus/). Os rios Piva e Tara são ricos em truta-fario, tímao
      e no [hucho](/especie/hucho_hucho/). Nos lagos naturais de montanha habitam os tritões, os animais mais
      característicos dos lagos de alta montanha do Montenegro. Segundo o gestor, sobrevivem no parque alguns
      dos últimos representantes de espécies raras e protegidas.
    visit: >-
      A melhor forma de apreciar o parque é subir aos miradouros. O de vrh Soko, a 1.439 m em Crkvičko Polje,
      é alcançado por um trilho fácil de 2,7 km e oferece vistas sobre o planalto de Pivska Planina, o
      Durmitor, Vučevo e parte do canhão da Piva. Em Sokolina a panorâmica é completa: Durmitor, Bioč,
      Volujak, Maglić, Vučevo e Zelengora, com uma vista especial para o canhão do Tara. E um miradouro sobre
      o canhão da Piva fica a cerca de 1,7 km a noroeste da área de descanso de Babići, com vista para a
      barragem.


      Para uma caminhada de meio dia, a rota Stabna–Kručica tem 5,50 km com 720 m de desnível. Enquadra-se na
      categoria de trilhos mais fáceis e é recomendada para principiantes, embora exija condição física média.
      A subida demora cerca de duas horas e vinte minutos. Parte de Stabna, sobe em ziguezague por um fagedo
      em encosta íngreme até à pastagem do pitoresco katun de Stabna. De Kručica um trilho marcado segue para
      norte até ao pico Veliki Vitao, enquanto outro desce para oeste até ao lago grande de Stabna e à aldeia.
      Há também uma rota ciclável de cerca de 21 km ao longo do lago e do canhão da Piva, entre Unač e
      Crkvičko Polje.


      Outra opção exigente parte de Plužine, segue o rio Vrbnica e passa pelos lagos Stabanska até ao lago
      Trnovačko; requer de 5 a 6 horas.
    history: >-
      Cerca de vinte pequenas aldeias com arquitetura tradicional e numerosos katuns pastoris fazem parte da
      paisagem cultural do parque. A pecuária, sobretudo ovina, continua ativa no planalto. A Piva constitui
      também um corredor natural entre os parques nacionais do Durmitor e de Sutjeska.
    before: >-
      Consulte o estado das estradas no sítio web do parque antes de partir, e verifique se existem avisos
      sobre os percursos.
    around: >-
      Contíguos à Piva estão o [Parque Nacional Durmitor - Canhão do Rio
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/), o [Parque Nacional Sutjeska - Maciço de
      Maglić](/lugar/nacionalni-park-sutjeska---maglic/) e a [Floresta Virgem de Perućica - Parque Nacional
      Sutjeska](/lugar/prasuma-perucica---nacionalni-park-sutjeska/). A 1 km ficam o [Parque Nacional Durmitor
      - Maciço Montanhoso](/lugar/nacionalni-park-durmitor---masiv/) e o [Parque Nacional Sutjeska - Montanhas
      de Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/). O [Planalto Cársico de
      Sinjajevina](/lugar/sinjajevina-karst-plateau/) fica um pouco mais afastado.
