unico:
  es: >-
    Un hayedo primario que sobrevivió a las glaciaciones y que hoy se contempla solo desde su borde, mientras
    su interior sigue intacto.
  en: >-
    A primeval beech forest that survived the ice ages, today admired solely from its outer edge while its
    core remains pristine.
  fr: >-
    Une hêtraie primaire ayant survécu aux glaciations, aujourd’hui contemplée uniquement depuis sa lisière
    tandis que son cœur demeure inviolé.
  de: >-
    Ein Buchenurwald, der die Eiszeiten überdauerte und heute ausschließlich von seinem Rand aus betrachtet
    wird, während sein Inneres unberührt bleibt.
  it: >-
    Una faggeta primaria sopravvissuta alle glaciazioni, oggi ammirabile unicamente dal suo margine esterno
    mentre l'interno resta incontaminato.
  pt: >-
    Um faial primário que sobreviveu aos períodos glaciares e que hoje se contempla apenas pela orla, mantendo
    o interior inviolado.
observaciones:
  es: >-
    El interior de Krokar está prohibido. El servicio forestal veta toda visita recreativa dentro de la
    reserva, también el senderismo y la fotografía. Se visita solo por los caminos señalizados, y en Borovec
    debes permanecer en las sendas oficiales. No se permite sacar del bosque plantas, hongos ni recuerdos
    naturales.
texto:
  es:
    intro: >-
      Krokar se mira, no se pisa. El interior de este hayedo primario de Kočevsko está cerrado a toda visita,
      y esa norma es precisamente lo que lo ha mantenido como es: 74,5 hectáreas, la mayor de los seis restos
      de bosque primario de la comarca, en la Eslovenia sudoriental. Lo que sí se puede hacer es rodearlo por
      un sendero señalizado, asomarse al borde y ver desde fuera, entre las hayas monumentales, el resultado
      de miles de años de desarrollo natural sin perturbaciones. La UNESCO lo añadió a su lista del patrimonio
      natural mundial en 2017.
    landscape: >-
      Para entender Krokar hay que retroceder a las edades del hielo. Durante las glaciaciones, el lugar no se
      heló y ofreció un clima favorable: fue un refugio para el haya. De ahí que sus hayedos conserven plantas
      mesófilas que sobrevivieron allí a aquellos tiempos, y de ahí que la expansión del haya tras el hielo se
      considere un proceso que aún continúa.


      El suelo es kárstico, de calizas y dolomías, con un relieve ondulado y lleno de dolinas. Las laderas
      orientales y meridionales de la reserva caen abruptamente hacia el valle del Kolpa. La vegetación
      corresponde al piso montano de hayedos y de bosques mixtos de haya y abeto. En los bordes secos de las
      laderas se sienten a la vez influencias continentales y mediterráneas, y por eso conviven plantas
      alpinas y septentrionales con otras mediterráneas amantes del calor y la sequedad. El clima es
      continental templado, con 1500 mm de lluvia al año y una temperatura media de 7 °C.


      Lo más valioso, sin embargo, es la madera muerta. Un volumen tan alto de árboles caídos da refugio y
      alimento a un enorme número de seres vivos, desde hongos hasta escarabajos y aves.
    wildlife: >-
      La documentación del gestor sitúa en el área a los habitantes típicos de los bosques dináricos: [oso
      pardo](/especie/ursus_arctos/), [lobo](/especie/canis_lupus/) y [lince](/especie/lynx_lynx/). También
      viven aquí el [cárabo uralense](/especie/strix_uralensis/) y el cárabo común, el [pico
      dorsiblanco](/especie/dendrocopos_leucotos/) y su presa, la [rosalía alpina](/especie/rosalia_alpina/),
      un escarabajo.


      En las laderas meridionales de la reserva crían el [águila real](/especie/aquila_chrysaetos/), el
      [halcón peregrino](/especie/falco_peregrinus/) y, cómo no, el cuervo, krokar en esloveno. Durante la
      cría, la restricción de acceso al interior sigue vigente.


      El calendario se disfruta en el circuito de Borovec, en el entorno de Krokar. Al principio de la
      primavera florecen allí los heléboros y, a finales de mayo, la pradera bajo el collado de Krempa se
      llena de narcisos blancos. Son flores del recorrido exterior, no de la reserva.
    visit: >-
      Dos senderos permiten conocer el borde. La Pragozdna pot Krokar, o sendero del bosque primario, es un
      circuito de unos dos kilómetros con 150 m de subida relativamente empinada. Parte de un aparcamiento
      acondicionado bajo la cumbre de Cerk, que es el punto más alto del sendero, y desde ella se ve el bosque
      de Kočevje y el pueblo de Borovec. El otro es la Borovška naravoslovna pot, que sale del panel
      informativo a la entrada de Borovec y mide unos 7,5 km con 280 m de desnivel: sin paradas, unas tres
      horas. Pasa por Ravne pod Cerkom y Krokar hasta el collado de Krempa y vuelve a Borovec, y tiene
      señalización propia, paneles interpretativos y un folleto.


      Cerca está además el sendero de montaña a Firštov rep, con vistas a los roquedos de Krokar y al valle
      del Kolpa.


      Para informarte, el TIC de Kočevska Reka da información y publicaciones gratuitas sobre Kočevsko, y los
      centros Bearlog, Jezero y Kočevska Reka tienen mapas de senderismo.
    history: >-
      La protección fue por pasos. En 1961, el plan forestal reconoció el lugar como bosque de propósito
      especial con el nombre de Ravenski pragozd. En 1991, el municipio de Kočevje lo protegió formalmente. Y
      en 2005 un decreto lo convirtió en reserva forestal estricta.


      El servicio forestal reconoce una carencia: la falta de datos fiables de afluencia dificultaba gestionar
      las visitas. La reserva de Borovec rodea a Krokar con un régimen de protección menos estricto.
    before: >-
      El interior de Krokar está prohibido. El servicio forestal veta toda visita recreativa dentro de la
      reserva, también el senderismo y la fotografía. Se visita solo por los caminos señalizados, y en Borovec
      debes permanecer en las sendas oficiales. No se permite sacar del bosque plantas, hongos ni recuerdos
      naturales.
    around: >-
      El [Parque Nacional Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/) está a 5 km, y el
      [Macizo Forestal de Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/), a 11 km. A 19 km queda el
      [Macizo de Snježnik](/lugar/snjeznik-massif-croatia/); a 20, los [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); y a algo más de veinte kilómetros, el
      [Bosque Virgen de Rajhenavski Rog](/lugar/rajhenavski-rog-virgin-forest/).


      Más lejos, la [Reserva Natural Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) y el
      [Parque Nacional del Bükk](/lugar/bukki-nemzeti-park/) comparten cárabo uralense, rosalía alpina y pico
      dorsiblanco. El [Bosque Primario de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) y el [Bosque
      Primario de Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) coinciden en cárabo común,
      cárabo uralense y halcón peregrino.
  en:
    intro: >-
      Krokar is a forest to admire, not to tread upon. The interior of this virgin beech forest in Kočevsko is
      strictly closed to all visitors, and that exact policy is what has kept it pristine: 74.5 hectares, the
      largest of the six relic primeval forest patches in the region, tucked away in south-eastern Slovenia.
      What you can do is circumnavigate it along a designated perimeter path, peer across the boundary line,
      and gaze from outside between monumental beech trees at the culmination of thousands of years of
      uninterrupted natural succession. UNESCO inscribed it on the World Heritage list in 2017.
    landscape: >-
      To understand Krokar, you must look back to the Ice Age. When vast ice sheets blanketed Europe, this
      refuge escaped glaciation and maintained a sheltered microclimate: it acted as an essential southern
      glacial refugium for European beech. As a result, its woods retain mesophilic forest flora that survived
      those frozen millennia, and the northward post-glacial expansion of beech is regarded as an ecological
      process that continues to this day.


      The terrain is pure karst, sculpted from limestones and dolomites into an undulating plateau peppered
      with sinkholes. The southern and eastern flanks of the reserve plunge precipitously down toward the
      Kolpa River canyon. Vegetation reflects the montane zone of pure beechwoods and mixed beech-fir stands.
      Along dry ridge crests, continental and Mediterranean air masses converge, allowing cold-hardy alpine
      flora to grow alongside heat-loving sub-Mediterranean plants. The climate is temperate continental,
      receiving 1500 mm of annual rainfall with an average temperature of 7 °C.


      The crowning asset, however, is the deadwood. A monumental volume of fallen trunks and standing snags
      provides habitat and nutrients for a myriad of living organisms, from bracket fungi to rare saproxylic
      beetles and cavity-nesting birds.
    wildlife: >-
      Management inventories document iconic denizens of the Dinaric wilderness within the area: [brown
      bear](/especie/ursus_arctos/), [grey wolf](/especie/canis_lupus/), and [Eurasian
      lynx](/especie/lynx_lynx/). The deep woods also shelter the [Ural owl](/especie/strix_uralensis/) and
      tawny owl, the [white-backed woodpecker](/especie/dendrocopos_leucotos/), and its preferred prey, the
      [Rosalia longicorn](/especie/rosalia_alpina/) beetle.


      Along the rugged southern crags breed the [golden eagle](/especie/aquila_chrysaetos/), the [peregrine
      falcon](/especie/falco_peregrinus/), and of course the common raven, known as krokar in Slovene.
      Throughout the breeding season, strict off-limits rules inside the reserve are rigorously enforced.


      The botanical calendar is best experienced on the Borovec circular trail around Krokar. In early spring,
      hellebores push through the leaf litter, and by late May the subalpine meadow beneath the Krempa pass
      transforms into a sea of wild white narcissi. These blooms belong to the outer walking trail, outside
      the virgin reserve itself.
    visit: >-
      Two designated trails allow you to discover the outer boundary. The Pragozdna pot Krokar, or Primeval
      Forest Trail, is a loop of roughly two kilometres with 150 m of relatively steep climbing. It sets out
      from an established car park below the summit of Cerk, which marks the highest point along the trail,
      opening expansive views over the Kočevje forests and the village of Borovec. The other route is the
      Borovška naravoslovna pot, starting at the interpretive board by Borovec: it spans some 7.5 km with 280
      m of vertical ascent, taking about three hours without stops. It threads past Ravne pod Cerkom and
      Krokar toward the Krempa saddle before looping back to Borovec, outfitted with waymarking, interpretive
      panels, and an accompanying guide booklet.


      Nearby you will also find the alpine path to Firštov rep, affording dramatic views over the Krokar
      cliffs and the Kolpa valley.


      For visitor assistance, the TIC in Kočevska Reka provides free maps and guidance for the Kočevsko
      region, while the Bearlog, Jezero, and Kočevska Reka centres stock hiking brochures.
    history: >-
      Formal conservation arrived in successive stages. In 1961, the regional forestry plan recognized the
      forest as a special-purpose woodland under the name Ravenski pragozd. In 1991, the Municipality of
      Kočevje granted it formal statutory protection. And in 2005 a state decree elevated it to a strict
      forest reserve.


      The state forest service notes one historic challenge: the lack of precise visitor counts previously
      hindered tourism flow management. The surrounding Borovec forest reserve encircles Krokar as a buffer
      zone under a less restrictive conservation regime.
    before: >-
      Entering the interior of Krokar is strictly prohibited. The forestry service bans all recreational entry
      into the reserve, including walking, trekking, and photography. You explore solely from marked external
      trails, and around Borovec you must keep to established paths. Removing plants, fungi, or natural
      souvenirs is prohibited.
    around: >-
      [Parque Nacional Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/) lies roughly 5 km away, and
      the [Snežnik Forest Massif](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) sits at 11 km. At 19 km lies
      the [Snježnik Massif](/lugar/snjeznik-massif-croatia/); at 20 km are the [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); and a little over twenty kilometres
      away is the [Bosque Virgen de Rajhenavski Rog](/lugar/rajhenavski-rog-virgin-forest/).


      Further afield, [Reserva Natural Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) and
      [Parque Nacional del Bükk](/lugar/bukki-nemzeti-park/) share the Ural owl, Rosalia longicorn, and
      white-backed woodpecker. [Bosque Primario de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) and
      [Bosque Primario de Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) coincide in tawny owl,
      Ural owl, and peregrine falcon.
  fr:
    intro: >-
      Krokar se contemple sans s'y aventurer. L'intérieur de cette hêtraie primaire de Kočevsko est
      rigoureusement interdit à toute visite, et cette règle stricte a justement permis de préserver son
      intégrité : 74,5 hectares, le plus vaste des six îlots reliques de forêt primaire de la contrée, dans le
      sud-est de la Slovénie. Vous pouvez en faire le tour grâce à un sentier balisé, vous approcher de sa
      lisière et admirer depuis l'extérieur, entre les troncs de hêtres séculaires, l'aboutissement de
      millénaires de dynamique forestière ininterrompue. L'UNESCO l'a inscrite au patrimoine mondial naturel
      en 2017.
    landscape: >-
      Pour appréhender Krokar, il convient de remonter aux âges glaciaires. Lors des grandes glaciations
      quaternaires, le site échappa au gel permanent grâce à un microclimat clément : il constitua un refuge
      biogéographique capital pour le hêtre européen. C'est pourquoi ses hêtraies abritent encore des espèces
      végétales mésophiles ayant traversé ces millénaires glaciaires, et pourquoi la recolonisation
      postglaciaire du hêtre vers le nord de l'Europe est considérée comme un processus vivant qui se poursuit
      sous nos yeux.


      Le sol karstique s'est formé sur des calcaires et dolomies, sculptant un plateau vallonné creusé de
      nombreuses dolines. Les versants sud et est de la réserve plongent abruptement vers la vallée de la
      Kolpa. La flore relève de l'étage montagnard des hêtraies pures et des forêts mixtes de hêtres et de
      sapins. Sur les rebords secs des versants s'entrecroisent influences continentales et méditerranéennes :
      des espèces alpines et boréales côtoient ainsi des éléments subméditerranéens thermophiles. Le climat
      est continental tempéré, avec 1500 mm de précipitations annuelles et une température moyenne de 7 °C.


      Le trésor suprême du site réside dans son volume de bois mort. Cette masse considérable de fûts abattus
      offre un gîte et des ressources nutritives à une myriade d'êtres vivants, des champignons lignicoles aux
      coléoptères et oiseaux cavernicoles.
    wildlife: >-
      Les inventaires du parc attestent la présence des grands mammifères emblématiques des forêts dinariques
      : l'[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/) et le [lynx
      boréal](/especie/lynx_lynx/). La réserve abrite également la [chouette de
      l'Oural](/especie/strix_uralensis/) et la chouette hulotte, le [pic à dos
      blanc](/especie/dendrocopos_leucotos/) ainsi que la [rosalie des Alpes](/especie/rosalia_alpina/),
      coléoptère longicorne remarquable.


      Sur les escarpements méridionaux nichent l'[aigle royal](/especie/aquila_chrysaetos/), le [faucon
      pèlerin](/especie/falco_peregrinus/) et naturellement le grand corbeau, nommé krokar en slovène. En
      période de reproduction, l'interdiction d'accès à l'intérieur du sanctuaire s'applique avec une rigueur
      absolue.


      Le calendrier floristique s'apprécie sur le sentier circulaire de Borovec autour du périmètre protégé.
      Au début du printemps s'épanouissent les hellébores et, fin mai, la prairie située sous le col de Krempa
      se couvre de narcisses des poètes. Ces floraisons s'observent sur le parcours extérieur, jamais au cœur
      de la réserve.
    visit: >-
      Deux itinéraires balisés longent la lisière de la réserve. Le sentier de la forêt primaire (Pragozdna
      pot Krokar) est une boucle d'environ deux kilomètres affichant 150 m d'ascension soutenue. Il démarre
      depuis une aire de stationnement aménagée sous le sommet du Cerk, point culminant du parcours offrant
      une vue dégagée sur les forêts de Kočevje et le village de Borovec. L'autre itinéraire est le sentier
      didactique de Borovec (Borovška naravoslovna pot), qui s'amorce au niveau du panneau d'accueil à
      l'entrée de Borovec et parcourt environ 7,5 km pour 280 m de dénivelé, soit près de trois heures de
      marche sans halte. Il franchit Ravne pod Cerkom et Krokar jusqu'au col de Krempa avant de regagner
      Borovec, doté d'un balisage propre, de panneaux explicatifs et d'un livret pédagogique.


      À proximité s'ouvre également le sentier d'altitude menant à Firštov rep, avec un panorama sur les
      falaises de Krokar et les gorges de la Kolpa.


      Pour vos préparatifs, l'office de tourisme (TIC) de Kočevska Reka propose informations et cartographie
      sur le territoire de Kočevsko, relayé par les centres d'accueil Bearlog, Jezero et Kočevska Reka.
    history: >-
      La protection s'est établie par étapes successives. En 1961, l'aménagement forestier reconnut le massif
      comme forêt à vocation spéciale sous le nom de Ravenski pragozd. En 1991, la commune de Kočevje lui
      conféra une protection juridique officielle. Puis, en 2005, un décret ministériel consacra son statut de
      réserve forestière intégrale.


      Les services forestiers soulignent une difficulté historique : l'absence d'estimations précises de
      fréquentation compliquait autrefois la gestion des flux. La réserve de Borovec entoure aujourd'hui
      Krokar en constituant une zone tampon au statut plus souple.
    before: >-
      L'accès à l'intérieur de Krokar est strictement interdit. L'administration forestière prohibe
      formellement toute incursion récréative, y compris la randonnée hors trace et la photographie au cœur du
      sous-bois. La visite s'effectue exclusivement depuis les sentiers balisés, et à Borovec vous devez
      demeurer sur les voies officielles. Il est défendu de prélever végétaux, champignons ou tout élément
      naturel.
    around: >-
      Le [Parque Nacional Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/) est à 5 km, et le
      [Massif forestier de Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) à 11 km. À 19 km se dresse
      le [Massif du Snježnik](/lugar/snjeznik-massif-croatia/) ; à 20 km les [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/) ; et à un peu plus de vingt kilomètres
      s'étend le [Bosque Virgen de Rajhenavski Rog](/lugar/rajhenavski-rog-virgin-forest/).


      Plus au loin, la [Reserva Natural Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) et le
      [Parque Nacional del Bükk](/lugar/bukki-nemzeti-park/) partagent la chouette de l'Oural, la rosalie des
      Alpes et le pic à dos blanc. Le [Bosque Primario de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/)
      et le [Bosque Primario de Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) réunissent la
      chouette hulotte, la chouette de l'Oural et le faucon pèlerin.
  de:
    intro: >-
      Krokar betrachtet man, man betritt ihn nicht. Das Innere dieses Buchenurwalds in der Region Kočevsko ist
      für Besucher ausnahmslos gesperrt, und genau diese Regelung hat ihn unberührt bewahrt: 74,5 Hektar, der
      größte der sechs Urwaldreste des Gebiets, verborgen im Südosten Sloweniens. Möglich ist hingegen eine
      Umrundung auf einem markierten Rundweg, der es dir erlaubt, an die Außengrenze heranzutreten und
      zwischen monumentalen Buchen das Ergebnis jahrtausendelanger ungestörter Waldentwicklung zu bestaunen.
      Die UNESCO nahm das Areal 2017 in das Weltnaturerbe auf.
    landscape: >-
      Um Krokar zu verstehen, muss man bis in die Eiszeiten zurückblicken. Während Mitteleuropa unter
      Eisdecken lag, blieb diese Region unvergletschert und bot ein geschütztes Mikroklima: Sie diente als
      lebenswichtiges Refugium für die Rotbuche. Deshalb beherbergen die Buchenwälder bis heute mesophile
      Pflanzenarten, die dort jene Kaltzeiten überlebten, und die nacheiszeitliche Ausbreitung der Buche gilt
      als ein Prozess, der bis in die Gegenwart fortdauert.


      Der Untergrund ist reiner Karst aus Kalkstein und Dolomit, geprägt von einem welligen Plateau mit
      zahlreichen Dolinen. Die südlichen und östlichen Hänge des Reservats fallen steil zur Schlucht des
      Flusses Kolpa ab. Die Vegetation entspricht der montanen Stufe reiner Buchenwälder sowie
      Buchen-Tannen-Mischbestände. An den trockenen Hangkanten treffen kontinentale und mediterrane Einflüsse
      aufeinander, sodass alpine und nordische Pflanzenarten in unmittelbarer Nachbarschaft zu wärmeliebenden
      submediterranen Arten gedeihen. Das Klima ist gemässigt kontinental mit 1500 mm Jahresniederschlag und
      einer Durchschnittstemperatur von 7 °C.


      Der größte ökologische Reichtum liegt im Totholz. Gewaltige Mengen stehender und liegender Stämme bieten
      unzähligen Lebewesen Nahrung und Schutz, von Pilzen über Totholzkäfer bis hin zu Höhlenbrütern.
    wildlife: >-
      Forstliche Erhebungen belegen im Gebiet die Leitarten der dinarischen Bergwälder:
      [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und [Eurasischer
      Luchs](/especie/lynx_lynx/). Ebenso leben hier [Habichtskauz](/especie/strix_uralensis/) und Waldkauz,
      der [Weißrückenspecht](/especie/dendrocopos_leucotos/) sowie der [Alpenbock](/especie/rosalia_alpina/),
      ein farbenprächtiger Totholzkäfer.


      An den steilen Südwänden brüten [Steinadler](/especie/aquila_chrysaetos/),
      [Wanderfalke](/especie/falco_peregrinus/) und der Kolkrabe, der auf Slowenisch krokar heißt und dem Wald
      seinen Namen gab. Zur Brutzeit wird das Betretungsverbot der Kernzone besonders scharf kontrolliert.


      Die botanische Pracht zeigt sich am Rundweg von Borovec außerhalb des Reservats. Im zeitigen Frühjahr
      blühen die Christrosen, und Ende Mai verwandelt sich die Bergwiese unterhalb des Krempa-Sattels in ein
      Meer aus weißen Dichternarzissen. Diese Blütenmeere säumen den Außenweg, liegen jedoch außerhalb des
      Schutzgebiets.
    visit: >-
      Zwei Wanderwege erschließen die Außengrenze. Der Urwaldpfad (Pragozdna pot Krokar) ist ein Rundkurs von
      rund zwei Kilometern Länge mit 150 m steilem Anstieg. Er beginnt an einem Wanderparkplatz unterhalb des
      Cerk-Gipfels, dem höchsten Punkt des Pfades, und eröffnet weite Blicke auf das Waldland von Kočevje und
      das Dorf Borovec. Die zweite Route ist der Borovec-Naturlehrpfad (Borovška naravoslovna pot) ab der
      Infotafel in Borovec: Er misst etwa 7,5 km bei 280 m Höhenunterschied und erfordert rund drei Stunden
      Gehzeit. Er führt über Ravne pod Cerkom und Krokar zum Krempa-Sattel und zurück nach Borovec, versehen
      mit Wegweisern, Schautafeln und einer Begleitbroschüre.


      In der Nähe führt zudem ein Steig zum Felsvorsprung Firštov rep mit Tiefblicken auf die Krokar-Felswände
      und ins Kolpa-Tal.


      Für Auskünfte hält das Informationszentrum TIC in Kočevska Reka Karten und Broschüren zur Region
      Kočevsko bereit, ergänzt durch die Besucherzentren Bearlog, Jezero und Kočevska Reka.
    history: >-
      Der Schutzstatus entwickelte sich stufenweise. 1961 wies der forstliche Wirtschaftsplan das Waldgebiet
      unter dem Namen Ravenski pragozd als Wald mit Sonderstatus aus. 1991 stellte die Gemeinde Kočevje das
      Gebiet förmlich unter Schutz, und 2005 erhob ein Regierungsdekret das Areal zum strengen Waldreservat.


      Die Forstverwaltung räumt ein früheres Manko ein: Fehlende verlässliche Besucherdaten erschwerten einst
      die gezielte Besucherlenkung. Das Reservat Borovec schützt das Umland von Krokar als Pufferzone mit
      weniger strengen Auflagen.
    before: >-
      Das Betreten des Urwalds Krokar ist strikt untersagt. Die Forstverwaltung untersagt jegliche
      Freizeitnutzung im Inneren, einschließlich Wandern und Naturfotografie. Der Besuch darf ausschließlich
      auf den markierten Außenpfaden erfolgen, und im Umfeld von Borovec musst du auf den offiziellen Wegen
      bleiben. Das Entnehmen von Pflanzen, Pilzen oder Mineralien ist verboten.
    around: >-
      Der [Parque Nacional Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/) liegt 5 km entfernt,
      das Waldgebiet [Snežnik-Waldmassiv](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) 11 km. Nach 19 km
      erreichst du das Massiv [Snježnik-Massiv](/lugar/snjeznik-massif-croatia/), nach 20 km die [Bosques y
      Meseta Kárstica de Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/), und in etwas mehr
      als zwanzig Kilometern Entfernung liegt der [Bosque Virgen de Rajhenavski
      Rog](/lugar/rajhenavski-rog-virgin-forest/).


      Unter den weit entfernten Urwäldern teilen das [Reserva Natural Estricta
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) und der [Parque Nacional del
      Bükk](/lugar/bukki-nemzeti-park/) Habichtskauz, Alpenbock und Weißrückenspecht. Der [Bosque Primario de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) und [Bosque Primario de Groșii
      Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) beherbergen Waldkauz, Habichtskauz und
      Wanderfalke.
  it:
    intro: >-
      Krokar si contempla, non si calpesta. L'interno di questa faggeta primaria di Kočevsko è rigorosamente
      chiuso al pubblico, ed è proprio questo divieto che ne ha custodito l'integrità originaria: 74,5 ettari,
      il più esteso dei sei lembi relitti di foresta primaria del comprensorio, nella Slovenia sudorientale.
      Ciò che puoi fare è costeggiarla lungo un sentiero segnato, affacciarti sul margine e scorgere
      dall'esterno, tra faggi monumentali, il compimento di millenni di evoluzione naturale indisturbata.
      L'UNESCO l'ha inserita nel Patrimonio Mondiale Naturale nel 2017.
    landscape: >-
      Per comprendere Krokar occorre risalire alle ere glaciali. Durante le glaciazioni l'area non fu
      investita dai ghiacci e mantenne un microclima favorevole, costituendo un fondamentale rifugio glaciale
      per il faggio europeo. Ecco perché queste faggete conservano elementi floristici mesofili che vi hanno
      superato quelle epoche remote, e la ricolonizzazione del faggio verso nord viene considerata un fenomeno
      biologico tuttora attivo.


      Il substrato geologico è carsico, formato da calcari e dolomie con una morfologia ondulata e costellata
      di doline. I versanti meridionali e orientali della riserva precipitano verso la gola del fiume Kolpa.
      La copertura vegetale appartiene al piano montano delle faggete pure e miste ad abete bianco. Lungo i
      crinali asciutti si incontrano influenze continentali e mediterranee: specie alpine e boreali crescono
      accanto a piante submediterranee eliofile. Il clima è continentale temperato, con 1500 mm di
      precipitazioni annue e una temperatura media di 7 °C.


      Il valore ecologico supremo risiede tuttavia nel legno morto. L'abbondanza di tronchi caduti o
      disseccati offre rifugio e nutrimento a una sterminata comunità biologica, dai funghi ai coleotteri
      saproxilici e agli uccelli nidificanti.
    wildlife: >-
      I censimenti dei guardaparco documentano le specie simbolo dei massicci dinarici: [orso
      bruno](/especie/ursus_arctos/), [lupo grigio](/especie/canis_lupus/) e [lince
      euroasiatica](/especie/lynx_lynx/). Nella foresta vivono anche l'[allocco degli
      Urali](/especie/strix_uralensis/) e l'allocco comune, il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/) e la sua preda d'elezione, la [rosalia
      alpina](/especie/rosalia_alpina/), spettacolare cerambicide.


      Sui contrafforti rocciosi nidificano l'[aquila reale](/especie/aquila_chrysaetos/), il [falco
      pellegrino](/especie/falco_peregrinus/) e il corvo imperiale, krokar in lingua slovena. Nella stagione
      riproduttiva il divieto di accesso all'interno della riserva viene applicato con estremo rigore.


      Il calendario delle fioriture si apprezza sull'anello escursionistico di Borovec all'esterno di Krokar.
      All'inizio della primavera sbocciano gli ellebori e, a fine maggio, i prati sotto il colle di Krempa si
      ammantano di narcisi bianchi. Sono fioriture che costeggiano il tracciato esterno, fuori dalla riserva
      integrale.
    visit: >-
      Due percorsi consentono di costeggiare il margine della foresta. Il sentiero della foresta primaria
      (Pragozdna pot Krokar) è un anello di circa due chilometri con 150 m di salita decisa. Prende avvio da
      un parcheggio sotto la vetta del Cerk, punto più alto del percorso, da cui la vista spazia sulle foreste
      di Kočevje e sul borgo di Borovec. Il secondo tracciato è il sentiero naturalistico di Borovec (Borovška
      naravoslovna pot), che si diparte dal pannello all'ingresso di Borovec: misura circa 7,5 km con 280 m di
      dislivello per una camminata di circa tre ore. Raggiunge Ravne pod Cerkom e Krokar fino al passo di
      Krempa tornando a Borovec, provvisto di segnaletica dedicata, bacheche didattiche e guida cartacea.


      Nelle vicinanze si dirama anche l'ardito sentiero verso Firštov rep, con scorci sulle falesie di Krokar
      e sul canyon del Kolpa.


      Per organizzare l'escursione, il punto informativo TIC di Kočevska Reka fornisce mappe e dettagli sulla
      zona di Kočevsko, coadiuvato dai centri di accoglienza Bearlog, Jezero e Kočevska Reka.
    history: >-
      La tutela si è consolidata per gradi. Nel 1961 la pianificazione forestale ha classificato il
      comprensorio come bosco a destinazione speciale sotto la denominazione di Ravenski pragozd. Nel 1991 il
      comune di Kočevje lo ha posto formalmente sotto tutela. Nel 2005 un decreto statale lo ha convertito in
      riserva forestale integrale.


      Il servizio forestale evidenzia una criticità passata: la carenza di dati quantitativi sui flussi
      rendeva difficile gestire gli accessi. La confinante riserva di Borovec cinge Krokar fungendo da zona
      cuscinetto a minor vincolo.
    before: >-
      L'accesso all'interno di Krokar è severamente interdetto. Il corpo forestale proibisce qualunque
      fruizione ricreativa nella riserva, incluse escursioni a piedi e riprese fotografiche. La visita è
      consentita unicamente lungo i tracciati segnati esterni, e nell'area di Borovec devi mantenerti sui
      percorsi ufficiali. È vietato raccogliere piante, funghi o reperti naturali.
    around: >-
      Il [Parque Nacional Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/) dista 5 km, e il
      [Massiccio forestale di Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) 11 km. A 19 km si
      incontra il [Massiccio del Snježnik](/lugar/snjeznik-massif-croatia/); a 20 km i [Bosques y Meseta
      Kárstica de Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); e a poco più di venti
      chilometri la foresta vergine [Bosque Virgen de Rajhenavski Rog](/lugar/rajhenavski-rog-virgin-forest/).


      Tra i siti remoti, la [Reserva Natural Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/)
      e il [Parque Nacional del Bükk](/lugar/bukki-nemzeti-park/) condividono allocco degli Urali, rosalia
      alpina e picchio dorsobianco. Il [Bosque Primario de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) e il [Bosque Primario de Groșii
      Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) annoverano allocco comune, allocco degli Urali e
      falco pellegrino.
  pt:
    intro: >-
      Krokar é para ser contemplado, não pisado. O coração deste faial primitivo de Kočevsko está
      expressamente interdito a visitas, e essa interdição estrita foi precisamente o garante da sua
      conservação: 74,5 hectares, o maior dos seis núcleos relíquias de floresta primária da comarca, situado
      no sudeste da Eslovénia. O que podes fazer é contorná-lo ao longo de um trilho balizado, aproximar-te da
      orla e admirar de fora, entre faias monumentais, a obra de milénios de dinâmica florestal sem
      perturbações. A UNESCO integrou-o na lista do património mundial natural em 2017.
    landscape: >-
      Para compreender Krokar impõe-se recuar até às eras glaciares. Durante as glaciações a zona não congelou
      e manteve condições amenas: serviu de refúgio vital para a faia-europeia. Por esse motivo, os seus
      bosques acolhem flora herbácea mesófila que sobreviveu a esses rigores climáticos, considerando-se a
      reconquista da faia rumo ao norte da Europa um processo biológico ainda em curso.


      A geologia é tipicamente cársica, assente em calcários e dolomitos, compondo um relevo ondulado semeado
      de dolinas. As vertentes sul e este da reserva precipitam-se vertiginosamente rumo ao vale do rio Kolpa.
      A vegetação enquadra-se no andar montano de faiais puros e de matas mistas de faia e abeto. Nas cristas
      secas cruzam-se influências continentais e mediterrânicas: plantas alpinas e setentrionais convivem com
      espécies submediterrânicas adaptadas ao calor e à secura. O clima é temperado continental, com 1500 mm
      de precipitação anual e temperatura média de 7 °C.


      O expoente de conservação reside na madeira morta. Um volume colossal de árvores tombadas garante
      alimento e abrigo a uma multidão de seres vivos, desde fungos saprófitas a escaravelhos e aves de
      cavidade.
    wildlife: >-
      Os registos oficiais apontam para a presença dos grandes mamíferos dos bosques dináricos:
      [urso-pardo](/especie/ursus_arctos/), [lobo-cinzento](/especie/canis_lupus/) e
      [lince-euroasiático](/especie/lynx_lynx/). Habitam igualmente a área a
      [coruja-dos-urais](/especie/strix_uralensis/) e a coruja-do-mato, o
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/) e a sua presa associada, a
      [rosália-alpina](/especie/rosalia_alpina/), um escaravelho de antenas longas.


      Nas escarpas meridionais nidificam a [águia-real](/especie/aquila_chrysaetos/), o
      [falcão-peregrino](/especie/falco_peregrinus/) e o corvo-comum, denominado krokar em esloveno. Na época
      de reprodução, a interdição de acesso ao interior é vigiada com particular rigor.


      A sequência vegetal desfruta-se no percurso circular de Borovec em redor da reserva. No início da
      primavera despontam os heléboros e, em finais de maio, a campina sob o colo de Krempa cobre-se de
      narcisos brancos. São florações do percurso exterior, situadas fora da mancha primitiva.
    visit: >-
      Dois percursos balizados permitem contornar a reserva. O trilho da mata primária (Pragozdna pot Krokar)
      é um circuito com cerca de dois quilómetros e 150 m de subida íngreme. Tem início num parque de merendas
      sob o pico de Cerk, o ponto mais alcantilado da rota, de onde se abrem vistas sobre os bosques de
      Kočevje e a aldeia de Borovec. O outro é o trilho naturalista de Borovec (Borovška naravoslovna pot),
      que parte do painel à entrada de Borovec e percorre cerca de 7,5 km com 280 m de desnível, totalizando
      cerca de três horas de marcha contínua. Passa por Ravne pod Cerkom e Krokar até ao colo de Krempa antes
      de regressar a Borovec, dispondo de marcas próprias, painéis e folheto desdobrável.


      Nas imediações existe ainda o trilho de montanha para Firštov rep, com perspetivas panorâmicas sobre as
      arribas de Krokar e as gargantas do rio Kolpa.


      Para apoio aos visitantes, o posto de turismo (TIC) de Kočevska Reka faculta publicações gratuitas sobre
      Kočevsko, a par dos centros Bearlog, Jezero e Kočevska Reka.
    history: >-
      O estatuto protetor consolidou-se em várias etapas. Em 1961, o plano florestal declarou a área como
      floresta de finalidade especial com a designação de Ravenski pragozd. Em 1991, o município de Kočevje
      conferiu-lhe proteção jurídica formal. E em 2005 um diploma estatal converteu-a em reserva florestal
      estrita.


      Os serviços florestais reconhecem uma dificuldade passada: a ausência de registos precisos de afluência
      complicava a gestão da visitação. A reserva de Borovec circunda Krokar atuando como zona-tampão com
      regulamentação mais flexível.
    before: >-
      A entrada no interior de Krokar é absolutamente proibida. A administração florestal interdita qualquer
      presença recreativa na reserva, incluindo passeios pedestres e fotografia de natureza. A visita
      restringe-se aos trilhos balizados periféricos, e em Borovec deves manter-te nos caminhos oficiais. É
      proibido recolher plantas, cogumelos ou recordações naturais.
    around: >-
      O [Parque Nacional Risnjak](/lugar/nacionalni-park-risnjak---sumski-kompleks/) fica a 5 km, e o [Maciço
      florestal de Snežnik](/lugar/snezniski-gozdni-masiv-veliki-sneznik/) a 11 km. A 19 km situa-se o [Maciço
      de Snježnik](/lugar/snjeznik-massif-croatia/); a 20 km os [Bosques y Meseta Kárstica de
      Javorniki](/lugar/javorniski-gozdovi-karstna-planota-javorniki/); e a pouco mais de vinte quilómetros a
      mata virgem [Bosque Virgen de Rajhenavski Rog](/lugar/rajhenavski-rog-virgin-forest/).


      Mais distante, a [Reserva Natural Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) e o
      [Parque Nacional del Bükk](/lugar/bukki-nemzeti-park/) partilham a coruja-dos-urais, a rosália-alpina e
      o pica-pau-de-dorso-branco. O [Bosque Primario de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) e
      o [Bosque Primario de Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) coincidem na
      coruja-do-mato, coruja-dos-urais e falcão-peregrino.
