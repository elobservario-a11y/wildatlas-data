unico:
  es: >-
    Una cresta caliza de 14 km donde las gargantas, las cuevas y los murciélagos caben en el parque nacional
    más pequeño del país.
  en: >-
    A 14 km limestone crest where gorges, caverns, and bat colonies find shelter in the country's smallest
    national park.
  fr: >-
    Une crête calcaire de 14 km où gorges, grottes et chauves-souris s'abritent dans le plus petit parc
    national du pays.
  de: >-
    Ein 14 km langer Kalkkamm, in dem Schluchten, Höhlen und Fledermauskolonien im kleinsten Nationalpark des
    Landes Platz finden.
  it: >-
    Una cresta calcarea di 14 km dove forre, caverne e pipistrelli trovano rifugio nel parco nazionale più
    piccolo del paese.
  pt: >-
    Uma crista calcária de 14 km onde desfiladeiros, grutas e morcegos encontram abrigo no mais pequeno parque
    nacional do país.
observaciones:
  es: >-
    Para visitar el parque hace falta la entrada de visitante, y solo se permite visitar por senderos
    turísticos marcados. Acampar solo se permite en emplazamientos señalizados y designados. Los perros solo
    pueden entrar siempre con correa. Está prohibido talar, quemar o dañar el pino rastrero y el enebro, y
    recoger setas, plantas, animales o rocas con fines comerciales sin permiso del parque. A la cueva de los
    Murciélagos lleva tu propia luz.
texto:
  es:
    intro: >-
      Una cresta de caliza de unos 14 km, cortada por cuatro ríos que han abierto gargantas, y todo ello en
      4.186 hectáreas. Buila-Vânturarița es el parque nacional más pequeño de Rumanía, y reúne cresta,
      gargantas, cuevas y claros de montaña.


      Está en el oeste del condado de Vâlcea, en el sur de los montes Căpățânii, en los términos de Costești,
      Bărbătești y Băile Olănești. Se declaró área protegida por la Hotărârea de Guvern 2151 del 30 de
      noviembre de 2004.
    landscape: >-
      La cresta principal tiene unos 14 km; los ríos Bistrița, Costești, Cheia y Olănești la cortan con
      gargantas y separan dos macizos, Arnota al suroeste y Stogu al noreste. Las cotas por encima de 1800 m
      ocupan solo dos pequeñas áreas centrales, en torno a las cimas Buila y Vânturarița, y la altitud llega a
      1885 m, con la vegetación escalonada por pisos.


      El macizo forma parte de la Pânză Getică, de los Cárpatos Meridionales, y su sucesión sedimentaria
      incluye depósitos del Jurásico superior y el Cretácico inferior. Bajo la superficie, el karst hace el
      resto: el macizo contiene más de cien cuevas y varios pozos kársticos, y los ríos Bistrița y Costești
      abrieron las gargantas del suroeste.


      El clima ayuda a la flora. Es más suave en las laderas sudeste, con rasgos submediterráneos por el
      fuerte soleamiento y el calor que almacena la caliza. El relieve accidentado de la cresta impidió
      sustituir la vegetación natural por cultivos. Se han identificado 17 tipos de hábitat con
      correspondencia europea, algunos prioritarios. En el piso subalpino dominan los pastos de roquedo con la
      Dryas octopetala y una sabina, y entre las especies amenazadas del macizo está el edelweiss.
    wildlife: >-
      El mundo de las cuevas es el protagonista. La Peștera Liliecilor, la cueva de los Murciélagos, alberga
      una colonia en la Sala Liliecilor y tiene fauna subterránea importante. Una especie, Miniopterus
      schreibersi, permanece todo el año en la cueva; otras acuden en invierno o para reproducirse. Se citan
      Rhinolophus ferrumequinum, Vespertilio pipistrellus, Plecotus auritus, Barbastella barbastellus, Myotis
      myotis y Myotis oxygnathus.


      Fuera, entre los mamíferos de interés figuran el [oso](/especie/ursus_arctos/) pardo, el
      [lobo](/especie/canis_lupus/), el [lince](/especie/lynx_lynx/) boreal, la barbastela y el murciélago
      ratonero mediano. Entre las plantas raras hay la zapatilla de dama, una campanilla de montaña y la
      ligularia siberiana. Cerca de Prislop hay un claro con muchas campanillas de primavera (Leucojum
      vernum). El sapo de vientre amarillo figura entre los anfibios de interés.
    visit: >-
      El parque tiene seis puntos de entrada. Desde esos accesos salen los caminos a los eremitorios. Desde el
      final de la pista de Bărbătești, por el valle del Otăsău, un sendero lleva en una hora al eremitorio de
      Pătrunsa. Desde Băile Olănești, por el valle de Cheia, se pasa el eremitorio de Iezer (3 km) y se sigue
      hasta el de Pahomie (8 km). Cheile Cheia es una de las gargantas más estrechas y salvajes del país, con
      dos cuevas, Peștera cu Lac y Peștera Laleaua Verde.


      La Peștera Liliecilor se visita desde el monasterio de Bistrița: desde la parte trasera, una senda con
      barandillas llega a la entrada accesible de la cueva en unos quince minutos. Solo la entrada sur es
      accesible, la cavidad está parcialmente electrificada y requiere una fuente de luz. Tiene tres entradas
      orientadas al este y unos 400 m de desarrollo, a 630 m de altitud, en la ladera derecha de las gargantas
      de Bistrița. Si no puedes ir, existe una visita virtual de la cueva de los Murciélagos y de las iglesias
      rupestres de su interior.
    history: >-
      La cueva tiene su historia: la primera mención especializada data de 1929 y hubo estudios
      biospeleológicos en 1951 y 1955. En las montañas, los eremitorios cuentan otra. El de Pahomie lo levantó
      hacia 1519-1520 el gran ban Barbu Craiovescu, y el de Pătrunsa se construyó en 1740 donde, según la
      tradición, nació el obispo Climent.
    before: >-
      Para visitar el parque hace falta la entrada de visitante, y solo se permite visitar por senderos
      turísticos marcados. Acampar solo se permite en emplazamientos señalizados y designados. Los perros solo
      pueden entrar siempre con correa. Está prohibido talar, quemar o dañar el pino rastrero y el enebro, y
      recoger setas, plantas, animales o rocas con fines comerciales sin permiso del parque. A la cueva de los
      Murciélagos lleva tu propia luz.
    around: >-
      A cuatro kilómetros está el [Parque Nacional Cozia - Bosques
      Primarios](/lugar/parcul-national-cozia---codrii-seculari/), a diecisiete las [Montañas de
      Parâng](/lugar/muntii-parang/) y a veintidós la [Reserva forestal de
      Latorița](/lugar/codrul-secular-latorita/). Más lejos, la [Garganta de
      Vârghiș](/lugar/cheile-varghisului/) y el [Parque Nacional Domogled - Valle del
      Cerna](/lugar/parcul-national-domogled---valea-cernei/) comparten con Buila los murciélagos de cueva,
      como el ratonero grande y la herradura grande.
  en:
    intro: >-
      A razor-like limestone ridge spanning 14 km, breached by four rivers creating dramatic defiles, all
      contained within 4,186 hectares. Buila-Vânturarița is Romania's smallest national park, uniting rocky
      crests, gorges, caverns, and secluded alpine clearings.


      It lies in western Vâlcea County, south of the Căpățânii Mountains, within the administrative boundaries
      of Costești, Bărbătești, and Băile Olănești. It was officially declared a protected area under
      Government Decision 2151 on 30 November 2004.
    landscape: >-
      The main ridge extends for some 14 km; the Bistrița, Costești, Cheia, and Olănești rivers slice across
      it with steep gorges, demarcating two sub-massifs: Arnota to the southwest and Stogu to the northeast.
      Elevations exceeding 1800 m are confined to two small central sectors around Buila and Vânturarița
      peaks, rising to 1885 m with distinct altitudinal vegetation belts.


      The range forms part of the Getic Nappe in the Southern Carpathians, its stratigraphic succession
      featuring Upper Jurassic and Lower Cretaceous limestone beds. Subterranean karst completes the
      topography: the massif contains more than a hundred caves and several vertical pits, with the Bistrița
      and Costești rivers incising the southwestern ravines.


      Climate nurtures varied flora: southeastern slopes experience milder microclimates with
      sub-Mediterranean traits due to intense solar exposure and limestone heat retention. The rugged terrain
      prevented conversion to arable land. Surveys have identified 17 European-priority habitat types. The
      subalpine belt is dominated by scree and cliff grasslands hosting Dryas octopetala and savin juniper,
      with edelweiss gracing sheer cliffs.
    wildlife: >-
      The subterranean realm commands ecological attention. Peștera Liliecilor (Bats' Cave) houses a large
      nursery and hibernation colony in the Sala Liliecilor, sheltering specialized troglobitic fauna.
      Miniopterus schreibersi resides in the cave year-round, while other species gather for hibernation or
      breeding. Surveys confirm Rhinolophus ferrumequinum, Vespertilio pipistrellus, Plecotus auritus,
      Barbastella barbastellus, Myotis myotis, and Myotis oxygnathus.


      Above ground, mammalian predators include the [brown bear](/especie/ursus_arctos/), [grey
      wolf](/especie/canis_lupus/), and [Eurasian lynx](/especie/lynx_lynx/), alongside the barbastelle and
      lesser mouse-eared bat. Rare plants include lady's slipper orchid, alpine bellflower, and Siberian
      ligularia. Near Prislop, a forest glade hosts abundant spring snowflakes (Leucojum vernum).
      Yellow-bellied toads are common amphibians.
    visit: >-
      Six formal gateways grant access to the park, serving as trailheads leading to historic mountain
      hermitages. From the roadhead in Bărbătești, a path follows Otăsău valley, reaching Pătrunsa hermitage
      in one hour. From Băile Olănești, ascending Cheia valley leads past Iezer hermitage (3 km) onward to
      Pahomie hermitage (8 km). Cheile Cheia represents one of Romania's narrowest and wildest canyons,
      sheltering Peștera cu Lac and Peștera Laleaua Verde.


      Peștera Liliecilor is visited from Bistrița Monastery: from the rear grounds, a railed path leads to the
      accessible cave entrance in about fifteen minutes. Only the southern portal is accessible; the cavern is
      partially electrified and requires a headlamp. It features three east-facing portals and roughly 400 m
      of passageways at 630 m altitude on the right flank of Bistrița Gorge. A virtual tour exists for
      exploring the cave and rupestrian chapels remotely.
    history: >-
      The cavern boasts historical pedigree: initial biospeleological citations date from 1929, followed by
      scientific expeditions in 1951 and 1955. High in the mountains, hermitages tell another tale: Pahomie
      Hermitage was founded around 1519-1520 by the Great Ban Barbu Craiovescu, while Pătrunsa was built in
      1740 on the spot where Bishop Climent was traditionally born.
    before: >-
      Park entry requires a visitor ticket, and travel is restricted to marked hiking trails. Camping is
      allowed exclusively in designated, signed campgrounds. Dogs must remain leashed. Damaging dwarf pine or
      juniper is prohibited, as is picking mushrooms, herbs, or collecting rocks commercially without
      authorization. Bring a headlamp for Bats' Cave.
    around: >-
      Four kilometres away is [Cozia National Park - Primeval
      Woodlands](/lugar/parcul-national-cozia---codrii-seculari/), seventeen kilometres away rise the [Parâng
      Mountains](/lugar/muntii-parang/), and twenty-two kilometres away lies the [Latorița Forest
      Reserve](/lugar/codrul-secular-latorita/). Farther afield, [Vârghiș Gorge](/lugar/cheile-varghisului/)
      and [Domogled - Cerna Valley National Park](/lugar/parcul-national-domogled---valea-cernei/) share with
      Buila similar cave-dwelling bat populations.
  fr:
    intro: >-
      Une crête calcaire acérée d'environ 14 km, entaillée par quatre rivières qui y ont façonné des défilés,
      le tout sur 4 186 hectares. Buila-Vânturarița est le plus petit parc national de Roumanie, associant
      falaises alpines, gorges, grottes et clairières d'altitude.


      Il se situe dans l'ouest du județ de Vâlcea, au sud des monts Căpățânii, sur les communes de Costești,
      Bărbătești et Băile Olănești. Il a été décrété aire protégée par la décision gouvernementale 2151 du 30
      novembre 2004.
    landscape: >-
      L'arête centrale s'étire sur 14 km ; les rivières Bistrița, Costești, Cheia et Olănești la sectionnent
      par des gorges sauvages et séparent deux massifs, Arnota au sud-ouest et Stogu au nord-est. Les cotes
      dépassant 1800 m n'occupent que deux petites zones sommitales autour des pics Buila et Vânturarița,
      culminant à 1885 m avec un étagement végétal marqué.


      Le massif relève de la nappe gétique des Carpates méridionales, avec des calcaires du Jurassique
      supérieur et du Crétacé inférieur. Sous la surface, le karst s'épanouit : le parc compte plus de cent
      grottes et des gouffres verticaux, tandis que la Bistrița et le Costești ont entaillé les gorges du
      sud-ouest.


      Le climat favorise la flore. Les pentes sud-est bénéficient d'influences subméditerranéennes grâce à
      l'ensoleillement et à la chaleur emmagasinée par le calcaire. Le relief escarpé a préservé les forêts
      originelles. On recense 17 habitats d'intérêt communautaire européen. L'étage subalpin accueille des
      pelouses rupicoles à Dryas octopetala et genévrier sabine, avec l'edelweiss sur les vires.
    wildlife: >-
      L'univers cavernicole est au centre de l'intérêt biologique. La Peștera Liliecilor (grotte des
      Chauves-souris) abrite une importante colonie dans la Sala Liliecilor. L'espèce Miniopterus schreibersi
      y réside toute l'année, tandis que d'autres s'y réfugient l'hiver ou pour la mise bas : Rhinolophus
      ferrumequinum, Vespertilio pipistrellus, Plecotus auritus, Barbastella barbastellus, Myotis myotis et
      Myotis oxygnathus.


      En surface, les prédateurs comptent l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/). Parmi les raretés végétales
      figurent le sabot de Vénus, une campanule alpine et la ligulaire de Sibérie. Près de Prislop, une
      clairière accueille une riche station de nivéoles de printemps (Leucojum vernum). Le sonneur à ventre
      jaune peuple les zones humides.
    visit: >-
      Le parc dispose de six points d'entrée. De là partent les sentiers menant aux ermitages. Depuis le
      terminus de Bărbătești, un sentier remonte la vallée de l'Otăsău et atteint l'ermitage de Pătrunsa en
      une heure. Depuis Băile Olănești, par la vallée de Cheia, on dépasse l'ermitage d'Iezer (3 km) pour
      poursuivre jusqu'à Pahomie (8 km). Les gorges de Cheia figurent parmi les plus étroites du pays, avec
      les grottes Peștera cu Lac et Peștera Laleaua Verde.


      La grotte des Chauves-souris se visite depuis le monastère de Bistrița : à l'arrière, un sentier équipé
      d'une rampe rejoint l'entrée accessible en quinze minutes. Seule l'entrée sud est praticable ; la cavité
      est partiellement électrifiée et nécessite une lampe frontale. Elle présente trois entrées et 400 m de
      galeries à 630 m d'altitude sur le flanc droit des gorges de la Bistrița.
    history: >-
      La grotte possède un riche historique scientifique : la première mention biospéléologique remonte à
      1929, suivie d'expéditions en 1951 et 1955. Dans la montagne, les ermitages racontent la ferveur
      spirituelle : Pahomie fut fondé vers 1519-1520 par le grand ban Barbu Craiovescu, et Pătrunsa fut érigé
      en 1740 sur le lieu de naissance traditionnel de l'évêque Climent.
    before: >-
      La visite nécessite un droit d'entrée et s'effectue sur les seuls sentiers balisés. Bivouac autorisé
      uniquement sur les aires désignées. Chiens tenus en laisse. Il est interdit de couper ou brûler les pins
      nains et genévriers, ou de cueillir baies et plantes sans autorisation. Apportez une lampe pour la
      grotte.
    around: >-
      À quatre kilomètres s'étend le [parc national de Cozia - forêts
      primaires](/lugar/parcul-national-cozia---codrii-seculari/), à dix-sept kilomètres les [montagnes de
      Parâng](/lugar/muntii-parang/) et à vingt-deux la [réserve forestière de
      Latorița](/lugar/codrul-secular-latorita/). Plus loin, les [gorges de
      Vârghiș](/lugar/cheile-varghisului/) et le [parc national Domogled - vallée de la
      Cerna](/lugar/parcul-national-domogled---valea-cernei/) partagent avec Buila ses colonies de
      chauves-souris troglophiles.
  de:
    intro: >-
      Ein schmaler Kalkgrat von rund 14 km Länge, durchschnitten von vier Gebirgsflüssen, und all dies auf
      4.186 Hektar Fläche. Buila-Vânturarița ist der kleinste Nationalpark Rumäniens und vereint Steilwände,
      Schluchten, Höhlen und Berglichtungen.


      Er liegt im Westen des Kreises Vâlcea südlich des Căpățânii-Gebirges in den Gemarkungen Costești,
      Bărbătești und Băile Olănești. Das Schutzgebiet wurde durch den Regierungsbeschluss 2151 vom 30.
      November 2004 ausgewiesen.
    landscape: >-
      Der Hauptkamm misst etwa 14 km; die Flüsse Bistrița, Costești, Cheia und Olănești schneiden ihn mit
      wilden Schluchten und trennen zwei Massive: Arnota im Südwesten und Stogu im Nordosten. Lagen über 1800
      m beschränken sich auf zwei kleine Kernzonen um die Gipfel Buila und Vânturarița mit einer Maximalhöhe
      von 1885 m und ausgeprägten Höhenstufen.


      Geologisch gehört das Massiv zur Getischen Decke der Südkarpaten mit Kalksteinen des Oberjura und der
      Unterkreide. Unter Tage dominiert der Karst: Über hundert Höhlen und tiefe Schächte sind erfasst;
      Bistrița und Costești schufen die Schluchten im Südwesten.


      Das Lokalklima begünstigt die Flora: Südosthänge weisen submediterrane Züge durch intensive Einstrahlung
      auf. Die steile Topografie verhinderte Rodungen. Es wurden 17 europäische FFH-Lebensraumtypen erfasst.
      In der subalpinen Stufe dominieren Kalkschuttfluren mit Dryas octopetala und Sadebaum; an Felswänden
      wächst Edelweiß.
    wildlife: >-
      Die Höhlenwelt steht im Zentrum des Interesses. Die Peștera Liliecilor (Fledermaushöhle) beherbergt im
      Saal Sala Liliecilor eine große Kolonie höhlenbewohnender Arten. Miniopterus schreibersi verweilt
      ganzjährig, während andere Arten zur Überwinterung oder Jungenaufzucht einfliegen: Rhinolophus
      ferrumequinum, Vespertilio pipistrellus, Plecotus auritus, Barbastella barbastellus, Myotis myotis und
      Myotis oxygnathus.


      Oberirdisch leben [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und
      [Luchs](/especie/lynx_lynx/). Unter den seltenen Pflanzen finden sich Frauenschuh, Alpen-Glockenblume
      und Sibirische Ligularie. Nahe Prislop blühen im Frühjahr tausende Frühlingsknotenblumen (Leucojum
      vernum). Die Gelbbauchunke ist typischer Lurch.
    visit: >-
      Der Park besitzt sechs Zugänge, von denen Steige zu historischen Einsiedeleien führen. Ab dem Ende der
      Piste in Bărbătești führt ein Pfad durch das Otăsău-Tal in einer Stunde zur Einsiedelei Pătrunsa. Ab
      Băile Olănești geht es durch das Cheia-Tal vorbei an der Einsiedelei Iezer (3 km) zur Einsiedelei
      Pahomie (8 km). Die Cheia-Schlucht zählt zu den engsten Schluchten des Landes mit den Höhlen Peștera cu
      Lac und Peștera Laleaua Verde.


      Die Fledermaushöhle erreicht man ab dem Kloster Bistrița: Ein gesicherter Pfad führt in fünfzehn Minuten
      zum Portal. Nur der Südeingang ist begehbar; die Höhle ist teils beleuchtet, eine Taschenlampe ist
      erforderlich. Sie weist drei Ostportale und rund 400 m Länge auf 630 m Höhe auf.
    history: >-
      Die Höhle blickt auf wissenschaftliche Tradition: Die erste biospeläologische Erwähnung stammt von 1929,
      gefolgt von Forschungsreisen 1951 und 1955. In den Bergen zeugen Einsiedeleien von alter Frömmigkeit:
      Pahomie wurde um 1519-1520 von Barbu Craiovescu gegründet, Pătrunsa entstand 1740 am Geburtsort von
      Bischof Climent.
    before: >-
      Der Parkbesuch ist gebührenpflichtig und auf markierte Steige beschränkt. Zelten ist nur auf
      gekennzeichneten Plätzen gestattet. Hunde sind an der Leine zu führen. Das Beschädigen von Latschen und
      Wacholder sowie Sammeln ohne Genehmigung ist verboten. Lampe für die Höhle mitnehmen.
    around: >-
      Vier Kilometer entfernt liegt der [Nationalpark Cozia –
      Urwälder](/lugar/parcul-national-cozia---codrii-seculari/), siebzehn Kilometer das
      [Parâng-Gebirge](/lugar/muntii-parang/) und zweiundzwanzig der [Urwald
      Latorița](/lugar/codrul-secular-latorita/). Weiter entfernt teilen die
      [Vârghiș-Schlucht](/lugar/cheile-varghisului/) und der [Nationalpark Domogled –
      Cerna-Tal](/lugar/parcul-national-domogled---valea-cernei/) Fledermauspopulationen.
  it:
    intro: >-
      Una cresta calcarea affilata di circa 14 km, incisa da quattro corsi d'acqua che vi hanno aperto forre
      selvagge, il tutto concentrato in 4.186 ettari. Buila-Vânturarița è il parco nazionale più piccolo della
      Romania e unisce creste rocciose, gole, cavità e radure d'alta quota.


      Sorge nella parte occidentale del distretto di Vâlcea, a sud dei monti Căpățânii, nei territori di
      Costești, Bărbătești e Băile Olănești. È stato proclamato area protetta con delibera governativa 2151
      del 30 novembre 2004.
    landscape: >-
      La dorsale principale si estende per circa 14 km; i torrenti Bistrița, Costești, Cheia e Olănești la
      tagliano con forre ripide, isolando i massicci di Arnota a sud-ovest e Stogu a nord-est. Le quote
      superiori a 1800 m interessano solo due ristrette aree sommitali attorno alle vette Buila e Vânturarița,
      con culmine a 1885 m e vegetazione stratificata in fasce altimetriche.


      Il gruppo montuoso appartiene alla Falda Getica dei Carpazi Meridionali, con calcari del Giurassico
      superiore e Cretacico inferiore. Nel sottosuolo il carsismo si esprime con oltre cento grotte e pozzi
      verticali; Bistrița e Costești hanno aperto le gole sud-occidentali.


      Il clima mite favorisce la flora: i versanti sud-orientali mostrano influenze submediterranee grazie
      all'insolazione e al calore rilasciato dalla roccia. La forte pendenza ha impedito conversioni agricole.
      Sono stati censiti 17 habitat prioritari europei. Nella fascia subalpina predominano praterie rupicole
      con Dryas octopetala e ginepro sabina; la stella alpina adorna le cenge rocciose.
    wildlife: >-
      L'ambiente ipogeo rappresenta il cuore ecologico del parco. La Peștera Liliecilor (grotta dei
      Pipistrelli) ospita una grande colonia nella Sala Liliecilor. Miniopterus schreibersi vi risiede
      stabilmente tutto l'anno, mentre altre specie vi svernano o vi si riproducono: Rhinolophus
      ferrumequinum, Vespertilio pipistrellus, Plecotus auritus, Barbastella barbastellus, Myotis myotis e
      Myotis oxygnathus.


      Nelle foreste esterne vivono l'[orso bruno](/especie/ursus_arctos/), il [lupo](/especie/canis_lupus/) e
      la [lince boreale](/especie/lynx_lynx/). Tra le rarità botaniche figurano la pianella della Madonna, una
      campanula alpina e la ligularia siberiana. Presso Prislop una radura accoglie rigogliose fioriture di
      campanellino di primavera (Leucojum vernum). L'ululone dal ventre giallo popola le pozze.
    visit: >-
      Il parco conta sei varchi d'accesso, da cui partono sentieri diretti ai romitaggi storici. Dalla testata
      della carrareccia di Bărbătești, lungo la valle dell'Otăsău, un percorso conduce in un'ora all'eremo di
      Pătrunsa. Da Băile Olănești, risalendo la valle di Cheia, si supera l'eremo di Iezer (3 km) proseguendo
      verso Pahomie (8 km). Le gole di Cheia sono tra le più aspre della Romania, custodi delle grotte Peștera
      cu Lac e Peștera Laleaua Verde.


      La grotta dei Pipistrelli si visita partendo dal monastero di Bistrița: dal retro, un sentiero gradinato
      con corrimano raggiunge l'imbocco in circa quindici minuti. Solo l'accesso sud è praticabile; la cavità
      è parzialmente illuminata e richiede una torcia. Misura 400 m di sviluppo a 630 m di quota.
    history: >-
      La grotta vanta memorie storiche: la prima menzione biospeleologica data al 1929, seguita da rilievi nel
      1951 e 1955. Più in alto gli eremi testimoniano secoli di devozione: Pahomie fu fondato verso il
      1519-1520 dal bano Barbu Craiovescu, mentre Pătrunsa fu eretto nel 1740 dove la tradizione colloca la
      nascita del vescovo Climent.
    before: >-
      Per visitare il parco è necessario acquistare il biglietto di ingresso, e la fruizione è consentita
      unicamente lungo i sentieri escursionistici segnalati. Il campeggio è consentito solo ed esclusivamente
      nelle aree appositamente attrezzate e segnalate. I cani possono entrare solo se condotti costantemente
      al guinzaglio. È severamente vietato tagliare, bruciare o danneggiare il pino mugo e il ginepro, nonché
      raccogliere funghi, piante, animali o minerali a fini commerciali senza l'autorizzazione del parco. Per
      visitare la grotta dei Pipistrelli porta una fonte di luce propria.
    around: >-
      A quattro chilometri sorge il [Parco Nazionale di Cozia - Foreste
      Primarie](/lugar/parcul-national-cozia---codrii-seculari/), a diciassette chilometri i [Monti di
      Parâng](/lugar/muntii-parang/) e a ventidue la [Riserva forestale di
      Latorița](/lugar/codrul-secular-latorita/). Più a distanza, le [Gole di
      Vârghiș](/lugar/cheile-varghisului/) e il [Parco Nazionale Domogled - Valle del
      Cerna](/lugar/parcul-national-domogled---valea-cernei/) condividono popolamenti di pipistrelli
      troglofili.
  pt:
    intro: >-
      Uma crista calcária escarpada com cerca de 14 km, fendida por quatro rios que formam desfiladeiros
      selvagens, tudo circunscrito a 4.186 hectares. Buila-Vânturarița é o menor parque nacional da Roménia,
      congregando cumes rochosos, gargantas, grutas e clareiras alpinas.


      Fica situado no oeste do distrito de Vâlcea, a sul dos montes Căpățânii, nos concelhos de Costești,
      Bărbătești e Băile Olănești. Foi instituído parque nacional pela Deliberação Governamental 2151 de 30 de
      novembro de 2004.
    landscape: >-
      A crista principal estende-se por cerca de 14 km; os rios Bistrița, Costești, Cheia e Olănești cortam-na
      em gargantas agrestes, individualizando os maciços de Arnota a sudoeste e Stogu a nordeste. As altitudes
      superiores a 1800 m cingem-se a dois setores centrais junto aos cumes Buila e Vânturarița, com cota
      máxima de 1885 m e andares de vegetação nítidos.


      Geologicamente insere-se no Manto Gético dos Cárpatos Meridionais, integrando calcários do Jurássico
      Superior e Cretácico Inferior. No subsolo, o relevo cárstico apresenta mais de cem grutas e algares; o
      Bistrița e o Costești cavaram os desfiladeiros a sudoeste.


      O clima favorece a flora: as encostas sudeste beneficiam de amenidades submédicas pelo calor retido no
      calcário. O relevo íngreme evitou a destruição das matas primitivas. Inventariam-se 17 habitats de
      conservação prioritária europeia. No piso subalpino dominam prados de escarpa com Dryas octopetala e
      sabina-da-praia; a edelvaisse orna as fendas rochosas.
    wildlife: >-
      O domínio subterrâneo constitui o maior valor ecológico do parque. A Peștera Liliecilor (gruta dos
      Morcegos) alberga uma imensa colónia na Sala Liliecilor. A espécie Miniopterus schreibersi permanece na
      caverna o ano inteiro, ao passo que outras ocorrem para hibernação ou maternidade: Rhinolophus
      ferrumequinum, Vespertilio pipistrellus, Plecotus auritus, Barbastella barbastellus, Myotis myotis e
      Myotis oxygnathus.


      À superfície sobrevivem o [urso-pardo](/especie/ursus_arctos/), o [lobo](/especie/canis_lupus/) e o
      [lince-boreal](/especie/lynx_lynx/). Entre as raridades botânicas destacam-se o sapatinho-de-vénus, uma
      campainha alpina e a ligulária-da-sibéria. Perto de Prislop floresce um manto de campainhas-da-primavera
      (Leucojum vernum). O bombina-de-barriga-amarela é comum nos charcos.
    visit: >-
      O parque dispõe de seis portas de entrada, de onde partem veredas para eremitérios históricos. Do fim da
      estrada de Bărbătești, pelo vale de Otăsău, um trilho alcança em uma hora o eremitério de Pătrunsa. A
      partir de Băile Olănești, subindo pelo vale de Cheia, passa-se o eremitério de Iezer (3 km) rumo a
      Pahomie (8 km). O desfiladeiro de Cheia é dos mais estreitos do país, albergando as grutas Peștera cu
      Lac e Peștera Laleaua Verde.


      A gruta dos Morcegos visita-se a partir do mosteiro de Bistrița: pela retaguarda, um caminho com
      corrimões atinge a entrada acessível em cerca de quinze minutos. Apenas a entrada sul é viável; a
      caverna dispõe de iluminação parcial e requer lanterna. Tem 400 m de extensão a 630 m de altitude.
    history: >-
      A gruta possui relevância científica: o primeiro registo bioespeleológico data de 1929, sucedido por
      estudos em 1951 e 1955. Mais acima, os eremitérios testemunham espiritualidade: Pahomie foi erigido
      cerca de 1519-1520 pelo grande bano Barbu Craiovescu, e Pătrunsa nasceu em 1740 no local onde a lenda
      situa o nascimento do bispo Climent.
    before: >-
      Para visitar o parque é necessário adquirir o bilhete de visitante, sendo a circulação permitida apenas
      ao longo dos trilhos turísticos assinalados. Acampar só é permitido nos locais devidamente sinalizados e
      autorizados para o efeito. Os cães só podem aceder desde que permaneçam sempre com trela. É
      expressamente proibido cortar, queimar ou danificar o pinheiro-anão e o zimbro, bem como colher
      cogumelos, plantas, animais ou rochas para fins comerciais sem autorização do parque. Para explorares a
      gruta dos Morcegos deves levar uma lanterna própria.
    around: >-
      A quatro quilómetros estende-se o [Parque Nacional de Cozia - Florestas
      Virgens](/lugar/parcul-national-cozia---codrii-seculari/), a dezassete quilómetros as [Montanhas de
      Parâng](/lugar/muntii-parang/) e a vinte e dois a [Reserva florestal de
      Latorița](/lugar/codrul-secular-latorita/). Mais longe, as [Gargantas de
      Vârghiș](/lugar/cheile-varghisului/) e o [Parque Nacional de Domogled - Vale do
      Cerna](/lugar/parcul-national-domogled---valea-cernei/) partilham colónias de morcegos cavernícolas.
