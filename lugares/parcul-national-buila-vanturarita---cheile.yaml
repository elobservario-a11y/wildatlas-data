  es: El Parque Nacional más pequeño de Rumanía, protegiendo una cresta caliza alpina y estrechos cañones.
  en: Romania's smallest National Park, protecting an alpine limestone ridge and narrow gorges.
  fr: Le plus petit parc national de Roumanie, protégeant une crête calcaire alpine et d'étroits défilés.
  de: Rumäniens kleinster Nationalpark schützt einen alpinen Kalksteingrat und enge Klammen.
  it: Il Parco Nazionale più piccolo della Romania, a tutela di una cresta calcarea alpina e di gole impervie.
