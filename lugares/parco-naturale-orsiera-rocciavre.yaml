resumen:
  es: >-
    Picos graníticos apenados entre Val Susa y Val Chisone (Monte Orsiera 2.890 m) albergando una fortaleza
    histórica transalpina (Fortezza di Fenestrelle).
  en: >-
    Granite and serpentine peaks rising between Val Susa and Val Chisone (Monte Orsiera 2,890 m), harbouring a
    historic transalpine fortress (Fortezza di Fenestrelle).
  fr: >-
    Pics et crêtes s'élevant entre le Val de Suse et le Val Chisone (Monte Orsiera 2 890 m), abritant une
    forteresse historique transalpine (Fortezza di Fenestrelle).
  de: >-
    Felsgipfel zwischen Susa- und Chisone-Tal (Monte Orsiera 2.890 m), die eine historische transalpine
    Festung beherbergen (Fortezza di Fenestrelle).
  it: >-
    Vette aspre tra la Val di Susa e la Val Chisone (Monte Orsiera 2.890 m) che accolgono una storica fortezza
    transalpina (Fortezza di Fenestrelle).
  pt: >-
    Picos escarpados erguidos entre o Val de Susa e o Val Chisone (Monte Orsiera 2.890 m), acolhendo uma
    fortaleza histórica transalpina (Fortezza di Fenestrelle).
unico:
  es: >-
    Es una montaña de piedra verde, moldeada por los glaciares, donde viven a la vez la marmota, el íbice y el
    lobo que regresó solo.
  en: >-
    A greenstone mountain shaped by glaciers, where marmots, alpine ibex and wolves that returned on their own
    all live together.
  fr: >-
    Une montagne de roches vertes façonnée par les glaciers, où cohabitent marmotte, bouquetin et loup revenu
    de lui-même.
  de: >-
    Ein von Gletschern geformter Grünsteinberg, auf dem Murmeltier, Steinbock und der selbstständig
    zurückgekehrte Wolf gemeinsam leben.
  it: >-
    È una montagna di pietre verdi modellata dai ghiacciai, dove vivono insieme la marmotta, lo stambecco e il
    lupo ritornato da solo.
  pt: >-
    Uma montanha de rochas verdes modelada pelos glaciares, onde convivem a marmota, o íbex e o lobo que
    regressou sozinho.
observaciones:
  es: >-
    En parques y reservas de las Alpi Cozie está prohibido cazar, recoger flores y encender fuegos. Valen
    además las normas nacionales: no se puede circular en moto por los senderos, molestar a los animales,
    dejar basura ni recoger setas sin el permiso correspondiente. Cada área tiene su reglamento específico,
    así que léelo antes de salir. Si piensas cruzar por el Colle delle Finestre, recuerda que la carretera es
    militar y muy panorámica, y solo está abierta de junio a octubre.
texto:
  es:
    intro: >-
      Tres valles se reparten una misma montaña y casi ninguna carretera la cruza. El Orsiera-Rocciavrè, en el
      norte de las Alpi Cozie, separa el valle del Chisone del de Susa y cierra la cabecera del Sangone; en el
      Rocciavré, de 2.778 metros, confluyen los tres. El parque nació en 1980 para proteger este macizo que se
      quedó al margen del desarrollo turístico de los valles vecinos, y todavía hoy se recorre con esa
      sensación: la de una montaña que se ha dejado en paz.
    landscape: >-
      Los límites del parque corren de media a unos 1.400 metros de altitud, y las cumbres rozan los 3.000: el
      Monte Orsiera (2.890 m), el Rocciavré (2.778 m) y la Punta Rocca Nera (2.852 m). El macizo está hecho
      sobre todo de ofiolitas, las llamadas piedras verdes, mientras que otras rocas de la placa continental
      quedan en la periferia.


      La historia reciente de estas montañas la escribió la erosión. Las glaciaciones del Cuaternario dejaron
      morrenas, lagos de circo, lagos de barrera glaciar, rocas aborregadas y valles en forma de U. De ahí
      salen los lagos del parque: Chardonnet, Laus, La Manica, Sottano y Soprano. Y el hielo no ha dejado de
      trabajar al retirarse: la desaparición de los glaciares y de los neveros que los sujetaban ha movilizado
      acumulaciones de detritos y desprendimientos todavía activos.


      El agua se reparte entre tres afluentes del Po. El Chisone recoge la parte suroeste, el Dora Riparia
      drena el norte y el Sangone, el sureste. Los lagos alpinos son numerosos, y el más extenso es el
      Ciardonnet, en el centro del área protegida.


      La vegetación sube por pisos. Alerces, abetos y pinos cembros ocupan las montañas más altas; pinos y
      robles pubescentes, las laderas áridas y pedregosas; alisos y sauces, los encharcados; carpes y robles,
      las colinas; y hayas y tilos, las zonas de sombra. Como los tres valles tienen clima y suelos distintos,
      el paisaje vegetal cubre una banda de altitud muy amplia. Los bosques más destacados están en el Sapei,
      entre Bussoleno y San Giorio, y en los pinares de pino silvestre de Pra Catinat, en el valle del
      Chisone.
    wildlife: >-
      El [rebeco](/especie/rupicapra_rupicapra/) es el ungulado más fácil de ver, porque frecuenta los
      espacios abiertos de alta montaña; corzos y ciervos, en cambio, prefieren el bosque. Junto al jabalí, de
      costumbres nocturnas, frecuenta el parque una colonia de muflones no autóctonos, y unos cincuenta
      [íbices](/especie/capra_ibex/) proceden de un programa de reintroducción. El
      [lobo](/especie/canis_lupus/) es la novedad: volvió a poblar el territorio del parque por sí solo desde
      finales de los años noventa.


      Más arriba, en pastos, pedreras y matorrales, vive una fauna pequeña y rara. La
      [marmota](/especie/marmota_marmota/) es el símbolo del parque, y con ella están el armiño, la [perdiz
      nival](/especie/lagopus_muta/), la liebre variable, el [gallo lira](/especie/tetrao_tetrix/) y la perdiz
      griega. En los bosques de coníferas de cotas más bajas hay garduñas, tejones, zorros, ardillas,
      arrendajos, carboneros y agateadores. En los lagos viven el salvelino alpino y la trucha común.


      Las aves censadas superan el centenar, con grandes rapaces como el azor, el ratonero, el abejero, la
      culebrera europea y el [águila real](/especie/aquila_chrysaetos/). En verano, la fauna menor, que casi
      siempre pasa inadvertida, anima claros y bosques: lagartos verdes, luciones, salamandras, ranas y un
      enorme ejército de insectos de colores.


      La temporada para visitar el parque va de junio a octubre, los mismos meses en que está abierta al
      tráfico la carretera del Colle delle Finestre.
    visit: >-
      La red de senderos permite paseos fáciles de pocas horas, trekkings de varios días y travesías de un
      valle a otro, siguiendo la Gran Travesía de los Alpes (GTA) o el Giro dell'Orsiera. Para algo más
      contemplativo, la cuenca de Cassafrera es una buena meta: el paisaje se llena de grandes bloques de
      piedra, y se llega desde el Colle del Vento, el Colle di Malanotte o el sendero de Pian Mustione y del
      Lago Rosso. Dentro del parque hay refugios para dormir en la montaña: Selleries, Toesca, Geat Valgravio,
      Oneglio Amprimo y Balma.


      La visita cultural más cercana es la Certosa de Montebenedetto, a pocos kilómetros de la entrada por
      Villar Focchiardo, en un marco de pastos y bosques. En la iglesia hay una exposición permanente sobre el
      mundo cartujo y, junto a ella, un sendero autoguiado describe los edificios que rodeaban el templo, de
      los que quedan pocas huellas. En Bussoleno, el parque tiene un laboratorio dedicado al medio ambiente y
      la cultura de montaña que se usa para actividades didácticas.
    history: >-
      El parque se creó en 1980 por la Región del Piamonte para proteger unas 11.000 hectáreas, y hoy forma
      parte de la red Natura 2000 según las directivas europeas de hábitats y aves. Lo gestiona el ente de las
      áreas protegidas de las Alpi Cozie, con oficinas en Bussoleno, en Fenestrelle y en Avigliana para el
      valle del Sangone.


      La historia humana se deja leer en dos construcciones. La Certosa se remonta hacia 1200 y la fundaron
      monjes cartujos que llevaban desde Grenoble las enseñanzas de san Bruno. El Fuerte de Fenestrelle, en el
      valle del Chisone, es la mayor fortaleza de los Alpes: se empezó en 1728 para defender la frontera entre
      Saboya y Francia y sube desde los 1.150 metros de Fenestrelle hasta casi 2.000 en Pra Catinat, con la
      escalera cubierta más larga de Europa, de 4.000 escalones. Culturalmente, el parque está a caballo entre
      el área occitano-valdense del sur y la arpitana del norte.
    before: >-
      En parques y reservas de las Alpi Cozie está prohibido cazar, recoger flores y encender fuegos. Valen
      además las normas nacionales: no se puede circular en moto por los senderos, molestar a los animales,
      dejar basura ni recoger setas sin el permiso correspondiente. Cada área tiene su reglamento específico,
      así que léelo antes de salir. Si piensas cruzar por el Colle delle Finestre, recuerda que la carretera
      es militar y muy panorámica, y solo está abierta de junio a octubre.
    around: >-
      Al lado, a unos 3 km, está el [Parque Natural del Gran Bosque de
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/), y a unos 10 km el [Parque Natural de
      la Val Troncea](/lugar/parco-naturale-della-val-troncea/). A 11 km quedan los [Lagos de
      Avigliana](/lugar/parco-naturale-dei-laghi-di-avigliana/); al otro lado de la frontera, a 21 km, el
      [Parque Natural Regional del Queyras](/lugar/parc-naturel-regional-du-queyras/), y a veintiséis
      kilómetros el [Parque Nacional de la Vanoise](/lugar/parc-national-de-la-vanoise/).


      Más lejos, el [Parque Natural de los Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/)
      comparte con el Orsiera el íbice, el rebeco y el lobo, además de la alta montaña y el bosque maduro.
  en:
    intro: >-
      Three valleys share a single mountain, and almost no roads cross it. The Orsiera-Rocciavrè massif, in
      the northern Cottian Alps, divides the Chisone Valley from the Susa Valley and encloses the headwaters
      of the Sangone; on Rocciavré, at 2,778 metres, all three converge. The park was established in 1980 to
      protect this massif, which had remained on the margins of tourist development in neighboring valleys,
      and you still hike here with that distinct feeling: that of a mountain left in peace.
    landscape: >-
      The boundaries of the park lie on average around 1,400 metres in altitude, while the summits approach
      3,000: Monte Orsiera (2,890 m), Rocciavré (2,778 m) and Punta Rocca Nera (2,852 m). The massif is
      composed primarily of ophiolites, the so-called greenstones, while other rocks of the continental plate
      fringe the periphery.


      The recent history of these mountains was carved by erosion. Quaternary glaciations left behind
      moraines, cirque lakes, glacial-dam lakes, roche moutonnée landforms and U-shaped valleys. From these
      processes arose the park lakes: Chardonnet, Laus, La Manica, Sottano and Soprano. And the ice has never
      stopped working as it retreated: the vanishing of glaciers and stabilizing firn fields has mobilized
      active scree fields and rockfalls.


      Waters divide among three tributaries of the Po. The Chisone collects the south-west, the Dora Riparia
      drains the north, and the Sangone flows to the south-east. Alpine lakes are numerous, the largest being
      Lake Ciardonnet, set right at the heart of the protected area.


      Vegetation ascends in distinct altitude belts. Larches, silver firs and Swiss stone pines occupy the
      highest slopes; Scots pines and downy oaks cling to arid, rocky slopes; alders and willows line
      wetlands; hornbeams and oaks cover lower hills; and beeches and limes shade sheltered ravines. Because
      the three valleys have differing climates and soils, plant life spans a broad elevation range. The most
      remarkable forests stand in the Sapei, between Bussoleno and San Giorio, and in the Scots pine woods of
      Pra Catinat in the Chisone Valley.
    wildlife: >-
      The [chamois](/especie/rupicapra_rupicapra/) is the easiest ungulate to spot, as it roams open
      high-mountain pastures; roe deer and red deer, by contrast, prefer forest cover. Alongside nocturnal
      wild boars, a colony of introduced mouflons frequents the park, and around fifty [alpine
      ibex](/especie/capra_ibex/) stem from a reintroduction program. The [grey wolf](/especie/canis_lupus/)
      is the newcomer: it recolonized the park territory on its own starting in the late nineties.


      Higher up, among alpine meadows, screes and dwarf scrub, lives a small and discreet fauna. The [alpine
      marmot](/especie/marmota_marmota/) serves as the park symbol, joined by stoats, [rock
      ptarmigan](/especie/lagopus_muta/), mountain hares, [black grouse](/especie/tetrao_tetrix/) and rock
      partridge. Lower-altitude coniferous woodlands harbour pine martens, badgers, foxes, red squirrels,
      Eurasian jays, coal tits and treecreepers. In the alpine lakes swim Arctic char and brown trout.


      Recorded bird species exceed one hundred, including large raptors such as northern goshawk, common
      buzzard, European honey buzzard, short-toed snake eagle and the [golden
      eagle](/especie/aquila_chrysaetos/). In summer, smaller fauna enlivens clearings and woods: western
      green lizards, slow worms, fire salamanders, frogs and countless colourful insects.


      The visiting season runs from June to October, matching the months when the road over Colle delle
      Finestre is open to traffic.
    visit: >-
      The trail network offers easy walks of a few hours, multi-day treks, and traverses from one valley to
      another along the Grande Traversata delle Alpi (GTA) or the Giro dell'Orsiera. For a more contemplative
      destination, the Cassafrera cirque basin makes an excellent goal: the terrain is strewn with massive
      boulder blocks, accessible from Colle del Vento, Colle di Malanotte, or the path of Pian Mustione and
      Lago Rosso. Mountain huts inside the park provide overnight lodging: Selleries, Toesca, Geat Valgravio,
      Oneglio Amprimo and Balma.


      The nearest cultural attraction is the Charterhouse of Montebenedetto, a few kilometres from the park
      entrance at Villar Focchiardo, framed by pastures and woods. Inside the church, a permanent exhibition
      illustrates Carthusian life, and an adjacent self-guided trail interprets the traces of former convent
      buildings. In Bussoleno, the park operates an educational centre dedicated to mountain culture and the
      alpine environment.
    history: >-
      The park was created in 1980 by the Piedmont Region to protect some 11,000 hectares, and is now
      integrated into the Natura 2000 network under European habitats and birds directives. It is managed by
      the Protected Areas of the Cottian Alps authority, with visitor offices in Bussoleno, Fenestrelle, and
      Avigliana for the Sangone Valley.


      Human history is recorded in two striking monuments. The Charterhouse dates back to around 1200, founded
      by Carthusian monks bringing the teachings of Saint Bruno from Grenoble. Fort Fenestrelle, in the
      Chisone Valley, is the largest fortress in the Alps: begun in 1728 to safeguard the Savoyard-French
      frontier, it climbs from 1,150 metres at Fenestrelle to nearly 2,000 metres at Pra Catinat, boasting
      Europe's longest covered staircase with 4,000 steps. Culturally, the park straddles the
      Occitan-Waldensian traditions of the south and Arpitan culture to the north.
    before: >-
      In the parks and reserves of the Cottian Alps, hunting, picking wildflowers, and lighting fires are
      prohibited. National rules also apply: motorized vehicles are forbidden on trails, disturbing wildlife
      is illegal, littering is prohibited, and mushroom harvesting requires a permit. Each sector has specific
      bylaws, so check regulations before your outing. If you plan to drive over the Colle delle Finestre,
      note that it is a panoramic military gravel road open only from June to October.
    around: >-
      Next door, some 3 km away, lies the [Gran Bosco di Salbertrand Natural
      Park](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/), and around 10 km away is the [Val Troncea
      Natural Park](/lugar/parco-naturale-della-val-troncea/). At 11 km you will find the [Lakes of
      Avigliana](/lugar/parco-naturale-dei-laghi-di-avigliana/); across the French border, 21 km away, is the
      [Queyras Regional Natural Park](/lugar/parc-naturel-regional-du-queyras/), and twenty-six kilometres
      away lies the [Vanoise National Park](/lugar/parc-national-de-la-vanoise/).


      Further away, the [Maritime Alps Natural Park](/lugar/parco-naturale-delle-alpi-marittime/) shares with
      Orsiera the alpine ibex, chamois, and wolf, alongside high-altitude peaks and mature alpine forest.
  fr:
    intro: >-
      Trois vallées se partagent une même montagne et presque aucune route ne la franchit.
      L'Orsiera-Rocciavrè, au nord des Alpes cottiennes, sépare la vallée du Chisone de celle de Suse et ferme
      la tête du Sangone ; sur le Rocciavré, à 2 778 mètres, se rejoignent les trois. Le parc est né en 1980
      pour protéger ce massif resté à l'écart de l'essor touristique des vallées voisines, et l'on y chemine
      toujours avec cette sensation intacte : celle d'une montagne préservée en paix.
    landscape: >-
      Les limites du parc courent en moyenne vers 1 400 mètres d'altitude, tandis que les crêtes frôlent les 3
      000 : le mont Orsiera (2 890 m), le Rocciavré (2 778 m) et la Punta Rocca Nera (2 852 m). Le massif est
      composé principalement d'ophiolites, les célèbres roches vertes, tandis que d'autres roches de la plaque
      continentale occupent la périphérie.


      L'histoire récente de ces montagnes a été façonnée par l'érosion. Les glaciations quaternaires ont
      laissé moraines, lacs de cirque, lacs de barrage glaciaire, roches moutonnées et vallées en auge. De là
      sont nés les lacs du parc : Chardonnet, Laus, La Manica, Sottano et Soprano. Et la glace n'a pas cessé
      d'agir en se retirant : la disparition des glaciers et des névés a mobilisé des éboulis et des
      glissements toujours actifs.


      Les eaux se partagent entre trois affluents du Pô. Le Chisone recueille le sud-ouest, la Doire Ripaire
      draine le nord et le Sangone le sud-est. Les lacs alpins sont nombreux, le plus étendu étant le
      Ciardonnet, au cœur de l'espace protégé.


      La végétation s'étage par paliers. Mélèzes, sapins et pins cembros occupent les plus hautes pentes ;
      pins sylvestres et chênes pubescents colonisent les versants arides et caillouteux ; aulnes et saules
      bordent les mouillères ; charmes et chênes couvrent les collines ; hêtres et tilleuls peuplent les zones
      ombragées. Les trois vallées offrant des climats et des sols variés, la flore s'étend sur une grande
      amplitude altitudinale. Les massifs boisés les plus remarquables se trouvent au Sapei, entre Bussoleno
      et San Giorio, et dans les pinèdes de pin sylvestre de Pra Catinat, dans le val Chisone.
    wildlife: >-
      Le [chamois](/especie/rupicapra_rupicapra/) est l'ongulé le plus facile à observer, fréquentant les
      espaces ouverts de haute montagne ; chevreuils et cerfs préfèrent la forêt. À côté du sanglier,
      nocturne, vit une colonie de mouflons introduits, et une cinquantaine de [bouquetins des
      Alpes](/especie/capra_ibex/) sont issus d'un programme de réintroduction. Le [loup
      gris](/especie/canis_lupus/) est de retour : il a recolonisé naturellement le parc dès la fin des années
      quatre-vingt-dix.


      Plus haut, dans les pelouses, pierriers et landes, vit une faune discrète. La [marmotte des
      Alpes](/especie/marmota_marmota/) est l'emblème du parc, côtoyant l'hermine, le [lagopède
      alpin](/especie/lagopus_muta/), le lièvre variable, le [tétras lyre](/especie/tetrao_tetrix/) et la
      perdrix bartavelle. Dans les forêts de résineux des basses pentes s'activent fouines, blaireaux,
      renards, écureuils, geais, mésanges noires et grimpereaux. Les lacs hébergent l'omble chevalier et la
      truite fario.


      Plus d'une centaine d'espèces d'oiseaux sont recensées, dont de grands rapaces comme l'autour des
      palombes, la buse variable, la bondrée apivore, le circaète Jean-le-Blanc et l'[aigle
      royal](/especie/aquila_chrysaetos/). En été, une petite faune anime clairières et taillis : lézards
      verts, orvets, salamandres, grenouilles et une foule d'insectes bigarrés.


      La saison de visite s'étend de juin à octobre, période d'ouverture de la route carrossable du col du
      Finestre.
    visit: >-
      Le réseau de sentiers permet des balades familiales de quelques heures, des randonnées itinérantes et
      des traversées de vallée en vallée via la Grande Traversée des Alpes (GTA) ou le Giro dell'Orsiera. Pour
      une immersion plus contemplative, le vallon de Cassafrera constitue un beau but d'excursion : jonché de
      blocs rocheux cyclopéens, on y parvient depuis le col del Vento, le col di Malanotte ou par le chemin de
      Pian Mustione et du lac Rouge. Plusieurs refuges de montagne accueillent les randonneurs : Selleries,
      Toesca, Geat Valgravio, Oneglio Amprimo et Balma.


      L'étape culturelle la plus proche est la chartreuse de Montebenedetto, à quelques kilomètres de l'entrée
      de Villar Focchiardo, enchâssée entre pâturages et forêts. L'église abrite une exposition permanente sur
      l'histoire cartusienne et un sentier d'interprétation décrit les vestiges conventuels. À Bussoleno, le
      parc gère un laboratoire pédagogique dédié à l'environnement alpin et aux traditions de montagne.
    history: >-
      Le parc a été créé en 1980 par la Région Piémont pour préserver environ 11 000 hectares, et s'intègre
      aujourd'hui au réseau Natura 2000 au titre des directives européennes habitats et oiseaux. Il est
      administré par l'organisme des aires protégées des Alpes cottiennes, avec des bureaux à Bussoleno,
      Fenestrelle et Avigliana pour le val Sangone.


      Deux grands monuments jalonnent l'histoire humaine. La chartreuse remonte vers 1200, fondée par des
      moines venus de Grenoble dans la lignée de saint Bruno. Le fort de Fenestrelle, dans le val Chisone,
      forme la plus imposante forteresse alpine : mis en chantier en 1728 pour verrouiller la frontière
      savoyarde face à la France, il s'élève de 1 150 mètres à Fenestrelle jusqu'à près de 2 000 mètres à Pra
      Catinat, desservi par le plus long escalier couvert d'Europe avec 4 000 marches. Sur le plan culturel,
      le parc se situe à la croisée de l'aire occitano-vaudoise au sud et de l'arpitan au nord.
    before: >-
      Dans les parcs et réserves des Alpes cottiennes, la chasse, la cueillette de fleurs et l'allumage de
      feux sont formellement interdits. S'appliquent en outre les lois nationales : circulation motorisée
      bannie des chemins, interdiction de déranger la faune, de jeter des déchets ou de ramasser des
      champignons sans autorisation. Chaque secteur dispose de son propre règlement, à consulter avant le
      départ. Si vous envisagez d'emprunter la route du col du Finestre, rappelez-vous qu'il s'agit d'une
      piste militaire panoramique ouverte seulement de juin à octobre.
    around: >-
      Tout près, à environ 3 km, s'étend le [parc naturel du Grand-Bois de
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/), et à environ 10 km le [parc naturel
      du Val Troncea](/lugar/parco-naturale-della-val-troncea/). À 11 km se trouvent les [lacs
      d'Avigliana](/lugar/parco-naturale-dei-laghi-di-avigliana/) ; de l'autre côté de la frontière, à 21 km,
      le [parc naturel régional du Queyras](/lugar/parc-naturel-regional-du-queyras/), et à vingt-six
      kilomètres le [parc national de la Vanoise](/lugar/parc-national-de-la-vanoise/).


      Plus loin, le [parc naturel des Alpes maritimes](/lugar/parco-naturale-delle-alpi-marittime/) partage
      avec l'Orsiera le bouquetin, le chamois et le loup au cœur des hauts reliefs boisés.
  de:
    intro: >-
      Drei Täler teilen sich denselben Berg, und kaum eine Straße quert ihn. Das Orsiera-Rocciavrè-Massiv in
      den nördlichen Cottischen Alpen trennt das Chisone-Tal vom Susa-Tal und umschließt den Oberlauf des
      Sangone; am 2.778 Meter hohen Rocciavré treffen alle drei Täler zusammen. Der Park entstand 1980 zum
      Schutz dieses Bergstocks, der abseits des alpinen Ferientourismus der Nachbartäler geblieben war. Bis
      heute wanderst du hier mit genau diesem Eindruck: dem eines Berges, den man in Frieden gelassen hat.
    landscape: >-
      Die Grenzen des Parks verlaufen im Schnitt um 1.400 Meter Seehöhe, während die Gipfel an die 3.000 Meter
      heranreichen: Monte Orsiera (2.890 m), Rocciavré (2.778 m) und Punta Rocca Nera (2.852 m). Der
      Gebirgsstock besteht überwiegend aus Ophiolithen, den sogenannten Grünsteinen, während andere Gesteine
      der Kontinentalplatte die Randbereiche säumen.


      Die jüngere Geschichte dieser Berge gestaltete die Erosion. Quartäre Vergletscherungen hinterließen
      Moränen, Karseen, Zungenbeckenseen, Rundhöcker und Trogtäler. Ihnen verdanken die Bergseen des Parks
      ihre Entstehung: Chardonnet, Laus, La Manica, Sottano und Soprano. Auch nach dem Eisrückzug formte der
      Frost das Relief fortwährend weiter: Durch das Abschmelzen von Gletschern und Firnfeldern gerieten
      Geröllhalden und Felsstürze in Bewegung, die bis heute aktiv sind.


      Das Wasser verteilt sich auf drei Nebenflüsse des Po. Der Chisone sammelt den Südwesten, die Dora
      Riparia entwässert den Norden und der Sangone den Südosten. Alpenseen sind zahlreich vorhanden; der
      ausgedehnteste ist der Ciardonnet-See im Zentrum des Schutzgebiets.


      Die Vegetation steigt in deutlichen Höhenstufen an. Lärchen, Zirben und Weißtannen beherrschen die
      obersten Lagen; Waldkiefern und Flaumeichen besiedeln trockene, steinige Südhänge; Erlen und Weiden
      säumen Feuchtstellen; Hainbuchen und Eichen die Hügellagen; Buchen und Linden schattige Hangmulden. Da
      die drei Täler unterschiedliche Klimabedingungen und Böden aufweisen, deckt die Pflanzendecke eine weite
      Höhenspanne ab. Die wertvollsten Wälder stocken im Sapei zwischen Bussoleno und San Giorio sowie in den
      Waldkiefernbeständen von Pra Catinat im Chisone-Tal.
    wildlife: >-
      Die [Gämse](/especie/rupicapra_rupicapra/) ist das am leichtesten zu beobachtende Huftier, da sie die
      offenen Hochweiden bevorzugt; Rehe und Hirsche suchen dagegen den Schutz geschlossener Wälder. Neben
      nachtaktiven Wildschweinen lebt im Park eine Kolonie eingeführter Mufflons, und rund fünfzig
      [Alpensteinböcke](/especie/capra_ibex/) stammen aus einem Wiederansiedlungsprogramm. Der
      [Wolf](/especie/canis_lupus/) kehrte seit den späten neunziger Jahren selbstständig zurück.


      Weiter oben, in Matten, Schutthalden und Zwergstrauchheiden, lebt eine unauffällige Kleintierwelt. Das
      [Alpenmurmeltier](/especie/marmota_marmota/) dient als Wappentier des Parks, begleitet von Hermelin,
      [Schneehuhn](/especie/lagopus_muta/), Schneehase, [Birkhuhn](/especie/tetrao_tetrix/) und Steinhuhn. In
      den tiefer gelegenen Nadelwäldern hausen Steinmarder, Dachse, Füchse, Eichhörnchen, Eichelhäher,
      Tannenmeisen und Baumläufer. In den Hochgebirgsseen schwimmen Seesaibling und Bachforelle.


      Über einhundert Vogelarten wurden erfasst, darunter imposante Greifvögel wie Habicht, Mäusebussard,
      Wespenbussard, Schlangenadler und [Steinadler](/especie/aquila_chrysaetos/). Im Sommer beleben
      Smaragdeidechsen, Blindschleichen, Feuersalamander, Bergfrösche und zahlreiche Insekten die Waldränder.


      Die Hauptbesuchszeit erstreckt sich von Juni bis Oktober, zeitgleich mit der Öffnung der Schotterstraße
      über den Colle delle Finestre.
    visit: >-
      Das Wegenetz eröffnet leichte Halbtagswanderungen, mehrtägige Trekkingtouren und Talübergänge auf der
      Grande Traversata delle Alpi (GTA) oder dem Giro dell'Orsiera. Für ruhigere Naturbeobachtungen empfiehlt
      sich das Felsenbecken von Cassafrera: Es ist übersät mit gigantischen Felsblöcken und vom Colle del
      Vento, Colle di Malanotte oder über den Pfad von Pian Mustione und Lago Rosso erreichbar.
      Übernachtungsmöglichkeiten bieten bewirtschaftete Berghütten im Parkgebiet: Selleries, Toesca, Geat
      Valgravio, Oneglio Amprimo und Balma.


      Das lohnendste Kulturziel ist die Kartause von Montebenedetto, nur wenige Kilometer vom Taleingang bei
      Villar Focchiardo entfernt. In der Kirche dokumentiert eine Dauerausstellung das Leben der
      Kartäusermönche, und ein Rundweg erschließt die baulichen Spuren der Klosteranlage. In Bussoleno
      unterhält der Park eine Umwelt- und Naturwerkstatt für didaktische Zwecke.
    history: >-
      Der Park wurde 1980 von der Region Piemont gegründet, um rund 11.000 Hektar Bergland zu schützen, und
      gehört heute als Natura-2000-Gebiet zum europäischen Schutznetz für Lebensräume und Vögel. Verwaltet
      wird er von der Schutzgebietsbehörde der Cottischen Alpen mit Anlaufstellen in Bussoleno, Fenestrelle
      sowie Avigliana für das Sangone-Tal.


      Die Geschichte der menschlichen Besiedlung spiegelt sich in zwei bedeutenden Monumenten wider. Die
      Kartause geht auf die Zeit um 1200 zurück und wurde von Kartäusern aus Grenoble im Geiste des heiligen
      Bruno errichtet. Die Festung von Fenestrelle im Chisone-Tal gilt als gewaltigste Festungsanlage der
      Alpen: Ab 1728 erbaut, um die savoyisch-französische Grenze zu sichern, erklimmt sie die Hänge von 1.150
      Metern bei Fenestrelle bis auf fast 2.000 Meter bei Pra Catinat und besitzt mit 4.000 Stufen die längste
      überdachte Treppe Europas. Kulturell verbindet der Park das okzitanisch-waldensische Brauchtum im Süden
      mit der frankoprovenzalischen Tradition im Norden.
    before: >-
      In den Parks und Schutzgebieten der Cottischen Alpen sind Jagd, Blumenpflücken und offenes Feuer strikt
      untersagt. Es gelten die allgemeinen Schutzbestimmungen: Das Befahren der Bergpfade mit Motorfahrzeugen
      ist verboten, Wildtiere dürfen nicht gestört werden, Abfälle müssen wieder mitgenommen werden und das
      Pilzsammeln bedarf einer Bewilligung. Jedes Teilgebiet verfügt über eigene Bestimmungen, die vor dem
      Aufbruch studiert werden sollten. Wer den Colle delle Finestre befahren möchte, beachte, dass es sich um
      eine hochalpine Militärstraße handelt, die nur von Juni bis Oktober geöffnet ist.
    around: >-
      Gleich nebenan, etwa 3 km entfernt, liegt der [Naturpark Gran Bosco di
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/), und rund 10 km entfernt der
      [Naturpark Val Troncea](/lugar/parco-naturale-della-val-troncea/). In 11 km Entfernung liegen die
      [Avigliana-Seen](/lugar/parco-naturale-dei-laghi-di-avigliana/); jenseits der Grenze in 21 km Entfernung
      der [Regionale Naturpark Queyras](/lugar/parc-naturel-regional-du-queyras/) und sechsundzwanzig
      Kilometer entfernt der [Nationalpark Vanoise](/lugar/parc-national-de-la-vanoise/).


      Weiter entfernt teilt der [Naturpark Seealpen](/lugar/parco-naturale-delle-alpi-marittime/) mit dem
      Orsiera Steinbock, Gämse und Wolf inmitten alpiner Fels- und Waldlandschaften.
  it:
    intro: >-
      Tre valli si spartiscono una stessa montagna e quasi nessuna strada la attraversa. L'Orsiera-Rocciavrè,
      nella parte settentrionale delle Alpi Cozie, separa la val Chisone da quella di Susa e chiude la testata
      del Sangone; sul Rocciavré, a 2.778 metri, convergono tutte e tre. Il parco è nato nel 1980 per tutelare
      questo massiccio rimasto ai margini dello sviluppo turistico delle vallate vicine, e ancora oggi lo si
      percorre con quella sensazione precisa: quella di una montagna lasciata in pace.
    landscape: >-
      I confini del parco corrono in media a circa 1.400 metri di quota, mentre le creste sfiorano i 3.000: il
      Monte Orsiera (2.890 m), il Rocciavré (2.778 m) e la Punta Rocca Nera (2.852 m). Il massiccio è
      costituito soprattutto da ofioliti, le caratteristiche pietre verdi, mentre altre rocce della placca
      continentale affiorano lungo la periferia.


      La storia recente di queste vette è stata scritta dall'erosione. Le glaciazioni del Quaternario hanno
      lasciato morene, laghi di circo, bacini di sbarramento morenico, rocce montonate e valli a U. Da qui
      traggono origine i laghi del parco: Chardonnet, Laus, La Manica, Sottano e Soprano. E il gelo non ha mai
      smesso di operare con il ritiro dei ghiacci: la fusione delle masse glaciali e dei nevai perenni ha
      innescato colate detritiche e frane tuttora in movimento.


      Le acque si dividono tra tre affluenti del Po. Il Chisone drena il settore sudoccidentale, la Dora
      Riparia raccoglie le acque a nord e il Sangone a sudest. I laghetti alpini sono numerosi, e il più
      esteso è il Ciardonnet, situato proprio al cuore dell'area protetta.


      La vegetazione risale a fasce altitudinali ben distinte. Larici, abeti bianchi e pini cembri occupano le
      vette più elevate; pini silvestri e roverelle colonizzano i versanti aridi e pietrosi; ontani e salici
      costeggiano le zone umide; carpini e querce ammantano i fondovalle collinari; faggi e tigli ombreggiano
      i valloni freschi. Poiché le tre vallate presentano climi e terreni eterogenei, il manto vegetale copre
      un'ampia escursione di quota. I complessi forestali più insigni sorgono nel Sapei, tra Bussoleno e San
      Giorio, e nelle pinete di pino silvestre di Pra Catinat, in val Chisone.
    wildlife: >-
      Il [camoscio](/especie/rupicapra_rupicapra/) è l'ungulato più facile da avvistare, amando le praterie
      aperte d'alta quota; caprioli e cervi prediligono invece il fitto dei boschi. Insieme al cinghiale,
      dalle abitudini notturne, frequenta il parco una colonia di mufloni introdotti, e una cinquantina di
      [stambecchi](/especie/capra_ibex/) discendono da interventi di reintroduzione. Il [lupo
      grigio](/especie/canis_lupus/) rappresenta il ritorno più significativo: ha ricolonizzato spontaneamente
      il territorio del parco a partire dalla fine degli anni novanta.


      Più in alto, tra pascoli sassosi, macereti e cespuglieti nani, dimora una fauna minuta e discreta. La
      [marmotta](/especie/marmota_marmota/) è il simbolo del parco, affiancata dall'ermellino, dalla [pernice
      bianca](/especie/lagopus_muta/), dalla lepre variabile, dal [fagiano di monte](/especie/tetrao_tetrix/)
      e dalla coturnice. Nelle foreste di conifere alle quote inferiori vivono faine, tassi, volpi,
      scoiattoli, ghiandaie, cingallegre e rampichini. Nei laghi montani nuotano il salmerino alpino e la
      trota fario.


      Le specie ornitiche censite superano il centinaio, comprendendo grandi rapaci come l'astore, la poiana,
      il pecchiaiolo, il biancone e l'[aquila reale](/especie/aquila_chrysaetos/). In estate una folla di
      piccoli animali anima radure e sottoboschi: ramarri, orbettini, salamandre, rane e innumerevoli insetti
      variopinti.


      La stagione migliore per le visite va da giugno a ottobre, in coincidenza con l'apertura al transito
      della carrozzabile del Colle delle Finestre.
    visit: >-
      La rete sentieristica offre piacevoli passeggiate di qualche ora, trekking di più tappe e traversate tra
      vallate lungo la Grande Traversata delle Alpi (GTA) o il Giro dell'Orsiera. Chi cerca scorci
      contemplativi troverà nella conca di Cassafrera una meta ideale: il paesaggio è cosparso di massi
      ciclopici, accessibile dal Colle del Vento, dal Colle di Malanotte o lungo il sentiero di Pian Mustione
      e del Lago Rosso. Per pernottare in quota sono attivi diversi rifugi alpini: Selleries, Toesca, Geat
      Valgravio, Oneglio Amprimo e Balma.


      La visita culturale più comoda è la Certosa di Montebenedetto, a pochi chilometri dall'accesso di Villar
      Focchiardo, incorniciata da radure e foreste. Nella chiesa è allestita una mostra permanente sulla
      civiltà certosina, affiancata da un percorso autoguidato che illustra i resti delle antiche strutture
      monastiche. A Bussoleno il parco gestisce un laboratorio didattico dedicato all'ambiente e alla cultura
      montana.
    history: >-
      Il parco è stato istituito nel 1980 dalla Regione Piemonte per salvaguardare circa 11.000 ettari, e oggi
      rientra nella rete Natura 2000 ai sensi delle direttive europee habitat e uccelli. La gestione compete
      all'Ente di gestione delle aree protette delle Alpi Cozie, con sedi a Bussoleno, Fenestrelle e ad
      Avigliana per la val Sangone.


      Le tracce storiche dell'uomo emergono in due grandi complessi monumentali. La Certosa risale all'incirca
      al 1200, fondata da monaci certosini provenienti da Grenoble sui passi di san Bruno. Il Forte di
      Fenestrelle, in val Chisone, rappresenta la più imponente fortezza delle Alpi: iniziato nel 1728 per
      presidiare il confine tra Casa Savoia e il Regno di Francia, si inerpica dai 1.150 metri di Fenestrelle
      fino a quasi 2.000 metri a Pra Catinat, con la scala coperta più lunga d'Europa forte di 4.000 gradini.
      Dal punto di vista culturale, il parco unisce la parlata occitano-valdese a sud con la matrice arpitana
      a nord.
    before: >-
      Nei parchi e nelle riserve delle Alpi Cozie è vietato cacciare, raccogliere fiori e accendere fuochi.
      Valgono inoltre le normative nazionali: è vietato circolare con mezzi a motore sui sentieri, disturbare
      la fauna, abbandonare rifiuti e raccogliere funghi senza apposito tesserino. Ciascun settore dispone di
      prescrizioni specifiche da verificare prima di partire. Se intendi valicare il Colle delle Finestre,
      tieni a mente che si tratta di una rotabile militare sterrata aperta al traffico soltanto da giugno a
      ottobre.
    around: >-
      Accanto, a circa 3 km, sorge il [Parco naturale del Gran Bosco di
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/), e a circa 10 km il [Parco naturale
      della Val Troncea](/lugar/parco-naturale-della-val-troncea/). A 11 km si trovano i [Laghi di
      Avigliana](/lugar/parco-naturale-dei-laghi-di-avigliana/); oltre il confine francese, a 21 km, il [Parco
      naturale regionale del Queyras](/lugar/parc-naturel-regional-du-queyras/), e a ventisei chilometri il
      [Parco nazionale della Vanoise](/lugar/parc-national-de-la-vanoise/).


      Più a sud, il [Parco naturale delle Alpi Marittime](/lugar/parco-naturale-delle-alpi-marittime/)
      condivide con l'Orsiera lo stambecco, il camoscio e il lupo in un austero scenario d'alta quota e
      foreste montane.
  pt:
    intro: >-
      Três vales partilham uma mesma montanha e quase nenhuma estrada a atravessa. O maciço de
      Orsiera-Rocciavrè, no norte dos Alpes Cócios, separa o vale de Chisone do de Susa e fecha a cabeceira do
      Sangone; no Rocciavré, a 2.778 metros, convergem os três. O parque nasceu em 1980 para proteger este
      maciço que permaneceu à margem do desenvolvimento turístico dos vales vizinhos, e ainda hoje se percorre
      com essa impressão autêntica: a de uma montanha que foi deixada em paz.
    landscape: >-
      Os limites do parque estendem-se em média por volta dos 1.400 metros de altitude, enquanto os cumes
      roçam os 3.000: o Monte Orsiera (2.890 m), o Rocciavré (2.778 m) e a Punta Rocca Nera (2.852 m). O
      maciço é composto sobretudo por ofiolitos, as chamadas rochas verdes, enquanto outros blocos da placa
      continental afloram na periferia.


      A história recente destas montanhas foi esculpida pela erosão. As glaciações quaternárias deixaram
      moreias, lagos de circo, lagoas de retenção glaciar, rochas aborregadas e vales em forma de U. Daí
      nasceram os lagos do parque: Chardonnet, Laus, La Manica, Sottano e Soprano. E os gelos continuaram a
      atuar após o recuo: a desaparição de glaciares e neves eternas mobilizou depósitos detríticos e
      desabamentos ainda em movimento.


      As águas dividem-se por três afluentes do Pó. O Chisone drena a vertente sudoeste, o Dora Riparia escoa
      o norte e o Sangone o sudeste. As lagoas alpinas são frequentes, sendo a maior a de Ciardonnet, situada
      bem no centro da área protegida.


      A vegetação reparte-se por andares de altitude bem demarcados. Larícios, abetos e pinheiros-suíços
      ocupam as altitudes superiores; pinheiros-silvestres e carvalhos-brancos colonizam as encostas áridas e
      pedregosas; amieiros e salgueiros orlam as zonas pantanosas; cárpinos e carvalhos vestem as colinas
      baixas; faias e tílias sombreiam as ravinas húmidas. Como os três vales apresentam condições climáticas
      e solos distintos, a flora cobre um largo desnível. As matas mais notáveis encontram-se no Sapei, entre
      Bussoleno e San Giorio, e nos pinhais de pinheiro-silvestre de Pra Catinat, no vale de Chisone.
    wildlife: >-
      A [camurça](/especie/rupicapra_rupicapra/) é o ungulado mais fácil de observar, frequentando os
      descampados de alta montanha; corços e veados preferem o resguardo da floresta. Juntamente com o javali,
      de hábitos noturnos, existe uma colónia de muflões introduzidos, e cerca de cinquenta
      [íbexes](/especie/capra_ibex/) resultam de um programa de reintrodução. O
      [lobo-cinzento](/especie/canis_lupus/) assinala o regresso mais marcante: recolonizou de forma autónoma
      o território do parque desde os finais da década de noventa.


      Mais acima, em pastos de altitude, cascalheiras e charnecas anãs, subsiste uma fauna discreta. A
      [marmota-alpina](/especie/marmota_marmota/) é o emblema do parque, partilhando o habitat com o arminho,
      a [perdiz-nival](/especie/lagopus_muta/), a lebre-variável, o [galo-lira](/especie/tetrao_tetrix/) e a
      perdiz-grega. Nos bosques de coníferas das cotas inferiores abundam fuinhas, texugos, raposas, esquilos,
      gaios, chapins-pretos e trepadeiras. Nos lagos vivem o salvelino-ártico e a truta-fario.


      As aves inventariadas ultrapassam a centena, incluindo grandes rapinas como o açor, a
      águia-de-asa-redonda, o búteo-vespeiro, a águia-cobreira e a [águia-real](/especie/aquila_chrysaetos/).
      No verão, répteis e anfíbios animam clareiras e ribeiros: lagartos-verdes, licranços, salamandras, rãs e
      milhares de insetos.


      A temporada de visitas decorre de junho a outubro, coincidindo com a abertura ao trânsito da estrada do
      Colle delle Finestre.
    visit: >-
      A rede de percursos permite caminhadas curtas de poucas horas, travessias de vários dias e rotas de vale
      em vale através da Grande Traversata delle Alpi (GTA) ou do Giro dell'Orsiera. Para contemplar paisagens
      de rocha crua, a bacia de Cassafrera é um excelente destino: o terreno está repleto de blocos
      ciclópicos, acessível a partir do Colle del Vento, do Colle di Malanotte ou pela rota de Pian Mustione e
      do Lago Rosso. No interior do parque existem vários refúgios de montanha para pernoitar: Selleries,
      Toesca, Geat Valgravio, Oneglio Amprimo e Balma.


      A atração cultural mais próxima é a Cartuxa de Montebenedetto, a poucos quilómetros da entrada de Villar
      Focchiardo, rodeada de clareiras e arvoredo. A igreja acolhe uma exposição permanente sobre a vida
      cartuxa e um circuito interpretativo descreve as ruínas do antigo mosteiro. Em Bussoleno, o parque
      mantém um polo educativo dedicado ao ambiente e às tradições alpinas.
    history: >-
      O parque foi criado em 1980 pela Região do Piemonte para salvaguardar cerca de 11.000 hectares,
      integrando hoje a rede Natura 2000 ao abrigo das diretivas comunitárias habitats e aves. A gestão cabe
      ao organismo das áreas protegidas dos Alpes Cócios, com delegações em Bussoleno, Fenestrelle e Avigliana
      para o vale do Sangone.


      A história humana manifesta-se em duas imponentes construções. A Cartuxa remonta a cerca de 1200,
      erguida por monges cartuxos que trouxeram de Grenoble os ensinamentos de São Bruno. O Forte de
      Fenestrelle, no vale de Chisone, constitui a maior fortificação dos Alpes: com início de construção em
      1728 para guarnecer a fronteira da Casa de Saboia com França, eleva-se desde os 1.150 metros em
      Fenestrelle até quase 2.000 metros em Pra Catinat, dispondo da mais longa escadaria coberta da Europa
      com 4.000 degraus. No plano cultural, o parque une o património occitano-valdense a sul e a tradição
      arpitana a norte.
    before: >-
      Nos parques e reservas dos Alpes Cócios é expressamente proibido caçar, colher plantas e acender
      fogueiras. Aplicam-se ainda as normas nacionais: não é permitida a circulação de veículos motorizados
      nos trilhos, perturbar animais selvagens, deixar lixo ou apanhar cogumelos sem a devida licença. Cada
      setor tem regulamentos próprios que deves consultar antes de partir. Se tencionas atravessar o Colle
      delle Finestre, recorda que se trata de uma via militar em terra batida aberta apenas de junho a
      outubro.
    around: >-
      Ao lado, a cerca de 3 km, situa-se o [Parque Natural do Gran Bosco di
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/), e a cerca de 10 km o [Parque Natural
      do Val Troncea](/lugar/parco-naturale-della-val-troncea/). A 11 km encontram-se os [Lagos de
      Avigliana](/lugar/parco-naturale-dei-laghi-di-avigliana/); do outro lado da fronteira, a 21 km, o
      [Parque Natural Regional de Queyras](/lugar/parc-naturel-regional-du-queyras/), e a vinte e seis
      quilómetros o [Parque Nacional de Vanoise](/lugar/parc-national-de-la-vanoise/).


      Mais a sul, o [Parque Natural dos Alpes Marítimos](/lugar/parco-naturale-delle-alpi-marittime/) partilha
      com Orsiera o íbex, a camurça e o lobo entre penedias escarpadas e florestas maduras.
