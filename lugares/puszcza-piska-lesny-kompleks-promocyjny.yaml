resumen:
  es: El mayor complejo forestal de la región de Masuria atravesado por el célebre río de canoa Krutynia.
  en: >-
    The largest forest complex in the Masurian Lake District, traversed by the celebrated Krutynia canoe
    trail.
  fr: Le plus vaste massif forestier de Mazurie, traversé par le célèbre parcours de canoë de la Krutynia.
  de: Der größte Waldkomplex der Region Masuren, durchzogen von der berühmten Krutynia-Kanu-Route.
  it: >-
    Il più esteso complesso forestale della Masuria, attraversato dal celebre percorso per canoa della
    Krutynia.
  pt: >-
    O maior complexo florestal da região da Masúria, atravessado pela célebre rota de canoagem do rio
    Krutynia.
unico:
  es: 'Un bosque que se reconstruye solo: en Szast, el hombre dejó que el huracán escribiera el guion.'
  en: >-
    A forest that regenerates itself: at Szast, foresters stepped back to let a devastating hurricane direct
    natural succession.
  fr: >-
    Une forêt qui se régénère seule : à Szast, l’homme a laissé un ouragan dévastateur guider la dynamique
    naturelle.
  de: >-
    Ein Wald, der sich selbst heilt: In Szast überließ man die Aufräumarbeiten nach einem Orkan ganz der
    natürlichen Dynamik.
  it: >-
    Una foresta che si rigenera da sola: a Szast l’uomo ha lasciato che la furia di un uragano guidasse la
    rinascita naturale.
  pt: >-
    Uma mata que se reconstrói sozinha: em Szast, o ser humano permitiu que um furacão dirigisse a regeneração
    natural.
observaciones:
  es: >-
    En los senderos forestales hay que ceder el paso a peatones y vehículos forestales, y no se puede soltar a
    los perros ni hacer fuego. La bicicleta solo puede usarse de amanecer a anochecer. Para pernoctar en el
    bosque con más de dos noches o más de nueve personas hay que pedir permiso a los forestales. En otoño e
    invierno se prohíbe la entrada a las zonas donde se celebran cacerías colectivas, cuyas fechas se
    comunican a los municipios.
texto:
  es:
    intro: >-
      El 4 de julio de 2002, un huracán se llevó por delante el bosque en el triángulo Orzysz–Pisz–Ełk. Fue la
      mayor catástrofe de la historia de la Puszcza Piska: con rachas de unos 170 km/h, el viento destruyó
      45,4 mil hectáreas de bosque en dieciséis distritos forestales, y solo en el de Pisz dañó más de 12000
      ha. Pero el bosque no se acaba ahí. La Puszcza Piska, antes llamada Puszcza Jańsborska (Johannisburger
      Heide), es el mayor complejo forestal de Masuria, con unas cien mil hectáreas de pinares y píceas sobre
      arenas de sandur, y media superficie dentro del Parque Paisajístico de Masuria.
    landscape: >-
      En el norte dominan las colinas de morrena frontal y los lagos de origen glaciar; en el sur, amplias
      llanuras de sandur cortadas por valles de turba. El glaciar cubrió la región con una capa de depósitos
      que a menudo supera los 200 m de grosor. Allí está la región de los Grandes Lagos, y el mayor lago de
      Polonia, Śniardwy, al lado de Tałty, Mikołajskie, Bełdany, Nidzkie, Mokre, Łuknajno y Pogubie Wielkie.
      Los ríos principales son el Krutynia y el Pisa.


      Entre los lagos hay también pequeños lagos distróficos de aguas pardas, ricas en humus, en depresiones
      del bosque rodeadas de turberas altas, donde crecen musgos del género Sphagnum, arándano de turbera,
      arándano rojo de pantano y pinos enanos.
    wildlife: >-
      El bosque es de pino y pícea, con algo de abedul, álamo temblón, arce, aliso y roble. Un árbol tiene
      fama propia: el pino de Masuria, que crece en las orillas orientales del lago Mokre y puede alcanzar los
      cuarenta metros y los doscientos años. En el sotobosque hay plantas protegidas como el lirio martagón,
      Polemonium caeruleum, la drosera redonda, Daphne mezereum y Cypripedium calceolus, y diez especies de
      orquídeas.


      Entre los animales están el [urogallo](/especie/tetrao_urogallus/), la cigüeña, la
      [grulla](/especie/grus_grus/), el [lobo](/especie/canis_lupus/) y, desde hace poco, el
      [lince](/especie/lynx_lynx/); también el [alce](/especie/alces_alces/), el ciervo, el corzo, el jabalí,
      el zorro, la liebre y el [castor](/especie/castor_fiber/). El área es de importancia ornitológica de
      rango europeo, y la reserva más valiosa es el lago Łuknajno, refugio del cisne vulgar. El símbolo del
      parque es la [cigüeña blanca](/especie/ciconia_ciconia/), cuyos nidos se ven en muchos pueblos. En el
      pasado también vivieron aquí uros, osos y glotones.


      Para las salidas, de mayo a octubre; en el río Krutynia, mayor afluencia por el piragüismo, y menos
      dentro del bosque.
    visit: >-
      El mejor punto de partida es Szast. Tras el huracán se creó en 2003 el Bosque de Protección Szast, de
      475 ha: se dejaron todos los árboles caídos y el bosque se renueva por sucesión natural. Desde la torre
      de observación de madera, de doce metros, y desde la pasarela alta sobre el río Pisa se sigue ese
      proceso; los grupos organizados pueden visitarlo con un guía de los forestales. La senda didáctica
      Brzeziny–Szast arranca en el Bosque Municipal de Pisz con una variante de unos 2 km en bucle y otra, más
      larga, hasta Szast, a unos 7 km de ida.


      En bici, el distrito de Pisz tiene casi 153 km de rutas señalizadas. La roja (unos 28,5 km, por Jabłoń,
      Kulik y Pogobie) es muy fácil y se recomienda para familias con niños. La azul (unos 33,4 km, por Szast
      y Wądołek) es moderadamente fácil y va casi siempre por bosque; en Wądołek hubo una aldea con la mayor
      fundición de hierro de la Prusia Oriental de su época, y hoy quedan tumbas, cimientos e instalaciones
      hidráulicas. La verde (unos 31,0 km, por Trzonki y Rostki) es corta pero dura, con desniveles y arena, y
      discurre junto al lago Śniardwy. También hay una ruta en kayak por el Pisa, de Dziadowo hasta Nowogród.


      Los forestales de Pisz gestionan además el edificio educativo ATRIUM y la senda didáctica ŁUPKI.
    history: >-
      Hasta mediados del siglo XVIII se practicó una explotación forestal de rapiña: se destruían bosques para
      dar sitio a los asentamientos. En 1977 el tramo más valioso se incorporó al Parque Paisajístico de
      Masuria, con 53,6 mil hectáreas. Entre las reservas del bosque hay lagos (Lisunie, Łuknajno, Nidzkie,
      Pogubie Wielkie, Warnołty) y las reservas Królewska Sosna y Krutynia.
    before: >-
      En los senderos forestales hay que ceder el paso a peatones y vehículos forestales, y no se puede soltar
      a los perros ni hacer fuego. La bicicleta solo puede usarse de amanecer a anochecer. Para pernoctar en
      el bosque con más de dos noches o más de nueve personas hay que pedir permiso a los forestales. En otoño
      e invierno se prohíbe la entrada a las zonas donde se celebran cacerías colectivas, cuyas fechas se
      comunican a los municipios.
    around: >-
      A cinco kilómetros queda el [Río Krutynia - Ruta Fluvial de
      Masuria](/lugar/rzeka-krutynia---szlak-kajakowy/), el río de las canoas que cruza este bosque.
  en:
    intro: >-
      On 4 July 2002, a catastrophic hurricane struck the forest triangle between Orzysz, Pisz, and Ełk. It
      was the greatest natural disaster in the recorded history of Puszcza Piska: with gusts peaking around
      170 km/h, the wind flattened 45.4 thousand hectares of woodland across sixteen forest districts,
      demolishing over 12000 ha in the Pisz district alone. Yet the forest’s resilience proved boundless.
      Puszcza Piska, historically known as Johannisburger Heide, remains the largest continuous forest expanse
      in Masuria, spanning roughly one hundred thousand hectares of Scots pine and Norway spruce over outwash
      sandur sands, with half its territory protected within the Masurian Landscape Park.
    landscape: >-
      The northern sector is characterized by hummocky frontal moraines and deep glacial ribbon lakes; the
      south transitions into sweeping sandur outwash plains incised by peaty river valleys. Continental
      glaciers mantled the bedrock with glacial drift that frequently exceeds 200 m in thickness. Here lies
      Poland’s Great Masurian Lakes region, featuring Lake Śniardwy—the country’s largest freshwater
      lake—alongside Tałty, Mikołajskie, Bełdany, Nidzkie, Mokre, Łuknajno, and Pogubie Wielkie. The primary
      drainage arteries are the Krutynia and Pisa rivers.


      Tucked among the woodlands lie dystrophic forest lakes with brown, humic waters bordered by raised bogs,
      where *Sphagnum* mosses, bog bilberries, cranberries, and dwarf pines thrive.
    wildlife: >-
      The forest is dominated by Scots pine and Norway spruce, intermingled with silver birch, trembling
      aspen, maple, black alder, and pedunculate oak. A celebrated local botanical race is the Masurian pine
      growing on the eastern shores of Lake Mokre, reaching heights of forty metres and living for two hundred
      years. The herb layer shelters protected rarities including martagon lilies, *Polemonium caeruleum*,
      round-leaved sundews, *Daphne mezereum*, lady’s slipper orchids, and ten species of wild orchids.


      Wildlife includes the [western capercaillie](/especie/tetrao_urogallus/), [common
      crane](/especie/grus_grus/), [grey wolf](/especie/canis_lupus/), and recently returning [Eurasian
      lynx](/especie/lynx_lynx/), alongside [moose](/especie/alces_alces/), red deer, roe deer, wild boars,
      red foxes, European hares, and [Eurasian beavers](/especie/castor_fiber/). The territory holds European
      importance for avifauna, centered on the Lake Łuknajno biosphere reserve, a renowned sanctuary for mute
      swans. The park’s iconic emblem is the [white stork](/especie/ciconia_ciconia/), nesting atop chimneys
      and posts across rural hamlets.


      The best time to visit is from May to October; canoeing brings moderate summer traffic along the
      Krutynia, while the forest interior remains quiet.
    visit: >-
      The primary gateway is Szast. Following the storm, foresters designated the 475 ha Szast Protection
      Forest in 2003: timber was left unharvested to allow spontaneous ecological succession. From a
      twelve-metre wooden observation tower and a high footbridge spanning the Pisa river, visitors can track
      this recovery; organized groups can tour with forestry rangers. The Brzeziny-Szast nature trail departs
      from the Pisz Municipal Forest, offering a 2 km loop and an extended 7 km one-way route to Szast.


      For cycling, the Pisz forest district maintains nearly 153 km of waymarked routes. The Red Trail (around
      28.5 km, via Jabłoń, Kulik, and Pogobie) is an easy ride suited for families with children. The Blue
      Trail (roughly 33.4 km, via Szast and Wądołek) provides a moderate forest ride passing the industrial
      archaeology of Wądołek, once East Prussia’s largest iron foundry. The Green Trail (around 31.0 km, via
      Trzonki and Rostki) is a shorter but demanding cross-country trail along Lake Śniardwy. A canoe trail
      also traces the Pisa river down to Nowogród.


      Pisz foresters also manage the ATRIUM environmental education pavilion and the ŁUPKI educational path.
    history: >-
      Until the mid-XVIII century, predatory timber mining cleared vast tracts for colonial settlements. In
      1977 the most ecologically intact core was gazetted as the Masurian Landscape Park, encompassing 53.6
      thousand hectares. Nature reserves within the forest safeguard key waters (Lisunie, Łuknajno, Nidzkie,
      Pogubie Wielkie, Warnołty) and ancient stands at Królewska Sosna and Krutynia.
    before: >-
      On forest tracks, yield to pedestrians and forestry vehicles; dogs must remain on leashes and open fires
      are strictly banned. Cycling is permitted from sunrise to sunset. Wilderness overnight stays exceeding
      two nights or groups larger than nine people require prior forestry registration. Seasonal closures
      apply during collective winter hunting drives.
    around: >-
      Five kilometres away flows the [Krutynia River - Masurian Water
      Trail](/lugar/rzeka-krutynia---szlak-kajakowy/), the legendary canoe waterway traversing this forest.
  fr:
    intro: >-
      Le 4 juillet 2002, un ouragan d’une violence inouïe ravagea le triangle Orzysz–Pisz–Ełk. Ce fut la plus
      grande catastrophe forestière de l’histoire de la Puszcza Piska : avec des rafales atteignant 170 km/h,
      les vents abattirent 45,4 mille hectares de forêt sur seize districts forestiers, détruisant plus de
      12000 ha sur le seul secteur de Pisz. Pourtant, la forêt a su renaître. La Puszcza Piska, jadis lande de
      Johannisburg, constitue le plus grand massif boisé de Mazurie, couvrant environ cent mille hectares de
      pinèdes et d’épicéas sur des sables fluvioglaciaires de sandur, dont la moitié est classée en parc
      paysager.
    landscape: >-
      Le nord est marqué par des moraines frontales bosselées et de grands lacs glaciaires ; le sud s’ouvre
      sur de vastes plaines sableuses de sandur coupées de tourbières. Les glaciations ont recouvert la région
      d’un manteau morainique dépassant souvent 200 m d’épaisseur. C’est le domaine des Grands Lacs de
      Mazurie, dont le lac Śniardwy—le plus vaste plan d’eau de Pologne—entouré de Tałty, Mikołajskie,
      Bełdany, Nidzkie, Mokre, Łuknajno et Pogubie Wielkie. Les rivières maîtresses sont la Krutynia et la
      Pisa.


      Au cœur des boisements se nichent des lacs dystrophes aux eaux brunes et acides entourés de tourbières à
      sphaignes, où prospèrent canneberges, linaigrettes et pins rabougris.
    wildlife: >-
      La forêt est dominée par le pin sylvestre et l’épicéa commun, accompagnés de bouleaux, trembles,
      érables, aulnes et chênes. Une variété indigène réputée, le pin de Mazurie, pousse sur les rives du lac
      Mokre, pouvant s’élever à quarante mètres et vivre deux cents ans. Le sous-bois abrite le lis martagon,
      la polémoine bleue, la droséra à feuilles rondes, le bois-joli, le sabot de Vénus et dix espèces
      d’orchidées.


      La faune compte le [grand tétras](/especie/tetrao_urogallus/), la [grue cendrée](/especie/grus_grus/),
      le [loup gris](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/), aux côtés de
      [l’élan](/especie/alces_alces/), du cerf, du chevreuil, du sanglier, du renard et du [castor
      d’Europe](/especie/castor_fiber/). La région constitue une zone d’intérêt ornithologique majeur, dont le
      joyau est le lac Łuknajno, sanctuaire mondial du cygne tuberculé. L’emblème du parc est la [cigogne
      blanche](/especie/ciconia_ciconia/), qui niche sur les toits des villages.


      La période de visite s’étend de mai à octobre ; la fréquentation est modérée sur la Krutynia en canoë et
      très faible dans les sous-bois.
    visit: >-
      Le point d’observation le plus saisissant est Szast. Après l’ouragan fut créée en 2003 la forêt de
      protection de Szast sur 475 ha : les chablis furent laissés au sol pour observer la régénération
      naturelle. Une tour de bois haute de douze mètres et une passerelle dominant la Pisa permettent de
      suivre ce renouveau ; des visites guidées sont proposées par les forestiers. Le sentier didactique
      Brzeziny–Szast démarre de la forêt communale de Pisz, avec une boucle courte de 2 km et une variante de
      7 km vers Szast.


      À vélo, le district de Pisz offre près de 153 km d’itinéraires balisés. Le circuit rouge (environ 28,5
      km, via Jabłoń et Pogobie) est très facile pour les familles. Le circuit bleu (environ 33,4 km, via
      Szast et Wądołek) chemine en forêt près des vestiges de l’ancienne fonderie de fer de Wądołek. Le
      circuit vert (environ 31,0 km, via Trzonki) est un tracé vallonné longeant le lac Śniardwy. Une descente
      en kayak descend la rivière Pisa jusqu’à Nowogród.


      L’administration de Pisz gère également l’espace pédagogique ATRIUM et le sentier ŁUPKI.
    history: >-
      Jusqu’au milieu du XVIIIe siècle, une exploitation forestière destructrice défricha d’immenses surfaces
      pour la colonisation rurale. En 1977, le secteur le plus préservé fut érigé en parc paysager de Mazurie
      sur 53,6 mille hectares. De multiples réserves protègent les plans d’eau (Lisunie, Łuknajno, Nidzkie,
      Pogubie Wielkie, Warnołty) et les peuplements historiques de Królewska Sosna et de la Krutynia.
    before: >-
      Sur les chemins forestiers, la priorité revient aux piétons et aux engins de gestion ; chiens en laisse
      obligatoires et feux interdits. Le vélo est permis du lever au coucher du soleil. Les bivouacs dépassant
      deux nuits ou regroupant plus de neuf personnes requièrent une autorisation préalable. En automne et
      hiver, l’accès est interdit dans les zones de battues.
    around: >-
      À cinq kilomètres coule la [rivière Krutynia - voie navigable de
      Mazurie](/lugar/rzeka-krutynia---szlak-kajakowy/), célèbre ruban fluvial traversant ce massif.
  de:
    intro: >-
      Am 4. Juli 2002 verwüstete ein zerstörerischer Orkan das Dreieck Orzysz–Pisz–Ełk. Es war die schwerste
      Naturkatastrophe in der Geschichte der Puszcza Piska: Mit Böen um 170 km/h warf der Sturm 45,4 Tausend
      Hektar Wald in sechzehn Forstämtern nieder und vernichtete allein im Forstamt Pisz über 12000 ha. Doch
      der Wald behauptete sich. Die Puszcza Piska, früher Johannisburger Heide genannt, ist der größte
      Waldkomplex Masurens mit rund einhunderttausend Hektar Kiefern- und Fichtenforsten auf nacheiszeitlichen
      Sandern, zur Hälfte geschützt im Landschaftspark Masuren.
    landscape: >-
      Im Norden prägen Endmoränenhügel und tiefe Rinnenseen das Bild; der Süden geht in weite Sanderflächen
      über, die von Flusstälern zerschnitten werden. Die Inlandeismassen hinterließen Ablagerungen von oft
      über 200 m Mächtigkeit. Hier erstreckt sich die Masurische Seenplatte mit dem Spirdingsee (Śniardwy),
      dem größten See Polens, neben Tałty, Mikołajskie, Bełdany, Nidzkie, Mokre, Łuknajno und Pogubie Wielkie.
      Hauptflüsse sind Krutynia und Pisa.


      In Senken verstecken sich dystrophe Moorseen mit braunem Humuswasser, umgeben von Hochmooren mit
      Torfmoosen, Moosbeeren, Rauschbeeren und Zwergkiefern.
    wildlife: >-
      Kiefern und Fichten dominieren, durchsetzt von Birke, Zappel-Pappel, Ahorn, Schwarzerle und Stieleiche.
      Eine floristische Berühmtheit ist die Masurische Kiefer am Mokre-See, die vierzig Meter Höhe und
      zweihundert Jahre Alter erreicht. Am Waldboden gedeihen Türkenbund-Lilie, Blaue Himmelsleiter,
      Rundblättriger Sonnentau, Seidelbast, Frauenschuh und zehn Orchideenarten.


      Zur Tierwelt gehören [Auerhuhn](/especie/tetrao_urogallus/), [Kranich](/especie/grus_grus/),
      [Wolf](/especie/canis_lupus/) und [Eurasischer Luchs](/especie/lynx_lynx/), ergänzt durch
      [Elch](/especie/alces_alces/), Rothirsch, Reh, Wildschwein, Rotfuchs und [Europäischen
      Biber](/especie/castor_fiber/). Das Vogelschutzgebiet von europäischem Rang kulminiert am Łuknajno-See,
      einem Biosphärenreservat für Höckerschwäne. Wappenvogel des Parks ist der
      [Weißstorch](/especie/ciconia_ciconia/), dessen Nester viele Dörfer zieren.


      Beste Besuchszeit ist Mai bis Oktober; auf der Krutynia herrscht reger Paddelverkehr, während der Wald
      ruhig bleibt.
    visit: >-
      Hauptanziehungspunkt ist Szast. Nach dem Orkan wurde 2003 der 475 ha große Schutzwald Szast
      eingerichtet: Sämtliches Sturmholz blieb liegen, um die natürliche Sukzession zu dokumentieren. Ein
      zwölf Meter hoher hölzerner Aussichtsturm und ein Steg über die Pisa erschließen das Areal für
      Führungen. Der Lehrpfad Brzeziny–Szast beginnt am Stadtwald von Pisz mit einer 2 km langen Runde und
      einer 7 km langen Wanderung nach Szast.


      Für Radfahrer bietet das Forstamt Pisz fast 153 km markierte Wege. Die rote Route (rund 28,5 km über
      Jabłoń und Pogobie) ist leicht und familienfreundlich. Die blaue Route (rund 33,4 km über Szast und
      Wądołek) führt durch Wald zur Wüstung des historischen Hüttenwerks Wądołek. Die grüne Route (rund 31,0
      km über Trzonki) verläuft anspruchsvoll am Spirdingsee entlang. Beliebt ist auch die Kajakroute auf der
      Pisa bis Nowogród.


      Das Forstamt betreibt zudem das Bildungszentrum ATRIUM und den Lehrpfad ŁUPKI.
    history: >-
      Bis Mitte des XVIII. Jahrhunderts herrschte Raubbau, um Siedlungsland zu gewinnen. Im Jahr 1977 wurde
      der wertvollste Kernbereich als Landschaftspark Masuren auf 53,6 Tausend Hektar ausgewiesen. Zahlreiche
      Reservate schützen Seen (Lisunie, Łuknajno, Nidzkie, Pogubie Wielkie, Warnołty) sowie historische
      Waldbestände an der Królewska Sosna und Krutynia.
    before: >-
      Auf Forstwegen haben Fußgänger Vorrang; Hunde gehören an die Leine, offenes Feuer ist verboten.
      Radfahren ist von Sonnenaufgang bis Sonnenuntergang gestattet. Für Zeltaufenthalte von mehr als zwei
      Nächten oder Gruppen über neun Personen ist eine Genehmigung erforderlich. Im Herbst und Winter sind
      gesperrte Jagdzonen zu beachten.
    around: >-
      Fünf Kilometer entfernt fließt der [Fluss Krutynia - Masurische
      Wasserstraße](/lugar/rzeka-krutynia---szlak-kajakowy/), der berühmte Paddelfluss dieser Waldregion.
  it:
    intro: >-
      Il 4 luglio 2002 un uragano di inaudita violenza devastò il triangolo Orzysz–Pisz–Ełk. Fu la più grave
      sciagura naturale nella storia della Puszcza Piska: con raffiche vicine a 170 km/h, le tempeste
      abbatterono 45,4 mila ettari di bosco in sedici distretti forestali, spazzando via oltre 12000 ha nel
      solo territorio di Pisz. Eppure il bosco non si è arreso. La Puszcza Piska, anticamente nota come
      brughiera di Johannisburg, è il comprensorio forestale maggiore della Masuria con circa centomila ettari
      di pini e abeti su sabbie fluvioglaciali di sandur, per metà compresi nel Parco Paesaggistico della
      Masuria.
    landscape: >-
      A nord dominano colline moreniche frontali e grandi laghi glaciali; a sud il paesaggio si apre in piane
      alluvionali sabbiose incise da torbiere. La coltre di sedimenti glaciali supera sovente i 200 m di
      spessore. Qui si estende la Terra dei Grandi Laghi con lo Śniardwy—il bacino lacustre più esteso di
      Polonia—assieme a Tałty, Mikołajskie, Bełdany, Nidzkie, Mokre, Łuknajno e Pogubie Wielkie. I corsi
      d’acqua principali sono la Krutynia e la Pisa.


      Nel cuore delle conifere si nascondono piccoli laghi distrofici dalle acque scure cinte da torbiere a
      sfagni, mirtilli palustri e pini nani.
    wildlife: >-
      Il manto arboreo vede predominare pino silvestre e abete rosso, affiancati da betulle, pioppi tremuli,
      aceri, ontani e farnie. Una varietà locale famosa è il pino di Masuria sulle rive del lago Mokre, che
      tocca quaranta metri d’altezza e duecento anni d’età. Nel sottobosco crescono giglio martagone,
      polemonio azzurro, drosera a foglie rotonde, fior di stecco, pianella della Madonna e dieci specie di
      orchidee.


      La fauna vanta il [gallo cedrone](/especie/tetrao_urogallus/), la [gru cenerina](/especie/grus_grus/),
      il [lupo](/especie/canis_lupus/) e la [lince eurasiatica](/especie/lynx_lynx/), oltre ad
      [alci](/especie/alces_alces/), cervi, caprioli, cinghiali, volpi e [castori
      europei](/especie/castor_fiber/). La riserva del lago Łuknajno è un santuario ornitologico d’importanza
      europea per il cigno reale. Il simbolo dell’area protetta è la [cicogna
      bianca](/especie/ciconia_ciconia/), che nidifica sui tetti dei borghi.


      Il periodo consigliato va da maggio a ottobre; sul fiume Krutynia il canoismo genera affluenza, mentre i
      sentieri boschivi restano solitari.
    visit: >-
      Il punto focale è la località di Szast. Dopo la tempesta venne istituito nel 2003 il Bosco di Protezione
      di Szast su 475 ha: gli schianti furono lasciati intatti per documentare la successione ecologica. Una
      torre d’avvistamento lignea di dodici metri e una passerella sul fiume Pisa consentono di seguire i
      processi naturali; si organizzano visite con le guide forestali. Il sentiero didattico Brzeziny–Szast
      parte dal Bosco Comunale di Pisz con un anello di 2 km e un prolungamento di 7 km verso Szast.


      In bicicletta il comprensorio di Pisz conta quasi 153 km di tracciati. Il percorso rosso (circa 28,5 km
      via Jabłoń e Pogobie) è accessibile per famiglie. Il tracciato blu (circa 33,4 km via Szast e Wądołek)
      attraversa la foresta toccando le rovine dell’antica ferriera di Wądołek. Il sentiero verde (circa 31,0
      km via Trzonki) costeggia il lago Śniardwy. Un tracciato in kayak scende il fiume Pisa fino a Nowogród.


      Il distretto gestisce anche il polo didattico ATRIUM e il sentiero ŁUPKI.
    history: >-
      Fino a metà Settecento lo sfruttamento forestale fu indiscriminato per fare spazio a insediamenti
      coloniali. Nel 1977 l’area di maggior pregio venne inserita nel Parco Paesaggistico della Masuria su
      53,6 mila ettari. Numerose riserve tutelano laghi (Lisunie, Łuknajno, Nidzkie, Pogubie Wielkie,
      Warnołty) e alberi storici presso Królewska Sosna e la Krutynia.
    before: >-
      Sui percorsi forestali la precedenza spetta ai pedoni e ai veicoli di servizio; cani al guinzaglio e
      divieto assoluto di fuochi. L’uso della bicicletta è consentito dall’alba al tramonto. I pernottamenti
      in tenda superiori a due notti o per gruppi di oltre nove persone richiedono autorizzazione forestale.
      In autunno e inverno si applicano divieti nelle aree battute dalle battute di caccia.
    around: >-
      A cinque chilometri scorre il [Fiume Krutynia - Rotta Fluviale della
      Masuria](/lugar/rzeka-krutynia---szlak-kajakowy/), celebre arteria per canoa che attraversa la foresta.
  pt:
    intro: >-
      A 4 de julho de 2002, um violento furacão varreu o triângulo Orzysz–Pisz–Ełk. Constituiu a maior
      catástrofe florestal da história da Puszcza Piska: com rajadas a rondar os 170 km/h, o vendaval destruiu
      45,4 mil hectares de matas em dezasseis distritos florestais, devastando mais de 12000 ha apenas na
      circunscrição de Pisz. Mas a floresta renasceu. A Puszcza Piska, outrora charneca de Johannisburg, é a
      maior massa florestal da Masúria com cerca de cem mil hectares de pinhais e espruces sobre areias de
      sandur, metade integrada no Parque Paisagístico da Masúria.
    landscape: >-
      No setor norte predominam moreias frontais e lagos de origem glaciar; a sul estendem-se vastas planícies
      arenosas de sandur sulcadas por turfeiras. O manto de depósitos glaciares supera amiúde os 200 m de
      espessura. Aqui localiza-se a Região dos Grandes Lagos da Polónia, destacando-se o lago Śniardwy—o maior
      do país—junto a Tałty, Mikołajskie, Bełdany, Nidzkie, Mokre, Łuknajno e Pogubie Wielkie. Os rios
      fundamentais são o Krutynia e o Pisa.


      No coração do arvoredo abrigam-se pequenas lagoas distróficas de águas escuras marginadas por turfeiras
      de esfagno, mirtilos e pinheiros-anões.
    wildlife: >-
      O coberto florestal é dominado pelo pinheiro-silvestre e espruce, pontuados por bétulas,
      choupos-tremedores, áceres, amieiros e carvalhos. Uma variedade autóctone célebre é o
      pinheiro-da-masúria nas margens do lago Mokre, que atinge quarenta metros de altura e duzentos anos de
      vida. O sub-bosque acolhe o lírio-martagão, a flor-do-paraíso, a drósera, o daphne e dez espécies de
      orquídeas selvagens.


      Na fauna avultam o [tetraz-grande](/especie/tetrao_urogallus/), o [grou-comum](/especie/grus_grus/), o
      [lobo](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/), a par do
      [alce](/especie/alces_alces/), veado, corço, javali, raposa e [castor-europeu](/especie/castor_fiber/).
      O território tem relevo ornitológico continental, centrando-se na reserva do lago Łuknajno, refúgio de
      cisnes-mudos. O símbolo do parque é a [cegonha-branca](/especie/ciconia_ciconia/), nidificante nas
      aldeias.


      A época recomendada decorre de maio a outubro; o rio Krutynia regista afluência moderada de canoas,
      enquanto a mata profunda permanece silenciosa.
    visit: >-
      O ponto de partida mais marcante é Szast. No rescaldo do furacão foi criada em 2003 a Floresta de
      Proteção de Szast com 475 ha: as árvores caídas não foram retiradas para permitir a sucessão ecológica
      natural. Uma torre de observação em madeira com doze metros e um passadiço sobre o rio Pisa permitem
      acompanhar a recuperação; organizam-se visitas acompanhadas por guardas florestais. O trilho
      interpretativo Brzeziny–Szast parte da Mata Municipal de Pisz com uma volta curta de 2 km e um trajeto
      de 7 km até Szast.


      Em bicicleta, o distrito de Pisz dispõe de quase 153 km de rotas assinaladas. O circuito vermelho (cerca
      de 28,5 km por Jabłoń e Pogobie) é fácil e familiar. O trilho azul (cerca de 33,4 km por Szast e
      Wądołek) cruza densas matas até às ruínas da histórica fundição de ferro de Wądołek. O trilho verde
      (cerca de 31,0 km por Trzonki) acompanha o lago Śniardwy. Realizam-se também descidas de caiaque no rio
      Pisa até Nowogród.


      Os serviços florestais gerem ainda o espaço educativo ATRIUM e o trilho ŁUPKI.
    history: >-
      Até meados do século XVIII vigorou uma exploração florestal esgotante para desbravar terras agrícolas.
      Em 1977 o setor mais intacto foi integrado no Parque Paisagístico da Masúria com 53,6 mil hectares.
      Várias reservas preservam lagoas (Lisunie, Łuknajno, Nidzkie, Pogubie Wielkie, Warnołty) e árvores
      seculares em Królewska Sosna e Krutynia.
    before: >-
      Nas veredas florestais a prioridade cabe a caminhantes e viaturas florestais; cães devem andar com trela
      e é proibido foguear. O uso de bicicleta é autorizado do amanhecer ao anoitecer. Acampamentos superiores
      a duas noites ou grupos com mais de nove pessoas exigem autorização florestal prévia. No outono e
      inverno aplicam-se restrições nas zonas de caça coletiva.
    around: >-
      A cinco quilómetros corre o [Rio Krutynia - Rota Fluvial da
      Masúria](/lugar/rzeka-krutynia---szlak-kajakowy/), o emblemático percurso de canoagem que atravessa esta
      floresta.
