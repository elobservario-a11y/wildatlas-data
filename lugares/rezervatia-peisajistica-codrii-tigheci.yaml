resumen:
  es: Punto más alto del sur de Moldavia cubierto de bosques frondosos relictos entre mesetas de estepa.
  en: The highest point in southern Moldova, draped in relict broadleaf forests amid steppe plateaus.
  fr: >-
    Le point culminant du sud de la Moldavie, recouvert de forêts feuillues reliques au milieu de plateaux de
    steppe.
  de: Der höchste Punkt im Süden Moldaus, bedeckt von Relikt-Laubwäldern inmitten von Steppenhochflächen.
  it: Il punto più alto del sud della Moldavia, coperto di foreste latifoglie relitte tra altopiani di steppa.
  pt: >-
    O ponto mais alto do sul da Moldávia coberto de florestas de folha caduca relíquia entre planaltos de
    estepe.
unico:
  es: >-
    Un bosque que fue enorme y hoy es una isla: conserva nueve plantas raras del Libro Rojo moldavo y el punto
    más alto del sur del país.
  en: >-
    A forest that was once enormous and survives today as an island: nine rare plants from the Moldovan Red
    Book and the highest point in the south of the country.
  fr: >-
    Une forêt qui fut immense et survit aujourd'hui comme une île : neuf plantes rares du Livre Rouge moldave
    et le point culminant du sud du pays.
  de: >-
    Ein Wald, der einst riesig war und heute als Insel überleben: neun seltene Pflanzen aus dem Roten Buch
    Moldaus und der höchste Punkt im Süden des Landes.
  it: >-
    Una foresta che fu immensa e sopravvive oggi come un'isola: nove piante rare del Libro Rosso moldavo e il
    punto più alto del sud del paese.
  pt: >-
    Uma floresta que foi enorme e sobrevive hoje como uma ilha: nove plantas raras do Livro Vermelho moldavo e
    o ponto mais alto do sul do país.
observaciones:
  es: >-
    Los mejores meses son de mayo a octubre. No hay senderos propios descritos dentro de la reserva: para
    saber qué tramos se pueden recorrer, consulta al servicio forestal que la gestiona.
texto:
  es:
    intro: >-
      Dimitrie Cantemir lo dejó escrito: los bosques de Tigheci eran tan densos que solo los cruzaban quienes
      conocían bien los caminos y los senderos. Hoy lo que queda de aquel monte es una isla verde en el sur de
      Moldavia, la Reserva Paisajística Codrii Tigheci, de 2.519 hectáreas, entre los pueblos de Lărguța y
      Capaclia, en el distrito de Cantemir. La administra la empresa forestal estatal de Iargara.
    landscape: >-
      Un mapa de 1785, impreso en Núremberg, lo documenta como un bosque mucho mayor que el actual. En 1869,
      otro mapa lo hacía seguir hacia el sur, rodeando los pueblos de Slobozia, Colibași, Brînza y Văleni
      hasta llegar al Danubio en Giurgiulești. Lo que se conserva cubre laderas empinadas, y en su territorio
      está el punto más alto del sur de Moldavia, a 301 metros.


      Dominan el roble albar y el carpe, con una mezcla escasa de tilo, fresno y arces. En el sur de la
      reserva hay un robledal de roble común bien conservado, con mezcla de roble pubescente. Entre los
      árboles poco frecuentes la reserva cuenta el roble pubescente y el árbol del humo.
    wildlife: >-
      Aquí el protagonista es la flora. La reserva tiene nueve plantas raras protegidas en el Libro Rojo de
      Moldavia. En los claros del bosque crecen plantas mesófilas y muchas plantas raras de la zona
      balcano-mediterránea, entre ellas el *ghiocel* (campanilla de invierno) y la *brânduşă* (un croco). Tres
      de esas plantas, entre ellas la campanilla de invierno, aparecen entre las descritas como amenazadas.
    visit: >-
      El servicio forestal de Iargara incluye Codrii Tigheci en su oferta turística: una ruta turística que
      une Borogani, Tigheci, Baiuş, Sărata-Nouă y Cazangic. Dentro del plan turístico del distrito hay también
      caminatas por Codrii Tigheci como parte de un itinerario de 8 kilómetros, de unas tres o cuatro horas,
      que combina un tramo a pie con otro en coche. El pueblo de Tigheci linda con el bosque.


      En el monte puedes parar en la fuente Fântâna Zânelor, que quedó allí desde la época del monasterio.
    history: >-
      En el bosque hubo un monasterio dedicado a la Dormición de la Madre de Dios, del que queda la fuente.
      Los terrenos pertenecieron al gobernante Constantin Cantemir, padre de Dimitrie Cantemir. Hay además un
      lugar llamado Cetăţuia Cociulia donde antaño existió una fortaleza geto-dacia. La leyenda dice que en
      estos bosques creció Petru Rareș, hijo de Esteban el Grande.


      Codrii Tigheci está reconocida como área natural protegida por el Estado moldavo.
    before: >-
      Los mejores meses son de mayo a octubre. No hay senderos propios descritos dentro de la reserva: para
      saber qué tramos se pueden recorrer, consulta al servicio forestal que la gestiona.
  en:
    intro: >-
      Dimitrie Cantemir wrote it down: the forests of Tigheci were so dense that only those who knew the
      tracks and paths well could cross them. What remains of that great woodland today is a green island in
      southern Moldova — the Codrii Tigheci Landscape Reserve, covering 2,519 hectares between the villages of
      Lărguța and Capaclia in Cantemir District. It is administered by the state forestry company of Iargara.
    landscape: >-
      A map of 1785, printed in Nuremberg, shows it as a forest much larger than today. By 1869, another map
      extended it southward, surrounding the villages of Slobozia, Colibași, Brînza and Văleni all the way to
      the Danube at Giurgiulești. What survives now covers steep hillsides, and within its territory stands
      the highest point in southern Moldova at 301 metres.


      Sessile oak and hornbeam dominate, with a sparse admixture of lime, ash and maples. In the southern part
      of the reserve, a well-preserved stand of pedunculate oak mixed with downy oak grows well. Among the
      less common trees, the reserve counts downy oak and smoke tree.
    wildlife: >-
      Here it is the flora that takes centre stage. The reserve holds nine rare plants listed in the Red Book
      of Moldova. In the forest clearings grow mesophilous species and many rare plants of the
      Balkan-Mediterranean zone, including the snowdrop (*ghiocel*) and the crocus (*brânduşă*). Three of
      those plants, including the snowdrop, are listed as threatened.
    visit: >-
      The Iargara forestry service includes Codrii Tigheci in its tourism offer: a tourist route linking
      Borogani, Tigheci, Baiuş, Sărata-Nouă and Cazangic. The district tourism plan also features walks
      through Codrii Tigheci as part of an 8-kilometre itinerary lasting three to four hours, combining a
      section on foot with a section by car. The village of Tigheci borders the forest directly.


      Inside the forest you can pause at the Fântâna Zânelor spring, which has survived here since the time of
      the monastery.
    history: >-
      A monastery dedicated to the Dormition of the Mother of God once stood in the forest, and the spring is
      its remaining trace. The lands belonged to the ruler Constantin Cantemir, father of Dimitrie Cantemir.
      There is also a place called Cetăţuia Cociulia where a Geto-Dacian fortress once stood. Legend holds
      that Petru Rareș, son of Stephen the Great, grew up in these forests.


      Codrii Tigheci is recognised as a protected natural area by the Moldovan state.
    before: >-
      The best months are May to October. No dedicated trails within the reserve are described: to find out
      which sections can be walked, consult the forestry service that manages it.
  fr:
    intro: >-
      Dimitrie Cantemir l'a écrit : les forêts de Tigheci étaient si denses que seuls ceux qui connaissaient
      bien les chemins et les sentiers pouvaient les traverser. Ce qu'il reste aujourd'hui de ce grand massif
      est une île verte dans le sud de la Moldavie — la réserve paysagère Codrii Tigheci, couvrant 2 519
      hectares entre les villages de Lărguța et Capaclia dans le district de Cantemir. Elle est gérée par la
      société forestière d'État d'Iargara.
    landscape: >-
      Une carte de 1785, imprimée à Nuremberg, la représente comme une forêt bien plus étendue qu'aujourd'hui.
      En 1869, une autre carte la prolongeait vers le sud, entourant les villages de Slobozia, Colibași,
      Brînza et Văleni jusqu'au Danube à Giurgiulești. Ce qui subsiste recouvre des versants raides, et dans
      son territoire se trouve le point culminant du sud de la Moldavie, à 301 mètres.


      Le chêne sessile et le charme dominent, avec un mélange clairsemé de tilleul, de frêne et d'érables.
      Dans la partie sud de la réserve, une belle chênaie pédonculée mêlée de chêne pubescent est bien
      conservée. Parmi les arbres rares, la réserve compte le chêne pubescent et le fustet.
    wildlife: >-
      Ici c'est la flore qui est à l'honneur. La réserve abrite neuf plantes rares inscrites au Livre rouge de
      Moldavie. Dans les clairières poussent des espèces mésophiles et de nombreuses plantes rares de la zone
      balkano-méditerranéenne, dont la perce-neige (*ghiocel*) et le crocus (*brânduşă*). Trois de ces
      plantes, dont la perce-neige, figurent parmi les espèces menacées.
    visit: >-
      Le service forestier d'Iargara intègre Codrii Tigheci dans son offre touristique : un itinéraire reliant
      Borogani, Tigheci, Baiuş, Sărata-Nouă et Cazangic. Le plan touristique du district propose également des
      randonnées à travers Codrii Tigheci dans le cadre d'un parcours de 8 kilomètres, d'une durée de trois à
      quatre heures, combinant une section à pied et une section en voiture. Le village de Tigheci jouxte la
      forêt.


      À l'intérieur de la forêt, vous pouvez faire halte à la source Fântâna Zânelor, qui remonte à l'époque
      du monastère.
    history: >-
      Un monastère dédié à la Dormition de la Mère de Dieu s'élevait jadis dans la forêt, dont la source est
      l'unique vestige. Les terres appartenaient au gouverneur Constantin Cantemir, père de Dimitrie Cantemir.
      Il existe aussi un lieu appelé Cetăţuia Cociulia où se dressait autrefois une forteresse géto-dace. La
      légende veut que Petru Rareș, fils d'Étienne le Grand, ait grandi dans ces forêts.


      Codrii Tigheci est reconnue comme aire naturelle protégée par l'État moldave.
    before: >-
      Les meilleurs mois sont mai à octobre. Aucun sentier propre à la réserve n'est décrit : pour savoir
      quels tronçons sont accessibles, contactez le service forestier gestionnaire.
  de:
    intro: >-
      Dimitrie Cantemir hat es aufgeschrieben: Die Wälder von Tigheci waren so dicht, dass sie nur überqueren
      konnte, wer die Wege und Pfade gut kannte. Was von diesem großen Wald heute noch übrig ist, bildet eine
      grüne Insel im Süden Moldaus — das Landschaftsreservat Codrii Tigheci, das 2.519 Hektar zwischen den
      Dörfern Lărguța und Capaclia im Bezirk Cantemir umfasst. Verwaltet wird es von der staatlichen
      Forstgesellschaft Iargara.
    landscape: >-
      Eine Karte von 1785, in Nürnberg gedruckt, zeigt es als weit größeren Wald als heute. 1869 verlängerte
      eine weitere Karte ihn nach Süden, umschloss die Dörfer Slobozia, Colibași, Brînza und Văleni und
      reichte bis zur Donau bei Giurgiulești. Was sich erhalten hat, bedeckt steile Hänge, und in seinem
      Gebiet liegt der höchste Punkt des südlichen Moldaus auf 301 Metern.


      Traubeneiche und Hainbuche dominieren, mit einem spärlichen Beimischung von Linde, Esche und Ahorn. Im
      Süden des Reservats wächst ein gut erhaltener Stieleichenbestand mit Flaumeiche. Zu den selteneren
      Bäumen zählen Flaumeiche und Perückenstrauch.
    wildlife: >-
      Hier steht die Flora im Mittelpunkt. Das Reservat beherbergt neun seltene Pflanzen, die im Roten Buch
      Moldaus aufgelistet sind. In den Waldlichtungen wachsen mesophile Arten und viele seltene Pflanzen der
      balkanisch-mediterranen Zone, darunter das Schneeglöckchen (*ghiocel*) und der Krokus (*brânduşă*). Drei
      dieser Pflanzen, darunter das Schneeglöckchen, stehen auf der Liste der bedrohten Arten.
    visit: >-
      Der Forstbetrieb Iargara hat Codrii Tigheci in sein Tourismusangebot aufgenommen: eine Touristenroute,
      die Borogani, Tigheci, Baiuş, Sărata-Nouă und Cazangic verbindet. Der Tourismusplan des Bezirks sieht
      auch Wanderungen durch Codrii Tigheci vor, als Teil einer 8 Kilometer langen Route, die drei bis vier
      Stunden dauert und einen Fußabschnitt mit einer Autofahrt kombiniert. Das Dorf Tigheci grenzt
      unmittelbar an den Wald.


      Im Wald kannst du an der Quelle Fântâna Zânelor rasten, die noch aus der Zeit des Klosters stammt.
    history: >-
      Im Wald stand einst ein Kloster, das der Dormitio der Gottesmutter geweiht war; die Quelle ist sein
      einziges Überbleibsel. Die Ländereien gehörten dem Herrscher Constantin Cantemir, Vater von Dimitrie
      Cantemir. Es gibt auch einen Ort namens Cetăţuia Cociulia, wo früher eine getodakische Festung stand.
      Die Legende besagt, dass Petru Rareș, Sohn Stephans des Großen, in diesen Wäldern aufgewachsen ist.


      Codrii Tigheci ist vom moldauischen Staat als geschütztes Naturareal anerkannt.
    before: >-
      Die besten Monate sind Mai bis Oktober. Im Reservat sind keine eigenen Wege ausgewiesen: Welche
      Abschnitte begehbar sind, erfährst du beim zuständigen Forstbetrieb.
  it:
    intro: >-
      Dimitrie Cantemir lo scrisse: le foreste di Tigheci erano così fitte che solo chi conosceva bene le
      strade e i sentieri riusciva ad attraversarle. Quello che resta oggi di quel grande bosco è un'isola
      verde nel sud della Moldavia — la Riserva paesaggistica Codrii Tigheci, di 2.519 ettari tra i villaggi
      di Lărguța e Capaclia nel distretto di Cantemir. È amministrata dall'azienda forestale statale di
      Iargara.
    landscape: >-
      Una mappa del 1785, stampata a Norimberga, la rappresenta come un bosco molto più esteso dell'attuale.
      Nel 1869, un'altra mappa la prolungava verso sud, circondando i villaggi di Slobozia, Colibași, Brînza e
      Văleni fino al Danubio a Giurgiulești. Ciò che si è conservato ricopre versanti ripidi, e nel suo
      territorio si trova il punto più alto del sud della Moldavia, a 301 metri.


      Dominano la rovere e il carpino, con una rada mescolanza di tiglio, frassino e aceri. Nel settore sud
      della riserva cresce un buon querceto di farnia con roverella ben conservato. Tra gli alberi meno comuni
      figurano la roverella e lo scotano.
    wildlife: >-
      Qui è la flora la protagonista assoluta. La riserva ospita nove piante rare inserite nel Libro Rosso
      della Moldavia. Nelle radure crescono specie mesofile e molte piante rare dell'area
      balcano-mediterranea, tra cui il bucaneve (*ghiocel*) e il croco (*brânduşă*). Tre di queste piante, tra
      cui il bucaneve, figurano nell'elenco delle specie minacciate.
    visit: >-
      Il servizio forestale di Iargara include Codrii Tigheci nella sua offerta turistica: un itinerario che
      collega Borogani, Tigheci, Baiuş, Sărata-Nouă e Cazangic. Il piano turistico del distretto prevede anche
      escursioni attraverso Codrii Tigheci nell'ambito di un percorso di 8 chilometri della durata di tre o
      quattro ore, che combina un tratto a piedi e uno in auto. Il villaggio di Tigheci confina direttamente
      con il bosco.


      All'interno della foresta puoi fare una sosta alla fonte Fântâna Zânelor, presente sin dai tempi del
      monastero.
    history: >-
      Nel bosco sorgeva un monastero dedicato alla Dormizione della Madre di Dio, del quale resta la fonte
      come unica traccia. Le terre appartenevano al governante Constantin Cantemir, padre di Dimitrie
      Cantemir. Esiste anche un luogo chiamato Cetăţuia Cociulia dove un tempo si trovava una fortezza
      geto-dacica. La leggenda narra che Petru Rareș, figlio di Stefano il Grande, sia cresciuto in queste
      foreste.


      Codrii Tigheci è riconosciuta come area naturale protetta dallo Stato moldavo.
    before: >-
      I mesi migliori vanno da maggio a ottobre. All'interno della riserva non sono descritti sentieri propri:
      per sapere quali tratti si possono percorrere, contatta il servizio forestale che la gestisce.
  pt:
    intro: >-
      Dimitrie Cantemir deixou-o escrito: as florestas de Tigheci eram tão densas que só as atravessavam quem
      conhecia bem os caminhos e as veredas. O que resta hoje daquela grande mata é uma ilha verde no sul da
      Moldávia — a Reserva Paisagística Codrii Tigheci, de 2.519 hectares entre as aldeias de Lărguța e
      Capaclia, no distrito de Cantemir. É administrada pela empresa florestal estatal de Iargara.
    landscape: >-
      Um mapa de 1785, impresso em Nuremberga, documenta-a como uma floresta muito maior do que a atual. Em
      1869, outro mapa prolongava-a para sul, circundando as aldeias de Slobozia, Colibași, Brînza e Văleni
      até ao Danúbio em Giurgiulești. O que se conservou cobre encostas íngremes, e no seu território
      encontra-se o ponto mais alto do sul da Moldávia, a 301 metros.


      Dominam o carvalho-alvarinho e o carpino, com escassa mistura de tília, freixo e bordos. Na parte sul da
      reserva existe um carvalhal de carvalho-roble bem conservado com mistura de carvalho-pubescente. Entre
      as árvores menos frequentes contam-se o carvalho-pubescente e a sumagreira.
    wildlife: >-
      Aqui o protagonista é a flora. A reserva tem nove plantas raras protegidas no Livro Vermelho da
      Moldávia. Nas clareiras crescem plantas mesófilas e muitas plantas raras da zona balcano-mediterrânica,
      entre elas o *ghiocel* (campainha-de-inverno) e a *brânduşă* (um croco). Três dessas plantas, entre elas
      a campainha-de-inverno, figuram entre as descritas como ameaçadas.
    visit: >-
      O serviço florestal de Iargara inclui Codrii Tigheci na sua oferta turística: um itinerário que liga
      Borogani, Tigheci, Baiuş, Sărata-Nouă e Cazangic. O plano turístico do distrito prevê também caminhadas
      por Codrii Tigheci como parte de um percurso de 8 quilómetros, de três a quatro horas, que combina um
      trecho a pé com outro de carro. A aldeia de Tigheci é contígua à floresta.


      No interior da mata podes parar na fonte Fântâna Zânelor, que ficou ali desde a época do mosteiro.
    history: >-
      Na floresta existia um mosteiro dedicado à Dormição da Mãe de Deus, do qual resta a fonte. As terras
      pertenceram ao governante Constantin Cantemir, pai de Dimitrie Cantemir. Existe ainda um lugar chamado
      Cetăţuia Cociulia onde antigamente existiu uma fortaleza geto-dácica. A lenda diz que Petru Rareș, filho
      de Estêvão, o Grande, cresceu nestas florestas.


      Codrii Tigheci está reconhecida como área natural protegida pelo Estado moldavo.
    before: >-
      Os melhores meses são de maio a outubro. Não há trilhos próprios descritos dentro da reserva: para saber
      que troços se podem percorrer, consulta o serviço florestal que a gere.
