resumen:
  es: >-
    El mayor lago natural de llanura de Francia en invierno, meca ornítica cubierta de camalotes y lirios de
    agua.
  en: >-
    The largest natural lowland lake in France in winter, a birdlife mecca covered in water hyacinths and
    yellow water lilies.
  fr: >-
    Le plus grand lac naturel de plaine de France en hiver, haut lieu ornithologique couvert de jacinthes
    d'eau et de nénuphars.
  de: Größter natürlicher Tieflandsee Frankreichs im Winter, ein Vogelmekka voller Schwimmpflanzen und Seerosen.
  it: >-
    Il più grande lago naturale di pianura della Francia in inverno, mecca ornitologica coperta di piante
    acquatiche e ninfee.
  pt: >-
    O maior lago natural de planície de França no inverno, meca ornitológica coberta de jacintos-de-água e
    nenúfares.
unico:
  es: >-
    Un lago que cambia de tamaño con las estaciones y esconde, entre nenúfares y bosques flotantes, la segunda
    gran reserva de aves de Francia.
  en: >-
    A lake that changes size with the seasons and hides, among water lilies and floating woods, France's
    second great bird reserve.
  fr: >-
    Un lac qui change de taille au fil des saisons et cache, entre nénuphars et bois flottants, la deuxième
    grande réserve ornithologique de France.
  de: >-
    Ein See, der mit den Jahreszeiten seine Größe ändert und zwischen Seerosen und schwimmenden Wäldern das
    zweitgrößte Vogelreservat Frankreichs birgt.
  it: >-
    Un lago che cambia dimensioni con le stagioni e nasconde, tra ninfee e boschi galleggianti, la seconda
    grande riserva di uccelli della Francia.
  pt: >-
    Um lago que muda de tamanho com as estações e esconde, entre nenúfares e bosques flutuantes, a segunda
    grande reserva de aves de França.
observaciones:
  es: >-
    El lago cambia con las estaciones, así que decide qué quieres ver: el invierno para patos, gaviotas y
    estorninos; de marzo a octubre para los murciélagos; el otoño para las aves de paso. Para asomarte a la
    reserva cuenta con el acceso supervisado que ofrece el observatorio ornitológico de Grand-Lieu.
texto:
  es:
    intro: >-
      Grand-Lieu respira. En los meses cálidos el lago se encoge hasta unas 3.500 hectáreas; cuando llega el
      invierno se abre hasta 6.500 o 7.000 y se convierte en el mayor lago natural de llanura de Francia. Lo
      sorprendente es que apenas tiene fondo: tres metros de profundidad máxima. Como el terreno es casi
      plano, el agua no se queda en una cubeta, se derrama sobre carrizales, prados y bosques de sauces, y los
      contornos cambian de una estación a otra.


      Es un lago de hundimiento a veinte minutos de Nantes en coche, con una reserva natural nacional de 2.695
      hectáreas protegida desde 1980. Está clasificado como humedal Ramsar desde el 1 de febrero de 1995, y se
      le considera la segunda reserva ornitológica de Francia tras la Camarga.
    landscape: >-
      Aquí el agua manda sobre el relieve. Dos ríos alimentan el lago, el Ognon por el este y el Boulogne por
      el sureste, y como la pendiente es mínima, el nivel sube y baja y se lleva consigo el borde. En el
      centro queda el agua libre, poco vegetada; alrededor, una sucesión de ambientes que el lago combina sin
      transición brusca.


      Los herbazales flotantes ocupan 720 hectáreas y cubren buena parte de la superficie de nenúfares blancos
      y amarillos. Más allá del agua abierta aparecen los levis, bosques flotantes, además de marismas y
      prados inundables que se cubren o no según la estación. Los carrizales arbolados, de sauces y carrizos,
      son la guardería de los patos: en ellos anidan el porrón europeo y el porrón moñudo.


      Debajo, el suelo guarda otra historia. El yacimiento de turba del lago es el quinto de Francia.
    wildlife: >-
      Con 270 especies de aves registradas, Grand-Lieu se entiende mejor por temporadas.


      En invierno el lago es un dormitorio. Hasta 30 000 patos descansan en las aguas libres del centro; en
      enero dominan el pato cuchara, con 5067 ejemplares, y la cerceta común, con 4812. Más de 19 000 gaviotas
      reidoras prefieren la calma del lago a la agitación del litoral, y los estorninos pintos locales se unen
      a los llegados del norte y del este de Europa. Al atardecer, con suerte, cientos de miles de ellos
      dibujan en el cielo esas nubes en movimiento que llaman murmuraciones. Desde el Pabellón se aprecia lo
      que es el invierno aquí: el agua sube hasta el edificio y cubre los prados húmedos.


      En primavera y verano mandan las aves que crían. Entre 50 y 120 parejas de fumarel común, del 30 al 50 %
      de la población francesa, y entre 30 y 50 parejas de [espátula común](/especie/platalea_leucorodia/)
      crían en el lago. De marzo a octubre vuelan los murciélagos, mientras hay insectos: se han identificado
      veinte especies. El murciélago de Nathusius es de los más activos y migra; ha recorrido hasta 1905 km.
      El murciélago grande de herradura se observa desde hace años en el Pabellón.


      El otoño es de paso y de despedidas. Los últimos paseriformes de carrizal, como el
      [pechiazul](/especie/luscinia_svecica/), parten hacia el Mediterráneo y África entre septiembre y
      octubre; los jóvenes [martinetes comunes](/especie/nycticorax_nycticorax/) emprenden viaje a África
      occidental entre septiembre y noviembre. Una cuarentena de espátulas se alimentan con regularidad cerca
      del Pabellón, y en octubre, con el nivel bajo, se dejan ver avocetas comunes y agachadizas comunes.
      También en octubre las arañas jóvenes dejan el nido y se dispersan colgadas de hilos de seda. La
      mariposa pavo real hiberna en edificios como el Pabellón.


      Entre los mamíferos se cuentan unas cincuenta especies, la [nutria](/especie/lutra_lutra/) entre ellas;
      hay doce especies de anfibios, con la rana bermeja, y treinta de peces, con la anguila. En total, 550
      especies de plantas.
    visit: >-
      El punto de partida es la Maison du Lac, centro de visitantes con su Pabellón junto al agua. La visita
      inmersiva combina un centro de exposición, un paseo sonoro y el pabellón en tres etapas, . En verano se
      organizan además visitas comentadas desde el observatorio ornitológico de Passay, y el observatorio
      ornitológico de Grand-Lieu ofrece acceso supervisado a la reserva regional.


      Si prefieres el agua, desde la escala náutica de Pont-Saint-Martin se puede recorrer en canoa el río
      Ognon. Y para llegar sin coche hay dos opciones: el tren Nantes-Pornic con parada en Bouaye, a veinte
      minutos a pie, o un paseo en bicicleta de 21 km desde el centro de Nantes, de nivel accesible, que se
      hace en una hora y cuarto aproximadamente.
    history: >-
      Hoy es reserva, pero estuvo a punto de ser tierra de labor. En 1809 el conde de Juigné, dueño de los
      derechos señoriales, proyectó desecar el lago para ganar terrenos de cultivo. Más tarde, una sociedad
      con mayoría neerlandesa pensó en desecarlo para cultivar tulipanes; el plan se abandonó.


      El giro llegó con Guerlain. Donó parte del lago al Estado en diciembre de 1977 y la reserva natural se
      declaró el 10 de septiembre de 1980.


      Los retos actuales son el agua y las invasoras. En 2024 el conservador de la reserva informó de que el
      agua empeoraba desde hacía cinco años por el aporte de nutrientes de las tierras agrícolas. Tres
      especies invasoras dañan el ecosistema: el cangrejo de Luisiana, el coipú y una planta acuática. Esa
      planta exótica invade además los prados húmedos y hace desaparecer plantas locales cuyas semillas
      alimentan a los patos, que bajan en número.
    before: >-
      El lago cambia con las estaciones, así que decide qué quieres ver: el invierno para patos, gaviotas y
      estorninos; de marzo a octubre para los murciélagos; el otoño para las aves de paso. Para asomarte a la
      reserva cuenta con el acceso supervisado que ofrece el observatorio ornitológico de Grand-Lieu.
    around: >-
      No hay otro espacio del atlas cerca, pero sí un hermano lejano: el [Parque Natural de la Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) comparte con Grand-Lieu la espátula común y la nutria.
  en:
    intro: >-
      Grand-Lieu breathes. In the warm months the lake shrinks to around 3,500 hectares; when winter arrives
      it opens up to 6,500 or 7,000 and becomes the largest natural lowland lake in France. What is striking
      is how shallow it is: three metres at its deepest. Because the ground is almost flat, the water does not
      stay inside a basin; it spills across reedbeds, meadows and willow woods, and the shoreline shifts from
      one season to the next.


      It is a subsidence lake twenty minutes by car from Nantes, with a 2,695-hectare national nature reserve
      protected since 1980. It has been listed as a Ramsar wetland since 1 February 1995, and is regarded as
      France's second bird reserve after the Camargue.
    landscape: >-
      Here water rules over relief. Two rivers feed the lake, the Ognon from the east and the Boulogne from
      the south-east, and because the gradient is minimal, the level rises and falls and carries the edge with
      it. In the centre lies open water with little vegetation; around it, a succession of habitats that the
      lake blends without abrupt transitions.


      Floating meadows cover 720 hectares and blanket much of the surface with white and yellow water lilies.
      Beyond the open water appear the *levis*, floating woods, along with marshes and flood meadows that are
      submerged or exposed depending on the season. The wooded reedbeds, of willows and reeds, are the duck
      nursery: common pochard and tufted duck nest there.


      Beneath, the soil holds another story. The lake's peat deposit is the fifth largest in France.
    wildlife: >-
      With 270 bird species recorded, Grand-Lieu is best understood by season.


      In winter the lake is a roost. Up to 30,000 ducks rest on the open central waters; in January northern
      shoveler leads with 5,067 birds, followed by Eurasian teal with 4,812. More than 19,000 black-headed
      gulls prefer the calm of the lake to the rough coast, and local common starlings join arrivals from
      northern and eastern Europe. At dusk, with luck, hundreds of thousands of them trace those shifting
      sky-clouds called murmurations. From the Pavilion you can feel what winter means here: the water rises
      right up to the building and covers the wet meadows.


      In spring and summer breeding birds take over. Between 50 and 120 pairs of black tern, from 30 to 50 %
      of the French population, and between 30 and 50 pairs of [Eurasian
      spoonbill](/especie/platalea_leucorodia/) breed on the lake. From March to October bats fly while
      insects are out: twenty species have been identified. Nathusius's pipistrelle is among the most active
      and migrates; it has travelled up to 1,905 km. The greater horseshoe bat has been recorded at the
      Pavilion for years.


      Autumn is for passage and farewells. The last reedbed passerines, such as the
      [bluethroat](/especie/luscinia_svecica/), leave for the Mediterranean and Africa between September and
      October; young [black-crowned night herons](/especie/nycticorax_nycticorax/) set off for West Africa
      between September and November. Around forty spoonbills feed regularly near the Pavilion, and in
      October, when levels drop, pied avocets and common snipe appear. Also in October, young spiders leave
      the nest and disperse on threads of silk. The peacock butterfly hibernates in buildings such as the
      Pavilion.


      Mammals number around fifty species, the [Eurasian otter](/especie/lutra_lutra/) among them; there are
      twelve species of amphibians, including the common frog, and thirty of fish, including the European eel.
      In all, 550 plant species.
    visit: >-
      The starting point is the Maison du Lac, the visitor centre with its waterside Pavilion. The immersive
      visit combines an exhibition centre, a sound walk and the pavilion in three stages. In summer, guided
      visits are also run from the Passay bird observatory, and the Grand-Lieu bird observatory offers
      supervised access to the regional reserve.


      If you prefer the water, from the Pont-Saint-Martin landing stage you can paddle a canoe along the Ognon
      river. And to arrive without a car there are two options: the Nantes–Pornic train stopping at Bouaye,
      twenty minutes away on foot, or an accessible 21 km bike ride from central Nantes, taking roughly an
      hour and a quarter.
    history: >-
      Today it is a reserve, yet it nearly became farmland. In 1809 the Count of Juigné, holder of the
      seigneurial rights, planned to drain the lake to gain arable land. Later, a mostly Dutch company
      considered draining it to grow tulips; the plan was abandoned.


      The turning point came with Guerlain. It donated part of the lake to the State in December 1977 and the
      nature reserve was declared on 10 September 1980.


      Today's challenges are water quality and invasive species. In 2024 the reserve's curator reported that
      water quality had been worsening for five years due to nutrient runoff from farmland. Three invasive
      species harm the ecosystem: the red swamp crayfish, the coypu and an aquatic plant. That exotic plant
      also invades wet meadows and crowds out native plants whose seeds feed the ducks, whose numbers are
      falling.
    before: >-
      The lake changes with the seasons, so decide what you want to see: winter for ducks, gulls and
      starlings; March to October for bats; autumn for passage birds. To look out over the reserve, make use
      of the supervised access offered by the Grand-Lieu bird observatory.
    around: >-
      There is no other atlas site nearby, though there is a distant sibling: [Ria Formosa Natural
      Park](/lugar/parque-natural-da-ria-formosa/) shares the Eurasian spoonbill and the otter with
      Grand-Lieu.
  fr:
    intro: >-
      Grand-Lieu respire. Pendant les mois chauds, le lac se rétracte jusqu'à environ 3 500 hectares ; lorsque
      vient l'hiver, il s'étend jusqu'à 6 500 ou 7 000 hectares et devient le plus grand lac naturel de plaine
      de France. Ce qui surprend, c'est qu'il n'a presque pas de fond : trois mètres de profondeur maximale.
      Comme le terrain est presque plat, l'eau ne reste pas dans une cuvette, elle se répand sur les
      roselières, les prairies et les saulaies, et les contours changent d'une saison à l'autre.


      C'est un lac d'effondrement à vingt minutes de Nantes en voiture, avec une réserve naturelle nationale
      de 2 695 hectares protégée depuis 1980. Il est classé zone humide Ramsar depuis le 1 février 1995 et est
      considéré comme la deuxième réserve ornithologique de France après la Camargue.
    landscape: >-
      Ici, l'eau commande le relief. Deux rivières alimentent le lac, l'Ognon à l'est et la Boulogne au
      sud-est, et comme la pente est infime, le niveau monte et descend en entraînant la rive avec lui. Au
      centre reste l'eau libre, peu végétalisée ; autour se succèdent des milieux que le lac combine sans
      transition brusque.


      Les herbiers flottants occupent 720 hectares et couvrent une bonne part de la surface de nénuphars
      blancs et jaunes. Au-delà de l'eau libre apparaissent les levis, bois flottants, ainsi que des marais et
      prairies inondables recouverts ou non selon la saison. Les roselières boisées, faites de saules et de
      roseaux, sont la nurserie des canards : le fuligule milouin et le fuligule morillon y nichent.


      Dessous, le sol garde une autre histoire. Le gisement de tourbe du lac est le cinquième de France.
    wildlife: >-
      Avec 270 espèces d'oiseaux recensées, Grand-Lieu se comprend mieux par saisons.


      En hiver, le lac est un dortoir. Jusqu'à 30 000 canards se reposent sur les eaux libres du centre ; en
      janvier dominent le canard souchet, avec 5 067 individus, et la sarcelle d'hiver, avec 4 812. Plus de 19
      000 mouettes rieuses préfèrent le calme du lac à l'agitation du littoral, et les étourneaux sansonnets
      locaux rejoignent ceux venus du nord et de l'est de l'Europe. Au crépuscule, avec de la chance, des
      centaines de milliers d'entre eux dessinent dans le ciel ces nuages mouvants appelés murmurations.
      Depuis le Pavillon, on mesure ce qu'est l'hiver ici : l'eau monte jusqu'au bâtiment et recouvre les
      prairies humides.


      Au printemps et en été dominent les oiseaux nicheurs. Entre 50 et 120 couples de guifette noire, soit 30
      à 50 % de la population française, et entre 30 et 50 couples de [spatule
      blanche](/especie/platalea_leucorodia/) nichent sur le lac. De mars à octobre volent les chauves-souris
      tant qu'il y a des insectes : vingt espèces ont été identifiées. La pipistrelle de Nathusius compte
      parmi les plus actives et migre ; elle a parcouru jusqu'à 1 905 km. Le grand rhinolophe est observé
      depuis des années dans le Pavillon.


      L'automne est celui du passage et des départs. Les derniers passereaux des roselières, comme la
      [gorgebleue à miroir](/especie/luscinia_svecica/), partent vers la Méditerranée et l'Afrique entre
      septembre et octobre ; les jeunes [bihoreaux gris](/especie/nycticorax_nycticorax/) entament leur voyage
      vers l'Afrique de l'Ouest entre septembre et novembre. Une quarantaine de spatules se nourrissent
      régulièrement près du Pavillon et, en octobre, avec les basses eaux, on aperçoit des avocettes élégantes
      et des bécassines des marais. En octobre également, les jeunes araignées quittent le nid et se
      dispersent suspendues à des fils de soie. Le paon-du-jour hiberne dans des bâtiments comme le Pavillon.


      Parmi les mammifères on compte une cinquantaine d'espèces, dont la [loutre
      d'Europe](/especie/lutra_lutra/) ; il y a douze espèces d'amphibiens, dont la grenouille rousse, et
      trente de poissons, dont l'anguille. Au total, 550 espèces de plantes.
    visit: >-
      Le point de départ est la Maison du Lac, centre d'accueil doté de son Pavillon au bord de l'eau. La
      visite immersive combine un centre d'exposition, une promenade sonore et le pavillon en trois étapes. En
      été sont aussi organisées des visites commentées depuis l'observatoire ornithologique de Passay, et
      l'observatoire ornithologique de Grand-Lieu offre un accès encadré à la réserve régionale.


      Si vous préférez l'eau, depuis la halte nautique de Pont-Saint-Martin il est possible de parcourir
      l'Ognon en canoë. Et pour venir sans voiture, il y a deux options : le train Nantes-Pornic avec arrêt à
      Bouaye, à vingt minutes à pied, ou une balade à vélo de 21 km depuis le centre de Nantes, de niveau
      accessible, qui se fait en environ une heure et quart.
    history: >-
      Aujourd'hui c'est une réserve, mais le site a failli devenir terre agricole. En 1809, le comte de
      Juigné, détenteur des droits seigneuriaux, projeta d'assécher le lac pour gagner des terres cultivables.
      Plus tard, une société à majorité néerlandaise envisagea de l'assécher pour y cultiver des tulipes ; le
      projet fut abandonné.


      Le tournant vint avec Guerlain, qui donna une partie du lac à l'État en décembre 1977 ; la réserve
      naturelle fut créée le 10 septembre 1980.


      Les défis actuels sont l'eau et les espèces envahissantes. En 2024, le conservateur de la réserve a
      indiqué que la qualité de l'eau se dégradait depuis cinq ans en raison des apports de nutriments venus
      des terres agricoles. Trois espèces envahissantes nuisent à l'écosystème : l'écrevisse de Louisiane, le
      ragondin et une plante aquatique. Cette plante exotique envahit aussi les prairies humides et fait
      disparaître des plantes locales dont les graines nourrissent les canards, qui diminuent en nombre.
    before: >-
      Le lac change avec les saisons, choisissez donc ce que vous voulez voir : l'hiver pour les canards,
      mouettes et étourneaux ; de mars à octobre pour les chauves-souris ; l'automne pour les oiseaux de
      passage. Pour observer la réserve, profitez de l'accès encadré proposé par l'observatoire ornithologique
      de Grand-Lieu.
    around: >-
      Il n'y a pas d'autre espace de l'atlas à proximité, mais un cousin lointain : le [Parc naturel de la Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) partage avec Grand-Lieu la spatule blanche et la loutre
      d'Europe.
  de:
    intro: >-
      Grand-Lieu atmet. In den warmen Monaten schrumpft der See auf rund 3.500 Hektar; kommt der Winter, dehnt
      er sich auf 6.500 oder 7.000 aus und wird zum größten natürlichen Tieflandsee Frankreichs. Überraschend
      ist seine geringe Tiefe: höchstens drei Meter. Da das Gelände fast eben ist, bleibt das Wasser nicht in
      einem Becken, sondern ergießt sich über Schilfröhrichte, Wiesen und Weidenwälder, sodass sich die
      Umrisse von Jahreszeit zu Jahreszeit ändern.


      Es ist ein Senkungssee zwanzig Autominuten von Nantes entfernt, mit einem 2.695 Hektar großen nationalen
      Naturreservat, das seit 1980 geschützt ist. Seit dem 1. Februar 1995 ist er als Ramsar-Feuchtgebiet
      eingestuft und gilt nach der Camargue als zweitwichtigstes Vogelreservat Frankreichs.
    landscape: >-
      Hier bestimmt das Wasser über das Relief. Zwei Flüsse speisen den See, der Ognon von Osten und die
      Boulogne von Südosten, und da das Gefälle minimal ist, steigt und fällt der Pegel und verschiebt das
      Ufer mit sich. In der Mitte bleibt offenes, kaum bewachsenes Wasser; ringsum folgt eine Abfolge von
      Lebensräumen, die der See ohne scharfe Übergänge verbindet.


      Schwimmende Pflanzenrasen nehmen 720 Hektar ein und bedecken einen Großteil der Fläche mit Weißen
      Seerosen und Gelben Teichrosen. Jenseits des offenen Wassers erscheinen die *levis*, schwimmende Wälder,
      dazu Sümpfe und Überschwemmungswiesen, die je nach Jahreszeit überflutet sind oder trockenfallen. Die
      baumbestandenen Röhrichte aus Weiden und Schilf sind die Kinderstube der Enten: Dort brüten Tafelente
      und Reiherente.


      Darunter birgt der Boden eine weitere Geschichte. Das Torfvorkommen des Sees ist das fünftgrößte
      Frankreichs.
    wildlife: >-
      Mit 270 nachgewiesenen Vogelarten versteht man Grand-Lieu am besten nach Jahreszeiten.


      Im Winter ist der See ein Schlafplatz. Bis zu 30.000 Enten ruhen auf dem offenen Wasser in der Mitte; im
      Januar dominieren Löffelente mit 5.067 Exemplaren und Krickente mit 4.812. Mehr als 19.000 Lachmöwen
      ziehen die Ruhe des Sees der Unruhe der Küste vor, und die heimischen Stare schließen sich Zuzüglern aus
      Nord- und Osteuropa an. In der Abenddämmerung zeichnen Hunderttausende von ihnen mit etwas Glück jene
      bewegten Wolken an den Himmel, die man Murmurations nennt. Vom Pavillon aus spürt man, was Winter hier
      bedeutet: Das Wasser steigt bis ans Gebäude und bedeckt die Feuchtwiesen.


      Im Frühling und Sommer bestimmen die Brutvögel. Zwischen 50 und 120 Paare der Trauerseeschwalbe – 30 bis
      50 % des französischen Bestands – und zwischen 30 und 50 Paare des
      [Löfflers](/especie/platalea_leucorodia/) brüten am See. Von März bis Oktober fliegen die Fledermäuse,
      solange es Insekten gibt: Zwanzig Arten wurden bestimmt. Die Rauhautfledermaus gehört zu den aktivsten
      und zieht; sie hat bis zu 1.905 km zurückgelegt. Die Große Hufeisennase wird seit Jahren am Pavillon
      beobachtet.


      Der Herbst gehört dem Durchzug und den Abschieden. Die letzten Röhricht-Singvögel wie das
      [Blaukehlchen](/especie/luscinia_svecica/) ziehen zwischen September und Oktober Richtung Mittelmeer und
      Afrika ab; die jungen [Nachtreiher](/especie/nycticorax_nycticorax/) brechen zwischen September und
      November nach Westafrika auf. Rund vierzig Löffler suchen regelmäßig nahe dem Pavillon nach Nahrung, und
      im Oktober zeigen sich bei niedrigem Wasserstand Säbelschnäbler und Bekassinen. Ebenfalls im Oktober
      verlassen junge Spinnen das Nest und verdriften an Seidenfäden. Das Tagpfauenauge überwintert in
      Gebäuden wie dem Pavillon.


      Unter den Säugetieren zählt man rund fünfzig Arten, darunter der [Eurasische
      Fischotter](/especie/lutra_lutra/); es gibt zwölf Amphibienarten mit dem Grasfrosch und dreißig
      Fischarten mit dem Aal. Insgesamt wachsen hier 550 Pflanzenarten.
    visit: >-
      Ausgangspunkt ist die Maison du Lac, ein Besucherzentrum mit seinem Pavillon direkt am Wasser. Der
      immersive Besuch verbindet ein Ausstellungszentrum, einen Klangspaziergang und den Pavillon in drei
      Etappen. Im Sommer werden zudem kommentierte Führungen ab dem Vogelobservatorium Passay angeboten, und
      das Vogelobservatorium Grand-Lieu bietet betreuten Zugang zum Regionalreservat.


      Wenn du das Wasser vorziehst, kannst du ab der Anlegestelle Pont-Saint-Martin mit dem Kanu den Fluss
      Ognon befahren. Und um ohne Auto anzureisen, gibt es zwei Möglichkeiten: den Zug Nantes–Pornic bis
      Bouaye, zwanzig Minuten zu Fuß entfernt, oder eine gut machbare 21-km-Radtour vom Zentrum von Nantes,
      die etwa eineinviertel Stunden dauert.
    history: >-
      Heute ist es ein Reservat, doch beinahe wäre es Ackerland geworden. 1809 plante der Graf von Juigné,
      Inhaber der Grundherrschaft, den See trockenzulegen, um Anbauflächen zu gewinnen. Später erwog eine
      mehrheitlich niederländische Gesellschaft, ihn für den Tulpenanbau trockenzulegen; der Plan wurde
      aufgegeben.


      Die Wende kam mit Guerlain. Das Haus schenkte dem Staat im Dezember 1977 einen Teil des Sees, und am 10.
      September 1980 wurde das Naturreservat ausgewiesen.


      Die heutigen Herausforderungen sind Wasserqualität und invasive Arten. 2024 berichtete der Konservator
      des Reservats, dass sich das Wasser seit fünf Jahren durch Nährstoffeinträge aus der Landwirtschaft
      verschlechtere. Drei invasive Arten schädigen das Ökosystem: der Rote Amerikanische Sumpfkrebs, die
      Nutria und eine Wasserpflanze. Diese exotische Pflanze überwuchert zudem die Feuchtwiesen und verdrängt
      heimische Pflanzen, deren Samen den Enten als Nahrung dienen, deren Zahl sinkt.
    before: >-
      Der See wandelt sich mit den Jahreszeiten, entscheide also, was du sehen willst: den Winter für Enten,
      Möwen und Stare; März bis Oktober für Fledermäuse; den Herbst für Zugvögel. Um einen Blick ins Reservat
      zu werfen, nutze den betreuten Zugang des Vogelobservatoriums Grand-Lieu.
    around: >-
      In der Nähe gibt es kein anderes Atlas-Gebiet, wohl aber einen fernen Verwandten: Der [Naturpark Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) teilt mit Grand-Lieu den Löffler und den Fischotter.
  it:
    intro: >-
      Grand-Lieu respira. Nei mesi caldi il lago si restringe fino a circa 3.500 ettari; quando arriva
      l'inverno si apre fino a 6.500 o 7.000 e diventa il maggiore lago naturale di pianura della Francia. La
      cosa sorprendente è che non ha quasi fondo: tre metri di profondità massima. Poiché il terreno è quasi
      piatto, l'acqua non resta in una conca, si riversa su canneti, prati e saliceti, e i contorni cambiano
      da una stagione all'altra.


      È un lago di sprofondamento a venti minuti d'auto da Nantes, con una riserva naturale nazionale di 2.695
      ettari protetta dal 1980. È classificato come zona umida Ramsar dal 1 febbraio 1995 ed è considerato la
      seconda riserva ornitologica della Francia dopo la Camargue.
    landscape: >-
      Qui l'acqua comanda sul rilievo. Due fiumi alimentano il lago, l'Ognon da est e la Boulogne da sud-est,
      e poiché la pendenza è minima, il livello sale e scende trascinando con sé la riva. Al centro resta
      l'acqua libera, poco vegetata; intorno si susseguono ambienti che il lago combina senza passaggi
      bruschi.


      I prati galleggianti occupano 720 ettari e coprono buona parte della superficie di ninfee bianche e
      gialle. Oltre l'acqua aperta compaiono i *levis*, boschi galleggianti, oltre a paludi e prati inondabili
      che si coprono o meno a seconda della stagione. I canneti alberati, di salici e canne, sono il vivaio
      delle anatre: vi nidificano il moriglione e la moretta.


      Sotto, il suolo custodisce un'altra storia. Il giacimento di torba del lago è il quinto della Francia.
    wildlife: >-
      Con 270 specie di uccelli registrate, Grand-Lieu si comprende meglio per stagioni.


      D'inverno il lago è un dormitorio. Fino a 30.000 anatre riposano nelle acque libere del centro; a
      gennaio dominano il mestolone, con 5.067 esemplari, e l'alzavola, con 4.812. Oltre 19.000 gabbiani
      comuni preferiscono la calma del lago all'agitazione del litorale, e gli storni locali si uniscono a
      quelli arrivati dal nord e dall'est d'Europa. Al tramonto, con fortuna, centinaia di migliaia di loro
      disegnano in cielo quelle nuvole in movimento chiamate mormorazioni. Dal Padiglione si coglie cos'è
      l'inverno qui: l'acqua sale fino all'edificio e copre i prati umidi.


      In primavera ed estate comandano gli uccelli che nidificano. Tra 50 e 120 coppie di mignattino comune,
      dal 30 al 50 % della popolazione francese, e tra 30 e 50 coppie di
      [spatola](/especie/platalea_leucorodia/) nidificano sul lago. Da marzo a ottobre volano i pipistrelli
      finché ci sono insetti: sono state identificate venti specie. Il pipistrello di Nathusius è tra i più
      attivi e migra; ha percorso fino a 1.905 km. Il ferro di cavallo maggiore si osserva da anni nel
      Padiglione.


      L'autunno è tempo di passo e di addii. Gli ultimi passeriformi di canneto, come il
      [pettazzurro](/especie/luscinia_svecica/), partono verso il Mediterraneo e l'Africa tra settembre e
      ottobre; i giovani [nitticore](/especie/nycticorax_nycticorax/) intraprendono il viaggio verso l'Africa
      occidentale tra settembre e novembre. Una quarantina di spatole si alimentano regolarmente vicino al
      Padiglione e a ottobre, con il livello basso, si lasciano vedere avocette e beccaccini. Sempre a ottobre
      i giovani ragni lasciano il nido e si disperdono appesi a fili di seta. La farfalla vanessa io sverna in
      edifici come il Padiglione.


      Tra i mammiferi si contano una cinquantina di specie, tra cui la [lontra
      europea](/especie/lutra_lutra/); ci sono dodici specie di anfibi, con la rana temporaria, e trenta di
      pesci, con l'anguilla. In totale, 550 specie di piante.
    visit: >-
      Il punto di partenza è la Maison du Lac, centro visite con il suo Padiglione in riva all'acqua. La
      visita immersiva unisce un centro espositivo, una passeggiata sonora e il padiglione in tre tappe.
      D'estate si organizzano inoltre visite commentate dall'osservatorio ornitologico di Passay, e
      l'osservatorio ornitologico di Grand-Lieu offre accesso controllato alla riserva regionale.


      Se preferisci l'acqua, dallo scalo nautico di Pont-Saint-Martin si può percorrere in canoa il fiume
      Ognon. E per arrivare senza auto ci sono due opzioni: il treno Nantes-Pornic con fermata a Bouaye, a
      venti minuti a piedi, oppure una pedalata di 21 km dal centro di Nantes, di livello accessibile, che si
      fa in circa un'ora e un quarto.
    history: >-
      Oggi è riserva, ma fu sul punto di diventare terra coltivata. Nel 1809 il conte di Juigné, detentore dei
      diritti signorili, progettò di prosciugare il lago per guadagnare campi. Più tardi una società a
      maggioranza olandese pensò di prosciugarlo per coltivare tulipani; il piano fu abbandonato.


      La svolta arrivò con Guerlain. Donò parte del lago allo Stato nel dicembre 1977 e la riserva naturale fu
      istituita il 10 settembre 1980.


      Le sfide attuali sono l'acqua e le specie invasive. Nel 2024 il conservatore della riserva ha riferito
      che l'acqua peggiorava da cinque anni per l'apporto di nutrienti dai campi agricoli. Tre specie invasive
      danneggiano l'ecosistema: il gambero rosso della Louisiana, la nutria e una pianta acquatica. Questa
      pianta esotica invade inoltre i prati umidi e fa scomparire piante locali i cui semi nutrono le anatre,
      che calano di numero.
    before: >-
      Il lago cambia con le stagioni, quindi decidi cosa vuoi vedere: l'inverno per anatre, gabbiani e storni;
      da marzo a ottobre per i pipistrelli; l'autunno per gli uccelli di passo. Per affacciarti sulla riserva
      conta sull'accesso controllato offerto dall'osservatorio ornitologico di Grand-Lieu.
    around: >-
      Non ci sono altri spazi dell'atlante nelle vicinanze, ma un fratello lontano: il [Parco Naturale della
      Ria Formosa](/lugar/parque-natural-da-ria-formosa/) condivide con Grand-Lieu la spatola e la lontra
      europea.
  pt:
    intro: >-
      Grand-Lieu respira. Nos meses quentes o lago encolhe até cerca de 3.500 hectares; quando chega o inverno
      abre-se até 6.500 ou 7.000 e torna-se o maior lago natural de planície de França. O surpreendente é que
      quase não tem fundo: três metros de profundidade máxima. Como o terreno é quase plano, a água não fica
      numa bacia, derrama-se sobre caniços, prados e salgueirais, e os contornos mudam de uma estação para
      outra.


      É um lago de afundamento a vinte minutos de Nantes de carro, com uma reserva natural nacional de 2.695
      hectares protegida desde 1980. Está classificado como zona húmida Ramsar desde 1 de fevereiro de 1995, e
      é considerado a segunda reserva ornitológica de França após a Camarga.
    landscape: >-
      Aqui a água manda sobre o relevo. Dois rios alimentam o lago, o Ognon por leste e o Boulogne por
      sudeste, e como o declive é mínimo, o nível sobe e desce levando consigo a margem. No centro fica a água
      livre, pouco vegetada; em redor, uma sucessão de ambientes que o lago combina sem transição brusca.


      Os herbazais flutuantes ocupam 720 hectares e cobrem boa parte da superfície de nenúfares brancos e
      amarelos. Para lá da água aberta aparecem os levis, bosques flutuantes, além de pântanos e prados
      inundáveis que se cobrem ou não consoante a estação. Os caniços arborizados, de salgueiros e caniço, são
      o berçário dos patos: neles nidificam o zarro-comum e o zarro-negrinha.


      Por baixo, o solo guarda outra história. O depósito de turfa do lago é o quinto de França.
    wildlife: >-
      Com 270 espécies de aves registadas, Grand-Lieu entende-se melhor por temporadas.


      No inverno o lago é um dormitório. Até 30.000 patos descansam nas águas livres do centro; em janeiro
      dominam o pato-trombeteiro, com 5.067 exemplares, e a marrequinha-comum, com 4.812. Mais de 19.000
      guinchos-comuns preferem a calma do lago à agitação do litoral, e os estorninhos-malhados locais
      juntam-se aos chegados do norte e do leste da Europa. Ao entardecer, com sorte, centenas de milhares
      deles desenham no céu essas nuvens em movimento que chamam murmurações. Do Pavilhão aprecia-se o que é o
      inverno aqui: a água sobe até ao edifício e cobre os prados húmidos.


      Na primavera e no verão mandam as aves que nidificam. Entre 50 e 120 casais de gaivina-preta, de 30 a 50
      % da população francesa, e entre 30 e 50 casais de [colhereiro-europeu](/especie/platalea_leucorodia/)
      criam no lago. De março a outubro voam os morcegos, enquanto há insetos: identificaram-se vinte
      espécies. O morcego-de-nathusius é dos mais ativos e migra; percorreu até 1.905 km. O
      morcego-de-ferradura-grande observa-se há anos no Pavilhão.


      O outono é de passagem e de despedidas. Os últimos passeriformes de caniço, como o
      [pisco-de-peito-azul](/especie/luscinia_svecica/), partem para o Mediterrâneo e África entre setembro e
      outubro; os jovens [savacus](/especie/nycticorax_nycticorax/) iniciam viagem para a África Ocidental
      entre setembro e novembro. Uma quarentena de colhereiros alimenta-se com regularidade perto do Pavilhão,
      e em outubro, com o nível baixo, deixam-se ver alfaiates e narcejas-comuns. Também em outubro as aranhas
      jovens deixam o ninho e dispersam-se penduradas em fios de seda. A borboleta pavão-diurno hiberna em
      edifícios como o Pavilhão.


      Entre os mamíferos contam-se umas cinquenta espécies, entre elas a
      [lontra-europeia](/especie/lutra_lutra/); há doze espécies de anfíbios, com a rã-vermelha, e trinta de
      peixes, com a enguia. No total, 550 espécies de plantas.
    visit: >-
      O ponto de partida é a Maison du Lac, centro de visitantes com o seu Pavilhão junto à água. A visita
      imersiva combina um centro de exposições, um passeio sonoro e o pavilhão em três etapas. No verão
      organizam-se ainda visitas comentadas a partir do observatório ornitológico de Passay, e o observatório
      ornitológico de Grand-Lieu oferece acesso supervisionado à reserva regional.


      Se preferires a água, a partir do cais náutico de Pont-Saint-Martin pode percorrer-se de canoa o rio
      Ognon. E para chegar sem carro há duas opções: o comboio Nantes-Pornic com paragem em Bouaye, a vinte
      minutos a pé, ou um passeio de bicicleta de 21 km desde o centro de Nantes, de nível acessível, que se
      faz em cerca de uma hora e um quarto.
    history: >-
      Hoje é reserva, mas esteve prestes a ser terra de lavoura. Em 1809 o conde de Juigné, detentor dos
      direitos senhoriais, projetou drenar o lago para ganhar terrenos de cultivo. Mais tarde, uma sociedade
      de maioria neerlandesa pensou drená-lo para cultivar tulipas; o plano foi abandonado.


      A viragem chegou com Guerlain. Doou parte do lago ao Estado em dezembro de 1977 e a reserva natural foi
      declarada a 10 de setembro de 1980.


      Os desafios atuais são a água e as invasoras. Em 2024 o conservador da reserva informou que a água
      piorava havia cinco anos pelo aporte de nutrientes das terras agrícolas. Três espécies invasoras
      prejudicam o ecossistema: o lagostim-vermelho-do-louisiana, o ratão-do-banhado e uma planta aquática.
      Essa planta exótica invade também os prados húmidos e faz desaparecer plantas locais cujas sementes
      alimentam os patos, que diminuem em número.
    before: >-
      O lago muda com as estações, portanto decide o que queres ver: o inverno para patos, gaivotas e
      estorninhos; de março a outubro para os morcegos; o outono para as aves de passagem. Para espreitar a
      reserva conta com o acesso supervisionado que oferece o observatório ornitológico de Grand-Lieu.
    around: >-
      Não há outro espaço do atlas por perto, mas sim um irmão distante: o [Parque Natural da Ria
      Formosa](/lugar/parque-natural-da-ria-formosa/) partilha com Grand-Lieu o colhereiro-europeu e a
      lontra-europeia.
