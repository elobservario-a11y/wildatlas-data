unico:
  es: >-
    Las grandes curvas del Nemunas forman una estructura geológica e hidrográfica singular en Lituania y en
    Europa, y en Punios šilas crecen los pinos y abetos más altos del país.
  en: >-
    The great loops of the Nemunas form a unique geological and hydrographic structure in Lithuania and
    Europe, and in Punios šilas grow the tallest pines and spruces in the country.
  fr: >-
    Les grandes boucles du Niémen forment une structure géologique et hydrographique singulière en Lituanie et
    en Europe, et dans Punios šilas s'élèvent les pins et épicéas les plus hauts du pays.
  de: >-
    Die großen Schleifen der Memel bilden ein geologisch und hydrografisch einmaliges Phänomen in Litauen und
    Europa, und im Wald Punios šilas wachsen die höchsten Kiefern und Fichten des Landes.
  it: >-
    Le grandi anse del Nemunas formano una struttura idrografica e geologica singolare in Lituania e in
    Europa, e a Punios šilas crescono i pini e gli abeti più alti del paese.
  pt: >-
    As grandes curvas do Nemunas formam uma estrutura geológica e hidrográfica singular na Lituânia e na
    Europa, e em Punios šilas crescem os pinheiros e espruces mais altos do país.
