texto:
  es:
    intro: >-
      Un río que no quiere ir recto. Durante unos sesenta kilómetros, el curso medio del Nemunas se enrosca
      sobre sí mismo y dibuja tres grandes lazos, y entre ellos corre por laderas altas cubiertas de bosque.
      Eso protege el Parque Regional de los Lazos del Nemunas: un valle de meandros, un bosque con rasgos de
      las viejas selvas lituanas y un puñado de senderos para recorrerlo a pie o en bici.
    landscape: >-
      Los lazos son los de Punia, Balbieriškis, Prienai y Birštonas. El desnivel entre el cauce y lo alto del
      valle llega a entre cuarenta y sesenta metros, y entre las laderas hay afloramientos y barrancos: los
      arroyos, rápidos, han abierto cañones y vaguadas. Algunos afloramientos tienen nombre propio:
      Balbieriškis, Siponys y Škėvonys. Y Škėvonių gūbrys es una cresta de erosión única en Lituania, dentro
      del valle.


      Sobre ese relieve crece Punios šilas, un bosque de gran valor botánico que conserva los rasgos de las
      selvas primitivas de Lituania. Aquí están los pinos y abetos más altos del país, y robles en hilera
      natural, con nombres de grandes duques lituanos. Uno de esos pinos, de unos ciento sesenta años, alcanza
      cuarenta y dos metros. En la reserva natural del bosque, el bosque existe sin influencia directa de las
      personas.
    wildlife: >-
      El parque cuenta, según su portal oficial, novecientas setenta y tres especies de plantas, mil
      setecientas trece de animales, doscientas tres de aves y cincuenta y seis de mamíferos. En Punios šilas
      las rarezas son la cigüeña negra, el águila pomerana, el lirón gris y el pico mediano, y viven corzos,
      jabalíes y una manada bastante grande de ciervos. En el alerceda de Degsnė crecen alerces de unos
      cuarenta y seis metros, entre ellos el árbol más alto de Lituania.


      En las islas del Nemunas, junto a Prienai, hay una gran colonia de gaviotas y charranes, y desde las
      orillas se ve la migración de las aves. Hay un punto habilitado para observarlas junto a esas islas.
    visit: >-
      El parque tiene un centro de visitantes regional y rutas para todos los ritmos. El sendero
      interpretativo de Škėvonys mide 1,6 km y es solo para peatones; el itinerario de Žvėrinčius está
      habilitado para peatones y bicicletas, y Punios šilas tiene su propia ruta de interpretación natural. En
      el lazo de Prienai y Birštonas hay un camino asfaltado de diez kilómetros para bicicletas y peatones.
      Desde 2019 se puede subir además al mirador de Birštonas, en el extremo suroeste de la ciudad.


      Para mirar el valle desde arriba, una de las mejores vistas está en el mirador de la orilla del Nemunas
      junto a Balbieriškis, y desde las laderas del valle y los castros de Punia y Birštonas. En el parque hay
      veinte castros, y los más conocidos son el monte de Vytautas, en Birštonas, y el de Margiris, en Punia.
      En la silvicultura de Punia hay un museo del bosque de Punios šilas.
    history: >-
      El parque se creó en 1992, con 25.080 hectáreas, para preservar los grandes meandros del Nemunas y el
      paisaje y ecosistema forestal de Punios šilas.
    before: Comprueba con el gestor los sectores y servicios abiertos antes de planificar la salida.
  en:
    intro: >-
      A river that refuses to run straight. For some sixty kilometres, the middle reaches of the Nemunas loop
      back upon themselves, carving three massive loops as they flow between high, densely wooded bluffs. That
      is what the Nemunas Loops Regional Park protects: a meandering valley, a forest preserving features of
      ancient Lithuanian primeval woodlands, and a network of trails to explore on foot or by bicycle.
    landscape: >-
      The grand loops encompass those of Punia, Balbieriškis, Prienai and Birštonas. The elevation difference
      between the riverbed and the plateau rim spans between forty and sixty metres, flanked by dramatic
      bluffs and ravines where rushing streams have gouged steep gullies and canyons. Prominent outcrops bear
      their own names: Balbieriškis, Siponys and Škėvonys. Among them, the Škėvonys ridge stands out as a
      unique erosional landform in Lithuania, nested within the valley.


      Atop this undulating relief thrives Punios šilas, a forest of immense botanical value preserving the
      primeval character of historic Lithuanian wilderness. Here stand the country's tallest Scots pines and
      spruces, alongside stately oak avenues commemorating grand dukes of Lithuania. One remarkable pine,
      around one hundred and sixty years old, soars to forty-two metres. Within the forest nature reserve,
      woodland processes unfold entirely free from direct human interference.
    wildlife: >-
      According to official park inventories, the area shelters nine hundred and seventy-three plant species,
      one thousand seven hundred and thirteen animal species, two hundred and three bird species, and
      fifty-six mammal species. In Punios šilas, rare highlights include black stork, lesser spotted eagle,
      edible dormouse and middle spotted woodpecker, alongside roe deer, wild boar and a substantial herd of
      red deer. In the Degsnė larch grove grow European larches reaching some forty-six metres, including
      Lithuania's tallest recorded tree.


      On the sandy islets of the Nemunas near Prienai, a sprawling colony of gulls and terns thrives, and the
      riverbanks offer prime vantage points to witness seasonal bird migration. A designated observation post
      is situated directly facing these islets.
    visit: >-
      The park features a regional visitor centre and paths for all paces. The Škėvonys interpretive nature
      trail measures 1.6 km and is strictly pedestrian; the Žvėrinčius trail accommodates both walkers and
      cyclists, and Punios šilas offers its own nature learning path. Across the Prienai and Birštonas loop
      runs a ten-kilometre paved track dedicated to bicycles and pedestrians. Since 2019, visitors can also
      ascend the Birštonas observation tower at the southwestern edge of town.


      To view the valley from above, one of the finest panoramas opens from the Nemunas bluff viewpoint near
      Balbieriškis, as well as from the valley slopes and historic hillforts of Punia and Birštonas. The park
      preserves twenty ancient hillforts, most famously Vytautas Hill in Birštonas and Margiris Hill in Punia.
      In the Punia forestry headquarters, a dedicated forest museum explores Punios šilas.
    history: >-
      The park was established in 1992, spanning 25,080 hectares, to preserve the great incised meanders of
      the Nemunas together with the forest landscapes and unique ecosystem of Punios šilas.
    before: Check with park administration regarding open sectors and operating services before planning your visit.
  fr:
    intro: >-
      Un fleuve qui refuse d'aller en ligne droite. Sur une soixantaine de kilomètres, le cours moyen du
      Niémen s'enroule sur lui-même en dessinant trois grands méandres, coulant entre de hautes berges
      couvertes de forêts. C'est ce que protège le parc régional des méandres du Niémen : une vallée de
      méandres incisés, une forêt aux allures de jungle primitive lituanienne et un réseau de sentiers à
      parcourir à pied ou à vélo.
    landscape: >-
      Ces boucles sont celles de Punia, Balbieriškis, Prienai et Birštonas. Le dénivelé entre le lit du fleuve
      et le rebord du plateau atteint quarante à soixante mètres, entrecoupé d'escarpements et de ravines où
      des ruisseaux vifs ont creusé de véritables gorges. Certains affleurements portent un nom réputé :
      Balbieriškis, Siponys et Škėvonys. La crête de Škėvonys constitue une formation d'érosion unique en
      Lituanie, nichée au creux de la vallée.


      Sur ce relief s'épanouit Punios šilas, une forêt d'une immense valeur botanique qui perpétue les traits
      des vieilles futaies primitives de Lituanie. On y trouve les pins sylvestres et les épicéas les plus
      hauts du pays, ainsi qu'une allée de chênes portant les noms de grands-ducs lituaniens. L'un de ces
      pins, âgé d'environ cent soixante ans, atteint quarante-deux mètres. Dans la réserve intégrale, la forêt
      évolue sans intervention humaine directe.
    wildlife: >-
      Le parc recense, selon ses données officielles, neuf cent soixante-treize espèces de plantes, mille sept
      cent treize d'animaux, deux cent trois d'oiseaux et cinquante-six de mammifères. Dans Punios šilas, les
      raretés rassemblent la cigogne noire, l'aigle pomarin, le loir gris et le pic mar, aux côtés de
      chevreuils, de sangliers et d'une harde importante de cerfs. Dans la mélèzière de Degsnė grandissent des
      mélèzes d'environ quarante-six mètres, parmi lesquels se dresse l'arbre le plus haut de Lituanie.


      Sur les îles du Niémen, près de Prienai, niche une grande colonie de mouettes et de sternes, et les
      rives offrent d'excellents postes pour observer les flux migratoires. Un observatoire aménagé permet de
      les contempler face à ces îlots.
    visit: >-
      Le parc dispose d'un centre d'accueil régional et d'itinéraires pour tous les rythmes. Le sentier
      d'interprétation de Škėvonys mesure 1,6 km et est exclusivement piétonnier ; l'itinéraire de Žvėrinčius
      est aménagé pour les marcheurs et les cyclistes, et Punios šilas propose son propre circuit de
      découverte en forêt. Sur la boucle de Prienai et Birštonas s'étire une piste goudronnée de dix
      kilomètres pour vélos et promeneurs. Depuis 2019, on peut en outre gravir la tour panoramique de
      Birštonas, à l'extrémité sud-ouest de la ville.


      Pour contempler la vallée d'en haut, l'un des plus beaux panoramas s'ouvre depuis le belvédère de
      Balbieriškis en aplomb du Niémen, ainsi que depuis les versants et les anciens oppidums de Punia et
      Birštonas. Le parc compte vingt collines fortifiées, les plus célèbres étant la colline de Vytautas à
      Birštonas et celle de Margiris à Punia. À la maison forestière de Punia, un musée présente l'histoire et
      les écosystèmes de Punios šilas.
    history: >-
      Le parc a été créé en 1992, sur 25 080 hectares, pour préserver les spectaculaires méandres du Niémen
      ainsi que le patrimoine paysager et forestier de Punios šilas.
    before: >-
      Renseignez-vous auprès des gestionnaires sur les secteurs et services accessibles avant d'organiser
      votre sortie.
  de:
    intro: >-
      Ein Fluss, der nicht geradeaus fließen will. Über rund sechzig Kilometer windet sich der Mittellauf der
      Memel (Nemunas) in drei großen Schleifen durch das Land, flankiert von hohen, dicht bewaldeten Hängen.
      Dies schützt der Regionalpark Memelschlingen: ein eng gewundenes Durchbruchstal, einen Wald mit den
      Zügen urzeitlicher litauischer Wildnis und ein Netz aus Wegen für Wanderer und Radfahrer.
    landscape: >-
      Die Schleifen tragen die Namen Punia, Balbieriškis, Prienai und Birštonas. Der Höhenunterschied zwischen
      Flussbett und Hochufer beträgt vierzig bis sechzig Meter, unterbrochen von Steilufern und tiefen
      Schluchten, die muntere Bäche eingegraben haben. Markante Aufschlüsse tragen Namen wie Balbieriškis,
      Siponys und Škėvonys. Der Erosionsrücken von Škėvonys gilt als geologische Besonderheit Litauens im
      Flusstal.


      Auf diesem Relief stockt Punios šilas, ein forstbotanisch herausragender Wald, der den Charakter der
      ursprünglichen Urwälder Litauens bewahrt. Hier wachsen die höchsten Kiefern und Fichten des Landes sowie
      alte Eichen, die nach litauischen Großfürsten benannt sind. Eine rund einhundertsechzigjährige Kiefer
      erreicht zweiundvierzig Meter Höhe. Im Waldreservat bleibt die Natur völlig sich selbst überlassen.
    wildlife: >-
      Der Park zählt nach offiziellen Angaben neunhundertdreiundsiebzig Pflanzenarten,
      eintausendsiebenhundertdreizehn Tierarten, zweihundertdrei Vogelarten und sechsundfünfzig
      Säugetierarten. In Punios šilas brüten Schwarzstorch, Schreiadler und Mittelspecht; Siebenschläfer,
      Rehe, Wildschweine und ein stattlicher Hirschbestand sind heimisch. Im Lärchenwald von Degsnė ragen
      Europäische Lärchen bis auf rund sechsundvierzig Meter auf, darunter der höchste Baum Litauens.


      Auf den Flussinseln der Memel bei Prienai nistet eine große Möwen- und Seeschwalbenkolonie, und von den
      Ufern aus lässt sich der Vogelzug beobachten. Gegenüber den Inseln steht ein Beobachtungsstand bereit.
    visit: >-
      Der Park bietet ein Besucherzentrum und Routen für jeden Anspruch. Der Naturlehrpfad Škėvonys ist 1,6 km
      lang und Fußgängern vorbehalten; der Žvėrinčius-Weg ist für Wanderer und Radler ausgebaut, und Punios
      šilas besitzt einen eigenen forstlichen Lehrpfad. Im Bogen von Prienai und Birštonas verläuft ein zehn
      Kilometer langer asphaltierter Geh- und Radweg. Seit 2019 kann man zudem den Aussichtsturm von Birštonas
      am südwestlichen Stadtrand besteigen.


      Für den Blick von oben eignet sich der Steilufer-Aussichtspunkt bei Balbieriškis sowie die Hänge und
      Burgberge von Punia und Birštonas. Im Park gibt es zwanzig historische Burgberge, am bekanntesten der
      Vytautas-Berg in Birštonas und der Margiris-Berg in Punia. In der Oberförsterei Punia informiert ein
      Waldmuseum über Punios šilas.
    history: >-
      Der Regionalpark wurde 1992 mit einer Fläche von 25.080 Hektar gegründet, um die großen Memelschlingen
      sowie Landschaft und Waldökosystem von Punios šilas zu bewahren.
    before: Informiere dich vorab bei der Parkverwaltung über geöffnete Bereiche und Einrichtungen.
  it:
    intro: >-
      Un fiume che rifiuta di scorrere diritto. Per una sessantina di chilometri il corso medio del Nemunas si
      avvolge su se stesso disegnando tre ampi anelli, scorrendo tra versanti scoscesi coperti di boschi. È
      quanto tutela il Parco Regionale dei Meandri del Nemunas: una vallata meandriforme incisa, una foresta
      che conserva i tratti delle antiche selve lituane e un ventaglio di sentieri da percorrere a piedi o in
      bicicletta.
    landscape: >-
      Le anse principali sono quelle di Punia, Balbieriškis, Prienai e Birštonas. Il dislivello tra il pelo
      dell'acqua e il ciglio dell'altopiano oscilla tra quaranta e sessanta metri, solcato da dirupi e
      fortrezze naturali dove ruscelli impetuosi hanno scavato valloncelli scoscesi. Alcune pareti recano nomi
      celebri: Balbieriškis, Siponys e Škėvonys. La dorsale d'erosione di Škėvonys costituisce una morfologia
      unica in Lituania, adagiata nel fondovalle.


      Su queste ondulazioni sorge Punios šilas, una foresta di immenso pregio botanico che preserva i
      caratteri delle foreste vergini lituane. Vi allignano i pini silvestri e gli abeti rossi più imponenti
      della Lituania, oltre a filari di querce secolari intitolate ai granduchi lituani. Uno di questi pini,
      di circa centosessanta anni, raggiunge i quarantadue metri. Nella riserva integrale il bosco evolve
      senza alcuna interferenza antropica.
    wildlife: >-
      Il parco registra, secondo i dati ufficiali, novecentosettantatré specie vegetali,
      millesettecentotredici animali, duecentotre di uccelli e cinquantasei di mammiferi. A Punios šilas le
      specie più rare comprendono la cicogna nera, l'aquila anatraia minore, il ghiro e il picchio rosso
      mezzano, accanto a caprioli, cinghiali e un cospicuo branco di cervi. Nel lariceto di Degsnė vegetano
      larici di circa quarantasei metri, tra cui l'albero più alto dell'intera Lituania.


      Sulle isole fluviali del Nemunas presso Prienai nidifica una numerosa colonia di gabbiani e sterne, e
      dalle rive si osservano le rotte migratorie. Una postazione attrezzata consente il birdwatching proprio
      di fronte a questi isolotti.
    visit: >-
      Il parco dispone di un centro visitatori regionale e di itinerari adatti a ogni passo. Il sentiero
      interpretativo di Škėvonys copre 1,6 km ed è riservato ai soli pedoni; il tracciato di Žvėrinčius è
      praticabile sia a piedi sia in bicicletta, e Punios šilas vanta un proprio sentiero didattico
      naturalistico. Nell'ansa di Prienai e Birštonas si sviluppa una pista asfaltata di dieci chilometri per
      ciclisti e pedoni. Dal 2019 è possibile salire sulla torre panoramica di Birštonas, al margine
      sud-occidentale della cittadina.


      Per ammirare la valle dall'alto, una delle vedute migliori si gode dal belvedere di Balbieriškis lungo
      la sponda del Nemunas, nonché dai pendii e dai castellieri fortificati di Punia e Birštonas. Nel parco
      si contano venti castellieri storici, tra cui la collina di Vytautas a Birštonas e quella di Margiris a
      Punia. Nella sede forestale di Punia è allestito un museo dedicato a Punios šilas.
    history: >-
      Il parco è nato nel 1992, esteso su 25.080 ettari, con lo scopo di proteggere i grandi meandri del
      Nemunas nonché il paesaggio e gli ecosistemi forestali di Punios šilas.
    before: Verifica con l'ente gestore i percorsi e le strutture aperte prima di pianificare la visita.
  pt:
    intro: >-
      Um rio que recusa seguir em linha reta. Ao longo de cerca de sessenta quilómetros, o curso médio do
      Nemunas enrola-se sobre si próprio desenhando três grandes laços, correndo entre encostas alcantiladas
      cobertas de arvoredo. É isso que tutela o Parque Regional dos Meandros do Nemunas: um vale de meandros
      cavados, uma floresta com traços das antigas selvas lituanas e um conjunto de trilhos para explorar a pé
      ou de bicicleta.
    landscape: >-
      Os grandes laços são os de Punia, Balbieriškis, Prienai e Birštonas. O desnível entre o leito do rio e o
      cimo do planalto atinge entre quarenta e sessenta metros, intervalado por escarpas e ravinas onde
      ribeiros velozes abriram desfiladeiros e vales profundos. Alguns afloramentos possuem denominação
      consagrada: Balbieriškis, Siponys e Škėvonys. A crista de Škėvonys representa uma formação de erosão
      única na Lituânia, aninhada no fundo do vale.


      Sobre este relevo estende-se Punios šilas, uma mata de enorme valor botânico que preserva as
      características das florestas primitivas da Lituânia. Aqui encontram-se os pinheiros-silvestres e
      espruces mais altos do país, além de alamedas de carvalhos seculares com nomes de grão-duques lituanos.
      Um desses pinheiros, com cerca de cento e sessenta anos, atinge quarenta e dois metros de altura. Na
      reserva natural integral, a floresta evolui sem interferência humana direta.
    wildlife: >-
      O parque regista, segundo os seus dados oficiais, novecentas e setenta e três espécies de plantas, mil
      setecentas e treze de animais, duzentas e três de aves e cinquenta e seis de mamíferos. Em Punios šilas
      as espécies mais notáveis incluem a cegonha-preta, a águia-pomerana, o arganaz-cinzento e o
      pica-pau-médio, convivendo com corças, javalis e uma manada substancial de veados. No lariçal de Degsnė
      elevam-se lariços com cerca de quarenta e seis metros, entre eles a árvore mais alta de toda a Lituânia.


      Nas ilhas fluviais do Nemunas, junto a Prienai, nidifica uma grande colónia de gaivotas e
      andorinhas-do-mar, e a partir das margens avista-se a passagem das aves migradoras. Existe um posto de
      observação posicionado frente a esses ilhéus.
    visit: >-
      O parque dispõe de centro de acolhimento regional e trilhos para todas as passadas. O percurso
      interpretativo de Škėvonys tem 1,6 km e destina-se apenas a peões; o circuito de Žvėrinčius está apto
      para caminhantes e ciclistas, e Punios šilas tem o seu próprio trilho pedagógico florestal. No laço de
      Prienai e Birštonas desenvolve-se uma via asfaltada de dez quilómetros para bicicletas e peões. Desde
      2019 é possível subir à torre de observação de Birštonas, no extremo sudoeste da localidade.


      Para contemplar o vale do alto, um dos melhores miradouros situa-se na escarpa do Nemunas junto a
      Balbieriškis, bem como nas encostas e castros de Punia e Birštonas. No parque contam-se vinte castros
      antigos, destacando-se o monte de Vytautas em Birštonas e o de Margiris em Punia. Na sede florestal de
      Punia funciona um museu dedicado à história de Punios šilas.
    history: >-
      O parque foi fundado em 1992, abrangendo 25.080 hectares, com o propósito de salvaguardar os grandes
      meandros do Nemunas e o mosaico florestal de Punios šilas.
    before: >-
      Verifica junto da administração do parque quais os setores e serviços abertos antes de programares a
      visita.
