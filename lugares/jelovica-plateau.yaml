resumen:
  es: Meseta kárstica boscosa de difícil acceso que sirve de refugio a los carnívoros y a la avifauna forestal.
  en: >-
    Heavily wooded karst plateau offering rugged isolation and sanctuary for elusive carnivores and forest
    birds.
  fr: >-
    Plateau karstique boisé et sauvage servant de refuge discret aux grands carnivores et aux oiseaux
    forestiers.
  de: >-
    Dicht bewaldetes Karstplateau von uriger Abgeschiedenheit, Rückzugsgebiet scheuer Raubtiere und seltener
    Waldvögel.
  it: >-
    Altopiano carsico boscato di difficile accesso, rifugio indisturbato per grandi carnivori e avifauna
    forestale.
  pt: >-
    Planalto cársico densamente florestado de acesso árduo, refúgio de predadores esquivos e avifauna
    silvícola.
unico:
  es: >-
    Una meseta kárstica toda cubierta de bosque, al sur de Bled, donde la historia del hierro y el carbón
    sigue escrita en sus pastos y sus aldeas.
  en: >-
    A densely forested karst plateau south of Bled where centuries of iron forging and charcoal burning remain
    inscribed in high pastures and hamlets.
  fr: >-
    Un plateau karstique entièrement boisé au sud de Bled, où l'épopée du fer et du charbon de bois demeure
    gravée dans ses clairières et alpages.
  de: >-
    Eine gänzlich bewaldete Karst-Hochebene südlich von Bled, auf deren Almen und in deren Dörfern die
    Geschichte der Eisenverhüttung und Köhlerei lebendig bleibt.
  it: >-
    Un altopiano carsico interamente coperto di boschi a sud di Bled, dove la storia del ferro e del carbone
    vegetale è ancora scolpita nei pascoli e nei borghi.
  pt: >-
    Um planalto cársico integralmente arborizado a sul de Bled, onde a memória do ferro e do carvão vegetal
    perdura nas pastagens e aldeias serranas.
observaciones:
  es: >-
    Muchos de los caminos que llevan a los pastos están sin señalizar; usa los senderos marcados desde Kropa,
    Jamnik, Lipnica y Ribno. Es una meseta de bosque y pistas: lleva el equipo propio de la montaña. El verano
    es la época de los pastos y de la bicicleta.
texto:
  es:
    intro: >-
      Jelovica es un bosque que se talló para fundir hierro y volvió a ser bosque. Durante siglos sus árboles
      se quemaron para hacer carbón vegetal, el que alimentaba las fundiciones de Kropa y Železniki, y el
      antiguo bosque de abetos y hayas desapareció. Hoy la meseta está cubierta de arriba abajo por masa
      forestal, con las píceas como protagonistas, y ha vuelto a ser refugio: de aves que en otros lugares
      están amenazadas, y también, en otro tiempo, de los partisanos eslovenos.
    landscape: >-
      Jelovica se eleva al sur de Bled entre novecientos y mil seiscientos metros, y es la parte más oriental
      de los Alpes Julianos. Una meseta alta y kárstica, separada del resto de los Julianos por el río Sava
      Bohinjka. Su punto más alto es Partizanski vrh, con 1.441 metros, y el norte llega a unos 1100.


      La parte llana, entre mil y mil trescientos metros, está salpicada de dolinas. Entre los árboles hay
      otros ambientes pequeños que enriquecen el conjunto: pastos de montaña, turberas, claros abiertos al
      cultivo y hoyas donde se acumula el aire frío. La turbera alta más conocida se llama Ledine.


      Y el contraste está en los bordes. Babji zob se alza como un diente de roca en el borde, y los puntos
      del borde nororiental ofrecen vistas excepcionales. Bajo Babji zob hay una cueva donde se observan
      rasgos kársticos típicos.
    wildlife: >-
      Gracias a la escasa influencia humana, muchas especies prosperan en Jelovica. Entre las aves destaca el
      [urogallo](/especie/tetrao_urogallus/), típico de la zona, y el [mochuelo
      chico](/especie/glaucidium_passerinum/). También se ven [águilas reales](/especie/aquila_chrysaetos/) y
      gavilanes, comunes en esta parte de Gorenjska. Los bosques actuales de la meseta dan cobijo a muchas
      aves que estarían amenazadas fuera de ella.


      En verano, los pastos soleados vuelven a cumplir su función de siempre: sirven de pasto para el ganado,
      y por eso la época de los senderos y de las pistas de montaña es el verano.
    visit: >-
      Hay senderos señalizados hacia la meseta desde Kropa, Jamnik, Lipnica y Ribno, y también marcados
      caminos que parten desde otros lugares hacia los pastos. Desde Radovljica se sube por la pista forestal
      que sale de Spodnja Lipnica.


      Tres pastos con sus cabañas son los destinos favoritos: Talež, Goška ravan y Vodiška planina. A Vodiška
      planina sube un camino de grava, ideal para la bicicleta de montaña, rodeado de bosque. Si prefieres las
      vistas, camina hasta Babji zob o hasta Talež. Los senderos forestales de Jelovica se pueden recorrer en
      bicicleta de montaña, y existe una ruta temática, Por los caminos de la Jelovica partisana.


      Otros pastos de la meseta son Mošenjska planina, Lipniška planina, Kališnik y Ribenska planina.
    history: >-
      Aquí se extrajo mineral de hierro, que se procesaba en Kropa y en Železniki. La madera se usó como
      carbón para las fundiciones y, en la época de las ferrerías, se talló el bosque original de alisos y
      hayas. El valle de Lipnica conserva el patrimonio de la forja de Kropa y Kamna Gorica. Durante la
      Segunda Guerra Mundial, la meseta fue refugio de los partisanos eslovenos.


      Hoy Jelovica forma parte de Natura 2000 y toda su superficie tiene protección ecológica.
    before: >-
      Muchos de los caminos que llevan a los pastos están sin señalizar; usa los senderos marcados desde
      Kropa, Jamnik, Lipnica y Ribno. Es una meseta de bosque y pistas: lleva el equipo propio de la montaña.
      El verano es la época de los pastos y de la bicicleta.
    around: >-
      El [Parque Nacional de Triglav](/lugar/triglav-southern-karst-plateau/) queda a tres kilómetros, y a
      nueve la [Cordillera de Karavanke / Karawanken](/lugar/karavanke---karawanken/). A trece kilómetros está
      el [Bosque de Tarvisio y Alpes Julianos Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/),
      a veinticuatro la [Meseta Kárstica de Nanos](/lugar/kraska-planota-nanos/) y a veintiocho la [Meseta
      Forestal de Trnovo](/lugar/trnovski-gozd/). Con la [Meseta de Pokljuka](/lugar/pokljuka-plateau/) se
      solapa de forma aproximada.
  en:
    intro: >-
      Jelovica is a deep forest that was once cleared to feed iron smelting furnaces and gradually reclaimed
      its wild character. For centuries its timbers were felled for charcoal burning to supply the iron forges
      of Kropa and Železniki, until the ancient fir and beech stands had virtually vanished. Today, continuous
      forest cover blankets the plateau from edge to edge with spruce as the dominant tree, once again
      offering refuge to rare forest birds and echoing its wartime role as a mountain bastion for Slovenian
      Partisans.
    landscape: >-
      Jelovica rises south of Lake Bled between nine hundred and sixteen hundred metres elevation, forming the
      easternmost outpost of the Julian Alps. It is an elevated karst tableland separated from the main Julian
      ranges by the entrenched Sava Bohinjka river. Its crowning summit is Partizanski vrh at 1,441 metres,
      while its northern rim levels off around 1100 metres.


      The undulating plateau surface, situated mostly between one thousand and thirteen hundred metres, is
      pocked with limestone sinkholes. Among the dense trees hide distinct micro-habitats that enrich the
      landscape: alpine pastures, relict peat bogs, clearings cleared for subsistence farming, and frost
      hollows where frigid air settles. The best-known raised bog on the plateau is Ledine.


      Contrasting topography marks the outer perimeter. Babji zob rears up like an isolated rocky fang along
      the western rim, while northeast clifftops provide sweeping panoramas. Beneath Babji zob opens a
      decorated cave displaying quintessential karst dissolution features.
    wildlife: >-
      Owing to minimal modern human disturbance, sensitive wildlife thrives throughout Jelovica. Flagship bird
      species include the [western capercaillie](/especie/tetrao_urogallus/), an emblem of undisturbed
      boreal-alpine woodland, and the tiny [Eurasian pygmy owlet](/especie/glaucidium_passerinum/). Soaring
      [golden eagles](/especie/aquila_chrysaetos/) and Eurasian sparrowhawks patrol the crags, typical of this
      upland sector of Gorenjska. The dense forest canopy provides a haven for avian species that face severe
      habitat loss in surrounding valleys.


      During summer months, sunlit alpine clearings resume their historic pastoral rhythm: local herds graze
      the pastures, making summer the prime season for walking and exploring mountain tracks.
    visit: >-
      Waymarked trails ascend to the plateau from the surrounding settlements of Kropa, Jamnik, Lipnica, and
      Ribno, connecting with paths leading to the high pastures. From Radovljica, a gravel forest road climbs
      steadily from Spodnja Lipnica.


      Three historic pastures with mountain chalets represent the most popular hiking goals: Talež, Goška
      ravan, and Vodiška planina. A smooth gravel track ascends to Vodiška planina through deep woods, ideal
      for mountain biking. For dramatic cliff views, walk to the Babji zob rock outcrop or to the Talež hut.
      Jelovica's forest tracks lend themselves exceptionally well to gravel cycling, and a dedicated
      historical trail, Along the Paths of Partisan Jelovica, links war heritage sites.


      Other picturesque high pastures include Mošenjska planina, Lipniška planina, Kališnik, and Ribenska
      planina.
    history: >-
      Iron ore was mined across the plateau for centuries and processed in the water-powered ironworks of
      Kropa and Železniki. Timber was carbonized in earthen charcoal kilns, entirely stripping the native
      alder and beech forest during the zenith of iron craftsmanship. The Lipnica valley preserves the rich
      blacksmithing heritage of Kropa and Kamna Gorica. During the Second World War, the impenetrable plateau
      served as a crucial hideout for Slovenian Partisans.


      Today, Jelovica is protected within the Natura 2000 network, with its entire upland surface under
      ecological conservation status.
    before: >-
      Many secondary tracks leading into the high pastures are unsigned; rely on official marked trails
      departing from Kropa, Jamnik, Lipnica, and Ribno. This is an extensive forest plateau: bring appropriate
      mountain footwear and provisions. Summer offers optimal conditions for pasture huts and cycling.
    around: >-
      [Triglav National Park](/lugar/triglav-southern-karst-plateau/) lies three kilometres away, while the
      [Karavanke / Karawanken Range](/lugar/karavanke---karawanken/) rises nine kilometres to the north.
      Thirteen kilometres away sits the [Tarvisio Forest and Italian Julian
      Alps](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/), twenty-four kilometres south lies the [Nanos
      Karst Plateau](/lugar/kraska-planota-nanos/), and twenty-eight kilometres distant extends the [Trnovo
      Forest Plateau](/lugar/trnovski-gozd/). The [Pokljuka Plateau](/lugar/pokljuka-plateau/) lies
      immediately across the valley.
  fr:
    intro: >-
      Jelovica est une forêt qui fut abattue pour fondre le fer avant de redevenir un sanctuaire végétal.
      Durant des siècles, ses arbres furent carbonisés pour alimenter les forges de Kropa et de Železniki,
      anéantissant l'ancienne forêt de sapins et de hêtres. Aujourd'hui, le plateau est entièrement reconquis
      par le manteau forestier dominé par l'épicéa, redevenu un havre pour des oiseaux menacés ailleurs, tout
      comme il abrita autrefois les partisans slovènes.
    landscape: >-
      Jelovica s'élève au sud de Bled entre neuf cents et seize cents mètres d'altitude, formant l'avancée
      orientale des Alpes juliennes. C'est un haut plateau karstique isolé du reste du massif par la vallée de
      la Sava Bohinjka. Son sommet culminant est le Partizanski vrh à 1 441 mètres, son rebord nord avoisinant
      1100 mètres.


      La surface sommitale, comprise entre mille et mille trois cents mètres, est criblée de dolines. Parmi
      les arbres se nichent des milieux singuliers qui diversifient le paysage : pâturages d'altitude,
      tourbières reliques, clairières pastorales et combes à froid. La tourbière haute la plus célèbre se
      nomme Ledine.


      Le contraste se manifeste sur les versants extérieurs. Le Babji zob se dresse telle une canine rocheuse
      au bord du plateau, tandis que les belvédères du rebord nord-est offrent des panoramas splendides. Sous
      le Babji zob s'ouvre une cavité révélant des concrétions karstiques typiques.
    wildlife: >-
      Grâce à une empreinte humaine très réduite, une riche faune s'épanouit sur Jelovica. Parmi les oiseaux
      s'illustre le [grand tétras](/especie/tetrao_urogallus/), emblématique des grands massifs sauvages,
      ainsi que la [chevêchette d'Europe](/especie/glaucidium_passerinum/). On y observe aussi l'[aigle
      royal](/especie/aquila_chrysaetos/) et l'épervier, réguliers dans cette région de Haute-Carniole. Les
      forêts préservées procurent un abri indispensable à des espèces sensibles qui ne trouvent plus d'espace
      dans les vallées.


      En été, les alpages ensoleillés retrouvent leur vocation ancestrale en accueillant le bétail ; la belle
      saison constitue donc le moment idéal pour parcourir chemins et pistes forestières.
    visit: >-
      Des sentiers balisés mènent au plateau depuis Kropa, Jamnik, Lipnica et Ribno, rejoignant les pistes qui
      desservent les alpages. Depuis Radovljica, une piste forestière grimpe depuis Spodnja Lipnica.


      Trois alpages dotés de chalets de montagne constituent les destinations privilégiées : Talež, Goška
      ravan et Vodiška planina. Vers Vodiška planina monte une piste carrossable en gravier, idéale pour le
      VTT au cœur des bois. Pour les panoramas vertigineux, gagnez le rocher de Babji zob ou le refuge de
      Talež. Le réseau de chemins se prête remarquablement au vélo tout-terrain, et un itinéraire historique,
      Sur les traces des Partisans de Jelovica, jalonne le massif.


      D'autres alpages typiques parsèment les hauteurs : Mošenjska planina, Lipniška planina, Kališnik et
      Ribenska planina.
    history: >-
      On extrayait jadis le minerai de fer sur place pour alimenter les forges de Kropa et de Železniki. Le
      bois servait à faire du charbon, ce qui provoqua la disparition des aulnes et hêtres primitifs. La
      vallée de Lipnica conserve le remarquable patrimoine métallurgique de Kropa et Kamna Gorica. Durant la
      Seconde Guerre mondiale, le plateau servit de maquis aux résistants slovènes.


      Aujourd'hui, Jelovica est intégré au réseau Natura 2000 et l'intégralité de sa superficie bénéficie d'un
      statut de protection environnementale.
    before: >-
      De nombreuses pistes secondaires menant aux alpages ne sont pas balisées ; empruntez les sentiers
      officiels au départ de Kropa, Jamnik, Lipnica et Ribno. C'est un vaste plateau forestier : prévoyez un
      équipement de montagne adapté. L'été est la saison reine pour les alpages et le VTT.
    around: >-
      Le [parc national du Triglav](/lugar/triglav-southern-karst-plateau/) se trouve à trois kilomètres, et
      les [Karavanke / Karawanken](/lugar/karavanke---karawanken/) à neuf kilomètres. À treize kilomètres
      s'étend la [forêt de Tarvisio et les Alpes juliennes
      italiennes](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/), à vingt-quatre kilomètres le [plateau
      karstique de Nanos](/lugar/kraska-planota-nanos/) et à vingt-huit le [plateau forestier de
      Trnovo](/lugar/trnovski-gozd/). Le [plateau de Pokljuka](/lugar/pokljuka-plateau/) lui fait face au
      nord-ouest.
  de:
    intro: >-
      Jelovica ist ein Wald, der einst für die Eisenverhüttung gerodet wurde und sich die Wildnis zurückholte.
      Über Jahrhunderte wurden seine Bäume gekohlt, um die Hammerwerke von Kropa und Železniki zu befeuern,
      bis der ursprüngliche Mischwald aus Tannen und Buchen verschwand. Heute ist das Plateau wieder lückenlos
      von Nadelwäldern bedeckt, in denen die Fichte dominiert, und bietet seltenen Waldvögeln Schutz – so wie
      es im Zweiten Weltkrieg den slowenischen Partisanen als Zuflucht diente.
    landscape: >-
      Jelovica erhebt sich südlich von Bled zwischen neunhundert und sechzehnhundert Metern und bildet den
      östlichsten Ausläufer der Julischen Alpen. Es ist eine hohe Karsttafel, die durch das Tal der Sava
      Bohinjka von den übrigen Juliern getrennt wird. Höchster Punkt ist der Partizanski vrh mit 1.441 Metern,
      während die Nordseite bei etwa 1100 Metern ausläuft.


      Die wellige Hochfläche zwischen tausend und dreizehnhundert Metern ist mit zahllosen Dolinen übersät.
      Dazwischen liegen wertvolle Kleinlebensräume: Hochalmen, Reliktmoore, Rodungsinseln und Kaltluftsenken.
      Das bekannteste Hochmoor des Massivs heißt Ledine.


      Eindrucksvoll sind die Steilränder. Wie ein gewaltiger Felszahn ragt der Babji zob am westlichen Rand
      auf, und die Abbruchkanten im Nordosten bieten weite Aussichten. Unterhalb des Babji zob liegt eine
      Tropfsteinhöhle mit typischen Karstformen.
    wildlife: >-
      Dank geringer menschlicher Störung findet die Tierwelt auf Jelovica beste Bedingungen. Unter den Vögeln
      sticht das [Auerhuhn](/especie/tetrao_urogallus/) als Charakterart der Nadelurwälder hervor, begleitet
      vom winzigen [Sperlingskauz](/especie/glaucidium_passerinum/). Regelmäßig kreisen
      [Steinadler](/especie/aquila_chrysaetos/) und Sperber über den Kronen, wie sie für die Bergwälder der
      Oberkrain typisch sind. Die ausgedehnten Forste bieten zahlreichen gefährdeten Vogelarten einen sicheren
      Lebensraum.


      Im Sommer beleben sich die sonnigen Almen nach alter Tradition mit Weidevieh, weshalb die warme
      Jahreszeit die ideale Reisezeit für Wanderungen und Radtouren darstellt.
    visit: >-
      Markierte Wanderwege führen von Kropa, Jamnik, Lipnica und Ribno hinauf auf das Plateau und verzweigen
      sich zu den Almen. Von Radovljica aus führt eine Forststraße ab Spodnja Lipnica ins Gebirge.


      Drei Almen mit bewirtschafteten Schutzhütten sind beliebte Ausflugsziele: Talež, Goška ravan und Vodiška
      planina. Zur Vodiška planina zieht ein gut befahrbarer Schotterweg hinauf, ideal für Mountainbiker. Wer
      weite Ausblicke sucht, wandert zum Felszahn Babji zob oder zur Talež-Hütte. Die Waldwege eignen sich
      hervorragend für Schotterradtouren, und der Themenweg Auf den Wegen der Partisanen-Jelovica erinnert an
      die Zeit des Widerstands.


      Weitere traditionelle Almen sind Mošenjska planina, Lipniška planina, Kališnik und Ribenska planina.
    history: >-
      Auf Jelovica wurde über Jahrhunderte Eisenerz abgebaut und in den Schmelzöfen von Kropa und Železniki
      verarbeitet. Die Holzkohlegewinnung veränderte damals das ursprüngliche Waldgefüge grundlegend. Das
      Lipnica-Tal bewahrt das reiche Schmiede- und Nagelschmiede-Kulturerbe von Kropa und Kamna Gorica. Im
      Zweiten Weltkrieg bot das unwegsame Waldplateau den slowenischen Partisanen ein sicheres Versteck.


      Heute gehört Jelovica zum Schutzgebietsnetz Natura 2000 und steht vollständig unter ökologischem
      Landschaftsschutz.
    before: >-
      Viele Nebenwege zu den entlegenen Almen sind unmarkiert; nutze die ausgeschilderten Aufstiege ab Kropa,
      Jamnik, Lipnica und Ribno. Das Plateau ist ein ausgedehntes Waldgebiet: Bergausrüstung ist ratsam. Der
      Sommer ist die beste Zeit für Almbesuche und Radtouren.
    around: >-
      Der [Nationalpark Triglav](/lugar/triglav-southern-karst-plateau/) liegt drei Kilometer entfernt, die
      [Karawanken](/lugar/karavanke---karawanken/) neun Kilometer nördlich. Dreizehn Kilometer westlich liegt
      der [Wald von Tarvisio und die italienischen Julischen
      Alpen](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/), vierundzwanzig Kilometer südlich das
      [Nanos-Karstplateau](/lugar/kraska-planota-nanos/) und achtundzwanzig Kilometer die
      [Trnovo-Waldhochebene](/lugar/trnovski-gozd/). Die [Pokljuka-Hochebene](/lugar/pokljuka-plateau/) liegt
      jenseits des Tals.
  it:
    intro: >-
      Jelovica è una foresta che fu abbattuta per fondere il ferro e che ha saputo riconquistare la propria
      solitudine selvaggia. Per secoli il legname venne trasformato in carbone per alimentare i magli di Kropa
      e Železniki, cancellando l'originaria foresta mista di faggio e abete bianco. Oggi l'altopiano è
      nuovamente ammantato da boschi fitti dominati dall'abete rosso, tornando a essere un rifugio per uccelli
      minacciati altrove, proprio come lo fu in passato per i partigiani sloveni.
    landscape: >-
      Jelovica si innalza a sud di Bled tra i novecento e i milleseicento metri di altitudine, costituendo il
      lembo più orientale delle Alpi Giulie. È un alto zoccolo carsico separato dal resto delle Giulie dal
      corso della Sava Bohinjka. La sua vetta culminante è il Partizanski vrh a 1.441 metri, mentre il
      versante settentrionale degrada attorno a 1100 metri.


      La porzione sommitale, compresa tra mille e milletrecento metri, è costellata da doline e campi
      carreggiati. Tra gli abeti si celano ambienti minuti che arricchiscono l'altopiano: alpeggi panoramici,
      torbiere relitte, radure pascolive e conche fredde da inversione termica. La torbiera alta più nota è
      quella di Ledine.


      Sui cigli esterni il paesaggio muta. Il Babji zob svetta come un dente di roccia isolato lungo il bordo
      occidentale, e i belvederi del crinale nord-orientale offrono visuali magnifiche. Sotto il Babji zob si
      apre una grotta con conformazioni carsiche tipiche.
    wildlife: >-
      Grazie all'esigua impronta antropica, molte specie protette popolano Jelovica. Tra gli uccelli spiccano
      il [gallo cedrone](/especie/tetrao_urogallus/), simbolo delle selve indisturbate, e la minuscola
      [civetta nana](/especie/glaucidium_passerinum/). Solcano i cieli l'[aquila
      reale](/especie/aquila_chrysaetos/) e lo sparviero, abituali in questo distretto della Carniola
      Superiore. Le fitte foreste dell'altopiano offrono asilo a volatili che stentano a sopravvivere nelle
      vallate coltivate.


      In estate i pascoli assolati riacquistano la loro vocazione zootecnica accogliendo le mandrie; la bella
      stagione è quindi ideale per camminare e pedalare lungo le piste forestali.
    visit: >-
      Sentieri segnalati salgono all'altopiano da Kropa, Jamnik, Lipnica e Ribno, raccordandosi alle
      carrarecce d'alpeggio. Da Radovljica si sale tramite la strada forestale che si stacca da Spodnja
      Lipnica.


      Tre alpeggi con rifugi costituiscono le mete predilette: Talež, Goška ravan e Vodiška planina. Verso
      Vodiška planina sale una comoda pista sterrata adatta alla mountain bike in mezzo ai boschi. Chi
      predilige gli scorci panoramici può raggiungere lo spuntone di Babji zob o il rifugio Talež. I tracciati
      di Jelovica sono ideali per le escursioni su due ruote, e l'itinerario storico Sui sentieri della
      Jelovica partigiana tocca i luoghi della Resistenza.


      Altri alpeggi tradizionali dell'altopiano sono Mošenjska planina, Lipniška planina, Kališnik e Ribenska
      planina.
    history: >-
      Sul massiccio si estraeva minerale ferroso lavorato poi nelle officine di Kropa e Železniki. Il legname
      venne impiegato per la carbonaia e all'epoca delle fucine l'antico bosco originario venne spogliato. La
      valle di Lipnica preserva la secolare tradizione fabbrile di Kropa e Kamna Gorica. Nel corso del secondo
      conflitto mondiale l'altopiano fu roccaforte dei partigiani sloveni.


      Oggi Jelovica fa parte della rete ecologica Natura 2000 e l'intera sua superficie gode di protezione
      naturale.
    before: >-
      Numerose piste forestali dirette agli alpeggi non sono segnalate; segui i sentieri escursionistici
      ufficiali che partono da Kropa, Jamnik, Lipnica e Ribno. È un vasto altipiano boschivo: indossa
      calzature e abbigliamento da trekking. L'estate è il momento d'oro per gli alpeggi e la mountain bike.
    around: >-
      Il [Parco nazionale del Triglav](/lugar/triglav-southern-karst-plateau/) dista tre chilometri, e la
      catena delle [Karavanke / Karawanken](/lugar/karavanke---karawanken/) nove chilometri a nord. A tredici
      chilometri sorge la [Foresta di Tarvisio e Alpi Giulie
      Italiane](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/), a ventiquattro chilometri l'[Altopiano
      carsico di Nanos](/lugar/kraska-planota-nanos/) e a ventotto la [Foresta di
      Trnovo](/lugar/trnovski-gozd/). L'[Altopiano di Pokljuka](/lugar/pokljuka-plateau/) lo fronteggia a
      breve distanza.
  pt:
    intro: >-
      Jelovica é uma floresta que foi derrubada para fundir ferro e que reconquistou a sua imponência
      selvagem. Durante séculos, o seu arvoredo foi queimado para produzir carvão vegetal para os fornos de
      Kropa e Železniki, até o primitivo bosque de faias e abetos praticamente desaparecer. Hoje o planalto
      está de novo coberto de floresta densa dominada pelo espruce, readquirindo o estatuto de santuário para
      aves raras, tal como outrora acolheu os guerrilheiros partisans eslovenos.
    landscape: >-
      Jelovica eleva-se a sul de Bled entre os novecentos e os mil e seiscentos metros de altitude,
      constituindo a ponta oriental dos Alpes Julianos. É um altiplano cársico isolado do resto da cordilheira
      pelo vale do rio Sava Bohinjka. O seu ponto mais alto é o Partizanski vrh a 1.441 metros, enquanto o
      setor norte se situa nos 1100 metros.


      A superfície aplanada, entre os mil e os mil e trezentos metros, está pontilhada de dolinas. Entre o
      arvoredo escondem-se recantos que enriquecem o biótopo: pastagens alpinas, turfeiras relíquias,
      clareiras e covas gélidas de inversão térmica. A turfeira alta mais conhecida chama-se Ledine.


      Nas bordas exteriores o relevo torna-se escarpado. Babji zob destaca-se como um dente de rocha
      pontiagudo na escarpa, e as cristas a nordeste proporcionam panoramas grandiosos. Sob Babji zob abre-se
      uma caverna com estalactites e formações cársicas típicas.
    wildlife: >-
      Graças à reduzida presença humana, muitas espécies prosperam em Jelovica. Entre as aves destaca-se o
      [tetraz-grande](/especie/tetrao_urogallus/), emblema dos bosques maduros, e o
      [mocho-pigmeu](/especie/glaucidium_passerinum/). Patrulham igualmente a serra a
      [águia-real](/especie/aquila_chrysaetos/) e o gavião, comuns neste setor da Alta Carniola. O manto
      vegetal denso oferece abrigo a aves florestais ameaçadas nas terras baixas.


      No verão, as pastagens ensolaradas acolhem novamente o gado de montanha; a época estival é por isso o
      período privilegiado para percorrer os trilhos pedestres e as pistas de montanha.
    visit: >-
      Há caminhos marcados que sobem ao planalto a partir de Kropa, Jamnik, Lipnica e Ribno, ligando-se às
      veredas que cruzam as pastagens. A partir de Radovljica sobe-se pela pista florestal que arranca em
      Spodnja Lipnica.


      Três pastagens com cabanas de montanha formam os destinos favoritos: Talež, Goška ravan e Vodiška
      planina. Até Vodiška planina sobe um estradão de terra batida, excelente para bicicleta de montanha por
      entre a floresta. Se procuras vistas amplas, caminha até ao rochedo Babji zob ou até Talež. Os caminhos
      florestais de Jelovica prestam-se ao cicloturismo de montanha, existindo a rota temática Pelos Trilhos
      da Jelovica Partisan.


      Outros alpeggi históricos do planalto são Mošenjska planina, Lipniška planina, Kališnik e Ribenska
      planina.
    history: >-
      Aqui extraiu-se minério de ferro laborado nas forjas de Kropa e Železniki. A madeira alimentava as
      carvoarias, dizimando o bosque primitivo. O vale de Lipnica salvaguarda o legado metalúrgico tradicional
      de Kropa e Kamna Gorica. Na Segunda Guerra Mundial, o planalto serviu de esconderijo aos resistentes
      partisans eslovenos.


      Hoje Jelovica integra a rede Natura 2000 e toda a sua extensão territorial usufrui de estatuto de
      conservação da natureza.
    before: >-
      Muitos ramais rurais até às pastagens estão sem placas; utiliza os trilhos oficiais desde Kropa, Jamnik,
      Lipnica e Ribno. É um vasto planalto florestal: leva equipamento adequado de montanha. O verão é a época
      recomendada para desfrutar das pastagens e das rotas de bicicleta.
    around: >-
      O [Parque Nacional do Triglav](/lugar/triglav-southern-karst-plateau/) fica a três quilómetros, e a
      cordilheira de [Karavanke / Karawanken](/lugar/karavanke---karawanken/) a nove quilómetros. A treze
      quilómetros dista a [Floresta de Tarvisio e Alpes Julianos
      Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/), a vinte e quatro o [Planalto Cársico de
      Nanos](/lugar/kraska-planota-nanos/) e a vinte e oito o [Planalto Florestal de
      Trnovo](/lugar/trnovski-gozd/). O [Planalto de Pokljuka](/lugar/pokljuka-plateau/) situa-se defronte.
