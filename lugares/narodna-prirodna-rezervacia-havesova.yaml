resumen:
  es: >-
    Bosque virgen de haya con ejemplares récord que superan los 50 metros de altura en los Cárpatos
    orientales.
  en: Virgin beech forest with record-breaking trees exceeding 50 metres in height in the Eastern Carpathians.
  fr: Hêtraie vierge aux spécimens records dépassant 50 mètres de hauteur dans les Carpates orientales.
  de: Buchenurwald mit Rekordbäumen von über 50 Metern Höhe in den Ostkarpaten.
  it: >-
    Foresta vergine di faggio con esemplari da primato che superano i 50 metri di altezza nei Carpazi
    orientali.
  pt: >-
    Floresta virgem de faia com exemplares recordistas que ultrapassam os 50 metros de altura nos Cárpatos
    orientais.
unico:
  es: Aquí el hayedo se deja evolucionar solo, y el que quiera verlo tiene que entrar con personal del parque.
  en: >-
    Here the beech forest is left to evolve entirely on its own, and anyone wishing to see it must enter with
    park rangers.
  fr: >-
    Ici, la hêtraie est laissée à sa libre évolution naturelle, et quiconque souhaite la découvrir doit y
    pénétrer avec les agents du parc.
  de: >-
    Hier bleibt der Buchenwald vollständig seiner natürlichen Dynamik überlassen, und wer ihn sehen möchte,
    muss ihn mit Nationalpark-Rangern betreten.
  it: >-
    Qui la faggeta viene lasciata alla sua spontanea evoluzione, e chi desidera vederla deve accedervi
    accompagnato dal personale del parco.
  pt: >-
    Aqui o faial evolui sem qualquer corte, e quem o quiser conhecer tem de entrar acompanhado por vigilantes
    do parque.
observaciones:
  es: >-
    La reserva no está abierta al público: solo se entra acompañado de personal del Parque Nacional Poloniny.
    Reserva la excursión con el gestor.
texto:
  es:
    intro: >-
      Un hayedo en el que un ciclo completo de vida dura entre 230 y 250 años. Eso es Havešová: 171,32
      hectáreas de bosque primario en los montes Bukovské vrchy, dentro del área de Poloniny, en el extremo
      oriental de Eslovaquia. No es grande, y no hace falta. En parcelas de entre 8 y 16 áreas, las distintas
      fases del bosque se van turnando: un claro aquí, un árbol joven allá, un gigante que muere en pie un
      poco más lejos. Es un bosque que se renueva por trozos pequeños, y se puede leer como un libro.
    landscape: >-
      El relieve es de surcos erosivos bajo las crestas, entre 450 y 740 metros de altitud. El suelo viene del
      flysch de Krosno, con pizarras arcillosas, y sobre él se han formado suelos forestales pardos,
      mesotróficos y poco húmicos. La Wikipedia eslovaca sitúa ese sustrato en el Paleoceno.


      El clima es fresco y húmedo: la temperatura media anual ronda los 7 °C y la precipitación se mueve entre
      700 y 800 mm. Con ese suelo y ese clima, dominan las comunidades del piso de vegetación forestal de
      haya, y cerca de las crestas aparecen hayedos típicos.


      Lo que cuenta aquí es la estructura. La reserva mantiene una zona forestal con árboles jóvenes, madera
      muerta y varias capas de vegetación. En el suelo del bosque crecen arces de montaña y arces noruegos,
      fresnos y olmos de montaña, y bajo ellos hierbas como la Dentaria, la hluchavka žltá o la bažanka
      trváca. Entre las plantas de carácter carpático se citan el kostihoj srdcovitolistý y la veronika
      horská.
    wildlife: >-
      Es un bosque de fauna discreta, y lo más fácil de encontrar son las huellas. La excursión guiada del
      gestor incluye precisamente eso: buscar rastros de los animales que habitan el bosque primario, y
      examinar los árboles muertos.


      Entre los grandes mamíferos de la reserva están el [lince](/especie/lynx_lynx/), el
      [lobo](/especie/canis_lupus/), el [oso pardo](/especie/ursus_arctos/) y el gato montés. En las ramas, el
      [pico dorsiblanco](/especie/dendrocopos_leucotos/), el pico negro, el [papamoscas
      acollarado](/especie/ficedula_albicollis/) y la [cárabo uralense](/especie/strix_uralensis/); la
      [cigüeña negra](/especie/ciconia_nigra/) y la paloma zurita, que nidifica en Havešová, completan las
      aves. También figuran el milano real y el [aguilucho pomarino](/especie/aquila_pomarina/).


      A ras de suelo, la salamandra, el sapo de vientre amarillo, la užovka stromová y la víbora. Y entre la
      madera muerta, la [rosalía alpina](/especie/rosalia_alpina/), un escarabajo longicornio. La lista del
      gestor es de esta reserva, no del parque entero.
    visit: >-
      Havešová no está abierta al público en general. La única manera de verla es el sendero educativo que
      atraviesa el bosque primario, y solo se visita a pie y con personal de la administración del Parque
      Nacional Poloniny. Es una ruta fácil: 2.200 m, 120 m de desnivel y unas dos horas. El gestor calcula que
      la excursión pasa aproximadamente tres horas en el bosque, y la describe como apta también para familias
      con niños. La entrada tiene un panel informativo.


      El sendero parte de una pista forestal que sale del pueblo de Kalná Roztoka. La reserva se reparte entre
      Kalná Roztoka y Stakčínska Roztoka.
    history: >-
      Hay un dato que resume el cuidado de este lugar: las parcelas permanentes de investigación se
      establecieron en 1979 y reciben estudios repetidos. Décadas de mediciones sobre el mismo bosque.


      Havešová forma parte de la serie UNESCO de bosques templados complejos y poco alterados, y la UNESCO
      prescribe para sus componentes un manejo sin intervención. El programa de gestión propone dejar los
      núcleos de Havešová, Rožok y Stužica a su evolución natural. Entre las presiones sobre los bosques de
      Poloniny, el programa señala sequías y heladas repentinas, aunque no cuantifica su efecto solo en
      Havešová.


      Fuera de la reserva, en el entorno de Poloniny, la historia humana es otra: las praderas de altura se
      han mantenido por siega y pastoreo alternos desde la colonización valaca. Dentro, en cambio, nadie siega
      ni apacienta. Son dos maneras opuestas de cuidar el monte.
    before: >-
      La reserva no está abierta al público: solo se entra acompañado de personal del Parque Nacional
      Poloniny. Reserva la excursión con el gestor.
    around: >-
      Havešová pertenece al [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). A unos 9 km está la [Národná prírodná
      rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), a unos 13 km el [Bieszczadzki Park
      Narodowy - Kompleks leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) y, a unos catorce km, la
      [Národná prírodná rezervácia Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) y el [Prales Vihorlat
      - Morské oko](/lugar/prales-vihorlat---morske-oko/). Más lejos, el [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) coincide en la cárabo uralense, el pico negro y la
      cigüeña negra, además del bosque primario, y el [Pragozd Krokar](/lugar/pragozd-krokar/) en la rosalía
      alpina, la cárabo uralense y el pico dorsiblanco.
  en:
    intro: >-
      A beech forest where a single full life cycle lasts between 230 and 250 years. That is Havešová: 171.32
      hectares of primeval woodland in the Bukovské vrchy mountains, within the Poloniny territory at
      Slovakia's easternmost edge. It is not immense, and it does not need to be. Across patches of 8 to 16
      ares, the varying phases of the forest alternate: a clearing here, a young tree there, a standing
      deadwood giant a little further on. This forest renews itself in modest mosaics, and you can read it
      like an open book.
    landscape: >-
      The terrain consists of erosive gullies falling away below the ridges, between 450 and 740 metres in
      elevation. The bedrock derives from Krosno flysch with clay shales, giving rise to mesotrophic,
      low-humus brown forest soils. Slovak scientific literature dates this geological stratum to the
      Paleocene.


      The climate is cool and damp: the mean annual temperature hovers around 7 °C and annual precipitation
      ranges between 700 and 800 mm. Driven by this soil and climate, vegetation communities of the submontane
      beech belt dominate, giving way to typical mountain beech woods along the upper ridges.


      What matters most here is forest architecture. The reserve preserves a multi-layered stand featuring
      young saplings, decaying wood, and varied structural tiers. On the forest floor grow sycamore and Norway
      maples, common ash, and wych elm, under which herb layers shelter species such as Dentaria, yellow
      archangel (*hluchavka žltá*), and dog's mercury (*bažanka trváca*). Distinctive Carpathian plants
      include heart-leaved comfrey (*kostihoj srdcovitolistý*) and mountain speedwell (*veronika horská*).
    wildlife: >-
      This is a realm of discreet wildlife, where tracks in the mud are the easiest signs to spot. The park
      authority's guided excursion focuses on this very pursuit: tracking the elusive animals that dwell in
      old-growth timber and inspecting decaying deadwood.


      Prominent large mammals within the reserve include the [Eurasian lynx](/especie/lynx_lynx/), the [grey
      wolf](/especie/canis_lupus/), the [brown bear](/especie/ursus_arctos/), and the wildcat. In the canopy
      dwell the [white-backed woodpecker](/especie/dendrocopos_leucotos/), black woodpecker, [collared
      flycatcher](/especie/ficedula_albicollis/), and [Ural owl](/especie/strix_uralensis/); the [black
      stork](/especie/ciconia_nigra/) and stock dove, which nests in Havešová, complete the avifauna. Red
      kites and the [lesser spotted eagle](/especie/aquila_pomarina/) patrol the skies above.


      At ground level live the fire salamander, yellow-bellied toad, Aesculapian snake (*užovka stromová*),
      and common viper. Among fallen deadwood lurks the [Rosalia longicorn](/especie/rosalia_alpina/), an
      iconic longhorn beetle. The park's species inventory applies specifically to this strict reserve, not
      merely the broader park.
    visit: >-
      Havešová is not open to general tourism. The only way to experience it is via the educational trail
      threading through the primeval core, accessible exclusively on foot and accompanied by official Poloniny
      National Park administration staff. It is an easy walk: 2,200 m long, with 120 m of elevation gain,
      taking roughly two hours. The park service estimates that visitors spend approximately three hours in
      the woodland, making it suitable for families with children. An informational kiosk marks the trailhead.


      The path branches from a forestry track originating in the village of Kalná Roztoka. The reserve's
      footprint is divided administratively between Kalná Roztoka and Stakčínska Roztoka.
    history: >-
      A single detail illustrates the dedicated scientific care of this sanctuary: permanent forest research
      plots were laid out in 1979 and undergo periodic resurveys. Decades of continuous measurements on the
      very same trees.


      Havešová forms part of the UNESCO serial property of complex, minimally disturbed temperate forests, and
      UNESCO mandates non-intervention management across all component parts. The official management
      framework proposes leaving the primeval cores of Havešová, Rožok, and Stužica to their natural
      ecological succession. Among emerging pressures on Poloniny forests, authorities cite prolonged summer
      droughts and sudden frost events, though specific impacts isolated to Havešová remain unquantified.


      Outside the reserve, across the wider Poloniny cultural landscape, human history tells a contrasting
      tale: high-altitude grasslands have been maintained through rotational mowing and grazing since Vlach
      colonisation. Inside the reserve, by contrast, no one mows or grazes. Two fundamentally opposite ways of
      looking after the land.
    before: >-
      The reserve is strictly closed to unescorted visitors: access is permitted only when accompanied by
      Poloniny National Park staff. Book your guided excursion in advance through the park authority.
    around: >-
      Havešová is a core component of the [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). Roughly 9 km away lies the [Národná
      prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), about 13 km away is [Bieszczadzki
      Park Narodowy - Kompleks leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), and around
      fourteen km away are [Národná prírodná rezervácia Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/)
      and [Prales Vihorlat - Morské oko](/lugar/prales-vihorlat---morske-oko/). Further afield, [Codrul
      Secular Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) shares the Ural owl, black woodpecker, and
      black stork, alongside virgin beech ecosystems, while [Pragozd Krokar](/lugar/pragozd-krokar/) shares
      the Rosalia longicorn, Ural owl, and white-backed woodpecker.
  fr:
    intro: >-
      Une hêtraie où un cycle biologique complet s'étend sur 230 à 250 ans. Voilà ce qu'est Havešová : 171,32
      hectares de forêt primaire nichés dans les monts Bukovské vrchy, au cœur de la région des Poloniny, à
      l'extrémité orientale de la Slovaquie. Le domaine n'est pas immense, et cela n'est nullement nécessaire.
      Sur des parcelles de 8 à 16 ares, les phases successives de la forêt alternent : une trouée de lumière
      ici, un jeune arbre là, un géant dépérissant sur pied un peu plus loin. C'est une forêt qui se régénère
      par petites touches et qui se lit comme un livre ouvert.
    landscape: >-
      Le relief s'ordonne en ravines d'érosion sous les crêtes, entre 450 et 740 mètres d'altitude. Le
      substrat géologique est issu du flysch de Krosno, constitué de schistes argileux, sur lequel se sont
      développés des sols bruns forestiers mésotrophes et peu humifères. La littérature slovaque rattache
      cette assise géologique au Paléocène.


      Le climat est frais et humide : la température moyenne annuelle avoisine 7 °C et les précipitations
      oscillent entre 700 et 800 mm. Sous l'influence conjointe du sol et du climat dominent les groupements
      forestiers de l'étage de la hêtraie, tandis que des hêtraies typiques couronnent les crêtes.


      Ce qui importe avant tout ici, c'est l'étagement de la végétation. La réserve conserve une futaie étagée
      comprenant jeunes régénérations, bois mort et multiples strates végétales. Au sol s'épanouissent érables
      sycomores, érables plans, frênes et ormes de montagne, sous lesquels prospèrent des herbacées comme les
      dentaires, le lamier jaune (*hluchavka žltá*) ou la mercuriale vivace (*bažanka trváca*). Parmi les
      plantes d'affinité carpatique figurent la consoude à feuilles cordées et la véronique des montagnes.
    wildlife: >-
      C'est une forêt à la faune secrète, où les empreintes constituent l'indice de présence le plus
      accessible. La sortie accompagnée organisée par le parc consiste précisément en cela : pister les
      indices laissés par la grande faune de la forêt primaire et scruter les vieux arbres morts.


      Parmi les grands mammifères de la réserve se distinguent le [lynx boréal](/especie/lynx_lynx/), le
      [loup](/especie/canis_lupus/), l'[ours brun](/especie/ursus_arctos/) et le chat sauvage. Dans les
      frondaisons nichent le [pic à dos blanc](/especie/dendrocopos_leucotos/), le pic noir, le [gobemouche à
      collier](/especie/ficedula_albicollis/) et la [chouette de l'Oural](/especie/strix_uralensis/) ; la
      [cigogne noire](/especie/ciconia_nigra/) et le pigeon colombin, qui se reproduit à Havešová, complètent
      le cortège aviaire. Le milan royal et l'[aigle pomarin](/especie/aquila_pomarina/) survolent
      régulièrement le secteur.


      Près du sol vivent la salamandre tachetée, le sonneur à ventre jaune, la couleuvre d'Esculape et la
      vipère péliade. Dans le bois mort décomposé gîte la [rosalie des Alpes](/especie/rosalia_alpina/),
      coléoptère longicorne remarquable. Cet inventaire établi par les gestionnaires s'applique expressément à
      la réserve intégrale et non à l'ensemble du parc.
    visit: >-
      Havešová n'est pas ouverte au tourisme libre. Le seul moyen d'en apprécier la majesté est le sentier
      didactique qui sillonne le cœur primaire, exclusivement parcouru à pied et en compagnie d'agents de
      l'administration du parc national des Poloniny. L'itinéraire est accessible : 2 200 m de longueur, 120 m
      de dénivelé et une marche d'environ deux heures. Les gestionnaires estiment à environ trois heures le
      temps d'immersion sous les arbres, rendant l'excursion accessible aux familles avec enfants. Un panneau
      didactique marque le point d'accès.


      Le sentier s'amorce depuis une piste forestière partant du village de Kalná Roztoka. Le périmètre de la
      réserve se partage entre les bans communaux de Kalná Roztoka et de Stakčínska Roztoka.
    history: >-
      Un fait résume l'extrême rigueur du suivi scientifique de cet espace : des placettes permanentes d'étude
      y ont été implantées en 1979 et font l'objet d'observations réitérées. Des décennies de mesures
      dendrométriques conduites sur les mêmes arbres.


      Havešová fait partie du bien sériel de l'UNESCO dédié aux forêts tempérées anciennes peu altérées,
      l'institution préconisant une gestion exempte de toute intervention humaine. Le schéma de gestion
      propose de vouer les sanctuaires de Havešová, Rožok et Stužica à leur évolution naturelle spontanée.
      Parmi les pressions climatiques pesant sur les massifs des Poloniny, les documents relèvent des épisodes
      de sécheresse estivale et de gelées printanières soudaines, sans toutefois isoler leur impact spécifique
      sur Havešová.


      Hors de la réserve, dans les vallées des Poloniny, l'histoire agraire est différente : les alpages
      sommitaux sont entretenus par la fauche et le pâturage depuis la colonisation valaque. À l'intérieur, à
      l'inverse, nul ne fauche ni ne fait paître. Deux visions complémentaires de la montagne.
    before: >-
      La réserve intégrale est strictement fermée au public non accompagné : l'accès est subordonné à la
      présence d'agents du parc national des Poloniny. Réservez votre visite guidée auprès du service
      gestionnaire.
    around: >-
      Havešová est rattachée au [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). À environ 9 km s'étend la [Národná
      prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), à environ 13 km le [Bieszczadzki
      Park Narodowy - Kompleks leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/), et à quatorze km
      environ se trouvent la [Národná prírodná rezervácia
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) et le [Prales Vihorlat - Morské
      oko](/lugar/prales-vihorlat---morske-oko/). Plus au sud, le [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) partage la chouette de l'Oural, le pic noir et la
      cigogne noire en forêt primaire, tandis que le [Pragozd Krokar](/lugar/pragozd-krokar/) accueille la
      rosalie des Alpes, la chouette de l'Oural et le pic à dos blanc.
  de:
    intro: >-
      Ein Buchenwald, in dem ein vollständiger Lebenszyklus zwischen 230 und 250 Jahren dauert. Das ist
      Havešová: 171,32 Hektar Primärwald in den Bergen der Bukovské vrchy im Gebiet Poloniny am östlichen
      Zipfel der Slowakei. Er ist nicht riesig, und das muss er auch nicht sein. Auf kleinen Parzellen von 8
      bis 16 Ar wechseln die Waldentwicklungsphasen einander ab: hier eine Lichtung, dort ein Jungbaum, etwas
      weiter ein stehender Baumriese im Zerfall. Dieser Wald erneuert sich kleinräumig und lässt sich wie ein
      Buch lesen.
    landscape: >-
      Das Relief wird von Erosionsrinnen unterhalb der Kämme geprägt, zwischen 450 und 740 Metern Seehöhe. Der
      Untergrund entstammt dem Krosno-Flysch mit Tonschiefern, über dem sich mesotrophe, humusarme braune
      Waldböden gebildet haben. Die Fachliteratur datiert dieses Gestein in das Paläozän.


      Das Klima ist kühl und feucht: Die Jahresmitteltemperatur liegt bei etwa 7 °C und die
      Jahresniederschläge bewegen sich zwischen 700 und 800 mm. Begünstigt durch diesen Boden dominieren
      Buchenwaldgesellschaften, während sich auf den Graten typische Bergmischwälder einstellen.


      Entscheidend ist hier die vertikale Waldstruktur. Das Reservat bewahrt einen mehrschichtigen Bestand mit
      Jungwuchs, Totholz und reicher Krautschicht. Auf dem Waldboden wachsen Berg-Ahorn, Spitz-Ahorn, Gemeine
      Esche und Berg-Ulme, darunter Kräuter wie Zahnwurz, Gold-Goldnessel (*hluchavka žltá*) und
      Wald-Bingelkraut (*bažanka trváca*). Zu den charakteristischen Karpatenpflanzen zählen Kaukasus-Beinwell
      und Berg-Ehrenpreis.
    wildlife: >-
      Es ist ein Wald heimlicher Tiere, bei denen Fährten und Spuren am leichtesten zu entdecken sind. Die
      geführte Ranger-Exkursion setzt genau hier an: Tierspuren des Urwalds lesen und das Leben im Totholz
      erforschen.


      Unter den Großsäugern leben im Schutzgebiet [Eurasischer Luchs](/especie/lynx_lynx/),
      [Wolf](/especie/canis_lupus/), [Braunbär](/especie/ursus_arctos/) und Wildkatze. Im Geäst brüten
      [Weißrückenspecht](/especie/dendrocopos_leucotos/), Schwarzspecht,
      [Halsbandschnäpper](/especie/ficedula_albicollis/) und [Habichtskauz](/especie/strix_uralensis/);
      [Schwarzstorch](/especie/ciconia_nigra/) und Hohltaube vervollständigen die Vogelwelt. Auch Rotmilan und
      [Schreiadler](/especie/aquila_pomarina/) jagen über den Hängen.


      Am Waldboden leben Feuersalamander, Gelbbauchunke, Äskulapnatter (*užovka stromová*) und Kreuzotter. Im
      modernden Totholz entwickelt sich der [Alpenbock](/especie/rosalia_alpina/), ein auffälliger Bockkäfer.
      Die Artenliste der Parkverwaltung gilt gezielt für dieses strenge Reservat, nicht für den gesamten
      Nationalpark.
    visit: >-
      Havešová ist für den allgemeinen Tourismus gesperrt. Die einzige Möglichkeit, den Urwald zu erleben,
      bietet der Lehrpfad, der ausschließlich zu Fuß und in Begleitung von Mitarbeitern der
      Nationalparkverwaltung Poloniny begangen werden darf. Es ist eine leichte Wanderung: 2.200 m Distanz,
      120 m Höhenunterschied und eine Gehzeit von rund zwei Stunden. Die Verwaltung veranschlagt etwa drei
      Stunden Gesamtdauer im Wald, wodurch sich die Tour auch für Familien mit Kindern eignet. Am Einstieg
      informiert eine Schautafel.


      Der Pfad zweigt von einem Forstweg ab, der im Dorf Kalná Roztoka beginnt. Das Reservat verteilt sich auf
      die Gemarkungen von Kalná Roztoka und Stakčínska Roztoka.
    history: >-
      Ein Fakt belegt die wissenschaftliche Sorgfalt: Feste Forschungsflächen wurden bereits 1979 eingerichtet
      und werden seither regelmäßig vermessen. Jahrzehntelange Erhebungen am identischen Baumbestand.


      Havešová gehört zum UNESCO-Weltnaturerbe unberührter Buchenwälder, für die ein striktes
      Prozessschutzregime ohne forstliche Eingriffe vorgeschrieben ist. Der Managementplan sieht vor, die
      Kernzonen Havešová, Rožok und Stužica gänzlich der Natur zu überlassen. Als Herausforderungen im Gebiet
      Poloniny nennt die Verwaltung Sommertrockenheit und Spätfröste, ohne deren Ausmaß für Havešová allein zu
      quantifizieren.


      Außerhalb des Reservats prägte die menschliche Nutzung die Landschaft: Die waldfreien Hochweiden wurden
      seit der walachischen Kolonisation durch Mahd und Weidegang offen gehalten. Im Urwald hingegen wird
      weder gemäht noch geweidet. Zwei grundverschiedene Formen des Landschaftsumgangs.
    before: >-
      Das Reservat ist für Individualbesucher geschlossen: Zutritt ist nur mit Begleitpersonal des
      Nationalparks Poloniny gestattet. Buche die Exkursion vorab bei der Parkverwaltung.
    around: >-
      Havešová gehört zum [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). Rund 9 km entfernt liegt die [Národná
      prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), etwa 13 km der [Bieszczadzki Park
      Narodowy - Kompleks leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) und rund vierzehn km die
      [Národná prírodná rezervácia Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) sowie [Prales
      Vihorlat - Morské oko](/lugar/prales-vihorlat---morske-oko/). Weiter entfernt teilt der [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) Habichtskauz, Schwarzspecht und Schwarzstorch im
      Buchen-Urwald, während der [Pragozd Krokar](/lugar/pragozd-krokar/) Alpenbock, Habichtskauz und
      Weißrückenspecht beherbergt.
  it:
    intro: >-
      Una faggeta in cui un ciclo biologico completo dura tra 230 e 250 anni. Questa è Havešová: 171,32 ettari
      di foresta primaria sui monti Bukovské vrchy, nel territorio di Poloniny all'estremità orientale della
      Slovacchia. Non è enorme, né ha bisogno di esserlo. Su parcelle comprese tra 8 e 16 are, le diverse fasi
      evolutive del bosco si avvicendano: una radura qui, un giovane virgulto là, un patriarca cadente poco
      più in là. È una foresta che si rigenera a piccoli tasselli e si legge come un libro aperto.
    landscape: >-
      La morfologia presenta profondi solchi d'erosione sotto i crinali montuosi, tra 450 e 740 metri di
      quota. Il substrato roccioso deriva dal flysch di Krosno con scisti argillosi, sul quale si sono formati
      suoli bruni forestali mesotrofi e poco umiferi. La letteratura scientifica slovacca colloca questa
      matrice geologica nel Paleocene.


      Il clima è fresco e umido: la temperatura media annua si aggira sui 7 °C e le precipitazioni spaziano
      tra 700 e 800 mm. Grazie a questi suoli e al clima fresco, dominano i consorzi forestali del piano
      montano del faggio, mentre lungo i crinali si affermano faggete tipiche.


      Ciò che conta davvero è la complessa architettura del bosco. La riserva conserva una fisionomia
      stratificata con rinnovazione naturale, abbondante legno morto e diversi livelli di vegetazione. Nel
      sottobosco vegetano acero montano, acero riccio, frassino maggiore e olmo montano, sotto i quali
      spuntano erbe come la dentaria, la falsa ortica gialla (*hluchavka žltá*) e la mercorella perenne
      (*bažanka trváca*). Tra le specie vegetali tipicamente carpatiche si citano la consolida a foglie
      cuoriformi e la veronica montana.
    wildlife: >-
      È una foresta popolata da una fauna schiva, dove l'osservazione più immediata passa attraverso le
      tracce. L'escursione guidata organizzata dai guardiaparco prevede proprio questo: interpretare le orme
      degli animali della foresta primaria ed esaminare gli alberi morti deperiti.


      Tra i grandi mammiferi censiti nella riserva figurano la [lince euroasiatica](/especie/lynx_lynx/), il
      [lupo grigio](/especie/canis_lupus/), l'[orso bruno](/especie/ursus_arctos/) e il gatto selvatico. Sulle
      chiome alberate nidificano il [picchio dorsobianco](/especie/dendrocopos_leucotos/), il picchio nero, la
      [balia dal collare](/especie/ficedula_albicollis/) e l'[allocco degli Urali](/especie/strix_uralensis/);
      la [cicogna nera](/especie/ciconia_nigra/) e il colombella, che si riproduce a Havešová, completano il
      quadro dell'avifauna. Solcano i cieli anche il nibbio reale e l'[aquila anatraia
      minore](/especie/aquila_pomarina/).


      A terra vivono la salamandra pezzata, l'ululone dal ventre giallo, il colubro di Esculapio e il marasso.
      Nel legno marcescente prolifera la [rosalia alpina](/especie/rosalia_alpina/), spettacolare coleottero
      cerambicide. L'elenco redatto dai gestori si riferisce espressamente a questa riserva integrale e non
      all'intero parco.
    visit: >-
      Havešová non è aperta al libero transito turistico. L'unico modo per visitarla è percorrere il sentiero
      didattico che si addentra nella foresta vergine, accessibile rigorosamente a piedi e scortati dal
      personale del Parco Nazionale Poloniny. Si tratta di un itinerario agevole: 2.200 m di percorso, 120 m
      di dislivello per una durata di circa due ore di cammino. L'ente gestore calcola una permanenza
      complessiva di circa tre ore nella foresta, adatta anche a famiglie con bambini. All'inizio del percorso
      è presente un pannello informativo.


      Il tracciato si stacca da una pista forestale che parte dall'abitato di Kalná Roztoka. Il territorio
      della riserva ricade amministrativamente tra Kalná Roztoka e Stakčínska Roztoka.
    history: >-
      Un elemento testimonia il rigore scientifico di questo sito: le aree permanenti di ricerca sono state
      istituite nel 1979 e vengono monitorate periodicamente. Decenni di rilievi comparati sulla stessa
      porzione di bosco.


      Havešová appartiene al circuito UNESCO delle foreste primarie temperate scarsamente alterate, per le
      quali è prescritta una gestione a totale non intervento. Il piano operativo prevede di affidare
      Havešová, Rožok e Stužica alla loro evoluzione naturale spontanea. Tra le criticità climatiche
      individuate nei boschi di Poloniny figurano siccità estive e gelate improvvise, sebbene gli effetti
      circoscritti a Havešová non siano stati quantificati singolarmente.


      Fuori dalla riserva, nelle vallate di Poloniny, la presenza dell'uomo ha seguito un'altra strada: i
      pascoli sommitali sono stati preservati dallo sfalcio e dal pascolo alternato fin dalla colonizzazione
      valacca. All'interno della riserva, invece, nessuno falcia né pascola. Due modelli opposti di cura della
      montagna.
    before: >-
      La riserva è inaccessibile ai visitatori autonomi: si entra esclusivamente accompagnati dal personale
      del Parco Nazionale Poloniny. Prenota l'escursione direttamente presso l'ente parco.
    around: >-
      Havešová fa parte del [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). A circa 9 km sorge la [Národná prírodná
      rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), a circa 13 km il [Bieszczadzki Park
      Narodowy - Kompleks leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) e a circa quattordici km
      la [Národná prírodná rezervácia Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) e [Prales Vihorlat
      - Morské oko](/lugar/prales-vihorlat---morske-oko/). Più a distanza, [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) condivide allocco degli Urali, picchio nero e
      cicogna nera in faggeta primaria, mentre il [Pragozd Krokar](/lugar/pragozd-krokar/) ospita rosalia
      alpina, allocco degli Urali e picchio dorsobianco.
  pt:
    intro: >-
      Um faial primitivo onde um ciclo completo de vida se prolonga entre 230 e 250 anos. Isso é Havešová:
      171,32 hectares de floresta primária nas montanhas Bukovské vrchy, integrados na área de Poloniny, no
      extremo oriental da Eslováquia. Não é uma área imensa, nem tal é necessário. Em parcelas florestais de 8
      a 16 ares, as fases sucessivas da mata alternam harmonicamente: uma clareira aberta, uma árvore jovem
      viçosa, um tronco colossal que morre de pé mais adiante. É uma floresta que se regenera em pequenas
      clareiras e se lê como um livro.
    landscape: >-
      O relevo molda-se em ravinas de erosão escavadas sob as cristas, entre 450 e 740 metros de altitude. O
      solo provém do flysch de Krosno com xistos argilosos, sobre o qual se desenvolveram solos florestais
      castanhos mesotróficos e de baixo teor em húmus. A investigação eslovaca situa esse substrato geológico
      no Paleoceno.


      O clima é fresco e húmido: a temperatura média anual ronda os 7 °C e a precipitação acumulada oscila
      entre 700 e 800 mm. Sob a influência deste solo e deste clima predominam as comunidades do andar
      florestal da faia, surgindo nas cristas faiais montanos característicos.


      O traço decisivo reside na complexidade estrutural. A reserva preserva um povoamento em vários estratos
      com regeneração jovem, troncos em decomposição e copas escalonadas. No sub-bosque desenvolvem-se o
      bordo-falso, o bordo-da-noruega, o freixo e o olmo-montano, abrigando ervas como a dentária, a
      urtiga-morta-amarela (*hluchavka žltá*) e a mercurial-perene (*bažanka trváca*). Entre a flora carpática
      destacam-se o consolda-de-folhas-cordiformes e a verónica-da-montanha.
    wildlife: >-
      É uma floresta de fauna discreta, onde a forma mais segura de observação passa pelas pegadas e indícios.
      A visita guiada do parque foca-se precisamente nisso: rastrear as espécies que povoam a mata primária e
      examinar os troncos tombados.


      Entre os grandes mamíferos da reserva salientam-se o [lince-euroasiático](/especie/lynx_lynx/), o
      [lobo-cinzento](/especie/canis_lupus/), o [urso-pardo](/especie/ursus_arctos/) e o gato-bravo. Nas copas
      habitam o [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/), o pica-pau-preto, o
      [papa-moscas-de-colar](/especie/ficedula_albicollis/) e a [coruja-dos-urais](/especie/strix_uralensis/);
      a [cegonha-preta](/especie/ciconia_nigra/) e o pombo-bravo, que nidifica em Havešová, completam o elenco
      ornitológico. Pelo céu cruzam o milhafre-real e a [águia-pomerana](/especie/aquila_pomarina/).


      Junto ao chão encontram-se a salamandra-de-pintas-amarelas, o bombina-de-ventre-amarelo, a
      cobra-de-esculápio e a víbora-comum. Na madeira morta desenvolve-se a
      [rosália-alpina](/especie/rosalia_alpina/), um escaravelho de antenas longas emblemático. O inventário
      oficial da administração do parque reporta-se em exclusivo a esta reserva integral, não ao parque no seu
      conjunto.
    visit: >-
      Havešová não se encontra aberta ao turismo comum. O único acesso faz-se através do trilho educativo que
      penetra no bosque primitivo, percorrível apenas a pé e sob orientação de técnicos da administração do
      Parque Nacional de Poloniny. É um percurso suave: 2 200 m de extensão, 120 m de desnível e cerca de duas
      horas de marcha. A entidade gestora prevê aproximadamente três horas de permanência no interior do
      bosque, sendo indicado para famílias com crianças. Na entrada existe um painel interpretativo.


      O trilho arranca a partir de um caminho florestal na povoação de Kalná Roztoka. A mancha da reserva
      divide-se administrativamente entre Kalná Roztoka e Stakčínska Roztoka.
    history: >-
      Um dado comprova o empenho científico neste recanto: parcelas de monitorização permanente foram
      estabelecidas em 1979 e recebem estudos sucessivos. Décadas de medições sistemáticas sobre a mesma
      floresta.


      Havešová integra a série da UNESCO de faiais primários temperados, exigindo a organização internacional
      uma gestão estrita de não intervenção. O plano diretor preconiza que os núcleos de Havešová, Rožok e
      Stužica continuem a evoluir naturalmente. Entre as pressões globais sobre os bosques de Poloniny, a
      administração aponta secas estivais e geadas extemporâneas, embora sem dados discriminados apenas para
      Havešová.


      Fora da reserva, na envolvente de Poloniny, a presença humana trilhou outro rumo: as pastagens de
      montanha foram mantidas por ceifa e pastoreio alternados desde a época dos valacos. Dentro do bosque,
      contudo, ninguém ceifa nem apascenta gado. Dois caminhos contrastantes de cuidar da serra.
    before: >-
      A reserva está interdita a visitas individuais: a entrada depende de marcação prévia com técnicos do
      Parque Nacional de Poloniny. Agenda o percurso junto da entidade gestora.
    around: >-
      Havešová pertence ao complexo [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/). A cerca de 9 km fica a [Národná
      prírodná rezervácia Rožok](/lugar/narodna-prirodna-rezervacia-rozok/), a perto de 13 km o [Bieszczadzki
      Park Narodowy - Kompleks leśny](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/) e a sensivelmente
      catorze km situam-se a [Národná prírodná rezervácia
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/) e o [Prales Vihorlat - Morské
      oko](/lugar/prales-vihorlat---morske-oko/). Mais distante, o [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) partilha a coruja-dos-urais, o pica-pau-preto e a
      cegonha-preta, enquanto o [Pragozd Krokar](/lugar/pragozd-krokar/) acolhe a rosália-alpina, a
      coruja-dos-urais e o pica-pau-de-dorso-branco.
