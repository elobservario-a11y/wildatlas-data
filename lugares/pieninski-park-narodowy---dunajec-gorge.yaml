resumen:
  es: >-
    Espectacular garganta caliza meandriforme labrada por el río Dunajec entre las icónicas picos Trzy Korony
    (Tres Coronas) y Sokolica.
  en: >-
    Spectacular meandering limestone gorge carved by the Dunajec River between the iconic Trzy Korony (Three
    Crowns) and Sokolica peaks.
  fr: >-
    Spectaculaire défilé calcaire méandreux creusé par le Dunajec entre les sommets emblématiques des Trzy
    Korony (Trois Couronnes) et de Sokolica.
  de: >-
    Spektakuläre mäandrierende Kalksteinschlucht, die der Fluss Dunajec zwischen den markanten Gipfeln Trzy
    Korony (Drei Kronen) und Sokolica eingekerbt hat.
  it: >-
    Spettacolare gola calcarea a meandri scavata dal fiume Dunajec tra gli iconici picchi Trzy Korony (Tre
    Corone) e Sokolica.
  pt: >-
    Espetacular desfiladeiro calcário talhado pelo rio Dunajec entre os icónicos cumes Trzy Korony (Três
    Coroas) e Sokolica.
unico:
  es: >-
    Un río que tarda ocho kilómetros en avanzar 2,8 por una garganta de caliza, en un parque que fue el
    primero de Polonia.
  en: >-
    A river that takes eight kilometres of bends to advance just 2.8 in a straight line through a limestone
    gorge, in Poland's oldest national park.
  fr: >-
    Une rivière qui parcourt huit kilomètres de méandres pour progresser d'à peine 2,8 en ligne droite dans
    une gorge calcaire, au sein du plus ancien parc de Pologne.
  de: >-
    Ein Fluss, der acht Kilometer lang Schleifen zieht, um in einer Kalkschlucht Luftlinie gerade einmal 2,8
    voranzukommen – im ältesten Nationalpark Polens.
  it: >-
    Un fiume che percorre otto chilometri di curve per avanzare di appena 2,8 in linea retta in una gola
    calcarea, nel parco più antico della Polonia.
  pt: >-
    Um rio que serpenteia oito quilómetros em curvas para avançar apenas 2,8 em linha reta numa garganta
    calcária, no parque mais antigo da Polónia.
observaciones:
  es: >-
    Los senderos no se limpian de hojas ni se quitan de nieve, y quien entra en la montaña lo hace bajo su
    responsabilidad. Quédate en las rutas señalizadas, que son las que permite el parque.
texto:
  es:
    intro: >-
      Entre los kilómetros 87 y 95 desde su nacimiento, el Dunajec hace algo extraño: recorre ocho kilómetros
      de curvas para avanzar en línea recta apenas 2,8. Lo hace encajado entre paredes de caliza, y ese cañón
      es el corazón del Parque Nacional de Pieniny, el primer parque nacional de Polonia, creado en 1932. A su
      alrededor, una cadena de unos 35 kilómetros de largo y hasta 6 de ancho reúne cumbres afiladas, paredes
      que bajan hasta 300 metros sobre el río y prados donde viven las mariposas, el búho real y el águila
      real.
    landscape: >-
      Todo empezó bajo el mar. Pieniny está hecho sobre todo de rocas del Jurásico y del Cretácico, cuando el
      territorio de los Cárpatos estaba cubierto por el océano; una de sus cuencas fue la cuenca pieninska,
      donde se depositaron capas de caliza nacidas de esqueletos de amonites, restos de crinoideos y
      microorganismos, acompañadas de pizarras, margas y areniscas. Hace unos 24 millones de años, las calizas
      volvieron a elevarse y quedaron comprimidas entre los bloques de los Cárpatos interior y exterior.


      Después llegó el río. El lento ascenso de Pieniny en el Cuaternario hizo que el Dunajec se encajara en
      la caliza y excavara la garganta actual. Entre Katy y Krościenko el nivel baja 45 metros. Las laderas
      del lado del Dunajec caen en paredes de caliza de hasta 300 metros; Sokolica, de 747 metros, y Czerteż,
      de 774, se alzan unos 300 sobre el agua. En Pieniny Właściwe, el macizo de Trzy Korony tiene su cima en
      Okrąglica, de 982 metros, y sus paredes altas y pedregales albergan flora y fauna únicas. En Jarmuta,
      los bloques de andesita son restos de actividad volcánica, la misma que originó las aguas minerales de
      Krościenko y Szczawnica.
    wildlife: >-
      Los prados de Pieniny son famosos por la diversidad de mariposas, y la más célebre es el apolo. Entre
      las plantas, la mostaza de Pieniny solo vive aquí, y el zapatito de dama, la más vistosa de las
      orquídeas locales, aparece en solo tres puntos del parque. En las laderas norte, sombrías y empinadas,
      crece el helecho lengua de ciervo, protegido. Hay prados de siega de montaña y pequeños tremedales
      alcalinos, además de canchales calcáreos y praderas alpinas y subalpinas.


      Entre las aves, Pieniny es una de las áreas más importantes de Polonia para el [búho
      real](/especie/bubo_bubo/), con 4 a 6 parejas, y forma parte desde hace años del área de cría del
      [águila real](/especie/aquila_chrysaetos/). El [pico dorsiblanco](/especie/dendrocopos_leucotos/)
      prefiere los bosques caducifolios y mixtos, y se registran tres o cuatro parejas al año. Junto al río
      aparece el [mirlo acuático](/especie/cinclus_cinclus/). Entre los mamíferos mayores hay tejón,
      [jabalí](/especie/sus_scrofa/), [ciervo](/especie/cervus_elaphus/), [lince](/especie/lynx_lynx/), [gato
      montés](/especie/felis_silvestris/), [marta](/especie/martes_martes/) y
      [corzo](/especie/capreolus_capreolus/). Las cuevas dan refugio a colonias de murciélagos en invierno.


      El Dunajec guarda 17 especies de peces; las más comunes son la boga (Chondrostoma nasus), el barbo
      común, el cacho y el tímalo. La [trucha](/especie/salmo_trutta/) de río y el [salmón del
      Danubio](/especie/hucho_hucho/) son hoy muy raros.
    visit: >-
      El sendero azul es la ruta clásica: sale del centro de visitantes de Czorsztyn, pasa por la cabaña del
      claro de Majerz y sube a la cima de Trzy Korony; a las dos horas y media de salir baja al claro de
      Kosarzyska, donde enlaza con el sendero verde. Otra ruta es el sendero amarillo desde Krościenko, que
      cruza el desfiladero Sobczański hasta Sromowce Niżne en unas dos horas y cuarenta y cinco minutos.


      Si quieres cruzar a Eslovaquia, la Droga Pienińska (sendero rojo) lleva hasta Červený Klastor; en el
      tramo hasta el monasterio es una senda didáctica con doce paneles en eslovaco e inglés. A pie, la
      frontera solo se cruza por la Pienińska Road, en Szczawnica, o por la pasarela de Sromowce Niżne.


      Para entender el lugar antes de caminarlo, la exposición de naturaleza de Krościenko trata de protección
      de la naturaleza, geología, arquitectura, etnografía y ecología, y tiene una maqueta de Pieniny.
    history: >-
      El parque se creó por decreto en 1932. El acuerdo con Checoslovaquia sobre la Carretera de Pieniny la
      reservó al turismo y al tráfico local y prohibió los coches y las lanchas a motor en el Dunajec.


      La conservación hoy tiene retos concretos. La bálsamina pequeña amenaza los hayedos calcáreos, el
      tránsito por los senderos puede dañar las raíces de los pinos silvestres que crecen sobre sustrato
      calcáreo, y el abandono de la agricultura tradicional deja que la vegetación cubra las plantas raras, de
      modo que hacen falta medidas activas.
    before: >-
      Los senderos no se limpian de hojas ni se quitan de nieve, y quien entra en la montaña lo hace bajo su
      responsabilidad. Quédate en las rutas señalizadas, que son las que permite el parque.
    around: >-
      El [Bosques Montanos del Beskid Sądecki y Valle del
      Poprad](/lugar/popradzki-park-krajobrazowy-beskid-sadecki/) queda a tres kilómetros. A dieciséis
      kilómetros están los [Tatras de Eslovaquia](/lugar/tatransky-narodny-park/) y a diecinueve los [Tatras
      de Polonia](/lugar/tatrzanski-park-narodowy/). Más lejos, otros cañones comparten con él su carácter de
      garganta y río: la [Garganta del Sagittario](/lugar/gole-del-sagittario/) comparte el [gato
      montés](/especie/felis_silvestris/), y el [Cañón Kárstico del Río
      Prača](/lugar/kanjon-rijeke-prace---pecina-govjestica/) el tímalo.
  en:
    intro: >-
      Between kilometres 87 and 95 from its source, the Dunajec does something extraordinary: it winds through
      eight kilometres of loops to advance barely 2.8 in a straight line. It does so locked between vertical
      limestone cliffs, and that gorge forms the heart of Pieniny National Park, Poland's first national park,
      created in 1932. Around it, a mountain chain roughly 35 kilometres long and up to 6 wide unites sharp
      pinnacles, precipices plunging 300 metres to the river, and species-rich meadows inhabited by
      butterflies, eagle owls and golden eagles.
    landscape: >-
      Everything began beneath the sea. The Pieniny are fashioned primarily from Jurassic and Cretaceous
      marine rocks, dating from when the Carpathian realm lay submerged under an ocean. In the Pieniny Klippen
      basin, deep beds of limestone accumulated from fossil ammonites, crinoid ossicles and marine
      microorganisms, layered with shales, marls and sandstones. Around 24 million years ago, these limestones
      were buckled and thrust upward, squeezed between the Inner and Outer Carpathian crustal blocks.


      Then arrived the river. The steady uplift of the Pieniny during the Quaternary forced the Dunajec to
      entrench itself into the limestone, carving the present gorge. Between Kąty and Krościenko the water
      drops 45 metres. Canyon walls along the Dunajec plummet up to 300 metres; Sokolica (747 metres) and
      Czerteż (774) tower some 300 above the river surface. In the Pieniny Właściwe, the Trzy Korony massif
      culminates at Okrąglica (982 metres), whose crags and screes harbor unique endemics. At Jarmuta,
      andesite outcrops attest to volcanic activity, the very phenomenon that birthed the mineral springs of
      Krościenko and Szczawnica.
    wildlife: >-
      The flower-rich meadows of Pieniny are renowned for their extraordinary butterfly diversity, none more
      famous than the Apollo butterfly. Among plants, the Pieniny wallflower is strictly endemic, while lady's
      slipper, the most striking native orchid, grows at only three locations in the park. Cool, shaded
      northern slopes harbor the protected hart's-tongue fern. Mountain hay meadows, small alkaline fens,
      calcareous screes and alpine-subalpine grasslands create a floral mosaic.


      Among birds, Pieniny is one of Poland's premier breeding strongholds for the [Eurasian
      eagle-owl](/especie/bubo_bubo/), hosting 4 to 6 pairs, and has long provided a traditional nesting
      territory for the [golden eagle](/especie/aquila_chrysaetos/). The [white-backed
      woodpecker](/especie/dendrocopos_leucotos/) favours deciduous and mixed slopes, with three to four pairs
      recorded annually. Dippers ([cinclo acuático](/especie/cinclus_cinclus/)) frequent the rushing
      riverbanks. Larger mammals include European badger, [wild boar](/especie/sus_scrofa/), [red
      deer](/especie/cervus_elaphus/), [Eurasian lynx](/especie/lynx_lynx/),
      [wildcat](/especie/felis_silvestris/), [European pine marten](/especie/martes_martes/) and [roe
      deer](/especie/capreolus_capreolus/). Limestone caverns shelter bat nursery colonies in winter.


      The Dunajec supports 17 fish species, led by common nase, barbel, chub and grayling. River [brown
      trout](/especie/salmo_trutta/) and [huchen](/especie/hucho_hucho/) (Danube salmon) are now very rare.
    visit: >-
      The blue trail offers the classic traverse: starting from Czorsztyn visitor centre, it passes the Majerz
      glade hut and ascends to the panoramic Trzy Korony summit; two and a half hours from the start it
      descends to Kosarzyska glade, intersecting the green trail. Another popular route is the yellow trail
      from Krościenko, which threads the Sobczański gorge to Sromowce Niżne in roughly two hours and
      forty-five minutes.


      To cross into Slovakia, the Droga Pienińska (red trail) leads along the river to Červený Kláštor; up to
      the historic monastery it functions as an educational nature trail with twelve information panels in
      Slovak and English. On foot, the international border may only be crossed along the Pienińska Road at
      Szczawnica or via the footbridge at Sromowce Niżne.


      To understand the landscape before hiking, the nature exhibition in Krościenko covers ecology, geology,
      local wooden architecture and ethnography, centered on a relief model of the Pieniny range.
    history: >-
      The national park was founded by decree in 1932. An international treaty with Czechoslovakia designated
      the Pienińska Road exclusively for tourism and local non-motorised traffic, prohibiting private
      automobiles and motorboats on the Dunajec.


      Modern conservation addresses specific ecological challenges. Invasive touch-me-not threatens limestone
      beechwoods, heavy trail traffic risks trampling the delicate roots of cliffside Scots pines, and rural
      abandonment permits shrub encroaching over rare sun-loving meadow plants, requiring targeted active
      management.
    before: >-
      Park trails are neither cleared of fallen leaves nor cleared of snow in winter, and entering the
      mountains is done under personal responsibility. Keep strictly to marked trails approved by park
      authorities.
    around: >-
      The [Beskid Sądecki Mountain Forests and Poprad
      Valley](/lugar/popradzki-park-krajobrazowy-beskid-sadecki/) lie three kilometres away. Sixteen
      kilometres away stand the [Slovak Tatras](/lugar/tatransky-narodny-park/) and nineteen kilometres the
      [Polish Tatras](/lugar/tatrzanski-park-narodowy/). Further afield, other canyons share this river-gorge
      character: the [Sagittario Gorge](/lugar/gole-del-sagittario/) shares the
      [wildcat](/especie/felis_silvestris/), while the [Prača River Karst
      Canyon](/lugar/kanjon-rijeke-prace---pecina-govjestica/) shares the grayling.
  fr:
    intro: >-
      Entre les kilomètres 87 et 95 depuis sa source, le Dunajec accomplit une trajectoire fascinante : il
      décrit huit kilomètres de méandres serrés pour progresser en ligne droite d'à peine 2,8. Il s'écoule
      enfermé entre de vertigineuses falaises calcaires, et ce canyon forme le cœur battant du parc national
      des Piénines, premier parc national de Pologne, fondé en 1932. Autour s'étire une chaîne d'environ 35
      kilomètres de long sur jusqu'à 6 de large, hérissée d'aiguilles rocheuses, de parois tombant de 300
      mètres vers le cours d'eau et de prairies fleuries où prospèrent papillons, grands-ducs et aigles
      royaux.
    landscape: >-
      Tout a commencé au fond des mers. Les Piénines sont formées de roches marines du Jurassique et du
      Crétacé, lorsque le domaine carpathique était submergé par l'océan. Dans le bassin sédimentaire piénin
      se sont déposées d'épaisses couches calcaires nées de coquilles d'ammonites, de crinoïdes et de
      micro-organismes, mêlées de marnes et de grès. Il y a environ 24 millions d'années, ces calcaires furent
      comprimés et soulevés entre les blocs carpathiques interne et externe.


      Puis survint la rivière. Le lent soulèvement des Piénines au Quaternaire contraignit le Dunajec à
      s'enfoncer dans les calcaires pour creuser la gorge actuelle. Entre Kąty et Krościenko, le dénivelé est
      de 45 mètres. Les parois rocheuses tombent à pic jusqu'à 300 mètres ; Sokolica (747 mètres) et Czerteż
      (774) dominent le cours d'eau d'environ 300 mètres. Dans les Piénines centrales, le massif des Trzy
      Korony culmine à Okrąglica (982 mètres), dont les falaises abritent une flore unique. À Jarmuta, des
      pointements d'andésite témoignent d'un volcanisme ancien, à l'origine des sources minérales de
      Krościenko et Szczawnica.
    wildlife: >-
      Les prairies de fauche des Piénines sont réputées pour leur abondance de papillons, au premier rang
      desquels brille l'apollon. Côté flore, la giroflée des Piénines est strictement endémique, tandis que le
      sabot de Vénus n'apparaît qu'en trois endroits du parc. Sur les versants septentrionaux frais et
      ombragés croît la scolopendre protégée. On y trouve prairies subalpines, pelouses calcicoles et petits
      marais alcalins.


      Pour l'avifaune, les Piénines représentent l'un des bastions majeurs en Pologne pour le [grand-duc
      d'Europe](/especie/bubo_bubo/), qui y compte de 4 à 6 couples, et hébergent de longue date l'[aigle
      royal](/especie/aquila_chrysaetos/). Le [pic à dos blanc](/especie/dendrocopos_leucotos/) affectionne
      les futaies feuillues, comptant trois ou quatre couples nicheurs chaque année. Le long des flots niche
      le [cincle plongeur](/especie/cinclus_cinclus/). Parmi les mammifères vivent blaireau,
      [sanglier](/especie/sus_scrofa/), [cerf élaphe](/especie/cervus_elaphus/), [lynx
      boréal](/especie/lynx_lynx/), [chat sauvage](/especie/felis_silvestris/), [martre des
      pins](/especie/martes_martes/) et [chevreuil](/especie/capreolus_capreolus/). Les cavités souterraines
      abritent d'importantes colonies de chauves-souris en hiver.


      Le Dunajec recense 17 espèces de poissons, menées par le nase, le barbeau, le chevesne et l'ombre
      commun. La [truite fario](/especie/salmo_trutta/) et le [saumon du Danube](/especie/hucho_hucho/) sont
      devenus très rares.
    visit: >-
      Le sentier bleu offre l'itinéraire le plus classique : partant du centre d'accueil de Czorsztyn, il
      longe la clairière de Majerz pour s'élever jusqu'au faîte panoramique des Trzy Korony ; deux heures et
      demie après le départ, il descend vers la clairière de Kosarzyska, où il rejoint le sentier vert. Le
      sentier jaune au départ de Krościenko traverse quant à lui la gorge de Sobczański jusqu'à Sromowce Niżne
      en environ deux heures et quarante-cinq minutes.


      Pour franchir la frontière slovaque, la Droga Pienińska (sentier rouge) longe la rivière jusqu'à Červený
      Kláštor ; jusqu'au monastère historique, c'est un sentier pédagogique doté de douze panneaux didactiques
      en slovaque et en anglais. À pied, la frontière ne peut être franchie que sur la route piénine à
      Szczawnica ou sur la passerelle de Sromowce Niżne.


      Pour préparer son séjour, l'exposition naturaliste de Krościenko présente géologie, ethnographie et
      protection des habitats, autour d'une maquette des Piénines.
    history: >-
      Le parc national a été créé par décret officiel en 1932. Une convention bilatérale pionnière avec la
      Tchécoslovaquie réserva la route des Piénines aux circulations douces et bannit bateaux à moteur et
      automobiles sur le cours du Dunajec.


      La gestion contemporaine fait face à des défis écologiques ciblés. La balsamine menace les hêtraies
      calcicoles, le piétinement fragilise les racines des pins sylvestres centenaires poussant sur les
      falaises rocheuses, et la déprise pastorale favorise l'enfrichement au détriment des héliophiles rares,
      justifiant des interventions actives.
    before: >-
      Les sentiers de montagne ne sont ni déneigés en hiver ni nettoyés de leurs feuilles mortes en automne,
      et chaque randonneur s'engage sous sa propre responsabilité. Tenez-vous rigoureusement aux cheminements
      balisés.
    around: >-
      Les [Forêts montagnardes du Beskid Sądecki et vallée du
      Poprad](/lugar/popradzki-park-krajobrazowy-beskid-sadecki/) se situent à trois kilomètres. À seize
      kilomètres s'élèvent les [Tatras de Slovaquie](/lugar/tatransky-narodny-park/) et à dix-neuf kilomètres
      les [Tatras de Pologne](/lugar/tatrzanski-park-narodowy/). Plus loin, d'autres forres partagent ce
      profil fluvial calcaire : les [Gorges du Sagittario](/lugar/gole-del-sagittario/) partagent le [chat
      sauvage](/especie/felis_silvestris/), et le [Canyon karstique de la rivière
      Prača](/lugar/kanjon-rijeke-prace---pecina-govjestica/) l'ombre commun.
  de:
    intro: >-
      Zwischen den Kilometern 87 und 95 ab seiner Quelle vollzieht der Dunajec etwas Ungewöhnliches: Er
      durchfließt acht Kilometer enger Windungen, um in direkter Luftlinie kaum 2,8 voranzukommen. Eingezwängt
      zwischen steilen Kalkfelsen bildet dieser Canyon das Herzstück des Nationalparks Pieninen, des ältesten
      Nationalparks Polens, gegründet 1932. Rundherum erstreckt sich eine etwa 35 Kilometer lange und bis zu 6
      breite Bergkette mit schroffen Felszacken, bis zu 300 Meter tief zum Fluss abfallenden Wänden und
      artenreichen Wiesen, auf denen Schmetterlinge, Uhus und Steinadler leben.
    landscape: >-
      Alles begann auf dem Meeresgrund. Die Pieninen bestehen vorwiegend aus jurassischen und kretazischen
      Kalksteinen, abgelagert als das Karpatengebiet von einem Urozean bedeckt war. Im Pieninischen
      Klippengürtel sedimentierten mächtige Schichten aus Ammonitenresten, Crinoiden und Mikroorganismen,
      überlagert von Schiefern, Mergeln und Sandsteinen. Vor rund 24 Millionen Jahren wurden diese
      Kalksteinschichten zwischen den Blöcken der Inneren und Äußeren Karpaten emporgepresst.


      Dann kam der Fluss. Die langsame Hebung der Pieninen im Quartär zwang den Dunajec, sich tief in den
      Kalkstein einzuschneiden und den heutigen Durchbruch zu schaffen. Zwischen Kąty und Krościenko fällt der
      Wasserspiegel um 45 Meter ab. Die Steilwände am Dunajec stürzen bis zu 300 Meter in die Tiefe; die
      Sokolica (747 Meter) und der Czerteż (774) ragen rund 300 Meter über das Wasser empor. Im zentralen
      Massiv Trzy Korony gipfelt die Okrąglica auf 982 Metern und birgt botanische Raritäten. Am Jarmuta
      zeugen Andesitkuppen von historischem Vulkanismus, der auch die Heilquellen von Krościenko und
      Szczawnica hervorbrachte.
    wildlife: >-
      Die Blumenwiesen der Pieninen sind berühmt für ihre Schmetterlingsvielfalt, allen voran der stattliche
      Rote Apollofalter. Unter den Pflanzen ist der Pieninen-Schöterich endemisch, während der seltene
      Frauenschuh nur an drei Standorten im Park vorkommt. An kühlen Nordhängen wächst der geschützte
      Hirschzungenfarn. Bergwiesen, Kalkschutthalden und alkalische Niedermoore bilden wertvolle Biotope.


      Unter den Vögeln sind die Pieninen eines der wichtigsten Brutgebiete Polens für den
      [Uhu](/especie/bubo_bubo/) mit 4 bis 6 Brutpaaren und traditioneller Nistplatz für den
      [Steinadler](/especie/aquila_chrysaetos/). Der [Weißrückenspecht](/especie/dendrocopos_leucotos/)
      bewohnt Laubmischwälder mit drei bis vier Paaren jährlich. Am Flusslauf jagt die
      [Wasseramsel](/especie/cinclus_cinclus/). An Säugern kommen Dachs, [Wildschwein](/especie/sus_scrofa/),
      [Rothirsch](/especie/cervus_elaphus/), [Luchs](/especie/lynx_lynx/),
      [Wildkatze](/especie/felis_silvestris/), [Baummarder](/especie/martes_martes/) und
      [Reh](/especie/capreolus_capreolus/) vor. Karsthöhlen dienen Fledermäusen im Winter als Quartier.


      Im Dunajec leben 17 Fischarten, dominiert von Nase, Barbe, Döbel und Äsche.
      [Bachforelle](/especie/salmo_trutta/) und [Huchen](/especie/hucho_hucho/) sind heute sehr selten
      geworden.
    visit: >-
      Der blaue Wanderweg gilt als Klassiker: Vom Besucherzentrum in Czorsztyn führt er über die Lichtung
      Majerz zum Aussichtsgipfel Trzy Korony; nach zweieinhalb Stunden senkt er sich zur Lichtung Kosarzyska
      und trifft auf den grünen Pfad. Der gelbe Weg ab Krościenko quert die Sobczański-Schlucht nach Sromowce
      Niżne in rund zwei Stunden und fünfundvierzig Minuten.


      Für den Grenzübertritt nach der Slowakei folgt die Droga Pienińska (roter Weg) dem Flussufer zum Roten
      Kloster (Červený Kláštor); dieser Abschnitt ist als Lehrpfad mit zwölf zweisprachigen Tafeln gestaltet.
      Zu Fuß darf die Staatsgrenze nur auf der Pienińska-Straße bei Szczawnica oder auf der Fußgängerbrücke in
      Sromowce Niżne überschritten werden.


      Die Naturausstellung in Krościenko erläutert Geologie, Volkskunde und Naturschutzkonzepte anhand eines
      plastischen Reliefmodells der Pieninen.
    history: >-
      Der Nationalpark wurde 1932 durch Ministerialerlass ins Leben gerufen. Ein frühes zwischenstaatliches
      Abkommen mit der Tschechoslowakei reservierte die Pieninen-Straße für Wanderer und Anwohner und
      untersagte Autos sowie Motorboote auf dem Dunajec.


      Heutige Naturschutzziele verlangen gezieltes Eingreifen. Das Kleine Springkraut bedrängt
      Kalkbuchenwälder, Trittbelastung schädigt die Wurzeln urwüchsiger Waldkiefern an Felskanten, und die
      Aufgabe traditioneller Wiesenmahd führt zu Verbuschung, sodass Biotoppflege erforderlich bleibt.
    before: >-
      Wanderwege werden im Winter nicht geräumt und im Herbst nicht von Laub befreit; das Begehen des Gebirges
      erfolgt stets auf eigene Verantwortung. Bleiben Sie auf den ausgewiesenen Routen.
    around: >-
      Die [Bergwälder der Beskid Sądecki und Poprad-Tal](/lugar/popradzki-park-krajobrazowy-beskid-sadecki/)
      liegen drei Kilometer entfernt. Sechzehn Kilometer entfernt erheben sich die [Slowakische
      Tatra](/lugar/tatransky-narodny-park/) und neunzehn Kilometer die [Polnische
      Tatra](/lugar/tatrzanski-park-narodowy/). Weiter entfernt teilen andere Klammen diesen Charakter: Die
      [Sagittario-Schlucht](/lugar/gole-del-sagittario/) teilt die [Wildkatze](/especie/felis_silvestris/),
      und der [Prača-Canyon](/lugar/kanjon-rijeke-prace---pecina-govjestica/) die Äsche.
  it:
    intro: >-
      Tra i chilometri 87 e 95 dalla sorgente, il Dunajec compie un percorso singolare: compie otto chilometri
      di curve serrate per avanzare in linea retta di appena 2,8. Scorre incassato tra pareti calcaree
      verticali, e quel canyon è il cuore del Parco nazionale dei Pienini, il primo parco nazionale istituito
      in Polonia nel 1932. Attorno a esso, una catena montuosa lunga circa 35 chilometri e larga fino a 6
      unisce creste dirupate, pareti che precipitano per 300 metri sul fiume e praterie ricche di farfalle,
      gufi reali e aquile reali.
    landscape: >-
      Tutto è cominciato sui fondali marini. I Pienini sono composti da rocce del Giurassico e Cretacico,
      deposte quando i Carpazi erano sommersi dall'oceano. Nel bacino delle klippen pienine si accumularono
      bancate calcaree formate da gusci di ammoniti, crinoidi e microrganismi, assieme a marne e arenarie.
      Circa 24 milioni di anni fa, questi calcari furono compressi e sollevati tra i blocchi carpatici interni
      ed esterni.


      Poi giunse il corso d'acqua. Il progressivo sollevamento quaternario costrinse il Dunajec a incidere le
      rocce calcaree, scavando la forra attuale. Tra Kąty e Krościenko il dislivello d'acqua scende di 45
      metri. I versanti prospicienti il Dunajec precipitano in pareti calcaree alte fino a 300 metri; la
      Sokolica (747 metri) e il Czerteż (774) torreggiano per circa 300 metri sulle acque. Nel settore dei
      Pienini Centrali, il massiccio delle Trzy Korony culmina nell'Okrąglica (982 metri), custode di flora
      rupicola relitta. A Jarmuta emergono filoni andesitici vulcanici, responsabili delle sorgenti minerali
      di Krościenko e Szczawnica.
    wildlife: >-
      I prati montani dei Pienini sono celebri per la ricchezza di lepidotteri, dominati dal magnifico apollo.
      Tra le specie vegetali, la senape dei Pienini è un endemismo esclusivo, mentre la pianella della Madonna
      cresce in tre soli settori del parco. Lungo le fresche pendici settentrionali prospera la lingua di
      cervo protetta. Si alternano praterie da sfalcio, piccole torbiere alcaline e ghiaioni calcarei.


      Per l'avifauna, i Pienini sono tra i baluardi polacchi per il [gufo reale](/especie/bubo_bubo/), forte
      di 4-6 coppie riproduttive, e costituiscono sito storico per l'[aquila
      reale](/especie/aquila_chrysaetos/). Il [picchio dorsobianco](/especie/dendrocopos_leucotos/) predilige
      le faggete, con tre o quattro coppie l'anno. Lungo il fiume caccia il [merlo
      acquaiolo](/especie/cinclus_cinclus/). Tra i mammiferi si segnalano tasso,
      [cinghiale](/especie/sus_scrofa/), [cervo nobile](/especie/cervus_elaphus/),
      [lince](/especie/lynx_lynx/), [gatto selvatico](/especie/felis_silvestris/),
      [martora](/especie/martes_martes/) e [capriolo](/especie/capreolus_capreolus/). Le grotte ospitano
      colonie di pipistrelli durante il riposo invernale.


      Il Dunajec accoglie 17 specie ittiche, tra cui naso, barbo, cavedano e temolo. La [trota
      fario](/especie/salmo_trutta/) e il [salmone del Danubio](/especie/hucho_hucho/) sono divenuti molto
      rari.
    visit: >-
      Il sentiero blu è l'itinerario più rinomato: muovendo dal centro visite di Czorsztyn attraversa la
      radura di Majerz e sale alle Tre Corone; a due ore e mezza dalla partenza ridiscende alla radura di
      Kosarzyska connettendosi al tracciato verde. Il sentiero giallo da Krościenko percorre la forra di
      Sobczański fino a Sromowce Niżne in due ore e quarantacinque minuti.


      Per entrare in Slovacchia, la Droga Pienińska (sentiero rosso) costeggia il fiume fino a Červený
      Kláštor; fino al monastero funge da percorso didattico con dodici pannelli esplicativi in slovacco e
      inglese. A piedi la frontiera può essere varcata unicamente lungo la via fluviale a Szczawnica o tramite
      la passerella pedonale a Sromowce Niżne.


      Il centro naturalistico di Krościenko offre un quadro d'insieme su geologia, costumi ed ecosistemi
      grazie a un plastico in rilievo dei Pienini.
    history: >-
      Il parco nazionale venne sancito per decreto governativo nel 1932. Uno storico accordo bilaterale con la
      Cecoslovacchia riservò la strada dei Pienini al transito turistico a piedi, vietando auto e natanti a
      motore nel tratto fluviale.


      La salvaguardia moderna affronta sfide specifiche. La balsamina minaccia i boschi calcarei, l'eccessivo
      calpestio espone le radici dei pini silvestri arroccati sui crinali rocciosi, e l'abbandono dei pascoli
      favorisce specie infestanti a scapito delle erbe alpine rare.
    before: >-
      I sentieri montani non vengono sgomberati dalla neve in inverno né ripuliti dal fogliame in autunno:
      ogni escursione avviene a proprio rischio. Si raccomanda di rimanere sui tracciati segnalati.
    around: >-
      I [Boschi montani del Beskid Sądecki e valle del
      Poprad](/lugar/popradzki-park-krajobrazowy-beskid-sadecki/) distano tre chilometri. A sedici chilometri
      si trovano i [Tatra della Slovacchia](/lugar/tatransky-narodny-park/) e a diciannove i [Tatra della
      Polonia](/lugar/tatrzanski-park-narodowy/). Più lontano, altre forre condividono questo connubio di
      acque e pareti: le [Gole del Sagittario](/lugar/gole-del-sagittario/) condividono il [gatto
      selvatico](/especie/felis_silvestris/), e il [Canyon del fiume
      Prača](/lugar/kanjon-rijeke-prace---pecina-govjestica/) il temolo.
  pt:
    intro: >-
      Entre os quilómetros 87 e 95 a partir da nascente, o Dunajec traça um rumo singular: descreve oito
      quilómetros de meandros apertados para avançar em linha reta escassos 2,8. Percorre este trajeto
      entalado entre muralhas calcárias, formando o coração do Parque Nacional Pieniny, o primeiro parque
      nacional da Polónia, fundado em 1932. Em redor, uma crista com cerca de 35 quilómetros de extensão e até
      6 de largura reúne agulhas afiadas, abismos que caem 300 metros sobre a corrente e prados floridos onde
      convivem borboletas, bufos-reais e águias-reais.
    landscape: >-
      Tudo principiou no leito oceânico. Os Pieniny são formados sobretudo por rochas marinhas do Jurássico e
      Cretáceo, de quando a região carpatiana estava imersa num antigo oceano. Na bacia de Klippen
      acumularam-se bancadas calcárias originadas por amonites, crinoides e microrganismos marinhos,
      intercaladas com margas e arenitos. Há cerca de 24 milhões de anos, estas rochas foram comprimidas e
      soerguidas entre os blocos dos Cárpatos internos e externos.


      Depois sobreveio o rio. O soerguimento no Quaternário forçou o Dunajec a escavar profundamente os
      calcários, esculpindo a garganta atual. Entre Kąty e Krościenko o leito desce 45 metros. As encostas
      rochosas precipitam-se até 300 metros de altura; Sokolica (747 metros) e Czerteż (774) elevam-se cerca
      de 300 metros sobre o rio. No setor de Pieniny Właściwe, o maciço Trzy Korony culmina em Okrąglica (982
      metros), cujas fendas acolhem flora rara. Em Jarmuta, afloramentos andesíticos testemunham vulcanismo
      passado, o mesmo que mineralizou as termas de Krościenko e Szczawnica.
    wildlife: >-
      Os prados dos Pieniny ostentam prodigiosa diversidade de borboletas, encabeçada pela apolo. Entre as
      plantas, o aldrabão-dos-pieniny é estritamente endémico, enquanto o sapatinho-de-vênus surge em três
      locais isolados no parque. Nas encostas viradas a norte viceja a língua-de-cervo protegida. Estendem-se
      prados de feno, turfeiras alcalinas e cascalheiras calcárias.


      Na ornitologia, os Pieniny constituem um refúgio fulcral na Polónia para o
      [bufo-real](/especie/bubo_bubo/), congregando 4 a 6 casais, e albergam a tradicional
      [águia-real](/especie/aquila_chrysaetos/). O [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/)
      ocupa as matas caducifólias com três a quatro casais anuais. Junto à corrente pesca o
      [melro-d'água](/especie/cinclus_cinclus/). Entre os mamíferos contam-se texugo,
      [javali](/especie/sus_scrofa/), [veado-vermelho](/especie/cervus_elaphus/),
      [lince](/especie/lynx_lynx/), [gato-bravo](/especie/felis_silvestris/), [marta](/especie/martes_martes/)
      e [corço](/especie/capreolus_capreolus/). Cavernas calcárias servem de hibernáculo a morcegos.


      O Dunajec abriga 17 espécies de peixes, com predomínio de boga, barbo, escalo e tímalo. A
      [truta-fario](/especie/salmo_trutta/) e o [salmão-do-danúbio](/especie/hucho_hucho/) tornaram-se raros.
    visit: >-
      O trilho azul proporciona o clássico circuito: saindo do centro de acolhimento de Czorsztyn, contorna o
      prado de Majerz e sobe ao cume das Trzy Korony; duas horas e meia após a partida desce à clareira de
      Kosarzyska, ligando-se ao trilho verde. O percurso amarelo a partir de Krościenko cruza o desfiladeiro
      de Sobczański até Sromowce Niżne em cerca de duas horas e quarenta e cinco minutos.


      Para passar à Eslováquia, a Droga Pienińska (trilho vermelho) acompanha a margem até Červený Kláštor; no
      troço ribeirinho funciona como percurso temático com doze painéis interpretativos. A pé, a fronteira só
      pode ser transposta na estrada em Szczawnica ou na ponte pedonal de Sromowce Niżne.


      O centro de interpretação de Krościenko proporciona visão detalhada da geologia, ecologia e tradições
      locais através de uma maquete tridimensional dos Pieniny.
    history: >-
      O parque nacional foi criado por decreto em 1932. Um acordo bilateral pioneiro com a Checoslováquia
      reservou a estrada dos Pieniny ao recreio pedonal, banindo veículos a motor e barcos a motor no rio
      Dunajec.


      A preservação atual enfrenta desafios específicos. O não-me-toques ameaça os faiais calcários, o
      pisoteio descalça as raízes dos pinheiros-silvestres suspensos nas escarpas, e a perda da pastorícia
      tradicional induz matos que asfixiam plantas raras, exigindo gestão ativa.
    before: >-
      As veredas de montanha não são limpas de neve no inverno nem de folhagem no outono; a circulação faz-se
      sob responsabilidade do visitante. Mantenha-se estritamente nas rotas assinaladas.
    around: >-
      As [Florestas de montanha do Beskid Sądecki e vale do
      Poprad](/lugar/popradzki-park-krajobrazowy-beskid-sadecki/) ficam a três quilómetros. A dezasseis
      quilómetros erguem-se os [Tatras da Eslováquia](/lugar/tatransky-narodny-park/) e a dezanove os [Tatras
      da Polónia](/lugar/tatrzanski-park-narodowy/). Mais longe, outras gargantas partilham este perfil: as
      [Gargantas do Sagittario](/lugar/gole-del-sagittario/) partilham o
      [gato-bravo](/especie/felis_silvestris/), e o [Canhão cársico do rio
      Prača](/lugar/kanjon-rijeke-prace---pecina-govjestica/) o tímalo.
