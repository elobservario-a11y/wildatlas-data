resumen:
  es: >-
    Alberga el pinar de pino silvestre (*Pinus sylvestris*) más septentrional del planeta (Stabbursnes),
    encajado a 70° N en la costa del fiordo de Porsanger.
  en: >-
    Shelters the northernmost Scots pine forest (*Pinus sylvestris*) on Earth (Stabbursnes), tucked at 70° N
    along the shores of Porsangerfjorden.
  fr: >-
    Abrite la pinède de pin sylvestre (*Pinus sylvestris*) la plus septentrionale de la planète (Stabbursnes),
    nichée à 70° N sur les rives du Porsangerfjorden.
  de: >-
    Beherbergt den nördlichsten Waldkiefernwald (*Pinus sylvestris*) der Erde (Stabbursnes), eingebettet auf
    70° N an den Ufern des Porsangerfjorden.
  it: >-
    Custodisce la pineta di pino silvestre (*Pinus sylvestris*) più settentrionale del pianeta (Stabbursnes),
    incastonata a 70° N sulle sponde del Porsangerfjorden.
  pt: >-
    Abriga o pinhal de pinheiro-silvestre (*Pinus sylvestris*) mais setentrional do planeta (Stabbursnes),
    aninhado a 70° N na costa do Porsangerfjorden.
unico:
  es: Aquí sobrevive el pinar más septentrional del mundo, un resto de cuando el clima fue más cálido.
  en: Here survives the world's northernmost pine forest, an ancient relict from a warmer post-glacial climate.
  fr: >-
    Ici survit la pinède la plus septentrionale du monde, vestige d'une époque où le climat était plus
    clément.
  de: Hier überlebt der nördlichste Kiefernwald der Welt, ein Relikt aus einer wärmeren Nacheiszeit.
  it: Qui resiste la pineta più a nord del mondo, un relitto risalente a un'era postglaciale più mite.
  pt: >-
    Aqui sobrevive o pinhal mais setentrional do mundo, uma relíquia viva de uma época em que o clima foi mais
    temperado.
observaciones:
  es: >-
    Puedes ir a pie o en esquís por donde quieras y acampar, llevándote la basura. Hay prohibición general de
    fuego en el bosque del 15 de abril al 15 de septiembre. Los perros van atados del 1 de abril al 20 de
    agosto.
texto:
  es:
    intro: >-
      A casi 70° de latitud norte, donde el viento frío recorta todo lo que crece, un valle resguardado guarda
      un bosque que no debería estar ahí. Son pinos bajos, achaparrados, de hasta 500 años, y forman el pinar
      más septentrional del mundo. El Parque Nacional de Stabbursdalen rodea el río Stabburselva y su valle,
      al oeste del Porsangerfjorden, en Finnmark. Nació en 1970 para proteger unos 98 km² de bosque junto al
      río y en 2002 se amplió hasta 747 km².
    landscape: >-
      El pinar tiene una historia. Hace miles de años el clima era más cálido y el pino se extendía muy tierra
      adentro. Al enfriarse, el bosque retrocedió y solo aguantó en valles resguardados como este.
      Stabbursdalen queda casi perpendicular al Porsangerfjorden, protegido del viento frío del mar por
      montañas al norte, y eso explica que el bosque se salvara aquí. Es abierto, de árboles bajos y
      achaparrados, y el suelo seco y pobre solo sostiene un sotobosque de líquenes y brezo.


      El valle cambia de carácter río abajo. Arriba, el paisaje es abierto, con abedular junto al río. Después
      se estrecha entre laderas de abedular frondoso, y en Stabbursfossen se abre y el río se rodea de pinar.
      Dentro del pinar el valle se cierra en un cañón con cascadas, rápidos y grandes salientes pulidos, de
      cuando el río llevaba el deshielo de toda Finnmark interior. La parte baja es una meseta a 60-70 m. En
      Luobbal (Lompola), los humedales forman un oasis fértil en un paisaje por lo demás árido.


      Al sureste, las montañas de Gáissene contrastan con el resto. El grupo incluye Čohkarášša, de 1139 m, la
      cumbre más alta de esta parte de Finnmark. Son mantos de corrimiento: restos de grandes placas de fondo
      marino empujadas sobre la tierra hace entre 400 y 600 millones de años.
    wildlife: >-
      Stabbursdalen es el límite norte de muchas especies. El [urogallo](/especie/tetrao_urogallus/) tiene
      aquí la población más septentrional del mundo, y el arrendajo siberiano, la ardilla y el konglebit
      también alcanzan su límite en el pinar. El [gallo lira](/especie/tetrao_tetrix/) y el [águila
      pescadora](/especie/pandion_haliaetus/) también. Los humedales son zona de cría, sobre todo de patos.


      Entre los mamíferos son comunes el [alce](/especie/alces_alces/), el reno doméstico y el
      [glotón](/especie/gulo_gulo/).


      En la desembocadura del río está la reserva natural de Stabbursnes, una de las zonas húmedas más
      importantes de Noruega para las aves, con 23 especies de anátidas, seis de ellas gansos, y 25 de
      limícolas. Tiene especial importancia para el escaso ganso chico, que descansa allí durante la migración
      de primavera y otoño. Hay un refugio de observación al sur de Stabbursneset, con vistas a Valdakmyra.
    visit: >-
      El parque se prepara para un senderismo sencillo, con senderos, cabañas y gammes abiertas. Se aparca
      junto al comedero de aves de Lombola, y desde el aparcamiento al final de la Lombolaveien salen los
      senderos principales. El más corto, de menos de 1 km, lleva a Rørkulpen, un rincón del pinar junto al
      río con fogata y bancos. El de Stabbursfossen mide unos 5,5 km, por pinar, abedular y llanuras abiertas,
      y con suerte verás saltar al salmón. El de Stuorra Biŋalvárri, cumbre del límite del parque, tiene unos
      7,5 km por trayecto, con desnivel, de 60 a 528 m, y ofrece vistas al valle, a Stabbursneset y al
      Porsangerfjorden. Para una travesía larga, la ruta Okselv–Stabbursnes pasa por la gamma abierta de
      Bastingammen y por la cabaña Ivarstua; de Ivarstua a Stabbursnes son unos 25 km.


      El comedero de aves de la entrada principal recibe de forma habitual carboneros lapones, arrendajos
      siberianos, carboneros comunes y ardillas. En verano se llega en coche; en invierno son 7 km en esquís o
      raquetas.


      El Stabbursnes Naturhus og Museum ofrece una exposición sobre los distintos hábitats de Finnmark, de la
      meseta a la costa, y la cultura asociada, con un apartado al reno y a la ganadería sami tradicional.
    history: >-
      Para los sami costeros, los recursos de Stabbursdalen fueron parte esencial de su sustento. En Lompola
      se segaba antes la carriza como forraje de invierno, y la madera para barcos y casas se bajaba flotando
      por el Stabburselva; el uso cuidadoso dejó pocas huellas. Quedan fosos de trampa de la caza del reno
      salvaje, que en el siglo XVII dio paso a la cría de reno doméstico. En la religión sami anterior al
      cristianismo, el paisaje ocupaba un lugar central y algunos montes, lagos y piedras de ofrenda se
      consideraban sagrados.


      Un misionero bautizó el valle en el siglo XVIII como «Tabors dal», por el monte Tabor; una etimología
      popular lo convirtió en Stabbursdalen. La protección busca conservar un gran espacio natural casi sin
      infraestructuras, con una parte del pinar más septentrional del mundo.
    before: >-
      Puedes ir a pie o en esquís por donde quieras y acampar, llevándote la basura. Hay prohibición general
      de fuego en el bosque del 15 de abril al 15 de septiembre. Los perros van atados del 1 de abril al 20 de
      agosto.
    around: >-
      Stabbursdalen no tiene vecinos cercanos en el atlas. Más lejos, el [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) y el [Parque Nacional de
      Gutulia](/lugar/gutulia-national-park/) comparten con él el alce, el oso pardo y el arrendajo siberiano,
      y los bosques primarios.
  en:
    intro: >-
      At nearly 70° north latitude, where arctic winds clip back almost everything that grows, a sheltered
      glacial valley protects a forest that seemingly defies the elements. These are low, gnarled Scots pines
      up to 500 years old, forming the northernmost pine forest in the world. Stabbursdalen National Park
      flanks the Stabburselva river and its valley west of Porsangerfjorden in Finnmark. It was established in
      1970 to protect some 98 km² of riverside pine woodland, and in 2002 it was expanded to 747 km².
    landscape: >-
      The pine forest tells a paleoclimatic story. Thousands of years ago, when the post-glacial climate was
      warmer, pine forests extended far into the interior. As temperatures cooled, the forest retreated,
      persisting only in protected microclimatic valleys like this one. Stabbursdalen lies almost
      perpendicular to Porsangerfjorden, shielded from freezing maritime winds by northern mountain ranges,
      explaining how the trees survived here. The canopy is open and stunted, where dry, nutrient-poor
      podzolic soils support a sparse understory of lichens and heather.


      The valley shifts character as you follow the river downstream. High up, the landscape is open tundra
      with mountain birch along the water. It then narrows between birch-clad canyon slopes before broadening
      at Stabbursfossen where the river enters primeval pine woods. Within the pine zone, the valley deepens
      into a ravine with waterfalls, rapids, and glacially polished bedrock from the era when the river
      carried the meltwater of all inland Finnmark. Downstream lies a terrace plateau at 60-70 m elevation. At
      Luobbal (Lompola), wide river wetlands form a lush oasis amidst an otherwise arid arctic terrain.


      To the southeast, the rugged massifs of Gáissene provide dramatic relief. The range culminates in
      Čohkarášša at 1139 m, the highest peak in this part of Finnmark. These mountains represent geological
      thrust nappes: remnants of ancient seabed slabs thrust over the mainland between 400 and 600 million
      years ago.
    wildlife: >-
      Stabbursdalen marks the northern range limit for numerous boreal species. The [western
      capercaillie](/especie/tetrao_urogallus/) maintains its northernmost global population here, while the
      Siberian jay, red squirrel, and pine grosbeak also reach their geographic limits in these pines. [Black
      grouse](/especie/tetrao_tetrix/) and [osprey](/especie/pandion_haliaetus/) breed here as well. The
      wetlands provide vital nesting grounds, especially for diving ducks.


      Among mammals, [moose](/especie/alces_alces/), semi-domesticated reindeer, and
      [wolverine](/especie/gulo_gulo/) are widespread.


      At the river mouth lies the Stabbursnes Nature Reserve, one of Norway's premier coastal wetland
      complexes for waterbirds, sheltering 23 species of waterfowl, six of them geese, and 25 wader species.
      It is of international importance as a staging stopover for the threatened lesser white-fronted goose
      during spring and autumn passage. An observation hide south of Stabbursneset overlooks the extensive
      saltmarsh of Valdakmyra.
    visit: >-
      The park is set up for straightforward hiking, featuring waymarked trails, wilderness cabins, and open
      traditional turf huts (gammes). Visitors park near the bird-feeding station at Lombola, with main
      trailheads starting from the car park at the end of Lombolaveien. The shortest trail, under 1 km, leads
      to Rørkulpen, a picturesque bend in the pine woods by the river with a campfire ring and benches. The
      Stabbursfossen trail runs for roughly 5.5 km through pine, birch, and open terraces, where lucky
      visitors can spot jumping salmon. The trail to Stuorra Biŋalvárri, a fell on the park boundary, measures
      about 7.5 km each way with an ascent from 60 to 528 m, offering expansive views over the valley,
      Stabbursneset, and Porsangerfjorden. For a wilderness trek, the Okselv–Stabbursnes route passes the open
      turf shelter Bastingammen and the cabin Ivarstua; from Ivarstua to Stabbursnes is roughly 25 km.


      The bird feeder at the main entrance regularly attracts Siberian tits, Siberian jays, great tits, and
      squirrels. In summer access is by car; in winter reaching the trailheads requires 7 km on skis or
      snowshoes.


      The Stabbursnes Naturhus and Museum features exhibits on Finnmark's habitats from arctic coast to inland
      plateau, along with Sami culture and traditional reindeer husbandry.
    history: >-
      For coastal Sami communities, the natural resources of Stabbursdalen were vital for survival. At
      Lompola, sedges were cut as winter fodder for cattle, and timber for boats and dwellings was floated
      down the Stabburselva; sustainable use left few visible scars. Pitfall trap systems survive from ancient
      wild reindeer hunting, which during the XVII century transitioned into semi-domestic reindeer herding.
      In pre-Christian Sami religion, mountains, lakes, and sacrificial stones (sieidi) were revered as
      sacred.


      A missionary named the valley «Tabors dal» in the XVIII century after Mount Tabor; local linguistic
      evolution transformed it into Stabbursdalen. Modern preservation aims to safeguard an expansive roadless
      wilderness with the northernmost pine forest on Earth.
    before: >-
      You are free to hike and ski anywhere and camp responsibly, carrying out all litter. A general ban on
      open fires in forests applies from 15 April to 15 September. Dogs must be kept on a leash from 1 April
      to 20 August.
    around: >-
      Stabbursdalen has no adjacent neighbors in the atlas. Farther away, [Urho Kekkonen National
      Park](/lugar/urho-kekkonen-national-park/) in Finland and [Gutulia National
      Park](/lugar/gutulia-national-park/) in Norway share ancient pine taiga, moose, brown bear, and Siberian
      jays.
  fr:
    intro: >-
      À près de 70° de latitude nord, là où les rafales polaires rabougrissent la végétation, une vallée
      abritée recèle une forêt qui défie les lois climatiques. Ce sont des pins sylvestres trapus, vieux de
      près de 500 ans, formant la pinède la plus septentrionale du monde. Le parc national de Stabbursdalen
      encadre la rivière Stabburselva et sa vallée à l'ouest du Porsangerfjorden, dans le Finnmark. Créé en
      1970 pour protéger environ 98 km² de boisements bordant la rivière, il a été étendu en 2002 à 747 km².
    landscape: >-
      Cette pinède raconte l'histoire du climat boréal. Il y a des milliers d'années, le climat plus chaud
      permettait au pin sylvestre de coloniser l'intérieur des terres. Lors du refroidissement, la forêt a
      reculé pour ne subsister que dans des vallées encaissées comme celle-ci. Orientée perpendiculairement au
      Porsangerfjorden et protégée des vents marins par les massifs du nord, Stabbursdalen a permis aux arbres
      de survivre. La futaie est claire et basse, sur des sols podzoliques arides couverts de lichens et de
      bruyères.


      Le cours d'eau métamorphose le paysage. En amont, le relief s'ouvre sur des toundras bordées de
      bouleaux. Puis la vallée se resserre en gorges boisées avant de s'élargir à Stabbursfossen où les pins
      ceinturent la rivière. Plus bas, le cours d'eau s'encaisse dans un canyon ponctué de cascades et de
      roches polies par les crues de fonte qui drainaient jadis le Finnmark intérieur. La section aval forme
      un plateau à 60-70 m d'altitude. À Luobbal (Lompola), les zones humides créent une oasis fertile au cœur
      d'un environnement aride.


      Au sud-est, le massif des Gáissene impose son relief austère, culminant au Čohkarášša à 1139 m, plus
      haut sommet de cette partie du Finnmark. Ces montagnes forment des nappes de charriage océaniques
      soulevées et poussées sur le continent il y a entre 400 et 600 millions d'années.
    wildlife: >-
      Stabbursdalen représente la limite septentrionale de nombreuses espèces boréales. Le [grand
      tétras](/especie/tetrao_urogallus/) y possède la population la plus nordique du monde, tout comme le
      mésangeai imitateur, l'écureuil roux et le durbec des sapins. Le [tétras lyre](/especie/tetrao_tetrix/)
      et le [balbuzard pêcheur](/especie/pandion_haliaetus/) y nichent également. Les zones humides offrent
      d'excellents sites de reproduction, en particulier pour les canards plongeurs.


      Parmi les mammifères, l'[élan](/especie/alces_alces/), les rennes d'élevage et le
      [glouton](/especie/gulo_gulo/) sont réguliers.


      À l'embouchure fluviale s'étend la réserve naturelle de Stabbursnes, l'une des zones humides littorales
      les plus réputées de Norvège pour l'avifaune, accueillant 23 espèces d'anatidés, six d'entre elles étant
      des oies, et 25 de limicoles. C'est une escale migratoire capitale pour la rare oie naine en route vers
      le grand Nord. Un observatoire au sud de Stabbursneset donne sur les marais salés de Valdakmyra.
    visit: >-
      Le parc est aménagé pour une randonnée accessible, doté de sentiers balisés, de cabanes et d'abris
      traditionnels ouverts (gammes). On stationne près du poste d'observation ornithologique de Lombola,
      point de départ des sentiers au bout de la Lombolaveien. Le tracé le plus court, moins de 1 km, mène à
      Rørkulpen, une crique bordée de pins avec bancs et foyer. La boucle de Stabbursfossen fait environ 5,5
      km à travers pinède et bouleau, avec l'occasion d'apercevoir les saumons franchir la chute. Le sentier
      de Stuorra Biŋalvárri, sommet en limite de parc, compte environ 7,5 km aller simple avec un dénivelé de
      60 à 528 m, offrant une vue splendide sur la vallée et le fjord. Pour une grande traversée, la liaison
      Okselv–Stabbursnes passe par l'abri de Bastingammen et le refuge d'Ivarstua ; d'Ivarstua à Stabbursnes
      on compte environ 25 km.


      La mangeoire à oiseaux de l'entrée attire mésanges lapones, mésangeais, mésanges charbonnières et
      écureuils. En été l'accès se fait en voiture ; en hiver l'approche exige 7 km à ski ou en raquettes.


      Le musée Stabbursnes Naturhus présente les écosystèmes du Finnmark et la culture de l'élevage de rennes
      samie.
    history: >-
      Pour les Samis côtiers, les ressources de Stabbursdalen furent au cœur de la subsistance quotidienne. À
      Lompola on fauchait la laîche pour le bétail, et les grumes descendaient la rivière par flottage ; cette
      exploitation raisonnée a laissé peu de stigmates. Des fosses de piégeage témoignent de la chasse
      ancienne au renne sauvage, remplacée au XVIIe siècle par l'élevage du renne domestique. Dans la religion
      samie préchrétienne, reliefs et blocs d'offrandes étaient sacrés.


      Un missionnaire baptisa la vallée «Tabors dal» au XVIIIe siècle en référence au mont Thabor ; une
      déformation linguistique en a fait Stabbursdalen. La protection actuelle vise à conserver un vaste
      espace sauvage boréal abritant la pinède la plus septentrionale de la Terre.
    before: >-
      Vous pouvez circuler librement à pied ou à ski et bivouaquer, en remportant tous vos déchets. Les feux
      en forêt sont strictement interdits du 15 avril au 15 septembre. Les chiens doivent être tenus en laisse
      du 1 avril au 20 août.
    around: >-
      Stabbursdalen n'a aucun voisin direct dans l'atlas. Plus loin, le [parc national Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) en Finlande et le [parc national de
      Gutulia](/lugar/gutulia-national-park/) en Norvège partagent de vieilles forêts boréales, l'élan, l'ours
      brun et le mésangeai imitateur.
  de:
    intro: >-
      Auf fast 70° nördlicher Breite, wo eisige Polarstürme die Vegetation stutzen, bewahrt ein geschütztes
      Tal einen Kiefernwald, der hier eigentlich nicht existieren dürfte. Es sind knorrige, niedrige
      Waldkiefern, bis zu 500 Jahre alt, die den nördlichsten Kiefernwald unseres Planeten bilden. Der
      Stabbursdalen-Nationalpark umschließt den Fluss Stabburselva und sein Tal westlich des Porsangerfjorden
      in der Finnmark. Er entstand 1970 zum Schutz von rund 98 km² Auwald und wurde 2002 auf 747 km²
      ausgeweitet.
    landscape: >-
      Der Kiefernwald erzählt Klimageschichte. Vor Jahrtausenden war das arktische Klima milder, und die
      Waldkiefer reichte weit nach Norden. Mit der Abkühlung wich der Wald zurück und hielt sich nur in
      geschützten Tälern wie diesem. Stabbursdalen verläuft quer zum Porsangerfjorden, im Norden durch
      Bergzüge vor Meereswinden abgeschirmt, was das Überleben der Bäume sicherte. Der Wald ist licht und
      niedrigwüchsig; der karge Podsolboden trägt lediglich Flechten und Zwergsträucher.


      Flussabwärts wandelt sich der Talcharakter. Im Oberlauf prägen offene Tundra und lichte Birkenhänge das
      Bild. Danach verengt sich das Tal canyonartig, bis es sich am Wasserfall Stabbursfossen öffnet und in
      den Urwaldkiefernforst übergeht. Im Kiefernwald schneidet sich der Fluss in eine Schlucht mit
      Stromschnellen und rundgeschliffenen Felsnasen ein, geschaffen von Schmelzwassermassen aus dem Inlandeis
      der Finnmark. Die Talaue bildet eine Flussterrasse auf 60-70 m Meereshöhe. Bei Luobbal (Lompola) formen
      Feuchtgebiete eine fruchtbare Oase in karger Landschaft.


      Im Südosten ragt das Bergmassiv der Gáissene auf, gekrönt vom Čohkarášša mit 1139 m, dem höchsten Gipfel
      dieses Teils der Finnmark. Die Massive sind Überschiebungsdecken aus uraltem Meeresboden, der vor 400
      bis 600 Millionen Jahren auf das Festland geschoben wurde.
    wildlife: >-
      Stabbursdalen bildet die Nordgrenze für zahlreiche Waldarten. Das [Auerhuhn](/especie/tetrao_urogallus/)
      besitzt hier sein weltweit nördlichstes Brutvorkommen, ebenso wie Unglückshäher, Eichhörnchen und
      Hakengimpel. Auch [Birkhuhn](/especie/tetrao_tetrix/) und [Fischadler](/especie/pandion_haliaetus/)
      brüten im Schutzgebiet. Die Feuchtgebiete dienen Enten als wichtiges Brutrevier.


      Unter den Säugetieren sind [Elch](/especie/alces_alces/), zahmes Ren und [Vielfraß](/especie/gulo_gulo/)
      regelmäßig anzutreffen.


      An der Flussmündung breitet sich das Stabbursnes-Naturreservat aus, eines der bedeutendsten
      Küstenfeuchtgebiete Norwegens für Vögel mit 23 Entenvogelarten, sechs davon Gänsearten, und 25
      Watvogelarten. Es besitzt überragende Bedeutung als Rastplatz der bedrohten Zwerggans während des
      Frühlings- und Herbstzugs. Ein Beobachtungsversteck südlich von Stabbursneset blickt über das Watt von
      Valdakmyra.
    visit: >-
      Der Park bietet einfache Wanderinfrastruktur mit markierten Wegen, offenen Hütten und traditionellen
      Torfhütten (Gammen). Man parkt an der Vogelfütterung in Lombola, wo an der Lombolaveien die Hauptrouten
      starten. Der kürzeste Pfad, unter 1 km lang, führt nach Rørkulpen, einem Rastplatz am Fluss mit
      Feuerstelle und Bänken. Der Rundweg zum Stabbursfossen misst rund 5,5 km durch Kiefern, Birken und
      Flussterrassen, wo man Lachse springen sehen kann. Der Pfad zum Stuorra Biŋalvárri an der Parkgrenze
      zählt rund 7,5 km einfache Strecke bei einem Anstieg von 60 auf 528 m mit weitem Panorama. Für
      Weitwanderer führt die Route Okselv–Stabbursnes über die offene Bastingammen und die Hütte Ivarstua; von
      Ivarstua nach Stabbursnes sind es rund 25 km.


      Die Futterstelle am Eingang zieht Lapplandmeisen, Unglückshäher, Kohlmeisen und Eichhörnchen an. Im
      Sommer ist die Anfahrt per Pkw möglich; im Winter erfordert der Zugang 7 km auf Skiern oder
      Schneeschuhen.


      Das Museum Stabbursnes Naturhus veranschaulicht Lebensräume der Finnmark sowie die samische Kultur und
      Rentierzucht.
    history: >-
      Für die Küstensami bildeten die Naturressourcen des Tals die Lebensgrundlage. In Lompola schnitt man
      Schilf als Winterfutter, und Bauholz wurde auf der Stabburselva geflößt; diese Nutzung hinterließ kaum
      Spuren. Fanggruben belegen die historische Jagd auf wilde Rentiere, die im XVII. Jahrhundert durch die
      Domestikation abgelöst wurde. In der traditionellen samischen Religion galten Felsen und Landmarken als
      heilig.


      Ein Missionar nannte das Tal im XVIII. Jahrhundert nach dem biblischen Berg Tabor «Tabors dal», woraus
      volksetymologisch Stabbursdalen wurde. Ziel der Schutzmaßnahmen ist der Erhalt einer wegelosen Wildnis
      mit dem nördlichsten Kiefernwald der Welt.
    before: >-
      Wandern, Skitouren und Zelten sind überall frei gestattet, sofern aller Müll mitgenommen wird. Vom 15.
      April bis 15. September gilt ein allgemeines Feuerverbot im Wald. Hunde sind vom 1. April bis 20. August
      an der Leine zu führen.
    around: >-
      Stabbursdalen hat keine unmittelbaren Nachbarn im Atlas. Weiter entfernt teilen der finnische
      [Urho-Kekkonen-Nationalpark](/lugar/urho-kekkonen-national-park/) und der norwegische [Nationalpark
      Gutulia](/lugar/gutulia-national-park/) Elch, Braunbär, Urwälder und Unglückshäher.
  it:
    intro: >-
      A quasi 70° di latitudine nord, dove i gelidi venti polari sferzano qualsiasi forma vegetale, una valle
      riparata preserva una foresta che sembra sfidare la natura. Sono pini silvestri bassi e contorti, vecchi
      fino a 500 anni, che formano la pineta più settentrionale del mondo. Il Parco Nazionale di Stabbursdalen
      circonda il corso del fiume Stabburselva e la sua vallata a ovest del Porsangerfjorden, nel Finnmark. È
      nato nel 1970 per tutelare circa 98 km² di boschi fluviali ed è stato ampliato nel 2002 fino a 747 km².
    landscape: >-
      La pineta racchiude una preziosa memoria geologica. Migliaia di anni fa il clima era più caldo e le
      conifere si spingevano assai più a nord. Con il successivo raffreddamento, la foresta è arretrata
      sopravvivendo soltanto in valli protette come questa. Stabbursdalen si sviluppa quasi perpendicolare al
      Porsangerfjorden, schermata dai venti oceanici da rilievi a settentrione, consentendo agli alberi di
      salvarsi. Il bosco è aperto e rado, e il suolo podzolico povero accoglie soltanto licheni e brughiere a
      erica.


      Il corso d'acqua muta profondamente l'aspetto della valle. A monte domina la tundra aperta con betulle
      nane lungo le sponde. Più a valle l'alveo si incassa tra versanti fitti di betulle, per poi aprirsi a
      Stabbursfossen dove il pino torna a circondare il fiume. All'interno della pineta il fondovalle si
      restringe in una forra con cascate, rapide e rocce levigate, modellate quando il fiume convogliava il
      disgelo dell'intero Finnmark interno. Il tratto terminale forma un ripiano a 60-70 m di quota. A Luobbal
      (Lompola), i meandri allagati danno vita a un'oasi fertile nel cuore della tundra arida.


      A sud-est le montagne dei Gáissene spezzano l'orizzonte, culminando nel Čohkarášša a 1139 m, la vetta
      più alta di questo settore del Finnmark. Sono falde di ricoprimento formate da porzioni di fondale
      oceanico spinte sulla terraferma tra 400 e 600 milioni di anni fa.
    wildlife: >-
      Stabbursdalen rappresenta il confine settentrionale per varie specie della taiga.
      L'[urogallo](/especie/tetrao_urogallus/) mantiene qui la popolazione più a nord del globo, e anche
      ghiandaia siberiana, scoiattolo rosso e ciuffolotto delle pinete toccano il proprio limite geografico.
      Vi nidificano regolarmente il [gallo forcello](/especie/tetrao_tetrix/) e il [falco
      pescatore](/especie/pandion_haliaetus/). I meandri umidi offrono preziosi siti di cova per le anatre
      tuffatrici.


      Tra i mammiferi sono abituali l'[alce](/especie/alces_alces/), la renna domestica e il
      [ghiottone](/especie/gulo_gulo/).


      Alla foce del fiume sorge la riserva naturale di Stabbursnes, una delle zone umide costiere più
      strategiche della Norvegia per l'avifauna, con 23 specie di anatidi, sei delle quali oche, e 25 di
      trampolieri. Riveste un ruolo cruciale per la sosta migratoria della rara oca lombardella minore durante
      i passaggi primaverili e autunnali. Un capanno di avvistamento a sud di Stabbursneset si affaccia sulle
      piane di marea di Valdakmyra.
    visit: >-
      Il parco è concepito per un'escursionismo lineare, con sentieri segnati, capanni e rifugi tradizionali
      in torba (gamme). Si parcheggia presso la mangiatoia per uccelli di Lombola, al termine della
      Lombolaveien, da cui partono i percorsi principali. Il più breve, inferiore a 1 km, conduce a Rørkulpen,
      un anfratto fluviale tra i pini attrezzato con focolare e panche. L'itinerario per Stabbursfossen copre
      circa 5,5 km tra pini, betulle e terrazzi alluvionali, dove non è raro scorgere salmoni in risalita. Il
      sentiero per lo Stuorra Biŋalvárri, cima sul confine del parco, misura circa 7,5 km per tratta superando
      un dislivello da 60 a 528 m con vista sul fiordo. Per le lunghe traversate, la rotta Okselv–Stabbursnes
      tocca la gamma aperta di Bastingammen e il rifugio Ivarstua; da Ivarstua a Stabbursnes si contano circa
      25 km.


      La mangiatoia all'ingresso attrae costantemente cince siberiane, ghiandaie siberiane, cince maggiori e
      scoiattoli. In estate l'accesso avviene in auto; in inverno servono 7 km con sci o racchette da neve.


      Il centro Stabbursnes Naturhus espone gli ambienti naturali del Finnmark e la cultura sami
      dell'allevamento della renna.
    history: >-
      Per i sami costieri le risorse di Stabbursdalen garantirono la sussistenza quotidiana. A Lompola si
      sfalciava il falasco per il foraggio invernale e i tronchi per le imbarcazioni venivano fluitati sullo
      Stabburselva; questo uso tradizionale ha lasciato tracce minime. Sistemi di buche-trappola testimoniano
      l'antica caccia alla renna selvatica, soppiantata nel XVII secolo dall'allevamento nomade. Nella
      spiritualità sami pre-cristiana, monti e pietre sacre erano venerati.


      Un missionario denominò la vallata nel XVIII secolo «Tabors dal» ispirandosi al monte Tabor, nome poi
      trasformatosi in Stabbursdalen. La tutela mira a conservare un vasto spazio selvaggio privo di strade
      con la pineta più settentrionale del globo.
    before: >-
      Puoi muoverti liberamente a piedi o con gli sci e campeggiare ovunque, portando via ogni rifiuto. Vige
      il divieto assoluto di accendere fuochi nel bosco dal 15 aprile al 15 settembre. I cani vanno tenuti al
      guinzaglio dal 1 aprile al 20 agosto.
    around: >-
      Stabbursdalen non ha vicini diretti nell'atlas. Più lontano, il [Parco Nazionale Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) in Finlandia e il [Parco Nazionale di
      Gutulia](/lugar/gutulia-national-park/) in Norvegia condividono foreste primarie, alce, orso bruno e
      ghiandaia siberiana.
  pt:
    intro: >-
      A quase 70° de latitude norte, onde os ventos polares castigam a vegetação, um vale abrigado esconde uma
      floresta que parece desafiar as leis da geografia. São pinheiros-silvestres baixos e retorcidos, com até
      500 anos de idade, formando o pinhal mais setentrional do mundo. O Parque Nacional de Stabbursdalen
      acompanha o rio Stabburselva e o seu vale a oeste do Porsangerfjorden, em Finnmark. Foi instituído em
      1970 para salvaguardar cerca de 98 km² de matas ribeirinhas e foi alargado em 2002 para 747 km².
    landscape: >-
      O pinhal encerra uma história climática singular. Há milhares de anos o clima era mais quente e as
      coníferas estendiam-se vastamente para o interior. Com o arrefecimento, a floresta recuou e subsistiu
      apenas em vales encaixados como este. Stabbursdalen corre quase perpendicular ao Porsangerfjorden,
      abrigado dos ventos marítimos por serras a norte, o que salvou o arvoredo. O bosque é aberto e
      raquítico, sobre solos podzólicos pobres que sustentam apenas líquenes e urzes.


      O vale transforma-se à medida que se segue o curso de água. A montante, a paisagem é aberta, com bétulas
      junto ao rio. Em seguida estreita-se entre encostas de bétulas densas, abrindo-se em Stabbursfossen onde
      as margens se cobrem de pinheiros seculares. No interior do pinhal o vale aprofunda-se num canhão com
      cascatas, rápidos e afloramentos polidos pelo degelo que outrora drenava o interior de Finnmark. A
      secção baixa forma um planalto fluvial a 60-70 m de altitude. Em Luobbal (Lompola), os paulistas compõem
      um oásis verdejante num relevo árido.


      A sudeste destacam-se as montanhas de Gáissene, culminando em Čohkarášša a 1139 m, o cume mais elevado
      deste setor de Finnmark. Trata-se de mantos de cavalgamento formados por lajes do antigo fundo oceânico
      empurradas sobre o continente há entre 400 e 600 milhões de anos.
    wildlife: >-
      Stabbursdalen constitui o limite setentrional para muitas espécies da taiga. O
      [tetraz-grande](/especie/tetrao_urogallus/) mantém aqui a sua população mais a norte do planeta, e
      também a gaio-siberiano, o esquilo-vermelho e o bico-grossudo alcançam o seu limite no pinhal. O
      [galo-lira](/especie/tetrao_tetrix/) e a [águia pescadora](/especie/pandion_haliaetus/) nidificam no
      parque. As zonas húmidas funcionam como criadouros de excelência, sobretudo de patos-mergulhões.


      Entre os mamíferos são comuns o [alce](/especie/alces_alces/), a rena doméstica e o
      [glutão](/especie/gulo_gulo/).


      Na foz do rio situa-se a reserva natural de Stabbursnes, uma das zonas húmidas litorais mais ricas da
      Noruega para a avifauna, albergando 23 espécies de anatídeos, seis delas gansos, e 25 de limícolas.
      Apresenta relevância internacional como escala migratória para o raro ganso-pequeno durante a primavera
      e o outono. Existe um abrigo de observação a sul de Stabbursneset com vista sobre os sapais de
      Valdakmyra.
    visit: >-
      O parque está estruturado para caminhadas acessíveis, com trilhos balizados, cabanas e abrigos
      tradicionais de turfa (gammes). Estaciona-se junto ao comedouro de aves de Lombola, de onde partem os
      principais itinerários no final da Lombolaveien. O percurso mais curto, com menos de 1 km, conduz a
      Rørkulpen, um recanto florestal junto ao rio com bancos e lareira exterior. O trilho de Stabbursfossen
      estende-se por 5,5 km entre pinhais, bétulas e planaltos fluviais, proporcionando a observação de
      salmões a saltar. O percurso para Stuorra Biŋalvárri, cume na orla do parque, conta cerca de 7,5 km por
      sentido com subida dos 60 aos 528 m de altitude e vista aberta sobre o fiorde. Para uma travessia
      exigente, a rota Okselv–Stabbursnes passa pela cabana de Bastingammen e pelo abrigo Ivarstua; de
      Ivarstua a Stabbursnes são cerca de 25 km.


      O comedouro à entrada atrai chapins-sombris, gaios-siberianos, chapins-reais e esquilos. No verão
      chega-se de automóvel; no inverno a aproximação requer 7 km em esquis ou raquetes de neve.


      O museu Stabbursnes Naturhus apresenta mostras sobre os biomas de Finnmark e a cultura pastoril sami
      associada à rena.
    history: >-
      Para os samis costeiros, os recursos de Stabbursdalen foram indispensáveis à sobrevivência. Em Lompola
      ceifavam-se junças para forragem de inverno e a madeira para embarcações e cabanas descia o rio por
      flutuação; este uso tradicional deixou poucos vestígios. Subsistem valas de armadilha da caça ancestral
      à rena selvagem, substituída no século XVII pela pastorícia de renas domésticas. Na religião sami
      pré-cristã, montanhas e pedras sagradas eram veneradas.


      Um missionário batizou o vale no século XVIII como «Tabors dal» em alusão ao monte Tabor, derivando por
      etimologia popular para Stabbursdalen. A conservação visa preservar uma vasta área selvagem sem estradas
      com o pinhal mais setentrional da Terra.
    before: >-
      Podes deslocar-te livremente a pé ou em esquis e acampar com responsabilidade, recolhendo todo o lixo.
      Vigora proibição geral de fogo na floresta de 15 de abril a 15 de setembro. Os cães devem circular com
      trela de 1 de abril a 20 de agosto.
    around: >-
      Stabbursdalen não tem vizinhos imediatos no atlas. Mais longe, o [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) na Finlândia e o [Parque Nacional de
      Gutulia](/lugar/gutulia-national-park/) na Noruega partilham bosques primários, alce, urso-pardo e
      gaio-siberiano.
