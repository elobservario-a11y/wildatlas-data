unico:
  es: >-
    Lagos pequeños y de carácter muy distinto, desde un espejo transparente de un metro de profundidad hasta
    una poza oscura bajo los abetos, a pocos pasos unos de otros.
  en: >-
    Small lakes of strikingly distinct character, from a transparent mirror one metre deep to a brooding pool
    shaded by spruces, merely steps from one another.
  fr: >-
    Des lacs d’un caractère très contrasté, d’un miroir limpide d’un mètre de fond à une nappe sombre sous les
    épicéas, à quelques pas les uns des autres.
  de: >-
    Kleine Seen von grundverschiedenem Charakter, vom klaren Wasserspiegel mit einem Meter Tiefe bis zum
    finsteren Tümpel unter Fichten, nur wenige Schritte voneinander entfernt.
  it: >-
    Piccoli laghi dal carattere molto variegato, dallo specchio trasparente profondo un metro alla pozza scura
    sotto gli abeti, a brevissima distanza l’uno dall’altro.
  pt: >-
    Lagoas pequenas de feição muito distinta, desde um espelho cristalino com um metro de profundidade até uma
    poça sombria sob os abetos, a poucos passos umas das outras.
observaciones:
  es: 'Cuidado en la subida a Matnoto: hay caída de rocas.'
texto:
  es:
    intro: >-
      Una ladera que se deslizó y dejó pozas en su parte trasera. Así nacieron los lagos de Smolyan: en las
      depresiones de un gran deslizamiento, donde las rocas riolíticas tocan las sedimentarias impermeables
      que tienen debajo y el agua se queda. Hoy se escalonan por la ladera izquierda del valle del río Cherna,
      en la Bukova planina, en los Ródope occidentales, bajo las Rocas de Orfeo y el pico Snezhanka, de 1926
      m. Se reparten por todo el valle, desde las rocas hasta la ciudad de Smolyan.
    landscape: >-
      Antes había cerca de veinte lagos; muchos han acabado convertidos en pantanos. En primavera y otoño, en
      el lugar de algunos pantanos vuelven a formarse pequeños lagos, y otros se han transformado en estanques
      de cría. Algunos de los pequeños lagos que rodean Osmanoviyat gyol se secan durante el verano, y el lago
      Iztochno no tiene espejo de agua permanente y se seca en verano y otoño.


      Cada lago tiene su carácter. Keranovia gyol, también llamado Platenoto, está represado en su parte baja
      y es uno de los mayores. Silazha tiene una pequeña isla cubierta de juncos en su extremo inferior. Los
      tres más altos son los más bellos y están justo bajo las rocas. Trevistoto, el lago de la Hierba, tiene
      aproximadamente el 30 % de su superficie cubierto por una capa de turba de un metro de grosor, sobre la
      que crecen hierbas en verano. A solo 6 m queda Bistroto, el lago Claro: no pasa de un metro de
      profundidad y su fondo se ve a través del agua cristalina. Los dos se conectan por un arroyo que se
      filtra entre los bloques de roca que los separan. En la orilla oriental de Bistroto crecen abetos
      antiguos; al otro lado, grandes bloques de roca parecen pequeños islotes.


      Matnoto, el lago Turbio, es el más alto, a 1500 m, y el más profundo, con 4,5 m. Está escondido en un
      denso bosque de abetos rojos justo bajo las rocas, y apenas le llega la luz: sus aguas parecen negras,
      de ahí el nombre. Queda a 200 m de Bistroto y Trevistoto.
    wildlife: >-
      Las fuentes describen sobre todo el paisaje: los abetos rojos, la turba con hierbas en verano y los
      lagos que cambian con las estaciones. En primavera y otoño aparecen pequeños lagos temporales; en verano
      algunos se secan. De fauna concreta, el lugar no da nombres.
    visit: >-
      La carretera entre Smolyan y Pamporovo pasa junto a los lagos, y cerca de ellos hay refugios y casas de
      descanso. Una senda empinada sale de la carretera, entre los dos lagos, y sube a Matnoto; hay riesgo de
      caída de rocas, así que ve con cuidado. El sendero turístico hacia el refugio Studenets cruza un
      terraplén artificial en el extremo bajo de Bistroto.


      Desde el refugio Studenets se llega en una hora a las Rocas de Orfeo, por una carretera asfaltada junto
      al collado bajo el pico Snezhana. Según la leyenda, allí el cantor mítico hechizaba con su voz y su arpa
      a personas, fieras y aves. Las rocas están en medio de un bosque de abetos, casi en la cima de la ladera
      erosionada sobre los lagos, y dan una panorámica del valle del Cherna y de los lagos. Son el lugar más
      visitado de la zona.
    before: 'Cuidado en la subida a Matnoto: hay caída de rocas.'
    around: >-
      A unos veinte kilómetros queda [Chudnite Mostove](/lugar/chudnite-mostove/), los puentes de mármol de
      los Ródope occidentales. Más lejos, el [Parque Nacional Bucegi - Ladera
      Occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) comparte con este lugar el bosque
      maduro y los terrenos kársticos.
  en:
    intro: >-
      A mountainside broke loose and left waterlogged hollows in its wake. That is how the Smolyan Lakes were
      born: cradled in the depressions of a massive primordial landslide, where rhyolitic rock collides with
      the impermeable sedimentary layers beneath, trapping the mountain runoff. Today they cascade down the
      left flank of the Cherna river valley on Bukova Planina, in the Western Rhodopes, directly below the
      Orpheus Rocks and the 1926 m peak of Snezhanka. The lakes scatter along the valley floor, reaching from
      the cliffs right down toward the town of Smolyan.
    landscape: >-
      Historically, nearly twenty lakes dotted the slope; over time, several silted up into peat bogs. In
      spring and autumn, seasonal pools briefly refill in place of some bogs, while others have been adapted
      as fish ponds. Several of the small basins around Osmanoviyat gyol dry out entirely during summer heat,
      and Lake Iztochno holds no permanent water table, evaporating during summer and autumn.


      Every basin possesses its own personality. Keranovia gyol, also known as Platenoto, is dammed at its
      lower end and ranks among the largest. Silazha features a small reed-fringed islet near its outlet. The
      three highest tarns are widely considered the most striking, set immediately against the crags.
      Trevistoto, the Grassy Lake, has around 30 % of its surface blanketed by a peat layer roughly one metre
      thick, blooming with grasses and herbs in summer. Just 6 m away lies Bistroto, the Clear Lake: scarcely
      one metre deep, with its stony bed visible through mirror-clear water. A stream filters through the
      scree separating the two. Ancient spruce trees line Bistroto’s eastern margin, while across the shore,
      giant boulders look like tiny rocky islets.


      Matnoto, the Muddy Lake, is the highest at 1500 m and the deepest at 4.5 m. Tucked within dense spruce
      woods immediately under the rock faces, sunlight barely penetrates its canopy: the water appears dark,
      almost black, giving the lake its name. It sits 200 m above Bistroto and Trevistoto.
    wildlife: >-
      Documentation focuses primarily on the landscape: dark spruce forest, peat moss beds blooming in summer,
      and water levels fluctuating with the seasons. Temporary vernal pools emerge during spring snowmelt and
      autumn rains, only to vanish under summer heat. Specific named wildlife inventories are not highlighted
      in local records.
    visit: >-
      The road connecting Smolyan with Pamporovo skirts close to the lakes, where several mountain huts and
      lodges are situated. A steep footpath branches from the road between two lakes, ascending towards
      Matnoto; loose scree presents a rockfall hazard, so tread carefully. The marked hiking trail towards
      Studenets hut crosses an artificial causeway at the lower edge of Bistroto.


      From Studenets hut, an asphalt road leads across the saddle below Snezhana peak, reaching the Orpheus
      Rocks in about one hour. According to Rhodope legend, the mythical bard Orpheus stood here, enchanting
      beasts, birds, and humans with his lyre and voice. The crags rise amidst towering spruces near the brink
      of the eroded escarpment, offering commanding panoramas across the Cherna valley and the lakes below.
      They are the most popular landmark in the area.
    before: 'Take care on the ascent to Matnoto: loose rocks may fall.'
    around: >-
      Roughly twenty kilometres away stands [Chudnite Mostove](/lugar/chudnite-mostove/), the miraculous
      marble bridges of the Western Rhodopes. Further afield, [Bucegi National Park - Western
      Flank](/lugar/parcul-national-bucegi---vertientes-occidentales/) shares a comparable tapestry of
      old-growth spruce forest and rugged karst topography.
  fr:
    intro: >-
      Un versant de montagne qui s’est effondré et a laissé des cuvettes d’eau à l’arrière. C’est ainsi que
      sont nés les lacs de Smolyan : dans les dépressions d’un immense glissement de terrain préhistorique, à
      la rencontre des roches rhyolitiques et des couches sédimentaires imperméables sous-jacentes qui
      retiennent les eaux. Ils s’échelonnent aujourd’hui sur le flanc gauche de la vallée de la Cherna, dans
      la Bukova planina des Rhodopes occidentales, sous les rochers d’Orphée et le pic Snezhanka, culminant à
      1926 m. Ils s’étirent le long de la vallée, depuis les falaises jusqu’aux abords de la ville de Smolyan.
    landscape: >-
      Le vallon comptait jadis près d’une vingtaine de lacs ; beaucoup ont fini par se transformer en
      tourbières. Au printemps et à l’automne, de petites nappes d’eau réapparaissent à l’emplacement de
      certains marécages, et d’autres bassins ont été aménagés en étangs de pisciculture. Quelques petits
      plans d’eau autour d’Osmanoviyat gyol s’assèchent en été, et le lac Iztochno n’a pas de surface pérenne,
      s’évaporant en été et en automne.


      Chaque plan d’eau a sa physionomie propre. Keranovia gyol, également appelé Platenoto, est barré dans sa
      partie basse et compte parmi les plus vastes. Silazha possède un petit îlot couvert de roseaux à son
      extrémité aval. Les trois lacs supérieurs sont les plus spectaculaires, nichés au pied même des
      falaises. Trevistoto, le lac herbeux, voit environ 30 % de sa surface recouverte par une couche de
      tourbe épaisse d’un mètre, colonisée par des graminées en été. À seulement 6 m se trouve Bistroto, le
      lac clair : profond de moins d’un mètre, il laisse voir son fond à travers une eau limpide. Les deux
      bassins communiquent par un ruisseau qui s’infiltre entre les blocs rocheux. De vieux épicéas bordent la
      rive orientale de Bistroto, tandis que de gros blocs émergent comme de petits îlots de pierre.


      Matnoto, le lac trouble, est le plus haut à 1500 m et le plus profond avec 4,5 m. Blotti dans une dense
      pessière juste sous les falaises, la lumière y pénètre à peine : ses eaux paraissent d’un noir profond,
      d’où son nom. Il se trouve à 200 m au-dessus de Bistroto et Trevistoto.
    wildlife: >-
      Les descriptions mettent surtout en valeur le paysage : la forêt d’épicéas rouges, les tapis de tourbe
      verdoyants en été et le cycle des lacs selon les saisons. Au printemps et à l’automne naissent des
      pièces d’eau éphémères, tandis que les chaleurs estivales en assèchent certaines. Aucun inventaire
      faunistique détaillé n’est documenté dans les sources locales.
    visit: >-
      La route reliant Smolyan à Pamporovo longe les lacs, auprès desquels sont installés des refuges et des
      maisons de repos. Une sente escarpée quitte la route entre deux lacs pour monter vers Matnoto ; prenez
      garde aux chutes de pierres fréquentes sur cette pente. Le sentier de randonnée vers le refuge Studenets
      franchit un remblai aménagé sur la partie basse de Bistroto.


      Depuis le refuge Studenets, une route goudronnée mène en une heure environ aux rochers d’Orphée, via le
      col sous le mont Snezhana. Selon la légende, le chantre mythique y charmait de sa voix et de sa lyre les
      hommes, les bêtes sauvages et les oiseaux. Les rochers émergent au milieu des épicéas, près de la
      corniche rocheuse dominant les lacs, et ouvrent un vaste panorama sur la vallée de la Cherna. C’est le
      point le plus fréquenté des environs.
    before: 'Prudence lors de la montée vers Matnoto : chutes de pierres.'
    around: >-
      À une vingtaine de kilomètres se dresse [Chudnite Mostove](/lugar/chudnite-mostove/), les ponts de
      marbre spectaculaires des Rhodopes occidentales. Plus loin, le [parc national Bucegi - versant
      occidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) partage avec ce site ses vieilles
      forêts de résineux et ses formations karstiques remarquables.
  de:
    intro: >-
      Ein Berghang, der ins Rutschen geriet und in seinem Rückraum Wasserbecken hinterließ. So entstanden die
      Smoljan-Seen: in den Hohlformen eines gewaltigen urzeitlichen Bergsturzes, an der Nahtstelle zwischen
      Rhyolithgestein und den darunterliegenden undurchlässigen Sedimentschichten, die das Wasser stauen.
      Heute staffeln sie sich am linken Hang des Cherna-Tals im Bukova-Gebirge der Westrhodopen, unterhalb der
      Orpheus-Felsen und des 1926 m hohen Snezhanka-Gipfels. Sie verteilen sich über das gesamte Tal, von den
      Felsabstürzen bis hinunter zur Stadt Smoljan.
    landscape: >-
      Früher gab es fast zwanzig Seen; viele von ihnen sind im Lauf der Zeit zu Mooren verlandet. Im Frühjahr
      und Herbst bilden sich an Stelle mancher Moore wieder kleine Wasserflächen, während andere Becken als
      Fischteiche genutzt werden. Einige der kleinen Tümpel rund um Osmanoviyat gyol trocknen im Sommer aus,
      und der See Iztochno besitzt keinen dauerhaften Wasserspiegel und fällt im Sommer und Herbst trocken.


      Jeder See hat seine eigene Gestalt. Keranovia gyol, auch Platenoto genannt, ist an seinem unteren Ende
      aufgestaut und gehört zu den größten Gewässern. Silazha besitzt eine kleine, schilfbewachsene Insel an
      seinem Abfluss. Die drei höchstgelegenen Seen gelten als die reizvollsten und schmiegen sich direkt an
      die Felswand. Trevistoto, der Gras-See, hat etwa 30 % seiner Wasserfläche von einer rund einen Meter
      dicken Torfschicht bedeckt, auf der im Sommer Gräser wachsen. Nur 6 m entfernt liegt Bistroto, der Klare
      See: Er misst kaum einen Meter Tiefe, sodass man durch das kristallklare Wasser bis auf den Grund
      blicken kann. Beide Gewässer sind durch einen Bach verbunden, der durch das Felsblockfeld sickert. Am
      Ostufer von Bistroto stehen uralte Fichten, während am jenseitigen Ufer Felsblöcke wie winzige Inseln
      aus dem Wasser ragen.


      Matnoto, der Trübe See, ist mit 1500 m der höchstgelegene und mit 4,5 m der tiefste der Gruppe.
      Verborgen in einem dichten Fichtenwald direkt unter der Felswand dringt kaum Tageslicht zu ihm vor: Das
      Wasser wirkt beinahe schwarz, was ihm seinen Namen gab. Er liegt 200 m oberhalb von Bistroto und
      Trevistoto.
    wildlife: >-
      Die Berichte heben vor allem das Landschaftsbild hervor: urwüchsige Fichtenbestände, im Sommer
      ergrünende Torfdecken und der jahreszeitliche Wandel des Wasserstands. Im Frühjahr und Herbst füllen
      sich kurzlebige Schmelzwasserseen, während in den Sommermonaten viele Becken einschrumpfen. Konkrete
      Tierarten werden in den regionalen Quellen nicht namentlich angeführt.
    visit: >-
      Die Straße zwischen Smoljan und Pamporovo führt nahe an den Seen vorbei, in deren Umgebung mehrere
      Schutzhütten und Rasthäuser stehen. Ein steiler Pfad zweigt zwischen zwei Seen von der Straße ab und
      steigt nach Matnoto hinauf; wegen Steinschlaggefahr solltest du hier aufmerksam gehen. Der Wanderweg zur
      Berghütte Studenets überquert einen künstlichen Erdwall am unteren Ufer von Bistroto.


      Von der Berghütte Studenets erreichst du die Orpheus-Felsen über eine asphaltierte Fahrstraße entlang
      des Sattels unter dem Snezhana-Gipfel in etwa einer Stunde. Der Sage nach verzauberte hier der mythische
      Sänger Orpheus mit seiner Leier und Stimme Mensch, Tier und Vogelwelt. Die Felsen ragen inmitten hoher
      Fichten an der Abbruchkante empor und eröffnen einen weiten Ausblick über das Cherna-Tal und die
      Seenlandschaft. Sie bilden den meistbesuchten Aussichtspunkt des Gebiets.
    before: 'Vorsicht beim Aufstieg nach Matnoto: Steinschlaggefahr.'
    around: >-
      Rund zwanzig Kilometer entfernt liegt [Chudnite Mostove](/lugar/chudnite-mostove/), die markanten
      Marmor-Naturbrücken der Westrhodopen. Weiter entfernt teilt der [Bucegi-Nationalpark -
      Westhänge](/lugar/parcul-national-bucegi---vertientes-occidentales/) alte Nadelwälder und eindrucksvolle
      Karstlandschaften.
  it:
    intro: >-
      Un versante montuoso scivolato verso valle lasciando conche d’acqua sul retro. Così sono nati i laghi di
      Smolyan: nelle depressioni di una grande frana preistorica, nel punto di contatto tra le rocce
      riolitiche e gli strati sedimentari impermeabili sottostanti che trattengono le acque. Oggi scendono a
      gradoni lungo il versante sinistro della valle del fiume Cherna, nella Bukova planina dei Rodopi
      occidentali, sotto le Rocce di Orfeo e il picco Snezhanka, alto 1926 m. Si allungano lungo l’intera
      vallata, dalle scogliere fino alle porte della città di Smolyan.
    landscape: >-
      In passato si contavano quasi venti specchi d’acqua; con il tempo molti si sono trasformati in torbiere.
      In primavera e in autunno, al posto di alcuni acquitrini si riformano piccoli bacini temporanei, mentre
      altri sono stati adibiti a vivai ittici. Alcuni dei piccoli laghetti attorno a Osmanoviyat gyol si
      prosciugano in estate, e il lago Iztochno non ha un livello idrico permanente, esaurendosi tra estate e
      autunno.


      Ogni bacino ha una propria fisionomia. Keranovia gyol, chiamato anche Platenoto, è sbarrato nella parte
      inferiore ed è tra i più estesi del gruppo. Silazha presenta un piccolo isolotto coperto di canne
      all’estremità di deflusso. I tre laghi superiori sono considerati i più suggestivi e si trovano a
      ridosso delle pareti. Trevistoto, il Lago d’Erba, ha circa il 30 % della sua superficie coperto da una
      coltre di torba spessa un metro, su cui in estate crescono erbe e fiori. A soli 6 m di distanza si trova
      Bistroto, il Lago Chiaro: profondo non più di un metro, lascia scorgere il fondo attraverso un’acqua
      limpidissima. I due bacini comunicano tramite un ruscello che filtra tra i blocchi rocciosi divisori.
      Sulla sponda orientale di Bistroto crescono abeti vetusti, mentre sull’altro lato grandi massi emergono
      come piccoli isolotti.


      Matnoto, il Lago Torbido, è il più alto a 1500 m e il più profondo con i suoi 4,5 m. Nascosto in un
      fitto bosco di abeti rossi sotto le rupi, la luce vi penetra a stento: le sue acque appaiono scure,
      quasi nere, da cui il toponimo. Dista circa 200 m da Bistroto e Trevistoto.
    wildlife: >-
      I resoconti descrivono soprattutto l’ambiente vegetale: le foreste di abete rosso, le torbiere
      rigogliose in estate e il continuo mutamento dei bacini con le stagioni. In primavera e in autunno
      compaiono specchi d’acqua effimeri dovuti allo scioglimento delle nevi, che evaporano nei mesi caldi.
      Non vengono documentate specie animali di rilievo nelle fonti locali.
    visit: >-
      La carrozzabile tra Smolyan e Pamporovo corre vicino ai laghi, nei cui pressi sorgono rifugi e locande
      montane. Un sentiero ripido si stacca dalla strada tra due specchi d’acqua e risale verso Matnoto; fai
      attenzione al pericolo di caduta sassi. La traccia escursionistica per il rifugio Studenets attraversa
      una massicciata artificiale all’estremità inferiore di Bistroto.


      Dal rifugio Studenets si raggiungono le Rocce di Orfeo in circa un’ora, seguendo una strada asfaltata
      che costeggia la sella sotto la cima dello Snezhana. Secondo la leggenda locale, il mitico cantore Orfeo
      ammaliava con la voce e la cetra genti, belve e uccelli della foresta. Le rocce spuntano tra abeti
      imponenti sull’orlo del baratro eroso e offrono una veduta spettacolare sulla valle del Cherna e sui
      laghi sottostanti. Sono la meta più visitata dell’area.
    before: Attenzione salendo verso Matnoto per il rischio di caduta sassi.
    around: >-
      A una ventina di chilometri si trova [Chudnite Mostove](/lugar/chudnite-mostove/), i suggestivi ponti di
      marmo dei Rodopi occidentali. Più distante, il [Parco Nazionale Bucegi - Versante
      Occidentale](/lugar/parcul-national-bucegi---vertientes-occidentales/) offre analoghi boschi maturi di
      conifere e spettacolari rilievi carsici.
  pt:
    intro: >-
      Uma encosta de montanha que deslizou e deixou poças de água na sua retaguarda. Foi assim que nasceram os
      lagos de Smolyan: nas depressões de um grande deslizamento de terras primordial, onde as rochas
      riolíticas tocam as camadas sedimentares impermeáveis subjacentes, retendo as águas. Hoje distribuem-se
      em socalcos pela vertente esquerda do vale do rio Cherna, na Bukova planina dos Ródopes ocidentais, sob
      as Rochas de Orfeu e o pico Snezhanka, de 1926 m. Espalham-se ao longo do vale, desde os rochedos até às
      imediações da cidade de Smolyan.
    landscape: >-
      Antigamente existiam cerca de vinte lagoas; muitas acabaram transformadas em turfeiras e pauis. Na
      primavera e no outono, no lugar de alguns pântanos voltam a formar-se pequenas lagoas, e outras foram
      adaptadas para tanques de criação aquícola. Algumas das pequenas bacias em redor de Osmanoviyat gyol
      secam no verão, e o lago Iztochno não possui espelho de água permanente, secando no verão e outono.


      Cada lagoa tem o seu caráter próprio. Keranovia gyol, também chamado Platenoto, está represado na sua
      parte inferior e figura entre os maiores. Silazha possui uma pequena ilhota coberta de juncos na sua
      margem de saída. As três lagoas cimeiras são as mais belas, encostadas à base dos rochedos. Trevistoto,
      o Lago da Erva, tem cerca de 30 % da sua superfície coberta por uma camada de turfa com um metro de
      espessura, sobre a qual brotam ervas no verão. A apenas 6 m fica Bistroto, o Lago Claro: não ultrapassa
      um metro de profundidade e o seu leito avista-se através da água transparente. Ambos comunicam por um
      ribeiro que se infiltra por entre os blocos rochosos que os separam. Na margem oriental de Bistroto
      erguem-se abetos seculares; no lado oposto, blocos de rocha assemelham-se a pequenos ilhéus.


      Matnoto, o Lago Turvo, é o mais elevado a 1500 m e o mais fundo com 4,5 m de profundidade. Encontra-se
      escondido num bosque denso de abetos mesmo sob as escarpas rochosas, onde a luz mal penetra: as suas
      águas parecem negras, dando origem ao seu nome. Fica situado a 200 m de Bistroto e Trevistoto.
    wildlife: >-
      Os registos destacam sobretudo o cenário natural: as densas florestas de abetos, a turfa viçosa no verão
      e as oscilações dos níveis de água conforme as estações do ano. Pequenas lagoas efémeras brotam na
      primavera e no outono, evaporando-se sob o calor do estio. Não há inventários detalhados com nomes de
      espécies faunísticas nos registos locais.
    visit: >-
      A estrada entre Smolyan e Pamporovo passa junto aos lagos, existindo nas imediações abrigos e casas de
      repouso. Um trilho íngreme parte da estrada entre duas lagoas e sobe em direção a Matnoto; tem cuidado
      com o risco de queda de pedras nesta subida. O percurso pedestre até ao refúgio Studenets cruza um
      aterro artificial no extremo inferior de Bistroto.


      A partir do refúgio Studenets chega-se em cerca de uma hora às Rochas de Orfeu, seguindo por uma estrada
      alcatroada junto ao colo sob o pico Snezhana. Segundo a lenda dos Ródopes, o mítico cantor Orfeu
      encantava ali homens, feras e aves com a sua voz e a sua harpa. As rochas erguem-se no meio de abetos
      altaneiros na crista da encosta escarpada sobre os lagos, descortinando uma panorâmica desafogada sobre
      o vale do Cherna e as lagoas. São o ponto de maior afluência turística da zona.
    before: 'Cuidado ao subir para Matnoto: há perigo de queda de pedras.'
    around: >-
      A cerca de vinte quilómetros ergue-se [Chudnite Mostove](/lugar/chudnite-mostove/), as pontes de mármore
      dos Ródopes ocidentais. Mais distante, o [Parque Nacional Bucegi - Vertente
      Ocidental](/lugar/parcul-national-bucegi---vertientes-occidentales/) partilha matas seculares e
      formações cársticas imponentes.
