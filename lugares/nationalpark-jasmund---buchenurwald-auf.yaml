resumen:
  es: >-
    El Parque Nacional más pequeño de Alemania, célebre por sus acantilados blancos de tiza cayendo al Báltico
    bajo hayedos vírgenes.
  en: >-
    Germany's smallest National Park, famed for gleaming white chalk cliffs plunging into the Baltic beneath
    ancient beechwoods.
  fr: >-
    Le plus petit parc national d’Allemagne, réputé pour ses falaises blanches de craie plongeant dans la
    Baltique sous une hêtraie séculaire.
  de: >-
    Deutschlands kleinster Nationalpark, weltberühmt für weiße Kreidefelsen, die unter urwüchsigen
    Buchenwäldern in die Ostsee abfallen.
  it: >-
    Il più piccolo Parco Nazionale della Germania, celebre per le falesie bianche di gesso che precipitano nel
    Baltico sotto faggete vergini.
  pt: >-
    O mais pequeno Parque Nacional da Alemanha, célebre pelas falésias brancas de cré que mergulham no Báltico
    sob florestas virgens de faia.
unico:
  es: >-
    Bosque verde, mar azul y tiza blanca en una sola mirada, con un hayedo que forma parte del Patrimonio
    Mundial creciendo sobre un acantilado que sigue deshaciéndose.
  en: >-
    Emerald forest, turquoise sea, and white chalk cliffs in a single panorama, where World Heritage
    beechwoods crown eroding sea cliffs.
  fr: >-
    Forêt verte, mer turquoise et craie immaculée réunies dans un même regard, avec une hêtraie classée au
    patrimoine mondial perchée sur une falaise en érosion perpétuelle.
  de: >-
    Grüner Wald, blaues Meer und weiße Kreidefelsen in einem einzigen Blick, gekrönt von
    UNESCO-Welterbe-Buchenwäldern auf brüchigen Steilhängen.
  it: >-
    Foresta verde smeraldo, mare azzurro e falesie di gesso candido in un solo colpo d’occhio, con faggete
    patrimonio UNESCO abbarbicate su coste in perenne erosione.
  pt: >-
    Mata verdejante, mar azul e arribas de cré imaculado num só relance, com um faganal classificado pela
    UNESCO crescendo sobre escarpas em erosão contínua.
observaciones:
  es: >-
    En la playa de cantos bajo los acantilados hay peligro de muerte por desprendimientos de roca, y los
    derrumbes llegan sobre todo con lluvias fuertes o con el deshielo de primavera. Mantén siempre una
    distancia segura al borde del acantilado. Rige la obligación absoluta de no salirse de los caminos: fuera
    de ellos empieza el reino de animales y plantas, y en los nidos de aves hasta una molestia breve tiene
    efectos graves. Los perros van con correa. Varias líneas de autobús llegan a los aparcamientos cercanos y
    a Sassnitz.
texto:
  es:
    intro: >-
      Imagina un mar de hace setenta millones de años, poco profundo, y un fondo que se llena grano a grano de
      esqueletos diminutos. Eso es la tiza. Hoy está en pie, blanca, cortada a pico sobre el Báltico, y encima
      de ella crece un hayedo que cubre colinas y valles de arroyos. El Parque Nacional de Jasmund, en la
      península de Jasmund, al noreste de la isla de Rügen, reúne esas dos cosas en unas 3.070 hectáreas: es
      el parque nacional más pequeño de Alemania con 493 hectáreas de hayedo inscritas como Patrimonio
      Mundial.
    landscape: >-
      Todo empezó al final del Cretácico, hace unos 70 millones de años. Por aquel entonces la zona era un mar
      somero, y en él vivían en enormes cantidades algas calcáreas unicelulares, microscópicas. Al morir, sus
      esqueletos caían al fondo, y esa lluvia lenta, junto a otros organismos, se compactó hasta ser la tiza
      que ves hoy. La costa de Jasmund es, de hecho, el afloramiento geológico más grande e importante del
      norte de Alemania: un corte por 70 millones de años de historia del planeta.


      Después llegó el hielo. La glaciación plegó la tiza semiconsolidada y la quebró en trozos pequeños, y
      desde entonces el mar y la lluvia trabajan el resto. El Königsstuhl, de 118 metros, o los Wissower
      Klinken no se construyeron: se esculpieron, porque la erosión los fue sacando del interior. Y el proceso
      no ha parado. Desde hace unos 7.000 años la línea de costa ha retrocedido casi dos kilómetros, y hoy lo
      hace a unos treinta centímetros al año. Los Wissower Klinken, famosos en todo el mundo, quedaron en gran
      parte destruidos tras un derrumbe el 24 de febrero de 2005. La erosión, además, aumentó cuando se
      retiraron de la costa los grandes bloques que servían de rompeolas natural.


      Sobre la tiza, el bosque. Jasmund protege el mayor hayedo continuo de la costa báltica alemana, y los
      hábitats se suceden en poco espacio: bosque, acantilado, turbera y pastizal seco. En la Stubnitz hay
      hoyas sin desagüe llenas de agua, formadas por el hielo, y allí crecen alisos; en los sitios más secos
      aparecen perales y manzanos silvestres, serbales torminales y tejos. Entre las orquídeas está el
      zapatito de dama, y en la costa norte hay vegetación salina. Varios arroyos nacen en las turberas y se
      despeñan por los acantilados hacia el Báltico, formando algunas de las pocas cascadas de la llanura del
      norte de Alemania.
    wildlife: >-
      El bosque guarda a los grandes: [ciervo rojo](/especie/cervus_elaphus/), gamo,
      [corzo](/especie/capreolus_capreolus/), [jabalí](/especie/sus_scrofa/) y focas en el mar.


      Las aves marcan el año. El [pigargo europeo](/especie/haliaeetus_albicilla/), el ave más grande, anida
      en la Stubnitz, mientras que los aviones zapadores crían en los acantilados de tiza. El papamoscas
      papirrojo cría en el hayedo. En primavera, en los días soleados, las [grullas](/especie/grus_grus/)
      aprovechan las térmicas sobre el bosque para ganar altura antes de cruzar el Báltico. Junto a los
      arroyos puedes ver al [martín pescador](/especie/alcedo_atthis/).


      Más abajo, en los caminos soleados, es frecuente la lagartija de bosque, y en los humedales viven la
      culebra de collar, la víbora común y, más rara, la culebra lisa. En los arroyos claros hay una planaria
      alpina, una especie de montaña, y en la Stubnitz viven mil especies de escarabajos de la madera. Jasmund
      es además el único lugar de Alemania de la polilla Kreideeule, una polilla nocturna color crema. En
      invierno, truchas marinas y salmones buscan comida frente a la costa.
    visit: >-
      El camino clásico es el Hochuferweg, que sale de Lohme y corre casi 12 km por la cornisa hasta Sassnitz,
      siempre sobre la marca blanca, azul y blanca. A unos 4 km llegas al centro Königsstuhl, y 5 km más allá
      espera el Foro del Patrimonio Mundial, que explica los Hayedos Antiguos. Al terminar en Sassnitz puedes
      volver a Lohme en autobús. Si prefieres un circuito, el Weißes Rügen sale de la estación de Sassnitz y
      dura unas siete horas, pasando por el Königsstuhl y los Wissower Klinken. Hay además dos senderos
      temáticos: el sendero de la Tiza sigue el Hochuferweg y el del Bosque empieza en la entrada de Hagen;
      los dos acaban en el centro Königsstuhl y pueden empezarse desde allí. Los ciclistas tienen caminos
      señalizados, pero en bici no se puede recorrer el Hochuferweg.


      El centro de visitantes Königsstuhl ofrece una puerta de entrada al paisaje: cuatro plantas de
      exposición con dieciocho salas temáticas, audioguía, cine y un skywalk sin barreras que flota sobre el
      Königsstuhl con vistas a los acantilados y al Báltico. Abrió en marzo de 2004; consulta las condiciones
      de acceso con perro del centro.


      Al pie de los acantilados se encuentran fósiles, como las belemnitas, a las que se llamó Donnerkeile o
      rayos del trueno y que fueron el soporte interno de calamares del Cretácico, además de erizos de mar,
      conchas y corales. Hazles una foto y déjalos donde están.
    history: >-
      La tiza se explotaba desde hacía mucho en canteras. En 1926 amenazó con reabrirse una ya cerrada, y la
      costa al norte de Sassnitz se declaró reserva natural para impedirlo. El 12 de septiembre de 1990, en el
      marco del programa de parques nacionales, pasó a ser parque nacional. Una parte del hayedo es Patrimonio
      Mundial de la UNESCO desde el 25 de junio de 2011.
    before: >-
      En la playa de cantos bajo los acantilados hay peligro de muerte por desprendimientos de roca, y los
      derrumbes llegan sobre todo con lluvias fuertes o con el deshielo de primavera. Mantén siempre una
      distancia segura al borde del acantilado. Rige la obligación absoluta de no salirse de los caminos:
      fuera de ellos empieza el reino de animales y plantas, y en los nidos de aves hasta una molestia breve
      tiene efectos graves. Los perros van con correa. Varias líneas de autobús llegan a los aparcamientos
      cercanos y a Sassnitz.
  en:
    intro: >-
      Imagine a warm, shallow sea seventy million years ago whose seabed slowly accumulated grain by grain
      from the microscopic skeletons of plankton. That is chalk. Today it rears up in dazzling white sea
      cliffs sheer above the Baltic Sea, capped by primeval beech forest spreading over hills and stream
      gullies. Jasmund National Park, situated on the Jasmund peninsula in northeastern Rügen, unites both
      marvels across some 3,070 hectares: it is Germany's smallest national park, with 493 hectares of
      pristine beechwoods inscribed as UNESCO World Heritage.
    landscape: >-
      The saga began in the late Cretaceous period, roughly 70 million years ago. At that time the region lay
      beneath a shallow sea teeming with microscopic unicellular coccolithophore algae. As they died, their
      calcareous skeletons rained down onto the seafloor, compacting over epochs alongside shells into the
      chalk seen today. The sea cliffs of Jasmund represent the most dramatic geological exposure in northern
      Germany: an open window cut through 70 million years of Earth history.


      Then came the Ice Age. Glacial ice sheets buckled and fractured the semi-consolidated chalk into tilted
      slabs, and since then waves and rains have done the rest. Landmark stacks like the 118-metre Königsstuhl
      and the Wissower Klinken were not built: they were sculpted out by ceaseless coastal erosion. The
      process never stops. Over the past 7,000 years the shoreline has receded nearly two kilometres,
      currently eroding by some thirty centimetres annually. The world-famous Wissower Klinken collapsed
      dramatically on 24 February 2005. Erosion accelerated further when giant shoreline erratic boulders that
      acted as natural breakwaters were historically removed for harbour building.


      Crowning the chalk grows the woodland. Jasmund preserves the largest contiguous ancient beech forest
      along the German Baltic coast, where diverse habitats interlock: old-growth woods, sheer cliffs,
      kettle-hole bogs, and dry calcareous grasslands. Across the Stubnitz plateau, undrained depressions
      created by melting stagnant ice harbour alder carrs; dry crests support wild pear, crab apple, wild
      service tree, and English yew. Native lady’s-slipper orchids thrive, while the northern shoreline
      supports salt-tolerant cliff vegetation. Small brooks rise in woodland mires and tumble over coastal
      precipices directly into the Baltic Sea, forming some of the few natural waterfalls in the North German
      Plain.
    wildlife: >-
      The forest shelters classic woodland ungulates: [red deer](/especie/cervus_elaphus/), fallow deer, [roe
      deer](/especie/capreolus_capreolus/), and [wild boar](/especie/sus_scrofa/), alongside marine seals
      occasionally resting offshore.


      Birdlife follows the rhythm of the seasons. The [white-tailed eagle](/especie/haliaeetus_albicilla/),
      the park's grandest avian predator, nests securely within the old-growth Stubnitz, while sand martins
      excavate colonies in soft cliff sediments. Red-breasted flycatchers nest among ancient beech hollows. On
      sunny spring mornings, migrating [cranes](/especie/grus_grus/) circle high over the forest, riding
      warming thermal updrafts to gain altitude before crossing the open Baltic. Along clear woodland brooks
      you can watch the brilliant flash of the [common kingfisher](/especie/alcedo_atthis/).


      Down on sunny woodland tracks, viviparous lizards are common, while damp kettle bogs provide habitat for
      grass snakes, adders, and the elusive smooth snake. Crystal-clear streams shelter alpine
      planarians—relict mountain flatworms surviving from glacial times—and the Stubnitz supports a thousand
      species of wood-dwelling beetles. Jasmund is also the sole known locality in Germany for the
      chalk-carpet Kreideeule, a rare cream-coloured nocturnal moth. In winter, sea trout and Atlantic salmon
      forage in coastal shallows.
    visit: >-
      The classic hiking route is the Hochuferweg, setting out from Lohme and tracing the cliff-edge trail for
      almost 12 km to Sassnitz, following the white-blue-white trail markings throughout. After around 4 km
      you reach the Königsstuhl centre, and 5 km farther awaits the World Heritage Forum at Waldhalle,
      dedicated to ancient beech forest ecology. Upon concluding the hike in Sassnitz, regular buses return to
      Lohme. For a circular tour, the Weißes Rügen route departs from Sassnitz railway station, requiring
      about seven hours while taking in both Königsstuhl and the Wissower Klinken ruins. Two themed walking
      paths also branch through the park: the Chalk Trail follows the Hochuferweg and the Forest Trail begins
      at Hagen; both converge on the Königsstuhl centre. Cyclists have dedicated tracks, but cycling on the
      clifftop Hochuferweg is strictly prohibited.


      The Nationalpark-Zentrum Königsstuhl offers an engaging portal into the landscape: four floors of
      interactive exhibits spanning eighteen themed rooms, audio guides, cinema, and a barrier-free skywalk
      floating out over the Königsstuhl with breathtaking vistas of chalk cliffs and sea. It opened in March
      2004; check pet regulations before planning your visit.


      Along the pebble beach below the cliffs you can discover Cretaceous fossils, including
      belemnites—popularly known as Donnerkeile or thunderbolts, the internal guards of ancient
      cephalopods—alongside fossil sea urchins, bivalves, and sponges. Take photos and leave every find on the
      beach.
    history: >-
      Chalk was quarried along the coast for centuries. In 1926, when a disused quarry north of Sassnitz was
      slated for reopening, widespread public protests led to the coastline being declared a nature reserve to
      prevent industrial destruction. On 12 September 1990, under the historic GDR National Park Programme,
      the area was formally designated a national park. A substantial sector of its ancient beech forest was
      inscribed as a UNESCO World Heritage site on 25 June 2011.
    before: >-
      The pebble beach below the chalk cliffs poses a life-threatening danger of rockfalls and cliff
      collapses, which occur particularly after prolonged rains or during the spring thaw. Always keep a safe
      distance from cliff edges and overhanging overhangs. Staying on marked paths is strictly mandatory:
      stepping off trails disrupts fragile habitats, and near nesting birds even fleeting disturbances cause
      nest abandonment. Dogs must be kept on a leash. Several bus routes connect regional railway hubs to
      Sassnitz and surrounding gateway car parks.
  fr:
    intro: >-
      Imaginez une mer chaude et peu profonde il y a soixante-dix millions d’années, dont les fonds marins
      s’accumulèrent grain à grain à partir de squelettes microscopiques. C’est la craie. Aujourd’hui, elle se
      dresse à pic, d’une blancheur étincelante au-dessus de la Baltique, couronnée par une vieille hêtraie
      qui ondule sur les collines et vallons. Le Parc national de Jasmund, sur la péninsule éponyme au
      nord-est de l’île de Rügen, réunit ces deux trésors sur environ 3 070 hectares : c’est le plus petit
      parc national d’Allemagne, abritant 493 hectares de hêtraies protégées au patrimoine mondial de
      l’UNESCO.
    landscape: >-
      Tout débuta au Crétacé supérieur, il y a environ 70 millions d’années. La région était alors une mer
      tempérée où prospéraient d’innombrables algues calcaires unicellulaires. À leur mort, leurs débris
      minéraux retombèrent sur le fond, se compactant avec des coquilles pour former la roche crayeuse
      actuelle. Le littoral de Jasmund constitue la coupe géologique la plus remarquable du nord de
      l’Allemagne : une tranche ouverte à travers 70 millions d’années d’archives terrestres.


      Puis survint l’ère glaciaire. Les glaciers continentaux plièrent et morcelèrent la craie en blocs
      basculés, après quoi mer et intempéries prirent le relais. Des promontoires réputés comme le
      Königsstuhl, haut de 118 mètres, ou les Wissower Klinken n’ont pas été bâtis : ils ont été dégagés par
      l’érosion marine. Le phénomène se poursuit : depuis 7 000 ans, le trait de côte a reculé de près de deux
      kilomètres, et la falaise s’érode aujourd’hui d’environ trente centimètres par an. Les célèbres Wissower
      Klinken se sont en grande partie effondrées lors d’un spectaculaire éboulement le 24 février 2005.
      L’érosion s’est en outre accélérée après le dragage historique des gros blocs erratiques qui servaient
      de brise-lames naturels.


      Sur la craie règne la forêt. Jasmund protège la plus vaste hêtraie continue de la côte baltique
      allemande, où les milieux se succèdent sur un espace restreint : forêt, falaises, tourbières et pelouses
      calcaires sèches. Sur le plateau de la Stubnitz subsistent des cuvettes d’origine glaciaire occupées par
      des aulnaies humides ; les rebords secs abritent poiriers et pommiers sauvages, alisiers torminaux et
      ifs. Parmi les orchidées fleurit le sabot de Vénus, et le littoral nord accueille des plantes
      halophiles. Plusieurs ruisseaux nés dans les tourbières se jettent du haut des falaises dans la mer
      Baltique, créant des cascades rarissimes dans la plaine nord-allemande.
    wildlife: >-
      Le massif forestier abrite les grands mammifères : [cerf élaphe](/especie/cervus_elaphus/), daim,
      [chevreuil](/especie/capreolus_capreolus/), [sanglier](/especie/sus_scrofa/) et phoques au large.


      Les oiseaux scandent le calendrier naturel. Le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/), seigneur des lieux, niche au cœur de la Stubnitz, tandis que
      les hirondelles de rivage creusent leurs terriers dans les parois de craie. Le gobe-mouche nain niche
      dans les vieux hêtres sénescents. Au printemps, par journées ensoleillées, les [grues
      cendrées](/especie/grus_grus/) profitent des ascendances thermiques au-dessus de la forêt pour prendre
      de l’altitude avant la traversée maritime de la Baltique. Le long des ruisseaux clairs scintille le
      [martin-pêcheur d’Europe](/especie/alcedo_atthis/).


      Au sol, le lézard vivipare fréquente les sentiers ensoleillés, tandis que les zones humides accueillent
      couleuvre à collier, vipère péliade et coronelle lisse. Les ruisseaux limpides abritent une planaire
      alpine rescapée des glaciations, et la Stubnitz compte un millier d’espèces de coléoptères
      saproxyliques. Jasmund constitue l’unique station allemande de la Kreideeule, un papillon nocturne
      couleur crème inféodé à la craie. En hiver, truites de mer et saumons chassent le long des hauts-fonds
      côtiers.
    visit: >-
      L’itinéraire classique est le Hochuferweg, qui s’élance de Lohme et longe la crête côtière sur près de
      12 km jusqu’à Sassnitz sous le balisage blanc-bleu-blanc. Après environ 4 km, vous atteignez le centre
      Königsstuhl, et 5 km plus loin vous attend le Forum du patrimoine mondial, consacré aux hêtraies
      anciennes. Arrivé à Sassnitz, des bus réguliers permettent de regagner Lohme. Si vous préférez un
      circuit, la boucle Weißes Rügen part de la gare de Sassnitz et nécessite environ sept heures via le
      Königsstuhl et les vestiges des Wissower Klinken. Deux sentiers thématiques parcourent également le
      massif : le sentier de la Craie sur la cornise et le sentier de la Forêt depuis Hagen ; tous deux
      rejoignent le centre Königsstuhl. Les cyclistes disposent de pistes dédiées, mais le vélo est
      formellement interdit sur le sentier de crête du Hochuferweg.


      Le centre de visiteurs Königsstuhl propose une formidable immersion : quatre étages d’expositions
      interactives avec dix-huit salles thématiques, audioguides, cinéma et un skywalk accessible suspendu
      au-dessus du Königsstuhl offrant un panorama saisissant sur les falaises et la mer. Il a ouvert en mars
      2004 ; renseignez-vous sur les conditions d’admission des chiens.


      Au pied des falaises, la grève de galets recèle d’innombrables fossiles du Crétacé, notamment des
      rostres de bélemnites appelés Donnerkeile ou pierres de foudre, ainsi que des oursins fossiles et des
      éponges. Photographiez-les et laissez-les intacts sur place.
    history: >-
      La craie fut exploitée pendant des siècles dans des carrières littorales. En 1926, face au projet de
      réouverture d’une carrière abandonnée, la côte au nord de Sassnitz fut classée en réserve naturelle pour
      stopper l’exploitation industrielle. Le 12 septembre 1990, dans le cadre du programme de parcs
      nationaux, le site fut promu parc national. Une partie majeure de la hêtraie est classée au patrimoine
      mondial de l’UNESCO depuis le 25 juin 2011.
    before: >-
      Sur la plage de galets sous les falaises, les chutes de pierres et éboulements représentent un danger
      mortel permanent, particulièrement après de fortes pluies ou lors du dégel printanier. Conservez
      toujours une distance de sécurité par rapport au rebord supérieur et au pied des parois. Il est
      formellement obligatoire de rester sur les chemins balisés : quitter les sentiers détruit la flore et
      dérange les oiseaux nicheurs. Les chiens doivent être tenus en laisse. Plusieurs lignes d’autobus
      desservent les parkings et gares de Sassnitz.
  de:
    intro: >-
      Stelle dir ein siebzig Millionen Jahre altes, flaches Kreidemeer vor, dessen Grund sich Korn für Korn
      aus winzigen Skelettresten füllte. Das ist die Kreide. Heute ragt sie als blendend weiße Steilküste über
      der Ostsee auf, gekrönt von Buchenwäldern auf Hügeln und Bachtälern. Der Nationalpark Jasmund auf der
      Halbinsel Jasmund im Nordosten der Insel Rügen vereint beides auf rund 3.070 Hektar: Er ist Deutschlands
      kleinster Nationalpark mit 493 Hektar Buchenurwald als UNESCO-Welterbe.
    landscape: >-
      Alles begann am Ende der Kreidezeit vor rund 70 Millionen Jahren. Damals bedeckte ein seichtes Meer die
      Region, in dem Myriaden mikroskopischer Kalkalgen lebten. Nach ihrem Absterben sanken ihre Skelette zu
      Boden; dieser Niederschlag verfestigte sich zur heutigen Schreibkreide. Die Steilküste von Jasmund ist
      der bedeutendste geologische Aufschluss Norddeutschlands: ein Profil durch 70 Millionen Jahre
      Erdgeschichte.


      Später kamen die Gletscher der Eiszeit, falteten die Kreidebänke auf und zerbrachen sie in Schollen;
      seither leisten Brandung und Regen die Bildhauerarbeit. Der Königsstuhl mit seinen 118 Metern Höhe oder
      die Wissower Klinken wurden nicht erbaut, sondern von der Erosion aus dem Fels herausmodelliert. Der
      Prozess steht niemals still: In den letzten 7.000 Jahren wich das Kliff um fast zwei Kilometer zurück,
      gegenwärtig um rund dreißig Zentimeter pro Jahr. Die weltberühmten Wissower Klinken brachen am 24.
      Februar 2005 in weiten Teilen ins Meer ab. Die Erosion verstärkte sich noch, als man einst große
      Findlinge als Baumaterial vom Ufersaum entfernte, die als natürliche Wellenbrecher gedient hatten.


      Auf der Kreide thront der Wald: Jasmund schützt das größte zusammenhängende Buchenwaldgebiet an der
      deutschen Ostseeküste. Auf engstem Raum wechseln Wald, Kliff, Moor und Magerrasen. In der Stubnitz
      liegen abflusslose Kesselmoore mit Erlenbrüchen; auf trockenen Rinnen gedeihen Holz-Apfel, Wild-Birne,
      Elsbeere und Eibe. Unter den Orchideen wächst der Frauenschuh, und an der Nordküste herrscht
      Salzvegetation. Mehrere Quellbäche stürzen als seltene Wasserfälle über die Kreideabstürze direkt an den
      Ostseestrand.
    wildlife: >-
      Der Wald birgt Schalenwild: [Rothirsch](/especie/cervus_elaphus/), Damhirsch,
      [Reh](/especie/capreolus_capreolus/) und [Wildschwein](/especie/sus_scrofa/); vor der Küste rasten
      Kegelrobben und Seehunde.


      Vögel prägen die Jahreszeiten: Der [Seeadler](/especie/haliaeetus_albicilla/) horstet in den alten
      Buchen der Stubnitz, während Uferschwalben ihre Brutröhren in die Kreidewände graben. Der Zwergschnäpper
      brütet im Totholz. An sonnigen Frühlingstagen nutzen durchziehende [Kraniche](/especie/grus_grus/) die
      Thermik über dem Wald, um vor dem Ostseeflug an Höhe zu gewinnen. An den Bächen funkelt der
      [Eisvogel](/especie/alcedo_atthis/).


      Auf den sonnigen Pfaden sonnen sich Waldeidechsen, in Feuchtgebieten leben Ringelnatter, Kreuzotter und
      Schlingnatter. In klaren Quellbächen überdauerte die Alpen-Planarie als Eiszeitrelikt, und die Stubnitz
      zählt tausend holzbewohnende Käferarten. Jasmund ist zudem der einzige deutsche Lebensraum der
      Kreideeule, einer nachtaktiven Falterart. Im Winter jagen Meerforellen und Lachse in Küstennähe.
    visit: >-
      Der Klassiker unter den Wanderwegen ist der Hochuferweg: Er führt von Lohme aus fast 12 km an der
      Kliffkante entlang nach Sassnitz, markiert mit dem weiß-blau-weißen Zeichen. Nach rund 4 km erreichst du
      das Nationalpark-Zentrum Königsstuhl, und 5 km weiter informiert das UNESCO-Welterbeforum in der
      Waldhalle über Buchenurwälder. Von Sassnitz aus bringen dich Busse zurück nach Lohme. Als Rundtour
      empfiehlt sich die Route Weißes Rügen ab Sassnitz Bahnhof (ca. sieben Stunden Gehzeit) über den
      Königsstuhl und die Wissower Klinken. Zudem gibt es zwei Themenwege: den Kreideweg entlang des Kliffs
      und den Waldweg ab Hagen; beide münden am Königsstuhl. Radfahrer nutzen ausgewiesene Radwege; auf dem
      Hochuferweg ist Radfahren verboten.


      Das Nationalpark-Zentrum Königsstuhl erschließt die Geheimnisse der Kreidewelt: vier Ausstellungsetagen
      mit achtzehn Themenräumen, Audioguide, Kino und der barrierefreie Skywalk über dem Königsstuhl mit
      freiem Tiefblick. Eröffnet wurde es im März 2004; beachte die Regelungen zur Mitnahme von Hunden.


      Am Geröllstrand unterhalb der Kreidefelsen finden sich fossile Schätze wie Donnerkeile (fossile Schalen
      von kreidezeitlichen Belemniten), versteinertes Seeigel und Schwämme. Bitte fotografieren und unberührt
      am Strand liegen lassen.
    history: >-
      Kreideabbau prägte die Halbinsel über Jahrhunderte. Als 1926 ein stillgelegter Kreidebruch nördlich von
      Sassnitz reaktiviert werden sollte, wurde das Areal nach Bürgerprotesten zum Naturschutzgebiet erklärt,
      um den Abbau zu verhindern. Am 12. September 1990 wurde der Nationalpark im Rahmen des
      Nationalparkprogramms der DDR festgesetzt. Seit dem 25. Juni 2011 gehört ein Teil des Buchenwaldes zum
      UNESCO-Welterbe.
    before: >-
      Am Geröllstrand unterhalb der Kreidewände herrscht akute Lebensgefahr durch Felsabbrüche und
      Hangrutschungen, besonders nach Starkregen oder im Frühjahrsauftauen. Halte stets gebührenden
      Sicherheitsabstand zu Kliffkanten. Das strikte Wegegebot ist zwingend einzuhalten: Abseits der Pfade
      beginnt die Schutzzone empfindlicher Arten. Hunde gehören an die Leine. Buslinien verbinden die
      Parkplätze mit Sassnitz.
  it:
    intro: >-
      Immagina un mare caldo e poco profondo di settanta milioni di anni fa, il cui fondale si depositava
      granello dopo granello grazie a scheletri microscopici. Questa roccia è il gesso. Oggi si innalza bianca
      e a picco sul Mar Baltico, sormontata da una faggeta vetusta che riveste colline e valloni. Il Parco
      Nazionale di Jasmund, sull’omonima penisola nel nord-est dell’isola di Rügen, racchiude questi tesori in
      circa 3.070 ettari: è il parco nazionale più compatto della Germania, con 493 ettari di faggete
      dichiarate Patrimonio Mondiale UNESCO.
    landscape: >-
      La genesi risale al Cretaceo superiore, circa 70 milioni di anni fa. La regione era un mare calmo e poco
      profondo, popolato da innumerevoli alghe calcaree unicellulari. Morendo, i loro gusci microscopici
      precipitavano sui fondali, compattandosi insieme a resti fossili per formare il gesso puro attuale. La
      costa di Jasmund costituisce la finestra geologica più imponente della Germania settentrionale: una
      sezione aperta attraverso 70 milioni di anni di storia del nostro pianeta.


      Successivamente giunsero i ghiacci continentali, che piegarono e fratturarono le bancate di gesso in
      scaglie inclinate; da allora frangenti e piogge ne hanno cesellato i profili. Bastioni come il
      Königsstuhl, alto 118 metri, o le Wissower Klinken non sono stati costruiti: sono stati scolpiti
      dall’erosione marina. Il processo non conosce sosta: negli ultimi 7.000 anni la linea di costa è
      arretrata di quasi due chilometri e il bordo falesico arretra oggi di circa trenta centimetri all’anno.
      Le celebri Wissower Klinken sono crollate in gran parte a seguito di una frana il 24 febbraio 2005.
      L’erosione subì inoltre un’accelerazione quando i grandi massi erratici costieri vennero asportati per
      opere portuali.


      Sopra la scogliera trionfa il bosco: Jasmund custodisce la più vasta faggeta costiera indisturbata del
      Baltico tedesco, dove gli ambienti si alternano in spazi angusti: boschi, falesie, torbiere e praterie
      aride. Sull’altopiano della Stubnitz compaiono conche allagate d’origine glaciale orlate da ontani; sui
      costoni aridi allignano melo e pero selvatico, ciavardello e tasso. Tra le orchidee spicca la pianella
      di Madonna e sulla costa settentrionale crescono specie alofite. Vari ruscelli sgorgano dalle torbiere e
      precipitano dalle scogliere nel Baltico, generando rare cascate litoranee.
    wildlife: >-
      Il bosco dà rifugio a grandi mammiferi: [cervo nobile](/especie/cervus_elaphus/), daino,
      [capriolo](/especie/capreolus_capreolus/), [cinghiale](/especie/sus_scrofa/) e foche che nuotano sotto
      costa.


      L’avifauna scandisce le stagioni. L’[aquila di mare](/especie/haliaeetus_albicilla/), il rapace più
      imponente, nidifica nella Stubnitz, mentre i topini scavano nidi nei banchi di gesso sabbioso. Il
      pigliamosche pettirosso nidifica nei vecchi faggi cavi. Nelle mattine soleggiate di primavera, le
      [gru](/especie/grus_grus/) in migrazione sfruttano le correnti ascensionali sopra la foresta per
      guadagnare quota prima di sorvolare il Baltico. Lungo i corsi d’acqua montani si avvista il [martin
      pescatore](/especie/alcedo_atthis/).


      Al suolo la lucertola vivipara frequenta i sentieri assolati, mentre nelle zone umide vivono biscia dal
      collare, vipera comune e coronella austriaca. Nelle acque fredde dei torrenti nuota la planaria alpina,
      relitto dell’era glaciale, e la Stubnitz conta un migliaio di coleotteri legati al legno morto. Jasmund
      è l’unico biotopo tedesco della falena notturna Kreideeule. In inverno trote di mare e salmoni cercano
      nutrimento lungo i fondali costieri.
    visit: >-
      L’itinerario d’elezione è lo Hochuferweg, che parte da Lohme e si snoda per quasi 12 km sul ciglio
      falesico fino a Sassnitz, seguendo il segnavia bianco-blu-bianco. Dopo circa 4 km si raggiunge il centro
      visite Königsstuhl, e 5 km oltre attende il Forum del Patrimonio Mondiale presso la Waldhalle. Giunti a
      Sassnitz, comodi autobus riportano a Lohme. Per un tour ad anello, il sentiero Weißes Rügen parte dalla
      stazione di Sassnitz e dura circa sette ore toccando il Königsstuhl e le rovine delle Wissower Klinken.
      Vi sono due percorsi tematici: il Sentiero del Gesso sul crinale e il Sentiero del Bosco da Hagen;
      entrambi convergono sul centro visite. I ciclisti dispongono di piste dedicate, ma le biciclette sono
      vietate sullo Hochuferweg.


      Il centro visitatori Königsstuhl offre un’avvincente introduzione: quattro piani espositivi con diciotto
      sale tematiche, audioguide, cinema e lo skywalk accessibile sospeso a sbalzo sopra il Königsstuhl con
      visuali emozionanti. È stato inaugurato nel marzo 2004; informati sulle condizioni per l’accesso con
      cani.


      Sulla spiaggia ciottolosa alla base dei faraglioni si rinvengono fossili del Cretaceo, tra cui i
      caratteristici belemniti detti Donnerkeile, ricci di mare fossili e spugne. Fotografali e lasciali sul
      bagnasciuga.
    history: >-
      L’estrazione del gesso ha segnato l’isola per generazioni. Nel 1926, quando si tentò di riaprire una
      cava dismessa a nord di Sassnitz, le proteste della cittadinanza portarono all’istituzione di una
      riserva naturale per scongiurarne la distruzione. Il 12 settembre 1990 l’area venne elevata a parco
      nazionale nell’ambito del programma della Repubblica Democratica Tedesca. Un nucleo cospicuo delle
      faggete è patrimonio mondiale UNESCO dal 25 giugno 2011.
    before: >-
      Lungo la spiaggia sassosa sotto le pareti vige un grave pericolo di frane e crolli, in particolare dopo
      piogge prolungate o durante il disgelo primaverile. Mantieni sempre un’adeguata distanza di sicurezza
      dal ciglio superiore e dalla base delle rupi. È fatto obbligo assoluto di non lasciare i sentieri
      segnati per non turbare flora e fauna. I cani devono essere tenuti al guinzaglio. Linee di autobus
      collegano i parcheggi periferici a Sassnitz.
  pt:
    intro: >-
      Imagina um mar tépido de águas pouco profundas há setenta milhões de anos, cujo leito sedimentou grão a
      grão a partir de esqueletos microscópicos. Isso é o cré. Hoje ergue-se em paredões verticais de brancura
      ofuscante sobre o Mar Báltico, encimado por uma floresta vetusta de faia cobrindo cerros e vales de
      torrente. O Parque Nacional de Jasmund, na península homónima no nordeste da ilha de Rügen, congrega
      ambas as maravilhas em cerca de 3.070 hectares: é o mais diminuto parque nacional alemão, ostentando 493
      hectares de florestas de faia inscritas no Património Mundial da UNESCO.
    landscape: >-
      Tudo principiou nos finais do Cretácico, há cerca de 70 milhões de anos. A região era então um mar raso
      povoado por miríades de algas calcárias microscópicas. Ao perecerem, as carapaças minerais tombaram para
      o fundo marinho, compactando-se em cré puro. A orla costeira de Jasmund configura o afloramento
      geológico mais espetacular do norte da Alemanha: uma secção a céu aberto recortando 70 milhões de anos
      de memória fóssil da Terra.


      Depois sobreveio a Idade do Gelo: os glaciares comprimiram e fraturaram as camadas de cré em blocos
      inclinados, passando o mar e a chuva a moldar o relevo. Miradouros célebres como o Königsstuhl, com 118
      metros de altura, ou as Wissower Klinken não foram erigidos, mas sim talhados pela erosão marinha. O
      fenómeno nunca cessou: nos últimos 7.000 anos a linha costeira recuou quase dois quilómetros, recuando
      atualmente cerca de trinta centímetros por ano. As mundialmente consagradas Wissower Klinken desabaram
      em grande parte após um desmoronamento a 24 de fevereiro de 2005. A erosão foi agravada pela retirada
      histórica de grandes blocos erráticos costeiros que funcionavam como quebra-mares naturais.


      Sobre o cré assenta a floresta: Jasmund preserva a maior mancha contínua de faia da orla báltica alemã,
      onde biótopos se sucedem num perímetro compacto: mata madura, escarpas marinhas, turfeiras e prados
      secos. Na Stubnitz encontram-se depressões glaciares ocupadas por amiais pantanosos; nos cumes secos
      medram macieiras e pereiras bravas, tramazeiras-das-rochas e teixos. Entre as orquídeas ressalva-se o
      sapatinho-de-vénus, e o litoral norte acolhe flora halófila. Vários ribeiros nascem nas turfeiras e
      precipitam-se pelas arribas no Báltico, formando cascatas raras na planície setentrional.
    wildlife: >-
      O arvoredo abriga os grandes ungulados: [veado-vermelho](/especie/cervus_elaphus/), gamo,
      [corço](/especie/capreolus_capreolus/), [javali](/especie/sus_scrofa/) e focas que descansam na costa.


      As aves definem o pulsar anual. A [águia-rabalva](/especie/haliaeetus_albicilla/), a rainha das rapinas,
      nidifica na Stubnitz, enquanto andorinhas-das-barreiras escavam galerias nas arribas brandas. O
      papa-moscas-pequeno procria em faias senescentes. Na primavera, em manhãs solarengas,
      [grous](/especie/grus_grus/) em trânsito aproveitam térmicas ascendentes sobre a mata para ganhar
      altitude antes da travessia marítima. Junto aos cursos de água límpidos cintila o
      [guarda-rios-comum](/especie/alcedo_atthis/).


      Nos trilhos soalheiros é comum a lagartixa-da-floresta, ao passo que nos charcos vicejam a
      cobra-de-água-de-colar, a víbora-comum e a cobra-lisa. Em regatos frios subsiste uma planária alpina
      relicta da Idade do Gelo, e a Stubnitz contabiliza um milhar de espécies de escaravelhos da madeira
      morta. Jasmund constitui o único reduto alemão da mariposa noturna Kreideeule. No inverno,
      trutas-marinhas e salmões caçam nas águas litorais.
    visit: >-
      O percurso clássico por excelência é o Hochuferweg, que parte de Lohme e percorre quase 12 km pelo
      rebordo alcantilado até Sassnitz, seguindo as marcas branca, azul e branca. Após cerca de 4 km alcanças
      o centro Königsstuhl, e 5 km mais adiante situa-se o Fórum do Património Mundial na Waldhalle. Chegando
      a Sassnitz, carreiras de autocarro asseguram o regresso a Lohme. Se preferires um itinerário circular, o
      circuito Weißes Rügen parte da estação de Sassnitz e dura cerca de sete horas, passando pelo Königsstuhl
      e pelas ruínas das Wissower Klinken. Existem dois trilhos temáticos: o Trilho do Cré pela escarpa e o
      Trilho da Floresta desde Hagen; ambos convergem no centro Königsstuhl. Os ciclistas contam com pistas
      próprias, sendo estritamente vedado pedalar no Hochuferweg.


      O centro de acolhimento Königsstuhl faculta uma excelente imersão: quatro pisos de mostras com dezoito
      salas temáticas, audioguias, cinema e um skywalk suspenso sobre o Königsstuhl proporcionando vistas
      arrebatadoras sobre as arribas e o mar. Abriu em março de 2004; confirma as normas para animais de
      companhia.


      No sopé das escarpas encontram-se fósseis do Cretácico, como belemnites apelidados Donnerkeile ou raios
      de trovão, ouriços-do-mar fossilizados e esponjas. Tira fotografias e deixa tudo no local.
    history: >-
      O cré foi extraído durante séculos em pedreiras costeiras. Em 1926, quando se projetou a reativação de
      uma pedreira a norte de Sassnitz, a mobilização popular conduziu à classificação da orla como reserva
      natural para travar a exploração. A 12 de setembro de 1990, no âmbito do programa de conservação da RDA,
      a área foi elevada a parque nacional. Um setor substancial das florestas de faia integra o Património
      Mundial da UNESCO desde 25 de junho de 2011.
    before: >-
      Na praia de calhaus sob as falésias existe risco de morte por queda de pedras e derrocadas, sobretudo
      após chuvas intensas ou durante o degelo primaveril. Mantém sempre uma distância prudencial em relação
      às cristas e bases das arribas. É estritamente obrigatório não abandonar os trilhos para salvaguardar a
      fauna e a flora. Os cães circulam com trela. Várias linhas de autocarro ligam Sassnitz aos parques de
      estacionamento.
