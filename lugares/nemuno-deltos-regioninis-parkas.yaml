resumen:
  es: >-
    Delta interior y estuario de inundación en la laguna de Curlandia, punto caliente principal de
    anillamiento de aves migratorias del Báltico.
  en: >-
    Inland delta and floodplain estuary on the Curonian Lagoon, the primary ringing hotspot for migratory
    birds along the Baltic.
  fr: >-
    Delta intérieur et estuaire d'inondation sur la lagune de Courlande, haut lieu majeur de baguage des
    oiseaux migrateurs de la Baltique.
  de: >-
    Binnendelta und Überschwemmungsästuar am Kurischen Haff, zentraler Beringungs-Hotspot für Zugvögel an der
    Ostsee.
  it: >-
    Delta interno ed estuario alluvionale sulla laguna di Curlandia, principale polo di inanellamento
    dell'avifauna migratoria del Baltico.
  pt: >-
    Delta interior e estuário de inundação na lagoa da Curlândia, principal polo de anilhagem de aves
    migradoras do Báltico.
unico:
  es: >-
    Un delta entero que vive de sus crecidas, y que además está en una ruta migratoria que une el Paleártico
    occidental, Europa y África, de modo que las aves paran aquí a descansar y a criar.
  en: >-
    An entire delta sustained by periodic inundations, situated along a vital flyway connecting the Western
    Palearctic, Europe and Africa, where birds pause to rest and breed.
  fr: >-
    Un delta entier façonné par ses crues, situé sur une voie migratoire reliant le Paléarctique occidental,
    l'Europe et l'Afrique, où les oiseaux font escale pour se reposer et nicher.
  de: >-
    Ein ganzes Flussdelta, das von seinen Überschwemmungen lebt und an einer Zugroute liegt, die Paläarktis,
    Europa und Afrika verbindet.
  it: >-
    Un intero delta alimentato dalle sue piene, situato su una rotta migratoria che connette Paleartico
    occidentale, Europa e Africa.
  pt: >-
    Um delta inteiro que depende das suas cheias, situado numa rota migratória que une o Paleártico Ocidental,
    a Europa e África.
observaciones:
  es: >-
    Las crecidas de primavera cambian el acceso: comprueba antes con el gestor cómo están los caminos y los
    sectores abiertos.
texto:
  es:
    intro: >-
      Cada primavera, y a veces en pleno invierno, el Nemunas se sale de madre. Las aguas cubren cientos de
      kilómetros cuadrados de prados y campos, y las granjas quedan como islotes a los que solo se llega en
      barca. Ese es el pulso del Parque Regional del Delta del Nemunas, en la orilla sureste de la laguna de
      Curlandia: un entramado de islas, brazos de río, praderas inundables, turberas y bosques que el agua
      rehace cada año.
    landscape: >-
      Piensa en el parque como un laberinto de agua. Los brazos del delta (Atmata, Pakalnė, Skatulė, Skirvytė,
      Vytinė, Vorusnė) se cruzan con la isla de Rusnė, con Ventės ragas y con Žalgiriai, y una quinta parte de
      la superficie es agua, con el lago lagunar Krokų Lanka entre los más conocidos. En la isla de Rusnė está
      el punto más bajo de Lituania, a 0,27 m bajo el nivel del mar. Alrededor se extienden meandros
      abandonados, pantanos y turberas bajas entre los brazos del delta y los bosques cercanos; el bosque
      ocupa solo el diez por ciento del territorio.


      Las crecidas no solo inundan. El limo que dejan abona los prados, que en verano se siegan hasta cuatro
      veces. Y donde el agua se mantiene fuera por diques, hay pólderes: praderas bajas protegidas de las
      inundaciones permanentes o periódicas.


      Entre todas las piezas destaca la turbera de Aukštumala, la primera turbera alta descrita
      científicamente en el mundo. En 1902 el botánico alemán C. A. Weber escribió sobre ella la primera
      monografía mundial sobre turberas. En la parte que se conserva siguen quedando ochenta y ocho pequeños
      lagos residuales.
    wildlife: >-
      Aquí se apunta el calendario de las aves. Se han registrado unas trescientas especies, y ciento sesenta
      y nueve crían. En primavera y otoño paran a descansar grandes bandadas de gansos y patos, y muchas aves
      limícolas. En Ventės ragas, una estación ornitológica fundada en 1929, cuentan que en la migración de
      otoño llegan a pasar hasta un millón de aves en un día, y que entre sesenta y cien mil se anillan cada
      año.


      Para verlas hay torres de observación de aves, y hay miradores en el faro de Ventė, en el puente de
      hierro sobre el Minija, junto a Kintai, y en el faro de Uostadvaris, en la isla de Rusnė. La estación de
      Ventės ragas tiene además un museo sobre la naturaleza del delta y el anillamiento, con una exposición
      sobre la historia del anillamiento y las aves migratorias e invernantes.
    visit: >-
      El delta se deja recorrer despacio. Hay tres senderos naturales, Žalgiriai, Pakalnė y Aukštumalė, y
      varias rutas en bicicleta. Por la isla de Rusnė se llega pedaleando al faro de Uostadvaris, a una torre
      de aves y al lago Juodvalkis. Desde Šilutė hay otra ruta que pasa por la turbera de Aukštumala, el lago
      Krokų Lanka y el río Minija hasta Ventės ragas y Kintai.


      Las rutas turísticas acuáticas permiten recorrer el delta en embarcaciones pequeñas, botes o kayaks. En
      primavera, con las crecidas, el agua manda sobre el mapa: las granjas solo se alcanzan en barca.
    history: >-
      El parque se fundó el 24 de septiembre de 1992 para conservar el paisaje del bajo Nemunas, su ecosistema
      y su patrimonio cultural, y en 1993 el delta entró en la lista Ramsar de humedales de importancia
      internacional. En 2009 recibió el premio EDEN de destino europeo de excelencia, en la categoría de
      destino turístico no tradicional.


      La gente aprendió a vivir con el agua. La zona forma parte de la región etnocultural de Lituania Menor.
      Los faros de Uostadvaris y Ventė, la estación de bombeo y los pólderes son las obras que mejor reflejan
      esa relación. En Skirvytėlė se conserva un conjunto de arquitectura popular con una granja etnográfica
      convertida en museo, y el pueblo de Mingė se llama la Venecia de Lituania porque el río Minija es su
      calle principal.
    before: >-
      Las crecidas de primavera cambian el acceso: comprueba antes con el gestor cómo están los caminos y los
      sectores abiertos.
    around: >-
      A siete kilómetros está el [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/), vecino del delta. Lejos de aquí, el [ZEC Humedal de
      La Nava y Campos de Palencia](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) comparte con el delta
      el carricerín cejudo y el hábitat de humedal.
  en:
    intro: >-
      Every spring, and occasionally in the depths of winter, the Nemunas bursts its banks. Floodwaters
      submerge hundreds of square kilometres of meadows and fields, transforming homesteads into isolated
      islands accessible solely by boat. Such is the living pulse of Nemunas Delta Regional Park on the
      southeastern shore of the Curonian Lagoon: an intricate mosaic of islands, river channels, floodplain
      meadows, raised bogs and woodlands remade each year by water.
    landscape: >-
      Picture the park as a sprawling aquatic labyrinth. The delta's distributary arms—Atmata, Pakalnė,
      Skatulė, Skirvytė, Vytinė and Vorusnė—interlace with Rusnė Island, Ventės ragas and Žalgiriai, with open
      water covering one-fifth of the surface, anchored by Krokų Lanka lagoon. On Rusnė Island lies the lowest
      point in Lithuania, dipping to 0.27 m below sea level. Oxbows, marshlands and fens unfold between
      distributaries and adjacent woodlands; forest covers just ten percent of the landscape.


      Floods do more than submerge the land. The nutrient-rich silt they deposit fertilizes meadows, which are
      mown up to four times in summer. Where dykes keep water at bay lie polders: low-lying pastures
      safeguarded from permanent or seasonal inundation.


      Chief among these wild habitats is the Aukštumala mire, the first raised bog in the world to be
      described scientifically. In 1902 German botanist C. A. Weber published the world's first monograph
      dedicated to peat bogs based on this site. Across the preserved expanse remain eighty-eight small
      residual mire lakes.
    wildlife: >-
      Here the calendar of bird migration is written. Roughly three hundred bird species have been recorded,
      of which one hundred and sixty-nine breed. In spring and autumn, massive flocks of geese, ducks and
      waders stage here to refuel. At Ventės ragas, an ornithological station established in 1929, up to one
      million birds pass overhead on peak autumn days, with between sixty and one hundred thousand ringed
      annually.


      For birdwatching, the park provides observation towers and viewpoints at Ventė lighthouse, the iron
      bridge over the Minija near Kintai, and Uostadvaris lighthouse on Rusnė Island. The Ventės ragas station
      also houses a museum dedicated to delta wildlife and ringing, with displays charting the history of bird
      ringing and migratory pathways.
    visit: >-
      The delta rewards slow exploration. Three nature trails—Žalgiriai, Pakalnė and Aukštumalė—and several
      cycling itineraries traverse the park. On Rusnė Island, cycling trails connect Uostadvaris lighthouse, a
      birdwatching tower and Lake Juodvalkis. From Šilutė, another route passes through Aukštumala peat bog,
      Lake Krokų Lanka and along the Minija River to Ventės ragas and Kintai.


      Water tourist routes enable visitors to explore the delta in small boats, launches or kayaks. In spring
      during high floods, the water dictates the map: farms can only be reached by boat.
    history: >-
      The park was established on 24 September 1992 to protect the unique landscapes of the lower Nemunas, its
      ecosystems and cultural heritage; in 1993 the delta joined the Ramsar list of wetlands of international
      importance. In 2009 it received the European Destinations of Excellence (EDEN) award in the
      non-traditional tourist destination category.


      Local communities learned to thrive alongside the floods. The area forms part of the ethnocultural
      region of Lithuania Minor. The lighthouses of Uostadvaris and Ventė, historic pumping stations and
      polder dykes illustrate this harmonious co-existence. In Skirvytėlė, traditional timber vernacular
      architecture is preserved in an ethnographic homestead museum, while the village of Mingė is known as
      the Venice of Lithuania because the river Minija serves as its main street.
    before: >-
      Spring floods alter access routes dramatically: check with park managers in advance regarding road
      conditions and accessible sectors.
    around: >-
      Seven kilometres away across the lagoon lies [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/). Further afield, [ZEC Humedal de La Nava y Campos de
      Palencia](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) shares wetland habitats and aquatic
      warbler migration stopovers.
  fr:
    intro: >-
      Chaque printemps, et parfois en plein hiver, le Niémen déborde de son lit. Les eaux submergent des
      centaines de kilomètres carrés de prés et de cultures, isolant les fermes en îlots accessibles
      uniquement en barque. Tel est le rythme du parc régional du delta du Niémen, sur la rive sud-est de la
      lagune de Courlande : un dédale d'îles, de bras fluviaux, de prairies inondables, de tourbières et de
      forêts que l'eau réinvente chaque année.
    landscape: >-
      Songez au parc comme à un labyrinthe aquatique. Les bras du delta (Atmata, Pakalnė, Skatulė, Skirvytė,
      Vytinė, Vorusnė) s'entrecroisent avec l'île de Rusnė, le cap de Ventė et Žalgiriai, un cinquième de la
      surface étant formé d'eau libre, avec le lac lagunaire de Krokų Lanka parmi les plus renommés. Sur l'île
      de Rusnė se trouve le point le plus bas de Lituanie, à 0,27 m sous le niveau de la mer. Alentour
      s'étendent méandres abandonnés, marais et tourbières basses entre les bras du delta et les lisières ; la
      forêt ne couvre que dix pour cent du territoire.


      Les crues ne font pas que submerger. Le limon qu'elles déposent fertilise les prés, fauchés en été
      jusqu'à quatre fois. Et là où des digues contiennent les eaux s'étendent des polders : des prairies
      basses préservées des inondations régulières.


      Parmi tous ces milieux émerge la tourbière d'Aukštumala, la première tourbière haute étudiée
      scientifiquement au monde. En 1902, le botaniste allemand C. A. Weber y consacra la première monographie
      mondiale sur les tourbières. Dans la partie intacte subsistent quatre-vingt-huit petits lacs résiduels.
    wildlife: >-
      C'est ici que s'écrit le calendrier des oiseaux. Quelque trois cents espèces ont été répertoriées, dont
      cent soixante-neuf sont nicheuses. Au printemps et à l'automne s'y rassemblent de grands vols d'oies, de
      canards et de limicoles. Au cap Ventė, station ornithologique fondée en 1929, on relate qu'aux pics de
      la migration d'automne jusqu'à un million d'oiseaux défilent en une seule journée, et que soixante à
      cent mille oiseaux y sont bagués chaque année.


      Pour les observer se dressent des tours d'affût et des belvédères au phare de Ventė, sur le pont
      métallique enjambant la Minija près de Kintai, et au phare d'Uostadvaris sur l'île de Rusnė. La station
      de Ventė abrite un musée du delta et du baguage, avec une exposition sur l'histoire des études
      migratoires.
    visit: >-
      Le delta s'explore en prenant son temps. Il existe trois sentiers de nature, Žalgiriai, Pakalnė et
      Aukštumalė, ainsi que plusieurs circuits cyclables. L'île de Rusnė se parcourt à vélo jusqu'au phare
      d'Uostadvaris, à une tour ornithologique et au lac Juodvalkis. Depuis Šilutė, un autre parcours traverse
      la tourbière d'Aukštumala, le lac Krokų Lanka et longe la Minija jusqu'au cap Ventė et Kintai.


      Des circuits nautiques permettent de sillonner le delta en petites embarcations ou en kayak. Au
      printemps, lors des crues, l'eau dicte ses lois : les fermes ne se rallient qu'en bateau.
    history: >-
      Le parc a été créé le 24 septembre 1992 pour préserver les paysages du bas Niémen, leurs écosystèmes et
      leur patrimoine culturel ; en 1993, le delta a rejoint la liste Ramsar des zones humides d'importance
      internationale. En 2009, il a reçu le prix EDEN récompensant les destinations européennes d'excellence.


      Les habitants ont appris à composer avec les eaux. La zone appartient à la région ethnoculturelle de
      Petite-Lituanie. Les phares d'Uostadvaris et de Ventė, la station de pompage et les polders témoignent
      de cette relation singulière. À Skirvytėlė est préservé un ensemble d'architecture traditionnelle dans
      une ferme ethnographique transformée en musée, et le village de Mingė est surnommé la Venise lituanienne
      car la rivière Minija y tient lieu de rue principale.
    before: >-
      Les crues printanières modifient les accès : vérifiez au préalable auprès des gestionnaires l'état des
      chemins et des secteurs praticables.
    around: >-
      À sept kilomètres s'étend le [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/), voisin du delta. Plus loin, le [ZEC Humedal de La
      Nava y Campos de Palencia](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) partage le phragmite
      aquatique et les milieux humides.
  de:
    intro: >-
      Jedes Frühjahr, und zuweilen mitten im Winter, tritt die Memel über die Ufer. Die Fluten ertränken
      Hunderte Quadratkilometer Wiesen und Felder, und Bauernhöfe ragen wie Inseln heraus, die nur per Boot
      erreichbar sind. Das ist der Puls des Regionalparks Memeldelta am Südostufer des Kurischen Haffs: ein
      Netz aus Inseln, Flussarmen, Feuchtwiesen, Mooren und Bruchwäldern, das das Wasser jedes Jahr neu formt.
    landscape: >-
      Stell dir den Park als Wasserlabyrinth vor. Die Deltaarme (Atmata, Pakalnė, Skatulė, Skirvytė, Vytinė,
      Vorusnė) umschlingen die Insel Rusnė, Ventės ragas und Žalgiriai; ein Fünftel der Fläche ist Wasser,
      darunter der Haffsee Krokų Lanka. Auf der Insel Rusnė liegt der tiefste Punkt Litauens mit 0,27 m unter
      dem Meeresspiegel. Ringsum dehnen sich Altarme, Riede und Niedermoore aus; Wald bedeckt nur zehn Prozent
      des Gebiets.


      Die Fluten bringen nicht nur Wasser. Der abgelagerte Schlick düngt die Wiesen, die im Sommer bis zu
      viermal gemäht werden. Hinter Deichen liegen Polder: eingedeichte Wiesen, geschützt vor dauerhafter
      Überflutung.


      Unter allen Mooren ragt das Hochmoor Aukštumala heraus, das weltweit erste wissenschaftlich beschriebene
      Hochmoor. 1902 verfasste der deutsche Botaniker C. A. Weber darüber die weltweit erste Moor-Monografie.
      Im erhaltenen Teil liegen achtundachtzig Mooraugen.
    wildlife: >-
      Hier wird der Zugvogelkalender geschrieben. Rund dreihundert Vogelarten wurden nachgewiesen, von denen
      einhundertneunundsechzig brüten. Im Frühjahr und Herbst rasten riesige Züge von Gänsen, Enten und
      Watvögeln. An der 1929 gegründeten Vogelwarte Ventės ragas ziehen an Herbstspitzentagen bis zu einer
      Million Vögel an einem Tag vorbei; jährlich werden sechzig- bis hunderttausend Vögel beringt.


      Zur Vogelbeobachtung stehen Türme und Aussichtspunkte am Leuchtturm Ventė, an der Eisenbrücke über die
      Minija bei Kintai und am Leuchtturm Uostadvaris auf Rusnė bereit. Die Station Ventės ragas beherbergt
      zudem ein Museum über Deltanatur und Vogelberingung.
    visit: >-
      Das Delta lässt sich gemächlich erkunden. Es gibt drei Naturlehrpfade—Žalgiriai, Pakalnė und
      Aukštumalė—sowie mehrere Radrouten. Auf der Insel Rusnė radelt man zum Leuchtturm Uostadvaris, zu einem
      Vogelbeobachtungsturm und zum Juodvalkis-See. Ab Šilutė führt eine Route über das Hochmoor Aukštumala,
      den See Krokų Lanka und die Minija nach Ventės ragas und Kintai.


      Wasserwanderrouten erschließen das Delta im Boot oder Kajak. Im Frühjahr während des Hochwassers
      bestimmt das Wasser die Wege: Höfe sind nur noch per Boot erreichbar.
    history: >-
      Der Park wurde am 24. September 1992 gegründet, um Landschaft, Ökosysteme und Kulturgüter der unteren
      Memel zu bewahren; 1993 wurde das Delta Ramsar-Gebiet von internationaler Bedeutung. 2009 erhielt es den
      EDEN-Award als herausragendes europäisches Reiseziel.


      Die Bewohner passten sich dem Wasser an. Das Gebiet gehört zur Region Kleinlitauen. Die Leuchttürme von
      Uostadvaris und Ventė, Pumpstationen und Polder spiegeln dies wider. In Skirvytėlė zeigt ein
      Freilichtmuseum historische Holzarchitektur, und das Dorf Mingė wird als litauisches Venedig bezeichnet,
      da der Fluss Minija als Dorfstraße dient.
    before: >-
      Frühjahrshochwasser verändern die Erreichbarkeit grundlegend: Informiere dich vorab bei der
      Parkverwaltung über befahrbare Wege.
    around: >-
      Sieben Kilometer entfernt liegt der benachbarte [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/). Weiter entfernt teilt das Schutzgebiet [ZEC Humedal
      de La Nava y Campos de Palencia](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) Seggenrohrsänger
      und Feuchtbiotope.
  it:
    intro: >-
      Ogni primavera, e talvolta nel cuore dell'inverno, il Nemunas rompe gli argini. Le acque sommergono
      centinaia di chilometri quadrati di prati e campi, trasformando le fattorie in isolotti raggiungibili
      unicamente in barca. È il respiro vitale del Parco Regionale del Delta del Nemunas, sulla sponda
      sud-orientale della laguna di Curlandia: un intreccio di isole, rami fluviali, prati inondabili,
      torbiere e boschi che l'acqua rimodella ogni anno.
    landscape: >-
      Pensa al parco come a un dedalo d'acqua. I bracci del delta (Atmata, Pakalnė, Skatulė, Skirvytė, Vytinė,
      Vorusnė) si incrociano con l'isola di Rusnė, Ventės ragas e Žalgiriai; un quinto della superficie è
      coperto da specchi d'acqua, tra cui il lago lagunare Krokų Lanka. Sull'isola di Rusnė si trova il punto
      più depresso della Lituania, a 0,27 m sotto il livello del mare. Tutt'intorno si allungano meandri
      morti, acquitrini e torbiere basse; la foresta copre appena il dieci per cento del territorio.


      Le piene non si limitano a inondare. Il limo depositato fertilizza i prati, falciati in estate fino a
      quattro volte. E dove le dighe arginano le acque si aprono i polder: prati bassi protetti da allagamenti
      permanenti.


      Tra tutti i biotopi spicca la torbiera di Aukštumala, la prima torbiera alta al mondo a essere descritta
      scientificamente. Nel 1902 il botanico tedesco C. A. Weber vi scrisse la prima monografia mondiale sulle
      torbiere. Nella porzione intatta rimangono ottantotto laghetti residui.
    wildlife: >-
      Qui si registra il calendario dell'avifauna. Sono state censite circa trecento specie, di cui
      centosessantanove nidificanti. In primavera e autunno vi sostano stormi imponenti di oche, anatre e
      limicoli. A Ventės ragas, stazione ornitologica nata nel 1929, transitano nei giorni di punta autunnali
      fino a un milione di uccelli in un solo giorno, e tra sessanta e centomila esemplari vengono inanellati
      ogni anno.


      Per il birdwatching sono attive torrette d'avvistamento e belvedere presso il faro di Ventė, sul ponte
      metallico sul Minija vicino a Kintai e al faro di Uostadvaris sull'isola di Rusnė. La stazione di Ventės
      ragas ospita un museo sul delta e sull'inanellamento.
    visit: >-
      Il delta si visita con lentezza. Sono tracciati tre sentieri didattici—Žalgiriai, Pakalnė e Aukštumalė—e
      vari itinerari ciclabili. Sull'isola di Rusnė si pedala fino al faro di Uostadvaris, a una torretta
      d'avvistamento e al lago Juodvalkis. Da Šilutė una rotta attraversa la torbiera di Aukštumala, il lago
      Krokų Lanka e costeggia il Minija fino a Ventės ragas e Kintai.


      Itinerari nautici permettono di solcare il delta su piccole imbarcazioni o kayak. In primavera, con le
      piene, l'acqua comanda: le case coloniche si raggiungono solo in barca.
    history: >-
      Il parco è stato istituito il 24 settembre 1992 per tutelare i paesaggi del basso Nemunas, gli
      ecosistemi e il patrimonio storico; nel 1993 il delta è entrato nell'elenco Ramsar delle zone umide
      d'importanza internazionale. Nel 2009 ha ricevuto il premio EDEN tra le mete europee d'eccellenza.


      Le comunità locali hanno imparato a convivere con le acque. L'area appartiene alla regione etnoculturale
      della Lituania Minore. I fari di Uostadvaris e Ventė, le idrovore e i polder testimoniano questo legame.
      A Skirvytėlė si conserva un nucleo di architettura rurale in una fattoria etnografica musealizzata, e il
      borgo di Mingė è detto la Venezia della Lituania perché il fiume Minija funge da via principale.
    before: >-
      Le piene primaverili alterano la viabilità: verifica in anticipo con l'ente gestore lo stato delle
      strade e dei varchi aperti.
    around: >-
      A sette chilometri sorge il contiguo [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/). Più lontano, il sito [ZEC Humedal de La Nava y
      Campos de Palencia](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) condivide il pagliarolo e gli
      ambienti umidi.
  pt:
    intro: >-
      Em cada primavera, e por vezes em pleno inverno, o Nemunas transborda. As águas cobrem centenas de
      quilómetros quadrados de prados e campos, transformando as quintas em ilhotas acessíveis apenas por
      barco. Esse é o pulsar do Parque Regional do Delta do Nemunas, na margem sudeste da lagoa da Curlândia:
      um labirinto de ilhas, esteiros fluviais, prados inundáveis, turfeiras e matas que as cheias reconstroem
      a cada ano.
    landscape: >-
      Imagina o parque como um labirinto aquático. Os braços do delta (Atmata, Pakalnė, Skatulė, Skirvytė,
      Vytinė, Vorusnė) cruzam-se com a ilha de Rusnė, Ventės ragas e Žalgiriai; um quinto da área é água,
      destacando-se a lagoa de Krokų Lanka. Na ilha de Rusnė situa-se a cota mais baixa da Lituânia, a 0,27 m
      abaixo do nível do mar. Em redor estendem-se meandros mortos, pântanos e turfeiras baixas; o arvoredo
      ocupa apenas dez por cento do território.


      As cheias não se limitam a inundar. O lodo que depositam aduba os prados, que no verão são ceifados até
      quatro vezes. E onde os diques contêm as águas abrem-se pólderes: prados baixos protegidos de cheias
      permanentes.


      Entre todas as peças ressalta a turfeira de Aukštumala, a primeira turfeira alta do mundo descrita
      cientificamente. Em 1902 o botânico alemão C. A. Weber publicou a primeira monografia mundial sobre
      turfeiras dedicada a esta área. Na parcela preservada subsistem oitenta e oito pequenas lagoas
      residuais.
    wildlife: >-
      Aqui regista-se o calendário das aves. Foram recenseadas cerca de trezentas espécies, das quais cento e
      sessenta e nove nidificam. Na primavera e no outono concentram-se bandos imensos de gansos, patos e
      limícolas. Em Ventės ragas, posto ornitológico fundado em 1929, relata-se que no auge da migração otoñal
      passam até um milhão de aves num único dia, sendo anilhadas entre sessenta e cem mil aves todos os anos.


      Para observação de aves existem torres e miradouros no farol de Ventė, na ponte metálica sobre o Minija
      perto de Kintai e no farol de Uostadvaris na ilha de Rusnė. A estação de Ventės ragas possui ainda um
      museu sobre a natureza do delta e a anilhagem.
    visit: >-
      O delta descobre-se sem pressas. Existem três trilhos interpretativos—Žalgiriai, Pakalnė e Aukštumalė—e
      diversos circuitos de bicicleta. Na ilha de Rusnė pedala-se até ao farol de Uostadvaris, a uma torre
      ornitológica e à lagoa de Juodvalkis. A partir de Šilutė outro trajeto cruza a turfeira de Aukštumala, a
      lagoa de Krokų Lanka e o rio Minija até Ventės ragas e Kintai.


      Rotas fluviais permitem percorrer o delta em pequenos barcos ou caiaques. Na primavera, durante as
      cheias, a água comanda: às quintas só se chega de barco.
    history: >-
      O parque foi fundado a 24 de setembro de 1992 para preservar as paisagens do baixo Nemunas, os seus
      ecossistemas e património cultural; em 1993 o delta integrou a lista Ramsar de zonas húmidas de
      importância internacional. Em 2009 recebeu o prémio EDEN de destino europeu de excelência.


      A população aprendeu a conviver com as cheias. O território integra a região etnocultural da Lituânia
      Menor. Os faróis de Uostadvaris e Ventė, estações elevatórias e pólderes traduzem essa relação. Em
      Skirvytėlė preserva-se arquitetura tradicional de madeira numa herdade etnográfica musealizada, e a
      aldeia de Mingė é chamada a Veneza da Lituânia porque o rio Minija serve de rua principal.
    before: >-
      As cheias da primavera alteram profundamente os acessos: confirma antecipadamente com a administração do
      parque as vias abertas.
    around: >-
      A sete quilómetros estende-se o vizinho [Kuršių nerijos nacionalinis
      parkas](/lugar/kursiu-nerijos-nacionalinis-parkas/). Mais longe, a área protegida [ZEC Humedal de La
      Nava y Campos de Palencia](/lugar/zec-humedal-de-la-nava-y-campos-de-palencia/) partilha o
      felosa-aquática e habitats palustres.
