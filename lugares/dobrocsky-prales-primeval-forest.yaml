resumen:
  es: >-
    Reserva Natural Estricta declarada en 1913, uno de los bosques primarios mixtos de abeto y haya más
    antiguos y mejor protegidos de Eslovaquia.
  en: >-
    Strict Nature Reserve designated in 1913, one of Slovakia's oldest and best-protected mixed fir-beech
    primeval forests.
  fr: >-
    Réserve naturelle intégrale déclarée en 1913, l'une des forêts primaires mixtes de sapin et de hêtre les
    plus anciennes et les mieux protégées de Slovaquie.
  de: >-
    1913 ausgewiesenes strenges Naturreservat, einer der ältesten und am besten geschützten
    Tannen-Buchen-Urwälder der Slowakei.
  it: >-
    Riserva naturale integrale istituita nel 1913, una delle foreste primarie miste di abete e faggio più
    antiche e meglio protette della Slovacchia.
  pt: >-
    Reserva Natural Estrita declarada em 1913, uma das florestas primárias mistas de abeto e faia mais antigas
    e mais bem protegidas da Eslováquia.
unico:
  es: >-
    Es un bosque tan viejo y tan bien conservado que se ha ganado el Diploma Europeo y, aun así, solo se puede
    ver desde su linde.
  en: >-
    It is a forest so ancient and so well preserved that it has earned the European Diploma and, even so, you
    can only see it from its perimeter.
  fr: >-
    C'est une forêt si ancienne et si bien préservée qu'elle a obtenu le Diplôme européen et, pourtant, elle
    ne peut être contemplée que depuis sa lisière.
  de: >-
    Es ist ein so alter und so gut erhaltener Wald, dass er mit dem Europadiplom ausgezeichnet wurde und
    dennoch nur von seinem Rand aus betrachtet werden kann.
  it: >-
    È un bosco così antico e ben conservato da essersi meritato il Diploma europeo e, ciononostante, è
    osservabile unicamente dal margine.
  pt: >-
    É uma floresta tão antiga e tão bem preservada que conquistou o Diploma Europeu e, mesmo assim, só pode
    ser vista a partir da sua orla.
observaciones:
  es: >-
    No entres en el bosque. Si vas por el borde, hay que seguir el camino, no coger minerales, plantas ni
    frutos, guardar silencio, no tirar basura y no hacer fuego. Para excursiones guiadas, escribe antes a la
    administración de Poľana.
texto:
  es:
    intro: >-
      En noviembre de 1964 un vendaval rompió el abeto más famoso de Eslovaquia. Medía 56 m, tenía unos 500
      años y se llamaba Dobročská jedľa. Hoy una escultura de su torso se ve en un museo forestal, y el bosque
      que lo vio crecer sigue en pie en los montes Veporské vrchy, al final del valle de Brôtovo. Es el
      Dobročský prales: un bosque primario de abeto, haya y pícea que se apartó de los bosques de explotación
      en 1913 y que desde 1996 está cerrado al público.
    landscape: >-
      El bosque está a 6 km al sur de Dobroč, al final del valle de Brôtovo, en los montes Veporské vrchy.
      Ocupa unas 103,85 ha y sube hasta cerca de los 1005 m. El clima es frío y húmedo: la temperatura media
      anual es de 5 °C y caen 905 mm de lluvia al año. El sustrato es de granodioritas, dioritas silíceas y
      granitos pizarrosos, y los suelos son pardos, profundos y con mucho humus.


      Sobre ese suelo crece un bosque que se renueva solo. Las especies principales son el [abeto
      blanco](/especie/abies_alba/), el haya y la pícea, con arce, fresno y olmo de montaña como compañeros
      menos comunes. El abeto es el que marca el ritmo del bosque: por cada generación de abeto hay entre 1,5
      y 2 de haya. El bosque pasa por fases de crecimiento, óptimo y desintegración: el crecimiento dura unos
      120 años y el óptimo, de media, 100; la desintegración ocupa la mayor parte del bosque, un 46 %, y todo
      el ciclo dura unos 400 años.


      El abeto más alto llegó a 58 m y se secó en 1984. Su sucesor mide unos 60 m y figura entre los más altos
      de Europa.
    wildlife: >-
      Es un bosque de aves de cavidades. Aquí encuentran condiciones ideales el cárabo común, el [mochuelo
      chico](/especie/glaucidium_passerinum/), el [pico negro](/especie/dryocopus_martius/), el pico
      picapinos, el [pico dorsiblanco](/especie/dendrocopos_leucotos/) y varios papamoscas. El bosque forma
      parte del territorio del [oso pardo](/especie/ursus_arctos/), el [lince](/especie/lynx_lynx/) y el
      [lobo](/especie/canis_lupus/).


      Entre los anfibios hay [salamandra común](/especie/salamandra_salamandra/), sapo común y rana bermeja.
      Entre los mamíferos, musaraña alpina y musarañas de agua, y lirones, incluido el lirón de bosque, que
      está protegido.
    visit: >-
      Dentro del bosque no se entra: entrar exige un motivo legítimo, como investigación, prácticas de
      estudiantes o control del territorio. No hay ningún sendero turístico señalizado en su interior. Las
      excursiones solo se hacen con un guía de la Conservación de la Naturaleza, de la CHKO Poľana o de Lesy
      SR. Y hay una vía para quien quiere asomarse: desde el sendero de excursión del borde se ve la zona
      central con la explicación de un experto, en un servicio guiado de la asociación VYDRA, de Čierny Balog.


      Para entender el bosque sin entrar, hay otra parada: el museo forestal al aire libre de Vydrovo, que
      conserva la tradición de una región ligada al trabajo en los bosques. Allí, desde 2013, por el
      centenario de la reserva, se puede ver el torso de la célebre Dobročská jedľa, con paneles sobre sus
      dimensiones. El museo tiene una exposición interpretativa sobre el bosque y los motivos de su protección
      estricta.
    history: >-
      El centro de la reserva, llamado Gerauka, se sacó en 1913 de la categoría de bosques de explotación. En
      1994 pasó a ser reserva natural nacional, con el máximo grado de protección, el quinto, y alrededor hay
      una zona de amortiguación de cuarto grado donde se gestiona para que el bosque se parezca al del núcleo.
      Desde 1996 la entrada del público está prohibida.


      El Comité de Ministros del Consejo de Europa concedió al bosque el Diploma Europeo en 1998, y se renovó
      en 2018 por otros diez años. Forma parte de la red Natura 2000 y no pertenece a ninguna figura protegida
      de rango superior; lo gestiona la CHKO Poľana.
    before: >-
      No entres en el bosque. Si vas por el borde, hay que seguir el camino, no coger minerales, plantas ni
      frutos, guardar silencio, no tirar basura y no hacer fuego. Para excursiones guiadas, escribe antes a la
      administración de Poľana.
    around: >-
      A catorce kilómetros queda el [Parque Nacional Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/), con restos de bosque virgen. Más lejos,
      comparten con el Dobročský prales el pico negro y el haya el [Bosque Primario de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), el [Parque Natural Fuentes del Narcea y
      Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), el [Parque Nacional de
      Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) y la [Reserva Natural Integral de
      Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/).
  en:
    intro: >-
      In November 1964 a fierce gale snapped Slovakia's most famous silver fir. It stood 56 m tall, was around
      500 years old, and was known as Dobročská jedľa. Today a wooden sculpture of its trunk is displayed in
      an open-air forestry museum, and the forest that nurtured it still stands in the Veporské vrchy
      mountains at the head of the Brôtovo valley. This is the Dobročský prales: an old-growth forest of fir,
      beech, and spruce set aside from commercial forestry in 1913 and closed to the public since 1996.
    landscape: >-
      The forest lies 6 km south of Dobroč at the head of the Brôtovo valley in the Veporské vrchy mountains.
      It covers roughly 103.85 ha and climbs to nearly 1005 m. The climate is cool and damp: the mean annual
      temperature is 5 °C and annual precipitation reaches 905 mm. The bedrock consists of granodiorites,
      siliceous diorites, and schistose granites, supporting deep, humus-rich brown forest soils.


      Upon this ground grows a self-regenerating forest. The dominant trees are [silver
      fir](/especie/abies_alba/), European beech, and Norway spruce, accompanied less frequently by sycamore,
      ash, and wych elm. Fir sets the forest's pace: for every generation of fir there are between 1.5 and 2
      generations of beech. The forest progresses through phases of growth, optimum, and decay: growth lasts
      about 120 years and the optimum averages 100; decay occupies the largest area, some 46 %, and the
      complete cycle takes around 400 years.


      The tallest recorded fir reached 58 m before dying in 1984. Its successor stands about 60 m tall and
      ranks among Europe's tallest trees.
    wildlife: >-
      This is a realm of cavity-nesting birds. Ideal conditions welcome the tawny owl, [Eurasian pygmy
      owl](/especie/glaucidium_passerinum/), [black woodpecker](/especie/dryocopus_martius/), great spotted
      woodpecker, [white-backed woodpecker](/especie/dendrocopos_leucotos/), and various flycatchers. The
      forest falls within the roaming ranges of the [brown bear](/especie/ursus_arctos/), [Eurasian
      lynx](/especie/lynx_lynx/), and [grey wolf](/especie/canis_lupus/).


      Amphibians include the [fire salamander](/especie/salamandra_salamandra/), common toad, and common frog.
      Mammals include the alpine shrew, water shrews, and dormice, notably the protected forest dormouse.
    visit: >-
      You cannot enter the forest interior: entry requires a legitimate reason such as scientific research,
      student fieldwork, or territorial management. There are no marked walking trails inside. Excursions can
      only be made accompanied by a ranger from State Nature Conservancy, the CHKO Poľana administration, or
      Lesy SR. However, there is a way to look in: from the peripheral trail you can view the core zone while
      listening to expert commentary on a guided tour provided by the VYDRA association of Čierny Balog.


      To understand the forest without entering, another stop is essential: the Vydrovo open-air forestry
      museum, which preserves the heritage of a region steeped in forestry work. There, since 2013—the
      reserve's centenary—you can see the trunk section of the celebrated Dobročská jedľa alongside
      interpretive panels detailing its dimensions. The museum offers an educational exhibition on the
      old-growth forest and the reasons behind its strict conservation.
    history: >-
      The core of the reserve, called Gerauka, was withdrawn from commercial timber production in 1913. In
      1994 it was designated a national nature reserve with the highest, fifth level of protection, surrounded
      by a fourth-level buffer zone managed to encourage old-growth characteristics. Public entry has been
      prohibited since 1996.


      The Committee of Ministers of the Council of Europe awarded the forest the European Diploma in 1998,
      renewed in 2018 for a further ten years. It belongs to the Natura 2000 network and is not subsumed
      within any higher protected area; management is overseen by CHKO Poľana.
    before: >-
      Do not enter the forest. If you walk along the perimeter, stay strictly on the trail, do not take
      minerals, plants, or mushrooms, maintain quiet, do not leave rubbish, and never light fires. For guided
      excursions, contact the Poľana administration in advance.
    around: >-
      Fourteen kilometres away lies [Muránska Planina National
      Park](/lugar/narodny-park-muranska-planina---pralesove/), which harbours primeval forest remnants.
      Further afield, Dobročský prales shares the black woodpecker and European beech with the [Strâmbu-Băiuț
      Primeval Forest](/lugar/codrul-secular-strambu-baiut/), [Fuentes del Narcea, Degaña e Ibias Natural Park
      and Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), [Hainich National
      Park](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/), and the [Sasso Fratino Integral
      Nature Reserve](/lugar/riserva-naturale-integrale-di-sasso-fratino/).
  fr:
    intro: >-
      En novembre 1964, une violente tempête a brisé le sapin le plus célèbre de Slovaquie. Il mesurait 56 m,
      avait environ 500 ans et s'appelait la Dobročská jedľa. Aujourd'hui, une sculpture de son tronc est
      exposée dans un écomusée forestier, et la forêt qui l'a vu grandir se dresse toujours dans les monts
      Veporské vrchy, au fond de la vallée de Brôtovo. C'est le Dobročský prales : une forêt primaire de
      sapin, hêtre et épicéa soustraite à l'exploitation forestière en 1913 et fermée au public depuis 1996.
    landscape: >-
      La forêt se situe à 6 km au sud de Dobroč, au fond de la vallée de Brôtovo, dans les monts Veporské
      vrchy. Elle couvre environ 103,85 ha et culmine près de 1005 m d'altitude. Le climat est froid et humide
      : la température moyenne annuelle est de 5 °C et il tombe 905 mm de précipitations par an. Le substrat
      est composé de granodiorites, de diorites siliceuses et de granites schisteux, portant des sols bruns
      profonds et très riches en humus.


      Sur ce sol se développe une forêt en auto-renouvellement permanent. Les essences dominantes sont le
      [sapin blanc](/especie/abies_alba/), le hêtre et l'épicéa, accompagnés plus discrètement par l'érable,
      le frêne et l'orme de montagne. Le sapin donne le tempo : à chaque génération de sapin correspondent
      entre 1,5 et 2 générations de hêtre. La forêt traverse des phases de croissance, d'optimum et de
      décomposition : la croissance dure environ 120 ans et l'optimum en moyenne 100 ; la phase de
      décomposition occupe la plus grande part de la forêt, soit 46 %, et le cycle complet s'étend sur près de
      400 ans.


      Le sapin le plus haut a atteint 58 m avant de dépérir en 1984. Son successeur s'élève à environ 60 m et
      compte parmi les plus hauts d'Europe.
    wildlife: >-
      C'est un royaume d'oiseaux cavicoles. La chouette hulotte, la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/), le [pic noir](/especie/dryocopus_martius/), le pic épeiche,
      le [pic à dos blanc](/especie/dendrocopos_leucotos/) et plusieurs gobe-mouches y trouvent des conditions
      idéales. La forêt s'intègre au territoire de l'[ours brun](/especie/ursus_arctos/), du [lynx
      boréal](/especie/lynx_lynx/) et du [loup gris](/especie/canis_lupus/).


      Parmi les amphibiens vivent la [salamandre tachetée](/especie/salamandra_salamandra/), le crapaud commun
      et la grenouille rousse. Les mammifères comptent la musaraigne alpine, des musaraignes aquatiques et des
      loirs, dont le muscardin et le lérotin commun, strictement protégé.
    visit: >-
      On ne pénètre pas à l'intérieur de la forêt : l'accès requiert un motif légitime, comme la recherche
      scientifique, des stages d'études ou le suivi territorial. Aucun sentier de randonnée balisé ne la
      traverse. Les excursions ne s'effectuent qu'accompagnées par un guide de la Protection de la nature, de
      la CHKO Poľana ou de Lesy SR. Il existe toutefois une possibilité de regard : depuis le sentier qui
      longe la lisière, on peut apercevoir la zone centrale en bénéficiant des explications d'un expert dans
      le cadre d'un service guidé assuré par l'association VYDRA de Čierny Balog.


      Pour appréhender la forêt sans y entrer, une autre étape s'impose : le musée forestier de plein air de
      Vydrovo, qui perpétue la tradition d'un terroir forgé par les métiers du bois. On peut y voir depuis
      2013, à l'occasion du centenaire de la réserve, le tronc sculpté de la célèbre Dobročská jedľa et des
      panneaux explicatifs sur ses dimensions. Le musée présente une exposition sur la forêt primaire et les
      raisons de sa protection intégrale.
    history: >-
      Le cœur de la réserve, nommé Gerauka, a été soustrait à l'exploitation commerciale dès 1913. En 1994, le
      site est devenu réserve naturelle nationale dotée du plus haut degré de protection, le cinquième,
      ceinturée par une zone tampon de quatrième degré gérée de manière à rapprocher la structure forestière
      de celle du noyau central. Depuis 1996, l'accès du public est strictement interdit.


      Le Comité des Ministres du Conseil de l'Europe a octroyé à la forêt le Diplôme européen en 1998,
      renouvelé en 2018 pour dix années supplémentaires. Elle fait partie du réseau Natura 2000 et n'est
      rattachée à aucune entité de rang supérieur ; sa gestion relève de la CHKO Poľana.
    before: >-
      Ne pénétrez pas dans la forêt. En cheminant en lisière, veillez à ne pas quitter le sentier, ne ramassez
      ni minéraux, ni plantes, ni baies, observez le silence, n'abandonnez aucun déchet et n'allumez aucun
      feu. Pour les visites guidées, écrivez au préalable à l'administration de Poľana.
    around: >-
      À quatorze kilomètres s'étend le [parc national de Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/), qui abrite des lambeaux de forêt vierge.
      Plus loin, le Dobročský prales partage le pic noir et le hêtre avec la [forêt primaire de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), le [parc naturel de Fuentes del Narcea, Degaña e
      Ibias et Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), le [parc national de
      Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) et la [réserve naturelle intégrale
      de Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/).
  de:
    intro: >-
      Im November 1964 brach ein Sturm die berühmteste Weißtanne der Slowakei entzwei. Sie mass 56 m, war rund
      500 Jahre alt und hiess Dobročská jedľa. Heute ist eine Skulptur ihres Stammes in einem
      forstwirtschaftlichen Freilichtmuseum ausgestellt, und der Wald, der sie heranwachsen sah, steht noch
      immer in den Veporské vrchy am Ende des Brôtovo-Tals. Es ist der Dobročský prales: Ein Primärwald aus
      Tanne, Buche und Fichte, der 1913 aus der forstlichen Nutzung genommen wurde und seit 1996 für die
      Öffentlichkeit gesperrt ist.
    landscape: >-
      Der Wald liegt 6 km südlich von Dobroč am Ende des Brôtovo-Tals in den Veporské vrchy. Er umfasst etwa
      103,85 ha und steigt bis auf fast 1005 m an. Das Klima ist kühl und feucht: Die Jahresmitteltemperatur
      beträgt 5 °C und es fallen 905 mm Niederschlag im Jahr. Der Untergrund besteht aus Granodioriten,
      kieselsäurereichen Dioriten und Schiefergraniten, auf denen sich tiefgründige, humusreiche Braunerden
      gebildet haben.


      Auf diesem Boden gedeiht ein Wald, der sich selbst verjüngt. Die Hauptbaumarten sind
      [Weißtanne](/especie/abies_alba/), Rotbuche und Gemeine Fichte, seltener begleitet von Bergahorn, Esche
      und Bergulme. Die Tanne bestimmt den Rhythmus: Auf jede Tannengeneration kommen zwischen 1,5 und 2
      Buchengenerationen. Der Wald durchläuft Phasen des Wachstums, des Optimums und des Zerfalls: Das
      Wachstum dauert rund 120 Jahre, das Optimum im Schnitt 100; die Zerfallsphase nimmt mit 46 % den größten
      Teil der Fläche ein, und der Gesamtzyklus erstreckt sich über rund 400 Jahre.


      Die höchste Tanne erreichte 58 m und starb 1984 ab. Ihre Nachfolgerin ist etwa 60 m hoch und gehört zu
      den höchsten Bäumen Europas.
    wildlife: >-
      Es ist ein Wald der Höhlenbrüter. Waldkauz, [Sperlingskauz](/especie/glaucidium_passerinum/),
      [Schwarzspecht](/especie/dryocopus_martius/), Buntspecht,
      [Weißrückenspecht](/especie/dendrocopos_leucotos/) und verschiedene Fliegenschnäpper finden hier beste
      Bedingungen. Der Wald gehört zum Streifgebiet von [Braunbär](/especie/ursus_arctos/), [Eurasischem
      Luchs](/especie/lynx_lynx/) und [Wolf](/especie/canis_lupus/).


      Unter den Amphibien kommen [Feuersalamander](/especie/salamandra_salamandra/), Erdkröte und Grasfrosch
      vor. Bei den Säugetieren leben Alpenspitzmaus, Wasserspitzmäuse und Bilche im Gebiet, darunter der
      streng geschützte Baumschläfer.
    visit: >-
      Das Innere des Waldes darfst du nicht betreten: Ein Zutritt verlangt berechtigte Gründe wie
      wissenschaftliche Forschung, studentische Exkursionen oder forstliche Gebietsaufsicht. Im Inneren gibt
      es keine markierten Wanderwege. Exkursionen sind ausschliesslich in Begleitung eines Führers des
      Staatlichen Naturschutzes, der Verwaltung des CHKO Poľana oder von Lesy SR möglich. Dennoch gibt es eine
      Möglichkeit des Einblicks: Vom Randweg aus kannst du die Kernzone mit den Erläuterungen eines Experten
      bei einer Führung des Vereins VYDRA aus Čierny Balog überblicken.


      Um den Wald ohne Betreten zu verstehen, lohnt sich ein weiterer Halt: Das forstliche Freilichtmuseum
      Vydrovo, das das Brauchtum einer vom Waldhandwerk geprägten Region bewahrt. Dort ist seit 2013,
      anlässlich der Hundertjahrfeier des Schutzgebiets, der Stamm der berühmten Dobročská jedľa mit
      Informationstafeln zu ihren Ausmaßen zu sehen. Das Museum zeigt eine Ausstellung über den Urwald und die
      Gründe für seinen strengen Schutz.
    history: >-
      Das Herzstück des Reservats, genannt Gerauka, wurde 1913 aus den Wirtschaftswäldern herausgelöst. 1994
      wurde es zum nationalen Naturreservat mit der höchsten, fünften Schutzstufe erklärt; umgeben ist es von
      einer Pufferzone der vierten Schutzstufe, die so bewirtschaftet wird, dass sich der Wald der Struktur
      des Kerns annähert. Seit 1996 ist der öffentliche Zutritt untersagt.


      Das Ministerkomitee des Europarats verlieh dem Urwald 1998 das Europadiplom, das 2018 um weitere zehn
      Jahre verlängert wurde. Er ist Teil des Natura-2000-Netzes und keinem höherrangigen Schutzgebiet
      untergeordnet; zuständig ist die Verwaltung des CHKO Poľana.
    before: >-
      Betritt den Wald nicht. Wenn du am Rand entlangwanderst, bleib auf dem Weg, nimm keine Mineralien,
      Pflanzen oder Pilze mit, verhalte dich leise, hinterlasse keinen Abfall und zünde kein Feuer an. Für
      geführte Exkursionen wende dich vorab an die Verwaltung der Poľana.
    around: >-
      Vierzehn Kilometer entfernt liegt der [Nationalpark Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/) mit erhaltenen Urwaldresten. Weiter entfernt
      teilen den Schwarzspecht und die Rotbuche mit dem Dobročský prales der [Urwald von
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), der [Naturpark Fuentes del Narcea, Degaña e Ibias
      und Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), der [Nationalpark
      Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) und das [Integrale Naturreservat
      Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/).
  it:
    intro: >-
      Nel novembre 1964 una bufera spezzò l'abete più celebre della Slovacchia. Misurava 56 m, aveva circa 500
      anni e si chiamava Dobročská jedľa. Oggi una scultura del suo tronco è esposta in un museo forestale
      all'aperto, e la foresta che lo vide crescere sorge ancora nei monti Veporské vrchy, al termine della
      valle di Brôtovo. È il Dobročský prales: una foresta primaria di abete bianco, faggio e abete rosso
      sottratta ai boschi di produzione nel 1913 e chiusa al pubblico dal 1996.
    landscape: >-
      La foresta si trova a 6 km a sud di Dobroč, sul fondo della valle di Brôtovo, nei monti Veporské vrchy.
      Copre circa 103,85 ha e sale fino a quasi 1005 m di quota. Il clima è freddo e umido: la temperatura
      media annua è di 5 °C e cadono 905 mm di pioggia all'anno. Il substrato è costituito da granodioriti,
      dioriti silicee e graniti scistosi, con suoli bruni profondi e assai ricchi di humus.


      Su questo suolo prospera un bosco a rinnovazione naturale. Le specie principali sono l'[abete
      bianco](/especie/abies_alba/), il faggio e l'abete rosso, con acero montano, frassino maggiore e olmo
      montano come compagni meno frequenti. L'abete scandisce i tempi della foresta: per ogni generazione di
      abete si susseguono tra 1,5 e 2 generazioni di faggio. Il bosco attraversa fasi di crescita, ottimale e
      di disfacimento: la crescita dura circa 120 anni e la fase ottimale, in media, 100; il disfacimento
      occupa la porzione maggiore del bosco, il 46 %, e l'intero ciclo richiede all'incirca 400 anni.


      L'abete più elevato toccò i 58 m e seccò nel 1984. Il suo successore raggiunge circa 60 m e figura tra i
      più alti d'Europa.
    wildlife: >-
      È una foresta popolata da uccelli che nidificano nelle cavità degli alberi. Qui trovano condizioni
      ottimali l'allocco, la [civetta nana](/especie/glaucidium_passerinum/), il [picchio
      nero](/especie/dryocopus_martius/), il picchio rosso maggiore, il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/) e diversi pigliamosche. La foresta rientra nel territorio
      dell'[orso bruno](/especie/ursus_arctos/), della [lince eurasiatica](/especie/lynx_lynx/) e del
      [lupo](/especie/canis_lupus/).


      Tra gli anfibi figurano la [salamandra pezzata](/especie/salamandra_salamandra/), il rospo comune e la
      rana temporaria. Tra i mammiferi vivono il toporagno alpino, i toporagni acquatici e vari ghiri,
      compreso il driomio, specie rigorosamente protetta.
    visit: >-
      Non si può entrare all'interno del bosco: l'accesso esige un motivo legittimo, come attività di ricerca,
      tirocini universitari o compiti di sorveglianza. Non vi è alcun sentiero turistico tracciato
      all'interno. Le escursioni si svolgono esclusivamente con una guida della Protezione della natura,
      dell'ente CHKO Poľana o di Lesy SR. Esiste tuttavia un modo per affacciarsi: dal sentiero che costeggia
      il limite si scorge la zona centrale accompagnati dalle spiegazioni di un esperto, grazie al servizio
      guidato dell'associazione VYDRA di Čierny Balog.


      Per comprendere la foresta senza entrarvi c'è un'altra sosta: il museo forestale all'aperto di Vydrovo,
      custode delle tradizioni di un territorio legato al lavoro nei boschi. Lì, dal 2013, in occasione del
      centenario della riserva, è visibile il fusto scultoreo della celebre Dobročská jedľa con pannelli
      illustrativi sulle sue proporzioni. Il museo allestisce un percorso interpretativo sulla foresta vergine
      e sulle ragioni della sua tutela integrale.
    history: >-
      Il nucleo della riserva, denominato Gerauka, fu stralciato dai boschi produttivi nel 1913. Nel 1994 è
      stato dichiarato riserva naturale nazionale con il livello di protezione più alto, il quinto, circondato
      da una fascia cuscinetto di quarto livello gestita affinché la struttura forestale ricordi quella del
      nucleo. Dal 1996 l'accesso al pubblico è vietato.


      Il Comitato dei Ministri del Consiglio d'Europa ha insignito la foresta del Diploma europeo nel 1998,
      rinnovato nel 2018 per ulteriori dieci anni. Fa parte della rete Natura 2000 e non afferisce ad alcun
      parco o ente sovraordinato; la gestione è affidata alla CHKO Poľana.
    before: >-
      Non entrare nella foresta. Se cammini lungo il margine, resta sul tracciato, non raccogliere minerali,
      piante o frutti, rispetta il silenzio, non abbandonare rifiuti e non accendere fuochi. Per escursioni
      guidate, contatta anticipatamente la direzione della Poľana.
    around: >-
      A quattordici chilometri si estende il [Parco nazionale Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/), con lembi di bosco vergine. Più lontano,
      condividono con il Dobročský prales il picchio nero e il faggio la [Foresta primordiale di
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), il [Parco naturale Fuentes del Narcea, Degaña e
      Ibias e Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), il [Parco nazionale di
      Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) e la [Riserva naturale integrale
      di Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/).
  pt:
    intro: >-
      Em novembro de 1964, um vendaval partiu o abeto mais célebre da Eslováquia. Media 56 m, tinha cerca de
      500 anos e chamava-se Dobročská jedľa. Hoje, uma escultura do seu tronco está exposta num museu
      florestal ao ar livre, e a floresta que o viu crescer continua de pé nos montes Veporské vrchy, no fundo
      do vale de Brôtovo. É o Dobročský prales: uma floresta primária de abeto, faia e espruce apartada da
      exploração florestal em 1913 e interdita ao público desde 1996.
    landscape: >-
      A floresta fica a 6 km a sul de Dobroč, no termo do vale de Brôtovo, nos montes Veporské vrchy. Ocupa
      cerca de 103,85 ha e sobe até perto dos 1005 m de altitude. O clima é frio e húmido: a temperatura média
      anual é de 5 °C e caem 905 mm de precipitação por ano. O substrato é formado por granodioritos, dioritos
      siliciosos e granitos xistosos, sustentando solos pardos profundos e com elevado teor de húmus.


      Sobre este solo medra uma floresta que se regenera por si própria. As espécies dominantes são o
      [abeto-branco](/especie/abies_alba/), a faia e o espruce, com o bordo, o freixo e o olmo-da-montanha
      como companheiros menos frequentes. O abeto dita o ritmo da floresta: por cada geração de abeto há entre
      1,5 e 2 gerações de faia. A mata passa por fases de crescimento, ótimo e degradação: o crescimento dura
      cerca de 120 anos e o ótimo, em média, 100; a degradação ocupa a maior área florestal, correspondente a
      46 %, e o ciclo integral estende-se por cerca de 400 anos.


      O abeto mais alto chegou aos 58 m e secou em 1984. O seu sucessor atinge cerca de 60 m e conta-se entre
      os mais altos da Europa.
    wildlife: >-
      É uma floresta de aves cavernícolas. Aqui encontram condições ideais a coruja-do-mato, o
      [mocho-pigmeu](/especie/glaucidium_passerinum/), o [pica-pau-preto](/especie/dryocopus_martius/), o
      pica-pau-malhado-grande, o [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/) e vários
      papa-moscas. A floresta integra o território do [urso-pardo](/especie/ursus_arctos/), do
      [lince-euroasiático](/especie/lynx_lynx/) e do [lobo-ibérico](/especie/canis_lupus/).


      Entre os anfíbios ocorrem a [salamandra-de-pintas-amarelas](/especie/salamandra_salamandra/), o
      sapo-comum e a rã-castanha. Nos mamíferos salientam-se o musaranho-alpino, os musaranhos-aquáticos e
      arganazes, incluindo o arganaz-dos-bosques, rigorosamente protegido.
    visit: >-
      Não se entra no interior da floresta: a entrada exige um motivo legítimo, como investigação científica,
      estágios universitários ou fiscalização territorial. Não existe qualquer trilho turístico sinalizado no
      seu interior. As incursões realizam-se unicamente acompanhadas por um guia da Conservação da Natureza,
      da CHKO Poľana ou da Lesy SR. Todavia, existe uma via de aproximação: a partir do trilho que contorna a
      orla avista-se a zona central com o enquadramento de um especialista, através do serviço guiado da
      associação VYDRA de Čierny Balog.


      Para conhecer a mata sem entrar, impõe-se outra paragem: o museu florestal ao ar livre de Vydrovo, que
      preserva as tradições de uma terra ligada à faina das matas. Ali, desde 2013, pelas comemorações do
      centenário da reserva, é possível admirar o tronco esculpido da célebre Dobročská jedľa acompanhado por
      painéis que retratam as suas proporções. O museu acolhe uma exposição interpretativa sobre a floresta
      virgem e as razões da sua proteção estrita.
    history: >-
      O coração da reserva, denominado Gerauka, foi retirado da exploração comercial em 1913. Em 1994 foi
      classificado como reserva natural nacional com o grau mais elevado de proteção, o quinto, envolvido por
      uma zona tampão de quarto grau gerida de forma a aproximar a estrutura florestal da do núcleo. Desde
      1996 a entrada ao público é estritamente proibida.


      O Comité de Ministros do Conselho da Europa atribuiu à floresta o Diploma Europeu em 1998, renovado em
      2018 por mais dez anos. Integra a rede Natura 2000 e não se subordina a nenhuma figura protegida de
      categoria superior; a gestão cabe à CHKO Poľana.
    before: >-
      Não entres na floresta. Se percorreres a orla, segue estritamente o trilho, não recolhas minerais,
      plantas nem frutos, guarda silêncio, não abandones lixo e não faças fogo. Para visitas acompanhadas,
      contacta previamente a administração de Poľana.
    around: >-
      A catorze quilómetros estende-se o [Parque Nacional Muránska
      Planina](/lugar/narodny-park-muranska-planina---pralesove/), com relíquias de bosque virgem. Mais longe,
      partilham com o Dobročský prales o pica-pau-preto e a faia a [Floresta Primária de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), o [Parque Natural Fuentes del Narcea, Degaña e
      Ibias e Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), o [Parque Nacional de
      Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) e a [Reserva Natural Integral de
      Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/).
