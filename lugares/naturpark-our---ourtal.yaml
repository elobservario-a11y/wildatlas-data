texto:
  es:
    intro: >-
      Hay un monumento en el que se cruzan tres países, y el río que baja hasta él lleva cientos de miles de
      años cavando su valle en la pizarra. El Parque Natural del Our ocupa el rincón nororiental de
      Luxemburgo, en las Ardenas luxemburguesas, donde se unen Luxemburgo, Bélgica y Alemania. Es una meseta
      ancha y alta, de unos quinientos metros, cortada por valles estrechos y profundos: el del Our, que da
      nombre al parque, y el del Clerve. Aquí el río ya no separa, une: es el hilo de varias rutas que cruzan
      de un país a otro.
    landscape: >-
      El territorio es una meseta de pizarra, a unos quinientos metros, atravesada por los valles del Our y
      del Clerve. En las laderas empinadas hay bosque; en las mesetas, en cambio, se concentran los pueblos y
      los cultivos. El Our nace a 653 metros en el Eichelsberg, cerca de Manderfeld, en la región belga de
      Hautes Fagnes, y recorre 78 kilómetros hasta desembocar en el Sûre, en Wallendorf. En el parque, el río
      excava su valle sinuoso en las pizarras y grauwacas del Islek, a veces encajado y empinado, a veces más
      abierto, con arboledas de ribera y prados.


      Los humedales son lo más valioso. Los hay en los valles y en la meseta, y son hábitats importantes para
      especies animales y vegetales amenazadas. Aún se conservan varios miles de hectáreas de monte bajo de
      roble, los llamados Lohhecken, que marcan el paisaje en largos tramos.
    wildlife: >-
      En el parque anida la [cigüeña negra](/especie/ciconia_nigra/), una especie amenazada, y también se
      encuentran la [madreperla de río](/especie/margaritifera_margaritifera/), el [gato
      montés](/especie/felis_silvestris/) y el grévol. En el cauce del Our, con el agua clara, se distinguen
      las [truchas](/especie/salmo_trutta/) que remontan la corriente.


      Las rutas se hacen sobre todo de mayo a octubre.
    visit: >-
      El parque es una zona de senderismo, con numerosas rutas de largo recorrido, temáticas y senderos
      didácticos. La primera ruta Nat’Our es la más accesible: fácil, 13,1 km, 176 m de desnivel, unas tres
      horas. Empieza en el monumento europeo del trifinio, que recuerda la firma de los Tratados de Roma en
      marzo de 1957, sigue el Our hacia el sur por el lado alemán, lo cruza y vuelve hacia el norte por el
      luxemburgués. El camino se mantiene en el valle salvo una subida y una bajada a la Königslay, y tiene
      tres puntos de descanso donde la ruta invita a conocer el agua como elemento que da forma y sostiene la
      vida.


      Para más exigencia, la segunda ruta Nat’Our mide casi dieciocho kilómetros, dura cinco horas y
      veinticinco minutos y está calificada de difícil. Pasa por la historia de los molinos del Our, que
      molían corteza de roble para curtir cuero, y la subida al mirador de Kasselslee da vistas del valle.


      Entre las rutas temáticas, el sendero Ourdall recorre 8,5 km entre Stolzembourg y Vianden y propone diez
      paradas temáticas sobre el pasado y el presente del valle. En Hoscheid, el sendero sonoro de seis
      kilómetros tiene instalaciones de audio de artistas que invitan a escuchar la naturaleza. En Parc
      Hosingen, un arboreto de cinco hectáreas describe 45 especies de árboles y arbustos. El Sendero de los
      Contrabandistas, en Troisvierges, sigue la ruta por la que cruzaron a Bélgica resistentes y objetores
      durante los últimos años de la Segunda Guerra Mundial, con dos variantes de 12 y 9 km. Y si prefieres la
      bicicleta, el parque tiene dos rutas ciclistas y seis circuitos de montaña.


      El centro de visitantes, la Casa del Parque Natural del Our, está en Hosingen y tiene una exposición
      permanente de 150 metros cuadrados sobre el patrimonio natural, histórico y cultural del territorio.
    history: >-
      El decreto del parque natural entró en vigor el 9 de junio de 2005. Lo gestiona un sindicato de
      municipios junto con el Estado, con proyectos de conservación, agricultura, cultura, turismo y educación
      ambiental.


      Su mayor problema ecológico es la sustitución del bosque original de frondosas y de los montes bajos de
      roble por monocultivos de pícea. A cambio, en el río se han quitado barreras: donde antes los azudes de
      los molinos fragmentaban el Our, las truchas de río pueden volver a sus frezaderos.


      El castillo de Vianden, levantado entre los siglos XI y XIV sobre un fuerte romano y un refugio
      carolingio, y las galerías de la mina de cobre de Stolzembourg completan el lado humano del parque.
    before: >-
      La mayoría de las rutas se hacen entre mayo y octubre. En la segunda ruta Nat’Our hacen falta buena
      condición física, buen pie y calzado robusto.
    around: >-
      A seis kilómetros está el [Valle del Ernz Negro, Beaufort y
      Berdorf](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/), y a trece el [Parque Natural del
      Alto Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/), dos espacios más de Luxemburgo para
      enlazar con una visita al Our.
  en:
    intro: >-
      There is a monument where three countries meet, and the river winding down to it has spent hundreds of
      thousands of years carving its valley into the slate. The Our Nature Park occupies the north-eastern
      corner of Luxembourg, in the Luxembourg Ardennes, where Luxembourg, Belgium and Germany converge. It is
      a broad, high plateau at around five hundred metres, cut by narrow and deep valleys: that of the Our,
      which gives the park its name, and that of the Clerve. Here the river no longer divides; it unites: it
      forms the thread of several cross-border routes.
    landscape: >-
      The landscape is a slate plateau at around five hundred metres, crossed by the valleys of the Our and
      the Clerve. Steep slopes are cloaked in forest, while villages and crops cluster on the plateau
      surfaces. The Our rises at 653 metres on the Eichelsberg near Manderfeld in the Belgian Hautes Fagnes
      region and flows for 78 kilometres before emptying into the Sûre at Wallendorf. Within the park, the
      river cuts a winding course into the slates and greywackes of the Éislek, alternately steep and deeply
      incised or more open with riparian woodlands and meadows.


      Wetlands represent the most valuable habitats, occurring both in the valleys and across the plateau,
      sustaining endangered plant and animal species. Several thousand hectares of oak coppice, known locally
      as Lohhecken, still survive and shape the scenery over long stretches.
    wildlife: >-
      The park is home to nesting [black storks](/especie/ciconia_nigra/), an endangered species, as well as
      the [freshwater pearl mussel](/especie/margaritifera_margaritifera/), the
      [wildcat](/especie/felis_silvestris/) and hazel grouse. In the clear waters of the Our, one can spot
      [brown trout](/especie/salmo_trutta/) swimming against the current.


      Trails are best walked between May and October.
    visit: >-
      The park is prime hiking terrain, offering numerous long-distance itineraries, themed paths and
      educational trails. The first Nat'Our route is the most accessible: easy, 13.1 km, 176 m of elevation
      gain, taking about three hours. It begins at the European tripoint monument commemorating the signing of
      the Treaties of Rome in March 1957, follows the Our southward on the German side, crosses the river, and
      returns northward on the Luxembourg bank. The path remains largely in the valley, with one ascent and
      descent to the Königslay, and features three resting spots celebrating water as a life-giving element.


      For a stiffer challenge, the second Nat'Our route spans nearly eighteen kilometres, lasts five hours and
      twenty-five minutes, and is rated difficult. It traces the history of the Our tanner mills that ground
      oak bark, and the climb to the Kasselslee viewpoint affords expansive valley vistas.


      Among thematic options, the Ourdall trail spans 8.5 km between Stolzembourg and Vianden, offering ten
      interpretive stops on the valley's past and present. In Hoscheid, the six-kilometre Klangwanderweg sound
      trail features audio installations by artists inviting hikers to listen to nature. In Parc Hosingen, a
      five-hectare arboretum showcases 45 tree and shrub species. The Smugglers' Trail in Troisvierges follows
      routes used by resisters and draft evaders escaping to Belgium during the closing years of the Second
      World War, with variants of 12 and 9 km. Cyclists can enjoy two road cycling routes and six mountain
      bike loops.


      The visitor centre, the House of the Our Nature Park, is located in Hosingen and hosts a
      150-square-metre permanent exhibition on regional natural, historical and cultural heritage.
    history: >-
      The decree establishing the nature park took effect on 9 June 2005. It is managed jointly by an
      intercommunal syndicate and the state, pursuing initiatives in conservation, agriculture, culture,
      tourism and environmental education.


      Its primary ecological challenge has been the replacement of native broadleaf forests and oak coppices
      by spruce monocultures. Conversely, barriers along the river have been removed: where mill weirs once
      fragmented the Our, river trout can once again reach their spawning beds.


      Vianden Castle, constructed between the eleventh and fourteenth centuries over Roman foundations and a
      Carolingian refuge, along with the galleries of the Stolzembourg copper mine, add centuries of human
      craftsmanship to the landscape.
    before: Carry water and appropriate clothing. Check the operating hours of visitor centres and sites in advance.
    around: >-
      Nearby is the [Öewersauer Nature Park — Haute-Sûre
      Forests](/lugar/naturpark-oewersauer---haute-sure-forests/), while the [Mullerthal Region — Luxembourg's
      Little Switzerland](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/) lies roughly twenty-five
      kilometres away.
  fr:
    intro: >-
      Il existe un monument où trois pays se croisent, et la rivière qui descend vers lui creuse sa vallée
      dans le schiste depuis des centaines de milliers d'années. Le Parc naturel de l'Our occupe l'angle
      nord-est du Luxembourg, dans les Ardennes luxembourgeoises, au point de jonction du Luxembourg, de la
      Belgique et de l'Allemagne. C'est un haut plateau étendu, à environ cinq cents mètres d'altitude,
      entaillé de vallées étroites et profondes : celle de l'Our, qui donne son nom au parc, et celle de la
      Clerve. Ici la rivière ne sépare plus, elle unit : elle tisse le fil de plusieurs itinéraires
      transfrontaliers.
    landscape: >-
      Le territoire forme un plateau schisteux à environ cinq cents mètres d'altitude, traversé par les
      vallées de l'Our et de la Clerve. Les pentes abruptes portent des forêts, tandis que les villages et
      cultures se concentrent sur les plateaux. L'Our prend sa source à 653 mètres sur l'Eichelsberg près de
      Manderfeld, dans les Hautes Fagnes belges, et parcourt 78 kilomètres jusqu'à son confluent avec la Sûre
      à Wallendorf. Dans le parc, la rivière incise un cours sinueux dans les schistes et grauwackes de
      l'Éislek, tantôt resserré et escarpé, tantôt plus ouvert avec ripisylves et prairies.


      Les zones humides constituent les milieux les plus précieux, dispersées dans les vallées comme sur le
      plateau, offrant d'importants refuges pour les espèces menacées. Plusieurs milliers d'hectares de
      taillis de chênes, les « Lohhecken », subsistent encore et modèlent le paysage sur de longues étendues.
    wildlife: >-
      Dans le parc niche la [cigogne noire](/especie/ciconia_nigra/), espèce vulnérable, aux côtés de la
      [moule perlière d'eau douce](/especie/margaritifera_margaritifera/), du [chat
      sauvage](/especie/felis_silvestris/) et de la gélinotte des bois. Dans les eaux claires de l'Our, on
      aperçoit les [truites fario](/especie/salmo_trutta/) remonter le courant.


      Les sentiers se parcourent principalement de mai à octobre.
    visit: >-
      Le parc est un haut lieu de randonnée, doté de nombreux parcours au long cours, thématiques et
      didactiques. La première boucle Nat'Our est la plus accessible : facile, 13,1 km, 176 m de dénivelé,
      environ trois heures. Elle part du monument européen du tripoint commémorant la signature des Traités de
      Rome en mars 1957, descend l'Our vers le sud côté allemand, le franchit et remonte au nord côté
      luxembourgeois. Le chemin reste en fond de vallée hormis une montée et descente à la Königslay, et
      propose trois haltes d'observation de l'eau en tant qu'élément formateur du paysage.


      Plus exigeante, la seconde boucle Nat'Our s'étire sur près de dix-huit kilomètres, dure cinq heures et
      vingt-cinq minutes et est classée difficile. Elle explore l'histoire des moulins de l'Our qui broyaient
      l'écorce de chêne pour le tannage, tandis que la montée au point de vue de Kasselslee offre un panorama
      étendu sur la vallée.


      Parmi les circuits thématiques, le sentier Ourdall relie Stolzembourg à Vianden sur 8,5 km avec dix
      stations interprétatives sur le passé et le présent de la vallée. À Hoscheid, le sentier sonore de six
      kilomètres propose des installations d'artistes invitant à écouter la nature. Au Parc Hosingen, un
      arboretum de cinq hectares présente 45 espèces d'arbres et d'arbustes. Le Sentier des Passeurs à
      Troisvierges retrace l'itinéraire emprunté par les réfractaires et résistants fuyant vers la Belgique à
      la fin de la Seconde Guerre mondiale, avec deux variantes de 12 et 9 km. Pour les cyclistes, le parc
      offre deux itinéraires sur route et six circuits VTT.


      Le centre d'accueil, la Maison du Parc Naturel de l'Our, est situé à Hosingen avec une exposition
      permanente de 150 mètres carrés sur le patrimoine naturel, historique et culturel régional.
    history: >-
      Le décret créant le parc naturel est entré en vigueur le 9 juin 2005. Il est géré conjointement par un
      syndicat de communes et l'État, menant des projets en conservation, agriculture, culture, tourisme et
      éducation à l'environnement.


      Le principal défi écologique a résidé dans la substitution des forêts de feuillus et taillis de chênes
      par des monocultures d'épicéas. En contrepartie, les obstacles hydrauliques ont été effacés sur la
      rivière : là où les barrages de moulins fragmentaient l'Our, les truites peuvent à nouveau accéder à
      leurs frayères.


      Le château de Vianden, édifié entre le XIe et le XIVe siècle sur une forteresse romaine et un refuge
      carolingien, ainsi que les galeries de la mine de cuivre de Stolzembourg, enrichissent ce cadre naturel
      de siècles d'histoire humaine.
    before: >-
      Emportez de l'eau et un équipement adapté. Renseignez-vous au préalable sur les horaires des centres
      d'accueil et monuments.
    around: >-
      Tout proche se trouve le [Parc Naturel de la Haute-Sûre — Forêts de la
      Haute-Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/), tandis que la [Région Mullerthal —
      Petite Suisse Luxembourgeoise](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/) est à environ
      vingt-cinq kilomètres.
  de:
    intro: >-
      Es gibt ein Denkmal, an dem drei Länder zusammentreffen, und der Fluss, der dorthin hinabfließt, gräbt
      sein Tal seit Hunderttausenden von Jahren in den Schiefer. Der Naturpark Our nimmt die nordöstliche Ecke
      Luxemburgs in den luxemburgischen Ardennen ein, wo Luxemburg, Belgien und Deutschland
      aufeinandertreffen. Es handelt sich um ein weites Hochplateau auf rund fünfhundert Metern Höhe,
      durchschnitten von engen und tiefen Tälern: jenem der Our, die dem Park ihren Namen gibt, und jenem der
      Clerve. Hier trennt der Fluss nicht mehr, er verbindet: Er bildet das Band mehrerer
      grenzüberschreitender Routen.
    landscape: >-
      Das Gebiet ist ein Schieferplateau auf etwa fünfhundert Metern Höhe, durchzogen von den Tälern der Our
      und der Clerve. An den Steilhängen wächst Wald, während sich Dörfer und Ackerflächen auf den Hochebenen
      konzentrieren. Die Our entspringt auf 653 Metern am Eichelsberg bei Manderfeld im belgischen Hohen Venn
      und fließt über 78 Kilometer bis zu ihrer Mündung in die Sauer bei Wallendorf. Im Park schneidet der
      Fluss einen gewundenen Lauf in die Schiefer und Grauwacken des Islek, teils eng und steilwandig, teils
      weiter geöffnet mit Ufergehölzen und Wiesen.


      Feuchtgebiete bilden die wertvollsten Lebensräume im Tal und auf dem Plateau, unentbehrlich für
      gefährdete Tier- und Pflanzenarten. Mehrere tausend Hektar Eichen-Niederwald, die sogenannten Lohhecken,
      sind erhalten geblieben und prägen das Landschaftsbild über weite Strecken.
    wildlife: >-
      Im Park brütet der gefährdete [Schwarzstorch](/especie/ciconia_nigra/), begleitet von der
      [Flussperlmuschel](/especie/margaritifera_margaritifera/), der [Wildkatze](/especie/felis_silvestris/)
      und dem Haselhuhn. Im klaren Wasser der Our lassen sich [Bachforellen](/especie/salmo_trutta/)
      beobachten, die gegen die Strömung schwimmen.


      Die Routen werden vor allem von Mai bis Oktober begangen.
    visit: >-
      Der Park ist ein Wanderrevier mit zahlreichen Fern-, Themen- und Lehrpfaden. Die erste Nat'Our-Route ist
      die zugänglichste: leicht, 13,1 km, 176 m Höhenunterschied, Gehzeit etwa drei Stunden. Sie beginnt am
      europäischen Dreiländereck-Denkmal, das an die Römischen Verträge vom März 1957 erinnert, folgt der Our
      auf deutscher Seite nach Süden, quert den Fluss und kehrt auf luxemburgischer Seite nordwärts zurück.
      Der Weg verläuft weitgehend im Tal, abgesehen von einem An- und Abstieg zur Königslay, und bietet drei
      Rastplätze mit Informationstafeln zum Element Wasser.


      Anspruchsvoller ist die zweite Nat'Our-Route mit knapp achtzehn Kilometern Länge, fünf Stunden und
      fünfundzwanzig Minuten Dauer und schwieriger Einstufung. Sie beleuchtet die Geschichte der Lohmühlen an
      der Our, während der Aufstieg zum Aussichtspunkt Kasselslee weite Blicke über das Tal eröffnet.


      Unter den Themenwegen führt der Ourdall-Pfad über 8,5 km von Stolzembourg nach Vianden mit zehn
      Stationen zu Geschichte und Gegenwart des Tals. In Hoscheid lädt der sechs Kilometer lange
      Klangwanderweg mit Künstlerinstallationen zum Hinhören in der Natur ein. In Parc Hosingen stellt ein
      fünf Hektar großes Arboretum 45 Baum- und Straucharten vor. Der Schmugglerpfad in Troisvierges folgt den
      Routen von Kriegsdienstverweigerern und Widerstandskämpfern nach Belgien am Ende des Zweiten Weltkriegs,
      mit Varianten über 12 und 9 km. Radbegeisterte finden zwei Straßenradrouten und sechs
      Mountainbike-Strecken vor.


      Das Besucherzentrum, die Casa des Naturparks Our, liegt in Hosingen mit einer Dauerausstellung auf 150
      Quadratmetern zu Natur-, Geschichts- und Kulturerbe.
    history: >-
      Das Dekret zur Gründung des Naturparks trat am 9. Juni 2005 in Kraft. Die Verwaltung erfolgt
      partnerschaftlich durch einen Gemeindeverband und den Staat, mit Projekten in Naturschutz,
      Landwirtschaft, Kultur, Tourismus und Umweltbildung.


      Größte ökologische Herausforderung war der frühere Ersatz von Laubwäldern und Lohhecken durch
      Fichtenmonokulturen. Im Flussbett wurden Querbauwerke rückgebaut: Wo einst Mühlenwehre die Our
      zerschnitten, erreichen Bachforellen wieder ihre Laichplätze.


      Das Schloss Vianden, errichtet zwischen dem elften und vierzehnten Jahrhundert auf römischen und
      karolingischen Vorgängerbauten, sowie die Stollen der Kupfermine Stolzembourg verankern die reiche
      Kulturgeschichte in der Landschaft.
    before: >-
      Führen Sie ausreichend Wasser und passendes Schuhwerk mit. Prüfen Sie Öffnungszeiten von Museen und
      Besucherzentren vorab.
    around: >-
      In unmittelbarer Nachbarschaft liegt der [Naturpark Öewersauer —
      Haute-Sûre-Wälder](/lugar/naturpark-oewersauer---haute-sure-forests/), während die [Region Mullerthal —
      Kleine Luxemburger Schweiz](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/) rund
      fünfundzwanzig Kilometer entfernt ist.
  it:
    intro: >-
      C'è un monumento in cui si incontrano tre nazioni, e il fiume che vi discende scava da centinaia di
      migliaia di anni la propria valle nell'ardesia. Il Parco Naturale dell'Our occupa l'angolo
      nord-orientale del Lussemburgo, nelle Ardenne lussemburghesi, dove convergono Lussemburgo, Belgio e
      Germania. È un altopiano ampio ed elevato, a circa cinquecento metri di quota, inciso da valli strette e
      profonde: quella dell'Our, che battezza il parco, e quella della Clerve. Qui il fiume non divide più, ma
      unisce: funge da filo conduttore per diversi tracciati transfrontalieri.
    landscape: >-
      Il territorio forma un altopiano scistoso a circa cinquecento metri, percorso dalle valli dell'Our e
      della Clerve. Sui versanti ripidi crescono i boschi, mentre abitati e colture si concentrano sui
      pianori. L'Our sorge a 653 metri sull'Eichelsberg presso Manderfeld nelle Hautes Fagnes belghe e scorre
      per 78 chilometri fino a confluire nella Sûre a Wallendorf. Nel parco il fiume scava meandri negli
      scisti e nelle grovacche dell'Éislek, a tratti incassato e scosceso, a tratti più aperto con boschi
      ripari e prati.


      Le zone umide formano gli habitat più preziosi nelle valli e sull'altopiano, essenziali per la
      sopravvivenza di specie minacciate. Parecchie migliaia di ettari di cedui di quercia, i tipici
      Lohhecken, si conservano ancora segnando il paesaggio su ampie distanze.
    wildlife: >-
      Nel parco nidifica la [cicogna nera](/especie/ciconia_nigra/), specie a rischio, affiancata dalla
      [margaritifera d'acqua dolce](/especie/margaritifera_margaritifera/), dal [gatto
      selvatico](/especie/felis_silvestris/) e dal francolino di monte. Nelle acque limpide dell'Our si
      scorgono le [trote fario](/especie/salmo_trutta/) risalire la corrente.


      Gli itinerari si percorrono al meglio da maggio a ottobre.
    visit: >-
      Il parco è un comprensorio escursionistico con numerosi tracciati a lungo raggio, tematici e didattici.
      Il primo percorso Nat'Our è il più accessibile: facile, 13,1 km, 176 m di dislivello, circa tre ore.
      Parte dal monumento europeo del punto d'incontro tripartito a ricordo dei Trattati di Roma del marzo
      1957, segue l'Our verso sud sul versante tedesco, attraversa il fiume e risale a nord su quello
      lussemburghese. Il sentiero rimane perlopiù sul fondovalle salvo una salita e discesa alla Königslay, e
      offre tre aree di sosta dedicate al ruolo vitale dell'acqua.


      Più impegnativa, la seconda rotta Nat'Our copre quasi diciotto chilometri, dura cinque ore e venticinque
      minuti ed è catalogata come difficile. Ripercorre la storia dei mulini da concia dell'Our che macinavano
      corteccia di quercia, mentre la salita al belvedere di Kasselslee regala viste aperte sulla vallata.


      Tra i percorsi tematici, il sentiero Ourdall copre 8,5 km tra Stolzembourg e Vianden con dieci tappe su
      passato e presente del territorio. A Hoscheid, il sentiero sonoro di sei chilometri propone
      installazioni d'artisti per ascoltare la natura. A Parc Hosingen, un arboreto di cinque ettari presenta
      45 specie di alberi e arbusti. Il Sentiero dei Contrabbandieri a Troisvierges ricalca i passaggi verso
      il Belgio di renitenti e partigiani alla fine della Seconda Guerra Mondiale, con varianti da 12 e 9 km.
      Per i ciclisti sono disponibili due itinerari su strada e sei circuiti per mountain bike.


      Il centro visite, la Casa del Parco Naturale dell'Our, ha sede a Hosingen ed espone 150 metri quadrati
      di mostra permanente su natura, storia e tradizioni.
    history: >-
      Il decreto istitutivo del parco naturale è entrato in vigore il 9 giugno 2005. La gestione è affidata a
      un consorzio di comuni assieme allo Stato, con interventi per conservazione, agricoltura, cultura,
      turismo ed educazione ambientale.


      La principale problematica ecologica è stata la sostituzione dei boschi di latifoglie con monocolture di
      abete rosso. Di contro, sono state rimosse briglie e sbarramenti: dove le chiuse dei mulini
      frammentavano l'Our, le trote hanno riconquistato le aree di frega.


      Il castello di Vianden, eretto tra l'XI e il XIV secolo su una fortezza romana e un rifugio carolingio,
      assieme alle gallerie della miniera di rame di Stolzembourg, arricchiscono il comprensorio di
      testimonianze storiche.
    before: >-
      Munitevi di acqua e abbigliamento adeguato. Verificate in anticipo gli orari di musei e strutture
      informative.
    around: >-
      Immediatamente contiguo si estende il [Naturpark Öewersauer — Foreste
      dell'Haute-Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/), mentre la [Regione del Mullerthal —
      Piccola Svizzera Lussemburghese](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/) dista circa
      venticinque chilometri.
  pt:
    intro: >-
      Há um monumento onde três países se cruzam, e o rio que desce até ele escava o seu vale no xisto há
      centenas de milhares de anos. O Parque Natural do Our ocupa o extremo nordeste do Luxemburgo, nas
      Ardenas luxemburguesas, onde confluem o Luxemburgo, a Bélgica e a Alemanha. É um planalto amplo e
      elevado, a cerca de quinhentos metros de altitude, rasgado por vales estreitos e profundos: o do Our,
      que dá nome ao parque, e o do Clerve. Aqui o rio já não separa, une: constitui o eixo de várias rotas
      transfronteiriças.
    landscape: >-
      O território forma um planalto xistoso a cerca de quinhentos metros, atravessado pelos vales do Our e do
      Clerve. As encostas íngremes sustentam floresta, enquanto povoações e culturas agrícolas se concentram
      nos planaltos. O Our nasce a 653 metros no Eichelsberg, perto de Manderfeld nas Hautes Fagnes belgas, e
      percorre 78 quilómetros até desaguar no Sûre, em Wallendorf. No parque, o rio desenha um traçado sinuoso
      nos xistos e grauvacas do Éislek, ora encaixado e abrupto, ora mais aberto com galerias ripícolas e
      prados.


      As zonas húmidas constituem os habitats de maior valor nos vales e no planalto, essenciais para espécies
      vulneráveis. Vários milhares de hectares de talhadia de carvalho, as tradicionais Lohhecken, subsistem e
      pontuam a paisagem ao longo de extensos troços.
    wildlife: >-
      No parque nidifica a [cegonha-preta](/especie/ciconia_nigra/), espécie ameaçada, juntamente com o
      [mexilhão-de-rio-perlífero](/especie/margaritifera_margaritifera/), o
      [gato-bravo](/especie/felis_silvestris/) e o galo-da-aveleira. No leito límpido do Our é possível
      vislumbrar as [trutas-fario](/especie/salmo_trutta/) a nadar contra a corrente.


      Os percursos realizam-se sobretudo entre maio e outubro.
    visit: >-
      O parque é um destino privilegiado de pedestrianismo, com numerosos trilhos de longo curso, temáticos e
      didáticos. O primeiro trilho Nat'Our é o mais acessível: fácil, 13,1 km, 176 m de desnível, cerca de
      três horas. Inicia-se no monumento europeu da trifronteira, que recorda os Tratados de Roma de março de
      1957, segue o Our para sul na margem alemã, atravessa o rio e regressa para norte na margem
      luxemburguesa. O percurso mantém-se quase sempre no vale com uma subida e descida a Königslay, dispondo
      de três pontos de paragem sobre o papel vital da água.


      Mais exigente, o segundo percurso Nat'Our estende-se por quase dezoito quilómetros, dura cinco horas e
      vinte e cinco minutos e é qualificado como difícil. Evoca a história dos moinhos de casca de carvalho do
      Our, proporcionando a subida ao miradouro de Kasselslee amplas panorâmicas.


      Entre as rotas temáticas, o trilho Ourdall cobre 8,5 km entre Stolzembourg e Vianden com dez paragens
      interpretativas sobre o vale. Em Hoscheid, o percurso sonoro de seis quilómetros apresenta instalações
      artísticas para escutar a natureza. No Parc Hosingen, um arboreto de cinco hectares reúne 45 espécies de
      árvores e arbustos. O Trilho dos Contrabandistas em Troisvierges reconstitui a rota de fuga para a
      Bélgica de resistentes no final da Segunda Guerra Mundial, com variantes de 12 e 9 km. Para os ciclistas
      existem dois percursos de estrada e seis circuitos de btt.


      O centro de acolhimento, a Casa do Parque Natural do Our, localiza-se em Hosingen com uma exposição
      permanente de 150 metros quadrados sobre património natural e histórico.
    history: >-
      O decreto de criação do parque natural entrou em vigor a 9 de junho de 2005. É administrado por uma
      associação intermunicipal em conjunto com o Estado, promovendo projetos de conservação, agricultura,
      turismo e educação ambiental.


      O maior problema ecológico consistiu na substituição das matas autóctones por monoculturas de espruces.
      Em contrapartida, os açudes fluviais foram retirados: onde outrora os moinhos fragmentavam o Our, as
      trutas voltaram a aceder às suas zonas de desova.


      O castelo de Vianden, erguido entre os séculos XI e XIV sobre uma fortaleza romana e um refúgio
      carolíngio, e as galerias da mina de cobre de Stolzembourg completam o valor histórico da região.
    before: Leve água e calçado apropriado. Consulte previamente os horários de visita das atrações.
    around: >-
      Contíguo ao território fica o [Naturpark Öewersauer — Florestas da
      Haute-Sûre](/lugar/naturpark-oewersauer---haute-sure-forests/), situando-se a [Região de Mullerthal —
      Pequena Suíça Luxemburguesa](/lugar/region-mullerthal---petite-suisse-luxembourgeoise/) a cerca de vinte
      e cinco quilómetros.
