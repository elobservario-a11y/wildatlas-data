unico:
  es: >-
    Un río que lleva cientos de miles de años cavando su valle en la pizarra y que, donde antes separaba
    países, hoy es símbolo de paz y amistad.
  en: >-
    A river that has spent hundreds of thousands of years carving its valley into slate, and which once
    divided nations but today symbolizes peace and friendship.
  fr: >-
    Une rivière qui creuse sa vallée dans le schiste depuis des centaines de milliers d'années et qui, après
    avoir séparé des pays, symbolise aujourd'hui paix et amitié.
  de: >-
    Ein Fluss, der seit Hunderttausenden von Jahren sein Tal in den Schiefer gräbt und heute nach einstiger
    Trennung ein Symbol für Frieden und Freundschaft bildet.
  it: >-
    Un fiume che scava la sua valle nell'ardesia da centinaia di migliaia di anni e che, dopo aver diviso
    nazioni, oggi simboleggia pace e amicizia.
  pt: >-
    Um rio que escava o seu vale no xisto há centenas de milhares de anos e que, onde outrora dividia nações,
    hoje simboliza paz e amizade.
