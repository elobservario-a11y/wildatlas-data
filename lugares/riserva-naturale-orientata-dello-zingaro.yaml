resumen:
  es: >-
    La primera reserva natural declarada en Sicilia (1981), 7 km de costa virgen caliza salpicada de palmitos
    salvajes y calas turquesas inaccesibles por carretera.
  en: >-
    The first nature reserve established in Sicily (1981), 7 km of pristine limestone coastline dotted with
    dwarf fan palms and turquoise coves unreachable by road.
  fr: >-
    La première réserve naturelle déclarée en Sicile (1981), 7 km de côte calcaire vierge parsemée de palmiers
    nains sauvages et de criques turquoise inaccessibles par la route.
  de: >-
    Das erste Naturschutzgebiet Siziliens (1981), 7 km unberührte Kalksteinküste mit wilden Zwergpalmen und
    türkisfarbenen Buchten abseits jeder Straße.
  it: >-
    La prima riserva naturale istituita in Sicilia (1981), 7 km di costa calcarea incontaminata punteggiata da
    palme nane selvatiche e calette turchesi inaccessibili via strada.
  pt: >-
    A primeira reserva natural declarada na Sicília (1981), 7 km de costa calcária intocada salpicada de
    palmeiras-anãs selvagens e enseadas azul-turquesa sem acesso rodoviário.
unico:
  es: >-
    Una costa caliza de unos 7 km sin carretera, con calas de guijarros de agua transparente y palmitos hasta
    el borde del acantilado.
  en: >-
    A roadless limestone coastline of about 7 km, with translucent pebble coves and wild dwarf palms
    descending right to the cliff edge.
  fr: >-
    Un littoral calcaire d'environ 7 km sans route, ponctué de criques de galets aux eaux translucides et de
    palmiers nains jusqu'au bord des falaises.
  de: >-
    Eine straßenlose Kalksteinküste von etwa 7 km Länge mit Buchten aus hellem Kiesel und Zwergpalmen bis an
    die Klippenkante.
  it: >-
    Una costa calcarea di circa 7 km senza strade, con calette di ciottoli trasparenti e palme nane fino
    all'orlo della scogliera.
  pt: >-
    Uma costa calcária de cerca de 7 km sem estrada, com enseadas de seixos transparentes e palmeiras-anãs até
    ao bordo da falésia.
observaciones:
  es: >-
    Aunque no es reserva marina, está prohibido introducir fusiles, cañas de pescar e instrumentos de captura
    de cualquier tipo. Comprueba con el gestor las condiciones de visita y los sectores abiertos antes de ir.
texto:
  es:
    intro: >-
      Durante años, el plan era abrir una carretera por la costa. Hubo incluso obras, que empezaron en 1976.
      Lo que se interpuso fue una protesta: varias asociaciones naturalistas se unieron de 1974 a 1981 y, en
      1980, una marcha de unas tres mil personas tomó simbólicamente el territorio. Así se salvó uno de los
      pocos tramos de costa siciliana sin carretera litoral, y así nació, con la ley regional 98/81, la
      Riserva Naturale Orientata dello Zingaro, la primera reserva de Sicilia. Hoy son 1650 hectáreas en el
      extremo occidental del golfo de Castellammare, en la península de San Vito Lo Capo, que se recorren
      únicamente a pie.
    landscape: >-
      La reserva es una franja de unos 7 km de costa rocosa de calizas del Mesozoico, interrumpida por
      numerosas calas. Desde el Monte Speziale, de 913 metros, los acantilados caen rápido al mar. Hay
      fenómenos kársticos notables, con altiplanos y dolinas donde la erosión acumula tierra roja.


      Las calas se suceden de sur a norte: desde la entrada de Scopello, se llaman Capreria, Varo (accesible
      por mar), Disa o Zingaro, Beretta, Marinella y Torre dell'Uzzo. Todas son de guijarros.


      El clima lo explica casi todo: una temperatura media anual de 19°C y 645 mm de lluvia. Aunque no llueva,
      bancos de niebla del mar se estancan sobre los montes y sostienen microclimas húmedos. La garriga de
      palmito es lo más extendido, en algunos tramos muy densa. Es un ambiente seminatural, fruto de una
      acción milenaria de pastores, agricultores y artesanos, porque hasta hace poco cada superficie, por
      pequeña que fuera, se cultivaba. Más arriba, en las pendientes norte del Monte Passo del Lupo, quedan
      relictos de encinar, y en el límite oeste fragmentos de alcornocal, formación que ha desaparecido casi
      del todo en Sicilia occidental. Y al pie del Monte Acci, unas depresiones húmedas con juncos y carrizos
      son vitales para la fauna residente.
    wildlife: >-
      Las rocas, la maquia y la garriga son el hogar ideal de especies en declive. El orgullo de la reserva es
      el [águila perdicera](/especie/aquila_fasciata/), que cría con regularidad; con ella están el halcón
      peregrino y la perdiz griega siciliana, que aquí mantiene poblaciones estables. Más de cuarenta aves
      residentes completan el cuadro: gaviotas, herrerillo, abubilla, chochín, escribano y ruiseñor.


      Los encuentros más cercanos son con el conejo, la comadreja, el erizo, el zorro al anochecer y el
      [puercoespín](/especie/hystrix_cristata/), solo nocturno, que delata su presencia con púas blancas y
      negras. Entre los reptiles hay culebra verdiamarilla, culebra de Esculapio, coronela y víbora, y en
      cualquier estación puede verse la lagartija siciliana, exclusiva de la isla. En las zonas húmedas vive
      el sapillo pintojo, un anfibio parecido a una rana, ausente del resto de Italia, y ocho especies de
      murciélagos pasan el día en cavidades.


      En la flora, Limonium flagellare es endémico del tramo de costa entre Zingaro y Balestrate, y también
      hay Dianthus rupicola y la centaurea de Sicilia. En la garriga crecen orquídeas de tierra, como Ophrys
      simulata, Ophrys oxyrrhynchos, endémica de Sicilia, Orchis commutata y la orquídea de Branciforti.


      Bajo el agua, a nivel de marea, el alga Cystoseira stricta indica la pureza del agua. Más abajo aparecen
      anémonas, madréporas y esponjas, y el coral naranja Astroides calycularis tiñe las paredes de naranja a
      rojo fuego. A gran profundidad aún brilla el coral rojo.
    visit: >-
      La reserva tiene dos entradas: la sur, a un km de Scopello, y la norte, desde San Vito Lo Capo (unos 12
      km). Dentro no se circula en coche: se deja el vehículo en el aparcamiento y se sigue a pie por los
      senderos.


      El sendero costero va de la entrada sur a la norte por Punta Capreria, Cala del Varo, Contrada
      Marinella, Torre dell'Uzzo y Tonnarella dell'Uzzo. Si prefieres subir, el sendero Passo del Lupo parte
      del sendero principal y sube por Borgo Cusenza, el Monte Passo del Lupo, Portella Mandra Nuova y el
      Monte Speziale.


      Dentro hay un Museo Naturalístico, un Museo de las Actividades Marineras, un Museo de la Civilización
      Campesina, donde se reproduce el ciclo completo del trigo, y un Centro de Educación Ambiental. Algunos
      edificios rurales de la zona funcionan como puntos informativos o vivacs.
    history: >-
      La historia de Zingaro es una historia de protesta: la protesta de las asociaciones naturalistas,
      apoyadas por una campaña de prensa, evitó una carretera que ya estaba en obras y dio lugar a la primera
      reserva de Sicilia. Hoy la reserva se extiende por el municipio de San Vito Lo Capo y, en menor medida,
      por el de Castellammare.
    before: >-
      Aunque no es reserva marina, está prohibido introducir fusiles, cañas de pescar e instrumentos de
      captura de cualquier tipo. Comprueba con el gestor las condiciones de visita y los sectores abiertos
      antes de ir.
    around: >-
      Por sus rocas y sus especies, Zingaro se parece a otros espacios calizos mediterráneos: el [Parque
      Natural de la Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) y el [Parque Nacional Sierra de
      las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) comparten con él el águila perdicera y el
      halcón peregrino en terreno kárstico, y el [Parque Nacional de las
      Calanques](/lugar/parc-national-des-calanques/) añade la costa y el mar con el águila perdicera.
  en:
    intro: >-
      For years, the plan was to blast a coastal highway along this shore. Roadwork actually began in 1976.
      What stopped the bulldozers was a grassroots protest: multiple conservation groups banded together
      between 1974 and 1981, culminating in 1980 when a march of three thousand citizens symbolically occupied
      the territory. That victory preserved one of the few stretches of Sicilian shoreline untouched by
      asphalt, giving rise, under regional law 98/81, to the Riserva Naturale Orientata dello Zingaro—Sicily's
      very first nature reserve. Today, its 1,650 hectares at the western tip of the Gulf of Castellammare, on
      the San Vito Lo Capo peninsula, can be explored exclusively on foot.
    landscape: >-
      The reserve encompasses a 7 km strip of Mesozoic limestone sea cliffs, punctuated by secluded coves.
      From Monte Speziale, rising to 913 metres, sheer bluffs plunge directly into the sea. Karst features
      abound, with high karstic plateaus and dolines where weathering concentrates deep terra rossa soils.


      The coves unfold from south to north: entering from Scopello, they are Cala Capreria, Cala del Varo
      (accessible only by sea), Cala della Disa or Zingaro, Cala Beretta, Cala Marinella and Cala Torre
      dell'Uzzo. All feature pure white limestone shingle.


      Climate drives the ecosystem: a mean annual temperature of 19 °C and 645 mm of rain. Even when rain
      fails, maritime sea fogs linger across the mountain crests, sustaining humid microclimates. Dwarf fan
      palm (*Chamaerops humilis*) garrigue is widespread, exceptionally dense in places. This semi-natural
      landscape reflects millennia of pastoralism, terracing and artisan crafts, as every scrap of land was
      once cultivated. Higher up, on northern slopes of Monte Passo del Lupo, relict holm oak woods cling to
      life, while western fringes preserve fragments of cork oak—a habitat virtually extinct elsewhere in
      western Sicily. At the foot of Monte Acci, wet hollows with rushes and reeds provide vital drinking
      water for resident wildlife.
    wildlife: >-
      Limestone precipices, coastal macchia and garrigue provide an ideal haven for declining Mediterranean
      species. The crown jewel of Zingaro is [Bonelli's eagle](/especie/aquila_fasciata/), which nests
      regularly on the sea cliffs; alongside it thrive peregrine falcons and the Sicilian rock partridge,
      maintaining healthy populations. More than forty resident bird species complete the picture:
      yellow-legged gulls, blue tits, hoopoes, wrens, corn buntings and nightingales.


      Closest wildlife encounters involve wild rabbits, least weasels, European hedgehogs, foxes at dusk and
      the [crested porcupine](/especie/hystrix_cristata/), strictly nocturnal, betraying its presence through
      shed black-and-white quills. Reptiles include the western whip snake, Aesculapian snake, smooth snake
      and asp viper; the Sicilian wall lizard, endemic to the island, is visible in all seasons. Damp
      depressions shelter the Sicilian painted frog (*Discoglossus pictus*), an amphibian absent from mainland
      Italy, while eight bat species roost in karst caverns.


      Flora features *Limonium flagellare*, endemic strictly to the coastal strip between Zingaro and
      Balestrate, alongside rock carnation (*Dianthus rupicola*) and Sicilian cornflower. The garrigue
      nurtures wild terrestrial orchids, including *Ophrys simulata*, the Sicilian endemic *Ophrys
      oxyrrhynchos*, *Orchis commutata* and Branciforti's orchid.


      Beneath the waves, right at the tidal fringe, the brown alga *Cystoseira stricta* testifies to pristine
      water clarity. Lower down, sea anemones, stony corals and sponges flourish, while orange false coral
      (*Astroides calycularis*) paints the submerged cliffs fiery orange to crimson. In deep waters, precious
      red coral still thrives.
    visit: >-
      The reserve has two entry gates: the southern entrance, one kilometre from Scopello, and the northern
      entrance from San Vito Lo Capo (around 12 km). No motor vehicles may enter: park at the designated lots
      and proceed along the footpaths.


      The coastal path links the south and north gates via Punta Capreria, Cala del Varo, Contrada Marinella,
      Torre dell'Uzzo and Tonnarella dell'Uzzo. If you prefer upland hiking, the Passo del Lupo trail ascends
      from the main path past Borgo Cusenza, Monte Passo del Lupo, Portella Mandra Nuova and Monte Speziale.


      Within the reserve are a Naturalistic Museum, a Museum of Maritime Activities, a Museum of Peasant
      Culture displaying the traditional wheat production cycle, and an Environmental Education Centre.
      Several historic rural stone farmsteads operate as visitor stations or bivouacs.
    history: >-
      Zingaro's creation is a story of environmental activism: citizen mobilisation and a relentless media
      campaign halted a highway project already under construction, creating Sicily's pioneer reserve. Today
      the protected area falls within San Vito Lo Capo municipality and, to a lesser extent, Castellammare del
      Golfo.
    before: >-
      Although not a formal marine reserve, bringing spearguns, fishing rods or any capture devices into the
      reserve is strictly prohibited. Confirm visiting conditions and trail closures with the reserve
      authority prior to your trip.
    around: >-
      With its rugged cliffs and raptor communities, Zingaro echoes other Mediterranean limestone strongholds:
      [Serra de Montsant Natural Park](/lugar/parc-natural-de-la-serra-de/) and [Sierra de las Nieves National
      Park](/lugar/parque-nacional-sierra-de-las-nieves/) share Bonelli's eagle and peregrine falcon in karst
      landscapes, while the [Calanques National Park](/lugar/parc-national-des-calanques/) pairs sea cliffs
      and azure waters with Bonelli's eagle.
  fr:
    intro: >-
      Durant des années, le projet prévoyait de percer une route côtière sur ce littoral. Les travaux
      débutèrent même en 1976. Ce qui arrêta les engins fut un sursaut citoyen : plusieurs associations de
      protection de la nature s'unirent de 1974 à 1981 et, en 1980, une marche de trois mille personnes occupa
      pacifiquement les lieux. C'est ainsi que fut sauvé l'un des rares rivages siciliens sans bitume, et que
      naquit, par la loi régionale 98/81, la Riserva Naturale Orientata dello Zingaro—la toute première
      réserve de Sicile. Aujourd'hui, ses 1 650 hectares à l'extrémité occidentale du golfe de Castellammare,
      sur la péninsule de San Vito Lo Capo, se découvrent exclusivement à pied.
    landscape: >-
      La réserve forme une bande de 7 km de falaises calcaires mésozoïques plongeant dans la mer, entrecoupée
      de criques isolées. Depuis le Monte Speziale, à 913 mètres, les parois tombent à pic vers les flots. Les
      phénomènes karstiques y sont remarquables, avec des plateaux d'altitude et des dolines où l'altération
      concentre la *terra rossa*.


      Les criques s'égrènent du sud au nord : depuis l'accès de Scopello, ce sont Cala Capreria, Cala del Varo
      (accessible par mer), Cala della Disa ou Zingaro, Cala Beretta, Cala Marinella et Cala Torre dell'Uzzo.
      Toutes sont formées de galets d'un blanc immaculé.


      Le climat régit l'écosystème : une température moyenne annuelle de 19 °C et 645 mm de pluie. Même sans
      averse, des bancs de brouillard marin s'accrochent aux crêtes et entretiennent des microclimats humides.
      La garrigue à palmier nain (*Chamaerops humilis*) constitue le paysage dominant, très dense par
      endroits. Ce milieu semi-naturel découle d'une occupation millénaire de bergers et d'artisans, chaque
      terrasse ayant été jadis cultivée. Plus haut, sur les pentes nord du Monte Passo del Lupo, survivent des
      lambeaux de yeuseraies, tandis qu'à l'ouest subsistent des reliques de chêne-liège, formation quasi
      disparue en Sicile occidentale. Au pied du Monte Acci, des dépressions humides à joncs et roseaux sont
      vitales pour abreuver la faune.
    wildlife: >-
      Falaises abruptes, maquis et garrigues composent un biotope d'élection pour la faune méditerranéenne en
      recul. La gloire du Zingaro est l'[aigle de Bonelli](/especie/aquila_fasciata/), qui niche fidèlement
      sur les falaises côtières ; à ses côtés prospèrent le faucon pèlerin et la perdrix bartavelle de Sicile.
      Plus de quarante espèces d'oiseaux sédentaires complètent l'avifaune : goélands leucophées, mésanges
      bleues, hüppés, troglodytes et rossignols.


      Les mammifères croisés sont le lapin de garenne, la belette, le hérisson d'Europe, le renard au
      crépuscule et le [porc-épic du Nord de l'Afrique](/especie/hystrix_cristata/), nocturne et discret,
      trahi par ses piquants noirs et blancs. Côté reptiles se rencontrent la couleuvre verte et jaune, la
      couleuvre d'Esculape, la coronelle et la vipère ; le lézard sicilien, endémique insulaire, s'observe en
      toute saison. Dans les suintements vit le discoglosse peint, amphibien absent de la péninsule italienne,
      et huit espèces de chauves-souris logent dans les grottes.


      La flore compte le *Limonium flagellare*, endémique strict du trait de côte entre Zingaro et Balestrate,
      ainsi que l'œillet des rochers et la centaurée de Sicile. Les pelouses abritent des orchidées sauvages
      comme *Ophrys simulata*, l'endémique *Ophrys oxyrrhynchos*, *Orchis commutata* et l'orchidée de
      Branciforti.


      Sous l'eau, en zone intertidale, l'algue *Cystoseira stricta* prouve la pureté de la mer. Plus bas se
      déploient anémones, madrépores et éponges, et le faux corail *Astroides calycularis* enflamme les parois
      de nuances rougeoyantes. Dans les profondeurs brille encore le corail rouge.
    visit: >-
      La réserve dispose de deux entrées : l'entrée sud, à un kilomètre de Scopello, et l'entrée nord, depuis
      San Vito Lo Capo (environ 12 km). Les véhicules motorisés sont interdits : garez-vous aux parkings
      aménagés et poursuivez à pied.


      Le sentier côtier relie les deux entrées via Punta Capreria, Cala del Varo, Contrada Marinella, Torre
      dell'Uzzo et Tonnarella dell'Uzzo. Pour prendre de la hauteur, le chemin du Passo del Lupo s'élève
      depuis l'axe principal vers Borgo Cusenza, le Monte Passo del Lupo, Portella Mandra Nuova et le Monte
      Speziale.


      Plusieurs musées ponctuent la visite : un musée naturaliste, un musée des activités maritimes, un musée
      de la civilisation paysanne reconstituant le cycle du blé, et un centre d'éducation environnementale.
      Des bâtisses rurales traditionnelles servent de points d'accueil ou de bivouacs.
    history: >-
      L'histoire du Zingaro est celle d'une victoire collective : la mobilisation des naturalistes et une
      intense campagne de presse stoppèrent la route en chantier, donnant naissance à la réserve pionnière de
      Sicile. Le territoire s'étend sur la commune de San Vito Lo Capo et, pour une part moindre, sur
      Castellammare del Golfo.
    before: >-
      Bien qu'il ne s'agisse pas d'une réserve marine, l'introduction de fusils sous-marins, cannes à pêche ou
      tout engin de capture est prohibée. Renseignez-vous auprès des gestionnaires sur les conditions de
      visite et les tronçons ouverts.
    around: >-
      Par son relief calcaire et ses rapaces, le Zingaro rappelle d'autres bastions méditerranéens : le [Parc
      naturel de la Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) et le [Parc national Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) partagent l'aigle de Bonelli et le faucon pèlerin
      en zone karstique, tandis que le [Parc national des Calanques](/lugar/parc-national-des-calanques/)
      allie littoral marin et aigle de Bonelli.
  de:
    intro: >-
      Jahrelang sah die Planung eine Küstenstraße entlang dieses Ufers vor. Die Bauarbeiten begannen 1976. Was
      die Planierraupen stoppte, war bürgerschaftlicher Widerstand: Naturschutzverbände schlossen sich von
      1974 bis 1981 zusammen, und 1980 besetzten dreitausend Wanderer friedlich das Gelände. So wurde einer
      der wenigen unverbauten sizilianischen Küstenstreifen gerettet, und durch das Regionalgesetz 98/81
      entstand die Riserva Naturale Orientata dello Zingaro—Siziliens allererstes Schutzgebiet. Heute lassen
      sich die 1.650 Hektar an der Westspitze des Golfs von Castellammare auf der Halbinsel San Vito Lo Capo
      ausschließlich zu Fuß erkunden.
    landscape: >-
      Das Reservat bildet einen 7 km langen Streifen mesozoischer Kalksteinklippen, unterbrochen von
      abgelegenen Badebuchten. Vom 913 Meter hohen Monte Speziale stürzen die Felswände steil ins Meer ab.
      Karstphänomene prägen die Landschaft mit Hochebenen und Dolinen, in denen sich fruchtbare Terra Rossa
      sammelt.


      Die Buchten reihen sich von Süd nach Nord: vom Eingang Scopello aus sind dies Cala Capreria, Cala del
      Varo (nur vom Meer aus erreichbar), Cala della Disa oder Zingaro, Cala Beretta, Cala Marinella und Cala
      Torre dell'Uzzo. Alle bestehen aus weißen Rundkieseln.


      Das Klima bestimmt das Ökosystem: eine Jahresdurchschnittstemperatur von 19 °C und 645 mm Niederschlag.
      Selbst bei Trockenheit lagern sich Seenebel an den Bergrücken an und schaffen feuchte Kleinklimazonen.
      Zwergpalmen-Garrigue (*Chamaerops humilis*) dominiert die Hänge, stellenweise undurchdringlich dicht.
      Diese Kulturlandschaft entstand durch jahrhundertelange Weidewirtschaft, da früher jeder Quadratmeter
      terrassiert war. Weiter oben, an den Nordhängen des Monte Passo del Lupo, haben Steineichenwäldchen
      überdauert, während im Westen Korkeichenreste stehen, die im westlichen Sizilien fast verschwunden sind.
      Am Fuß des Monte Acci bieten feuchte Senken mit Binsen lebenswichtiges Trinkwasser für die Tierwelt.
    wildlife: >-
      Schroffe Steilwände, Macchie und Zwergpalmenfluren bieten selten gewordenen Arten Zuflucht. Der Stolz
      von Zingaro ist der [Habichtsadler](/especie/aquila_fasciata/), der regelmäßig in den Klippen horstet;
      neben ihm leben Wanderfalke und das sizilianische Steinhuhn. Über vierzig Standvogelarten ergänzen die
      Avifauna: Mittelmeermöwen, Blaumeisen, Wiedehopfe, Zaunkönige, Grauammern und Nachtigallen.


      Begegnungen gibt es mit Wildkaninchen, Mauswieseln, Igeln, Füchsen in der Abenddämmerung und dem
      nachtaktiven [Gewöhnlichen Stachelschwein](/especie/hystrix_cristata/), das seine Anwesenheit durch
      schwarz-weiße Stacheln verrät. Unter den Reptilien finden sich Gelbgrüne Zornnatter, Äskulapnatter,
      Schlingnatter und Aspisviper; die sizilianische Mauereidechse ist ganzjährig aktiv. In Feuchtstellen
      lebt der Gemalte Scheibenzüngler (*Discoglossus pictus*), ein auf dem italienischen Festland fehlender
      Froschlurch, während acht Fledermausarten in Karsthöhlen den Tag verbringen.


      Die Flora birgt *Limonium flagellare*, eine endemische Strandfliederart des Küstenstreifens zwischen
      Zingaro und Balestrate, sowie Felsennelke und Sizilianische Flockenblume. In den Hängen blühen
      Erdorchideen wie *Ophrys simulata*, das endemische *Ophrys oxyrrhynchos*, *Orchis commutata* und
      Brancifortis Knabenkraut.


      Unter Wasser zeigt die Braunalge *Cystoseira stricta* im Gezeitenbereich höchste Wasserqualität an.
      Tiefer wachsen Seeanemonen, Steinkorallen und Schwämme, während die Sternkoralle *Astroides calycularis*
      die Felswände leuchtend orangerot färbt. In größeren Tiefen schimmert die Rote Edelkoralle.
    visit: >-
      Das Reservat besitzt zwei Zugänge: das Südtor, einen Kilometer von Scopello entfernt, und das Nordtor
      bei San Vito Lo Capo (rund 12 km). Im Schutzgebiet gibt es keinen Fahrverkehr: Parke auf den
      Besucherparkplätzen und wandere zu Fuß weiter.


      Der Küstenpfad verbindet Süd- und Nordtor über Punta Capreria, Cala del Varo, Contrada Marinella, Torre
      dell'Uzzo und Tonnarella dell'Uzzo. Wer Höhenmeter sucht, wählt den Passo-del-Lupo-Weg über Borgo
      Cusenza, Monte Passo del Lupo, Portella Mandra Nuova und Monte Speziale.


      Im Inneren befinden sich ein Naturkundemuseum, ein Meeresmuseum, ein Museum bäuerlicher Kultur mit
      Darstellung des Weizenanbaus sowie ein Umweltbildungszentrum. Mehrere Steinhäuser dienen als Infopunkte
      oder Notunterkünfte.
    history: >-
      Die Entstehung von Zingaro ist eine Erfolgsgeschichte des zivilen Protests: Der Einsatz von
      Naturschützern und eine breite Medienkampagne stoppten die im Bau befindliche Straße und schufen
      Siziliens erstes Reservat. Es liegt auf dem Gebiet der Gemeinden San Vito Lo Capo und Castellammare del
      Golfo.
    before: >-
      Auch wenn es kein Meeresreservat ist, ist das Mitführen von Harpunen, Angelruten und Fanggeräten jeder
      Art untersagt. Erkundige dich vorab bei der Parkverwaltung nach Witterungsbedingungen und geöffneten
      Pfaden.
    around: >-
      Mit seinen Felsformationen und Greifvögeln ähnelt Zingaro anderen mediterranen Karstgebieten: Der
      [Naturpark Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) und der [Nationalpark Sierra de las
      Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) teilen Habichtsadler und Wanderfalke im Kalkstein,
      während der [Nationalpark Calanques](/lugar/parc-national-des-calanques/) Meeresklippen und
      Habichtsadler vereint.
  it:
    intro: >-
      Per anni, il progetto prevedeva una litoranea asfaltata lungo questa costa. I lavori ebbero persino
      inizio nel 1976. A fermare le ruspe fu una clamorosa mobilitazione popolare: associazioni ambientaliste
      fecero fronte comune dal 1974 al 1981 e, nel 1980, una marcia pacifica di circa tremila persone occupò
      simbolicamente il tracciato. Fu salvato così uno dei rari tratti di litorale siciliano rimasti intatti,
      dando vita, con la legge regionale 98/81, alla Riserva Naturale Orientata dello Zingaro—la prima riserva
      della Sicilia. Oggi i suoi 1650 ettari all'estremità occidentale del golfo di Castellammare, nella
      penisola di San Vito Lo Capo, si percorrono rigorosamente a piedi.
    landscape: >-
      La riserva si sviluppa su una fascia di circa 7 km di scogliere calcaree mesozoiche a picco sul mare,
      intagliate da cale appartate. Dal Monte Speziale, alto 913 metri, le falesie precipitano verticali verso
      le onde. Spiccano vistosi fenomeni carsici con pianori d'alta quota e doline colme di fertile terra
      rossa.


      Le calette si susseguono da sud a nord: entrando da Scopello, si incontrano Cala Capreria, Cala del Varo
      (raggiungibile solo via mare), Cala della Disa o Zingaro, Cala Beretta, Cala Marinella e Cala Torre
      dell'Uzzo. Sono tutte formate da candidi ciottoli levigati.


      Il clima detta i ritmi biologici: una temperatura media annua di 19 °C e 645 mm di pioggia. Anche in
      assenza di precipitazioni, le nebbie marine stagnano sulle creste montuose alimentando microclimi umidi.
      La gariga a palma nana (*Chamaerops humilis*) domina sovrana, fittissima in molti settori. È un mosaico
      seminaturale plasmato da secoli di civiltà contadina, dove ogni gradone era un tempo coltivato. Più in
      alto, sui versanti settentrionali di Monte Passo del Lupo, resistono nuclei relitti di lecceta, mentre a
      occidente sopravvivono sparute sugherete, altrove quasi scomparse nella Sicilia occidentale. Ai piedi di
      Monte Acci, pozze umide con giunchi e canne assicurano abbeverata alla fauna.
    wildlife: >-
      Rupi scoscese, macchia mediterranea e garighe sono il rifugio ideale per specie minacciate. L'emblema
      dello Zingaro è l'[aquila di Bonelli](/especie/aquila_fasciata/), che nidifica sulle pareti rocciose;
      accanto a lei risiedono il falco pellegrino e la coturnice di Sicilia. Oltre quaranta specie nidificanti
      arricchiscono il quadro: gabbiani reali, cinciarelle, upupe, scriccioli, strillozzi e usignoli.


      Tra i mammiferi si incontrano conigli selvatici, donnole, ricci, volpi all'imbrunire e l'elusivo
      [istrice crestato](/especie/hystrix_cristata/), prettamente notturno, tradito dagli aculei bicolori
      abbandonati a terra. Tra i rettili figurano biacco, colubro di Esculapio, coronella e vipera; la
      lucertola campestre siciliana si fa scorgere in ogni periodo. Nelle lame d'acqua vive il discoglosso
      dipinto, anfibio assente dall'Italia continentale, e otto specie di chirotteri si rifugiano nelle grotte
      carsiche.


      La flora include il *Limonium flagellare*, endemico esclusivo del tratto tra Zingaro e Balestrate, il
      garofano rupestre e la centaurea di Sicilia. Tra l'erba fioriscono orchidee selvatiche come *Ophrys
      simulata*, l'endemica *Ophrys oxyrrhynchos*, *Orchis commutata* e l'orchidea di Branciforti.


      Sott'acqua, a pelo di marea, l'alga bruna *Cystoseira stricta* testimonia l'estrema limpidezza delle
      acque. Più a fondo prosperano anemoni di mare, madrepore e spugne, mentre il falso corallo arancione
      *Astroides calycularis* colora le volte sottomarine di tinte vermiglie. Nelle profondità marine brilla
      ancora il corallo rosso.
    visit: >-
      La riserva dispone di due accessi: l'ingresso sud, a un km da Scopello, e l'ingresso nord, da San Vito
      Lo Capo (circa 12 km). Non è consentita la circolazione di veicoli a motore: si lascia l'auto nei
      posteggi all'esterno e si prosegue a piedi.


      Il sentiero costiero unisce i due varchi toccando Punta Capreria, Cala del Varo, Contrada Marinella,
      Torre dell'Uzzo e Tonnarella dell'Uzzo. Se preferisci salire di quota, il sentiero di Passo del Lupo
      sale da quello principale verso Borgo Cusenza, Monte Passo del Lupo, Portella Mandra Nuova e Monte
      Speziale.


      Lungo i percorsi sorgono il Museo Naturalistico, il Museo delle Attività Marinare, il Museo della
      Civiltà Contadina con il ciclo del grano e il Centro di Educazione Ambientale. Alcune antiche case
      coloniche fungono da punti sosta o rifugi.
    history: >-
      La nascita dello Zingaro è una pagina gloriosa di mobilitazione civile: la protesta popolare e il
      sostegno della stampa bloccarono la litoranea già cantierizzata, portando all'istituzione della prima
      riserva naturale siciliana. La riserva ricade nel comune di San Vito Lo Capo e, in minor misura, in
      quello di Castellammare del Golfo.
    before: >-
      Pur non essendo area marina protetta, è severamente vietato introdurre fucili subacquei, canne da pesca
      o qualsiasi attrezzo da cattura. Verifica preventivamente con l'ente gestore l'agibilità dei sentieri e
      le condizioni meteo.
    around: >-
      Per l'impronta carsica e i rapaci, lo Zingaro presenta forti affinità con altri complessi mediterranei:
      il [Parco Naturale della Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) e il [Parco Nazionale
      Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) condividono l'aquila di Bonelli e il
      pellegrino tra le gole rocciose, mentre il [Parco Nazionale delle
      Calanques](/lugar/parc-national-des-calanques/) affianca scogliere a picco e l'aquila di Bonelli.
  pt:
    intro: >-
      Durante anos, o projeto oficial previa rasgar uma estrada litoral ao longo desta costa. As obras
      chegaram mesmo a começar em 1976. O que travou a maquinaria pesada foi uma onda de protesto cívico:
      várias associações ambientalistas uniram esforços de 1974 a 1981 e, em 1980, uma marcha de cerca de três
      mil pessoas ocupou pacificamente a zona. Salvou-se deste modo um dos raros troços do litoral siciliano
      sem asfalto e nasceu, através da lei regional 98/81, a Riserva Naturale Orientata dello Zingaro—a
      primeira reserva da Sicília. Hoje, os seus 1650 hectares no extremo ocidental do golfo de Castellammare,
      na península de San Vito Lo Capo, percorrem-se exclusivamente a pé.
    landscape: >-
      A reserva estende-se por uma faixa de cerca de 7 km de arribas calcárias do Mesozoico alcantiladas sobre
      o mar, recortadas por calas recônditas. Do Monte Speziale, com 913 metros, as vertentes despenham-se
      abruptamente no mar. Há manifestações cársticas notáveis, com planaltos de altitude e dolinas onde o
      meteorismo acumula terra vermelha fértil.


      As enseadas sucedem-se de sul para norte: a partir de Scopello surgem Cala Capreria, Cala del Varo
      (acessível apenas por via marítima), Cala della Disa ou Zingaro, Cala Beretta, Cala Marinella e Cala
      Torre dell'Uzzo. Todas são constituídas por seixos brancos polidos.


      O clima governa todo o ecossistema: uma temperatura média anual de 19 °C e 645 mm de chuva. Mesmo sem
      pluviosidade, nevoeiros marítimos condensam-se nas cristas montanhosas mantendo microclimas húmidos. O
      matagal de palmeira-anã (*Chamaerops humilis*) é a formação predominante, densíssimo em vários troços. É
      uma paisagem seminatural decorrente de uma vivência agro-pastoril secular, onde outrora cada socalco era
      cultivado. Mais acima, nas encostas norte do Monte Passo del Lupo, subsistem bosques relíquia de
      azinheira, e no limite ocidental restam parcelas de sobreiro, formação praticamente extinta na Sicília
      ocidental. No sopé do Monte Acci, depressões húmidas com juncos fornecem água vital à fauna.
    wildlife: >-
      Arribas rochosas, matagais e charnecas formam o habitat ideal para espécies em declínio. O emblema
      faunístico de Zingaro é a [águia-de-bonelli](/especie/aquila_fasciata/), que nidifica regularmente nas
      escarpas; com ela convivem o falcão-peregrino e a perdiz-mourisca da Sicília. Mais de quarenta aves
      residentes completam o elenco: gaivotas-de-patas-amarelas, chapins-azuis, poupas, carriças, trigueirões
      e rouxinóis.


      Entre os mamíferos avistam-se coelhos-bravos, doninhas, ouriços-cacheiros, raposas ao cair da tarde e o
      esquivo [porco-espinho](/especie/hystrix_cristata/), estritamente noturno, detetado pelos espinhos
      bicolores caídos. Nos répteis contam-se a cobra-rateira-verde-e-amarela, a cobra-de-esculápio, a
      coronela e a víbora; a lagartixa-siciliana, endémica insular, observa-se o ano todo. Nos pegos de água
      vive o discoglosso-pintado, anfíbio ausente da península italiana, e oito espécies de morcegos
      abrigam-se em grutas cársticas.


      A flora conta com o *Limonium flagellare*, endémico restrito à faixa litoral entre Zingaro e Balestrate,
      bem como o cravo-das-rochas e a centáurea-da-sicília. Nos prados abrem-se orquídeas bravas como *Ophrys
      simulata*, a endémica *Ophrys oxyrrhynchos*, *Orchis commutata* e a orquídea de Branciforti.


      Sob a água, na zona entremarés, a alga castanha *Cystoseira stricta* espelha a pureza marítima. A maior
      profundidade instalam-se anémonas, corais pétreos e esponjas, enquanto o falso-coral-laranja *Astroides
      calycularis* incendeia as paredes submersas de tons avermelhados. Nos fundos marinhos reluz ainda o
      coral-vermelho.
    visit: >-
      A reserva possui dois pórticos de entrada: a entrada sul, a um km de Scopello, e a entrada norte, a
      partir de San Vito Lo Capo (cerca de 12 km). No interior não há trânsito motorizado: deixa o veículo no
      parque de estacionamento e segue a pé.


      O trilho costeiro liga as duas entradas por Punta Capreria, Cala del Varo, Contrada Marinella, Torre
      dell'Uzzo e Tonnarella dell'Uzzo. Se preferires subir, o trilho do Passo del Lupo eleva-se a partir do
      caminho principal até Borgo Cusenza, Monte Passo del Lupo, Portella Mandra Nuova e Monte Speziale.


      No trajeto existem o Museu Naturalista, o Museu das Atividades Marinhas, o Museu da Civilização
      Camponesa retratando o ciclo do trigo, e o Centro de Educação Ambiental. Várias casas agrícolas de pedra
      funcionam como postos de informação ou abrigos.
    history: >-
      A génese de Zingaro reflete uma vitória histórica de mobilização cívica: a determinação de
      ambientalistas e o apoio da imprensa travaram a litoranea em plena construção, originando a primeira
      reserva natural siciliana. Abrange o concelho de San Vito Lo Capo e, numa parcela menor, o de
      Castellammare del Golfo.
    before: >-
      Embora não constitua reserva marinha formal, é expressamente interdito entrar com armas de caça
      submarina, canas de pesca ou quaisquer apetrechos de captura. Confirma previamente com os serviços
      gestores as condições dos percursos e os setores transitáveis.
    around: >-
      Pela sua natureza cárstica e pelas aves de rapina, Zingaro partilha afinidades com outros relevos
      mediterrânicos: o [Parque Natural da Serra de Montsant](/lugar/parc-natural-de-la-serra-de/) e o [Parque
      Nacional Sierra de las Nieves](/lugar/parque-nacional-sierra-de-las-nieves/) acolhem a águia-de-bonelli
      e o falcão-peregrino em relevos calcários, enquanto o [Parque Nacional das
      Calanques](/lugar/parc-national-des-calanques/) associa escarpas marítimas e a águia-de-bonelli.
