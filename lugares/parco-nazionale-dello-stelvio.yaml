resumen:
  es: >-
    Uno de los parques nacionales alpinos más antiguos e imponentes de Europa (Ortles 3.905 m), glaciares
    gigantescos y rebaños masivos de ciervos y rebecos.
  en: >-
    One of Europe's oldest and most majestic Alpine national parks (Ortles 3,905 m), featuring vast valley
    glaciers and massive herds of red deer and chamois.
  fr: >-
    L'un des plus anciens et imposants parcs nationaux alpins d'Europe (Ortles 3 905 m), glaciers imposants et
    hardes de cerfs et de chamois.
  de: >-
    Einer der ältesten und gewaltigsten alpinen Nationalparks Europas (Ortler 3.905 m), gewaltige Talgletscher
    und große Hirsch- und Gämsenrudel.
  it: >-
    Uno dei parchi nazionali alpini più antichi e maestosi d'Europa (Ortles 3.905 m), con ghiacciai estesi e
    imponenti branchi di cervi e camosci.
  pt: >-
    Um dos parques nacionais alpinos mais antigos e imponentes da Europa (Ortles 3.905 m), imensos glaciares
    de vale e grandes manadas de veados e camurças.
unico:
  es: >-
    Es un parque de dimensiones alpinas, con una cumbre de 3.905 metros, glaciares de valle y un paso por
    carretera y quebrantahuesos de vuelta en el cielo.
  en: >-
    A park of towering Alpine proportions, with a summit of 3,905 metres, valley glaciers, a famous road pass,
    and bearded vultures back in the sky.
  fr: >-
    Un parc aux dimensions alpines, avec un sommet à 3 905 mètres, des glaciers de vallée, un col routier
    célèbre et le retour du gypaète barbu.
  de: >-
    Ein Park von hochalpinen Ausmaßen, mit einem Gipfel von 3.905 Metern, Talgletschern, einer Passstraße und
    dem Bartgeier zurück am Himmel.
  it: >-
    Un parco di proporzioni alpine, con una vetta di 3.905 metri, ghiacciai vallivi, un valico stradale
    storico e il gipeto di nuovo in volo.
  pt: >-
    Um parque de escala alpina, com um cume de 3.905 metros, glaciares de vale, um mítico desfiladeiro
    rodoviário e o regresso do abutre-barbudo aos céus.
observaciones:
  es: >-
    La SS 38 se cierra en invierno. En el parque solo se puede pernoctar en tienda en los campings equipados;
    no se puede volar sobre las áreas protegidas con ningún medio. No alimentes a los animales: la comida
    humana los acerca a los lugares habitados. El oso y el lobo suelen ser esquivos y los ataques son
    rarísimos, pero hay normas si te los encuentras.
texto:
  es:
    intro: >-
      Hay una carretera que sube a 2.758 metros y desde ella se ve casi todo lo que el Parque Nacional del
      Stelvio guarda: glaciares, morrenas, pedregales y, más abajo, bosques oscuros de coníferas. El paso del
      Stelvio es el segundo puerto transitable más alto de Europa, y de él parte la cresta principal de un
      parque que reúne casi todas las cumbres del grupo del Ortles, entre Lombardía, Trentino y Alto Adigio.
      Todo el parque se mide en desniveles: de 650 metros en el valle a 3.900 en las cimas.
    landscape: >-
      El parque se creó en 1935 para proteger el grupo Ortles-Cevedale y se amplió en 1977. La cumbre es el
      Ortles, con 3.905 metros; el Gran Zebrù mide 3.857 y el Cevedale 3.769. En el lado lombardo está el
      Ghiacciaio dei Forni, el glaciar de valle más extenso de los Alpes italianos. Los glaciares de las altas
      cadenas han moldeado el paisaje de alta montaña y también los valles fértiles de toda la región.


      Las rocas cuentan otra historia. El macizo pertenece a los Alpes centrales, pero tiene dos familias de
      rocas: las de los Alpes calcáreos centrales y las de los meridionales. En la Val Zebrù, una falla
      tajante, la Faglia di Zebrù, separa al sur las rocas metamórficas cristalinas de las calizas
      sedimentarias del norte, típicas de las áreas prealpinas. Y el bosque lo delata: allí donde el abetal de
      abeto rojo cede el paso al matorral de pino mugo, pasa la falla.


      La vegetación va por pisos. Entre los 1000 y los 2000 metros dominan los bosques de coníferas; el límite
      del arbolado está hacia los 2600 metros, donde empiezan los arbustos enanos, y desde los 2800 solo hay
      rocas. En las turberas viven plantas carnívoras como Drosera rotundifolia y Pinguicula alpina.
    wildlife: >-
      En altura la vida se adapta. El ranúnculo de los glaciares florece al deshielo y a veces aparece incluso
      a 4.275 metros, un récord entre las flores alpinas. La [marmota](/especie/marmota_marmota/) prepara a
      fines de verano su reserva de heno y hiberna casi seis meses. El [íbice](/especie/capra_ibex/) es uno de
      los mejores escaladores de los Alpes y salta varios metros.


      Entre los mamíferos hay ciervos, rebecos, corzos, íbices, marmotas, zorros, armiños, ardillas, liebres,
      tejones y comadrejas. Entre las aves que anidan están la perdiz nival, la perdiz griega, la chova
      piquigualda, el urogallo, el gallo lira y el águila real, además del
      [quebrantahuesos](/especie/gypaetus_barbatus/), reintroducido con éxito. La Val Zebrù es una de las
      zonas más frecuentadas por el quebrantahuesos, y en ella es facilísimo ver ungulados, sobre todo ciervos
      e íbices.
    visit: >-
      En el Stelvio el plato fuerte son dos recorridos naturalistas que arrancan junto al paso, por la SS 38.
      El Sentiero della Criosfera, sobre permafrost, glaciarismo y karst, dura una hora, mide 2 km y tiene 250
      metros de desnivel. El Sentiero del Cambiamento Climatico puede empezar en la curva 8 de la carretera, a
      2700 m, o hacerse en sentido contrario desde el fondo del Valle del Braulio.


      La Val Zebrù, accesible desde Bormio por la SP 29 del Gavia hasta San Nicoò y por la carretera a Madonna
      dei Monti y Niblogo, donde hay aparcamiento, es el otro gran destino. Tres recorridos: la ruta de los
      grandes rapaces, de Fantelle a Zebrù di Fuori por Alpe Solaz, 4,3 km, dos horas y 345 metros de
      desnivel; la subida de Baita del Pastore a los Passi Zebrù y el refugio Pizzini, tres horas y veinte,
      con 839 metros; y el enlace del Rifugio V° Alpini a los Passi Zebrù, 4,5 km en dos horas y cuarenta
      minutos.


      Si quieres conocer las plantas antes de subir, el Jardín Botánico Alpino Rezia, en Bormio, nació en 1982
      para dar a conocer la flora del parque. El sector lombardo programa además actividades todo el año:
      excursiones guiadas, talleres, eventos y propuestas del jardín.
    history: >-
      Las cabañas de madera de la Val Zebrù atestiguan su explotación en tiempos antiguos. La carretera del
      Stelvio se construyó a partir de 1820. El parque lo gestiona un consorcio del Ministerio de Medio
      Ambiente, las provincias de Bolzano y Trento y la región de Lombardía.
    before: >-
      La SS 38 se cierra en invierno. En el parque solo se puede pernoctar en tienda en los campings
      equipados; no se puede volar sobre las áreas protegidas con ningún medio. No alimentes a los animales:
      la comida humana los acerca a los lugares habitados. El oso y el lobo suelen ser esquivos y los ataques
      son rarísimos, pero hay normas si te los encuentras.
    around: >-
      El parque limita al norte con el Parque Nacional Suizo, el [Parc Naissunal
      Svizzer](/lugar/parc-naissunal-svizzer---hinterland/), y pegada a él queda la [Biosfera Val
      Müstair](/lugar/biosfera-val-mustair/); a pocos kilómetros está el [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/). Con glaciares, íbices y quebrantahuesos, se
      parece al [Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), a la
      [Vanoise](/lugar/parc-national-de-la-vanoise/), a las [Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) y al
      [Ankogelgruppe](/lugar/ankogelgruppe---hohe-tauern/).
  en:
    intro: >-
      A road climbs to 2,758 metres, offering sweeping vistas of almost everything preserved in Stelvio
      National Park: glaciers, moraines, screes, and, further down, dark coniferous forests. The Stelvio Pass
      is the second highest paved mountain pass in Europe, and from it extends the main ridge of a park
      embracing nearly every summit of the Ortles group, across Lombardy, Trentino, and South Tyrol. The whole
      park is measured in vertical drop: from 650 metres in the valley floor to 3,900 on the peaks.
    landscape: >-
      The park was created in 1935 to safeguard the Ortles-Cevedale group and expanded in 1977. The
      culminating point is the Ortles at 3,905 metres; the Gran Zebrù reaches 3,857 and the Cevedale 3,769. On
      the Lombard slope lies the Ghiacciaio dei Forni, the largest valley glacier in the Italian Alps. The
      glaciers of these high chains have carved both the high-mountain landscape and the fertile valleys of
      the whole region.


      The rocks recount another chapter. The massif belongs to the Central Alps, but features two distinct
      rock families: those of the central limestone Alps and those of the southern ones. In Val Zebrù, a sharp
      fault, the Faglia di Zebrù, separates crystalline metamorphic rocks in the south from sedimentary
      limestones in the north, characteristic of the Prealps. The forest clearly signals the shift: right
      where Norway spruce stands give way to dwarf mountain pine scrub, the fault line runs.


      Vegetation changes with altitude. Between 1000 and 2000 metres coniferous forests dominate; the tree
      line lies around 2600 metres, where dwarf shrubs begin, and above 2800 only bare rock remains. In the
      peat bogs live carnivorous plants such as Drosera rotundifolia and Pinguicula alpina.
    wildlife: >-
      High up, life adapts. The glacier buttercup blooms during the snowmelt and occasionally appears even at
      4,275 metres, a record among Alpine flora. The [Alpine marmot](/especie/marmota_marmota/) stores hay in
      late summer and hibernates for nearly six months. The [Alpine ibex](/especie/capra_ibex/) is one of the
      Alps' finest climbers, leaping several metres across crags.


      Mammals include red deer, chamois, roe deer, ibex, marmots, foxes, stoats, squirrels, hares, badgers,
      and weasels. Nesting birds include the rock ptarmigan, rock partridge, yellow-billed chough,
      capercaillie, black grouse, and golden eagle, alongside the successfully reintroduced [bearded
      vulture](/especie/gypaetus_barbatus/). Val Zebrù is one of the bearded vulture's most frequented haunts,
      where spotting ungulates, especially red deer and ibex, is remarkably easy.
    visit: >-
      The highlight in Stelvio is two nature trails starting right by the pass along the SS 38. The Sentiero
      della Criosfera, focused on permafrost, glacial features, and karst, takes one hour, covers 2 km, and
      gains 250 metres of elevation. The Sentiero del Cambiamento Climatico can be started at bend 8 of the
      road at 2700 m, or done in reverse from the valley bottom of Valle del Braulio.


      Val Zebrù, reached from Bormio via the SP 29 towards Gavia up to San Nicolò and along the road to
      Madonna dei Monti and Niblogo where parking is available, is the other major destination. Three routes:
      the raptor trail, from Fantelle to Zebrù di Fuori via Alpe Solaz, covering 4.3 km in two hours with 345
      metres of ascent; the climb from Baita del Pastore to Passi Zebrù and Rifugio Pizzini, taking three
      hours and twenty minutes with 839 metres; and the connection from Rifugio V° Alpini to Passi Zebrù, 4.5
      km in two hours and forty minutes.


      If you want to discover the plant species before ascending, the Rezia Alpine Botanical Garden in Bormio
      was founded in 1982 to showcase the park's flora. The Lombard sector also organizes year-round
      activities: guided walks, workshops, events, and botanical garden visits.
    history: >-
      The rustic wooden huts of Val Zebrù testify to ancient agricultural use. The Stelvio road was built
      starting in 1820. The park is managed by a consortium comprising the Ministry of the Environment, the
      autonomous provinces of Bolzano and Trento, and the Lombardy Region.
    before: >-
      The SS 38 closes in winter. Camping in the park is only allowed in tents at designated campsites; flying
      over protected areas with any aircraft or drone is prohibited. Never feed wild animals: human food draws
      them closer to villages. Brown bears and wolves are naturally elusive and encounters are extremely rare,
      but specific safety rules apply if you come across one.
    around: >-
      The park borders the Swiss National Park, [Parc Naissunal
      Svizzer](/lugar/parc-naissunal-svizzer---hinterland/), to the north, adjoining [Biosfera Val
      Müstair](/lugar/biosfera-val-mustair/); just a few kilometres away lies [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/). With glaciers, ibex, and bearded vultures, it
      resembles [Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/),
      [Vanoise](/lugar/parc-national-de-la-vanoise/), [Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/), and
      [Ankogelgruppe](/lugar/ankogelgruppe---hohe-tauern/).
  fr:
    intro: >-
      Une route monte à 2 758 mètres d'altitude, dévoilant presque tout ce que le parc national du Stelvio
      recèle : glaciers, moraines, pierriers et, plus bas, profondes forêts de conifères. Le col du Stelvio
      est le deuxième col carrossable le plus haut d'Europe ; de là s'élance l'arête principale d'un parc qui
      regroupe la quasi-totalité des cimes du groupe de l'Ortles, entre Lombardie, Trentin et Haut-Adige. Tout
      le parc se mesure en dénivelés : de 650 mètres au fond de vallée à 3 900 mètres sur les cimes.
    landscape: >-
      Le parc a été créé en 1935 pour protéger le massif Ortles-Cevedale et agrandi en 1977. Le point
      culminant est l'Ortles, avec 3 905 mètres ; le Gran Zebrù s'élève à 3 857 m et le Cevedale à 3 769 m.
      Côté lombard s'étend le Ghiacciaio dei Forni, le plus vaste glacier de vallée des Alpes italiennes. Les
      glaciers des hautes chaînes ont sculpté les reliefs de haute montagne ainsi que les vallées fertiles de
      toute la région.


      Les roches racontent une autre histoire. Le massif appartient aux Alpes centrales mais présente deux
      familles géologiques : celle des Alpes calcaires centrales et celle des Alpes calcaires méridionales.
      Dans le Val Zebrù, une faille tranchante, la Faglia di Zebrù, sépare au sud les roches métamorphiques
      cristallines des calcaires sédimentaires du nord, caractéristiques des préalpes. La forêt le révèle
      clairement : là où la pessière d'épicéa cède la place aux pins mugos, court la faille.


      La végétation s'étage en paliers. Entre 1000 et 2000 mètres dominent les forêts de conifères ; la limite
      des arbres se situe vers 2600 mètres, où commencent les buissons nains, et au-dessus de 2800 mètres ne
      subsiste que la roche nue. Dans les tourbières prospèrent des plantes carnivores telles que Drosera
      rotundifolia et Pinguicula alpina.
    wildlife: >-
      En altitude, la vie s'adapte. La renoncule des glaciers fleurit à la fonte des neiges et s'observe
      parfois jusqu'à 4 275 mètres, un record parmi les fleurs alpines. La [marmotte des
      Alpes](/especie/marmota_marmota/) prépare sa réserve de foin à la fin de l'été et hiberne près de six
      mois. Le [bouquetin des Alpes](/especie/capra_ibex/) compte parmi les meilleurs grimpeurs des Alpes et
      franchit plusieurs mètres d'un bond.


      Parmi les mammifères figurent cerfs, chamois, chevreuils, bouquetins, marmottes, renards, hermines,
      écureuils, lièvres, blaireaux et belettes. Chez les oiseaux nicheurs se trouvent le lagopède alpin, la
      perdrix bartavelle, le chocard à bec jaune, le grand tétras, le tétras lyre et l'aigle royal, sans
      oublier le [gypaète barbu](/especie/gypaetus_barbatus/), réintroduit avec succès. Le Val Zebrù compte
      parmi les secteurs les plus courus par le gypaète, où il est aisé d'observer les ongulés, surtout cerfs
      et bouquetins.
    visit: >-
      Au Stelvio, les temps forts sont deux circuits naturalistes débutant près du col, le long de la SS 38.
      Le Sentiero della Criosfera, dédié au pergélisol, au glaciérisme et au karst, dure une heure, fait 2 km
      et compte 250 mètres de dénivelé. Le Sentiero del Cambiamento Climatico peut commencer au lacet 8 de la
      route, à 2700 m, ou s'effectuer en sens inverse depuis le fond de la Valle del Braulio.


      Le Val Zebrù, accessible depuis Bormio par la SP 29 du Gavia jusqu'à San Nicolò puis par la route vers
      Madonna dei Monti et Niblogo où se trouve un parking, forme l'autre grand pôle. Trois parcours : le
      sentier des grands rapaces, de Fantelle à Zebrù di Fuori par Alpe Solaz, 4,3 km, deux heures et 345
      mètres de dénivelé ; la montée de Baita del Pastore aux Passi Zebrù et au refuge Pizzini, trois heures
      et vingt minutes, avec 839 mètres ; et la liaison du Rifugio V° Alpini aux Passi Zebrù, 4,5 km en deux
      heures et quarante minutes.


      Si vous souhaitez découvrir la flore avant de monter, le Jardin botanique alpin Rezia, à Bormio, a été
      fondé en 1982 pour présenter la végétation locale. Le secteur lombard propose en outre des activités
      toute l'année : randonnées guidées, ateliers, événements et visites du jardin.
    history: >-
      Les chalets de bois du Val Zebrù témoignent d'une exploitation pastorale séculaire. La route du Stelvio
      a été construite à partir de 1820. Le parc est administré par un consortium associant le ministère de
      l'Environnement, les provinces de Bolzano et de Trente et la région Lombardie.
    before: >-
      La SS 38 est fermée en hiver. Dans le parc, le bivouac sous tente n'est autorisé que dans les campings
      aménagés ; il est interdit de survoler les zones protégées avec quelque aéronef que ce soit. Ne
      nourrissez pas les animaux sauvages : la nourriture humaine les attire près des habitations. L'ours et
      le loup restent très discrets et les rencontres rarissimes, mais des règles précises s'appliquent si
      vous en croisez.
    around: >-
      Le parc jouxte au nord le parc national suisse, [Parc Naissunal
      Svizzer](/lugar/parc-naissunal-svizzer---hinterland/), ainsi que la [Biosfera Val
      Müstair](/lugar/biosfera-val-mustair/) ; à quelques kilomètres s'étend le [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/). Par ses glaciers, ses bouquetins et ses
      gypaètes, il évoque le [Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), la
      [Vanoise](/lugar/parc-national-de-la-vanoise/), les [Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) et
      l'[Ankogelgruppe](/lugar/ankogelgruppe---hohe-tauern/).
  de:
    intro: >-
      Eine Straße führt hinauf auf 2.758 Meter Höhe, von wo aus fast alles sichtbar wird, was der Nationalpark
      Stilfserjoch birgt: Gletscher, Moränen, Schuttkare und weiter unten dunkle Nadelwälder. Das Stilfser
      Joch ist der zweithöchste befahrbare Gebirgspass Europas, und an ihm beginnt der Hauptkamm eines Parks,
      der nahezu sämtliche Gipfel der Ortlergruppe zwischen der Lombardei, dem Trentino und Südtirol umfasst.
      Der gesamte Park misst sich in Höhenunterschieden: von 650 Metern im Tal bis 3.900 auf den Gipfeln.
    landscape: >-
      Der Park wurde 1935 gegründet, um die Ortler-Cevedale-Gruppe zu schützen, und 1977 erweitert. Der
      höchste Punkt ist der Ortler mit 3.905 Metern; der Monte Zebrù misst 3.857 und der Cevedale 3.769 Meter.
      Auf der lombardischen Seite liegt der Ghiacciaio dei Forni, der größte Talgletscher der italienischen
      Alpen. Die Gletscher der Hochkämme haben sowohl die Hochgebirgslandschaft als auch die fruchtbaren Täler
      der gesamten Region geformt.


      Das Gestein erzählt eine eigene Geschichte. Das Massiv gehört zu den Zentralalpen, umfasst jedoch zwei
      Gesteinsfamilien: die der zentralen und die der südlichen Kalkalpen. Im Val Zebrù trennt eine markante
      Verwerfung, die Faglia di Zebrù, kristalline Metamorphite im Süden von nördlichen Sedimentkalken, wie
      sie für die Voralpen typisch sind. Der Wald verrät den Übergang: Dort, wo der Fichtenwald in
      Latschenkieferngebüsch übergeht, verläuft die Bruchlinie.


      Die Vegetation gliedert sich in Höhenstufen. Zwischen 1000 und 2000 Metern herrschen Nadelwälder vor;
      die Baumgrenze liegt um 2600 Meter, wo Zwergstrauchheiden beginnen, und ab 2800 Metern gibt es nur noch
      Fels. In den Mooren wachsen fleischfressende Pflanzen wie Drosera rotundifolia und Pinguicula alpina.
    wildlife: >-
      In der Höhe passt sich das Leben an. Der Gletscherhahnenfuß blüht zur Schneeschmelze und gedeiht
      mitunter noch in 4.275 Metern Höhe, ein Rekord in der Alpenflora. Das
      [Alpenmurmeltier](/especie/marmota_marmota/) legt im Spätsommer Heuvorräte an und hält fast sechs Monate
      Winterschlaf. Der [Alpensteinbock](/especie/capra_ibex/) zählt zu den geschicktesten Kletterern der
      Alpen und springt mühelos mehrere Meter weit.


      Unter den Säugetieren leben hier Rothirsche, Gämsen, Rehe, Steinböcke, Murmeltiere, Füchse, Hermeline,
      Eichhörnchen, Hasen, Dachse und Wiesel. Zu den Brutvögeln gehören Schneehuhn, Steinhuhn, Alpendohle,
      Auerhuhn, Birkhuhn und Steinadler, ergänzt durch den erfolgreich wiederangesiedelten
      [Bartgeier](/especie/gypaetus_barbatus/). Das Val Zebrù gehört zu den bevorzugten Revieren des
      Bartgeiers; Huftiere, insbesondere Hirsche und Steinböcke, lassen sich dort sehr verlässlich beobachten.
    visit: >-
      Die Höhepunkte am Stilfser Joch bilden zwei naturkundliche Lehrpfade, die direkt am Pass an der SS 38
      beginnen. Der Sentiero della Criosfera, der Permafrost, Glazialmorphologie und Karst erläutert, dauert
      eine Stunde, ist 2 km lang und überwindet 250 Höhenmeter. Der Sentiero del Cambiamento Climatico kann an
      Kehre 8 der Straße auf 2700 m Höhe begonnen oder in umgekehrter Richtung aus dem Talboden des Valle del
      Braulio begangen werden.


      Das Val Zebrù, erreichbar von Bormio über die SP 29 Richtung Gavia bis San Nicolò und die Straße nach
      Madonna dei Monti und Niblogo mit Parkplatz, ist das zweite große Ziel. Drei Routen bieten sich an: die
      Greifvogelroute von Fantelle nach Zebrù di Fuori über Alpe Solaz, 4,3 km, zwei Stunden und 345
      Höhenmeter; der Anstieg von Baita del Pastore zu den Passi Zebrù und zur Pizzini-Hütte, drei Stunden und
      zwanzig Minuten mit 839 Höhenmetern; sowie die Verbindung von der Rifugio V° Alpini zu den Passi Zebrù,
      4,5 km in zwei Stunden und vierzig Minuten.


      Wenn du die Pflanzenwelt vor dem Aufstieg kennenlernen möchtest, lohnt der 1982 gegründete Botanische
      Alpengarten Rezia in Bormio. Der lombardische Sektor bietet zudem ganzjährig geführte Touren, Workshops
      und Veranstaltungen an.
    history: >-
      Die traditionellen Holzhütten des Val Zebrù bezeugen die uralte Bewirtschaftung. Die Straße über das
      Stilfser Joch entstand ab 1820. Verwaltet wird der Park von einem Konsortium aus dem Umweltministerium,
      den Provinzen Bozen und Trient sowie der Region Lombardei.
    before: >-
      Die SS 38 ist im Winter gesperrt. Im Park darf nur auf ausgewiesenen Campingplätzen im Zelt übernachtet
      werden; das Überfliegen der Schutzgebiete mit Fluggeräten jeglicher Art ist untersagt. Füttere niemals
      Wildtiere: Menschliche Nahrung zieht sie in Siedlungsnähe. Bär und Wolf sind scheu und Begegnungen
      extrem selten, doch gelten klare Verhaltensregeln im Falle eines Kontakts.
    around: >-
      Der Park grenzt im Norden an den Schweizerischen Nationalpark, [Parc Naissunal
      Svizzer](/lugar/parc-naissunal-svizzer---hinterland/), und die unmittelbar benachbarte [Biosfera Val
      Müstair](/lugar/biosfera-val-mustair/); wenige Kilometer südlich liegt der [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/). In Gletschern, Steinböcken und Bartgeiern
      ähnelt er dem [Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), der
      [Vanoise](/lugar/parc-national-de-la-vanoise/), den [Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) und der
      [Ankogelgruppe](/lugar/ankogelgruppe---hohe-tauern/).
  it:
    intro: >-
      Una strada sale a 2.758 metri di quota e da lassù si ammira quasi tutto ciò che il Parco Nazionale dello
      Stelvio custodisce: ghiacciai, morene, pietraie e, più in basso, fitte foreste di conifere. Il passo
      dello Stelvio è il secondo valico automobilistico più alto d'Europa; da qui si snoda la cresta
      principale di un parco che racchiude quasi tutte le cime del gruppo dell'Ortles, tra Lombardia, Trentino
      e Alto Adige. L'intero territorio si misura nei dislivelli: dai 650 metri del fondovalle ai 3.900 delle
      vette.
    landscape: >-
      Il parco fu istituito nel 1935 per tutelare il gruppo Ortles-Cevedale e ampliato nel 1977. Il punto
      culminante è l'Ortles con 3.905 metri; il Gran Zebrù misura 3.857 m e il Cevedale 3.769 m. Sul versante
      lombardo si estende il Ghiacciaio dei Forni, il maggiore ghiacciaio vallivo delle Alpi italiane. I
      ghiacciai delle alte creste hanno modellato sia i paesaggi d'alta quota sia le fertili vallate
      dell'intera regione.


      Le rocce raccontano una storia differente. Il massiccio appartiene alle Alpi centrali ma racchiude due
      distinte formazioni: quella delle Alpi calcaree centrali e quella delle meridionali. In Val Zebrù una
      faglia netta, la Faglia di Zebrù, divide a sud le rocce metamorfiche cristalline dai calcari sedimentari
      a nord, tipici delle aree prealpine. La vegetazione lo rivela chiaramente: dove la pecceta di abete
      rosso cede il passo al pino mugo, passa la linea di faglia.


      La flora segue fasce altimetriche. Tra i 1000 e i 2000 metri dominano i boschi di conifere; il limite
      del bosco si trova intorno ai 2600 metri, dove iniziano gli arbusti nani, e oltre i 2800 metri resta
      solo la roccia. Nelle torbiere vivono piante carnivore come Drosera rotundifolia e Pinguicula alpina.
    wildlife: >-
      In quota la vita si adatta a condizioni estreme. Il ranuncolo dei ghiacciai fiorisce al disgelo e si
      spinge talvolta fino a 4.275 metri, un primato tra i fiori alpini. La
      [marmotta](/especie/marmota_marmota/) raccoglie fieno a fine estate e va in letargo per quasi sei mesi.
      Lo [stambecco](/especie/capra_ibex/) è tra i più abili scalatori delle Alpi e compie balzi di parecchi
      metri sulle pareti.


      Tra i mammiferi popolano il parco cervi, camosci, caprioli, stambecchi, marmotte, volpi, ermellini,
      scoiattoli, lepri, tassi e donnole. Tra gli uccelli nidificanti figurano pernice bianca, coturnice,
      gracchio corallino, gallo cedrone, fagiano di monte e aquila reale, insieme al
      [gipeto](/especie/gypaetus_barbatus/), reintrodotto con successo. La Val Zebrù è tra le zone più
      frequentate dal gipeto, dove è facilissimo osservare ungulati, in particolare cervi e stambecchi.
    visit: >-
      Allo Stelvio i percorsi imperdibili sono due sentieri naturalistici che partono nei pressi del valico,
      lungo la SS 38. Il Sentiero della Criosfera, incentrato su permafrost, glaciologia e carsismo, richiede
      un'ora, misura 2 km e supera 250 metri di dislivello. Il Sentiero del Cambiamento Climatico può iniziare
      al tornante 8 della strada, a 2700 m, oppure essere percorso in senso inverso dal fondovalle della Valle
      del Braulio.


      La Val Zebrù, raggiungibile da Bormio seguendo la SP 29 del Gavia fino a San Nicolò e proseguendo per
      Madonna dei Monti e Niblogo con parcheggio, costituisce l'altra meta fondamentale. Tre itinerari: la via
      dei grandi rapaci, da Fantelle a Zebrù di Fuori per Alpe Solaz, 4,3 km, due ore e 345 metri di salita;
      la salita da Baita del Pastore ai Passi Zebrù e al rifugio Pizzini, tre ore e venti minuti per 839
      metri; e il raccordo tra Rifugio V° Alpini e i Passi Zebrù, 4,5 km in due ore e quaranta minuti.


      Se desideri conoscere la vegetazione prima di salire, il Giardino Botanico Alpino Rezia a Bormio è nato
      nel 1982 per valorizzare la flora protetta. Il settore lombardo cura inoltre un programma annuale di
      visite guidate, laboratori, manifestazioni ed eventi divulgativi.
    history: >-
      Le baite in legno della Val Zebrù testimoniano una frequentazione umana antichissima. La strada dello
      Stelvio fu tracciata a partire dal 1820. Il parco è affidato a un consorzio formato dal Ministero
      dell'Ambiente, dalle province autonome di Bolzano e Trento e dalla Regione Lombardia.
    before: >-
      La SS 38 è chiusa al traffico in inverno. Nel parco il pernottamento in tenda è consentito unicamente
      nei campeggi attrezzati; è vietato sorvolare le aree protette con qualsiasi velivolo o drone. Non dare
      cibo agli animali: gli scarti umani li spingono vicino ai centri abitati. Orso e lupo sono schivi e gli
      incontri eccezionali, ma vigono norme precise di comportamento se dovessi incrociarne uno.
    around: >-
      Il parco confina a nord con il Parco Nazionale Svizzero, il [Parc Naissunal
      Svizzer](/lugar/parc-naissunal-svizzer---hinterland/), e con la contigua [Biosfera Val
      Müstair](/lugar/biosfera-val-mustair/); a poca distanza si trova il [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/). Per ghiacciai, stambecchi e gipeti presenta
      forti affinità con il [Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), la
      [Vanoise](/lugar/parc-national-de-la-vanoise/), le [Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) e
      l'[Ankogelgruppe](/lugar/ankogelgruppe---hohe-tauern/).
  pt:
    intro: >-
      Há uma estrada que sobe até aos 2.758 metros de altitude, descortinando quase tudo o que o Parque
      Nacional do Stelvio abriga: glaciares, moreias, cascalheiras e, mais abaixo, densas florestas de
      coníferas. O passo do Stelvio é o segundo desfiladeiro pavimentado mais alto da Europa; nele assenta a
      crista principal de um parque que reúne quase todas as cimeiras do maciço do Ortles, entre a Lombardia,
      o Trentino e o Alto Ádige. Todo o parque se mede em desníveis: de 650 metros no vale a 3.900 nos cumes.
    landscape: >-
      O parque foi criado em 1935 para proteger o maciço Ortles-Cevedale e ampliado em 1977. O cume culminante
      é o Ortles, com 3.905 metros; o Gran Zebrù atinge 3.857 m e o Cevedale 3.769 m. No lado lombardo
      estende-se o Ghiacciaio dei Forni, o maior glaciar de vale dos Alpes italianos. Os glaciares das altas
      cristas moldaram quer o relevo alpino quer os vales férteis de toda a região.


      As rochas contam outra história. O maciço pertence aos Alpes centrais, mas integra duas famílias
      rochosas: a dos Alpes calcários centrais e a dos meridionais. No Val Zebrù, uma falha abrupta, a Faglia
      di Zebrù, separa a sul as rochas metamórficas cristalinas dos calcários sedimentares a norte, típicos
      das zonas pré-alpinas. A floresta denuncia a divisão: no ponto exato onde o abetal de espruce cede lugar
      aos pinheiros-anões, corre a falha.


      A vegetação distribui-se por andares. Entre os 1000 e os 2000 metros dominam as florestas de coníferas;
      o limite da vegetação arbórea situa-se perto dos 2600 metros, dando lugar aos matos anões, e acima dos
      2800 metros resta apenas rocha nua. Nas turfeiras sobrevivem plantas carnívoras como a Drosera
      rotundifolia e a Pinguicula alpina.
    wildlife: >-
      Em altitude a vida adapta-se. O ranúnculo-dos-glaciares floresce durante o degelo e surge por vezes até
      aos 4.275 metros, um recorde entre as flores alpinas. A [marmota](/especie/marmota_marmota/) junta
      reservas de feno no final do verão e hiberna quase seis meses. O [íbex](/especie/capra_ibex/) é um dos
      melhores trepadores dos Alpes, saltando vários metros pelas escarpas.


      Entre os mamíferos encontram-se veados, camurças, corços, íbexes, marmotas, raposas, arminhos, esquilos,
      lebres, texugos e doninhas. Entre as aves nidificantes contam-se a perdiz-branca, a perdiz-da-rocha, a
      gralha-de-bico-amarelo, o tetraz-grande, o tetraz-lírio e a águia-real, além do
      [abutre-barbudo](/especie/gypaetus_barbatus/), reintroduzido com sucesso. O Val Zebrù é um dos setores
      mais procurados pelo abutre-barbudo, onde é facílimo avistar ungulados, em especial veados e íbexes.
    visit: >-
      No Stelvio o ponto alto são dois trilhos naturalistas que começam junto ao desfiladeiro, ao longo da SS
      38. O Sentiero della Criosfera, sobre permafrost, glaciologia e relevo cárstico, dura uma hora, tem 2 km
      e vence 250 metros de desnível. O Sentiero del Cambiamento Climatico pode começar na curva 8 da estrada,
      a 2700 m de altitude, ou ser feito em sentido inverso desde o fundo do Valle del Braulio.


      O Val Zebrù, acessível a partir de Bormio pela SP 29 do Gavia até San Nicolò e pela estrada para Madonna
      dei Monti e Niblogo com estacionamento, é o outro grande destino. Três percursos: a rota das grandes
      rapinas, de Fantelle a Zebrù di Fuori pela Alpe Solaz, 4,3 km, duas horas e 345 metros de subida; a
      subida de Baita del Pastore aos Passi Zebrù e ao refúgio Pizzini, três horas e vinte minutos com 839
      metros; e a ligação do Rifugio V° Alpini aos Passi Zebrù, 4,5 km em duas horas e quarenta minutos.


      Se quiseres conhecer a vegetação antes de subir, o Jardim Botânico Alpino Rezia, em Bormio, foi fundado
      em 1982 para divulgar a flora do parque. O setor lombardo dinamiza ainda um programa anual com
      caminhadas guiadas, oficinas temáticas e atividades no jardim.
    history: >-
      As cabanas de madeira do Val Zebrù atestam a exploração secular do vale. A estrada do Stelvio começou a
      ser construída a partir de 1820. O parque é gerido por um consórcio entre o Ministério do Ambiente, as
      províncias autónomas de Bolzano e Trento e a Região da Lombardia.
    before: >-
      A SS 38 encerra no inverno. No parque só é permitido pernoitar em tenda nos parques de campismo
      equipados; é proibido sobrevoar as áreas protegidas com qualquer aeronave ou drone. Não alimentes os
      animais selvagens: os restos humanos atraem-nos para as povoações. O urso e o lobo são esquivos e os
      encontros raríssimos, mas existem normas estritas se te cruzares com algum.
    around: >-
      O parque faz fronteira a norte com o Parque Nacional Suíço, [Parc Naissunal
      Svizzer](/lugar/parc-naissunal-svizzer---hinterland/), e com a contígua [Biosfera Val
      Müstair](/lugar/biosfera-val-mustair/); a poucos quilómetros fica o [Parque Natural
      Adamello-Brenta](/lugar/parco-naturale-adamello-brenta/). Pelos seus glaciares, íbexes e
      abutres-barbudos, aproxima-se do [Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/), da
      [Vanoise](/lugar/parc-national-de-la-vanoise/), das [Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) e do
      [Ankogelgruppe](/lugar/ankogelgruppe---hohe-tauern/).
