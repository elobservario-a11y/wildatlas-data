resumen:
  es: >-
    Vasto paisaje ártico-alpino de bloques erráticos, pinedas viejas de pino silvestre y una densa red de
    lagos de canoa.
  en: >-
    A vast Arctic-alpine wilderness of boulder fields, ancient Scots pine forest, and an intricate labyrinth
    of canoeing lakes.
  fr: >-
    Vaste contrée arctico-alpine de blocs erratiques, de vieilles pinèdes sylvestres et d'un réseau dense de
    lacs pour canoë.
  de: >-
    Weite arktisch-alpine Wildnis aus Blockmeeren, uralten Waldkiefernwäldern und einem verzweigten Netz von
    Kanuseen.
  it: >-
    Vasta landa artico-alpina di massi erratici, pineti vetusti di pino silvestre e una fitta rete di laghi
    navigabili in canoa.
  pt: >-
    Vasta paisagem árctico-alpina de blocos erráticos, pinhais vetustos de pinheiro-silvestre e um intrincado
    labirinto de lagos para canoagem.
unico:
  es: >-
    En Femundsmarka todos los árboles están protegidos, también los pinos viejos ya secos, y por eso el bosque
    muerto es parte de la vida.
  en: >-
    In Femundsmarka every tree is protected, including standing deadwood pines, ensuring that dead timber
    remains an integral pulse of life.
  fr: >-
    À Femundsmarka, chaque arbre est protégé, y compris les vieux pins morts sur pied, intégrant le bois mort
    au cycle de la vie.
  de: >-
    In Femundsmarka steht jeder Baum unter Schutz, auch die stehenden dürren Kiefern, sodass Totholz
    lebendiger Teil des Ökosystems bleibt.
  it: >-
    A Femundsmarka ogni albero è rigorosamente protetto, compresi i vecchi pini secchi ancora in piedi,
    rendendo il legno morto parte viva della foresta.
  pt: >-
    Em Femundsmarka todas as árvores estão protegidas, inclusive os pinheiros secos caídos ou de pé,
    integrando a madeira morta no pulsar da vida.
observaciones:
  es: >-
    Del 15 de abril al 15 de septiembre está prohibido hacer fuego, salvo donde no haya riesgos evidentes de
    incendio forestal; usa solo ramitas pequeñas, mejor las del suelo, porque todos los árboles están
    protegidos. Los perros deben ir atados del 1 de abril al 20 de agosto. Revisa los avisos del parque antes
    de ir, porque hay zonas y periodos sensibles.
texto:
  es:
    intro: >-
      Diez mil años después de que se retirara el hielo, Femundsmarka sigue pareciendo recién salida del
      glaciar. Piedra por todas partes, un mar de bloques, lagos metidos en cada hueco y pinos que murieron en
      pie y siguen allí, plateados, como monumentos naturales. Es un paisaje de lomas suaves y líneas largas
      entre el lago Femunden y la frontera con Suecia, en los municipios de Røros y Engerdal, y forma, junto a
      las áreas protegidas suecas vecinas, uno de los mayores espacios continuos de naturaleza silvestre del
      sur de Escandinavia.
    landscape: >-
      Todo viene del hielo. Durante la última glaciación el hielo llegó a tener entre 2000 y 3000 m de grosor
      alrededor del Femunden, y esta fue una de las últimas zonas en quedar libre. Hace diez mil años se
      retiró y dejó un paisaje antiguo cubierto de un mar de bloques de piedra que ha cambiado poco desde
      entonces.


      Hay detalles que se reconocen desde un lago. Crestas estrechas que se adentran serpenteando en el agua y
      forman cabos e islas: son las morrenas de Rogen, que dan nombre a un tipo de formación glaciar. Y aunque
      Femundsmarka es sobre todo lomas suaves y bosque abierto, las cumbres más altas son el Storviglen, de
      1561 m, es el más alto y está al norte; al sur, el Stor-Svuku, de 1421 m, y el Elgåhogna, de 1460 m.


      Entre piedras crecen cosas sorprendentes: mantos de líquenes de reno, orquídeas de colores y plantas de
      montaña resistentes. El liquen lobo, amarillo intenso, crece sobre todo en pinos viejos y secos; es una
      especie de la lista roja en retroceso, y el parque tiene una de sus mayores poblaciones del país. Debe
      el nombre a su toxicidad: contiene ácido vulpínico, y antiguamente se usaba con carne y vidrio para
      envenenar lobos y zorros.
    wildlife: >-
      Los pinos secos, que parecen muertos, albergan insectos y líquenes, y por eso se protegen. En los cursos
      de agua trabajan los [castores](/especie/castor_fiber/); sus huellas están por todas partes. En los
      bosques tranquilos pastan los [alces](/especie/alces_alces/) y las [martas](/especie/martes_martes/)
      cazan pequeños roedores. Las [nutrias](/especie/lutra_lutra/) dejan rastros en el agua. En el corazón
      más interior, junto a la frontera con Suecia, viven el [oso pardo](/especie/ursus_arctos/) y el
      [glotón](/especie/gulo_gulo/), y en el extremo norte vive un pequeño grupo de [bueyes
      almizcleros](/especie/ovibos_moschatus/) llegados desde Dovre en los años setenta.


      En primavera el [halcón gerifalte](/especie/falco_rusticolus/) acecha al lagópodo y los escribanos
      nivales pasan hacia el norte; los colimbos de garganta negra se oyen mientras bucean en los lagos. Aves
      del este, propias de la taiga, aparecen en Femundsmarka: la aguja colipinta y el carbonero lapón son dos
      rarezas. Y a finales del invierno, el [águila pescadora](/especie/pandion_haliaetus/), que invernó al
      suroeste del Sáhara, emprende el viaje de vuelta: muchas pasan el verano aquí, en pinos de copa plana,
      junto a aguas llenas de peces.


      La cría sami del [reno](/especie/rangifer_tarandus/) usa todo Femundsmarka como pasto: durante todo el
      año en el sur y solo en invierno en el norte. Los renos son especialmente vulnerables a las molestias
      desde el día de San Juan hasta el 15 de julio, por el marcado de las crías. Mantén la distancia.
    visit: >-
      Femundsmarka se recorre a pie, en canoa o en barco. Hay dos puertas principales: Elgå, al sur, y
      Synnervika, al norte. Desde ambas sale el histórico barco Fæmund II, que comunica en verano varios
      puntos de acceso a distintas partes del parque. En Elgå está además el centro de visitantes de
      Femundsmarka y Gutulia, con una exposición sobre la historia, la fauna y la cría de renos sami
      meridionales; fuera, un sendero de aventura baja hasta el muelle del Fæmund II. El centro presta gratis
      quemadores de ramitas para hacer fuego sin dejar rastro.


      Para caminar hay innumerables kilómetros de senderos marcados, y también se puede seguir el rastro de
      animales o de cursos de agua. Tres cumbres sirven de ejemplo. El Elgåhogna: desde Dalset son 5,2 km por
      sendero marcado, con 700 m de desnivel, y desde arriba se ve entero el Femunden con buena visibilidad.
      El Stor-Svuku: desde la cabaña Svukuriset son 5,7 km de subida constante, con vistas al Femunden, a
      Suecia y al Rondane. Y el Storviglen, desde Ljøsnåvollen, unos 7 km, con un sendero sin marcar al pie
      hasta el hito de piedras. Y la Malmveien, una ruta histórica, une Røros con Femundsmarka en tres etapas
      de unos 15 km al día.


      En canoa o packraft, hay lagos tranquilos y ríos serpenteantes, y un curso de agua continuo desde el
      lado sueco hasta el Femunden. La ruta de canoa por el Langtjønna sale de Synnervika y avanza hacia
      Nordvika a lo largo de unos ocho kilómetros; el río Røa atraviesa tramos tranquilos desde Rogen hasta el
      lago Roasten y luego corre más rápido rumbo al Femund.
    history: >-
      Femundsmarka es uno de los parques nacionales más antiguos de Noruega, y se salvó de un proyecto
      hidroeléctrico tras una larga lucha. Se protegió en 1971 y se amplió bastante en 2003; hoy ocupa 573
      km².


      La huella humana es larga. Los sami han criado renos durante siglos y dejaron cimientos de cabañas de
      turba, lugares de almacenaje y corrales. Los grupos de propietarios de renos se llaman sijte en sami
      meridional: Saanti sijte y Gåebrien sijte pastorean en el norte y Svahken sijte en el sur. Hasta la
      frontera sueca se ven señales de tala y de carboneras, y en los cursos de agua quedan presas, canales y
      barreras del transporte flotado de troncos. En Sylen, en la frontera, sigue habiendo granjas habitadas,
      sin acceso por carretera y rodeadas por el parque.
    before: >-
      Del 15 de abril al 15 de septiembre está prohibido hacer fuego, salvo donde no haya riesgos evidentes de
      incendio forestal; usa solo ramitas pequeñas, mejor las del suelo, porque todos los árboles están
      protegidos. Los perros deben ir atados del 1 de abril al 20 de agosto. Revisa los avisos del parque
      antes de ir, porque hay zonas y periodos sensibles.
    around: >-
      A unos cinco kilómetros está el [Parque Nacional de Gutulia](/lugar/gutulia-national-park/), el más
      pequeño de Noruega. Más lejos, el [Parque Nacional de Sarek](/lugar/sarek-national-park/), el [Parque
      Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) y el [Parque Nacional de
      Abisko](/lugar/abisko-national-park/) comparten con Femundsmarka el glotón y el alce.
  en:
    intro: >-
      Ten thousand years after the glaciers retreated, Femundsmarka still appears newly sculpted by the ice.
      Boulders everywhere, a jumble of block fields, tarns tucked into every hollow, and ancient pines that
      died on their feet standing silvery like natural monoliths. It is a terrain of broad ridges and sweeping
      horizons between Lake Femunden and the Swedish frontier, in the municipalities of Røros and Engerdal,
      forming together with adjacent Swedish reserves one of the largest unbroken wilderness areas in southern
      Scandinavia.
    landscape: >-
      Glaciation shaped every feature. During the last glacial maximum the ice sheet reached between 2000 and
      3000 m in thickness around Lake Femunden, making this one of the final areas to melt out. Ten thousand
      years ago it finally receded, leaving a primeval landscape draped in a chaotic sea of boulders that has
      remained virtually untouched ever since.


      From the water, distinct features emerge. Narrow morainic ridges snake out across lakes to form capes,
      skerries, and islands: these are Rogen moraines, eponymous for this specific glacial landform. While
      Femundsmarka consists largely of gentle fell slopes and open lichen woodland, rocky peaks punctuate the
      skyline: Storviglen at 1561 m is the highest in the north, matched in the south by Stor-Svuku at 1421 m
      and Elgåhogna at 1460 m.


      Among the block fields thrives resilient life: carpets of reindeer lichen, hardy mountain wildflowers,
      and dwarf shrubs. Wolf lichen (Letharia vulpina), brilliant sulfur-yellow, encrusts dead veteran pines;
      it is an endangered Red List lichen, and the park protects one of Norway's premier populations. It takes
      its name from its historical use: laden with toxic vulpic acid, it was once mixed with tallow and glass
      shards to poison wolves and foxes.
    wildlife: >-
      Standing dead pines support rich communities of wood-boring beetles, hole-nesting birds, and rare
      lichens. Along the watercourses [Eurasian beavers](/especie/castor_fiber/) fell birches and build
      lodges. In quiet forests [elk](/especie/alces_alces/) browse the undergrowth while [pine
      martens](/especie/martes_martes/) hunt voles. [Eurasian otters](/especie/lutra_lutra/) leave telltale
      slides on snowy riverbanks. In the deep backcountry along the Swedish border, [brown
      bear](/especie/ursus_arctos/) and [wolverine](/especie/gulo_gulo/) roam, and in the northern fells a
      small relict herd of [muskoxen](/especie/ovibos_moschatus/) persists, descendants of animals that
      wandered from Dovre in the seventies.


      In spring the [gyrfalcon](/especie/falco_rusticolus/) patrols for willow ptarmigan, snow buntings
      migrate northward, and black-throated loons yodel across misty lakes. Eastern taiga species reach their
      western fringe here: bar-tailed godwit and Siberian tit are prized sightings. Late in winter,
      [ospreys](/especie/pandion_haliaetus/) journey back from sub-Saharan wintering quarters to nest in
      flat-topped pines over fish-rich shallows.


      Traditional Sámi reindeer herding operates across the entire park: year-round in the south and in winter
      throughout the north. The [reindeer](/especie/rangifer_tarandus/) are especially sensitive to human
      disturbance from Midsummer through 15 July during calf-marking. Keep your distance.
    visit: >-
      Femundsmarka is navigated on foot, by canoe, or aboard the lake boat. Two main gateways exist: Elgå to
      the south and Synnervika to the north. From both docks operates the historic wooden passenger vessel
      Fæmund II, delivering hikers to wilderness landings along Lake Femunden throughout the summer. Elgå
      hosts the Femundsmarka and Gutulia National Park Visitor Centre, featuring exhibitions on South Sámi
      reindeer herding, geology, and wildlife; outside, a nature trail leads down to the pier. The centre
      loans out lightweight twig-burning stoves free of charge to leave no trace.


      For hiking, innumerable kilometres of marked trails span the fells, alongside wild game tracks. Three
      representative peaks reward climbers: Elgåhogna, a 5.2 km marked trail from Dalset with 700 m of
      elevation gain opening broad panoramas over Lake Femunden; Stor-Svuku, a 5.7 km steady ascent from
      Svukuriset mountain hut with views toward Rondane and Sweden; and Storviglen from Ljøsnåvollen, an
      adventurous 7 km ascent partly over unmarked terrain. For long-distance walkers, the historic Malmveien
      connects Røros to Femundsmarka in three stages of roughly 15 km per day.


      By canoe or packraft, calm lakes connect via portages into an unbroken waterway leading into Sweden. The
      Langtjønna canoe route runs from Synnervika toward Nordvika over roughly eight kilometres; the wild Røa
      river offers quiet paddling between Lake Rogen and Lake Roasten before plunging over rapids toward Lake
      Femunden.
    history: >-
      Femundsmarka is among Norway's earliest national parks, saved from catastrophic hydroelectric damming
      through protracted public campaigns. Designated in 1971 and expanded in 2003, it today spans 573 km².


      Human history runs deep across the landscape. The Sámi have herded reindeer across these fells for
      centuries, leaving turf hut foundations, storage pits, and traditional corrals. South Sámi herding
      districts (sijte) remain active: Saanti sijte and Gåebrien sijte pasture herds in the north, while
      Svahken sijte grazes the south. Historic charcoal hearths and timber chutes dot the border country,
      reminders of charcoal burning for the copper smelters of Røros. At Sylen on the Swedish border, isolated
      roadless farms remain inhabited, surrounded by the park.
    before: >-
      From 15 April to 15 September open campfires are strictly prohibited, except where fire danger is
      demonstrably absent; burn only fallen dead twigs, as all trees, dead or alive, are legally protected.
      Dogs must be kept on leads from 1 April to 20 August. Check park alerts prior to departure for seasonal
      sensitive zones.
    around: >-
      Roughly five kilometres away lies [Gutulia National Park](/lugar/gutulia-national-park/), Norway's
      smallest national park. Farther north, [Sarek National Park](/lugar/sarek-national-park/), [Urho
      Kekkonen National Park](/lugar/urho-kekkonen-national-park/), and [Abisko National
      Park](/lugar/abisko-national-park/) share wolverine and elk in grand boreal wilderness.
  fr:
    intro: >-
      Dix mille ans après le retrait des glaces, Femundsmarka semble toujours fraîchement sortie de
      l'inlandsis. Des blocs rocheux partout, une mer de pierriers, des lacs nichés dans chaque creux et des
      pins morts sur pied dressés comme des monolithes argentés. C'est un paysage de croupes douces et de
      vastes horizons entre le lac Femunden et la frontière suédoise, sur les communes de Røros et d'Engerdal,
      formant avec les réserves suédoises voisines l'un des plus grands espaces sauvages d'un seul tenant du
      sud de la Scandinavie.
    landscape: >-
      Tout découle des glaciers. Lors de la dernière glaciation, la calotte atteignait entre 2000 et 3000 m
      d'épaisseur autour du lac Femunden, faisant de cette contrée l'une des dernières libérées des glaces. Il
      y a dix mille ans, elle s'est retirée en laissant un champ chaotique de blocs de pierre qui a très peu
      changé depuis.


      Depuis l'eau se distinguent des reliefs singuliers. D'étroits cordons morainiques serpentent dans les
      lacs et dessinent caps et îlots : ce sont les moraines de Rogen, archétype d'un modelé glaciaire réputé.
      Bien que Femundsmarka soit dominé par des croupes boisées et des clairières de lichens, plusieurs crêtes
      s'élèvent : Storviglen à 1561 m est le point culminant au nord ; au sud se dressent Stor-Svuku à 1421 m
      et Elgåhogna à 1460 m.


      Entre les pierres survit une flore adaptée : tapis de lichens des rennes, orchidées boréales et arbustes
      nains. Le lichen du loup, d'un jaune soufre éclatant, tapisse les vieux troncs morts de pins sylvestres
      ; espèce vulnérable sur liste rouge, le parc abrite l'une de ses plus belles populations. Il doit son
      nom à l'acide vulpinique qu'il contient, autrefois mélangé à de la viande et du verre pilé pour
      empoisonner loups et renards.
    wildlife: >-
      Les vieux pins morts, loin d'être inertes, abritent insectes cavernicoles et lichens rares, bénéficiant
      d'une protection totale. Sur les cours d'eau s'activent les [castors](/especie/castor_fiber/). Dans les
      forêts tranquilles paissent les [élans](/especie/alces_alces/) tandis que la [martre des
      pins](/especie/martes_martes/) chasse les petits rongeurs. Les [loutres d'Europe](/especie/lutra_lutra/)
      sillonnent les rivières. Au cœur du massif, le long de la frontière suédoise, vivent l'[ours
      brun](/especie/ursus_arctos/) et le [glouton](/especie/gulo_gulo/), et dans l'extrême nord subsiste un
      petit groupe de [bœufs musqués](/especie/ovibos_moschatus/) descendus du Dovre dans les années
      soixante-dix.


      Au printemps, le [faucon gerfaut](/especie/falco_rusticolus/) guette le lagopède des saules et les
      plectrophanes des neiges filent vers le nord ; les plongeons arctiques font entendre leurs complaintes
      sur les eaux calmes. Des oiseaux venus de la taïga orientale s'observent à Femundsmarka : la barge
      rousse et la mésange lapone constituent deux raretés. En fin d'hiver, le [balbuzard
      pêcheur](/especie/pandion_haliaetus/), après avoir hiverné au sud du Sahara, regagne ses nids perchés
      sur les vieux pins au bord d'eaux poissonneuses.


      Le pastoralisme sami du [renne](/especie/rangifer_tarandus/) utilise tout l'espace du parc : à l'année
      dans le sud et en hiver dans le nord. Les hardes sont particulièrement vulnérables aux dérangements
      depuis la Saint-Jean jusqu'au 15 juillet lors du marquage des faons. Gardez vos distances.
    visit: >-
      Femundsmarka se parcourt à pied, en canoë ou en bateau. Deux accès majeurs desservent le parc : Elgå au
      sud et Synnervika au nord. De ces deux embarcadères part l'historique bateau Fæmund II, qui assure la
      desserte estivale de divers débarcadères sauvages sur le lac Femunden. À Elgå se trouve le centre
      d'accueil de Femundsmarka et Gutulia, avec une exposition sur l'élevage traditionnel des rennes samis du
      Sud ; à l'extérieur, un sentier thématique descend jusqu'au quai. Le centre prête gratuitement des
      réchauds à brindilles pour randonner sans laisser de traces.


      Pour la marche, des kilomètres innombrables de sentiers balisés parcourent le parc. Trois sommets
      emblématiques s'offrent aux randonneurs. L'Elgåhogna : depuis Dalset, 5,2 km de sentier balisé avec 700
      m de dénivelé offrent un panorama sur tout le Femunden. Le Stor-Svuku : au départ du refuge de
      Svukuriset, 5,7 km de montée régulière mènent à une vue circulaire sur la Suède et le Rondane. Et le
      Storviglen, depuis Ljøsnåvollen, environ 7 km d'ascension sur terrain sauvage. La Malmveien, ancienne
      voie muletière, relie Røros à Femundsmarka en trois étapes d'environ 15 km par jour.


      En canoë ou packraft, le réseau de plans d'eau forme un itinéraire fluide rejoignant la Suède. Le
      parcours sur le Langtjønna s'étire de Synnervika vers Nordvika sur environ huit kilomètres ; la rivière
      Røa offre de paisibles biefs entre le lac Rogen et le lac Roasten avant de s'accélérer vers le lac
      Femund.
    history: >-
      Femundsmarka compte parmi les parcs nationaux les plus anciens de Norvège, sauvé des projets
      hydroélectriques après une longue mobilisation citoyenne. Protégé en 1971 et considérablement agrandi en
      2003, il couvre aujourd'hui 573 km².


      L'empreinte humaine y est séculaire. Les Samis élèvent des rennes ici depuis des siècles, laissant
      fondations de huttes de tourbe, fosses de stockage et enclos. Les communautés d'éleveurs s'appellent
      sijte : Saanti sijte et Gåebrien sijte au nord, Svahken sijte au sud. Jusqu'à la frontière suédoise se
      remarquent d'anciennes meules de charbon de bois pour les fonderies de cuivre de Røros, ainsi que des
      barrages et glissoires à grumes. À Sylen, enclavée sur la frontière, subsistent des fermes
      traditionnelles habitées sans accès routier.
    before: >-
      Du 15 avril au 15 septembre, les feux de camp sont strictement interdits sauf absence avérée de risque
      d'incendie ; n'utilisez que des brindilles mortes au sol, car tous les arbres sont intégralement
      protégés. Les chiens doivent être tenus en laisse du 1 avril au 20 août. Consultez les avis du parc
      avant de partir.
    around: >-
      À environ cinq kilomètres se trouve le [Parc national de Gutulia](/lugar/gutulia-national-park/), le
      plus petit de Norvège. Plus loin, le [Parc national de Sarek](/lugar/sarek-national-park/), le [Parc
      national Urho Kekkonen](/lugar/urho-kekkonen-national-park/) et le [Parc national
      d'Abisko](/lugar/abisko-national-park/) partagent avec Femundsmarka le glouton et l'élan.
  de:
    intro: >-
      Zehntausend Jahre nach dem Rückzug des Eises wirkt Femundsmarka noch immer wie frisch aus dem Gletscher
      entlassen. Felsbrocken überall, ein Meer aus Steinblöcken, Seen in jeder Geländemulde und alte
      abgestorbene Kiefern, die silbrig wie Naturdenkmäler emporragen. Es ist eine Landschaft sanfter Rücken
      und weiter Horizonte zwischen dem Femundsee und der schwedischen Grenze in den Gemeinden Røros und
      Engerdal, die gemeinsam mit schwedischen Nachbargebieten eines der größten zusammenhängenden
      Wildnisareale Südskandinaviens bildet.
    landscape: >-
      Alles verdankt sich dem Eis. Während der letzten Eiszeit türmte sich der Eispanzer rund um den Femundsee
      zwischen 2000 und 3000 m hoch auf; dies war eine der letzten eisfreien Regionen. Vor zehntausend Jahren
      zog sich das Eis zurück und hinterließ ein urzeitliches Blockmeer, das sich seither kaum verändert hat.


      Vom Wasser aus fallen besondere Geländeformen auf. Schmale Moränenkämme schlängeln sich durch die Seen
      und bilden Kaps und Inseln: die Rogen-Moränen, Namensgeber eines glazialen Landschaftstyps. Obwohl
      Femundsmarka vor allem aus sanften Hängen und lichten Kiefernwäldern besteht, ragen markante Gipfel auf:
      Der Storviglen mit 1561 m ist der höchste im Norden; im Süden erheben sich der Stor-Svuku mit 1421 m und
      der Elgåhogna mit 1460 m.


      Zwischen den Felsblöcken wächst widerstandsfähige Vegetation: Rentierflechtenteppiche, Knabenkräuter und
      Zwergsträucher. Die leuchtend gelbe Wolfsflechte wächst bevorzugt auf stehendem totem Kiefernholz; als
      bedrohte Rote-Liste-Art besitzt sie hier eines ihrer bedeutendsten Vorkommen in Norwegen. Ihren Namen
      verdankt sie der giftigen Vulpinsäure, die früher mit Fleisch und Glasscherben ausgelegt wurde, um Wölfe
      und Füchse zu vergiften.
    wildlife: >-
      Dürre Kiefernstämme bieten Insekten und Flechten wertvollen Lebensraum und sind daher streng geschützt.
      An den Flussläufen arbeiten [Biber](/especie/castor_fiber/); ihre Nagespuren finden sich allenthalben.
      In den stillen Wäldern äsen [Elche](/especie/alces_alces/), während
      [Baummarder](/especie/martes_martes/) Kleinsäugern nachstellen. [Fischotter](/especie/lutra_lutra/)
      hinterlassen Spuren an den Ufern. Im abgelegenen Grenzstreifen zu Schweden streifen
      [Braunbär](/especie/ursus_arctos/) und [Vielfraß](/especie/gulo_gulo/), und ganz im Norden lebt eine
      kleine Gruppe von [Moschusochsen](/especie/ovibos_moschatus/), die in den siebziger Jahren aus dem
      Dovrefjell einwanderte.


      Im Frühjahr jagt der [Gerfalke](/especie/falco_rusticolus/) nach Schneehühnern, Schneeammern ziehen nach
      Norden, und die Rufe der Prachttaucher hallen über die Seen. Vögel der östlichen Taiga erreichen hier
      ihre westliche Grenze: Pfuhlschnepfe und Unglückshäher sind ornithologische Kostbarkeiten. Im Spätwinter
      kehrt der [Fischadler](/especie/pandion_haliaetus/) aus Afrika zurück, um in flachen Kiefernkronen an
      fischreichen Gewässern zu brüten.


      Die samische [Rentier](/especie/rangifer_tarandus/)-Weidewirtschaft nutzt das gesamte Schutzgebiet:
      ganzjährig im Süden, im Winter im Norden. Rentiere reagieren besonders empfindlich auf Störungen von
      Mittsommer bis zum 15. Juli während der Kälbermarkierung. Halte respektvollen Abstand.
    visit: >-
      Femundsmarka lässt sich zu Fuß, im Kanu oder per Schiff bereisen. Zwei Haupteingänge erschließen den
      Park: Elgå im Süden und Synnervika im Norden. Von beiden Stegen legt das historische Motorschiff Fæmund
      II ab, das im Sommer Wanderer zu Anlegestellen am Femundsee bringt. In Elgå informiert das
      Nationalparkzentrum Femundsmarka und Gutulia über Natur und südsamische Rentierwirtschaft; draußen führt
      ein Erlebnispfad zum Anleger. Das Zentrum verleiht kostenlos kleine Holzgaskocher für spurenlose Rasten.


      Für Wanderer gibt es unzählige Kilometer markierter Routen. Drei Gipfel stehen beispielhaft: der
      Elgåhogna mit 5,2 km markiertem Aufstieg ab Dalset bei 700 m Höhenunterschied und weitem Femund-Blick;
      der Stor-Svuku mit 5,7 km kontinuierlichem Anstieg von der Hütte Svukuriset; und der Storviglen ab
      Ljøsnåvollen auf rund 7 km Strecke im weglosen Blockgelände. Der historische Malmveien verbindet Røros
      mit Femundsmarka in drei Etappen von etwa 15 km pro Tag.


      Im Kanu oder Packraft bilden ruhige Seen und Flüsse eine durchgehende Wasserroute bis nach Schweden. Die
      Kanutour auf dem Langtjønna führt von Synnervika nach Nordvika über etwa acht Kilometer; der Røa-Fluss
      bietet stille Abschnitte vom Rogen bis zum Roasten-See, bevor er rascher zum Femund eilt.
    history: >-
      Femundsmarka gehört zu den ältesten Nationalparks Norwegens und wurde nach langem Bürgerprotest vor
      Wasserkraftbauten bewahrt. Er wurde 1971 ausgewiesen, 2003 deutlich erweitert und umfasst heute 573 km².


      Die menschliche Nutzung reicht weit zurück. Samen hüten hier seit Jahrhunderten Rentiere und
      hinterließen Torfhüttenreste und Vorratsgruben. Die südsamischen Weidegemeinschaften heißen Sijte:
      Saanti und Gåebrien weiden im Norden, Svahken im Süden. Bis zur schwedischen Grenze finden sich
      historische Köhlereispuren für die Kupferhütten von Røros sowie alte Holztriftklausen. In Sylen an der
      Grenze liegen bewohnte Bergbauernhöfe ohne Straßenanbindung.
    before: >-
      Vom 15. April bis zum 15. September ist offenes Feuer verboten, es sei denn, eine Brandgefahr ist
      offensichtlich ausgeschlossen; nutze nur trockenes Astholz vom Boden, da alle Bäume geschützt sind.
      Hunde sind vom 1. April bis zum 20. August an der Leine zu führen. Beachte aktuelle Hinweise der
      Parkverwaltung.
    around: >-
      Rund fünf Kilometer entfernt liegt der [Nationalpark Gutulia](/lugar/gutulia-national-park/), der
      kleinste Norwegens. Weiter entfernt teilen der [Nationalpark Sarek](/lugar/sarek-national-park/), der
      [Urho-Kekkonen-Nationalpark](/lugar/urho-kekkonen-national-park/) und der [Nationalpark
      Abisko](/lugar/abisko-national-park/) Vielfraß und Elch in nordischer Wildnis.
  it:
    intro: >-
      Diecimila anni dopo il ritiro dei ghiacci, Femundsmarka sembra ancora appena liberata dalla calotta.
      Pietre ovunque, un mare caotico di massi, laghi annidati in ogni conca e pini morti rimasti ritti come
      monumenti argentei. È un paesaggio di rilievi distesi e ampi orizzonti tra il lago Femunden e il confine
      svedese, nei comuni di Røros ed Engerdal, che assieme alle confinanti riserve svedesi compone una delle
      più vaste aree selvagge contigue della Scandinavia meridionale.
    landscape: >-
      Ogni elemento geologico deriva dal ghiaccio. Durante l'ultima glaciazione la coltre glaciale toccava tra
      2000 e 3000 m di spessore attorno al Femunden, e questa fu una delle ultime terre a sgelare. Diecimila
      anni fa il ghiaccio si ritirò lasciando un paesaggio primordiale coperto da un mare di blocchi rocciosi
      quasi immutato da allora.


      Dal pelo dell'acqua si riconoscono morfologie inconfondibili. Creste moreniche sottili serpeggiano tra i
      bacini formando promontori e isolette: sono le morene di Rogen, toponimo di una celebre formazione
      glaciale. Sebbene Femundsmarka sia dominata da ampi dossi e pineti radi, emergono vette aguzze: lo
      Storviglen a 1561 m è il più elevato a nord; a sud si innalzano lo Stor-Svuku a 1421 m e l'Elgåhogna a
      1460 m.


      Tra i blocchi cresce una flora resistente: tappeti di licheni delle renne, orchidee e arbusti nani. Il
      lichene del lupo, di un giallo zolfo acceso, alligna sui pini vetusti; specie rara inserita nella lista
      rossa, trova qui una delle popolazioni più cospicue della Norvegia. Deve il nome all'acido vulpinico,
      storicamente impiegato con carne e frammenti di vetro per avvelenare lupi e volpi.
    wildlife: >-
      I pini disseccati offrono rifugio a insetti xilofagi e licheni boreali, godendo di protezione assoluta.
      Nei corsi d'acqua operano i [castori](/especie/castor_fiber/). Nei boschi indisturbati pascolano gli
      [alci](/especie/alces_alces/) e le [martore](/especie/martes_martes/) cacciano piccoli roditori. Le
      [lontre](/especie/lutra_lutra/) nuotano nei torrenti. Nelle profondità del parco, verso la Svezia,
      vivono l'[orso bruno](/especie/ursus_arctos/) e il [ghiottone](/especie/gulo_gulo/), mentre
      all'estremità settentrionale staziona un piccolo nucleo di [buoi muschiati](/especie/ovibos_moschatus/)
      discesi dal Dovre negli anni settanta.


      In primavera il [falco girfalco](/especie/falco_rusticolus/) insidia la pernice bianca e gli zigoli
      delle nevi migrano a nord; le strolaghe mezzane lanciano i loro richiami sui laghi. Uccelli della taiga
      orientale toccano qui il limite occidentale: la pittima minore e la cimaia siberiana sono due rarità. A
      fine inverno il [falco pescatore](/especie/pandion_haliaetus/) torna dall'Africa per nidificare sui pini
      secolari a ridosso di acque pescose.


      L'allevamento sami della [renna](/especie/rangifer_tarandus/) impegna l'intero territorio: tutto l'anno
      a sud, nei soli mesi invernali a nord. Le renne sono vulnerabili ai disturbi dalla festa di San Giovanni
      fino al 15 luglio per la marcatura dei piccoli. Mantieni la distanza.
    visit: >-
      Femundsmarka si esplora a piedi, in canoa o in battello. Due varchi principali aprono il parco: Elgå a
      sud e Synnervika a nord. Da entrambi i pontili salpa il battello storico Fæmund II, che in estate serve
      vari approdi lungo il lago Femunden. A Elgå si trova il centro visite di Femundsmarka e Gutulia, con
      mostre sulla pastorizia delle renne dei sami meridionali; all'esterno un percorso tematico scende
      all'imbarcadero. Il centro noleggia gratuitamente fornelli a ramaglie per escursioni a impatto zero.


      Per camminare si aprono innumerevoli chilometri di tracce segnate. Tre cime offrono mete d'eccellenza:
      l'Elgåhogna, 5,2 km da Dalset con 700 m di salita e panorama sull'intero bacino del Femunden; lo
      Stor-Svuku, 5,7 km di ascesa costante dalla baita Svukuriset con vista su Svezia e Rondane; e lo
      Storviglen da Ljøsnåvollen, circa 7 km su pietraia. La storica Malmveien unisce Røros a Femundsmarka in
      tre tappe di circa 15 km giornalieri.


      In canoa o packraft si naviga lungo un corridoio fluido che giunge in Svezia. Il tracciato di Langtjønna
      muove da Synnervika a Nordvika per circa otto chilometri; il fiume Røa alterna specchi tranquilli tra il
      lago Rogen e il Roasten a rapide vive verso il Femund.
    history: >-
      Femundsmarka è uno dei parchi nazionali più storici della Norvegia, sottratto a progetti idroelettrici
      dopo una lunga mobilitazione. Protetto nel 1971 e notevolmente esteso nel 2003, copre oggi 573 km².


      L'insediamento umano ha radici antiche. I sami allevano renne da secoli lasciando capanne di zolle e
      recinti. Le comunità pastorali tradizionali sono i sijte: Saanti e Gåebrien a nord, Svahken a sud. Verso
      il confine svedese affiorano piazzole di carbonaie per le ferriere di Røros e chiuse per la fluitazione
      dei tronchi. A Sylen sul confine sorgono fattorie abitate prive di collegamenti stradali.
    before: >-
      Dal 15 aprile al 15 settembre è proibito accendere fuochi, salvo dove sia esclusa ogni propagazione
      boschiva; impiega solo rami secchi a terra, poiché tutti gli alberi sono protetti. I cani devono essere
      tenuti al guinzaglio dal 1 aprile al 20 agosto. Informati sugli avvisi della riserva prima di partire.
    around: >-
      A circa cinque chilometri si trova il [Parco Nazionale di Gutulia](/lugar/gutulia-national-park/), il
      più piccolo della Norvegia. Più lontano, il [Parco Nazionale Sarek](/lugar/sarek-national-park/), il
      [Parco Nazionale Urho Kekkonen](/lugar/urho-kekkonen-national-park/) e il [Parco Nazionale di
      Abisko](/lugar/abisko-national-park/) condividono con Femundsmarka il ghiottone e l'alce.
  pt:
    intro: >-
      Dez mil anos volvidos sobre o recuo do gelo, Femundsmarka continua a parecer acabada de emergir da
      glaciação. Pedra por todo o lado, um caos de blocos rochosos, lagos encaixados em cada depressão e
      pinheiros dessecados erguidos como monumentos prateados. É uma paisagem de colinas suaves e horizontes
      infinitos entre o lago Femunden e a fronteira sueca, nos municípios de Røros e Engerdal, formando com as
      áreas protegidas vizinhas da Suécia um dos maiores redutos selvagens contínuos do sul da Escandinávia.
    landscape: >-
      Toda a orografia resulta da ação glaciar. Durante o último máximo glaciar, o manto de gelo atingiu entre
      2000 e 3000 m de espessura em redor do lago Femunden, tendo sido esta uma das últimas zonas a degelar.
      Há dez mil anos recuou, expondo um mar primordial de blocos que pouco se alterou desde então.


      A partir da água distinguem-se feições singulares. Cristas morenicas estreitas serpenteiam pelos lagos
      formando cabos e ilhotas: são as moreias de Rogen, modelo de uma formação glaciar célebre. Embora
      Femundsmarka seja dominada por dorsais brandas e pinhais abertos de líquenes, despontam cumes rochosos:
      o Storviglen com 1561 m é o mais elevado a norte; a sul erguem-se o Stor-Svuku com 1421 m e o Elgåhogna
      com 1460 m.


      Entre o cascalho medra flora resiliente: mantos de líquen-das-renas, orquídeas e matos anões. O
      líquen-do-lobo, de um amarelo-enxofre vivo, incrusta os velhos pinheiros mortos; espécie ameaçada do
      Livro Vermelho, o parque concentra uma das suas maiores populações norueguesas. O nome decorre do ácido
      vulpínico tóxico, outrora misturado com carne e cacos de vidro para abater lobos e raposas.
    wildlife: >-
      Os pinheiros secos acolhem fungos, insetos xilófagos e líquenes raros, gozando de imunidade legal
      absoluta. Nos cursos de água labutam [castores](/especie/castor_fiber/). Nas matas tranquilas pastam
      [alces](/especie/alces_alces/) e as [martas](/especie/martes_martes/) caçam micromamíferos. As
      [lontras](/especie/lutra_lutra/) deixam trilhos nos charcos. No interior remoto, junto à fronteira com a
      Suécia, vagueiam o [urso-pardo](/especie/ursus_arctos/) e o [glutão](/especie/gulo_gulo/), e no extremo
      setentrional subsiste um pequeno núcleo de [bois-almizclados](/especie/ovibos_moschatus/) chegados do
      Dovre nos anos setenta.


      Na primavera o [falcão-gerifalte](/especie/falco_rusticolus/) persegue a perdiz-branca e as
      escrevedeiras-das-neves rumam a norte; a mobelha-de-garganta-preta mergulha nos lagos cristalinos. Aves
      da taiga oriental atingem aqui o seu limite ocidental: o fuzelo e o chapim-lapónico são duas raridades.
      No final do inverno, a [águia-pesqueira](/especie/pandion_haliaetus/) regressa da África subsariana para
      nidificar no cimo de pinheiros velhos junto a águas piscosas.


      A pastorícia tradicional sami da [rena](/especie/rangifer_tarandus/) estende-se por todo o parque: todo
      o ano a sul e no inverno a norte. As renas são extraordinariamente vulneráveis às perturbações entre o
      dia de São João e 15 de julho, época de marcação das crias. Mantém a distância.
    visit: >-
      Femundsmarka descobre-se a pé, de canoa ou de barco. Existem dois acessos principais: Elgå a sul e
      Synnervika a norte. De ambos os cais parte o histórico navio Fæmund II, que no verão assegura ligações a
      vários ancoradouros do lago Femunden. Em Elgå localiza-se o centro de visitantes de Femundsmarka e
      Gutulia, com exposições sobre a pastorícia sami; no exterior, um trilho interpretativo desce até ao
      cais. O centro empresta gratuitamente pequenos fogões a lenha para cozinhar sem deixar rasto.


      Para caminhar abrem-se incontáveis quilómetros de veredas demarcadas. Três cumes exemplificam as subidas
      clássicas: o Elgåhogna, com 5,2 km desde Dalset por trilho balizado e 700 m de desnível com vista
      deslumbrante sobre o Femunden; o Stor-Svuku, com 5,7 km de ascensão contínua a partir de Svukuriset; e o
      Storviglen a partir de Ljøsnåvollen, com cerca de 7 km sobre cascalheiras. A histórica rota Malmveien
      liga Røros a Femundsmarka em três etapas de cerca de 15 km diários.


      Em canoa ou packraft os lagos e ribeiros formam um percurso fluido com ligação à Suécia. O trajeto em
      Langtjønna estende-se de Synnervika a Nordvika ao longo de cerca de oito quilómetros; o rio Røa oferece
      troços calmos entre o lago Rogen e o lago Roasten antes de acelerar rumo ao Femund.
    history: >-
      Femundsmarka é um dos mais antigos parques nacionais da Noruega, resgatado de aproveitamentos
      hidroelétricos após uma mobilização histórica. Foi classificado em 1971 e ampliado em 2003, cobrindo
      hoje 573 km².


      A ocupação humana vem de tempos recuados. Os sami pastoreiam renas há séculos, deixando vestígios de
      cabanas e currais. As comunidades pastoris denominam-se sijte: Saanti e Gåebrien a norte, Svahken a sul.
      Até à fronteira sueca vislumbram-se carvoarias antigas para a fundição de cobre de Røros e diques de
      madeira para transporte de toros. Em Sylen, na fronteira, continuam habitadas quintas rurais sem acesso
      rodoviário.
    before: >-
      De 15 de abril a 15 de setembro é proibido acender fogueiras, exceto onde não exista qualquer risco
      florestal; utiliza apenas gravetos caídos no chão, pois todas as árvores estão protegidas. Os cães devem
      andar presos por trela de 1 de abril a 20 de agosto. Consulta os avisos do parque antes de iniciar a
      visita.
    around: >-
      A cerca de cinco quilómetros situa-se o [Parque Nacional de Gutulia](/lugar/gutulia-national-park/), o
      mais pequeno da Noruega. Mais a norte, o [Parque Nacional Sarek](/lugar/sarek-national-park/), o [Parque
      Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) e o [Parque Nacional de
      Abisko](/lugar/abisko-national-park/) partilham com Femundsmarka o glutão e o alce.
