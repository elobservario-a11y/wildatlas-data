texto:
  es:
    intro: >-
      Llueve más aquí que en casi ningún otro lugar de Portugal, y se nota. Las montañas del Gerês y la Peneda
      frenan el aire húmedo que llega del Atlántico y lo devuelven en forma de cascadas, arroyos y robledales:
      hasta 3.200 milímetros de lluvia al año en las alturas y más de 130 días lluviosos. El Parque Nacional
      da Peneda-Gerês, el único parque nacional de Portugal, se creó en mayo de 1971 y junto al parque gallego
      Baixa Limia–Serra do Xurés forma una reserva de la biosfera transfronteriza.
    landscape: >-
      El nombre del parque son sus dos macizos de granito: la Serra da Peneda y la Serra do Gerês. Con la
      Serra Amarela y la Serra do Soajo forman las cumbres más altas: Gerês (1.545 m), Altar dos Cabrões
      (1.538 m), Soajo (1.430 m), Amarela (1.350 m) y Peneda (1.340 m). Entre ellas, un gran anfiteatro
      esculpido por las fuerzas geológicas, el viento y el agua.


      El granito nació de la colisión continental que reunió la península ibérica con el continente, hace
      entre 380 y 275 millones de años; el más antiguo, en la Amarela, tiene 310 millones. Después llegaron
      los glaciares del Pleistoceno. Ya no queda hielo, pero sí valles en U, morrenas y superficies de granito
      pulido en la Peneda, el Soajo y el Gerês. De los filones del granito se extrajeron estaño, wolframio,
      molibdeno y oro en las minas hoy cerradas de Carris y Borrageiro.


      El agua lo recorre todo. Los ríos Minho, Lima y Cávado reparten las aguas del parque, hay arroyos y
      cascadas en muchas laderas, y las presas de Alto Rabagão, Paradela, Caniçada, Vilarinho da Furna y
      Lindoso embalsan los valles.
    wildlife: >-
      En los valles húmedos dominan los robledales de roble albar y roble pirenaico, sobre todo en los valles
      de Ramiscal, Peneda, Gerês y Beredo. Los bosques de Albergaria y Cabril se conservan especialmente bien.
      Por encima el bosque se aclara y el matorral de tojos y brezos, que cubre el 74 % del parque, toma el
      relevo. A lo largo de los ríos crecen helechos raros como Woodwardia radicans. En total hay 823 taxones
      de plantas vasculares, y entre las endémicas se citan el lirio do Xurés y la timelea. El suelo, sobre
      todo granítico, reúne flora mediterránea, subtropical, eurosiberiana y alpina.


      Entre las 235 especies de vertebrados, 200 están amenazadas o protegidas. El corzo es el símbolo del
      parque, y el [lobo](/especie/canis_lupus/), que se vio como una amenaza para el ganado, estuvo a punto
      de extinguirse por la caza y está protegido por ley desde finales del siglo XX. La cabra montés
      portuguesa desapareció, pero la ibérica ha llegado sola desde Galicia y en 2011 había unos cien
      ejemplares. Los garranos, pequeños caballos del Miño, viven mayormente en libertad y apenas temen a las
      personas. También hay [marta](/especie/martes_martes/), [gato montés](/especie/felis_silvestris/),
      [ardilla roja](/especie/sciurus_vulgaris/), víboras (latastei y seoanei) y tres murciélagos amenazados
      entre los que está el [murciélago grande de herradura](/especie/rhinolophus_ferrumequinum/). La
      salamandra rabilarga, endémica del noroeste ibérico, depende de arroyos de agua limpia y oxigenada.


      Las aves suman 147 especies, sobre todo en la región de Mourela, y en el parque se citan el águila real,
      la chova piquirroja, el búho real, el halcón abejero y la [tarabilla
      norteña](/especie/saxicola_rubetra/). Mourela es el único lugar de cría de la tarabilla en Portugal.
    visit: >-
      El parque portugués mantiene treinta y nueve rutas señalizadas, que suman alrededor de 350 kilómetros.
      Entre las largas están la GR50, la GR34 y la travesía Peneda-Soajo. La reserva transfronteriza se puede
      recorrer además a pie mediante una red de rutas de senderismo transfronterizas.


      Las Portas do Parque ofrecen educación e interpretación ambiental para escolares y otros grupos. Cuando
      visites, ten en cuenta que las caminatas y la observación de la naturaleza pueden requerir autorización
      según la zona protegida.


      Entre los pueblos, Lindoso destaca por el mayor conjunto de espigueiros antiguos de la península
      ibérica, junto a un castillo del siglo XIII. Dentro del parque hay también ruinas de un monasterio de
      Santa Maria das Júnias, construido en 1147, y dos centros de peregrinación: el Santuario de Nossa
      Senhora da Peneda y el de São Bento da Porta Aberta.
    history: >-
      Las huellas humanas más antiguas son de entre 6000 y 3000 a. C.: dólmenes y otras tumbas megalíticas
      junto a Castro Laboreiro y Mourela. La Geira, la calzada romana que unía Braga con Astorga, atravesaba
      el parque, y aún se conservan largos tramos junto al río Homem, puentes y miliarios.


      Los habitantes de Castro Laboreiro vivían de Semana Santa a Navidad en las brandas, casas de altura, y
      el resto del año en las inverneiras del valle. En 1970 la presa del río Homem anegó el pueblo de
      Vilarinho das Furnas; en los años de poca lluvia sus ruinas emergen del agua. Y en las laderas hay un
      fojo do lobo, unos muros de piedra en V levantados en la Edad Media que servían de trampa para lobos.


      Desde 1997 el parque forma con el gallego Baixa Limia–Serra do Xurés el Parque Transfronterizo
      Gerês-Xurés. La UNESCO declaró la reserva de la biosfera en mayo de 2009, con 267.958 hectáreas
      protegidas entre Galicia y la Región Norte. Los incendios son una amenaza real: entre 2000 y 2012 se
      registraron 1.098, que quemaron 31.901 hectáreas.
    before: >-
      Comprueba con el ICNF las normas de la zona que vayas a pisar, porque algunas actividades necesitan
      autorización.
    around: >-
      En el atlas no tiene vecinos cercanos, pero comparte con otros espacios de montaña especies como el búho
      real, el águila real y la marta: el [Parc Natural dels Ports](/lugar/parc-natural-dels-ports/), el
      [Parque Nacional y Natural de Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/) y el
      [Parcul Național Retezat](/lugar/parcul-national-retezat---masivul-muntos/).
  en:
    intro: >-
      It rains more here than almost anywhere else in Portugal, and the landscape reflects it. The soaring
      ranges of Gerês and Peneda arrest moist Atlantic fronts, releasing torrential precipitation in a deluge
      of cascades, raging torrents, and oak woods: up to 3,200 millimetres of rainfall annually across the
      heights and more than 130 rainy days. Peneda-Gerês National Park, the country's sole national park, was
      established in May 1971 and, together with the Galician natural park of Baixa Limia–Serra do Xurés,
      forms an extraordinary transboundary biosphere reserve.
    landscape: >-
      The park takes its name from its two core granite massifs: Serra da Peneda and Serra do Gerês. Alongside
      Serra Amarela and Serra do Soajo they form the dominant summits: Gerês (1,545 m), Altar dos Cabrões
      (1,538 m), Soajo (1,430 m), Amarela (1,350 m), and Peneda (1,340 m). Between them yawns a grand
      amphitheatre sculpted by tectonic forces, prevailing winds, and rushing water.


      The underlying plutonic granite crystallized during the Variscan continental collision that welded
      Iberia to Europe, between 380 and 275 million years ago; the oldest pluton, in the Amarela, dates back
      310 million years. Pleistocene glaciers subsequently reshaped the topography. Glacial ice has vanished,
      leaving classic U-shaped valleys, moraines, and polished granite pavements across Peneda, Soajo, and
      Gerês. Mineral veins yielded tin, tungsten, molybdenum, and gold from now-abandoned mines at Carris and
      Borrageiro.


      Water animates every corner. The Minho, Lima, and Cávado rivers drain the territory, mountain streams
      and cascades tumble down steep slopes, and reservoirs at Alto Rabagão, Paradela, Caniçada, Vilarinho da
      Furna, and Lindoso submerge deep valleys.
    wildlife: >-
      In sheltered, humid valleys thrive ancient oakwoods dominated by pedunculate oak (*Quercus robur*) and
      Pyrenean oak (*Quercus pyrenaica*), notably throughout the valleys of Ramiscal, Peneda, Gerês, and
      Beredo. The old-growth stands of Albergaria and Cabril are preserved with remarkable integrity. Higher
      up, trees thin out and low scrub of gorse and heathers, blanketing 74 % of the park, claims the slopes.
      River corridors shelter botanical rarities such as the Macaronesian chain fern (*Woodwardia radicans*).
      In total, 823 vascular plant taxa have been inventoried, with regional endemics including the Gerês iris
      (*Iris boissieri*) and spurge-laurel (*Thymelaea*). The acidic granite bedrock supports a fascinating
      mosaic of Mediterranean, subtropical, Eurosiberian, and alpine flora.


      Among the park's 235 vertebrate species, 200 are formally protected or threatened. The European roe deer
      serves as the park's mascot, while the [wolf](/especie/canis_lupus/), long hunted as a pastoral predator
      and pushed to the brink of local extirpation, has enjoyed strict legal protection since the late
      twentieth century. While the Portuguese wild ibex vanished into extinction, the Iberian ibex naturally
      recolonized the ridges from Galicia, numbering about one hundred head by 2011. Garranos, ancient
      wild-type ponies of Minho lineage, wander free-range across high pastures showing little fear of humans.
      The fauna also includes [pine marten](/especie/martes_martes/), [wildcat](/especie/felis_silvestris/),
      [red squirrel](/especie/sciurus_vulgaris/), Lataste's and Seoane's vipers, and three threatened bat
      species including the [greater horseshoe bat](/especie/rhinolophus_ferrumequinum/). The gold-striped
      salamander, an endemic amphibian of north-western Iberia, thrives exclusively along cold, pristine
      mountain brooks.


      Avian life encompasses 147 species, concentrated especially across the high plateau of Mourela, where
      golden eagle, red-billed chough, Eurasian eagle-owl, European honey buzzard, and
      [whinchat](/especie/saxicola_rubetra/) are regularly logged. Mourela constitutes the sole breeding
      locality for the whinchat in Portugal.
    visit: >-
      The Portuguese park maintains thirty-nine waymarked hiking routes totalling around 350 kilometres. Among
      long-distance routes are the GR50, the GR34, and the high-level Peneda-Soajo crossing. The transboundary
      reserve can also be explored on foot through an integrated cross-border trail network.


      The Portas do Parque visitor centres provide environmental interpretation and educational programming
      for schools and travel groups. When planning excursions, bear in mind that trekking and wildlife
      watching may require prior permits depending on designated protection zones.


      Among historic villages, Lindoso stands out for its extraordinary cluster of traditional stone
      espigueiros (granaries) beneath a thirteenth-century castle. The park also shelters the ruins of the
      Cistercian monastery of Santa Maria das Júnias, founded in 1147, along with two celebrated pilgrimage
      shrines: the Santuário de Nossa Senhora da Peneda and São Bento da Porta Aberta.
    history: >-
      Human occupation dates back to the Neolithic: dolmens and megalithic burial mounds between 6000 and 3000
      BC dot the landscape around Castro Laboreiro and Mourela. The Geira, the Roman military road connecting
      Bracara Augusta (Braga) to Asturica Augusta (Astorga), traversed the massif, preserving intact paved
      sections along the Homem River, Roman bridges, and milestones.


      Inhabitants of Castro Laboreiro practised transhumance between brandas (high summer hamlets, inhabited
      from Easter to Christmas) and inverneiras (winter villages in sheltered valley bottoms). In 1970 the
      construction of the Vilarinho das Furnas dam flooded the ancestral community of the same name; during
      dry years its stone masonry emerges eerily from the reservoir. On mountain slopes survive several
      traditional fojos do lobo, medieval V-shaped stone walls designed as wolf-trapping corrals.


      Since 1997 the national park has been paired with Galicia's Baixa Limia–Serra do Xurés Natural Park to
      create the Gerês-Xurés Transboundary Park. UNESCO recognized the area as a transboundary biosphere
      reserve in May 2009, spanning 267,958 hectares of protected landscapes across Galicia and Northern
      Portugal. Wildfires represent a persistent ecological threat: between 2000 and 2012 alone, 1,098
      wildfire events scorched 31,901 hectares.
    before: >-
      Check regulations with the ICNF (Institute for Nature Conservation and Forests) before entering strict
      reserve areas, as certain mountain activities require prior authorization.
    around: >-
      While possessing no immediate atlas neighbours, it shares with other rugged montane havens species like
      the Eurasian eagle-owl, golden eagle, and pine marten: [Els Ports Natural
      Park](/lugar/parc-natural-dels-ports/), [Sierra Nevada National and Natural
      Park](/lugar/parque-nacional-y-natural-de-sierra-nevada/), and [Retezat National
      Park](/lugar/parcul-national-retezat---masivul-muntos/).
  fr:
    intro: >-
      Il pleut ici plus que dans presque toute autre région du Portugal, et la nature en porte l'empreinte.
      Les cimes du Gerês et de la Peneda arrêtent l'air humide océanique pour le restituer sous forme de
      cascades impétueuses, de torrents et de chênaies luxuriantes : jusqu'à 3 200 millimètres de pluie par an
      sur les sommets et plus de 130 jours pluvieux. Le parc national da Peneda-Gerês, unique parc national du
      Portugal, a été créé en mai 1971 et forme avec le parc naturel galicien Baixa Limia–Serra do Xurés une
      réserve de biosphère transfrontalière d'exception.
    landscape: >-
      Le parc tire son identité de deux massifs plutoniques majeurs : la Serra da Peneda et la Serra do Gerês.
      Avec la Serra Amarela et la Serra do Soajo, ils composent les plus hauts reliefs : Gerês (1 545 m),
      Altar dos Cabrões (1 538 m), Soajo (1 430 m), Amarela (1 350 m) et Peneda (1 340 m). Entre ces sommets
      s'évase un colossal amphithéâtre façonné par les poussées tectoniques, le vent et les eaux.


      Le granite est né lors de la collision varisque qui rattacha la péninsule ibérique au continent
      européen, il y a entre 380 et 275 millions d'années ; l'intrusion la plus ancienne, dans l'Amarela,
      remonte à 310 millions d'années. Les glaciers du Pléistocène ont ensuite sculpté les hauts reliefs. Si
      les glaces ont disparu, demeurent de splendides auges glaciaires en U, des cordons morainiques et des
      dalles rocheuses polies dans la Peneda, le Soajo et le Gerês. Les filons granitiques ont fait l'objet
      d'exploitations d'étain, tungstène, molybdène et or dans les mines désormais abandonnées de Carris et
      Borrageiro.


      L'eau imprègne tout le territoire. Le Minho, le Lima et le Cávado drainent les versants du parc, les
      cascades dévalent les ravins et les retenues hydroélectriques d'Alto Rabagão, Paradela, Caniçada,
      Vilarinho da Furna et Lindoso noient les fonds de vallées.
    wildlife: >-
      Dans les vallées humides s'épanouissent des chênaies atlantiques de chêne pédonculé et chêne tauzin,
      remarquables dans les vallées de Ramiscal, Peneda, Gerês et Beredo. Les forêts d'Albergaria et de Cabril
      figurent parmi les plus intactes. Plus haut, le couvert arboré cède le pas à de vastes landes d'ajoncs
      et de bruyères qui recouvrent 74 % du parc. Au bord des cours d'eau subsistent des fougères relictuelles
      comme *Woodwardia radicans*. Au total, 823 taxons de plantes vasculaires sont recensés, parmi lesquels
      des endémiques comme l'iris du Gerês (*Iris boissieri*) et le daphné d'Espagne (*Thymelaea*). Le socle
      granitique réunit une flore aux affinités méditerranéennes, subtropicales, eurosibériennes et alpines.


      Sur 235 espèces de vertébrés, 200 sont menacées ou protégées. Le chevreuil est l'animal symbole du parc,
      tandis que le [loup gris](/especie/canis_lupus/), autrefois pourchassé et au bord de la disparition,
      bénéficie d'une protection légale depuis la fin du XXe siècle. Le bouquetin du Portugal s'est éteint,
      mais le bouquetin ibérique est revenu naturellement de Galice, dénombrant une centaine d'individus en
      2011. Les garranos, petits chevaux rustiques du Minho, vivent en hardes semi-sauvages peu farouches. La
      faune compte aussi la [martre des pins](/especie/martes_martes/), le [chat
      forestier](/especie/felis_silvestris/), l'[écureuil roux](/especie/sciurus_vulgaris/), les vipères de
      Lataste et de Seoane, et trois chauves-souris vulnérables dont le [grand
      rhinolophe](/especie/rhinolophus_ferrumequinum/). Le chioglosse portugais, amphibien endémique du
      nord-ouest ibérique, requiert des torrents purs et hyper-oxygénés.


      L'avifaune totalise 147 espèces, principalement sur le haut plateau de Mourela, avec la présence de
      l'aigle royal, du crave à bec rouge, du grand-duc, de la bondrée apivore et du [tarier des
      prés](/especie/saxicola_rubetra/). Mourela représente l'unique site de nidification du tarier des prés
      au Portugal.
    visit: >-
      Le versant portugais offre trente-neuf itinéraires balisés totalisant environ 350 kilomètres. Parmi les
      grandes randonnées figurent le GR50, le GR34 et la traversée Peneda-Soajo. La réserve transfrontalière
      s'explore également grâce à un réseau interconnecté de sentiers transfrontaliers.


      Les Portas do Parque dispensent des programmes d'éducation environnementale aux écoles et aux visiteurs.
      Lors de votre séjour, gardez à l'esprit que la randonnée et l'observation de la faune peuvent requérir
      une autorisation selon le zonage du parc.


      Côté patrimoine bâti, Lindoso s'illustre par son ensemble exceptionnel d'*espigueiros* (greniers à
      grains sur piliers) dominé par un château du XIIIe siècle. Le parc abrite également les ruines du
      monastère de Santa Maria das Júnias, édifié en 1147, ainsi que deux hauts lieux de dévotion : le
      sanctuaire de Nossa Senhora da Peneda et celui de São Bento da Porta Aberta.
    history: >-
      Les premiers vestiges humains remontent à une période comprise entre 6000 et 3000 av. J.-C. : dolmens et
      tumulus mégalithiques disséminés vers Castro Laboreiro et Mourela. La Geira, voie romaine reliant Braga
      à Astorga, traversait le massif, conservant ponts, dalles antiques et bornes milliaires le long du rio
      Homem.


      Les communautés de Castro Laboreiro vivaient de Pâques à Noël dans les *brandas* d'altitude, passant
      l'hiver dans les *inverneiras* abritées des vallées. En 1970, la mise en eau du barrage sur le rio Homem
      submergea le village de Vilarinho das Furnas ; par temps de sécheresse, ses ruines réapparaissent. Sur
      les versants subsistent des *fojos do lobo*, pièges de pierre médiévaux en V destinés à capturer les
      loups.


      Depuis 1997, le parc s'associe au parc galicien Baixa Limia–Serra do Xurés pour former le parc
      transfrontalier Gerês-Xurés. L'UNESCO a consacré la réserve de biosphère en mai 2009, couvrant 267 958
      hectares d'espaces protégés entre Galice et Région Nord. Les feux de forêt constituent une menace
      constante : entre 2000 et 2012 ce sont 1 098 incendies ont ravagé 31 901 hectares.
    before: >-
      Renseignez-vous auprès de l'ICNF sur la réglementation applicable, certaines zones de réserve intégrale
      nécessitant une autorisation préalable.
    around: >-
      Isolé dans l'atlas, le massif partage avec d'autres grands parcs de montagne des espèces comme le
      grand-duc, l'aigle royal et la martre : le [Parc naturel des Ports](/lugar/parc-natural-dels-ports/), le
      [Parc national et naturel de Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/) et le
      [Parc national Retezat](/lugar/parcul-national-retezat---masivul-muntos/).
  de:
    intro: >-
      Hier regnet es mehr als fast überall sonst in Portugal. Die Granitkämme von Gerês und Peneda stauen die
      feuchten atlantischen Luftmassen und verwandeln sie in tosende Kaskaden, Bergbäche und dichte
      Eichenwälder: bis zu 3.200 Millimeter Jahresniederschlag auf den Höhen und mehr als 130 Regentage. Der
      Nationalpark Peneda-Gerês, Portugals einziger Nationalpark, wurde im Mai 1971 gegründet und bildet
      gemeinsam mit dem galicischen Naturpark Baixa Limia–Serra do Xurés ein grenzüberschreitendes
      Biosphärenreservat.
    landscape: >-
      Der Name des Schutzgebiets rührt von zwei massiven Granitgebirgen her: der Serra da Peneda und der Serra
      do Gerês. Zusammen mit der Serra Amarela und der Serra do Soajo tragen sie die höchsten Gipfel: Gerês
      (1.545 m), Altar dos Cabrões (1.538 m), Soajo (1.430 m), Amarela (1.350 m) und Peneda (1.340 m).
      Dazwischen öffnet sich ein weiträumiges Amphitheater, geformt von Tektonik, Wind und Wasser.


      Das Granitgestein entstand während der variszischen Gebirgsbildung vor 380 bis 275 Millionen Jahren, als
      die Iberische Halbinsel mit dem Kontinent verschmolz; die ältesten Plutone in der Amarela sind 310
      Millionen Jahre alt. Später folgten die pleistozänen Gletscher. Zwar ist das Eis geschmolzen, doch
      U-förmige Trogtäler, Moränenwälle und glattgeschliffene Granitrundhöcker prägen Peneda, Soajo und Gerês.
      Aus Erzgängen wurden früher in den heute stillgelegten Gruben von Carris und Borrageiro Zinn, Wolfram,
      Molybdän und Gold abgebaut.


      Das Element Wasser bestimmt die Landschaft. Die Flüsse Minho, Lima und Cávado entwässern das
      Schutzgebiet, Bäche stürzen über Granitwände, und die Stauseen Alto Rabagão, Paradela, Caniçada,
      Vilarinho da Furna und Lindoso fluten tiefe Täler.
    wildlife: >-
      In den luftfeuchten Tälern stocken atlantische Eichenwälder aus Stieleiche und Pyrenäen-Eiche, besonders
      eindrucksvoll in den Tälern von Ramiscal, Peneda, Gerês und Beredo. Die Wälder von Albergaria und Cabril
      sind herausragend erhalten. Oberhalb lichtet sich der Baumbewuchs, und Zwergstrauchheiden aus
      Stechginster und Heidekraut, die 74 % des Parks einnehmen, dominieren das Bild. Entlang der Bäche
      wurzeln Reliktfarne wie *Woodwardia radicans*. Insgesamt wurden 823 Gefässpflanzensippen erfasst,
      darunter Endemiten wie die Gerês-Schwertlilie (*Iris boissieri*) und Seidelbastgewächse (*Thymelaea*).
      Der Granitboden vereint mediterrane, subtropische, mitteleuropäische und alpine Florenelemente.


      Unter den 235 Wirbeltierarten sind 200 geschützt oder gefährdet. Das Reh gilt als Wappentier des Parks,
      während der [Wolf](/especie/canis_lupus/), lange Zeit verfolgt, seit dem ausgehenden zwanzigsten
      Jahrhundert streng geschützt ist. Der portugiesische Steinbock starb aus, doch der Iberiensteinbock
      wanderte selbstständig aus Galicien wieder ein und zählte 2011 rund hundert Tiere. Garranos, die
      urwüchsigen Ponys des Minho, weiden freilebend auf den Hochebenen. Zudem leben hier
      [Baummarder](/especie/martes_martes/), [Wildkatze](/especie/felis_silvestris/),
      [Eichhörnchen](/especie/sciurus_vulgaris/), Vipern sowie drei gefährdete Fledermausarten einschliesslich
      der [Grossen Hufeisennase](/especie/rhinolophus_ferrumequinum/). Der Goldstreifen-Salamander, endemisch
      im Nordwesten der Iberischen Halbinsel, benötigt kühle, sauerstoffreiche Bergbäche.


      Die Vogelwelt umfasst 147 Arten, vor allem auf der Mourela-Hochebene, darunter Steinadler, Alpenkrähe,
      Uhu, Wespenbussard und das [Braunkehlchen](/especie/saxicola_rubetra/). Mourela bildet den einzigen
      Brutplatz des Braunkehlchens in Portugal.
    visit: >-
      Der portugiesische Parkteil bietet neununddreissig markierte Wanderrouten mit zusammen rund 350
      Kilometern Länge. Zu den Fernwanderwegen gehören die GR50, die GR34 und die Durchquerung Peneda-Soajo.
      Das grenzüberschreitende Reservat lässt sich über ein verbundenes Wegenetz erwandern.


      Die Portas do Parque informieren über Geologie und Naturhaushalt für Reisende und Schulklassen. Beachte
      bei der Tourenplanung, dass Wanderungen und Naturbeobachtungen je nach Schutzzone einer vorherigen
      Genehmigung bedürfen können.


      Kulturell ragt Lindoso mit der grössten Ansammlung traditioneller *Espigueiros* (steinerne Maisspeicher)
      unterhalb einer Burg aus dem dreizehnten Jahrhundert heraus. Zudem finden sich im Park die Ruinen des
      Zisterzienserklosters Santa Maria das Júnias aus dem Jahr 1147 sowie zwei bedeutende Wallfahrtsorte:
      Nossa Senhora da Peneda und São Bento da Porta Aberta.
    history: >-
      Menschliche Spuren reichen bis in die Jungsteinzeit zurück: Dolmen und Hünengräber aus der Zeit zwischen
      6000 und 3000 v. Chr. verteilen sich bei Castro Laboreiro und Mourela. Die Geira, die römische
      Militärstrasse von Braga nach Astorga, querte das Gebirge; antike Pflasterstrecken, Steinbrücken und
      Meilensteine säumen den Rio Homem.


      Die Bewohner von Castro Laboreiro zogen von Ostern bis Weihnachten in die hochgelegenen *Brandas* und
      verbrachten den Winter in den milderen *Inverneiras* des Tals. 1970 versank das Dorf Vilarinho das
      Furnas im Stausee des Rio Homem; in Dürrejahren ragen die Mauern aus den Fluten. An Berghängen zeugen
      *Fojos do lobo*, V-förmige Wolfsfangmauern aus dem Mittelalter, von historischer Raubtierjagd.


      Seit 1997 bilden beide Schutzgebiete den grenzüberschreitenden Park Gerês-Xurés. Die UNESCO zeichnete
      das Areal im Mai 2009 als Biosphärenreservat mit 267.958 Hektar Fläche in Galicien und Nordportugal aus.
      Waldbrände bleiben eine grosse Gefahr: Zwischen 2000 und 2012 vernichteten 1.098 Brände insgesamt 31.901
      Hektar Land.
    before: >-
      Erkundige dich beim ICNF über Verhaltensregeln und Schutzbestimmungen, da manche Kernzonen
      genehmigungspflichtig sind.
    around: >-
      Im Atlas isoliert gelegen, teilt das Massiv mit anderen alpinen Bergparks Arten wie Uhu, Steinadler und
      Baummarder: dem [Naturpark Els Ports](/lugar/parc-natural-dels-ports/), dem [National- und Naturpark
      Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/) und dem [Nationalpark
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/).
  it:
    intro: >-
      Piove qui più che in quasi qualsiasi altro angolo del Portogallo, e la vegetazione lo testimonia. Le
      vette del Gerês e della Peneda bloccano le correnti oceaniche cariche di umidità e le trasformano in
      cascate impetuose, torrenti montani e querceti: fino a 3.200 millimetri di pioggia annui sulle creste e
      oltre 130 giornate piovose. Il Parco Nazionale da Peneda-Gerês, l'unico parco nazionale del Portogallo,
      fu istituito nel maggio 1971 e assieme al parco galiziano Baixa Limia–Serra do Xurés forma una preziosa
      riserva della biosfera transfrontaliera.
    landscape: >-
      Il toponimo del parco scaturisce dai suoi due massicci granitici: la Serra da Peneda e la Serra do
      Gerês. Insieme alla Serra Amarela e alla Serra do Soajo delineano le vette dominanti: Gerês (1.545 m),
      Altar dos Cabrões (1.538 m), Soajo (1.430 m), Amarela (1.350 m) e Peneda (1.340 m). Tra di esse si
      estende un grandioso anfiteatro scolpito dalla tettonica, dal vento e dal flusso delle acque.


      Il granito si generò durante la collisione continentale ercinica che saldò la penisola iberica al
      continente europeo, tra 380 e 275 milioni di anni fa; il plutone più antico, nella Amarela, risale a 310
      milioni di anni. Più tardi giunsero i ghiacciai del Pleistocene. Sebbene i ghiacci si siano fusi,
      permangono valli a U, cordoni morenici e superfici di granito levigato nella Peneda, nel Soajo e nel
      Gerês. Dai filoni minerari sono stati estratti stagno, tungsteno, molibdeno e oro nelle miniere dismesse
      di Carris e Borrageiro.


      L'acqua domina l'intero territorio. I fiumi Minho, Lima e Cávado drenano i rilievi del parco, ruscelli e
      cascate scendono dai versanti e i bacini artificiali di Alto Rabagão, Paradela, Caniçada, Vilarinho da
      Furna e Lindoso sommergono i fondovalle.
    wildlife: >-
      Nelle forre umide dominano i querceti di farnia e rovere dei Pirenei, specialmente nelle valli di
      Ramiscal, Peneda, Gerês e Beredo. I boschi vetusti di Albergaria e Cabril presentano una conservazione
      impeccabile. Salendo di quota la macchia di ginestre e brughi, che ricopre il 74 % del parco, prende il
      sopravvento. Lungo i corsi d'acqua allignano felci rare come *Woodwardia radicans*. Nel complesso sono
      censiti 823 taxa di piante vascolari, con endemismi tra cui il giaggiolo del Gerês (*Iris boissieri*) e
      la timelea (*Thymelaea*). Il substrato granitico accoglie elementi floristici mediterranei,
      subtropicali, eurosiberiani e alpini.


      Tra le 235 specie di vertebrati, 200 risultano minacciate o protette. Il capriolo è l'emblema del parco,
      mentre il [lupo](/especie/canis_lupus/), a lungo perseguitato e quasi estinto, è protetto rigorosamente
      dalla legge dalla fine del XX secolo. Lo stambecco portoghese si è estinto, ma lo stambecco iberico è
      ritornato spontaneamente dalla Galizia, arrivando a circa cento capi nel 2011. I garranos, rustici
      cavalli autoctoni del Minho, vivono bradi sui pianori d'alta quota senza temere l'uomo. Si segnalano
      inoltre [martora](/especie/martes_martes/), [gatto selvatico](/especie/felis_silvestris/), [scoiattolo
      comune](/especie/sciurus_vulgaris/), vipere e tre pipistrelli minacciati tra cui il [ferro di cavallo
      maggiore](/especie/rhinolophus_ferrumequinum/). La salamandra striata dorata, endemismo del nord-ovest
      iberico, vive solo in ruscelli limpidi e ben ossigenati.


      L'avifauna conta 147 specie, concentrate sul plateau di Mourela, dove compaiono aquila reale, gracchio
      corallino, gufo reale, falco pecchiaiolo e lo [stiaccino](/especie/saxicola_rubetra/). Mourela
      rappresenta l'unico sito di nidificazione dello stiaccino in Portogallo.
    visit: >-
      Il settore portoghese comprende trentanove itinerari segnalati per circa 350 chilometri totali. Tra i
      percorsi di lunga percorrenza figurano il GR50, il GR34 e la traversata Peneda-Soajo. La riserva
      transfrontaliera si esplora anche attraverso una rete integrata di sentieri internazionali.


      Le Portas do Parque offrono laboratori didattici e percorsi informativi per gruppi e scolaresche.
      Durante la visita, tieni presente che l'escursionismo e l'osservazione faunistica possono richiedere
      permessi specifici a seconda della zona di riserva.


      Tra gli insediamenti storici, Lindoso risalta per la concentrazione monumentale di *espigueiros* (granai
      tradizionali in granito) dominati da un castello del XIII secolo. Nel parco si trovano anche i resti del
      monastero cistercense di Santa Maria das Júnias, sorto nel 1147, e due venerati santuari mariani: Nossa
      Senhora da Peneda e São Bento da Porta Aberta.
    history: >-
      I segni antropici più antichi risalgono al periodo tra il 6000 e il 3000 a.C.: dolmen e tumuli
      megalitici nei dintorni di Castro Laboreiro e Mourela. La Geira, la strada militare romana che collegava
      Braga ad Astorga, valicava la montagna, conservando selciati, ponti e pietre miliari lungo il rio Homem.


      Le popolazioni di Castro Laboreiro praticavano la transumanza tra le *brandas* (baite d'alpeggio vissute
      da Pasqua a Natale) e le *inverneiras* invernali nel fondovalle. Nel 1970 la diga sul fiume Homem
      sommerse il borgo di Vilarinho das Furnas; negli anni siccitosi le rovine affiorano dall'acqua. Sui
      versanti sopravvivono i *fojos do lobo*, trappole murarie a V erette nel Medioevo per catturare i lupi.


      Dal 1997 il parco forma assieme al galiziano Baixa Limia–Serra do Xurés il Parco Transfrontaliero
      Gerês-Xurés. L'UNESCO ha istituito la riserva della biosfera nel maggio 2009, tutelando 267.958 ettari
      tra Galizia e Regione Nord. Gli incendi boschivi costituiscono una minaccia persistente: tra il 2000 e
      il 2012 si sono contati 1.098 roghi che hanno percorso 31.901 ettari.
    before: >-
      Verifica con l'ICNF le norme di fruizione, poiché le zone a tutela integrale richiedono autorizzazioni
      formali.
    around: >-
      Isolato nel contesto dell'atlas, condivide con altri massicci montuosi specie come gufo reale, aquila
      reale e martora: il [Parco Naturale dels Ports](/lugar/parc-natural-dels-ports/), il [Parco Nazionale e
      Naturale della Sierra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/) e il [Parco Nazionale
      Retezat](/lugar/parcul-national-retezat---masivul-muntos/).
  pt:
    intro: >-
      Chove mais aqui que em quase qualquer outro recanto de Portugal, e a paisagem espelha-o. As serras do
      Gerês e da Peneda barram o ar húmido atlântico, convertendo-o em cascatas impetuosas, ribeiros
      torrenciais e carvalhais luxuriantes: até 3.200 milímetros de precipitação anual nas cristas e mais de
      130 dias chuvosos. O Parque Nacional da Peneda-Gerês, o único parque nacional de Portugal, foi criado em
      maio de 1971 e, a par do parque galego Baixa Limia–Serra do Xurés, dá corpo a uma reserva da biosfera
      transfronteiriça de valor ímpar.
    landscape: >-
      A designação do parque provém dos seus dois grandes maciços de granito: a Serra da Peneda e a Serra do
      Gerês. Em conjunto com a Serra Amarela e a Serra do Soajo erguem as cotas culminantes: Gerês (1.545 m),
      Altar dos Cabrões (1.538 m), Soajo (1.430 m), Amarela (1.350 m) e Peneda (1.340 m). Entre eles rasga-se
      um vasto anfiteatro modelado pela orogenia, vento e águas.


      O granito cristalizou durante a colisão continental hercínica que uniu a Península Ibérica ao continente
      europeu, há entre 380 e 275 milhões de anos; o plutão mais arcaico, na Amarela, conta 310 milhões de
      anos. Mais tarde atuaram os glaciares plistocénicos. Embora o gelo tenha desaparecido, subsistem vales
      em U, moreias e superfícies polidas na Peneda, Soajo e Gerês. Dos filões minerais explorou-se estanho,
      volfrâmio, molibdénio e ouro nas minas desativadas de Carris e Borrageiro.


      A água rege o território. Os rios Minho, Lima e Cávado drenam as vertentes do parque, ribeiros e
      cascatas precipitam-se pelas encostas, e as albufeiras do Alto Rabagão, Paradela, Caniçada, Vilarinho da
      Furna e Lindoso represam os vales.
    wildlife: >-
      Nos vales abrigados predominam carvalhais de carvalho-alvarinho e carvalho-negral, com destaque para os
      vales do Ramiscal, Peneda, Gerês e Beredo. As matas da Albergaria e do Cabril conservam-se de forma
      exemplar. Nas cotas altas a floresta rareia e o mato de tojos e urzes, cobrindo 74 % do parque, assume a
      paisagem. Pelas margens fluviais refugiam-se fetos raros como *Woodwardia radicans*. Registam-se 823
      táxones de plantas vasculares, incluindo endemismos como o lírio-do-gerês (*Iris boissieri*) e a estruga
      (*Thymelaea*). O solo granítico associa flora mediterrânica, subtropical, eurosiberiana e alpina.


      Entre as 235 espécies de vertebrados, 200 encontram-se ameaçadas ou protegidas. O corço é a figura
      heráldica do parque, e o [lobo](/especie/canis_lupus/), outrora combatido e quase extinto pela caça,
      beneficia de proteção legal estrita desde finais do século XX. O cabrão-do-gerês extinguiu-se, mas a
      cabra-montês recolonizou a serra a partir da Galiza, somando cerca de cem exemplares em 2011. Os
      garranos, cavalos bravios do Minho, vivem em manadas livres sem receio dos humanos. Ocorrem ainda a
      [marta](/especie/martes_martes/), o [gato-bravo](/especie/felis_silvestris/), o
      [esquilo-vermelho](/especie/sciurus_vulgaris/), víboras e três morcegos ameaçados, incluindo o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/). A salamandra-lusitânica, endémica do
      noroeste ibérico, requer ribeiros límpidos e bem oxigenados.


      A avifauna soma 147 espécies, com destaque para o planalto da Mourela, registando-se a águia-real, o
      gralha-de-bico-vermelho, o bufo-real, o bútio-vespeiro e o
      [cartaxo-nortenho](/especie/saxicola_rubetra/). A Mourela representa o único local de nidificação do
      cartaxo-nortenho em Portugal.
    visit: >-
      A vertente portuguesa disponibiliza trinta e nove trilhos assinalados, totalizando cerca de 350
      quilómetros. Entre os percursos de longo curso salientam-se a GR50, a GR34 e a travessia Peneda-Soajo. A
      reserva transfronteiriça pode igualmente ser percorrida através de uma rede de percursos pedestres
      transfronteiriços.


      As Portas do Parque promovem ações pedagógicas e acolhimento para escolas e visitantes. Planeia a visita
      considerando que caminhadas e observação de fauna podem carecer de autorização consoante o nível de
      proteção da zona.


      Nas povoações rurais, Lindoso sobressai pelo maior conjunto de espigueiros tradicionais da Península
      Ibérica sob a tutela de um castelo do século XIII. No parque erguem-se ainda as ruínas do mosteiro de
      Santa Maria das Júnias, edificado em 1147, e dois centros de peregrinação: o Santuário de Nossa Senhora
      da Peneda e o de São Bento da Porta Aberta.
    history: >-
      Os vestígios humanos mais arcaicos balizam-se entre 6000 e 3000 a. C.: antas e mamoas megalíticas em
      Castro Laboreiro e Mourela. A Geira, a via militar romana que ligava Braga a Astorga, sulcava a
      montanha, subsistindo calçadas originais junto ao rio Homem, pontes e marcos miliários.


      As comunidades de Castro Laboreiro alternavam entre as brandas (aldeamentos de verão habitados da Páscoa
      ao Natal) e as inverneiras de vale. Em 1970 a albufeira do rio Homem submergiu a aldeia comunitária de
      Vilarinho das Furnas; em períodos de seca as ruínas reaparecem. Pelas vertentes persistem fojos do lobo,
      muros de pedra medievais em V concebidos para captura de alcateias.


      Desde 1997 o parque nacional integra com o galego Baixa Limia–Serra do Xurés o Parque Transfronteiriço
      Gerês-Xurés. A UNESCO chancelou a reserva da biosfera em maio de 2009, com 267.958 hectares protegidos
      entre a Galiza e a Região Norte. Os incêndios florestais são uma ameaça constante: entre 2000 e 2012
      registaram-se 1.098 fogos que consumiram 31.901 hectares.
    before: >-
      Confirma previamente junto do ICNF os regulamentos da área que pretendes percorrer, dado que várias
      atividades em áreas de proteção parcial ou total exigem autorização.
    around: >-
      No atlas não conta com reservas contíguas, partilhando com outros maciços montanhosos espécies como o
      bufo-real, a águia-real e a marta: o [Parque Natural dels Ports](/lugar/parc-natural-dels-ports/), o
      [Parque Nacional e Natural da Serra Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/) e o
      [Parque Nacional de Retezat](/lugar/parcul-national-retezat---masivul-muntos/).
