resumen:
  es: >-
    El único Parque Nacional de Portugal unido al Parque Natural gallegos del Xurés, constituyendo una reserva
    transfronteriza de bloques graníticos y manadas de caballos garranos libres.
  en: >-
    Portugal's sole National Park joined with Galicia's Serra do Xurés Natural Park, forming a transboundary
    reserve of granite monoliths and herds of free-roaming Garrano horses.
  fr: >-
    L'unique parc national du Portugal uni au parc naturel galicien du Xurés, formant une réserve
    transfrontalière de chaos granitiques et de garranos en liberté.
  de: >-
    Portugals einziger Nationalpark, vereint mit dem galicischen Naturpark Xurés zu einem
    grenzüberschreitenden Reservat aus Granitgipfeln und wilden Garrano-Pferden.
  it: >-
    L'unico Parco Nazionale del Portogallo unito al Parco Naturale galiziano dello Xurés, formando una riserva
    transfrontaliera di blocchi granitici e mandrie di cavalli garranos bradi.
  pt: >-
    O único Parque Nacional de Portugal unido ao Parque Natural galego do Xurés, constituindo uma reserva
    transfronteiriça de blocos graníticos e manadas de garranos livres.
unico:
  es: >-
    Es el único parque nacional de Portugal, y lo comparte con Galicia para formar la Reserva de la Biosfera
    transfronteriza Gerês-Xurés.
  en: >-
    It is the only national park in Portugal, shared across the border with Galicia to form the UNESCO
    Gerês-Xurés Transboundary Biosphere Reserve.
  fr: >-
    C'est l'unique parc national du Portugal, partagé par-delà la frontière avec la Galice pour former la
    réserve de biosphère transfrontière UNESCO Gerês-Xurés.
  de: >-
    Er ist Portugals einziger Nationalpark, der zusammen mit Galicien das grenzüberschreitende
    UNESCO-Biosphärenreservat Gerês-Xurés bildet.
  it: >-
    È l'unico parco nazionale del Portogallo, condiviso oltreconfine con la Galizia per formare la Riserva
    della Biosfera transfrontaliera UNESCO Gerês-Xurés.
  pt: >-
    É o único parque nacional de Portugal, e partilha-o com a Galiza para formar a Reserva da Biosfera
    transfronteiriça Gerês-Xurés da UNESCO.
