resumen:
  es: >-
    El bosque virgen de haya y abeto mejor conservado del sudeste de Europa, con árboles de más de 300 años y
    la cascada Skakavac.
  en: >-
    The best-preserved beech and fir primeval forest in Southeastern Europe, with trees over 300 years old and
    the Skakavac waterfall.
  fr: >-
    La forêt primaire de hêtres et de sapins la mieux préservée d'Europe du Sud-Est, abritant des arbres de
    plus de 300 ans et la cascade de Skakavac.
  de: >-
    Der am besten erhaltene Buchen- und Tannen-Urwald Südosteuropas mit über 300 Jahre alten Bäumen und dem
    Skakavac-Wasserfall.
  it: >-
    La foresta primordiale di faggio e abete bianco meglio conservata dell'Europa sud-orientale, con alberi
    ultracentenari di oltre 300 anni e la cascata Skakavac.
  pt: >-
    O bosque virgem de faia e abeto-falso mais bem conservado do sudeste da Europa, com árvores de mais de 300
    anos e a cascata de Skakavac.
unico:
  es: >-
    Un bosque primario de haya y abeto que lleva décadas apartado de la gestión forestal, con una cascada de
    unos 75 metros en su arroyo.
  en: >-
    A primary beech and fir forest that has remained excluded from forestry management for decades, featuring
    a waterfall of about 75 metres along its stream.
  fr: >-
    Une forêt primaire de hêtres et de sapins préservée de toute exploitation sylvicole depuis des décennies,
    entaillée par une cascade d'environ 75 mètres.
  de: >-
    Ein primärer Buchen-Tannen-Wald, der seit Jahrzehnten jeder forstwirtschaftlichen Nutzung entzogen ist,
    mit einem Wasserfall von rund 75 Metern Fallhöhe.
  it: >-
    Una foresta vergine di faggio e abete sottratta da decenni a ogni gestione forestale, solcata da una
    cascata di circa 75 metri d'altezza.
  pt: >-
    Uma floresta primária de faia e abeto-falso afastada há décadas da exploração florestal, exibindo uma
    queda de água com cerca de 75 metros no seu leito.
observaciones:
  es: >-
    El acceso está regulado: los visitantes solo pueden recorrer la reserva por los senderos designados y
    deben permanecer en ellos. La entrada se tramita en el Centro de Información del Parque.
texto:
  es:
    intro: >-
      Los bosques vírgenes no son silenciosos. Cuando muere un árbol, otro nace, y así sigue el ciclo sin que
      nadie intervenga: nacimiento, vida, muerte y renacimiento. Eso es Perućica, un bosque primario de 1.434
      hectáreas al que llaman «el pulmón de Europa», en una cuenca de montaña entre Maglić, Volujak y
      Sniježnica, dentro del Parque Nacional Sutjeska, en República Srpska. Es una reserva natural estricta, y
      en ella la naturaleza sigue su curso sin intervención humana.
    landscape: >-
      La reserva ocupa la cuenca del arroyo Perućica, en un valle entre montañas. Las laderas y paredes
      rocosas que la rodean son de caliza, mientras que el centro es de arenisca ácida y esquisto. Más arriba,
      el hielo dejó su firma: circos, valles glaciares y morrenas. Las partes bajas de Perućica, en cambio,
      quedaron en parte libres de hielo. El agua hizo el resto, porque excavó y encajó la garganta de
      Sutjeska, que organiza el paisaje del entorno. En un relieve de alta montaña, el clima cambia con
      frecuencia en distancias cortas.


      Sobre ese suelo crece el bosque. Entre los 1.000 y los 1.600 metros de altitud, la mayor parte de la
      reserva está cubierta por bosques maduros de haya y abeto, con pícea, arce, olmo y fresno menos
      frecuentes. En la parte alta se protegen además hayedos subalpinos, a veces puros y a veces con arce de
      montaña, junto a pícea subalpina, vegetación de pinos y vegetación herbácea de montaña. En total hay
      registrados más de 170 árboles y arbustos y más de 1.000 plantas herbáceas.


      Y luego está el agua en caída: la cascada Skakavac, que se forma en el arroyo Perućica, dentro del
      propio bosque. Con unos 75 metros de altura, es una de las más altas del país.
    wildlife: >-
      Entre los mamíferos importantes de Perućica están el [oso pardo](/especie/ursus_arctos/), el
      [rebeco](/especie/rupicapra_rupicapra/), el [corzo](/especie/capreolus_capreolus/), el
      [jabalí](/especie/sus_scrofa/), el [lobo](/especie/canis_lupus/), el zorro y el tejón. El gestor añade,
      entre la fauna poco común, el gato montés, el [lince](/especie/lynx_lynx/) y la rata topo.


      Los pájaros carpinteros son otra historia. El gestor destaca nueve especies en el parque, sobre todo en
      la reserva estricta de Perućica, y explica por qué: dependen de árboles viejos, enfermos y muertos.
      Justo lo que un bosque que nadie limpia produce en abundancia.


      La visita guiada se ofrece entre abril y noviembre.
    visit: >-
      Perućica se visita con una caminata guiada que parte del mirador de Dragoš Sedlo, en el paso, y entra en
      el corazón del bosque. Son unos ocho o nueve kilómetros a través de distintos sectores. La excursión
      dura de cuatro a cinco horas, con unas tres de caminata, de dificultad moderada. Por el camino hay
      miradores al borde del bosque con vistas a Perućica, la cascada Skakavac y los macizos de Maglić,
      Volujak, Zelengora y Bioč.


      El Centro de Información del Parque Sutjeska es el punto para tramitar la entrada a Perućica.


      En Tjentište, el conjunto memorial incluye el Museo de la Batalla y la Casa Memorial de la Batalla de
      Sutjeska. El monumento a la batalla se levantó en 1971.
    history: >-
      El Estado separó Perućica de la gestión forestal ordinaria en 1952, como bosque necesario para el
      estudio científico y la educación. En 1954 el área se amplió en 200 hectáreas. El Parque Nacional
      Sutjeska se estableció en 1962 y colinda con el Parque Nacional Durmitor en el ámbito transfronterizo
      regional.


      En el entorno se conservan necrópolis de stećci y vestigios de vías romanas. El plan de gestión de
      Sutjeska para 2025–2035 estuvo en información pública en el Ayuntamiento de Gacko.
    before: >-
      El acceso está regulado: los visitantes solo pueden recorrer la reserva por los senderos designados y
      deben permanecer en ellos. La entrada se tramita en el Centro de Información del Parque.
    around: >-
      El [Park prirode Piva](/lugar/park-prirode-piva/) está pegado a Perućica, y los dos macizos de Durmitor
      quedan a unos veinte kilómetros: el [Nacionalni park Durmitor -
      Masiv](/lugar/nacionalni-park-durmitor---masiv/) y el [Nacionalni park Durmitor - Kanjon
      Tare](/lugar/nacionalni-park-durmitor---kanjon-tare/). Perućica forma parte del [Nacionalni park
      Sutjeska - Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/), y el [Nacionalni park Sutjeska -
      Maglić](/lugar/nacionalni-park-sutjeska---maglic/) queda anidado en su ámbito.


      Entre los bosques primarios afines, el [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) comparte el abeto, la haya y el lince; la [Prašuma
      Lom - Strogi rezervat prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) también. El [Bukovské vrchy
      pralesový komplex - NP Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) y la [Rezervația
      Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) coinciden en la haya, el lince y
      el lobo.
  en:
    intro: >-
      Primeval forests are never silent. When a tree dies, another emerges, and the cycle continues
      uninterrupted without human intervention: birth, life, death, and renewal. This is Perućica, a primary
      forest of 1,434 hectares often referred to as 'the lungs of Europe', nestled in a mountain basin between
      Maglić, Volujak, and Sniježnica, within Sutjeska National Park in Republika Srpska. It is a strict
      nature reserve where nature follows its course untouched by human hands.
    landscape: >-
      The reserve encompasses the basin of the Perućica stream, in a valley framed by mountains. The
      surrounding slopes and rock faces consist of limestone, whereas the central basin features acidic
      sandstone and schist. Higher up, ancient ice left its mark in the form of cirques, glacial valleys, and
      moraines. By contrast, the lower reaches of Perućica remained partially unglaciated. Running water
      shaped the rest, carving and deepening the Sutjeska Gorge, which structures the wider landscape. In this
      high-mountain terrain, the weather shifts rapidly across short distances.


      Upon this terrain grows the forest. Between 1,000 and 1,600 metres of altitude, most of the reserve is
      cloaked in mature beech and fir stands, interspersed with occasional spruce, maple, elm, and ash. The
      upper sector shelters subalpine beech woodlands, occurring as pure stands or blended with sycamore
      maple, alongside subalpine spruce, dwarf pine formations, and alpine grasslands. In total, more than 170
      tree and shrub species and over 1,000 herbaceous plants have been recorded.


      Then there is the plummeting water: the Skakavac waterfall, formed by the Perućica stream right inside
      the forest. Dropping roughly 75 metres, it is among the highest cascades in the country.
    wildlife: >-
      Prominent mammals inhabiting Perućica include the [brown bear](/especie/ursus_arctos/),
      [chamois](/especie/rupicapra_rupicapra/), [roe deer](/especie/capreolus_capreolus/), [wild
      boar](/especie/sus_scrofa/), [grey wolf](/especie/canis_lupus/), red fox, and European badger. Park
      managers also record less common fauna, such as the European wildcat, [Eurasian
      lynx](/especie/lynx_lynx/), and mole rat.


      Woodpeckers represent another chapter altogether. Park authorities highlight nine species across the
      national park, particularly concentrated in the strict reserve of Perućica, explaining that they depend
      strictly on ancient, decaying, and standing dead trees—precisely what an unmanaged forest generates in
      abundance.


      Guided tours operate from April through November.
    visit: >-
      You visit Perućica on a guided hike departing from the Dragoš Sedlo viewpoint at the mountain pass and
      leading deep into the heart of the forest. The route covers around eight or nine kilometres across
      different forest sectors. The outing lasts four to five hours, with roughly three hours of walking at a
      moderate difficulty level. Along the path, scenic viewpoints perched at the forest edge look out over
      Perućica, the Skakavac waterfall, and the massifs of Maglić, Volujak, Zelengora, and Bioč.


      The Sutjeska National Park Information Centre is the designated point to arrange entry to Perućica.


      In Tjentište, the memorial complex includes the Battle Museum and the Sutjeska Battle Memorial House.
      The battle monument itself was erected in 1971.
    history: >-
      The state formally removed Perućica from ordinary commercial forestry in 1952, reserving it for
      scientific research and education. In 1954 the protected perimeter was expanded by 200 hectares.
      Sutjeska National Park was founded in 1962 and borders Durmitor National Park across the regional
      transboundary zone.


      The surrounding area preserves stećci necropolises and traces of ancient Roman roads. The Sutjeska
      management plan for 2025–2035 underwent public consultation at the municipal offices in Gacko.
    before: >-
      Access is strictly regulated: you may only travel through the reserve along designated paths and you
      must stay on them at all times. Entry permits and guides are arranged at the Park Information Centre.
    around: >-
      [Park prirode Piva](/lugar/park-prirode-piva/) directly adjoins Perućica, while two massifs of Durmitor
      lie around twenty kilometres away: [Nacionalni park Durmitor -
      Masiv](/lugar/nacionalni-park-durmitor---masiv/) and [Nacionalni park Durmitor - Kanjon
      Tare](/lugar/nacionalni-park-durmitor---kanjon-tare/). Perućica is part of [Nacionalni park Sutjeska -
      Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/), with [Nacionalni park Sutjeska -
      Maglić](/lugar/nacionalni-park-sutjeska---maglic/) nested within its domain.


      Among related primeval forests, [Codrul Secular Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/)
      shares silver fir, European beech, and Eurasian lynx; [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) shares them as well. [Bukovské vrchy pralesový
      komplex - NP Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) and [Rezervația Codrul
      Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) also share beech, lynx, and wolf.
  fr:
    intro: >-
      Les forêts vierges ne sont pas silencieuses. Lorsqu'un arbre s'effondre, un autre prend racine,
      perpétuant le cycle naturel sans aucune intervention extérieure : naissance, vie, trépas et
      régénération. C'est le sanctuaire de Perućica, une forêt primaire de 1 434 hectares couramment surnommée
      « le poumon de l'Europe », nichée dans un cirque montagneux entre le Maglić, le Volujak et la
      Sniježnica, au cœur du parc national de Sutjeska en République serbe de Bosnie. Classée en réserve
      naturelle intégrale, la nature y déploie sa dynamique spontanée.
    landscape: >-
      La réserve s'étend dans le bassin hydrographique du ruisseau Perućica, au creux d'une vallée d'altitude
      cernée de falaises. Les versants rocheux périphériques sont formés de calcaires massifs, tandis que le
      fond du bassin repose sur des grès acides et des schistes. En altitude, les anciens glaciers ont imprimé
      leur empreinte : cirques glaciaires, vallées suspendues et moraines. Les parties basses de Perućica, en
      revanche, ont largement échappé aux glaciations. L'eau a façonné le relief en creusant les vertigineuses
      gorges de la Sutjeska, qui articulent le paysage régional. Dans un tel relief de haute montagne, les
      microclimats varient abruptement sur de courtes distances.


      Ce socle géologique nourrit la forêt. Entre 1 000 et 1 600 mètres d'altitude, l'essentiel de la réserve
      est recouvert de peuplements matures de hêtres et de sapins pectinés, mêlés d'épicéas, d'érables,
      d'ormes et de frênes plus disséminés. Sur les crêtes supérieures se maintiennent des hêtraies
      subalpines, pures ou associées à l'érable sycomore, ainsi que des pessières subalpines, des formations
      de pins nains et des pelouses d'altitude. Au total, la réserve compte plus de 170 espèces d'arbres et
      d'arbustes et plus de 1 000 plantes herbacées recensées.


      S'y ajoute la chute des eaux : la cascade de Skakavac, générée par le ruisseau Perućica au cœur même de
      la forêt. Dévalant environ 75 mètres de paroi, elle compte parmi les plus hautes chutes du pays.
    wildlife: >-
      Parmi les grands mammifères qui peuplent Perućica figurent l'[ours brun](/especie/ursus_arctos/), le
      [chamois](/especie/rupicapra_rupicapra/), le [chevreuil](/especie/capreolus_capreolus/), le
      [sanglier](/especie/sus_scrofa/), le [loup gris](/especie/canis_lupus/), le renard roux et le blaireau
      d'Eurasie. L'équipe du parc signale également une faune plus discrète, dont le chat forestier, le [lynx
      boréal](/especie/lynx_lynx/) et le rat-taupe.


      Les pics constituent un chapitre tout aussi remarquable. Les gestionnaires recensent neuf espèces de
      pics dans le parc, principalement concentrées dans la réserve intégrale de Perućica, car elles dépendent
      étroitement d'arbres sénescents, dépérissants ou morts : une abondance de bois mort que seule une forêt
      exempte d'exploitation peut prodiguer.


      Les excursions guidées sont organisées d'avril à novembre.
    visit: >-
      Vous visitez Perućica dans le cadre d'une randonnée guidée qui s'élance du belvédère du col de Dragoš
      Sedlo pour pénétrer dans les profondeurs de la forêt. Le circuit totalise environ huit ou neuf
      kilomètres à travers plusieurs ambiances forestières. La sortie requiert de quatre à cinq heures, dont
      environ trois heures de marche effective, d'un niveau de difficulté modéré. En chemin, plusieurs points
      de vue aménagés en lisière dévoilent la canopée de Perućica, le panache de la cascade de Skakavac et les
      crêtes altières du Maglić, du Volujak, de la Zelengora et du Bioč.


      Le centre d'information du parc de Sutjeska est le point de passage obligatoire pour formaliser votre
      autorisation d'accès à Perućica.


      À Tjentište, le mémorial comprend le musée de la Bataille et la maison commémorative de la bataille de
      la Sutjeska. Le monument commémoratif a été érigé en 1971.
    history: >-
      L'État a formellement soustrait Perućica à l'exploitation forestière en 1952 afin de dédier ces massifs
      intacts à la recherche scientifique et à l'éducation. En 1954, le périmètre protégé a été agrandi de 200
      hectares. Le parc national de Sutjeska a été institué en 1962 et s'articule directement avec le parc
      national du Durmitor dans le cadre d'un corridor écologique transfrontalier.


      Les environs immédiats abritent des nécropoles de stećci et des vestiges de voies romaines. Le plan de
      gestion de Sutjeska pour la période 2025–2035 a fait l'objet d'une enquête publique à la mairie de
      Gacko.
    before: >-
      L'accès à la réserve est rigoureusement réglementé : vous ne pouvez parcourir le secteur que sur les
      sentiers balisés et vous devez impérativement y demeurer. La réservation et les billets d'accès
      s'organisent auprès du centre d'accueil du parc.
    around: >-
      Le [Park prirode Piva](/lugar/park-prirode-piva/) jouxte directement Perućica, et les deux secteurs du
      Durmitor s'étendent à environ vingt kilomètres : le [Nacionalni park Durmitor -
      Masiv](/lugar/nacionalni-park-durmitor---masiv/) et le [Nacionalni park Durmitor - Kanjon
      Tare](/lugar/nacionalni-park-durmitor---kanjon-tare/). Perućica fait partie intégrante du [Nacionalni
      park Sutjeska - Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/), et le [Nacionalni park
      Sutjeska - Maglić](/lugar/nacionalni-park-sutjeska---maglic/) se trouve enclavé dans son espace
      montagnard.


      Parmi les massifs primaires apparentés, le [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) partage le sapin blanc, le hêtre commun et le lynx
      boréal ; la [Prašuma Lom - Strogi rezervat prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/)
      présente un cortège forestier similaire. Le [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) et la [Rezervația Codrul Secular
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) abritent également le hêtre, le lynx et le loup.
  de:
    intro: >-
      Urwälder sind niemals still. Fällt ein alter Baumriese um, schlägt ein junger Keimling Wurzeln, und der
      Kreislauf vollzieht sich ungestört ohne fremdes Zutun: Werden, Wachsen, Vergehen und Neuanfang. Das ist
      Perućica, ein Primärwald von 1.434 Hektar Fläche, der oft als «die Lunge Europas» bezeichnet wird. Er
      liegt in einem Bergkessel zwischen den Massiven Maglić, Volujak und Sniježnica im Nationalpark Sutjeska
      in der Republika Srpska. Als strenges Naturreservat überlässt er die Wildnis vollkommen ihrer ureigenen
      Dynamik.
    landscape: >-
      Das Schutzgebiet umfasst das Einzugsgebiet des Perućica-Baches in einem von Felswänden gesäumten
      Hochtal. Die flankierenden Hänge und Felsformationen bestehen aus Kalkstein, während der Talboden von
      sauren Sandsteinen und Schiefern geprägt wird. In den Hochlagen hinterließ das eiszeitliche Eis seine
      Spuren in Form von Karen, Trogtälern und Moränen. Die tieferen Bereiche von Perućica blieben hingegen
      weitgehend eisfrei. Das Wasser tat sein Übriges: Es grub die tiefe Schlucht der Sutjeska in das Gestein,
      die das Landschaftsbild der gesamten Region prägt. In solch ausgeprägtem Hochgebirgsrelief wandelt sich
      das Mikroklima rasch auf kürzester Distanz.


      Auf diesem Boden gedeiht der Urwald. In Höhenlagen zwischen 1.000 und 1.600 Metern wird das Reservat
      überwiegend von urwüchsigen Buchen- und Tannenwäldern bedeckt, durchsetzt mit vereinzelten Fichten,
      Bergahornen, Ulmen und Eschen. In den höchsten Lagen schließen sich subalpine Buchenwälder an, teils
      rein, teils mit Bergahorn durchmischt, flankiert von subalpinen Fichtenbeständen, Bergkiefern und
      alpinen Krummholzzonen. Insgesamt sind über 170 Baum- und Straucharten sowie mehr als 1.000 krautige
      Pflanzen nachgewiesen.


      Ein weiteres Naturdenkmal ist das stürzende Wasser: der Skakavac-Wasserfall, den der Perućica-Bach
      mitten im Wald formt. Mit rund 75 Metern Fallhöhe gehört er zu den höchsten Wasserfällen des Landes.
    wildlife: >-
      Zu den charakteristischen Großsäugern von Perućica zählen [Braunbär](/especie/ursus_arctos/),
      [Gämse](/especie/rupicapra_rupicapra/), [Reh](/especie/capreolus_capreolus/),
      [Wildschwein](/especie/sus_scrofa/), [Wolf](/especie/canis_lupus/), Rotfuchs und Dachs. Die
      Nationalparkverwaltung verzeichnet zudem seltenere Arten wie Wildkatze, [Eurasischen
      Luchs](/especie/lynx_lynx/) und Blindmulle.


      Die Spechte sind ein herausragendes Phänomen. Neun Spechtarten weist die Parkverwaltung im Schutzgebiet
      aus, vor allem im Totalreservat Perućica. Sie erklärt auch den Grund: Spechte sind auf alte, kranke und
      abgestorbene Bäume angewiesen – auf jenes Totholz also, das ein unberührter Urwald in reicher Fülle
      hervorbringt.


      Geführte Touren werden von April bis November angeboten.
    visit: >-
      Du erkundest Perućica auf einer geführten Wanderung, die am Aussichtspunkt Dragoš Sedlo auf dem Pass
      startet und in das Herz des Bergwaldes führt. Die Route erstreckt sich über etwa acht oder neun
      Kilometer durch verschiedene Waldgesellschaften. Die Exkursion beansprucht vier bis fünf Stunden, davon
      rund drei Stunden reine Gehzeit moderater Schwierigkeit. Unterwegs bieten Aussichtsplätze am Waldrand
      weite Blicke auf Perućica, die Gischt des Skakavac-Wasserfalls und die Felsformationen von Maglić,
      Volujak, Zelengora und Bioč.


      Das Informationszentrum des Nationalparks Sutjeska ist die zentrale Anlaufstelle für die Registrierung
      und Buchung der Genehmigung für Perućica.


      In Tjentište umfasst die Gedenkstätte das Museum der Schlacht und das Gedenkhaus der Schlacht an der
      Sutjeska. Das wuchtige Monument zur Schlacht wurde 1971 errichtet.
    history: >-
      Der Staat stellte Perućica 1952 aus der regulären forstwirtschaftlichen Nutzung frei, um die unberührten
      Bestände für Wissenschaft und Forschung zu sichern. 1954 wurde das Schutzgebiet um 200 Hektar erweitert.
      Der Nationalpark Sutjeska wurde 1962 gegründet und schließt grenzüberschreitend an den Nationalpark
      Durmitor an.


      In der Umgebung finden sich historische Stećci-Nekropolen und Trassenreste römischer Wege. Der
      Managementplan für Sutjeska für den Zeitraum 2025–2035 lag im Rathaus von Gacko zur öffentlichen
      Einsichtnahme aus.
    before: >-
      Der Zugang ist streng reglementiert: Du darfst das Reservat ausschließlich auf den ausgewiesenen Pfaden
      und in Begleitung eines Parkführers begehen. Die Genehmigung und Begleitung müssen vorab im
      Besucherzentrum des Nationalparks organisiert werden.
    around: >-
      Der [Park prirode Piva](/lugar/park-prirode-piva/) grenzt direkt an Perućica an, und zwei
      Gebirgsabschnitte des Durmitor liegen rund zwanzig Kilometer entfernt: der [Nacionalni park Durmitor -
      Masiv](/lugar/nacionalni-park-durmitor---masiv/) und der [Nacionalni park Durmitor - Kanjon
      Tare](/lugar/nacionalni-park-durmitor---kanjon-tare/). Perućica gehört organisatorisch zum [Nacionalni
      park Sutjeska - Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/), während der [Nacionalni park
      Sutjeska - Maglić](/lugar/nacionalni-park-sutjeska---maglic/) in unmittelbarer Nachbarschaft eingebettet
      liegt.


      Unter verwandten Urwaldgebieten teilt [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) Tanne, Buche und Luchs; ebenso die [Prašuma Lom -
      Strogi rezervat prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/). Auch der [Bukovské vrchy
      pralesový komplex - NP Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) und die
      [Rezervația Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) weisen dieselbe Trias
      aus Buche, Luchs und Wolf auf.
  it:
    intro: >-
      Le foreste primordiali non sono mai silenziose. Quando un albero muore, un altro germoglia, e il ciclo
      si ripete senza che alcuno intervenga: nascita, vita, morte e rinascita. Questa è Perućica, una foresta
      vergine di 1.434 ettari chiamata comunemente «il polmone d'Europa», adagiata in una conca montana tra i
      massicci di Maglić, Volujak e Sniježnica, nel Parco nazionale Sutjeska in Repubblica Serba. È una
      riserva naturale integrale in cui la natura compie il suo corso senza alcun disturbo umano.
    landscape: >-
      La riserva si sviluppa nel bacino idrografico del torrente Perućica, sul fondo di una valle montana
      cinta da ripide balze rocciose. I versanti e le pareti circostanti sono calcarei, mentre il fondovalle
      presenta arenarie acide e scisti. Più in alto, i ghiacci quaternari hanno lasciato la loro traccia:
      circhi montani, valli glaciali e depositi morenici. La parte basale di Perućica rimase invece in gran
      parte libera dai ghiacci. L'azione dell'acqua ha completato il quadro, scavando la profonda gola della
      Sutjeska che struttura l'intero paesaggio circostante. In un contesto d'alta montagna così aspro, il
      clima varia sensibilmente a brevissima distanza.


      È su questa matrice che prospera la foresta. Tra i 1.000 e i 1.600 metri di altitudine, la maggior parte
      dell'area protetta è occupata da fustaie secolari di faggio e abete bianco, frammiste ad abete rosso,
      acero, olmo e frassino più rari. Nelle fasce sommitali si sviluppano inoltre faggete subalpine, pure o
      miste ad acero di monte, assieme a peccete subalpine, boscaglie di pino montano e pascoli d'alta quota.
      In totale si registrano oltre 170 specie arboree e arbustive e più di 1.000 specie di piante erbacee.


      Vi è poi il fragore dell'acqua: la cascata Skakavac, generata dal torrente Perućica nel cuore stesso del
      bosco. Con circa 75 metri di salto verticale, costituisce una delle cascate più imponenti dell'intero
      paese.
    wildlife: >-
      Tra i grandi mammiferi presenti a Perućica spiccano l'[orso bruno](/especie/ursus_arctos/), il
      [camoscio](/especie/rupicapra_rupicapra/), il [capriolo](/especie/capreolus_capreolus/), il
      [cinghiale](/especie/sus_scrofa/), il [lupo](/especie/canis_lupus/), la volpe e il tasso. L'ente gestore
      rileva inoltre specie faunistiche più elusive, tra cui il gatto selvatico, la [lince
      eurasiatica](/especie/lynx_lynx/) e lo spalace.


      I picchi rappresentano un capitolo a sé. I naturalisti del parco evidenziano nove specie censite
      nell'area protetta, particolarmente abbondanti nella riserva integrale di Perućica, e ne chiariscono la
      ragione: sono uccelli che dipendono strettamente da fusti marcescenti, deperienti e secchi. Proprio ciò
      che una foresta sottratta ai tagli produce con straordinaria generosità.


      Le escursioni guidate vengono effettuate tra aprile e novembre.
    visit: >-
      Puoi visitare Perućica partecipando a un'escursione guidata che si snoda a partire dal belvedere del
      valico di Dragoš Sedlo e scende verso il cuore del bosco vetusto. L'itinerario misura circa otto o nove
      chilometri attraverso diversi comparti forestali. L'uscita richiede da quattro a cinque ore, con circa
      tre ore di cammino effettivo a difficoltà moderata. Lungo il sentiero si incontrano terrazze panoramiche
      al margine del bosco che si aprono su Perućica, sul salto d'acqua di Skakavac e sulle vette di Maglić,
      Volujak, Zelengora e Bioč.


      Il Centro visite del Parco Sutjeska è la sede incaricata di sbrigare i permessi d'ingresso per Perućica.


      A Tjentište, il polo monumentale comprende il Museo della Battaglia e la Casa Memoriale della Battaglia
      della Sutjeska. Il monumento celebrativo fu inaugurato nel 1971.
    history: >-
      Lo Stato escluse Perućica dalla gestione forestale ordinaria nel 1952, destinandola a laboratorio
      permanente per la ricerca scientifica e l'istruzione naturalistica. Nel 1954 l'area protetta fu
      accresciuta di 200 ettari. Il Parco nazionale Sutjeska venne istituito formalmente nel 1962 e confina
      con il Parco nazionale del Durmitor all'interno di un sistema protetto transfrontaliero.


      Nel comprensorio si conservano antiche necropoli di stećci e testimonianze di tracciati romani. Il piano
      di gestione del Parco Sutjeska per il decennio 2025–2035 è stato depositato per le osservazioni
      pubbliche presso il Municipio di Gacko.
    before: >-
      L'ingresso è sottoposto a severa tutela: puoi muoverti nella riserva esclusivamente lungo i tracciati
      autorizzati e devi mantenerti sempre sui sentieri battuti. I permessi si rilasciano al Centro visite del
      Parco.
    around: >-
      Il [Park prirode Piva](/lugar/park-prirode-piva/) è a diretto contatto con Perućica, mentre i due
      settori del massiccio del Durmitor distano circa venti chilometri: il [Nacionalni park Durmitor -
      Masiv](/lugar/nacionalni-park-durmitor---masiv/) e il [Nacionalni park Durmitor - Kanjon
      Tare](/lugar/nacionalni-park-durmitor---kanjon-tare/). Perućica rientra nel comprensorio del [Nacionalni
      park Sutjeska - Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/), mentre il [Nacionalni park
      Sutjeska - Maglić](/lugar/nacionalni-park-sutjeska---maglic/) è incastonato nel suo medesimo rilievo.


      Fra le foreste primigenie affini, il [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) condivide l'abete bianco, il faggio comune e la
      lince; analoga affinità presenta la [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/). Anche il [Bukovské vrchy pralesový komplex - NP
      Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) e la [Rezervația Codrul Secular
      Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) coincidono per la presenza di faggio, lince e
      lupo.
  pt:
    intro: >-
      As florestas virgens não conhecem o silêncio absoluto. Quando tomba uma árvore vetusta, outra desponta
      ao lado, perpetuando o ciclo natural sem qualquer interferência exterior: nascimento, vida, morte e
      renascimento. Esse é o território de Perućica, uma floresta primária de 1.434 hectares frequentemente
      designada como «o pulmão da Europa», situada numa bacia montanhosa entre os maciços de Maglić, Volujak e
      Sniježnica, no Parque Nacional Sutjeska, na República Sérvia. Trata-se de uma reserva natural estrita
      onde a dinâmica ecológica prossegue o seu curso intocada pelo ser humano.
    landscape: >-
      A reserva estende-se pela bacia hidrográfica do ribeiro Perućica, num vale de altitude recortado entre
      cristas de montanha. As encostas rochosas circundantes assentam em calcários, enquanto a calha central é
      dominada por arenitos ácidos e xistos. Nos níveis superiores, o recuo dos glaciares talhou circos, vales
      glaciares e moreias. Pelo contrário, os vales baixos de Perućica escaparam em grande parte à glaciação.
      A força das águas completou a escultura orográfica, escavando a impressionante garganta de Sutjeska, que
      organiza o relevo regional. Num ambiente de alta montanha tão vigoroso, as condições meteorológicas
      alternam depressa em curtas distâncias.


      É sobre este substrato que se ergue a floresta. Entre os 1.000 e os 1.600 metros de altitude, a maior
      fatia da reserva encontra-se povoada por talhões maduros de faia e abeto-falso, pontuados por espécimes
      de abeto-falso, ácer, olmo e freixo mais esparsos. Nos níveis cimeiros preservam-se faias subalpinas, em
      povoamentos puros ou associadas ao ácer-da-montanha, a par de abetos subalpinos, pinhais anões e
      pradarias de montanha. No conjunto da reserva estão catalogadas mais de 170 espécies de árvores e
      arbustos e mais de 1.000 plantas herbáceas.


      Destaca-se ainda o salto de água: a cascata de Skakavac, alimentada pelo ribeiro Perućica no próprio
      coração do arvoredo. Precipitando-se ao longo de cerca de 75 metros de desnível, figura entre as
      cascatas mais imponentes do país.
    wildlife: >-
      Entre os mamíferos emblemáticos de Perućica contam-se o [urso-pardo](/especie/ursus_arctos/), a
      [camurça](/especie/rupicapra_rupicapra/), o [corço](/especie/capreolus_capreolus/), o
      [javali](/especie/sus_scrofa/), o [lobo](/especie/canis_lupus/), a raposa e o texugo. A administração do
      parque regista ainda espécies mais discretas, como o gato-bravo, o
      [lince-euroasiático](/especie/lynx_lynx/) e o rato-toupeira.


      Os pica-paus merecem uma menção de destaque. A equipa do parque assinala nove espécies no território
      protegido, com incidência privilegiada na reserva estrita de Perućica, salientando a razão biológica:
      dependem estritamente de troncos envelhecidos, doentes ou em putrefação. Precisamente a abundância de
      biomassa lenhosa que uma mata virgem não desbastada oferece com profusão.


      As visitas guiadas decorrem entre abril e novembro.
    visit: >-
      Podes visitar Perućica através de uma caminhada guiada que parte do miradouro de Dragoš Sedlo, situado
      no desfiladeiro, para adentrar o núcleo florestal. O percurso soma cerca de oito ou nove quilómetros
      através de diferentes setores ecológicos. A excursão dura de quatro a cinco horas, integrando cerca de
      três horas de marcha efetiva com exigência física moderada. Ao longo da rota surgem pontos de observação
      à orla da floresta com amplas perspetivas sobre a copa de Perućica, o véu de água de Skakavac e os
      maciços escarpados de Maglić, Volujak, Zelengora e Bioč.


      O Centro de Informações do Parque Sutjeska é o ponto de contacto oficial para a obtenção da licença de
      acesso a Perućica.


      Em Tjentište, o conjunto memorialístico engloba o Museu da Batalha e a Casa Memorial da Batalha de
      Sutjeska. O monumento escultórico da batalha foi erigido em 1971.
    history: >-
      O Estado subtraiu Perućica à exploração florestal mercantil em 1952, salvaguardando a mata para a
      investigação científica e propósitos educativos. Em 1954, o polígono classificado foi ampliado em 200
      hectares. O Parque Nacional Sutjeska foi instituído em 1962, estabelecendo continuidade transfronteiriça
      com o Parque Nacional Durmitor.


      Nas imediações preservam-se necrópoles medievais com stećci e vestígios de calçadas romanas. O plano de
      ordenamento e gestão de Sutjeska para 2025–2035 foi submetido a discussão pública nos paços do concelho
      de Gacko.
    before: >-
      O acesso obedece a regras restritas: só podes percorrer a reserva através dos trilhos previamente
      designados e deves manter-te estritamente sobre eles. A permissão de visita e o acompanhamento
      processam-se no Centro de Informações do Parque.
    around: >-
      O [Park prirode Piva](/lugar/park-prirode-piva/) confina diretamente com Perućica, e os dois maciços de
      Durmitor encontram-se a cerca de vinte quilómetros de distância: o [Nacionalni park Durmitor -
      Masiv](/lugar/nacionalni-park-durmitor---masiv/) e o [Nacionalni park Durmitor - Kanjon
      Tare](/lugar/nacionalni-park-durmitor---kanjon-tare/). Perućica integra a área protegida do [Nacionalni
      park Sutjeska - Zelengora](/lugar/nacionalni-park-sutjeska---zelengora/), situando-se o [Nacionalni park
      Sutjeska - Maglić](/lugar/nacionalni-park-sutjeska---maglic/) encaixado no seu próprio perímetro.


      Entre as florestas virgens congéneres, o [Codrul Secular
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) acolhe igualmente o abeto-falso, a faia e o
      lince-euroasiático; a [Prašuma Lom - Strogi rezervat
      prirode](/lugar/prasuma-lom-strogi-rezervat-prirode/) partilha a mesma floresta mista. O [Bukovské vrchy
      pralesový komplex - NP Poloniny](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) e a [Rezervația
      Codrul Secular Slătioara](/lugar/rezervatia-codrul-secular-slatioara/) coincidem igualmente na presença
      da faia, do lince e do lobo.
