resumen:
  es: >-
    El 'Hogar de los Gigantes' en la mitología nórdica, albergando las dos cumbres más altas de Escandinavia
    (Galdhøpiggen 2.469 m y Glittertind) y la legendaria cresta de Besseggen.
  en: >-
    The 'Home of the Giants' in Norse mythology, harboring Scandinavia's two highest peaks (Galdhøpiggen 2,469
    m and Glittertind) and the legendary Besseggen ridge.
  fr: >-
    Le « royaume des géants » dans la mythologie nordique, abritant les deux plus hauts sommets de Scandinavie
    (Galdhøpiggen 2 469 m et Glittertind) et la légendaire arête de Besseggen.
  de: >-
    Die „Heimat der Riesen“ in der nordischen Mythologie, Heimat der zwei höchsten Gipfel Skandinaviens
    (Galdhøpiggen 2 469 m und Glittertind) sowie des legendären Besseggen-Grats.
  it: >-
    La «Dimora dei giganti» nella mitologia norrena, custode delle due vette più alte della Scandinavia
    (Galdhøpiggen 2 469 m e Glittertind) e della leggendaria cresta di Besseggen.
  pt: >-
    O «Lar dos Gigantes» na mitologia nórdica, acolhendo os dois cumes mais altos da Escandinávia
    (Galdhøpiggen 2 469 m e Glittertind) e a lendária crista de Besseggen.
unico:
  es: >-
    En un solo parque conviven los picos más altos del norte de Europa y un valle de bosque caducifolio con
    cascadas de 275 m, y todo se recorre a pie.
  en: >-
    A single national park unites the highest peaks in Northern Europe with a deciduous valley framed by 275 m
    waterfalls, all explored on foot.
  fr: >-
    Un seul parc réunit les plus hauts sommets d'Europe du Nord et une vallée de feuillus bordée de cascades
    de 275 m, le tout accessible à pied.
  de: >-
    In einem einzigen Nationalpark vereinen sich die höchsten Gipfel Nordeuropas und ein Laubwaldtal mit 275 m
    hohen Wasserfällen, alles zu Fuß erlebbar.
  it: >-
    In un solo parco convivono le vette più alte del Nord Europa e una valle di latifoglie solcata da cascate
    di 275 m, il tutto percorribile a piedi.
  pt: >-
    Num único parque coexistem os picos mais altos do norte da Europa e um vale de folhosas com cascatas de
    275 m, tudo percorrível a pé.
observaciones:
  es: >-
    Para cruzar un glaciar hay que ir con un guía de glaciares o en una excursión guiada. Se puede acampar
    donde se quiera, a más de 150 m de casas o cabañas habitadas. Los perros deben ir atados del 1 de abril al
    1 de octubre o 1 de noviembre, y los renos son especialmente vulnerables justo después de Navidad y en
    primavera. Los vehículos motorizados están en principio prohibidos, y también las bicicletas eléctricas.
    El tiempo cambia muy deprisa en verano y en invierno; en verano no es raro encontrar frío y niebla espesa.
texto:
  es:
    intro: >-
      Los trolls, dice la leyenda, viven en estas montañas. Un día salieron a la luz, vieron el sol, se
      resquebrajaron y se convirtieron en piedra, y de ahí saldrían estas crestas rotas. Fue el poeta Aasmund
      Olavsson Vinje quien, en 1862, bautizó el macizo «Jøtunheimen», el hogar de los gigantes, inspirado por
      el paisaje salvaje y la mitología nórdica. El nombre cuajó. Jotunheimen es hoy el parque nacional más
      famoso de Noruega y alberga las montañas más altas del norte de Europa: más de doscientos cincuenta
      picos por encima de 1900 m, con el Galdhøpiggen, de 2469 m, a la cabeza.
    landscape: >-
      Esto es un trozo de la cordillera caledoniana, el cinturón de montañas que recorre Noruega de norte a
      sur; esta parte se conoce como el Jotun Nappe Complex. Los glaciares hicieron el resto: excavaron los
      macizos de gabro y dejaron los valles y cumbres actuales. El mayor lago, el Gjende, tiene un truco: el
      agua turbia de los glaciares lo vuelve verde esmeralda a finales del verano, mientras el Bessvatnet,
      azul intenso, queda 400 m más arriba. Henrik Ibsen miró esa cresta que los separa, Besseggen, y de ella
      sacó la cabalgada de Peer Gynt sobre un reno.


      Entre los picos mandan dos nombres. El Galdhøpiggen llega a 2469 m y el Glittertind, cubierto de hielo,
      es solo unos metros más bajo; en los Hurrungane, los picos más salvajes y dentados, el Store
      Skagastølstind (2403 m) es el «rey» y la tercera montaña del país. Aproximadamente la mitad del parque
      casi no tiene vegetación: es roca, sedimentos, hielo y nieve. Y aun así hay plantas alpinas que crecen a
      altitudes récord, y muchas rapaces anidan en los cortados.


      Al oeste todo cambia. Utladalen es un paisaje protegido con bosque caducifolio termófilo y cascadas
      altas: un cañón estrecho en V con valles colgados en U, por el que baja el río Utla, que se alimenta de
      los glaciares. Allí, el pinar primario de Vettismorki es un recurso muy valioso, y desde él la cascada
      Vettisfossen cae 275 m hacia el valle.
    wildlife: >-
      En Jotunheimen se pueden encontrar los cuatro miembros de la familia de los cérvidos. El
      [alce](/especie/alces_alces/) se ve en verano en las cotas altas; el [ciervo](/especie/cervus_elaphus/)
      vive en el bosque hacia Jotunheimen y a veces sube a la montaña; el
      [corzo](/especie/capreolus_capreolus/) aparece de forma esporádica en el borde del área protegida. En
      los sectores orientales hay renos domesticados, y las poblaciones de [reno](/especie/rangifer_tarandus/)
      salvaje se sitúan en Hurrungane y más al oeste del parque: Noruega alberga aproximadamente el 90 % de
      los renos salvajes de tundra del mundo.


      Entre los grandes depredadores, el que más se ve o del que más rastros se encuentran es el
      [glotón](/especie/gulo_gulo/). Hay martas, visones, armiños y comadrejas, y el zorro rojo ha ocupado en
      buena parte el territorio del [zorro ártico](/especie/vulpes_lagopus/), muy raro. Cada cierto tiempo hay
      un año de lemmings: están por todas partes en la montaña y el resto de las presas casi tienen un año de
      descanso. Se han registrado unas 75 especies de aves nidificantes, y Jotunheimen es un área importante
      para varias rapaces.


      En Utladalen, salmones y truchas marinas remontan el río Utla hasta la cascada Avdalsfossen.
    visit: >-
      La época más indicada para caminar suele ser de mediados de julio a mediados de agosto, aunque depende
      de la nieve y el tiempo. Dentro del parque hay más de cincuenta rutas señalizadas, con caminatas desde
      una hora hasta diez horas.


      La clásica es Besseggen. Casi todo el mundo toma el barco de Gjendeosen a Memurubu y vuelve a pie por la
      montaña hasta Gjendesheim en una jornada completa; el recorrido conecta Gjendesheim con Memurubu a lo
      largo de trece kilómetros y lleva de siete a nueve horas. Hay más de 1000 m de desnivel, con el punto
      más alto en el Veslfjellet, a 1743 m, y tramos empinados donde hay que usar las manos. Desde la cima, el
      Gjende verde queda al sur y el Bessvatnet azul al norte. Si prefieres algo más fácil, o el tiempo no
      acompaña, camina por la orilla norte del Gjende: normalmente de 3 a 5 horas con descansos.


      El Galdhøpiggen se puede empezar desde Spiterstulen o desde Juvass Cabin, donde hay excursiones guiadas
      diarias en temporada alta. En Utladalen, la cascada Vettisfossen es la excursión de las familias: unas 4
      horas ida y vuelta desde el aparcamiento de Hjelle (6 km por tramo), al pie de la cascada no regulada
      más alta del norte de Europa.


      Las puertas de entrada tienen casi todo. Gjendesheim, junto al Gjende, es la más concurrida; desde el
      aparcamiento de Reinsvangen una lanzadera deja a los visitantes justo antes del límite del parque. En
      Lom está el Norwegian Mountain Center, un centro de visitantes autorizado que propone itinerarios dentro
      y fuera de los parques nacionales. La Casa de la Naturaleza de Utladalen es la puerta de acceso al oeste
      del parque y presenta su historia cultural. Y en Fortun, el centro de visitantes de Fortunsdalen
      presenta la historia del reno salvaje, la caza prehistórica y la tradición alpinista de los Hurrungane.
    history: >-
      Los primeros turistas de montaña llegaron en el siglo XIX, y muchas cabañas turísticas nacieron junto a
      explotaciones lecheras de montaña. El parque nacional se creó en 1980 y ocupa unos 1151 km². Por la zona
      pasa además una ruta histórica, que en su primera etapa cruza Besseggen, con escaleras de piedra
      construidas por sherpas para reducir la erosión de la senda.
    before: >-
      Para cruzar un glaciar hay que ir con un guía de glaciares o en una excursión guiada. Se puede acampar
      donde se quiera, a más de 150 m de casas o cabañas habitadas. Los perros deben ir atados del 1 de abril
      al 1 de octubre o 1 de noviembre, y los renos son especialmente vulnerables justo después de Navidad y
      en primavera. Los vehículos motorizados están en principio prohibidos, y también las bicicletas
      eléctricas. El tiempo cambia muy deprisa en verano y en invierno; en verano no es raro encontrar frío y
      niebla espesa.
    around: >-
      El [Parque Nacional de Reinheimen](/lugar/reinheimen-national-park/) está a unos veinticinco kilómetros.
      Más lejos, el [Parque Nacional de Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), el
      [Parque Nacional Urho Kekkonen](/lugar/urho-kekkonen-national-park/) y la [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) comparten con Jotunheimen el glotón, el reno y el
      águila real en la alta montaña.
  en:
    intro: >-
      Trolls, legend tells, dwell within these crags. Caught by the rising sun, they shattered and turned to
      stone, yielding these fractured, sawtooth ridges. It was poet Aasmund Olavsson Vinje who in 1862
      christened the massif «Jøtunheimen»—the home of the giants—inspired by its untamed topography and Norse
      mythology. The name endured. Today Jotunheimen is Norway's most celebrated national park, gathering the
      highest summits in Northern Europe: over two hundred and fifty peaks rising above 1900 m, spearheaded by
      Galdhøpiggen at 2469 m.
    landscape: "This is an integral segment of the Caledonian mountain belt traversing Norway from north to south; regionally known as the Jotun Nappe Complex. Ancient glaciers completed the architecture, carving out gabbro massifs to leave steep troughs and sharp horns. Lake Gjende has a unique hue: glacial silt turns its waters deep emerald green by late summer, whereas Lake Bessvatnet, pure cobalt blue, sits 400 m higher up. Henrik Ibsen contemplated the razor ridge separating them, Besseggen, drawing inspiration for Peer Gynt's wild reindeer ride.\r\n\r\nTwo summits dominate discussions. Galdhøpiggen reaches 2469 m, while ice-capped Glittertind is only slightly lower; in the Hurrungane, the most jagged alpine redoubt, Store Skagastølstind (2403 m) is revered as king and ranks as the country's third highest peak. Roughly half the park lacks vegetation: a moonscape of bedrock, scree, ice, and perennial snow. Even so, specialized alpine flora attains record elevations, and raptors eyrie on sheer crags.\r\n\r\nTo the west, the scenery shifts completely. Utladalen is a protected landscape of thermophilous deciduous woodlands and plunging waterfalls: a narrow V-shaped gorge flanked by hanging U-shaped valleys carved by the glacier-fed Utla River. There, the primeval pine forest of Vettismorki is an invaluable sanctuary, from which the Vettisfossen waterfall plunges 275 m into the chasm."
    wildlife: "Jotunheimen is one of the few places sheltering all four Scandinavian deer species. [Moose](/especie/alces_alces/) browse high ground in summer; [red deer](/especie/cervus_elaphus/) frequent lower slopes and occasionally venture onto open fell; [roe deer](/especie/capreolus_capreolus/) appear sporadically along protected valley fringes. Eastern tracts support domestic reindeer, while wild [reindeer](/especie/rangifer_tarandus/) populations roam Hurrungane and western sectors: Norway protects roughly 90 % of the world's wild alpine tundra reindeer.\r\n\r\nAmong apex predators, the [wolverine](/especie/gulo_gulo/) is the most characteristic and tracks are widely found. Pine martens, American minks, stoats, and least weasels are present, while the expanding red fox has largely displaced the critically rare [arctic fox](/especie/vulpes_lagopus/). Periodic lemming population explosions carpet the fells, offering other prey species a respite from predation. Some 75 breeding bird species have been recorded, with the park providing vital territory for cliff-nesting raptors.\r\n\r\nIn Utladalen, Atlantic salmon and sea trout ascend the torrential Utla River up to the Avdalsfossen falls."
    visit: "The prime walking season runs from mid-July to mid-August, depending on snowpack and weather. The park encompasses more than fifty waymarked hiking trails, spanning from one hour walks to ten hours expeditions.\r\n\r\nThe quintessential route is Besseggen. Most hikers take the morning passenger ferry from Gjendeosen to Memurubu and trek back along the crest to Gjendesheim across a full day; the route links Gjendesheim with Memurubu over thirteen kilometres, requiring seven to nine hours. The traverse exceeds 1000 m of total ascent, topping out at Veslfjellet at 1743 m, with steep scrambles requiring handholds. From the narrow arête, green Gjende gleams to the south and blue Bessvatnet lies to the north. For an easier route or in poor weather, take the lakeshore trail along Gjende's northern bank: typically 3 to 5 hours with rests.\r\n\r\nGaldhøpiggen ascents depart from Spiterstulen or Juvass Cabin, where daily guided glacier crossings operate during high season. In Utladalen, the hike to Vettisfossen is beloved by families: roughly 4 hours return from the Hjelle car park (6 km each way) to the foot of Northern Europe's highest unregulated free-falling waterfall.\r\n\r\nGateway villages offer complete visitor services. Gjendesheim by Lake Gjende is the busiest hub; from Reinsvangen car park, shuttle buses transfer hikers to the park boundary. In Lom, the Norwegian Mountain Center provides route advice. The Utladalen Nature House acts as western gateway, interpreting pastoral history. In Fortun, the Fortunsdalen visitor centre presents wild reindeer history, prehistoric pitfall hunting, and Hurrungane mountaineering heritage."
    history: >-
      Early mountain adventurers arrived in the nineteenth century, with many trekking cabins springing up
      beside summer dairy farms. The national park was created in 1980 and covers roughly 1151 km². A historic
      route crosses the massif, its first stage traversing Besseggen, featuring stone staircases crafted by
      Nepalese Sherpas to curb trail erosion.
    before: >-
      Crossing glaciers requires a certified guide or organized excursion. Wild camping is permitted across
      the fells, provided tents are pitched more than 150 m from inhabited dwellings. Dogs must be kept on a
      leash from 1 April to 1 October or 1 November, and reindeer are acutely vulnerable after Christmas and
      during spring calving. Motorized vehicles and e-bikes are prohibited. Mountain weather shifts rapidly
      year-round; cold gales and thick fog can descend swiftly even in midsummer.
    around: >-
      [Reinheimen National Park](/lugar/reinheimen-national-park/) lies about twenty-five kilometres away.
      Further afield, [Saltfjellet-Svartisen National Park](/lugar/saltfjellet-svartisen-nasjonalpark/), [Urho
      Kekkonen National Park](/lugar/urho-kekkonen-national-park/), and [Vindelfjällen Nature
      Reserve](/lugar/vindelfjallens-naturreservat/) share with Jotunheimen wolverines, reindeer, and golden
      eagles in alpine terrain.
  fr:
    intro: >-
      Les trolls, dit la légende, hantaient ces montagnes. Surpris par la lumière du soleil, ils se fendirent
      et furent changés en pierre, donnant naissance à ces crêtes déchiquetées. C'est le poète Aasmund
      Olavsson Vinje qui baptisa en 1862 le massif « Jøtunheimen », le royaume des géants, inspiré par la
      sauvagerie du paysage et la mythologie scandinave. Le nom s'imposa. Jotunheimen est aujourd'hui le parc
      national le plus réputé de Norvège, rassemblant les plus hautes montagnes d'Europe du Nord : plus de
      deux cent cinquante sommets dépassant 1900 m, dominés par le Galdhøpiggen et ses 2469 m.
    landscape: "Ce relief appartient à la chaîne calédonienne qui traverse la Norvège ; ce secteur correspond au Jotun Nappe Complex. Les glaciers ont façonné le reste, affouillant les massifs de gabbro pour sculpter vallées et pics actuels. Le plus grand lac, le Gjende, offre une curiosité : les sédiments glaciaires colorent ses eaux en vert émeraude à la fin de l'été, tandis que le Bessvatnet, d'un bleu cobalt pur, s'étage 400 m plus haut. Henrik Ibsen contempla l'arête qui les sépare, Besseggen, et y imagina la chevauchée fantastique de Peer Gynt sur son renne.\r\n\r\nDeux cimes se disputent les honneurs. Le Galdhøpiggen culmine à 2469 m et le Glittertind, coiffé de glace, ne lui cède que quelques mètres ; dans les Hurrungane, le Store Skagastølstind (2403 m) règne en souverain sur les aiguilles les plus escarpées du pays. Environ la moitié du parc est dépourvue de végétation : un désert de roche, d'éboulis, de glace et de neige. Pourtant, des plantes alpines battent des records d'altitude et de nombreux rapaces nichent sur les parois.\r\n\r\nÀ l'ouest, le décor bascule. Utladalen est une vallée protégée abritant une forêt de feuillus thermophile et de vertigineuses cascades : un défilé en V dominé par des vallées suspendues en U creusées par l'Utla, rivière nourrie par les glaciers. La pinède primaire de Vettismorki y constitue un joyau, d'où la cascade de Vettisfossen chute de 275 m dans le gouffre."
    wildlife: "Jotunheimen réunit les quatre cervidés de Scandinavie. L'[élan](/especie/alces_alces/) monte en altitude durant l'été ; le [cerf élaphe](/especie/cervus_elaphus/) peuple les lisières boisées et gagne parfois les alpages ; le [chevreuil](/especie/capreolus_capreolus/) s'observe sporadiquement en marge du parc. Dans les secteurs orientaux paissent des rennes domestiques, tandis que les hardes de [rennes](/especie/rangifer_tarandus/) sauvages occupent les Hurrungane et l'ouest du massif : la Norvège abrite environ 90 % des rennes sauvages de toundra du monde.\r\n\r\nParmi les grands prédateurs, le [glouton](/especie/gulo_gulo/) est le plus représentatif et ses traces sillonnent les névés. Martres, visons, hermines et belettes sont présents, alors que le renard roux a largement supplanté le [renard polaire](/especie/vulpes_lagopus/), devenu rarissime. Périodiquement survient une explosion démographique de lemmings, envahissant les combes et offrant un répit aux autres proies. Quelque 75 espèces d'oiseaux nicheurs ont été recensées, le parc étant capital pour les rapaces rupicoles.\r\n\r\nDans la vallée d'Utladalen, saumons et truites de mer remontent l'Utla jusqu'aux remous de la cascade d'Avdalsfossen."
    visit: "La meilleure période pour randonner s'étend de la mi-juillet à la mi-août, au gré de l'enneigement et des conditions météo. Le parc compte plus de cinquante sentiers balisés, de la promenade d'une heure à des treks de dix heures.\r\n\r\nLa traversée classique est celle de Besseggen. La plupart des marcheurs empruntent le bateau de Gjendeosen à Memurubu puis rentrent à pied sur les crêtes jusqu'à Gjendesheim en une journée complète ; l'itinéraire relie Gjendesheim à Memurubu sur treize kilomètres en sept à neuf heures de marche. Il totalise plus de 1000 m de dénivelé, atteignant son point culminant au Veslfjellet à 1743 m, avec des passages rocheux aériens nécessitant l'aide des mains. Depuis l'arête, le lac vert de Gjende s'étale au sud et le lac bleu de Bessvatnet au nord. Pour une version plus douce, longez la rive nord du Gjende : compter 3 à 5 heures avec les pauses.\r\n\r\nL'ascension du Galdhøpiggen débute depuis Spiterstulen ou le refuge de Juvasshytta, où des traversées glaciaires encadrées partent chaque jour en été. Dans la vallée d'Utladalen, la balade menant à la cascade de Vettisfossen est très prisée : environ 4 heures aller-retour depuis le parking de Hjelle (6 km par tronçon), au pied de la plus haute chute naturelle d'Europe du Nord.\r\n\r\nLes portes d'accès regroupent tous les services. Gjendesheim, au bord du lac, est la plus fréquentée ; des navettes acheminent les visiteurs depuis le parking de Reinsvangen. À Lom, le Norwegian Mountain Center conseille sur les circuits. La maison de la Nature d'Utladalen ouvre l'accès occidental du parc. À Fortun, le centre d'accueil présente l'épopée du renne sauvage et l'histoire alpine des Hurrungane."
    history: >-
      Les premiers pionniers de l'alpinisme explorèrent le massif au XIXe siècle, les refuges naissant souvent
      auprès d'anciennes fermes d'estive. Le parc national fut créé en 1980 et couvre quelque 1151 km². Une
      route historique sillonne la région, franchissant Besseggen lors de sa première étape, dotée d'escaliers
      en pierre aménagés par des sherpas népalais pour freiner l'érosion du sentier.
    before: >-
      La traversée des glaciers requiert impérativement un guide certifié ou une sortie encadrée. Le bivouac
      sous tente est libre sur les plateaux, à condition de s'installer à plus de 150 m des chalets et
      habitations. Les chiens doivent être tenus en laisse du 1er avril au 1er octobre ou 1er novembre, et les
      rennes sont particulièrement vulnérables après Noël et lors de la mise bas printanière. Les engins
      motorisés et vélos électriques sont interdits. La météo montagnarde évolue très vite en toute saison ;
      froid vif et brouillard épais peuvent survenir au cœur de l'été.
    around: >-
      Le [parc national de Reinheimen](/lugar/reinheimen-national-park/) s'étend à environ vingt-cinq
      kilomètres. Plus loin, le [parc national de
      Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), le [parc national Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) et la [réserve naturelle de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) partagent avec Jotunheimen la présence du glouton,
      du renne et de l'aigle royal en haute montagne.
  de:
    intro: >-
      Trolle, so die Sage, hausten einst in diesen Bergen. Als sie ans Licht traten, vom Sonnenaufgang
      überrascht wurden, zerbarsten sie und erstarrten zu Stein — daraus seien diese zackigen Grate
      hervorgegangen. Es war der Dichter Aasmund Olavsson Vinje, der das Massiv im Jahr 1862 «Jøtunheimen»
      taufte, das Heim der Riesen, inspiriert von der rauen Gebirgslandschaft und der nordischen Götterwelt.
      Der Name blieb haften. Jotunheimen ist heute der berühmteste Nationalpark Norwegens und versammelt die
      höchsten Gipfel Nordeuropas: mehr als zweihundertfünfzig Gipfel über 1900 m, angeführt vom Galdhøpiggen
      mit 2469 m.
    landscape: "Das Gebirge ist ein Teil des Kaledonischen Orogens, das Norwegen von Nord nach Süd durchzieht; geologisch als Jotun-Deckenkomplex bekannt. Gletscher besorgten den Rest: Sie hobelten die Gabbromassive aus und hinterließen die heutigen Trogtäler und Steilkarre. Der größte See, der Gjende, birgt ein Farbspiel: Trübes Gletscherwasser färbt ihn im Spätsommer smaragdgrün, während der Bessvatnet, tiefblau, 400 m höher liegt. Henrik Ibsen blickte auf den schmalen Felsgrat Besseggen, der sie trennt, und erfand dort Peer Gynts Ritt auf dem Ren.\r\n\r\nZwei Gipfel dominieren das Massiv: Der Galdhøpiggen ragt 2469 m auf und der eisbedeckte Glittertind ist nur wenige Meter niedriger; in den Hurrungane, der wildesten Gipfelgruppe, ist der Store Skagastølstind (2403 m) der unbestrittene Regent und dritthöchste Berg des Landes. Rund die Hälfte des Parks ist fast vegetationslos: nackter Fels, Blockhalden, Eis und Altschnee. Dennoch wachsen alpine Spezialisten in Rekordhöhen und Greifvögel nisten an den Steilwänden.\r\n\r\nIm Westen wandelt sich das Bild grundlegend. Utladalen ist ein Landschaftsschutzgebiet mit wärmeliebendem Laubwald und stürzenden Kaskaden: eine enge V-Schlucht mit hoch aufragenden hängenden U-Tälern, durch die die gletschergespeiste Utla strömt. Dort ist der Urkiefernwald Vettismorki ein Refugium, aus dem der Wasserfall Vettisfossen 275 m tief ins Tal stürzt."
    wildlife: "In Jotunheimen kommen alle vier Hirscharten Skandinaviens vor. Der [Elch](/especie/alces_alces/) sucht im Sommer Hochlagen auf; der [Rothirsch](/especie/cervus_elaphus/) zieht an bewaldeten Hängen hinauf; das [Reh](/especie/capreolus_capreolus/) tritt vereinzelt an den Parkrändern auf. Im Osten weiden zahme Rentiere, während die Herden des wilden [Rens](/especie/rangifer_tarandus/) in den Hurrungane und im Westen stehen: Norwegen beherbergt etwa 90 % der weltweiten Tundra-Wildrentiere.\r\n\r\nUnter den Raubtieren ist der [Vielfraß](/especie/gulo_gulo/) am weitesten verbreitet und hinterlässt überall Spuren. Baummarder, Nerz, Hermelin und Mauswiesel sind heimisch, während der Rotfuchs den vom Aussterben bedrohten [Polarfuchs](/especie/vulpes_lagopus/) verdrängt hat. In periodischen Lemmingjahren wimmelt es auf den Hochebenen von Nagern, was anderen Beutetieren eine Atempause verschafft. Rund 75 Brutvogelarten wurden nachgewiesen; der Park ist ein wichtiges Rückzugsgebiet für Greifvögel.\r\n\r\nIm Utladalen steigen Lachse und Meerforellen im wilden Flusslauf der Utla bis zum Wasserfall Avdalsfossen auf."
    visit: "Die beste Wanderzeit erstreckt sich von Mitte Juli bis Mitte August, abhängig von Altschneefeldern und Witterung. Im Park gibt es mehr als fünfzig markierte Wanderrouten, von einstündigen Spaziergängen bis zu zehntägigen Trekkingtouren.\r\n\r\nDer Klassiker ist der Besseggen-Grat. Die meisten Wanderer nehmen das Boot von Gjendeosen nach Memurubu und wandern über den Felsgrat zurück nach Gjendesheim; die Route verbindet Gjendesheim und Memurubu über dreizehn Kilometer und erfordert sieben bis neun Stunden Gehzeit. Sie überwindet mehr als 1000 m Höhenunterschied, erreicht am Veslfjellet mit 1743 m ihren höchsten Punkt und verlangt an steilen Felspassagen Trittsicherheit und Handeinsatz. Vom Grat liegt der grüne Gjende südlich und der blaue Bessvatnet nördlich. Wer es gemütlicher mag oder bei Schlechtwetter wandert, wählt den Uferpfad am Nordufer des Gjende: meist 3 bis 5 Stunden mit Pausen.\r\n\r\nDer Galdhøpiggen lässt sich von Spiterstulen oder der Juvasshytta aus besteigen, wo in der Hochsaison täglich geführte Gletschertouren starten. Im Utladalen ist die Wanderung zum Vettisfossen ein Familienklassiker: rund 4 Stunden Gehzeit hin und zurück ab Parkplatz Hjelle (6 km pro Strecke) zum Fuß des höchsten unregulierten Wasserfalls Nordeuropas.\r\n\r\nDie Talorte bieten vollständige Infrastruktur. Gjendesheim am See ist der am stärksten frequentierte Ausgangspunkt; vom Wanderparkplatz Reinsvangen verkehren Shuttlebusse. In Lom berät das Norwegian Mountain Center bei Touren. Das Utladalen Naturhaus bildet das westliche Tor zum Park. In Fortun zeigt das Besucherzentrum Fortunsdalen Ausstellungen zur Rentierjagd und Alpingeschichte."
    history: >-
      Die ersten Gebirgspioniere reisten im neunzehnten Jahrhundert an; viele Wanderhütten entstanden aus
      alten Almwirtschaften (Seter). Der Nationalpark wurde 1980 gegründet und umfasst etwa 1151 km². Über den
      Grat verläuft ein historischer Pfad, dessen steilste Passagen mit von nepalesischen Sherpas gelegten
      Natursteintreppen gesichert wurden, um Bodenerosion einzudämmen.
    before: >-
      Das Überqueren von Gletschern setzt zwingend einen lizenzierten Bergführer oder eine geführte Tour
      voraus. Freies Zelten ist überall gestattet, sofern mehr als 150 m Abstand zu bewohnten Häusern und
      Hütten gewahrt bleiben. Hunde müssen vom 1. April bis zum 1. Oktober oder 1. November an der Leine
      geführt werden; Rentiere sind nach Weihnachten und zur Frühjahrskalbzeit hochgradig störungsempfindlich.
      Motorfahrzeuge und E-Bikes sind verboten. Das Gebirgswetter schlägt rasch um; Kälteeinbrüche und dichter
      Nebel sind selbst im Hochsommer keine Seltenheit.
    around: >-
      Der [Reinheimen-Nationalpark](/lugar/reinheimen-national-park/) liegt rund fünfundzwanzig Kilometer
      entfernt. Weiter nördlich teilen der
      [Saltfjellet-Svartisen-Nationalpark](/lugar/saltfjellet-svartisen-nasjonalpark/), der
      [Urho-Kekkonen-Nationalpark](/lugar/urho-kekkonen-national-park/) und das [Naturreservat
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) mit Jotunheimen Vielfraß, Rentier und Steinadler im
      Hochgebirge.
  it:
    intro: >-
      I troll, narra la leggenda, dimoravano tra queste vette. Sorpresi dal sole all'alba, si spaccarono e
      mutarono in pietra, lasciando dietro di sé queste creste frastagliate. Fu il poeta Aasmund Olavsson
      Vinje a battezzare il massiccio nel 1862 col nome di «Jøtunheimen», la dimora dei giganti, ispirato
      dalla maestosità della natura e dai miti nordici. Il nome attecchì. Jotunheimen è oggi il parco
      nazionale più illustre della Norvegia e custodisce le montagne più elevate del Nord Europa: oltre
      duecentocinquanta cime sopra i 1900 m, guidate dal Galdhøpiggen a quota 2469 m.
    landscape: "È un frammento monumentale dell'orogenesi caledoniana che attraversa la Norvegia da nord a sud, noto nella geologia locale come Jotun Nappe Complex. I ghiacciai hanno modellato il resto: scavarono i blocchi di gabbro lasciando vallate a U e vette aguzze. Il lago maggiore, il Gjende, sfoggia una peculiarità: la farina glaciale sospesa ne colora le acque di verde smeraldo a fine estate, mentre il Bessvatnet, di un blu cobalto intenso, riposa 400 m più in alto. Henrik Ibsen osservò la cresta che li divide, Besseggen, traendovi ispirazione per la leggendaria cavalcata di Peer Gynt sulla renna.\r\n\r\nDue cime primeggiano nel massiccio. Il Galdhøpiggen tocca i 2469 m e il Glittertind, ammantato da una calotta glaciale, è più basso di pochissimi metri; negli Hurrungane, il gruppo più aspro e dentellato, lo Store Skagastølstind (2403 m) regna come sovrano incontrastato e terza vetta del Paese. Circa metà dell'area protetta è quasi priva di manto vegetale: roccia viva, pietraie, ghiaccio e nevi perenni. Ciononostante, piante pioniere raggiungono quote record e numerosi rapaci nidificano sulle pareti rocciose.\r\n\r\nA ovest lo scenario muta radicalmente. Utladalen è una valle protetta con boschi termofili di latifoglie e cascate spettacolari: una forra a V incisa da valli sospese a U, percorsa dalle acque glaciali dell'Utla. La pineta vergine di Vettismorki è un rifugio intatto, da cui la cascata Vettisfossen precipita per 275 m verso il fondovalle."
    wildlife: "A Jotunheimen convivono le quattro specie di cervidi della fauna scandinava. L'[alce](/especie/alces_alces/) sale in quota nei mesi estivi; il [cervo nobile](/especie/cervus_elaphus/) staziona nei boschi pedemontani salendo talora sui pascoli; il [capriolo](/especie/capreolus_capreolus/) si affaccia ai confini della riserva. Nelle zone orientali pascolano renne domestiche, mentre le popolazioni di [renna](/especie/rangifer_tarandus/) selvatica occupano gli Hurrungane e i settori occidentali: la Norvegia accoglie circa il 90 % delle renne selvatiche di tundra del pianeta.\r\n\r\nTra i predatori maggiori, il [ghiottone](/especie/gulo_gulo/) è il più presente e le sue tracce sono comuni sulla neve. Martore, visoni, ermellini e donnole popolano i fondovalle, mentre la volpe rossa ha quasi soppiantato la rarissima [volpe artica](/especie/vulpes_lagopus/). A intervalli ciclici si verificano annate di lemming: i roditori pullulano sui pianori, offrendo una tregua alle altre prede. Si contano circa 75 specie di uccelli nidificanti, con presenze significative di rapaci rupicoli.\r\n\r\nIn Utladalen salmoni atlantici e trote di mare risalgono le rapide del fiume Utla fino alla base della cascata Avdalsfossen."
    visit: "Il periodo ideale per camminare va da metà luglio a metà agosto, in base alle nevicate e alle condizioni meteorologiche. All'interno del parco si snodano più di cinquanta percorsi segnalati, dalla passeggiata di un'ora a traversate di dieci ore.\r\n\r\nL'itinerario principe è Besseggen. La consuetudine prevede di salire sul battello da Gjendeosen a Memurubu per poi tornare a piedi lungo il filo di cresta fino a Gjendesheim nell'arco di un'intera giornata; il percorso unisce Gjendesheim a Memurubu lungo tredici chilometri, richiedendo da sette a nove ore di marcia. Supera oltre 1000 m di dislivello positivo, culminando sul Veslfjellet a 1743 m con passaggi esposti dove occorre aiutarsi con le mani. Dalla cresta, il verde Gjende scintilla a sud e l'azzurro Bessvatnet a nord. Se preferisci un'escursione più agevole o il meteo volge al brutto, costeggia la riva settentrionale del Gjende: di norma 3 a 5 ore con soste.\r\n\r\nLa salita al Galdhøpiggen si effettua da Spiterstulen o dalla Juvass Cabin, con escursioni guidate su ghiacciaio attive quotidianamente in estate. In Utladalen la cascata Vettisfossen è la gita classica per famiglie: circa 4 ore tra andata e ritorno dal parcheggio di Hjelle (6 km a tratta), fino ai piedi della cascata naturale a salto unico più alta del Nord Europa.\r\n\r\nI centri vallivi offrono tutti i servizi necessari. Gjendesheim, sulle sponde del lago, è il nodo più frequentato; dal parcheggio di Reinsvangen navette collegano i visitatori al confine del parco. A Lom il Norwegian Mountain Center offre consulenza sulle escursioni. La Casa della Natura di Utladalen è la porta d'accesso occidentale. A Fortun il centro visite di Fortunsdalen documenta la storia della renna e la tradizione alpinistica degli Hurrungane."
    history: >-
      I pionieri dell'escursionismo montano giunsero nel secolo XIX, trasformando antiche malghe in rifugi. Il
      parco nazionale fu istituito nel 1980 e copre circa 1151 km². Lungo la traversata di Besseggen sono
      stati posati gradini in pietra da sherpa nepalesi per proteggere il terreno dall'erosione causata dal
      calpestio.
    before: >-
      Per attraversare i ghiacciai è d'obbligo affidarsi a guide alpine patentate o prendere parte a uscite
      organizzate. Il campeggio libero è autorizzato sui pianori a patto di piantare la tenda a più di 150 m
      da rifugi o abitazioni. I cani devono essere tenuti al guinzaglio dal 1° aprile al 1° ottobre o 1°
      novembre, e le renne sono vulnerabili dopo Natale e durante i parti primaverili. Mezzi a motore ed
      e-bike sono vietati. Il meteo alpino muta bruscamente; nebbie fitte e gelate possono manifestarsi anche
      in piena estate.
    around: >-
      Il [Parco Nazionale di Reinheimen](/lugar/reinheimen-national-park/) si trova a circa venticinque
      chilometri. A maggiore distanza, il [Parco Nazionale di
      Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), il [Parco Nazionale Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) e la [Riserva Naturale di
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) condividono con Jotunheimen la presenza di
      ghiottone, renna e aquila reale in ambiente alpino.
  pt:
    intro: >-
      Os trolls, reza a lenda, habitavam estas montanhas. Apanhados pelos primeiros raios de sol, racharam-se
      e petrificaram-se, moldando estas cristas pontiagudas. Foi o poeta Aasmund Olavsson Vinje quem, em 1862,
      batizou o maciço como «Jøtunheimen», a morada dos gigantes, inspirado pela grandiosidade da paisagem e
      pelas sagas nórdicas. O nome vingou. Jotunheimen é hoje o parque nacional mais célebre da Noruega,
      reunindo as montanhas mais elevadas do norte da Europa: mais de duzentos e cinquenta picos acima dos
      1900 m, encabeçados pelo Galdhøpiggen com 2469 m.
    landscape: "Trata-se de um troço basilar da orogenia caledoniana que rasga a Noruega de norte a sul, identificado geologicamente como o Jotun Nappe Complex. Os glaciares encarregaram-se da escultura final: entalharam os maciços de gabro gerando vales em U e cumes afilados. O lago maior, o Gjende, exibe uma peculiaridade: o limo glaciar em suspensão tinge as suas águas de verde-esmeralda no final do verão, enquanto o Bessvatnet, de um azul-cobalto profundo, repousa 400 m mais acima. Henrik Ibsen observou a crista que os separa, Besseggen, inspirando-se nela para a mítica cavalgada de Peer Gynt sobre uma rena.\r\n\r\nDois cumes pontificam no horizonte. O Galdhøpiggen atinge 2469 m e o Glittertind, coroado por uma cúpula de gelo, fica escassos metros abaixo; nos Hurrungane, o maciço mais dentado e alpino, o Store Skagastølstind (2403 m) é considerado o soberano e a terceira montanha do país. Praticamente metade do parque carece de vegetação: é rocha nua, cascalheiras, gelo e neves perpétuas. Ainda assim, espécies botânicas alpinas atingem cotas recorde e muitas rapinas nidificam nas escarpas.\r\n\r\nA poente tudo se transforma. Utladalen é uma paisagem protegida com floresta caducifólia termófila e quedas de água colossais: um desfiladeiro apertado em V ladeado por vales suspensos em U, por onde corre o rio Utla alimentado pelos glaciares. O pinhal virgem de Vettismorki é uma relíquia florestal, de onde a cascata Vettisfossen tomba 275 m em queda livre."
    wildlife: "Em Jotunheimen coabitam os quatro cervídeos escandinavos. O [alce](/especie/alces_alces/) ascende às cotas elevadas no verão; o [veado-vermelho](/especie/cervus_elaphus/) habita as encostas arborizadas subindo ocasionalmente à montanha; o [corço](/especie/capreolus_capreolus/) ocorre nos limites do parque. Nos setores orientais apascentam-se renas domésticas, enquanto as manadas de [rena](/especie/rangifer_tarandus/) selvagem deambulam pelos Hurrungane e áreas ocidentais: a Noruega acolhe cerca de 90 % das renas selvagens de tundra do planeta.\r\n\r\nEntre os grandes carnívoros, o [glutão](/especie/gulo_gulo/) é o mais frequente e os seus rastos marcam a neve. Martas, visões, arminhos e doninhas povoam as margens, ao passo que a raposa-vermelha empurrou a vulnerável [raposa-do-ártico](/especie/vulpes_lagopus/) para a quase extinção. Em anos de lemingues, estes roedores proliferam por todo o lado, permitindo que as outras presas gozem de um alívio predador. Registam-se cerca de 75 espécies de aves nidificantes, constituindo o parque um santuário para rapinas de falésia.\r\n\r\nEm Utladalen, salmões e trutas-marinhas sobem as correntes do rio Utla até à base da cascata Avdalsfossen."
    visit: "A melhor época para caminhar situa-se entre meados de julho e meados de agosto, em função da neve acumulada e do estado do tempo. O parque dispõe de mais de cinquenta percursos assinalados, variando de passeios de uma hora a travessias de dez horas.\r\n\r\nA rota consagrada é Besseggen. A maioria dos caminhantes embarca no ferry de Gjendeosen para Memurubu e regressa a pé pela crista até Gjendesheim ao longo de uma jornada completa; o percurso une Gjendesheim a Memurubu em treze quilómetros, demorando entre sete a nove horas. Apresenta mais de 1000 m de desnível acumulado, atingindo o ponto mais alto no Veslfjellet aos 1743 m, com troços escarpados onde é necessário usar as mãos. Do cimo, o verde Gjende descortina-se a sul e o azul Bessvatnet a norte. Se preferires uma caminhada mais suave, contorna a margem norte do Gjende: habitualmente 3 a 5 horas com paragens.\r\n\r\nA subida ao Galdhøpiggen realiza-se a partir de Spiterstulen ou da Juvass Cabin, onde operam caminhadas diárias guiadas sobre glaciar na época alta. Em Utladalen, a excursão à cascata Vettisfossen é o clássico de eleição para famílias: cerca de 4 horas de ida e volta desde o estacionamento de Hjelle (6 km por troço), até à base da cascata não regularizada mais alta do norte da Europa.\r\n\r\nAs localidades de acesso dispõem de apoio completo. Gjendesheim, junto ao lago, é o ponto de maior movimento; a partir do parque de Reinsvangen operam vaivéns até ao limite da área protegida. Em Lom, o Norwegian Mountain Center apoia os caminhantes. A Casa da Natureza de Utladalen constitui a porta ocidental. Em Fortun, o centro de acolhimento de Fortunsdalen apresenta a história da caça à rena e a tradição montanhista dos Hurrungane."
    history: >-
      Os primeiros montanhistas alcançaram a região no século XIX, nascendo muitos abrigos junto de antigas
      pastagens de montanha (seter). O parque nacional foi instituído em 1980 e ocupa cerca de 1151 km². Pelo
      maciço passa um trilho histórico cuja primeira etapa galga Besseggen, integrando degraus de pedra
      construídos por sherpas nepaleses para atenuar o desgaste do solo.
    before: >-
      Para cruzar glaciares é indispensável a companhia de guias credenciados ou a integração em grupos
      organizados. É permitido acampar livremente na montanha, a mais de 150 m de habitações ou cabanas
      ocupadas. Os cães devem circular com trela de 1 de abril a 1 de outubro ou 1 de novembro, sendo as renas
      particularmente vulneráveis após o Natal e durante o parto na primavera. Veículos motorizados e
      bicicletas elétricas são proibidos. A meteorologia muda de forma súbita; o frio cortante e o nevoeiro
      denso ocorrem com frequência mesmo no pico do verão.
    around: >-
      O [Parque Nacional de Reinheimen](/lugar/reinheimen-national-park/) dista cerca de vinte e cinco
      quilómetros. Mais além, o [Parque Nacional de
      Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/), o [Parque Nacional Urho
      Kekkonen](/lugar/urho-kekkonen-national-park/) e a [Reserva Natural de
      Vindelfjällen](/lugar/vindelfjallens-naturreservat/) partilham com Jotunheimen a presença do glutão, da
      rena e da águia-real em ambiente de alta montanha.
