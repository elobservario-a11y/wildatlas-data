resumen:
  es: >-
    Célebre internacionalmente por albergar una de las floras alpinas y kársticas más ricas de todo el Ártico
    gracias a su sustrato de caliza blanda.
  en: >-
    Renowned internationally for harboring one of the richest arctic-alpine and karst floras in the entire
    Arctic, thanks to its soft limestone bedrock.
  fr: >-
    Célèbre à l'échelle internationale pour abriter l'une des flores alpines et karstiques les plus riches de
    tout l'Arctique grâce à son socle calcaire tendre.
  de: >-
    International berühmt für eine der artenreichsten arktisch-alpinen und Karstfloren der gesamten Arktis,
    begünstigt durch leicht verwitternden Kalkstein.
  it: >-
    Celebre a livello internazionale per ospitare una delle flore alpine e carsiche più ricche dell'intero
    Artico grazie al suo substrato calcareo tenero.
  pt: >-
    Célebre internacionalmente por acolher uma das floras alpinas e cársicas mais pródigas de todo o Ártico
    graças ao seu substrato de calcário macio.
unico:
  es: >-
    La caliza, el verano seco y la sombra de lluvia han hecho de Junkerdal el lugar donde varias plantas raras
    del Ártico llegan a su límite sur.
  en: >-
    Limestone, dry summers, and rain-shadow climate have made Junkerdal the southern terminus for several rare
    arctic plant species.
  fr: >-
    Le calcaire, l'été sec et l'ombre pluviométrique font de Junkerdal le sanctuaire où plusieurs plantes
    rares de l'Arctique atteignent leur limite méridionale.
  de: >-
    Kalkgestein, trockene Sommer und die Regenschattenlage machen den Junkerdal zu jenem Ort, an dem seltene
    arktische Pflanzen ihre südliche Verbreitungsgrenze erreichen.
  it: >-
    Il calcare tenero, l'estate secca e l'effetto ombra pluviometrica hanno reso Junkerdal il limite
    meridionale di distribuzione per diverse piante rare dell'Artico.
  pt: >-
    O calcário macio, o verão seco e a sombra de chuva tornaram Junkerdal o limite meridional para várias
    plantas árticas raras.
observaciones:
  es: >-
    Los renos son un uso vivo del territorio: la administración pide a los visitantes que no los busquen
    activamente y que mantengan consideración hacia ellos. Hay cabañas en las rutas, pero comprueba su estado
    y las condiciones antes de salir.
texto:
  es:
    intro: >-
      Junkerdal está en la sombra de lluvia al este del Svartisen, y eso lo cambia todo. Aquí el verano es
      bastante cálido y seco, y sobre una roca rica en caliza eso se traduce en flores. Muchas, y raras:
      varias especies tienen aquí su límite sur. El parque nacional, de unos 682 km² entre Sulitjelma y
      Junkerdal, en los municipios de Saltdal y Fauske, es en esencia un jardín botánico de montaña al borde
      de la frontera sueca.
    landscape: >-
      Lo moldeó la Edad de Hielo. Al norte hay mesetas con muchos lagos, y el mayor es el Balvatnet; en el
      centro, las montañas son planas y abiertas en torno a él, con el Solvågtinden como cumbre muy marcada.
      Al sur, el paisaje es de interior: amplios valles en U y macizos masivos. El conjunto forma parte de una
      de las mayores áreas naturales sin intervención técnica de los países nórdicos.


      La roca explica la flora. La caliza, el clima de sombra de lluvia y el verano cálido y seco dan para
      muchas plantas, y algunas montañas tienen una larga lista de especies árticas y alpinas. Entre las raras
      está el brezo blanco del Ártico (Cassiope tetragona), y la saxífraga blanca de montaña (Saxifraga
      paniculata) se encuentra en solo tres lugares de Noruega, con su mayor distribución en Junkerdal. La
      grønlandsstarr, la tromsvalmue, la halvkulerublom, la svartbakkestjerne y la fjellsolblom tienen aquí su
      límite sur. Por eso la flora del este se protegió ya en 1928 y la protección se amplió en 1935.
    wildlife: >-
      Es zona de depredadores: el [glotón](/especie/gulo_gulo/) y el [lince](/especie/lynx_lynx/) viven de
      forma fija en el parque y a veces se ve el [oso pardo](/especie/ursus_arctos/). Los
      [alces](/especie/alces_alces/) y los [renos](/especie/rangifer_tarandus/) son comunes, y los renos
      pastan allí todo el año.


      Las aves son otro motivo para ir. Nidifican aves muy raras para Noruega: el [halcón
      gerifalte](/especie/falco_rusticolus/), el [águila real](/especie/aquila_chrysaetos/), el colimbo chico,
      el colimbo grande y el eider de cola larga. Hay lugares de cría conocidos del busardo calzado, y
      Junkerdal es una importante zona de cría para aves acuáticas, limícolas, rapaces y paseriformes. También
      hay mariposas diurnas raras, como la polarblåvinge y la mjeltgulvinge. Las turberas con palsas, charcas
      y suelos húmedos sostienen insectos y aves, aunque están poco estudiadas.
    visit: >-
      La Nordlandsruta cruza el parque por senderos DNT bien marcados, con cabañas dentro y fuera del parque,
      entre ellas la Argaladhytta, la más conocida; dentro hay cuatro cabañas turísticas grandes y varios
      refugios y cabañas pequeñas. Al norte del parque está Jakobsbakken, un pequeño enclave minero cuyas
      minas están cerradas y cuyos edificios de principios del siglo XX recuerdan su pasado.


      Para empezar por el centro de visitantes, el Besøkssenter nasjonalpark Nordland, en Storjord (Saltdal),
      es la puerta a los parques nacionales de Nordland. Tiene la exposición «Uerstattelig» sobre naturaleza,
      fauna y cultura, abrió en 2005 y ofrece actividades al aire libre en su explanada. Está autorizado por
      la Dirección de Medio Ambiente para cinco parques, entre ellos Junkerdal, y se sitúa entre
      Saltfjellet-Svartisen y Junkerdal.
    history: >-
      Junkerdal es, sobre todo, un espacio cultural y natural de los sami: la cría de renos se practica desde
      el siglo XVI o XVII, y quedan restos de tiendas, cabañas de turba, abrigos, trampas y hogares sami, y en
      el límite del bosque ruinas de granjas sami permanentes. También hay restos de siega de monte, pesca,
      caza con trampas, tala y de exploración con sondeos en busca de minerales. El valle recibe el nombre,
      según se dice, de Preben von Ahnen, «el junker», que en 1658 cruzó el valle para asaltar y destruir la
      mina de plata sueca de Nasa.


      El parque se protegió el 9 de enero de 2004. Debe conservar una gran zona casi intacta que asegure la
      biodiversidad, la geología y los bienes culturales, y lo especialmente importante es la flora única.
      Cuenta con un plan de gestión de 2008 y una estrategia de visitantes; un nuevo plan está en elaboración.
      Søren Christian Sommerfelt, párroco de Saltdal en la década de 1820, fue el primero en describir su
      flora.
    before: >-
      Los renos son un uso vivo del territorio: la administración pide a los visitantes que no los busquen
      activamente y que mantengan consideración hacia ellos. Hay cabañas en las rutas, pero comprueba su
      estado y las condiciones antes de salir.
    around: >-
      El [Parque Nacional de Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/) está a unos
      ocho kilómetros, el [Parque Nacional de Padjelanta](/lugar/padjelanta-national-park/) a unos veintiuno y
      el [Parque Nacional de Rago](/lugar/rago-national-park/) a unos veintinueve. Más lejos, el [Parque
      Nacional de Jotunheimen](/lugar/jotunheimen-national-park/) comparte con Junkerdal el glotón y el águila
      real en la alta montaña.
  en:
    intro: >-
      Junkerdal lies in the rain shadow east of Svartisen, and that geographical quirk shifts everything. Here
      the summer is pleasantly warm and continental, which over lime-rich mica schists translates into a
      botanical explosion. Flowers abound in exceptional profusion and rarity: multiple high-arctic species
      reach their southernmost planetary limit on these slopes. The national park, encompassing some 682 km²
      between Sulitjelma and Junkerdal in the municipalities of Saltdal and Fauske, is in essence a wild
      botanical alpine garden bordering Sweden.
    landscape: "The landscape was chiseled by the Ice Age. To the north spread rolling upland plateaus studded with lakes, the largest being Lake Balvatnet; in the central sector, tabular massifs open wide around the basin, with the razor crest of Solvågtinden rising as an unmistakable landmark. To the south, the terrain assumes an interior character of broad U-shaped troughs and massive granite-and-gneiss summits. The entire complex forms part of one of Northern Europe's largest roadless, intact wilderness areas.\r\n\r\nBedrock explains the plant life. Friable limestone, sunny rain-shadow climate, and dry summers nurture diverse floral communities, with selected massifs presenting extraordinarily long rosters of arctic and alpine specialists. Among the jewels is the white Arctic mountain-heather (Cassiope tetragona), while the white mountain saxifrage (Saxifraga paniculata) occurs in only three areas in Norway, reaching its widest distribution in Junkerdal. Northern sedge, Tromsø poppy, cushion whitlow-grass, black-headed fleabane, and alpine arnica all reach their southern distribution frontier here. For that reason, botanical reserves were designated in eastern sectors as early as 1928, expanded in 1935."
    wildlife: "This is established predator territory: the [wolverine](/especie/gulo_gulo/) and [Eurasian lynx](/especie/lynx_lynx/) maintain stable resident populations, while [brown bears](/especie/ursus_arctos/) make seasonal appearances. [Moose](/especie/alces_alces/) and semi-domestic [reindeer](/especie/rangifer_tarandus/) are common across the valleys, with reindeer grazing the fells year-round.\r\n\r\nAvian life offers another compelling motive to explore. Rare Norwegian breeders include the [gyrfalcon](/especie/falco_rusticolus/), [golden eagle](/especie/aquila_chrysaetos/), red-throated loon, common loon, and long-tailed duck. Known breeding sites of the booted eagle have been documented, and Junkerdal is an essential breeding haven for waterfowl, waders, raptors, and passerines. Notable diurnal arctic butterflies also occur, such as the northern blue and alpine sulphur. Complex palsa bogs, meltwater tarns, and fen complexes sustain diverse invertebrate and shorebird assemblages."
    visit: "The historic Nordlandsruta trail traverses the park along well-marked DNT footpaths, serviced by serviced and self-service cabins inside and adjacent to the park, the most renowned being Argaladhytta; four large tourist lodges and multiple unstaffed shelters operate within the boundary. North of the park lies Jakobsbakken, a former copper-mining settlement whose historic buildings dating from the early twentieth century evoke its mining past.\r\n\r\nTo begin with orientation, the Nordland National Park Center (Besøkssenter nasjonalpark Nordland) in Storjord (Saltdal) serves as the main gateway to Nordland's national parks. Featuring the permanent exhibition «Uerstattelig» (Irreplaceable) on regional ecology, fauna, and culture, it opened in 2005 and hosts outdoor interpretive activities on its grounds. Authorized by the Norwegian Environment Agency, it oversees five national parks, positioned strategically between Saltfjellet-Svartisen and Junkerdal."
    history: "Junkerdal is fundamentally a living Sami cultural landscape: reindeer husbandry has been practiced continuously since the sixteenth or seventeenth century, leaving traces of traditional seasonal camps, turf huts (goahti), hunting blinds, pitfalls, and hearths, along with ruins of permanent Sami homesteads along the upper tree line. Evidence also endures of alpine haymaking, traditional lake fishing, trapping, historical forestry, and mineral prospecting. Legend attributes the valley's name to Danish nobleman Preben von Ahnen, «the junker», who traversed the valley in 1658 to attack and raze the Swedish silver mine at Nasa.\r\n\r\nThe national park was formally protected on 9 January 2004, designed to safeguard a vast wilderness ensuring biodiversity, geodiversity, and cultural heritage, with top priority given to its unique flora. It operates under a 2008 management plan alongside an updated visitor strategy. Botanist Søren Christian Sommerfelt, vicar of Saltdal during the 1820s, was the first scientist to document this alpine flora."
    before: >-
      Reindeer represent an active cultural and pastoral livelihood: park authorities ask hikers not to
      approach herds actively and to show utmost consideration. Hiking cabins line marked routes, but check
      their status and mountain conditions before setting out.
    around: >-
      [Saltfjellet-Svartisen National Park](/lugar/saltfjellet-svartisen-nasjonalpark/) lies roughly eight
      kilometres away, [Padjelanta National Park](/lugar/padjelanta-national-park/) about twenty-one
      kilometres, and [Rago National Park](/lugar/rago-national-park/) roughly twenty-nine kilometres distant.
      Further south, [Jotunheimen National Park](/lugar/jotunheimen-national-park/) shares with Junkerdal
      wolverines and golden eagles soaring over high-altitude fell terrain.
  fr:
    intro: >-
      Junkerdal se niche dans l'ombre pluviométrique à l'est du glacier Svartisen, une situation qui
      bouleverse son climat. Ici l'été se montre chaud et sec, et sur un substrat de calcaire et de schistes
      micacés tendres, cela donne naissance à une floraison exceptionnelle. Les fleurs y sont innombrables et
      rarissimes : plusieurs espèces arctiques y trouvent leur limite méridionale. Le parc national, qui
      couvre quelque 682 km² entre Sulitjelma et Junkerdal sur les communes de Saltdal et Fauske, est un
      véritable jardin botanique d'altitude adossé à la frontière suédoise.
    landscape: "La période glaciaire a façonné ces reliefs. Au nord s'étendent de vastes plateaux parsemés de lacs, dont le plus grand est le Balvatnet ; dans le secteur central, les crêtes s'élargissent en mesas tabulaires dominées par la silhouette trapue du Solvågtinden. Au sud, le paysage prend des allures de haute montagne intérieure : de profondes auges glaciaires en U et de puissants massifs rocheux. L'ensemble s'intègre dans l'une des plus vastes zones naturelles vierges de toute infrastructure technique de Scandinavie.\r\n\r\nLa géologie explique la luxuriance végétale. Le calcaire, l'effet de foehn et les étés ensoleillés profitent à d'innombrables plantes, certains massifs abritant une liste impressionnante d'espèces arctiques et alpines. Parmi les raretés figure la cassiope tétragone (Cassiope tetragona), tandis que la saxifrage paniculée (Saxifraga paniculata) n'existe que dans trois localités en Norvège, Junkerdal concentrant sa population majeure. Laîche du Groenland, pavot de Tromsø, drave hémisphérique, vergerette noirâtre et arnica des montagnes y atteignent leur frontière sud. C'est pourquoi la flore orientale bénéficia de mesures de sauvegarde dès 1928, étendues en 1935."
    wildlife: "C'est le royaume des grands carnivores : le [glouton](/especie/gulo_gulo/) et le [lynx boréal](/especie/lynx_lynx/) y résident à l'année, tandis que l'[ours brun](/especie/ursus_arctos/) traverse occasionnellement le parc. L'[élan](/especie/alces_alces/) et les hardes de [rennes](/especie/rangifer_tarandus/) sont fréquents, ces derniers y trouvant des pâtures estivales et hivernales permanentes.\r\n\r\nL'avifaune constitue un autre atout majeur. Des nicheurs rares en Norvège y trouvent refuge : le [faucon gerfaut](/especie/falco_rusticolus/), l'[aigle royal](/especie/aquila_chrysaetos/), le plongeon catmarin, le plongeon huard et l'harelde boréale. Des sites de nidification d'aigle botté sont connus, et Junkerdal est un carrefour vital pour oiseaux aquatiques, limicoles et passereaux. On y recense aussi des papillons diurnes rares, comme l'azuré polaire et le moiré lapon. Tourbières à palses et mares d'altitude hébergent une microfaune méconnue."
    visit: "La Nordlandsruta traverse le parc sur des sentiers DNT parfaitement balisés, rythmés par des refuges gardés et cabanes en libre-service, la plus emblématique étant Argaladhytta ; quatre grands chalets touristiques et plusieurs abris jalonnent les vallées. Au nord s'élève Jakobsbakken, ancien village minier de cuivre dont les bâtisses du début du XXe siècle témoignent du passé métallurgique.\r\n\r\nPour débuter son séjour, le centre des parcs nationaux du Nordland (Besøkssenter nasjonalpark Nordland), à Storjord (Saltdal), constitue la porte d'entrée incontournable. Il accueille l'exposition permanente « Uerstattelig » (Irremplaçable), ouverte en 2005, et anime des ateliers d'initiation à la nature. Agréé par l'Agence norvégienne pour l'environnement, il fédère cinq parcs nationaux, idéalement positionné entre Saltfjellet-Svartisen et Junkerdal."
    history: "Junkerdal est avant tout un territoire culturel sami séculaire : l'élevage du renne y est pratiqué depuis le XVIe ou XVIIe siècle, parsemé de vestiges de tentes traditionnelles, de huttes de tourbe (goahti), d'abris de chasse et de foyers de campement, avec des ruines de fermes samies sédentaires à la limite des arbres. On relève également des traces de fenaison d'altitude, de pêche coutumière, de piégeage et d'anciennes prospections minières. Selon la tradition, le toponyme commémore le gouverneur Preben von Ahnen, surnommé « le junker », qui franchit le col en 1658 pour attaquer et dévaster la mine d'argent suédoise de Nasa.\r\n\r\nLe parc national a été créé le 9 janvier 2004 afin de préserver un grand ensemble intact garantissant la biodiversité, le patrimoine géologique et les mémoires pastorales, accordant une primauté absolue à sa flore remarquable. Il dispose d'un plan de gestion établi en 2008 complété par une stratégie d'accueil. Le pasteur botaniste Søren Christian Sommerfelt décrivit le premier cette flore d'exception dans les années 1820."
    before: >-
      Les hardes de rennes témoignent d'un élevage coutumier bien vivant : le parc prie les visiteurs de ne
      pas chercher à les approcher et de faire preuve d'une discrétion absolue. Des cabanes sont disposées sur
      les itinéraires, mais vérifiez leur état et les conditions de montagne avant de partir.
    around: >-
      Le [parc national de Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/) se trouve à
      environ huit kilomètres, le [parc national de Padjelanta](/lugar/padjelanta-national-park/) à environ
      vingt-et-un kilomètres et le [parc national de Rago](/lugar/rago-national-park/) à environ vingt-neuf
      kilomètres. Plus au sud, le [parc national de Jotunheimen](/lugar/jotunheimen-national-park/) partage
      avec Junkerdal le glouton et l'aigle royal en haute montagne.
  de:
    intro: >-
      Junkerdal liegt im Regenschatten östlich des mächtigen Gletschers Svartisen, und diese geschützte Lage
      verändert alles. Der Sommer ist hier vergleichsweise warm und trocken; auf kalkhaltigem Glimmerschiefer
      entfaltet sich daraus ein botanisches Meisterwerk. Blumen gedeihen in erstaunlicher Fülle und
      Seltenheit: Mehrere arktische Pflanzenarten haben hier ihre südlichste Verbreitungsgrenze. Der
      Nationalpark umfasst rund 682 km² zwischen Sulitjelma und Junkerdal in den Kommunen Saltdal und Fauske
      und ist im Grunde ein alpiner botanischer Urgarten an der schwedischen Grenze.
    landscape: "Das Relief wurde von eiszeitlichen Gletschern ausgehobelt. Im Norden liegen weite Hochflächen voller Seen, deren größter der Balvatnet ist; im Zentrum ragen breite Tafelberge auf, überragt von der kühnen Felspyramide des Solvågtinden. Nach Süden nimmt die Landschaft kontinentalen Charakter an: weite Trogtäler in U-Form und mächtige Gneis- und Granitmassive. Das gesamte Areal gehört zu den größten zusammenhängenden Wildnisgebieten Nordeuropas ohne technische Infrastruktur.\r\n\r\nDas Urgestein ist der Schlüssel zur Pflanzenwelt. Weicher Kalkstein, das sonnige Regenschattenklima und trockene Sommermonate begünstigen eine überaus artenreiche Flora; mancher Berg weist eine beispiellose Dichte arktischer und alpiner Gewächse auf. Zu den Kostbarkeiten zählt die Vierkantige Moosheide (Cassiope tetragona); die Rispen-Steinbrechart Saxifraga paniculata kommt in ganz Norwegen an nur drei Orten vor, mit ihrem Hauptvorkommen im Junkerdal. Grönland-Segge, Tromsø-Mohn, Halbkugeliges Felsenblümchen, Schwarzes Berufkraut und Berg-Wohlverleih erreichen hier ihren südlichsten Vorposten. Deshalb wurde die Ostflora bereits 1928 unter Schutz gestellt und das Reservat 1935 vergrößert."
    wildlife: "Das Tal ist ein etabliertes Raubtierrevier: [Vielfraß](/especie/gulo_gulo/) und [Eurasischer Luchs](/especie/lynx_lynx/) leben ganzjährig im Park, und auch der [Braunbär](/especie/ursus_arctos/) wandert regelmäßig durch. [Elche](/especie/alces_alces/) und Rentiere ([Ren](/especie/rangifer_tarandus/)) sind allgegenwärtig, wobei die Rentiere die Hochebenen zu allen Jahreszeiten beweiden.\r\n\r\nDie Vogelwelt ist ein weiterer Anziehungspunkt. Seltene Brutvögel Norwegens finden hier Lebensraum: [Gerfalke](/especie/falco_rusticolus/), [Steinadler](/especie/aquila_chrysaetos/), Sterntaucher, Prachttaucher und Eisenten. Auch Zwergadler haben hier bekannte Brutplätze, und der Park dient als bedeutendes Brutgebiet für Wasservögel, Limikolen und Singvögel. Seltene Tagfalter wie der Polar-Bläuling und der Gelbling Colias hecla fliegen über die Matten. Palsamoore, Tümpel und Feuchtgebiete bieten einer spezialisierten Insekten- und Vogelwelt Zuflucht."
    visit: "Die historische Nordlandsruta durchquert den Park auf gut markierten DNT-Wegen, flankiert von Schutzhütten, unter denen die Argaladhytta die bekannteste ist; vier große Wanderhütten und mehrere offene Notunterkünfte verteilen sich im Gebiet. Nördlich des Parks liegt Jakobsbakken, eine alte Bergbausiedlung, deren historische Holzgebäude aus dem frühen zwanzigsten Jahrhundert an den einstigen Kupferbergbau erinnern.\r\n\r\nFür den Einstieg empfiehlt sich das Besucherzentrum der Nationalparks von Nordland (Besøkssenter nasjonalpark Nordland) in Storjord (Saltdal). Es präsentiert die 2005 eröffnete Dauerausstellung «Uerstattelig» (Unersetzlich) zu Natur und Kultur und bietet Naturerlebnisprogramme. Es ist von der Umweltbehörde für fünf Nationalparks autorisiert und liegt verkehrsgünstig zwischen Saltfjellet-Svartisen und Junkerdal."
    history: "Junkerdal ist tief in der samischen Kulturgeschichte verwurzelt: Die Rentierhaltung wird hier seit dem sechzehnten oder siebzehnten Jahrhundert ausgeübt, wovon Reste von Zeltplätzen, Torfhütten (Goahti), Jagdunterständen, Fanggruben und Herdstellen zeugen, am Waldrand auch Ruinen dauerhafter samischer Gehöfte. Auch Spuren historischer Heumahd, Fischerei, Fallenjagd und Schürfversuche sind erhalten. Seinen Namen verdankt das Tal der Überlieferung nach Preben von Ahnen, «dem Junker», der 1658 durch die Schlucht zog, um die schwedische Silbermine auf der Nasa zu zerstören.\r\n\r\nDer Nationalpark wurde am 9. Januar 2004 ausgewiesen, um ein weitgehend unberührtes Wildnisgebiet für Biodiversität, Geologie und Kulturdenkmäler zu sichern, mit herausragendem Fokus auf die Flora. Ein Managementplan von 2008 steuert den Schutz. Pfarrer Søren Christian Sommerfelt aus Saltdal beschrieb die einzigartige Flora erstmals in den 1820er Jahren."
    before: >-
      Die Rentierherden sind gelebte Weidetradition: Die Parkverwaltung bittet Besucher eindringlich, nicht
      aktiv nach Tieren zu suchen und respektvollen Abstand zu halten. Auf den Routen gibt es Hütten; prüfe
      ihren Zustand und die Wetterbedingungen vor dem Aufbruch.
    around: >-
      Der [Saltfjellet-Svartisen-Nationalpark](/lugar/saltfjellet-svartisen-nasjonalpark/) liegt rund acht
      Kilometer entfernt, der [Padjelanta-Nationalpark](/lugar/padjelanta-national-park/) etwa einundzwanzig
      Kilometer und der [Rago-Nationalpark](/lugar/rago-national-park/) etwa neunundzwanzig Kilometer. Weiter
      südlich teilt der [Jotunheimen-Nationalpark](/lugar/jotunheimen-national-park/) mit Junkerdal Vielfraß
      und Steinadler im alpinen Lebensraum.
  it:
    intro: >-
      Junkerdal si colloca nell'ombra pluviometrica a est del ghiacciaio Svartisen, un fattore geografico che
      muta radicalmente il clima locale. Qui l'estate è calda e soleggiata; sul substrato calcareo e
      micascistoso ciò si traduce in un trionfo floreale. I fiori vi crescono con profusione e rarità
      straordinarie: svariate specie artiche toccano in questa valle il proprio limite meridionale. Il parco
      nazionale, esteso per circa 682 km² tra Sulitjelma e Junkerdal nei territori comunali di Saltdal e
      Fauske, è in sostanza un giardino botanico alpino a ridosso del confine con la Svezia.
    landscape: "La morfologia è stata modellata dall'era glaciale. A settentrione si distendono altopiani costellati da laghi, di cui il Balvatnet è il maggiore; nel settore centrale i rilievi assumono profili tabulari attorno alla conca, su cui si impone la sagoma acuminata del Solvågtinden. Verso meridione il paesaggio manifesta il suo carattere continentale: ampie vallate a U e massicci di gneiss e granito. L'intero comprensorio appartiene a una delle più vaste aree selvagge incontaminate da infrastrutture dell'intera Europa boreale.\r\n\r\nLa roccia madre svela l'enigma della ricchezza vegetale. Il calcare tenero, il microclima riparato e l'estate asciutta sostengono comunità vegetali composite, con alcune cime che ospitano florilegi di specie artiche e alpine. Tra le rarità spicca l'alberello artico (Cassiope tetragona), mentre la sassifraga alpina (Saxifraga paniculata) alligna in sole tre località in Norvegia, raggiungendo a Junkerdal la massima consistenza. La carice di Groenlandia, il papavero di Tromsø, la draba sferoidale e l'arnica alpina raggiungono qui il loro estremo sud. Per tali motivi la flora orientale fu sottoposta a vincolo già nel 1928, con tutela ampliata nel 1935."
    wildlife: "È un territorio d'elezione per i grandi predatori: il [ghiottone](/especie/gulo_gulo/) e la [lince europea](/especie/lynx_lynx/) popolano stabilmente l'area, con passaggi periodici dell'[orso bruno](/especie/ursus_arctos/). L'[alce](/especie/alces_alces/) e la [renna](/especie/rangifer_tarandus/) sono largamente diffusi, con mandrie di renne che pascolano sui pianori montani in ogni stagione dell'anno.\r\n\r\nL'avifauna rappresenta un richiamo altrettanto prestigioso. Vi nidificano uccelli rari: il [girfalco](/especie/falco_rusticolus/), l'[aquila reale](/especie/aquila_chrysaetos/), la strolaga minore, la strolaga maggiore e la moretta codona. Sono censite nidificazioni di poiana scalzata, e Junkerdal funge da importante bacino riproduttivo per anseriformi, limicoli, rapaci e passeriformi. Si rinvengono farfalle alpine esclusive come la licena polare. Le torbiere a palsa, le pozze di disgelo e i pascoli umidi ospitano una microfauna ancora parzialmente inesplorata."
    visit: "La celebre Nordlandsruta attraversa il parco lungo sentieri DNT ben segnalati, supportati da rifugi custoditi e bivacchi alpini, tra cui il più noto è l'Argaladhytta; all'interno operano quattro grandi rifugi turistici e diversi punti d'appoggio. A nord sorge Jakobsbakken, antico insediamento minerario di rame i cui edifici in legno d'inizio del secolo XX testimoniano l'operoso passato estrattivo.\r\n\r\nPer avviare la perlustrazione, il Centro parchi nazionali del Nordland (Besøkssenter nasjonalpark Nordland), a Storjord (Saltdal), costituisce l'approdo ideale. Ospita l'esposizione permanente «Uerstattelig» (Insostituibile), inaugurata nel 2005, incentrata su fauna, flora e tradizioni dell'Artico. Certificato dall'Agenzia per l'Ambiente per cinque parchi nazionali, sorge lungo l'arteria che unisce Saltfjellet-Svartisen e Junkerdal."
    history: "Junkerdal è anzitutto un paesaggio culturale e naturale sami: l'allevamento delle renne vi è praticato fin dal secolo XVI o XVII, con testimonianze di accampamenti estivi, capanne di torba (goahti), ripari di caccia, fosse di cattura e focolari, fino ai ruderi di fattorie sami stabili al limite del bosco. Residui storici documentano anche la fienagione d'alta quota, la pesca, il trappolaggio e le prospezioni minerarie. Il toponimo deriverebbe dal nobile danese Preben von Ahnen, «lo junker», che nel 1658 attraverso la forra guidò una spedizione militare per assaltare e distruggere la miniera d'argento svedese di Nasa.\r\n\r\nIl parco nazionale fu istituito il 9 gennaio 2004 per salvaguardare un vasto territorio integro destinato alla conservazione della biodiversità, della geodiversità e dei beni etnografici, con particolare riguardo per la flora esclusiva. Dispone di un piano di gestione del 2008 e di una strategia ricettiva. Il pastore protestante e naturalista Søren Christian Sommerfelt descrisse per primo questa flora straordinaria negli anni 1820."
    before: >-
      Le renne rappresentano una componente viva dell'economia pastorale tradizionale: la direzione del parco
      chiede di non avvicinare i branchi e di serbare massimo riserbo. Lungo i sentieri sono presenti rifugi,
      ma verifica il loro stato e l'innevamento prima di metterti in marcia.
    around: >-
      Il [Parco Nazionale di Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/) dista circa
      otto chilometri, il [Parco Nazionale di Padjelanta](/lugar/padjelanta-national-park/) circa ventuno
      chilometri e il [Parco Nazionale di Rago](/lugar/rago-national-park/) circa ventinove chilometri. Più a
      sud, il [Parco Nazionale di Jotunheimen](/lugar/jotunheimen-national-park/) condivide con Junkerdal la
      presenza di ghiottone e aquila reale nei paesaggi d'alta quota.
  pt:
    intro: >-
      Junkerdal situa-se na sombra de chuva a leste do glaciar Svartisen, circunstância que transforma por
      completo o seu ambiente. O verão aqui é assinalavelmente quente e seco; sobre um substrato rico em
      calcário e xistos micáceos, esse clima gera uma extraordinária efervescência botânica. As flores
      manifestam-se em prodigiosa abundância e raridade: múltiplas espécies do Alto Ártico encontram nestas
      vertentes o seu limite de distribuição meridional. O parque nacional, com cerca de 682 km² entre
      Sulitjelma e Junkerdal nos municípios de Saltdal e Fauske, é na sua essência um jardim botânico alpino
      no limiar da fronteira sueca.
    landscape: "O relevo foi cinzelado pela Idade do Gelo. A norte estendem-se planaltos recortados por lagoas, sendo a maior o Balvatnet; no setor central, as montanhas abrem-se em mesas tabulares em torno da bacia, destacando-se a proeminência cónica do Solvågtinden. Para sul, o relevo adquire fisionomia continental: vales amplos em U e densos maciços gnáissicos e graníticos. A totalidade da área integra um dos maiores santuários naturais sem qualquer intervenção técnica da Escandinávia.\r\n\r\nA litologia clarifica a opulência botânica. O calcário friável, a exposição abrigada e o estio soalheiro potenciam a instalação de comunidades herbáceas raras, acolhendo determinados cumes uma lista impressionante de endemismos árticos e alpinos. Entre as joias locais conta-se a urze-ártica (Cassiope tetragona), enquanto a saxifraga-branca (Saxifraga paniculata) apenas ocorre em três locais em toda a Noruega, exibindo em Junkerdal o seu principal reduto. A espiguilha-da-gronelândia, a papoila-de-tromsø, a draba-semiesférica e a árnica-alpina atingem aqui a sua extrema-fronteira sul. Daí que a flora tenha sido consagrada logo em 1928, com proteção alargada em 1935."
    wildlife: "É território consolidado de grandes predadores: o [glutão](/especie/gulo_gulo/) e o [lince-euroasiático](/especie/lynx_lynx/) residem em permanência no parque, surgindo esporadicamente o [urso-pardo](/especie/ursus_arctos/). O [alce](/especie/alces_alces/) e as renas ([rena](/especie/rangifer_tarandus/)) são frequentes, pastando as renas nas pastagens montanhosas em todas as estações do ano.\r\n\r\nA avifauna constitui outro atrativo primordial. Nidificam no território aves de elevado valor: o [falcão-gerifalte](/especie/falco_rusticolus/), a [águia-real](/especie/aquila_chrysaetos/), a mobelha-pequena, a mobelha-grande e o pato-rabilongo. Identificam-se pousos de águia-calçada, assumindo Junkerdal relevo determinante para aves aquáticas, limícolas e passeriformes. Assinalam-se borboletas diurnas raras de cariz polar. As turfeiras com palsas e charcos sustentam comunidades de insetos e aves ainda pouco estudadas."
    visit: "A histórica Nordlandsruta atravessa o parque em trilhos DNT bem assinalados, servidos por cabanas vigiadas e refúgios de montanha, destacando-se a célebre Argaladhytta; no perímetro operam quatro grandes cabanas turísticas e vários abrigos de apoio. A norte situa-se Jakobsbakken, antigo entreposto mineiro cujos edifícios de madeira do início do século XX testemunham a faina mineira do cobre.\r\n\r\nPara introdução e contextualização, o Centro dos Parques Nacionais de Nordland (Besøkssenter nasjonalpark Nordland), em Storjord (Saltdal), é o portal de entrada incontornável. Apresenta a mostra permanente «Uerstattelig» (Insubstituível) inaugurada em 2005, dinamizando atividades de interpretação da natureza. Tutelado pela Agência do Ambiente para cinco áreas protegidas, situa-se no eixo entre Saltfjellet-Svartisen e Junkerdal."
    history: "Junkerdal é sobretudo uma paisagem cultural e natural sami: o pastoreio de renas é praticado desde o século XVI ou XVII, subsistindo vestígios de acampamentos sazonais, cabanas de turfa (goahti), abrigos venatórios, armadilhas e lareiras, com ruínas de quintas permanentes no limite superior da floresta. Persistem igualmente marcas de ceifa de montanha, faina piscatória, armadilhagem e prospecções geológicas. A toponímia homenageia, segundo a lenda, o nobre Preben von Ahnen, «o junker», que em 1658 atravessou o desfiladeiro para pilhar e destruir a mina sueca de prata de Nasa.\r\n\r\nO parque nacional foi decretado a 9 de janeiro de 2004 com o intuito de manter um grande território intocado que preserve a biodiversidade, a geologia e a memória humana, conferindo protagonismo à sua flora incomparável. Rege-se por plano de gestão desde 2008 acompanhado de plano de visitação. O pároco botânico Søren Christian Sommerfelt foi o pioneiro a catalogar a flora na década de 1820."
    before: >-
      As manadas de renas representam uma atividade pastoril em pleno exercício: o parque solicita aos
      caminhantes que não se aproximem ativamente e que mantenham conduta respeitosa. Há cabanas ao longo das
      rotas, mas confirma o seu estado e as condições da montanha antes de partir.
    around: >-
      O [Parque Nacional de Saltfjellet-Svartisen](/lugar/saltfjellet-svartisen-nasjonalpark/) dista cerca de
      oito quilómetros, o [Parque Nacional de Padjelanta](/lugar/padjelanta-national-park/) cerca de vinte e
      um quilómetros e o [Parque Nacional de Rago](/lugar/rago-national-park/) cerca de vinte e nove
      quilómetros. Mais a sul, o [Parque Nacional de Jotunheimen](/lugar/jotunheimen-national-park/) partilha
      com Junkerdal a presença do glutão e da águia-real na alta montanha.
