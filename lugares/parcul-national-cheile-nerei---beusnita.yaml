resumen:
  es: Las gargantas calizas más largas de Rumanía con lagos karst turquesas y bosques vírgenes submediterráneos.
  en: Romania's longest limestone gorges with turquoise karst lakes and virgin sub-Mediterranean woodlands.
  fr: >-
    Les plus longues gorges calcaires de Roumanie abritant des lacs karstiques turquoise et des forêts
    primaires subméditerranéennes.
  de: Rumäniens längste Kalksteinschluchten mit türkisfarbenen Karstseen und submediterranen Urwäldern.
  it: Le gole calcaree più lunghe della Romania con laghi carsici turchesi e foreste vergini submediterranee.
  pt: >-
    Os mais extensos desfiladeiros calcários da Roménia com lagoas cársticas cor de turquesa e matas virgens
    submediterrânicas.
unico:
  es: >-
    Una garganta salvaje con manantiales que fabrican travertino, cascadas y lagos, y hayedos seculares que
    desde 2017 forman parte del Patrimonio Mundial.
  en: >-
    A wild gorge with travertine-forming springs, cascades, and karst tarns, alongside ancient beech woods
    listed as World Heritage since 2017.
  fr: >-
    Une gorge sauvage ponctuée de sources pétrifiantes, de cascades et de lacs karstiques, et de vieilles
    hêtraies inscrites au patrimoine mondial depuis 2017.
  de: >-
    Eine wilde Schlucht mit Travertinquellen, Wasserfällen und Karstseen sowie Buchenurwäldern, die seit 2017
    zum Weltnaturerbe gehören.
  it: >-
    Una forra selvaggia con sorgenti travertinose, cascate e laghetti carsici, e faggete vetuste annoverate
    dal 2017 nel Patrimonio Mondiale.
  pt: >-
    Uma garganta selvagem com nascentes que formam travertino, cascatas e lagoas cársticas, e fagetos
    seculares inscritos no Património Mundial desde 2017.
observaciones:
  es: >-
    Los vehículos y los turistas solo pueden ir por las rutas establecidas y marcadas, y está prohibido
    acampar fuera de los lugares habilitados. No se debe alimentar ni molestar a los animales salvajes en su
    medio natural. En la ruta principal hay que tener cuidado con las víboras, y el vado hace imposible el
    paso cuando el río baja crecido; consulta antes con la administración.
texto:
  es:
    intro: >-
      Casi veintitrés kilómetros de garganta cavada por un solo río. El Nera ha abierto en las calizas
      jurásicas del sur de los montes Anina un desfiladero tan encajado que la ruta que lo recorre sigue el
      cauce de cerca, entre paredes verticales, y a ratos pisa un sendero excavado en la roca. El Parque
      Nacional Cheile Nerei-Beușnița ocupa 36.758 hectáreas en el condado de Caraș-Severin, en el suroeste del
      país, y protege los ecosistemas del karst dentro de la categoría II.
    landscape: >-
      Todo lo arma el agua. El Nera, la columna vertebral del parque, se encaja entre laderas escarpadas, y
      sus afluentes, el Beu y el Șușara, bajan desde las alturas hasta unirse con él. En el camino, numerosos
      manantiales petrificantes forman travertino y dan lugar a cascadas y a lagos naturales: el Lacul
      Dracului, las famosas cascadas de Beușnița, el lago Ochiul Beului y las cascadas Bigăr, Șușara y
      Moceriș.


      Alrededor, el karst: roquedos calizos, dolinas, cuevas como la Peștera Lenuța, la Peștera de sub Padina
      Popii o la Peștera Bijuteria, y pastos sobre roca. Dentro del parque hay reservas como Cheile
      Nerei-Beușnița, Izvorul Bigăr, Cheile Șușarei, Ducin, Valea Ciclovei-Ilidia, Dealul Cărăula y Poiana
      Lisovacea.
    wildlife: >-
      Los hayedos seculares, con avellanos turcos que crecen aquí y allá, se alternan con matorrales
      xerotermófilos de lila, mojdrean y zumaque y con pastos sobre los roquedos calizos. Esa mezcla explica
      la riqueza del parque: pueden encontrarse más de la mitad de las especies de orquídeas silvestres de
      Rumanía, y entre las plantas de interés europeo figura la orquídea *Himantoglossum caprinum*.


      Los bosques y el mosaico de paisajes sirven a 9 de las 10 especies de pájaros carpinteros que hay en el
      país. Las cuevas y simas dan refugio a más de dos tercios de las especies de murciélagos de Rumanía,
      entre ellos *Myotis myotis* y *Rhinolophus ferrumequinum*. Los roquedos albergan algunas de las
      poblaciones nidificantes de [halcón peregrino](/especie/falco_peregrinus/) más importantes del país, y
      las zonas salvajes de difícil acceso son terreno de caza del [lince](/especie/lynx_lynx/). Entre los
      mamíferos de la directiva europea figuran también el [lobo](/especie/canis_lupus/) y, en los ríos ricos
      en peces, varias familias de [nutrias](/especie/lutra_lutra/).


      El parque protege dos especies relictas terciarias: el molusco *Amphimelania holandri* y el pez *Cobitis
      elongata*. El clima submediterráneo y el paisaje kárstico permiten ver especies como el escorpión de los
      Cárpatos o la [víbora cornuda](/especie/vipera_ammodytes/). Entre los invertebrados hay [ciervo
      volante](/especie/lucanus_cervus/) y la libélula *Cordulegaster heros*.
    visit: >-
      Hay tres rutas en las que apoyarse. La principal, Șopotu Nou–Cheile Nerei–Podul Bei–Sasca Română, mide
      24 kilómetros y dura nueve horas. Sigue el cauce, casi sin subidas ni bajadas fuertes, y en algunos
      tramos el sendero va excavado en la roca como una terraza, asegurado con cables. Cruza el Nera por un
      vado y no se puede hacer con el río crecido. Se puede hacer en un día, pero se recomienda pasar la noche
      en tienda en el cantón Damian o recorrerla por tramos.


      Otra, Sasca Română–Sasca Montană–cascada Șușara–Cărbunari, tiene ocho kilómetros y dura tres horas.
      Desde el final de Sasca Montană se entra en las gargantas de Șușara, que se recorren por un sendero a la
      sombra hasta la cascada, y una subida más fuerte lleva a la meseta kárstica de Cărbunari.


      La tercera, Podul Bei–Ochiul Beiului–Crivina–Cheile Minișului–Cabana Buhui, contempla una caminata de
      doce horas. Sigue un antiguo ferrocarril forestal con varios túneles viejos y es más difícil porque el
      camino forestal está dañado en algunos tramos.
    history: >-
      Desde 2017, más de 4000 hectáreas de hayedos del parque, representativos a escala europea, forman parte
      del Patrimonio Mundial de la UNESCO.
    before: >-
      Los vehículos y los turistas solo pueden ir por las rutas establecidas y marcadas, y está prohibido
      acampar fuera de los lugares habilitados. No se debe alimentar ni molestar a los animales salvajes en su
      medio natural. En la ruta principal hay que tener cuidado con las víboras, y el vado hace imposible el
      paso cuando el río baja crecido; consulta antes con la administración.
    around: >-
      A once kilómetros queda el [Parque Nacional Semenic - Gargantas del
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/) y, a la misma distancia, la [Reserva Natural
      Bosque Primario Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/). A 21 km está el
      [Parque Nacional Đerdap - Puerta de Hierro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/). Con el
      [Parque Nacional Desfiladero del Jiu - Bosque
      Primario](/lugar/parcul-national-defileul-jiului-codrii-seculari/) comparte la víbora cornuda y el oso
      pardo, y las gargantas y el bosque primario; con la [Garganta de Sohodol](/lugar/cheile-sohodolului/),
      la víbora cornuda y el karst.
  en:
    intro: >-
      Nearly twenty-three kilometres of sheer canyon carved by a single river. Through the Jurassic limestones
      of the southern Anina Mountains, the Nera has hollowed a defile so narrow that the trail hugs the
      riverbed between vertical cliffs, at times traversing ledges hewn into the bedrock. Cheile
      Nerei-Beușnița National Park encompasses 36,758 hectares in Caraș-Severin County in southwestern
      Romania, protecting rich karst ecosystems under IUCN category II.
    landscape: >-
      Water shapes everything here. The Nera, the park's ecological spine, slices between precipitous slopes,
      joined by descending tributaries including the Beu and Șușara. Along their course, petrifying springs
      deposit travertine, giving rise to cascades and natural tarns: Lacul Dracului, the celebrated Beușnița
      waterfalls, Ochiul Beului, and the Bigăr, Șușara, and Moceriș waterfalls.


      All around lies classic karst: limestone crags, sinkholes, caves including Peștera Lenuța, Peștera de
      sub Padina Popii, and Peștera Bijuteria, and rocky pastures. The park shelters protected reserves like
      Cheile Nerei-Beușnița, Izvorul Bigăr, Cheile Șușarei, Ducin, Valea Ciclovei-Ilidia, Dealul Cărăula, and
      Poiana Lisovacea.
    wildlife: >-
      Ancient beech forests studded with scattered Turkish hazelnuts alternate with thermophilic scrub of
      lilac, flowering ash, and smoke bush, as well as limestone cliff pastures. This rich mosaic hosts more
      than half of Romania's wild orchid species, including the European priority species *Himantoglossum
      caprinum*.


      The woodlands and open habitats support 9 of the 10 woodpecker species present in Romania. Caverns and
      sinkholes shelter more than two-thirds of the country's bat species, notably *Myotis myotis* and
      *Rhinolophus ferrumequinum*. Cliff faces harbour some of Romania's premier nesting [peregrine
      falcons](/especie/falco_peregrinus/), while rugged, untamed sectors provide hunting grounds for the
      [Eurasian lynx](/especie/lynx_lynx/). Further European protected mammals include the [grey
      wolf](/especie/canis_lupus/) and several families of [Eurasian otters](/especie/lutra_lutra/) along
      fish-rich streams.


      The park also protects two Tertiary relict species: the snail *Amphimelania holandri* and the loach
      *Cobitis elongata*. The sub-Mediterranean microclimate and karst relief foster species such as the
      Carpathian scorpion and the [nose-horned viper](/especie/vipera_ammodytes/). Notable invertebrates
      feature the [stag beetle](/especie/lucanus_cervus/) and the dragonfly *Cordulegaster heros*.
    visit: >-
      Three primary hiking routes span the park. The main traverse, Șopotu Nou–Cheile Nerei–Podul Bei–Sasca
      Română, extends 24 kilometres and takes nine hours. It follows the river with minimal major elevation
      changes, where sections are carved as narrow rock terraces secured by safety cables. It crosses the Nera
      via a ford impassable in flood conditions. It can be walked in a single day, though tent camping at
      Damian ranger post or hiking it in sections is recommended.


      A second trail, Sasca Română–Sasca Montană–Șușara Waterfall–Cărbunari, covers eight kilometres and lasts
      three hours. Leaving Sasca Montană, it penetrates the shaded Șușara gorge before climbing steeply to the
      Cărbunari karst plateau.


      A third option, Podul Bei–Ochiul Beiului–Crivina–Cheile Minișului–Cabana Buhui, entails a twelve-hour
      hike following an old logging railway with several vintage tunnels, made demanding by degraded trail
      stretches.
    history: >-
      Since 2017, more than 4000 hectares of the park's primeval beech forests, recognized as continentally
      significant, have been inscribed as part of the UNESCO World Heritage serial site.
    before: >-
      Vehicles and hikers must remain on designated, marked paths; camping outside authorized campsites is
      strictly banned. Do not feed or disturb wildlife. On the main gorge path watch for vipers, and note that
      the river ford becomes impassable during high waters; consult park staff beforehand.
    around: >-
      Eleven kilometres away lies [Semenic - Caraș Gorge National
      Park](/lugar/parcul-national-semenic---cheile-carasului/) and, at the same distance, [Valea Mare
      Primeval Forest Nature Reserve](/lugar/rezervatia-naturala-codrul-secular-valea-mare/). At 21 km is
      [Đerdap National Park - Iron Gate](/lugar/nacionalni-park-djerdap---puerta-de-hierro/). With [Jiu Gorge
      National Park - Primeval Forest](/lugar/parcul-national-defileul-jiului-codrii-seculari/) it shares the
      nose-horned viper, brown bear, gorges, and ancient forest; with [Sohodol
      Gorge](/lugar/cheile-sohodolului/), the nose-horned viper and karst terrain.
  fr:
    intro: >-
      Près de vingt-trois kilomètres de gorges creusées par une unique rivière. Dans les calcaires jurassiques
      du sud des monts Anina, la Nera a entaillé un défilé si resserré que l'itinéraire longe au plus près le
      lit des eaux entre de hautes parois verticales, empruntant par moments un sentier taillé à même la
      roche. Le parc national Cheile Nerei-Beușnița couvre 36 758 hectares dans le județ de Caraș-Severin, au
      sud-ouest de la Roumanie, protégeant des écosystèmes karstiques sous la catégorie II de l'UICN.
    landscape: >-
      L'eau orchestre l'ensemble du décor. La Nera, colonne vertébrale du parc, serpente au creux de versants
      abrupts, rejointe par ses affluents, le Beu et la Șușara, qui dévalent des crêtes. Sur leur cours,
      d'innombrables sources pétrifiantes déposent du tuf et engendrent des cascades et des lacs naturels : le
      Lacul Dracului, les cascades de Beușnița, le lac Ochiul Beului et les cascades Bigăr, Șușara et Moceriș.


      Tout autour s'impose le karst : falaises de calcaire, dolines, cavités souterraines comme la Peștera
      Lenuța, la Peștera de sub Padina Popii ou la Peștera Bijuteria, et pelouses sur rochers. Le parc englobe
      des réserves intégrales telles que Cheile Nerei-Beușnița, Izvorul Bigăr, Cheile Șușarei, Ducin, Valea
      Ciclovei-Ilidia, Dealul Cărăula et Poiana Lisovacea.
    wildlife: >-
      Les hêtraies anciennes, égayées de noisetiers de Byzance, alternent avec des fourrés xérothermiques de
      lilas, de frêne à fleurs et de sumac, ainsi qu'avec des pelouses rupicoles. Cette diversité abrite plus
      de la moitié des espèces d'orchidées sauvages de Roumanie, parmi lesquelles la remarquable
      *Himantoglossum caprinum*.


      Les forêts et la mosaïque de milieux nourrissent 9 des 10 espèces de pics présentes dans le pays.
      Grottes et gouffres abritent plus des deux tiers des espèces de chauves-souris de Roumanie, dont le
      grand murin et le grand rhinolophe. Les falaises hébergent des populations nicheuses majeures de [faucon
      pèlerin](/especie/falco_peregrinus/), tandis que les secteurs sauvages forment le territoire de chasse
      du [lynx boréal](/especie/lynx_lynx/). Le [loup](/especie/canis_lupus/) et, sur les cours d'eau
      poissonneux, plusieurs familles de [loutres d'Europe](/especie/lutra_lutra/) comptent parmi les
      mammifères protégés.


      Le parc préserve deux reliques tertiaires : le gastéropode *Amphimelania holandri* et le poisson
      *Cobitis elongata*. Le climat subméditerranéen et le relief karstique favorisent le scorpion des
      Carpates ou la [vipère ammodyte](/especie/vipera_ammodytes/). Côté insectes figurent le [lucane
      cerf-volant](/especie/lucanus_cervus/) et la libellule *Cordulegaster heros*.
    visit: >-
      Trois itinéraires principaux permettent la découverte du parc. Le tracé majeur, Șopotu Nou–Cheile
      Nerei–Podul Bei–Sasca Română, parcourt 24 kilomètres en neuf heures. Il suit la rivière sans dénivelés
      excessifs, avec des passages en vire taillée dans la roche et sécurisés par des câbles. Il traverse la
      Nera à gué, impraticable lors des crues. On peut le parcourir en un jour, mais le bivouac sous tente au
      canton Damian ou un fractionnement par étapes sont vivement conseillés.


      Un autre parcours, Sasca Română–Sasca Montană–cascade Șușara–Cărbunari, compte huit kilomètres pour
      trois heures de marche. En quittant Sasca Montană, on s'engage dans les gorges ombragées de la Șușara
      jusqu'à la cascade avant de monter sur le plateau de Cărbunari.


      La troisième option, Podul Bei–Ochiul Beiului–Crivina–Cheile Minișului–Cabana Buhui, représente une
      excursion de douze heures suivant une ancienne voie ferrée forestière jalonnée de vieux tunnels, rendue
      exigeante par des passages ravinés.
    history: >-
      Depuis 2017, plus de 4000 hectares de hêtraies primaires du parc figurent au patrimoine mondial de
      l'UNESCO.
    before: >-
      Véhicules et randonneurs doivent respecter les itinéraires balisés ; le camping est prohibé hors des
      espaces dédiés. Ne nourrissez pas et ne dérangez pas les animaux sauvages. Prenez garde aux vipères et
      rappelez-vous que le gué devient infranchissable par hautes eaux ; informez-vous auprès du parc.
    around: >-
      À onze kilomètres se situe le [parc national Semenic - Gorges du
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/) et, à égale distance, la [réserve naturelle
      de la forêt primaire de Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/). À 21 km
      s'étend le [parc national Đerdap - Porte de Fer](/lugar/nacionalni-park-djerdap---puerta-de-hierro/).
      Avec le [parc national des gorges du Jiu - Forêt
      primaire](/lugar/parcul-national-defileul-jiului-codrii-seculari/), il partage la vipère ammodyte,
      l'ours brun, les défilés et la forêt ancienne ; avec les [gorges de
      Sohodol](/lugar/cheile-sohodolului/), la vipère ammodyte et le karst.
  de:
    intro: >-
      Fast dreiundzwanzig Kilometer Schlucht, von einem einzigen Fluss geschaffen. In den jurassischen Kalken
      des südlichen Anina-Gebirges hat die Nera eine Felsklamm eingeschnitten, die so eng ist, dass der
      Wanderweg dicht am Flussbett zwischen Steilwänden verläuft und streckenweise auf in den Fels gemeißelten
      Bändern liegt. Der Nationalpark Cheile Nerei-Beușnița umfasst 36.758 Hektar im Kreis Caraș-Severin im
      Südwesten des Landes und schützt artenreiche Karstökosysteme der IUCN-Kategorie II.
    landscape: >-
      Das Wasser formt die gesamte Szenerie. Die Nera als Hauptachse des Parks windet sich zwischen
      Steilhängen, gespeist von Zuflüssen wie Beu und Șușara, die von den Höhen hinabfließen. Unterwegs
      scheiden Karstquellen Travertin ab und formen Wasserfälle sowie Naturseen: den Lacul Dracului, die
      Beușnița-Kaskaden, den Ochiul Beului sowie die Wasserfälle Bigăr, Șușara und Moceriș.


      Ringsum herrscht reiner Karst: Kalkriffe, Dolinen, Höhlen wie Peștera Lenuța, Peștera de sub Padina
      Popii oder Peștera Bijuteria sowie Felsrasen. Im Park liegen Totalreservate wie Cheile Nerei-Beușnița,
      Izvorul Bigăr, Cheile Șușarei, Ducin, Valea Ciclovei-Ilidia, Dealul Cărăula und Poiana Lisovacea.
    wildlife: >-
      Jahrhundertealte Buchenbestände mit Baum-Haseln wechseln mit submediterranen Buschwäldern aus Flieder,
      Manna-Esche und Perückenstrauch sowie Kalkmagerrasen ab. Dieses Biotopmosaik beherbergt über die Hälfte
      aller wilden Orchideenarten Rumäniens, darunter die europäische Leitart *Himantoglossum caprinum*.


      Die Wälder bieten Lebensraum für 9 der 10 in Rumänien heimischen Spechtarten. Höhlen und Felsspalten
      gewähren mehr als zwei Dritteln aller Fledermausarten des Landes Unterschlupf, darunter dem Großen
      Mausohr und der Großen Hufeisennase. Die Felswände beherbergen bedeutende Brutpaare des
      [Wanderfalken](/especie/falco_peregrinus/), während unwegsame Wildnisreviere dem [Eurasischen
      Luchs](/especie/lynx_lynx/) als Jagdgebiet dienen. Der [Wolf](/especie/canis_lupus/) und mehrere
      [Eurasische Fischotter](/especie/lutra_lutra/) an den fischreichen Gewässern zählen ebenfalls zu den
      geschützten Säugetieren.


      Der Park beherbergt zwei Tertiärrelikte: die Schnecke *Amphimelania holandri* und den Schmerlenfisch
      *Cobitis elongata*. Das milde Klima und die Karstlandschaft begünstigen den Karpatenskorpion und die
      [Europäische Hornotter](/especie/vipera_ammodytes/). Bei den Insekten fallen der
      [Hirschkäfer](/especie/lucanus_cervus/) und die Libelle *Cordulegaster heros* auf.
    visit: >-
      Drei Hauptrouten erschließen die Schluchtlandschaft. Die Hauptroute Șopotu Nou–Cheile Nerei–Podul
      Bei–Sasca Română misst 24 Kilometer und beansprucht neun Stunden. Sie folgt dem Wasserlauf ohne steile
      Anstiege, abschnittsweise über drahtseilgesicherte Felssteige. Sie quert die Nera über eine Furt, die
      bei Hochwasser unpassierbar wird. Die Tour ist an einem Tag machbar, doch empfiehlt sich eine
      Zeltübernachtung am Forsthaus Damian oder eine etappenweise Erkundung.


      Eine zweite Route von Sasca Română über Sasca Montană zum Șușara-Wasserfall nach Cărbunari misst acht
      Kilometer und dauert drei Stunden. Ab Sasca Montană folgt sie der schattigen Șușara-Klamm und steigt
      anschließend zum Karstplateau von Cărbunari an.


      Die dritte Variante, Podul Bei–Ochiul Beiului–Crivina–Cheile Minișului–Cabana Buhui, bedeutet eine
      zwölfstündige Wanderung entlang einer alten Waldbahntrasse mit mehreren Tunneln, die stellenweise durch
      Wegschäden erschwert wird.
    history: >-
      Seit 2017 gehören mehr als 4000 Hektar Buchenurwälder des Parks als repräsentativer Bestandteil zum
      UNESCO-Welterbe.
    before: >-
      Fahrzeuge und Wanderer dürfen nur auf den ausgewiesenen Wegen verkehren; wildes Zelten außerhalb
      gekennzeichneter Plätze ist untersagt. Füttere oder beunruhige keine Wildtiere. Achte auf Hornottern und
      beachte, dass die Flussfurt bei Hochwasser unpassierbar ist; frage vorab bei der Parkverwaltung an.
    around: >-
      Elf Kilometer entfernt liegt der [Nationalpark Semenic -
      Caraș-Klamm](/lugar/parcul-national-semenic---cheile-carasului/) und im selben Abstand das
      [Naturreservat Urwald Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/). In 21 km
      Entfernung liegt der [Nationalpark Đerdap - Eisernes
      Tor](/lugar/nacionalni-park-djerdap---puerta-de-hierro/). Mit dem [Nationalpark Jiu-Schlucht -
      Urwälder](/lugar/parcul-national-defileul-jiului-codrii-seculari/) teilt er Hornotter, Braunbär, Klammen
      und Urwälder; mit der [Sohodol-Schlucht](/lugar/cheile-sohodolului/) Hornotter und Karst.
  it:
    intro: >-
      Quasi ventitré chilometri di orrido scavati da un unico fiume. Nei calcari giurassici del settore
      meridionale dei monti Anina, il Nera ha inciso un solco così serrato che la via escursionistica segue da
      vicino l'alveo tra falesie a picco, intagliandosi a tratti nella viva roccia. Il Parco Nazionale Cheile
      Nerei-Beușnița ricopre 36.758 ettari nel distretto di Caraș-Severin, nel sud-ovest della Romania,
      tutelando ecosistemi carsici inquadrati nella categoria II della IUCN.
    landscape: >-
      È l'acqua a modellare ogni elemento. Il Nera, asse portante del parco, scorre incassato tra versanti
      scoscesi, alimentato da affluenti come il Beu e la Șușara che scendono dalle cime. Lungo il corso,
      numerose sorgenti incrostanti creano travertino dando forma a cascate e specchi lacustri naturali: il
      Lacul Dracului, i salti di Beușnița, il lago Ochiul Beului e le cascate Bigăr, Șușara e Moceriș.


      All'intorno impera il carso: rupi calcaree, doline, cavità quali la Peștera Lenuța, la Peștera de sub
      Padina Popii o la Peștera Bijuteria, e pascoli rupestri. Il parco comprende riserve integrali come
      Cheile Nerei-Beușnița, Izvorul Bigăr, Cheile Șușarei, Ducin, Valea Ciclovei-Ilidia, Dealul Cărăula e
      Poiana Lisovacea.
    wildlife: >-
      Le faggete secolari, inframmezzate da noccioli di Costantinopoli, si alternano a boscaglie termofila di
      lillà, orniello e sommacco e a praterie di roccia calcarea. Questa eterogeneità ospita oltre la metà
      delle specie di orchidee selvatiche della Romania, compresa l'orchidea protetta *Himantoglossum
      caprinum*.


      I boschi sostengono 9 delle 10 specie di picchi presenti nel paese. Grotte e voragini ospitano più di
      due terzi delle specie di pipistrelli della Romania, tra cui il vespertilio maggiore e il ferro di
      cavallo maggiore. Le balze rocciose accolgono colonie nidificanti di [falco
      pellegrino](/especie/falco_peregrinus/), mentre le gole impervie costituiscono terreno di caccia della
      [lince](/especie/lynx_lynx/). Il [lupo grigio](/especie/canis_lupus/) e, lungo i corsi fluviali ricchi
      di fauna ittica, varie comunità di [lontre europee](/especie/lutra_lutra/) arricchiscono il patrimonio
      faunistico.


      Il parco preserva due relitti terziari: il gasteropode *Amphimelania holandri* e il cobite *Cobitis
      elongata*. L'influsso submediterraneo favorisce lo scorpione dei Carpazi e la [vipera dal
      corno](/especie/vipera_ammodytes/). Tra i coleotteri risalta il [cervo
      volante](/especie/lucanus_cervus/) assieme alla libellula *Cordulegaster heros*.
    visit: >-
      Tre percorsi escursionistici strutturano l'accesso al parco. Il tracciato cardine, Șopotu Nou–Cheile
      Nerei–Podul Bei–Sasca Română, misura 24 chilometri e richiede nove ore. Asseconda il corso del fiume
      senza dislivelli marcati, con tratti ricavati come cenge nella roccia attrezzate con funi d'acciaio.
      Guada il Nera attraverso un passaggio impraticabile durante le piene. È percorribile in un giorno, ma si
      suggerisce di pernottare in tenda presso il cantone Damian o di camminare a tappe.


      Un secondo itinerario, Sasca Română–Sasca Montană–cascata Șușara–Cărbunari, misura otto chilometri e
      impegna tre ore. Dalla fine di Sasca Montană si penetra nelle gole ombreggiate di Șușara fino alla
      cascata, prima di salire sull'altopiano carsico di Cărbunari.


      La terza possibilità, Podul Bei–Ochiul Beiului–Crivina–Cheile Minișului–Cabana Buhui, richiede una
      camminata di dodici ore lungo una dismessa ferrovia forestale con varie gallerie d'epoca, resa
      disagevole da tratti dissestati.
    history: >-
      Dal 2017, più di 4000 ettari di faggete primarie del parco sono entrati a far parte del Patrimonio
      Mondiale dell'UNESCO.
    before: >-
      Autoveicoli e comitive a piedi devono muoversi unicamente sulle direttrici autorizzate; è vietato il
      campeggio libero. Non disturbare la fauna. Lungo la gola presta attenzione alle vipere e ricorda che il
      guado è impraticabile con fiume ingrossato; informati preventivamente presso il personale del parco.
    around: >-
      A undici chilometri si trova il [Parco Nazionale Semenic - Gole del
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/) e, alla stessa distanza, la [Riserva Naturale
      Foresta Primaria Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/). A 21 km si estende
      il [Parco Nazionale Đerdap - Porta di Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/). Con il
      [Parco Nazionale Gole del Jiu - Foresta
      Primaria](/lugar/parcul-national-defileul-jiului-codrii-seculari/) condivide la vipera dal corno, l'orso
      bruno, le gole e la foresta vergine; con la [Gola di Sohodol](/lugar/cheile-sohodolului/), la vipera dal
      corno e il paesaggio carsico.
  pt:
    intro: >-
      Quase vinte e três quilómetros de desfiladeiro escavado por um único rio. Nos calcários jurássicos do
      sul dos montes Anina, o Nera rasgou um desfiladeiro tão estreito que o trilho caminha junto ao leito
      entre escarpas verticais, ora avançando por cornijas talhadas na rocha. O Parque Nacional Cheile
      Nerei-Beușnița ocupa 36.758 hectares no distrito de Caraș-Severin, no sudoeste do país, resguardando
      ecossistemas cársticos enquadrados na categoria II da UICN.
    landscape: >-
      A água é a escultora de todo o relevo. O Nera, espinha dorsal do parque, serpenteia entre encostas
      alcantiladas, acolhendo afluentes como o Beu e o Șușara que descem das serranias. No percurso, múltiplas
      nascentes petrificantes criam travertino e moldam cascatas e lagoas naturais: o Lacul Dracului, as
      célebres quedas de Beușnița, a lagoa Ochiul Beului e as cascatas Bigăr, Șușara e Moceriș.


      Em redor estende-se o carste: rochedos calcários, dolinas, grutas como a Peștera Lenuța, a Peștera de
      sub Padina Popii ou a Peștera Bijuteria, e pastagens pedregosas. O parque integra reservas estritas como
      Cheile Nerei-Beușnița, Izvorul Bigăr, Cheile Șușarei, Ducin, Valea Ciclovei-Ilidia, Dealul Cărăula e
      Poiana Lisovacea.
    wildlife: >-
      Os fagetos ancestrais, pontuados por aveleiras-da-turquia, alternam com matos xerotérmicos de lilás,
      freixo-de-flores e zrumbina, e pastagens sobre rocha calcária. Esse mosaico ecológico alberga mais de
      metade das espécies de orquídeas bravias da Roménia, incluindo a espécie de interesse europeu
      *Himantoglossum caprinum*.


      As matas e a diversidade ambiental sustentam 9 das 10 espécies de pica-paus existentes no país. As
      grutas e algares servem de abrigo a mais de dois terços das espécies de morcegos da Roménia, entre os
      quais o morcego-rato-grande e o morcego-de-ferradura-grande. As falésias rochosas acolhem importantes
      casais nidificantes de [falcão-peregrino](/especie/falco_peregrinus/), ao passo que os setores ermos
      constituem terreno de caça do [lince-euroasiático](/especie/lynx_lynx/). O
      [lobo-cinzento](/especie/canis_lupus/) e, nos ribeiros piscosos, várias famílias de
      [lontras-europeias](/especie/lutra_lutra/) integram os mamíferos protegidos.


      O parque protege duas relíquias terciárias: o molusco *Amphimelania holandri* e o peixe *Cobitis
      elongata*. O clima submediterrânico e o relevo cárstico favorecem o escorpião-dos-cárpatos ou a
      [víbora-cornuda](/especie/vipera_ammodytes/). Nos invertebrados ocorrem a
      [vaca-loura](/especie/lucanus_cervus/) e a libélula *Cordulegaster heros*.
    visit: >-
      A circulação apoia-se em três itinerários principais. O percurso cardeal, Șopotu Nou–Cheile Nerei–Podul
      Bei–Sasca Română, estende-se por 24 quilómetros e demora nove horas. Acompanha o rio com pouca oscilação
      de cota, dispondo de troços abertos em socalco na rocha guarnecidos por cabos. Vadeia o Nera por um
      passo intransponível em marés de cheia. Pode realizar-se num só dia, mas recomenda-se acampar em tenda
      no posto florestal Damian ou fracionar a travessia.


      Outro trilho, Sasca Română–Sasca Montană–cascata Șușara–Cărbunari, soma oito quilómetros e faz-se em
      três horas. A partir de Sasca Montană avança-se pelo desfiladeiro fresco de Șușara até à queda de água,
      antes de subir ao planalto cárstico de Cărbunari.


      A terceira via, Podul Bei–Ochiul Beiului–Crivina–Cheile Minișului–Cabana Buhui, implica uma caminhada de
      doze horas ao longo de um antigo ramal ferroviário florestal com vários túneis rústicos, dificultada por
      secções degradadas.
    history: >-
      Desde 2017, mais de 4000 hectares de fagetos seculares do parque encontram-se inscritos na lista do
      Património Mundial da UNESCO.
    before: >-
      Viaturas e pedestrianistas só podem circular nos trilhos oficiais sinalizados; é proibido acampar fora
      das zonas autorizadas. Não alimentes nem perturbes a fauna bravia. Mantém vigilância redobrada face às
      víboras e atenta a que o vau do rio impede a passagem em marés de água alta; consulta o parque com
      antecedência.
    around: >-
      A onze quilómetros ergue-se o [Parque Nacional Semenic - Gargantas do
      Caraș](/lugar/parcul-national-semenic---cheile-carasului/) e, à mesma distância, a [Reserva Natural da
      Floresta Virgem de Valea Mare](/lugar/rezervatia-naturala-codrul-secular-valea-mare/). A 21 km
      estende-se o [Parque Nacional Đerdap - Portas de
      Ferro](/lugar/nacionalni-park-djerdap---puerta-de-hierro/). Com o [Parque Nacional do Desfiladeiro do
      Jiu - Floresta Virgem](/lugar/parcul-national-defileul-jiului-codrii-seculari/) partilha a
      víbora-cornuda, o urso-pardo, as gargantas e a floresta virgem; com as [Gargantas de
      Sohodol](/lugar/cheile-sohodolului/), a víbora-cornuda e o relevo cárstico.
