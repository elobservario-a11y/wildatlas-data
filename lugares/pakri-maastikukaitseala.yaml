observaciones:
  es: >-
    El acantilado se desprende: no te acerques al borde. El gestor de la reserva publica el reglamento y la
    zonificación de los distintos sectores; consúltalos antes de visitar las islas.
texto:
  es:
    intro: >-
      El mar roe aquí un acantilado de caliza que se desmorona a cámara lenta. En el cabo de Pakri, en el
      extremo de la península que se adentra doce kilómetros en el Báltico, el borde de la costa sube hasta
      unos 25 metros y está tan a punto de caer que los constructores de faros tuvieron que levantar otro
      cuando el precipicio se acercó demasiado al primero. La reserva paisajística de Pakri, creada el 18 de
      mayo de 1998, protege esa costa, las islas Väike-Pakri y Suur-Pakri, el mar que las separa y los islotes
      Kappa y Bjärrgronne.
    landscape: >-
      La península de Pakri mide 12 km de largo y unos 40 km² y sale del noroeste de Estonia hacia el mar. Su
      pared más alta, de unos 25 metros, está en el cabo. La roca no es uniforme: las fracturas verticales y
      las capas de dureza distinta dejan un borde dentado, propenso a desprendimientos. Abajo, las olas
      muerden sin descanso las capas de arenisca del pie; arriba, la caliza aguanta, hasta que el vacío la
      vence. En el acantilado afloran además manantiales.


      En las islas la escarpa es más baja. Forma parte de la escarpa báltica y sube hasta 4 m en Suur-Pakri y
      hasta 13 m en Väike-Pakri. En las islas, la reserva protege los acantilados de caliza, los alvares y las
      especies raras.
    wildlife: >-
      Pakri se protege por su paisaje más que por un animal concreto: acantilados de caliza abiertos al mar y,
      en las islas, los alvares, esa capa fina de suelo sobre la roca. La reserva se creó en 1998 para
      cuidarlos, junto con las especies raras que viven en ellos.


      No hay una mala época para ir. La ruta de la costa, de Paldiski hasta el cabo, se propone en cualquier
      estación. Eso sí, el borde del acantilado cambia: comprueba su estado antes de acercarte.
    visit: >-
      La forma de entender el lugar es caminarlo. La ruta de Paldiski, de 15 km, es circular y se hace en
      sentido horario: arranca en la estación de Paldiski, sigue la costa hasta el cabo de Pakri y regresa por
      el parque eólico. Se calcula en cinco horas y es posible todo el año. La primera parte va señalizada con
      las franjas azules y blancas del sendero costero; la segunda vuelve a la ciudad por caminos públicos.


      Hacia el norte el acantilado va ganando altura y hay que subir por una escalera hasta la parte alta de
      la pared. En el cabo te esperan dos faros: los muros del viejo depósito de fuego de Pedro I y el nuevo,
      de 1889, el más alto de Estonia. La torre roja de caliza mide 52 metros desde la base y su luz está a 73
      metros sobre el mar. A Paldiski se llega en coche, en tren eléctrico o en autobús desde Tallin.
    history: >-
      Pakri tiene dos pasados superpuestos. El primero es sueco: las islas se llaman Rågöarna, islas del
      centeno, porque el centeno era el cultivo principal, y en 1345 cinco familias suecas compraron la isla
      occidental al monasterio de Padise. Durante siglos las habitaron suecos de Estonia, hasta que la Segunda
      Guerra Mundial obligó a salir a toda la población civil. El segundo es el de los zares: en 1718 Pedro I
      decidió construir un puerto militar de aguas profundas y sin hielo en la bahía de Pakri. El plan nunca
      se ejecutó entero, pero quedan las ruinas de la fortaleza marítima, los Muula mäed, cerca del final de
      la calle Muuli, con sus bastiones.


      El pasado más reciente fue militar. De 1944 a 1991 las islas sirvieron de campo de tiro para bombardeos
      aéreos. Cuando las últimas tropas rusas se fueron, en 1994, Estonia empezó a retirar los explosivos sin
      detonar. En 2004 las islas tuvieron su primer habitante permanente en décadas.
    before: >-
      El acantilado se desprende: no te acerques al borde. El gestor de la reserva publica el reglamento y la
      zonificación de los distintos sectores; consúltalos antes de visitar las islas.
    around: >-
      La reserva paisajística de [Osmussaar](/lugar/osmussaare-maastikukaitseala/) está a unos veintiséis
      kilómetros en la costa estonia.
  en:
    intro: >-
      The sea gnaws here at a limestone cliff that crumbles in slow motion. At Cape Pakri, at the tip of the
      peninsula that juts twelve kilometres into the Baltic, the coast rises to about 25 metres and is so
      close to falling that lighthouse builders had to erect another one when the precipice drew too close to
      the first. The Pakri landscape reserve, created on 18 May 1998, protects that coast, the islands of
      Väike-Pakri and Suur-Pakri, the sea between them and the islets of Kappa and Bjärrgronne.
    landscape: >-
      The Pakri peninsula is 12 km long and covers about 40 km², projecting from north-west Estonia into the
      sea. Its highest wall, about 25 metres, is at the cape. The rock is not uniform: vertical fractures and
      layers of different hardness leave a jagged edge prone to rockfalls. Below, the waves ceaselessly bite
      into the sandstone at the base; above, the limestone holds out until the void overcomes it. Springs also
      emerge on the cliff face.


      On the islands the escarpment is lower. It forms part of the Baltic klint and rises to 4 m on Suur-Pakri
      and to 13 m on Väike-Pakri. On the islands, the reserve protects the limestone cliffs, the alvars and
      the rare species.
    wildlife: >-
      Pakri is protected for its landscape more than for any particular animal: limestone cliffs open to the
      sea and, on the islands, the alvars, that thin layer of soil over rock. The reserve was created in 1998
      to care for them, together with the rare species that live there.


      There is no bad time to visit. The coastal route, from Paldiski to the cape, is proposed in any season.
      That said, the cliff edge changes: check its state before approaching.
    visit: >-
      The way to understand the place is to walk it. The Paldiski route, 15 km long, is circular and is done
      clockwise: it starts at Paldiski station, follows the coast to Cape Pakri and returns via the wind farm.
      It is estimated at five hours and is possible all year. The first section is waymarked with the blue and
      white stripes of the coastal trail; the second returns to town along public paths.


      Towards the north the cliff gains height and you must climb a staircase to reach the top of the wall. At
      the cape two lighthouses await you: the walls of the old fire depot of Peter I and the new one, of 1889,
      the tallest in Estonia. The red limestone tower stands 52 metres from its base and its light is 73
      metres above sea level. Paldiski is reached by car, electric train or bus from Tallinn.
    history: >-
      Pakri has two overlapping pasts. The first is Swedish: the islands are called Rågöarna, the rye islands,
      because rye was the main crop, and in 1345 five Swedish families bought the western island from the
      monastery of Padise. For centuries they were inhabited by Estonia's Swedes, until the Second World War
      forced all the civilian population to leave. The second is that of the tsars: in 1718 Peter I decided to
      build a deep-water, ice-free military port in Pakri Bay. The plan was never fully executed, but the
      ruins of the sea fortress, the Muula mäed, remain near the end of Muuli Street, with its bastions.


      The most recent past was military. From 1944 to 1991 the islands served as a firing range for aerial
      bombardments. When the last Russian troops left, in 1994, Estonia began to remove the unexploded
      ordnance. In 2004 the islands had their first permanent inhabitant in decades.
    before: >-
      The cliff crumbles: do not approach the edge. The reserve manager publishes the regulations and zoning
      of the different sectors; consult them before visiting the islands.
    around: >-
      The [Osmussaar landscape reserve](/lugar/osmussaare-maastikukaitseala/) is about twenty-six kilometres
      away along the Estonian coast.
  fr:
    intro: >-
      La mer ronge ici une falaise de calcaire qui s'effrite au ralenti. Au cap Pakri, à l'extrémité de la
      péninsule qui s'avance de douze kilomètres dans la Baltique, le bord de la côte s'élève à environ 25
      mètres et est si proche de basculer que les constructeurs de phares ont dû en ériger un autre lorsque le
      précipice s'est approché trop près du premier. La réserve paysagère de Pakri, créée le 18 mai 1998,
      protège cette côte, les îles Väike-Pakri et Suur-Pakri, la mer qui les sépare et les îlots de Kappa et
      Bjärrgronne.
    landscape: >-
      La péninsule de Pakri mesure 12 km de long et couvre environ 40 km², s'avançant du nord-ouest de
      l'Estonie vers la mer. Sa paroi la plus haute, d'environ 25 mètres, se trouve au cap. La roche n'est pas
      uniforme : les fractures verticales et les couches de dureté différente laissent un bord dentelé, sujet
      aux éboulements. En bas, les vagues rongent sans relâche les couches de grès au pied ; en haut, le
      calcaire résiste, jusqu'à ce que le vide l'emporte. Des sources affleurent aussi dans la falaise.


      Sur les îles, l'escarpe est plus basse. Elle fait partie de la klint baltique et s'élève jusqu'à 4 m sur
      Suur-Pakri et jusqu'à 13 m sur Väike-Pakri. Sur les îles, la réserve protège les falaises calcaires, les
      alvars et les espèces rares.
    wildlife: >-
      Pakri est protégé pour son paysage plus que pour un animal particulier : des falaises de calcaire
      ouvertes sur la mer et, sur les îles, les alvars, cette mince couche de sol sur la roche. La réserve a
      été créée en 1998 pour les préserver, ainsi que les espèces rares qui y vivent.


      Il n'y a pas de mauvaise saison pour visiter. Le sentier côtier, de Paldiski jusqu'au cap, est proposé
      quelle que soit la saison. Cela dit, le bord de la falaise change : vérifiez son état avant de vous en
      approcher.
    visit: >-
      La façon de comprendre l'endroit est de le marcher. Le parcours de Paldiski, de 15 km, est circulaire et
      se fait dans le sens des aiguilles d'une montre : il part de la gare de Paldiski, longe la côte jusqu'au
      cap Pakri et revient par le parc éolien. Il est estimé à cinq heures et est possible toute l'année. La
      première partie est balisée avec les rayures bleues et blanches du sentier côtier ; la deuxième revient
      en ville par des chemins publics.


      Vers le nord, la falaise gagne en hauteur et il faut monter par un escalier jusqu'en haut de la paroi.
      Au cap, deux phares vous attendent : les murs du vieux dépôt de feu de Pierre Ier et le nouveau, de
      1889, le plus haut d'Estonie. La tour rouge de calcaire mesure 52 mètres depuis la base et sa lumière
      est à 73 mètres au-dessus de la mer. Paldiski est accessible en voiture, en train électrique ou en bus
      depuis Tallinn.
    history: >-
      Pakri a deux passés superposés. Le premier est suédois : les îles s'appellent Rågöarna, les îles du
      seigle, car le seigle était la culture principale, et en 1345 cinq familles suédoises ont acheté l'île
      occidentale au monastère de Padise. Pendant des siècles, elles furent habitées par les Suédois
      d'Estonie, jusqu'à ce que la Seconde Guerre mondiale oblige toute la population civile à partir. Le
      second est celui des tsars : en 1718, Pierre Ier décida de construire un port militaire en eaux
      profondes et sans glace dans la baie de Pakri. Le plan ne fut jamais entièrement exécuté, mais les
      ruines de la forteresse maritime, les Muula mäed, subsistent près du bout de la rue Muuli, avec ses
      bastions.


      Le passé le plus récent fut militaire. De 1944 à 1991 les îles servirent de champ de tir pour les
      bombardements aériens. Quand les dernières troupes russes sont parties, en 1994, l'Estonie a commencé à
      retirer les explosifs non détonés. En 2004 les îles ont eu leur premier habitant permanent depuis des
      décennies.
    before: >-
      La falaise s'effondre : ne vous approchez pas du bord. Le gestionnaire de la réserve publie le règlement
      et le zonage des différents secteurs ; consultez-les avant de visiter les îles.
    around: >-
      La [réserve paysagère d'Osmussaar](/lugar/osmussaare-maastikukaitseala/) se trouve à environ vingt-six
      kilomètres le long de la côte estonienne.
  de:
    intro: >-
      Das Meer nagt hier an einem Kalksteinkliff, das sich in Zeitlupe bröckelt. Am Kap Pakri, an der Spitze
      der Halbinsel, die sich zwölf Kilometer in die Ostsee erstreckt, steigt der Küstenrand auf etwa 25 Meter
      und ist dem Absturz so nahe, dass Leuchtturmbauer einen neuen errichten mussten, als der Abgrund dem
      ersten zu nah rückte. Das Landschaftsschutzgebiet Pakri, gegründet am 18. Mai 1998, schützt diese Küste,
      die Inseln Väike-Pakri und Suur-Pakri, das Meer zwischen ihnen und die Schären Kappa und Bjärrgronne.
    landscape: >-
      Die Halbinsel Pakri ist 12 km lang und umfasst etwa 40 km², die vom Nordwesten Estlands ins Meer
      hinausragen. Ihre höchste Wand, etwa 25 Meter, befindet sich am Kap. Das Gestein ist nicht gleichförmig:
      Vertikale Klüfte und Schichten unterschiedlicher Härte hinterlassen einen gezackten Rand, der zu
      Felsstürzen neigt. Unten fressen die Wellen unablässig an den Sandsteinschichten am Fuß; oben hält der
      Kalkstein stand, bis die Leere ihn besiegt. An der Kliffwand treten zudem Quellen aus.


      Auf den Inseln ist die Steilküste niedriger. Sie ist Teil des Baltischen Klints und steigt bis 4 m auf
      Suur-Pakri und bis 13 m auf Väike-Pakri. Auf den Inseln schützt das Reservat die Kalksteinklippen, die
      Alvare und die seltenen Arten.
    wildlife: >-
      Pakri wird eher wegen seiner Landschaft geschützt als wegen eines bestimmten Tieres: Kalksteinklippen,
      die zum Meer hin offen sind, und auf den Inseln die Alvare, jene dünne Bodenschicht über dem Fels. Das
      Reservat wurde 1998 zum Schutz dieser Lebensräume gegründet, zusammen mit den seltenen Arten, die darin
      leben.


      Es gibt keine schlechte Jahreszeit für einen Besuch. Der Küstenweg von Paldiski zum Kap wird zu jeder
      Jahreszeit empfohlen. Allerdings verändert sich der Kliffrand: Prüfe seinen Zustand, bevor du dich
      näherst.
    visit: >-
      Die Art, diesen Ort zu verstehen, ist ihn zu erwandern. Der Paldiski-Rundweg, 15 km lang, wird im
      Uhrzeigersinn begangen: Er beginnt am Bahnhof Paldiski, folgt der Küste bis zum Kap Pakri und kehrt über
      den Windpark zurück. Er wird auf fünf Stunden geschätzt und ist das ganze Jahr möglich. Der erste
      Abschnitt ist mit den blauen und weißen Streifen des Küstenweges markiert; der zweite kehrt über
      öffentliche Wege in die Stadt zurück.


      Nach Norden gewinnt die Klippe an Höhe und du musst eine Treppe hinaufsteigen, um den oberen Teil der
      Wand zu erreichen. Am Kap erwarten dich zwei Leuchttürme: die Mauern des alten Feuerdepots Peters I. und
      der neue, von 1889, der höchste in Estland. Der rote Kalksteinturm misst 52 Meter von der Basis und sein
      Licht befindet sich 73 Meter über dem Meeresspiegel. Paldiski ist mit dem Auto, der elektrischen Bahn
      oder dem Bus von Tallinn aus erreichbar.
    history: >-
      Pakri hat zwei überlagerte Vergangenheiten. Die erste ist schwedisch: Die Inseln heißen Rågöarna, die
      Roggeninseln, denn Roggen war das Hauptgetreide, und im Jahr 1345 kauften fünf schwedische Familien die
      westliche Insel vom Kloster Padise. Jahrhundertelang wurden sie von Estlands Schweden bewohnt, bis der
      Zweite Weltkrieg die gesamte Zivilbevölkerung zur Flucht zwang. Die zweite ist die der Zaren: 1718
      beschloss Peter I., in der Bucht von Pakri einen tiefwasserfreien, eisfreien Militärhafen zu bauen. Der
      Plan wurde nie vollständig ausgeführt, aber die Ruinen der Seefestung, die Muula mäed, stehen noch am
      Ende der Muuli-Straße, mit ihren Bastionen.


      Die jüngste Vergangenheit war militärisch. Von 1944 bis 1991 dienten die Inseln als Schießplatz für
      Luftbombardements. Als die letzten russischen Truppen 1994 abzogen, begann Estland mit dem Räumen der
      unexplodierten Sprengkörper. Im Jahr 2004 hatten die Inseln ihren ersten dauerhaften Bewohner seit
      Jahrzehnten.
    before: >-
      Die Klippe bröckelt: Geh nicht an den Rand. Der Reservatsmanager veröffentlicht die Vorschriften und die
      Zonierung der verschiedenen Bereiche; lies sie, bevor du die Inseln besuchst.
    around: >-
      Das [Landschaftsschutzgebiet Osmussaar](/lugar/osmussaare-maastikukaitseala/) liegt etwa sechsundzwanzig
      Kilometer entfernt an der estnischen Küste.
  it:
    intro: >-
      Il mare corrode qui una falesia di calcare che si sgretola al rallentatore. A Capo Pakri, all'estremità
      della penisola che si spinge per dodici chilometri nel Baltico, il bordo della costa sale a circa 25
      metri ed è così prossimo a cadere che i costruttori di fari hanno dovuto erigerne un altro quando il
      precipizio si è avvicinato troppo al primo. La riserva paesaggistica di Pakri, creata il 18 maggio 1998,
      protegge quella costa, le isole Väike-Pakri e Suur-Pakri, il mare che le separa e gli isolotti di Kappa
      e Bjärrgronne.
    landscape: >-
      La penisola di Pakri misura 12 km di lunghezza e copre circa 40 km², protendendosi dal nord-ovest
      dell'Estonia verso il mare. La sua parete più alta, di circa 25 metri, si trova al capo. La roccia non è
      uniforme: le fratture verticali e gli strati di durezza diversa lasciano un bordo dentellato, soggetto a
      frane. In basso, le onde mordono senza sosta gli strati di arenaria alla base; in alto, il calcare
      regge, finché il vuoto non lo vince. Nella falesia affiorano anche sorgenti.


      Sulle isole la scarpata è più bassa. Fa parte della scarpata baltica e sale fino a 4 m su Suur-Pakri e
      fino a 13 m su Väike-Pakri. Sulle isole, la riserva protegge le falesie calcaree, gli alvar e le specie
      rare.
    wildlife: >-
      Pakri è protetta per il suo paesaggio più che per un animale specifico: falesie di calcare aperte al
      mare e, sulle isole, gli alvar, quel sottile strato di suolo sulla roccia. La riserva è stata creata nel
      1998 per prendersene cura, insieme alle specie rare che vi vivono.


      Non c'è una cattiva stagione per visitare. Il percorso costiero, da Paldiski fino al capo, è proposto in
      qualsiasi stagione. Detto questo, il bordo della falesia cambia: verifica il suo stato prima di
      avvicinarti.
    visit: >-
      Il modo per capire il luogo è camminarlo. Il percorso di Paldiski, di 15 km, è circolare e si fa in
      senso orario: parte dalla stazione di Paldiski, segue la costa fino a Capo Pakri e torna attraverso il
      parco eolico. Si calcola in cinque ore ed è possibile tutto l'anno. La prima parte è segnalata con le
      strisce blu e bianche del sentiero costiero; la seconda ritorna in città per percorsi pubblici.


      Vers nord la falesia guadagna in altezza e bisogna salire per una scala fino alla parte alta della
      parete. Al capo ti aspettano due fari: i muri del vecchio deposito di fuoco di Pietro I e quello nuovo,
      del 1889, il più alto dell'Estonia. La torre rossa di calcare misura 52 metri dalla base e la sua luce è
      a 73 metri sul mare. A Paldiski si arriva in auto, in treno elettrico o in autobus da Tallinn.
    history: >-
      Pakri ha due passati sovrapposti. Il primo è svedese: le isole si chiamano Rågöarna, le isole della
      segale, perché la segale era la coltura principale, e nel 1345 cinque famiglie svedesi comprarono
      l'isola occidentale al monastero di Padise. Per secoli furono abitate dagli svedesi d'Estonia, finché la
      Seconda Guerra Mondiale costrinse tutta la popolazione civile ad andarsene. Il secondo è quello degli
      zar: nel 1718 Pietro I decise di costruire un porto militare di acque profonde e senza ghiaccio nella
      baia di Pakri. Il piano non fu mai eseguito interamente, ma restano le rovine della fortezza marittima,
      i Muula mäed, vicino alla fine di via Muuli, con i suoi bastioni.


      Il passato più recente fu militare. Dal 1944 al 1991 le isole servirono da poligono di tiro per
      bombardamenti aerei. Quando le ultime truppe russe se ne andarono, nel 1994, l'Estonia iniziò a
      rimuovere gli esplosivi inesplosi. Nel 2004 le isole ebbero il loro primo abitante permanente da
      decenni.
    before: >-
      La falesia si sgretola: non avvicinarti al bordo. Il gestore della riserva pubblica il regolamento e la
      zonizzazione dei diversi settori; consultali prima di visitare le isole.
    around: >-
      La [riserva paesaggistica di Osmussaar](/lugar/osmussaare-maastikukaitseala/) si trova a circa ventisei
      chilometri lungo la costa estone.
  pt:
    intro: >-
      O mar rói aqui uma falésia de calcário que se desmorona a câmara lenta. No cabo de Pakri, na ponta da
      península que avança doze quilómetros pelo Báltico, o bordo da costa sobe até cerca de 25 metros e está
      tão prestes a cair que os construtores de faróis tiveram de erguer outro quando o precipício se
      aproximou demasiado do primeiro. A reserva paisagística de Pakri, criada a 18 de maio de 1998, protege
      essa costa, as ilhas Väike-Pakri e Suur-Pakri, o mar que as separa e os ilhéus de Kappa e Bjärrgronne.
    landscape: >-
      A península de Pakri tem 12 km de comprimento e cerca de 40 km², projetando-se do noroeste da Estónia
      para o mar. A sua parede mais alta, de cerca de 25 metros, está no cabo. A rocha não é uniforme: as
      fraturas verticais e as camadas de dureza diferente deixam um bordo dentado, propenso a desmoronamentos.
      Em baixo, as ondas mordem sem descanso as camadas de arenito na base; em cima, o calcário aguenta, até
      que o vazio o vence. Na falésia afloram também nascentes.


      Nas ilhas a escarpa é mais baixa. Faz parte da escarpa báltica e sobe até 4 m em Suur-Pakri e até 13 m
      em Väike-Pakri. Nas ilhas, a reserva protege as falésias calcárias, os alvares e as espécies raras.
    wildlife: >-
      Pakri é protegida mais pela sua paisagem do que por um animal concreto: falésias de calcário abertas
      para o mar e, nas ilhas, os alvares, essa fina camada de solo sobre a rocha. A reserva foi criada em
      1998 para cuidar deles, juntamente com as espécies raras que neles vivem.


      Não há má altura para visitar. O percurso da costa, de Paldiski até ao cabo, propõe-se em qualquer
      estação. Isso sim, o bordo da falésia muda: verifica o seu estado antes de te aproximares.
    visit: >-
      A forma de entender o lugar é caminhar por ele. O percurso de Paldiski, de 15 km, é circular e faz-se no
      sentido dos ponteiros do relógio: arranca na estação de Paldiski, segue a costa até ao cabo de Pakri e
      regressa pelo parque eólico. Calcula-se em cinco horas e é possível todo o ano. A primeira parte está
      sinalizada com as faixas azuis e brancas do percurso costeiro; a segunda regressa à cidade por caminhos
      públicos.


      Para norte a falésia vai ganhando altura e é preciso subir por uma escada até à parte de cima da parede.
      No cabo esperam-te dois faróis: os muros do velho depósito de fogo de Pedro I e o novo, de 1889, o mais
      alto da Estónia. A torre vermelha de calcário mede 52 metros desde a base e a sua luz está a 73 metros
      sobre o mar. A Paldiski chega-se de carro, comboio elétrico ou autocarro desde Talinn.
    history: >-
      Pakri tem dois passados sobrepostos. O primeiro é sueco: as ilhas chamam-se Rågöarna, as ilhas do
      centeio, porque o centeio era a principal cultura, e em 1345 cinco famílias suecas compraram a ilha
      ocidental ao mosteiro de Padise. Durante séculos foram habitadas pelos suecos da Estónia, até que a
      Segunda Guerra Mundial obrigou toda a população civil a partir. O segundo é o dos czares: em 1718 Pedro
      I decidiu construir um porto militar de águas profundas e sem gelo na baía de Pakri. O plano nunca foi
      executado por inteiro, mas ficaram as ruínas da fortaleza marítima, os Muula mäed, perto do fim da rua
      Muuli, com os seus baluartes.


      O passado mais recente foi militar. De 1944 a 1991 as ilhas serviram de campo de tiro para
      bombardeamentos aéreos. Quando as últimas tropas russas partiram, em 1994, a Estónia começou a remover
      os explosivos por detonar. Em 2004 as ilhas tiveram o seu primeiro habitante permanente em décadas.
    before: >-
      A falésia desmorona-se: não te aproximes do bordo. O gestor da reserva publica o regulamento e a zonação
      dos diferentes sectores; consulta-os antes de visitar as ilhas.
    around: >-
      A [reserva paisagística de Osmussaar](/lugar/osmussaare-maastikukaitseala/) fica a cerca de vinte e seis
      quilómetros na costa estónia.
