observaciones:
  es: >-
    La zona A del bosque, el corazón de cría de la fauna, está vetada al público, y en la zona B está
    prohibido hacer ruidos molestos o alzar la voz. El museo funciona por temporada: comprueba antes de ir si
    está abierto o si hay que reservar.
texto:
  es:
    intro: >-
      Hay bosques que llevan la sombra en el nombre. La Foresta Umbra está en el centro-oriente del Gargano, a
      unos 800 metros de altitud, dentro del Parque Nacional del Gargano. El nombre viene del latín y quiere
      decir oscuro, sombrío; y como entonces, en parte lo sigue siendo. Sus hayedos vetustos son Patrimonio de
      la UNESCO desde el 7 de julio de 2017.
    landscape: >-
      El Gargano es sobre todo roca sedimentaria, calizas y dolomías del Cretácico y el Jurásico, y su karst
      ha creado más de 4000 dolinas. La Foresta Umbra se asienta sobre ese zócalo, y es una masa casi continua
      y compacta de más de 12.000 hectáreas según el parque y de unas 15.000 según la Wikipedia italiana.


      El bosque se divide en tres pisos: arriba el hayedo, en medio el robledal de cerris y abajo el bosque
      mediterráneo con encinas. «Catedrales arbóreas» de hayas, carpes, arces y tejos gigantes suben hacia la
      bóveda buscando luz, y como la selva es tan densa, lo difícil es distinguir una especie de otra. El
      microclima de la «faggete depresse» es la que permite que el haya viva aquí, a menos altitud que en
      ningún otro lugar. En otoño, el escenario del bosque es espectacular, cuando las hojas se tiñen de sus
      colores típicos.
    wildlife: >-
      La fauna es tan escurridiza como el bosque. Viven jabalíes, corzos, pícidos y comadrejas, y fototrampas
      en el interior han confirmado la presencia del lobo apenino. El corzo garganico no ha tenido contacto
      con corzos de otro origen, y se considera una probable subespecie de gran interés científico. Hay seis
      especies de pícidos, entre ellas el pico dorsiblanco y el pico mediano, ambos muy raros. Entre las
      rapaces diurnas están el ratonero, el gavilán y el azor, y de noche el cárabo, el búho real y el
      autillo.


      En primavera, el Cutino d'Umbra se llena de movimiento: al comienzo de la estación, cientos de sapos
      llegan allí para reproducirse. Y entre las flores del sotobosque hay un grupo muy interesante de
      orquídeas.
    visit: >-
      La Foresta Umbra es el lugar símbolo del senderismo del Gargano. Los senderos señalizados son quince,
      todos con carteles direccionales y marcas de pintura amarilla en árboles y rocas, y la red completa suma
      unos 54 km. El inicio del bosque se marca con grandes paneles de madera, y junto a los arranques hay
      siempre aparcamiento. Uno de los itinerarios une Laghetto d'Umbra con Falascone, otro Murgia con Lago
      d'Otri, y el trazado de Sfilzi a Casalini forma parte de los equipados. También se puede hacer bicicleta
      de montaña y bicicleta eléctrica.


      Por el camino aparecen desvíos cortos a las gravi, cavidades naturales delimitadas y explicadas con
      paneles. En Villaggio Umbra, el museo naturalista tiene tres secciones cubiertas y una exterior: flora
      garganica, con paneles luminosos y una maqueta altimétrica, y arqueología, con útiles de piedra del
      Paleolítico y el Neolítico. Junto al museo hay una pequeña área de fauna con gamos y muflones y un
      arboreto con árboles etiquetados. En el vivero experimental de Caritate se pueden ver alrededor de doce
      especies de robles de Puglia.
    history: >-
      El bosque se protege en distintos niveles. Las reservas biogenéticas Foresta Umbra (399 ha) y Falascone
      (48 ha) se protegen desde 1977 y están formadas por hayedo mixto, y la reserva integral de Sfilzi, de 56
      ha, nació en 1971 para proteger el único manantial de montaña del Gargano. La pequeña reserva de la
      Sorgentola es integral: está prohibida cualquier actividad humana y hasta el acceso.
    before: >-
      La zona A del bosque, el corazón de cría de la fauna, está vetada al público, y en la zona B está
      prohibido hacer ruidos molestos o alzar la voz. El museo funciona por temporada: comprueba antes de ir
      si está abierto o si hay que reservar.
    around: >-
      No hay vecinos publicados en el atlas; comparte el búho real y el karst con [Cheile Crișului
      Repede](/lugar/cheile-crisului-repede/).
  en:
    intro: >-
      Some forests carry shadow in their very name. Foresta Umbra lies in east-central Gargano, at around 800
      meters of altitude, within Gargano National Park. The name derives from Latin, meaning dark and gloomy,
      and in large part it remains so today. Its ancient beech groves have been recognized as a UNESCO World
      Heritage site since 7 July 2017.
    landscape: >-
      The Gargano is predominantly sedimentary rock—limestones and dolomites of Cretaceous and Jurassic
      age—and its karst landscape has formed more than 4000 sinkholes. Foresta Umbra rests upon this plateau,
      forming an almost continuous, dense woodland covering over 12,000 hectares according to the park
      authorities and around 15,000 according to Italian Wikipedia.


      The forest is stratified into three distinct zones: beech at higher elevations, Turkey oak forest in the
      middle, and Mediterranean woodland with holm oaks down below. 'Arboreal cathedrals' of monumental beech,
      hornbeam, maple, and yew surge toward the canopy seeking light; the jungle is so dense that
      distinguishing one species from another can be difficult. The microclimate of the 'faggete depresse' is
      what allows beech to thrive here at lower altitudes than anywhere else. In autumn, the forest is
      breathtaking when foliage turns into vibrant autumnal shades.
    wildlife: >-
      The wildlife is as elusive as the dense forest itself. Wild boars, roe deer, woodpeckers, and weasels
      dwell here, and camera traps deep in the interior have confirmed the presence of the Apennine wolf. The
      Gargano roe deer has never crossbred with imported stock and is considered a probable native subspecies
      of high scientific interest. Six species of woodpeckers inhabit the woods, including the white-backed
      and middle spotted woodpecker, both very rare. Diurnal raptors include buzzard, sparrowhawk, and
      goshawk, while tawny owls, eagle owls, and scops owls hunt by night.


      In spring, Cutino d'Umbra teems with life: at the beginning of the season, hundreds of common toads
      gather there to breed. And among the forest floor flora blossoms a remarkable collection of wild
      orchids.
    visit: >-
      Foresta Umbra is the hiking capital of the Gargano. There are fifteen signposted trails, all fitted with
      directional markers and yellow trail blazes on trees and boulders, adding up to a 54 km network. Forest
      entrances are marked by large timber panels with parking lots at each trailhead. One route links
      Laghetto d'Umbra with Falascone, another connects Murgia to Lago d'Otri, and the path from Sfilzi to
      Casalini is fully equipped. Mountain biking and e-biking are also popular.


      Along the trails, short detours lead to the gravi—fenced natural sinkholes with interpretive signs. At
      Villaggio Umbra, the nature museum has three indoor pavilions and an outdoor area: Gargano flora, with
      illuminated panels and a topographic model, and archaeology, displaying Paleolithic and Neolithic stone
      tools. Beside the museum lies a small wildlife enclosure with fallow deer and mouflons, plus a labeled
      arboretum. At the Caritate experimental nursery, you can see around twelve oak species native to Puglia.
    history: >-
      The forest enjoys multiple protection tiers. The biogenetic nature reserves of Foresta Umbra (399 ha)
      and Falascone (48 ha) have been safeguarded since 1977, preserving mixed beech woodland, while the
      Sfilzi strict reserve of 56 ha was created in 1971 to protect the Gargano's only montane perennial
      spring. The small Sorgentola reserve is a strict nature reserve: all human activity and even entry are
      prohibited.
    before: >-
      Zone A of the forest, the core wildlife breeding sanctuary, is strictly closed to the public, and in
      Zone B disturbing noise and shouting are forbidden. The museum operates seasonally: check opening dates
      or booking requirements before visiting.
    around: >-
      There are no neighboring places published in the atlas; it shares the Eurasian eagle-owl and karst
      terrain with [Cheile Crișului Repede](/lugar/cheile-crisului-repede/).
  fr:
    intro: >-
      Certaines forêts portent l'ombre dans leur nom. La Foresta Umbra se niche au cœur oriental du Gargano, à
      environ 800 mètres d'altitude, au sein du parc national du Gargano. Son nom dérive du latin et signifie
      obscur, ombragé ; et aujourd'hui encore, elle conserve ce caractère mystérieux. Ses hêtraies séculaires
      sont inscrites au patrimoine mondial de l'UNESCO depuis le 7 juillet 2017.
    landscape: >-
      Le Gargano est constitué de roches sédimentaires, de calcaires et de dolomies du Crétacé et du
      Jurassique, dont le karst a façonné plus de 4000 dolines. La Foresta Umbra s'étend sur ce socle, formant
      un massif compact et presque continu de plus de 12 000 hectares selon le parc et d'environ 15 000 selon
      Wikipédia en italien.


      Le massif forestier s'étage en trois niveaux : la hêtraie en haut, la chênaie de chêne chevelu au milieu
      et la forêt méditerranéenne de chênes verts en bas. De véritables « cathédrales végétales » de hêtres,
      charmes, érables et ifs géants s'élancent vers la lumière ; la forêt est si dense qu'il est malaisé de
      discerner les essences. Le microclimat des « faggete depresse » permet au hêtre de s'épanouir ici à une
      altitude plus basse que nulle part ailleurs. En automne, le paysage se pare d'un flamboiement de
      couleurs remarquable.
    wildlife: >-
      La faune est aussi secrète que la futaie. Sangliers, chevreuils, pics et belettes y trouvent refuge, et
      des pièges photographiques en sous-bois ont confirmé le retour du loup des Apennins. Le chevreuil du
      Gargano est une lignée pure n'ayant jamais été croisée, considérée comme une sous-espèce indigène d'un
      grand intérêt scientifique. Six espèces de pics peuplent les lieux, dont le pic à dos blanc et le pic
      mar, tous deux très rares. Parmi les rapaces diurnes figurent la buse, l'épervier et l'autour, relayés
      la nuit par la chouette hulotte, le grand-duc et le petit-duc scops.


      Au printemps, le Cutino d'Umbra s'anime : au début de la saison, des centaines de crapauds s'y
      rassemblent pour frayer. Et le sous-bois recèle un éventail exceptionnel d'orchidées sauvages.
    visit: >-
      La Foresta Umbra est le haut lieu de la randonnée dans le Gargano. On compte quinze sentiers balisés,
      équipés de panneaux de direction et de balises jaunes sur troncs et rochers, le réseau cumulant 54 km.
      Les entrées sont pourvues de grands panneaux d'accueil en bois et de parkings. Un des sentiers relie le
      Laghetto d'Umbra à Falascone, un autre Murgia au Lago d'Otri, tandis que le tracé de Sfilzi à Casalini
      est entièrement aménagé. Le VTT et le vélo à assistance électrique y sont très prisés.


      Le long des itinéraires, de courts détours mènent aux gravi, cavités naturelles sécurisées et expliquées
      par des panneaux. À Villaggio Umbra, le musée naturaliste comprend trois salles couvertes et un espace
      de plein air : flore du Gargano avec panneaux rétroéclairés et maquette en relief, et archéologie avec
      outillage en silex du Paléolithique et Néolithique. Attenant au musée se trouvent un enclos à daims et
      mouflons ainsi qu'un arboretum étiqueté. La pépinière expérimentale de Caritate permet d'observer
      environ douze espèces de chênes des Pouilles.
    history: >-
      La forêt bénéficie de plusieurs échelons de protection. Les réserves biogénétiques de la Foresta Umbra
      (399 ha) et de Falascone (48 ha) sont protégées depuis 1977 pour leurs hêtraies mixtes, et la réserve
      intégrale de Sfilzi, de 56 ha, a été établie en 1971 pour préserver la seule source montagnarde du
      Gargano. La petite réserve de la Sorgentola est intégrale : toute présence humaine et même l'accès y
      sont interdits.
    before: >-
      La zone A du massif, sanctuaire de reproduction de la faune, est strictement fermée au public, et en
      zone B il est interdit de faire du bruit ou de crier. Le musée fonctionne de façon saisonnière :
      vérifiez les dates d'ouverture ou les réservations préalables.
    around: >-
      Aucun site voisin n'est publié dans l'atlas ; il partage le grand-duc d'Europe et les reliefs karstiques
      avec [Cheile Crișului Repede](/lugar/cheile-crisului-repede/).
  de:
    intro: >-
      Manche Wälder tragen den Schatten bereits im Namen. Die Foresta Umbra liegt im östlichen Zentrum des
      Gargano auf etwa 800 Metern Höhe im Nationalpark Gargano. Der Name stammt aus dem Lateinischen und
      bedeutet dunkel oder schattig; und wie einst ist sie es bis heute geblieben. Ihre uralten Buchenwälder
      gehören seit dem 7. Juli 2017 zum UNESCO-Welterbe.
    landscape: >-
      Der Gargano besteht überwiegend aus Sedimentgestein, Kalken und Dolomiten aus Kreide und Jura, und sein
      Karst hat mehr als 4000 Dolinen geformt. Auf diesem Sockel ruht die Foresta Umbra als geschlossenes
      Waldmassiv von über 12.000 Hektar laut Nationalpark und rund 15.000 laut italienischer Wikipedia.


      Der Wald gliedert sich in drei Stufen: oben der Buchenwald, in der Mitte Zerreichenwälder und unten
      mediterrane Steineichenwälder. Gewaltige 'Baumkathedralen' aus Buchen, Hainbuchen, Ahornen und
      Riesen-Eiben streben dem Licht entgegen; das Dickicht ist derart dicht, dass einzelne Baumarten kaum zu
      unterscheiden sind. Das Mikroklima der 'faggete depresse' gestattet es der Buche, hier tiefer zu
      gedeihen als an jedem anderen Ort der Erde. Im Herbst bietet der Wald ein prachtvolles Farbenspiel.
    wildlife: >-
      Die Tierwelt lebt ebenso verborgen wie der Wald selbst. Wildschweine, Rehe, Spechte und Wiesel sind
      heimisch, und Fotofallen im Inneren bestätigen das Vorkommen des Apenninenwolfs. Das Gargano-Reh blieb
      frei von Einkreuzungen und gilt als eigenständige Unterart von hohem wissenschaftlichem Rang. Sechs
      Spechtarten brüten im Wald, darunter Weißrückenspecht und Mittelspecht, beide äußerst selten. Tagaktive
      Greifvögel sind Mäusebussard, Sperber und Habicht, nachts jagen Waldkauz, Uhu und Zwergohreule.


      Im Frühling erwacht der Teich Cutino d'Umbra zu pulsierendem Leben: Zu Saisonbeginn wandern Hunderte
      Kröten zum Ablaichen dorthin. Am Waldboden blüht zudem eine artenreiche Vielfalt wilder Orchideen.
    visit: >-
      Die Foresta Umbra ist das Herzstück des Wandertourismus im Gargano. Fünfzehn markierte Wanderwege mit
      Wegweisern und gelben Markierungen an Bäumen und Felsen bilden ein 54 km langes Wegenetz. Holztafeln
      weisen die Einstiege aus, an denen stets Parkplätze bereitstehen. Eine Route verbindet das Laghetto
      d'Umbra mit Falascone, eine andere Murgia mit dem Lago d'Otri, und der Pfad von Sfilzi nach Casalini ist
      hervorragend ausgebaut. Mountainbikes und E-Bikes sind sehr beliebt.


      Unterwegs zweigen kurze Pfade zu den Gravi ab, eingezäunten Karsttrichtern mit Schautafeln. Im Villaggio
      Umbra bietet das Naturmuseum drei Hallen und ein Freigelände: Flora des Gargano mit Schautafeln und
      Reliefmodell sowie Archäologie mit Werkzeugen aus Alt- und Jungsteinzeit. Nebenan liegen ein Wildgehege
      mit Damhirschen und Mufflons sowie ein Lehr-Arboretum. In der Versuchsgärtnerei Caritate lassen sich
      rund zwölf Eichenarten Apuliens bewundern.
    history: >-
      Der Wald genießt Schutz auf mehreren Ebenen. Die biogenetischen Schutzgebiete Foresta Umbra (399 ha) und
      Falascone (48 ha) stehen seit 1977 unter Schutz und bewahren Mischbuchenwälder, während das
      Totalreservat Sfilzi mit 56 ha 1971 geschaffen wurde, um die einzige Bergquelle des Gargano zu sichern.
      Das kleine Reservat Sorgentola ist ein Totalreservat: Jegliche menschliche Nutzung und sogar der Zutritt
      sind verboten.
    before: >-
      Zone A des Waldes als Kernbrutgebiet der Fauna ist für Besucher komplett gesperrt; in Zone B ist
      störender Lärm verboten. Das Museum öffnet saisonal: Informiere dich vorab über Öffnungstage und
      Voranmeldungen.
    around: >-
      Keine Nachbargebiete sind im Atlas verzeichnet; Uhu und Karstlandschaften teilt das Gebiet mit [Cheile
      Crișului Repede](/lugar/cheile-crisului-repede/).
  it:
    intro: >-
      Ci sono foreste che portano l'ombra impressa nel nome. La Foresta Umbra sorge nel cuore centro-orientale
      del Gargano, a circa 800 metri di altitudine, compresa nel Parco Nazionale del Gargano. Il toponimo
      deriva dal latino e significa cupo, ombroso; e come allora, in buona misura lo è tuttora. Le sue faggete
      vetuste sono Patrimonio Mondiale dell'UNESCO dal 7 luglio 2017.
    landscape: >-
      Il Gargano è costituito in prevalenza da rocce sedimentarie, calcari e dolomie del Cretaceo e del
      Giurassico, il cui carsismo ha generato oltre 4000 doline. La Foresta Umbra riposa su questa zolla
      rocciosa, formando una compagine compatta e continua di oltre 12.000 ettari secondo l'ente parco e di
      circa 15.000 secondo Wikipedia italiana.


      Il manto boschivo si suddivide in tre fasce: in alto la faggeta, al centro il cerreto e in basso il
      bosco mediterraneo a leccio. Autentiche «cattedrali arboree» di faggi, carpini, aceri e tassi
      giganteschi salgono verso la volta in cerca di luce; l'intrico è così fitto che distinguere un albero
      dall'altro risulta arduo. Il microclima delle «faggete depresse» consente al faggio di prosperare qui a
      quote inferiori che in qualunque altra parte del pianeta. In autunno il bosco offre uno spettacolo
      cromatico incomparabile.
    wildlife: >-
      La fauna è tanto schiva quanto il bosco è impenetrabile. Vi trovano dimora cinghiali, caprioli, picchi e
      donnole, e le fototrappole hanno accertato la presenza del lupo appenninico. Il capriolo italico del
      Gargano non ha mai subito ibridazioni ed è ritenuto una probabile sottospecie autoctona di grande
      interesse biologico. Vivono qui sei specie di picchi, tra cui il picchio dorsobianco e il picchio rosso
      mezzano, entrambi assai rari. Tra i rapaci diurni vi sono poiana, sparviere e astore, mentre la notte
      appartiene ad allocco, gufo reale e assiolo.


      In primavera il Cutino d'Umbra brulica di attività: ai primi tepori, centinaia di rospi vi convengono
      per la riproduzione. E nel sottobosco sboccia una straordinaria collezione di orchidee selvatiche.
    visit: >-
      La Foresta Umbra è il punto di riferimento assoluto per il trekking nel Gargano. I sentieri segnalati
      sono quindici, provvisti di cartelli direzionali e bandierine gialle su tronchi e rocce, per un
      complesso di 54 km. Gli accessi sono evidenziati da ampie tabelle lignee con parcheggi dedicati. Un
      tracciato congiunge il Laghetto d'Umbra a Falascone, un altro Murgia al Lago d'Otri, mentre il sentiero
      da Sfilzi a Casalini è tra i più curati. Molto praticate sono anche mountain bike ed e-bike.


      Lungo i percorsi brevi deviazioni conducono alle gravi, voragini carsiche recintate e illustrate da
      pannelli. A Villaggio Umbra il museo naturalistico comprende tre sale coperte e un'area esterna: flora
      garganica con pannelli retroilluminati e plastico altimetrico, e archeologia con manufatti litici del
      Paleolitico e Neolitico. Accanto al museo si visitano un recinto con daini e mufloni e un arboreto
      didattico. Nel vivaio sperimentale di Caritate si osservano circa dodici specie di querce pugliesi.
    history: >-
      La foresta vanta vari livelli di salvaguardia. Le riserve biogenetiche Foresta Umbra (399 ha) e
      Falascone (48 ha) sono protette dal 1977 a tutela delle faggete miste, mentre la riserva integrale di
      Sfilzi, estesa su 56 ha, fu istituita nel 1971 per preservare l'unica sorgente montana perenne del
      Gargano. La riserva della Sorgentola è integrale: qualsiasi attività umana e persino il semplice accesso
      vi sono interdetti.
    before: >-
      La zona A della foresta, cuore della riproduzione faunistica, è preclusa al pubblico, e in zona B è
      vietato produrre rumori molesti o gridare. Il museo opera su base stagionale: verifica giorni di
      apertura ed eventuali prenotazioni prima di partire.
    around: >-
      Non vi sono luoghi limitrofi registrati nell'atlante; condivide il gufo reale e il paesaggio carsico con
      [Cheile Crișului Repede](/lugar/cheile-crisului-repede/).
  pt:
    intro: >-
      Há florestas que trazem a penumbra gravada no próprio nome. A Foresta Umbra situa-se no centro-leste do
      Gargano, a cerca de 800 metros de altitude, integrada no Parque Nacional do Gargano. O topónimo provém
      do latim e significa escuro, sombrio; e tal como antigamente, em grande medida continua a sê-lo. Os seus
      faiais ancestrais são Património Mundial da UNESCO desde 7 de julho de 2017.
    landscape: >-
      O Gargano é formado mormente por rochas sedimentares, calcários e dolomitos do Cretácico e do Jurássico,
      tendo o modelado cársico esculpido mais de 4000 dolinas. A Foresta Umbra assenta sobre esta plataforma
      rochosa, erigindo-se como uma massa contínua de mais de 12.000 hectares segundo a autoridade do parque e
      cerca de 15.000 segundo a Wikipédia italiana.


      A floresta estratifica-se em três pisos: no topo o faial, ao centro o carvalhal de cerquinho e em baixo
      a mata mediterrânica de azinheira. Autênticas 'catedrais vegetais' de faias, cárpinos, áceres e teixos
      colossais elevam-se em direção à luz; a vegetação é tão densa que distinguir as espécies se torna um
      desafio. O microclima das 'faggete depresse' permite que a faia prospere aqui em altitudes mais
      reduzidas do que em qualquer outro lugar. No outono, o cenário florestal ganha um colorido memorável.
    wildlife: >-
      A fauna é tão esquiva quanto o arvoredo é impenetrável. Encontram-se javalis, corços, pica-paus e
      doninhas, e armadilhas fotográficas confirmaram a fixação do lobo-itálico. O corço do Gargano nunca
      sofreu cruzamentos com espécimes introduzidos, sendo tido como uma provável subespécie nativa de alto
      interesse científico. Ocorrem seis espécies de pica-paus, incluindo o pica-pau-de-dorso-branco e o
      pica-pau-médio, ambos muito raros. Entre as rapinas diurnas contam-se a águia-d'asa-redonda, o gavião e
      o açor, enquanto a noite é dominada pela coruja-do-mato, pelo bufo-real e pelo mocho-d'orelhas.


      Na primavera, o Cutino d'Umbra enche-se de animação: no início da estação, centenas de sapos afluem ali
      para desovar. E no solo florestal desabrocha um riquíssimo leque de orquídeas bravas.
    visit: >-
      A Foresta Umbra é a meca do pedestrianismo no Gargano. Os trilhos balizados são quinze, todos providos
      de placas indicativas e marcas amarelas em troncos e rochedos, somando uma rede de 54 km. Os acessos à
      floresta estão sinalizados com painéis de madeira com parques de estacionamento adjacentes. Um percurso
      liga o Laghetto d'Umbra a Falascone, outro Murgia ao Lago d'Otri, enquanto o itinerário de Sfilzi a
      Casalini integra os trilhos equipados. BTT e bicicletas elétricas são também muito procuradas.


      Pelo caminho surgem desvios curtos para as gravi, algares cársicos vedados e providos de informação. No
      Villaggio Umbra, o museu naturalista contempla três salas cobertas e um recinto ao ar livre: flora do
      Gargano com painéis retroiluminados e maqueta de relevo, e arqueologia com artefactos líticos do
      Paleolítico e Neolítico. Junto ao museu existe um cercado com gamos e muflões e um arboreto didático. No
      viveiro de Caritate é possível apreciar cerca de doze espécies de carvalhos da Apúlia.
    history: >-
      A floresta usufrui de vários patamares de salvaguarda. As reservas biogenéticas Foresta Umbra (399 ha) e
      Falascone (48 ha) estão sob proteção desde 1977 preservando faiais mistos, e a reserva integral de
      Sfilzi, de 56 ha, foi demarcada em 1971 para conservar a única nascente montanhosa do Gargano. A pequena
      reserva de Sorgentola tem estatuto integral: qualquer atividade humana e até a simples passagem estão
      proibidas.
    before: >-
      A zona A da mata, refúgio de reprodução da fauna, está interdita a visitas, e na zona B é proibido fazer
      ruídos incomodativos ou gritar. O museu funciona em regime sazonal: confirma datas de abertura e
      eventuais marcações antes de partir.
    around: >-
      Não existem locais limítrofes inscritos no atlas; partilha o bufo-real e a paisagem cársica com [Cheile
      Crișului Repede](/lugar/cheile-crisului-repede/).
