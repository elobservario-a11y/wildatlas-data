    El hayedo primario de baja altitud más deslumbrante de Europa en el 'espolón de la bota' italiana
    (Patrimonio Mundial UNESCO).
  en: >-
    Europe's most dazzling low-altitude primeval beech forest in Italy's 'spur of the boot' (UNESCO World
    Heritage).
  fr: >-
    La plus spectaculaire hêtraie primaire de basse altitude d'Europe dans l'éperon de la botte italienne
    (Patrimoine mondial UNESCO).
  de: Europas eindrucksvollster Tieflagen-Ur-Buchenwald im Sporn des italienischen Stiefels (UNESCO-Welterbe).
  it: >-
    La faggeta primaria di bassa quota più sbalorditiva d'Europa nello 'sperone dello stivale' italiano
    (Patrimonio Mondiale UNESCO).
  pt: >-
    O faial primário de baixa altitude mais deslumbrante da Europa no 'esporão da bota' italiana (Património
    Mundial UNESCO).
