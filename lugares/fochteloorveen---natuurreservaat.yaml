observaciones:
  es: >-
    La Hoogveenroute es larga, así que decide si empiezas en el aparcamiento de la turbera o en Veenhuizen. En
    la ruta ciclista, respeta las normas que indican las señales en las zonas con grandes herbívoros. Lo mejor
    es la primavera, para ver bailar a las grullas.
texto:
  es:
    intro: >-
      En 2001 una pareja de [grullas comunes](/especie/grus_grus/) crió en Fochteloërveen. Era la primera cría
      con éxito en 250 años, y marcó el regreso de la especie como reproductora en Países Bajos. Desde
      entonces las grullas se han quedado: hay quien las encuentra todo el año, y su trompeteo es
      inconfundible.


      Fochteloërveen es una reserva de 2500 hectáreas en el límite entre Frisia y Drenthe, junto al pueblo de
      Veenhuizen. Es uno de los pocos lugares de Países Bajos donde queda turbera alta viva, y uno de los
      mejores restos de lo que fueron enormes turberas del noroeste de Europa. Se salvó casi por azar.
    landscape: >-
      Una turbera alta se hace con paciencia. Solo se forma donde el agua de lluvia se queda y crece el musgo
      de turbera, que absorbe el agua como una esponja y va creciendo por encima del terreno. Abajo el musgo
      muere sin pudrirse; por arriba sigue creciendo, y tras siglos se acumula una capa gruesa de turba. En
      ese suelo ácido y pobre solo sobreviven especies muy especiales. Una de ellas es el rocío de sol, con
      hojas llenas de gotitas pegajosas con las que atrapa moscas; otra, el algodón de pantano.


      La mayor parte de esa turbera desapareció. Fochteloërveen formaba parte de la gran turbera
      drentino-frisona, excavada en su mayor parte desde 1660, y se conservó por casualidad histórica, quizá
      por su situación aislada en un límite provincial. Desde el siglo diecisiete se extrajo turba a gran
      escala como combustible doméstico: aún se ven las zanjas y fosas de la extracción desde la carretera.


      Hoy el trabajo es devolverle agua. Se ha vuelto a mojar el terreno con tablestacas, zanjas cegadas y
      compuertas, y el estudio sobre la rehumectación mostró que el musgo de turbera marrón vuelve y que el
      algodón de pantano gana terreno a la molinia. Los diques de madera pierden agua, y se sustituyen por
      otros de arena y arcilla. El Esmeer es una ruina de pingo, resto de la última glaciación.
    wildlife: >-
      La primavera empieza con una danza. Las grullas hacen su baile nupcial con las alas extendidas y saltos
      de metros; con suerte se ve desde la torre De Zeven. Tras 25 años de cría, un recuento de
      Natuurmonumenten halló 14 parejas y 11 pollos volanderos.


      En verano el protagonista es el sol. Puedes ver una víbora tomando el sol en un sendero; también viven
      la culebra lisa y la de collar, y algunos años pasa el verano una culebrera europea. Con suerte aparece
      el macaón, la mayor mariposa de Países Bajos, en los campos de la Uitkijktorenroute; y el
      veenhooibeestje, una mariposa, tiene aquí una de sus últimas grandes poblaciones. En el borde del bosque
      se puede oír o ver el pito negro.


      Entre las aves de la turbera destacan la tarabilla norteña, con decenas de parejas, y el aguilucho
      pálido; el andarríos bastardo reapareció en 2004 en los lodazales creados al subir el nivel freático. En
      invierno miles de ánsares duermen en el Esmeer y de día comen en los campos. Hay una ausencia que se
      nota: el gallo lira tuvo aquí una de las mayores poblaciones del país hasta los años setenta y se
      extinguió a comienzos de los ochenta, sin causa aclarada.
    visit: >-
      Empieza por la torre De Zeven: 18 metros, con una escalera con un quiebro para que quien sufre vértigo
      no vea la altura total, y apodada «periscopio». Su ventana panorámica mira al norte para evitar el
      contraluz, y por el visor se pueden ver grullas. La Uitkijktorenroute mide unos 3 km, pasa por bosques
      con historia y por la torre, con vistas sobre la turbera, y se marca con flechas verdes.


      Para meterte en la turbera, la Hoogveenroute mide 11 km y cruza la turbera y los bosques de borde; las
      grullas se ven con facilidad porque están todo el año, y la ruta se marca con flechas rojas. También se
      puede empezar desde Veenhuizen, donde hay aparcamiento, y entonces mide cuatro kilómetros más. La
      Fochteloërveenroute, de casi 6 km, se marca con postes verdes y une el pueblo-prisión de Veenhuizen con
      la turbera. En bicicleta, la ruta ciclista recorre 42 km y se hace en cuatro horas; cruza dos veces
      zonas con grandes herbívoros, con señales que explican las normas. El mirador de Stallaan da a una gran
      lámina de agua, antes campo de cultivo, donde las grullas se hacen oír.
    history: >-
      Fochteloërveen estuvo a punto de desaparecer. Natuurmonumenten compró las primeras 200 hectáreas en
      1938, y hoy gestiona unas 1100 ha, mientras que Staatsbosbeheer gestiona unas 1400 ha. Haber cerrado al
      tráfico motorizado una carretera salva a animales que la cruzan, sobre todo serpientes.


      También hay memoria humana. Veenhuizen fue una colonia penitenciaria, y los presos trabajaron en el
      bosque sobre diques bajos para drenar el terreno. Entre 1941 y mediados de los sesenta hubo en el borde
      dos campos de barracones, Oranje e Ybenheer, hoy con paneles informativos.
    before: >-
      La Hoogveenroute es larga, así que decide si empiezas en el aparcamiento de la turbera o en Veenhuizen.
      En la ruta ciclista, respeta las normas que indican las señales en las zonas con grandes herbívoros. Lo
      mejor es la primavera, para ver bailar a las grullas.
    around: >-
      No hay otro espacio del atlas cerca. A distancia, comparten especies con Fochteloërveen: [The Flow
      Country](/lugar/the-flow-country/), con el aguilucho pálido; la [Reserva de Deurnsche Peel y
      Mariapeel](/lugar/deurnsche-peel---mariapeel/) y los [Humedales de
      Diepholz](/lugar/diepholzer-moorniederung/), con la grulla común.
  en:
    intro: >-
      In 2001 a pair of [common cranes](/especie/grus_grus/) bred in Fochteloërveen. It was the first
      successful breeding in 250 years, marking the species' return as a breeder in the Netherlands. Since
      then the cranes have stayed: some visitors find them here year-round, and their bugling call is
      unmistakable.


      Fochteloërveen is a 2,500-hectare reserve on the border between Friesland and Drenthe, beside the
      village of Veenhuizen. It is one of the few places in the Netherlands where living raised bog remains,
      and one of the finest remnants of what were vast bogs across north-western Europe. It survived almost by
      chance.
    landscape: >-
      A raised bog takes patience to build. It forms only where rainwater lingers and bog moss grows, soaking
      up water like a sponge and rising above the surrounding ground. Below, the moss dies without rotting;
      above, it keeps growing, and over centuries a thick layer of peat builds up. On that acidic,
      nutrient-poor soil only very specialised plants survive. One is sundew, with leaves covered in sticky
      droplets to trap flies; another is cottongrass.


      Most of that bogland disappeared. Fochteloërveen belonged to the great Drenthe–Frisian bog, mostly dug
      away from 1660 onwards, and survived through historical accident, perhaps thanks to its isolated
      position on a provincial boundary. From the seventeenth century peat was cut on a large scale as
      domestic fuel: you can still see the extraction ditches and pits from the road.


      Today the work is giving water back to it. The ground has been rewetted using sheet piling, blocked
      ditches and sluices, and monitoring of the rewetting showed that brown bog moss is returning and
      cottongrass is gaining ground over purple moor-grass. Wooden dykes leak, so they are being replaced with
      sand and clay embankments. The Esmeer is a pingo scar, a relic of the last ice age.
    wildlife: >-
      Spring begins with a dance. Cranes perform their courtship dance with outstretched wings and metre-high
      leaps; with luck you can watch it from the De Zeven tower. After 25 years of breeding, a
      Natuurmonumenten count recorded 14 pairs and 11 fledged chicks.


      In summer the sun takes centre stage. You may spot an adder basking on a path; smooth snake and grass
      snake also live here, and in some years a short-toed snake eagle spends the summer. With luck, the Old
      World swallowtail, the largest butterfly in the Netherlands, appears in the fields along the
      Uitkijktorenroute; and the large heath butterfly has one of its last strongholds here. Along the
      woodland edge you can hear or see the black woodpecker.


      Among bog birds, the whinchat stands out with dozens of pairs, along with the hen harrier; the wood
      sandpiper reappeared in 2004 on mudflats created when the water table was raised. In winter thousands of
      geese roost on the Esmeer and feed in the fields by day. One absence is felt: the black grouse had one
      of its largest Dutch populations here until the seventies and died out in the early eighties, for
      reasons never fully explained.
    visit: >-
      Start at the De Zeven tower: 18 metres tall, with a kink in its staircase so visitors with vertigo
      cannot see the full height, nicknamed the «periscope». Its panoramic window faces north to avoid glare,
      and through the viewing scope you can spot cranes. The Uitkijktorenroute is around 3 km long, passes
      historic woodland and the tower with views over the bog, and is marked with green arrows.


      To head deep into the bog, the Hoogveenroute runs for 11 km across the mire and bordering woods; cranes
      are easy to see as they stay year-round, and the trail is marked with red arrows. You can also start
      from Veenhuizen, where there is parking, which adds four kilometres. The Fochteloërveenroute, nearly 6
      km long, is marked with green posts and links the former prison village of Veenhuizen with the bog. By
      bike, the cycling route covers 42 km and takes four hours; it crosses areas with large herbivores twice,
      with signs explaining the rules. The Stallaan viewpoint overlooks a large sheet of water, formerly
      farmland, where cranes make themselves heard.
    history: >-
      Fochteloërveen came close to vanishing. Natuurmonumenten bought the first 200 hectares in 1938, and
      today manages around 1,100 ha, while Staatsbosbeheer manages around 1,400 ha. Closing a road to motor
      traffic saves animals crossing it, especially snakes.


      There is human memory here too. Veenhuizen was a penal colony, and prisoners worked in the forest on low
      dykes to drain the land. Between 1941 and the mid-sixties two barrack camps, Oranje and Ybenheer, stood
      on the edge, marked today by information panels.
    before: >-
      The Hoogveenroute is long, so decide whether to start at the bog car park or in Veenhuizen. On the
      cycling route, follow the rules shown on signs in the large-herbivore zones. Spring is best for watching
      the cranes dance.
    around: >-
      There is no other atlas site nearby. Further afield, these sites share species with Fochteloërveen: [The
      Flow Country](/lugar/the-flow-country/) shares the hen harrier; [Deurnsche Peel and Mariapeel
      Reserves](/lugar/deurnsche-peel---mariapeel/) and [Diepholz Moorland](/lugar/diepholzer-moorniederung/)
      share the common crane.
  fr:
    intro: >-
      En 2001, un couple de [grues cendrées](/especie/grus_grus/) a niché à Fochteloërveen. C'était la
      première reproduction réussie en 250 ans, marquant le retour de l'espèce comme nicheuse aux Pays-Bas.
      Depuis, les grues sont restées : certains visiteurs en voient toute l'année, et leur cri claironnant est
      reconnaissable entre tous.


      Fochteloërveen est une réserve de 2 500 hectares à la limite entre la Frise et la Drenthe, près du
      village de Veenhuizen. C'est l'un des rares endroits des Pays-Bas où subsiste une tourbière haute
      vivante, et l'un des plus beaux vestiges de ce que furent les immenses tourbières du nord-ouest de
      l'Europe. Elle a été sauvée presque par hasard.
    landscape: >-
      Une tourbière haute se forme avec patience. Elle ne naît que là où l'eau de pluie stagne et où pousse la
      sphaigne, qui absorbe l'eau comme une éponge et s'élève au-dessus du sol. En dessous, la mousse meurt
      sans pourrir ; au-dessus, elle continue de croître, et après des siècles s'accumule une épaisse couche
      de tourbe. Sur ce sol acide et pauvre, seules survivent des espèces très spécialisées. L'une est le
      rossolis, aux feuilles couvertes de gouttelettes collantes pour piéger les mouches ; une autre est la
      linaigrette.


      La plus grande partie de cette tourbière a disparu. Fochteloërveen faisait partie de la grande tourbière
      frisonne-drentoise, en grande partie creusée depuis 1660, et s'est conservée par hasard historique,
      peut-être en raison de son isolement sur une limite provinciale. Depuis le dix-septième siècle, la
      tourbe y fut extraite à grande échelle comme combustible domestique : on voit encore les fossés et
      fosses d'extraction depuis la route.


      Aujourd'hui, le travail consiste à lui rendre l'eau. Le terrain a été réhumidifié grâce à des
      palplanches, des fossés comblés et des vannes, et le suivi de la réhumidification a montré que la
      sphaigne brune revient et que la linaigrette gagne du terrain face à la molinie. Les digues en bois
      fuient et sont remplacées par des digues de sable et d'argile. L'Esmeer est une dépression de pingo,
      vestige de la dernière glaciation.
    wildlife: >-
      Le printemps commence par une danse. Les grues exécutent leur parade nuptiale, ailes déployées et sauts
      de plusieurs mètres ; avec de la chance, on l'observe depuis la tour De Zeven. Après 25 ans de
      reproduction, un comptage de Natuurmonumenten a recensé 14 couples et 11 jeunes volants.


      En été, le soleil mène la danse. Vous pouvez voir une vipère péliade se chauffer sur un sentier ; la
      coronelle lisse et la couleuvre à collier vivent aussi ici, et certaines années un circaète
      Jean-le-Blanc y passe l'été. Avec un peu de chance, le machaon, le plus grand papillon des Pays-Bas,
      apparaît dans les champs de l'Uitkijktorenroute ; et le fadet des tourbières possède ici l'une de ses
      dernières grandes populations. En lisière de forêt, on entend ou on voit le pic noir.


      Parmi les oiseaux de la tourbière se distinguent le tarier des prés, avec des dizaines de couples, et le
      busard Saint-Martin ; le chevalier sylvain est réapparu en 2004 dans les vasières créées par la remontée
      de la nappe. En hiver, des milliers d'oies dorment sur l'Esmeer et se nourrissent le jour dans les
      champs. Une absence se remarque : le tétras lyre avait ici l'une de ses plus grandes populations du pays
      jusqu'aux années soixante-dix et s'est éteint au début des années quatre-vingt, sans cause élucidée.
    visit: >-
      Commencez par la tour De Zeven : haute de 18 mètres, avec un escalier coudé pour que ceux qui ont le
      vertige ne voient pas toute la hauteur, et surnommée « périscope ». Sa fenêtre panoramique est orientée
      au nord pour éviter le contre-jour, et la longue-vue permet d'observer les grues. L'Uitkijktorenroute
      mesure environ 3 km, traverse des bois chargés d'histoire et passe par la tour, avec vue sur la
      tourbière ; elle est balisée de flèches vertes.


      Pour entrer dans la tourbière, la Hoogveenroute mesure 11 km et traverse la tourbière et les bois de
      bordure ; les grues s'y voient facilement car elles restent toute l'année, et le sentier est balisé de
      flèches rouges. On peut aussi partir de Veenhuizen, où il y a un parking, ce qui ajoute quatre
      kilomètres. La Fochteloërveenroute, longue de presque 6 km, est balisée de poteaux verts et relie le
      village pénitentiaire de Veenhuizen à la tourbière. À vélo, l'itinéraire cyclable couvre 42 km et
      demande quatre heures ; il traverse deux fois des zones à grands herbivores, avec des panneaux
      expliquant les règles. Le belvédère de Stallaan donne sur un grand plan d'eau, autrefois cultivé, où les
      grues se font entendre.
    history: >-
      Fochteloërveen a failli disparaître. Natuurmonumenten a acheté les 200 premiers hectares en 1938 et gère
      aujourd'hui quelque 1 100 ha, tandis que Staatsbosbeheer en gère quelque 1 400 ha. La fermeture d'une
      route à la circulation motorisée sauve les animaux qui la traversent, surtout les serpents.


      Il y a aussi une mémoire humaine. Veenhuizen fut une colonie pénitentiaire, et les détenus travaillaient
      dans la forêt sur de petites digues pour drainer le terrain. Entre 1941 et le milieu des années soixante
      existaient en bordure deux camps de baraquements, Oranje et Ybenheer, aujourd'hui signalés par des
      panneaux d'information.
    before: >-
      La Hoogveenroute est longue : décidez si vous partez du parking de la tourbière ou de Veenhuizen. Sur
      l'itinéraire cyclable, respectez les règles indiquées par les panneaux dans les zones à grands
      herbivores. Le printemps est idéal pour voir danser les grues.
    around: >-
      Il n'y a pas d'autre espace de l'atlas à proximité. Plus loin, ces sites partagent des espèces avec
      Fochteloërveen : [The Flow Country](/lugar/the-flow-country/), avec le busard Saint-Martin ; la [Réserve
      de Deurnsche Peel et Mariapeel](/lugar/deurnsche-peel---mariapeel/) et les [Zones humides de
      Diepholz](/lugar/diepholzer-moorniederung/), avec la grue cendrée.
  de:
    intro: >-
      2001 brütete ein Paar des [Kranichs](/especie/grus_grus/) im Fochteloërveen. Es war die erste
      erfolgreiche Brut seit 250 Jahren und markierte die Rückkehr der Art als Brutvogel in die Niederlande.
      Seither sind die Kraniche geblieben: Manche trifft man das ganze Jahr über an, und ihr Trompeten ist
      unverwechselbar.


      Fochteloërveen ist ein 2.500 Hektar großes Reservat an der Grenze zwischen Friesland und Drenthe, neben
      dem Dorf Veenhuizen. Es ist einer der wenigen Orte der Niederlande, an denen noch lebendes Hochmoor
      erhalten ist, und einer der besten Reste der einst gewaltigen Moore Nordwesteuropas. Es entging der
      Zerstörung fast durch Zufall.
    landscape: >-
      Ein Hochmoor entsteht mit Geduld. Es bildet sich nur dort, wo Regenwasser stehen bleibt und Torfmoos
      wächst, das Wasser wie ein Schwamm aufsaugt und über das Gelände hinauswächst. Unten stirbt das Moos ab,
      ohne zu verrotten; oben wächst es weiter, und über Jahrhunderte sammelt sich eine dicke Torfschicht an.
      Auf diesem sauren, nährstoffarmen Boden überleben nur hochspezialisierte Arten. Eine ist der Sonnentau
      mit klebrigen Tröpfchen auf den Blättern, um Fliegen zu fangen; eine andere das Wollgras.


      Der größte Teil dieses Moores verschwand. Fochteloërveen gehörte zum großen Drenthe-Friesischen Moor,
      das ab 1660 größtenteils abgegraben wurde, und blieb durch historischen Zufall erhalten, vielleicht
      wegen seiner abgeschiedenen Lage an einer Provinzgrenze. Seit dem siebzehnten Jahrhundert wurde Torf im
      großen Stil als Hausbrand gestochen: Die Gräben und Torfstiche sind noch von der Straße aus zu sehen.


      Heute geht es darum, ihm Wasser zurückzugeben. Das Gelände wurde mit Spundwänden, verschlossenen Gräben
      und Wehren wiedervernässt, und die Begleitstudie zeigte, dass das braune Torfmoos zurückkehrt und das
      Wollgras gegenüber dem Pfeifengras Boden gewinnt. Holzdeiche verlieren Wasser und werden durch Sand- und
      Tondämme ersetzt. Das Esmeer ist ein Pingo-Relikt aus der letzten Eiszeit.
    wildlife: >-
      Der Frühling beginnt mit einem Tanz. Die Kraniche führen ihren Balztanz mit ausgebreiteten Flügeln und
      meterhohen Sprüngen auf; mit etwas Glück sieht man ihn vom Turm De Zeven. Nach 25 Jahren Brutzeit ergab
      eine Zählung von Natuurmonumenten 14 Paare und 11 flügge Jungvögel.


      Im Sommer übernimmt die Sonne. Man kann eine Kreuzotter beim Sonnenbaden auf einem Pfad sehen; auch
      Schlingnatter und Ringelnatter leben hier, und in manchen Jahren verbringt ein Schlangenadler den Sommer
      im Gebiet. Mit Glück erscheint der Schwalbenschwanz, der größte Tagfalter der Niederlande, auf den
      Feldern der Uitkijktorenroute; und das Große Wiesenvögelchen hat hier eine seiner letzten großen
      Populationen. Am Waldrand hört oder sieht man den Schwarzspecht.


      Unter den Moorvögeln ragen das Braunkehlchen mit Dutzenden Paaren und die Kornweihe heraus; der
      Bruchwasserläufer kehrte 2004 auf den durch den höheren Wasserstand entstandenen Schlammflächen zurück.
      Im Winter schlafen Tausende Gänse auf dem Esmeer und fressen tagsüber auf den Feldern. Ein Fehlen fällt
      auf: Das Birkhuhn hatte hier bis in die siebziger Jahre einen seiner größten Bestände des Landes und
      starb Anfang der achtziger Jahre aus, ohne geklärte Ursache.
    visit: >-
      Beginne am Turm De Zeven: 18 Meter hoch, mit einem Knick in der Treppe, damit Menschen mit Höhenangst
      nicht die volle Höhe sehen, und «Periskop» genannt. Sein Panoramafenster weist nach Norden, um
      Gegenlicht zu vermeiden, und durch das Fernrohr lassen sich Kraniche beobachten. Die Uitkijktorenroute
      ist etwa 3 km lang, führt durch geschichtsträchtige Wälder und am Turm vorbei mit Blick über das Moor,
      markiert mit grünen Pfeilen.


      Um tief ins Moor zu gehen, führt die 11 km lange Hoogveenroute durch das Hochmoor und die Randwälder;
      die Kraniche sind leicht zu sehen, da sie ganzjährig bleiben, und der Weg ist mit roten Pfeilen
      markiert. Man kann auch in Veenhuizen starten, wo es einen Parkplatz gibt, dann ist die Strecke vier
      Kilometer länger. Die fast 6 km lange Fochteloërveenroute ist mit grünen Pfosten markiert und verbindet
      das Gefängnisdorf Veenhuizen mit dem Moor. Mit dem Rad misst die Radroute 42 km und dauert vier Stunden;
      sie quert zweimal Zonen mit großen Pflanzenfressern, mit Schildern zu den Regeln. Der Aussichtspunkt
      Stallaan blickt auf eine große Wasserfläche, einst Ackerland, wo die Kraniche zu hören sind.
    history: >-
      Fochteloërveen stand kurz vor dem Verschwinden. Natuurmonumenten kaufte 1938 die ersten 200 Hektar und
      betreut heute rund 1.100 ha, während Staatsbosbeheer rund 1.400 ha verwaltet. Die Sperrung einer Straße
      für den Autoverkehr rettet querende Tiere, vor allem Schlangen.


      Auch menschliche Geschichte ist präsent. Veenhuizen war eine Strafkolonie, und die Gefangenen arbeiteten
      im Wald auf niedrigen Dämmen, um das Land zu entwässern. Zwischen 1941 und Mitte der sechziger Jahre
      standen am Rand zwei Barackenlager, Oranje und Ybenheer, heute mit Infotafeln versehen.
    before: >-
      Die Hoogveenroute ist lang, entscheide also, ob du am Moorparkplatz oder in Veenhuizen startest. Beachte
      auf der Radroute die Regeln auf den Schildern in den Bereichen mit großen Pflanzenfressern. Am besten
      ist der Frühling, um den Tanz der Kraniche zu sehen.
    around: >-
      In der Nähe gibt es kein anderes Atlas-Gebiet. Weiter entfernt teilen diese Gebiete Arten mit
      Fochteloërveen: [The Flow Country](/lugar/the-flow-country/) mit der Kornweihe; das [Reservat Deurnsche
      Peel und Mariapeel](/lugar/deurnsche-peel---mariapeel/) und die [Diepholzer
      Moorniederung](/lugar/diepholzer-moorniederung/) mit dem Kranich.
  it:
    intro: >-
      Nel 2001 una coppia di [gru](/especie/grus_grus/) nidificò a Fochteloërveen. Era la prima riproduzione
      riuscita in 250 anni e segnò il ritorno della specie come nidificante nei Paesi Bassi. Da allora le gru
      sono rimaste: c'è chi le incontra tutto l'anno e il loro richiamo squillante è inconfondibile.


      Fochteloërveen è una riserva di 2.500 ettari al confine tra Frisia e Drenthe, vicino al villaggio di
      Veenhuizen. È uno dei pochi luoghi dei Paesi Bassi dove resta torbiera alta viva, e uno dei migliori
      frammenti di quelle che furono immense torbiere dell'Europa nord-occidentale. Si salvò quasi per caso.
    landscape: >-
      Una torbiera alta si forma con pazienza. Nasce solo dove l'acqua piovana ristagna e cresce lo sfagno,
      che assorbe l'acqua come una spugna e cresce al di sopra del terreno. Sotto il muschio muore senza
      marcire; sopra continua a crescere, e dopo secoli si accumula uno spesso strato di torba. Su quel suolo
      acido e povero sopravvivono solo specie molto particolari. Una è la drosera, con foglie piene di
      goccioline appiccicose per catturare le mosche; un'altra è l'erioforo.


      La maggior parte di quella torbiera è scomparsa. Fochteloërveen faceva parte della grande torbiera tra
      Drenthe e Frisia, scavata in gran parte dal 1660, e si conservò per caso storico, forse per la posizione
      isolata su un confine provinciale. Dal diciassettesimo secolo la torba fu estratta su larga scala come
      combustibile domestico: dalla strada si vedono ancora i fossi e le cave dell'estrazione.


      Oggi il lavoro è restituirle acqua. Il terreno è stato riumidificato con palancole, fossi chiusi e
      paratoie, e lo studio sulla riumidificazione ha mostrato che lo sfagno bruno sta tornando e che
      l'erioforo guadagna terreno sulla molinia. Gli argini di legno perdono acqua e vengono sostituiti da
      altri di sabbia e argilla. L'Esmeer è una conca di pingo, resto dell'ultima glaciazione.
    wildlife: >-
      La primavera comincia con una danza. Le gru eseguono la loro danza nuziale con le ali spiegate e salti
      di metri; con fortuna si osserva dalla torre De Zeven. Dopo 25 anni di nidificazione, un conteggio di
      Natuurmonumenten ha rilevato 14 coppie e 11 giovani involati.


      D'estate il protagonista è il sole. Puoi vedere un marasso crogiolarsi su un sentiero; vivono qui anche
      la coronella austriaca e la biscia dal collare, e alcuni anni vi trascorre l'estate un biancone. Con
      fortuna compare il macaone, la più grande farfalla dei Paesi Bassi, nei campi della Uitkijktorenroute; e
      la *veenhooibeestje*, una farfalla, ha qui una delle sue ultime grandi popolazioni. Al margine del bosco
      si può sentire o vedere il picchio nero.


      Tra gli uccelli della torbiera spiccano lo stiaccino, con decine di coppie, e l'albanella reale; il
      piro-piro boschereccio è ricomparso nel 2004 nei fanghi creati dall'innalzamento della falda. D'inverno
      migliaia di oche dormono sull'Esmeer e di giorno mangiano nei campi. C'è un'assenza che si nota: il
      fagiano di monte ebbe qui una delle maggiori popolazioni del paese fino agli anni settanta e si estinse
      all'inizio degli anni ottanta, senza una causa chiarita.
    visit: >-
      Inizia dalla torre De Zeven: 18 metri, con una scala spezzata affinché chi soffre di vertigini non veda
      l'altezza totale, soprannominata «periscopio». La sua finestra panoramica guarda a nord per evitare il
      controluce, e dal visore si possono osservare le gru. La Uitkijktorenroute misura circa 3 km, passa per
      boschi ricchi di storia e per la torre, con vista sulla torbiera, ed è segnalata con frecce verdi.


      Per addentrarti nella torbiera, la Hoogveenroute misura 11 km e attraversa la torbiera e i boschi di
      margine; le gru si vedono facilmente perché restano tutto l'anno, e il sentiero è segnalato con frecce
      rosse. Si può partire anche da Veenhuizen, dove c'è parcheggio, allungando di quattro chilometri. La
      Fochteloërveenroute, di quasi 6 km, è segnalata con pali verdi e unisce il villaggio-prigione di
      Veenhuizen alla torbiera. In bicicletta, l'itinerario ciclabile percorre 42 km e richiede quattro ore;
      attraversa due volte zone con grandi erbivori, con cartelli che spiegano le regole. Il belvedere di
      Stallaan si affaccia su un grande specchio d'acqua, un tempo coltivato, dove le gru si fanno sentire.
    history: >-
      Fochteloërveen fu sul punto di scomparire. Natuurmonumenten comprò i primi 200 ettari nel 1938 e oggi
      gestisce circa 1.100 ha, mentre Staatsbosbeheer ne gestisce circa 1.400 ha. Aver chiuso al traffico
      motorizzato una strada salva gli animali che la attraversano, soprattutto i serpenti.


      C'è anche memoria umana. Veenhuizen fu una colonia penale, e i detenuti lavorarono nel bosco su bassi
      argini per drenare il terreno. Tra il 1941 e la metà degli anni sessanta sorsero ai margini due campi di
      baracche, Oranje e Ybenheer, oggi dotati di pannelli informativi.
    before: >-
      La Hoogveenroute è lunga, quindi decidi se partire dal parcheggio della torbiera o da Veenhuizen.
      Sull'itinerario ciclabile rispetta le regole indicate dai cartelli nelle zone con grandi erbivori. La
      primavera è il momento migliore per veder danzare le gru.
    around: >-
      Non c'è un altro spazio dell'atlante nelle vicinanze. A distanza, condividono specie con Fochteloërveen:
      [The Flow Country](/lugar/the-flow-country/), con l'albanella reale; la [Riserva di Deurnsche Peel e
      Mariapeel](/lugar/deurnsche-peel---mariapeel/) e le [Zone umide di
      Diepholz](/lugar/diepholzer-moorniederung/), con la gru.
  pt:
    intro: >-
      Em 2001, um casal de [grous-comuns](/especie/grus_grus/) criou em Fochteloërveen. Foi a primeira criação
      com sucesso em 250 anos, e marcou o regresso da espécie como reprodutora nos Países Baixos. Desde então
      os grous ficaram: há quem os encontre todo o ano, e o seu trombetear é inconfundível.


      Fochteloërveen é uma reserva de 2.500 hectares no limite entre a Frísia e Drenthe, junto à aldeia de
      Veenhuizen. É um dos poucos lugares dos Países Baixos onde resta turfeira alta viva, e um dos melhores
      vestígios do que foram enormes turfeiras do noroeste da Europa. Salvou-se quase por acaso.
    landscape: >-
      Uma turfeira alta faz-se com paciência. Só se forma onde a água da chuva fica retida e cresce o esfagno,
      que absorve a água como uma esponja e vai crescendo acima do terreno. Em baixo o musgo morre sem
      apodrecer; por cima continua a crescer, e ao fim de séculos acumula-se uma camada espessa de turfa.
      Nesse solo ácido e pobre só sobrevivem espécies muito especiais. Uma delas é a orvalhinha, com folhas
      cheias de gotículas pegajosas com que apanha moscas; outra, o algodão-dos-pântanos.


      A maior parte dessa turfeira desapareceu. Fochteloërveen fazia parte da grande turfeira drento-frísia,
      escavada na sua maioria desde 1660, e conservou-se por acaso histórico, talvez pela sua situação isolada
      num limite provincial. Desde o século dezassete extraiu-se turfa em grande escala como combustível
      doméstico: ainda se veem as valas e fossas da extração a partir da estrada.


      Hoje o trabalho é devolver-lhe água. Voltou a molhar-se o terreno com estacas-prancha, valas tapadas e
      comportas, e o estudo sobre a reumidificação mostrou que o esfagno castanho regressa e que o
      algodão-dos-pântanos ganha terreno à molínia. Os diques de madeira perdem água, e são substituídos por
      outros de areia e argila. O Esmeer é uma depressão de pingo, resto da última glaciação.
    wildlife: >-
      A primavera começa com uma dança. Os grous fazem a sua dança nupcial com as asas abertas e saltos de
      metros; com sorte vê-se da torre De Zeven. Após 25 anos de criação, uma contagem da Natuurmonumenten
      encontrou 14 casais e 11 crias voadoras.


      No verão o protagonista é o sol. Podes ver uma víbora-europeia a apanhar sol num trilho; também vivem a
      cobra-lisa e a cobra-de-água-de-colar, e alguns anos passa o verão uma águia-cobreira. Com sorte aparece
      o macaão, a maior borboleta dos Países Baixos, nos campos da Uitkijktorenroute; e a *veenhooibeestje*,
      uma borboleta, tem aqui uma das suas últimas grandes populações. Na orla do bosque pode ouvir-se ou
      ver-se o pica-pau-preto.


      Entre as aves da turfeira destacam-se o cartaxo-nortenho, com dezenas de casais, e o
      tartaranhão-azulado; o maçarico-bastardo reapareceu em 2004 nos lodaçais criados ao subir o nível
      freático. No inverno milhares de gansos dormem no Esmeer e de dia comem nos campos. Há uma ausência que
      se nota: o galo-lira teve aqui uma das maiores populações do país até aos anos setenta e extinguiu-se no
      início dos oitenta, sem causa esclarecida.
    visit: >-
      Começa pela torre De Zeven: 18 metros, com uma escada com um desvio para que quem sofre de vertigens não
      veja a altura total, e apelidada de «periscópio». A sua janela panorâmica olha a norte para evitar o
      contraluz, e pelo visor podem ver-se grous. A Uitkijktorenroute mede cerca de 3 km, passa por bosques
      com história e pela torre, com vista sobre a turfeira, e marca-se com setas verdes.


      Para entrar na turfeira, a Hoogveenroute mede 11 km e cruza a turfeira e os bosques de orla; os grous
      veem-se com facilidade porque ficam todo o ano, e o trilho marca-se com setas vermelhas. Também se pode
      começar em Veenhuizen, onde há estacionamento, e então mede mais quatro quilómetros. A
      Fochteloërveenroute, de quase 6 km, marca-se com postes verdes e liga a aldeia-prisão de Veenhuizen à
      turfeira. De bicicleta, a rota ciclável percorre 42 km e faz-se em quatro horas; cruza duas vezes zonas
      com grandes herbívoros, com sinais que explicam as regras. O miradouro de Stallaan dá para uma grande
      lâmina de água, antes campo de cultivo, onde os grous se fazem ouvir.
    history: >-
      Fochteloërveen esteve prestes a desaparecer. A Natuurmonumenten comprou os primeiros 200 hectares em
      1938, e hoje gere cerca de 1.100 ha, enquanto a Staatsbosbeheer gere cerca de 1.400 ha. Ter fechado ao
      trânsito motorizado uma estrada salva animais que a atravessam, sobretudo cobras.


      Também há memória humana. Veenhuizen foi uma colónia penal, e os reclusos trabalharam no bosque sobre
      diques baixos para drenar o terreno. Entre 1941 e meados dos anos sessenta houve na orla dois campos de
      barracas, Oranje e Ybenheer, hoje com painéis informativos.
    before: >-
      A Hoogveenroute é longa, portanto decide se começas no parque de estacionamento da turfeira ou em
      Veenhuizen. Na rota ciclável, respeita as regras que indicam os sinais nas zonas com grandes herbívoros.
      O melhor é a primavera, para ver dançar os grous.
    around: >-
      Não há outro espaço do atlas por perto. À distância, partilham espécies com Fochteloërveen: [The Flow
      Country](/lugar/the-flow-country/), com o tartaranhão-azulado; a [Reserva de Deurnsche Peel e
      Mariapeel](/lugar/deurnsche-peel---mariapeel/) e as [Zonas Húmidas de
      Diepholz](/lugar/diepholzer-moorniederung/), com o grou-comum.
