resumen:
  es: >-
    Meseta caliza alpina cortada por acantilados que alberga Eisriesenwelt, la cueva de hielo navegable más
    grande del planeta (42 km de galerías).
  en: >-
    Alpine limestone plateau rimmed by precipitous escarpments housing Eisriesenwelt, the largest explored ice
    cave on Earth (42 km of surveyed passages).
  fr: >-
    Haut plateau calcaire ceinturé de falaises abritant l'Eisriesenwelt, la plus grande grotte de glace
    explorée de la planète (42 km de galeries).
  de: >-
    Alpines Kalksteinplateau mit Steilwänden, das die Eisriesenwelt beherbergt, die größte erschlossene
    Eishöhle der Erde (42 km Gesamtlänge).
  it: >-
    Altopiano calcareo alpino cinto da pareti rocciose che racchiude Eisriesenwelt, la più grande caverna di
    ghiaccio accessibile al mondo (42 km di gallerie).
  pt: >-
    Planalto calcário alpino rodeado de escarpas que alberga a Eisriesenwelt, a maior caverna de gelo
    visitável do planeta (42 km de galerias).
unico:
