    Bajo una meseta sin ríos duerme la Eisriesenwelt, 42 kilómetros de cueva de los que solo el primero está
    cubierto de hielo.
  en: >-
    Beneath a riverless plateau slumbers Eisriesenwelt, 42 kilometers of caverns of which only the first is
    cloaked in ice.
  fr: >-
    Sous un haut plateau dépourvu d'eaux courantes sommeille l'Eisriesenwelt, 42 kilomètres de cavités dont
    seul le premier est recouvert de glace.
  de: >-
    Unter einer oberflächlich flusslosen Hochfläche schlummert die Eisriesenwelt, 42 Kilometer Höhlenräume,
    von denen nur der erste vereist ist.
  it: >-
    Sotto un altopiano privo di corsi d'acqua superficiali riposa l'Eisriesenwelt, 42 chilometri di grotte di
