  pt: >-
    Sob um planalto sem linhas de água à superfície dorme a Eisriesenwelt, 42 quilómetros de gruta dos quais
    apenas o primeiro se encontra gelado.
observaciones:
  es: >-
    La cueva es excursión de media jornada y no se visita en invierno. Si subes a la meseta, lleva el agua
    contigo: el karst casi no la da. Hay refugios suficientes, pero la experiencia en montaña no te la presta
    ninguno.
texto:
  es:
    intro: >-
      En lo alto del Tennengebirge llueve y no corre ni un arroyo. El agua baja, se cuela por grietas y
      dolinas y desaparece montaña adentro, donde lleva millones de años excavando cuevas. Este macizo de los
      Alpes Calcáreos del Norte, en Salzburgo, es una meseta de caliza del Dachstein muy karstificada, con
      unos 280 km² y su punto más alto en el Raucheck, a 2.430 metros. Por fuera es roca desnuda; por dentro,
      un queso de galerías con más de mil cuevas registradas, y entre ellas la mayor cueva de hielo del mundo.
    landscape: >-
      Piensa en una esponja de piedra. La caliza del Dachstein, muy fisurada, deja pasar casi toda la lluvia y
      el deshielo, de modo que en las alturas no hay corrientes de superficie. El agua se junta en sistemas de
      cuevas, y debajo de la caliza hay capas impermeables que se inclinan hacia el norte: por eso el macizo
      suelta su agua en numerosas surgencias al pie septentrional.


      Las cuevas guardan, además, la historia del relieve. Están ordenadas en niveles según la altura a la que
      estuvo el agua subterránea cuando se excavaron. El nivel de las cuevas gigantes, donde está la
      Eisriesenwelt, se formó en el Mioceno superior. La mayoría de las cuevas se sitúa entre los 1.500 y los
      1.600 metros de altitud, y el registro austriaco recoge más de mil en el macizo.


      La Eisriesenwelt hace algo contrario a lo esperable: crece en invierno. El frío entra por efecto
      chimenea hasta cerca de un kilómetro dentro de la cueva, la roca lo guarda hasta la primavera, y con el
      deshielo el agua se cuela por las grietas y se congela. Por eso el primer kilómetro es un palacio de
      hielo y el resto, caliza sin más.


      Unos 37 km² de la meseta superan los 2.000 metros. Al oeste, el río Salzach lo separa del macizo de
      Hagengebirge, ya en los Alpes de Berchtesgaden.
    wildlife: >-
      Lo que más se sabe de la fauna está bajo tierra. En la reserva natural vive el murciélago de herradura,
      una especie cavernícola muy amenazada, y se registran también el murciélago ratonero grande y el de
      bosque. Entre las aves registradas en los Alpes calizos, que incluyen este macizo, figuran el [águila
      real](/especie/aquila_chrysaetos/), el gavilán, el azor, el búho real, el grévol y el mirlo acuático.


      Las estaciones las marca el hielo y la nieve. La cueva suele abrir entre el 1 de mayo y el 26 de
      octubre; en invierno la entrada es inaccesible por la altitud y el peligro de aludes. En la meseta, el
      invierno es de esquí de travesía, sobre todo cruzando el plateau.
    visit: >-
      La visita estrella es la Eisriesenwelt. Del aparcamiento sale un camino a pie, y luego el teleférico
      sube hasta la entrada; desde allí, con buen tiempo, hay panorama sobre el valle del Salzach hasta los
      Hohe Tauern. La visita guiada dura una hora y cuarto y recorre un kilómetro de salas y esculturas de
      hielo; para la excursión completa cuenta con unas tres horas. Hay unos 1.400 escalones y temperaturas en
      torno a cero grados: ropa de abrigo y calzado firme. Dentro está prohibido filmar y fotografiar, y en la
      zona se pide no usar drones.


      Para caminar, el macizo es una meseta de travesías. El sendero europeo de largo recorrido E4, que
      coincide con la Via Alpina, cruza el sur de Lungötz a Werfen por la Söldenhütte, y el Salzburger Arnoweg
      recorre el oeste, de Annaberg a la Laufener Hütte y de ahí a Abtenau. Hay refugios de sobra, pero hace
      falta experiencia alpina y buena condición física, y cuenta con la falta de agua del karst y con el
      riesgo de desorientarte con niebla.


      Entre las cuevas del fondo del valle destacan la Brunnecker, en el paso Lueg, la Winnerfall y la Trickl:
      son cuevas activas con agua, que pueden inundarse en el deshielo.
    history: >-
      El nombre viene de la Tennalm, una majada de la parte oriental de la meseta. La cueva, en cambio, tiene
      una historia de leyenda. Los vecinos la conocían y la creían una entrada al infierno, así que no se
      atrevían a explorarla. En 1879 el naturalista salzburgués Anton Posselt avanzó unos 200 metros.
      Alexander von Mörk, que murió en la Primera Guerra Mundial, en 1914, reposa hoy en una urna dentro de
      ella. Las primeras visitas guiadas se hicieron en 1920 y, en 1955, el teleférico redujo a tres minutos
      una subida de hora y media. Las entradas sirven para financiar la exploración y el acondicionamiento de
      la cueva.


      Toda la meseta rocosa es reserva natural, con 8541,7 hectáreas, para conservar el gran bloque calizo y
      su variedad de formas kársticas, los pastos secos sobre caliza, las plantas y la riqueza animal. Las
      estribaciones del sur forman una zona de amortiguación como paisaje protegido, con 4781,3 hectáreas.
    before: >-
      La cueva es excursión de media jornada y no se visita en invierno. Si subes a la meseta, lleva el agua
      contigo: el karst casi no la da. Hay refugios suficientes, pero la experiencia en montaña no te la
      presta ninguno.
    around: >-
      A unos 8 km está la [Reserva Natural del Dachstein — Gosau, Hallstatt y
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/), y a 10 km el [Parque Nacional
      Berchtesgaden - Macizo de Hagengebirge](/lugar/nationalpark-berchtesgaden---hagengebirge/), al otro lado
      del Salzach. A unos 20 km queda el [Steinernes Meer - Mar de
      Piedra](/lugar/steinernes-meer---karst-plateau/) y a 26 km el [Grupo Ankogel - Altos
      Tauern](/lugar/ankogelgruppe---hohe-tauern/).
  en:
    intro: >-
      High upon the Tennengebirge rain falls copiously yet not a single brook flows across the surface.
      Rainwater and snowmelt instantly vanish into deep fissures and sinkholes, plunging into the mountain's
      core where subterranean waters have hollowed out cavern systems over millions of years. This prominent
      massif of the Northern Limestone Alps in Salzburg forms a severely karstified Dachsteinkalk limestone
      plateau spanning some 280 km², culminating at Raucheck at 2,430 meters. From outside it appears as sheer
      barren limestone; within, it is honeycombed with more than a thousand cataloged caves, including the
      grandest ice cave system on the planet.
    landscape: >-
      Envision a gigantic stone sponge. The heavily fractured Dachsteinkalk limestone allows precipitation to
      drain directly underground, leaving the plateau void of permanent surface streams. Infiltrating water
      converges in vast subterranean drainage networks; beneath the limestone lie impermeable basement strata
      dipping northwards, forcing underground aquifers to discharge through abundant karst resurgences along
      the northern base of the range.


      The caves also preserve the morphotectonic evolution of the Alps. Passages are arranged in stepped
      horizontal tiers corresponding to past water table elevations. The giant cave horizon housing
      Eisriesenwelt formed during the Late Miocene. Most cave entrances sit between 1,500 and 1,600 meters in
      altitude, with Austrian speleological registries listing more than a thousand caves across the massif.


      Eisriesenwelt behaves counterintuitively: its ice mass grows primarily during winter. Cold winter drafts
      enter through a chimney effect, penetrating nearly a kilometer into the mountain; the frigid rock
      retains this subzero chill into spring, freezing incoming surface meltwater into magnificent stalagmites
      and ice walls. Consequently, only the first kilometer forms an ice palace, while the remainder is dry
      limestone gallery.


      Roughly 37 km² of the plateau lie above 2,000 meters. To the west, the Salzach river separates it from
      the Hagengebirge in the Berchtesgaden Alps.
    wildlife: >-
      Much of the plateau's specialized fauna dwells beneath ground. The nature reserve shelters the lesser
      horseshoe bat, an endangered troglophile mammal, alongside greater mouse-eared and Bechstein's bats.
      Avifauna recorded across the Northern Limestone Alps includes the [golden
      eagle](/especie/aquila_chrysaetos/), Eurasian sparrowhawk, northern goshawk, Eurasian eagle-owl, hazel
      grouse, and white-throated dipper.


      The seasons are dictated by snow and ice. The cave generally welcomes visitors from 1 May to 26 October;
      in winter the entrance remains completely inaccessible due to high altitude and severe avalanche hazard.
      On the plateau, winter attracts experienced ski mountaineers undertaking wilderness traverses.
    visit: >-
      The premier highlight is the Eisriesenwelt. From the visitor parking area a foot trail leads to the
      cable car station, which ascends to the cave portal; in clear weather, panoramic vistas unfold across
      the Salzach valley toward the Hohe Tauern. The guided cave tour lasts one hour and a quarter, traversing
      a kilometer of ice formations; plan around three hours for the complete excursion. The tour involves
      ascending some 1,400 wooden steps in temperatures hovering around zero degrees Celsius: warm winter
      clothing, gloves, and sturdy footwear are essential. Photography and filming are prohibited inside the
      cave, and drone use is restricted across the mountain.


      For trekkers, the massif offers classic multi-day plateau traverses. European long-distance trail E4,
      coinciding here with the Via Alpina, traverses the southern flanks from Lungötz to Werfen via the
      Söldenhütte, while the Salzburger Arnoweg traverses the west from Annaberg to the Laufener Hütte and
      onwards to Abtenau. Numerous Alpine Club huts provide accommodation, but expeditions require alpine
      experience, sure-footedness, and awareness of the complete lack of surface water and severe fog
      disorientation risks.


      Active valley resurgence caves include the Brunneckerhöhle at Pass Lueg, Winnerfall, and Tricklhöhle:
      all subject to violent seasonal flooding during spring snowmelt.
    history: >-
      The massif takes its name from the Tennalm, an alpine pasture on the eastern rim of the plateau. The
      cave itself possesses a colorful folklore history. Local peasants had long known the dark maw, believing
      it to be the entrance to hell and avoiding it. In 1879 Salzburg naturalist Anton Posselt penetrated
      roughly 200 meters into the darkness. Speleologist Alexander von Mörk, killed in World War I in 1914,
      rests in an urn within the cave cathedral bearing his name. Guided public tours commenced in 1920, and
      in 1955 the aerial cable car reduced a arduous hour-and-a-half climb to just three minutes. Admission
      fees help fund ongoing exploration and scientific monitoring.


      The entire rocky high plateau is designated a nature reserve covering 8541.7 hectares, protecting alpine
      karst landforms, limestone grasslands, and montane ecosystems. The southern foothills form a landscape
      protection buffer encompassing 4781.3 hectares.
    before: >-
      The ice cave tour requires a half-day excursion and does not operate in winter. When venturing onto the
      high plateau, carry all drinking water with you: the karst terrain provides no springs. Mountain huts
      are plentiful, but alpine self-reliance and weather vigilance remain your responsibility.
    around: >-
      About 8 km away lies the [Dachstein Nature Reserve - Gosau, Hallstatt and
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/), and 10 km across the Salzach
      valley stands [Berchtesgaden National Park - Hagengebirge
      Massif](/lugar/nationalpark-berchtesgaden---hagengebirge/). Roughly 20 km to the west lies the
      [Steinernes Meer - Sea of Stone](/lugar/steinernes-meer---karst-plateau/) and 26 km to the south the
      [Ankogel Group - Hohe Tauern](/lugar/ankogelgruppe---hohe-tauern/).
  fr:
    intro: >-
      Sur les crêtes du Tennengebirge, les averses s'abattent sans qu'aucun ruisseau ne coule en surface.
      L'eau s'engouffre dans les fissures et dolines pour disparaître au cœur de la montagne, où elle creuse
      des gouffres depuis des millions d'années. Ce massif des Alpes calcaires septentrionales, dans le Land
      de Salzbourg, forme un plateau de calcaire du Dachstein intensément karstifié de quelque 280 km²,
      culminant au Raucheck à 2 430 mètres. À l'extérieur s'étend un désert de roche nue ; à l'intérieur
      s'enchevêtrent plus de mille grottes répertoriées, dont la plus vaste grotte de glace au monde.
    landscape: >-
      Imaginez une immense éponge de pierre. Le calcaire du Dachstein, très fissuré, absorbe la quasi-totalité
      des précipitations et des fontes, privant les hauteurs de tout réseau hydrographique superficiel. L'eau
      s'accumule dans des réseaux souterrains, bloquée par des couches imperméables inclinées vers le nord :
      le massif restitue ainsi ses eaux par de multiples résurgences karstiques à son piémont septentrional.


      Les galeries témoignent en outre de l'histoire géologique alpine. Elles s'étagent en niveaux
      correspondant aux paléo-nappes phréatiques. Le niveau des grottes géantes abritant l'Eisriesenwelt
      remonte au Miocène supérieur. La plupart des cavités s'ouvrent entre 1 500 et 1 600 mètres d'altitude,
      le cadastre spéléologique autrichien en recensant plus d'un millier dans le massif.


      L'Eisriesenwelt obéit à une dynamique singulière : sa glace s'accroît en hiver. Le froid hivernal
      s'engouffre par effet de cheminée jusqu'à près d'un kilomètre dans la montagne ; la roche conserve ce
      gel jusqu'au printemps, si bien que l'eau de fonte s'infiltrant au dégel gèle immédiatement. C'est
      pourquoi le premier kilomètre forme un palais de glace féerique tandis que la suite n'est que calcaire
      sec.


      Quelque 37 km² du plateau dépassent les 2 000 mètres. À l'ouest, la rivière Salzach le sépare du
      Hagengebirge, dans les Alpes de Berchtesgaden.
    wildlife: >-
      La faune remarquable se dissimule largement sous terre. La réserve naturelle abrite le petit rhinolophe,
      chauve-souris cavernicole vulnérable, ainsi que le grand murin et le murin de Bechstein. Parmi les
      oiseaux recensés dans les massifs calcaires figurent l'[aigle royal](/especie/aquila_chrysaetos/),
      l'épervier d'Europe, l'autour des palombes, le grand-duc d'Europe, la gélinotte des bois et le cincle
      plongeur.


      Les saisons sont rythmées par le gel et la neige. La grotte ouvre habituellement entre le 1 mai et le 26
      octobre ; en hiver son porche est inaccessible en raison de l'altitude et des risques d'avalanches. Sur
      le plateau, la saison froide est le domaine du ski de randonnée alpine.
    visit: >-
      La visite incontournable est l'Eisriesenwelt. Du parking, un sentier puis un téléphérique permettent de
      gagner l'entrée, dévoilant un panorama grandiose sur la vallée de la Salzach et les Hohe Tauern. La
      visite guidée dure une heure et quart sur un kilomètre de concrétions et sculptures glaciaires ; comptez
      environ trois heures pour l'excursion complète. Le parcours franchit environ 1 400 marches par une
      température voisine de zéro degré : prévoyez vêtements chauds et chaussures de marche. Les photos et
      vidéos sont interdites dans la cavité, et l'usage des drones est proscrit sur le site.


      Pour les marcheurs, le massif est un terrain de grandes traversées. Le sentier européen E4, combiné avec
      la Via Alpina, traverse le sud de Lungötz à Werfen via la Söldenhütte, tandis que l'Arnoweg de Salzbourg
      longe l'ouest d'Annaberg à la Laufener Hütte et Abtenau. Les refuges sont nombreux, mais l'absence d'eau
      et le brouillard imposent une réelle autonomie montagnarde.


      Parmi les grottes actives de fond de vallée figurent la Brunneckerhöhle au col Lueg, la Winnerfall et la
      Tricklhöhle, sujettes à de spectaculaires crues de fonte.
    history: >-
      Le nom découle de la Tennalm, un alpage de la bordure orientale du massif. La grotte de glace possède
      une histoire pittoresque : les habitants évitaient son gouffre qu'ils prenaient pour la porte des
      enfers. En 1879, le naturaliste salzbourgeois Anton Posselt s'y aventura sur quelque 200 mètres.
      Alexander von Mörk, mort en 1914 pendant la Première Guerre mondiale, repose dans une urne au cœur de la
      caverne. Les visites publiques ont débuté en 1920, et en 1955 le téléphérique réduisit à trois minutes
      une rude ascension d'une heure et demie. Les recettes financent la recherche et l'équipement du site.


      L'ensemble du haut plateau calcaire est classé réserve naturelle sur 8541,7 hectares, préservant ses
      modelés karstiques, ses pelouses d'altitude et sa faune. Les piémonts méridionaux constituent un paysage
      protégé tampon de 4781,3 hectares.
    before: >-
      La grotte glaciaire se visite en une demi-journée et ferme en hiver. Sur le plateau, emportez toute
      votre eau : le karst n'en fournit aucune en surface. Les refuges sont accueillants, mais l'expérience de
      la haute montagne demeure indispensable.
    around: >-
      À environ 8 km s'étend la [réserve naturelle du Dachstein — Gosau, Hallstatt et
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/), et à 10 km le [parc national
      de Berchtesgaden - Massif du Hagengebirge](/lugar/nationalpark-berchtesgaden---hagengebirge/) de l'autre
      côté de la Salzach. À 20 km se dresse le [Steinernes Meer - Mer de
      Pierre](/lugar/steinernes-meer---karst-plateau/) et à 26 km le [groupe Ankogel - Hohe
      Tauern](/lugar/ankogelgruppe---hohe-tauern/).
  de:
    intro: >-
      Auf den Höhen des Tennengebirges regnet es ergiebig, doch kein einziger Bach fließt über die Hänge. Das
      Niederschlagswasser versickert in Spalten und Dolinen und verschwindet im Berginneren, wo es seit
      Jahrmillionen Höhlensysteme aushöhlt. Dieses Massiv der Nördlichen Kalkalpen im Land Salzburg bildet ein
      stark verkarstetes Plateau aus Dachsteinkalk von rund 280 km² Ausdehnung, dessen höchster Punkt der
      Raucheck mit 2.430 Metern ist. Nach außen hin nackter Fels, gleicht das Massiv im Inneren einem
      durchlöcherten Gebilde mit über tausend erfassten Höhlen – darunter die größte Eishöhle der Erde.
    landscape: >-
      Das Gebirge gleicht einem riesigen Felsschwamm. Der klüftige Dachsteinkalk lässt Regen und Schmelzwasser
      versickern, sodass das Hochplateau frei von Oberflächengewässern bleibt. Das Wasser sammelt sich in
      unterirdischen Gerinnen und staut sich an undurchlässigen Schichten, die nach Norden einfallen: Daher
      tritt das Karstwasser an zahlreichen Quellen am Nordfuß des Massivs zutage.


      Die Höhlenniveaus spiegeln zudem die Hebung der Alpen wider. Die Gänge staffeln sich horizontal nach
      früheren Grundwasserständen. Das Riesenhöhlenniveau der Eisriesenwelt bildete sich im Oberen Miozän
      heraus. Die meisten Höhleneingänge liegen zwischen 1.500 und 1.600 Metern Höhe, wobei das
      österreichische Höhlenkataster weit über tausend Höhlen im Massiv verzeichnet.


      Die Eisriesenwelt verhält sich paradox: Sie wächst im Winter. Kaltluft strömt durch Kamineffekt bis zu
      rund einem Kilometer weit in die Höhle; das Gestein speichert diese Kälte bis in das Frühjahr, sodass
      eindringendes Schmelzwasser sofort zu Eisfiguren erstarrt. Deshalb bildet der erste Kilometer einen
      monumentalen Eispalast, während der restliche Höhlenverlauf aus trockenem Kalk besteht.


      Rund 37 km² der Hochfläche ragen über 2.000 Meter empor. Im Westen trennt die Salzach das Massiv vom
      Hagengebirge der Berchtesgadener Alpen.
    wildlife: >-
      Besondere Faunenelemente verbergen sich unter Tage. Das Naturschutzgebiet beherbergt die Kleine
      Hufeisennase, eine hochgradig gefährdete Fledermausart, neben Großem Mausohr und Fransenfledermaus. Zu
      den Vögeln der Kalkalpen gehören [Steinadler](/especie/aquila_chrysaetos/), Sperber, Habicht, Uhu,
      Haselhuhn und Wasseramsel.


      Die Jahreszeiten werden von Frost und Schnee bestimmt. Die Schauhöhle öffnet gewöhnlich vom 1. Mai bis
      26. Oktober; im Winter ist der Zugang wegen alpiner Lawinengefahr gesperrt. Auf dem Plateau gehört der
      Winter ausgedehnten Skidurchquerungen.
    visit: >-
      Hauptanziehungspunkt ist die Eisriesenwelt. Vom Parkplatz führt ein Fußweg zur Seilbahn, die zur
      Höhlenpforte hinaufführt; bei klarem Wetter reicht der Blick über das Salzachtal zu den Hohen Tauern.
      Die Führung dauert eine Stunde und ein Viertel über einen Kilometer vereiste Hallen; für die gesamte
      Tour sind rund drei Stunden einzuplanen. Etwa 1.400 Stufen sind bei Temperaturen um null Grad zu
      bewältigen: Warme Winterkleidung und feste Bergschuhe sind Pflicht. Fotografieren und Filmen sind im
      Höhleninneren untersagt, Drohnen im Gelände verboten.


      Für Bergwanderer bietet das Massiv reizvolle Plateauüberschreitungen. Der Weitwanderweg E4, hier mit der
      Via Alpina vereint, quert den Süden von Lungötz nach Werfen über die Söldenhütte, während der Salzburger
      Arnoweg den Westen von Annaberg zur Laufener Hütte und nach Abtenau erschließt. Berghütten stehen
      bereit, doch Karsttrockenheit und Nebelgefahr erfordern solide alpine Erfahrung.


      Zu den aktiven Wasserhöhlen im Talboden gehören die Brunneckerhöhle am Pass Lueg, der Winnerfall und die
      Tricklhöhle mit imposanten Schmelzwasseraustritten.
    history: >-
      Der Name leitet sich von der Tennalm auf der Ostseite der Hochfläche ab. Die Eishöhle blickt auf eine
      sagenumwobene Entdeckungsgeschichte zurück: Einheimische mieden den Eingang als Pforte zur Unterwelt.
      1879 drang der Salzburger Naturforscher Anton Posselt rund 200 Meter vor. Alexander von Mörk, 1914 im
      Ersten Weltkrieg gefallen, ruht in einer Urne im Dom der Höhle. 1920 begannen organisierte Führungen,
      und 1955 verkürzte die Seilbahn den anderthalbstündigen Fußanstieg auf drei Minuten. Eintrittsgelder
      dienen der wissenschaftlichen Erforschung.


      Die gesamte alpine Felsfläche ist als Naturschutzgebiet mit 8541,7 Hektar ausgewiesen, um Karstformen,
      Kalkrasen und Hochgebirgsfauna zu bewahren. Die südlichen Ausläufer bilden ein Landschaftsschutzgebiet
      von 4781,3 Hektar.
    before: >-
      Die Eishöhle erfordert einen halben Tag und schließt im Winter. Auf der Hochfläche musst du dein
      Trinkwasser komplett mittragen: Der Karst bietet keine Quellen. Schutzhütten sind vorhanden, alpine
      Trittsicherheit musst du selbst mitbringen.
    around: >-
      Rund 8 km entfernt liegt das [Naturschutzgebiet Dachstein — Gosau, Hallstatt und
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/), und in 10 km Entfernung
      jenseits der Salzach der [Nationalpark Berchtesgaden -
      Hagengebirge](/lugar/nationalpark-berchtesgaden---hagengebirge/). In 20 km Entfernung liegt das
      [Steinerne Meer](/lugar/steinernes-meer---karst-plateau/) und in 26 km die [Ankogelgruppe - Hohe
      Tauern](/lugar/ankogelgruppe---hohe-tauern/).
  it:
    intro: >-
      Sulle alture del Tennengebirge piove con frequenza ma non scorre alcun ruscello. L'acqua penetra
      all'istante in fessure e doline sparendo nelle viscere della montagna, dove da milioni di anni scava
      cavità carsiche. Questo massiccio delle Alpi Calcaree Settentrionali, nel Salisburghese, forma un
      altopiano in calcare di Dachstein intensamente carsificato di circa 280 km², culminante nel Raucheck a
      2.430 metri. All'esterno domina la nuda roccia; all'interno si cela un labirinto con oltre mille cavità
      esplorate, inclusa la maggiore grotta di ghiaccio del pianeta.
    landscape: >-
      Immagina una colossale spugna di pietra. Il calcare di Dachstein, pervaso da fratture, drena quasi per
      intero piogge e disgelo, privando le quote superiori di corsi d'acqua superficiali. Le acque si
      raggruppano in condotti ipogei sopra banchi impermeabili inclinati verso nord: il massiccio restituisce
      così il suo carico idrico attraverso numerose risorgenze alla sua base settentrionale.


      Le gallerie custodiscono inoltre la storia dell'evoluzione alpina. Si distribuiscono su livelli
      corrispondenti alle antiche quote delle falde freatiche. Il livello delle cavità giganti comprendente
      l'Eisriesenwelt risale al Miocene superiore. Gran parte degli accessi si colloca tra 1.500 e 1.600 metri
      di quota, e il catasto speleologico austriaco elenca oltre mille cavità nel massiccio.


      L'Eisriesenwelt presenta una dinamica singolare: la massa glaciale cresce in inverno. L'aria gelida
      penetra per effetto camino fino a circa un chilometro all'interno della montagna; la roccia trattiene il
      gelo fino a primavera, facendo congelare le acque di infiltrazione del disgelo. Per questa ragione il
      primo chilometro forma un castello di ghiaccio perenne, mentre il resto prosegue in calcare asciutto.


      Circa 37 km² dell'altopiano superano i 2.000 metri. A occidente la valle della Salzach lo separa
      dall'Hagengebirge, nelle Alpi di Berchtesgaden.
    wildlife: >-
      La fauna di maggior pregio biologico abita il sottosuolo. La riserva naturale protegge il ferro di
      cavallo minore, specie cavernicola minacciata, accanto al vespertilio maggiore e al vespertilio di
      Bechstein. Tra gli uccelli delle Alpi calcaree spiccano l'[aquila reale](/especie/aquila_chrysaetos/),
      lo sparviere, l'astore, il gufo reale, il francolino di monte e il merlo acquaiolo.


      L'avvicendarsi stagionale è scandito da gelo e neve. La grotta turistica apre di norma tra il 1 maggio e
      il 26 ottobre; in inverno l'ingresso è precluso per la quota elevata e il pericolo di valanghe.
      Sull'altopiano la stagione invernale è regno dello scialpinismo d'alta quota.
    visit: >-
      La meta cardine è l'Eisriesenwelt. Dal parcheggio si sale a piedi e in funivia fino all'ingresso,
      godendo con meteo limpido di una vista aperta sulla valle della Salzach fino agli Alti Tauri. La visita
      guidata richiede un'ora e un quarto snodandosi su un chilometro di sculture e sale ghiacciate; per
      l'escursione completa preventivate circa tre ore. Il percorso conta circa 1.400 gradini con temperature
      prossime a zero gradi: abbigliamento pesante e calzature da trekking sono indispensabili. È vietato
      fotografare e filmare nella grotta, ed è vietato l'uso di droni.


      Per gli escursionisti il massiccio è terra di grandi traversate. Il sentiero europeo E4, coincidente con
      la Via Alpina, traversa il sud da Lungötz a Werfen passando dalla Söldenhütte, mentre l'Arnoweg di
      Salisburgo tocca l'ovest da Annaberg alla Laufener Hütte fino ad Abtenau. I rifugi sono distribuiti
      lungo i percorsi, ma la siccità del carso e la nebbia impongono solida esperienza.


      Tra le risorgenze attive di fondovalle spiccano la Brunneckerhöhle al passo Lueg, la Winnerfall e la
      Tricklhöhle, interessate da piene impetuose al disgelo.
    history: >-
      Il nome discende dalla Tennalm, antico alpeggio sul bordo orientale dell'altopiano. La grotta di
      ghiaccio vanta trascorsi leggendari: i valligiani ne evitavano l'antro considerandolo una porta degli
      inferi. Nel 1879 il naturalista salisburghese Anton Posselt vi si inoltrò per circa 200 metri. Alexander
      von Mörk, caduto nel 1914 nella prima guerra mondiale, riposa in un'urna nel duomo della cavità. Le
      visite guidate iniziarono nel 1920 e nel 1955 la funivia ridusse a tre minuti un'ascesa di un'ora e
      mezza. Gli ingressi finanziano la manutenzione del sito.


      L'intero altopiano è protetto come riserva naturale su 8541,7 ettari, per tutelare banchi carsici,
      praterie alpine e fauna d'alta quota. I contrafforti meridionali formano una fascia tampone a paesaggio
      protetto di 4781,3 ettari.
    before: >-
      La grotta richiede mezza giornata e non è visitabile d'inverno. Salendo sull'altopiano porta con te
      tutta l'acqua necessaria: il carso non ne fornisce. I rifugi sono accoglienti, ma il passo sicuro e
      l'orientamento spettano a te.
    around: >-
      A circa 8 km sorge la [Riserva Naturale del Dachstein — Gosau, Hallstatt e
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/), e a 10 km il [Parco Nazionale
      Berchtesgaden - Massiccio dell'Hagengebirge](/lugar/nationalpark-berchtesgaden---hagengebirge/) oltre la
      Salzach. A 20 km si estende lo [Steinernes Meer - Mare di
      Pietra](/lugar/steinernes-meer---karst-plateau/) e a 26 km il [Gruppo dell'Ankogel - Alti
      Tauri](/lugar/ankogelgruppe---hohe-tauern/).
  pt:
    intro: >-
      No topo do Tennengebirge chove com intensidade mas não corre qualquer ribeiro à superfície. A água
      infiltra-se de imediato por fendas e algares, desaparecendo no seio da montanha onde escava galerias há
      milhões de anos. Este maciço dos Alpes Calcários Setentrionais, em Salzburgo, forma um planalto de
      calcário de Dachstein intensamente carsificado com cerca de 280 km², culminando no Raucheck a 2.430
      metros. Por fora ergue-se rocha nua; por dentro esconde-se um labirinto com mais de mil grutas
      cartografadas, incluindo a maior gruta de gelo do mundo.
    landscape: >-
      Visualiza uma esponja rochosa colossal. O calcário de Dachstein, profusamente fraturado, drena quase
      toda a chuva e neve fundida, deixando a superfície sem cursos de água permanentes. A água converge em
      redes subterrâneas assentes sobre camadas impermeáveis que inclinam para norte: daí que o maciço
      descarregue o seu caudal em numerosas ressurgências cársicas no sopé setentrional.


      As cavidades guardam igualmente a memória da evolução alpina. Encontram-se organizadas em níveis
      correspondentes às cotas das antigas toalhas freáticas. O nível das cavernas gigantes que alberga a
      Eisriesenwelt formou-se no Miocénico Superior. A maioria das entradas situa-se entre os 1.500 e os 1.600
      metros de altitude, registando o cadastro austríaco mais de um milhar de grutas no maciço.


      A Eisriesenwelt apresenta um comportamento termodinâmico singular: ganha gelo no inverno. O ar frio
      entra por efeito de chaminé até cerca de um quilómetro no interior da gruta; a rocha preserva essas
      temperaturas gélidas até à primavera, fazendo com que a água de degelo congele instantaneamente. Daí que
      o primeiro quilómetro constitua um palácio de gelo e o restante prossiga em calcário seco.


      Cerca de 37 km² do planalto ultrapassam os 2.000 metros. A oeste, o rio Salzach separa-o do maciço de
      Hagengebirge, já nos Alpes de Berchtesgaden.
    wildlife: >-
      A fauna de maior relevância biológica habita o subsolo. A reserva natural protege o
      morcego-de-ferradura-pequeno, espécie cavernícola ameaçada, a par do morcego-rato-grande e do
      morcego-de-bechstein. Entre as aves dos relevos calcários contam-se a
      [águia-real](/especie/aquila_chrysaetos/), o gavião-da-europa, o açor, o bufo-real, a galinha-do-mato e
      o melro-d'água.


      O ciclo anual é condicionado pelo gelo e pela neve. A gruta abre regularmente entre 1 de maio e 26 de
      outubro; no inverno o acesso fica interdito pela altitude e pelo risco de avalanches. No planalto, o
      inverno pertence ao esqui de montanha e travessias alpinas.
    visit: >-
      O ponto culminante é a Eisriesenwelt. Do parque de estacionamento sobe-se a pé e por teleférico até à
      entrada da gruta; com bom tempo avista-se um panorama soberbo sobre o vale do Salzach até aos Hohe
      Tauern. A visita guiada dura uma hora e um quarto percorrendo um quilómetro de galerias e esculturas de
      gelo; para o circuito total conta com cerca de três horas. São cerca de 1.400 degraus a temperaturas
      próximas de zero graus: agasalhos térmicos e calçado robusto são essenciais. É proibido filmar e
      fotografar no interior da gruta, bem como usar drones na área.


      Para pedestrianistas o maciço proporciona grandes travessias. O trilho europeu E4, coincidente com a Via
      Alpina, atravessa o sul de Lungötz a Werfen passando pela Söldenhütte, enquanto o Salzburger Arnoweg
      percorre o oeste de Annaberg à Laufener Hütte e Abtenau. Os refúgios apoiam as etapas, mas a secura
      cársica e o perigo de nevoeiro exigem experiência alpina sólida.


      Entre as ressurgências ativas no fundo do vale avultam a Brunneckerhöhle no desfiladeiro de Lueg, a
      Winnerfall e a Tricklhöhle, sujeitas a cheias violentas de degelo.
    history: >-
      A designação provém da Tennalm, uma pastagem na orla oriental do planalto. A gruta encerra um passado
      lendário: as populações temiam o algar como uma entrada para o inferno. Em 1879 o naturalista
      salzburguês Anton Posselt progrediu cerca de 200 metros na escuridão. Alexander von Mörk, tombado na
      Primeira Guerra Mundial em 1914, repousa numa urna na catedral da gruta. As visitas regulares começaram
      em 1920 e, em 1955, o teleférico encurtou para três minutos uma dura subida de hora e meia. As receitas
      suportam a exploração científica.


      Todo o planalto rochoso está classificado como reserva natural com 8541,7 hectares, protegendo formações
      cársicas, pastagens calcárias e fauna de montanha. Os contrafortes meridionais compõem uma paisagem
      protegida de amortecimento com 4781,3 hectares.
    before: >-
      A gruta de gelo exige meio dia de passeio e encerra no inverno. Ao subir ao planalto transporta contigo
      toda a água potável: o carso não a fornece à superfície. Os refúgios existem, mas a segurança em
      altitude depende exclusivamente de ti.
    around: >-
      A cerca de 8 km situa-se a [Reserva Natural de Dachstein — Gosau, Hallstatt e
      Obertraun](/lugar/naturschutzgebiet-dachstein-gosau-hallstatt-obertraun/), e a 10 km o [Parque Nacional
      Berchtesgaden - Maciço de Hagengebirge](/lugar/nationalpark-berchtesgaden---hagengebirge/) além do
      Salzach. A 20 km fica o [Steinernes Meer - Mar de Pedra](/lugar/steinernes-meer---karst-plateau/) e a 26
      km o [Grupo de Ankogel - Hohe Tauern](/lugar/ankogelgruppe---hohe-tauern/).
