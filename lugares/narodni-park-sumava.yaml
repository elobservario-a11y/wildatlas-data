resumen:
  es: El 'Techo Verde de Europa', vasto macizo de turberas elevadas, lagos glaciares y hayedos de montaña.
  en: >-
    The "Green Roof of Europe", an immense mountain massif of raised peat bogs, glacial tarns, and montane
    beechwoods.
  fr: >-
    Le « Toit vert de l’Europe », vaste massif de tourbières ombrotrophes, lacs glaciaires et hêtraies
    montagnardes.
  de: Das „Grüne Dach Europas“, ein gewaltiges Bergmassiv aus Hochmooren, Karseen und montanen Buchenwäldern.
  it: Il «Tetto Verde d’Europa», vasto massiccio montuoso di torbiere alte, laghi glaciali e faggete montane.
  pt: >-
    O «Teto Verde da Europa», vasto maciço montanhoso de turfeiras altas, lagoas glaciares e faiais de
    montanha.
unico:
  es: >-
    Un bosque inmenso que se ha dejado crecer, con turberas y lagos glaciares en su corazón y el último
    urogallo viable de Chequia.
  en: >-
    An immense wilderness left to natural processes, harbouring raised bogs and glacial lakes at its core and
    the sole viable capercaillie population in Czechia.
  fr: >-
    Une immense forêt rendue à la libre évolution, abritant tourbières d’altitude et lacs glaciaires en son
    cœur et le dernier noyau viable de grand tétras en Tchéquie.
  de: >-
    Ein riesiger Wald, der sich selbst überlassen wurde, mit Hochmooren und Karseen im Herzen und dem letzten
    lebensfähigen Auerhuhnvorkommen Tschechiens.
  it: >-
    Un’immensa foresta lasciata alla libera evoluzione, custode di torbiere e laghi glaciali nel suo cuore e
    dell’ultima popolazione vitale di gallo cedrone della Cechia.
  pt: >-
    Uma imensa floresta entregue à dinâmica natural, acolhendo turfeiras e lagoas glaciares no seu coração e o
    último núcleo viável de tetraz-grande da Chéquia.
observaciones:
  es: >-
    En la primera zona de conservación solo se puede caminar por rutas turísticas señalizadas, y las turberas
    de Modravské slatě y Mrtvý luh están cerradas al público.
texto:
  es:
    intro: >-
      Aquí el agua decide a qué mar va. Por el Parque Nacional de Šumava pasa la divisoria europea entre el
      mar del Norte y el mar Negro, y aquí nace el Moldava. Con 685 km², es el mayor parque nacional de
      Chequia, y se le llama el Corazón Verde de Europa porque es uno de los mayores complejos forestales
      continuos de Europa central. Lo recorres entre píceas, turberas con pasarela, lagos que dejó el hielo y
      un silencio que tiene explicación: durante décadas fue tierra de nadie junto a la frontera.
    landscape: >-
      El Bosque de Bohemia es el bosque más extenso de Europa central, pero no es el de hace siglos: hoy
      dominan las plantaciones de pícea, y esas píceas, poco adaptadas al clima duro, sufren con los
      vendavales y con el escarabajo de la corteza. Entre ellas quedan mesetas con turberas altas, lagos
      glaciares y restos de bosque primario como Boubín.


      La base es de granito, gneis y micacita, que afloran sobre todo en las cumbres. El parque va de unos 600
      m, en el valle del Otava, a 1378 m en el Plechý, la montaña más alta de la parte checa de Šumava. Y
      llueve: Březník es uno de los lugares más lluviosos de Chequia, con 1552 mm de precipitación media al
      año. Esa lluvia explica las turberas. El Moldava nace como Černý potok en la ladera de Černá hora y se
      convierte en el Moldava Cálido cerca de Borová Lada.


      Tres lagos de origen glaciar, Plešné, Prášilské y Laka, están dentro del parque. Y el mayor lago de
      turbera de Šumava está en Chalupská slať, cerca de Borová Lada.
    wildlife: >-
      Las turberas tienen sus propios especialistas: droseras, que se alimentan en parte de insectos, además
      de esfagnos y algodoncillos. Hay también cuatro endemismos, como Aconitum plicatum y Phyteuma nigrum.


      Entre las aves, el rey es el [urogallo](/especie/tetrao_urogallus/): su población en Šumava es la única
      viable de Chequia y por eso es muy sensible a las molestias. Lo acompañan el [gallo
      lira](/especie/tetrao_tetrix/), el grévol, el [pico tridáctilo](/especie/picoides_tridactylus/), el
      guion de codornices, el [cárabo uralense](/especie/strix_uralensis/), el [mochuelo
      chico](/especie/glaucidium_passerinum/), el mochuelo boreal, la [cigüeña negra](/especie/ciconia_nigra/)
      y el [pigargo](/especie/haliaeetus_albicilla/). En el parque y su entorno pueden verse hasta tres
      especies de águilas.


      Entre los mamíferos hay historia de ida y vuelta. El último oso de Šumava murió a tiros en 1856. El
      [lince](/especie/lynx_lynx/), en cambio, se reintrodujo con éxito en los años 80 del siglo XX y hoy es
      la fiera más conocida del parque. Hay también [castor](/especie/castor_fiber/), que se asentó de forma
      permanente probablemente desde 2007, y los cursos de agua de Šumava son una de las mejores zonas de
      [nutria](/especie/lutra_lutra/) de Chequia.
    visit: >-
      En verano los visitantes se concentran en los lagos, las turberas de Modrava, Kvilda y Borová Lada, la
      fuente del Moldava, Poledník y Povydří; en invierno, en Modrava y Kvilda para esquiar.


      Hay tres paseos que cuentan tres cosas. Tříjezerní slať es una turbera típica a 1066 m, a unos 2,5 km de
      Modrava; ocupa 19 ha y es accesible. Chalupská slať está a 1 km de Borová Lada y se llega desde un
      aparcamiento por una pista de asfalto y una pasarela. Povydří es un camino popular junto al torrente
      Vydra, con grandes piedras y marmitas de gigante. Si quieres un recorrido más largo, el parque propone
      un paseo de 8,6 km hacia los lagos glaciares Černé y Čertovo.


      Poledník, de 1315 m, tiene un mirador hecho con una antigua torre de radar de la zona fronteriza; desde
      1998 da vistas de todo el centro de Šumava y del Bosque Bávaro. En Kvilda hay un sendero por los
      recintos de ciervos y linces con refugios elevados de observación, y su sendero natural explica rastros
      de ciervos y jabalíes, además de árboles y plantas locales. Para entender la roca, el parque tiene dos
      exposiciones geológicas, una al aire libre en Rokyta y otra en Stožec.
    history: >-
      El bosque que ves es en parte consecuencia de la historia. Tras la Segunda Guerra Mundial se expulsó a
      casi todos los habitantes de habla alemana y la zona quedó dentro del área desierta junto a la frontera
      del bloque del Este. Antes, la madera y la arena de cuarzo habían dado origen a vidrierías como las de
      Hůrka, Prášily y Filipova Huť, y una zona aurífera cercana a Kašperské Hory se explotó, probablemente
      desde los celtas, hasta los siglos XIX y XX. Un abeto de 559 años, el segundo árbol más viejo del
      parque, creció junto al lago Plešné.


      En 1963 se declaró un gran paisaje protegido en el Bosque de Bohemia, en 1990 la zona fue declarada
      reserva de la biosfera de la UNESCO y el 20 de marzo de 1991 su parte más valiosa pasó a ser parque
      nacional. Las turberas de Šumava figuran en el registro Ramsar desde 1990. La zona I, de 8.807 ha, el 13
      % del parque, se deja a su evolución natural sin intervención humana. Las turberas se drenaron en el
      pasado, y entre 2018 y 2024 se restauraron con el programa Life for MIRES.
    before: >-
      En la primera zona de conservación solo se puede caminar por rutas turísticas señalizadas, y las
      turberas de Modravské slatě y Mrtvý luh están cerradas al público.
    around: >-
      Pegado al parque, a solo 1 km, está el [Parque Nacional del Bosque
      Baviera](/lugar/nationalpark-bayerischer-wald/), que continúa el mismo bosque al otro lado de la
      frontera. A unos 5 km se encuentra el [Bosque Virgen de Boubín](/lugar/boubinsky-prales/), el remanente
      de bosque primario del que habla el parque. Más lejos, el [Parque Nacional de
      Soomaa](/lugar/soomaa-rahvuspark/) y el [Parque Nacional de
      Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) comparten con Šumava el bosque maduro con humedales;
      el primero, además, el alce, el castor y el lince, y el segundo, el alce, el castor y el lobo.
  en:
    intro: >-
      Here the waters determine which ocean to seek. The European continental divide between the North Sea and
      the Black Sea threads directly through Šumava National Park, where the Vltava river is born. Spanning
      685 km², it is the largest national park in Czechia and is celebrated as the Green Roof of Europe
      because it forms one of the most extensive continuous forest tracts in Central Europe. You traverse it
      amid spruce taiga, boardwalked raised peat bogs, glacial tarns, and an ancient stillness with a
      historical reason: for decades it was a deserted Iron Curtain border zone.
    landscape: >-
      The Bohemian Forest represents Central Europe’s largest forested massif, though it differs from ancient
      woodlands: secondary Norway spruce plantations predominate today, which suffer from gale blowdowns and
      bark beetle outbreaks under harsh climatic extremes. Nestled among them remain wild plateaus with raised
      bogs, glacial cirque tarns, and primeval forest remnants like Boubín.


      The bedrock comprises granite, gneiss, and mica-schist, outcropping along ridges. The park ranges from
      600 m in the Otava valley to 1378 m atop Plechý, the highest mountain on the Czech side of Šumava.
      Precipitation is heavy: Březník ranks among the rainiest locations in Czechia, recording 1552 mm of mean
      annual rainfall. This moisture sustains the vast mire systems. The Vltava rises as Černý potok on the
      slope of Černá hora, transforming into the Warm Vltava near Borová Lada.


      Three glacial tarns—Plešné, Prášilské, and Laka—lie within the park. The largest bog lake in Šumava is
      situated in Chalupská slať near Borová Lada.
    wildlife: >-
      The raised bogs support specialized flora: sundews feeding on insects, peat mosses, and cottongrasses.
      Four regional endemics occur, including Aconitum plicatum and Phyteuma nigrum.


      Among birds, the undisputed king is the [western capercaillie](/especie/tetrao_urogallus/): its Šumava
      stronghold represents the only viable population in Czechia and remains acutely sensitive to human
      disturbance. It shares the forest with [black grouse](/especie/tetrao_tetrix/), hazel grouse,
      [three-toed woodpecker](/especie/picoides_tridactylus/), corn crake, [Ural
      owl](/especie/strix_uralensis/), [Eurasian pygmy owlet](/especie/glaucidium_passerinum/), boreal owl,
      [black stork](/especie/ciconia_nigra/), and [white-tailed eagle](/especie/haliaeetus_albicilla/). Up to
      three eagle species can be observed across the park and its buffer.


      Mammalian history has come full circle. The last native brown bear in Šumava was shot in 1856.
      Conversely, the [Eurasian lynx](/especie/lynx_lynx/) was successfully reintroduced during the 80s of the
      twentieth century and represents the park’s most iconic predator today. The [Eurasian
      beaver](/especie/castor_fiber/) recolonised permanently around 2007, and Šumava’s pristine waterways
      form one of Czechia’s premier bastions for the [Eurasian otter](/especie/lutra_lutra/).
    visit: >-
      In summer visitors converge around glacial lakes, the peat bogs of Modrava, Kvilda, and Borová Lada, the
      Vltava spring, Poledník, and Povydří; in winter, Modrava and Kvilda become premier cross-country skiing
      centres.


      Three nature walks illustrate distinct ecosystems. Tříjezerní slať is a classic raised bog at 1066 m,
      some 2.5 km from Modrava; covering 19 ha, it is accessible via a wooden boardwalk. Chalupská slať lies 1
      km from Borová Lada, reached from a car park via an asphalt track and boardwalk. Povydří is a famed
      riverside trail following the rushing Vydra river amid giant granite boulders and giant’s kettles. For a
      longer hike, the park suggests an 8.6 km circuit visiting glacial tarns Černé and Čertovo.


      Poledník, rising to 1315 m, features an observation tower adapted from a Cold War radar station; opened
      in 1998, it provides sweeping vistas across central Šumava and the Bavarian Forest. At Kvilda, a
      wildlife trail passes large enclosures for red deer and lynx with elevated viewing hides, accompanied by
      interpretive panels explaining wild animal tracks, native flora, and forestry. To explore bedrock
      geology, the park maintains two exhibitions: an open-air display at Rokyta and an indoor centre in
      Stožec.
    history: >-
      The current forest is inextricably linked to twentieth-century history. Following the Second World War,
      almost all German-speaking inhabitants were expelled and the borderlands became an uninhabited
      militarised exclusion zone. Centuries earlier, abundant timber and quartz sand had fostered celebrated
      forest glassworks at Hůrka, Prášily, and Filipova Huť, while gold deposits around Kašperské Hory were
      mined from Celtic antiquity through the nineteenth and twentieth centuries. A silver fir aged 559 years,
      the second oldest tree in the park, grew beside Lake Plešné.


      In 1963 a large Protected Landscape Area was declared in the Bohemian Forest, in 1990 the region
      achieved UNESCO Biosphere Reserve status, and on 20 March 1991 the most pristine core was proclaimed a
      national park. The peatlands were designated as a Ramsar site in 1990. Zone I, spanning 8,807 ha or 13 %
      of the park, is strictly dedicated to natural wilderness processes without human interference. Formerly
      ditched bogs were comprehensively re-wetted between 2018 and 2024 through the Life for MIRES programme.
    before: >-
      Within the first conservation zone, hiking is permitted solely along waymarked tourist trails; the
      sensitive mire reserves of Modravské slatě and Mrtvý luh are closed to the public.
    around: >-
      Immediately bordering the park, just 1 km away, lies the [Bavarian Forest National
      Park](/lugar/nationalpark-bayerischer-wald/), preserving the contiguous transboundary forest tract in
      Germany. Roughly 5 km away rises the [Boubín Primeval Forest](/lugar/boubinsky-prales/), the celebrated
      old-growth forest reserve. Further afield, [Soomaa National Park](/lugar/soomaa-rahvuspark/) and
      [Žemaitija National Park](/lugar/zemaitijos-nacionalinis-parkas/) share mature woodlands and peat bogs
      with Šumava, with Soomaa sharing moose, beaver, and lynx, and Žemaitija sharing moose, beaver, and wolf.
  fr:
    intro: >-
      Ici, les eaux décident vers quelle mer s’écouler. La ligne de partage des eaux européenne entre la mer
      du Nord et la mer Noire traverse le parc national de Šumava, où la Vltava prend source. Avec ses 685
      km², c’est le plus grand parc national de Tchéquie, surnommé le Cœur vert de l’Europe car il forme l’un
      des plus vastes massifs forestiers continus d’Europe centrale. On le parcourt au milieu des épicéas, des
      tourbières équipées de pontons de bois, des lacs laissés par les glaciers et d’un silence façonné par
      l’histoire : pendant des décennies, ce fut un no man’s land frontalier sous le rideau de fer.
    landscape: >-
      La forêt de Bohême constitue le massif forestier le plus vaste d’Europe centrale, bien qu’elle diffère
      des forêts d’antan : les plantations d’épicéas y dominent désormais, souffrant des tempêtes et des
      attaques du scolyte. Entre elles subsistent des plateaux hérissés de tourbières hautes, des lacs
      glaciaires et des lambeaux de forêts primaires tels que Boubín.


      Le socle se compose de granites, de gneiss et de micaschistes affleurant sur les crêtes. Le parc s’étage
      depuis environ 600 m dans la vallée de l’Otava jusqu’à 1378 m au sommet du Plechý, point culminant de la
      Šumava tchèque. Les précipitations y sont copieuses : Březník figure parmi les localités les plus
      arrosées de Tchéquie avec 1552 mm de précipitations annuelles moyennes, nourrissant les tourbières. La
      Vltava naît sous le nom de Černý potok sur les pentes de la Černá hora avant de devenir la Vltava Chaude
      près de Borová Lada.


      Trois lacs d’origine glaciaire—Plešné, Prášilské et Laka—se nichent dans le parc. Le plus vaste lac de
      tourbière de Šumava s’étend à Chalupská slať, près de Borová Lada.
    wildlife: >-
      Les tourbières abritent des espèces hautement spécialisées : droséras carnivores, sphaignes et
      linaigrettes. On y compte aussi quatre plantes endémiques, dont Aconitum plicatum et Phyteuma nigrum.


      Parmi les oiseaux, le seigneur des lieux est le [grand tétras](/especie/tetrao_urogallus/) : sa
      population de Šumava est la seule viable de Tchéquie, extrêmement sensible aux dérangements. Il est
      accompagné par le [tétras lyre](/especie/tetrao_tetrix/), la gélinotte des bois, le [pic
      tridactyle](/especie/picoides_tridactylus/), le râle des genêts, la [chouette de
      l’Oural](/especie/strix_uralensis/), la [chevêchette d’Europe](/especie/glaucidium_passerinum/), la
      chouette de Tengmalm, la [cigogne noire](/especie/ciconia_nigra/) et le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/). Jusqu’à trois espèces d’aigles fréquentent le parc et sa
      périphérie.


      L’histoire des mammifères est faite d’éclipses et de retours. Le dernier ours de Šumava fut abattu en
      1856. En revanche, le [lynx boréal](/especie/lynx_lynx/) a été réintroduit avec succès dans les années
      80 du vingtième siècle et représente aujourd’hui le grand prédateur emblématique du parc. Le [castor
      d’Europe](/especie/castor_fiber/) s’y est établi durablement vers 2007, et les rivières de Šumava
      forment l’un des meilleurs sanctuaires de la [loutre d’Europe](/especie/lutra_lutra/) en Tchéquie.
    visit: >-
      En été, les promeneurs convergent vers les lacs, les tourbières de Modrava, Kvilda et Borová Lada, la
      source de la Vltava, le Poledník et la vallée de Povydří ; en hiver, Modrava et Kvilda deviennent le
      paradis du ski nordique.


      Trois itinéraires thématiques méritent le détour. Tříjezerní slať est une tourbière haute typique à 1066
      m d’altitude, à environ 2,5 km de Modrava ; elle couvre 19 ha et est aménagée sur caillebotis. Chalupská
      slať se trouve à 1 km de Borová Lada, accessible depuis un parking par un sentier carrossable et un
      ponton de bois. Povydří est une promenade prisée longeant la rivière sauvage Vydra au milieu de blocs de
      granit et de marmites de géant. Pour une sortie plus longue, le parc suggère un circuit de 8,6 km vers
      les lacs glaciaires Černé et Čertovo.


      Le Poledník, à 1315 m, arbore une tour d’observation aménagée dans une ancienne station radar de la
      guerre froide ; depuis 1998, elle dévoile de vastes panoramas sur tout le centre de la Šumava et la
      forêt bavaroise. À Kvilda, un parcours longe de vastes enclos d’observation de cerfs et de lynx munis
      d’affûts surélevés. Pour explorer la géologie, le parc propose deux expositions : l’une en plein air à
      Rokyta et l’autre à Stožec.
    history: >-
      Le paysage forestier actuel porte l’empreinte de l’histoire. Après la Seconde Guerre mondiale, la
      quasi-totalité des habitants germanophones fut expulsée et le secteur devint une zone militaire
      interdite le long de la frontière du bloc de l’Est. Auparavant, le bois et le sable de quartz avaient
      alimenté d’illustres verreries forestières à Hůrka, Prášily et Filipova Huť, tandis que les gisements
      aurifères de Kašperské Hory furent exploités depuis les Celtes jusqu’aux dix-neuvième et vingtième
      siècles. Un sapin blanc âgé de 559 ans, deuxième arbre le plus ancien du parc, a grandi au bord du lac
      Plešné.


      En 1963 fut créée une vaste zone paysagère protégée dans la forêt de Bohême, déclarée réserve de
      biosphère par l’UNESCO en 1990, avant que son secteur le plus précieux ne devienne parc national le 20
      mars 1991. Les tourbières sont inscrites sur la liste Ramsar depuis 1990. La zone I, s’étendant sur 8
      807 ha soit 13 % du parc, est strictement abandonnée à la dynamique naturelle sans intervention humaine.
      Les tourbières jadis drainées ont été restaurées entre 2018 et 2024 par le programme Life for MIRES.
    before: >-
      Dans la zone de protection intégrale, la randonnée n’est autorisée que sur les sentiers balisés, et les
      tourbières fragiles de Modravské slatě et Mrtvý luh sont interdites au public.
    around: >-
      Contigu au parc, à seulement 1 km, s’étend le [Parc national de la forêt de
      Bavière](/lugar/nationalpark-bayerischer-wald/), qui prolonge le même massif forestier de l’autre côté
      de la frontière. À environ 5 km se dresse la [Forêt primaire de Boubín](/lugar/boubinsky-prales/),
      vestige forestier historique. Plus loin, le [Parc national de Soomaa](/lugar/soomaa-rahvuspark/) et le
      [Parc national de Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) partagent forêts anciennes et
      tourbières avec Šumava, Soomaa partageant en outre l’élan, le castor et le lynx, et Žemaitija l’élan, le
      castor et le loup.
  de:
    intro: >-
      Hier entscheidet das Wasser, in welches Meer es fließt. Durch den Nationalpark Šumava verläuft die
      europäische Hauptwasserscheide zwischen Nordsee und Schwarzem Meer, und hier entspringt die Moldau. Mit
      685 km² ist er der größte Nationalpark Tschechiens, berühmt als Grünes Dach Europas, da er eines der
      ausgedehntesten geschlossenen Waldgebiete Mitteleuropas bildet. Du durchwanderst ihn zwischen
      Fichtenwäldern, Hochmooren auf Holzstegen, eiszeitlichen Karseen und einer Stille, die geschichtliche
      Gründe hat: Jahrzehntelang lag das Gebiet als verlassener Grenzstreifen am Eisernen Vorhang.
    landscape: >-
      Der Böhmerwald ist das größte zusammenhängende Waldmassiv Mitteleuropas, unterscheidet sich jedoch von
      den Urwäldern vergangener Jahrhunderte: Heute dominieren Fichtenforste, die unter Sturmwurf und
      Borkenkäferbefall leiden. Dazwischen blieben Hochflächen mit Mooren, Karseen und Urwaldreste wie der
      Boubín erhalten.


      Das Grundgebirge besteht aus Graniten, Gneisen und Glimmerschiefern, die auf den Kämmen zutage treten.
      Der Park reicht von rund 600 m im Tal der Otava bis auf 1378 m auf dem Plechý, dem höchsten Berg des
      tschechischen Böhmerwalds. Die Niederschläge sind hoch: Březník zählt mit durchschnittlich 1552 mm
      Jahresniederschlag zu den nassesten Orten Tschechiens. Diese Feuchtigkeit speist die Moore. Die Moldau
      entspringt als Černý potok am Hang der Černá hora und wird bei Borová Lada zur Warmen Moldau.


      Drei Karseen eiszeitlichen Ursprungs—Plešné, Prášilské und Laka—liegen im Park. Der größte Moorsee des
      Böhmerwalds befindet sich im Hochmoor Chalupská slať bei Borová Lada.
    wildlife: >-
      Die Hochmoore bergen spezialisierte Überlebenskünstler: insektenfangenden Sonnentau, Torfmoose und
      Wollgräser. Vier Pflanzenarten sind regional endemisch, darunter Aconitum plicatum und Phyteuma nigrum.


      Unter den Vögeln ist der König das [Auerhuhn](/especie/tetrao_urogallus/): Sein Bestand im Böhmerwald
      ist das einzige überlebensfähige Vorkommen in Tschechien und reagiert äußerst sensibel auf Störungen. Es
      teilt den Wald mit [Birkhuhn](/especie/tetrao_tetrix/), Haselhuhn,
      [Dreizehenspecht](/especie/picoides_tridactylus/), Wachtelkönig,
      [Habichtskauz](/especie/strix_uralensis/), [Sperlingskauz](/especie/glaucidium_passerinum/), Raufußkauz,
      [Schwarzstorch](/especie/ciconia_nigra/) und [Seeadler](/especie/haliaeetus_albicilla/). Bis zu drei
      Adlerarten lassen sich im Park und seinem Umfeld beobachten.


      Die Geschichte der Säugetiere verlief wechselhaft: Der letzte Bär des Böhmerwalds wurde 1856 erlegt. Der
      [Eurasische Luchs](/especie/lynx_lynx/) hingegen wurde in den 80er Jahren des zwanzigsten Jahrhunderts
      erfolgreich wiederangesiedelt und ist heute das Symboltier des Parks. Auch der
      [Biber](/especie/castor_fiber/) siedelte sich um 2007 wieder dauerhaft an, und die Gewässer von Šumava
      bilden eines der bedeutendsten Reviere für den [Fischotter](/especie/lutra_lutra/) in Tschechien.
    visit: >-
      Im Sommer konzentrieren sich die Besucher auf die Karseen, die Moore von Modrava, Kvilda und Borová
      Lada, die Moldauquelle, den Poledník und das Vydratal; im Winter locken Modrava und Kvilda Skilangläufer
      an.


      Drei Lehrpfade erschließen unterschiedliche Lebensräume. Tříjezerní slať ist ein typisches Hochmoor auf
      1066 m Höhe, rund 2,5 km von Modrava entfernt; es umfasst 19 ha und ist über Holzstege begehbar.
      Chalupská slať liegt 1 km von Borová Lada entfernt und ist über einen asphaltierten Zubringerweg und
      Steg erreichbar. Povydří ist ein beliebter Wanderweg entlang der wilden Vydra mit Granitblöcken und
      Riesentöpfen. Für eine längere Tour empfiehlt sich ein Rundweg von 8,6 km zu den Karseen Černé und
      Čertovo jezero.


      Der Poledník (1315 m) trägt einen Aussichtsturm auf einer einstigen Radaranlage des Kalten Krieges; seit
      1998 gewährt er weite Ausblicke über den Böhmerwald und den Bayerischen Wald. In Kvilda führt ein Pfad
      an Hirsch- und Luchsgehegen mit erhöhten Beobachtungspunkten vorbei. Zur Geologie unterhält der Park
      zwei Ausstellungen: eine Freilichtanlage in Rokyta und ein Infozentrum in Stožec.
    history: >-
      Das heutige Waldbild ist eng mit der Zeitgeschichte verknüpft: Nach dem Zweiten Weltkrieg wurde die
      deutschsprachige Bevölkerung vertrieben und das Grenzgebiet zur unzugänglichen militärischen Sperrzone
      erklärt. Zuvor hatten Holzreichtum und Quarzsand berühmte Glashütten in Hůrka, Prášily und Filipova Huť
      begründet; Goldvorkommen bei Kašperské Hory wurden seit keltischer Zeit bis ins neunzehnte und
      zwanzigste Jahrhundert abgebaut. Eine 559 Jahre alte Weißtanne am Plöckensteinsee war der zweitälteste
      Baum des Parks.


      1963 wurde ein großes Landschaftsschutzgebiet ausgewiesen, 1990 als UNESCO-Biosphärenreservat anerkannt
      und am 20. März 1991 der wertvollste Kern als Nationalpark deklariert. Die Moore sind seit 1990
      Ramsar-Gebiet. Die Kernzone I mit 8.807 ha bzw. 13 % des Parks ist der ungestörten Naturdynamik
      vorbehalten. Früher entwässerte Moore wurden zwischen 2018 und 2024 im Life for MIRES-Projekt
      wiedervernässt.
    before: >-
      In der Kernzone I darf man sich nur auf markierten Wegen bewegen; die sensiblen Moorgebiete Modravské
      slatě und Mrtvý luh sind für die Öffentlichkeit gesperrt.
    around: >-
      Direkt angrenzend, nur 1 km entfernt, liegt der [Nationalpark Bayerischer
      Wald](/lugar/nationalpark-bayerischer-wald/), der dasselbe Waldmassiv auf deutscher Seite fortführt.
      Rund 5 km entfernt ragt der [Urwald Boubín](/lugar/boubinsky-prales/) auf. Weiter entfernt teilen der
      [Nationalpark Soomaa](/lugar/soomaa-rahvuspark/) und der [Nationalpark
      Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) alte Moorwälder mit Šumava, wobei Soomaa Elch, Biber
      und Luchs teilt und Žemaitija Elch, Biber und Wolf.
  it:
    intro: >-
      Qui le acque scelgono verso quale mare dirigersi. Attraverso il Parco Nazionale di Šumava corre lo
      spartiacque europeo principale tra il Mare del Nord e il Mar Nero, e qui nasce la Moldava. Con i suoi
      685 km² è il parco nazionale più esteso della Cechia, ribattezzato il Cuore Verde d’Europa poiché
      costituisce uno dei complessi forestali continui più ampi dell’Europa centrale. Lo si attraversa tra
      abetaie, torbiere attrezzate con passerelle di legno, laghi glaciali e una quiete figlia della storia:
      per decenni è stato un’inaccessibile terra di nessuno lungo la cortina di ferro.
    landscape: >-
      La Selva Boema è il manto boschivo più imponente dell’Europa centrale, ma differisce dalle foreste dei
      secoli andati: oggi prevalgono le piantagioni di abete rosso, provate dalle tempeste di vento e dal
      bostrico. Tra di esse si conservano altopiani torbosi, laghi glaciali e relitti di foresta vergine come
      il Boubín.


      Il basamento geologico è formato da graniti, gneiss e micascisti che affiorano lungo le creste. Il parco
      si estende da circa 600 m nella valle dell’Otava fino ai 1378 m del Plechý, la massima elevazione della
      Šumava ceca. Le piogge sono abbondanti: Březník è una delle località più piovose della Cechia,
      registrando 1552 mm annui di precipitazioni medie, alimento vitale per le torbiere. La Moldava sgorga
      come Černý potok sulle pendici della Černá hora trasformandosi nella Moldava Calda vicino a Borová Lada.


      Tre laghi d’origine glaciale—Plešné, Prášilské e Laka—sono racchiusi nel parco. Il maggiore lago torboso
      della Šumava si trova a Chalupská slať, vicino a Borová Lada.
    wildlife: >-
      Le torbiere alte ospitano autentici specialisti: le carnivore droseri, sfagni e pennacchi. Si contano
      inoltre quattro endemismi vegetali, tra cui Aconitum plicatum e Phyteuma nigrum.


      Tra i volatili il sovrano è il [gallo cedrone](/especie/tetrao_urogallus/): la popolazione di Šumava è
      l’unica vitale della Cechia, straordinariamente vulnerabile al disturbo antropico. Lo affiancano il
      [fagiano di monte](/especie/tetrao_tetrix/), il francolino di monte, il [picchio
      tridattilo](/especie/picoides_tridactylus/), il re di quaglie, l’[allocco degli
      Urali](/especie/strix_uralensis/), la [civetta nana](/especie/glaucidium_passerinum/), la civetta
      capogrosso, la [cicogna nera](/especie/ciconia_nigra/) e l’[aquila di
      mare](/especie/haliaeetus_albicilla/). Nel parco e nei suoi dintorni si possono osservare fino a tre
      specie di aquile.


      Tra i mammiferi la storia è fatta di addii e ritorni. L’ultimo orso di Šumava venne ucciso nel 1856. La
      [lince eurasiatica](/especie/lynx_lynx/) è stata invece reintrodotta con successo negli anni 80 del
      ventesimo secolo ed è oggi il predatore simbolo del parco. È presente anche il [castoro
      europeo](/especie/castor_fiber/), insediatosi stabilmente attorno al 2007, e i corsi d’acqua della
      Šumava formano una delle roccaforti della [lontra europea](/especie/lutra_lutra/) in Cechia.
    visit: >-
      In estate i turisti si concentrano attorno ai laghi glaciali, alle torbiere di Modrava, Kvilda e Borová
      Lada, alle sorgenti della Moldava, al Poledník e alla gola di Povydří; in inverno Modrava e Kvilda
      diventano rinomati centri per lo sci nordico.


      Tre passeggiate tematiche illustrano ambienti diversi. Tříjezerní slať è una tipica torbiera alta a 1066
      m di quota, a circa 2,5 km da Modrava; copre 19 ha ed è accessibile su passerelle. Chalupská slať dista
      1 km da Borová Lada, raggiungibile dal parcheggio con una pista asfaltata e passerella di legno. Povydří
      è un celebre percorso lungofiume sul torrente Vydra, tra massi granitici e marmitte dei giganti. Per una
      camminata più estesa il parco propone un circuito di 8,6 km verso i laghi glaciali Černé e Čertovo.


      Il Poledník (1315 m) ospita una torre panoramica ricavata da un’ex postazione radar della guerra fredda;
      dal 1998 regala un vasto panorama sull’intera Šumava e sulla Foresta Bavarese. A Kvilda un sentiero
      costeggia ampi recinti faunistici per cervi e linci con altane di avvistamento. Per approfondire la
      geologia il parco offre due mostre: un percorso all’aperto a Rokyta e un centro a Stožec.
    history: >-
      Il paesaggio boschivo attuale riflette le vicende storiche del Novecento: nel dopoguerra la popolazione
      germanofona fu espulsa e l’area divenne una zona militare interdetta a ridosso del confine orientale. In
      precedenza, legname e sabbia quarzifera avevano alimentato rinomate vetrerie forestali a Hůrka, Prášily
      e Filipova Huť, mentre i giacimenti auriferi presso Kašperské Hory furono sfruttati fin dall’epoca
      celtica fino al diciannovesimo e ventesimo secolo. Un abete bianco di 559 anni, il secondo albero più
      antico del parco, è cresciuto accanto al lago Plešné.


      Nel 1963 fu istituita un’ampia area paesaggistica protetta, dichiarata riserva della biosfera UNESCO nel
      1990, prima che il 20 marzo 1991 il nucleo di maggior pregio venisse elevato a parco nazionale. Le
      torbiere sono tutelate dalla convenzione di Ramsar dal 1990. La zona I, estesa per 8.807 ha pari al 13 %
      del parco, è destinata alla libera evoluzione naturale senza interventi umani. Le torbiere bonificate in
      passato sono state ripristinate tra il 2018 e il 2024 nell’ambito del programma Life for MIRES.
    before: >-
      Nella prima zona di tutela è consentito camminare esclusivamente lungo i sentieri turistici segnati; le
      fragili torbiere di Modravské slatě e Mrtvý luh sono chiuse al pubblico.
    around: >-
      Confinante con il parco, a solo 1 km, si trova il [Parco Nazionale della Foresta
      Bavarese](/lugar/nationalpark-bayerischer-wald/), che prosegue la medesima foresta oltreconfine. A circa
      5 km sorge la [Foresta Vergine di Boubín](/lugar/boubinsky-prales/), storico relitto di bosco primario.
      Più lontano, il [Parco Nazionale di Soomaa](/lugar/soomaa-rahvuspark/) e il [Parco Nazionale di
      Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) condividono boschi vetusti e torbiere con Šumava, con
      Soomaa che condivide alce, castoro e lince, e Žemaitija alce, castoro e lupo.
  pt:
    intro: >-
      Aqui a água decide para que mar quer correr. Pelo Parque Nacional de Šumava passa a linha divisória
      continental europeia entre o Mar do Norte e o Mar Negro, e é aqui que nasce o rio Moldava. Com 685 km²,
      é o maior parque nacional da Chéquia, consagrado como o Coração Verde da Europa por constituir um dos
      maiores blocos florestais contínuos da Europa Central. Percorre-se por entre espruces, turfeiras
      alteadas com passadiços de madeira, lagoas esculpidas pelos glaciares e um silêncio com explicação
      histórica: durante décadas foi terra de ninguém junto à Cortina de Ferro.
    landscape: >-
      A Floresta da Boémia é a maior mancha florestal da Europa Central, embora difira das florestas de
      séculos passados: hoje predominam plantações de espruce, fragilizadas por tempestades de vento e ataques
      do escaravelho-da-casca. Pelo meio conservam-se planaltos com turfeiras altas, lagoas glaciares e
      relíquias de floresta virgem como Boubín.


      O substrato rochoso é composto por granito, gnaisse e micaxisto que afloram nas cristas. O parque
      estende-se desde cerca de 600 m no vale do Otava até aos 1378 m no Plechý, o ponto mais elevado da
      vertente checa de Šumava. A precipitação é farta: Březník é uma das zonas mais chuvosas da Chéquia,
      registando 1552 mm de precipitação média anual. Essa pluviosidade alimenta as turfeiras. O Moldava nasce
      como Černý potok nas encostas da Černá hora, passando a designar-se Moldava Quente junto a Borová Lada.


      Três lagoas de génese glaciar—Plešné, Prášilské e Laka—aninham-se no parque. A maior lagoa de turfeira
      de Šumava localiza-se em Chalupská slať, perto de Borová Lada.
    wildlife: >-
      As turfeiras acolhem espécies altamente especializadas: dróseras carnívoras, esfagno e espadana-algodão.
      Ocorrem ainda quatro endemismos botânicos, como Aconitum plicatum e Phyteuma nigrum.


      Nas aves, a espécie emblemática é o [tetraz-grande](/especie/tetrao_urogallus/): a sua população em
      Šumava é a única viável da Chéquia e revela-se hipersensível a perturbações humanas. Partilha o espaço
      com o [galo-lira](/especie/tetrao_tetrix/), a galinha-do-mato, o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/), o codornizão, a
      [coruja-dos-urais](/especie/strix_uralensis/), o [mocho-pigmeu](/especie/glaucidium_passerinum/), o
      mocho-de-tengmalm, a [cegonha-preta](/especie/ciconia_nigra/) e a
      [águia-rabalva](/especie/haliaeetus_albicilla/). Podem observar-se até três espécies de águias no parque
      e imediações.


      Nos mamíferos há registos de perda e recuperação: o último urso de Šumava foi abatido a tiro em 1856. O
      [lince-euroasiático](/especie/lynx_lynx/), em contrapartida, foi reintroduzido com sucesso nos anos 80
      do século XX, sendo hoje o grande predador símbolo do parque. Ocorre também o
      [castor-europeu](/especie/castor_fiber/), fixado de forma permanente por volta de 2007, e as linhas de
      água de Šumava compõem um dos melhores refúgios para a [lontra-europeia](/especie/lutra_lutra/) na
      Chéquia.
    visit: >-
      No verão a afluência concentra-se junto às lagoas, às turfeiras de Modrava, Kvilda e Borová Lada, à
      nascente do Moldava, a Poledník e a Povydří; no inverno, Modrava e Kvilda tornam-se polos concorridos de
      esqui de fundo.


      Três percursos revelam ecossistemas singulares. Tříjezerní slať é uma turfeira alta típica situada a
      1066 m de altitude, a cerca de 2,5 km de Modrava; abrange 19 ha e é acessível por passadiço de madeira.
      Chalupská slať fica a 1 km de Borová Lada, alcançando-se a partir de um parque por caminho asfaltado e
      passadiço. Povydří é um célebre trilho ribeirinho ao longo do rio Vydra entre megálitos de granito e
      marmitas de gigante. Para caminhadas mais longas, o parque delineia um circuito de 8,6 km em direção às
      lagoas glaciares de Černé e Čertovo.


      O pico de Poledník, com 1315 m, dispõe de uma torre de observação adaptada de uma antiga estação militar
      de radar; aberta em 1998, oferece panoramas amplos sobre Šumava e a Floresta Bávara. Em Kvilda um trilho
      contorna grandes cercados para veados e linces com abrigos elevados. Para interpretar a litologia, o
      parque oferece duas exposições geológicas: ao ar livre em Rokyta e coberta em Stožec.
    history: >-
      A mancha florestal presente resulta em parte dos acontecimentos do século XX: após a Segunda Guerra
      Mundial a população de língua alemã foi expulsa e o território transformou-se numa faixa militar
      interdita junto à fronteira. Anteriormente, a madeira e a areia de quartzo tinham dado origem a afamadas
      vidrarias em Hůrka, Prášily e Filipova Huť, e as jazidas auríferas perto de Kašperské Hory foram
      exploradas desde os celtas até aos séculos XIX e XX. Um abeto-branco de 559 anos, a segunda árvore mais
      antiga do parque, desenvolveu-se junto ao lago Plešné.


      Em 1963 foi criada uma vasta Paisagem Protegida, classificada como Reserva da Biosfera da UNESCO em
      1990, e a 20 de março de 1991 o setor mais valioso foi elevado a parque nacional. As turfeiras integram
      a lista Ramsar desde 1990. A Zona I, com 8.807 ha correspondendo a 13 % do parque, é deixada à livre
      dinâmica natural sem intervenção humana. As turfeiras drenadas no passado foram restauradas entre 2018 e
      2024 através do projeto Life for MIRES.
    before: >-
      Na primeira zona de conservação só é permitido caminhar por trilhos assinalados; os ecossistemas frágeis
      de Modravské slatě e Mrtvý luh encontram-se interditos ao público.
    around: >-
      Contíguo ao parque, a apenas 1 km, estende-se o [Parque Nacional da Floresta da
      Baviera](/lugar/nationalpark-bayerischer-wald/), dando continuidade à mesma floresta do outro lado da
      fronteira. A cerca de 5 km fica a [Floresta Virgem de Boubín](/lugar/boubinsky-prales/), a floresta
      primária de referência. Mais longe, o [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/) e o [Parque
      Nacional de Žemaitija](/lugar/zemaitijos-nacionalinis-parkas/) partilham florestas antigas e turfeiras
      com Šumava, partilhando Soomaa o alce, o castor e o lince, e Žemaitija o alce, o castor e o lobo.
