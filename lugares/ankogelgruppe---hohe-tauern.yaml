resumen:
  es: >-
    El 'Portal de los Tauern', macizo cristalino del Ankogel (3.252 m) con glaciares en retroceso y valles
    aluviales alpinos.
  en: >-
    The 'Gateway to the Tauern', crystalline massif of the Ankogel (3,252 m) with retreating glaciers and
    pristine alpine alluvial valleys.
  fr: >-
    Le 'Portail des Tauern', massif cristallin de l'Ankogel (3 252 m) abritant des glaciers en recul et des
    vallées alluviales alpines préservées.
  de: >-
    Das 'Tauernfenster', kristallines Massiv des Ankogels (3.252 m) mit schmelzenden Gletschern und
    naturbelassenen alpinen Schwemmtälern.
  it: >-
    La 'Porta dei Tauri', massiccio cristallino dell'Ankogel (3.252 m) con ghiacciai in ritiro e valloni
    alluvionali alpini integri.
  pt: >-
    O 'Portal dos Tauern', maciço cristalino do Ankogel (3.252 m) com glaciares em degelo e vales aluviais
    alpinos intocados.
unico:
  es: >-
    Aquí, en una misma tarde, caminas junto a un río turquesa de arena blanca y notas una corriente de aire
    helado saliendo de entre las rocas.
  en: >-
    Here, in a single afternoon, you can stroll beside a turquoise river of white sand and feel a freezing
    draught rushing from deep within the rocks.
  fr: >-
    Ici, au cours d'un même après-midi, vous longez une rivière turquoise sur sable blanc tout en percevant un
    souffle d'air glacé jaillissant des roches.
  de: >-
    Hier wanderst du an einem einzigen Nachmittag an einem türkisblauen Wildbach mit weißem Sand entlang und
    spürst eisige Luftzüge aus den Felsspalten dringen.
  it: >-
    Qui, nello stesso pomeriggio, cammini accanto a un torrente turchese su sabbia bianca avvertendo un getto
    d'aria gelida che sgorga dalle rocce.
  pt: >-
    Aqui, numa mesma tarde, podes caminhar junto a um ribeiro turquesa de areia branca e sentir uma lufada de
    ar gélido a brotar de fendas na rocha.
observaciones:
  es: >-
    Los senderos están señalizados con carteles amarillos y puntos rojos o negros según la dificultad; los
    negros exigen experiencia de montaña y pie seguro. Está prohibido acampar y hacer fuego en el campo. Hay
    que ir por los senderos señalizados y evitar ruidos innecesarios.
texto:
  es:
    intro: >-
      Hay valles que estuvieron a punto de desaparecer bajo el agua. El de Seebachtal, a 1.270 m de altitud y
      rodeado de montañas, estuvo cerca de ser un embalse hidroeléctrico en los años setenta. No lo fue, y hoy
      un sendero natural recorre su fondo entre bosque, pradera alpina y meandros. Es la puerta de entrada al
      grupo del Ankogel, el extremo oriental de los Altos Tauern, en Salzburgo y Carintia, dentro del mayor
      parque nacional de los Alpes.
    landscape: >-
      El Ankogel da nombre al macizo y mide 3.252 m, pero la cumbre más alta del grupo es la Hochalmspitze, de
      3.360 m. El grupo se reparte entre el Ankogel, la Hochalmspitze, el Hafner y el Reißeck, y guarda el
      Maltatal, el «valle de las aguas que caen», con la cascada de Fallbach y la presa de Kölnbrein. Por el
      fondo de ese valle corre una ruta de agua, la de las Malteiner Wasserspiele, que entra en la garganta y
      las cascadas del fondo.


      La roca explica por qué esta montaña es tan alta. El grupo está dentro de la ventana de los Tauern, de
      160 km de largo, donde afloran capas que en otros puntos de los Alpes están en lo más profundo. Cuatro
      grandes núcleos de gneis, nacidos de magma, forman el centro de esa ventana y dieron forma a cumbres
      como el Grossvenediger. Después llegaron los glaciares, que desgastaron circos y valles, y el agua y la
      erosión siguen trabajando hoy. El parque cuenta con 332 glaciares, cerca del seis por ciento de su
      superficie, que retroceden con el cambio climático.


      El bosque llega hasta los 2.000 o 2.200 m, unos 200 a 300 m por debajo de su límite natural, porque se
      talaron bosques de pino cembro para madera y para pasto. Más arriba están la rosa alpina, que florece
      entre mayo y principios de junio, el edelweiss y la saxífraga de Rudolph, endémica de los Altos Tauern,
      que crece en pedregales y rocas calcáreas. En total se han hallado unas 3.500 especies de plantas, y la
      mayoría están protegidas por su rareza.
    wildlife: >-
      El águila real está en el escudo del parque, y hay unas 40 parejas reproductoras. El
      [quebrantahuesos](/especie/gypaetus_barbatus/) se reintrodujo en 1986 y alcanza los 2,9 m de
      envergadura. El [buitre leonado](/especie/gyps_fulvus/) tiene aquí su única presencia, de paso, en todo
      el arco alpino. En el Seebachtal, el vencejo alpino y la golondrina roquera son dos de las muchas aves
      del valle.


      Entre los mamíferos, el [rebeco](/especie/rupicapra_rupicapra/) es el que más se ve. El
      [íbice](/especie/capra_ibex/) vive en cantiles y pedregales, con unos 1.100 ejemplares tras su
      reintroducción en los años sesenta. Las [marmotas](/especie/marmota_marmota/) viven en familias entre
      1.400 y 2.700 m, y avisan con silbidos del peligro: uno solo si viene del aire, una serie si viene del
      suelo. Del oso pardo y del lobo solo queda el recuerdo: desaparecieron en el siglo XIX.


      En invierno hay que tener siempre en cuenta el riesgo de avalancha. La temporada recomendada para
      caminar va de junio a octubre.
    visit: >-
      El mejor primer paseo es el sendero natural de Seebachtal: un circuito de siete kilómetros, fácil, que
      sale del aparcamiento de Ankogelbahn y llega al lago Stappitzer See. A mitad de camino, un desvío a la
      derecha lleva al río Seebach, de agua turquesa y arena blanca. Hay una plataforma de observación junto a
      los paneles del lago, y más adelante el recorrido cruza un bosque, una pradera alpina y varios meandros
      hasta un abanico aluvial. Los dos últimos puntos son el «praying forest» y el «ice hole», donde las
      grietas entre las rocas expulsan aire helado.


      Para entenderlo todo antes de salir, el centro BIOS de Mallnitz explica dónde ver fauna y cómo llegar al
      Ankogel, con una exposición interactiva, «univerzoom nationalpark». Los rangers del parque saben dónde
      ver quebrantahuesos, águilas reales, rebecos y marmotas, y organizan salidas a medida, incluida una
      excursión al amanecer para observar fauna.


      A Mallnitz se llega por carretera. Desde Salzburgo, al llegar a Badgastein-Böckstein, se puede tomar el
      autotrén hasta Mallnitz; también hay autobús.
    history: >-
      El parque nació de un acuerdo: en 1971 los gobernadores de Salzburgo, Carintia y el Tirol firmaron en
      Heiligenblut su voluntad de crear un parque nacional. La ley llegó a Carintia en 1981, a Salzburgo en
      1984 y al Tirol en 1992. La UICN lo reconoció como categoría II en 2001 para Carintia y en 2006 para
      Salzburgo y el Tirol. Con 1.856 km² es el mayor parque nacional de los Alpes y alberga la mayor zona
      Natura 2000 continua de Austria.


      En la zona núcleo la protección es estricta y no se puede destinar el 75 % de la superficie a usos
      económicos. Dos calzadas romanas cruzan los pasos de Mallnitz y de Korn Tauern.
    before: >-
      Los senderos están señalizados con carteles amarillos y puntos rojos o negros según la dificultad; los
      negros exigen experiencia de montaña y pie seguro. Está prohibido acampar y hacer fuego en el campo. Hay
      que ir por los senderos señalizados y evitar ruidos innecesarios.
    around: >-
      Pegado al Ankogel, en el mismo parque, está el [Parque Nacional Hohe Tauern - Valle de Umbal y Cabecera
      del Isel](/lugar/nationalpark-hohe-tauern---umbaltal-isel/). A unos seis kilómetros queda el [Grupo
      Schober - Altos Tauern](/lugar/schobergruppe---hohe-tauern/), y a unos veinticuatro el [Bosque de
      Tarvisio y Alpes Julianos Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/). Entre los
      lugares lejanos que comparten íbice y rebeco en alta montaña con glaciares están el [Parque Nacional de
      la Vanoise](/lugar/parc-national-de-la-vanoise/), el [Parque Nacional del
      Stelvio](/lugar/parco-nazionale-dello-stelvio/) y el [Parque Natural de los Alpes
      Marítimos](/lugar/parco-naturale-delle-alpi-marittime/).
  en:
    intro: >-
      Some valleys came dangerously close to disappearing beneath reservoirs. The Seebachtal, at 1,270 m
      altitude and framed by steep alpine peaks, was nearly dammed for hydroelectricity in the
      nineteen-seventies. It was saved, and today an interpretive nature trail wanders its floor between
      mountain forests, alpine meadows, and braided meanders. It serves as the main gateway to the Ankogel
      Group, the eastern bastion of the Hohe Tauern across Salzburg and Carinthia, nestled within the largest
      national park in the Alps.
    landscape: >-
      The Ankogel gives its name to the massif and reaches 3,252 m, though the crowning summit of the range is
      the Hochalmspitze at 3,360 m. The group spans the Ankogel, Hochalmspitze, Hafner, and Reißeck massifs,
      and encompasses the Maltatal—the 'valley of tumbling waters'—famous for the Fallbach waterfall and the
      towering Kölnbrein Dam. Along the valley floor runs the Malteiner Wasserspiele water path, tracing deep
      gorges and roaring cascades.


      Geology explains why these mountains rise so high. The group lies within the 160-km-long Tauern Window,
      where geological layers that elsewhere lie buried deep beneath the Alps were thrust up to the surface.
      Four major granite-gneiss domes, formed from ancient molten magma, form the core of this tectonic window
      and sculpted summits such as the Grossvenediger. Subsequent glaciations carved out cirques and valleys,
      with ice and water continuing their erosive work today. The national park protects 332 glaciers,
      covering nearly six percent of its surface area, which are in rapid retreat under a warming climate.


      Subalpine forests climb to between 2,000 and 2,200 m—roughly 200 to 300 m below their climatic
      potential—because centuries of grazing and timber harvesting pushed the tree line downward. Above thrive
      rusty-leaved alpenrose blooming in May and early June, edelweiss, and Rudolph's saxifrage, a high-alpine
      endemic of the Hohe Tauern clinging to limestone screes and rocky ledges. In total, around 3,500 plant
      species have been documented across the national park, many protected for their regional rarity.
    wildlife: >-
      The golden eagle adorns the national park emblem, with roughly 40 breeding pairs established in the
      territory. The [bearded vulture](/especie/gypaetus_barbatus/) was reintroduced in 1986 and achieves a
      wingspan of up to 2.9 m. The [griffon vulture](/especie/gyps_fulvus/) makes its sole, seasonal summer
      guest appearance here within the Alpine arc. In the Seebachtal, the alpine swift and crag martin are
      among the many nesting birds.


      Among mammals, the [chamois](/especie/rupicapra_rupicapra/) is most readily seen across high ridges. The
      [Alpine ibex](/especie/capra_ibex/) populates crags and screes, numbering around 1,100 animals following
      successful reintroductions in the nineteen-sixties. [Alpine marmots](/especie/marmota_marmota/) live in
      family colonies between 1,400 and 2,700 m, whistling shrill warnings: a single whistle for an aerial
      predator, a rhythmic series for terrestrial threats. Brown bears and wolves are now memories here,
      having vanished during the nineteenth century.


      In winter, avalanche danger is a constant factor in planning. The optimal hiking season spans June
      through October.
    visit: >-
      The ideal introductory hike is the Seebachtal nature trail: an easy, seven-kilometre circuit setting out
      from the Ankogelbahn car park and reaching Lake Stappitzer See. Midway, a path branches right to the
      Seebach river, showcasing turquoise water and banks of white glacial sand. A covered observation tower
      stands beside interpretive lake boards, while farther along the trail traverses mountain forest, alpine
      pastures, and braided stream gravels leading onto an alluvial fan. The final two stops are the 'praying
      forest' and the 'ice hole', where subterranean fissures vent freezing air.


      To understand the high-alpine environment before setting out, the BIOS National Park Centre in Mallnitz
      provides interactive displays and wildlife updates through its 'univerzoom nationalpark' exhibition.
      Park rangers offer specialized wildlife viewing excursions, including dawn wildlife-watching tours.


      Mallnitz is reachable by road. From Salzburg, motorists reaching Badgastein-Böckstein can load their
      vehicles onto the Tauern motorail shuttle train directly to Mallnitz; regional buses also serve the
      village.
    history: >-
      The national park grew out of a tripartite treaty: in 1971 the provincial governors of Salzburg,
      Carinthia, and Tyrol met at Heiligenblut to pledge the creation of an alpine national park. Enabling
      legislation was enacted in Carinthia in 1981, Salzburg in 1984, and Tyrol in 1992. The IUCN granted
      Category II status in 2001 for Carinthia and in 2006 for Salzburg and Tyrol. Covering 1,856 km², it is
      the largest national park in the Alps and contains the largest continuous Natura 2000 site in Austria.


      In the core wilderness zone strict process protection applies, precluding economic uses across 75% of
      the perimeter. Two historic Roman roads once crossed high passes over the Mallnitz and Korn Tauern.
    before: >-
      Trails are marked with yellow signposts and red or black difficulty dots; black dots indicate demanding
      alpine routes requiring sure-footedness and alpine experience. Camping and lighting fires in open
      terrain are strictly forbidden. Stay on marked paths and avoid unnecessary noise.
    around: >-
      Directly adjoining the Ankogel within the same national park lies [Hohe Tauern National Park - Umbal
      Valley and Isel River Headwaters](/lugar/nationalpark-hohe-tauern---umbaltal-isel/). About six
      kilometres away lies [Schober Group - Hohe Tauern](/lugar/schobergruppe---hohe-tauern/), and roughly
      twenty-four kilometres away lies [Tarvisio Forest and Italian Julian
      Alps](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/). Distant alpine protected areas sharing ibex
      and chamois in glaciated landscapes include [Vanoise National
      Park](/lugar/parc-national-de-la-vanoise/), [Stelvio National
      Park](/lugar/parco-nazionale-dello-stelvio/), and [Maritime Alps Natural
      Park](/lugar/parco-naturale-delle-alpi-marittime/).
  fr:
    intro: >-
      Il est des vallées alpines qui ont failli disparaître sous les eaux. La vallée du Seebachtal, à 1 270 m
      d'altitude au creux d'un cirque de cimes, faillit être noyée par un lac de barrage hydroélectrique dans
      les années soixante-dix. Le projet fut abandonné, et aujourd'hui un sentier d'interprétation parcourt
      son fond entre forêts montagnardes, pelouses et méandres alluviaux. C'est l'accès naturel au groupe de
      l'Ankogel, bastion oriental des Hautes Tauern entre Salzbourg et Carinthie, au sein du plus vaste parc
      national des Alpes.
    landscape: >-
      L'Ankogel donne son nom au massif et culmine à 3 252 m, bien que le point culminant du groupe soit la
      Hochalmspitze avec ses 3 360 m. Le massif réunit l'Ankogel, la Hochalmspitze, le Hafner et le Reißeck,
      et abrite la vallée du Maltatal — la « vallée des eaux jaillissantes » — célèbre pour la cascade de
      Fallbach et le barrage de Kölnbrein. Au fond de cette vallée chemine l'itinéraire des Malteiner
      Wasserspiele, menant au défilé et aux chutes d'eau.


      La géologie explique l'altitude de ces crêtes. Le massif s'inscrit dans la Fenêtre des Tauern, longue de
      160 km, où affleurent des séries tectoniques ailleurs profondément enfouies dans les Alpes. Quatre
      grands noyaux de gneiss oeillé issus d'anciens magmas forment le centre de cette fenêtre et modèlent des
      sommets comme le Grossvenediger. Les glaciers quaternaires ont ensuite creusé cirques et auges, l'eau et
      l'érosion poursuivant leur labeur. Le parc national dénombre 332 glaciers, soit près de six pour cent de
      sa superficie, qui reculent rapidement sous l'effet du réchauffement climatique.


      La forêt s'élève jusqu'à 2 000 ou 2 200 m d'altitude, soit environ 200 à 300 m sous sa limite naturelle,
      en raison des défrichements pastoraux historiques. Au-dessus fleurissent le rhododendron ferrugineux
      entre mai et début juin, l'edelweiss et la saxifrage de Rudolph, endémique des Hautes Tauern accrochée
      aux éboulis calcaires. Au total, près de 3 500 espèces végétales ont été recensées dans le parc, la
      plupart protégées pour leur rareté.
    wildlife: >-
      L'aigle royal illustre les armoiries du parc, qui héberge environ 40 couples nicheurs. Le [gypaète
      barbu](/especie/gypaetus_barbatus/) a été réintroduit en 1986 et déploie une envergure atteignant 2,9 m.
      Le [vautour fauve](/especie/gyps_fulvus/) y effectue sa seule halte estivale régulière de tout l'arc
      alpin. Dans le Seebachtal, le martinet à ventre blanc et l'hirondelle de rochers comptent parmi les
      nombreux oiseaux nicheurs.


      Parmi les mammifères, le [chamois](/especie/rupicapra_rupicapra/) est le plus fréquemment observé. Le
      [bouquetin des Alpes](/especie/capra_ibex/) peuple corniches et pierriers, avec environ 1 100 individus
      issus des réintroductions des années soixante. Les [marmottes](/especie/marmota_marmota/) vivent en
      familles entre 1 400 et 2 700 m, alertant la colonie de leurs sifflements : un cri isolé pour un rapace
      en vol, une série modulée pour un prédateur terrestre. De l'ours brun et du loup ne subsiste que le
      souvenir : ils ont disparu au XIXe siècle.


      En hiver, le danger d'avalanche est permanent. La période conseillée pour la randonnée s'étend de juin à
      octobre.
    visit: >-
      La promenade idéale pour débuter est le sentier découverte du Seebachtal : un circuit aisé de sept
      kilomètres partant du parking du téléphérique de l'Ankogelbahn jusqu'au lac Stappitzer See. À mi-chemin,
      une sente à droite rejoint la rivière Seebach, aux eaux turquoise et grèves de sable blanc. Un belvédère
      couvert borde les panneaux explicatifs du lac, puis l'itinéraire traverse forêt montagnarde, pâturages
      et méandres jusqu'à un cône de déjection. Les deux dernières étapes sont la « forêt de prière » et le «
      trou de glace », où des failles rocheuses expulsent de l'air glacé.


      Pour préparer votre excursion, le centre BIOS de Mallnitz vous accueille avec son exposition «
      univerzoom nationalpark ». Les rangers guident les visiteurs vers les secteurs à gypaètes, chamois et
      marmottes, proposant des sorties matinales sur mesure.


      Mallnitz est relié au réseau routier. Depuis Salzbourg, à la gare de Badgastein-Böckstein, vous pouvez
      charger votre voiture sur la navette ferroviaire des Tauern jusqu'à Mallnitz ; des cars réguliers
      desservent également la station.
    history: >-
      Le parc national est né d'un accord politique : en 1971, les gouverneurs de Salzbourg, de Carinthie et
      du Tyrol signèrent à Heiligenblut la déclaration fondatrice. Les lois provinciales suivirent en 1981 en
      Carinthie, 1984 à Salzbourg et 1992 au Tyrol. L'UICN reconnut la catégorie II en 2001 pour la Carinthie
      et en 2006 pour Salzbourg et le Tyrol. Avec 1 856 km², c'est le plus étendu des parcs nationaux alpins
      et la plus grande zone Natura 2000 continue d'Autriche.


      Dans la zone centrale, la protection est intégrale et proscrit tout usage économique sur 75 % du
      périmètre. Deux voies romaines franchissaient autrefois les cols de Mallnitz et du Korn Tauern.
    before: >-
      Les itinéraires sont balisés de panonceaux jaunes avec pastilles rouges ou noires selon la technicité ;
      les circuits noirs requièrent une solide expérience alpine et un pied très sûr. Le camping sauvage et
      les feux sont strictement proscrits. Demeurez sur les sentiers balisés et respectez la quiétude des
      lieux.
    around: >-
      Contigu à l'Ankogel dans le même parc se trouve le [parc national des Hohe Tauern - vallée d'Umbal et
      sources de l'Isel](/lugar/nationalpark-hohe-tauern---umbaltal-isel/). À environ six kilomètres s'élève
      le [massif du Schober - Hautes Tauern](/lugar/schobergruppe---hohe-tauern/), et à environ vingt-quatre
      kilomètres s'étend la [forêt de Tarvisio et les Alpes juliennes
      italiennes](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/). Parmi les espaces alpins lointains
      partageant le bouquetin et le chamois en milieu glaciaire figurent le [parc national de la
      Vanoise](/lugar/parc-national-de-la-vanoise/), le [parc national du
      Stelvio](/lugar/parco-nazionale-dello-stelvio/) et le [parc naturel des Alpes
      maritimes](/lugar/parco-naturale-delle-alpi-marittime/).
  de:
    intro: >-
      Es gibt Alpentäler, die nur knapp der Überflutung entgingen. Das Seebachtal auf 1.270 m Höhe, umrahmt
      von steilen Gipfeln, sollte in den siebziger Jahren einem gewaltigen Stausee weichen. Das Projekt
      scheiterte, und heute erschließt ein Naturlehrpfad den Talboden zwischen Bergwald, alpinen Feuchtwiesen
      und naturnahen Flussmäandern. Es ist das Eingangstor zur Ankogelgruppe, dem östlichen Eckpfeiler der
      Hohen Tauern in Salzburg und Kärnten im größten Nationalpark der Alpen.
    landscape: >-
      Der Ankogel leiht dem Gebirgsstock seinen Namen und misst 3.252 m, wenngleich die Hochalmspitze mit
      3.360 m den höchsten Punkt bildet. Die Gruppe gliedert sich in Ankogel, Hochalmspitze, Hafner und
      Reißeck und umfasst das Maltatal — das 'Tal der stürzenden Wasser' — mit dem Fallbach-Wasserfall und der
      Kölnbreinsperre. Durch den Talgrund führen die Malteiner Wasserspiele in Felsklammen und Kaskaden.


      Die Geologie erklärt die gewaltige Höhe des Massivs. Die Gruppe liegt im 160 km langen Tauernfenster, wo
      tektonische Schichten zutage treten, die andernorts tief im Alpenkörper verborgen liegen. Vier große
      Kerngneiskörper vulkanischen Ursprungs bilden das Zentrum dieses Fensters und formten Riesen wie den
      Großvenediger. Später schliffen Gletscher Kare und Trogtäler aus, während Schmelzwasser und Erosion das
      Relief bis heute formen. Der Nationalpark zählt 332 Gletscher, rund sechs Prozent seiner Gesamtfläche,
      die im Zuge der Klimaerwärmung rasch abschmelzen.


      Der Bergwald reicht bis auf 2.000 oder 2.200 m hinauf, etwa 200 bis 300 m unter seiner potenziellen
      Waldgrenze, bedingt durch historische Rodungen für Almwirtschaft und Bergbau. Darüber blühen Alpenrosen
      von Mai bis Anfang Juni, Edelweiß sowie die Tauern-Steinbrech-Art Saxifraga rudolphiana, die als Endemit
      der Hohen Tauern Kalkschuttfluren besiedelt. Insgesamt wurden im Nationalpark rund 3.500 Pflanzenarten
      nachgewiesen, viele davon streng geschützt.
    wildlife: >-
      Der Steinadler ziert das Wappen des Nationalparks; rund 40 Brutpaare sind im Schutzgebiet heimisch. Der
      [Bartgeier](/especie/gypaetus_barbatus/) wurde 1986 erfolgreich wiederangesiedelt und erreicht 2,9 m
      Flügelspannweite. Der [Gänsegeier](/especie/gyps_fulvus/) nutzt die Hochlagen als regelmäßigen
      Sommergast aus Südeuropa. Im Seebachtal brüten Alpensegler und Felsenschwalben in großer Zahl.


      Unter den Säugetieren begegnet man der [Gämse](/especie/rupicapra_rupicapra/) am häufigsten. Der
      [Alpensteinbock](/especie/capra_ibex/) bewohnt Grate und Blockhalden mit rund 1.100 Tieren nach
      Wiederansiedlungen in den sechziger Jahren. [Alpenmurmeltiere](/especie/marmota_marmota/) leben in
      Kolonien zwischen 1.400 und 2.700 m und warnen mit Pfiffen: ein Einzelschrei bei Luftfeinden, eine
      Pfiffserie bei Gefahren am Boden. Braunbär und Wolf verschwanden im neunzehnten Jahrhundert aus diesen
      Tälern.


      Im Winter ist stets die alpine Lawinengefahr zu beachten. Die ideale Wanderzeit reicht von Juni bis
      Oktober.
    visit: >-
      Die beste Einstiegstour ist der Naturlehrpfad Seebachtal: ein leichter Rundweg von sieben Kilometern ab
      dem Parkplatz der Ankogelbahn bis zum Stappitzer See. Auf halbem Weg führt ein Abstecher an den Seebach
      mit türkisblauem Schmelzwasser und Sandbänken. Eine Aussichtskanzel informiert am See, bevor der Pfad
      Bergwälder und Feuchtbiotope zu einem Schwemmkegel quert. Die beiden letzten Stationen sind der 'Betende
      Wald' und das 'Windloch', wo eiskalte Luftströme aus Felsspalten wehen.


      Vor der Bergtour vermittelt das BIOS Nationalparkzentrum in Mallnitz mit der Ausstellung 'univerzoom
      nationalpark' fundiertes Wissen über Fauna und Geologie. Nationalpark-Ranger organisieren Exkursionen,
      darunter Wildbeobachtungstouren in der Morgendämmerung.


      Mallnitz ist bequem erreichbar. Von Salzburg aus können Autofahrer ab Bad Gastein-Böckstein die
      Tauernschleuse per Autozug durch den Tunnel direkt nach Mallnitz nutzen; Linienbusse verkehren
      regelmäßig.
    history: >-
      Der Nationalpark entsprang einer politischen Initiative: 1971 unterzeichneten die Landeshauptleute von
      Salzburg, Kärnten und Tirol in Heiligenblut die Dreiländer-Vereinbarung. Entsprechende
      Nationalparkgesetze traten 1981 in Kärnten, 1984 in Salzburg und 1992 in Tirol in Kraft. Die IUCN
      erkannte das Schutzgebiet 2001 für Kärnten und 2006 für Salzburg und Tirol als Kategorie II an. Mit
      1.856 km² ist er der größte Nationalpark der Alpen und birgt Österreichs größtes zusammenhängendes
      Natura 2000-Gebiet.


      In der Kernzone gilt strenger Prozessschutz, der wirtschaftliche Nutzungen auf 75 % der Fläche
      untersagt. Historische Römerwege querten einst die Pässe Mallnitzer Tauern und Korntauern.
    before: >-
      Wanderwege sind mit gelben Wegweisern und roten oder schwarzen Punkten markiert; schwarze Routen
      erfordern alpine Erfahrung und Trittsicherheit. Zelten und offenes Feuer im Freigelände sind verboten.
      Bleib auf den markierten Wegen und vermeide Lärm.
    around: >-
      Direkt benachbart im selben Nationalpark liegt der [Nationalpark Hohe Tauern - Umbaltal und
      Iselursprung](/lugar/nationalpark-hohe-tauern---umbaltal-isel/). Rund sechs Kilometer entfernt liegt die
      [Schobergruppe - Hohe Tauern](/lugar/schobergruppe---hohe-tauern/), und etwa vierundzwanzig Kilometer
      entfernt der [Wald von Tarvis und die italienischen Julischen
      Alpen](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/). Zu den alpinen Schutzgebieten mit Steinbock
      und Gämse in gletschergeprägten Hochgebirgen gehören der [Nationalpark
      Vanoise](/lugar/parc-national-de-la-vanoise/), der [Nationalpark
      Stilfserjoch](/lugar/parco-nazionale-dello-stelvio/) und der [Naturpark
      Seealpen](/lugar/parco-naturale-delle-alpi-marittime/).
  it:
    intro: >-
      Vi sono vallate alpine che rischiarono di finire sommerse dall'acqua. La Seebachtal, a 1.270 m di quota
      cinta da muraglie rocciose, fu sul punto di essere trasformata in un invaso idroelettrico negli anni
      settanta. Lo scempio fu scongiurato, e oggi un sentiero naturalistico ne percorre il fondovalle tra
      boschi montani, pascoli d'alta quota e anse fluviali. Rappresenta l'accesso al gruppo dell'Ankogel,
      estremo lembo orientale degli Alti Tauri tra Salisburgo e Carinzia, all'interno del maggiore parco
      nazionale dell'arco alpino.
    landscape: >-
      L'Ankogel dà il nome al gruppo elevandosi a 3.252 m, sebbene la vetta regina sia l'Hochalmspitze con i
      suoi 3.360 m. Il massiccio si ripartisce tra Ankogel, Hochalmspitze, Hafner e Reißeck, racchiudendo la
      Maltatal — la «valle delle acque scroscianti» — con la cascata Fallbach e l'invaso di Kölnbrein. Sul
      fondovalle corre il percorso delle Malteiner Wasserspiele tra orridi e cascate spumeggianti.


      La geologia chiarisce l'imponenza di queste vette. Il gruppo sorge nella Finestra dei Tauri, lunga 160
      km, dove affiorano orizzonti tettonici che altrove giacciono nelle viscere delle Alpi. Quattro grandi
      duomi di gneiss granitico originati da intrusioni magmatiche formano il fulcro di questa finestra
      geologica plasmando vette come il Grossvenediger. I ghiacciai quaternari modellarono circhi e valli
      sospese, mentre acque ed erosione proseguono il loro lavorio. Il parco tutela 332 ghiacciai, pari a
      circa il sei per cento della superficie, che registrano un rapido arretramento a causa della crisi
      climatica.


      La fascia boschiva sale fino a 2.000 o 2.200 m, circa 200 a 300 m al di sotto del limite potenziale a
      causa degli storici dissodamenti pastorali. Più in alto fioriscono il rododendro ferruginoso da maggio a
      inizio giugno, la stella alpina e la sassifraga di Rudolph, endemica degli Alti Tauri su ghiaioni
      calcarei. Complessivamente il parco conta circa 3.500 specie floristiche, molte delle quali rigidamente
      tutelate.
    wildlife: >-
      L'aquila reale spicca nell'emblema del parco, presente con circa 40 coppie riproduttive. Il
      [gipeto](/especie/gypaetus_barbatus/) è stato reintrodotto nel 1986 e raggiunge 2,9 m di apertura alare.
      Il [grifone](/especie/gyps_fulvus/) compie qui le sue uniche apparizioni estive regolari di tutto l'arco
      alpino. Nella Seebachtal, il rondone maggiore e il balestruccio montano popolano le pareti rocciose.


      Tra i mammiferi, il [camoscio](/especie/rupicapra_rupicapra/) è l'ungulato di più agevole osservazione.
      Lo [stambecco alpino](/especie/capra_ibex/) abita cenge e pietraie con circa 1.100 esemplari frutto
      delle reintroduzioni degli anni sessanta. Le [marmotte](/especie/marmota_marmota/) vivono in gruppi
      familiari tra 1.400 e 2.700 m avvertendo del pericolo con fischi acuti: un sibilo singolo per una
      minaccia aerea, fischi ripetuti per pericoli a terra. Orso bruno e lupo scomparvero nel corso del XIX
      secolo.


      In inverno occorre tenere in debita considerazione il rischio valanghe. La stagione consigliata per il
      trekking va da giugno a ottobre.
    visit: >-
      La camminata d'approccio più consigliata è il sentiero didattico della Seebachtal: un anello di sette
      chilometri, agevole, con partenza dal piazzale della funivia Ankogelbahn fino allo Stappitzer See. A
      metà strada, una deviazione a destra conduce sulle rive del torrente Seebach tra acque turchesi e
      candide sponde di sabbia glaciale. Una terrazza d'avvistamento sorge accanto ai pannelli del lago,
      dopodiché il tracciato attraversa boschi, praterie e canali intrecciati su conoide alluvionale. Le due
      stazioni conclusive sono la «foresta orante» e la «buca del vento», dove dalle fessure rocciose
      fuoriescono folate d'aria ghiacciata.


      Per inquadrare la natura prima di partire, il centro BIOS di Mallnitz presenta la mostra interattiva
      «univerzoom nationalpark». I ranger guidano escursioni dedicate alla fauna all'alba per osservare
      ungulati e rapaci.


      Mallnitz è comodamente accessibile in auto. Da Salisburgo, giunti a Badgastein-Böckstein, è possibile
      caricare l'auto sulla navetta ferroviaria dei Tauri attraversando la galleria direttamente fino a
      Mallnitz; sono disponibili anche autobus di linea.
    history: >-
      Il parco scaturì da una storica intesa politica: nel 1971 i presidenti di Salisburgo, Carinzia e Tirolo
      sottoscrissero a Heiligenblut l'impegno istitutivo. La legge regionale fu approvata in Carinzia nel
      1981, a Salisburgo nel 1984 e in Tirolo nel 1992. L'IUCN ha ratificato la Categoria II nel 2001 per la
      Carinzia e nel 2006 per Salisburgo e Tirolo. Con 1.856 km² è il più esteso parco nazionale alpino e
      custodisce la più vasta area Natura 2000 contigua d'Austria.


      Nella zona centrale vige la tutela integrale a non intervento, escludendo il 75% della superficie da
      attività commerciali. Due antiche vie romane valicavano i passi dei Mallnitzer Tauern e del Korntauern.
    before: >-
      I percorsi sono guidati da cartelli gialli con contrassegni rossi o neri; i sentieri neri richiedono
      passo sicuro ed esperienza d'alta montagna. È proibito campeggiare e accendere fuochi all'aperto. Rimani
      sui percorsi segnalati evitando rumori molesti.
    around: >-
      Adiacente all'Ankogel nel medesimo comprensorio sorge il [Parco Nazionale Alti Tauri - Valle Umbal e
      Sorgenti dell'Isel](/lugar/nationalpark-hohe-tauern---umbaltal-isel/). A circa sei chilometri si staglia
      il [Gruppo dello Schober - Alti Tauri](/lugar/schobergruppe---hohe-tauern/), e a circa ventiquattro
      chilometri si estende la [Foresta di Tarvisio e Alpi Giulie
      Italiane](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/). Tra i parchi alpini che condividono
      stambecco e camoscio in scenari glaciali spiccano il [Parco Nazionale della
      Vanoise](/lugar/parc-national-de-la-vanoise/), il [Parco Nazionale dello
      Stelvio](/lugar/parco-nazionale-dello-stelvio/) e il [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/).
  pt:
    intro: >-
      Há vales de montanha que estiveram à beira de desaparecer debaixo de albufeiras. O vale de Seebachtal, a
      1.270 m de altitude e rodeado de picos escarpados, esteve prestes a ser inundado por uma barragem
      hidroelétrica nos anos setenta. O projeto foi travado e hoje um trilho interpretativo percorre o fundo
      do vale entre arvoredo montano, prados alpinos e meandros aluviais. É o portal de entrada para o maciço
      do Ankogel, baluarte oriental dos Hohe Tauern em Salzburgo e na Caríntia, no maior parque nacional dos
      Alpes.
    landscape: >-
      O Ankogel dá nome ao maciço e ergue-se a 3.252 m, embora a montanha culminante do grupo seja o
      Hochalmspitze, com 3.360 m. O grupo estende-se entre o Ankogel, o Hochalmspitze, o Hafner e o Reißeck,
      acolhendo o vale de Maltatal — o «vale das águas em cascata» — com o salto de Fallbach e a imponente
      barragem de Kölnbrein. Pelo fundo do vale desenvolve-se o percurso das Malteiner Wasserspiele,
      penetrando em gargantas e cascatas.


      A geologia fundamenta a altitude destas cristas. O maciço integra a Janela dos Tauern, com 160 km de
      comprimento, onde afloram camadas tectónicas que noutros pontos dos Alpes jazem no fundo da crusta.
      Quatro grandes maciços de gneisse granítico gerados por magma antigo constituem o núcleo desta janela
      geológica, moldando picos como o Grossvenediger. Mais tarde os glaciares escavaram circos e vales
      glaciares, prosseguindo a água e o gelo o seu trabalho erosivo. O parque nacional acolhe 332 glaciares,
      cerca de seis por cento da sua superfície total, que regridem com o aquecimento global.


      A floresta atinge entre 2.000 e 2.200 m de altitude, cerca de 200 a 300 m abaixo do seu limite natural
      devido ao desbaste histórico para pastagens e lenha. Acima desabrocham o rododendro-ferrugíneo entre
      maio e início de junho, o edelvaisse e a saxífraga-de-rudolph, endemismo dos Hohe Tauern que coloniza
      cascalheiras calcárias. No cômputo geral foram registadas cerca de 3.500 espécies de plantas, grande
      parte estritamente protegida.
    wildlife: >-
      A águia-real figura no brasão do parque, contando com cerca de 40 casais reprodutores. O
      [quebra-ossos](/especie/gypaetus_barbatus/) foi reintroduzido em 1986 e atinge 2,9 m de envergadura. O
      [grifo](/especie/gyps_fulvus/) realiza aqui a sua única estada estival regular de toda a cadeia alpina.
      Em Seebachtal, o andorinhão-real e a andorinha-das-rochas integram a rica avifauna do vale.


      Entre os mamíferos, a [camurça](/especie/rupicapra_rupicapra/) é o habitante mais visível. O
      [íbis-dos-alpes](/especie/capra_ibex/) ocupa escarpas e canais rochosos, somando cerca de 1.100
      espécimes após reintroduções bem-sucedidas nos anos sessenta. As [marmotas](/especie/marmota_marmota/)
      vivem em colónias familiares entre 1.400 e 2.700 m, alertando com assobios estridentes: um assobio
      isolado perante perigo aéreo, uma sequência repetida perante ameaças no solo. O urso-pardo e o lobo
      extinguiram-se no século XIX.


      No inverno há que prevenir sempre o risco de avalanches. A época recomendada para caminhar vai de junho
      a outubro.
    visit: >-
      O percurso de descoberta ideal é o trilho natural de Seebachtal: um circuito acessível de sete
      quilómetros que parte do parque de estacionamento do teleférico Ankogelbahn até ao lago Stappitzer See.
      A meio caminho, um desvio à direita alcança as margens do rio Seebach, de águas turquesa e praias de
      areia branca. Uma torre de observação ergue-se junto aos painéis do lago, prosseguindo o trilho por
      florestas, prados e esteiros aluviais num cone de dejeção. As duas derradeiras paragens são a «floresta
      de oração» e o «buraco de gelo», de cujas fendas rochosas sopra uma corrente de ar glacial.


      Para explorar a ecologia antes de subir, o centro BIOS em Mallnitz acolhe a exposição «univerzoom
      nationalpark». Os vigilantes da natureza orientam saídas guiadas matinais para observação de grandes
      carnívoros e aves de rapina.


      Mallnitz é acessível por via rodoviária. A partir de Salzburgo, em Badgastein-Böckstein, os
      automobilistas podem carregar a viatura no comboio-vaivém dos Tauern até Mallnitz; circulam igualmente
      autocarros regulares.
    history: >-
      O parque nasceu de uma declaração conjunta: em 1971 os governadores de Salzburgo, Caríntia e Tirol
      subscreveram em Heiligenblut o compromisso de criar um parque nacional alpino. A legislação foi aprovada
      na Caríntia em 1981, em Salzburgo em 1984 e no Tirol em 1992. A UICN atribuiu a Categoria II em 2001
      para a Caríntia e em 2006 para Salzburgo e o Tirol. Com 1.856 km² é o maior parque nacional dos Alpes e
      resguarda a maior área contínua da rede Natura 2000 da Áustria.


      Na zona nuclear vigora proteção estrita de não intervenção sobre 75% da área. Duas calçadas romanas
      históricas cruzavam outrora os desfiladeiros de Mallnitz e Korn Tauern.
    before: >-
      Os trilhos estão assinalados com placas amarelas e pontos vermelhos ou pretos consoante a exigência
      física; os percursos pretos exigem experiência alpina e passos firmes. O campismo selvagem e fogueiras
      são proibidos. Mantém-te nos caminhos marcados e evita ruídos desnecessários.
    around: >-
      Confinante com o Ankogel no mesmo parque nacional estende-se o [Parque Nacional Hohe Tauern - Vale de
      Umbal e Cabeceiras do Isel](/lugar/nationalpark-hohe-tauern---umbaltal-isel/). A cerca de seis
      quilómetros ergue-se o [Grupo Schober - Hohe Tauern](/lugar/schobergruppe---hohe-tauern/), e a cerca de
      vinte e quatro quilómetros a [Floresta de Tarvisio e Alpes Julianos
      Italianos](/lugar/foresta-di-tarvisio---alpi-giulie-italiane/). Entre os maciços alpinos distantes que
      partilham o íbis e a camurça em relevos glaciares contam-se o [Parque Nacional da
      Vanoise](/lugar/parc-national-de-la-vanoise/), o [Parque Nacional do
      Stelvio](/lugar/parco-nazionale-dello-stelvio/) e o [Parque Natural dos Alpes
      Marítimos](/lugar/parco-naturale-delle-alpi-marittime/).
