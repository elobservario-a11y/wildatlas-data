resumen:
  es: >-
    La 'Venecia Verde', la segunda zona húmeda más grande de Francia con una intrincada red de canales
    arbolados.
  en: >-
    The "Green Venice", France's second-largest wetland expanse criss-crossed by an intricate network of
    tree-lined canals.
  fr: >-
    La « Venise verte », deuxième plus vaste zone humide de France sillonnée par un dédale de canaux bordés
    d'arbres.
  de: >-
    Das „Grüne Venedig“, Frankreichs zweitgrößtes Feuchtgebiet, durchzogen von einem labyrinthartigen
    Kanalnetz.
  it: >-
    La «Venezia Verde», la seconda zona umida più vasta di Francia solcata da un fitto reticolo di canali
    alberati.
  pt: >-
    A «Veneza Verde», a segunda maior zona húmida de França recortada por uma densa malha de canais
    arborizados.
unico:
  es: >-
    Una bahía de fangales y prados salados donde cada año pasan unas 500.000 aves, en un humedal que el ser
    humano lleva moldeando desde el siglo X.
  en: >-
    A vast coastal bay of mudflats and saltmarshes staging some 500,000 birds annually, within a living
    wetland shaped by human hands since the tenth century.
  fr: >-
    Une baie de vasières et de prés salés où transitent chaque année quelque 500 000 oiseaux, au cœur d'un
    marais façonné depuis le Xe siècle.
  de: >-
    Eine Watt- und Salzwiesenbucht, die jährlich rund 500.000 Vögeln Rast bietet, in einer seit dem zehnten
    Jahrhundert vom Menschen geformten Kulturlandschaft.
  it: >-
    Una baia di piane di marea e pascoli salsi attraversata ogni anno da circa 500.000 uccelli, in una palude
    modellata dall'uomo sin dal X secolo.
  pt: >-
    Uma baía de lodaçais e sapais onde passam anualmente cerca de 500.000 aves, numa zona húmida moldada pelo
    ser humano desde o século X.
observaciones:
  es: >-
    En la reserva está prohibido, entre otras cosas, pasear al perro, acampar, hacer fuego, circular en
    vehículos a motor y sobrevolarla a menos de 300 m, incluidos drones y cometas. Los observatorios están en
