texto:
  es:
    intro: >-
      Antes de ser marisma, esto fue mar. El golfo de los Pictones se fue cegando de sedimentos y el hombre
      hizo el resto: diques, fosos, canales. Lo que queda es el Marais Poitevin, que junto con la bahía de
      Aiguillon, reliquia de aquel golfo, ocupa unas 110.000 hectáreas y es el segundo humedal de Francia tras
      la Camarga. Este recorrido se queda con su lado occidental, el más abierto al océano: la bahía y su
      litoral, los marais communaux y el marais desecado, más lejos de las barcas de la Venise verte, que es
      la parte más oriental del marais mojado.
    landscape: >-
      El Marais Poitevin se entiende por su agua. Está formado por tres conjuntos ligados al funcionamiento
      hidráulico: el marais marítimo, el desecado y el mojado. El terreno que dejó el océano es una llanura de
      entre cero y ocho metros de altitud, con la mitad por debajo de los dos metros. Una red de miles de
      kilómetros de fosos, canales y regueros, y millones de árboles plantados para fijar las orillas,
      amortigua las variaciones de lluvia entre estaciones: inundaciones en invierno, sequías en verano.


      En la costa, la bahía de Aiguillon reúne playas de arena, dunas, bosques litorales, acantilados y
      fangales. Cada bajamar deja al descubierto grandes extensiones de fango donde las aves se alimentan;
      cuando suben las mareas vivas, el océano llega hasta el dique que protege el marais desecado y cubre las
      mizottes, los prados salados de la parte alta del fangal, que se pastorean poco y de los que se recoge
      heno. La reserva natural de la bahía, de 4.900 hectáreas, cubre el estuario del Sèvre Niortaise; entre
      sus 110 especies de plantas figuran la salicornia, la puccinelia marítima, la obione, el carrizo y la
      ofrís araña.
    wildlife: >-
      Las aves ordenan el calendario. El Marais Poitevin está en un eje de migración norte-sur: unas 500.000
      aves pasan cada año por él de camino a las costas ibéricas y africanas, y se han registrado más de 330
      especies. La bahía es el mejor sitio para ver aves acuáticas, como la [aguja
      colinegra](/especie/limosa_limosa/), el correlimos común, la
      [avoceta](/especie/recurvirostra_avosetta/), el [tarro blanco](/especie/tadorna_tadorna/) y el ánade
      rabudo.


      En invierno, la reserva acoge una diversidad de aves excepcional en sus prados salados y fangales. A
      finales de esa estación se ven desde el dique y a través del prado salado las últimas ocas y patos antes
      de que se marchen al norte, además de numerosos limícolas en el fangal, y desde el observatorio de
      Saint-Michel se asiste al espectáculo de la puesta de sol de las [grullas](/especie/grus_grus/) y de la
      multitud de aves que invernan. Cada mes se hace un recuento de aves acuáticas en la bahía y en el
      marais.


      Tierra adentro, los marais communaux son grandes praderas inundables en invierno, favorables a las aves
      acuáticas; en ellos pueden criar la cerceta carretona y la avefría cuando el nivel del agua lo permite.
      Los marais desecados atraen cada año al búho campestre y al rascón, por sus espacios abiertos y su
      calma.
    visit: >-
      La bahía es amplia y de acceso difícil, así que la reserva ha repartido paneles informativos temáticos
      en los puntos de acceso a su alrededor y ofrece mapas de los mejores sitios de observación. El público
      puede entrar, salvo fuera de los itinerarios señalizados en la Pointe de l'Aiguillon.


      Los observatorios del parque están pensados para recorrerlos a pie o en bicicleta y permiten mirar sin
      acercarse a las aves. Se ven mejor por la mañana o al atardecer, cuando el calor del verano levanta
      brumas que dificultan la observación. Y si prefieres compañía, el parque organiza salidas de ornitología
      con guías.
    history: >-
      Los primeros diques para ganar tierra al marais se levantaron a partir de finales del siglo X, para
      explotarla con más facilidad. Desde 1992 se restauraron puertos, fuentes y canales y se construyeron
      caminos y pasarelas en unas marismas que hasta entonces solo se recorrían por vías de agua. Los grandes
      trabajos agrícolas de los años sesenta no fueron tan amables: hicieron desaparecer partes del marais
      mojado, como la zona del río Vendée entre Le Gué de Velluire y l'île d'Elle.


      Hoy la bahía está protegida por dos reservas naturales nacionales cogestionadas por la OFB y la LPO.
      Entre 2016 y 2020 un programa LIFE, coordinado por el parque regional, trabajó en preservar sus hábitats
      litorales; en 2019 se retiraron viejas instalaciones ostrícolas, colonizadas por ostra japonesa
      invasora, para restaurar los fangales junto a la Pointe de l'Aiguillon. Otros espacios del marais
      también son reservas nacionales, como el marais communal de Saint-Denis-du-Payré y la casse de la
      Belle-Henriette.
    before: >-
      En la reserva está prohibido, entre otras cosas, pasear al perro, acampar, hacer fuego, circular en
      vehículos a motor y sobrevolarla a menos de 300 m, incluidos drones y cometas. Los observatorios están
      en zonas preservadas y su acceso suele estar regulado, así que antes de ir comprueba cuáles puedes
      visitar.
    around: >-
      El atlas no registra vecinos de este litoral, pero sí lugares lejanos con los que comparte especies,
      como el tarro blanco y la nutria: el [Słowiński Park Narodowy](/lugar/slowinski-park-narodowy/) y la
      [Laguna di Venezia](/lugar/laguna-di-venezia/), y el [Niedersächsisches
      Wattenmeer](/lugar/nationalpark-niedersachsisches-wattenmeer/) y el [Schleswig-Holsteinisches
      Wattenmeer](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).
  en:
    intro: >-
      Before becoming a marsh, this was open ocean. The Gulf of the Pictons gradually silted up with marine
      mud and human ingenuity finished the task: dykes, drainage ditches, and regulated canals. The surviving
      legacy is the Marais Poitevin, which together with the Bay of Aiguillon—a relic of that ancient marine
      embayment—covers around 110,000 hectares, ranking as France's second-largest wetland after the Camargue.
      This route focuses strictly on its wild western maritime facade: the ocean bay, communal meadows, and
      drained polders, well removed from tourist punt traffic in the eastern "Green Venice".
    landscape: >-
      The Marais Poitevin is defined by its complex hydrology. It comprises three interrelated functional
      zones: the maritime bay, the drained marsh polders, and the wet marsh. The land left behind by the
      Atlantic is an ultra-flat plain between zero and eight metres in altitude, with fully half lying below
      two metres. An intricate network of thousands of kilometres of ditches, canals, and drains, shaded by
      millions of ash and poplar trees planted to stabilize the banks, buffers rainfall extremes between
      winter inundations and summer droughts.


      Along the Atlantic frontage, the Bay of Aiguillon combines sandy shores, dunes, maritime pine woods,
      limestone bluffs, and vast intertidal mudflats. Every ebb tide exposes vast mud expanses where waders
      feed; during spring tides, ocean waters reach the seawall protecting drained farmlands and submerge the
      mizottes—high salt meadows that are lightly grazed or cut for hay. The bay's national nature reserve
      protects 4,900 hectares across the Sèvre Niortaise estuary; its 110 plant species include glasswort,
      common saltmarsh-grass, sea purslane, reeds, and spider orchids.
    wildlife: >-
      Bird migration commands the calendar. Situated along a primary East Atlantic flyway, roughly 500,000
      birds transit each year en route to Iberian and African wintering grounds, with more than 330 species
      documented. The bay is premier habitat for coastal waterbirds, including the [black-tailed
      godwit](/especie/limosa_limosa/), dunlin, [pied avocet](/especie/recurvirostra_avosetta/), [common
      shelduck](/especie/tadorna_tadorna/), and northern pintail.


      Winter brings extraordinary avian gatherings across salt meadows and mudflats. In late winter, looking
      out across the mizottes from the sea dyke reveals departing flocks of geese and ducks before their
      northward journey, alongside thousands of feeding shorebirds, while the Saint-Michel observatory offers
      spectacular twilight views of roosting [common cranes](/especie/grus_grus/) and wintering wildfowl.
      Monthly wetland censuses track populations across the bay and polders.


      Inland, the communal marshes form immense winter floodplains favored by breeding garganey and northern
      lapwings when water tables permit. The quiet expanse of drained marshlands attracts wintering
      short-eared owls and water rails.
    visit: >-
      Because the intertidal bay is vast and fragile, the nature reserve has established interpretive thematic
      boards at peripheral access gates and distributes guides to premier viewing sites. Visitors are welcome
      on foot and bicycle, except strictly off-trail on the vulnerable Pointe de l'Aiguillon.


      Reserve viewing hides are designed for walking and cycling approaches, allowing close-up views without
      disturbing flocks. Observation is best in early morning or late afternoon, avoiding shimmering midday
      heat haze. The regional park also schedules guided ornithological walks with expert naturalists.
    history: >-
      The earliest dykes reclaiming agricultural land from the marshes date back to the late tenth century,
      constructed by medieval monastic abbeys. Beginning in 1992, rural development restored traditional
      quays, slipways, and canal networks while creating walking paths and timber footbridges across marshes
      previously navigable solely by water. Heavy agricultural drainage in the nineteen-sixties unfortunately
      altered parts of the wet marsh along the Vendée river between Le Gué-de-Velluire and Île-d'Elle.


      Today the bay is protected by two national nature reserves co-managed by the OFB and LPO. Between 2016
      and 2020, a LIFE conservation project coordinated by the regional park restored littoral habitats; in
      2019, obsolete oyster racks overgrown by invasive Pacific oysters were cleared to rehabilitate tidal
      mudflats near the Pointe de l'Aiguillon. Other notable inland reserves include Saint-Denis-du-Payré and
      Belle-Henriette.
    before: >-
      Regulations within the nature reserve strictly prohibit dogs, camping, open fires, motorized vehicles,
      and low-altitude overflights below 300 m, including recreational drones and kites. Wildlife hides lie
      inside protected sanctuaries with regulated opening hours: verify access conditions before setting out.
    around: >-
      Far across Europe, the site shares coastal wetland dynamics and species like the common shelduck and
      otter with [Słowiński National Park](/lugar/slowinski-park-narodowy/), the [Venice
      Lagoon](/lugar/laguna-di-venezia/), and the Wadden Sea national parks of [Lower
      Saxony](/lugar/nationalpark-niedersachsisches-wattenmeer/) and
      [Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).
  fr:
    intro: >-
      Avant d'être marais, ce lieu fut océan. Le golfe des Pictons s'est comblé de sédiments marins et l'homme
      fit le reste : digues, fossés et canaux. Ce qui subsiste forme le Marais poitevin, qui avec la baie de
      l'Aiguillon — relique de cet ancien golfe — couvre environ 110 000 hectares, constituant la deuxième
      zone humide de France après la Camargue. Cet itinéraire se consacre à sa frange occidentale, la plus
      ouverte sur l'océan : la baie, les marais communaux et le marais desséché, à l'écart des barques de la
      Venise verte qui anime la partie orientale du marais mouillé.
    landscape: >-
      Le Marais poitevin se comprend par sa dynamique hydraulique. Il s'articule en trois ensembles
      fonctionnels : le marais maritime, le desséché et le mouillé. La plaine laissée par l'océan oscille
      entre zéro et huit mètres d'altitude, dont la moitié sous la barre des deux mètres. Un chevelu de
      milliers de kilomètres de canaux et fossés, ombragé par des millions de frênes et de peupliers plantés
      pour consolider les berges, régule les contrastes saisonniers entre crues hivernales et sécheresses
      estivales.


      Sur le littoral, la baie de l'Aiguillon associe plages de sable, dunes, pinèdes côtières, falaises
      mortes et estrans vaseux. Chaque marée descendante dévoile d'immenses slikkes nourricières ; lors des
      vives-eaux, l'Atlantique vient lécher les digues protégeant les polders et submerge les mizottes, ces
      prés salés du schorre pâturés ou fauchés. La réserve naturelle nationale de la baie, vaste de 4 900
      hectares, englobe l'estuaire de la Sèvre niortaise ; parmi ses 110 espèces végétales figurent la
      salicorne, la puccinellie maritime, l'obione, le roseau et l'ophrys araignée.
    wildlife: >-
      L'avifaune rythme le calendrier. Situé sur un axe migratoire majeur, le Marais poitevin voit passer
      chaque année près de 500 000 oiseaux vers la péninsule Ibérique et l'Afrique, avec plus de 330 espèces
      répertoriées. La baie constitue le sanctuaire des laro-limicoles, à l'image de la [barge à queue
      noire](/especie/limosa_limosa/), du bécasseau variable, de l'[avocette
      élégante](/especie/recurvirostra_avosetta/), du [tadorne de Belon](/especie/tadorna_tadorna/) et du
      canard pilet.


      L'hiver rassemble une diversité d'oiseaux exceptionnelle sur les mizottes et les vasières. En fin
      d'hivernage s'observent depuis les digues les derniers rassemblements d'oies et de canards avant leur
      envol vers le grand Nord, tandis que l'observatoire de Saint-Michel offre le spectacle crépusculaire du
      retour des [grues cendrées](/especie/grus_grus/) et des hivernants. Des comptages mensuels évaluent les
      effectifs.


      À l'intérieur des terres, les marais communaux forment de grands prés inondables au printemps où nichent
      sarcelle d'été et vanneau huppé. Les grands espaces calmes du marais desséché attirent le hibou des
      marais et le râle d'eau.
    visit: >-
      La baie étant vaste et d'accès délicat, la réserve naturelle a implanté des panneaux thématiques à
      chaque porte d'entrée et édite des cartes des meilleurs points de vue. Le public y accède librement,
      hormis les secteurs sensibles interdits hors sentiers balisés à la pointe de l'Aiguillon.


      Les observatoires sont pensés pour une approche douce à pied ou à vélo afin de contempler les oiseaux
      sans les effaroucher. Les créneaux matinaux ou vespéraux sont recommandés pour éviter les brumes de
      chaleur. Le parc naturel régional organise également des sorties ornithologiques accompagnées.
    history: >-
      Les premières digues destinées à assécher le marais furent érigées dès la fin du Xe siècle sous
      l'impulsion des abbayes médiévales. À partir de 1992, la restauration des cales, écluses et canaux et
      l'aménagement de passerelles ont rouvert aux piétons des marais jadis accessibles uniquement en barque.
      Les grands remembrements des années soixante ont en revanche altéré certaines portions du marais mouillé
      le long de la Vendée entre Le Gué-de-Velluire et l'île d'Elle.


      Aujourd'hui la baie est protégée par deux réserves naturelles nationales cogérées par l'OFB et la LPO.
      Entre 2016 et 2020, un programme LIFE coordonné par le parc a œuvré à restaurer ses habitats côtiers ;
      en 2019, d'anciennes concessions ostréicoles envahies d'huîtres creuses japonaises ont été démantelées
      pour réhabiliter la vasière de la pointe de l'Aiguillon. D'autres réserves jalonnent le marais, comme
      Saint-Denis-du-Payré et la Belle-Henriette.
    before: >-
      Sont rigoureusement interdits dans la réserve les chiens, le camping, les feux, les véhicules à moteur
      et le survol à moins de 300 m, y compris les drones et cerfs-volants. Les observatoires sont implantés
      au cœur de zones protégées soumises à réglementation : renseignez-vous au préalable.
    around: >-
      Ce littoral partage le tadorne de Belon et la loutre avec des sites emblématiques comme le [parc
      national de Słowiński](/lugar/slowinski-park-narodowy/), la [lagune de
      Venise](/lugar/laguna-di-venezia/), ainsi que les parcs de la mer des Wadden de
      [Basse-Saxe](/lugar/nationalpark-niedersachsisches-wattenmeer/) et du
      [Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).
  de:
    intro: >-
      Bevor es Moor wurde, war hier offener Ozean. Der Golf der Piktonen verlandete allmählich durch
      Meeressedimente, und der Mensch vollendete das Werk: Deiche, Gräben und Kanäle. Was blieb, ist das
      Marais Poitevin, das zusammen mit der Bucht von Aiguillon rund 110.000 Hektar einnimmt und nach der
      Camargue das zweitgrößte Feuchtgebiet Frankreichs bildet. Diese Route widmet sich dem wilden westlichen
      Sektor: der Bucht, den Gemeindeweiden und den entwässerten Poldern, fernab des Kahnverkehrs der
      östlichen Venise verte.
    landscape: >-
      Das Marais Poitevin erklärt sich aus seiner Wasserwirtschaft. Es gliedert sich in drei zusammenhängende
      Zonen: das maritime Wattgebiet, die entwässerten Polder (Marais desséché) und das nasse Feuchtgebiet
      (Marais mouillé). Die vom Meer hinterlassene Ebene liegt zwischen null und acht Metern Meereshöhe, die
      Hälfte davon unter zwei Metern. Tausende Kilometer Gräben und Kanäle sowie Millionen gepflanzter Eschen
      und Pappeln puffern Wasserstandsschwankungen zwischen winterlichen Fluten und sommerlicher Trockenheit
      ab.


      An der Küste vereint die Bucht von Aiguillon Sandstrände, Dünen, Küstenwälder, Kliffs und weite
      Wattflächen. Jede Ebbe legt nahrungsreiche Schlickflächen frei; bei Springfluten brandet der Atlantik an
      die Deiche und überflutet die Mizottes, jene Salzwiesen, die extensiv beweidet oder zur Heugewinnung
      genutzt werden. Das 4.900 Hektar große Naturschutzgebiet umfasst das Mündungsgebiet der Sèvre Niortaise;
      unter seinen 110 Pflanzenarten finden sich Queller, Andelgras, Keilmelde, Schilf und Spinnen-Ragwurz.
    wildlife: >-
      Die Vogelwelt prägt den Rhythmus. Auf einer zentralen Ostatlantik-Zugroute rasten jährlich rund 500.000
      Vögel auf dem Weg nach Süden, wobei über 330 Arten nachgewiesen wurden. Die Bucht ist ein Paradies für
      Wat- und Wasservögel wie [Uferschnepfe](/especie/limosa_limosa/), Alpenstrandläufer,
      [Säbelschnäbler](/especie/recurvirostra_avosetta/), [Brandgans](/especie/tadorna_tadorna/) und
      Spießente.


      Im Winter versammeln sich auf den Salzwiesen und Schlickbänken unzählige Vögel. Gegen Winterende lassen
      sich vom Deich aus die letzten Gänse- und Entenschwärme vor ihrem Abflug nach Norden beobachten, während
      die Hütte von Saint-Michel den abendlichen Einflug der [Kraniche](/especie/grus_grus/) und Wasservögel
      erschließt. Monatliche Zählungen erfassen die Rastbestände.


      Im Binnenland bilden die Gemeindeweiden weite Überschwemmungsflächen für Knäkente und Kiebitz. Die Ruhe
      der Polderlandschaften zieht Sumpfohreulen und Wasserrallen an.
    visit: >-
      Da die Bucht weitläufig und sensibel ist, informieren Schautafeln an den Zugängen und Faltblätter weisen
      den Weg zu Aussichtspunkten. Das Begehen ist frei, abseits markierter Pfade an der Pointe de l'Aiguillon
      jedoch streng untersagt.


      Beobachtungshütten sind für Wanderer und Radfahrer konzipiert und erlauben störungsfreie Einblicke.
      Frühmorgens oder abends ist die Sicht am klarsten, da mittags Hitzeflimmern auftritt. Der Regionalpark
      bietet geführte vogelkundliche Exkursionen an.
    history: >-
      Die ersten Deichbauten zur Landgewinnung begannen Ende des zehnten Jahrhunderts durch Mönchsorden. Ab
      1992 wurden historische Anlegestellen, Schleusen und Kanäle saniert und Wanderstege errichtet, um das
      einst nur per Boot passierbare Moor zu erschließen. Flurbereinigungen der sechziger Jahre führten
      allerdings zu Verlusten im Feuchtgebiet entlang der Vendée zwischen Le Gué-de-Velluire und Île-d'Elle.


      Heute steht die Bucht unter dem Schutz zweier nationaler Naturreservate, betreut von OFB und LPO.
      Zwischen 2016 und 2020 förderte ein LIFE-Projekt den Küstenschutz; 2019 wurden verfallene Austernbänke
      beseitigt, um Schlickflächen an der Pointe de l'Aiguillon wiederherzustellen. Weitere Schutzgebiete sind
      Saint-Denis-du-Payré und Belle-Henriette.
    before: >-
      Im Naturschutzgebiet sind Hunde, Camping, offenes Feuer, Kraftfahrzeuge sowie Überflüge unter 300 m
      (einschließlich Drohnen und Drachen) verboten. Beobachtungshütten liegen in Kernzonen mit Zugangsregeln:
      Informiere dich vorab.
    around: >-
      Der Park teilt Brandgans und Fischotter mit weit entfernten Küstengebieten wie dem
      [Słowiński-Nationalpark](/lugar/slowinski-park-narodowy/), der [Lagune von
      Venedig](/lugar/laguna-di-venezia/) sowie den Wattenmeer-Nationalparks in
      [Niedersachsen](/lugar/nationalpark-niedersachsisches-wattenmeer/) und
      [Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).
  it:
    intro: >-
      Prima di essere palude, questo territorio fu mare. L'antico Golfo dei Pictoni fu progressivamente
      colmato dai sedimenti marini e l'opera dell'uomo fece il resto: argini, fossati e canali di bonifica.
      Ciò che sopravvive costituisce il Marais Poitevin, che assieme alla baia dell'Aiguillon — relitto di
      quel golfo — copre circa 110.000 ettari, rappresentando la seconda zona umida di Francia dopo la
      Camargue. Questo percorso esplora il suo settore occidentale, aperto verso l'Atlantico: la baia
      litoranea, i pascoli comunali e le terre bonificate, lontano dalle imbarcazioni della Venise verte.
    landscape: >-
      Il Marais Poitevin si fonda sul governo idraulico delle acque. Si articola in tre comprensori
      funzionali: il comprensorio marittimo, le terre bonificate asciutte e le paludi umide allagate. La piana
      lasciata dal mare si mantiene tra zero e otto metri di quota, con la metà del suolo al di sotto dei due
      metri. Migliaia di chilometri di canali e fossati, ombreggiati da milioni di frassini e pioppi piantati
      per consolidare le sponde, assorbono le oscillazioni stagionali tra le piene invernali e la siccità
      estiva.


      Lungo la costa, la baia dell'Aiguillon unisce spiagge sabbiose, dune, pinete litoranee, falesie fossili
      e sterminate piane di marea fangose. A ogni bassa marea emergono ampie distese di fango in cui gli
      uccelli si nutrono; durante le alte maree sizigiali l'oceano lambisce gli argini di protezione allagando
      le mizottes, i prati salsi superiori pascolati o sfalciati. La riserva naturale della baia, estesa su
      4.900 ettari, tutela la foce della Sèvre Niortaise; tra le sue 110 specie vegetali compaiono salicornia,
      gramigna delle spiagge, obione, cannuccia di palude e fior di ragno.
    wildlife: >-
      L'avifauna scandisce il calendario naturale. Situato lungo un corridoio migratorio fondamentale, il
      Marais Poitevin vede transitare ogni anno circa 500.000 uccelli diretti verso le coste iberiche e
      africane, con oltre 330 specie censite. La baia è l'habitat ideale per i limicoli, come la [pittima
      reale](/especie/limosa_limosa/), il piovanello pancianera,
      l'[avocetta](/especie/recurvirostra_avosetta/), la [volpoca](/especie/tadorna_tadorna/) e il codone
      comune.


      In inverno la riserva ospita concentrazioni eccezionali di uccelli palustri sulle mizottes e sulle piane
      di fango. Verso fine inverno si osservano dall'argine le ultime partenze di oche e anatre verso il nord
      Europa, mentre il capanno di Saint-Michel regala la visione crepuscolare delle [gru
      cenerine](/especie/grus_grus/) e dei contingenti svernanti. Censimenti mensili monitorano le consistenze
      ornitiche.


      Verso l'interno, i pascoli comunali si trasformano in vaste praterie allagate dove nidificano la
      marzaiola e la pavoncella. La tranquillità delle terre bonificate richiama il gufo di palude e il
      porciglione.
    visit: >-
      Essendo la baia molto vasta e delicata, la riserva ha installato pannelli tematici presso i varchi
      d'accesso e distribuisce mappe dei migliori punti panoramici. La fruizione è libera, salvo il divieto di
      uscire dai tracciati segnalati sulla Pointe de l'Aiguillon.


      I capanni d'osservazione sono studiati per essere raggiunti a piedi o in bicicletta senza disturbare la
      fauna. I momenti più favorevoli coincidono con il primo mattino o il tramonto. Il parco naturale
      organizza visite ornitologiche guidate.
    history: >-
      I primi argini per strappare terreno agricolo alle paludi sorsero alla fine del X secolo per iniziativa
      dei monasteri medievali. A partire dal 1992 vennero restaurati approdi, chiuse e canali e furono
      allestiti sentieri e passerelle in un territorio storicamente accessibile solo in barca. Le imponenti
      bonifiche degli anni sessanta cancellarono tuttavia ampie porzioni di palude umida lungo il fiume Vendée
      tra Le Gué-de-Velluire e l'île d'Elle.


      Oggi la baia è protetta da due riserve naturali nazionali gestite congiuntamente da OFB e LPO. Tra il
      2016 e il 2020 un progetto LIFE del parco ha riqualificato gli habitat litoranei; nel 2019 sono stati
      rimossi vecchi impianti ostricoli invasi dall'ostrica giapponese per risanare i fanghi della Pointe de
      l'Aiguillon. Altre riserve includono Saint-Denis-du-Payré e Belle-Henriette.
    before: >-
      Nella riserva è severamente vietato introdurre cani, campeggiare, accendere fuochi, circolare con
      veicoli a motore e sorvolare l'area a meno di 300 m di quota, inclusi droni e aquiloni. I capanni
      ricadono in zone a tutela integrale: informati sugli orari prima di partire.
    around: >-
      Il sito condivide volpoche e lontre con aree umide costiere europee quali il [Parco nazionale
      Słowiński](/lugar/slowinski-park-narodowy/), la [Laguna di Venezia](/lugar/laguna-di-venezia/) e i
      parchi del Wattenmeer della [Bassa Sassonia](/lugar/nationalpark-niedersachsisches-wattenmeer/) e dello
      [Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).
  pt:
    intro: >-
      Antes de ser sapal, este território era mar aberto. O antigo Golfo dos Pictones foi sendo assoreado por
      sedimentos marinhos e a intervenção humana fez o resto: diques, valas e canais. O que resta constitui o
      Marais Poitevin, que juntamente com a baía de Aiguillon — testemunho desse antigo braço de mar — ocupa
      cerca de 110.000 hectares, constituindo a segunda maior zona húmida de França a seguir à Camarga. Este
      itinerário foca-se na sua fachada ocidental aberta ao Atlântico: a baía, os pastos comunais e o sapal
      drenado, longe das embarcações turísticas da Venise verte.
    landscape: >-
      O Marais Poitevin explica-se pela sua gestão hidráulica. Estrutura-se em três setores funcionais: o
      marítimo, o drenado e o alagado. A planície deixada pelo oceano situa-se entre zero e oito metros de
      altitude, com metade da área abaixo dos dois metros. Uma teia de milhares de quilómetros de valas e
      canais, ladeada por milhões de freixos e choupos plantados para suster as margens, amortece os
      contrastes sazonais entre as cheias de inverno e as secas de verão.


      No litoral, a baía de Aiguillon reúne areais, dunas, pinhais costeiros, arribas fósseis e lodaçais
      intertidais. Em cada maré vazia surgem vastas lamas ricas em invertebrados; nas marés vivas o mar
      alcança os diques que protegem os campos e submerge as mizottes, os sapais altos suavemente pastoreados
      ou ceifados. A reserva natural da baía, com 4.900 hectares, tutela o estuário do Sèvre Niortaise; entre
      as suas 110 espécies de plantas figuram a salicórnia, a erva-salgadeira, o caniço e a erva-aranha.
    wildlife: >-
      A avifauna comanda o calendário. Situado numa rota migratória de primeira ordem, cerca de 500.000 aves
      cruzam anualmente o Marais Poitevin rumo à Península Ibérica e África, com mais de 330 espécies
      catalogadas. A baía é o melhor local para avistar limícolas como o
      [maçarico-de-bico-direito](/especie/limosa_limosa/), o pilrito-comum, o
      [alfaiate](/especie/recurvirostra_avosetta/), o [pato-tadorno](/especie/tadorna_tadorna/) e o arrábio.


      No inverno a reserva acolhe concentrações extraordinárias nos sapais e lodaçais. No final da estação
      fria avistam-se a partir do dique os bandos de gansos e patos antes da partida para o norte, enquanto o
      abrigo de Saint-Michel descortina o crepúsculo povoado de [grous-comuns](/especie/grus_grus/) e
      invernantes. Censos mensais monitorizam as populações aquáticas.


      Para o interior, os prados comunais transformam-se em alagadiços onde nidificam a marrequinha e o abibe.
      A serenidade dos campos drenados atrai o bufo-pequeno e o frango-d'água.
    visit: >-
      Sendo a baía extensa e de acesso delicado, a reserva colocou painéis temáticos nas entradas e fornece
      mapas dos pontos de observação. O acesso pedestre e em bicicleta é livre, exceto fora dos trilhos
      balizados na Pointe de l'Aiguillon.


      Os abrigos ornitológicos foram concebidos para aproximações sem perturbar a fauna. A melhor luz ocorre
      pela manhã ou ao entardecer. O parque organiza visitas guiadas temáticas com ornitólogos credenciados.
    history: >-
      Os primeiros diques de drenagem remontam ao final do século X, promovidos por abadias medievais para
      rentabilizar as terras. A partir de 1992 foram recuperados cais, comportas e canais, abrindo-se
      passadiços em zonas antes apenas acessíveis em barcaça. O emparcelamento dos anos sessenta destruiu
      contudo manchas de sapal húmido no rio Vendée entre Le Gué-de-Velluire e Île-d'Elle.


      Hoje a baía beneficia de duas reservas naturais nacionais geridas em parceria pela OFB e LPO. Entre 2016
      e 2020 um projeto LIFE reabilitou biótopos costeiros; em 2019 desmantelaram-se antigas armações de
      ostras japonesas invasoras para recuperar o lodaçal da Pointe de l'Aiguillon. Outras reservas incluem
      Saint-Denis-du-Payré e Belle-Henriette.
    before: >-
      Na reserva é proibido passear cães, acampar, fazer fogo, conduzir veículos motorizados e sobrevoar a
      menos de 300 m de altitude, incluindo drones e papagaios. Os observatórios situam-se em zonas protegidas
      com horários: informa-te antes da deslocação.
    around: >-
      Este litoral partilha patos-tadornos e lontras com áreas húmidas europeias como o [Parque Nacional de
      Słowiński](/lugar/slowinski-park-narodowy/), a [Laguna de Veneza](/lugar/laguna-di-venezia/) e os
      parques do Mar de Wadden da [Baixa Saxónia](/lugar/nationalpark-niedersachsisches-wattenmeer/) e de
      [Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).
