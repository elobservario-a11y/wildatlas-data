observaciones:
  es: >-
    Fumar y hacer fuego están prohibidos en el bosque en cualquier época del año, y los senderos estrechos
    están reservados para caminantes. Con tormenta, viento fuerte, lluvia intensa o nieve no hay que entrar en
    el bosque, por la caída de ramas y árboles. La carretera del Peterskopf está cerrada por obras y hay
    desvíos señalizados para las rutas afectadas. Consulta el mapa de recorridos antes de salir. A lo largo de
    los caminos hay postes de madera con un número que indica la posición exacta a los servicios de rescate,
    en el teléfono 112.
texto:
  es:
    intro: >-
      Hay bosques que sobreviven y bosques que vuelven. El de Kellerwald-Edersee es de los segundos, y todavía
      está en ello. Alrededor del lago Edersee, en el norte de Hesse, las Ederberge son más de cincuenta
      montes ondulados y casi enteramente cubiertos de bosque, y en ellos las hayas muy viejas conviven con
      una promesa: dejar que la naturaleza sea naturaleza, para que el bosque desarrolle estructuras cada vez
      más maduras. Mientras tanto, el parque guarda ya los restos de bosque virgen que quedaban, y por eso una
      parte de sus hayedos es Patrimonio Mundial de la UNESCO.
    landscape: >-
      La historia del bosque empieza con el hielo. El haya entró en Europa central en el óptimo climático
      posglaciar y se extendió a costa del olmo y del tilo. Por eso la comunidad característica del parque es
      el hayedo acidófilo, el que crece en suelos ácidos y pobres.


      Hay laderas de otra manera. Las del Edersee guardan roquedos silíceos con un clavel, la Pfingstnelke,
      muy amenazado en Europa; y en los valles hay praderas y antiguos pastos, los Driesche, que suman más de
      200 ha y donde crece la árnica. Más de mil manantiales y arroyos naturales, junto a laderas rocosas y
      canchales, completan el mosaico. En total, hay más de 600 especies de plantas vasculares.


      El rincón más antiguo está en la Wooghölle, la ladera norte que cae hacia el Edersee. Hasta donde llegan
      los registros, no tuvo aprovechamiento humano y siempre estuvo cubierta de bosque; conserva unas 10
      hectáreas consideradas un resto de bosque primario. El resto va madurando: más del 20 % de los hayedos
      del parque tiene ya más de 160 años (cifra de 2009), y la recuperación de las estructuras de un bosque
      maduro se desarrolla a lo largo de varias generaciones de árboles.
    wildlife: >-
      Uno de sus habitantes más discretos es el [gato montés](/especie/felis_silvestris/). En 2007 se confirmó
      su presencia en una región donde se le creía extinguido desde hacía 60 años, y hoy el parque estudia su
      regreso con seguimiento y análisis genético. Los grandes herbívoros son el [ciervo
      rojo](/especie/cervus_elaphus/), el [corzo](/especie/capreolus_capreolus/) y el
      [jabalí](/especie/sus_scrofa/); el muflón y el gamo se soltaron en 1935. En total hay 44 especies de
      mamíferos.


      En las aves, el parque tiene 75 especies nidificantes. La mayor es la [cigüeña
      negra](/especie/ciconia_nigra/), y el [búho real](/especie/bubo_bubo/) cría en los roquedos. Seis de las
      siete especies de pájaros carpinteros de Europa central viven aquí, y desde 1989 cría el cuervo.


      Entre los mamíferos nocturnos viven en el parque 15 de las 24 especies de murciélagos de Alemania, entre
      ellas el [murciélago de Bechstein](/especie/myotis_bechsteinii/) y el [ratonero
      grande](/especie/myotis_myotis/). En la madera vieja y muerta viven escarabajos, con siete reliquias de
      bosque primario, entre ellas el eremita.
    visit: >-
      Empieza por el NationalparkZentrum Kellerwald, el centro principal, en el oeste del parque, en
      Vöhl-Herzhausen, junto al Edersee. Allí hay exposición y actividades, y el terreno exterior se deja a su
      aire para observar cómo se suceden las comunidades de plantas.


      Para caminar tienes más de 25 rutas circulares bien señalizadas, que se pueden combinar en recorridos
      largos. Los circuitos desde los aparcamientos miden en general unos diez kilómetros y llevan nombres de
      animales o plantas, como el Fledermausweg y el Ebereschenweg. Quien busque más aventura tiene el
      Urwaldsteig Edersee, que rodea el lago por unos 66 km: se puede hacer entero en ocho etapas o en tres
      días. Va a menudo por sendas estrechas y a veces es muy empinado, y permite conocer las laderas boscosas
      del Edersee. El Hagenstein, conocido como la Loreley del valle del Eder, es otro de los roquedos del
      parque. Por el parque pasa también el Kellerwaldsteig, de 164 km, una ruta regional que atraviesa el
      parque natural y pasa también por el parque nacional. Si prefieres compañía, el parque organiza
      caminatas guiadas por el Urwaldsteig Edersee y la ruta Hagenstein.


      Además de las rutas regionales, el parque tiene su propia red de caminos para bicicleta, marcados con un
      símbolo de bici. Los senderos estrechos son solo para peatones; las bicis y los caballos van por la red
      señalizada.
    history: >-
      La gente intentó ganar terreno al bosque, pero aquí no duró: las aldeas de las Ederberge, de suelos
      pobres, estaban abandonadas en 1470 como muy tarde. Hacia 1800 empezaron las repoblaciones sistemáticas
      y, a diferencia de otras regiones, se hicieron sobre todo con haya y casi sin coníferas. En pleno bosque
      quedan las ruinas de la Quernstkirche, probablemente levantada en los siglos XI o XII y citada por
      primera vez en 1236.


      El parque nacional se fundó el 1 de enero de 2004. El 10 de marzo de 2011 fue el primer espacio
      protegido grande de Alemania certificado en la categoría II de la UICN, y el 25 de junio de 2011 los
      hayedos viejos y los restos de bosque primario entraron en el Patrimonio Mundial. Tras la ampliación de
      2020 el parque, en tres superficies separadas, suma 76,88 km². Desde 2016 se eliminan los monocultivos
      de abeto Douglas y de pícea, que no son naturales aquí.
    before: >-
      Fumar y hacer fuego están prohibidos en el bosque en cualquier época del año, y los senderos estrechos
      están reservados para caminantes. Con tormenta, viento fuerte, lluvia intensa o nieve no hay que entrar
      en el bosque, por la caída de ramas y árboles. La carretera del Peterskopf está cerrada por obras y hay
      desvíos señalizados para las rutas afectadas. Consulta el mapa de recorridos antes de salir. A lo largo
      de los caminos hay postes de madera con un número que indica la posición exacta a los servicios de
      rescate, en el teléfono 112.
  en:
    intro: >-
      Some forests survive, and some forests return. The one at Kellerwald-Edersee belongs to the second kind,
      and is still in the middle of that journey. Around Lake Edersee, in northern Hesse, the Ederberge
      comprise over fifty rolling hills almost entirely blanketed in woodland. Here, very old beech trees
      coexist with a promise: to let nature be nature, allowing the forest to develop increasingly mature
      structures. Meanwhile, the park already protects what virgin woodland remnants remained, which is why a
      section of its beech forests is a UNESCO World Heritage site.
    landscape: >-
      The history of this forest begins with the ice. The beech entered Central Europe during the postglacial
      climatic optimum, expanding at the expense of elm and lime. Because of this, the park's characteristic
      community is the acidophilous beech forest, thriving on acidic, nutrient-poor soils.


      Other slopes tell different stories. Those flanking the Edersee harbour siliceous rock faces hosting the
      Cheddar pink, the Pfingstnelke, highly endangered in Europe; along the valleys lie meadows and ancient
      pastures, the Driesche, covering over 200 ha where arnica flourishes. More than one thousand natural
      springs and streams, together with rocky escarpments and scree slopes, complete this mosaic. In total,
      there are more than 600 species of vascular plants.


      The most ancient pocket lies in the Wooghölle, the northern slope descending toward the Edersee. As far
      as historical records reach, it never experienced human exploitation and remained continuously forested;
      it preserves about 10 hectares regarded as a remnant of primary forest. The rest continues to mature:
      more than 20% of the park's beech forests are already over 160 years old (2009 figure), and the recovery
      of old-growth structures unfolds across multiple tree generations.
    wildlife: >-
      Among its most secretive inhabitants is the [European wildcat](/especie/felis_silvestris/). In 2007 its
      presence was confirmed in a region where it had been presumed extinct for 60 years, and today the park
      monitors its return through tracking and genetic analysis. Large herbivores include [red
      deer](/especie/cervus_elaphus/), [roe deer](/especie/capreolus_capreolus/) and [wild
      boar](/especie/sus_scrofa/); mouflon and fallow deer were released in 1935. In total, 44 mammal species
      occur here.


      Among birds, the park records 75 breeding species. The largest is the [black
      stork](/especie/ciconia_nigra/), while the [Eurasian eagle-owl](/especie/bubo_bubo/) nests on the
      cliffs. Six of Central Europe's seven woodpecker species live here, and since 1989 the raven has nested
      again.


      Among nocturnal mammals, 15 of Germany's 24 bat species inhabit the park, including [Bechstein's
      bat](/especie/myotis_bechsteinii/) and the [greater mouse-eared bat](/especie/myotis_myotis/). Old and
      decaying timber supports saproxylic beetles, including seven primeval-forest relicts such as the hermit
      beetle.
    visit: >-
      Begin at the NationalparkZentrum Kellerwald, the main visitor centre in the west of the park at
      Vöhl-Herzhausen, beside the Edersee. It offers an exhibition and activities, while the outdoor grounds
      are left unmanaged to illustrate plant community succession.


      For hiking, you have more than 25 well-marked circular trails that can be linked into longer outings.
      Loops starting from car parks typically measure around ten kilometres and bear animal or plant names,
      such as the Fledermausweg and the Ebereschenweg. Those seeking greater adventure can tackle the
      Urwaldsteig Edersee, encircling the lake for some 66 km: it can be completed entirely across eight
      stages or within three days. It often follows narrow, steep paths, offering intimate encounters with the
      forested slopes of the Edersee. The Hagenstein, known as the Loreley of the Eder Valley, is another
      prominent rocky outcrop. The 164 km Kellerwaldsteig, a regional trail crossing the nature park and
      national park, also passes through here. If you prefer company, the park organizes guided walks along
      the Urwaldsteig Edersee and the Hagenstein route.


      Alongside regional trails, the park maintains its own cycling network marked with a bicycle symbol.
      Narrow footpaths are strictly reserved for walkers; bicycles and horse riders must keep to designated
      tracks.
    history: >-
      Settlers once attempted to claim land from the forest, but it did not last: hamlets across the
      nutrient-poor Ederberge were abandoned by 1470 at the latest. Systematic reforestation began around 1800
      and, unlike elsewhere, relied predominantly on beech with almost no conifers. In the heart of the forest
      stand the ruins of the Quernstkirche, probably erected in the eleventh or twelfth century and first
      documented in 1236.


      The national park was established on 1 January 2004. On 10 March 2011 it became Germany's first large
      protected area certified under IUCN Category II, and on 25 June 2011 its ancient beechwoods and primary
      forest remnants were inscribed onto the World Heritage list. Following the 2020 expansion across three
      separate parcels, the park encompasses 76.88 km². Since 2016, non-native Douglas fir and Norway spruce
      monocultures are being systematically removed.
    before: >-
      Smoking and lighting fires are prohibited throughout the year, and narrow footpaths are reserved
      exclusively for hikers. Do not enter the woodland during storms, high winds, heavy rain or snowfall due
      to falling branches and trees. The Peterskopf road is closed for roadworks, with signed diversions in
      place for affected routes. Check trail maps before setting out. Wooden marker posts along trails display
      location numbers to assist emergency services via telephone 112.
  fr:
    intro: >-
      Il y a des forêts qui survivent et des forêts qui reviennent. Celle de Kellerwald-Edersee appartient à
      la seconde catégorie, et son chemin se poursuit. Autour du lac Edersee, dans le nord de la Hesse, les
      Ederberge forment plus de cinquante collines ondulées presque entièrement boisées, où de très vieux
      hêtres coexistent avec une promesse : laisser la nature suivre son cours, afin que la forêt développe
      des structures toujours plus mûres. Entre-temps, le parc abrite les derniers lambeaux de forêt vierge
      qui subsistaient, raison pour laquelle une partie de ses hêtraies est inscrite au patrimoine mondial de
      l'UNESCO.
    landscape: >-
      L'histoire de cette forêt débute avec les glaces. Le hêtre a pénétré en Europe centrale lors de
      l'optimum climatique postglaciaire et a progressé aux dépens de l'orme et du tilleul. C'est pourquoi la
      communauté végétale emblématique du parc est la hêtraie acidophile, qui prospère sur des sols acides et
      pauvres.


      D'autres versants révèlent des visages différents. Ceux de l'Edersee abritent des parois rocheuses
      siliceuses où pousse l'œillet bleuâtre, la Pfingstnelke, très menacée en Europe ; au creux des vallées
      s'étendent des prairies et d'anciens pâturages, les Driesche, qui totalisent plus de 200 ha et où
      fleurit l'arnica. Plus d'un millier de sources et de ruisseaux naturels, associés à des escarpements
      rocheux et des éboulis, complètent cette mosaïque. Au total, on compte plus de 600 espèces de plantes
      vasculaires.


      Le recoin le plus vénérable se niche à la Wooghölle, sur le versant nord plongeant vers l'Edersee. Selon
      les archives disponibles, il n'a jamais connu d'exploitation humaine et est toujours demeuré boisé ; il
      conserve environ 10 hectares considérés comme un vestige de forêt primaire. Le reste poursuit sa
      maturation : plus de 20 % des hêtraies du parc ont déjà dépassé 160 ans (chiffre de 2009), et la
      restauration des structures d'une forêt ancienne s'échelonne sur plusieurs générations d'arbres.
    wildlife: >-
      Parmi ses hôtes les plus discrets figure le [chat sauvage](/especie/felis_silvestris/). En 2007 sa
      présence a été confirmée dans une région où on le croyait disparu depuis 60 ans, et le parc étudie
      aujourd'hui son retour par suivi de terrain et analyses génétiques. Les grands herbivores rassemblent le
      [cerf élaphe](/especie/cervus_elaphus/), le [chevreuil](/especie/capreolus_capreolus/) et le
      [sanglier](/especie/sus_scrofa/) ; le mouflon et le daim y ont été introduits en 1935. Au total, 44
      espèces de mammifères peuplent les lieux.


      Du côté des oiseaux, le parc compte 75 espèces nicheuses. La plus grande est la [cigogne
      noire](/especie/ciconia_nigra/), tandis que le [hibou grand-duc](/especie/bubo_bubo/) niche dans les
      falaises. Six des sept espèces de pics d'Europe centrale vivent ici, et depuis 1989 le grand corbeau y
      niche à nouveau.


      Parmi les mammifères nocturnes, le parc abrite 15 des 24 espèces de chauves-souris d'Allemagne, parmi
      lesquelles le [murin de Bechstein](/especie/myotis_bechsteinii/) et le [grand
      murin](/especie/myotis_myotis/). Le bois mort et sénescent nourrit des coléoptères saproxyliques, dont
      sept reliques de forêt primaire comme le pique-prune.
    visit: >-
      Commencez par le NationalparkZentrum Kellerwald, le centre principal situé à l'ouest du parc, à
      Vöhl-Herzhausen, au bord de l'Edersee. Il propose une exposition interactive et des activités, tandis
      que l'espace extérieur évolue librement pour illustrer les successions végétales.


      Pour marcher, vous disposez de plus de 25 circuits balisés, combinables en itinéraires plus vastes. Les
      boucles au départ des parkings mesurent généralement une dizaine de kilomètres et portent des noms de
      faune ou de flore, comme le Fledermausweg et l'Ebereschenweg. Les randonneurs en quête d'aventure
      s'orienteront vers l'Urwaldsteig Edersee, qui fait le tour du lac sur environ 66 km : on peut le
      parcourir intégralement en huit étapes ou en trois jours. Il emprunte souvent des sentes étroites et
      parfois très raides, permettant d'arpenter les pentes sauvages de l'Edersee. Le Hagenstein, surnommé la
      Loreley de la vallée de l'Eder, constitue un autre belvédère rocheux remarquable. Le Kellerwaldsteig,
      sentier régional de 164 km qui traverse à la fois le parc naturel et le parc national, passe également
      par ici. Si vous préférez être guidés, le parc organise des sorties accompagnées sur l'Urwaldsteig
      Edersee et vers le Hagenstein.


      En plus des itinéraires régionaux, le parc possède son propre réseau cyclable, signalé par un
      pictogramme de vélo. Les sentes étroites sont strictement réservées aux piétons ; vélos et cavaliers
      doivent emprunter les voies balisées à leur intention.
    history: >-
      Les hommes tentèrent jadis de défricher la forêt, mais l'aventure tourna court : les hameaux des
      Ederberge, aux sols ingrats, étaient désertés en 1470 au plus tard. Vers 1800 débutèrent des
      reboisements méthodiques qui, fait remarquable pour l'époque, privilégièrent le hêtre sans presque
      recourir aux résineux. Au cœur des bois subsistent les ruines de la Quernstkirche, sans doute édifiée
      aux XIe ou XIIe siècles et mentionnée pour la première fois en 1236.


      Le parc national a été créé le 1 janvier 2004. Le 10 mars 2011, il est devenu le premier grand espace
      protégé d'Allemagne certifié en catégorie II de l'UICN, et le 25 juin 2011 ses hêtraies anciennes et
      lambeaux de forêt primaire ont intégré le patrimoine mondial. Depuis l'agrandissement de 2020, le parc
      réunit 76,88 km² répartis en trois secteurs. Depuis 2016, les peuplements artificiels de douglas et
      d'épicéa commun sont systématiquement supprimés.
    before: >-
      Fumer et allumer des feux sont formellement interdits en forêt toute l'année, et les sentiers étroits
      sont réservés aux marcheurs. En cas d'orage, de vent violent, de fortes pluies ou de neige, n'entrez pas
      dans le sous-bois en raison des chutes de branches et d'arbres. La route du Peterskopf est fermée pour
      travaux et des déviations balisent les itinéraires concernés. Consultez la carte des sentiers avant de
      partir. Le long des pistes, des poteaux en bois portent un numéro pour transmettre votre localisation
      précise aux secours via le 112.
  de:
    intro: >-
      Es gibt Wälder, die überleben, und Wälder, die zurückkehren. Der Kellerwald-Edersee gehört zur zweiten
      Kategorie und befindet sich mitten in diesem Prozess. Rund um den Edersee in Nordhessen erheben sich die
      Ederberge mit mehr als fünfzig sanften, fast lückenlos bewaldeten Bergen. Hier treffen uralte Buchen auf
      ein klares Versprechen: Natur Natur sein lassen, damit der Wald immer reifere Strukturen ausbilden kann.
      Zugleich bewahrt der Nationalpark jene Urwaldreste, die bis heute überdauert haben – deshalb zählt ein
      Teil seiner Buchenwälder zum UNESCO-Weltnaturerbe.
    landscape: >-
      Die Geschichte dieses Waldes beginnt mit dem Eis. Nach der letzten Kaltzeit wanderte die Rotbuche im
      postglazialen Klimaoptimum nach Mitteleuropa ein und verdrängte Ulmen und Linden. Daher prägt der
      bodensaure Hainsimsen-Buchenwald auf basenarmen Schieferböden das Gesicht des Parks.


      Andere Hänge zeigen ganz eigene Züge. Die Steilhänge am Edersee bergen Silikatfelsen mit der
      Pfingstnelke, die europaweit stark gefährdet ist; in den Tälern liegen Wiesen und historische Hutungen,
      die Driesche, die über 200 ha umfassen und auf denen die Berg-Wohlverleih (Arnika) blüht. Mehr als
      tausend natürliche Quellen und Bäche bilden zusammen mit Blockhalden und Felsköpfen ein artenreiches
      Mosaik. Insgesamt wachsen hier über 600 Farn- und Blütenpflanzenarten.


      Der urigsten Winkel liegt in der Wooghölle am Nordhang zum Edersee. Soweit Aufzeichnungen zurückreichen,
      fand hier nie forstliche Nutzung statt; das Areal war stets Wald und bewahrt rund 10 Hektar eines echten
      Primärwaldrests. Der restliche Wald reift heran: Mehr als 20 % der Buchenbestände des Parks waren
      bereits 2009 über 160 Jahre alt, und die Wiedergewinnung urwaldartiger Strukturen vollzieht sich über
      mehrere Baumgenerationen.
    wildlife: >-
      Zu den heimlichsten Bewohnern zählt die [Wildkatze](/especie/felis_silvestris/). Im Jahr 2007 wurde ihr
      Vorkommen in einer Region bestätigt, in der sie 60 Jahre lang als verschollen galt; heute erforscht die
      Verwaltung ihre Rückkehr mit Fotofallen und Genanalysen. Die großen Pflanzenfresser sind
      [Rothirsch](/especie/cervus_elaphus/), [Reh](/especie/capreolus_capreolus/) und
      [Wildschwein](/especie/sus_scrofa/); Muffelwild und Damhirsche wurden 1935 ausgesetzt. Insgesamt leben
      44 Säugetierarten im Schutzgebiet.


      Die Vogelwelt umfasst 75 Brutvogelarten. Die stattlichste ist der
      [Schwarzstorch](/especie/ciconia_nigra/), während der [Uhu](/especie/bubo_bubo/) in den Felswänden
      horstet. Sechs der sieben mitteleuropäischen Spechtarten sind hier heimisch, und seit 1989 brütet auch
      der Kolkrabe wieder regelmäßig.


      Unter den nachtaktiven Säugetieren kommen 15 der 24 deutschen Fledermausarten vor, darunter die
      [Bechsteinfledermaus](/especie/myotis_bechsteinii/) und das [Große Mausohr](/especie/myotis_myotis/).
      Totholzreiche Althölzer bieten Lebensraum für seltene Urwaldreliktkäfer, allen voran den Eremiten.
    visit: >-
      Beginne deinen Besuch im NationalparkZentrum Kellerwald in Vöhl-Herzhausen am Westufer des Edersees. Es
      bietet interaktive Ausstellungen und Bildungsangebote, während das Außengelände der freien Sukzession
      überlassen bleibt.


      Zum Wandern stehen dir mehr als 25 gut markierte Rundwege offen, die sich zu ausgedehnten Touren
      verbinden lassen. Die Rundwanderwege ab den Wanderparkplätzen sind meist rund zehn Kilometer lang und
      tragen Tier- oder Pflanzensymbole, etwa der Fledermausweg oder der Ebereschenweg. Wer sportliche
      Herausforderungen sucht, wählt den Urwaldsteig Edersee, der den See auf rund 66 km umrundet: Er lässt
      sich in acht Etappen oder in drei Tagen erwandern. Er verläuft oft auf schmalen, teils steilen Pfaden
      durch die urigen Hangwälder. Der Hagenstein, auch Loreley des Edertals genannt, bildet einen weiteren
      markanten Aussichtsfelsen. Zudem quert der 164 km lange Kellerwaldsteig Natur- und Nationalpark.
      Geführte Touren über den Urwaldsteig und zum Hagenstein bietet das Nationalparkamt regelmäßig an.


      Neben den Regionalwegen besitzt der Park ein eigenes, mit Fahrradsymbolen beschildertes Radwegenetz.
      Schmale Steige sind Wanderern vorbehalten; Fahrräder und Reitpferde dürfen nur auf den ausgewiesenen
      Wegen verkehren.
    history: >-
      Frühere Siedler versuchten dem Wald Ackerland abzugewinnen, scheiterten jedoch an den kargen Böden: Die
      Dörfer der Ederberge fielen spätestens um 1470 wüst. Um 1800 begann eine planmäßige Wiederaufforstung,
      die im Gegensatz zu vielen Nachbarregionen fast ausschließlich auf die Buche setzte. Mitten im Wald
      stehen die Reste der Quernstkirche, die wohl im elften oder zwölften Jahrhundert errichtet und 1236
      erstmals urkundlich erwähnt wurde.


      Der Nationalpark wurde am 1. Januar 2004 gegründet. Am 10. März 2011 erhielt er als erstes
      Großschutzgebiet Deutschlands das IUCN-Zertifikat der Kategorie II, und am 25. Juni 2011 wurden seine
      alten Buchenwälder in das UNESCO-Weltnaturerbe aufgenommen. Seit der Erweiterung 2020 umfasst der Park
      auf drei Teilflächen 76,88 km². Seit 2016 werden nicht heimische Douglasien- und Fichtenforste
      schrittweise renaturiert.
    before: >-
      Rauchen und offenes Feuer sind im Wald ganzjährig verboten, und schmale Steige bleiben Fußgängern
      vorbehalten. Bei Sturm, Starkwind, Starkregen oder Schneelast solltest du den Wald wegen Astbruchs und
      umstürzender Bäume meiden. Die Peterskopfstraße ist wegen Bauarbeiten gesperrt; für betroffene Routen
      gibt es örtliche Umleitungen. Informiere dich vorab anhand der Wanderkarten. An den Wegen stehen
      Rettungspunkte aus Holz mit Standortnummern für den Notruf 112.
  it:
    intro: >-
      Ci sono foreste che sopravvivono e foreste che ritornano. Quella di Kellerwald-Edersee appartiene alle
      seconde, ed è ancora nel pieno di questo cammino. Attorno al lago Edersee, nel nord dell'Assia, le
      Ederberge contano più di cinquanta rilievi ondulati quasi interamente coperti di bosco, dove faggi
      vetusti convivono con una promessa: lasciare che la natura faccia il suo corso, affinché il bosco
      sviluppi strutture sempre più mature. Nel frattempo il parco protegge gli ultimi lembi di foresta
      vergine rimasti, motivo per cui una parte delle sue faggete è Patrimonio Mondiale dell'UNESCO.
    landscape: >-
      La storia di questa foresta comincia con il ghiaccio. Il faggio è giunto nell'Europa centrale durante
      l'optimum climatico postglaciale, espandendosi a scapito di olmi e tigli. Per questo la comunità
      caratteristica del parco è la faggeta acidofila, che cresce su suoli acidi e poveri di nutrienti.


      Altri versanti offrono scenari differenti. Quelli dell'Edersee custodiscono pareti silicee con il
      garofano Pfingstnelke, fortemente minacciato in Europa; nelle valli si aprono prati e antichi pascoli, i
      Driesche, che coprono oltre 200 ha e dove fiorisce l'arnica. Più di mille sorgenti e torrenti naturali,
      insieme a balze rocciose e pietraie, completano il mosaico. In totale si contano più di 600 specie di
      piante vascolari.


      L'angolo più antico si trova nella Wooghölle, il versante settentrionale che scende verso l'Edersee. Per
      quanto documentato, non ha mai subito sfruttamento antropico ed è sempre rimasto coperto da bosco;
      conserva circa 10 ettari considerati un relitto di foresta primaria. Il resto continua a maturare: più
      del 20% delle faggete del parco ha già più di 160 anni (dato del 2009), e il recupero delle strutture di
      una foresta matura si compie nell'arco di più generazioni arboree.
    wildlife: >-
      Tra i suoi abitanti più elusivi c'è il [gatto selvatico](/especie/felis_silvestris/). Nel 2007 la sua
      presenza è stata confermata in una regione in cui era ritenuto estinto da 60 anni, e oggi il parco ne
      monitora il ritorno tramite fototrappolaggio e indagini genetiche. I grandi erbivori comprendono il
      [cervo nobile](/especie/cervus_elaphus/), il [capriolo](/especie/capreolus_capreolus/) e il
      [cinghiale](/especie/sus_scrofa/); mufloni e daini furono introdotti nel 1935. In tutto vivono qui 44
      specie di mammiferi.


      Tra i volatili il parco vanta 75 specie nidificanti. La più maestosa è la [cicogna
      nera](/especie/ciconia_nigra/), mentre il [gufo reale](/especie/bubo_bubo/) nidifica sulle pareti
      rupestri. Sei delle sette specie di picchi dell'Europa centrale sono presenti, e dal 1989 il corvo
      imperiale è tornato a riprodursi.


      Tra i mammiferi notturni si rifugiano nel parco 15 delle 24 specie di pipistrelli della Germania,
      inclusi il [vespertilio di Bechstein](/especie/myotis_bechsteinii/) e il [vespertilio
      maggiore](/especie/myotis_myotis/). Nel legno deperiente e negli alberi morti prosperano coleotteri
      xilofagi, con sette specie relitte di foresta vergine tra cui il cerambice eremita.
    visit: >-
      Inizia dal NationalparkZentrum Kellerwald, il centro visitatori principale situato a ovest del parco a
      Vöhl-Herzhausen, accanto all'Edersee. Qui trovi mostre e laboratori didattici, mentre l'area esterna è
      lasciata alla libera successione ecologica.


      Per camminare hai a disposizione più di 25 percorsi circolari ben segnalati, collegabili in tragitti più
      ampi. Gli anelli con partenza dai parcheggi misurano in genere una decina di chilometri e recano nomi di
      animali o piante, come il Fledermausweg e l'Ebereschenweg. Chi cerca percorsi più impegnativi può
      seguire l'Urwaldsteig Edersee, che compie il periplo del lago per circa 66 km: si può percorrere per
      intero in otto tappe o in tre giorni. Si snoda spesso su sentieri stretti e talvolta ripidi attraverso i
      boschi rivieraschi dell'Edersee. L'Hagenstein, detto la Loreley della valle dell'Eder, rappresenta un
      altro spettacolare sperone panoramico. Nel parco transita anche il Kellerwaldsteig, itinerario regionale
      di 164 km attraverso parco naturale e nazionale. Se preferisci visite guidate, l'ente parco ne organizza
      lungo l'Urwaldsteig e verso l'Hagenstein.


      Oltre ai percorsi regionali, il parco offre una propria rete ciclabile contrassegnata dal simbolo della
      bici. I sentieri stretti sono riservati ai pedoni; biciclette e cavalli devono circolare unicamente
      sulle piste autorizzate.
    history: >-
      I coloni del passato tentarono di ricavare campi dal bosco, ma l'insediamento non durò: i villaggi delle
      Ederberge, dai suoli poveri, furono abbandonati al più tardi nel 1470. Verso il 1800 iniziarono
      rimboschimenti sistematici che, a differenza di altre zone, impiegarono quasi solo faggio senza
      ricorrere alle conifere. Nel folto della foresta sorgono i ruderi della Quernstkirche, eretta
      probabilmente nei secoli XI o XII e citata per la prima volta nel 1236.


      Il parco nazionale è nato il 1 gennaio 2004. Il 10 marzo 2011 è stata la prima grande area protetta
      tedesca certificata nella categoria II della IUCN, e il 25 giugno 2011 le faggete vetuste e i relitti di
      foresta primaria sono entrati nel Patrimonio Mondiale. In seguito all'ampliamento del 2020 il parco,
      diviso in tre settori, copre 76,88 km². Dal 2016 sono in corso interventi per eliminare le monocolture
      non autoctone di abete di Douglas e abete rosso.
    before: >-
      Fumare e accendere fuochi sono vietati nel bosco in ogni periodo dell'anno, e i sentieri angusti sono
      riservati a chi cammina a piedi. In caso di temporali, vento forte, piogge torrenziali o neve è prudente
      non addentrarsi nella foresta per il pericolo di schianti e caduta rami. La strada del Peterskopf è
      chiusa per cantieri, con deviazioni indicate per i sentieri interessati. Controlla la cartografia dei
      percorsi prima di partire. Lungo le piste sono collocati cippi lignei con numeri identificativi utili a
      comunicare la propria posizione ai soccorsi al 112.
  pt:
    intro: >-
      Há florestas que sobrevivem e florestas que regressam. A de Kellerwald-Edersee pertence ao segundo
      grupo, e continua nesse caminho. Em redor do lago Edersee, no norte de Hesse, as Ederberge reúnem mais
      de cinquenta montes ondulados quase inteiramente cobertos de arvoredo, onde faias muito vetustas
      convivem com uma promessa: deixar a natureza seguir o seu curso, para que o bosque desenvolva estruturas
      cada vez mais maduras. Entretanto, o parque guarda os vestígios de floresta virgem que restavam, razão
      pela qual uma parte dos seus faiais é Património Mundial da UNESCO.
    landscape: >-
      A história deste bosque começa com o gelo. A faia entrou na Europa Central durante o ótimo climático
      pós-glaciar e expandiu-se à custa do ulmeiro e da tília. Por isso, a comunidade característica do parque
      é o faial acidófilo, que medra em solos ácidos e pobres.


      Outras encostas mostram traços distintos. As encostas de Edersee guardam escarpas siliciosas com o cravo
      Pfingstnelke, muito ameaçado na Europa; nos vales estendem-se prados e antigas pastagens, os Driesche,
      que somam mais de 200 ha e onde floresce a árnica. Mais de mil nascentes e ribeiros naturais, a par de
      encostas rochosas e cascalheiras, completam este mosaico. No total, contam-se mais de 600 espécies de
      plantas vasculares.


      O recanto mais antigo situa-se na Wooghölle, a vertente norte que desce em direção ao Edersee. Tanto
      quanto alcançam os registos históricos, nunca teve exploração humana e manteve-se sempre florestada;
      conserva cerca de 10 hectares considerados um testemunho de floresta primária. O restante arvoredo
      continua a maturar: mais de 20% dos faiais do parque têm já mais de 160 anos (dado de 2009), e a
      recuperação das estruturas de bosque maduro desenvolve-se ao longo de várias gerações de árvores.
    wildlife: >-
      Um dos seus habitantes mais discretos é o [gato-bravo](/especie/felis_silvestris/). Em 2007 confirmou-se
      a sua presença numa região onde era dado como extinto há 60 anos, e hoje o parque acompanha o seu
      regresso com monitorização e análise genética. Os grandes herbívoros incluem o
      [veado-vermelho](/especie/cervus_elaphus/), a [corça](/especie/capreolus_capreolus/) e o
      [javali](/especie/sus_scrofa/); o muflão e o gamo foram introduzidos em 1935. No total ocorrem 44
      espécies de mamíferos.


      Nas aves, o parque regista 75 espécies reprodutoras. A maior é a
      [cegonha-preta](/especie/ciconia_nigra/), e o [bufo-real](/especie/bubo_bubo/) nidifica nos rochedos.
      Seis das sete espécies de pica-paus da Europa Central vivem aqui e, desde 1989, o corvo-comum voltou a
      nidificar.


      Entre os mamíferos noturnos refugiam-se no parque 15 das 24 espécies de morcegos da Alemanha, incluindo
      o [morcego de Bechstein](/especie/myotis_bechsteinii/) e o
      [morcego-rato-grande](/especie/myotis_myotis/). Na madeira morta e senescente proliferam escaravelhos
      saproxílicos, com sete relíquias de floresta primária entre as quais o escaravelho-eremita.
    visit: >-
      Começa pelo NationalparkZentrum Kellerwald, o centro principal a oeste do parque, em Vöhl-Herzhausen,
      junto ao Edersee. Apresenta uma exposição didática e atividades, enquanto o recinto exterior é deixado à
      sucessão natural para observar a dinâmica das comunidades vegetais.


      Para caminhar tens mais de 25 percursos circulares bem sinalizados, que podes combinar em travessias
      mais longas. Os circuitos a partir dos parques de estacionamento medem em geral cerca de dez quilómetros
      e exibem nomes de animais ou plantas, como o Fledermausweg e o Ebereschenweg. Quem procura uma aventura
      mais exigente dispõe do Urwaldsteig Edersee, que circunda a albufeira ao longo de cerca de 66 km: pode
      ser percorrido na íntegra em oito etapas ou em três dias. Segue amiúde por veredas estreitas e por vezes
      muito íngremes, revelando as encostas arborizadas de Edersee. O Hagenstein, conhecido como a Loreley do
      vale do Eder, constitui outro imponente miradouro rochoso. Pelo parque passa também o Kellerwaldsteig,
      de 164 km, percurso regional que cruza o parque natural e o parque nacional. Se preferires companhia, o
      parque promove caminhadas guiadas pelo Urwaldsteig Edersee e pelo trilho de Hagenstein.


      Além das rotas regionais, o parque dispõe de rede própria de ciclovias, identificada pelo símbolo de
      bicicleta. Os trilhos estreitos destinam-se exclusivamente a peões; bicicletas e cavalos devem circular
      pelas vias sinalizadas.
    history: >-
      Outrora os povoadores tentaram ganhar terreno à floresta, mas a ocupação não durou: as aldeias das
      Ederberge, de solos pobres, estavam abandonadas o mais tardar em 1470. Por volta de 1800 iniciaram-se
      repovoamentos florestais metódicos que, ao contrário de outras regiões, assentaram na faia e quase sem
      resinosas. No coração da mata erguem-se as ruínas da Quernstkirche, erigida provavelmente nos séculos XI
      ou XII e referida pela primeira vez em 1236.


      O parque nacional foi criado a 1 de janeiro de 2004. A 10 de março de 2011 tornou-se a primeira grande
      área protegida da Alemanha classificada na categoria II da UICN e, a 25 de junho de 2011, os faiais
      vetustos e os retalhos de floresta primária integraram o Património Mundial. Após a ampliação de 2020, o
      parque reparte-se por três áreas somando 76,88 km². Desde 2016 estão a ser removidos os povoamentos
      monoespecíficos de abeto-de-douglas e espruce-da-noruega, que aqui não são autóctones.
    before: >-
      Fumar e acender fogueiras são proibidos na floresta durante todo o ano, e as veredas estreitas estão
      reservadas a caminhantes. Em caso de trovoada, vendaval, chuva torrencial ou neve, não deves entrar na
      mata devido à queda de ramos e árvores. A estrada de Peterskopf está encerrada para obras, existindo
      desvios sinalizados para os percursos afetados. Examina o mapa de itinerários antes de partir. Ao longo
      dos caminhos encontras marcos de madeira numerados que facilitam a transmissão da tua posição às equipas
      de socorro através do 112.
