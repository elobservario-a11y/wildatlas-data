resumen:
  es: >-
    Mosaico estepario salino entre los ríos Danubio y Tisza con dunas de arena movediza continentales y lagos
    alcalinos.
  en: >-
    Saline steppe mosaic between the Danube and Tisza rivers with continental shifting sand dunes and alkaline
    lakes.
  fr: Mosaïque de steppes salines entre le Danube et la Tisza avec dunes continentales mobiles et lacs alcalins.
  de: Salzsteppen-Mosaik zwischen Donau und Theiß mit kontinentalen Wanderdünen und alkalischen Sodaseen.
  it: Mosaico di steppe saline tra Danubio e Tibisco con dune continentali e laghi alcalini sodici.
  pt: Mosaico de estepe salina entre os rios Danúbio e Tisza com dunas continentais móveis e lagoas alcalinas.
unico:
  es: >-
    Es una estepa que nació de drenar un río: la sal que dejó el agua al retirarse es lo que sostiene hoy las
    avutardas, las avocetas y los pastos de ganado gris.
  en: >-
    A steppe born from the drainage of a great river: the salts left behind by retreating waters sustain great
    bustards, avocets, and Grey cattle herds.
  fr: >-
    Une steppe née du drainage d'un grand fleuve : le sel laissé par les eaux alimente grandes outardes,
    avocettes et troupeaux de bœufs gris.
  de: >-
    Eine Steppe, die durch die Entwässerung eines Flusslaufs entstand: Die zurückbleibenden Salze ernähren
    Großtrappen, Säbelschnäbler und Steppenrinder.
  it: >-
    Una steppa scaturita dalla bonifica di un grande fiume: i sali lasciati dal ritiro delle acque sostengono
    otarde, avocette e bovini grigi.
  pt: >-
    Uma estepe nascida da drenagem de um grande rio: o sal deixado pela retração das águas sustenta abetardas,
    alfaiates e manadas de gado cinzento.
observaciones:
  es: >-
    Las partes estrictamente protegidas están señaladas con carteles y solo se pisan con permiso escrito del
    parque o con un guía experto. Quédate en los senderos: salirse pone en riesgo a las aves que anidan en el
    suelo de los pastizales y a los animales que viven en la tierra. No se debe fotografiar aves cerca del
    nido y los hides portátiles necesitan permiso del parque. Los coches solo pueden circular por vías
    públicas y algunos caminos forestales señalados, y el parque prefiere que llegues en bicicleta o en tren.
texto:
  es:
    intro: >-
      Un río decidió dónde estaría el agua, y los hombres decidieron después que no estuviera. La estepa del
      Alto Kiskunság ocupa la antigua llanura inundable del Danubio, y todavía se lee en el terreno: el cauce
      de los viejos cursos de agua se adivina en el dibujo de las plantas y en cómo se encharca el suelo. Hoy
      es la segunda estepa salina más extensa de la Gran Llanura Húngara, después de Hortobágy, con 11.061
      hectáreas de pastos, praderas salinas y charcas temporales dentro del Parque Nacional Kiskunság. Su
      rincón más famoso es Apaj.
    landscape: >-
      La causa está en la hidrología. Cuando la llanura inundable del Danubio fue drenada, la sal del suelo se
      concentró y la salinización se aceleró. El drenaje de humedales empezó en la década de 1910 y la
      regulación del río hizo el resto: el agua de principios de primavera sale por los canales y la que queda
      se evapora a comienzos del verano. La única masa de agua permanente son los estanques piscícolas de
      Apaj, de 450 hectáreas, que se mantienen de forma artificial.


      Lo que ves es un mosaico: estepas alcalinas ricas en carbonatos, prados salinos, pastos, charcas
      temporales y, entre ellos, crestas de arena y loess depositadas por el viento. Las condiciones son duras
      (suelo de textura muy fina, balance hídrico desfavorable y mucha sal), así que solo prospera una
      vegetación halófita de poca diversidad: una festuca local, el limonio húngaro, la manzanilla y el ajenjo
      de las salinas.


      Al lado, los Lagos del Alto Kiskunság cuentan la misma historia por otro camino. En el Primer
      Levantamiento Militar, el de 1783-1784, eran inmensas marismas de agua dulce que las crecidas llenaban
      de aluvión. Los diques que empezaron a levantarse en la década de 1840 aislaron la llanura; sin crecidas
      que los lavaran, los puntos más bajos acabaron convertidos en lagos sódicos blancos o negros. Hubo
      cientos, y casi todos se han secado o solo tienen agua libre a principios de primavera. Los mayores,
      Kis-rét, Zab-szék, Büdös-szék, Kelemen-szék y Fehér-szék, son los más valiosos del parque y de Hungría.
    wildlife: >-
      Lo más espectacular de este paisaje son las aves, y el año las ordena como un calendario.


      En primavera pasa hacia el norte una masa de limícolas (aves de los géneros Tringa y Calidris) que se
      detienen a comer en los humedales someros. Coincide con el cortejo de la [avutarda
      euroasiática](/especie/otis_tarda/): la población de esta región es la mayor de Hungría. Después, con el
      paso terminado, la estepa se queda en silencio y solo se oyen las aves que crían, como el [cernícalo
      patirrojo](/especie/falco_vespertinus/), un nidificante extendido pero escaso que caza sobre todo
      insectos.


      A finales de verano y en otoño la estepa se llena otra vez de migrantes que van hacia el sur. En los
      lagos, las ocas salvajes duermen en gran número de otoño a primavera y, durante la migración, pasan
      decenas de miles de patos: cercetas, silbones, rabudos, cucharas. Entre los nidificantes de los medios
      salinos destacan la [avoceta](/especie/recurvirostra_avosetta/) y la cigüeñuela; en la isla del
      Kelemen-szék hay una colonia de unas cien parejas de gaviota reidora. El [aguilucho
      lagunero](/especie/circus_aeruginosus/) cría en los carrizales de Kis-rét y Fehér-szék.


      El invierno trae paseriformes árticos y rapaces: entre dos y seis
      [pigargos](/especie/haliaeetus_albicilla/) y águilas imperiales invernan en los lagos, y también el
      esmerejón y el [aguilucho pálido](/especie/circus_cyaneus/).


      Si miras hacia abajo, hay otro mundo. En las lomas junto a los lagos florecen a principios de primavera
      la orquídea de alas verdes, la orquídea chinche y el iris enano, todas protegidas. En la orilla vegetada
      viven muchos sapillos de vientre de fuego, y en los charcos el tritón crestado del Danubio. Entre los
      invertebrados destacan un escarabajo longicornio (Dorcadion fulvum cervae) y la araña lobo china, la
      mayor de Hungría. De los mamíferos apenas verás nada: viven de noche, y el rarísimo ratón de abedul
      meridional solo se conoce por egagrópilas de lechuza.
    visit: >-
      El sendero de estudio de Apaj es la puerta de entrada. Recorre algo más de un kilómetro por un humedal
      creado sobre un antiguo estanque piscícola, y en cada extremo hay un mirador elevado con vistas a la
      puszta. Por el camino puedes aprender sobre las aves de carrizal y de medios salinos, y desde el sendero
      se ven manadas de vaca gris húngara, una de las mayores poblaciones de la Gran Llanura Húngara. La mejor
      época es la primavera, el comienzo del verano y el otoño, cuando los humedales se llenan de aves.


      Para las aves de agua, la otra cita es el sendero de la Avoceta, en Fülöpszállás: 1300 metros con seis
      paradas informativas que terminan en un observatorio donde se ven y se fotografían aves en cualquier
      estación. En primavera y otoño es cuando más compensa; en verano, mejor a primera hora o al caer la
      tarde, y con prismáticos. Los búfalos de agua del parque pastan en la orilla del lago Kelemen, por eso
      el sendero va entre vallas eléctricas hasta el observatorio.


      Si quieres entender el conjunto antes de salir al campo, la Casa de la Naturaleza de Kecskemét, centro
      de visitantes de la dirección del parque, tiene una exposición permanente sobre la historia de la
      conservación en Hungría, los parques nacionales y los hábitats entre el Danubio y el Tisza.
    history: >-
      El Kiskunság es un paisaje cultural, no uno virgen. Según los hallazgos arqueológicos, hay culturas
      pastoriles en la región desde el Cobre tardío (milenios tercero y cuarto antes de Cristo), y los
      húngaros y los cumanos siguieron después ese modo de vida. El pastoreo extensivo tiene siglos de
      historia en la estepa salina, y hoy las ovejas y vacas locales ayudan a mantener los pastos primarios.
      En los lagos, el parque mantiene un rebaño de vacas y búfalos de agua para conservar los hábitats
      pantanosos y salinos.


      El parque se fundó en 1975 y es el segundo de Hungría. No es un territorio continuo sino un mosaico de
      nueve unidades, y la estepa del Alto Kiskunság, los lagos del Alto Kiskunság y el lago Kolon están
      reconocidos por el Convenio de Ramsar como humedales de importancia internacional. Los lagos sódicos,
      además, fueron de las primeras zonas del país en recibir ese reconocimiento.
    before: >-
      Las partes estrictamente protegidas están señaladas con carteles y solo se pisan con permiso escrito del
      parque o con un guía experto. Quédate en los senderos: salirse pone en riesgo a las aves que anidan en
      el suelo de los pastizales y a los animales que viven en la tierra. No se debe fotografiar aves cerca
      del nido y los hides portátiles necesitan permiso del parque. Los coches solo pueden circular por vías
      públicas y algunos caminos forestales señalados, y el parque prefiere que llegues en bicicleta o en
      tren.
    around: >-
      A solo 2 km queda el [Kiskunsági Nemzeti Park -
      Apaji-szikesek](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), y la unidad de
      [Bugac](/lugar/kiskunsagi---bugac-puszta/) forma parte del mismo parque. A veintiocho kilómetros queda
      el bosque y llanura inundable de [Gemenc](/lugar/gemenc-danube---forest-floodplain/), en el Danubio.


      Más lejos, comparten avutarda y cernícalo patirrojo la [llanura de
      Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) y la reserva serbia de [Pašnjaci velike
      rit](/lugar/specijalni-rezervat-prirode-pasnjaci/); [Rusanda](/lugar/park-prirode-rusanda/) comparte el
      cernícalo y los mismos hábitats de estepa, humedal y lago.
  en:
    intro: >-
      A river once dictated where the waters pooled, and human hands later intervened to banish them. The
      Upper Kiskunság steppe occupies the historic floodplain of the Danube, an origin that remains clearly
      legible in the topography: former braided river channels are revealed by botanical patterns and periodic
      winter flooding. Today it constitutes the second most extensive saline steppe on the Great Hungarian
      Plain after Hortobágy, encompassing 11,061 hectares of salt pastures, alkaline meadows, and temporary
      sodic pools protected within Kiskunság National Park. Its most renowned enclave is Apaj.
    landscape: >-
      The key lies in drainage hydrology. When the vast Danube floodplain was cut off by dykes, ground salts
      concentrated and soil salinisation intensified. Wetland drainage began in the 1910s and subsequent river
      regulation finished the transformation: early spring floodwaters are swiftly evacuated through canals
      while residual waters evaporate under the early summer sun. The sole permanent open waterbodies are the
      Apaj fishponds, covering 450 hectares, maintained artificially through management.


      What meets the eye is an intricate mosaic: carbonate-rich alkaline steppes, salt pastures, seasonal
      marsh depressions, and low wind-deposited sand and loess ridges. Growing conditions are harsh, governed
      by fine-textured solonetz soils, poor drainage, and heavy salt loads; only a specialist halophytic flora
      survives: a local fescue grass, Hungarian sea lavender, scented chamomile, and sea wormwood.


      Beside the steppe, the Upper Kiskunság Lakes tell a parallel story. On the First Military Survey of
      1783-1784, they were depicted as vast freshwater marshes rejuvenated by seasonal inundations.
      Embankments constructed in the 1840s isolated the plain; deprived of cleansing river floods, the deepest
      depressions evolved into white or black sodic pans. Hundreds once existed, yet most have vanished or
      hold water only in early spring. The largest—Kis-rét, Zab-szék, Büdös-szék, Kelemen-szék, and
      Fehér-szék—rank among Hungary's most precious soda lakes.
    wildlife: >-
      The greatest spectacle across this vast horizon is its birdlife, moving through the seasons with
      clockwork regularity.


      In spring, waves of migrating waders (Tringa and Calidris sandpipers) stage across the shallow muds to
      refuel. This coincides with the courtship displays of the [great bustard](/especie/otis_tarda/): the
      regional breeding population is the largest in Hungary. Once migration wanes, stillness settles over the
      steppe, broken only by resident breeders like the [red-footed falcon](/especie/falco_vespertinus/), an
      elegant colonial raptor hunting large insects.


      Late summer and autumn bring another surge of southbound passage migrants. Wild geese roost on the soda
      pans in immense numbers from autumn to spring, accompanied by tens of thousands of dabbling ducks:
      teals, wigeons, pintails, and shovelers. Saline breeding specialists include the [pied
      avocet](/especie/recurvirostra_avosetta/) and black-winged stilt, while an island in Kelemen-szék
      shelters a noisy colony of black-headed gulls. The [western marsh harrier](/especie/circus_aeruginosus/)
      nests in the reedbeds of Kis-rét and Fehér-szék.


      Winter welcomes arctic passerines and raptors: between two and six [white-tailed
      eagles](/especie/haliaeetus_albicilla/) and eastern imperial eagles winter around the lakes, joined by
      merlins and [hen harriers](/especie/circus_cyaneus/).


      Looking closer reveals other treasures: green-winged orchids, bug orchids, and dwarf irises flower on
      loess mounds in early spring. European fire-bellied toads inhabit vegetated lake margins, and Danube
      crested newts breed in roadside pools. Notable invertebrates include the flightless longhorn beetle
      Dorcadion fulvum cervae and the South Russian tarantula, Hungary's largest spider.
    visit: >-
      The Apaj educational nature trail provides the natural gateway. It extends over a kilometre through a
      restored wetland constructed upon former fishponds, featuring high observation platforms at both ends
      overlooking the open puszta. Along the way you learn about reedbed ecology and saline birds, with
      regular sightings of Hungarian Grey cattle—one of the largest herds in the country. The best times to
      visit are spring, early summer, and autumn, when birdlife peaks.


      For waterbirds, another essential stop is the Avocet Trail in Fülöpszállás: 1300 metres with six
      interpretive stops ending at an observation hide suitable for wildlife photography in all seasons.
      Spring and autumn offer the greatest abundance; in summer, visit early in the morning or late in the
      afternoon with binoculars. The park's water buffalo graze along Lake Kelemen, requiring the trail to
      pass safely between electric fences to the hide.


      To grasp the wider landscape before heading into the field, the House of Nature in Kecskemét features
      permanent interactive exhibitions on Hungarian conservation history and the Danube-Tisza habitats.
    history: >-
      The Kiskunság is a cultural landscape deeply shaped by millennia of pastoralism. Archaeological finds
      trace livestock herding back to the late Copper Age (the third and fourth millennia BC), a lifestyle
      later perpetuated by Hungarians and Cumans. Extensive grazing has centuries of history across the salt
      steppes, and local sheep and cattle breeds remain essential to maintaining open grasslands. Around the
      lakes, the park grazes cattle and water buffalo to prevent scrub invasion.


      Established in 1975 as Hungary's second national park, Kiskunság comprises nine non-contiguous units.
      The Upper Kiskunság Steppe, the Upper Kiskunság Lakes, and Lake Kolon are internationally protected
      under the Ramsar Convention, with the sodic pans being among Hungary's earliest designated Ramsar sites.
    before: >-
      Strictly protected core areas are marked with warning signs and may only be entered with written park
      permission or accompanied by an expert ranger. Stay strictly on marked trails: straying damages fragile
      solonetz crusts and threatens ground-nesting birds. Photographing birds near active nests is prohibited,
      and portable photography hides require prior park authorization. Motor vehicles must remain on public
      roads, and the park strongly encourages travel by bicycle or train.
    around: >-
      Just 2 km away lies [Kiskunság National Park -
      Apaji-szikesek](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), while the [Bugac
      Puszta](/lugar/kiskunsagi---bugac-puszta/) unit forms part of the same park. Twenty-eight kilometres
      away lies the flooded forest floodplain of [Gemenc](/lugar/gemenc-danube---forest-floodplain/) on the
      Danube.


      Further across the Pannonian Plain, [Dévaványa Plain](/lugar/koros-maros-nemzeti-park---devavanyai/) and
      the Serbian reserve [Pašnjaci velike rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) share great
      bustards and red-footed falcons, while [Rusanda Nature Park](/lugar/park-prirode-rusanda/) shares
      identical sodic lakes and saline steppes.
  fr:
    intro: >-
      Un fleuve décida jadis de l'emplacement des eaux, et les hommes décidèrent plus tard de les chasser. La
      steppe du Haut-Kiskunság occupe l'ancien lit majeur inondable du Danube, une origine encore inscrite
      dans le paysage : les méandres fossiles se devinent dans la flore et les creux humides. C'est
      aujourd'hui la seconde steppe salée la plus étendue de la Grande Plaine hongroise après Hortobágy,
      protégeant 11 061 hectares de pâturages salins, de prés alcalins et de mares temporaires au sein du parc
      national de Kiskunság. Son site le plus emblématique est Apaj.
    landscape: >-
      La cause première réside dans l'histoire hydrologique. Lors de l'endiguement du Danube, les sels
      minéraux se sont concentrés dans le sol, accélérant la salinisation. L'assèchement des zones humides
      débuta dans les années 1910 et la chenalisation fluviale paracheva l'assèchement : les crues
      printanières sont évacuées par les canaux et les reliquats d'eau s'évaporent dès le début de l'été. Le
      seul plan d'eau permanent est formé par les étangs piscicoles d'Apaj, couvrant 450 hectares maintenus
      artificiellement.


      Le paysage est une marqueterie : steppes alcalines riches en carbonates, prés salés, mares saumâtres et
      cordons de sable et de loess déposés par les vents. Les conditions édaphiques sont rudes (sols fins de
      type solonetz, fort pouvoir évaporant et haute teneur en sel), favorisant une flore halophile
      spécialisée : fétuque des sables, limonium de Hongrie, camomille sauvage et armoise maritime.


      À proximité, les lacs du Haut-Kiskunság témoignent de la même genèse. Lors du premier relevé militaire
      impérial de 1783-1784, ils apparaissaient comme d'immenses marais d'eau douce baignés par les crues. Les
      digues érigées à partir des années 1840 isolèrent la plaine ; privés de rinçage alluvial, les points bas
      se muèrent en lacs sodiques blancs ou noirs. Il en existait des centaines, aujourd'hui pour la plupart
      asséchés en été. Les plus grands — Kis-rét, Zab-szék, Büdös-szék, Kelemen-szék et Fehér-szék — comptent
      parmi les fleurons naturels de Hongrie.
    wildlife: >-
      La richesse majeure de ce vaste horizon réside dans l'avifaune, scandée au fil des saisons.


      Au printemps fait halte une multitude de limicoles (chevaliers et bécasseaux) qui s'alimentent dans les
      vasières. Ce passage coïncide avec les parades de la [grande outarde](/especie/otis_tarda/), dont la
      harde régionale est la plus nombreuse de Hongrie. Puis la steppe s'apaise, animée par les nicheurs comme
      le [faucon kobez](/especie/falco_vespertinus/), petit rapace colonial friand de gros insectes.


      À la fin de l'été et en automne, la steppe accueille le grand flux migratoire vers le sud. Sur les lacs
      alcalins dorment des milliers d'oies sauvages d'automne au printemps, entourées de dizaines de milliers
      de canards de surface : sarcelles, siffleurs, pilets, souchets. Parmi les nicheurs des milieux salés
      dominent l'[avocette élégante](/especie/recurvirostra_avosetta/) et l'échasse blanche, tandis qu'un îlot
      de Kelemen-szék héberge une colonie de mouettes rieuses. Le [busard des
      roseaux](/especie/circus_aeruginosus/) niche dans les roselières de Kis-rét et Fehér-szék.


      L'hiver attire rapaces et passereaux nordiques : entre deux et six [pygargues à queue
      blanche](/especie/haliaeetus_albicilla/) et aigles impériaux hivernent autour des étangs, côtoyant le
      faucon émerillon et le [busard Saint-Martin](/especie/circus_cyaneus/).


      Au ras du sol, orchidées pourpres, orchidées punaises et iris nains colorent les buttes de loess au
      printemps. Le sonneur à ventre de feu et le triton crêté du Danube animent les mares. L'araignée-loup
      géante est la plus grande de Hongrie.
    visit: >-
      Le sentier d'étude d'Apaj constitue la porte d'entrée naturelle du secteur. Il s'étire sur un peu plus
      d'un kilomètre à travers une zone humide aménagée sur un ancien étang de pisciculture, et à chaque
      extrémité se dresse un mirador élevé avec une vue dégagée sur la puszta. En chemin, vous apprendrez à
      reconnaître les oiseaux de roselière et des milieux salins, et depuis le sentier vous pourrez admirer
      des troupeaux de bœufs gris hongrois, formant l'une des plus grandes populations de la Grande Plaine
      hongroise. Les meilleures périodes de visite sont le printemps, le début de l'été et l'automne, lorsque
      les zones humides regorgent d'oiseaux.


      Pour observer les oiseaux d'eau, l'autre étape incontournable est le sentier de l'Avocette, à
      Fülöpszállás : 1300 mètres ponctués de six stations d'information qui mènent à un observatoire
      panoramique idéal pour contempler et photographier la faune en toute saison. Le printemps et l'automne
      sont les périodes les plus gratifiantes ; en été, préférez le tout début de matinée ou la fin
      d'après-midi, en vous munissant impérativement de jumelles. Les buffles d'eau du parc pâturant sur la
      rive du lac Kelemen, le sentier chemine en toute sécurité entre des clôtures électrifiées jusqu'à
      l'affût.


      Si vous souhaitez appréhender l'ensemble avant d'arpenter le terrain, la Maison de la Nature à
      Kecskemét, centre d'accueil de la direction du parc, propose une exposition permanente complète sur
      l'histoire de la protection de la nature en Hongrie, les parcs nationaux et les écosystèmes situés entre
      le Danube et la Tisza.
    history: >-
      Le Kiskunság est un paysage culturel séculaire et non une contrée vierge. D'après les découvertes
      archéologiques, des civilisations pastorales occupent la région depuis l'âge du cuivre tardif (troisième
      et quatrième millénaires avant notre ère), et les Hongrois comme les Coumans ont perpétué par la suite
      ce mode de vie pastoral. Le pâturage extensif possède des siècles d'histoire sur la steppe salée, et
      aujourd'hui les races locales d'ovins et de bovins contribuent activement à préserver ces prairies
      primaires ouvertes. Autour des lacs, le parc entretient un troupeau de vaches et de buffles d'eau afin
      d'empêcher l'enfrichement et de sauvegarder les biotopes marécageux et salins.


      Créé en 1975, le parc national est le deuxième fondé en Hongrie. Il ne forme pas un territoire d'un seul
      tenant mais un ensemble discontinu de neuf unités réparties dans la plaine, et la steppe du
      Haut-Kiskunság, les lacs du Haut-Kiskunság ainsi que le lac Kolon sont internationalement reconnus par
      la convention de Ramsar comme zones humides d'importance planétaire. Les lacs sodiques, de surcroît,
      figurèrent parmi les tout premiers sites du pays à recevoir ce statut protecteur prestigieux.
    before: >-
      Les secteurs placés sous protection intégrale stricte sont signalés par des panneaux d'avertissement et
      ne peuvent être arpentés qu'avec une autorisation écrite de la direction du parc ou sous la conduite
      d'un garde expert. Demeurez scrupuleusement sur les sentiers balisés : en sortir met en danger les
      oiseaux qui nichent à même le sol dans les pâturages ainsi que la faune fouisseuse vivant dans la terre
      meuble. Il est formellement interdit de photographier les oiseaux à proximité immédiate des nids, et
      l'installation d'affûts photographiques portables requiert un accord préalable du parc. Les véhicules
      motorisés peuvent seulement circuler sur le réseau routier public et quelques voies forestières
      expressément autorisées, le parc encourageant vivement les déplacements à vélo ou en train.
    around: >-
      À seulement 2 km s'étend le [Kiskunsági Nemzeti Park -
      Apaji-szikesek](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), tandis que la puszta de
      [Bugac](/lugar/kiskunsagi---bugac-puszta/) relève du même parc. À vingt-huit kilomètres s'étendent les
      forêts inondables de [Gemenc](/lugar/gemenc-danube---forest-floodplain/) le long du Danube.


      Plus loin, la [plaine de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) et la réserve serbe
      de [Pašnjaci velike rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) partagent l'outarde et le faucon
      kobez, tout comme [Rusanda](/lugar/park-prirode-rusanda/).
  de:
    intro: >-
      Ein Fluss entschied einst über den Lauf des Wassers, und der Mensch entschied später, das Wasser zu
      vertreiben. Die Steppe des Oberen Kiskunság nimmt die historische Überflutungsaue der Donau ein, was man
      im Gelände noch deutlich ablesen kann: Uralte Flussmäander zeichnen sich in Pflanzengemeinschaften und
      feuchten Senken ab. Heute ist sie mit 11.061 Hektar Salzweiden, Salzgrasfluren und temporären
      Sodatümpeln im Kiskunság-Nationalpark die zweitgrößte Salzsteppe der Ungarischen Tiefebene nach
      Hortobágy. Ihr berühmtester Teil ist Apaj.
    landscape: >-
      Die Entstehung wurzelt in der Gewässerregulierung. Als die Aue der Donau eingedeicht wurde, reicherten
      sich Bodensalze an und die Versalzung beschleunigte sich. Die Trockenlegung begann in den 1910er-Jahren,
      und Kanalbauten taten ein Übriges: Frühlingswasser fließt rasch ab und Reste verdunsten in der
      Frühsommerhitze. Die einzigen dauerhaften Wasserflächen sind die 450 Hektar großen Fischteiche von Apaj,
      die künstlich bewirtschaftet werden.


      Es zeigt sich ein Mosaik: Karbonatreiche Alkalisteppen, Salzgrasweiden, periodische Flachwassertümpel
      sowie vom Wind aufgewehte Sand- und Lössrücken. Wegen extremer Bedingungen – tonige Solonetzböden,
      ungünstiger Wasserhaushalt und hoher Salzgehalt – überlebt nur spezialisierte Salzvegetation:
      Sand-Schwingel, Ungarischer Strandflieder, Echte Kamille und Salz-Wermut.


      Die benachbarten Seen des Oberen Kiskunság durchliefen eine ähnliche Entwicklung. In der Ersten
      Militärischen Landesaufnahme von 1783-1784 erschienen sie als weite Süßwassersümpfe der Donauhochwässer.
      Eindeichungen ab den 1840er-Jahren schnitten die Zufuhr ab; ohne Spülung wandelten sich die tiefsten
      Senken in weiße oder schwarze Sodaseen. Hunderte existierten einst, die meisten fielen trocken. Die
      größten – Kis-rét, Zab-szék, Büdös-szék, Kelemen-szék und Fehér-szék – zählen zu den wertvollsten
      Sodagewässern Ungarns.
    wildlife: >-
      Der landschaftliche Reichtum offenbart sich in der Vogelwelt im Wandel der Jahreszeiten.


      Im Frühjahr rasten arktische Watvögel (Wasserläufer und Strandläufer) in den Flachwasserzonen. Zugleich
      findet die Balz der [Großtrappe](/especie/otis_tarda/) statt: Hier lebt das größte Trappenvorkommen
      Ungarns. Nach dem Vogelzug kehrt Ruhe ein, belebt durch Brutvögel wie den
      [Rotfußfalken](/especie/falco_vespertinus/), der in Kolonien brütet und Großinsekten jagt.


      Im Spätsommer und Herbst füllt sich die Puszta erneut mit Zugvögeln auf dem Weg nach Süden. Tausende
      Wildgänse übernachten von Herbst bis Frühjahr auf den Sodaseen, begleitet von Zehntausenden
      Gründelenten: Krick-, Pfeif-, Spieß- und Löffelenten. Charaktervögel der Salzbiotope sind der
      [Säbelschnäbler](/especie/recurvirostra_avosetta/) und der Stelzenläufer; auf einer Insel im
      Kelemen-szék brüten Lachmöwen. Die [Rohrweihe](/especie/circus_aeruginosus/) nistet im Schilf von
      Kis-rét und Fehér-szék.


      Der Winter lockt Greifvögel an: Zwischen zwei und sechs [Seeadler](/especie/haliaeetus_albicilla/) und
      Kaiseradler überwintern an den Seen, dazu Merlin und [Kornweihe](/especie/circus_cyaneus/).


      Am Boden blühen Kleines Knabenkraut, Wanzen-Knabenkraut und Zwerg-Schwertlilie. Rotbauchunken und
      Donau-Kammmolche bewohnen Wassertümpel. Südrussische Taranteln graben Erdröhren.
    visit: >-
      Der Lehrpfad von Apaj bietet das ideale Tor zum Gebiet. Er führt über etwas mehr als einen Kilometer
      durch ein Feuchtgebiet, das auf einem ehemaligen Fischteich angelegt wurde, und an jedem Ende bietet ein
      hoher Aussichtsturm weite Blicke über die Puszta. Unterwegs kannst du viel über Röhricht- und
      Salzsteppenvögel lernen, und vom Pfad aus lassen sich Herden des Ungarischen Steppenrinds beobachten,
      die zu den größten Beständen der Großen Ungarischen Tiefebene gehören. Die lohnendsten Zeiten sind das
      Frühjahr, der Frühsommer und der Herbst, wenn die Feuchtbiotope voller Vögel sind.


      Für Wasservögel ist der Säbelschnäbler-Pfad bei Fülöpszállás das zweite unverzichtbare Ziel: 1300 Meter
      mit sechs Informationstafeln, die an einer Beobachtungshütte enden, von der aus sich Vögel zu jeder
      Jahreszeit beobachten und fotografieren lassen. Im Frühjahr und Herbst lohnt sich der Besuch am meisten;
      im Hochsommer kommst du am besten frühmorgens oder am späten Nachmittag und unbedingt mit einem
      Fernglas. Da die Wasserbüffel des Nationalparks am Ufer des Kelemen-Sees weiden, verläuft der Weg sicher
      zwischen Elektrozäunen bis zur Hütte.


      Wenn du das Gesamtgefüge vor der Fahrt ins Gelände verstehen möchtest, zeigt das Haus der Natur in
      Kecskemét, das Besucherzentrum der Nationalparkdirektion, eine Dauerausstellung über die Geschichte des
      Naturschutzes in Ungarn, die Nationalparks und die Lebensräume im Zwischenstromland von Donau und Theiß.
    history: >-
      Das Kiskunság ist eine gewachsene Kulturlandschaft und keine unberührte Wildnis. Nach archäologischen
      Funden siedelten hier bereits seit der späten Kupferzeit (im dritten und vierten Jahrtausend vor
      Christus) Hirtenkulturen, und Ungarn wie Kumanen führten diese pastorale Lebensweise später fort. Die
      extensive Beweidung blickt auf eine jahrhundertelange Geschichte in der Salzsteppe zurück, und heute
      tragen einheimische Schaf- und Rinderrassen entscheidend dazu bei, die primären Offenlandrasen offen zu
      halten. Rund um die Seen hält der Nationalpark Rinder und Wasserbüffel, um die Verbuschung einzudämmen
      und die feuchten Salzlebensräume intakt zu bewahren.


      Der 1975 gegründete Nationalpark ist der zweitälteste Ungarns. Er bildet kein zusammenhängendes Areal,
      sondern ein Mosaik aus neun räumlich getrennten Teilgebieten, wobei die Steppe des Oberen Kiskunság, die
      Seen des Oberen Kiskunság und der Kolon-See durch die Ramsar-Konvention als Feuchtgebiete von
      internationaler Bedeutung geschützt sind. Die Sodaseen zählten überdies zu den ersten Gebieten des
      Landes, denen diese internationale Auszeichnung zuteilwurde.
    before: >-
      Die streng geschützten Kernzonen sind durch Schilder gekennzeichnet und dürfen ausschließlich mit
      schriftlicher Genehmigung der Nationalparkverwaltung oder in Begleitung eines fachkundigen Führers
      betreten werden. Bleibe unbedingt auf den ausgewiesenen Wegen: Das Verlassen gefährdet die
      bodenbrütenden Steppenvögel sowie die im Erdboden grabenden Tiere. Das Fotografieren von Vögeln am Nest
      ist streng verboten, und für tragbare Fotoverstecke bedarf es einer behördlichen Genehmigung.
      Kraftfahrzeuge dürfen ausschließlich öffentliche Straßen und wenige freigegebene Forstwege befahren; die
      Parkverwaltung empfiehlt nachdrücklich die Anreise mit dem Fahrrad oder der Bahn.
    around: >-
      Nur 2 km entfernt liegt das Schutzgebiet [Kiskunsági Nemzeti Park -
      Apaji-szikesek](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), während die
      [Bugac-Puszta](/lugar/kiskunsagi---bugac-puszta/) zum selben Nationalpark gehört. Achtundzwanzig
      Kilometer entfernt erstrecken sich die Donau-Auwälder von
      [Gemenc](/lugar/gemenc-danube---forest-floodplain/).


      Weiter entfernt teilen die [Dévaványa-Ebene](/lugar/koros-maros-nemzeti-park---devavanyai/) und das
      serbische Reservat [Pašnjaci velike rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) Großtrappen und
      Rotfußfalken, ebenso wie der Salzsee [Rusanda](/lugar/park-prirode-rusanda/).
  it:
    intro: >-
      Un fiume decise un tempo dove scorresse l'acqua, e gli uomini decisero in seguito di prosciugarla. La
      steppa dell'Alto Kiskunság si distende sull'antica piana golenale del Danubio, un passato chiaramente
      visibile nella geomorfologia: i rami fluviali fossili si riconoscono nelle fasce vegetazionali e nelle
      depressioni inondate. Oggi è la seconda steppa salina più vasta della Grande Pianura Ungherese dopo
      Hortobágy, con 11.061 ettari di pascoli salmastri, prati alcalini e pozze sodiche temporanee tutelate
      dal Parco nazionale di Kiskunság. Il suo sito più illustre è Apaj.
    landscape: >-
      La genesi affonda nella bonifica idraulica. Quando la golena del Danubio venne arginata, i sali minerali
      si concentrarono nei suoli accelerando la salinizzazione. Il prosciugamento delle paludi iniziò nel
      decennio del 1910 e le canalizzazioni completarono l'opera: le acque primaverili defluiscono rapidamente
      e i ristagni evaporano al sole estivo. L'unico bacino permanente è costituito dagli stagni di
      ittiocoltura di Apaj, estesi su 450 ettari mantenuti artificialmente.


      Il paesaggio compone un mosaico: steppe alcaline solonetz, prati salmastri, bassure inondabili e dossi
      sabbiosi depositati dal vento. Le condizioni edafiche severe consentono unicamente una vegetazione
      alofila specializzata: festuca delle sabbie, limonio ungherese, camomilla selvatica e assenzio marino.


      Accanto, i laghi dell'Alto Kiskunság raccontano la medesima evoluzione. Nella Prima Mappatura Militare
      del 1783-1784 apparivano come sterminate paludi d'acqua dolce alimentate dalle piene del Danubio. Gli
      argini costruiti a partire dagli anni 1840 isolarono la piana; senza apporti alluvionali, le conche si
      trasformarono in laghi sodici bianchi o neri. Ve ne furono centinaia, quasi tutti oggi asciutti in
      estate. I maggiori — Kis-rét, Zab-szék, Büdös-szék, Kelemen-szék e Fehér-szék — figurano tra le zone
      umide più preziose d'Ungheria.
    wildlife: >-
      L'eccellenza della steppa è rappresentata dall'avifauna, che si avvicenda con ritmo stagionale.


      In primavera stormi di limicoli migratori (pivieri e piovanelli) fanno tappa nelle bassure fangose. Il
      transito coincide con le spettacolari parate nuziali dell'[otarda comune](/especie/otis_tarda/): qui
      risiede la popolazione riproduttiva più consistente d'Ungheria. Con l'avanzare della stagione subentrano
      i nidificanti come il [falco cuculo](/especie/falco_vespertinus/), piccolo rapace coloniale cacciatore
      di insetti.


      A fine estate e in autunno la steppa si ripopola di migratori diretti a sud. Sugli specchi sodici
      sostano migliaia di oche selvatiche da autunno a primavera, affiancate da decine di migliaia di anatre:
      alzavole, fischioni, codoni e mestoloni. Nelle barene nidificano
      l'[avocetta](/especie/recurvirostra_avosetta/) e il cavaliere d'Italia, mentre un isolotto del
      Kelemen-szék ospita una colonia di gabbiani comuni. Il [falco di palude](/especie/circus_aeruginosus/)
      nidifica nei canneti di Kis-rét e Fehér-szék.


      L'inverno richiama rapaci e passeriformi nordici: tra due e sei [aquile di
      mare](/especie/haliaeetus_albicilla/) e aquile imperiali svernano sui laghi, insieme a smerigli e
      all'[albanella reale](/especie/circus_cyaneus/).


      Tra le piante spiccano orchidee selvatiche e iris nani sui dossi di loess. L'ululone dal ventre di fuoco
      e il tritone crestato popolano le pozze.
    visit: >-
      Il sentiero didattico di Apaj è la vera porta d'accesso all'area. Si sviluppa per poco più di un
      chilometro attraverso una zona umida rinaturata su vecchi bacini di piscicoltura, e su ciascuna
      estremità sorge un'alta torretta d'osservazione affacciata sulla puszta. Durante la camminata puoi
      apprendere la biologia degli uccelli di canneto e degli ambienti salmastri, e dal percorso si scorgono
      mandrie di bovini grigi ungheresi, una delle consistenze zootecniche maggiori della Grande Pianura
      Ungherese. Il periodo più indicato coincide con la primavera, l'inizio dell'estate e l'autunno, stagioni
      in cui le paludi brulicano di avifauna.


      Per gli uccelli acquatici l'altro appuntamento irrinunciabile è il sentiero dell'Avocetta a
      Fülöpszállás: 1300 metri con sei stazioni divulgative che conducono a un capanno d'avvistamento
      panoramico dove osservare e fotografare la fauna in ogni stagione. Primavera e autunno offrono i
      riscontri più generosi; nei mesi estivi conviene muoversi alle primissime ore del giorno o al tramonto,
      sempre provvisti di binocolo. I bufali d'acqua del parco pascolano sulle sponde del lago Kelemen, ragion
      per cui il tracciato corre protetto tra recinzioni elettrificate fino al capanno.


      Se desideri comprendere l'intero contesto prima di avventurarti sul terreno, la Casa della Natura a
      Kecskemét, centro visitatori della direzione del parco, offre un'esposizione permanente completa sulla
      storia della tutela ambientale in Ungheria, sui parchi nazionali e sugli ecosistemi compresi tra Danubio
      e Tibisco.
    history: >-
      Il Kiskunság è un paesaggio culturale forgiato dall'uomo e non un territorio incontaminato. Secondo i
      reperti archeologici, popolazioni pastorali abitarono la contrada sin dal tardo Eneolitico (terzo e
      quarto millennio a.C.), e sia i magiari che i cumani hanno perpetuato in seguito questo modello di
      sussistenza. La pastorizia estensiva vanta secoli di tradizione nelle steppe saline, e tuttora le razze
      autoctone di ovini e bovini impediscono la chiusura vegetazionale dei pascoli primari. Attorno ai bacini
      lacustri l'ente parco mantiene mandrie di bovini e bufali d'acqua per conservare aperti gli habitat
      palustri e alofili.


      Istituito nel 1975, il parco è il secondo più antico dell'Ungheria. Non costituisce un perimetro
      continuo bensì una composizione articolata di nove unità distinte, e la steppa dell'Alto Kiskunság, i
      laghi dell'Alto Kiskunság e il lago Kolon sono formalmente riconosciuti dalla Convenzione di Ramsar come
      zone umide di rilevanza internazionale. Gli specchi d'acqua sodici, inoltre, sono stati tra le prime
      aree naturali del paese a ricevere tale prestigiosa tutela.
    before: >-
      I settori sottoposti a protezione integrale rigorosa sono segnalati da cartelli perentori e possono
      essere percorsi unicamente dietro permesso scritto dell'amministrazione del parco o con
      l'accompagnamento di una guida ufficiale. Resta scrupolosamente sui sentieri tracciati: abbandonarli
      espone a gravi pericoli gli uccelli nidificanti a terra tra le erbe e la fauna fossoria. È
      tassativamente vietato fotografare l'avifauna a ridosso dei nidi e i capanni portatili richiedono la
      preventiva autorizzazione del parco. Gli autoveicoli possono viaggiare unicamente lungo la viabilità
      pubblica e su poche strade forestali segnalate; l'ente parco raccomanda caldamente di muoversi in
      bicicletta o mediante il treno.
    around: >-
      A soli 2 km si trova il [Kiskunsági Nemzeti Park -
      Apaji-szikesek](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), mentre la puszta di
      [Bugac](/lugar/kiskunsagi---bugac-puszta/) fa parte del medesimo parco. A ventotto chilometri si
      distende la piana alluvionale di [Gemenc](/lugar/gemenc-danube---forest-floodplain/) sul Danubio.


      Più lontane, la [Piana di Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) e la riserva serba
      [Pašnjaci velike rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) ospitano l'otarda e il falco cuculo,
      analogamente a [Rusanda](/lugar/park-prirode-rusanda/).
  pt:
    intro: >-
      Um grande rio ditou outrora o curso das águas, e a ação humana decidiu mais tarde expulsá-las. A estepe
      do Alto Kiskunság ocupa a antiga planície aluvial do Danúbio, cuja história ainda se lê na paisagem: os
      velhos esteiros fluviais desenham-se nas plantas e nas baixas inundáveis. Hoje constitui a segunda
      estepe salina mais vasta da Grande Planície Húngara depois de Hortobágy, reunindo 11.061 hectares de
      pastos salobros, prados alcalinos e charcos temporários no Parque Nacional de Kiskunság. A sua área mais
      emblemática é Apaj.
    landscape: >-
      A causa primordial assenta na hidrologia de drenagem. Quando a lezíria do Danúbio foi protegida por
      diques, os sais do solo concentraram-se acelerando a salinização. A drenagem sistemática iniciou-se na
      década de 1910 e a regularização fluvial completou a dessecação: as águas de primavera escoam por canais
      e o remanescente evapora sob o sol estival. A única massa de água permanente reside nos viveiros
      piscícolas de Apaj, abrangendo 450 hectares mantidos artificialmente.


      O panorama forma um mosaico singular: estepes alcalinas solonetz, prados salinos, lagoas temporárias e
      cristas arenosas de loesse modeladas pelo vento. As condições extremas — solos argilosos finos e teor
      salino elevado — favorecem uma flora halófita especializada: festuca-das-areias, salgadeira-húngara,
      camomila e losna-marítima.


      Contíguas à estepe, as lagoas do Alto Kiskunság viveram processo paralelo. No Primeiro Levantamento
      Militar de 1783-1784 figuravam como extensos pauis de água doce alimentados pelas cheias do Danúbio. Os
      diques construídos a partir da década de 1840 isolaram a planície; sem descargas fluviais, as depressões
      converteram-se em lagoas sódicas brancas ou negras. Houve centenas delas, a maioria hoje seca no verão.
      As maiores — Kis-rét, Zab-szék, Büdös-szék, Kelemen-szék e Fehér-szék — estão entre as zonas húmidas
      mais valiosas da Hungria.
    wildlife: >-
      O grande valor deste horizonte plano reside na sua avifauna ao longo das estações.


      Na primavera bandos de limícolas migratórias (maçaricos e pilritos) escalam as lamas rasas. O movimento
      coincide com as paradas nupciais da [abetarda-comum](/especie/otis_tarda/), albergando a região o maior
      núcleo reprodutor da Hungria. Mais tarde instalam-se os nidificantes de verão como o
      [falcão-vespertino](/especie/falco_vespertinus/), pequeno rapace colonial que caça grandes insetos.


      No final do verão e no outono a estepe recebe nova vaga de migradores rumo a sul. Nas lagoas sódicas
      pernoitam milhares de gansos selvagens de outono a primavera, ladeados por dezenas de milhares de patos:
      marrequinhas, piadeiras, arrábios e patos-trombeteiros. Nos sapais nidificam o
      [alfaiate](/especie/recurvirostra_avosetta/) e o pernilongo, enquanto uma ilhota de Kelemen-szék alberga
      uma colónia de guinchos-comuns. O [tartaranhão-dos-pauis](/especie/circus_aeruginosus/) nidifica nos
      caniçais de Kis-rét e Fehér-szék.


      O inverno atrai aves árticas e rapinas: entre duas e seis
      [águias-rabalvas](/especie/haliaeetus_albicilla/) e águias-imperiais invernam nas lagoas, ao lado do
      esmerilhão e do [tartaranhão-azulado](/especie/circus_cyaneus/).


      No solo florido desabrocham orquídeas selvagens e lírios anões nos montículos de loesse. O
      sapo-de-barriga-de-fogo e o tritão-de-crista povoam os charcos.
    visit: >-
      O trilho interpretativo de Apaj funciona como a porta de entrada por excelência. Percorre pouco mais de
      um quilómetro através de uma zona húmida recuperada sobre antigos viveiros de peixe, dispondo em cada
      extremidade de uma torre de observação elevada com vistas amplas sobre a puszta. Ao longo do caminho
      podes aprender sobre a ecologia dos caniçais e das aves de meios salobros, avistando-se a partir do
      percurso manadas de gado cinzento da Hungria, um dos maiores efetivos da Grande Planície Húngara. As
      melhores épocas para a visita são a primavera, o início do verão e o outono, alturas em que as zonas
      húmidas transbordam de vida avícola.


      Para a observação de aves aquáticas, a outra paragem obrigatória é o trilho do Alfaiate, em
      Fülöpszállás: 1300 metros com seis painéis temáticos que terminam num observatório coberto de onde se
      contemplam e fotografam aves em qualquer estação do ano. Na primavera e no outono a recompensa é máxima;
      no verão, aconselha-se uma visita a primeira hora da manhã ou ao cair da tarde, sempre acompanhado de
      binóculos. Como os búfalos-asiáticos do parque pastam nas margens do lago Kelemen, o trilho
      desenvolve-se com toda a segurança entre vedações elétricas até ao observatório.


      Se pretenderes compreender todo o ecossistema antes de seguir para o terreno, a Casa da Natureza em
      Kecskemét, centro de acolhimento da direção do parque, acolhe uma exposição permanente sobre a história
      da conservação na Hungria, os parques nacionais e os biótopos situados entre os rios Danúbio e Tisza.
    history: >-
      O Kiskunság é uma paisagem cultural moldada pela atividade pastoril e não um território intocado. De
      acordo com os achados arqueológicos, comunidades pastoris habitaram a região desde os finais da Idade do
      Cobre (terceiro e quarto milénios antes de Cristo), tradição de pastoreio que magiares e cumanos
      continuaram nos séculos seguintes. O pastoreio extensivo possui uma história secular nesta estepe
      salina, e hoje o gado ovino e bovino autóctone continua a ser fulcral para evitar o fecho dos pastos
      primários. Em redor dos lagos, a direção do parque mantém manadas de vacas e búfalos-asiáticos para
      conservar os sapais e os prados salinos abertos.


      Fundado em 1975, o parque é o segundo mais antigo da Hungria. Não consiste numa área contínua,
      configurando antes um mosaico de nove unidades isoladas, figurando a estepe do Alto Kiskunság, os lagos
      do Alto Kiskunság e o lago Kolon classificados pela Convenção de Ramsar como zonas húmidas de relevância
      internacional. Os lagos sódicos, ademais, estiveram entre os pioneiros em território nacional a receber
      essa importante tutela jurídica.
    before: >-
      Os setores sob reserva de proteção integral estão devidamente identificados por tabuletas de aviso e
      apenas podem ser acedidos mediante autorização escrita do parque ou acompanhado por um guarda
      credenciado. Mantém-te obrigatoriamente sobre os trilhos demarcados: sair dos caminhos coloca em risco
      as aves que nidificam no solo dos pastos e a fauna rasteira que vive na terra. É estritamente proibido
      fotografar aves nas imediações dos ninhos, e a utilização de abrigos fotográficos portáteis carece de
      consentimento prévio do parque. Os veículos automóveis só podem circular nas vias públicas e nalguns
      caminhos florestais autorizados, incentivando o parque o acesso de bicicleta ou de comboio.
    around: >-
      A apenas 2 km fica o [Kiskunsági Nemzeti Park -
      Apaji-szikesek](/lugar/kiskunsagi-nemzeti-park---apaji-szikesek/), integrando a puszta de
      [Bugac](/lugar/kiskunsagi---bugac-puszta/) o mesmo parque. A vinte e oito quilómetros estende-se a
      floresta de inundação de [Gemenc](/lugar/gemenc-danube---forest-floodplain/) no Danúbio.


      Mais longe, a [Planície de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) e a reserva sérvia
      [Pašnjaci velike rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) acolhem a abetarda e o
      falcão-vespertino, tal como [Rusanda](/lugar/park-prirode-rusanda/).
