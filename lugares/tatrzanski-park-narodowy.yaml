  es: >-
    La única alta montaña de tipo alpino de los Cárpatos: granito, lagos glaciares, rebeco de los Tatras y oso
    pardo.
  en: >-
    The only alpine-type high-mountain massif in the Carpathians: sharp granite ridges, glacial tarns, Tatra
    chamois, and brown bear.
  fr: >-
    Le seul massif de haute montagne de type alpin des Carpates : granite, lacs glaciaires, chamois des Tatras
    et ours brun.
  de: >-
    Das einzige alpine Hochgebirgsmassiv der Karpaten: schroffe Granitkämme, Karseen, Tatra-Gämse und
    Braunbär.
  it: >-
    L'unico massiccio d'alta montagna di tipo alpino dei Carpazi: creste di granito, laghi glaciali, camoscio
    dei Tatra e orso bruno.
  pt: >-
    A única alta montanha de tipo alpino dos Cárpatos: cristas de granito, lagoas glaciares,
    camurça-dos-tatras e urso-pardo.
