    La montaña caliza que separa los lagos Ohrid y Prespa, con flora endémica y vistas sobre los dos lagos a
    la vez.
  en: >-
    The limestone mountain separating Lakes Ohrid and Prespa, boasting endemic flora and vistas over both
    lakes simultaneously.
  fr: >-
    La montagne calcaire qui sépare les lacs d'Ohrid et de Prespa, offrant flore endémique et panoramas
    simultanés sur les deux lacs.
  de: Der Kalksteinzug zwischen den Seen Ohrid und Prespa mit reicher endemischer Flora und Doppelpanoramablick.
