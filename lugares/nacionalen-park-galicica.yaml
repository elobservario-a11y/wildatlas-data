texto:
  es:
    intro: >-
      Entre dos lagos se levanta una montaña de caliza, y esa montaña es Galičica. Desde sus alturas se ven a
      la vez el lago Ohrid y el Prespa, y su punto más alto, en Stara Galičica, al sur, llega a los 2.265 m.
      El parque nacional abarca la sierra, parte de la orilla oriental del Ohrid, la occidental del Prespa y
      la isla de Golem Grad, y al sur linda con el Parque Nacional de Prespa, en Albania.
    landscape: >-
      Galičica no es una cumbre aislada, sino una montaña con escalones. En su parte más alta, en Stara
      Galičica, hubo hielo: estudios de los años noventa identificaron dos circos glaciares, uno superior y
      otro inferior. Más abajo manda otra huella, la humana. El ser humano ha bajado artificialmente unos
      quinientos metros el límite natural del bosque, y la prueba son los pinos de los Balcanes que quedan
      aislados hasta los 2.150 m cerca del pico Magaro, por encima del bosque actual.


      Los pastizales secos que se extienden por las laderas tampoco son originales. Son formaciones
      secundarias que surgieron al degradarse el bosque primitivo de roble y haya bajos por el pastoreo, el
      fuego y otras actividades humanas, y hoy son hábitat de muchas plantas raras y amenazadas. El paisaje
      sigue cambiando. Entre los años cincuenta y 2007 el bosque pasó de cubrir alrededor del 40 % de la
      montaña al 58 %, sobre todo porque el matorral fue madurando, mientras que los pastos bajaron del 50 %
      de la superficie al 24 % al abandonarse la ganadería tradicional.


      Y en medio del Prespa flota Golem Grad, la isla de las Serpientes o de San Pedro, la mayor del país:
      unos 750 m de largo y 450 m de ancho. Allí se distinguen dos bosques, uno de enebros y otro de almendro
      silvestre y almez, y la culebra viperina y la lagartija común son mucho mayores que en el interior,
      mientras que las víboras chatas son enanas.
    wildlife: >-
      La riqueza de Galičica empieza por las plantas. Alberga 180 taxones leñosos, el 56 % de la flora leñosa
      del país, y veintitrés de ellos son endemismos balcánicos o subbalcánicos. Algunas especies leñosas,
      como el [pino de Heldreich](/especie/pinus_heldreichii/) o Prunus prostrata, solo crecen en Galičica o
      en una o dos montañas más del país. La montaña marca además el límite sur de especies como Juniperus
      sabina y el [pino de los Balcanes](/especie/pinus_peuce/), y el límite norte de otras como Acantholimon
      ulicinum. Una de las plantas endémicas, Erodium guicciardii, se descubrió por primera vez en Macedonia
      aquí. Entre las flores que presenta el gestor figuran la orquídea Dactylorhiza sambucina y la saxífraga
      Saxifraga paniculata.


      La fauna que el gestor destaca incluye al chotacabras europeo, a la chova piquigualda y al tritón
      crestado macedonio. En Golem Grad están presentes el [cormorán grande](/especie/phalacrocorax_carbo/) y
      el [pelícano ceñudo](/especie/pelecanus_crispus/).


      Los meses más recomendados para ir son mayo, junio, julio, septiembre y octubre.
    visit: >-
      El gestor clasifica sus senderos en tres tipos. Los H son los más ligeros y cortos, pensados para poco
      esfuerzo; los T, más pesados y largos; y los G son los más duros, por acantilados de montaña a más de
      1.600 m. Entre las rutas que sugiere hay una que sube del paso de Galičica a la cima de Magaro y
      regresa, otra que enlaza Peštani, San Spas y el paso de Galičica en un recorrido circular, y una tercera
      que pasa por la casa Šarbojca y la cueva Samotska Dupka antes de bajar a Velestovo. La ruta Kota
      10–Magaro está clasificada como difícil y orientada a senderistas con experiencia.


      El parque tiene un centro de información en Ohrid, junto a las oficinas del gestor.
    history: >-
      Las dos orillas de la montaña no viven igual. Los pueblos de la orilla del Ohrid, como Konjsko, Peštani,
      Trpejca y Ljubaništa, crecen en población pero pierden uso agrícola; los del lado del Prespa han perdido
      mucha población por la emigración, y sus campos abandonados se vuelven matorral y después bosque.


      El parque guarda también un patrimonio humano antiguo. Contiene el monasterio de San Naum y los restos
      de casas sobre pilotes en la orilla del Ohrid. San Naum de Ohrid levantó su iglesia en el año 900 y la
      dedicó a los santos arcángeles, y la iglesia de la Virgen Zahumska se construyó y decoró con frescos en
      1361, según la inscripción del fundador. En Golem Grad se conservan las iglesias de San Pedro y la
      medieval de San Dimitrija, y una basílica paleocristiana con restos de mosaico.
    before: >-
      El parque tiene página de entradas en la web del gestor, y la afluencia es media en la orilla del lago
      Ohrid en verano. Mira allí las condiciones de visita y los sectores abiertos antes de organizar la
      salida.
    around: >-
      A solo 8 km está el [Parque Nacional de Prespa (Grecia)](/lugar/ethniko-parko-prespon/), al otro lado
      del lago; a 12 km, el [Parque Nacional de Pelister](/lugar/nacionalen-park-pelister/); y a 19 km, el
      [Parque Nacional Shebenik-Jabllanicë - Bosque Primario de
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/). Más lejos, el [Parque Nacional Pirin
      - Bosque Salvaje](/lugar/pirin-national-park-forest-wilderness/) comparte con Galičica el rebeco, el oso
      pardo y el pino de los Balcanes, además de hábitats de alta montaña y karst.
  en:
    intro: >-
      Between two ancient lakes rises a limestone mountain, and that mountain is Galičica. From its heights
      you can see Lake Ohrid and Lake Prespa at the same time, and its highest elevation in Stara Galičica to
      the south reaches 2,265 m. The national park encompasses the mountain range, part of the eastern shore
      of Ohrid, the western shore of Prespa, and the island of Golem Grad, bordering Prespa National Park in
      Albania to the south.
    landscape: >-
      Galičica is not a single isolated peak, but a stepped karst mountain. Across its highest plateaus on
      Stara Galičica, Quaternary glaciations left distinct traces: geomorphological studies in the nineties
      identified two distinct cirques, an upper and a lower basin. Lower down, human history left an indelible
      mark: human activities artificially depressed the natural treeline by about five hundred metres,
      evidenced by isolated Macedonian pines surviving up to 2,150 m near Magaro peak above the contemporary
      forest.


      The dry pastures blanketing the slopes are secondary formations, created by centuries of pastoralism,
      burning, and woodcutting that degraded former oak and beech woods; today they provide vital habitat for
      rare endemic flora. Land cover continues to shift: between the fifties and 2007, forest cover expanded
      from around 40 % of the mountain to 58 %, primarily as abandoned pastures reverted to scrub and
      woodland, while open grasslands shrank from 50 % to 24 % following the decline of traditional livestock
      farming.


      In the middle of Lake Prespa lies Golem Grad (Snake Island or St. Peter's Island), the country's largest
      island, measuring some 750 m long and 450 m wide. It hosts two distinct forest types—one of Greek
      juniper, the other of wild almond and nettle tree—where dice snakes and common lizards exhibit island
      gigantism, while nose-horned vipers display dwarfism.
    wildlife: >-
      The biodiversity of Galičica begins with its botanical treasures. It supports 180 woody plant taxa,
      representing 56 % of North Macedonia's woody flora, of which twenty-three are Balkan or sub-Balkan
      endemics. Rare trees such as [Heldreich's pine](/especie/pinus_heldreichii/) and Prunus prostrata grow
      only in Galičica or one or two other mountain massifs nationally. The range marks the southern
      distribution limit for savin juniper and [Macedonian pine](/especie/pinus_peuce/), and the northern
      limit for Acantholimon ulicinum. The endemic herb Erodium guicciardii was first discovered here. Alpine
      meadows bloom with Dactylorhiza sambucina and Saxifraga paniculata.


      Notable fauna highlighted by park management includes the European nightjar, yellow-billed chough, and
      Macedonian crested newt. On Golem Grad, significant colonies of [great
      cormorants](/especie/phalacrocorax_carbo/) and [Dalmatian pelicans](/especie/pelecanus_crispus/) gather.


      The most rewarding visiting months are May, June, July, September, and October.
    visit: >-
      The park classifies its marked hiking network into three categories: H trails are gentle and short for
      casual walks; T trails are longer and moderately strenuous; and G trails are alpine routes tackling
      steep limestone ridges above 1,600 m. Popular itineraries include the ascent from Galičica Pass to
      Magaro summit and back, a circular circuit connecting Peštani, St. Spas, and Galičica Pass, and a trail
      passing Šarbojca hut and Samotska Dupka cave descending to Velestovo. The Kota 10–Magaro route is graded
      difficult and geared to experienced alpine hikers.


      The park operates a visitor information centre in Ohrid beside its administrative offices.
    history: >-
      The two flanks of the range experience contrasting human realities. Villages along the Ohrid
      shoreline—such as Konjsko, Peštani, Trpejca, and Ljubaništa—grow in residential population while
      reducing pastoral land use; settlements on the Prespa flank have seen severe depopulation from
      emigration, with abandoned farmland reverting to scrub and forest.


      The park also preserves deep cultural heritage, including the Monastery of St. Naum and prehistoric
      pile-dwelling remains along Lake Ohrid. St. Naum of Ohrid founded his monastery church in the year 900,
      dedicated to the holy archangels, while the Church of the Holy Virgin Zahumska was built and frescoed in
      1361. Golem Grad preserves the medieval churches of St. Peter and St. Demetrius, alongside early
      Christian basilica mosaics.
    before: >-
      Park entry tickets are available via the official park website, and summer crowds are moderate along
      Lake Ohrid shores. Verify open sectors and trail conditions before organizing excursions.
    around: >-
      Just 8 km away lies [Prespa National Park (Greece)](/lugar/ethniko-parko-prespon/) across the lake, 12
      km away is [Pelister National Park](/lugar/nacionalen-park-pelister/), and 19 km away is
      [Shebenik-Jabllanicë National Park - Rrajcë Primeval Beech
      Forest](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/). Farther away in Bulgaria, [Pirin
      National Park - Forest Wilderness](/lugar/pirin-national-park-forest-wilderness/) shares with Galičica
      chamois, brown bear, Macedonian pine, and glaciated limestone karst.
  fr:
    intro: >-
      Entre deux lacs anciens s'élève une haute montagne calcaire : la Galičica. Depuis ses crêtes, on
      embrasse à la fois le lac d'Ohrid et le lac Prespa, et son sommet le plus élevé, dans la Stara Galičica
      au sud, culmine à 2 265 m. Le parc national englobe la chaîne, une partie de la rive orientale d'Ohrid,
      la rive occidentale de Prespa et l'île de Golem Grad, bordant au sud le parc national de Prespa en
      Albanie.
    landscape: >-
      La Galičica n'est pas un sommet isolé mais une montagne étagée en gradins karstiques. Dans sa partie
      haute, sur la Stara Galičica, les glaciations ont laissé deux cirques distincts reconnus par les
      géomorphologues dans les années quatre-vingt-dix. Plus bas, l'homme a abaissé d'environ cinq cents
      mètres la limite forestière naturelle, comme en témoignent les pins de Macédoine isolés jusqu'à 2 150 m
      sous le pic Magaro.


      Les pelouses sèches des versants sont des formations secondaires issues de la dégradation des anciennes
      chênaies et hêtraies par le surpâturage et le feu ; elles abritent aujourd'hui de précieuses espèces
      endémiques. Entre les années cinquante et 2007, le couvert forestier est passé d'environ 40 % à 58 % de
      la montagne en raison de la fermeture des milieux, tandis que les pâturages régressaient de 50 % à 24 %.


      Au milieu du lac Prespa flotte Golem Grad (l'île aux Serpents), la plus grande île du pays : environ 750
      m de long pour 450 m de large. Deux boisements s'y distinguent, l'un de genévriers et l'autre
      d'amandiers sauvages et micocouliers, où les couleuvres vipérines affichent un gigantisme insulaire
      remarquable.
    wildlife: >-
      Le patrimoine de Galičica s'illustre avant tout par sa flore. Elle abrite 180 taxons ligneux, soit 56 %
      de la flore ligneuse nationale, dont vingt-trois endémiques balkaniques ou sub-balkaniques. Le [pin de
      Bosnie](/especie/pinus_heldreichii/) et Prunus prostrata n'y poussent que sur un ou deux autres massifs
      macédoniens. La montagne constitue la limite méridionale du genévrier sabine et du [pin de
      Macédoine](/especie/pinus_peuce/). Les pelouses accueillent Dactylorhiza sambucina et Saxifraga
      paniculata.


      La faune comprend l'engoulevent d'Europe, le chocard à bec jaune et le triton crêté macédonien. Sur
      Golem Grad nichent le [grand cormoran](/especie/phalacrocorax_carbo/) et le [pélican
      frisé](/especie/pelecanus_crispus/).


      Les mois les plus propices aux visites sont mai, juin, juillet, septembre et octobre.
    visit: >-
      Le parc classe ses itinéraires en trois catégories : les sentiers H faciles et courts ; les sentiers T
      intermédiaires ; et les tracés G alpins arpentant les crêtes au-dessus de 1 600 m. Les circuits
      recommandés incluent l'aller-retour du col de Galičica au mont Magaro, la boucle par Peštani et Sveti
      Spas, et la traversée par la grotte Samotska Dupka vers Velestovo. L'itinéraire Kota 10–Magaro s'adresse
      aux randonneurs confirmés.


      Le centre d'accueil des visiteurs est situé à Ohrid, à côté du siège du parc.
    history: >-
      Les deux rives de la montagne connaissent des dynamiques opposées. Les villages riverains d'Ohrid comme
      Konjsko, Peštani, Trpejca et Ljubaništa voient leur population croître mais délaissent l'agriculture ;
      côté Prespa, l'émigration a dépeuplé les villages, laissant les terres retourner à la friche et au
      boisement.


      Le parc recèle un riche héritage culturel avec le monastère de Saint-Naum et des habitats lacustres
      anciens. Saint Naum d'Ohrid bâtit son église en l'an 900, tandis que l'église Sainte-Marie Zahumska fut
      érigée et ornée de fresques en 1361. Golem Grad abrite les églises de Saint-Pierre et de
      Saint-Démétrius.
    before: >-
      La billetterie est accessible sur le site web du parc ; l'affluence est moyenne sur les berges du lac
      d'Ohrid en été. Renseignez-vous sur les secteurs ouverts avant de partir.
    around: >-
      À 8 km seulement s'étend le [parc national de Prespa (Grèce)](/lugar/ethniko-parko-prespon/), à 12 km le
      [parc national de Pelister](/lugar/nacionalen-park-pelister/) et à 19 km le [parc national de
      Shebenik-Jabllanicë - forêt primaire de
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/). Plus loin, le [parc national de
      Pirin - forêt sauvage](/lugar/pirin-national-park-forest-wilderness/) partage chamois, ours brun et pin
      de Macédoine.
  de:
    intro: >-
      Zwischen zwei alten Seen erhebt sich ein hoher Kalksteinrücken, und dieses Gebirge ist die Galičica. Von
      seinen Höhen blickt man zugleich auf den Ohridsee und den Prespasee, und der höchste Punkt in der Stara
      Galičica im Süden erreicht 2.265 m. Der Nationalpark umfasst das Gebirge, Teile des Ostufers von Ohrid,
      das Westufer von Prespa und die Insel Golem Grad, südlich angrenzend an den Prespa-Nationalpark in
      Albanien.
    landscape: >-
      Die Galičica ist kein isolierter Einzelgipfel, sondern ein terrassiertes Karstgebirge. Auf der Stara
      Galičica hinterließen eiszeitliche Gletscher deutliche Spuren: Untersuchungen in den neunziger Jahren
      wiesen zwei Karkessel nach. Weiter talwärts dominiert menschlicher Einfluss: Die natürliche Waldgrenze
      wurde durch Beweidung und Rodung um rund fünfhundert Meter abgesenkt; Zeugen sind vereinzelte
      Mazedonische Kiefern, die bis 2.150 m nahe dem Magaro-Gipfel über dem Waldrand stehen.


      Die Trockenrasen der Hänge sind sekundäre Pflanzengesellschaften, entstanden durch historische
      Walddegradation, die heute vielen gefährdeten Arten Raum bieten. Die Vegetation verändert sich
      fortlaufend: Zwischen den fünfziger Jahren und 2007 stieg die Bewaldung von rund 40 % auf 58 % der
      Gebirgsfläche an, während offene Weiden von 50 % auf 24 % zurückgingen, da die traditionelle
      Wanderschäferei nachließ.


      Mitten im Prespasee liegt Golem Grad (Schlangeninsel), die größte Insel des Landes: etwa 750 m lang und
      450 m breit. Dort stocken Wacholder- und Zürgelbaum-Mandel-Wälder; Würfelnattern und Mauereidechsen
      zeigen Inselriesenwuchs, während Hornottern auffallend kleinwüchsig sind.
    wildlife: >-
      Der Artenreichtum der Galičica wurzelt in der Flora. Das Massiv beherbergt 180 Gehölzsippen, das sind 56
      % der Holzgewächse des Landes, darunter dreiundzwanzig balkanische Endemiten. Seltene Gehölze wie
      [Schlangenhaut-Kiefer](/especie/pinus_heldreichii/) oder Zwerg-Kirsche wachsen landesweit fast nur hier.
      Das Gebirge markiert die Südgrenze für Sadebaum und [Mazedonische Kiefer](/especie/pinus_peuce/) sowie
      die Nordgrenze für Acantholimon ulicinum. Die endemische Erodium guicciardii wurde hier entdeckt. Auf
      Bergwiesen blühen Dactylorhiza sambucina und Saxifraga paniculata.


      Zu den faunistischen Besonderheiten zählen Ziegenmelker, Alpendohle und Mazedonischer Kammmolch. Auf
      Golem Grad brüten [Kormoran](/especie/phalacrocorax_carbo/) und
      [Krauskopfpelikan](/especie/pelecanus_crispus/).


      Beste Reisemonate sind Mai, Juni, Juli, September und Oktober.
    visit: >-
      Die Parkverwaltung teilt das Wegenetz in drei Kategorien ein: H-Wege sind leicht und kurz; T-Wege
      mittelschwer und länger; G-Pfade führen als alpine Steige über Grate oberhalb von 1.600 m.
      Empfehlenswerte Touren führen vom Galičica-Pass zum Magaro-Gipfel, als Rundweg über Peštani und St.
      Spas, oder über die Šarbojca-Hütte zur Samotska-Dupka-Höhle hinab nach Velestovo. Die Route Kota
      10–Magaro gilt als anspruchsvoll für erfahrene Alpinisten.


      Ein Besucherzentrum befindet sich in Ohrid nahe der Parkverwaltung.
    history: >-
      Die beiden Uferseiten entwickeln sich unterschiedlich. Die Dörfer am Ohridsee wie Konjsko, Peštani,
      Trpejca und Ljubaništa wachsen, verlieren aber landwirtschaftliche Flächen; am Prespasee führte
      Abwanderung zur Verbuschung alter Äcker.


      Der Park birgt reiches Kulturerbe: das Kloster Sveti Naum und prähistorische Pfahlbauten am Ohridsee.
      Der heilige Naum gründete seine Kirche im Jahr 900, während die Kirche der Muttergottes von Zahum 1361
      mit Fresken erbaut wurde. Auf Golem Grad stehen die Peterskirche, die Demetriuskirche und
      frühchristliche Mosaike.
    before: >-
      Tickets sind online über die Parkwebsite erhältlich; am Ohridsee herrscht im Sommer reger Betrieb.
      Informiere dich vorab über offene Sektoren und Wegverhältnisse.
    around: >-
      Nur 8 km entfernt liegt der [Prespa-Nationalpark (Griechenland)](/lugar/ethniko-parko-prespon/) jenseits
      des Sees, 12 km entfernt der [Pelister-Nationalpark](/lugar/nacionalen-park-pelister/) und 19 km der
      [Shebenik-Jabllanicë-Nationalpark – Urwald
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/). Weiter entfernt teilt der
      [Pirin-Nationalpark – Urwaldwildnis](/lugar/pirin-national-park-forest-wilderness/) Gams, Braunbär und
      Mazedonische Kiefer.
  it:
    intro: >-
      Tra due antichi bacini si erge un alto rilievo calcareo: la Galičica. Dalle sue creste si ammirano
      simultaneamente il lago di Ocrida e il lago Prespa, e il punto più alto, nella Stara Galičica a sud,
      raggiunge i 2.265 m. Il parco nazionale comprende la catena, parte della sponda orientale di Ocrida,
      quella occidentale di Prespa e l'isola di Golem Grad, confinando a sud con il Parco Nazionale di Prespa
      in Albania.
    landscape: >-
      La Galičica non è una cima isolata, bensì una montagna a gradoni carsici. Nella sua parte sommitale,
      sulla Stara Galičica, i ghiacciai quaternari modellarono due distinti circhi glaciali identificati negli
      anni novanta. Più in basso emerge l'impronta pastorale umana, che ha abbassato di circa cinquecento
      metri il limite naturale del bosco: ne sono testimoni isolati pini macedoni che sopravvivono sino a
      2.150 m presso il picco Magaro.


      I pascoli aridi che fasciano i versanti sono formazioni secondarie, scaturite dalla degradazione delle
      antiche foreste di querce e faggi per pascolo e incendi; oggi costituiscono l'habitat di numerose specie
      rare ed endemiche. La copertura vegetale muta nel tempo: tra gli anni cinquanta e il 2007 il manto
      forestale è passato da circa il 40 % al 58 % della superficie, mentre le praterie sono scese dal 50 % al
      24 % per l'abbandono dell'allevamento tradizionale.


      In mezzo al lago Prespa emerge Golem Grad (l'isola dei Serpenti), la maggiore del paese: lunga 750 m e
      larga 450 m. Vi prosperano formazioni a ginepro greco e boschi di mandorlo selvatico e bagolaro, dove le
      bisce tassellate mostrano gigantismo insulare.
    wildlife: >-
      Il patrimonio di Galičica risiede anzitutto nella flora. Ospita 180 taxa legnosi, pari al 56 % della
      flora legnosa nazionale, con ventitré endemismi balcanici. Piante come il [pino
      loricato](/especie/pinus_heldreichii/) e Prunus prostrata crescono unicamente qui o su pochissimi altri
      massicci del paese. La catena segna il limite meridionale del ginepro sabina e del [pino
      macedone](/especie/pinus_peuce/). Sui prati alpini fioriscono Dactylorhiza sambucina e Saxifraga
      paniculata.


      Tra la fauna spiccano succiacapre, gracchio corallino e tritone crestato macedone. A Golem Grad
      nidificano il [marangone maggiore](/especie/phalacrocorax_carbo/) e il [pellicano
      riccio](/especie/pelecanus_crispus/).


      I mesi più indicati per le escursioni sono maggio, giugno, luglio, settembre e ottobre.
    visit: >-
      L'ente gestore articola i percorsi in tre livelli: H per le passeggiate brevi e turistiche; T per i
      percorsi intermedi; G per i sentieri alpinistici lungo creste calcaree oltre 1.600 m. Tra le vie
      consigliate spiccano la salita dal passo di Galičica al Magaro, l'anello tra Peštani, Sveti Spas e il
      valico, e il tragitto per la grotta Samotska Dupka verso Velestovo. La via Kota 10–Magaro è classificata
      impegnativa per escursionisti esperti.


      Il centro visite si trova a Ocrida presso gli uffici amministrativi.
    history: >-
      I due versanti vivono realtà opposte. I borghi sul lago di Ocrida come Konjsko, Peštani, Trpejca e
      Ljubaništa crescono ma abbandonano l'agricoltura; sul versante di Prespa l'emigrazione ha spopolato i
      paesi favorendo il ritorno spontaneo del bosco.


      Il parco racchiude memorie storiche insigni, dal monastero di San Naum ai resti palafitticoli sul lago
      di Ocrida. San Naum fondò la chiesa nell'anno 900, mentre la chiesa della Vergine Zahumska fu affrescata
      nel 1361. A Golem Grad sorgono le chiese di San Pietro e San Demetrio.
    before: >-
      I biglietti si acquistano online sul sito del parco; la frequentazione è media sulle rive del lago di
      Ocrida in estate. Verifica i percorsi aperti prima di salire.
    around: >-
      A soli 8 km sorge il [Parco Nazionale di Prespa (Grecia)](/lugar/ethniko-parko-prespon/), a 12 km il
      [Parco Nazionale del Pelister](/lugar/nacionalen-park-pelister/) e a 19 km il [Parco Nazionale
      Shebenik-Jabllanicë - Faggeta Primaria di
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/). Più a est, il [Parco Nazionale del
      Pirin - Foresta Primordiale](/lugar/pirin-national-park-forest-wilderness/) condivide camosci, orsi
      bruni e pini balcanici.
  pt:
    intro: >-
      Entre dois lagos antigos ergue-se uma alta cordilheira calcária: a Galičica. Das suas cristas avistam-se
      em simultâneo o lago Ohrid e o lago Prespa, e o seu ponto culminante, em Stara Galičica a sul, atinge os
      2.265 m. O parque nacional abrange a serra, parte da margem oriental de Ohrid, a margem ocidental de
      Prespa e a ilha de Golem Grad, confinando a sul com o Parque Nacional de Prespa na Albânia.
    landscape: >-
      A Galičica não é um cume isolado, mas uma montanha escalonada em socalcos cársticos. No setor cimeiro de
      Stara Galičica, os glaciares quaternários deixaram vestígios nítidos identificados nos anos noventa em
      dois circos glaciares. Mais abaixo prevalece a ação humana, que rebaixou cerca de quinhentos metros o
      limite da floresta: prova disso são os pinheiros-dos-balcãs que sobrevivem isolados até aos 2.150 m
      perto do pico Magaro.


      As pastagens secas nas encostas são comunidades secundárias que despontaram da degradação dos carvalhais
      e faiais primitivos pelo pastoreio; hoje servem de habitat a plantas raras. A paisagem continua a mudar:
      entre os anos cinquenta e 2007 a área florestada subiu de 40 % para 58 % da serra, enquanto os prados
      recuaram de 50 % para 24 % com o abandono do pastoreio tradicional.


      No centro do lago Prespa ergue-se Golem Grad (ilha das Serpentes), a maior do país: cerca de 750 m de
      comprimento e 450 m de largura. Acolhe bosques de zimbro-grego e amendoeira-brava, onde as
      cobras-de-água-viperinas exibem gigantismo insular.
    wildlife: >-
      O valor da Galičica reside na sua flora. Alberga 180 táxons lenhosos, representando 56 % da flora
      lenhosa nacional, vinte e três dos quais são endemismos balcânicos. Espécies como o
      [pinheiro-da-Bósnia](/especie/pinus_heldreichii/) ou Prunus prostrata só medram aqui ou em pouquíssimas
      montanhas do país. A cordilheira marca o limite sul do zimbro-sabina e do
      [pinheiro-da-macedónia](/especie/pinus_peuce/). Nos prados alpinos vicejam Dactylorhiza sambucina e
      Saxifraga paniculata.


      A fauna inclui noitibó-da-europa, gralha-de-bico-amarelo e tritão-de-crista-macedónio. Em Golem Grad
      nidificam o [corvo-marinho-de-faces-brancas](/especie/phalacrocorax_carbo/) e o
      [pelicano-crespo](/especie/pelecanus_crispus/).


      Os meses mais favoráveis para caminhadas são maio, junho, julho, setembro e outubro.
    visit: >-
      O parque classifica os seus trilhos em três níveis: percursos H para passeios ligeiros; percursos T mais
      extensos; e trilhos G para travessias alpinas em escarpas acima de 1.600 m. Entre as rotas destacam-se a
      subida do colo de Galičica ao pico Magaro, a volta circular entre Peštani e Sveti Spas, e o trilho pela
      gruta Samotska Dupka até Velestovo. A rota Kota 10–Magaro exige experiência de montanha.


      O centro de informação aos visitantes localiza-se em Ohrid junto à administração do parque.
    history: >-
      As duas vertentes da montanha registam realidades sociais distintas. As aldeias ribeirinhas de Ohrid
      como Konjsko, Peštani, Trpejca e Ljubaništa ganham população mas perdem área agrícola; na vertente de
      Prespa a emigração despovoou aldeias, permitindo o avanço natural da mata.


      O parque preserva património histórico como o mosteiro de São Naum e sítios palafíticos em Ohrid. São
      Naum fundou a igreja no ano 900, enquanto a igreja da Mãe de Deus Zahumska foi erigida em 1361. Em Golem
      Grad subsistem as igrejas medievais de São Pedro e São Demétrio.
    before: >-
      A aquisição de bilhetes é feita no portal do parque; a afluência é média na orla do lago Ohrid no verão.
      Consulta os trilhos abertos antes de partir.
    around: >-
      A apenas 8 km situa-se o [Parque Nacional de Prespa (Grécia)](/lugar/ethniko-parko-prespon/), a 12 km o
      [Parque Nacional de Pelister](/lugar/nacionalen-park-pelister/) e a 19 km o [Parque Nacional
      Shebenik-Jabllanicë - Floresta Virgem de
      Rrajcë](/lugar/parku-kombetar-shebenik-jabllanice---pylli-primar/). Mais a leste, o [Parque Nacional de
      Pirin - Floresta Virgem](/lugar/pirin-national-park-forest-wilderness/) partilha camurças, ursos e
      pinheiros balcânicos.
