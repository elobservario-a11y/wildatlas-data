    La dorsale calcarea che divide i laghi di Ocrida e Prespa, ricca di flora endemica e scorci su entrambi i
    bacini.
  pt: >-
    A montanha calcária que separa os lagos Ohrid e Prespa, com flora endémica e panorâmicas simultâneas sobre
    ambos os lagos.
unico:
  es: >-
    Una montaña caliza entre dos lagos que fue refugio de la vida durante las glaciaciones y que aún guarda
    plantas que casi no crecen en otro lugar del país.
  en: >-
    A limestone mountain between two ancient lakes that acted as an ice age refugium, still preserving plant
    species found nowhere else in the country.
  fr: >-
    Une montagne calcaire entre deux lacs qui servit de refuge lors des glaciations et abrite des plantes
    introuvables ailleurs dans le pays.
  de: >-
    Ein Kalkberg zwischen zwei Seen, der eiszeitliches Refugium war und Pflanzen bewahrt, die im Land fast
    nirgends sonst vorkommen.
  it: >-
    Una montagna calcarea tra due laghi che funse da rifugio durante le glaciazioni e conserva specie vegetali
    quasi uniche nel paese.
  pt: >-
    Uma montanha calcária entre dois lagos que serviu de refúgio nas glaciações e abriga plantas que quase não
    crescem noutro local do país.
observaciones:
  es: >-
    El parque tiene página de entradas en la web del gestor, y la afluencia es media en la orilla del lago
