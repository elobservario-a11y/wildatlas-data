resumen:
  es: >-
    El único desierto propiamente dicho del continente europeo (badlands de cárcavas, ramblas secas y estepa
    árida).
  en: >-
    The only proper desert on the European continent, an extreme badlands landscape where torrential downpours
    have sculpted canyons and ravines, celebrated as the backdrop for legendary spaghetti westerns.
  fr: >-
    L'unique véritable désert du continent européen, un paysage extrême de badlands où les pluies
    torrentielles ont sculpté ravins et ramblas, rendu célèbre par les tournages légendaires de westerns.
  de: >-
    Die einzige echte Wüste des europäischen Kontinents, eine extreme Badlands-Landschaft, in der
    sintflutartige Regengüsse Schluchten und Ramblas geformt haben, weltbekannt als Kulisse legendärer
    Italowestern.
  it: >-
    L'unico vero deserto del continente europeo, un paesaggio estremo di calanchi in cui piogge torrenziali
    hanno scavato forre e ramblas, reso celebre come set di leggendari spaghetti western.
  pt: >-
    O único deserto genuíno do continente europeu, uma paisagem extrema de badlands onde chuvas torrenciais
    talharam desfiladeiros e ramblas, celebrizado como cenário de lendários spaghetti westerns.
unico:
  es: >-
    Aquí la erosión se puede leer a pie de cárcava, en formas que van desde el microcráter de una gota hasta
    el barranco, como en un museo natural a escala real.
  en: >-
    Here erosion can be read at the foot of every gully, in landforms ranging from raindrop micro-craters to
    sweeping canyons, like a full-scale outdoor geological museum.
  fr: >-
    Ici, l'érosion se lit au pied de chaque ravine, dans des modelés allant du micro-cratère de goutte de
    pluie au vaste canyon, comme dans un musée naturel grandeur nature.
  de: >-
    Hier lässt sich die Erosion am Fuß jeder Schlucht ablesen, in Formen vom Regentropfen-Mikrokrater bis zum
    tiefen Canyon, wie in einem Freilichtmuseum im Maßstab eins zu eins.
  it: >-
    Qui l'erosione si può leggere ai piedi di ogni calanco, in morfologie che spaziano dal micro-cratere di
    una goccia alla forra scoscesa, come in un museo naturale a grandezza naturale.
  pt: >-
    Aqui a erosão pode ser decifrada ao sopé de cada ravina, em modelados que vão da microcratera de uma gota
    de chuva ao desfiladeiro imponente, como num museu natural à escala real.
observaciones:
  es: >-
    Evita el verano: el calor es abrasador. No arrojes cigarrillos ni nada que produzca combustión, para
    evitar incendios. Llévate la basura hasta el contenedor más próximo y no abandones mascotas en la
    naturaleza, porque ponen en peligro la flora y la fauna. Antes de organizar la salida, consulta al gestor
    las condiciones de visita y los sectores abiertos al público.
texto:
  es:
    intro: >-
      Llueve poco, y cuando llueve, llueve mal. Las precipitaciones no llegan a 250 mm al año y caen a
      chaparrones, en un suelo de margas y areniscas que no retiene la humedad. La escorrentía talla cárcavas,
      crestas y ramblas; entre ellas crece una vegetación adaptada a la aridez. Así nació el Paraje Natural
      Desierto de Tabernas, en Almería, un paisaje de badlands donde se pueden seguir las formas que deja la
      erosión.
    landscape: >-
      El Desierto de Tabernas está al norte de la ciudad de Almería, entre las sierras de los Filabres y
      Alhamilla, en un conjunto de relieves que incluye Gádor y Sierra Nevada. Esa situación lo aísla de las
      corrientes húmedas del Mediterráneo, y el resultado es un clima de contrastes: unos 17,9 °C de media
      anual, con medias de 9 °C en enero y 24,5 °C en agosto. Llueve algo más de 200 mm al año, y solo una
      tercera parte cae en la temporada de calor, de mayo a octubre.


      Para entender el relieve hay que volver al mar. Hace unos ocho millones de años la costa llegaba hasta
      el borde de los Filabres, y allí quedan como prueba arrecifes de coral fósil. Los abanicos submarinos
      que se formaron en el fondo dejaron turbiditas, capas alternas de margas y arenas, y esa es la roca
      sobre la que hoy trabaja la erosión. Entre sus recursos hay también sismitas, yesos de la crisis de
      desecación del Mediterráneo y el Cerro Alfaro.


      El agua hace el resto. Los wadis, ríos torrenciales de desierto, solo llevan agua, barro y piedras
      durante las avenidas. En las laderas la escorrentía deja microcráteres de gotas de lluvia, chimeneas de
      hadas, surcos y gullies, cárcavas profundas de paredes verticales. Y bajo el suelo la tubificación abre
      conductos de dimensiones de interés espeleológico.


      En las ramblas, junto a afloramientos de agua casi siempre salinos, hay auténticos oasis con carrizos y
      tarajes que disputan el terreno a plantas halófilas.
    wildlife: >-
      La flora se adapta: hojas duras y pequeñas, como las de la salicornia que coloniza los márgenes de las
      ramblas, o ciclos tan rápidos que las efímeras germinan, florecen y dan semilla antes de que acabe la
      humedad. Entre las plantas características está Euzomodendron bourgaeanum, un endemismo almeriense que
      crece sobre las margas y florece durante los primeros cinco meses del año. En las primaveras lluviosas,
      la moricandia florece sobre los taludes margosos.


      Las aves se ven sobre todo en los cursos de las ramblas y en las paredes donde se refugian y nidifican:
      el vencejo real, el avión roquero, el roquero solitario y la grajilla. En los taludes anidan también la
      carraca, el mochuelo común, la collalba rubia, el gorrión chillón y el camachuelo trompetero. El
      abejaruco hace sus nidos en cavidades que excava en los taludes, lejos de depredadores como la culebra
      de herradura. La perdiz roja anida junto a los espartales; el halcón peregrino y el águila perdicera de
      sierra Alhamilla cazan aquí, y el búho real caza conejos y pequeños roedores. Hay además aves
      esteparias, como cogujadas, terreras, alcaravanes, sisones y ortegas.


      Entre los reptiles abundan la lagartija colirroja, el lagarto ocelado y la culebra de escalera, junto a
      la rana común y el sapo corredor. Entre los mamíferos hay zorros, conejos, lirones caretos y erizos
      morunos y comunes.
    visit: >-
      Tabernas es una referencia para preparar la salida al desierto. Antes de entrar en las ramblas, consulta
      los accesos y las condiciones de visita; el relieve se entiende tanto en las paredes de los cauces como
      en las laderas acarcavadas. Las aves se observan mejor en las ramblas y en las paredes del desierto, y
      las formas de erosión, desde las chimeneas de hadas hasta las cárcavas de las laderas.


      La mejor época va de otoño a primavera, para evitar el calor abrasador del verano.
    history: >-
      El paraje se declaró en 1989 como Paraje Natural y Zona de Especial Protección para las Aves, y en 2016
      se añadió la figura de Zona de Especial Conservación. Abarca 11.448,49 hectáreas repartidas entre cinco
      municipios almerienses. La flora tiene un elevado número de endemismos exclusivos del área y especies
      raras a escala mundial.


      Desde finales de los años 1950 se han rodado en este desierto más de 300 películas, la mayoría westerns.
      En 2020 la Academia de Cine Europeo le otorgó la distinción de Tesoro de la Cultura Cinematográfica
      Europea.
    before: >-
      Evita el verano: el calor es abrasador. No arrojes cigarrillos ni nada que produzca combustión, para
      evitar incendios. Llévate la basura hasta el contenedor más próximo y no abandones mascotas en la
      naturaleza, porque ponen en peligro la flora y la fauna. Antes de organizar la salida, consulta al
      gestor las condiciones de visita y los sectores abiertos al público.
    around: >-
      Otros espacios de la provincia son el [Parque Nacional y Natural de Sierra
      Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/) y el [Parque Natural Marítimo-Terrestre del
      Cabo de Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/).
  en:
    intro: >-
      It rains rarely, and when it rains, it pours with violence. Annual precipitation falls short of 250 mm
      and arrives in sudden torrential downpours onto marl and sandstone soils that cannot retain moisture.
      Sheetwash and runoff carve gullies, sharp crests, and dry rambla riverbeds; between them clings
      vegetation finely tuned to severe aridity. This is how the Tabernas Desert Natural Area in Almería was
      forged—a stark badlands landscape where you can read every form shaped by erosion.
    landscape: >-
      The Tabernas Desert lies north of the city of Almería, cradled between the Filabres and Alhamilla
      mountain ranges, within a wider mountain setting that includes Gádor and the Sierra Nevada. This
      geographical shield isolates it from moist Mediterranean sea breezes, producing a climate of intense
      contrasts: an annual mean around 17.9 °C, averaging 9 °C in January and 24.5 °C in August. Annual
      rainfall slightly exceeds 200 mm, with barely one-third falling during the hot season from May to
      October.


      To understand this relief, one must delve into ancient seas. Some eight million years ago, the
      prehistoric shoreline reached the flanks of the Filabres, leaving fossil coral reefs as enduring
      evidence. Submarine fans formed across the deep seafloor, depositing turbidites—alternating strata of
      marls and sands—which constitute the fragile rock foundation sculpted by modern erosion. Other
      geological treasures include seismites, gypsum deposits dating to the Messinian Salinity Crisis, and the
      prominent crest of Cerro Alfaro.


      Water does the rest. Desert wadis—the ramblas—carry water, mud, and boulders only during episodic flash
      floods. On bare hillsides, runoff leaves micro-craters from falling raindrops, fairy chimneys, rills,
      and deep vertical gullies. Underground, piping processes carve out subterranean conduits of true
      speleological dimensions.


      Along the ramblas, beside groundwater seepages that are almost invariably saline, genuine oases appear,
      where reeds and tamarisks compete for terrain with specialized halophytic plants.
    wildlife: >-
      Flora adapts ingeniously: small, leathery foliage, like the glasswort colonizing rambla verges, or life
      cycles so rapid that ephemerals germinate, bloom, and set seed before fleeting moisture vanishes. Among
      distinctive plants is Euzomodendron bourgaeanum, an Almerian endemic shrub that grows on eroded marls
      and blooms during the first five months of the year. Following rainy springs, moricandia blooms
      vibrantly across marl slopes.


      Birdlife concentrates along the rambla corridors and on sheer cliffs offering shelter and nesting sites:
      the alpine swift, crag martin, blue rock thrush, and western jackdaw. On cliff faces nest the European
      roller, little owl, black-eared wheatear, rock sparrow, and trumpeter finch. European bee-eaters
      excavate nest burrows deep in sandy banks, safe from predators such as the horseshoe whip snake. The
      red-legged partridge nests beside esparto grasslands; the peregrine falcon and Bonelli's eagle from the
      Sierra Alhamilla hunt here, while the Eurasian eagle-owl preys on rabbits and small rodents. Steppe
      birds also thrive, including crested larks, short-toed larks, stone-curlews, little bustards, and
      black-bellied sandgrouse.


      Reptiles are well represented by the spiny-footed lizard, ocellated lizard, and ladder snake, alongside
      the Perez's frog and natterjack toad. Mammals include red foxes, European rabbits, garden dormice, and
      both Algerian and European hedgehogs.
    visit: >-
      Tabernas is an exceptional landscape for desert hiking. Before venturing into the ramblas, check access
      routes and visitation guidelines; the desert structure reveals itself both on the walls of dry riverbeds
      and across gullied slopes. Birds are best observed along the ramblas and sheer desert bluffs, alongside
      textbook erosion landforms ranging from fairy chimneys to badland gullies.


      The ideal hiking window spans autumn through spring, avoiding the scorching heat of summer.
    history: >-
      The area was officially designated in 1989 as a Natural Area and Special Protection Area for birds,
      followed in 2016 by classification as a Special Area of Conservation. It encompasses 11,448.49 hectares
      divided across five Almerian municipalities. The local flora features an exceptional number of narrow
      endemics exclusive to this basin alongside globally rare species.


      Since the late 1950s, more than 300 films have been shot in this desert, predominantly spaghetti
      westerns. In 2020 the European Film Academy honored the desert with the title of Treasure of European
      Film Culture.
    before: >-
      Avoid summer: the desert heat is punishing and dangerous. Never discard cigarette butts or anything that
      could cause combustion, in order to prevent wildfires. Pack out all rubbish to the nearest roadside bin
      and never release domestic animals into the wild, where they threaten vulnerable native wildlife. Check
      current access conditions and open sectors with the park administration before setting out.
    around: >-
      Other notable protected spaces in Almería include the [Sierra Nevada National and Natural
      Park](/lugar/parque-nacional-y-natural-de-sierra-nevada/), visible on the horizon, and the [Cabo de
      Gata-Níjar Natural Park](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), with its
      volcanic sea cliffs and arid coastal salt pans.
  fr:
    intro: >-
      Il pleut rarement, et quand il pleut, c'est un déluge violent. Les précipitations n'atteignent pas 250
      mm par an et tombent sous forme d'averses brutales sur un sol de marnes et de grès incapable de retenir
      l'humidité. Le ruissellement taille des ravines, des crêtes déchiquetées et des ramblas ; entre elles
      s'accroche une végétation remarquablement adaptée à l'aridité. C'est ainsi qu'est né le Paraje Natural
      Desierto de Tabernas, en Almería, un paysage de badlands où l'on peut déchiffrer chaque forme façonnée
      par l'érosion.
    landscape: >-
      Le désert de Tabernas s'étend au nord de la ville d'Almería, abrité entre les sierras de los Filabres et
      Alhamilla, au cœur d'un ensemble montagneux comprenant Gádor et la Sierra Nevada. Cette situation
      l'isole des masses d'air humides de la Méditerranée, engendrant un climat de vifs contrastes : environ
      17,9 °C de moyenne annuelle, avec 9 °C en janvier et 24,5 °C en août. Il pleut un peu plus de 200 mm par
      an, et seul un tiers des pluies tombe pendant la saison chaude, de mai à octobre.


      Pour comprendre ce relief, il faut remonter aux fonds marins. Il y a environ huit millions d'années, le
      rivage atteignait la bordure des Filabres, laissant des récifs de coraux fossiles comme preuve tangible.
      Les cônes sous-marins formés dans les abysses ont déposé des turbidites, couches alternées de sables et
      de marnes, qui constituent la roche fragile attaquée aujourd'hui par l'érosion. Parmi ses richesses
      géologiques figurent aussi des séismites, des gypses issus de la crise de salinité messinienne et
      l'éperon du Cerro Alfaro.


      L'eau accomplit le reste. Les wadis désertiques — les ramblas — ne charrient eau, boue et pierres que
      lors de crues éclair. Sur les versants, le ruissellement sculpte des micro-cratères de gouttes de pluie,
      des cheminées de fées, des rigoles et de profonds gullies aux parois verticales. Sous la surface, le
      phénomène de suffosion souterraine (piping) creuse de véritables conduits d'intérêt spéléologique.


      Dans les ramblas, près d'émergences d'eau presque toujours salines, naissent de véritables oasis de
      roseaux et de tamaris disputant le terrain aux plantes halophiles.
    wildlife: >-
      La flore fait preuve d'une formidable adaptation : feuilles coriaces et réduites, comme la salicorne
      colonisant les abords des ramblas, ou cycles ultra-courts permettant aux éphémères de germer, fleurir et
      grainer avant la disparition de l'humidité. Parmi les espèces emblématiques figure Euzomodendron
      bourgaeanum, un endémisme d'Almería qui croît sur les marnes et fleurit durant les cinq premiers mois de
      l'année. Lors des printemps arrosés, la moricandie s'épanouit en tapis violacés sur les talus marneux.


      Les oiseaux s'observent principalement le long des ramblas et sur les falaises où ils trouvent refuge :
      martinet à ventre blanc, hirondelle de rochers, monticole merle-bleu et choucas des tours. Dans les
      parois nichent aussi le rollier d'Europe, la chevêche d'Athéna, le traquet oreillard, le moineau soulcie
      et le roselin githagine. Le guêpier d'Europe creuse ses galeries dans les talus meubles, hors d'atteinte
      des prédateurs comme la couleuvre à échelons ou la couleuvre fer-à-cheval. La perdrix rouge niche près
      des étendues d'alfa ; le faucon pèlerin et l'aigle de Bonelli venus de la sierra Alhamilla y chassent
      régulièrement, tandis que le grand-duc d'Europe capture lapins et rongeurs. On rencontre également des
      oiseaux steppiques comme le cochevis huppé, l'alouette calandrelle, l'œdicnème criard, l'outarde
      canepetière et le ganga unibande.


      Les reptiles sont abondants, notamment le psammodrome d'Edwards, le lézard ocellé et la couleuvre à
      échelons, aux côtés de la grenouille rieuse et du crapaud calamite. Les mammifères comptent renards,
      lapins, lérots ainsi que hérissons d'Algérie et hérissons d'Europe.
    visit: >-
      Tabernas est une destination captivante pour randonner dans un milieu désertique. Avant de descendre
      dans les ramblas, renseignez-vous sur les accès et les recommandations ; la structure géologique
      s'apprécie aussi bien sur les parois des lits asséchés que sur les pentes ravinées. Les oiseaux
      s'observent de préférence le long des ramblas et des parois abruptes, tout comme les sculptures
      d'érosion, des cheminées de fées aux badlands.


      La période la plus favorable s'étend de l'automne au printemps, évitant ainsi la chaleur étouffante de
      l'été.
    history: >-
      Le site a été déclaré en 1989 Paraje Natural et Zone de protection spéciale pour les oiseaux, complété
      en 2016 par le statut de Zone spéciale de conservation. Il s'étend sur 11 448,49 hectares répartis entre
      cinq communes d'Almería. La flore abrite un nombre impressionnant d'espèces endémiques exclusives et de
      végétaux rares à l'échelle mondiale.


      Depuis la fin des années 1950, plus de 300 films ont été tournés dans ce désert, principalement des
      westerns spaghettis. En 2020, l'Académie européenne du cinéma lui a décerné le titre de Trésor de la
      culture cinématographique européenne.
    before: >-
      Évitez l'été : la chaleur est suffocante et dangereuse. Ne jetez aucun mégot ni objet inflammable afin
      de prévenir tout départ d'incendie. Emportez vos déchets jusqu'au conteneur le plus proche et
      n'abandonnez jamais d'animaux domestiques, qui menacent la faune locale. Consultez le gestionnaire avant
      votre départ pour vérifier l'état des accès et les zones ouvertes.
    around: >-
      Parmi les autres espaces remarquables de la province figurent le [Parc national et naturel de Sierra
      Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), qui barre l'horizon montagnard, et le [Parc
      naturel de Cabo de Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), avec
      ses falaises volcaniques côtières et ses salines arides.
  de:
    intro: >-
      Es regnet selten, und wenn es regnet, stürzen die Fluten mit Wucht herab. Die jährlichen Niederschläge
      erreichen keine 250 mm und fallen als heftige Wolkenbrüche auf Mergel- und Sandsteinböden, die kein
      Wasser speichern können. Das abfließende Wasser zerschneidet das Land in Schluchten, messerscharfe Kämme
      und trockene Rambla-Flussbette; dazwischen klammert sich eine an extreme Trockenheit angepasste Flora
      fest. So entstand das Naturgebiet Desierto de Tabernas in Almería—eine raue Badlands-Landschaft, an der
      du jede Phase erosiver Formung ablesen kannst.
    landscape: >-
      Die Wüste von Tabernas erstreckt sich nördlich der Stadt Almería, eingebettet zwischen den Sierras de
      los Filabres und Alhamilla in einem Bergkranz, zu dem auch Gádor und die Sierra Nevada gehören. Diese
      Barriere schirmt feuchte Mittelmeerwinde ab und erzeugt ein kontrastreiches Klima: etwa 17,9 °C
      Jahresdurchschnitt mit Mitteltemperaturen von 9 °C im Januar und 24,5 °C im August. Im Jahr fallen kaum
      mehr als 200 mm Niederschlag, wovon nur ein Drittel in die heiße Jahreszeit von Mai bis Oktober fällt.


      Um die Formenwelt zu verstehen, muss man Millionen Jahre zurückblicken. Vor rund acht Millionen Jahren
      reichte das Meer bis an den Fuß der Filabres, wovon fossile Korallenriffe zeugen. Untermeerische
      Schuttfächer lagerten Turbidite ab—wechsellagernde Schichten aus Mergel und Sand—, jenes mürbe Gestein,
      das heute der Witterung ausgesetzt ist. Geologische Kostbarkeiten sind zudem Seismite, Gipsformationen
      der messinischen Salinitätskrise und der markante Schichtkamm des Cerro Alfaro.


      Das Wasser vollendet das Werk. Wadis—die sogenannten Ramblas—führen nur bei schlagartigen Sturzfluten
      Wasser, Schlamm und Geröll. An den Hängen hinterlässt der Regen winzige Tropfenkrater, Erdpyramiden,
      Rillen und steilwandige Erosionsrinnen (Gullies). Unterirdisch öffnen Auswaschungsprozesse (Piping)
      Röhrensysteme von beachtlicher speläologischer Dimension.


      In den Ramblas entstehen an oft salzigen Quellaustritten Oasen mit Schilf und Tamarisken, die mit
      salztoleranten Halophyten um den kargen Boden konkurrieren.
    wildlife: >-
      Die Pflanzenwelt passt sich meisterhaft an: kleine, derbe Blätter wie beim Queller an den Ramblarändern
      oder extrem beschleunigte Entwicklungszyklen, bei denen ephemere Kräuter keimen, blühen und Samen
      streuen, bevor die Feuchtigkeit versiegt. Zu den Charakterarten zählt Euzomodendron bourgaeanum, ein
      endemischer Strauch Almerías, der auf Mergeln gedeiht und in den ersten fünf Monaten des Jahres blüht.
      Nach feuchten Frühjahren überzieht die Moricandie die Hänge mit violetten Blüten.


      Die Vogelwelt konzentriert sich auf die Ramblas und Steilwände: Alpensegler, Felsenschwalbe, Blaumerle
      und Dohle brüten in Felsnischen. An Abbruchkanten nisten Blauracke, Steinkauz,
      Mittelmeer-Steinschmätzer, Steinsperling und Wüstengimpel. Bienenfresser graben Bruthöhlen in lehmige
      Steilufer, geschützt vor Räubern wie der Hufeisennatter. Das Rothuhn nistet im Espartogras; Wanderfalke
      und Habichtsadler aus der Sierra Alhamilla nutzen das Areal als Jagdrevier, während der Uhu Kaninchen
      und Kleinsäuger erbeutet. Auch Steppenvögel wie Haubenlerche, Kurzzehenlerche, Triel, Zwergtrappe und
      Sandflughuhn sind heimisch.


      Unter den Reptilien finden sich Fransenfinger, Perleidechse und Treppennatter neben Seefrosch und
      Kreuzkröte. An Säugetieren kommen Rotfuchs, Wildkaninchen, Gartenschläfer sowie Algerischer und
      Braunbrustigel vor.
    visit: >-
      Tabernas bietet ein faszinierendes Terrain für Wüstentouren. Erkundige dich vor dem Abstieg in die
      Ramblas nach Wegzuständen und Empfehlungen; die geologische Architektur erschließt sich in den Wänden
      der Trockenflusstäler ebenso wie an den zerfurchten Hängen. Vögel lassen sich am besten in den Ramblas
      und Steilwänden beobachten, wo auch bizarre Erosionsformen von Erdpyramiden bis zu tiefen Canyons
      beeindrucken.


      Die beste Wanderzeit reicht von Herbst bis Frühjahr, um der sengenden Hitze des Sommers zu entgehen.
    history: >-
      Das Gebiet wurde 1989 zum Naturgebiet (Paraje Natural) und Europäischen Vogelschutzgebiet erklärt und
      2016 als Besonderes Erhaltungsgebiet (ZEC) ausgewiesen. Es umfasst 11.448,49 Hektar in fünf Gemeinden
      der Provinz Almería. Die Flora weist zahlreiche strikte Endemiten und weltweit seltene Arten auf.


      Seit den späten 1950er Jahren dienten die Badlands als Drehort für über 300 Spielfilme, allen voran
      weltberühmte Italowestern. 2020 verlieh die Europäische Filmakademie dem Desierto de Tabernas den
      Ehrentitel „Schatz der europäischen Filmkultur“.
    before: >-
      Meide die Sommermonate: Die Hitze ist extrem und gesundheitsgefährdend. Wirf niemals Zigarettenkippen
      oder brennende Gegenstände weg, um Buschfeuer zu verhüten. Nimm allen Abfall wieder mit und setze
      keinesfalls Haustiere aus, die die sensible Tierwelt gefährden. Informiere dich vorab bei der Verwaltung
      über geöffnete Sektoren und Sicherheitsauflagen.
    around: >-
      Weitere herausragende Schutzgebiete in der Region sind der [National- und Naturpark Sierra
      Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), dessen schneebedeckte Kämme am Horizont
      aufragen, und der [Naturpark Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/) mit seinen vulkanischen
      Klippen und Salzlagunen.
  it:
    intro: >-
      Piove di rado e, quando piove, l'acqua si abbatte con furia. Le precipitazioni annue non toccano i 250
      mm e si concentrano in rovesci torrenziali su suoli di marne e arenarie del tutto incapaci di trattenere
      l'umidità. Il ruscellamento incide calanchi, creste affilate e ramblas asciutte; tra di essi sopravvive
      una flora finemente plasmata dall'aridità. Così ha avuto origine l'Area Naturale del Deserto di
      Tabernas, ad Almería, un paesaggio di badlands dove è possibile decifrare ogni forma generata
      dall'erosione.
    landscape: >-
      Il Deserto di Tabernas si estende a nord della città di Almería, racchiuso tra le sierre de los Filabres
      e Alhamilla, in un contesto montuoso che comprende Gádor e la Sierra Nevada. Tale disposizione lo isola
      dalle correnti umide del Mediterraneo, dando luogo a un clima fortemente contrastato: circa 17,9 °C di
      temperatura media annua, con medie di 9 °C a gennaio e 24,5 °C ad agosto. Piove poco più di 200 mm
      all'anno, e appena un terzo cade durante i mesi caldi da maggio a ottobre.


      Per comprendere l'orografia occorre guardare agli antichi fondali marini. Circa otto milioni di anni fa
      la costa lambiva la base dei Filabres, dove rimangono a testimonianza scogliere coralline fossili. I
      conoidi sottomarini depositarono torbiditi—strati alternati di sabbie e marne—che costituiscono la
      fragile roccia oggi aggredita dall'erosione. Tra le peculiarità geologiche figurano sismiti, formazioni
      di gesso risalenti alla crisi di salinità del Messiniano e il rilievo del Cerro Alfaro.


      L'acqua compie il resto. I wadi desertici—le ramblas—trasportano acqua, fango e massi solo durante
      violente ondate di piena. Lungo i versanti l'impatto delle gocce di pioggia scava micro-crateri,
      piramidi di terra, solchi erosivi e profondi valloni verticali. Nel sottosuolo i fenomeni di suffosione
      (piping) generano condotti di notevole rilievo speleologico.


      Lungo le ramblas, in corrispondenza di risorgenze acquifere quasi sempre salmastre, si formano
      autentiche oasi con canneti e tamerici che contendono lo spazio a specie alofile specializzate.
    wildlife: >-
      La vegetazione risponde con mirabili adattamenti: foglie coriacee e ridottissime, come quelle della
      salicornia che costeggia le ramblas, o cicli vitali fulminei in cui le erbe effimere germogliano,
      fioriscono e producono semi prima dell'esaurimento dell'umidità. Tra le specie più rappresentative
      spicca Euzomodendron bourgaeanum, un arbusto endemico di Almería che prospera sulle marne e fiorisce nei
      primi cinque mesi dell'anno. Nelle primavere piovose, le fioriture di moricandia ammantano di viola i
      pendii marnosi.


      Gli uccelli popolano soprattutto le incisioni delle ramblas e le pareti rocciose in cui trovano rifugio
      e nidificazione: il rondone maggiore, il balestruccio montano, il passero solitario e la taccola. Sugli
      argini verticali nidificano anche la ghiandaia marina, la civetta, la monachella, il passero lagio e il
      trombettiere. Il gruccione scava nidi a galleria nei banchi sabbiosi, al riparo da predatori come il
      colubro ferro di cavallo. La pernice rossa nidifica tra le distese di sparto; il falco pellegrino e
      l'aquila del Bonelli provenienti dalla sierra Alhamilla vi cacciano regolarmente, mentre il gufo reale
      preda conigli e micromammiferi. Sono presenti pure uccelli di steppa quali cappellaccia, calandrina,
      occhione, gallina prataiola e grandule.


      Tra i rettili abbondano il sauro striato comune, la lucertola ocellata e il colubro a ferro di cavallo o
      scala, affiancati dal rospo smeraldino o calamita e dalla rana verde. I mammiferi annoverano volpi,
      conigli selvatici, quercini e ricci algerini ed europei.
    visit: >-
      Tabernas è un punto di riferimento per compiere escursioni nell'ambiente desertico. Prima di addentrarsi
      nelle ramblas, verifica accessi e raccomandazioni; l'architettura geologica si coglie appieno sia lungo
      le pareti dei letti fluviali asciutti sia sui pendii erosi. L'avifauna si osserva al meglio nelle
      ramblas e sulle scarpate, assieme a spettacolari sculture erosive come le piramidi di terra e i
      calanchi.


      Il periodo consigliato va dall'autunno alla primavera, per sottrarsi alle temperature torride
      dell'estate.
    history: >-
      L'area è stata istituita nel 1989 come Paraje Natural e Zona di Protezione Speciale per gli uccelli, a
      cui si è aggiunta nel 2016 la qualifica di Zona Speciale di Conservazione. Comprende 11.448,49 ettari
      ripartiti su cinque comuni della provincia di Almería. La flora annovera un cospicuo numero di endemismi
      stretti e specie botaniche rare su scala globale.


      A partire dalla fine degli anni 1950, in questo deserto sono stati girati più di 300 film, in larga
      parte western all'italiana. Nel 2020 l'European Film Academy ha conferito all'area il prestigioso
      riconoscimento di Tesoro della Cultura Cinematografica Europea.
    before: >-
      Evita l'estate: il caldo è opprimente e rischioso. Non gettare mozziconi di sigaretta o elementi
      incandescenti per prevenire incendi. Porta via tutti i rifiuti fino al cassonetto più vicino e non
      abbandonare animali domestici, che minacciano la fauna autoctona. Prima di partire, consulta l'ente
      gestore per accertare le condizioni di visita e i settori accessibili.
    around: >-
      Tra le altre aree protette della provincia figurano il [Parco Nazionale e Naturale della Sierra
      Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), visibile sullo sfondo montuoso, e il [Parco
      Naturale di Cabo de Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), con
      le sue falesie vulcaniche litoranee e saline aride.
  pt:
    intro: >-
      Chove pouco e, quando chove, chove torrencialmente. As precipitações anuais não atingem 250 mm e caem em
      aguaceiros violentos sobre um solo de margas e arenitos incapaz de reter a humidade. As águas de
      escorrência talham ravinas, cristas afiadas e ramblas secas; entre elas fixa-se uma vegetação
      admiravelmente adaptada à aridez. Assim nasceu o Paraje Natural Desierto de Tabernas, em Almería, uma
      paisagem de badlands onde podes contemplar cada escultura gerada pela erosão.
    landscape: >-
      O Deserto de Tabernas estende-se a norte da cidade de Almería, abrigado entre as serras de los Filabres
      e Alhamilla, num conjunto orográfico que integra Gádor e a Sierra Nevada. Essa barreira isola-o das
      correntes húmidas do Mediterrâneo, forjando um clima de extremos: cerca de 17,9 °C de média anual, com
      médias de 9 °C em janeiro e 24,5 °C em agosto. Chove pouco mais de 200 mm ao ano, e apenas um terço
      recai no período estival de maio a outubro.


      Para decifrar o relevo é preciso recuar ao mar antigo. Há cerca de oito milhões de anos a linha de costa
      alcançava a base dos Filabres, subsistindo aí recifes de corais fósseis como testemunho. Os leques
      submarinos depositaram turbiditos—camadas alternadas de areias e margas—, que constituem a rocha friável
      sobre a qual opera a erosão atual. Entre as relíquias geológicas figuram sismitos, gessos da crise de
      salinidade do Messiniano e a crista do Cerro Alfaro.


      A água completa o processo. Os uádis desérticos—as ramblas—apenas transportam água, lama e pedras
      durante enxurradas violentas. Nas encostas, a escorrência deixa microcrateras de impacto de chuva,
      chaminés de fadas, sulcos e profundos gullies de paredes verticais. No subsolo, a erosão tubular
      (piping) abre galerias com proporções de verdadeiro interesse espeleológico.


      Nas ramblas, junto a exsurgências de água quase invariavelmente salobras, surgem autênticos oásis com
      caniços e tamargueiras disputando o espaço com plantas halófitas especializadas.
    wildlife: >-
      A flora responde com adaptações notáveis: folhas duras e minúsculas, como a salicórnia que coloniza as
      bermas das ramblas, ou ciclos ultrarrápidos em que as plantas efémeras germinam, florescem e lançam
      sementes antes que a humidade se evapore. Entre as espécies características ressalta a Euzomodendron
      bourgaeanum, um endemismo de Almería que vegeta sobre as margas e floresce ao longo dos primeiros cinco
      meses do ano. Nas primaveras húmidas, a moricândia tinge de púrpura os taludes margosos.


      As aves concentram-se sobretudo nas ramblas e nas paredes rochosas onde encontram abrigo e nidificação:
      o andorinhão-real, o andorinhão-das-rochas, o melro-das-rochas e a gralha-de-nuca-cinzenta. Nos taludes
      nidificam também o rolieiro-europeu, o mocho-galego, o chasco-ruivo, o pardal-espanhol e o
      pintarroxo-trombeteiro. O abelharuco escava galerias nos bancos arenosos, a salvo de predadores como a
      cobra-de-ferradura. A perdiz-vermelha nidifica junto aos espartais; o falcão-peregrino e a
      águia-perdigueira da serra Alhamilla caçam aqui habitualmente, enquanto o bufo-real captura coelhos e
      micromamíferos. Observam-se ainda aves estepárias como cotovias-de-poupa, calhandrinhas, alcaravões,
      sisões e cortiçóis-de-barriga-preta.


      Nos répteis abundam a lagartixa-de-dedos-denteados, o sardão e a cobra-de-escada, a par da rã-verde e do
      sapo-corredor. Os mamíferos incluem raposas, coelhos-bravos, arganazes e ouriços-cacheiros e argelinos.
    visit: >-
      Tabernas é uma paragem imperdível para caminhadas em ambiente desértico. Antes de entrar nas ramblas,
      informa-te sobre os acessos e normas de visita; a morfologia geológica revela-se com igual clareza nas
      paredes dos leitos secos e nas encostas escarpadas. As aves avistam-se com maior facilidade nas ramblas
      e escarpas, a par de notáveis formas erosivas que vão de chaminés de fadas a desfiladeiros esculpidos.


      A melhor época estende-se do outono à primavera, contornando o calor abrasador do verão.
    history: >-
      A área foi classificada em 1989 como Paraje Natural e Zona de Proteção Especial para as aves, a que se
      somou em 2016 o estatuto de Zona Especial de Conservação. Abrange 11.448,49 hectares repartidos por
      cinco municípios de Almería. A flora local reúne um número notável de endemismos estritos e espécies
      vegetais raras a nível planetário.


      Desde finais da década de 1950 foram rodados neste deserto mais de 300 filmes, com destaque para
      célebres spaghetti westerns. Em 2020 a Academia de Cinema Europeu atribuiu-lhe a distinção de Tesouro da
      Cultura Cinematográfica Europeia.
    before: >-
      Evita os meses de verão: o calor é extremo e perigoso. Não atires beatas de cigarro nem materiais
      incandescentes para prevenir fogos. Leva todo o lixo até ao contentor mais próximo e nunca abandones
      animais domésticos na natureza, pois colocam em risco a fauna bravia. Consulta previamente o organismo
      gestor para conhecer os setores transitáveis e condições de visita.
    around: >-
      Outros espaços emblemáticos da província são o [Parque Nacional e Natural de Sierra
      Nevada](/lugar/parque-nacional-y-natural-de-sierra-nevada/), que domina o horizonte com as suas
      cumeadas, e o [Parque Natural de Cabo de
      Gata-Níjar](/lugar/parque-natural-maritimo-terrestre-del-cabo-de-gata-nijar/), célebre pelas arribas
      vulcânicas marítimas e salinas áridas.
