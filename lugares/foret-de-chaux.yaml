    Ausgedehnter Flachlandwald auf dem ehemaligen Schwemmfächer des Aar-Doubs mit feuchten Erlenbrüchen und
    einem Totalreservat.
  it: >-
    Grande foresta planiziale sull'antico corso dell'Aar-Doubs, con formazioni igrofile ad ontano e una
    riserva biologica integrale.
  pt: >-
    Grande floresta de planície sobre o antigo leito do Aar-Doubs, com vales húmidos de amieiros e uma reserva
