resumen:
  es: >-
    El 'Little Tibet' italiano (Campo Imperatore) coronado por el Corno Grande (2.912 m, la cumbre más alta de
    los Apeninos) y el glaciar del Calderone.
  en: >-
    The Italian 'Little Tibet' (Campo Imperatore) crowned by Corno Grande (2,912 m, the highest peak in the
    Apennines) and the Calderone glacier.
  fr: >-
    Le « Petit Tibet » italien (Campo Imperatore) couronné par le Corno Grande (2 912 m, point culminant des
    Apennins) et le glacier du Calderone.
  de: >-
    Das italienische 'Klein-Tibet' (Campo Imperatore), überragt vom Corno Grande (2.912 m, höchster Gipfel des
    Apennins) und dem Calderone-Gletscher.
  it: >-
    Il 'Piccolo Tibet' italiano (Campo Imperatore) dominato dal Corno Grande (2.912 m, la vetta più alta degli
    Appennini) e dal ghiacciaio del Calderone.
  pt: >-
    O 'Pequeno Tibete' italiano (Campo Imperatore) coroado pelo Corno Grande (2.912 m, o cume mais alto dos
    Apeninos) e pelo glaciar do Calderone.
unico:
  es: >-
    En una misma cordillera conviven el último hielo del Apenino, una adonis amarilla que aquí tiene su única
    estación italiana y el rebeco que volvió tras cien años de ausencia.
  en: >-
    Within a single range coexist the southernmost ice in the Apennines, a yellow pheasant's eye finding its
    sole Italian station here, and the Apennine chamois returned after a century-long absence.
  fr: >-
    Un même massif réunit les dernières glaces des Apennins, une adonide jaune dont c'est l'unique station en
    Italie, et l'isard réintroduit après un siècle d'absence.
  de: >-
    In einem einzigen Gebirgsstock begegnen sich das südlichste Eis des Apennins, ein Frühlings-Adonisröschen
    an seinem einzigen Fundort in Italien und die nach hundertjähriger Abwesenheit zurückgekehrte Gämse.
  it: >-
    In un'unica catena convivono l'ultimo ghiaccio dell'Appennino, un'adonide gialla che vanta qui la sua sola
    stazione italiana e il camoscio ritornato dopo un secolo di assenza.
  pt: >-
    Numa mesma cordilheira coabitam o último gelo dos Apeninos, um adónis-amarelo com o seu único reduto
    italiano e a camurça restabelecida após um século de ausência.
observaciones:
  es: >-
    Muchas rutas suben a más de 2.000 m, así que consulta el estado de los senderos y la meteorología con el
    parque antes de salir.
texto:
  es:
    intro: >-
      Hubo un glaciar en el Apenino, y todavía queda su rastro. El glaciar del Calderone, en la vertiente
      norte del Corno Grande, fue el único glaciar apenínico y el más meridional de Italia; hoy casi ha
      desaparecido y desde 2019 su poco hielo se clasifica como glaciar nevado. Ese hielo en retirada resume
      el Parque Nacional del Gran Sasso y Monti della Laga: unas 141.341 hectáreas de montaña entre los
      Abruzos, el Lacio y las Marcas, con la cresta caliza del Gran Sasso d'Italia por un lado y los bosques
      de los Monti della Laga por otro.
    landscape: >-
      El parque, creado en 1991, es la tercera área protegida más grande de Italia. Reúne el macizo del Gran
      Sasso d'Italia y, algo más al norte, la cadena de los Monti della Laga, y se organiza en doce zonas,
      entre ellas Campo Imperatore, en el alto valle del Aterno, y la Valle delle Grandi Abbazie, que debe su
      nombre al gran número de iglesias antiguas de la zona teramana del valle del Vomano.


      La alta montaña es de circos glaciares y canchales. Campo Imperatore y Campo Pericoli son altiplanos de
      origen glaciar: Campo Pericoli, por encima de los 2.100 m. El glaciar del Calderone se formó en las
      grandes glaciaciones del Cuaternario y alcanzó su máxima extensión histórica en la Pequeña Edad de
      Hielo, entre 1550 y 1850.


      Los dos macizos son opuestos. El Gran Sasso, sobre todo en la vertiente aquilana, es de pastos: al
      sureste los bosques solo están a cotas bajas, de pino negro y robles, y más arriba solo hay pastos. En
      la vertiente teramana, al norte, dominan los hayedos, con bosques inmensos sobre todo cerca de
      Pietracamela. Los Monti della Laga, en cambio, aparecen cubiertos por extensas masas forestales: entre
      los 1000 y los 1800 m se extienden los hayedos, con tejo y acebo, y en los barrancos arces, tilos,
      fresnos y olmos; hay núcleos de abeto blanco y abedul, y entre bosques y pastos de altura un extenso
      brezal de arándano que evoca un ambiente nórdico.
    wildlife: >-
      En primavera, las laderas del Gran Sasso muestran la floración de la adonis amarilla, una planta
      considerada extinta durante mucho tiempo que vive aquí en su única estación italiana. En las altas cotas
      persisten plantas relictas glaciares endémicas como la androsace de Matilde, la adonis recurvada, la
      violeta de la Majella y la edelweiss del Apenino; el limonio aquilano y el astrágalo aquilano son
      exclusivos de esta zona, a cotas más bajas. En los Monti della Laga hay orquídeas raras, como la
      orquídea epipogio sin hojas.


      El [rebeco](/especie/rupicapra_pyrenaica/) de los Abruzos desapareció del Gran Sasso a finales del siglo
      XIX por la persecución de los cazadores y volvió con una reintroducción entre 1992 y 1999. La excursión
      por Campo Pericoli presta atención a la posible observación de rebecos. El
      [ciervo](/especie/cervus_elaphus/) se reintrodujo en 2004, el [lobo](/especie/canis_lupus/) apenino va
      reconstruyendo pequeñas manadas y de vez en cuando aparecen [osos](/especie/ursus_arctos/) marsicanos
      errantes. También hay zorro, jabalí, marta, [gato montés](/especie/felis_silvestris/), tejón, garduña,
      turón y puercoespín; en las cotas más altas, el topillo nival, reliquia glaciar.


      Entre las rapaces raras hay [águila real](/especie/aquila_chrysaetos/), azor, halcón peregrino, halcón
      borní, cernícalo, esmerejón y [búho real](/especie/bubo_bubo/). En las cotas altas están las mayores
      poblaciones apenínicas de gorrión alpino, bisbita alpino, bisbita y acentor alpino, y también la perdiz
      griega, el roquero rojo y las chovas. Los pastos de altura son el hábitat ideal de la víbora de Orsini,
      con la mayor población de Italia, y entre los anfibios hay endemismos apenínicos como la salamandrina de
      anteojos y el geotritón, que vive en cuevas.
    visit: >-
      El parque tiene museos y centros de visitantes repartidos por sus pueblos: el Museo del Rebeco de los
      Abruzos en Farindola, el Museo de la Flor en Barisciano, el Centro de Visitantes del río Tirino en Bussi
      sul Tirino, el de las Terre della Baronia en Santo Stefano di Sessanio y el Centro Visita Due Parchi en
      Arquata del Tronto.


      Para caminar, una etapa del Sentiero Italia (la 202 del CAI) va de Santo Stefano di Sessanio al refugio
      Duca degli Abruzzi: 18,6 kilómetros con 1236 metros de subida, y termina bajo la montaña más alta de los
      Apeninos. Otra desciende desde el refugio hasta Pietracamela a lo largo de 12,7 kilómetros. Y una ruta
      guiada de unos diez kilómetros atraviesa Campo Pericoli y alcanza el refugio Duca degli Abruzzi desde el
      refugio Garibaldi, construido en 1886 y considerado por el parque el refugio más antiguo de Italia.
      Entre los refugios del parque figuran también el Franchetti en Pietracamela, el Fonte Vetica y el
      Racollo.
    history: >-
      Pocas veces una historia de conservación cabe en una sola especie. Aquí, el rebeco se extinguió a
      finales del siglo XIX y su vuelta es el gran éxito del parque. El glaciar, en cambio, es una pérdida a
      cámara lenta por el cambio climático.
    before: >-
      Muchas rutas suben a más de 2.000 m, así que consulta el estado de los senderos y la meteorología con el
      parque antes de salir.
    around: >-
      El [Parco Nazionale dei Monti Sibillini](/lugar/parco-nazionale-dei-monti-sibillini/) está pegado, y el
      [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/) queda a unos 3 km. A veinticuatro
      kilómetros está la [Riserva Naturale Guidata Gole del Sagittario](/lugar/gole-del-sagittario/), a
      veintiséis las [Gole di Celano - Canyon delle Gole di Celano-Aielli](/lugar/gole-di-celano/) y a
      veintisiete el [Parco Nazionale d'Abruzzo, Lazio e Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/),
      de donde partieron rebecos reintroducidos aquí.
  en:
    intro: >-
      There once was a true glacier in the Apennines, and its vestige lingers still. The Calderone glacier,
      nestled on the northern face of Corno Grande, was the only Apennine glacier and the southernmost in
      Italy; today it has nearly vanished, and since 2019 its remaining ice has been classified as a
      glacieret. That retreating ice embodies the Gran Sasso and Monti della Laga National Park: some 141,341
      hectares of rugged mountains across Abruzzo, Lazio, and Marche, flanked by the sheer limestone ridge of
      the Gran Sasso d'Italia on one side and the verdant forests of the Monti della Laga on the other.
    landscape: >-
      Established in 1991, the park is the third-largest protected area in Italy. It unites the limestone
      massif of the Gran Sasso d'Italia with the sandstone chain of the Monti della Laga further north,
      structured into twelve districts, including Campo Imperatore in the upper Aterno valley and the Valle
      delle Grandi Abbazie, named after historic monastic abbeys in the Teramo sector of the Vomano valley.


      The high alpine zone features glaciated cirques and extensive scree fans. Campo Imperatore and Campo
      Pericoli are vast upland plateaus of glacial origin: Campo Pericoli lies above 2,100 m. The Calderone
      glacier originated during the major Quaternary glaciations and reached its historical maximum extent
      during the Little Ice Age between 1550 and 1850.


      The two massifs present striking geological contrasts. The Gran Sasso, especially on its Aquila flank,
      consists largely of sweeping pastures: to the southeast, forests are confined to lower elevations of
      black pine and oak, yielding above to open grasslands. On the northern Teramo slope, vast beechwoods
      dominate, particularly around Pietracamela. In contrast, the Monti della Laga are clad in unbroken
      forest cover: between 1000 and 1800 m stretch dense beech forests enriched with yew and holly, while
      ravines shelter maples, limes, ashes, and elms; pockets of silver fir and birch persist, yielding higher
      up to extensive bilberry heaths evoking a boreal atmosphere.
    wildlife: >-
      In spring, the slopes of the Gran Sasso reveal the golden bloom of Adonis volgensis, a plant long
      thought extinct that survives here at its only Italian station. At high elevations endure glacial relict
      endemics including Magellensis violet, Matilde's androsace, curved pheasant's eye, and Apennine
      edelweiss; Aquila sea lavender and Aquila milkvetch are exclusive to lower screes. The Monti della Laga
      harbour rare orchids, including the leafless ghost orchid.


      The Apennine [Pyrenean chamois](/especie/rupicapra_pyrenaica/) disappeared from the Gran Sasso in the
      late nineteenth century due to hunting and was restored through reintroduction between 1992 and 1999.
      Hikes across Campo Pericoli offer opportunities to observe these agile ungulates. [Red
      deer](/especie/cervus_elaphus/) were reintroduced in 2004, the Apennine [grey
      wolf](/especie/canis_lupus/) has rebuilt stable packs, and wandering Marsican [brown
      bear](/especie/ursus_arctos/) occasionally appear. Other resident mammals include red fox, wild boar,
      pine marten, [European wildcat](/especie/felis_silvestris/), European badger, stone marten, European
      polecat, and crested porcupine; the European snow vole thrives as an ice-age relict on high peaks.


      Notable raptors include the [golden eagle](/especie/aquila_chrysaetos/), northern goshawk, peregrine
      falcon, lanner falcon, common kestrel, merlin, and [Eurasian eagle-owl](/especie/bubo_bubo/). High
      pastures host the Apennines' largest breeding populations of white-winged snowfinch, water pipit, meadow
      pipit, and alpine accentor, alongside rock partridge, rufous-tailed rock thrush, and choughs. Highland
      screes provide ideal habitat for the endangered Orsini's viper, hosting its largest population in Italy.
      Amphibian endemics include the spectacled salamander and Italian cave salamander.
    visit: >-
      The park maintains visitor centres and thematic museums across its villages: the Apennine Chamois Museum
      in Farindola, the Flower Museum in Barisciano, the Tirino River Visitor Centre in Bussi sul Tirino, the
      Terre della Baronia Centre in Santo Stefano di Sessanio, and the Two Parks Visitor Centre in Arquata del
      Tronto.


      For hiking, a stage of the Sentiero Italia (CAI stage 202) leads from Santo Stefano di Sessanio to
      Rifugio Duca degli Abruzzi: 18.6 kilometres with 1236 metres of ascent, finishing beneath the highest
      peak of the Apennines. Another descent connects the refuge to Pietracamela over 12.7 kilometres. A
      guided loop of about ten kilometres crosses Campo Pericoli to reach Rifugio Duca degli Abruzzi from
      Rifugio Garibaldi, built in 1886 and celebrated as the oldest alpine hut in Italy. Other prominent
      mountain huts include Rifugio Franchetti in Pietracamela, Fonte Vetica, and Racollo.
    history: >-
      Rarely can an entire conservation story be told through a single species. Here, the chamois vanished at
      the end of the nineteenth century and its return marks the park's crowning triumph. In contrast, the
      vanishing glacier represents a slow-motion loss driven by climate change.
    before: >-
      Many routes ascend beyond 2,000 m; check trail accessibility and weather forecasts with park authorities
      before venturing into the high mountains.
    around: >-
      The [Parco Nazionale dei Monti Sibillini](/lugar/parco-nazionale-dei-monti-sibillini/) directly adjoins
      the park, and [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/) lies about 3 km
      away. Twenty-four kilometres away sits [Riserva Naturale Guidata Gole del
      Sagittario](/lugar/gole-del-sagittario/), twenty-six kilometres away [Gole di Celano - Canyon delle Gole
      di Celano-Aielli](/lugar/gole-di-celano/), and twenty-seven kilometres away [Parco Nazionale d'Abruzzo,
      Lazio e Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), from which the chamois reintroduced here
      originally came.
  fr:
    intro: >-
      Il y eut jadis un glacier dans les Apennins, et son empreinte persiste encore. Le glacier du Calderone,
      niché sur le versant nord du Corno Grande, fut l'unique glacier apennin et le plus méridional d'Italie ;
      aujourd'hui presque disparu, ses rares plaques de glace sont classées depuis 2019 comme glacier rocheux
      ou glacio-névé. Ce vestige glaciaire symbolise le parc national du Gran Sasso et des Monti della Laga :
      141 341 hectares de haute montagne répartis entre Abruzzes, Latium et Marches, adossant la haute crête
      calcaire du Gran Sasso d'Italie aux massifs boisés des monts de la Laga.
    landscape: >-
      Créé en 1991, le parc représente la troisième plus vaste aire protégée d'Italie. Il associe le grand
      massif calcaire du Gran Sasso d'Italia et, plus au nord, la chaîne gréseuse des Monti della Laga,
      structuré en douze districts territoriaux, parmi lesquels Campo Imperatore dans la haute vallée de
      l'Aterno et la Valle delle Grandi Abbazie, renommée pour ses monastères anciens dans la vallée du
      Vomano.


      La haute montagne se caractérise par des cirques glaciaires et d'immenses éboulis. Campo Imperatore et
      Campo Pericoli sont de vastes plateaux glaciaires : Campo Pericoli s'étend au-dessus de 2 100 m. Le
      glacier du Calderone s'est constitué lors des grandes glaciations quaternaires pour atteindre son apogée
      historique au cours du Petit Âge Glaciaire, entre 1550 et 1850.


      Les deux massifs offrent une physionomie opposée. Le Gran Sasso, particulièrement sur son versant de
      l'Aquila, est le royaume des pelouses : au sud-est, les forêts se limitent aux basses pentes, composées
      de pins noirs et de chênes, cédant la place en altitude à des pâturages nus. Sur le versant de Teramo,
      au nord, dominent les hêtraies séculaires, notamment vers Pietracamela. Les Monti della Laga, en
      revanche, sont tapissés d'immenses forêts : entre 1000 et 1800 m s'étirent des hêtraies mêlées d'ifs et
      de houx, tandis que les ravins abritent érables, tilleuls, frênes et ormes ; des peuplements de sapin
      blanc et de bouleau subsistent, relayés en altitude par des landes à myrtilles aux allures scandinaves.
    wildlife: >-
      Au printemps, les pentes du Gran Sasso accueillent la floraison de l'adonide de la Volga, plante
      longtemps crue disparue qui subsiste ici dans son unique station italienne. Sur les crêtes survivent des
      endémiques glaciaires comme l'androsace de Mathilde, la violette de la Majella et l'edelweiss des
      Apennins ; la statice de l'Aquila et l'astragale de l'Aquila sont exclusives des basses altitudes. Les
      Monti della Laga hébergent des orchidées remarquables, dont l'épipogon sans feuilles.


      L'[isard](/especie/rupicapra_pyrenaica/) des Apennins disparut du Gran Sasso à la fin du XIXe siècle
      sous la pression de la chasse et fut réimplanté avec succès par un programme de réintroduction mené
      entre 1992 et 1999. Les traversées de Campo Pericoli offrent de belles occasions d'observation. Le [cerf
      élaphe](/especie/cervus_elaphus/) a été réintroduit en 2004, le [loup](/especie/canis_lupus/) des
      Apennins reforme des meutes stables et des individus vagabonds d'[ours brun](/especie/ursus_arctos/)
      marsicain s'y aventurent. S'y ajoutent renard, sanglier, martre, [chat
      sauvage](/especie/felis_silvestris/), blaireau, fouine, putois et porc-épic ; sur les sommets survit le
      campagnol des neiges, relique quaternaire.


      Les rapaces comptent l'[aigle royal](/especie/aquila_chrysaetos/), l'autour des palombes, le faucon
      pèlerin, le faucon lanier, le crécerelle, l'émerillon et le [hibou grand-duc](/especie/bubo_bubo/). Les
      crêtes abritent les principales colonies apennines de niverolles alpines, pipits spioncelles, pipits
      farlouses et niverolles, ainsi que la perdrix bartavelle et le monticole merle-de-roche. Les alpages
      constituent le sanctuaire de la vipère d'Orsini, avec la population la plus abondante d'Italie. Parmi
      les amphibiens endémiques figurent la salamandrine à lunettes et le spéléomante.
    visit: >-
      Le parc compte de nombreux centres d'interprétation : le musée de l'isard des Apennins à Farindola, le
      musée de la fleur à Barisciano, le centre d'accueil du Tirino à Bussi sul Tirino, celui des Terre della
      Baronia à Santo Stefano di Sessanio et le centre Deux Parcs à Arquata del Tronto.


      Pour randonner, une étape du Sentiero Italia (étape 202 du CAI) relie Santo Stefano di Sessanio au
      refuge Duca degli Abruzzi : 18,6 kilomètres pour 1236 mètres de dénivelé positif sous le toit des
      Apennins. Une autre descente rejoint Pietracamela sur 12,7 kilomètres. Une boucle guidée d'une dizaine
      de kilomètres traverse Campo Pericoli pour atteindre le refuge Duca degli Abruzzi depuis le refuge
      Garibaldi, érigé en 1886 et considéré comme le plus ancien refuge d'Italie. Parmi les autres refuges
      figurent le Franchetti à Pietracamela, Fonte Vetica et Racollo.
    history: >-
      Rarement une épopée de conservation n'a reposé sur une seule espèce : ici, l'isard avait disparu à la
      fin du XIXe siècle et son retour constitue la plus grande victoire du parc. En miroir, le retrait du
      glacier témoigne du réchauffement climatique contemporain.
    before: >-
      De nombreux itinéraires franchissent 2 000 m d'altitude ; renseignez-vous sur les conditions
      nivologiques et météorologiques auprès du parc avant de vous engager.
    around: >-
      Le [Parco Nazionale dei Monti Sibillini](/lugar/parco-nazionale-dei-monti-sibillini/) jouxte le parc, et
      le [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/) se trouve à environ 3 km. À
      vingt-quatre kilomètres se situe la [Riserva Naturale Guidata Gole del
      Sagittario](/lugar/gole-del-sagittario/), à vingt-six kilomètres les [Gole di Celano - Canyon delle Gole
      di Celano-Aielli](/lugar/gole-di-celano/) et à vingt-sept kilomètres le [Parco Nazionale d'Abruzzo,
      Lazio e Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), berceau des isards réintroduits ici.
  de:
    intro: >-
      Es gab einst einen Gletscher im Apennin, und seine Spur überdauert noch heute. Der Calderone-Gletscher
      an der Nordflanke des Corno Grande war der einzige Gletscher des Apennins und der südlichste Italiens;
      heute ist er fast verschwunden und seine Eisreste werden seit 2019 als Blockgletscher geführt. Dieses
      schwindende Eis veranschaulicht den Nationalpark Gran Sasso und Monti della Laga: rund 141.341 Hektar
      Hochgebirge zwischen Abruzzen, Latium und Marken, flankiert vom kahlen Kalkgrat des Gran Sasso d'Italia
      auf der einen und den Buchenwäldern der Monti della Laga auf der anderen Seite.
    landscape: >-
      Der 1991 gegründete Park ist das drittgrößte Schutzgebiet Italiens. Er vereinigt das Kalkmassiv des Gran
      Sasso d'Italia und die nördlich anschließende Sandsteinkette der Monti della Laga, gegliedert in zwölf
      Teilgebiete, darunter Campo Imperatore im oberen Aternotal und die Valle delle Grandi Abbazie, benannt
      nach den historischen Klöstern im Vomanotal.


      Das Hochgebirge ist von Karen und Schuttfluren geprägt. Campo Imperatore und Campo Pericoli sind weite
      Kareis-Hochflächen: Campo Pericoli dehnt sich oberhalb von 2.100 m aus. Der Calderone-Gletscher entstand
      in den quartären Kaltzeiten und erreichte seine neuzeitliche Höchstausdehnung während der Kleinen
      Eiszeit zwischen 1550 und 1850.


      Beide Massive bilden einen geologischen Gegensatz. Der Gran Sasso, insbesondere auf der aquilanischen
      Südseite, ist von Weideflächen bestimmt: Wälder aus Schwarzkiefer und Eiche beschränken sich auf die
      Talstufen. An den Nordhängen bei Teramo dominieren ausgedehnte Buchenwälder, etwa bei Pietracamela. Die
      Monti della Laga hingegen sind dicht bewaldet: Zwischen 1000 und 1800 m wachsen Buchenwälder mit Eibe
      und Stechpalme, in Schluchten Ahorn, Linde, Esche und Ulme; Vorkommen von Weißtanne und Birke leiten in
      weite Heidelbeerheiden über.
    wildlife: >-
      Im Frühling blüht an den Hängen des Gran Sasso das Wolga-Adonisröschen, eine lange Zeit als verschollen
      geltende Pflanze, die hier ihr einziges Vorkommen in Italien besitzt. In Hochlagen überdauern
      eiszeitliche Endemiten wie Majella-Veilchen, Matildes Mannsschild und Apennin-Edelweiß; Strandflieder
      und Tragant sind an tiefere Lagen gebunden. Die Monti della Laga bergen seltene Orchideen wie die
      Blattlose Widerbart-Orchidee.


      Die Apennin-[Pyrenäen-Gämse](/especie/rupicapra_pyrenaica/) starb im Gran Sasso Ende des neunzehnten
      Jahrhunderts durch Nachstellung aus und wurde zwischen 1992 und 1999 erfolgreich wiederangesiedelt.
      Wanderungen über Campo Pericoli bieten hervorragende Beobachtungschancen. Der
      [Rothirsch](/especie/cervus_elaphus/) kehrte 2004 zurück, der Apennin-[Wolf](/especie/canis_lupus/)
      bildet stabile Rudel und gelegentlich wandern Marsische [Braunbären](/especie/ursus_arctos/) ein. Hinzu
      kommen Fuchs, Wildschwein, Baummarder, [Wildkatze](/especie/felis_silvestris/), Dachs, Steinmarder,
      Iltis und Stachelschwein; auf den Gipfeln lebt die Schneemaus als Eiszeitrelikt.


      Zu den Greifvögeln zählen [Steinadler](/especie/aquila_chrysaetos/), Habicht, Wanderfalke, Lannerfalke,
      Turmfalke, Merlin und [Uhu](/especie/bubo_bubo/). Die Hochweiden beherbergen Italiens stärkste
      Brutpopulationen von Schneesperling, Bergpieper, Wiesenpieper und Alpenbraunelle, begleitet von
      Steinhuhn und Felsenschwalbe. Hochalpine Schuttfluren sind Lebensraum der Wiesenotter mit ihrem größten
      Vorkommen in Italien. Unter den Amphibien finden sich Brillensalamander und Höhlensalamander.
    visit: >-
      Der Park unterhält Besucherzentren in verschiedenen Dörfern: das Gämsenmuseum in Farindola, das
      Blumenmuseum in Barisciano, das Tirino-Flusszentrum in Bussi sul Tirino, das Besucherzentrum Terre della
      Baronia in Santo Stefano di Sessanio und das Zwei-Parks-Zentrum in Arquata del Tronto.


      Für Bergwanderer führt eine Etappe des Sentiero Italia (CAI-Etappe 202) von Santo Stefano di Sessanio
      zur Duca-degli-Abruzzi-Hütte: 18,6 Kilometer mit 1236 Höhenmetern Aufstieg unter den höchsten Gipfel des
      Apennins. Eine weitere Etappe führt über 12,7 Kilometer hinab nach Pietracamela. Eine geführte Route von
      rund zehn Kilometern quert Campo Pericoli ab der 1886 erbauten Garibaldi-Hütte, die als älteste
      Schutzhütte Italiens gilt. Zu den Stützpunkten zählen auch Franchettihütte, Fonte Vetica und Racollo.
    history: >-
      Selten lässt sich Naturschutzgeschichte an einer Art festmachen: Am Gran Sasso starb die Gämse Ende des
      neunzehnten Jahrhunderts aus und ihre Rückkehr ist der größte Erfolg des Parks. Der schmelzende
      Gletscher mahnt indessen an die Folgen des Klimawandels.
    before: >-
      Zahlreiche Routen führen über 2.000 m Höhe; erkundige dich vorab bei der Parkverwaltung über
      Wetterumschwünge und Wegesperrungen.
    around: >-
      Der [Parco Nazionale dei Monti Sibillini](/lugar/parco-nazionale-dei-monti-sibillini/) grenzt
      unmittelbar an, und der [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/) liegt
      etwa 3 km entfernt. Vierundzwanzig Kilometer entfernt liegt die [Riserva Naturale Guidata Gole del
      Sagittario](/lugar/gole-del-sagittario/), sechsundzwanzig Kilometer die [Gole di Celano - Canyon delle
      Gole di Celano-Aielli](/lugar/gole-di-celano/) und siebenundzwanzig Kilometer der [Parco Nazionale
      d'Abruzzo, Lazio e Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), aus dem die hiesigen Gämsen
      stammten.
  it:
    intro: >-
      C'era un ghiacciaio nell'Appennino, e ne resta ancora la traccia. Il ghiacciaio del Calderone,
      incastonato sul versante settentrionale del Corno Grande, è stato l'unico ghiacciaio appenninico e il
      più meridionale d'Italia; oggi è quasi estinto e dal 2019 il suo residuo glaciale viene classificato
      come glacionevato. Questo ghiaccio in ritirata riassume il Parco Nazionale del Gran Sasso e Monti della
      Laga: circa 141.341 ettari di montagna distribuiti tra Abruzzo, Lazio e Marche, con la cresta calcarea
      del Gran Sasso d'Italia da un lato e le foreste dei Monti della Laga dall'altro.
    landscape: >-
      Istituito nel 1991, il parco è la terza area protetta più estesa d'Italia. Accorpa il massiccio calcareo
      del Gran Sasso d'Italia e, più a nord, la catena arenacea dei Monti della Laga, organizzato in dodici
      distretti territoriali, tra cui Campo Imperatore nell'alta valle dell'Aterno e la Valle delle Grandi
      Abbazie, intitolata ai complessi monastici della vallata teramana del Vomano.


      L'alta montagna è scolpita da circhi glaciali e ghiaioni. Campo Imperatore e Campo Pericoli sono
      altopiani di matrice glaciale: Campo Pericoli si estende oltre i 2.100 m. Il ghiacciaio del Calderone
      prese forma durante le grandi glaciazioni quaternarie toccando la massima estensione storica durante la
      Piccola Età Glaciale, tra il 1550 e il 1850.


      I due massicci mostrano caratteri antitetici. Il Gran Sasso, specie sul versante aquilano, è dominato da
      pascoli aperti: verso sud-est i boschi di pino nero e quercia si fermano a quote basali, lasciando
      spazio a praterie nude. Sul versante teramano, a nord, dominano invece maestose faggete, fitte attorno a
      Pietracamela. I Monti della Laga si presentano al contrario ricoperti da grandi foreste: tra 1000 e 1800
      m si estendono faggete miste a tasso e agrifoglio, mentre le forre accolgono aceri, tigli, frassini e
      olmi; nuclei di abete bianco e betulla sfumano in brughiere a mirtillo di sapore boreale.
    wildlife: >-
      In primavera i versanti del Gran Sasso svelano la fioritura dell'adonide di primavera, pianta a lungo
      considerata estinta che vive qui nella sua unica stazione italiana. Alle quote superiori resistono
      relitti glaciali endemici quali violetta della Majella, androsace di Matilde e stella alpina
      appenninica; limonio aquilano e astragalo aquilano sono esclusivi delle quote collinari. I Monti della
      Laga ospitano orchidee rare, tra cui l'epipogio senza foglie.


      Il [camoscio](/especie/rupicapra_pyrenaica/) appenninico scomparve dal Gran Sasso alla fine
      dell'Ottocento a causa della caccia indiscriminata ed è tornato grazie a una reintroduzione tra il 1992
      e il 1999. Le escursioni su Campo Pericoli offrono ottime occasioni di avvistamento. Il
      [cervo](/especie/cervus_elaphus/) è stato reintrodotto nel 2004, il [lupo grigio](/especie/canis_lupus/)
      appenninico mantiene branchi stabili e periodicamente compaiono individui erratici di [orso
      bruno](/especie/ursus_arctos/) marsicano. Completano il quadro volpe, cinghiale, martora, [gatto
      selvatico](/especie/felis_silvestris/), tasso, faina, puzzola e istrice; sulle vette nidifica l'arvicola
      delle nevi, relitto glaciale.


      Tra i rapaci stazionano [aquila reale](/especie/aquila_chrysaetos/), astore, falco pellegrino, lanario,
      gheppio, smeriglio e [gufo reale](/especie/bubo_bubo/). I pascoli d'altitudine sostengono le principali
      popolazioni appenniniche di fringuello alpino, spioncello, pispola e sordone, assieme a coturnice e
      gracchi. Le pietraie d'alta quota costituiscono l'habitat principe della vipera dell'Orsini, presente
      con la popolazione più cospicua d'Italia. Gli anfibi annoverano salamandrina dagli occhiali e
      geotritone.
    visit: >-
      Il parco conta musei e centri visite nei suoi borghi: il Museo del Camoscio appenninico a Farindola, il
      Museo del Fiore a Barisciano, il Centro Visite del fiume Tirino a Bussi sul Tirino, quello delle Terre
      della Baronia a Santo Stefano di Sessanio e il Centro Visita Due Parchi ad Arquata del Tronto.


      Per il trekking, una tappa del Sentiero Italia (la 202 del CAI) sale da Santo Stefano di Sessanio al
      Rifugio Duca degli Abruzzi: 18,6 chilometri con 1236 metri di dislivello positivo sotto la cima più alta
      dell'Appennino. Un altro percorso scende dal rifugio fino a Pietracamela lungo 12,7 chilometri. Un
      itinerario guidato di una decina di chilometri attraversa Campo Pericoli raggiungendo il Duca degli
      Abruzzi dal Rifugio Garibaldi, costruito nel 1886 e ritenuto il più antico rifugio d'Italia. Tra i
      presidi montani compaiono anche il Rifugio Franchetti a Pietracamela, Fonte Vetica e Racollo.
    history: >-
      Raramente la storia della conservazione si condensa in una sola specie: sul Gran Sasso il camoscio si
      estinse alla fine dell'Ottocento e il suo ripopolamento rappresenta il massimo traguardo del parco. Il
      ghiacciaio in disfacimento racconta invece la ritirata imposta dal riscaldamento globale.
    before: >-
      Numerosi sentieri superano i 2.000 m di altitudine; informati presso l'ente parco sulle condizioni meteo
      e sulla praticabilità dei percorsi prima di salire.
    around: >-
      Il [Parco Nazionale dei Monti Sibillini](/lugar/parco-nazionale-dei-monti-sibillini/) è contiguo al
      territorio, e il [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/) sorge a circa 3
      km. A ventiquattro chilometri si trova la [Riserva Naturale Guidata Gole del
      Sagittario](/lugar/gole-del-sagittario/), a ventisei le [Gole di Celano - Canyon delle Gole di
      Celano-Aielli](/lugar/gole-di-celano/) e a ventisette il [Parco Nazionale d'Abruzzo, Lazio e
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), sorgente dei camosci reintrodotti in quest'area.
  pt:
    intro: >-
      Existiu outrora um glaciar nos Apeninos, e a sua marca resiste ainda hoje. O glaciar do Calderone,
      entalhado na vertente norte do Corno Grande, foi o único glaciar apenínico e o mais meridional de
      Itália; encontra-se hoje quase extinto e desde 2019 o seu gelo residual é classificado como glaciar
      rochoso. Esse gelo em recuo resume o Parque Nacional do Gran Sasso e Monti della Laga: cerca de 141.341
      hectares de montanhas entre os Abruzos, o Lácio e as Marcas, erguendo a crista calcária do Gran Sasso
      d'Italia de um lado e as matas dos Monti della Laga do outro.
    landscape: >-
      Criado em 1991, o parque constitui a terceira maior área protegida de Itália. Congrega o maciço do Gran
      Sasso d'Italia e, mais a norte, a cordilheira arenítica dos Monti della Laga, estruturado em doze
      distritos, destacando-se Campo Imperatore no alto vale do Aterno e a Valle delle Grandi Abbazie,
      tributária dos mosteiros medievais do vale do Vomano.


      A alta montanha exibe circos glaciares e cascalheiras monumentais. Campo Imperatore e Campo Pericoli são
      planaltos de matriz glaciar: Campo Pericoli estende-se acima dos 2.100 m. O glaciar do Calderone
      formou-se durante as grandes glaciações quaternárias e atingiu o apogeu histórico durante a Pequena
      Idade do Gelo, entre 1550 e 1850.


      Os dois maciços são antagónicos. O Gran Sasso, mormente na vertente de L'Aquila, é terreno de pastagens
      alpinas: a sudeste os bosques restringem-se a cotas basais, de pinheiro-larício e carvalhos, cedendo
      passo acima a pastos desnudados. Na vertente de Teramo, a norte, imperam faiais pujantes, densos junto a
      Pietracamela. Os Monti della Laga exibem, pelo contrário, densas coberturas florestais: entre 1000 e
      1800 m estendem-se faiais com teixo e azevinho, enquanto as ravinas abrigam bordos, tílias, freixos e
      olmos; núcleos de abeto-branco e bétula culminam em charnecas de arando de perfil nórdico.
    wildlife: >-
      Na primavera, as encostas do Gran Sasso revelam a floração do adónis-amarelo, planta dada como extinta
      durante décadas que mantém aqui a sua única colónia italiana. Nas altitudes cimeiras persistem relíquias
      glaciares endémicas como a violeta-da-majella, a andrósace-de-matilde e a edelvaisse-dos-apeninos; a
      estátice-de-aquila e o astrágalo-de-aquila são privativos das encostas baixas. Os Monti della Laga
      abrigam orquídeas raras, como a orquídea-fantasma desprovida de folhas.


      A [camurça-dos-pirineus](/especie/rupicapra_pyrenaica/) dos Apeninos extinguiu-se no Gran Sasso no final
      do século XIX pela pressão cinegética, regressando graças a uma reintrodução entre 1992 e 1999. As
      travessias por Campo Pericoli favorecem a observação destes animais. O
      [veado-vermelho](/especie/cervus_elaphus/) regressou em 2004, o [lobo-cinzento](/especie/canis_lupus/)
      apenínico consolidou alcateias estáveis e surgem pontualmente espécimes de
      [urso-pardo](/especie/ursus_arctos/) marsicano. Registam-se ainda raposa, javali, marta,
      [gato-bravo](/especie/felis_silvestris/), texugo, fuinha, tourão e porco-espinho; nos cumes habita o
      rato-das-neves como testemunho glaciar.


      Entre as aves de rapina contam-se a [águia-real](/especie/aquila_chrysaetos/), o açor, o
      falcão-peregrino, o falcão-alfaneque, o peneireiro, o esmerilhão e o [bufo-real](/especie/bubo_bubo/).
      As pastagens de altitude albergam os maiores contingentes reprodutores apenínicos de pardal-alpino,
      petinha-dos-prados e ferreirinha-alpina, além da perdiz-grega e do melro-das-rochas. Os pedregais
      abrigam a víbora-de-orsini, com a população mais vigorosa de Itália. Nos anfíbios pontuam a
      salamandrina-de-lunetas e o carismático geotritão.
    visit: >-
      O parque mantém museus e centros de interpretação distribuídos pelas suas povoações: o Museu da Camurça
      em Farindola, o Museu da Flor em Barisciano, o Centro de Visitantes do Rio Tirino em Bussi sul Tirino, o
      das Terre della Baronia em Santo Stefano di Sessanio e o Centro Dois Parques em Arquata del Tronto.


      Para pedestrianistas, uma etapa do Sentiero Italia (etapa 202 do CAI) sobe de Santo Stefano di Sessanio
      ao Refúgio Duca degli Abruzzi: 18,6 quilómetros com 1236 metros de ascensão até ao sopé da montanha mais
      alta dos Apeninos. Outra etapa desce do refúgio até Pietracamela ao longo de 12,7 quilómetros. Um
      percurso guiado de cerca de dez quilómetros cruza Campo Pericoli até ao Duca degli Abruzzi a partir do
      Refúgio Garibaldi, edificado em 1886 e reputado como o mais antigo refúgio de montanha em Itália. Entre
      os abrigos de montanha destacam-se o Franchetti em Pietracamela, Fonte Vetica e Racollo.
    history: >-
      Poucas vezes a história da conservação se sintetiza numa única espécie: no Gran Sasso a camurça sucumbiu
      no final do século XIX e a sua reabilitação traduz o grande êxito do parque. O glaciar em agonia
      espelha, em contrapartida, as transformações climáticas planetárias.
    before: >-
      Inúmeros percursos ascendem a mais de 2.000 m; informa-te junto do parque sobre as condições
      meteorológicas e o estado dos caminhos antes de subires.
    around: >-
      O [Parco Nazionale dei Monti Sibillini](/lugar/parco-nazionale-dei-monti-sibillini/) confronta
      diretamente com o território, e o [Parco Nazionale della Majella](/lugar/parco-nazionale-della-majella/)
      fica a cerca de 3 km. A vinte e quatro quilómetros situa-se a [Riserva Naturale Guidata Gole del
      Sagittario](/lugar/gole-del-sagittario/), a vinte e seis quilómetros as [Gole di Celano - Canyon delle
      Gole di Celano-Aielli](/lugar/gole-di-celano/) e a vinte e sete o [Parco Nazionale d'Abruzzo, Lazio e
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), berço das camurças reintroduzidas neste maciço.
