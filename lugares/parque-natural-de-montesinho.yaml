resumen:
  es: >-
    El bastión ibérico del lobo ibérico en Portugal (75.000 ha en Trás-os-Montes), con grandes robledales de
    pyrenaica y arquitectura de losa de pizarra.
  en: >-
    The Iberian stronghold of the Iberian wolf in Portugal (75,000 ha in Trás-os-Montes), with extensive
    Pyrenean oakwoods and traditional schist slate architecture.
  fr: >-
    Le bastion portugais du loup ibérique (75 000 ha en Trás-os-Montes), abritant de vastes chênaies de tauzin
    et une architecture traditionnelle en dalles de schiste.
  de: >-
    Die portugiesische Hochburg des Iberischen Wolfs (75.000 ha in Trás-os-Montes), mit grossen
    Pyrenäen-Eichenwäldern und traditioneller Schieferarchitektur.
  it: >-
    La roccaforte portoghese del lupo iberico (75.000 ha a Trás-os-Montes), con estesi querceti di rovere dei
    Pirenei e borghi tradizionali in lastre di scisto.
  pt: >-
    O bastião ibérico do lobo-ibérico em Portugal (75.000 ha em Trás-os-Montes), com grandes carvalhais de
    negral e arquitetura de lousa de xisto.
unico:
  es: >-
    Una de las poblaciones de [lobo](/especie/canis_lupus/) ibérico más importantes de la península, en una
    montaña donde aún se ven los rebaños custodiados por el Cão de Gado Transmontano.
  en: >-
    One of the most vital Iberian wolf ([lobo](/especie/canis_lupus/)) populations on the peninsula, set in a
    mountain redoubt where flocks are still guarded by majestic Cão de Gado Transmontano livestock guardian
    dogs.
  fr: >-
    L'une des populations de loup ibérique ([lobo](/especie/canis_lupus/)) les plus importantes de la
    péninsule, dans un massif où les troupeaux sont toujours gardés par le Cão de Gado Transmontano.
  de: >-
    Eine der bedeutendsten Populationen des Iberischen Wolfs ([lobo](/especie/canis_lupus/)) auf der
    Halbinsel, in Bergen, wo Herden noch vom Cão de Gado Transmontano beschützt werden.
  it: >-
    Una delle popolazioni di lupo iberico ([lobo](/especie/canis_lupus/)) più rilevanti della penisola, in una
    montagna dove le greggi sono tuttora custodite dal fiero Cão de Gado Transmontano.
  pt: >-
    Uma das populações de [lobo](/especie/canis_lupus/)-ibérico mais importantes da península, numa montanha
    onde ainda se veem os rebanhos custodiados pelo Cão de Gado Transmontano.
