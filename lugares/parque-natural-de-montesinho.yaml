texto:
  es:
    intro: >-
      Hay inviernos de –12 °C y veranos de 40 °C, y entre los dos, 92 aldeas, unas 9.000 personas y un lobo.
      El Parque Natural de Montesinho ocupa unas 75 mil hectáreas en el nordeste transmontano, en plena Terra
      Fria. Fue reconocido como parque natural en 1979.
    landscape: >-
      El relieve es heterogéneo: mesetas onduladas cortadas por valles hondos y encajados, y algunas sierras.
      Las dos principales son la Serra de Montesinho, al norte de Bragança, y la Serra da Coroa, al norte de
      Vinhais. Las altitudes van de 438 metros, en el lecho del río Mente, a 1486 en la Serra de Montesinho.


      Dominan los esquistos, con granitos, rocas ultrabásicas y pequeñas manchas calizas. El Sabor nace en la
      frontera con España, en las cumbres de la Serra de Montesinho, y pasa cerca de Bragança. Los ríos
      serpentean por valles profundos, salpicados de molinos antiguos que la población todavía usa en su mayor
      parte, y cruzados por puentes romanos milenarios.
    wildlife: >-
      El paisaje vegetal es un mosaico de usos. Los «matos» (brezales, jarales y retamares) ocupan amplios
      terrenos abandonados por la agricultura y son hábitat de mucha fauna. Los lameiros, prados de montaña,
      acompañan los ríos. Los soutos de castaños son la mayoría de los terrenos agrícolas de cultivo perenne.
      En las zonas bajas, en laderas empinadas y soleadas, crecen los encinares que llaman sardoais. Y el
      melojar es uno de los principales bosques autóctonos: forma un continuo hacia el sur hasta la serra da
      Nogueira. Entre los árboles nativos están además el cerezo silvestre, el olmo, el avellano y el manzano
      silvestre, y Montesinho es el único lugar de Portugal donde el bonetero crece de forma natural. Los
      suelos ultrabásicos guardan plantas como Armeria eriophylla, Anthyllis sampaiana y Santolina
      semidentata.


      Es una de las áreas de montaña más importantes para la fauna de Portugal y de Europa: unas doscientas
      cincuenta especies de vertebrados. Destacan el lobo ibérico, el ciervo, el [desmán
      ibérico](/especie/galemys_pyrenaicus/), el [gato montés](/especie/felis_silvestris/), el [murciélago
      grande de herradura](/especie/rhinolophus_ferrumequinum/) y el topillo de los lameiros. En 2019 se vio
      un [oso pardo](/especie/ursus_arctos/) cantábrico. De las unas 160 especies de aves, destacan el [águila
      real](/especie/aquila_chrysaetos/) y la [cigüeña negra](/especie/ciconia_nigra/). En los ríos hay barbos
      y truchas. Las rutas permiten buscar huellas de zorro, jabalí, corzo y lobo.
    visit: >-
      El parque cuenta con 19 rutas peatonales señalizadas. El recorrido de Porto Furado es circular, de 7,8
      kilómetros, dificultad media y tres horas. Empieza y termina en la aldea de Montesinho, a la que se
      llega desde Bragança por la N103-7. Pasa por la presa y el canal romanos de Porto Furado y por el
      conjunto de arte rupestre de Castro Curisco.


      El sendero do Castro es otro recorrido circular y alargado, de unos 17 kilómetros, que parte de la aldea
      de São Julião. Es de dificultad media a alta y se tarda unas 5 horas. Pasa por las Fragas do Castro, un
      yacimiento de la Edad del Hierro, junto a un molino de agua que sigue en funcionamiento. En la Alta
      Lombada hay, además, otros senderos peatonales —PR13 Fraga do Coelho, PR14 do Castro y GR2 dos Moinhos—
      y un recorrido en BTT. Si quieres ver fauna, sal a primeras horas de la mañana o al atardecer: en el do
      Castro no es difícil ver alguna rapaz en vuelo o escuchar a una abubilla.


      El plan de ordenación contempla además los paseos peatonales, los itinerarios interpretativos y la
      observación de fauna y flora como actividades de turismo de naturaleza. El parque tiene su sede en
      Bragança y una delegación con Centro de Interpretación en la Casa da Vila de Vinhais.
    history: >-
      El parque se creó para salvaguardar los valores naturales singulares de su territorio, y el plan de
      ordenación busca mantener los hábitats naturales y la biodiversidad, y recuperar los recursos degradados
      o sobreexplotados. El área incluye parcialmente la zona especial para aves y el sitio de conservación
      Montesinho/Nogueira.


      El Cão de Gado Transmontano protege los rebaños del lobo: el parque registra y facilita su colocación
      entre los ganaderos.
    before: >-
      Hay actividades sujetas al plan de ordenación del parque. Consulta las condiciones con el ICNF antes de
      ir.
  en:
    intro: >-
      There are winters of –12 °C and summers reaching 40 °C, and caught between the two are 92 villages, some
      9,000 people, and the Iberian wolf. Montesinho Natural Park spans some 75 thousand hectares across
      north-eastern Trás-os-Montes, in the heart of the Terra Fria Transmontana. It was formally established
      as a natural park in 1979.
    landscape: >-
      The relief is markedly diverse: undulating high plateaus dissected by deep, incised valleys, crowned by
      rugged mountain chains. The two primary ranges are the Serra de Montesinho, rising north of Bragança,
      and the Serra da Coroa, stretching north of Vinhais. Altitudes span from 438 metres in the riverbed of
      the Mente to 1486 m atop the Serra de Montesinho.


      Schists dominate the geology, alongside granites, ultrabasic rock formations, and localized limestone
      outcrops. The Sabor River rises on the border with Spain among the summits of the Serra de Montesinho,
      flowing past Bragança. Watercourses wind through steep-sided valleys punctuated by ancient watermills,
      many of which remain actively utilized by villagers, crossed by millenary Roman bridges.
    wildlife: >-
      The vegetation forms a rich pastoral mosaic. Extensive *matos* (heathlands, cistus scrub, and broom)
      cloak slopes long retired from cultivation, offering prime wildlife cover. Mountain hay meadows, known
      as *lameiros*, line stream corridors. Sweet chestnut groves (*soutos*) constitute the core perennial
      agricultural land. Across lower elevations, steep sun-drenched slopes shelter evergreen holm-oak woods
      locally known as *sardoais*. The Pyrenean oak (*carvalho-negral*) forms the primary native forest tract,
      maintaining a continuous wooded corridor southwards towards the Serra da Nogueira. Native trees also
      include wild cherry, wych elm, common hazel, and crab apple; Montesinho represents the sole locality in
      Portugal where European spindle (*Euonymus europaeus*) occurs in native stands. Ultrabasic serpentinite
      soils nurture botanical rarities such as *Armeria eriophylla*, *Anthyllis sampaiana*, and *Santolina
      semidentata*.


      This is one of the most critical montane wildlife sanctuaries in Portugal and throughout Europe,
      harbouring around two hundred and fifty vertebrate species. Notable mammals include the Iberian wolf,
      red deer, [Pyrenean desman](/especie/galemys_pyrenaicus/), [wildcat](/especie/felis_silvestris/),
      [greater horseshoe bat](/especie/rhinolophus_ferrumequinum/), and Cabrera's vole. In 2019 a roaming
      Cantabrian [brown bear](/especie/ursus_arctos/) was documented here. Among some 160 bird species, the
      [golden eagle](/especie/aquila_chrysaetos/) and [black stork](/especie/ciconia_nigra/) stand out. The
      streams support native barbel and brown trout. Walking the trails offers prime opportunities to discover
      tracks of red fox, wild boar, roe deer, and wolf.
    visit: >-
      The park maintains 19 waymarked hiking trails. The Porto Furado trail is a circular route spanning 7.8
      kilometres, graded moderate and taking about three hours. It starts and ends in the schist village of
      Montesinho, accessed from Bragança via the N103-7. The path passes Roman hydraulic works including the
      dam and aqueduct of Porto Furado, along with rock art at Castro Curisco.


      The Trilho do Castro is another elongated circular hike of some 17 kilometres departing from the village
      of São Julião. Graded moderate to demanding, it takes about 5 hours. It passes the Iron Age hillfort of
      Fragas do Castro alongside an active traditional watermill. In the Alta Lombada sector, additional
      walking routes—PR13 Fraga do Coelho, PR14 do Castro, and GR2 dos Moinhos—complement mountain-biking
      options. For optimal wildlife watching, head out at dawn or dusk: along the Castro trail it is easy to
      spot soaring raptors or hear the call of a hoopoe.


      The park master plan encourages walking excursions, interpretive itineraries, and wildlife observation
      as core nature tourism activities. The park administration is based in Bragança, with a regional
      delegation and visitor interpretation centre at the Casa da Vila in Vinhais.
    history: >-
      The park was designated to safeguard the extraordinary natural and cultural values of this frontier
      territory. Its management plan seeks to maintain native habitats and biodiversity while restoring
      degraded resources. The area partially encompasses the Montesinho/Nogueira Special Protection Area and
      Special Area of Conservation.


      The Cão de Gado Transmontano, a magnificent livestock guardian dog, actively defends flocks against wolf
      packs: the park authority maintains a stud registry and places pups directly with pastoralists.
    before: >-
      Recreational activities within the park are governed by official conservation zoning. Consult the ICNF
      regarding specific rules and trail conditions before visiting.
  fr:
    intro: >-
      Il y a des hivers à –12 °C et des étés à 40 °C, et entre les deux, 92 villages, quelque 9 000 habitants
      et le loup ibérique. Le parc naturel de Montesinho couvre environ 75 mille hectares dans le nord-est
      transmontin, au cœur de la Terra Fria. Il a été reconnu parc naturel en 1979.
    landscape: >-
      Le relief est très varié : des plateaux ondulés entaillés de vallées encaissées et profondes, dominés
      par plusieurs massifs. Les deux principaux sont la Serra de Montesinho au nord de Bragance et la Serra
      da Coroa au nord de Vinhais. Les altitudes s'échelonnent de 438 mètres dans le lit du rio Mente jusqu'à
      1486 m dans la Serra de Montesinho.


      Les schistes dominent largement, côtoyant granites, roches ultrabasiques et poches calcaires. Le rio
      Sabor prend sa source sur la frontière avec l'Espagne au sommet de la Serra de Montesinho et s'écoule
      près de Bragance. Les rivières serpentent au fond de gorges abruptes parsemées de moulins à eau
      traditionnels encore en usage et enjambées par des ponts romains séculaires.
    wildlife: >-
      Le paysage végétal forme une mosaïque pastorale. Les landes (*matos*) à bruyères, cistes et genêts
      couvrent les parcelles agricoles abandonnées, offrant refuge à une faune variée. Les prairies humides de
      fauche, les *lameiros*, bordent les cours d'eau. Les châtaigneraies séculaires (*soutos*) composent
      l'essentiel des cultures pérennes. Dans les secteurs bas et ensoleillés croissent les yeuseraies locales
      nommées *sardoais*. La chênaie de chêne tauzin constitue la forêt autochtone majeure, formant un
      continuum boisé vers le sud jusqu'à la serra da Nogueira. Parmi les essences indigènes figurent
      merisier, orme, noisetier et pommier sauvage ; Montesinho est en outre l'unique station naturelle du
      fusain d'Europe au Portugal. Les sols ultrabasiques abritent des raretés comme *Armeria eriophylla*,
      *Anthyllis sampaiana* et *Santolina semidentata*.


      C'est l'un des sanctuaires montagnards majeurs pour la faune au Portugal et en Europe : environ deux
      cent cinquante espèces de vertébrés. Se distinguent le loup ibérique, le cerf élaphe, le [desman des
      Pyrénées](/especie/galemys_pyrenaicus/), le [chat forestier](/especie/felis_silvestris/), le [grand
      rhinolophe](/especie/rhinolophus_ferrumequinum/) et le campagnol de Cabrera. En 2019, la présence d'un
      [ours brun](/especie/ursus_arctos/) cantabrique a été confirmée. Parmi quelque 160 espèces d'oiseaux
      nichent l'[aigle royal](/especie/aquila_chrysaetos/) et la [cigogne noire](/especie/ciconia_nigra/). Les
      rivières abritent barbeaux et truites. Les itinéraires permettent de repérer les empreintes du renard,
      du sanglier, du chevreuil et du loup.
    visit: >-
      Le parc compte 19 itinéraires pédestres balisés. Le circuit de Porto Furado est une boucle de 7,8
      kilomètres, de difficulté moyenne réalisable en trois heures. Il commence et s'achève au village de
      Montesinho, accessible depuis Bragance par la N103-7. Il passe par le barrage et l'aqueduc romains de
      Porto Furado ainsi que par l'art rupestre de Castro Curisco.


      Le sentier do Castro est une autre boucle étirée d'environ 17 kilomètres partant du village de São
      Julião. De difficulté moyenne à soutenue, il s'effectue en environ 5 heures. Il côtoie l'éperon fortifié
      de l'âge du fer des Fragas do Castro et un moulin à eau en activité. Dans l'Alta Lombada se déploient
      d'autres parcours pédestres—PR13 Fraga do Coelho, PR14 do Castro et GR2 dos Moinhos—ainsi qu'une boucle
      VTT. Pour observer la faune, partez aux premières lueurs ou au crépuscule : sur le sentier do Castro, il
      est aisé d'observer un rapace en vol ou d'entendre la huppe fasciée.


      Le plan de gestion encourage les randonnées d'interprétation et l'écotourisme. Le parc a son siège à
      Bragance et dispose d'une antenne avec centre d'interprétation à la Casa da Vila de Vinhais.
    history: >-
      Le parc a été créé pour préserver le patrimoine naturel et culturel exceptionnel de ce territoire
      montagnard. Son plan de gestion vise à protéger les habitats, sauvegarder la biodiversité et réhabiliter
      les ressources surexploitées. L'espace englobe en partie la zone de protection spéciale et la zone
      spéciale de conservation Montesinho/Nogueira.


      Le Cão de Gado Transmontano protège les troupeaux contre les attaques de loups : les services du parc
      recensent les portées et facilitent l'attribution de ces chiens de garde aux éleveurs.
    before: >-
      Certaines activités sont encadrées par le plan d'aménagement du parc. Renseignez-vous auprès de l'ICNF
      sur les consignes en vigueur avant votre départ.
  de:
    intro: >-
      Hier gibt es Winter mit –12 °C und Sommer mit 40 °C, und dazwischen 92 Dörfer, rund 9.000 Menschen und
      den Wolf. Der Naturpark Montesinho umfasst rund 75 Tausend Hektar im Nordosten von Trás-os-Montes
      inmitten der Terra Fria. 1979 wurde er als Naturpark ausgewiesen.
    landscape: >-
      Das Relief ist abwechslungsreich: sanft gewellte Hochebenen, zerschnitten von tiefen Kerbtälern,
      überragt von mehreren Bergkämmen. Die beiden Hauptzüge sind die Serra de Montesinho nördlich von
      Bragança und die Serra da Coroa nördlich von Vinhais. Die Höhenlagen reichen von 438 Metern im Flussbett
      des Rio Mente bis zu 1486 m in der Serra de Montesinho.


      Schiefergesteine dominieren, durchsetzt mit Graniten, ultrabasischen Gesteinen und kleinen Kalkinseln.
      Der Rio Sabor entspringt an der Grenze zu Spanien auf den Kämmen der Serra de Montesinho und fliesst
      nahe Bragança vorbei. Flüsse winden sich durch tiefe Täler mit historischen Wassermühlen, die von der
      Bevölkerung teils noch genutzt werden, überspannt von uralten Römerbrücken.
    wildlife: >-
      Das Vegetationsbild gleicht einem Mosaik traditioneller Landnutzung. Ausgedehnte Heiden (*Matos*) aus
      Besenheide, Zistrosen und Ginster bedecken aufgelassene Äcker und bieten Rückzugsraum für Wildtiere.
      Feuchte Bergwiesen, die *Lameiros*, säumen die Flussläufe. Edelkastanienhaine (*Soutos*) stellen den
      Grossteil der landwirtschaftlichen Dauerkulturen. In sonnigen Tieflagen stocken Steineichenwälder, die
      *Sardoais*. Pyrenäen-Eichenwälder bilden den wichtigsten Naturwaldkomplex, der sich nach Süden zur Serra
      da Nogueira fortsetzt. Unter den Gehölzen finden sich Wildkirsche, Bergulme, Hasel und Holzapfel;
      Montesinho ist der einzige Ort Portugals mit autochthonen Beständen des Europäischen Pfaffenhütchens.
      Auf ultrabasischen Böden wachsen botanische Raritäten wie *Armeria eriophylla*, *Anthyllis sampaiana*
      und *Santolina semidentata*.


      Das Gebiet zählt zu den bedeutendsten Bergrefugien für die Tierwelt Portugals und Europas mit rund
      zweihundertfünfzig Wirbeltierarten. Hervorzuheben sind Iberischer Wolf, Rothirsch,
      [Pyrenäen-Desman](/especie/galemys_pyrenaicus/), [Wildkatze](/especie/felis_silvestris/), [Grosse
      Hufeisennase](/especie/rhinolophus_ferrumequinum/) und die Cabrera-Wühlmaus. 2019 wurde hier ein
      kantabrischer [Braunbär](/especie/ursus_arctos/) gesichtet. Unter rund 160 Vogelarten ragen
      [Steinadler](/especie/aquila_chrysaetos/) und [Schwarzstorch](/especie/ciconia_nigra/) heraus. Flüsse
      beherbergen Barben und Forellen. Wanderer finden regelmässig Fährten von Fuchs, Wildschwein, Reh und
      Wolf.
    visit: >-
      Der Park verfügt über 19 markierte Wanderwege. Der Rundweg Porto Furado misst 7,8 Kilometer bei
      mittlerer Schwierigkeit und rund drei Stunden Gehzeit. Er beginnt und endet im Schieferdörfchen
      Montesinho, erreichbar von Bragança über die N103-7. Er führt an der römischen Staumauer und dem Kanal
      von Porto Furado sowie den Felsbildern von Castro Curisco vorbei.


      Der Trilho do Castro ist ein weiterer Rundweg von rund 17 Kilometern ab dem Dorf São Julião. Er weist
      mittleren bis anspruchsvollen Charakter auf und dauert etwa 5 Stunden. Er passiert die eisenzeitliche
      Höhensiedlung Fragas do Castro und eine aktive Wassermühle. In der Alta Lombada erschliessen weitere
      Wanderwege—PR13 Fraga do Coelho, PR14 do Castro und GR2 dos Moinhos—sowie eine Mountainbike-Route das
      Bergland. Zur Wildtierbeobachtung eignen sich die frühen Morgen- und Abendstunden: Entlang des
      Castro-Wegs lassen sich Greifvögel und Wiedehopfe beobachten.


      Der Landschaftsplan fördert Naturerlebnis- und Lehrpfade. Die Parkverwaltung sitzt in Bragança, ergänzt
      durch ein Informationszentrum in der Casa da Vila in Vinhais.
    history: >-
      Der Naturpark wurde gegründet, um das Naturerbe und die traditionelle Kulturlandschaft zu bewahren. Der
      Bewirtschaftungsplan zielt auf den Erhalt der Lebensräume und die Regeneration übernutzter Ressourcen
      ab. Das Areal umfasst Teile des Vogelschutz- und FFH-Gebiets Montesinho/Nogueira.


      Der Cão de Gado Transmontano schützt Schaf- und Ziegenherden vor Wölfen: Die Parkverwaltung führt ein
      Zuchtregister und vermittelt Welpen gezielt an örtliche Hirten.
    before: >-
      Aktivitäten unterliegen den Schutzbestimmungen des Parks. Erkundige dich beim ICNF über Verhaltensregeln
      und Wegezustände.
  it:
    intro: >-
      Vi sono inverni a –12 °C ed estati a 40 °C, e tra i due estremi, 92 villaggi rurali, circa 9.000
      abitanti e il lupo. Il Parco Naturale di Montesinho occupa circa 75 mila ettari nell'estremo nord-est
      transmontano, nel cuore della Terra Fria. Fu istituito come parco naturale nel 1979.
    landscape: >-
      L'orografia è assai varia: altopiani ondulati solcati da forre scoscese e profonde, dominati da rilievi
      montuosi. Le due dorsali principali sono la Serra de Montesinho a nord di Bragança e la Serra da Coroa a
      nord di Vinhais. Le quote spaziano dai 438 metri nell'alveo del rio Mente sino ai 1486 m della Serra de
      Montesinho.


      Predominano gli scisti, associati a graniti, rocce ultrabasiche e limitate lenti calcaree. Il rio Sabor
      nasce sul confine con la Spagna sulle vette della Serra de Montesinho e scorre poco distante da
      Bragança. I torrenti serpeggiano sul fondo di gole aspre, scandite da mulini ad acqua storici ancora
      impiegati dagli abitanti e valicate da ponti romani millenari.
    wildlife: >-
      La vegetazione si articola in un mosaico agro-silvo-pastorale. Le brughiere e garighe (*matos*) a erica,
      cisto e ginestra rivestono i versanti incolti, offrendo asilo a una ricca fauna. I prati umidi montani
      (*lameiros*) assecondano le sponde fluviali. I castagneti da frutto (*soutos*) costituiscono la quota
      maggiore delle colture legnose perenni. Nei versanti bassi e assolati vegetano le leccete denominate
      *sardoais*. Il querceto di rovere dei Pirenei rappresenta il principale bosco autoctono, allungandosi
      verso sud fino alla serra da Nogueira. Tra le essenze arboree spontanee figurano ciliegio selvatico,
      olmo montano, nocciolo e melo selvatico; Montesinho è l'unica stazione naturale del Portogallo in cui
      vegeta la berretta da prete. I substrati ultrabasici accolgono rarità floristiche come *Armeria
      eriophylla*, *Anthyllis sampaiana* e *Santolina semidentata*.


      È uno dei comprensori montani più importanti d'Europa per la fauna selvatica, ospitando circa
      duecentocinquanta specie di vertebrati. Spiccano il lupo iberico, il cervo, il [desman
      pirenaico](/especie/galemys_pyrenaicus/), il [gatto selvatico](/especie/felis_silvestris/), il [ferro di
      cavallo maggiore](/especie/rhinolophus_ferrumequinum/) e l'arvicola di Cabrera. Nel 2019 vi è stato
      documentato un [orso bruno](/especie/ursus_arctos/) cantabrico in dispersione. Delle circa 160 specie
      avifaunistiche nidificanti risaltano l'[aquila reale](/especie/aquila_chrysaetos/) e la [cicogna
      nera](/especie/ciconia_nigra/). Nei fiumi prosperano barbi e trote. I sentieri consentono di rinvenire
      tracce di volpe, cinghiale, capriolo e lupo.
    visit: >-
      Il parco comprende 19 percorsi pedonali segnalati. L'anello di Porto Furado copre 7,8 chilometri, di
      media difficoltà, percorribile in tre ore. Parte e si conclude nel borgo in scisto di Montesinho,
      raggiungibile da Bragança percorrendo la N103-7. Sfiora la diga e il canale romani di Porto Furado oltre
      all'arte rupestre di Castro Curisco.


      Il sentiero do Castro è un altro circuito allungato di circa 17 chilometri che muove dal borgo di São
      Julião. Di impegno medio-alto, richiede circa 5 ore. Raggiunge le Fragas do Castro, insediamento
      fortificato dell'Età del Ferro, accostando un mulino ad acqua funzionante. Nella zona di Alta Lombada si
      snodano ulteriori percorsi escursionistici—PR13 Fraga do Coelho, PR14 do Castro e GR2 dos
      Moinhos—assieme a una pista per mountain bike. Per l'avvistamento della fauna conviene muoversi all'alba
      o al tramonto: lungo il sentiero do Castro è facile scorgere rapaci o udire l'upupa.


      Il piano di gestione valorizza escursionismo e turismo naturalistico. L'ente parco ha sede a Bragança e
      dispone di un centro visite presso la Casa da Vila a Vinhais.
    history: >-
      Il parco fu istituito per salvaguardare il pregevole patrimonio naturale e rurale della regione. Il
      piano regolatore mira a preservare gli habitat e recuperare i suoli degradati. L'area include porzioni
      della zona di protezione speciale e della zona speciale di conservazione Montesinho/Nogueira.


      Il Cão de Gado Transmontano vigila sulle greggi contro le incursioni dei lupi: l'ente parco gestisce un
      registro di razza e agevola l'affidamento dei cuccioli agli allevatori locali.
    before: >-
      Diverse attività sono regolamentate dal piano del parco. Verifica le norme vigenti con l'ICNF prima di
      intraprendere escursioni.
  pt:
    intro: >-
      Há invernos de –12 °C e verões de 40 °C, e entre os dois, 92 aldeias, umas 9.000 pessoas e um lobo. O
      Parque Natural de Montesinho ocupa umas 75 mil hectares no nordeste transmontano, em plena Terra Fria.
      Foi reconhecido como parque natural em 1979.
    landscape: >-
      O relevo é heterogéneo: planaltos ondulados cortados por vales fundos e encaixados, e algumas serras. As
      duas principais são a Serra de Montesinho, a norte de Bragança, e a Serra da Coroa, a norte de Vinhais.
      As altitudes vão de 438 metros, no leito do rio Mente, a 1486 na Serra de Montesinho.


      Dominam os xistos, com granitos, rochas ultrabásicas e pequenas manchas calcárias. O Sabor nasce na
      fronteira com Espanha, nos cumes da Serra de Montesinho, e passa perto de Bragança. Os rios serpenteiam
      por vales profundos, salpicados de moinhos antigos que a população ainda usa na sua maioria, e cruzados
      por pontes romanas milenares.
    wildlife: >-
      A paisagem vegetal é um mosaico de usos. Os «matos» (urzes, estevas e giestas) ocupam amplos terrenos
      abandonados pela agricultura e são habitat de muita fauna. Os lameiros, prados de montanha, acompanham
      os rios. Os soutos de castanheiros são a maioria dos terrenos agrícolas de cultivo perene. Nas zonas
      baixas, em encostas empinadas e soalheiras, crescem os sobreirais e azinhais que chamam sardoais. E o
      carvalhal de negral é um dos principais bosques autóctones: forma um contínuo para sul até à serra da
      Nogueira. Entre as árvores nativas estão ainda a cerejeira-brava, o olmo, a aveleira e a macieira-brava,
      e Montesinho é o único local de Portugal onde o barrete-de-padre cresce de forma natural. Os solos
      ultrabásicos guardam plantas como *Armeria eriophylla*, *Anthyllis sampaiana* e *Santolina semidentata*.


      É uma das áreas de montanha mais importantes para a fauna de Portugal e da Europa: cerca de duzentas e
      cinquenta espécies de vertebrados. Destacam-se o lobo-ibérico, o veado, o
      [toupeira-d'água](/especie/galemys_pyrenaicus/), o [gato-bravo](/especie/felis_silvestris/), o
      [morcego-de-ferradura-grande](/especie/rhinolophus_ferrumequinum/) e o rato-de-cabrera. Em 2019
      avistou-se um [urso-pardo](/especie/ursus_arctos/) cantábrico. Das cerca de 160 espécies de aves,
      destacam-se a [águia-real](/especie/aquila_chrysaetos/) e a [cegonha-preta](/especie/ciconia_nigra/).
      Nos rios há barbos e trutas. As rotas permitem procurar pegadas de raposa, javali, corço e lobo.
    visit: >-
      O parque conta com 19 rotas pedestres sinalizadas. O percurso de Porto Furado é circular, de 7,8
      quilómetros, dificuldade média e três horas. Começa e termina na aldeia de Montesinho, à qual se chega a
      partir de Bragança pela N103-7. Passa pela barragem e canal romanos de Porto Furado e pelo conjunto de
      arte rupestre de Castro Curisco.


      O trilho do Castro é outro percurso circular e alongado, de cerca de 17 quilómetros, que parte da aldeia
      de São Julião. É de dificuldade média a alta e demora-se cerca de 5 horas. Passa pelas Fragas do Castro,
      um povoado da Idade do Ferro, junto a um moinho de água ainda em funcionamento. Na Alta Lombada existem
      ainda outros trilhos pedestres — PR13 Fraga do Coelho, PR14 do Castro e GR2 dos Moinhos — e um percurso
      em BTT. Se quiseres observar fauna, sai às primeiras horas da manhã ou ao entardecer: no do Castro não é
      difícil ver alguma ave de rapina em voo ou escutar uma poupa.


      O plano de ordenamento contempla os passeios pedestres, os itinerários interpretativos e a observação de
      fauna e flora como atividades de turismo de natureza. O parque tem a sua sede em Bragança e uma
      delegação com Centro de Interpretação na Casa da Vila de Vinhais.
    history: >-
      O parque foi criado para salvaguardar os valores naturais singulares do seu território, e o plano de
      ordenamento visa manter os habitats naturais e a biodiversidade, e recuperar os recursos degradados ou
      sobreexplorados. A área inclui parcialmente a zona de proteção especial para aves e o sítio de
      conservação Montesinho/Nogueira.


      O Cão de Gado Transmontano protege os rebanhos do lobo: o parque regista e facilita a sua colocação
      entre os criadores de gado.
    before: >-
      Existem atividades sujeitas ao plano de ordenamento do parque. Consulta as condições junto do ICNF antes
      de partir.
