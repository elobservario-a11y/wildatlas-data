resumen:
  es: >-
    Antiguas marismas salobres convertidas en pastizales continentales tras el cierre de las barreras del Plan
    Delta.
  en: Former brackish salt marshes turned into inland grasslands after the Delta Works barriers were closed.
  fr: Anciens prés salés saumâtres devenus prairies continentales après la fermeture des barrages du Plan Delta.
  de: Ehemalige brackige Salzwiesen, die nach der Schließung der Deltawerke zu Binnenweiden wurden.
  it: Antiche paludi salmastre trasformate in pascoli continentali dopo la chiusura delle dighe del Piano Delta.
  pt: Antigos sapais salobros transformados em pastagens continentais após o fecho das barreiras do Plano Delta.
unico:
  es: >-
    Unos bancos de arena y marismas sin marea desde 1987, hoy bosque abierto donde pastan bisontes y crían los
    pigargos.
  en: >-
    Sandbanks and salt marshes cut off from the tide since 1987, now open woodland grazed by European bison
    and home to breeding white-tailed eagles.
  fr: >-
    Des bancs de sable et des marais privés de marée depuis 1987, aujourd'hui forêt claire où pâturent des
    bisons et où nichent les pygargues.
  de: >-
    Sandbänke und Marschen ohne Gezeiten seit 1987, heute ein lichter Wald, in dem Wisente weiden und Seeadler
    brüten.
  it: >-
    Banchi di sabbia e paludi senza marea dal 1987, oggi bosco aperto dove pascolano bisonti e nidificano le
    aquile di mare.
  pt: >-
    Bancos de areia e sapais sem maré desde 1987, hoje bosque aberto onde pastam bisontes e nidificam
    águias-rabalvas.
observaciones:
  es: >-
    Los meses más agradables van de mayo a septiembre. En otoño e invierno el terreno puede estar mojado y
    embarrado, así que lleva calzado fuerte o botas. Calcula entre media jornada y una jornada.
texto:
  es:
    intro: >-
      En 1987 se cerró una presa y el mar dejó de entrar. La Philipsdam, parte de las Obras del Delta, aisló
      el Krammer y el Volkerak del Oosterschelde, y los bancos de arena, fangales y marismas que subían y
      bajaban con la marea dejaron de sentirla. Se secaron, y el agua de lluvia fue endulzando el suelo
      salado. Lo que ha crecido desde entonces es Slikken van de Heen: 598 hectáreas de paisaje semiabierto,
      con bosquetes, matorrales y antiguos cauces de marea, junto a Tholen, que gestiona Het Zeeuwse
      Landschap.
    landscape: >-
      La historia está escrita en el suelo. El suelo es rico en nutrientes, y por eso el monte tiende a
      cerrarse enseguida. Allí donde el mar se retiró queda un paisaje herboso y semiabierto en el que se
      alternan los claros con las partes de bosque. Pasa por aquí el canal Escalda-Rin, que desde 1975 corta
      esta zona de marismas en dos; la parte oriental está en Brabante Septentrional y también se llama
      Slikken van de Heen.


      Es un lugar vivo, que sigue cambiando. Crece la heen o zeebies, que da en parte nombre al sitio, y a ras
      de suelo quedan los viejos cauces pequeños y los árboles cubiertos de musgo.
    wildlife: >-
      Aquí la gestión la hacen los herbívoros. Para mantener abierto el terreno pastan manadas de caballos
      Konik, desde 2019 vacas Rode Geus y, desde 2020, [bisontes](/especie/bison_bonasus/). Cada uno come
      distinto: los bisontes comen más corteza de ramas grandes y de troncos, y entre todos frenan el carrizo
      de dunas, el helecho águila y exóticas invasoras como el perejil gigante. La combinación es la más
      natural, porque antes de la intervención humana vacas, caballos y bisontes recorrían esta parte de
      Europa.


      En primavera, los pájaros cantores llenan el paisaje. Los antiguos fangales son ricos en aves
      reproductoras: el bisbita arbóreo, el [aguilucho lagunero](/especie/circus_aeruginosus/), la tarabilla
      común, el ruiseñor común y el pico menor. El [pigargo europeo](/especie/haliaeetus_albicilla/) cría en
      la zona desde 2018 y el [águila pescadora](/especie/pandion_haliaetus/) figura entre las aves destacadas
      del lugar. En invierno, el [halcón peregrino](/especie/falco_peregrinus/) está casi siempre presente,
      junto con grandes concentraciones de aves acuáticas, y desde el observatorio suelen verse la garceta
      grande y serretas.


      Entre los mamíferos, el [corzo](/especie/capreolus_capreolus/) se deja ver con regularidad, y los
      últimos en llegar son la [marta](/especie/martes_martes/) y el tejón. También hay zorros.
    visit: >-
      Slikken van de Heen es solo para caminar: no se puede ir en bicicleta. Hay dos rutas que se pueden
      combinar. La Torenroute, de unos tres kilómetros, pasa junto a la torre mirador. La Kijkschermroute,
      también de unos tres, lleva a una pantalla de observación con vistas a un antiguo canal de marea con
      aves acuáticas.


      Las dos parten del mismo punto: el panel de información de Het Zeeuwse Landschap, sobre el dique, en el
      cruce de Campweg con la vía paralela de la Philipsdam, donde hay aparcamiento. A lo largo de las rutas
      se cruzan manadas de caballos Konik y vacas Rode Geus, y con suerte se ven los bisontes o pasa volando
      un pigargo. Entre las propuestas de Het Zeeuwse Landschap figura «Struinen door geulen, slikken en
      schorren», vagar por cauces, fangales y marismas.
    history: >-
      El gran momento fue el cierre de la Philipsdam en 1987, que cambió para siempre el destino de estos
      bancos de arena. Como el suelo es muy rico y el monte se cierra rápido, el gestor optó por una gestión
      natural con grandes herbívoros, que ayudan a mantener abierto el terreno y favorecen la biodiversidad.
    before: >-
      Los meses más agradables van de mayo a septiembre. En otoño e invierno el terreno puede estar mojado y
      embarrado, así que lleva calzado fuerte o botas. Calcula entre media jornada y una jornada.
    around: >-
      A treinta kilómetros queda el [Parque Nacional De Biesbosch](/lugar/nationaal-park-de-biesbosch/), otro
      humedal del delta. Más lejos, la [Puerta de Güeldres / Corredor del Rin](/lugar/gelderse-poort/) y la
      [Reserva Natural de Millingerwaard](/lugar/millingerwaard/) comparten con Slikken van de Heen el ganado,
      los caballos y el humedal.
  en:
    intro: >-
      In 1987 a dam was closed and the sea stopped coming in. The Philipsdam, part of the Delta Works, cut off
      the Krammer and Volkerak from the Oosterschelde, and the sandbanks, mudflats and salt marshes that rose
      and fell with the tide stopped feeling it. They dried out, and rainwater gradually desalinated the salty
      soil. What has grown since then is Slikken van de Heen: 598 hectares of semi-open landscape, with
      copses, scrub and old tidal creeks, beside Tholen, managed by Het Zeeuwse Landschap.
    landscape: >-
      The history is written in the soil. The ground is rich in nutrients, so scrub and woodland tend to close
      in quickly. Where the sea retreated, a grassy, semi-open landscape remains, alternating clearings with
      wooded patches. The Scheldt–Rhine Canal runs through here, cutting this marshland in two since 1975; the
      eastern half lies in North Brabant and is also called Slikken van de Heen.


      It is a living place that keeps changing. Sea club-rush (*heen* or *zeebies*) grows here, giving part of
      its name to the site, and at ground level the old narrow creeks and moss-covered trees remain.
    wildlife: >-
      Here the herbivores do the management. To keep the terrain open, herds of Konik horses graze alongside
      Rode Geus cattle since 2019 and [European bison](/especie/bison_bonasus/) since 2020. Each eats
      differently: bison strip more bark from large branches and trunks, and together they hold back wood
      small-reed, bracken and invasive non-natives such as giant hogweed. The mix is the most natural one,
      because before human intervention cattle, horses and bison roamed this part of Europe.


      In spring, songbirds fill the landscape. The former mudflats are rich in breeding birds: tree pipit,
      [western marsh harrier](/especie/circus_aeruginosus/), European stonechat, common nightingale and lesser
      spotted woodpecker. The [white-tailed eagle](/especie/haliaeetus_albicilla/) has bred in the area since
      2018 and the [osprey](/especie/pandion_haliaetus/) is among the site's notable birds. In winter, the
      [peregrine falcon](/especie/falco_peregrinus/) is almost always present, along with large gatherings of
      waterbirds, and from the hide great egret and mergansers are often seen.


      Among mammals, the [roe deer](/especie/capreolus_capreolus/) is seen regularly, and the latest arrivals
      are the [European pine marten](/especie/martes_martes/) and the European badger. There are also red
      foxes.
    visit: >-
      Slikken van de Heen is for walking only: cycling is not allowed. There are two trails that can be
      combined. The Torenroute, about three kilometres long, passes the observation tower. The
      Kijkschermroute, also about three kilometres, leads to a viewing screen overlooking a former tidal
      channel with waterbirds.


      Both start from the same spot: the Het Zeeuwse Landschap information board on the dyke, at the junction
      of Campweg and the service road beside the Philipsdam, where there is parking. Along the routes you pass
      herds of Konik horses and Rode Geus cattle, and with luck you spot the bison or see a white-tailed eagle
      fly overhead. Among Het Zeeuwse Landschap's suggestions is «Struinen door geulen, slikken en schorren» —
      wandering through creeks, mudflats and salt marshes.
    history: >-
      The turning point was the closure of the Philipsdam in 1987, which changed the fate of these sandbanks
      for good. Because the soil is very rich and woodland closes in fast, the manager opted for natural
      grazing with large herbivores, which help keep the ground open and boost biodiversity.
    before: >-
      The most pleasant months run from May to September. In autumn and winter the ground can be wet and
      muddy, so wear sturdy footwear or boots. Allow between half a day and a full day.
    around: >-
      Thirty kilometres away lies [De Biesbosch National Park](/lugar/nationaal-park-de-biesbosch/), another
      delta wetland. Further afield, [Gelderse Poort / Rhine Corridor](/lugar/gelderse-poort/) and
      [Millingerwaard Nature Reserve](/lugar/millingerwaard/) share cattle, horses and wetland habitats with
      Slikken van de Heen.
  fr:
    intro: >-
      En 1987, un barrage a été fermé et la mer a cessé d'entrer. Le Philipsdam, élément du plan Delta, a
      isolé le Krammer et le Volkerak de l'Oosterschelde, et les bancs de sable, vasières et prés salés qui
      montaient et descendaient avec la marée ont cessé de la sentir. Ils se sont asséchés, et l'eau de pluie
      a peu à peu dessalé le sol. Ce qui a poussé depuis est Slikken van de Heen : 598 hectares de paysage
      semi-ouvert, avec bosquets, fourrés et anciens chenaux de marée, près de Tholen, gérés par Het Zeeuwse
      Landschap.
    landscape: >-
      L'histoire est écrite dans le sol. La terre est riche en nutriments, et c'est pourquoi le couvert
      ligneux tend à se refermer vite. Là où la mer s'est retirée demeure un paysage herbeux et semi-ouvert où
      alternent clairières et secteurs boisés. Le canal Escaut-Rhin passe par ici et coupe depuis 1975 cette
      zone de marais en deux ; la partie orientale se trouve en Brabant-Septentrional et porte aussi le nom de
      Slikken van de Heen.


      C'est un lieu vivant, qui continue d'évoluer. On y voit pousser la scirpe maritime (*heen* ou
      *zeebies*), qui donne en partie son nom au site, et au ras du sol subsistent les anciens petits chenaux
      et les arbres couverts de mousse.
    wildlife: >-
      Ici, la gestion est assurée par les herbivores. Pour garder le terrain ouvert pâturent des hardes de
      chevaux Konik, des vaches Rode Geus depuis 2019 et, depuis 2020, des [bisons
      d'Europe](/especie/bison_bonasus/). Chacun mange différemment : les bisons consomment davantage l'écorce
      des grosses branches et des troncs, et tous ensemble freinent le calamagrostis commun, la fougère aigle
      et des exotiques envahissantes comme la berce du Caucase. La combinaison est la plus naturelle qui soit,
      car avant l'intervention humaine vaches, chevaux et bisons parcouraient cette partie de l'Europe.


      Au printemps, les oiseaux chanteurs emplissent le paysage. Les anciennes vasières sont riches en oiseaux
      nicheurs : le pipit des arbres, le [busard des roseaux](/especie/circus_aeruginosus/), le tarier pâtre,
      le rossignol philomèle et le pic épeichette. Le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) niche dans le secteur depuis 2018 et le [balbuzard
      pêcheur](/especie/pandion_haliaetus/) figure parmi les oiseaux remarquables du site. En hiver, le
      [faucon pèlerin](/especie/falco_peregrinus/) est presque toujours présent, avec de grands rassemblements
      d'oiseaux d'eau, et depuis l'observatoire on voit souvent la grande aigrette et des harles.


      Parmi les mammifères, le [chevreuil](/especie/capreolus_capreolus/) se laisse voir régulièrement, et les
      derniers arrivés sont la [martre des pins](/especie/martes_martes/) et le blaireau. Il y a aussi des
      renards.
    visit: >-
      Slikken van de Heen se découvre uniquement à pied : le vélo y est interdit. Deux sentiers peuvent se
      combiner. La Torenroute, d'environ trois kilomètres, passe près de la tour d'observation. La
      Kijkschermroute, d'environ trois kilomètres également, mène à un écran d'observation donnant sur un
      ancien chenal de marée fréquenté par les oiseaux d'eau.


      Tous deux partent du même point : le panneau d'information de Het Zeeuwse Landschap, sur la digue, au
      croisement du Campweg et de la voie parallèle au Philipsdam, où se trouve un parking. Le long des
      itinéraires on croise des hardes de chevaux Konik et de vaches Rode Geus, et avec un peu de chance on
      aperçoit les bisons ou un pygargue en vol. Parmi les propositions de Het Zeeuwse Landschap figure «
      Struinen door geulen, slikken en schorren », errer à travers chenaux, vasières et prés salés.
    history: >-
      Le grand tournant fut la fermeture du Philipsdam en 1987, qui changea à jamais le destin de ces bancs de
      sable. Comme le sol est très riche et que la végétation se referme vite, le gestionnaire a choisi une
      gestion naturelle par de grands herbivores, qui aident à maintenir le terrain ouvert et favorisent la
      biodiversité.
    before: >-
      Les mois les plus agréables vont de mai à septembre. En automne et en hiver le terrain peut être humide
      et boueux : prévoyez des chaussures solides ou des bottes. Comptez entre une demi-journée et une
      journée.
    around: >-
      À trente kilomètres se trouve le [Parc national De Biesbosch](/lugar/nationaal-park-de-biesbosch/), une
      autre zone humide du delta. Plus loin, la [Porte de Gueldre / Corridor du Rhin](/lugar/gelderse-poort/)
      et la [Réserve naturelle de Millingerwaard](/lugar/millingerwaard/) partagent avec Slikken van de Heen
      le bétail, les chevaux et la zone humide.
  de:
    intro: >-
      1987 wurde ein Damm geschlossen, und das Meer kam nicht mehr herein. Der Philipsdam, Teil der
      Deltawerke, trennte Krammer und Volkerak von der Oosterschelde, und die Sandbänke, Schlickflächen und
      Salzwiesen, die mit den Gezeiten stiegen und fielen, spürten sie nicht mehr. Sie trockneten ab, und
      Regenwasser entsalzte den Boden allmählich. Was seither gewachsen ist, ist Slikken van de Heen: 598
      Hektar halboffene Landschaft mit Gehölzen, Gebüsch und alten Prielen bei Tholen, betreut von Het Zeeuwse
      Landschap.
    landscape: >-
      Die Geschichte steht im Boden geschrieben. Der Boden ist nährstoffreich, weshalb sich das Gehölz rasch
      zu schließen droht. Wo sich das Meer zurückzog, bleibt eine grasreiche, halboffene Landschaft, in der
      sich Lichtungen und Waldteile abwechseln. Hier verläuft der Schelde-Rhein-Kanal, der dieses Marschgebiet
      seit 1975 teilt; der östliche Teil liegt in Nordbrabant und heißt ebenfalls Slikken van de Heen.


      Es ist ein lebendiger Ort, der sich weiter wandelt. Es wächst die Strand-Simse (*heen* oder *zeebies*),
      die dem Gebiet teilweise den Namen gibt, und am Boden bleiben die alten schmalen Rinnen und
      moosbewachsenen Bäume sichtbar.
    wildlife: >-
      Hier übernehmen die Pflanzenfresser die Pflege. Um das Gelände offen zu halten, weiden Herden von
      Konik-Pferden, seit 2019 Rode-Geus-Rinder und seit 2020 [Wisente](/especie/bison_bonasus/). Jede Art
      frisst anders: Wisente schälen mehr Rinde von starken Ästen und Stämmen, und gemeinsam bremsen sie
      Land-Reitgras, Adlerfarn und invasive Neophyten wie den Riesen-Bärenklau. Die Mischung ist die
      natürlichste, denn vor dem Eingriff des Menschen durchstreiften Rinder, Pferde und Wisente diesen Teil
      Europas.


      Im Frühling füllen Singvögel die Landschaft. Die ehemaligen Schlickflächen sind reich an Brutvögeln:
      Baumpieper, [Rohrweihe](/especie/circus_aeruginosus/), Schwarzkehlchen, Nachtigall und Kleinspecht. Der
      [Seeadler](/especie/haliaeetus_albicilla/) brütet seit 2018 im Gebiet, und der
      [Fischadler](/especie/pandion_haliaetus/) gehört zu den bemerkenswerten Arten des Gebiets. Im Winter ist
      der [Wanderfalke](/especie/falco_peregrinus/) fast immer da, zusammen mit großen
      Wasservogelansammlungen, und vom Beobachtungsschirm aus sieht man oft Silberreiher und Säger.


      Unter den Säugetieren zeigt sich das [Reh](/especie/capreolus_capreolus/) regelmäßig, und die jüngsten
      Zuzügler sind [Baummarder](/especie/martes_martes/) und Dachs. Auch Füchse leben hier.
    visit: >-
      Slikken van de Heen ist nur zu Fuß zugänglich: Radfahren ist nicht erlaubt. Es gibt zwei Wege, die sich
      kombinieren lassen. Die Torenroute, etwa drei Kilometer lang, führt am Aussichtsturm vorbei. Die
      Kijkschermroute, ebenfalls etwa drei Kilometer lang, führt zu einem Beobachtungsschirm mit Blick auf
      einen alten Gezeitenpriel voller Wasservögel.


      Beide starten am selben Punkt: an der Infotafel von Het Zeeuwse Landschap auf dem Deich, an der Kreuzung
      von Campweg und der Parallelstraße des Philipsdams, wo es einen Parkplatz gibt. Entlang der Wege
      begegnet man Herden von Konik-Pferden und Rode-Geus-Rindern, und mit etwas Glück sieht man die Wisente
      oder einen vorbeifliegenden Seeadler. Zu den Angeboten von Het Zeeuwse Landschap gehört «Struinen door
      geulen, slikken en schorren» – durch Rinnen, Schlickflächen und Salzwiesen streifen.
    history: >-
      Der große Wendepunkt war die Schließung des Philipsdams 1987, die das Schicksal dieser Sandbänke für
      immer veränderte. Da der Boden sehr nährstoffreich ist und der Wald schnell zuwächst, entschied sich der
      Verwalter für eine natürliche Pflege mit großen Pflanzenfressern, die das Gelände offen halten und die
      Artenvielfalt fördern.
    before: >-
      Die angenehmsten Monate sind Mai bis September. Im Herbst und Winter kann der Boden nass und schlammig
      sein, nimm also festes Schuhwerk oder Stiefel mit. Plane zwischen einem halben und einem ganzen Tag ein.
    around: >-
      Dreißig Kilometer entfernt liegt der [Nationalpark De Biesbosch](/lugar/nationaal-park-de-biesbosch/),
      ein weiteres Feuchtgebiet im Delta. Weiter weg teilen [Gelderse Poort /
      Rheinkorridor](/lugar/gelderse-poort/) und das [Naturschutzgebiet
      Millingerwaard](/lugar/millingerwaard/) mit Slikken van de Heen die Rinder, Pferde und das Feuchtgebiet.
  it:
    intro: >-
      Nel 1987 fu chiusa una diga e il mare smise di entrare. La Philipsdam, parte delle Opere del Delta,
      isolò il Krammer e il Volkerak dall'Oosterschelde, e i banchi di sabbia, i fondali fangosi e le barene
      che salivano e scendevano con la marea smisero di sentirla. Si asciugarono e l'acqua piovana addolcì via
      via il suolo salato. Ciò che è cresciuto da allora è Slikken van de Heen: 598 ettari di paesaggio
      semiaperto, con boschetti, macchie e antichi canali di marea, vicino a Tholen, gestiti da Het Zeeuwse
      Landschap.
    landscape: >-
      La storia è scritta nel suolo. Il terreno è ricco di nutrienti, e per questo la boscaglia tende a
      chiudersi in fretta. Dove il mare si è ritirato resta un paesaggio erboso e semiaperto in cui si
      alternano radure e parti boscose. Passa di qui il canale Schelda-Reno, che dal 1975 taglia in due questa
      zona di paludi; la parte orientale si trova nel Brabante Settentrionale e si chiama anch'essa Slikken
      van de Heen.


      È un luogo vivo, che continua a cambiare. Vi cresce la *heen* o *zeebies*, che dà in parte nome al sito,
      e rasoterra restano i vecchi canali stretti e gli alberi coperti di muschio.
    wildlife: >-
      Qui la gestione la fanno gli erbivori. Per mantenere aperto il terreno pascolano mandrie di cavalli
      Konik, dal 2019 vacche Rode Geus e, dal 2020, [bisonti europei](/especie/bison_bonasus/). Ognuno mangia
      in modo diverso: i bisonti consumano più corteccia di grandi rami e tronchi, e insieme frenano la
      cannuccia delle dune, la felce aquilina ed esotiche invasive come il panace di Mantegazzi. La
      combinazione è la più naturale, perché prima dell'intervento umano vacche, cavalli e bisonti
      percorrevano questa parte d'Europa.


      In primavera gli uccelli canori riempiono il paesaggio. Gli antichi fondali fangosi sono ricchi di
      uccelli nidificanti: prispolone, [falco di palude](/especie/circus_aeruginosus/), saltimpalo, usignolo e
      picchio rosso minore. L'[aquila di mare](/especie/haliaeetus_albicilla/) nidifica nella zona dal 2018 e
      il [falco pescatore](/especie/pandion_haliaetus/) figura tra gli uccelli di rilievo del sito. D'inverno
      il [falco pellegrino](/especie/falco_peregrinus/) è quasi sempre presente, insieme a grandi
      concentrazioni di uccelli acquatici, e dall'osservatorio si vedono spesso l'airone bianco maggiore e gli
      smerghi.


      Tra i mammiferi, il [capriolo](/especie/capreolus_capreolus/) si lascia vedere con regolarità, e gli
      ultimi arrivati sono la [martora](/especie/martes_martes/) e il tasso. Ci sono anche le volpi.
    visit: >-
      Slikken van de Heen è solo per camminare: non si può andare in bicicletta. Ci sono due percorsi che si
      possono combinare. La Torenroute, di circa tre chilometri, passa accanto alla torre panoramica. La
      Kijkschermroute, anch'essa di circa tre chilometri, porta a uno schermo di osservazione con vista su un
      antico canale di marea pieno di uccelli acquatici.


      Entrambi partono dallo stesso punto: il pannello informativo di Het Zeeuwse Landschap, sulla diga,
      all'incrocio tra Campweg e la strada parallela della Philipsdam, dove c'è un parcheggio. Lungo i
      percorsi si incontrano mandrie di cavalli Konik e vacche Rode Geus, e con fortuna si vedono i bisonti o
      passa in volo un'aquila di mare. Tra le proposte di Het Zeeuwse Landschap figura «Struinen door geulen,
      slikken en schorren», vagare tra canali, fanghi e barene.
    history: >-
      Il grande momento fu la chiusura della Philipsdam nel 1987, che cambiò per sempre il destino di questi
      banchi di sabbia. Poiché il suolo è molto ricco e il bosco si chiude rapidamente, il gestore ha scelto
      una gestione naturale con grandi erbivori, che aiutano a mantenere aperto il terreno e favoriscono la
      biodiversità.
    before: >-
      I mesi più piacevoli vanno da maggio a settembre. In autunno e inverno il terreno può essere bagnato e
      fangoso, quindi porta scarpe robuste o stivali. Calcola tra mezza giornata e una giornata intera.
    around: >-
      A trenta chilometri si trova il [Parco Nazionale De Biesbosch](/lugar/nationaal-park-de-biesbosch/),
      un'altra zona umida del delta. Più lontano, la [Porta di Gheldria / Corridoio del
      Reno](/lugar/gelderse-poort/) e la [Riserva Naturale di Millingerwaard](/lugar/millingerwaard/)
      condividono con Slikken van de Heen il bestiame, i cavalli e la zona umida.
  pt:
    intro: >-
      Em 1987 fechou-se uma barragem e o mar deixou de entrar. A Philipsdam, parte das Obras do Delta, isolou
      o Krammer e o Volkerak do Oosterschelde, e os bancos de areia, lodaçais e sapais que subiam e desciam
      com a maré deixaram de a sentir. Secaram, e a água da chuva foi dessalinizando o solo salgado. O que
      cresceu desde então é Slikken van de Heen: 598 hectares de paisagem semiaberta, com bosquetes, matagais
      e antigos esteiros de maré, junto a Tholen, geridos pela Het Zeeuwse Landschap.
    landscape: >-
      A história está escrita no solo. A terra é rica em nutrientes, e por isso o mato tende a fechar-se
      depressa. Onde o mar recuou fica uma paisagem herbácea e semiaberta em que alternam clareiras e manchas
      de bosque. Passa por aqui o canal Escalda-Reno, que desde 1975 corta esta zona de sapais em duas; a
      parte oriental fica no Brabante do Norte e também se chama Slikken van de Heen.


      É um lugar vivo, que continua a mudar. Cresce a *heen* ou *zeebies*, que dá em parte nome ao sítio, e
      rente ao chão ficam os velhos canais estreitos e as árvores cobertas de musgo.
    wildlife: >-
      Aqui a gestão é feita pelos herbívoros. Para manter aberto o terreno pastam manadas de cavalos Konik,
      desde 2019 vacas Rode Geus e, desde 2020, [bisontes-europeus](/especie/bison_bonasus/). Cada um come de
      forma diferente: os bisontes consomem mais casca de ramos grandes e troncos, e juntos travam o
      caniço-das-dunas, o feto-comum e exóticas invasoras como a salsa-gigante. A combinação é a mais natural,
      porque antes da intervenção humana vacas, cavalos e bisontes percorriam esta parte da Europa.


      Na primavera, as aves canoras enchem a paisagem. Os antigos lodaçais são ricos em aves nidificantes:
      petinha-das-árvores, [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/), cartaxo-comum,
      rouxinol-comum e pica-pau-malhado-pequeno. A [águia-rabalva](/especie/haliaeetus_albicilla/) nidifica na
      zona desde 2018 e a [águia pescadora](/especie/pandion_haliaetus/) figura entre as aves destacadas do
      lugar. No inverno, o [falcão-peregrino](/especie/falco_peregrinus/) está quase sempre presente,
      juntamente com grandes concentrações de aves aquáticas, e do observatório costumam ver-se a
      garça-branca-grande e mergansos.


      Entre os mamíferos, a [corça](/especie/capreolus_capreolus/) deixa-se ver com regularidade, e os últimos
      a chegar são a [marta do pinheiro europeia](/especie/martes_martes/) e o texugo. Também há raposas.
    visit: >-
      Slikken van de Heen é apenas para caminhar: não se pode andar de bicicleta. Há dois trilhos que se podem
      combinar. A Torenroute, de cerca de três quilómetros, passa junto à torre miradouro. A Kijkschermroute,
      também de cerca de três, leva a um painel de observação com vista para um antigo canal de maré com aves
      aquáticas.


      Ambos partem do mesmo ponto: o painel informativo da Het Zeeuwse Landschap, sobre o dique, no cruzamento
      da Campweg com a via paralela da Philipsdam, onde há estacionamento. Ao longo dos percursos cruzam-se
      manadas de cavalos Konik e vacas Rode Geus, e com sorte veem-se os bisontes ou passa a voar uma
      águia-rabalva. Entre as propostas da Het Zeeuwse Landschap figura «Struinen door geulen, slikken en
      schorren», vaguear por canais, lodaçais e sapais.
    history: >-
      O grande momento foi o fecho da Philipsdam em 1987, que mudou para sempre o destino destes bancos de
      areia. Como o solo é muito rico e o mato fecha depressa, o gestor optou por uma gestão natural com
      grandes herbívoros, que ajudam a manter aberto o terreno e favorecem a biodiversidade.
    before: >-
      Os meses mais agradáveis vão de maio a setembro. No outono e no inverno o terreno pode estar molhado e
      enlameado, pelo que convém levar calçado resistente ou botas. Calcula entre meio dia e um dia inteiro.
    around: >-
      A trinta quilómetros fica o [Parque Nacional De Biesbosch](/lugar/nationaal-park-de-biesbosch/), outra
      zona húmida do delta. Mais longe, a [Porta de Guéldria / Corredor do Reno](/lugar/gelderse-poort/) e a
      [Reserva Natural de Millingerwaard](/lugar/millingerwaard/) partilham com Slikken van de Heen o gado, os
      cavalos e a zona húmida.
