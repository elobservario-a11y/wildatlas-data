  en: >-
    Fast-flowing meandering river flanked by preserved alluvial gallery forests and historic floating boat
    mills.
  fr: Rivière sauvage et méandrique aux eaux vives abritant moulins flottants et forêts alluviales préservées.
  de: Mäandrierender Wildfluss mit Stromschnellen, historischen Schiffsmühlen und intakten Auwäldern.
  it: Fiume meandriforme a corrente vivace con caratteristici mulini galleggianti e boschi golenali preservati.
  pt: Rio meandriforme de águas bravas com azenhas flutuantes tradicionais e matas de galeria preservadas.
unico:
