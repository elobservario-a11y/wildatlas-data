    Un río que aún cambia de curso y que conserva molinos flotantes, bosques aluviales viejos y una nutria que
    lo recorre entero.
  en: >-
    A dynamically shifting river preserving traditional floating boat mills, ancient alluvial gallery forests,
    and a continuous European otter corridor.
  fr: >-
    Une rivière vivante qui déplace ses bancs de graviers, conservant des moulins à nef, des forêts inondables
    et une loutre omniprésente.
  de: >-
    Ein dynamischer Flusslauf voller Kiesbänke mit traditionellen Schiffsmühlen, urigen Auwäldern und
    durchgängigen Fischotterrevieren.
  it: >-
    Un fiume che continua a mutare alveo conservando mulini su barche, boschi alluvionali vetusti e una
    popolazione continua di lontre.
  pt: >-
    Um rio dinâmico que desloca o seu leito conservando moinhos em barcas, florestas aluviais antigas e uma
    lontra que o percorre na totalidade.
