resumen:
  es: >-
    El primer Parque Natural de la Valle de Aosta, caracterizado por la mayor masa continua de pino uncinata
    (*Pinus uncinata*) de la región y más de 30 estanques de circo glaciar.
  en: >-
    The first Natural Park in the Aosta Valley, featuring the region's largest continuous stand of mountain
    pine (*Pinus uncinata*) and over 30 glacial cirque tarns.
  fr: >-
    Le premier parc naturel de la Vallée d'Aoste, caractérisé par le plus vaste peuplement continu de pin à
    crochets (*Pinus uncinata*) de la région et plus de 30 lacs de cirque.
  de: >-
    Der erste Naturpark des Aostatals, geprägt vom größten zusammenhängenden Bergkiefernwald (*Pinus
    uncinata*) der Region und über 30 Karseen.
  it: >-
    Il primo Parco Naturale della Valle d'Aosta, caratterizzato dalla più estesa foresta continua di pino
    uncinato (*Pinus uncinata*) della regione e oltre 30 specchi d'acqua di circo glaciale.
  pt: >-
    O primeiro Parque Natural do Vale de Aosta, caracterizado pela mais extensa mancha contínua de
    pinheiro-uncinado (*Pinus uncinata*) da região e mais de 30 lagoas de circo glaciar.
unico:
  es: >-
    Hay bosques que viven de las raíces de un solo árbol: al menos cien especies de hongos conviven en
    simbiosis con las raíces del pino negro de Mont Avic.
  en: >-
    Forests that rely on the root systems of a single species: at least one hundred fungi species live in
    mycorrhizal symbiosis with the roots of Mont Avic's mountain pine.
  fr: >-
    Des forêts qui vivent en symbiose étroite : au moins cent espèces de champignons vivent en association
    mycorhizienne avec les racines du pin à crochets du Mont Avic.
  de: >-
    Wälder, die von den Wurzeln einer einzigen Baumart leben: Mindestens hundert Pilzarten leben in
    Mykorrhiza-Symbiose mit den Wurzeln der Bergkiefer des Mont Avic.
  it: >-
    Boschi che prosperano sulle radici di un'unica essenza arborea: almeno cento specie fungine vivono in
    simbiosi micorrizica con le radici del pino uncinato del Mont Avic.
  pt: >-
    Florestas que dependem das raízes de uma só árvore: pelo menos cem espécies de fungos vivem em simbiose
    micorrízica com as raízes do pinheiro-uncinado de Mont Avic.
observaciones:
  es: >-
    Quédate en los senderos señalizados: así se evitan molestias a la fauna y daños a la vegetación. Los
    centros de visitantes tienen horario por temporada, así que comprueba antes de ir cuándo abren.
texto:
  es:
    intro: >-
      Mont Avic no sale en las rutas grandes del Valle de Aosta, y eso es parte de su carácter. Está apartado,
      entre el barranco de Champdepraz y el valle de Champorcher, y guarda el mayor bosque de pino negro de
      los Alpes italianos, más de 1.100 hectáreas de una conífera que aquí vive en turberas, sobre rocas y en
      suelos que casi nadie más aguantaría. El Gran Paradiso queda al lado y este parque, el primero de los
      naturales regionales del Valle de Aosta, sigue siendo el sitio donde las cabras monteses, los rebecos y
      las marmotas se ven con calma.
    landscape: >-
      Mont Avic es un paisaje de piedra verde. Las rocas del parque, las ofiolitas, son un fragmento de cuenca
      oceánica que quedó implicado en la orogenia alpina cuando África y Europa chocaron. Esas serpentinitas
      dan suelos poco profundos y pobres en nutrientes, y por eso la flora aquí es otra: pocas especies,
      adaptadas a suelos superficiales, poco fértiles y con elementos tóxicos como níquel, cromo y cobalto.
      Sobre ellas viven más de cien especies de líquenes de roca.


      Los glaciares cuaternarios hicieron el resto. Dejaron rocas pulidas y estriadas y numerosos circos
      glaciares que hoy ocupan lagos, sobre todo en el sector meridional del valle. De ahí vienen tantos lagos
      pequeños y zonas húmedas, y de ellas las turberas, poco frecuentes en los valles de los Alpes
      occidentales italianos y aquí tan numerosas que son los biotopos más importantes del parque.


      Tres cumbres afiladas rodean el parque: el Avic (3.003 m), el Iverta (2.936 m) y el Glacier (3.186 m)
      separan el barranco de Champdepraz del valle de Champorcher. Entre ellas, los bosques dominan casi sin
      interrupción hasta más allá de los 2.000 m. En el valle Chalamy el pino negro sustituye en buena parte
      al alerce y al abeto rojo, que son las coníferas más comunes en el resto de la región, y hay además
      hayedos, que faltan en todo el Valle de Aosta medio y alto. Y si miras de cerca, los pinos que crecen en
      turbera o en grietas de roca crecen tan despacio que pueden formar bonsáis naturales.
    wildlife: >-
      En el barranco de Dondena es más fácil ver mamíferos conocidos como la
      [marmota](/especie/marmota_marmota/), la [cabra montés](/especie/capra_ibex/) y el
      [rebeco](/especie/rupicapra_rupicapra/), entre amplias praderas alpinas interrumpidas por barras
      rocosas. También hay liebre variable, y en el valle Chalamy el corzo, la ardilla y el lirón careto.


      Las aves son otro motivo para venir: se han observado más de 120 especies y más de 90 crían. Tres
      parejas de [águila real](/especie/aquila_chrysaetos/) ocupan territorios que incluyen, además del
      parque, la vertiente derecha del Dora Baltea y la cabecera del valle de Champorcher. La perdiz nival,
      reliquia glaciar de la tundra alpina, vive por encima de los 2.100-2.200 m. El [gallo
      lira](/especie/tetrao_tetrix/) se vigila cada primavera en la época de los cortejos de los machos y en
      invierno excava iglús en la nieve polvo, donde pasa la noche y buena parte del día. En los bosques el
      [pito negro](/especie/dryocopus_martius/) se da a razón de una pareja cada 300 hectáreas
      aproximadamente.


      Y la fauna menuda es sorprendente: más de 1.100 especies de mariposas, el 70 % de los macrolepidópteros
      conocidos en todo el Valle de Aosta, y cuatro especies de microlepidópteros nuevas para la ciencia. En
      verano, en las turberas, las zonas húmedas se cubren de los penachos blancos de los eriófaros, entre
      musgos, trece esfagnos y la carnívora Drosera rotundifolia.
    visit: >-
      Empieza por uno de los dos centros de visitantes. El de Champdepraz tiene un museo naturalista
      interactivo sobre los ambientes rocosos, las zonas húmedas y los bosques del valle Chalamy, y una
      maqueta a escala 1:5.000 del parque con sus límites, senderos y referencias. El de Champorcher ocupa la
      Villa Biamonti, un edificio de principios del siglo XX que el parque compró al municipio en 2006: una
      planta explica la geología y la morfología del barranco de Dondena, y otra la flora, la fauna y la
      actividad pastoral, con montajes originales sobre pequeños y grandes depredadores. Además, las «Portes
      d'entrée» dan información breve en los puntos de partida de las rutas principales, y hay una en la
      estación de tren de Hône.


      Para caminar, el parque tiene más de cien kilómetros de senderos señalizados, y pide que no te salgas de
      ellos. El más frecuentado sale del valle de Champorcher, cruza el Col du lac blanc y baja al barranco de
      Champdepraz, con el Cervino y el Monte Rosa al fondo; por el camino pasas por el lac Blanc, junto al
      refugio Barbustel, y por el lac Cornu, hasta el Grand Lac, el mayor lago natural del Valle de Aosta. Por
      el valle de Champorcher llegas al lago Misérin, de 22 hectáreas y a 2.576 m, y por la antigua calzada de
      caza de los Saboya a la Fenêtre de Champorcher, un paso a 2.826 m. Otros senderos salen de Chevrère y de
      Veulla, a 1.300 m, y pasan por lagos, bosques y restos de la minería antigua. El itinerario Dondena–Col
      Fenêtre permite ver marmotas y fauna alpina a lo largo del trayecto, y el Dondena–Col Pontonnet
      atraviesa hábitats de rebecos y cabras monteses.
    history: >-
      El parque nació en 1989 y se amplió en 2003. Lo que hoy se camina fue, antes, minería: las
      mineralizaciones de magnetita del Lago Gelato, a 2.600 m, ya se explotaban en 1693 y la explotación
      continuó con altibajos hasta 1893.


      Hoy el parque es Zona Especial de Conservación de la red ecológica europea, y entre 1997 y 2000
      desarrolló un proyecto Life-Natura para proteger bosques, turberas y enclaves de ofiolitas de alta cota.
      Para cuidar los bosques se concentra la presencia humana en los senderos y se limitan las talas. Es
      también el primer parque de Europa en adherirse a EMAS, el sistema de gestión ambiental verificada.
    before: >-
      Quédate en los senderos señalizados: así se evitan molestias a la fauna y daños a la vegetación. Los
      centros de visitantes tienen horario por temporada, así que comprueba antes de ir cuándo abren.
    around: >-
      El [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) está a unos 1 km y es el
      vecino con el que Mont Avic comparte montaña. Más lejos, el [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) comparte con él la cabra montés, el rebeco y los
      biomas de alta montaña y bosque maduro.
  en:
    intro: >-
      Mont Avic lies off the beaten tourist track of the Aosta Valley, and that seclusion defines its
      character. Tucked between the Champdepraz ravine and the Champorcher valley, it preserves the largest
      mountain pine forest in the Italian Alps: over 1,100 hectares of a hardy conifer that thrives in peat
      bogs, rocky fissures, and nutrient-poor soils where almost nothing else can grow. Gran Paradiso lies
      right next door, yet this park—the first regional natural park created in the Aosta Valley—remains an
      unspoiled haven where alpine ibex, chamois, and marmots can be observed in complete tranquility.
    landscape: >-
      Mont Avic is a world sculpted from greenstone. The park's bedrock consists of ophiolites, fragments of
      ancient oceanic crust swept into the Alpine orogeny when Africa collided with Europe. These
      serpentinites weather into shallow, nutrient-starved soils laden with toxic heavy metals such as nickel,
      chromium, and cobalt. Consequently, only a specialized flora can survive, complemented by more than one
      hundred species of saxicolous lichens.


      Quaternary glaciers completed the topography: polished rock slabs, striations, and numerous glacial
      cirques now cradle high-mountain lakes, particularly across the southern sector. This glaciation
      produced abundant wetlands and peat bogs—rarities across the valleys of the western Italian Alps, yet so
      widespread here that they constitute the park's most significant biotopes.


      Three jagged peaks encircle the park: Mont Avic (3,003 m), Mont Iverta (2,936 m), and Mont Glacier
      (3,186 m) demarcate the Champdepraz gorge from the Champorcher valley. Below them, unbroken forests
      stretch past 2,000 m. In the Chalamy valley, mountain pine largely replaces larch and Norway spruce,
      accompanied by montane beechwoods absent from most of the upper Aosta Valley. Where pines grow on acidic
      peat or in rock crevices, their stunted growth creates genuine natural bonsai trees.
    wildlife: >-
      The Dondena basin offers prime vantage points to observe prominent mammals such as the [alpine
      marmot](/especie/marmota_marmota/), [alpine ibex](/especie/capra_ibex/), and
      [chamois](/especie/rupicapra_rupicapra/) across wide alpine meadows punctuated by rocky outcrops.
      Mountain hares also inhabit these heights, while roe deer, red squirrels, and garden dormice occupy the
      Chalamy woods.


      Avian life is exceptionally rich: over 120 species have been recorded, with more than 90 breeding
      locally. Three pairs of [golden eagles](/especie/aquila_chrysaetos/) maintain territories spanning the
      park, the right flank of the Dora Baltea, and the head of the Champorcher valley. Rock ptarmigans,
      glacial relicts of the alpine tundra, dwell above 2,100-2,200 m. The [black
      grouse](/especie/tetrao_tetrix/) is monitored each spring during courtship displays, digging snow caves
      during winter to roost. In ancient woodlands, the [black woodpecker](/especie/dryocopus_martius/) occurs
      at a density of roughly one pair per 300 hectares.


      Invertebrate diversity proves remarkable: over 1,100 butterfly and moth species, accounting for 70 % of
      all macrolepidoptera recorded across the Aosta Valley, including four microlepidoptera species new to
      science. In summer, peat bogs are blanketed with white cotton-grass tassels among mosses, thirteen
      sphagnum species, and carnivorous round-leaved sundews.
    visit: >-
      Begin at one of the two visitor centres. The Champdepraz centre houses an interactive natural history
      museum exploring rocky habitats, wetlands, and the Chalamy forests, alongside a 1:5,000 scale model of
      the park showing boundaries and trails. The Champorcher centre occupies Villa Biamonti, an early
      twentieth-century villa acquired in 2006: one floor details the geology of the Dondena gorge, while
      another explores flora, fauna, and traditional pastoralism. Additional information kiosks at gateway
      points include one at Hône railway station.


      For hiking, the park maintains more than one hundred kilometres of marked paths. The most popular trek
      ascends from the Champorcher valley over the Col du Lac Blanc down into the Champdepraz ravine, set
      against views of the Matterhorn and Monte Rosa; along the way lie Lac Blanc by the Barbustel hut, Lac
      Cornu, and Grand Lac—the largest natural lake in the Aosta Valley. From Champorcher you can reach Lake
      Misérin, spanning 22 hectares at 2,576 m, and follow the historic royal hunting road to the Fenêtre de
      Champorcher at 2,826 m. Other trails depart Chevrère and Veulla at 1,300 m, winding past tarns, forests,
      and historic mine workings.
    history: >-
      The natural park was established in 1989 and enlarged in 2003. Today's hiking terrain preserves traces
      of historic mining: magnetite deposits at Lago Gelato at 2,600 m were exploited as early as 1693, with
      intermittent operations continuing until 1893.


      Today, the park is designated a Special Area of Conservation within the European ecological network;
      between 1997 and 2000 it implemented a Life-Nature project targeting forests, peat bogs, and
      high-altitude ophiolitic habitats. To protect delicate woodlands, visitor flows are channeled along
      marked trails while commercial logging is restricted. Mont Avic was also the first park in Europe to
      obtain EMAS environmental certification.
    before: >-
      Always keep to marked trails to prevent disturbance to wildlife and avoid damaging sensitive peatland
      vegetation. Visitor centres operate on seasonal timetables, so verify opening hours before setting out.
    around: >-
      The [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) lies roughly 1 km away as
      Mont Avic's immediate mountain neighbour. Farther afield, [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) shares alpine ibex, chamois, and mature
      high-mountain forest biomes.
  fr:
    intro: >-
      Le Mont Avic ne figure pas sur les grands axes touristiques de la Vallée d'Aoste, et cette discrétion
      forge son authenticité. Niché entre le vallon de Champdepraz et la vallée de Champorcher, il abrite la
      plus vaste forêt de pin à crochets des Alpes italiennes : plus de 1 100 hectares d'un conifère capable
      de prospérer sur tourbières, dalles rocheuses et sols hostiles. Le Grand-Paradis est tout proche, mais
      ce premier parc naturel régional valdôtain demeure le havre où observer bouquetins, chamois et marmottes
      en toute sérénité.
    landscape: >-
      Le Mont Avic est un royaume de pierre verte. Ses roches, des ophiolites, constituent d'anciennes
      portions de croûte océanique charriées lors de l'orogenèse alpine lors de la collision de l'Afrique et
      de l'Europe. Ces serpentinites donnent des sols minces et pauvres en nutriments, chargés en éléments
      toxiques comme le nickel, le chrome et le cobalt. Seule une flore hautement spécialisée y survit,
      accompagnée de plus de cent espèces de lichens saxicoles.


      Les glaciers quaternaires ont parachevé le décor en modelant roches moutonnées et cirques d'altitude
      abritant de nombreux lacs. De cette morphologie découlent de multiples zones humides et tourbières,
      rares dans les Alpes occidentales italiennes et constituant ici les biotopes majeurs du parc.


      Trois sommets acérés ceinturent le territoire : le mont Avic (3 003 m), le mont Iverta (2 936 m) et le
      mont Glacier (3 186 m) séparent Champdepraz de Champorcher. Sous leurs cimes, la forêt s'étend d'un seul
      tenant au-delà de 2 000 m. Dans le val Chalamy, le pin à crochets supplante largement mélèzes et
      épicéas, avec des hêtraies remarquables pour la haute vallée d'Aoste. Les pins poussant sur tourbières
      ou dans les anfractuosités rocheuses adoptent une croissance si ralentie qu'ils forment de véritables
      bonsaïs naturels.
    wildlife: >-
      Le vallon de Dondena constitue le meilleur observatoire pour apercevoir la [marmotte des
      Alpes](/especie/marmota_marmota/), le [bouquetin des Alpes](/especie/capra_ibex/) et le
      [chamois](/especie/rupicapra_rupicapra/) sur de vastes pelouses alpines. Le lièvre variable peuple
      également les hauteurs, tandis que chevreuil, écureuil et lérot fréquentent les bois du Chalamy.


      L'avifaune est remarquable : plus de 120 espèces d'oiseaux ont été recensées, dont plus de 90
      nidificatrices. Trois couples d'[aigle royal](/especie/aquila_chrysaetos/) contrôlent des territoires
      englobant le parc et le haut Champorcher. Le lagopède alpin, relique glaciaire, évolue au-dessus de 2
      100-2 200 m. Le [tétras lyre](/especie/tetrao_tetrix/) est suivi chaque printemps lors des parades
      nuptiales et creuse en hiver des igloos dans la poudreuse. Dans les vieilles forêts, le [pic
      noir](/especie/dryocopus_martius/) s'établit à raison d'un couple pour environ 300 hectares.


      La petite faune réserve des surprises : plus de 1 100 espèces de papillons, soit 70 % des
      macrolépidoptères de la Vallée d'Aoste, avec quatre espèces de microlépidoptères nouvelles pour la
      science. En été, les tourbières se couvrent des plumets blancs des linaigrettes parmi les sphaignes,
      avec treize espèces inventoriées, et la droséra carnivore.
    visit: >-
      Commencez par l'un des deux centres d'accueil. Celui de Champdepraz abrite un musée interactif sur les
      milieux rocheux et humides du Chalamy, assorti d'une maquette en relief au 1:5 000 du parc. Celui de
      Champorcher occupe la Villa Biamonti, bâtisse du début du XXe siècle acquise en 2006, consacrée à la
      géologie de Dondena et aux activités pastorales. Des bornes d'accueil renseignent également les
      visiteurs, notamment en gare de Hône.


      Pour les marcheurs, le parc totalise plus de cent kilomètres de sentiers balisés. La traversée classique
      part de Champorcher, franchit le col du Lac Blanc et descend dans le vallon de Champdepraz face au
      Cervin et au Mont Rose, longeant le lac Blanc, le lac Cornu et le Grand Lac — le plus vaste lac naturel
      de la Vallée d'Aoste. Depuis Champorcher, on gagne le lac Misérin de 22 hectares à 2 576 m et la Fenêtre
      de Champorcher à 2 826 m. D'autres sentiers s'élancent de Chevrère et de Veulla à 1 300 m et cheminent à
      travers lacs, forêts et vestiges miniers séculaires. Le circuit Dondena–Col Fenêtre permet d'observer
      marmottes et faune alpine tout au long du parcours, tandis que l'itinéraire Dondena–Col Pontonnet
      traverse les biotopes privilégiés des chamois et des bouquetins.
    history: >-
      Le parc fut fondé en 1989 et étendu en 2003. Ces versants portent l'empreinte d'une ancienne tradition
      minière : les gisements de magnétite du Lago Gelato à 2 600 m étaient exploités dès 1693, activité
      poursuivie jusqu'en 1893.


      Aujourd'hui classé zone spéciale de conservation européenne, le parc a mené entre 1997 et 2000 un
      programme Life-Nature pour préserver forêts et tourbières. Pour protéger les peuplements, le public est
      canalisé sur les sentiers et l'exploitation forestière encadrée. Mont Avic fut également le premier parc
      européen certifié EMAS.
    before: >-
      Restez strictement sur les chemins balisés afin de ne pas perturber la faune ni endommager les
      tourbières sensibles. Les maisons du parc appliquant des horaires saisonniers, vérifiez leurs périodes
      d'ouverture avant de planifier vos randonnées.
    around: >-
      Le [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) se trouve à environ 1 km,
      formant avec le Mont Avic un même ensemble montagnard. Plus loin, le [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) partage bouquetins, chamois et forêts d'altitude
      préservées.
  de:
    intro: >-
      Der Mont Avic liegt abseits der touristischen Hauptrouten des Aostatals, und diese Abgeschiedenheit
      prägt seinen Charakter. Eingebettet zwischen der Champdepraz-Schlucht und dem Champorcher-Tal bewahrt er
      den größten Bergkiefernwald der italienischen Alpen: über 1.100 Hektar eines Nadelbaums, der auf Mooren,
      Felsbändern und nährstoffarmen Böden überdauert. Der Gran Paradiso liegt direkt nebenan, doch dieser
      erste Regionalnaturpark des Aostatals bleibt ein Rückzugsort, an dem Steinböcke, Gämsen und Murmeltiere
      in aller Ruhe beobachtet werden können.
    landscape: >-
      Mont Avic ist eine Landschaft aus grünem Serpentinitgestein. Bei den Ophiolithen handelt es sich um
      Bruchstücke ozeanischer Kruste, die bei der Kollision Afrikas mit Europa in die Alpenfaltung gerieten.
      Diese Gesteine verwittern zu flachgründigen Böden mit toxischen Schwermetallen wie Nickel, Chrom und
      Kobalt. Darauf gedeiht eine hochspezialisierte Flora, begleitet von mehr als hundert saxicolen
      Flechtenarten.


      Eiszeitliche Gletscher schufen Rundhöcker, Gletscherschliffe und Kare mit zahlreichen Bergseen im
      südlichen Talbereich. Hieraus entstanden wertvolle Feuchtgebiete und Hochmoore, die in den italienischen
      Westalpen Seltenheitswert besitzen und die bedeutendsten Biotope des Parks bilden.


      Drei markante Felsgipfel rahmen das Gebiet ein: Mont Avic (3.003 m), Mont Iverta (2.936 m) und Mont
      Glacier (3.186 m) trennen Champdepraz vom Champorcher-Tal. Darunter ziehen sich geschlossene Wälder bis
      über 2.000 m Höhe. Im Chalamy-Tal dominiert die Bergkiefer anstelle von Lärche und Fichte, ergänzt durch
      für das Aostatal seltene Buchenwälder. Auf Moorböden und in Felsspitzen bilden die Kiefern zwergwüchsige
      Natur-Bonsais.
    wildlife: >-
      Im Dondena-Kessel lassen sich [Alpenmurmeltier](/especie/marmota_marmota/),
      [Alpensteinbock](/especie/capra_ibex/) und [Gämse](/especie/rupicapra_rupicapra/) auf weiten alpinen
      Matten hervorragend beobachten. Schneehasen bewohnen die Hochlagen, während im Chalamy-Tal Reh,
      Eichhörnchen und Gartenschläfer leben.


      Die Vogelwelt ist vielfältig: Über 120 Arten wurden nachgewiesen, von denen mehr als 90 im Park brüten.
      Drei Paare des [Steinadlers](/especie/aquila_chrysaetos/) beanspruchen Reviere im Parkgebiet. Das
      Alpenschneehuhn lebt oberhalb von 2.100-2.200 m. Das [Birkhuhn](/especie/tetrao_tetrix/) wird im
      Frühjahr bei der Balz beobachtet und gräbt im Winter Höhlen in den Pulverschnee. In Altholzbeständen
      nistet der [Schwarzspecht](/especie/dryocopus_martius/) mit etwa einem Brutpaar pro 300 Hektar.


      Die Insektenfauna ist beachtlich: über 1.100 Schmetterlingsarten — 70 % aller im Aostatal bekannten
      Großschmetterlinge — mit vier für die Wissenschaft neuen Kleinschmetterlingsarten. Im Sommer leuchten
      Wollgräser in den Mooren neben dreizehn Torfmoosarten und dem Sonnentau.
    visit: >-
      Empfehlenswert ist der Beginn in einem der beiden Besucherzentren. Champdepraz bietet ein interaktives
      Museum zu Fels- und Feuchtlebensräumen sowie ein Geländemodell des Parks im Maßstab 1:5.000. In
      Champorcher beherbergt die 2006 erworbene Villa Biamonti aus dem frühen zwanzigsten Jahrhundert
      Ausstellungen zur Geologie und Weidewirtschaft. Eingangspforten informieren an Wanderstartpunkten wie
      dem Bahnhof Hône.


      Der Park bietet über hundert Kilometer markierte Wanderwege. Die Hauptroute führt von Champorcher über
      den Col du Lac Blanc nach Champdepraz mit Blicken auf Matterhorn und Monte Rosa, vorbei am Lac Blanc bei
      der Barbustel-Hütte, dem Lac Cornu und dem Grand Lac. Von Champorcher aus erreicht man den 22 Hektar
      großen Lago Misérin auf 2.576 m und die Fenêtre de Champorcher auf 2.826 m. Weitere Wege beginnen in
      Chevrère und Veulla auf 1.300 m und führen an Bergseen, Wäldern und historischen Bergbaurelikten vorbei.
      Die Route Dondena–Col Fenêtre ermöglicht unterwegs Beobachtungen von Murmeltieren und Alpenwild, während
      der Weg Dondena–Col Pontonnet Lebensräume von Gämsen und Steinböcken durchquert.
    history: >-
      Der Park wurde 1989 gegründet und 2003 erweitert. Historische Bergbauspuren prägen das Gelände:
      Magnetitvorkommen am Lago Gelato auf 2.600 m wurden bereits 1693 abgebaut, ein Betrieb, der bis 1893
      währte.


      Heute ist das Gebiet ein europäisches FFH-Schutzgebiet; von 1997 bis 2000 lief ein Life-Natur-Projekt
      zur Sicherung der Moor- und Ophiolithwälder. Mont Avic war zudem der erste Park Europas mit
      EMAS-Umweltzertifizierung.
    before: >-
      Bleibe auf den markierten Pfaden, um Wildtiere nicht zu stören und empfindliche Moorvegetation zu
      schützen. Informiere dich vorab über die saisonalen Öffnungszeiten der Besucherzentren.
    around: >-
      Der [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) liegt etwa 1 km entfernt als
      direkter Nachbar. Weiter entfernt teilt der [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) Steinböcke, Gämsen und alte Bergwälder mit dem
      Mont Avic.
  it:
    intro: >-
      Il Mont Avic non compare lungo le grandi arterie turistiche della Valle d'Aosta, e questo isolamento ne
      custodisce l'integrità. Racchiuso tra il vallone di Champdepraz e la valle di Champorcher, tutela la più
      vasta foresta di pino uncinato delle Alpi italiane: oltre 1.100 ettari di una conifera capace di
      allignare su torbiere, pietraie e suoli sterili. Il Gran Paradiso sorge a ridosso, ma questo parco — il
      primo tra i parchi naturali regionali valdostani — resta il luogo dove osservare stambecchi, camosci e
      marmotte nella più quieta solitudine.
    landscape: >-
      Il Mont Avic è un regno minerale di pietre verdi. Le ofioliti del parco rappresentano frammenti di
      fondale oceanico inglobati nell'orogenesi alpina durante lo scontro tra Africa ed Europa. Tali
      serpentiniti generano suoli sottili e poveri di sostanze nutritive, intrisi di metalli pesanti tossici
      quali nichel, cromo e cobalto. Ne scaturisce una flora altamente specializzata, accompagnata da più di
      cento specie di licheni rupicoli.


      I ghiacciai quaternari hanno levigato rocce montonate e scavato circhi d'alta quota che oggi ospitano
      numerosi laghetti nel settore meridionale. Da qui ha origine un reticolo di zone umide e torbiere, assai
      rare nelle vallate alpine occidentali e qui tanto copiose da costituire i biotopi prioritari del parco.


      Tre vette aguzze delimitano l'area protetta: il Mont Avic (3.003 m), il Mont Iverta (2.936 m) e il Mont
      Glacier (3.186 m) separano Champdepraz da Champorcher. Al di sotto, le foreste risalgono ininterrotte
      fin oltre i 2.000 m. Nel vallone Chalamy il pino uncinato surroga abete rosso e larice, con la presenza
      di faggete assenti nel medio e alto bacino della Dora Baltea. Dove i pini crescono su torba o in
      fenditure rocciose, l'accrescimento è così lento da plasmare veri bonsai naturali.
    wildlife: >-
      Nel vallone di Dondena si scorgono agevolmente [marmotta](/especie/marmota_marmota/),
      [stambecco](/especie/capra_ibex/) e [camoscio alpino](/especie/rupicapra_rupicapra/) su ampie praterie
      d'alta quota interrotte da costoni rocciosi. Frequente è la lepre variabile, mentre nei boschi del
      Chalamy vivono capriolo, scoiattolo e moscardino.


      L'avifauna vanta oltre 120 specie censite, di cui più di 90 nidificanti. Tre coppie di [aquila
      reale](/especie/aquila_chrysaetos/) governano territori che comprendono il parco e l'alto vallone di
      Champorcher. La pernice bianca, relitto glaciale, staziona al di sopra dei 2.100-2.200 m. Il [fagiano di
      monte](/especie/tetrao_tetrix/) viene censito ogni primavera durante le arene nuziali e d'inverno scava
      ricoveri nella coltre nevosa. Nelle selve mature il [picchio nero](/especie/dryocopus_martius/) vanta
      una densità di una coppia ogni 300 ettari circa.


      Straordinaria è la microfauna: oltre 1.100 specie di lepidotteri, pari al 70 % dei macrolepidotteri
      valdostani, con quattro specie di microlepidotteri scoperte qui per la prima volta. D'estate le torbiere
      si tingono dei fiocchi bianchi degli eriofori tra cuscinetti di sfagni, con tredici specie presenti, e
      la carnivora Drosera rotundifolia.
    visit: >-
      Conviene prendere le mosse da uno dei due centri visitatori. Quello di Champdepraz ospita un museo
      naturalistico interattivo e un plastico in scala 1:5.000 del territorio protetto. A Champorcher la sede
      di Villa Biamonti, dimora dei primi del Novecento acquisita nel 2006, illustra la geologia di Dondena e
      l'attività pastorale. Punti informativi sono attivi anche alla stazione ferroviaria di Hône.


      Per gli escursionisti il parco offre oltre cento chilometri di sentieri segnalati. Il percorso più
      classico sale da Champorcher al Col du Lac Blanc per scendere a Champdepraz al cospetto del Cervino e
      del Monte Rosa, costeggiando il Lac Blanc presso il rifugio Barbustel, il Lac Cornu e il Grand Lac, il
      maggiore lago naturale della Valle d'Aosta. Da Champorcher si raggiungono il lago Misérin di 22 ettari a
      2.576 m e la Fenêtre de Champorcher a 2.826 m lungo la mulattiera reale. Altre vie salgono da Chevrère e
      da Veulla a 1.300 m snodandosi tra laghetti, selve e testimonianze dell'archeologia mineraria.
      L'itinerario Dondena–Col Fenêtre offre frequenti avvistamenti di marmotte e fauna alpina lungo il
      cammino, mentre la traversata Dondena–Col Pontonnet valica gli habitat prediletti da camosci e
      stambecchi.
    history: >-
      Il parco fu istituito nel 1989 e ampliato nel 2003. I versanti conservano memorie minerarie: i
      giacimenti di magnetite del Lago Gelato a 2.600 m furono sfruttati a partire dal 1693 con alterne
      vicende sino al 1893.


      Oggi Zona Speciale di Conservazione europea, tra il 1997 e il 2000 il parco ha coordinato un progetto
      Life-Natura a tutela di torbiere e pinete rupicole. Il Mont Avic è stato inoltre il primo parco d'Europa
      a conseguire la registrazione ambientale EMAS.
    before: >-
      Resta rigorosamente sui sentieri segnati per non arrecare disturbo alla fauna ed evitare il calpestio
      della vegetazione palustre. I centri visita osservano aperture stagionali: informati sugli orari prima
      delle escursioni.
    around: >-
      Il [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) dista circa 1 km ed è il
      naturale vicino di massiccio. Più lontano, il [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) condivide stambecchi, camosci e foreste mature
      d'alta quota.
  pt:
    intro: >-
      O Mont Avic fica à margem dos grandes eixos turísticos do Vale de Aosta, e esse isolamento define a sua
      essência. Resguardado entre o desfiladeiro de Champdepraz e o vale de Champorcher, abriga a maior
      floresta de pinheiro-uncinado dos Alpes italianos: mais de 1.100 hectares de uma conífera resistente que
      vinga em turfeiras, fendas rochosas e solos estéreis. O Gran Paradiso ergue-se logo ao lado, mas este
      primeiro parque natural regional valdostano mantém-se como um refúgio onde íbexes, camurças e marmotas
      se observam em serenidade.
    landscape: >-
      Mont Avic é uma paisagem moldada em rochas verdes. As ofiolites constituem fragmentos de fundos
      oceânicos incorporados na orogenia alpina aquando da colisão entre África e Europa. Estes serpentinitos
      dão origem a solos delgados, pobres em nutrientes e saturados de metais pesados tóxicos como níquel,
      crómio e cobalto. Nele vinga uma flora estritamente adaptada, enriquecida por mais de cem espécies de
      líquenes saxícolas.


      Os glaciares quaternários completaram a paisagem com rochas polidas e circos suspensos que retêm lagoas
      de altitude no setor sul. Dessa herança derivam turfeiras raras nos vales alpinos ocidentais de Itália,
      constituindo os biótopos mais notáveis do parque.


      Três picos afilados circunscrevem a bacia protegida: o Mont Avic (3.003 m), o Mont Iverta (2.936 m) e o
      Mont Glacier (3.186 m) separam Champdepraz de Champorcher. Abaixo, as florestas prolongam-se sem quebra
      além dos 2.000 m. No vale Chalamy o pinheiro-uncinado substitui lariços e abetos-falsos, integrando
      faiais raros no alto Vale de Aosta. Em fendas rochosas e turfeiras, os pinheiros exibem crescimento tão
      lento que compõem autênticos bonsais naturais.
    wildlife: >-
      No vale de Dondena avistam-se com facilidade a [marmota](/especie/marmota_marmota/), o
      [íbex](/especie/capra_ibex/) e a [camurça](/especie/rupicapra_rupicapra/) em vastas pastagens alpinas. A
      lebre-variável habita as escarpas, enquanto no vale Chalamy ocorrem corço, esquilo e leirão-careto.


      A riqueza ornitológica compreende mais de 120 espécies inventariadas, com mais de 90 nidificantes. Três
      casais de [águia-real](/especie/aquila_chrysaetos/) controlam territórios que abrangem o parque e o alto
      vale de Champorcher. A lagópode-branca permanece acima dos 2.100-2.200 m. O
      [tetraz-lira](/especie/tetrao_tetrix/) é monitorizado a cada primavera durante as paradas nupciais,
      escavando abrigos na neve no inverno. Nos bosques densos o [pica-pau-preto](/especie/dryocopus_martius/)
      atinge densidades de um casal por cada 300 hectares.


      A microfauna surpreende: mais de 1.100 espécies de borboletas, totalizando 70 % dos macrolepidópteros
      conhecidos no Vale de Aosta, incluindo quatro microlepidópteros novos para a ciência. No verão, as
      turfeiras cobrem-se de tufos brancos de algodão-dos-pauis entre esfagno, com treze espécies
      inventariadas, e a carnívora orvalhinha.
    visit: >-
      A visita começa num dos dois centros de acolhimento. O de Champdepraz acolhe um museu interactivo sobre
      rochas e zonas húmidas, acompanhado de uma maqueta em relevo à escala 1:5.000. O de Champorcher ocupa a
      Villa Biamonti, mansão do início do século XX adquirida em 2006 dedicada à geologia e pastorícia. Pontos
      de acolhimento facultam dados na estação ferroviária de Hône.


      O parque disponibiliza mais de cem quilómetros de trilhos assinalados. A travessia clássica parte de
      Champorcher, transpõe o Col du Lac Blanc e desce a Champdepraz com panorâmicas sobre o Matterhorn e
      Monte Rosa, margeando o Lac Blanc junto ao refúgio Barbustel, o Lac Cornu e o Grand Lac — a maior lagoa
      natural do Vale de Aosta. De Champorcher acede-se ao lago Misérin de 22 hectares a 2.576 m e à Fenêtre
      de Champorcher a 2.826 m. Outros trilhos arrancam de Chevrère e de Veulla a 1.300 m, cruzando lagoas,
      matas e vestígios de mineração antiga. O percurso Dondena–Col Fenêtre faculta o avistamento de marmotas
      e fauna alpina ao longo da caminhada, ao passo que a rota Dondena–Col Pontonnet transpõe os biótopos
      preferenciais de camurças e íbexes.
    history: >-
      O parque nasceu em 1989 e foi ampliado em 2003. As encostas resguardam vestígios mineiros: jazigos de
      magnetite no Lago Gelato a 2.600 m eram explorados desde 1693, prosseguindo com intermitências até 1893.


      Classificado como Zona Especial de Conservação europeia, entre 1997 e 2000 executou um projeto
      Life-Natureza dedicado a turfeiras e pinhais sobre ofiolites. Foi também o primeiro parque da Europa a
      obter a certificação ambiental EMAS.
    before: >-
      Mantém-te estritamente nos trilhos assinalados para não perturbar a fauna nem degradar as turfeiras. Os
      centros de acolhimento funcionam em regimes sazonais: consulta os horários antes de partires.
    around: >-
      O [Parco Nazionale Gran Paradiso](/lugar/parco-nazionale-gran-paradiso/) dista cerca de 1 km,
      constituindo o vizinho imediato. Mais longe, o [Parco Naturale delle Alpi
      Marittime](/lugar/parco-naturale-delle-alpi-marittime/) partilha íbexes, camurças e florestas vetustas
      de altitude.
