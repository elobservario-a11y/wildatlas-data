unico:
  es: Un bosque donde nadie ha cortado un árbol, a los pies de la montaña más alta de Bosnia.
  en: A forest where an axe has never touched a tree, standing at the foot of Bosnia’s highest mountain.
  fr: >-
    Une forêt où la cognée n’a jamais abattu un seul arbre, s’épanouissant au pied de la plus haute montagne
    de Bosnie.
  de: Ein Urwald, in dem noch nie ein Baum gefällt wurde, am Fuße des höchsten Berges von Bosnien.
  it: >-
    Una foresta dove nessuno ha mai abbattuto un albero, adagiata ai piedi della montagna più alta della
    Bosnia.
  pt: Uma floresta onde nunca se cortou uma árvore, aninhada aos pés da montanha mais alta da Bósnia.
observaciones:
  es: >-
    Se llega por carretera desde Sarajevo, a 110 km, y desde Dubrovnik, a 142 km. La ciudad más cercana, Foča,
    queda a 20 km. En la ruta de Prijevor, el parque aconseja evitar la subida con tormenta.
texto:
  es:
    intro: >-
      El Sutjeska no es un río que se sube: es un tajo. Un cañón de unos 1.200 metros de profundidad que parte
      el parque en dos y separa Zelengora, con sus lagos glaciares, de las montañas altas de Maglić, Volujak y
      Bioč. Aquí está el techo de Bosnia y Herzegovina, el Maglić, y a sus pies uno de los dos últimos bosques
      primarios de Europa, Perućica, donde las hayas pasan de los 60 metros. Es el parque nacional más antiguo
      y más grande del país.
    landscape: >-
      El parque se declaró en 1962 y el 66 % de su superficie es bosque. Lo cruza el Sutjeska, que ha excavado
      el cañón y el valle de Tjentište. A un lado queda Zelengora, con 9 lagos glaciares, los «ojos de la
      montaña», escondidos entre bosques y mesetas de hierba; al otro, Maglić.


      Maglić es una montaña de dos cumbres: el Veliki Maglić, de 2.386 metros, en Bosnia, y el Crnogorski
      Maglić, de 2.388, ya en Montenegro. En su ladera afloran rocas pérmicas, calizas mesozoicas, diabasa y
      meláfiro, junto con huellas glaciares. La ladera noroeste tiene bosque de coníferas y haya hasta los
      1.600 metros; por encima se extiende una meseta de pastos, y en las demás direcciones las laderas son
      empinadas, áridas y rocosas. Hay numerosos manantiales, entre ellos Carev Do, que nunca se seca, y
      incluso en verano las laderas escarpadas conservan manchas de nieve que no se derriten.


      Al otro lado, en Montenegro, Maglić forma el lago glaciar Trnovačko, a 1.517 metros: 700 por 400 metros
      de agua verde azulada, rodeada de un anfiteatro de picos.


      El corazón verde del parque es Perućica. Es una reserva de unos 6 km de largo y entre 1 y 3 km de ancho,
      con unas 1.400 hectáreas, que se separó como reserva en 1952 para la ciencia y la educación. Sus árboles
      nunca se talaron, algunos tienen unos 300 años, y las hayas alcanzan 60 metros o más. Dentro, la cascada
      Skakavac, de unos 75 metros, está escondida en lo profundo del bosque.
    wildlife: >-
      En el parque, sobre todo en los bosques de Perućica, se han visto [oso pardo](/especie/ursus_arctos/),
      [rebeco](/especie/rupicapra_rupicapra/), jabalí, [lobo](/especie/canis_lupus/), martas, [gato
      montés](/especie/felis_silvestris/), zorro y cabras salvajes. De hecho, el rebeco balcánico de aquí
      sirvió de reserva para repoblar: entre 1963 y 1987 se llevaron 256 ejemplares a 13 zonas de Bosnia y
      Croacia. El [lince](/especie/lynx_lynx/) figura entre las especies de la ficha del parque.


      Entre las aves de Perućica figuran el [águila real](/especie/aquila_chrysaetos/), una especie de gallo
      de monte, el [halcón peregrino](/especie/falco_peregrinus/), el mirlo y la perdiz griega. Se han
      registrado 114 especies de aves en 2002, aunque se cree que hay más, y entre ellas 9 de pícidos, el 90 %
      de los que hay en Europa. En flora, 2.600 especies de plantas vasculares, muchas raras y endémicas; un
      campamento de investigación de cinco días registró 403 en los cañones del Sutjeska y el Hrčavka en 2014.


      El clima es de transición: domina el continental moderado del norte y la influencia mediterránea del sur
      es menor. La mejor época para subir va de junio a octubre; el parque está accesible casi todo el año,
      con algunas restricciones en parte del invierno.
    visit: >-
      La ascensión al Maglić es la gran excursión. Hay tres rutas principales: desde Prijevor, desde Lokve
      Dernečišta y desde el lago Trnovačko. Prijevor, a 1.668 metros, es el punto de partida de la más corta y
      exigente, empinada y de carácter alpino, que atraviesa pedreras y grietas rocosas. La ruta desde Lokve
      Dernečišta es más segura y menos técnica. La mayoría de las rutas requieren dos días de marcha, y al
      macizo solo se accede por el lado sur, con pasto y pino mugo. Desde la cumbre se ven el Volujak, el
      Bioč, el lago Trnovačko y el Durmitor.


      Zelengora es la alternativa más tranquila: es popular entre los senderistas y tiene varios refugios de
      montaña renovados en las laderas.
    history: >-
      El Sutjeska también es memoria. Aquí se libró entre el 15 de mayo y el 16 de junio de 1943 la batalla
      del Sutjeska, en la que los partisanos rompieron el cerco aunque perdieron un tercio de sus hombres. El
      complejo conmemorativo de Tjentište, construido entre 1958 y 1975, tiene un osario con los restos de
      3.301 combatientes.


      La amenaza de hoy es otra: un plan para construir cuatro pequeñas centrales hidroeléctricas en el
      corazón del parque. El tribunal de Banja Luka anuló la aprobación del estudio de impacto ambiental de
      las previstas en el cañón del Hrčavka. Y se plantea crear otro parque nacional en Montenegro para
      proteger el resto de la cordillera Maglić-Volujak-Bioč y el lago Trnovačko, de modo que ambos formen una
      gran zona protegida transfronteriza.
    before: >-
      Se llega por carretera desde Sarajevo, a 110 km, y desde Dubrovnik, a 142 km. La ciudad más cercana,
      Foča, queda a 20 km. En la ruta de Prijevor, el parque aconseja evitar la subida con tormenta.
    around: >-
      Dentro de este parque están el [Bosque Virgen de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/), el [Macizo de Bioč](/lugar/masiv-bioca/)
      y las [Montañas de Volujak](/lugar/planina-volujak/). A veintidós kilómetros quedan el [Parque Nacional
      Durmitor - Macizo Montañoso](/lugar/nacionalni-park-durmitor---masiv/) y el [Cañón del Río
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/); el [Parque Natural de
      Piva](/lugar/park-prirode-piva/) está pegado.
  en:
    intro: >-
      The Sutjeska is not merely a mountain stream: it is a monumental incision. A canyon plunging roughly
      1,200 metres deep slices the national park in two, separating the gentle plateaus of Zelengora with
      their emerald tarns from the jagged alpine massifs of Maglić, Volujak, and Bioč. Here rises the roof of
      Bosnia and Herzegovina, Mount Maglić, and at its base stretches Perućica, one of the last two primeval
      temperate rainforests in Europe, where ancient beech trees soar past 60 metres. It stands as the oldest
      and largest national park in the country.
    landscape: >-
      The national park was proclaimed in 1962, and 66 % of its territory is cloaked in dense forest. The
      Sutjeska river traverses its length, having carved the dramatic canyon and the amphitheatre valley of
      Tjentište. On one flank lies Zelengora with its 9 glacial tarns, known locally as the "mountain eyes",
      hidden amid high pastures and pine woods; on the other looms Maglić.


      Maglić is a twin-peaked sentinel: Veliki Maglić, at 2,386 metres, in Bosnia, and Crnogorski Maglić,
      rising to 2,388 metres, just across the border in Montenegro. Its towering flanks expose Permian red
      sandstones, Mesozoic limestones, diabase, and melaphyre alongside glacial moraines. The north-western
      slopes support dense conifer and beech forests up to 1,600 metres; above extends an alpine plateau,
      while in other aspects the mountainsides drop steeply in barren screes. Plentiful springs bubble up,
      including Carev Do which never runs dry, and even in midsummer high gullies retain unmelted snow
      patches.


      Over the crest in Montenegro, Maglić cradles the heart-shaped glacial Lake Trnovačko at 1,517 metres:
      700 by 400 metres of turquoise water framed by a ring of limestone peaks.


      The green jewel of the park is Perućica. It forms a strict nature reserve some 6 km long and between 1
      and 3 km wide, encompassing roughly 1,400 hectares, set aside for science and conservation in 1952. Its
      trees have never experienced logging, with individual specimens exceeding 300 years of age and beech
      trunks soaring 60 metres or higher. Deep within its wilderness cascades the Skakavac waterfall, dropping
      roughly 75 metres through the jungle-like canopy.
    wildlife: >-
      Throughout the park, and especially in the old-growth sanctuary of Perućica, researchers frequently
      record [brown bear](/especie/ursus_arctos/), [chamois](/especie/rupicapra_rupicapra/), wild boar,
      [wolf](/especie/canis_lupus/), martens, [European wildcat](/especie/felis_silvestris/), red fox, and
      feral goats. Indeed, the local Balkan chamois population historically served as a prime donor nucleus:
      between 1963 and 1987, wildlife authorities translocated 256 animals to 13 mountain sectors across
      Bosnia and Croatia. The [Eurasian lynx](/especie/lynx_lynx/) is officially listed among the park’s
      faunal inventory.


      Among birds, Perućica shelters the [golden eagle](/especie/aquila_chrysaetos/), western capercaillie,
      [peregrine falcon](/especie/falco_peregrinus/), blackbird, and rock partridge. An ornithological survey
      recorded 114 bird species in 2002, though current estimates are higher, including 9 woodpecker species
      representing 90 % of Europe’s picid diversity. Vascular flora exceeds 2,600 species with numerous rare
      and endemic taxa; a five-day botanical field survey recorded 403 plant species within the Sutjeska and
      Hrčavka river canyons in 2014.


      The climate is transitional: moderate continental conditions prevail from the north with softening
      Mediterranean influences from the south. Peak hiking season spans June to October; the park is
      accessible year-round, barring high-elevation winter closures.
    visit: >-
      The ascent of Mount Maglić is the premier alpine challenge. Three classic routes lead to the peak: from
      Prijevor, from Lokve Dernečišta, and from Lake Trnovačko. Prijevor, situated at 1,668 metres, marks the
      trailhead for the shortest and steepest line, demanding surefootedness on exposed alpine screes and
      scrambling gullies. The trail from Lokve Dernečišta is longer, less technical, and more gradual. Most
      multi-peak hikes require two days, approaching the upper massif from the southern slopes across dwarf
      mugo pine and alpine turf. From the summit, panoramic views take in Volujak, Bioč, Lake Trnovačko, and
      the distant crests of Durmitor.


      Zelengora provides a gentler alternative: highly favoured by distance hikers, it features several
      restored mountain chalets across its undulating slopes.
    history: >-
      Sutjeska is also hallowed historical ground. Here, between 15 May and 16 June 1943, raged the epic
      Battle of the Sutjeska, where Partisan forces broke through Axis encirclement despite losing one-third
      of their troops. The sprawling Tjentište Memorial Complex, built between 1958 and 1975, incorporates a
      crypt containing the remains of 3,301 fallen soldiers.


      Modern ecological threats have included proposals for four small hydroelectric dams in the park’s river
      basins; the court in Banja Luka subsequently struck down the environmental approvals for the proposed
      projects in the Hrčavka canyon. Ongoing regional initiatives propose creating an adjoining national park
      in Montenegro to protect the remaining Maglić-Volujak-Bioč range and Lake Trnovačko as an integrated
      transboundary protected wilderness.
    before: >-
      The park is reached by road from Sarajevo at 110 km, and from Dubrovnik at 142 km. The nearest town,
      Foča, lies 20 km away. On the exposed Prijevor trail, park wardens urge hikers to turn back immediately
      at the onset of thunderstorms.
    around: >-
      Protected within this park are the [Perućica Primeval
      Forest](/lugar/prasuma-perucica---nacionalni-park-sutjeska/), the [Bioč Massif](/lugar/masiv-bioca/),
      and the [Volujak Mountains](/lugar/planina-volujak/). Twenty-two kilometres away lie [Durmitor National
      Park - Mountain Massif](/lugar/nacionalni-park-durmitor---masiv/) and [Tara River
      Canyon](/lugar/nacionalni-park-durmitor---kanjon-tare/); [Piva Nature Park](/lugar/park-prirode-piva/)
      directly abuts the boundary.
  fr:
    intro: >-
      La Sutjeska n’est pas un cours d’eau ordinaire : c’est une entaille titanesque. Un canyon profond
      d’environ 1 200 mètres coupe le parc en deux, séparant la Zelengora et ses lacs glaciaires des hauts
      massifs alpins du Maglić, du Volujak et du Bioč. C’est ici que culmine le toit de la Bosnie-Herzégovine,
      le Maglić, aux pieds duquel s’étend la Perućica, l’une des deux dernières forêts primaires d’Europe où
      les hêtres dépassent 60 mètres de hauteur. C’est le parc national le plus vénérable et le plus vaste du
      pays.
    landscape: >-
      Déclaré parc national en 1962, le site est recouvert à 66 % par la forêt. Il est traversé par la
      Sutjeska, qui y a façonné le défilé et la vallée de Tjentište. D’un côté se dresse la Zelengora, parée
      de 9 lacs glaciaires—les « yeux de la montagne »—nichés entre bois et hauts plateaux herbeux ; de
      l’autre s’élève le Maglić.


      Le Maglić dresse deux cimes : le Veliki Maglić (2 386 mètres) en Bosnie, et le Crnogorski Maglić (2 388
      mètres) au Monténégro. Ses flancs révèlent des grès permiens, des calcaires mésozoïques, de la diabase
      et du mélaphyre, ainsi que des moraines glaciaires. Le versant nord-ouest porte une forêt mixte de
      conifères et de hêtres jusqu’à 1 600 mètres d’altitude ; au-delà se déploie un plateau pastoral
      d’altitude, tandis que les autres faces tombent en falaises abruptes et pierriers arides. D’abondantes
      sources jaillissent, telle Carev Do qui ne tarit jamais, et même au cœur de l’été les couloirs ombragés
      conservent des névés éternels.


      De l’autre côté, sur le versant monténégrin, le Maglić enserre le lac glaciaire Trnovačko à 1 517 mètres
      : une nappe d’eau turquoise de 700 mètres sur 400 enchâssée dans un amphithéâtre calcaire.


      Le sanctuaire absolu du parc est la Perućica. Cette réserve intégrale d’environ 6 km de long sur 1 à 3
      km de large s’étend sur près de 1 400 hectares, érigée en réserve scientifique dès 1952. Ses arbres
      n’ont jamais été exploités, certains affichant 300 ans d’âge et des hêtres s’élevant à 60 mètres ou
      plus. En son cœur, la cascade de Skakavac plonge de quelque 75 mètres dans la canopée vierge.
    wildlife: >-
      Dans le parc, et particulièrement dans la forêt de Perućica, ont été observés l’[ours
      brun](/especie/ursus_arctos/), le [chamois](/especie/rupicapra_rupicapra/), le sanglier, le
      [loup](/especie/canis_lupus/), les martres, le [chat sauvage](/especie/felis_silvestris/), le renard et
      la chèvre sauvage. De fait, le chamois balkanique local a servi de noyau de réintroduction : entre 1963
      et 1987 ce sont 256 individus qui ont été transférés vers 13 massifs de Bosnie et de Croatie. Le [lynx
      boréal](/especie/lynx_lynx/) figure à l’inventaire faunique du parc.


      L’avifaune compte l’[aigle royal](/especie/aquila_chrysaetos/), le grand tétras, le [faucon
      pèlerin](/especie/falco_peregrinus/), le merle à plastron et la perdrix bartavelle. On a recensé 114
      espèces d’oiseaux en 2002, dont 9 espèces de pics représentant 90 % des espèces européennes. La flore
      compte 2 600 espèces de plantes vasculaires riches en endémismes ; un inventaire scientifique de cinq
      jours a recensé 403 plantes dans les canyons de la Sutjeska et de la Hrčavka en 2014.


      Le climat de transition allie influences continentales modérées et souffles méditerranéens atténués. La
      saison idéale pour gravir le massif va de juin à octobre ; le parc reste ouvert une large partie de
      l’année.
    visit: >-
      L’ascension du Maglić est la grande randonnée alpine du parc. Trois voies d’accès se distinguent :
      depuis Prijevor, depuis Lokve Dernečišta et depuis le lac Trnovačko. Prijevor, perché à 1 668 mètres,
      est le point de départ de l’itinéraire le plus direct et escarpé, traversant pierriers et passages
      rocheux vertigineux. La trace depuis Lokve Dernečišta est plus longue et plus progressive. La plupart
      des traversées demandent deux jours de marche, accédant au massif par le sud à travers les pins mugo et
      les pelouses alpines. Du sommet, la vue embrasse le Volujak, le Bioč, le lac Trnovačko et les crêtes du
      Durmitor.


      La Zelengora offre une alternative plus bucolique, jalonnée de plusieurs refuges montagnards rénovés.
    history: >-
      La Sutjeska est également un haut lieu de mémoire. C’est ici que se déroula, du 15 mai au 16 juin 1943,
      la tragique bataille de la Sutjeska, au cours de laquelle les partisans yougoslaves brisèrent
      l’encerclement ennemi au prix d’un tiers de leurs effectifs. Le mémorial de Tjentište, érigé entre 1958
      et 1975, abrite un ossuaire recueillant les dépouilles de 3 301 combattants.


      De nos jours, des projets de microcentrales hydroélectriques ont menacé le parc ; le tribunal de Banja
      Luka a annulé les autorisations environnementales dans les gorges de la Hrčavka. Un projet
      transfrontalier prévoit la création d’un parc national contigu au Monténégro englobant le massif
      Maglić-Volujak-Bioč et le lac Trnovačko.
    before: >-
      On y accède par la route depuis Sarajevo à 110 km, et depuis Dubrovnik à 142 km. La ville la plus
      proche, Foča, est à 20 km. Sur l’itinéraire de Prijevor, il est formellement conseillé de renoncer à
      l’ascension en cas d’orage.
    around: >-
      Au sein de ce parc s’élèvent la [Forêt Vierge de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/), le [Massif de Bioč](/lugar/masiv-bioca/)
      et les [Montagnes de Volujak](/lugar/planina-volujak/). À vingt-deux kilomètres se trouvent le [Parc
      National de Durmitor - Massif](/lugar/nacionalni-park-durmitor---masiv/) et le [Canyon de la
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) ; le [Parc Naturel de
      Piva](/lugar/park-prirode-piva/) est directement limitrophe.
  de:
    intro: >-
      Die Sutjeska ist kein gewöhnlicher Bergbach: Sie ist ein gigantischer Einschnitt. Eine rund 1.200 Meter
      tiefe Schlucht teilt den Nationalpark in zwei Hälften und trennt die sanften Hochflächen der Zelengora
      mit ihren Karseen von den hochalpinen Felsmassiven von Maglić, Volujak und Bioč. Hier ragt das Dach von
      Bosnien und Herzegowina auf, der Maglić, und zu seinen Füßen breitet sich Perućica aus, einer der
      letzten beiden echten Urwälder Europas, in dem Rotbuchen Höhen von über 60 Metern erreichen. Es ist der
      älteste und größte Nationalpark des Landes.
    landscape: >-
      Der Nationalpark wurde 1962 gegründet und ist zu 66 % bewaldet. Ihn durchfließt die Sutjeska, die den
      mächtigen Cañon und das Tal von Tjentište eingegraben hat. Auf der einen Seite liegt die Zelengora mit 9
      eiszeitlichen Bergseen—den „Augen der Berge“—, gebettet zwischen Nadelwäldern und Almen; auf der anderen
      ragt der Maglić auf.


      Der Maglić besitzt zwei Gipfel: den Veliki Maglić (2.386 Meter) in Bosnien und den Crnogorski Maglić
      (2.388 Meter) in Montenegro. An seinen Flanken treten permische Sandsteine, mesozoische Kalke, Diabas
      und Melaphyr zutage, überformt von eiszeitlichen Moränen. Die Nordwesthänge tragen dichten Nadel- und
      Buchenwald bis 1.600 Meter Höhe; darüber breiten sich alpine Matten aus, während die übrigen Wände
      steil, kahl und felsig abfallen. Zahllose Quellen entspringen hier, darunter Carev Do, die nie versiegt,
      und selbst im Hochsommer überdauern Schneefelder in den schattigen Karen.


      Jenseits des Kammes in Montenegro schmiegt sich der herzförmige Trnovačko-Gletschersee auf 1.517 Metern
      Höhe: 700 mal 400 Meter blaugrünes Wasser, umgeben von einem Felsamphitheater.


      Das grüne Herzstück des Parks ist Perućica. Dieses Urwaldreservat ist etwa 6 km lang und zwischen 1 und
      3 km breit und umfasst rund 1.400 Hektar, die 1952 als Totalreservat für Forschung und Lehre unter
      Schutz gestellt wurden. Seine Baumriesen wurden nie gefällt, manche sind 300 Jahre alt, und Buchen
      erreichen 60 Meter Höhe und mehr. Mitten im Dickicht stürzt der Skakavac-Wasserfall rund 75 Meter in die
      Tiefe.
    wildlife: >-
      Im Park, besonders im Urwald Perućica, leben [Braunbär](/especie/ursus_arctos/),
      [Gämse](/especie/rupicapra_rupicapra/), Wildschwein, [Wolf](/especie/canis_lupus/), Marder,
      [Wildkatze](/especie/felis_silvestris/), Rotfuchs und verwilderte Ziegen. Die hiesigen Balkan-Gämsen
      dienten früher als Spenderpopulation: Zwischen 1963 und 1987 wurden 256 Tiere in 13 Gebiete in Bosnien
      und Kroatien umgesiedelt. Auch der [Eurasische Luchs](/especie/lynx_lynx/) wird im Arteninventar des
      Parks geführt.


      Unter den Vögeln Perućicas finden sich [Steinadler](/especie/aquila_chrysaetos/), Auerhuhn,
      [Wanderfalke](/especie/falco_peregrinus/), Ringdrossel und Steinhuhn. Im Jahr 2002 wurden 114 Vogelarten
      registriert, darunter 9 Spechtarten, was 90 % der europäischen Spechtvielfalt ausmacht. Die Flora
      umfasst 2.600 Gefäßpflanzenarten mit vielen Endemiten; eine fünftägige Forschungsexpedition erfasste 403
      Pflanzenarten in den Schluchten von Sutjeska und Hrčavka im Jahr 2014.


      Das Klima ist ein Übergangsklima zwischen gemäßigt kontinental und abgemildert mediterran. Die beste
      Besteigungszeit reicht von Juni bis Oktober; der Park ist fast das ganze Jahr über zugänglich.
    visit: >-
      Die Besteigung des Maglić ist die Parade-Bergtour. Drei Hauptwege führen zum Gipfel: ab Prijevor, ab
      Lokve Dernečišta und ab dem Trnovačko-See. Prijevor auf 1.668 Metern Höhe ist der Ausgangspunkt der
      kürzesten und steilsten Route, die über alpine Schuttreißen und Felsbänder Trittsicherheit verlangt. Der
      Weg ab Lokve Dernečišta ist länger und weniger ausgesetzt. Die meisten Touren erfordern zwei Tage, wobei
      der Zustieg von Süden über Krummholz und Bergwiesen erfolgt. Vom Gipfel reicht der Blick auf Volujak,
      Bioč, den Trnovačko-See und das Durmitor-Massiv.


      Die Zelengora bildet die beschaulichere Alternative mit sanfteren Pfaden und mehreren restaurierten
      Berghütten.
    history: >-
      Die Sutjeska ist auch geschichtsträchtiger Boden. Vom 15. Mai bis 16. Juni 1943 tobte hier die Schlacht
      an der Sutjeska, bei der die jugoslawischen Partisanen die feindliche Einkesselung durchbrachen, jedoch
      ein Drittel ihrer Kämpfer verloren. Die Gedenkstätte Tjentište, errichtet zwischen 1958 und 1975, birgt
      ein Beinhaus mit den sterblichen Überresten von 3.301 Gefallenen.


      In jüngerer Zeit bedrohten Kleinwasserkraftwerke das Herz des Parks; ein Gericht in Banja Luka hob die
      Umweltgenehmigungen für geplante Kraftwerke im Hrčavka-Cañon auf. Ein grenzüberschreitender Schutzpark
      mit Montenegro ist im Gespräch, um das Massiv Maglić-Volujak-Bioč und den Trnovačko-See dauerhaft zu
      sichern.
    before: >-
      Die Anreise erfolgt über die Straße ab Sarajevo (110 km) oder ab Dubrovnik (142 km). Die nächste Stadt,
      Foča, liegt 20 km entfernt. Auf der steilen Prijevor-Route rät die Parkverwaltung dringend davon ab, bei
      Gewittergefahr aufzusteigen.
    around: >-
      Innerhalb des Parks liegen der [Urwald Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/),
      das [Bioč-Massiv](/lugar/masiv-bioca/) und das [Volujak-Gebirge](/lugar/planina-volujak/).
      Zweiundzwanzig Kilometer entfernt liegen der [Nationalpark Durmitor -
      Bergmassiv](/lugar/nacionalni-park-durmitor---masiv/) und die
      [Tara-Schlucht](/lugar/nacionalni-park-durmitor---kanjon-tare/); der [Naturpark
      Piva](/lugar/park-prirode-piva/) schließt direkt an.
  it:
    intro: >-
      La Sutjeska non è un semplice corso d’acqua montano: è una spaccatura colossale. Un canyon profondo
      circa 1.200 metri taglia in due il parco, separando i pascoli ondulati e i laghi glaciali della
      Zelengora dalle severe pareti alpine del Maglić, del Volujak e del Bioč. Qui si erge il tetto della
      Bosnia ed Erzegovina, il Maglić, e ai suoi piedi si stende la Perućica, una delle due ultime foreste
      primarie d’Europa in cui i faggi superano i 60 metri di altezza. È il parco nazionale più antico e vasto
      del paese.
    landscape: >-
      Istituito nel 1962, il parco è ricoperto per il 66 % da boschi. È solcato dalla Sutjeska, che ha scavato
      la spettacolare forra e la conca di Tjentište. Da un versante si allunga la Zelengora con 9 laghi
      glaciali—gli «occhi della montagna»—celati tra abetaie e pascoli d’alta quota; dall’altro svetta il
      Maglić.


      Il Maglić culmina in due vette gemelle: il Veliki Maglić (2.386 metri) in Bosnia, e il Crnogorski Maglić
      (2.388 metri) in territorio montenegrino. Sui suoi fianchi affiorano arenarie permiane, calcari
      mesozoici, diabase e melafiro, assieme a depositi morenici glaciali. Il versante nord-occidentale ospita
      fitte conifere e faggete fino a 1.600 metri di quota; più in alto si stende un altopiano erboso, mentre
      sugli altri versanti le pareti precipitano ripide, aride e rocciose. Sgorgano sorgenti perenni come
      Carev Do, che non inaridisce mai, e anche d’estate i canaloni più ombrosi conservano nevai perenni.


      Sul versante opposto, in Montenegro, il Maglić racchiude il lago glaciale Trnovačko a 1.517 metri: uno
      specchio d’acqua turchese di 700 per 400 metri incastonato in un anfiteatro di creste calcaree.


      Il sancta sanctorum del parco è la Perućica. Questa riserva integrale misura circa 6 km di lunghezza per
      1-3 km di larghezza, estendendosi su circa 1.400 ettari destinati fin dal 1952 alla conservazione
      scientifica. I suoi alberi non sono mai stati abbattuti, con esemplari che toccano i 300 anni di età e
      faggi che raggiungono i 60 metri di altezza o più. All’interno, la cascata di Skakavac precipita per
      circa 75 metri nel cuore della foresta vergine.
    wildlife: >-
      Nel parco, e in particolare tra le faggete di Perućica, si avvistano l’[orso
      bruno](/especie/ursus_arctos/), il [camoscio alpino](/especie/rupicapra_rupicapra/), il cinghiale, il
      [lupo](/especie/canis_lupus/), martore, il [gatto selvatico](/especie/felis_silvestris/), la volpe e
      capre selvatiche. La popolazione locale di camoscio balcanico è servita storicamente da nucleo di
      ripopolamento: tra il 1963 e il 1987 ben 256 esemplari vennero traslocati in 13 aree montane tra Bosnia
      e Croazia. La [lince eurasiatica](/especie/lynx_lynx/) è compresa nell’inventario ufficiale del parco.


      Tra i volatili di Perućica spiccano l’[aquila reale](/especie/aquila_chrysaetos/), il gallo cedrone, il
      [falco pellegrino](/especie/falco_peregrinus/), il merlo dal collare e la coturnice. Sono state censite
      114 specie di uccelli nel 2002, tra cui 9 specie di picchi che rappresentano il 90 % di quelle europee.
      La flora conta 2.600 specie vascolari con abbondanti endemismi; una spedizione scientifica di cinque
      giorni ha rilevato 403 specie vegetali nelle gole della Sutjeska e dell’Hrčavka nel 2014.


      Il clima di transizione unisce caratteri continentali mitigati e influssi adriatici attenuati. Il
      periodo ottimale per salire in quota va da giugno a ottobre; il parco è aperto gran parte dell’anno.
    visit: >-
      L’ascensione al Maglić è la classica escursione alpinistica del parco. Esistono tre vie di salita: da
      Prijevor, da Lokve Dernečišta e dal lago Trnovačko. Prijevor, situato a 1.668 metri, è il punto di
      partenza dell’itinerario più ripido e breve, che richiede passo sicuro su sfasciumi alpini e balze
      rocciose. La via da Lokve Dernečišta è più lunga e meno tecnica. La maggior parte dei trekking richiede
      due giorni di marcia, risalendo le pendici meridionali tra pini mughi e praterie d’altitudine. Dalla
      cima lo sguardo spazia sul Volujak, sul Bioč, sul lago Trnovačko e sulle creste del Durmitor.


      La Zelengora rappresenta la variante più distensiva, molto apprezzata per il trekking panoramico e
      dotata di vari rifugi alpini restaurati.
    history: >-
      La Sutjeska custodisce anche una grandiosa memoria storica. Tra il 15 maggio e il 16 giugno 1943 vi si
      combatté la celebre battaglia della Sutjeska, in cui i partigiani jugoslavi ruppero l’accerchiamento
      nemico pur perdendo un terzo dei propri effettivi. Il memoriale di Tjentište, eretto tra il 1958 e il
      1975, accoglie un ossario con le spoglie di 3.301 combattenti caduti.


      In tempi recenti sono stati respinti progetti idroelettrici che minacciavano il cuore del parco; il
      tribunale di Banja Luka ha annullato le autorizzazioni ambientali per le centrali previste nella gola
      dell’Hrčavka. Si lavora alla creazione di un contiguo parco nazionale in Montenegro per tutelare
      l’intera dorsale Maglić-Volujak-Bioč e il lago Trnovačko.
    before: >-
      Si raggiunge su strada da Sarajevo a 110 km e da Dubrovnik a 142 km. La città più vicina, Foča, dista 20
      km. Lungo il sentiero di Prijevor, il parco raccomanda di non intraprendere la salita in caso di
      temporali imminenti.
    around: >-
      All’interno del parco sorgono la [Foresta Vergine di
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/), il [Massiccio del
      Bioč](/lugar/masiv-bioca/) e i [Monti del Volujak](/lugar/planina-volujak/). A ventidue chilometri si
      trovano il [Parco Nazionale del Durmitor - Massiccio](/lugar/nacionalni-park-durmitor---masiv/) e il
      [Canyon del Fiume Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/) ; il [Parco Naturale del
      Piva](/lugar/park-prirode-piva/) è confinante.
  pt:
    intro: >-
      O Sutjeska não é um rio qualquer: é uma incisão titânica. Um desfiladeiro com cerca de 1.200 metros de
      profundidade rasga o parque ao meio, separando a Zelengora e as suas lagoas glaciares dos relevos
      alpinos escarpados de Maglić, Volujak e Bioč. É aqui que se ergue o teto da Bósnia e Herzegovina, o
      Maglić, e a seus pés estende-se a Perućica, uma das duas últimas florestas primárias da Europa onde as
      faias ultrapassam os 60 metros de altura. Trata-se do mais antigo e extenso parque nacional do país.
    landscape: >-
      Criado em 1962, o parque nacional tem 66 % da sua superfície coberta por floresta. É atravessado pelo
      rio Sutjeska, que escavou a garganta profunda e o vale de Tjentište. De um lado fica a Zelengora,
      salpicada por 9 lagoas glaciares—os «olhos da montanha»—entre bosques e planaltos relvados; do outro
      agiganta-se o Maglić.


      O Maglić apresenta dois cumes proeminentes: o Veliki Maglić, com 2.386 metros, na Bósnia, e o Crnogorski
      Maglić, com 2.388 metros, em território montenegrino. Nas suas encostas afloram arenitos do Pérmico,
      calcários do Mesozóico, diábase e meláfiro, a par de moreias glaciares. A vertente noroeste sustenta
      coníferas e faias até aos 1.600 metros de altitude; acima estende-se uma pradaria alpina, enquanto nas
      restantes orientações as vertentes precipitam-se escarpadas, áridas e rochosas. Brotam inúmeras
      nascentes perenes como Carev Do, que nunca seca, e mesmo no pico do verão os barrancos sombrios
      conservam manchas de neve que não derretem.


      Do outro lado, em Montenegro, o Maglić acolhe a lagoa glaciar de Trnovačko a 1.517 metros: 700 por 400
      metros de águas azul-turquesa num anfiteatro de picos calcários.


      O santuário intocado do parque é a Perućica. Trata-se de uma reserva estrita com cerca de 6 km de
      comprimento e entre 1 e 3 km de largura, somando cerca de 1.400 hectares destinados desde 1952 à
      investigação e salvaguarda absoluta. As suas árvores nunca foram alvo de corte, exibindo exemplares com
      300 anos de idade e faias que atingem 60 metros de altura ou mais. No interior do bosque, a cascata de
      Skakavac despenha-se de cerca de 75 metros de altura.
    wildlife: >-
      No parque, e muito em especial na floresta virgem de Perućica, ocorrem o
      [urso-pardo](/especie/ursus_arctos/), a [camurça](/especie/rupicapra_rupicapra/), o javali, o
      [lobo](/especie/canis_lupus/), martas, o [gato-bravo](/especie/felis_silvestris/), a raposa e cabras
      selvagens. Com efeito, a população local de camurça-dos-balcãs serviu historicamente de manancial de
      repovoamento: entre 1963 e 1987 foram translocados 256 espécimes para 13 setores montanhosos da Bósnia e
      Croácia. O [lince-euroasiático](/especie/lynx_lynx/) consta igualmente da lista faunística do parque.


      Entre a avifauna de Perućica destacam-se a [águia-real](/especie/aquila_chrysaetos/), o tetraz-grande, o
      [falcão-peregrino](/especie/falco_peregrinus/), o melro-de-peito-branco e a perdiz-da-rocha. Foram
      registadas 114 espécies de aves em 2002, incluindo 9 espécies de pica-paus que congregam 90 % da
      diversidade europeia. A flora vascular soma 2.600 espécies ricas em endemismos; um levantamento botânico
      intensivo de cinco dias registou 403 plantas nos canhões do Sutjeska e do Hrčavka em 2014.


      O clima de transição conjuga traços continentais moderados e brisas mediterrânicas atenuadas. A melhor
      época para subir à montanha decorre entre junho e outubro; o parque está acessível durante a maior parte
      do ano.
    visit: >-
      A ascensão ao Maglić constitui a grande jornada alpina. Existem três rotas principais: a partir de
      Prijevor, de Lokve Dernečišta e da lagoa Trnovačko. Prijevor, situado a 1.668 metros, é o ponto de
      partida do percurso mais curto e íngreme, exigindo destreza em pedreiras alpinas e passagens rochosas. A
      rota de Lokve Dernečišta é mais longa e menos técnica. A maioria das travessias requer dois dias de
      marcha, acedendo às cristas a partir do sul através de pinheiros-mugo e pastos de altitude. Do cume
      avistam-se o Volujak, o Bioč, a lagoa Trnovačko e os cumes do Durmitor.


      A Zelengora representa uma opção mais suave para caminhadas, pontuada por vários abrigos de montanha
      recuperados.
    history: >-
      O Sutjeska encerra igualmente uma profunda memória histórica. Aqui decorreu, entre 15 de maio e 16 de
      junho de 1943, a dramática Batalha do Sutjeska, na qual as forças partidárias romperam o cerco inimigo à
      custa de um terço dos seus homens. O complexo memorial de Tjentište, erigido entre 1958 e 1975, acolhe
      um ossário com os restos mortais de 3.301 combatentes.


      Atualmente, projetos de aproveitamento hidroelétrico ameaçaram os vales fluviais; o tribunal de Banja
      Luka anulou as licenças ambientais para barragens no desfiladeiro do Hrčavka. Projeta-se ainda a criação
      de um parque nacional geminado em Montenegro abrangendo a cordilheira Maglić-Volujak-Bioč e a lagoa
      Trnovačko.
    before: >-
      O acesso rodoviário faz-se a partir de Sarajevo a 110 km e de Dubrovnik a 142 km. A cidade mais próxima,
      Foča, fica a 20 km. No percurso de Prijevor, os serviços do parque desaconselham subir em caso de
      trovoada.
    around: >-
      No interior do parque localizam-se a [Floresta Virgem de
      Perućica](/lugar/prasuma-perucica---nacionalni-park-sutjeska/), o [Maciço de Bioč](/lugar/masiv-bioca/)
      e as [Montanhas de Volujak](/lugar/planina-volujak/). A vinte e dois quilómetros ficam o [Parque
      Nacional Durmitor - Maciço](/lugar/nacionalni-park-durmitor---masiv/) e o [Desfiladeiro do Rio
      Tara](/lugar/nacionalni-park-durmitor---kanjon-tare/); o [Parque Natural de
      Piva](/lugar/park-prirode-piva/) é diretamente confinante.
