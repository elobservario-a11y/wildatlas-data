    Le point culminant de Bosnie-Herzégovine (Maglić 2 386 m) et la réserve intégrale de forêt vierge de
    Perućica.
  de: Der höchste Gipfel von Bosnien und Herzegowina (Maglić 2.386 m) und das Urwaldreservat Perućica.
