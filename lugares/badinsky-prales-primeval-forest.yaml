resumen:
  es: >-
    Bosque virgen de abeto y haya de más de 400 años protegido desde 1913, célebre por haber recibido la
    visita oficial de Carlos III del Reino Unido por su valor ecológico.
  en: >-
    Virgin fir and beech forest over 400 years old protected since 1913, famous for receiving an official
    visit by Charles III of the United Kingdom for its ecological value.
  fr: >-
    Forêt vierge de sapins et de hêtres vieille de plus de 400 ans protégée depuis 1913, célèbre pour avoir
    reçu la visite officielle de Charles III du Royaume-Uni en raison de sa valeur écologique.
  de: >-
    Über 400 Jahre alter Urwald aus Tanne und Buche unter Schutz seit 1913, berühmt für den offiziellen Besuch
    von Charles III. des Vereinigten Königreichs wegen seines ökologischen Wertes.
  it: >-
    Foresta vergine di abete e faggio di oltre 400 anni protetta dal 1913, celebre per la visita ufficiale di
    Carlo III del Regno Unito per il suo valore ecologico.
  pt: >-
    Floresta virgem de abetos e faias com mais de 400 anos protegida desde 1913, afamada por ter recebido a
    visita oficial de Carlos III do Reino Unido pelo seu valor ecológico.
unico:
  es: >-
    Es un bosque primario que lleva más de un siglo protegido y donde conviven las tres fases de la vida de un
    bosque europeo.
  en: >-
    A primeval forest protected for over a century where all three lifecycle phases of a natural European
    forest coexist side by side.
  fr: >-
    Une forêt primaire protégée depuis plus d’un siècle où coexistent les trois phases de la vie d’une forêt
    naturelle européenne.
  de: >-
    Ein Urwald, der seit über einem Jahrhundert geschützt ist und in dem alle drei Entwicklungsphasen eines
    natürlichen europäischen Bergwalds nebeneinander bestehen.
  it: >-
    Una foresta primaria protetta da oltre un secolo dove convivono le tre fasi del ciclo vitale di una
    foresta naturale europea.
  pt: >-
    Uma floresta primária protegida há mais de um século onde coexistem as três fases da vida de um bosque
    europeu natural.
observaciones:
  es: >-
    Para entrar hace falta ir en una excursión con acompañante especializado. Pregunta a la administración de
