resumen:
  es: >-
    Uno de los cañones de ranura (*slot canyon*) más estrechos y espectaculares de Europa (las paredes
    calcáreas rozan casi los 200 m de altura separadas por apenas 3 metros).
  en: >-
    One of the narrowest and most spectacular slot canyons in Europe (limestone walls reaching nearly 200 m in
    height, separated by barely 3 meters).
  fr: >-
    L'un des canyons en fente (*slot canyon*) les plus étroits et spectaculaires d'Europe (les parois
    calcaires frôlent près de 200 m de haut séparées d'à peine 3 mètres).
  de: >-
    Einer der engsten und spektakulärsten Slot Canyons Europas (Kalksteinwände ragen fast 200 m empor,
    getrennt durch kaum 3 Meter).
  it: >-
    Uno dei cañon a fessura (*slot canyon*) più stretti e spettacolari d'Europa (le pareti calcaree sfiorano
    quasi i 200 m d'altezza separate da appena 3 metri).
  pt: >-
    Um dos desfiladeiros em fenda (*slot canyon*) mais estreitos e espectaculares da Europa (as escarpas
    calcárias atingem quase 200 m de altura separadas por apenas 3 metros).
unico:
  es: >-
    Un cañón de piedra caliza tan estrecho que en algunos tramos apenas cabe en tres metros, con cascada,
    águilas y gato montés en sus paredes.
  en: >-
    A limestone slot canyon so tightly pinched that in stretches it measures scarcely three meters across,
    home to waterfalls, golden eagles, and wildcats in its cliffs.
  fr: >-
    Un canyon calcaire si resserré qu'il tient par endroits en trois mètres de large, avec cascade, aigles
    royaux et chat forestier sur ses falaises.
  de: >-
    Ein Kalkstein-Canyon, der stellenweise kaum drei Meter Durchgangsbreite lässt, mit Wasserfällen,
    Steinadlern und Wildkatzen in den Felsen.
  it: >-
    Un canyon di roccia calcarea così stretto che in alcuni tratti misura appena tre metri, con cascata,
    aquile reali e gatto selvatico tra le pareti.
  pt: >-
    Um desfiladeiro de calcário tão apertado que em certos troços mal ultrapassa três metros de largura, com
    cascata, águias e gato-bravo nas escarpas.
observaciones:
  es: >-
    El parque es claro con las normas del cañón: no salgas del sendero, usa siempre el casco protector y
    calzado y ropa adecuados, no uses bastones para tener las manos libres y no te detengas bajo las paredes.
    Si caen piedras, aléjate de inmediato de la zona. La cobertura móvil solo llega en algunos puntos. Evita
    la garganta con lluvia, en el deshielo, con viento fuerte y con mal tiempo en general.
texto:
  es:
    intro: >-
      Hay sitios donde el suelo se abre y te invita a entrar. Las Gole di Celano son una de esas grietas: una
      garganta que el Rio La Foce lleva siglos cavando entre el macizo del Sirente y el monte Tino, en los
      Abruzos, y que se recorre andando por el fondo, con las paredes cada vez más altas y el cielo reducido a
      una cinta. Son unos cinco kilómetros de cañón muy estrecho, con paredes verticales que superan a menudo
      los cien metros.
    landscape: >-
      El agua es la escultora. El Rio La Foce recibe las aguas del torrente del valle de Arano, el Rio Santa
      Jona, por una serie de pequeñas cascadas, y desde allí corta la roca más de cuatro kilómetros hasta
      desembocar en los canales artificiales de la llanura del Fucino. El desnivel es grande: de unos mil
      trescientos treinta metros en el extremo norte a quinientos en el lado del Fucino. Las medidas varían
      según quién las cuente: otra descripción da a la garganta una anchura media de cinco o seis metros, con
      estrechamientos que no pasan de tres, y paredes de casi doscientos metros en la zona más profunda.


      El fondo del cañón lleva abundante agua en primavera. Las paredes, que el parque describe como un
      hábitat de roquedo, dan cobijo a vegetación variada y a aves que anidan en ellas. Si entras desde Aielli
      o Celano, casi al final del recorrido una ensenada junto al pinar lleva a la Fonte degli innamorati, una
      pequeña cascada que cae a unos mil veintinueve metros de altitud.
    wildlife: >-
      En el cañón y su entorno el parque dice que se pueden encontrar el [águila
      real](/especie/aquila_chrysaetos/), el [búho real](/especie/bubo_bubo/), el [halcón
      peregrino](/especie/falco_peregrinus/) y el [gato montés](/especie/felis_silvestris/). Los ornitólogos
      pueden ver además gavilán y ratonero, y el [buitre leonado](/especie/gyps_fulvus/) está presente en buen
      número, reintroducido hace unos años.


      Lo que sigue es del parque regional entero, no solo de la garganta, pero ayuda a imaginar quién anda
      cerca. El parque tiene confirmados doscientos dieciséis vertebrados: ciento cuarenta y nueve aves,
      cuarenta y tres mamíferos, trece reptiles y once anfibios. Junto al [lobo](/especie/canis_lupus/)
      apenino viven zorro, [corzo](/especie/capreolus_capreolus/), liebre, garduña y comadreja; el gato
      montés, que se creía desaparecido de la zona, es el mamífero más interesante de los bosques; hace años
      que se ha confirmado la presencia del [oso](/especie/ursus_arctos/) marsicano, y desde 2013 hay un
      programa de reintroducción del rebeco apenino.


      La estación manda. En primavera el torrente baja con agua. En el deshielo, con lluvias fuertes y en días
      de mucho viento el recorrido debe evitarse, por el riesgo de caída de piedras.
    visit: >-
      La garganta se recorre en los dos sentidos: subiendo desde Aielli o Celano, desde La Foce hacia el valle
      de Arano, o bajando desde Ovindoli por el valle de Arano hacia La Foce. La entrada desde Aielli, en la
      localidad de Bocca di Castelluccio, está a unos novecientos metros de altitud, y el nombre recuerda un
      castillo de los siglos XI y XII, al que se llegaba por un sendero de época romana.


      En verano el acceso se regula con reserva en línea gratuita en la web del parque, por sentido de marcha
      y por turnos: de siete a diez, de diez a trece y de trece a quince horas, con un máximo de ochenta
      personas al día en cada sentido. El camino es el sendero número doce del parque.
    history: >-
      Los nombres cuentan la historia. En la Edad Media la garganta se llamaba «gole delle Foci», del topónimo
      latino *Fauces*, que designaba un antiguo centro fortificado. Cerca quedan los restos de la ermita de
      San Marco ai Casaleni y del monasterio de San Marco, que los monjes celestinos custodiaron hasta finales
      del siglo XIV.


      Hoy la garganta está dentro del parque regional del Sirente-Velino, creado en 1989, y el cañón del
      torrente La Foce está bajo un vínculo paisajístico.
    before: >-
      El parque es claro con las normas del cañón: no salgas del sendero, usa siempre el casco protector y
      calzado y ropa adecuados, no uses bastones para tener las manos libres y no te detengas bajo las
      paredes. Si caen piedras, aléjate de inmediato de la zona. La cobertura móvil solo llega en algunos
      puntos. Evita la garganta con lluvia, en el deshielo, con viento fuerte y con mal tiempo en general.
    around: >-
      A quince kilómetros está el [Parque Nacional de los Abruzos, Lacio y
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), a veintiuno la [Reserva Natural Garganta del
      Sagittario](/lugar/gole-del-sagittario/) y a veintitrés el [Parque Nacional del Gran Sasso y Montes de
      la Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) y el [Parque Nacional de la
      Majella](/lugar/parco-nazionale-della-majella/).
  en:
    intro: >-
      There are places where the earth splits open and beckons you inside. The Gole di Celano form one such
      chasm: a canyon that the Rio La Foce has carved for centuries between the Sirente massif and Monte Tino
      in the Abruzzo, negotiated on foot along the riverbed with cliffs rising ever higher and the open sky
      reduced to a narrow ribbon. It spans roughly five kilometers of tight gorge, framed by vertical rock
      walls frequently exceeding one hundred meters in height.
    landscape: >-
      Water acts as the master sculptor. The Rio La Foce collects waters cascading from the Arano valley
      stream, the Rio Santa Jona, via a staircase of small waterfalls, and slices through solid bedrock for
      more than four kilometers before spilling into the drainage canals of the Fucino plain. The elevation
      drop is considerable: from some one thousand three hundred and thirty meters at the northern threshold
      down to five hundred meters on the Fucino side. Dimensions vary in historical descriptions: another
      survey assigns the chasm an average breadth of five to six meters, pinching at tightest passages to
      under three meters, flanked by precipices approaching two hundred meters in the deepest section.


      The canyon floor carries active streamflow in spring. The rock faces, cataloged by the regional park as
      an essential cliff-dwelling habitat, shelter specialized flora and nesting birds. Entering from Aielli
      or Celano, near the trail's end an alcove beside a pine grove leads to the Fonte degli innamorati, a
      delicate cascade pouring out at an altitude of approximately one thousand and twenty-nine meters.
    wildlife: >-
      Within the canyon and its immediate environs, park authorities record the [golden
      eagle](/especie/aquila_chrysaetos/), the [Eurasian eagle-owl](/especie/bubo_bubo/), the [peregrine
      falcon](/especie/falco_peregrinus/), and the [wildcat](/especie/felis_silvestris/). Birdwatchers may
      also observe Eurasian sparrowhawks and common buzzards, while the [griffon
      vulture](/especie/gyps_fulvus/) is well represented following reintroduction programs.


      The broader regional park surrounding the canyon harbors two hundred and sixteen verified vertebrate
      species: one hundred and forty-nine birds, forty-three mammals, thirteen reptiles, and eleven
      amphibians. Alongside the Apennine [grey wolf](/especie/canis_lupus/) live red foxes, [roe
      deer](/especie/capreolus_capreolus/), European hares, stone martens, and least weasels; the wildcat,
      once feared extirpated from the area, is the most remarkable forest feline; the presence of the Marsican
      [brown bear](/especie/ursus_arctos/) has been confirmed for years, and since 2013 a reintroduction
      project has reintroduced the Apennine chamois.


      Conditions dictate safety. In spring the stream runs swift. During snowmelt, heavy downpours, or gusty
      winds, hiking the gorge must be avoided due to severe rockfall hazards.
    visit: >-
      The canyon can be hiked in either direction: ascending from Aielli or Celano from La Foce toward the
      Arano valley, or descending from Ovindoli through the Arano valley down to La Foce. The trailhead from
      Aielli at Bocca di Castelluccio sits at roughly nine hundred meters elevation, named after a medieval
      castle from the eleventh and twelfth centuries accessed via a Roman-era trackway.


      In summer, access is managed through free online reservations on the park website, allocated by
      direction and time slots: from seven to ten, ten to thirteen, and thirteen to fifteen hours, capped at
      eighty visitors per day in each direction. The route follows official park trail number twelve.
    history: >-
      Toponyms preserve the historical memory. In medieval chronicles the gorge was known as the "Gole delle
      Foci" from the Latin *Fauces*, denoting an ancient fortified pass. Nearby stand the ruins of the
      hermitage of San Marco ai Casaleni and the monastery of San Marco, maintained by Celestine monks until
      the close of the fourteenth century.


      Today the gorge lies within Sirente-Velino Regional Park, established in 1989, and the La Foce stream
      canyon is protected under landscape conservation zoning.
    before: >-
      The park enforces strict safety rules: stay strictly on the trail, always wear a climbing safety helmet
      along with suitable footwear and mountain clothing, avoid walking poles to keep hands free, and never
      halt beneath sheer overhangs. If stones tumble, vacate the impact zone immediately. Mobile phone
      reception is available only at scattered openings. Avoid the gorge in rainy weather, during snowmelt,
      high winds, and severe conditions.
    around: >-
      Fifteen kilometers away lies [Abruzzo, Lazio and Molise National
      Park](/lugar/parco-nazionale-d-abruzzo-lazio-e/), twenty-one kilometers the [Gole del Sagittario Nature
      Reserve](/lugar/gole-del-sagittario/), and twenty-three kilometers both [Gran Sasso and Monti della Laga
      National Park](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) and [Majella National
      Park](/lugar/parco-nazionale-della-majella/).
  fr:
    intro: >-
      Il est des lieux où la terre s'entrouvre et invite à pénétrer ses entrailles. Les Gole di Celano
      constituent l'une de ces failles : une gorge que le Rio La Foce creuse depuis des millénaires entre le
      massif du Sirente et le mont Tino, dans les Abruzzes, et que l'on parcourt à pied au fond du lit, sous
      des falaises vertigineuses réduisant le ciel à un ruban bleu. Le défilé s'étire sur cinq kilomètres
      d'une gorge resserrée bordée de parois dépassant souvent cent mètres de hauteur.
    landscape: >-
      L'eau est l'artisan du relief. Le Rio La Foce recueille les eaux torrentielles du val d'Arano, le Rio
      Santa Jona, par une succession de ressauts en cascade, puis entaille la masse calcaire sur plus de
      quatre kilomètres avant de rejoindre les canaux de la plaine du Fucin. Le dénivelé est marqué :
      d'environ mille trois cent trente mètres au débouché nord à cinq cents mètres côté Fucin. Les mesures
      varient selon les sources : une autre description attribue à la gorge une largeur moyenne de cinq à six
      mètres, avec des rétrécissements ne dépassant pas trois mètres et des parois de près de deux cents
      mètres dans la partie la plus encaissée.


      Le fond de gorge charrie d'abondantes eaux printanières. Les parois rocheuses abritent une flore
      rupicole spécialisée et des rapaces cavernicoles. En arrivant depuis Aielli ou Celano, presque au terme
      du parcours, une combe boisée de pins mène à la Fonte degli innamorati, fine cascade jaillissant vers
      mille vingt-neuf mètres d'altitude.
    wildlife: >-
      Dans la gorge et ses abords immédiats, le parc signale la présence de [l'aigle
      royal](/especie/aquila_chrysaetos/), du [grand-duc d'Europe](/especie/bubo_bubo/), du [faucon
      pèlerin](/especie/falco_peregrinus/) et du [chat forestier](/especie/felis_silvestris/). Les
      ornithologues observent également l'épervier et la buse variable, tandis que le [vautour
      fauve](/especie/gyps_fulvus/) est bien implanté grâce à des réintroductions.


      À l'échelle du parc régional, deux cent seize vertébrés sont inventoriés : cent quarante-neuf oiseaux,
      quarante-trois mammifères, treize reptiles et onze amphibiens. Aux côtés du [loup
      gris](/especie/canis_lupus/) des Apennins vivent renard, [chevreuil](/especie/capreolus_capreolus/),
      lièvre, fouine et belette ; le chat forestier reste le félin le plus emblématique ; la présence de
      [l'ours brun](/especie/ursus_arctos/) marsicain est attestée de longue date, et depuis 2013 un programme
      réintroduit le chamois des Apennins.


      La prudence commande l'accès. Au printemps, le ruisseau est impétueux. En période de fonte nivale, lors
      de pluies battantes ou par vent fort, la traversée doit être évitée en raison des chutes de pierres.
    visit: >-
      La gorge se parcourt dans les deux sens : en montée depuis Aielli ou Celano (La Foce) vers le val
      d'Arano, ou en descente depuis Ovindoli par le val d'Arano vers La Foce. L'accès depuis Aielli à Bocca
      di Castelluccio se situe à environ neuf cents mètres d'altitude, toponyme rappelant un château des XIe
      et XIIe siècles desservi par un ancien chemin romain.


      En été, l'accès est régulé par réservation en ligne gratuite sur le site du parc, par sens de
      circulation et par créneaux horaires : de sept à dix, de dix à treize et de treize à quinze heures, avec
      une jauge fixée à quatre-vingts personnes par jour dans chaque direction. L'itinéraire correspond au
      sentier numéro douze du parc.
    history: >-
      Les toponymes retracent le passé. Au Moyen Âge, la gorge était appelée « gole delle Foci », du latin
      *Fauces* désignant un passage resserré fortifié. Non loin subsistent les ruines de l'ermitage San Marco
      ai Casaleni et du monastère San Marco, gardé par les moines célestins jusqu'à la fin du XIVe siècle.


      Aujourd'hui, le défilé est englobé dans le parc naturel régional du Sirente-Velino, créé en 1989, et les
      gorges du Rio La Foce bénéficient d'un classement au titre des sites remarquables.
    before: >-
      Le parc applique des consignes strictes : ne quittez jamais le sentier, portez en permanence un casque
      de protection ainsi que des chaussures de montagne adaptées, n'utilisez pas de bâtons pour conserver les
      mains libres et ne stationnez pas sous les parois surplombantes. En cas de chute de cailloux,
      éloignez-vous immédiatement. La couverture réseau est quasi inexistante. Renoncez à l'excursion par
      temps pluvieux ou venteux.
    around: >-
      À quinze kilomètres se trouve le [parc national des Abruzzes, Latium et
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), à vingt et un kilomètres la [réserve naturelle de la
      gorge du Sagittario](/lugar/gole-del-sagittario/) et à vingt-trois kilomètres le [parc national du Gran
      Sasso et des monts de la Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) ainsi que le
      [parc national de la Majella](/lugar/parco-nazionale-della-majella/).
  de:
    intro: >-
      Es gibt Orte, an denen sich die Erde öffnet und zum Hineingehen einlädt. Die Gole di Celano bilden eine
      solche Klamm: eine Schlucht, die der Rio La Foce seit Jahrhunderten zwischen dem Sirente-Massiv und dem
      Monte Tino in den Abruzzen eingetieft hat. Man durchwandert sie auf der Bachsohle, während die Felswände
      emporwachsen und den Himmel zu einem schmalen Band verengen. Es sind rund fünf Kilometer enge Klamm mit
      Steilwänden, die oft hundert Meter Höhe übersteigen.
    landscape: >-
      Das Wasser war der Baumeister. Der Rio La Foce empfängt die Bäche des Arano-Tals, den Rio Santa Jona,
      über Kaskaden und schneidet sich dann über vier Kilometer in das Gestein ein, bevor er die Ebene des
      Fucino erreicht. Das Gefälle ist beträchtlich: von rund eintausenddreihundertdreißig Metern am Nordende
      auf fünfhundert Meter zur Fucino-Ebene. Die Maße schwanken je nach Erhebung: Eine andere Vermessung
      weist der Klamm eine durchschnittliche Breite von fünf bis sechs Metern zu, mit Engstellen von weniger
      als drei Metern und fast zweihundert Meter hohen Felswänden im tiefsten Abschnitt.


      Die Klammsohle führt im Frühjahr reichlich Schmelzwasser. Die Steilwände bieten seltenen Felskräutern
      und Felsbrütern Lebensraum. Wer von Aielli oder Celano aufsteigt, erreicht gegen Ende des Tals eine
      Bucht nahe einem Kiefernwald zur Fonte degli innamorati, einem Wasserfall auf rund
      eintausendneunundzwanzig Metern Höhe.
    wildlife: >-
      In der Schlucht verzeichnet der Park [Steinadler](/especie/aquila_chrysaetos/),
      [Uhu](/especie/bubo_bubo/), [Wanderfalke](/especie/falco_peregrinus/) und die
      [Wildkatze](/especie/felis_silvestris/). Vogelbeobachter sichten zudem Sperber und Mäusebussard, während
      der [Gänsegeier](/especie/gyps_fulvus/) nach Auswilderungen wieder heimisch ist.


      Im gesamten Regionalpark wurden zweihundertsechzehn Wirbeltierarten nachgewiesen:
      einhundertneunundvierzig Vogelarten, dreiundvierzig Säugetiere, dreizehn Reptilien und elf Amphibien.
      Neben dem Apenninen-[Wolf](/especie/canis_lupus/) leben Rotfuchs, [Reh](/especie/capreolus_capreolus/),
      Feldhase, Steinmarder und Mauswiesel; die Wildkatze gilt als kostbarster Waldbewohner. Die Anwesenheit
      des Marsischen [Braunbären](/especie/ursus_arctos/) ist seit langem belegt, und seit 2013 läuft die
      Wiederansiedlung der Apennin-Gämse.


      Das Wetter setzt die Grenzen. Im Frühjahr schwillt der Wildbach an. Bei der Schneeschmelze, Starkregen
      und Sturm ist die Schlucht wegen akuter Steinschlaggefahr zu meiden.
    visit: >-
      Die Schlucht kann in beiden Richtungen begangen werden: ansteigend von Aielli oder Celano (La Foce) zum
      Arano-Tal oder abwärts von Ovindoli durch das Arano-Tal nach La Foce. Der Einstieg bei Aielli in Bocca
      di Castelluccio liegt auf rund neunhundert Metern Höhe; der Name erinnert an eine Höhenburg des elften
      und zwölften Jahrhunderts an einem antiken Römerweg.


      Im Sommer ist der Zugang über eine kostenlose Online-Reservierung auf der Park-Website kontingentiert,
      gestaffelt nach Gehrichtung und Zeitfenstern: von sieben bis zehn, zehn bis dreizehn und dreizehn bis
      fünfzehn Uhr, begrenzt auf achtzig Personen pro Tag und Richtung. Die Route folgt dem Parkweg Nummer
      zwölf.
    history: >-
      Historische Namen spiegeln die Vergangenheit. Im Mittelalter hieß der Durchbruch «Gole delle Foci», nach
      dem lateinischen Begriff *Fauces* für einen befestigten Engpass. Nahebei liegen die Ruinen der
      Einsiedelei San Marco ai Casaleni und des Klosters San Marco, das Coelestinermönche bis zum Ausgang des
      vierzehnten Jahrhunderts betreuten.


      Heute liegt die Schlucht im 1989 gegründeten Regionalpark Sirente-Velino und steht als
      Landschaftsschutzgebiet unter strengem Schutz.
    before: >-
      Der Park verlangt Umsicht: Bleibe stets auf dem Pfad, trage durchgehend einen Steinschlaghelm und festes
      Schuhwerk, verzichte auf Wanderstöcke, um die Hände frei zu haben, und raste nicht unter Überhängen.
      Weiche herabfallenden Steinen unverzüglich aus. Mobilfunkempfang besteht fast nirgends. Meide die Klamm
      bei Nässe und Unwetter.
    around: >-
      Fünfzehn Kilometer entfernt liegt der [Nationalpark Abruzzen, Latium und
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), einundzwanzig Kilometer das [Naturreservat
      Sagittario-Schlucht](/lugar/gole-del-sagittario/) und dreiundzwanzig Kilometer der [Nationalpark Gran
      Sasso und Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) sowie der
      [Majella-Nationalpark](/lugar/parco-nazionale-della-majella/).
  it:
    intro: >-
      Ci sono luoghi dove la terra si apre e ti invita a entrare. Le Gole di Celano sono una di queste
      fenditure: una forra che il Rio La Foce scava da secoli tra il massiccio del Sirente e il monte Tino, in
      Abruzzo, e che si risale a piedi lungo il greto, con le pareti che si innalzano vertiginose e il cielo
      ridotto a un nastro sottile. Sono circa cinque chilometri di canyon strettissimo, con bastionate
      rocciose che superano sovente i cento metri d'altezza.
    landscape: >-
      L'acqua è l'artefice della gola. Il Rio La Foce accoglie le acque torrentizie della val d'Arano, il Rio
      Santa Jona, attraverso una successione di cascatelle, e da lì fende la roccia per oltre quattro
      chilometri fino a sfociare nei canali di bonifica della piana del Fucino. Il dislivello è notevole: da
      circa milletrecentotrenta metri all'estremità settentrionale a cinquecento metri sul versante del
      Fucino. Le misurazioni differiscono a seconda delle fonti: un'altra stima assegna alla gola una
      larghezza media di cinque o sei metri, con strozzature che scendono sotto i tre metri e pareti di quasi
      duecento metri nel tratto più profondo.


      Il fondo del canyon convoglia copiose portate in primavera. Le pareti calcaree ospitano una vegetazione
      rupicola specializzata e uccelli nidificanti. Salendo da Aielli o Celano, verso il termine della forra
      una deviazione nella pineta conduce alla Fonte degli innamorati, una cascatella che precipita a circa
      milletrentanove metri di quota.
    wildlife: >-
      Nella gola e nei versanti contigui il parco segnala la presenza dell' [aquila
      reale](/especie/aquila_chrysaetos/), del [gufo reale](/especie/bubo_bubo/), del [falco
      pellegrino](/especie/falco_peregrinus/) e del [gatto selvatico](/especie/felis_silvestris/). Gli
      ornitologi possono scorgere inoltre lo sparviero e la poiana, mentre il [grifone](/especie/gyps_fulvus/)
      è ben presente grazie alle reintroduzioni.


      Nel territorio del parco regionale sono censiti duecentosedici vertebrati: centoquarantanove uccelli,
      quarantatré mammiferi, tredici rettili e undici anfibi. Accanto al [lupo](/especie/canis_lupus/)
      appenninico vivono la volpe, il [capriolo](/especie/capreolus_capreolus/), la lepre, la faina e la
      donnola; il gatto selvatico è il felino più prezioso delle selve; da anni è confermata la presenza dell'
      [orso](/especie/ursus_arctos/) marsicano, e dal 2013 è attivo un piano di reintroduzione del camoscio
      appenninico.


      La stagione impone cautela. In primavera il torrente è impetuoso. Durante il disgelo, con piogge
      battenti o forte vento l'escursione va evitata per il pericolo di caduta massi.
    visit: >-
      La gola si percorre in entrambi i sensi: salendo da Aielli o Celano (La Foce) verso la val d'Arano,
      oppure scendendo da Ovindoli attraverso la val d'Arano verso La Foce. L'imbocco da Aielli in località
      Bocca di Castelluccio si trova a circa novecento metri di quota; il toponimo ricorda un fortilizio dei
      secoli XI e XII servito da una mulattiera d'epoca romana.


      In estate l'accesso è contingentato tramite prenotazione online gratuita sul sito del parco, per senso
      di marcia e fasce orarie: dalle sette alle dieci, dalle dieci alle tredici e dalle tredici alle
      quindici, con un massimo di ottanta persone al giorno per ciascun senso. Il sentiero è contrassegnato
      dal numero dodici del parco.
    history: >-
      I toponimi testimoniano la storia. Nel Medioevo la forra era denominata «gole delle Foci», dal termine
      latino *Fauces* che indicava un valico fortificato. Nelle vicinanze restano i ruderi dell'eremo di San
      Marco ai Casaleni e del monastero di San Marco, custodito dai padri celestini fino alla fine del secolo
      XIV.


      Oggi la forra è compresa nel Parco Naturale Regionale Sirente-Velino, istituito nel 1989, e il canyon
      del torrente La Foce è sottoposto a vincolo paesaggistico.
    before: >-
      Il parco raccomanda la massima prudenza: non uscire dalla traccia, indossa sempre il casco protettivo e
      calzature da montagna adeguate, non usare bastoncini per avere le mani libere e non sostare sotto le
      pareti strapiombanti. In caso di scariche di sassi, allontanati rapidamente. La copertura telefonica è
      quasi assente. Rinuncia all'escursione con pioggia o maltempo.
    around: >-
      A quindici chilometri sorge il [Parco Nazionale d'Abruzzo, Lazio e
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), a ventuno la [Riserva Naturale Gole del
      Sagittario](/lugar/gole-del-sagittario/) e a ventitré chilometri sia il [Parco Nazionale del Gran Sasso
      e Monti della Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) sia il [Parco Nazionale
      della Majella](/lugar/parco-nazionale-della-majella/).
  pt:
    intro: >-
      Há sítios onde o solo se abre e convida a entrar. As Gole di Celano formam uma dessas fendas: uma
      garganta que o Rio La Foce talha há séculos entre o maciço do Sirente e o monte Tino, em Abruzzo,
      percorrida a pé pelo leito seco, com as escarpas a erguerem-se vertiginosas e o céu transformado numa
      fita azul. São cerca de cinco quilómetros de desfiladeiro muito estreito, com paredões verticais que
      amiúde ultrapassam os cem metros de altura.
    landscape: >-
      A água esculpiu todo o relevo. O Rio La Foce recolhe as torrentes do vale de Arano, o Rio Santa Jona,
      por socalcos em cascata e abre caminho na rocha durante mais de quatro quilómetros até desembocar nos
      canais da planície do Fucino. O declive é acentuado: de cerca de mil trezentos e trinta metros no topo
      norte a quinhentos metros junto ao Fucino. As medições variam conforme os relatos: outra estimativa
      atribui à garganta uma largura média de cinco a seis metros, com estreitamentos abaixo dos três metros e
      falésias com quase duzentos metros na porção mais abissal.


      O fundo do desfiladeiro transporta caudal abundante na primavera. As escarpas acolhem vegetação rupícola
      rara e aves de rapina nidificantes. Subindo a partir de Aielli ou Celano, perto do fecho da garganta um
      desvio no pinhal conduz à Fonte degli innamorati, uma cascata que cai a cerca de mil e vinte e nove
      metros de altitude.
    wildlife: >-
      No desfiladeiro e nas encostas vizinhas o parque assinala a [águia-real](/especie/aquila_chrysaetos/), o
      [bufo-real](/especie/bubo_bubo/), o [falcão-peregrino](/especie/falco_peregrinus/) e o
      [gato-bravo](/especie/felis_silvestris/). Os ornitólogos podem avistar ainda gaviões e
      águias-d'asa-redonda, enquanto o [grifo](/especie/gyps_fulvus/) encontra-se restabelecido por programas
      de reintrodução.


      Em todo o parque regional estão inventariados duzentos e dezasseis vertebrados: cento e quarenta e nove
      aves, quarenta e três mamíferos, treze répteis e onze anfíbios. A par do [lobo](/especie/canis_lupus/)
      apenino vivem raposas, [corços](/especie/capreolus_capreolus/), lebres, fuinhas e doninhas; o gato-bravo
      é o felino mais emblemático das matas; a presença do [urso-pardo](/especie/ursus_arctos/) marsicano está
      confirmada há vários anos, e desde 2013 vigora um plano de reintrodução da camurça-dos-apeninos.


      A estação impõe respeito. Na primavera o rio corre encapelado. No degelo, com chuvadas fortes e em dias
      de vendaval a travessia deve ser evitada pelo risco evidente de derrocadas.
    visit: >-
      A garganta pode ser percorrida em ambos os sentidos: a subir a partir de Aielli ou Celano (La Foce) rumo
      ao vale de Arano, ou a descer desde Ovindoli pelo vale de Arano em direção a La Foce. A entrada por
      Aielli, em Bocca di Castelluccio, situa-se a cerca de novecentos metros de altitude, evocando uma
      fortaleza dos séculos XI e XII servida por caminho romano.


      No verão o acesso é regulado por marcação gratuita na página do parque, por sentido e janelas horárias:
      das sete às dez, das dez às treze e das treze às quinze horas, com um limite de oitenta pessoas por dia
      em cada sentido. O trilho corresponde ao caminho número doze do parque.
    history: >-
      A toponímia guarda a memória dos lugares. Na Idade Média a garganta designava-se «gole delle Foci», do
      vocábulo latino *Fauces* relativo a desfiladeiro fortificado. Nas imediações jazem os vestígios da
      ermida de San Marco ai Casaleni e do mosteiro de San Marco, zelado pelos monges celestinos até aos
      finais do século XIV.


      Atualmente o desfiladeiro integra o Parque Natural Regional Sirente-Velino, criado em 1989, com estatuto
      de proteção paisagística rigorosa.
    before: >-
      O parque define regras expressas: nunca saias do trilho, usa sempre capacete de escalada e botas de
      montanha, dispensa bastões para manter as mãos livres e evita deter-te sob paredes salientes. Perante
      queda de pedras afasta-te de imediato. A rede móvel é quase inexistente. Não entres com chuva ou mau
      tempo.
    around: >-
      A quinze quilómetros fica o [Parque Nacional de Abruzzo, Lácio e
      Molise](/lugar/parco-nazionale-d-abruzzo-lazio-e/), a vinte e um a [Reserva Natural da Garganta do
      Sagittario](/lugar/gole-del-sagittario/) e a vinte e três quer o [Parque Nacional do Gran Sasso e Montes
      da Laga](/lugar/parco-nazionale-del-gran-sasso-e-monti-della-laga/) quer o [Parque Nacional da
      Majella](/lugar/parco-nazionale-della-majella/).
