resumen:
  es: >-
    La primera Reserva Natural Integral creada en Italia (1959), hayedo primario Intacto de más de 500 años de
    antigüedad sin tala humana.
  en: >-
    The first Strict Nature Reserve established in Italy (1959), an intact primary beech forest over 500 years
    old untouched by logging.
  fr: >-
    La première réserve naturelle intégrale créée en Italie (1959), une hêtraie primaire intacte de plus de
    500 ans exempte d'exploitation.
  de: >-
    Das erste integrale Naturreservat Italiens (1959), ein intakter Ur-Buchenwald von über 500 Jahren Alter
    ohne Holznutzung.
  it: >-
    La prima Riserva Naturale Integrale istituita in Italia (1959), faggeta primaria intatta di oltre 500 anni
    senza tagli forestali.
  pt: >-
    A primeira Reserva Natural Integral criada em Itália (1959), faial primário intacto com mais de 500 anos
    sem corte de madeira.
unico:
  es: >-
    Es un bosque que se estudia de lejos porque no se visita, y por eso conserva madera muerta y cadenas
    tróficas que ya no existen en los bosques cultivados.
  en: >-
    It is a forest studied from afar because you cannot enter it, preserving deadwood dynamics and trophic
    webs long gone from managed woodlands.
  fr: >-
    Une forêt que l'on observe de loin car on ne peut y pénétrer, préservant des stocks de bois mort et des
    réseaux trophiques disparus des bois gérés.
  de: >-
    Ein Wald, den man nur aus der Ferne studieren kann, da man ihn nicht betreten darf; er bewahrt
    Totholzmengen und Nahrungsketten, die Wirtschaftswäldern längst fehlen.
  it: >-
    Un bosco che si studia da lontano perché non è consentito entrarvi, preservando necromassa e catene
    trofiche scomparse dai boschi gestiti.
  pt: >-
    É uma floresta que se estuda à distância por ser interdito entrar nela, conservando madeira morta e teias
    tróficas já desaparecidas dos bosques explorados.
observaciones:
  es: >-
    No se puede entrar en la reserva. El acceso interior se reserva a quien lo solicite por motivos de
    investigación, y la protección estricta excluye la visita turística ordinaria. No hay actividades
    turísticas autorizadas dentro de sus límites. Lo que sí puedes hacer es recorrer los itinerarios
    exteriores y visitar los centros del entorno, y para ellos consulta horarios y accesibilidad en sus
    enlaces.
texto:
  es:
    intro: >-
      A Sasso Fratino no se entra. Esa es la primera regla y también su razón de ser: es una reserva integral,
      la primera que se estableció en Italia, en 1959, y su interior está reservado a quien tenga un motivo de
      investigación y lo pida. Lo que protege es un hayedo con abeto blanco que se deja crecer, caer y
      pudrirse sin que nadie lo corrija. Son 764,25 hectáreas en los municipios de Bagno di Romagna y Santa
      Sofia, en Emilia-Romaña, y en ellas el bosque lleva el ritmo que le toca.
    landscape: >-
      La base es una roca miocena, la formación Marnoso Arenacea, una alternancia de estratos de arenisca de
      espesor variable con capas más finas de marga. Y de esa mezcla sale el relieve: el agua erosiona las
      margas, caen los bancos de arenisca que quedaban encima y así se han excavado valles profundos
      recorridos por torrentes. La altitud va de los 650 m de Ponte di Campo alla Sega a los 1520 m de Poggio
      Scali.


      El haya manda en toda la reserva. En el núcleo histórico forma hayedos y bosques mixtos con abeto
      blanco, y se le suman arces, olmos, tilos, fresnos y tejos. Por encima de los 1300 m el bosque es un
      hayedo casi puro. El clima es templado oceánico, con lluvias de régimen apenínico, nevadas irregulares y
      bancos de niebla y nubes bajas frecuentes incluso en verano.


      Lo mejor está en el suelo. La madera muerta, en pie o caída, cumple una función enorme para la
      biodiversidad porque activa cadenas tróficas desaparecidas de los bosques cultivados. Los números lo
      dicen: el inventario divulgado recoge 554 especies de hongos superiores, muchas ligadas a la madera
      muerta, y 102 especies de líquenes, incluidas formas epífitas de árboles viejos. Y entre las plantas,
      veinte son endémicas de los Apeninos, entre ellas *Filipendula ulmaria* subsp. *denudata*, *Carex
      macrolepis* y *Leucopoa dimorpha*.
    wildlife: >-
      El portal turístico nacional cita para Sasso Fratino [ciervos](/especie/cervus_elaphus/), corzos, gamos,
      jabalíes, muflones, [lobos](/especie/canis_lupus/) y rapaces nocturnas. Son los habitantes de un bosque
      donde, por regla, ninguno puede verse desde dentro.


      Las estaciones se notan sobre todo en el clima: nieve irregular en invierno, nieblas en verano. Para
      caminar por los alrededores, la mejor temporada va de mayo a noviembre.
    visit: >-
      Lo que se visita no es la reserva, sino su borde. Los límites están bien señalizados con numerosos
      carteles, y las sendas exteriores no son un permiso de entrada.


      Hay dos itinerarios exteriores. El circuito desde Passo Fangacci hasta La Lama, con regreso por el fosso
      degli Scalandrini y un desvío a Monte Penna, suma 13 km en total, unas cinco horas y entre 800 y 900 m
      de desnivel. La ruta desde Passo della Calla hasta Poggio Scali tiene unos 9 km de ida y vuelta, con 250
      m de subida a la ida y unas dos horas y media en ese sentido.


      Para entender el bosque desde fuera, el parque tiene varios centros. En Santa Sofia, el centro
      interpreta a los pueblos del parque, dedica un corredor a la historia del territorio, conserva una sala
      del naturalista Pietro Zangheri y expone la colección de objetos tradicionales de Giorgio Graziani.
      Badia Prataglia trata el trabajo tradicional de la madera y la relación espiritual con el bosque, y
      junto a él están el arboreto y el Museo Forestal Carlo Siemoni. En Bagno di Romagna, el Palazzo del
      Capitano explica la geología y el termalismo. En Campigna, el punto de información ocupa La villetta,
      con sala de proyecciones, y cerca está el Museo Forestal Guido Campedelli. Camaldoli suma un museo
      ornitológico con la colección Biggeri, y el jardín botánico de Valbonella ofrece visitas guiadas.
      Ninguno está dentro de la reserva estricta.
    history: >-
      En 1955, cuando era administrador de las Foreste Casentinesi, Fabio Clauser propuso preservar el bosque
      ante la posibilidad de talarlo en las laderas septentrionales de Poggio Scali. Así empezó todo. La
      reserva nació con 113 hectáreas, creció después con sucesivas ampliaciones y en 1959 quedó reconocida
      como reserva integral. En 1985 el Consejo de Europa le concedió el Diploma Europeo de Áreas Protegidas.
    before: >-
      No se puede entrar en la reserva. El acceso interior se reserva a quien lo solicite por motivos de
      investigación, y la protección estricta excluye la visita turística ordinaria. No hay actividades
      turísticas autorizadas dentro de sus límites. Lo que sí puedes hacer es recorrer los itinerarios
      exteriores y visitar los centros del entorno, y para ellos consulta horarios y accesibilidad en sus
      enlaces.
    around: >-
      No tiene vecinos cercanos en el atlas, pero sí bosques primarios afines, con árboles y hábitats en
      común. La [Reserva Natural Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) comparte
      olmo de montaña, arce real y fresno común. El [Bosque Virgen de
      Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/) tiene en común arce real, arce blanco y abeto blanco.
      El [Parque Nacional de Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) coincide en
      fresno, pito negro y haya, y el [Bosque Primario de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), en abeto blanco, pito negro y haya.
  en:
    intro: >-
      You do not enter Sasso Fratino. That is its foremost rule and its very reason for being: it is a strict
      nature reserve, the first created in Italy in 1959, and its interior remains open only to those who
      apply for approved scientific research. What it safeguards is an old-growth beech and silver fir forest
      left to grow, fall, and decompose without human interference. Spanning 764.25 hectares across the
      municipalities of Bagno di Romagna and Santa Sofia in Emilia-Romagna, the forest keeps its own natural
      pace.
    landscape: >-
      The geological base is a Miocene formation known as Marnoso Arenacea, characterized by alternating beds
      of sandstone of varying thickness and thinner layers of marl. That geological mix sculpts the relief:
      water erodes the soft marls, destabilizing overlying sandstone banks and carving steep ravines crossed
      by torrents. Elevations rise from 650 m at Ponte di Campo alla Sega to 1520 m atop Poggio Scali.


      European beech dominates the entire reserve. In the historic core it forms beechwoods and mixed stands
      with silver fir, joined by maples, elms, limes, ashes, and yews. Above 1300 m the canopy becomes almost
      pure beech. The climate is temperate oceanic, marked by Apennine rainfall patterns, erratic winter
      snowfall, and persistent fog and low clouds even in summer.


      The greatest treasure lies on the ground. Coarse woody debris, standing or fallen, plays a vital
      ecological role by sustaining trophic webs that have vanished from commercial forests. The figures
      testify to this: inventories record 554 species of higher fungi, many tied strictly to decaying wood,
      and 102 species of lichens, including epiphytic forms on veteran trees. Among vascular plants, twenty
      are endemic to the Apennines, including *Filipendula ulmaria* subsp. *denudata*, *Carex macrolepis*, and
      *Leucopoa dimorpha*.
    wildlife: >-
      National tourism records cite [red deer](/especie/cervus_elaphus/), roe deer, fallow deer, wild boar,
      mouflon, [grey wolves](/especie/canis_lupus/), and nocturnal raptors around Sasso Fratino. These are
      denizens of a sanctuary where, by regulation, none can be sought out from within.


      The seasons manifest primarily in the elements: irregular winter snows giving way to summer mists. For
      hiking along the surrounding perimeter, the most favourable window runs from May to November.
    visit: >-
      What you visit is not the reserve itself, but its perimeter. The boundaries are clearly indicated by
      numerous signs, and walking peripheral trails does not grant entry.


      There are two main external circuits. The loop from Passo Fangacci to La Lama, returning via Fosso degli
      Scalandrini with a detour to Monte Penna, covers 13 km in total, taking about five hours with an
      elevation gain of 800 to 900 m. The trail from Passo della Calla to Poggio Scali spans roughly 9 km
      round-trip, with 250 m of ascent on the outward leg, requiring around two and a half hours each way.


      To understand the forest without entering it, the national park maintains several visitor centres. In
      Santa Sofia, the centre interprets the communities of the park, devotes a gallery to territorial
      history, preserves the study of naturalist Pietro Zangheri, and exhibits Giorgio Graziani's ethnographic
      collection. Badia Prataglia explores traditional woodworking and spiritual ties to the woods, adjoining
      the arboretum and the Carlo Siemoni Forest Museum. In Bagno di Romagna, the Palazzo del Capitano focuses
      on geology and thermal waters. In Campigna, the information point occupies La villetta with a screening
      room, near the Guido Campedelli Forest Museum. Camaldoli adds an ornithological museum housing the
      Biggeri collection, while the Valbonella botanical garden offers guided tours. None of these facilities
      lie inside the strict reserve.
    history: >-
      In 1955, as administrator of the Foreste Casentinesi, Fabio Clauser proposed setting aside the woodland
      when logging was planned for the northern slopes of Poggio Scali. That was how it began. The reserve
      started with 113 hectares, expanded through subsequent acquisitions, and achieved formal recognition as
      a strict nature reserve in 1959. In 1985 the Council of Europe awarded it the European Diploma of
      Protected Areas.
    before: >-
      Entering the reserve is prohibited. Access to the interior is granted only upon request for authorized
      scientific research, and strict protection excludes ordinary hiking. There are no recreational
      activities permitted within its borders. You can, however, hike the perimeter routes and explore the
      interpretive centres in the vicinity; check their respective schedules and accessibility before setting
      out.
    around: >-
      While it has no immediate neighbouring sites in the atlas, it shares ecological kinships with other
      primeval forests. The [Havešová Strict Nature Reserve](/lugar/narodna-prirodna-rezervacia-havesova/)
      shares wych elm, Norway maple, and European ash. The [Lom Primeval
      Forest](/lugar/prasuma-lom-strogi-rezervat-prirode/) shares Norway maple, sycamore maple, and silver
      fir. The [Hainich National Park](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) coincides
      in ash, black woodpecker, and beech, and the [Strâmbu-Băiuț Primeval
      Forest](/lugar/codrul-secular-strambu-baiut/) in silver fir, black woodpecker, and beech.
  fr:
    intro: >-
      On ne pénètre pas dans Sasso Fratino. C'est sa règle première et sa raison d'exister : réserve naturelle
      intégrale, la toute première instituée en Italie en 1959, ses profondeurs ne s'ouvrent qu'aux
      scientifiques dûment autorisés. Elle protège une hêtraie à sapin pectiné qu'on laisse grandir, choir et
      pourrir sans que la main de l'homme n'intervienne. Ses 764,25 hectares s'étendent sur les communes de
      Bagno di Romagna et de Santa Sofia, en Émilie-Romagne, laissant la forêt s'épanouir selon sa cadence
      naturelle.
    landscape: >-
      Le socle est constitué de roches miocènes, la formation du Marnoso Arenacea, une alternance de bancs de
      grès d'épaisseur variable et de lits plus minces de marnes. De cet assemblage naît le relief : l'eau
      affouille les marnes tendres, provoquant l'effondrement des dalles de grès sus-jacentes et creusant
      d'abruptes gorges drainées par des torrents. L'altitude s'étage de 650 m au Ponte di Campo alla Sega
      jusqu'à 1520 m au sommet du Poggio Scali.


      Le hêtre règne sur l'ensemble de la réserve. Dans le périmètre originel, il constitue des hêtraies et
      des boisements mixtes avec le sapin blanc, rejoints par les érables, les ormes, les tilleuls, les frênes
      et les ifs. Au-delà de 1300 m d'altitude, le boisement devient une hêtraie quasi pure. Le climat est
      tempéré océanique, rythmé par des précipitations apennines, des chutes de neige irrégulières et des
      bancs de brume fréquents même en période estivale.


      Le trésor réside au sol. Le bois mort, debout ou au sol, remplit un rôle écologique primordial en
      soutenant des réseaux trophiques éteints dans les forêts exploitées. Les inventaires scientifiques le
      prouvent : ils recensent 554 espèces de champignons supérieurs, pour beaucoup inféodés au bois mort,
      ainsi que 102 espèces de lichens, dont des épiphytes sur vieux arbres. Parmi la flore vasculaire, vingt
      taxons sont endémiques des Apennins, dont *Filipendula ulmaria* subsp. *denudata*, *Carex macrolepis* et
      *Leucopoa dimorpha*.
    wildlife: >-
      Les guides régionaux signalent pour Sasso Fratino le [cerf élaphe](/especie/cervus_elaphus/), le
      chevreuil, le daim, le sanglier, le mouflon, le [loup gris](/especie/canis_lupus/) et les rapaces
      nocturnes. Ce sont les occupants d'un domaine où, par principe, nul randonneur ne peut les approcher de
      l'intérieur.


      Les saisons se manifestent d'abord par le climat : hivers aux neiges capricieuses, étés marqués par les
      brouillards. Pour randonner sur les crêtes périphériques, la meilleure période s'étend de mai à
      novembre.
    visit: >-
      Ce que vous visitez n'est pas la réserve elle-même, mais sa périphérie. Ses limites sont rigoureusement
      jalonnées de panonceaux, et les sentiers extérieurs ne constituent aucunement un laissez-passer.


      Il existe deux grands circuits extérieurs. La boucle reliant le Passo Fangacci à La Lama, revenant par
      le fosso degli Scalandrini avec crochet par le Monte Penna, cumule 13 km, demande environ cinq heures et
      présente de 800 à 900 m de dénivelé. L'itinéraire du Passo della Calla jusqu'au Poggio Scali totalise
      environ 9 km aller-retour, avec 250 m de dénivelé positif à l'aller pour environ deux heures et demie de
      marche dans ce sens.


      Pour appréhender ce sanctuaire depuis l'extérieur, le parc gère plusieurs pôles d'accueil. À Santa
      Sofia, le centre interprète les villages du massif, dédie une galerie à l'histoire locale, conserve le
      cabinet du naturaliste Pietro Zangheri et expose les objets traditionnels rassemblés par Giorgio
      Graziani. À Badia Prataglia, l'exposition met en valeur le travail du bois et les liens spirituels avec
      la forêt, aux côtés de l'arboretum et du musée forestier Carlo Siemoni. À Bagno di Romagna, le Palazzo
      del Capitano décrypte la géologie et le thermalisme. À Campigna, le point d'information s'établit dans
      La villetta, complété par le musée forestier Guido Campedelli. Camaldoli propose un musée ornithologique
      présentant la collection Biggeri, tandis que le jardin botanique de Valbonella offre des visites
      guidées. Aucune de ces structures ne se trouve dans la réserve intégrale.
    history: >-
      En 1955, alors qu'il administrait les Foreste Casentinesi, Fabio Clauser proposa d'épargner ce massif
      alors que des coupes étaient projetées sur les versants nord du Poggio Scali. C'est ainsi que l'aventure
      débuta. La réserve fut initialement circonscrite à 113 hectares, s'agrandit au fil des décennies et fut
      consacrée comme réserve intégrale en 1959. En 1985, le Conseil de l'Europe lui décerna le Diplôme
      européen des espaces protégés.
    before: >-
      Vous ne pouvez pas pénétrer dans la réserve. L'accès intérieur est exclusivement réservé aux missions de
      recherche scientifique autorisées, et la protection intégrale exclut tout tourisme pédestre. Aucune
      activité récréative n'y est tolérée. Vous pouvez en revanche parcourir les sentiers extérieurs et
      visiter les maisons du parc réparties dans les vallées environnantes.
    around: >-
      Le site n'a pas de voisins immédiats dans l'atlas, mais compte des massifs primaires apparentés. La
      [réserve naturelle intégrale de Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) partage l'orme
      de montagne, l'érable plane et le frêne élevé. La [forêt vierge de
      Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/) rassemble l'érable plane, l'érable sycomore et le
      sapin pectiné. Le [parc national de
      Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) présente en commun le frêne, le
      pic noir et le hêtre, tandis que la [forêt primaire de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) partage le sapin blanc, le pic noir et le hêtre.
  de:
    intro: >-
      Sasso Fratino betritt man nicht. Das ist die oberste Regel und zugleich sein Daseinszweck: Es ist ein
      integrales Totalreservat, das erste seiner Art in Italien aus dem Jahr 1959, und sein Inneres bleibt
      ausschließlich genehmigter wissenschaftlicher Forschung vorbehalten. Geschützt wird ein Buchenwald mit
      Weißtanne, der wachsen, stürzen und vermodern darf, ohne dass eine Säge eingreift. Das Reservat umfasst
      764,25 Hektar in den Gemeinden Bagno di Romagna und Santa Sofia in der Emilia-Romagna, und hier folgt
      der Wald seinem urzeitlichen Takt.
    landscape: >-
      Die geologische Grundlage bildet die miozäne Marnoso-Arenacea-Formation, ein Wechsellager aus
      unterschiedlich mächtigen Sandsteinbänken und feineren Mergelschichten. Aus dieser Schichtung formte
      sich das Relief: Wasser erodiert die weichen Mergel, die darüberliegenden Sandsteinplatten brechen nach,
      und so schnitten sich tiefe Schluchten mit rauschenden Wildbächen in das Gebirge ein. Die Höhenlagen
      reichen von 650 m an der Ponte di Campo alla Sega bis auf 1520 m am Gipfel des Poggio Scali.


      Die Rotbuche dominiert das gesamte Reservat. Im historischen Kern bildet sie Buchen- und Bergmischwälder
      mit der Weißtanne, ergänzt um Ahorne, Ulmen, Linden, Eschen und Eiben. Oberhalb von 1300 m geht der
      Bestand in fast reinen Buchenwald über. Das Klima ist gemäßigt ozeanisch geprägt, mit typischen
      apenninischen Niederschlägen, unregelmäßigem Schneefall im Winter sowie häufigen Nebelbänken und
      tiefhängenden Wolken selbst im Hochsommer.


      Das wertvollste Element liegt am Boden. Stehendes und liegendes Totholz erfüllt eine unersetzliche
      ökologische Funktion, da es Nahrungsnetze speist, die in bewirtschafteten Forsten ausgestorben sind. Die
      Zahlen belegen dies eindrucksvoll: Das Inventar erfasst 554 Arten von Großpilzen, von denen viele an
      stark zersetztes Totholz gebunden sind, sowie 102 Flechtenarten, darunter seltene Baumepiphyten. Unter
      den Pflanzenarten sind zwanzig im Apennin endemisch, darunter *Filipendula ulmaria* subsp. *denudata*,
      *Carex macrolepis* und *Leucopoa dimorpha*.
    wildlife: >-
      Das nationale Tourismusportal nennt für Sasso Fratino [Rothirsch](/especie/cervus_elaphus/), Reh,
      Damhirsch, Wildschwein, Mufflon, [Wolf](/especie/canis_lupus/) und verschiedene Eulenarten. Es sind die
      Bewohner einer Wildnis, die ausnahmslos kein Wanderer aus der Nähe stören darf.


      Die Jahreszeiten prägen vor allem das Klima: unbeständige Schneelagen im Winter, dichte Nebel im Sommer.
      Für Wanderungen entlang der Randwege liegt die beste Jahreszeit zwischen Mai und November.
    visit: >-
      Was du besichtigst, ist nicht das Reservat selbst, sondern seine Außengrenze. Die Schutzgebietsgrenzen
      sind lückenlos beschildert, und die Außenwege dürfen keinesfalls verlassen werden.


      Zwei Hauptrouten führen um das Gebiet herum. Der Rundweg vom Passo Fangacci nach La Lama mit Rückweg
      über den Fosso degli Scalandrini und Abstecher zum Monte Penna umfasst 13 km, erfordert rund fünf
      Stunden und überwindet 800 bis 900 m Höhenunterschied. Die Route vom Passo della Calla zum Poggio Scali
      misst etwa 9 km für Hin- und Rückweg bei 250 m Aufstieg auf dem Hinweg und rund zweiundeinhalb Stunden
      Gehzeit in diese Richtung.


      Um den Wald von außen zu verstehen, unterhält der Park mehrere Informationszentren. In Santa Sofia
      widmet sich das Besucherzentrum den Bergdörfern, der Regionalgeschichte, bewahrt die Studiensammlung des
      Naturforschers Pietro Zangheri und zeigt volkskundliche Exponate von Giorgio Graziani. Badia Prataglia
      beleuchtet traditionelle Holzarbeit und spirituelle Waldbeziehungen, ergänzt durch das Arboretum und das
      Waldmuseum Carlo Siemoni. In Bagno di Romagna thematisiert der Palazzo del Capitano Geologie und
      Thermalquellen. In Campigna dient La villetta als Auskunftsstelle mit Kinosaal nahe dem Waldmuseum Guido
      Campedelli. Camaldoli ergänzt ein ornithologisches Museum mit der Sammlung Biggeri, während der
      Botanische Garten von Valbonella Führungen anbietet. Keine dieser Einrichtungen liegt im Totalreservat.
    history: >-
      Im Jahr 1955 schlug Fabio Clauser, damals Verwalter der Foreste Casentinesi, vor, diesen Bergwald
      vollständig von geplanten Holzeinschlägen an den Nordhängen des Poggio Scali auszunehmen. So begann der
      Schutz. Das Reservat startete mit 113 Hektar, wuchs durch Erweiterungen und wurde 1959 als integrales
      Naturreservat gesetzlich verankert. 1985 zeichnete der Europarat das Gebiet mit dem Europäischen Diplom
      für geschützte Gebiete aus.
    before: >-
      Das Betreten des Reservats ist streng verboten. Der Zugang ins Innere bleibt ausschließlich Forschern
      mit Sondergenehmigung vorbehalten, jeglicher Freizeitsport und Wandertourismus ist untersagt. Du kannst
      jedoch die ausgewiesenen Randwege begehen und die Museen des Nationalparks im Umland besuchen.
    around: >-
      Direkte Nachbarn im Atlas fehlen, doch gibt es verwandte Urwälder mit vergleichbaren Habitaten. Das
      [Strenge Naturreservat Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) teilt Bergulme,
      Spitzahorn und Gemeine Esche. Der [Urwald Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/) weist
      Spitzahorn, Bergahorn und Weißtanne auf. Der [Nationalpark
      Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) deckt sich bei Esche,
      Schwarzspecht und Buche, und der [Urwald Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) teilt
      Weißtanne, Schwarzspecht und Buche.
  it:
    intro: >-
      A Sasso Fratino non si entra. È la regola cardine e la sua stessa ragion d'essere: è una riserva
      integrale, la prima costituita in Italia nel 1959, e il suo interno resta riservato esclusivamente a chi
      svolge attività di ricerca con specifica autorizzazione. Protegge una faggeta con abete bianco lasciata
      libera di crescere, crollare e decomporsi senza alcun riordino forestale. Si estende per 764,25 ettari
      tra i comuni di Bagno di Romagna e Santa Sofia, in Emilia-Romagna, e al suo interno il bosco procede
      secondo i suoi millenari equilibri.
    landscape: >-
      La matrice geologica è una roccia miocenica, la formazione Marnoso Arenacea, caratterizzata
      dall'alternanza di banchi arenacei di vario spessore e strati più sottili di marna. Da questa
      combinazione discende l'orografia: l'azione delle acque dilava le marne più friabili, determinando il
      crollo dei sovrastanti lastroni di arenaria e incidendo forre profonde percorse da torrenti impetuosi.
      La quota spazia dai 650 m del Ponte di Campo alla Sega sino ai 1520 m della cima di Poggio Scali.


      Il faggio domina incontrastato l'intera riserva. Nel nucleo originario compone faggete e consorzi misti
      con l'abete bianco, a cui si associano aceri, olmi, tigli, frassini e tassi. Al di sopra dei 1300 m il
      bosco si trasforma in una faggeta pressoché pura. Il clima è temperato oceanico, caratterizzato da
      regimi piovosi appenninici, nevicate invernali e frequenti formazioni di nebbia e nubi basse anche in
      piena estate.


      Il tesoro primario giace al suolo. Il legno morto, in piedi o a terra, ricopre una funzione ecologica
      insostituibile poiché alimenta reti trofiche scomparse dai boschi coltivati. I dati lo confermano:
      l'inventario naturalistico censisce 554 specie di funghi superiori, molte delle quali vincolate al legno
      marcescente, e 102 specie di licheni, comprese forme epifite su alberi vetusti. Tra le specie
      floristiche, venti sono endemiche dell'Appennino, tra cui spiccano *Filipendula ulmaria* subsp.
      *denudata*, *Carex macrolepis* e *Leucopoa dimorpha*.
    wildlife: >-
      Il portale turistico ufficiale segnala per Sasso Fratino [cervi](/especie/cervus_elaphus/), caprioli,
      daini, cinghiali, mufloni, [lupi](/especie/canis_lupus/) e rapaci notturni. Sono gli abitatori di un
      santuario naturale dove, per statuto, nessun visitatore può inoltrarsi.


      Il mutare delle stagioni si manifesta nel microclima: innevamenti irregolari in inverno, dense nebbie
      d'estate. Per percorrere i crinali perimetrali esterni, i mesi migliori vanno da maggio a novembre.
    visit: >-
      Ciò che visiti non è la riserva, bensì il suo confine. I margini dell'area protetta sono chiaramente
      segnalati da numerosi cartelli, e i sentieri perimetrali non costituiscono in alcun caso una via
      d'accesso all'interno.


      Esistono due tracciati perimetrali. Il circuito dal Passo Fangacci a La Lama, con rientro attraverso il
      fosso degli Scalandrini e deviazione verso Monte Penna, misura 13 km in totale, richiede circa cinque
      ore e supera un dislivello tra 800 e 900 m. Il percorso dal Passo della Calla a Poggio Scali conta circa
      9 km fra andata e ritorno, con 250 m di salita all'andata ed esige circa due ore e mezza in quel senso
      di marcia.


      Per comprendere l'ecosistema dall'esterno, il parco mette a disposizione diversi centri visita. A Santa
      Sofia, la struttura presenta i borghi del comprensorio, illustra la storia del territorio, ospita lo
      studio del naturalista Pietro Zangheri ed espone la raccolta di testimonianze contadine di Giorgio
      Graziani. A Badia Prataglia si approfondiscono le lavorazioni del legno e il rapporto spirituale con la
      foresta, accanto all'arboreto e al Museo Forestale Carlo Siemoni. A Bagno di Romagna, il Palazzo del
      Capitano illustra la geologia e le sorgenti termali. A Campigna, il punto informativo ha sede a La
      villetta, con sala proiezioni, vicino al Museo Forestale Guido Campedelli. A Camaldoli si visita un
      museo ornitologico con la collezione Biggeri, mentre il giardino botanico di Valbonella organizza visite
      guidate. Nessuna struttura sorge all'interno della riserva integrale.
    history: >-
      Nel 1955, allora amministratore delle Foreste Casentinesi, Fabio Clauser propose di preservare il bosco
      a fronte di tagli programmati lungo i versanti settentrionali di Poggio Scali. Da quella determinazione
      ebbe origine la riserva. Il perimetro iniziale contava 113 ettari, crebbe con successivi ampliamenti e
      nel 1959 ottenne lo status di riserva naturale integrale. Nel 1985 il Consiglio d'Europa le ha conferito
      il Diploma Europeo delle Aree Protette.
    before: >-
      Non è consentito entrare nella riserva. L'accesso interno è limitato a chi presenti richiesta per
      comprovati motivi di studio scientifico, e la tutela integrale esclude ogni forma di fruizione
      turistica. All'interno non si svolgono escursioni guidate. Puoi tuttavia percorrere liberamente i
      sentieri perimetrali e accedere ai centri visita nei paesi limitrofi.
    around: >-
      Non vanta aree contigue immediate nell'atlas, ma presenta precise affinità ecologiche con altre foreste
      primarie. La [Riserva Naturale Integrale Havešová](/lugar/narodna-prirodna-rezervacia-havesova/)
      condivide olmo montano, acero riccio e frassino maggiore. Il [Bosco Vergine di
      Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/) presenta acero riccio, acero di monte e abete bianco.
      Il [Parco Nazionale di Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/) coincide
      per frassino, picchio nero e faggio, e la [Foresta Primaria di
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) per abete bianco, picchio nero e faggio.
  pt:
    intro: >-
      Em Sasso Fratino não se entra. Esta é a regra fundamental e a sua própria razão de existir: é uma
      reserva integral, a primeira instituída em Itália em 1959, permanecendo o seu interior vedado a todos
      com exceção de quem comprove propósitos científicos autorizados. O que aqui se protege é um faial
      associado a abeto-falso deixado em livre evolução, com fustes a tombar e a decompor-se sem que qualquer
      intervenção os remova. São 764,25 hectares situados nos municípios de Bagno di Romagna e Santa Sofia, na
      Emília-Romanha, onde a floresta segue o seu ritmo imemorial.
    landscape: >-
      A base geológica assenta na formação miocénica Marnoso Arenacea, uma alternância de camadas de arenito
      de espessura variável com lâminas mais delgadas de margas. Dessa arquitetura decorre o relevo: a água
      dissolve e desgasta as margas tenras, provocando o abatimento das lajes de arenito sobrepostas e
      escavando desfiladeiros agrestes sulcados por torrentes. A altitude estende-se dos 650 m da Ponte di
      Campo alla Sega até aos 1520 m no cume de Poggio Scali.


      A faia domina toda a reserva. No núcleo original desenvolve faiais e matas mistas com o abeto-falso, aos
      quais se associam bordos, olmos, tílias, freixos e teixos. Acima dos 1300 m de altitude a cobertura
      arbórea converte-se num faial quase puro. O clima é temperado oceânico, condicionado por regimes de
      precipitação apenínicos, nevões invernais irregulares e bancos densos de nevoeiro ou nuvens baixas
      persistentes mesmo durante o estio.


      O maior valor ecológico repousa no chão. A madeira morta, de pé ou desfeita no solo, desempenha um papel
      determinante na biodiversidade ao alimentar cadeias tróficas há muito varridas das matas comerciais. Os
      dados confirmam-no: os levantamentos registam 554 espécies de macromicetos, na sua maioria associadas à
      madeira em decomposição, bem como 102 espécies de líquenes, incluindo formas epífitas em árvores
      vetustas. Na flora vascular contam-se vinte endemismos dos Apeninos, entre os quais *Filipendula
      ulmaria* subsp. *denudata*, *Carex macrolepis* e *Leucopoa dimorpha*.
    wildlife: >-
      As fontes oficiais apontam para Sasso Fratino a presença de [veado-vermelho](/especie/cervus_elaphus/),
      corço, gamo, javali, muflão, [lobo](/especie/canis_lupus/) e aves de rapina noturnas. São os povoadores
      de uma floresta onde, por norma rigorosa, nenhum visitante os pode perturbar por dentro.


      As épocas do ano manifestam-se no ambiente: invernos com nevões súbitos e verões orvalhados por
      nevoeiros. Para caminhar ao longo dos trilhos perimétricos, os meses mais recomendáveis vão de maio a
      novembro.
    visit: >-
      Aquilo que visitas não é a reserva em si, mas o seu rebordo exterior. Os limites estão profusamente
      sinalizados com placas de aviso, e a circulação pelos trilhos limítrofes não constitui qualquer
      autorização de entrada.


      Existem dois itinerários exteriores principais. O percurso circular do Passo Fangacci até La Lama,
      regressando pelo fosso degli Scalandrini com subida ao Monte Penna, totaliza 13 km, demora cerca de
      cinco horas e vence entre 800 e 900 m de desnível. O percurso do Passo della Calla ao Poggio Scali tem
      cerca de 9 km entre ida e volta, com 250 m de ascensão na ida, exigindo cerca de duas horas e meia de
      marcha nesse sentido.


      Para conhecer a ecologia do bosque sem o invadir, o parque disponibiliza várias estruturas de apoio. Em
      Santa Sofia, o centro interpreta as comunidades rurais do maciço, reserva uma galeria à história do
      território, acolhe o gabinete do naturalista Pietro Zangheri e exibe o espólio etnográfico de Giorgio
      Graziani. Badia Prataglia aborda as artes tradicionais da madeira e a mística da floresta, ladeada pelo
      arboreto e pelo Museu Florestal Carlo Siemoni. Em Bagno di Romagna, o Palazzo del Capitano dá a conhecer
      a geologia e o termalismo. Em Campigna, o posto de acolhimento ocupa La villetta, com auditório, próximo
      do Museu Florestal Guido Campedelli. Camaldoli acrescenta um museu ornitológico com o espólio Biggeri,
      enquanto o jardim botânico de Valbonella promove visitas guiadas. Nenhum destes centros se situa na
      reserva integral.
    history: >-
      Em 1955, enquanto administrador das Foreste Casentinesi, Fabio Clauser propôs interditar o corte de
      árvores projetado nas encostas setentrionais de Poggio Scali. Assim nasceu o processo de proteção. A
      reserva começou com 113 hectares, expandiu-se sucessivamente e em 1959 obteve reconhecimento formal como
      reserva integral. Em 1985, o Conselho da Europa agraciou-a com o Diploma Europeu de Áreas Protegidas.
    before: >-
      É estritamente proibido transpor os limites da reserva. O ingresso no interior fica restrito a quem o
      requeira para projetos de investigação científica autorizados, estando a visitação turística comum
      formalmente excluída. Deves cingir-te aos trilhos perimétricos exteriores e visitar os polos
      museológicos instalados nas povoações em redor.
    around: >-
      Não possui sítios limítrofes diretos no atlas, mas partilha correspondências biológicas com outras matas
      primárias. A [Reserva Natural Estrita de Havešová](/lugar/narodna-prirodna-rezervacia-havesova/)
      partilha o olmo-da-montanha, o bordo-da-noruega e o freixo-comum. O [Bosque Virgem de
      Lom](/lugar/prasuma-lom-strogi-rezervat-prirode/) congrega o bordo-da-noruega, o bordo-falso e o
      abeto-falso. O [Parque Nacional de Hainich](/lugar/nationalpark-hainich---unesco-weltkulturerbe-urwald/)
      coincide no freixo, no pica-pau-preto e na faia, e o [Bosque Primário de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) no abeto-falso, no pica-pau-preto e na faia.
