resumen:
  es: >-
    El 'pulmón verde de Varsovia', complejo de dunas fósiles cubiertas de pino intercaladas con pantanos de
    aliso.
  en: The 'green lung of Warsaw', a complex of pine-covered inland fossil dunes interwoven with alder swamps.
  fr: >-
    Le « poumon vert de Varsovie », complexe de dunes fossiles couvertes de pins alternant avec des marais
    d'aulnes.
  de: Die „grüne Lunge Warschaus“, ein Komplex kiefernbewachsener Binnendünen im Wechsel mit Erlenbrüchen.
  it: Il 'polmone verde di Varsavia', un complesso di dune fossili coperte di pini alternate a paludi di ontano.
  pt: >-
    O 'pulmão verde de Varsóvia', um complexo de dunas fósseis cobertas de pinheiros intercaladas com pântanos
    de amieiros.
unico:
  es: Las dunas del parque son el mejor conjunto de dunas interiores de Europa, pegadas a una capital.
  en: The dunes of the park form Europe's finest inland dune system, located right beside a national capital.
  fr: >-
    Les dunes du parc constituent le plus bel ensemble de dunes intérieures d'Europe, aux portes d'une
    capitale.
  de: >-
    Die Dünen des Parks bilden Europas besterhaltenen Binnendünenkomplex, direkt neben einer Hauptstadt
    gelegen.
  it: Le dune del parco costituiscono il miglior sistema dunale interno d'Europa, adiacente a una capitale.
  pt: As dunas do parque formam o melhor conjunto de dunas interiores da Europa, contíguas a uma capital.
observaciones:
  es: >-
    Hay que moverse solo por los senderos marcados: salirse puede invadir refugios de los animales. Las dunas
    son muy sensibles al fuego, y el riesgo de incendio es una de las grandes amenazas del parque.
texto:
  es:
    intro: >-
      A un paso del límite oeste de Varsovia, la ciudad se acaba y empieza el pinar. Kampinos es uno de los
      pocos parques nacionales polacos que limitan directamente con la capital, y protege un mosaico de dunas
      interiores, marismas y bosques sobre el antiguo valle del Vístula. Se creó en 1959, pero su historia
      como espacio protegido es anterior: en los años treinta nacieron las primeras reservas del bosque
      (Granica, Sieraków y Zamczysko), gracias a las investigaciones de Roman y Jadwiga Kobendz.
    landscape: >-
      El parque ocupa la Puszcza Kampinoska, en la parte oeste de la depresión de Varsovia. Las dunas del
      antiguo valle del Vístula y las zonas pantanosas son los elementos más característicos del paisaje, y
      sus dunas se consideran el mejor conjunto de dunas interiores de Europa. En Grochalskie Piachy está la
      mayor extensión de dunas de arena de Polonia, y las dunas parabólicas llegan a 30 metros. En la parte
      desnuda de esas dunas crecen carex, clavel cartujano, tomillo de arena, esfagnos y arándano de pantano.


      El bosque más común es el pinar continental fresco. Los pantanos, en cambio, se cubren de vegetación de
      prado, carrizos y matorrales, y de bosques de aliseda y de ribera.
    wildlife: >-
      El símbolo del parque es el [alce](/especie/alces_alces/), devuelto a la naturaleza en 1951, y se puede
      ver casi por todas partes: pinares, bosques, prados, humedales e incluso caminando por los pueblos. No
      hay que acercarse a ellos, acariciarlos ni darles de comer. El [castor](/especie/castor_fiber/) volvió
      en 1980, y el [lince](/especie/lynx_lynx/) en los años 90 del siglo XX, tras 200 años de ausencia.
      También se han asentado los [lobos](/especie/canis_lupus/).


      Entre los demás mamíferos hay [nutria](/especie/lutra_lutra/), marta, zorro, erizo oriental, corzo,
      ciervo, jabalí, tejón y 17 especies de murciélagos. En el valle del Vístula sin regular, con brazos
      muertos, bancos de arena e islas, se mueven especies devueltas a la naturaleza, y entre las aves figuran
      el búho campestre, las cigüeñas [negra](/especie/ciconia_nigra/) y [blanca](/especie/ciconia_ciconia/),
      la [grulla](/especie/grus_grus/), el [guión de codornices](/especie/crex_crex/), el
      [avetoro](/especie/botaurus_stellaris/), el avetorillo, el [martín pescador](/especie/alcedo_atthis/),
      el [carricerín cejudo](/especie/acrocephalus_paludicola/) y el [águila
      pomerana](/especie/aquila_pomarina/). El parque fue reconocido por el Parlamento Europeo como área de
      aves de rango europeo.


      El año marca el ritmo. La primavera y el verano, con el mayor tránsito turístico, coinciden con el
      nacimiento y la cría, cuando los animales más necesitan tranquilidad. De abril a octubre es la temporada
      habitual; en invierno también se puede esquiar.
    visit: >-
      Casi todo está pensado para ir andando o en bici. El parque tiene unos 360 km de senderos señalizados, y
      el Kampinoski Szlak Rowerowy mide 144,5 km; hay más de 200 km de rutas pensadas para ciclistas, con un
      gran circuito y ramales. Entre los senderos de largo recorrido, el Południowy Szlak Leśny mide 53.10
      kilómetros, el Północny Szlak Krawędziowy 40.20 y el Główny Szlak Puszczy Kampinoskiej 55.80. En los
      senderos tienen prioridad los peatones, luego los ciclistas y por último los jinetes.


      Si vienes en bici desde Varsovia, lo mejor es tomar el tren de cercanías hasta Błonie, Sochaczew o Nowy
      Dwór Mazowiecki. Hay 13 claros de descanso con refugios, bancos, papeleras y fogones.


      Para entender el lugar, el centro de Granica, a 40 km de Varsovia, cerca de Żelazowa Wola y
      Niepokalanów, tiene un museo y un museo al aire libre. El Museo de la Puszcza Kampinoska nació en los
      años 60 y en 1990 se convirtió en Centro Didáctico-Museo, con el nombre de Jadwiga y Roman Kobendz;
      reúne objetos y documentos sobre la protección de la naturaleza, la historia de la Puszcza y la vida de
      sus habitantes. En el museo al aire libre hay tres granjas: las de Widymajer, Wiejcka y Połeć. También
      hay un centro educativo en Izabelin.
    history: >-
      En el siglo XVII empezaron a roturarse claros, cultivar la tierra y levantar aldeas en este resto de la
      antigua Puszcza Mazowiecka. Desde finales de los años 70 el parque compra tierras, que se reforestan
      poco a poco, y se limita el poblamiento. En el parque hubo combates insurgentes en 1794 y 1863 y en
      septiembre de 1939 y 1944, y en Palmiry hay un cementerio de polacos fusilados por los alemanes. Las
      zonas de protección estricta suman 22 áreas con 5823 ha, cerca del 15 % del parque.
    before: >-
      Hay que moverse solo por los senderos marcados: salirse puede invadir refugios de los animales. Las
      dunas son muy sensibles al fuego, y el riesgo de incendio es una de las grandes amenazas del parque.
    around: 'En el atlas no hay otros lugares cercanos: Kampinos queda solo, pegado a Varsovia.'
  en:
    intro: >-
      Just steps beyond the western boundary of Warsaw, the urban landscape gives way to pine woodland.
      Kampinos is one of the few national parks in Poland that borders a national capital directly, protecting
      an ancient mosaic of inland dunes, marshlands and forests in the historic Vistula valley. It was
      officially created in 1959, although conservation efforts began earlier: the forest's first strict
      nature reserves (Granica, Sieraków and Zamczysko) were formed in the nineteen-thirties following field
      research by Roman and Jadwiga Kobendza.
    landscape: >-
      The park spans the Puszcza Kampinoska on the western side of the Warsaw Basin. The fossil dunes of the
      old Vistula valley and the accompanying wetland belts form the park's most distinctive scenery, widely
      regarded as Europe's finest inland dune system. At Grochalskie Piachy lies the largest expanse of
      shifting sand dunes in Poland, where parabolic dunes reach heights of up to 30 metres. On open sand
      slopes thrive sand sedge, Carthusian pink, wild thyme, peat mosses and bog bilberries.


      The most widespread forest type is fresh continental pine woodland. In contrast, the low-lying marshes
      are covered by wet meadows, dense reedbeds, sedge beds, wet alder woods and riparian forest.
    wildlife: >-
      The park's flagship species is the [elk](/especie/alces_alces/), successfully reintroduced in 1951, and
      it can be spotted throughout the territory: in pine forests, mixed woodlands, damp meadows, marshes and
      occasionally wandering through surrounding villages. You should never approach, pet or feed them. The
      [beaver](/especie/castor_fiber/) was brought back in 1980, followed by the [lynx](/especie/lynx_lynx/)
      in the 90s of the twentieth century after 200 years of absence. [Wolves](/especie/canis_lupus/) have
      also re-established resident packs.


      Other native mammals include the [otter](/especie/lutra_lutra/), pine marten, red fox, northern
      white-breasted hedgehog, roe deer, red deer, wild boar, badger and 17 species of bats. Along the wild,
      braided Vistula riverbed with its oxbows, sandbars and islets, reintroduced species thrive alongside
      birds such as the short-eared owl, [black](/especie/ciconia_nigra/) and
      [white](/especie/ciconia_ciconia/) storks, the [common crane](/especie/grus_grus/),
      [corncrake](/especie/crex_crex/), [Eurasian bittern](/especie/botaurus_stellaris/), little bittern,
      [common kingfisher](/especie/alcedo_atthis/), [aquatic warbler](/especie/acrocephalus_paludicola/) and
      [lesser spotted eagle](/especie/aquila_pomarina/). The European Parliament designated the park as an
      Important Bird Area of European significance.


      The seasons guide life here. Spring and summer see the greatest visitor numbers, which coincides with
      nesting and breeding when wildlife requires peace. April to October represents the primary season, while
      cross-country skiing is popular during winter months.
    visit: >-
      The park is ideally suited for walking and cycling. There are around 360 km of marked walking trails,
      and the Kampinoski Szlak Rowerowy bicycle trail covers 144.5 km; over 200 km of cycleways feature a main
      circular route with connecting branches. Among the main long-distance paths, the Południowy Szlak Leśny
      extends for 53.10 kilometres, the Północny Szlak Krawędziowy covers 40.20 and the Główny Szlak Puszczy
      Kampinoskiej spans 55.80. On trails, pedestrians have priority, followed by cyclists and horse riders.


      If you arrive by bike from Warsaw, suburban trains to Błonie, Sochaczew or Nowy Dwór Mazowiecki offer
      convenient starting points. There are 13 designated rest clearings equipped with shelters, picnic
      benches, bins and campfire pits.


      To understand the forest heritage, the centre at Granica, located 40 km from Warsaw near Żelazowa Wola
      and Niepokalanów, houses a museum and an open-air architectural park. The Museum of the Kampinos Forest
      opened in the 60s and in 1990 became an Educational Museum Centre named after Jadwiga and Roman
      Kobendza, displaying artefacts on conservation, forest history and local rural culture. The open-air
      museum features three historic farms: Widymajer, Wiejcka and Połeć. Another educational visitor centre
      operates in Izabelin.
    history: >-
      Forest clearings, farming and hamlet settlements expanded in this remaining pocket of the ancestral
      Puszcza Mazowiecka from the XVII century onwards. Since the late 70s, the park administration has bought
      out private land to allow natural regeneration and limit settlement density. The park witnessed fierce
      insurgent battles in 1794 and 1863, and heavy warfare in September 1939 and 1944; at Palmiry lies a
      memorial cemetery for thousands of Poles executed by Nazi forces. The park encompasses 22 strict nature
      reserves totalling 5823 ha, covering roughly 15 % of its area.
    before: >-
      You must keep strictly to marked paths: wandering off trails can disturb sensitive wildlife breeding
      sanctuaries. The sandy pine dunes are extremely susceptible to wildfires, and fire risk constitutes one
      of the greatest dangers facing the park.
    around: 'There are no other nearby places in the atlas: Kampinos stands alone, right next to Warsaw.'
  fr:
    intro: >-
      Aux portes occidentales de Varsovie, la ville cède brusquement la place aux pinèdes. Kampinos est l'un
      des rares parcs nationaux polonais à jouxter directement la capitale, protégeant une mosaïque de dunes
      intérieures, de marais et de forêts sur l'ancien lit de la Vistule. Créé officiellement en 1959, son
      histoire protectrice est plus ancienne : dès les années trente virent le jour les premières réserves
      forestières (Granica, Sieraków et Zamczysko), sous l'impulsion des recherches de Roman et Jadwiga
      Kobendza.
    landscape: >-
      Le parc occupe la Puszcza Kampinoska, dans la partie occidentale de la cuvette de Varsovie. Les dunes
      fossiles de la paléo-vallée de la Vistule et les zones marécageuses composent les traits distinctifs du
      paysage, et ces dunes sont considérées comme le plus remarquable ensemble dunaire continental d'Europe.
      À Grochalskie Piachy se déploie la plus grande étendue de sables dunaires de Pologne, où les dunes
      paraboliques atteignent jusqu'à 30 mètres de hauteur. Sur le sable nu poussent le laîche des sables,
      l'œillet des chartreux, le serpolet, les sphaignes et la canneberge des marais.


      Le peuplement forestier prédominant est la pinède continentale fraîche. Les dépressions marécageuses
      accueillent quant à elles des prairies humides, des roselières denses, des cariçaies ainsi que des
      aulnaies marécageuses et des forêts alluviales.
    wildlife: >-
      L'emblème incontournable du parc est l'[élan](/especie/alces_alces/), réintroduit en 1951, que l'on peut
      croiser un peu partout : pinèdes, sous-bois, prairies humides, marais et parfois même aux abords des
      villages. Il convient de ne pas s'en approcher, de ne pas les caresser et de ne pas les nourrir. Le
      [castor](/especie/castor_fiber/) est réapparu en 1980, et le [lynx](/especie/lynx_lynx/) dans les années
      90 du XXe siècle après 200 ans d'absence. Des meutes de [loups](/especie/canis_lupus/) s'y sont
      également rétablies de façon durable.


      Parmi les autres mammifères figurent la [loutre](/especie/lutra_lutra/), la martre, le renard, le
      hérisson oriental, le chevreuil, le cerf, le sanglier, le blaireau et 17 espèces de chauves-souris. Le
      long du cours sauvage de la Vistule et de ses bras morts et bancs de sable nichent de nombreuses
      espèces, parmi lesquelles le hibou des marais, les cigognes [noire](/especie/ciconia_nigra/) et
      [blanche](/especie/ciconia_ciconia/), la [grue cendrée](/especie/grus_grus/), le [râle des
      genêts](/especie/crex_crex/), le [butor étoilé](/especie/botaurus_stellaris/), le blongios nain, le
      [martin-pêcheur](/especie/alcedo_atthis/), le [phragmite aquatique](/especie/acrocephalus_paludicola/)
      et l'[aigle pomarin](/especie/aquila_pomarina/). Le Parlement européen a classé le site en zone de
      protection aviaire d'intérêt européen.


      Le rythme naturel varie avec l'année. Le printemps et l'été, périodes de plus grande fréquentation,
      coïncident avec la mise bas et l'élevage des jeunes, moments où la faune réclame le plus de
      tranquillité. D'avril à octobre s'étend la saison principale ; en hiver, le ski de fond y est également
      pratiqué.
    visit: >-
      Le parc est remarquablement aménagé pour la randonnée à pied et à vélo. Il compte environ 360 km de
      sentiers balisés, et la boucle cyclable Kampinoski Szlak Rowerowy totalise 144,5 km ; plus de 200 km
      d'itinéraires cyclables sont jalonnés de variantes et liaisons. Parmi les grands sentiers de randonnée,
      le Południowy Szlak Leśny compte 53,10 kilomètres, le Północny Szlak Krawędziowy 40,20 et le Główny
      Szlak Puszczy Kampinoskiej 55,80. Sur les chemins, la priorité revient aux marcheurs, puis aux cyclistes
      et enfin aux cavaliers.


      Si vous arrivez à vélo depuis Varsovie, les trains de banlieue vers Błonie, Sochaczew ou Nowy Dwór
      Mazowiecki constituent d'excellentes portes d'accès. Le parc met à disposition 13 clairières d'accueil
      aménagées avec abris, bancs, poubelles et foyers sécurisés.


      Pour appréhender l'histoire des lieux, le pôle d'accueil de Granica, situé à 40 km de Varsovie près de
      Żelazowa Wola et Niepokalanów, abrite un musée et un écomusée en plein air. Le musée de la forêt de
      Kampinos, fondé dans les années 60 et devenu en 1990 le Centre didactique Jadwiga et Roman Kobendza,
      rassemble des documents et objets d'art populaire sur la sauvegarde de la nature et la vie forestière.
      L'écomusée présente trois fermes traditionnelles : Widymajer, Wiejcka et Połeć. Un autre centre
      pédagogique est implanté à Izabelin.
    history: >-
      Dès le XVIIe siècle, des clairières furent défrichées pour l'agriculture et des hameaux s'implantèrent
      dans cette relique de l'ancienne Puszcza Mazowiecka. Depuis la fin des années 70, le parc rachète
      systématiquement des parcelles privées afin de limiter l'urbanisation et permettre le reboisement
      spontané. Le massif a connu de violents combats insurrectionnels en 1794 et 1863, puis de lourdes
      batailles en septembre 1939 et 1944 ; à Palmiry s'étend la nécropole commémorant les Polonais fusillés
      par l'occupant allemand. Les 22 zones de réserve intégrale totalisent 5823 ha, soit près de 15 % du
      territoire du parc.
    before: >-
      Vous devez circuler exclusivement sur les sentiers balisés : toute sortie de piste risque de perturber
      les zones de repos de la faune. Les dunes sableuses et leurs pinèdes sont très exposées aux incendies,
      qui constituent l'une des menaces majeures pesant sur le parc.
    around: 'Il n''y a pas d''autres sites proches dans l''atlas : Kampinos s''élève seul, aux portes de Varsovie.'
  de:
    intro: >-
      Nur wenige Schritte hinter der westlichen Stadtgrenze Warschaus endet der urbane Raum und geht in
      Kiefernwälder über. Kampinos ist einer der wenigen polnischen Nationalparks, die direkt an die
      Landeshauptstadt grenzen; er schützt ein Mosaik aus Binnendünen, Mooren und Urwäldern im Urstromtal der
      Weichsel. Er wurde 1959 gegründet, doch seine Geschichte als Schutzgebiet reicht weiter zurück: In den
      dreißiger Jahren entstanden dank der Forschungen von Roman und Jadwiga Kobendza die ersten Waldreservate
      (Granica, Sieraków und Zamczysko).
    landscape: >-
      Der Park erstreckt sich über die Puszcza Kampinoska im westlichen Teil des Warschauer Beckens. Die
      fossilen Dünen des alten Weichseltals und die feuchten Niederungen bilden die charakteristischsten
      Landschaftselemente; diese Binnendünen gelten als das besterhaltene Binnendünensystem Europas. Bei
      Grochalskie Piachy liegt Polens größtes Flugsanddünenfeld, dessen Parabeldünen Höhen von bis zu 30
      Metern erreichen. Auf dem offenen Sand wachsen Sand-Segge, Kartäusernelke, Sand-Thymian, Torfmoose und
      Moorbeeren.


      Der vorherrschende Waldtyp ist der frische kontinentale Kiefernwald. In den Senken gedeihen dagegen
      Nasswiesen, dichtes Röhricht, Großseggenriede sowie Erlenbrüche und Hartholz-Auenwälder.
    wildlife: >-
      Das Wappentier des Parks ist der [Elch](/especie/alces_alces/), der 1951 erfolgreich wieder angesiedelt
      wurde und heute fast überall anzutreffen ist: in Kiefernforsten, Mischwäldern, Feuchtwiesen, Sümpfen und
      bisweilen sogar am Rand von Dörfern. Du solltest dich ihnen keinesfalls nähern, sie nicht streicheln und
      nicht füttern. Der [Biber](/especie/castor_fiber/) kehrte 1980 zurück, der [Luchs](/especie/lynx_lynx/)
      in den 90er Jahren des zwanzigsten Jahrhunderts nach 200 Jahren Abwesenheit. Auch
      [Wölfe](/especie/canis_lupus/) haben wieder feste Reviere gegründet.


      Unter den übrigen Säugetieren leben hier [Fischotter](/especie/lutra_lutra/), Baummarder, Rotfuchs,
      Ostigel, Reh, Rothirsch, Wildschwein, Dachs und 17 Fledermausarten. Im naturnahen Weichseltal mit seinen
      Altwassern, Sandbänken und Inseln finden wiederangesiedelte Arten ideale Nischen; zur Vogelwelt zählen
      die Sumpfohreule, [Schwarz-](/especie/ciconia_nigra/) und [Weißstorch](/especie/ciconia_ciconia/),
      [Kranich](/especie/grus_grus/), [Wachtelkönig](/especie/crex_crex/),
      [Rohrdommel](/especie/botaurus_stellaris/), Zwergdommel, [Eisvogel](/especie/alcedo_atthis/),
      [Seggenrohrsänger](/especie/acrocephalus_paludicola/) und [Schreiadler](/especie/aquila_pomarina/). Das
      Europäische Parlament hat den Park als Vogelschutzgebiet von europäischer Bedeutung anerkannt.


      Das Jahr bestimmt den Takt. Frühling und Sommer mit dem höchsten Besucheraufkommen fallen mit der Brut-
      und Setzzeit zusammen, in der die Tiere besondere Ruhe brauchen. Von April bis Oktober dauert die
      Hauptsaison; im Winter kann man hier Skilanglauf betreiben.
    visit: >-
      Der Park ist hervorragend zu Fuß und per Fahrrad erlebbar. Es gibt rund 360 km markierte Wanderwege, und
      der Radweg Kampinoski Szlak Rowerowy misst 144,5 km; über 200 km Radrouten sind als großer Rundkurs mit
      Stichwegen angelegt. Unter den Hauptwanderwegen misst der Południowy Szlak Leśny 53,10 Kilometer, der
      Północny Szlak Krawędziowy 40,20 und der Główny Szlak Puszczy Kampinoskiej 55,80. Auf den Wegen haben
      Fußgänger stets Vorrang, gefolgt von Radfahrern und Reitern.


      Wenn du von Warschau aus mit dem Rad anreist, bieten sich Vorortzüge nach Błonie, Sochaczew oder Nowy
      Dwór Mazowiecki an. Es gibt 13 Rastplätze mit Unterständen, Bänken, Mülleimern und befestigten
      Feuerstellen.


      Um die Geschichte zu verstehen, bietet das Zentrum in Granica, 40 km von Warschau nahe Żelazowa Wola und
      Niepokalanów, ein Museum sowie ein Freilichtmuseum. Das in den 60er Jahren gegründete Museum der
      Kampinos-Heide wurde 1990 zum Jadwiga-und-Roman-Kobendza-Zentrum ausgebaut; es zeigt historische
      Dokumente und volkskundliche Exponate. Im Freilichtmuseum sind drei historische Gehöfte erhalten:
      Widymajer, Wiejcka und Połeć. Ein weiteres Bildungszentrum befindet sich in Izabelin.
    history: >-
      Seit dem XVII. Jahrhundert wurden in diesem Rest der einstigen Puszcza Mazowiecka Lichtungen gerodet,
      Landwirtschaft betrieben und Weiler gegründet. Seit den späten 70er Jahren kauft die Parkverwaltung
      systematisch Privatland auf, um Siedlungsdruck zu mindern und Flächen aufzuforsten. Im Park fanden 1794
      und 1863 Aufstandskämpfe sowie im September 1939 und 1944 schwere Gefechte statt; in Palmiry erinnert
      ein Ehrenfriedhof an hunderte von deutschen Truppen ermordete Polen. Die 22 Kernschutzzonen umfassen
      5823 ha, was etwa 15 % der Gesamtfläche des Parks entspricht.
    before: >-
      Bleib unbedingt auf den ausgeschilderten Wegen: Ein Verlassen der Pfade stört empfindliche Rückzugsräume
      der Tierwelt. Die sandigen Dünenwälder sind extrem feuergefährdet, und Waldbrände stellen eine der
      größten Gefahren für das Schutzgebiet dar.
    around: >-
      Im Atlas finden sich keine weiteren Orte in unmittelbarer Nähe: Kampinos steht für sich allein, direkt
      vor den Toren Warschaus.
  it:
    intro: >-
      A pochi passi dal confine occidentale di Varsavia la città si interrompe per lasciare spazio alla
      pineta. Kampinos è uno dei rari parchi nazionali polacchi che confinano direttamente con la capitale,
      proteggendo un mosaico di dune interne, acquitrini e foreste nell'antica valle della Vistola. Venne
      istituito nel 1959, ma la sua tutela è precedente: negli anni trenta nacquero le prime riserve della
      foresta (Granica, Sieraków e Zamczysko), grazie agli studi botanici di Roman e Jadwiga Kobendza.
    landscape: >-
      Il parco occupa la Puszcza Kampinoska nella parte occidentale della depressione di Varsavia. Le dune
      dell'antica valle fluviale e le cinture paludose costituiscono i tratti salienti del paesaggio,
      considerate il miglior complesso dunale continentale d'Europa. A Grochalskie Piachy si estende il più
      vasto campo di dune sabbiose della Polonia, con dune paraboliche che raggiungono i 30 metri di altezza.
      Sulla sabbia nuda crescono carici, garofani dei certosini, timo serpillo, sfagni e mirtilli di palude.


      La foresta più comune è la pineta continentale fresca. Le depressioni paludose, al contrario, sono
      occupate da prati umidi, canneti impenetrabili e boschi alluvionali di ontano nero.
    wildlife: >-
      Il simbolo indiscusso del parco è l'[alce](/especie/alces_alces/), reintrodotto nel 1951 e osservabile
      ovunque: pinete, radure, prati umidi, acquitrini e talvolta nei pressi dei centri abitati. Non bisogna
      avvicinarsi, accarezzarli né dar loro da mangiare. Il [castoro](/especie/castor_fiber/) è ritornato nel
      1980 e la [lince](/especie/lynx_lynx/) negli anni 90 del Novecento dopo 200 anni di assenza. Anche i
      [lupi](/especie/canis_lupus/) hanno formato branchi stabili.


      Tra gli altri mammiferi figurano la [lontra](/especie/lutra_lutra/), la martora, la volpe, il riccio
      orientale, il capriolo, il cervo, il cinghiale, il tasso e 17 specie di pipistrelli. Lungo il corso
      naturale della Vistola, con i suoi meandri abbandonati e banchi di sabbia, prosperano le specie
      reintrodotte; tra gli uccelli nidificano il gufo di palude, la cicogna [nera](/especie/ciconia_nigra/) e
      la cicogna [bianca](/especie/ciconia_ciconia/), la [gru](/especie/grus_grus/), il [re di
      quaglie](/especie/crex_crex/), il [tarabuso](/especie/botaurus_stellaris/), il tarabusino, il [martin
      pescatore](/especie/alcedo_atthis/), il [pagliarolo](/especie/acrocephalus_paludicola/) e l'[aquila
      anatraia minore](/especie/aquila_pomarina/). Il Parlamento Europeo ha riconosciuto l'area come zona di
      protezione speciale di rango europeo.


      Le stagioni scandiscono i ritmi naturali. La primavera e l'estate, coincidenti con il massimo flusso di
      visitatori, corrispondono alla riproduzione, quando gli animali richiedono maggiore serenità. Da aprile
      a ottobre dura la stagione classica; in inverno si pratica lo sci di fondo.
    visit: >-
      Quasi tutto il parco è concepito per essere esplorato a piedi o in bicicletta. Dispone di circa 360 km
      di sentieri segnati, e la pista ciclabile Kampinoski Szlak Rowerowy misura 144,5 km; vi sono oltre 200
      km di percorsi ciclabili strutturati in un anello principale con diramazioni. Tra i sentieri a lungo
      percorso, il Południowy Szlak Leśny misura 53,10 chilometri, il Północny Szlak Krawędziowy 40,20 e il
      Główny Szlak Puszczy Kampinoskiej 55,80. Lungo i sentieri i pedoni godono di precedenza assoluta,
      seguiti da ciclisti e cavalieri.


      Se arrivi in bici da Varsavia, i treni locali per Błonie, Sochaczew o Nowy Dwór Mazowiecki offrono
      ottimi punti di partenza. Ci sono 13 radure attrezzate con tettoie, panche, cestini e aree barbecue
      protette.


      Per approfondire la conoscenza del parco, il centro di Granica, a 40 km da Varsavia vicino a Żelazowa
      Wola e Niepokalanów, ospita un museo e un parco etnografico all'aperto. Il Museo della Puszcza
      Kampinoska è nato negli anni 60 e nel 1990 è divenuto Centro Didattico intitolato a Jadwiga e Roman
      Kobendza, raccogliendo testimonianze sulla tutela della natura e sulla vita locale. Il museo all'aperto
      comprende tre fattorie storiche: Widymajer, Wiejcka e Połeć. Un altro polo didattico si trova a
      Izabelin.
    history: >-
      A partire dal XVII secolo si aprirono radure coltivate e si fondarono villaggi in questo frammento
      superstite dell'antica Puszcza Mazowiecka. Dalla fine degli anni 70 l'ente parco riacquista terreni
      privati per riforestarli gradualmente e limitare l'urbanizzazione. Il parco fu teatro di battaglie
      insurrezionali nel 1794 e nel 1863, nonché di scontri violenti nel settembre 1939 e nel 1944; a Palmiry
      sorge il cimitero monumentale delle vittime polacche fucilate dalle truppe tedesche. Le zone a
      protezione integrale comprendono 22 aree per complessivi 5823 ha, circa il 15 % del parco.
    before: >-
      Muoviti esclusivamente lungo i sentieri tracciati: abbandonarli rischia di disturbare i rifugi della
      fauna. Le dune sabbiose e i boschi di pino sono vulnerabili al fuoco, e il pericolo di incendio
      rappresenta una delle minacce più gravi per il parco.
    around: 'Nell''atlante non compaiono altri luoghi vicini: Kampinos sorge isolato, proprio alle porte di Varsavia.'
  pt:
    intro: >-
      A escassos passos do limite ocidental de Varsóvia, a malha urbana termina e dá lugar ao pinhal. Kampinos
      é um dos raros parques nacionais polacos contíguos à capital do país, salvaguardando um mosaico de dunas
      interiores, pauis e florestas no antigo vale do Vístula. Foi criado em 1959, embora a sua proteção venha
      de trás: nos anos trinta nasceram as primeiras reservas florestais (Granica, Sieraków e Zamczysko), na
      sequência dos estudos de Roman e Jadwiga Kobendza.
    landscape: >-
      O parque ocupa a Puszcza Kampinoska, no setor oeste da depressão de Varsóvia. As dunas fósseis do antigo
      vale fluvial e as zonas pantanosas constituem os elementos mais marcantes da paisagem, sendo
      reconhecidas como o mais representativo conjunto de dunas continentais da Europa. Em Grochalskie Piachy
      localiza-se o maior campo de dunas de areia da Polónia, com dunas parabólicas que atingem 30 metros de
      altura. Na areia nua vegetam o carriço-das-areias, o cravo-dos-cartuxos, o tomilho-rasteiro, esfagno e
      mirtilo-dos-pauis.


      A floresta predominante é o pinhal continental fresco. Por oposição, as depressões pantanosas cobrem-se
      de prados húmidos, caniçais densos, juncais e florestas ribeirinhas de amieiro.
    wildlife: >-
      O símbolo do parque é o [alce](/especie/alces_alces/), reintroduzido em 1951, que pode ser avistado por
      todo o lado: pinhais, clareiras, prados húmidos, pauis e ocasionalmente junto a aldeias vizinhas. Não
      deves aproximar-te, acariciá-los nem dar-lhes comida. O [castor](/especie/castor_fiber/) regressou em
      1980 e o [lince](/especie/lynx_lynx/) na década de 90 do século XX, após 200 anos de ausência. Também os
      [lobos](/especie/canis_lupus/) restabeleceram alcateias residentes.


      Entre os restantes mamíferos encontram-se a [lontra](/especie/lutra_lutra/), a marta, a raposa, o
      ouriço-oriental, o corço, o veado-vermelho, o javali, o texugo e 17 espécies de morcegos. No leito
      natural do Vístula, com meandros abandonados, bancos de areia e ilhotas, movem-se espécies
      reintroduzidas; nas aves destacam-se o bufo-pequeno, as cegonhas-[preta](/especie/ciconia_nigra/) e
      [branca](/especie/ciconia_ciconia/), o [grou-comum](/especie/grus_grus/), o
      [codornizão](/especie/crex_crex/), o [abicaravão](/especie/botaurus_stellaris/), o garçote, o
      [guarda-rios](/especie/alcedo_atthis/), a [felosa-aquática](/especie/acrocephalus_paludicola/) e a
      [águia-pomerana](/especie/aquila_pomarina/). O Parlamento Europeu reconheceu o parque como área
      avifaunística de relevância comunitária.


      As estações marcam o ritmo biológico. A primavera e o verão, com maior afluência de visitantes,
      coincidem com a época de reprodução e criação, quando os animais mais necessitam de sossego. De abril a
      outubro decorre a época habitual; no inverno também é possível praticar esqui de fundo.
    visit: >-
      Quase tudo no parque está pensado para deslocações a pé ou de bicicleta. A rede soma cerca de 360 km de
      trilhos pedestres sinalizados, e a ciclovia Kampinoski Szlak Rowerowy atinge 144,5 km; existem mais de
      200 km de circuitos cicláveis com percursos circulares e ramais de ligação. Entre os trilhos de longo
      curso, o Południowy Szlak Leśny tem 53,10 quilómetros, o Północny Szlak Krawędziowy 40,20 e o Główny
      Szlak Puszczy Kampinoskiej 55,80. Nos trilhos os peões têm prioridade absoluta, seguidos pelos ciclistas
      e pelos cavaleiros.


      Se vieres de bicicleta a partir de Varsóvia, os comboios suburbanos para Błonie, Sochaczew ou Nowy Dwór
      Mazowiecki constituem excelentes pontos de partida. O parque dispõe de 13 clareiras de descanso
      equipadas com abrigos, bancos, caixotes de lixo e fogueiras seguras.


      Para conhecer o património do parque, o polo de Granica, a 40 km de Varsóvia, perto de Żelazowa Wola e
      Niepokalanów, dispõe de um museu e de um núcleo etnográfico ao ar livre. O Museu da Puszcza Kampinoska
      surgiu nos anos 60 e em 1990 transformou-se no Centro Didático-Museu Jadwiga e Roman Kobendza, expondo
      acervos sobre a preservação da natureza e a história rural da floresta. O núcleo museológico ao ar livre
      reúne três quintas rurais históricas: Widymajer, Wiejcka e Połeć. Há ainda outro centro pedagógico em
      Izabelin.
    history: >-
      A partir do século XVII iniciou-se a abertura de clareiras, o cultivo agrícola e a fundação de aldeias
      neste vestígio da ancestral Puszcza Mazowiecka. A partir do final dos anos 70, o parque começou a
      adquirir propriedades privadas para reflorestação e contenção do povoamento. O território foi palco de
      confrontos durante as revoltas de 1794 e 1863, bem como de combates em setembro de 1939 e em 1944; em
      Palmiry ergue-se o cemitério memorial dos polacos fuzilados durante a ocupação alemã. As 22 áreas de
      proteção estrita totalizam 5823 ha, cerca de 15 % do parque.
    before: >-
      Deves circular unicamente pelos trilhos assinalados: sair dos percursos oficiais pode invadir os
      refúgios da fauna selvagem. As dunas e os pinhais secos são altamente vulneráveis ao fogo, constituindo
      o risco de incêndio uma das principais ameaças ao parque.
    around: 'No atlas não figuram outros lugares próximos: Kampinos surge isolado, encostado a Varsóvia.'
