resumen:
  es: >-
    Uno de los últimos ríos de llanura verdaderamente salvajes y dinámicos de Europa sin encauzamiento
    artificial.
  en: One of Western Europe’s last truly wild, free-flowing lowland rivers without artificial embankments.
  fr: >-
    L’une des dernières rivières de plaine véritablement sauvages et dynamiques d’Europe occidentale, sans
    digues artificielles.
  de: >-
    Einer der letzten wahrhaft wilden, dynamischen Tieflandflüsse Westeuropas ohne künstliche
    Uferbefestigungen.
  it: >-
    Uno degli ultimi fiumi di pianura autenticamente selvaggi e dinamici d’Europa, privo di arginature
    artificiali.
  pt: >-
    Um dos últimos rios de planície verdadeiramente selvagens e dinâmicos da Europa ocidental, sem
    regularização artificial.
unico:
  es: >-
    Un río que cambia de cauce cada vez que quiere y que, al hacerlo, fabrica bancos de grava, brazos muertos,
    praderas y bosques de ribera donde anidan más de cien especies de aves.
  en: >-
    A river that shifts course whenever it pleases, endlessly reshaping gravel bars, oxbows, wet meadows, and
    riparian woods where over a hundred bird species nest.
  fr: >-
    Une rivière qui change de lit au gré de ses crues, façonnant bancs de graviers, bras morts, prairies et
    forêts alluviales où nichent plus de cent espèces d’oiseaux.
  de: >-
    Ein Fluss, der sein Bett nach Belieben verlegt und dabei Kiesbänke, Altarme, Feuchtwiesen und Auwälder
    formt, in denen über hundert Vogelarten brüten.
  it: >-
    Un fiume che muta alveo a ogni piena, modellando banchi di ghiaia, lanche, prati umidi e boschi golenali
    dove nidificano oltre cento specie di uccelli.
  pt: >-
    Um rio que muda de leito sempre que deseja, remodelando bancos de cascalho, braços mortos, prados e
    bosques ripícolas onde nidificam mais de cem espécies de aves.
observaciones:
  es: >-
    En Les Perrons (Chemilly), el acceso puede cerrarse durante las obras de retirada del vertedero. Los
    senderos no son accesibles a personas con movilidad reducida ni a cochecitos, y según las crecidas algunos
