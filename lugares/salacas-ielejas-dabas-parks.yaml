resumen:
  es: >-
    Río salmonero de aguas puras flanqueado por acantilados de arenisca roja en la Reserva de la Biosfera del
    Norte de Vidzeme.
  en: Pristine salmon river flanked by red sandstone cliffs in the North Vidzeme Biosphere Reserve.
  fr: >-
    Rivière à saumons aux eaux pures flanquée de falaises de grès rouge dans la réserve de biosphère de
    Vidzeme septentrionale.
  de: Reiner Lachsfluss, gesäumt von roten Sandsteinfelsen im Biosphärenreservat Nord-Vidzeme.
  it: >-
    Fiume da salmoni dalle acque purissime affiancato da falesie di arenaria rossa nella Riserva della
    Biosfera di Vidzeme Settentrionale.
  pt: >-
    Rio de salmões de águas puríssimas ladeado por falésias de arenito vermelho na Reserva da Biosfera do
    Norte de Vidzeme.
unico:
  es: Aquí la arenisca roja y la corriente de un río de salmones se asoman a la vez a la misma orilla.
  en: Here red sandstone outcrops and the flow of a prime salmon river border the very same banks.
  fr: >-
    Ici, les falaises de grès rouge et les courants d'une grande rivière à saumons se côtoient sur une même
    rive.
  de: >-
    Hier treffen roter Sandstein und die Strömung eines bedeutenden Lachsflusses unmittelbar an denselben
    Ufern zusammen.
  it: Qui l'arenaria rossa e la corrente di un celebre fiume da salmoni si affiancano lungo la medesima riva.
  pt: Aqui o arenito vermelho e a correnteza de um rio afamado de salmões encontram-se ao longo da mesma margem.
observaciones:
  es: >-
    En los Acantilados Rojos, las cuevas solo se alcanzan desde el río. Comprueba antes de ir si la senda de
    Skaņākalns está abierta, porque no lo está todo el año, y consulta la normativa de uso del valle.
texto:
  es:
    intro: >-
      Un río que baja entre paredes rojas. Eso es el Salaca en el norte de Letonia: durante el tramo que va de
      Mazsalaca a Salacgrīva, la corriente ha tallado en la arenisca devónica acantilados, cuevas y rápidos, y
      el parque natural protege ese valle entero. Forma parte de la Reserva de la Biosfera del Norte de
      Vidzeme y de la red Natura 2000, y el propio gestor dice que se disfruta mejor desde el agua.
    landscape: >-
      El valle del Salaca es sobre todo una colección de rocas. El gestor cita los Acantilados Rojos de
      Pietraga, las cuevas de Daugēni, Neļķi, Silmači y Bezdelīgas. Cada uno tiene su carácter.


      Los Acantilados Rojos son un afloramiento de arenisca de más de 400 m de largo y unos 10 m de alto, con
      cinco salientes, o cuernos, de los que Pietrags es el que más destaca. En la pared se abren pequeñas
      cuevas y grutas poco profundas, y solo se llega a ellas desde el río. Los de Neļķi son más altos: 18 m y
      casi 200 m de largo, los mayores de las orillas del Salaca. Aguas abajo de Staicele está la cueva de
      Vīksna, una de las más largas del valle. Y en la cueva de los Ángeles, un arco de roca recuerda a las
      alas de un ángel.


      No todo es piedra desnuda. El parque protege también bosques de ladera, manantiales, rápidos y praderas
      secas sobre suelo calcáreo, hábitats de interés europeo. En total se conocen 22 tipos de hábitat.
    wildlife: >-
      La vida más reconocible del Salaca está debajo de la superficie. En el tramo alto, entre Staicele y
      Mazsalaca, se han detectado cerca de veinticuatro especies de peces, y el río y sus afluentes son
      importantes para el [salmón](/especie/salmo_salar/), la [trucha de mar](/especie/salmo_trutta/) y la
      vimba. El gestor lo resume así: es el cuarto río salmonero más importante de la región del Báltico.


      El calendario del río se ve en los jóvenes salmones. La migración de los esmolts hacia el mar se ha
      adelantado en el año, es más corta y más intensa, y hoy la dominan peces de un año. La producción de
      esmolts, sobre todo de trucha marina, ha subido respecto a los años sesenta.


      En total se conocen 92 especies protegidas en el parque. La mejor época para recorrerlo va de mayo a
      octubre.
    visit: >-
      El gestor lo dice claro: los afloramientos y las cuevas, a lo largo de todo el río, se disfrutan mejor
      navegando. En barca se pasa por los tramos que el gestor señala: Mazsalaca–Staicele, Staicele–Mērnieki y
      Mērnieki–Salacgrīva.


      A pie, lo mejor está en torno a Mazsalaca. Las sendas de Skaņākalns salen junto a la mansión de
      Valtenbergi, en Mazsalaca, y siguen la orilla hasta el cerro Skaņākalns, que produce el mayor eco de
      Letonia. La de Skaņākalns mide 2,7 km. La senda de Dauģēni la continúa, con puentes, pasarelas y
      escaleras, y pasa por los rápidos de Ģendertu, los acantilados de Dauģēni y, en la orilla de enfrente,
      la roca de Silmači. Un extremo está en el área de descanso frente a Skaņākalns; el otro, en la
      desembocadura del Ramata.


      Para ir más despacio, hay un juego de foto-orientación con 20 puntos de control en Mazsalaca y en el
      parque natural de Skaņākalns. Enseña los valores naturales de las aguas dulces, los bosques, las
      praderas, las cuevas y los afloramientos.
    history: >-
      El parque se creó en 1977. Es uno de los espacios Natura 2000 de Letonia. En el patrimonio cultural, el
      museo livonio Pivalind, en Staicele, estudia la relación de la zona con el antiguo territorio livonio de
      Metsepole. El río da nombre a un dialecto del livonio, hoy extinto, que se hablaba en sus orillas altas
      hasta el siglo XIX.
    before: >-
      En los Acantilados Rojos, las cuevas solo se alcanzan desde el río. Comprueba antes de ir si la senda de
      Skaņākalns está abierta, porque no lo está todo el año, y consulta la normativa de uso del valle.
    around: >-
      El [Parque Nacional de Wild Nephin](/lugar/wild-nephin-national-park/) comparte con el valle del Salaca
      el salmón del Atlántico y la nutria. Y el [Valle del Venta y Cascada Ventas
      Rumba](/lugar/ventas-ieleja---ventas-rumba/), también en Letonia, es otro corredor fluvial que comparte
      con el Salaca el salmón.
  en:
    intro: >-
      A river flowing between red walls. That is the Salaca in northern Latvia: along the stretch from
      Mazsalaca to Salacgrīva, the current has carved cliffs, caves and rapids into Devonian sandstone, and
      the nature park protects that entire river valley. It forms part of the North Vidzeme Biosphere Reserve
      and the Natura 2000 network, and the park authority notes that it is best experienced from the water.
    landscape: >-
      The Salaca valley is primarily a gallery of rocks. The managing authority highlights the Red Cliffs of
      Pietraga and the caves of Daugēni, Neļķi, Silmači and Bezdelīgas, each with its own character.


      The Red Cliffs are a sandstone outcrop extending over 400 m in length and about 10 m in height, with
      five prominent projections of which Pietrags is the most striking. Shallow caves and niches indent the
      wall, accessible exclusively from the river. The Neļķi cliffs rise higher: 18 m tall and nearly 200 m
      long, the grandest along the Salaca banks. Downstream of Staicele lies Vīksna Cave, among the longest in
      the valley. In the Cave of Angels, a rock arch evokes the wings of an angel.


      Yet it is not merely bare rock. The park also shelters slope forests, springs, rapids and dry calcareous
      grasslands, which are habitats of European significance. In total, 22 habitat types are documented.
    wildlife: >-
      The most celebrated life in the Salaca thrives beneath the surface. In the upper reach between Staicele
      and Mazsalaca, close to twenty-four fish species have been recorded, and the main river and tributaries
      are critical for [Atlantic salmon](/especie/salmo_salar/), [sea trout](/especie/salmo_trutta/) and vimba
      bream. The park authority summarizes it plainly: it is the fourth most important salmon river in the
      Baltic Sea region.


      The river's calendar is written in juvenile salmon. Smolts now migrate toward the sea earlier in the
      year in shorter, more concentrated runs dominated by one-year-old fish. Smolt output, especially for sea
      trout, has increased compared to the nineteen-sixties.


      A total of 92 protected species are recorded in the park. The ideal period for exploration extends from
      May to October.
    visit: >-
      The park authority makes it clear: the sandstone outcrops and caves along the full length of the river
      are best appreciated by boat. Paddlers travel the classic sections identified by managers:
      Mazsalaca–Staicele, Staicele–Mērnieki and Mērnieki–Salacgrīva.


      On foot, the premier trails cluster around Mazsalaca. The Skaņākalns paths start near Valtenbergi Manor
      in Mazsalaca, following the bank to Skaņākalns cliff, which generates Latvia's loudest natural echo. The
      Skaņākalns trail measures 2.7 km. The Dauģēni trail continues onward with footbridges, boardwalks and
      wooden steps, passing Ģendertu rapids, Dauģēni cliffs and, on the opposite shore, Silmači rock. One
      trailhead lies at the rest area facing Skaņākalns; the other at the confluence with the Ramata River.


      For a slower pace, a photo-orienteering game features 20 control points across Mazsalaca and the
      Skaņākalns natural park, showcasing the natural values of freshwater streams, forests, grasslands, caves
      and rocky outcrops.
    history: >-
      The park was founded in 1977. It is one of Latvia's designated Natura 2000 areas. In cultural heritage,
      the Livonian museum Pivalind in Staicele explores the region's historical connection to the ancient
      Livonian land of Metsepole. The river lent its name to the Salaca Livonian dialect, now extinct, spoken
      along its upper reaches until the nineteenth century.
    before: >-
      At the Red Cliffs, caves are accessible only from the water. Verify before setting out whether the
      Skaņākalns trail is open, as it does not operate year-round, and consult valley usage regulations.
    around: >-
      [Wild Nephin National Park](/lugar/wild-nephin-national-park/) shares Atlantic salmon and otter with the
      Salaca valley. And the [Venta Valley and Ventas Rumba Waterfall](/lugar/ventas-ieleja---ventas-rumba/),
      also in Latvia, is another river corridor sharing salmon with the Salaca.
  fr:
    intro: >-
      Une rivière descendant entre des parois rouges. Telle est la Salaca dans le nord de la Lettonie : sur le
      tronçon reliant Mazsalaca à Salacgrīva, le courant a sculpté dans le grès dévonien des falaises, grottes
      et rapides, et le parc naturel protège l'ensemble de cette vallée. Il s'intègre dans la Réserve de
      biosphère de Vidzeme septentrionale et le réseau Natura 2000, le gestionnaire soulignant qu'il
      s'apprécie au mieux depuis l'eau.
    landscape: >-
      La vallée de la Salaca forme avant tout une suite remarquable d'affleurements rocheux. L'organisme de
      gestion met en avant les Falaises Rouges de Pietraga et les grottes de Daugēni, Neļķi, Silmači et
      Bezdelīgas, chacune dotée de sa personnalité propre.


      Les Falaises Rouges forment une muraille de grès de plus de 400 m de long sur environ 10 m de hauteur,
      rythmée par cinq éperons dont Pietrags est le plus spectaculaire. De petites cavités et grottes peu
      profondes perforent la roche, accessibles uniquement depuis l'eau. Les falaises de Neļķi sont plus
      hautes : 18 m d'élévation sur près de 200 m de développement, les plus imposantes le long de la Salaca.
      En aval de Staicele s'ouvre la grotte de Vīksna, parmi les plus longues de la vallée. Dans la grotte des
      Anges, une arcade rocheuse évoque des ailes d'ange déployées.


      Il ne s'agit pas que de roche nue. Le parc préserve également des forêts de versant, des sources, des
      rapides et des pelouses sèches sur calcaire, habitats d'intérêt communautaire. Au total, 22 types
      d'habitats y sont recensés.
    wildlife: >-
      La vie la plus célèbre de la Salaca s'épanouit sous la surface. Dans la section amont, entre Staicele et
      Mazsalaca, près de vingt-quatre espèces de poissons ont été observées, la rivière et ses affluents étant
      vitaux pour le [saumon atlantique](/especie/salmo_salar/), la [truite de mer](/especie/salmo_trutta/) et
      la vimbe. Le gestionnaire le résume ainsi : c'est la quatrième rivière à saumons la plus importante du
      bassin de la mer Baltique.


      Le rythme saisonnier se lit chez les jeunes saumons. La dévalaison des smolts vers la mer s'est avancée
      dans l'année, devenant plus courte et intense, dominée par des poissons d'un an. La production de
      smolts, en particulier pour la truite de mer, a progressé par rapport aux années soixante.


      Au total, 92 espèces protégées sont répertoriées dans le parc. La saison optimale de visite va de mai à
      octobre.
    visit: >-
      Le gestionnaire l'affirme nettement : les affleurements et les cavités tout au long de la rivière se
      découvrent au mieux en barque ou canoë. En bateau, on parcourt les tronçons classiques balisés :
      Mazsalaca–Staicele, Staicele–Mērnieki et Mērnieki–Salacgrīva.


      À pied, les plus beaux aménagements se situent autour de Mazsalaca. Les sentiers de Skaņākalns partent
      du manoir de Valtenbergi à Mazsalaca et suivent la rive jusqu'à la falaise de Skaņākalns, qui produit le
      plus puissant écho naturel de Lettonie. Le sentier de Skaņākalns mesure 2,7 km. Le sentier de Dauģēni le
      prolonge avec passerelles, ponts et escaliers de bois, longeant les rapides de Ģendertu, les falaises de
      Dauģēni et, sur la rive opposée, le rocher de Silmači. Une extrémité se trouve sur l'aire de repos face
      à Skaņākalns, l'autre à la confluence de la rivière Ramata.


      Pour une découverte ludique, un jeu de photo-orientation propose 20 balises réparties entre Mazsalaca et
      le parc naturel de Skaņākalns, mettant en valeur les richesses des eaux vives, forêts, prairies et
      grottes.
    history: >-
      Le parc a été fondé en 1977. C'est l'un des sites Natura 2000 majeurs de Lettonie. Côté patrimoine
      culturel, le musée livonien Pivalind à Staicele retrace les liens du territoire avec l'ancienne contrée
      livonienne de Metsepole. La rivière a donné son nom à un dialecte livonien aujourd'hui éteint, parlé sur
      son cours supérieur jusqu'au XIXe siècle.
    before: >-
      Aux Falaises Rouges, les cavités rocheuses ne sont accessibles que par voie d'eau. Renseignez-vous avant
      le départ sur l'ouverture du sentier de Skaņākalns, fermé à certaines périodes, et prenez connaissance
      de la réglementation du parc.
    around: >-
      Le [Parc national de Wild Nephin](/lugar/wild-nephin-national-park/) partage avec la vallée de la Salaca
      le saumon atlantique et la loutre. La [Vallée de la Venta et cascade Ventas
      Rumba](/lugar/ventas-ieleja---ventas-rumba/), également en Lettonie, est un autre corridor fluvial
      abritant le saumon.
  de:
    intro: >-
      Ein Fluss, der zwischen roten Felswänden fließt. Das ist die Salaca im Norden Lettlands: Auf dem
      Abschnitt von Mazsalaca nach Salacgrīva hat das Wasser Klippen, Höhlen und Stromschnellen in den
      devonischen Sandstein gegraben, und der Naturpark stellt dieses gesamte Tal unter Schutz. Er ist Teil
      des Biosphärenreservats Nord-Vidzeme sowie des Natura-2000-Netzes und lässt sich laut Verwaltung am
      besten vom Wasser aus erleben.
    landscape: >-
      Das Salaca-Tal ist vor allem eine Galerie eindrucksvoller Felsen. Die Parkverwaltung hebt die Roten
      Felsen von Pietraga sowie die Höhlen von Daugēni, Neļķi, Silmači und Bezdelīgas hervor, jede mit
      unverwechselbarem Gepräge.


      Die Roten Felsen sind ein Sandsteinaufschluss von über 400 m Länge und etwa 10 m Höhe mit fünf
      Felsvorsprüngen, von denen Pietrags am markantesten aufragt. Kleine Höhlen und Nischen öffnen sich in
      der Wand und sind ausschließlich vom Fluss aus erreichbar. Die Felsen von Neļķi ragen noch höher auf: 18
      m hoch und fast 200 m lang, die gewaltigsten am Salaca-Ufer. Flussabwärts von Staicele liegt die
      Vīksna-Höhle, eine der längsten des Tals. In der Engelshöhle erinnert ein Felsbogen an die Schwingen
      eines Engels.


      Es handelt sich nicht nur um nackten Fels. Der Park schützt auch Hangwälder, Quellen, Stromschnellen und
      kalkreiche Trockenrasen, Lebensräume von europäischer Bedeutung. Insgesamt sind 22 Habitattypen
      verzeichnet.
    wildlife: >-
      Das bekannteste Leben der Salaca entfaltet sich unter Wasser. Im oberen Abschnitt zwischen Staicele und
      Mazsalaca wurden fast vierundzwanzig Fischarten festgestellt; Fluss und Nebenbäche sind entscheidend für
      [Atlantischen Lachs](/especie/salmo_salar/), [Meerforelle](/especie/salmo_trutta/) und Zährte. Die
      Verwaltung fasst es prägnant zusammen: Es ist der viertwichtigste Lachsfluss des gesamten Ostseeraums.


      Der Jahreszyklus des Flusses spiegelt sich in den Junglachsen wider. Die Smolt-Wanderung ins Meer findet
      heute früher im Jahr statt, verläuft kürzer und intensiver und wird von einjährigen Fischen dominiert.
      Die Nachwuchszahlen, besonders bei der Meerforelle, sind gegenüber den sechziger Jahren gestiegen.


      Insgesamt sind 92 geschützte Arten im Park erfasst. Die beste Reisezeit reicht von Mai bis Oktober.
    visit: >-
      Die Parkverwaltung empfiehlt es ausdrücklich: Die Aufschlüsse und Höhlen entlang des gesamten Flusses
      erschließen sich am eindrücklichsten per Boot. Beliebt sind die klassischen Flussabschnitte:
      Mazsalaca–Staicele, Staicele–Mērnieki und Mērnieki–Salacgrīva.


      Zu Fuß liegen die reizvollsten Pfade um Mazsalaca. Die Skaņākalns-Wege beginnen am Gut Valtenbergi in
      Mazsalaca und folgen dem Ufer bis zur Skaņākalns-Klippe, die das stärkste natürliche Echo Lettlands
      erzeugt. Der Skaņākalns-Pfad ist 2,7 km lang. Der Dauģēni-Pfad setzt ihn mit Stegen und Holztreppen
      fort, vorbei an den Ģendertu-Stromschnellen, den Dauģēni-Klippen und gegenüber dem Silmači-Felsen. Ein
      Ausgangspunkt liegt am Rastplatz gegenüber Skaņākalns, der andere an der Mündung der Ramata.


      Für einen geruhsamen Ausflug bietet ein Foto-Orientierungsspiel 20 Kontrollpunkte in Mazsalaca und im
      Naturpark Skaņākalns, die den Wert von Fließgewässern, Wäldern, Wiesen und Höhlen vermitteln.
    history: >-
      Der Park wurde 1977 eingerichtet. Er zählt zu den ausgewiesenen Natura-2000-Gebieten Lettlands.
      Kulturell erforscht das Livische Museum Pivalind in Staicele die historischen Wurzeln im alten livischen
      Siedlungsgebiet Metsepole. Der Fluss gab einem heute ausgestorbenen livischen Dialekt seinen Namen, der
      an seinem Oberlauf bis ins neunzehnte Jahrhundert gesprochen wurde.
    before: >-
      An den Roten Felsen sind die Höhlen nur vom Boot aus zugänglich. Klären Sie vor Reiseantritt, ob der
      Skaņākalns-Pfad geöffnet ist, und beachten Sie die Schutzbestimmungen im Tal.
    around: >-
      Der [Nationalpark Wild Nephin](/lugar/wild-nephin-national-park/) teilt mit dem Salaca-Tal Lachs und
      Fischotter. Das [Venta-Tal mit dem Wasserfall Ventas Rumba](/lugar/ventas-ieleja---ventas-rumba/),
      ebenfalls in Lettland, bildet einen weiteren Flusskorridor mit Lachsvorkommen.
  it:
    intro: >-
      Un fiume che scorre tra pareti rosse. Questa è la Salaca nel nord della Lettonia: lungo il tratto tra
      Mazsalaca e Salacgrīva, la corrente ha scolpito nell'arenaria devoniana rupi, grotte e rapide, e il
      parco naturale salvaguarda l'intera vallata. Fa parte della Riserva della Biosfera di Vidzeme
      Settentrionale e della rete Natura 2000, e lo stesso ente gestore sottolinea che la prospettiva migliore
      si gode scivolando sull'acqua.
    landscape: >-
      La valle della Salaca è soprattutto una superba rassegna di formazioni rocciose. L'ente gestore segnala
      le Falesie Rosse di Pietraga e le grotte di Daugēni, Neļķi, Silmači e Bezdelīgas, ciascuna con caratteri
      peculiari.


      Le Falesie Rosse costituiscono un affioramento arenaceo di oltre 400 m di sviluppo per circa 10 m di
      altezza, scandito da cinque bastioni tra cui Pietrags è il più ardito. Piccole cavità e nicchie si
      aprono nella parete, raggiungibili unicamente dal fiume. Le rupi di Neļķi sono più imponenti: 18 m di
      dislivello e quasi 200 m di fronte, le maggiori lungo la Salaca. A valle di Staicele si apre la grotta
      di Vīksna, tra le più estese della valle. Nella Grotta degli Angeli, un arco di roccia richiama la forma
      di ali d'angelo.


      Non vi è solo pietra viva. Il parco tutela anche boschi di versante, sorgenti, rapide e praterie aride
      calcicole di valenza comunitaria. In tutto si distinguono 22 tipi di habitat.
    wildlife: >-
      La vita più celebre della Salaca scorre sotto la superficie. Nel tratto superiore tra Staicele e
      Mazsalaca sono state individuate circa ventiquattro specie ittiche; il corso d'acqua e i suoi affluenti
      sono cruciali per il [salmone atlantico](/especie/salmo_salar/), la [trota di
      mare](/especie/salmo_trutta/) e la vimba. Il gestore sintetizza chiaramente: è il quarto fiume da
      salmoni più rilevante del bacino del Mar Baltico.


      Il ritmo biologico del fiume traspare dai giovani salmoni. La discesa degli smolt verso il mare si è
      anticipata nel corso dell'anno, divenendo più concentrata e dominata da pesci di un anno. La resa di
      novellame, specialmente per la trota marina, è cresciuta rispetto agli anni sessanta.


      Nel complesso si contano 92 specie protette nel parco. La stagione ideale va da maggio a ottobre.
    visit: >-
      L'indicazione del gestore è inequivocabile: gli affioramenti e le cavità sull'intera lunghezza del fiume
      si ammirano al meglio navigando. In barca si percorrono i tratti fluviali classici: Mazsalaca–Staicele,
      Staicele–Mērnieki e Mērnieki–Salacgrīva.


      A piedi, i sentieri più suggestivi gravitano intorno a Mazsalaca. I percorsi di Skaņākalns prendono
      avvio vicino alla villa padronale di Valtenbergi a Mazsalaca e affiancano la riva sino alla rupe di
      Skaņākalns, che produce l'eco naturale più potente della Lettonia. Il sentiero di Skaņākalns misura 2,7
      km. Il tracciato di Dauģēni ne rappresenta la prosecuzione, munito di passerelle, ponticelli e scalette
      di legno, toccando le rapide di Ģendertu, le pareti di Dauģēni e, sulla riva opposta, la roccia di
      Silmači. Un capo coincide con l'area di sosta di fronte a Skaņākalns, l'altro con la confluenza del
      Ramata.


      Per un ritmo più rilassato, un'attività di foto-orienteering propone 20 punti di controllo tra Mazsalaca
      e il parco naturale di Skaņākalns, illustrando il pregio di acque correnti, foreste, praterie e cavità.
    history: >-
      Il parco è stato istituito nel 1977. Figura tra le aree Natura 2000 della Lettonia. Sul piano
      storico-culturale, il museo livone Pivalind a Staicele approfondisce il legame dell'area con l'antico
      territorio livone di Metsepole. Il fiume ha dato il nome a un dialetto livone, oggi estinto, parlato
      lungo il suo alto corso fino al XIX secolo.
    before: >-
      Alle Falesie Rosse le grotte sono avvicinabili solo via acqua. Verificate preventivamente
      l'accessibilità del sentiero di Skaņākalns, soggetto a chiusure stagionali, e consultate le norme d'uso.
    around: >-
      Il [Parco Nazionale di Wild Nephin](/lugar/wild-nephin-national-park/) condivide con la valle della
      Salaca il salmone atlantico e la lontra. E la [Valle del Venta con la Cascata Ventas
      Rumba](/lugar/ventas-ieleja---ventas-rumba/), anch'essa in Lettonia, rappresenta un altro corridoio
      fluviale che accoglie il salmone.
  pt:
    intro: >-
      Um rio que corre entre muralhas vermelhas. É esse o cenário do Salaca no norte da Letónia: ao longo do
      troço entre Mazsalaca e Salacgrīva, a correnteza entalhou no arenito devónico escarpas, grutas e
      rápidos, protegendo o parque natural a integridade desse vale. Integra a Reserva da Biosfera do Norte de
      Vidzeme e a rede Natura 2000, indicando a própria administração que o desfrute é pleno a partir da água.
    landscape: >-
      O vale do Salaca sobressai sobretudo pela sua sucessão de afloramentos rochosos. A entidade gestora
      destaca as Falésias Vermelhas de Pietraga e as grutas de Daugēni, Neļķi, Silmači e Bezdelīgas, cada uma
      com perfil singular.


      As Falésias Vermelhas formam uma parede de arenito com mais de 400 m de extensão e cerca de 10 m de
      altura, recortada por cinco esporões entre os quais Pietrags é o mais notável. Pequenas cavidades e
      covas abrem-se na rocha, unicamente acessíveis pelo leito do rio. As escarpas de Neļķi são mais altas:
      18 m de desnível e perto de 200 m de comprimento, as mais grandiosas das margens do Salaca. A jusante de
      Staicele abre-se a gruta de Vīksna, entre as mais longas do vale. Na gruta dos Anjos, um arco rochoso
      evoca asas abertas.


      Não se trata apenas de rocha nua. O parque resguarda igualmente bosques de encosta, nascentes, rápidos e
      prados secos em substrato calcário, habitats de interesse comunitário. No total estão catalogados 22
      tipos de habitat.
    wildlife: >-
      A riqueza biológica mais afamada do Salaca vive debaixo de água. No troço superior entre Staicele e
      Mazsalaca identificaram-se perto de vinte e quatro espécies de peixes, sendo o rio principal e os seus
      afluentes determinantes para o [salmão-do-atlântico](/especie/salmo_salar/), a
      [truta-marisca](/especie/salmo_trutta/) e o escalo-do-báltico. A gestão sintetiza com clareza: é o
      quarto rio de salmões mais importante da bacia do mar Báltico.


      O calendário ecológico do rio manifesta-se nos juvenis. A migração dos esguichos (smolts) rumo ao mar
      antecipou-se no ano, tornando-se mais célere e dominada por peixes de um ano. A produção juvenil,
      sobretudo na truta-marisca, cresceu face aos anos sessenta.


      Contam-se no total 92 espécies protegidas no parque. A melhor época para visitar decorre de maio a
      outubro.
    visit: >-
      A recomendação da equipa gestora é transparente: os afloramentos e as grutas ao longo de todo o rio
      apreciam-se melhor a navegar. Em barco percorrem-se os troços tradicionais: Mazsalaca–Staicele,
      Staicele–Mērnieki e Mērnieki–Salacgrīva.


      A pé, os melhores trilhos reúnem-se em volta de Mazsalaca. Os caminhos de Skaņākalns partem junto ao
      solar de Valtenbergi em Mazsalaca e ladeiam a margem até à escarpa de Skaņākalns, que produz o eco
      natural mais sonoro da Letónia. O trilho de Skaņākalns mede 2,7 km. O trilho de Dauģēni prolonga-o com
      passadiços, pontes e escadarias de madeira, passando pelos rápidos de Ģendertu, pelas falésias de
      Dauģēni e, na margem fronteira, pela rocha de Silmači. Um extremo situa-se no parque de merendas
      defronte a Skaņākalns; o outro na foz do rio Ramata.


      Para um ritmo pausado, um jogo de foto-orientação reúne 20 pontos de controlo em Mazsalaca e no parque
      natural de Skaņākalns, divulgando os valores das águas límpidas, bosques, prados e grutas.
    history: >-
      O parque foi criado em 1977. É um dos sítios Natura 2000 da Letónia. No plano histórico-cultural, o
      museu livónio Pivalind em Staicele investiga a ligação da zona com o antigo território livónio de
      Metsepole. O rio deu nome a um dialeto livónio hoje extinto, falado nas suas margens altas até ao século
      XIX.
    before: >-
      Nas Falésias Vermelhas, as grutas só são acessíveis por água. Informe-se previamente sobre a abertura do
      trilho de Skaņākalns, sujeito a interrupções sazonais, e atente na regulamentação do vale.
    around: >-
      O [Parque Nacional de Wild Nephin](/lugar/wild-nephin-national-park/) partilha com o vale do Salaca o
      salmão-do-atlântico e a lontra. E o [Vale do Venta e Cascata Ventas
      Rumba](/lugar/ventas-ieleja---ventas-rumba/), igualmente na Letónia, é outro corredor fluvial com
      salmão.
