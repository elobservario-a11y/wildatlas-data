resumen:
  es: >-
    Gargantas verticales encajadas (Velika y Mala Paklenica) cayendo directamente al mar Adriático desde los
    picos de Velebit.
  en: >-
    Vertical incised canyons (Velika and Mala Paklenica) plunging straight towards the Adriatic Sea from the
    crests of Velebit.
  fr: >-
    Gorges vertigineuses et encaissées (Velika et Mala Paklenica) plongeant directement vers l’Adriatique
    depuis les crêtes du Velebit.
  de: >-
    Tief eingeschnittene senkrechte Felsschluchten (Velika und Mala Paklenica), die von den Velebit-Gipfeln
    direkt zur Adria abfallen.
  it: >-
    Gole verticali profondamente incise (Velika e Mala Paklenica) che precipitano direttamente nell’Adriatico
    dalle creste del Velebit.
  pt: >-
    Desfiladeiros verticais e encaixados (Velika e Mala Paklenica) caindo a pique no mar Adriático a partir
    dos picos de Velebit.
unico:
  es: >-
    Dos cañones verticales que suben desde el mar hasta cumbres de más de mil setecientos cincuenta metros,
    con bosques de pino negro, cuya resina probablemente dio nombre al parque.
  en: >-
    Two vertical canyons ascending from sea level to peaks over seventeen hundred and fifty metres, harbouring
    black pine forests whose resin likely gave the park its name.
  fr: >-
    Deux canyons verticaux s’élevant de la mer jusqu’à des sommets de plus de mille sept cent cinquante
    mètres, abritant des forêts de pin noir dont la résine a sans doute donné son nom au parc.
  de: >-
    Zwei senkrechte Schluchten, die vom Meeresspiegel bis zu Gipfeln von über siebzehnhundertfünfzig Metern
    aufsteigen und Schwarzkieferwälder bergen, deren Harz dem Park wohl den Namen gab.
  it: >-
    Due canyon verticali che salgono dal mare fino a vette di oltre millesettecentocinquanta metri, custodi di
    pinete di pino nero la cui resina diede probabilmente il nome al parco.
  pt: >-
    Dois desfiladeiros verticais que ascendem do mar até cumes com mais de mil setecentos e cinquenta metros,
    acolhendo pinhais de pinheiro-larício cuja resina terá dado nome ao parque.
observaciones:
  es: >-
    Está prohibido salirse de los senderos señalizados y arrancar flores u otras plantas. Para preservar la
    naturaleza del cañón de Mala Paklenica y sobre todo las aves amenazadas, no se permite escalar en este
    cañón. Los mejores meses son abril, mayo, junio, septiembre y octubre.
texto:
  es:
    intro: >-
      Imagina dos cañones que caen en vertical desde las cumbres del Velebit hasta el mar. En el de Mala
      Paklenica, las paredes llegan a 300 metros y en el punto más estrecho solo hay 10 metros de ancho; en el
      de Velika Paklenica, el valle mide 14,5 km y en un tramo de unos 3 km, entre Anića Kuk y Marasovići, se
      encajona en pocas decenas de metros de ancho y hasta 400 de profundidad. El Parque Nacional Paklenica
      protege esos dos torrentes y las alturas que los rodean, 95 km² que incluyen las cumbres más altas del
      Velebit: Vaganski vrh y Sveto brdo.
    landscape: >-
      El relieve se reparte entre los torrentes de Velika Paklenica y Mala Paklenica, con cañones excavados en
      vertical en las laderas sur del Velebit. En algunos puntos del cañón de Velika Paklenica hay rocas y
      bloques caídos que lo cierran en parte y forman rápidos y pequeñas cascadas.


      Hacia arriba, el paisaje cambia con la altitud. El parque tiene ocho comunidades de bosque, y la gama de
      altitudes explica esa diversidad: de 20 a 1757 m. En las cumbres crece el pino mugo, en la mayor y más
      compacta extensión de pinar de pino mugo de Croacia. Más abajo, el [pino negro](/especie/pinus_nigra/)
      es un bosque raro y endémico, que crece en suelos secos y poco profundos, entre 700 y 1200 m; es lo que
      da su nombre al parque, porque Paklenica viene probablemente de «paklina», la resina del pino negro, que
      los vecinos usaban como medicina, para curar heridas, para alumbrar y para untar barcas de madera. Bajo
      ese pinar florece en marzo el brezo de invierno, de modo que el bosque es muy atractivo a finales del
      invierno y a principios de la primavera.


      Y bajo tierra: Manita peć, a 570 m, es la cueva más famosa de las 115 conocidas en el parque, la única
      visitable con guía, con salas amplias y formaciones que se visitan desde 1937.
    wildlife: >-
      Se han registrado 260 especies de aves, y 165 de ellas nidifican en el parque o su entorno. En las
      paredes de los cañones nidifican 24 especies, y las más abundantes son el trepador azul y el roquero
      solitario. Entre las rapaces raras están el [águila real](/especie/aquila_chrysaetos/), el [halcón
      peregrino](/especie/falco_peregrinus/), la culebrera europea y el azor, y el [búho
      real](/especie/bubo_bubo/), la mayor lechuza de Europa, anida con regularidad en los cañones de Velika y
      Mala Paklenica. El [buitre leonado](/especie/gyps_fulvus/) llegó a tener tres parejas hasta fines de
      1999 y se extinguió en el parque por la menor ganadería y el veneno contra depredadores, sobre todo
      lobos.


      Hay 53 especies de mamíferos, entre ellas corzo, [ciervo](/especie/cervus_elaphus/),
      [rebeco](/especie/rupicapra_rupicapra/) y [jabalí](/especie/sus_scrofa/), y los tres grandes carnívoros:
      [oso pardo](/especie/ursus_arctos/), [lobo](/especie/canis_lupus/) y [lince](/especie/lynx_lynx/).


      Entre anfibios y reptiles hay 31 especies, 11 de ellas serpientes; las únicas venenosas son la víbora
      chata y la rara [víbora de Orsini](/especie/vipera_ursinii/). Se han registrado más de 100 especies de
      mariposas diurnas, y la mariposa Saturnia pyri, la mayor de Croacia, es la más fácil de ver.
    visit: >-
      Caminar es la mejor forma de conocer Paklenica: hay entre 150 y 200 km de caminos, desde paseos
      turísticos que van del cañón de Velika Paklenica a la cueva de Manita peć, la casa forestal Lugarnica y
      el refugio de montaña, hasta rutas de montaña hacia las cumbres del Velebit. Los caminos están
      señalizados con marcas rojas y blancas y carteles en los cruces.


      Para las alturas, tres ideas. Vaganski vrh, de 1757 m, es la cima más alta del Velebit, de cumbre plana
      y cubierta de hierba; con buen día se ve hasta Risnjak, a 150 km. Sveto brdo, de 1753 m, es la segunda
      cima del Velebit y se alcanza en unas cinco horas de marcha desde el refugio de montaña. Liburnija, de
      1709 m, es uno de los mejores miradores del Velebit; se sube desde el refugio de montaña (480 m) por una
      ruta marcada, solo apta para excursionistas con experiencia.


      A Manita peć se sube en una hora y media desde el aparcamiento de Velika Paklenica. Se visita de mayo a
      octubre, con más días de apertura en julio, agosto y septiembre. La visita guiada dura unos 30 minutos y
      la temperatura dentro es de unos 9 °C todo el año.


      El centro de visitantes «Secretos subterráneos de Paklenica» está en los antiguos túneles del ejército
      yugoslavo, construidos entre 1950 y 1953 en el cañón de Velika Paklenica. Abrió en agosto de 2016 y
      tiene dos salas: «Características naturales del Velebit» y «Patrimonio cultural y habitantes del
      Velebit». Abre de abril a octubre.
    history: >-
      Hace unos ocho mil años llegaron a la zona los primeros ganaderos y agricultores, con trigo, cabras y
      ovejas. El parque se declaró el 19 de octubre de 1949 para proteger el gran complejo forestal bien
      conservado de Dalmacia. Hoy es Reserva de la Biosfera de la UNESCO desde 1978, está en la red Natura
      2000 desde 2014 y desde 2017 es Patrimonio Mundial: en 2017 los hayedos del parque se añadieron al
      Patrimonio Mundial «Hayedos primarios y antiguos de los Cárpatos y otras regiones de Europa».


      La flora suma 1.000 especies y subespecies de plantas, 79 de ellas endémicas.
    before: >-
      Está prohibido salirse de los senderos señalizados y arrancar flores u otras plantas. Para preservar la
      naturaleza del cañón de Mala Paklenica y sobre todo las aves amenazadas, no se permite escalar en este
      cañón. Los mejores meses son abril, mayo, junio, septiembre y octubre.
    around: '[Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) queda a 9 km.'
  en:
    intro: >-
      Picture two sheer canyons dropping vertically from the crags of Velebit straight towards the sea. In
      Mala Paklenica, towering cliffs soar to 300 metres, narrowing to barely 10 metres wide at the tightest
      defile; in Velika Paklenica, the canyon extends 14.5 km, constricting over a stretch of some 3 km
      between Anića Kuk and Marasovići into a slot canyon a few dozen metres across and up to 400 metres deep.
      Paklenica National Park protects both torrent basins and the towering crests that hem them in, spanning
      95 km² that embrace the loftiest peaks of the Velebit: Vaganski Vrh and Sveto Brdo.
    landscape: >-
      The rugged topography divides between the torrent gorges of Velika Paklenica and Mala Paklenica, carved
      vertically into the southern ramparts of Velebit. At various constriction points along Velika Paklenica,
      giant boulders and rockfalls partially obstruct the torrent, forming turbulent rapids and churning
      cascades.


      Climbing higher, the vegetation shifts dramatically with altitude. The park harbours eight distinct
      forest communities across an elevation gradient spanning from 20 to 1757 m. Near the summits prostrate
      mountain pine (mugo) forms the largest and most contiguous expanse of krummholz in Croatia. Below, the
      [European black pine](/especie/pinus_nigra/) forms rare endemic stands on arid, skeletal soils between
      700 and 1200 m; this conifer gave the park its name, as Paklenica likely derives from "paklina", the
      fragrant black pine resin harvested by locals for medicinal salves, lighting, and sealing wooden boats.
      Beneath these pine woods, winter heath bursts into vivid bloom in March, making early spring and late
      winter a scenic time to explore.


      Deep underground lies Manita Peć at 570 m, the most renowned of 115 known caverns in the park and the
      sole show cave accessible with a guide, featuring colossal dripstone chambers opened to visitors since
      1937.
    wildlife: >-
      Ornithologists have documented 260 bird species, with 165 breeding within the park or its immediate
      buffer. On the canyon rock faces nest 24 avian species, led by Eurasian nuthatch and blue rock thrush.
      Rare raptors include the [golden eagle](/especie/aquila_chrysaetos/), [peregrine
      falcon](/especie/falco_peregrinus/), short-toed snake eagle, and northern goshawk, while the [Eurasian
      eagle-owl](/especie/bubo_bubo/), Europe’s largest owl, nests regularly across both Paklenica gorges. The
      [griffon vulture](/especie/gyps_fulvus/) maintained three breeding pairs until late 1999 before
      vanishing due to pastoral decline and poisoned predator baits targeted at wolves.


      Mammal diversity reaches 53 species, encompassing roe deer, [red deer](/especie/cervus_elaphus/),
      [chamois](/especie/rupicapra_rupicapra/), and [wild boar](/especie/sus_scrofa/), alongside Europe’s
      three apex carnivores: [brown bear](/especie/ursus_arctos/), [wolf](/especie/canis_lupus/), and
      [Eurasian lynx](/especie/lynx_lynx/).


      Herpetofauna comprises 31 amphibian and reptile species, including 11 snakes; the only venomous serpents
      are the nose-horned viper and the scarce [Orsinis viper](/especie/vipera_ursinii/). Over 100 species of
      diurnal butterflies flutter through the valleys, with the giant peacock moth, Croatia’s largest
      lepidopteran, frequently observed.
    visit: >-
      Hiking is the premier way to experience Paklenica: between 150 and 200 km of waymarked paths traverse
      the terrain, ranging from leisurely valley rambles connecting Velika Paklenica to Manita Peć cave,
      Lugarnica forest lodge, and the mountain hut, to demanding alpine climbs reaching Velebit’s crest. All
      trails feature standard red-and-white trail markers and directional signposts at intersections.


      For summit ascents, three primary goals stand out. Vaganski Vrh, at 1757 m, is the roof of Velebit,
      featuring a broad grassy crest; on clear days views carry across 150 km to Risnjak. Sveto Brdo, at 1753
      m, represents Velebit’s second highest peak and can be reached in about five hours of hiking from the
      mountain hut. Liburnija, rising to 1709 m, offers one of the finest marine panoramas over the Adriatic
      archipelago; the trail ascends steeply from the mountain hut (480 m) and is recommended only for
      seasoned alpine hikers.


      Manita Peć is reached in an hour and a half from the main Velika Paklenica car park. Guided cave visits
      operate from May to October, with extended daily tours in July, August, and September. The underground
      tour lasts roughly 30 minutes, maintaining an interior temperature of around 9 °C year-round.


      The "Underground Secrets of Paklenica" visitor centre is housed inside historic bunkers excavated by the
      Yugoslav army between 1950 and 1953 in Velika Paklenica canyon. Inaugurated in August 2016, it presents
      two multimedia exhibition wings: "Natural Heritage of Velebit" and "Cultural Heritage and Inhabitants of
      Velebit". Open from April through October.
    history: >-
      Roughly eight thousand years ago, Neolithic pastoralists and farmers first arrived in the Velebit
      foothills, tending primitive wheat, goats, and sheep. Paklenica was declared a national park on 19
      October 1949 to safeguard Dalmatia’s most extensive and pristine forest complex. Today it holds UNESCO
      Biosphere Reserve status (designated in 1978), joined the Natura 2000 ecological network in 2014, and in
      2017 achieved World Heritage recognition: in 2017 the park’s ancient beechwoods were inscribed into the
      transnational UNESCO site "Ancient and Primeval Beech Forests of the Carpathians and Other Regions of
      Europe".


      The flora counts over 1,000 plant species and subspecies, including 79 endemics.
    before: >-
      Straying from marked trails and picking wild flora are strictly prohibited. To protect the wild
      character of Mala Paklenica canyon and its endangered cliff-nesting avifauna, rock climbing is strictly
      banned in that defile. The most favourable trekking months are April, May, June, September, and October.
    around: '[Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) lies 9 km away.'
  fr:
    intro: >-
      Imaginez deux canyons plongeant à la verticale depuis les sommets du Velebit jusqu’à la mer. Dans les
      gorges de Mala Paklenica, les parois atteignent 300 mètres et le défilé ne mesure que 10 mètres de large
      au point le plus resserré ; dans celles de Velika Paklenica, la vallée s’étire sur 14,5 km et
      s’engouffre sur près de 3 km, entre Anića Kuk et Marasovići, dans un goulet de quelques dizaines de
      mètres de largeur pour près de 400 mètres de profondeur. Le parc national de Paklenica protège ces deux
      torrents et les crêtes qui les ceinturent, couvrant 95 km² qui intègrent les plus hauts sommets du
      Velebit : le Vaganski vrh et le Sveto brdo.
    landscape: >-
      Le relief se partage entre les torrents de Velika Paklenica et Mala Paklenica, incisés à la verticale
      dans les contreforts méridionaux du Velebit. En plusieurs endroits du canyon de Velika Paklenica,
      d’énormes éboulis rocheux obstruent le lit, donnant naissance à de vifs rapides et à des cascades
      bouillonnantes.


      En prenant de la hauteur, la végétation change au gré de l’altitude. Le parc réunit huit communautés
      forestières sur un dénivelé remarquable s’échelonnant de 20 à 1757 m. Sur les crêtes prospère le pin
      mugo, formant l’étendue de krummholz la plus vaste et la plus dense de Croatie. Plus bas, le [pin
      noir](/especie/pinus_nigra/) compose des peuplements endémiques sur sols rocailleux et superficiels
      entre 700 et 1200 m ; c’est à lui que le parc doit probablement son nom, Paklenica dérivant de « paklina
      », la résine noire que les anciens récoltaient pour soigner les plaies, fabriquer des torches et
      calfeutrer les barques en bois. Sous cette pinède éclot en mars la bruyère d’hiver, parant les sous-bois
      de couleurs éclatantes à la sortie de l’hiver.


      Sous terre s’ouvre Manita peć à 570 m, la cavité la plus célèbre des 115 grottes répertoriées dans le
      parc, la seule aménagée pour des visites accompagnées, dévoilant de vastes salles concrétionnées
      ouvertes au public depuis 1937.
    wildlife: >-
      Les ornithologues ont répertorié 260 espèces d’oiseaux, dont 165 nichent dans le parc ou sa périphérie
      immédiate. Sur les parois rocheuses nichent 24 espèces d’oiseaux, au premier rang desquelles la sittelle
      torchepot et le monticole merle-bleu. Parmi les rapaces rares figurent l’[aigle
      royal](/especie/aquila_chrysaetos/), le [faucon pèlerin](/especie/falco_peregrinus/), le circaète
      Jean-le-Blanc et l’autour des palombes, tandis que le [grand-duc d’Europe](/especie/bubo_bubo/), le plus
      grand rapace nocturne d’Europe, niche fidèlement dans les deux défilés. Le [vautour
      fauve](/especie/gyps_fulvus/) compta jusqu’à trois couples reproducteurs jusqu’à la fin de 1999 avant de
      disparaître sous l’effet du déclin pastoral et des appâts empoisonnés destinés aux loups.


      On dénombre 53 espèces de mammifères, dont le chevreuil, le [cerf élaphe](/especie/cervus_elaphus/), le
      [chamois](/especie/rupicapra_rupicapra/) et le [sanglier](/especie/sus_scrofa/), aux côtés des trois
      grands prédateurs européens : l’[ours brun](/especie/ursus_arctos/), le [loup](/especie/canis_lupus/) et
      le [lynx boréal](/especie/lynx_lynx/).


      Côté herpétofaune vivent 31 espèces de reptiles et d’amphibiens, dont 11 espèces de serpents ; les
      seules espèces venimeuses sont la vipère ammodyte et la rare [vipère
      d’Orsini](/especie/vipera_ursinii/). Plus de 100 espèces de papillons diurnes ont été recensées, et le
      grand paon de nuit, plus grand papillon de Croatie, s’observe aisément.
    visit: >-
      La randonnée pédestre constitue la meilleure façon de découvrir Paklenica : le parc compte entre 150 et
      200 km de sentiers balisés, de la promenade familiale reliant Velika Paklenica à la grotte de Manita
      peć, au refuge forestier de Lugarnica et au refuge de montagne, jusqu’aux grandes ascensions rocheuses
      vers les crêtes du Velebit. Tous les itinéraires sont jalonnés de marques rouge et blanc et de panneaux
      directionnels.


      Pour prendre de l’altitude, trois grands classiques s’imposent. Le Vaganski vrh, culminant à 1757 m, est
      le toit du Velebit, formant un sommet herbeux dégagé ; par temps clair, la vue porte jusqu’au Risnjak, à
      150 km. Le Sveto brdo, à 1753 m, est le deuxième sommet du Velebit et s’atteint en cinq heures environ
      depuis le refuge. Liburnija, dressé à 1709 m, offre l’un des plus saisissants panoramas maritimes du
      massif ; l’ascension débute au refuge de montagne (480 m) par un itinéraire abrupt réservé aux
      montagnards aguerris.


      On monte à Manita peć en une heure et demie depuis le parking de Velika Paklenica. La grotte se visite
      de mai à octobre, avec des départs quotidiens en juillet, août et septembre. La visite guidée dure
      environ 30 minutes et la température intérieure avoisine 9 °C toute l’année.


      Le centre de découverte « Secrets souterrains de Paklenica » est aménagé dans d’anciens abris
      souterrains militaires édifiés par l’armée yougoslave entre 1950 et 1953 dans la gorge de Velika
      Paklenica. Inauguré en août 2016, il abrite deux espaces d’exposition : « Les richesses naturelles du
      Velebit » et « Patrimoine culturel et habitants du Velebit ». Ouvert d’avril à octobre.
    history: >-
      Il y a environ huit mille ans, les premières communautés néolithiques de pasteurs et d’agriculteurs
      s’établirent sur ces versants, avec chèvres, moutons et blé. Paklenica fut proclamé parc national le 19
      octobre 1949 afin de préserver le massif forestier le plus somptueux et intact de Dalmatie. Classé
      réserve de biosphère par l’UNESCO dès 1978, il a rejoint le réseau Natura 2000 en 2014 et le Patrimoine
      mondial en 2017 : en 2017, les hêtraies primaires du parc furent inscrites au bien UNESCO « Forêts
      primaires et anciennes de hêtres des Carpates et d’autres régions d’Europe ».


      La flore rassemble plus de 1 000 espèces et sous-espèces végétales, dont 79 endémiques.
    before: >-
      Il est formellement interdit de quitter les sentiers balisés et de prélever des fleurs ou des plantes
      sauvages. Afin de préserver la sauvagerie du canyon de Mala Paklenica et ses rapaces rupestres menacés,
      l’escalade y est interdite. Les mois les plus favorables pour arpenter le massif sont avril, mai, juin,
      septembre et octobre.
    around: '[Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) se trouve à 9 km.'
  de:
    intro: >-
      Stell dir zwei Felsschluchten vor, die senkrecht von den Velebit-Gipfeln zum Meer hinabstürzen. In der
      Mala Paklenica ragen die Felswände bis zu 300 Meter empor und messen an der engsten Stelle kaum 10 Meter
      Breite; in der Velika Paklenica zieht sich das Tal über 14,5 km und verengt sich auf einem rund 3 km
      langen Abschnitt zwischen Anića Kuk und Marasovići zu einer Klamm von wenigen Dutzend Metern Breite und
      bis zu 400 Metern Tiefe. Der Nationalpark Paklenica schützt diese beiden Wildbachtäler und die
      umliegenden Hochlagen auf 95 km², darunter die höchsten Velebit-Gipfel: Vaganski Vrh und Sveto Brdo.
    landscape: >-
      Das Relief wird von den Wildbachtälern Velika Paklenica und Mala Paklenica geprägt, die tief in die
      Südabhänge des Velebit eingegraben sind. An mehreren Engstellen der Velika Paklenica liegen
      herabgestürzte Felsblöcke im Bachbett, die das Wasser aufstauen und Stromschnellen bilden.


      Mit zunehmender Höhe verändert sich das Landschaftsbild grundlegend. Der Park weist acht
      Waldgesellschaften auf, begünstigt durch das Höhenprofil von 20 bis 1757 m. In den Gipfellagen wächst
      die Bergkiefer (Latschenkiefer) im ausgedehntesten Krummholzgürtel Kroatiens. Darunter bildet die
      [Schwarzkiefer](/especie/pinus_nigra/) seltene endemische Bestände auf flachgründigen Böden zwischen 700
      und 1200 m; sie gab dem Park vermutlich seinen Namen, denn Paklenica leitet sich wohl von „Paklina“ ab,
      dem duftenden Kiefernharz, das früher zum Heilen von Wunden, für Fackeln und zum Abdichten von
      Holzbooten gewonnen wurde. Unter den Kiefern blüht im März die Schneeheide, was den Wald im Vorfrühling
      besonders farbenprächtig macht.


      Unter Tage verbirgt sich die Manita Peć auf 570 m, die berühmteste der 115 bekannten Höhlen des Parks
      und die einzige Schauhöhle mit Führungen, die seit 1937 für Besucher geöffnet ist.
    wildlife: >-
      Im Park wurden 260 Vogelarten nachgewiesen, von denen 165 im Gebiet brüten. An den Felswänden der
      Schluchten nisten 24 Vogelarten, dominiert von Kleiber und Blaumerle. Zu den seltenen Greifvögeln zählen
      [Steinadler](/especie/aquila_chrysaetos/), [Wanderfalke](/especie/falco_peregrinus/), Schlangenadler und
      Habicht; der [Uhu](/especie/bubo_bubo/), Europas größte Eule, brütet regelmäßig in beiden Schluchten.
      Der [Gänsegeier](/especie/gyps_fulvus/) wies bis Ende 1999 drei Brutpaare auf und erlosch im Park
      infolge des Weiderückgangs und ausgelegter Giftköder gegen Wölfe.


      Es leben 53 Säugetierarten im Gebiet, darunter Reh, [Rothirsch](/especie/cervus_elaphus/),
      [Gämse](/especie/rupicapra_rupicapra/) und [Wildschwein](/especie/sus_scrofa/), begleitet von den drei
      großen Beutegreifern: [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und [Eurasischer
      Luchs](/especie/lynx_lynx/).


      Unter den Amphibien und Reptilien finden sich 31 Arten, darunter 11 Schlangenarten; die einzigen
      Giftschlangen sind Europäische Hornotter und die seltene [Wiesenotter](/especie/vipera_ursinii/). Über
      100 Tagfalterarten wurden erfasst, und das Wiener Nachtpfauenauge, Kroatiens größter Schmetterling, ist
      gut zu beobachten.
    visit: >-
      Zu Fuß erschließt sich Paklenica am besten: Zwischen 150 und 200 km markierte Wege durchziehen das
      Schutzgebiet, von leichten Wanderungen durch die Schlucht zur Schauhöhle Manita Peć, dem Forsthaus
      Lugarnica und der Berghütte bis hin zu anspruchsvollen Bergtouren auf die Velebit-Gipfel. Alle Pfade
      sind rot-weiß markiert und an Kreuzungen beschildert.


      Für Gipfelstürmer gibt es drei Hauptziele. Der Vaganski Vrh (1757 m) ist der höchste Punkt des Velebit
      mit einem weitläufigen Grasgipfel; bei klarer Sicht reicht der Blick 150 km weit bis zum Risnjak. Der
      Sveto Brdo (1753 m) ist der zweithöchste Gipfel und in rund fünf Gehstunden ab der Berghütte zu
      erreichen. Die Liburnija (1709 m) gilt als schönster Aussichtsbalkon über die Adria; der Aufstieg ab der
      Berghütte (480 m) erfordert alpine Erfahrung.


      Zur Manita Peć steigt man in anderthalb Stunden ab dem Parkplatz Velika Paklenica auf. Die Höhle ist von
      Mai bis Oktober geöffnet, mit täglichen Führungen im Juli, August und September. Die Führung dauert rund
      30 Minuten bei konstanten 9 °C im Höhleninneren.


      Das Besucherzentrum „Unterirdische Geheimnisse von Paklenica“ liegt in ehemaligen Militärstollen der
      jugoslawischen Armee, die zwischen 1950 und 1953 in die Felswand der Velika Paklenica gesprengt wurden.
      Es öffnete im August 2016 mit zwei Abteilungen: „Naturwerte des Velebit“ und „Kulturerbe und Bewohner
      des Velebit“. Geöffnet von April bis Oktober.
    history: >-
      Vor etwa achttausend Jahren ließen sich die ersten neolithischen Hirten und Ackerbauern im Velebit
      nieder. Paklenica wurde am 19. Oktober 1949 zum Nationalpark erklärt, um den besterhaltenen Waldkomplex
      Dalmatiens zu sichern. Das Gebiet ist seit 1978 UNESCO-Biosphärenreservat, seit 2014 Teil von Natura
      2000 und seit 2017 UNESCO-Welterbe: 2017 wurden die Ur-Buchenwälder des Parks in das Welterbe der Alten
      Buchenwälder und Buchenurwälder der Karpaten und anderer Regionen Europas aufgenommen.


      Die Pflanzenwelt zählt über 1.000 Arten und Unterarten, darunter 79 Endemiten.
    before: >-
      Das Verlassen markierter Pfade und das Pflücken von Wildpflanzen sind untersagt. Um die Ursprünglichkeit
      der Mala-Paklenica-Schlucht und ihre Felsvogelwelt zu wahren, ist Klettern in dieser Schlucht streng
      verboten. Die besten Wandermonate sind April, Mai, Juni, September und Oktober.
    around: '[Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) liegt 9 km entfernt.'
  it:
    intro: >-
      Immagina due gole che precipitano verticalmente dalle creste del Velebit fino al mare. Nella Mala
      Paklenica le pareti toccano i 300 metri e nel punto più angusto la gola misura appena 10 metri di
      larghezza; nella Velika Paklenica la valle si allunga per 14,5 km e in un tratto di circa 3 km, tra
      Anića Kuk e Marasovići, si incassa in poche decine di metri di larghezza per oltre 400 metri di
      profondità. Il Parco Nazionale di Paklenica tutela questi due torrenti e le cime che li abbracciano,
      coprendo 95 km² che racchiudono le massime vette del Velebit: il Vaganski Vrh e il Sveto Brdo.
    landscape: >-
      La morfologia è scolpita dalle valli torrentizie di Velika Paklenica e Mala Paklenica, incise a picco
      nei contrafforti meridionali del Velebit. In diversi tratti della gola di Velika Paklenica enormi massi
      ciclopici franati ostruiscono parzialmente il corso d’acqua generando rapide spumeggianti e cascatelle.


      Salendo di quota la vegetazione muta con l’altitudine. Il parco accoglie otto formazioni boschive
      favorite dal dislivello altitudinale compreso tra 20 e 1757 m. Sulle creste domina il pino mugo, nella
      fascia a brughiera subalpina più compatta ed estesa della Croazia. Più in basso, il [pino
      nero](/especie/pinus_nigra/) dà vita a popolamenti endemici su pendii aridi e rocciosi tra 700 e 1200 m;
      è questa conifera che ha verosimilmente dato il nome al parco, poiché Paklenica deriverebbe da
      «paklina», la resina del pino nero impiegata un tempo per curare ferite, alimentare torce e calafatare
      scafi in legno. Sotto la pineta a marzo fiorisce l’erica invernale, accendendo il sottobosco di tinte
      vivaci a inizio primavera.


      Nel sottosuolo si apre la Manita Peć a 570 m, la più celebre delle 115 grotte censite nel parco e
      l’unica visitabile con guida, provvista di maestose sale ricche di stalattiti aperte al pubblico dal
      1937.
    wildlife: >-
      Nel parco sono state censite 260 specie di uccelli, delle quali 165 nidificano abitualmente nel parco o
      nelle zone limitrofe. Sulle pareti verticali dei canyon nidificano 24 specie rupicole, con netta
      prevalenza di picchio muratore e passero solitario. Tra i rapaci rari spiccano l’[aquila
      reale](/especie/aquila_chrysaetos/), il [falco pellegrino](/especie/falco_peregrinus/), il biancone e
      l’astore, mentre il [gufo reale](/especie/bubo_bubo/) nidifica regolarmente in entrambe le gole. Il
      [grifone](/especie/gyps_fulvus/) contava fino a tre coppie nidificanti sul finire del 1999, prima di
      estinguersi localmente a causa dell’abbandono della pastorizia e dei bocconi avvelenati destinati ai
      lupi.


      I mammiferi sommano 53 specie, tra cui capriolo, [cervo](/especie/cervus_elaphus/), [camoscio
      alpino](/especie/rupicapra_rupicapra/) e [cinghiale](/especie/sus_scrofa/), oltre ai tre grandi
      predatori d’Europa: [orso bruno](/especie/ursus_arctos/), [lupo](/especie/canis_lupus/) e
      [lince](/especie/lynx_lynx/).


      Tra anfibi e rettili vivono 31 specie, incluse 11 specie di serpenti; le uniche velenose sono la vipera
      dal corno e la rara [vipera dell’Orsini](/especie/vipera_ursinii/). Sono state censite oltre 100 specie
      di farfalle diurne, tra cui la vistosa saturnia del pero.
    visit: >-
      Il trekking è il modo migliore per vivere Paklenica: vi sono tra i 150 e i 200 km di sentieri tracciati,
      dalle passeggiate turistiche di fondovalle che risalgono Velika Paklenica verso la grotta di Manita Peć,
      la casa forestale Lugarnica e il rifugio alpino, fino alle impegnative traversate d’alta quota verso le
      vette del Velebit. I percorsi presentano la classica segnaletica bianco-rossa e tabelle ai bivi.


      Per le ascensioni si distinguono tre mete classiche. Il Vaganski Vrh, con i suoi 1757 m, è la vetta più
      alta del Velebit, caratterizzata da una cima erbosa tondeggiante; nelle giornate terse lo sguardo spazia
      fino al Risnjak a 150 km. Il Sveto Brdo, a 1753 m, è la seconda cima del massiccio e si raggiunge in
      circa cinque ore di marcia dal rifugio. Liburnija, a 1709 m, offre uno straordinario balcone panoramico
      sulle isole adriatiche; la salita parte dal rifugio alpino (480 m) con un tracciato ripido riservato a
      escursionisti esperti.


      Alla grotta Manita Peć si sale in un’ora e mezza dal parcheggio di Velika Paklenica. Le visite guidate
      si effettuano da maggio a ottobre, con partenze quotidiane in luglio, agosto e settembre. La visita dura
      circa 30 minuti con una temperatura interna costante di 9 °C.


      Il centro visite «I segreti sotterranei di Paklenica» è allestito negli ex bunker militari scavati
      dall’esercito jugoslavo tra il 1950 e il 1953 nella gola di Velika Paklenica. Inaugurato nell’agosto
      2016, comprende due sale: «Caratteristiche naturali del Velebit» e «Patrimonio culturale e abitanti del
      Velebit». Aperto da aprile a ottobre.
    history: >-
      Circa ottomila anni fa le prime comunità neolitiche di pastori e agricoltori si stabilirono alle pendici
      del Velebit con grano, capre e pecore. Il parco venne istituito il 19 ottobre 1949 per salvaguardare il
      più spettacolare e intatto manto forestale della Dalmazia. Riserva della biosfera UNESCO dal 1978, è
      entrato in Natura 2000 nel 2014 e nel 2017 è divenuto Patrimonio Mondiale: nel 2017 le faggete vetuste
      del parco sono state incluse nel sito UNESCO «Antiche faggete primordiali dei Carpazi e di altre regioni
      d’Europa».


      La flora annovera oltre 1.000 specie e sottospecie botaniche, con ben 79 endemismi.
    before: >-
      È severamente vietato allontanarsi dai sentieri segnati e cogliere piante o fiori. Per proteggere la
      natura selvaggia della gola di Mala Paklenica e i rari rapaci nidificanti, l’arrampicata sportiva è
      vietata in questo canyon. I mesi ideali sono aprile, maggio, giugno, settembre e ottobre.
    around: '[Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) dista 9 km.'
  pt:
    intro: >-
      Imagina dois desfiladeiros caindo a pique desde os cumes do Velebit até ao mar. Em Mala Paklenica, as
      escarpas atingem 300 metros e no ponto mais apertado a garganta tem apenas 10 metros de largura; em
      Velika Paklenica, o vale prolonga-se por 14,5 km e num troço de cerca de 3 km, entre Anića Kuk e
      Marasovići, aperta-se num canhão com escassas dezenas de metros de largura e até 400 de profundidade. O
      Parque Nacional de Paklenica protege esses dois cursos torrenciais e as alturas circundantes, somando 95
      km² que acolhem os pontos mais altos do Velebit: o Vaganski Vrh e o Sveto Brdo.
    landscape: >-
      O relevo organiza-se em torno das gargantas de Velika Paklenica e Mala Paklenica, escavadas
      verticalmente nas vertentes sul do Velebit. Em certos passos de Velika Paklenica, blocos colossais
      desprendidos das paredes obstruem o leito formando rápidos e quedas de água.


      Conforme se ganha altitude, a paisagem vegetal transforma-se. O parque reúne oito comunidades florestais
      sustentadas por um desnível de 20 a 1757 m. Nos cumes medra o pinheiro-das-rochas (mugo), na maior e
      mais densa mancha contínua deste pinheiro em território croata. Mais abaixo, o
      [pinheiro-larício](/especie/pinus_nigra/) forma bosques raros em solos esqueléticos entre 700 e 1200 m;
      foi esta árvore que deu nome ao parque, já que Paklenica deriva muito provavelmente de «paklina», a
      resina do pinheiro-larício outrora utilizada para fins medicinais, tochas e impermeabilização de
      embarcações de madeira. Sob o pinhal desabrocha em março a urze-de-inverno, conferindo grande beleza aos
      trilhos no final da estação fria.


      No subsolo esconde-se a Manita Peć, a 570 m, a mais afamada das 115 grutas inventariadas no parque e a
      única aberta a visitas guiadas, ostentando amplas salas com estalactites abertas ao público desde 1937.
    wildlife: >-
      Foram identificadas 260 espécies de aves, das quais 165 nidificam no parque ou na sua periferia. Nas
      arribas rochosas nidificam 24 espécies, com destaque para a trepadeira-azul e o melro-das-rochas. Entre
      as rapinas raras contam-se a [águia-real](/especie/aquila_chrysaetos/), o
      [falcão-peregrino](/especie/falco_peregrinus/), a águia-cobreira e o açor, enquanto o
      [bufo-real](/especie/bubo_bubo/) nidifica regularmente em ambas as gargantas. O
      [abutre-fouveiro](/especie/gyps_fulvus/) chegou a ter três casais reprodutores até finais de 1999,
      extinguindo-se no parque devido ao declínio do pastoreio e ao veneno lançado contra lobos.


      Ocorrem 53 espécies de mamíferos, incluindo corço, [veado-vermelho](/especie/cervus_elaphus/),
      [camurça](/especie/rupicapra_rupicapra/) e [javali](/especie/sus_scrofa/), bem como os três grandes
      carnívoros: [urso-pardo](/especie/ursus_arctos/), [lobo](/especie/canis_lupus/) e
      [lince-euroasiático](/especie/lynx_lynx/).


      Nos anfíbios e répteis contam-se 31 espécies, 11 das quais cobras; as únicas venenosas são a
      víbora-cornuda e a rara [víbora-de-orsini](/especie/vipera_ursinii/). Foram catalogadas mais de 100
      espécies de borboletas diurnas, sendo a borboleta-pavão-noturna facilmente observável.
    visit: >-
      Caminhar é a melhor forma de explorar Paklenica: existem entre 150 e 200 km de trilhos marcados, desde
      passeios fáceis de vale até Manita Peć, à casa florestal de Lugarnica e ao refúgio de montanha, até
      subidas alpinas aos cumes do Velebit. Todos os caminhos apresentam marcas vermelhas e brancas e
      sinalização nos cruzamentos.


      Para coroar os picos há três propostas. O Vaganski Vrh, com 1757 m, é o cume mais elevado do Velebit,
      apresentando um topo amplo e relvado; em dias limpos a vista alcança o maciço de Risnjak, a 150 km. O
      Sveto Brdo, com 1753 m, é o segundo pico do Velebit e atinge-se em cerca de cinco horas de marcha a
      partir do refúgio. Liburnija, a 1709 m, é um dos mais sublimes miradouros do Velebit; a ascensão parte
      do refúgio alpino (480 m) por um trilho muito inclinado, indicado apenas a montanhistas experientes.


      À gruta Manita Peć sobe-se em hora e meia a partir do parque de estacionamento de Velika Paklenica.
      Visita-se de maio a outubro, com horários diários em julho, agosto e setembro. A visita guiada dura
      cerca de 30 minutos e a temperatura interna é de 9 °C constantes.


      O centro de visitantes «Segredos Subterrâneos de Paklenica» está instalado nos antigos túneis militares
      construídos pelo exército jugoslavo entre 1950 e 1953 no desfiladeiro de Velika Paklenica. Abriu em
      agosto de 2016 e conta com duas salas: «Valores Naturais do Velebit» e «Património Cultural e Habitantes
      do Velebit». Aberto de abril a outubro.
    history: >-
      Há cerca de oito mil anos instalaram-se nas encostas do Velebit os primeiros pastores e agricultores
      neolíticos com trigo, cabras e ovelhas. O parque foi criado em 19 de outubro de 1949 para salvaguardar a
      mais notável mancha florestal da Dalmácia. É Reserva da Biosfera da UNESCO desde 1978, integra a rede
      Natura 2000 desde 2014 e desde 2017 é Património Mundial: em 2017 os faiais do parque foram incluídos no
      sítio transnacional da UNESCO «Florestas Primárias e Antigas de Faias dos Cárpatos e de Outras Regiões
      da Europa».


      A flora reúne mais de 1.000 espécies e subespécies de plantas, sendo 79 endémicas.
    before: >-
      É expressamente proibido sair dos trilhos assinalados e colher flores ou plantas. Para resguardar o meio
      agreste de Mala Paklenica e a sua avifauna rupícola, a escalada está proibida nesse desfiladeiro. Os
      meses ideais para caminhadas são abril, maio, junho, setembro e outubro.
    around: '[Rewilding Velebit Plains](/lugar/rewilding-velebit-plains/) dista 9 km.'
