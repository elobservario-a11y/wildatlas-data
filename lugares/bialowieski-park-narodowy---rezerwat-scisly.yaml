unico:
  es: >-
    Es un bosque antiguo de gran escala, con extensas zonas intactas donde los procesos naturales siguen su
    curso, y solo se pisa acompañado de un guía.
  en: >-
    A large-scale ancient forest with vast untouched zones where natural processes run their course,
    accessible only on foot with a guide.
  fr: >-
    Une vaste forêt ancienne aux secteurs intacts où les processus naturels suivent leur cours, accessible
    uniquement à pied avec un guide.
  de: >-
    Ein großflächiger, uralter Wald mit weiten unberührten Zonen, in denen natürliche Prozesse ablaufen, nur
    zu Fuß und mit Führung zugänglich.
  it: >-
    Una foresta antica su vasta scala, con ampie aree intatte dove i processi naturali continuano
    indisturbati, accessibile solo a piedi con una guida.
  pt: >-
    Uma floresta antiga de grande escala, com amplas zonas intactas onde os processos naturais seguem o seu
    curso, acessível apenas a pé com guia credenciado.
observaciones:
  es: >-
    La entrada a la reserva estricta exige guía con licencia. Fuera de las rutas habilitadas no se puede
    caminar. Los equipamientos del entorno tienen temporada: el museo distingue una temporada turística, de
    mediados de abril a mediados de octubre, y otra fuera de temporada el resto del año. El pabellón del
    bisonte abre a diario de mediados de abril a mediados de octubre. La web del gestor publica comunicados
    con las incidencias de las rutas.
texto:
  es:
    intro: >-
      La frontera entre Polonia y Bielorrusia cruza un bosque, y el bosque no entiende de fronteras. Es el
      bosque de Białowieża, un complejo de bosques bajos de los que son propios de los bosques mixtos
      centroeuropeos, inscrito por la UNESCO en 1979 y ampliado después hasta formar un bien transfronterizo
      de 141.885 hectáreas. En su corazón polaco queda el antiguo Rezerwat Ścisły, la reserva estricta, entre
      los ríos Hwoźna y Narewka. Aquí los árboles viejos se caen, se pudren y vuelven al suelo sin que nadie
      los retire, y por eso el lugar es un laboratorio vivo de cómo funciona un bosque cuando se le deja.
    landscape: >-
      Lo primero que debes entender es que este bosque es llano y mezclado. No hay un paisaje, hay varios, y
      cambian con el agua y con el suelo. Donde el suelo es pobre, los pinares se asientan sobre podzoles que
      nacen de la arena. Donde hay humedad, aparecen las alisedas pantanosas que los polacos llaman olsy. Y
      entre unos y otros se extienden los bosques de tilo, carpe y roble.


      Lo que da carácter al lugar está en el suelo y en los troncos. La abundancia de madera muerta, en pie y
      caída, sostiene una gran diversidad de hongos y de invertebrados que viven de la madera. Con ese
      material trabaja todo el bosque: el rozmiazg kolweński, uno de los escarabajos de la madera muerta de la
      zona estricta, es solo un ejemplo.


      Un dato que sitúa el clima: la temperatura media anual del parque ronda los 6,8 °C.
    wildlife: >-
      El símbolo del bosque es el [bisonte europeo](/especie/bison_bonasus/). Pero el bosque grande e íntegro
      mantiene redes tróficas completas, con poblaciones viables de grandes carnívoros: el
      [lobo](/especie/canis_lupus/), el [lince](/especie/lynx_lynx/) y la [nutria](/especie/lutra_lutra/). En
      total, la propiedad alberga 59 especies de mamíferos, más de 250 de aves, 13 de anfibios, 7 de reptiles
      y más de doce mil de invertebrados.


      Entre las aves, fíjate en las del bosque viejo: el [pico dorsiblanco](/especie/dendrocopos_leucotos/),
      el [pico tridáctilo](/especie/picoides_tridactylus/), el [papamoscas
      acollarado](/especie/ficedula_albicollis/) y el [mochuelo boreal](/especie/glaucidium_passerinum/). El
      pico tridáctilo figura entre las aves singulares del núcleo protegido, junto al dorsiblanco. Y entre los
      árboles, la pícea, la świerk de los polacos, comparte el bosque con los tilos, los carpes y los robles.
    visit: >-
      Aquí la visita tiene una regla clara: la reserva estricta se recorre a pie, por senderos definidos y con
      un guía con licencia vigente del director del parque. No se permite abandonar las rutas turísticas y
      senderos habilitados.


      La ruta principal del núcleo estricto, Do Dębu Jagiełły, suma 7 km en total, de los cuales 4 km
      transcurren dentro del antiguo núcleo estricto. No está señalizada sobre el terreno, así que el guía no
      es un lujo, es el mapa. En la zona de protección estricta de Orłówka hay además un sendero de cuatro
      kilómetros, en parte sobre pasarela, disponible para todos los visitantes.


      Para entender lo que has visto, o lo que no vas a ver, hay equipamientos fuera de la reserva. El Museo
      de la Naturaleza y el Bosque, en Park Pałacowy, explica la naturaleza y la historia del macizo y muestra
      la vida subterránea del bosque y sus invertebrados. Ofrece audioguías en polaco, inglés, alemán y ruso,
      y la exposición permanente se recorre en una hora. Tiene rampa en la entrada y, en el vestíbulo de
      información turística, un plano táctil del parque. La torre del museo permanece cerrada por obras en la
      cubierta y en la propia torre.


      El pabellón educativo de Rezerwat Pokazowy Żubrów, junto a la carretera Hajnówka–Białowieża, tiene una
      exposición interactiva sobre el bisonte y un punto de información turística, con plataforma para sillas
      de ruedas hasta el nivel inferior. En Park Pałacowy hay además dos senderos educativos, Drzewa Parku
      Pałacowego, sobre los árboles, y Zabytki Parku Pałacowego, sobre historia; ambos admiten sillas de
      ruedas. El centro educativo J. J. Karpiński ofrece actividades de campo para niños, jóvenes y adultos.
    history: >-
      Los vestigios humanos más antiguos del macizo se remontan al Neolítico. En el núcleo protegido
      sobreviven túmulos de época altomedieval y huellas de la producción de carbón vegetal: el hombre pasó, y
      el bosque guardó sus marcas.


      Hoy el bien cuenta con protección legal e institucional en Polonia y Bielorrusia. El ministerio polaco
      anunció la firma del nuevo plan de gestión, con un horizonte de 25 años. Un problema sigue abierto: la
      UNESCO señala que las carreteras, los cortafuegos y la valla fronteriza son barreras a la conectividad
      del conjunto transfronterizo. Por el este, el antiguo núcleo estricto limita con el parque bielorruso
      Bieławieżskaja Puszcza.
    before: >-
      La entrada a la reserva estricta exige guía con licencia. Fuera de las rutas habilitadas no se puede
      caminar. Los equipamientos del entorno tienen temporada: el museo distingue una temporada turística, de
      mediados de abril a mediados de octubre, y otra fuera de temporada el resto del año. El pabellón del
      bisonte abre a diario de mediados de abril a mediados de octubre. La web del gestor publica comunicados
      con las incidencias de las rutas.
    around: >-
      Este bosque no tiene vecinos cercanos en el atlas, pero sí un gemelo al otro lado de la frontera, el
      [Belovezhskaya Pushcha - Sector Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/), que forma
      parte del mismo bosque. Entre los lugares afines, la [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) comparte el papamoscas acollarado, el pico
      dorsiblanco y el lince, además del bosque primario. El [Boubínský Prales](/lugar/boubinsky-prales/)
      coincide en el mochuelo boreal, el pico tridáctilo y el dorsiblanco. Y el [Puszcza Borecka - Obszar
      Natura 2000](/lugar/puszcza-borecka---obszar-natura-2000/) suma el bisonte europeo al papamoscas y al
      pico dorsiblanco.
  en:
    intro: >-
      The border between Poland and Belarus cuts through a forest, and the forest knows nothing of borders.
      This is the forest of Białowieża, a lowland forest complex typical of Central European mixed woodlands,
      inscribed by UNESCO in 1979 and later expanded into a transboundary property covering 141,885 hectares.
      In its Polish heartland lies the historic Rezerwat Ścisły, the strict reserve, cradled between the
      Hwoźna and Narewka rivers. Here ancient trees topple, decay, and return to the soil without anyone
      clearing them, creating a living laboratory of how a woodland behaves when left entirely alone.
    landscape: >-
      The first thing you notice is that this forest is flat and wonderfully mixed. It is not a single
      landscape, but several, shifting with moisture and soil type. Where soils are poorest, pine woods stand
      on podzols weathered from sand. Where water gathers, swamp alder groves known locally as olsy take hold.
      Between the two stretch rich stands of lime, hornbeam, and oak.


      The real character of the place lies on the forest floor and in the standing trunks. Abundant deadwood,
      both upright snags and fallen boles, supports an astonishing diversity of fungi and wood-dwelling
      invertebrates. The entire forest ecosystem runs on this material: Pytho kolwensis, one of the relic
      saproxylic beetles endemic to the strict reserve, is just one example.


      A climate detail sets the scene: the park's mean annual temperature hovers around 6.8 °C.
    wildlife: >-
      The emblem of the forest is the [European bison](/especie/bison_bonasus/). Yet this vast, unbroken
      woodland sustains complete food webs, including viable populations of large carnivores: the [grey
      wolf](/especie/canis_lupus/), the [Eurasian lynx](/especie/lynx_lynx/), and the [Eurasian
      otter](/especie/lutra_lutra/). In total, the property supports 59 mammal species, over 250 bird species,
      13 amphibians, 7 reptiles, and more than twelve thousand invertebrates.


      Among birds, look for old-growth forest specialists: the [white-backed
      woodpecker](/especie/dendrocopos_leucotos/), the [three-toed
      woodpecker](/especie/picoides_tridactylus/), the [collared flycatcher](/especie/ficedula_albicollis/),
      and the [Eurasian pygmy owlet](/especie/glaucidium_passerinum/). The three-toed woodpecker stands out
      among the core reserve's iconic species alongside the white-backed woodpecker. And among the canopy
      trees, Norway spruce—the świerk of Polish tradition—shares space with limes, hornbeams, and oaks.
    visit: >-
      Visiting here is governed by a strict rule: the strict reserve can only be explored on foot, along
      designated paths, and accompanied by a guide licensed by the park director. Straying from approved
      tourist paths and designated trails is strictly forbidden.


      The primary route through the core zone, Do Dębu Jagiełły, covers 7 km in total, of which 4 km wind
      through the historic strict reserve. It is not signposted on the ground, so your guide is not a
      luxury—they are your map. In the Orłówka strict protection zone, there is also a four-kilometre trail,
      partly on wooden boardwalks, open to all visitors.


      To appreciate what you have seen, or what remains hidden in the undergrowth, several facilities exist
      outside the reserve. The Nature and Forest Museum in Park Pałacowy explains the ecology and history of
      the massif, highlighting subterranean life and forest invertebrates. It provides audio guides in Polish,
      English, German, and Russian, with a permanent exhibition that takes about an hour to tour. It has
      wheelchair ramp access at the entrance and a tactile relief map of the park in the tourist information
      lobby. The museum tower remains closed due to roofing and structural works.


      The educational pavilion at the Rezerwat Pokazowy Żubrów, along the Hajnówka–Białowieża road, features
      an interactive bison exhibition and a visitor information desk, with wheelchair lift access to the lower
      level. Within Park Pałacowy there are also two self-guided nature trails, Drzewa Parku Pałacowego
      (focusing on trees) and Zabytki Parku Pałacowego (focusing on cultural heritage); both are wheelchair
      accessible. The J. J. Karpiński nature education centre runs guided fieldwork programmes for children,
      young people, and adults.
    history: >-
      The earliest traces of human presence in the forest date back to the Neolithic. Within the protected
      core, early medieval burial mounds survive alongside remnants of historical charcoal burning: humans
      came and went, but the forest absorbed and preserved their marks.


      Today the area enjoys legal and institutional protection across both Poland and Belarus. The Polish
      ministry recently announced the approval of a new management plan with a 25-year horizon. One ongoing
      challenge remains: UNESCO highlights that roads, firebreaks, and the border barrier create obstacles to
      ecological connectivity across the transboundary expanse. To the east, the historic strict reserve
      borders Belarus's Bieławieżskaja Puszcza National Park.
    before: >-
      Entering the strict reserve requires a licensed guide. Walking outside designated paths is prohibited.
      Nearby visitor facilities operate seasonally: the museum distinguishes a peak tourist season from
      mid-April to mid-October, with reduced hours during the rest of the year. The bison show reserve
      pavilion opens daily from mid-April to mid-October. The park management website regularly publishes
      announcements regarding trail conditions and closures.
    around: >-
      This forest has no immediate neighbours in the atlas, but it has a twin just across the border:
      [Belovezhskaya Pushcha - Sector Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/), which forms
      part of the same woodland complex. Among similar ancient woodland habitats, [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) shares the collared flycatcher, white-backed
      woodpecker, and lynx in a pristine forest setting. [Boubínský Prales](/lugar/boubinsky-prales/) shares
      the pygmy owl, three-toed woodpecker, and white-backed woodpecker. And [Puszcza Borecka - Obszar Natura
      2000](/lugar/puszcza-borecka---obszar-natura-2000/) adds the European bison alongside the flycatcher and
      white-backed woodpecker.
  fr:
    intro: >-
      La frontière entre la Pologne et la Biélorussie traverse une forêt, et la forêt ignore les frontières.
      C'est la forêt de Białowieża, un massif forestier de plaine caractéristique des forêts mixtes d'Europe
      centrale, inscrit au patrimoine mondial de l'UNESCO en 1979 et agrandi pour former un bien
      transfrontalier de 141 885 hectares. Dans son cœur polonais se trouve l'ancien Rezerwat Ścisły, la
      réserve intégrale, nichée entre les cours d'eau Hwoźna et Narewka. Ici, les vieux arbres s'effondrent,
      se décomposent et retournent au sol sans que nul ne les ramasse : c'est un laboratoire vivant du
      fonctionnement d'une forêt livrée à elle-même.
    landscape: >-
      La première chose à comprendre est que cette forêt est plane et remarquablement diverse. Il n'existe pas
      un paysage unique, mais plusieurs, variant selon l'humidité et la nature du sol. Là où le substrat est
      pauvre, les pinèdes s'implantent sur des podzols formés sur sables. Là où l'eau affleure se développent
      des aulnaies marécageuses appelées olsy en polonais. Entre les deux s'étendent de riches peuplements de
      tilleuls, de charmes et de chênes.


      Ce qui forge la véritable identité des lieux se découvre au sol et sur les fûts des arbres. L'abondance
      de bois mort, sur pied ou au sol, soutient une incroyable diversité de champignons et d'invertébrés
      saproxyliques. L'écosystème entier se nourrit de cette matière : Pytho kolwensis, l'un des coléoptères
      inféodés au bois mort de la zone intégrale, en est une parfaite illustration.


      Un indice éclaire le climat local : la température moyenne annuelle du parc avoisine 6,8 °C.
    wildlife: >-
      L'emblème de la forêt demeure le [bison d'Europe](/especie/bison_bonasus/). Pourtant, l'intégrité de ce
      vaste massif maintient des réseaux trophiques complets, dotés de populations viables de grands
      prédateurs : le [loup](/especie/canis_lupus/), le [lynx boréal](/especie/lynx_lynx/) et la [loutre
      d'Europe](/especie/lutra_lutra/). Au total, le bien abrite 59 espèces de mammifères, plus de 250 espèces
      d'oiseaux, 13 d'amphibiens, 7 de reptiles et plus de douze mille d'invertébrés.


      Parmi les oiseaux, observez les espèces des vieilles forêts : le [pic à dos
      blanc](/especie/dendrocopos_leucotos/), le [pic tridactyle](/especie/picoides_tridactylus/), le
      [gobemouche à collier](/especie/ficedula_albicollis/) et la [chevêchette
      d'Europe](/especie/glaucidium_passerinum/). Le pic tridactyle figure parmi les hôtes remarquables du
      cœur protégé aux côtés du pic à dos blanc. Et dans la canopée, l'épicéa commun—la świerk des
      Polonais—partage la forêt avec les tilleuls, charmes et chênes.
    visit: >-
      La visite obéit à une règle stricte : la réserve intégrale se découvre uniquement à pied, sur des
      sentiers balisés et obligatoirement en compagnie d'un guide titulaire d'une licence délivrée par le
      directeur du parc. Il est interdit de s'écarter des itinéraires touristiques et sentiers aménagés.


      Le parcours principal du cœur de réserve, Do Dębu Jagiełły, totalise 7 km au total, dont 4 km
      s'effectuent à l'intérieur de l'ancienne zone intégrale. Il n'est pas fléché sur le terrain : le guide
      n'est pas un confort, c'est votre boussole. Dans le secteur de protection intégrale d'Orłówka existe en
      outre un sentier de quatre kilomètres, en partie sur passerelles en bois, accessible à tous les
      visiteurs.


      Pour prolonger votre visite et appréhender ce qui reste caché, des aménagements existent hors de la
      réserve. Le musée de la nature et de la forêt, dans le Park Pałacowy, détaille la faune, la flore et
      l'histoire du massif tout en illustrant la vie souterraine et le monde des invertébrés. Il propose des
      audioguides en polonais, anglais, allemand et russe, pour une visite d'environ une heure. Il dispose
      d'une rampe d'accès et d'un plan tactile dans le hall d'accueil. La tour du musée demeure fermée pour
      travaux.


      Le pavillon d'accueil de la réserve de présentation des bisons (Rezerwat Pokazowy Żubrów), le long de la
      route Hajnówka–Białowieża, abrite une exposition interactive sur le bison et un point d'information,
      avec plateforme d'accès pour fauteuils roulants vers le niveau inférieur. Dans le Park Pałacowy se
      trouvent deux sentiers thématiques, Drzewa Parku Pałacowego sur les arbres et Zabytki Parku Pałacowego
      sur le patrimoine historique, tous deux accessibles en fauteuil. Le centre éducatif J. J. Karpiński
      organise des ateliers de terrain pour enfants, scolaires et adultes.
    history: >-
      Les traces humaines les plus anciennes remontent au Néolithique. Dans le cœur protégé subsistent des
      tumulus du haut Moyen Âge et des vestiges de production de charbon de bois : l'homme a laissé son
      empreinte, et la forêt en a conservé les traces.


      Le massif bénéficie aujourd'hui d'une protection juridique et institutionnelle en Pologne et en
      Biélorussie. Le ministère polonais a officialisé le nouveau plan de gestion, établi pour un horizon de
      25 ans. Un défi demeure : l'UNESCO rappelle que les routes, coupe-feux et la clôture frontalière
      constituent des obstacles à la connectivité écologique transfrontalière. À l'est, l'ancienne réserve
      intégrale jouxte le parc biélorusse de Bieławieżskaja Puszcza.
    before: >-
      L'accès à la réserve intégrale nécessite impérativement un guide agréé. La marche en dehors des sentiers
      aménagés est strictement proscrite. Les équipements d'accueil appliquent des horaires saisonniers : le
      musée distingue une haute saison touristique, de la mi-avril à la mi-octobre, et une basse saison le
      reste de l'année. La réserve de présentation des bisons ouvre tous les jours de la mi-avril à la
      mi-octobre. Le site web officiel publie régulièrement les avis sur l'état des sentiers.
    around: >-
      Cette forêt n'a pas de voisins immédiats dans l'atlas, mais possède un jumeau par-delà la frontière : le
      [Belovezhskaya Pushcha - Sector Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/), partie
      intégrante du même massif. Parmi les espaces comparables, la [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) abrite également le gobemouche à collier, le pic
      à dos blanc et le lynx en forêt primaire. Le [Boubínský Prales](/lugar/boubinsky-prales/) partage la
      présence de la chevêchette d'Europe, du pic tridactyle et du pic à dos blanc. Et la [Puszcza Borecka -
      Obszar Natura 2000](/lugar/puszcza-borecka---obszar-natura-2000/) accueille le bison d'Europe aux côtés
      du gobemouche et du pic à dos blanc.
  de:
    intro: >-
      Die Grenze zwischen Polen und Belarus verläuft mitten durch einen Wald, und der Wald schert sich nicht
      um Grenzen. Es ist der Urwald von Białowieża, ein für mitteleuropäische Mischwälder typischer
      Tieflandwaldkomplex, der 1979 von der UNESCO zum Welterbe erklärt und später zu einem
      grenzüberschreitenden Schutzgebiet von 141.885 Hektar erweitert wurde. In seinem polnischen Herzen liegt
      das historische Rezerwat Ścisły, das strenge Naturreservat, eingebettet zwischen den Flüssen Hwoźna und
      Narewka. Hier stürzen uralte Bäume um, vermodern und kehren in den Boden zurück, ohne dass je jemand
      Hand anlegt: Ein lebendiges Freilandlabor dafür, wie ein Wald funktioniert, wenn man ihn sich selbst
      überlässt.
    landscape: >-
      Das Erste, was du verstehen musst: Dieser Wald ist flach und reich strukturiert. Es gibt nicht nur eine
      Landschaft, sondern viele, die sich je nach Boden und Grundwasser wandeln. Auf nährstoffarmen Sandböden
      wachsen Kiefernwälder auf Podsolen. Wo das Wasser staut, breiten sich Moor-Erlenbrüche aus, die auf
      Polnisch olsy heißen. Dazwischen erstrecken sich dichte Laubwälder aus Linden, Hainbuchen und Eichen.


      Was den wahren Charakter des Ortes prägt, liegt am Boden und an den Stämmen. Totholz in Hülle und Fülle,
      stehend wie liegend, ernährt eine gewaltige Vielfalt an Pilzen und holzbewohnenden Insekten. Der gesamte
      Wald arbeitet mit diesem Material: Pytho kolwensis, einer der seltenen Urwaldreliktkäfer der Kernzone,
      ist nur ein Beispiel dafür.


      Ein Klimawert zur Einordnung: Die mittlere Jahrestemperatur im Nationalpark liegt bei rund 6,8 °C.
    wildlife: >-
      Das Wappentier des Waldes ist der [Wisent](/especie/bison_bonasus/). Doch dieser weite, unversehrte Wald
      erhält vollständige Nahrungsketten aufrecht, mit stabilen Populationen großer Beutegreifer:
      [Wolf](/especie/canis_lupus/), [Eurasischer Luchs](/especie/lynx_lynx/) und [Eurasischer
      Fischotter](/especie/lutra_lutra/). Insgesamt beherbergt das Schutzgebiet 59 Säugetierarten, über 250
      Vogelarten, 13 Amphibien-, 7 Reptilienarten und mehr als zwölftausend wirbellose Tiere.


      Achte unter den Vögeln besonders auf die Bewohner alter Baumbestände:
      [Weißrückenspecht](/especie/dendrocopos_leucotos/), [Dreizehenspecht](/especie/picoides_tridactylus/),
      [Halsbandschnäpper](/especie/ficedula_albicollis/) und [Sperlingskauz](/especie/glaucidium_passerinum/).
      Der Dreizehenspecht zählt zusammen mit dem Weißrückenspecht zu den herausragenden Leitarten der
      Kernzone. Unter den Bäumen teilt sich die Gemeine Fichte – świerk auf Polnisch – das Kronendach mit
      Winterlinden, Hainbuchen und Stieleichen.
    visit: >-
      Für den Besuch gilt eine unumstößliche Regel: Die Kernzone darfst du nur zu Fuß, auf festgelegten Wegen
      und zwingend in Begleitung eines vom Parkleiter lizenzierten Naturführers betreten. Das Verlassen der
      ausgewiesenen touristischen Routen und Pfade ist strikt untersagt.


      Der Hauptweg im strengen Reservat, Do Dębu Jagiełły, ist insgesamt 7 km lang, wovon 4 km direkt durch
      das historische Schutzgebiet führen. Im Gelände gibt es keine Wegweiser; der Führer ist deine
      Orientierung. Im streng geschützten Teilgebiet Orłówka steht zudem ein vier Kilometer langer Pfad zur
      Verfügung, der teils über Holzstege führt und allen Besuchern offensteht.


      Um das Gesehene zu vertiefen oder Verborgenes zu verstehen, gibt es Einrichtungen außerhalb des
      Reservats. Das Natur- und Waldmuseum im Park Pałacowy veranschaulicht die Waldökologie und Geschichte
      des Massivs, beleuchtet das Bodenleben und die Welt der Wirbellosen. Audioguides sind auf Polnisch,
      Englisch, Deutsch und Russisch verfügbar; die Dauerausstellung lässt sich in rund einer Stunde
      besichtigen. Es gibt eine Zugangsrampe und einen taktilen Parkplan im Informationsfoyer. Der Museumsturm
      ist wegen Bauarbeiten geschlossen.


      Der Bildungspavillon am Schaugehege Rezerwat Pokazowy Żubrów an der Straße Hajnówka–Białowieża bietet
      eine interaktive Wisent-Ausstellung und Information, mit Hebebühne für Rollstühle. Im Park Pałacowy gibt
      es zwei Lehrpfade: Drzewa Parku Pałacowego zu Bäumen und Zabytki Parku Pałacowego zur Geschichte; beide
      sind barrierefrei. Das Bildungszentrum J. J. Karpiński bietet Freilandprogramme für Kinder, Jugendliche
      und Erwachsene.
    history: >-
      Die ältesten menschlichen Spuren im Waldmassiv reichen bis in die Jungsteinzeit zurück. Im Schutzgebiet
      zeugen frühmittelalterliche Grabhügel und Reste historischer Teerschwelerei davon, dass Menschen hier
      wirkten und der Wald ihre Spuren bewahrte.


      Heute steht das Gebiet in Polen und Belarus unter gesetzlichem Schutz. Das polnische Ministerium hat den
      neuen 25-jährigen Managementplan verabschiedet. Eine offene Herausforderung bleibt bestehen: Die UNESCO
      betont, dass Straßen, Brandschneisen und der Grenzzaun die ökologische Durchgängigkeit des
      grenzüberschreitenden Schutzgebiets beeinträchtigen. Im Osten grenzt das strenge Reservat direkt an den
      belarussischen Nationalpark Belaweschskaja Puschtscha.
    before: >-
      Der Zutritt zur Kernzone erfordert zwingend einen lizenzierten Guide. Außerhalb der markierten Wege ist
      das Begehen verboten. Die Besuchereinrichtungen haben saisonale Öffnungszeiten: Das Museum unterscheidet
      eine Hauptsaison von Mitte April bis Mitte Oktober und eine Nebensaison im restlichen Jahr. Der
      Wisent-Schaupavillon öffnet von Mitte April bis Mitte Oktober täglich. Auf der Website der
      Nationalparkverwaltung findest du aktuelle Hinweise zum Zustand der Routen.
    around: >-
      Dieser Urwald hat keine unmittelbaren Nachbarn im Atlas, wohl aber einen Zwilling jenseits der
      Staatsgrenze: [Belovezhskaya Pushcha - Sector Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/),
      der zum selben Waldgebiet gehört. Unter den vergleichbaren Urwäldern teilt die [Národná prírodná
      rezervácia Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) Halsbandschnäpper, Weißrückenspecht
      und Luchs. Der [Boubínský Prales](/lugar/boubinsky-prales/) weist Sperlingskauz, Dreizehenspecht und
      Weißrückenspecht auf. Und das Schutzgebiet [Puszcza Borecka - Obszar Natura
      2000](/lugar/puszcza-borecka---obszar-natura-2000/) beherbergt neben Halsbandschnäpper und
      Weißrückenspecht auch den Wisent.
  it:
    intro: >-
      Il confine tra Polonia e Bielorussia attraversa una foresta, e la foresta non conosce confini. È la
      foresta di Białowieża, un complesso forestale di pianura tipico dei boschi misti dell'Europa centrale,
      iscritto dall'UNESCO nel 1979 e successivamente ampliato fino a formare un bene transfrontaliero di
      141.885 ettari. Nel suo cuore polacco resta l'antico Rezerwat Ścisły, la riserva integrale, racchiusa
      tra i fiumi Hwoźna e Narewka. Qui gli alberi secolari cadono, marciscono e tornano al suolo senza che
      nessuno li rimuova: un laboratorio vivente su come funziona una foresta quando viene lasciata a se
      stessa.
    landscape: >-
      La prima cosa da capire è che questo bosco è pianeggiante e composito. Non c'è un solo paesaggio, ce ne
      sono diversi, che cambiano a seconda dell'acqua e del suolo. Dove il terreno è povero, le pinete
      crescono su podzol sabbiosi. Dove ristagna l'umidità, compaiono gli ontaneti palustri che i polacchi
      chiamano olsy. Tra gli uni e gli altri si estendono rigogliosi boschi di tiglio, carpino e quercia.


      Ciò che dona un carattere inconfondibile al luogo si trova a terra e sui tronchi. L'enorme quantità di
      legno morto, in piedi o abbattuto, sostiene una straordinaria varietà di funghi e invertebrati
      saproxilici. Con questo materiale lavora l'intero ecosistema: Pytho kolwensis, uno scarabeo del legno
      morto tipico della riserva integrale, ne è solo un esempio.


      Un dato climatico per inquadrare il territorio: la temperatura media annua nel parco si attesta intorno
      a 6,8 °C.
    wildlife: >-
      Il simbolo della foresta è il [bisonte europeo](/especie/bison_bonasus/). Eppure la vastità e
      l'integrità del bosco mantengono catene trofiche complete, con popolazioni vitali di grandi carnivori:
      il [lupo grigio](/especie/canis_lupus/), la [lince euroasiatica](/especie/lynx_lynx/) e la [lontra
      europea](/especie/lutra_lutra/). Complessivamente l'area protetta ospita 59 specie di mammiferi, oltre
      250 di uccelli, 13 di anfibi, 7 di rettili e più di dodicimila di invertebrati.


      Tra i volatili, osserva le specie delle foreste vetuste: il [picchio
      dorsobianco](/especie/dendrocopos_leucotos/), il [picchio tridattilo](/especie/picoides_tridactylus/),
      la [balia dal collare](/especie/ficedula_albicollis/) e la [civetta
      nana](/especie/glaucidium_passerinum/). Il picchio tridattilo figura tra gli uccelli più rappresentativi
      della zona protetta insieme al dorsobianco. Tra le chiome degli alberi, l'abete rosso—lo świerk dei
      polacchi—condivide il bosco con tigli, carpini e querce.
    visit: >-
      Qui la visita segue una norma inderogabile: la riserva integrale si esplora esclusivamente a piedi,
      lungo sentieri delimitati e obbligatoriamente accompagnati da una guida autorizzata dal direttore del
      parco. Non è consentito uscire dai percorsi turistici e dai sentieri tracciati.


      L'itinerario principale nel cuore della riserva, Do Dębu Jagiełły, si sviluppa per 7 km in totale, di
      cui 4 km all'interno della zona di protezione integrale originaria. Non presenta segnaletica sul
      terreno, quindi la guida rappresenta la tua mappa indispensabile. Nell'area di protezione rigorosa di
      Orłówka si trova inoltre un percorso di quattro chilometri, in parte su passerella in legno, accessibile
      a tutti.


      Per approfondire l'esperienza o comprendere ciò che rimane nascosto, all'esterno della riserva sorgono
      varie strutture. Il Museo della Natura e della Foresta, nel Park Pałacowy, illustra l'ecologia e la
      storia del massiccio, mostrando la vita del sottosuolo e gli invertebrati. Mette a disposizione
      audioguide in polacco, inglese, tedesco e russo, con una visita della mostra permanente di circa un'ora.
      Dispone di rampa d'accesso all'ingresso e di una mappa tattile del parco nell'atrio informazioni. La
      torre del museo resta chiusa per lavori di ristrutturazione.


      Il padiglione didattico della riserva dimostrativa del bisonte (Rezerwat Pokazowy Żubrów), lungo la
      strada Hajnówka–Białowieża, ospita un'esposizione interattiva sul bisonte e un centro informazioni, con
      piattaforma per sedie a rotelle verso il piano inferiore. Nel Park Pałacowy si snodano due sentieri
      didattici, Drzewa Parku Pałacowego dedicato agli alberi e Zabytki Parku Pałacowego sul patrimonio
      storico; entrambi sono accessibili in sedia a rotelle. Il centro didattico J. J. Karpiński propone
      attività sul campo per giovani e adulti.
    history: >-
      Le testimonianze umane più remote nel massiccio risalgono al Neolitico. Nel cuore protetto sopravvivono
      tumuli funerari altomedievali e resti della storica produzione di carbone di legna: l'uomo è passato, e
      la foresta ne ha serbato le tracce.


      Oggi il bene gode di tutela giuridica e istituzionale sia in Polonia sia in Bielorussia. Il ministero
      polacco ha annunciato l'adozione del nuovo piano di gestione, con un orizzonte di 25 anni. Rimane aperta
      una sfida importante: l'UNESCO sottolinea come strade, viali tagliafuoco e la barriera di confine
      costituiscano ostacoli alla continuità ecologica dell'insieme transfrontaliero. A oriente, la riserva
      integrale confina direttamente con il parco bielorusso Belavežskaja Pušča.
    before: >-
      L'accesso alla riserva integrale richiede obbligatoriamente una guida con regolare licenza. È vietato
      camminare al di fuori dei percorsi autorizzati. Le strutture informative nei dintorni osservano orari
      stagionali: il museo prevede un'alta stagione turistica, da metà aprile a metà ottobre, e orari ridotti
      nel resto dell'anno. La riserva dimostrativa del bisonte è aperta tutti i giorni da metà aprile a metà
      ottobre. Il portale web dell'ente parco pubblica regolari aggiornamenti sullo stato di percorribilità
      dei tracciati.
    around: >-
      Questo bosco non ha vicini a breve distanza nell'atlas, ma vanta un gemello dall'altro lato della
      frontiera: [Belovezhskaya Pushcha - Sector Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/),
      parte del medesimo ecosistema. Tra i luoghi affini, la [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) condivide la balia dal collare, il picchio
      dorsobianco e la lince in una foresta primaria intatta. Il [Boubínský Prales](/lugar/boubinsky-prales/)
      accoglie la civetta nana, il picchio tridattilo e il picchio dorsobianco. E l'area [Puszcza Borecka -
      Obszar Natura 2000](/lugar/puszcza-borecka---obszar-natura-2000/) affianca il bisonte europeo alla balia
      e al picchio dorsobianco.
  pt:
    intro: >-
      A fronteira entre a Polónia e a Bielorrússia rasga uma floresta, e a floresta nada sabe de fronteiras. É
      a floresta de Białowieża, um maciço florestal de planície representativo das florestas mistas
      centro-europeias, classificado pela UNESCO em 1979 e mais tarde alargado para criar um bem
      transfronteiriço de 141 885 hectares. No seu coração polaco subsiste o antigo Rezerwat Ścisły, a reserva
      integral, situada entre os rios Hwoźna e Narewka. Aqui as árvores centenárias tombam, decompõem-se e
      regressam ao solo sem que ninguém as recolha: um laboratório vivo do pulsar de uma floresta entregue a
      si mesma.
    landscape: >-
      O primeiro aspeto que deves compreender é que esta mata é plana e diversificada. Não existe uma paisagem
      única, mas várias, que mudam consoante a água e o solo. Onde o solo é pobre, os pinhais instalam-se
      sobre espodossolos arenosos. Onde a humidade acumula, surgem amiais pantanosos a que os polacos chamam
      olsy. E entre uns e outros medram densos bosques de tílias, cárpinos e carvalhos.


      O traço mais marcante do local descobre-se no chão e nos troncos. A enorme abundância de madeira morta,
      em pé e tombada, sustenta uma variedade fabulosa de fungos e invertebrados saproxílicos. Todo o
      ecossistema vive deste material: Pytho kolwensis, um dos escaravelhos da madeira morta característicos
      da reserva integral, é disso exemplo evidente.


      Um dado climático de enquadramento: a temperatura média anual no parque ronda os 6,8 °C.
    wildlife: >-
      O emblema supremo da floresta é o [bisonte-europeu](/especie/bison_bonasus/). Contudo, esta floresta
      íntegra sustenta cadeias tróficas completas, com núcleos viáveis de grandes predadores: o
      [lobo-cinzento](/especie/canis_lupus/), o [lince-euroasiático](/especie/lynx_lynx/) e a
      [lontra-europeia](/especie/lutra_lutra/). No seu conjunto, o território alberga 59 espécies de
      mamíferos, mais de 250 de aves, 13 de anfíbios, 7 de répteis e mais de doze mil de invertebrados.


      Entre as aves, procura as espécies típicas dos bosques velhos: o
      [pica-pau-de-dorso-branco](/especie/dendrocopos_leucotos/), o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/), o
      [papa-moscas-de-colar](/especie/ficedula_albicollis/) e o
      [mocho-pigmeu](/especie/glaucidium_passerinum/). O pica-pau-tridáctilo destaca-se entre as espécies mais
      singulares da zona protegida a par do dorso-branco. E no estrato arbóreo, o espruce-comum—o świerk dos
      polacos—reparte a floresta com tílias, cárpinos e carvalhos.
    visit: >-
      A visita obedece a uma regra categórica: a reserva integral percorre-se exclusivamente a pé, por trilhos
      definidos e com a presença obrigatória de um guia credenciado pela direção do parque. Não é permitido
      sair dos circuitos turísticos e dos caminhos autorizados.


      O trilho principal do núcleo estrito, Do Dębu Jagiełły, estende-se por 7 km no total, dos quais 4 km
      decorrem dentro da reserva integral histórica. Não se encontra balizado no terreno, pelo que o guia é a
      tua orientação indispensável. No setor de proteção integral de Orłówka existe ainda um percurso de
      quatro quilómetros, parcialmente assente em passadiços de madeira, acessível a todos os visitantes.


      Para aprofundar o que viste, ou compreender o que escapa ao olhar, existem infraestruturas fora da
      reserva. O Museu da Natureza e da Floresta, no Park Pałacowy, desvenda a ecologia e a história do
      maciço, exibindo o mundo subterrâneo e os invertebrados. Disponibiliza audioguias em polaco, inglês,
      alemão e russo, com uma visita de cerca de uma hora. Possui rampa de acesso na entrada e um mapa táctil
      do parque no átrio de informação. A torre do museu permanece encerrada para obras.


      O pavilhão de acolhimento da reserva de demonstração do bisonte (Rezerwat Pokazowy Żubrów), junto à
      estrada Hajnówka–Białowieża, apresenta uma exposição interativa sobre o bisonte e um balcão de apoio,
      com elevador para cadeiras de rodas até ao piso inferior. No Park Pałacowy existem dois trilhos
      educativos, Drzewa Parku Pałacowego sobre as árvores e Zabytki Parku Pałacowego sobre o património
      histórico; ambos são acessíveis em cadeira de rodas. O centro pedagógico J. J. Karpiński organiza
      atividades de campo para crianças e adultos.
    history: >-
      Os vestígios humanos mais remotos no maciço remontam ao Neolítico. Na zona protegida sobrevivem mamoas
      medievais e marcas da antiga produção de carvão vegetal: o ser humano passou por aqui, e a floresta
      guardou a sua memória.


      Hoje o património goza de amparo legal e institucional na Polónia e na Bielorrússia. O ministério polaco
      anunciou a aprovação do novo plano de gestão, com um horizonte de 25 anos. Subsiste um desafio complexo:
      a UNESCO alerta que as estradas, aceiros e a cerca fronteiriça impõem barreiras à conectividade
      ecológica da área transfronteiriça. A leste, a antiga reserva integral confina diretamente com o parque
      bielorrusso Belavezhskaya Pushcha.
    before: >-
      A entrada na reserva integral exige obrigatoriamente um guia credenciado. É proibido caminhar fora dos
      trilhos autorizados. Os centros de acolhimento funcionam em moldes sazonais: o museu distingue uma época
      turística alta, de meados de abril a meados de outubro, e época baixa no resto do ano. A reserva de
      exibição dos bisontes abre diariamente de meados de abril a meados de outubro. O sítio oficial da
      administração do parque publica avisos regulares sobre o estado dos acessos.
    around: >-
      Esta floresta não possui vizinhos contíguos no atlas, mas conta com um gémeo do outro lado da fronteira:
      [Belovezhskaya Pushcha - Sector Belaruso](/lugar/belovezhskaya-pushcha-sector-belaruso/), parte do mesmo
      maciço florestal. Entre os sítios com valores convergentes, a [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) partilha o papa-moscas-de-colar, o
      pica-pau-de-dorso-branco e o lince num bosque primitivo. O [Boubínský Prales](/lugar/boubinsky-prales/)
      partilha o mocho-pigmeu, o pica-pau-tridáctilo e o dorso-branco. E a reserva [Puszcza Borecka - Obszar
      Natura 2000](/lugar/puszcza-borecka---obszar-natura-2000/) soma o bisonte-europeu ao papa-moscas e ao
      pica-pau-de-dorso-branco.
