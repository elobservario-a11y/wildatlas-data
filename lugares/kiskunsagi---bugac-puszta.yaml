resumen:
  es: >-
    El sector más afamado de la Puszta de Kiskunság, conservando los rebaños de ganado gris húngaro y caballos
    esteparios.
  en: >-
    The most renowned expanse of the Kiskunság puszta, preserving herds of Hungarian Grey cattle and
    traditional steppe horses.
  fr: >-
    Le secteur le plus célèbre de la Puszta de Kiskunság, préservant les troupeaux de bœufs gris de Hongrie et
    de chevaux des steppes.
  de: >-
    Der berühmteste Teil der Kiskunság-Puszta mit Herden des Ungarischen Steppenrinds und traditionellen
    Puszta-Pferden.
  it: >-
    Il settore più rinomato della Puszta di Kiskunság, che tutela le mandrie di bovini grigi ungheresi e i
    cavalli della steppa.
  pt: >-
    A parcela mais afamada da Puszta de Kiskunság, preservando manadas de gado cinzento húngaro e cavalos
    estepários.
unico:
  es: >-
    Una puszta de arena con dunas, enebrales con álamos y rebaños de razas antiguas que llevan siglos formando
    parte del paisaje.
  en: >-
    A sandy puszta of dunes, juniper-poplar woodlands, and ancient heritage livestock breeds that have shaped
    the plains for centuries.
  fr: >-
    Une puszta sablonneuse de dunes, de genévriers, de peupliers et de troupeaux de races ancestrales
    façonnant les plaines depuis des siècles.
  de: >-
    Eine Sandpuszta aus Dünen, Wacholder-Pappel-Wäldern und uralten Haustierrassen, die seit Jahrhunderten die
    Landschaft prägen.
  it: >-
    Una puszta sabbiosa di dune, gineprai, pioppi e razze zootecniche storiche che plasmano il territorio da
    secoli.
  pt: >-
    Uma puszta de areia com dunas, zimbros, choupos e raças autóctones que moldam as planícies há vários
    séculos.
observaciones:
  es: >-
    Salirse de los senderos pone en riesgo a las aves que anidan en el suelo y a los animales del suelo, y
    daña la vegetación. En las partes estrictamente protegidas, marcadas con señales, solo se entra con
    permiso escrito del parque o con guía experto. El parque recomienda llegar en bicicleta o en tren y, si se
    va en coche, no ir solo. Normalmente no se puede acampar y el fuego solo se hace en los lugares señalados.
    Los perros deben ir con correa, y no se debe fotografiar a las aves cerca de sus nidos, porque las molesta
    mucho. En las exhibiciones pastoriles de Bugac se junta más gente.
texto:
  es:
    intro: >-
      Quien piense en una puszta húngara imagina una llanura sin un árbol. Bugac es lo contrario: es arena,
      sí, pero arena ondulada, con crestas y surcos que se suceden en orden apretado y desniveles de hasta 20
      metros. En el corazón del interfluvio entre el Danubio y el Tisza, Bugac es el núcleo más amplio del
      Parque Nacional de Kiskunság, con 11.488 hectáreas, y el más variado de relieve. Dos grandes cadenas de
      dunas ocupan casi el 70 % del territorio y, en el noreste, la arena baja hacia la puszta: pastos, ganado
      de razas antiguas.
    landscape: >-
      Las dunas de Bugac se parecen geomorfológicamente a las de Fülöpháza y Orgovány, otras unidades del
      parque. En Fülöpháza quedan las últimas dunas móviles de Hungría, donde el viento aún dibuja ondas en la
      arena. Aquí el viento ha dejado surcos, dunas y crestas erosionadas, y los puntos altos tenían tanta
      importancia para la gente local que tienen nombre: Messzelátó hegy, Lóállás, Betyár-állás y
      Pipagyújtó-hegy.


      Las cimas de las dunas y sus laderas empinadas mantienen vegetación abierta de estepa arenosa y
      enebrales antiguos con álamos. Esos enebrales, tolerantes a la sequía, ocupaban antes los valles entre
      dunas y ahora se han extendido a otros lugares; los incendios destruyeron rodales cerca de Bócsa y Bugac
      en las dos últimas décadas, y los de las dunas de Bugac se quemaron en 2012 y dejaron un paisaje yermo.


      Con la aridificación de la región se han secado los lagos de sosa y los humedales entre dunas, y los
      antiguos lagos de sosa de la puszta, que daban humedad a la fauna, están hoy secos de forma permanente.
      La vegetación original de la puszta se supone que era estepa arenosa cerrada.
    wildlife: >-
      La primavera empieza en la arena. A principios de primavera la arena se calienta enseguida en los bordes
      y claros del bosque y despierta la vida tras el invierno. Las primeras flores son Pulsatilla nigricans,
      Potentilla arenaria y Viola kitaibeliana. Las dunas alcanzan su máxima floración en mayo, y bajo los
      álamos de los enebrales aparecen tres orquídeas, entre ellas Epipactis bugacensis, descubierta en 1994 y
      conocida solo en el interfluvio Danubio-Tisza. En otoño llega el turno de Colchicum arenarium, una
      planta endémica que florece en las dunas arenosas.


      En cuanto a los animales, Bugac tiene aves comunes —el arrendajo euroasiático, el mirlo común, la paloma
      torcaz, la tórtola europea, la oropéndola europea—, y el [busardo ratonero](/especie/buteo_buteo/), cada
      vez más común, se ve girando en lo alto. Estorninos, grajillas y carracas europeas anidan en los huecos
      de los árboles. Entre los mamíferos, los conejos europeos escasean, mientras que el
      [jabalí](/especie/sus_scrofa/) y el [corzo](/especie/capreolus_capreolus/) han aumentado, y el [chacal
      dorado](/especie/canis_aureus/) ha regresado. Naturalistas del parque encontraron una población de Saga
      pedo, un saltamontes depredador de hasta 10 cm, el insecto más largo de Hungría. Las lagartijas de los
      Balcanes y verdes toman el sol, y la víbora de Orsini húngara (rákosi vipera) tiene protección
      internacional.


      Los animales que dan identidad a la puszta son el ganado: la [vaca](/especie/bos_taurus/) gris húngara,
      la oveja racka y el rebaño de caballos de Bugac, y las razas antiguas pertenecían a la ciudad de
      Kecskemét. Los rebaños de vaca gris húngara, oveja racka y cerdo mangalica que se crían aquí son un
      banco genético para la ganadería.
    visit: >-
      Se llega por el local Karikás de Bugac: de allí, un camino de tierra de 1,5 km lleva hasta el Museo del
      Pastor y las caballerizas, y en el punto donde se exponen las razas tradicionales empieza el Sendero de
      las Aves y los Árboles. El sendero mide setecientos metros, se recorre a pie en cualquier época del año
      y funciona mejor en primavera, a comienzos del verano o en otoño. Bordea un bosque mixto estrecho; más
      allá están las dunas de Bugac. Interpreta las especies arbóreas y arbustivas de la zona y explica
      técnicas prácticas para conservar las aves. Al dejarlo se llega a la llamada Carretera de la Excavadora,
      que se abrió en la década de 1950, cuando se usaron grandes excavadoras para abrir caminos entre las
      dunas durante la forestación masiva.


      El Museo del Pastor se construyó en 1975 con planos de József Kerényi y recuerda a los molinos de sequía
      de las llanuras. Explica la antigua cultura pastoral con una cabaña de caña, una carretilla, ovejas
      racka, perros pastores y herramientas, y un diorama cuenta la historia de la ganadería extensiva, la
      vida y el arte de los pastores y la fauna de la puszta y de los bosques sobre arena. Junto al museo
      quedan unos robles albares de 150 años, restos del antiguo robledal estepario.


      En Kecskemét está el centro de visitantes de la dirección del parque, con exposiciones permanentes sobre
      la conservación en Hungría, los hábitats del interfluvio Danubio-Tisza y los oficios tradicionales.
    history: Bugac es un destino turístico importante desde hace casi un siglo.
    before: >-
      Salirse de los senderos pone en riesgo a las aves que anidan en el suelo y a los animales del suelo, y
      daña la vegetación. En las partes estrictamente protegidas, marcadas con señales, solo se entra con
      permiso escrito del parque o con guía experto. El parque recomienda llegar en bicicleta o en tren y, si
      se va en coche, no ir solo. Normalmente no se puede acampar y el fuego solo se hace en los lugares
      señalados. Los perros deben ir con correa, y no se debe fotografiar a las aves cerca de sus nidos,
      porque las molesta mucho. En las exhibiciones pastoriles de Bugac se junta más gente.
    around: >-
      Otros lugares del atlas comparten con Bugac la vaca y el caballo y los ambientes de estepa y pradera: el
      [Parque Nacional de Hortobágy - La Puszta Húngara](/lugar/hortobagyi-nemzeti-park---puszta/), la
      [Reserva Natural De Maashorst](/lugar/de-maashorst/), [Rewilding Llanuras de Lika /
      Velebit](/lugar/rewilding-velebit-plains/) y la [Puerta de Güeldres / Corredor del
      Rin](/lugar/gelderse-poort/).
  en:
    intro: >-
      Whoever imagines the Hungarian puszta usually pictures a featureless, tree-less plain. Bugac is quite
      the opposite: sand, yes, but undulating sand with wave-like dune crests, deep hollows, and elevation
      changes of up to 20 metres. In the heart of the Danube-Tisza interfluve, Bugac represents the largest
      reserve unit of Kiskunság National Park, covering 11,488 hectares, and the most geomorphologically
      varied. Two large dune ranges occupy almost 70 % of the territory, descending in the northeast towards
      open alkaline pastures grazed by ancient cattle breeds.
    landscape: >-
      The sand dunes of Bugac share geomorphological roots with Fülöpháza and Orgovány, other sectors of the
      park. At Fülöpháza lie the last shifting sand dunes in Hungary, where the wind still ripples the dunes.
      At Bugac, relentless winds have carved deflation furrows and blown-out ridges; prominent high dunes were
      so critical to local pastoral navigation that each bears a name: Messzelátó-hegy, Lóállás, Betyár-állás,
      and Pipagyújtó-hegy.


      The dry dune crests and slopes support open sand steppe grassland and ancient juniper-poplar groves.
      These drought-tolerant junipers once carpeted the interdunal hollows and gradually spread across the
      slopes; wildfires devastated stands near Bócsa and Bugac over the last two decades, and the Bugac dune
      junipers burned in 2012, leaving a scorched landscape.


      Regional aridification has desiccated the sodic ponds and interdunal wetlands that once hydrated
      wildlife across the puszta. The original vegetation before human disturbance was likely dense, closed
      steppe grassland.
    wildlife: >-
      Spring awakens on the warm sands. In early spring, bare sandy edges and forest clearings warm quickly
      under the sun, stirring life before the surrounding lowlands. First flowers include Pulsatilla
      nigricans, sand cinquefoil, and Viola kitaibeliana. The dunes reach peak bloom in May, when three rare
      orchids emerge beneath the shade of poplars, notably Epipactis bugacensis, discovered here in 1994 and
      endemic to the Danube-Tisza sands. Autumn brings Colchicum arenarium, an endemic sand crocus flowering
      across bare dunes.


      Birdlife includes familiar woodland and edge species—Eurasian jays, blackbirds, wood pigeons, European
      turtle doves, and golden orioles—while the [common buzzard](/especie/buteo_buteo/) wheels overhead in
      rising thermals. European rollers, jackdaws, and starlings nest in hollow trees. Among mammals, wild
      rabbits have declined while [wild boar](/especie/sus_scrofa/) and [roe
      deer](/especie/capreolus_capreolus/) thrive, alongside the recolonising [golden
      jackal](/especie/canis_aureus/). Naturalists discovered a population of the predatory bush-cricket Saga
      pedo, reaching up to 10 cm in length, Hungary's largest insect. Balkan green lizards bask on sand roads,
      while the Hungarian meadow viper enjoys international protection.


      The iconic living symbols of the puszta are its domestic herds: Hungarian Grey
      [cattle](/especie/bos_taurus/), spiral-horned Racka sheep, Mangalica pigs, and Bugac stud horses, whose
      historical bloodlines belonged to the town of Kecskemét, acting today as an indispensable gene bank.
    visit: >-
      Access begins at the Karikás Csárda in Bugac, from where a 1.5 km unpaved farm road leads to the
      Shepherd Museum and horse stables, where the Tree and Bird Nature Trail starts beside the heritage
      animal enclosures. The trail measures seven hundred metres, is walkable year-round, and proves most
      rewarding in spring, early summer, or autumn. It skirts a narrow woodland belt before reaching the
      dunes, with interpretive signs on native trees and practical bird conservation tips. It connects with
      the Excavator Road, cleared during the 1950s when heavy bulldozers carved firebreaks for reforestation
      programmes.


      The Shepherd Museum was built in 1975 to designs by József Kerényi, resembling the traditional dry mills
      of the Great Plain. It explains nomadic pastoral heritage through reed huts, oxcarts, tools, and
      dioramas of shepherd art. Beside the museum stand majestic pedunculate oaks dating back 150 years,
      remnants of ancient wooded steppe.


      In nearby Kecskemét, the National Park House visitor centre presents permanent exhibits on Hungarian
      nature conservation and traditional steppe crafts.
    history: Bugac has flourished as a major tourist and pastoral destination for nearly a century.
    before: >-
      Straying off marked trails damages delicate sandy soils and endangers ground-nesting birds. Strictly
      protected core areas, marked with warning signs, may only be entered with written park permits or
      licensed guides. Camping is prohibited and campfires are permitted only in designated areas. Keep dogs
      on leads, and avoid photographing birds near active nests.
    around: >-
      Other atlas destinations share traditional steppe grazing, Grey cattle, and vast grasslands with Bugac:
      [Hortobágy National Park - The Hungarian Puszta](/lugar/hortobagyi-nemzeti-park---puszta/), [De
      Maashorst Nature Reserve](/lugar/de-maashorst/), [Rewilding Velebit
      Plains](/lugar/rewilding-velebit-plains/), and [Gelderse Poort - Rhine
      Corridor](/lugar/gelderse-poort/).
  fr:
    intro: >-
      Quiconque songe à la puszta hongroise imagine une plaine nue sans un seul arbre. Bugac prouve le
      contraire : du sable, certes, mais un sable ondulé, jalonné de crêtes dunaires et de cuvettes accusant
      des dénivellations allant jusqu'à 20 mètres. Au cœur de l'interfluve Danube-Tisza, Bugac constitue le
      secteur le plus vaste du parc national de Kiskunság, avec 11 488 hectares, et le plus varié en relief.
      Deux grands cordons de dunes occupent près de 70 % du territoire avant de descendre vers la steppe
      pâturée par des races rustiques.
    landscape: >-
      Les dunes de Bugac s'apparentent aux massifs sableux de Fülöpháza et d'Orgovány. À Fülöpháza subsistent
      les dernières dunes vives de Hongrie, où le vent ride encore les sables. À Bugac, les rafales ont
      sculpté dépressions éoliennes et crêtes arasées, si capitales pour l'orientation des bergers qu'elles
      portent chacune un nom : Messzelátó-hegy, Lóállás, Betyár-állás et Pipagyújtó-hegy.


      Le sommet des dunes et leurs pentes portent une steppe sablonneuse ouverte ponctuée d'antiques
      genévriers et de peupliers blancs. Ces genévriers adaptés à la sécheresse ont souffert de violents
      incendies ces deux dernières décennies, et le grand incendie de 2012 a laissé un paysage minéral désolé.


      Avec l'aridification régionale, les mares temporaires et étangs salins de l'interdune se sont asséchés.
      Le couvert végétal d'origine était vraisemblablement une steppe sablonneuse dense.
    wildlife: >-
      Le printemps s'éveille en premier sur le sable. Dès les premiers redoux, le sable des lisières
      emmagasine la chaleur et réveille la végétation. Les premières corolles sont la pulsatille noirâtre, la
      potentille des sables et la pensée de Kitaibel. Les dunes fleurissent en mai, abritant sous les
      peupliers trois espèces d'orchidées dont Epipactis bugacensis, découverte en 1994 et strictement
      endémique de l'interfluve Danube-Tisza. En automne fleurit le colchique des sables.


      L'avifaune compte des espèces bocagères courantes comme le geai, le merle, le pigeon ramier, la
      tourterelle des bois et le loriot, tandis que la [buse variable](/especie/buteo_buteo/) plane dans les
      ascendances. Le rollier d'Europe et le choucas nichent dans les cavités d'arbres. Parmi les mammifères,
      le lapin de garenne se raréfie tandis que le [sanglier](/especie/sus_scrofa/) et le [chevreuil
      européen](/especie/capreolus_capreolus/) augmentent, et que le [chacal doré](/especie/canis_aureus/)
      s'est réinstallé. Les entomologistes ont identifié la magicienne dentelée (Saga pedo), sauterelle
      prédatrice pouvant atteindre 10 cm, le plus grand insecte de Hongrie. La vipère des steppes de Hongrie
      fait l'objet d'une protection internationale intégrale.


      L'âme de la puszta réside dans ses troupeaux traditionnels : la [vache](/especie/bos_taurus/) grise de
      Hongrie, le mouton racka à cornes torsadées, le porc mangalitza et les chevaux de Bugac, qui forment un
      conservatoire génétique irremplaçable.
    visit: >-
      On y accède par la Karikás Csárda de Bugac : de là, un chemin de terre de 1,5 km conduit au Musée du
      Pasteur et aux écuries, et à l'endroit où sont présentées les races traditionnelles commence le sentier
      des Arbres et des Oiseaux. Ce parcours mesure sept cents mètres, se visite à pied en toute saison et se
      montre plus propice au printemps, au début de l'été ou en automne. Il longe une bande boisée mixte avant
      de rejoindre les dunes de Bugac. Il présente les essences d'arbres et d'arbustes locales et enseigne des
      méthodes pratiques de protection des oiseaux. En le quittant, on rejoint la route dite de l'Excavatrice,
      tracée dans la décennie 1950 lorsque de lourds bulldozers ont été utilisés pour percer des chemins
      pare-feux à travers les dunes lors des grands reboisements.


      Le Musée du Pasteur a été édifié en 1975 selon les plans de József Kerényi, évoquant les moulins
      traditionnels des plaines. Il explique l'ancienne culture pastorale avec une hutte de roseau, une
      charrette, des moutons racka, des chiens de berger et des outils traditionnels, tandis qu'un diorama
      retrace l'élevage extensif, la vie quotidienne des bergers et la faune de la puszta et des sables. À
      côté du musée s'élèvent des chênes pédonculés âgés de 150 ans, vestiges de la forêt-steppe primitive.


      À Kecskemét, la Maison du Parc national présente des expositions permanentes sur l'histoire de la
      protection de la nature en Hongrie, les écosystèmes de l'interfluve Danube-Tisza et les métiers ruraux
      traditionnels.
    history: Bugac s'affirme comme un foyer touristique et pastoral réputé depuis près d'un siècle.
    before: >-
      S'écarter des sentiers balisés met en danger les oiseaux nichant au sol et la petite faune terrestre,
      tout en dégradant la végétation dunaire fragile. Dans les zones strictement protégées, signalées par des
      panneaux d'avertissement, l'accès n'est permis qu'avec une autorisation écrite de la direction du parc
      ou accompagné d'un guide expert. Le parc conseille de venir à vélo ou en train et d'éviter de voyager
      seul en voiture. Le camping sauvage est interdit et les feux ne sont autorisés que dans les foyers
      aménagés. Les chiens doivent impérativement être tenus en laisse, et il est formellement interdit de
      photographier les oiseaux à proximité immédiate de leurs nids. Lors des démonstrations pastorales de
      Bugac, l'affluence de visiteurs s'accroît nettement.
    around: >-
      D'autres sites de l'atlas partagent ces paysages de steppes et de pâturages ancestraux : le [Parc
      national de Hortobágy - La Puszta hongroise](/lugar/hortobagyi-nemzeti-park---puszta/), la [Réserve
      naturelle De Maashorst](/lugar/de-maashorst/), [Rewilding Plaines de
      Velebit](/lugar/rewilding-velebit-plains/) et la [Porte de Gueldre / Couloir du
      Rhin](/lugar/gelderse-poort/).
  de:
    intro: >-
      Wer an die ungarische Puszta denkt, stellt sich eine ebene, baumlose Weite vor. Bugac beweist das
      Gegenteil: Sand, ja, aber welliger Sand mit dicht aufeinanderfolgenden Dünenkämmen, Tälern und
      Höhenunterschieden von bis zu 20 Metern. Im Zentrum des Donau-Theiß-Zwischenstromlandes bildet Bugac mit
      11.488 Hektar das größte Teilgebiet des Kiskunság-Nationalparks und das reliefreichste. Zwei gewaltige
      Dünenzüge nehmen fast 70 % des Territoriums ein und laufen im Nordosten in flachere Weideflächen für
      alte Haustierrassen aus.
    landscape: >-
      Die Dünen von Bugac ähneln geomorphologisch den Sandfeldern von Fülöpháza und Orgovány. In Fülöpháza
      liegen die letzten aktiven Wanderdünen Ungarns, wo der Wind den Sand bewegt. In Bugac formte der Wind
      Wannen, Dünen und Kämme; markante Erhebungen waren für Hirten so wichtig, dass sie eigene Namen tragen:
      Messzelátó-hegy, Lóállás, Betyár-állás und Pipagyújtó-hegy.


      Dünenkämme und Steilhänge tragen offenen Sandsteppenrasen und lichte Wacholder-Pappel-Wälder. Diese
      trockenheitsresistenten Wacholderbestände litten in den letzten beiden Jahrzehnten unter Bränden; der
      verheerende Brand von 2012 verwandelte Teile der Dünen in eine vegetationslose Aschewüste.


      Durch regionale Austrocknung sind die einstigen Sodagewässer und Dünentäler verlandet. Als ursprüngliche
      Vegetation vor menschlicher Nutzung wird dichte Sandsteppe angenommen.
    wildlife: >-
      Der Frühling beginnt auf dem Sand. Im Vorfrühling erwärmt sich der offene Sand an Waldrändern rasch und
      weckt die Natur. Zu den ersten Frühlingsboten gehören Schwarze Kuhschelle, Sand-Fingerkraut und
      Kitaibels Stiefmütterchen. Im Mai erreichen die Dünen ihre Blütezeit, und unter Pappeln blühen drei
      Knabenkrautarten, darunter die 1994 beschriebene, im Zwischenstromland endemische Sumpfwurz Epipactis
      bugacensis. Im Herbst blüht die Sand-Herbstzeitlose.


      Die Vogelwelt umfasst Eichelhäher, Amsel, Ringeltaube, Turteltaube und Pirol, während der
      [Mäusebussard](/especie/buteo_buteo/) in der Thermik kreist. Blauracken, Dohlen und Stare nisten in
      Baumhöhlen. Bei den Säugetieren sind Wildkaninchen selten geworden, während
      [Wildschwein](/especie/sus_scrofa/) und [Reh](/especie/capreolus_capreolus/) zunahmen und der
      [Goldschakal](/especie/canis_aureus/) zurückkehrte. Entomologen wiesen die Große Sägeschrecke (Saga
      pedo) nach, die bis zu 10 cm lang wird und Ungarns größtes Insekt ist. Die Ungarische Wiesenotter
      genießt internationalen Artenschutz.


      Lebendige Denkmäler der Puszta sind die Nutztierherden: Ungarisches Steppenrind
      ([Hausrind](/especie/bos_taurus/)), Rackaschafe, Mangalica-Schweine und die Pferdeherde von Bugac, die
      bis heute als genetische Reserve dienen.
    visit: >-
      Ausgangspunkt ist die Karikás Csárda in Bugac: Von dort führt ein 1,5 km langer unbefestigter Feldweg
      zum Hirtenmuseum und den Stallungen, und genau dort, wo die traditionellen Nutztierrassen gezeigt
      werden, beginnt der Lehrpfad der Bäume und Vögel. Der Pfad misst siebenhundert Meter, lässt sich zu
      jeder Jahreszeit zu Fuß begehen und empfiehlt sich besonders im Frühling, Frühsommer oder Herbst. Er
      verläuft entlang eines schmalen Mischwaldstreifens; dahinter erstrecken sich die Sanddünen von Bugac.
      Entlang des Weges werden heimische Baum- und Straucharten vorgestellt sowie praktische
      Vogelschutzmaßnahmen vermittelt. Am Ende des Pfades erreicht man die sogenannte Baggerstraße, die in den
      1950er-Jahren planiert wurde, als während der großflächigen Aufforstung schwere Planierraupen
      Brandschneisen durch die Dünen trieben.


      Das 1975 nach Plänen von József Kerényi erbaute Hirtenmuseum erinnert an die historischen Göpelmühlen
      der Tiefebene. Es veranschaulicht die einstige Hirtenkultur anhand einer Schilfhütte, eines Fuhrwerks,
      traditioneller Gerätschaften sowie Rackaschafen und Hirtenhunden, während ein Diorama die extensive
      Weidewirtschaft, das Alltagsleben der Hirten und die Tierwelt der Puszta und Sandwälder darstellt. Neben
      dem Museum stehen 150 Jahre alte Stieleichen, ehrwürdige Überbleibsel des einstigen Steppenwaldes.


      In Kecskemét betreibt die Nationalparkverwaltung ihr zentrales Besucherzentrum mit Dauerausstellungen
      zum ungarischen Naturschutz, den Lebensräumen des Donau-Theiß-Zwischenstromlandes und dem traditionellen
      Handwerk.
    history: Bugac ist seit fast einem Jahrhundert ein bedeutendes Fremdenverkehrsziel.
    before: >-
      Das Verlassen der markierten Wege gefährdet bodenbrütende Vögel sowie Kleintiere des Bodens und
      beschädigt die empfindliche Sandvegetation. In den streng geschützten, beschilderten Kernzonen ist der
      Zutritt ausschließlich mit schriftlicher Genehmigung der Nationalparkverwaltung oder in Begleitung
      autorisierter Naturführer gestattet. Der Nationalpark empfiehlt die Anreise per Fahrrad oder Bahn und
      rät Autofahrern davon ab, allein zu reisen. Wildes Zelten ist untersagt und offenes Feuer darf
      ausschließlich an den offiziell ausgewiesenen Feuerstellen entzündet werden. Hunde müssen stets an der
      Leine geführt werden, und das Fotografieren von Vögeln in unmittelbarer Nähe ihrer Nester ist wegen der
      erheblichen Störung verboten. Bei den traditionellen Hirtenvorführungen in Bugac finden sich regelmäßig
      mehr Besucher ein.
    around: >-
      Weitere Landschaften des Atlas teilen Steppenbeweidung und Rinderherden mit Bugac: der
      [Hortobágy-Nationalpark – Die ungarische Puszta](/lugar/hortobagyi-nemzeti-park---puszta/), das
      [Naturschutzgebiet De Maashorst](/lugar/de-maashorst/), [Rewilding
      Velebit-Ebenen](/lugar/rewilding-velebit-plains/) und das [Gelderse Poort –
      Rheinkorridor](/lugar/gelderse-poort/).
  it:
    intro: >-
      Chi immagina la puszta ungherese pensa a una pianura spoglia senza alberi. Bugac offre l'opposto: sabbia
      mossa, ondulata in cordoni di dune, avvallamenti e dislivelli fino a 20 metri. Nel cuore
      dell'interfluvio tra Danubio e Tibisco, Bugac è il comprensorio più vasto del Parco nazionale di
      Kiskunság con 11.488 ettari e il più movimentato. Due grandi allineamenti dunali occupano quasi il 70 %
      del territorio scendendo verso i pascoli storici.
    landscape: >-
      Le dune di Bugac presentano affinità geomorfologiche con Fülöpháza e Orgovány. A Fülöpháza resistono le
      ultime dune mobili d'Ungheria modellate dal vento. A Bugac i venti hanno scavato conche e crinali; i
      punti cospicui erano essenziali per i pastori e portano nomi propri: Messzelátó-hegy, Lóállás,
      Betyár-állás e Pipagyújtó-hegy.


      I crinali ospitano steppa sabbiosa e boscaglie rade di ginepro e pioppo bianco. Questi gineprai aridi
      hanno subito incendi negli ultimi due decenni, e il grande rogo del 2012 ha lasciato una brughiera
      spoglia.


      L'inaridimento climatico ha prosciugato le conche sodiche e le zone umide un tempo frequentate dalla
      fauna. La copertura vegetale originaria era probabilmente una steppa chiusa.
    wildlife: >-
      La primavera si risveglia precocemente sulla sabbia. Nei primi tepori il terreno sabbioso scalda le
      radure richiamando la vita. Fioriscono la pulsatilla nerastra, la potentilla delle sabbie e la viola di
      Kitaibel. Le dune esplodono a maggio con tre orchidee spontanee, tra cui Epipactis bugacensis, scoperta
      nel 1994 ed endemica della zona. In autunno sboccia il colchico delle sabbie.


      Tra i volatili abbondano ghiandaie, merli, colombacci, tortore e rigogoli, con la [poiana
      comune](/especie/buteo_buteo/) che volteggia alta. Ghiandaie marine e gracchi nidificano nelle cavità
      arboree. Tra i mammiferi il coniglio selvatico si è fatto raro, mentre aumentano
      [cinghiale](/especie/sus_scrofa/) e [capriolo](/especie/capreolus_capreolus/) ed è rientrato lo
      [sciacallo dorato](/especie/canis_aureus/). È presente la cavalletta predatrice Saga pedo che tocca i 10
      cm, il più grande insetto ungherese. La vipera dell'Orsini ungherese gode di tutela assoluta.


      I simboli della puszta sono le mandrie storiche: la [vacca](/especie/bos_taurus/) grigia ungherese, la
      pecora racka dalle corna a spirale, il maiale mangalica e i cavalli di Bugac, autentico patrimonio
      genetico rurale.
    visit: >-
      Si accede dal locale Karikás Csárda di Bugac: da lì uno stradello sterrato di 1,5 km conduce al Museo
      del Pastore e alle scuderie, e nel punto in cui vengono esposte le razze tradizionali ha inizio il
      Sentiero degli Alberi e degli Uccelli. Il tracciato misura settecento metri, si percorre agevolmente a
      piedi in ogni stagione ed è ideale in primavera, a inizio estate o in autunno. Costeggia una stretta
      fascia boscata mista, oltre la quale si distendono le dune sabbiose di Bugac. Pannelli didattici
      illustrano le specie arboree e arbustive del territorio e insegnano accorgimenti pratici per la tutela
      dell'avifauna. Al termine si confluisce sulla cosiddetta Strada delle Ruspe, aperta negli anni 1950
      quando pesanti macchine operatrici aprirono varchi tagliafuoco tra le dune durante i rimboschimenti
      forestali.


      Il Museo del Pastore fu eretto nel 1975 su progetto di József Kerényi, richiamando nella forma i
      tradizionali mulini a secco della Grande Pianura. Documenta la cultura pastorale d'un tempo con capanne
      di canna, carretti, pecore racka, cani da pastore e attrezzi, mentre un diorama racconta la pastorizia
      estensiva, l'arte e la vita dei mandriani e la fauna della puszta e delle sabbie. Accanto al museo
      verdeggiano farnie storiche di 150 anni, relitti dell'antico bosco steppico.


      A Kecskemét sorge la Casa del Parco, centro visite dell'ente di gestione, con mostre stabili sulla
      storia della conservazione in Ungheria, gli habitat dell'interfluvio Danubio-Tibisco e gli antichi
      mestieri rurali.
    history: Bugac è una meta turistica e culturale celebrata da quasi un secolo.
    before: >-
      Uscire dai sentieri battuti mette a repentaglio gli uccelli che nidificano al suolo e la fauna
      terricola, oltre a degradare la delicata copertura vegetale della sabbia. Nelle zone di riserva
      integrale debitamente tabellate si accede soltanto previo permesso scritto della direzione del parco o
      accompagnati da una guida naturalistica accreditata. Il parco consiglia di arrivare in bicicletta o in
      treno e raccomanda a chi viaggia in auto di non muoversi da solo. Il campeggio libero non è consentito e
      i fuochi si possono accendere unicamente nei bracieri ufficiali. I cani vanno tenuti costantemente al
      guinzaglio, ed è severamente vietato fotografare gli uccelli vicino ai nidi per non provocarne
      l'abbandono. Durante le esibizioni pastorali di Bugac l'affluenza di visitatori è notevolmente più
      sostenuta.
    around: >-
      Altri comprensori dell'atlante condividono pascoli estesi e mandrie storiche con Bugac: il [Parco
      nazionale di Hortobágy - La puszta ungherese](/lugar/hortobagyi-nemzeti-park---puszta/), la [Riserva
      naturale De Maashorst](/lugar/de-maashorst/), [Rewilding Pianure di
      Velebit](/lugar/rewilding-velebit-plains/) e la [Porta della Gheldria / Corridoio del
      Reno](/lugar/gelderse-poort/).
  pt:
    intro: >-
      Quem pensa na puszta húngara imagina uma planície despida sem árvores. Bugac demonstra o oposto: areia,
      sem dúvida, mas uma areia ondulada com cristas dunares sucessivas e desníveis que atingem 20 metros. No
      coração do interflúvio entre o Danúbio e o Tisza, Bugac é o núcleo mais espaçoso do Parque Nacional de
      Kiskunság com 11.488 hectares e o mais diversificado em relevo. Dois grandes cordões dunares preenchem
      quase 70 % do território, declinando para pastagens tradicionais.
    landscape: >-
      As dunas de Bugac assemelham-se geomorfologicamente a Fülöpháza e Orgovány. Em Fülöpháza persistem as
      últimas dunas móveis da Hungria. Em Bugac os ventos moldaram sulcos e cristas arenosas que serviam de
      referência aos pastores, com nomes próprios: Messzelátó-hegy, Lóállás, Betyár-állás e Pipagyújtó-hegy.


      As cristas dunares suportam estepe arenosa aberta e bosquetes de zimbro com choupo-branco. Estes zimbros
      adaptados à secura arderam em fogos nas últimas duas décadas, tendo o grande incêndio de 2012 deixado um
      areal ermo.


      A dessecação regional secou lagoas salinas e charcos interdunares. A vegetação original antes da
      presença humana seria uma estepe fechada.
    wildlife: >-
      A primavera desperta cedo na areia. Aos primeiros calores as clareiras de areia aquecem depressa
      reanimando a vida silvestre. Despontam a anémona-negra, o morugem-das-areias e o amor-perfeito de
      Kitaibel. As dunas atingem a floração plena em maio, surgindo sob os choupos três orquídeas raras,
      mormente Epipactis bugacensis, descrita em 1994 e endémica da região. No outono floresce o
      cólquico-das-areias.


      A avifauna acolhe gaios, melros, pombos-torcazes, rolas-bravas e papa-figos, planando a
      [águia-d'asa-redonda](/especie/buteo_buteo/) nas correntes ascendentes. Rolieiros e gralhas nidificam em
      cavidades nos troncos. Entre os mamíferos escasseia o coelho-bravo enquanto proliferam o
      [javali](/especie/sus_scrofa/) e o [corço](/especie/capreolus_capreolus/), tendo regressado o
      [chacal-dourado](/especie/canis_aureus/). Existe uma colónia de Saga pedo, gafanhoto predador que chega
      a 10 cm, o maior inseto da Hungria. A víbora-das-estepes tem proteção internacional.


      Os animais emblemáticos da puszta são o gado doméstico: a [vaca](/especie/bos_taurus/) cinzenta da
      estepe, a ovelha racka com cornos em espiral, o porco mangalica e as éguas de Bugac, formando um
      repositório genético inestimável.
    visit: >-
      O acesso faz-se a partir do restaurante Karikás Csárda de Bugac: daí um caminho rural de terra batida
      com 1,5 km conduz ao Museu do Pastor e às cavalariças, e no ponto onde estão expostas as raças
      domésticas tradicionais tem início o Trilho dos Pássaros e das Árvores. O percurso estende-se por
      setecentos metros, pode ser feito a pé em qualquer altura do ano e revela-se mais agradável na
      primavera, no início do verão ou no outono. Ladeia uma estreita faixa de floresta mista antes de se
      aproximar das dunas de Bugac. Apresenta as espécies arbóreas e arbustivas autóctones e ensina medidas
      práticas para preservar as aves. Ao sair do trilho alcança-se a chamada Estrada da Escavadora, rasgada
      na década de 1950 quando pesados tratores de esteiras abriram caminhos corta-fogo entre as dunas durante
      vastos programas de florestação.


      O Museu do Pastor foi construído em 1975 de acordo com o projeto de József Kerényi, evocando os moinhos
      tradicionais da Grande Planície. Retrata a cultura pastoril ancestral através de uma cabana de caniço,
      uma carroça, ovelhas racka, cães pastores e utensílios rurais, enquanto um diorama documenta a
      pastorícia extensiva, o quotidiano dos pastores e a fauna da puszta e dos areais. Junto ao museu
      sobrevivem carvalhos-alvarinhos com 150 anos, testemunhos do primitivo bosque estepário.


      Em Kecskemét funciona o centro interpretativo da administração do parque, com exposições permanentes
      dedicadas à história da conservação da natureza na Hungria, aos habitats do interflúvio Danúbio-Tisza e
      aos ofícios artesanais tradicionais.
    history: Bugac é um destino turístico e cultural célebre há quase um século.
    before: >-
      Sair dos trilhos assinalados coloca em perigo as aves que nidificam no solo e os pequenos animais
      terrestres, além de destruir a vegetação arenosa sensível. Nas zonas de reserva integral estrita,
      identificadas por sinalética própria, só é permitida a entrada com autorização escrita do parque ou
      acompanhado por um guia credenciado. A direção do parque recomenda a chegada de bicicleta ou de comboio
      e desaconselha viagens individuais de automóvel. É proibido acampar fora dos locais próprios e o fogo só
      pode ser aceso nos braseiros oficiais. Os cães devem circular sempre com trela e é estritamente
      interdito fotografar aves perto dos ninhos para não provocar o abandono das crias. Nas demonstrações
      pastoris de Bugac concentra-se habitualmente maior número de visitantes.
    around: >-
      Outras áreas do atlas partilham pastoreio tradicional e manadas estepárias com Bugac: o [Parque Nacional
      de Hortobágy - A Puszta Húngara](/lugar/hortobagyi-nemzeti-park---puszta/), a [Reserva Natural De
      Maashorst](/lugar/de-maashorst/), [Rewilding Planícies de Velebit](/lugar/rewilding-velebit-plains/) e a
      [Porta de Gueldres / Corredor do Reno](/lugar/gelderse-poort/).
