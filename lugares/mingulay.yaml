resumen:
  es: >-
    Isla desierta de las Hébridas Exteriores abandonada en 1912, con acantilados de granito de 200 m
    (Biulacacleit) plagados de miles de alcas y araos.
  en: >-
    Deserted Outer Hebrides island abandoned in 1912, featuring 200 m sheer granite sea cliffs crowded with
    thousands of razorbills and guillemots.
  fr: >-
    Île déserte des Hébrides extérieures abandonnée en 1912, ceinte de falaises de granite de 200 m peuplées
    de milliers de pingouins et guillemots.
  de: >-
    Verlassene Insel der Äußeren Hebriden, 1912 entvölkert, mit 200 m hohen Granitkliffs voller Tordalke und
    Trottellummen.
  it: >-
    Isola disabitata delle Ebridi Esterne abbandonata nel 1912, con falesie granitiche di 200 m popolate da
    migliaia di gazze marine e urie.
  pt: >-
    Ilha deserta das Hébridas Exteriores abandonada em 1912, com escarpadas falésias graníticas de 200 m
    repletas de tordas e airot.
unico:
  es: >-
    Los altos acantilados de Mingulay figuran entre los principales lugares de cría de aves marinas del oeste
    de Escocia, en una isla que la gente abandonó hace poco más de cien años.
  en: >-
    Mingulay's soaring western sea cliffs rank among western Scotland's premier seabird citadels, on an
    evocative island evacuated little over a hundred years ago.
  fr: >-
    Les falaises vertigineuses de Mingulay figurent parmi les premiers bastions d'oiseaux marins d'Écosse, sur
    une île abandonnée il y a un peu plus de cent ans.
  de: >-
    Die steilen Klippen von Mingulay zählen zu den bedeutendsten Brutplätzen für Seevögel in Westschottland,
    auf einer vor gut hundert Jahren verlassenen Insel.
  it: >-
    Le vertiginose scogliere di Mingulay figurano tra le prime roccaforti di uccelli marini della Scozia, su
    un'isola abbandonata poco più di cento anni fa.
  pt: >-
    As altas falésias de Mingulay contam-se entre os principais santuários de aves marinhas da Escócia, numa
    ilha abandonada há pouco mais de cem anos.
observaciones:
  es: >-
    Hay que pensar el viaje con el barco: el mar manda y el desembarco puede ser difícil. Lleva ropa y calzado
    para un terreno irregular y rocoso, y respeta las vallas y el sendero marcado en las colonias de
    frailecillos.
texto:
  es:
    intro: >-
      Mingulay lleva más de un siglo sin voces. Durante al menos dos mil años hubo gente aquí, hasta que las
      evacuaciones empezaron en 1907 y en 1912 la isla quedó abandonada. Hoy es la segunda mayor de las
      Bishop's Isles, a 22 kilómetros al sur de Barra, en las Hébridas Exteriores, y la ocupan por completo
      las aves: en sus acantilados crían miles de araos, alcas y frailecillos. A la isla se llega solo en
      barco, y es el National Trust for Scotland quien la posee desde el año 2000.
    landscape: >-
      La isla es de gneis hebrideo con algo de granito. En la bahía de Mingulay el hielo dejó bloques
      erráticos y arcilla, y el resto es turba, suelo ácido delgado o roca desnuda. En la costa oeste, los
      acantilados de Builacraig llegan a 213 metros sobre el mar, y allí está Bagh na h-Aoineig, una profunda
      grieta que antes se creía la más alta del Reino Unido.


      Tres grandes farallones guardan esa costa: Arnamul, Lianamul y Gunamul. Este último tiene un arco
      natural en acantilados de 150 metros por el que pasan barcos en los raros días de calma. Las cumbres más
      altas son Càrnan, con 273 metros, Macphee's Hill, con 224, y Hecla, con 219.


      La vegetación es la típica de las Hébridas Exteriores: brezo, musgo de turbera, juncos, hierba y
      helecho. Hay un único árbol, un álamo de 2 metros en un acantilado sobre la bahía. El cardo marino, raro
      en las Hébridas Occidentales, crece aquí desde al menos el siglo XIX, y en primavera y verano abundan
      las flores silvestres alrededor del pueblo abandonado.
    wildlife: >-
      Mingulay y Berneray comparten la segunda mayor colonia británica de [alcas](/especie/alca_torda/). Los
      recuentos hablan de unas 9.514 parejas de alca, el 6,3 % de la población europea, unas 11.063 de [arao
      común](/especie/uria_aalge/) y 2.939 de [gaviota tridáctila](/especie/rissa_tridactyla/). También anidan
      en los acantilados [fulmares](/especie/fulmarus_glacialis/), con 11.626 parejas, y
      [frailecillos](/especie/fratercula_arctica/), con 2.072, además de cormoranes moñudos, paíños europeos,
      charranes comunes y árticos, págalos grandes y varias gaviotas.


      En verano es posible observar la colonia de frailecillos de Mingulay Bay desde el sendero marcado. Se
      pide permanecer en él para no dañar las madrigueras, y para limitar la gripe aviar el acceso a las
      colonias se restringió con tramos de vallas metálicas, aunque aún se llega cerca de las madrigueras.


      Biulacraig es un buen punto para observar ballenas y delfines. La [foca
      gris](/especie/halichoerus_grypus/) es abundante: su número ha crecido mucho desde que se marcharon los
      habitantes. La playa de arena blanca puede reunir numerosos ejemplares y, aunque no crían, hasta mil
      usan la playa en invierno.
    visit: >-
      Mingulay solo es accesible en barco, y la mayoría de las embarcaciones sale de Castlebay, en Barra. El
      National Trust for Scotland trabaja con dos barqueros autorizados de Barra. El desembarco se hace desde
      una embarcación pequeña en una costa rocosa y puede resultar difícil: en la playa suele haber fuerte
      oleaje, y hay otros desembarcos en Aneir y Skipisdale.


      Una vez en tierra, el terreno es irregular y rocoso. Quédate en los senderos para no molestar a las aves
      que crían en el suelo.
    history: >-
      La falta de un desembarcadero abrigado dejaba la isla incomunicada durante semanas, y ese aislamiento
      acabó empujando a marcharse a sus habitantes.


      Hoy solo quedan dos edificios en pie, la escuela y la casa de la capilla; la escuela fue restaurada por
      el National Trust en 2013 y sirve de alojamiento a investigadores. Mingulay y Berneray son SSSI desde
      1983 y Área Importante para las Aves de BirdLife.


      Mingulay es también un lugar de cultura oral. Es conocida por una amplia tradición gaélica de folclore,
      canciones y relatos, y la célebre Mingulay Boat Song no es tradicional: la compuso Hugh S. Roberton en
      1938.
    before: >-
      Hay que pensar el viaje con el barco: el mar manda y el desembarco puede ser difícil. Lleva ropa y
      calzado para un terreno irregular y rocoso, y respeta las vallas y el sendero marcado en las colonias de
      frailecillos.
    around: >-
      Mingulay comparte alca, frailecillo y foca gris con la [Isla de Lunga (Islas
      Treshnish)](/lugar/lunga-treshnish-isles/) y con la [Reserva Natural de las
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/). Con los [Acantilados Ornitológicos de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) le une la alca y el frailecillo, y con [Great Blasket Island /
      An Blascaod Mór](/lugar/great-blasket-island/), el frailecillo y la foca gris.
  en:
    intro: >-
      Mingulay has known over a century of profound human silence. For at least two thousand years communities
      endured here, until clearances and voluntary evacuations began in 1907 and by 1912 the island was
      completely abandoned. Today it represents the second largest of the Bishop's Isles, lying 22 kilometres
      south of Barra in the Outer Hebrides, entirely reclaimed by seabirds: thousands of common guillemots,
      razorbills, and puffins breed across its sheer cliffs. Accessible solely by sea, the island has been
      cared for by the National Trust for Scotland since the year 2000.
    landscape: >-
      The island is forged from ancient Lewisian gneiss intercut with granite pegmatite veins. In Mingulay
      Bay, retreating Pleistocene glaciers deposited boulder clays and erratics, while higher ground consists
      of blanket peat, skeletal podzols, and windswept bedrock. On the storm-battered west coast, the dramatic
      cliffs of Builacraig soar 213 metres straight out of the Atlantic, scarred by Bagh na h-Aoineig, a
      colossal sea-cleft long reputed as the tallest vertical sea chasm in the British Isles.


      Three towering sea stacks guard this oceanic frontage: Arnamul, Lianamul, and Gunamul. Gunamul is
      pierced by a spectacular natural rock arch through 150-metre sea cliffs, navigable by small vessels only
      on rare calm summer days. The highest summits are Càrnan at 273 metres, Macphee's Hill at 224, and Hecla
      at 219.


      Maritime vegetation reflects typical Outer Hebridean moorland: ling heather, cross-leaved heath, bog
      mosses, rushes, and bracken. A lone stunted aspen of 2 metres clings to a sheltered crag above the bay,
      the island's only tree. Sea holly, remarkably scarce in the Western Isles, has grown here since at least
      the nineteenth century, while summer wildflowers carpet the abandoned village ruins.
    wildlife: >-
      Mingulay and neighboring Berneray host the second largest colony of [razorbills](/especie/alca_torda/)
      in Great Britain. Breeding censuses record around 9,514 pairs of razorbills—representing 6.3 % of the
      European population—alongside 11,063 pairs of [common guillemots](/especie/uria_aalge/) and 2,939 pairs
      of [black-legged kittiwakes](/especie/rissa_tridactyla/). Oceanic cliffs also support 11,626 nesting
      pairs of northern [fulmars](/especie/fulmarus_glacialis/) and 2,072 pairs of Atlantic
      [puffins](/especie/fratercula_arctica/), supplemented by European shags, European storm-petrels, Arctic
      and common terns, and great skuas.


      During high summer, visitors can watch puffins at close quarters above Mingulay Bay from the designated
      trail. Hikers must stay strictly on the path to avoid collapsing nesting burrows; temporary fencing was
      erected during avian influenza outbreaks to minimize disturbance, though excellent vantage points remain
      accessible.


      Builacraig offers an elevated vantage point to spot minke whales, basking sharks, and dolphins. The
      [grey seal](/especie/halichoerus_grypus/) is abundant: numbers have multiplied since human departure.
      The sweeping white sand beach hosts large haul-outs, and up to a thousand seals utilize the sheltered
      sands during winter.
    visit: >-
      Mingulay is accessible solely by boat, with most day charters departing from Castlebay on Barra. The
      National Trust for Scotland collaborates with two licensed local boat operators from Barra. Disembarking
      onto the rocky shoreline requires transferring to a small dinghy and demands agile footwork: the landing
      beach experiences heavy Atlantic surf, with emergency alternative landings at Aneir and Skipisdale.


      Once ashore, the terrain is pathless, steep, and peat-boggy. Keep to waymarked sheep tracks to avoid
      stepping on hidden burrowing seabirds.
    history: >-
      The island's total lack of a sheltered natural harbour left islanders isolated for weeks on end during
      winter storms, a hardship that ultimately compelled the final abandonment.


      Today only two stone structures remain standing: the Victorian schoolhouse and the chapel house; the
      school was restored by the National Trust in 2013 to provide temporary bunkhouse accommodation for
      visiting researchers. Mingulay and Berneray were notified as a Site of Special Scientific Interest in
      1983 and form a designated BirdLife Important Bird Area.


      Mingulay preserves a rich Gaelic oral tradition. It is renowned for its wealth of Gaelic folklore,
      waulking songs, and poetry; the famous "Mingulay Boat Song" is not a traditional folk air but was
      composed by Sir Hugh S. Roberton in 1938.
    before: >-
      Always plan your crossing around boat operators' advice: sea states dictate landings and surf can make
      shore access impossible. Dress in sturdy waterproof boots and foul-weather gear, and respect protective
      fences and waymarked trails through puffin breeding grounds.
    around: >-
      Mingulay shares razorbills, puffins, and grey seals with the [Treshnish Isles -
      Lunga](/lugar/lunga-treshnish-isles/) and the [Sept-Îles Nature
      Reserve](/lugar/reserve-naturelle-des-sept-iles/). The [Vestmanna Bird
      Cliffs](/lugar/vestmanna-bird-cliffs/) share dense colonies of razorbills and puffins, while [Great
      Blasket Island](/lugar/great-blasket-island/) echoes its abandoned island heritage, puffins, and grey
      seals.
  fr:
    intro: >-
      Mingulay vit depuis plus d'un siècle sans voix humaine. Pendant au moins deux mille ans, des communautés
      insulaires y ont subsisté, jusqu'aux évacuations débutées en 1907 qui aboutirent en 1912 à l'abandon
      définitif de l'île. C'est aujourd'hui la deuxième plus grande des Bishop's Isles, située à 22 kilomètres
      au sud de Barra dans les Hébrides extérieures, entièrement conquise par les oiseaux de mer : des
      milliers de guillemots, petits pingouins et macareux y nichent. Accessible uniquement par mer, le
      National Trust for Scotland en est le gardien depuis l'an 2000.
    landscape: >-
      L'île est constituée de gneiss levisien traversé de filons granitiques. Dans la baie de Mingulay, les
      glaciers pléistocènes ont déposé argiles et blocs erratiques, le reste du relief étant couvert de tourbe
      acide et de roche nue. Sur la façade occidentale, les falaises de Builacraig s'élèvent à 213 mètres
      au-dessus des lames océaniques, entaillées par Bagh na h-Aoineig, une gorge marine autrefois considérée
      comme la plus vertigineuse du Royaume-Uni.


      Trois grands stacks rocheux veillent sur ce rivage sauvage : Arnamul, Lianamul et Gunamul. Ce dernier
      est percé d'une arche naturelle au pied de falaises de 150 mètres que les embarcations franchissent par
      mer exceptionnellement calme. Les sommets culminants sont le Càrnan avec 273 mètres, Macphee's Hill avec
      224 et l'Hecla avec 219.


      La végétation est caractéristique de la lande atlantique : callune, bruyères, sphaignes et fougères. Un
      arbre unique, un tremble nain de 2 mètres, s'accroche à une paroi surplombant la crique. Le panicaut
      maritime, rare aux Hébrides, prospère depuis au moins le XIXe siècle, et les ruines du village se
      couvrent de fleurs printanières.
    wildlife: >-
      Mingulay et l'île voisine de Berneray hébergent la deuxième plus grande colonie de [petits
      pingouins](/especie/alca_torda/) de Grande-Bretagne. Les décomptes dénombrent environ 9 514 couples de
      petits pingouins, soit 6,3 % de la population européenne, 11 063 couples de [guillemots de
      Troïl](/especie/uria_aalge/) et 2 939 de [mouettes tridactyles](/especie/rissa_tridactyla/). Nichent
      également sur ces escarpements le [fulmar boréal](/especie/fulmarus_glacialis/) avec 11 626 couples et
      le [macareux moine](/especie/fratercula_arctica/) avec 2 072 couples, côtoyant cormorans huppés,
      océanites tempête et grands labbes.


      En été, on peut contempler la colonie de macareux de Mingulay Bay depuis le sentier balisé. Il est
      impératif d'y rester pour ne pas écraser les terriers, l'accès ayant été canalisé par des clôtures
      préventives face à la grippe aviaire.


      Builacraig offre un promontoire remarquable pour guetter baleines de Minke et dauphins. Le [phoque
      gris](/especie/halichoerus_grypus/) y abonde : ses effectifs ont explosé depuis le départ des hommes. La
      grève de sable blanc réunit d'importants groupes, et jusqu'à un millier d'individus s'y rassemblent en
      hiver.
    visit: >-
      Mingulay est uniquement accessible par mer, la plupart des excursions partant de Castlebay sur l'île de
      Barra. Le National Trust for Scotland collabore avec deux bateliers officiels de Barra. Le débarquement
      depuis une annexe sur des rochers glissants peut s'avérer sportif : la houle déferle souvent sur la
      plage, d'autres accès de secours existant à Aneir et Skipisdale.


      Une fois à terre, le terrain est accidenté et tourbeux. Suivez scrupuleusement les sentes pour ne pas
      perturber les oiseaux nichant au sol.
    history: >-
      L'absence totale de mouillage abrité condamnait les insulaires à un isolement de plusieurs semaines en
      hiver, déclenchant l'exode rural inéluctable.


      Aujourd'hui ne subsistent que deux bâtiments couverts : l'école et le presbytère ; l'école a été
      restaurée en 2013 par le National Trust pour héberger des chercheurs. Mingulay et Berneray forment un
      SSSI depuis 1983 et une Zone importante pour les oiseaux.


      Mingulay conserve une tradition orale gaélique vivace, célèbre pour ses complaintes de foulage et contes
      anciens ; la célèbre Mingulay Boat Song n'est pas traditionnelle, ayant été composée par Hugh S.
      Roberton en 1938.
    before: >-
      Planifiez l'excursion en concertation avec le batelier : l'état de la mer détermine les débarquements.
      Munissez-vous de bonnes chaussures de marche, de vêtements imperméables et respectez les clôtures
      protégeant les macareux.
    around: >-
      Mingulay partage petits pingouins, macareux et phoques gris avec l'[île de Lunga (îles
      Treshnish)](/lugar/lunga-treshnish-isles/) et la [réserve naturelle des
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/). Les [falaises de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) accueillent également des milliers d'alcidés, tandis que
      l'[île de Great Blasket](/lugar/great-blasket-island/) partage son destin insulaire abandonné.
  de:
    intro: >-
      Mingulay liegt seit über einem Jahrhundert menschenleer im Atlantik. Mindestens zweitausend Jahre lang
      lebten hier Inselgemeinschaften, bis 1907 erste Abwanderungen einsetzten und die Insel 1912 endgültig
      aufgegeben wurde. Heute ist sie die zweitgrößte der Bishop's Isles, 22 Kilometer südlich von Barra in
      den Äußeren Hebriden, vollkommen von Seevögeln beherrscht: Tausende Trottellummen, Tordalke und
      Papageitaucher brüten an den Felswänden. Sie ist nur per Schiff erreichbar und gehört seit dem Jahr 2000
      dem National Trust for Scotland.
    landscape: >-
      Die Insel besteht aus uraltem Lewisian-Gneis mit Granitadern. In der Mingulay Bay hinterließ das Eis
      Findlinge und Moränentone, während das Hochland von Hochmooren und nacktem Fels geprägt ist. An der
      sturmgepeitschten Westküste ragen die Klippen von Builacraig 213 Meter steil empor, eingeschnitten vom
      Felsspalt Bagh na h-Aoineig, der einst als höchste Felsklamm Großbritanniens galt.


      Drei Brandungspfeiler trotzen der Brandung: Arnamul, Lianamul und Gunamul. Letzterer besitzt ein
      natürliches Felstor in 150 Meter hohen Steilwänden, das Schiffe an seltenen ruhigen Tagen durchfahren
      können. Höchste Erhebungen sind Càrnan mit 273 Metern, Macphee's Hill mit 224 und Hecla mit 219.


      Die Vegetation entspricht der ozeanischen Moorheide: Besenheide, Torfmoose, Binsen und Farnkraut. Ein
      einzelner Zwergaspenbaum von 2 Metern klammert sich an eine Felswand über der Bucht – der einzige Baum
      der Insel. Der Meerstrand-Mannstreu wächst hier seit mindestens dem neunzehnten Jahrhundert, und im
      Sommer blühen Wildblumen in den Ruinen des Dorfes.
    wildlife: >-
      Mingulay und Berneray teilen sich die zweitgrößte Kolonie von [Tordalken](/especie/alca_torda/) in
      Großbritannien. Zählungen belegen rund 9.514 Tordalkpaare, was 6,3 % des europäischen Bestands
      entspricht, 11.063 Paare der [Trottellumme](/especie/uria_aalge/) und 2.939 der
      [Dreizehenmöwe](/especie/rissa_tridactyla/). An den Klippen nisten zudem 11.626 Paare des
      [Eissturmvogels](/especie/fulmarus_glacialis/) und 2.072 Paare des
      [Papageitauchers](/especie/fratercula_arctica/), ergänzt um Krähenscharben, Sturmschwalben und
      Raubmöwen.


      Im Hochsommer lässt sich die Papageitaucher-Kolonie an der Mingulay Bay vom markierten Pfad aus
      beobachten. Besucher müssen auf dem Pfad bleiben, um Bruthöhlen nicht einzutreten; Weidezäune wurden
      wegen der Vogelgrippe errichtet.


      Builacraig ist ein idealer Ausguck für Wale und Delfine. Die [Kegelrobbe](/especie/halichoerus_grypus/)
      ist häufig: Ihre Zahl wuchs seit der Evakuierung stark an. Der weiße Sandstrand dient als Ruheplatz, wo
      sich im Winter bis zu tausend Tiere versammeln.
    visit: >-
      Mingulay ist ausschließlich auf dem Seeweg erreichbar; die meisten Ausflugsboote legen in Castlebay auf
      Barra ab. Der National Trust for Scotland kooperiert mit zwei lizenzierten Skippern aus Barra. Das
      Anlanden mit einem Schlauchboot an felsiger Küste kann anspruchsvoll sein, da an der Sandbucht oft
      schwere Atlantikdünung steht; Ausweichanleger liegen in Aneir und Skipisdale.


      An Land ist das Terrain weglos und moorig. Bleibe auf den Trittspuren, um bodenbrütende Seevögel nicht
      zu stören.
    history: >-
      Das Fehlen eines geschützten Hafens schnitt die Insel im Winter wochenlang von der Außenwelt ab, was die
      Bewohner schließlich zur Auswanderung trieb.


      Heute stehen nur noch zwei Gebäude aufrecht: die Schule und das Pfarrhaus; das Schulhaus wurde 2013 vom
      National Trust renoviert und dient Forschern als Unterkunft. Mingulay und Berneray sind seit 1983 als
      SSSI und Important Bird Area geschützt.


      Mingulay besaß eine reiche gälische Erzähltradition voll von Seemannsliedern und Volkssagen; das
      berühmte Mingulay Boat Song ist kein altes Volkslied, sondern wurde 1938 von Hugh S. Roberton
      komponiert.
    before: >-
      Stimme die Fahrt eng mit dem Bootsführer ab: Der Seegang bestimmt die Machbarkeit. Trage feste
      Wanderschuhe und wetterfeste Kleidung und respektiere die Schutzabsperrungen bei den Papageitauchern.
    around: >-
      Mingulay teilt Tordalken, Papageitaucher und Kegelrobben mit den [Treshnish-Inseln –
      Lunga](/lugar/lunga-treshnish-isles/) und dem [Naturschutzgebiet
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/). Ähnliche Vogelberge finden sich an den [Vogelfelsen
      von Vestmanna](/lugar/vestmanna-bird-cliffs/) sowie auf der [Insel Great
      Blasket](/lugar/great-blasket-island/).
  it:
    intro: >-
      Mingulay vive da oltre un secolo senza voci umane. Per almeno duemila anni comunità insulari abitarono
      queste terre, finché nel 1907 cominciarono i trasferimenti e nel 1912 l'isola venne abbandonata per
      sempre. Oggi è la seconda maggiore delle Bishop's Isles, situata a 22 chilometri a sud di Barra nelle
      Ebridi Esterne, interamente dominata dagli uccelli marini: migliaia di urie, gazze marine e pulcinelle
      di mare nidificano sulle rupi. Raggiungibile unicamente via mare, è custodita dal National Trust for
      Scotland dall'anno 2000.
    landscape: >-
      L'isola poggia sull'antico gneiss delle Ebridi intessuto di filoni di granito. A Mingulay Bay i ghiacci
      depositarono morene e massi erratici, mentre le alture sono ammantate di torba acida e roccia nuda.
      Lungo la costa occidentale le scogliere di Builacraig precipitano per 213 metri nell'oceano, solcate da
      Bagh na h-Aoineig, una fenditura a picco considerata in passato la più profonda del Regno Unito.


      Tre possenti faraglioni fronteggiano il mare aperto: Arnamul, Lianamul e Gunamul. Quest'ultimo è
      traforato da un arco naturale entro scogliere di 150 metri, attraversabile in barca nelle rare giornate
      di bonaccia. Le vette più elevate sono il Càrnan a 273 metri, Macphee's Hill a 224 e Hecla a 219.


      La flora è quella classica delle brughiere atlantiche: calluna, eriche, sfagni e felci. Un unico albero
      isolato, un pioppo tremulo nano di 2 metri, alligna su una rupe sopra la baia. La calcatreppola
      marittima cresce qui almeno dal XIX secolo, mentre i ruderi del villaggio si coprono di fioriture
      estive.
    wildlife: >-
      Mingulay e la contigua Berneray ospitano la seconda maggiore colonia britannica di [gazze
      marine](/especie/alca_torda/). I censimenti contano circa 9.514 coppie di gazza marina, pari al 6,3 %
      della popolazione europea, 11.063 coppie di [uria comune](/especie/uria_aalge/) e 2.939 di [gabbiano
      tridattilo](/especie/rissa_tridactyla/). Sulle falesie nidificano inoltre il
      [fulmaro](/especie/fulmarus_glacialis/) con 11.626 coppie e la [pulcinella di
      mare](/especie/fratercula_arctica/) con 2.072 coppie, oltre a marangoni dal ciuffo, uccelli delle
      tempeste e stercorari maggiori.


      In estate è possibile osservare la colonia di pulcinelle di mare di Mingulay Bay seguendo il sentiero
      segnalato. È obbligatorio non allontanarsi dal tracciato per non sfondare i nidi sotterranei, protetti
      da staccionate contro l'influenza aviaria.


      Builacraig è un belvedere eccezionale per scorgere balenottere minori e delfini. La [foca
      grigia](/especie/halichoerus_grypus/) è abbondante: la sua popolazione è cresciuta dopo l'evacuazione.
      La spiaggia sabbiosa raduna grandi colonie, e fino a mille esemplari la frequentano in inverno.
    visit: >-
      Mingulay è raggiungibile esclusivamente in barca, con partenze regolari da Castlebay sull'isola di
      Barra. Il National Trust for Scotland collabora con due barcaioli autorizzati di Barra. Lo sbarco
      tramite gommone su scogli scivolosi può essere disagevole: a riva frangono spesso forti marosi
      atlantici, con approdi alternativi ad Aneir e Skipisdale.


      Una volta a terra il terreno è aspro e acquitrinoso. Resta sui sentieri battuti per non calpestare le
      nidiate degli uccelli marini.
    history: >-
      La mancanza di un porto naturale protetto condannava gli isolani a settimane di isolamento nelle
      tempeste invernali, inducendo l'abbandono definitivo.


      Oggi rimangono in piedi solo due edifici: la scuola e la canonica; l'edificio scolastico è stato
      restaurato dal National Trust nel 2013 come rifugio per ricercatori. Mingulay e Berneray sono SSSI dal
      1983 e Important Bird Area.


      Mingulay custodisce un'eredità gaelica di canti e leggende orali; la celebre Mingulay Boat Song non è
      tuttavia una melodia tradizionale, ma fu composta da Hugh S. Roberton nel 1938.
    before: >-
      Pianifica l'escursione con il comandante della barca: le condizioni marine determinano la fattibilità
      dello sbarco. Indossa calzature da trekking e abbigliamento impermeabile e rispetta le delimitazioni
      presso i nidi.
    around: >-
      Mingulay condivide gazze marine, pulcinelle e foche con l'[Isola di Lunga (Isole
      Treshnish)](/lugar/lunga-treshnish-isles/) e la [Riserva naturale delle
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/). Le [Falesie ornitologiche di
      Vestmanna](/lugar/vestmanna-bird-cliffs/) ospitano colonie affini, mentre [Great Blasket
      Island](/lugar/great-blasket-island/) rievoca il medesimo destino insulare abbandonato.
  pt:
    intro: >-
      Mingulay vive há mais de um século sem vozes humanas. Durante pelo menos dois mil anos habitaram aqui
      comunidades celtas, até que as evacuações se iniciaram em 1907 e em 1912 a ilha ficou deserta. É hoje a
      segunda maior das Bishop's Isles, situada a 22 quilómetros a sul de Barra nas Hébridas Exteriores,
      inteiramente devolvida às aves marinhas: milhares de airon-comuns, tordas-mergulheiras e
      papagaios-do-mar nidificam nas escarpas. Acessível apenas por mar, pertence ao National Trust for
      Scotland desde o ano 2000.
    landscape: >-
      A ilha assenta no milenar gnaisse de Lewis entrecortado por veios de granito. Em Mingulay Bay os
      glaciares depositaram moreias e blocos erráticos, com o restante relevo dominado por turfa e rocha nua.
      Na costa ocidental, as falésias de Builacraig elevam-se a 213 metros sobre o Atlântico, rasgadas por
      Bagh na h-Aoineig, uma garganta marinha outrora apontada como a mais funda do Reino Unido.


      Três grandes farilhões vigiam esta costa: Arnamul, Lianamul e Gunamul. Este último exibe um arco natural
      perfurado em arribas de 150 metros, navegável por pequenos barcos nos raros dias de mar chão. Os pontos
      culminantes são o Càrnan com 273 metros, Macphee's Hill com 224 e Hecla com 219.


      A vegetação é a charneca húmida oceânica: urze, esfagno, juncos e fetos. Uma árvore solitária, um
      álamo-trémulo anão de 2 metros, sobrevive numa escarpa sobre a baía. O cardo-marítimo medra aqui pelo
      menos desde o século XIX, e no verão desabrocham flores silvestres nas ruínas da aldeia.
    wildlife: >-
      Mingulay e a vizinha Berneray partilham a segunda maior colónia de
      [tordas-mergulheiras](/especie/alca_torda/) da Grã-Bretanha. Os censos registam cerca de 9.514 casais de
      torda-mergulheira — 6,3 % da população europeia —, 11.063 casais de [airo-comum](/especie/uria_aalge/) e
      2.939 de [gaivota-tridáctila](/especie/rissa_tridactyla/). Nidificam ainda nas escarpas o
      [fulmar-boreal](/especie/fulmarus_glacialis/) com 11.626 casais e o
      [papagaio-do-mar](/especie/fratercula_arctica/) com 2.072 casais, a par de corvos-marinhos-de-crista e
      painhos-de-jesus.


      No verão é possível observar a colónia de papagaios-do-mar em Mingulay Bay a partir do trilho
      sinalizado. Pede-se que permaneças no trilho para não esmagar as tocas subterrâneas, balizadas por
      vedações contra a gripe aviária.


      Builacraig é um miradouro de excelência para avistar baleias e golfinhos. A
      [foca-cinzenta](/especie/halichoerus_grypus/) é abundante: os seus efetivos multiplicaram-se após a
      saída dos homens. O areal branco acolhe colónias, e até mil focas usam a praia no inverno.
    visit: >-
      Mingulay só é acessível de barco, partindo a maioria das viagens de Castlebay em Barra. O National Trust
      for Scotland articula-se com dois barqueiros autorizados de Barra. O desembarque feito de bote
      pneumático nas rochas pode revelar-se complexo: na baía quebra ondulação atlântica forte, com acessos de
      recurso em Aneir e Skipisdale.


      Em terra, o terreno é íngreme e encharcado. Caminha pelos carreiros para não perturbar as aves que
      nidificam no chão.
    history: >-
      A ausência de um ancoradouro abrigado deixava a ilha isolada durante semanas no inverno, precipitando o
      abandono definitivo pela população.


      Hoje apenas restam dois edifícios cobertos: a escola e a casa paroquial; a escola foi restaurada pelo
      National Trust em 2013 para acolher cientistas. Mingulay e Berneray são SSSI desde 1983 e Zona de
      Importância para as Aves.


      Mingulay ostenta uma notável herança de folclore e cantares gaélicos; a conhecida Mingulay Boat Song não
      é uma melodia antiga, tendo sido composta por Hugh S. Roberton em 1938.
    before: >-
      Combina a travessia com o barqueiro: a ondulação marítima determina o desembarque. Leva botas de
      caminhada impermeáveis, agasalhos e respeita as vedações que protegem as tocas dos papagaios-do-mar.
    around: >-
      Mingulay partilha tordas, papagaios-do-mar e focas-cinzentas com a [Ilha de Lunga (Ilhas
      Treshnish)](/lugar/lunga-treshnish-isles/) e a [Reserva Natural das
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/). As [Escarpas de Aves de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) acolhem colónias similares, enquanto [Great Blasket
      Island](/lugar/great-blasket-island/) partilha a condição de ilha deserta e colónias de aves marinhas.
