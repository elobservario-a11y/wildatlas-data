resumen:
  es: Meandros encajados del río Thaya/Dyje flanqueados por hayedos de ladera y cortados rocosos termófilos.
  en: Incised meanders of the Thaya/Dyje River flanked by hillside beechwoods and thermophilous rocky crags.
  fr: >-
    Méandres encaissés de la rivière Thaya/Dyje bordés de hêtraies de versant et d'abrupts rocheux
    thermophiles.
  de: >-
    Tief eingeschnittene Flussschlingen der Thaya/Dyje, gesäumt von Hangbuchenwäldern und wärmeliebenden
    Felsfluren.
  it: Meandri incassati del fiume Thaya/Dyje affiancati da faggete di versante e pareti rocciose termofile.
  pt: Meandros encaixados do rio Thaya/Dyje ladeados por faiais de encosta e escarpas rochosas termófilas.
unico:
  es: >-
    Aquí una frontera política corre por el medio de un río y, aun así, no divide el ecosistema: es uno de los
    últimos valles casi naturales de Europa central.
  en: >-
    Here a political border runs down the middle of a river and yet does not divide the ecosystem: it is one
    of Central Europe's last near-natural river valleys.
  fr: >-
    Ici, une frontière politique passe au milieu d'une rivière sans pour autant diviser l'écosystème : c'est
    l'une des dernières vallées fluviales quasi naturelles d'Europe centrale.
  de: >-
    Hier verläuft eine politische Grenze mitten durch einen Fluss und trennt dennoch kein Ökosystem: Es ist
    eines der letzten naturnahen Durchbruchstäler Mitteleuropas.
  it: >-
    Qui un confine politico scorre nel mezzo di un fiume senza dividere l'ecosistema: è una delle ultime valli
    fluviali quasi naturali dell'Europa centrale.
  pt: >-
    Aqui uma fronteira política corre pelo meio de um rio e, mesmo assim, não divide o ecossistema: é um dos
    últimos vales fluviais quase naturais da Europa Central.
observaciones:
  es: >-
    Hay que quedarse en los senderos marcados, y no se puede circular en bicicleta fuera de los carriles
    autorizados. Casi no hay cobertura de móvil. En épocas críticas de crecida, la administración cierra el
    sendero del Thayatal o el del valle de Kaja.
texto:
  es:
    intro: >-
      En 1989 cayó el Telón de Acero, y el Thaya, que marca la frontera entre Austria y la República Checa,
      pudo dejar de ser una línea vigilada para ser un valle compartido. Lo que se protegió después son dos
      parques que se prolongan sin costuras: el Thayatal, en Austria, creado en 2000, y el Podyjí, al otro
      lado del río, desde 1991. Juntos protegen unas 7.700 hectáreas de un valle que el río, el Thaya o Dyje,
      ha cavado en 23,3 km de meandros, y donde el río mismo marca la frontera.
    landscape: >-
      Hace entre 5 y 1,5 millones de años, el Thaya se excavó en las rocas metamórficas del Macizo de Bohemia,
      hasta 150 m de profundidad, y dejó uno de los valles de ruptura más bellos de Europa central. El lecho
      es granito, gneis y esquisto de hasta 600 millones de años, la cordillera más antigua de Austria. La
      curva más famosa está cerca de Merkersdorf, donde el río rodea casi por completo el Umlaufberg, la
      «montaña del meandro» de 378 m, y solo lo separa un tramo de roca de unos 120 m. Desde su cima se ve
      todo el valle.


      El valle está justo en un límite climático, entre el Waldviertel húmedo y el Weinviertel panónico, y por
      eso confluyen especies del sureste de Europa, de las faldas de los Alpes y de Europa central. Más del 90
      % del parque es bosque: robledales cálidos y secos en el este, sobre granito ácido, y hayedos en el
      oeste. Y en las laderas escarpadas y las mesetas rocosas hay pastizales secos, rarezas botánicas que van
      de plantas de roca a estepas arboladas. Los prados del parque, de unas 63 ha, tienen orquídeas, claveles
      cartujos y salvia de los prados, y se siegan con barras respetuosas con los insectos una o dos veces al
      año, a partir de mediados de junio.
    wildlife: >-
      La estación manda. A finales de febrero o principios de marzo aparecen los primeros campanillas de
      invierno, y luego el bosque se llena de hepáticas, daphne, pulmonaria y primavera. La ladera sur del
      Überstieg se cubre de cornejos de flor amarilla. A mediados de marzo vuelve de África la [cigüeña
      negra](/especie/ciconia_nigra/), que se ve con frecuencia buscando comida en el Thaya alrededor del
      Umlaufberg; también se la puede ver pescando entre Hardegg y el Überstieg, sobre todo temprano. El
      parque acoge ocho de las diez especies de pájaros carpinteros de Austria, y en el sendero Einsiedler
      muchos árboles muestran la presencia del [pito negro](/especie/dryocopus_martius/).


      En verano, a primera hora, las culebras de agua y de [Esculapio](/especie/elaphe_longissima/) salen a
      calentarse entre las rocas, junto a los lagartos esmeralda. A principios de mayo estos lagartos buscan
      pareja en los miradores del Überstieg y de la meseta Max. En las orillas cazan lavanderas y mirlos
      acuáticos, y con suerte el [martín pescador](/especie/alcedo_atthis/) cruza el agua. En los ríos del
      parque encuentra refugio el cangrejo de río noble, hoy amenazado.


      En otoño destaca el naranja del abedul y el rojo del arce. La única flor de esa época es el cólquico,
      que florece en otoño y saca las hojas en abril. Se anima a probar los frutos silvestres sin recogerlos,
      y está prohibido recoger setas.


      El [gato montés](/especie/felis_silvestris/) es la gran noticia: en 2007 se identificó por primera vez
      en 35 años en Austria, mediante ADN, en este parque. Verlo en el bosque es casi imposible, pero Frieda y
      Carlo, dos gatos monteses, viven en el mayor recinto de gatos monteses de Austria, de 450 m², visible
      desde el vestíbulo de la Casa del Parque.
    visit: >-
      Empieza por la Casa del Parque, a 1,5 km de Hardegg camino de Retz: es el punto de partida de
      excursiones y da información de personal y rangers. La exposición «NaturGeschichten» muestra el valle
      desde el punto de vista de la cigüeña negra, con una vista aérea gigante. Desde el vestíbulo se ve el
      recinto de los gatos monteses, y hay espectáculos de alimentación y una ruta de senderismo pensada para
      seguir sus huellas. También se ofrecen excursiones y eventos, como «Wildnis Schnuppern», y rutas
      personalizadas con guía, «Rent a Ranger».


      Hay 100 km de senderos y rutas en bici en el Thayatal-Podyjí. El Hennerweg es un sendero temático de 1,8
      km, de unos 40 minutos, con seis estaciones sobre el desarrollo del bosque y la madera muerta; allí se
      ven flores tempranas, y en otoño hojas de hayas y robles.
    history: >-
      La caída del Telón de Acero en 1989 hizo posible la cooperación, y poco después nacieron los parques de
      Podyjí (1991) y de Thayatal (2000). El 15 de julio de 1999, los ministros de Austria y la República
      Checa y el gobernador de la Baja Austria firmaron una declaración de cooperación entre los dos parques.
      En su contrato figura una frase: «la frontera por el medio del río divide estados, pero no ecosistemas».


      El parque austriaco ocupa 1.360 ha, y el Podyjí, 6.300 ha, entre Znojmo y Vranov nad Dyjí, en Moravia
      del Sur. La UICN reconoció el Thayatal como categoría II en 2001.
    before: >-
      Hay que quedarse en los senderos marcados, y no se puede circular en bicicleta fuera de los carriles
      autorizados. Casi no hay cobertura de móvil. En épocas críticas de crecida, la administración cierra el
      sendero del Thayatal o el del valle de Kaja.
    around: >-
      Los espacios con los que comparte cigüeña negra y gato montés en bosques maduros son el [Bosque de
      Anlier](/lugar/foret-d-anlier/), el [Gran Bosque de Saint-Hubert](/lugar/grande-foret-de-saint-hubert/)
      y la [Reserva Natural de la Sierra de Malcata](/lugar/reserva-natural-da-serra-da-malcata/); el [Macizo
      de Vlădeasa](/lugar/masivul-vladeasa/) comparte también culebra de Esculapio.
  en:
    intro: >-
      In 1989 the Iron Curtain fell, allowing the Thaya, which marks the border between Austria and the Czech
      Republic, to transform from a heavily fortified frontier into a shared river valley. What was protected
      thereafter are two seamlessly connected national parks: Thayatal on the Austrian side, founded in 2000,
      and Podyjí across the water, designated in 1991. Together they protect some 7,700 hectares of a canyon
      where the river, known as Thaya or Dyje, has carved 23.3 km of looping meanders, with the river itself
      defining the national boundary.
    landscape: >-
      Between 5 and 1.5 million years ago, the Thaya carved deeply into the metamorphic bedrock of the
      Bohemian Massif to depths of up to 150 m, shaping one of Central Europe's most beautiful epigenetic
      breakthrough valleys. The bedrock consists of granite, gneiss and schist dating back up to 600 million
      years, forming Austria's oldest geological range. The most celebrated bend lies near Merkersdorf, where
      the river loops almost entirely around the Umlaufberg—the 378 m "meander mountain"—separated by a narrow
      rocky ridge only some 120 m across. From its summit you survey the whole valley.


      The gorge sits directly on a climatic frontier between the humid Atlantic Waldviertel and the warm
      Pannonian Weinviertel, blending plant and animal communities from southeastern Europe, the Alpine
      foothills and Central Europe. More than 90% of the park is cloaked in woodland: warm, dry oakwoods on
      acidic granite in the east, and lush beechwoods in the west. Rocky ledges and precipitous crags host dry
      steppe grasslands, botanical treasures ranging from cliff chasmophytes to open wood-pastures. The park's
      wildflower meadows, covering some 63 ha, boast wild orchids, Carthusian pinks and meadow clary, mown
      using insect-friendly cutter bars once or twice a year from mid-June onwards.
    wildlife: >-
      The seasons orchestrate life here. In late February or early March, the first snowdrops emerge, followed
      by woodland floors carpeted in liverleaf, mezereon, lungwort and primroses. The southern slope of the
      Überstieg turns yellow with blossoming cornelian cherries. In mid-March the [black
      stork](/especie/ciconia_nigra/) returns from Africa, frequently observed foraging along the Thaya around
      the Umlaufberg or fishing between Hardegg and the Überstieg, especially in early morning. The park hosts
      eight of Austria's ten woodpecker species, and along the Einsiedler trail many trunks bear telltale
      signs of the [black woodpecker](/especie/dryocopus_martius/).


      In summer at dawn, dice snakes and Aesculapian snakes ([Esculapio](/especie/elaphe_longissima/)) emerge
      onto sunny crags alongside vibrant green lizards. In early May these emerald lizards court on rocky
      outcrops of the Überstieg and the Max Plateau. White-throated dippers and grey wagtails forage along the
      water's edge, while with a little luck a [common kingfisher](/especie/alcedo_atthis/) flashes across the
      stream. The pristine rivers provide a crucial sanctuary for the endangered noble freshwater crayfish.


      Autumn arrives with glowing orange birches and blazing red maples. The sole flower of this late season
      is the autumn crocus (meadow saffron), which blooms in autumn while producing leaves in April. Visitors
      are encouraged to sample wild fruits without picking them, while mushroom gathering is strictly
      prohibited.


      The [European wildcat](/especie/felis_silvestris/) represents the park's crowning discovery: in 2007 it
      was genetically verified here via DNA for the first time in 35 years in Austria. Glimpsing one in the
      wild is nearly impossible, but Frieda and Carlo, two wildcats, live in Austria's largest wildcat
      enclosure (450 m²), viewed directly from the visitor centre foyer.
    visit: >-
      Begin at the Park House, 1.5 km from Hardegg on the way to Retz: it is the departure point for
      excursions and provides information from staff and rangers. The exhibition "NaturGeschichten" shows the
      valley from the perspective of the black stork, with a giant aerial view. From the foyer you can see the
      wildcat enclosure, and there are feeding presentations and a walking trail designed to follow their
      tracks. Excursions and events are also offered, such as "Wildnis Schnuppern", and personalized guided
      tours, "Rent a Ranger".


      There are 100 km of trails and cycling routes in Thayatal-Podyjí. The Hennerweg is a 1.8 km themed
      trail, taking about 40 minutes, with six stations on forest development and deadwood; early flowers can
      be seen there, and in autumn the leaves of beeches and oaks.
    history: >-
      The fall of the Iron Curtain in 1989 made cooperation possible, and soon after the parks of Podyjí
      (1991) and Thayatal (2000) were born. On 15 July 1999, ministers from Austria and the Czech Republic and
      the governor of Lower Austria signed a declaration of cooperation between the two parks. In their
      agreement appears the phrase: "the border down the middle of the river divides states, but not
      ecosystems".


      The Austrian park occupies 1,360 ha, and Podyjí 6,300 ha, between Znojmo and Vranov nad Dyjí in South
      Moravia. The IUCN recognized Thayatal as Category II in 2001.
    before: >-
      Remain strictly on marked trails to safeguard sensitive flora and breeding fauna. Dogs must be kept on a
      leash at all times. Camping, bivouacking and lighting fires are strictly forbidden throughout the park.
      The Thaya is not designated for swimming, and boating or kayaking is prohibited on the river within the
      park. Cycling is only allowed on designated cycling tracks.
    around: >-
      To the northwest along the Thaya system lies the [Forêt d'Anlier](/lugar/foret-d-anlier/), [Grande Forêt
      de Saint-Hubert](/lugar/grande-foret-de-saint-hubert/), [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) and [Masivul Vlădeasa](/lugar/masivul-vladeasa/),
      which share rich forest and woodland species.
  fr:
    intro: >-
      En 1989, le rideau de fer est tombé, permettant à la Thaya, qui marque la frontière entre l'Autriche et
      la République tchèque, de cesser d'être une zone militaire surveillée pour devenir une vallée partagée.
      Ce qui fut protégé par la suite forme deux parcs nationaux parfaitement continus : le Thayatal, côté
      autrichien, créé en 2000, et le Podyjí, sur l'autre rive, établi en 1991. Ensemble, ils préservent
      quelque 7 700 hectares d'une gorge où la rivière, la Thaya ou Dyje, a creusé 23,3 km de méandres
      spectaculaires, le cours d'eau lui-même traçant la frontière.
    landscape: >-
      Il y a entre 5 et 1,5 million d'années, la Thaya a profondément entaillé les roches métamorphiques du
      massif de Bohême jusqu'à 150 m de profondeur, façonnant l'une des plus belles vallées d'épigénie
      d'Europe centrale. Le lit rocheux est formé de granite, de gneiss et de schiste vieux de jusqu'à 600
      millions d'années, constituant le socle géologique le plus ancien d'Autriche. Le méandre le plus célèbre
      enserre Merkersdorf, où la rivière contourne presque totalement l'Umlaufberg—la « montagne du méandre »
      de 378 m—séparée seulement par un isthme rocheux d'environ 120 m. Du sommet, la vue embrasse toute la
      vallée.


      La vallée se tient exactement sur une charnière climatique, entre le Waldviertel humide et le
      Weinviertel pannonien plus chaud, favorisant la rencontre d'espèces du sud-est européen, des piémonts
      alpins et d'Europe centrale. Plus de 90 % du parc est boisé : des chênaies thermophiles sur granite
      acide à l'est, et de fraîches hêtraies à l'ouest. Sur les corniches rocheuses et les versants abrupts
      prospèrent des pelouses steppiques sèches, refuges de raretés botaniques. Les prairies fleuries du parc,
      d'environ 63 ha, abritent orchidées sauvages, œillets des chartreux et sauge des prés, fauchées une à
      deux fois l'an à partir de la mi-juin avec des barres préservant les insectes.
    wildlife: >-
      Le fil des saisons dicte la vie sauvage. Fin février ou début mars percent les perce-neiges, puis le
      sous-bois se constelle d'hépatiques, de bois-joli, de pulmonaires et de primevères. Le versant sud de
      l'Überstieg se pare du jaune des cornouillers mâles en fleur. Vers la mi-mars revient d'Afrique la
      [cigogne noire](/especie/ciconia_nigra/), que l'on observe couramment en quête de nourriture dans la
      Thaya autour de l'Umlaufberg ou pêchant entre Hardegg et l'Überstieg, surtout à l'aube. Le parc
      accueille huit des dix espèces de pics d'Autriche, et le sentier Einsiedlerweg montre de nombreux troncs
      travaillés par le [pic noir](/especie/dryocopus_martius/).


      En été, dès les premières lueurs, couleuvres tessellées et couleuvres d'Ésculape
      ([Esculapio](/especie/elaphe_longissima/)) viennent se chauffer sur les rochers aux côtés des lézards
      verts. Au début de mai, ces lézards émeraudes paradent sur les belvédères de l'Überstieg et du plateau
      Max. Sur les berges chassent bergeronnettes et cincles plongeurs, tandis qu'avec un peu de chance le
      [martin-pêcheur d'Europe](/especie/alcedo_atthis/) rase l'eau. Dans les eaux préservées trouve refuge
      l'écrevisse à pattes rouges, aujourd'hui menacée.


      En automne éclatent le jaune des bouleaux et le rouge vif des érables. La seule fleuraison tardive est
      celle du colchique d'automne, qui fleurit en automne et déploie ses feuilles en avril. On encourage à
      goûter les baies sauvages sans cueillette excessive, et le ramassage des champignons est interdit.


      Le [chat sauvage](/especie/felis_silvestris/) représente la grande révélation : en 2007, sa présence a
      été prouvée génétiquement par ADN pour la première fois en 35 ans en Autriche dans ce parc. L'apercevoir
      en pleine forêt relève de l'exploit, mais Frieda et Carlo, deux chats sauvages, vivent dans le plus
      grand enclos d'Autriche (450 m²), visible depuis le hall de la maison du parc.
    visit: >-
      Commencez par la Maison du Parc, à 1,5 km de Hardegg sur la route de Retz : c'est le point de départ des
      excursions et elle fournit les renseignements de l'équipe et des rangers. L'exposition «
      NaturGeschichten » montre la vallée du point de vue de la cigogne noire, avec une vue aérienne géante.
      Depuis le hall, on aperçoit l'enclos des chats sauvages, avec des animations de nourrissage et un
      sentier pédestre conçu pour suivre leurs traces. Des excursions et événements sont également proposés,
      comme « Wildnis Schnuppern », ainsi que des sorties accompagnées personnalisées, « Rent a Ranger ».


      Il y a 100 km de sentiers et d'itinéraires cyclables dans le Thayatal-Podyjí. Le Hennerweg est un
      sentier thématique de 1,8 km, d'environ 40 minutes, avec six stations sur le développement de la forêt
      et le bois mort ; on y observe des floraisons précoces et, en automne, les feuilles des hêtres et des
      chênes.
    history: >-
      La chute du rideau de fer en 1989 a rendu la coopération possible, et peu après sont nés les parcs de
      Podyjí (1991) et du Thayatal (2000). Le 15 juillet 1999, les ministres d'Autriche et de République
      tchèque et le gouverneur de Basse-Autriche ont signé une déclaration de coopération entre les deux
      parcs. Leur accord contient cette formule : « la frontière au milieu de la rivière divise les États,
      mais pas les écosystèmes ».


      Le parc autrichien occupe 1 360 ha, et le Podyjí 6 300 ha, entre Znojmo et Vranov nad Dyjí, en Moravie
      du Sud. L'UICN a reconnu le Thayatal en catégorie II en 2001.
    before: >-
      Restez impérativement sur les sentiers balisés pour ne pas déranger la faune ni piétiner la flore
      sensible. Les chiens doivent être tenus en laisse. Le bivouac, le camping sauvage et les feux sont
      strictement interdits. La baignade est proscrite dans la Thaya, et la navigation en canoë ou bateau est
      interdite dans le parc. Le vélo est restreint aux pistes expressément autorisées.
    around: >-
      Dans le réseau européen, la [Forêt d'Anlier](/lugar/foret-d-anlier/), la [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/), la [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) et le [Masivul Vlădeasa](/lugar/masivul-vladeasa/)
      partagent de riches cortèges de faune et de flore forestières.
  de:
    intro: >-
      1989 fiel der Eiserne Vorhang, und die Thaya, die Grenze zwischen Österreich und Tschechien, wandelte
      sich vom bewachten Sperrgebiet zum gemeinsamen Flusstal. Was danach unter Schutz gestellt wurde, sind
      zwei nahtlos ineinander übergehende Nationalparks: das Thayatal in Österreich, gegründet 2000, und
      Podyjí auf der tschechischen Seite seit 1991. Gemeinsam schützen sie rund 7.700 Hektar eines Tals, in
      dem die Thaya auf 23,3 km Mäanderstrecke die Landschaft formt und selbst die Staatsgrenze markiert.
    landscape: >-
      Vor 5 bis 1,5 Millionen Jahren schnitt sich die Thaya bis zu 150 m tief in das kristalline Grundgebirge
      der Böhmischen Masse ein und schuf eines der schönsten Durchbruchstäler Mitteleuropas. Das Flussbett
      besteht aus Granit, Gneis und Schiefergesteinen, die bis zu 600 Millionen Jahre alt sind – das älteste
      Gebirge Österreichs. Die berühmteste Flussschleife liegt bei Merkersdorf, wo das Wasser den 378 m hohen
      Umlaufberg fast vollständig umfließt, getrennt nur durch einen rund 120 m schmalen Felsgrat. Vom Gipfel
      überblickst du das gesamte Tal.


      Das Tal liegt an einer Klimagrenze zwischen feuchtem Waldviertel und pannonischem Weinviertel, weshalb
      hier atlantische, alpine und südosteuropäische Arten aufeinandertreffen. Mehr als 90 % der Parkfläche
      sind bewaldet: trockenwarme Eichenwälder auf saurem Granit im Osten, schattige Buchenwälder im Westen.
      An Steilhängen und Felskanzeln liegen Trockenrasen, Felsfluren und Waldsteppen. Die artenreichen Wiesen
      des Parks (rund 63 ha) beherbergen Orchideen, Karthäusernelken und Wiesensalbei und werden ab Mitte Juni
      ein- bis zweimal jährlich insektenfreundlich gemäht.
    wildlife: >-
      Die Jahreszeiten bestimmen das Naturerlebnis. Ende Februar blühen erste Schneeglöckchen, gefolgt von
      Leberblümchen, Seidelbast, Lungenkraut und Schlüsselblumen. Der Südhang des Überstiegs leuchtet gelb von
      Kornelkirschen. Mitte März kehrt der [Schwarzstorch](/especie/ciconia_nigra/) aus Afrika zurück; man
      sieht ihn häufig bei der Nahrungssuche an der Thaya um den Umlaufberg oder zwischen Hardegg und
      Überstieg fischen. Der Park beherbergt acht der zehn Spechtarten Österreichs, und am Einsiedlerweg
      zeugen viele Stämme von der Aktivität des [Schwarzspechts](/especie/dryocopus_martius/).


      Im Hochsommer sonnen sich Würfelnattern und Äskulapnattern ([Esculapio](/especie/elaphe_longissima/))
      frühmorgens auf Felsen neben Smaragdeidechsen. Anfang Mai balzen die Smaragdeidechsen an den
      Aussichtspunkten Überstieg und Maxplateau. Am Ufer jagen Gebirgsstelzen und Wasseramseln, und mit etwas
      Glück quert der [Eisvogel](/especie/alcedo_atthis/) das Wasser. In den Gewässern findet der bedrohte
      Edelkrebs ein wichtiges Refugium.


      Im Herbst leuchtet das Laub der Birken orange und der Ahorne rot. Die einzige Blüte dieser Zeit ist die
      Herbstzeitlose, die im Herbst blüht und ihre Blätter im April austreibt. Wildfrüchte dürfen gekostet,
      aber nicht gesammelt werden; Pilzesammeln ist verboten.


      Die [Wildkatze](/especie/felis_silvestris/) ist die größte Sensation: 2007 gelang in diesem Park nach 35
      Jahren der erste genetische Nachweis in Österreich. Freilebend ist sie kaum zu erspähen, doch Frieda und
      Carlo bewohnen Österreichs größte Wildkatzenanlage (450 m²), einsehbar direkt aus dem Foyer des
      Nationalparkhauses.
    visit: >-
      Starte am Nationalparkhaus, 1,5 km von Hardegg Richtung Retz: Es ist der Ausgangspunkt für Ausflüge und
      bietet Auskünfte von Mitarbeitern und Rangern. Die Ausstellung „NaturGeschichten“ zeigt das Tal aus
      Sicht des Schwarzstorchs mit einem riesigen Luftbild. Vom Foyer aus blickt man in das Wildkatzengehege
      mit Schaufütterungen und einem Erlebnisweg auf den Spuren der Tiere. Angeboten werden auch Führungen und
      Veranstaltungen wie „Wildnis Schnuppern“ und persönliche Touren über „Rent a Ranger“.


      Im Thayatal-Podyjí gibt es 100 km Wander- und Radwege. Der Hennerweg ist ein 1,8 km langer Themenweg von
      etwa 40 Minuten Dauer mit sechs Stationen zu Waldentwicklung und Totholz; dort blühen Frühblüher, und im
      Herbst leuchten die Blätter von Buchen und Eichen.
    history: >-
      Der Fall des Eisernen Vorhangs 1989 ermöglichte die grenzüberschreitende Zusammenarbeit, und bald darauf
      entstanden die Nationalparks Podyjí (1991) und Thayatal (2000). Am 15. Juli 1999 unterzeichneten die
      Minister Österreichs und Tschechiens sowie der Landeshauptmann von Niederösterreich eine
      Kooperationserklärung beider Parks. In der Vereinbarung steht der Leitsatz: „Die Grenze in der
      Flussmitte trennt Staaten, aber keine Ökosysteme“.


      Der österreichische Park umfasst 1.360 ha und Podyjí 6.300 ha zwischen Znojmo und Vranov nad Dyjí in
      Südmähren. Die IUCN erkannte das Thayatal 2001 als Kategorie II an.
    before: >-
      Bleibe auf den markierten Wegen zum Schutz von Tieren und Pflanzen. Hunde sind an der Leine zu führen.
      Zelten, Biwakieren und offenes Feuer sind verboten. Baden in der Thaya ist nicht gestattet; Boot- und
      Kanufahren ist auf dem Parkabschnitt untersagt. Radfahren ist nur auf ausgewiesenen Wegen erlaubt.
    around: >-
      Im europäischen Schutzgebietsnetz teilen [Forêt d'Anlier](/lugar/foret-d-anlier/), [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/), [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) und [Masivul Vlădeasa](/lugar/masivul-vladeasa/)
      wertvolle Waldlebensräume.
  it:
    intro: >-
      Nel 1989 cadde la cortina di ferro e la Thaya, che segna il confine tra Austria e Repubblica Ceca, poté
      smettere di essere una linea presidiata per diventare una valle condivisa. Ciò che venne protetto in
      seguito sono due parchi nazionali contigui senza cesure: il Thayatal in Austria, istituito nel 2000, e
      il Podyjí sull'altra sponda dal 1991. Insieme tutelano circa 7.700 ettari di una forra in cui il fiume
      Thaya o Dyje ha scavato 23,3 km di meandri, con le acque stesse a segnare la frontiera.
    landscape: >-
      Tra 5 e 1,5 milioni di anni fa la Thaya si è incisa nelle rocce metamorfiche del Massiccio Boemo fino a
      150 m di profondità, creando una delle valli d'epigenesi più spettacolari dell'Europa centrale. Il greto
      roccioso è formato da granito, gneiss e scisti risalenti fino a 600 milioni di anni fa, la catena più
      antica d'Austria. L'ansa più celebre sorge presso Merkersdorf, dove il fiume circonda quasi per intero
      l'Umlaufberg—il "monte del meandro" di 378 m—separato solo da una lama di roccia di circa 120 m. Dalla
      vetta si domina l'intera vallata.


      La valle si trova su una cerniera climatica tra il Waldviertel umido e il Weinviertel pannonico,
      favorendo l'incontro di specie dell'Europa sud-orientale, delle prealpi e dell'Europa centrale. Più del
      90% del parco è foresta: querceti termofili su granito acido a est e fresche faggete a ovest. Sui
      versanti scoscesi e sui terrazzi rocciosi crescono praterie aride e steppe alberate di grande pregio
      botanico. I prati del parco, estesi per circa 63 ha, accolgono orchidee, garofani dei certosini e salvia
      dei prati, falciati una o due volte l'anno a partire da metà giugno con barre rispettose degli insetti.
    wildlife: >-
      Le stagioni scandiscono la vita del fondovalle. A fine febbraio spuntano i bucaneve, poi il sottobosco
      si tinge di erba trinità, dafne, polmonaria e primule. Il versante meridionale dell'Überstieg si copre
      del giallo dei cornioli in fiore. A metà marzo torna dall'Africa la [cicogna
      nera](/especie/ciconia_nigra/), avvistata regolarmente mentre cerca cibo nella Thaya attorno
      all'Umlaufberg o pesca tra Hardegg e l'Überstieg all'alba. Il parco ospita otto delle dieci specie di
      picchi dell'Austria, e lungo il sentiero Einsiedlerweg molti tronchi testimoniano l'attività del
      [picchio nero](/especie/dryocopus_martius/).


      In estate, alle prime ore del giorno, bisce tassellate e colubri di Esculapio
      ([Esculapio](/especie/elaphe_longissima/)) salgono a scaldarsi sulle rocce accanto ai ramarri
      occidentali. A inizio maggio i ramarri cercano il partner sui belvedere dell'Überstieg e dell'altopiano
      Max. Lungo le rive cacciano ballerine e merli acquaioli, e con un pizzico di fortuna il [martin
      pescatore](/especie/alcedo_atthis/) sfreccia sull'acqua. Nelle acque limpide trova rifugio il gambero di
      fiume europeo, oggi minacciato.


      In autunno risaltano l'arancione delle betulle e il rosso degli aceri. L'unico fiore di questo periodo è
      il colchico autunnale, che fiorisce a fine stagione e mette le foglie in aprile. È consentito assaggiare
      i frutti selvatici senza raccoglierli, mentre è vietata la raccolta dei funghi.


      Il [gatto selvatico](/especie/felis_silvestris/) rappresenta la scoperta più straordinaria: nel 2007 ne
      è stata confermata la presenza tramite DNA per la prima volta in 35 anni in Austria proprio in questo
      parco. Scorgerlo in libertà è quasi impossibile, ma Frieda e Carlo vivono nel più grande recinto di
      gatti selvatici d'Austria (450 m²), visibile dall'atrio della Casa del Parco.
    visit: >-
      Inizia dalla Casa del Parco, a 1,5 km da Hardegg sulla strada per Retz: è il punto di partenza delle
      escursioni e offre informazioni da parte del personale e dei ranger. L'esposizione «NaturGeschichten»
      mostra la valle dal punto di vista della cicogna nera, con una gigantesca veduta aerea. Dall'atrio si
      osserva il recinto dei gatti selvatici, con sessioni di alimentazione e un sentiero pensato per seguire
      le loro tracce. Si organizzano anche escursioni ed eventi come «Wildnis Schnuppern» e uscite
      personalizzate con guida, «Rent a Ranger».


      Ci sono 100 km di sentieri e percorsi in bicicletta nel Thayatal-Podyjí. L'Hennerweg è un sentiero
      tematico di 1,8 km, di circa 40 minuti, con sei postazioni sullo sviluppo del bosco e sul legno morto;
      vi si scorgono fioriture precoci e in autunno le foglie di faggi e querce.
    history: >-
      La caduta della cortina di ferro nel 1989 rese possibile la cooperazione, e poco dopo nacquero i parchi
      di Podyjí (1991) e Thayatal (2000). Il 15 luglio 1999 i ministri di Austria e Repubblica Ceca e il
      governatore della Bassa Austria firmarono una dichiarazione di cooperazione tra i due parchi. Nel loro
      accordo compare la frase: «il confine nel mezzo del fiume divide stati, ma non ecosistemi».


      Il parco austriaco si estende per 1.360 ha e il Podyjí per 6.300 ha, tra Znojmo e Vranov nad Dyjí in
      Moravia Meridionale. La IUCN ha riconosciuto il Thayatal nella categoria II nel 2001.
    before: >-
      Resta sempre lungo i sentieri segnati per non disturbare la fauna né danneggiare la flora delicata. I
      cani devono essere tenuti al guinzaglio. Campeggiare, bivaccare e accendere fuochi sono severamente
      vietati. È vietato fare il bagno nella Thaya, così come navigare in canoa o gommone nel tratto del
      parco. La bicicletta è consentita solo sui tracciati autorizzati.
    around: >-
      Nella rete protetta europea, la [Forêt d'Anlier](/lugar/foret-d-anlier/), la [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/), la [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) e il [Masivul Vlădeasa](/lugar/masivul-vladeasa/)
      condividono preziose comunità forestali.
  pt:
    intro: >-
      Em 1989 ruiu a Cortina de Ferro, e o Thaya, que desenha a fronteira entre a Áustria e a República Checa,
      pôde deixar de ser uma linha vigiada para se tornar um vale partilhado. O que se protegeu em seguida são
      dois parques nacionais contíguos sem barreiras: o Thayatal na Áustria, criado em 2000, e o Podyjí na
      margem oposta desde 1991. Juntos resguardam cerca de 7.700 hectares de um desfiladeiro onde o rio Thaya
      ou Dyje escavou 23,3 km de meandros sinuosos, assinalando a própria fronteira de Estado.
    landscape: >-
      Há entre 5 e 1,5 milhões de anos, o Thaya entalhou profundamente o soco metamórfico do Maciço da Boémia
      até 150 m de profundidade, gerando um dos mais belos vales de fenda epigenética da Europa Central. O
      leito rochoso é composto por granito, gnaisse e xistos com até 600 milhões de anos, a formação geológica
      mais antiga da Áustria. A curva mais afamada fica perto de Merkersdorf, onde o rio circunda quase
      integralmente o Umlaufberg—o monte do meandro com 378 m—separado apenas por uma estreita crista rochosa
      de cerca de 120 m. Do cume avista-se todo o vale.


      O vale situa-se sobre uma charneira climática entre o húmido Waldviertel e o tépido Weinviertel
      panónico, reunindo espécies do sudeste europeu, do sopé alpino e da Europa Central. Mais de 90% do
      parque é floresta: carvalhais termófilos sobre granito ácido a leste e faiais sombrios a oeste. Nas
      escarpas pronunciadas e saliências rochosas estendem-se pastagens secas e estepes arborizadas de grande
      valor botânico. Os prados do parque, somando cerca de 63 ha, acolhem orquídeas bravas,
      cravos-dos-cartuxos e salva-dos-prados, ceifados uma a duas vezes por ano a partir de meados de junho
      com barras de corte que protegem os insetos.
    wildlife: >-
      A sucessão das estações rege a natureza. Em finais de fevereiro despontam os primeiros fura-neves,
      cobrindo-se depois o chão da mata de hepáticas, dáfne, pulmonária e prímulas. A encosta sul do Überstieg
      tinge-se de amarelo com a floração das cornisqueiras. Em meados de março regressa de África a
      [cegonha-preta](/especie/ciconia_nigra/), avistada com frequência a alimentar-se no Thaya em redor do
      Umlaufberg ou a pescar entre Hardegg e o Überstieg logo pela manhã. O parque acolhe oito das dez
      espécies de pica-paus da Áustria, e no trilho Einsiedlerweg muitos troncos evidenciam a presença do
      [pica-pau-preto](/especie/dryocopus_martius/).


      No verão, logo ao amanhecer, cobras-de-água-tesseladas e cobras-de-esculápio
      ([Esculapio](/especie/elaphe_longissima/)) sobem a aquecer-se nas rochas junto a lagartos-de-água
      esmeraldinos. No início de maio esses lagartos procuram parceiro nos miradouros do Überstieg e do
      planalto Max. Nas margens caçam alvéolas e melros-d'água, e com sorte o
      [guarda-rios-comum](/especie/alcedo_atthis/) cruza velozmente o rio. Nas águas límpidas refugia-se o
      lagostim-de-patas-vermelhas, hoje ameaçado.


      No outono ressalta o laranja das bétulas e o vermelho dos bordos. A única florada desta época é o
      açafrão-do-prado, que floresce no outono e lança folhas em abril. Encoraja-se a provar os frutos
      silvestres sem os colher, sendo proibido apanhar cogumelos.


      O [gato-bravo](/especie/felis_silvestris/) constitui o achado mais marcante: em 2007 confirmou-se por
      análise de ADN a sua presença neste parque pela primeira vez em 35 anos na Áustria. Avistá-lo em
      liberdade é quase impossível, mas Frieda e Carlo habitam o maior cercado de gatos-bravos da Áustria (450
      m²), visível a partir do átrio da Casa do Parque.
    visit: >-
      Começa pela Casa do Parque, a 1,5 km de Hardegg a caminho de Retz: é o ponto de partida das excursões e
      disponibiliza informações prestadas pela equipa e pelos guardas. A exposição «NaturGeschichten» mostra o
      vale sob a perspetiva da cegonha-preta, com uma vista aérea gigante. A partir do átrio avista-se o
      cercado dos gatos-bravos, havendo sessões de alimentação e um trilho pedestre concebido para seguir os
      seus rastos. Promovem-se também visitas e eventos, como «Wildnis Schnuppern», e percursos personalizados
      com guia, «Rent a Ranger».


      Há 100 km de caminhos e rotas de bicicleta no Thayatal-Podyjí. O Hennerweg é um trilho temático de 1,8
      km, com cerca de 40 minutos, com seis paragens sobre o desenvolvimento da floresta e a madeira morta;
      ali observam-se flores temporãs e no outono a folhagem de faias e carvalhos.
    history: >-
      A queda da Cortina de Ferro em 1989 permitiu a cooperação, e pouco depois nasceram os parques de Podyjí
      (1991) e do Thayatal (2000). A 15 de julho de 1999, os ministros da Áustria e da República Checa e o
      governador da Baixa Áustria assinaram uma declaração de cooperação entre ambos os parques. No seu acordo
      consta a frase: «a fronteira a meio do rio divide Estados, mas não ecossistemas».


      O parque austríaco abrange 1.360 ha, e o Podyjí 6.300 ha, entre Znojmo e Vranov nad Dyjí, na Morávia do
      Sul. A UICN reconheceu o Thayatal na categoria II em 2001.
    before: >-
      Permanece estritamente nos trilhos assinalados para não perturbar a fauna nem pisar espécies raras. Os
      cães têm de andar sempre com trela. Acampar, pernoitar em vivac e foguear são expressamente proibidos. É
      interdito tomar banho no Thaya, bem como navegar em botes ou caiaques no setor do parque. O uso de
      bicicleta restringe-se às vias assinaladas.
    around: >-
      No mosaico de conservação europeu, a [Forêt d'Anlier](/lugar/foret-d-anlier/), a [Grande Forêt de
      Saint-Hubert](/lugar/grande-foret-de-saint-hubert/), a [Reserva Natural da Serra da
      Malcata](/lugar/reserva-natural-da-serra-da-malcata/) e o [Masivul Vlădeasa](/lugar/masivul-vladeasa/)
      partilham valiosos habitats florestais.
