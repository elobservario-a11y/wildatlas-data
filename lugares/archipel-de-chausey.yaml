resumen:
  es: >-
    El archipiélago insular más grande de Europa por amplitud de mareas (52 islotes en pleamar que se
    convierten en 365 en bajamar).
  en: Europe's largest insular archipelago by tidal range (52 islets at high tide expanding to 365 at low tide).
  fr: >-
    Le plus vaste archipel insulaire d'Europe par le marnage (52 îlots à marée haute se muant en 365 à marée
    basse).
  de: >-
    Europas größter Inselarchipel nach Tidenhub (52 Inseln bei Flut, die sich bei Ebbe in 365 Inseln und Riffe
    verwandeln).
  it: >-
    Il più grande arcipelago insulare d'Europa per escursione di marea (52 isolotti con l'alta marea che
    diventano 365 con la bassa marea).
  pt: >-
    O maior arquipélago insular da Europa por amplitude de marés (52 ilhéus na preia-mar que se convertem em
    365 na baixa-mar).
unico:
  es: >-
    Chausey es el único sitio de reproducción en Francia de la serreta mediana, en un archipiélago donde la
    marea puede subir y bajar hasta 14 metros.
  en: >-
    Chausey is the sole breeding colony in France for the red-breasted merganser, across an archipelago where
    tidal fluctuations reach up to 14 metres.
  fr: >-
    Chausey constitue l'unique site de nidification en France du harle huppé, au cœur d'un archipel où le
    marnage atteint jusqu'à 14 mètres.
  de: >-
    Chausey ist der einzige Brutplatz des Mittelsägers in ganz Frankreich, in einem Archipel mit einem
    Gezeitenhub von bis zu 14 Metern.
  it: >-
    Chausey è l'unico sito di nidificazione in Francia dello smergo minore, in un arcipelago dove l'escursione
