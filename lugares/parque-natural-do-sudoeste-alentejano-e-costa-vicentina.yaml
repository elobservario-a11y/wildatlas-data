resumen:
  es: >-
    La franja litoral salvaje más extensa y mejor preservada del sur de Europa (110 km), acantilados negros de
    esquisto del Cabo de San Vicente.
  en: >-
    The most extensive and best preserved wild coastal strip in southern Europe (110 km), black schist cliffs
    of Cape St. Vincent.
  fr: >-
    La bande côtière sauvage la plus vaste et la mieux préservée d'Europe méridionale (110 km), falaises
    noires de schiste du cap Saint-Vincent.
  de: >-
    Der ausgedehnteste und besterhaltene wilde Küstenstreifen Südeuropas (110 km), schwarze Schieferklippen
    des Cabo de São Vicente.
  it: >-
    La fascia costiera selvaggia più estesa e meglio conservata dell'Europa meridionale (110 km), falesie nere
    di scisto di Capo San Vincenzo.
  pt: >-
    A faixa costeira selvagem mais extensa e mais bem preservada do sul da Europa (110 km), arribas negras de
    xisto do Cabo de São Vicente.
unico:
  es: >-
    Un litoral de 110 kilómetros con aves que crían en los acantilados y una red de senderos que lo recorre
    entera.
  en: >-
    A coastline stretching 110 kilometres with cliff-nesting birds and a walking network that covers its
    entire length.
  fr: >-
    Un littoral de 110 kilomètres avec des oiseaux nichant sur les falaises maritimes et un réseau de sentiers
    qui le parcourt intégralement.
  de: >-
    Ein 110 Kilometer langer Küstenstreifen mit an Felsklippen brütenden Vögeln und einem Wegenetz, das ihn
    lückenlos erschließt.
  it: >-
    Un litorale di 110 chilometri con uccelli che nidificano sulle falesie e una rete di sentieri che lo
    attraversa interamente.
  pt: >-
    Um litoral de 110 quilómetros com aves que nidificam nas arribas e uma rede de trilhos que o percorre na
    totalidade.
observaciones:
  es: >-
    Los acantilados se erosionan sin parar y pisarlos supone peligro de caída; el trail running no es
    compatible con el cuidado que exige este ecosistema. Los senderos pasan por caminos públicos y privados:
    se camina bajo la propia responsabilidad y los propietarios autorizan solo el paso a pie. Cuenta con entre
    dos y cinco días.
texto:
  es:
    intro: >-
      Aquí las cigüeñas no anidan en campanarios, sino en acantilados. En la costa suroeste de Portugal, sobre
      el Atlántico, la cigüeña blanca, el halcón peregrino y la chova piquirroja crían en los cortados
      marinos, y esa nidificación en la roca es una de las señas del parque. Se extiende a lo largo de 110
      kilómetros, desde el arroyo de Junqueira, en São Torpes, hasta la playa de Burgau. Además de la franja
      costera y los 2 kilómetros de fondo marino, incluye el valle del río Mira hasta Odemira y parte de la
      sierra de Cercal.
    landscape: >-
      El parque reúne acantilados abruptos y recortados, playas, islotes y arrecifes —entre ellos la isla de
      Pessegueiro y un arrecife de coral poco común en Carrapateira—, el estuario del Mira, el cabo Sardão, el
      promontorio de Sagres, dunas, brezales, marismas, lagunas temporales y barrancos. En las sierras
      litorales y en los barrancos, más frescos y húmedos, una densa vegetación de árboles y arbustos flanquea
      los arroyos.


      El clima es mediterráneo con fuerte influencia marítima y temperaturas suaves todo el año salvo con
      viento de levante. El promontorio de Sagres tiene la menor amplitud térmica del Portugal continental.
      Llueve más hacia el norte y el interior, y la estación de lluvias va de noviembre a abril. El mar es
      rico en biodiversidad, puro y fresco por el afloramiento frecuente, con temperaturas de 14-15 grados en
      febrero y 20-21 en septiembre.
    wildlife: >-
      La vegetación mezcla elementos mediterráneos, norteatlánticos y africanos, con predominio de los
      primeros. Hay unas 750 especies, más de 100 endémicas, raras o localizadas, y 12 que no existen en
      ningún otro lugar. Entre los endemismos figuran Biscutella vicentina, Scilla vicentina, Centaurea
      vicentina, Diplotaxis vicentina, Hyacinthoides vicentina, Cistus palhinhae y Plantago almogravensis.
      Entre los árboles naturales dominan los Quercus: el alcornoque y el quejigo, sobre todo en los
      barrancos.


      La fauna gira alrededor del cielo. El parque es zona de paso de aves planeadoras y de paseriformes
      migradores entre las zonas de invernada en África y las de cría en Europa. Entre las aves que viven aquí
      están el [águila pescadora](/especie/pandion_haliaetus/), el cormorán, la [cigüeña
      blanca](/especie/ciconia_ciconia/), la [garceta común](/especie/egretta_garzetta/), el [halcón
      peregrino](/especie/falco_peregrinus/), el [cernícalo primilla](/especie/falco_naumanni/) y la [chova
      piquirroja](/especie/pyrrhocorax_pyrrhocorax/). En las zonas abiertas hay [aguilucho
      cenizo](/especie/circus_pygargus/), [aguilucho pálido](/especie/circus_cyaneus/), [alcaraván
      común](/especie/burhinus_oedicnemus/) y [sisón común](/especie/tetrax_tetrax/).


      Entre los mamíferos hay [nutria europea](/especie/lutra_lutra/), garduña, tejón, zorro, [gato
      montés](/especie/felis_silvestris/), meloncillo y [jabalí](/especie/sus_scrofa/); los tejones excavan
      sus madrigueras en los acantilados. Las cuevas, como la de Monte Clérigo y la gruta Amarela, son refugio
      de importantes comunidades de murciélagos. Varias especies de anfibios crían en las lagunas temporales,
      entre ellas el sapo común, el sapo de espuelas y el sapillo moteado, y entre los reptiles hay culebra
      bastarda y culebra lisa meridional. En ríos, charcas y marismas viven peces endémicos de Portugal como
      el barbo del sur y la boga portuguesa.


      Las mejores épocas son de abril a junio y de septiembre a noviembre.
    visit: >-
      La red de senderos de la Rota Vicentina se extiende por toda la costa alentejana y vicentina y también
      por campo y sierra del interior. Tiene dos grandes rutas y los recorridos circulares.


      El Trilho dos Pescadores va siempre junto al mar, por los caminos que usaban los vecinos para llegar a
      las playas y los pesqueros. Es un sendero estrecho solo para ir a pie, entre acantilados y con mucha
      arena, y suma más de 200 kilómetros por el parque, en 13 etapas de un día que se pueden hacer en ambos
      sentidos entre septiembre y junio. El Caminho Histórico es un gran recorrido (GR) de caminos rurales con
      tramos de dehesa, sierra, valles, ríos y arroyos, con 13 etapas de un día de máximo 25 kilómetros, salvo
      el enlace Sabóia-Odemira, de 33.


      Los recorridos circulares reúnen veinticuatro rutas que suman 263 kilómetros. Son caminatas de medio
      día, de dieciséis kilómetros como máximo, que se pueden hacer entre septiembre y junio. Entre las
      actividades que permite la normativa están la observación de fauna y flora en caminos existentes y
      lugares acondicionados, y las expediciones fotográficas.
    history: >-
      Durante siglos la población vivió de la pesca, la agricultura y la ganadería, y el turismo gana peso
      cada vez más. Sagres y el cabo de São Vicente concentran monumentos nacionales e inmuebles clasificados
      de interés público. La importancia natural del territorio condujo a su inclusión en la lista nacional de
      espacios comunitarios y a la creación de una zona de protección de aves, que abarca 74.415 hectáreas del
      parque, incluidas 17.462 marinas.


      Las principales amenazas para la biodiversidad son los invernaderos y plantaciones de césped en el
      litoral y las plantaciones de eucalipto en el interior.
    before: >-
      Los acantilados se erosionan sin parar y pisarlos supone peligro de caída; el trail running no es
      compatible con el cuidado que exige este ecosistema. Los senderos pasan por caminos públicos y privados:
      se camina bajo la propia responsabilidad y los propietarios autorizan solo el paso a pie. Cuenta con
      entre dos y cinco días.
    around: >-
      El atlas no tiene lugares cercanos a este parque, pero comparte la cigüeña blanca y la nutria con la
      [Reserva de la Biosfera del Spreewald](/lugar/biospharenreservat-spreewald/).
  en:
    intro: >-
      Here storks do not nest on church towers, but on sea cliffs. Along Portugal's south-western Atlantic
      coast, the white stork, peregrine falcon and red-billed chough breed directly on ocean-facing rock
      faces, making maritime cliff-nesting a defining trademark of the park. It stretches along 110
      kilometres, from Junqueira brook in São Torpes down to Burgau beach. Beyond the coastal fringe and 2
      kilometres of marine seabed, it incorporates the Mira River valley up to Odemira and portions of the
      Cercal range.
    landscape: >-
      The park brings together sheer cliffs, beaches, islets and reefs — including Pessegueiro Island and a
      rare coral reef formation off Carrapateira —, the Mira estuary, Cape Sardão, the Sagres promontory,
      dunes, heaths, saltmarshes, temporary ponds and ravines. In the coastal hills and ravines, cooler and
      more humid, dense tree and shrub formations line the watercourses.


      The climate is Mediterranean with strong oceanic moderation and mild temperatures year-round except
      during east winds. The Sagres promontory exhibits the narrowest annual temperature amplitude in mainland
      Portugal. Rainfall increases northward and inland, with the wet season running from November to April.
      The ocean is rich in biodiversity, crisp and cold due to frequent upwelling, with water temperatures
      around 14-15 degrees in February and 20-21 in September.
    wildlife: >-
      Vegetation blends Mediterranean, North Atlantic and African floral elements, dominated by the former. It
      hosts roughly 750 species, over 100 of which are endemic, rare or localized, including 12 found nowhere
      else on Earth. Among endemics are Biscutella vicentina, Scilla vicentina, Centaurea vicentina,
      Diplotaxis vicentina, Hyacinthoides vicentina, Cistus palhinhae and Plantago almogravensis. Native tree
      cover is dominated by Quercus: cork oak and Portuguese oak, especially along shaded valleys.


      Fauna centres on the sky. The park is a major migration bottleneck for soaring raptors and passerines
      travelling between African wintering grounds and European breeding territories. Birds resident here
      include the [osprey](/especie/pandion_haliaetus/), European shag, the [white
      stork](/especie/ciconia_ciconia/), the [little egret](/especie/egretta_garzetta/), the [peregrine
      falcon](/especie/falco_peregrinus/), the [lesser kestrel](/especie/falco_naumanni/) and the [red-billed
      chough](/especie/pyrrhocorax_pyrrhocorax/). In open grassland habitats occur [Montagu's
      harrier](/especie/circus_pygargus/), [hen harrier](/especie/circus_cyaneus/),
      [stone-curlew](/especie/burhinus_oedicnemus/) and [little bustard](/especie/tetrax_tetrax/).


      Mammals include the [Eurasian otter](/especie/lutra_lutra/), stone marten, European badger, red fox,
      [wildcat](/especie/felis_silvestris/), Egyptian mongoose and [wild boar](/especie/sus_scrofa/); badgers
      regularly excavate burrows right into maritime cliffs. Caves such as Monte Clérigo and Gruta Amarela
      shelter significant bat colonies. Several amphibian species breed in temporary ponds, including common
      toad, western spadefoot and parsley frog, while reptiles include Montpellier snake and southern smooth
      snake. Streams and wetlands support endemic freshwater fish of Portugal such as the southern barbel and
      Portuguese boga.


      The most rewarding months are April to June and September to November.
    visit: >-
      The walking network of the Rota Vicentina spans the entire Alentejo and Vicentine coast, extending
      inland across rural landscapes and hills. It comprises two major walking routes alongside circular day
      walks.


      The Fishermen's Trail (Trilho dos Pescadores) hugs the coastline along footpaths long used by locals to
      reach fishing spots. A narrow trail strictly for walkers, tracing clifftops with extensive sandy
      sections, it spans over 200 kilometres in the park across 13 single-day stages walkable in either
      direction between September and June. The Historical Way (Caminho Histórico) is a long-distance trail
      (GR) through countryside, cork oak forests, valleys and rivers, divided into 13 single-day stages of at
      most 25 kilometres, with the exception of the 33-kilometre Sabóia–Odemira link.


      Circular routes encompass twenty-four walks totalling 263 kilometres. These are half-day excursions of
      sixteen kilometres at most, feasible between September and June. Regulations permit wildlife watching
      along marked tracks and designated sites, as well as photography expeditions.
    history: >-
      For centuries the local population relied on artisanal fishing, smallholder agriculture and livestock
      grazing, with ecotourism gaining steady prominence. Sagres and Cape St. Vincent feature national
      monuments and heritage sites of public interest. The area's immense natural significance led to its
      inclusion in the European Community list of sites and the establishment of a Special Protection Area
      covering 74,415 hectares of the park, including 17,462 marine hectares.


      Primary pressures on biodiversity stem from coastal greenhouse agriculture and turf farms as well as
      inland eucalyptus plantations.
    before: >-
      The cliffs erode continuously and walking near edges poses serious fall hazards; trail running is
      discouraged as incompatible with this fragile habitat. The paths traverse public and private land:
      visitors walk at their own risk and landowners permit foot passage only. Plan for two to five days.
    around: >-
      The atlas has no adjacent sites to this park, but it shares the white stork and otter with the
      [Spreewald Biosphere Reserve](/lugar/biospharenreservat-spreewald/).
  fr:
    intro: >-
      Ici les cigognes ne nichent pas sur les clochers mais sur les falaises marines. Sur le littoral
      sud-ouest du Portugal face à l'Atlantique, la cigogne blanche, le faucon pèlerin et le crave à bec rouge
      se reproduisent sur les parois rocheuses surplombant l'océan, faisant de cette nidification littorale
      une marque d'identité du parc. Celui-ci s'étend sur 110 kilomètres, depuis le ruisseau de Junqueira à
      São Torpes jusqu'à la plage de Burgau. Outre la bande côtière et 2 kilomètres de domaine sous-marin, il
      englobe la vallée du fleuve Mira jusqu'à Odemira et une partie de la serra de Cercal.
    landscape: >-
      Le parc rassemble des falaises escarpées et déchiquetées, des plages, des îlots et des récifs — dont
      l'île de Pessegueiro et un rare récif corallien à Carrapateira —, l'estuaire du Mira, le cap Sardão, le
      promontoire de Sagres, des dunes, des landes, des marais, des mares temporaires et des ravins. Dans les
      collines côtières et les vallons, plus frais et humides, une végétation dense borde les cours d'eau.


      Le climat est méditerranéen à forte influence maritime, offrant des températures tempérées toute l'année
      sauf par vent d'est. Le promontoire de Sagres présente la plus faible amplitude thermique du Portugal
      continental. Les pluies augmentent vers le nord et l'intérieur, la saison pluvieuse s'étendant de
      novembre à avril. L'océan est riche en biodiversité et vivifié par d'abondants upwellings, avec des
      températures d'eau de 14-15 degrés en février et 20-21 en septembre.
    wildlife: >-
      La végétation associe éléments méditerranéens, nord-atlantiques et africains, dominée par les premiers.
      On compte environ 750 espèces de plantes, dont plus de 100 endémiques, rares ou localisées, et 12
      strictement exclusives au territoire. Parmi les endémiques figurent Biscutella vicentina, Scilla
      vicentina, Centaurea vicentina, Diplotaxis vicentina, Hyacinthoides vicentina, Cistus palhinhae et
      Plantago almogravensis. Côté ligneux dominent les Quercus : chêne-liège et chêne faginé, surtout dans
      les vallons.


      La faune a pour royaume le ciel. Le parc constitue un goulot migratoire majeur pour les rapaces planeurs
      et passereaux transitant entre leurs quartiers d'hivernage africains et leurs aires de reproduction
      européennes. Parmi les oiseaux sédentaires ou estivants figurent le [balbuzard
      pêcheur](/especie/pandion_haliaetus/), le cormoran huppé, la [cigogne
      blanche](/especie/ciconia_ciconia/), l'[aigrette garzette](/especie/egretta_garzetta/), le [faucon
      pèlerin](/especie/falco_peregrinus/), le [faucon crécerellette](/especie/falco_naumanni/) et le [crave à
      bec rouge](/especie/pyrrhocorax_pyrrhocorax/). Les espaces ouverts abritent le [busard
      cendré](/especie/circus_pygargus/), le [busard Saint-Martin](/especie/circus_cyaneus/), l'[œdicnème
      criard](/especie/burhinus_oedicnemus/) et l'[outarde canepetière](/especie/tetrax_tetrax/).


      Parmi les mammifères vivent la [loutre d'Europe](/especie/lutra_lutra/), la fouine, le blaireau, le
      renard, le [chat sauvage](/especie/felis_silvestris/), la mangouste ichneumon et le
      [sanglier](/especie/sus_scrofa/) ; les blaireaux creusent fréquemment leurs terriers au sein même des
      falaises. Des cavités telles que celles de Monte Clérigo abritent d'importantes colonies de chiroptères.
      Plusieurs amphibiens se reproduisent dans les mares temporaires, et les rivières hébergent des poissons
      endémiques du Portugal comme le barbeau du sud et la bogue portugaise.


      Les saisons les plus favorables s'étendent d'avril à juin et de septembre à novembre.
    visit: >-
      Le réseau de sentiers de la Rota Vicentina maille l'ensemble du littoral et des terres intérieures. Il
      compte deux grands itinéraires et des circuits circulaires à la journée.


      Le Sentier des Pêcheurs (Trilho dos Pescadores) longe la mer en suivant d'anciens passages empruntés par
      les pêcheurs locaux. Sentier pédestre exclusif cheminant en falaise avec de nombreux passages sableux,
      il totalise plus de 200 kilomètres dans le parc en 13 étapes d'une journée praticables dans les deux
      sens de septembre à juin. Le Chemin Historique (Caminho Histórico) est un sentier de grande randonnée
      (GR) reliant villages, dehesas, collines et rivières en 13 étapes d'un jour de 25 kilomètres au maximum,
      à l'exception du tronçon Sabóia–Odemira qui en compte 33.


      Les circuits circulaires regroupent vingt-quatre itinéraires cumulant 263 kilomètres. Ce sont des
      marches d'une demi-journée de seize kilomètres au plus, réalisables de septembre à juin. Les
      réglementations autorisent l'observation de la faune et de la flore sur les sentiers existants ainsi que
      les randonnées photographiques.
    history: >-
      La population a longtemps vécu de la pêche et de l'agriculture vivrière avant que le tourisme de nature
      ne prenne de l'ampleur. Sagres et le cap Saint-Vincent regroupent plusieurs monuments nationaux et
      édifices classés. La valeur patrimoniale exceptionnelle a motivé la création d'une Zone de Protection
      Spéciale couvrant 74 415 hectares, dont 17 462 en domaine marin.


      Les serres agricoles et gazonnières sur le littoral ainsi que les plantations d'eucalyptus dans
      l'arrière-pays constituent les menaces prépondérantes.
    before: >-
      L'érosion des falaises est permanente et s'approcher du bord présente un danger réel de chute ; le trail
      running n'est pas compatible avec la fragilité du milieu. Les sentiers traversent des parcelles
      publiques et privées : les usagers cheminent sous leur propre responsabilité, le passage n'étant
      autorisé qu'à pied. Prévoyez entre deux et cinq jours.
    around: >-
      L'atlas ne compte pas de sites immédiatement voisins, mais le parc partage la cigogne blanche et la
      loutre avec la [Réserve de biosphère du Spreewald](/lugar/biospharenreservat-spreewald/).
  de:
    intro: >-
      Hier nisten die Störche nicht auf Kirchtürmen, sondern auf Meeresklippen. An Portugals südwestlicher
      Atlantikküste brüten Weißstorch, Wanderfalke und Alpenkrähe direkt an den seeseitigen Felsabstürzen, was
      den Naturpark zu einem weltweiten Unikat macht. Er erstreckt sich über 110 Kilometer von der
      Junqueira-Schlucht bei São Torpes bis zum Strand von Burgau. Neben dem Küstenstreifen und 2 Kilometern
      Meeresboden schließt er das Flusstal des Mira bis Odemira und Teile der Serra de Cercal ein.
    landscape: >-
      Der Park vereint schroffe Klippen, Strände, Inseln und Riffe — darunter die Ilha do Pessegueiro und ein
      seltenes Korallenriff bei Carrapateira —, das Mira-Ästuar, das Cabo Sardão, das Kap von Sagres, Dünen,
      Heiden, Salzwiesen, temporäre Tümpel und Schluchten. In den küstennahen Höhenzügen und feuchteren
      Schluchten säumen dichte Gehölze die Wasserläufe.


      Das Klima ist mediterran mit starker ozeanischer Mäßigung und ganzjährig milden Temperaturen außer bei
      Ostwinden. Das Kap von Sagres verzeichnet die geringste jährliche Temperaturschwankung des
      portugiesischen Festlands. Die Niederschläge nehmen nach Norden und ins Landesinnere zu, wobei die
      Regenzeit von November bis April dauert. Das Meer ist artenreich und kühl infolge von
      Auftriebsströmungen, mit Wassertemperaturen um 14-15 Grad im Februar und 20-21 im September.
    wildlife: >-
      Die Flora vereint mediterrane, nordatlantische und afrikanische Elemente, überwiegend mediterran
      geprägt. Sie zählt rund 750 Arten, davon über 100 endemisch, selten oder lokal begrenzt, und 12 weltweit
      ausschließlich hier vorkommend. Zu den Endemiten gehören Biscutella vicentina, Scilla vicentina,
      Centaurea vicentina, Diplotaxis vicentina, Hyacinthoides vicentina, Cistus palhinhae und Plantago
      almogravensis. Bei den Baumarten dominieren Quercus-Arten: Korkeiche und Portugiesische Eiche, besonders
      in feuchten Tälern.


      Die Tierwelt wird vom Vogelzug dominiert. Der Park ist ein bedeutender Trichter für Segelflieger und
      ziehende Singvögel zwischen afrikanischen Winterquartieren und europäischen Brutgebieten. Unter den
      vorkommenden Vögeln finden sich der [Fischadler](/especie/pandion_haliaetus/), die Krähenscharbe, der
      [Weißstorch](/especie/ciconia_ciconia/), der [Seidenreiher](/especie/egretta_garzetta/), der
      [Wanderfalke](/especie/falco_peregrinus/), der [Rötelfalke](/especie/falco_naumanni/) und die
      [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/). In offenen Landschaften brüten
      [Wiesenweihe](/especie/circus_pygargus/), [Kornweihe](/especie/circus_cyaneus/),
      [Triel](/especie/burhinus_oedicnemus/) und [Zwergtrappe](/especie/tetrax_tetrax/).


      Unter den Säugetieren leben [Fischotter](/especie/lutra_lutra/), Steinmarder, Dachs, Rotfuchs,
      [Wildkatze](/especie/felis_silvestris/), Ichneumon und [Wildschwein](/especie/sus_scrofa/); Dachse
      graben ihre Baue teils unmittelbar in Klippenwände. Höhlen wie jene von Monte Clérigo beherbergen
      Fledermauskolonien. Mehrere Amphibienarten pflanzen sich in temporären Tümpeln fort, während Bäche
      endemische Fische Portugals wie die Südbarbe beherbergen.


      Beste Monate sind April bis Juni und September bis November.
    visit: >-
      Das Wegenetz der Rota Vicentina durchzieht die gesamte Küste sowie das ländliche Hinterland. Es umfasst
      zwei Hauptrouten und ergänzende Rundwege.


      Der Fischerpfad (Trilho dos Pescadores) verläuft unmittelbar am Meer entlang historischer Pfade der
      Küstenfischer. Als reiner Fußweg mit sandigen Passagen und Klippenpfaden umfasst er im Park über 200
      Kilometer in 13 Tagesetappen, die in beiden Richtungen von September bis Juni begangen werden können.
      Der Historische Weg (Caminho Histórico) ist ein Weitwanderweg (GR) durch Weideland, Korkeichenhaine,
      Täler und Flüsse mit 13 Tagesetappen von maximal 25 Kilometern, ausgenommen das Teilstück Sabóia–Odemira
      mit 33.


      Die Rundwege umfassen vierundzwanzig Wanderungen von insgesamt 263 Kilometern Länge. Sie sind
      Halbtagestouren von höchstens sechzehn Kilometern, machbar von September bis Juni. Gestattet sind
      Naturbeobachtung auf bestehenden Pfaden und Fototouren.
    history: >-
      Über Jahrhunderte lebte die Bevölkerung von Fischerei, kleinbäuerlicher Landwirtschaft und Viehzucht,
      bevor der Ökotourismus wuchs. Sagres und das Cabo de São Vicente vereinen Nationaldenkmäler von
      historischer Bedeutung. Die hohe Naturschutzrelevanz führte zur Ausweisung eines Europäischen
      Vogelschutzgebiets von 74.415 Hektar, davon 17.462 im Meeresbereich.


      Als Hauptgefährdungen gelten Gewächshauskulturen und Rollrasenflächen an der Küste sowie
      Eukalyptusaufforstungen im Binnenland.
    before: >-
      Die Klippen erodieren stetig; das Betreten der Ränder birgt Absturzgefahr. Trailrunning ist mit dem
      Schutzstatus unvereinbar. Wege queren Privatland: Begehen auf eigene Gefahr und nur zu Fuß gestattet.
      Planen Sie zwei bis fünf Tage ein.
    around: >-
      Der Atlas führt keine benachbarten Parks, doch teilt das Gebiet Weißstorch und Fischotter mit dem
      [Biosphärenreservat Spreewald](/lugar/biospharenreservat-spreewald/).
  it:
    intro: >-
      Qui le cicogne non nidificano sui campanili, ma sulle scogliere marine. Sulla costa sud-occidentale del
      Portogallo affacciata sull'Atlantico, la cicogna bianca, il falco pellegrino e il gracchio corallino si
      riproducono sulle pareti rocciose marine, rendendo questa nidificazione sulle falesie un emblema del
      parco. L'area si estende per 110 chilometri, dal torrente Junqueira a São Torpes fino alla spiaggia di
      Burgau. Oltre alla costa e a 2 chilometri di fondale marino, comprende la valle del fiume Mira fino a
      Odemira e parte della serra di Cercal.
    landscape: >-
      Il parco racchiude falesie scoscese e frastagliate, spiagge, isolotti e scogliere — tra cui l'isola di
      Pessegueiro e una rara barriera corallina a Carrapateira —, l'estuario del Mira, capo Sardão, il
      promontorio di Sagres, dune, brughiere, paludi, stagni temporanei e forre. Nelle alture litoranee e
      nelle gole, più fresche e umide, una vegetazione lussureggiante costeggia i corsi d'acqua.


      Il clima è mediterraneo con forte influsso oceanico e temperature miti tutto l'anno tranne nei periodi
      di vento da est. Il promontorio di Sagres registra la minore escursione termica del Portogallo
      continentale. Le piogge aumentano verso nord e l'entroterra, con stagione umida da novembre ad aprile.
      L'oceano vanta acque ricche e rinfrescate da costanti risalite di correnti (upwelling), con temperature
      di 14-15 gradi a febbraio e 20-21 a settembre.
    wildlife: >-
      La flora associa elementi mediterranei, nordatlantici e africani, con marcata predominanza mediterranea.
      Vi si contano circa 750 specie vegetali, di cui oltre 100 endemiche, rare o localizzate, e 12 esclusive
      di questo territorio. Tra gli endemismi figurano Biscutella vicentina, Scilla vicentina, Centaurea
      vicentina, Diplotaxis vicentina, Hyacinthoides vicentina, Cistus palhinhae e Plantago almogravensis. Nel
      patrimonio arboreo primeggiano le querce: quercia da sughero e quercia farnetto, specie nelle valli
      riparate.


      La fauna converge verso il cielo. Il parco è un passaggio migratorio nevralgico per rapaci veleggiatori
      e passeriformi tra svernamento in Africa e riproduzione in Europa. Tra i volatili stanziali o estivi
      spiccano il [falco pescatore](/especie/pandion_haliaetus/), il marangone dal ciuffo, la [cicogna
      bianca](/especie/ciconia_ciconia/), la [garzetta](/especie/egretta_garzetta/), il [falco
      pellegrino](/especie/falco_peregrinus/), il [grillaio](/especie/falco_naumanni/) e il [gracchio
      corallino](/especie/pyrrhocorax_pyrrhocorax/). Nelle piane aperte vivono l'[albanella
      minore](/especie/circus_pygargus/), l'[albanella reale](/especie/circus_cyaneus/), l'[occhione
      comune](/especie/burhinus_oedicnemus/) e la [gallina prataiola](/especie/tetrax_tetrax/).


      Tra i mammiferi compaiono la [lontra europea](/especie/lutra_lutra/), la faina, il tasso, la volpe, il
      [gatto selvatico](/especie/felis_silvestris/), la mangusta egiziana e il
      [cinghiale](/especie/sus_scrofa/); i tassi scavano le loro tane persino nelle pareti delle falesie.
      Grotte come quelle di Monte Clérigo riparano comunità di pipistrelli. Numerosi anfibi si riproducono
      negli stagni temporanei e i torrenti ospitano pesci endemici del Portogallo.


      I periodi più indicati per la visita sono da aprile a giugno e da settembre a novembre.
    visit: >-
      La rete escursionistica della Rota Vicentina si snoda lungo l'intero litorale e nell'entroterra rurale.
      Comprende due grandi percorsi e una serie di itinerari circolari giornalieri.


      Il Sentiero dei Pescatori (Trilho dos Pescadores) costeggia costantemente il mare lungo gli antichi
      passaggi usati dai pescatori locali. Riservato esclusivamente ai camminatori, con molti tratti sabbiosi
      su scogliera, si estende per oltre 200 chilometri nel parco in 13 tappe di un giorno percorribili in
      entrambi i versi da settembre a giugno. Il Cammino Storico (Caminho Histórico) è un sentiero a lungo
      percorso (GR) tra campi, sugherete, colline e fiumi con 13 tappe giornaliere di massimo 25 chilometri,
      salvo il tratto Sabóia–Odemira di 33.


      Gli itinerari circolari comprendono ventiquattro percorsi per complessivi 263 chilometri. Sono
      passeggiate di mezza giornata, di sedici chilometri al massimo, praticabili da settembre a giugno. Le
      norme permettono l'osservazione naturalistica lungo i sentieri esistenti e le uscite fotografiche.
    history: >-
      Per generazioni gli abitanti hanno vissuto di pesca, agricoltura e pastorizia, prima che l'ecoturismo
      assumesse rilievo. Sagres e il capo di São Vicente custodiscono monumenti nazionali ed edifici di
      interesse pubblico. Il valore ecologico ha determinato la designazione a Zona di Protezione Speciale per
      74.415 ettari di parco, di cui 17.462 marini.


      Le serre intensive e le colture di prato a rotoli sul litorale assieme alle piantagioni di eucalipto
      nell'interno costituiscono le maggiori insidie.
    before: >-
      Le scogliere sono soggette a continua erosione e sostare sui bordi comporta pericolo di caduta; il trail
      running non è compatibile con la tutela richiesta. I tracciati toccano terreni pubblici e privati: si
      cammina sotto la propria responsabilità e solo a piedi. Considerate da due a cinque giorni.
    around: >-
      L'atlas non presenta parchi confinanti, ma quest'area condivide cicogna bianca e lontra con la [Riserva
      della Biosfera dello Spreewald](/lugar/biospharenreservat-spreewald/).
  pt:
    intro: >-
      Aqui as cegonhas não nidificam em campanários, mas em arribas marinhas. Na costa sudoeste de Portugal,
      virada ao Atlântico, a cegonha-branca, o falcão-peregrino e a gralha-de-bico-vermelho nidificam nas
      escarpas litorais, tornando a nidificação rupícola marítima uma imagem de marca do parque. Este
      prolonga-se ao longo de 110 quilómetros, desde a ribeira da Junqueira, em São Torpes, até à praia do
      Burgau. Além da orla costeira e dos 2 quilómetros de domínio marinho, engloba o vale do rio Mira até
      Odemira e parcelas da serra de Cercal.
    landscape: >-
      O parque associa arribas abruptas e recortadas, praias, ilhéus e recifes — entre os quais a ilha do
      Pessegueiro e um raro recife coralífero na Carrapateira —, o estuário do Mira, o cabo Sardão, o
      promontório de Sagres, dunas, charnecas, sapais, pauis temporários e barrancos. Nas serras litorais e
      nos barrancos, mais frescos e abrigados, uma densa vegetação ripícola orla as linhas de água.


      O clima é mediterrânico com forte moderação oceânica e temperaturas amenas durante todo o ano salvo em
      situações de vento de levante. O promontório de Sagres ostenta a menor amplitude térmica anual de
      Portugal continental. A pluviosidade aumenta para norte e para o interior, decorrendo o período chuvoso
      entre novembro e abril. O mar revela grande produtividade biológica graças ao fenómeno de ressurgência
      (upwelling), com temperaturas de água de 14-15 graus em fevereiro e 20-21 em setembro.
    wildlife: >-
      A vegetação conjuga elementos mediterrânicos, norte-atlânticos e africanos, com clara hegemonia dos
      primeiros. Conhecem-se cerca de 750 espécies botânicas, mais de 100 das quais endémicas, raras ou com
      área restrita, e 12 exclusivas deste território. Entre os endemismos figuram Biscutella vicentina,
      Scilla vicentina, Centaurea vicentina, Diplotaxis vicentina, Hyacinthoides vicentina, Cistus palhinhae e
      Plantago almogravensis. No estrato arbóreo predominam os carvalhos: sobreiro e cerquinho, sobretudo nos
      barrancos.


      A fauna tem no espaço aéreo o seu principal palco. O parque constitui um corredor de passagem vital para
      aves planadoras e migradores passeriformes entre as áreas de invernada africanas e os locais de
      nidificação europeus. Entre as aves presentes contam-se a
      [águia-pesqueira](/especie/pandion_haliaetus/), o corvo-marinho-de-crista, a
      [cegonha-branca](/especie/ciconia_ciconia/), a [garça-branca-pequena](/especie/egretta_garzetta/), o
      [falcão-peregrino](/especie/falco_peregrinus/), o [peneireiro-das-torres](/especie/falco_naumanni/) e a
      [gralha-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/). Nas áreas abertas ocorrem o
      [tartaranhão-caçador](/especie/circus_pygargus/), o [tartaranhão-azulado](/especie/circus_cyaneus/), o
      [alcaravão](/especie/burhinus_oedicnemus/) e o [sisão](/especie/tetrax_tetrax/).


      Entre os mamíferos encontram-se a [lontra-europeia](/especie/lutra_lutra/), a fuinha, o texugo, a
      raposa, o [gato-bravo](/especie/felis_silvestris/), o saca-rabos e o [javali](/especie/sus_scrofa/); os
      texugos escavam regularmente as suas tocas em plenas escarpas marítimas. Grutas como a do Monte Clérigo
      e a gruta Amarela acolhem colónias de morcegos. Vários anfíbios reproduzem-se nos charcos temporários e
      as linhas de água abrigam peixes fluviais endémicos portugueses como o barbo-do-sul e a boga-portuguesa.


      As épocas ideais para a observação vão de abril a junho e de setembro a novembro.
    visit: >-
      A rede de percursos da Rota Vicentina percorre toda a orla costeira e o interior rural. Divide-se em
      dois grandes itinerários e circuitos circulares de um dia.


      O Trilho dos Pescadores desenvolve-se junto ao mar pelos caminhos outrora calcorreados pelos pescadores
      para aceder aos pesqueiros. Sendo um trilho pedonal estrito entre arribas e com muita areia, perfaz mais
      de 200 quilómetros no parque em 13 etapas de um dia praticáveis em ambos os sentidos de setembro a
      junho. O Caminho Histórico é uma grande rota (GR) por caminhos rurais através de montados, colinas e
      vales fluviais, em 13 etapas diárias de no máximo 25 quilómetros, excetuando a ligação Sabóia–Odemira
      com 33.


      Os percursos circulares reúnem vinte e quatro trilhos que totalizam 263 quilómetros. São caminhadas de
      meio dia, com dezasseis quilómetros no máximo, viáveis de setembro a junho. A regulamentação autoriza o
      turismo de natureza em caminhos balizados e expedições fotográficas.
    history: >-
      Ao longo dos séculos a população subsistiu da pesca costeira, agricultura tradicional e pastorícia,
      tendo o turismo ganho relevância progressiva. Sagres e o cabo de São Vicente acolhem monumentos
      nacionais e sítios de interesse público. O elevado valor ecológico motivou a classificação de uma Zona
      de Proteção Especial com 74.415 hectares, incluindo 17.462 marinhos.


      As estufas agrícolas e relvados na orla costeira e as plantações florestais de eucalipto no interior
      configuram os principais fatores de pressão.
    before: >-
      As arribas sofrem erosão permanente e caminhar nas bordas envolve perigo evidente de queda; o trail
      running não se afigura compatível com o estatuto de conservação. Os trilhos cruzam terrenos públicos e
      privados: caminha-se sob responsabilidade própria e apenas a pé. Preveja entre dois e cinco dias.
    around: >-
      O atlas não contempla áreas contíguas a este parque, mas partilha a cegonha-branca e a lontra com a
      [Reserva da Biosfera do Spreewald](/lugar/biospharenreservat-spreewald/).
