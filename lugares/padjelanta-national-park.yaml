resumen:
  es: >-
    El Parque Nacional más grande de Suecia (198.000 ha), inmensos lagos alpinos Vastenjaure y Virihaure y
    praderas de pastoreo ancestral sami.
  en: >-
    Sweden's largest national park (198,000 ha), featuring vast alpine lakes Vastenjaure and Virihaure and
    ancestral Sami grazing lands.
  fr: >-
    Le plus grand parc national de Suède (198 000 ha), d'immenses lacs alpins Vastenjaure et Virihaure et des
    pâturages ancestraux samis.
  de: >-
    Schwedens größter Nationalpark (198.000 ha), weite Alpenseen Vastenjaure und Virihaure und traditionelle
    Weidegründe der Samen.
  it: >-
    Il più grande parco nazionale della Svezia (198.000 ha), immensi laghi alpini Vastenjaure e Virihaure e
    pascoli ancestrali sami.
  pt: >-
    O maior parque nacional da Suécia (198.000 ha), imensos lagos alpinos Vastenjaure e Virihaure e pastagens
    ancestrais sami.
unico:
  es: >-
    Su meseta caliza guarda un récord de plantas inferiores de la montaña sueca y el punto de Suecia más
    lejano de la civilización.
  en: >-
    Its limestone plateau holds a record for lower plants of the Swedish mountains and Sweden's most remote
    point from civilization.
  fr: >-
    Son plateau calcaire détient un record de plantes inférieures de la montagne suédoise et le point le plus
    reculé de la civilisation en Suède.
  de: >-
    Sein Kalkplateau birgt einen Rekord an niederen Pflanzen der schwedischen Bergwelt und Schwedens
    entlegensten Punkt fernab jeder Zivilisation.
  it: >-
    Il suo altopiano calcareo custodisce un primato di piante inferiori della montagna svedese e il punto
    della Svezia più remoto dalla civiltà.
  pt: >-
    O seu planalto calcário detém o recorde de plantas inferiores da montanha sueca e o ponto da Suécia mais
    afastado da civilização.
observaciones:
  es: >-
    Está totalmente prohibido entrar con perro en verano y otoño. Hay letrinas secas en los campamentos de
    cabañas a lo largo de la ruta, y el agua de arroyos y ríos suele ser limpia para beber. El Padjelantaleden
    es una ruta de verano: no hay marcas visibles cuando la nieve cubre el terreno.
texto:
  es:
    intro: >-
      Padjelanta significa «la tierra alta», y el nombre lo dice todo. En lugar de picos que se clavan en el
      cielo, aquí hay una vasta meseta de colinas suaves alrededor de dos lagos inusualmente grandes, el
      Vastenjávrre y el Virihávrre, casi todo por encima del límite del arbolado. Es el parque nacional más
      extenso de Suecia y forma parte del sitio Patrimonio Mundial de Laponia.


      Es también un lugar para llegar con tiempo: está en tierra sin carreteras, en las montañas de Jokkmokk,
      y lo cruza el Padjelantaleden, una ruta de verano de unos 160 kilómetros que va de Kvikkjokk a Ritsem.
    landscape: >-
      El paisaje es abierto y casi llano, de colinas suaves y pocas cumbres altas, a diferencia del alpino
      [Sarek](/lugar/sarek-national-park/), que limita por el este. Casi todo el parque queda por encima del
      límite del arbolado: el abedul de montaña forma solo un pequeño bosque de 1.400 hectáreas en el rincón
      noreste. Lo demás es brezal, humedal, tundra y lagos.


      La flora es el gran motivo de visita. El lecho calizo, las lluvias altas y la nieve que tarda en
      fundirse crean una vegetación poco habitual en otros lugares de la montaña sueca, y la flora especial
      fue lo que llevó a declarar el parque en 1962. Se han catalogado más de 400 especies de plantas
      inferiores, un récord en las montañas suecas, y raggfingerört y grusnarv no crecen en ningún otro lugar
      de Suecia. Un estudio de 2023 halló diez líquenes nuevos para el país y 98 nuevos para la región de Lule
      lappmark.
    wildlife: >-
      Los mamíferos son pocos y casi todos con poblaciones pequeñas: sobre todo lemmings y
      [renos](/especie/rangifer_tarandus/), y los depredadores que viven de ellos, el
      [glotón](/especie/gulo_gulo/) y el [zorro ártico](/especie/vulpes_lagopus/), residentes permanentes. En
      los años de abundancia de lemmings se puede ver incluso el [búho nival](/especie/bubo_scandiacus/), raro
      en Padjelanta.


      Las aves son otra historia: la avifauna es muy rica. En los brezales lo típico son el chorlito dorado,
      la bisbita común y la collalba gris, y también el lagópodo alpino, el chorlito carambolo y el zarapito
      trinador. En los lagos abundan patos como el havelda y la cerceta común, y limícolas como el falaropo
      picofino, el combatiente y el andarríos bastardo. Repartidos por el parque hay gerifalte, [águila
      real](/especie/aquila_chrysaetos/), pigargo, ratonero calzado y págalo rabilargo.


      El calendario lo marcan las flores y los renos. La floración alrededor del lago Virihávrre es una de las
      más ricas de la montaña sueca. Las vacas de reno paren en las llanuras alrededor de los lagos a finales
      de mayo, y durante las tres primeras semanas de julio es temporada alta del trabajo con los renos: es
      mejor evitar el sendero en la medida de lo posible. El reno pasta aquí en verano; la mejor época para
      recorrer la ruta es de julio a septiembre.
    visit: >-
      Hay tres maneras de entrar. Desde el sur, Kvikkjokk es el mejor punto de entrada: está a unos 120 km de
      Jokkmokk. Desde el norte, en Ritsem se cruza el lago Áhkkájávrre en barco y al otro lado hay media
      jornada de caminata hasta el parque. Y para empezar en el centro, helicópteros regulares enlazan
      Kvikkjokk y Ritsem con Stáloluokta.


      El Padjelantaleden es una ruta de verano con puentes y pasarelas, con refugios cada 10 a 20 kilómetros.
      Sus etapas miden entre seis y 23 kilómetros. Cerca de Stáloluokta, la excursión de un día a la montaña
      Unna Dijdder pasa junto a la kyrkkåta y sube entre anémonas de montaña y orquídeas, y desde las cumbres
      se ven las montañas noruegas al oeste, Sulidälbmá al sur y Sarek al este. Jiegŋáffo, la montaña más alta
      del parque, es famosa entre los botánicos por sus flores y atrae a los renos en días cálidos por sus
      neveros y su glaciar.


      Entre Gisuris y Låddejåhkå hay dos senderos: el nuevo, junto al Vuojatädno, y el antiguo, que cruza la
      montaña Njierek con vistas a los grandes lagos y a las cumbres de Sarek. Desde Stáloluokta también se
      puede seguir el Nordkalottleden hacia el sur hasta Stáddajåhkå y subir por suaves terrazas a
      Stáddátjåhkkå entre anémonas de montaña.
    history: >-
      El lugar está habitado desde la Edad de Piedra, como muestran las numerosas fosas de trampeo, y varios
      paneles de arte rupestre atestiguan una larga presencia sami. Por todas partes quedan huellas de la vida
      humana: emplazamientos de cabañas, hogares y fosas de trampeo.


      Hoy tres comunidades sami, Duorbun, Jåhkågasska y Sirges, dejan pastar sus renos aquí en verano, desde
      los asentamientos tradicionales de Stáloluokta, Árasluokta y Sállohávrre. Muchos prados de hierba fueron
      antiguos corrales de ordeño de renos de los sami, y su vegetación es hoy muy rica en especies. En el
      valle de Tarra está Basseuksa, la «puerta sagrada», uno de los lugares sagrados sami más conocidos de
      Suecia; por respeto no hace falta acercarse del todo.
    before: >-
      Está totalmente prohibido entrar con perro en verano y otoño. Hay letrinas secas en los campamentos de
      cabañas a lo largo de la ruta, y el agua de arroyos y ríos suele ser limpia para beber. El
      Padjelantaleden es una ruta de verano: no hay marcas visibles cuando la nieve cubre el terreno.
    around: >-
      Tres parques nacionales rodean Padjelanta a un kilómetro: [Rago](/lugar/rago-national-park/),
      [Sarek](/lugar/sarek-national-park/) y [Stora Sjöfallet](/lugar/stora-sjofallet-national-park/). Algo
      más allá queda [Junkerdal](/lugar/junkerdal-national-park/). Entre los lugares lejanos,
      [Helagsfjället](/lugar/helagsfjallet-nature-reserve/),
      [Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) y
      [Hardangervidda](/lugar/hardangervidda-national-park/) comparten con Padjelanta el zorro ártico, el
      reno, la alta montaña y las praderas de montaña, y
      [Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) comparte el zorro ártico, el reno y la
      alta montaña.
  en:
    intro: >-
      Padjelanta translates to "the higher land", and the name says it all. Instead of sharp peaks piercing
      the sky, you find a vast rolling plateau of gentle hills surrounding two unusually large lakes,
      Vastenjávrre and Virihávrre, nearly all lying above the treeline. It is Sweden's largest national park
      and forms part of the Laponian Area World Heritage site.


      It is also a destination demanding ample time: located in roadless wilderness in the mountains of
      Jokkmokk, it is traversed by the Padjelantaleden, a summer trail of some 160 kilometres running between
      Kvikkjokk and Ritsem.
    landscape: >-
      The landscape is open and gently undulating, characterized by soft hills and few high summits, in
      contrast to alpine [Sarek](/lugar/sarek-national-park/) bordering it to the east. Almost the entire park
      lies above the tree limit: mountain birch forms only a modest forest of 1,400 hectares in the
      northeastern corner. All else is heathland, wetland, tundra, and lakes.


      The flora is the supreme attraction. The limestone substrate, abundant precipitation, and late-melting
      snow foster vegetation rare elsewhere in the Swedish fells, and this exceptional botanical wealth
      prompted the park's designation in 1962. More than 400 species of lower plants have been catalogued—a
      record in the Swedish mountains—while Potentilla robbinsiana and Arenaria humifusa grow nowhere else in
      Sweden. A 2023 survey recorded ten lichens new to the country and 98 new to the Lule lappmark region.
    wildlife: >-
      Mammals are scarce and mostly maintain modest populations: primarily lemmings and
      [caribou](/especie/rangifer_tarandus/), along with the predators sustained by them—the
      [wolverine](/especie/gulo_gulo/) and the [Arctic fox](/especie/vulpes_lagopus/), both permanent
      residents. During lemming peak years, one might even sight the [snowy owl](/especie/bubo_scandiacus/),
      an uncommon visitor to Padjelanta.


      Birdlife tells a vastly different story: the avifauna is exceptionally diverse. Across the moorlands,
      European golden plovers, meadow pipits, and northern wheatears are hallmarks, accompanied by rock
      ptarmigans, Eurasian dotterels, and whimbrels. Lakes host teeming waterfowl such as long-tailed ducks
      and common teals, beside waders like red-necked phalaropes, ruffs, and wood sandpipers. Scattered
      throughout the expanse hunt gyrfalcons, [golden eagles](/especie/aquila_chrysaetos/), white-tailed
      eagles, rough-legged buzzards, and long-tailed jaegers.


      The seasonal rhythm is governed by flowers and reindeer. The floral bloom encircling Lake Virihávrre is
      among the most lavish in the Scandinavian mountains. Reindeer cows calve across the plains flanking the
      lakes in late May, and the first three weeks of July mark the peak period of reindeer herding: hikers
      are best advised to avoid the route when possible. Reindeer graze here throughout the summer; the ideal
      period to trek the route is from July to September.
    visit: >-
      Three primary access points exist. From the south, Kvikkjokk serves as the finest trailhead, located
      roughly 120 km from Jokkmokk. From the north, you take a boat across Lake Áhkkájávrre from Ritsem,
      followed by a half-day trek to the park boundary. To commence in the interior, regular helicopter
      flights connect both Kvikkjokk and Ritsem with Stáloluokta.


      The Padjelantaleden is a summer path equipped with bridges and boardwalks, offering wilderness cabins
      every 10 to 20 kilometres. Daily stages span between six and 23 kilometres. Near Stáloluokta, a
      rewarding day hike ascends Unna Dijdder past the kyrkkåta chapel, winding through mountain avens and
      wild orchids to summits revealing Norwegian massifs to the west, Sulidälbmá to the south, and Sarek to
      the east. Jiegŋáffo, the park's highest summit, is famed among botanists for rare blooms and attracts
      reindeer on warmer days to its snowfields and glacier.


      Between Gisuris and Låddejåhkå two trails diverge: the newer route following the Vuojatädno, and the
      older route traversing Mount Njierek with commanding panoramas over the great lakes and Sarek's jagged
      peaks. From Stáloluokta, you can also follow the Nordkalottleden southward to Stáddajåhkå and mount
      gentle terraces up to Stáddátjåhkkå amid expanses of mountain avens.
    history: >-
      The area has witnessed habitation since the Stone Age, as attested by numerous hunting pit systems,
      while various petroglyph panels document an enduring Sami heritage. Everywhere across the terrain linger
      remnants of past life: hearths, turf hut foundations, and pit traps.


      Today, three Sami reindeer-herding communities—Duorbun, Jåhkågasska, and Sirges—graze their herds here
      in summertime, based at traditional summer settlements in Stáloluokta, Árasluokta, and Sállohávrre. Many
      verdant meadows were historic reindeer milking enclosures, hosting plant communities extraordinarily
      rich in species. In the Tarra valley lies Basseuksa, the "sacred gateway", one of Sweden's most revered
      Sami sacred sites; out of cultural respect, visitors should refrain from approaching too closely.
    before: >-
      Bringing dogs is strictly prohibited during summer and autumn. Dry composting toilets are provided at
      cabin sites along the trail, and river and stream water is generally clean and potable. The
      Padjelantaleden is strictly a summer trail: no markers remain discernible once winter snow blankets the
      terrain.
    around: >-
      Three national parks border Padjelanta within a single kilometre: [Rago](/lugar/rago-national-park/),
      [Sarek](/lugar/sarek-national-park/), and [Stora Sjöfallet](/lugar/stora-sjofallet-national-park/).
      Slightly further lies [Junkerdal](/lugar/junkerdal-national-park/). Among more distant sanctuaries,
      [Helagsfjället](/lugar/helagsfjallet-nature-reserve/),
      [Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/), and
      [Hardangervidda](/lugar/hardangervidda-national-park/) share the Arctic fox, reindeer, alpine fell
      habitat, and mountain tundra with Padjelanta, while
      [Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) similarly shares the Arctic fox,
      reindeer, and alpine terrain.
  fr:
    intro: >-
      Padjelanta signifie « la terre d'en haut », et ce nom résume tout. Loin des crêtes acérées déchirant le
      ciel, on trouve ici un immense plateau de collines ondulées entourant deux lacs exceptionnellement
      vastes, le Vastenjávrre et le Virihávrre, presque entièrement situés au-dessus de la limite des arbres.
      C'est le plus vaste parc national de Suède et une composante du bien du patrimoine mondial de la région
      de Laponie.


      C'est aussi un lieu où il faut savoir prendre son temps : situé dans une contrée sans routes au cœur des
      montagnes de Jokkmokk, il est traversé par le Padjelantaleden, un itinéraire estival d'environ 160
      kilomètres reliant Kvikkjokk à Ritsem.
    landscape: >-
      Le paysage est dégagé et presque plat, fait de collines douces et de rares hauts sommets, tranchant avec
      le relief alpin du [Sarek](/lugar/sarek-national-park/) qui le borde à l'est. La quasi-totalité du parc
      s'étend au-dessus de la limite forestière : le bouleau pubescent ne forme qu'un modeste boisement de 1
      400 hectares dans l'angle nord-est. Tout le reste se compose de landes, de tourbières, de toundra et de
      plans d'eau.


      La flore constitue l'attrait majeur. Le substrat calcaire, les précipitations abondantes et la fonte
      tardive des neiges engendrent une flore singulière dans les montagnes suédoises, et cette richesse
      botanique exceptionnelle a justifié la création du parc en 1962. Plus de 400 espèces de plantes
      inférieures y ont été répertoriées, un record pour les montagnes suédoises, tandis que Potentilla
      robbinsiana et Arenaria humifusa ne croissent nulle part ailleurs en Suède. Une étude menée en 2023 a
      mis en évidence dix lichens inédits pour le pays et 98 nouveaux pour la contrée de Lule lappmark.
    wildlife: >-
      Les mammifères sont discrets et leurs populations généralement réduites : principalement des lemmings et
      des [rennes](/especie/rangifer_tarandus/), ainsi que les prédateurs qui s'en nourrissent, le
      [glouton](/especie/gulo_gulo/) et le [renard polaire](/especie/vulpes_lagopus/), résidents permanents.
      Lors des années d'abondance de rongeurs, on peut même observer le [harfang des
      neiges](/especie/bubo_scandiacus/), hôte rare de Padjelanta.


      L'avifaune offre un spectacle tout autre par sa grande richesse. Sur les landes, le pluvier doré, le
      pipit farlouse et le traquet motteux sont typiques, accompagnés du lagopède alpin, du pluvier guignard
      et du courlis corlieu. Les lacs attirent de nombreux canards tels que l'harelde boréale et la sarcelle
      d'hiver, ainsi que des limicoles comme le phalarope à bec étroit, le combattant varié et le chevalier
      bécassine. Çà et là chassent le faucon gerfaut, l'[aigle royal](/especie/aquila_chrysaetos/), le
      pygargue à queue blanche, la buse pattue et le labbe à longue queue.


      Le rythme naturel s'accorde aux floraisons et aux rennes. La floraison qui entoure le lac Virihávrre
      figure parmi les plus éclatantes de Scandinavie. Les biches de rennes mettent bas sur les plaines
      ceinturant les lacs à la fin mai, et les trois premières semaines de juillet correspondent au pic du
      rassemblement pastoral des troupeaux : il convient d'éviter alors le chemin autant que possible. Le
      renne pâture ici tout l'été ; la période idéale pour parcourir le sentier va de juillet à septembre.
    visit: >-
      Trois voies d'accès s'offrent à vous. Au sud, Kvikkjokk constitue le point d'entrée privilégié, situé à
      environ 120 km de Jokkmokk. Au nord, depuis Ritsem, on traverse le lac Áhkkájávrre en bateau avant
      d'entamer une demi-journée de marche jusqu'au parc. Pour un départ central, des liaisons régulières en
      hélicoptère relient Kvikkjokk et Ritsem à Stáloluokta.


      Le Padjelantaleden est un chemin d'été aménagé de ponts et de passerelles, ponctué de refuges distants
      de 10 à 20 kilomètres. Ses étapes quotidiennes s'échelonnent entre six et 23 kilomètres. Près de
      Stáloluokta, l'excursion d'une journée au mont Unna Dijdder passe devant la kyrkkåta et s'élève parmi
      les dryades et les orchidées, découvrant depuis les crêtes les massifs norvégiens à l'ouest, le
      Sulidälbmá au sud et le Sarek à l'est. Jiegŋáffo, point culminant du parc, est réputé des botanistes
      pour sa flore et attire les rennes par temps chaud sur ses névés et son glacier.


      Entre Gisuris et Låddejåhkå serpentent deux sentiers : le plus récent longeant le Vuojatädno, et
      l'ancien qui franchit la montagne Njierek avec vue sur les grands lacs et les aiguilles du Sarek. Depuis
      Stáloluokta, vous pouvez également suivre le Nordkalottleden vers le sud jusqu'à Stáddajåhkå et gravir
      de douces terrasses vers le Stáddátjåhkkå au milieu des parterres de dryades.
    history: >-
      Les lieux sont fréquentés depuis l'âge de la pierre, comme en témoignent d'anciennes fosses de piégeage,
      et plusieurs parois peintes attestent d'une longue présence samie. Les traces humaines affleurent
      partout : vestiges de cabanes en tourbe, foyers et fosses à rennes.


      Aujourd'hui, trois communautés samies — Duorbun, Jåhkågasska et Sirges — font estiver leurs rennes sur
      ce plateau depuis leurs campements traditionnels de Stáloluokta, Árasluokta et Sállohávrre. Nombre de
      pelouses herbeuses correspondent d'ailleurs à d'anciens enclos de traite des rennes samis, présentant
      désormais une flore d'une grande diversité d'espèces. Dans la vallée de Tarra se dresse Basseuksa, la «
      porte sacrée », l'un des hauts lieux cultuels samis de Suède ; par respect, il convient de ne pas s'en
      approcher de trop près.
    before: >-
      La présence de chiens est rigoureusement interdite en été et en automne. Des latrines sèches équipent
      les campements de cabanes le long de l'itinéraire, et l'eau des rivières et ruisseaux est généralement
      propre à la consommation. Le Padjelantaleden est un parcours purement estival : aucun balisage n'est
      décelable dès que la neige recouvre le terrain.
    around: >-
      Trois parcs nationaux ceinturent Padjelanta à un kilomètre de distance :
      [Rago](/lugar/rago-national-park/), [Sarek](/lugar/sarek-national-park/) et [Stora
      Sjöfallet](/lugar/stora-sjofallet-national-park/). Plus loin s'étend
      [Junkerdal](/lugar/junkerdal-national-park/). Parmi les espaces plus distants,
      [Helagsfjället](/lugar/helagsfjallet-nature-reserve/),
      [Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) et
      [Hardangervidda](/lugar/hardangervidda-national-park/) partagent avec Padjelanta le renard polaire, le
      renne, les paysages alpins et les pelouses boréales, tandis que
      [Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) partage le renard polaire, le renne et
      la haute montagne.
  de:
    intro: >-
      Padjelanta bedeutet „das höhere Land“, und dieser Name ist Programm. Statt schroffer Felszacken, die in
      den Himmel stechen, erstreckt sich hier eine weite Hochebene sanfter Hügelkuppen rund um zwei
      ungewöhnlich große Seen, den Vastenjávrre und den Virihávrre, fast vollständig oberhalb der Baumgrenze
      gelegen. Es ist Schwedens größter Nationalpark und Teil des UNESCO-Welterbegebiets Laponia.


      Es ist zugleich ein Ziel, für das man Zeit mitbringen muss: In straßenloser Wildnis in den Bergen von
      Jokkmokk gelegen, quert ihn der Padjelantaleden, eine sommerliche Wanderroute von rund 160 Kilometern
      zwischen Kvikkjokk und Ritsem.
    landscape: >-
      Die Landschaft präsentiert sich weit und sanft gewellt, geprägt von runden Hügeln und wenigen hohen
      Gipfeln – im deutlichen Gegensatz zum alpinen [Sarek](/lugar/sarek-national-park/), der östlich
      anschließt. Nahezu der gesamte Park liegt oberhalb der Waldgrenze: Die Fjällbirke bildet lediglich ein
      bescheidenes Gehölz von 1.400 Hektar in der Nordostecke. Alles Übrige ist Zwergstrauchheide, Moor,
      Tundra und See.


      Die Pflanzenwelt ist der herausragende Besuchsgrund. Der kalkhaltige Untergrund, ergiebige Niederschläge
      und lange liegender Schnee schaffen eine Vegetation, wie man sie andernorts im schwedischen Gebirge kaum
      findet, was 1962 den Ausschlag zur Parkgründung gab. Über 400 Arten niederer Pflanzen wurden
      katalogisiert – ein Spitzenwert im schwedischen Gebirgsraum –, während Potentilla robbinsiana und
      Arenaria humifusa nirgendwo sonst in Schweden wachsen. Eine Untersuchung aus dem Jahr 2023 erbrachte den
      Nachweis von zehn für das Land neuen Flechten sowie 98 Neufunden für das Gebiet Lule lappmark.
    wildlife: >-
      Säugetiere treten spärlich und zumeist in kleinen Beständen auf: vor allem Lemminge und
      [Ren](/especie/rangifer_tarandus/) sowie die Beutegreifer, die von ihnen leben –
      [Vielfraß](/especie/gulo_gulo/) und [Polarfuchs](/especie/vulpes_lagopus/), beide ständige Bewohner. In
      Lemmingjahren lässt sich bisweilen sogar die [Schnee-Eule](/especie/bubo_scandiacus/) erblicken, ein
      seltener Gast in Padjelanta.


      Die Vogelwelt ist dagegen überaus artenreich. Auf den Heiden dominieren Goldregenpfeifer, Wiesenpieper
      und Steinschmätzer, gesellt von Alpenschneehuhn, Mornellregenpfeifer und Regenbrachvogel. Die Seen
      beleben Enten wie Eisente und Krickente sowie Watvögel, darunter Odinshühnchen, Kampfläufer und
      Bruchwasserläufer. Über der Weite kreisen Jagdfalke, [Steinadler](/especie/aquila_chrysaetos/),
      Seeadler, Raufußbussard und Schmarotzerraubmöwe.


      Den Kalender bestimmen Blütezeiten und Rentiere. Der Blütenflor rund um den See Virihávrre zählt zu den
      prächtigsten der skandinavischen Gebirge. Die Rentierkühe kalben Ende Mai in den Weiten um die Seen, und
      die ersten drei Juliwochen markieren die Hochphase der Rentierwirtschaft: Wanderer meiden den Weg dann
      am besten weitgehend. Rentiere weiden hier über den gesamten Sommer; die beste Zeit für die Wanderroute
      ist von Juli bis September.
    visit: >-
      Es bestehen drei Zugänge. Im Süden bildet Kvikkjokk das beste Einfallstor, gelegen rund 120 km von
      Jokkmokk entfernt. Von Norden her setzt man in Ritsem mit dem Boot über den See Áhkkájávrre und wandert
      danach einen halben Tag bis zum Nationalpark. Für den Start in der Parkmitte verbinden
      Linienhubschrauber Kvikkjokk und Ritsem mit Stáloluokta.


      Der Padjelantaleden ist ein sommerlicher Wanderweg mit Brücken und Holzstegen, bestückt mit Schutzhütten
      im Abstand von 10 bis 20 Kilometern. Seine Etappen messen zwischen sechs und 23 Kilometern. Nahe
      Stáloluokta führt die Tagestour auf den Unna Dijdder an der kyrkkåta vorbei und steigt zwischen
      Silberwurz und Orchideen empor; vom Gipfel blickt man westwärts auf norwegische Berge, südwärts zum
      Sulidälbmá und ostwärts zum Sarek. Der Jiegŋáffo, höchster Berg des Parks, ist unter Botanikern berühmt
      für seine Blütenpracht und lockt an warmen Tagen Rentiere auf Schneefelder und Gletscher.


      Zwischen Gisuris und Låddejåhkå verlaufen zwei Pfade: die neuere Trasse entlang des Vuojatädno und der
      historische Weg über den Berg Njierek mit Ausblick auf die Großseen und Sareks Zinnen. Von Stáloluokta
      aus kannst du zudem dem Nordkalottleden nach Süden zum Stáddajåhkå folgen und über sanfte Terrassen zum
      Stáddátjåhkkå inmitten weißer Silberwurzfluren aufsteigen.
    history: >-
      Die Gegend ist seit der Steinzeit besiedelt, worauf etliche Fanggruben hinweisen, und Felsmalereien
      zeugen von jahrtausendelanger Präsenz der Samen. Überall finden sich Spuren vergangenen Lebens: Reste
      von Torfhütten, Herdstellen und Jagdgruben.


      Heute lassen drei Samen-Gemeinschaften – Duorbun, Jåhkågasska und Sirges – ihre Rentiere hier im Sommer
      weiden, ausgehend von traditionellen Sommersiedlungen in Stáloluokta, Árasluokta und Sállohávrre. Viele
      saftige Grasmatten waren einstige Melkstellen für die Rentiere der Samen und bergen heute eine besonders
      artenreiche Flora. Im Tarra-Tal liegt Basseuksa, das „Heilige Tor“, eine der bekanntesten samischen
      Kultstätten Schwedens; aus Respekt sollte man ihr nicht zu nahe treten.
    before: >-
      Die Mitnahme von Hunden ist im Sommer und Herbst strikt verboten. An den Hüttenplätzen entlang der Route
      stehen Trockentoiletten bereit, und das Wasser aus Bächen und Flüssen ist in aller Regel bedenkenlos
      trinkbar. Der Padjelantaleden ist ein reiner Sommerweg: Sobald Schnee das Land bedeckt, sind keine
      Wegmarkierungen mehr erkennbar.
    around: >-
      Drei Nationalparks umschließen Padjelanta in einem Kilometer Entfernung:
      [Rago](/lugar/rago-national-park/), [Sarek](/lugar/sarek-national-park/) und [Stora
      Sjöfallet](/lugar/stora-sjofallet-national-park/). Etwas weiter entfernt liegt
      [Junkerdal](/lugar/junkerdal-national-park/). Unter den weiter abgelegenen Schutzgebieten teilen
      [Helagsfjället](/lugar/helagsfjallet-nature-reserve/),
      [Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) und
      [Hardangervidda](/lugar/hardangervidda-national-park/) mit Padjelanta den Polarfuchs, das Ren, alpine
      Weiten und Hochlandtundren, während [Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/)
      Polarfuchs, Ren und Fjellcharakter teilt.
  it:
    intro: >-
      Padjelanta significa «la terra alta», e il toponimo esprime tutto. Al posto di guglie acuminate protese
      verso il cielo, si apre qui un vasto altopiano di colline sinuose attorno a due specchi d'acqua
      insolitamente ampi, il Vastenjávrre e il Virihávrre, quasi interamente situati al di sopra del limite
      della vegetazione arborea. È il parco nazionale più vasto della Svezia ed è parte integrante del sito
      Patrimonio Mondiale dell'Area lappone.


      È inoltre una meta che richiede tempo: immerso in una contrada priva di strade tra le montagne di
      Jokkmokk, è attraversato dal Padjelantaleden, un percorso escursionistico estivo di circa 160 chilometri
      che unisce Kvikkjokk a Ritsem.
    landscape: >-
      Il paesaggio è aperto e quasi pianeggiante, contraddistinto da rilievi morbidi e poche cime elevate, a
      differenza del profilo alpino di [Sarek](/lugar/sarek-national-park/) che lo cinge a oriente. Quasi
      l'intera superficie del parco si colloca oltre il limite degli alberi: la betulla tortuosa forma solo un
      boschetto di 1.400 ettari nell'angolo nord-orientale. Tutto il resto è composto da brughiere, zone
      umide, tundra e laghi.


      La flora costituisce la principale attrattiva. Il basamento calcareo, le precipitazioni abbondanti e la
      neve a scioglimento tardivo favoriscono un manto vegetale insolito nel panorama alpino svedese, e fu
      proprio questa rara ricchezza botanica a motivare l'istituzione del parco nel 1962. Sono state censite
      oltre 400 specie di piante inferiori, un primato per le montagne svedesi, mentre Potentilla robbinsiana
      e Arenaria humifusa non allignano in nessun altro luogo della Svezia. Un'indagine del 2023 ha
      riscontrato dieci licheni mai descritti nel paese e 98 nuovi per la regione del Lule lappmark.
    wildlife: >-
      I mammiferi sono scarsi e compaiono con popolazioni contenute: principalmente lemming e [renna /
      caribù](/especie/rangifer_tarandus/), affiancati dai predatori che se ne nutrono, il
      [ghiottone](/especie/gulo_gulo/) e la [volpe artica](/especie/vulpes_lagopus/), entrambi residenti
      stabili. Nelle annate di proliferazione dei lemming è persino possibile scorgere il [gufo delle
      nevi](/especie/bubo_scandiacus/), visitatore inconsueto a Padjelanta.


      L'avifauna riserva tutt'altra vivacità, rivelandosi oltremodo variegata. Nelle brughiere spiccano il
      piviere dorato, la pispola e il culbianco, insieme a pernice bianca, piviere tortolino e chiurlo
      piccolo. Sugli specchi lacustri abbondano anatidi quali moretta codona e alzavola, oltre a limicoli come
      il falaropo beccosottile, il combattente e il piro piro boschereccio. Sull'intero territorio volteggiano
      girifalco, [aquila reale](/especie/aquila_chrysaetos/), aquila di mare, poiana calzata e labbo
      codalunga.


      La cadenza delle stagioni è scandita dalle fioriture e dalle renne. I prati fioriti attorno al lago
      Virihávrre figurano tra i più sontuosi delle montagne svedesi. Le femmine di renna partoriscono sui
      pianori perilacustri a fine maggio, e le prime tre settimane di luglio rappresentano il momento
      culminante del lavoro con le mandrie: è consigliabile evitare il percorso per quanto possibile. Le renne
      pascolano qui per tutta la stagione estiva; il periodo ideale per affrontare il tracciato va da luglio a
      settembre.
    visit: >-
      Esistono tre modalità d'accesso. Da sud, Kvikkjokk offre la via d'ingresso ottimale, situata a circa 120
      km da Jokkmokk. Da nord, partendo da Ritsem si traversa in battello il lago Áhkkájávrre, proseguendo con
      mezza giornata di marcia fino al confine del parco. Per cominciare direttamente dal settore centrale,
      elicotteri di linea collegano regolarmente sia Kvikkjokk sia Ritsem con Stáloluokta.


      Il Padjelantaleden è un sentiero estivo munito di ponti e passerelle in legno, con rifugi dislocati ogni
      10 - 20 chilometri. Le tappe giornaliere spaziano tra sei e 23 chilometri. Nei pressi di Stáloluokta,
      l'escursione in giornata al monte Unna Dijdder costeggia la kyrkkåta e risale tra camedri alpini e
      orchidee selvatiche; dalla cima la vista spazia sulle montagne norvegesi a ovest, sul Sulidälbmá a sud e
      su Sarek a est. Il Jiegŋáffo, la vetta più alta del parco, è celebre tra gli studiosi per le sue
      fioriture e richiama le renne nelle giornate afose grazie ai suoi nevai e al ghiacciaio.


      Tra Gisuris e Låddejåhkå si snodano due percorsi: la variante nuova, lungo il Vuojatädno, e il vecchio
      tracciato che scavalca il monte Njierek offrendo scorci sui grandi laghi e sulle vette di Sarek. Da
      Stáloluokta puoi inoltre intraprendere il Nordkalottleden verso sud fino a Stáddajåhkå e salire lungo
      morbidi terrazzamenti verso Stáddátjåhkkå tra distese di camedri alpini.
    history: >-
      Il territorio è frequentato fin dall'età della pietra, come testimoniano i molteplici sistemi di buche
      da caccia, e varie pareti incise attestano una radicata presenza sami. Ovunque affiorano tracce umane:
      basamenti di capanne in torba, focolari e fosse di cattura.


      Oggi tre comunità sami — Duorbun, Jåhkågasska e Sirges — lasciano pascolare qui le proprie renne in
      estate, appoggiandosi agli insediamenti tradizionali di Stáloluokta, Árasluokta e Sállohávrre. Molti
      pascoli erbosi nacquero come antichi recinti di mungitura sami e presentano tuttora una flora
      straordinariamente eterogenea. Nella valle del Tarra si trova Basseuksa, la «porta sacra», uno dei siti
      di culto sami più insigni di Svezia; per rispetto conviene non avvicinarsi del tutto.
    before: >-
      È severamente vietato introdurre cani in estate e in autunno. Sono presenti latrine a secco nei campi
      sosta lungo l'itinerario, e l'acqua di torrenti e fiumi risulta di norma limpida e potabile. Il
      Padjelantaleden è un tracciato rigorosamente estivo: nessuna segnaletica resta visibile non appena la
      coltre nevosa ammanta il suolo.
    around: >-
      Tre parchi nazionali contornano Padjelanta a un chilometro di raggio:
      [Rago](/lugar/rago-national-park/), [Sarek](/lugar/sarek-national-park/) e [Stora
      Sjöfallet](/lugar/stora-sjofallet-national-park/). Poco più distante si allunga
      [Junkerdal](/lugar/junkerdal-national-park/). Tra le riserve più remote,
      [Helagsfjället](/lugar/helagsfjallet-nature-reserve/),
      [Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) e
      [Hardangervidda](/lugar/hardangervidda-national-park/) condividono con Padjelanta la volpe artica, la
      renna, l'ambiente d'alta montagna e le brughiere d'altopiano, mentre
      [Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) condivide la volpe artica, la renna e i
      panorami di fell alpino.
  pt:
    intro: >-
      Padjelanta significa «a terra alta», e o nome resume tudo. Em vez de picos aguçados a rasgar o céu,
      encontra-se aqui um planalto imenso de colinas suaves em redor de dois lagos invulgarmente grandes, o
      Vastenjávrre e o Virihávrre, quase totalmente acima do limite altitudinal das árvores. É o maior parque
      nacional da Suécia e integra o sítio Património Mundial da Região da Lapónia.


      É igualmente um destino para descobrir sem pressa: encravado num território sem estradas nas montanhas
      de Jokkmokk, é percorrido pelo Padjelantaleden, um trilho estival com cerca de 160 quilómetros que liga
      Kvikkjokk a Ritsem.
    landscape: >-
      A paisagem é desimpedida e quase plana, composta por colinas suaves e escassos cumes alcantilados,
      contrastando com o perfil alpino de [Sarek](/lugar/sarek-national-park/), que delimita o flanco
      oriental. Quase toda a área do parque situa-se acima do limite das árvores: a bétula-das-montanhas forma
      unicamente uma pequena mancha de 1.400 hectares no vértice nordeste. Toda a restante extensão é urze,
      turfeira, tundra e lagos.


      A flora constitui o grande chamariz. O substrato calcário, a precipitação abundante e o degelo tardio
      proporcionam uma vegetação raramente observada noutros pontos da montanha sueca, tendo sido essa
      singular riqueza botânica a impulsionar a criação do parque em 1962. Estão catalogadas mais de 400
      espécies de plantas inferiores — um recorde nas serras suecas —, sendo que Potentilla robbinsiana e
      Arenaria humifusa não prosperam em mais nenhum local da Suécia. Um estudo de 2023 identificou dez
      líquenes inéditos para o país e 98 novas ocorrências para a região de Lule lappmark.
    wildlife: >-
      Os mamíferos são discretos e surgem em populações contidas: sobretudo lemingues e
      [renas](/especie/rangifer_tarandus/), bem como os predadores que deles se alimentam — o
      [glutão](/especie/gulo_gulo/) e a [raposa-do-ártico](/especie/vulpes_lagopus/), ambos residentes
      permanentes. Nos anos de explosão de lemingues, é inclusivamente viável avistar a
      [coruja-das-neves](/especie/bubo_scandiacus/), visitante rara em Padjelanta.


      Já a avifauna revela extraordinária riqueza. Pelas charnecas predominam a tarambola-dourada, a
      petinha-dos-prados e o chasco-cinzento, acompanhados pelo lagópode-escuro, pelo borrelho-ruivo e pelo
      maçarico-galego. Nos lagos concentram-se patos como o pato-rabilho e o marreco-comum, bem como limícolas
      incluindo o falaropo-de-bico-fino, o combatente e o maçarico-bastardo. Em patrulha por todo o espaço
      surgem o falcão-gerifalte, a [águia-real](/especie/aquila_chrysaetos/), a águia-rabalva, o bútio-calçado
      e o moleiro-de-cauda-comprida.


      O ciclo natural é orientado pelas florações e pelas renas. A vegetação florida ao redor do lago
      Virihávrre conta-se entre as mais exuberantes das montanhas escandinavas. As fêmeas de rena dão à luz
      nas planícies em torno dos lagos no final de maio, sendo as três primeiras semanas de julho o período
      álgido da pastorícia das renas: convém evitar o trilho tanto quanto possível nessa época. A rena pasta
      aqui durante o verão; a melhor temporada para fazer a rota decorre de julho a setembro.
    visit: >-
      Existem três vias de acesso. A sul, Kvikkjokk representa o melhor ponto de partida, distando cerca de
      120 km de Jokkmokk. A norte, em Ritsem, atravessa-se o lago Áhkkájávrre em barco, seguindo-se meio dia
      de marcha até ao parque. Para iniciar a marcha a meio do trajeto, helicópteros regulares unem Kvikkjokk
      e Ritsem a Stáloluokta.


      O Padjelantaleden é uma rota estival apetrechada com pontes e passadiços, oferecendo refúgios espaçados
      entre 10 e 20 quilómetros. As suas etapas diárias oscilam entre seis e 23 quilómetros. Junto a
      Stáloluokta, a excursão de um dia ao monte Unna Dijdder ladeia a kyrkkåta e ascende por entre
      dríades-brancas e orquídeas selvagens, descortinando nos topos as serranias norueguesas a poente, o
      Sulidälbmá a sul e Sarek a nascente. O Jiegŋáffo, a montanha mais imponente do parque, é reputado entre
      botânicos pelas suas flores e atrai renas em dias quentes para os seus campos de neve e glaciar.


      Entre Gisuris e Låddejåhkå desenham-se dois percursos: o mais moderno junto ao rio Vuojatädno e o
      traçado histórico que cruza a montanha Njierek com amplos horizontes sobre as lagoas e os pináculos de
      Sarek. A partir de Stáloluokta podes também tomar o Nordkalottleden rumo a sul até Stáddajåhkå e subir
      por socalcos suaves rumo a Stáddátjåhkkå por entre campos de dríades.
    history: >-
      A área regista povoamento desde a Idade da Pedra, atestado por abundantes fossas de armadilha, e vários
      painéis de arte rupestre documentam a ancestral presença sami. Por todo o relevo perduram vestígios
      humanos: alicerces de cabanas tradicionais, lareiras e covas de caça.


      Hoje, três comunidades sami — Duorbun, Jåhkågasska e Sirges — trazem as suas renas para pastar aqui no
      verão, a partir das aldeias sazonais de Stáloluokta, Árasluokta e Sállohávrre. Muitos prados verdejantes
      foram antigas cercas de ordenha de renas dos sami, ostentando hoje uma flora riquíssima em espécies. No
      vale de Tarra ergue-se Basseuksa, a «porta sagrada», um dos sítios sagrados sami mais insignes da
      Suécia; por deferência, não deves aproximar-te em demasia.
    before: >-
      A entrada de cães é terminantemente proibida no verão e no outono. Existem retretes secas nos
      acampamentos de cabanas ao longo da rota, e a água dos ribeiros e rios é geralmente límpida e potável. O
      Padjelantaleden é estritamente um percurso de verão: nenhuma marca permanece visível quando o manto de
      neve oculta o chão.
    around: >-
      Três parques nacionais cercam Padjelanta a um quilómetro de distância:
      [Rago](/lugar/rago-national-park/), [Sarek](/lugar/sarek-national-park/) e [Stora
      Sjöfallet](/lugar/stora-sjofallet-national-park/). Ligeiramente mais longe estende-se
      [Junkerdal](/lugar/junkerdal-national-park/). Entre os espaços distantes,
      [Helagsfjället](/lugar/helagsfjallet-nature-reserve/),
      [Dovrefjell-Sunndalsfjella](/lugar/dovrefjell-sunndalsfjella-national-park/) e
      [Hardangervidda](/lugar/hardangervidda-national-park/) partilham com Padjelanta a raposa-do-ártico, a
      rena, a alta montanha e as pastagens alpinas, enquanto
      [Pallas-Yllästunturi](/lugar/pallas-yllastunturi-national-park/) partilha a raposa-do-ártico, a rena e a
      alta montanha.
