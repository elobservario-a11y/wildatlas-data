resumen:
  es: >-
    Laguna costera de 60 km protegida por 5 islas barrera de arena (Barreta, Culatra, Armona, Tavira y
    Cacela), albergando la mayor colonia del camaleón común en Portugal.
  en: >-
    A 60 km coastal lagoon protected by 5 sandy barrier islands (Barreta, Culatra, Armona, Tavira, and
    Cacela), harbouring Portugal's largest common chameleon colony.
  fr: >-
    Lagune côtière de 60 km protégée par 5 îles-barrières sableuses (Barreta, Culatra, Armona, Tavira et
    Cacela), abritant la plus importante population de caméléon commun au Portugal.
  de: >-
    60 km lange Küstenlagune, geschützt von 5 sandigen Barriereinseln (Barreta, Culatra, Armona, Tavira und
    Cacela), Lebensraum der grössten Chamäleon-Kolonie Portugals.
  it: >-
    Laguna costiera di 60 km protetta da 5 isole barriera di sabbia (Barreta, Culatra, Armona, Tavira e
    Cacela), custode della maggiore colonia di camaleonte comune del Portogallo.
  pt: >-
    Laguna costeira de 60 km protegida por 5 ilhas-barreira arenosas (Barreta, Culatra, Armona, Tavira e
    Cacela), albergando a maior colónia do camaleão-comum em Portugal.
unico:
  es: >-
    Una laguna de islas de arena en movimiento donde llegan más de 200 especies de aves, caballitos de mar y
    el camaleón común, que en Portugal solo existe en el Algarve.
  en: >-
    A dynamic lagoon of shifting sand barrier islands welcoming over 200 bird species, seahorses, and the
    common chameleon, which in Portugal occurs only in the Algarve.
  fr: >-
    Une lagune d'îles sableuses mobiles accueillant plus de 200 espèces d'oiseaux, des hippocampes et le
    caméléon commun, présent au Portugal uniquement en Algarve.
  de: >-
    Eine Lagune aus dynamischen Sandinseln, an der über 200 Vogelarten, Seepferdchen und das Europäische
    Chamäleon leben, das in Portugal nur an der Algarve vorkommt.
  it: >-
    Una laguna di isole sabbiose mobili dove sostano oltre 200 specie di uccelli, cavallucci marini e il
    camaleonte comune, presente in Portogallo solo in Algarve.
  pt: >-
    Uma laguna de ilhas de areia em movimento onde chegam mais de 200 espécies de aves, cavalos-marinhos e o
    camaleão-comum, que em Portugal só existe no Algarve.
observaciones:
  es: >-
    Las normas son claras: caminar solo por los senderos existentes, no coger plantas, no molestar a los
    animales, no fumar ni hacer fuego y tirar la basura en los recipientes. Comprueba con el ICNF los horarios
    y condiciones del centro antes de ir.
texto:
  es:
    intro: >-
      Con la marea baja, la Ria Formosa deja de parecer una laguna y se convierte en un laberinto de canales,
      fango y saladares, con aves hurgando en el barro. Con la marea alta, vuelve a ser agua. Esa respiración
      diaria es el pulso de un parque natural que se extiende 60 kilómetros por la costa del Algarve, desde la
      península de Ancão hasta Manta Rota, y que ocupa unas 18.400 hectáreas.


      Y aunque se llame «ría», no lo es. Una ría es un valle fluvial inundado por el mar; esto es una laguna
      protegida por islas barrera de arena.
    landscape: >-
      Al sur, un cordón de islas y penínsulas arenosas protege la laguna del mar; entre ellas, cinco islas
      barrera: Barreta, Culatra, Armona, Tavira y Cacela. Esas islas no están quietas: el viento, las
      corrientes y las mareas modifican sin parar su contorno, y hoy tienden a avanzar hacia el continente. La
      laguna se comunica con el mar por seis bocas, cinco naturales y móviles y una artificial, abierta para
      facilitar el acceso al puerto de Faro.


      Detrás, unas 11.000 hectáreas de sistema lagunar. Una parte está siempre sumergida; otra emerge con la
      bajamar. La profundidad media es de dos metros.


      La Ria Formosa es el mayor humedal del sur de Portugal. En el extremo de la isla de la Barreta está el
      punto más meridional de Portugal continental, el Cabo de Santa Maria.
    wildlife: >-
      Lo primero son las aves. Se han contado más de doscientas especies, muchas raras o en peligro. En
      invierno se concentran más de 20.000 aves acuáticas, y entre los invernantes destacan el silbón, el
      cuchara y la cerceta común, además de limícolas como el correlimos común, el zarapito real y el chorlito
      gris. Entre las que crían están la [garceta común](/especie/egretta_garzetta/), la gaviota de Audouin,
      el [chorlitejo patinegro](/especie/charadrius_alexandrinus/) y el [charrancito
      común](/especie/sternula_albifrons/).


      El símbolo del parque es el [calamón](/especie/porphyrio_porphyrio/), o camão. Se eligió en los años
      setenta porque era una de las aves más raras de Portugal y solo existía en la Ria Formosa. En el Ludo,
      según la época del año, se ven [flamencos](/especie/phoenicopterus_roseus/),
      [espátulas](/especie/platalea_leucorodia/) y varias especies de patos, garzas y limícolas.


      Bajo el agua viven más de cien especies de peces. En las praderas marinas hay dos especies de caballito
      de mar, entre ellas el [caballito de mar hocicudo](/especie/hippocampus_guttulatus/), y la Ria llegó a
      albergar la mayor comunidad del mundo. En 2020 se crearon dos áreas de refugio para frenar el declive.
      En los saladares viven el cangrejo boca-cava-terra, y el camaleón común es un reptil que en Portugal
      solo existe en el litoral algarvio. Entre los mamíferos hay 34 especies, entre ellas la
      [nutria](/especie/lutra_lutra/), la [gineta](/especie/genetta_genetta/) y el tejón.


      La vegetación se ordena por zonas. En la duna, el cardo marítimo, los cordeirinhos-da-praia y el barrón
      fijan la arena. En el saladar bajo, casi siempre sumergido, domina la morraça. Entre los endemismos
      algarvios destacan Linaria algarviana, el tomillo Thymus lotocephalus y Tuberaria major.
    visit: >-
      El Trilho de São Lourenço es lineal, de unos 3 km ida y vuelta, entre una hora y media y dos horas y
      fácil. Empieza frente al puente de madera que une Quinta do Lago con la península de Ancão y reúne tres
      hábitats: saladar, bosque y laguna de agua dulce. Es muy bueno para observar aves, con observatorios.


      En el Ludo hay dos senderos lineales que se cruzan: el Caminho do Ludo, de 5 a 7 km ida y vuelta, y las
      salinas do Ludo, de 5 km. Es una de las zonas más importantes del Algarve para las aves acuáticas.


      El Centro de Educação Ambiental de Marim (CEAM) ocupa una antigua quinta junto a la ría y tiene un
      centro de interpretación y un recorrido de 23 estaciones. Su recorrido es circular, de 2,5 km, fácil y
      de entre una hora y media y dos horas; incluye dos observatorios, uno sobre el saladar, con limícolas, y
      otro sobre un charco de agua dulce, con anátidas y garzas.


      En la isla de la Barreta, el recorrido es circular, de 3 km y unas dos horas, y fácil.
    history: >-
      La Reserva Natural de 1978 nació para proteger la zona lagunar del crecimiento urbano y turístico. Es
      Zona Húmeda de Importancia Internacional (Ramsar) desde 1981 y forma parte de la Red Natura 2000. En
      2010 se la eligió una de las siete maravillas naturales de Portugal, en la categoría de área marina.


      Las salinas, entre Loulé y Tavira, producen cerca de la mitad de la sal marina nacional. La presencia
      árabe dejó huertas, pomares de cítricos, norias y las almadrabas para la pesca del atún. El núcleo
      histórico de Cacela Velha es uno de los conjuntos patrimoniales mejor conservados del Algarve. Y el
      crecimiento desordenado del turismo desde la década de 60 del siglo pasado degradó el litoral algarvio.
    before: >-
      Las normas son claras: caminar solo por los senderos existentes, no coger plantas, no molestar a los
      animales, no fumar ni hacer fuego y tirar la basura en los recipientes. Comprueba con el ICNF los
      horarios y condiciones del centro antes de ir.
    around: >-
      En el atlas no tiene vecinos cercanos, pero comparte calamón y flamenco con la [Riserva Naturale
      Orientata Vendicari](/lugar/riserva-naturale-orientata-vendicari/) y el [Parque Nacional de
      Doñana](/lugar/parque-nacional-de-donana/), y flamenco con la [Laguna di
      Venezia](/lugar/laguna-di-venezia/) y el [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).
  en:
    intro: >-
      At low tide, the Ria Formosa ceases to resemble a lagoon and transforms into a vast labyrinth of tidal
      channels, mudflats, and saltmarshes where waders probe the silt. With high tide, seawater reclaims the
      expanse. This daily tidal rhythm represents the living heartbeat of a natural park stretching for 60
      kilometres along the Algarve coastline, from the Ancão Peninsula to Manta Rota, encompassing some 18,400
      hectares.


      And despite its Portuguese name 'ria', it is not one in geological terms. A true ria is a drowned river
      valley carved into bedrock; this is a coastal lagoon sheltered behind shifting barrier islands of marine
      sand.
    landscape: >-
      To the south, an offshore chain of sandspits and barrier islands shields the lagoon from ocean swells;
      among them lie five primary barrier islands: Barreta, Culatra, Armona, Tavira, and Cacela. These sand
      barriers are never static: winds, littoral drift, and tidal currents continuously remodel their
      morphology, pushing them gradually landward towards the mainland. The lagoon connects with the open
      Atlantic through six inlets—five natural, migratory tidal passes and one stabilized artificial channel
      excavated to secure maritime access to the port of Faro.


      Behind the sand barriers stretches an 11,000-hectare lagoon system. Portions remain permanently
      inundated; others emerge daily with the receding ebb tide. Mean water depth averages around two metres.


      The Ria Formosa constitutes the most extensive coastal wetland in southern Portugal. At the southern tip
      of Ilha da Barreta lies Cabo de Santa Maria, the southernmost point of continental Portugal.
    wildlife: >-
      Birdlife commands primary attention. More than two hundred bird species have been recorded, including
      numerous rare or vulnerable taxa. In winter the lagoon hosts congregations exceeding 20,000 waterbirds,
      with wintering flocks dominated by Eurasian wigeon, northern shoveler, and common teal, alongside waders
      such as dunlin, Eurasian curlew, and grey plover. Breeding birds include the [little
      egret](/especie/egretta_garzetta/), Audouin's gull, [Kentish plover](/especie/charadrius_alexandrinus/),
      and [little tern](/especie/sternula_albifrons/).


      The park's emblem is the [western swamphen](/especie/porphyrio_porphyrio/), known locally as the
      *camão*. It was chosen in the nineteen-seventies when it was one of the rarest breeding birds in
      Portugal, restricted to the marshes of the Ria Formosa. At Ludo, depending on the season, you can
      observe [greater flamingos](/especie/phoenicopterus_roseus/), [Eurasian
      spoonbills](/especie/platalea_leucorodia/), and diverse ducks, herons, and shorebirds.


      Beneath the surface live more than one hundred species of marine and estuarine fish. Extensive seagrass
      meadows shelter two species of seahorses, including the [long-snouted
      seahorse](/especie/hippocampus_guttulatus/), with the Ria once sustaining one of the largest seahorse
      populations on Earth. In 2020 two marine sanctuaries were created to halt steep population declines. The
      mudflats support the fiddler crab (*boca-cava-terra*), while the Mediterranean chameleon is a
      terrestrial reptile confined within Portugal strictly to coastal Algarve pine dunes. Mammals number 34
      species, featuring [Eurasian otter](/especie/lutra_lutra/), [common genet](/especie/genetta_genetta/),
      and European badger.


      Vegetation displays strict coastal zonation. On embryonic dunes, sea holly (*Eryngium maritimum*),
      cottonweed, and marram grass bind the shifting sand. In low saltmarshes subject to regular inundation,
      cordgrass (*Spartina maritima*) dominates. Algarve botanical endemics include *Linaria algarviana*, the
      aromatic thyme *Thymus lotocephalus*, and rockrose *Tuberaria major*.
    visit: >-
      The Trilho de São Lourenço is a linear walking trail measuring 3 km return, taking between an hour and a
      half and two hours, graded easy. It departs opposite the wooden bridge linking Quinta do Lago to the
      Ancão Peninsula, traversing three diverse ecosystems: saltmarsh, stone pine woodland, and a freshwater
      lagoon equipped with bird blinds.


      At Ludo, two intersecting linear dirt tracks offer prime wildlife viewing: the Caminho do Ludo, spanning
      5 to 7 km return, and the Salinas do Ludo trail, extending for 5 km. It ranks among the most critical
      waterfowl viewing localities anywhere in the Algarve.


      The Marim Environmental Education Centre (CEAM) occupies an old coastal farmstead (*quinta*) beside the
      lagoon, offering an interpretation pavilion and a marked 23-station nature trail. The circuit is 2.5 km
      long, easy, taking between an hour and a half and two hours; it features two bird blinds—one overlooking
      intertidal mudflats frequented by waders, another over a freshwater pond attracting ducks and herons.


      On Ilha da Barreta (Deserta), an easy circular boardwalk extends for 3 km, taking roughly two hours.
    history: >-
      The Natural Reserve was first created in 1978 to shield the lagoon ecosystem from escalating
      urbanisation and mass tourism. Designated a Ramsar Wetland of International Importance in 1981, it is
      integrated into the Natura 2000 network. In 2010 it was elected one of Portugal's Seven Natural Wonders
      in the marine category.


      Traditional sea salt pans between Loulé and Tavira yield nearly half of Portugal's artisanal marine
      salt. Moorish occupation left an enduring legacy of irrigation wheels (*noras*), citrus orchards, water
      gardens, and tuna trap nets (*armações*). The whitewashed cliffside village of Cacela Velha represents
      one of the Algarve's best-preserved historical ensembles. Conversely, unplanned tourist development from
      the 60s of the past century onward inflicted heavy pressure across the Algarve coast.
    before: >-
      Park regulations are strict: keep strictly to marked pathways, never pick native flora, avoid disturbing
      roosting fauna, do not light fires or smoke, and deposit all refuse in designated bins. Check opening
      times and visitor centre access with the ICNF before your excursion.
    around: >-
      While lacking immediate neighbours within the atlas, it shares the swamphen and flamingo with [Vendicari
      Nature Reserve](/lugar/riserva-naturale-orientata-vendicari/) and [Doñana National
      Park](/lugar/parque-nacional-de-donana/), and flamingos with the [Venice
      Lagoon](/lugar/laguna-di-venezia/) and [Ses Salines Natural
      Park](/lugar/parque-natural-de-ses-salines/).
  fr:
    intro: >-
      À marée basse, la Ria Formosa cesse de ressembler à un plan d'eau pour se muer en un labyrinthe de
      chenaux de marée, de vasières et de schorres où s'affairent les limicoles. À marée haute, les eaux
      recouvrent l'espace. Cette respiration biquotidienne donne son rythme à un parc naturel s'étirant sur 60
      kilomètres le long du littoral de l'Algarve, de la péninsule d'Ancão jusqu'à Manta Rota, sur quelque 18
      400 hectares.


      Et bien qu'on la nomme « ria », il n'en est rien au sens géomorphologique : une ria est une vallée
      fluviale encaissée ennoyée par la mer ; il s'agit ici d'une lagune littorale protégée par des cordons
      d'îles-barrières sableuses.
    landscape: >-
      Au sud, un cordon d'îles et de péninsules de sable préserve la lagune des assauts de l'Atlantique ;
      parmi elles figurent cinq îles-barrières majeures : Barreta, Culatra, Armona, Tavira et Cacela. Ces
      bancs de sable sont mobiles : vents, courants de dérive et marées remodèlent continuellement leur tracé,
      avec une tendance actuelle à la migration vers le continent. La lagune communique avec l'océan par six
      passes tidales, cinq naturelles et divagantes et une passe artificielle stabilisée pour garantir l'accès
      au port de Faro.


      En arrière s'étire un système lagunaire d'environ 11 000 hectares. Une fraction demeure en eau en
      permanence tandis que le reste émerge à chaque reflux. La profondeur moyenne s'établit autour de deux
      mètres.


      La Ria Formosa constitue la zone humide la plus vaste du sud du Portugal. À la pointe sud de l'île de
      Barreta se trouve le point le plus méridional du Portugal continental, le Cabo de Santa Maria.
    wildlife: >-
      L'avifaune représente l'attrait premier. Plus de deux cents espèces y ont été dénombrées, dont nombre
      d'oiseaux rares ou menacés. En hiver s'y rassemblent plus de 20 000 oiseaux d'eau, dominés par le canard
      siffleur, le canard souchet et la sarcelle d'hiver, aux côtés de limicoles comme le bécasseau variable,
      le courlis cendré et le pluvier argenté. Parmi les nicheurs figurent l'[aigrette
      garzette](/especie/egretta_garzetta/), le goéland d'Audouin, le [gravelot à collier
      interrompu](/especie/charadrius_alexandrinus/) et la [sterne naine](/especie/sternula_albifrons/).


      L'emblème officiel est la [talève sultane](/especie/porphyrio_porphyrio/), ou *camão*. Elle fut choisie
      dans les années soixante-dix car elle comptait parmi les nicheurs les plus rares du pays, cantonnée à la
      Ria Formosa. Au Ludo, selon la saison, se rencontrent le [flamant
      rose](/especie/phoenicopterus_roseus/), la [spatule blanche](/especie/platalea_leucorodia/) et une
      diversité de hérons, canards et échassiers.


      Sous l'eau vivent plus de cent espèces de poissons. Les herbiers marins abritent deux espèces de
      syngnathidés dont l'[hippocampe moucheté](/especie/hippocampus_guttulatus/), la Ria ayant hébergé par le
      passé l'une des plus fortes densités de la planète. En 2020 ont été instaurés deux sanctuaires de
      quiétude pour enrayer le déclin. Les vasières abritent le crabe violoniste, tandis que le caméléon
      commun est un reptile restreint au Portugal aux dunes boisées du littoral algarvien. Les mammifères
      comptent 34 espèces, dont la [loutre d'Europe](/especie/lutra_lutra/), la [genette
      commune](/especie/genetta_genetta/) et le blaireau.


      La flore se répartit en ceintures écologiques. Sur la dune vive, le panicaut maritime et l'oyat fixent
      le sable. Dans le bas-schorre submergé quotidiennement domine la spartine. Parmi les endémiques
      d'Algarve figurent *Linaria algarviana*, le thym *Thymus lotocephalus* et l'hélianthème *Tuberaria
      major*.
    visit: >-
      Le Trilho de São Lourenço est un parcours linéaire d'environ 3 km aller-retour, prenant entre une heure
      et demie et deux heures, facile. Il débute face à la passerelle en bois reliant Quinta do Lago à la
      péninsule d'Ancão et réunit schorre, pinède et étang d'eau douce aménagé d'observatoires.


      Au Ludo, deux pistes linéaires séduisent les promeneurs : le Caminho do Ludo, de 5 à 7 km aller-retour,
      et les marais salants du Ludo sur 5 km. C'est l'un des observatoires majeurs de l'Algarve pour les
      oiseaux d'eau.


      Le Centre d'éducation environnementale de Marim (CEAM) occupe une ancienne *quinta* en bordure de
      lagune, proposant un pavillon muséographique et un parcours pédestre balisé de 23 stations. Cette boucle
      de 2,5 km, facile, demande une heure et demie à deux heures ; elle comprend deux affûts ornithologiques,
      l'un sur les vasières à limicoles, l'autre sur une mare d'eau douce fréquentée par canards et hérons.


      Sur l'île de Barreta, un circuit pédestre en boucle de 3 km s'effectue en environ deux heures.
    history: >-
      La réserve naturelle initiale de 1978 avait vocation à protéger l'écosystème lagunaire contre
      l'urbanisation touristique galopante. Elle est classée zone humide d'importance internationale (Ramsar)
      depuis 1981 et fait partie du réseau Natura 2000. En 2010, elle fut proclamée l'une des sept merveilles
      naturelles du Portugal dans la catégorie marine.


      Les salines traditionnelles entre Loulé et Tavira fournissent près de la moitié du sel marin artisanal
      portugais. L'époque maure a légué norias, vergers d'agrumes et madragues pour la pêche au thon
      (*armações*). Le bourg perché de Cacela Velha compte parmi les ensembles historiques les mieux préservés
      de la région. En contrepartie, le développement touristique à compter des années 60 du siècle passé a
      exercé une forte pression sur le littoral.
    before: >-
      Les consignes sont strictes : cheminer uniquement sur les sentiers balisés, ne prélever aucun végétal,
      ne pas perturber la faune, ne fumer ni allumer de feu et emporter ses déchets. Vérifiez auprès de l'ICNF
      les heures d'ouverture du centre avant votre visite.
    around: >-
      Sans voisin immédiat dans l'atlas, la lagune partage talève sultane et flamant rose avec la [Réserve
      naturelle orientée de Vendicari](/lugar/riserva-naturale-orientata-vendicari/) et le [Parc national de
      Doñana](/lugar/parque-nacional-de-donana/), et le flamant rose avec la [Lagune de
      Venise](/lugar/laguna-di-venezia/) et le [Parc naturel de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).
  de:
    intro: >-
      Bei Ebbe gleicht die Ria Formosa kaum einer offenen Wasserfläche, sondern verwandelt sich in ein
      Labyrinth aus Prielen, Wattflächen und Salzmarschen, wo Watvögel im Schlick nach Nahrung suchen. Bei
      Flut erobert das Meer die Landschaft zurück. Dieser tägliche Gezeitenrhythmus bildet den Puls eines
      Naturparks, der sich über 60 Kilometer an der Küste der Algarve von der Halbinsel Ancão bis Manta Rota
      erstreckt und rund 18.400 Hektar umfasst.


      Und obgleich der Name «Ria» lautet, handelt es sich geomorphologisch nicht um eine solche: Eine echte
      Ria ist ein ertrunkenes Flusstal im Festgestein; hier liegt eine Küstenlagune vor, die durch
      vorgelagerte Sandbarriereinseln geschützt wird.
    landscape: >-
      Im Süden schirmt eine Kette sandiger Inseln und Nehrungen die Lagune gegen die Brandung des Atlantiks
      ab; darunter fünf Barriereinseln: Barreta, Culatra, Armona, Tavira und Cacela. Diese Düneninseln
      verharren keineswegs starr: Wind, Meeresströmungen und Gezeiten formen ihre Umrisse unablässig um und
      verlagern sie landwärts. Die Lagune steht über sechs Gezeiteneinlässe mit dem Ozean in Verbindung: fünf
      natürliche, wandernde Priele und ein künstlicher Durchstich, der für die Schifffahrt zum Hafen von Faro
      angelegt wurde.


      Dahinter breitet sich ein rund 11.000 Hektar grosses Lagunensystem aus. Ein Teil liegt dauerhaft unter
      Wasser, andere Bereiche fallen bei Ebbe trocken. Die mittlere Wassertiefe liegt bei etwa zwei Metern.


      Die Ria Formosa ist das bedeutendste Feuchtgebiet im Süden Portugals. An der Südspitze der Ilha da
      Barreta markiert das Cabo de Santa Maria den südlichsten Punkt des portugiesischen Festlands.
    wildlife: >-
      Die Vogelwelt steht an erster Stelle. Mehr als zweihundert Vogelarten wurden erfasst, darunter viele
      seltene oder gefährdete Arten. Im Winter versammeln sich über 20.000 Wasservögel, darunter Pfeifente,
      Löffelente und Krickente sowie Limikolen wie Alpenstrandläufer, Grosser Brachvogel und
      Kiebitzregenpfeifer. Als Brutvögel treten [Seidenreiher](/especie/egretta_garzetta/), Korallenmöwe,
      [Seeregenpfeifer](/especie/charadrius_alexandrinus/) und
      [Zwergseeschwalbe](/especie/sternula_albifrons/) auf.


      Wappentier des Parks ist das [Purpurhuhn](/especie/porphyrio_porphyrio/), portugiesisch *Camão*. Es
      wurde in den siebziger Jahren ausgewählt, da es zu den seltensten Vögeln Portugals gehörte und nur in
      der Ria Formosa brütete. Im Ludo-Gebiet lassen sich je nach Saison
      [Rosaflamingos](/especie/phoenicopterus_roseus/), [Löffler](/especie/platalea_leucorodia/) sowie Reiher,
      Enten und Watvögel beobachten.


      Unter Wasser leben über hundert Fischarten. Seegraswiesen bieten zwei Seepferdchenarten Lebensraum,
      darunter dem [Langschnäuzigen Seepferdchen](/especie/hippocampus_guttulatus/); die Lagune beherbergte
      einst die weltgrösste Population. 2020 wurden zwei Schutzbezirke eingerichtet, um den Rückgang zu
      stoppen. In den Schlickzonen gräbt die Winkerkrabbe, während das Europäische Chamäleon in Portugal
      ausschliesslich auf den Küstendünen der Algarve vorkommt. Unter den Säugetieren leben 34 Arten, darunter
      [Fischotter](/especie/lutra_lutra/), [Kleinfleck-Ginsterkatze](/especie/genetta_genetta/) und Dachs.


      Die Vegetation ist streng zonengestuft. Auf Primärdünen binden Stranddistel und Strandhafer den Sand. In
      den tieferen Salzmarschen dominiert Schlickgras. Zu den Algarve-Endemiten zählen *Linaria algarviana*,
      der Feld-Thymian *Thymus lotocephalus* und das Sonnenröschen *Tuberaria major*.
    visit: >-
      Der Trilho de São Lourenço verläuft linear über rund 3 km hin und zurück, dauert eineinhalb bis zwei
      Stunden und ist leicht zu begehen. Er beginnt gegenüber der Holzbrücke zwischen Quinta do Lago und der
      Halbinsel Ancão und führt durch Salzmarsch, Pinienwald und eine Süsswasserlagune mit Beobachtungshütten.


      Im Ludo-Gebiet kreuzen sich zwei Wanderwege: der Caminho do Ludo über 5 bis 7 km hin und zurück sowie
      der Weg an den Salinen über 5 km. Es ist eines der ertragreichsten Vogelbeobachtungsgebiete der Algarve.


      Das Umweltbildungszentrum Marim (CEAM) nutzt ein altes Landgut an der Lagune mit Besucherzentrum und
      einem Naturlehrpfad mit 23 Stationen. Der Rundweg ist 2,5 km lang, leicht und erfordert eineinhalb bis
      zwei Stunden; er umfasst zwei Vogelbeobachtungshütten – eine über dem Watt mit Watvögeln, eine an einem
      Süsswasserteich mit Enten und Reihern.


      Auf der Barreta-Insel verläuft ein Rundweg über 3 km in etwa zwei Stunden.
    history: >-
      Das Naturreservat von 1978 entstand, um die Lagunenlandschaft vor zügelloser Zersiedelung und
      Tourismusdruck zu bewahren. Seit 1981 ist das Gebiet als Ramsar-Feuchtgebiet von internationaler
      Bedeutung ausgewiesen und gehört zum Natura-2000-Netz. 2010 wurde die Ria Formosa zu einem der Sieben
      Naturwunder Portugals in der Kategorie Meeresgebiete gewählt.


      Die Salinen zwischen Loulé und Tavira liefern fast die Hälfte des handgeschöpften portugiesischen
      Meersalzes. Das maurische Erbe spiegelt sich in Brunnenrädern (*Noras*), Obstgärten und den
      traditionellen Thinfang-Stellnetzen (*Armações*) wider. Das historische Ensemble von Cacela Velha zählt
      zu den malerischsten der Algarve. Demgegenüber hat der Massentourismus seit den 60er Jahren des
      vergangenen Jahrhunderts die Küste stark überformt.
    before: >-
      Die Schutzregeln sind eindeutig: Nur auf ausgewiesenen Pfaden wandern, keine Pflanzen pflücken,
      Wildtiere nicht stören, kein offenes Feuer entfachen, nicht rauchen und Abfälle mitnehmen. Prüfe beim
      ICNF vorab Öffnungszeiten und Besucherregelungen.
    around: >-
      Im Atlas isoliert gelegen, teilt die Lagune Purpurhühner und Flamingos mit dem [Naturreservat
      Vendicari](/lugar/riserva-naturale-orientata-vendicari/) und dem [Nationalpark
      Doñana](/lugar/parque-nacional-de-donana/) sowie Flamingos mit der [Lagune von
      Venedig](/lugar/laguna-di-venezia/) und dem [Naturpark Ses
      Salines](/lugar/parque-natural-de-ses-salines/).
  it:
    intro: >-
      Con la bassa marea, la Ria Formosa muta radicalmente aspetto, trasformandosi in un labirinto di canali
      tidali, piane di marea e barene salmastre dove i limicoli perlustrano il fango. Con l'alta marea, le
      acque tornano a sommergere l'orizzonte. Questo respiro quotidiano scandisce il ritmo vitale di un parco
      naturale che si distende per 60 chilometri lungo il litorale dell'Algarve, dalla penisola di Ancão sino
      a Manta Rota, occupando circa 18.400 ettari.


      E benché venga denominata «ria», dal punto di vista geomorfologico non lo è: una ria è una valle
      fluviale allagata dal mare; qui siamo in presenza di una laguna litoranea protetta da cordoni di isole
      barriera sabbiose.
    landscape: >-
      Verso meridione, una teoria di isole e penisole sabbiose ripara la laguna dai marosi dell'Atlantico; fra
      queste spiccano cinque isole barriera: Barreta, Culatra, Armona, Tavira e Cacela. Questi cordoni di duna
      non sono statici: venti, correnti di deriva e maree ne ridisegnano costantemente il profilo, spingendoli
      verso la terraferma. La laguna comunica con l'oceano attraverso sei bocche tidali, cinque naturali e
      mobili e una artificiale, aperta per assicurare l'accesso marittimo al porto di Faro.


      Alle spalle si articola un bacino lagunare di circa 11.000 ettari. Una parte permane sommersa mentre
      un'altra emerge a ogni riflusso. La profondità media si attesta attorno ai due metri.


      La Ria Formosa è la più ampia zona umida del Portogallo meridionale. All'estremità dell'isola di Barreta
      si trova il Cabo de Santa Maria, punto più meridionale del Portogallo continentale.
    wildlife: >-
      L'avifauna costituisce la principale attrattiva. Sono state censite oltre duecento specie, molte delle
      quali rare o protette. Nei mesi invernali vi stazionano più di 20.000 uccelli acquatici, con presenze
      cospicue di fischione, mestolone e alzavola comune, oltre a trampolieri quali piovanello pancianera,
      chiurlo maggiore e piviere grigio. Tra i nidificanti si annoverano la
      [garzetta](/especie/egretta_garzetta/), il gabbiano corso, il
      [fratino](/especie/charadrius_alexandrinus/) e il [fraticello](/especie/sternula_albifrons/).


      Il simbolo dell'area protetta è il [pollo sultano](/especie/porphyrio_porphyrio/), detto *camão*. Fu
      scelto negli anni settanta poiché era uno degli uccelli più rari del paese, confinato proprio alle
      paludi della Ria Formosa. Presso il Ludo, a seconda della stagione, si ammirano [fenicotteri
      maggiori](/especie/phoenicopterus_roseus/), [spatole](/especie/platalea_leucorodia/) e numerose anatre,
      aironi e limicoli.


      Sotto la superficie vivono oltre cento specie di pesci. Nelle praterie sottomarine albergano due specie
      di ippocampi tra cui il [cavalluccio marino camuso](/especie/hippocampus_guttulatus/); la Ria è arrivata
      a ospitare la popolazione più densa del pianeta. Nel 2020 sono state istituite due riserve di tutela per
      frenarne il declino. Nei fanghi intertidali vive il granchio violoncellista, mentre il camaleonte comune
      è un rettile limitato in Portogallo alle pinete costiere dell'Algarve. Tra i mammiferi compaiono 34
      specie, tra cui la [lontra](/especie/lutra_lutra/), la [genetta](/especie/genetta_genetta/) e il tasso.


      La vegetazione si struttura per fasce. Sulle dune il calcatreppola marittima e lo sparto pungente
      consolidano la sabbia. Nel basso barena domina la spartina. Tra gli endemismi dell'Algarve figurano
      *Linaria algarviana*, il timo *Thymus lotocephalus* e l'eliantemo *Tuberaria major*.
    visit: >-
      Il Trilho de São Lourenço è un itinerario lineare di circa 3 km tra andata e ritorno, della durata di
      un'ora e mezza o due ore, di difficoltà facile. Ha inizio davanti al ponte di legno che congiunge Quinta
      do Lago alla penisola di Ancão e tocca barena, pineta e una laguna d'acqua dolce dotata di capanni di
      osservazione.


      Nella zona del Ludo si incrociano due tracciati lineari: il Caminho do Ludo, lungo da 5 a 7 km tra
      andata e ritorno, e il sentiero delle saline del Ludo di 5 km. È uno dei comprensori più significativi
      dell'Algarve per gli uccelli acquatici.


      Il Centro de Educação Ambiental de Marim (CEAM) ha sede in un'antica tenuta agricola costiera ed è
      provvisto di centro visite e percorso didattico con 23 stazioni. L'anello è di 2,5 km, agevole, e
      richiede da un'ora e mezza a due ore; comprende due capanni di avvistamento—uno affacciato sul fango di
      marea con limicoli, l'altro su uno stagno d'acqua dolce con anatre e aironi.


      Sull'isola di Barreta l'itinerario circolare si sviluppa per 3 km in circa due ore.
    history: >-
      La Riserva Naturale del 1978 fu istituita per preservare la laguna dall'espansione urbana e turistica. È
      zona umida di importanza internazionale (Ramsar) dal 1981 ed è inserita nella rete Natura 2000. Nel 2010
      è stata proclamata una delle sette meraviglie naturali del Portogallo nella categoria marina.


      Le saline tradizionali tra Loulé e Tavira forniscono circa la metà del sale marino artigianale del
      paese. La dominazione araba ha lasciato in eredità orti, agrumeti, norie e le tonnare fisse
      (*armações*). Il borgo storico di Cacela Velha costituisce uno dei complessi architettonici meglio
      conservati dell'Algarve. Per contro, l'urbanizzazione turistica a partire dagli anni 60 del secolo
      scorso ha alterato parte del litorale.
    before: >-
      Le norme sono rigorose: cammina solo sui tracciati segnalati, non cogliere vegetali, non disturbare gli
      animali, non fumare né accendere fuochi e riponi i rifiuti negli appositi contenitori. Informati presso
      l'ICNF sugli orari del centro prima dell'escursione.
    around: >-
      Nell'atlas non presenta aree confinanti, ma condivide pollo sultano e fenicottero con la [Riserva
      Naturale Orientata Vendicari](/lugar/riserva-naturale-orientata-vendicari/) e il [Parco Nazionale di
      Doñana](/lugar/parque-nacional-de-donana/), e il fenicottero con la [Laguna di
      Venezia](/lugar/laguna-di-venezia/) e il [Parco Naturale di Ses
      Salines](/lugar/parque-natural-de-ses-salines/).
  pt:
    intro: >-
      Com a maré baixa, a Ria Formosa deixa de parecer uma laguna e converte-se num labirinto de esteiros,
      lodaçais e sapais, com aves a esgravatar no vasa. Com a preia-mar, volta a ser água. Essa respiração
      diária é o pulsar de um parque natural que se estende 60 quilómetros pela costa do Algarve, desde a
      península do Ancão até Manta Rota, ocupando cerca de 18.400 hectares.


      E embora se designe «ria», não o é sob o prisma geológico. Uma ria é um vale fluvial afogado pelo mar;
      este ecossistema é uma laguna litoral abrigada por ilhas-barreira arenosas.
    landscape: >-
      A sul, um cordão de ilhas e penínsulas arenosas protege a laguna das vagas do mar; entre elas, cinco
      ilhas-barreira: Barreta, Culatra, Armona, Tavira e Cacela. Essas ilhas não são estáticas: o vento, as
      correntes de deriva e as marés remodelam sem cessar os seus contornos, tendendo hoje a progredir rumo ao
      continente. A laguna comunica com o oceano por seis barras, cinco naturais e móveis e uma artificial,
      aberta para facilitar o acesso de navios ao porto de Faro.


      Para o interior estendem-se cerca de 11.000 hectares de sistema lagunar. Uma parcela permanece submersa
      em permanência; outra emerge na baixa-mar. A profundidade média ronda os dois metros.


      A Ria Formosa é a maior zona húmida do sul de Portugal. No extremo da ilha da Barreta situa-se o ponto
      mais meridional de Portugal continental, o Cabo de Santa Maria.
    wildlife: >-
      Em primeiro plano avultam as aves. Registaram-se mais de duzentas espécies, muitas raras ou sob ameaça.
      No inverno concentram-se mais de 20.000 aves aquáticas, sobressaindo entre os invernantes o piadeira, o
      pato-trombeteiro e o marreco-comum, além de limícolas como o pilrito-comum, o maçarico-real e a
      tarambola-cinzenta. Entre as reprodutoras contam-se a
      [garça-branca-pequena](/especie/egretta_garzetta/), a gaivota-de-audouin, o
      [borrelho-de-coleira-interrompida](/especie/charadrius_alexandrinus/) e o
      [chilreta-comum](/especie/sternula_albifrons/).


      O símbolo do parque é o [camão](/especie/porphyrio_porphyrio/), ou caimão. Foi eleito nos anos setenta
      por constituir uma das aves mais raras de Portugal, restrita à Ria Formosa. No Ludo, consoante a
      estação, avistam-se [flamingos](/especie/phoenicopterus_roseus/),
      [colhereiros](/especie/platalea_leucorodia/) e diversas espécies de patos, garças e limícolas.


      Sob a água habitam mais de cem espécies de peixes. Nas pradarias de ervas marinhas ocorrem duas espécies
      de cavalos-marinhos, designadamente o
      [cavalo-marinho-de-focinho-comprido](/especie/hippocampus_guttulatus/), tendo a Ria chegado a acolher a
      maior colónia do mundo. Em 2020 criaram-se duas áreas de refúgio para travar o declínio. Nos sapais
      habita o caranguejo boca-cava-terra, e o camaleão-comum é um réptil que em Portugal apenas subsiste no
      litoral algarvio. Os mamíferos somam 34 espécies, entre as quais a [lontra](/especie/lutra_lutra/), a
      [gineta](/especie/genetta_genetta/) e o texugo.


      A vegetação reparte-se por faixas ecológicas. Na duna primária, o cardo-marítimo, os
      cordeirinhos-da-praia e o estupe fixam a areia. No sapal baixo, quase sempre imerso, prevalece a
      morraça. Entre os endemismos algarvios ressaltam *Linaria algarviana*, o tomilho *Thymus lotocephalus* e
      a sargacinha *Tuberaria major*.
    visit: >-
      O Trilho de São Lourenço é linear, com cerca de 3 km de ida e volta, demorando entre uma hora e meia e
      duas horas, de grau fácil. Começa defronte da ponte de madeira que une a Quinta do Lago à península do
      Ancão e agrega três habitats: sapal, pinhal e uma lagoa de água doce munida de observatórios.


      No Ludo cruzam-se dois trilhos lineares: o Caminho do Ludo, com 5 a 7 km de ida e volta, e o das salinas
      do Ludo, de 5 km. Representa um dos locais mais determinantes do Algarve para aves aquáticas.


      O Centro de Educação Ambiental de Marim (CEAM) localiza-se numa antiga quinta junto à ria, dispondo de
      centro de interpretação e percurso com 23 estações didáticas. O circuito é circular, de 2,5 km, fácil e
      requer entre uma hora e meia e duas horas; inclui dois observatórios, um sobre o sapal com limícolas e
      outro sobre um charco de água doce com patos e garças.


      Na ilha da Barreta, o percurso pedonal é circular, de 3 km e cerca de duas horas, com grau fácil.
    history: >-
      A Reserva Natural de 1978 nasceu para salvaguardar o meio lagunar da voracidade urbanística e turística.
      Constitui Zona Húmida de Importância Internacional (Ramsar) desde 1981 e integra a Rede Natura 2000. Em
      2010 foi eleita uma das Sete Maravilhas Naturais de Portugal na categoria de zonas marinhas.


      As salinas tradicionais entre Loulé e Tavira produzem perto de metade do sal marinho nacional. O passado
      islâmico legou noras, pomares de citrinos, hortas e as armações da pesca do atum. O núcleo histórico de
      Cacela Velha figura entre os conjuntos patrimoniais mais bem conservados do Algarve. Em contrapartida, a
      expansão desordenada do turismo desde a década de 60 do século passado degradou faixas do litoral.
    before: >-
      As normas são expressas: caminha apenas nos trilhos assinalados, não colhas plantas, não perturbes os
      animais, não fumes nem acendas lume e deposita o lixo nos contentores. Confirma previamente junto do
      ICNF os horários do centro.
    around: >-
      No atlas não conta com áreas vizinhas próximas, mas partilha o camão e o flamingo com a [Riserva
      Naturale Orientata Vendicari](/lugar/riserva-naturale-orientata-vendicari/) e o [Parque Nacional de
      Doñana](/lugar/parque-nacional-de-donana/), e o flamingo com a [Laguna di
      Venezia](/lugar/laguna-di-venezia/) e o [Parque Natural de Ses
      Salines](/lugar/parque-natural-de-ses-salines/).
