resumen:
  es: >-
    Dos lagos de montaña compartidos por tres países y una de las mayores colonias del mundo de pelícano
    ceñudo.
  en: >-
    Two high-altitude mountain lakes shared across three sovereign borders, supporting one of the world's
    greatest breeding colonies of Dalmatian pelicans.
  fr: >-
    Deux lacs d'altitude partagés entre trois frontières et l'une des plus exceptionnelles colonies de
    pélicans frisés au monde.
  de: Zwei Hochgebirgsseen im Dreiländereck mit einer der weltweit bedeutendsten Kolonien des Krauskopfpelikans.
  it: >-
    Due laghi d'alta quota condivisi tra tre confini e una delle maggiori colonie al mondo di pellicano
    riccio.
  pt: >-
    Dois lagos alpinos partilhados por três países e uma das mais extraordinárias colónias do mundo de
    pelicano-crespo.
unico:
  es: >-
    La mayor colonia de pelícano ceñudo del mundo, en un lago pequeño de aguas someras que comparten Grecia y
    Albania.
  en: >-
    The world's largest breeding colony of Dalmatian pelicans, flourishing across a shallow freshwater lake
    shared between Greece and Albania.
  fr: >-
    La plus grande colonie de pélicans frisés de la planète, établie sur un lac aux eaux peu profondes partagé
    entre la Grèce et l'Albanie.
  de: >-
    Die weltweit größte Kolonie des Krauskopfpelikans an einem seichten Seebecken, das sich Griechenland und
    Albanien teilen.
  it: >-
    La più grande colonia di pellicano riccio del pianeta, insediata in un bacino lacustre poco profondo
    diviso tra Grecia e Albania.
  pt: >-
    A maior colónia de pelicano-crespo do planeta, radicada num lago somero partilhado entre a Grécia e a
    Albânia.
observaciones:
