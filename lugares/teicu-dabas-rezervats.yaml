resumen:
  es: Una de las mayores turberas elevadas del Báltico, reserva estricta con islas de bosque dentro de la turba.
  en: >-
    One of the largest pristine raised bogs in the Baltic region, a strict nature reserve dotted with forested
    mineral islands rising from the peat.
  fr: >-
    L'une des plus vastes tourbières bombées du bassin baltique, réserve intégrale ponctuée d'îles boisées
    émergeant de la tourbe.
  de: >-
    Eines der größten unberührten Hochmoore des Baltikums, ein Totalreservat mit bewaldeten Mineralbodeninseln
    inmitten endloser Torfmoose.
  it: >-
    Una delle maggiori torbiere alte intatte del Baltico, riserva integrale costellata da isole boscose che
    emergono dalla coltre di torba.
  pt: >-
    Uma das maiores turfeiras altas intocadas do Báltico, reserva estrita pontuada por ilhas florestadas que
    emergem da turfa.
unico:
  es: Una turbera de musgo casi intacta y enorme, que se visita acompañado y con permiso.
  en: >-
    An immense, virtually untouched sphagnum moss bog, accessible only when accompanied by an authorized
    ranger.
  fr: Une tourbière de sphaignes immense et quasi intacte, que l'on découvre obligatoirement encadré d'un guide.
  de: >-
    Ein gigantisches, praktisch unberührtes Hochmoor, das nur in Begleitung autorisierter Guides betreten
    werden darf.
  it: Una torbiera di sfagni immensa e quasi vergine, accessibile unicamente accompagnati da guide autorizzate.
  pt: >-
    Uma turfeira de esfagno imensa e quase intacta, que se visita obrigatoriamente sob acompanhamento de guia
    credenciado.
observaciones:
  es: >-
    En la zona estricta está prohibido permanecer salvo para investigación y protección, y en la zona regulada
    hace falta permiso de la administración. En el tramo Sildas-Siksala se hacen excursiones con guía, a
    menudo casi a diario en la época de vegetación. Comprueba con el gestor cuándo y cómo reservar antes de
    ir.
texto:
  es:
    intro: >-
      La mayor turbera de Letonia está casi intacta, y para entrar hay que ir de la mano de un guía. La
      Reserva Natural de Teiči se creó en 1982 para proteger la turbera de Teiči, una de las mayores de
      Letonia y del Báltico, y es una de las cuatro reservas naturales estrictas del país: una figura pensada
      para zonas con poca o ninguna actividad humana. De sus 19.779 ha, 13.681 son la propia turbera.
    landscape: >-
      Teiči es sobre todo turbera alta o de musgo, apenas tocada por la actividad humana: aquí el paisaje es
      agua, musgo y cielo. Dentro de la turbera hay 18 pequeños lagos e islotes de suelo firme, y el bosque
      ocupa solo unas 3729 ha, sobre todo en el norte. Entre los lagos mayores de 2 ha están Kurtava,
      Pieslaists y Mindaugas, todos distróficos.


      Junto a Teiči está la turbera de Pelečāre. Son dos turberas altas y de transición naturales, unidas
      entre sí y rodeadas de bosques, y juntas forman un humedal que estabiliza el clima regional y el caudal
      de los ríos: evita crecidas estacionales y baja el nivel freático en la estación seca. El drenaje del
      pasado es la mayor degradación del ecosistema; su efecto ha bajado por los canales cegados, los castores
      y los diques.
    wildlife: >-
      Es sobre todo un lugar de aves. Es un sitio de alimentación y descanso importante para las aves
      acuáticas migratorias, y también para las sedentarias, con grullas y gansos en grandes números. Hay 38
      especies protegidas de plantas con flor y helechos, y 24 de musgos.


      Algunas cifras de aves dan idea del lugar: entre 30 y 45 parejas de [grulla común](/especie/grus_grus/)
      crían en la turbera, y en otoño se juntan hasta 2800 antes de migrar. Crían entre 34 y 91 parejas de
      [chorlito dorado](/especie/pluvialis_apricaria/), y de 3 a 4 de águila pomerana. Un par de [águila
      real](/especie/aquila_chrysaetos/) volvió a criar en la reserva tras una interrupción. Cantan en el lek
      entre 20 y 40 machos de urogallo y entre 200 y 300 de gallo lira. En el paso otoñal entran en la turbera
      bandadas de gansos campestres y careto, hasta 2000 a la vez.
    visit: >-
      Aquí no se improvisa. En la zona de acceso restringido solo se admiten visitas científicas con permiso.
      La zona de acceso regulado se visita de junio a octubre y siempre con guía acreditado: se entra
      acompañado por personal de la administración y en momentos establecidos. Hay una torre de observación en
      la parte de Krustpils que se puede visitar sin guía.
    history: >-
      Las turberas son sitio Ramsar desde 1995 y forman parte de Natura 2000. En 1989 la reserva ya había
      entrado en la lista de zonas de importancia para las aves. En la isla de Siksala vive un pequeño grupo
      de Viejos Creyentes rusos, llegados en el siglo XVII huyendo de la persecución religiosa; hay cuatro
      granjas habitadas en Siksala y una en la isla de Mindaugas.
    before: >-
      En la zona estricta está prohibido permanecer salvo para investigación y protección, y en la zona
      regulada hace falta permiso de la administración. En el tramo Sildas-Siksala se hacen excursiones con
      guía, a menudo casi a diario en la época de vegetación. Comprueba con el gestor cuándo y cómo reservar
      antes de ir.
    around: >-
      Con humedales y grullas en común están el [Słowiński Park Narodowy](/lugar/slowinski-park-narodowy/), el
      [Parque Nacional de Doñana](/lugar/parque-nacional-de-donana/) y, con el chorlito dorado, [Ķemeru
      nacionālais parks](/lugar/kemeru-nacionalais-parks/) y [The Flow Country](/lugar/the-flow-country/).
  en:
    intro: >-
      The largest raised bog in Latvia remains virtually untouched, and entering it requires the company of an
      authorized guide. The Teiči Nature Reserve was created in 1982 to preserve the Teiči bog massif, among
      the grandest in Latvia and the entire Baltic basin. It represents one of only four strict nature
      reserves in the country: a conservation category reserved strictly for wilderness areas with minimal or
      zero human footprint. Of its 19,779 ha, 13,681 constitute the pristine raised bog itself.
    landscape: >-
      Teiči is predominantly an ombrotrophic raised bog, essentially unaltered by human exploitation: the
      scenery resolves into water, peat moss, and open sky. Within the bog labyrinth lie 18 small dystrophic
      lakes and forested mineral islands, while true forest occupies roughly 3729 ha, mostly along the
      northern margin. Lakes exceeding 2 ha include Kurtava, Pieslaists, and Mindaugas, all characteristically
      dystrophic.


      Directly adjoining Teiči lies the Pelečāre bog. These two raised and transition mires are naturally
      linked and surrounded by protective forest buffers, together forming a vast wetland that stabilizes
      regional hydrology and microclimate: curbing seasonal floods and moderating groundwater levels during
      droughts. Historical drainage ditches represented the primary disturbance, but their impacts have been
      largely reversed by self-blocking canals, beavers, and restoration dams.
    wildlife: >-
      Above all, this is a realm for wildfowl. It serves as a vital feeding and roosting staging ground for
      migratory waterbirds as well as sedentary wetland species, harboring cranes and geese in immense flocks.
      Botanical surveys have documented 38 protected species of vascular plants and ferns, alongside 24 rare
      bryophytes.


      Avian numbers illustrate the wetland's importance: between 30 and 45 breeding pairs of [common
      crane](/especie/grus_grus/) nest across the bog, with up to 2800 staging in autumn prior to departure.
      The mire supports 34 to 91 nesting pairs of [European golden plover](/especie/pluvialis_apricaria/),
      alongside 3 to 4 pairs of lesser spotted eagle. A pair of [golden eagles](/especie/aquila_chrysaetos/)
      has resumed nesting in the reserve following a hiatus. Leks feature 20 to 40 displaying western
      capercaillie cocks and 200 to 300 black grouse. During autumn passage, bean geese and greater
      white-fronted geese arrive in flocks numbering up to 2000 individuals at once.
    visit: >-
      Spontaneous visits are not permitted. Within the strict nature reserve core, only authorized scientific
      expeditions are allowed with written permits. The regulated zone can be visited between June and October
      exclusively with an accredited guide: visitors enter accompanied by reserve personnel during designated
      tour windows. A public wooden viewing tower in the Krustpils parish sector can be climbed freely without
      a guide.
    history: >-
      The bog system has been designated a Ramsar Wetland of International Importance since 1995 and forms an
      integral part of the Natura 2000 network. In 1989 the reserve was already identified as an Important
      Bird Area. On the isolated mineral island of Siksala resides a historic community of Russian Old
      Believers, descendants of refugees who fled religious persecution during the XVII century; four
      homesteads remain inhabited on Siksala and one on Mindaugas island.
    before: >-
      Entering the strict reserve zone is strictly prohibited except for approved scientific research and
      wardening, and entering the regulated visitor zone requires formal administrative permits. Along the
      Sildas-Siksala route, guided walking excursions run regularly during the growing season. Contact park
      administration in advance to arrange guided access.
    around: >-
      Sharing extensive mire habitats and staging cranes are [Słowiński National
      Park](/lugar/slowinski-park-narodowy/) in Poland and [Doñana National
      Park](/lugar/parque-nacional-de-donana/) in Spain; sharing breeding European golden plovers are [Ķemeru
      National Park](/lugar/kemeru-nacionalais-parks/) in Latvia and [The Flow
      Country](/lugar/the-flow-country/) in Scotland.
  fr:
    intro: >-
      La plus grande tourbière de Lettonie est restée quasi vierge, et y pénétrer exige l'accompagnement d'un
      garde agréé. La réserve naturelle de Teiči a été créée en 1982 pour préserver le massif tourbeux de
      Teiči, parmi les plus imposants du pays et de l'espace baltique, constituant l'une des quatre réserves
      naturelles intégrales nationales : un statut protecteur destiné aux espaces soustraits à l'activité
      humaine. Sur ses 19 779 ha, 13 681 forment la tourbière bombée proprement dite.
    landscape: >-
      Teiči est avant tout une tourbière haute ombrotrophe préservée des altérations humaines : le paysage
      n'est qu'eau, sphaigne et ciel. La tourbière englobe 18 petits lacs dystrophes et îlots de terre ferme,
      tandis que la forêt n'occupe qu'environ 3729 ha, principalement au nord. Parmi les plans d'eau de plus
      de 2 ha figurent Kurtava, Pieslaists et Mindaugas, tous typiquement dystrophes.


      Contiguë à Teiči s'étend la tourbière de Pelečāre. Ces deux massifs tourbeux hauts et de transition,
      reliés naturellement et ceinturés de forêts, composent une vaste zone humide qui régule le régime
      fluvial et le climat local : amortissant les crues et maintenant les nappes phréatiques en saison sèche.
      Les anciens fossés de drainage ont vu leurs impacts s'atténuer sous l'action des castors, de digues de
      restauration et du comblement spontané.
    wildlife: >-
      C'est un royaume ornithologique par excellence. Le site sert d'étape migratoire et de repos aux oiseaux
      d'eau comme aux résidents, rassemblant grues et oies par milliers. Les botanistes y recensent 38 espèces
      protégées de plantes vasculaires et fougères, ainsi que 24 espèces de mousses.


      Les dénombrements illustrent la valeur des lieux : entre 30 et 45 couples de [grues
      cendrées](/especie/grus_grus/) nichent dans la tourbière, et jusqu'à 2800 individus s'y concentrent en
      automne avant le grand départ. On y compte 34 à 91 couples de [pluviers
      dorés](/especie/pluvialis_apricaria/) et de 3 à 4 couples d'aigles pomarins. Un couple d'[aigles
      royaux](/especie/aquila_chrysaetos/) s'est réinstallé pour nicher dans la réserve. Sur les arènes de
      parade chantent 20 à 40 coqs de grand tétras et 200 à 300 tétras lyres. Lors du passage d'automne, les
      oies rieuses et des moissons stationnent en troupes atteignant 2000 individus simultanément.
    visit: >-
      L'accès ne s'improvise aucunement. Dans la zone de réserve intégrale, seules les missions scientifiques
      munies d'autorisations sont admises. La zone d'accès régulé se visite de juin à octobre sous la conduite
      exclusive d'un guide officiel : les groupes avancent sous la surveillance des agents du parc à des
      créneaux précis. Une tour d'observation dans le district de Krustpils reste accessible librement sans
      guide.
    history: >-
      Le complexe est classé site Ramsar depuis 1995 et relève du réseau Natura 2000. Dès 1989, la réserve
      intégrait l'inventaire des zones importantes pour la conservation des oiseaux. Sur l'île isolée de
      Siksala vit une communauté historique de Vieux-Croyants russes, réfugiés au XVIIe siècle pour fuir les
      persécutions religieuses ; quatre fermes traditionnelles sont encore habitées à Siksala et une sur l'île
      de Mindaugas.
    before: >-
      Tout séjour dans la zone intégrale est interdit hors recherches et gestion, et la zone régulée exige une
      autorisation préalable. Sur le tracé Sildas-Siksala des excursions guidées sont organisées durant la
      période végétative. Renseignez-vous auprès des gestionnaires pour réserver votre venue.
    around: >-
      Partageant zones humides et haltes de grues se distinguent le [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/) en Pologne et le [parc national de
      Doñana](/lugar/parque-nacional-de-donana/) en Espagne ; partageant le pluvier doré, le [Ķemeru
      nacionālais parks](/lugar/kemeru-nacionalais-parks/) en Lettonie et [The Flow
      Country](/lugar/the-flow-country/) en Écosse.
  de:
    intro: >-
      Lettlands größtes Hochmoor ist nahezu unberührt geblieben, und ein Besuch ist ausschließlich unter
      sachkundiger Führung gestattet. Das Naturreservat Teiči wurde 1982 ausgewiesen, um das Teiči-Moormassiv
      zu schützen – eines der größten Hochmoore Lettlands und des gesamten Ostseeraums. Es gehört zu den vier
      strengen Totalreservaten des Landes: eine Schutzkategorie, die für weitgehend unberührte Naturräume ohne
      menschliche Eingriffe reserviert ist. Von den 19.779 ha Gesamtfläche entfallen 13.681 ha auf das
      eigentliche Hochmoor.
    landscape: >-
      Teiči ist vor allem ein ombrotrophes Hochmoor, das von wirtschaftlicher Nutzung weitgehend verschont
      blieb: Hier besteht die Landschaft aus Wasser, Torfmoos und weitem Himmel. Im Moor liegen 18 kleine
      Dystrophie-Seen und bewaldete Mineralbodeninseln; Wald bedeckt lediglich 3729 ha, vor allem im Norden.
      Zu den Moorseen über 2 ha Größe zählen Kurtava, Pieslaists und Mindaugas, allesamt nährstoffarme
      Braunwasserseen.


      Direkt an Teiči grenzt das Hochmoor Pelečāre. Beide Moorkomplexe sind natürlich miteinander verbunden
      und von Wäldern umgeben; zusammen bilden sie ein Feuchtgebiet, das den regionalen Wasserhaushalt und das
      Kleinklima reguliert: Es dämpft Hochwasserspitzen und stützt Grundwasserstände in Trockenzeiten. Frühere
      Entwässerungsgräben verheilen zunehmend durch Biberaktivität, Versumpfungsdämme und natürlichen
      Torfmoosaufwuchs.
    wildlife: >-
      Das Reservat ist in erster Linie ein Vogelparadies. Es dient Zugvögeln wie Standvögeln als
      unverzichtbarer Rast- und Äsungsraum, wobei Kraniche und Wildgänse gewaltige Schwärme bilden. Botaniker
      kartierten 38 geschützte Farn- und Blütenpflanzenarten sowie 24 seltene Moosarten.


      Eindrucksvolle Zahlen belegen die ornithologische Bedeutung: Zwischen 30 und 45 Brutpaare des
      [Kranichs](/especie/grus_grus/) nisten im Moor, und im Herbst versammeln sich bis zu 2800 Vögel vor dem
      Abflug. 34 bis 91 Paare des [Goldregenpfeifers](/especie/pluvialis_apricaria/) und 3 bis 4 Paare des
      Schreiadlers brüten hier. Ein Paar des [Steinadlers](/especie/aquila_chrysaetos/) kehrte nach Brutpause
      zurück. Zur Balzzeit balzen 20 bis 40 Auerhähne und 200 bis 300 Birkhähne. Auf dem Herbstzug rasten
      Saat- und Blässgänse in Schwärmen von bis zu 2000 Tieren gleichzeitig.
    visit: >-
      Ein Besuch lässt sich nicht spontan durchführen. In der Kernzone sind ausschließlich genehmigte
      Forschungsexpeditionen zugelassen. Die regulierte Zone steht von Juni bis Oktober offen und erfordert
      zwingend eine akkreditierte Begleitung durch Personal der Naturschutzbehörde zu festen Terminen. Ein
      Aussichtsturm auf dem Gebiet von Krustpils kann ohne Führung bestiegen werden.
    history: >-
      Das Moor ist seit 1995 Ramsar-Gebiet und Teil des europäischen Schutzgebietsnetzes Natura 2000. Bereits
      1989 wurde das Reservat als Important Bird Area eingestuft. Auf der einsamen Moorinsel Siksala lebt eine
      historische Gemeinschaft russischer Altgläubiger, die im XVII. Jahrhundert vor religiöser Verfolgung
      hierher flüchteten; vier Höfe auf Siksala und einer auf der Insel Mindaugas sind bis heute bewohnt.
    before: >-
      In der Totalreservatszone ist der Zutritt außer zu Forschungs- und Kontrollzwecken verboten, und für die
      regulierte Zone ist eine behördliche Genehmigung vorgeschrieben. Auf der Route Sildas-Siksala finden
      während der Vegetationsperiode regelmäßig Führungen statt. Erkundige dich vorab bei der Verwaltung über
      Anmeldeformalitäten.
    around: >-
      Gemeinsamkeiten bei Feuchtgebieten und rastenden Kranichen bestehen mit dem
      [Słowiński-Nationalpark](/lugar/slowinski-park-narodowy/) in Polen und dem [Nationalpark
      Doñana](/lugar/parque-nacional-de-donana/) in Spanien; Goldregenpfeifer teilt das Gebiet mit dem
      lettischen [Ķemeru-Nationalpark](/lugar/kemeru-nacionalais-parks/) und [The Flow
      Country](/lugar/the-flow-country/) in Schottland.
  it:
    intro: >-
      La maggiore torbiera della Lettonia è rimasta pressoché incontaminata, e per accedervi è obbligatorio
      farsi accompagnare da una guida ufficiale. La Riserva Naturale di Teiči è stata istituita nel 1982 per
      tutelare il vasto complesso torboso di Teiči, tra i più estesi della Lettonia e dell'intero bacino
      baltico, figurando tra le sole quattro riserve naturali integrali del paese: una qualifica concepita per
      preservare ecosistemi privi di interferenze umane. Dei suoi 19.779 ha, 13.681 costituiscono la torbiera
      vera e propria.
    landscape: >-
      Teiči è prevalentemente una torbiera alta a sfagni mai intaccata da opere di bonifica: il paesaggio è
      pura composizione di acque stagnanti, muschi e cieli aperti. All'interno si contano 18 piccoli bacini
      distrofici e rilievi boscosi stabili, mentre la foresta copre circa 3729 ha, concentrata soprattutto a
      nord. Tra i laghetti con superficie superiore a 2 ha spiccano Kurtava, Pieslaists e Mindaugas, tutti a
      spiccata acidità.


      Contigua a Teiči si estende la torbiera di Pelečāre. Sono due torbiere alte e di transizione raccordate
      naturalmente e cinte da foreste; assieme formano una zona umida fondamentale per la stabilità
      idrogeologica e climatica regionale: attenua le piene fluviali e preserva le falde nei periodi
      siccitosi. Le vecchie canalizzazioni artificiali sono state in gran parte neutralizzate da sbarramenti,
      castori e ricolmamento torboso.
    wildlife: >-
      È un comprensorio di eccezionale rilievo ornitologico. Costituisce un approdo primario di alimentazione
      e sosta per i migratori acquatici come per le specie stanziali, accogliendo gru e oche in enormi
      contingenti. Si annoverano 38 specie floristiche protette tra piante vascolari e felci, oltre a 24
      specie di muschi rari.


      Le cifre dei censimenti testimoniano l'importanza del biotopo: tra 30 e 45 coppie di
      [gru](/especie/grus_grus/) nidificano nella torbiera, e in autunno vi sostano fino a 2800 individui
      prima delle partenze. Nidificano da 34 a 91 coppie di [piviere dorato](/especie/pluvialis_apricaria/) e
      da 3 a 4 coppie di aquila anatraia minore. Una coppia di [aquila reale](/especie/aquila_chrysaetos/) è
      tornata a riprodursi nella riserva. Nelle arene di canto si registrano tra 20 e 40 maschi di urogallo e
      da 200 a 300 fagiani di monte. Al passo autunnale convergono stormi di oca granaiola e oca lombardella
      fino a 2000 esemplari contemporaneamente.
    visit: >-
      La visita non ammette improvvisazioni. Nell'area di riserva integrale sono consentite solo indagini
      scientifiche munite di appositi nulla osta. La zona ad accesso regolamentato è visitabile da giugno a
      ottobre con guida abilitata: si accede scortati dal personale della riserva a orari prestabiliti. Una
      torre d'avvistamento nel distretto di Krustpils è liberamente accessibile senza guida.
    history: >-
      Le torbiere sono zona Ramsar dal 1995 e fanno parte della rete Natura 2000. Già nel 1989 la riserva era
      inserita nell'inventario delle Important Bird Areas. Sull'isola minerale di Siksala risiede un piccolo
      nucleo di Vecchi Credenti russi, insediatisi nel XVII secolo per sfuggire alle persecuzioni religiose;
      sopravvivono quattro fattorie abitate a Siksala e una sull'isola di Mindaugas.
    before: >-
      Nella zona integrale è vietato l'accesso se non per scopi scientifici e di sorveglianza, mentre per la
      zona regolamentata serve l'autorizzazione dell'ente gestore. Sul percorso Sildas-Siksala si effettuano
      itinerari guidati nella stagione vegetativa. Informati preventivamente presso l'ente per concordare la
      prenotazione.
    around: >-
      Affinità per zone umide e contingenti di gru legano l'area al [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/) in Polonia e al [Parco Nazionale di
      Doñana](/lugar/parque-nacional-de-donana/) in Spagna; per il piviere dorato, al [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/) in Lettonia e a [The Flow Country](/lugar/the-flow-country/) in
      Scozia.
  pt:
    intro: >-
      A maior turfeira da Letónia permanece quase intocada, e para a explorar é imperativo contar com um guia
      oficial. A Reserva Natural de Teiči foi criada em 1982 para salvaguardar a turfeira de Teiči, entre as
      mais extensas da Letónia e de toda a bacia báltica, constituindo uma das quatro reservas naturais
      integrais do país: um estatuto rigoroso vocacionado para santuários desprovidos de presença humana. Dos
      seus 19.779 ha, 13.681 correspondem à turfeira alta propriamente dita.
    landscape: >-
      Teiči é essencialmente uma turfeira alta ombrotrófica, livre de perturbações agrícolas: o cenário
      reduz-se a água límpida, esfagno e amplos horizontes. No seio da turfeira abrigam-se 18 pequenas lagoas
      distróficas e ilhéus de terra firme, ocupando a floresta cerca de 3729 ha, sobretudo a norte. Entre as
      lagoas com mais de 2 ha de área destacam-se Kurtava, Pieslaists e Mindaugas, todas tipicamente
      distróficas.


      Contígua a Teiči estende-se a turfeira de Pelečāre. São duas turfeiras altas e de transição unidas de
      forma natural e cercadas por florestas, constituindo em conjunto uma zona húmida que estabiliza o clima
      regional e os caudais fluviais: atenua cheias sazonais e sustenta os níveis freáticos na estiagem. As
      valas de drenagem do passado viram os seus impactos anulados pela colonização de castores, diques de
      restauro e deposição de turfa.
    wildlife: >-
      Trata-se de um santuário ornitológico por excelência. Funciona como escala alimentar e dormitório
      primordial para aves aquáticas migradoras e sedentárias, reunindo grous e gansos em bandos compactos.
      Foram inventariadas 38 espécies protegidas de plantas vasculares e fetos, a par de 24 musgos raros.


      Os censos populacionais ilustram a magnitude do bioma: entre 30 e 45 casais de
      [grou-comum](/especie/grus_grus/) nidificam na turfeira, congregando-se no outono até 2800 aves antes de
      rumarem a sul. Reproduzem-se entre 34 e 91 casais de
      [tarambola-dourada-europeia](/especie/pluvialis_apricaria/), e de 3 a 4 casais de águia-pomarina. Um
      casal de [águia-real](/especie/aquila_chrysaetos/) restabeleceu a sua nidificação na reserva. Nas arenas
      nupciais cantam de 20 a 40 machos de tetraz-grande e de 200 a 300 galos-lira. Na passagem outonal cruzam
      a turfeira bandos de ganso-campestre e ganso-grande-de-testa-branca, alcançando 2000 aves em simultâneo.
    visit: >-
      A visitação não permite improvisos. No setor de reserva integral estrita apenas são autorizadas
      pesquisas científicas credenciadas. A zona de acesso regulado visita-se de junho a outubro com
      acompanhamento obrigatório de guias oficiais, integrando grupos conduzidos pelo pessoal da reserva em
      horários pré-definidos. Existe uma torre de observação no setor de Krustpils acessível sem guia.
    history: >-
      A turfeira é sítio Ramsar desde 1995 e integra a rede europeia Natura 2000. Em 1989 a reserva fora já
      incorporada na lista de Important Bird Areas. Na ilha florestada de Siksala reside um núcleo histórico
      de Velhos Crentes russos, fixados no século XVII em fuga a perseguições religiosas; subsistem quatro
      quintas tradicionais habitadas em Siksala e uma na ilha de Mindaugas.
    before: >-
      Na zona integral é terminantemente proibido permanecer exceto para investigação e vigilância, e na zona
      regulada é obrigatória a autorização da administração. No troço Sildas-Siksala organizam-se visitas
      pedestres guiadas durante a estação de crescimento vegetal. Confirma previamente as condições de reserva
      junto da entidade gestora.
    around: >-
      Com zonas húmidas e concentrações de grous em comum destacam-se o [Słowiński Park
      Narodowy](/lugar/slowinski-park-narodowy/) na Polónia e o [Parque Nacional de
      Doñana](/lugar/parque-nacional-de-donana/) em Espanha; com a tarambola-dourada, o [Ķemeru nacionālais
      parks](/lugar/kemeru-nacionalais-parks/) na Letónia e [The Flow Country](/lugar/the-flow-country/) na
      Escócia.
