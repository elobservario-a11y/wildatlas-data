resumen:
  es: >-
    Dunas móviles, bosques y humedales costeros donde observar la acción del viento sobre el litoral de
    Pomerania.
  en: >-
    Shifting coastal sand dunes, pine forests and shallow coastal lagoons sculpted by the wind along the
    Pomeranian Baltic shore.
  fr: >-
    Dunes mobiles, pinèdes et lagunes côtières où observer l’action continue du vent sur le littoral de
    Poméranie.
  de: >-
    Wanderdünen, Küstenwälder und Flachwasserlagunen an der pommerschen Ostseeküste, geformt von stetigem
    Seewind.
  it: >-
    Dune mobili, boschi costieri e lagune salmastre modellate dal vento lungo la costa baltica della
    Pomerania.
  pt: Dunas móveis, pinhais costeiros e lagoas litorais moldadas pelo vento na costa báltica da Pomerânia.
unico:
  es: 'Sus dunas no se están quietas: avanzan tierra adentro entre 3 y 10 metros al año.'
  en: 'Its dunes are in continuous motion: marching inland at a speed of between 3 and 10 metres every year.'
  fr: >-
    Ses dunes ne tiennent pas en place : elles avancent vers l’intérieur des terres au rythme de 3 à 10 mètres
    par an.
  de: 'Seine Dünen stehen niemals still: Sie wandern zwischen 3 und 10 Metern pro Jahr landeinwärts.'
  it: >-
    Le sue dune sono in perenne movimento: avanzano verso l’entroterra a una velocità compresa tra 3 e 10
    metri all’anno.
  pt: 'As suas dunas nunca estão paradas: avançam terra adentro a uma velocidade entre 3 e 10 metros por ano.'
observaciones:
  es: >-
    Consulta los avisos del parque y las condiciones de apertura de cada museo antes de fijar el itinerario.
    Dentro del parque solo se permite circular por los senderos señalizados, y el reglamento restringe el uso
    de drones a las excepciones previstas y a las autorizaciones del director. Las dunas exigen preparar bien
    la caminata. Rąbka y Rowy declaran adaptación parcial para personas con movilidad reducida; pregunta por
    las condiciones concretas.
texto:
  es:
    intro: >-
      Aquí el viento es el escultor. En la costa central de Polonia, en Pomerania, el Parque Nacional de
      Słowiński reúne en un mismo mosaico dunas que se desplazan, lagos que fueron bahías, bosques costeros,
      turberas y marismas. Más de la mitad de su superficie es agua: de sus 186,18 kilómetros cuadrados,
      102,13 son lagos y aguas, y 45,99 son bosque. Es un lugar para caminar por la arena, mirar aves y
      entender cómo se hace un paisaje.
    landscape: >-
      Todo empezó con una barra de arena. Las dunas interiores surgieron cuando la barra litoral aún no tenía
      vegetación, y desde entonces han pasado por muchas vidas. Las dunas se estabilizan cuando las cubre la
      vegetación y vuelven a moverse en nuevas fases de movilidad. El viento y las olas empujan la arena
      tierra adentro, a esos 3 a 10 metros por año, y a su paso van sepultando bosques y matando árboles. En
      el borde entre bosque y arena se ve la pugna: una duna cubierta de plantas y otra desnuda son dos
      momentos del mismo proceso.


      Los lagos también cuentan su historia. El Łebsko, con 71,40 kilómetros cuadrados, y el Gardno ocupan lo
      que antes eran bahías. Junto a ellos, el Dołgie Wielkie y el Dołgie Małe completan el sistema lacustre.
      Y el ámbito protegido llega hasta el mar, con una franja de aguas costeras someras del Báltico.


      Entre la playa y el pinar hay una sucesión que se puede leer de un vistazo. Las plantas pioneras que
      aparecen en la playa, como la oruga de mar y la honquenia, dan paso, tierra adentro, a plantas de duna
      como la grama de las arenas y, al final, a los pinares costeros con camarina. En las turberas sobrevive
      la mora de los pantanos, un relicto posglacial.


      La zona periférica del parque incluye además las reservas de Jałowce, Bagna Izbickie, Las Górkowski y
      Nowe Wicko, y parte de Mierzeja Sarbska. El clima, según Ramsar, es marítimo, con inviernos suaves,
      veranos moderadamente cálidos y mucha humedad en el aire.
    wildlife: >-
      El parque se halla en rutas migratorias, y eso explica sus cifras: las aves son el grupo más numeroso,
      con 257 especies. Primavera y otoño son épocas de paso de aves del norte, y algunas se quedan a pasar el
      invierno. Entre las más interesantes están el [pigargo](/especie/haliaeetus_albicilla/), el [búho
      real](/especie/bubo_bubo/) y los cisnes. El [correlimos gordo](/especie/calidris_canutus/) utiliza el
      parque durante los pasos migratorios, y en los humedales se citan el [tarro
      blanco](/especie/tadorna_tadorna/), el [ánsar común](/especie/anser_anser/) y la
      [grulla](/especie/grus_grus/).


      La costa tiene también su temporada. En invierno, las aguas del Báltico permiten ver colimbos chicos y
      éideres. Y al comienzo del otoño llega la berrea de los ciervos, que se observa en las extensas praderas
      del parque. Castor y [nutria](/especie/lutra_lutra/) están presentes en el parque, igual que mamíferos
      marinos como la marsopa y la foca gris, aunque nada de eso se deja ver fácilmente.
    visit: >-
      Solo se puede recorrer el parque por los senderos turísticos y educativos señalizados, y hay unos 140
      kilómetros. Junto a los lagos hay torres de observación, y por los senderos, bancos y lugares de
      descanso.


      Dos circuitos largos resumen el parque. El de Stara Łeba sale por el litoral, sube a la duna Łącka y
      regresa, con 15,10 kilómetros. El de Rowy pasa por Dołgie Małe y por la costa antes de volver al pueblo,
      con 16,40 kilómetros. Cada uno llena una jornada, y sobre arena se camina más despacio de lo que parece.


      Los museos ayudan a leer lo que ves. El museo del parque en Czołpino ocupa un antiguo asentamiento de
      fareros de 1871, y presenta naturaleza y cultura de la región; el faro de Czołpino admite visitas de
      mayo a septiembre y, en temporada baja, grupos concertados entre semana. Los grupos pueden solicitar
      visita con personal del parque, previa reserva. La filial de Rąbka tiene la exposición «Wydmy», que
      explica el origen de las dunas y su expansión, y está parcialmente adaptada para personas con movilidad
      reducida. La de Rowy, abierta en mayo de 2001 con motivo del aniversario del parque, presenta «Plaża –
      cztery pory roku», sobre los cambios de las playas a lo largo del año y sus aves. En julio y agosto abre
      a diario; el resto del año atiende actividades educativas concertadas entre semana.


      En la aldea de Kluki, un museo al aire libre muestra la vida de los eslovincios, el pueblo que da nombre
      al parque.


      Si llegas en transporte público, Czołpino y Kluki se conectan con Słupsk: el servicio a Czołpino es
      estacional y el de Kluki, anual. Rowy tiene conexión anual en autobús desde Ustka, y Smołdzino desde
      Słupsk.
    history: >-
      El parque se creó el 1 de enero de 1967 sobre 180,69 kilómetros cuadrados, y hoy es algo mayor. En 1977
      la UNESCO lo designó reserva de la biosfera y está incluido en la lista Ramsar.


      La gestión vigila también a las especies invasoras: el visón americano y el perro mapache se controlan
      para reducir la presión sobre las aves que crían en los humedales. Y una investigación de acceso abierto
      identificó noventa especies de trips en las comunidades vegetales estudiadas del parque; advierte de que
      el aumento de temperatura y la reducción de lluvias pueden alterar las plantas de las que se alimentan.
    before: >-
      Consulta los avisos del parque y las condiciones de apertura de cada museo antes de fijar el itinerario.
      Dentro del parque solo se permite circular por los senderos señalizados, y el reglamento restringe el
      uso de drones a las excepciones previstas y a las autorizaciones del director. Las dunas exigen preparar
      bien la caminata. Rąbka y Rowy declaran adaptación parcial para personas con movilidad reducida;
      pregunta por las condiciones concretas.
    around: >-
      El atlas no registra vecinos cercanos, pero sí costas y humedales lejanos con las mismas aves y
      mamíferos. El [Parque Nacional del Mar de Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) comparte correlimos gordo,
      marsopa y tarro blanco; el [Parque Nacional del Mar de Wadden
      (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/), éider, correlimos gordo y foca gris; las
      [Marismas Saladas del Mar de Frisia (Sector
      Neerlandés)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/), correlimos gordo, marsopa y foca
      gris; y el [Parque Nacional del Mar de Wadden de Baja
      Sajonia](/lugar/nationalpark-niedersachsisches-wattenmeer/), correlimos gordo, tarro blanco y foca gris.
  en:
    intro: >-
      Here the coastal wind is the master sculptor. On Poland’s central Baltic coast in Pomerania, Słowiński
      National Park preserves a shifting mosaic of mobile dunes, coastal lagoons that were once open sea bays,
      coastal pine forests, peat bogs and salt meadows. More than half of its territory is aquatic: of its
      186.18 square kilometres, 102.13 are lakes and open waters, and 45.99 are covered by woodland. It is a
      sublime landscape for walking across sand, watching migratory birds and observing coastal evolution in
      real time.
    landscape: >-
      Everything began with a dynamic sand spit. Inland dunes arose when the coastal barrier was still bare of
      vegetation, undergoing successive cycles of mobility and stabilization. Blown inland by prevailing winds
      and storm waves at rates of 3 to 10 metres per year, migrating dunes engulf mature pine forests in their
      path, leaving bleached dead stumps behind. Along the boundary between forest and shifting sand,
      stabilized vegetated dunes and barren wandering crests illustrate two phases of the same living dynamic.


      Coastal lagoons tell their own geological story. Lake Łebsko, spanning 71.40 square kilometres, and
      neighbouring Lake Gardno occupy drowned maritime bays cut off from the Baltic by sand bars. Together
      with Dołgie Wielkie and Dołgie Małe, they complete the lagoon system, complemented by a protected strip
      of shallow Baltic coastal waters.


      From the open beach to the interior pine forest, vegetation exhibits textbook coastal succession.
      Strandline pioneers like sea rocket and sea sandwort yield inland to marram grass on white dunes,
      transitioning into grey dune heaths and coastal crowberry-pine forests. Relict raised bogs preserve the
      cloudberry, a postglacial survivor.


      The park's buffer zone encompasses the nature reserves of Jałowce, Bagna Izbickie, Las Górkowski and
      Nowe Wicko, alongside part of Mierzeja Sarbska. The maritime climate brings mild winters, moderately
      warm summers and high atmospheric humidity.
    wildlife: >-
      Situated along major East Atlantic flyways, the park records impressive ornithological numbers: birds
      constitute the richest vertebrate group with 257 recorded species. Spring and autumn bring passage
      migrants from arctic breeding grounds, with many wintering offshore. Notable breeding and staging
      raptors include the [white-tailed eagle](/especie/haliaeetus_albicilla/) and [Eurasian
      eagle-owl](/especie/bubo_bubo/). The [red knot](/especie/calidris_canutus/) uses coastal shallows during
      migration, while lagoons host [common shelduck](/especie/tadorna_tadorna/), [greylag
      goose](/especie/anser_anser/) and [common crane](/especie/grus_grus/).


      Winter brings red-throated loons and common eiders onto the Baltic waters. Early autumn features the red
      deer rut, observed across vast coastal meadows. The Eurasian beaver and [Eurasian
      otter](/especie/lutra_lutra/) occur in quiet marshes, while harbour porpoises and grey seals
      occasionally frequent offshore waters.
    visit: >-
      Visitors must remain strictly on the network of designated hiking and educational trails, which totals
      about 140 kilometres. Observation towers overlook the lagoons, with resting benches along trails.


      Two classic long day hikes showcase the park. The Stara Łeba circuit follows the beach, climbs the
      mobile Łącka Dune and loops back over 15.10 kilometres. The Rowy circuit skirts Lake Dołgie Małe and
      returns along the coast covering 16.40 kilometres. Walking over soft sand takes considerably longer than
      expected, so allow a full day for either route.


      Park museums provide rich context. The main park museum in Czołpino occupies a historic 1871 lighthouse
      keeper settlement, exhibiting regional natural and cultural heritage; Czołpino Lighthouse is open from
      May to September. The Rąbka branch features the “Wydmy” exhibition on dune dynamics, partly adapted for
      visitors with reduced mobility. The Rowy branch, opened in May 2001, displays “Plaża – cztery pory roku”
      on beach seasonal rhythms and birdlife, open daily in July and August. In Kluki village, an open-air
      ethnographic museum preserves the culture of the indigenous Slovincians, after whom the park is named.


      Public buses connect Słupsk with Czołpino and Kluki, while Rowy has year-round bus connections from
      Ustka.
    history: >-
      Słowiński National Park was established on 1 January 1967 covering 180.69 square kilometres, slightly
      expanded since. In 1977 it was designated a UNESCO Biosphere Reserve and later a Ramsar wetland.


      Wildlife management monitors invasive species: feral American mink and raccoon dogs are controlled to
      protect ground-nesting wetland birds. Scientific studies have identified ninety species of thrips within
      park habitats, highlighting climate sensitivity.
    before: >-
      Check park notices and museum opening hours before setting out. Circulation is permitted exclusively on
      waymarked trails, and drone flights are prohibited without written authorization from the park director.
      Prepare appropriately for strenuous walking on loose sand. Inquire locally regarding specific accessible
      amenities at Rąbka and Rowy.
    around: >-
      While the park has no immediate neighbours in the atlas, distant Baltic and North Sea wetlands share
      migratory waders and coastal fauna: [Schleswig-Holstein Wadden Sea National
      Park](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (red knot, harbour porpoise and
      shelduck), [Wadden Sea National Park (Denmark)](/lugar/wadden-sea-national-park-dinamarca/) (eider, red
      knot and grey seal), [Wadden Sea Salt Marshes
      (Netherlands)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) (red knot, porpoise and seal) and
      [Lower Saxony Wadden Sea National Park](/lugar/nationalpark-niedersachsisches-wattenmeer/) (knot,
      shelduck and seal).
  fr:
    intro: >-
      Ici le vent est le sculpteur en chef. Sur le littoral de Poméranie, en Pologne, le parc national de
      Słowiński rassemble en un même ensemble mouvant dunes mobiles, lagunes côtières nées d'anciennes baies
      marines, pinèdes littorales, tourbières et prairies inondables. Plus de la moitié de sa superficie est
      aquatique : sur ses 186,18 kilomètres carrés, 102,13 sont occupés par les lacs et les eaux, et 45,99 par
      la forêt. C'est un espace grandiose pour fouler le sable fin, guetter les oiseaux migrateurs et
      comprendre la dynamique littorale.
    landscape: >-
      Tout a débuté par un cordon littoral sableux. Les dunes continentales sont nées alors que ce cordon
      était encore nu, et connaissent depuis des cycles alternés de mobilité et de fixation végétale. Poussées
      par le vent et les tempêtes à raison de 3 à 10 mètres par an, les crêtes de sable ensevelissent les
      forêts de pins sur leur passage. À la lisière entre bois et dunes mobiles, les monticules fixés par la
      végétation et les versants dénudés illustrent deux phases d'un même phénomène naturel.


      Les grands lacs racontent la même histoire : le lac Łebsko, d'une superficie de 71,40 kilomètres carrés,
      et le lac Gardno occupent d'anciennes baies marines isolées de la Baltique par les cordons dunaires.
      Avec le Dołgie Wielkie et le Dołgie Małe, ils composent un système lagunaire d'exception, prolongé en
      mer par une bande d'eaux côtières peu profondes.


      De la plage aux pinèdes, la zonation végétale se lit d'un regard. Le cakilier maritime et la honkénie
      pionniers laissent place à l'oyat des dunes blanches, puis à la lande à camarine et aux pinèdes
      maritimes. Les tourbières conservent la plaqueminier d'Europe ou ronce petit-mûrier, relique
      postglaciaire.


      La zone périphérique englobe les réserves de Jałowce, Bagna Izbickie, Las Górkowski et Nowe Wicko. Le
      climat maritime tempéré se caractérise par des hivers doux et une humidité atmosphérique élevée.
    wildlife: >-
      Le parc se situe sur un carrefour migratoire majeur, ce qui explique sa richesse ornithologique : les
      oiseaux forment le groupe dominant avec 257 espèces répertoriées. Le printemps et l'automne voient
      passer des milliers de migrateurs nordiques. Les rapaces comptent le [pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) et le [grand-duc d'Europe](/especie/bubo_bubo/). Le [bécasseau
      maubèche](/especie/calidris_canutus/) fait escale sur les vasières littorales, tandis que les lagunes
      accueillent le [tadorne de Belon](/especie/tadorna_tadorna/), l'[oie cendrée](/especie/anser_anser/) et
      la [grue cendrée](/especie/grus_grus/).


      En hiver, les eaux côtières de la Baltique hébergent plongeons catmarins et eiders à duvet. Au début de
      l'automne, le brame du cerf retentit sur les vastes prairies côtières. Le castor et la [loutre
      d'Europe](/especie/lutra_lutra/) fréquentent les zones humides, et le phoque gris apparaît parfois au
      large.
    visit: >-
      La découverte s'effectue exclusivement sur les sentiers touristiques balisés, qui totalisent environ 140
      kilomètres. Des observatoires bordent les lacs, avec bancs et aires de repos jalonnant les itinéraires.


      Deux grandes boucles pédestres résument le parc. Le circuit de Stara Łeba part le long du rivage, gravit
      la monumentale dune de Łącka et revient sur 15,10 kilomètres. Celui de Rowy longe le lac Dołgie Małe et
      la côte avant de revenir au bourg sur 16,40 kilomètres. La progression sur le sable étant éprouvante,
      prévoyez une journée complète pour chaque circuit.


      Les musées apportent un éclairage précieux. Le musée de Czołpino occupe une station de gardiens de phare
      de 1871 ; le phare de Czołpino se visite de mai à septembre. L'antenne de Rąbka propose l'exposition «
      Wydmy » sur l'avancée des sables, accessible aux personnes à mobilité réduite. Celle de Rowy, inaugurée
      en mai 2001, présente « Plaża – cztery pory roku » sur les oiseaux de rivage. À Kluki, un écomusée en
      plein air fait revivre les traditions des Slovéliens, peuple slave qui donna son nom au parc.


      Des lignes régulières d'autobus relient Słupsk à Czołpino et Kluki, et Rowy est desservi toute l'année
      depuis Ustka.
    history: >-
      Le parc national a été créé le 1 janvier 1967 sur 180,69 kilomètres carrés, légèrement étendu depuis.
      L'UNESCO l'a désigné réserve de biosphère en 1977, et le site est classé Ramsar.


      La gestion environnementale surveille les prédateurs introduits comme le vison d'Amérique et le chien
      viverrin afin de protéger les nichées au sol. Des inventaires scientifiques ont identifié
      quatre-vingt-dix espèces de thrips dans les prairies du parc, révélant la sensibilité des micro-habitats
      aux variations pluviométriques.
    before: >-
      Consultez les avis officiels du parc et les horaires des musées avant de partir. La circulation est
      cantonnée aux sentiers balisés et l'usage de drones est strictement réglementé. La marche sur les sables
      mouvants exige de bonnes chaussures et de l'eau en quantité. Renseignez-vous à Rąbka et Rowy sur les
      équipements adaptés aux personnes à mobilité réduite.
    around: >-
      Le parc ne compte pas de voisins immédiats dans l'atlas, mais partage des oiseaux côtiers et phoques
      avec d'autres rivages nordiques : le [parc national de la mer des Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (bécasseau maubèche,
      tadorne et marsouin), le [parc national de la mer des Wadden
      (Danemark)](/lugar/wadden-sea-national-park-dinamarca/) (eider, bécasseau et phoque gris), les [marais
      salés de la mer des Wadden néerlandaise](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) et le
      [parc national de Basse-Saxe](/lugar/nationalpark-niedersachsisches-wattenmeer/).
  de:
    intro: >-
      Hier ist der Küstenwind der Baumeister. An der zentralen Ostseeküste Polens in Pommern vereint der
      Słowiński-Nationalpark aktive Wanderdünen, abgeschnürte Strandseen, lichte Küstenwälder, Moore und
      Salzwiesen. Mehr als die Hälfte der Fläche ist Wasser: Von den 186,18 Quadratkilometern entfallen 102,13
      auf Seen und Gewässer und 45,99 auf Waldflächen. Es ist ein faszinierender Ort, um über weite Sandfelder
      zu wandern, Zugvögel zu beobachten und Küstendynamik unmittelbar zu erleben.
    landscape: >-
      Alles begann mit einer sandigen Nehrung. Die Binnendünen bildeten sich auf dem noch vegetationslosen
      Sandstreifen und durchliefen wechselnde Phasen von Festlegung und neuer Mobilität. Vom Wind mit 3 bis 10
      Metern pro Jahr landwärts getrieben, begraben die Wanderdünen auf ihrem Weg alte Küstenwälder unter
      sich. An der Nahtstelle zwischen Forst und Flugsand wird das Ringen sichtbar: Bewachsene Dünenkämme und
      nackte Sandberge spiegeln zwei Stadien desselben Prozesses wider.


      Auch die Strandseen zeugen von dieser Entstehung: Der Lebasee (Łebsko) mit 71,40 Quadratkilometern und
      der Garder See (Gardno) waren einst offene Meeresbuchten der Ostsee. Zusammen mit dem Dołgie Wielkie und
      Dołgie Małe bilden sie ein weites Lagunensystem, ergänzt durch einen marinen Küstenschutzstreifen im
      Flachwasser der Ostsee.


      Zwischen Strand und Kiefernwald lässt sich die Pflanzensukzession wie in einem Lehrbuch ablesen:
      Meersenf und Salzmiere am Spülsaum weichen landeinwärts Strandhafer auf den Weißdünen,
      Krähenbeerenheiden und windschiefen Kiefernwäldern. In den Mooren überdauert die Moltebeere als
      Kaltzeitrelikt.


      Die Schutzzone umfasst zudem die Naturschutzgebiete Jałowce, Bagna Izbickie, Las Górkowski und Nowe
      Wicko. Das Seeklima bringt milde Winter, mäßig warme Sommer und hohe Luftfeuchtigkeit.
    wildlife: >-
      Der Nationalpark liegt auf zentralen Zugvogelrouten, was die enorme Artenvielfalt erklärt: Vögel bilden
      mit 257 Arten die artenreichste Wirbeltiergruppe. Frühjahr und Herbst bringen dichten Durchzug
      arktischer Arten. Zu den Brut- und Rastvögeln gehören [Seeadler](/especie/haliaeetus_albicilla/) und
      [Uhu](/especie/bubo_bubo/). Der [Knutt](/especie/calidris_canutus/) rastet auf den Schlickflächen,
      während auf den Lagunenseen [Brandgans](/especie/tadorna_tadorna/), [Graugans](/especie/anser_anser/)
      und [Kranich](/especie/grus_grus/) nach Nahrung suchen.


      Im Winter rasten Sterntaucher und Eiderenten auf der offenen Ostsee. Zu Herbstanfang lässt sich auf den
      Wiesen die Brunft des Rothirsches beobachten. Biber und [Fischotter](/especie/lutra_lutra/) bewohnen die
      Feuchtgebiete; Schweinswale und Kegelrobben zeigen sich gelegentlich vor der Küste.
    visit: >-
      Das Wegenetz ist auf markierte touristische Pfade und Naturlehrpfade von rund 140 Kilometern Gesamtlänge
      beschränkt. Aussichtstürme stehen an den Seeufern bereit.


      Zwei große Rundwege erschließen die Hauptlandschaften. Der Rundweg ab Stara Łeba führt an der Ostsee
      entlang zur Lontzkedüne (Łącka) und über 15,10 Kilometer zurück. Die Route ab Rowy berührt den See
      Dołgie Małe und die Küste auf einer Strecke von 16,40 Kilometern. Das Gehen im tiefen Sand erfordert
      Kondition; plane für beide Runden einen vollen Tag ein.


      Die Museen vertiefen das Verständnis: Das Nationalparkmuseum in Czołpino befindet sich in einer
      Leuchtturmwärtersiedlung von 1871; der Leuchtturm Czołpino ist von Mai bis September geöffnet. Die
      Zweigstelle in Rąbka zeigt die Ausstellung „Wydmy“ zur Dünenentstehung und ist teilweise barrierefrei
      ausgebaut. Die Filiale in Rowy, eröffnet im Mai 2001, präsentiert „Plaża – cztery pory roku“ zu
      Stranddynamik und Vogelwelt. Im Museumsdorf Kluki veranschaulicht ein Freilichtmuseum das Leben der
      Slowinzen, nach denen der Park benannt ist.


      Linienbusse verbinden Słupsk mit Czołpino und Kluki; Rowy ist ganzjährig per Bus ab Ustka erreichbar.
    history: >-
      Der Nationalpark wurde am 1. Januar 1967 auf 180,69 Quadratkilometern gegründet und später erweitert. Im
      Jahr 1977 erklärte die UNESCO das Gebiet zum Biosphärenreservat; zudem ist er als Ramsar-Gebiet
      ausgewiesen.


      Das Wildtiermanagement reguliert invasive Beutegreifer wie Marderhund und Amerikanischen Nerz zum Schutz
      bodenbrütender Limikolen. Forscher wiesen neunzig Thripsarten in den Pflanzengesellschaften des Parks
      nach, was die Anfälligkeit der Mikrohabitate für Trockenperioden unterstreicht.
    before: >-
      Informiere dich vorab über Öffnungszeiten der Museen und behördliche Hinweise. Das Verlassen der
      markierten Pfade ist untersagt; Drohnenflüge bedürfen der schriftlichen Genehmigung der
      Nationalparkleitung. Nimm ausreichend Trinkwasser für die Wanderungen im tiefen Dünensand mit.
    around: >-
      Entfernte Schutzgebiete an Nord- und Ostsee teilen Küstenvögel und Meeressäuger mit Słowiński: der
      [Nationalpark Schleswig-Holsteinisches
      Wattenmeer](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (Knutt, Schweinswal und
      Brandgans), der [Nationalpark Vadehavet (Dänemark)](/lugar/wadden-sea-national-park-dinamarca/)
      (Eiderente, Knutt und Kegelrobbe), die [Salzwiesen des niederländischen
      Wattenmeers](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) und der [Nationalpark
      Niedersächsisches Wattenmeer](/lugar/nationalpark-niedersachsisches-wattenmeer/).
  it:
    intro: >-
      Qui il vento costiero è il grande scultore. Sulla costa baltica della Pomerania, in Polonia, il Parco
      Nazionale di Słowiński racchiude un paesaggio mobile di dune vive, lagune costiere nate da antiche baie
      marine, pinete litoranee, torbiere e paludi salmastre. Più della metà della sua superficie è coperta
      dall'acqua: dei suoi 186,18 chilometri quadrati, 102,13 sono laghi e specchi d'acqua e 45,99 sono
      occupati da boschi. È un ambiente straordinario per camminare sulla sabbia finissima, osservare le rotte
      migratorie e comprendere l'evoluzione delle coste.
    landscape: >-
      Tutto ebbe origine da un cordone litorale sabbioso. Le dune interne si formarono quando la barra
      costiera era ancora priva di vegetazione, attraversando cicli alternati di mobilità e fissazione. Spinte
      da venti e mareggiate a una velocità di 3 a 10 metri all'anno, le dune sommergono le pinete lungo il
      cammino, lasciando scheletri d'alberi disseccati. Al margine tra bosco e sabbia si osserva il contrasto:
      dune coperte di vegetazione pioniera e colline sabbiose nude rappresentano due fasi della medesima
      dinamica.


      Anche i laghi riflettono questa genesi: il lago Łebsko, con i suoi 71,40 chilometri quadrati, e il lago
      Gardno occupano insenature marine isolate dal mare dai cordoni di dune. Assieme a Dołgie Wielkie e
      Dołgie Małe compongono un vasto sistema lagunare, completato da una fascia di acque costiere basse del
      Baltico.


      Dalla spiaggia alle pinete interne la successione vegetale è nitida: il ravastrello marittimo e la
      saponaria dei lidi cedono il passo all'ammofila sulle dune bianche, poi alla landa a camerina e alle
      pinete litoranee. Nelle torbiere sopravvive il camemoro, relitto postglaciale.


      La fascia cuscinetto comprende le riserve di Jałowce, Bagna Izbickie, Las Górkowski e Nowe Wicko. Il
      clima marittimo presenta inverni miti, estati temperate e una costante umidità atmosferica.
    wildlife: >-
      Il parco sorge lungo importanti corridoi migratori nordici, come attestano le 257 specie di uccelli
      censite. Primavera e autunno sono periodi di intenso passo di volatili artici. Tra i rapaci nidificano
      l'[aquila di mare](/especie/haliaeetus_albicilla/) e il [gufo reale](/especie/bubo_bubo/). Il
      [piovanello maggiore](/especie/calidris_canutus/) frequenta le secche tidali, mentre nelle lagune
      sostano la [volpoca](/especie/tadorna_tadorna/), l'[oca selvatica](/especie/anser_anser/) e la [gru
      cenerina](/especie/grus_grus/).


      In inverno le acque del Baltico accolgono strolaghe minori ed edredoni. A inizio autunno si assiste al
      bramito dei cervi nelle vaste praterie costiere. Castoro e [lontra europea](/especie/lutra_lutra/)
      vivono nelle paludi, mentre focene e foche grigie transitano talora al largo.
    visit: >-
      Gli itinerari sono limitati alla rete di sentieri turistici e didattici segnalati, che si sviluppa per
      circa 140 chilometri. Torrette d'avvistamento sorgono sulle rive dei laghi, con punti di sosta
      distribuiti lungo i percorsi.


      Due lunghi itinerari circolari permettono di apprezzare il parco: il giro di Stara Łeba percorre la
      battigia, risale la duna mobile di Łącka e rientra lungo 15,10 chilometri; il percorso da Rowy costeggia
      il lago Dołgie Małe e il mare sviluppandosi per 16,40 chilometri. Camminare sulla sabbia richiede tempo
      ed energie; dedica un'intera giornata a ciascun anello.


      I centri visita approfondiscono la conoscenza: il museo di Czołpino occupa un borgo di guardiani del
      faro del 1871; il faro di Czołpino è aperto da maggio a settembre. La sede di Rąbka ospita la mostra
      «Wydmy» sulle dune, parzialmente accessibile. La struttura di Rowy, inaugurata nel maggio 2001, illustra
      la vita stagionale delle spiagge con «Plaża – cztery pory roku». A Kluki, un museo etnografico
      all'aperto documenta la civiltà degli slovinzi, popolazione autoctona da cui il parco prende il nome.


      Autobus collegano Słupsk con Czołpino e Kluki, mentre Rowy è collegata a Ustka tutto l'anno.
    history: >-
      Il parco nazionale è stato istituito il 1 gennaio 1967 su 180,69 chilometri quadrati, poi ampliato. Nel
      1977 l'UNESCO lo ha dichiarato riserva della biosfera ed è inserito nella lista delle zone umide Ramsar.


      La gestione forestale monitora predatori alloctoni come visone americano e cane procione per limitare i
      danni all'avifauna nidificante. Ricerche scientifiche hanno censito novanta specie di tisanotteri nei
      prati del parco, segnalando la vulnerabilità dei micro-ecosistemi ai cambiamenti climatici.
    before: >-
      Consulta gli avvisi dell'ente parco e gli orari dei musei prima di metterti in marcia. È severamente
      vietato uscire dai tracciati segnati e l'uso di droni è consentito solo con autorizzazione del
      direttore. Porta con te abbondante acqua per affrontare i lunghi tratti sulla sabbia.
    around: >-
      Il parco condivide avifauna costiera e mammiferi marini con altre coste basse del Mare del Nord: il
      [Parco Nazionale del Mar delle Wadden dello
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (piovanello maggiore,
      volpoca e focena), il [Parco Nazionale del Mar delle Wadden
      danese](/lugar/wadden-sea-national-park-dinamarca/) (edredone, piovanello e foca grigia), le [Barene del
      Mare dei Frisoni nei Paesi Bassi](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) e il [Parco
      Nazionale della Bassa Sassonia](/lugar/nationalpark-niedersachsisches-wattenmeer/).
  pt:
    intro: >-
      Aqui o vento costeiro é o escultor soberano. No litoral da Pomerânia, na Polónia, o Parque Nacional de
      Słowiński congrega um mosaico dinâmico de dunas móveis, lagoas costeiras que outrora foram enseadas
      marítimas, pinhais litorais, turfeiras e sapais. Mais de metade da sua área é aquática: dos seus 186,18
      quilómetros quadrados, 102,13 correspondem a lagos e planos de água e 45,99 a florestas. É um destino
      ímpar para caminhar sobre areias móveis, observar aves em migração e compreender a evolução litoral.
    landscape: >-
      Tudo principiou com uma restinga costeira de areia. As dunas interiores formaram-se quando a barra
      arenosa se encontrava desprovida de vegetação, conhecendo fases sucessivas de mobilidade e fixação.
      Empurradas pelo vento e tempestades a um ritmo de 3 a 10 metros por ano, as dunas soterram pinhais
      maduros na sua progressão, deixando para trás troncos desnudados. No limite entre o bosque e a areia
      revela-se o confronto: dunas estabilizadas por plantas e colinas móveis desprovidas de vegetação
      refletem duas fases da mesma dinâmica.


      As lagoas costeiras partilham a mesma génese: o lago Łebsko, com 71,40 quilómetros quadrados, e o lago
      Gardno ocupam antigas baías marinhas isoladas do Báltico por cordões dunares. Juntamente com o Dołgie
      Wielkie e o Dołgie Małe estruturam um vasto complexo lagunar, ladeado por uma faixa de águas marinhas
      pouco profundas.


      Da linha de praia aos pinhais interiores desenha-se uma nítida sucessão vegetal: a eruca-marítima
      pioneira dá lugar ao estorno nas dunas brancas, evoluindo para charnecas de camarinha e pinhais
      litorais. Nas turfeiras subsiste a amora-dos-pântanos, relíquia do período pós-glaciar.


      A zona tampão engloba as reservas de Jałowce, Bagna Izbickie, Las Górkowski e Nowe Wicko. O clima
      marítimo caracteriza-se por invernos amenos, verões temperados e elevada humidade.
    wildlife: >-
      O parque localiza-se numa rota migratória de primeira ordem, acolhendo 257 espécies de aves
      inventariadas. A primavera e o outono proporcionam intensa passagem de aves árticas. Entre as aves de
      rapina contam-se a [águia-rabalva](/especie/haliaeetus_albicilla/) e o [bufo-real](/especie/bubo_bubo/).
      A [seixoeira](/especie/calidris_canutus/) descansa nas praias e lodaçais durante as viagens migratórias,
      enquanto as lagoas abrigam o [pato-branco](/especie/tadorna_tadorna/), o
      [ganso-bravo](/especie/anser_anser/) e o [grou-comum](/especie/grus_grus/).


      No inverno as águas do Báltico recebem mobelhas-pequenas e êideres. No início do outono desenrola-se a
      brama dos veados nas pastagens costeiras. O castor e a [lontra-europeia](/especie/lutra_lutra/) habitam
      as zonas húmidas, avistando-se por vezes botos e focas-cinzentas ao largo.
    visit: >-
      A circulação é permitida unicamente na rede de trilhos pedestres e educativos sinalizados, que se
      estende por cerca de 140 quilómetros. Existem torres de observação junto aos lagos e áreas de descanso
      balizadas.


      Dois grandes circuitos pedestres evidenciam a diversidade do parque: o percurso de Stara Łeba segue pela
      praia, sobe a duna móvel de Łącka e regressa numa extensão de 15,10 quilómetros; o trilho de Rowy
      contorna o lago Dołgie Małe e a orla costeira cobrindo 16,40 quilómetros. Caminhar sobre areia fofa
      exige tempo e resistência; reserva um dia inteiro para cada caminhada.


      Os museus enriquecem a experiência: o museu central em Czołpino ocupa um antigo posto de faroleiros de
      1871; o farol de Czołpino abre de maio a setembro. A delegação de Rąbka acolhe a mostra «Wydmy» sobre a
      dinâmica das dunas, adaptada a mobilidade reduzida. O polo de Rowy, criado em maio de 2001, apresenta a
      exposição «Plaża – cztery pory roku» dedicada às praias e aves. Na aldeia de Kluki, um museu etnográfico
      ao ar livre evoca os eslovincios, povo que deu nome ao parque.


      Existem autocarros entre Słupsk e Czołpino ou Kluki, tendo Rowy ligações rodoviárias a partir de Ustka.
    history: >-
      O parque nacional foi criado a 1 de janeiro de 1967 com 180,69 quilómetros quadrados, tendo sofrido
      ampliações posteriores. Em 1977 a UNESCO classificou-o como Reserva da Biosfera, integrando igualmente a
      convenção Ramsar.


      A gestão de conservação monitoriza predadores invasores como o visão-americano e o cão-mapache para
      salvaguardar ninhos de aves limícolas. Estudos entomológicos registaram noventa espécies de tripes nos
      prados do parque, evidenciando a fragilidade das comunidades biológicas perante secas estivais.
    before: >-
      Consulta os avisos do parque e as condições de abertura de cada museu antes de fixar o itinerário. No
      interior do parque só é permitido circular pelos trilhos sinalizados, e o regulamento restringe o uso de
      drones às exceções previstas e a autorizações do diretor. As dunas exigem preparar bem a caminhada.
      Rąbka e Rowy declaram adaptação parcial para pessoas com mobilidade reduzida; informa-te sobre as
      condições concretas.
    around: >-
      O parque partilha avifauna de sapal e mamíferos marinhos com outros litorais do Mar do Norte: o [Parque
      Nacional do Mar de Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/) (seixoeira, pato-branco e
      boto), o [Parque Nacional do Mar de Wadden da Dinamarca](/lugar/wadden-sea-national-park-dinamarca/)
      (êider, seixoeira e foca-cinzenta), os [Sapais do Mar de Wadden
      Neerlandês](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) e o [Parque Nacional da Baixa
      Saxónia](/lugar/nationalpark-niedersachsisches-wattenmeer/).
