resumen:
  es: Lagunas salinas estacionales y secanos cerealistas de Tierra de Campos, con aves acuáticas y esteparias.
  en: Seasonal salt lagoons and dry cereal farmland in Tierra de Campos, with waterbirds and steppe birds.
  fr: >-
    Lagunes salées saisonnières et plaines céréalières sèches de la Tierra de Campos, avec oiseaux d'eau et
    oiseaux des steppes.
  de: Saisonale Salzlagunen und trockene Getreidefelder der Tierra de Campos mit Wasser- und Steppenvögeln.
  it: >-
    Lagune salate stagionali e campi cerealicoli asciutti della Tierra de Campos, con uccelli acquatici e di
    steppa.
  pt: Lagoas salinas sazonais e sequeiros cerealíferos da Tierra de Campos, com aves aquáticas e estepárias.
unico:
  es: >-
    Lagunas salinas que van y vienen con el agua y un secano cerealista que las abraza: aves de humedal y de
    estepa en el mismo horizonte.
  en: >-
    Salt lagoons that come and go with the water, and dry cereal farmland wrapped around them: wetland birds
    and steppe birds on the same horizon.
  fr: >-
    Des lagunes salées qui vont et viennent au gré de l'eau, et des cultures céréalières sèches qui les
    entourent : oiseaux des zones humides et oiseaux des steppes sur le même horizon.
  de: >-
    Salzlagunen, die mit dem Wasser kommen und gehen, und eine Getreidesteppe ringsum: Feuchtgebiets- und
    Steppenvögel am selben Horizont.
  it: >-
    Lagune salate che vanno e vengono con l'acqua e una distesa cerealicolta asciutta che le abbraccia:
    uccelli di zone umide e di steppa sullo stesso orizzonte.
  pt: >-
    Lagoas salinas que vão e vêm com a água e um sequeiro cerealífero que as abraça: aves de zona húmida e de
    estepe no mesmo horizonte.
observaciones:
  es: >-
    En invierno, algunos caminos pueden quedar intransitables para vehículos a motor; lleva ropa de abrigo.
    Desde Zamora, sigue la N-630 hacia Benavente y, pasada Granja de Moreruela, toma la ZA-701 hacia La
    Estación de la Tabla. Respeta las señales, los itinerarios y las zonas de acceso prohibido, y observa o
    fotografía desde los lugares señalizados. En las zonas de observación está prohibido llevar perros
    sueltos.
texto:
  es:
    intro: >-
      Hay lugares que cambian de cara con las estaciones, y Villafáfila es el caso extremo. En la Tierra de
      Campos zamorana, al noreste de la provincia, un complejo de lagunas temporales y salinas se rodea de una
      estepa cerealista de secano. En invierno, el agua; en verano, fondos cuarteados y costras de sal. Y
      alrededor, siempre, un campo abierto donde viven las aves que han hecho famosa a la reserva.
    landscape: >-
      Para entender Villafáfila hay que empezar por la sal. El complejo ocupa un valle desarrollado sobre una
      superficie de alteración del Mioceno. El agua subterránea sube a los niveles superiores y, por el
      camino, disuelve las sales que impregnan los sedimentos terciarios: por eso las lagunas son salinas.
      Parcialmente las drena el arroyo Salado.


      Salina Grande, Barillos y las Salinas son las lagunas principales, y todas son temporales. En verano la
      evaporación hace desaparecer el agua y los fondos aparecen cuarteados y cubiertos de una costra de sal.
      Después vuelve el invierno y el paisaje es otro. Alrededor de las lagunas crecen los prados salinos, que
      junto a ellas forman los ecosistemas de mayor riqueza botánica de la reserva. En los bordes lagunares y
      las praderas cercanas predomina el gramón; entre las plantas de los prados salinos están la escorzonera
      enana, el pelujo y el hinojillo de conejo, y en el humedal crece la castañuela.


      Más allá del agua manda la estepa cerealista. El intenso frío invernal y la sequía del verano
      condicionan una vegetación esteparia con escaso arbolado. El clima de Villafáfila es mediterráneo
      semiárido continental, y el paisaje lo refleja: horizontes largos, pocos árboles. La zona completa el
      cuadro con una arquitectura tradicional de tapial y adobe, la «cultura del barro».
    wildlife: >-
      Lo mejor de Villafáfila es que el calendario se puede seguir mes a mes.


      En marzo empieza el celo de la [avutarda](/especie/otis_tarda/), que continúa en abril. En mayo es época
      de cría del [cernícalo primilla](/especie/falco_naumanni/), y la colonia de la iglesia de Otero de
      Sariegos es especialmente llamativa. En primavera cobra interés la gran variedad de limícolas. Entre las
      aves nidificantes destacan la cigüeñuela, la [avoceta](/especie/recurvirostra_avosetta/) y el [aguilucho
      lagunero](/especie/circus_aeruginosus/). En verano, cuando el agua mengua, el observatorio de Revellinos
      permite ver concentraciones de anátidas en las lagunas de la Rosa y de la Fuente.


      Llega el otoño y noviembre es el mes de mayor concentración de [grullas](/especie/grus_grus/) en la
      reserva, con la llegada de los primeros [ánsares comunes](/especie/anser_anser/). En invierno son miles
      de ánsares y patos. Desde el observatorio de Otero de Sariegos se ven en invierno las entradas y salidas
      de los ánsares en la Laguna Grande. Entre las aves que usan el espacio solo en invernada o en paso se
      citan también el ánade friso, la cerceta común y la [espátula](/especie/platalea_leucorodia/).


      Y en el campo, la estepa conserva avutarda, cernícalo primilla, [aguilucho
      cenizo](/especie/circus_pygargus/), [sisón](/especie/tetrax_tetrax/) y ortega.
    visit: >-
      La Casa del Parque El Palomar, en Villafáfila, es el mejor comienzo. Su exposición explica por qué las
      lagunas son estacionales y por qué atraen tanto a las aves, y hay un audiovisual sobre el paisaje, sus
      habitantes, la vida cotidiana, la fauna y la flora. Personal con experiencia informa sobre la reserva.
      Desde el mirador tienes vista del Parque de Fauna, y a través de unos orificios puedes asomarte al
      interior del palomar; una cámara permite observar la vida de las aves en una de sus lagunas sin que se
      sientan observadas.


      Para caminar, la vuelta peatonal a la Laguna Grande mide 10 kilómetros y requiere unas tres horas. Es
      una senda circular que pasa por el observatorio de aves de Otero de Sariegos y por el puente romano de
      Villafáfila. Ese observatorio es el mejor punto para la Salina Grande, tiene telescopios de uso público
      y un aparcamiento donde dejar el coche para hacer el camino a pie. En invierno, esta senda permite
      buscar ánsares y patos; en primavera, limícolas.


      Si prefieres el coche, hay un itinerario por Tapioles, Revellinos, Villafáfila y Villarrín de Campos, de
      unas dos horas orientativas, que recorre las lagunas principales y la mejor zona esteparia para ver
      avutardas. Hay además observatorios junto a la laguna de la Rosa, en Revellinos, y a la de San Pedro, en
      Villarrín de Campos, donde un área temática al aire libre muestra con paneles la importancia de los
      humedales. Los dos itinerarios de la guía técnica se recomiendan para el invierno, cuando las lagunas
      tienen agua.
    history: >-
      La sal fue el gran atractivo de la zona para el ser humano: su extracción atrajo asentamientos del
      Calcolítico y de la Edad del Bronce. La laguna de las Salinas fue desecada en 1970, y la Junta de
      Castilla y León la recuperó en 1989.


      Las presiones no han desaparecido. Los datos de Ramsar identifican una colmatación creciente del
      humedal, y en el campo se relaciona la amenaza sobre las lagartijas con la pérdida de vegetación leñosa
      y linderos y con el uso de insecticidas.
    before: >-
      En invierno, algunos caminos pueden quedar intransitables para vehículos a motor; lleva ropa de abrigo.
      Desde Zamora, sigue la N-630 hacia Benavente y, pasada Granja de Moreruela, toma la ZA-701 hacia La
      Estación de la Tabla. Respeta las señales, los itinerarios y las zonas de acceso prohibido, y observa o
      fotografía desde los lugares señalizados. En las zonas de observación está prohibido llevar perros
      sueltos.
    around: >-
      El atlas no registra vecinos cercanos, pero sí estepas y humedales lejanos con las mismas aves. El
      [Parque Nacional Körös-Maros - Llanura de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) y el
      [Parque Nacional Fertő-Hanság - Estepa de Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) comparten
      con Villafáfila el aguilucho cenizo y la avutarda; la [Reserva Natural Especial Pastizales de Veliki
      Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) comparte la avutarda; y el [Parque Nacional
      Neusiedler See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/), el ánsar común.
  en:
    intro: >-
      Some places change their face with the seasons, and Villafáfila is the extreme case. In the Tierra de
      Campos of Zamora, in the north-east of the province, a complex of temporary salt lagoons is surrounded
      by a dry cereal steppe. In winter, water; in summer, cracked lakebeds and crusts of salt. And all
      around, always, open country where the birds that made the reserve famous live.
    landscape: >-
      To understand Villafáfila you have to start with the salt. The complex lies in a valley formed on a
      weathered Miocene surface. Groundwater rises to the upper layers and, on the way, dissolves the salts
      that impregnate the Tertiary sediments: that's why the lagoons are salty. They are partly drained by the
      Salado stream.


      Salina Grande, Barillos and Las Salinas are the main lagoons, and all of them are temporary. In summer,
      evaporation makes the water disappear and the lakebeds turn cracked and covered in a crust of salt. Then
      winter comes back and the landscape is a different one. Around the lagoons grow salt meadows, which
      together with them make up the botanically richest ecosystems in the reserve. On the lagoon edges and
      the nearby grasslands, a grass known locally as *gramón* dominates; among the plants of the salt meadows
      are those called *escorzonera enana*, *pelujo* and *hinojillo de conejo*, and in the wetland grows
      *castañuela*.


      Beyond the water, the cereal steppe rules. Bitter winter cold and summer drought shape a steppe
      vegetation with few trees. Villafáfila's climate is semi-arid continental Mediterranean, and the
      landscape shows it: long horizons, few trees. The area completes the picture with traditional
      rammed-earth and adobe architecture, the «mud culture».
    wildlife: >-
      The best thing about Villafáfila is that you can follow its calendar month by month.


      In March the display of the [great bustard](/especie/otis_tarda/) begins, and it carries on into April.
      May is the breeding season of the [lesser kestrel](/especie/falco_naumanni/), and the colony on the
      church of Otero de Sariegos is especially striking. In spring the great variety of waders comes into its
      own. Among the breeding birds, the black-winged stilt, the [avocet](/especie/recurvirostra_avosetta/)
      and the [marsh harrier](/especie/circus_aeruginosus/) stand out. In summer, when the water shrinks, the
      Revellinos hide lets you see gatherings of ducks and geese on the Rosa and Fuente lagoons.


      Then autumn arrives, and November is the month with the most [cranes](/especie/grus_grus/) in the
      reserve, along with the first [greylag geese](/especie/anser_anser/). In winter there are thousands of
      geese and ducks. From the Otero de Sariegos hide you can watch the geese flying in and out of the Laguna
      Grande in winter. Among the birds that use the area only in winter or on passage, the gadwall, the
      common teal and the [spoonbill](/especie/platalea_leucorodia/) are also recorded.


      And out in the fields, the steppe still holds great bustard, lesser kestrel, [Montagu's
      harrier](/especie/circus_pygargus/), [little bustard](/especie/tetrax_tetrax/) and black-bellied
      sandgrouse.
    visit: >-
      The Casa del Parque El Palomar visitor centre, in Villafáfila, is the best place to start. Its
      exhibition explains why the lagoons are seasonal and why they attract so many birds, and there's an
      audiovisual about the landscape, its people, daily life, wildlife and plants. Experienced staff give
      information about the reserve. From the viewpoint you look out over the wildlife park, and through some
      small openings you can peer inside the dovecote; a camera lets you watch the birds on one of its lagoons
      without them feeling watched.


      For walking, the footpath around the Laguna Grande is 10 kilometres long and takes about three hours.
      It's a circular path that passes the Otero de Sariegos bird hide and the Roman bridge of Villafáfila.
      That hide is the best spot for the Salina Grande, with telescopes for public use and a car park where
      you can leave the car and do the route on foot. In winter, this path lets you look for geese and ducks;
      in spring, waders.


      If you'd rather drive, there's a route through Tapioles, Revellinos, Villafáfila and Villarrín de
      Campos, taking roughly two hours, which covers the main lagoons and the best steppe area for seeing
      great bustards. There are also hides beside the Rosa lagoon, in Revellinos, and the San Pedro lagoon, in
      Villarrín de Campos, where an open-air themed area uses panels to show the importance of wetlands. The
      two routes in the technical guide are recommended for winter, when the lagoons hold water.
    history: >-
      Salt was the area's great draw for people: extracting it attracted Chalcolithic and Bronze Age
      settlements. The Las Salinas lagoon was drained in 1970, and the Junta de Castilla y León restored it in
      1989.


      The pressures haven't gone away. Ramsar data identify increasing silting-up of the wetland, and in the
      countryside the threat to lizards is linked to the loss of woody vegetation and field margins and to the
      use of insecticides.
    before: >-
      In winter, some tracks can become impassable for motor vehicles; bring warm clothes. From Zamora, follow
      the N-630 towards Benavente and, after Granja de Moreruela, take the ZA-701 towards La Estación de la
      Tabla. Respect the signs, the routes and the no-access areas, and watch or take photos from the
      signposted spots. Loose dogs are not allowed in the viewing areas.
    around: >-
      The atlas records no close neighbours, but it does list distant steppes and wetlands with the same
      birds. [Körös-Maros National Park - Dévaványa Plain](/lugar/koros-maros-nemzeti-park---devavanyai/) and
      [Fertő-Hanság National Park - Hanság Steppe](/lugar/ferto-hansag-nemzeti-park---hansag/) share Montagu's
      harrier and the great bustard with Villafáfila; the [Veliki Rit Pastures Special Nature
      Reserve](/lugar/specijalni-rezervat-prirode-pasnjaci/) shares the great bustard; and [Neusiedler See -
      Seewinkel National Park](/lugar/nationalpark-neusiedler-see-seewinkel/), the greylag goose.
  fr:
    intro: >-
      Certains lieux changent de visage avec les saisons, et Villafáfila en est le cas extrême. Dans la Tierra
      de Campos de Zamora, au nord-est de la province, un ensemble de lagunes temporaires et salées est
      entouré d'une steppe céréalière sèche. En hiver, l'eau ; en été, des fonds craquelés et des croûtes de
      sel. Et tout autour, toujours, une campagne ouverte où vivent les oiseaux qui ont fait la renommée de la
      réserve.
    landscape: >-
      Pour comprendre Villafáfila, il faut commencer par le sel. L'ensemble occupe une vallée formée sur une
      surface d'altération du Miocène. L'eau souterraine remonte vers les niveaux supérieurs et, en chemin,
      dissout les sels qui imprègnent les sédiments tertiaires : voilà pourquoi les lagunes sont salées. Le
      ruisseau Salado les draine en partie.


      Salina Grande, Barillos et Las Salinas sont les principales lagunes, et toutes sont temporaires. En été,
      l'évaporation fait disparaître l'eau et les fonds apparaissent craquelés, couverts d'une croûte de sel.
      Puis l'hiver revient et le paysage n'est plus le même. Autour des lagunes poussent des prés salés qui
      forment avec elles les écosystèmes les plus riches de la réserve sur le plan botanique. Sur les rives et
      dans les prairies voisines domine une graminée appelée localement *gramón* ; parmi les plantes des prés
      salés figurent celles qu'on nomme *escorzonera enana*, *pelujo* et *hinojillo de conejo*, et dans la
      zone humide pousse la *castañuela*.


      Au-delà de l'eau, c'est la steppe céréalière qui règne. Le froid intense de l'hiver et la sécheresse de
      l'été imposent une végétation steppique, presque sans arbres. Le climat de Villafáfila est méditerranéen
      semi-aride continental, et le paysage le reflète : de longs horizons, peu d'arbres. La région complète
      le tableau avec une architecture traditionnelle en pisé et en adobe, la « culture de la terre crue ».
    wildlife: >-
      Le meilleur de Villafáfila, c'est que son calendrier se suit mois par mois.


      En mars commence la parade de la [grande outarde](/especie/otis_tarda/), qui se poursuit en avril. En
      mai, c'est la reproduction du [faucon crécerellette](/especie/falco_naumanni/), et la colonie de
      l'église d'Otero de Sariegos est particulièrement spectaculaire. Au printemps, la grande variété de
      limicoles prend tout son intérêt. Parmi les oiseaux nicheurs, on remarque l'échasse blanche,
      l'[avocette](/especie/recurvirostra_avosetta/) et le [busard des roseaux](/especie/circus_aeruginosus/).
      En été, quand l'eau diminue, l'observatoire de Revellinos permet de voir des concentrations de canards
      et d'oies sur les lagunes de la Rosa et de la Fuente.


      Arrive l'automne, et novembre est le mois où les [grues](/especie/grus_grus/) sont les plus nombreuses
      dans la réserve, avec l'arrivée des premières [oies cendrées](/especie/anser_anser/). En hiver, ce sont
      des milliers d'oies et de canards. Depuis l'observatoire d'Otero de Sariegos, vous verrez en hiver les
      allées et venues des oies sur la Laguna Grande. Parmi les oiseaux qui n'utilisent le site qu'en
      hivernage ou en migration, on cite aussi le canard chipeau, la sarcelle d'hiver et la
      [spatule](/especie/platalea_leucorodia/).


      Et dans les champs, la steppe abrite toujours la grande outarde, le faucon crécerellette, le [busard
      cendré](/especie/circus_pygargus/), l'[outarde canepetière](/especie/tetrax_tetrax/) et le ganga
      unibande.
    visit: >-
      La Casa del Parque El Palomar, à Villafáfila, est le meilleur point de départ. Son exposition explique
      pourquoi les lagunes sont saisonnières et pourquoi elles attirent autant d'oiseaux, et un audiovisuel
      présente le paysage, ses habitants, la vie quotidienne, la faune et la flore. Un personnel expérimenté
      renseigne sur la réserve. Depuis le belvédère, vous avez vue sur le parc animalier et, par de petites
      ouvertures, vous pouvez jeter un œil à l'intérieur du pigeonnier ; une caméra permet d'observer la vie
      des oiseaux sur l'une de ses lagunes sans qu'ils se sentent observés.


      Pour marcher, le tour pédestre de la Laguna Grande mesure 10 kilomètres et demande environ trois heures.
      C'est un sentier en boucle qui passe par l'observatoire d'oiseaux d'Otero de Sariegos et par le pont
      romain de Villafáfila. Cet observatoire est le meilleur point pour la Salina Grande ; il dispose de
      télescopes à l'usage du public et d'un parking où laisser la voiture pour faire le chemin à pied. En
      hiver, ce sentier permet de chercher oies et canards ; au printemps, les limicoles.


      Si vous préférez la voiture, un itinéraire passe par Tapioles, Revellinos, Villafáfila et Villarrín de
      Campos, en deux heures environ, et parcourt les principales lagunes et la meilleure zone de steppe pour
      voir les outardes. Il existe aussi des observatoires près de la lagune de la Rosa, à Revellinos, et de
      celle de San Pedro, à Villarrín de Campos, où un espace thématique en plein air montre avec des panneaux
      l'importance des zones humides. Les deux itinéraires du guide technique sont recommandés en hiver, quand
      les lagunes sont en eau.
    history: >-
      Le sel a été le grand attrait de la région pour l'être humain : son extraction a attiré des
      établissements du Chalcolithique et de l'âge du bronze. La lagune de Las Salinas a été asséchée en 1970,
      et la Junta de Castilla y León l'a restaurée en 1989.


      Les pressions n'ont pas disparu. Les données Ramsar signalent un comblement croissant de la zone humide,
      et dans les champs on relie la menace qui pèse sur les lézards à la disparition de la végétation
      ligneuse et des haies, ainsi qu'à l'usage d'insecticides.
    before: >-
      En hiver, certains chemins peuvent devenir impraticables pour les véhicules à moteur ; prévoyez des
      vêtements chauds. Depuis Zamora, suivez la N-630 vers Benavente et, après Granja de Moreruela, prenez la
      ZA-701 vers La Estación de la Tabla. Respectez la signalisation, les itinéraires et les zones interdites
      d'accès, et observez ou photographiez depuis les endroits signalés. Dans les zones d'observation, les
      chiens en liberté sont interdits.
    around: >-
      L'atlas ne recense pas de voisins proches, mais il signale des steppes et des zones humides lointaines
      avec les mêmes oiseaux. Le [parc national de Körös-Maros - plaine de
      Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) et le [parc national de Fertő-Hanság - steppe
      de Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) partagent avec Villafáfila le busard cendré et la
      grande outarde ; la [réserve naturelle spéciale des pâturages de Veliki
      Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) partage la grande outarde ; et le [parc national du
      Neusiedler See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/), l'oie cendrée.
  de:
    intro: >-
      Es gibt Orte, die mit den Jahreszeiten ihr Gesicht wechseln, und Villafáfila ist der Extremfall. In der
      Tierra de Campos von Zamora, im Nordosten der Provinz, liegt ein Komplex aus temporären Salzlagunen
      inmitten einer trockenen Getreidesteppe. Im Winter Wasser; im Sommer rissige Seeböden und Salzkrusten.
      Und ringsum stets eine offene Landschaft, in der die Vögel leben, die das Reservat berühmt gemacht
      haben.
    landscape: >-
      Um Villafáfila zu verstehen, muss man beim Salz anfangen. Der Komplex liegt in einem Tal auf einer
      miozänen Verwitterungsfläche. Grundwasser steigt in die oberen Schichten auf und löst unterwegs die
      Salze, die die tertiären Sedimente durchtränken: Deshalb sind die Lagunen salzhaltig. Teilweise
      entwässert sie der Bach Arroyo Salado.


      Salina Grande, Barillos und Las Salinas sind die Hauptlagunen, und alle sind temporär. Im Sommer lässt
      die Verdunstung das Wasser verschwinden, und die Böden liegen rissig und von einer Salzkruste bedeckt
      da. Dann kehrt der Winter zurück, und die Landschaft ist eine andere. Um die Lagunen wachsen Salzwiesen,
      die zusammen mit ihnen die botanisch reichsten Ökosysteme des Reservats bilden. An den Lagunenrändern
      und auf den nahen Wiesen dominiert das Hundszahngras (*gramón*); zu den Pflanzen der Salzwiesen zählen
      Zwerg-Schwarzwurzel, *pelujo* und *hinojillo de conejo*, und im Feuchtgebiet wächst Strand-Simse
      (*castañuela*).


      Jenseits des Wassers herrscht die Getreidesteppe. Strenge Winterkälte und Sommerdürre prägen eine
      Steppenvegetation mit wenig Baumbestand. Das Klima von Villafáfila ist semiarid-kontinental mediterran,
      und die Landschaft zeigt es: weite Horizonte, kaum Bäume. Abgerundet wird das Bild durch eine
      traditionelle Architektur aus Stampflehm und Adobe, die «Lehmkultur».
    wildlife: >-
      Das Beste an Villafáfila ist, dass man dem Kalender Monat für Monat folgen kann.


      Im März beginnt die Balz der [Großtrappe](/especie/otis_tarda/), die sich bis in den April zieht. Im Mai
      ist Brutzeit des [Rötelfalken](/especie/falco_naumanni/), und die Kolonie an der Kirche von Otero de
      Sariegos ist besonders eindrucksvoll. Im Frühling wird die große Vielfalt an Watvögeln spannend. Unter
      den Brutvögeln fallen Stelzenläufer, [Säbelschnäbler](/especie/recurvirostra_avosetta/) und
      [Rohrweihe](/especie/circus_aeruginosus/) auf. Im Sommer, wenn das Wasser schwindet, lassen sich vom
      Beobachtungsstand Revellinos Entenansammlungen auf den Lagunen de la Rosa und de la Fuente beobachten.


      Es kommt der Herbst, und der November ist der Monat mit den meisten [Kranichen](/especie/grus_grus/) im
      Reservat, begleitet von den ersten [Graugänsen](/especie/anser_anser/). Im Winter sind es Tausende von
      Gänsen und Enten. Vom Beobachtungsstand Otero de Sariegos sieht man im Winter die Ein- und Ausflüge der
      Gänse an der Laguna Grande. Zu den Arten, die das Gebiet nur im Winter oder auf dem Zug nutzen, zählen
      auch Schnatterente, Krickente und [Löffler](/especie/platalea_leucorodia/).


      Und draußen auf den Feldern bewahrt die Steppe Großtrappe, Rötelfalke,
      [Wiesenweihe](/especie/circus_pygargus/), [Zwergtrappe](/especie/tetrax_tetrax/) und Sandflughuhn.
    visit: >-
      Die Casa del Parque El Palomar in Villafáfila ist der beste Ausgangspunkt. Ihre Ausstellung erklärt,
      warum die Lagunen saisonal sind und so viele Vögel anziehen, dazu gibt es einen Film über Landschaft,
      Bewohner, Alltag, Tier- und Pflanzenwelt. Erfahrenes Personal informiert über das Reservat. Vom
      Aussichtspunkt blickst du auf den Tierpark, und durch kleine Öffnungen kannst du ins Innere des
      Taubenschlags schauen; eine Kamera ermöglicht es, das Leben der Vögel an einer der Lagunen zu
      beobachten, ohne dass sie sich beobachtet fühlen.


      Zum Wandern misst der Rundweg um die Laguna Grande 10 Kilometer und dauert etwa drei Stunden. Er führt
      am Vogelbeobachtungsstand Otero de Sariegos und an der Römerbrücke von Villafáfila vorbei. Dieser Stand
      ist der beste Punkt für die Salina Grande, bietet öffentliche Spektive und einen Parkplatz, an dem du
      das Auto für die Wanderung abstellen kannst. Im Winter kannst du auf diesem Weg nach Gänsen und Enten
      suchen, im Frühling nach Watvögeln.


      Wenn du lieber fährst, gibt es eine Autoroute über Tapioles, Revellinos, Villafáfila und Villarrín de
      Campos von etwa zwei Stunden Richtzeit, die die Hauptlagunen und das beste Steppengebiet für Großtrappen
      abdeckt. Weitere Stände stehen an der Laguna de la Rosa in Revellinos und an der Laguna de San Pedro in
      Villarrín de Campos, wo ein Themenbereich im Freien mit Tafeln die Bedeutung der Feuchtgebiete zeigt.
      Beide Routen des Fachführers empfehlen sich für den Winter, wenn die Lagunen Wasser führen.
    history: >-
      Salz war für den Menschen der große Anreiz der Gegend: Seine Gewinnung zog Siedlungen der Kupfer- und
      Bronzezeit an. Die Laguna de las Salinas wurde 1970 trockengelegt, und die Junta de Castilla y León
      stellte sie 1989 wieder her.


      Die Belastungen sind nicht verschwunden. Die Ramsar-Daten verzeichnen eine zunehmende Verlandung des
      Feuchtgebiets, und im Offenland wird die Gefährdung der Eidechsen mit dem Verlust von Gehölzen und
      Feldrainen sowie dem Einsatz von Insektiziden in Verbindung gebracht.
    before: >-
      Im Winter können manche Wege für Kraftfahrzeuge unpassierbar werden; nimm warme Kleidung mit. Folge ab
      Zamora der N-630 Richtung Benavente und biege hinter Granja de Moreruela auf die ZA-701 Richtung La
      Estación de la Tabla ab. Achte auf Schilder, Routen und Sperrzonen und beobachte oder fotografiere von
      den ausgewiesenen Stellen aus. In den Beobachtungszonen ist das Mitführen freilaufender Hunde verboten.
    around: >-
      Der Atlas verzeichnet keine nahen Nachbarn, wohl aber ferne Steppen und Feuchtgebiete mit denselben
      Vögeln. Der [Nationalpark Körös-Maros - Ebene von
      Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) und der [Nationalpark Fertő-Hanság - Steppe
      von Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) teilen mit Villafáfila Wiesenweihe und
      Großtrappe; das [Spezielle Naturreservat Weideland Veliki
      Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) teilt die Großtrappe; und der [Nationalpark
      Neusiedler See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/) die Graugans.
  it:
    intro: >-
      Ci sono luoghi che cambiano volto con le stagioni, e Villafáfila è il caso estremo. Nella Tierra de
      Campos di Zamora, a nord-est della provincia, un complesso di lagune temporanee e salate è circondato da
      una steppa cerealicola asciutta. D'inverno l'acqua; d'estate fondi screpolati e croste di sale. E tutto
      intorno, sempre, una campagna aperta dove vivono gli uccelli che hanno reso celebre la riserva.
    landscape: >-
      Per capire Villafáfila bisogna partire dal sale. Il complesso occupa una valle formatasi su una
      superficie di alterazione del Miocene. L'acqua sotterranea risale verso i livelli superiori e, lungo il
      percorso, scioglie i sali che impregnano i sedimenti terziari: per questo le lagune sono salate. In
      parte le drena il torrente Salado.


      Salina Grande, Barillos e Las Salinas sono le lagune principali, e tutte sono temporanee. D'estate
      l'evaporazione fa sparire l'acqua e i fondi appaiono screpolati e coperti da una crosta di sale. Poi
      torna l'inverno e il paesaggio è un altro. Intorno alle lagune crescono i prati salini, che insieme a
      esse formano gli ecosistemi di maggiore ricchezza botanica della riserva. Sui margini lagunari e nei
      prati vicini domina la gramigna (*gramón*); tra le piante dei prati salini ci sono la scorzonera nana,
      il *pelujo* e il *hinojillo de conejo*, e nella zona umida cresce il giunco marino (*castañuela*).


      Oltre l'acqua comanda la steppa cerealicola. Il freddo intenso invernale e la siccità estiva
      condizionano una vegetazione steppica con scarsa presenza arborea. Il clima di Villafáfila è
      mediterraneo semiarido continentale e il paesaggio lo riflette: orizzonti lunghi, pochi alberi. Completa
      il quadro un'architettura tradizionale in terra battuta e adobe, la «cultura del fango».
    wildlife: >-
      Il bello di Villafáfila è che il calendario si può seguire mese per mese.


      A marzo inizia il corteggiamento dell'[otarda](/especie/otis_tarda/), che prosegue ad aprile. A maggio è
      il periodo di nidificazione del [grillaio](/especie/falco_naumanni/), e la colonia sulla chiesa di Otero
      de Sariegos è particolarmente suggestiva. In primavera diventa protagonista la grande varietà di
      limicoli. Tra gli uccelli nidificanti spiccano il cavaliere d'Italia,
      l'[avocetta](/especie/recurvirostra_avosetta/) e il [falco di palude](/especie/circus_aeruginosus/).
      D'estate, quando l'acqua cala, l'osservatorio di Revellinos permette di vedere concentrazioni di anatidi
      nelle lagune della Rosa e della Fuente.


      Arriva l'autunno e novembre è il mese di maggiore concentrazione di [gru](/especie/grus_grus/) nella
      riserva, con l'arrivo delle prime [oche selvatiche](/especie/anser_anser/). D'inverno sono migliaia di
      oche e anatre. Dall'osservatorio di Otero de Sariegos si vedono in inverno gli ingressi e le uscite
      delle oche nella Laguna Grande. Tra gli uccelli che usano l'area solo in svernamento o di passo si
      segnalano anche la canapiglia, l'alzavola e la [spatola](/especie/platalea_leucorodia/).


      E nei campi, la steppa conserva otarda, grillaio, [albanella minore](/especie/circus_pygargus/),
      [gallina prataiola](/especie/tetrax_tetrax/) e ganga.
    visit: >-
      La Casa del Parque El Palomar, a Villafáfila, è il punto migliore da cui iniziare. La sua mostra spiega
      perché le lagune sono stagionali e perché attirano così tanti uccelli, e c'è un audiovisivo sul
      paesaggio, i suoi abitanti, la vita quotidiana, la fauna e la flora. Personale esperto informa sulla
      riserva. Dal belvedere si ha vista sul Parco della Fauna, e attraverso alcuni fori ci si può affacciare
      all'interno della colombaia; una telecamera permette di osservare la vita degli uccelli in una delle
      lagune senza che si sentano osservati.


      Per camminare, il giro a piedi della Laguna Grande misura 10 chilometri e richiede circa tre ore. È un
      sentiero circolare che passa per l'osservatorio di uccelli di Otero de Sariegos e per il ponte romano di
      Villafáfila. Quell'osservatorio è il punto migliore per la Salina Grande, dispone di cannocchiali a uso
      pubblico e di un parcheggio dove lasciare l'auto per fare il percorso a piedi. D'inverno questo sentiero
      permette di cercare oche e anatre; in primavera, limicoli.


      Se preferisci l'auto, c'è un itinerario per Tapioles, Revellinos, Villafáfila e Villarrín de Campos, di
      circa due ore indicative, che percorre le lagune principali e la migliore zona steppica per vedere
      otarde. Ci sono inoltre osservatori presso la laguna della Rosa, a Revellinos, e quella di San Pedro, a
      Villarrín de Campos, dove un'area tematica all'aperto mostra con pannelli l'importanza delle zone umide.
      I due itinerari della guida tecnica sono consigliati per l'inverno, quando le lagune hanno acqua.
    history: >-
      Il sale fu la grande attrattiva della zona per l'uomo: la sua estrazione attirò insediamenti del
      Calcolitico e dell'Età del Bronzo. La laguna di Las Salinas fu prosciugata nel 1970 e la Junta de
      Castilla y León la recuperò nel 1989.


      Le pressioni non sono scomparse. I dati Ramsar segnalano un interramento crescente della zona umida, e
      nelle campagne la minaccia alle lucertole è collegata alla perdita di vegetazione legnosa e margini dei
      campi e all'uso di insetticidi.
    before: >-
      D'inverno alcune strade sterrate possono diventare impraticabili per i veicoli a motore; porta abiti
      pesanti. Da Zamora segui la N-630 verso Benavente e, superata Granja de Moreruela, imbocca la ZA-701
      verso La Estación de la Tabla. Rispetta i cartelli, gli itinerari e le zone vietate, e osserva o
      fotografa dai punti segnalati. Nelle aree di osservazione è vietato portare cani sciolti.
    around: >-
      L'atlante non registra vicini prossimi, ma steppe e zone umide lontane con gli stessi uccelli. Il [Parco
      Nazionale Körös-Maros - Pianura di Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) e il [Parco
      Nazionale Fertő-Hanság - Steppa di Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) condividono con
      Villafáfila l'albanella minore e l'otarda; la [Riserva Naturale Speciale Pascoli di Veliki
      Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) condivide l'otarda; e il [Parco Nazionale Neusiedler
      See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/), l'oca selvatica.
  pt:
    intro: >-
      Há lugares que mudam de rosto com as estações, e Villafáfila é o caso extremo. Na Tierra de Campos
      zamorana, a nordeste da província, um complexo de lagoas temporárias e salinas rodeia-se de uma estepe
      cerealífera de sequeiro. No inverno, a água; no verão, fundos gretados e crostas de sal. E em redor,
      sempre, um campo aberto onde vivem as aves que tornaram a reserva famosa.
    landscape: >-
      Para entender Villafáfila é preciso começar pelo sal. O complexo ocupa um vale desenvolvido sobre uma
      superfície de alteração do Miocénico. A água subterrânea sobe até aos níveis superiores e, pelo caminho,
      dissolve os sais que impregnam os sedimentos terciários: por isso as lagoas são salinas. Parcialmente
      são drenadas pelo ribeiro Salado.


      Salina Grande, Barillos e Las Salinas são as lagoas principais, e todas são temporárias. No verão a
      evaporação faz desaparecer a água e os fundos surgem gretados e cobertos por uma crosta de sal. Depois
      volta o inverno e a paisagem é outra. Em redor das lagoas crescem os prados salinos, que em conjunto
      formam os ecossistemas de maior riqueza botânica da reserva. Nas margens lagunares e pradarias próximas
      predomina o *gramón*; entre as plantas dos prados salinos estão a escorzoneira-anã, o *pelujo* e o
      *hinojillo de conejo*, e na zona húmida cresce a *castañuela*.


      Para lá da água manda a estepe cerealífera. O frio intenso invernal e a seca estival condicionam uma
      vegetação estepária com escasso arvoredo. O clima de Villafáfila é mediterrânico semiárido continental,
      e a paisagem reflete-o: horizontes longos, poucas árvores. A zona completa o quadro com uma arquitetura
      tradicional de taipa e adobe, a «cultura do barro».
    wildlife: >-
      O melhor de Villafáfila é que o calendário pode seguir-se mês a mês.


      Em março começa o cio da [abetarda-comum](/especie/otis_tarda/), que continua em abril. Em maio é época
      de criação do [peneireiro-das-torres](/especie/falco_naumanni/), e a colónia da igreja de Otero de
      Sariegos é especialmente vistosa. Na primavera ganha interesse a grande variedade de limícolas. Entre as
      aves nidificantes destacam-se o perna-longa, o [alfaiate](/especie/recurvirostra_avosetta/) e o
      [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/). No verão, quando a água mingua, o
      observatório de Revellinos permite ver concentrações de anatídeos nas lagoas da Rosa e da Fuente.


      Chega o outono e novembro é o mês de maior concentração de [grous-comuns](/especie/grus_grus/) na
      reserva, com a chegada dos primeiros [gansos-bravos](/especie/anser_anser/). No inverno são milhares de
      gansos e patos. A partir do observatório de Otero de Sariegos veem-se no inverno as entradas e saídas
      dos gansos na Laguna Grande. Entre as aves que usam o espaço apenas em invernada ou de passagem citam-se
      também a frisada, a marrequinha-comum e o [colhereiro-europeu](/especie/platalea_leucorodia/).


      E no campo, a estepe conserva abetarda-comum, peneireiro-das-torres,
      [tartaranhão-caçador](/especie/circus_pygargus/), [sisão](/especie/tetrax_tetrax/) e
      cortiçol-de-barriga-preta.
    visit: >-
      A Casa del Parque El Palomar, em Villafáfila, é o melhor ponto de partida. A sua exposição explica por
      que razão as lagoas são sazonais e por que atraem tantas aves, e há um audiovisual sobre a paisagem, os
      seus habitantes, o quotidiano, a fauna e a flora. Pessoal experiente informa sobre a reserva. Do
      miradouro tens vista para o Parque de Fauna, e através de uns orifícios podes espreitar o interior do
      pombal; uma câmara permite observar a vida das aves numa das lagoas sem que se sintam observadas.


      Para caminhar, a volta pedonal à Laguna Grande mede 10 quilómetros e requer cerca de três horas. É um
      trilho circular que passa pelo observatório de aves de Otero de Sariegos e pela ponte romana de
      Villafáfila. Esse observatório é o melhor ponto para a Salina Grande, tem telescópios de uso público e
      um parque de estacionamento onde deixar o carro para fazer o percurso a pé. No inverno, este trilho
      permite procurar gansos e patos; na primavera, limícolas.


      Se preferires o carro, há um itinerário por Tapioles, Revellinos, Villafáfila e Villarrín de Campos, de
      cerca de duas horas orientativas, que percorre as lagoas principais e a melhor zona estepária para ver
      abetardas. Há ainda observatórios junto à lagoa da Rosa, em Revellinos, e à de San Pedro, em Villarrín
      de Campos, onde uma área temática ao ar livre mostra com painéis a importância das zonas húmidas. Os
      dois itinerários do guia técnico recomendam-se para o inverno, quando as lagoas têm água.
    history: >-
      O sal foi o grande atrativo da zona para o ser humano: a sua extração atraiu povoados do Calcolítico e
      da Idade do Bronze. A lagoa das Salinas foi drenada em 1970, e a Junta de Castilla y León recuperou-a em
      1989.


      As pressões não desapareceram. Os dados de Ramsar identificam um assoreamento crescente da zona húmida,
      e no campo relaciona-se a ameaça sobre as lagartixas com a perda de vegetação lenhosa e estremas e com o
      uso de inseticidas.
    before: >-
      No inverno, alguns caminhos podem ficar intransitáveis para veículos motorizados; leva roupa quente. A
      partir de Zamora, segue a N-630 rumo a Benavente e, passada Granja de Moreruela, toma a ZA-701 para La
      Estación de la Tabla. Respeita os sinais, os itinerários e as zonas de acesso proibido, e observa ou
      fotografa a partir dos locais sinalizados. Nas zonas de observação é proibido levar cães soltos.
    around: >-
      O atlas não regista vizinhos próximos, mas sim estepes e zonas húmidas distantes com as mesmas aves. O
      [Parque Nacional Körös-Maros - Planície de Dévaványa](/lugar/koros-maros-nemzeti-park---devavanyai/) e o
      [Parque Nacional Fertő-Hanság - Estepe de Hanság](/lugar/ferto-hansag-nemzeti-park---hansag/) partilham
      com Villafáfila o tartaranhão-caçador e a abetarda-comum; a [Reserva Natural Especial Pastagens de
      Veliki Rit](/lugar/specijalni-rezervat-prirode-pasnjaci/) partilha a abetarda-comum; e o [Parque
      Nacional Neusiedler See - Seewinkel](/lugar/nationalpark-neusiedler-see-seewinkel/), o ganso-bravo.
