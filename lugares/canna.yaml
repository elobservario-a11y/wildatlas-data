resumen:
  es: >-
    Propiedad del National Trust for Scotland, célebre por Compass Hill (colina de basalto con magnetita que
    altera las brújulas de los barcos).
  en: >-
    Owned by the National Trust for Scotland, famed for Compass Hill, a basalt hill containing magnetite that
    distorts passing ship compasses.
  fr: >-
    Propriété du National Trust for Scotland, célèbre pour Compass Hill (colline de basalte et magnétite
    déviant les compas des navires).
  de: >-
    Eigentum des National Trust for Scotland, berühmt für Compass Hill (Basalthügel mit Magnetit, der
    Schiffskompasse ablenkt).
  it: >-
    Proprietà del National Trust for Scotland, celebre per Compass Hill (collina basaltica ricca di magnetite
    che svia le bussole delle navi).
  pt: >-
    Propriedade do National Trust for Scotland, célebre por Compass Hill (colina de basalto e magnetite que
    desvia as bússolas dos navios).
unico:
  es: >-
    Una isla donde la brújula se tuerce, los frailecillos anidan sobre acantilados de basalto y un archivo de
    canciones gaélicas descansa en una casa grande.
  en: >-
    An island where the compass needle swerves, puffins nest on basalt cliffs, and an invaluable archive of
    Gaelic song rests in a Georgian manor.
  fr: >-
    Une île où la boussole s'affole, les macareux nichent sur des orgues basaltiques et un trésor de chants
    gaéliques repose dans un manoir.
  de: >-
    Eine Insel, auf der die Kompassnadel ausschlägt, Papageitaucher auf Basaltklippen nisten und ein gälisches
    Liedarchiv in einem Herrenhaus ruht.
  it: >-
    Un'isola dove la bussola impazzisce, i pulcinella di mare nidificano su scogliere basaltiche e un archivio
    di canti gaelici riposa in una dimora storica.
  pt: >-
    Uma ilha onde a agulha da bússola se desvia, os papagaios-do-mar nidificam em arribas basálticas e um
    espólio de canções gaélicas repousa num solar.
observaciones:
  es: En Canna no hay cobertura móvil y las carreteras no están asfaltadas.
texto:
  es:
    intro: >-
      Cerca de Canna la brújula miente. Compass Hill, en el borde oriental de la isla, tiene tanto hierro que
      desvía las agujas de los barcos y las hace apuntar a la colina en vez de al norte. Canna es la más
      occidental de las Small Isles, en las Hébridas Interiores: 6,9 km de largo por 1,6 km de ancho, unida a
      Sanday por un camino y por bancos de arena en marea baja. Los dueños anteriores la legaron al National
      Trust for Scotland en 1981, y se gestiona como granja y área de conservación.
    landscape: >-
      Canna es fuego enfriado. Su geología es una secuencia en capas de coladas de basalto del Paleoceno, de
      la Canna Lava Formation, y se nota en el paisaje: pisos de columnas de basalto en la mitad este y
      acantilados que dominan la costa norte. El punto más alto es Càrn a' Ghaill, «la colina rocosa de la
      tormenta», a 210 m, y Compass Hill, de 139 m, es de toba volcánica.


      Entre Canna y Sanday se forma un puerto natural, el único de aguas profundas de las Small Isles y muy
      usado por los veleros de la costa oeste. En Compass Hill se buscan brezo, orquídea de las Hébridas y
      prímula silvestre.
    wildlife: >-
      Hay más de veinte mil aves marinas reproductoras, y el mejor consejo es mirar hacia el mar. Canna es
      famosa por sus águilas marinas, águilas reales y frailecillos, y también se han visto halcones
      peregrinos y esmerejones; en los acantilados pueden verse las águilas marinas y las reales junto a las
      aves marinas. El [águila marina](/especie/haliaeetus_albicilla/) y el [águila
      real](/especie/aquila_chrysaetos/) comparten cielo con el [frailecillo](/especie/fratercula_arctica/),
      la [alca común](/especie/alca_torda/) y el [arao](/especie/uria_aalge/).


      El año de las aves tiene su historia reciente. Las ratas pardas amenazaban a las [pardelas
      pichonetas](/especie/puffinus_puffinus/); se ordenó exterminarlas y, a finales de 2006, se consideraba
      que Canna estaba libre de ratas. Aumentaron los frailecillos y las alcas que crían, y las pardelas
      pichonetas anidaron por primera vez desde 1997. Antes del control, se retiró una población de ratones,
      que se cree subespecie rara y distinta del ratón de campo, para protegerla.


      En el mar, el tramo entre Canna y Rùm es un lugar para buscar ballenas y delfines, con avistamientos
      frecuentes de [rorcuales aliblancos](/especie/balaenoptera_acutorostrata/). En la bahía protegida
      descansan [focas grises](/especie/halichoerus_grypus/) y [focas comunes](/especie/phoca_vitulina/),
      sobre todo en los tranquilos meses de invierno. La mejor época va de mayo a septiembre, y de mayo a
      agosto el programa de ciencia ciudadana invita a enviar imágenes de frailecillos que llevan comida a sus
      pollos.
    visit: >-
      Se llega en el ferry MV Lochnevis, que une Canna con Rùm, Eigg, Muck y el puerto continental de Mallaig,
      a dos horas y media. Para desembarcar vehículos hace falta permiso del National Trust.


      La ruta Canna Bay Walk parte del muelle, dura hora y media y discurre mayormente llana y protegida del
      viento. Compass Hill también empieza en el muelle y requiere una hora y media; el ascenso ofrece una
      alternativa más suave por el lado derecho. El Puffin Trail empieza junto a St Edward’s Church, dura dos
      horas y llega a la colonia estacional de frailecillos de Puffin Stacks, en Sanday. Por el camino, el
      brezal marino acoge orquídeas de las Hébridas, orugas, mariposas y polillas, y en el brezal de Sanday se
      pueden observar agachadizas, alondras y avefrías, además de skúas, cormoranes, araos y alcas.
    history: >-
      Canna lleva ocupada desde el Neolítico: está llena de fragmentos de cerámica y de unas pocas bodegas
      excavadas en el suelo, aún misteriosas. Los restos de la Edad del Bronce incluyen cabañas circulares y
      antiguos muros de campo, y en la Edad del Hierro se levantó el fuerte de Dun Channa. En Keill hay dos
      grandes cruces celtas muy decoradas de los siglos VIII-IX, que indican la presencia de un monasterio.
      Según la leyenda, a quien se portaba mal le encajaban el pulgar en un agujero de la «piedra del
      castigo», un menhir de Keill.


      Los vikingos dejaron su huella en topónimos como sgor, gearaid (cercado), tota (granja) y Sanday («isla
      de arena»). Después llegó la pobreza: tras el auge del kelp, en 1821 varios habitantes emigraron a
      Canadá, y en 1847, al fallar las cosechas, desalojaron a la población de Keill, el asentamiento
      principal, para poner ovejas. En 1938 John Lorne Campbell compró Canna y la organizó como granja y
      reserva natural. Canna House guarda hoy los archivos de Shaw y Campbell sobre literatura, folclore y
      canciones populares en gaélico escocés.


      La mayor parte de Canna está protegida como SSSI por su importancia geográfica y biológica. Tras
      erradicar las ratas hubo una plaga de conejos, que dañaban monumentos arqueológicos y huertos; al año
      siguiente se mataron 9 000 de los 16 000 estimados.
    before: En Canna no hay cobertura móvil y las carreteras no están asfaltadas.
    around: >-
      La [Isle of Rum National Nature Reserve](/lugar/isle-of-rum-national-nature-reserve/) está a unos 6 km,
      al otro lado del tramo de mar donde se buscan ballenas y delfines.
  en:
    intro: >-
      Near Canna, compasses lie. Compass Hill, perched on the island's eastern fringe, holds so much magnetic
      iron ore that it deflects shipboard needles, drawing them toward the rock instead of magnetic north.
      Canna is the westernmost of the Small Isles in the Inner Hebrides: 6.9 km long by 1.6 km wide, linked to
      neighboring Sanday by a footbridge and tidal sands at low water. Its previous owners gifted it to the
      National Trust for Scotland in 1981, and it is run as a working farm and nature reserve.
    landscape: >-
      Canna is ancient fire turned cold. Its bedrock comprises a stepped sequence of Paleocene basalt lava
      flows of the Canna Lava Formation, evident across the island: tiers of columnar basalt along the eastern
      shore and sheer cliffs plunging into the northern Atlantic. The highest point is Càrn a' Ghaill, "the
      rocky hill of the storm", at 210 m, while Compass Hill rises to 139 m of weathered volcanic tuff.


      Between Canna and Sanday lies a natural sheltered harbour, the only deep-water haven in the Small Isles
      and heavily frequented by west-coast cruising yachts. On the slopes of Compass Hill, walkers seek out
      bell heather, Hebridean spotted-orchids, and wild primroses.
    wildlife: >-
      More than twenty thousand breeding seabirds crowd the sea cliffs, and the finest vantage is always
      toward the waves. Canna is celebrated for white-tailed eagles, golden eagles, and Atlantic puffins,
      alongside peregrine falcons and merlins; along the bluffs raptors hunt within sight of seabird colonies.
      The [white-tailed eagle](/especie/haliaeetus_albicilla/) and [golden eagle](/especie/aquila_chrysaetos/)
      share the skies with the [Atlantic puffin](/especie/fratercula_arctica/),
      [razorbill](/especie/alca_torda/), and [common murre](/especie/uria_aalge/).


      The bird colonies have a striking recent recovery story. Introduced brown rats once preyed heavily on
      nesting [Manx shearwaters](/especie/puffinus_puffinus/); a total eradication was launched, and by late
      2006 Canna was declared rat-free. Breeding puffins and razorbills rebounded, and Manx shearwaters nested
      successfully for the first time since 1997. Ahead of baiting, an endemic population of wood
      mice—regarded as a distinct island subspecies—was temporarily removed to safety.


      Offshore, the Sound of Canna between Canna and Rùm is a renowned corridor for cetaceans, with frequent
      encounters of [minke whales](/especie/balaenoptera_acutorostrata/). In the sheltered bay, [grey
      seals](/especie/halichoerus_grypus/) and [harbour seals](/especie/phoca_vitulina/) haul out on skerries,
      particularly during tranquil winter months. The optimum season spans May to September, and from May to
      August a citizen-science puffin monitoring initiative encourages visitors to photograph puffins bringing
      fish to burrows.
    visit: >-
      Access is aboard the CalMac ferry MV Lochnevis, linking Canna with Rùm, Eigg, Muck, and the mainland
      port of Mallaig in two and a half hours. Bringing private vehicles onto the island requires prior
      permission from the National Trust.


      The Canna Bay Walk departs directly from the pier, takes an hour and a half, and provides an easy,
      low-level walk sheltered from winds. The hike up Compass Hill also sets off from the pier, taking about
      an hour and a half; the ascent offers an easier zig-zag path along the right-hand shoulder. The Puffin
      Trail starts beside St Edward’s Church, requires two hours, and leads out to the seasonal puffin
      breeding colony on the Puffin Stacks of Sanday. Along the path, coastal heathland hosts Hebridean
      orchids, caterpillars, butterflies, and day-flying moths, while Sanday’s moorland provides sightings of
      common snipe, skylarks, lapwings, great skuas, cormorants, and auks.
    history: >-
      Canna has been inhabited since Neolithic times, yielding ceramic shards and enigmatic subterranean
      souterrains. Bronze Age remains feature hut circles and field boundaries, followed in the Iron Age by
      the promontory fort of Dun Channa. At Keill, two richly carved Celtic high crosses dating from the
      VIII-IX centuries testify to an early monastic foundation. Local folklore recounts that offenders had
      their thumb wedged into a socket on the Punishment Stone, an ancient standing stone at Keill.


      Viking settlers left deep toponymic imprints such as sgor (sea-stack), gearaid (enclosure), tota
      (homestead), and Sanday ("sand island"). Economic hardship followed: following the kelp boom, in 1821
      many islanders emigrated to Canada, and in 1847, following potato crop failures, the inhabitants of
      Keill were evicted to make way for sheep grazing. In 1938 folklorist John Lorne Campbell purchased Canna
      and managed it as a farm and sanctuary. Canna House preserves the Campbell and Shaw archives of Scottish
      Gaelic literature, folklore, and song.


      Most of Canna is designated a Site of Special Scientific Interest (SSSI). Following rat eradication,
      rabbit numbers exploded, undermining archaeological earthworks and vegetable gardens; the following year
      some 9,000 rabbits were culled out of an estimated 16,000.
    before: Canna has no mobile network coverage and roads are entirely unpaved gravel tracks.
    around: >-
      The [Isle of Rum National Nature Reserve](/lugar/isle-of-rum-national-nature-reserve/) lies some 6 km
      across the sound, overlooking the waters where whales and dolphins surface.
  fr:
    intro: >-
      Près de Canna, la boussole ment. Compass Hill, à la pointe orientale de l'île, renferme tant de fer
      magnétique que la colline dévie les aiguilles des navires, les faisant pointer vers le roc au lieu du
      nord. Canna est la plus occidentale des Small Isles, dans les Hébrides intérieures : 6,9 km de long sur
      1,6 km de large, reliée à Sanday par une passerelle et un cordon de sable à marée basse. Les anciens
      propriétaires l'ont léguée au National Trust for Scotland en 1981, et elle est gérée comme une
      exploitation agricole et un sanctuaire naturel.
    landscape: >-
      Canna est un feu refroidi. Sa géologie est un empilement de coulées de basalte du Paléocène appartenant
      à la formation des laves de Canna, ce qui se lit dans le paysage : gradins d'orgues basaltiques sur la
      moitié est et falaises abruptes dominant la côte nord. Le point culminant est Càrn a' Ghaill, « la
      colline rocheuse de la tempête », à 210 m, tandis que Compass Hill, à 139 m, est faite de tufs
      volcaniques.


      Entre Canna et Sanday s'abrite un port naturel, le seul en eau profonde des Small Isles et escale
      privilégiée des voiliers de la côte ouest. Sur Compass Hill poussent bruyères, orchidées des Hébrides et
      primevères sauvages.
    wildlife: >-
      On compte plus de vingt mille oiseaux marins nicheurs, et le meilleur conseil reste de scruter le large.
      Canna est réputée pour ses pygargues à queue blanche, aigles royaux et macareux moines, côtoyant faucons
      pèlerins et émerillons ; sur les corniches rocheuses, les rapaces chassent à proximité des colonies
      marines. Le [pygargue à queue blanche](/especie/haliaeetus_albicilla/) et l'[aigle
      royal](/especie/aquila_chrysaetos/) partagent le ciel avec le [macareux
      moine](/especie/fratercula_arctica/), le [pingouin torda](/especie/alca_torda/) et le [guillemot de
      Troïl](/especie/uria_aalge/).


      L'avifaune a connu un sauvetage retentissant. Les surmulots décimaient les [puffins des
      Anglais](/especie/puffinus_puffinus/) ; une campagne d'éradication fut menée et, fin 2006, Canna fut
      déclarée exempte de rats. Macareux et pingouins se sont multipliés, et les puffins des Anglais ont niché
      avec succès pour la première fois depuis 1997. Préalablement, une population insulaire de mulots
      sylvestres avait été mise à l'abri pour préserver cette sous-espèce particulière.


      En mer, le détroit entre Canna et Rùm est un passage privilégié pour guetter cétacés et dauphins, avec
      de fréquents passages de [petits rorquals](/especie/balaenoptera_acutorostrata/). Dans la baie abritée
      se prélassent [phoques gris](/especie/halichoerus_grypus/) et [veaux marins](/especie/phoca_vitulina/),
      surtout durant la quiétude hivernale. La meilleure période s'étend de mai à septembre, et de mai à août
      un suivi participatif invite à photographier les macareux nourrissant leurs poussins.
    visit: >-
      On y accède à bord du ferry MV Lochnevis, reliant Canna à Rùm, Eigg, Muck et au port continental de
      Mallaig en deux heures et demie. Débarquer des véhicules nécessite une autorisation préalable du
      National Trust.


      La randonnée Canna Bay Walk part de l'embarcadère, dure une heure et demie et longe un terrain plat
      abrité du vent. Compass Hill démarre également de la jetée et demande une heure et demie ; la montée
      offre une variante plus douce sur le flanc droit. Le Puffin Trail commence près de St Edward’s Church,
      dure deux heures et mène à la colonie estivale de macareux de Puffin Stacks sur Sanday. En chemin, la
      lande maritime abrite orchidées des Hébrides, chenilles et papillons, tandis que la lande de Sanday
      donne à voir bécassines, alouettes, vanneaux, grands labbes et guillemots.
    history: >-
      Canna est habitée depuis le Néolithique : elle recèle tessons de céramique et souterrains creusés dans
      le tuf encore mystérieux. L'âge du bronze a laissé des cabanes circulaires et de vieux murets, et à
      l'âge du fer fut édifié le fort de Dun Channa. À Keill se dressent deux grandes croix celtiques
      sculptées des siècles VIII-IX, témoignant d'un antique monastère. La tradition veut que l'on coinçait le
      pouce des coupables dans la pierre du châtiment, un menhir de Keill.


      Les Vikings ont laissé leur empreinte dans des noms comme sgor, gearaid (enclos), tota (ferme) et Sanday
      (« île de sable »). Puis vint la pauvreté : après le déclin de l'exploitation du varech, plusieurs
      insulaires émigrèrent au Canada en 1821, et en 1847, après la faillite des récoltes, les habitants de
      Keill furent expulsés pour faire place aux moutons. En 1938, John Lorne Campbell acheta Canna pour en
      faire une ferme et un sanctuaire. Canna House abrite aujourd'hui les archives Shaw et Campbell de
      littérature, folklore et chants populaires en gaélique écossais.


      La quasi-totalité de Canna est protégée comme site d'intérêt scientifique particulier (SSSI). Après la
      disparition des rats survint une pullulation de lapins, dégradant les sites archéologiques ; l'année
      suivante, 9 000 des 16 000 lapins estimés furent prélevés.
    before: Il n'y a aucune couverture de téléphonie mobile à Canna et les chemins ne sont pas goudronnés.
    around: >-
      La [Isle of Rum National Nature Reserve](/lugar/isle-of-rum-national-nature-reserve/) s'étend à environ
      6 km, de l'autre côté du bras de mer où l'on observe baleines et dauphins.
  de:
    intro: >-
      In der Nähe von Canna lügt der Kompass. Compass Hill am Ostrand der Insel birgt so viel Magnetit, dass
      die Nadeln vorbeifahrender Schiffe abgelenkt werden und zum Hügel statt nach Norden zeigen. Canna ist
      die westlichste der Small Isles in den Inneren Hebriden: 6,9 km lang und 1,6 km breit, bei Ebbe über
      eine Brücke und Sandbänke mit Sanday verbunden. Die früheren Eigentümer vermachten sie 1981 dem National
      Trust for Scotland, der sie als Farm und Naturschutzgebiet führt.
    landscape: >-
      Canna ist erstarrtes Feuer. Das Gestein besteht aus geschichteten Basaltlavaströmen des Paläozäns aus
      der Canna-Lava-Formation, was die Landschaft prägt: Basaltsäulenstufen im Osten und Klippen entlang der
      Nordküste. Der höchste Punkt ist Càrn a' Ghaill, „der felsige Hügel des Sturms“, mit 210 m; Compass Hill
      mit 139 m besteht aus Vulkantuff.


      Zwischen Canna und Sanday liegt ein natürlicher Tiefwasserhafen, der einzige der Small Isles, der gern
      von Seglern der Westküste angelaufen wird. An den Hängen des Compass Hill blühen Heidekraut,
      Hebriden-Knabenkraut und wilde Primeln.
    wildlife: >-
      Über zwanzigtausend Seevögel brüten hier, und der beste Rat lautet, den Blick aufs Meer zu richten.
      Canna ist bekannt für Seeadler, Steinadler und Papageitaucher; auch Wanderfalken und Merline jagen an
      den Klippen. Der [Seeadler](/especie/haliaeetus_albicilla/) und der
      [Steinadler](/especie/aquila_chrysaetos/) teilen sich den Himmel mit
      [Papageitaucher](/especie/fratercula_arctica/), [Tordalk](/especie/alca_torda/) und
      [Trottellumme](/especie/uria_aalge/).


      Die Seevogelkolonien blicken auf eine erfolgreiche Rettung zurück. Eingeschleppte Wanderratten bedrohten
      den [Atlantiksturmtaucher](/especie/puffinus_puffinus/); nach einer Tilgungskampagne galt Canna Ende
      2006 als rattenfrei. Die Brutbestände von Papageitauchern und Tordalken erholten sich, und
      Atlantiksturmtaucher brüteten erstmals seit 1997 wieder erfolgreich. Vor den Maßnahmen wurde eine
      Waldmauspopulation als endemische Unterart vorübergehend in Sicherheit gebracht.


      Auf See ist der Sund zwischen Canna und Rùm ein bekannter Korridor für Wale und Delphine mit
      regelmäßigen Sichtungen von [Zwergwalen](/especie/balaenoptera_acutorostrata/). In der geschützten Bucht
      ruhen [Kegelrobben](/especie/halichoerus_grypus/) und [Seehunde](/especie/phoca_vitulina/), besonders in
      den ruhigen Wintermonaten. Die beste Reisezeit reicht von Mai bis September; von Mai bis August ruft ein
      Citizen-Science-Projekt dazu auf, Fotos von Papageitauchern mit Futter im Schnabel einzusenden.
    visit: >-
      Die Anreise erfolgt mit der CalMac-Fähre MV Lochnevis, die Canna mit Rùm, Eigg, Muck und dem
      Festlandhafen Mallaig in zweieinhalb Stunden verbindet. Die Mitnahme von Fahrzeugen bedarf einer
      Genehmigung des National Trust.


      Der Canna Bay Walk startet am Pier, dauert anderthalb Stunden und verläuft windgeschützt und flach. Die
      Wanderung auf den Compass Hill beginnt ebenfalls am Pier und beansprucht anderthalb Stunden; auf der
      rechten Schulter gibt es einen sanfteren Anstieg. Der Puffin Trail beginnt an der St Edward’s Church,
      dauert zwei Stunden und führt zur Brutkolonie an den Puffin Stacks auf Sanday. Am Wegesrand gedeihen
      Hebriden-Orchideen, und in den Heiden Sandays lassen sich Bekassinen, Lerchen, Kiebitze, Skuas und
      Alkenvögel beobachten.
    history: >-
      Canna ist seit der Jungsteinzeit besiedelt: Keramikscherben und geheimnisvolle unterirdische Souterrains
      zeugen davon. Aus der Bronzezeit stammen Rundhütten und Feldgrenzen, in der Eisenzeit entstand das
      Promontory Fort Dun Channa. In Keill stehen zwei reich verzierte keltische Hochkreuze aus den
      Jahrhunderten VIII-IX, die auf ein frühes Kloster hindeuten. Der Legende nach wurde Sündern der Daumen
      in ein Loch des Punishment Stone geklemmt, einem Menhir bei Keill.


      Die Wikinger hinterließen Spuren in Ortsnamen wie sgor (Klippe), gearaid (Gehege), tota (Hofstelle) und
      Sanday („Sandinsel“). Später folgte Armut: Nach dem Niedergang der Seetangaschegewinnung wanderten 1821
      Bewohner nach Kanada aus, und 1847 wurden nach Missernten die Menschen von Keill vertrieben, um Platz
      für Schafe zu machen. 1938 erwarb John Lorne Campbell Canna und bewirtschaftete sie als Farm und
      Naturschutzgebiet. Canna House birgt die Sammlungen von Campbell und Shaw zu gälischer Literatur,
      Folklore und Volksliedern.


      Der Großteil Cannas ist als SSSI ausgewiesen. Nach der Rattenbeseitigung kam es zu einer Kaninchenplage,
      die archäologische Denkmäler beschädigte; im Folgejahr wurden 9 000 der geschätzten 16 000 Kaninchen
      erlegt.
    before: Auf Canna gibt es keinen Mobilfunkempfang und die Wege sind unbefestigte Schotterpisten.
    around: >-
      Das [Nationale Naturreservat Isle of Rum](/lugar/isle-of-rum-national-nature-reserve/) liegt rund 6 km
      entfernt auf der anderen Seite des Sunds, wo Wale und Delphine beobachtet werden.
  it:
    intro: >-
      Nei pressi di Canna la bussola inganna. Compass Hill, sull'estremità orientale dell'isola, racchiude una
      concentrazione di ferro magnetico tale da deflettere gli aghi nautici, facendoli puntare verso la rupe
      anziché verso il nord magnetico. Canna è la più occidentale delle Small Isles nelle Ebridi Interne: 6,9
      km di lunghezza per 1,6 km di larghezza, unita a Sanday da una passerella e banchi di sabbia a marea
      calante. I precedenti proprietari la donarono al National Trust for Scotland nel 1981, ed è gestita come
      fattoria attiva e riserva faunistica.
    landscape: >-
      Canna è fuoco primordiale pietrificato. La sua roccia consiste in una serie sovrapposta di colate
      basaltiche paleoceniche della Canna Lava Formation, evidenti nel paesaggio: gradinate di colonne
      basaltiche nel settore orientale e scogliere vertiginose che precipitano nell'Atlantico a nord. La quota
      massima è Càrn a' Ghaill, «la collina tempestosa», a 210 m, mentre Compass Hill tocca i 139 m ed è
      costituita da tufo vulcanico.


      Tra Canna e Sanday si insinua un porto naturale ben protetto, l'unico approdo in acque profonde delle
      Small Isles, frequentatissimo dalle imbarcazioni da diporto della costa occidentale. Sui declivi di
      Compass Hill fioriscono eriche, orchidee delle Ebridi e primule selvatiche.
    wildlife: >-
      Oltre ventimila uccelli marini nidificano sulle falesie, e il consiglio migliore è volgere lo sguardo
      alle onde. Canna è celebre per aquile di mare, aquile reali e pulcinella di mare, a cui si affiancano
      falchi pellegrini e smerigli; lungo i dirupi i rapaci cacciano in vista dei nidi marini. L'[aquila di
      mare](/especie/haliaeetus_albicilla/) e l'[aquila reale](/especie/aquila_chrysaetos/) solcano i cieli
      con il [pulcinella di mare](/especie/fratercula_arctica/), la [gazza marina](/especie/alca_torda/) e
      l'[uria](/especie/uria_aalge/).


      Le colonie marine vantano una straordinaria rinascita. I ratti grigi predavano le uova di [berta minore
      atlantica](/especie/puffinus_puffinus/); fu decretata la derattizzazione e a fine 2006 Canna fu
      proclamata indenne da ratti. Pulcinella e gazze marine sono aumentati vistosamente, e la berta minore è
      tornata a riprodursi con successo per la prima volta dal 1997. Prima degli interventi, una popolazione
      locale di topi selvatici, ritenuta sottospecie insulare distinta, era stata prelevata e messa al sicuro.


      In mare, il canale tra Canna e Rùm è un corridoio privilegiato per cetacei, con frequenti avvistamenti
      di [balenottere minori](/especie/balaenoptera_acutorostrata/). Nella baia riparata sostano [foche
      grigie](/especie/halichoerus_grypus/) e [foche comuni](/especie/phoca_vitulina/), specialmente nella
      quiete invernale. Il periodo ideale va da maggio a settembre, e da maggio ad agosto un monitoraggio
      partecipato invita a scattare foto ai pulcinella che recano pesce al nido.
    visit: >-
      Si approda col traghetto CalMac MV Lochnevis, che connette Canna a Rùm, Eigg, Muck e allo scalo
      continentale di Mallaig in due ore e mezza. Lo sbarco di veicoli privati richiede l'autorizzazione del
      National Trust.


      La passeggiata Canna Bay Walk parte dal molo, richiede un'ora e mezza e si sviluppa su tracciato
      pianeggiante riparato dai venti. Anche la salita a Compass Hill inizia dall'imbarcadero e impegna un'ora
      e mezza; l'ascesa offre una comoda variante sul costone destro. Il Puffin Trail prende avvio da St
      Edward’s Church, dura due ore e giunge alla colonia riproduttiva estiva di Puffin Stacks su Sanday.
      Lungo il sentiero le brughiere costiere accolgono orchidee delle Ebridi, bruchi e farfalle, mentre a
      Sanday si osservano beccaccini, allodole, pavoncelle, stercorari e urie.
    history: >-
      Canna è abitata fin dal Neolitico, come attestano frammenti ceramici e gallerie sotterranee scavate nel
      terreno. L'età del bronzo ha lasciato capanne circolari e muretti di confine, e nell'età del ferro sorse
      la fortezza di Dun Channa. A Keill due grandi croci celtiche istoriate dei secoli VIII-IX indicano la
      presenza di un monastero. La leggenda narra che ai colpevoli venisse infilato il pollice in un foro
      della «pietra del castigo», un menhir di Keill.


      I vichinghi impressero il loro retaggio nella toponomastica, come sgor (scoglio), gearaid (recinto),
      tota (rudere) e Sanday («isola sabbiosa»). Seguì la povertà: dopo il boom della cenere di alghe, nel
      1821 diversi coloni emigrarono in Canada, e nel 1847, a seguito delle carestie, gli abitanti di Keill
      furono sgomberati per fare spazio agli ovini. Nel 1938 John Lorne Campbell acquistò l'isola gestendola
      come riserva e fattoria. Canna House custodisce oggi gli archivi di Campbell e Shaw su folklore e canti
      tradizionali gaelici.


      Gran parte di Canna è tutelata come SSSI. Dopo la derattizzazione si verificò un'esplosione di conigli
      che minacciava le emergenze archeologiche; l'anno successivo vennero abbattuti 9 000 dei 16 000
      esemplari stimati.
    before: A Canna non esiste copertura di telefonia cellulare e le piste non sono asfaltate.
    around: >-
      La [Isle of Rum National Nature Reserve](/lugar/isle-of-rum-national-nature-reserve/) dista circa 6 km,
      oltre il braccio di mare frequentato da balene e delfini.
  pt:
    intro: >-
      Perto de Canna a bússola mente. Compass Hill, na ponta oriental da ilha, concentra tanto ferro magnético
      que desvia as agulhas das embarcações, fazendo-as apontar para a colina em vez do norte magnético. Canna
      é a mais ocidental das Small Isles, nas Hébridas Interiores: 6,9 km de comprimento por 1,6 km de
      largura, unida a Sanday por uma ponte pedonal e bancos de areia na maré baixa. Os antigos proprietários
      doaram-na ao National Trust for Scotland em 1981, sendo gerida como exploração agropecuária e reserva
      natural.
    landscape: >-
      Canna é lava petrificada. O subsolo é composto por uma sequência estratificada de escoadas de basalto do
      Paleocénico pertencentes à Canna Lava Formation, o que se reflete no relevo: patamares de colunas
      basálticas a leste e falésias alcantiladas que dominam a costa norte. A cota máxima é Càrn a' Ghaill, «a
      colina pedregosa da tempestade», a 210 m, enquanto Compass Hill, a 139 m, é formada por tufo vulcânico.


      Entre Canna e Sanday forma-se um porto natural abrigado, o único fundeadouro de águas profundas das
      Small Isles e muito procurado por veleiros da costa oeste. Nas encostas de Compass Hill encontram-se
      urzes, orquídeas-das-hébridas e prímulas bravas.
    wildlife: >-
      Mais de vinte mil aves marinhas nidificam nas escarpas, e a melhor recomendação é apontar o olhar para o
      mar. Canna é afamada pelas águias-marinhas, águias-reais e papagaios-do-mar, avistando-se também
      falcões-peregrinos e esmerilhões; junto aos penhascos as rapinas convivem com as colónias marinhas. A
      [águia-marinha](/especie/haliaeetus_albicilla/) e a [águia-real](/especie/aquila_chrysaetos/) partilham
      os céus com o [papagaio-do-mar](/especie/fratercula_arctica/), a
      [torda-mergulheira](/especie/alca_torda/) e o [airo](/especie/uria_aalge/).


      As aves viveram um processo notável de conservação. Os ratos-pretos introduzidos dizimavam as crias de
      [pardela-dos-baleares](/especie/puffinus_puffinus/); realizou-se uma campanha de desratização e, nos
      finais de 2006, Canna foi declarada livre de roedores. Papagaios e tordas aumentaram, e a
      pardela-dos-baleares nidificou com sucesso pela primeira vez desde 1997. Antes dos trabalhos,
      resgatou-se uma população de ratos-do-campo insulares, tida como subespécie singular, para salvaguarda
      genética.


      No mar, o canal entre Canna e Rùm é um corredor habitual de cetáceos, com avistamentos frequentes de
      [baleias-anãs](/especie/balaenoptera_acutorostrata/). Na baía abrigada repousam
      [focas-cinzentas](/especie/halichoerus_grypus/) e [focas-comuns](/especie/phoca_vitulina/), sobretudo na
      tranquilidade do inverno. A época áurea vai de maio a setembro, e de maio a agosto um programa de
      ciência cidadã incentiva ao envio de fotografias de papagaios-do-mar com peixes no bico.
    visit: >-
      O acesso faz-se a bordo do ferry MV Lochnevis, que assegura a travessia entre Canna, Rùm, Eigg, Muck e o
      porto continental de Mallaig em duas horas e meia. O desembarque de viaturas particulares carece de
      autorização do National Trust.


      O percurso Canna Bay Walk parte do cais, dura uma hora e meia e desenvolve-se em terreno plano e
      abrigado do vento. Compass Hill também tem início no cais e exige uma hora e meia; a subida dispõe de
      uma alternativa mais suave pelo ombro direito. O trilho Puffin Trail arranca junto a St Edward’s Church,
      dura duas horas e conduz à colónia estival de papagaios-do-mar de Puffin Stacks, em Sanday. Ao longo do
      caminho, a charneca marítima acolhe orquídeas-das-hébridas, lagartas e borboletas, ao passo que nos
      matos de Sanday se observam narcejas, cotovias, abibes, moleiros e airos.
    history: >-
      Canna é povoada desde o Neolítico, albergando fragmentos de olaria e galerias subterrâneas misteriosas.
      A Idade do Bronze deixou cabanas circulares e muretes agrícolas, e na Idade do Ferro ergueu-se o forte
      costeiro de Dun Channa. Em Keill erguem-se duas grandes cruzes celtas esculpidas dos séculos VIII-IX,
      atestando a presença de um antigo mosteiro. Reza a lenda que aos infratores era entalado o polegar num
      orifício da «pedra do castigo», um menir em Keill.


      Os vikings deixaram marcas em topónimos como sgor (rochedo), gearaid (cercado), tota (ruína) e Sanday
      («ilha de areia»). Seguiu-se a penúria: após o apogeu da queima de algas, em 1821 vários ilhéus
      emigraram para o Canadá, e em 1847, com as perdas agrícolas, os habitantes de Keill foram despejados
      para introdução de ovinos. Em 1938 John Lorne Campbell comprou Canna gerindo-a como quinta e reserva.
      Canna House acolhe hoje os arquivos de Shaw e Campbell sobre literatura, folclore e cancioneiro em
      gaélico escocês.


      A quase totalidade de Canna é classificada como SSSI. Após a desratização registou-se uma praga de
      coelhos que danificava os sítios arqueológicos; no ano seguinte abateram-se 9 000 dos 16 000 coelhos
      estimados.
    before: Em Canna não há rede de telemóvel e os caminhos não têm pavimento asfaltado.
    around: >-
      A [Isle of Rum National Nature Reserve](/lugar/isle-of-rum-national-nature-reserve/) fica a cerca de 6
      km, na outra margem do canal onde cruzam baleias e golfinhos.
