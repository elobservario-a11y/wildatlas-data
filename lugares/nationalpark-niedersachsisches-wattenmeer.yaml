    Islas barrera, marismas y llanuras de marea entre el Ems y el Elba, parte del Patrimonio Mundial del Mar
    de Wadden.
  en: >-
    Barrier islands, salt marshes and intertidal mudflats between the Ems and the Elbe, part of the Wadden Sea
    World Heritage site.
  fr: >-
    Îles-barrières, marais salés et vasières tidales entre l'Ems et l'Elbe, partie intégrante du patrimoine
    mondial de la mer des Wadden.
  de: Barriereinseln, Salzwiesen und Wattflächen zwischen Ems und Elbe, Teil des Weltnaturerbes Wattenmeer.
  it: >-
    Isole barriera, barene e piane di marea tra l'Ems e l'Elba, parte del Patrimonio Mondiale del Mar dei
