  pt: >-
    Ilhas-barreira, sapais e planícies de maré entre o Ems e o Elba, integrando o Património Mundial do Mar de
    Wadden.
unico:
  es: >-
    Cada año unos 10 a 12 millones de aves paran en este mar que se vacía con la marea, y tú puedes caminar
    por el suelo donde comen.
  en: >-
    A tidal landscape of international scale where 10 to 12 million migratory birds refuel every year along
    barrier dunes and mudflats.
  fr: >-
    Un paysage de marée d'échelle internationale où 10 à 12 millions d'oiseaux migrateurs font escale chaque
    année le long des dunes et des vasières.
  de: >-
    Eine Gezeitenlandschaft von weltweiter Bedeutung, in der jährlich 10 bis 12 Millionen Zugvögel entlang von
    Dünen und Wattflächen rasten.
  it: >-
    Un paesaggio di marea di rilievo mondiale dove da 10 a 12 milioni di uccelli migratori sostano ogni anno
    tra dune e piane fangose.
  pt: >-
    Uma paisagem de marés de escala global onde 10 a 12 milhões de aves migradoras fazem escala todos os anos
    entre dunas e lodaçais.
observaciones:
  es: >-
    En la zona 2 se puede salir del camino, salvo en las colonias de cría de las marismas durante la época de
    cría, de abril a julio. Un cambio rápido de tiempo no es raro, así que vístete por capas: camiseta, jersey
    y chubasquero. Las mareas mandan en cualquier plan: el organismo BSH informa de las horas de pleamar y
    bajamar y de la temperatura del agua.
texto:
  es:
    intro: >-
      Dos veces al día el mar se retira y deja a la vista las llanuras intermareales: el mar de Frisia se ha
      desarrollado durante los últimos 8.000 años, y por eso es un ecosistema muy joven que sigue cambiando.
      En el Parque Nacional del Mar de Frisia de Baja Sajonia, creado en 1986, esa llanura se extiende entre
      el Dollart y Cuxhaven con las islas Frisias Orientales como telón, y el resultado es el segundo parque
      nacional más grande de Alemania, con unos 3.450 km². La costa forma un mosaico de llanuras de marea,
      marismas saladas, playas, dunas y estuarios.
    landscape: >-
      Piensa en el fondo del mar a la vista. Según el lugar y la corriente se depositan sedimentos distintos y
      así hay llanura de arena, mixta o de fango, surcada por canales de marea. Las islas Frisias Orientales
      nacieron de bancos de arena; las Frisias del Norte y las Halligen, en cambio, fueron antes parte de la
      costa continental. En la cara de las islas que mira al mar abierto hay playas y dunas blancas, y en la
      cara del Watt dominan las marismas saladas. En las dunas manda el barrón, cuya raíz extensa las fija; en
      verano florecen en las marismas el cardo marítimo y el limonio.


      La zona 1, con mucho la mayor del parque, solo se puede pisar por los caminos autorizados.
    wildlife: >-
      En el conjunto del mar de Frisia, en primavera y otoño hasta 12 millones de aves, con más de 40 especies
      de importancia internacional, hacen escala en su viaje entre las zonas de cría nórdicas y las de
      invernada del sur; solo el [correlimos gordo](/especie/calidris_canutus/) llega a 350.000 ejemplares. En
      verano quedan más de 30 especies que crían en marismas, dunas y playas: el ostrero, con hasta 40.000
      parejas en todo el mar de Frisia, y colonias de gaviotas y charranes de varios miles de parejas. Las
      marismas saladas son también zona de cría de la [avoceta](/especie/recurvirostra_avosetta/) y los
      charranes.


      De julio a septiembre es la muda: en el conjunto del mar de Frisia, unos 180.000 [tarros
      blancos](/especie/tadorna_tadorna/) del noroeste de Europa y unos 200.000
      [eideres](/especie/somateria_mollissima/) pasan aquí esas semanas. En total se han registrado más de 400
      especies de aves, entre ellas gaviota reidora, charrán común, [aguilucho
      pálido](/especie/circus_cyaneus/) y collalba gris.


      Bajo la superficie, el fango es una despensa. Allí el crustáceo Schlickkrebs llega a poblar la llanura
      con hasta 100.000 individuos por m². Las [focas comunes](/especie/phoca_vitulina/) y las [focas
      grises](/especie/halichoerus_grypus/) usan los bancos de arena para descansar y criar, y en aguas más
      profundas vive la [marsopa](/especie/phocoena_phocoena/), el único cetáceo autóctono. Se han hallado más
      de 10.000 especies de animales y plantas, y las Frisias Orientales son un punto caliente de
      biodiversidad.
    visit: >-
      Hay una amplia red de caminos para senderismo, bicicleta y caballo, y se marcan con postes de madera de
      colores: verde para senderismo y rojo para caballos. Para entender el lugar, empieza por un centro: hay
      tres centros de visitantes del Wattenmeer, catorce Nationalpark-Häuser y una estación de experiencias en
      la costa y las islas. Sus exposiciones explican la idea del parque nacional y el Patrimonio Mundial y
      presentan los hábitats; lo mejor es completarlo con una excursión guiada.


      La llanura se explora con quienes la conocen: los guías de la llanura saben el tiempo y las mareas y
      deciden si una caminata debe suspenderse por un cambio brusco de tiempo. Para planear, el organismo BSH
      informa de las horas de pleamar y bajamar y de la temperatura del agua.
    history: >-
      La parte de Baja Sajonia del mar de Frisia fue designada humedal de importancia internacional en 1976;
      el parque nacional nació en 1986, y es reserva de la biosfera y parte del Patrimonio Natural Mundial del
      Wattenmeer. La UNESCO lo declaró el 26 de junio de 2009, y desde junio de 2014 lo es todo el mar de
      Frisia del mar del Norte. Es la mayor extensión continua de llanuras de fango y arena del mundo. En 2001
      una reforma de la ley sacó o rebajó de protección muchas zonas para favorecer el turismo.
    before: >-
      En la zona 2 se puede salir del camino, salvo en las colonias de cría de las marismas durante la época
      de cría, de abril a julio. Un cambio rápido de tiempo no es raro, así que vístete por capas: camiseta,
      jersey y chubasquero. Las mareas mandan en cualquier plan: el organismo BSH informa de las horas de
      pleamar y bajamar y de la temperatura del agua.
    around: >-
      En el sector neerlandés del mismo sistema costero están las [Marismas Saladas del Mar de Frisia (Sector
      Neerlandés)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/), y otro sector alemán es el [Parque
      Nacional del Mar de Frisia de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).


      Más lejos, el [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) comparte con él el
      correlimos gordo, el tarro blanco y la foca gris; el [Parque Nacional del Mar de Wadden
      (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/), el correlimos gordo y la foca gris; y el
      [Parque Natural del Lago Salado Rusanda](/lugar/park-prirode-rusanda/), la avoceta y el tarro blanco.
  en:
    intro: >-
      The sea retreats, and a vast plain appears. For thousands of years the tide has shaped the southern
      North Sea coast, and the result is a dynamic landscape that changes with every wave. The mudflats here
      formed around 8,000 years ago, following the last ice age, when the rising sea began depositing sand and
      silt along the low-lying shore.


      Lower Saxony declared this shoreline a national park in 1986. It stretches from the Dutch border in the
      Dollart to Cuxhaven, framed by the East Frisian Islands as a natural seaward barrier. The result is
      Germany's second-largest national park, encompassing some 3,450 km². The coast forms an intricate mosaic
      of intertidal mudflats, salt marshes, sandy beaches, dunes and dynamic estuaries.
    landscape: >-
      Picture the seabed laid bare before your eyes. Depending on wave exposure and currents, different
      sediments settle, creating sand flats, mixed flats or mudflats criss-crossed by deep tidal gullies. The
      East Frisian Islands arose from migrating sandbanks; by contrast, the North Frisian Islands and Halligen
      once formed part of the mainland. On the seaward side facing the open ocean lie wide sandy beaches and
      white dunes, while salt marshes dominate the sheltered Wadden side. Marram grass rules the dunes,
      binding them with extensive root systems; in summer, sea holly and sea lavender burst into bloom across
      the salt marshes.


      Zone 1, by far the largest sector of the park, may only be entered on designated, authorized paths.
    wildlife: >-
      Across the wider Wadden Sea, in spring and autumn up to 12 million migratory birds representing over 40
      internationally significant species make stopovers between northern breeding territories and southern
      wintering quarters; the [red knot](/especie/calidris_canutus/) alone reaches 350,000 individuals here.
      In summer, more than 30 breeding species remain across marshes, dunes and beaches: Eurasian
      oystercatchers muster up to 40,000 pairs across the entire Wadden Sea, accompanied by gull and tern
      colonies numbering thousands of pairs. The salt marshes serve as vital nesting grounds for [pied
      avocets](/especie/recurvirostra_avosetta/) and terns.


      From July to September the great moult takes place: across the whole Wadden Sea, roughly 180,000 [common
      shelducks](/especie/tadorna_tadorna/) from northwestern Europe and some 200,000 [common
      eiders](/especie/somateria_mollissima/) spend these flightless weeks here. In total, more than 400 bird
      species have been recorded, including black-headed gull, common tern, [hen
      harrier](/especie/circus_cyaneus/) and northern wheatear.


      Beneath the surface, the intertidal mud is an extraordinarily rich pantry. The mud amphipod Schlickkrebs
      reaches densities of up to 100,000 individuals per m². [Common seals](/especie/phoca_vitulina/) and
      [grey seals](/especie/halichoerus_grypus/) rely on exposed sandbanks to rest and pup, while the [harbour
      porpoise](/especie/phocoena_phocoena/), the region's only native cetacean, patrols deeper offshore
      waters. Researchers have documented over 10,000 plant and animal species, making the East Frisian coast
      a premier biodiversity hotspot.
    visit: >-
      An extensive network of trails caters to walkers, cyclists and equestrians, marked by colour-coded
      wooden posts: green for hiking and red for bridleways. To understand this dynamic world, begin at a
      visitor centre: there are three large Wadden Sea visitor centres, fourteen Nationalpark-Häuser and an
      experiential discovery station along the coastline and islands. Their interactive displays illuminate
      the national park concept, World Heritage values and marine habitats; ideally, complement this with a
      guided mudflat excursion.


      Explore the tidal flats with certified guides who read the weather and tides, knowing when to suspend a
      walk if conditions deteriorate rapidly. For route planning, the Federal Maritime and Hydrographic Agency
      (BSH) publishes official tidal predictions and water temperatures.
    history: >-
      The Lower Saxon sector of the Wadden Sea was designated a Wetland of International Importance under the
      Ramsar Convention in 1976; the national park was established in 1986, later becoming a UNESCO biosphere
      reserve and part of the Wadden Sea World Heritage site. UNESCO inscribed it on 26 June 2009, and since
      June 2014 the entire North Sea Wadden Sea has shared this status. It forms the world's largest unbroken
      expanse of intertidal sand and mud flats. In 2001, a controversial legal reform reduced protection
      across certain peripheral zones to accommodate tourism.
    before: >-
      In Zone 2 you may step off trails, except within breeding bird colonies on salt marshes during nesting
      season from April to July. Rapid weather shifts are frequent, so dress in layers: base layer, warm
      jumper and wind- and waterproof jacket. The tides dictate every activity: the BSH provides live
      schedules for high and low water alongside water temperatures.
    around: >-
      In the Dutch sector of the same coastal system lie the [Wadden Sea Salt Marshes (Dutch
      Sector)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/), and another German sector is the
      [Schleswig-Holstein Wadden Sea National Park](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).


      Further away, [Słowiński National Park](/lugar/slowinski-park-narodowy/) shares the red knot, common
      shelduck and grey seal; [Wadden Sea National Park (Denmark)](/lugar/wadden-sea-national-park-dinamarca/)
      shares the red knot and grey seal; and [Rusanda Nature Park](/lugar/park-prirode-rusanda/) shares the
      pied avocet and common shelduck.
  fr:
    intro: >-
      La mer se retire et une immense plaine se dévoile. Depuis des millénaires, la marée façonne le littoral
      de la mer du Nord méridionale, créant un paysage perpétuellement remodelé au gré des flots. Ces vasières
      ont pris naissance il y a environ 8 000 ans, à l'issue de la dernière glaciation, lorsque la montée des
      eaux s'est mise à déposer sables et limons sur le rivage plat.


      La Basse-Saxe en a fait un parc national en 1986. Il s'étire de la frontière néerlandaise dans le
      Dollart jusqu'à Cuxhaven, avec pour toile de fond l'arc des îles de la Frise orientale. C'est le
      deuxième plus vaste parc national d'Allemagne, couvrant près de 3 450 km². Le littoral forme une
      marqueterie de vasières tidales, de marais salés, de plages de sable, de dunes et d'estuaires
      dynamiques.
    landscape: >-
      Imaginez le fond marin exposé à ciel ouvert. Selon l'exposition aux courants, différents sédiments se
      déposent, créant des estrans sableux, mixtes ou vaseux parcourus de chenaux de marée. Les îles de la
      Frise orientale sont nées de bancs de sable mouvants ; à l'inverse, les îles de la Frise du Nord et les
      Halligen appartenaient autrefois au continent. Côté grand large se succèdent plages et dunes blanches,
      tandis que les marais salés dominent la façade abritée du Watt. L'oyat règne sur les dunes dont il ancre
      le sable par ses racines profondes ; l'été voit éclore sur les prés salés le chardon maritime et le
      lilas de mer.


      La zone 1, de loin la plus vaste du parc, ne s'arpente que sur les sentiers balisés autorisés.
    wildlife: >-
      À l'échelle de la mer des Wadden, au printemps et à l'automne, jusqu'à 12 millions d'oiseaux migrateurs
      appartenant à plus de 40 espèces d'importance internationale font halte entre sites de nidification
      arctiques et quartiers d'hivernage méridionaux ; le [bécasseau maubèche](/especie/calidris_canutus/)
      compte à lui seul 350 000 individus. En été, plus de 30 espèces nicheuses demeurent dans les marais,
      dunes et plages : l'huîtrier pie rassemble jusqu'à 40 000 couples sur l'ensemble de la mer des Wadden,
      aux côtés de colonies de mouettes et de sternes comptant plusieurs milliers de couples. Les marais salés
      accueillent la reproduction de l'[avocette élégante](/especie/recurvirostra_avosetta/) et des sternes.


      De juillet à septembre intervient la mue : dans toute la mer des Wadden, environ 180 000 [tadornes de
      Belon](/especie/tadorna_tadorna/) d'Europe du Nord-Ouest et quelque 200 000 [eiders à
      duvet](/especie/somateria_mollissima/) passent ici ces semaines critiques. Au total, plus de 400 espèces
      d'oiseaux ont été recensées, dont la mouette rieuse, la sterne pierregarin, le [busard
      Saint-Martin](/especie/circus_cyaneus/) et le traquet motteux.


      Sous la surface, la vase constitue un fabuleux réservoir nutritif. Le petit crustacé d'estran
      Schlickkrebs peut y atteindre des densités de 100 000 individus par m². Les [phoques
      communs](/especie/phoca_vitulina/) et les [phoques gris](/especie/halichoerus_grypus/) exploitent les
      bancs de sable pour se reposer et mettre bas, tandis que le [marsouin
      commun](/especie/phocoena_phocoena/), unique cétacé indigène, fréquente les eaux plus profondes. Plus de
      10 000 espèces animales et végétales y ont été inventoriées, faisant des îles frisonnes un haut lieu de
      biodiversité.
    visit: >-
      Un vaste maillage d'itinéraires accueille marcheurs, cyclistes et cavaliers, balisé par des poteaux en
      bois colorés : vert pour la randonnée et rouge pour les cavaliers. Pour comprendre cet environnement,
      commencez par les maisons du parc : trois grands centres d'accueil du Wattenmeer, quatorze
      Nationalpark-Häuser et une station de découverte jalonnent le continent et les îles. Leurs espaces
      scénographiques présentent la philosophie du parc national, le patrimoine mondial et les écosystèmes
      littoraux ; l'idéal est de compléter la visite par une sortie accompagnée sur l'estran.


      L'estran se découvre avec des guides assermentés qui maîtrisent marées et météorologie et savent
      interrompre une sortie en cas de dégradation brutale du temps. Pour planifier vos sorties, le service
      hydrographique BSH renseigne les horaires des marées et la température de l'eau.
    history: >-
      La portion bas-saxonne de la mer des Wadden a été reconnue zone humide d'importance internationale au
      titre de Ramsar en 1976 ; le parc national a vu le jour en 1986, avant de devenir réserve de biosphère
      et bien du patrimoine mondial. L'UNESCO l'a inscrit le 26 juin 2009, et depuis juin 2014 l'intégralité
      de la mer des Wadden de la mer du Nord bénéficie de ce statut. C'est la plus grande étendue
      ininterrompue de vasières et bancs de sable au monde. En 2001, une modification législative a déclassé
      certaines zones périphériques pour favoriser le tourisme.
    before: >-
      En zone 2, vous pouvez vous écarter des sentiers, excepté au sein des colonies d'oiseaux nichant dans
      les prés salés durant la période de reproduction d'avril à juillet. Les sautes de temps sont rapides :
      prévoyez plusieurs couches de vêtements avec tee-shirt, pull chaud et coupe-vent imperméable. Les marées
      rythment toute excursion : le BSH publie les heures précises des pleines et basses mers ainsi que la
      température de l'eau.
    around: >-
      Dans le secteur néerlandais du même système littoral s'étendent les [Marais salés de la mer des Wadden
      (secteur néerlandais)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/), et un autre secteur
      allemand est le [Parc national de la mer des Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).


      Plus loin, le [Parc national de Słowiński](/lugar/slowinski-park-narodowy/) partage le bécasseau
      maubèche, le tadorne de Belon et le phoque gris ; le [Parc national de la mer des Wadden
      (Danemark)](/lugar/wadden-sea-national-park-dinamarca/) partage le bécasseau maubèche et le phoque gris
      ; et le [Parc naturel de Rusanda](/lugar/park-prirode-rusanda/) partage l'avocette élégante et le
      tadorne de Belon.
  de:
    intro: >-
      Das Meer weicht zurück, und eine endlose Weite tritt zutage. Seit Jahrtausenden formt die Gezeit die
      südliche Nordseeküste, und das Ergebnis ist eine dynamische Landschaft, die sich mit jeder Flut wandelt.
      Das Wattenmeer entstand vor rund 8.000 Jahren nach der letzten Eiszeit, als das ansteigende Meer Sand
      und Schlick an der flachen Küste abzulagern begann.


      Niedersachsen erklärte diesen Küstenstreifen 1986 zum Nationalpark. Er reicht von der niederländischen
      Grenze am Dollart bis nach Cuxhaven, geschützt durch die Kette der Ostfriesischen Inseln als seeseitige
      Barriere. So entstand der zweitgrößte Nationalpark Deutschlands mit rund 3.450 km² Fläche. Die Küste
      bildet ein Mosaik aus Wattflächen, Salzwiesen, Sandstränden, Dünen und Flussmündungen.
    landscape: >-
      Stell dir den Meeresgrund unter freiem Himmel vor. Je nach Strömung lagern sich unterschiedliche
      Sedimente ab – so entstehen Sand-, Misch- und Schlickwatten, durchzogen von tiefen Prielen. Die
      Ostfriesischen Inseln entstanden aus wandernden Sandbänken; die Nordfriesischen Inseln und Halligen
      dagegen waren einst Festland. Auf der Seeseite der Inseln liegen weiße Dünen und Sandstrände, während
      zur Wattseite hin Salzwiesen dominieren. Auf den Dünen hält der Strandhafer mit seinem Wurzelwerk den
      Sand fest; im Sommer überziehen Stranddistel und Strandflieder die Salzwiesen mit Farbe.


      Die Ruhezone (Zone 1), der weitaus größte Teil des Parks, darf nur auf zugelassenen Wegen betreten
      werden.
    wildlife: >-
      Im gesamten Wattenmeer rasten im Frühjahr und Herbst bis zu 12 Millionen Zugvögel aus über 40
      international bedeutenden Arten zwischen arktischen Brutgebieten und südlichen Winterquartieren; allein
      der [Knutt](/especie/calidris_canutus/) erreicht 350.000 Individuen. Im Sommer brüten über 30 Vogelarten
      auf Wiesen, Dünen und Stränden: Der Austernfischer zählt im gesamten Wattenmeer bis zu 40.000 Brutpaare,
      begleitet von Tausenden Möwen und Seeschwalben. Die Salzwiesen sind ein zentraler Brutplatz für den
      [Säbelschnäbler](/especie/recurvirostra_avosetta/) und Seeschwalben.


      Von Juli bis September steht die Mauser an: Im Gesamtwattenmeer versammeln sich rund 180.000
      [Brandgänse](/especie/tadorna_tadorna/) Nordwesteuropas und etwa 200.000
      [Eiderenten](/especie/somateria_mollissima/), um flugunfähig zu mausern. Insgesamt wurden über 400
      Vogelarten nachgewiesen, darunter Lachmöwe, Flussseeschwalbe, [Kornweihe](/especie/circus_cyaneus/) und
      Steinschmätzer.


      Im Wattboden verbirgt sich eine gewaltige Nahrungsquelle. Der Schlickkrebs erreicht Dichten von bis zu
      100.000 Individuen pro m². [Seehunde](/especie/phoca_vitulina/) und
      [Kegelrobben](/especie/halichoerus_grypus/) nutzen Sandbänke zum Rasten und Werfen, während in tieferen
      Prielen der [Gewöhnliche Schweinswal](/especie/phocoena_phocoena/) als einziges heimisches Walross
      schwimmt. Über 10.000 Tier- und Pflanzenarten wurden erfasst – die ostfriesische Küste ist ein echter
      Biodiversitäts-Hotspot.
    visit: >-
      Ein weitverzweigtes Netz aus Wander-, Rad- und Reitwegen ist mit farbigen Holzpfählen markiert: grün für
      Wanderer, rot für Reiter. Zum Einstieg empfiehlt sich ein Informationszentrum: Drei große
      Wattenmeer-Besucherzentren, vierzehn Nationalpark-Häuser und eine Erlebnisstation säumen Festland und
      Inseln. Ihre Ausstellungen vermitteln die Idee des Nationalparks und des Weltnaturerbes; am besten
      schließt du dich einer geführten Wattwanderung an.


      Erkunde das Watt nur mit kundigen Wattführern, die Wetter und Gezeiten genau kennen und bei
      Wetterumschwüngen rechtzeitig umkehren. Zur Vorbereitung informiert das BSH über Gezeitenzeiten von Ebbe
      und Flut sowie Wassertemperaturen.
    history: >-
      Der niedersächsische Teil des Wattenmeeres wurde 1976 als Feuchtgebiet internationaler Bedeutung unter
      der Ramsar-Konvention ausgewiesen; der Nationalpark wurde 1986 gegründet, ist Biosphärenreservat und
      Teil des UNESCO-Weltnaturerbes Wattenmeer. Die UNESCO zeichnete das Gebiet am 26. Juni 2009 aus, und
      seit Juni 2014 umfasst die Stätte das gesamte Wattenmeer der Nordsee. Es ist das weltweit größte
      zusammenhängende Schlick- und Sandwattgebiet. Im Jahr 2001 wurden durch eine Gesetzesnovelle touristisch
      genutzte Flächen ausgegliedert.
    before: >-
      In der Zwischenzone (Zone 2) darfst du die Wege verlassen, ausgenommen Brutkolonien auf Salzwiesen
      während der Hauptbrutzeit von April bis Juli. Wetterumschwünge treten rasch auf – kleide dich nach dem
      Zwiebelprinzip mit T-Shirt, Pullover und winddichter Regenjacke. Die Gezeiten bestimmen jeden Plan: Das
      BSH informiert verlässlich über Hoch- und Niedrigwasserzeiten sowie Wassertemperaturen.
    around: >-
      Im niederländischen Sektor desselben Küstensystems liegen die [Wattenmeer-Salzwiesen (Niederländischer
      Sektor)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/), und ein weiteres deutsches Teilgebiet
      ist der [Nationalpark Schleswig-Holsteinisches
      Wattenmeer](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).


      Weiter entfernt teilen der [Slowinzische Nationalpark](/lugar/slowinski-park-narodowy/) Knutt, Brandgans
      und Kegelrobbe; der [Nationalpark Wattenmeer (Dänemark)](/lugar/wadden-sea-national-park-dinamarca/)
      Knutt und Kegelrobbe; und der [Naturpark Rusanda](/lugar/park-prirode-rusanda/) Säbelschnäbler und
      Brandgans.
  it:
    intro: >-
      Il mare si ritrae e appare una sterminata pianura. Da millenni la marea plasma la costa meridionale del
      Mare del Nord, dando vita a un ambiente dinamico che muta con ogni ciclo di flusso e riflusso. Le piane
      di marea si sono formate circa 8.000 anni fa al termine dell'ultima era glaciale, quando la risalita
      delle acque iniziò a depositare sabbie e limi lungo il litorale pianeggiante.


      La Bassa Sassonia ha istituito questo parco nazionale nel 1986. Si snoda dal confine olandese nel
      Dollart fino a Cuxhaven, protetto dall'arco delle Isole Frisone Orientali come barriera naturale verso
      il mare aperto. È il secondo parco nazionale per estensione della Germania, con circa 3.450 km². La
      costa disegna un articolato mosaico di piane di marea, barene salmastre, lidi sabbiosi, dune ed estuari
      dinamici.
    landscape: >-
      Immagina il fondale marino dischiuso allo sguardo. In base a correnti e moto ondoso si depositano
      sedimenti diversi che creano piane sabbiose, miste o fangose, percorse da profondi canali di marea. Le
      Isole Frisone Orientali hanno avuto origine da banchi di sabbia mobili; al contrario, le Isole Frisone
      Settentrionali e le Halligen facevano un tempo parte della terraferma. Sul versante rivolto al mare
      aperto si distendono spiagge sabbiose e dune bianche, mentre sulle sponde riparate del Watt dominano le
      barene salmastre. Sulle dune regna lo sparto pungente, che le ancora con il suo denso apparato radicale;
      in estate fioriscono sui prati salsi la calcatreppola marittima e il limonio.


      La zona 1, di gran lunga la più estesa del parco, può essere percorsa unicamente lungo i tracciati
      autorizzati.
    wildlife: >-
      Nell'intero Mar dei Wadden, in primavera e autunno fino a 12 milioni di uccelli migratori appartenenti a
      oltre 40 specie di rilievo internazionale fanno tappa tra le aree riproduttive artiche e i quartieri di
      svernamento a sud; il solo [piovanello maggiore](/especie/calidris_canutus/) tocca 350.000 presenze. In
      estate nidificano su barene, dune e spiagge più di 30 specie: la beccaccia di mare conta fino a 40.000
      coppie in tutto il Mar dei Wadden, affiancata da colonie di gabbiani e sterne di diverse migliaia di
      coppie. Le barene sono il sito riproduttivo d'elezione per
      l'[avocetta](/especie/recurvirostra_avosetta/) e le sterne.


      Da luglio a settembre si compie la muta: nell'intero bacino dei Wadden circa 180.000 esemplari di
      [volpoca](/especie/tadorna_tadorna/) dell'Europa nord-occidentale e circa 200.000 di
      [edredone](/especie/somateria_mollissima/) trascorrono qui questo periodo delicato. In tutto sono state
      censite oltre 400 specie ornitiche, tra cui gabbiano comune, sterna comune, [albanella
      reale](/especie/circus_cyaneus/) e culbianco.


      Sotto la superficie, il fango rappresenta una straordinaria dispensa nutritiva. Il piccolo crostaceo di
      fango Schlickkrebs può raggiungere densità fino a 100.000 individui per m². La [foca
      comune](/especie/phoca_vitulina/) e la [foca grigia](/especie/halichoerus_grypus/) approfittano dei
      banchi di sabbia per riposare e allattare i cuccioli, mentre nelle acque più profonde nuota la [focena
      comune](/especie/phocoena_phocoena/), l'unico cetaceo indigeno. Sono state documentate oltre 10.000
      specie animali e vegetali, consacrando le Frisone Orientali quale polo primario di biodiversità.
    visit: >-
      Una fitta trama di sentieri accoglie escursionisti, ciclisti e cavalieri, contrassegnata da paline di
      legno colorate: verde per il trekking e rosso per le ippovie. Per scoprire questo ecosistema inizia dai
      centri visite: tre grandi centri del Wattenmeer, quattordici Nationalpark-Häuser e una stazione
      didattica sorgono lungo la terraferma e le isole. Le mostre illustrano il parco nazionale, il Patrimonio
      Mondiale e i regimi marini; l'esperienza ideale è partecipare a un'escursione guidata sulla piana
      tidale.


      La piana si esplora in sicurezza con guide certificate che sanno interpretare meteo e maree, pronte a
      interrompere la camminata in caso di improvviso peggioramento. Per pianificare le uscite, l'istituto
      marittimo BSH fornisce gli orari ufficiali di bassa e alta marea e la temperatura dell'acqua.
    history: >-
      Il settore della Bassa Sassonia del Mar dei Wadden è stato riconosciuto zona umida di importanza
      internazionale ai sensi della Convenzione di Ramsar nel 1976; il parco nazionale è stato istituito nel
      1986, divenendo riserva della biosfera e Patrimonio Naturale Mondiale dell'UNESCO. L'UNESCO lo ha
      proclamato il 26 giugno 2009, e da giugno 2014 l'intero Mar dei Wadden del Mare del Nord ne fa parte.
      Rappresenta la maggiore distesa continua di piane fangose e sabbiose del pianeta. Nel 2001 una riforma
      normativa ha scorporato alcune fasce per favorire il turismo balneare.
    before: >-
      Nella zona 2 è consentito allontanarsi dai sentieri, tranne che nelle colonie riproduttive delle barene
      durante la nidificazione da aprile a luglio. I cambiamenti meteo sono repentini: vestiti a strati con
      maglietta, maglione caldo e giacca a vento impermeabile. Le maree regolano ogni attività: l'istituto BSH
      segnala puntualmente gli orari di marea e le temperature marine.
    around: >-
      Nel settore olandese del medesimo bacino si aprono le [Barene del Mar dei Wadden (settore
      olandese)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/), e un altro settore tedesco è il
      [Parco Nazionale del Mar dei Wadden dello
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).


      Più lontano, il [Parco Nazionale Słowiński](/lugar/slowinski-park-narodowy/) condivide il piovanello
      maggiore, la volpoca e la foca grigia; il [Parco Nazionale del Mar dei Wadden
      (Danimarca)](/lugar/wadden-sea-national-park-dinamarca/) il piovanello maggiore e la foca grigia; e il
      [Parco Naturale di Rusanda](/lugar/park-prirode-rusanda/) l'avocetta e la volpoca.
  pt:
    intro: >-
      O mar recua e surge uma planície infindável. Há milénios que as marés moldam o litoral sul do mar do
      Norte, criando um ecossistema dinâmico que se transforma a cada fluxo e refluxo. As planícies de maré
      formaram-se há cerca de 8.000 anos, no final da última glaciação, quando a subida das águas começou a
      depositar areia e vasa ao longo da costa baixa.


      A Baixa Saxónia declarou este litoral parque nacional em 1986. Estende-se desde a fronteira neerlandesa
      no Dollart até Cuxhaven, protegido pelo cordão das ilhas da Frísia Oriental como barreira natural em mar
      aberto. É o segundo maior parque nacional da Alemanha, somando cerca de 3.450 km². A orla costeira
      desenha um mosaico de planícies de maré, sapais salgados, praias de areia, dunas e estuários dinâmicos.
    landscape: >-
      Imagina o leito do mar exposto a céu aberto. Consoante as correntes e a energia das ondas depositam-se
      sedimentos distintos, formando lodaçais de areia, mistos ou de vasa fina, entrecortados por esteiros de
      maré. As ilhas da Frísia Oriental nasceram de bancos de areia em migração; pelo contrário, as ilhas da
      Frísia do Norte e as Halligen faziam outrora parte da terra firme. Na face voltada ao largo estendem-se
      praias e dunas brancas, enquanto no lado abrigado do Watt dominam os sapais. Nas dunas comanda o
      estorno, cujas raízes profundas fixam a areia; no verão florescem nos sapais o cardo-marítimo e a
      estátice.


      A zona 1, de longe a mais extensa do parque, só pode ser percorrida pelos trilhos devidamente
      autorizados.
    wildlife: >-
      Em todo o mar de Wadden, na primavera e no outono, até 12 milhões de aves migradoras de mais de 40
      espécies de importância internacional fazem escala entre os territórios de reprodução nórdicos e os
      quartéis de inverno no sul; apenas a [seixoeira](/especie/calidris_canutus/) atinge 350.000 indivíduos.
      No verão permanecem mais de 30 espécies nidificantes em sapais, dunas e praias: o ostreiro soma até
      40.000 casais em todo o mar de Wadden, acompanhado por colónias de gaivotas e andorinhas-do-mar de
      vários milhares de casais. Os sapais são ainda zona de nidificação fulcral para o
      [alfaiate](/especie/recurvirostra_avosetta/) e as andorinhas-do-mar.


      De julho a setembro ocorre a muda da plumagem: em todo o mar de Wadden, cerca de 180.000 exemplares de
      [pato-branco](/especie/tadorna_tadorna/) do noroeste da Europa e cerca de 200.000 de
      [êider-edredão](/especie/somateria_mollissima/) passam aqui estas semanas críticas. No total foram
      registadas mais de 400 espécies de aves, incluindo a gaivota-d'asa-escura, a andorinha-do-mar-comum, o
      [tartaranhão-azulado](/especie/circus_cyaneus/) e o chasco-cinzento.


      Sob a superfície, o lodo é uma despensa biológica riquíssima. O pequeno anfípode de vasa Schlickkrebs
      pode atingir densidades de 100.000 indivíduos por m². A [foca-comum](/especie/phoca_vitulina/) e a
      [foca-cinzenta](/especie/halichoerus_grypus/) aproveitam os bancos de areia para descansar e amamentar
      as crias, enquanto em canais mais fundos nada a [toninha-comum](/especie/phocoena_phocoena/), o único
      cetáceo autóctone. Foram identificadas mais de 10.000 espécies de animais e plantas, fazendo da costa
      frísia um polo de biodiversidade de relevo continental.
    visit: >-
      Uma vasta rede de caminhos acolhe caminhantes, ciclistas e cavaleiros, assinalada por postes de madeira
      coloridos: verde para pedestrianismo e vermelho para percursos equestres. Para compreenderes o local
      começa por um centro de acolhimento: existem três grandes centros de visitantes do Wattenmeer, catorze
      Nationalpark-Häuser e uma estação interpretativa no continente e nas ilhas. As suas exposições revelam a
      génese do parque nacional, o Património Mundial e os habitats costeiros; o ideal é completar a visita
      com um passeio guiado nas planícies de maré.


      A planície descobre-se com guias certificados que dominam o estado do tempo e as marés, sabendo
      suspender a caminhada perante alterações bruscas da meteorologia. Para planear as tuas saídas, o serviço
      marítimo BSH disponibiliza tábuas de marés e temperaturas da água.
    history: >-
      A parcela da Baixa Saxónia do mar de Wadden foi classificada como zona húmida de importância
      internacional pela Convenção de Ramsar em 1976; o parque nacional foi criado em 1986, integrando a rede
      de reservas da biosfera e o Património Mundial da UNESCO. A UNESCO inscreveu-o a 26 de junho de 2009, e
      desde junho de 2014 todo o mar de Wadden do mar do Norte partilha esse estatuto. Constitui a maior
      extensão contínua de planícies de vasa e areia do planeta. Em 2001, uma revisão legislativa desafetou
      áreas periféricas para incentivar o turismo.
    before: >-
      Na zona 2 é permitido sair dos caminhos, salvo nas colónias de nidificação dos sapais durante o período
      reprodutor de abril a julho. As mudanças súbitas de tempo são frequentes: veste-te por camadas com
      camisola, camisola quente e impermeável corta-vento. As marés regem qualquer plano: o serviço BSH
      informa as horas exatas de preia-mar e baixa-mar e as temperaturas marinhas.
    around: >-
      No setor neerlandês do mesmo sistema costeiro estendem-se os [Sapais do Mar de Wadden (Setor
      Neerlandês)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/), e outro setor alemão é o [Parque
      Nacional do Mar de Wadden de
      Schleswig-Holstein](/lugar/nationalpark-schleswig-holsteinisches-wattenmeer/).


      Mais longe, o [Parque Nacional de Słowiński](/lugar/slowinski-park-narodowy/) partilha a seixoeira, o
      pato-branco e a foca-cinzenta; o [Parque Nacional do Mar de Wadden
      (Dinamarca)](/lugar/wadden-sea-national-park-dinamarca/) partilha a seixoeira e a foca-cinzenta; e o
      [Parque Natural de Rusanda](/lugar/park-prirode-rusanda/) partilha o alfaiate e o pato-branco.
