resumen:
  es: >-
    El mayor Parque Natural Marino de Francia metropolitana (6.800 km²), protegiendo la matorral volcánico
    virgen del Desierto de los Agriates y las torres genovesas del Cap Corse.
  en: >-
    The largest Marine Natural Park in metropolitan France (6,800 km²), safeguarding the pristine scrubland of
    the Agriates Desert and the Genoese towers of Cap Corse.
  fr: >-
    Le plus grand parc naturel marin de France métropolitaine (6 800 km²), protégeant le maquis vierge du
    désert des Agriates et les tours génoises du Cap Corse.
  de: >-
    Der größte Meeresnaturpark des französischen Mutterlandes (6.800 km²), der die unberührte Macchie der
    Agriaten und die Genuesertürme des Cap Corse schützt.
  it: >-
    Il maggiore parco naturale marino della Francia metropolitana (6.800 km²), che protegge la macchia vergine
    del Deserto delle Agriate e le torri genovesi di Cap Corse.
  pt: >-
    O maior parque natural marinho da França metropolitana (6.800 km²), preservando o matagal intocado do
    Deserto dos Agriates e as torres genovesas de Cap Corse.
unico:
  es: >-
    Un mar de praderas de posidonia y atolones de coralígeno, con gaviotas de Audouin criando en islotes y, en
    tierra, un «desierto» que no lo es.
  en: >-
    A seascape of seagrass meadows and coralligenous atolls, with Audouin's gulls nesting on islets and,
    ashore, a celebrated «desert» that is anything but.
  fr: >-
    Une mer d'herbiers de posidonies et d'atolls coralligènes, des goélands d'Audouin nichant sur des îlots
    et, à terre, un « désert » qui n'en est pas un.
  de: >-
    Ein Meer aus Posidonia-Seegraswiesen und Korallengenen-Atollen, brütenden Korallenmöwen auf Felseninseln
    und, an Land, einer «Wüste», die keine ist.
  it: >-
    Un mare di praterie di posidonia e atolli coralligeni, gabbiani corsi che nidificano sugli isolotti e, a
    terra, un celebre «deserto» che tale non è.
  pt: >-
    Um mar de pradarias de posidónia e atóis de coralígeno, gaivotas-de-audouin a nidificar em ilhéus e, em
    terra, um «deserto» que de facto não o é.
observaciones:
  es: >-
    En las pistas de los Agriates el principal riesgo es el incendio. Los paneles de cada entrada indican el
    nivel de riesgo, que puede llegar al cierre de la pista. En las islas del Cap Corse, además de la veda del
    1 de marzo al 31 de agosto, queda prohibido desembarcar y el fondeo está vetado todo el año en 200 m a la
    redonda.
texto:
  es:
    intro: >-
      Este parque casi no se pisa: se mira desde la costa, se navega o se explora con tubo y gafas. El Parque
      Natural Marino del Cap Corse y del Agriate nació el 15 de julio de 2016 como el octavo de su clase en
      Francia y se extiende desde las costas del Cap Corse y de los Agriates hasta un centenar de kilómetros
      mar adentro frente a la Balagne. Son 6.830 km², el mayor de la Francia metropolitana, con un mar que
      cambia de carácter según miras al este o al oeste del cabo.
    landscape: >-
      El secreto está bajo la superficie. Al este del cabo, frente a la Giraglia, se extiende una amplia
      plataforma continental; al oeste se abren cañones submarinos. Ese contraste explica la variedad de
      hábitats: praderas de [posidonia](/especie/posidonia_oceanica/) y cymodocea, rodolitos, plataformas de
      Lithophyllum y coralígeno, hasta formaciones tan raras como los atolones de coralígeno. Esos hábitats
      dan refugio y alimento a la langosta roja, el dentón común y el bogavante europeo, y por el parque pasan
      migradores como el atún rojo, la serviola y el pez espada.


      En tierra, el Cap Corse es una península de esquistos de unos 40 km de largo de norte a sur y de 10 a 15
      km de ancho. Al norte, una masa de gabros y peridotitas forma la piedra verde conocida como serpentina,
      que dibuja cumbres y promontorios. Más al oeste, entre Saint-Florent y la Balagne, están los Agriates:
      37 km de litoral virgen. El monte Genova, un inselberg de gneis, debe su silueta a un proceso geológico
      de la era terciaria que comprimió el granito hercínico.


      La vegetación es de maquis: madroños, brezos, mirtos, jaras, lentiscos, encinas y olivos, más pinos
      marítimos plantados a mediados del siglo XX. El verano es muy caluroso, con viento seco y cálido; las
      lluvias son escasas y suelen caer en tormentas.
    wildlife: >-
      Entre los habitantes de interés del parque hay mero pardo, corbina, langosta, cigarra de mar, erizo
      violeta, caballito de mar, delfín y rorcual, y sus hábitats sirven de refugio al angelote. Los grandes
      cetáceos también pasan por el parque, y al mar le toca el turno de la observación respetuosa: no te
      acerques a propósito a los animales ni bloquees su trayectoria si nadas, vas en paddle o en kayak.


      Arriba, el cielo cuenta otra historia. En la primavera, el paso migratorio y los islotes del norte del
      Cap Corse ofrecen refugio, descanso, alimento y lugar de cría a las aves marinas. En la punta del cabo
      hay poblaciones de [gaviota de Audouin](/especie/larus_audouinii/), [cormorán
      moñudo](/especie/phalacrocorax_aristotelis/), pardela cenicienta y [águila
      pescadora](/especie/pandion_haliaetus/). Si los miras, hazlo en silencio y a distancia, y respeta las
      zonas de tranquilidad alrededor de los nidos de águila pescadora.


      Las islas del Cap Corse ocupan 66 hectáreas con tres islotes al noreste del cabo y dos islas cercanas.
      Ahí cría la gaviota de Audouin, endémica del Mediterráneo, y viven el lagarto tirreno, endémico del
      archipiélago, y el Phyllodactylus europaeus. Del 1 de marzo al 31 de agosto están cerradas al público.
    visit: >-
      Los Agriates se recorren a pie por la costa. Una senda litoral, el «sendero de los aduaneros», sigue la
      costa, y completarla lleva de dos a tres días. En la ruta hay refugios pastoriles (pagliaghji) en Alga
      Putrica y Ghignu. Si prefieres llegar a una playa en concreto, una pista de 12 km sale de Casta hasta
      Saleccia, y desde Saint-Florent salen lanchas a las playas de Lotu y Saleccia.


      También hay salidas educativas: con el proyecto Amparà u mare, el parque organizó una salida de snorkel
      en Miomu para niños, al terminar tres sesiones de sensibilización sobre el mar. Mayo a octubre es la
      mejor época.
    history: >-
      Los Agriates no siempre fueron un «desierto». Fue un nombre que les pusieron turistas británicos de la
      Belle Époque, aunque esas tierras fueron nutricias durante siglos. Tras la guerra de 1914-1918, la
      población corsa perdió a muchos jóvenes y las tierras de cultivo quedaron abandonadas, y así se fueron
      «desertando». Hoy son una reserva de biodiversidad donde han encontrado casa muchas especies raras.


      La costa conserva su memoria defensiva: tres torres genovesas, hoy en ruinas, vigilaban los extremos de
      la costa, Mortella y Fornali al este y Ostriconi al oeste, y en el Cap Corse había diez torres en 1530 y
      treinta en 1730. Cerca del monte Rivincu hay dos dólmenes, y uno de ellos, a Casa di l'Orcu, «la casa
      del ogro», es monumento histórico. En Canari se extrajo amianto a cielo abierto de 1935 a 1965.


      El parque se enmarca en una estrategia que busca proteger el 15 % de las aguas marinas corsas. Su
      consejo de gestión reúne a 49 representantes de entidades locales, estatales, marítimas, ambientales,
      culturales y científicas, y sus seis ejes incluyen conservar especies emblemáticas, mejorar la calidad
      del agua y fomentar actividades marítimas sostenibles.
    before: >-
      En las pistas de los Agriates el principal riesgo es el incendio. Los paneles de cada entrada indican el
      nivel de riesgo, que puede llegar al cierre de la pista. En las islas del Cap Corse, además de la veda
      del 1 de marzo al 31 de agosto, queda prohibido desembarcar y el fondeo está vetado todo el año en 200 m
      a la redonda.
    around: >-
      El [Parc naturel régional de Corse](/lugar/parc-naturel-regional-de-corse/) queda a unos 19 km. Más
      lejos, el [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), el [Parco Nazionale
      dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/) y el [Parc Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) comparten con este parque costa y mar y especies como la
      pardela yelkouan y el delfín mular.
  en:
    intro: >-
      This park is scarcely stepped upon: you observe it from the headlands, sail across its waters, or
      explore its depths with mask and snorkel. The Cap Corse and Agriate Marine Natural Park was established
      on 15 July 2016 as the eighth marine park of its kind in France, stretching from the shorelines of Cap
      Corse and the Agriates nearly a hundred kilometres offshore facing the Balagne. Encompassing 6,830 km²,
      it is the largest in metropolitan France, spanning waters whose moods shift sharply between the eastern
      and western coasts of the peninsula.
    landscape: >-
      The essential wealth lies beneath the waves. East of the cape facing La Giraglia stretches a broad
      continental shelf; to the west, submarine canyons plunge into the abyss. This contrast fosters an
      exceptional array of marine habitats: meadows of [posidonia](/especie/posidonia_oceanica/) and
      cymodocea, maerl beds, Lithophyllum rims, and coralligenous reefs, including formations as rare as
      coralligenous atolls. These habitats shelter and nourish Mediterranean red spiny lobster, common dentex,
      and European lobster, while open pelagic corridors see the transit of Atlantic bluefin tuna, greater
      amberjack, and swordfish.


      Ashore, Cap Corse is a schist peninsula extending roughly 40 km from north to south and 10 to 15 km
      across. To the north, a massive intrusion of gabbros and peridotites produces the characteristic green
      rock known as serpentinite, sculpting jagged crests and sea promontories. Farther west between
      Saint-Florent and the Balagne lie the Agriates: 37 km of untamed, roadless coastline. Mont Genova, a
      distinctive gneiss inselberg, owes its silhouette to Tertiary-era tectonic forces compressing the
      Hercynian granite basement.


      The terrestrial vegetation is classic Corsican maquis: strawberry tree, tree heath, myrtle, cistus,
      mastic, holm oak, and wild olive, supplemented by maritime pines planted in the middle of the twentieth
      century. Summers are arid and scorching, swept by warm, desiccating winds, with rainfall arriving
      largely as violent thunderstorms.
    wildlife: >-
      The underwater fauna encompasses brown grouper, brown meagre, spiny lobster, Mediterranean slipper
      lobster, violet sea urchin, short-snouted seahorse, bottlenose dolphin, and fin whale, while deep shelf
      breaks provide a refuge for the angelshark. Great cetaceans regularly migrate through park waters; when
      encountering marine mammals, respectful observation is mandatory: never approach animals deliberately or
      impede their trajectory when swimming, paddleboarding, or kayaking.


      Above, the sky hosts a vibrant story. In spring, migratory flyways and the northern islets of Cap Corse
      offer sanctuary, feeding, and breeding grounds for marine avifauna. The northern tip sustains nesting
      colonies of [Audouin's gull](/especie/larus_audouinii/), [European
      shag](/especie/phalacrocorax_aristotelis/), Scopoli's shearwater, and the
      [osprey](/especie/pandion_haliaetus/). When observing them, remain quiet and maintain distance,
      observing peace perimeters around osprey eyries.


      The Îles du Cap Corse encompass 66 hectares, comprising three rocky islets to the northeast and two
      offshore islands. Here breeds Audouin's gull, endemic to the Mediterranean, alongside the Tyrrhenian
      wall lizard and the European leaf-toed gecko. From 1 March to 31 August, all landing is prohibited.
    visit: >-
      The Agriates are best explored on foot along the shoreline. The coastal customs trail (sentier des
      douaniers) follows the wild coast, taking between two and three days to complete. Traditional shepherd
      dry-stone huts (pagliaghji) provide basic shelter at Alga Putrica and Ghignu. If you wish to reach a
      specific beach, an unpaved 12 km track leads from Casta to Saleccia, while water taxis depart
      Saint-Florent for Lotu and Saleccia beaches.


      Educational outings are also offered: under the Amparà u mare initiative, the park ran a youth
      snorkelling excursion in Miomu following three classroom marine education sessions. May through October
      offers the best conditions.
    history: >-
      The Agriates were not always a «desert». The moniker was coined by British travellers during the Belle
      Époque, despite the land having sustained productive agriculture for centuries. Following the 1914-1918
      war, Corsica suffered heavy casualties among its young rural workforce; cultivated terraces were
      abandoned and the land gradually reverted to scrub, becoming «deserted» in the social sense. Today it
      represents a prized biodiversity reservoir sheltering rare species.


      The coast preserves a defensive network: three Genoese watchtowers, now ruined, guarded coastal
      extremities—Mortella and Fornali to the east, and Ostriconi to the west—while Cap Corse numbered ten
      watchtowers in 1530 and thirty in 1730. Near Monte Rivincu stand two megalithic dolmens, one of which, a
      Casa di l'Orcu («the ogre's house»), is a classified historic monument. At Canari, open-cast asbestos
      mining operated between 1935 and 1965.


      The marine park anchors a regional strategy to protect 15 % of Corsican coastal waters. Its management
      board convenes 49 representatives from local authorities, state agencies, maritime professions,
      environmental bodies, and scientific institutions, steering six core priorities that include protecting
      flagship species, enhancing water quality, and promoting sustainable maritime heritage.
    before: >-
      Along the unpaved tracks of the Agriates, wildfire is the primary danger. Information boards at each
      trailhead display current fire hazard levels, which can lead to complete track closures. Around the Îles
      du Cap Corse, beyond the seasonal landing ban from 1 March to 31 August, all unauthorized landing is
      banned, and maritime anchoring is prohibited year-round within 200 m of the islands.
    around: >-
      The [Parc naturel régional de Corse](/lugar/parc-naturel-regional-de-corse/) lies approximately 19 km
      away. Farther afield, [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), [Parco Nazionale
      dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/), and [Parc Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) share coastal waters and species such as the yelkouan
      shearwater and common bottlenose dolphin.
  fr:
    intro: >-
      Ce parc ne se foule pour ainsi dire pas : on le contemple depuis la rive, on le navigue ou on l'explore
      avec palmes, masque et tuba. Le parc naturel marin du Cap Corse et de l'Agriate a vu le jour le 15
      juillet 2016 comme huitième parc de ce type en France, s'étirant depuis les rivages du Cap Corse et des
      Agriates jusqu'à une centaine de kilomètres au large face à la Balagne. Il totalise 6 830 km², ce qui en
      fait le plus vaste de France métropolitaine, baignant des eaux dont le tempérament change profondément
      selon que l'on regarde à l'est ou à l'ouest du cap.
    landscape: >-
      La richesse réside sous la surface. À l'est du cap, face à la Giraglia, s'étend un large plateau
      continental ; à l'ouest s'ouvrent des canyons sous-marins abrupts. Ce contraste explique l'éventail des
      écosystèmes : herbiers de [posidonie](/especie/posidonia_oceanica/) et de cymodocée, lits de maërl,
      platiers à Lithophyllum et récifs coralligènes, jusqu'à des formations aussi exceptionnelles que des
      atolls coralligènes. Ces milieux servent de refuge et de nourricerie à la langouste rouge, au denti et
      au homard européen, tandis que les couloirs du large voient passer thon rouge, sériole et espadon.


      Côté terre, le Cap Corse est une presqu'île schisteuse d'environ 40 km de long du nord au sud sur 10 à
      15 km de large. Au nord, une masse de gabbros et de péridotites donne naissance à la roche verte dite
      serpentine, façonnant crêtes et promontoires maritimes. Plus à l'ouest, entre Saint-Florent et la
      Balagne, s'étendent les Agriates : 37 km de littoral préservé. Le monte Genova, un inselberg de gneiss,
      doit son relief à un processus géologique tertiaire ayant comprimé le socle granitique hercynien.


      La végétation est un maquis dense : arbousiers, bruyères arborescentes, myrtes, cistes, lentisques,
      chênes verts et oliviers sauvages, auxquels s'ajoutent des pins maritimes plantés au milieu du XXe
      siècle. L'été est très chaud et secoué de vents chauds et asséchants ; les pluies sont rares et
      surviennent pour l'essentiel sous forme d'orages.
    wildlife: >-
      Les fonds marins abritent mérou brun, corb, langouste, grande cigale de mer, oursin violet, hippocampe
      moucheté, grand dauphin et rorqual commun, tandis que les fosses marines servent de sanctuaire à l'ange
      de mer. Les grands cétacés sillonnent régulièrement les parages : en mer, adoptez une observation
      respectueuse, sans jamais vous approcher délibérément ni couper la trajectoire des animaux à la nage, en
      paddle ou en kayak.


      Dans les airs, le spectacle est permanent. Au printemps, les couloirs migratoires et les îlots du nord
      du Cap Corse procurent repos, nourriture et quiétude pour la nidification aviaire. La pointe du cap
      abrite des colonies de [goéland d'Audouin](/especie/larus_audouinii/), de [cormoran
      huppé](/especie/phalacrocorax_aristotelis/), de puffin cendré et de [balbuzard
      pêcheur](/especie/pandion_haliaetus/). Observez-les à distance et en silence, en respectant les
      périmètres de quiétude établis autour des nids de balbuzards.


      Les îles du Cap Corse occupent 66 hectares, regroupant trois îlots au nord-est et deux îles proches. Y
      nidifie le goéland d'Audouin, endémique méditerranéen, aux côtés du lézard tyrrhénien et de l'euléptote
      d'Europe. Du 1 mars au 31 août, tout débarquement y est prohibé.
    visit: >-
      Les Agriates se découvrent à pied en longeant le rivage. Le sentier des douaniers serpente sur la côte
      vierge et requiert deux à trois jours de randonnée complète. Des abris traditionnels en pierre sèche
      (pagliaghji) ponctuent la traversée à Alga Putrica et Ghignu. Pour rejoindre directement une crique, une
      piste carrossable de 12 km relie Casta à la plage de Saleccia, tandis que des navettes maritimes partent
      de Saint-Florent vers Lotu et Saleccia.


      Des actions pédagogiques sont également menées : avec le projet Amparà u mare, le parc a initié des
      écoliers au snorkeling à Miomu à l'issue de trois séances de sensibilisation en classe. De mai à octobre
      s'étend la période idéale.
    history: >-
      Les Agriates ne furent pas toujours un « désert ». Ce qualificatif fut popularisé par des voyageurs
      britanniques de la Belle Époque, alors que ce terroir nourrit les hommes pendant des siècles. Après la
      guerre de 1914-1918, la Corse déplora la perte de nombreux jeunes paysans ; les terres labourées furent
      délaissées et le maquis reprit ses droits, créant un désert humain. C'est devenu aujourd'hui une
      remarquable réserve de biodiversité.


      Le littoral a conservé son passé militaire : trois tours génoises en ruine surveillaient les extrémités
      côtières — Mortella et Fornali à l'est, Ostriconi à l'ouest —, tandis que le Cap Corse comptait dix
      tours en 1530 et trente en 1730. Près du monte Rivincu s'élèvent deux dolmens, dont a Casa di l'Orcu («
      la maison de l'ogre »), classé monument historique. À Canari, l'amiante fit l'objet d'une exploitation à
      ciel ouvert de 1935 à 1965.


      Le parc s'inscrit dans une politique visant à protéger 15 % des eaux côtières corses. Son conseil de
      gestion réunit 49 représentants des collectivités, de l'État, des professionnels maritimes et des
      scientifiques, articulant ses actions autour de six axes stratégiques.
    before: >-
      Sur les pistes des Agriates, le risque majeur est l'incendie. Des panneaux à chaque point d'entrée
      précisent le niveau de danger pouvant entraîner la fermeture des accès. Autour des îles du Cap Corse,
      outre l'interdiction de débarquer du 1 mars au 31 août, le mouillage des embarcations est interdit toute
      l'année dans un rayon de 200 m.
    around: >-
      Le [Parc naturel régional de Corse](/lugar/parc-naturel-regional-de-corse/) se trouve à environ 19 km.
      Plus au large, le [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), le [Parco Nazionale
      dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/) et le [Parc Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) partagent espèces marines et rivages préservés.
  de:
    intro: >-
      Diesen Naturpark betritt man kaum: Man bewundert ihn von den Klippen aus, befährt ihn mit Booten oder
      taucht mit Schnorchel und Maske ein. Der Meeresnaturpark Cap Corse und Agriate wurde am 15. Juli 2016
      als achter Meerespark Frankreichs gegründet und reicht von den Ufern des Cap Corse und der Agriaten bis
      zu rund hundert Kilometer aufs offene Meer hinaus vor die Balagne. Er umfasst 6.830 km² und ist damit
      der größte im europäischen Frankreich, mit Meeresgebieten, die sich östlich und westlich der Halbinsel
      grundlegend unterscheiden.
    landscape: >-
      Das eigentliche Geheimnis liegt unter der Wasseroberfläche. Östlich des Kaps vor der Insel Giraglia
      dehnt sich ein breiter Kontinentalschelf aus; im Westen fallen tiefe Unterwasserschluchten ab. Dieser
      Kontrast begründet eine enorme Vielfalt an Lebensräumen: Seegraswiesen aus
      [Posidonia](/especie/posidonia_oceanica/) und Cymodocea, Kalkalgenbänke, Lithophyllum-Säume und
      Koralligengemeinschaften bis hin zu seltenen Koralligen-Atollen. Sie bieten Roter Languste, Zahnbrasse
      und Europäischem Hummer Nahrung und Zuflucht, während pelagische Arten wie Roter Thun,
      Gelbschwanzmakrele und Schwertfisch durch den Park ziehen.


      An Land bildet das Cap Corse eine Schieferhalbinsel von etwa 40 km Länge von Nord nach Süd und 10 bis 15
      km Breite. Im Norden formt ein Gabbro- und Peridotit-Massiv das grünliche Serpentinitgestein, das Kämme
      und Kaps prägt. Weiter westlich zwischen Saint-Florent und der Balagne liegen die Agriaten: 37 km
      naturbelassene Küste. Der Monte Genova, ein Gneis-Inselberg, verdankt seine Form tertiären
      Faltungsprozessen des hercynischen Urgranits.


      Die Pflanzenwelt besteht aus klassischer Macchie: Erdbeerbaum, Baumheide, Myrte, Zistrosen,
      Mastixstrauch, Steineiche und wilder Ölbaum, ergänzt durch Mitte des zwanzigsten Jahrhunderts gepflanzte
      Seekiefern. Der Sommer ist sehr heiß und trocken, geprägt von warmen Winden; Niederschläge fallen fast
      ausschließlich bei Gewittern.
    wildlife: >-
      Unter Wasser leben Brauner Zackenbarsch, Meerrabe, Languste, Bärenkrebs, Violetter Seeigel,
      Seepferdchen, Großer Tümmler und Finnwal, während Meerestiefen dem vom Aussterben bedrohten Meerengel
      Zuflucht gewähren. Auch Großwale queren regelmäßig das Schutzgebiet: Verhalte dich auf dem Wasser stets
      rücksichtsvoll, nähere dich Meeressäugern nicht absichtlich und schneide ihnen beim Schwimmen, Paddeln
      oder Kajakfahren nicht den Weg ab.


      Am Himmel vollzieht sich ein anderes Schauspiel: Im Frühjahr bieten Zugrouten und die Felsinseln im
      Norden des Kaps Rast und Brutplätze für Meeresvögel. An der Nordspitze brüten Kolonien der
      [Korallenmöwe](/especie/larus_audouinii/), der [Krähenscharbe](/especie/phalacrocorax_aristotelis/), des
      Gelbschnabel-Sturmtauchers und des [Fischadlers](/especie/pandion_haliaetus/). Halte Abstand und wahre
      Ruhe rund um die Nistzonen der Fischadler.


      Die Îles du Cap Corse umfassen 66 Hektar auf drei Eilanden im Nordosten und zwei küstennahen Inseln.
      Hier nistet die im Mittelmeer endemische Korallenmöwe neben der Tyrrhenischen Gebirgseidechse und dem
      Europäischen Blattfingergecko. Vom 1. März bis zum 31. August ist jedes Betreten untersagt.
    visit: >-
      Die Agriaten lassen sich am besten zu Fuß an der Küste entlang erwandern. Der Zöllnerpfad (sentier des
      douaniers) folgt der unberührten Küstenlinie; die gesamte Strecke erfordert zwei bis drei Tage.
      Hirtenhütten aus Trockenmauerwerk (pagliaghji) dienen bei Alga Putrica und Ghignu als Notunterkünfte.
      Wer gezielt einen Strand aufsuchen möchte, wählt die 12 km lange Naturpiste von Casta nach Saleccia;
      zudem verkehren ab Saint-Florent Ausflugsboote nach Lotu und Saleccia.


      Ergänzend gibt es Bildungsinitiativen: Im Rahmen des Projekts Amparà u mare organisierte der Park nach
      drei theoretischen Schulungen eine Schnorchelexkursion für Schulkinder in Miomu. Mai bis Oktober ist die
      ideale Reisezeit.
    history: >-
      Die Agriaten waren nicht immer eine «Wüste». Diese Bezeichnung prägten britische Reisende der Belle
      Époque, obwohl die Böden über Jahrhunderte intensiv bewirtschaftet wurden. Nach dem Ersten Weltkrieg von
      1914-1918 verlor Korsika viele junge Bauern; Äcker verfielen, die Macchie überwucherte das Land und es
      verödete im menschlichen Sinn. Heute bilden die Agriaten ein kostbares Biodiversitätsrefugium.


      Die Küste erinnert an militärische Wachdienste: Drei verfallene Genuesertürme überwachten die Buchten —
      Mortella und Fornali im Osten, Ostriconi im Westen —, während das Cap Corse im Jahr 1530 zehn Türme und
      1730 dreißig Türme zählte. Nahe dem Monte Rivincu stehen zwei Dolmen, darunter a Casa di l'Orcu («Haus
      des Ogers»), ein geschütztes Kulturdenkmal. In Canari wurde von 1935 bis 1965 Asbest im Tagebau
      abgebaut.


      Der Park fügt sich in die Strategie ein, 15 % der korsischen Küstengewässer zu schützen. Sein
      Verwaltungsrat vereint 49 Vertreter aus Kommunen, Staat, Schifffahrt, Fischerei und Wissenschaft mit
      sechs strategischen Leitzielen.
    before: >-
      Auf den Naturpisten der Agriaten besteht erhebliche Waldbrandgefahr. Informationstafeln an den Eingängen
      zeigen die aktuelle Gefahrenstufe an, die bis zur Vollsperrung führen kann. Auf den Inseln des Cap Corse
      ist das Betreten vom 1. März bis zum 31. August verboten, und das Ankern mit Booten ist ganzjährig in
      einem Umkreis von 200 m untersagt.
    around: >-
      Der [Parc naturel régional de Corse](/lugar/parc-naturel-regional-de-corse/) liegt etwa 19 km entfernt.
      In weiterer Entfernung teilen der [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), der
      [Parco Nazionale dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/) und der [Parc
      Natural del Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) Meeresräume und Arten wie den Großen
      Tümmler.
  it:
    intro: >-
      Questo parco quasi non si calpesta: lo si contempla dalle scogliere, lo si naviga in barca o lo si
      esplora con maschera e boccaglio. Il Parco Naturale Marino di Cap Corse e dell'Agriate è nato il 15
      luglio 2016 come ottava riserva marina di questo genere in Francia, allungandosi dalle coste del Capo e
      delle Agriate fino a un centinaio di chilometri al largo della Balagne. Copre 6.830 km², risultando il
      più esteso della Francia metropolitana, in un mare che cambia volto a seconda che si guardi a oriente o
      a occidente del promontorio.
    landscape: >-
      Il fascino maggiore giace sotto il pelo dell'acqua. A est del promontorio, davanti alla Giraglia, si
      allarga un esteso ripiano continentale; a ovest sprofondano vertiginosi canyon sottomarini. Questo netto
      contrasto genera una miriade di ambienti: praterie di [posidonia](/especie/posidonia_oceanica/) e
      cimodocea, fondi a maërl, cordoni di Lithophyllum e scogliere coralligene fino a rari atolli
      coralligeni. Questi habitat nutrono e rifugiano l'aragosta rossa, il dentice comune e l'astice europeo,
      mentre in mare aperto sfilano migratori come il tonno rosso, la ricciola e il pesce spada.


      Sulla terraferma, Cap Corse è una penisola scistosa lunga circa 40 km da nord a sud e larga da 10 a 15
      km. Verso nord, una massa di gabbri e peridotiti genera la tipica roccia verde detta serpentinite, che
      modella creste e picchi costieri. Più a occidente, tra Saint-Florent e la Balagne, si dispiegano le
      Agriate: 37 km di costa incontaminata. Il monte Genova, inselberg di gneiss, deve la sua forma a una
      compressione geologica terziaria sul granito ercinico.


      La vegetazione è una fitta macchia mediterranea: corbezzoli, erica arborea, mirto, cisti, lentisco,
      leccio e olivastro, arricchita da pini marittimi messi a dimora a metà del Novecento. L'estate è torrida
      e percorsa da venti caldi e asciutti; le precipitazioni sono rare e si manifestano per lo più con
      violenti temporali.
    wildlife: >-
      Sui fondali si incontrano cernia bruna, corvina, aragosta, cicala di mare, riccio femmina, cavalluccio
      marino, tursiope e balenottera comune, mentre gli abissi fungono da rifugio per il rarissimo squadro. I
      grandi cetacei solcano regolarmente queste acque: mantieni un atteggiamento rispettoso, non avvicinarti
      di proposito agli animali e non ostacolare le loro rotte nuotando o pagaiando in kayak o paddle.


      In cielo la natura offre un altro spettacolo. In primavera le rotte migratorie e gli isolotti
      settentrionali del Capo offrono sosta, nutrimento e siti di cova agli uccelli marini. Sulla punta
      nidificano il [gabbiano corso](/especie/larus_audouinii/), il [marangone dal
      ciuffo](/especie/phalacrocorax_aristotelis/), la berta maggiore e il [falco
      pescatore](/especie/pandion_haliaetus/). Se li ammiri, fallo a distanza e in silenzio, rispettando le
      zone di rispetto attorno ai nidi del falco pescatore.


      Le isole del Cap Corse coprono 66 ettari con tre scogli a nord-est e due isole vicine alla riva. Qui si
      riproduce il gabbiano corso, endemico del Mediterraneo, e vivono la lucertola tirrenica e il geco
      tarantolino. Dal 1 marzo al 31 agosto è vietato qualsiasi sbarco.
    visit: >-
      Le Agriate si scoprono a piedi lungo la litoranea. Il sentiero dei doganieri costeggia il mare selvaggio
      e richiede da due a tre giorni per il periplo completo. Storici ricoveri pastorali in pietra a secco
      (pagliaghji) offrono riparo ad Alga Putrica e Ghignu. Per raggiungere direttamente una baia, una pista
      sterrata di 12 km scende da Casta a Saleccia, mentre battelli turistici collegano Saint-Florent alle
      spiagge di Lotu e Saleccia.


      Si tengono anche uscite didattiche: con il progetto Amparà u mare il parco ha curato un'uscita di
      snorkeling a Miomu per bambini dopo tre incontri di sensibilizzazione a scuola. Da maggio a ottobre si
      vive il momento ideale.
    history: >-
      Le Agriate non furono sempre un «deserto». Questo toponimo fu attribuito dai viaggiatori britannici
      della Belle Époque, sebbene il comprensorio sia stato intensamente coltivato per generazioni. Dopo il
      conflitto del 1914-1918 la Corsica perse molti giovani braccianti; i campi terrazzati furono abbandonati
      e la macchia riprese possesso dei terreni, provocando un vero spopolamento. Oggi rappresentano una
      formidabile riserva di biodiversità.


      La costa conserva torri difensive genovesi: tre bastioni in rovina sorvegliavano i capi costieri —
      Mortella e Fornali a oriente, Ostriconi a occidente —, mentre nel Cap Corse si contavano dieci torri nel
      1530 e trenta nel 1730. Presso il monte Rivincu sorgono due dolmen megalitici, tra cui a Casa di l'Orcu
      («la casa dell'orco»), classificato monumento storico. A Canari l'amianto fu estratto a cielo aperto tra
      il 1935 e il 1965.


      Il parco concorre al piano di tutela del 15 % delle acque marine corse. Il suo consiglio direttivo
      riunisce 49 membri tra istituzioni, comparto marittimo e comitato scientifico con sei linee
      programmatiche.
    before: >-
      Lungo le piste delle Agriate il pericolo primario è il fuoco. Cartelli all'ingresso segnalano il grado
      di allerta antincendio, che può comportare la chiusura dei varchi. Attorno alle isole del Cap Corse,
      oltre al divieto di sbarco dal 1 marzo al 31 agosto, l'ancoraggio nautico è interdetto tutto l'anno
      entro 200 m di raggio.
    around: >-
      Il [Parc naturel régional de Corse](/lugar/parc-naturel-regional-de-corse/) dista circa 19 km. Più
      distanti, il [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), il [Parco Nazionale
      dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/) e il [Parc Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) condividono acque costiere e mammiferi come il tursiope.
  pt:
    intro: >-
      Este parque quase não se pisa: contempla-se do alto das arribas, navega-se à vela ou explora-se de
      máscara e tubo. O Parque Natural Marinho de Cap Corse e Agriate nasceu a 15 de julho de 2016 como o
      oitavo parque marinho deste género em França, estendendo-se desde o litoral do Cabo e dos Agriates até
      cerca de cem quilómetros ao largo em frente à Balagne. São 6.830 km², o maior da França continental,
      abrangendo águas cujo temperamento varia profundamente entre a vertente oriental e a ocidental da
      península.
    landscape: >-
      O verdadeiro tesouro repousa sob a superfície do mar. A leste do cabo, em frente à Giraglia, prolonga-se
      uma ampla plataforma continental; a oeste abrem-se desfiladeiros submarinos vertiginosos. Este contraste
      determina a diversidade de habitats: pradarias de [posidónia](/especie/posidonia_oceanica/) e de seba,
      fundos de maërl, plataformas de Lithophyllum e formações coralígenas, incluindo atóis de coralígeno
      muito raros. Estes recifes acolhem e alimentam a lagosta-vermelha, o capatão-legítimo e o lavagante,
      enquanto pelas águas oceânicas cruzam espécies migradoras como o atum-rabilho, o charuteiro e o
      peixe-espada.


      Em terra, o Cap Corse é uma península de xistos com cerca de 40 km de extensão de norte a sul e de 10 a
      15 km de largura. No setor setentrional, uma massa de gabros e peridotitos origina a rocha verde chamada
      serpentinito, desenhando cumes e promontórios escarpados. Mais para poente, entre Saint-Florent e a
      Balagne, situam-se os Agriates: 37 km de costa selvagem sem estradas. O monte Genova, um inselberg de
      gnaisse, deve a sua forma a uma compressão tectónica da era terciária sobre o granito hercínico.


      A vegetação terrestre é o maquis típico da Córsega: medronheiro, urze-molar, murta, estevas, aroeira,
      azinheira e zambujeiro, a que se somam pinheiros-bravos plantados em meados do século XX. O verão é
      tórrido e fustigado por ventos quentes e secos; as chuvas são raras e ocorrem sobretudo em forma de
      temporais.
    wildlife: >-
      O fundo marinho alberga mero-legítimo, corvina-legítima, lagosta, cavaco, ouriço-do-mar-violeta,
      cavalo-marinho-de-focinho-curto, golfinho-roaz e baleia-comum, servindo as fossas abissais de refúgio ao
      tubarão-anjo. Os grandes cetáceos cruzam regularmente a área do parque: adota uma conduta respeitosa no
      mar, nunca te aproximando deliberadamente dos animais nem cortando a sua trajetória em natação, paddle
      ou caiaque.


      No ar, a paisagem ganha outra dimensão. Na primavera, os corredores migratórios e os ilhéus do norte do
      Cabo oferecem abrigo, alimento e tranquilidade reprodutiva à avifauna marinha. Na ponta setentrional
      nidificam colónias de [gaivota-de-audouin](/especie/larus_audouinii/),
      [corvo-marinho-de-crista](/especie/phalacrocorax_aristotelis/), cagarra-mediterrânica e
      [águia-pesqueira](/especie/pandion_haliaetus/). Observa-as à distância e em silêncio, cumprindo as áreas
      de tranquilidade em torno dos ninhos da águia-pesqueira.


      As ilhas do Cap Corse totalizam 66 hectares distribuídos por três ilhéus a nordeste e duas ilhas
      próximas. Aí nidifica a gaivota-de-audouin, endémica do Mediterrâneo, e vivem a lagartixa-tirrénica e a
      osga-das-rochas. De 1 de março a 31 de agosto é proibido qualquer desembarque.
    visit: >-
      Os Agriates percorrem-se a pé pela linha de costa. O trilho dos alfandegários acompanha a orla selvagem
      e requer dois a três dias de caminhada para a travessia integral. Abrigos pastoris em pedra seca
      (pagliaghji) facultam refúgio em Alga Putrica e Ghignu. Para aceder diretamente a uma enseada, uma pista
      de terra batida de 12 km desce de Casta até Saleccia, partindo também barcos de Saint-Florent para as
      praias de Lotu e Saleccia.


      O parque organiza ainda ações de educação marinha: com o projeto Amparà u mare promoveu uma saída de
      snorkeling em Miomu para crianças após três sessões de sensibilização em sala de aula. Maio a outubro
      corresponde à época recomendada.
    history: >-
      Os Agriates nem sempre foram um «deserto». Essa designação foi cunhada por viajantes britânicos da Belle
      Époque, apesar de estas terras terem sustentado lavoura durante séculos. Após o conflito de 1914-1918 a
      Córsega perdeu grande parte da sua juventude rural; os campos foram abandonados e o maquis retomou o
      espaço, provocando um despovoamento humano. Hoje constituem uma magnífica reserva de biodiversidade.


      A costa conserva baluartes de defesa genovesa: três torres em ruínas vigiavam os extremos da costa —
      Mortella e Fornali a leste, Ostriconi a oeste —, ao passo que no Cap Corse existiam dez torres em 1530 e
      trinta em 1730. Perto do monte Rivincu erguem-se dois dólmenes megalíticos, um dos quais, a Casa di
      l'Orcu («a casa do ogre»), está classificado como monumento histórico. Em Canari explorou-se amianto a
      céu aberto entre 1935 e 1965.


      O parque integra a meta de conservação de 15 % das águas marinhas da Córsega. O seu conselho diretivo
      reúne 49 representantes de autarquias, serviços estatais, agentes marítimos e entidades científicas em
      torno de seis eixos estratégicos.
    before: >-
      Nas pistas dos Agriates o perigo primordial é o incêndio florestal. Painéis à entrada indicam o índice
      de risco diário, que pode determinar a interdição de acesso. Junto às ilhas do Cap Corse, para além da
      proibição de desembarque de 1 de março a 31 de agosto, a fundeação de embarcações está vedada o ano
      inteiro num raio de 200 m.
    around: >-
      O [Parc naturel régional de Corse](/lugar/parc-naturel-regional-de-corse/) situa-se a cerca de 19 km.
      Mais ao largo, o [Parc national de Port-Cros](/lugar/parc-national-de-port-cros/), o [Parco Nazionale
      dell'Arcipelago Toscano](/lugar/parco-nazionale-arcipelago-toscano/) e o [Parc Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) partilham águas costeiras e espécies como o golfinho-roaz.
