resumen:
  es: Relieve kárstico, hayedos antiguos y pastizales de montaña en Velebit Norte.
  en: Karst relief, ancient beech forests and mountain pastures in Northern Velebit.
  fr: Relief karstique, hêtraies anciennes et pâturages d’altitude dans le nord du Velebit.
  de: Karstrelief, Urwald-Buchen und Hochweiden im Nördlichen Velebit.
  it: Rilievi carsici, faggete vetuste e pascoli d’alta quota nel Velebit settentrionale.
  pt: Relevo cársico, faiais ancestrais e pastagens de montanha no Velebit Setentrional.
unico:
  es: >-
    Aquí crecen hayedos primigenios sobre karst, de porte bajo y deformado, que la UNESCO inscribió en el
    Patrimonio Mundial en 2017, y bajo ellos se abre un laberinto de simas, tres de ellas de más de 1000
    metros de profundidad.
  en: >-
    Here grow primeval beech forests on karst, with stunted and twisted silhouettes, which UNESCO inscribed on
    the World Heritage list in 2017, and beneath them opens a labyrinth of vertical caves, three of them over
    1000 metres deep.
  fr: >-
    Ici prospèrent des hêtraies primaires sur calcaire karstique, aux troncs tortueux et trapus, inscrites au
    patrimoine mondial de l’UNESCO en 2017, sous lesquelles s’enfonce un dédale de gouffres verticaux dont
    trois dépassent 1000 mètres de profondeur.
  de: >-
    Hier wachsen uralte Buchenurwälder auf Karstgestein mit knorrigen, wettergebeugten Wuchsformen, die 2017
    von der UNESCO zum Weltnaturerbe erklärt wurden, und unter ihnen öffnet sich ein Labyrinth tiefer
    Schächte, von denen drei über 1000 Meter Tiefe erreichen.
  it: >-
    Qui allignano faggete primigenie su substrato carsico, dai fusti contorti e schiacciati dal vento,
    inserite nel Patrimonio Mondiale UNESCO nel 2017, al di sotto delle quali si spalanca un labirinto di
    inghiottitoi verticali, tre dei quali profondi oltre 1000 metri.
  pt: >-
    Aqui desenvolvem-se faiais primitivos sobre relevo cársico, de porte baixo e troncos retorcidos, inscritos
    pela UNESCO no Património Mundial em 2017, sob os quais se abre um labirinto de algares verticais, três
    deles com mais de 1000 metros de profundidade.
observaciones:
  es: >-
    Consulta la accesibilidad de las carreteras antes de ir: algunas pueden cerrar por acumulación de nieve,
    sobre todo en primavera y a final de otoño. Solo se puede caminar por los senderos señalizados, los perros
    deben ir atados y no se permite acampar.
texto:
  es:
    intro: >-
      Hay montañas que se miran y montañas que se recorren, y el Velebit norte es de las segundas. Una senda
      de piedra seca, construida entre 1930 y 1933 para que cualquiera pudiera adentrarse en la parte más
      agreste del macizo, cruza el parque de refugio en refugio, y a su alrededor se abre un mosaico de
      hayedos, pastizales, roquedos y simas. El Parque Nacional Sjeverni Velebit, el más joven de los ocho que
      tiene Croacia, se creó en 1999 sobre 109 km² que van de los 518 a los 1676 m de altitud.
    landscape: >-
      Todo empieza bajo el mar, hace 310 millones de años. El macizo se levantó con el plegamiento que comenzó
      hace unos 40 millones, hasta superar los 1700 m. El resultado es un relieve de caliza donde la lluvia
      desaparece en simas y dolinas: se conocen unas 500 formas subterráneas, el 98 % de ellas simas, y tres
      superan los 1000 metros de profundidad. Las cumbres de Hajdučki i Rožanski kukovi, en el centro del
      parque, son el mejor ejemplo, y su acceso está restringido a investigadores y visitas educativas.


      Más del 80 % del parque es bosque, repartido en pisos según la altitud. Si subes desde el mar por la
      vertiente costera, atraviesas primero roble pubescente y carpe, y el bosque va cambiando con la altura.
      Los pastizales muestran la huella del antiguo pastoreo; cuando el ganado desaparece, el matorral y el
      bosque los van cubriendo.


      La flora cuenta con más de 950 especies y subespecies de plantas, unas 40 endemismos estrictos. El
      Velebit es uno de los cuatro centros de endemismo de Croacia, porque tras las glaciaciones las plantas
      del frío quedaron aisladas en las cumbres.
    wildlife: >-
      Los grandes bosques conservados sirven de hábitat a los tres grandes carnívoros:
      [oso](/especie/ursus_arctos/), [lobo](/especie/canis_lupus/) y [lince](/especie/lynx_lynx/), señal de un
      ecosistema bien conservado. El lince, extinguido en Croacia a principios del siglo XX, volvió desde
      Eslovenia, donde se reintrodujo en 1973, y llegó a Croacia un año después. Entre los mamíferos más
      comunes están el [corzo](/especie/capreolus_capreolus/), el [ciervo](/especie/cervus_elaphus/), el
      [rebeco](/especie/rupicapra_rupicapra/) y el [jabalí](/especie/sus_scrofa/).


      Para las aves hay que mirar a los bosques y al cielo. El [urogallo](/especie/tetrao_urogallus/) tiene
      aquí uno de sus pocos refugios en Croacia y se ve sobre todo en caminos forestales y senderos de montaña
      cuando maduran los frutos del bosque. Entre las aves más interesantes figuran el [mochuelo
      chico](/especie/glaucidium_passerinum/), el mochuelo boreal, el [búho real](/especie/bubo_bubo/), el
      [cárabo uralense](/especie/strix_uralensis/), los picos [tridáctilo](/especie/picoides_tridactylus/) y
      [dorsiblanco](/especie/dendrocopos_leucotos/) y el [águila real](/especie/aquila_chrysaetos/).


      Bajo tierra vive la sanguijuela del Velebit, endémica del norte del Velebit: se descubrió en 1992 en la
      sima Lukina y vive en solo cuatro simas profundas del parque.


      El calendario de la montaña lo marca el clima. Cerca de Zavižan la primera nieve suele caer a mediados
      de octubre y la última a finales de mayo, y la estación meteorológica de Zavižan, a 1594 m, es la más
      alta de Croacia y funciona desde el 1 de octubre de 1953. En junio y julio florece la mayor parte del
      jardín botánico, y la temporada habitual de visita va de mayo a noviembre.
    visit: >-
      Krasno es la sede del parque y el punto de partida habitual. Babić Siča, a 1300 m, es la entrada
      principal para llegar a Zavižan y al jardín botánico; de allí a Zavižan hay 7 km de pista de tierra. En
      Krasno, la Casa del Velebit ocupa cuatro plantas, cuenta cómo el ser humano ha influido en la naturaleza
      del macizo y permite simular una exploración de la sima Lukina jama.


      Para caminar tienes cuatro planes:


      - La senda Premužić recorre 16 km dentro del parque. Casi no tiene subidas empinadas, así que sirve
      también a quien no está acostumbrado a la montaña. Desde Zavižan, el refugio Rossi queda a unas dos
      horas. Recorrer entera la senda entre los dos refugios, Zavižan y Alan, lleva de cinco a seis horas y
      requiere organizar el transporte del coche.

      - Desde el refugio de Zavižan, el ramal a Vučjak sube en diez minutos, y con la Velika Kosa y el jardín
      botánico se completa un circuito de menos de dos horas.

      - El jardín botánico está a quince minutos andando del refugio, reúne unas 300 especies de plantas y se
      recorre en una hora de paseo lento.

      - Desde el refugio de Alan, la ruta a Buljma es un paseo corto sin tramos empinados, de hora y media,
      con vistas al mar y al valle de Mirovo. El paseo a Veliki Lubenovac, un prado con restos de poblados de
      verano, sale de Alan por la senda Premužić hacia el norte.
    history: >-
      La senda Premužić empezó a construirse en 1930 y se terminó en el verano de 1933. En verano, la
      presencia de visitantes en la Premužić puede perjudicar la sensación de naturaleza intacta.


      El parque integra áreas protegidas anteriores: la reserva estricta de Hajdučki i Rožanski kukovi, la
      reserva botánica de Visibaba y la de Zavižan-Balinovac-Velika kosa. El macizo del Velebit entró en 1978
      en la red mundial de reservas de la biosfera de la UNESCO, y tres años después se declaró parque
      natural.
    before: >-
      Consulta la accesibilidad de las carreteras antes de ir: algunas pueden cerrar por acumulación de nieve,
      sobre todo en primavera y a final de otoño. Solo se puede caminar por los senderos señalizados, los
      perros deben ir atados y no se permite acampar.
    around: >-
      A nueve kilómetros está [Rewilding Llanuras de Lika / Velebit](/lugar/rewilding-velebit-plains/), el
      espacio de rewilding vecino.
  en:
    intro: >-
      There are mountains you look at and mountains you traverse, and northern Velebit belongs to the latter.
      A dry-stone footpath, constructed between 1930 and 1933 so that anyone could venture into the wildest
      section of the massif, crosses the park from shelter to shelter, surrounded by a mosaic of beech woods,
      pastures, rocky crags and vertical caves. Sjeverni Velebit National Park, the youngest of the eight in
      Croatia, was established in 1999 across 109 km² that stretch from 518 to 1676 m in altitude.
    landscape: >-
      Everything began beneath the sea, 310 million years ago. The massif was uplifted during tectonic folding
      that started around 40 million years ago, eventually rising above 1700 m. The outcome is a limestone
      topography where rainwater vanishes into chasms and dolines: around 500 subterranean formations are
      documented, 98 % of them vertical shafts, and three exceed 1000 metres in depth. The pinnacles of
      Hajdučki i Rožanski kukovi, at the heart of the park, are the finest example, and their access is
      strictly restricted to researchers and educational parties.


      More than 80 % of the park is forested, arranged in distinct vegetation tiers according to altitude. If
      you ascend from the sea along the coastal flank, you first cross pubescent oak and hornbeam woods, and
      the forest shifts as elevation increases. The pastures bear the imprint of traditional grazing; once
      livestock disappears, shrubs and pioneer forest gradually reclaim them.


      The flora features more than 950 plant species and subspecies, including about 40 strict endemics. The
      Velebit is one of four major centres of plant endemism in Croatia, as cold-adapted glacial relics
      remained isolated upon these ridges after the retreat of the ice sheets.
    wildlife: >-
      These vast, well-preserved woodlands provide habitat for the three large European carnivores: [brown
      bear](/especie/ursus_arctos/), [wolf](/especie/canis_lupus/) and [lynx](/especie/lynx_lynx/), clear
      evidence of a thriving ecosystem. The Eurasian lynx, extirpated in Croatia in the early twentieth
      century, returned from Slovenia, where it was reintroduced in 1973, and crossed back into Croatia one
      year later. Among the most frequent herbivores and mammals are [roe
      deer](/especie/capreolus_capreolus/), [red deer](/especie/cervus_elaphus/),
      [chamois](/especie/rupicapra_rupicapra/) and [wild boar](/especie/sus_scrofa/).


      For birdlife, you must scan both canopy and sky. The [capercaillie](/especie/tetrao_urogallus/) finds
      here one of its few remaining strongholds in Croatia, observed most frequently along forestry tracks and
      mountain paths when wild berries ripen. Other notable birds include the [pygmy
      owl](/especie/glaucidium_passerinum/), boreal owl, [eagle owl](/especie/bubo_bubo/), [Ural
      owl](/especie/strix_uralensis/), [three-toed woodpecker](/especie/picoides_tridactylus/), [white-backed
      woodpecker](/especie/dendrocopos_leucotos/) and [golden eagle](/especie/aquila_chrysaetos/).


      Deep subterranean realms shelter the Velebit leech, strictly endemic to northern Velebit: it was
      discovered in 1992 inside the Lukina jama abyss and inhabits only four deep vertical shafts across the
      park.


      The mountain calendar is dictated by weather. Near Zavižan, the first snowfall typically arrives in
      mid-October and the final snow melts in late May; the Zavižan meteorological observatory, at 1594 m, is
      the highest in Croatia and has operated continuously since 1 October 1953. Most flora in the botanical
      garden blooms during June and July, and the regular visitor season runs from May through November.
    visit: >-
      Krasno serves as park headquarters and the customary gateway. Babić Siča, at 1300 m, is the primary
      entry point to reach Zavižan and the botanical collection; from there to Zavižan runs a 7 km gravel
      road. In Krasno, the Velebit House spans four storeys, illustrating how human culture has shaped the
      massif and offering a virtual descent into the Lukina jama abyss.


      For hiking you have four primary itineraries:


      - The Premužić Trail covers 16 km within the park boundaries. It has almost no steep ascents, making it
      accessible even to visitors unaccustomed to rugged mountaineering. From Zavižan, the Rossi hut is
      reached in about two hours. Walking the entire length between the Zavižan and Alan huts takes five to
      six hours and requires arranging vehicle transfer.

      - From the Zavižan hut, the branch trail to Vučjak climbs in ten minutes, and combined with Velika Kosa
      and the botanical garden it forms a loop taking under two hours.

      - The botanical garden sits a fifteen-minute stroll from the mountain lodge, displays some 300 plant
      species and can be toured at a leisurely pace in one hour.

      - From the Alan mountain hut, the walk to Buljma is an easy outing without steep slopes, lasting an hour
      and a half, with views towards the Adriatic and the Mirovo depression. The hike to Veliki Lubenovac, a
      high meadow with remnants of summer pastoral huts, sets off from Alan heading north along the Premužić
      path.
    history: >-
      Construction of the Premužić Trail commenced in 1930 and finished in the summer of 1933. During peak
      summer, the influx of hikers along the Premužić route can diminish the sense of pristine wilderness.


      The park incorporates earlier conservation reserves: the strict nature reserve of Hajdučki i Rožanski
      kukovi, the botanical reserve of Visibaba, and the Zavižan-Balinovac-Velika kosa reserve. The entire
      Velebit massif joined the UNESCO world network of biosphere reserves in 1978, and three years afterwards
      was proclaimed a nature park.
    before: >-
      Check road conditions before setting out: several mountain routes may close due to heavy snow,
      particularly during spring and late autumn. You may hike only on waymarked paths, dogs must remain
      leashed at all times, and wild camping is prohibited.
    around: >-
      Just nine kilometres away lies [Rewilding Velebit / Lika Plains](/lugar/rewilding-velebit-plains/), the
      adjacent rewilding project area.
  fr:
    intro: >-
      Il y a des montagnes qu’on contemple et d’autres qu’on parcourt à pied : le Velebit septentrional
      appartient résolument à la seconde catégorie. Un cheminement en pierre sèche, bâti entre 1930 et 1933
      pour permettre à tout marcheur de pénétrer dans le cœur le plus sauvage du massif, relie les refuges à
      travers une mosaïque de hêtraies, d’alpages, de chicots rocheux et de gouffres. Le parc national
      Sjeverni Velebit, le plus jeune des huit parcs nationaux croates, a été créé en 1999 sur 109 km²
      s’étageant de 518 à 1676 m d’altitude.
    landscape: >-
      L’histoire géologique s’amorce sous les mers il y a 310 millions d’années. Le massif s’est soulevé lors
      de plissements tectoniques entamés il y a environ 40 millions d’années, pour finir par culminer à plus
      de 1700 m. Il en résulte un paysage calcaire où chaque pluie s’engouffre dans des dolines et des abîmes
      : on recense environ 500 cavités souterraines, dont 98 % sont des gouffres verticaux, et trois dépassent
      1000 mètres de profondeur verticale. Les pitons de Hajdučki i Rožanski kukovi, au centre du parc, en
      constituent l’expression la plus grandiose, leur accès étant réservé aux scientifiques et aux visites
      éducatives autorisées.


      Plus de 80 % du territoire est couvert de forêts étagées selon le gradient altitudinal. En montant
      depuis l’Adriatique par le versant côtier, vous traversez d’abord des chênaies pubescentes et des
      charmaies, puis les peuplements évoluent avec l’altitude. Les pelouses alpines témoignent d’un
      pastoralisme séculaire ; à mesure que le bétail s’efface, landes et fourrés recolonisent le terrain.


      La flore rassemble plus de 950 espèces et sous-espèces vasculaires, avec environ 40 espèces strictement
      endémiques. Le massif du Velebit forme l’un des quatre grands foyers d’endémisme botanique de Croatie,
      car les plantes adaptées au froid y ont trouvé refuge sur les cimes après le recul des glaces
      quaternaires.
    wildlife: >-
      Les vastes forêts préservées abritent les trois grands prédateurs du continent : [l’ours
      brun](/especie/ursus_arctos/), [le loup](/especie/canis_lupus/) et [le lynx
      boréal](/especie/lynx_lynx/), preuves indiscutables d’un équilibre naturel intact. Le lynx, disparu de
      Croatie au tout début du XXe siècle, a recolonisé le pays depuis la Slovénie où il avait été réintroduit
      en 1973, franchissant la frontière un an plus tard. Parmi les grands mammifères répandus figurent [le
      chevreuil](/especie/capreolus_capreolus/), [le cerf élaphe](/especie/cervus_elaphus/), [le
      chamois](/especie/rupicapra_rupicapra/) et [le sanglier](/especie/sus_scrofa/).


      Côté avifaune, il faut observer aussi bien les sous-bois que le ciel. Le [grand
      tétras](/especie/tetrao_urogallus/) possède ici l’un de ses rares bastions croates, souvent aperçu sur
      les pistes forestières et les sentiers au moment où mûrissent les baies sauvages. Parmi les espèces les
      plus remarquables figurent [la chevêchette d’Europe](/especie/glaucidium_passerinum/), la chouette de
      Tengmalm, [le grand-duc d’Europe](/especie/bubo_bubo/), [la chouette de
      l’Oural](/especie/strix_uralensis/), les pics [tridactyle](/especie/picoides_tridactylus/) et [à dos
      blanc](/especie/dendrocopos_leucotos/), sans oublier [l’aigle royal](/especie/aquila_chrysaetos/).


      Dans les ténèbres des profondeurs vit la sangsue du Velebit, endémique stricte du secteur nord :
      découverte en 1992 dans le gouffre Lukina jama, elle ne colonise que quatre cavités abyssales du parc.


      Le tempo de la montagne obéit au climat. Autour de Zavižan, les premières neiges tombent d’ordinaire à
      la mi-octobre et les dernières ne fondent qu’à la fin mai ; la station météorologique de Zavižan,
      établie à 1594 m, est la plus haute de Croatie et transmet des données sans interruption depuis le 1er
      octobre 1953. La plupart des fleurs du jardin botanique s’épanouissent en juin et juillet, et la période
      classique de visite s’étend de mai à novembre.
    visit: >-
      Le village de Krasno abrite le siège administratif du parc et constitue le point de départ habituel.
      Babić Siča, à 1300 m, est l’entrée principale donnant accès à Zavižan et au jardin botanique ; de là
      jusqu’à Zavižan courent 7 km de piste non goudronnée. À Krasno, la Maison du Velebit s’élève sur quatre
      niveaux, retraçant l’empreinte des activités humaines sur la montagne et proposant une simulation
      spéléologique du gouffre de Lukina jama.


      Quatre itinéraires pédestres majeurs s’offrent à vous :


      - Le sentier Premužić se déploie sur 16 km à l’intérieur du parc. Dépourvu de dénivelés abrupts, il
      reste accessible aux personnes peu rompues aux ascensions alpines. Du refuge de Zavižan, on atteint le
      refuge Rossi en deux heures environ. Parcourir la totalité du chemin reliant les refuges de Zavižan et
      d’Alan demande de cinq à six heures et impose de planifier le transport du véhicule.

      - Depuis le refuge de Zavižan, l’ascension du piton de Vučjak ne prend que dix minutes, et en combinant
      avec Velika Kosa et le jardin botanique, vous bouclez un circuit en moins de deux heures.

      - Le jardin botanique se trouve à quinze minutes de marche du refuge, rassemble près de 300 espèces
      floristiques et se visite en une heure d’arpentage tranquille.

      - Depuis le refuge d’Alan, la balade vers Buljma constitue un parcours facile sans raidillons, durant
      une heure et demie, avec de superbes échappées sur l’Adriatique et le val de Mirovo. La marche vers
      Veliki Lubenovac, vaste dépression herbeuse parsemée d’anciens abris d’estive, part d’Alan en empruntant
      le sentier Premužić vers le nord.
    history: >-
      Le tracé du sentier Premužić a été commencé en 1930 pour s’achever à l’été 1933. Durant la haute saison
      estivale, la densité de marcheurs sur cet axe peut estomper le sentiment de solitude sauvage.


      Le parc national englobe d’anciennes réserves naturelles créées antérieurement : la réserve intégrale de
      Hajdučki i Rožanski kukovi, la réserve botanique de Visibaba et celle de Zavižan-Balinovac-Velika kosa.
      Le massif du Velebit a été intégré en 1978 au réseau mondial des réserves de biosphère de l’UNESCO,
      avant d’être classé parc naturel trois ans plus tard.
    before: >-
      Vérifiez la praticabilité des routes avant votre départ : certains axes d’accès peuvent être coupés par
      d’épaisses congères de neige, surtout au printemps et à la fin de l’automne. La randonnée est
      strictement limitée aux chemins balisés, les chiens doivent être tenus en laisse et le bivouac sauvage
      est rigoureusement interdit.
    around: >-
      À neuf kilomètres de distance se trouve [Rewilding Velebit / Plaines de
      Lika](/lugar/rewilding-velebit-plains/), le vaste espace de réensauvagement voisin.
  de:
    intro: >-
      Es gibt Gebirge, die man aus der Ferne bestaunt, und solche, die man durchwandern muss – der nördliche
      Velebit gehört zu letzteren. Ein kunstvoller Trockensteinpfad, der zwischen 1930 und 1933 angelegt
      wurde, um jedermann einen sicheren Zugang in die wildesten Zonen des Massivs zu ermöglichen, verbindet
      Schutzhütten durch ein Mosaik aus Buchenforsten, Bergwiesen, Felszacken und Karstschächten. Der
      Nationalpark Sjeverni Velebit, der jüngste der acht kroatischen Nationalparks, wurde 1999 auf einer
      Fläche von 109 km² gegründet, die von 518 bis auf 1676 m Meereshöhe ansteigt.
    landscape: >-
      Alles nahm seinen Ursprung vor 310 Millionen Jahren auf dem Meeresgrund. Das Gebirgsmassiv faltete sich
      in tektonischen Hebungsprozessen auf, die vor etwa 40 Millionen Jahren einsetzten, bis es schließlich
      über 1700 m emporragte. Das Ergebnis ist ein zerklüftetes Kalksteinrelief, in dem Niederschläge sofort
      in Spalten, Dolinen und Schachtsystemen versickern: Rund 500 unterirdische Karsthöhlen sind erfasst, 98
      % davon vertikale Schächte, und drei davon reichen über 1000 Meter tief in die Erde. Die Felstürme von
      Hajdučki i Rožanski kukovi im Parkzentrum bilden das eindrucksvollste Beispiel; ihr Betreten ist
      Forschern und genehmigten Bildungsexkursionen vorbehalten.


      Über 80 % der Parkfläche sind von Wald bedeckt, der sich in markante Höhenstufen gliedert. Wenn du von
      der Adriaküste aufsteigst, querst du zunächst Flaumeichen und Hainbuchen; mit zunehmender Höhe verändert
      sich die Waldgesellschaft drastisch. Die Bergweiden spiegeln jahrhundertelange Hirtenkultur wider;
      weicht das Vieh, erobern Zwergsträucher und Gehölze die offenen Flächen zurück.


      Die Flora umfasst mehr als 950 Gefäßpflanzenarten und Unterarten, darunter etwa 40 strenge Endemiten.
      Der Velebit zählt zu den vier großen Endemismuszentren Kroatiens, da kälteliebende Eiszeitrelikte auf
      den Bergrücken nach dem Gletscherrückzug isoliert überdauerten.
    wildlife: >-
      Die zusammenhängenden, unzerschnittenen Bergwälder bieten Lebensraum für die drei großen europäischen
      Raubtiere: [Braunbär](/especie/ursus_arctos/), [Wolf](/especie/canis_lupus/) und [Eurasischer
      Luchs](/especie/lynx_lynx/) – ein untrügliches Zeichen für ein intaktes Ökosystem. Der Luchs, der Anfang
      des zwanzigsten Jahrhunderts in Kroatien ausgerottet worden war, kehrte aus Slowenien zurück, wo er 1973
      wiederangesiedelt wurde, und erreichte Kroatien ein Jahr später. Zu den häufigsten Huftieren und Säugern
      zählen [Reh](/especie/capreolus_capreolus/), [Rothirsch](/especie/cervus_elaphus/),
      [Gämse](/especie/rupicapra_rupicapra/) und [Wildschwein](/especie/sus_scrofa/).


      In der Vogelwelt lohnt der Blick in Kronendach und Berghimmel gleichermaßen. Das
      [Auerhuhn](/especie/tetrao_urogallus/) besitzt hier eines seiner wenigen verbliebenen Rückzugsgebiete in
      Kroatien und lässt sich bevorzugt an Forststraßen und Waldrändern blicken, wenn Waldbeeren reifen. Zu
      den ornithologischen Besonderheiten gehören [Sperlingskauz](/especie/glaucidium_passerinum/),
      Raufußkauz, [Uhu](/especie/bubo_bubo/), [Habichtskauz](/especie/strix_uralensis/),
      [Dreizehenspecht](/especie/picoides_tridactylus/), [Weißrückenspecht](/especie/dendrocopos_leucotos/)
      sowie der [Steinadler](/especie/aquila_chrysaetos/).


      Im ewigen Dunkel der Tiefe lebt der Velebit-Egel, der ausschließlich im nördlichen Velebit vorkommt: Er
      wurde 1992 im Schacht Lukina jama entdeckt und bewohnt lediglich vier der tiefsten Vertikalabgründe des
      Parks.


      Den Takt des Berglebens bestimmt das Gebirgsklima. Bei Zavižan fällt der erste Schnee meist Mitte
      Oktober und die letzten Schneereste tauen Ende Mai; die Wetterstation Zavižan auf 1594 m Höhe ist die
      höchstgelegene Kroatiens und liefert seit dem 1. Oktober 1953 lückenlos Daten. Im Juni und Juli blüht
      der Botanische Garten in voller Pracht, und die reguläre Besuchersaison reicht von Mai bis November.
    visit: >-
      Die Ortschaft Krasno bildet den Sitz der Parkverwaltung und den üblichen Ausgangspunkt. Babić Siča auf
      1300 m dient als Haupteingang in Richtung Zavižan und Botanischer Garten; von dort führt eine 7 km lange
      Schotterpiste nach Zavižan hinauf. In Krasno zeigt das Velebit-Haus auf vier Stockwerken, wie der Mensch
      das Gebirge geprägt hat, und ermöglicht einen virtuellen Höhlenabstieg in die Lukina jama.


      Für Bergwanderer bieten sich vier Hauptoptionen an:


      - Der Premužić-Weg verläuft über 16 km innerhalb der Parkgrenzen. Er weist kaum steile Passagen auf und
      eignet sich daher auch bestens für bergunerfahrene Wanderer. Von Zavižan aus erreichst du die
      Schutzhütte Rossi nach rund zwei Stunden. Die gesamte Höhenwanderung zwischen den Berghütten Zavižan und
      Alan dauert fünf bis sechs Stunden und erfordert die Organisation des Rücktransfers.

      - Von der Zavižan-Hütte führt ein Abzweig in zehn Minuten auf den Vučjak; zusammen mit der Velika Kosa
      und dem Botanischen Garten schließt sich eine Rundwanderung von unter zwei Stunden.

      - Der Botanische Garten liegt eine viertelstündige Wanderung von der Zavižan-Hütte entfernt, beherbergt
      rund 300 Pflanzenarten und lässt sich in einer gemächlichen Gehstunde erkunden.

      - Von der Alan-Hütte ist der Weg nach Buljma ein kurzer, bequemer Spaziergang ohne Steilstufen von
      anderthalb Stunden Dauer mit weiter Aussicht auf die Adria und das Mirovo-Becken. Die Route nach Veliki
      Lubenovac, einer Hochebene mit Resten historischer Almhütten, zweigt von Alan auf den Premužić-Weg
      Richtung Norden ab.
    history: >-
      Der Bau des Premužić-Wegs begann 1930 und fand im Sommer 1933 seinen Abschluss. Im Hochsommer kann ein
      erhöhtes Wandereraufkommen auf dem Premužić-Pfad das Gefühl unberührter Einsamkeit dämpfen.


      Der Nationalpark führt ältere Schutzgebietsausweisungen fort: das strenge Naturreservat Hajdučki i
      Rožanski kukovi, das botanische Schutzgebiet Visibaba sowie das Reservat Zavižan-Balinovac-Velika kosa.
      Das Velebit-Massiv wurde 1978 in das weltweite UNESCO-Biosphärenreservatsnetz aufgenommen und drei Jahre
      darauf zum Naturpark erklärt.
    before: >-
      Erkundige dich vor Fahrtantritt über den Zustand der Bergstraßen: Manche Zufahrten bleiben im Frühjahr
      und Spätherbst wegen hoher Schneelage unpassierbar. Du darfst dich ausschließlich auf markierten
      Wanderwegen bewegen, Hunde sind ausnahmslos an der Leine zu führen, und wildes Zelten ist untersagt.
    around: >-
      Neun Kilometer entfernt erstreckt sich das benachbarte Renaturierungsgebiet [Rewilding Velebit /
      Lika-Ebenen](/lugar/rewilding-velebit-plains/).
  it:
    intro: >-
      Ci sono montagne che si guardano e montagne che si camminano, e il Velebit settentrionale appartiene
      alla seconda specie. Una mulattiera in pietra a secco, realizzata tra il 1930 e il 1933 affinché
      chiunque potesse addentrarsi nelle pieghe più impervie del massiccio, attraversa il parco di rifugio in
      rifugio, aprendosi su un mosaico di faggete, pascoli, bastioni rocciosi e abissi carsici. Il Parco
      Nazionale Sjeverni Velebit, il più giovane degli otto parchi nazionali croati, è stato istituito nel
      1999 su un’area di 109 km² che sale da 518 a 1676 m di quota.
    landscape: >-
      La storia geologica ha origine sui fondali marini, 310 milioni di anni fa. Il massiccio si sollevò con
      le orogenesi iniziate circa 40 milioni di anni fa, spingendosi oltre i 1700 m di altitudine. Ne
      scaturisce una morfologia calcarea in cui le acque meteoriche scompaiono all’istante in doline e pozzi:
      si contano circa 500 formazioni ipogee censite, di cui il 98 % sono voragini verticali, e tre superano i
      1000 metri di profondità. Le cime di Hajdučki i Rožanski kukovi, al centro del parco, ne rappresentano
      la testimonianza più vertiginosa, e il loro accesso è rigidamente limitato a studiosi e comitive
      didattiche autorizzate.


      Oltre l’80 % della superficie del parco è forestata, scandita in fasce vegetazionali secondo la quota.
      Salendo dal mare lungo il versante costiero si incontrano roverelle e carpini, per poi assistere alla
      transizione verso boschi montani d’alta quota. I pascoli conservano le tracce della pastorizia
      tradizionale; non appena il bestiame viene meno, boscaglie e arbusti tornano a colonizzare i prati.


      La flora annovera più di 950 specie e sottospecie botaniche, con circa 40 endemismi puntiformi. Il
      Velebit è uno dei quattro grandi centri di endemismo della Croazia, poiché durante e dopo le glaciazioni
      le specie boreali rimasero isolate sulle creste più elevate.
    wildlife: >-
      Le ampie foreste integre garantiscono l’habitat ai tre grandi carnivori del continente: [orso
      bruno](/especie/ursus_arctos/), [lupo](/especie/canis_lupus/) e [lince
      eurasiatica](/especie/lynx_lynx/), segno distintivo di un ecosistema in perfetto equilibrio. La lince,
      scomparsa in Croazia all’inizio del XX secolo, è tornata ripopolando i boschi dalla Slovenia, dove era
      stata reintrodotta nel 1973, per riattraversare il confine croato un anno dopo. Tra i grandi mammiferi
      più frequenti spiccano [capriolo](/especie/capreolus_capreolus/), [cervo
      nobile](/especie/cervus_elaphus/), [camoscio](/especie/rupicapra_rupicapra/) e
      [cinghiale](/especie/sus_scrofa/).


      Per gli uccelli bisogna scrutare sia le chiome fitte che le falesie. Il [gallo
      cedrone](/especie/tetrao_urogallus/) trova qui uno dei suoi ultimi rifugi in territorio croato e si
      avvista soprattutto lungo le piste forestali e i sentieri quando maturano i frutti di bosco. Tra le
      specie di maggior rilievo figurano la [civetta nana](/especie/glaucidium_passerinum/), la civetta
      capogrosso, il [gufo reale](/especie/bubo_bubo/), l’[allocco degli Urali](/especie/strix_uralensis/), i
      picchi [tridattilo](/especie/picoides_tridactylus/) e [dorsobianco](/especie/dendrocopos_leucotos/) e
      l’[aquila reale](/especie/aquila_chrysaetos/).


      Nelle profondità delle tenebre sotterranee sopravvive la mignatta del Velebit, endemismo assoluto del
      Velebit settentrionale: scoperta nel 1992 nella voragine Lukina jama, popola soltanto quattro
      profondissimi abissi del parco.


      I ritmi della montagna sono scanditi dal meteo. Attorno a Zavižan la prima coltre nevosa cade di norma a
      metà ottobre e l’ultima si scioglie verso fine maggio; l’osservatorio meteorologico di Zavižan, posto a
      1594 m, è la stazione più elevata della Croazia e opera ininterrottamente dal 1° ottobre 1953. Nei mesi
      di giugno e luglio fiorisce la gran parte del giardino botanico, e la normale stagione escursionistica
      va da maggio a novembre.
    visit: >-
      Il borgo di Krasno ospita la direzione del parco e funge da base consueta di partenza. Babić Siča, posta
      a 1300 m, è l’accesso principale per salire a Zavižan e al giardino botanico; da lì a Zavižan si snodano
      7 km di pista sterrata. A Krasno la Casa del Velebit si sviluppa su quattro piani espositivi,
      illustrando il rapporto storico tra uomo e ambiente montano e offrendo una simulazione interattiva della
      discesa nella grotta Lukina jama.


      Per camminare hai a disposizione quattro itinerari classici:


      - Il sentiero Premužić percorre 16 km nel cuore del parco. Quasi privo di dislivelli bruschi, è fruibile
      anche da chi non ha grande confidenza con le scalate montane. Da Zavižan si raggiunge il rifugio Rossi
      in circa due ore. Completare l’intera traversata tra i rifugi di Zavižan e di Alan richiede dalle cinque
      alle sei ore e impone di organizzare il recupero dell’auto.

      - Dal rifugio Zavižan, la deviazione verso la vetta del Vučjak si sale in dieci minuti; unendola a
      Velika Kosa e al giardino botanico si compie un circuito circolare in meno di due ore.

      - Il giardino botanico dista quindici minuti a piedi dal rifugio, raccoglie circa 300 specie vegetali e
      si visita con una camminata rilassata di un’ora.

      - Dal rifugio Alan la passeggiata verso Buljma è un tragitto agevole senza pendenze ripide, di un’ora e
      mezza, affacciato sull’Adriatico e sulla depressione di Mirovo. L’escursione a Veliki Lubenovac, radura
      d’alta quota che conserva antichi ricoveri estivi dei pastori, si stacca da Alan imboccando il sentiero
      Premužić verso nord.
    history: >-
      La costruzione del sentiero Premužić prese avvio nel 1930 per concludersi nell’estate del 1933. Nei mesi
      centrali d’estate, una maggiore affluenza sul percorso può affievolire il senso di isolamento selvaggio.


      Il parco accorpa precedenti tutele ambientali: la riserva integrale di Hajdučki i Rožanski kukovi, la
      riserva botanica di Visibaba e quella di Zavižan-Balinovac-Velika kosa. Nel 1978 il massiccio del
      Velebit è stato inserito nella rete mondiale delle riserve della biosfera dell’UNESCO, e tre anni più
      tardi è stato istituito come parco naturale.
    before: >-
      Verifica la transitabilità delle vie carrabili prima di metterti in viaggio: alcuni tratti possono
      essere bloccati dalla neve, specie in primavera e nel tardo autunno. Si può camminare soltanto lungo i
      sentieri tracciati, i cani devono essere tenuti al guinzaglio e il campeggio libero non è consentito.
    around: >-
      A nove chilometri si trova [Rewilding Pianure di Lika / Velebit](/lugar/rewilding-velebit-plains/), la
      contigua riserva dedicata alla rinaturalizzazione.
  pt:
    intro: >-
      Há montanhas que se contemplam e montanhas que se percorrem a pé, e o Velebit setentrional pertence sem
      dúvida às segundas. Uma vereda em pedra seca, erguida entre 1930 e 1933 para que qualquer pessoa pudesse
      aventurar-se no coração mais bravio do maciço, atravessa o parque de refúgio em refúgio, rodeada por um
      mosaico de faiais, pastagens, fragas escarpadas e algares. O Parque Nacional Sjeverni Velebit, o mais
      jovem dos oito existentes na Croácia, foi criado em 1999 com 109 km² que se estendem dos 518 aos 1676 m
      de altitude.
    landscape: >-
      Tudo principiou sob as águas marinhas, há 310 milhões de anos. O maciço ergueu-se devido aos dobramentos
      orogénicos iniciados há cerca de 40 milhões de anos, ultrapassando os 1700 m de altitude. O resultado é
      um relevo calcário onde a água da chuva se esvai em algares e dolinas: catalogam-se cerca de 500
      cavidades subterrâneas, sendo 98 % delas poços verticais, e três superam os 1000 metros de profundidade.
      As agulhas de Hajdučki i Rožanski kukovi, no centro do parque, constituem o exemplo mais impressionante,
      tendo o seu acesso reservado a investigadores e visitas pedagógicas devidamente autorizadas.


      Mais de 80 % da superfície do parque é florestada, distribuída por andares de vegetação consoante a
      cota. Se subires a partir da costa do Adriático, cruzas primeiro carvalhos-robles e cárpinos, e o
      arvoredo vai transformando-se à medida que ganhas altitude. As pastagens exibem a herança do pastoreio
      tradicional; quando o gado se retira, os matos e o bosque pioneiro voltam a colonizar o solo.


      A flora reúne mais de 950 espécies e subespécies vasculares, com cerca de 40 endemismos estritos. O
      maciço do Velebit representa um dos quatro grandes centros botânicos de endemismo da Croácia, pois após
      os recuos glaciares as plantas adaptadas ao frio permaneceram isoladas nestas cristas.
    wildlife: >-
      As vastas florestas intactas servem de refúgio aos três grandes predadores europeus:
      [urso-pardo](/especie/ursus_arctos/), [lobo](/especie/canis_lupus/) e
      [lince-euroasiático](/especie/lynx_lynx/), testemunho eloquente de um ecossistema equilibrado. O lince,
      extinto na Croácia no início do século XX, regressou a partir da Eslovénia, onde tinha sido
      reintroduzido em 1973, cruzando a fronteira croata um ano depois. Entre os mamíferos mais comuns
      contam-se o [corço](/especie/capreolus_capreolus/), o [veado-vermelho](/especie/cervus_elaphus/), a
      [camurça](/especie/rupicapra_rupicapra/) e o [javali](/especie/sus_scrofa/).


      No que toca às aves, deves observar as copas densas e os céus abertos. O
      [tetraz-grande](/especie/tetrao_urogallus/) encontra aqui um dos seus derradeiros redutos na Croácia,
      avistando-se principalmente junto a caminhos florestais e veredas de montanha na época em que os frutos
      silvestres amadurecem. Entre a avifauna mais singular destacam-se o
      [mocho-pigmeu](/especie/glaucidium_passerinum/), o mocho-boreal, o [bufo-real](/especie/bubo_bubo/), a
      [coruja-dos-urales](/especie/strix_uralensis/), os pica-paus
      [tridáctilo](/especie/picoides_tridactylus/) e [de-dorso-branco](/especie/dendrocopos_leucotos/) e a
      [águia-real](/especie/aquila_chrysaetos/).


      No abismo das profundezas subterrâneas habita a sanguessuga-do-velebit, estritamente endémica do setor
      setentrional: foi identificada em 1992 no algar Lukina jama e coloniza apenas quatro cavidades abissais
      do parque.


      O ritmo na montanha obedece às estações. Perto de Zavižan a primeira neve costuma cair a meados de
      outubro e a derradeira só derrete nos finais de maio; a estação meteorológica de Zavižan, a 1594 m, é a
      mais elevada da Croácia e funciona continuamente desde 1 de outubro de 1953. Em junho e julho atinge o
      auge a floração no jardim botânico, prolongando-se a época regular de visita de maio a novembro.
    visit: >-
      A povoação de Krasno acolhe a sede do parque e constitui a base habitual de partida. Babić Siča, situada
      a 1300 m, funciona como entrada principal rumo a Zavižan e ao jardim botânico; dali até Zavižan
      estendem-se 7 km de caminho de terra batida. Em Krasno, a Casa do Velebit ergue-se em quatro pisos,
      ilustrando o impacto das comunidades humanas no maciço e proporcionando uma descida virtual ao algar
      Lukina jama.


      Para caminhar tens quatro propostas essenciais:


      - O trilho Premužić percorre 16 km no interior do parque. Praticamente desprovido de inclinações
      íngremes, adapta-se até a quem não tem hábito de andar na alta montanha. A partir de Zavižan chega-se ao
      abrigo Rossi em cerca de duas horas. Cobrir a totalidade da travessia entre os refúgios de Zavižan e
      Alan requer cinco a seis horas de marcha e implica organizar a recolha da viatura.

      - Do refúgio de Zavižan, a subida ao Vučjak demora dez minutos; combinada com a Velika Kosa e o jardim
      botânico compõe um circuito em menos de duas horas.

      - O jardim botânico fica a quinze minutos a pé da estalagem alpina, congrega perto de 300 espécies
      florísticas e visita-se num passeio calmo de uma hora.

      - A partir do abrigo de Alan, a rota até Buljma é um trajeto suave sem declives acentuados, com uma hora
      e meia de duração, oferecendo vistas largas sobre o Adriático e o vale de Mirovo. O percurso até Veliki
      Lubenovac, depressão relvada com vestígios de antigos currais de estio, arranca de Alan acompanhando o
      trilho Premužić rumo a norte.
    history: >-
      A construção do trilho Premužić teve início em 1930 e ficou concluída no verão de 1933. No auge do
      verão, a maior afluência no Premužić pode atenuar a sensação de solidão selvagem.


      O parque agrega zonas de proteção criadas em épocas anteriores: a reserva integral de Hajdučki i
      Rožanski kukovi, a reserva botânica de Visibaba e a reserva de Zavižan-Balinovac-Velika kosa. Em 1978 o
      maciço do Velebit ingressou na rede mundial de reservas da biosfera da UNESCO, e três anos depois foi
      classificado como parque natural.
    before: >-
      Informa-te sobre a circulação nas estradas antes de viajar: algumas vias de montanha encerram devido à
      acumulação de neve, sobretudo na primavera e no final do outono. Apenas é permitido caminhar pelos
      trilhos marcados, os cães têm de circular sempre pela trela e o campismo selvagem é interdito.
    around: >-
      A nove quilómetros localiza-se [Rewilding Planícies de Lika /
      Velebit](/lugar/rewilding-velebit-plains/), a contígua reserva de renaturalização.
