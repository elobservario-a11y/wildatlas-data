resumen:
  es: >-
    Plana volcánica al pie de acantilados verticales de 400 m con una albufera costera única en las Azores
    célebre por sus almejas gigantes de agua salobre y meca del surf.
  en: >-
    Volcanic coastal flat at the foot of vertical 400 m cliffs featuring a coastal lagoon unique in the
    Azores, celebrated for its brackish-water giant clams and world-class surf.
  fr: >-
    Plate-forme volcanique au pied de falaises vertigineuses de 400 m avec une lagune littorale unique aux
    Açores, réputée pour ses palourdes d'eau saumâtre et son surf.
  de: >-
    Vulkanische Küstenebene am Fuß senkrechter 400 m hoher Steilklippen mit einer für die Azoren einzigartigen
    Strandlagune, berühmt für Riesenmuscheln und Surfwellen.
  it: >-
    Pianoro vulcanico ai piedi di falesie verticali di 400 m con una laguna costiera unica nelle Azzorre,
    celebre per le vongole giganti d'acqua salmastra e il surf.
  pt: >-
    Plataforma vulcânica no sopé de arribas verticais de 400 m com uma lagoa costeira única nos Açores,
    célebre pelas suas amêijoas gigantes de água salobra e pelo surf.
unico:
  es: >-
    El único sistema de lagunas costeras de las Azores, en la única isla del archipiélago donde se encuentran
    almejas.
  en: >-
    The only coastal lagoon system in the Azores, on the sole island of the archipelago where clams are
    harvested.
  fr: L'unique système de lagunes côtières des Açores, sur la seule île de l'archipel où vivent des palourdes.
  de: >-
    Das einzige Küstenlagunensystem der Azoren auf der einzigen Insel des Archipels, auf der Muscheln
    vorkommen.
  it: >-
    L'unico complesso di lagune costiere delle Azzorre, nella sola isola dell'arcipelago in cui allignano le
    vongole veraci.
  pt: O único sistema de lagoas costeiras dos Açores, na única ilha do arquipélago onde se encontram amêijoas.
observaciones:
  es: >-
    La ruta es lineal, de la Serra do Topo a la Fajã dos Cubres, así que planea cómo volver. Y recuerda que
    esta costa norte recibe temporales y mar bravo.
texto:
  es:
    intro: >-
      Al final del sendero hay una playa de cantos rodados, una laguna y un puñado de casas encajadas entre el
      mar bravo y la ladera. La Fajã da Caldeira de Santo Cristo está en la parroquia de Ribeira Seca, en el
      municipio de Calheta, en la isla de São Jorge, entre la Fajã dos Tijolos y la Fajã Redonda. Una fajã es
      un campo de derrubios geológicos, y São Jorge, larga y delgada, está llena de ellas. Esta es la más
      famosa, y además es reserva natural.
    landscape: >-
      São Jorge es una isla estrecha y de altos acantilados, y sus habitantes viven en las fajãs de las costas
      norte y sur. En el nordeste, la mayoría de los acantilados tiene entre trescientos y cuatrocientos
      metros, con pendientes de entre 45 y 55 grados, y las fajãs se acumulan entre ellos y el mar. La isla se
      construyó por vulcanismo de fisura, ligado a la dorsal mesoatlántica, y de aquellas erupciones quedan
      los conos volcánicos de la línea central.


      La laguna nace de una sucesión de fuerzas. La erosión marina, la lluvia y la escorrentía formaron la
      laguna costera, separada del mar por una playa de cantos. Con los temporales de esta costa norte llegó a
      cegarse el canal que la unía con el mar, y no hace mucho se restauró. La laguna de Fajã dos Cubres y la
      de Santo Cristo forman el único sistema de lagunas costeras del archipiélago.


      El clima es subtropical húmedo, con inviernos muy suaves y veranos cálidos por la influencia de la
      corriente del Golfo, y las fajãs, más abajo, son más cálidas que el centro.
    wildlife: >-
      En la costa se ven cagarros (pardela cenicienta, Calonectris borealis), charranes comunes (Sterna
      hirundo), charranes rosados (Sterna dougallii) y varias aves terrestres azorianas. Entre las que se
      registran a lo largo del año figura el petrel de Fea. Entre las plantas destacan el [brezo de las
      Azores](/especie/erica_azorica/), la lechetrezna de las Azores (Euphorbia azorica), el junco marítimo
      (Juncus acutus), la Spergularia azorica y la Ruppia maritima; junto al mar, el hinojo marino (Crithmum
      maritimum); y entre los árboles y arbustos, el [cedro de las Azores](/especie/juniperus_brevifolia/), la
      faya (Morella faya) y la Picconia azorica.


      La laguna es una guardería de peces: criaderos de mero, badejo (Mycteroperca fusca) y lisa. Y alberga la
      única población de almeja fina (Ruditapes decussatus) que se explota comercialmente en las Azores, el
      motivo por el que se declaró la reserva.


      Cerca está la Fajã dos Cubres, que debe su nombre a una planta, la Solidago azorica, de pequeñas flores
      amarillas.
    visit: >-
      La visita clásica es una ruta lineal de 9,5 km que va de la Serra do Topo a la Caldeira de Santo Cristo
      y a la Fajã dos Cubres, y dura dos horas y media. Empieza cerca del parque eólico de Pico da Urze, pasa
      por la fajã y termina en Fajã dos Cubres. Se llama PRC 1 SJO, Caldeira de Santo Cristo, y es
      posiblemente el recorrido a pie más famoso de São Jorge.


      A mitad de camino pasas por el Santuario Senhor Santo Cristo y por el Centro de Interpretação Ambiental.
    history: >-
      La ermita se bendijo el 10 de noviembre de 1835 y desde entonces es lugar de peregrinación de devotos de
      toda la isla. La fiesta del patrón es el primer domingo de septiembre, con misa y procesión.


      En 1891 la fajã tenía ciento once habitantes, y llegó a haber escuela primaria, que cerró cuando
      faltaron alumnos. En 1980 un terremoto causó desprendimientos en los dos accesos, destruyó la red
      telefónica y aisló la fajã; los vecinos tuvieron que ser evacuados en helicóptero. Hoy hay pocos
      habitantes permanentes, entre ellos el guarda de la Reserva Natural.


      Se clasificó como Reserva Natural en 1984, sobre todo por las almejas de su laguna. Hoy forma parte de
      la red Natura 2000, está declarada sitio Ramsar y es geositio del Geoparque Azores, una red de ciento
      veintiún lugares de patrimonio geográfico y áreas marinas que abarca las nueve islas volcánicas.
    before: >-
      La ruta es lineal, de la Serra do Topo a la Fajã dos Cubres, así que planea cómo volver. Y recuerda que
      esta costa norte recibe temporales y mar bravo.
    around: >-
      La Fajã no tiene vecinos cercanos en el atlas. En el mar se parece a la [Reserva Natural da Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/), donde también hay mero y badejo; con el [Parque
      Natural de la Isla de Corvo](/lugar/parque-natural-da-ilha-do-corvo/) comparte pardelas y charranes, y
      con la [Punta del Raz y Cabo Sizun](/lugar/pointe-du-raz-en-cap-sizun/), el hinojo marino.
  en:
    intro: >-
      At the end of the trail lie a pebble beach, a lagoon and a scattering of houses nestled between the wild
      sea and the mountain scarp. The Fajã da Caldeira de Santo Cristo lies in the parish of Ribeira Seca, in
      the municipality of Calheta on São Jorge Island, between Fajã dos Tijolos and Fajã Redonda. A fajã is a
      collapsed coastal debris field, and long, slender São Jorge is lined with them. This is the most famous,
      and it is a protected nature reserve.
    landscape: >-
      São Jorge is a narrow island flanked by towering cliffs, and its population lives in fajãs clinging to
      the north and south coasts. In the northeast, most cliffs rise between three hundred and four hundred
      metres, with steep slopes between 45 and 55 degrees, leaving the fajãs wedged between precipices and the
      ocean. The island arose through fissure volcanism linked to the Mid-Atlantic Ridge, and from those
      eruptions remain the volcanic cones along the central spine.


      The lagoon was formed by interacting natural forces. Marine erosion, rain and slope runoff shaped the
      coastal lagoon, barred from the sea by a pebble barrier. Heavy storms on this northern coast once
      blocked the channel connecting it to the ocean, which was restored in recent times. The lagoons of Fajã
      dos Cubres and Santo Cristo form the only coastal lagoon system in the entire archipelago.


      The climate is humid subtropical, with mild winters and warm summers influenced by the Gulf Stream,
      making the low-lying fajãs warmer than the central highlands.
    wildlife: >-
      Along the shore you will spot Cory's shearwaters (*Calonectris borealis*), common terns (*Sterna
      hirundo*), roseate terns (*Sterna dougallii*) and assorted Azorean land birds. Recorded visitors
      throughout the year include Fea's petrel. Characteristic flora includes the [Azores
      heather](/especie/erica_azorica/), Azores spurge (*Euphorbia azorica*), spiny rush (*Juncus acutus*),
      *Spergularia azorica* and *Ruppia maritima*; close to the spray grows sea fennel (*Crithmum maritimum*);
      and among trees and shrubs are the [Azores juniper](/especie/juniperus_brevifolia/), Azores faya
      (*Morella faya*) and *Picconia azorica*.


      The lagoon serves as a marine nursery: breeding grounds for dusky grouper, island grouper (*Mycteroperca
      fusca*) and grey mullet. It harbours the only population of grooved carpet shell clam (*Ruditapes
      decussatus*) commercially exploited in the Azores, the prime reason the reserve was established.


      Nearby lies Fajã dos Cubres, which takes its name from *cubres* (*Solidago azorica*), a native plant
      with small yellow flowers.
    visit: >-
      The classic excursion is a linear 9.5 km walk from Serra do Topo down to Caldeira de Santo Cristo and on
      to Fajã dos Cubres, taking two and a half hours. It begins near the Pico da Urze wind farm, passes
      through the fajã and concludes at Fajã dos Cubres. Designated PRC 1 SJO (Caldeira de Santo Cristo), it
      is arguably the most famous hike on São Jorge.


      Halfway along the route you pass the Santuário do Senhor Santo Cristo and the Environmental
      Interpretation Centre.
    history: >-
      The chapel was consecrated on 10 November 1835 and has served ever since as a pilgrimage destination for
      devotees across the island. The patron saint festival takes place on the first Sunday of September, with
      mass and solemn procession.


      In 1891 the fajã counted one hundred and eleven residents and even had an elementary school, which
      closed when student numbers dwindled. In 1980 an earthquake triggered landslides across both access
      paths, cut phone lines and isolated the fajã; residents had to be evacuated by helicopter. Today few
      permanent dwellers remain, including the nature reserve warden.


      It was designated a Nature Reserve in 1984, primarily to safeguard the lagoon clams. Today it forms part
      of the Natura 2000 network, is a designated Ramsar wetland and a priority geosite within the Azores
      Geopark, a territory spanning one hundred and twenty-one geological heritage geosites across the nine
      volcanic islands.
    before: >-
      The route is linear from Serra do Topo to Fajã dos Cubres, so plan your return transport in advance.
      Keep in mind that this northern coast experiences strong storms and rough seas.
    around: >-
      Fajã da Caldeira de Santo Cristo shares with the [Corvo Island Natural
      Park](/lugar/parque-natural-da-ilha-do-corvo/) and [Rocha do Navio Nature
      Reserve](/lugar/reserva-natural-da-rocha-do-navio/) its sheer basalt cliffs, breeding Cory's shearwaters
      and Azores juniper. At [Pointe du Raz in Cap Sizun](/lugar/pointe-du-raz-en-cap-sizun/), in Brittany,
      the Atlantic meets another wild cliffscape.
  fr:
    intro: >-
      Au bout du sentier s'étendent une plage de galets, une lagune et une poignée de bâtisses coincées entre
      l'océan impétueux et le versant montagneux. La Fajã da Caldeira de Santo Cristo se situe dans la
      paroisse de Ribeira Seca, commune de Calheta sur l'île de São Jorge, entre la Fajã dos Tijolos et la
      Fajã Redonda. Une fajã est un replat d'éboulis côtiers, et São Jorge, longue et étroite, en regorge.
      Celle-ci est la plus célèbre, et bénéficie en outre du statut de réserve naturelle.
    landscape: >-
      São Jorge est une île effilée bordée de falaises vertigineuses, et sa population réside sur les fajãs
      des rivages nord et sud. Au nord-est, la majorité des escarpements atteint entre trois cents et quatre
      cents mètres, avec des pentes de 45 à 55 degrés, laissant les fajãs nichées au pied des falaises face
      aux flots. L'île est née d'un volcanisme fissural associé à la dorsale médio-atlantique, dont témoignent
      les cônes de scories alignés sur l'axe central.


      La lagune procède de la conjonction des éléments. L'érosion marine, les pluies et le ruissellement ont
      façonné cette lagune côtière, isolée de la mer par un cordon de galets. Lors des tempêtes
      septentrionales, le goulet de communication marine s'était comblé, avant d'être récemment rétabli. Les
      lagunes de la Fajã dos Cubres et de Santo Cristo composent l'unique complexe lagunaire littoral de tout
      l'archipel.


      Le climat est subtropical humide, avec des hivers doux et des étés chauds tempérés par le Gulf Stream,
      conférant aux fajãs basses une douceur supérieure à celle des crêtes.
    wildlife: >-
      Sur la côte se remarquent le puffin cendré (*Calonectris borealis*), la sterne pierregarin (*Sterna
      hirundo*), la sterne de Dougall (*Sterna dougallii*) et divers passereaux insulaires. Parmi les
      visiteurs réguliers figure le pétrel de Fea. La flore se distingue par la [bruyère des
      Açores](/especie/erica_azorica/), l'euphorbe des Açores (*Euphorbia azorica*), le jonc piquant (*Juncus
      acutus*), *Spergularia azorica* et *Ruppia maritima* ; en zone d'embruns croît la criste marine
      (*Crithmum maritimum*) ; parmi les ligneux figurent le [genévrier des
      Açores](/especie/juniperus_brevifolia/), le myrique faya (*Morella faya*) et *Picconia azorica*.


      La lagune fait office de nourricerie : frayères de mérous, badèches (*Mycteroperca fusca*) et mulets.
      Elle abrite l'unique gisement de palourdes d'Europe (*Ruditapes decussatus*) exploité commercialement
      aux Açores, raison première du classement en réserve naturelle.


      Tout près se dresse la Fajã dos Cubres, dont le nom provient d'une plante indigène, *Solidago azorica*,
      parée de petites fleurs jaunes.
    visit: >-
      L'itinéraire traditionnel est une randonnée linéaire de 9,5 km reliant la Serra do Topo à la Caldeira de
      Santo Cristo puis à la Fajã dos Cubres, en deux heures et demie. Il débute près du parc éolien de Pico
      da Urze, traverse la fajã et se termine à la Fajã dos Cubres. Balisé sous le code PRC 1 SJO (Caldeira de
      Santo Cristo), c'est sans doute le parcours pédestre le plus renommé de São Jorge.


      À mi-parcours, vous croisez le sanctuaire du Senhor Santo Cristo et le centre d'interprétation
      environnementale.
    history: >-
      La chapelle fut consacrée le 10 novembre 1835 et attire depuis les pèlerins de toute l'île. La fête
      patronale a lieu le premier dimanche de septembre, rythmée par une messe et une procession.


      En 1891, la fajã comptait cent onze habitants et possédait son école primaire, fermée ultérieurement
      faute d'élèves. En 1980, un séisme provoqua des éboulements barrant les deux voies d'accès, coupa les
      lignes téléphoniques et isola la communauté, nécessitant une évacuation par hélicoptère. Très peu
      d'habitants y demeurent à l'année, dont le garde de la réserve naturelle.


      Le site fut érigé en réserve naturelle en 1984, pour protéger le banc de palourdes de la lagune. Il
      intègre aujourd'hui le réseau Natura 2000, le label Ramsar et constitue un géosite majeur du Géoparc des
      Açores, ensemble de cent vingt-et-un sites d'intérêt géologique répartis sur les neuf îles volcaniques.
    before: >-
      Le parcours étant linéaire de la Serra do Topo à la Fajã dos Cubres, planifiez votre transport de
      retour. Gardez à l'esprit que cette côte septentrionale essuie de vigoureuses tempêtes marines.
    around: >-
      La Fajã da Caldeira de Santo Cristo partage falaises maritimes, puffins cendrés et genévriers des Açores
      avec le [Parc naturel de l'île de Corvo](/lugar/parque-natural-da-ilha-do-corvo/) et la [Réserve
      naturelle de Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/). À la [Pointe du Raz en Cap
      Sizun](/lugar/pointe-du-raz-en-cap-sizun/), en Bretagne, l'océan affronte un autre rivage d'abrupts
      rocheux.
  de:
    intro: >-
      Am Ende des Pfades liegen ein Geröllstrand, eine Lagune und eine Handvoll Steinhäuser, eingezwängt
      zwischen Brandung und Steilhang. Die Fajã da Caldeira de Santo Cristo liegt im Kirchspiel Ribeira Seca
      in der Gemeinde Calheta auf der Insel São Jorge, zwischen der Fajã dos Tijolos und der Fajã Redonda.
      Eine Fajã ist ein Schuttfächer am Fuß von Kliffs, und das schmale São Jorge ist reich an ihnen. Diese
      ist die berühmteste und steht als Naturreservat unter Schutz.
    landscape: >-
      São Jorge ist eine schmale Insel mit gewaltigen Steilküsten, und die Bewohner siedeln auf den Fajãs der
      Nord- und Südküste. Im Nordosten ragen die meisten Klippen zwischen dreihundert und vierhundert Meter
      empor, mit Neigungen zwischen 45 und 55 Grad, sodass die Fajãs eng zwischen Felswand und Atlantik
      eingekeilt sind. Die Insel entstand durch Spaltenvulkanismus am Mittelatlantischen Rücken, dessen
      Eruptionen eine Kette von Schlackenkegeln auf dem Bergrücken hinterließen.


      Die Lagune entstand durch das Zusammenspiel natürlicher Kräfte. Meereserosion, Regen und Hangabfluss
      schufen die Küstenlagune, die durch einen Kieselwall vom Meer getrennt ist. Schwere Nordmeerstürme
      verschütteten einst die Verbindung zum Meer, die vor Kurzem wieder geöffnet wurde. Die Lagunen der Fajã
      dos Cubres und von Santo Cristo bilden das einzige Lagunensystem des Archipels.


      Das Klima ist feucht-subtropisch mit milden Wintern und warmen Sommern unter dem Einfluss des
      Golfstroms; die tief liegenden Fajãs sind spürbar wärmer als das Inselinnere.
    wildlife: >-
      An der Küste lassen sich Gelbschnabel-Sturmtaucher (*Calonectris borealis*), Fluss-Seeschwalben (*Sterna
      hirundo*), Rosenseeschwalben (*Sterna dougallii*) und azoreanische Landvögel beobachten. Unter den
      ganzjährigen Zugvögeln wird der Kapverdensturmvogel verzeichnet. Zu den Pflanzen zählen die
      [Azoren-Heide](/especie/erica_azorica/), die Azoren-Wolfsmilch (*Euphorbia azorica*), die Stechende
      Binse (*Juncus acutus*), *Spergularia azorica* und *Ruppia maritima*; im Gischtbereich wächst
      Meerfenchel (*Crithmum maritimum*); an Gehölzen treten der [Kurzblättrige
      Wacholder](/especie/juniperus_brevifolia/), die Gagelbaum-Art *Morella faya* und *Picconia azorica* auf.


      Die Lagune fungiert als Kinderstube für Meeresfische: Brutplatz für Zackenbarsche, Mycteroperca fusca
      und Meeräschen. Zudem birgt sie das einzige kommerziell genutzte Vorkommen der Teppichmuschel
      (*Ruditapes decussatus*) auf den Azoren—der Hauptgrund für die Ausweisung als Naturreservat.


      Nahebei liegt die Fajã dos Cubres, benannt nach einer Pflanze, der Goldrute *Solidago azorica* mit
      kleinen gelben Blüten.
    visit: >-
      Die klassische Wanderung ist eine Streckenroute über 9,5 km von der Serra do Topo zur Caldeira de Santo
      Cristo und weiter zur Fajã dos Cubres in zweieinhalb Stunden. Sie beginnt nahe dem Windpark Pico da
      Urze, durchquert die Fajã und endet an der Fajã dos Cubres. Unter der Bezeichnung PRC 1 SJO (Caldeira de
      Santo Cristo) gilt sie als berühmteste Tour auf São Jorge.


      Unterwegs passierst du das Heiligtum Senhor Santo Cristo und das Umweltbildungszentrum.
    history: >-
      Die Kapelle wurde am 10. November 1835 geweiht und dient seither als Wallfahrtsort für Pilger der ganzen
      Insel. Das Patronatsfest findet am ersten Septembersonntag mit Festmesse und Prozession statt.


      Im Jahr 1891 zählte die Fajã einhundertelf Einwohner und besaß eine eigene Grundschule, die mangels
      Schülern schloss. 1980 schnitt ein Erdbeben beide Zugänge ab, zerstörte das Telefonnetz und isolierte
      die Siedlung; die Bewohner mussten per Hubschrauber evakuiert werden. Heute leben nur noch wenige
      Menschen dauerhaft hier, darunter der Reservatsaufseher.


      Die Einstufung als Naturreservat erfolgte 1984 zum Schutz der Lagunenmuscheln. Heute gehört das Gebiet
      zu Natura 2000, ist ein Ramsar-Feuchtgebiet und ein bedeutender Geotop des Geoparks Azoren, der
      einhundertundeinundzwanzig geologische Stätten auf den neun Vulkaninseln umfasst.
    before: >-
      Da die Route von der Serra do Topo zur Fajã dos Cubres linear verläuft, organisiere die Rückfahrt vorab.
      Beachte, dass an der Nordküste oft heftige Brandung und Stürme herrschen.
    around: >-
      Die Fajã da Caldeira de Santo Cristo teilt Basaltkliffs, Gelbschnabel-Sturmtaucher und Wacholder mit dem
      [Naturpark der Insel Corvo](/lugar/parque-natural-da-ilha-do-corvo/) und dem [Naturreservat Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/). An der [Pointe du Raz im Cap
      Sizun](/lugar/pointe-du-raz-en-cap-sizun/) in der Bretagne brandet der Atlantik an vergleichbar raue
      Klippen.
  it:
    intro: >-
      Al termine del sentiero compaiono una spiaggia di ciottoli, una laguna e una manciata di case
      incastonate tra il maremoto e il pendio montano. La Fajã da Caldeira de Santo Cristo sorge nella
      parrocchia di Ribeira Seca, nel comune di Calheta sull'isola di São Jorge, tra la Fajã dos Tijolos e la
      Fajã Redonda. Una fajã è una cengia detritica litoranea, e São Jorge, affusolata e stretta, ne conta a
      decine. Questa è la più celebre ed è tutelata quale riserva naturale.
    landscape: >-
      São Jorge è un'isola allungata orlata da imponenti scogliere, e la popolazione risiede nelle fajãs delle
      coste settentrionale e meridionale. A nord-est, la maggior parte delle falesie tocca quote tra trecento
      e quattrocento metri, con pendenze tra 45 e 55 gradi, lasciando le fajãs strette tra i muraglioni
      rocciosi e l'oceano. L'isola è frutto di vulcanismo fissurale lungo la dorsale medio-atlantica, con
      allineamenti di coni vulcanici lungo la dorsale centrale.


      La laguna è nata dall'interazione di vari fattori geodinamici. L'erosione marina, la pioggia e il
      dilavamento hanno scavato la laguna salmastra, separata dal mare aperto da un cordone di ciottoli.
      Durante le tempeste di questo versante nord il canale di sbocco a mare finì per ostruirsi, per poi
      venire ripristinato in epoca recente. I bacini di Fajã dos Cubres e di Santo Cristo formano l'unico
      sistema lagunare costiero dell'arcipelago.


      Il clima è subtropicale umido, con inverni miti ed estati calde mitigate dalla Corrente del Golfo; le
      fajãs sul livello del mare risultano più calde rispetto all'altopiano interno.
    wildlife: >-
      Lungo costa si avvistano berte maggiori (*Calonectris borealis*), sterne comuni (*Sterna hirundo*),
      sterne di Dougall (*Sterna dougallii*) e vari uccelli terrestri azzorriani. Tra le specie segnalate
      nell'arco dell'anno compare il petrello di Fea. La flora annovera l'[erica delle
      Azzorre](/especie/erica_azorica/), l'euforbia delle Azzorre (*Euphorbia azorica*), il giunco pungente
      (*Juncus acutus*), *Spergularia azorica* e *Ruppia maritima*; vicino alla battigia alligna il finocchio
      di mare (*Crithmum maritimum*); tra alberi e arbusti figurano il [ginepro delle
      Azzorre](/especie/juniperus_brevifolia/), il faya (*Morella faya*) e la *Picconia azorica*.


      La laguna funge da vivaio naturale: aree di riproduzione per cernie brune, dotti (*Mycteroperca fusca*)
      e cefali. Custodisce inoltre l'unica popolazione di vongola verace (*Ruditapes decussatus*) sfruttata a
      fini commerciali nelle Azzorre, motivazione principale dell'istituzione dell'area protetta.


      Nelle vicinanze si trova la Fajã dos Cubres, intitolata alla verga d'oro azzorriana (*Solidago
      azorica*), erba spontanea dai minuscoli capolini gialli.
    visit: >-
      L'escursione tipica è un percorso lineare di 9,5 km che dalla Serra do Topo scende alla Caldeira de
      Santo Cristo per terminare alla Fajã dos Cubres in due ore e mezza. Parte nei pressi del parco eolico di
      Pico da Urze, attraversa la fajã e si chiude alla Fajã dos Cubres. Siglato PRC 1 SJO (Caldeira de Santo
      Cristo), è con ogni probabilità il tracciato escursionistico più celebre di São Jorge.


      A metà cammino si toccano il Santuário do Senhor Santo Cristo e il Centro di Interpretazione Ambientale.
    history: >-
      La chiesetta fu consacrata il 10 novembre 1835 ed è da allora meta di devozione per tutta l'isola. La
      festa patronale cade la prima domenica di settembre, accompagnata da messa e processione solenne.


      Nel 1891 la fajã registrava centoundici abitanti e disponeva persino di una scuola elementare, dismessa
      per mancanza di allievi. Nel 1980 un violento sisma provocò frane lungo entrambi i collegamenti,
      distrusse la linea telefonica e isolò la contrada, rendendo necessaria l'evacuazione in elicottero. Oggi
      pochissimi residenti vi abitano stabilmente, fra cui il guardaparco.


      Fu classificata Riserva Naturale nel 1984 per salvaguardare il banco di vongole della laguna. Oggi
      appartiene a Natura 2000, è riconosciuta come zona umida Ramsar ed è geosito primario del Geoparco delle
      Azzorre, circuito comprendente centoventuno siti geologici distribuiti sulle nove isole.
    before: >-
      Trattandosi di una camminata in linea dalla Serra do Topo alla Fajã dos Cubres, organizza in anticipo il
      mezzo per il rientro. Tieni a mente che la costa settentrionale è soggetta a forti mareggiate e
      burrasche.
    around: >-
      La Fajã da Caldeira de Santo Cristo condivide falesie a picco, berte maggiori e ginepri delle Azzorre
      con il [Parco Naturale dell'Isola di Corvo](/lugar/parque-natural-da-ilha-do-corvo/) e la [Riserva
      Naturale di Rocha do Navio](/lugar/reserva-natural-da-rocha-do-navio/). A [Pointe du Raz a Cap
      Sizun](/lugar/pointe-du-raz-en-cap-sizun/), in Bretagna, l'Atlantico flagella altrettante vertiginose
      pareti costiere.
  pt:
    intro: >-
      No fim do trilho encontram-se uma praia de calhaus rolados, uma lagoa e um punhado de casas aconchegadas
      entre o mar bravio e a vertente escarpada. A Fajã da Caldeira de Santo Cristo situa-se na freguesia da
      Ribeira Seca, no concelho da Calheta, na ilha de São Jorge, entre a Fajã dos Tijolos e a Fajã Redonda.
      Uma fajã é uma plataforma de detritos geológicos, e São Jorge, comprida e estreita, está repleta delas.
      Esta é a mais emblemática, constituindo além disso uma reserva natural.
    landscape: >-
      São Jorge é uma ilha esguia de altas arribas, e os seus povoadores vivem nas fajãs das vertentes norte e
      sul. No nordeste, a maioria das falésias ergue-se entre trezentos e quatrocentos metros, com declives
      acentuados entre 45 e 55 graus, entalando as fajãs entre as escarpas e o mar. A ilha formou-se por
      vulcanismo fissural associado à dorsal mesoatlântica, restando dessas erupções os cones vulcânicos
      alinhados na cordilheira central.


      A lagoa resulta da conjugação de forças naturais. A erosão marinha, as chuvas e os escorrimentos
      esculpiram a lagoa costeira, separada do oceano por um cordão de calhaus. Com as tempestades da costa
      norte o canal que a unia ao mar chegou a ficar obstruído, tendo sido restaurado em tempos recentes. As
      lagoas da Fajã dos Cubres e de Santo Cristo constituem o único sistema lagunar costeiro de todo o
      arquipélago.


      O clima é subtropical húmido, com invernos muito amenos e verões quentes graças à Corrente do Golfo,
      sendo as fajãs litorais mais quentes do que o planalto central.
    wildlife: >-
      Na orla costeira avistam-se cagarros (*Calonectris borealis*), garajaus-comuns (*Sterna hirundo*),
      garajaus-rosados (*Sterna dougallii*) e vários passeriformes açorianos. Entre as aves assinaladas ao
      longo do ano conta-se a freira-do-bugio. Na vegetação destacam-se a
      [erva-doce-dos-açores](/especie/erica_azorica/), a maleita-dos-açores (*Euphorbia azorica*), o
      junco-marítimo (*Juncus acutus*), a *Spergularia azorica* e a *Ruppia maritima*; junto à rebentação
      surge o funcho-marinho (*Crithmum maritimum*); e entre as árvores e arbustos figuram o
      [cedro-do-mato](/especie/juniperus_brevifolia/), a faia-das-ilhas (*Morella faya*) e o pau-branco
      (*Picconia azorica*).


      A lagoa funciona como viveiro marinho: zonas de refúgio para meros, badejos (*Mycteroperca fusca*) e
      tainhas. Abriga a única população de amêijoa-boa (*Ruditapes decussatus*) explorada comercialmente nos
      Açores, razão motriz para a criação da reserva.


      Perto dali fica a Fajã dos Cubres, cujo topónimo deriva dos cubres (*Solidago azorica*), planta endémica
      de pequenas flores amarelas.
    visit: >-
      O percurso clássico é um trilho pedestre linear de 9,5 km que desce da Serra do Topo até à Caldeira de
      Santo Cristo e segue até à Fajã dos Cubres, demorando duas horas e meia. Tem início junto ao parque
      eólico do Pico da Urze, cruza a fajã e termina na Fajã dos Cubres. Sob a designação PRC 1 SJO (Caldeira
      de Santo Cristo), é porventura o trilho mais afamado de São Jorge.


      A meio caminho passas pelo Santuário do Senhor Santo Cristo e pelo Centro de Interpretação Ambiental.
    history: >-
      A ermida foi benzida a 10 de novembro de 1835 e desde então converteu-se em polo de romarias de fiéis de
      toda a ilha. A festa litúrgica realiza-se no primeiro domingo de setembro, com missa campal e procissão.


      Em 1891 a fajã acolhia cento e onze habitantes, tendo chegado a dispor de escola primária, extinta por
      falta de crianças. Em 1980 um sismo gerou derrocadas nos dois acessos, inutilizou a rede telefónica e
      isolou a fajã, obrigando à evacuação dos residentes por helicóptero. Hoje subsistem raros habitantes
      permanentes, entre eles o vigilante da Reserva Natural.


      Foi classificada como Reserva Natural em 1984 para resguardar as amêijoas da lagoa. Integra atualmente a
      rede Natura 2000, está classificada como sítio Ramsar e é geossítio prioritário do Geoparque Açores,
      conjunto de cento e vinte e um geossítios distribuídos pelas nove ilhas.
    before: >-
      Sendo o percurso linear da Serra do Topo à Fajã dos Cubres, acautela previamente o regresso. Lembra-te
      de que a costa norte sofre tempestades oceânicas e forte agitação marítima.
    around: >-
      A Fajã da Caldeira de Santo Cristo partilha falésias verticais, cagarros e cedros-do-mato com o [Parque
      Natural da Ilha do Corvo](/lugar/parque-natural-da-ilha-do-corvo/) e a [Reserva Natural da Rocha do
      Navio](/lugar/reserva-natural-da-rocha-do-navio/). Na [Pointe du Raz em Cap
      Sizun](/lugar/pointe-du-raz-en-cap-sizun/), na Bretanha, o Atlântico embate contra outra imponente
      barreira de arribas.
