observaciones:
  es: >-
    En el lago y sus bosques están prohibidos la pesca, el baño y la navegación. En la reserva rige el máximo
    grado de protección, el quinto. Buena parte del territorio Patrimonio Mundial está en el distrito militar
    de Valaškovce y no es accesible; el resto se recorre por senderos bien conectados.
texto:
  es:
    intro: >-
      Un lago nació porque se vino abajo una ladera. Cuando la actividad volcánica de Vihorlat se apagaba, un
      gran deslizamiento de las laderas de Motrogon y Jedlinka cerró el valle del arroyo Okna, y detrás de esa
      barrera se llenó el agua. Hoy el lago se llama Morské oko, el «ojo de mar», y lo rodean hayedos que
      forman parte de uno de los bosques primarios declarados Patrimonio Mundial. Es un rincón del este de
      Eslovaquia donde se camina entre volcán, agua y árboles viejos.
    landscape: >-
      Vihorlat es un macizo volcánico de poca extensión que se alza sobre la llanura de Eslovaquia oriental,
      con cumbres que pasan de los mil metros. Su posición, en el límite entre la flora panónica y la
      carpática, explica gran parte de lo que verás: el lago Morské oko, el Sninský kameň, las turberas altas
      y una mezcla de plantas del norte y del sur. En la cara norte crecen plantas de montaña como la
      soldanela carpática, y en las laderas del sur hay bosque estepario con especies de clima cálido.


      El lago es el mayor de los montes Vihorlat y el tercer mayor lago natural de Eslovaquia, tras los dos de
      los Altos Tatras. Mide 750 m de largo y llega a 25,1 m de profundidad. Su forma actual viene de finales
      del siglo XIX, cuando se construyó un muro de presa artificial. El nombre «morské oko» se reserva a
      lagos de origen glaciar, y como este no lo es, los científicos intentaron darle otros nombres.


      Alrededor manda el haya. Vihorlat es una de las cordilleras más boscosas del país, con bosques de
      frondosas donde dominan los hayedos, con roble, fresno, arce y abeto. Al norte del lago, el componente
      Patrimonio Mundial es un gran complejo de hayedos primarios que se extiende por la cresta principal
      hasta el macizo de Nežabec. En las laderas norte del pico Vihorlat se conservó un bosque de aspecto
      primario entre 800 y 1000 m. Y la historia del haya cuenta que sobrevivió a la última glaciación en
      pequeños refugios del sur de Europa y que su dominio actual se desarrolló en los últimos 4000 años.
    wildlife: >-
      En primavera, los carpinares del suroeste se llenan de campanillas de invierno carpáticas: es la mayor y
      más rica localidad de esta planta en el país. Después llegan otras. En las turberas crecen la drosera de
      hojas redondas, el licopodio de aguas y la algodonera vaginada, y una festuca endémica, Festuca ovina
      vihorlatica, vive solo en Sninský kameň. En total se conocen unas 400 especies de hongos, 60 de
      líquenes, 110 de musgos y 600 de plantas superiores.


      Entre los vertebrados, anidan unas 100 especies de aves: en los hayedos puede verse la [cigüeña
      negra](/especie/ciconia_nigra/) y el [cárabo uralense](/especie/strix_uralensis/). Entre las rapaces, la
      más común es el [ratonero común](/especie/buteo_buteo/); también anidan el [halcón
      abejero](/especie/pernis_apivorus/) y el [águila pomerana](/especie/aquila_pomarina/). Los bosques
      densos son hogar del [lobo](/especie/canis_lupus/), el [gato montés](/especie/felis_silvestris/), el
      [lince](/especie/lynx_lynx/), la [marta](/especie/martes_martes/) y el [oso
      pardo](/especie/ursus_arctos/).


      La fauna menor es abundante: más de 2000 especies de invertebrados, entre ellas el [longicornio
      alpino](/especie/rosalia_alpina/), y anfibios como la rana bermeja, la [salamandra
      común](/especie/salamandra_salamandra/) y los cuatro tritones del país. La culebra de Esculapio es
      típica de la zona y la víbora común aparece rara vez. El mejor tramo del año para recorrerlo es de mayo
      a octubre.
    visit: >-
      El lago se alcanza desde Remetské Hámre, con un sendero educativo de marca azul. Un aparcamiento,
      Krivec, queda a unos 15 minutos a pie bajo el lago. Junto al lago hay un centro de información en la
      reserva de Vihorlatský prales.


      El circuito educativo de Morské oko recorre 4 km, es físicamente sencillo y trata la geología, las aves
      y los bosques locales. Pasa por hayedos con estructura de bosque primario y puede partir del
      aparcamiento junto al lago, de Remetské Hámre o de Sninské rybníky. Desde el lago, el Sninský kameň se
      alcanza por la marca azul en una hora y 35 minutos a pie, y Malé Morské oko, el segundo lago mejor
      conservado, está a unos 30 minutos por la marca amarilla.


      Para entrar en el bosque, el otro sendero educativo es Vihorlatskými bučinami, de marca verde, que va de
      Poruba pod Vihorlatom al collado de Tri Table. Y desde 2019 existe un sendero señalizado, Podhoroď –
      Beňatina – Starý Koňuš – Koňuš, que lleva a las praderas de Starý Koňuš, con orquídeas como Dactylorhiza
      sambucina y Orchis morio y el lirio Iris graminea.
    history: >-
      Junto al lago se construyeron dos refugios, los primeros edificios turísticos de Eslovaquia fuera de los
      Altos Tatras. Cuatro lugares de Eslovaquia entraron en 2007 en la lista del Patrimonio Mundial: tres en
      el parque nacional Poloniny y uno en Vihorlat. El área protegida de Vihorlat se creó el 28 de diciembre
      de 1973.


      Las pistas forestales y la tala rasa son un riesgo para el lago, porque la erosión arrastra tierra y
      materia orgánica y reduce el oxígeno del agua. Y hay otra amenaza más discreta: las praderas de Starý
      Koňuš necesitan siega o pastoreo regular; si no, avanzan los arbustos y vuelven a ser bosque.
    before: >-
      En el lago y sus bosques están prohibidos la pesca, el baño y la navegación. En la reserva rige el
      máximo grado de protección, el quinto. Buena parte del territorio Patrimonio Mundial está en el distrito
      militar de Valaškovce y no es accesible; el resto se recorre por senderos bien conectados.
    around: >-
      En el mismo rincón de Eslovaquia hay otras reservas de hayedos primarios: el [Complejo de Bosques
      Vírgenes de Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/), en el NP Poloniny, a
      11 km, es el más cercano; siguen la [Reserva Natural Estricta
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), la [Reserva Natural Estricta
      Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) y la [Reserva Natural Estricta
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). Al otro lado de la frontera queda el [Parque
      Nacional de Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/). Más lejos, los [Valles
      Kársticos de Prosiecka y Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) comparten con Vihorlat
      el tritón de los Cárpatos, el lince y el oso pardo.
  en:
    intro: >-
      A lake was born when a mountainside collapsed. As volcanic activity across Vihorlat waned, a
      catastrophic landslide tearing down the slopes of Motrogon and Jedlinka dammed the valley of the Okna
      stream, impounding pristine waters behind the debris. Today this lake is called Morské oko, the 'Eye of
      the Sea', surrounded by ancient beech forests that form part of a UNESCO World Heritage primeval forest
      network. It is a secluded haven in eastern Slovakia where you hike among dormant volcanoes, clear
      waters, and venerable trees.
    landscape: >-
      Vihorlat is a compact volcanic mountain chain rising sharply above the East Slovakian Lowland, with
      summits exceeding one thousand metres. Its biogeographical setting at the crossroads of Pannonian and
      Carpathian floras shapes its unique ecology: Lake Morské oko, the volcanic crags of Sninský kameň, high
      peat bogs, and a curious blend of northern and southern flora. On cooler northern aspects thrive alpine
      elements such as the Carpathian snowbell, while southern slopes shelter steppe-like forest communities
      adapted to warmer conditions.


      The lake is the largest in the Vihorlat Mountains and the third largest natural waterbody in Slovakia,
      surpassed only by two glacial tarns in the High Tatras. It measures 750 m in length and plunges to a
      depth of 25.1 m. Its present outline was formalized in the late nineteenth century when a low stone
      masonry retaining wall was constructed. While the Slovak term 'morské oko' typically designates alpine
      glacial tarns, scientists' historical attempts to rechristen this volcanic lake never took root.


      Everywhere, European beech reigns supreme. Vihorlat stands among the most densely forested ranges in the
      country, boasting broadleaf woodlands dominated by beech alongside oak, ash, sycamore maple, and silver
      fir. North of the lake, the World Heritage component encompasses a contiguous tract of primeval beech
      forest following the main crest towards the Nežabec massif. Across the northern slopes of Vihorlat peak
      survives another virgin tract between 800 and 1000 m. Beech survival history reveals that the species
      endured the last ice age in southern European glacial refugia, expanding its current hegemony over the
      past 4000 years.
    wildlife: >-
      In spring, the oak-hornbeam woods of the south-western foothills carpet themselves with Carpathian
      snowdrops: this is the most prolific wild locality of the species in Slovakia. Later come other
      botanical gems. The upland bogs nurture round-leaved sundew, marsh clubmoss, and tussock cottongrass,
      while a local endemic fescue, *Festuca ovina vihorlatica*, clings exclusively to the rocks of Sninský
      kameň. In total, botanists record some 400 fungal species, 60 lichens, 110 bryophytes, and 600 higher
      vascular plants.


      Among vertebrates, around 100 bird species breed here: the beech canopy shelters nesting [black
      stork](/especie/ciconia_nigra/) and [Ural owl](/especie/strix_uralensis/). Diurnal raptors are led by
      the [common buzzard](/especie/buteo_buteo/), alongside [European honey
      buzzard](/especie/pernis_apivorus/) and [lesser spotted eagle](/especie/aquila_pomarina/). These vast
      forests shelter the [wolf](/especie/canis_lupus/), [wildcat](/especie/felis_silvestris/), [Eurasian
      lynx](/especie/lynx_lynx/), [pine marten](/especie/martes_martes/), and [brown
      bear](/especie/ursus_arctos/).


      Invertebrate diversity is exceptionally rich, exceeding 2000 recorded taxa, including the saproxylic
      [rosalia longicorn](/especie/rosalia_alpina/). Amphibians include common frog, [fire
      salamander](/especie/salamandra_salamandra/), and all four Slovakian newt species. Aesculapian snake is
      typical of the forest floor, whereas common viper occurs only sporadically. The optimal period for
      walking these trails is May to October.
    visit: >-
      The lake is reached from Remetské Hámre along a blue-marked educational trail. A car park, Krivec, lies
      approximately 15 minutes on foot below the lake. Beside the water, an information pavilion serves the
      Vihorlatský prales nature reserve.


      The Morské oko educational circular route covers 4 km, is physically gentle, and interprets local
      geology, ornithology, and forest ecology. It traverses beech stands displaying old-growth structure,
      accessible from the lakeside parking area, Remetské Hámre, or Sninské rybníky. From the lake, Sninský
      kameň can be climbed via the blue-marked trail in one hour and 35 minutes on foot, while Malé Morské
      oko, an exquisitely preserved satellite lake, lies about 30 minutes away along yellow markings.


      To venture deeper into the forest, follow the green-marked Vihorlatskými bučinami educational trail
      leading from Poruba pod Vihorlatom to Tri Table pass. In addition, since 2019 a marked hiking route
      links Podhoroď – Beňatina – Starý Koňuš – Koňuš, leading to the species-rich meadows of Starý Koňuš,
      renowned for elder-flowered orchid, green-winged orchid, and grassy iris (*Iris graminea*).
    history: >-
      Two historical wooden hunting lodges were built beside the lake, representing the earliest tourist
      accommodation in Slovakia outside the High Tatras. Four Slovak forest reserves were inscribed on the
      UNESCO World Heritage list in 2007: three within Poloniny National Park and one in Vihorlat. The
      Vihorlat Protected Landscape Area was established on 28 December 1973.


      Logging tracks and clear-cutting along peripheral zones pose erosion hazards for the lake, as silt
      washed into the basin reduces dissolved oxygen levels. A more subtle ecological challenge affects the
      semi-natural meadows of Starý Koňuš: they require regular mowing or extensive grazing to prevent scrub
      encroachment from returning them to dense forest.
    before: >-
      Swimming, recreational boating, and angling are strictly prohibited in the lake and surrounding waters.
      The core reserve falls under Slovakia's strictest fifth level of nature protection. Large tracts of the
      World Heritage property lie within the Valaškovce military training area and are off-limits; the
      accessible sectors are traversed by marked trails.
    around: >-
      In this same eastern corner of Slovakia lie other premier old-growth beech reserves: the [Bukovské Vrchy
      Primeval Beech Complex](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) in Poloniny National Park,
      11 km away, is the closest; followed by [Havešová Strict Nature
      Reserve](/lugar/narodna-prirodna-rezervacia-havesova/), [Rožok Strict Nature
      Reserve](/lugar/narodna-prirodna-rezervacia-rozok/), and [Stužica Strict Nature
      Reserve](/lugar/narodna-prirodna-rezervacia-stuzica/). Just across the border lies [Bieszczady National
      Park](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/). Further west, [Prosiecka and Kvačianska
      Karst Valleys](/lugar/npr-kvacianska-a-prosiecka-dolina/) share with Vihorlat the Carpathian newt, lynx,
      and brown bear.
  fr:
    intro: >-
      Un lac est né de l'effondrement d'un flanc de montagne. Alors que l'activité volcanique du Vihorlat
      s'éteignait, un glissement colossal dévalant les pentes de Motrogon et Jedlinka vint barrer la vallée du
      ruisseau Okna, retenant les eaux dans une cuvette naturelle. Ce plan d'eau porte aujourd'hui le nom de
      Morské oko, l'« œil de mer », entouré de hêtraies qui figurent parmi les forêts primaires classées au
      patrimoine mondial. C'est un recoin préservé de l'est slovaque où l'on chemine entre reliefs
      volcaniques, eaux pures et arbres séculaires.
    landscape: >-
      Le Vihorlat est un massif volcanique de taille modeste dominant la plaine de Slovaquie orientale, avec
      des crêtes dépassant mille mètres. Sa position charnière entre flores pannonienne et carpatique façonne
      son originalité : le lac Morské oko, les pitons rocheux du Sninský kameň, les tourbières bombées et un
      mélange d'essences boréales et méridionales. Les versants nord abritent des espèces d'altitude comme la
      soldanelle des Carpates, tandis que les pentes sud accueillent une forêt steppique thermophile.


      Le lac est le plus vaste des monts Vihorlat et le troisième lac naturel de Slovaquie, après les deux
      grands lacs d'altitude des Hautes Tatras. Il mesure 750 m de longueur et atteint 25,1 m de profondeur.
      Sa configuration actuelle date de la fin du XIXe siècle, lorsqu'une digue maçonnée fut édifiée. Le
      toponyme « morské oko » étant d'ordinaire dévolu aux lacs glaciaires, les scientifiques tentèrent sans
      succès de lui donner d'autres appellations.


      Tout autour, le hêtre domine en maître. Le Vihorlat est l'un des massifs les plus boisés de Slovaquie,
      avec des forêts feuillues dominées par les hêtraies associées au chêne, frêne, érable et sapin pectiné.
      Au nord du lac, le site classé par l'UNESCO constitue un vaste ensemble de forêts primaires suivant la
      crête principale jusqu'au massif de Nežabec. Sur les pentes nord du mont Vihorlat, une forêt d'aspect
      vierge s'est maintenue entre 800 et 1000 m. L'histoire du hêtre rappelle qu'il a survécu à la dernière
      glaciation dans des refuges d'Europe méridionale avant de conquérir son hégémonie au cours des 4000
      dernières années.
    wildlife: >-
      Au printemps, les charmaies du sud-ouest se couvrent de perce-neige des Carpates : c'est la station la
      plus étendue et la plus opulente de cette plante en Slovaquie. Plus tard fleurissent d'autres raretés.
      Dans les tourbières poussent la droséra à feuilles rondes, le lycopode des tourbières et la linaigrette
      engainante, tandis qu'une fétuque endémique, *Festuca ovina vihorlatica*, est exclusive aux rochers du
      Sninský kameň. On dénombre environ 400 espèces de champignons, 60 de lichens, 110 de mousses et 600 de
      plantes vasculaires.


      Côté vertébrés nichent environ 100 espèces d'oiseaux : les hêtraies accueillent la [cigogne
      noire](/especie/ciconia_nigra/) et la [chouette de l'Oural](/especie/strix_uralensis/). Parmi les
      rapaces diurnes, le plus commun est la [buse variable](/especie/buteo_buteo/), côtoyant la [bondrée
      apivore](/especie/pernis_apivorus/) et l'[aigle pomarin](/especie/aquila_pomarina/). Les grands massifs
      abritent le [loup gris](/especie/canis_lupus/), le [chat forestier](/especie/felis_silvestris/), le
      [lynx boréal](/especie/lynx_lynx/), la [martre des pins](/especie/martes_martes/) et l'[ours
      brun](/especie/ursus_arctos/).


      La faune invertébrée est foisonnante : plus de 2000 espèces, dont la [rosalie des
      Alpes](/especie/rosalia_alpina/), et des amphibiens comme la grenouille rousse, la [salamandre
      tachetée](/especie/salamandra_salamandra/) et les quatre tritons indigènes. La couleuvre d'Esculape est
      commune alors que la vipère péliade est rare. La période la plus agréable pour parcourir ces sentiers va
      de mai à octobre.
    visit: >-
      Le lac est accessible depuis Remetské Hámre par un sentier didactique balisé en bleu. Le stationnement
      de Krivec se trouve à environ 15 minutes à pied en contrebas. Au bord de l'eau, un point d'information
      dessert la réserve naturelle de Vihorlatský prales.


      Le sentier pédagogique de Morské oko décrit une boucle de 4 km, d'accès aisé, abordant la géologie, les
      oiseaux et les forêts environnantes. Il traverse des hêtraies à structure de forêt primaire depuis le
      parking du lac, Remetské Hámre ou Sninské rybníky. Depuis les berges, le Sninský kameň s'atteint par le
      balisage bleu en une heure et 35 minutes de marche, tandis que le Malé Morské oko, plan d'eau satellite
      très bien préservé, se rallie en 30 minutes environ par les marques jaunes.


      Pour pénétrer au cœur des futaies, le sentier didactique balisé en vert Vihorlatskými bučinami relie
      Poruba pod Vihorlatom au col de Tri Table. Depuis 2019, un itinéraire balisé relie Podhoroď – Beňatina –
      Starý Koňuš – Koňuš vers les prairies de fauche de Starý Koňuš, réputées pour leurs orchidées sauvages
      et l'iris graminée (*Iris graminea*).
    history: >-
      Deux pavillons historiques de chasse furent construits au bord du lac, premières structures d'accueil
      touristique de Slovaquie en dehors des Hautes Tatras. Quatre massifs forestiers slovaques ont été
      inscrits en 2007 sur la liste du patrimoine mondial : trois dans le parc national Poloniny et un dans le
      Vihorlat. L'aire protégée du Vihorlat a été instituée le 28 décembre 1973.


      Les pistes d'exploitation et les coupes rases en lisière constituent une menace d'érosion pour le lac,
      les sédiments lessivés appauvrissant l'eau en oxygène. Un autre enjeu concerne les prairies de Starý
      Koňuš, qui exigent fauche ou pâturage régulier pour éviter la fermeture du milieu par les taillis.
    before: >-
      La baignade, le canotage et la pêche sont formellement prohibés dans le lac et ses cours d'eau. La
      réserve applique le niveau de protection maximal, le cinquième. Une large portion du bien UNESCO est
      située dans la zone militaire de Valaškovce et n'est pas accessible au public ; le reste s'explore sur
      des sentiers balisés.
    around: >-
      Dans ce même secteur de Slovaquie se trouvent d'autres réserves de hêtraies primaires : le [complexe de
      forêts vierges de Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) dans le parc
      national Poloniny, à 11 km, est le plus proche ; viennent ensuite la [réserve naturelle intégrale de
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), la [réserve naturelle intégrale de
      Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) et la [réserve naturelle intégrale de
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). De l'autre côté de la frontière s'étend le [parc
      national de Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/). Plus loin, les [vallées
      karstiques de Prosiecka et Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) partagent avec le
      Vihorlat triton des Carpates, lynx et ours brun.
  de:
    intro: >-
      Ein See entstand, weil ein Berghang einstürzte. Als die vulkanische Aktivität des Vihorlat erlosch,
      sperrte ein gewaltiger Erdrutsch an den Hängen von Motrogon und Jedlinka das Tal des Okna-Baches ab und
      staute das Wasser zu einem Seebecken auf. Heute heisst das Gewässer Morské oko, das 'Meeresauge',
      umgeben von Buchenwäldern, die Teil des transnationalen UNESCO-Weltnaturerbes alter Buchenwälder sind.
      Es ist ein abgeschiedener Winkel der Ostslowakei, wo Wanderer Vulkanismus, klares Wasser und uralte
      Bäume erleben.
    landscape: >-
      Das Vihorlat ist ein kompaktes vulkanisches Gebirge, das sich markant aus der Ostslowakischen Tiefebene
      erhebt, mit Kuppen über tausend Metern Höhe. Seine Lage an der Schnittstelle pannonischer und
      karpatischer Florenelemente prägt das Landschaftsbild: der See Morské oko, die Felszinnen des Sninský
      kameň, Hochmoore und eine artenreiche Mischung nördlicher und südlicher Pflanzen. An schattigen
      Nordhängen wachsen Gebirgspflanzen wie das Karpaten-Alpenglöckchen, während die Südhänge trockenwarme
      Waldsteppen tragen.


      Der See ist das grösste Gewässer im Vihorlat-Gebirge und der drittgrösste Natursee der Slowakei nach den
      beiden grossen Hochgebirgsseen der Hohen Tatra. Er ist 750 m lang und erreicht eine Tiefe von 25,1 m.
      Seine heutige Ausdehnung geht auf das ausgehende neunzehnte Jahrhundert zurück, als ein künstlicher
      Steindamm errichtet wurde. Da der Begriff 'Morské oko' üblicherweise eiszeitlichen Karseen vorbehalten
      ist, versuchten Wissenschaftler vergeblich, den vulkanischen Stausee umzubenennen.


      Ringsum dominiert die Rotbuche. Das Vihorlat zählt zu den waldreichsten Gebirgen des Landes mit
      Laubwäldern aus Buche, Eiche, Esche, Bergahorn und Tanne. Nördlich des Sees erstreckt sich die
      UNESCO-Kernzone als grosser Buchenurwaldkomplex entlang des Hauptkamms bis zum Nežabec-Massiv. An den
      Nordflanken des Vihorlat-Gipfels blieb zwischen 800 und 1000 m Höhe ein unberührter Urwaldstreifen
      erhalten. Die nacheiszeitliche Geschichte belegt, dass die Buche die letzte Vereisung in Refugien
      Südeuropas überdauerte und ihre mitteleuropäische Dominanz in den letzten 4000 Jahren aufbaute.
    wildlife: >-
      Im Frühjahr verwandeln sich die Eichen-Hainbuchen-Wälder der Südwestflanke in ein Meer aus
      Karpaten-Schneeglöckchen: Es ist das grösste und dichteste Vorkommen dieser Pflanzenart in der gesamten
      Slowakei. Später folgen weitere Raritäten. In den Mooren wachsen Rundblättriger Sonnentau, Sumpf-Bärlapp
      und Scheiden-Wollgras, während ein lokaler Endemit, der Vihorlat-Schafschwingel (*Festuca ovina
      vihorlatica*), nur auf den Felsen des Sninský kameň vorkommt. Insgesamt sind rund 400 Pilzarten, 60
      Flechten, 110 Moose und 600 höhere Gefässpflanzen nachgewiesen.


      Unter den Wirbeltieren brüten etwa 100 Vogelarten: In den Buchenforsten horsten
      [Schwarzstorch](/especie/ciconia_nigra/) und [Habichtskauz](/especie/strix_uralensis/). Bei den
      Greifvögeln dominiert der [Mäusebussard](/especie/buteo_buteo/), begleitet von
      [Wespenbussard](/especie/pernis_apivorus/) und [Schreiadler](/especie/aquila_pomarina/). Die dichten
      Wälder bieten Lebensraum für [Wolf](/especie/canis_lupus/), [Wildkatze](/especie/felis_silvestris/),
      [Eurasischen Luchs](/especie/lynx_lynx/), [Baummarder](/especie/martes_martes/) und
      [Braunbären](/especie/ursus_arctos/).


      Die Wirbellosenfauna zählt über 2000 Arten, darunter der geschützte
      [Alpenbock](/especie/rosalia_alpina/). Bei den Lurchen kommen Grasfrosch,
      [Feuersalamander](/especie/salamandra_salamandra/) und alle vier slowakischen Molcharten vor. Die
      Äskulapnatter ist landschaftstypisch, während die Kreuzotter nur selten auftritt. Die beste Besuchszeit
      reicht von Mai bis Oktober.
    visit: >-
      Der See ist von Remetské Hámre aus über einen blau markierten Naturlehrpfad erreichbar. Der
      Wanderparkplatz Krivec liegt etwa 15 Gehminuten unterhalb des Ufers. Am See informiert ein
      Informationszentrum über das Naturreservat Vihorlatský prales.


      Der Rundweg Morské oko misst 4 km, ist leicht zu gehen und erläutert Geologie, Vogelwelt und
      Urwaldstrukturen. Er führt durch Altbuchenbestände und kann am Parkplatz, in Remetské Hámre oder an den
      Teichen von Snina begonnen werden. Vom Ufer aus wird der Sninský kameň über die blaue Markierung in
      einer Stunde und 35 Gehminuten erreicht; der kleinere See Malé Morské oko liegt rund 30 Minuten entlang
      der gelben Markierung entfernt.


      Tiefer in die Wälder führt der grün markierte Lehrpfad Vihorlatskými bučinami von Poruba pod Vihorlatom
      zum Pass Tri Table. Zudem verbindet seit 2019 ein markierter Weg Podhoroď – Beňatina – Starý Koňuš –
      Koňuš die artenreichen Bergwiesen von Starý Koňuš, bekannt für Holunder-Knabenkraut, Kleines Knabenkraut
      und Gras-Schwertlilie (*Iris graminea*).
    history: >-
      Am Seeufer entstanden einst zwei hölzerne Jagdhäuser – die ersten touristischen Unterkünfte der Slowakei
      ausserhalb der Hohen Tatra. Vier slowakische Waldreservate wurden 2007 in das UNESCO-Welterbe
      aufgenommen: drei im Nationalpark Poloniny und eines im Vihorlat. Das Landschaftsschutzgebiet Vihorlat
      wurde am 28. Dezember 1973 eingerichtet.


      Forstwege und Kahlschläge an den Grenzen des Reservats bergen Erosionsrisiken für den See, da
      eingeschwemmter Schlamm das Wasser eintrübt und Sauerstoff zehrt. Eine weitere Naturschutzaufgabe
      betrifft die Magerwiesen von Starý Koňuš, die regelmässige Mahd oder extensive Beweidung erfordern, um
      nicht durch Gebüsch zu verwalden.
    before: >-
      Im See und seinen Zuflüssen sind Baden, Bootsfahren und Angeln streng untersagt. Das Reservat unterliegt
      der höchsten slowakischen Schutzstufe fünf. Grosse Teile des Welterbegebiets liegen im Militärbezirk
      Valaškovce und sind unzugänglich; die freigegebenen Abschnitte sind markiert.
    around: >-
      Im selben Winkel der Ostslowakei liegen weitere herausragende Buchenurwaldreservate: der [Urwaldkomplex
      Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) im Nationalpark Poloniny, 11 km
      entfernt, ist der nächste; es folgen das [Strenge Naturreservat
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), das [Strenge Naturreservat
      Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) und das [Strenge Naturreservat
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). Jenseits der Grenze liegt der
      [Bieszczady-Nationalpark](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/). Weiter westlich teilen
      die [Karsttäler Prosiecka und Kvačianska dolina](/lugar/npr-kvacianska-a-prosiecka-dolina/) mit Vihorlat
      Karpatenmolch, Luchs und Braunbär.
  it:
    intro: >-
      Un lago è nato dal crollo di un versante montuoso. Quando l'attività vulcanica del Vihorlat andava
      esaurendosi, una frana imponente discesa dai pendii del Motrogon e di Jedlinka sbarrò la valle del
      torrente Okna, trattenendo le acque limpide in una conca naturale. Oggi il lago si chiama Morské oko,
      l'«occhio di mare», ed è cinto da faggete che rientrano nelle foreste primordiali dichiarate Patrimonio
      Mondiale UNESCO. È un lembo appartato della Slovacchia orientale dove si cammina tra vulcano spento,
      acque cristalline e alberi monumentali.
    landscape: >-
      Il Vihorlat è una catena vulcanica compatta che si staglia sulla pianura della Slovacchia orientale, con
      creste che superano i mille metri di quota. La sua posizione di transizione tra flora pannonica e
      carpazica determina la ricchezza degli ambienti: il lago Morské oko, i torrioni rocciosi dello Sninský
      kameň, torbiere montane e un connubio di specie boreali e termofile. Sui versanti settentrionali
      vegetano entità d'alta quota come la soldanella dei Carpati, mentre sulle pendici meridionali si
      sviluppa una foresta steppica calda.


      Il lago è il maggiore bacino dei monti Vihorlat e il terzo lago naturale della Slovacchia per
      estensione, preceduto solo da due laghi glaciali degli Alti Tatra. È lungo 750 m e tocca 25,1 m di
      profondità. Il profilo odierno risale alla fine del XIX secolo, quando venne eretto un argine
      artificiale in muratura. Poiché il termine «morské oko» designa solitamente laghi di circo glaciale, gli
      studiosi tentarono invano di attribuirgli denominazioni differenti.


      Tutt'intorno domina il faggio. Il Vihorlat è uno dei comprensori più boscati della nazione, con foreste
      decidue dominate da faggete pure o miste con rovere, frassino, acero di monte e abete bianco. A nord del
      lago, il nucleo UNESCO abbraccia un continuum di faggete primordiali che segue la cresta primaria sino
      al massiccio del Nežabec. Sui versanti nord del pizzo Vihorlat sopravvive una fascia vergine tra 800 e
      1000 m. La storia vegetazionale documenta che il faggio superò l'era glaciale in rifugi nell'Europa
      meridionale, espandendo la propria egemonia negli ultimi 4000 anni.
    wildlife: >-
      In primavera i boschi di carpino bianco del settore sud-occidentale si ammantano di bucaneve dei
      Carpati: è la stazione più vasta e rigogliosa della specie in territorio slovacco. A seguire sbocciano
      altre essenze protette. Nelle torbiere allignano drosera a foglie rotonde, licopodio inondato ed
      erioforo vaginato, mentre una festuca endemica, *Festuca ovina vihorlatica*, alligna unicamente sui
      balzi rocciosi dello Sninský kameň. Sono censite circa 400 specie di funghi, 60 di licheni, 110 di
      muschi e 600 di piante vascolari superiori.


      Tra i vertebrati nidificano circa 100 specie di uccelli: nei boschi maturi si riproducono la [cicogna
      nera](/especie/ciconia_nigra/) e l'[allocco degli Urali](/especie/strix_uralensis/). Tra i rapaci diurni
      primeggia la [poiana comune](/especie/buteo_buteo/), affiancata dal [falco
      pecchiaiolo](/especie/pernis_apivorus/) e dall'[aquila anatraia minore](/especie/aquila_pomarina/). Le
      fitte selve danno ricetto a [lupo](/especie/canis_lupus/), [gatto
      selvatico](/especie/felis_silvestris/), [lince europea](/especie/lynx_lynx/),
      [martora](/especie/martes_martes/) e [orso bruno](/especie/ursus_arctos/).


      La fauna invertebrata annovera oltre 2000 specie, tra cui il coleottero saproxilico [rosalia
      alpina](/especie/rosalia_alpina/). Gli anfibi contano rana temporaria, [salamandra
      pezzata](/especie/salamandra_salamandra/) e tutti e quattro i tritoni indigeni della Slovacchia. Il
      colubro d'Esculapio è comune, mentre il marasso è sporadico. Il periodo migliore per percorrere i
      sentieri cade tra maggio e ottobre.
    visit: >-
      Il lago si raggiunge da Remetské Hámre tramite un sentiero didattico segnato in blu. L'area sosta di
      Krivec dista circa 15 minuti a piedi sotto il livello del lago. Sulle rive funziona un punto informativo
      della riserva di Vihorlatský prales.


      Il percorso circolare di Morské oko misura 4 km, è agevole e illustra la geologia, l'avifauna e le
      foreste carpatiche. Sfiora faggete ad assetto primordiale con partenze dal parcheggio, da Remetské Hámre
      o da Sninské rybníky. Dalle rive si sale allo Sninský kameň sul sentiero blu in un'ora e 35 minuti di
      cammino, mentre il Malé Morské oko, laghetto satellite intatto, si raggiunge in 30 minuti seguendo la
      traccia gialla.


      Per addentrarsi nel bosco, il sentiero verde Vihorlatskými bučinami congiunge Poruba pod Vihorlatom alla
      sella di Tri Table. Dal 2019 è inoltre attivo l'itinerario segnato Podhoroď – Beňatina – Starý Koňuš –
      Koňuš verso le praterie fiorite di Starý Koňuš, rinomate per le orchidee e il giaggiolo gramineo (*Iris
      graminea*).
    history: >-
      Sulle sponde del lago vennero eretti due capanni da caccia storici, primi manufatti turistici della
      Slovacchia al di fuori degli Alti Tatra. Quattro riserve forestali slovacche sono entrate nel Patrimonio
      Mondiale UNESCO nel 2007: tre nel Parco Nazionale Poloniny e una nel Vihorlat. L'area protetta del
      Vihorlat venne istituita il 28 dicembre 1973.


      Le piste forestali e i tagli a raso ai margini dell'area generano rischi di erosione per il lago, poiché
      il limo impoverisce le acque di ossigeno disciolto. Un'altra minaccia discreta incombe sui prati magri
      di Starý Koňuš, che necessitano di sfalci periodici o pascolo estensivo per non venire sopraffatti dalla
      macchia.
    before: >-
      Nel lago e nei suoi corsi d'acqua sono severamente vietati il bagno, la navigazione e la pesca. La
      riserva è soggetta al massimo grado di tutela slovacco, il quinto livello. Ampie sezioni del sito UNESCO
      ricadono nel comprensorio militare di Valaškovce e non sono accessibili; i settori aperti sono
      segnalati.
    around: >-
      Nello stesso quadrante della Slovacchia sorgono altre prestigiose riserve di faggeta vergine: il
      [complesso di foreste vergini di Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/)
      nel Parco Nazionale Poloniny dista 11 km ed è il più vicino; seguono la [Riserva Naturale Integrale di
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), la [Riserva Naturale Integrale di
      Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) e la [Riserva Naturale Integrale di
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). Oltre frontiera si estende il [Parco Nazionale di
      Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/). Più a ovest, le [Valli Carsiche di
      Prosiecka e Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) condividono con Vihorlat il tritone
      dei Carpati, la lince e l'orso bruno.
  pt:
    intro: >-
      Uma lagoa nasceu do desmoronamento de uma encosta. Quando a atividade vulcânica do Vihorlat se
      extinguia, um deslizamento de terras descido de Motrogon e Jedlinka barrou o vale da ribeira Okna,
      retendo as águas cristalinas numa bacia natural. Hoje o lago chama-se Morské oko, o «olho de mar», e
      está envolvido por faiais vetustos classificados como Património Mundial da UNESCO. É um recanto
      resguardado do leste eslovaco onde se caminha entre relevo vulcânico, água límpida e árvores
      centenárias.
    landscape: >-
      O Vihorlat é um maciço vulcânico compacto alcandorado sobre a planície da Eslováquia Oriental, com
      cristas alcantiladas que superam os mil metros de altitude. A sua posição de charneira entre a flora
      panónica e cárpata explica o valor dos seus habitats: a lagoa Morské oko, os penedos do Sninský kameň,
      turfeiras de altitude e uma simbiose de flora boreal e meridional. Nas vertentes norte vicejam espécies
      orófilas como a soldanela-dos-cárpatos, enquanto nas encostas a sul medra um bosque estépico adaptado a
      clima quente.


      A lagoa é o maior corpo aquático dos montes Vihorlat e o terceiro maior lago natural da Eslováquia, após
      as duas grandes lagoas glaciares dos Altos Tatras. Estende-se por 750 m de comprimento e atinge 25,1 m
      de profundidade. O seu contorno atual consolidou-se em finais do século XIX, com a construção de um muro
      de represa artificial em alvenaria. Como a designação «morské oko» costuma aplicar-se a lagos glaciares,
      os investigadores tentaram em vão atribuir-lhe outros nomes.


      Em redor reina a faia. O Vihorlat constitui uma das cordilheiras mais arborizadas do país, dominada por
      faiais puros ou consociados com carvalho, freixo, bordo e abeto-falso. A norte da lagoa, o núcleo
      classificado pela UNESCO forma um contínuo de floresta primária que acompanha a crista principal até ao
      maciço de Nežabec. Nas encostas norte do pico Vihorlat sobreviveu um faial de feição virgem entre os 800
      e os 1000 m. A história paleobotânica documenta que a faia resistiu à última glaciação em refúgios da
      Europa meridional, expandindo o seu domínio europeu nos últimos 4000 anos.
    wildlife: >-
      Na primavera, os carvalhais e soutos do sopé sudoeste atapetam-se de campainhas-brancas-dos-cárpatos: é
      a maior e mais rica colónia desta planta na Eslováquia. Seguem-se outras preciosidades botânicas. Nas
      turfeiras subsistem a orvalhinha-de-folhas-redondas, o licopódio-dos-pauis e o algodão-dos-pauis, ao
      passo que uma gramínea endémica, *Festuca ovina vihorlatica*, ocorre apenas nos rochedos do Sninský
      kameň. No conjunto contam-se cerca de 400 espécies de fungos, 60 de líquenes, 110 de musgos e 600 de
      plantas superiores.


      Nos vertebrados nidificam cerca de 100 espécies de aves: nos faiais procriam a
      [cegonha-preta](/especie/ciconia_nigra/) e a [coruja-dos-urales](/especie/strix_uralensis/). Entre as
      rapinas diurnas a mais frequente é a [bútio-comum](/especie/buteo_buteo/), convivendo com o
      [bútio-vespeiro](/especie/pernis_apivorus/) e a [águia-pomerana](/especie/aquila_pomarina/). As matas
      densas são refúgio do [lobo](/especie/canis_lupus/), do [gato-bravo](/especie/felis_silvestris/), do
      [lince-euroasiático](/especie/lynx_lynx/), da [marta](/especie/martes_martes/) e do
      [urso-pardo](/especie/ursus_arctos/).


      A comunidade de invertebrados reúne mais de 2000 espécies, incluindo o escaravelho saproxílico
      [rosália-alpina](/especie/rosalia_alpina/). Os anfíbios englobam rã-bermeja,
      [salamandra-de-pintas-amarelas](/especie/salamandra_salamandra/) e os quatro tritões nativos da
      Eslováquia. A cobra-de-esculápio é habitual, enquanto a víbora-comum surge raramente. O intervalo ideal
      para trilhos decorre de maio a outubro.
    visit: >-
      A lagoa atinge-se a partir de Remetské Hámre através de um percurso didático sinalizado a azul. O parque
      de estacionamento de Krivec dista cerca de 15 minutos a pé abaixo da represa. Junto à margem existe um
      pavilhão informativo da reserva de Vihorlatský prales.


      O circuito didático de Morské oko tem 4 km de extensão, com desníveis acessíveis, focando a geologia, as
      aves e as florestas da serra. Cruza faiais de estrutura primária com acessos desde o parque junto à
      lagoa, de Remetské Hámre ou de Sninské rybníky. A partir da orla da água, o miradouro de Sninský kameň
      alcança-se pela rota azul em uma hora e 35 minutos de caminhada, e a lagoa Malé Morské oko fica a cerca
      de 30 minutos seguindo as marcas amarelas.


      Para percorrer o bosque contínuo, o trilho de marcação verde Vihorlatskými bučinami une Poruba pod
      Vihorlatom ao colo de Tri Table. Desde 2019 existe um percurso balizado, Podhoroď – Beňatina – Starý
      Koňuš – Koňuš, que conduz aos prados tradicionais de Starý Koňuš, afamados pelas orquídeas bravas e pelo
      lírio *Iris graminea*.
    history: >-
      Junto à lagoa ergueram-se dois pavilhões de caça históricos, os primeiros alojamentos turísticos da
      Eslováquia fora dos Altos Tatras. Quatro áreas florestais eslovacas foram inscritas em 2007 na lista do
      Património Mundial: três no Parque Nacional Poloniny e uma no Vihorlat. A Área de Paisagem Protegida de
      Vihorlat foi instituída em 28 de dezembro de 1973.


      As estradas florestais e os cortes rasos periféricos geram perigo de erosão na bacia da lagoa, dado que
      as lamas arrastadas privam as águas de oxigénio. Outra preocupação ecológica prende-se com as clareiras
      de Starý Koňuš, que requerem ceifa e pastoreio tradicional para impedir a proliferação de matagal
      invasor.
    before: >-
      Na lagoa e linhas de água é expressamente proibido nadar, navegar e pescar. A reserva rege-se pelo nível
      de proteção máximo, o quinto grau. Uma fatia substancial da área UNESCO situa-se na zona militar de
      Valaškovce, vedada ao público; os setores acessíveis estão demarcados.
    around: >-
      Neste mesmo setor da Eslováquia subsistem outros núcleos nobres de floresta primária: o [Complexo de
      Bosques Virgens de Bukovské Vrchy](/lugar/bukovske-vrchy-pralesovy-komplex-np-poloniny/) no Parque
      Nacional Poloniny, a 11 km, é o mais contíguo; sucedem-se a [Reserva Natural Estrita
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), a [Reserva Natural Estrita
      Rožok](/lugar/narodna-prirodna-rezervacia-rozok/) e a [Reserva Natural Estrita
      Stužica](/lugar/narodna-prirodna-rezervacia-stuzica/). Do outro lado da fronteira ergue-se o [Parque
      Nacional de Bieszczady](/lugar/bieszczadzki-park-narodowy---kompleks-lesny/). Mais a ocidente, os [Vales
      Cársticos de Prosiecka e Kvačianska](/lugar/npr-kvacianska-a-prosiecka-dolina/) partilham com o Vihorlat
      o tritão-dos-cárpatos, o lince e o urso-pardo.
