resumen:
  es: >-
    Vasta cadena montañosa alpina con más de 70 circos y lagos glaciares célebre por la raza de perro pastor
    Šarplaninac.
  en: >-
    Vast alpine mountain range with more than 70 cirques and glacial lakes, renowned for the Šarplaninac
    shepherd dog breed.
  fr: >-
    Vaste chaîne alpine comptant plus de 70 cirques et lacs glaciaires, réputée pour la race du chien de
    berger Šarplaninac.
  de: >-
    Ausgedehnte alpine Gebirgskette mit über 70 Karen und Gletscherseen, berühmt für die Hirtenhunderasse
    Šarplaninac.
  it: >-
    Vasta catena montuosa alpina con oltre 70 circhi e laghi glaciali, celebre per la razza di cane da pastore
    Šarplaninac.
  pt: >-
    Vasta cordilheira alpina com mais de 70 circos e lagos glaciares, célebre pela raça de cão pastor
    Šarplaninac.
unico:
  es: >-
    Una cordillera donde el pino de Macedonia y otros árboles endémicos crecen entre lagos glaciares, y donde
    nació el perro pastor de Šar.
  en: >-
    A mountain range where Macedonian pine and other endemic trees flourish among glacial lakes, and the
    cradle of the Šar shepherd dog.
  fr: >-
    Une chaîne de montagnes où le pin de Macédoine et d'autres arbres endémiques côtoient des lacs glaciaires,
    berceau du chien de berger du Šar.
  de: >-
    Ein Gebirgszug, in dem die Mazedonische Kiefer und andere endemische Bäume an Gletscherseen wachsen und
    Wiege des Šar-Schäferhundes.
  it: >-
    Una catena montuosa in cui il pino di Macedonia e altri alberi endemici crescono tra laghi glaciali, culla
    del cane da pastore dello Šar.
  pt: >-
    Uma cordilheira onde o pinheiro-da-macedónia e outras árvores endémicas crescem entre lagos glaciares, e
    berço do cão pastor de Šar.
observaciones:
  es: >-
    Quédate en los senderos señalizados y respeta las zonas de protección estricta, donde no se permite
    intervenir. El sitio oficial publica el mapa y las normas de visita; consúltalos antes de elegir ruta.
texto:
  es:
    intro: >-
      Setenta lagos glaciares salpican la cordillera de Šar, y treinta de sus cumbres pasan de los 2500
      metros. La parte macedonia, la que protege este parque, ocupa 840,2 km² y culmina en Titov Vrv, a 2748
      metros. Es una montaña de bosques de haya y roble en las laderas, pastos de altura, cursos de agua y un
      relieve variado que la hace especialmente rica en vida. Aquí viven el oso pardo, el lobo y el lince
      balcánico. El macizo se extiende unos setenta y cinco kilómetros en dirección noreste-sur-suroeste.
    landscape: >-
      El macizo se formó en el Terciario y su roca dominante es metamórfica, paleozoica y poco resistente, lo
      que marca su relieve. Las calizas, los mármoles y otras rocas carbonatadas ocupan alrededor del 11 % de
      la cordillera y están karstificadas. En el valle del Pena se han registrado las bocas de diez cuevas y
      varias simas, sobre todo en las calizas.


      El agua es el otro gran protagonista. La zona tiene más de cien manantiales y veinte cuencas fluviales,
      entre ellas Dufska, Vrutnicka, Jelovjanska, Kamenjska, Uliverichka y Pena, que desembocan en el Vardar.
      Los lagos glaciares más grandes son Bozovacko, Belo Ezero, Bogovinsko, Karanikolichko, Krivoshisko y
      Crno Ezero. La temperatura media anual en Popova Šapka, a 1780 metros, es de 4,8 grados; llueven unos
      700 mm al año en el parque, hasta 1250 en las montañas.


      Los bosques son sobre todo de hoja caduca. Cerca del 75 % son monoespecíficos, de haya o roble, y forman
      dos cinturones a distintas altitudes. También hay abeto, castaño, picea, arce de montaña, carpe y, entre
      los endemismos, el [pino de Macedonia](/especie/pinus_peuce/), el [pino
      bosnio](/especie/pinus_heldreichii/) y el arce de Heldreich. En la zona estricta de Mazdracha queda un
      bosque mixto de más de seis especies de árboles, raro y digno de protección.
    wildlife: >-
      El plan del parque anota cincuenta y un mamíferos, entre ellos el [oso pardo](/especie/ursus_arctos/),
      el [lince](/especie/lynx_lynx/) balcánico, el [gato montés](/especie/felis_silvestris/), la
      [nutria](/especie/lutra_lutra/), el [rebeco](/especie/rupicapra_rupicapra/), el
      [corzo](/especie/capreolus_capreolus/), el [jabalí](/especie/sus_scrofa/) y el
      [lobo](/especie/canis_lupus/). Con las aves ocurre algo parecido: hay 128 especies, y entre las rapaces
      figuran el [águila real](/especie/aquila_chrysaetos/), un buitre de cabeza blanca y el alimoche. En las
      aguas dulces se han confirmado cinco especies de peces, once de anfibios y diecisiete de reptiles.


      La fauna grande es escasa: las densidades son bajas y el plan lo atribuye a la caza ilegal.


      En invierno el protagonismo pasa a la nieve: el esquí de travesía y las raquetas se practican en un área
      amplia con poco impacto. En la cordillera se conocen 1260 especies de plantas vasculares, más de 260 de
      musgos, 500 de hongos y 160 de líquenes.
    visit: >-
      El parque tiene una red oficial de 24 senderos señalizados, con 303 km en total. El sitio oficial
      publica mapas y las reglas para visitantes. El plan pide a los excursionistas que se queden en los
      caminos señalizados para no molestar a la fauna ni a los procesos naturales; los paseos de verano a pie,
      en bici de montaña o a caballo deben seguir senderos y pistas marcadas.


      Popova Šapka es la estación de esquí del parque, con cuatro remontes pequeños o medianos. Además hay
      refugios de montaña, albergues y casas familiares repartidos por el parque, y los 27 pueblos del parque
      ofrecen potencial para el turismo rural. El plan abre además la puerta al seguimiento de fauna con
      participación pública como experiencia para visitantes.
    history: >-
      La zonificación del parque tiene cuatro zonas. La de protección estricta se divide en cinco unidades,
      Ljuboten, Bistrica, Kobilica, Leshnica y Mazdracha, y en ella se reduce al mínimo la influencia humana y
      no se permite ninguna intervención. La de gestión activa incluye las áreas de pastoreo tradicional y los
      ecosistemas forestales más importantes.


      El plan señala sus amenazas: la caza ilegal, la presión del pastoreo y de la recolección intensa de
      arándanos sobre los insectos en la zona subalpina de Popova Šapka, y las infraestructuras como los
      remontes, las líneas eléctricas y los edificios.
    before: >-
      Quédate en los senderos señalizados y respeta las zonas de protección estricta, donde no se permite
      intervenir. El sitio oficial publica el mapa y las normas de visita; consúltalos antes de elegir ruta.
    around: >-
      El [Parque Nacional de Mavrovo](/lugar/nacionalen-park-mavrovo/) queda a veintisiete kilómetros, y a
      treinta los [Cañones del Río Matka y Treska](/lugar/kanjon-matka---kanjon-treska/).
  en:
    intro: >-
      Seventy glacial lakes dot the Šar Mountains, and thirty of their peaks rise above 2500 metres. The
      Macedonian section protected by this park covers 840.2 km² and culminates at Titov Vrv, reaching 2748
      metres. Slopes clad in beech and oak forests, high-altitude pastures, swift streams and varied relief
      make this mountain range remarkably rich in wildlife. Here roam brown bears, wolves and the Balkan lynx.
      The massif stretches for around seventy-five kilometres in a northeast to south-southwest orientation.
    landscape: >-
      Formed during the Tertiary period, the massif is primarily composed of Paleozoic metamorphic rock of
      modest resistance, which strongly shapes its topography. Limestones, marbles and other carbonate rocks
      account for around 11 % of the mountain range and display extensive karst features. In the Pena river
      valley, explorers have catalogued the entrances of ten caves alongside several deep chasms, chiefly
      within carbonate strata.


      Water is the other defining feature. The territory boasts over one hundred springs and twenty river
      basins, including Dufska, Vrutnicka, Jelovjanska, Kamenjska, Uliverichka and Pena, all draining into the
      Vardar. The most notable glacial lakes are Bozovacko, Belo Ezero, Bogovinsko, Karanikolichko,
      Krivoshisko and Crno Ezero. The average annual temperature at Popova Šapka, at 1780 metres altitude,
      stands at 4.8 degrees Celsius; annual precipitation totals around 700 mm in the lower park, rising to
      1250 mm in higher peaks.


      Forests consist predominantly of deciduous species. Roughly 75 % are monospecific stands of beech or oak
      forming two distinct altitudinal belts. Other species include fir, chestnut, spruce, sycamore maple,
      hornbeam and rare regional endemics such as [Macedonian pine](/especie/pinus_peuce/), [Bosnian
      pine](/especie/pinus_heldreichii/) and Heldreich's maple. In the strict conservation zone of Mazdracha
      lies an exceptional mixed forest with more than six tree species, of high ecological value.
    wildlife: >-
      The park's master plan documents fifty-one mammal species, including the [brown
      bear](/especie/ursus_arctos/), the Balkan [lynx](/especie/lynx_lynx/),
      [wildcat](/especie/felis_silvestris/), [otter](/especie/lutra_lutra/),
      [chamois](/especie/rupicapra_rupicapra/), [roe deer](/especie/capreolus_capreolus/), [wild
      boar](/especie/sus_scrofa/) and [wolf](/especie/canis_lupus/). Avian diversity is equally impressive:
      128 bird species have been recorded, with raptors including the [golden
      eagle](/especie/aquila_chrysaetos/), griffon vulture and Egyptian vulture. Freshwater streams support
      five confirmed fish species, eleven amphibian species and seventeen reptile species.


      Large carnivores and ungulates remain sparse: population densities are low, a fact attributed by park
      planners to historical poaching pressure.


      In winter, the landscape shifts to snow-covered terrain: ski touring and snowshoeing are enjoyed across
      expansive slopes with minimal disturbance. The range supports 1260 species of vascular plants, over 260
      mosses, 500 fungi and 160 lichen taxa.
    visit: >-
      The park features an official network of 24 marked hiking trails covering 303 km in total. The park's
      official portal provides downloadable maps and visitor regulations. The management plan asks hikers to
      remain strictly on waymarked routes to avoid disturbing wildlife and natural processes; summer walks,
      mountain biking and horseback riding must stick to designated trails.


      Popova Šapka serves as the primary ski centre of the massif, featuring four small and medium ski lifts.
      In addition, mountain huts, hostels and family guest houses are scattered across local valleys, and 27
      villages within the park offer genuine potential for rural tourism. The management framework also
      facilitates citizen science wildlife monitoring as an enriching experience for visitors.
    history: >-
      Park zoning consists of four functional zones. The strict protection zone is divided into five
      sectors—Ljuboten, Bistrica, Kobilica, Leshnica and Mazdracha—where human intervention is entirely barred
      and natural processes unfold undisturbed. The active management zone encompasses traditional pastoral
      grazing grounds and vital forest ecosystems.


      The plan identifies ongoing threats: illegal hunting, grazing pressure and heavy commercial bilberry
      harvesting affecting insect populations in the subalpine zone around Popova Šapka, alongside
      infrastructure pressures from ski lifts, overhead powerlines and construction.
    before: >-
      Stick strictly to marked trails and respect the strict protection zones, where all interventions and
      route deviations are prohibited. Consult the official park website for current trail conditions and
      visitor guidelines before setting out.
    around: >-
      The [Mavrovo National Park](/lugar/nacionalen-park-mavrovo/) lies twenty-seven kilometres away, and
      thirty kilometres away are the [Matka and Treska River Canyons](/lugar/kanjon-matka---kanjon-treska/).
  fr:
    intro: >-
      Soixante-dix lacs glaciaires parsèment la chaîne du Šar, et trente de ses cimes culminent au-delà de
      2500 mètres. La partie macédonienne que préserve ce parc s'étend sur 840,2 km² jusqu'au mont Titov Vrv,
      à 2748 mètres d'altitude. Ses versants abritent des hêtraies et chênaies majestueuses, des alpages
      d'altitude, des cours d'eau vifs et un relief varié d'une rare richesse biologique. Ici cohabitent
      l'ours brun, le loup et le lynx des Balkans. Le massif s'étire sur quelque soixante-quinze kilomètres
      selon un axe nord-est–sud-sud-ouest.
    landscape: >-
      Formé durant l'ère tertiaire, le massif repose essentiellement sur un socle métamorphique paléozoïque
      peu résistant, qui a façonné son relief adouci. Les calcaires, marbres et roches carbonatées
      représentent environ 11 % du territoire et présentent une karstification développée. Dans la vallée de
      la Pena, les spéléologues ont recensé dix entrées de grottes et plusieurs gouffres béants, creusés dans
      ces strates calcaires.


      L'eau joue un rôle déterminant dans le paysage. Le parc compte plus d'une centaine de sources et vingt
      bassins hydrographiques, parmi lesquels la Dufska, la Vrutnicka, la Jelovjanska, la Kamenjska,
      l'Uliverichka et la Pena, tous tributaires du Vardar. Les plus grands lacs glaciaires sont Bozovacko,
      Belo Ezero, Bogovinsko, Karanikolichko, Krivoshisko et Crno Ezero. La température moyenne annuelle à
      Popova Šapka, à 1780 mètres, est de 4,8 degrés Celsius ; les précipitations atteignent environ 700 mm
      par an en bas et jusqu'à 1250 mm sur les crêtes.


      Les forêts sont très majoritairement caducifoliées. Près de 75 % d'entre elles sont monospécifiques,
      formées de hêtres ou de chênes étagés selon l'altitude. On y rencontre aussi le sapin, le châtaignier,
      l'épicéa, l'érable sycomore, le charme et de précieux endémismes tels que le [pin de
      Macédoine](/especie/pinus_peuce/), le [pin de Bosnie](/especie/pinus_heldreichii/) et l'érable de
      Heldreich. Dans la réserve intégrale de Mazdracha subsiste une forêt mixte remarquable comptant plus de
      six essences arborées.
    wildlife: >-
      Le plan de gestion recense cinquante-et-un mammifères, parmi lesquels l'[ours
      brun](/especie/ursus_arctos/), le [lynx](/especie/lynx_lynx/) des Balkans, le [chat
      sauvage](/especie/felis_silvestris/), la [loutre](/especie/lutra_lutra/), le
      [chamois](/especie/rupicapra_rupicapra/), le [chevreuil](/especie/capreolus_capreolus/), le
      [sanglier](/especie/sus_scrofa/) et le [loup](/especie/canis_lupus/). L'avifaune se révèle tout aussi
      remarquable : on dénombre 128 espèces d'oiseaux, dont de grands rapaces tels que l'[aigle
      royal](/especie/aquila_chrysaetos/), le vautour fauve et le percnoptère. Dans les cours d'eau ont été
      confirmées cinq espèces de poissons, onze espèces d'amphibiens et dix-sept de reptiles.


      Les populations de grands mammifères demeurent clairsemées : leurs faibles densités sont attribuées par
      les gestionnaires au braconnage passé.


      En hiver, le manteau neigeux transforme les lieux : le ski de randonnée et les raquettes s'y pratiquent
      sur de grands espaces avec un impact écologique minime. Le massif abrite 1260 espèces de plantes
      vasculaires, plus de 260 de mousses, 500 de champignons et 160 de lichens.
    visit: >-
      Le parc dispose d'un réseau officiel de 24 sentiers balisés totalisant 303 km de randonnée. Le portail
      officiel met à disposition les cartes topographiques et les règles de visite. Le plan de gestion demande
      aux randonneurs de rester impérativement sur les sentiers balisés afin de ne pas déranger la faune ni
      compromettre la régénération naturelle ; les sorties estivales à pied, à VTT ou à cheval doivent
      emprunter les pistes officielles.


      Popova Šapka constitue le centre de sports d'hiver du massif, équipé de quatre remontées mécaniques de
      taille modeste. Des refuges d'altitude, auberges et gîtes ruraux sont répartis dans les vallées, et les
      27 villages intégrés au parc offrent un réel potentiel écotouristique. Le plan encourage également la
      participation des visiteurs à des programmes de suivi naturaliste de la faune.
    history: >-
      Le zonage du parc distingue quatre zones fonctionnelles. La zone de protection stricte est divisée en
      cinq unités (Ljuboten, Bistrica, Kobilica, Leshnica et Mazdracha), où l'intervention humaine est
      strictement proscrite. La zone de gestion active préserve les pâturages d'alpage traditionnels et les
      massifs forestiers les plus précieux.


      Le plan met en lumière plusieurs menaces : la chasse illégale, le surpâturage, la cueillette excessive
      des myrtilles fragilisant les insectes subalpins autour de Popova Šapka, ainsi que l'impact paysager des
      remontées mécaniques, lignes électriques et constructions.
    before: >-
      Restez obligatoirement sur les sentiers balisés et respectez les zones de protection intégrale, où toute
      intervention est interdite. Consultez le site internet officiel du parc pour vérifier la météo et la
      praticabilité des itinéraires avant de vous engager.
    around: >-
      Le [parc national de Mavrovo](/lugar/nacionalen-park-mavrovo/) se trouve à vingt-sept kilomètres, et à
      trente kilomètres s'étirent les [gorges de la Matka et de la
      Treska](/lugar/kanjon-matka---kanjon-treska/).
  de:
    intro: >-
      Siebzig Gletscherseen prägen die Bergwelt der Šar Planina, und dreißig ihrer Gipfel überragen die Marke
      von 2500 Metern. Der nordmazedonische Parkabschnitt umfasst 840,2 km² und gipfelt im Titov Vrv auf 2748
      Metern Höhe. Buchen- und Eichenwälder an den Berghängen, alpine Hochweiden, wilde Bergbäche und ein
      abwechslungsreiches Relief verleihen dem Massiv eine außergewöhnliche Artenvielfalt. Hier streifen
      Braunbären, Wölfe und der seltene Balkanluchs durch die Täler. Das Bergmassiv erstreckt sich über rund
      fünfundsiebzig Kilometer von Nordost nach Süd-Südwest.
    landscape: >-
      Das Massiv entstand im Tertiär; sein Gestein besteht vorwiegend aus paläozoischem, wenig
      widerstandsfähigem Metamorphgestein, was die Geländeformen prägt. Kalke, Marmore und andere
      Karbonatgesteine machen rund 11 % des Gebirges aus und sind stark verkarstet. Im Pena-Tal wurden die
      Eingänge von zehn Höhlen sowie mehrere tiefe Schächte in den Kalkschichten nachgewiesen.


      Das Wasser ist das andere bestimmende Landschaftselement. Das Gebiet birgt über einhundert Quellen und
      zwanzig Flusseinzugsgebiete, darunter Dufska, Vrutnicka, Jelovjanska, Kamenjska, Uliverichka und Pena,
      die in den Vardar münden. Die größten Gletscherseen heißen Bozovacko, Belo Ezero, Bogovinsko,
      Karanikolichko, Krivoshisko und Crno Ezero. Die Jahresdurchschnittstemperatur auf der Popova Šapka auf
      1780 Metern Höhe liegt bei 4,8 Grad; die Niederschläge belaufen sich im Park auf rund 700 mm pro Jahr
      und erreichen bis zu 1250 mm in den Hochlagen.


      Die Wälder bestehen überwiegend aus Laubbäumen. Nahezu 75 % sind reine Buchen- oder Eichenbestände, die
      zwei Höhenstufen bilden. Zudem kommen Tanne, Edelkastanie, Fichte, Berg-Ahorn, Hainbuche sowie regionale
      Endemiten wie die [Mazedonische Kiefer](/especie/pinus_peuce/), die
      [Schlangenhaut-Kiefer](/especie/pinus_heldreichii/) und der Heldreich-Ahorn vor. Im streng geschützten
      Sektor Mazdracha hat sich ein seltener Mischwald aus über sechs Baumarten erhalten.
    wildlife: >-
      Der Managementplan des Parks verzeichnet einundfünfzig Säugetierarten, darunter den
      [Braunbären](/especie/ursus_arctos/), den Balkan-[Luchs](/especie/lynx_lynx/), die
      [Wildkatze](/especie/felis_silvestris/), den [Fischotter](/especie/lutra_lutra/), die
      [Gämse](/especie/rupicapra_rupicapra/), das [Reh](/especie/capreolus_capreolus/), das
      [Wildschwein](/especie/sus_scrofa/) und den [Wolf](/especie/canis_lupus/). Ähnlich reich ist die
      Vogelwelt mit 128 Arten; unter den Greifvögeln brüten [Steinadler](/especie/aquila_chrysaetos/),
      Gänsegeier und Schmutzgeier. In den Bächen und Seen wurden fünf Fischarten, elf Amphibienarten und
      siebzehn Reptilienarten nachgewiesen.


      Große Wildtiere sind selten: Die Bestandsdichten sind gering, was die Parkverwaltung auf historische
      Wilderei zurückführt.


      Im Winter dominiert der Schnee: Skitouren und Schneeschuhwanderungen sind auf weiten Hängen mit
      minimalen Störungen möglich. Das Gebirge beherbergt 1260 Gefäßpflanzenarten, über 260 Moosarten, 500
      Pilzarten und 160 Flechtenarten.
    visit: >-
      Der Park verfügt über ein offizielles Netz von 24 markierten Wanderwegen mit einer Gesamtlänge von 303
      km. Die Parkverwaltung veröffentlicht Kartenmaterial und verbindliche Besucherregeln. Wanderer werden
      angehalten, ausnahmslos auf den markierten Wegen zu bleiben, um Flora und Fauna nicht zu stören;
      sommerliche Wanderungen, Mountainbiketouren und Ausritte müssen den ausgeschilderten Routen folgen.


      Popova Šapka dient als Wintersportzentrum des Parks mit vier kleinen und mittleren Skiliften.
      Berghütten, Herbergen und private Pensionen verteilen sich über das Gebiet, und die 27 Dörfer im Park
      bieten echtes Potenzial für den ländlichen Tourismus. Das Schutzkonzept eröffnet zudem Möglichkeiten,
      sich als Besucher an Wildtier-Monitoringprogrammen zu beteiligen.
    history: >-
      Die Zonierung des Nationalparks umfasst vier Nutzungszonen. Die Kernzone mit strengem Schutz gliedert
      sich in fünf Einheiten (Ljuboten, Bistrica, Kobilica, Leshnica und Mazdracha), in denen jeglicher
      Eingriff untersagt ist. Die Zone des aktiven Managements sichert traditionelle Weideflächen und
      schützenswerte Waldökosysteme.


      Der Plan benennt konkrete Gefährdungen: illegale Jagd, Beweidungsdruck und übermäßige Heidelbeerernte,
      die Insektenpopulationen im subalpinen Raum um Popova Šapka schwächen, sowie Eingriffe durch Skilifte,
      Hochspannungsleitungen und Bautätigkeiten.
    before: >-
      Bleib unbedingt auf den ausgeschilderten Routen und respektiere die streng geschützten Kernzonen, in
      denen jeder Eingriff untersagt ist. Informiere dich vor jeder Bergtour auf der Website des Parks über
      Wetterlage und Wegverhältnisse.
    around: >-
      Der [Nationalpark Mavrovo](/lugar/nacionalen-park-mavrovo/) liegt siebenundzwanzig Kilometer entfernt,
      und in dreißig Kilometern Entfernung befinden sich die [Schluchten der Flüsse Matka und
      Treska](/lugar/kanjon-matka---kanjon-treska/).
  it:
    intro: >-
      Settanta laghi glaciali punteggiano la catena dei monti Šar, e trenta delle sue vette superano la quota
      di 2500 metri. Il versante macedone tutelato da questo parco ricopre 840,2 km² e culmina nel Titov Vrv,
      a 2748 metri d'altitudine. È una montagna rivestita di fitte faggete e querceti, pascoli sommitali,
      limpidi corsi d'acqua e un rilievo tormentato che favorisce una straordinaria biodiversità. Qui dimorano
      l'orso bruno, il lupo e il lince balcanico. La catena si allunga per circa settantacinque chilometri da
      nord-est a sud-sud-ovest.
    landscape: >-
      Formatosi durante l'era terziaria, il massiccio è composto prevalentemente da rocce metamorfiche
      paleozoiche poco resistenti, che ne hanno modellato i crinali. I calcari, i marmi e le altre rocce
      carbonatiche rappresentano circa l'11 % della catena e presentano estese forme carsiche. Nella valle del
      fiume Pena gli speleologi hanno individuato gli accessi di dieci grotte e numerosi inghiottitoi aperti
      negli strati calcarei.


      L'acqua rappresenta il secondo grande protagonista. L'area racchiude più di cento sorgenti perenni e
      venti bacini idrografici, tra cui Dufska, Vrutnicka, Jelovjanska, Kamenjska, Uliverichka e Pena, tutti
      affluenti del Vardar. Tra i maggiori laghi d'alta quota risaltano Bozovacko, Belo Ezero, Bogovinsko,
      Karanikolichko, Krivoshisko e Crno Ezero. La temperatura media a Popova Šapka, a 1780 metri, è pari a
      4,8 gradi; le precipitazioni medie sono di circa 700 mm l'anno nel parco, salendo a 1250 mm sulle creste
      montuose.


      I boschi sono a netta prevalenza di latifoglie. Circa il 75 % è costituito da popolamenti monospecifici
      di faggio o quercia disposti in due fasce altitudinali. Trovano dimora anche l'abete bianco, il
      castagno, l'abete rosso, l'acero montano, il carpino e rarità endemiche come il [pino di
      Macedonia](/especie/pinus_peuce/), il [pino loricato](/especie/pinus_heldreichii/) e l'acero di
      Heldreich. Nel settore a protezione integrale di Mazdracha sopravvive un raro bosco misto con più di sei
      specie arboree.
    wildlife: >-
      Il piano del parco elenca cinquantuno mammiferi, tra cui l'[orso bruno](/especie/ursus_arctos/), la
      [lince](/especie/lynx_lynx/) balcanica, il [gatto selvatico](/especie/felis_silvestris/), la
      [lontra](/especie/lutra_lutra/), il [camoscio](/especie/rupicapra_rupicapra/), il
      [capriolo](/especie/capreolus_capreolus/), il [cinghiale](/especie/sus_scrofa/) e il
      [lupo](/especie/canis_lupus/). Anche la componente ornitica è assai ricca: sono state censite 128 specie
      di uccelli, con rapaci maestosi quali l'[aquila reale](/especie/aquila_chrysaetos/), il grifone e il
      capovaccaio. Nelle acque dolci sono state confermate cinque specie di pesci, undici specie di anfibi e
      diciassette di rettili.


      I grandi mammiferi presentano densità modeste, attribuite dagli studiosi del parco al bracconaggio del
      passato.


      Nei mesi freddi la neve trasforma l'ambiente: lo scialpinismo e le ciaspole si praticano su pendii
      aperti a basso impatto. La catena conta 1260 specie di piante vascolari, più di 260 muschi, 500 funghi e
      160 licheni.
    visit: >-
      Il parco dispone di una rete ufficiale composta da 24 sentieri segnalati, con 303 km di estensione
      totale. Il sito web ufficiale fornisce le mappe e le norme di comportamento. Il piano di gestione invita
      gli escursionisti a non abbandonare i tracciati segnati per evitare di recare disturbo alla fauna; le
      gite estive a piedi, in mountain bike o a cavallo devono seguire sentieri e piste battute.


      Popova Šapka ospita la principale stazione invernale dell'area, dotata di quattro impianti di risalita.
      Rifugi alpini, ostelli e pensioni familiari si distribuiscono nei fondovalle, mentre i 27 villaggi
      compresi nel territorio offrono un interessante potenziale di turismo rurale. Il piano incentiva anche
      attività di monitoraggio faunistico partecipato per i visitatori.
    history: >-
      L'ordinamento territoriale del parco prevede quattro zone distinte. Quella a protezione integrale è
      ripartita in cinque settori (Ljuboten, Bistrica, Kobilica, Leshnica e Mazdracha), in cui la presenza
      umana è ridotta allo zero assoluto. La zona di gestione attiva tutela i pascoli tradizionali e le
      coperture forestali più rilevanti.


      Il piano individua diverse minacce: il bracconaggio, la pressione del pascolo e la raccolta massiccia di
      mirtilli che danneggia gli insetti nella fascia subalpina di Popova Šapka, oltre alle infrastrutture
      come sciovie, linee elettriche e costruzioni edili.
    before: >-
      Rimani rigorosamente sui percorsi segnalati e rispetta le aree a tutela integrale, dove non è consentita
      alcuna deviazione. Consulta il sito internet ufficiale per conoscere le normative e lo stato dei
      sentieri prima di partire per le escursioni.
    around: >-
      Il [Parco nazionale di Mavrovo](/lugar/nacionalen-park-mavrovo/) dista ventisette chilometri, mentre a
      trenta chilometri si aprono i [Canyon del fiume Matka e Treska](/lugar/kanjon-matka---kanjon-treska/).
  pt:
    intro: >-
      Setenta lagos glaciares pontilham a cordilheira de Šar, e trinta dos seus cumes ultrapassam os 2500
      metros de altitude. A vertente macedónia abrangida por este parque cobre 840,2 km² e culmina no Titov
      Vrv, a 2748 metros. Encostas cobertas de faiais e carvalhais, pastagens de altitude, torrentes
      impetuosas e um relevo recortado proporcionam uma excecional riqueza biológica. Aqui vivem o urso-pardo,
      o lobo e o lince-dos-balcãs. O maciço estende-se por cerca de setenta e cinco quilómetros no alinhamento
      nordeste–sul-sudoeste.
    landscape: >-
      Formado no Terciário, o maciço é composto maioritariamente por rochas metamórficas paleozoicas de baixa
      resistência, o que molda os seus contornos suaves. Os calcários, mármores e outras rochas carbonatadas
      representam cerca de 11 % da cordilheira e apresentam elevado grau de carstificação. No vale do rio Pena
      foram registadas dez entradas de grutas e vários algares abertos nas rochas calcárias.


      A água assume um papel preponderante. A região integra mais de uma centena de nascentes e vinte bacias
      hidrográficas, incluindo a Dufska, Vrutnicka, Jelovjanska, Kamenjska, Uliverichka e Pena, todas
      afluentes do Vardar. Os maiores lagos glaciares são Bozovacko, Belo Ezero, Bogovinsko, Karanikolichko,
      Krivoshisko e Crno Ezero. A temperatura média anual em Popova Šapka, a 1780 metros de altitude, ronda os
      4,8 graus; a precipitação anual aproxima-se dos 700 mm na base do parque, subindo até aos 1250 mm nas
      zonas mais elevadas.


      As florestas são dominadas por espécies caducifólias. Cerca de 75 % constituem povoamentos puros de faia
      ou de carvalho distribuídos em duas faixas altitudinais. Ocorrem também o abeto, o castanheiro, a
      espruce, o bordo, o carpe e espécies endémicas como o [pinheiro-da-macedónia](/especie/pinus_peuce/), o
      [pinheiro-da-bósnia](/especie/pinus_heldreichii/) e o bordo de Heldreich. Na área estrita de Mazdracha
      preserva-se uma floresta mista com mais de seis espécies arbóreas.
    wildlife: >-
      O plano diretor do parque inventaria cinquenta e um mamíferos, entre eles o
      [urso-pardo](/especie/ursus_arctos/), o [lince](/especie/lynx_lynx/)-dos-balcãs, o
      [gato-bravo](/especie/felis_silvestris/), a [lontra](/especie/lutra_lutra/), a
      [camurça](/especie/rupicapra_rupicapra/), o [corço](/especie/capreolus_capreolus/), o
      [javali](/especie/sus_scrofa/) e o [lobo](/especie/canis_lupus/). A avifauna revela idêntica riqueza:
      estão registadas 128 espécies de aves, incluindo rapinas como a
      [águia-real](/especie/aquila_chrysaetos/), o grifo e o abutre-do-egito. Nas águas correntes foram
      confirmadas cinco espécies de peixes, onze espécies de anfíbios e dezassete de répteis.


      A grande fauna mantém densidades populacionais reduzidas, facto imputado pelo plano à caça furtiva de
      períodos anteriores.


      No inverno a neve assume o protagonismo: o esqui de travessia e as raquetes de neve praticam-se em
      amplas encostas com reduzido impacto ambiental. A cordilheira acolhe 1260 espécies de plantas
      vasculares, mais de 260 de musgos, 500 de fungos e 160 de líquenes.
    visit: >-
      O parque oferece uma rede oficial de 24 trilhos assinalados que totalizam 303 km. O portal oficial
      divulga mapas detalhados e os regulamentos para visitantes. O plano apela a que os caminhantes
      permaneçam estritamente nas rotas marcadas para não perturbar a vida selvagem; os passeios de verão a
      pé, em bicicleta de montanha ou a cavalo devem obedecer aos trilhos oficiais.


      Popova Šapka é a principal estância de desportos de inverno do parque, dispondo de quatro teleféricos e
      meios mecânicos de apoio. Existem refúgios de montanha, pousadas e alojamentos familiares ao longo dos
      vales, enquanto as 27 aldeias do parque proporcionam excelentes perspetivas para o turismo rural. O
      plano prevê ainda atividades de monitorização científica participada de fauna para os visitantes.
    history: >-
      O plano de ordenamento prevê quatro zonas distintas. A zona de proteção estrita divide-se em cinco
      setores (Ljuboten, Bistrica, Kobilica, Leshnica e Mazdracha), onde o impacto humano é nulo e não é
      permitida qualquer intervenção. A zona de gestão ativa acolhe os pastos de montanha comunitários e os
      maciços florestais mais emblemáticos.


      O plano alerta para os fatores de ameaça: a caça furtiva, a pressão pecuária e a colheita desmedida de
      mirtilos que perturba os insetos na faixa subalpina de Popova Šapka, além dos impactos provocados por
      teleféricos, redes elétricas e novas construções.
    before: >-
      Permanece estritamente nos trilhos assinalados e respeita as zonas de proteção integral, onde não é
      consentida qualquer intervenção. Consulta antecipadamente a página oficial do parque para verificar as
      regras e o estado dos percursos antes de iniciar a caminhada.
    around: >-
      O [Parque Nacional de Mavrovo](/lugar/nacionalen-park-mavrovo/) dista vinte e sete quilómetros, e a
      trinta quilómetros situam-se os [Desfiladeiros dos Rios Matka e
      Treska](/lugar/kanjon-matka---kanjon-treska/).
