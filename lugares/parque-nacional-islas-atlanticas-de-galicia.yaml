resumen:
  es: >-
    Cuatro archipiélagos graníticos en la boca de las rías Baixas, con acantilados de aves marinas por el
    oeste y dunas por el este.
  en: >-
    Four granitic archipelagos guarding the mouth of the Rías Baixas, with seabird nesting cliffs facing west
    and sheltered sand dunes facing east.
  fr: >-
    Quatre archipels granitiques verrouillant l’entrée des rías Baixas, avec falaises d’oiseaux marins à
    l’ouest et dunes à l’est.
  de: >-
    Vier Granitarchipele vor den Rías Baixas mit steilen Seevogelklippen im Westen und geschützten Dünen im
    Osten.
  it: >-
    Quattro arcipelaghi granitici all’imboccatura delle rías Baixas, con falesie per uccelli marini a
    occidente e dune a oriente.
  pt: >-
    Quatro arquipélagos graníticos na embocadura das rías Baixas, com arribas de aves marinhas a poente e
    dunas a nascente.
unico:
  es: >-
    Un parque donde un bosque de laurel, más de 200 especies de algas y miles de gaviotas viven a un trayecto
    en barco de las rías.
  en: >-
    A maritime park where laurel woodlands, over 200 seaweed species and vast seabird colonies thrive just a
    short boat crossing from the rías.
  fr: >-
    Un parc où une laurisylve littorale, plus de 200 espèces d’algues et des milliers de goélands prospèrent à
    une courte traversée des rías.
  de: >-
    Ein maritimes Schutzgebiet, wo Lorbeerwälder, über 200 Algenarten und riesige Möwenkolonien nur eine kurze
    Schiffsfahrt vor der Küste liegen.
  it: >-
    Un parco marittimo dove un bosco di alloro, oltre 200 specie di alghe e migliaia di gabbiani prosperano a
    breve distanza di navigazione dalle rías.
  pt: >-
    Um parque marítimo onde um loureiral relíquia, mais de 200 espécies de algas e milhares de gaivotas
    habitam a curta distância das rías.
observaciones:
  es: >-
    Visitar las Cíes y Ons exige autorización de la Xunta de Galicia; compruébalo antes de salir. Comprueba
    también qué servicios ofrecen las navieras, sobre todo en épocas de poca afluencia, y los días de mal
    tiempo. Las zonas de acampada autorizadas tienen plazas limitadas. No te acerques demasiado a los
    acantilados ni te bañes cuando el mar no esté en calma.
texto:
  es:
    intro: >-
      Seis meses después de que lo declararan parque nacional, el 1 de julio de 2002, naufragó el petrolero
      Prestige y su marea negra llegó a las costas de todas sus islas salvo Cortegada. Una década más tarde,
      los estudios mostraban que la mayor parte de las consecuencias negativas estaban superadas; la huella
      que persiste es la caída del cormorán moñudo, para el que hay un plan de recuperación. Estas islas, las
      Cíes, Ons, Sálvora y Cortegada, son el único parque nacional de Galicia, y se alcanzan por mar.
    landscape: >-
      Las Cíes forman un archipiélago en la boca de la ría de Vigo y Ons otro en la boca de la ría de
      Pontevedra. Sálvora está en la entrada de la ría de Arosa, y Cortegada, dentro de ella. Entre las rocas
      y el mar aparece un mosaico de hábitats: bajo el agua hay bosques de algas pardas y fondos de maërl,
      además de arrecifes, lagunas y bancos de arena someros; en tierra destacan los sistemas dunares, los
      acantilados y los matorrales de tojo y brezo, con dunas grises y brezales húmedos atlánticos. El estado
      de los ecosistemas marinos es en general bueno, aunque los dañan los vertidos de hidrocarburos del
      tráfico marítimo y la sobreexplotación pesquera.


      La presión humana ha dejado su marca en la tierra. En las islas, sobre todo en Cíes, las plantaciones de
      eucaliptos, pinos y acacias han desplazado a la vegetación autóctona, y erradicarlas es un proceso a muy
      largo plazo. El pisoteo daña la vegetación de playas y dunas, y por eso hay vallados que protegen parte
      de ellas.
    wildlife: >-
      Las aves marinas son las protagonistas. La [gaviota patiamarilla](/especie/larus_michahellis/) y el
      [cormorán moñudo](/especie/phalacrocorax_aristotelis/) son las dos aves marinas más abundantes del
      parque, y crían en Punta Centolo, en Ons; el mirador de esa punta está restringido del 15 de febrero al
      31 de julio, época de nidificación. En Cíes, el observatorio de aves de la ruta del Monte Faro permite
      ver miles de gaviotas anidando en los acantilados y, con suerte, grupos de cormoranes que construyen sus
      nidos cerca del mar. En el islote de Viños, los cormoranes se secan al sol.


      En la ruta del Monte Faro, el Lago de Cíes deja ver, cuando hay visibilidad, peces, crustáceos y algas.
    visit: >-
      Las islas se recorren a pie por rutas señalizadas. En Cíes, la ruta del Monte Faro mide 7 km, ida y
      vuelta, con 175 m de desnivel y unas dos horas y media, y termina en el faro, el mirador más emblemático
      de las islas, con acantilados a los pies. A media subida está la Pedra da Campá, perforada por los
      vientos atlánticos cargados de salitre. La del Faro da Porta mide 5 km, es de dificultad baja y lleva
      hora y media, y la del Alto do Príncipe, de 3 km y una hora, también es baja.


      En Ons, la Ruta Norte es circular, de 8,1 km, dificultad media y unas tres horas. La Ruta Sur, también
      circular, mide 6,5 km y lleva dos horas y media; en ella aparece el mirador de Fedorentos, con la isla
      de Onza y las Cíes al fondo, y el Buraco do Inferno, una formación que el oleaje ha excavado entre
      acantilados y que se comunica con el mar.


      Para entenderlo todo, visita los centros de interpretación de Cambón, en Vigo, y de las islas de Cíes y
      Ons. El de Cíes se construyó sobre las ruinas del antiguo monasterio de San Estevo.
    history: >-
      Los restos más antiguos son del Paleolítico, en Cíes, y de la Edad del Bronce quedan los castros de Cíes
      y Ons. En Ons, el aislamiento invernal, cuando muchos días no había comunicación por mar, generó una
      cultura propia, con un gran saber de plantas medicinales, la Santa Compaña y el uso de retamas para
      quitar el mal de ojo a la embarcación. La dorna es la embarcación tradicional, que se maneja a remo o
      con vela latina. Las Cíes fueron declaradas parque natural en 1980.
    before: >-
      Visitar las Cíes y Ons exige autorización de la Xunta de Galicia; compruébalo antes de salir. Comprueba
      también qué servicios ofrecen las navieras, sobre todo en épocas de poca afluencia, y los días de mal
      tiempo. Las zonas de acampada autorizadas tienen plazas limitadas. No te acerques demasiado a los
      acantilados ni te bañes cuando el mar no esté en calma.
    around: >-
      El [Parque Nacional de Kornati](/lugar/nacionalni-park-kornati/) comparte con las islas la gaviota
      patiamarilla y el cormorán moñudo, y el [Parque Natural del Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) también el cormorán moñudo; son costas con aves marinas,
      aunque lejanas.
  en:
    intro: >-
      Six months after its designation as a national park, on 1 July 2002, the oil tanker Prestige foundered
      and its black tide fouled the shores of every archipelago except Cortegada. A decade later,
      comprehensive ecological monitoring revealed that most negative impacts had been overcome; the lingering
      footprint is a decline in the European shag, currently supported by an active species recovery plan.
      These granite archipelagos—Cíes, Ons, Sálvora and Cortegada—constitute Galicia’s only national park,
      accessible exclusively by sea.
    landscape: >-
      The Cíes form an archipelago across the mouth of the Ría de Vigo, while Ons guards the entrance to the
      Ría de Pontevedra. Sálvora stands at the outer portal of the Ría de Arousa, with Cortegada nestled deep
      within its sheltered waters. Between ocean waves and granite reefs lies a rich mosaic of habitats:
      underwater kelp forests and maërl beds flourish alongside shallow sandbanks and reefs; onshore, coastal
      dune systems, dramatic cliffs, gorse and heather heaths, grey dunes and wet Atlantic heathlands shape
      the terrain. Marine ecosystems are broadly healthy, though vulnerable to oil discharges from shipping
      lanes and historic overfishing.


      Human pressure has altered island vegetation. On Cíes in particular, twentieth-century plantations of
      eucalyptus, maritime pine and acacia displaced native scrub, and ongoing eradication remains a long-term
      undertaking. Foot traffic threatens fragile foredunes, prompting fenced conservation boardwalks.
    wildlife: >-
      Seabirds dominate the islands. The [yellow-legged gull](/especie/larus_michahellis/) and the [European
      shag](/especie/phalacrocorax_aristotelis/) are the two most abundant breeding species, congregating in
      dense colonies at Punta Centolo on Ons; the headland viewpoint is closed to visitors from 15 February to
      31 July during the peak breeding season. On Cíes, the bird observatory along the Monte Faro trail offers
      panoramic views of thousands of nesting gulls, with groups of shags building seaweed nests on ocean
      shelves. On Viños islet, shags spread their wings to dry in the sea breeze.


      Along the Monte Faro route, the sheltered Lago de Cíes lagoon reveals fish, crabs and marine algae when
      the tide is still.
    visit: >-
      The archipelagos are explored entirely on foot along marked nature trails. On Cíes, the Monte Faro route
      covers 7 km round trip with 175 m of climb, taking about two and a half hours to reach the lighthouse
      perched above dizzying cliffs. Halfway up sits the Pedra da Campá, a granite tor hollowed out by salty
      Atlantic gales. The Faro da Porta trail spans 5 km of easy walking in an hour and a half, while the
      gentle Alto do Príncipe path covers 3 km in one hour.


      On Ons, the Northern Route is a circular walk of 8.1 km taking about three hours of moderate hiking. The
      Southern Route, also circular, covers 6.5 km in two and a half hours, passing the Fedorentos viewpoint
      overlooking Onza island and the distant Cíes, alongside the Buraco do Inferno, a sea chasm carved into
      the granite.


      For cultural context, visit the Cambón visitor centre in historic Vigo and island interpretation centres
      on Cíes and Ons, the former built over the medieval monastery of San Estevo.
    history: >-
      Human settlement traces back to the Palaeolithic on Cíes, with Bronze Age fortified castros on Cíes and
      Ons. On Ons, winter isolation when stormy seas cut all boat connections fostered an autonomous island
      culture steeped in ethnobotany, folklore of the Santa Compaña and protective broom rituals against the
      evil eye on fishing skiffs. The dorna is the traditional wooden boat, propelled by oars or lateen sail.
      The Cíes were originally declared a natural park in 1980.
    before: >-
      Visiting Cíes and Ons requires an official advance permit from the Xunta de Galicia; secure it before
      booking ferry crossings. Check ferry schedules and weather forecasts carefully, especially during
      off-peak months. Authorized campsites have strict capacity limits. Keep well back from unfenced cliff
      edges and never swim in rough ocean waters.
    around: >-
      [Kornati National Park](/lugar/nacionalni-park-kornati/) shares yellow-legged gulls and European shags,
      as does [Cap de Creus Natural Park](/lugar/parc-natural-del-cap-de-creus/); both represent celebrated
      seabird coastlines across southern Europe.
  fr:
    intro: >-
      Six mois après sa déclaration en parc national, le 1 juillet 2002, le pétrolier Prestige fit naufrage et
      sa marée noire souilla les rivages de toutes ses îles à l'exception de Cortegada. Une décennie plus
      tard, les suivis scientifiques démontraient que l'essentiel des impacts négatifs était surmonté ; la
      séquelle durable demeure le déclin du cormoran huppé, aujourd'hui soutenu par un plan de rétablissement.
      Ces quatre archipels de granite — Cíes, Ons, Sálvora et Cortegada — forment le seul parc national de
      Galice, accessible uniquement par la mer.
    landscape: >-
      Les Cíes barrent l’entrée de la ría de Vigo tandis qu’Ons protège la ría de Pontevedra. Sálvora veille
      sur la ría d’Arousa, et Cortegada s’abrite au fond de ses eaux calmes. Entre écueils et houle se déploie
      une mosaïque d’habitats : sous l’eau s’épanouissent des forêts de laminaires, des bancs de maërl et des
      récifs rocheux ; à terre dominent cordons dunaires, falaises vertigineuses et landes atlantiques à
      ajoncs et bruyères. L’état écologique marin est globalement satisfaisant, bien que menacé par les
      pollutions du trafic maritime et la pêche excessive.


      L’occupation humaine a profondément marqué la végétation insulaire. Aux Cíes, des plantations
      d’eucalyptus et d’acacias ont étouffé la flore indigène, dont l’éradication demande un travail de longue
      haleine. Le piétinement dégradant les dunes, des passerelles sur pilotis protègent les zones les plus
      vulnérables.
    wildlife: >-
      Les oiseaux marins règnent sur l’archipel. Le [goéland leucophée](/especie/larus_michahellis/) et le
      [cormoran huppé](/especie/phalacrocorax_aristotelis/) sont les deux espèces marines les plus nombreuses,
      nichant à Punta Centolo sur Ons ; ce promontoire est fermé au public du 15 février au 31 juillet durant
      la reproduction. Aux Cíes, l’observatoire du Monte Faro permet de contempler des milliers de goélands
      installés sur les vires rocheuses, tandis que sur l’îlot de Viños les cormorans étendent leurs ailes au
      soleil.


      Sur le sentier du Monte Faro, la lagune du Lago de Cíes laisse voir par mer calme poissons, crustacés et
      herbiers d'algues.
    visit: >-
      Les îles s'explorent à pied sur des sentiers balisés. Aux Cíes, la montée au Monte Faro fait 7 km
      aller-retour pour 175 m de dénivelé et deux heures et demie de marche jusqu’au phare panoramique
      dominant l'Atlantique. À mi-pente se dresse la Pedra da Campá, roche sculptée par les embruns marins. Le
      chemin du Faro da Porta mesure 5 km en une heure et demie, tandis que la balade de l’Alto do Príncipe
      compte 3 km pour une heure de marche facile.


      À Ons, la boucle nord fait 8,1 km en environ trois heures. La boucle sud s'étend sur 6,5 km pour deux
      heures et demie de marche, menant au belvédère de Fedorentos face à l'îlot d'Onza et au Buraco do
      Inferno, gouffre marin creusé dans le granite.


      Pour saisir l'histoire insulaire, visitez le centre Cambón à Vigo et les maisons du parc à Cíes et Ons,
      la première bâtie sur les ruines du prieuré San Estevo.
    history: >-
      Les premiers campements remontent au Paléolithique aux Cíes, suivis des castros fortifiés de l'âge du
      bronze. À Ons, l'isolement hivernal a forgé une identité maritime singulière, marquée par la pharmacopée
      traditionnelle, la légende de la Santa Compaña et les rituels de protection sur les embarcations. La
      dorna est le canot traditionnel à rames ou voile latine. Les Cíes furent érigées en parc naturel dès
      1980.
    before: >-
      L'accès aux îles Cíes et à Ons exige une autorisation préalable délivrée par la Xunta de Galicia ;
      assurez-vous de l'obtenir avant de réserver les navettes maritimes. Vérifiez les rotations maritimes en
      basse saison et par gros temps. Les aires de campement ont une jauge limitée. Ne vous approchez pas des
      falaises par vent fort.
    around: >-
      Le [Parc national des Kornati](/lugar/nacionalni-park-kornati/) partage goéland leucophée et cormoran
      huppé, tout comme le [Parc naturel du Cap de Creus](/lugar/parc-natural-del-cap-de-creus/) ; des rivages
      maritimes voués aux oiseaux marins.
  de:
    intro: >-
      Sechs Monate nach der Erklärung zum Nationalpark, am 1. Juli 2002, havarierte der Öltanker Prestige und
      seine Ölpest verseuchte die Strände fast aller Inseln mit Ausnahme von Cortegada. Eine Dekade später
      belegten ökologische Gutachten, dass die meisten Schäden überwunden waren; einzig die Bestände der
      Krähenscharbe bedürfen weiterhin gezielter Artenschutzmaßnahmen. Diese Granitinseln — Cíes, Ons, Sálvora
      und Cortegada — bilden Galiciens einzigen Nationalpark, der nur auf dem Seeweg erreichbar ist.
    landscape: >-
      Die Cíes riegeln die Ría de Vigo ab, während Ons vor der Ría de Pontevedra liegt. Sálvora bewacht die
      Zufahrt zur Ría de Arousa, und Cortegada ruht tief im geschützten Fjordinneren. Unter Wasser wachsen
      dichte Kelpwälder, Maërl-Algenbänke und Felsriffe; an Land prägen Küstendünen, Felsklippen und
      atlantische Heidegesellschaften das Bild. Die marinen Ökosysteme sind weitgehend intakt, wenngleich
      Schifffahrt und Überfischung Belastungen darstellen.


      Menschliche Eingriffe veränderten die Inselvegetation: Auf den Cíes verdrängten Forste aus Eukalyptus
      und Akazien die angestammte Flora, deren Rückbau Generationen beansprucht. Holzstege schützen die
      empfindlichen Dünen vor Trittschäden.
    wildlife: >-
      Seevögel beherrschen die Felswände. Die [Mittelmeermöwe](/especie/larus_michahellis/) und die
      [Krähenscharbe](/especie/phalacrocorax_aristotelis/) sind die beiden häufigsten Arten und brüten an der
      Punta Centolo auf Ons; dieser Aussichtspunkt ist vom 15. Februar bis zum 31. Juli zur Brutzeit für
      Besucher gesperrt. Auf den Cíes ermöglicht die Vogelwarte am Monte Faro Einblicke in tausende nistende
      Möwen, während Scharben auf Felsvorsprüngen im Meer nisten. Auf der Felseninsel Viños trocknen Scharben
      ihr Gefieder in der Sonne.


      Auf der Route zum Monte Faro gewährt die Lagune Lago de Cíes bei ruhiger See Einblicke in Tangwälder und
      Fische.
    visit: >-
      Die Inseln werden zu Fuß auf markierten Routen erkundet. Auf den Cíes führt der Weg zum Monte Faro über
      7 km hin und zurück mit 175 Höhenmetern in zweieinhalb Stunden zum Leuchtturm hoch über den Klippen.
      Unterwegs passiert man den winddurchlöcherten Felsen Pedra da Campá. Der Weg zum Faro da Porta umfasst 5
      km in anderthalb Stunden, der Pfad zum Alto do Príncipe 3 km in einer Stunde einfacher Wanderzeit.


      Auf Ons misst die Nordroute 8,1 km bei rund drei Stunden Gehzeit. Die Südroute verläuft über 6,5 km in
      zweieinhalb Stunden zum Aussichtspunkt Fedorentos mit Blick auf die Insel Onza und zum Buraco do
      Inferno, einer tosenden Meereskluft im Granit.


      Besucherzentren in Vigo (Cambón) sowie auf Cíes und Ons vermitteln Inselgeschichte und Ökologie.
    history: >-
      Menschliche Spuren reichen auf den Cíes bis in die Altsteinzeit zurück, gefolgt von eisenzeitlichen
      Castros auf Cíes und Ons. Auf Ons brachte die winterliche Isolation eine eigenständige Inselkultur mit
      reichem Kräuterwissen und Legenden wie der Santa Compaña hervor. Die Dorna ist das traditionelle
      Fischerboot aus Holz. Die Cíes wurden bereits 1980 zum Naturpark erklärt.
    before: >-
      Der Besuch von Cíes und Ons erfordert eine behördliche Vorabgenehmigung der Xunta de Galicia; buche
      diese vor der Fährüberfahrt. Achte in der Nebensaison auf den Fährfahrplan und Wetterwarnungen.
      Campingplätze sind kontingentiert. Halte Abstand zu den ungesicherten Steilkanten.
    around: >-
      Der [Nationalpark Kornaten](/lugar/nacionalni-park-kornati/) teilt Mittelmeermöwe und Krähenscharbe,
      ebenso der [Naturpark Cap de Creus](/lugar/parc-natural-del-cap-de-creus/).
  it:
    intro: >-
      Sei mesi dopo l'istituzione a parco nazionale, il 1 luglio 2002, la petroliera Prestige affondò e la
      marea nera contaminò le coste di tutte le isole eccetto Cortegada. Un decennio più tardi, i monitoraggi
      ambientali confermarono il superamento di quasi tutte le conseguenze critiche; la ferita aperta riguarda
      il marangone dal ciuffo, oggetto di un programma specifico di ripopolamento. Questi arcipelaghi
      granitici — Cíes, Ons, Sálvora e Cortegada — costituiscono l'unico parco nazionale della Galizia,
      raggiungibile per mare.
    landscape: >-
      Le Cíes sbarrano l'imboccatura della ría di Vigo, mentre Ons fronteggia la ría di Pontevedra. Sálvora
      presidia l'ingresso della ría di Arousa e Cortegada si colloca nelle sue acque interne riparate. Tra
      scogli e flutti oceanici si apre un mosaico di ecosistemi: foreste sommerse di kelp, fondali a maërl e
      secche sabbiose; a terra spiccano cordoni dunali, falesie a picco e brughiere atlantiche a ginestrone ed
      erica. I fondali marini godono di buona salute, pur minacciati dal traffico mercantile e dallo
      sfruttamento alieutico.


      L'impatto antropico ha segnato il manto vegetale: sulle Cíes rimboschimenti di eucalipti e pini hanno
      alterato l'habitat primigenio, e la loro eradicazione richiede programmi pluriennali. Passerelle
      protette preservano la vegetazione dunale dal calpestio dei bagnanti.
    wildlife: >-
      Gli uccelli marini dominano il parco. Il [gabbiano reale zafferano](/especie/larus_michahellis/) e il
      [marangone dal ciuffo](/especie/phalacrocorax_aristotelis/) sono i due nidificanti più numerosi e
      affollano Punta Centolo a Ons; il relativo belvedere è interdetto dal 15 febbraio al 31 luglio per
      tutelare le cove. Sulle Cíes, l'osservatorio lungo il sentiero del Monte Faro domina migliaia di
      gabbiani nidificanti sulle cenge, mentre sull'isolotto di Viños i marangoni asciugano le ali al sole.


      Lungo la salita al Monte Faro, la laguna del Lago de Cíes consente di scorgere pesci, granchi e alghe
      attraverso acque cristalline.
    visit: >-
      Gli arcipelaghi si visitano a piedi lungo percorsi segnalati. Sulle Cíes, l'itinerario del Monte Faro
      copre 7 km andata e ritorno con 175 m di salita in circa due ore e mezza, terminando al faro panoramico
      sulle falesie atlantiche. A mezza costa si nota la Pedra da Campá, roccia forata dai venti salmastri. Il
      sentiero del Faro da Porta misura 5 km in un'ora e mezza di cammino agevole, mentre la passeggiata
      dell'Alto do Príncipe si snoda per 3 km in un'ora.


      A Ons, l'anello settentrionale misura 8,1 km e richiede circa tre ore. L'anello meridionale copre 6,5 km
      in due ore e mezza, conducendo al belvedere di Fedorentos sull'isola di Onza e al Buraco do Inferno, una
      profonda gola marina incisa nel granito.


      I centri visite di Vigo (Cambón) e delle isole Cíes e Ons illustrano la natura e la storia insulare.
    history: >-
      Le prime tracce risalgono al Paleolitico sulle Cíes, seguite dai castieri fortificati dell'età del
      bronzo su Cíes e Ons. A Ons l'isolamento invernale forgiò una comunità fiera con tradizioni erboristiche
      e leggende come la Santa Compaña. La dorna è l'imbarcazione tradizionale in legno a remi e vela latina.
      Le Cíes furono dichiarate parco naturale nel 1980.
    before: >-
      La visita a Cíes e Ons richiede il rilascio obbligatorio di un'autorizzazione telematica della Xunta de
      Galicia da richiedere prima di acquistare i biglietti dei traghetti. Verifica gli orari di navigazione e
      le condizioni meteo. Il campeggio autorizzato dispone di posti contingentati. Mantieniti a debita
      distanza dal ciglio delle falesie.
    around: >-
      Il [Parco Nazionale delle Incoronate](/lugar/nacionalni-park-kornati/) e il [Parco Naturale di Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) condividono popolazioni di gabbiani e marangoni dal ciuffo
      su coste rocciose affini.
  pt:
    intro: >-
      Seis meses após a sua classificação como parque nacional, a 1 de julho de 2002, o petroleiro Prestige
      naufragou e a maré negra atingiu a quase totalidade das ilhas à exceção de Cortegada. Uma década
      volvida, as investigações ecológicas comprovaram a superação da maioria dos danos; a marca remanescente
      reside no declínio do corvo-marinho-de-crista, alvo de um plano de recuperação ativo. Estes arquipélagos
      graníticos — Cíes, Ons, Sálvora e Cortegada — formam o único parque nacional da Galiza, com acesso
      exclusivo por via marítima.
    landscape: >-
      As Cíes guardam a entrada da ría de Vigo e Ons a da ría de Pontevedra. Sálvora vigia a ría de Arousa e
      Cortegada situa-se no seu interior resguardado. Entre a rocha e o oceano desdobra-se um rico mosaico
      ecológico: florestas submersas de kelp e fundos de maërl; em terra erguem-se sistemas dunares, arribas
      abruptas e charnecas atlanticas de tojo e urze. O estado dos fundos marinhos é favorável, embora
      condicionado pelo tráfego marítimo e pela pesca histórica.


      A intervenção humana alterou a vegetação: nas Cíes a plantação de eucaliptos e acácias substituiu a
      flora autóctone, exigindo a sua erradicação um trabalho continuado. Passadiços de madeira protegem os
      sistemas dunares do pisoteio excessivo.
    wildlife: >-
      As aves marinhas dominam a paisagem. A [gaivota-de-patas-amarelas](/especie/larus_michahellis/) e o
      [corvo-marinho-de-crista](/especie/phalacrocorax_aristotelis/) são os dois nidificantes mais numerosos,
      ocupando a Punta Centolo em Ons; o miradouro fecha do 15 de fevereiro ao 31 de julho para resguardar a
      reprodução. Nas Cíes, o observatório do Monte Faro descortina milhares de gaivotas em nidificação nas
      arribas, enquanto no ilhéu de Viños os corvos-marinhos secam as asas ao sol.


      No caminho do Monte Faro, a lagoa do Lago de Cíes permite avistar peixes, caranguejos e algas marinhas
      em maré calma.
    visit: >-
      Os arquipélagos percorrem-se a pé por trilhos assinalados. Nas Cíes, a rota do Monte Faro soma 7 km ida
      e volta com 175 m de desnível em duas horas e meia, atingindo o farol cimeiro sobre as arribas. A meio
      caminho surge a Pedra da Campá, esculpida pelo vento salgado. O trilho do Faro da Porta perfaz 5 km numa
      hora e meia, enquanto o Alto do Príncipe cumpre 3 km numa hora de marcha suave.


      Em Ons, a Rota Norte é circular com 8,1 km em cerca de três horas. A Rota Sul percorre 6,5 km em duas
      horas e meia até ao miradouro de Fedorentos sobre a ilha de Onza e ao Buraco do Inferno, fenda marinha
      aberta no granito.


      Centros de acolhimento em Vigo (Cambón) e nas ilhas Cíes e Ons elucidam o património natural e
      etnográfico.
    history: >-
      Os vestígios mais remotos remontam ao Paleolítico nas Cíes, seguidos de castros da Idade do Bronze em
      Cíes e Ons. Em Ons o isolamento invernal originou saberes de ervanária tradicional e ritos contra o
      mau-olhado nas dornas, embarcações tradicionais de madeira. As Cíes foram declaradas parque natural em
      1980.
    before: >-
      A visita às Cíes e a Ons carece de autorização prévia da Xunta de Galicia; obtém-na antes de reservar o
      transporte marítimo. Confirma os horários dos barcos e as previsões meteorológicas. O campismo tem
      lotação limitada. Mantém distância das arribas desprotegidas.
    around: >-
      O [Parque Nacional de Kornati](/lugar/nacionalni-park-kornati/) e o [Parque Natural do Cap de
      Creus](/lugar/parc-natural-del-cap-de-creus/) partilham a gaivota-de-patas-amarelas e o
      corvo-marinho-de-crista em costas rochosas atlânticas e mediterrânicas.
