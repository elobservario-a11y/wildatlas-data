resumen:
  es: >-
    El primer Parque Nacional de Dinamarca (244 km²), una wilderness costera de dunas vivas, brezales
    litorales y bosques de duna azotados por el Mar del Norte.
  en: >-
    Denmark's first National Park (244 km²), a coastal wilderness of shifting dunes, littoral heathlands, and
    dune forests lashed by the North Sea.
  fr: >-
    Le premier parc national du Danemark (244 km²), une wilderness côtière de dunes mobiles, de landes
    littorales et de forêts de dunes battues par la mer du Nord.
  de: >-
    Dänemarks erster Nationalpark (244 km²), eine Küstenwildnis aus Wanderdünen, Dünenheiden und
    windgepeitschten Dünenwäldern an der Nordsee.
  it: >-
    Il primo Parco Nazionale della Danimarca (244 km²), una wilderness costiera di dune mobili, brughiere
    litoranee e pinete dunose sferzate dal Mare del Nord.
  pt: >-
    O primeiro Parque Nacional da Dinamarca (244 km²), uma wilderness costeira de dunas móveis, charnecas
    litorais e pinhais dunares fustigados pelo Mar do Norte.
unico:
  es: >-
    Un brezal de dunas arenosas, raro en el contexto europeo, donde los ciervos braman cada otoño y las
    grullas bailan cada primavera.
  en: >-
    A vast expanse of coastal dune heath, globally rare in the European context, where red deer rut each
    autumn and cranes dance each spring.
  fr: >-
    Une lande dunaire sableuse, d'une grande rareté dans le contexte européen, où les cerfs bramant à
    l'automne côtoient la parade des grues au printemps.
  de: >-
    Eine im europäischen Maßstab seltene Sanddünenheide, auf der jeden Herbst Hirsche röhren und jeden
    Frühling Kraniche tanzen.
  it: >-
    Una brughiera di duna sabbiosa, rarissima nel panorama europeo, dove i cervi bramiscono in autunno e le
    gru danzano a ogni primavera.
  pt: >-
    Uma charneca dunar arenosa, rara no contexto europeu, onde os veados bramam a cada outono e os grous
    dançam a cada primavera.
observaciones:
  es: >-
    En la zona central de la reserva de Hanstholm no se puede entrar nunca, y en el resto, al este de la
    Coastal Road, está cerrado del 1 de abril al 15 de julio. No se permiten perros en la reserva. Ålvand
    Klithede y Færgegårds Sig cierran del 1 de abril al 15 de julio por la cría de las aves; en Ålvand hay que
    mantenerse en los senderos existentes. En Agger Tange está prohibido acceder todo el año a las aguas de la
    lengua de tierra y a la isla de aves, y a los prados bajos del 1 de abril al 15 de julio.


    En el resto del parque, los perros son bienvenidos pero con correa; solo en invierno pueden ir sueltos por
    la playa, y en verano únicamente dentro del agua hasta la línea de bajamar. La mejor época va de mayo a
    octubre.
texto:
  es:
    intro: >-
      Durante siglos, la arena fue el enemigo. En Thy, al noroeste de Jutlandia, la arena movediza se comía
      tierras y casas, y solo hacia el año 1800 se organizaron plantaciones de gramíneas y árboles para
      frenarla. Hoy, de aquella lucha quedan las plantaciones de dunas y un paisaje de brezales, lagos y costa
      abierta que en 2008 se inauguró como primer parque nacional de Dinamarca. Son 244 km² que recorren la
      costa desde Hanstholm hasta Agger Tange, con 55 km de norte a sur. Aquí puedes recorrer los brezales
      dunares y observar ciervos y grullas desde las torres.
    landscape: >-
      Hace unos 4.000 años, el oeste de Thy era un archipiélago. La tierra se ha ido elevando desde entonces,
      y el mar se ha retirado varios kilómetros. En la Edad de Piedra, el entorno de Isbjerg era mar: el
      brezal actual es antiguo fondo marino, e Isbjerg estaba en una isla. La antigua costa sigue ahí,
      convertida en pendiente: es la que subes por el sendero marcado hasta Isbjerg.


      Al elevarse, la tierra dejó al aire grandes cantidades de arena, y esa arena fue la que se movió durante
      siglos. Los brezales dunares arenosos de Thy son un hábitat raro en el contexto europeo y están
      protegidos por ley. En ellos dominan la brecina, la carex de arena, el barrón, la camarina y el brezo de
      campana, con varios líquenes.


      En Vangså Klithede crecen las tres especies danesas de drosera, y en junio las orquídeas pintan de rosa
      partes del brezal. Para que no lo invadan árboles y arbustos, se desbroza, se quema y se pastorea.
    wildlife: >-
      El año en Thy tiene dos grandes escenas. La primera es primavera: en marzo y abril se ve bailar y
      trompetear a las [grullas](/especie/grus_grus/) en los humedales bajo la torre de Sårup, y en abril, en
      las tardes y mañanas tranquilas, se oye a las parejas y su danza de cortejo. En Thy ha crecido mucho la
      cría de la grulla: hasta 100 parejas de las 600-800 que hay en el país. Las grullas son sensibles al
      acercamiento en sus zonas de cría: obsérvalas de lejos, desde las torres y con prismáticos.


      La segunda es el otoño. El [ciervo](/especie/cervus_elaphus/) se ve con más facilidad durante el celo,
      desde finales de agosto hasta finales de octubre. A finales del verano llegan a juntarse hasta 400
      ciervos en las dunas frente a la torre de Sårup. Desde Hanstholmskrænten, en Brunbjerg, o desde el faro
      de Hanstholm se domina la reserva y, con suerte, se oye y se ve al ciervo en celo.


      Entre ambas escenas pasan los migrantes. Agger Tange, en plena ruta migratoria de la costa oeste de
      Jutlandia, es zona de protección de aves de la UE. En septiembre, al atardecer, miles de ánsares comunes
      llegan del este a pasar la noche en la laguna, que se ve desde el puesto de observación de Arbejdsvejen.
      En la punta sur se ven a menudo [focas comunes](/especie/phoca_vitulina/), y en julio y agosto, durante
      la muda, las molestias pueden ser mortales para ellas.


      Hay también vida más pequeña. En Ålvand viven nutrias, sapos corredores, sapos de espuelas y lagartos
      comunes, y el zarapito trinador, la grulla y los gansos eligen el brezal. Desde 2009 se comunicaron
      avistamientos de lobos en Thy y en la reserva de Hanstholm. En 2012 se encontró un ejemplar muerto,
      después de que la especie hubiera desaparecido de Dinamarca en 1813.
    visit: >-
      Empieza por el Nationalparkcenter Thy, en Nr. Vorupør: es el primero de Dinamarca, abrió el 15 de junio
      de 2021 y está integrado en las dunas. En su exposición aprendes sobre la formación del paisaje, los
      brezales, la fauna y la flora, el movimiento de la arena y la historia. El parque tiene cinco centros de
      visitantes donde dan información, inspiración y mapas.


      Thy tiene 49 rutas señalizadas, con opciones cortas como Hulvejsruten, de 800 metros.
      Vestkyststien/Redningsvejen mide 67 km: va de Agger Tange a Hanstholm y continúa hasta Bulbjerg. Thy se
      puede recorrer a pie o en bicicleta; en bici, por caminos aptos para bicis normales, pero no por la
      playa, los monumentos antiguos, los túmulos, los diques, las dunas ni los prados. Con viento del oeste y
      marea alta no se puede ir por la costa en la ruta de Sorte Næse, en Lodbjerg, y con lluvia fuerte se
      inunda parte de Redningsvejen al norte de Lyngby.


      Para la fauna, tres puntos: la torre de Sårup, en la antigua pendiente costera, da muy buena vista del
      interior de la reserva de Hanstholm; lleva buenos prismáticos. La torre de Tvorup Klitplantage permite
      observar la fauna de Ålvand. Y Agger Tange es el sitio para las aves migratorias.
    history: >-
      El 29 de junio de 2007 el ministro de Medio Ambiente eligió Thy como primer parque nacional de
      Dinamarca; la inauguración llegó el 22 de agosto de 2008. La restauración empezó antes, con la reserva
      de Hanstholm. En los años treinta el Estado compró 34 km² y prohibió la caza; en 1939 se cerró una zanja
      y la zona quedó a su aire como primer proyecto de restauración de la naturaleza del país. Es el mayor
      brezal de Dinamarca, un mosaico de llanuras, lagos entre dunas y dunas cubiertas de brezo.
    before: >-
      En la zona central de la reserva de Hanstholm no se puede entrar nunca, y en el resto, al este de la
      Coastal Road, está cerrado del 1 de abril al 15 de julio. No se permiten perros en la reserva. Ålvand
      Klithede y Færgegårds Sig cierran del 1 de abril al 15 de julio por la cría de las aves; en Ålvand hay
      que mantenerse en los senderos existentes. En Agger Tange está prohibido acceder todo el año a las aguas
      de la lengua de tierra y a la isla de aves, y a los prados bajos del 1 de abril al 15 de julio.


      En el resto del parque, los perros son bienvenidos pero con correa; solo en invierno pueden ir sueltos
      por la playa, y en verano únicamente dentro del agua hasta la línea de bajamar. La mejor época va de
      mayo a octubre.
  en:
    intro: >-
      For generations, drifting sand was the enemy. Across Thy in northwestern Jutland, shifting dunes
      swallowed cultivated fields and farmsteads, and only around the year 1800 did organized planting of
      marram grass and conifers begin to halt the sand drift. Today, that historic struggle has left behind
      extensive dune plantations and a wilderness of heather heaths, dune lakes, and open North Sea coast that
      in 2008 was inaugurated as Denmark's first national park. Covering 244 km², it traces the coast from
      Hanstholm south to Agger Tange, stretching 55 km from north to south. Here you can hike across wild dune
      heaths and watch red deer and cranes from observation towers.
    landscape: >-
      Some 4,000 years ago, western Thy was an open archipelago of islands. The land has steadily rebounded
      through post-glacial uplift, pushing the shoreline kilometers westward. In the Stone Age, the terrain
      surrounding Isbjerg was open sea: the modern heath rests on ancient seabed, and Isbjerg was an isolated
      island. The former coastline persists as an inland escarpment: that is the slope you climb along the
      marked trail to Isbjerg.


      As the land rose, immense volumes of sand were exposed to wind action, driving the dune migrations of
      later centuries. Thy's coastal dune heaths represent an internationally rare habitat protected under
      European law. They are dominated by heather, sand sedge, marram grass, crowberry, and cross-leaved
      heath, interspersed with diverse lichens.


      At Vangså Klithede grow all three Danish sundew species, and in June wild orchids tint parts of the
      heath in vivid pink. To prevent succession into scrub and trees, the heath is actively managed through
      clearing, controlled burning, and conservation grazing.
    wildlife: >-
      The natural year in Thy features two headline spectacles. The first arrives in spring: in March and
      April [common cranes](/especie/grus_grus/) perform their trumpeting courtship dances in the marshes
      beneath the Sårup observation tower; on quiet April mornings and evenings their resonant bugling carries
      across the wetlands. Crane breeding numbers have surged in Thy: up to 100 pairs out of Denmark's
      national total of 600-800 pairs. Cranes are sensitive to human intrusion during nesting: observe them
      discreetly from the towers with binoculars.


      The second spectacle is autumn. [Red deer](/especie/cervus_elaphus/) are most easily observed during the
      rut, from late August to late October. By late summer up to 400 stags and hinds congregate in the open
      dunes before the Sårup tower. From Hanstholmskrænten at Brunbjerg or from the Hanstholm lighthouse, you
      overlook the vast reserve and can hear the roaring of rutting stags.


      Between these seasons pass migratory flocks. Agger Tange, situated directly on the West Jutland flyway,
      is an EU Special Protection Area. On September evenings thousands of greylag geese arrive from the east
      to roost on the lagoon, visible from the Arbejdsvejen bird hide. On the southern spit, [common
      seals](/especie/phoca_vitulina/) haul out regularly; in July and August during their annual moult, human
      disturbance can be fatal.


      Smaller wildlife also abounds. Ålvand shelters Eurasian otters, natterjack toads, spadefoot toads, and
      viviparous lizards, while whimbrel, cranes, and geese forage across the heath. Since 2009, confirmed
      wolf sightings were documented in Thy and Hanstholm reserve. In 2012 a dead wolf was found, confirming
      the predator's return after having been extirpated from Denmark in 1813.
    visit: >-
      Begin at the Nationalparkcenter Thy in Nr. Vorupør: Denmark's first national park visitor center, opened
      on 15 June 2021 and built seamlessly into the coastal dunes. Its interactive exhibition explains coastal
      landforms, heathlands, wildlife, sand drifts, and cultural history. The park maintains five visitor
      gateways offering information, inspiration, and trail maps.


      Thy offers 49 waymarked trails, including short nature strolls such as the 800 m Hulvejsruten. The
      long-distance Vestkyststien/Redningsvejen measures 67 km from Agger Tange to Hanstholm and onwards to
      Bulbjerg. You can explore on foot or by bicycle; cycling is permitted on designated tracks suitable for
      standard bikes, but strictly barred from beaches, archaeological barrows, dunes, and grazing meadows.
      During westerly gales and spring tides the beach route at Sorte Næse in Lodbjerg is impassable, and
      heavy rain floods parts of Redningsvejen north of Lyngby.


      For wildlife viewing, three vantage points stand out: the Sårup tower on the ancient coastal cliff gives
      expansive views across the Hanstholm reserve; the Tvorup Klitplantage tower overlooks the wilderness of
      Ålvand; and Agger Tange is premier for coastal waterbirds.
    history: >-
      On 29 June 2007 the Minister for the Environment selected Thy as Denmark's inaugural national park;
      official opening celebrations followed on 22 August 2008. Ecological restoration began much earlier in
      the Hanstholm reserve. In the thirties the Danish State purchased 34 km² and prohibited hunting; in 1939
      drainage ditches were blocked, allowing natural regeneration as the nation's earliest nature restoration
      initiative. Today it forms Denmark's largest dune heath, a mosaic of plains, dune slacks, and heather
      hummocks.
    before: >-
      Entering the core sanctuary of the Hanstholm reserve is prohibited year-round, while the remaining
      eastern section beyond the Coastal Road is closed from 1 April to 15 July. Dogs are barred from the
      reserve. Ålvand Klithede and Færgegårds Sig close from 1 April to 15 July during bird breeding season;
      in Ålvand you must stay on established trails. At Agger Tange, access to the coastal sand spit waters
      and bird island is prohibited year-round, and the wet meadows close from 1 April to 15 July.


      Throughout the rest of the park, dogs are welcome on a leash; only in winter may they run off-lead on
      the beach, and in summer solely within the water below the high-tide line. The premier season spans May
      to October.
  fr:
    intro: >-
      Durant des siècles, le sable fut le grand ennemi. À Thy, dans le nord-ouest du Jutland, les dunes
      mobiles engloutissaient champs et fermes, et ce n'est que vers l'an 1800 que débutèrent les plantations
      d'oyats et de pins pour fixer le sable. De cette lutte séculaire subsistent aujourd'hui les plantations
      dunaires et une mosaïque de landes, de lacs et de côtes sauvages qui fut inaugurée en 2008 comme le tout
      premier parc national du Danemark. Ses 244 km² bordent la mer du Nord depuis Hanstholm jusqu'à Agger
      Tange, sur 55 km du nord au sud. On y parcourt des landes dunaires d'un grand calme pour observer cerfs
      et grues depuis les tours d'affût.
    landscape: >-
      Il y a quelque 4 000 ans, l'ouest de Thy formait un archipel d'îles côtières. Le soulèvement isostatique
      a depuis fait reculer le rivage de plusieurs kilomètres vers l'ouest. À l'âge de la pierre, le secteur
      d'Isbjerg était immergé : la lande actuelle repose sur d'anciens fonds marins et Isbjerg formait un îlot
      isolé. L'ancienne côte fossile subsiste sous la forme d'un talus abrupt : c'est la pente que gravit le
      sentier balisé menant à Isbjerg.


      En s'exhaussant, les terres libérèrent d'immenses volumes de sable, à l'origine des invasions dunaires
      historiques. Les landes dunaires de Thy constituent un milieu exceptionnel en Europe, strictement
      protégé par la loi. La callune, la laîche des sables, l'oyat, la camarine et la bruyère quaternée y
      dominent, accompagnées de riches tapis de lichens.


      À Vangså Klithede poussent les trois espèces danoises de drosères, et en juin les orchidées colorent de
      rose la lande humide. Pour empêcher l'embroussaillement, le milieu fait l'objet de fauches, d'écobuages
      dirigés et de pâturage conservatoire.
    wildlife: >-
      L'année à Thy s'articule autour de deux temps forts. Le premier survient au printemps : en mars et
      avril, les [grues cendrées](/especie/grus_grus/) dansent et claironnent dans les marais dominés par la
      tour de Sårup ; par les matins calmes d'avril résonnent les concerts de parade des couples. La
      population nicheuse de grues a spectaculairement augmenté à Thy : jusqu'à 100 couples sur les 600-800
      recensés dans tout le pays. Les grues étant très sensibles aux dérangements, observez-les à distance
      depuis les tours avec des jumelles.


      Le second temps fort est l'automne. Le [cerf élaphe](/especie/cervus_elaphus/) s'observe aisément lors
      du brame, de fin août à fin octobre. En fin d'été, jusqu'à 400 cerfs et biches se rassemblent dans les
      dunes face à la tour de Sårup. Depuis Hanstholmskrænten à Brunbjerg ou depuis le phare de Hanstholm, on
      domine toute la réserve pour écouter le brame puissant des hardes.


      Entre ces deux moments passent les migrateurs. Agger Tange, sur la route migratoire de la côte ouest du
      Jutland, est une zone de protection spéciale de l'UE. En septembre au crépuscule, des milliers d'oies
      cendrées rejoignent la lagune pour la nuit, visibles depuis l'observatoire d'Arbejdsvejen. À la pointe
      sud se reposent régulièrement des [phoques communs](/especie/phoca_vitulina/) ; en juillet et août
      durant la mue, le moindre dérangement peut leur être fatal.


      La faune discrète est également remarquable. Ålvand abrite loutre d'Europe, crapaud calamite, pélobate
      brun et lézard vivipare, tandis que courlis corlieu et bécassines fréquentent les zones tourbeuses.
      Depuis 2009, des loups ont été signalés à Thy et dans la réserve de Hanstholm. En 2012, un loup mort fut
      découvert, marquant le retour naturel d'une espèce disparue du Danemark en 1813.
    visit: >-
      Commencez votre visite au Nationalparkcenter Thy à Nr. Vorupør : premier centre d'interprétation
      national du Danemark, inauguré le 15 juin 2021 et encastré dans les dunes littorales. Son exposition
      vivante retrace la géologie dunaire, les landes, la faune et l'histoire des dunes mobiles. Le parc
      dispose de cinq relais d'information accueillant le public avec cartes et conseils.


      Thy compte 49 itinéraires balisés, incluant de courts circuits comme la Hulvejsruten de 800 mètres. Le
      grand itinéraire Vestkyststien/Redningsvejen totalise 67 km d'Agger Tange à Hanstholm jusqu'à Bulbjerg.
      On s'y déplace à pied ou à vélo sur des pistes cyclables praticables, mais la bicyclette est interdite
      sur les plages, tumulus historiques, digues, dunes et prairies humides. Par vent d'ouest et marée haute,
      la plage de Sorte Næse à Lodbjerg devient impraticable, et les fortes pluies inondent la Redningsvejen
      au nord de Lyngby.


      Pour la faune, trois belvédères s'imposent : la tour de Sårup sur l'ancienne falaise côtière offre une
      vue imprenable sur la réserve de Hanstholm ; la tour de Tvorup Klitplantage permet de scruter les landes
      d'Ålvand ; et Agger Tange reste le paradis des limicoles et canards marins.
    history: >-
      Le 29 juin 2007, le ministre de l'Environnement désigna Thy comme premier parc national du Danemark ;
      l'inauguration officielle eut lieu le 22 août 2008. La renaturation avait débuté bien plus tôt dans la
      réserve de Hanstholm. Dans les années trente, l'État acheta 34 km² et y interdit la chasse ; en 1939,
      les drains furent obturés, laissant la lande évoluer librement comme le tout premier projet de
      restauration écologique du pays. C'est la plus grande lande dunaire du Danemark, une mosaïque de pannes
      humides et de crêtes d'oyats.
    before: >-
      La zone centrale de la réserve de Hanstholm est interdite d'accès toute l'année, et le reste à l'est de
      la route côtière ferme du 1 avril au 15 juillet. Les chiens y sont prohibés. Ålvand Klithede et
      Færgegårds Sig ferment du 1 avril au 15 juillet pour la reproduction des oiseaux ; à Ålvand restez sur
      les chemins balisés. À Agger Tange l'accès aux eaux de la langue de sable et à l'îlot aux oiseaux est
      interdit toute l'année, et les prairies inondables ferment du 1 avril au 15 juillet.


      Dans le reste du parc, les chiens sont admis en laisse ; en hiver ils peuvent courir librement sur la
      plage, et en été uniquement dans l'eau sous la limite de marée basse. La meilleure période s'étend de
      mai à octobre.
  de:
    intro: >-
      Über Jahrhunderte war der Flugsand die größte Bedrohung. In Thy im Nordwesten Jütlands verschlangen
      Sanddünen Gehöfte und Äcker, und erst um das Jahr 1800 begann man mit gezielten Anpflanzungen von
      Strandhafer und Nadelbäumen, um das Vordringen der Dünen zu stoppen. Aus diesem Ringen erwuchsen die
      weitläufigen Dünenforste sowie eine wilde Naturlandschaft aus Heiden, Dünenseen und offener
      Nordseeküste, die 2008 als Dänemarks erster Nationalpark eingeweiht wurde. Das Areal umfasst 244 km²
      entlang der Küste von Hanstholm bis Agger Tange über 55 km von Nord nach Süd. Hier lassen sich
      Dünenheiden durchwandern und Hirsche sowie Kraniche von Beobachtungstürmen beobachten.
    landscape: >-
      Vor rund 4.000 Jahren war das westliche Thy ein offener Archipel. Seither hob sich das Land durch
      postglaziale Hebung stetig an, und das Meer zog sich um Kilometer zurück. In der Steinzeit war die
      Gegend um Isbjerg offenes Meer: Die heutige Heide ruht auf ehemaligem Meeresgrund, und Isbjerg war eine
      isolierte Insel. Die fossile Steilküste existiert bis heute als bewachsener Abhang, den der Wanderweg
      hinauf zum Aussichtspunkt Isbjerg erklimmt.


      Durch die Hebung fielen gewaltige Sandmassen trocken, die von Westwinden zu Dünen aufgeweht wurden. Die
      offenen Dünenheiden von Thy stellen einen europaweit seltenen Lebensraum dar und stehen unter
      Naturschutz. Es dominieren Besenheide, Sand-Segge, Strandhafer, Krähenbeere und Glockenheide, reich mit
      Flechten durchsetzt.


      In der Vangså Klithede wachsen alle drei dänischen Sonnentauarten, und im Juni färben wilde
      Knabenkräuter Teile der Heide rosa. Um Verbuschung zu verhindern, werden Heiden durch Mahd, Plaggen,
      Beweidung und kontrolliertes Brennen offengehalten.
    wildlife: >-
      Das Naturjahr in Thy bietet zwei markante Höhepunkte. Der erste ist das Frühjahr: Im März und April
      balzen und trompeten die [Kraniche](/especie/grus_grus/) in den Feuchtgebieten unterhalb des
      Sårup-Turms; an windstillen Aprilabenden hallen die Rufe weit über die Heide. Der Brutbestand hat in Thy
      stark zugenommen: Bis zu 100 Paare der dänischen Gesamtpopulation von 600-800 Paaren brüten hier. Da
      Kraniche störungsempfindlich sind, beobachtet man sie am besten aus der Distanz von den Türmen mit dem
      Fernglas.


      Der zweite Höhepunkt ist der Herbst. Der [Rothirsch](/especie/cervus_elaphus/) lässt sich zur Brunftzeit
      von Ende August bis Ende Oktober hervorragend beobachten. Im Spätsommer sammeln sich teils bis zu 400
      Tiere in den Dünen vor dem Turm von Sårup. Vom Hanstholmskrænten bei Brunbjerg oder vom Leuchtturm
      Hanstholm überblickt man das Reservat und lauscht dem Röhren der Hirsche.


      Zwischen diesen Jahreszeiten rasten die Zugvögel. Agger Tange auf der jütländischen Zugroute ist ein
      europäisches Vogelschutzgebiet. Im September fliegen abends tausende Graugänse zur Nachtruhe auf die
      Lagune ein, einsehbar von der Beobachtungshütte am Arbejdsvejen. An der Südspitze sonnen sich regelmäßig
      [Seehunde](/especie/phoca_vitulina/); im Juli und August während des Fellwechsels bedeuten Störungen
      akute Lebensgefahr für sie.


      Auch kleinere Tierarten sind vertreten: In Ålvand leben Fischotter, Kreuzkröten, Knoblauchkröten und
      Waldeidechsen. Seit 2009 wurden wiederholt Wölfe in Thy und im Hanstholm-Reservat nachgewiesen. 2012
      wurde ein toter Wolf gefunden, nachdem die Art in Dänemark seit 1813 als ausgerottet galt.
    visit: >-
      Einstiegspunkt ist das Nationalparkcenter Thy in Nr. Vorupør: Dänemarks erstes Nationalparkzentrum, am
      15. Juni 2021 eröffnet und behutsam in die Küstendünen eingebettet. Seine Ausstellung veranschaulicht
      Dünenbildung, Heidelandschaften, Tierwelt und Sandflucht. Der Park unterhält fünf Besucherportale mit
      Informationsmaterial und Karten.


      Thy verfügt über 49 ausgeschilderte Wanderwege, darunter kurze Runden wie die 800 Meter lange
      Hulvejsruten. Der Fernwanderweg Vestkyststien/Redningsvejen misst 67 km von Agger Tange nach Hanstholm
      bis Bulbjerg. Erkundungen sind zu Fuß oder per Rad möglich; Radfahren ist auf geeigneten
      Wirtschaftswegen erlaubt, jedoch strikt verboten am Strand, auf Grabhügeln, Deichen, Dünen und Weiden.
      Bei Weststurm und Flut ist der Strandabschnitt am Sorte Næse bei Lodbjerg unpassierbar, und Dauerregen
      überschwemmt Teile des Redningsvejen nördlich von Lyngby.


      Drei Aussichtspunkte ragen heraus: Der Sårup-Turm auf dem fossilen Steilufer bietet weiten Blick über
      das Hanstholm-Reservat; der Turm in der Tvorup Klitplantage überblickt Ålvand; und Agger Tange ist das
      Refugium für Küstenvögel.
    history: >-
      Am 29. Juni 2007 bestimmte der Umweltminister Thy zum ersten Nationalpark Dänemarks; die offizielle
      Eröffnung fand am 22. August 2008 statt. Renaturierungsmaßnahmen begannen jedoch weit früher im
      Hanstholm-Reservat. In den dreißiger Jahren erwarb der Staat 34 km² und verbot die Jagd; 1939 wurden
      Entwässerungsgräben verschlossen – Dänemarks erstes echtes Naturschutzprojekt. Heute ist es Dänemarks
      größte zusammenhängende Dünenheide mit Mooren und Dünenseen.
    before: >-
      Die Kernzone des Hanstholm-Reservats darf ganzjährig nicht betreten werden, der übrige Teil östlich der
      Coastal Road ist vom 1. April bis 15. Juli gesperrt. Hunde sind im Reservat verboten. Ålvand Klithede
      und Færgegårds Sig schließen vom 1. April bis 15. Juli zur Brutzeit; in Ålvand muss man auf den Wegen
      bleiben. Bei Agger Tange ist das Betreten der Sandbankgewässer und der Vogelinsel ganzjährig verboten,
      die Feuchtwiesen schließen vom 1. April bis 15. Juli.


      Im übrigen Park sind Hunde an der Leine willkommen; nur im Winter dürfen sie am Strand frei laufen, im
      Sommer nur im Wasser unterhalb der Hochwasserlinie. Beste Reisezeit: Mai bis Oktober.
  it:
    intro: >-
      Per generazioni la sabbia mobile fu il grande flagello. Nel Thy, nel nord-ovest dello Jutland, il vento
      trascinava dune vive che inghiottivano campi e cascine, e solo intorno all'anno 1800 si avviarono
      piantumazioni sistematiche di graminacee e pini per arginare il fenomeno. Da quella secolare contesa
      sono nate le pinete litoranee e un ambiente incontaminato di brughiere dunose, lagune e litorali
      selvaggi inaugurato nel 2008 come primo parco nazionale della Danimarca. I suoi 244 km² costeggiano il
      Mare del Nord da Hanstholm ad Agger Tange per 55 km di estensione lineare. Qui puoi camminare tra lande
      silenziose osservando cervi e gru dalle torri di avvistamento.
    landscape: >-
      Circa 4.000 anni fa la porzione occidentale del Thy era un arcipelago marino. L'innalzamento isostatico
      postglaciale ha da allora sollevato la terraferma ritirando la costa di diversi chilometri. All'età
      della pietra l'altura di Isbjerg era lambita dal mare: la brughiera attuale posa su un antico fondale
      oceanico e Isbjerg formava un'isola. La scogliera fossile permane come ripida scarpata, risalita dal
      sentiero segnalato per Isbjerg.


      Emergendo dalle acque, il terreno liberò imponenti depositi sabbiosi che i venti marini modellarono in
      dune migratorie. Le brughiere dunose del Thy costituiscono un habitat prioritario a livello europeo,
      tutelato rigorosamente. Dominano brugo, carice delle sabbie, sparto pungente, empetro nero ed erica
      quaternata, assieme a un variegato tappeto di licheni.


      A Vangså Klithede vegetano tutte e tre le specie danesi di drosera, e a giugno le orchidee selvatiche
      screziano di rosa le depressioni umide. Per contrastare l'invasione di arbusti e betulle, le brughiere
      vengono gestite con tagli, incendi controllati e pascolo.
    wildlife: >-
      L'anno naturale a Thy culmina in due grandi momenti. Il primo è la primavera: a marzo e aprile le
      [gru](/especie/grus_grus/) danzano e lanciano i loro richiami sonori nelle zone umide sotto la torre di
      Sårup; nei mattini calmi di aprile si ascoltano le coppie nei loro corteggiamenti. A Thy le coppie
      nidificanti di gru sono cresciute rapidamente, fino a 100 sulle 600-800 censite nell'intera nazione.
      Essendo vulnerabili al disturbo, vanno osservate con discrezione dalle torri con il cannocchiale.


      Il secondo appuntamento è l'autunno. Il [cervo nobile](/especie/cervus_elaphus/) si osserva con facilità
      all'epoca del bramito, da fine agosto a fine ottobre. A fine estate fino a 400 cervi si concentrano
      nelle dune aperte davanti alla torre di Sårup. Da Hanstholmskrænten a Brunbjerg o dal faro di Hanstholm
      si domina l'intera riserva ascoltando i bramiti risuonare nelle valli sabbiose.


      Tra queste due stagioni transitano le rotte migratorie. Agger Tange, lungo il corridoio atlantico dello
      Jutland, è una zona di protezione speciale dell'UE. A settembre al tramonto migliaia di oche selvatiche
      giungono per sostare nella laguna, visibili dal capanno di Arbejdsvejen. Sul cordone meridionale
      compaiono regolarmente le [foche comuni](/especie/phoca_vitulina/); a luglio e agosto durante la muta il
      disturbo antropico può rivelarsi fatale.


      Anche la piccola fauna è ben rappresentata: ad Ålvand vivono lontra, rospo calamita, pelobate bruno e
      lucertola vivipara. Dal 2009 sono stati documentati lupi nel Thy e nella riserva di Hanstholm. Nel 2012
      fu rinvenuto un esemplare morto, certificando il ritorno naturale di una specie estinta in Danimarca dal
      1813.
    visit: >-
      Conviene iniziare dal Nationalparkcenter Thy a Nr. Vorupør: il primo centro visite nazionale della
      Danimarca, aperto il 15 giugno 2021 e integrato nel profilo delle dune litoranee. L'allestimento spiega
      la genesi delle dune, la flora delle brughiere, la fauna e la memoria storica. Il parco gestisce cinque
      punti informativi dislocati nel territorio con mappe e pubblicazioni.


      Thy offre 49 itinerari segnalati, con anelli brevi come la Hulvejsruten di 800 metri. Il percorso a
      lungo raggio Vestkyststien/Redningsvejen copre 67 km da Agger Tange ad Hanstholm fino a Bulbjerg. Ci si
      muove a piedi o in bicicletta lungo i tracciati autorizzati per bici ordinarie, mentre è vietato
      pedalare su spiagge, tumuli preistorici, dune e pascoli. Con venti forti da ovest e alta marea la
      spiaggia di Sorte Næse a Lodbjerg risulta impraticabile, e piogge abbondanti allagano la Redningsvejen a
      nord di Lyngby.


      Per l'osservazione faunistica spiccano tre capisaldi: la torre di Sårup sul ciglio fossile domina la
      riserva di Hanstholm; la torre di Tvorup Klitplantage guarda le brughiere di Ålvand; e Agger Tange è
      l'osservatorio per uccelli marini e limicoli.
    history: >-
      Il 29 giugno 2007 il Ministero dell'Ambiente elesse il Thy a primo parco nazionale della Danimarca;
      l'apertura ufficiale seguì il 22 agosto 2008. Gli interventi di tutela partirono decenni prima nella
      riserva di Hanstholm. Negli anni trenta lo Stato acquisì 34 km² vietando l'attività venatoria; nel 1939
      furono chiusi i fossi di bonifica, dando avvio al primo progetto nazionale di rinaturazione spontanea. È
      la maggiore brughiera dunaire danese, un mosaico di conche umide e alture sabbiose.
    before: >-
      La riserva integrale di Hanstholm è interdetta tutto l'anno, mentre il settore a est della Coastal Road
      chiude dal 1 aprile al 15 luglio. I cani sono vietati nella riserva. Ålvand Klithede e Færgegårds Sig
      chiudono dal 1 aprile al 15 luglio per la cova; ad Ålvand occorre restare sui sentieri. Ad Agger Tange è
      vietato l'accesso ai banchi di sabbia e all'isolotto degli uccelli tutto l'anno, e ai prati umidi dal 1
      aprile al 15 luglio.


      Nel resto del parco i cani sono ammessi al guinzaglio; solo in inverno possono correre liberi sulla
      battigia, e d'estate unicamente in acqua sotto la linea di marea. Periodo consigliato: da maggio a
      ottobre.
  pt:
    intro: >-
      Durante séculos, a areia solta foi a grande ameaça. Em Thy, no noroeste da Jutlândia, as dunas móveis
      soterravam campos e aldeias, e apenas por volta do ano 1800 se iniciaram plantações sistemáticas de
      estorno e pinheiros para travar o avanço do areal. Desses combates históricos subsistem hoje as matas
      dunares e uma vasta paisagem de charnecas, lagoas e costa aberta que em 2008 foi inaugurada como o
      primeiro parque nacional da Dinamarca. São 244 km² que acompanham o litoral desde Hanstholm até Agger
      Tange, ao longo de 55 km de norte a sul. Aqui podes caminhar pelas charnecas e avistar veados e grous a
      partir de torres de observação.
    landscape: >-
      Há cerca de 4.000 anos, o ocidente de Thy era um arquipélago aberto. A terra ergueu-se continuamente por
      ajustamento isostático pós-glaciar, fazendo a linha de costa recuar quilómetros para oeste. Na Idade da
      Pedra, o relevo em torno de Isbjerg era mar aberto: a charneca contemporânea assenta em fundos marinhos
      emersos e Isbjerg era uma ilha costeira. A antiga arriba marítima sobrevive como vertente pronunciada: é
      a subida que o trilho balizado percorre até Isbjerg.


      Ao emergir, o relevo expôs imensas quantidades de areia que os ventos transportaram durante gerações. As
      charnecas dunares de Thy constituem um ecossistema raro e protegido no contexto europeu. Nelas
      predominam a urze-roxa, a carvalha-das-areias, o estorno, a camarinha e a urze-dos-pauis, intercalados
      por líquenes.


      Em Vangså Klithede vicejam as três espécies dinamarquesas de dróseras, e em junho as orquídeas selvagens
      salpicam de rosa os solos húmidos. Para evitar o avanço de arvoredo invasor, a charneca é
      intervencionada com roçagens, queimadas controladas e pastoreio de conservação.
    wildlife: >-
      O ano biológico em Thy vive de dois grandes momentos. O primeiro ocorre na primavera: em março e abril
      avistam-se [grous-comuns](/especie/grus_grus/) a dançar e a trombetear nos pauis sob a torre de Sårup;
      nas manhãs e tardes calmas de abril ressoam as danças nupciais dos casais. A população nidificante de
      grous cresceu expressivamente em Thy: acolhe até 100 casais dos 600-800 existentes em toda a Dinamarca.
      Sendo muito sensíveis a aproximações na época de nidificação, observa-os à distância com binóculos a
      partir das torres.


      O segundo momento é o outono. O [veado-vermelho](/especie/cervus_elaphus/) avista-se com maior
      facilidade durante a brama, de finais de agosto a finais de outubro. No final do verão chegam a
      concentrar-se até 400 veados nas dunas em frente à torre de Sårup. A partir de Hanstholmskrænten em
      Brunbjerg ou do farol de Hanstholm domina-se a reserva, escutando a brama dos machos.


      Entre estas duas estações passam as migrações oceânicas. Agger Tange, em plena rota migratória do oeste
      da Jutlândia, é uma zona de proteção especial europeia. Em setembro, ao entardecer, milhares de
      gansos-bravos convergem do leste para pernoitar na lagoa, avistáveis do abrigo de Arbejdsvejen. Na ponta
      sul repousam habitualmente [focas-comuns](/especie/phoca_vitulina/); em julho e agosto durante a muda de
      pelo, as perturbações humanas podem ser fatais para elas.


      Existe também fauna discreta: em Ålvand ocorrem lontras, sapos-corredores, sapos-de-unha-negra e
      lagartixas-vivíparas. Desde 2009 foram assinalados lobos em Thy e no santuário de Hanstholm. Em 2012 foi
      encontrado um exemplar morto, confirmando o regresso de uma espécie desaparecida da Dinamarca em 1813.
    visit: >-
      Começa no Nationalparkcenter Thy em Nr. Vorupør: é o primeiro centro interpretativo nacional da
      Dinamarca, aberto a 15 de junho de 2021 e construído no perfil das dunas. A exposição aborda a dinâmica
      dunar, as charnecas, a fauna e a história humana. O parque dispõe de cinco centros de acolhimento com
      mapas e informações.


      Thy disponibiliza 49 percursos sinalizados, com opções curtas como a Hulvejsruten de 800 metros. A
      grande rota Vestkyststien/Redningsvejen tem 67 km de Agger Tange a Hanstholm até Bulbjerg. Podes
      explorar a pé ou de bicicleta; o ciclismo é autorizado nos caminhos normais, mas estritamente proibido
      nas praias, mamoas históricas, dunas e pastagens. Com tempestade de oeste e maré alta o troço de praia
      em Sorte Næse em Lodbjerg fica cortado, e chuvas intensas alagam a Redningsvejen a norte de Lyngby.


      Para fauna destacam-se três pontos: a torre de Sårup sobre a antiga arriba proporciona ampla vista sobre
      o interior de Hanstholm; a torre de Tvorup Klitplantage permite vigiar os charcos de Ålvand; e Agger
      Tange é o refúgio das aves limícolas.
    history: >-
      A 29 de junho de 2007 o Ministro do Ambiente selecionou Thy como o primeiro parque nacional da
      Dinamarca; a inauguração formal decorreu a 22 de agosto de 2008. As iniciativas de restauro ecológico
      tinham começado antes em Hanstholm. Nos anos trinta o Estado adquiriu 34 km² e baniu a caça; em 1939
      foram bloqueadas as valas de drenagem, permitindo a regeneração hidrológica como o primeiro projeto de
      conservação da natureza do país. É a maior charneca dunar da Dinamarca, um mosaico de lagoas e dunas
      litorais.
    before: >-
      Na reserva integral de Hanstholm é terminantemente proibido entrar ao longo do ano, e no restante setor
      a leste da Coastal Road vigora encerramento de 1 de abril a 15 de julho. É proibida a entrada de cães na
      reserva. Ålvand Klithede e Færgegårds Sig fecham de 1 de abril a 15 de julho para proteção das crias; em
      Ålvand mantém-te nos trilhos existentes. Em Agger Tange é interdito o acesso todo o ano aos cordões
      dunares e ilhéu das aves, e aos prados húmidos de 1 de abril a 15 de julho.


      No restante parque os cães devem circular com trela; no inverno podem circular livres na praia, e no
      verão unicamente dentro de água abaixo da linha de maré cheia. A melhor época decorre de maio a outubro.
