texto:
  es:
    intro: >-
      Desde el puerto de Bavella, a 1.218 metros, el horizonte se llena de dientes: picos desgarrados, grandes
      murallas de roca y pinos retorcidos por el viento. Son las agujas de Bavella, el corazón de un macizo
      del centro de Córcega que une Alta Rocca con la costa este. Aquí el granito no es un telón de fondo: es
      el protagonista, y está trabajado por la tectónica y por la erosión hasta parecer una esponja
      petrificada.
    landscape: >-
      Las siete torres de Asinau son las agujas propiamente dichas, el núcleo del macizo. La más alta, Punta
      Alta, llega a 1.857 m. El conjunto culmina un poco más al norte, en Punta di u Furnellu y Punta
      Muvrareccia, a 1.899 m, y todo queda dominado por el Monte Incudine, de 2.134 m. El macizo es también la
      cuenca del río Solenzara, el límite tradicional entre el norte y el sur de Córcega.


      La forma de las agujas tiene una explicación. En Bavella hay dos tipos de granito. Uno es de grano
      grueso, nació de un ascenso muy lento del magma y es blanquecino y muy sensible a la erosión. El otro,
      de cristales muy pequeños y de aspecto rosado, se enfrió rápido y es muy duro. Esa diferencia, junto con
      la tectónica y la erosión, explica los picos y pitones tan esbeltos. Los tafoni, huecos de formas y
      tamaños muy distintos que se propagan de abajo arriba por la roca, le dan su aspecto de esponja. Los
      tafoni están presentes en todas las rocas de Córcega, pero alcanzan su mejor desarrollo en los granitos
      resistentes.
    wildlife: >-
      El [muflón](/especie/ovis_gmelini/) corso vive en las montañas, sobre todo en las reservas del Cinto y
      de Bavella. Hoy solo quedan dos grupos de población en los macizos del Cinto y de Bavella, y desde 2019
      se creó un tercero liberando animales en el macizo de Cagna. En los acantilados de Calanca Murata, en el
      término de Conca, una zona de protección de biotopo protege el espacio de vida de las poblaciones de
      murciélagos que allí viven.
    visit: >-
      El GR 20 recorre el macizo. Entre el Monte Incudine y el puerto de Bavella pasa por el refugio de
      Asinau, a 1.536 m, y por el pie de las agujas, por el valle del Rizzanese. Una variante alpina atraviesa
      las agujas por la Bocca di u Pargulu, a 1.662 m, y desciende hacia Conca por la Foce Finosa y el refugio
      de Paliri. Cerca de las agujas hay dos refugios: el de Paliri, al sur de la aguja del mismo nombre, y el
      de Asinau, al pie del Monte Incudine.


      Desde el puerto de Bavella parte también el sendero hacia el Trou de la Bombe o el Tafonu di Cumpuleddu.
      Para otro paseo, el arroyo Purcaraccia, famoso por sus cascadas y pozas, desciende por el macizo hasta
      el río Solenzara; el sendero empieza a unos 8 km por la D268 hacia Sari-Solenzara. En el puerto, a pocos
      metros de la carretera, hay una estatua de Notre-Dame-des-Neiges sobre un montón de piedras. El puerto
      de Bavella es uno de los cuatro grandes puertos de Córcega que unen las dos vertientes por el interior,
      y el más meridional.
    history: >-
      El macizo pertenece al Parque Natural Regional de Córcega, creado en 1972, que abarca el circo de
      Bavella y regula su frecuentación. Es además espacio natural sensible, sitio Natura 2000, sitio
      clasificado y sitio inscrito.
    before: >-
      Acampar está estrictamente prohibido en las agujas. El macizo es más bajo que el de las agujas de
      Popolasca, pero mucho más frecuentado.
    around: >-
      El [Parque Nacional Forestal de Troodos](/lugar/troodos-national-forest-park/) comparte con Bavella la
      alta montaña, el bosque maduro y el muflón.
  en:
    intro: >-
      From the Col de Bavella, at 1,218 metres, the horizon bristles with teeth: jagged pinnacles, sheer rock
      ramparts, and wind-twisted pine trees. These are the Aiguilles de Bavella, the jagged core of a massif
      in central Corsica linking the Alta Rocca to the eastern coast. Here the granite is no mere background:
      it takes centre stage, sculpted by tectonics and weathering into something resembling a petrified
      sponge.
    landscape: >-
      The seven towers of Asinau are the needles proper, forming the core of the massif. The highest, Punta
      Alta, reaches 1,857 m. The ridge culminates slightly further north at Punta di u Furnellu and Punta
      Muvrareccia, at 1,899 m, all dominated by Monte Incudine at 2,134 m. The massif is also the catchment of
      the Solenzara river, the traditional divide between northern and southern Corsica.


      The shape of the needles has a geological explanation. In Bavella two types of granite meet. One is
      coarse-grained, formed from a slow magma ascent; it is whitish and highly susceptible to erosion. The
      other, composed of very fine crystals with a pinkish cast, cooled rapidly and is exceedingly hard. That
      contrast, combined with tectonic uplift and weathering, explains the slender pinnacles and crags.
      Tafoni—cavities of varied shapes and sizes that honeycomb the rock upwards—give the cliffs their
      sponge-like appearance. Tafoni occur throughout Corsican rock, but reach their finest development in
      resistant granites.
    wildlife: >-
      The Corsican [mouflon](/especie/ovis_gmelini/) lives in these mountains, particularly in the reserves of
      Monte Cinto and Bavella. Today only two native populations remain in the Cinto and Bavella massifs,
      though since 2019 a third has been established by releasing animals in the Cagna massif. On the cliffs
      of Calanca Murata, in the commune of Conca, a biotope protection order safeguards the roosts and habitat
      of local bat colonies.
    visit: >-
      The GR 20 traverses the massif. Between Monte Incudine and the Col de Bavella, the classic route passes
      the Asinau refuge at 1,536 m and hugs the foot of the needles through the Rizzanese valley. An alpine
      variant cuts straight through the needles via the Bocca di u Pargulu at 1,662 m, descending toward Conca
      across the Foce Finosa and the Paliri refuge. Near the needles stand two refuges: Paliri, south of the
      needle of the same name, and Asinau, at the foot of Monte Incudine.


      From the Col de Bavella, trails also lead to the Trou de la Bombe (Tafonu di Cumpuleddu). For another
      excursion, the Purcaraccia stream—renowned for its cascading falls and emerald pools—tumbles down the
      massif toward the Solenzara river; the trail begins about 8 km down the D268 toward Sari-Solenzara. At
      the pass, just off the road, stands the statue of Notre-Dame-des-Neiges perched on a mound of stones.
      The Col de Bavella is one of the four major interior mountain passes connecting the two slopes of
      Corsica, and the southernmost of them.
    history: >-
      The massif forms part of the Regional Natural Park of Corsica, established in 1972, which encompasses
      the Cirque de Bavella and manages visitor footfall. It is additionally designated as a sensitive natural
      area, a Natura 2000 site, a classified site, and an inscribed site.
    before: >-
      Wild camping is strictly prohibited in the needles. The massif is lower than the Popolasca needles, but
      far more heavily frequented.
    around: >-
      The [Troodos National Forest Park](/lugar/troodos-national-forest-park/) shares high mountain
      landscapes, mature woodland, and wild mouflon with Bavella.
  fr:
    intro: >-
      Depuis le col de Bavella, à 1 218 mètres, l'horizon se hérisse de dents : pointes déchiquetées, immenses
      parois rocheuses et pins tourmentés par le vent. Ce sont les aiguilles de Bavella, cœur d'un massif du
      centre de la Corse qui relie l'Alta Rocca à la côte orientale. Ici, le granit n'est pas un décor
      d'arrière-plan : il occupe le premier rôle, façonné par la tectonique et l'érosion au point de
      ressembler à une éponge pétrifiée.
    landscape: >-
      Les sept tours d'Asinau constituent les aiguilles proprement dites, noyau du massif. La plus haute, la
      Punta Alta, culmine à 1 857 m. L'ensemble atteint son faîte un peu plus au nord, à la Punta di u
      Furnellu et à la Punta Muvrareccia, à 1 899 m, le tout dominé par le monte Incudine à 2 134 m. Le massif
      forme également le bassin versant de la Solenzara, limite traditionnelle entre le nord et le sud de la
      Corse.


      La silhouette des aiguilles trouve son explication dans la géologie. À Bavella coexistent deux types de
      granit. L'un, à gros grains, issu d'une lente montée magmatique, est blanchâtre et très vulnérable à
      l'érosion. L'autre, constitué de cristaux très fins et d'aspect rosé, a refroidi vite et se révèle d'une
      grande dureté. Ce contraste, combiné à la tectonique et aux intempéries, explique ces pitons et clochers
      si effilés. Les taffoni, cavités aux formes et dimensions très variées qui creusent la roche de bas en
      haut, lui confèrent cet aspect d'éponge. Les taffoni sont présents dans toute la roche corse, mais
      trouvent leur plus bel épanouissement dans les granits résistants.
    wildlife: >-
      Le [mouflon](/especie/ovis_gmelini/) corse hante ces montagnes, en particulier dans les réserves du
      Cinto et de Bavella. Seuls deux noyaux de population subsistent aujourd'hui dans les massifs du Cinto et
      de Bavella, et depuis 2019 un troisième a été fondé par des lâchers dans le massif de Cagna. Sur les
      falaises de Calanca Murata, sur le territoire de Conca, un arrêté de protection de biotope préserve
      l'espace vital des colonies de chauves-souris qui y nichent.
    visit: >-
      Le GR 20 traverse le massif. Entre le monte Incudine et le col de Bavella, le tracé passe par le refuge
      d'Asinau à 1 536 m et longe le pied des aiguilles par la vallée du Rizzanese. Une variante alpine
      franchit les aiguilles par la Bocca di u Pargulu à 1 662 m et descend vers Conca par la Foce Finosa et
      le refuge de Paliri. Deux refuges desservent les aiguilles : Paliri, au sud de l'aiguille éponyme, et
      Asinau, au pied du monte Incudine.


      Du col de Bavella part aussi le sentier menant au Trou de la Bombe (Tafonu di Cumpuleddu). Pour une
      autre randonnée, le ruisseau de Purcaraccia, réputé pour ses cascades et ses vasques, dévale le massif
      vers la Solenzara ; le chemin débute à environ 8 km sur la D268 en direction de Sari-Solenzara. Au col,
      à quelques mètres de la route, une statue de Notre-Dame-des-Neiges s'élève sur un monticule de pierres.
      Le col de Bavella compte parmi les quatre grands cols de Corse reliant les deux versants par
      l'intérieur, et c'est le plus méridional.
    history: >-
      Le massif appartient au Parc naturel régional de Corse, créé en 1972, qui englobe le cirque de Bavella
      et régule sa fréquentation. Il bénéficie en outre des statuts d'espace naturel sensible, de site Natura
      2000, de site classé et de site inscrit.
    before: >-
      Le bivouac est strictement interdit dans les aiguilles. Le massif est moins élevé que celui des
      aiguilles de Popolasca, mais beaucoup plus fréquenté.
    around: >-
      Le [Parc national forestier de Troodos](/lugar/troodos-national-forest-park/) partage avec Bavella la
      haute montagne, la forêt ancienne et le mouflon.
  de:
    intro: >-
      Vom Col de Bavella auf 1.218 Metern Höhe wirkt der Horizont wie eine gezackte Säge: schroffe Spitzen,
      gewaltige Felswände und vom Wind zerzauste Kiefern. Es sind die Aiguilles de Bavella, das Herzstück
      eines Massivs im Zentrum Korsikas, das die Alta Rocca mit der Ostküste verbindet. Hier ist der Granit
      keine Kulisse: Er spielt die Hauptrolle, geformt von Tektonik und Verwitterung, bis er wie ein
      versteinertes Schwammwerk anmutet.
    landscape: >-
      Die sieben Türme von Asinau bilden die eigentlichen Felsnadeln, den Kern des Massivs. Der höchste Turm,
      Punta Alta, erreicht 1.857 m. Das Ensemble gipfelt etwas weiter nördlich an der Punta di u Furnellu und
      der Punta Muvrareccia auf 1.899 m, überragt vom Monte Incudine mit 2.134 m. Das Massiv bildet zugleich
      das Einzugsgebiet des Flusses Solenzara, der traditionellen Grenze zwischen Nord- und Südkorsika.


      Die Gestalt der Nadeln hat eine geologische Ursache. In Bavella treffen zwei Granitarten aufeinander.
      Die eine ist grobkörnig, entstand durch sehr langsamen Magmaaufstieg, ist weißlich und sehr
      verwitterungsanfällig. Die andere besteht aus feinsten Kristallen, schimmert rötlich, kühlte rasch ab
      und ist extrem hart. Dieser Unterschied erklärt zusammen mit Tektonik und Erosion die schlanken Türme
      und Felszacken. Tafoni – Hohlräume unterschiedlichster Form und Größe, die den Fels von unten nach oben
      zersetzen – verleihen ihm das schwammartige Aussehen. Tafoni kommen in ganz Korsika vor, erreichen aber
      in den widerstandsfähigen Graniten ihre vollendetste Form.
    wildlife: >-
      Der korsische [Mufflon](/especie/ovis_gmelini/) lebt in diesen Bergen, vor allem in den Schutzgebieten
      des Cinto und von Bavella. Heute gibt es nur noch zwei Bestände in den Massiven des Cinto und von
      Bavella; seit 2019 entstand durch Auswilderungen im Cagna-Massiv eine dritte Population. An den
      Steilwänden der Calanca Murata auf dem Gebiet von Conca schützt eine Biotopschutzzone den Lebensraum der
      dort nistenden Fledermauskolonien.
    visit: >-
      Der GR 20 durchquert das Massiv. Zwischen dem Monte Incudine und dem Col de Bavella führt die klassische
      Route an der Asinau-Hütte auf 1.536 m vorbei und verläuft am Fuß der Nadeln durch das Rizzanese-Tal.
      Eine alpine Variante schneidet direkt über die Bocca di u Pargulu auf 1.662 m durch die Felsnadeln und
      steigt über die Foce Finosa und die Paliri-Hütte nach Conca ab. Nahe den Nadeln liegen zwei Hütten:
      Paliri südlich der gleichnamigen Spitze und Asinau am Fuß des Monte Incudine.


      Vom Col de Bavella startet auch der Pfad zum Trou de la Bombe (Tafonu di Cumpuleddu). Für eine weitere
      Wanderung folgt man dem Purcaraccia-Bach mit seinen Kaskaden und Felsenbecken hinab zur Solenzara; der
      Weg beginnt rund 8 km weiter an der D268 Richtung Sari-Solenzara. Am Pass steht wenige Meter neben der
      Straße auf einem Steinhaufen die Statue Notre-Dame-des-Neiges. Der Col de Bavella ist einer der vier
      großen korsischen Gebirgspässe, die beide Inselseiten über das Landesinnere verbinden, und der
      südlichste von ihnen.
    history: >-
      Das Massiv gehört zum 1972 gegründeten Regionalen Naturpark Korsika, der den Talkessel von Bavella
      umfasst und den Besucherdruck regelt. Es ist zudem als sensibles Naturgebiet, Natura 2000-Gebiet,
      klassifizierte und eingetragene Stätte geschützt.
    before: >-
      Campen ist in den Felsnadeln streng verboten. Das Massiv ist niedriger als jenes der Popolasca-Nadeln,
      aber ungleich stärker besucht.
    around: >-
      Der [Troodos-Nationalwaldpark](/lugar/troodos-national-forest-park/) teilt mit Bavella
      Hochgebirgslandschaften, alte Bergwälder und Mufflonvorkommen.
  it:
    intro: >-
      Dal colle di Bavella, a 1.218 metri, l'orizzonte si popola di denti: picchi aguzzi, grandi muraglie di
      roccia e pini contorti dal vento. Sono le guglie di Bavella, cuore di un massiccio della Corsica
      centrale che raccorda l'Alta Rocca al litorale orientale. Qui il granito non fa da sfondo: è il
      protagonista assoluto, lavorato dalla tettonica e dall'erosione fino ad assumere la consistenza di una
      spugna pietrificata.
    landscape: >-
      Le sette torri di Asinau formano le guglie vere e proprie, il nucleo del massiccio. La più elevata,
      Punta Alta, raggiunge 1.857 m. Il gruppo culmina poco più a nord a Punta di u Furnellu e Punta
      Muvrareccia, a 1.899 m, ed è dominato dal Monte Incudine a 2.134 m. Il massiccio accoglie anche il
      bacino del fiume Solenzara, storico confine tra la Corsica settentrionale e meridionale.


      La conformazione delle guglie poggia su una precisa ragione geologica. A Bavella si incontrano due tipi
      di granito. Uno a grana grossa, nato da una risalita magmatica molto lenta, biancastro e assai friabile
      all'erosione. L'altro, composto da cristalli finissimi e dall'aspetto rosato, si è raffreddato
      rapidamente ed è tenace. Questo contrasto, unito alla tettonica e all'azione atmosferica, plasma guglie
      e pinnacoli così slanciati. I tafoni, cavità di molteplici forme e dimensioni che intaccano la roccia
      dal basso verso l'alto, le conferiscono l'aspetto spugnoso. I tafoni sono diffusi su tutta la roccia
      corsa, ma trovano la loro massima espressione nei graniti più compatti.
    wildlife: >-
      Il [muflone](/especie/ovis_gmelini/) corso abita queste montagne, specialmente nelle riserve del Cinto e
      di Bavella. Oggi sopravvivono solo due popolazioni storiche nei massicci del Cinto e di Bavella, e dal
      2019 ne è nata una terza rilasciando esemplari nel massiccio di Cagna. Sulle falesie di Calanca Murata,
      nel territorio di Conca, una zona di protezione del biotopo tutela l'habitat delle colonie di
      pipistrelli.
    visit: >-
      Il GR 20 attraversa il massiccio. Tra il Monte Incudine e il colle di Bavella il tracciato tocca il
      rifugio di Asinau a 1.536 m e lambisce la base delle guglie lungo la valle del Rizzanese. Una variante
      alpina scavalca le guglie attraverso la Bocca di u Pargulu a 1.662 m e scende verso Conca passando per
      Foce Finosa e il rifugio di Paliri. Due rifugi servono le guglie: quello di Paliri, a sud dell'omonima
      guglia, e quello di Asinau, ai piedi del Monte Incudine.


      Dal colle di Bavella prende avvio anche il sentiero verso il Trou de la Bombe o Tafonu di Cumpuleddu.
      Per un'altra escursione, il torrente Purcaraccia, celebre per cascate e pozze smeraldine, scende dal
      massiccio verso il Solenzara; l'itinerario comincia circa 8 km più a valle lungo la D268 verso
      Sari-Solenzara. Sul colle, a pochi passi dalla carreggiata, una statua di Notre-Dame-des-Neiges poggia
      su un cumulo di pietre. Il colle di Bavella è uno dei quattro grandi valichi corsi che uniscono i due
      versanti attraverso l'interno, ed è il più meridionale.
    history: >-
      Il massiccio appartiene al Parco Naturale Regionale della Corsica, istituito nel 1972, che racchiude il
      circo di Bavella e ne governa l'affluenza. È inoltre classificato come spazio naturale sensibile, sito
      Natura 2000, sito classificato e sito iscritto.
    before: >-
      Il campeggio libero è severamente vietato nelle guglie. Il massiccio è più basso delle guglie di
      Popolasca, ma nettamente più frequentato.
    around: >-
      Il [Parco forestale nazionale di Troodos](/lugar/troodos-national-forest-park/) condivide con Bavella
      l'alta montagna, i boschi vetusti e la presenza del muflone.
  pt:
    intro: >-
      A partir do desfiladeiro de Col de Bavella, a 1.218 metros, o horizonte enche-se de dentes: cristas
      laceradas, grandes muralhas de rocha e pinheiros retorcidos pelo vento. São as agulhas de Bavella, o
      coração de um maciço da Córsega central que liga a Alta Rocca ao litoral leste. Aqui o granito não é um
      cenário de fundo: assume o papel principal, esculpido pela tectónica e pela erosão até se assemelhar a
      uma esponja petrificada.
    landscape: >-
      As sete torres de Asinau formam as agulhas propriamente ditas, o núcleo do maciço. A mais alta, Punta
      Alta, alcança 1.857 m. O conjunto culmina um pouco mais a norte, na Punta di u Furnellu e na Punta
      Muvrareccia, a 1.899 m, ficando dominado pelo Monte Incudine, com 2.134 m. O maciço acolhe igualmente a
      bacia hidrográfica do rio Solenzara, a fronteira histórica entre o norte e o sul da Córsega.


      A silhueta das agulhas tem uma explicação geológica. Em Bavella convivem dois tipos de granito. Um de
      grão grosseiro, originado por uma subida magmática muito lenta, esbranquiçado e muito sensível à erosão.
      O outro, composto por cristais muito finos e de tom rosado, arrefeceu depressa e revela-se extremamente
      duro. Esse contraste, aliado à tectónica e ao desgaste natural, explica os pináculos e torres tão
      esbeltos. Os tafoni, cavidades de formas e tamanhos variados que escavam a rocha de baixo para cima,
      conferem-lhe a textura esponjosa. Os tafoni ocorrem em toda a rocha corsa, mas encontram o seu melhor
      desenvolvimento nos granitos resistentes.
    wildlife: >-
      O [muflão](/especie/ovis_gmelini/) corso vive nestas montanhas, sobretudo nas reservas do Cinto e de
      Bavella. Restam hoje apenas dois núcleos populacionais nos maciços do Cinto e de Bavella, tendo sido
      estabelecido em 2019 um terceiro através da libertação de exemplares no maciço de Cagna. Nas arribas de
      Calanca Murata, no termo municipal de Conca, uma zona de proteção de biótopo salvaguarda o habitat das
      colónias de morcegos.
    visit: >-
      O GR 20 atravessa o maciço. Entre o Monte Incudine e o desfiladeiro de Col de Bavella, o traçado passa
      pelo refúgio de Asinau a 1.536 m e contorna a base das agulhas pelo vale do Rizzanese. Uma variante
      alpina cruza as agulhas pela Bocca di u Pargulu a 1.662 m e desce rumo a Conca pela Foce Finosa e pelo
      refúgio de Paliri. Perto das agulhas erguem-se dois refúgios: o de Paliri, a sul da agulha com o mesmo
      nome, e o de Asinau, no sopé do Monte Incudine.


      Do desfiladeiro de Bavella parte também o trilho para o Trou de la Bombe ou Tafonu di Cumpuleddu. Para
      outro passeio, o ribeiro de Purcaraccia, famoso pelas suas cascatas e lagoas, desce pelo maciço em
      direção ao rio Solenzara; o percurso começa a cerca de 8 km pela D268 rumo a Sari-Solenzara. No
      desfiladeiro, a escassos metros da estrada, uma estátua de Notre-Dame-des-Neiges ergue-se sobre um monte
      de pedras. O Col de Bavella é um dos quatro grandes passos de montanha da Córsega que unem as duas
      vertentes pelo interior, sendo o mais meridional.
    history: >-
      O maciço pertence ao Parque Natural Regional da Córsega, criado em 1972, que abrange o circo de Bavella
      e regula a sua afluência. É também espaço natural sensível, sítio Natura 2000, sítio classificado e
      sítio inscrito.
    before: >-
      Acampar é estritamente proibido nas agulhas. O maciço é mais baixo do que o das agulhas de Popolasca,
      mas muito mais frequentado.
    around: >-
      O [Parque Florestal Nacional de Troodos](/lugar/troodos-national-forest-park/) partilha com Bavella a
      alta montanha, o arvoredo maduro e as populações de muflão.
