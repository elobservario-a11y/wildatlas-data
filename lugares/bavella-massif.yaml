resumen:
  es: >-
    Muro de torres y agujas de granito rojo esculpidas en formas fantásticas (*taffoni*) rodeadas de pino
    laricio corsó.
  en: >-
    A wall of red granite towers and pinnacles weathered into surreal hollow forms (*taffoni*), framed by
    Corsican black pine.
  fr: >-
    Mur de tours et d'aiguilles de granit rouge sculptées de formes fantastiques (*taffoni*), ceint de pins
    laricio.
  de: >-
    Eine Wand aus roten Granittürmen und Felsnadeln mit bizarren Verwitterungshöhlungen (*Tafoni*), umgeben
    von Schwarzkiefern.
  it: >-
    Muraglia di torri e guglie di granito rosso scolpite in forme singolari (*taffoni*), circondate da pini
    larici.
  pt: >-
    Muralha de torres e agulhas de granito vermelho esculpidas em formas singulares (*taffoni*), rodeadas por
    pinheiro-larício.
