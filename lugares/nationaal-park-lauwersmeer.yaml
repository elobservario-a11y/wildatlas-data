resumen:
  es: >-
    Antiguo fiordo salobre cerrado al mar en 1969 transformado en un humedal de agua dulce de valor
    ornitológico estelar.
  en: >-
    A former brackish sea inlet dammed off in 1969, transformed into a freshwater wetland of outstanding
    ornithological value.
  fr: >-
    Ancien bras de mer saumâtre endigué en 1969, devenu une zone humide d'eau douce d'une valeur
    ornithologique remarquable.
  de: >-
    Eine 1969 eingedeichte ehemalige Meeresbucht, die sich in ein Süßwasserfeuchtgebiet von herausragendem
    Vogelreichtum verwandelte.
  it: >-
    Un antico golfo salmastro sbarrato al mare nel 1969, trasformatosi in una zona umida d'acqua dolce di
    valore ornitologico eccezionale.
  pt: >-
    Antigo braço de mar salobro encerrado em 1969 e transformado numa zona húmida de água doce de
    extraordinário valor ornitológico.
unico:
  es: Un fondo de mar convertido en refugio de aves y en el segundo Dark Sky Park de Países Bajos.
  en: >-
    A former seabed turned into a thriving bird haven and the second official Dark Sky Park in the
    Netherlands.
  fr: Un ancien fond marin métamorphosé en havre d'oiseaux et en deuxième Dark Sky Park des Pays-Bas.
  de: >-
    Ein trockengefallener Meeresboden als Zuflucht unzähliger Vögel und zweiter offizieller Dark Sky Park der
    Niederlande.
  it: Un fondale marino divenuto rifugio avifaunistico e secondo Dark Sky Park ufficiale dei Paesi Bassi.
  pt: >-
    Um antigo fundo marinho convertido em santuário de aves e no segundo Dark Sky Park oficial dos Países
    Baixos.
observaciones:
  es: >-
    Estas son las reglas que importan: grandes zonas del parque no son accesibles, así que cíñete a los
    caminos marcados; en la Konijnenroute no entran perros; y en la ruta Dark Sky no se usa linterna. La
    temporada de abril a octubre es la más cómoda, y en otoño merece la pena por las setas.
texto:
  es:
    intro: >-
      Hasta 1969 esto era mar. Cuando se cerró el Lauwersmeer, el antiguo fondo marino quedó en seco, y
      aquella tierra recién emergida se convirtió, con los años, en un parque nacional de unos 60 km² en el
      norte de Países Bajos. De día es un sitio para mirar aves; de noche, para tumbarse en una plataforma y
      mirar las estrellas.


      Es uno de los veintiún parques nacionales del país y una zona de transición entre el mar de Frisia y la
      naturaleza de Groninga, Frisia y Drenthe. Desde 2016 es además un Dark Sky Park reconocido por la
      International Dark Sky Association.
    landscape: >-
      Lo primero que llama la atención es la ausencia de gente. En el Lauwersmeergebied casi no vive nadie, y
      eso explica el cielo. El paisaje es abierto: tierra llana, agua y cielo, con el bosque Ballastplaatbos
      al norte y el Zomerhuisbos al sur.


      La naturaleza llegó casi sola. En los primeros años grandes zonas se dejaron a su suerte, y así surgió
      mucha naturaleza, sobre todo al este de la carretera de Zoutkamp a Lauwersoog. Hoy hay lugares con
      nombre propio: el Land van juffrouw Ali, al sur de Lauwersoog, es un rincón con muchas orquídeas. Y hay
      otros que son para las aves y no para la gente: grandes partes de la Ballastplaat, la Rug, la
      Sennerplaat y otras zonas no son accesibles.
    wildlife: >-
      Aquí la migración marca la vida del lago dos veces al año. A finales del verano la oropéndola, la
      avoceta y la espátula parten, y vuelven en primavera. El Lauwersmeer ofrece a las aves lo esencial:
      alimento suficiente y, sobre todo, tranquilidad.


      A comienzos de primavera regresa la avoceta; el parque es refugio de aves como el halcón peregrino, la
      aguja colipinta y la [espátula común](/especie/platalea_leucorodia/). En invierno se quedan muchos
      gansos, y en Ezumakeeg hay una cabaña de observación. Muchas rutas son de tierra sin asfaltar y hay una
      red amplia de carriles bici.


      En otoño los bosques acogen muchas setas singulares. Y entre los grandes herbívoros está el caballo
      konik, que con suerte se cruza en el sur del Ballastplaatbos, y las vacas Highland escocesas. De noche,
      la protagonista es la oscuridad.
    visit: >-
      El Lauwersnest es un buen punto de partida. Lo atienden voluntarios que informan de los mejores lugares
      y de las novedades de la naturaleza; proyecta cortometrajes y desde él sale un sendero natural de 1,5 km
      con preguntas y tareas por el camino.


      Las rutas son cortas y variadas. La Duindoornroute mide 3 km y sale del aparcamiento del restaurante Het
      Booze Wijf. La Orchideeënroute, también de 3 km, pasa junto a una cabaña de observación y campos de
      orquídeas, camino del terreno militar. La Vogelroute recorre 4,8 km entre carrizal, pradera y bosque, y
      se recomiendan botas. La Observatietorenroute, de 5,6 km, cruza el Ballastplaatbos y pasa por una pared
      de aviones zapadores y una torre mirador. La Konijnenroute mide 3,3 km por el sur del Ballastplaatbos y
      los perros no pueden entrar. Para los más resistentes está la ruta circular Lauwersmeer, de 43 km, que
      une nodos de senderismo y ciclismo.


      Y para la noche, tres propuestas: el Planetenpad, con maquetas a escala del sistema solar, explica
      estrellas, planetas y contaminación lumínica; el Dark Sky Pad se recorre de noche siguiendo flechas
      luminiscentes, sin linterna, y con un poco de suerte se ve la Vía Láctea; y desde las plataformas
      celestes puedes mirar las estrellas tumbado.
    history: >-
      La historia del Lauwersmeer cabe en dos fechas. En 1969 se cerró y el fondo marino emergió. En 2016 la
      International Dark Sky Association lo declaró segundo Dark Sky Park de Países Bajos, tras Boschplaat. Un
      Dark Sky Park es un lugar donde se conserva la oscuridad y se invita a los visitantes a vivir la noche;
      aquí la clave es que casi no hay luz artificial, algo raro en un país muy iluminado.
    before: >-
      Estas son las reglas que importan: grandes zonas del parque no son accesibles, así que cíñete a los
      caminos marcados; en la Konijnenroute no entran perros; y en la ruta Dark Sky no se usa linterna. La
      temporada de abril a octubre es la más cómoda, y en otoño merece la pena por las setas.
    around: >-
      A dos kilómetros, las [Marismas Saladas del Mar de Frisia (Sector
      Neerlandés)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) completan el paisaje costero. Más
      lejos, el [Parque Nacional del Delta del Evros](/lugar/ethniko-parko-delta-evrou/) y el [Parque Nacional
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) comparten con el Lauwersmeer la espátula común y el
      pigargo europeo.
  en:
    intro: >-
      Until 1969 this was open sea. When the Lauwersmeer was enclosed by a dike, the former seabed fell dry,
      and over the decades that newly emerged land evolved into a national park covering roughly 60 km² in the
      north of the Netherlands. By day it is a premier birdwatching destination; by night, a secluded haven to
      lie on a stargazing platform and watch the night sky.


      It is one of twenty-one national parks across the country, serving as an ecological stepping stone
      between the Wadden Sea and the countryside of Groningen, Friesland and Drenthe. In 2016 it was
      officially certified as a Dark Sky Park by the International Dark Sky Association.
    landscape: >-
      The first impression is the striking absence of people. Hardly anyone lives in the Lauwersmeergebied,
      which directly accounts for its pristine nocturnal darkness. The landscape is open and vast: flat
      plains, tranquil water and open sky, flanked by the Ballastplaatbos woodland to the north and the
      Zomerhuisbos to the south.


      Nature recolonised the land almost unassisted. In the early years, extensive tracts were left to
      spontaneous ecological succession, allowing diverse wild habitats to develop, particularly east of the
      road between Zoutkamp and Lauwersoog. Today specific corners are well known: the Land van juffrouw Ali,
      south of Lauwersoog, is renowned for its wild orchids. Other areas are reserved strictly for wildlife:
      large sectors of the Ballastplaat, the Rug, the Sennerplaat and other reserves remain closed to the
      public.
    wildlife: >-
      Bird migration orchestrates the seasonal pulse of the lake twice a year. In late summer, golden orioles,
      pied avocets and Eurasian spoonbills depart, only to return in spring. The Lauwersmeer provides birds
      with essential sanctuary: abundant food and, above all, disturbance-free tranquillity.


      Early in spring the avocets return; the park serves as a vital refuge for birds such as the peregrine
      falcon, bar-tailed godwit and the [Eurasian spoonbill](/especie/platalea_leucorodia/). Thousands of
      geese overwinter here, with a dedicated observation hide situated at Ezumakeeg. Many trails are unpaved
      dirt tracks alongside an extensive network of cycling paths.


      In autumn, the surrounding woodlands boast a remarkable variety of unusual fungi. Large herbivores
      include free-ranging Konik horses, occasionally encountered in the south of the Ballastplaatbos,
      alongside grazing Scottish Highland cattle. After dusk, deep natural darkness takes centre stage.
    visit: >-
      The Lauwersnest visitor centre is an ideal starting hub. Run by welcoming volunteers who provide
      wildlife updates and trail recommendations, it screens nature films and marks the start of a 1.5 km
      nature educational trail with quiz checkpoints.


      Walking trails are varied and manageable. The Duindoornroute measures 3 km, departing from the Het Booze
      Wijf restaurant car park. The Orchideeënroute, also 3 km, leads past an observation blind and
      orchid-rich meadows toward military grounds. The Vogelroute covers 4.8 km through reedbeds, grasslands
      and scrub, where sturdy waterproof boots are advised. The Observatietorenroute spans 5.6 km across the
      Ballastplaatbos, passing a sand martin nesting wall and a panoramic observation tower. The Konijnenroute
      covers 3.3 km through the southern Ballastplaatbos, where dogs are prohibited. For endurance hikers, the
      43 km Lauwersmeer circular route connects regional walking and cycling trail junctions.


      For the night hours, three experiences stand out: the Planetenpad, featuring a scale model of the solar
      system explaining planets and light pollution; the Dark Sky Pad, followed at night via luminescent guide
      arrows without torches, where you might glimpse the Milky Way; and purpose-built sky platforms where you
      can recline beneath the starry sky.
    history: >-
      The history of the Lauwersmeer hinges on two landmark dates. In 1969 the enclosing sea dyke was
      completed, exposing the former marine floor. In 2016 the International Dark Sky Association designated
      it the second Dark Sky Park in the Netherlands, following the Boschplaat on Terschelling. A Dark Sky
      Park protects natural nocturnal darkness and welcomes visitors to experience the night; the key is the
      absence of artificial lighting, an exceptional quality in a densely populated nation.
    before: >-
      Keep the following core rules in mind: large core areas of the park are strictly off-limits to visitors,
      so remain on designated paths; dogs are forbidden on the Konijnenroute; and torches must not be used
      along the Dark Sky Pad. April through October offers the most pleasant conditions, while autumn is
      rewarding for mushroom enthusiasts.
    around: >-
      Two kilometres away, the [Wadden Sea Salt Marshes (Dutch
      Sector)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) extend the coastal tidal landscape.
      Farther away, the [Evros Delta National Park](/lugar/ethniko-parko-delta-evrou/) and [Körös-Maros
      National Park](/lugar/koros-maros-nemzeti-park/) share with Lauwersmeer the Eurasian spoonbill and
      white-tailed eagle.
  fr:
    intro: >-
      Jusqu'en 1969, ce territoire appartenait à la mer. Lorsque le Lauwersmeer fut fermé par une digue,
      l'ancien plancher marin s'assécha, et cette terre nouvellement émergée devint avec les années un parc
      national d'environ 60 km² dans le nord des Pays-Bas. De jour, c'est un observatoire ornithologique
      privilégié ; de nuit, on s'allonge sur une plate-forme pour contempler le ciel étoilé.


      Il fait partie des vingt et un parcs nationaux du pays et constitue une passerelle écologique entre la
      mer des Wadden et les paysages de Groningue, de Frise et de Drenthe. Depuis 2016, il bénéficie en outre
      du label Dark Sky Park décerné par l'International Dark Sky Association.
    landscape: >-
      La première impression est celle d'une singulière absence humaine. Le Lauwersmeergebied est presque
      inhabité, ce qui explique la pureté de son ciel nocturne. Le paysage est très ouvert : horizons plats,
      vastes plans d'eau et ciel infini, encadrés au nord par le bois du Ballastplaatbos et au sud par le
      Zomerhuisbos.


      La nature s'est installée presque spontanément. Durant les premières décennies, de vastes espaces furent
      laissés en libre évolution, favorisant l'essor d'une riche biodiversité, notamment à l'est de la route
      reliant Zoutkamp à Lauwersoog. Aujourd'hui, certains secteurs sont réputés : le Land van juffrouw Ali,
      au sud de Lauwersoog, regorge d'orchidées sauvages. D'autres zones demeurent strictement réservées aux
      oiseaux et inaccessibles au public, comme la Ballastplaat, la Rug ou la Sennerplaat.
    wildlife: >-
      La migration rythme la vie du lac deux fois l'an. À la fin de l'été, loriots, avocettes élégantes et
      spatules blanches prennent leur envol pour revenir au printemps. Le Lauwersmeer offre aux migrateurs
      l'essentiel : une nourriture abondante et, surtout, une quiétude préservée.


      Au début du printemps réapparaît l'avocette ; le parc sert de refuge au faucon pèlerin, à la barge
      rousse et à la [spatule blanche](/especie/platalea_leucorodia/). En hiver, d'immenses rassemblements
      d'oies stationnent sur le plan d'eau, observables depuis l'affût d'Ezumakeeg. De nombreuses pistes de
      terre et un vaste réseau cyclable sillonnent les abords.


      À l'automne, les sous-bois abritent une remarquable diversité mycologique. Parmi les grands herbivores
      pâturent des chevaux koniks, parfois aperçus au sud du Ballastplaatbos, et des vaches Highland d'Écosse.
      La nuit tombée, l'obscurité absolue devient la véritable attraction.
    visit: >-
      Le pavillon d'accueil Lauwersnest est un excellent point de départ. Animé par des bénévoles qui
      partagent observations naturalistes et conseils de visite, il propose des projections et un sentier
      nature de 1,5 km jalonné d'énigmes interactives.


      Les circuits pédestres sont variés. La Duindoornroute fait 3 km au départ du parking du restaurant Het
      Booze Wijf. L'Orchideeënroute, également de 3 km, côtoie un observatoire et des prairies fleuries
      d'orchidées vers le terrain militaire. La Vogelroute parcourt 4,8 km entre roselières, prairies humides
      et bosquets, praticable avec de bonnes chaussures. L'Observatietorenroute s'étire sur 5,6 km à travers
      le Ballastplaatbos, longeant une falaise à hirondelles de rivage et une tour panoramique. La
      Konijnenroute propose 3,3 km au sud du Ballastplaatbos, fermée aux chiens. Pour les plus endurants, la
      boucle cycliste et pédestre du Lauwersmeer totalise 43 km en reliant le réseau de nœuds de promenade.


      À la nuit tombée, trois expériences s'offrent à vous : le Planetenpad, modèle réduit du système solaire
      sensibilisant à la pollution lumineuse ; le Dark Sky Pad, chemin nocturne guidé par des balises
      fluorescentes sans lampe torche sous la Voie lactée ; et des plates-formes de contemplation céleste pour
      observer les constellations allongé.
    history: >-
      L'histoire du Lauwersmeer tient en deux grandes dates. En 1969, la digue maritime fut close et les fonds
      marins émergèrent. En 2016, l'International Dark Sky Association en fit le deuxième Dark Sky Park des
      Pays-Bas, après le Boschplaat à Terschelling. Un Dark Sky Park préserve l'obscurité naturelle et invite
      les visiteurs à redécouvrir la nuit ; ici, l'absence presque totale d'éclairage artificiel constitue une
      rareté dans un pays densément urbanisé.
    before: >-
      Quelques règles essentielles : de vastes secteurs du parc sont interdits d'accès pour protéger la faune,
      restez scrupuleusement sur les sentiers balisés ; les chiens sont interdits sur la Konijnenroute ; et
      l'usage de lampes de poche est proscrit sur le sentier Dark Sky. La période d'avril à octobre est la
      plus agréable, l'automne valant le détour pour la fonge.
    around: >-
      À deux kilomètres, les [marais salés de la mer des Wadden (secteur
      néerlandais)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) prolongent l'écosystème littoral.
      Plus loin, le [parc national du delta de l'Évros](/lugar/ethniko-parko-delta-evrou/) et le [parc
      national de Körös-Maros](/lugar/koros-maros-nemzeti-park/) partagent avec le Lauwersmeer la spatule
      blanche et le pygargue à queue blanche.
  de:
    intro: >-
      Bis 1969 brandete hier das Meer. Als das Lauwersmeer durch einen Deich vom Wattenmeer abgeriegelt wurde,
      fiel der Meeresgrund trocken, und das neugewonnene Land entwickelte sich über die Jahrzehnte zu einem
      rund 60 km² großen Nationalpark im Norden der Niederlande. Tagsüber lädt das Areal zur Vogelbeobachtung
      ein; nachts legst du dich auf eine Himmelsplattform und blickst in die funkelnden Sterne.


      Das Gebiet zählt zu den einundzwanzig Nationalparks des Landes und bildet ein wichtiges Bindeglied
      zwischen dem Wattenmeer und den Naturlandschaften von Groningen, Friesland und Drenthe. Seit 2016 ist es
      von der International Dark Sky Association als Dark Sky Park zertifiziert.
    landscape: >-
      Das Erste, was auffällt, ist die Stille und die Abwesenheit von Menschen. Im Lauwersmeergebiet wohnt
      kaum jemand, was die außergewöhnliche Dunkelheit der Nächte erklärt. Das Landschaftsbild ist weit und
      offen: flaches Land, Wasserflächen und weiter Horizont, gesäumt vom Ballastplaatbos im Norden und dem
      Zomerhuisbos im Süden.


      Die Natur eroberte das Neuland weitgehend aus eigener Kraft. In den Anfangsjahren überließ man große
      Areale der freien Sukzession, wodurch besonders östlich der Straße von Zoutkamp nach Lauwersoog
      vielfältige Naturräume entstanden. Heute tragen besondere Ecken klangvolle Namen: Das Land van juffrouw
      Ali südlich von Lauwersoog ist für seine Orchideenwiesen berühmt. Andere Teile gehören allein den
      Tieren: Ausgedehnte Abschnitte der Ballastplaat, der Rug, der Sennerplaat und weiterer Zonen sind für
      Besucher unzugänglich.
    wildlife: >-
      Der Vogelzug prägt das Leben am See zweimal im Jahr. Im Spätsommer ziehen Pirol, Säbelschnäbler und
      Löffler gen Süden, um im Frühling zurückzukehren. Das Lauwersmeer bietet Vögeln das Lebensnotwendige:
      reichhaltige Nahrung und vor allem ungestörte Rastplätze.


      Zu Frühlingsbeginn kehrt der Säbelschnäbler zurück; der Park dient Wanderfalken, Pfuhlschnepfen und dem
      [Löffler](/especie/platalea_leucorodia/) als wertvolles Rastrevier. Im Winter rasten tausende Gänse, die
      sich von einer Beobachtungshütte bei Ezumakeeg beobachten lassen. Ein weitverzweigtes Netz unbefestigter
      Wanderwege und Radpfade erschließt das Gelände.


      Im Herbst sprießen in den Wäldern bemerkenswerte Pilzarten. Unter den Großsäugern streifen
      Konik-Wildpferde durch den Süden des Ballastplaatbos, unterstützt von weidenden Schottischen
      Hochlandrindern. Nachts übernimmt die unberührte Finsternis die Hauptrolle.
    visit: >-
      Das Besucherzentrum Lauwersnest bietet den besten Einstieg. Ehrenamtliche Mitarbeiter informieren über
      aktuelle Naturbeobachtungen, zeigen Naturfilme und betreuen einen 1,5 km langen Naturerlebnispfad mit
      Mitmachstationen.


      Die Wanderrouten sind kurz und abwechslungsreich. Die Duindoornroute ist 3 km lang und beginnt am
      Restaurant Het Booze Wijf. Die Orchideeënroute, ebenfalls 3 km, führt an einer Beobachtungshütte und
      Orchideenwiesen vorbei in Richtung Militärgelände. Die Vogelroute verläuft über 4,8 km durch
      Schilfzonen, Feuchtwiesen und Gehölze; festes Schuhwerk ist ratsam. Die Observatietorenroute misst 5,6
      km durch den Ballastplaatbos und passiert eine Uferschwalbenwand sowie einen Aussichtsturm. Die
      Konijnenroute führt über 3,3 km durch den südlichen Ballastplaatbos und ist für Hunde gesperrt. Für
      ausdauernde Wanderer bietet der 43 km lange Rundweg Lauwersmeer Anschluss an das Rad- und
      Wanderknotenpunktsystem.


      Für die Nachtstunden stehen drei Attraktionen bereit: der Planetenpad mit einem maßstabsgetreuen Modell
      des Sonnensystems, der Dark Sky Pad mit fluoreszierenden Leitpfeilen ohne Taschenlampe unter der
      Milchstraße sowie Beobachtungsplattformen, auf denen du liegend den Nachthimmel bewunderst.
    history: >-
      Die Geschichte des Lauwersmeeres lässt sich an zwei Jahreszahlen festmachen. 1969 wurde der
      Abschlussdeich vollendet und der Seeboden trat zutage. 2016 ernannte die International Dark Sky
      Association das Gebiet zum zweiten Dark Sky Park der Niederlande nach De Boschplaat auf Terschelling.
      Ein Dark Sky Park schützt die natürliche Finsternis und lädt dazu ein, die Nacht unverfälscht zu erleben
      – ein seltener Schatz im dicht besiedelten Land.
    before: >-
      Folgende Regeln sind zu beachten: Große Teile des Parks sind streng geschützte Ruhezonen und dürfen
      nicht betreten werden; auf der Konijnenroute sind Hunde verboten; und auf dem Dark Sky Pad sind
      Taschenlampen untersagt. Die Monate April bis Oktober sind am angenehmsten, der Herbst lockt mit
      Pilzreichtum.
    around: >-
      Zwei Kilometer entfernt setzen die [Wattenmeer-Salzwiesen (niederländischer
      Sektor)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) die Küstenlandschaft fort. Weiter
      entfernt teilen der [Nationalpark Evros-Delta](/lugar/ethniko-parko-delta-evrou/) und der
      [Körös-Maros-Nationalpark](/lugar/koros-maros-nemzeti-park/) mit dem Lauwersmeer Löffler und Seeadler.
  it:
    intro: >-
      Fino al 1969 quest'area era mare aperto. Quando il Lauwersmeer venne sbarrato da una diga, l'antico
      fondale rimase all'asciutto e quella terra emersa si è trasformata, con gli anni, in un parco nazionale
      di circa 60 km² nel nord dei Paesi Bassi. Di giorno è un paradiso per il birdwatching; di notte, un
      luogo dove sdraiarsi su una piattaforma a contemplare la volta celeste.


      È uno dei ventuno parchi nazionali del paese e funge da corridoio ecologico tra il mare dei Wadden e la
      natura di Groninga, Frisia e Drenthe. Dal 2016 è inoltre riconosciuto come Dark Sky Park
      dall'International Dark Sky Association.
    landscape: >-
      La prima impressione è la quasi totale assenza di insediamenti. Nel Lauwersmeergebied non risiede quasi
      nessuno, ed è proprio questo a garantire l'oscurità del cielo. Il paesaggio è vasto e arioso: pianure
      aperte, specchi d'acqua e orizzonti infiniti, incorniciati a nord dal bosco di Ballastplaatbos e a sud
      dal Zomerhuisbos.


      La natura si è insediata in modo spontaneo. Nei primi anni vasti settori furono lasciati alla libera
      evoluzione ecologica, favorendo habitat rigogliosi soprattutto a est della strada tra Zoutkamp e
      Lauwersoog. Oggi molte zone hanno nomi celebri: il Land van juffrouw Ali, a sud di Lauwersoog, è un
      angolo rinomato per le orchidee selvatiche. Altre aree sono invece riservate esclusivamente agli
      uccelli: ampie porzioni della Ballastplaat, della Rug, della Sennerplaat e di altre riserve non sono
      accessibili al pubblico.
    wildlife: >-
      La migrazione scandisce la vita del lago due volte all'anno. Verso la fine dell'estate rigogoli,
      avocette e spatole partono verso sud per poi fare ritorno in primavera. Il Lauwersmeer assicura agli
      uccelli l'essenziale: cibo abbondante e una totale quiete.


      All'inizio della primavera riappare l'avocetta; il parco offre rifugio al falco pellegrino, alla pittima
      minore e alla [spatola bianca](/especie/platalea_leucorodia/). In inverno vi svernano migliaia di oche
      selvatiche, osservabili dal capanno di Ezumakeeg. Molti sentieri sono sterrati e si collegano a una
      fitta rete ciclabile.


      In autunno i boschi accolgono specie fungine rare. Tra i grandi erbivori pascolano cavalli konik,
      visibili talvolta nella zona meridionale del Ballastplaatbos, e bovini di razza Highland scozzese. Di
      notte, l'assoluta oscurità naturale ruba la scena.
    visit: >-
      Il centro visite Lauwersnest rappresenta un ottimo punto di partenza. Gestito da volontari che
      illustrano avvistamenti recenti e percorsi, proietta documentari e offre un sentiero natura di 1,5 km
      con quiz interattivi.


      I percorsi a piedi sono vari e agevoli. La Duindoornroute misura 3 km con partenza dal parcheggio del
      ristorante Het Booze Wijf. L'Orchideeënroute, anch'essa di 3 km, tocca un capanno d'avvistamento e prati
      di orchidee in direzione dell'area militare. La Vogelroute si snoda per 4,8 km tra canneti, acquitrini e
      macchie boscate, richiedendo calzature adatte. L'Observatietorenroute copre 5,6 km attraverso il
      Ballastplaatbos, passando accanto a una parete per topini e a una torre panoramica. La Konijnenroute si
      allunga per 3,3 km nel Ballastplaatbos meridionale ed è vietata ai cani. Per i camminatori più allenati
      c'è l'anello del Lauwersmeer, lungo 43 km, collegato alla rete di nodi cicloturistici.


      Per la notte tre proposte suggestive: il Planetenpad, modello in scala del sistema solare che spiega
      pianeti e inquinamento luminoso; il Dark Sky Pad, da percorrere al buio seguendo frecce luminescenti
      senza torcia per ammirare la Via Lattea; e le piattaforme celesti dove sdraiarsi a contemplare le
      stelle.
    history: >-
      La storia del Lauwersmeer si riassume in due momenti fondamentali. Nel 1969 venne completata la diga di
      chiusura e il fondale marino emerse all'aria. Nel 2016 l'International Dark Sky Association lo ha
      proclamato secondo Dark Sky Park dei Paesi Bassi dopo Boschplaat su Terschelling. Un Dark Sky Park
      tutela il buio naturale e invita a fare esperienza della notte; qui la particolarità risiede
      nell'assenza quasi totale di illuminazione artificiale, fenomeno rarissimo in un paese densamente
      popolato.
    before: >-
      Le norme fondamentali: vaste aree del parco sono oasi protette inaccessibili, pertanto resta sempre sui
      tracciati autorizzati; sulla Konijnenroute non sono ammessi cani; sul Dark Sky Pad è vietato l'uso di
      torce elettriche. I mesi da aprile a ottobre sono i più gradevoli, mentre l'autunno regala grandi
      soddisfazioni agli appassionati di micologia.
    around: >-
      A due chilometri si estendono le [Barene e Paludi Salmastre del Mare dei Wadden (settore
      olandese)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/). Più lontano, il [Parco nazionale del
      Delta dell'Evros](/lugar/ethniko-parko-delta-evrou/) e il [Parco nazionale
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) condividono con il Lauwersmeer la spatola comune e
      l'aquila di mare.
  pt:
    intro: >-
      Até 1969 este território pertencia ao mar. Quando o Lauwersmeer foi isolado por um dique, o antigo fundo
      marinho secou e essa terra recém-emersa converteu-se com o tempo num parque nacional com cerca de 60 km²
      no norte dos Países Baixos. De dia é um refúgio para observação de aves; de noite, convida a deitar numa
      plataforma e contemplar as estrelas.


      É um dos vinte e um parques nacionais do país, constituindo um elo ecológico entre o mar de Wadden e os
      espaços naturais de Groninga, Frísia e Drenthe. Desde 2016 é também certificado como Dark Sky Park pela
      International Dark Sky Association.
    landscape: >-
      A primeira impressão é o vazio de presença humana. Quase ninguém habita o Lauwersmeergebied, o que
      explica a pureza da sua escuridão noturna. A paisagem é aberta e horizontal: planície, água e
      firmamento, enquadrada a norte pela mata de Ballastplaatbos e a sul pelo Zomerhuisbos.


      A natureza regressou de forma espontânea. Durante os primeiros anos, vastas áreas foram entregues à
      sucessão natural livre, gerando habitats diversificados a leste da estrada que une Zoutkamp a
      Lauwersoog. Hoje existem sítios afamados: o Land van juffrouw Ali, a sul de Lauwersoog, é um ranto
      repleto de orquídeas selvagens. Outros setores destinam-se unicamente às aves aquáticas: extensas áreas
      da Ballastplaat, da Rug, da Sennerplaat e de outras reservas permanecem interditas ao público.
    wildlife: >-
      As migrações desenham o ritmo de vida da lagoa duas vezes ao ano. No final do verão, papa-figos,
      alfaiates e colhereiros partem para o sul, regressando na primavera. O Lauwersmeer faculta às aves o
      essencial: alimento farto e tranquilidade.


      No início da primavera regressa o alfaiate; o parque acolhe espécies como o falcão-peregrino, o fuzelo e
      o [colhereiro-europeu](/especie/platalea_leucorodia/). No inverno concentram-se milhares de gansos, com
      um abrigo de observação em Ezumakeeg. Inúmeros trilhos de terra batida articulam-se com uma vasta malha
      de ciclovias.


      No outono os bosques acolhem cogumelos invulgares. Entre os grandes herbívoros contam-se cavalos
      selvagens konik, avistados no sul do Ballastplaatbos, e vacas Highland escocesas. Durante a noite, a
      profunda escuridão natural reina absoluta.
    visit: >-
      O centro de visitantes Lauwersnest é o melhor ponto de partida. Mantido por voluntários que informam
      sobre avistamentos recentes, exibe curtas-metragens e dá acesso a um percurso natural de 1,5 km com
      questionários didáticos ao longo do trajeto.


      Os trilhos pedestres são variados e acessíveis. A Duindoornroute tem 3 km a partir do restaurante Het
      Booze Wijf. A Orchideeënroute, também de 3 km, ladeia um posto de observação e campos de orquídeas em
      direção aos terrenos militares. A Vogelroute estende-se por 4,8 km entre caniçais, prados e bosques,
      recomendando-se calçado impermeável. A Observatietorenroute cobre 5,6 km pelo Ballastplaatbos, passando
      por uma barreira de nidificação de andorinhas-das-barreiras e por uma torre miradouro. A Konijnenroute
      mede 3,3 km no sul do Ballastplaatbos, com acesso interdito a cães. Para os mais preparados existe o
      circuito circular do Lauwersmeer com 43 km, integrado na rede de nós pedestres e cicláveis.


      Para a noite sugerem-se três vivências: o Planetenpad, modelo à escala do sistema solar que elucida
      sobre poluição luminosa; o Dark Sky Pad, percorrido no escuro seguindo setas fluorescentes sem lanterna
      sob a Via Láctea; e plataformas astronómicas onde te podes deitar a fitar o céu.
    history: >-
      A história do Lauwersmeer resume-se a duas datas determinantes. Em 1969 o dique de fecho foi concluído e
      o fundo do mar emergiu. Em 2016 a International Dark Sky Association declarou-o o segundo Dark Sky Park
      dos Países Baixos, a seguir a Boschplaat em Terschelling. Um Dark Sky Park preserva a escuridão natural
      e convida a experienciar a noite; o aspeto central é a ausência de iluminação artificial num país
      densamente urbanizado.
    before: >-
      As regras essenciais: vastas zonas do parque são reservas interditas, pelo que deves manter-te nos
      caminhos assinalados; na Konijnenroute é proibida a presença de cães; e no percurso Dark Sky não se
      utilizam lanternas. O período de abril a outubro proporciona visitas mais confortáveis, merecendo o
      outono destaque pela abundância de cogumelos.
    around: >-
      A dois quilómetros, os [Sapais e Marismas do Mar de Wadden (Setor
      Holandês)](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) completam o mosaico costeiro. Mais
      além, o [Parque Nacional do Delta do Evros](/lugar/ethniko-parko-delta-evrou/) e o [Parque Nacional
      Körös-Maros](/lugar/koros-maros-nemzeti-park/) partilham com o Lauwersmeer o colhereiro-europeu e a
      águia-rabalva.
