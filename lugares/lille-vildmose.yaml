resumen:
  es: >-
    La mayor turbera elevada activa (*raised bog*) de la Europa occidental de llanura (76 km²), albergando la
    reintroducción del alce europeo en Dinamarca.
  en: >-
    The largest active raised bog in lowland Western Europe (76 km²), hosting the reintroduction of the moose
    to Denmark.
  fr: >-
    La plus vaste tourbière bombée active (*raised bog*) des plaines d'Europe occidentale (76 km²),
    accueillant la réintroduction de l'élan en Danemark.
  de: >-
    Das größte aktive Hochmoor im mitteleuropäischen Tiefland (76 km²), Schauplatz der Wiederansiedlung des
    Elches in Dänemark.
  it: >-
    La più grande torbiera alta attiva (*raised bog*) delle pianure dell'Europa occidentale (76 km²), teatro
    della reintroduzione dell'alce in Danimarca.
  pt: >-
    A maior turfeira alta ativa (*raised bog*) das planícies da Europa ocidental (76 km²), acolhendo a
    reintrodução do alce na Dinamarca.
unico:
  es: >-
    Una turbera donde el alce y el bisonte europeo vuelven a vivir, y que se recorre por pasarelas de tablas y
    torres de observación.
  en: >-
    A raised bog where moose and European bison roam free once more, explored via wooden boardwalks and bird
    observation towers.
  fr: >-
    Une tourbière où l'élan et le bison d'Europe vivent de nouveau, que l'on parcourt grâce à des passerelles
    de bois et des tours d'observation.
  de: >-
    Ein Hochmoor, in dem Elch und Wisent wieder frei leben, erschlossen durch Bohlenwege und
    Beobachtungstürme.
  it: >-
    Una torbiera in cui l'alce e il bisonte europeo sono tornati a vivere, esplorabile mediante passerelle in
    legno e torri di avvistamento.
  pt: >-
    Uma turfeira onde o alce e o bisonte-europeu voltaram a habitar, percorrida por passadiços de madeira e
    torres de observação.
observaciones:
  es: >-
    No pises la turbera fuera de las pasarelas: está empapada y es muy profunda. Mantén al menos 50 metros de
    distancia de los grandes animales. Los perros pueden entrar con correa en las zonas exteriores del centro,
    y en el resto de Lille Vildmose está prohibido fumar por riesgo de incendio. Las torres de Toftesø y
    Tofte, y las pasarelas de Portlandmose, se pueden visitar en silla de ruedas. Mejor época: de mayo a
    octubre.
texto:
  es:
    intro: >-
      En Lille Vildmose, las antiguas zanjas de extracción de turba vuelven a tener agua y en verano los alces
      entran en ellas para refrescarse. Este espacio de 7.600 hectáreas reúne turberas, lagos y bosques en el
      norte de Jutlandia, a unos treinta kilómetros al sureste de Aalborg. Las pasarelas y las torres te
      acercan a un paisaje que se está restaurando tras su explotación.
    landscape: >-
      Lo primero es el agua. Esta turbera elevada está formada por musgos de esfagno empapados, y puede
      contener hasta un 90 % de agua. Las turberas elevadas crecieron sin perturbaciones durante 1.200 años,
      hasta que se drenaron hacia 1750. Entre las plantas hay esfagnos, brecina, camarina y arándanos rojos;
      una rareza es la cloudberry.


      Por eso las pasarelas de tablas, como la de Portlandmosen, permiten sentir el suelo oscilante de la
      turbera sin mojarse los pies. Tofte Mose es la turbera elevada más grande y mejor conservada de las
      tierras bajas del noroeste de Europa.


      Las huellas humanas siguen a la vista. Por la turbera corren las viejas zanjas de extracción de turba,
      hoy llenas de agua. El nivel del agua de Portlandmosen se ha subido y la turbera vuelve a crecer.
    wildlife: >-
      La turbera cambia con el calendario. En invierno hay [cisnes cantores](/especie/cygnus_cygnus/) y, al
      anochecer, bandadas de cisnes, gansos y córvidos van a dormir al lago Tofte; por la mañana el tráfico va
      en sentido contrario. Sobre la turbera planean el aguilucho pálido y el alcaudón norteño. En mayo
      trompetean las grullas, y desde Brandvagtstårnet se oye el canto grave del avetoro entre los carrizos.
      En verano, los alces se refrescan en las zanjas llenas de agua. En septiembre y octubre llega la berrea,
      y desde la torre de Tofteskov se puede ver de cerca a los grandes ciervos bramando y peleando.


      Entre los mamíferos hay [ciervos](/especie/cervus_elaphus/), jabalíes, [nutrias](/especie/lutra_lutra/),
      zorros y corzos. El [alce](/especie/alces_alces/) volvió con animales procedentes de Suecia: cinco crías
      llegaron en noviembre de 2015 y las introducciones de 2016-17 reunieron diez ejemplares en total en
      Mellemområdet. El bisonte europeo, desaparecido de Dinamarca hace miles de años, se introdujo en el
      bosque de Tofte. El lobo y el chacal dorado, que han llegado a Dinamarca desde Alemania, se registran en
      la reserva desde 2021 y 2016.


      Arriba, el [águila real](/especie/aquila_chrysaetos/) y el [pigargo
      europeo](/especie/haliaeetus_albicilla/) crían en la reserva. En el lago Tofte hay una colonia de
      cormoranes habitada de marzo a entrado el otoño, y casi a diario se ve a un pigargo o a un águila real
      cazando. En el lago Birkesø, que se restauró en diciembre de 2017, las islas artificiales dan refugio y
      las aguas someras sirven de comedor a las espátulas.
    visit: >-
      Empieza en el centro de visitantes, en medio de la reserva: tiene una exposición sobre la turbera, sus
      animales y su evolución, y un cine. En recepción te dan un mapa para recorrerla por tu cuenta, y
      Mellemområdet tiene acceso gratuito a cualquier hora y durante todo el año. El centro tiene sus propios
      horarios de apertura. Desde él puedes ir hacia Birkesø y su pabellón de observación.


      Las torres hacen de mirador. Brandvagtstårnet domina las zanjas de turba llenas de agua; Rovfugletårnet
      mira al comedero de águilas, y un paseo de tablas desde el aparcamiento de Ny Høstemarkvej lleva hasta
      ella, con buenas opciones de cruzarse de cerca con alces y ciervos. Por el borde de Tofte Mose discurre
      el sendero Nordsøstien, y otro lleva desde el aparcamiento oeste, a través de Portlandmosen, hasta el
      pie del acantilado de Kællingbjerg.


      La torre de Toftesø queda a 100 metros del aparcamiento de Mellemområdet, por un sendero que atraviesa
      la valla. Desde allí se observa el lago. Si prefieres ir acompañado, el centro organiza visitas guiadas
      a los bosques de acceso restringido.
    history: >-
      La restauración del lugar pasa por traer de vuelta a los grandes herbívoros. El alce, desaparecido de
      Dinamarca hace unos 4.500 años, se eligió como megafauna para sustituir al ganado, y se soltaron diez
      procedentes de Suecia. Lille Vildmose es sitio Ramsar desde el 18 de mayo de 2013, y los bosques de
      Høstemark y Tofte están vallados y no se puede entrar salvo en excursiones guiadas.
    before: >-
      No pises la turbera fuera de las pasarelas: está empapada y es muy profunda. Mantén al menos 50 metros
      de distancia de los grandes animales. Los perros pueden entrar con correa en las zonas exteriores del
      centro, y en el resto de Lille Vildmose está prohibido fumar por riesgo de incendio. Las torres de
      Toftesø y Tofte, y las pasarelas de Portlandmose, se pueden visitar en silla de ruedas. Mejor época: de
      mayo a octubre.
    around: >-
      Lille Vildmose no tiene vecinos cercanos en el atlas, pero sí lugares lejanos con los que comparte
      hábitats y especies. El [Parque Nacional de Store Mosse](/lugar/store-mosse-national-park/) comparte con
      ella los humedales, el alce y el pigargo; el [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/), el
      alce y el águila real; y el [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/) y el [Parque
      Nacional de Ķemeri](/lugar/kemeru-nacionalais-parks/), los humedales, el alce y el pigargo.
  en:
    intro: >-
      In Lille Vildmose, former peat extraction cuttings are once again brimming with water, and in summer
      moose wade in to cool off. This 7,600-hectare sanctuary brings together raised bogs, lakes and woodlands
      in northern Jutland, about thirty kilometres southeast of Aalborg. Boardwalks and observation towers
      bring you up close to a landscape in active ecological recovery following decades of industrial
      extraction.
    landscape: >-
      Water defines everything here. This raised bog is built from waterlogged sphagnum mosses, capable of
      holding up to 90 % water by weight. Raised bogs expanded undisturbed across the plain for 1,200 years
      until systematic ditch drainage began around 1750. Characteristic plants include diverse peat mosses,
      heather, crowberry and cranberries; a northern rarity is the cloudberry.


      Wooden boardwalks, such as the one in Portlandmosen, allow you to experience the trembling, quaking bog
      surface without wetting your boots. Tofte Mose is recognized as the largest and most intact lowland
      raised bog in north-western Europe.


      Human traces remain clearly legible. Old peat cuttings crisscross the mire, now re-flooded. Water levels
      across Portlandmosen have been artificially raised and active peat formation has resumed.
    wildlife: >-
      The bog transforms with the seasons. In winter [Whooper swan](/especie/cygnus_cygnus/)s arrive, and at
      dusk large flights of swans, wild geese and corvids gather to roost on Lake Tofte, reversing direction
      at daybreak. Hen harriers and great grey shrikes course over the heather. In May common cranes trumpet,
      and from Brandvagtstårnet the resonant booming of the Eurasian bittern echoes through the reedbeds. In
      summer, moose wade into flooded cuttings. In September and October the red deer rut peaks, and the
      Tofteskov viewing tower provides close views of stags roaring and clashing.


      Mammals include [red deer](/especie/cervus_elaphus/), wild boar, [Eurasian
      otter](/especie/lutra_lutra/)s, red foxes and roe deer. The [Moose](/especie/alces_alces/) returned
      through individuals translocated from Sweden: five calves arrived in November 2015, and subsequent
      releases in 2016-17 brought the total in Mellemområdet to ten animals. The European bison, absent from
      Denmark for thousands of years, was reintroduced to Tofte forest. Wolves and golden jackals, migrating
      naturally into Denmark from Germany, have been documented in the reserve since 2021 and 2016.


      Above, the [Golden eagle](/especie/aquila_chrysaetos/) and the [White-tailed
      eagle](/especie/haliaeetus_albicilla/) breed in the reserve. Lake Tofte supports a cormorant colony
      active from March through autumn, and a sea eagle or golden eagle can be spotted hunting almost daily.
      At Lake Birkesø, restored in December 2017, artificial islands offer nesting refuges while shallow
      waters provide feeding grounds for Eurasian spoonbills.
    visit: >-
      Begin at the visitor centre, located at the heart of the reserve: it features interactive exhibits on
      peat ecology, wildlife and mire history, alongside a cinema. At reception you can collect a map for
      self-guided exploration, and Mellemområdet remains open free of charge around the clock throughout the
      year. The visitor centre operates its own seasonal opening hours. From there you can head towards Lake
      Birkesø and its covered viewing pavilion.


      Observation towers provide premier vantage points. Brandvagtstårnet overlooks flooded peat trenches;
      Rovfugletårnet looks out across the eagle feeding station, accessible via a boardwalk from the Ny
      Høstemarkvej car park with excellent chances of close encounters with moose and deer. The Nordsøstien
      hiking path skirts Tofte Mose, while another trail leads from the western car park across Portlandmosen
      to the base of the Kællingbjerg cliff.


      The Toftesø tower stands just 100 metres from the Mellemområdet car park via a path through the gate
      fence, overlooking the open lake. For restricted areas, the visitor centre arranges guided vehicle and
      walking excursions into the fenced forests.
    history: >-
      Restoration hinges on the reintroduction of large native herbivores. The moose, which disappeared from
      Denmark approximately 4,500 years ago, was chosen as surrogate megafauna to replace livestock grazing,
      with ten individuals released from Swedish stock. Lille Vildmose was designated a Ramsar site on 18 May
      2013, and the woodlands of Høstemark and Tofte remain fenced to secure the large grazers, accessible
      only on guided excursions.
    before: >-
      Never step off the wooden boardwalks onto the bog: it is deeply saturated and treacherous. Maintain at
      least 50 metres distance from large wild animals. Dogs on leash are permitted in outdoor areas around
      the centre, but smoking is strictly prohibited across Lille Vildmose due to severe wildfire risk. The
      towers at Toftesø and Tofte, and the Portlandmose boardwalk, are wheelchair accessible. Best visiting
      window: May to October.
    around: >-
      Lille Vildmose has no immediate neighbours in the atlas, but shares habitats and species with distant
      counterparts. [Parque Nacional de Store Mosse](/lugar/store-mosse-national-park/) shares vast wetlands,
      moose and white-tailed eagle; [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/) shares moose and
      golden eagle; and both [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/) and [Parque
      Nacional de Ķemeri](/lugar/kemeru-nacionalais-parks/) share extensive wetlands, moose and white-tailed
      eagle.
  fr:
    intro: >-
      À Lille Vildmose, les anciennes fosses d'extraction de tourbe se remplissent de nouveau d'eau et, en
      été, les élans s'y immergent pour se rafraîchir. Ce vaste espace de 7 600 hectares rassemble tourbières,
      lacs et forêts dans le nord du Jutland, à une trentaine de kilomètres au sud-est d'Aalborg. Les
      passerelles sur pilotis et les tours d'observation vous immergent dans un paysage en pleine régénération
      après son exploitation.
    landscape: >-
      Ici, l'eau gouverne tout. Cette tourbière bombée est constituée de sphaignes gorgées d'humidité et peut
      retenir jusqu'à 90 % d'eau. Les tourbières hautes s'y sont développées sans perturbation pendant 1 200
      ans, jusqu'à leur drainage amorcé vers 1750. Parmi les végétaux figurent diverses sphaignes, la callune,
      la camarine et les canneberges ; la plaqueminier constitue une rareté boréale remarquable.


      C'est pourquoi les passerelles en bois, comme celle de Portlandmosen, permettent de fouler le sol
      tremblant du marais sans s'enfoncer ni se mouiller les pieds. Tofte Mose est la tourbière haute la plus
      vaste et la mieux conservée des basses terres du nord-ouest de l'Europe.


      Les empreintes humaines demeurent bien visibles. D'anciennes fosses de tourbage zèbrent la tourbière,
      aujourd'hui remises en eau. Le niveau hydrique de Portlandmosen a été rehaussé et la sphaigne a repris
      sa croissance active.
    wildlife: >-
      La tourbière change de visage au fil des saisons. En hiver séjournent les [Cygne
      chanteur](/especie/cygnus_cygnus/)s et, au crépuscule, de grands vols de cygnes, d'oies et de corvidés
      rejoignent le lac Tofte pour la nuit, avant de repartir à l'aube. Au-dessus des landes patrouillent le
      busard Saint-Martin et la pie-grièche grise. En mai retentit le trompètement des grues, et depuis
      Brandvagtstårnet résonne le chant caverneux du butor étoilé dans les roselières. En été, les élans
      s'ébrouent dans les fosses inondées. En septembre et octobre commence le brame, et la tour de Tofteskov
      offre une vue rapprochée sur les grands cerfs.


      Parmi les mammifères figurent [cerfs élaphes](/especie/cervus_elaphus/), sangliers, [loutres
      d'Europe](/especie/lutra_lutra/), renards et chevreuils. L'[Élan](/especie/alces_alces/) a été
      réintroduit grâce à des sujets originaires de Suède : cinq jeunes sont arrivés en novembre 2015 et les
      transferts de 2016-17 ont porté l'effectif du Mellemområdet à dix individus. Le bison d'Europe, disparu
      du Danemark depuis des millénaires, a été réintroduit dans la forêt de Tofte. Le loup et le chacal doré,
      arrivés d'Allemagne, sont attestés dans la réserve depuis 2021 et 2016.


      Dans les airs, l'[Aigle royal](/especie/aquila_chrysaetos/) et le [Pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) nichent dans la réserve. Au lac Tofte, une colonie de cormorans
      est occupée de mars à l'automne, et l'on y voit presque quotidiennement un pygargue ou un aigle royal en
      chasse. Au lac Birkesø, restauré en décembre 2017, des îlots artificiels offrent un refuge tandis que
      les hauts-fonds nourrissent les spatules blanches.
    visit: >-
      Commencez par le centre d'accueil des visiteurs au cœur de la réserve : il présente une exposition
      interactive sur la tourbière, ses animaux et son évolution, accompagnée d'un cinéma. À l'accueil, un
      plan vous est remis pour explorer les lieux en autonomie, et le secteur du Mellemområdet est accessible
      librement à toute heure et toute l'année. Le centre obéit à ses propres horaires d'ouverture. De là,
      vous pouvez cheminer vers le lac Birkesø et son observatoire couvert.


      Les tours constituent des postes d'observation privilégiés. Brandvagtstårnet surplombe les tranchées
      inondées ; Rovfugletårnet donne sur la zone de nourrissage des aigles, accessible par un platelage
      depuis le parking de Ny Høstemarkvej avec d'excellentes chances de croiser des élans et des cerfs. Le
      sentier Nordsøstien longe Tofte Mose, et un autre itinéraire part du parking ouest à travers
      Portlandmosen jusqu'au pied de la falaise de Kællingbjerg.


      La tour de Toftesø se trouve à 100 mètres du parking du Mellemområdet via un chemin franchissant la
      clôture, ouvrant la vue sur le lac. Pour visiter les forêts clôturées à accès réservé, le centre
      organise des visites guidées.
    history: >-
      La restauration de la réserve repose sur le retour des grands herbivores. L'élan, disparu du Danemark il
      y a environ 4 500 ans, a été choisi pour remplacer le bétail agricole, avec dix spécimens relâchés
      depuis la Suède. Lille Vildmose est classée zone humide Ramsar depuis le 18 mai 2013, et les massifs de
      Høstemark et Tofte demeurent clôturés, accessibles exclusivement dans le cadre d'excursions guidées.
    before: >-
      Ne marchez jamais sur la tourbière en dehors des passerelles aménagées : elle est gorgée d'eau et très
      profonde. Conservez au moins 50 mètres de distance avec les grands mammifères. Les chiens en laisse sont
      admis dans les espaces extérieurs du centre, mais fumer est strictement banni dans toute la réserve en
      raison du risque d'incendie. Les tours de Toftesø et Tofte, ainsi que les passerelles de Portlandmose,
      sont accessibles aux personnes en fauteuil roulant. Période recommandée : de mai à octobre.
    around: >-
      Lille Vildmose ne compte aucun voisin immédiat dans l'atlas, mais partage des habitats et des espèces
      avec des espaces lointains. Le [Parque Nacional de Store Mosse](/lugar/store-mosse-national-park/)
      partage les tourbières, l'élan et le pygargue ; le [Parque Nacional de
      Soomaa](/lugar/soomaa-rahvuspark/) l'élan et l'aigle royal ; et le [Parque Nacional de
      Biebrza](/lugar/biebrzanski-park-narodowy/) ainsi que le [Parque Nacional de
      Ķemeri](/lugar/kemeru-nacionalais-parks/) partagent les milieux humides, l'élan et le pygargue.
  de:
    intro: >-
      In Lille Vildmose füllen sich alte Torfstiche wieder mit Wasser, und im Sommer waten Elche hinein, um
      sich abzukühlen. Dieses 7.600 Hektar große Schutzgebiet vereint Hochmoore, Seen und Wälder im Norden
      Jütlands, etwa dreißig Kilometer südöstlich von Aalborg. Holzstege und Beobachtungstürme bringen dich
      nah an eine Landschaft heran, die sich nach jahrzehntelangem Torfabbau regeneriert.
    landscape: >-
      Alles wird vom Wasser bestimmt. Dieses Hochmoor besteht aus nassen Torfmoospolstern und kann bis zu 90 %
      seines Gewichts an Wasser speichern. Die Hochmoore wuchsen 1.200 Jahre lang ungestört heran, bis um 1750
      die Entwässerung einsetzte. Zur typischen Pflanzendecke gehören Torfmoose, Besenheide, Krähenbeere und
      Moosbeere; eine arktische Seltenheit ist die Moltebeere.


      Bohlenwege wie jener im Portlandmosen lassen dich den schwankenden Moorboden spüren, ohne dass die Füße
      nass werden. Tofte Mose gilt als das größte und besterhaltene Tiefland-Hochmoor im gesamten Nordwesten
      Europas.


      Die Spuren menschlicher Nutzung sind noch überall sichtbar. Alte Torfgräben durchziehen das Moor, sind
      heute jedoch wieder eingestaut. Der Wasserstand im Portlandmosen wurde angehoben, sodass die Torfmoose
      erneut aktiv wachsen.
    wildlife: >-
      Das Moor wandelt sich im Rhythmus des Jahres. Im Winter rasten [Singschwan](/especie/cygnus_cygnus/)e,
      und in der Abenddämmerung fliegen Schwärme von Schwänen, Wildgänsen und Rabenvögeln zum Schlafen auf den
      Tofte-See; am Morgen erfolgt der Abflug in Gegenrichtung. Kornweihe und Raubwürger streifen über das
      Moor. Im Mai rufen die Kraniche, und vom Brandvagtstårnet dringt der dumpfe Ruf der Rohrdommel aus dem
      Schilf. Im Sommer kühlen sich die Elche in den gefluteten Torfgräben ab. Im September und Oktober setzt
      die Brunft ein, und vom Turm in Tofteskov lassen sich röhrende und kämpfende Hirsche beobachten.


      Unter den Säugetieren kommen [Rothirsche](/especie/cervus_elaphus/), Wildschweine,
      [Fischotter](/especie/lutra_lutra/), Füchse und Rehe vor. Der [Elch](/especie/alces_alces/) kehrte durch
      Auswilderungen aus Schweden zurück: Fünf Kälber kamen im November 2015 an, und die Ansiedlungen von
      2016-17 brachten den Bestand im Mellemområdet auf zehn Tiere. Der Wisent, in Dänemark seit Jahrtausenden
      ausgestorben, wurde im Wald von Tofte angesiedelt. Wolf und Goldschakal, die aus Deutschland
      eingewandert sind, werden im Gebiet seit 2021 und 2016 nachgewiesen.


      Am Himmel brüten [Steinadler](/especie/aquila_chrysaetos/) und
      [Seeadler](/especie/haliaeetus_albicilla/). Am Tofte-See besteht von März bis in den Herbst eine
      Kormorankolonie, und fast täglich jagen Seeadler oder Steinadler über dem Wasser. Am im Dezember 2017
      renaturierten See Birkesø bieten künstliche Inseln Brutplätze, während Flachwasserzonen Löfflern als
      Nahrungshabitat dienen.
    visit: >-
      Beginne am Besucherzentrum mitten im Schutzgebiet: Es bietet Ausstellungen über Moor, Tierwelt und
      Geschichte sowie ein Kino. Am Empfang erhältst du Karten für eigenständige Erkundungen; das
      Mellemområdet ist rund um die Uhr das ganze Jahr über frei zugänglich. Das Zentrum hat eigene
      Öffnungszeiten. Von dort kannst du zum Birkesø-See und dessen Aussichtspavillon spazieren.


      Die Türme dienen als ideale Aussichtspunkte. Brandvagtstårnet überblickt die gefluteten Torfstiche;
      Rovfugletårnet blickt auf den Futterplatz der Adler und ist über einen Bohlenweg vom Parkplatz an der Ny
      Høstemarkvej erreichbar, mit besten Chancen auf Elch- und Hirschbegegnungen. Entlang des Tofte Mose
      verläuft der Nordsøstien-Wanderweg, ein weiterer Pfad führt vom Westparkplatz über das Portlandmosen zum
      Fuß der Kællingbjerg-Klippe.


      Der Turm am Toftesø liegt nur 100 Meter vom Parkplatz im Mellemområdet entfernt an einem Pfad durch das
      Gatter und überblickt den See. Für abgesperrte Waldgebiete veranstaltet das Zentrum geführte
      Exkursionen.
    history: >-
      Die Wiederherstellung der Naturlandschaft stützt sich auf große Pflanzenfresser. Der Elch, der vor etwa
      4.500 Jahren in Dänemark ausstarb, wurde als Weidetier gewählt, um das Vieh abzulösen; zehn Tiere aus
      Schweden wurden freigelassen. Lille Vildmose ist seit dem 18. Mai 2013 ein Ramsar-Gebiet, und die Wälder
      von Høstemark und Tofte sind gezäunt und nur auf geführten Touren zugänglich.
    before: >-
      Verlasse die Holzstege keinesfalls: Das Moor ist tiefgründig und nass. Halte mindestens 50 Meter Abstand
      zu den Großtieren. Angeleinte Hunde sind im Außenbereich des Zentrums gestattet; im übrigen Gebiet von
      Lille Vildmose gilt wegen Brandgefahr striktes Rauchverbot. Die Türme Toftesø und Tofte sowie die Stege
      im Portlandmose sind mit dem Rollstuhl befahrbar. Beste Reisezeit: Mai bis Oktober.
    around: >-
      Lille Vildmose hat im Atlas keine direkten Nachbarn, teilt aber Lebensräume mit weit entfernten
      Gebieten. Der [Parque Nacional de Store Mosse](/lugar/store-mosse-national-park/) teilt Moore, Elch und
      Seeadler; der [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/) Elch und Steinadler; und sowohl der
      [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/) als auch der [Parque Nacional de
      Ķemeri](/lugar/kemeru-nacionalais-parks/) teilen Feuchtgebiete, Elch und Seeadler.
  it:
    intro: >-
      A Lille Vildmose le antiche trincee di estrazione della torba si sono nuovamente colmate d'acqua e, in
      estate, le alci vi si immergono per rinfrescarsi. Questo comprensorio di 7.600 ettari raccoglie
      torbiere, laghi e boschi nello Jutland settentrionale, a una trentina di chilometri a sud-est di
      Aalborg. Passerelle su palafitte e torri d'avvistamento consentono di avvicinarsi a un paesaggio in
      piena rinascita ecologica.
    landscape: >-
      L'acqua governa ogni cosa. Questa torbiera alta è formata da cuscinetti di sfagno intrisi d'acqua,
      capaci di trattenere fino al 90 % di umidità. Le torbiere alte si sono sviluppate indisturbate per 1.200
      anni, fino a quando attorno al 1750 ebbero inizio le opere di bonifica. Tra le piante tipiche compaiono
      sfagni, brugo, empetro e mirtillo rosso; una vera rarità boreale è il camemoro.


      Le passerelle in legno, come quella di Portlandmosen, permettono di avvertire il suolo oscillante della
      torbiera senza bagnarsi i piedi. Tofte Mose è la torbiera alta più vasta e integra delle pianure
      dell'Europa nord-occidentale.


      Le tracce storiche restano evidenti. Le vecchie trincee di escavazione solcano il terreno, oggi
      allagate. I livelli idrici di Portlandmosen sono stati innalzati artificialmente e la torbiera ha
      ripreso a crescere attivamente.
    wildlife: >-
      La torbiera muta volto con l'avvicendarsi delle stagioni. In inverno giungono i [cigni
      selvatici](/especie/cygnus_cygnus/) e all'imbrunire folti stormi di cigni, oche e corvidi raggiungono il
      lago Tofte per la notte; all'alba il flusso riparte in senso opposto. Sulla distesa planano l'albanella
      reale e l'averla maggiore. In maggio risuonano i richiami delle gru e dalla Brandvagtstårnet si ode il
      canto cupo del tarabuso nei canneti. In estate le alci trovano refrigerio negli invasi d'acqua. Tra
      settembre e ottobre si scatena il bramito dei grandi cervi, osservabili da vicino dalla torre di
      Tofteskov.


      Tra i mammiferi popolano l'area [cervi](/especie/cervus_elaphus/), cinghiali, [lontre
      europee](/especie/lutra_lutra/), volpi e caprioli. L'[alce](/especie/alces_alces/) è tornata grazie a
      capi traslocati dalla Svezia: cinque giovani giunsero nel novembre 2015 e i rilasci del 2016-17 hanno
      portato il nucleo del Mellemområdet a dieci esemplari. Il bisonte europeo, scomparso dalla Danimarca da
      millenni, è stato reintrodotto nella foresta di Tofte. Lupo e sciacallo dorato, giunti spontaneamente
      dalla Germania, sono segnalati stabilmente dal 2021 e dal 2016.


      In cielo nidificano l'[Aquila reale](/especie/aquila_chrysaetos/) e l'[Aquila di
      mare](/especie/haliaeetus_albicilla/). Sul lago Tofte è insediata una colonia di cormorani da marzo
      all'autunno, e quasi ogni giorno si scorge un'aquila di mare o un'aquila reale intenta a cacciare. Sul
      lago Birkesø, rinaturato nel dicembre 2017, isole artificiali fungono da rifugio e i bassifondi offrono
      zone di pastura alle spatole.
    visit: >-
      Inizia dal centro visite, collocato nel mezzo della riserva: ospita allestimenti interattivi su fauna,
      torba ed evoluzione dell'area, oltre a una sala proiezioni. Alla reception puoi ritirare una mappa per
      visite autonome; l'area del Mellemområdet è aperta gratuitamente a qualsiasi ora e durante tutto l'anno.
      Il centro adotta propri orari stagionali. Da lì puoi procedere verso il lago Birkesø e il suo capanno
      d'osservazione.


      Le torri offrono scorci privilegiati. Brandvagtstårnet domina le trincee allagate; Rovfugletårnet si
      affaccia sul punto di alimentazione delle aquile, raggiungibile via passerella dal parcheggio di Ny
      Høstemarkvej con ottime probabilità di incontrare alci e cervi. Lungo il margine di Tofte Mose corre il
      sentiero Nordsøstien, mentre un altro percorso conduce dal parcheggio ovest attraverso Portlandmosen
      fino ai piedi della parete di Kællingbjerg.


      La torre di Toftesø sorge a 100 metri dal parcheggio del Mellemområdet lungo un sentiero che attraversa
      la recinzione, con vista sul lago. Per visitare i boschi recintati a tutela speciale, il centro
      organizza escursioni guidate.
    history: >-
      Il risanamento della riserva poggia sul ritorno dei grandi erbivori. L'alce, estinta in Danimarca circa
      4.500 anni fa, è stata scelta per sostituire il bestiame domestico con dieci individui liberati da ceppi
      svedesi. Lille Vildmose è sito Ramsar dal 18 maggio 2013, e i boschi di Høstemark e Tofte sono recintati
      e accessibili esclusivamente mediante visite guidate.
    before: >-
      Non allontanarti mai dalle passerelle di legno: la torbiera è instabile, profonda e pregna d'acqua.
      Mantieni una distanza di sicurezza di almeno 50 metri dai grandi mammiferi. I cani al guinzaglio sono
      ammessi negli spazi esterni del centro visite; nel resto di Lille Vildmose è severamente vietato fumare
      per il pericolo d'incendio. Le torri di Toftesø e Tofte e le passerelle di Portlandmose sono fruibili in
      sedia a rotelle. Periodo ideale: da maggio a ottobre.
    around: >-
      Lille Vildmose non ha vicini diretti nell'atlas, ma spartisce habitat e fauna con riserve remote. Lo
      [Parque Nacional de Store Mosse](/lugar/store-mosse-national-park/) condivide zone umide, alce e aquila
      di mare; il [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/) alce e aquila reale; e sia il [Parque
      Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/) sia il [Parque Nacional de
      Ķemeri](/lugar/kemeru-nacionalais-parks/) condividono paludi, alce e aquila di mare.
  pt:
    intro: >-
      Em Lille Vildmose, as antigas valas de extração de turfa voltaram a encher-se de água e, no verão, os
      alces entram nelas para se refrescarem. Esta área de 7600 hectares reúne turfeiras, lagoas e florestas
      no norte da Jutlândia, a cerca de trinta quilómetros a sudeste de Aalborg. Os passadiços e as torres de
      vigia aproximam-te de uma paisagem em recuperação ativa após a exploração humana.
    landscape: >-
      A água dita as regras. Esta turfeira alta é constituída por tufos de esfagno encharcados e consegue
      reter até 90 % do seu peso em água. As turfeiras altas expandiram-se sem perturbação durante 1200 anos,
      até terem sido drenadas por volta de 1750. Na flora contam-se musgos-de-turfeira, urze-comum, camarinha
      e oxicocos; uma raridade setentrional é a amora-ártica.


      Por isso os passadiços sobre estacas, como o de Portlandmosen, permitem sentir o solo flutuante e
      movediço sem molhar os pés. Tofte Mose é a maior e mais bem preservada turfeira alta das terras baixas
      do noroeste da Europa.


      As marcas da história permanecem visíveis. Velhas valas de turfa cruzam a área, hoje novamente alagadas.
      O nível hidrológico de Portlandmosen foi elevado e a turfeira retomou o seu crescimento vegetal.
    wildlife: >-
      A turfeira transforma-se consoante a época do ano. No inverno chegam os
      [cisnes-bravos](/especie/cygnus_cygnus/) e, ao entardecer, bandos de cisnes, gansos e corvídeos pousam
      para pernoitar no lago Tofte; pela manhã o movimento faz-se em sentido inverso. Sobre a charneca
      patrulham o tartaranhão-azulado e o picanço-real. Em maio ecoam os grous e da Brandvagtstårnet ouve-se o
      chamamento cavernoso do abetouro nos caniçais. No verão, os alces banham-se nas valas cheias de água. Em
      setembro e outubro dá-se a brama dos veados, que se avistam a combater a partir da torre de Tofteskov.


      Entre os mamíferos encontram-se [veados-vermelhos](/especie/cervus_elaphus/), javalis,
      [lontras-europeias](/especie/lutra_lutra/), raposas e corços. O [Alce](/especie/alces_alces/) regressou
      através de animais translocados da Suécia: cinco crias chegaram em novembro de 2015 e as introduções de
      2016-17 perfizeram dez indivíduos em Mellemområdet. O bisonte-europeu, extinto na Dinamarca há milénios,
      foi reinstalado na floresta de Tofte. O lobo e o chacal-dourado, chegados da Alemanha, registam-se na
      reserva desde 2021 e 2016.


      No ar, a [Águia-real](/especie/aquila_chrysaetos/) e a [Águia-rabalva](/especie/haliaeetus_albicilla/)
      nidificam no parque. No lago Tofte existe uma colónia de corvos-marinhos ativa de março até ao outono, e
      quase diariamente se avista uma águia-rabalva ou águia-real a caçar. No lago Birkesø, reabilitado em
      dezembro de 2017, ilhotas artificiais conferem refúgio enquanto as águas baixas alimentam os
      colhereiros.
    visit: >-
      Começa pelo centro de acolhimento de visitantes, no coração da reserva: reúne exposições interativas
      sobre o ecossistema, os animais e a história local, além de uma sala de projeção. Na receção facultam
      mapas para visitas autónomas, e Mellemområdet tem acesso gratuito e permanente durante todo o ano. O
      centro funciona com horários próprios. Dali podes caminhar até ao lago Birkesø e ao seu pavilhão de
      observação.


      As torres funcionam como excelentes miradouros. A Brandvagtstårnet domina as valas alagadas; a
      Rovfugletårnet contempla a zona de alimentação das águias, ligada por passadiço ao parque de
      estacionamento de Ny Høstemarkvej com ótimas probabilidades de contacto próximo com alces e veados. Pelo
      bordo de Tofte Mose corre o trilho Nordsøstien, e outro caminho parte do parque oeste por Portlandmosen
      até ao sopé da escarpa de Kællingbjerg.


      A torre de Toftesø fica a 100 metros do parque de estacionamento de Mellemområdet, através de um caminho
      que passa o portão da cerca, debruçando-se sobre o lago. Para conhecer os bosques vedados de acesso
      restrito, o centro organiza visitas guiadas.
    history: >-
      A restauração do território apoia-se no regresso dos grandes herbívoros. O alce, extinto na Dinamarca há
      cerca de 4500 anos, foi reintroduzido para substituir o gado doméstico, com dez indivíduos libertados
      vindos da Suécia. Lille Vildmose é sítio Ramsar desde 18 de maio de 2013, e os bosques de Høstemark e
      Tofte encontram-se vedados, apenas visitáveis mediante excursões com guia.
    before: >-
      Nunca saias dos passadiços de madeira: a turfeira é movediça, profunda e está encharcada. Mantém uma
      distância de segurança de pelo menos 50 metros relativamente aos grandes mamíferos. Os cães pela trela
      são permitidos nas imediações exteriores do centro, mas em toda a área de Lille Vildmose é estritamente
      proibido fumar devido ao risco de fogo. As torres de Toftesø e Tofte e os passadiços de Portlandmose são
      acessíveis em cadeira de rodas. Melhor período: maio a outubro.
    around: >-
      Lille Vildmose não tem vizinhos imediatos no atlas, mas partilha ecossistemas e fauna com destinos
      longínquos. O [Parque Nacional de Store Mosse](/lugar/store-mosse-national-park/) partilha zonas
      húmidas, o alce e a águia-rabalva; o [Parque Nacional de Soomaa](/lugar/soomaa-rahvuspark/) o alce e a
      águia-real; e o [Parque Nacional de Biebrza](/lugar/biebrzanski-park-narodowy/) e o [Parque Nacional de
      Ķemeri](/lugar/kemeru-nacionalais-parks/) partilham pauis, o alce e a águia-rabalva.
