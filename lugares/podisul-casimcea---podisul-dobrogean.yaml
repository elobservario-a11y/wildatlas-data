unico:
  es: >-
    La meseta más antigua de Rumanía, única por su doble estructura: de erosión en la mitad norte y de
    sedimentación en la mitad sur.
  en: >-
    Romania's oldest plateau, unique for its dual structure: erosional in its northern half and sedimentary in
    its southern half.
  fr: >-
    Le plus ancien plateau de Roumanie, remarquable par sa double structure : d'érosion dans sa moitié nord et
    de sédimentation dans sa moitié sud.
  de: >-
    Die älteste Hochebene Rumäniens, einzigartig durch ihre doppelte Struktur: Abtragungslandschaft im Norden
    und Sedimentbecken im Süden.
  it: >-
    Il più antico altopiano della Romania, singolare per la sua duplice struttura: di erosione a nord e di
    sedimentazione a sud.
  pt: >-
    O planalto mais antigo da Roménia, singular pela sua dupla estrutura: de erosão na metade norte e de
    sedimentação na metade sul.
