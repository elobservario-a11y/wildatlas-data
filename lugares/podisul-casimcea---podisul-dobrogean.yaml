texto:
  es:
    intro: >-
      Pisas el suelo más viejo de Rumanía. La meseta de Casimcea, en el centro de Dobrogea, nació con los
      movimientos baikalianos y se asienta sobre esquistos verdes del Precámbrico, las rocas más antiguas del
      país. Hoy es una estepa ondulada, de horizontes largos, donde la tierra apenas sube y son las rapaces
      las que animan el cielo.
    landscape: >-
      Dos fallas la encierran: la de Peceneaga-Camena, al norte, y la de Capidava-Ovidiu, al sur. Entre ambas
      queda un horst nivelado de esquistos verdes, cubierto de loess. Las altitudes medias rondan los 150-200
      metros y La Pandele, con 395 metros, es el punto más alto. El centro es de relieve ondulado y poco
      fragmentado, y entre el manto de loess afloran rocas de esquisto verde llamadas *filade*.


      Hacia el Danubio todo cambia. Hay valles profundos y estrechos, de orillas abruptas, que fragmentan la
      meseta: los valles de Casimcea, Corugea y Haidarului. Los valles con roquedos y umbrales de piedra, por
      donde pasan arroyos de poco caudal, contrastan con la aridez de la estepa de relieve suave. El clima es
      templado semiárido, con una media anual de once grados y menos de 350 milímetros de lluvia. En el área
      se alternan estepa, estepa arbolada y bosques, entre ellos Stepa Casimcea, Pădurea Alecsandri y Pădurea
      Iepurelui.


      En el sureste, las calizas dan un relieve kárstico con dolinas, cuevas pequeñas como La Adam y Gura
      Dobrogei y las espectaculares gargantas de Gura Dobrogei. En el valle de Casimcea, entre Cheia, Târgușor
      y Gura Dobrogei, se han descubierto quince cuevas de gran importancia arqueológica y paleontológica.
    wildlife: >-
      El mosaico de bosques, praderas de estepa y cultivos permite la convivencia de muchas aves: treinta de
      interés comunitario y cinco amenazadas a escala mundial. Crían aquí en buen número el [alcaraván
      común](/especie/burhinus_oedicnemus/), dos alondras esteparias, la totovía, el bisbita campestre, la
      culebrera y el [busardo moro](/especie/buteo_rufinus/).


      En migración el cielo se anima. Las colinas onduladas generan corrientes ascendentes que ayudan a
      planear, por eso la estepa es clave para rapaces migratorias como el águila pomerana, el [abejero
      europeo](/especie/pernis_apivorus/), el [aguilucho lagunero](/especie/circus_aeruginosus/), el
      [cernícalo patirrojo](/especie/falco_vespertinus/), el [aguilucho cenizo](/especie/circus_pygargus/), el
      águila calzada, el aguilucho pálido y la culebrera. En una sola temporada pasan por la estepa más de
      cincuenta mil cigüeñas blancas y más de cuatrocientas [cigüeñas negras](/especie/ciconia_nigra/).
      Treinta y siete especies migratorias crían, invernan o pasan por el sitio durante los pasos.


      En el suelo vive el [suslik europeo](/especie/spermophilus_citellus/), que forma colonias pero cada
      individuo tiene su propia galería, e hiberna sin hacer provisiones. Es presa de rapaces diurnas y
      nocturnas y de los mamíferos carnívoros, y el [halcón sacre](/especie/falco_cherrug/) depende
      estrictamente de él. El halcón inverna en África y la península arábiga y llega a las zonas de cría a
      principios de marzo. Es una especie objetivo de conservación del área protegida Stepa Casimcea.
    visit: >-
      Casimcea es el pueblo que da nombre a la meseta, y su término comparte territorio con el sitio ROSCI0201
      Podișul Nord Dobrogean, la zona de aves Stepa Casimcea y las reservas naturales Valea Mahomencea,
      Casimcea, Colțanii Mari y Războieni. Aquí nació y pasó su infancia Ion Jalea, uno de los escultores
      rumanos más conocidos.
    history: >-
      La meseta de Dobrogea central es la unidad morfoestructural más antigua de Rumanía y quedó nivelada por
      procesos de erosión desde el Paleozoico temprano. El término municipal de Casimcea se asienta en dos
      subunidades: Podișul Gârliciului y Podișul Casimcei. En el municipio se superponen el sitio Podișul Nord
      Dobrogean, el área esteparia Stepa Casimcea y varias reservas naturales. El suslik ocupa pastos junto a
      terrenos agrícolas en todo el sitio salvo en los pastos arbolados.
    before: >-
      No hay rutas, observatorios ni centros de visitantes publicados para esta meseta. Lo mejor es ir entre
      primavera y otoño y concretar con el gestor del sitio qué sectores se pueden visitar.
    around: >-
      A veintiséis kilómetros está el [Parque Nacional Montañas de
      Măcin](/lugar/parcul-national-muntii-macinului/). Otros lugares comparten con Casimcea el suslik y el
      halcón sacre: el [Parque Nacional Körös-Maros](/lugar/koros-maros-nemzeti-park/), la [Reserva Natural
      Especial Arenales de Deliblato](/lugar/specijalni-rezervat-prirode-deliblatska/) y el [Parque Natural
      Stara Planina](/lugar/park-prirode-stara-planina/). El [Parque Nacional del
      Bükk](/lugar/bukki-nemzeti-park/) comparte el halcón sacre, en estepa y karst.
  en:
    intro: >-
      You stand upon Romania's oldest geological ground. The Casimcea plateau in central Dobrogea emerged
      during the ancient Baikalian tectonic epoch, founded upon Precambrian green schists that represent the
      nation's most archaic exposed bedrock. Today it forms an undulating expanse of wide open steppe under
      vast skies, where rolling contours barely rise and circling birds of prey bring the heavens to life.
    landscape: >-
      Two major tectonic faults define its perimeter: the Peceneaga-Camena fault along the north, and the
      Capidava-Ovidiu fault to the south. Between these boundaries lies an eroded horst of Precambrian green
      schists blanketted by thick loess deposits. Average elevations range between 150-200 metres, culminating
      at Dealul La Pandele at 395 metres. The central plateau displays gently rolling, low-relief topography,
      where weathered outcrops of green schist known locally as phyllites pierce the mantle of loess.


      Toward the Danube the scenery transforms. Deeply incised, steep-sided valleys cleave the plateau: the
      canyons of Casimcea, Corugea, and Haidarului. These craggy valleys, where modest seasonal streams
      cascade past rocky sills, contrast sharply with the dry, open steppe above. The local climate is
      temperate semi-arid, averaging eleven degrees Celsius annually with under 350 millimetres of rainfall.
      Diverse plant communities mosaic across the plateau, including steppe grassland, wooded steppe, and
      ancient oak groves such as Stepa Casimcea, Pădurea Alecsandri, and Pădurea Iepurelui.


      To the southeast, Mesozoic limestones foster distinctive karst features with sinkholes, diminutive caves
      like La Adam and Gura Dobrogei, and the striking defile of Cheile Gura Dobrogei. Within the Casimcea
      valley between Cheia, Târgușor, and Gura Dobrogei, speleologists have catalogued fifteen caverns of
      major archaeological and paleontological significance.
    wildlife: >-
      This mosaic of sparse woodlands, dry steppe pastures, and arable fields supports an exceptional
      community of birds, including thirty species of Community interest and five globally threatened taxa.
      Nesting residents include the [Eurasian stone-curlew](/especie/burhinus_oedicnemus/), two species of
      steppe larks, woodlark, tawny pipit, short-toed snake eagle, and [long-legged
      buzzard](/especie/buteo_rufinus/).


      During seasonal migration the skies fill with movement. The undulating relief creates strong thermal
      updrafts favored by soaring birds, making the plateau an indispensable flyway for raptors like the
      lesser spotted eagle, [European honey buzzard](/especie/pernis_apivorus/), [western marsh
      harrier](/especie/circus_aeruginosus/), [red-footed falcon](/especie/falco_vespertinus/), [Montagu's
      harrier](/especie/circus_pygargus/), booted eagle, pallid harrier, and short-toed snake eagle. In a
      single season, more than fifty thousand white storks and over four hundred [black
      storks](/especie/ciconia_nigra/) ride these winds. Thirty-seven migratory avian species breed,
      overwinter, or stage here during their journeys.


      On the open ground thrives the [European ground squirrel](/especie/spermophilus_citellus/), living in
      loose colonies where each animal excavates an independent burrow system, hibernating without hoarding
      food stores. It serves as prime prey for diurnal raptors, owls, and mammalian carnivores; the rare
      [saker falcon](/especie/falco_cherrug/) relies almost exclusively upon it. This noble falcon winters in
      Africa and Arabia, returning to its breeding grounds in early March as a primary target of conservation
      efforts within the Stepa Casimcea protected territory.
    visit: >-
      Casimcea is the historic rural settlement that gives its name to the plateau, sharing boundaries with
      site ROSCI0201 Podișul Nord Dobrogean, the Stepa Casimcea special bird protection area, and the nature
      reserves of Valea Mahomencea, Casimcea, Colțanii Mari, and Războieni. The village was the childhood
      birthplace of Ion Jalea, one of Romania's most distinguished twentieth-century sculptors.
    history: >-
      The central Dobrogean plateau is Romania's most ancient morphostructural unit, continuously planed by
      weathering since the early Paleozoic. The administrative commune of Casimcea spans two regional
      subunits: Podișul Gârliciului and Podișul Casimcei. The municipality integrates several overlapping
      protected classifications under the Podișul Nord Dobrogean network and Stepa Casimcea. Ground squirrels
      populate short-grass pastures bordering farm plots throughout the territory, shunning only dense wooded
      pastures.
    before: >-
      There are no formal marked tourist itineraries, birdwatching hides, or visitor centres on this plateau.
      Plan your visit between spring and autumn, and coordinate beforehand with the site management authority
      regarding accessible conservation sectors.
    around: >-
      Twenty-six kilometres to the north rises [Măcin Mountains National
      Park](/lugar/parcul-national-muntii-macinului/). Other conservation areas sharing the ground squirrel
      and saker falcon include [Körös-Maros National Park](/lugar/koros-maros-nemzeti-park/), [Deliblato Sands
      Special Nature Reserve](/lugar/specijalni-rezervat-prirode-deliblatska/), [Bükk National
      Park](/lugar/bukki-nemzeti-park/), and [Stara Planina Nature Park](/lugar/park-prirode-stara-planina/).
  fr:
    intro: >-
      Vous foulez le sol géologique le plus ancien de Roumanie. Le plateau de Casimcea, au centre de la
      Dobroudja, s'est constitué lors des plissements baïkaliens sur des schistes verts précambriens, les
      roches les plus vénérables du pays. C'est aujourd'hui une steppe ondulée aux horizons infinis, où le
      relief s'élève à peine et où les rapaces animent la voûte céleste.
    landscape: >-
      Deux failles majeures le délimitent : celle de Peceneaga-Camena au nord et celle de Capidava-Ovidiu au
      sud. Entre les deux s'étend un horst arasé de schistes verts nappé d'épais dépôts de loess. Les
      altitudes moyennes oscillent entre 150-200 mètres, La Pandele culminant à 395 mètres. Le centre présente
      un relief doucement vallonné, où affleurent ponctuellement à travers le loess des schistes verts appelés
      phyllades.


      Vers le Danube, le paysage se métamorphose. Des vallées étroites et encaissées aux versants abrupts
      entaillent le plateau : les vallées de Casimcea, de Corugea et de Haidarului. Ces défilés rocheux aux
      seuils de pierre où serpentent de modestes ruisseaux contrastent avec l'aridité de la steppe
      environnante. Le climat est tempéré semi-aride, avec une moyenne annuelle de onze degrés et moins de 350
      millimètres de pluie. Le secteur associe steppe rase, steppe boisée et massifs forestiers comme Stepa
      Casimcea, Pădurea Alecsandri et Pădurea Iepurelui.


      Au sud-est, les calcaires engendrent un relief karstique ponctué de dolines, de grottes telles La Adam
      et Gura Dobrogei et des gorges pittoresques de Cheile Gura Dobrogei. Dans la vallée de Casimcea, entre
      Cheia, Târgușor et Gura Dobrogei, quinze cavités d'un intérêt archéologique et paléontologique
      exceptionnel ont été répertoriées.
    wildlife: >-
      Cette mosaïque de boisements, pelouses steppiques et cultures permet la cohabitation d'une avifaune
      remarquable : trente espèces d'intérêt communautaire et cinq menacées au niveau mondial. Y nidifient
      l'[œdicnème criard](/especie/burhinus_oedicnemus/), deux alouettes steppiques, l'alouette lulu, le pipit
      rousseline, le circaète Jean-le-Blanc et la [buse féroce](/especie/buteo_rufinus/).


      Lors des migrations, le ciel s'anime d'un ballet continu. Les collines engendrent des courants
      thermiques ascendants propices au vol à voile, faisant de la steppe une halte clé pour les rapaces comme
      l'aigle pomarin, la [bondrée apivore](/especie/pernis_apivorus/), le [busard des
      roseaux](/especie/circus_aeruginosus/), le [faucon kobez](/especie/falco_vespertinus/), le [busard
      cendré](/especie/circus_pygargus/), l'aigle botté, le busard Saint-Martin et le circaète. En une seule
      saison transitent plus de cinquante mille cigognes blanches et plus de quatre cents [cigognes
      noires](/especie/ciconia_nigra/). Trente-sept espèces migratrices utilisent ce site pour nicher,
      hiverner ou faire étape.


      Au sol prospère le [souslik d'Europe](/especie/spermophilus_citellus/), rongeur colonial dont chaque
      individu creuse son propre terrier et hiberne sans amasser de réserves. Proie convoitée des prédateurs,
      il est indispensable à la subsistance du rare [faucon sacre](/especie/falco_cherrug/). Ce noble rapace
      hiverne en Afrique et en Arabie avant de regagner ses aires de nidification début mars, constituant une
      priorité de conservation majeure dans l'aire protégée Stepa Casimcea.
    visit: >-
      Casimcea est la localité éponyme du plateau, dont le territoire municipal englobe le site ROSCI0201
      Podișul Nord Dobrogean, la zone de protection spéciale Stepa Casimcea et les réserves naturelles de
      Valea Mahomencea, Casimcea, Colțanii Mari et Războieni. C'est le village natal d'Ion Jalea, l'un des
      sculpteurs roumains les plus célèbres.
    history: >-
      Le plateau de Dobroudja centrale constitue la plus vieille unité morphostructurale de Roumanie, aplanie
      par l'érosion depuis le Paléozoïque ancien. Le territoire de Casimcea s'étend sur deux sous-unités :
      Podișul Gârliciului et Podișul Casimcei. Y coexistent le site Podișul Nord Dobrogean et plusieurs
      réserves naturelles. Le souslik colonise les pâturages herbeux en lisière des cultures, évitant les
      boisements denses.
    before: >-
      Aucun sentier balisé, observatoire ou centre d'accueil n'est aménagé sur le plateau de Casimcea.
      Privilégiez une visite entre le printemps et l'automne en vous renseignant auprès des gestionnaires du
      site sur les secteurs accessibles.
    around: >-
      À vingt-six kilomètres au nord se trouve le [parc national des monts
      Măcin](/lugar/parcul-national-muntii-macinului/). D'autres espaces partagent souslik et faucon sacre :
      le [parc national Körös-Maros](/lugar/koros-maros-nemzeti-park/), la [réserve naturelle de
      Deliblato](/lugar/specijalni-rezervat-prirode-deliblatska/), le [parc national de
      Bükk](/lugar/bukki-nemzeti-park/) et le [parc naturel de Stara
      Planina](/lugar/park-prirode-stara-planina/).
  de:
    intro: >-
      Du betrittst den geologisch ältesten Boden Rumäniens. Die Casimcea-Hochebene im Herzen der Dobrudscha
      entstand während der baikalischen Faltungsphase und ruht auf präkambrischen Grünschiefern, dem ältesten
      Grundgebirge des Landes. Heute breitet sich hier eine wellige Steppenlandschaft unter weitem Himmel aus,
      über deren sanften Hügeln zahlreiche Greifvögel kreisen.
    landscape: >-
      Zwei markante tektonische Bruchlinien rahmen das Plateau ein: die Peceneaga-Camena-Störung im Norden und
      die Capidava-Ovidiu-Störung im Süden. Dazwischen liegt ein abgetragener Grünschiefer-Horst, der von
      mächtigem Löss bedeckt ist. Die durchschnittlichen Höhen bewegen sich zwischen 150-200 Metern; La
      Pandele bildet mit 395 Metern den höchsten Punkt. Das Zentrum ist sanft gewellt und wenig zerklüftet,
      wobei verwitterte Grünschieferfelsen, sogenannte Phyllite, die Lössdecke durchragen.


      Zur Donau hin wandelt sich das Bild grundlegend. Tiefe, enge Schluchttäler mit steilen Hängen
      zerschneiden die Hochebene: die Täler von Casimcea, Corugea und Haidarului. Diese felsigen Schluchten
      mit Bachstufen und spärlichen Wasserläufen heben sich reizvoll von der trockenen Steppe ab. Das Klima
      ist gemäßigt halbtrocken mit elf Grad Jahresmitteltemperatur und weniger als 350 Millimetern
      Niederschlag. Die Vegetation wechselt zwischen Grassteppe, Waldsteppe und Eichenwäldern wie Stepa
      Casimcea, Pădurea Alecsandri und Pădurea Iepurelui.


      Im Südosten bilden jurassische Kalke ein Karstrelief mit Dolinen, kleinen Höhlen wie La Adam und Gura
      Dobrogei sowie der Schlucht Cheile Gura Dobrogei. Im Casimcea-Tal zwischen Cheia, Târgușor und Gura
      Dobrogei wurden fünfzehn Höhlen von hohem paläontologischem Wert entdeckt.
    wildlife: >-
      Das Mosaik aus Gehölzen, Steppenrasen und Agrarflächen bietet Lebensraum für zahlreiche Vögel, darunter
      dreißig Arten von gemeinschaftlichem Interesse und fünf weltweit gefährdete Sippen. Regelmäßig brüten
      hier der [Triel](/especie/burhinus_oedicnemus/), zwei Steppenlerchenarten, Heidelerche, Brachpieper,
      Schlangenadler und [Adlerbussard](/especie/buteo_rufinus/).


      Während der Zugzeiten belebt sich der Himmel ungemein. Die Hügelketten erzeugen thermische Aufwinde, die
      Greifvögeln weite Gleitflüge ermöglichen: Schreiadler, [Wespenbussard](/especie/pernis_apivorus/),
      [Rohrweihe](/especie/circus_aeruginosus/), [Rotfußfalke](/especie/falco_vespertinus/),
      [Wiesenweihe](/especie/circus_pygargus/), Zwergadler, Kornweihe und Schlangenadler ziehen durch. Pro
      Saison überqueren mehr als fünfzigtausend Weißstörche und über vierhundert
      [Schwarzstörche](/especie/ciconia_nigra/) das Areal. Siebenunddreißig wandernde Vogelarten rasten,
      brüten oder überwintern hier.


      Am Boden lebt der [Europäische Ziesel](/especie/spermophilus_citellus/), der Kolonien bildet, in denen
      jedes Tier einen eigenen Erdbau bewohnt und ohne Wintervorräte winterschläft. Er dient Beutegreifern als
      Hauptnahrung; der seltene [Sakerfalke](/especie/falco_cherrug/) ist eng an ihn gebunden. Der Falke
      überwintert in Afrika und Arabien und kehrt Anfang März zurück, weshalb er ein prioritäres Schutzziel
      des Reservats Stepa Casimcea darstellt.
    visit: >-
      Casimcea ist die namensgebende Ortschaft der Hochebene; ihr Gemeindegebiet überschneidet sich mit dem
      Gebiet ROSCI0201 Podișul Nord Dobrogean, dem Vogelschutzgebiet Stepa Casimcea sowie den Naturreservaten
      Valea Mahomencea, Casimcea, Colțanii Mari und Războieni. Hier verbrachte der renommierte Bildhauer Ion
      Jalea seine Jugendjahre.
    history: >-
      Die zentrale Dobrudscha-Hochebene ist die älteste morphostrukturelle Einheit Rumäniens, die seit dem
      frühen Paläozoikum durch Erosion eingeebnet wurde. Das Gebiet von Casimcea umfasst zwei naturräumliche
      Einheiten: Podișul Gârliciului und Podișul Casimcei. Mehrere Schutzgebietskategorien greifen hier
      ineinander. Der Ziesel bewohnt kurzgrasige Weiden und Feldraine im gesamten Schutzgebiet, meidet jedoch
      geschlossene Gehölze.
    before: >-
      Auf der Casimcea-Hochebene gibt es weder ausgeschilderte Wanderwege noch Beobachtungstürme oder
      Informationszentren. Am besten bereist du das Gebiet zwischen Frühling und Herbst nach Rücksprache mit
      der Gebietsverwaltung.
    around: >-
      Sechsundzwanzig Kilometer nördlich liegt der [Nationalpark
      Măcin-Gebirge](/lugar/parcul-national-muntii-macinului/). Ziesel und Sakerfalke teilen sich auch der
      [Nationalpark Körös-Maros](/lugar/koros-maros-nemzeti-park/), das [Sondernaturreservat
      Deliblato-Sand](/lugar/specijalni-rezervat-prirode-deliblatska/), der [Nationalpark
      Bükk](/lugar/bukki-nemzeti-park/) und der [Naturpark Stara Planina](/lugar/park-prirode-stara-planina/).
  it:
    intro: >-
      Cammini sul suolo geologico più antico della Romania. L'altopiano di Casimcea, nel centro della
      Dobrugia, ebbe origine durante l'orogenesi baikaliana su scisti verdi del Precambriano, le formazioni
      rocciose più arcaiche del paese. Oggi si presenta come una steppa dolcemente ondulata dagli orizzonti
      sconfinati, dove il cielo è solcato da numerosi rapaci.
    landscape: >-
      Due faglie tettoniche maggiori ne delimitano i margini: quella di Peceneaga-Camena a nord e quella di
      Capidava-Ovidiu a sud. Tra di esse si estende un horst spianato di scisti verdi ricoperto da spessi
      depositi di loess. Le altitudini medie si aggirano sui 150-200 metri, toccando il culmine su La Pandele
      a 395 metri. Il nucleo centrale mostra rilievi morbidi poco frammentati, dove dal loess affiorano scisti
      verdi noti come filladi.


      Verso il Danubio la fisionomia muta radicalmente. Valli strette e dirupate incidono l'altopiano: quelle
      di Casimcea, Corugea e Haidarului. Queste forre rocciose lambite da modesti corsi d'acqua contrastano
      con l'aridità della steppa circostante. Il clima è temperato semiarido, con media termica annua di
      undici gradi e precipitazioni inferiori a 350 millimetri. Il paesaggio alterna steppa erbosa, steppa
      arborata e boschi termofili come Stepa Casimcea, Pădurea Alecsandri e Pădurea Iepurelui.


      A sud-est i calcari generano forme carsiche con doline, piccole cavità come La Adam e Gura Dobrogei e la
      suggestiva forra di Gura Dobrogei. Nella valle di Casimcea tra Cheia, Târgușor e Gura Dobrogei sono
      state censite quindici caverne di primaria importanza paleontologica e archeologica.
    wildlife: >-
      Il mosaico di formazioni boschive, steppe e seminativi consente la presenza di molteplici specie
      aviarie, tra cui trenta di interesse comunitario e cinque minacciate globalmente. Vi nidificano
      regolarmente l'[occhione](/especie/burhinus_oedicnemus/), due specie di allodole steppiche, la
      tottavilla, il calandro, il biancone e la [poiana codabianca](/especie/buteo_rufinus/).


      Nelle stagioni di passo i flussi migratori animano il cielo. Le colline creano correnti ascensionali
      favorevoli al volteggio dei rapaci come l'aquila anatraia minore, il [falco
      pecchiaiolo](/especie/pernis_apivorus/), il [falco di palude](/especie/circus_aeruginosus/), il [falco
      cuculo](/especie/falco_vespertinus/), l'[albanella minore](/especie/circus_pygargus/), l'aquila minore,
      l'albanella reale e il biancone. In una sola stagione sorvolano l'altopiano oltre cinquantamila cicogne
      bianche e più di quattrocento [cicogne nere](/especie/ciconia_nigra/). Trentasette specie migratrici
      sostano, svernano o nidificano nell'area protetta.


      Al suolo è comune il [citello europeo](/especie/spermophilus_citellus/), che vive in colonie dove ogni
      individuo scava la propria tana e va in letargo senza accumulare scorte. Rappresenta una preda cruciale
      per i rapaci; il raro [falco sacro](/especie/falco_cherrug/) dipende strettamente da esso. Il sacro
      sverna in Africa e Arabia e torna a inizio marzo, figurando come specie prioritaria di tutela nella
      riserva Stepa Casimcea.
    visit: >-
      Casimcea è il borgo rurale che dà il nome all'altopiano, il cui territorio condivide il sito ROSCI0201
      Podișul Nord Dobrogean, la zona di protezione speciale Stepa Casimcea e le riserve naturali di Valea
      Mahomencea, Casimcea, Colțanii Mari e Războieni. Qui nacque lo scultore romeno Ion Jalea.
    history: >-
      L'altopiano della Dobrugia centrale rappresenta l'unità morfostrutturale più arcaica della Romania,
      livellata da processi erosivi sin dal Paleozoico inferiore. L'area comunale di Casimcea abbraccia le due
      sotto-unità Podișul Gârliciului e Podișul Casimcei. Diversi vincoli naturalistici si sovrappongono
      nell'area. Il citello frequenta i pascoli adiacenti ai coltivi, evitando i boschi chiusi.
    before: >-
      Non vi sono sentieri segnati, capanni di osservazione o centri visitatori sull'altopiano di Casimcea.
      Pianifica l'escursione tra primavera e autunno consultando preventivamente l'ente gestore del sito.
    around: >-
      A ventisei chilometri a nord sorge il [Parco nazionale dei Monti
      Măcin](/lugar/parcul-national-muntii-macinului/). Altre aree protette che ospitano citello e falco sacro
      sono il [Parco nazionale Körös-Maros](/lugar/koros-maros-nemzeti-park/), la [Riserva naturale di
      Deliblato](/lugar/specijalni-rezervat-prirode-deliblatska/), il [Parco nazionale di
      Bükk](/lugar/bukki-nemzeti-park/) e il [Parco naturale di Stara
      Planina](/lugar/park-prirode-stara-planina/).
  pt:
    intro: >-
      Pisas o solo geológico mais arcaico da Roménia. O planalto de Casimcea, no centro de Dobruja, formou-se
      durante a orogenia baikaliana assente sobre xistos verdes pré-câmbricos, as rochas mais antigas do país.
      É hoje uma estepe ondulada de horizontes amplos, onde o relevo mal se eleva e as aves de rapina cruzam
      os céus.
    landscape: >-
      Duas falhas tectónicas delimitam o planalto: a de Peceneaga-Camena a norte e a de Capidava-Ovidiu a sul.
      Entre ambas estende-se um horst aplanado de xistos verdes coberto por espessos lençóis de loesse. As
      altitudes médias rondam os 150-200 metros, atingindo La Pandele o ponto mais elevado aos 395 metros. O
      setor central ostenta relevo suave e pouco retalhado, onde rochas de xisto verde chamadas filades
      afloram através do loesse.


      Rumo ao Danúbio, a orografia transforma-se. Vales fundos e estreitos de margens abruptas sulcam o
      planalto: os canhões de Casimcea, Corugea e Haidarului. Estas gargantas pedregosas onde correm ribeiros
      de caudal modesto contrastam com a aridez da estepe plana. O clima é temperado semiárido, com média
      térmica anual de onze graus e precipitações inferiores a 350 milímetros. A paisagem combina estepe
      campestre, estepe arborizada e matas como Stepa Casimcea, Pădurea Alecsandri e Pădurea Iepurelui.


      A sudeste, os calcários originam modelado cársico com dolinas, pequenas grutas como La Adam e Gura
      Dobrogei e o desfiladeiro de Gura Dobrogei. No vale de Casimcea, entre Cheia, Târgușor e Gura Dobrogei,
      estão inventariadas quinze cavernas de grande relevância arqueológica e paleontológica.
    wildlife: >-
      O mosaico de pequenos bosques, pastagens estepárias e searas propicia a ocorrência de numerosas aves,
      incluindo trinta espécies de interesse comunitário e cinco ameaçadas a nível global. Nidificam o
      [alcaravão](/especie/burhinus_oedicnemus/), duas cotovias estepárias, a cotovia-pequena, a
      petinha-dos-campos, a águia-cobreira e o [bútio-rabo-canela](/especie/buteo_rufinus/).


      Nas migrações o céu transforma-se num corredor movimentado. As colinas criam correntes térmicas ideais
      para o voo planado de rapinas como a águia-pomarina, o [tartaranhão-apívoro](/especie/pernis_apivorus/),
      o [tartaranhão-ruivo-dos-pauis](/especie/circus_aeruginosus/), o
      [falcão-de-pés-vermelhos](/especie/falco_vespertinus/), o
      [tartaranhão-caçador](/especie/circus_pygargus/), a águia-calçada, o tartaranhão-azulado e a
      águia-cobreira. Numa só temporada passam mais de cinquenta mil cegonhas-brancas e mais de quatrocentas
      [cegonhas-pretas](/especie/ciconia_nigra/). Trinta e sete espécies migradoras utilizam o sítio para
      procriar, invernar ou descansar.


      No solo vive o [esquilo-terrestre-europeu](/especie/spermophilus_citellus/), roedor que forma colónias
      onde cada exemplar escava a sua toca individual, hibernando sem aprovisionamento. Constitui presa vital
      para os carnívoros; o raro [falcão-sacre](/especie/falco_cherrug/) depende diretamente da sua
      abundância. O sacre inverna em África e Arábia, regressando aos sítios de nidificação no início de
      março, sendo espécie prioritária de preservação na reserva Stepa Casimcea.
    visit: >-
      Casimcea é a aldeia que dá o nome ao planalto, partilhando o perímetro administrativo com o sítio
      ROSCI0201 Podișul Nord Dobrogean, a zona de proteção especial Stepa Casimcea e as reservas de Valea
      Mahomencea, Casimcea, Colțanii Mari e Războieni. Aqui nasceu o notável escultor romeno Ion Jalea.
    history: >-
      O planalto da Dobruja central constitui a unidade morfoestrutural mais antiga da Roménia, nivelada pela
      erosão desde o Paleozoico inferior. O território de Casimcea reparte-se pelas subunidades Podișul
      Gârliciului e Podișul Casimcei. Várias figuras de proteção sobrepõem-se no concelho. O esquilo-terrestre
      ocupa pastagens contíguas aos campos agrícolas, evitando apenas os bosques cerrados.
    before: >-
      Não existem trilhos marcados, postos de vigia ou centros de acolhimento no planalto de Casimcea. Visita
      o território entre a primavera e o outono e articula previamente com os serviços gestores quais as áreas
      autorizadas.
    around: >-
      A vinte e seis quilómetros a norte situa-se o [Parque Nacional dos Montes
      Măcin](/lugar/parcul-national-muntii-macinului/). Outros espaços que partilham esquilo-terrestre e
      falcão-sacre são o [Parque Nacional Körös-Maros](/lugar/koros-maros-nemzeti-park/), a [Reserva Natural
      de Deliblato](/lugar/specijalni-rezervat-prirode-deliblatska/), o [Parque Nacional de
      Bükk](/lugar/bukki-nemzeti-park/) e o [Parque Natural de Stara
      Planina](/lugar/park-prirode-stara-planina/).
