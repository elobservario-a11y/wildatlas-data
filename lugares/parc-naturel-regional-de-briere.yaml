resumen:
  es: >-
    La segunda marisma más grande de Francia formada por laberintos de turberas e islas tradicionales de
    chozas con techo de paja.
  en: >-
    The second-largest marshland in France, featuring labyrinthine peat canals and traditional thatched island
    hamlets.
  fr: >-
    Le deuxième plus grand marais de France, formé de dédales de tourbières et d'îles aux toits de chaume
    traditionnels.
  de: Das zweitgrößte Moor- und Sumpfgebiet Frankreichs mit Wasserlabyrinthen und traditionellen Reetdachkaten.
  it: >-
    La seconda palude più vasta di Francia, formata da canali torbosi e tradizionali villaggi insulari dai
    tetti di paglia.
  pt: >-
    A segunda maior zona húmida de França, formada por labirintos de turfeiras e ilhas com tradicionais
    cabanas de colmo.
unico:
  es: >-
    Un carrizal de 8 000 ha con el bastión francés de la curruca zarcerilla, una de las mayores poblaciones de
    avetoro y un pueblo entero de casas de paja.
  en: >-
    An 8,000 ha reedbed holding the French stronghold of the aquatic warbler, a key bittern population, and an
    entire thatched village.
  fr: >-
    Une roselière de 8 000 ha abritant le bastion français du phragmite des joncs, de nombreux butors étoilés
    et tout un village de chaumières.
  de: >-
    Ein 8.000 ha großes Schilfmeer als französische Hochburg des Schilfrohrsängers, Refugium der Rohrdommel
    und ein ganzes Reetdorf.
  it: >-
    Un canneto di 8.000 ha che costituisce il bastione francese del forapaglie comune, un rifugio chiave del
    tarabuso e un intero borgo di chaumière.
  pt: >-
    Um caniçal de 8.000 ha acolhendo o bastião francês da felosa-dos-juncos, uma população vital de abetouro e
    uma aldeia inteira de colmo.
observaciones:
  es: >-
    Pierre Constant solo abre de abril a octubre, y a Fédrun se entra únicamente con la visita guiada. Para
    recorrer a pie Brière, mira antes los niveles del agua.
texto:
  es:
    intro: >-
      En primavera, desde un tallo de caña, un pajarillo lanza un trino sostenido de unas cincuenta notas por
      segundo que puede durar de diez a treinta segundos. Es la curruca zarcerilla, y el carrizal de Brière es
      su bastión en Francia: unos mil pares. Brière, al noroeste del estuario del Loira, en Loira Atlántico,
      es un mundo de marismas, canales y casas de paja del que el parque natural regional protege 54 800
      hectáreas desde 1970. Sus carrizales ocupan 8 000 ha y están entre los más importantes de Francia.
    landscape: >-
      Brière es sobre todo agua y caña. Los carrizales no son solo un decorado: protegen las orillas, depuran
      y oxigenan el agua, retienen sedimentos y fijan metales pesados. Y fueron, durante siglos, un recurso:
      de ellos salía la paja para los techos, la cama para el ganado, los cortavientos y las empalizadas.


      Los techos de caña son el rasgo del paisaje. En Brière hay unos 3 000 tejados de paja: es la región de
      Francia con mayor densidad de casas de cañas. Son un hábitat tradicional típico del siglo XVII, ligado a
      las actividades agrarias y a los territorios de marisma. Hoy se techa con caña, Phragmites australis, y
      antes se usaron el centeno y el junco recogidos en la zona. Un techo dura unos 30 años y requiere
      vigilancia y mantenimiento.
    wildlife: >-
      **Primavera.** Es la época de la curruca zarcerilla: el bastión francés, de unos mil pares, se oye sin
      esfuerzo. Entre los paseriformes de los carrizales también están el pechiazul, el carricero común y el
      bigotudo. El pechiazul de espejo blanco de Nantes es una subespecie endémica cuyo principal bastión es
      la población de Brière; se anilla cada año en primavera y verano, y los estudios han revelado que sus
      sitios de invernada están sobre todo en Portugal.


      **Todo el año.** Los carrizales acogen probablemente la mayor población de curruca zarcerilla y una de
      las principales del [avetoro](/especie/botaurus_stellaris/); ambas especies están en fuerte declive en
      Francia y en Europa. En las orillas de los carrizales se puede observar además la [garza
      imperial](/especie/ardea_purpurea/). El parque estudia las poblaciones de aves amenazadas de los
      carrizales y usa los resultados para ajustar su gestión.


      **Otoño.** Los marais de Brière son una escala migratoria de importancia internacional: destacan el
      pájaro moscón y el [carricerín cejudo](/especie/acrocephalus_paludicola/), que descansan y se alimentan
      en su viaje hacia África.
    visit: >-
      Hay dos entradas, una para la naturaleza y otra para el pueblo.


      **Pierre Constant.** El sitio Pierre Constant es el único de los tres sectores de la reserva regional
      abierto al público, a un kilómetro del puerto de Rozé (Saint-Malo de Guersac), y se visita de abril a
      octubre. Tiene un observatorio, una exposición sobre la historia y la naturaleza de Brière y acceso a un
      segundo observatorio con un guía naturalista, en visita guiada gratuita. Los otros dos sectores, los
      Grands Charreaux, al sur, y el Charreau de Pendille, al norte, están en la Grande Brière Mottière. Antes
      fue un parque animal que Pierre Constant, universitario de Rennes, ideó con 25 hectáreas para resumir lo
      que hay en Brière; abrió en 1980, y desde 2004 es una reserva natural de vocación ornitológica.


      **Kerhinet.** La aldea de Kerhinet, con 18 casas de paja, se compró en los años setenta para restaurarla
      como escaparate del hábitat tradicional de Brière. Es peatonal, tiene dos senderos de interpretación
      para hacer sin guía y es el punto de partida de muchas rutas; la Maison du Parc informa a los visitantes
      y tiene un espacio de exposiciones. La red del parque suma setecientos kilómetros de itinerarios
      señalizados para recorrer Brière a pie, y la vuelta GR de Pays Tour de Brière cubre sesenta y ocho
      kilómetros cuando lo permiten los niveles del agua.


      **Fédrun.** En la isla de Fédrun, la Chaumière Briéronne y la Maison de la Mariée se visitan de abril a
      noviembre solo con la visita guiada «Ile était une fois Fédrun…». El parque conserva unos 3300 objetos,
      sobre todo etnológicos, de la vida cotidiana en Brière en los siglos XIX y XX. La Maison de la Mariée es
      el mayor museo público de globos de novia.
    history: >-
      La reserva natural regional Marais de Brière se creó en 2012 al agrupar tres zonas de humedal, y en 2021
      se rediseñó ecológicamente Pierre Constant para favorecer a aves y peces y reducir las molestias de los
      visitantes.


      Kerhinet se había ido abandonando durante la primera mitad del siglo XX, y el Estado la inscribió en el
      inventario de sitios naturales el 13 de marzo de 1967. El parque, recién creado, la compró y la
      restauró.
    before: >-
      Pierre Constant solo abre de abril a octubre, y a Fédrun se entra únicamente con la visita guiada. Para
      recorrer a pie Brière, mira antes los niveles del agua.
    around: >-
      Lejos de aquí, el [Parque Natural de la Ria Formosa](/lugar/parque-natural-da-ria-formosa/) comparte con
      Brière la espátula común y la nutria, y las [Marismas Saladas del Mar de
      Frisia](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) la espátula común, como humedales
      costeros.
  en:
    intro: >-
      In spring, perched upon a sturdy reed stem, a tiny songbird delivers a rapid trill of some fifty notes
      per second that can sustain for ten to thirty seconds. This is the sedge warbler, and the reedbeds of
      Brière are its greatest stronghold in France: roughly one thousand breeding pairs. Brière, lying
      northwest of the Loire estuary in Loire-Atlantique, is a watery labyrinth of marshes, navigable canals
      and thatched cottages, of which the regional natural park protects 54,800 hectares since 1970. Its vast
      reedbeds cover 8,000 ha and rank among the most extensive in France.
    landscape: >-
      Brière is defined by open water and endless common reed. These vast reedbeds are far more than scenic
      decor: they stabilize soft peat shores, filter and oxygenate water, trap suspended sediments and
      immobilize heavy metals. For centuries they were also an indispensable economic resource: providing
      thatch for roofs, bedding for cattle, windbreaks and woven garden fencing.


      Thatched roofs are the defining hallmark of the landscape. Brière boasts roughly 3,000 thatched
      cottages: the densest concentration of thatched dwellings anywhere in France. They represent an
      indigenous vernacular architecture typical of the seventeenth century, intimately linked to traditional
      agricultural practices and peatland tenure. Today roofs are thatched with common reed (*Phragmites
      australis*), replacing earlier rye straw and rushes gathered locally. A well-laid thatch roof lasts
      around 30 years and requires regular stewardship.
    wildlife: >-
      Spring is the season of wetland songbirds: the French stronghold of the sedge warbler, about one
      thousand breeding pairs, rings out effortlessly across the water. Reedbed passerines also include the
      bluethroat, Eurasian reed warbler and bearded reedling. The Nantes white-spotted bluethroat is an
      endemic subspecies whose principal national breeding population nests in Brière; annually ringed in
      spring and summer, banding studies have demonstrated that its wintering grounds lie primarily in
      Portugal.


      Throughout the year, the extensive reed tracts harbour possibly the largest population of sedge warblers
      and one of the principal national strongholds of the [Eurasian bittern](/especie/botaurus_stellaris/);
      both species face steep declines across France and Western Europe. Along the marsh margins you can also
      watch the [purple heron](/especie/ardea_purpurea/). The park continuously monitors threatened wetland
      avifauna to calibrate marsh water levels.


      In autumn, the Brière marshes serve as an internationally significant migratory stepping stone: notable
      migrants include the Eurasian penduline tit and the globally vulnerable [aquatic
      warbler](/especie/acrocephalus_paludicola/), pausing to feed and rest en route to Africa.
    visit: >-
      The park offers two primary gateways: one focused on natural ecosystems and another dedicated to
      traditional village heritage.


      The Pierre Constant site is the sole sector among the regional nature reserve's three parcels open to
      the general public, located one kilometre from the port of Rozé in Saint-Malo-de-Guersac, welcoming
      visitors from April to October. It features an interpretive exhibit on Brière's history, an observation
      hide, and access to a second panoramic blind accompanied by a nature guide on free scheduled tours. The
      two remaining parcels, Grands Charreaux to the south and Charreau de Pendille to the north, lie deep in
      the Grande Brière Mottière. Originally conceived on 25 hectares by University of Rennes academic Pierre
      Constant as an educational wildlife sanctuary, it opened in 1980 and has operated since 2004 as an
      ornithological nature reserve.


      The hamlet of Kerhinet, encompassing 18 preserved thatched cottages, was acquired in the seventies by
      the park to create an authentic living showcase of traditional Brière architecture. Entirely
      pedestrianised, it offers two self-guided interpretation loops and acts as the nexus for numerous hiking
      routes; the Maison du Parc provides visitor guidance and temporary exhibitions. The regional park
      network totals seven hundred kilometres of waymarked footpaths, while the GR de Pays Tour de Brière loop
      covers sixty-eight kilometres when seasonal water levels allow.


      On the island of Fédrun, the Chaumière Briéronne and the Maison de la Mariée can be visited from April
      to November exclusively via the guided tour "Ile était une fois Fédrun...". The park curates some 3300
      ethnographic artefacts illuminating nineteenth- and twentieth-century daily life, while the Maison de la
      Mariée displays the largest public collection of bridal wax globe domes.
    history: >-
      The Marais de Brière Regional Nature Reserve was established in 2012 by uniting three key wetland
      parcels, and in 2021 the Pierre Constant reserve was ecologically redesigned to enhance bird and fish
      habitats while reducing visitor disturbance.


      Kerhinet had gradually emptied during the first half of the twentieth century, leading the French state
      to designate it a protected historic site on 13 March 1967. The nascent regional park promptly purchased
      the hamlet and spearheaded its meticulous restoration.
    before: >-
      Pierre Constant is open only from April to October, and Fédrun heritage buildings can be entered solely
      on guided tours. Before hiking across Brière footpaths, check current water levels.
    around: >-
      Far away, [Ria Formosa Natural Park](/lugar/parque-natural-da-ria-formosa/) shares with Brière the
      Eurasian spoonbill and European otter, and the [Wadden Sea Salt
      Marshes](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) the spoonbill, as great European coastal
      wetlands.
  fr:
    intro: >-
      Au printemps, perché sur une tige de roseau, un passereau lance un trille soutenu d'une cinquantaine de
      notes par seconde pouvant durer de dix à trente secondes. C'est le phragmite des joncs, et la roselière
      de Brière est son bastion en France : environ mille couples. La Brière, au nord-ouest de l'estuaire de
      la Loire, en Loire-Atlantique, est un univers de marais, canaux et chaumières dont le parc naturel
      régional protège 54 800 hectares depuis 1970. Ses roselières couvrent 8 000 ha et figurent parmi les
      plus vastes de France.
    landscape: >-
      La Brière est avant tout eau et roseaux. Les roselières ne sont pas un simple décor : elles protègent
      les berges, dépurent et oxygènent l'eau, piègent les sédiments et fixent les métaux lourds. Elles ont
      constitué durant des siècles une ressource essentielle, fournissant la matière première pour la toiture
      des chaumières, la litière du bétail, les brise-vent et les palissades.


      Les toits de chaume signent l'identité du paysage. La Brière rassemble environ 3 000 toits de chaume :
      c'est la région de France qui présente la plus forte densité de chaumières. Il s'agit d'un habitat
      traditionnel typique du XVIIe siècle, intimement lié aux activités rurales et aux terroirs tourbeux. On
      couvre aujourd'hui avec le roseau, *Phragmites australis*, qui a remplacé le seigle et le jonc autrefois
      récoltés sur place. Une toiture dure environ 30 ans et exige un entretien vigilant.
    wildlife: >-
      Le printemps est la saison reine des passereaux paludicoles : le bastion français du phragmite des
      joncs, comptant environ mille couples, s'y entend sans difficulté. Parmi les oiseaux de la roselière
      vivent également la gorgebleue à miroir, la rousserolle effarvatte et la panure à moustaches. La
      gorgebleue à miroir blanc de Nantes est une sous-espèce endémique dont la population de Brière forme le
      principal réservoir ; baguée chaque année, les suivis ont révélé que ses quartiers d'hivernage se
      situent principalement au Portugal.


      Toute l'année, les roselières accueillent une population majeure de phragmite des joncs et l'un des
      noyaux reproducteurs les plus importants du [butor étoilé](/especie/botaurus_stellaris/), deux espèces
      en net recul en Europe. Sur les bordures se nourrit le [héron pourpré](/especie/ardea_purpurea/). Le
      parc étudie la dynamique des oiseaux menacés pour guider sa gestion hydraulique.


      À l'automne, les marais de Brière constituent une halte migratoire de premier ordre, fréquentée par le
      rémiz penduline et le rare [phragmite aquatique](/especie/acrocephalus_paludicola/) en transit vers
      l'Afrique.
    visit: >-
      Deux portes d'entrée s'offrent aux visiteurs, l'une dédiée à la nature et l'autre au patrimoine bâti.


      Le site Pierre Constant est le seul des trois secteurs de la réserve naturelle régionale accessible au
      public, à un kilomètre du port de Rozé à Saint-Malo-de-Guersac, ouvert d'avril à octobre. Il propose une
      scénographie sur l'histoire et la faune briéronne, un observatoire et l'accès à un second poste avec
      guide naturaliste lors de visites commentées gratuites. Les deux autres secteurs, les Grands Charreaux
      au sud et le Charreau de Pendille au nord, se situent dans la Grande Brière Mottière. Conçu à l'origine
      sur 25 hectares par Pierre Constant, universitaire rennais, le site a ouvert en 1980 avant de devenir en
      2004 une réserve naturelle à vocation ornithologique.


      Le village de Kerhinet, réunissant 18 chaumières, a été acquis dans les années soixante-dix pour être
      restauré comme vitrine de l'habitat briéron traditionnel. Entièrement piétonnier, il offre deux sentiers
      d'interprétation en accès libre et constitue le point de départ de nombreuses randonnées ; la Maison du
      Parc accueille les visiteurs et abrite des expositions. Le réseau du parc totalise sept cents kilomètres
      d'itinéraires balisés pour parcourir la Brière à pied, et le GR de Pays Tour de Brière couvre
      soixante-huit kilomètres selon les niveaux d'eau.


      Sur l'île de Fédrun, la Chaumière Briéronne et la Maison de la Mariée se visitent d'avril à novembre
      uniquement lors de la visite guidée « Île était une fois Fédrun… ». Le parc conserve environ 3300 objets
      ethnologiques illustrant la vie quotidienne aux XIXe et XXe siècles. La Maison de la Mariée présente la
      plus vaste collection publique de globes de mariage.
    history: >-
      La réserve naturelle régionale des Marais de Brière a été instituée en 2012 en regroupant trois zones
      humides majeures, et en 2021 le site Pierre Constant a bénéficié d'un réaménagement écologique pour
      favoriser la faune aquatique tout en canalisant la fréquentation.


      Le village de Kerhinet s'était vidé d'habitants durant la première moitié du XXe siècle, conduisant
      l'État à l'inscrire à l'inventaire des sites pittoresques le 13 mars 1967. Le parc nouvellement créé
      s'en porta acquéreur pour mener une réhabilitation globale.
    before: >-
      Le site Pierre Constant ouvre uniquement d'avril à octobre, et les musées de Fédrun se découvrent
      exclusivement en visite guidée. Avant de partir randonner, vérifiez les niveaux d'eau dans les marais.
    around: >-
      Loin d'ici, le [parc naturel de la Ria Formosa](/lugar/parque-natural-da-ria-formosa/) partage avec la
      Brière la spatule blanche et la loutre, et les [marais salés de la mer des
      Wadden](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) la spatule blanche, en tant que grands
      complexes humides côtiers.
  de:
    intro: >-
      Im Frühling lässt ein kleiner Singvogel von einem Schilfhalm einen Triller von rund fünfzig Tönen pro
      Sekunde hören, der zehn bis dreißig Sekunden anhalten kann. Es ist der Schilfrohrsänger, und das
      Röhricht der Brière bildet seine wichtigste Hochburg in Frankreich: etwa eintausend Brutpaare. Die
      Brière nordwestlich der Loire-Mündung im Département Loire-Atlantique ist eine Wasserwelt aus Mooren,
      Kanälen und Reetdachkaten, in der das Schutzgebiet seit 1970 eine Fläche von 54.800 Hektar als
      regionaler Naturpark schützt. Ihre Schilfflächen nehmen 8.000 ha ein und zählen zu den ausgedehntesten
      Frankreichs.
    landscape: >-
      Die Brière besteht vor allem aus Wasser und Schilfrohr. Die Röhrichtzonen sind keineswegs bloße Kulisse:
      Sie befestigen Uferlinien, klären und belüften das Wasser, filtern Schwebstoffe und binden
      Schwermetalle. Über Jahrhunderte dienten sie als zentrale Wirtschaftsressource für Reetdächer, Einstreu,
      Windschutzhecken und Flechtwerk.


      Reetdächer prägen das Landschaftsbild unverwechselbar. In der Brière stehen rund 3.000 reetgedeckte
      Katen: die höchste Dichte an Reetdachhäusern in ganz Frankreich. Sie spiegeln eine traditionelle
      Wohnform des siebzehnten Jahrhunderts wider, eng verknüpft mit kleinbäuerlicher Torfwirtschaft. Heute
      wird das Schilfrohr *Phragmites australis* verarbeitet, das früheres Roggenstroh und Binsen ablöste. Ein
      Reetdach hält etwa 30 Jahre und bedarf regelmäßiger Pflege.
    wildlife: >-
      Im Frühjahr beherrschen Singvögel das Röhricht: Die französische Schilfrohrsänger-Hochburg mit rund
      eintausend Paaren ist unüberhörbar. Zu den Schilfbewohnern zählen Blaukehlchen, Teichrohrsänger und
      Bartmeise. Das Weißsternige Blaukehlchen von Nantes ist eine endemische Unterart mit Hauptverbreitung in
      der Brière; Beringungsstudien belegen, dass ihre Winterquartiere überwiegend in Portugal liegen.


      Ganzjährig beherbergen die Schilfgürtel eine Schlüsselpopulation des Schilfrohrsängers und einen der
      wichtigsten Brutbestände der [Rohrdommel](/especie/botaurus_stellaris/); beide Arten sind europaweit
      stark rückläufig. An Schilfrändern fischt der [Purpurreiher](/especie/ardea_purpurea/). Die
      Parkverwaltung überwacht die Vogelbestände zur Steuerung des Wasserhaushalts.


      Im Herbst dient das Moor als Rastplatz internationaler Bedeutung für Beutelmeisen und den bedrohten
      [Seggenrohrsänger](/especie/acrocephalus_paludicola/) auf dem Zug nach Afrika.
    visit: >-
      Zwei Haupteingänge erschließen die Brière: einer für die Naturbeobachtung und einer für das ländliche
      Baukulturerbe.


      Das Reservat Pierre Constant ist der einzige der drei Teilbereiche des regionalen Naturschutzgebiets mit
      öffentlichem Zugang, einen Kilometer vom Hafen Rozé in Saint-Malo-de-Guersac entfernt und von April bis
      Oktober geöffnet. Es bietet eine Ausstellung zur Naturgeschichte, eine Beobachtungshütte und geführte
      Rundgänge zu einer zweiten Kanzel mit Naturführern. Die beiden anderen Sektoren, Grands Charreaux im
      Süden und Charreau de Pendille im Norden, liegen unberührt in der Grande Brière Mottière. Ursprünglich
      auf 25 Hektar von Hochschullehrer Pierre Constant als Tier- und Naturpark gegründet, öffnete das Areal
      1980 und dient seit 2004 als ornithologisches Reservat.


      Das Dorf Kerhinet mit 18 Reetdachhäusern wurde in den siebziger Jahren vom Park erworben und als
      Freilichtmuseum briéronischer Baukultur restauriert. Das Dorf ist autofrei, verfügt über zwei Lehrpfade
      und bildet den Ausgangspunkt mehrerer Wanderrouten; das Parkhaus informiert Besucher. Das Wegenetz
      umfasst siebenhundert Kilometer markierte Wanderwege, während der Fernwanderweg GR de Pays Tour de
      Brière achtundsechzig Kilometer misst, sofern es der Wasserstand erlaubt.


      Auf der Insel Fédrun sind die Chaumière Briéronne und das Brauthaus Maison de la Mariée von April bis
      November ausschließlich im Rahmen geführter Touren zugänglich. Der Park bewahrt rund 3300 volkskundliche
      Exponate des neunzehnten und zwanzigsten Jahrhunderts auf, während das Brautmuseum die größte
      öffentliche Sammlung von Brautkronenkuppeln zeigt.
    history: >-
      Das regionale Naturschutzgebiet Marais de Brière entstand 2012 durch die Zusammenlegung dreier
      Feuchtbiotope, und 2021 wurde Pierre Constant ökologisch umgestaltet, um störungsarme
      Flachwasserbereiche für Vögel und Fische zu schaffen.


      Kerhinet war in der ersten Hälfte des zwanzigsten Jahrhunderts verödet und wurde am 13. März 1967 vom
      Staat unter Denkmalschutz gestellt. Der neu gegründete Park kaufte das Ensemble an und führte eine
      umfassende Restaurierung durch.
    before: >-
      Pierre Constant öffnet nur von April bis Oktober, und die Museen auf Fédrun sind ausschließlich mit
      Führung zugänglich. Prüfe vor Wanderungen stets die aktuellen Wasserstände.
    around: >-
      Weit entfernt teilen der [Naturpark Ria Formosa](/lugar/parque-natural-da-ria-formosa/) Löffler und
      Fischotter sowie die [Wattenmeer-Salzwiesen](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) den
      Löffler als atlantische Küstenfeuchtgebiete.
  it:
    intro: >-
      In primavera, posato su uno stelo di cannuccia, un piccolo passeriforme intona un trillo continuo di
      circa cinquanta note al secondo che può protrarsi da dieci a trenta secondi. È il forapaglie comune, e
      il canneto di Brière rappresenta la sua roccaforte in Francia: circa mille coppie riproduttive. La
      Brière, a nord-ovest dell'estuario della Loira nel dipartimento della Loira Atlantica, è un intrico di
      acquitrini, canali e tetti di paglia di cui il parco naturale regionale tutela 54.800 ettari dal 1970. I
      suoi canneti occupano 8.000 ha e figurano tra i più vasti di Francia.
    landscape: >-
      La Brière è anzitutto regno di acque e cannucce palustri. I canneti non costituiscono un semplice
      fondale: rinsaldano le sponde, depurano e ossigenano le acque, trattengono i sedimenti e fissano i
      metalli pesanti. Per secoli hanno rappresentato una risorsa insostituibile per coprire i tetti,
      allestire lettiere per il bestiame, realizzare frangivento e recinzioni.


      I tetti di paglia costituiscono il tratto distintivo del paesaggio. In Brière si contano circa 3.000
      chaumière: è l'area di Francia con la maggiore concentrazione di tetti in cannuccia. Si tratta di
      un'architettura tradizionale tipica del XVII secolo, legata alla civiltà contadina di palude. Oggi le
      coperture impiegano la cannuccia palustre *Phragmites australis*, che ha soppiantato la segale e i
      giunchi locali. Un tetto dura circa 30 anni e richiede periodici interventi di manutenzione.
    wildlife: >-
      La primavera è il tempo dei passeriformi di palude: la popolazione francese del forapaglie comune, forte
      di circa mille coppie, canta ovunque tra i canneti. Vi nidificano anche il pettazzurro, la cannaiola
      comune e il basettino. Il pettazzurro a specchio bianco di Nantes è una sottospecie endemica il cui
      contingente principale risiede in Brière; inanellato regolarmente, gli studi hanno dimostrato che i suoi
      quartieri di svernamento si concentrano in Portogallo.


      Tutto l'anno i canneti ospitano una popolazione fondamentale di forapaglie e uno dei principali nuclei
      riproduttivi del [tarabuso](/especie/botaurus_stellaris/), due specie in marcata regressione in Europa.
      Lungo i margini si osserva l'[airone rosso](/especie/ardea_purpurea/). Il parco monitora costantemente
      l'avifauna palustre per ottimizzare la gestione idraulica.


      In autunno le paludi di Brière rappresentano una sosta migratoria di rilievo internazionale per il
      pendolino e il minacciato [pagliarolo](/especie/acrocephalus_paludicola/) in rotta verso l'Africa.
    visit: >-
      Due varchi accolgono i visitatori, dedicati rispettivamente agli ambienti naturali e alle tradizioni
      architettoniche.


      Il sito Pierre Constant è l'unico dei tre settori della riserva regionale accessibile al pubblico,
      situato a un chilometro dal porto di Rozé a Saint-Malo-de-Guersac e aperto da aprile a ottobre. Presenta
      un percorso espositivo sulla storia e la fauna di Brière, un capanno d'osservazione e l'accesso a un
      secondo punto panoramico con guide naturalistiche. Gli altri due settori, i Grands Charreaux a sud e il
      Charreau de Pendille a nord, ricadono nella Grande Brière Mottière. Nato su 25 ettari per iniziativa di
      Pierre Constant, docente universitario di Rennes, il sito aprì nel 1980 divenendo nel 2004 una riserva
      naturale a vocazione ornitologica.


      Il borgo di Kerhinet, che riunisce 18 chaumière, fu acquisito negli anni settanta dal parco per salvarlo
      dall'abbandono e farne una vetrina delle tradizioni locali. Interamente pedonale, offre due percorsi
      autoguidati ed è snodo di molteplici itinerari; la Maison du Parc accoglie i viaggiatori con esposizioni
      tematiche. La rete sentieristica offre settecento chilometri di tracciati pedonali, mentre l'anello del
      GR de Pays Tour de Brière copre sessantotto chilometri compatibilmente con il livello delle acque.


      Sull'isola di Fédrun, la Chaumière Briéronne e la Maison de la Mariée si visitano da aprile a novembre
      unicamente con la visita guidata «Ile était une fois Fédrun…». Il parco custodisce circa 3300 reperti
      etnografici della vita quotidiana tra XIX e XX secolo. La Maison de la Mariée espone la più ricca
      collezione pubblica di globi nuziali d'epoca.
    history: >-
      La riserva naturale regionale Marais de Brière è stata creata nel 2012 accorpando tre importanti aree
      umide, e nel 2021 Pierre Constant è stato oggetto di una riqualificazione ecologica per favorire
      l'avifauna acquatica e ridurre l'impatto dei visitatori.


      Kerhinet si era progressivamente spopolato nella prima metà del Novecento, inducendo lo Stato a
      tutelarlo il 13 marzo 1967. Il parco, di recente costituzione, lo acquistò avviando un meticoloso
      restauro conservativo.
    before: >-
      Pierre Constant è aperto solo da aprile a ottobre, e i musei di Fédrun si visitano esclusivamente con
      guida. Prima di metterti in cammino lungo i sentieri, verifica i livelli idrici nelle paludi.
    around: >-
      Lontano da qui, il [Parco naturale di Ria Formosa](/lugar/parque-natural-da-ria-formosa/) condivide con
      la Brière la spatola bianca e la lontra, e le [Paludi Salmastre del Mare dei
      Wadden](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) la spatola, come grandi complessi umidi
      costieri.
  pt:
    intro: >-
      Na primavera, pousada numa haste de cana, uma pequena ave emite um trinado sustentado de cerca de
      cinquenta notas por segundo que pode durar de dez a trinta segundos. É a felosa-dos-juncos, e o caniçal
      de Brière constitui o seu grande bastião em França: perto de mil casais reprodutores. Brière, a noroeste
      do estuário do Loire em Loire-Atlantique, é um mundo aquático de sapais, canais e cabanas de colmo do
      qual o parque natural regional tutela 54.800 hectares desde 1970. Os seus caniçais cobrem 8.000 ha e
      figuram entre os mais extensos de França.
    landscape: >-
      Brière é sobretudo água e canaviais. Os caniçais não são mero cenário: fixam as margens, purificam e
      oxigenam a água, retêm sedimentos e imobilizam metais pesados. Durante séculos constituíram um recurso
      essencial para a cobertura de tetos, camas de gado, quebra-ventos e paliçadas.


      Os tetos de colmo marcam a fisionomia da paisagem. Em Brière subsistem cerca de 3.000 cabanas com teto
      de colmo: é a região de França com maior concentração deste património vernáculo. Trata-se de um habitat
      típico do século XVII, associado à exploração agropecuária e turfeira. Atualmente utiliza-se o caniço
      *Phragmites australis*, que substituiu o centeio e o junco colhidos na região. Uma cobertura de colmo
      dura cerca de 30 anos e requer vigilância periódica.
    wildlife: >-
      A primavera é a época áurea dos passeriformes palustres: o reduto francês da felosa-dos-juncos, com
      perto de mil casais, escuta-se por toda a parte. Entre as aves dos caniçais contam-se o
      pisco-de-peito-azul, o rouxinol-pequeno-dos-caniços e o chapim-de-bigodes. O pisco-de-peito-azul de
      Nantes é uma subespécie endémica cuja população de Brière forma o principal reduto; anilhado anualmente,
      estudos confirmaram que passa o inverno sobretudo em Portugal.


      Ao longo de todo o ano, os caniçais abrigam uma população crucial de felosa-dos-juncos e um dos núcleos
      reprodutores determinantes do [abetouro-comum](/especie/botaurus_stellaris/), ambas em declínio
      acentuado na Europa. Nas margens do sapal alimenta-se a [garça-vermelha](/especie/ardea_purpurea/). O
      parque monitoriza as populações de aves ameaçadas para ajustar a gestão hídrica.


      No outono, os sapais de Brière funcionam como escala migratória de relevância internacional para o
      chapim-de-faces-pretas e a vulnerável [felosa-aquática](/especie/acrocephalus_paludicola/) em trânsito
      para África.
    visit: >-
      A visitação reparte-se por dois eixos, dedicados respetivamente ao ecossistema natural e ao património
      edificado.


      O sítio Pierre Constant é o único dos três setores da reserva natural regional aberto ao público, a um
      quilómetro do porto de Rozé em Saint-Malo-de-Guersac, visitável de abril a outubro. Dispõe de um espaço
      museológico sobre a história de Brière, um observatório e visitas guiadas gratuitas a um segundo posto
      com guia da natureza. Os restantes setores, Grands Charreaux a sul e Charreau de Pendille a norte,
      integram a Grande Brière Mottière. Idealizado em 25 hectares pelo professor universitário Pierre
      Constant para condensar a biodiversidade local, abriu em 1980 e opera desde 2004 como reserva
      ornitológica.


      A aldeia de Kerhinet, congregando 18 casas de colmo, foi comprada nos anos setenta para ser restaurada
      como mostruário da arquitetura briéronne. Totalmente pedonal, dispõe de dois trilhos interpretativos e
      serve de ponto de partida a múltiplas rotas pedestres; a Maison du Parc presta apoio ao visitante e
      acolhe mostras culturais. A rede de trilhos soma setecentos quilómetros de percursos sinalizados,
      enquanto o circuito de grande rota GR de Pays Tour de Brière cobre sessenta e oito quilómetros conforme
      o nível das águas.


      Na ilha de Fédrun, a Chaumière Briéronne e a Maison de la Mariée abrem de abril a novembro apenas no
      âmbito de visitas guiadas. O parque salvaguarda cerca de 3300 objetos etnográficos da vida quotidiana
      nos séculos XIX e XX, enquanto o museu nupcial reúne uma das mais ricas coleções de cúpulas de noiva.
    history: >-
      A Reserva Natural Regional Marais de Brière foi instituída em 2012 através da agregação de três
      importantes zonas húmidas, tendo o sítio Pierre Constant sido alvo em 2021 de intervenções ecológicas
      para beneficiar a ictiofauna e a avifauna aquática.


      Kerhinet encontrava-se em processo de abandono na primeira metade do século XX, levando o Estado a
      classificá-la a 13 de março de 1967. O parque adquiriu a povoação e empreendeu o seu restauro integral.
    before: >-
      Pierre Constant abre apenas de abril a outubro, e o património de Fédrun visita-se unicamente com guia.
      Antes de realizar caminhadas pelo sapal, consulta os níveis das águas.
    around: >-
      Longe daqui, o [Parque Natural da Ria Formosa](/lugar/parque-natural-da-ria-formosa/) partilha com
      Brière o colhereiro e a lontra, e os [Sapais do Mar de
      Wadden](/lugar/waddenzee-kwelders-en-salzwiesen-unesco-world/) o colhereiro, como grandes complexos
      costeiros.
