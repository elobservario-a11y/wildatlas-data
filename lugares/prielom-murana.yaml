observaciones:
  es: >-
    Es un recorrido corto y de libre acceso. Las cuevas Hutnianska y Peško están abiertas al público y son
    pequeñas. Los meses recomendados van de mayo a octubre.
texto:
  es:
    intro: >-
      Cuando una montaña se levanta, un río suele rendirse y buscar otro camino. El Muráň no. Mientras el
      terreno subía a su alrededor, mantuvo su rumbo y fue hundiéndose en la caliza, hasta dejar un cañón de
      unos 3,5 kilómetros que en algunos puntos llega a 100 metros de profundidad. Los geólogos lo llaman
      antecedencia, y Prielom Muráňa, en los términos de Bretka y Meliata, es uno de sus ejemplos más claros.
      Hoy es un monumento natural de apenas 39,55 hectáreas que recorre un sendero didáctico de seis paneles.
    landscape: >-
      El Muráň nace en la meseta de Muránska planina, bajo el collado de Predná hora, y recorre 48,8
      kilómetros hasta desembocar en la Slaná. En su tramo alto y medio, junto a la localidad de Muráň y por
      los montes Stolické, es un río de montaña con valle estrecho. El tramo protegido es un meandro encajado
      en una banda de caliza, un fenómeno típico del karst.


      La roca habla por todas partes. En el desfiladero y sobre él hay unas quince cuevas pequeñas, excavadas
      por el río en las grietas de la caliza. Las dos principales son la cueva Hutnianska y la cueva Peško, y
      las dos son de libre acceso. En los bosques contiguos, entre robledales y estepa forestal, aparecen
      formas kársticas como los lapiaces.
    wildlife: >-
      El valle reúne varios ambientes en poco espacio. En las laderas alternan los bosques de roble y carpe
      con enclaves de estepa forestal; en las orillas del Muráň crecen bosques de ribera de sauce, álamo y
      aliso, y entre los restos de vegetación termófila de bosque y estepa viven plantas y animales raros.


      El sendero tiene un panel dedicado a la flora y la fauna del desfiladero, el cuarto, y otro a las
      cuevas, el quinto. Los meses más recomendables van de mayo a octubre.
    visit: >-
      El sendero didáctico de Prielom Muráňa arranca en la aldea de Bretka, justo bajo la iglesia antigua.
      Allí un panel inicial presenta el cañón que forma el arroyo Muráň, y el primero describe con detalle la
      geología del lugar. Mide 3.200 metros y salva un desnivel de 66,5 metros, así que es un paseo corto que
      se hace en media jornada.


      La ruta pasa por seis paneles. El segundo está en la peña dominante de Peškő, con una cueva del mismo
      nombre en su centro. Cerca del final del desfiladero se ven las huellas del antiguo canal que llevaba
      agua a un molino: es el tercer panel, dedicado a ese patrimonio técnico. Después el recorrido entra de
      lleno en el monumento natural, con la flora y la fauna en el cuarto panel y las cuevas en el quinto, al
      lado de la cueva Hutnianska. El último panel queda cerca de la Stará huta, en la otra orilla, donde se
      ven las ruinas de un alto horno del cambio entre los siglos XVI y XVII.
    history: >-
      La huella humana en el desfiladero es sobre todo industrial. La Stará huta, del cambio entre los siglos
      XVI y XVII, conserva las ruinas de un alto horno, y en 1920 se construyó un molino de agua al final del
      desfiladero: se sustituyó el arroyo por una presa, se excavó un canal de molino y en el edificio
      funcionó también una central hidroeléctrica. De aquello quedan en el cauce los restos de la presa y, en
      la orilla, los del canal.


      El área se declaró protegida en 1980 y su última modificación data de 1989. Rige el cuarto grado de
      protección territorial y el lugar forma parte de la Red Natura 2000, como zona de importancia
      comunitaria SKUEV 0285, «Río Muráň con sus afluentes». Se protege como ejemplo notable de meandro
      encajado, singular en el curso bajo de los ríos eslovacos.
    before: >-
      Es un recorrido corto y de libre acceso. Las cuevas Hutnianska y Peško están abiertas al público y son
      pequeñas. Los meses recomendados van de mayo a octubre.
    around: >-
      A diez kilómetros queda el [Parque Nacional de Aggtelek](/lugar/aggteleki-nemzeti-park/), al otro lado
      de la frontera.
  en:
    intro: >-
      When a mountain uplifts, a river usually gives way and seeks another course. The Muráň did not. As the
      surrounding terrain rose, the river kept its course, sawing deeply into the limestone bed to leave a
      canyon roughly 3.5 kilometers long and up to 100 meters deep in places. Geologists term this antecedent
      drainage, and Prielom Muráňa, spanning the municipal borders of Bretka and Meliata, offers a classic
      textbook example. Today it is preserved as a Natural Monument encompassing 39.55 hectares, interpreted
      by a nature trail with six informative stations.
    landscape: >-
      The Muráň River rises in the Muránska planina plateau beneath the Predná hora pass and flows for 48.8
      kilometers until emptying into the Slaná. Along its upper and middle stretches near the village of Muráň
      and across the Stolické vrchy, it behaves as a typical mountain river through a narrow valley. The
      protected gorge section represents an incised meander slicing through a strip of limestone, a distinct
      karst phenomenon.


      The bedrock dominates the scenery. In and above the gorge lie some fifteen small caves hollowed out by
      river currents along structural fissures in the limestone. The two primary caverns are Hutnianska cave
      and Peško cave, both freely accessible to hikers. In adjacent woodlands of oak and forest-steppe,
      surface karst formations like limestone pavements and clints emerge.
    wildlife: >-
      The valley gathers contrasting microhabitats in close quarters. Slopes alternate between oak-hornbeam
      woods and warm forest-steppe enclaves; along the Muráň banks thrive riparian galleries of willow,
      poplar, and alder, and relic thermophilic flora and fauna persist in rocky pockets.


      The nature trail dedicates its fourth panel to the flora and fauna of the gorge, and the fifth to cave
      habitats. The recommended visiting window runs from May to October.
    visit: >-
      The Prielom Muráňa nature educational trail begins in the village of Bretka, directly below the ancient
      church. There an introductory board presents the canyon carved by the Muráň stream, while the first
      panel details local geology. The path measures 3,200 meters and overcomes an elevation difference of
      66.5 meters, offering an easy half-day stroll.


      The route guides hikers past six interpretive panels. The second stands on the dominant Peškő cliff,
      which houses a cave of the same name. Near the exit of the gorge, visitors discover traces of a historic
      mill race: this is the third panel, focused on technical heritage. The path then enters the Natural
      Monument proper, explaining flora and fauna at the fourth station and cave morphology at the fifth near
      Hutnianska cave. The final panel stands near the Stará huta on the opposite bank, overlooking ruins of a
      blast furnace from the turn of the sixteenth and seventeenth centuries.
    history: >-
      Human presence in the gorge was primarily industrial. Stará huta preserves the stone masonry of a blast
      furnace dating from the turn of the sixteenth and seventeenth centuries, and in 1920 a water mill was
      constructed at the gorge outlet: the stream was dammed, a millrace excavated, and a small hydroelectric
      turbine installed. Ruins of the weir and water canal remain clearly visible along the riverbank.


      The site was proclaimed a protected area in 1980, with boundaries updated in 1989. It enjoys
      fourth-degree territorial protection and belongs to the Natura 2000 network as Site of Community
      Importance SKUEV 0285, "Muráň River with Tributaries". It is safeguarded as an outstanding incised river
      meander, unique in the lower river basins of Slovakia.
    before: >-
      The trail is short and freely accessible. Hutnianska and Peško caves are small and open to visitors. The
      best months for a trip run from May to October.
    around: >-
      Ten kilometers away across the Hungarian border lies [Aggtelek National
      Park](/lugar/aggteleki-nemzeti-park/).
  fr:
    intro: >-
      Lorsqu'une montagne se soulève, une rivière cède généralement le passage et cherche une autre issue. La
      Muráň a tenu tête. Tandis que le relief s'élevait, elle a conservé son lit et s'est enfoncée dans le
      calcaire jusqu'à creuser un défilé d'environ 3,5 kilomètres atteignant par endroits 100 mètres de
      profondeur. Les géologues nomment ce phénomène une gorge antécédente, et le Prielom Muráňa, entre Bretka
      et Meliata, en offre un cas d'école. C'est aujourd'hui un monument naturel de 39,55 hectares parcouru
      par un sentier didactique à six panneaux.
    landscape: >-
      La Muráň prend sa source sur le plateau de Muránska planina, sous le col de Predná hora, et s'écoule sur
      48,8 kilomètres jusqu'à sa confluence avec la Slaná. Dans ses cours supérieur et moyen, près de la
      localité de Muráň et à travers les monts Stolické, c'est une rivière montagnarde au vallon resserré. Le
      tronçon classé correspond à un méandre encaissé dans une barre calcaire, phénomène typique du karst.


      La roche calcaire dicte le paysage. Dans le défilé s'ouvrent une quinzaine de petites cavités creusées
      par l'eau le long des fractures de la roche. Les deux grottes majeures sont Hutnianska et Peško, toutes
      deux en accès libre. Dans les boisements de chênes et de steppe arborée apparaissent des modelés
      karstiques tels que des lapiés.
    wildlife: >-
      Le vallon concentre des milieux écologiques variés sur une surface restreinte. Les versants alternent
      chênaies-charmaies et clairières de steppe boisée ; les rives de la Muráň portent des ripisylves de
      saules, peupliers et aulnes, où s'abritent des espèces thermophiles rares.


      Le quatrième panneau du sentier didactique traite de la faune et de la flore, tandis que le cinquième
      présente les grottes. La période la plus agréable va de mai à octobre.
    visit: >-
      Le sentier didactique de Prielom Muráňa commence dans le village de Bretka, au pied de l'église
      ancienne. Un panneau d'accueil présente la gorge formée par la rivière, et le premier panneau détaille
      la géologie. Le circuit fait 3 200 mètres de long pour un dénivelé de 66,5 mètres, soit une promenade
      facile d'une demi-journée.


      L'itinéraire compte six panneaux thématiques. Le deuxième se dresse sur le promontoire rocheux de Peškő,
      abritant la grotte éponyme. Vers la fin de la gorge subsistent les traces d'un ancien bief de moulin,
      objet du troisième panneau dédié au patrimoine technique. Le parcours pénètre ensuite dans le monument
      naturel proprement dit, abordant faune et flore au quatrième panneau et cavités rocheuses au cinquième
      près de la grotte Hutnianska. Le dernier panneau se situe près de la Stará huta, sur l'autre rive,
      devant les vestiges d'un haut fourneau du tournant des XVIe et XVIIe siècles.
    history: >-
      L'empreinte humaine dans la gorge est essentiellement proto-industrielle. La Stará huta conserve les
      ruines d'un haut fourneau du tournant des XVIe et XVIIe siècles, et en 1920 un moulin à eau fut
      construit à la sortie du défilé : un barrage barra le cours d'eau, un canal fut creusé et le moulin
      actionna aussi une turbine électrique. Les maçonneries du déversoir et du bief restent visibles.


      Le site a été classé en 1980 et son périmètre révisé en 1989. Il bénéficie du quatrième niveau de
      protection environnementale et s'intègre au réseau Natura 2000 sous la référence SKUEV 0285 (« Rivière
      Muráň et affluents »). Il est protégé au titre d'exemple remarquable de méandre antécédent encaissé.
    before: >-
      Le circuit est court et d'accès libre. Les grottes de Hutnianska et Peško sont petites et ouvertes sans
      restriction. Les mois recommandés vont de mai à octobre.
    around: >-
      À dix kilomètres se situe le [parc national d'Aggtelek](/lugar/aggteleki-nemzeti-park/) de l'autre côté
      de la frontière.
  de:
    intro: >-
      Wenn sich ein Gebirge hebt, weicht ein Fluss für gewöhnlich aus. Nicht so der Muráň. Als sich das Umland
      aufwölbte, behielt er seine Fließrichtung bei und sägte sich tief in den Kalkstein, bis eine rund 3,5
      Kilometer lange Schlucht entstand, die stellenweise 100 Meter Tiefe erreicht. Geologen bezeichnen diesen
      Vorgang als antezedentes Durchbruchstal; der Prielom Muráňa auf den Fluren von Bretka und Meliata ist
      dafür ein Schulbeispiel. Heute bildet er ein Naturdenkmal von 39,55 Hektar, erschlossen durch einen
      Lehrpfad mit sechs Stationen.
    landscape: >-
      Der Muráň entspringt auf dem Hochplateau Muránska planina unterhalb des Sattels Predná hora und legt
      48,8 Kilometer bis zur Mündung in die Slaná zurück. Im Ober- und Mittellauf nahe dem Ort Muráň durch die
      Stolické vrchy fließt er als Gebirgsbach in einem engen Kerbtal. Der Schutzabschnitt stellt einen
      eingekerbten Mäander in einem Kalksteinband dar, eine typische Karstform.


      Das Gestein prägt das Talbild. In der Schlucht und darüber verbergen sich rund fünfzehn kleine
      Halbhöhlen, die das Wasser entlang von Klüften ausgespült hat. Die beiden bedeutendsten Höhlen sind
      Hutnianska und Peško, die frei betreten werden können. In den angrenzenden Eichen- und
      Waldsteppenbeständen treten Karstformen wie Karren auf.
    wildlife: >-
      Das Tal vereint verschiedene Lebensräume auf engstem Raum. An den Hängen wechseln
      Eichen-Hainbuchenwälder mit wärmeliebenden Waldsteppeninseln; an den Ufern des Muráň gedeihen
      Auwaldstreifen aus Weiden, Pappeln und Erlen, die seltenen Pflanzen und Tieren Schutz gewähren.


      Die vierte Schautafel widmet sich Flora und Fauna der Schlucht, die fünfte den Höhlen. Die beste
      Besuchszeit reicht von Mai bis Oktober.
    visit: >-
      Der Lehrpfad Prielom Muráňa beginnt in der Ortschaft Bretka unterhalb der alten Kirche. Eine
      Eingangstafel stellt die Talschlucht vor, und die erste Station beschreibt die Geologie. Der Rundweg
      misst 3.200 Meter bei 66,5 Höhenmetern und lässt sich gemütlich auf einem Halbtagesausflug begehen.


      Die Route führt an sechs Tafeln vorbei. Die zweite steht am Felsen Peškő mit der gleichnamigen Höhle.
      Nahe dem Schluchtausgang zeigen sich Reste eines historischen Mühlgrabens: Dies ist die dritte Tafel,
      die der Mühlentechnik gewidmet ist. Anschließend betritt man das eigentliche Naturdenkmal mit Flora und
      Fauna an Tafel vier und Höhlen an Station fünf bei der Hutnianska-Höhle. Die letzte Station liegt bei
      Stará huta am jenseitigen Ufer bei den Resten eines Hochofens aus der Wende vom sechzehnten zum
      siebzehnten Jahrhundert.
    history: >-
      Die menschliche Nutzung im Tal war gewerblicher Natur. Bei Stará huta stehen die Grundmauern eines
      Hochofens der Wende vom sechzehnten zum siebzehnten Jahrhundert, und 1920 entstand eine Wassermühle am
      Schluchtende: Der Fluss wurde aufgestaut, ein Kanal ausgehoben und eine Stromturbine betrieben. Reste
      der Wehranlage und des Kanals säumen das Ufer.


      Das Schutzgebiet wurde 1980 ausgewiesen und 1989 neu gefasst. Es gilt der vierte Schutzgrad, und das
      Areal gehört zum Netzwerk Natura 2000 als Gebiet von gemeinschaftlicher Bedeutung SKUEV 0285 («Fluss
      Muráň mit Zuflüssen»). Geschützt wird das antezedente Durchbruchstal als geomorphologische Rarität.
    before: >-
      Der Lehrpfad ist kurz und frei zugänglich. Die Höhlen Hutnianska und Peško sind klein und
      unverschlossen. Die günstigsten Reisemonate liegen zwischen Mai und Oktober.
    around: >-
      Zehn Kilometer entfernt liegt der ungarische [Aggtelek-Nationalpark](/lugar/aggteleki-nemzeti-park/)
      jenseits der Grenze.
  it:
    intro: >-
      Quando una montagna si innalza, un fiume di norma cede e cerca un altro sfogo. Il Muráň non lo ha fatto.
      Mentre il terreno circostante si sollevava, ha conservato la sua direttrice incidendo la bancata
      calcarea, fino a scolpire un canyon di circa 3,5 chilometri profondo in alcuni punti fino a 100 metri. I
      geologi lo definiscono corso antecedente, e il Prielom Muráňa, tra i territori di Bretka e Meliata, ne è
      un chiaro esempio. Oggi è protetto come Monumento naturale su 39,55 ettari percorsi da un sentiero
      didattico a sei stazioni.
    landscape: >-
      Il Muráň sorge sull'altopiano di Muránska planina sotto il valico di Predná hora e scorre per 48,8
      chilometri fino a confluire nella Slaná. Nel tratto superiore e medio, presso l'abitato di Muráň e i
      monti Stolické, è un torrente montano in una valle stretta. Il tratto tutelato è un meandro
      profondamente scavato in una fascia di calcare, tipica espressione carsica.


      La roccia affiora ovunque. Nella forra e sulle pareti si contano una quindicina di piccole caverne
      aperte dall'acqua nelle fessure della roccia. Le due principali sono la grotta Hutnianska e la grotta
      Peško, entrambe a fruizione libera. Nei boschi di querce e steppa forestale compaiono scannellature
      carsiche e campi carreggiati.
    wildlife: >-
      La forra racchiude molteplici microambienti in poco spazio. Sui versanti si alternano querceti e radure
      di steppa termofila; lungo le sponde del Muráň crescono fasce ripariali di salici, pioppi e ontani che
      conservano piante e animali rari.


      Il quarto pannello del percorso illustra la flora e la fauna della gola, mentre il quinto è dedicato
      alle caverne. I mesi più raccomandabili vanno da maggio a ottobre.
    visit: >-
      Il sentiero didattico del Prielom Muráňa parte dall'abitato di Bretka, subito sotto la chiesa storica.
      Lì una bacheca iniziale introduce il canyon scavato dal torrente e il primo pannello ne spiega la
      geologia. Lo sviluppo è di 3.200 metri superando 66,5 metri di dislivello, ideale per una passeggiata di
      mezza giornata.


      Il tracciato tocca sei postazioni. La seconda sorge sulla rupe dominante di Peškő, che ospita la grotta
      omonima. Verso il termine della forra si scorgono i resti del canale che alimentava un mulino, tema del
      terzo pannello dedicato all'archeologia industriale. L'itinerario entra poi nel monumento naturale
      illustrando fauna e flora al quarto pannello e le cavità al quinto, accanto alla grotta Hutnianska.
      L'ultimo pannello si trova presso la Stará huta sull'altra riva, con i resti di un altoforno a cavallo
      tra i secoli XVI e XVII.
    history: >-
      La frequentazione umana nella gola è legata all'attività produttiva. La Stará huta conserva le murature
      di un altoforno tra i secoli XVI e XVII, e nel 1920 fu costruito un mulino ad acqua all'uscita della
      forra: il corso d'acqua venne sbarrato, fu scavato un canale di derivazione e l'impianto produsse anche
      elettricità. Sul fiume rimangono le tracce della diga e del bief.


      L'area è stata posta sotto tutela nel 1980 con revisione dei confini nel 1989. Vigono le norme del
      quarto grado di protezione territoriale e il sito fa parte della Rete Natura 2000 come zona SIC SKUEV
      0285 («Fiume Muráň e affluenti»). Si tutela come notevole meandro antecedente incassato.
    before: >-
      L'itinerario è breve e di libero transito. Le grotte Hutnianska e Peško sono modeste e liberamente
      accessibili. Il periodo migliore va da maggio a ottobre.
    around: >-
      A dieci chilometri si trova il [Parco Nazionale di Aggtelek](/lugar/aggteleki-nemzeti-park/), oltre il
      confine ungherese.
  pt:
    intro: >-
      Quando uma serra se eleva, um rio costuma desviar-se e procurar outro caminho. O Muráň não o fez.
      Enquanto o terreno circundante subia, manteve o seu rumo e cavou o leito no calcário, deixando uma
      garganta com cerca de 3,5 quilómetros que atinge em certos pontos 100 metros de profundidade. Os
      geólogos chamam-lhe vale antecedente, e o Prielom Muráňa, entre Bretka e Meliata, constitui um exemplo
      ilustre. É hoje um monumento natural com 39,55 hectares percorrido por um trilho didático de seis
      painéis.
    landscape: >-
      O Muráň nasce no planalto de Muránska planina, sob o colo de Predná hora, e estende-se por 48,8
      quilómetros até desaguar no rio Slaná. No seu curso superior e médio, junto à localidade de Muráň e
      pelos montes Stolické, é um rio de montanha com vale estreito. O troço protegido consiste num meandro
      profundamente encaixado numa bancada de calcário, fenómeno cárstico característico.


      A rocha domina toda a paisagem. No desfiladeiro e sobre as encostas contam-se cerca de quinze pequenas
      grutas talhadas pela corrente nas fraturas da pedra. As duas principais são a gruta Hutnianska e a gruta
      Peško, ambas de acesso livre. Nos bosques contíguos de carvalhos e estepe florestal surgem lapiás e
      outras formas cársticas.
    wildlife: >-
      O vale congrega múltiplos habitats numa área contida. Pelas encostas alternam carvalhais e clareiras de
      estepe arbórea; junto às margens do Muráň crescem matas ripícolas de salgueiros, choupos e amieiros onde
      sobrevivem plantas e animais raros.


      O trilho possui um painel dedicado à fauna e flora do desfiladeiro, o quarto, e outro dedicado às
      cavidades, o quinto. O intervalo mais aconselhável decorre de maio a outubro.
    visit: >-
      O percurso didático de Prielom Muráňa tem início na aldeia de Bretka, junto à igreja antiga. Aí, um
      painel introdutório apresenta a garganta cavada pelo ribeiro e o primeiro painel detalha a geologia
      local. Tem 3.200 metros de extensão e vence um desnível de 66,5 metros, proporcionando um passeio de
      meio dia.


      A rota inclui seis painéis interpretativos. O segundo situa-se no miradouro rochoso de Peškő, que guarda
      a gruta com o mesmo nome. Perto do final da garganta notam-se os vestígios do antigo canal de um moinho
      de água, tema do terceiro painel sobre património técnico. Seguidamente o trilho entra no monumento
      natural, abordando a flora e a fauna no quarto painel e as cavernas no quinto, ao lado da gruta
      Hutnianska. O último painel fica junto à Stará huta, na outra margem, defronte das ruínas de um
      alto-forno da transição dos séculos XVI e XVII.
    history: >-
      A presença humana na garganta esteve ligada à exploração manufactureira. A Stará huta conserva os
      alicerces de um alto-forno da transição dos séculos XVI e XVII, e em 1920 ergueu-se um moinho de água na
      foz da garganta: o curso foi represado, abriu-se um canal de moenda e instalou-se uma turbina elétrica.
      Restam no leito vestígios do açude e do canal.


      A área foi classificada em 1980 e revista em 1989. Aplica-se o quarto grau de proteção e o sítio integra
      a Rede Natura 2000 como zona SKUEV 0285 («Rio Muráň com tributários»). Destaca-se como meandro
      antecedente de grande valor.
    before: >-
      É um passeio curto e de acesso livre. As grutas Hutnianska e Peško são pequenas e desobstruídas. A
      melhor altura estende-se de maio a outubro.
    around: >-
      A dez quilómetros fica o [Parque Nacional de Aggtelek](/lugar/aggteleki-nemzeti-park/), do outro lado da
      fronteira húngara.
