resumen:
  es: >-
    Praderas arboladas mantenidas con manejo tradicional, bosques antiguos de Korsö y una masa de tejos en
    Jungfruskär.
  en: >-
    Wooded meadows maintained through traditional management, ancient woodlands of Korsö and an old-growth yew
    forest on Jungfruskär.
  fr: >-
    Prés boisés entretenus selon les coutumes traditionnelles, forêts anciennes de Korsö et un peuplement
    d’ifs à Jungfruskär.
  de: Traditionell gepflegte Laubwiesen, alte Wälder auf Korsö und ein Eibenbestand auf Jungfruskär.
  it: >-
    Prati alberati mantenuti con pratiche tradizionali, boschi vetusti a Korsö e popolamenti di tasso a
    Jungfruskär.
  pt: >-
    Prados arborizados mantidos com maneio tradicional, matas seculares em Korsö e um bosque de teixos em
    Jungfruskär.
unico:
  es: >-
    Jungfruskär guarda la mayor masa continua de tejos del norte del Báltico, y a pocos kilómetros de
    Mariehamn Nåtö conserva el prado arbolado que se considera el más clásico de toda Finlandia.
  en: >-
    Jungfruskär shelters the largest contiguous stand of common yew in the northern Baltic, and a few
    kilometres from Mariehamn Nåtö preserves what is regarded as the most quintessential wooded meadow in all
    of Finland.
  fr: >-
    Jungfruskär abrite le plus vaste peuplement continu d’ifs du nord de la Baltique, et à quelques kilomètres
    de Mariehamn, Nåtö préserve le pré boisé considéré comme le plus emblématique de toute la Finlande.
  de: >-
    Jungfruskär birgt den größten zusammenhängenden Eibenbestand der nördlichen Ostsee, und wenige Kilometer
    vor Mariehamn bewahrt Nåtö die Laubwiese, die als vollkommenstes Beispiel in ganz Finnland gilt.
  it: >-
    Jungfruskär custodisce il più esteso popolamento continuo di tasso del Baltico settentrionale, e a pochi
    chilometri da Mariehamn Nåtö preserva il prato alberato ritenuto il più classico di tutta la Finlandia.
  pt: >-
    Jungfruskär abriga o maior povoamento contínuo de teixos do Báltico setentrional, e a escassos quilómetros
    de Mariehamn, Nåtö preserva o prado arborizado considerado o mais clássico de toda a Finlândia.
observaciones:
  es: >-
    Consulta al gestor las condiciones de acceso antes de organizar la visita a los islotes. Mira también las
    fechas de la caminata guiada del municipio, que es una actividad puntual.
texto:
  es:
    intro: >-
      Imagina un prado de siglos en el que nadie ha dejado de trabajar. Cada año se desbroza, se siega la
      hierba y después entra el ganado, como se hace desde hace siglos, y en primavera ese suelo cuidado se
      llena de hepáticas, anémonas, gullviva y orquídeas. Así es Nåtö, el corazón de la reserva
      Nåtö–Jungfruskär, en el municipio de Lemland, en Åland. Alrededor de la isla, un rosario de islotes
      completa el cuadro con bosques casi vírgenes y el mayor tejar del norte del Báltico.
    landscape: >-
      La reserva es un mosaico: campos, prados, bosque y archipiélago. La parte marina la forman ocho islotes
      y cuatro grupos de islotes de naturaleza rica y variada, y en la isla de Nåtö se concentran los prados.


      Los prados arbolados son el alma del lugar. Son paisajes de pequeñas arboledas de frondosas, con
      arbustos y claros abiertos de hierba, que se mantienen con desbroce, poda de ramas, retirada de matorral
      y pastoreo. Eskskär, Idholm, Senskär y Slåtholm tienen también este carácter y se cuidan de forma
      tradicional. Del otro lado está el bosque: en Yttre Korsö el bosque es viejo y rico en madera podrida, y
      en Inre Korsö hay conífera vieja y espesos matorrales de tejo en las hondonadas. En Jungfruskär, el
      tejar es en buena parte impenetrable y tiene al menos unos 1200 ejemplares.
    wildlife: >-
      La primavera es la estación de las flores. Florecen la hepática, la anémona blanca y la amarilla, la
      gullviva y las orquídeas Adam och Eva y St Pers nycklar. En el prado de Sesleria florece la majviva.
      Idholm es el lugar más rico en especies botánicas de todos los estudiados en Åland, y allí vive una
      parte importante de los ejemplares de St Pers nycklar de toda Finlandia. En Nåtö, el municipio señala
      que florece en abundancia la flor provincial de Åland. También hay líquenes y hongos poco comunes.


      El mar y el bosque traen sus aves. En Yttre Korsö cría el [pigargo
      europeo](/especie/haliaeetus_albicilla/); en el inventario de 2015, dos pollos ya volantones ensayaban
      el vuelo. En Senskär se encontraron trece nidos de [eider](/especie/somateria_mollissima/) usados esa
      primavera. En los alrededores de Nåtö abunda el zampullín cuellirrojo, con una pareja criando en
      Västerberget y en Nåtö oriental. Varias aves de agujero crían en la reserva, igual que el cascanueces.
    visit: >-
      Se empieza por Nåtö. Allí hay un sendero natural balizado a través de los prados, y se llega por una
      carretera elevada de diez kilómetros que enhebra una sucesión de islas hasta el archipiélago de Järsö y
      Nåtö. La parte occidental de la reserva está en la isla, unos tres kilómetros y medio al sur de
      Mariehamn.


      El municipio organiza una caminata cultural guiada por Nåtö, de unos tres kilómetros, cuando el prado
      arbolado está en su mejor momento. El terreno es fácil, con algunos tramos cortos de roca y pasarelas en
      ciertos puntos, y la cita es en el aparcamiento a la derecha de la carretera de Järsö, unos doscientos
      metros después del puente.


      Jungfruskär tiene su propio sendero natural para ver el tejar. El paseo por Nåtö y el sendero de
      Jungfruskär son recorridos separados, así que planifícalos como dos visitas.
    history: >-
      La reserva se formó por acumulación. El islote de Jungfruskär está protegido desde 1943, Idholm desde
      1949 y la reserva de Nåtö existe desde 1964, ampliada por etapas. Hoy Idholm, Jungfruskär y Nåtö forman
      un conjunto.


      Los edificios de la antigua granja Norrgård los mantiene el gobierno de Åland, y algunos los usa la
      Estación Biológica de Nåtö, que organiza investigación y cursos centrados en la botánica. El peligro es
      lento: al disminuir el pastoreo, el carrizo y el matorral invaden las praderas costeras. Otra amenaza
      posible sería un vertido de petróleo en la ruta marítima que atraviesa el área.
    before: >-
      Consulta al gestor las condiciones de acceso antes de organizar la visita a los islotes. Mira también
      las fechas de la caminata guiada del municipio, que es una actividad puntual.
  en:
    intro: >-
      Picture a centuries-old meadow where careful human stewardship has never lapsed. Every single year the
      brushwood is raked away, the hay is mown, and livestock is turned out to graze, precisely as has been
      done for centuries; in spring that groomed topsoil bursts into a vibrant carpet of liverleaf, wood
      anemones, cowslips and wild orchids. This is Nåtö, the pastoral heart of the Nåtö–Jungfruskär Nature
      Reserve in Lemland municipality, Åland. Surrounding the main island, an archipelago of satellite islets
      completes the picture with near-virgin old-growth forests and the northern Baltic’s densest yew
      sanctuary.
    landscape: >-
      The nature reserve is a mosaic: hayfields, wooded meadows, dense woodland and maritime archipelago. The
      marine domain encompasses eight solitary islets and four islet groups endowed with rich and varied
      ecosystems, while the main island of Nåtö concentrates the prized wooded meadows.


      These wooded meadows form the soul of the landscape. They consist of park-like parklands of broadleaved
      trees, dotted with hazel groves and sunlit grassy glades, perpetually sustained by spring clearing,
      pollarding, brush removal and late-summer grazing. Eskskär, Idholm, Senskär and Slåtholm share this
      identical pastoral character and receive traditional maintenance. In contrast stands the ancient forest:
      on Yttre Korsö the woodland is ancient and laden with decaying coarse woody debris, while Inre Korsö
      features venerable conifers and dense understorey thickets of yew in moist hollows. On Jungfruskär, the
      yew grove is largely impenetrable and gathers at least 1200 individual trees.
    wildlife: >-
      Spring is the undisputed season of wild flora. Ground layer blooms include liverleaf, wood anemone,
      yellow wood anemone, cowslip, and the wild orchids Adam and Eve and early purple orchid. On Sesleria
      calcicolous swards blooms the bird’s-eye primrose. Idholm ranks as the botanically richest locality
      among all studied sites in Åland, hosting a significant portion of Finland’s entire population of early
      purple orchids. On Nåtö, municipal botanists highlight the profuse blooming of the provincial floral
      emblem of Åland. Rare saxicolous lichens and wood-decay fungi also thrive.


      The surrounding sea and woodlands attract distinctive birdlife. On Yttre Korsö nests the [white-tailed
      eagle](/especie/haliaeetus_albicilla/); during the 2015 breeding survey, two fully feathered fledglings
      were observed exercising their wings. Senskär revealed thirteen active nests of [common
      eider](/especie/somateria_mollissima/) during spring inventories. The waters around Nåtö shelter
      abundant horned grebes, with pairs breeding at Västerberget and eastern Nåtö. Numerous hole-nesting
      passerines breed throughout the reserve, alongside the spotted nutcracker.
    visit: >-
      You begin your visit at Nåtö. An official waymarked nature trail winds through the wooded meadows,
      reached via a scenic ten-kilometre causeway road threading across a chain of islands south from
      Mariehamn into the Järsö and Nåtö archipelago. The western sector of the nature reserve lies on the
      island itself, some three and a half kilometres south of Mariehamn.


      The local municipality conducts a guided cultural landscape walk through Nåtö, covering about three
      kilometres when the traditional wooded meadow reaches peak flowering. The terrain is gentle, featuring
      occasional short rocky outcrops and boardwalks across damp spots; participants gather at the parking
      area on the right side of the Järsö road, roughly two hundred metres past the bridge.


      Jungfruskär features its own dedicated nature trail to explore the yew grove. The meadow trail on Nåtö
      and the yew trail on Jungfruskär are entirely separate outings, so plan them as two distinct excursions.
    history: >-
      The nature reserve was assembled incrementally over decades. The offshore islet of Jungfruskär received
      legal protection in 1943, Idholm followed in 1949, and the core Nåtö reserve was established in 1964,
      subsequently expanded in multiple phases. Today Idholm, Jungfruskär and Nåtö form a cohesive
      conservation unit.


      The historical vernacular buildings of the former Norrgård farmstead are maintained by the Government of
      Åland; several are utilized by the Nåtö Biological Station, which hosts academic fieldwork and botanical
      courses. The primary ecological threat is insidious: declining pastoral grazing allows common reed and
      encroaching scrub to swallow open coastal swards. A potential maritime hazard would be an accidental oil
      spill along the busy shipping lane traversing the adjacent waters.
    before: >-
      Check access regulations and landing permissions with the reserve authority before arranging boat trips
      to the outlying islets. Also verify the exact scheduled dates for the municipal guided walk, which takes
      place only on selected days.
  fr:
    intro: >-
      Songez à un pré séculaire où la main de l’homme n’a jamais cessé d’œuvrer. Chaque année, la litière est
      ratissée, le foin est fauché puis les bêtes viennent y pâturer, exactement comme on le fait depuis des
      siècles ; au printemps, ce sol jardiné s’illumine d’un tapis d’hépatiques, d’anémones, de primevères et
      d’orchidées. Tel est Nåtö, le cœur de la réserve de Nåtö–Jungfruskär, sur la commune de Lemland à Åland.
      Autour de l’île principale, un chapelet d’îlots complète ce décor avec des boisements quasi vierges et
      la plus dense yeuse du nord de la mer Baltique.
    landscape: >-
      La réserve forme une mosaïque : labours, prairies de fauche, massifs boisés et archipel marin. Le
      domaine maritime rassemble huit îlots isolés et quatre archipels d’îlots à la nature opulente, tandis
      que l’île de Nåtö réunit les prés boisés les plus remarquables.


      Ces prés boisés incarnent l’âme du site. Ce sont des paysages ouverts mêlant bosquets de feuillus,
      buissons de noisetiers et clairières herbeuses, maintenus par un débroussaillage printanier minutieux,
      l’émondage, la coupe des rejets et le pâturage d’arrière-saison. Eskskär, Idholm, Senskär et Slåtholm
      présentent ce même visage pastoral et font l’objet d’un entretien coutumier. À l’opposé s’étend la forêt
      ancienne : sur Yttre Korsö, les peuplements sont vénérables et regorgent de bois mort au sol, tandis
      qu’Inre Korsö porte de vieux résineux et d’épais fourrés d’ifs dans les creux humides. Sur Jungfruskär,
      la forêt d’ifs forme un fouillis presque impénétrable comptant au bas mot 1200 individus recensés.
    wildlife: >-
      Le printemps est la saison reine des floraisons. S’épanouissent tour à tour l’hépatique noble, l’anémone
      sylvie, l’anémone fausse-renoncule, la primevère officinale et les orchidées dactilorhize de mai et
      orchis mâle. Dans les pelouses à Sesleria fleurit la primevère farineuse. Idholm est la station la plus
      riche sur le plan floristique de tout l’archipel d’Åland, abritant une part majeure des effectifs
      d’orchis mâle de Finlande. À Nåtö, les botanistes soulignent l’abondance remarquable de la fleur
      emblématique d’Åland. La réserve héberge aussi des lichens rares et des champignons saproxyliques
      d’exception.


      L’océan et la forêt apportent leur lot d’oiseaux. Sur Yttre Korsö niche [le pygargue à queue
      blanche](/especie/haliaeetus_albicilla/) ; lors de l’inventaire de 2015, deux jeunes emplumés
      s’exerçaient au vol au-dessus du nid. Senskär a compté treize nids d’[eider à
      duvet](/especie/somateria_mollissima/) occupés ce printemps-là. Aux abords de Nåtö prospère le grèbe
      jougris, avec un couple reproducteur à Västerberget et dans l’est de Nåtö. De nombreux passereaux
      cavicoles nichent dans les vieux arbres, ainsi que le cassenoix moucheté.
    visit: >-
      On entame la visite par Nåtö. Un sentier d’interprétation balisé serpente à travers les prés boisés,
      accessible par une chaussée surélevée de dix kilomètres qui relie les îles depuis le sud de Mariehamn
      jusqu’à l’archipel de Järsö et Nåtö. La frange occidentale de la réserve se situe sur l’île même, à
      environ trois kilomètres et demi au sud de Mariehamn.


      La commune organise une randonnée patrimoniale guidée sur Nåtö, longue d’environ trois kilomètres, au
      moment où les floraisons atteignent leur plénitude. Le relief est facile, avec de courts passages
      rocheux et des passerelles en bois aménagées ; le rassemblement a lieu sur l’aire de stationnement à
      droite de la route de Järsö, deux cents mètres après le pont.


      Jungfruskär dispose de son propre sentier naturel pour découvrir l’if millénaire. Le circuit de Nåtö et
      celui de Jungfruskär constituent deux excursions distinctes, à planifier séparément.
    history: >-
      La réserve s’est constituée par étapes successives. L’îlot de Jungfruskär est protégé dès 1943, Idholm
      en 1949 et la réserve de Nåtö a été décrétée en 1964, puis agrandie à plusieurs reprises. Aujourd’hui
      Idholm, Jungfruskär et Nåtö forment un ensemble écologique cohérent.


      Les bâtiments historiques de l’ancien domaine de Norrgård sont entretenus par les autorités d’Åland, et
      certains sont confiés à la Station biologique de Nåtö, vouée à la recherche et aux stages universitaires
      de botanique. La menace principale reste silencieuse : avec le recul du pâturage, le roseau et les
      épineux envahissent les pelouses littorales. Un autre risque majeur résiderait dans une pollution
      maritime par hydrocarbures le long du chenal de navigation proche.
    before: >-
      Consultez l’organisme gestionnaire pour connaître les modalités d’accès maritime avant d’envisager une
      excursion vers les îlots isolés. Renseignez-vous également sur les dates précises de la sortie guidée
      communale, proposée ponctuellement.
  de:
    intro: >-
      Stelle dir eine jahrhundertealte Wiese vor, auf der die menschliche Pflege niemals abriss. Alljährlich
      wird das Reisig zusammengeharkt, das Heu gemäht und danach das Weidevieh aufgetrieben, genau wie es seit
      Generationen Brauch ist; im Frühjahr verwandelt sich der gepflegte Boden in ein Blütenmeer aus
      Leberblümchen, Buschwindröschen, Schlüsselblumen und wilden Orchideen. Das ist Nåtö, das Herzstück des
      Reservats Nåtö–Jungfruskär in der Gemeinde Lemland auf Åland. Rings um die Insel vervollständigt ein
      Kranz kleiner Schären das Bild mit urwaldartigen Wäldern und dem größten Eibenwald des nördlichen
      Ostseeraums.
    landscape: >-
      Das Reservat ist ein Mosaik: Äcker, Wiesen, dichter Wald und Schärenarchipel. Den maritimen Teil bilden
      acht Einzelschären und vier Schärengruppen von außergewöhnlicher biologischer Vielfalt, während sich auf
      der Hauptinsel Nåtö die berühmten Laubwiesen konzentrieren.


      Die traditionellen Laubwiesen sind die Seele des Ortes. Es sind parkartige Halboffenlandschaften aus
      Laubgehölzen, Haseldickichten und besonnten Grasfluren, die durch alljährliches Ausputzen, Schneiteln,
      Entbuschen und Spätsommerweide offengehalten werden. Eskskär, Idholm, Senskär und Slåtholm teilen diesen
      bäuerlichen Charakter und werden althergebracht gepflegt. Dem gegenüber steht der Altwald: Auf Yttre
      Korsö ist der Wald uralt und reich an stehendem und liegendem Totholz, während auf Inre Korsö urige
      Nadelbäume und dichte Eibenunterhölzer in feuchten Senken gedeihen. Auf Jungfruskär ist der Eibenwald
      über weite Strecken undurchdringlich und zählt mindestens 1200 Exemplare.
    wildlife: >-
      Das Frühjahr ist die große Zeit der Blütenpflanzen. Es blühen Leberblümchen, Buschwindröschen, Gelbes
      Windröschen, Echte Schlüsselblume sowie die Orchideen Holunder-Knabenkraut und Männliches Knabenkraut.
      Auf den Sesleria-Kalkrasen leuchtet die Mehlprimel. Idholm ist der botanisch artenreichste aller
      untersuchten Standorte auf Åland und beherbergt einen bedeutenden Teil des finnischen Gesamtbestands des
      Männlichen Knabenkrauts. Auf Nåtö blüht die åländische Provinzialblume in verschwenderischer Fülle.
      Hinzu kommen seltene Gesteinsflechten und holzbewohnende Pilze.


      Meer und Wald bringen ihre Vogelwelt mit. Auf Yttre Korsö brütet der
      [Seeadler](/especie/haliaeetus_albicilla/); bei der Bestandserfassung 2015 erprobten zwei bereits flügge
      Jungvögel ihre Schwingen über dem Horst. Auf Senskär wurden dreizehn in jenem Frühjahr genutzte Nester
      der [Eiderente](/especie/somateria_mollissima/) gezählt. Um Nåtö ist der Ohrentaucher häufig, mit je
      einem Brutpaar am Västerberget und im Ostteil von Nåtö. Zahlreiche Höhlenbrüter nutzen das Altholz,
      ebenso wie der Tannenhäher.
    visit: >-
      Der Ausgangspunkt ist Nåtö. Dort zieht ein markierter Naturlehrpfad durch die Laubwiesen, erreichbar
      über eine zehn Kilometer lange Dammstraße, die sich von Mariehamn südwärts über Inselketten bis zum
      Schärengarten von Järsö und Nåtö zieht. Der Westteil des Reservats liegt auf der Insel selbst, etwa
      dreieinhalb Kilometer südlich von Mariehamn.


      Die Gemeindeverwaltung veranstaltet eine geführte kulturhistorische Wanderung über Nåtö von rund drei
      Kilometern Länge, wenn die Wiesen in voller Blüte stehen. Das Gelände ist einfach, mit kurzen felsigen
      Passagen und Holzbohlenstegen an feuchten Stellen; Treffpunkt ist der Wanderparkplatz rechts an der
      Järsö-Straße, etwa zweihundert Meter hinter der Brücke.


      Jungfruskär besitzt einen eigenen Naturpfad zur Erkundung des Eibenhains. Der Rundgang auf Nåtö und der
      Pfad auf Jungfruskär sind getrennte Exkursionen, die du am besten als zwei eigenständige Ausflüge
      planst.
    history: >-
      Das Schutzgebiet entstand in mehreren Etappen. Die Schäre Jungfruskär steht seit 1943 unter Schutz,
      Idholm seit 1949, und das Schutzgebiet Nåtö wurde 1964 ausgewiesen und später sukzessive erweitert.
      Heute bilden Idholm, Jungfruskär und Nåtö ein zusammenhängendes Ganzes.


      Die historischen Hofgebäude des einstigen Norrgård-Guts werden von der åländischen Landschaftsregierung
      unterhalten; Teile davon nutzt die Biologische Station Nåtö für botanische Forschung und universitäre
      Lehrveranstaltungen. Die größte Gefährdung schleicht unbemerkt heran: Geht die Beweidung zurück,
      überwuchern Schilf und Weidengebüsch die artenreichen Küstenwiesen. Eine weitere Bedrohung wäre eine
      Ölpest auf der nahen Seeschifffahrtsstraße.
    before: >-
      Erkundige dich bei der Schutzgebietsverwaltung über Betretungsregeln und Anlandeplätze, bevor du Fahrten
      zu den Außenschären organisierst. Prüfe auch die Termine der geführten Gemeindewanderung, die nur zu
      ausgewählten Anlässen stattfindet.
  it:
    intro: >-
      Immagina un prato secolare in cui la mano dell’uomo non ha mai smesso di operare. Ogni anno si
      rastrellano i residui legnosi, si falcia il fieno e poi vi pascolano gli animali, proprio come si fa da
      generazioni; in primavera quel suolo curato si trasforma in un tappeto di epatiche, anemoni, primule e
      orchidee selvatiche. Questo è Nåtö, il fulcro della riserva di Nåtö–Jungfruskär nel comune di Lemland,
      nelle Åland. Attorno all’isola principale, una corona di isolotti completa lo scenario con boschi
      vergini e la più imponente tasseta del Baltico settentrionale.
    landscape: >-
      La riserva è un mosaico: seminativi, prati falciabili, macchie forestali e arcipelago marino. Il settore
      marino comprende otto isolotti isolati e quattro gruppi insulari ricchi di habitat incontaminati, mentre
      sull’isola di Nåtö si concentrano i celebri prati alberati.


      I prati arborati costituiscono l’essenza del paesaggio. Sono ambienti semi-aperti formati da alberature
      di latifoglie, cespuglieti di nocciolo e radure erbose soleggiate, tenuti in vita da sfalci primaverili,
      potature a capitozza, rimozione degli arbusti e pascolo tardo-estivo. Eskskär, Idholm, Senskär e
      Slåtholm condividono questa identica fisionomia pastorale e vengono curati tradizionalmente. Al polo
      opposto sorge la foresta primigenia: su Yttre Korsö il bosco è vetusto e ricco di tronchi marcescenti a
      terra, mentre su Inre Korsö crescono vecchie conifere e fitti grovigli di tasso nelle forre umide. A
      Jungfruskär la tasseta è in gran parte impenetrabile e raccoglie almeno 1200 esemplari censiti.
    wildlife: >-
      La primavera è la stagione del risveglio botanico. Sbocciano l’erba trinità, l’anemone dei boschi,
      l’anemone gialla, la primula odorosa e le orchidee colombina e orchide maschia. Nelle praterie a
      Sesleria compare la primula farinosa. Idholm si rivela la stazione floristicamente più ricca tra tutte
      quelle studiate nelle Åland, accogliendo una quota rilevante dell’intera popolazione finlandese di
      orchide maschia. A Nåtö i botanici evidenziano la fioritura spettacolare del fiore provinciale delle
      Åland. Non mancano licheni rari e funghi legati al legno morto.


      Il mare e le selve richiamano una ricca avifauna. Su Yttre Korsö nidifica l’[aquila di
      mare](/especie/haliaeetus_albicilla/); nel censimento del 2015 due giovani già impiumati provavano i
      primi voli nei pressi del nido. Su Senskär sono stati individuati tredici nidi di [edredone
      comune](/especie/somateria_mollissima/) occupati in quella primavera. Attorno a Nåtö abbonda lo svasso
      cornuto, con coppie nidificanti a Västerberget e nel settore orientale dell’isola. Molte specie
      nidificano nelle cavità degli alberi cavi, assieme alla nocciolaia.
    visit: >-
      La visita prende avvio da Nåtö. Lì si sviluppa un sentiero naturalistico guidato tra i prati arborati,
      raggiungibile mediante una strada a rilevato di dieci chilometri che unisce varie isole a sud di
      Mariehamn fino all’arcipelago di Järsö e Nåtö. La porzione occidentale della riserva si trova sull’isola
      stessa, circa tre chilometri e mezzo a sud di Mariehamn.


      Il comune programma un’escursione culturale guidata a Nåtö, di circa tre chilometri, nel momento in cui
      le fioriture del prato raggiungono il massimo splendore. Il cammino è agevole, con brevi tratti rocciosi
      e passerelle in legno sui punti umidi; il ritrovo è al parcheggio sulla destra della via di Järsö, circa
      duecento metri oltre il ponte.


      Jungfruskär vanta un proprio tracciato per addentrarsi nella foresta di tassi. La passeggiata a Nåtö e
      il percorso di Jungfruskär sono escursioni disgiunte, da programmare come due uscite indipendenti.
    history: >-
      La riserva si è costituita per tappe successive. L’isolotto di Jungfruskär è tutelato dal 1943, Idholm
      dal 1949 e la riserva di Nåtö è stata istituita nel 1964, per poi essere ampliata nel tempo. Oggi
      Idholm, Jungfruskär e Nåtö formano un comprensorio unitario.


      Gli storici fabbricati rurali della fattoria di Norrgård sono mantenuti dal governo delle Åland; alcuni
      sono affidati alla Stazione Biologica di Nåtö, che organizza attività di ricerca e corsi universitari di
      botanica. La minaccia principale è lenta e silenziosa: con la riduzione del pascolo, canneti e roveti
      inselvatichiscono i prati costieri. Un pericolo potenziale sarebbe un inquinamento da idrocarburi lungo
      la rotta navale che costeggia l’arcipelago.
    before: >-
      Chiedi all’ente di gestione le condizioni di accesso prima di pianificare escursioni in barca verso gli
      isolotti minori. Verifica inoltre il calendario delle visite guidate comunali, organizzate con cadenza
      puntuale.
  pt:
    intro: >-
      Imagina um prado centenário no qual ninguém deixou de trabalhar. Todos os anos se limpa o chão, se corta
      o feno e depois entra o gado para pastar, tal como se faz há séculos; na primavera esse solo cuidado
      cobre-se de hepáticas, anémonas, prímulas e orquídeas bravias. Assim é Nåtö, o coração da reserva de
      Nåtö–Jungfruskär, no município de Lemland, em Åland. Ao redor da ilha, um colar de ilhéus completa o
      cenário com bosques primitivos e o maior teixedo do norte do Báltico.
    landscape: >-
      A reserva desenha um mosaico: campos agrícolas, prados de feno, bosque denso e arquipélago marinho. O
      setor marinho é constituído por oito ilhéus e quatro grupos de ilhéus de grande riqueza biológica,
      enquanto na ilha de Nåtö se concentram os prados arborizados.


      Os prados arborizados são a alma do lugar. São paisagens semiabertas de arvoredo folhoso, com moitas de
      aveleiras e clareiras relvadas expostas ao sol, mantidas por desbastes primaveris, podas, limpeza de
      mato e pastoreio de fim de verão. Eskskär, Idholm, Senskär e Slåtholm ostentam o mesmo perfil e recebem
      tratos tradicionais. No polo oposto ergue-se a floresta antiga: em Yttre Korsö o bosque é vetusto e rico
      em madeira morta no solo, ao passo que em Inre Korsö surgem coníferas antigas e densos matagais de teixo
      nas depressões húmidas. Em Jungfruskär, o teixedo é em grande parte impenetrável e reúne pelo menos 1200
      exemplares.
    wildlife: >-
      A primavera é a época áurea da floração. Despontam a hepática, a anémona-dos-bosques, a anémona-amarela,
      a prímula e as orquídeas erva-canária e orchis-macho. Nos prados de Sesleria floresce a
      prímula-farinhenta. Idholm é o ponto botanicamente mais rico de todos os inventariados em Åland,
      acolhendo uma percentagem expressiva dos exemplares de orchis-macho de toda a Finlândia. Em Nåtö, os
      botânicos assinalam a floração exuberante da flor provincial de Åland. Ocorrem também líquenes raros e
      cogumelos associados à madeira morta.


      O mar e o arvoredo atraem aves emblemáticas. Em Yttre Korsö nidifica o
      [águia-rabalva](/especie/haliaeetus_albicilla/); no censo de 2015, duas crias já empenadas ensaiavam
      voos junto ao ninho. Em Senskär registaram-se treze ninhos de
      [êider-edredão](/especie/somateria_mollissima/) utilizados nessa primavera. Nas imediações de Nåtö
      abunda o mergulhão-de-pescoço-castanho, com casais reprodutores em Västerberget e no setor oriental de
      Nåtö. Várias aves de cavidades criam na reserva, bem como o quebra-nozes.
    visit: >-
      A visita arranca em Nåtö. Ali existe um trilho pedestre sinalizado através dos prados, acessível por uma
      estrada sob alteamento de dez quilómetros que encadeia ilhas para sul de Mariehamn até ao arquipélago de
      Järsö e Nåtö. O setor ocidental da reserva fica na própria ilha, cerca de três quilómetros e meio a sul
      de Mariehamn.


      O município promove um passeio cultural guiado por Nåtö, de cerca de três quilómetros, quando o prado
      atinge o apogeu da floração. O terreno é suave, com curtas passagens sobre rocha e passadiços sobre
      zonas encharcadas; o ponto de encontro situa-se no parque de estacionamento à direita da estrada de
      Järsö, duzentos metros depois da ponte.


      Jungfruskär possui o seu próprio trilho pedestre para contemplar o teixedo. O percurso por Nåtö e o
      trilho de Jungfruskär são caminhadas distintas, devendo ser planeadas como duas saídas independentes.
    history: >-
      A reserva estruturou-se por etapas sucessivas. O ilhéu de Jungfruskär foi classificado em 1943, Idholm
      em 1949 e a reserva de Nåtö data de 1964, tendo sido alargada gradualmente. Hoje Idholm, Jungfruskär e
      Nåtö compõem uma área protegida unificada.


      O conjunto edificado da antiga herdade de Norrgård é mantido pelo governo de Åland; parte é utilizada
      pela Estação Biológica de Nåtö, vocacionada para a investigação e cursos universitários de botânica. A
      ameaça principal é insidiosa: com a quebra do pastoreio, o caniço e o mato invadem as pastagens
      litorais. Um perigo adicional seria um derrame acidental de petróleo na rota marítima de navegação
      próxima.
    before: >-
      Informa-te junto da entidade gestora sobre as normas de acesso antes de organizares travessias de barco
      para os ilhéus remotos. Confirma igualmente as datas das caminhadas guiadas municipais, que se realizam
      de forma pontual.
