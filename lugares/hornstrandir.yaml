resumen:
  es: >-
    Una península ártica abandonada en los años cincuenta, sin carreteras, donde el zorro ártico vive sin caza
    y sin miedo.
  en: >-
    An arctic peninsula abandoned in the fifties, without roads, where the arctic fox lives without hunting
    and without fear.
  fr: >-
    Une péninsule arctique abandonnée dans les années cinquante, sans routes, où le renard polaire vit sans
    chasse et sans crainte.
  de: >-
    Eine in den fünfziger Jahren verlassene arktische Halbinsel ohne Straßen, auf der der Polarfuchs ohne Jagd
    und ohne Scheu lebt.
  it: >-
    Una penisola artica abbandonata negli anni cinquanta, senza strade, dove la volpe artica vive senza caccia
    e senza timore.
  pt: >-
    Uma península ártica abandonada nos anos cinquenta, sem estradas, onde a raposa-do-ártico vive sem caça e
    sem receio.
unico:
  es: >-
    Se puede caminar durante días sin ver a nadie, y el zorro ártico, protegido por la prohibición de caza, se
    deja ver con mucha probabilidad.
  en: >-
    You can walk for days without seeing anyone, and the arctic fox, protected by a ban on hunting, is very
    likely to be seen.
  fr: >-
    On peut marcher des jours durant sans croiser âme qui vive, et le renard polaire, protégé de toute chasse,
    s'observe très aisément.
  de: >-
    Du kannst tagelang wandern, ohne einer Menschenseele zu begegnen, und der durch das Jagdverbot geschützte
    Polarfuchs lässt sich mit hoher Wahrscheinlichkeit blicken.
  it: >-
    Si può camminare per giorni senza incontrare nessuno, e la volpe artica, protetta dal divieto di caccia,
    si lascia avvistare con grande facilità.
  pt: >-
    É possível caminhar durante dias sem ver ninguém, e a raposa-do-ártico, protegida pelo defeso da caça,
    deixa-se avistar com enorme probabilidade.
observaciones:
  es: >-
    Por la fragilidad de la vegetación y los caminos, toda actividad debe registrarse electrónicamente en la
    agencia ambiental en primavera y otoño; los plazos exactos hay que comprobarlos antes de ir. Solo se puede
    acampar en zonas designadas: hay catorce campamentos de la agencia ambiental y dos privados, y una tienda
    solo puede estar una semana seguida en el mismo sitio. Los grupos organizados no pueden pasar de 30
    personas en la parte oeste ni de 15 en la este.


    Están prohibidos los fuegos de campamento, los perros (salvo los de propietarios, siempre atados), las
    bicicletas y los drones sin permiso. Hay que llevarse toda la basura, no construir hitos ni mover piedras,
    y usar los senderos. Se puede registrar un plan de viaje en Safetravel.
texto:
  es:
    intro: >-
      Aquí casi no hay infraestructura y hay pocos turistas. Hornstrandir es la península más septentrional de
      Islandia, en el extremo norte de los Fiordos del Oeste, al noroeste del glaciar Drangajökull. Son unos
      580 km² de tundra, fiordo, glaciar y terreno alpino con una vegetación rica pero frágil. Se llega en
      barco, se camina con mapa y se duerme en tienda. Quien viene se lleva el silencio, los acantilados
      llenos de aves y, con suerte, un zorro ártico que lo mira de frente.
    landscape: >-
      Hornstrandir son tres atractivos que se explican entre sí. El primero son los acantilados de aves que
      rodean la bahía de Hornvík, de más de 500 metros de altura en el lado oriental, un «imán de proporciones
      gigantescas» por las aves que concentran. Hornstrandir tiene tres grandes acantilados de aves:
      Hornbjarg, Hælavíkurbjarg y Riturinn. El segundo es una naturaleza pura y tranquila, con una fuerte
      sensación de aislamiento porque casi no hay infraestructura y hay pocos turistas para un territorio tan
      grande. El tercero nace de los dos anteriores y de la prohibición de caza: el zorro.


      Al sur, Jökulfirðir, los «fiordos de los glaciares», son cinco fiordos y bahías; cuatro forman toda la
      costa sur de Hornstrandir y el quinto, Leirufjörður, queda justo al sur. Es una de las costas más
      retorcidas de la península.
    wildlife: >-
      Entre las aves de estos acantilados figuran los [frailecillos](/especie/fratercula_arctica/),
      [araos](/especie/uria_aalge/), las [alcas](/especie/alca_torda/) y los
      [fulmares](/especie/fulmarus_glacialis/). Los barcos no pueden acercarse a menos de 115 m de las
      colonias de aves marinas, y se recomienda no pasar a menos de un kilómetro de los acantilados.


      El [zorro ártico](/especie/vulpes_lagopus/) es la estrella. La reserva es uno de los hábitats de zorros
      más importantes de Europa. Si encuentras una madriguera, mantente al menos a 40 m, no te quedes más de
      20 minutos, no te pongas entre la zorra y sus crías y no des de comer a los zorros.
    visit: >-
      Lo más habitual es llegar por mar, con salidas regulares desde Ísafjörður, Bolungarvík y Norðurfjörður.
      No se permite aterrizar helicópteros en la reserva, y las dos pistas de aterrizaje, en Látrar y
      Fljótavík, no están registradas ni tienen equipamiento.


      Antes de empezar, pasa por Hornstrandastofa, el centro de visitantes de Ísafjörður: allí hay guardas que
      ayudan a planificar el viaje y una pequeña exposición sobre la vida en Hornstrandir. En la zona, la
      agencia ambiental tiene guardas en Höfn, en Hornvík, y en Hesteyri, que informan a los visitantes.


      Los caminos principales están marcados con hitos de piedra, que son fáciles de perder en un entorno
      desconocido, por eso se necesita un buen mapa y brújula o GPS. La zona suele tener niebla y es difícil
      orientarse; los ríos pueden ser difíciles de vadear tras lluvias fuertes y hay nieve todo el año, con
      neveros empinados a principios de verano.
    history: >-
      Hornstrandir fue una tierra habitada. Había población considerable en siglos anteriores, que desapareció
      a mediados del siglo XX, y hubo un farero en el faro de Hornbjarg hasta 1995. En la bahía de Hornvík
      hubo tres asentamientos: Horn (abandonado en 1946), Höfn y Rekavík bak Höfn (ambos en 1944). Décadas
      después, algunos descendientes volvieron y reconstruyeron sus casas, y gran parte del terreno es
      privado.


      La reserva existe desde 1975, con algunas de las normas de protección más estrictas de Islandia. Es de
      categoría Ib de la UICN: un área extensa y salvaje, poco o nada alterada por el ser humano, que conserva
      sus rasgos naturales. Su principio guía es proteger una gran área donde reine la calma, con poca
      infraestructura y con los procesos naturales sin interferencia humana.
    before: >-
      Por la fragilidad de la vegetación y los caminos, toda actividad debe registrarse electrónicamente en la
      agencia ambiental en primavera y otoño; los plazos exactos hay que comprobarlos antes de ir. Solo se
      puede acampar en zonas designadas: hay catorce campamentos de la agencia ambiental y dos privados, y una
      tienda solo puede estar una semana seguida en el mismo sitio. Los grupos organizados no pueden pasar de
      30 personas en la parte oeste ni de 15 en la este.


      Están prohibidos los fuegos de campamento, los perros (salvo los de propietarios, siempre atados), las
      bicicletas y los drones sin permiso. Hay que llevarse toda la basura, no construir hitos ni mover
      piedras, y usar los senderos. Se puede registrar un plan de viaje en Safetravel.
    around: >-
      Hornstrandir no tiene vecinos cercanos en el atlas, pero comparte acantilados de aves marinas con otros
      lugares: los [Acantilados Ornitológicos de Vestmanna](/lugar/vestmanna-bird-cliffs/) y la [Isla de
      Kalsoy y Faro de Kallur](/lugar/kalsoy/) comparten fulmar y frailecillo, y el [Cabo
      Fréhel](/lugar/cap-frehel/) y la [Reserva Natural de las
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) comparten alcas y araos.
  en:
    intro: >-
      Here there is virtually no infrastructure and very few tourists. Hornstrandir is the northernmost
      peninsula of Iceland, on the northern tip of the Westfjords, northwest of the Drangajökull glacier. It
      spans some 580 km² of tundra, fjords, glacial remnants, and alpine terrain with rich yet fragile
      vegetation. You arrive by boat, navigate by map, and sleep in a tent. Whoever ventures here brings away
      total silence, cliffs bustling with seabirds, and, with a little luck, an arctic fox looking right back
      at you.
    landscape: "Hornstrandir is defined by three interconnected attractions. The first is the sheer bird cliffs encircling Hornvík bay, soaring over 500 metres high on the eastern side, acting as a colossal magnet for nesting seabirds. Hornstrandir boasts three great seabird cliffs: Hornbjarg, Hælavíkurbjarg, and Riturinn. The second is an untamed, serene wilderness with an overwhelming sense of remoteness, given the absence of roads and the sparse number of visitors in such a vast tract. The third arises from both factors combined with an absolute ban on hunting: the arctic fox.\r\n\r\nTo the south, Jökulfirðir, the «glacier fjords», comprise five distinct fjords and bays; four outline the entire southern shore of Hornstrandir, while the fifth, Leirufjörður, cuts just to the south. It is among the most deeply indented coastlines on the entire peninsula."
    wildlife: "The teeming bird colonies on these cliffs include [Atlantic puffins](/especie/fratercula_arctica/), [common murres](/especie/uria_aalge/), [razorbills](/especie/alca_torda/), and [northern fulmars](/especie/fulmarus_glacialis/). Boats are legally barred from approaching closer than 115 m to seabird cliffs, and seafarers are advised to stay at least one kilometre away from the rock faces.\r\n\r\nThe [arctic fox](/especie/vulpes_lagopus/) is the iconic resident. The reserve protects one of the most vital arctic fox strongholds in all Europe. Should you encounter an active den, keep a distance of at least 40 m, remain no longer than 20 minutes, never position yourself between a vixen and her cubs, and never feed the foxes."
    visit: "Arrival is predominantly by boat, with scheduled boat transfers departing from Ísafjörður, Bolungarvík, and Norðurfjörður. Helicopter landings within the reserve are prohibited, and the two unpaved landing strips at Látrar and Fljótavík are unregistered and unserviced.\r\n\r\nBefore setting out, stop by Hornstrandastofa, the visitor centre in Ísafjörður, where wardens provide route planning advice alongside an exhibit on historic life in Hornstrandir. Out in the field, the environmental agency posts rangers at Höfn in Hornvík and at Hesteyri to assist travelers.\r\n\r\nMain trails are marked with stone cairns, which can easily be lost in poor visibility; carrying a topographic map and compass or GPS is indispensable. Dense fog frequently blankets the peninsula, complicating navigation; glacial rivers can become impassable after heavy rain, and snowdrifts linger year-round, with steep snow gullies persisting well into early summer."
    history: "Hornstrandir was once an inhabited frontier. A modest human population resided here in previous centuries before communities vanished by the mid-twentieth century, with the lighthouse keeper at Hornbjarg lighthouse remaining until 1995. Around Hornvík bay stood three homesteads: Horn (abandoned in 1946), Höfn, and Rekavík bak Höfn (both in 1944). Decades later, several descendants returned to restore historic houses, and extensive land parcels remain private.\r\n\r\nThe nature reserve was established in 1975, enacting some of Iceland's strictest environmental protections. It is designated IUCN Category Ib: a vast wilderness largely unmodified by human intervention, preserving its natural processes. Its guiding ethos is to safeguard a peaceful realm where natural dynamics operate without anthropogenic interference."
    before: "Due to the vulnerability of mosses and paths, all independent trekking must be registered online with the environmental agency in spring and autumn; check exact registration dates before traveling. Camping is strictly restricted to designated sites: there are fourteen public campsites managed by the environmental agency and two private sites, with a maximum stay of one week in any single spot. Guided groups may not exceed 30 people in the western sector or 15 in the eastern sector.\r\n\r\nOpen campfires, dogs (except landowners' working dogs, kept leashed), bicycles, and unauthorized drones are banned. Pack out all rubbish, refrain from erecting cairns or shifting rocks, and stick to the footpaths. You can log your travel itinerary with Safetravel."
    around: >-
      Hornstrandir has no immediate neighbors in the atlas, but shares seabird breeding cliffs with other
      oceanic outposts: the [Vestmanna Bird Cliffs](/lugar/vestmanna-bird-cliffs/) and the [Isle of Kalsoy and
      Kallur Lighthouse](/lugar/kalsoy/) share northern fulmar and Atlantic puffin, while [Cap
      Fréhel](/lugar/cap-frehel/) and the [Sept-Îles Nature Reserve](/lugar/reserve-naturelle-des-sept-iles/)
      share razorbills and common murres.
  fr:
    intro: >-
      Ici, presque aucune infrastructure n'existe et les touristes sont rares. Hornstrandir est la péninsule
      la plus septentrionale d'Islande, à la pointe nord des Fjords de l'Ouest, au nord-ouest du glacier
      Drangajökull. Elle déploie quelque 580 km² de toundra, de fjords, de glaciers et de reliefs alpins à la
      végétation riche mais fragile. On y accède par la mer, on s'y oriente à la carte et on y dort sous la
      tente. Ceux qui s'y aventurent découvrent le silence, des falaises grouillantes d'oiseaux et, avec un
      peu de chance, un renard polaire qui vous regarde droit dans les yeux.
    landscape: "Hornstrandir s'articule autour de trois attraits indissociables. Le premier réside dans les falaises aviaires ceinturant la baie de Hornvík, dressant plus de 500 mètres de paroi rocheuse sur leur flanc oriental, véritable aimant pour les oiseaux marins. Hornstrandir compte trois grandes murailles ornithologiques : Hornbjarg, Hælavíkurbjarg et Riturinn. Le deuxième est une nature inviolée et paisible, imprégnée d'une profonde sensation d'isolement en raison de l'absence de routes et du faible nombre de marcheurs dans un territoire aussi vaste. Le troisième découle directement des précédents et de l'interdiction de chasser : le renard.\r\n\r\nAu sud, les Jökulfirðir, « fjords des glaciers », rassemblent cinq fjords et baies ; quatre découpent tout le littoral sud de Hornstrandir, tandis que le cinquième, Leirufjörður, s'enfonce immédiatement au sud. C'est l'un des découpages côtiers les plus tourmentés de la péninsule."
    wildlife: "Les colonies de ces falaises comptent des [macareux moines](/especie/fratercula_arctica/), des [guillemots de Troïl](/especie/uria_aalge/), des [petits pingouins](/especie/alca_torda/) et des [fulmars boréaux](/especie/fulmarus_glacialis/). Les embarcations ne doivent pas s'approcher à moins de 115 m des falaises ornithologiques, et il est recommandé de naviguer à plus d'un kilomètre des parois.\r\n\r\nLe [renard polaire](/especie/vulpes_lagopus/) est le seigneur des lieux. La réserve constitue l'un des sanctuaires de renards les plus majeurs d'Europe. Si vous découvrez une tanière, tenez-vous à au moins 40 m de distance, ne restez pas plus de 20 minutes, ne vous interposez jamais entre la renarde et ses petits et ne nourrissez pas les renards."
    visit: "L'accès s'effectue couramment par bateau, avec des liaisons régulières au départ d'Ísafjörður, de Bolungarvík et de Norðurfjörður. Les atterrissages d'hélicoptères sont interdits dans la réserve, et les deux pistes sommaires de Látrar et Fljótavík ne sont ni répertoriées ni équipées.\r\n\r\nAvant d'embarquer, faites étape à Hornstrandastofa, le centre d'accueil d'Ísafjörður : des gardes vous aident à concevoir votre périple et une petite exposition retrace la vie d'autrefois à Hornstrandir. Sur le terrain, l'Agence pour l'environnement dépêche des gardes à Höfn, dans la baie de Hornvík, ainsi qu'à Hesteyri pour orienter les randonneurs.\r\n\r\nLes sentiers principaux sont jalonnés de cairns, faciles à perdre de vue par mauvais temps ; une carte topographique précise ainsi qu'une boussole ou un GPS s'avèrent indispensables. Le brouillard est fréquent et brouille l'orientation ; les torrents peuvent devenir difficiles à guéer après de fortes pluies et la neige persiste toute l'année, formant des névés pentus jusqu'au début de l'été."
    history: "Hornstrandir fut jadis une contrée habitée. Une population côtière y vivait aux siècles passés, avant de s'effacer au milieu du XXe siècle, un gardien demeurant au phare de Hornbjarg jusqu'en 1995. Trois hameaux s'élevaient dans la baie de Hornvík : Horn (délaissé en 1946), Höfn et Rekavík bak Höfn (tous deux en 1944). Des décennies plus tard, certains descendants sont revenus restaurer leurs maisons familiales, et de vastes parcelles restent privées.\r\n\r\nLa réserve naturelle existe depuis 1975, dotée de protections parmi les plus strictes d'Islande. Classée en catégorie Ib de l'UICN, c'est un espace sauvage étendu, non altéré par l'homme, conservant ses dynamiques écologiques naturelles sans interférence humaine."
    before: "Face à la vulnérabilité des sols et de la végétation, toute expédition doit être déclarée par voie électronique auprès de l'Agence pour l'environnement au printemps et à l'automne ; vérifiez les dates imposées avant de partir. Le bivouac est rigoureusement limité aux zones autorisées : il existe quatorze aires de camping gérées par l'Agence et deux campings privés, une tente ne pouvant stationner plus d'une semaine consécutive au même endroit. Les groupes encadrés ne doivent pas dépasser 30 personnes dans la partie ouest ni 15 dans la partie est.\r\n\r\nSont strictement interdits les feux de camp, les chiens (sauf ceux des propriétaires, tenus en laisse), les vélos et les drones sans dérogation. Emportez tous vos déchets, ne bâtissez pas de cairns et restez sur les sentiers. Il est vivement conseillé d'enregistrer son plan de marche sur Safetravel."
    around: >-
      Hornstrandir ne compte pas de voisins immédiats dans l'atlas, mais partage ses falaises d'oiseaux marins
      avec d'autres bastions côtiers : les [falaises ornithologiques de
      Vestmanna](/lugar/vestmanna-bird-cliffs/) et l'[île de Kalsoy et phare de Kallur](/lugar/kalsoy/)
      partagent le fulmar et le macareux, tandis que le [cap Fréhel](/lugar/cap-frehel/) et la [réserve
      naturelle des Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) partagent le petit pingouin et le
      guillemot.
  de:
    intro: >-
      Hier gibt es so gut wie keine Infrastruktur und nur sehr wenige Reisende. Hornstrandir ist die
      nördlichste Halbinsel Islands an der Nordspitze der Westfjorde, nordwestlich des
      Drangajökull-Gletschers. Rund 580 km² Tundra, Fjorde, Gletscherreste und alpines Gelände bergen eine
      reiche, aber empfindliche Vegetation. Man reist per Boot an, wandert mit topografischer Karte und
      übernachtet im Zelt. Wer hierherkommt, nimmt Stille mit, vogelerfüllte Felswände und mit etwas Glück
      einen Polarfuchs, der einem neugierig in die Augen blickt.
    landscape: "Hornstrandir lebt von drei Vorzügen, die ineinandergreifen. Der erste sind die gewaltigen Vogelkolonien an den Klippen der Hornvík-Bucht, die auf der Ostseite über 500 Meter steil aufragen und wie ein gigantischer Magnet Seevögel anziehen. Hornstrandir besitzt drei herausragende Vogelfelsen: Hornbjarg, Hælavíkurbjarg und Riturinn. Der zweite ist eine unberührte, einsame Wildnis mit intensivem Abgeschiedenheitsgefühl, da es in diesem riesigen Areal keine Straßen und kaum Touristen gibt. Der dritte Vorzug erwächst daraus im Verbund mit dem strikten Jagdverbot: der Polarfuchs.\r\n\r\nIm Süden liegen die Jökulfirðir, die «Gletscherfjorde», ein System aus fünf Fjorden und Buchten; vier bilden die gesamte Südküste von Hornstrandir, während der fünfte, Leirufjörður, unmittelbar südlich einschneidet. Es ist eine der zerklüftetsten Fjordküsten des Landes."
    wildlife: "An den Felskanten nisten [Papageitaucher](/especie/fratercula_arctica/), [Trottellummen](/especie/uria_aalge/), [Tordalke](/especie/alca_torda/) und [Eissturmvögel](/especie/fulmarus_glacialis/). Boote dürfen sich den Seevogelkolonien auf nicht weniger als 115 m nähern, und es wird geraten, mindestens einen Kilometer Abstand zu den Steilwänden zu wahren.\r\n\r\nDer [Polarfuchs](/especie/vulpes_lagopus/) ist das Wahrzeichen des Schutzgebiets. Die Halbinsel ist eines der wichtigsten Refugien für Polarfüchse in ganz Europa. Wenn du auf einen Bau stößt, halte mindestens 40 m Abstand, verweile nicht länger als 20 Minuten, stelle dich niemals zwischen Fähe und Welpen und füttere die Tiere keinesfalls."
    visit: "Die Anreise erfolgt üblicherweise über das Meer mit planmäßigen Fährverbindungen ab Ísafjörður, Bolungarvík und Norðurfjörður. Hubschrauberlandungen sind im Schutzgebiet verboten, und die zwei einfachen Naturpisten in Látrar und Fljótavík sind weder registriert noch gewartet.\r\n\r\nVor dem Aufbruch lohnt sich der Besuch im Hornstrandastofa, dem Besucherzentrum in Ísafjörður: Dort unterstützen Ranger bei der Tourenplanung und eine Ausstellung zeigt das historische Leben auf Hornstrandir. Im Schutzgebiet selbst betreibt die Umweltbehörde Außenposten in Höfn in der Hornvík sowie in Hesteyri, um Wanderer zu informieren.\r\n\r\nDie Hauptrouten sind mit Steinmännchen markiert, die bei schlechter Sicht leicht aus dem Blick geraten; eine detaillierte Wanderkarte sowie Kompass oder GPS sind unverzichtbar. Dichter Nebel erschwert häufig die Orientierung; Flüsse schwellen nach Regenfällen stark an und Altschneefelder halten sich ganzjährig, mit steilen Schneerinnen bis in den Frühsommer."
    history: "Hornstrandir war einst besiedelt. In früheren Jahrhunderten gab es eine feste Einwohnerschaft, die jedoch bis zur Mitte des zwanzigsten Jahrhunderts vollständig abwanderte; am Leuchtturm von Hornbjarg verblieb ein Wärter bis 1995. In der Hornvík-Bucht lagen drei Höfe: Horn (1946 aufgegeben), Höfn und Rekavík bak Höfn (beide 1944). Jahrzehnte später kehrten Nachkommen zurück, um historische Holzhäuser instand zu setzen, und beträchtliche Flächen sind in Privatbesitz.\r\n\r\nDas Schutzgebiet besteht seit 1975 unter den strengsten Schutzbestimmungen Islands. Es ist als IUCN-Kategorie Ib eingestuft: ein großflächiges Wildnisgebiet ohne menschliche Eingriffe, in dem natürliche Abläufe ungestört wirken."
    before: "Wegen der Empfindlichkeit der Tundra müssen Trekkingtouren im Frühjahr und Herbst vorab elektronisch bei der Umweltbehörde angemeldet werden; die genauen Meldefristen sind vorab zu prüfen. Zelten ist nur auf ausgewiesenen Plätzen gestattet: Es gibt vierzehn Plätze der Umweltbehörde und zwei private Lagerwiesen; ein Zelt darf maximal eine Woche am selben Standort verbleiben. Geführte Gruppen dürfen im westlichen Teil 30 Personen und im östlichen Teil 15 Personen nicht überschreiten.\r\n\r\nOffenes Feuer, Hunde (ausgenommen angeleinte Arbeitshunde von Grundeigentümern), Fahrräder und Drohnen ohne Genehmigung sind untersagt. Sämtlicher Müll muss wieder mitgenommen werden; baue keine Steinmännchen und bleibe auf den Pfaden. Tourenpläne können bei Safetravel hinterlegt werden."
    around: >-
      Hornstrandir besitzt keine direkten Nachbargebiete im Atlas, teilt aber die gewaltigen Seevogelklippen
      mit anderen Meeresküsten: Die [Vogelfelsen von Vestmanna](/lugar/vestmanna-bird-cliffs/) und die [Insel
      Kalsoy mit dem Leuchtturm Kallur](/lugar/kalsoy/) teilen Eissturmvogel und Papageitaucher, während das
      [Cap Fréhel](/lugar/cap-frehel/) und das [Naturschutzgebiet
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) Tordalke und Trottellummen beherbergen.
  it:
    intro: >-
      Qui le infrastrutture sono pressoché assenti e i visitatori pochissimi. Hornstrandir è la penisola più
      settentrionale d'Islanda, all'estremità nord dei Fiordi occidentali, a nord-ovest del ghiacciaio
      Drangajökull. Copre circa 580 km² di tundra, fiordi, vedrette glaciali e rilievi alpini ammantati da una
      vegetazione ricca quanto vulnerabile. Ci si arriva in barca, ci si muove con la carta topografica e si
      pernotta in tenda. Chi vi giunge porta con sé il silenzio, scogliere gremite di uccelli marini e, con un
      pizzico di fortuna, una volpe artica che ricambia lo sguardo senza fuggire.
    landscape: "Hornstrandir si impernia su tre elementi inscindibili. Il primo sono le imponenti scogliere ornitologiche che orlano la baia di Hornvík, alte oltre 500 metri sul versante orientale, autentico magnete per gli uccelli marini nidificanti. Hornstrandir possiede tre grandi falesie d'uccelli: Hornbjarg, Hælavíkurbjarg e Riturinn. Il secondo è una natura selvaggia e intatta, pervasa da un intenso isolamento per l'assenza di piste carrabili e per il numero esiguo di escursionisti in uno spazio così esteso. Il terzo nasce dal connubio di questi fattori e dal rigido divieto venatorio: la volpe.\r\n\r\nA sud, i Jökulfirðir, i «fiordi dei ghiacciai», sono cinque tra fiordi e baie; quattro compongono l'intera costa meridionale di Hornstrandir, mentre il quinto, Leirufjörður, penetra immediatamente a sud. È uno dei profili costieri più frastagliati dell'intera penisola."
    wildlife: "Tra i volatili delle scogliere si ammirano le [pulcinelle di mare](/especie/fratercula_arctica/), le [urie](/especie/uria_aalge/), le [gazze marine](/especie/alca_torda/) e i [fulmari](/especie/fulmarus_glacialis/). Le imbarcazioni non possono avvicinarsi a meno di 115 m dalle pareti dei nidiacei, ed è caldamente raccomandato non navigare a meno di un chilometro dalle falesie.\r\n\r\nLa [volpe artica](/especie/vulpes_lagopus/) è la vera protagonista. La riserva costituisce una delle roccaforti di volpi più cruciali d'Europa. Se individui una tana, mantieniti ad almeno 40 m di distanza, non sostare più di 20 minuti, non frapporti tra la madre e i cuccioli e non offrire mai cibo alle volpi."
    visit: "L'accesso canonico avviene via mare, con partenze regolari di battelli da Ísafjörður, Bolungarvík e Norðurfjörður. È vietato l'atterraggio di elicotteri nell'area protetta, e le due piste erbose di Látrar e Fljótavík non sono registrate né dotate di presidi.\r\n\r\nPrima di salpare è opportuno fare sosta a Hornstrandastofa, il centro visite di Ísafjörður: i guardiaparco offrono assistenza per la pianificazione e una mostra sulla storia locale. Sul posto, l'agenzia ambientale schiera ranger a Höfn, nella baia di Hornvík, e a Hesteyri per informare i camminatori.\r\n\r\nI tracciati principali sono indicati da ometti di pietra, che si perdono facilmente con nebbia fitta; disporre di una carta dettagliata e di bussola o GPS è indispensabile. Le nebbie marine sono frequenti; i guadi sui fiumi possono farsi impegnativi dopo piogge torrenziali e nevai ripidi resistono tutto l'anno fin dentro l'estate."
    history: "Hornstrandir è stata terra abitata. Nei secoli passati vi risiedeva una comunità sparsa, spentasi entro la metà del secolo XX, e al faro di Hornbjarg ha prestato servizio un guardiano fino al 1995. Nella baia di Hornvík sorgevano tre insediamenti: Horn (abbandonato nel 1946), Höfn e Rekavík bak Höfn (entrambi nel 1944). Nei decenni successivi alcuni discendenti sono tornati a ristrutturare le case, e ampie quote di terreno restano private.\r\n\r\nLa riserva naturale è stata istituita nel 1975 con tutele fra le più severe d'Islanda. Rientra nella categoria Ib della IUCN: una vasta area incontaminata, poco o per nulla alterata dalle attività umane, intesa a preservare i ritmi naturali senza interferenze."
    before: "Per via della fragilità della tundra e dei suoli, ogni trekking deve essere registrato telematicamente presso l'agenzia ambientale in primavera e in autunno; verifica con cura i termini di registrazione prima di partire. Il campeggio è consentito unicamente nelle aree deputate: vi sono quattordici bivacchi dell'agenzia e due campeggi privati, con il limite di una settimana consecutiva nello stesso sito per ciascuna tenda. I gruppi organizzati non possono superare le 30 persone nel settore occidentale e le 15 in quello orientale.\r\n\r\nSono vietati fuochi all'aperto, cani (salvo quelli dei residenti, al guinzaglio), biciclette e droni sprovvisti di nulla osta. È obbligatorio riportare indietro ogni rifiuto, non costruire ometti né spostare pietre e seguire sempre i sentieri. Si raccomanda di registrare l'itinerario su Safetravel."
    around: >-
      Hornstrandir non ha vicini immediati nell'atlante, ma condivide le colonie di uccelli marini con altre
      scogliere oceaniche: le [Falesie Ornitologiche di Vestmanna](/lugar/vestmanna-bird-cliffs/) e l'[Isola
      di Kalsoy e Faro di Kallur](/lugar/kalsoy/) condividono fulmari e pulcinelle di mare, mentre [Cap
      Fréhel](/lugar/cap-frehel/) e la [Riserva Naturale delle
      Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/) ospitano gazze marine e urie.
  pt:
    intro: >-
      Aqui quase não há infraestruturas e os turistas escasseiam. Hornstrandir é a península mais setentrional
      da Islândia, no extremo norte dos Fiordes Ocidentais, a noroeste do glaciar Drangajökull. São cerca de
      580 km² de tundra, fiordes, glaciares e relevo alpino cobertos por uma vegetação viçosa mas frágil.
      Chega-se de barco, caminha-se com mapa e dorme-se em tenda. Quem aqui aporta leva consigo o silêncio,
      arribas repletas de aves e, com sorte, uma raposa-do-ártico a fitá-lo nos olhos.
    landscape: "Hornstrandir desdobra-se em três encantos complementares. O primeiro reside nas arribas marinhas que delimitam a baía de Hornvík, erguendo mais de 500 metros de altura no flanco oriental, um portentoso polo de atração para a avifauna marinha. Hornstrandir possui três colossais falésias de aves: Hornbjarg, Hælavíkurbjarg e Riturinn. O segundo é uma natureza intocada e serena, que transmite um profundo sentimento de isolamento devido à ausência de estradas e ao reduzido número de caminhantes numa área tão ampla. O terceiro decorre de ambos e da proibição da caça: a raposa.\r\n\r\nA sul, os Jökulfirðir, os «fiordes dos glaciares», formam cinco fiordes e enseadas; quatro desenham toda a costa meridional de Hornstrandir e o quinto, Leirufjörður, recorta-se logo a sul. Trata-se de um dos litorais mais recortados da península."
    wildlife: "Entre as aves que povoam estas arribas contam-se os [fradinhos](/especie/fratercula_arctica/), os [airos](/especie/uria_aalge/), as [tordas-mergulheiras](/especie/alca_torda/) e os [fulmares-glaciais](/especie/fulmarus_glacialis/). As embarcações estão proibidas de se aproximar a menos de 115 m das colónias de aves marinhas, recomendando-se não navegar a menos de um quilómetro dos paredões rochosos.\r\n\r\nA [raposa-do-ártico](/especie/vulpes_lagopus/) é o emblema do território. A reserva constitui um dos mais relevantes santuários de raposas de toda a Europa. Se deparares com uma toca, mantém uma distância mínima de 40 m, não permaneças mais de 20 minutos, nunca te interponhas entre a fêmea e as crias e não alimentes as raposas."
    visit: "O acesso corrente faz-se por mar, com travessias regulares a partir de Ísafjörður, Bolungarvík e Norðurfjörður. É interdito o pouso de helicópteros na reserva, e as duas pistas rudimentares de Látrar e Fljótavík não estão homologadas nem equipadas.\r\n\r\nAntes de iniciar o percurso, passa pelo Hornstrandastofa, o centro de acolhimento de Ísafjörður: os vigilantes auxiliam no planeamento da rota e uma pequena mostra evoca o quotidiano antigo em Hornstrandir. No terreno, a agência ambiental mantém vigilantes em Höfn, na baía de Hornvík, e em Hesteyri para orientar os visitantes.\r\n\r\nOs trilhos principais encontram-se sinalizados com mariolas de pedra, fáceis de perder com nevoeiro cerrado; é indispensável levar carta topográfica e bússola ou GPS. A neblina é assídua na península; as ribeiras tornam-se difíceis de vadear após chuvas intensas e subsiste neve o ano inteiro, com línguas íngremes no início do verão."
    history: "Hornstrandir foi terra povoada. Existiu uma comunidade estável em séculos anteriores, que se extinguiu em meados do século XX, tendo o farol de Hornbjarg acolhido faroleiro até 1995. Na baía de Hornvík erguiam-se três povoados: Horn (despovoado em 1946), Höfn e Rekavík bak Höfn (ambos em 1944). Décadas volvidas, alguns descendentes regressaram para restaurar as habitações e grande parte dos terrenos mantém-se sob titularidade privada.\r\n\r\nA reserva vigora desde 1975, dotada das medidas conservacionistas mais exigentes da Islândia. Enquadra-se na Categoria Ib da UICN: uma vasta área selvagem, quase nada alterada pelo ser humano, orientada para salvaguardar os processos ecológicos sem perturbação antropogénica."
    before: "Dada a fragilidade da flora e dos solos, qualquer percurso deve ser registado eletronicamente junto da agência ambiental na primavera e no outono; confirma os prazos estipulados antes de viajar. O campismo é exclusivamente autorizado em zonas demarcadas: existem catorze parques da agência ambiental e dois parques privados, não podendo uma tenda permanecer mais de uma semana seguida no mesmo local. As excursões organizadas não podem exceder 30 pessoas no setor ocidental nem 15 no oriental.\r\n\r\nÉ proibido acender fogueiras, levar cães (salvo os dos proprietários, sempre com trela), circular de bicicleta e operar drones sem licença. Deves recolher todo o lixo, não erguer mariolas nem deslocar pedras e seguir sempre os trilhos. Podes registar o teu plano de viagem no Safetravel."
    around: >-
      Hornstrandir não possui vizinhos imediatos no atlas, mas partilha arribas com colónias de aves marinhas
      com outros destinos costeiros: as [Arribas Ornitológicas de Vestmanna](/lugar/vestmanna-bird-cliffs/) e
      a [Ilha de Kalsoy e Farol de Kallur](/lugar/kalsoy/) partilham o fulmar e o fradinho, enquanto o [Cabo
      Fréhel](/lugar/cap-frehel/) e a [Reserva Natural das Sept-Îles](/lugar/reserve-naturelle-des-sept-iles/)
      partilham tordas-mergulheiras e airos.
