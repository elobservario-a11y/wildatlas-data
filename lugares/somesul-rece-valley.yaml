unico:
  es: >-
    Un valle de agua fría donde el lobo, el lince y el oso se mueven por un territorio mucho mayor que el
    espacio protegido.
  en: >-
    A cold-water mountain valley where wolf, lynx and brown bear range across a territory far vaster than the
    protected area.
  fr: >-
    Une vallée d'eau froide où le loup, le lynx et l'ours brun arpentent un territoire bien plus vaste que le
    périmètre protégé.
  de: >-
    Ein Kaltwassertal, in dem Wolf, Luchs und Braunbär ein Revier durchstreifen, das weit über das
    Schutzgebiet hinausreicht.
  it: >-
    Una valle d'acqua gelida dove lupo, lince e orso bruno percorrono un territorio assai più vasto dell'area
    protetta.
  pt: >-
    Um vale de águas gélidas onde o lobo, o lince e o urso-pardo percorrem um território muito mais vasto do
    que a área protegida.
