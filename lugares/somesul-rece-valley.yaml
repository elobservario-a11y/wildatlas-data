texto:
  es:
    intro: >-
      Entre Gura Negruței y La Luncuța, el río Someșul Rece se mete en una garganta profunda y salvaje, y solo
      una pista forestal lo acompaña. Es el corazón de un valle de montaña en los Apuseni, en el condado de
      Cluj, que se alcanza por una carretera estrecha, la 107T, que sale de Cluj y pasa por Gilău y Someșu
      Rece hasta llegar a Măguri Răcătău.


      El Someșul Rece, «Someș frío», es la cabecera derecha del Someșul Mic. Nace casi a 1600 metros, en el
      macizo Gilău-Muntele Mare, y se une al Someșul Cald en el lago Gilău. Entre medias hay 49 kilómetros de
      río y 330 kilómetros cuadrados de cuenca.
    landscape: >-
      La roca cuenta la historia. El valle pertenece a la unidad montañosa Gilău-Muntele Mare, en los Apuseni
      del Norte, de estructura compleja y con intrusiones de granitos prehercinianos, los de Muntele Mare.
      Sobre esa base, los valles caen rápido hacia el Someșul Mic y alcanzan en poco espacio profundidades de
      300 a 400 metros, con pendientes longitudinales de 25 a 30 metros por kilómetro. El pico más alto de los
      montes Gilău, Chicera Comării, llega a 1475 metros.


      El bosque de pícea es la base de la vegetación: cubre el 55 % del espacio protegido, que ocupa unas 8529
      hectáreas y forma parte de la red Natura 2000. Hay también turberas con vegetación forestal y turberas
      activas. En total hay ocho tipos de hábitats de interés comunitario y tres son prioritarios, con
      alrededor del 20 % de la superficie. En las turberas activas dominan los musgos Sphagnum, con Andromeda
      polifolia, Eriophorum vaginatum, el abedul enano y el brezo. En las laderas rocosas, el viento y el frío
      han dado formas extrañas a algunos árboles. Entre las plantas importantes están Arnica montana,
      Lycopodium clavatum y la campanilla de invierno.
    wildlife: >-
      Lo más valioso son los grandes carnívoros. El [lobo](/especie/canis_lupus/): al menos una manada de 8
      ejemplares trabaja el desfiladero y las zonas vecinas. El [lince](/especie/lynx_lynx/): se han
      identificado al menos 4 residentes. El [oso pardo](/especie/ursus_arctos/): un mínimo de 3 residentes.
      Como el espacio es pequeño para un lince, una manada de lobos o un oso, estos animales se mueven mucho
      más allá de sus límites.


      El agua tiene su propia fauna. La [nutria](/especie/lutra_lutra/) fue un descubrimiento sorprendente en
      el sitio. El tímalo vive en el tramo bajo del Someșul Rece, en agua rápida y profunda, aguas abajo de la
      zona de la trucha. El sapillo de vientre amarillo, Bombina variegata, habita la zona entre 300 y 1600 o
      1700 metros de altitud.


      En verano, por el camino que lleva al desfiladero, se huele el heno y se ven caballos sueltos por la
      aldea. Y cuando llega la nieve, el valle se vuelve un paisaje de invierno.
    visit: >-
      Desde Cluj se llega por Gilău y Someșu Rece, siguiendo la carretera comarcal 107T hacia Măguri Răcătău.
      Lo más sencillo es aparcar y recorrer a pie la pista forestal hasta la presa del Someșul Rece, que está
      en el extremo superior de la garganta. A paso tranquilo, la ida y vuelta se estima en cuatro a cinco
      horas.


      Para ir más lejos hay rutas. Una ruta marcada con banda roja, de 17 a 20 horas, sigue la cresta
      principal del macizo Gilău-Muntele Mare. La ruta de cruz roja (siete horas) une las cabañas Someșul Rece
      y Muntele Filii. Una ruta sin marcar de unas tres horas, más difícil, permite visitar las gargantas de
      Dumitreasa.
    history: >-
      Durante la Segunda Guerra Mundial esta zona tenía importancia estratégica, y de aquellos años queda una
      carretera pavimentada, la «carretera de Antonescu», que une Măguri Răcătău con Valea Ierii; hoy la
      recorren turistas o se usa en competiciones deportivas.


      Los hábitats sufren presiones humanas importantes, como la tala y el cambio de uso del suelo. Cluj
      Tourism describe la garganta como una de las zonas más protegidas del condado.
    before: >-
      El valle se puede visitar en distintas estaciones, incluido el paisaje invernal tras las nevadas. La
      mejor época va de mayo a octubre.
    around: >-
      A cinco kilómetros está el [Parque Natural Apuseni - Macizo de
      Bihor](/lugar/parcul-natural-apuseni---masivul-bihor/) y a siete el [Macizo de
      Vlădeasa](/lugar/masivul-vladeasa/), en la misma cordillera de los Apuseni.
  en:
    intro: >-
      Between Gura Negruței and La Luncuța, the Someșul Rece river plunges into a deep, untamed gorge
      accompanied only by an unpaved forestry track. This is the heart of an Apuseni mountain valley in Cluj
      County, accessed via a narrow road, the 107T, which heads out from Cluj through Gilău and Someșu Rece
      toward Măguri Răcătău.


      The Someșul Rece («Cold Someș») forms the right-hand headwater of the Someșul Mic. Rising at almost 1600
      metres in the Gilău-Muntele Mare massif, it joins the Someșul Cald in Lake Gilău. Between them lie 49
      kilometres of mountain river and a basin of 330 square kilometres.
    landscape: >-
      The geology narrates the terrain. The valley belongs to the Gilău-Muntele Mare structural unit of the
      Northern Apuseni, characterized by complex faulting and pre-Hercynian granite intrusions known as the
      Muntele Mare granites. Resting on this bedrock, valleys drop steeply toward the Someșul Mic, carving
      within short horizontal distances depths of 300 to 400 metres, with gradients of 25 to 30 metres per
      kilometre. The highest peak of the Gilău Mountains, Chicera Comării, reaches 1475 metres.


      Spruce forest forms the vegetative backbone: covering 55 % of the protected area, which encompasses some
      8529 hectares within the Natura 2000 network. Bog woodlands and active raised bogs also occur. In total,
      eight habitat types of Community interest are present, with three ranking as priority, covering around
      20 % of the territory. In active bogs, *Sphagnum* mosses dominate alongside *Andromeda polifolia*,
      *Eriophorum vaginatum*, dwarf birch and heather. On craggy slopes, wind and freezing cold have twisted
      trees into bizarre silhouettes. Notable flora includes *Arnica montana*, *Lycopodium clavatum* and
      snowdrops.
    wildlife: >-
      The crowning natural value lies in large carnivores. The [grey wolf](/especie/canis_lupus/): at least
      one pack of 8 individuals hunts the defile and neighbouring ranges. The [Eurasian
      lynx](/especie/lynx_lynx/): at least 4 resident adults are confirmed. The [brown
      bear](/especie/ursus_arctos/): a minimum of 3 resident individuals. Because the reserve boundary is
      modest for wide-ranging carnivores, these animals roam far beyond its perimeter.


      The river sustains its own fauna. The [Eurasian otter](/especie/lutra_lutra/) proved a remarkable
      discovery within the site. European grayling thrives along the lower Someșul Rece in swift, deep water
      downstream from the trout zone. The yellow-bellied toad, *Bombina variegata*, inhabits altitudes between
      300 and 1600 or 1700 metres.


      In summer, along the road leading toward the gorge, the air smells of cured hay and loose farm horses
      graze through the village. With the first snows, the valley transforms into a quiet winter wonderland.
    visit: >-
      From Cluj, access runs through Gilău and Someșu Rece, following county road 107T toward Măguri Răcătău.
      The simplest approach is to park and walk the forestry track to the Someșul Rece weir at the upper end
      of the gorge. At an unhurried pace, the return walk takes four to five hours.


      Longer waymarked routes branch into the high country. A red-band trail requiring 17 to 20 hours follows
      the main crest of the Gilău-Muntele Mare massif. A red-cross trail (seven hours) connects the Someșul
      Rece and Muntele Filii mountain huts. An unmarked trail of about three hours, more demanding, accesses
      the wild Dumitreasa gorges.
    history: >-
      During the Second World War this area held strategic value, leaving behind a paved military artery, the
      «Antonescu Road», connecting Măguri Răcătău with Valea Ierii, today used by visitors and cycling
      competitions.


      Habitats face human pressures including logging and land-use shifts. Cluj Tourism highlights the gorge
      as one of the county's most pristine and carefully protected natural assets.
    before: >-
      The valley can be explored across seasons, including the winter landscape after fresh snowfalls. The
      optimal visiting season runs from May to October.
    around: >-
      Five kilometres away lies the [Apuseni Natural Park - Bihor
      Massif](/lugar/parcul-natural-apuseni---masivul-bihor/) and seven kilometres away is the [Vlădeasa
      Massif](/lugar/masivul-vladeasa/), both within the wider Apuseni range.
  fr:
    intro: >-
      Entre Gura Negruței et La Luncuța, la rivière Someșul Rece s'enfonce dans une gorge profonde et sauvage,
      que seule longe une piste forestière. C'est le cœur d'une vallée montagnarde des Apuseni, dans le județ
      de Cluj, que l'on rejoint par une route étroite, la 107T, au départ de Cluj via Gilău et Someșu Rece
      vers Măguri Răcătău.


      Le Someșul Rece (« Someș froid ») forme la branche supérieure droite du Someșul Mic. Prenant sa source à
      près de 1600 mètres dans le massif de Gilău-Muntele Mare, il rejoint le Someșul Cald dans le lac de
      Gilău. Entre les deux s'étirent 49 kilomètres de rivière et 330 kilomètres carrés de bassin versant.
    landscape: >-
      La roche raconte le relief. La vallée appartient à l'ensemble structural Gilău-Muntele Mare des Apuseni
      septentrionaux, de structure complexe avec des intrusions de granites préhercyniens dits de Muntele
      Mare. Sur ce socle, les vallées plongent vers le Someșul Mic pour atteindre en peu d'espace des
      profondeurs de 300 à 400 mètres, avec des pentes de 25 à 30 mètres par kilomètre. Le sommet des monts
      Gilău, Chicera Comării, culmine à 1475 mètres.


      L'épicéa forme l'ossature végétale : il couvre 55 % de l'espace protégé, qui s'étend sur quelque 8529
      hectares au sein du réseau Natura 2000. On y trouve aussi des tourbières boisées et des tourbières
      hautes actives. Au total, huit types d'habitats d'intérêt communautaire sont recensés dont trois
      prioritaires, couvrant environ 20 % de la superficie. Les sphaignes dominent les tourbières actives avec
      l'andromède, la linaigrette, le bouleau nain et la bruyère. Sur les versants rocheux, le gel et le vent
      ont tourmenté les silhouettes des arbres. Parmi les plantes notables : *Arnica montana*, *Lycopodium
      clavatum* et perce-neige.
    wildlife: >-
      La plus haute valeur réside dans les grands carnivores. Le [loup](/especie/canis_lupus/) : au moins une
      meute de 8 individus fréquente le défilé et les massifs voisins. Le [lynx boréal](/especie/lynx_lynx/) :
      au moins 4 adultes résidents sont identifiés. L'[ours brun](/especie/ursus_arctos/) : un minimum de 3
      résidents. L'espace étant trop exigu pour un lynx ou une meute, ces prédateurs parcourent un domaine
      bien plus vaste.


      Les eaux abritent une faune propre. La [loutre d'Europe](/especie/lutra_lutra/) a constitué une
      découverte remarquable sur le site. L'ombre commun fréquente le cours inférieur du Someșul Rece, en eaux
      vives et profondes en aval de la zone à truites. Le sonneur à ventre jaune peuple la tranche
      altitudinale entre 300 et 1600 ou 1700 mètres.


      En été, le long du chemin menant au défilé, flotte l'odeur des foins et des chevaux en liberté paissent
      dans le village. L'hiver venu, la vallée se métamorphose sous d'épais manteaux de neige.
    visit: >-
      Depuis Cluj, on accède par Gilău et Someșu Rece en suivant la route 107T vers Măguri Răcătău. Le plus
      simple est de stationner son véhicule et de remonter la piste à pied jusqu'au barrage de Someșul Rece,
      situé à l'extrémité amont de la gorge. À allure tranquille, l'aller-retour demande quatre à cinq heures.


      Des sentiers balisés permettent de s'élever. Une voie balisée d'une bande rouge (17 à 20 heures) suit la
      crête principale du massif Gilău-Muntele Mare. Un itinéraire à croix rouge (sept heures) relie les
      refuges de Someșul Rece et Muntele Filii. Une sente non balisée d'environ trois heures, plus sportive,
      rejoint les gorges sauvages de Dumitreasa.
    history: >-
      Durant la Seconde Guerre mondiale, ce secteur possédait une valeur stratégique, comme en témoigne la «
      route d'Antonescu » reliant Măguri Răcătău à Valea Ierii, aujourd'hui empruntée par les randonneurs et
      compétitions cyclistes.


      Les habitats subissent des pressions humaines comme l'exploitation forestière. L'office de tourisme de
      Cluj présente ce défilé comme l'un des espaces les mieux préservés du județ.
    before: >-
      La vallée se découvre en toute saison, y compris lors des hivers enneigés. La période idéale va de mai à
      octobre.
    around: >-
      À cinq kilomètres se trouve le [parc naturel Apuseni - Massif de
      Bihor](/lugar/parcul-natural-apuseni---masivul-bihor/) et à sept le [massif de
      Vlădeasa](/lugar/masivul-vladeasa/), dans la même chaîne des Apuseni.
  de:
    intro: >-
      Zwischen Gura Negruței und La Luncuța schneidet sich der Someșul Rece in eine tiefe, unberührte
      Schlucht, die nur von einer Forststraße begleitet wird. Dies ist das Herz eines Apuseni-Gebirgstals im
      Kreis Cluj, erreichbar über die schmale Straße 107T von Cluj über Gilău und Someșu Rece nach Măguri
      Răcătău.


      Der Someșul Rece («Kalter Someș») bildet den rechten Quellfluss des Someșul Mic. Er entspringt auf fast
      1600 Metern im Gilău-Muntele-Mare-Massiv und vereinigt sich im Gilău-See mit dem Someșul Cald.
      Dazwischen liegen 49 Kilometer Gebirgsfluss und ein Einzugsgebiet von 330 Quadratkilometern.
    landscape: >-
      Die Geologie bestimmt das Relief. Das Tal gehört zur tektonischen Einheit Gilău-Muntele Mare der
      nördlichen Apuseni mit komplexen Bruchstrukturen und präherzynischen Granitintrusionen. Auf diesem
      Sockel stürzen die Täler steil zum Someșul Mic ab und erreichen auf kurzen Distanzen Tiefen von 300 bis
      400 Metern bei Gefällen von 25 bis 30 Metern pro Kilometer. Der höchste Gipfel der Gilău-Berge, Chicera
      Comării, erreicht 1475 Meter.


      Fichtenwälder bilden das Rückgrat der Vegetation: Sie bedecken 55 % des Schutzgebiets, das rund 8529
      Hektar im Netz Natura 2000 umfasst. Auch Moorwälder und aktive Hochmoore kommen vor. Insgesamt sind acht
      Lebensraumtypen von gemeinschaftlichem Interesse vertreten, drei davon prioritär, die etwa 20 % der
      Fläche einnehmen. In Hochmooren dominieren *Sphagnum*-Moose mit Rosmarinheide, Scheiden-Wollgras,
      Zwergbirke und Heidekraut. An felsigen Hängen haben Wind und Frost bizarre Baumgestalten geformt. Zu den
      seltenen Pflanzen zählen *Arnica montana*, *Lycopodium clavatum* und Schneeglöckchen.
    wildlife: >-
      Den höchsten Schutzwert besitzen die Großraubtiere. Der [Wolf](/especie/canis_lupus/): Mindestens ein
      Rudel von 8 Tieren jagt in der Schlucht und den Nachbarhängen. Der [Eurasische
      Luchs](/especie/lynx_lynx/): Mindestens 4 standorttreue Alttiere sind nachgewiesen. Der
      [Braunbär](/especie/ursus_arctos/): Mindestens 3 residente Bären. Da das Areal für Großraubtiere klein
      ist, bewegen sich diese weit über die Grenzen hinaus.


      Das Gewässer birgt eine eigene Fauna. Der [Eurasische Fischotter](/especie/lutra_lutra/) war ein
      überraschender Nachweis im Gebiet. Die Äsche bewohnt den Unterlauf des Someșul Rece in tiefer Strömung
      unterhalb der Forellenregion. Die Gelbbauchunke lebt im Höhenband zwischen 300 und 1600 oder 1700
      Metern.


      Im Sommer riecht der Weg zur Schlucht nach Heu und Pferde weiden im Dorf. Im Winter verwandelt sich das
      Tal in eine einsame Schneelandschaft.
    visit: >-
      Von Cluj führt der Weg über Gilău und Someșu Rece auf der Straße 107T Richtung Măguri Răcătău. Am
      einfachsten parkt man und wandert auf der Forststraße bis zur Wehranlage am oberen Schluchtende. In
      geruhsamem Tempo dauert der Hin- und Rückweg vier bis fünf Stunden.


      Für weite Touren gibt es markierte Pfade. Eine Rot-Band-Route von 17 bis 20 Stunden folgt dem Hauptkamm
      des Gilău-Muntele-Mare-Massivs. Ein Weg mit rotem Kreuz (sieben Stunden) verbindet die Schutzhütten
      Someșul Rece und Muntele Filii. Ein unmarkierter Steig von etwa drei Stunden erschließt die wilden
      Dumitreasa-Schluchten.
    history: >-
      Im Zweiten Weltkrieg besaß das Areal strategische Bedeutung; aus dieser Zeit stammt die gepflasterte
      «Antonescu-Straße» von Măguri Răcătău nach Valea Ierii, die heute von Wanderern und Radsportlern genutzt
      wird.


      Die Lebensräume stehen unter Druck durch Forstwirtschaft und Landnutzungswandel. Der Tourismusverband
      Cluj rühmt die Schlucht als eines der besterhaltenen Naturjuwele des Kreises.
    before: >-
      Das Tal lohnt zu jeder Jahreszeit, auch im winterlichen Schneekleid. Die beste Besuchszeit reicht von
      Mai bis Oktober.
    around: >-
      Fünf Kilometer entfernt liegt der [Naturpark Apuseni -
      Bihor-Massiv](/lugar/parcul-natural-apuseni---masivul-bihor/) und sieben Kilometer entfernt das
      [Vlădeasa-Massiv](/lugar/masivul-vladeasa/) im selben Gebirgszug.
  it:
    intro: >-
      Tra Gura Negruței e La Luncuța, il fiume Someșul Rece si addentra in una forra profonda e selvaggia,
      affiancato unicamente da una sterrata forestale. È il cuore di una valle montana degli Apuseni nel
      distretto di Cluj, raggiungibile con una stretta carrozzabile, la 107T, che parte da Cluj passando per
      Gilău e Someșu Rece verso Măguri Răcătău.


      Il Someșul Rece («Someș freddo») costituisce il ramo sorgentizio destro del Someșul Mic. Nasce a quasi
      1600 metri nel massiccio Gilău-Muntele Mare e confluisce con il Someșul Cald nel lago di Gilău. Lungo il
      corso si snodano 49 chilometri di fiume montano e 330 chilometri quadrati di bacino idrografico.
    landscape: >-
      La geologia scolpisce il rilievo. La valle fa parte dell'unità strutturale Gilău-Muntele Mare negli
      Apuseni settentrionali, a fagliazione complessa con intrusioni granitiche pre-erciniche. Su questa base,
      le forre precipitano verso il Someșul Mic raggiungendo in breve spazio profondità da 300 a 400 metri,
      con pendenze da 25 a 30 metri per chilometro. La cima più alta dei monti Gilău, Chicera Comării, tocca i
      1475 metri.


      Le foreste di abete rosso formano la trama verde: coprono il 55 % dell'area protetta, estesa per circa
      8529 ettari nella rete Natura 2000. Si trovano anche torbiere boscose e torbiere alte attive. In tutto
      figurano otto tipi di habitat comunitari di cui tre prioritari, pari a circa il 20 % del territorio.
      Nelle torbiere attive predominano gli sfagni con andromeda, erioforo, betulla nana ed erica. Sui dirupi
      rocciosi, vento e gelo hanno contorto le chiome degli alberi. Tra le specie floristiche rare figurano
      *Arnica montana*, *Lycopodium clavatum* e bucaneve.
    wildlife: >-
      Il pregio sommo risiede nei grandi carnivori. Il [lupo grigio](/especie/canis_lupus/): almeno un branco
      di 8 esemplari caccia nella forra e nelle giogaie limitrofe. La [lince europea](/especie/lynx_lynx/):
      accertati almeno 4 individui stanziali. L'[orso bruno](/especie/ursus_arctos/): un minimo di 3
      residenti. Poiché l'areale protetto è ridotto per grandi predatori, questi animali spaziano ben oltre i
      confini.


      Le acque celano una fauna propria. La [lontra europea](/especie/lutra_lutra/) è stata una scoperta
      sorprendente nel comprensorio. Il temolo vive nel basso corso del Someșul Rece, in correnti rapide e
      profonde a valle della trota. L'ululone dal ventre giallo colonizza le quote tra 300 e 1600 o 1700
      metri.


      In estate, lungo il tracciato verso la forra, si respira il profumo del fieno e cavalli pascolano nel
      borgo. Con la neve, la valle si tramuta in un ovattato paesaggio invernale.
    visit: >-
      Da Cluj si giunge via Gilău e Someșu Rece seguendo la strada 107T verso Măguri Răcătău. La soluzione
      migliore consiste nel parcheggiare e risalire a piedi la pista forestale sino alla diga del Someșul
      Rece, in cima alla forra. Con passo tranquillo, andata e ritorno richiedono da quattro a cinque ore.


      Tracciati segnalati salgono in quota. Un sentiero a fascia rossa da 17 a 20 ore segue il crinale
      primario del massiccio Gilău-Muntele Mare. Un itinerario a croce rossa (sette ore) collega i rifugi
      Someșul Rece e Muntele Filii. Una traccia non segnalata di circa tre ore, più impervia, esplora le forre
      selvagge di Dumitreasa.
    history: >-
      Durante la seconda guerra mondiale l'area rivestì un rilievo strategico, di cui resta traccia nella
      «strada di Antonescu», selciata tra Măguri Răcătău e Valea Ierii, oggi percorsa da ciclisti ed
      escursionisti.


      Gli habitat subiscono pressioni per disboscamenti e cambi colturali. L'ente turistico di Cluj descrive
      la forra come una delle oasi naturali meglio preservate dell'intero distretto.
    before: >-
      La valle è godibile in ogni stagione, inclusi i candidi inverni innevati. Il periodo ottimale va da
      maggio a ottobre.
    around: >-
      A cinque chilometri sorge il [Parco naturale Apuseni - Massiccio di
      Bihor](/lugar/parcul-natural-apuseni---masivul-bihor/) e a sette il [Massiccio di
      Vlădeasa](/lugar/masivul-vladeasa/), nella medesima catena montuosa.
  pt:
    intro: >-
      Entre Gura Negruței e La Luncuța, o rio Someșul Rece mergulha num desfiladeiro profundo e selvagem,
      ladeado apenas por uma pista florestal. É o coração de um vale de montanha dos Apuseni, no condado de
      Cluj, ao qual se acede por uma estrada estreita, a 107T, que parte de Cluj via Gilău e Someșu Rece até
      Măguri Răcătău.


      O Someșul Rece («Someș frio») forma a cabeceira direita do Someșul Mic. Nasce a quase 1600 metros no
      maciço Gilău-Muntele Mare e junta-se ao Someșul Cald na albufeira de Gilău. Pelo meio correm 49
      quilómetros de rio e 330 quilómetros quadrados de bacia hidrográfica.
    landscape: >-
      A geologia explica a paisagem. O vale integra a unidade estrutural Gilău-Muntele Mare nos Apuseni do
      Norte, de estrutura complexa com intrusões graníticas pré-hercínicas. Sobre este embasamento, os vales
      precipitam-se para o Someșul Mic atingindo em pouca distância desníveis de 300 a 400 metros, com
      declives de 25 a 30 metros por quilómetro. O pico mais alto dos montes Gilău, Chicera Comării, alcança
      1475 metros.


      A floresta de espruce constitui a base vegetal: cobre 55 % da área protegida, que abrange cerca de 8529
      hectares na rede Natura 2000. Ocorrem também turfeiras florestadas e turfeiras ativas. No total existem
      oito tipos de habitats de interesse comunitário, sendo três prioritários, ocupando cerca de 20 % da
      superfície. Nas turfeiras ativas dominam os musgos do género *Sphagnum*, com andrómeda,
      algodão-dos-pauis, bétula-anã e urze. Nas escarpas rochosas, o vento e o gelo modelaram árvores em
      formas invulgares. Entre as espécies vegetais raras contam-se a *Arnica montana*, o *Lycopodium
      clavatum* e as campainhas-de-inverno.
    wildlife: >-
      O maior tesouro reside nos grandes carnívoros. O [lobo-cinzento](/especie/canis_lupus/): pelo menos uma
      alcateia de 8 exemplares percorre o desfiladeiro e as vertentes vizinhas. O
      [lince-euroasiático](/especie/lynx_lynx/): contam-se pelo menos 4 espécimes residentes. O
      [urso-pardo](/especie/ursus_arctos/): no mínimo 3 animais residentes. Dado que o perímetro da reserva é
      exíguo para predadores de topo, estes animais vagueiam muito para além dos seus limites.


      A água acolhe fauna própria. A [lontra-europeia](/especie/lutra_lutra/) foi uma descoberta notável na
      área. O tímalo habita o curso inferior do Someșul Rece, em águas fundas a jusante da truta. O
      sapo-de-barriga-amarela coloniza a faixa de altitude entre 300 e 1600 ou 1700 metros.


      No verão, pelo caminho rumo ao desfiladeiro, sente-se o cheiro a feno e avistam-se cavalos soltos na
      aldeia. Com o inverno, o vale cobre-se de neve silenciosa.
    visit: >-
      A partir de Cluj chega-se via Gilău e Someșu Rece pela estrada municipal 107T em direção a Măguri
      Răcătău. A opção mais prática é estacionar e seguir a pé pela pista florestal até à açude do Someșul
      Rece, no topo do desfiladeiro. Em passo descontraído, o percurso de ida e volta estima-se em quatro a
      cinco horas.


      Para explorar mais longe há trilhos assinalados. Uma rota com fita vermelha (17 a 20 horas) percorre a
      cumeada principal do maciço Gilău-Muntele Mare. Um trilho de cruz vermelha (sete horas) une os abrigos
      de Someșul Rece e Muntele Filii. Uma vereda não sinalizada de cerca de três horas, mais exigente, visita
      as gargantas de Dumitreasa.
    history: >-
      Durante a Segunda Guerra Mundial a região teve importância estratégica, restando dessa época a «estrada
      de Antonescu», calçada entre Măguri Răcătău e Valea Ierii, hoje percorrida por turistas e provas de
      ciclismo.


      Os habitats enfrentam pressões decorrentes do corte de madeira e alterações agrícolas. A entidade de
      turismo de Cluj classifica a garganta como um dos recantos mais protegidos do distrito.
    before: >-
      O vale pode ser percorrido em várias estações, incluindo na estepe de neve invernal. A melhor época
      decorre de maio a outubro.
    around: >-
      A cinco quilómetros fica o [Parque Natural Apuseni - Maciço de
      Bihor](/lugar/parcul-natural-apuseni---masivul-bihor/) e a sete o [Maciço de
      Vlădeasa](/lugar/masivul-vladeasa/), na mesma cordilheira montanhosa.
