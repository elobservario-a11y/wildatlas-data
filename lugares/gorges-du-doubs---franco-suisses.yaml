    Cañón fluvial meandriforme que marca la frontera natural entre Francia y Suiza con cortados calizos y
    saltos de agua.
  en: >-
    A meandering river canyon marking the natural frontier between France and Switzerland with limestone
    cliffs and cascading falls.
  fr: >-
    Canyon fluvial à méandres marquant la frontière naturelle entre la France et la Suisse entre falaises
    calcaires et cascades.
  de: >-
    Gewundener Flusscanyon an der Grenze zwischen Frankreich und der Schweiz mit steilen Kalkwänden und
    Wasserfällen.
  it: >-
    Canyon fluviale a meandri che delinea il confine naturale tra Francia e Svizzera con balze calcaree e
    cascate fragorose.
  pt: >-
    Desfiladeiro fluvial meandriforme delimitando a fronteira natural entre a França e a Suíça entre escarpas
    calcárias e quedas de água.
unico:
  es: >-
    Un río que es frontera y corredor ecológico, con una cascada de 27 metros, nacida de un derrumbe, a la
    salida de un lago.
  en: >-
    A river acting simultaneously as a national border and ecological corridor, featuring a 27-metre waterfall
    born of a prehistoric landslide at a lake outflow.
  fr: >-
    Une rivière à la fois frontière et corridor écologique, marquée par une cascade de 27 mètres née d'un
    éboulement géologique à la sortie d'un lac.
  de: >-
    Ein Fluss als Grenze und Biotopverbund zugleich, geprägt von einem 27 Meter hohen Wasserfall nach einem
    nacheiszeitlichen Bergsturz.
  it: >-
    Un fiume che funge da confine e corridoio ecologico, contraddistinto da una cascata di 27 metri nata da
    una paleofrana all'uscita di un lago.
  pt: >-
    Um rio que atua simultaneamente como fronteira e corredor ecológico, ostentando uma cascata de 27 metros
    originada pelo colapso de uma encosta à saída de um lago.
