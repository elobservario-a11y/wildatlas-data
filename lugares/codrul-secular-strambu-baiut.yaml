    Un hayedo primario con abetos de más de 500 años, donde el oso, el lobo y el lince dominan la cadena
    trófica.
  en: A primary beech forest with firs over 500 years old, where bear, wolf, and lynx rule the food chain.
  fr: >-
    Une hêtraie primaire abritant des sapins de plus de 500 ans, où l'ours, le loup et le lynx dominent la
    chaîne trophique.
  de: >-
    Ein Buchen-Urwald mit über 500 Jahre alten Weißtannen, in dem Bär, Wolf und Luchs die Nahrungskette
    anführen.
  it: Una faggeta primaria con abeti di oltre 500 anni, dove orso, lupo e lince dominano la catena trofica.
  pt: Um faial primário com abetos com mais de 500 anos, onde o urso, o lobo e o lince dominam a cadeia trófica.
observaciones:
  es: >-
    El ayuntamiento advierte que el tramo Cavnic–Pasul Rotunda–Strâmbu Băiuț queda cerrado en invierno por la
    nieve y las avalanchas. Consulta con el gestor las condiciones de visita antes de salir.
texto:
  es:
    intro: >-
      Alza la vista: los árboles de aquí superan a menudo los 50 metros de altura y el metro y medio de
      diámetro, y algunos abetos pasan de los 500 años. Eso es Strâmbu-Băiuț, en el condado de Maramureș, un
      bosque primario de hayas, puras o mezcladas con abetos, en los Cárpatos orientales. El bosque se
      regenera de forma natural, sin influencia humana, y la UNESCO lo cuenta entre los componentes de su bien
      de hayedos primarios: la parte de Strâmbu-Băiuț ocupa 598,14 hectáreas, dentro de una zona de
      amortiguamiento de 713,09.
    landscape: >-
      El bosque sube desde las colinas hasta la montaña, entre 560 y 1,300 metros de altitud. Su corazón es el
      haya (Fagus sylvatica), pura o mezclada con abeto (Abies alba), pero además hay hábitats más escondidos:
      bosques frondosos de ladera, canchales y barrancos.


      Es un bosque que se renueva solo. Como la regeneración ocurre de forma natural, sin influencia humana,
      los gigantes caen y los jóvenes ocupan su sitio. El Ministerio atribuye además a estos bosques una
      función de conexión entre los Cárpatos meridionales y los Cárpatos de Ucrania.


      Cerca del pueblo corre el río Strâmbul Băiuț, que desemboca en el Lăpuș dentro del propio Strâmbu-Băiuț.
      El nombre habla de él: la tradición local relaciona «Strâmbu» con el curso sinuoso, «strâmb», de las
      aguas.
    wildlife: >-
      En lo alto de la cadena trófica mandan el [oso](/especie/ursus_arctos/), el
      [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/), con el [gato
      montés](/especie/felis_silvestris/) y la [marta](/especie/martes_martes/) completando el cuadro.


      Entre las aves, el [halcón peregrino](/especie/falco_peregrinus/) y el [abejero
      europeo](/especie/pernis_apivorus/) de día; de noche, el cárabo común y el [cárabo
      uralense](/especie/strix_uralensis/). También son especies representativas la [cigüeña
      negra](/especie/ciconia_nigra/) y el [pico negro](/especie/dryocopus_martius/), que WWF cita para el
      conjunto del sitio Natura.


      En el sotobosque hay, entre otras, plantas como la Actaea spicata, el ajo de oso (Allium ursinum), la
      Anemone ranunculoides, la Campanula persicifolia y la Cardamine impatiens.
    visit: >-
      La infraestructura de visita se está preparando. WWF documenta en el sitio la construcción de un
      observatorio de fauna, la realización de senderos temáticos y la elaboración de paneles informativos. El
      informe de planificación recomienda que el futuro centro de visita se sitúe fuera del área protegida, y
      no acredita que exista todavía.


      Existe, eso sí, un precedente: el museo provincial documentó una salida por los bosques de Strâmbu Băiuț
      con guía de especialistas forestales.
    history: >-
      La historia del pueblo se lee en su nombre. «Băiuț» recuerda el pasado minero de la región, y los
      nombres históricos del pueblo estaban ligados a la mina y a la fundición de hierro; la historia
      municipal registra la forma Strambulu en 1835. En el cementerio de Băiuț hay inscripciones en rumano,
      húngaro, alemán y latín, huella de quienes trabajaron aquí.


      El bosque está protegido bajo la categoría I de la IUCN. En 2011 el área se incorporó al sitio de
      importancia comunitaria ROSCI0285 Codrii seculari de la Strâmbu Băiuț, y desde 2022 la conservación de
      su biodiversidad cuenta con certificación de servicios ecosistémicos, la primera en Rumanía. La UNESCO
      pide para los componentes del bien una gestión estricta sin intervención, y señala que las mayores
      amenazas del bien en su conjunto son la tala y la fragmentación del hábitat.
    before: >-
      El ayuntamiento advierte que el tramo Cavnic–Pasul Rotunda–Strâmbu Băiuț queda cerrado en invierno por
      la nieve y las avalanchas. Consulta con el gestor las condiciones de visita antes de salir.
    around: >-
      Los [Codrii seculari Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) quedan a unos catorce
      kilómetros, y el [Parcul Natural Munții Maramureșului](/lugar/parcul-natural-muntii-maramuresului/) a
      unos veinticinco. Entre los lugares afines, la [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) comparte el cárabo uralense, el pico negro y la
      cigüeña negra. La [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) coincide en el abejero europeo, la
      marta y el abeto, y el [Pragozd Krokar](/lugar/pragozd-krokar/) en el cárabo común, el cárabo uralense y
      el halcón peregrino. En [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) comparten el
      cárabo común, la haya y el pico negro.
  en:
    intro: >-
      Look up: the trees here often exceed 50 metres in height and a metre and a half in diameter, with some
      silver firs passing 500 years old. This is Strâmbu-Băiuț, in Maramureș County, a primary forest of
      beech, pure or mixed with fir, in the Eastern Carpathians. The forest regenerates naturally without
      human influence, and UNESCO includes it among the component parts of its primeval beech forests
      property: the Strâmbu-Băiuț sector covers 598.14 hectares, nested within a buffer zone of 713.09.
    landscape: >-
      The forest climbs from rolling hills into the mountains, between 560 and 1,300 metres above sea level.
      Its beating heart is the European beech (Fagus sylvatica), pure or mixed with silver fir (Abies alba),
      alongside more secluded habitats: lush slope forests, screes, and steep ravines.


      It is a forest that renews itself entirely. Because natural regeneration unfolds without human
      intervention, ancient giants topple and saplings claim their place. The Ministry also identifies these
      woodlands as a vital ecological corridor linking the Southern Carpathians with the Ukrainian
      Carpathians.


      Near the village flows the Strâmbul Băiuț River, which empties into the Lăpuș right inside
      Strâmbu-Băiuț. Its name tells its story: local tradition connects «Strâmbu» to the winding, crooked
      («strâmb») path of the water.
    wildlife: >-
      At the top of the trophic pyramid reign the [brown bear](/especie/ursus_arctos/), the [grey
      wolf](/especie/canis_lupus/), and the [Eurasian lynx](/especie/lynx_lynx/), with the [European
      wildcat](/especie/felis_silvestris/) and [European pine marten](/especie/martes_martes/) completing the
      guild.


      Among birds, look for the [peregrine falcon](/especie/falco_peregrinus/) and the [European honey
      buzzard](/especie/pernis_apivorus/) by day; by night, the tawny owl and [Ural
      owl](/especie/strix_uralensis/). Key representative species also include the [black
      stork](/especie/ciconia_nigra/) and [black woodpecker](/especie/dryocopus_martius/), noted by WWF across
      the wider Natura site.


      The undergrowth conceals botanical gems including Actaea spicata, wild garlic (Allium ursinum), yellow
      wood anemone (Anemone ranunculoides), peach-leaved bellflower (Campanula persicifolia), and touch-me-not
      bittercress (Cardamine impatiens).
    visit: >-
      Visitor infrastructure is currently being developed. On the ground, WWF has documented the construction
      of a wildlife observatory, thematic nature trails, and interpretive panels. The official management plan
      recommends that any future visitor centre be established outside the protected core, and there is no
      record of one operating yet.


      A clear precedent does exist: the county museum previously organised guided forest excursions into
      Strâmbu-Băiuț led by forestry experts.
    history: >-
      The village's history is written into its name. «Băiuț» recalls the region's historic mining past,
      linked to iron mines and smelting; municipal archives record the place-name Strambulu in 1835. In the
      Băiuț cemetery, headstone inscriptions appear in Romanian, Hungarian, German, and Latin, testifying to
      the varied hands that worked here.


      The forest is safeguarded under IUCN Category I. In 2011 the woodland was integrated into the Site of
      Community Importance ROSCI0285 Codrii seculari de la Strâmbu Băiuț, and since 2022 its biodiversity
      protection has held ecosystem services certification, the first in Romania. UNESCO mandates strict
      non-intervention management for each component part, identifying logging and habitat fragmentation as
      the greatest threats across the wider serial property.
    before: >-
      The local council warns that the mountain road between Cavnic, Pasul Rotunda, and Strâmbu-Băiuț closes
      during winter owing to snowdrifts and avalanche hazard. Check local conditions with the managing
      authority before setting out.
    around: >-
      The [Codrii seculari Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) lies about fourteen
      kilometres away, and [Parcul Natural Munții Maramureșului](/lugar/parcul-natural-muntii-maramuresului/)
      roughly twenty-five. Among ecological counterparts, [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) shares the Ural owl, black woodpecker, and black
      stork. [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) shares the honey buzzard, pine marten,
      and fir, while [Pragozd Krokar](/lugar/pragozd-krokar/) shares the tawny owl, Ural owl, and peregrine
      falcon. In [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/), the common beech, black
      woodpecker, and tawny owl converge.
  fr:
    intro: >-
      Levez les yeux : les arbres dépassent souvent ici 50 mètres de hauteur et un mètre et demi de diamètre,
      et certains sapins franchissent le cap des 500 ans. Nous sommes à Strâmbu-Băiuț, dans le județ de
      Maramureș, au cœur d'une forêt primaire de hêtres, purs ou mêlés de sapins, dans les Carpates
      orientales. La forêt se régénère naturellement, sans intervention humaine, et l'UNESCO l'intègre parmi
      les éléments constitutifs de son bien sériel des forêts primaires de hêtres : le secteur de
      Strâmbu-Băiuț s'étend sur 598,14 hectares, ceinturé d'une zone tampon de 713,09 hectares.
    landscape: >-
      La forêt s'élève des collines vers les crêtes montagnardes, entre 560 et 1 300 mètres d'altitude. Son
      épine dorsale est le hêtre commun (Fagus sylvatica), en peuplements purs ou associé au sapin blanc
      (Abies alba), mais elle cache aussi des milieux plus discrets : forêts de versants abrupts, éboulis
      rocheux et ravins escarpés.


      C'est un écosystème qui s'auto-renouvelle en permanence. Comme la dynamique naturelle opère sans
      interférence humaine, les géants centenaires s'effondrent et les jeunes pousses s'emparent de la
      lumière. Le ministère souligne également le rôle de passerelle écologique assuré par ces forêts entre
      les Carpates méridionales et les Carpates ukrainiennes.


      À proximité du village coule la rivière Strâmbul Băiuț, qui se jette dans le Lăpuș au sein même de
      Strâmbu-Băiuț. Sa toponymie en dit long : la mémoire locale associe « Strâmbu » aux méandres sinueux («
      strâmb ») de son cours d'eau.
    wildlife: >-
      Au sommet de la chaîne alimentaire règnent l'[ours brun](/especie/ursus_arctos/), le
      [loup](/especie/canis_lupus/) et le [lynx boréal](/especie/lynx_lynx/), secondés par le [chat
      forestier](/especie/felis_silvestris/) et la [martre des pins](/especie/martes_martes/) pour compléter
      ce cortège forestier.


      Côté avifaune, guettez le [faucon pèlerin](/especie/falco_peregrinus/) et la [bondrée
      apivore](/especie/pernis_apivorus/) en journée ; à la nuit tombée résonnent la chouette hulotte et la
      [chouette de l'Oural](/especie/strix_uralensis/). La [cigogne noire](/especie/ciconia_nigra/) et le [pic
      noir](/especie/dryocopus_martius/) constituent d'autres espèces emblématiques répertoriées par le WWF
      sur l'ensemble du périmètre Natura.


      Le sous-bois recèle des trésors botaniques tels qu'Actaea spicata, l'ail des ours (Allium ursinum),
      l'anémone fausse-renoncule (Anemone ranunculoides), la campanule à feuilles de pêcher (Campanula
      persicifolia) et la cardamine impatiente (Cardamine impatiens).
    visit: >-
      Les infrastructures destinées aux visiteurs sont en cours d'aménagement. Le WWF documente sur place
      l'édification d'un observatoire faunistique, la création de sentiers thématiques et la pose de panneaux
      didactiques. Le plan de gestion préconise l'implantation du futur centre d'accueil en dehors du
      périmètre strictement protégé, et aucun aménagement de ce type n'est encore opérationnel.


      Une démarche pionnière existe néanmoins : le musée départemental a organisé par le passé une excursion
      guidée dans les forêts de Strâmbu Băiuț sous la conduite de spécialistes forestiers.
    history: >-
      L'histoire du bourg est inscrite dans son patronyme. « Băiuț » évoque le riche passé minier des
      environs, attaché à l'extraction et aux forges de fer ; les archives communales relèvent la graphie
      Strambulu en 1835. Dans le cimetière de Băiuț, les épitaphes en roumain, hongrois, allemand et latin
      racontent la mixité des générations qui ont forgé ces lieux.


      La forêt bénéficie du statut de protection intégrale de catégorie I de l'UICN. En 2011, le massif a
      intégré le site d'intérêt communautaire ROSCI0285 Codrii seculari de la Strâmbu Băiuț, et depuis 2022 la
      préservation de sa biodiversité est reconnue par une certification de services écosystémiques, une
      première en Roumanie. L'UNESCO exige une gestion rigoureuse exempte de toute intervention humaine,
      rappelant que l'exploitation forestière et le mitage des habitats représentent les menaces majeures
      pesant sur l'ensemble du bien sériel.
    before: >-
      La municipalité avertit que le tronçon routier reliant Cavnic, le Pasul Rotunda et Strâmbu Băiuț est
      fermé en hiver en raison de l'enneigement et des risques d'avalanches. Renseignez-vous auprès de
      l'organisme de gestion sur les conditions d'accès avant d'entreprendre votre voyage.
    around: >-
      Les [Codrii seculari Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) se situent à environ
      quatorze kilomètres, et le [Parcul Natural Munții
      Maramureșului](/lugar/parcul-natural-muntii-maramuresului/) à environ vingt-cinq kilomètres. Parmi les
      sites naturels apparentés, la [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) abrite la chouette de l'Oural, le pic noir et la
      cigogne noire. La [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) partage la bondrée apivore, la martre
      et le sapin, tandis que le [Pragozd Krokar](/lugar/pragozd-krokar/) accueille la chouette hulotte, la
      chouette de l'Oural et le faucon pèlerin. À
      [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) se côtoient le hêtre commun, le pic
      noir et la chouette hulotte.
  de:
    intro: >-
      Blicke nach oben: Die Bäume hier überragen oft 50 Meter Höhe und eineinhalb Meter Durchmesser, und
      manche Tannen zählen mehr als 500 Jahre. Das ist Strâmbu-Băiuț im Kreis Maramureș, ein Urwald aus
      Rotbuchen, rein oder mit Tannen gemischt, in den Ostkarpaten. Der Wald verjüngt sich vollkommen
      natürlich ohne menschlichen Einfluss, und die UNESCO führt ihn als Bestandteil ihres Weltnaturerbes der
      Buchenurwälder: Der Teilbereich Strâmbu-Băiuț umfasst 598,14 Hektar, eingebettet in eine Pufferzone von
      713,09 Hektar.
    landscape: >-
      Der Wald steigt von den Hügeln ins Gebirge auf, zwischen 560 und 1.300 Metern Seehöhe. Sein Herzstück
      bildet die Rotbuche (Fagus sylvatica), rein oder vergesellschaftet mit der Weißtanne (Abies alba), doch
      es gibt auch verborgene Sonderstandorte: artenreiche Hangmischwälder, Blockschutthalden und felsige
      Schluchten.


      Es ist ein Wald, der sich selbst erneuert. Weil die Verjüngung ungestört ohne forstliche Eingriffe
      abläuft, stürzen die Baumriesen um und Jungwuchs schließt die Lücken. Das Ministerium hebt zudem die
      Rolle dieser Wälder als Verbundkorridor zwischen den Südkarpaten und den ukrainischen Karpaten hervor.


      Nahe der Ortschaft fließt der Fluss Strâmbul Băiuț, der noch im Gemeindegebiet von Strâmbu-Băiuț in den
      Lăpuș mündet. Sein Name erzählt seine Geschichte: Die lokale Überlieferung führt «Strâmbu» auf den
      gewundenen, krummen («strâmb») Lauf des Gewässers zurück.
    wildlife: >-
      An der Spitze der Nahrungspyramide stehen [Braunbär](/especie/ursus_arctos/),
      [Wolf](/especie/canis_lupus/) und [Eurasischer Luchs](/especie/lynx_lynx/), ergänzt durch
      [Wildkatze](/especie/felis_silvestris/) und [Baummarder](/especie/martes_martes/).


      Unter den Vögeln kreisen tagsüber [Wanderfalke](/especie/falco_peregrinus/) und
      [Wespenbussard](/especie/pernis_apivorus/); nachts rufen Waldkauz und
      [Habichtskauz](/especie/strix_uralensis/). Zu den Leitarten gehören auch
      [Schwarzstorch](/especie/ciconia_nigra/) und [Schwarzspecht](/especie/dryocopus_martius/), die der WWF
      für das gesamte Natura-Gebiet anführt.


      In der Krautschicht wachsen bemerkenswerte Pflanzenarten wie Christophskraut (Actaea spicata), Bärlauch
      (Allium ursinum), Gelbes Windröschen (Anemone ranunculoides), Pfirsichblättrige Glockenblume (Campanula
      persicifolia) und Spring-Schaumkraut (Cardamine impatiens).
    visit: >-
      Die Besucherinfrastruktur befindet sich im Aufbau. Der WWF dokumentiert vor Ort den Bau einer
      Wildbeobachtungsstation, die Anlage von Themenpfaden und das Aufstellen von Schautafeln. Der
      Managementplan empfiehlt, ein künftiges Besucherzentrum außerhalb des Schutzgebiets anzusiedeln, und
      belegt nicht, dass ein solches bereits existiert.


      Ein Vorbild gibt es jedoch: Das Kreismuseum veranstaltete in der Vergangenheit geführte Waldexkursionen
      durch Strâmbu Băiuț unter Leitung von Forstwissenschaftlern.
    history: >-
      Die Geschichte der Siedlung spiegelt sich im Namen wider. «Băiuț» verweist auf die bergmännische
      Vergangenheit der Region mit Erzgruben und Eisenhütten; städtische Chroniken verzeichnen 1835 die
      Schreibweise Strambulu. Auf dem Friedhof von Băiuț belegen Inschriften auf Rumänisch, Ungarisch, Deutsch
      und Latein das Zusammenleben der Menschen, die hier arbeiteten.


      Der Wald ist als IUCN-Kategorie I streng geschützt. Im Jahr 2011 wurde das Gebiet in das Schutzgebiet
      von gemeinschaftlicher Bedeutung ROSCI0285 Codrii seculari de la Strâmbu Băiuț eingegliedert, und seit
      2022 verfügt sein Biodiversitätsschutz über eine Zertifizierung für Ökosystemdienstleistungen, die erste
      in Rumänien. Die UNESCO verlangt für die Welterbeteilgebiete ein striktes Prozessschutz-Regime ohne
      Eingriffe und benennt Holzschlag und Waldfragmentierung als größte Gefahren für das Gesamtgut.
    before: >-
      Die Gemeindeverwaltung weist darauf hin, dass die Gebirgsstraße zwischen Cavnic, dem Pasul Rotunda und
      Strâmbu Băiuț im Winter wegen Schneeverwehungen und Lawinengefahr gesperrt wird. Erkundige dich vor der
      Anreise bei der Parkverwaltung nach den Wegeverhältnissen.
    around: >-
      Die [Codrii seculari Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) liegen rund vierzehn
      Kilometer entfernt, der [Parcul Natural Munții
      Maramureșului](/lugar/parcul-natural-muntii-maramuresului/) etwa fünfundzwanzig Kilometer. Unter
      verwandten Urwäldern teilt die [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) Habichtskauz, Schwarzspecht und Schwarzstorch.
      Die [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) stimmt in Wespenbussard, Baummarder
      und Tanne überein, während der [Pragozd Krokar](/lugar/pragozd-krokar/) Waldkauz, Habichtskauz und
      Wanderfalke beherbergt. In [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) begegnen
      sich Rotbuche, Schwarzspecht und Waldkauz.
  it:
    intro: >-
      Alza lo sguardo: gli alberi qui superano spesso i 50 metri di altezza e il metro e mezzo di diametro, e
      alcuni abeti oltrepassano i 500 anni. Questa è Strâmbu-Băiuț, nel distretto di Maramureș, una foresta
      primaria di faggi, puri o misti ad abeti, nei Carpati orientali. Il bosco si rigenera in modo del tutto
      naturale, senza alcuna influenza umana, e l'UNESCO lo annovera tra i componenti del suo bene seriale
      delle faggete primarie: la porzione di Strâmbu-Băiuț si estende su 598,14 ettari, all'interno di una
      zona cuscinetto di 713,09 ettari.
    landscape: >-
      La foresta sale dalle colline fino alla montagna, tra 560 e 1.300 metri di altitudine. Il suo cuore
      pulsante è il faggio selvatico (Fagus sylvatica), puro o associato all'abete bianco (Abies alba), ma non
      mancano ambienti più appartati: boschi densi di pendio, pietraie e forre rocciose.


      È una foresta capace di rinnovarsi da sola. Poiché la rigenerazione avviene per dinamiche naturali,
      senza interventi forestali, i patriarchi cadono e i giovani alberi ne occupano lo spazio. Il ministero
      riconosce inoltre a queste foreste una funzione essenziale di corridoio ecologico tra i Carpati
      meridionali e i Carpati ucraini.


      Vicino al paese scorre il fiume Strâmbul Băiuț, che sfocia nel Lăpuș proprio all'interno di
      Strâmbu-Băiuț. Il nome ne racconta l'origine: la tradizione locale collega «Strâmbu» al percorso sinuoso
      («strâmb») delle acque.
    wildlife: >-
      Al vertice della rete alimentare regnano l'[orso bruno](/especie/ursus_arctos/), il [lupo
      grigio](/especie/canis_lupus/) e la [lince euroasiatica](/especie/lynx_lynx/), con il [gatto
      selvatico](/especie/felis_silvestris/) e la [martora](/especie/martes_martes/) a completare il mosaico
      dei predatori.


      Tra i volatili, osserva il [falco pellegrino](/especie/falco_peregrinus/) e il [falco
      pecchiaiolo](/especie/pernis_apivorus/) durante il giorno; di notte si fanno sentire l'allocco e
      l'[allocco degli Urali](/especie/strix_uralensis/). Sono specie caratteristiche anche la [cicogna
      nera](/especie/ciconia_nigra/) e il [picchio nero](/especie/dryocopus_martius/), censiti dal WWF per
      l'intero sito Natura.


      Nel sottobosco crescono specie botaniche degne di nota come Actaea spicata, l'aglio orsino (Allium
      ursinum), l'anemone gialla (Anemone ranunculoides), la campanula con foglie di pesco (Campanula
      persicifolia) e la cardamina impaziente (Cardamine impatiens).
    visit: >-
      I servizi per i visitatori sono in fase di allestimento. Il WWF ha documentato sul posto la
      realizzazione di un osservatorio per la fauna, la tracciatura di percorsi tematici e l'installazione di
      bacheche informative. La relazione di pianificazione raccomanda che il futuro centro visite sorga al di
      fuori dell'area protetta, e non risulta che una simile struttura sia già attiva.


      Esiste però un precedente: il museo provinciale ha organizzato in passato un'escursione guidata nei
      boschi di Strâmbu Băiuț accompagnata da esperti forestali.
    history: >-
      La storia del borgo si legge nel toponimo. «Băiuț» evoca la tradizione mineraria della zona, legata alle
      miniere e alle ferriere; i registri storici comunali attestano la dicitura Strambulu nel 1835. Nel
      cimitero di Băiuț le iscrizioni in romeno, ungherese, tedesco e latino testimoniano la convivenza di chi
      ha lavorato in queste valli.


      La foresta gode della tutela integrale della categoria I IUCN. Nel 2011 l'area è confluita nel sito di
      importanza comunitaria ROSCI0285 Codrii seculari de la Strâmbu Băiuț, e dal 2022 la salvaguardia della
      biodiversità vanta una certificazione per i servizi ecosistemici, la prima in Romania. L'UNESCO impone
      una rigorosa gestione senza interventi antropici per i singoli componenti, evidenziando come i tagli
      boschivi e la frammentazione degli habitat siano le minacce più gravi per il bene nel suo complesso.
    before: >-
      L'amministrazione comunale avvisa che la strada di montagna tra Cavnic, Pasul Rotunda e Strâmbu Băiuț
      viene chiusa d'inverno a causa dell'innevamento e del pericolo slavine. Informati presso l'ente gestore
      sulle condizioni prima di metterti in cammino.
    around: >-
      I [Codrii seculari Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) distano circa
      quattordici chilometri, e il [Parcul Natural Munții
      Maramureșului](/lugar/parcul-natural-muntii-maramuresului/) circa venticinque. Tra le foreste affini, la
      [Národná prírodná rezervácia Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) accoglie l'allocco
      degli Urali, il picchio nero e la cicogna nera. La [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) presenta il falco pecchiaiolo, la
      martora e l'abete bianco, mentre il [Pragozd Krokar](/lugar/pragozd-krokar/) ospita allocco, allocco
      degli Urali e falco pellegrino. A [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) si
      ritrovano il faggio comune, il picchio nero e l'allocco.
  pt:
    intro: >-
      Ergue os olhos: as árvores aqui ultrapassam com frequência 50 metros de altura e metro e meio de
      diâmetro, e certos abetos superam os 500 anos de vida. Isto é Strâmbu-Băiuț, no distrito de Maramureș,
      uma floresta primária de faia, pura ou em consociação com abeto, nos Cárpatos orientais. A mata
      regenera-se espontaneamente, sem interferência humana, e a UNESCO integra-a entre os elementos
      constituintes do seu sítio serial de faiais primários: o núcleo de Strâmbu-Băiuț abrange 598,14
      hectares, envolvido por uma zona-tampão de 713,09 hectares.
    landscape: >-
      A floresta ascende das colinas até à montanha, situando-se entre 560 e 1 300 metros de altitude. O seu
      cerne é a faia-europeia (Fagus sylvatica), em povoamentos puros ou misturada com abeto-falso (Abies
      alba), acolhendo ainda recantos singulares: bosques densos de encosta íngreme, canchais e ravinas
      rochosas.


      É um ecossistema que se renova a si mesmo. Uma vez que o processo regenerativo decorre em moldes
      puramente naturais, os gigantes seculares tombam e as árvores jovens ocupam o seu espaço. O ministério
      salienta ainda o papel fulcral destas matas como elo de ligação ecológica entre os Cárpatos meridionais
      e os Cárpatos ucranianos.


      Perto da povoação corre o rio Strâmbul Băiuț, que desagua no Lăpuș em pleno território de Strâmbu-Băiuț.
      O nome evoca a sua identidade: a tradição local associa «Strâmbu» ao curso sinuoso e tortuoso («strâmb»)
      das suas águas.
    wildlife: >-
      No topo da cadeia trófica imperam o [urso-pardo](/especie/ursus_arctos/), o
      [lobo-cinzento](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/), secundados pelo
      [gato-bravo](/especie/felis_silvestris/) e pela [marta](/especie/martes_martes/) a fechar a guilda dos
      carnívoros.


      Nas aves, procura o [falcão-peregrino](/especie/falco_peregrinus/) e o
      [tartaranhão-apívoro](/especie/pernis_apivorus/) durante o dia; à noite ouve-se a coruja-do-mato e a
      [coruja-dos-urais](/especie/strix_uralensis/). São igualmente espécies de destaque a
      [cegonha-preta](/especie/ciconia_nigra/) e o [pica-pau-preto](/especie/dryocopus_martius/),
      referenciados pela WWF para o conjunto do sítio Natura.


      No sub-bosque prosperam espécies botânicas notáveis como Actaea spicata, o alho-dos-ursos (Allium
      ursinum), a anémona-amarela (Anemone ranunculoides), a campainha-com-folhas-de-pessegueiro (Campanula
      persicifolia) e a cardamina-impaciente (Cardamine impatiens).
    visit: >-
      A estrutura de apoio aos visitantes encontra-se em desenvolvimento. A WWF documenta no terreno a
      instalação de um posto de observação de fauna, a demarcação de percursos temáticos e a fixação de
      painéis interpretativos. O plano de gestão recomenda que o futuro centro de visitantes seja erguido fora
      dos limites da reserva estrita, não havendo indicação de que se encontre já ativo.


      Existe, contudo, um precedente claro: o museu distrital organizou anteriormente uma visita guiada às
      matas de Strâmbu Băiuț sob orientação de especialistas florestais.
    history: >-
      A memória da localidade espelha-se no seu nome. «Băiuț» recorda o passado de mineração da região,
      outrora ligado à extração e fundição de ferro; os registos municipais registam a grafia Strambulu em
      1835. No cemitério de Băiuț, as lápides ostentam epitáfios em romeno, húngaro, alemão e latim,
      testemunho das gentes que aqui trabalharam.


      A floresta beneficia do estatuto de conservação integral da Categoria I da UICN. Em 2011 o território
      foi incorporado no Sítio de Importância Comunitária ROSCI0285 Codrii seculari de la Strâmbu Băiuț, e
      desde 2022 a preservação dos seus valores biológicos ostenta certificação de serviços de ecossistema, a
      primeira na Roménia. A UNESCO exige proteção estrita sem corte de madeira para estes núcleos, alertando
      que o abate comercial e a fragmentação do coberto constituem as principais ameaças ao bem serial.
    before: >-
      A câmara municipal adverte que a ligação de montanha entre Cavnic, o Pasul Rotunda e Strâmbu Băiuț
      encerra no inverno devido ao nevão acumulado e ao risco iminente de avalanches. Confirma com a entidade
      gestora as condições do trajeto antes de viajares.
    around: >-
      Os [Codrii seculari Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/) situam-se a cerca de
      quatorze quilómetros, e o [Parcul Natural Munții
      Maramureșului](/lugar/parcul-natural-muntii-maramuresului/) a perto de vinte e cinco. Entre os espaços
      com traços semelhantes, a [Národná prírodná rezervácia
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) partilha a coruja-dos-urais, o pica-pau-preto e
      a cegonha-preta numa mata intacta. A [Národní přírodní rezervace Jizerskohorské
      bučiny](/lugar/narodni-prirodni-rezervace-jizerskohorske-buciny/) reúne o tartaranhão-apívoro, a marta e
      o abeto, enquanto o [Pragozd Krokar](/lugar/pragozd-krokar/) acolhe a coruja-do-mato, a coruja-dos-urais
      e o falcão-peregrino. Em [Muniellos](/lugar/fuentes-del-narcea-degana-e-ibias---muniellos/) convergem a
      faia-europeia, o pica-pau-preto e a coruja-do-mato.
