unico:
  es: >-
    Un macizo fronterizo donde un solo parque junta lagos glaciares, praderas de narcisos y osos, lobos y
    linces.
  en: >-
    A border massif where a single park brings together glacial lakes, daffodil meadows, and bears, wolves and
    lynx.
  fr: Un massif frontalier où un seul parc réunit lacs glaciaires, prairies de narcisses et ours, loups et lynx.
  de: >-
    Ein Grenzmassiv, in dem ein einziger Park Gletscherseen, Narzissenwiesen sowie Bären, Wölfe und Luchse
    vereint.
  it: >-
    Un massiccio di frontiera dove un unico parco unisce laghi glaciali, prati di narcisi e orsi, lupi e
    linci.
  pt: >-
    Um maciço fronteiriço onde um único parque reúne lagos glaciares, prados de narcisos e ursos, lobos e
    linces.
