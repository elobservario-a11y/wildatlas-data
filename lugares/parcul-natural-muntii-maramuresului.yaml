texto:
  es:
    intro: >-
      Esto es la frontera norte de Rumanía, y se nota: los montes Maramureș son el macizo más alto de ese
      límite, con el pico Farcău a mil novecientos cincuenta y siete metros, y detrás ya empieza Ucrania. El
      parque natural ocupa el noreste del condado de Maramureș, en los términos de Borșa y Vișeu de Sus, entre
      las Obcinele de Bucovina al este, los montes Rodna y la depresión de Maramureș al sur y el macizo Rakhiv
      al norte. Es un área de montaña con bosques, praderas, calveros alpinos, roquedos y valles, y con la
      gente que lo habita: aquí los maramuresanos todavía conservan los batanes hidráulicos de agua.
    landscape: >-
      El paisaje lo explica su geología variada. Hay relieve volcánico del Mesozoico en los picos Farcău y
      Mihăilecu, relieve glaciar en Pietrosul Maramureșului, Farcău y Mihăilecu, formas periglaciares del
      Pleistoceno, relieve sobre caliza en la cuenca alta del valle de Repedea y en los escarpes de Farcău y
      Mihăilecu, y formas sobre esquistos cristalinos. En la silla entre Farcău y Mihăilecu descansa el lago
      glaciar Vinderel, que se alimenta de un manantial, de la lluvia y del deshielo.


      Sobre ese relieve crecen robledales y hayedos, abetales de pícea y matorral de pino mugo. El clima es
      continental moderado, en general frío y húmedo en las zonas altas.
    wildlife: >-
      La flora tiene mucho que ofrecer. En las praderas y los roquedos hay rarezas como la flor de nieve o
      edelweiss (*Leontopodium alpinum*), el zapatito de dama (*Cypripedium calceolus*), *Pedicularis
      verticillata* y *Ligularia sibirica*, y dos plantas carnívoras: el rocío de sol, un relicto glaciar, y
      *Pinguicula alpina*. La reserva Farcău–Vinderel–Mihăilecu guarda rarezas botánicas como el arándano azul
      y el edelweiss. Y está la «lingurea» (*Cochlearia pyrenaica* var. *borzaeana*), una planta conocida por
      los lugareños con ese nombre, que crece en las rocas de Sâlhoi–Zâmbroslavele.


      La escena es otra a unos mil seiscientos metros, en la ladera derecha del pico Tomnatec: allí, en la
      pradera de Tomnatec–Sehleanu, vive una comunidad de narcisos (*Narcissus radiiflorus*) que se protege
      expresamente.


      La fauna es la de un monte grande. Entre los mamíferos figuran el [oso pardo](/especie/ursus_arctos/),
      el ciervo, el [corzo](/especie/capreolus_capreolus/), el [lobo](/especie/canis_lupus/), el
      [jabalí](/especie/sus_scrofa/), el [lince](/especie/lynx_lynx/), el visón europeo y la
      [nutria](/especie/lutra_lutra/). Entre las aves protegidas están el [águila
      real](/especie/aquila_chrysaetos/), el ratonero común, el [urogallo](/especie/tetrao_urogallus/) y el
      [gallo lira](/especie/tetrao_tetrix/); el área de Cornu Nedeii–Ciungii Bălăsinii se creó precisamente
      para proteger al gallo lira. También hay [pico tridáctilo](/especie/picoides_tridactylus/), pico verde,
      pico cano, pico dorsiblanco y [picamaderos negro](/especie/dryocopus_martius/), además del [mirlo
      acuático](/especie/cinclus_cinclus/) y la [cigüeña negra](/especie/ciconia_nigra/).


      En el agua, el [hucho](/especie/hucho_hucho/), el tímalo y el barbo. Entre los anfibios, la [salamandra
      común](/especie/salamandra_salamandra/), el [tritón de los Cárpatos](/especie/triturus_montandoni/) y el
      sapillo de vientre amarillo. Y entre los invertebrados, la [rosalía alpina](/especie/rosalia_alpina/) y
      mariposas raras como *Parnassius mnemosyne* y *Lycaena dispar*.


      La temporada de visita va de mayo a octubre.
    visit: >-
      El parque cuenta con diecisiete rutas turísticas y tres rutas temáticas. El centro de visitantes
      funciona en la sede de la administración, en Vișeu de Sus. Petrova, Moisei y Borșa son los principales
      puntos de entrada. Entre los hitos naturales recomendados están el pico Farcău, el lago Vinderel y el
      pico Mihăilecu, el valle del Vaser y la pradera de narcisos de Tomnatec–Sehleanu. Se llega por la DN18
      desde Baia Mare, pasando por Petrova y Leordina hasta Vișeu de Sus.


      Cerca del parque hay otras visitas: el Museo del Pueblo Maramuresano de Sighetu Marmației, el Cementerio
      Alegre de Săpânța, el monasterio de Bârsana y el tren histórico del valle del Vaser. Cuenta con dos a
      cuatro días.
    history: >-
      La economía de la zona se basa en la explotación y transformación de la madera, la ganadería y el
      turismo. El parque es vulnerable al turismo incontrolado, la caza furtiva, el pastoreo disperso y las
      talas ilegales, y los deportes extremos con vehículos todoterreno, quads y motos perturban el área con
      ruido.
    before: Cuenta con dos a cuatro días. Las épocas mejores van de mayo a octubre.
    around: >-
      A dos kilómetros queda el [Parque Nacional Montañas de Rodna](/lugar/parcul-national-muntii-rodnei/); a
      veinticinco, el [Bosque Primario de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/), y a
      veintisiete, el [Bosque Primario de Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/).
  en:
    intro: >-
      This is the northern border of Romania, and it shows: the Maramureș Mountains form the highest massif
      along that border, culminating at Farcău Peak at one thousand nine hundred and fifty-seven metres, with
      Ukraine beginning just beyond. The natural park occupies the north-east of Maramureș County, across the
      communes of Borșa and Vișeu de Sus, bounded by the Obcinele of Bukovina to the east, the Rodna Mountains
      and Maramureș Depression to the south, and the Rakhiv massif to the north. It is an expansive mountain
      landscape of forests, meadows, alpine pastures, rocky escarpments and valleys, where locals still
      preserve traditional water-powered fulling mills.
    landscape: >-
      The landscape is shaped by varied geology. There is Mesozoic volcanic topography on Farcău and Mihăilecu
      peaks, glacial landforms on Pietrosul Maramureșului, Farcău and Mihăilecu, Pleistocene periglacial
      relief, limestone karst in the upper basin of the Repedea Valley and on the cliffs of Farcău and
      Mihăilecu, alongside crystalline schist rocks. In the saddle between Farcău and Mihăilecu lies Lake
      Vinderel, a glacial lake nourished by a spring, rain and snowmelt.


      Across this terrain grow oakwoods and beech groves, Norway spruce stands and mountain pine scrub. The
      climate is moderate continental, predominantly cold and humid in the higher reaches.
    wildlife: >-
      The flora is remarkably rich. Meadows and cliffs shelter rarities such as edelweiss (*Leontopodium
      alpinum*), lady's slipper (*Cypripedium calceolus*), *Pedicularis verticillata* and *Ligularia
      sibirica*, along with two carnivorous plants: round-leaved sundew, a glacial relict, and alpine
      butterwort (*Pinguicula alpina*). The Farcău–Vinderel–Mihăilecu reserve preserves botanical gems such as
      bilberry and edelweiss. There is also the "lingurea" (*Cochlearia pyrenaica* var. *borzaeana*), a local
      folk name for a plant clinging to the rocks of Sâlhoi–Zâmbroslavele.


      The scenery shifts at around one thousand six hundred metres on the right slope of Tomnatec Peak: on the
      Tomnatec–Sehleanu meadow thrives an explicitly protected community of daffodils (*Narcissus
      radiiflorus*).


      The fauna is that of a great wild range. Mammals include the [brown bear](/especie/ursus_arctos/), red
      deer, [roe deer](/especie/capreolus_capreolus/), [grey wolf](/especie/canis_lupus/), [wild
      boar](/especie/sus_scrofa/), [Eurasian lynx](/especie/lynx_lynx/), European mink and [Eurasian
      otter](/especie/lutra_lutra/). Protected birds include the [golden eagle](/especie/aquila_chrysaetos/),
      common buzzard, [western capercaillie](/especie/tetrao_urogallus/) and [black
      grouse](/especie/tetrao_tetrix/); the Cornu Nedeii–Ciungii Bălăsinii area was established specifically
      to shelter the black grouse. Woodpeckers are well represented with [three-toed
      woodpecker](/especie/picoides_tridactylus/), European green woodpecker, grey-headed woodpecker,
      white-backed woodpecker and [black woodpecker](/especie/dryocopus_martius/), alongside the
      [white-throated dipper](/especie/cinclus_cinclus/) and [black stork](/especie/ciconia_nigra/).


      Streams shelter [Danube salmon](/especie/hucho_hucho/), grayling and barbel. Amphibians include the
      [fire salamander](/especie/salamandra_salamandra/), [Carpathian newt](/especie/triturus_montandoni/) and
      yellow-bellied toad. Invertebrates include the [Rosalia longicorn](/especie/rosalia_alpina/) and rare
      butterflies such as *Parnassius mnemosyne* and *Lycaena dispar*.


      The best time to visit runs from May to October.
    visit: >-
      The park features seventeen hiking routes and three themed trails. The visitor centre operates at park
      headquarters in Vișeu de Sus. Petrova, Moisei and Borșa are the main gateways. Recommended natural
      landmarks include Farcău Peak, Lake Vinderel, Mihăilecu Peak, the Vaser Valley and the Tomnatec–Sehleanu
      daffodil meadow. Access is via the DN18 highway from Baia Mare, passing through Petrova and Leordina to
      Vișeu de Sus.


      Nearby highlights include the Maramureș Village Museum in Sighetu Marmației, the Merry Cemetery in
      Săpânța, Bârsana Monastery and the historic steam train of the Vaser Valley. Plan for two to four days.
    history: >-
      The local economy relies on timber harvesting and processing, pastoral livestock farming and nature
      tourism. The park faces pressures from uncontrolled tourism, poaching, dispersed grazing, illegal
      logging, and off-road motor vehicles, quads and motorbikes causing noise pollution.
    before: Allow two to four days. The best time to visit is from May to October.
    around: >-
      Two kilometres away lies [Rodna Mountains National Park](/lugar/parcul-national-muntii-rodnei/);
      twenty-five kilometres away, the [Strâmbu-Băiuț Primeval Forest](/lugar/codrul-secular-strambu-baiut/);
      and twenty-seven kilometres away, the [Groșii Țibleșului Primeval
      Forest](/lugar/codrii-seculari-grosii-tiblesului/).
  fr:
    intro: >-
      C'est la frontière nord de la Roumanie, et cela se voit : les monts de Maramureș forment le massif le
      plus élevé de cette frontière, culminant au pic Farcău à mille neuf cent cinquante-sept mètres, avec
      l'Ukraine juste au-delà. Le parc naturel occupe le nord-est du județ de Maramureș, sur les communes de
      Borșa et Vișeu de Sus, bordé à l'est par les Obcinele de Bucovine, au sud par les monts Rodna et la
      dépression de Maramureș, et au nord par le massif de Rakhiv. C'est un vaste relief montagnard de forêts,
      prairies, estives, escarpements rocheux et vallées, habité par une population qui préserve encore des
      moulins à foulon traditionnels actionnés par l'eau.
    landscape: >-
      Le paysage s'explique par une géologie variée. On y trouve un relief volcanique mésozoïque sur les pics
      Farcău et Mihăilecu, une morphologie glaciaire sur Pietrosul Maramureșului, Farcău et Mihăilecu, un
      relief périglaciaire pléistocène, un karst calcaire dans le haut bassin de la vallée de Repedea et sur
      les falaises de Farcău et Mihăilecu, ainsi que des schistes cristallins. Dans le col entre Farcău et
      Mihăilecu repose le lac Vinderel, un lac glaciaire alimenté par une source, les pluies et la fonte des
      neiges.


      Sur ces terrains croissent chênaies et hêtraies, pessières d'épicéa et fourrés de pin mugo. Le climat
      est continental modéré, froid et humide dans les parties hautes.
    wildlife: >-
      La flore est d'une grande richesse. Prairies et falaises abritent des raretés comme l'edelweiss
      (*Leontopodium alpinum*), le sabot de Vénus (*Cypripedium calceolus*), *Pedicularis verticillata* et
      *Ligularia sibirica*, ainsi que deux plantes carnivores : la droséra à feuilles rondes, relique
      glaciaire, et la grasseette des Alpes (*Pinguicula alpina*). La réserve Farcău–Vinderel–Mihăilecu
      préserve des trésors botaniques comme la myrtille et l'edelweiss. On note aussi la « lingurea »
      (*Cochlearia pyrenaica* var. *borzaeana*), nom populaire d'une plante accrochée aux rochers de
      Sâlhoi–Zâmbroslavele.


      Le paysage change vers mille six cents mètres sur le versant droit du mont Tomnatec : sur la clairière
      Tomnatec–Sehleanu s'épanouit une colonie strictement protégée de narcisses (*Narcissus radiiflorus*).


      La faune est celle d'un grand massif sauvage. Les mammifères comptent l'[ours
      brun](/especie/ursus_arctos/), le cerf élaphe, le [chevreuil](/especie/capreolus_capreolus/), le [loup
      gris](/especie/canis_lupus/), le [sanglier](/especie/sus_scrofa/), le [lynx
      boréal](/especie/lynx_lynx/), le vison d'Europe et la [loutre d'Europe](/especie/lutra_lutra/). Les
      oiseaux protégés comprennent l'[aigle royal](/especie/aquila_chrysaetos/), la buse variable, le [grand
      tétras](/especie/tetrao_urogallus/) et le [tétras lyre](/especie/tetrao_tetrix/) ; la zone Cornu
      Nedeii–Ciungii Bălăsinii a été désignée expressément pour protéger le tétras lyre. Les pics sont très
      bien représentés avec le [pic tridactyle](/especie/picoides_tridactylus/), le pic vert, le pic cendré,
      le pic à dos blanc et le [pic noir](/especie/dryocopus_martius/), aux côtés du [cincle
      plongeur](/especie/cinclus_cinclus/) et de la [cigogne noire](/especie/ciconia_nigra/).


      Dans les torrents nagent le [saumon du Danube](/especie/hucho_hucho/), l'ombre commun et le barbeau. Les
      amphibiens comptent la [salamandre tachetée](/especie/salamandra_salamandra/), le [triton de
      Montandon](/especie/triturus_montandoni/) et le sonneur à ventre jaune. Parmi les invertébrés figurent
      la [rosalie des Alpes](/especie/rosalia_alpina/) et des papillons rares comme *Parnassius mnemosyne* et
      *Lycaena dispar*.


      La période de visite va de mai à octobre.
    visit: >-
      Le parc compte dix-sept sentiers touristiques et trois sentiers thématiques. Le centre d'accueil se
      trouve au siège de l'administration à Vișeu de Sus. Petrova, Moisei et Borșa sont les principales portes
      d'entrée. Parmi les sites naturels conseillés figurent le mont Farcău, le lac Vinderel, le pic
      Mihăilecu, la vallée de la Vaser et la prairie de narcisses de Tomnatec–Sehleanu. On y accède par la
      route DN18 depuis Baia Mare, via Petrova et Leordina jusqu'à Vișeu de Sus.


      Aux environs se trouvent le musée du village maramuréchois à Sighetu Marmației, le joyeux cimetière de
      Săpânța, le monastère de Bârsana et le train à vapeur historique de la vallée de la Vaser. Prévoyez deux
      à quatre jours.
    history: >-
      L'économie locale repose sur l'exploitation et la transformation du bois, l'élevage pastoral et le
      tourisme de nature. Le parc subit les pressions du tourisme non réglementé, du braconnage, du pâturage
      dispersé, des coupes illégales et des engins motorisés tout-terrain provoquant des nuisances sonores.
    before: Comptez deux à quatre jours. La meilleure période s'étend de mai à octobre.
    around: >-
      À deux kilomètres se trouve le [parc national des monts Rodna](/lugar/parcul-national-muntii-rodnei/) ;
      à vingt-cinq kilomètres, la [forêt primaire de Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) ; et
      à vingt-sept kilomètres, la [forêt primaire de Groșii
      Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/).
  de:
    intro: >-
      Hier verläuft die Nordgrenze Rumäniens, und das prägt das Bild: Das Maramureș-Gebirge bildet das höchste
      Massiv entlang dieser Grenze und gipfelt am Farcău bei eintausendneunhundertsiebenundfünfzig Metern,
      während direkt dahinter die Ukraine beginnt. Der Naturpark nimmt den Nordosten des Kreises Maramureș in
      den Gemeinden Borșa und Vișeu de Sus ein, begrenzt im Osten von den Bukowina-Obcinele, im Süden vom
      Rodna-Gebirge und der Maramureș-Senke und im Norden vom Rachiw-Massiv. Es ist ein weites Bergrelief aus
      Wäldern, Wiesen, Almen, Felswänden und Tälern, bewohnt von Menschen, die bis heute traditionelle
      wasserbetriebene Walkmühlen erhalten.
    landscape: >-
      Die Landschaft verdankt sich einer abwechslungsreichen Geologie. Es gibt mesozoisches Vulkanrelief an
      den Gipfeln Farcău und Mihăilecu, Glazialformen am Pietrosul Maramureșului, Farcău und Mihăilecu,
      pleistozäne Periglazialformen, Karstkalke im oberen Talbecken der Repedea und an den Felswänden von
      Farcău und Mihăilecu sowie kristalline Schiefer. Im Sattel zwischen Farcău und Mihăilecu liegt der
      Vinderel-See, ein Gletschersee, der von einer Quelle, Regen und Schneeschmelze gespeist wird.


      Auf diesen Böden wachsen Eichen- und Buchenwälder, Fichtenbestände und Krummholzkiefern. Das Klima ist
      gemäßigt kontinental, in den Höhenlagen überwiegend kalt und feucht.
    wildlife: >-
      Die Flora ist bemerkenswert artenreich. Wiesen und Felswände beherbergen Seltenheiten wie Edelweiß
      (*Leontopodium alpinum*), Frauenschuh (*Cypripedium calceolus*), *Pedicularis verticillata* und
      *Ligularia sibirica* sowie zwei fleischfressende Pflanzen: den Rundblättrigen Sonnentau, ein
      Glazialrelikt, und das Alpen-Fettkraut (*Pinguicula alpina*). Das Reservat Farcău–Vinderel–Mihăilecu
      schützt botanische Kostbarkeiten wie Heidelbeere und Edelweiß. Bemerkenswert ist auch das Löffelkraut
      „lingurea“ (*Cochlearia pyrenaica* var. *borzaeana*), das an den Felsen von Sâlhoi–Zâmbroslavele haftet.


      Auf rund eintausendsechshundert Metern an der rechten Flanke des Tomnatec ändert sich das Bild: Auf der
      Waldwiese Tomnatec–Sehleanu gedeiht eine streng geschützte Narzissenpopulation (*Narcissus
      radiiflorus*).


      Die Tierwelt entspricht einem großen Wildmassiv. Unter den Säugetieren leben
      [Braunbär](/especie/ursus_arctos/), Rothirsch, [Reh](/especie/capreolus_capreolus/),
      [Wolf](/especie/canis_lupus/), [Wildschwein](/especie/sus_scrofa/), [Eurasischer
      Luchs](/especie/lynx_lynx/), Europäischer Nerz und [Fischotter](/especie/lutra_lutra/). Zu den
      geschützten Vögeln gehören [Steinadler](/especie/aquila_chrysaetos/), Mäusebussard,
      [Auerhuhn](/especie/tetrao_urogallus/) und [Birkhuhn](/especie/tetrao_tetrix/); das Gebiet Cornu
      Nedeii–Ciungii Bălăsinii wurde speziell zum Schutz des Birkhuhns ausgewiesen. Spechte sind mit
      [Dreizehenspecht](/especie/picoides_tridactylus/), Grünspecht, Grauspecht, Weißrückenspecht und
      [Schwarzspecht](/especie/dryocopus_martius/) reich vertreten, dazu kommen
      [Wasseramsel](/especie/cinclus_cinclus/) und [Schwarzstorch](/especie/ciconia_nigra/).


      In den Bächen schwimmen [Huchen](/especie/hucho_hucho/), Äsche und Barbe. Bei den Amphibien finden sich
      [Feuersalamander](/especie/salamandra_salamandra/), [Karpatenmolch](/especie/triturus_montandoni/) und
      Gelbbauchunke. Zu den Wirbellosen zählen der [Alpenbock](/especie/rosalia_alpina/) und seltene
      Schmetterlinge wie *Parnassius mnemosyne* und *Lycaena dispar*.


      Die beste Besuchszeit reicht von Mai bis Oktober.
    visit: >-
      Der Park verfügt über siebzehn Wanderwege und drei Themenpfade. Das Besucherzentrum befindet sich am
      Sitz der Parkverwaltung in Vișeu de Sus. Petrova, Moisei und Borșa sind die wichtigsten Eingangspunkte.
      Zu den empfohlenen Naturzielen zählen der Farcău-Gipfel, der Vinderel-See, der Mihăilecu, das Vaser-Tal
      und die Narzissenwiese von Tomnatec–Sehleanu. Die Anfahrt erfolgt über die Nationalstraße DN18 von Baia
      Mare über Petrova und Leordina nach Vișeu de Sus.


      In der Umgebung lohnen das Maramureș-Dorfmuseum in Sighetu Marmației, der Fröhliche Friedhof von
      Săpânța, das Kloster Bârsana und die historische Dampfwaldbahn im Vaser-Tal. Plane zwei bis vier Tage
      ein.
    history: >-
      Die lokale Wirtschaft basiert auf Holzwirtschaft und -verarbeitung, Weidewirtschaft und Naturtourismus.
      Druck entsteht durch unregulierten Tourismus, Wilderei, verstreute Beweidung, illegalen Holzeinschlag
      und Geländefahrzeuge, Quads und Motorräder, die Lärmbelastungen verursachen.
    before: Plane zwei bis vier Tage ein. Die beste Zeit reicht von Mai bis Oktober.
    around: >-
      Zwei Kilometer entfernt liegt der [Nationalpark Rodna-Gebirge](/lugar/parcul-national-muntii-rodnei/);
      fünfundzwanzig Kilometer entfernt der [Urwald Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/); und
      siebenundzwanzig Kilometer entfernt der [Urwald Groșii
      Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/).
  it:
    intro: >-
      Questo è il confine settentrionale della Romania, e si vede: i monti di Maramureș costituiscono il
      massiccio più elevato lungo tale frontiera, culminando con il picco Farcău a
      millenovecentocinquantasette metri, oltre il quale comincia l'Ucraina. Il parco naturale occupa il
      nord-est del distretto di Maramureș, nei territori comunali di Borșa e Vișeu de Sus, delimitato a est
      dalle Obcine della Bucovina, a sud dai monti Rodna e dalla depressione di Maramureș e a nord dal
      massiccio di Rachiv. È un vasto paesaggio montano fatto di foreste, radure, pascoli alpini, dirupi
      rocciosi e vallate, abitato da popolazioni che conservano ancora mulini e gualchiere tradizionali
      azionati dall'acqua.
    landscape: >-
      Il paesaggio si spiega attraverso una geologia varia. Vi sono forme vulcaniche mesozoiche sui picchi
      Farcău e Mihăilecu, rilievi glaciali su Pietrosul Maramureșului, Farcău e Mihăilecu, morfologie
      periglaciale pleistocenica, formazioni carsiche calcaree nel bacino superiore della valle di Repedea e
      sulle balze di Farcău e Mihăilecu, accanto a scisti cristallini. Nella sella tra Farcău e Mihăilecu
      riposa il lago Vinderel, un lago glaciale alimentato da una sorgente, piogge e disgelo nevoso.


      Su questi versanti crescono querceti, faggete, peccete di abete rosso e boscaglie di pino mugo. Il clima
      è continentale moderato, prevalentemente freddo e umido nelle quote più alte.
    wildlife: >-
      La flora riserva grandi sorprese. Praterie e pareti rocciose custodiscono rarità come la stella alpina
      (*Leontopodium alpinum*), la pianella della Madonna (*Cypripedium calceolus*), *Pedicularis
      verticillata* e *Ligularia sibirica*, oltre a due piante carnivore: la drosera a foglie rotonde, relitto
      glaciale, e la pinguicola alpina (*Pinguicula alpina*). La riserva Farcău–Vinderel–Mihăilecu tutela
      preziose presenze floristiche come il mirtillo e la stella alpina. Spicca anche la "lingurea"
      (*Cochlearia pyrenaica* var. *borzaeana*), nome comune di una pianta abbarbicata sulle rupi di
      Sâlhoi–Zâmbroslavele.


      Il paesaggio cambia a circa milleseicento metri sul versante destro del Tomnatec: nella radura di
      Tomnatec–Sehleanu prospera una popolazione rigorosamente protetta di narcisi selvatici (*Narcissus
      radiiflorus*).


      La fauna è tipica dei grandi spazi selvaggi. Tra i mammiferi spiccano l'[orso
      bruno](/especie/ursus_arctos/), il cervo, il [capriolo](/especie/capreolus_capreolus/), il [lupo
      grigio](/especie/canis_lupus/), il [cinghiale](/especie/sus_scrofa/), la [lince
      eurasiatica](/especie/lynx_lynx/), il visone europeo e la [lontra europea](/especie/lutra_lutra/).
      L'avifauna protetta comprende l'[aquila reale](/especie/aquila_chrysaetos/), la poiana comune, il [gallo
      cedrone](/especie/tetrao_urogallus/) e il [fagiano di monte](/especie/tetrao_tetrix/); l'area di Cornu
      Nedeii–Ciungii Bălăsinii è stata istituita proprio per tutelare quest'ultimo. I picchi sono ben
      rappresentati con il [picchio tridattilo](/especie/picoides_tridactylus/), il picchio verde, il picchio
      cenerino, il picchio dorsobianco e il [picchio nero](/especie/dryocopus_martius/), insieme al [merlo
      acquaiolo](/especie/cinclus_cinclus/) e alla [cicogna nera](/especie/ciconia_nigra/).


      Nelle acque limpide nuotano il [salmone del Danubio](/especie/hucho_hucho/), il temolo e il barbo. Tra
      gli anfibi si contano la [salamandra pezzata](/especie/salamandra_salamandra/), il [tritone di
      Montandon](/especie/triturus_montandoni/) e l'ululone dal ventre giallo. Gli invertebrati annoverano il
      [cerambice del faggio](/especie/rosalia_alpina/) e farfalle rare come *Parnassius mnemosyne* e *Lycaena
      dispar*.


      Il periodo di visita ideale va da maggio a ottobre.
    visit: >-
      Il parco dispone di diciassette percorsi escursionistici e tre itinerari tematici. Il centro visitatori
      si trova presso la sede amministrativa a Vișeu de Sus. Petrova, Moisei e Borșa sono i principali varchi
      d'accesso. Tra le mete naturali più apprezzate figurano la vetta del Farcău, il lago Vinderel, il picco
      Mihăilecu, la valle del Vaser e il prato dei narcisi di Tomnatec–Sehleanu. Si accede tramite la strada
      DN18 da Baia Mare, passando per Petrova e Leordina fino a Vișeu de Sus.


      Nelle vicinanze meritano una sosta il Museo del Villaggio Maramureșano a Sighetu Marmației, il Cimitero
      Allegro di Săpânța, il monastero di Bârsana e lo storico trenino a vapore della valle del Vaser. Calcola
      da due a quattro giorni.
    history: >-
      L'economia locale si fonda sulla selvicoltura e lavorazione del legno, sull'allevamento estensivo e sul
      turismo naturalistico. Il parco affronta pressioni dovute a turismo incontrollato, bracconaggio, pascolo
      abusivo, disboscamento illegale e veicoli fuoristrada, quad e moto che generano disturbo acustico.
    before: Calcola da due a quattro giorni. Il periodo migliore va da maggio a ottobre.
    around: >-
      A due chilometri si trova il [Parco nazionale dei monti Rodna](/lugar/parcul-national-muntii-rodnei/); a
      venticinque chilometri la [Foresta primaria di Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/); e a
      ventisette chilometri la [Foresta primaria di Groșii
      Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/).
  pt:
    intro: >-
      Esta é a fronteira norte da Roménia, e isso reflete-se na paisagem: os Montes de Maramureș formam o
      maciço mais elevado ao longo desse limite, culminando no pico Farcău a mil novecentos e cinquenta e sete
      metros, com a Ucrânia a começar logo adiante. O parque natural ocupa o nordeste do distrito de
      Maramureș, abrangendo os municípios de Borșa e Vișeu de Sus, confinado a leste pelas Obcinele da
      Bucovina, a sul pelos Montes Rodna e pela depressão de Maramureș e a norte pelo maciço de Rakhiv. É um
      vasto relevo montanhoso de florestas, prados, pastagens alpinas, escarpas rochosas e vales, habitado por
      comunidades que ainda preservam pisões tradicionais movidos pela força da água.
    landscape: >-
      A paisagem explica-se pela sua geologia diversificada. Existem formas vulcânicas mesozóicas nos picos
      Farcău e Mihăilecu, relevo glaciar em Pietrosul Maramureșului, Farcău e Mihăilecu, formas periglaciares
      plistocénicas, relevo cárstico calcário na bacia superior do vale de Repedea e nas escarpas de Farcău e
      Mihăilecu, a par de xistos cristalinos. Na sela entre Farcău e Mihăilecu repousa o lago Vinderel, um
      lago glaciar alimentado por uma nascente, pela chuva e pelo degelo nival.


      Nestes solos desenvolvem-se carvalhais, faiais, povoamentos de abeto-falso e matos de pinheiro-raso. O
      clima é continental moderado, predominantemente frio e húmido nas cotas mais elevadas.
    wildlife: >-
      A flora é extraordinariamente rica. Prados e escarpas rochosas abrigam raridades como a edelvaisse
      (*Leontopodium alpinum*), o sapatinho-de-vénus (*Cypripedium calceolus*), *Pedicularis verticillata* e
      *Ligularia sibirica*, além de duas plantas carnívoras: a drósera-de-folhas-redondas, relíquia glaciar, e
      a pinguícula-alpina (*Pinguicula alpina*). A reserva Farcău–Vinderel–Mihăilecu conserva tesouros
      botânicos como o mirtilo e a edelvaisse. Destaca-se também a "lingurea" (*Cochlearia pyrenaica* var.
      *borzaeana*), nome popular de uma planta agarrada às rochas de Sâlhoi–Zâmbroslavele.


      A paisagem transforma-se por volta dos mil e seiscentos metros na vertente direita do pico Tomnatec: na
      clareira de Tomnatec–Sehleanu floresce uma colónia rigorosamente protegida de narcisos (*Narcissus
      radiiflorus*).


      A fauna é a de um grande maciço selvagem. Entre os mamíferos encontram-se o
      [urso-pardo](/especie/ursus_arctos/), o veado-vermelho, o [corço](/especie/capreolus_capreolus/), o
      [lobo-cinzento](/especie/canis_lupus/), o [javali](/especie/sus_scrofa/), o
      [lince-euroasiático](/especie/lynx_lynx/), o visão-europeu e a [lontra-europeia](/especie/lutra_lutra/).
      Entre as aves protegidas destacam-se a [águia-real](/especie/aquila_chrysaetos/), a
      águia-de-asa-redonda, o [tetraz-grande](/especie/tetrao_urogallus/) e o
      [galo-lira](/especie/tetrao_tetrix/); a área de Cornu Nedeii–Ciungii Bălăsinii foi delimitada
      especificamente para resguardar o galo-lira. Os pica-paus estão bem representados com o
      [pica-pau-tridáctilo](/especie/picoides_tridactylus/), o pica-pau-verde, o pica-pau-cinzento, o
      pica-pau-de-dorso-branco e o [pica-pau-preto](/especie/dryocopus_martius/), juntamente com o
      [melro-d'água](/especie/cinclus_cinclus/) e a [cegonha-preta](/especie/ciconia_nigra/).


      Nas ribeiras nadam o [salmão-do-danúbio](/especie/hucho_hucho/), o tímalo e o barbo. Os anfíbios incluem
      a [salamandra-de-pintas-amarelas](/especie/salamandra_salamandra/), o
      [tritão-dos-cárpatos](/especie/triturus_montandoni/) e o bombina-de-ventre-amarelo. Entre os
      invertebrados figuram o [longicórnio-dos-alpes](/especie/rosalia_alpina/) e borboletas raras como
      *Parnassius mnemosyne* e *Lycaena dispar*.


      A melhor época de visita vai de maio a outubro.
    visit: >-
      O parque conta com dezassete percursos pedestres e três trilhos temáticos. O centro de visitantes
      funciona na sede administrativa em Vișeu de Sus. Petrova, Moisei e Borșa constituem as principais portas
      de entrada. Entre os pontos de interesse recomendados estão o pico Farcău, o lago Vinderel, o pico
      Mihăilecu, o vale do Vaser e o prado de narcisos de Tomnatec–Sehleanu. O acesso faz-se pela estrada DN18
      a partir de Baia Mare, passando por Petrova e Leordina até Vișeu de Sus.


      Nas proximidades destacam-se o Museu da Aldeia de Maramureș em Sighetu Marmației, o Cemitério Alegre de
      Săpânța, o Mosteiro de Bârsana e o comboio histórico a vapor do vale do Vaser. Conta com dois a quatro
      dias.
    history: >-
      A economia local assenta na exploração e transformação florestal, na pastorícia extensiva e no turismo
      de natureza. O parque enfrenta pressões decorrentes do turismo desregulado, caça furtiva, pastoreio
      disperso, abate ilegal de madeira e veículos todo-o-terreno, motoquados e motas que causam perturbação
      sonora.
    before: Conta com dois a quatro dias. As melhores épocas vão de maio a outubro.
    around: >-
      A dois quilómetros fica o [Parque Nacional dos Montes Rodna](/lugar/parcul-national-muntii-rodnei/); a
      vinte e cinco quilómetros, a [Floresta Primitiva de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/); e a vinte e sete quilómetros, a [Floresta
      Primitiva de Groșii Țibleșului](/lugar/codrii-seculari-grosii-tiblesului/).
