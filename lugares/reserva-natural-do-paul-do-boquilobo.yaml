resumen:
  es: >-
    La primera Reserva de la Biosfera declarada en Portugal por la UNESCO (1981), protegiendo la mayor colonia
    mixta de ardeídos y garzas de la cuenca del Tajo.
  en: >-
    Inland alluvial wetland and Biosphere Reserve (1981) at the confluence of the Almonda and Tagus rivers,
    sheltering Portugal's largest breeding colony of herons.
  fr: >-
    Zone humide alluviale intérieure et réserve de biosphère (1981) au confluent de l'Almonda et du Tage,
    abritant la plus importante héronnière du Portugal.
  de: >-
    Binnen-Auenfeuchtgebiet und Biosphärenreservat (1981) am Zusammenfluss von Almonda und Tejo mit Portugals
    bedeutendster Reiherbrutkolonie.
  it: >-
    Zona umida alluvionale interna e riserva della biosfera (1981) alla confluenza tra Almonda e Tago, custode
    della maggiore garzettaia del Portogallo.
  pt: >-
    Zona húmida aluvial interior e Reserva da Biosfera (1981) na confluência do Almonda com o Tejo, albergando
    a maior colónia de garças de Portugal.
unico:
  es: >-
    La colonia de garzas con más especies de todo Portugal, escondida en un bosque de sauces entre el Almonda
    y el Tajo.
  en: >-
    Portugal's premier heronry, an inland marsh where hundreds of pairs of five heron species nest together
    each spring.
  fr: >-
    La première héronnière du Portugal, un marais d'eau douce où plusieurs centaines de couples de cinq
    espèces de hérons nichent ensemble chaque printemps.
  de: >-
    Portugals größte Reiherkolonie in einem Süßwassersumpf, wo alljährlich Hunderte Paare von fünf Reiherarten
    gemeinsam brüten.
  it: >-
    La principale garzaia del Portogallo, una palude d'acqua dolce dove centinaia di coppie di cinque specie
    di aironi nidificano assieme ogni primavera.
  pt: >-
    O maior garceiro de Portugal, um paul de água doce onde centenas de casais de cinco espécies de garças
    nidificam em conjunto em cada primavera.
observaciones:
  es: >-
    La zona núcleo es de acceso restringido; la reserva ofrece visitas guiadas a su zona central. Las
    carreteras agrícolas de acceso solo permiten circular entre las siete y las diecinueve horas. La colonia
    de garzas está de febrero o marzo hasta el verano, y el invierno es la mejor época para las anátidas.
texto:
  es:
    intro: >-
      En febrero o marzo llegan las garzas, y el paúl cambia de dueño. Hasta entonces es un humedal tranquilo
      de sauces y canales en la llanura donde el Almonda se echa en el Tajo; de pronto, cada rama de sauce
      soporta un nido. Paúl do Boquilobo es una llanura aluvial de marismas y zonas húmedas, y una colonia de
      garzas que, por número de especies, no tiene rival en Portugal. Es además la primera área portuguesa que
      entró en la Red Mundial de Reservas de la Biosfera, y lo hizo en 1981.
    landscape: >-
      Aquí manda el agua. La reserva natural es el corazón de una reserva de la biosfera de 5.896 hectáreas
      repartidas entre los municipios de Torres Novas y Golegã, y ese corazón, la zona núcleo, es la parte
      mejor protegida: áreas casi siempre inundadas, de acceso restringido, que se destinan a la conservación
      y al estudio científico. Además cumplen un papel práctico, porque controlan las crecidas en invierno y
      guardan agua en verano.


      Una red de canales con plantas acuáticas y sauces estructura el humedal. En las zonas siempre
      encharcadas dominan el carrizo, la espadaña y el lirio amarillo; entre los árboles, los saucedales,
      sobre todo de sauce blanco. La parte más inundada se llama todavía Bunhal, por el bunho (Scirpus
      lacustris), una planta que antaño se usaba mucho en artesanía. Y en un rincón sobrevive un pequeño
      bosque de alcornoque, quejigo, algunas encinas y acebuches: es lo que queda del antiguo bosque
      mediterráneo que ocupaba la región, hoy sustituido casi por completo por cultivos de regadío.


      Se han inventariado diez hábitats de la Directiva Hábitats, cinco de ellos de agua dulce. Entre las
      plantas, 317 especies, con un tesoro discreto: una población de Narcissus fernandesii, endemismo ibérico
      amenazado, el mayor núcleo dentro de un área protegida y el segundo de todo Portugal.
    wildlife: >-
      La colonia es la protagonista. Llega a la reserva en febrero o marzo para nidificar y se queda hasta el
      verano. Aquí crían el [martinete](/especie/nycticorax_nycticorax/), la [garceta
      común](/especie/egretta_garzetta/) y la [garza imperial](/especie/ardea_purpurea/), y la colonia acoge
      también [espátula](/especie/platalea_leucorodia/) y [morito](/especie/plegadis_falcinellus/). Entre las
      aves sedentarias de observación fácil están la [garcilla bueyera](/especie/bubulcus_ibis/), la [garza
      real](/especie/ardea_cinerea/), el [martín pescador](/especie/alcedo_atthis/) y el ánade azulón. Y fue
      precisamente el valor del lugar como sitio de invernada, cría y paso de un número enorme de especies lo
      que llevó a declarar la reserva: unas 200 especies de aves, casi todas acuáticas, encuentran refugio
      aquí.


      El invierno trae a otros. Todos los inviernos aparecen algunos [ánsares comunes](/especie/anser_anser/),
      y el paúl destaca por su variedad de anátidas. La reserva suele acoger a más de la mitad de los
      [porrones europeos](/especie/aythya_ferina/) invernantes de Portugal, con frecuencia más de mil. Entre
      las rapaces de invierno están el [aguilucho lagunero](/especie/circus_aeruginosus/), el [águila
      pescadora](/especie/pandion_haliaetus/) y el elanio azul. En los rastrojos encharcados es fácil ver
      bandos de más de mil avefrías. En los pasos migratorios descansan [aguja
      colinegra](/especie/limosa_limosa/), [combatiente](/especie/philomachus_pugnax/) y zarapito trinador.


      Bajo el agua y entre los carrizos hay más vida: los peces usan la reserva como criadero, con dos
      endemismos lusitanos amenazados, el ruivaco y la boga portuguesa; entre los anfibios, cuatro endemismos
      ibéricos, como el tritón ibérico y el sapo partero ibérico. Destaca el [galápago
      europeo](/especie/emys_orbicularis/), amenazado en Portugal. Y entre los mamíferos, la
      [nutria](/especie/lutra_lutra/) y el turón, ambos ligados al agua.
    visit: >-
      La reserva ofrece visitas guiadas a su zona central, donde se observa la naturaleza y la biodiversidad
      del humedal. Se llega por el camino de la Quinta do Paul o por la carretera de Golegã a Azinhaga.


      Dentro de la reserva natural solo hay un recorrido señalizado, en el corazón del espacio. Fuera, hay más
      opciones. La Rota do Almonda es una ruta a pie de 23 km a lo largo del río Almonda que une el Parque
      Natural das Serras de Aire e Candeeiros con el paúl; se divide en tres tramos, las colinas, la ciudad y
      la vega, es mayormente llana, con buen firme, y se puede hacer en un día o por tramos. También sirve
      para bicicleta de montaña. Y el Camino de Santiago Central Portugués cruza la reserva en su cuarta
      etapa, por Pombalinho y Azinhaga hasta Golegã, entre áreas rurales, agrícolas y la propia reserva. En
      Golegã, la Rota do Cavalo e do Ribatejo reúne cinco circuitos temáticos que se hacen a pie, en
      bicicleta, en coche o a caballo.
    history: >-
      El lugar tiene pasado señorial: el señorío de Boquilobo perteneció al infante don Enrique y después a
      Fernando de Castro y a sus descendientes. Desde 1981 la UNESCO lo considera reserva de la biosfera; en
      1996 se reconoció como zona húmeda de importancia internacional según el Convenio de Ramsar, y desde
      1999, por su importancia para la avifauna, es también Zona de Protección Especial.


      La conservación aquí tiene enemigos concretos. Los peces autóctonos están amenazados por especies
      exóticas como la carpa, introducida en la Edad Media, y el alburno o el siluro; y las poblaciones de
      anfibios cayeron con la llegada del cangrejo rojo americano.
    before: >-
      La zona núcleo es de acceso restringido; la reserva ofrece visitas guiadas a su zona central. Las
      carreteras agrícolas de acceso solo permiten circular entre las siete y las diecinueve horas. La colonia
      de garzas está de febrero o marzo hasta el verano, y el invierno es la mejor época para las anátidas.
    around: >-
      No hay otros lugares del atlas cerca. Lejos de aquí, comparten garceta común el [Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/), y la cigüeña blanca el
      [Spreewald](/lugar/biospharenreservat-spreewald/), los [Aiguamolls de
      l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/) y [Lonjsko
      Polje](/lugar/park-prirode-lonjsko-polje/).
  en:
    intro: >-
      Where the Almonda River joins the Tagus, in an alluvial depression flooded by winter overflows, lies a
      wetland whose life changes with the seasons. It is Paul do Boquilobo, between Golegã and Torres Novas in
      the heart of Ribatejo: a shallow freshwater marsh, willow groves and reedbeds that in spring become the
      undisputed realm of herons. It is a nature reserve and, since 1981, Portugal's very first UNESCO
      Biosphere Reserve.
    landscape: >-
      The marsh spreads across a sunken depression where the Almonda meets the Tagus. Its water level rises
      and falls with winter river spates and seasonal rainfall. The reserve covers roughly 589.6 hectares,
      expanded by its buffer zone to several thousand hectares of fertile floodplain. At its core lies the
      Paul proper, a freshwater marsh of varying depth.


      Vegetation mirrors soil moisture. Open water carries water-crowfoot and pondweeds; edges are fringed by
      vast reedbeds of *Phragmites australis* and tall bulrushes (*Schoenoplectus lacustris*), historically
      harvested for basketry. In one corner survives a relict Mediterranean grove of cork oak, Portuguese oak,
      holm oak and wild olive—the last remnant of primeval woodland that once mantled the basin, now largely
      supplanted by irrigated crops.


      Ten Annex I habitats are inventoried, five of freshwater type. Flora counts 317 species, including a
      discrete botanical treasure: a population of *Narcissus fernandesii*, a threatened Iberian endemic,
      representing the largest stand in any protected area and the second largest in all Portugal.
    wildlife: >-
      The heronry is the undisputed star. It gathers in the reserve in February or March to breed and stays
      until summer. Here nest the [black-crowned night heron](/especie/nycticorax_nycticorax/), [little
      egret](/especie/egretta_garzetta/) and [purple heron](/especie/ardea_purpurea/), alongside nesting
      [Eurasian spoonbills](/especie/platalea_leucorodia/) and [glossy
      ibises](/especie/plegadis_falcinellus/). Sedentary species easily observed include [western cattle
      egret](/especie/bubulcus_ibis/), [grey heron](/especie/ardea_cinerea/), [common
      kingfisher](/especie/alcedo_atthis/) and mallard. The extraordinary value as a wintering, breeding and
      stopover hub led to its reserve designation: some 200 bird species find refuge here.


      Winter brings a different cast. [Greylag geese](/especie/anser_anser/) appear every winter, and the
      marsh stands out for duck diversity. The reserve regularly shelters more than half of all wintering
      [common pochards](/especie/aythya_ferina/) in Portugal, often exceeding a thousand birds. Winter raptors
      include [western marsh harrier](/especie/circus_aeruginosus/), [osprey](/especie/pandion_haliaetus/) and
      black-winged kite. Wet stubble fields host flocks of over a thousand lapwings. Migration passages bring
      [black-tailed godwits](/especie/limosa_limosa/), [ruffs](/especie/philomachus_pugnax/) and whimbrels.


      Aquatic life is equally rich: native fish use the marsh as a nursery, including two threatened
      Lusitanian endemics, the ruivaco and Portuguese boga; amphibians count four Iberian endemics. The
      [European pond turtle](/especie/emys_orbicularis/) is present, threatened in Portugal. Mammals include
      the [Eurasian otter](/especie/lutra_lutra/) and European polecat.
    visit: >-
      The reserve offers guided visits to its core zone to observe wetland biodiversity. It is reached via the
      Quinta do Paul track or from the Golegã–Azinhaga road.


      Inside the nature reserve there is only one marked interpretive trail, in the heart of the wetland.
      Outside, more routes exist. The Rota do Almonda is a 23 km walking trail along the Almonda River
      connecting Serras de Aire e Candeeiros Natural Park to the marsh; divided into three legs (hills, town
      and floodplain), it is mostly flat and walkable in a day or in sections, also suitable for mountain
      bikes. The Portuguese Central Way of Saint James crosses the reserve on its fourth stage, from
      Pombalinho and Azinhaga to Golegã. In Golegã, the Rota do Cavalo e do Ribatejo offers five themed
      equestrian, cycling, driving and walking circuits.
    history: >-
      The site has a noble past: the manor of Boquilobo belonged to Prince Henry the Navigator and later to
      Fernando de Castro and his descendants. In 1981 UNESCO declared it a Biosphere Reserve; in 1996 it was
      recognized as a Ramsar Wetland of International Importance, and since 1999 it has been a Special
      Protection Area.


      Conservation faces concrete threats: native fish suffer from invasive carp introduced in the Middle
      Ages, bleak and wels catfish, while amphibian populations declined with the arrival of the red swamp
      crayfish.
    before: >-
      The core reserve is strictly restricted; the reserve authority organizes guided visits to its central
      sector. Agricultural access roads permit transit only between seven in the morning and nineteen in the
      evening. The heron colony is present from February or March through summer, and winter provides the best
      waterfowl viewing.
    around: >-
      There are no catalogued neighbours close by in the atlas. Farther afield, [Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/) shares the little egret, while the white stork
      is shared with the [Spreewald](/lugar/biospharenreservat-spreewald/), [Aiguamolls de
      l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/) and [Lonjsko
      Polje](/lugar/park-prirode-lonjsko-polje/).
  fr:
    intro: >-
      Au confluent de l'Almonda et du Tage, dans une cuvette alluviale inondée par les crues d'hiver, s'étend
      une zone humide rythmée par les saisons. C'est le Paul do Boquilobo, entre Golegã et Torres Novas au
      cœur du Ribatejo : un marais d'eau douce peu profond, des saulaies et des roselières qui deviennent au
      printemps le royaume des hérons. C'est une réserve naturelle et, depuis 1981, la toute première réserve
      de biosphère de l'UNESCO au Portugal.
    landscape: >-
      Le marais occupe une dépression alluviale où l'Almonda rejoint le Tage. Son plan d'eau monte et descend
      au gré des crues et des pluies. La réserve couvre environ 589,6 hectares, élargie par sa zone tampon à
      plusieurs milliers d'hectares de plaine fertile. Au centre s'étend le Paul proprement dit, lagune d'eau
      douce de profondeur variable.


      La flore traduit le gradient d'humidité. Les eaux libres portent renoncules et potamots ; les rives sont
      bordées de roselières à *Phragmites australis* et de massettes (*Schoenoplectus lacustris*), jadis
      exploitées en vannerie. Dans un recoin subsiste un bosquet méditerranéen de chêne-liège, chêne faginé,
      chêne vert et olivier sauvage—vestige de la forêt originelle remplacée par les cultures irriguées.


      Dix habitats de la directive Habitats sont recensés, dont cinq d'eau douce. La flore compte 317 espèces,
      avec un trésor botanique : une population de *Narcissus fernandesii*, narcisse endémique ibérique
      menacé, formant la plus grande station en zone protégée et la deuxième de tout le Portugal.
    wildlife: >-
      La colonie de hérons est l'élément phare. Elle s'installe en février ou mars pour nidifier jusqu'à
      l'été. Y nichent le [bihoreau gris](/especie/nycticorax_nycticorax/), l'[aigrette
      garzette](/especie/egretta_garzetta/) et le [héron pourpré](/especie/ardea_purpurea/), rejoints par la
      [spatule blanche](/especie/platalea_leucorodia/) et l'[ibis falcinelle](/especie/plegadis_falcinellus/).
      Les sédentaires aisés à voir comptent le [héron garde-boeufs](/especie/bubulcus_ibis/), le [héron
      cendré](/especie/ardea_cinerea/), le [martin-pêcheur d'Europe](/especie/alcedo_atthis/) et le canard
      colvert. Sa richesse pour l'hivernage, la reproduction et la halte migratoire a justifié la réserve :
      environ 200 espèces d'oiseaux y trouvent asile.


      L'hiver amène d'autres hôtes. Des [oies cendrées](/especie/anser_anser/) apparaissent chaque hiver, et
      le paul brille par ses canards. La réserve héberge plus de la moitié des [fuligules
      milouins](/especie/aythya_ferina/) hivernants du Portugal, dépassant souvent le millier. Les rapaces
      hivernaux comptent le [busard des roseaux](/especie/circus_aeruginosus/), le [balbuzard
      pêcheur](/especie/pandion_haliaetus/) et l'élanion blanc. Sur les chaumes inondés s'observent des vols
      de vanneaux. Aux passages transitent [barge à queue noire](/especie/limosa_limosa/), [combattant
      varié](/especie/philomachus_pugnax/) et courlis corlieu.


      Les eaux recèlent une riche ichtyofaune avec deux poissons endémiques lusitaniens menacés, le ruivaco et
      la boga portugaise ; les amphibiens comptent quatre endémiques ibériques. À noter la [cistude
      d'Europe](/especie/emys_orbicularis/), menacée au Portugal. Parmi les mammifères figurent la [loutre
      d'Europe](/especie/lutra_lutra/) et le putois.
    visit: >-
      La réserve propose des visites guidées dans sa zone centrale pour découvrir la biodiversité du marais.
      L'accès s'effectue par la Quinta do Paul ou par la route de Golegã à Azinhaga.


      L'intérieur de la réserve ne compte qu'un seul sentier balisé. À l'extérieur, la Rota do Almonda est un
      chemin pédestre de 23 km le long de l'Almonda reliant les Serras de Aire e Candeeiros au marais ; divisé
      en trois tronçons plats, il se fait à pied ou à VTT. Le chemin portugais de Saint-Jacques traverse la
      réserve dans sa quatrième étape via Pombalinho et Azinhaga jusqu'à Golegã. À Golegã, la Rota do Cavalo
      réunit cinq circuits à faire à pied, à vélo, en voiture ou à cheval.
    history: >-
      Le domaine possède des origines nobles : la seigneurie de Boquilobo appartint à l'infant Henri le
      Navigateur puis à Fernando de Castro. En 1981, l'UNESCO l'a classé réserve de biosphère ; en 1996 le
      site est reconnu zone humide Ramsar, et depuis 1999 il constitue une Zone de Protection Spéciale.


      La faune indigène fait face à des menaces : la carpe, introduite au Moyen Âge, l'ablette et le silure
      concurrencent les poissons locaux, tandis que les amphibiens ont souffert de l'arrivée de l'écrevisse de
      Louisiane.
    before: >-
      La zone centrale est d'accès restreint ; la réserve y organise des visites guidées. Les chemins
      agricoles d'accès ne sont ouverts à la circulation qu'entre sept et dix-neuf heures. La héronnière est
      active de février ou mars à l'été, et l'hiver est idéal pour les canards.
    around: >-
      Aucun site du guide n'est proche. Plus loin, [Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/) partage l'aigrette garzette, et la cigogne
      blanche est partagée avec le [Spreewald](/lugar/biospharenreservat-spreewald/), les [Aiguamolls de
      l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/) et [Lonjsko
      Polje](/lugar/park-prirode-lonjsko-polje/).
  de:
    intro: >-
      Am Zusammenfluss des Almonda mit dem Tejo, in einer von winterlichen Überschwemmungen geformten Aue,
      erstreckt sich ein Feuchtgebiet im Wandel der Jahreszeiten. Es ist der Paul do Boquilobo zwischen Golegã
      und Torres Novas im Ribatejo: ein flacher Süßwassersumpf mit Weidengebüschen und Schilfröhrichten, der
      sich im Frühling in das Reich der Reiher verwandelt. Es ist ein Naturreservat und seit 1981 Portugals
      allererstes UNESCO-Biosphärenreservat.
    landscape: >-
      Der Sumpf füllt eine Senke am Zusammenfluss von Almonda und Tejo aus. Sein Wasserstand schwankt mit
      Winterhochwassern und Regenfällen. Das Schutzgebiet umfasst rund 589,6 Hektar, erweitert durch seine
      Pufferzone auf fruchtbares Schwemmland. Den Kern bildet der eigentliche Paul, ein Süßwasserfeuchtgebiet
      wechselnder Tiefe.


      Die Pflanzenwelt spiegelt den Wasserhaushalt wider. Offenes Wasser trägt Laichkräuter; die Ränder säumen
      dichte Schilfbestände aus *Phragmites australis* und Teichbinsen (*Schoenoplectus lacustris*), die
      früher für Flechtarbeiten genutzt wurden. In einem Winkel überdauert ein mediterraner Restwald aus
      Korkeiche, Portugiesischer Eiche, Steineiche und wildem Ölbaum—Überbleibsel der Urwälder vor Einführung
      von Bewässerungskulturen.


      Zehn FFH-Lebensraumtypen sind erfasst, fünf davon im Süßwasser. Die Flora zählt 317 Arten, darunter ein
      floristischer Schatz: ein Vorkommen von *Narcissus fernandesii*, einer bedrohten iberischen
      Narzissenart, die hier ihren größten geschützten Bestand in ganz Portugal besitzt.
    wildlife: >-
      Die Reiherkolonie steht im Mittelpunkt. Sie trifft im Februar oder März zur Brut ein und bleibt bis zum
      Sommer. Hier nisten [Nachtreiher](/especie/nycticorax_nycticorax/),
      [Seidenreiher](/especie/egretta_garzetta/) und [Purpurreiher](/especie/ardea_purpurea/),
      vergesellschaftet mit [Löffler](/especie/platalea_leucorodia/) und [Brauner
      Sichler](/especie/plegadis_falcinellus/). Standvögel umfassen [Kuhreiher](/especie/bubulcus_ibis/),
      [Graureiher](/especie/ardea_cinerea/), [Eisvogel](/especie/alcedo_atthis/) und Stockente. Rund 200
      Vogelarten finden in der Aue Zuflucht.


      Im Winter rasten [Graugänse](/especie/anser_anser/), und das Gebiet besticht durch Entenvielfalt. Das
      Reservat beherbergt regelmäßig über die Hälfte aller überwinternden
      [Tafelenten](/especie/aythya_ferina/) Portugals, oft über tausend Vögel. Wintergreifvögel sind
      [Rohrweihe](/especie/circus_aeruginosus/), [Fischadler](/especie/pandion_haliaetus/) und Gleitaar. Auf
      Feuchtwiesen rasten Kiebitztrupps. Auf dem Durchzug rasten [Uferschnepfe](/especie/limosa_limosa/),
      [Kampfläufer](/especie/philomachus_pugnax/) und Regenbrachvogel.


      Unter Wasser leben zwei bedrohte endemische Fischarten, Ruivaco und Portugiesische Boga; die
      Amphibienfauna zählt vier iberische Endemiten. Wichtig ist die [Europäische
      Sumpfschildkröte](/especie/emys_orbicularis/). Zu den Säugetieren gehören [Eurasischer
      Fischotter](/especie/lutra_lutra/) und Iltis.
    visit: >-
      Das Reservat bietet geführte Touren in die Kernzone zur Erkundung der Auen-Biodiversität an. Die Anfahrt
      erfolgt über die Quinta do Paul oder die Straße von Golegã nach Azinhaga.


      Im Inneren gibt es einen einzigen markierten Lehrpfad. Außerhalb verläuft die Rota do Almonda als 23 km
      langer Wanderweg entlang des Flusses Almonda vom Naturpark Serras de Aire e Candeeiros zum Sumpf; in
      drei flache Abschnitte unterteilt, ist er zu Fuß oder per Mountainbike machbar. Der portugiesische
      Jakobsweg quert das Gebiet auf seiner vierten Etappe über Pombalinho und Azinhaga nach Golegã. In Golegã
      bietet die Rota do Cavalo fünf Themenwege zu Fuß, per Rad, Auto oder Pferd.
    history: >-
      Der Ort blickt auf feudale Wurzeln zurück: Das Gut Boquilobo gehörte Heinrich dem Seefahrer und später
      Fernando de Castro. 1981 erklärte die UNESCO das Gebiet zum Biosphärenreservat; 1996 folgte die
      Anerkennung als Ramsar-Gebiet und seit 1999 ist es Europäisches Vogelschutzgebiet.


      Der Naturschutz begegnet Problemen: Fremdarten wie der im Mittelalter eingeführte Karpfen, Ukelei und
      Wels bedrängen heimische Fische, während der Rote Amerikanische Sumpfkrebs Amphibien dezimierte.
    before: >-
      Die Kernzone ist zugangsbeschränkt; Führungen werden durch die Schutzgebietsverwaltung angeboten. Die
      landwirtschaftlichen Zufahrtswege sind nur zwischen sieben und neunzehn Uhr befahrbar. Die Reiherkolonie
      weilt von Februar/März bis zum Sommer; der Winter eignet sich bestens für Enten.
    around: >-
      In direkter Nachbarschaft gibt es keine Gebiete im Atlas. Entfernt teilt [Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/) den Seidenreiher, während der Weißstorch mit dem
      [Spreewald](/lugar/biospharenreservat-spreewald/), den [Aiguamolls de
      l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/) und [Lonjsko
      Polje](/lugar/park-prirode-lonjsko-polje/) geteilt wird.
  it:
    intro: >-
      Alla confluenza del fiume Almonda con il Tago, in una conca alluvionale inondata dalle piene invernali,
      sorge una zona umida palpitante di vita stagionale. È il Paul do Boquilobo, tra Golegã e Torres Novas
      nel cuore del Ribatejo: una palude d'acqua dolce poco profonda, saliceti e canneti che in primavera
      diventano il regno indiscusso degli aironi. È riserva naturale e, dal 1981, la prima riserva della
      biosfera UNESCO del Portogallo.
    landscape: >-
      La palude occupa una depressione golenale dove l'Almonda confluisce nel Tago. Il livello idrico sale e
      scende con le morbide invernali e le piogge. La riserva tutela circa 589,6 ettari, ampliati dalla fascia
      cuscinetto a migliaia di ettari golenali. Al centro giace il Paul vero e proprio, bacino palustre di
      profondità mutevole.


      La flora segue il gradiente idrico. Nelle acque aperte allignano ranuncoli e brasche; le sponde sono
      cinte da canneti di *Phragmites australis* e tife (*Schoenoplectus lacustris*), storicamente impiegate
      per ceste e stuoie. In un angolo resiste un boschetto relitto di sughera, farnia portoghese, leccio e
      olivastro—testimonianza dell'antica copertura vegetale precedente all'agricoltura irrigua.


      Sono censiti dieci habitat di interesse comunitario, cinque dei quali acquatici. La flora annovera 317
      specie, tra cui una gemma botanica: una popolazione di *Narcissus fernandesii*, narciso endemico iberico
      minacciato, che qui vanta il nucleo più cospicuo in area protetta di tutto il Portogallo.
    wildlife: >-
      La garzaia è la protagonista indiscussa. Giunge nella riserva a febbraio o marzo per nidificare e vi
      rimane fino all'estate. Vi nidificano la [nitticora](/especie/nycticorax_nycticorax/), la
      [garzetta](/especie/egretta_garzetta/) e l'[airone rosso](/especie/ardea_purpurea/), affiancati da
      [spatola](/especie/platalea_leucorodia/) e [mignattaio](/especie/plegadis_falcinellus/). Tra gli
      stanziali spiccano [airone guardabuoi](/especie/bubulcus_ibis/), [airone
      cenerino](/especie/ardea_cinerea/), [martin pescatore](/especie/alcedo_atthis/) e germano reale. Circa
      200 specie di uccelli trovano rifugio nel comprensorio.


      L'inverno richiama altri contingenti. Le [oche selvatiche](/especie/anser_anser/) compaiono a ogni
      stagione fredda, e la palude eccelle per varietà di anatre. La riserva ospita regolarmente oltre la metà
      di tutti i [moriglioni](/especie/aythya_ferina/) svernanti in Portogallo, spesso oltre mille individui.
      I rapaci invernali annoverano [falco di palude](/especie/circus_aeruginosus/), [falco
      pescatore](/especie/pandion_haliaetus/) e nibbio bianco. Sui campi allagati pascolano pavoncelle. Nei
      passi sostano [pittima reale](/especie/limosa_limosa/), [combattente](/especie/philomachus_pugnax/) e
      chiurlo piccolo.


      Nelle acque vivono due pesci endemici lusitanici a rischio, il ruivaco e la boga portoghese; gli anfibi
      contano quattro endemismi iberici. Rilevante la [testuggine palustre
      europea](/especie/emys_orbicularis/). Tra i mammiferi compaiono la [lontra
      europea](/especie/lutra_lutra/) e la puzzola.
    visit: >-
      La riserva propone escursioni guidate nella zona centrale per svelare la biodiversità palustre.
      L'accesso avviene dalla Quinta do Paul o dalla strada da Golegã ad Azinhaga.


      All'interno dell'area protetta esiste un solo sentiero tracciato nel cuore del canneto. All'esterno, la
      Rota do Almonda è un cammino di 23 km lungo il fiume che collega il Parco Naturale di Aire e Candeeiros
      alla palude; ripartito in tre frazioni pianeggianti, si percorre a piedi o in mountain bike. Il Cammino
      Portoghese di Santiago attraversa la riserva nella quarta tappa da Pombalinho e Azinhaga a Golegã. A
      Golegã, la Rota do Cavalo propone cinque anelli da percorrere a piedi, in bici, auto o a cavallo.
    history: >-
      Il territorio vanta trascorsi signorili: il feudo di Boquilobo appartenne all'infante Enrico il
      Navigatore e poi a Fernando de Castro. Nel 1981 l'UNESCO lo ha dichiarato riserva della biosfera; nel
      1996 è divenuto zona umida Ramsar e dal 1999 è Zona di Protezione Speciale.


      La salvaguardia affronta criticità: specie aliene come la carpa, introdotta nel Medioevo, l'alborella e
      il siluro insidiano l'ittiofauna autoctona, mentre gli anfibi hanno subito l'impatto del gambero rosso
      della Louisiana.
    before: >-
      La zona cuscinetto interna è ad accesso regolamentato; la riserva organizza visite guidate nel settore
      centrale. Le strade vicinali di accesso sono transitabili unicamente tra le sette e le diciannove. La
      garzaia è attiva da febbraio-marzo all'estate; l'inverno è la stagione d'oro per gli anatidi.
    around: >-
      Non vi sono siti catalogati nelle vicinanze. A distanza, [Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/) condivide la garzetta, mentre la cicogna bianca
      è presente nello [Spreewald](/lugar/biospharenreservat-spreewald/), negli [Aiguamolls de
      l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/) e a [Lonjsko
      Polje](/lugar/park-prirode-lonjsko-polje/).
  pt:
    intro: >-
      Na confluência do rio Almonda com o Tejo, numa depressão aluvial inundada pelos transbordos do inverno,
      estende-se uma zona húmida cuja vida pulsa com as estações. É o Paul do Boquilobo, entre a Golegã e
      Torres Novas no coração do Ribatejo: um paul de água doce pouco profundo, salgueirais e caniçais que na
      primavera se convertem no reino das garças. É reserva natural e, desde 1981, a primeiríssima Reserva da
      Biosfera da UNESCO em Portugal.
    landscape: >-
      O paul espraia-se numa bacia deprimida onde o Almonda desagua no Tejo. O plano de água eleva-se e recua
      ao ritmo das cheias e das chuvas. A reserva abrange cerca de 589,6 hectares, ampliada pela sua zona
      tampão a milhares de hectares de lezíria fértil. No coração reside o Paul propriamente dito, lagoa doce
      de profundidade variável.


      A flora espelha a humidade do solo. As águas livres acolhem ranúnculos e espadanas; as margens são
      orladas por densos caniçais de *Phragmites australis* e bunho (*Schoenoplectus lacustris*), outrora
      colhido para cestaria. Num recanto resiste um montado relíquia de sobreiro, carvalho-cerquinho,
      azinheira e zambujeiro—testemunho da floresta que antecedeu os regadios.


      Estão inventariados dez habitats da Diretiva Habitats, cinco dos quais de água doce. A flora soma 317
      espécies, com um tesouro vegetal: uma população de *Narcissus fernandesii*, narciso endémico ibérico
      ameaçado, que aqui reúne o maior núcleo em área protegida e o segundo maior de Portugal.
    wildlife: >-
      O garceiro é o protagonista incontestado. Concentra-se na reserva em fevereiro ou março para procriar e
      permanece até ao verão. Aqui nidificam o [savacu](/especie/nycticorax_nycticorax/), a
      [garcinha-branca](/especie/egretta_garzetta/) e a [garça-vermelha](/especie/ardea_purpurea/), associados
      ao [colhereiro-europeu](/especie/platalea_leucorodia/) e ao
      [íbis-preto](/especie/plegadis_falcinellus/). Entre as aves sedentárias avistam-se a
      [garça-boieira](/especie/bubulcus_ibis/), a [garça-real-europeia](/especie/ardea_cinerea/), o
      [guarda-rios-comum](/especie/alcedo_atthis/) e o pato-real. Cerca de 200 espécies de aves procuram
      refúgio no paul.


      O inverno convoca outros bandos. O [ganso-comum](/especie/anser_anser/) ocorre todos os anos, e a
      reserva destaca-se pela abundância de patos. Alberga habitualmente mais de metade dos
      [zarros-comuns](/especie/aythya_ferina/) invernantes em Portugal, superando amiúde o milhar. As rapinas
      invernantes incluem o [tartaranhão-dos-pauis](/especie/circus_aeruginosus/), a [águia
      pescadora](/especie/pandion_haliaetus/) e o bútio-vespeiro. Nos restolhos inundados descansam bandos de
      abibes. Na passagem migram [milherangos](/especie/limosa_limosa/),
      [combatentes](/especie/philomachus_pugnax/) e maçaricos-galegos.


      As águas abrigam maternidades de peixes com dois endemismos lusitanos vulneráveis, o ruivaco e a
      boga-portuguesa; nos anfíbios contam-se quatro endemismos ibéricos. Notável é o
      [cágado-de-carapaça-estriada](/especie/emys_orbicularis/). Entre os mamíferos ocorrem a
      [lontra-europeia](/especie/lutra_lutra/) e o tourão.
    visit: >-
      A reserva proporciona visitas guiadas à sua zona central para interpretação da biodiversidade aquática.
      O acesso faz-se pelo caminho da Quinta do Paul ou pela estrada da Golegã à Azinhaga.


      No interior da reserva existe apenas um percurso pedestre sinalizado. No exterior, a Rota do Almonda é
      um trilho pedestre de 23 km ao longo do rio Almonda ligando o Parque Natural das Serras de Aire e
      Candeeiros ao paul; dividida em três troços planos, cumpre-se a pé ou em BTT. O Caminho Central
      Português de Santiago cruza a reserva na sua quarta etapa por Pombalinho e Azinhaga até à Golegã. Na
      Golegã, a Rota do Cavalo propõe cinco circuitos temáticos para percorrer a pé, de bicicleta, carro ou a
      cavalo.
    history: >-
      O paul ostenta origens senhoriais: o senhorio de Boquilobo pertenceu ao infante D. Henrique e mais tarde
      a D. Fernando de Castro. Em 1981 a UNESCO classificou-o como Reserva da Biosfera; em 1996 foi consagrado
      sítio Ramsar e desde 1999 é Zona de Proteção Especial.


      A conservação enfrenta espécies invasoras: a carpa, introduzida na Idade Média, o alburno e o siluro
      competem com os peixes nativos, ao passo que os anfíbios sofreram com a proliferação do
      lagostim-vermelho-da-luisiana.
    before: >-
      A zona nuclear tem acesso condicionado; a reserva promove visitas acompanhadas ao setor central. As
      estradas agrícolas de acesso só admitem circulação entre as sete e as dezanove horas. A colónia de
      garças está presente de fevereiro ou março até ao verão, sendo o inverno a melhor época para os patos.
    around: >-
      Não há outros locais catalogados nas imediações no atlas. À distância, [Obedska
      Bara](/lugar/specijalni-rezervat-prirode-obedska-bara/) partilha a garcinha-branca, enquanto a
      cegonha-branca é comum ao [Spreewald](/lugar/biospharenreservat-spreewald/), aos [Aiguamolls de
      l'Empordà](/lugar/parc-natural-dels-aiguamolls-de-l-emporda/) e a [Lonjsko
      Polje](/lugar/park-prirode-lonjsko-polje/).
