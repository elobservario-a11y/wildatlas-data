resumen:
  es: >-
    Hayedos viejos con madera muerta y terrenos de antiguo uso militar donde el bosque vuelve a crecer, en
    Turingia.
  en: >-
    Ancient beechwoods rich in deadwood and former military training grounds where woodland regenerates, in
    Thuringia.
  fr: Vieilles hêtraies riches en bois mort et anciens terrains militaires où la forêt se régénère, en Thuringe.
  de: Uralte Buchenwälder mit Totholz und ehemalige Militärflächen im Wiederbewaldungsprozess in Thüringen.
  it: Faggete vetuste ricche di legno morto e antiche aree militari in fase di rinaturalizzazione, in Turingia.
  pt: >-
    Faganais vetustos ricos em madeira morta e antigos terrenos de manobras militares em regeneração
    florestal, na Turíngia.
unico:
  es: >-
    Aquí puedes comparar en una misma jornada hayedos viejos llenos de madera muerta con terrenos donde el
    bosque vuelve a crecer entre espacios abiertos.
  en: >-
    Here you can contrast in a single day ancient beechwoods teeming with deadwood against open ground where
    the forest naturally reclaims the land.
  fr: >-
    Ici vous pouvez comparer en une même journée des hêtraies anciennes gorgées de bois mort et des clairières
    où la forêt reprend ses droits.
  de: >-
    Hier kannst du an einem einzigen Tag totholzreiche alte Buchenwälder mit offenen Sukzessionsflächen
    vergleichen, auf denen der Wald neu entsteht.
  it: >-
    Qui puoi mettere a confronto in un solo giorno faggete secolari ricolme di necromassa e radure dove la
    foresta rinasce spontaneamente.
  pt: >-
    Aqui podes comparar num único dia florestas antigas de faia cheias de madeira morta e clareiras onde o
    arvoredo renasce em livre dinâmica.
observaciones:
  es: >-
    Quédate en los caminos señalizados y lleva al perro con correa. Presta atención al viento y a la caída de
    ramas. Los puntos de información UBiS, Harsberg, Hütscheroda y Thiemsburg tienen exposiciones, mapas y
    rangers; Harsberg cierra de noviembre a marzo. En la UBiS hay aseos accesibles y se presta una silla de
    senderismo con reserva previa, y tanto Harsberg como Hütscheroda están entre los puntos que el gestor
    declara accesibles. El parque ofrece un mapa interactivo con aparcamientos y paradas de autobús y tren;
    comprueba también las conexiones de regreso.
texto:
  es:
    intro: >-
      Un bosque que se deja envejecer. En el oeste de Turingia, en el triángulo que forman Eisenach,
      Mühlhausen y Bad Langensalza, el Parque Nacional Hainich ocupa el sur de un macizo mayor y protege
      hayedos viejos donde los árboles nacen, crecen, caen y se pudren sin que nadie los corte. Parte de esos
      bosques forma el componente patrimonial protegido por la UNESCO. Y lo que se ve al recorrerlos es, sobre
      todo, cómo cambia un bosque cuando se le permite seguir su camino.
    landscape: >-
      La explicación empieza bajo tus pies. El sustrato son sedimentos del Muschelkalk superior, y encima, la
      meteorización, la erosión y las acumulaciones de loess han modelado la superficie actual. El suelo más
      común del parque es la rendzina, somero y rico en carbonatos. Las laderas occidentales, las que bajan
      hacia el valle del Werra, son más abruptas que las orientales.


      Sobre ese suelo manda el haya, pero no está sola: el bosque de frondosas incluye fresnos, arces, tilos y
      el raro sorbo silvestre. El núcleo patrimonial reúne los hayedos viejos más próximos al estado natural.
      En ellos, los troncos caídos y los que siguen muertos en pie están colonizados por hongos yesqueros y
      llenos de vida. No es desorden: es el bosque funcionando.


      Otros sectores cuentan la historia contraria. En el sur, parte del bosque se taló a comienzos de la
      década de 1980 para el campo de maniobras militar, y después quedó sin explotación forestal. Lo que
      crece allí ahora son árboles jóvenes, con abedules y álamos temblones, que suelen ser los primeros en
      colonizar los terrenos reforestados. Un bosque viejo y otro naciente, uno junto a otro: la edad es parte
      del paisaje.
    wildlife: >-
      El Hainich se sitúa en la transición entre los climas oceánico y continental, y el año se nota en el
      suelo. En primavera, antes de que el follaje se cierre, el suelo se cubre de flores: campanillas,
      hepáticas y anémonas del bosque. A comienzos del verano llega el olor del ajo de oso, que acompaña el
      recorrido del Welterbepfad; entre las plantas del sotobosque estudiado, el ajo de oso y la anémona del
      bosque son las que dominan.


      La fauna más escurridiza es la que da nombre a un sendero. El [gato montés](/especie/felis_silvestris/)
      es uno de los mamíferos destacados del parque, y verlo en libertad es difícil. Hay otros motivos para
      mirar con atención: se citan 15 especies de murciélagos, siete de pájaros carpinteros y más de 500 de
      escarabajos que viven en la madera. Y en la zona abierta de Kindel, con algo de suerte, se pueden ver
      [corzos](/especie/capreolus_capreolus/), [jabalíes](/especie/sus_scrofa/) y
      [ciervos](/especie/cervus_elaphus/). En verano, ese tramo se llena de flores y de mariposas; en sus
      setos densos crían el alcaudón dorsirrojo y el alcaudón real. El pastoreo extensivo mantiene allí a la
      rana de vientre amarillo y a la mariposa doncella de ondas rojas.
    visit: >-
      Para entender el parque antes de pisarlo, el Nationalparkzentrum de Thiemsburg reúne películas, grandes
      paneles y estaciones interactivas. Los rangers responden preguntas y orientan la visita, y el edificio
      es accesible. Junto a él está la pasarela de las copas arbóreas, el Baumkronenpfad, que tiene afluencia
      media. Thiemsburg y el Wildkatzendorf de Hütscheroda se alcanzan directamente en transporte público.


      Para pasar el día entre árboles, el Welterbepfad recorre 9,5 kilómetros desde el aparcamiento Craulaer
      Kreuz, junto a Craula, con una escalera de cien peldaños y dificultad media. En su recorrido hay madera
      muerta, en pie y caída, poblada de hongos yesqueros.


      Si lo tuyo es el gato montés, el Wildkatzenpfad mide 7 kilómetros y cruza un paisaje variado dentro y
      alrededor del parque. En Hütscheroda, la Wildkatzenscheune ofrece una exposición sobre el gato montés,
      el [lince](/especie/lynx_lynx/) y la iniciativa Rettungsnetz Wildkatze, y en el claro Wildkatzenlichtung
      se pueden ver cuatro gatos en un recinto de exhibición. Más corto y fácil es el Wildkatzenschleichpfad,
      de 2 kilómetros, que sale de ese mismo claro y atraviesa bosque denso y zonas abiertas, con robles
      viejos y madera muerta.


      Otros puntos de información amplían la visita. Harsberg, cerca de Lauterbach, enseña la fauna con
      animales naturalizados, paneles y juegos, y abre a diario de abril a octubre. En el borde norte, junto a
      Kammerforst, la UBiS es una estación de investigación para niños y jóvenes en una antigua instalación
      militar. Presta visores de realidad virtual con los que explorar los componentes alemanes del patrimonio
      mundial de hayedos, y desde ella parten el Germanischer Kultpfad de 2 kilómetros, que reproduce
      santuarios hallados en las excavaciones de Niederdorla, y la ruta Hünenteich de 5,5 kilómetros.
    history: >-
      El parque se declaró el 31 de diciembre de 1997. Su plan busca mantener los procesos naturales en el
      bosque, sin explotarlo, y cuenta también con un documento detallado para cuidar las valiosas superficies
      abiertas.


      No todo es calma. El DLR registra en Hainich copas muertas, follaje débil y hojas menos desarrolladas
      asociados a las sequías recientes. Los árboles viejos forman parte de la dinámica natural del parque,
      también cuando sufren.
    before: >-
      Quédate en los caminos señalizados y lleva al perro con correa. Presta atención al viento y a la caída
      de ramas. Los puntos de información UBiS, Harsberg, Hütscheroda y Thiemsburg tienen exposiciones, mapas
      y rangers; Harsberg cierra de noviembre a marzo. En la UBiS hay aseos accesibles y se presta una silla
      de senderismo con reserva previa, y tanto Harsberg como Hütscheroda están entre los puntos que el gestor
      declara accesibles. El parque ofrece un mapa interactivo con aparcamientos y paradas de autobús y tren;
      comprueba también las conexiones de regreso.
    around: >-
      El atlas no registra vecinos cercanos, pero sí bosques viejos lejanos que se le parecen. La [Reserva
      Natural Integral de Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/) comparte con
      Hainich hayas y fresnos en bosque primario y maduro. El [Bosque Primario de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) tiene también haya y ajo de oso; el [Bosque Virgen
      de Lom - Reserva Natural Estricta](/lugar/prasuma-lom-strogi-rezervat-prirode/), haya y anémona del
      bosque; y la [Reserva Natural Estricta Havešová](/lugar/narodna-prirodna-rezervacia-havesova/), fresnos
      en bosque primario.
  en:
    intro: >-
      A forest allowed to grow old. In western Thuringia, nestled within the triangle formed by Eisenach,
      Mühlhausen, and Bad Langensalza, Hainich National Park occupies the southern part of a larger ridge,
      protecting veteran beechwoods where trees germinate, mature, fall, and decompose without human
      interference. A portion of these woodlands forms an inscribed component of the UNESCO World Heritage
      site. Traversing them reveals, above all, how a forest transforms when granted the freedom to follow its
      natural trajectory.
    landscape: >-
      The underlying story begins beneath your boots. The geological substrate consists of Upper Muschelkalk
      limestone, overlaid by weathering, erosion, and fertile loess deposits that have shaped the modern
      relief. The park’s predominant soil is rendzina, shallow and carbonate-rich. The western slopes falling
      toward the Werra valley are noticeably steeper than the gentle eastern gradients.


      European beech dominates this terrain, yet it does not stand alone: the broadleaf forest embraces ashes,
      maples, lindens, and the rare wild service tree. The World Heritage core preserves the oldest beech
      stands closest to a primeval condition. Within them, prostrate trunks and standing dead trees are
      colonized by tinder bracket fungi and bustle with life. This is not disorder: it is an old-growth
      ecosystem functioning.


      Other sectors tell the opposite tale. To the south, forest tracts were cleared around the beginning of
      the 1980 decade for a military training area, subsequently abandoned to natural succession. What grows
      there now are young pioneering cohorts—silver birch and aspen—that spearhead natural recolonization
      across open terrain. Ancient canopy beside emergent woodland: age is an intrinsic dimension of this
      landscape.
    wildlife: >-
      The Hainich sits at the ecological transition between oceanic and continental climates, and the seasons
      leave an indelible mark on the forest floor. In early spring, before the canopy closes, the ground is
      carpeted with wildflowers: snowdrops, liverworts, and wood anemones. By early summer the pungent aroma
      of ramsons pervades the air, accompanying hikers along the Welterbepfad; among studied understorey
      plants, ramsons and wood anemone reign supreme.


      The most elusive predator lends its name to a trail. The [European wildcat](/especie/felis_silvestris/)
      is among the park’s signature mammals, though glimpsing one in the wild is rare. There are ample other
      reasons to watch closely: 15 bat species, seven species of woodpeckers, and over 500 species of
      saproxylic beetles have been recorded. Across the open expanse of Kindel, lucky walkers can spot [roe
      deer](/especie/capreolus_capreolus/), [wild boars](/especie/sus_scrofa/), and [red
      deer](/especie/cervus_elaphus/). In high summer this open grassland abounds with flowers and
      butterflies; dense hedgerows shelter nesting red-backed and great grey shrikes. Extensive conservation
      grazing preserves habitat for the yellow-bellied toad and the marsh fritillary butterfly.
    visit: >-
      To understand the park before stepping into the woods, the Nationalparkzentrum at Thiemsburg offers
      interpretive films, panoramic exhibition displays, and interactive discovery stations. Rangers are on
      hand to answer questions and guide your itinerary, and the building is fully accessible. Adjacent to the
      centre rises the canopy walkway, the Baumkronenpfad, which experiences moderate visitor numbers. Both
      Thiemsburg and the Wildkatzendorf in Hütscheroda are directly accessible via public transit.


      For a full day immersed among trees, the Welterbepfad spans 9.5 kilometres starting from the Craulaer
      Kreuz car park near Craula, featuring a stairway of one hundred steps and moderate difficulty. Along its
      route you encounter abundant standing and fallen deadwood colonized by bracket fungi.


      If you are fascinated by wildcats, the Wildkatzenpfad extends 7 kilometres through varied scenery in and
      around the park. In Hütscheroda, the Wildkatzenscheune presents an exhibition on the wildcat, the
      [Eurasian lynx](/especie/lynx_lynx/), and the Rettungsnetz Wildkatze conservation initiative, while the
      Wildkatzenlichtung clearing allows visitors to view four wildcats within a spacious semi-natural
      enclosure. Shorter and gentler is the Wildkatzenschleichpfad, covering 2 kilometres from the same
      clearing through dense woods and sunny glades with ancient oaks and decaying wood.


      Further information hubs enrich the visit. Harsberg, near Lauterbach, showcases native wildlife through
      taxidermy, displays, and nature games, open daily from April to October. On the northern boundary near
      Kammerforst, the UBiS facility serves as a hands-on environmental research station for children and
      youths in a repurposed military post. It loans virtual-reality headsets to explore German beechwood
      World Heritage components, and serves as trailhead for the 2-kilometre Germanischer Kultpfad,
      reconstructing ancient pagan sanctuaries unearthed at Niederdorla, alongside the 5.5-kilometre
      Hünenteich circuit.
    history: >-
      The national park was officially established on 31 December 1997. Its master plan focuses on
      safeguarding undisturbed ecological processes across the woodland core without logging, while
      implementing a specialized management strategy to maintain valuable open grassland habitats.


      Not all is serene. Scientists at DLR monitor canopy dieback, crown thinning, and reduced leaf
      development across the Hainich linked to recent prolonged droughts. Veteran trees remain an integral
      part of natural forest dynamics, even in adversity.
    before: >-
      Stick strictly to marked trails and keep dogs on a leash at all times. Remain alert to strong winds and
      falling dead branches. Visitor centres at UBiS, Harsberg, Hütscheroda, and Thiemsburg provide
      exhibitions, maps, and ranger assistance; Harsberg closes from November through March. UBiS features
      accessible restrooms and loans an all-terrain hiking wheelchair by advance reservation; both Harsberg
      and Hütscheroda are certified accessible. The park provides an interactive map of parking areas and
      public transport stops; check return schedules beforehand.
    around: >-
      The atlas registers no immediate neighbouring destinations, yet several distant old-growth forests share
      its ecological character. The [Sasso Fratino Strict Nature
      Reserve](/lugar/riserva-naturale-integrale-di-sasso-fratino/) shares primeval beech and ash woodland
      with Hainich. The [Strâmbu-Băiuț Primeval Forest](/lugar/codrul-secular-strambu-baiut/) likewise
      preserves old-growth beech and wild garlic carpets; the [Lom Virgin Forest - Strict Nature
      Reserve](/lugar/prasuma-lom-strogi-rezervat-prirode/) combines beech and wood anemone; and the [Havešová
      Strict Nature Reserve](/lugar/narodna-prirodna-rezervacia-havesova/) protects towering ash trees in
      primeval forest.
  fr:
    intro: >-
      Une forêt que l’on laisse vieillir. Dans l’ouest de la Thuringe, au cœur du triangle formé par Eisenach,
      Mühlhausen et Bad Langensalza, le Parc national de Hainich occupe le sud d’un vaste massif calcaire,
      préservant de vieilles hêtraies où les arbres germent, grandissent, s’effondrent et se décomposent sans
      que nul ne les coupe. Une partie de ces massifs constitue l’un des joyaux inscrits au patrimoine mondial
      de l’UNESCO. En les parcourant, vous découvrirez avant tout la métamorphose d’un écosystème auquel on
      rend sa libre évolution.
    landscape: >-
      La genèse géologique commence sous vos pas. Le substrat se compose de calcaires du Muschelkalk
      supérieur, sur lesquels altération, érosion et dépôts éoliens de lœss ont façonné le relief. Le sol
      prédominant est la rendzine, mince et saturée en carbonates. Les versants occidentaux, qui plongent vers
      la vallée de la Werra, sont bien plus abrupts que les douces pentes orientales.


      Sur ce terroir le hêtre règne sans partage, mais sans être isolé : la forêt feuillue accueille frênes,
      érables, tilleuls et le rare alisier torminal. Le cœur classé réunit les hêtraies séculaires les plus
      proches de l’état vierge. Les troncs couchés et les chandelles de bois mort y sont colonisés par les
      polypores amadouviers et grouillent de vie. Ce n’est nullement du désordre : c’est la forêt à l’état
      fonctionnel.


      D’autres secteurs racontent l’histoire inverse. Au sud, des parcelles furent rasées au début de la
      décennie 1980 pour servir de champ de tir militaire, puis abandonnées sans aucune gestion sylvicole. Des
      cohortes pionnières de bouleaux verruqueux et de trembles s’y installent aujourd’hui en lisière
      d’espaces ouverts. Vieille forêt et forêt naissante coexistent côte à côte : l’âge façonne la diversité
      du paysage.
    wildlife: >-
      Le Hainich se situe au carrefour des influences climatiques océanique et continentale, et le cycle
      saisonnier s’exprime avec éclat au sol. Au printemps, avant le débourrement complet de la frondaison, un
      tapis floral éclot : perce-neige, hépatiques nobles et anémones sylvies. Au début de l’été se diffuse
      l’odeur caractéristique de l’ail des ours, qui embaume le Welterbepfad ; dans le sous-bois étudié, ail
      des ours et anémone sylvie règnent en maîtres.


      Le carnivore le plus secret a donné son nom à un itinéraire. Le [chat
      sauvage](/especie/felis_silvestris/) compte parmi les mammifères insignes du parc, bien que son
      observation en liberté relève de la chance. D’autres hôtes récompensent un œil attentif : on recense 15
      espèces de chauves-souris, sept de pics et plus de 500 coléoptères saproxyliques inféodés au bois mort.
      Dans les clairières de Kindel, avec un peu de chance, vous surprendrez
      [chevreuils](/especie/capreolus_capreolus/), [sangliers](/especie/sus_scrofa/) et [cerfs
      élaphes](/especie/cervus_elaphus/). En été, ce secteur foisonne de fleurs et de papillons ; dans les
      haies épaisses nichent la pie-grièche écorcheur et la pie-grièche grise. Le pâturage conservatoire
      maintient les mares du sonneur à ventre jaune et les pelouses du damier de la succise.
    visit: >-
      Pour appréhender le parc avant d’y cheminer, le Nationalparkzentrum de Thiemsburg rassemble projections,
      grands panneaux didactiques et bornes interactives. Les rangers vous orientent volontiers et les
      bâtiments sont accessibles aux personnes à mobilité réduite. À ses côtés s’élève la passerelle suspendue
      de la canopée, le Baumkronenpfad, qui connaît une fréquentation modérée. Thiemsburg et le Wildkatzendorf
      de Hütscheroda sont tous deux desservis directement par les transports publics.


      Pour une immersion d’une journée, le Welterbepfad déroule 9,5 kilomètres au départ du parking Craulaer
      Kreuz près de Craula, jalonné d’un escalier de cent marches et de difficulté moyenne. Son parcours
      traverse des peuplements encombrés de gros bois mort colonisé par les champignons.


      Si vous vous passionnez pour le félin forestier, le Wildkatzenpfad s’étend sur 7 kilomètres à travers
      une mosaïque de milieux. À Hütscheroda, la Wildkatzenscheune présente une scénographie sur le chat
      forestier, le [lynx boréal](/especie/lynx_lynx/) et le projet de corridors Rettungsnetz Wildkatze,
      tandis que la clairière Wildkatzenlichtung permet d’observer quatre chats sauvages dans un grand enclos
      d’observation. Plus court et facile, le Wildkatzenschleichpfad parcourt 2 kilomètres au départ de cette
      clairière entre vieux chênes et boisements mûrs.


      D’autres relais complètent la découverte. Harsberg, près de Lauterbach, présente la faune avec
      naturalisations et jeux pédagogiques, ouvert tous les jours d’avril à octobre. À la frange nord près de
      Kammerforst, l’UBiS propose une station de recherche nature pour jeunes dans d’anciennes casernes
      militaires. Elle met à disposition des casques de réalité virtuelle pour explorer les composantes
      allemandes du bien UNESCO, et sert de point de départ au Germanischer Kultpfad de 2 kilomètres,
      reconstituant des sanctuaires païens de Niederdorla, ainsi qu’à la boucle de 5,5 kilomètres du
      Hünenteich.
    history: >-
      Le parc a été créé le 31 décembre 1997. Son plan de gestion vise à préserver la dynamique spontanée des
      peuplements sans exploitation forestière, assorti d’un protocole précis pour entretenir les milieux
      ouverts thermophiles d’intérêt biologique.


      Tous les équilibres ne sont pas figés. Les observations satellitaires du DLR enregistrent dans le
      Hainich des dépérissements de cimes et des réductions foliaires consécutifs aux sécheresses récentes.
      Les arbres sénescents font partie intégrante des cycles naturels, y compris lorsqu’ils souffrent.
    before: >-
      Restez strictement sur les sentiers balisés et tenez les chiens en laisse. Soyez vigilant face au vent
      et aux chutes inopinées de branches mortes. Les points d’accueil UBiS, Harsberg, Hütscheroda et
      Thiemsburg mettent à disposition plans, expositions et conseils de rangers ; Harsberg ferme de novembre
      à mars. L’UBiS est pourvue de sanitaires adaptés et prête une joëlette de randonnée sur réservation
      préalable ; Harsberg et Hütscheroda sont certifiés accessibles. Le parc propose une cartographie
      interactive des parkings et correspondances de bus et train ; vérifiez vos horaires de retour.
    around: >-
      L’atlas ne relève pas de voisins immédiats, mais recense des forêts anciennes lointaines partageant ses
      caractéristiques. La [Réserve naturelle intégrale de Sasso
      Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/) partage avec Hainich la présence de hêtres
      et de frênes en forêt primaire mature. La [Forêt primaire de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) abrite également de vieux hêtres et des tapis d’ail
      des ours ; la [Forêt vierge de Lom - Réserve naturelle
      intégrale](/lugar/prasuma-lom-strogi-rezervat-prirode/) associe hêtre et anémone sylvie ; et la [Réserve
      naturelle intégrale d’Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) protège des frênes géants
      en forêt primaire.
  de:
    intro: >-
      Ein Wald, der altern darf. Im Westen Thüringens, im Städtedreieck Eisenach–Mühlhausen–Bad Langensalza,
      nimmt der Nationalpark Hainich den Südteil eines bewaldeten Höhenzuges ein und schützt alte
      Buchenwälder, in denen Bäume ohne forstliche Eingriffe keimen, heranwachsen, zusammenbrechen und
      vergehen. Ein Teil dieser Bestände bildet eine anerkannte Komponente des UNESCO-Welterbes. Beim
      Durchstreifen erlebst du vor allem eines: wie sich ein Wald wandelt, wenn man ihm seinen eigenen Lauf
      lässt.
    landscape: >-
      Die Entstehung beginnt im Untergrund. Das Ausgangsgestein bilden Kalke des Oberen Muschelkalks,
      überprägt von Verwitterung, Abtragung und eiszeitlichen Lössauflagen. Der verbreitetste Bodentyp ist die
      flachgründige, carbonatreiche Rendzina. Die nach Westen zum Werratal abfallenden Hänge sind spürbar
      steiler als die sanfteren Ostflanken.


      Auf diesen Böden herrscht die Rotbuche, flankiert von Esche, Ahorn, Linde und der seltenen Elsbeere. Die
      Welterbekernzone vereint die naturnächsten Buchenaltbestände. Umgestürzte Stämme und stehendes Totholz
      sind dicht von Zunderschwämmen bewachsen und quellen über vor Leben. Das ist kein Durcheinander, sondern
      ein voll funktionsfähiger Naturwald.


      Andere Teilbereiche erzählen eine ganz andere Geschichte. Im Süden wurden zu Beginn der 1980er Jahre
      Waldteile für einen Truppenübungsplatz gerodet, der später aufgelassen wurde. Dort breiten sich
      Pionierhölzer wie Hänge-Birke und Zitter-Pappel aus, die Offenlandflächen wiederbesiedeln. Uriger
      Altbestand und junger Aufwuchs liegen direkt nebeneinander: Das Alter ist hier landschaftsprägend.
    wildlife: >-
      Der Hainich liegt im Übergangsbereich zwischen atlantischem und kontinentalem Klima, was sich am
      Waldboden eindrucksvoll widerspiegelt. Im Frühjahr, vor dem Schließen des Kronendaches, blüht ein bunter
      Blütenteppich aus Schneeglöckchen, Leberblümchen und Buschwindröschen auf. Im Frühsommer dominiert der
      intensive Duft des Bärlauchs, der den Welterbepfad säumt; unter den untersuchten Bodenpflanzen sind
      Bärlauch und Buschwindröschen die Leitarten.


      Das scheueste Raubtier gab einem Wanderweg seinen Namen: Die [Wildkatze](/especie/felis_silvestris/) ist
      das Symboltier des Parks, wenngleich Freilandbeobachtungen selten glücken. Es gibt viel zu entdecken: 15
      Fledermausarten, sieben Spechtarten und über 500 holzbewohnende Käferarten sind nachgewiesen. Auf den
      offenen Weideflächen des Kindel lassen sich mit etwas Glück [Rehe](/especie/capreolus_capreolus/),
      [Wildschweine](/especie/sus_scrofa/) und [Rothirsche](/especie/cervus_elaphus/) beobachten. Im Sommer
      summen dort unzählige Schmetterlinge; in dichten Hecken brüten Neuntöter und Raubwürger. Die extensive
      Beweidung erhält Biotope für Gelbbauchunke und Goldene Scheckenfalter.
    visit: >-
      Einen perfekten Einstieg bietet das Nationalparkzentrum an der Thiemsburg mit Filmen, Ausstellungen und
      Mitmachstationen. Ranger geben Auskunft und das Gebäude ist barrierefrei zugänglich. Direkt daneben
      verläuft der Baumkronenpfad mit mäßigem Besucherandrang. Die Thiemsburg und das Wildkatzendorf
      Hütscheroda sind bequem mit öffentlichen Verkehrsmitteln erreichbar.


      Für eine Tagestour empfiehlt sich der 9,5 Kilometer lange Welterbepfad ab dem Wanderparkplatz Craulaer
      Kreuz bei Craula, der über eine Treppe mit hundert Stufen führt und mittleres Niveau verlangt. Entlang
      des Pfades säumen mächtige Totholzstämme mit Baumpilzen den Weg.


      Interessierst du dich für die Wildkatze, führt der Wildkatzenpfad über 7 Kilometer durch
      abwechslungsreiche Parklandschaften. In Hütscheroda informiert die Wildkatzenscheune über Wildkatzen,
      den [Eurasischen Luchs](/especie/lynx_lynx/) und das Rettungsnetz Wildkatze, während auf der
      Wildkatzenlichtung vier Wildkatzen in einem großzügigen Schaugehege zu sehen sind. Kürzer ist der
      Wildkatzenschleichpfad mit 2 Kilometern Länge, der durch dichten Wald und lichte Alteichenbestände
      führt.


      Weitere Infostellen runden den Besuch ab: Das Umweltbildungszentrum Harsberg bei Lauterbach zeigt
      Tierpräparate und Spiele, geöffnet täglich von April bis Oktober. Am Nordrand bei Kammerforst hält die
      UBiS eine Forschungsstation für Kinder und Jugendliche in einer ehemaligen Militäranlage bereit. Hier
      werden VR-Brillen zur Erkundung der Buchenwälder verliehen; zudem starten hier der Germanische Kultpfad
      mit 2 Kilometern Länge zu historischen Kultstätten von Niederdorla sowie die 5,5 Kilometer lange
      Hünenteich-Tour.
    history: >-
      Der Nationalpark wurde am 31. Dezember 1997 ausgewiesen. Der Nationalparkplan zielt darauf ab,
      natürliche Waldprozesse ohne Holznutzung zu sichern, ergänzt um ein Pflegekonzept für wertvolle
      Offenlandbiotope.


      Nicht alles verläuft ungestört: Das DLR registriert im Hainich Kronenverlichtungen und Blattverluste
      infolge jüngster Dürreperioden. Absterbende Altbäume gehören jedoch zur natürlichen Walddynamik dazu.
    before: >-
      Bleibe auf den markierten Wegen und halte Hunde stets an der Leine. Achte auf Windbruch und
      herabfallende Äste. Die Stationen UBiS, Harsberg, Hütscheroda und Thiemsburg halten Karten und Ranger
      bereit; Harsberg schließt von November bis März. An der UBiS gibt es barrierefreie WCs und ein
      geländegängiger Rollstuhl kann reserviert werden; Harsberg und Hütscheroda sind ebenfalls barrierefrei
      zertifiziert. Nutze die interaktive Parkkarte zur Anreise mit Bus und Bahn und prüfe deine
      Rückverbindungen.
    around: >-
      Der Atlas verzeichnet keine unmittelbaren Nachbargebiete, weist jedoch auf weit entfernte Urwälder mit
      ähnlicher Ökologie hin. Das [Integrale Naturreservat Sasso
      Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/) teilt Buchen und Eschen in urwüchsigen
      Altbeständen mit dem Hainich. Der [Urwald Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) birgt
      ebenfalls Buchenurwälder und Bärlauchfluren; der [Urwald Lom - Strenges
      Naturreservat](/lugar/prasuma-lom-strogi-rezervat-prirode/) verbindet Buche und Buschwindröschen; und
      das [Strenge Naturreservat Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) schützt mächtige
      Urwald-Eschen.
  it:
    intro: >-
      Un bosco a cui è concesso invecchiare. Nella Turingia occidentale, nel triangolo compreso tra Eisenach,
      Mühlhausen e Bad Langensalza, il Parco Nazionale di Hainich occupa il settore meridionale di un rilievo
      collinare, proteggendo faggete vetuste dove gli alberi nascono, crescono, crollano e si decompongono
      senza abbattimenti umani. Parte di questi boschi costituisce una componente del patrimonio mondiale
      UNESCO. Attraversandoli si osserva soprattutto come muta un ecosistema quando gli viene consentito di
      seguire il proprio ciclo naturale.
    landscape: >-
      La spiegazione comincia sotto i tuoi piedi. Il basamento geologico è formato da calcari del Muschelkalk
      superiore, sui quali erosione, dissoluzione e coltri di löss hanno modellato i rilievi attuali. Il suolo
      prevalente è la rendzina, sottile e ricca di carbonati. I versanti occidentali, che digradano verso la
      valle della Werra, sono nettamente più scoscesi rispetto alle dolci pendenze orientali.


      Su questi terreni il faggio domina indiscusso, ma non è isolato: il bosco di latifoglie accoglie
      frassini, aceri, tigli e il raro ciavardello. Il nucleo patrimonio UNESCO racchiude le faggete antiche
      più prossime allo stato vergine. I tronchi caduti a terra e gli alberi morti in piedi sono colonizzati
      da funghi polipori e brulicano di vita. Non è disordine: è la foresta naturale che funziona.


      Altri settori raccontano una dinamica opposta. A sud, porzioni boscate furono rase al suolo all’inizio
      del decennio 1980 per far spazio a un poligono militare, successivamente abbandonato a libera
      evoluzione. Oggi vi prosperano specie pioniere come betulle e pioppi tremuli, prime a colonizzare gli
      spazi aperti. Bosco vetusto e bosco nascente convivono a stretto contatto: l’età delle piante è parte
      integrante del paesaggio.
    wildlife: >-
      L’Hainich si trova al crocevia tra clima oceanico e continentale, e il volgere delle stagioni trasfigura
      il sottobosco. In primavera, prima che la volta fogliare si chiuda, il terreno si ammanta di fioriture:
      bucaneve, erba trinità e anemoni dei boschi. Con l’inizio dell’estate giunge l’aroma intenso dell’aglio
      orsino, che accompagna chi cammina lungo il Welterbepfad; tra le specie erbacee studiate, aglio orsino e
      anemone bianco dominano incontrastati.


      Il predatore più elusivo dà il nome a un percorso tematico. Il [gatto
      selvatico](/especie/felis_silvestris/) è tra i mammiferi simbolo del parco, sebbene avvistarlo in
      libertà sia difficile. Molti altri elementi premiano un occhio attento: si contano 15 specie di
      chirotteri, sette di picchi e oltre 500 coleotteri saproxilici che dipendono dal legno marcescente.
      Nelle radure aperte di Kindel si possono scorgere [caprioli](/especie/capreolus_capreolus/),
      [cinghiali](/especie/sus_scrofa/) e [cervi nobili](/especie/cervus_elaphus/). In estate questi prati si
      riempiono di farfalle; nelle siepi fitte nidificano l’averla piccola e l’averla maggiore. Il pascolo
      brado garantisce pozze per l’ululone dal ventre giallo e habitat per la damiera della succisa.
    visit: >-
      Per comprendere il parco prima di camminarvi, il Nationalparkzentrum di Thiemsburg mette a disposizione
      filmati, pannelli e postazioni interattive. I guardaparco rispondono alle domande e la struttura è priva
      di barriere architettoniche. Accanto sorge la passerella tra le chiome degli alberi, il Baumkronenpfad,
      con affluenza media. Thiemsburg e il Wildkatzendorf di Hütscheroda sono entrambi raggiungibili con il
      trasporto pubblico.


      Per trascorrere una giornata tra gli alberi, il Welterbepfad misura 9,5 chilometri con partenza dal
      parcheggio Craulaer Kreuz vicino a Craula, superando una scala di cento gradini con difficoltà media.
      Lungo il tracciato abbondano alberi morti colonizzati da funghi lignicoli.


      Se ti appassiona il gatto selvatico, il Wildkatzenpfad misura 7 chilometri attraverso paesaggi variati.
      A Hütscheroda la Wildkatzenscheune allestisce una mostra su gatto selvatico, [lince
      eurasiatica](/especie/lynx_lynx/) e rete di corridoi ecologici Rettungsnetz Wildkatze, mentre nella
      radura Wildkatzenlichtung si ammirano quattro gatti in un ampio recinto naturale. Più breve e agevole è
      il Wildkatzenschleichpfad, di 2 chilometri, che parte dalla medesima radura snodandosi tra fitti boschi
      e vecchie querce.


      Altri punti informativi arricchiscono l’esperienza. Harsberg, presso Lauterbach, presenta la fauna
      locale con animali tassidermizzati e giochi didattici, aperto tutti i giorni da aprile a ottobre. Sul
      versante settentrionale a Kammerforst, la UBiS ospita una stazione di ricerca per ragazzi in una
      struttura militare recuperata. Offre visori di realtà virtuale per esplorare le faggete UNESCO tedesche
      e funge da punto di partenza per il Germanischer Kultpfad di 2 chilometri, che ricostruisce santuari
      pagani rinvenuti a Niederdorla, e per l’anello Hünenteich di 5,5 chilometri.
    history: >-
      Il parco è stato istituito il 31 dicembre 1997. Il piano di gestione persegue la tutela dei processi
      naturali forestali senza abbattimenti, integrato da un documento d’indirizzo per preservare le preziose
      superfici aperte.


      Non mancano le criticità ambientali: i rilievi satellitari del DLR documentano a Hainich disseccamenti
      di chioma e deperimento fogliare legati alle recenti siccità prolungate. Gli alberi che muoiono
      rientrano pienamente nella dinamica biologica del parco.
    before: >-
      Resta rigorosamente sui sentieri segnati e tieni i cani sempre al guinzaglio. Presta attenzione al vento
      e alla caduta improvvisa di rami secchi. I punti informativi UBiS, Harsberg, Hütscheroda e Thiemsburg
      dispongono di mappe e personale; Harsberg chiude da novembre a marzo. Presso la UBiS sono presenti
      servizi igienici accessibili e si noleggia una sedia da trekking per disabili su prenotazione; sia
      Harsberg che Hütscheroda sono certificati accessibili. Consulta la mappa dei trasporti pubblici per
      treni e autobus e verifica le corse di rientro.
    around: >-
      L’atlas non elenca aree limitrofe immediate, ma segnala boschi vetusti distanti con affinità ecologiche.
      La [Riserva naturale integrale di Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/)
      condivide con Hainich faggi e frassini in foresta vetusta. La [Foresta Primaria di
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) custodisce faggete incontaminate e aglio orsino; la
      [Foresta Vergine di Lom - Riserva Naturale Integrale](/lugar/prasuma-lom-strogi-rezervat-prirode/)
      unisce faggio e anemone dei boschi; e la [Riserva Naturale Integrale di
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) tutela frassini giganti in foresta primaria.
  pt:
    intro: >-
      Uma floresta à qual é permitido envelhecer. No oeste da Turíngia, no vértice definido por Eisenach,
      Mühlhausen e Bad Langensalza, o Parque Nacional de Hainich ocupa a porção sul de uma dorsal montanhosa,
      resguardando faganais vetustos onde as árvores brotam, medram, tombam e apodrecem sem qualquer corte de
      machado. Frações destas matas compõem o bem inscrito na Lista do Património Mundial da UNESCO.
      Percorrê-las revela a transfiguração de uma floresta à qual se devolve a liberdade biológica.
    landscape: >-
      A génese da paisagem principia sob os teus passos. O substrato geológico assenta em calcários do
      Muschelkalk Superior, sobre os quais meteorização, desagregação e mantos de loesse modelaram a
      superfície. O solo dominante é a rendzina, pouco espessa e saturada de carbonatos. As vertentes
      ocidentais, viradas ao vale do Werra, precipitam-se de forma mais abrupta do que as encostas orientais.


      Neste solo manda a faia, embora sem exclusividade: o bosque caducifólio reúne freixos, áceres, tílias e
      a rara tramazeira-das-rochas. A zona núcleo da UNESCO preserva os povoamentos maduros mais pristinos.
      Neles, troncos prostrados e árvores mortas em pé acham-se atapetados de fungos políporos e transbordam
      de biodiversidade. Não se trata de desordem: é a floresta natural a operar.


      Outros recantos exibem o processo oposto: no sul do parque, parcelas foram desarborizadas no início da
      década de 1980 para um polígono militar, sendo abandonadas após a reunificação sem maneio florestal. O
      que ali medra agora são árvores pioneiras, como bétulas e choupos-tremedores, que colonizam áreas
      abertas. Mata madura e bosque nascente coexistem: a idade do arvoredo desenha a paisagem.
    wildlife: >-
      O Hainich ergue-se na charneira bioclimática entre as influências oceânica e continental, e o ciclo
      anual reflete-se na flora rasteira. Na primavera, antes do encerramento das copas, o solo atapeta-se de
      campainhas-brancas, hepáticas e anémonas-dos-bosques. Nos primórdios do verão ressoa o aroma do
      alho-ursino, que perfuma o Welterbepfad; entre as espécies herbáceas investigadas, o alho-ursino e a
      anémona-dos-bosques dominam.


      O carnívoro mais furtivo empresta o seu nome a um percurso temático. O
      [gato-bravo](/especie/felis_silvestris/) é uma das presenças nobres do parque, sendo todavia difícil
      avistá-lo em liberdade. Há outros motivos de contemplação: estão confirmadas 15 espécies de morcegos,
      sete de pica-paus e mais de 500 escaravelhos saproxílicos que requerem madeira morta. Nas clareiras de
      Kindel é possível avistar [corços](/especie/capreolus_capreolus/), [javalis](/especie/sus_scrofa/) e
      [veados-vermelhos](/especie/cervus_elaphus/). No estio este setor enche-se de borboletas; em silvados
      densos nidificam o picanço-de-dorso-ruivo e o picanço-real. O pastoreio conservacionista mantém charcos
      vitais para o sapo-de-barriga-amarela e a borboleta-da-succisa.
    visit: >-
      Para apreender a floresta antes de caminhar, o Nationalparkzentrum em Thiemsburg faculta filmes, mostras
      temáticas e módulos interativos. Os vigilantes prestam informações e o edifício é acessível. Junto a ele
      ergue-se o passadiço das copas arbóreas, o Baumkronenpfad, com afluência moderada. Thiemsburg e a aldeia
      Wildkatzendorf em Hütscheroda são servidas diretamente por transportes públicos.


      Para um dia completo no arvoredo, o Welterbepfad perfaz 9,5 quilómetros a partir do parque Craulaer
      Kreuz, junto a Craula, integrando uma escadaria de cem degraus e dificuldade moderada. Pelo caminho
      abunda madeira morta colonizada por fungos lenhosos.


      Se te fascina o gato-bravo, o Wildkatzenpfad tem 7 quilómetros e percorre cenários variados. Em
      Hütscheroda, a Wildkatzenscheune expõe sobre o gato-bravo, o [lince-euroasiático](/especie/lynx_lynx/) e
      a rede de conservação Rettungsnetz Wildkatze, ao passo que na clareira Wildkatzenlichtung podes admirar
      quatro gatos num amplo cercado natural. Mais curto e suave é o Wildkatzenschleichpfad, com 2
      quilómetros, saindo da mesma clareira entre carvalhos vetustos e mata fechada.


      Outros centros complementam o itinerário: Harsberg, junto a Lauterbach, expõe fauna com réplicas e
      jogos, aberto diariamente de abril a outubro. No bordo norte em Kammerforst, a UBiS acolhe um centro
      ambiental jovem numa antiga guarnição militar. Faculta óculos de realidade virtual para explorar os
      faganais UNESCO alemães e serve de ponto de partida ao Germanischer Kultpfad de 2 quilómetros, que
      reconstitui santuários de Niederdorla, e ao circuito Hünenteich de 5,5 quilómetros.
    history: >-
      O parque nacional foi decretado a 31 de dezembro de 1997. O plano de ordenamento privilegia a sucessão
      biológica intocada sem corte de madeira, englobando também diretrizes para a conservação das pradarias
      abertas.


      Nem tudo decorre em serenidade: o DLR monitoriza no Hainich a seca de copas e perdas foliares
      resultantes de episódios recentes de estiagem severa. As árvores velhas que perecem cumprem o seu papel
      ecológico fundamental na floresta.
    before: >-
      Mantém-te estritamente nos trilhos balizados e conduz o cão com trela. Presta cautela ao vento e à queda
      de pernadas secas. Os pontos UBiS, Harsberg, Hütscheroda e Thiemsburg disponibilizam cartografia e
      guardas; Harsberg encerra de novembro a março. A UBiS dispõe de instalações acessíveis e empresta
      cadeira todo-o-terreno mediante reserva prévia; Harsberg e Hütscheroda estão certificados como
      acessíveis. Consulta o mapa interativo para horários de autocarro e comboio, planeando os regressos.
    around: >-
      O atlas não assinala áreas contíguas próximas, mas aponta florestas antigas com paralelismo ecológico. A
      [Reserva Natural Integral de Sasso Fratino](/lugar/riserva-naturale-integrale-di-sasso-fratino/)
      partilha com Hainich faias e freixos em mata virgem. A [Floresta Primária de
      Strâmbu-Băiuț](/lugar/codrul-secular-strambu-baiut/) acolhe também faiais intactos e alho-ursino; a
      [Floresta Virgem de Lom - Reserva Natural Estrita](/lugar/prasuma-lom-strogi-rezervat-prirode/) combina
      faia e anémona-dos-bosques; e a [Reserva Natural Estrita de
      Havešová](/lugar/narodna-prirodna-rezervacia-havesova/) conserva freixos gigantes em floresta primária.
