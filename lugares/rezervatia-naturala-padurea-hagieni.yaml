resumen:
  es: Oasis boscoso en la estepa árida del sur de Dobruja con cañones calizos ciegos y manantiales.
  en: >-
    Wooded oasis in the arid steppe of southern Dobruja featuring blind limestone canyons and freshwater
    springs.
  fr: >-
    Oasis boisée dans la steppe aride du sud de la Dobroudja avec ravins calcaires aveugles et sources d'eau
    douce.
  de: Wald-Oase in der trockenen Steppe der südlichen Dobrudscha mit Trockenschluchten und Karstquellen.
  it: >-
    Oasi boschiva nella steppa arida della Dobrugia meridionale con forre calcaree cieche e sorgenti d'acqua
    dolce.
  pt: >-
    Oásis florestal na estepe árida do sul de Dobruja com desfiladeiros calcários cegos e nascentes de água
    doce.
unico:
  es: >-
    Un robledal sobre caliza de la Dobruja meridional donde crecen las peonías de estepa, anidan rapaces raras
    y vive la tortuga mora.
  en: >-
    An oak forest on southern Dobruja limestone where steppe peonies bloom, rare raptors nest and the
    spur-thighed tortoise lives.
  fr: >-
    Une chênaie sur calcaire du sud de la Dobroudja où fleurissent les pivoines des steppes, nichent des
    rapaces rares et vit la tortue mauresque.
  de: >-
    Ein Eichenwald auf Dobrudscha-Kalk, in dem Steppen-Pfingstrosen blühen, seltene Greifvögel horsten und
    Maurische Landschildkröten leben.
  it: >-
    Un querceto su calcare della Dobrugia meridionale dove fioriscono le peonie di steppa, nidificano rari
    rapaci e vive la testuggine greca.
  pt: >-
    Um carvalhal sobre calcário no sul de Dobruja onde florescem as peónias de estepe, nidificam aves de
    rapina raras e vive a tartaruga-grega.
observaciones:
  es: >-
    Por ser reserva natural, no se permite encender fuego. Cuenta con medio día o un día, y con primavera o
    principios de otoño.
texto:
  es:
    intro: >-
      Un bosque de robles sobre caliza, a unos diez kilómetros de Mangalia, donde los científicos han vuelto
      una y otra vez por su flora y su fauna. Pădurea Hagieni es una reserva de perfil zoobotánico en la
      meseta de Negru Vodă, en el condado de Constanța, repartida entre el término de Mangalia y los
      municipios de Limanu y Albești. Alberga más de ochocientos taxones vegetales y animales importantes,
      entre ellos aves, reptiles e invertebrados, y está bajo protección desde mil novecientos setenta.
    landscape: >-
      El relieve es fragmentado: mesetas calizas cortadas por valles profundos, sobre calizas sármatas. En ese
      suelo, el bosque natural mezcla robles termófilos, entre ellos *Quercus pedunculiflora*, *Quercus
      virgiliana* y el roble pubescente, con otras leñosas como *Carpinus orientalis* y *Fraxinus ornus*. Su
      valor mayor es que es lugar de nidificación de diversas especies de aves.


      Donde el bosque se abre, el paisaje cambia: los claros rocosos albergan una flora de pastizales
      xerófilos propios de Dobruja, y en los bordes hay matorral mediterráneo, el «șibliac», y roquedos. El
      clima es continental, con algunas influencias del mar Negro y submediterráneas. Los hábitats son, en
      gran parte, bosques ponto-balcánicos y pastizales de vegetación esteparia, y se consideran amenazados a
      escala global y prioritarios para la conservación en Europa.
    wildlife: >-
      La flora marca el calendario. En primavera son las primeras en aparecer *Crocus chrysanthus*, *Galanthus
      elwesii*, *Scilla bifolia*, *Corydalis solida*, *Hyacinthus leucophaeus*, el adonis de primavera y *Iris
      pumila*. Entre las plantas destaca la peonía de estepa, una especie europea amenazada; la peonía
      dobrogeana también es especie protegida. En verano toca lo más raro de la flora de Rumanía, como *Stipa
      joannis*, *Achillea clypeolata*, *Astragalus spunneri* y *Salvia ringens*, y a finales de verano, *Aster
      linosyris*, *Aster amellus*, *Crocus pallassi* y *Sternbergia colchiciflora*.


      Los reptiles están bien representados. Además de la [tortuga mora](/especie/testudo_graeca/) hay
      lagartija de la hierba, la culebra *Coluber caspius* y la [víbora de
      cuernos](/especie/vipera_ammodytes/).


      Las aves son el otro motivo de visita. En Pădurea Hagieni anidan una pareja de [águila imperial
      oriental](/especie/aquila_heliaca/), una de [halcón sacre](/especie/falco_cherrug/) y dos de [aguilucho
      cenizo](/especie/circus_pygargus/). También crían entre trece y veintiuna parejas de [cernícalo
      vespertino](/especie/falco_vespertinus/), entre diez y trece de [busardo moro](/especie/buteo_rufinus/),
      cuarenta a cuarenta y cuatro de carraca europea y veinte a treinta de [pico
      mediano](/especie/picoides_medius/). El [alcaraván](/especie/burhinus_oedicnemus/) cría con sesenta y
      seis a noventa parejas. En invierno, en el área del sitio protegido, se ven unos ochenta a cien
      [aguiluchos pálidos](/especie/circus_cyaneus/) y unos sesenta [cisnes
      cantores](/especie/cygnus_cygnus/). La primavera y el principio del otoño son las mejores épocas.
    visit: >-
      Pădurea Hagieni se visita en medio día o un día completo. El plan turístico provincial la incluye entre
      los enclaves naturales visitables de Constanța, y el mismo plan señala que las reservas naturales del
      interior del litoral de Constanța reciben poca atención turística. La ciudad de referencia es Mangalia.
    history: >-
      La reserva se puso bajo protección por la decisión 425 de 1970 del Consejo Popular del condado de
      Constanța. Numerosos científicos la han estudiado a lo largo del tiempo por su flora y su fauna
      específicas.
    before: >-
      Por ser reserva natural, no se permite encender fuego. Cuenta con medio día o un día, y con primavera o
      principios de otoño.
    around: >-
      No hay vecinos cercanos con ficha, pero sí lugares lejanos que comparten la tortuga mora en estepa y
      bosque: la [Meseta de Babadag - Reserva de Estepa](/lugar/podisul-babadag---rezervatia-de-stepa/) y el
      [Parque Nacional Montañas de Măcin](/lugar/parcul-national-muntii-macinului/).
  en:
    intro: >-
      An oak forest on limestone, some ten kilometres from Mangalia, where scientists have returned time and
      again for its flora and fauna. Pădurea Hagieni is a zoobotanical nature reserve on the Negru Vodă
      plateau, in Constanța County, shared between the municipality of Mangalia and the communes of Limanu and
      Albești. It shelters more than eight hundred important plant and animal taxa, including birds, reptiles
      and invertebrates, and has been protected since nineteen seventy.
    landscape: >-
      The relief is fragmented: limestone plateaus dissected by deep ravines on Sarmatian limestone. On this
      terrain, the natural forest blends thermophilous oaks, including *Quercus pedunculiflora*, *Quercus
      virgiliana* and downy oak, with other woody species such as *Carpinus orientalis* and *Fraxinus ornus*.
      Its greatest ecological value is serving as a nesting stronghold for diverse bird species.


      Where the forest opens, the landscape changes: rocky clearings harbour Dobrujan xerophilic steppe
      grasslands, while forest margins feature sub-Mediterranean scrub, the «șibliac», and limestone bluffs.
      The climate is continental with Black Sea and sub-Mediterranean influences. The habitats consist largely
      of ponto-Balkan woods and steppe grasslands, considered globally threatened and priority habitats for
      European conservation.
    wildlife: >-
      Flora marks the seasons. In spring the earliest blooms are *Crocus chrysanthus*, *Galanthus elwesii*,
      *Scilla bifolia*, *Corydalis solida*, *Hyacinthus leucophaeus*, yellow pheasant's eye and *Iris pumila*.
      Notable flowers include the steppe peony, a threatened European species; the Dobrujan peony is likewise
      protected. In summer some of Romania's rarest botanicals bloom, such as *Stipa joannis*, *Achillea
      clypeolata*, *Astragalus spunneri* and *Salvia ringens*, and in late summer *Aster linosyris*, *Aster
      amellus*, *Crocus pallasii* and *Sternbergia colchiciflora*.


      Reptiles are well represented. Alongside the [spur-thighed tortoise](/especie/testudo_graeca/) live
      snake-eyed skinks, the Caspian whipsnake (*Coluber caspius*) and the [nose-horned
      viper](/especie/vipera_ammodytes/).


      Birds are the other main draw. Pădurea Hagieni hosts nesting pairs of the [eastern imperial
      eagle](/especie/aquila_heliaca/), the [saker falcon](/especie/falco_cherrug/) and two pairs of the
      [Montagu's harrier](/especie/circus_pygargus/). It also supports thirteen to twenty-one breeding pairs
      of the [red-footed falcon](/especie/falco_vespertinus/), ten to thirteen pairs of the [long-legged
      buzzard](/especie/buteo_rufinus/), forty to forty-four pairs of European rollers and twenty to thirty
      pairs of the [middle spotted woodpecker](/especie/picoides_medius/). The [Eurasian
      stone-curlew](/especie/burhinus_oedicnemus/) breeds with sixty-six to ninety pairs. In winter, eighty to
      one hundred [hen harriers](/especie/circus_cyaneus/) and some sixty [whooper
      swans](/especie/cygnus_cygnus/) frequent the protected area. Spring and early autumn are the best
      seasons to visit.
    visit: >-
      Pădurea Hagieni can be visited in half a day or a full day. The county tourism master plan lists it
      among the visitable natural sites of Constanța, noting that protected inland reserves receive little
      tourist traffic. The regional gateway is Mangalia.
    history: >-
      The reserve was placed under protection by Decision 425 of 1970 of the Constanța County People's
      Council. Numerous scientists have studied it over decades for its distinctive flora and fauna.
    before: >-
      As a nature reserve, lighting fires is prohibited. Plan for half a day or a full day, ideally during
      spring or early autumn.
    around: >-
      There are no catalogued neighbours close by, but more distant reserves share the spur-thighed tortoise
      across steppe and open woodland: the [Babadag Plateau - Steppe
      Reserve](/lugar/podisul-babadag---rezervatia-de-stepa/) and [Măcin Mountains National
      Park](/lugar/parcul-national-muntii-macinului/).
  fr:
    intro: >-
      Une forêt de chênes sur calcaire, à une dizaine de kilomètres de Mangalia, où les scientifiques
      reviennent régulièrement pour sa flore et sa faune. Pădurea Hagieni est une réserve naturelle
      zoobotanique sur le plateau de Negru Vodă, dans le județ de Constanța, répartie entre Mangalia et les
      communes de Limanu et Albești. Elle abrite plus de huit cents taxons végétaux et animaux d'intérêt
      majeur, dont des oiseaux, reptiles et invertébrés, sous protection depuis mil neuf cent soixante-dix.
    landscape: >-
      Le relief est morcelé : des plateaux calcaires entaillés de vallées profondes sur calcaire sarmatien.
      Sur ce substrat, la forêt naturelle associe des chênes thermophiles, dont *Quercus pedunculiflora*,
      *Quercus virgiliana* et le chêne pubescent, à d'autres ligneux comme *Carpinus orientalis* et *Fraxinus
      ornus*. Sa valeur écologique majeure réside dans l'accueil de nombreuses espèces d'oiseaux nicheurs.


      Là où la forêt s'éclaircit, le paysage change : les clairières rocheuses accueillent des pelouses
      steppiques xérophiles typiques de Dobroudja, bordées de fourrés méditerranéens, le « chibliak », et
      d'escarpements. Le climat est continental avec des influences pontiques et subméditerranéennes. Les
      habitats relèvent de forêts ponto-balkaniques et de pelouses steppiques, considérés comme prioritaires
      pour la conservation en Europe.
    wildlife: >-
      La flore rythme les saisons. Au printemps éclosent *Crocus chrysanthus*, *Galanthus elwesii*, *Scilla
      bifolia*, *Corydalis solida*, *Hyacinthus leucophaeus*, l'adonis de printemps et *Iris pumila*. Parmi
      les raretés figure la pivoine des steppes, espèce européenne menacée ; la pivoine de Dobroudja est
      également protégée. L'été révèle des trésors botaniques rares de Roumanie comme *Stipa joannis*,
      *Achillea clypeolata*, *Astragalus spunneri* et *Salvia ringens*, puis en fin d'été *Aster linosyris*,
      *Aster amellus*, *Crocus pallasii* et *Sternbergia colchiciflora*.


      Les reptiles sont remarquablement représentés. Aux côtés de la [tortue
      mauresque](/especie/testudo_graeca/) vivent le scinque ochré, la couleuvre caspienne (*Coluber caspius*)
      et la [vipère cornue](/especie/vipera_ammodytes/).


      Les oiseaux justifient aussi le voyage. Pădurea Hagieni héberge des couples nicheurs d'[aigle
      impérial](/especie/aquila_heliaca/), de [faucon sacre](/especie/falco_cherrug/) et deux couples de
      [busard cendré](/especie/circus_pygargus/). S'y reproduisent treize à vingt-et-un couples de [faucon
      kobez](/especie/falco_vespertinus/), dix à treize de [buse féroce](/especie/buteo_rufinus/), quarante à
      quarante-quatre de rolliers d'Europe et vingt à trente de [pic mar](/especie/picoides_medius/).
      L'[œdicnème criard](/especie/burhinus_oedicnemus/) niche avec soixante-six à quatre-vingt-dix couples.
      En hiver, quatre-vingts à cent [busards Saint-Martin](/especie/circus_cyaneus/) et une soixantaine de
      [cygnes chanteurs](/especie/cygnus_cygnus/) séjournent sur le site. Le printemps et le début d'automne
      sont les périodes les plus favorables.
    visit: >-
      Pădurea Hagieni se visite en une demi-journée ou une journée entière. Le schéma touristique
      départemental la range parmi les sites naturels remarquables de Constanța, soulignant la faible
      fréquentation des réserves de l'intérieur. La ville d'accès est Mangalia.
    history: >-
      La réserve a été instituée par la décision 425 de 1970 du Conseil populaire du județ de Constanța. De
      nombreux naturalistes l'ont étudiée au fil des décennies en raison de sa faune et de sa flore
      exceptionnelles.
    before: >-
      En tant que réserve naturelle, il est interdit d'allumer des feux. Prévoyez une demi-journée à une
      journée entière, au printemps ou au début de l'automne.
    around: >-
      Aucun site du guide n'est proche, mais des réserves plus lointaines partagent la tortue mauresque entre
      steppe et chênaie : le [Plateau de Babadag - Réserve de
      steppe](/lugar/podisul-babadag---rezervatia-de-stepa/) et le [Parc national des monts
      Măcin](/lugar/parcul-national-muntii-macinului/).
  de:
    intro: >-
      Ein Eichenwald auf Kalkstein, rund zehn Kilometer von Mangalia entfernt, zu dem Naturforscher wegen
      seiner Flora und Fauna immer wieder zurückgekehrt sind. Pădurea Hagieni ist ein zoobotanisches
      Naturreservat auf der Hochebene Negru Vodă im Kreis Constanța, aufgeteilt zwischen Mangalia und den
      Gemeinden Limanu und Albești. Es beherbergt über achthundert bedeutende Tier- und Pflanzenarten,
      darunter Vögel, Reptilien und Insekten, und steht seit neunzehnhundertsiebzig unter Schutz.
    landscape: >-
      Das Relief ist kleinteilig: Kalkplateaus, die von tiefen Tälern im sarmatischen Kalkstein zerschnitten
      werden. Auf diesem Boden mischt der Naturwald wärmeliebende Eichenarten wie *Quercus pedunculiflora*,
      *Quercus virgiliana* und die Flaumeiche mit Gehölzen wie *Carpinus orientalis* und *Fraxinus ornus*.
      Seine herausragende ökologische Bedeutung liegt im Brutplatzangebot für zahlreiche Vogelarten.


      Wo der Wald aufreißt, ändert sich das Bild: Felsige Lichtungen tragen trockenheitsliebende Steppenrasen
      der Dobrudscha, gesäumt von submediterranem Gebüsch, dem «Șibliac», und Steilstufen. Das Klima ist
      kontinental mit pontischen und submediterranen Einflüssen. Bei den Habitaten handelt es sich überwiegend
      um pontisch-balkanische Wälder und Steppenrasen, die europaweit als prioritäre Schutzgüter eingestuft
      sind.
    wildlife: >-
      Die Flora bestimmt den Jahreslauf. Im Frühling öffnen sich *Crocus chrysanthus*, *Galanthus elwesii*,
      *Scilla bifolia*, *Corydalis solida*, *Hyacinthus leucophaeus*, Frühlings-Adonisröschen und *Iris
      pumila*. Besondere Zierden sind die europäisch bedrohte Steppen-Pfingstrose sowie die geschützte
      Dobrudscha-Pfingstrose. Im Sommer blühen floristische Seltenheiten Rumäniens wie *Stipa joannis*,
      *Achillea clypeolata*, *Astragalus spunneri* und *Salvia ringens*, im Spätsommer gefolgt von *Aster
      linosyris*, *Aster amellus*, *Crocus pallasii* und *Sternbergia colchiciflora*.


      Reptilien sind artenreich vertreten. Neben der [Maurischen Landschildkröte](/especie/testudo_graeca/)
      leben Johannisechsen, die Kaspische Pfeilnatter (*Coluber caspius*) und die
      [Hornotter](/especie/vipera_ammodytes/).


      Die Vogelwelt bildet den zweiten Schwerpunkt. In Pădurea Hagieni nisten [Östlicher
      Kaiseradler](/especie/aquila_heliaca/), [Sakerfalke](/especie/falco_cherrug/) und zwei Paare der
      [Wiesenweihe](/especie/circus_pygargus/). Zudem brüten dreizehn bis einundzwanzig Paare des
      [Rotfußfalken](/especie/falco_vespertinus/), zehn bis dreizehn des
      [Adlerbussards](/especie/buteo_rufinus/), vierzig bis vierundvierzig der Blauracke und zwanzig bis
      dreißig des [Mittelspechts](/especie/picoides_medius/). Der [Triel](/especie/burhinus_oedicnemus/)
      brütet mit sechsundsechzig bis neunzig Paaren. Im Winter überwintern achtzig bis einhundert
      [Kornweihen](/especie/circus_cyaneus/) und rund sechzig [Singschwäne](/especie/cygnus_cygnus/). Frühling
      und Frühherbst sind die lohnendsten Besuchszeiten.
    visit: >-
      Pădurea Hagieni lässt sich in einem halben oder ganzen Tag erkunden. Das regionale Tourismuskonzept
      führt das Areal als Ausflugsziel des Kreises Constanța, verweist aber auf den geringen Bekanntheitsgrad
      der Schutzgebiete im Hinterland. Ausgangsort ist Mangalia.
    history: >-
      Das Reservat wurde mit Beschluss 425 von 1970 des Volksrats des Kreises Constanța unter Schutz gestellt.
      Zahlreiche Wissenschaftler untersuchten die Waldsteppe wegen ihrer spezifischen Biozönose.
    before: >-
      Im Naturreservat ist offenes Feuer verboten. Plane einen halben bis ganzen Tag ein, vorzugsweise im
      Frühling oder frühen Herbst.
    around: >-
      In direkter Nachbarschaft gibt es keine erfassten Gebiete, doch teilen entferntere Stätten Steppe, Wald
      und Maurische Landschildkröte: das [Babadag-Plateau -
      Steppenreservat](/lugar/podisul-babadag---rezervatia-de-stepa/) und der [Nationalpark
      Măcin-Gebirge](/lugar/parcul-national-muntii-macinului/).
  it:
    intro: >-
      Un bosco di querce su roccia calcarea, a una decina di chilometri da Mangalia, dove i naturalisti sono
      tornati costantemente per la sua flora e fauna. Pădurea Hagieni è una riserva naturale zoobotanica
      sull'altopiano di Negru Vodă, nel distretto di Constanța, suddivisa tra Mangalia e i comuni di Limanu e
      Albești. Ospita oltre ottocento entità vegetali e animali di rilievo, inclusi uccelli, rettili e
      invertebrati, ed è tutelata da millenovecentosettanta.
    landscape: >-
      Il rilievo è tormentato: pianori calcarei intagliati da valloni profondi su formazioni del Sarmatiano.
      Su questi suoli la foresta naturale mescola querce termofile come *Quercus pedunculiflora*, *Quercus
      virgiliana* e roverella con altre essenze quali *Carpinus orientalis* e *Fraxinus ornus*. Il valore
      cardine è l'offerta di siti riproduttivi per l'avifauna.


      Dove gli alberi diradano il paesaggio muta: le radure rocciose ospitano praterie steppiche xerofile
      della Dobrugia, cinte da boscaglia submediterranea, lo «șibliac», e balze pietrose. Il clima è
      continentale mitigato dal Mar Nero. Gli habitat appartengono a boschi ponto-balcanici e formazioni
      steppiche, prioritari per la conservazione europea.
    wildlife: >-
      La flora scandisce i mesi. In primavera sbocciano *Crocus chrysanthus*, *Galanthus elwesii*, *Scilla
      bifolia*, *Corydalis solida*, *Hyacinthus leucophaeus*, adonide primaverile e *Iris pumila*. Tra le
      gemme vegetali spicca la peonia selvatica steppica, specie minacciata; protetta è anche la peonia della
      Dobrugia. In estate fioriscono rarità assolute per la Romania come *Stipa joannis*, *Achillea
      clypeolata*, *Astragalus spunneri* e *Salvia ringens*, seguite a fine estate da *Aster linosyris*,
      *Aster amellus*, *Crocus pallasii* e *Sternbergia colchiciflora*.


      I rettili sono abbondanti. Accanto alla [testuggine greca](/especie/testudo_graeca/) dimorano l'ablefaro
      di Kitaibel, il biacco maggiore (*Coluber caspius*) e la [vipera dal corno](/especie/vipera_ammodytes/).


      Gli uccelli costituiscono l'altra grande attrattiva. A Pădurea Hagieni nidificano coppie di [aquila
      imperiale](/especie/aquila_heliaca/), [falco sacro](/especie/falco_cherrug/) e due coppie di [albanella
      minore](/especie/circus_pygargus/). Si riproducono tra tredici e ventuno coppie di [falco
      cuculo](/especie/falco_vespertinus/), dieci-tredici di [poiana codabianca](/especie/buteo_rufinus/),
      quaranta-quarantaquattro di ghiandaia marina e venti-trenta di [rosso
      mezzano](/especie/picoides_medius/). L'[occhione](/especie/burhinus_oedicnemus/) nidifica con
      sessantasei-novanta coppie. In inverno sostano ottanta-cento [albanelle reali](/especie/circus_cyaneus/)
      e una sessantina di [cigni selvatici](/especie/cygnus_cygnus/). Primavera e inizio autunno offrono il
      periodo propizio.
    visit: >-
      Pădurea Hagieni si visita in mezza giornata o in una giornata intera. I piani turistici distrettuali la
      segnalano tra le mete naturalistiche di Constanța, evidenziando il modesto afflusso di visitatori nelle
      riserve dell'entroterra. Il centro di appoggio è Mangalia.
    history: >-
      La riserva fu istituita con deliberazione 425 del 1970 del Consiglio Popolare del distretto di
      Constanța. Studiosi di tutta Europa l'hanno indagata per le sue comunità biologiche.
    before: >-
      Trattandosi di riserva naturale, è vietato accendere fuochi. Calcola da mezza a una giornata,
      preferibilmente in primavera o all'inizio dell'autunno.
    around: >-
      Non vi sono siti confinanti schedati, ma aree più remote condividono steppa, querceti e testuggine
      greca: l'[Altopiano di Babadag - Riserva di steppa](/lugar/podisul-babadag---rezervatia-de-stepa/) e il
      [Parco Nazionale Monti Măcin](/lugar/parcul-national-muntii-macinului/).
  pt:
    intro: >-
      Uma floresta de carvalhos sobre calcário, a cerca de dez quilómetros de Mangalia, onde os cientistas
      regressam com frequência devido à sua flora e fauna. Pădurea Hagieni é uma reserva natural zoobotânica
      no planalto de Negru Vodă, no distrito de Constanța, dividida entre Mangalia e os municípios de Limanu e
      Albești. Abriga mais de oitocentos táxones vegetais e animais de grande valor, incluindo aves, répteis e
      invertebrados, encontrando-se protegida desde mil novecentos e setenta.
    landscape: >-
      O relevo é fragmentado: planaltos calcários recortados por vales profundos sobre calcários sarmacianos.
      Nesse solo, o bosque autóctone conjuga carvalhos termófilos como *Quercus pedunculiflora*, *Quercus
      virgiliana* e o carvalho-pubescente com outras folhosas como *Carpinus orientalis* e *Fraxinus ornus*. O
      seu valor fulcral reside em constituir área de nidificação para avifauna diversa.


      Onde a floresta abre, a paisagem transforma-se: as clareiras rochosas acolhem pastagens xerófilas
      estépicas de Dobruja, bordadas por matagais submediterrânicos, o «șibliac», e escarpas. O clima é
      continental com influências do Mar Negro. Os habitats integram florestas ponto-balcânicas e estepes,
      considerados prioritários na conservação europeia.
    wildlife: >-
      A flora define o ritmo anual. Na primavera abrem *Crocus chrysanthus*, *Galanthus elwesii*, *Scilla
      bifolia*, *Corydalis solida*, *Hyacinthus leucophaeus*, a adonis-da-primavera e *Iris pumila*. Entre as
      flores de eleição sobressai a peónia-de-estepe, espécie europeia vulnerável; a peónia-de-dobruja
      encontra-se igualmente sob tutela. No verão desabrocham raridades florísticas da Roménia como *Stipa
      joannis*, *Achillea clypeolata*, *Astragalus spunneri* e *Salvia ringens*, e no final do estio *Aster
      linosyris*, *Aster amellus*, *Crocus pallasii* e *Sternbergia colchiciflora*.


      Os répteis exibem notável diversidade. A par da [tartaruga-grega](/especie/testudo_graeca/) vivem o
      fura-matos, a cobra-chicote-oriental (*Coluber caspius*) e a
      [víbora-cornuda](/especie/vipera_ammodytes/).


      As aves completam o cartaz. Em Pădurea Hagieni nidificam casais de
      [águia-imperial-oriental](/especie/aquila_heliaca/), [falcão-sacre](/especie/falco_cherrug/) e dois de
      [tartaranhão-caçador](/especie/circus_pygargus/). Reproduzem-se treze a vinte e um casais de
      [falcão-vespertino](/especie/falco_vespertinus/), dez a treze de
      [bútio-rabo-canela](/especie/buteo_rufinus/), quarenta a quarenta e quatro de rolieiro e vinte a trinta
      de [pica-pau-médio](/especie/picoides_medius/). O [alcaravão](/especie/burhinus_oedicnemus/) nidifica
      com sessenta e seis a noventa casais. No inverno observam-se oitenta a cem
      [tartaranhões-azulados](/especie/circus_cyaneus/) e cerca de sessenta
      [cisnes-bravos](/especie/cygnus_cygnus/). A primavera e o princípio de outono constituem os períodos
      recomendados.
    visit: >-
      Pădurea Hagieni visita-se em meio dia ou um dia inteiro. Os roteiros de turismo distrital apontam-na
      entre os enclaves naturais de Constanța, sublinhando a fraca afluência turística nas reservas do
      interior. A cidade de partida é Mangalia.
    history: >-
      A reserva foi delimitada pela Decisão 425 de 1970 do Conselho Popular de Constanța. Sucessivas equipas
      de biólogos investigaram o ecossistema dada a singularidade da sua biodiversidade.
    before: >-
      Por se tratar de reserva natural, é expressamente proibido fazer lume. Reserva meio dia a um dia
      completo, preferencialmente na primavera ou início do outono.
    around: >-
      Não há reservas vizinhas na proximidade, mas sítios mais distantes partilham estepe, carvalhal e
      tartaruga-grega: o [Planalto de Babadag - Reserva de
      Estepe](/lugar/podisul-babadag---rezervatia-de-stepa/) e o [Parque Nacional dos Montes
      Măcin](/lugar/parcul-national-muntii-macinului/).
