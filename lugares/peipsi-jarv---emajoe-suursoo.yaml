resumen:
  es: El quinto lago más grande de Europa (3.500 km²) y el inmenso humedal no habitado del delta del Emajõgi.
  en: Europe's fifth-largest lake (3,500 km²) and the vast uninhabited wilderness wetland of the Emajõgi delta.
  fr: >-
    Le cinquième plus grand lac d'Europe (3 500 km²) et l'immense zone humide sauvage et inhabitée du delta de
    l'Emajõgi.
  de: >-
    Europas fünftgrößter See (3.500 km²) und die unbewohnte Wildnis der ausgedehnten Moorlandschaft im
    Emajõgi-Delta.
  it: >-
    Il quinto lago più grande d'Europa (3.500 km²) e l'immensa zona umida incontaminata del delta
    dell'Emajõgi.
  pt: O quinto maior lago da Europa (3.500 km²) e o imenso pântano selvagem desabitado do delta do Emajõgi.
unico:
  es: >-
    Un delta pantanoso y sin gente donde, durante la migración, los cisnes, gansos y patos que cruzan el norte
    de Europa paran a comer.
  en: >-
    A wild, roadless marshland delta where migratory swans, geese and ducks traversing northern Europe stage
    and feed.
  fr: >-
    Un delta marécageux et inhabité où, pendant la migration, les cygnes, oies et canards traversant le nord
    de l'Europe font halte pour se nourrir.
  de: >-
    Ein sumpfiges, menschenleeres Delta, an dem Schwäne, Gänse und Enten auf ihrem Zug durch Nordeuropa zur
    Nahrungsaufnahme rasten.
  it: >-
    Un delta paludoso e disabitato dove, durante la migrazione, cigni, oche e anatre in transito nell'Europa
    settentrionale sostano per alimentarsi.
  pt: >-
    Um delta pantanoso e sem povoamento humano onde, durante a migração, cisnes, gansos e patos que cruzam o
    norte da Europa param para se alimentar.
observaciones:
  es: >-
    En el sendero está prohibido cualquier vehículo, motorizado o no. Solo se puede hacer fuego en los lugares
    marcados, y en la zona verde del inicio está prohibido acampar y hacer fuego. Las crecidas del Emajõgi
    pueden dejar impracticables algunos tramos. Aparca fuera de la verja. Mejor época: de mayo a octubre.
texto:
  es:
    intro: >-
      Hay un lago tan grande que se cruza entre dos países, y un río que lo alimenta y se pierde, antes de
      llegar, en un humedal de 13.000 hectáreas. El lago Peipus mide 3.555 km² y es el mayor lago
      transfronterizo de Europa, en la frontera entre Estonia y Rusia, y el quinto más grande del continente.
      El humedal, Emajõe-Suursoo, es el mayor de Estonia y se formó en torno al mayor delta del país. Entre
      los dos, en la orilla suroeste del lago, la reserva de Peipsiveere protege 34.430 hectáreas de humedales
      y bosques.
    landscape: >-
      El lago es un resto de una masa de agua mayor de una edad de hielo, y su relieve actual lo modeló la
      glaciación del Weichsel, que terminó hace unos 12.000 años. Es poco profundo: unos 7,1 m de media. Por
      eso se calienta y se enfría pronto: se hiela entre finales de noviembre y principios de diciembre y se
      deshiela entre finales de abril y principios de mayo.


      Las orillas cambian de un lado a otro. En el norte y el noroeste hay dunas cubiertas de pinar y playas
      de arena. En el sur, en cambio, las orillas bajas son de turba, bordeadas de llanuras y marismas que se
      inundan en primavera, hasta 1.000 km². Las islas son humedales bajos, solo 1-2 metros sobre el agua, y
      también se inundan.


      En el delta del Emajõgi, «río madre» en estonio, que nace en el lago Võrtsjärv y cruza la ciudad de
      Tartu, el 85 % del humedal es turbera baja, con una capa de turba de hasta 5,8 m. La llanura de
      inundación, el pastizal de cárices y el abedular pantanoso se recorren a pie. Entre las plantas hay 425
      especies vasculares, 27 de ellas protegidas, y se ven plantas raras como la genciana de pantano, la iris
      siberiana y orquídeas de pantano.
    wildlife: >-
      Las aves mandan. Se han registrado al menos 176 especies en Peipsiveere, 77 de ellas protegidas. Anidan
      el [pigargo europeo](/especie/haliaeetus_albicilla/), el [águila pescadora](/especie/pandion_haliaetus/)
      y el [águila real](/especie/aquila_chrysaetos/), pero también el gallo lira, la polluela pintoja y el
      [avetoro](/especie/botaurus_stellaris/). Y los humedales de la franja costera son zonas de descanso y
      alimentación de cisnes, gansos y patos migratorios; el lago es una de las principales paradas del [cisne
      de Bewick](/especie/cygnus_columbianus/), que llega tras volar unos 1.600 km desde el Ártico ruso.


      Entre los mamíferos, los más comunes son el [alce](/especie/alces_alces/), el jabalí, el corzo, el zorro
      y el perro mapache; también están el [lobo](/especie/canis_lupus/) y el [lince](/especie/lynx_lynx/), y
      el [oso pardo](/especie/ursus_arctos/) vive en la reserva. Junto al agua viven la
      [nutria](/especie/lutra_lutra/), el [castor](/especie/castor_fiber/) y el visón americano. En el lago
      hay perca, lucioperca, brema, rutilo, coregono y eperlano, entre otros peces. Entre los anfibios, los
      más raros son el sapo de espuelas y el sapo verde.
    visit: >-
      El punto de partida es el sendero didáctico del Emajõe, renovado en 2025/2026: un circuito de tres
      kilómetros que sale del antiguo centro de la naturaleza de Emajõe-Suursoo, en la histórica taberna
      Kantsi. Atraviesa la llanura de inundación, un pastizal de cárices y un abedular pantanoso, y vuelve al
      río junto a una zanja. Hay 700 m de pasarela de 1,2 m de ancho hasta el lugar de fuego, otros 1,3 km de
      pasarela estrecha, un puente y una plataforma de observación. Los paneles presentan el río Emajõgi, las
      especies y los hábitats de ribera. Empieza junto al aparcamiento pequeño, de 20 coches, y al panel
      informativo de la entrada de Kavastu.


      El Emajõgi es navegable en toda su longitud, así que también se puede descubrir desde el agua.
    history: >-
      Sobre el hielo de este lago se libró, el 5 de abril de 1242, la batalla del Hielo entre Nóvgorod y la
      Orden Teutónica. En lo natural, el problema principal del lago es la eutrofización. La reserva de
      Peipsiveere se creó el 20 de diciembre de 2013 uniendo las áreas protegidas de Piirissaar, del estuario
      del Emajõgi y de Emajõe-Suursoo, y es espacio Natura 2000, Ramsar e IBA. El sitio Ramsar se designó el 5
      de junio de 1997.
    before: >-
      En el sendero está prohibido cualquier vehículo, motorizado o no. Solo se puede hacer fuego en los
      lugares marcados, y en la zona verde del inicio está prohibido acampar y hacer fuego. Las crecidas del
      Emajõgi pueden dejar impracticables algunos tramos. Aparca fuera de la verja. Mejor época: de mayo a
      octubre.
    around: >-
      Peipsiveere no tiene vecinos cercanos en el atlas, pero sí lugares lejanos con los que comparte hábitats
      y especies. El [Parque Nacional de Vilsandi y Acantilados Costeros de
      Saaremaa](/lugar/vilsandi-rahvuspark/) comparte la costa, los humedales y el alce; el [Parque Nacional
      de Ķemeri](/lugar/kemeru-nacionalais-parks/) y el [Parque Nacional del Istmo de
      Curlandia](/lugar/kursiu-nerijos-nacionalinis-parkas/) comparten los lagos, el alce y el pigargo; y el
      [Río Drava y Llanura de Inundación](/lugar/drava-river---floodplain/) comparte los humedales y el
      pigargo.
  en:
    intro: >-
      There is a lake so immense that it spans two countries, fed by a river that disappears before reaching
      it into a 13,000-hectare wetland. Lake Peipus covers 3,555 km² and is Europe's largest transboundary
      lake, shared between Estonia and Russia, and the continent's fifth largest lake overall. Its wetland,
      Emajõe-Suursoo, is Estonia's largest mire system, formed around the nation's biggest river delta.
      Between the two, along the south-western shore, the Peipsiveere nature reserve protects 34,430 hectares
      of bogs, marshes and wild forests.
    landscape: >-
      The lake is a remnant of a larger proglacial body of water from the ice ages, its current basin sculpted
      by the Weichselian glaciation that ended roughly 12,000 years ago. It is shallow: averaging just 7.1 m
      in depth. Consequently, it warms and cools quickly: freezing between late November and early December
      and thawing between late April and early May.


      The shorelines vary remarkably. In the north and north-west stretch pine-clad dunes and sandy beaches.
      In the south, low peat shores prevail, bordered by floodplains and reedbeds that flood in spring across
      up to 1,000 km². The islands are low marshes, rising only 1-2 metres above the waterline, and also
      submerge during floods.


      In the delta of the Emajõgi—meaning "Mother River" in Estonian, rising from Lake Võrtsjärv and crossing
      the university city of Tartu—85% of the mire is open fen, with peat layers reaching up to 5.8 m thick.
      Floodplain meadows, sedge fens and swamp birch woods can be explored on foot. The flora comprises 425
      vascular plant species, 27 of which are protected, including botanical rarities like the marsh gentian,
      Siberian iris and wetland orchids.
    wildlife: >-
      Birds rule this vast landscape. Naturalists have recorded at least 176 species in Peipsiveere, 77 of
      them protected. Nesting raptors include the [white-tailed eagle](/especie/haliaeetus_albicilla/),
      [osprey](/especie/pandion_haliaetus/) and [golden eagle](/especie/aquila_chrysaetos/), alongside black
      grouse, spotted crake and the elusive [Eurasian bittern](/especie/botaurus_stellaris/). The shoreline
      wetlands provide critical feeding and staging habitat for migrating swans, geese and ducks; the lake is
      one of the premier staging grounds for [Bewick's swan](/especie/cygnus_columbianus/), arriving after
      flying some 1,600 km from the Russian Arctic.


      Among mammals, the most common are the [moose](/especie/alces_alces/), wild boar, roe deer, red fox and
      raccoon dog; the [grey wolf](/especie/canis_lupus/) and [Eurasian lynx](/especie/lynx_lynx/) also roam
      the woods, while the [brown bear](/especie/ursus_arctos/) inhabits the reserve. Along the watercourses
      live the [Eurasian otter](/especie/lutra_lutra/), [Eurasian beaver](/especie/castor_fiber/) and American
      mink. Fish fauna includes European perch, zander, bream, roach, whitefish and smelt. Rare amphibians
      include the common spadefoot and green toad.
    visit: >-
      The starting point is the Emajõe study trail, renovated in 2025/2026: a three-kilometre loop setting out
      from the former Emajõe-Suursoo nature centre at the historic Kantsi tavern. It traverses floodplain
      meadows, a sedge fen and bog birch woodland, returning to the river alongside a ditch. There are 700 m
      of 1.2 m wide boardwalk to the campfire site, another 1.3 km of narrower boardwalk, a bridge and a
      viewing platform. Interpretive signboards present the Emajõgi River, floodplain habitats and local
      wildlife. It begins beside the small car park, holding 20 cars, and the information board at the Kavastu
      entrance.


      The Emajõgi is navigable along its entire length, so the delta can also be explored by water.
    history: >-
      Across the ice of this lake, on 5 April 1242, the historic Battle on the Ice was fought between the
      Novgorod Republic and the Teutonic Order. In modern ecological terms, eutrophication remains the primary
      environmental concern. The Peipsiveere nature reserve was created on 20 December 2013 by uniting the
      protected areas of Piirissaar, the Emajõgi estuary and Emajõe-Suursoo, forming a designated Natura 2000,
      Ramsar and IBA site. Ramsar designation took place on 5 June 1997.
    before: >-
      All vehicles, motorized or non-motorized, are strictly banned along the trail. Campfires are permitted
      only at designated fire rings, and camping or open fire is forbidden on the starting green lawn. River
      flooding along the Emajõgi can render sections impassable. Park outside the gate. Best season: May to
      October.
    around: >-
      Peipsiveere has no close neighbours in the atlas, but shares habitats and species with distant northern
      nature reserves. [Vilsandi National Park and Saaremaa Sea Cliffs](/lugar/vilsandi-rahvuspark/) shares
      maritime wetlands and moose; [Ķemeri National Park](/lugar/kemeru-nacionalais-parks/) and [Curonian Spit
      National Park](/lugar/kursiu-nerijos-nacionalinis-parkas/) share vast waters, moose and white-tailed
      eagles; while [Drava River and Floodplain](/lugar/drava-river---floodplain/) shares dynamic wetlands and
      white-tailed eagles.
  fr:
    intro: >-
      Il existe un lac si vaste qu'il est partagé entre deux pays, alimenté par une rivière qui se perd avant
      son embouchure dans une zone humide de 13 000 hectares. Le lac Peïpous s'étend sur 3 555 km² et
      constitue le plus grand lac transfrontalier d'Europe, situé sur la frontière entre l'Estonie et la
      Russie, ainsi que le cinquième d'Europe par sa superficie. La zone humide, Emajõe-Suursoo, est le plus
      vaste complexe tourbeux d'Estonie, né autour du plus grand delta du pays. Entre les deux, sur la rive
      sud-ouest, la réserve naturelle de Peipsiveere protège 34 430 hectares de marais, tourbières et forêts.
    landscape: >-
      Le lac est le vestige d'une vaste nappe d'eau proglaciaire des âges glaciaires, modelé par la glaciation
      de la Vistule achevée il y a environ 12 000 ans. Il est peu profond : quelque 7,1 m de moyenne. De ce
      fait, il se réchauffe et se refroidit très vite : il gèle entre la fin novembre et le début décembre
      pour dégeler entre la fin avril et le début mai.


      Les rives changent d'aspect d'un secteur à l'autre. Au nord et au nord-ouest s'étendent dunes couvertes
      de pinèdes et plages de sable. Au sud, les rives basses et tourbeuses sont bordées de plaines inondables
      qui s'immergent au printemps sur une superficie atteignant 1 000 km². Les îles sont de bas îlots
      marécageux, émergeant de seulement 1-2 mètres au-dessus de l'eau, également inondés lors des crues.


      Dans le delta de l'Emajõgi — le « fleuve-mère » en estonien, issu du lac Võrtsjärv et traversant Tartu
      —, 85 % de la tourbière est constitué de bas-marais, avec une épaisseur de tourbe atteignant 5,8 m. Les
      prairies inondables, cariçaies et boulaies marécageuses se découvrent à pied. La flore compte 425
      espèces vasculaires, dont 27 protégées, abritant des raretés comme la gentiane des marais, l'iris de
      Sibérie et plusieurs orchidées sauvages.
    wildlife: >-
      Les oiseaux sont les maîtres des lieux. Au moins 176 espèces ont été recensées à Peipsiveere, dont 77
      protégées. Y nichent le [pygargue à queue blanche](/especie/haliaeetus_albicilla/), le [balbuzard
      pêcheur](/especie/pandion_haliaetus/) et l'[aigle royal](/especie/aquila_chrysaetos/), mais aussi le
      tétras lyre, la marouette ponctuée et le [butor étoilé](/especie/botaurus_stellaris/). Les zones humides
      côtières servent de halte migratoire essentielle pour les cygnes, oies et canards ; le lac est une
      escale majeure pour le [cygne siffleur](/especie/cygnus_columbianus/), qui arrive après avoir parcouru
      quelque 1 600 km depuis l'Arctique russe.


      Parmi les mammifères, les plus répandus sont l'[élan](/especie/alces_alces/), le sanglier, le chevreuil,
      le renard roux et le chien viverrin ; le [loup](/especie/canis_lupus/) et le [lynx
      boréal](/especie/lynx_lynx/) fréquentent les forêts, tandis que l'[ours brun](/especie/ursus_arctos/)
      réside dans la réserve. Près de l'eau vivent la [loutre d'Europe](/especie/lutra_lutra/), le [castor
      d'Europe](/especie/castor_fiber/) et le vison d'Amérique. Le lac abrite perches, sandres, brèmes,
      gardons, corégones et éperlans. Les amphibiens comptent le pélobate brun et le crapaud vert.
    visit: >-
      Le point d'accès privilégié est le sentier pédagogique de l'Emajõe, réaménagé en 2025/2026 : une boucle
      de trois kilomètres partant de l'ancienne maison de la nature d'Emajõe-Suursoo, près de l'auberge
      historique de Kantsi. Il traverse prairie inondable, cariçaie et boulaie marécageuse pour regagner le
      fleuve le long d'un fossé. On y trouve 700 m de passerelle de 1,2 m de large menant à l'aire de feu,
      puis 1,3 km de platelage étroit, un pont et un observatoire. Des panneaux didactiques présentent le
      fleuve, les espèces et les milieux alluviaux. Le départ s'effectue près du parking pour 20 voitures et
      du panneau d'accueil de Kavastu.


      L'Emajõgi étant navigable sur toute sa longueur, la découverte peut également s'effectuer au fil de
      l'eau en embarcation.
    history: >-
      Sur les glaces de ce lac s'est déroulée, le 5 avril 1242, la célèbre bataille du lac Peïpous entre la
      république de Novgorod et l'Ordre teutonique. Sur le plan écologique, l'eutrophisation constitue le défi
      majeur du lac. La réserve naturelle de Peipsiveere a été créée le 20 décembre 2013 par regroupement des
      aires protégées de Piirissaar, de l'embouchure de l'Emajõgi et d'Emajõe-Suursoo, constituant un site
      Natura 2000, Ramsar et ZICO. Le classement Ramsar date du 5 juin 1997.
    before: >-
      Tout véhicule, motorisé ou non, est strictement interdit sur le sentier. Les feux ne sont autorisés que
      sur les emplacements dédiés ; le bivouac est interdit sur la pelouse de départ. Les crues de l'Emajõgi
      peuvent submerger certains tronçons. Stationnez devant la barrière. Meilleure période : de mai à
      octobre.
    around: >-
      Peipsiveere ne possède pas de voisins proches dans l'atlas, mais partage biotopes et faune avec des
      espaces lointains. Le [Parc national de Vilsandi et falaises de Saaremaa](/lugar/vilsandi-rahvuspark/)
      partage côtes basses et élans ; le [Parc national de Ķemeri](/lugar/kemeru-nacionalais-parks/) et le
      [Parc national de l'Isthme de Courlande](/lugar/kursiu-nerijos-nacionalinis-parkas/) partagent vastes
      plans d'eau, élans et pygargues ; tandis que la [Drave et plaine
      inondable](/lugar/drava-river---floodplain/) partage zones humides et pygargues.
  de:
    intro: >-
      Es gibt einen See von solcher Weite, dass er zwei Staaten trennt, gespeist von einem Fluss, der sich vor
      seiner Mündung in einem 13.000 Hektar großen Feuchtgebiet verliert. Der Peipussee umfasst 3.555 km² und
      ist der größte grenzüberschreitende See Europas an der Grenze zwischen Estland und Russland sowie der
      fünftgrößte See des Kontinents. Sein Feuchtgebiet, Emajõe-Suursoo, ist das größte Moor Estlands und
      bildete sich um das mächtigste Flussdelta des Landes. Dazwischen schützt das Naturreservat Peipsiveere
      am Südwestufer 34.430 Hektar Moore und Auwälder.
    landscape: >-
      Der See ist das Relikt eines größeren Eisstausees, geformt durch die Weichsel-Kaltzeit, die vor rund
      12.000 Jahren endete. Er ist bemerkenswert flach: durchschnittlich nur 7,1 m tief. Entsprechend rasch
      erwärmt er sich und kühlt ab: Er friert zwischen Ende November und Anfang Dezember zu und taut zwischen
      Ende April und Anfang Mai wieder auf.


      Die Uferprofile weisen deutliche Unterschiede auf. Im Norden und Nordwesten erstrecken sich
      kiefernbewachsene Dünen und feine Sandstrände. Im Süden hingegen dominieren flache Torfufer, gesäumt von
      Überschwemmungsebenen, die im Frühjahr auf bis zu 1.000 km² überflutet werden. Die Inseln sind flache
      Feuchtbiotope, die kaum 1-2 Meter über den Wasserspiegel ragen und bei Hochwasser ebenfalls überschwemmt
      werden.


      Im Delta des Emajõgi — auf Estnisch „Mutterfluss“, der dem Võrtsjärv entspringt und die Stadt Tartu
      durchquert — bestehen 85 % des Moors aus Niedermooren mit Torfschichten von bis zu 5,8 m Mächtigkeit.
      Auenwiesen, Seggenriede und Moor-Birkenwälder lassen sich zu Fuß erkunden. Die Pflanzenwelt zählt 425
      Gefäßpflanzenarten, davon 27 geschützt, darunter Seltenheiten wie Lungen-Enzian, Sibirische Schwertlilie
      und Sumpforchideen.
    wildlife: >-
      Die Vögel beherrschen dieses Feuchtbiotop. Mindestens 176 Arten wurden in Peipsiveere nachgewiesen, von
      denen 77 unter Schutz stehen. Es brüten [Seeadler](/especie/haliaeetus_albicilla/),
      [Fischadler](/especie/pandion_haliaetus/) und [Steinadler](/especie/aquila_chrysaetos/), aber auch
      Birkhuhn, Tüpfelsumpfhuhn und [Rohrdommel](/especie/botaurus_stellaris/). Die Feuchtgebiete der Uferzone
      dienen ziehenden Schwänen, Gänsen und Enten als Rast- und Nahrungsbiotop; der See ist eine der
      wichtigsten Zwischenstationen für den [Pfeifschwan](/especie/cygnus_columbianus/), der nach rund 1.600
      km Flug aus der russischen Arktis eintrifft.


      Unter den Säugetieren sind [Elch](/especie/alces_alces/), Wildschwein, Reh, Rotfuchs und Marderhund am
      häufigsten; auch [Wolf](/especie/canis_lupus/) und [Eurasischer Luchs](/especie/lynx_lynx/)
      durchstreifen die Wälder, während der [Braunbär](/especie/ursus_arctos/) im Schutzgebiet lebt. Am Wasser
      jagen [Eurasische Fischotter](/especie/lutra_lutra/), [Europäischer Biber](/especie/castor_fiber/) und
      Mink. Im See leben Flussbarsch, Zander, Brachse, Plötze, Maräne und Stint. Seltene Amphibien sind
      Knoblauchkröte und Wechselkröte.
    visit: >-
      Ausgangspunkt ist der Lehrpfad Emajõe, erneuert 2025/2026: ein drei Kilometer langer Rundweg ab dem
      ehemaligen Naturzentrum Emajõe-Suursoo bei der historischen Schänke Kantsi. Er führt durch Auenwiesen,
      Seggenried und Moor-Birkenwald und kehrt an einem Graben zum Fluss zurück. Ein 700 m langer und 1,2 m
      breiter Bohlenweg führt zur Feuerstelle, gefolgt von 1,3 km schmalerem Bohlenweg, einer Brücke und einer
      Aussichtsplattform. Schautafeln erläutern Fluss, Arten und Auenlebensräume. Der Weg beginnt am Parkplatz
      für 20 Autos und der Infotafel bei Kavastu.


      Der Emajõgi ist auf seiner gesamten Länge schiffbar, sodass sich das Delta auch vom Wasser aus erkunden
      lässt.
    history: >-
      Auf dem Eis dieses Sees fand am 5. April 1242 die berühmte Schlacht auf dem Eise zwischen Nowgorod und
      dem Deutschen Orden statt. Ökologisch bereitet vor allem die Eutrophierung Sorgen. Das Naturreservat
      Peipsiveere entstand am 20. Dezember 2013 durch Zusammenlegung der Schutzgebiete Piirissaar,
      Emajõgi-Mündung und Emajõe-Suursoo und ist Natura-2000-, Ramsar- und IBA-Gebiet. Die Ramsar-Ausweisung
      erfolgte am 5. Juni 1997.
    before: >-
      Auf dem Lehrpfad sind alle Fahrzeuge verboten. Feuer ist nur an gekennzeichneten Stellen gestattet;
      Zelten auf der Wiese am Start ist untersagt. Hochwasser des Emajõgi kann Teilstrecken unpassierbar
      machen. Parke vor dem Tor. Beste Reisezeit: Mai bis Oktober.
    around: >-
      Peipsiveere hat keine direkten Nachbarn im Atlas, teilt aber Lebensräume mit fernen Regionen. Der
      [Nationalpark Vilsandi und Steilküsten von Saaremaa](/lugar/vilsandi-rahvuspark/) teilt
      Küstenfeuchtgebiete und Elche; der [Nationalpark Ķemeri](/lugar/kemeru-nacionalais-parks/) und der
      [Nationalpark Kurische Nehrung](/lugar/kursiu-nerijos-nacionalinis-parkas/) teilen Flachwasserseen,
      Elche und Seeadler; und die [Drau und Überschwemmungsebene](/lugar/drava-river---floodplain/) teilt
      dynamische Flussauen und Seeadler.
  it:
    intro: >-
      C'è un lago talmente grande da dividere due nazioni, alimentato da un fiume che prima di sfociare si
      disperde in una zona umida di 13.000 ettari. Il lago Peipus misura 3.555 km² ed è il maggiore bacino
      transfrontaliero d'Europa, condiviso tra Estonia e Russia, nonché il quinto del continente per
      estensione. L'area umida, Emajõe-Suursoo, è la più vasta palude dell'Estonia, formata attorno al
      principale delta fluviale del paese. Tra i due ambienti, sulla riva sud-occidentale, la riserva di
      Peipsiveere protegge 34.430 ettari di torbiere e foreste.
    landscape: >-
      Il lago è il relitto di un grande bacino proglaciale dell'Era Glaciale, modellato dalla glaciazione
      weichseliana terminata circa 12.000 anni fa. È poco profondo: 7,1 m di media. Per questa ragione si
      scalda e si raffredda molto rapidamente: gela tra fine novembre e inizio dicembre e disgela tra fine
      aprile e inizio maggio.


      Le coste differiscono sensibilmente da un versante all'altro. A nord e a nord-ovest corrono dune boscate
      a pino e spiagge sabbiose. A sud, invece, le sponde basse e torbose sono cinte da pianure alluvionali
      che in primavera si allagano fino a 1.000 km². Le isole sono basse zone umide emerse di appena 1-2 metri
      sopra il livello idrico, sommerse durante le piene.


      Nel delta dell'Emajõgi — il «fiume madre» in estone, che sgorga dal lago Võrtsjärv e attraversa Tartu —,
      l'85% della torbiera è costituito da bassura umida con strati di torba spessi fino a 5,8 m. Le piane
      alluvionali, le distese di carici e le boscaglie di betulla palustre si visitano a piedi. La flora
      annovera 425 specie vascolari, di cui 27 protette, tra cui spiccano rarità come la genziana palustre,
      l'iris siberiana e orchidee acquatiche.
    wildlife: >-
      Gli uccelli sono i veri dominatori. Sono state censite almeno 176 specie a Peipsiveere, di cui 77
      rigorosamente protette. Nidificano l'[aquila di mare](/especie/haliaeetus_albicilla/), il [falco
      pescatore](/especie/pandion_haliaetus/) e l'[aquila reale](/especie/aquila_chrysaetos/), oltre al
      fagiano di monte, alla voltolino e al [tarabuso](/especie/botaurus_stellaris/). Le fasce perilacustri
      costituiscono aree di sosta e nutrizione vitali per cigni, oche e anatre migratrici; il lago rappresenta
      una tappa cardine per il [cigno minore](/especie/cygnus_columbianus/), che giunge qui dopo un volo di
      1.600 km dall'Artico russo.


      Tra i mammiferi primeggiano l'[alce](/especie/alces_alces/), il cinghiale, il capriolo, la volpe e il
      cane procione; il [lupo grigio](/especie/canis_lupus/) e la [lince europea](/especie/lynx_lynx/)
      frequentano le foreste, mentre l'[orso bruno](/especie/ursus_arctos/) risiede nella riserva. Presso
      l'acqua vivono la [lontra europea](/especie/lutra_lutra/), il [castoro europeo](/especie/castor_fiber/)
      e il visone americano. Nel lago abbondano pesce persico, luccioperca, brama, rutilo, coregone e
      sperlano. Tra gli anfibi si annoverano pelobate fosco e rospo smeraldino.
    visit: >-
      Il punto d'avvio è il percorso didattico dell'Emajõe, rinnovato nel 2025/2026: un anello di tre
      chilometri che muove dalla vecchia casa del parco di Emajõe-Suursoo presso la storica locanda di Kantsi.
      Attraversa golene alluvionali, praterie di carici e boschi di betulla di palude, costeggiando un canale
      fino al fiume. Si snodano 700 m di passerella larga 1,2 m fino all'area fuoco, poi altri 1,3 km di
      tavolato più stretto, un ponte e una torretta d'osservazione. I pannelli illustrano l'Emajõgi, le specie
      e gli ambienti ripariali. Parte dal parcheggio per 20 automobili e dal pannello informativo di Kavastu.


      L'Emajõgi è interamente navigabile, consentendo di esplorare il delta anche dal pelo dell'acqua.
    history: >-
      Sulle acque ghiacciate del lago si combatté, il 5 aprile 1242, la battaglia del ghiaccio tra Novgorod e
      i Cavalieri Teutonici. Dal punto di vista ecologico, l'eutrofizzazione costituisce il fenomeno più
      critico. La riserva di Peipsiveere è nata il 20 dicembre 2013 unificando le aree protette di Piirissaar,
      dell'estuario dell'Emajõgi e di Emajõe-Suursoo, classificata Natura 2000, Ramsar e IBA. L'iscrizione
      Ramsar risale al 5 giugno 1997.
    before: >-
      Lungo il percorso è severamente vietato qualsiasi veicolo. È consentito accendere fuochi esclusivamente
      nelle postazioni predisposte; campeggio vietato sul prato d'accesso. Le piene dell'Emajõgi possono
      allagare alcuni tratti. Parcheggia all'esterno della sbarra. Periodo consigliato: da maggio a ottobre.
    around: >-
      Peipsiveere non ha vicini prossimi nell'atlante, ma condivide biotopi e fauna con altre riserve
      settentrionali. Il [Parco Nazionale di Vilsandi e Falesie Costiere di
      Saaremaa](/lugar/vilsandi-rahvuspark/) condivide litorali e alci; il [Parco Nazionale di
      Ķemeri](/lugar/kemeru-nacionalais-parks/) e il [Parco Nazionale dell'Istmo di
      Curlandia](/lugar/kursiu-nerijos-nacionalinis-parkas/) condividono laghi, alci e aquile di mare; mentre
      il [Fiume Drava e Piana Alluvionale](/lugar/drava-river---floodplain/) condivide zone umide e aquile di
      mare.
  pt:
    intro: >-
      Há um lago tão imenso que se divide entre dois países, abastecido por um rio que se perde antes de
      desaguar num pantanal de 13.000 hectares. O lago Peipus estende-se por 3.555 km² e é o maior lago
      transfronteiriço da Europa, na fronteira entre a Estónia e a Rússia, sendo o quinto maior lago de todo o
      continente. O seu pantanal, Emajõe-Suursoo, é o maior sistema de turfeiras da Estónia, moldado em redor
      do maior delta fluvial do país. Entre ambos, na margem sudoeste, a reserva de Peipsiveere salvaguarda
      34.430 hectares de sapais e florestas virgens.
    landscape: >-
      O lago é um vestígio de uma bacia proglaciar maior das eras glaciares, talhado pela glaciação de
      Weichsel terminada há cerca de 12.000 anos. É bastante raso: tem em média apenas 7,1 m de profundidade.
      Por esse motivo aquece e arrefece velozmente: congela entre o final de novembro e o início de dezembro,
      degelando entre finais de abril e princípios de maio.


      As margens exibem contrastes vincados. No norte e noroeste estendem-se dunas arborizadas com pinhais e
      praias de areia. No sul, em contrapartida, as margens baixas e turfosas são marginadas por planícies
      aluviais que inundam na primavera até 1.000 km². As ilhas são sapais rasos, elevando-se meros 1-2 metros
      acima da lâmina de água, ficando igualmente submersas nas cheias.


      No delta do Emajõgi — o «rio-mãe» em estónio, que nasce no lago Võrtsjärv e banha Tartu —, 85% do sapal
      é turfeira baixa com bancadas de turfa de até 5,8 m de espessura. Os prados inundáveis, as pastagens de
      ciperáceas e os vidoais pantanosos exploram-se a pé. A flora agrega 425 espécies vasculares, 27 delas
      sob proteção, sobressaindo raridades como a genciana-dos-pântanos, a íris-siberiana e orquídeas bravias.
    wildlife: >-
      As aves governam a paisagem. Registraram-se pelo menos 176 espécies em Peipsiveere, 77 das quais
      protegidas. Nidificam a [águia-rabalva](/especie/haliaeetus_albicilla/), a
      [águia-pesqueira](/especie/pandion_haliaetus/) e a [águia-real](/especie/aquila_chrysaetos/), mas também
      o galo-lira, a franga-d'água-malhada e o [abetouro-comum](/especie/botaurus_stellaris/). Os sapais
      costeiros servem de escala e sustento para cisnes, gansos e patos migradores; o lago é um pouso
      determinante para o [cisne-pequeno](/especie/cygnus_columbianus/), que chega após voar cerca de 1.600 km
      desde o Ártico russo.


      Nos mamíferos sobressaem o [alce](/especie/alces_alces/), o javali, o corço, a raposa e o cão-mapache; o
      [lobo-cinzento](/especie/canis_lupus/) e o [lince-euroasiático](/especie/lynx_lynx/) vagueiam pelas
      florestas, enquanto o [urso-pardo](/especie/ursus_arctos/) habita a reserva. Junto à água vivem a
      [lontra-europeia](/especie/lutra_lutra/), o [castor-europeu](/especie/castor_fiber/) e o
      visão-americano. Na fauna piscícola contam-se perca, lúcio-perca, brema, robalote, corégono e
      biqueirão-do-rio. Nos anfíbios figuram o sapo-de-unha-negra e o sapo-verde.
    visit: >-
      O ponto de partida é o trilho didático do Emajõe, renovado em 2025/2026: um circuito de três quilómetros
      com início na antiga sede da natureza de Emajõe-Suursoo, na histórica taberna Kantsi. Percorre pradarias
      inundáveis, sapais de ciperáceas e vidoais, regressando ao rio junto a uma vala. Estendem-se 700 m de
      passadiço com 1,2 m de largura até ao parque de merendas, outros 1,3 km de passadiço estreito, uma ponte
      e uma plataforma de observação. Painéis explicativos descrevem o rio Emajõgi, a fauna e a vegetação
      ribeirinha. Começa junto ao pequeno parque para 20 viaturas e ao painel de Kavastu.


      O Emajõgi é inteiramente navegável, permitindo descobrir o delta igualmente a partir da água.
    history: >-
      Sobre o gelo deste lago travou-se, a 5 de abril de 1242, a histórica Batalha do Gelo entre Novgorod e a
      Ordem Teutónica. Do ponto de vista ambiental, o maior desafio reside na eutrofização. A reserva de
      Peipsiveere foi formalizada a 20 de dezembro de 2013 agrupando as áreas protegidas de Piirissaar, da foz
      do Emajõgi e de Emajõe-Suursoo, integrando a rede Natura 2000, Ramsar e IBA. A classificação Ramsar
      ocorreu a 5 de junho de 1997.
    before: >-
      No trilho é expressamente proibida a circulação de veículos. Só é permitido fazer fogo nas fogueiras
      sinalizadas, sendo proibido acampar no relvado inicial. As cheias do Emajõgi podem alagar alguns troços.
      Estaciona fora do portão. Melhor época: de maio a outubro.
    around: >-
      Peipsiveere não dispõe de vizinhos imediatos no atlas, mas partilha ecossistemas e fauna com paragens
      boreais. O [Parque Nacional de Vilsandi e Arribas Costeiras de Saaremaa](/lugar/vilsandi-rahvuspark/)
      partilha zonas húmidas e alces; o [Parque Nacional de Ķemeri](/lugar/kemeru-nacionalais-parks/) e o
      [Parque Nacional do Cordão de Curlandia](/lugar/kursiu-nerijos-nacionalinis-parkas/) partilham alces e
      águias-rabalvas; e o [Rio Drava e Planície Aluvial](/lugar/drava-river---floodplain/) partilha zonas
      húmidas fluviais e águias-rabalvas.
