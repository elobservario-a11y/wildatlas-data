resumen:
  es: El 'Amazonas del Norte', uno de los últimos valles fluviales de turbera no canalizados de Europa Central.
  en: The 'Amazon of the North', one of Central Europe's last unchannelized peatland river valleys.
  fr: L'« Amazone du Nord », l'une des dernières vallées fluviales tourbeuses non canalisées d'Europe centrale.
  de: Der 'Amazonas des Nordens', eines der letzten unbegradigten Flusstalmoore Mitteleuropas.
  it: L'«Amazzonia del Nord», una delle ultime valli fluviali torbose non canalizzate dell'Europa centrale.
  pt: O 'Amazonas do Norte', um dos últimos vales fluviais de turfeira não canalizados da Europa Central.
unico:
  es: >-
    Un valle donde crece lo que casi ya no crece en ningún sitio: orquídeas que solo hay en Alemania aquí, las
    tres águilas de la región y un río con nutrias y castores por todas partes.
  en: >-
    A valley where species grow that hardly thrive anywhere else: orchids found in Germany only here, all
    three regional eagles, and a river with otters and beavers everywhere.
  fr: >-
    Une vallée où pousse ce qui ne subsiste presque nulle part ailleurs : des orchidées uniques en Allemagne,
    les trois aigles régionaux et une rivière foisonnant de loutres et de castors.
  de: >-
    Ein Flusstal, in dem wächst, was fast nirgendwo mehr gedeiht: Orchideen, die es deutschlandweit nur hier
    gibt, alle drei Adler der Region und ein Fluss voller Fischotter und Biber.
  it: >-
    Una valle in cui vegeta ciò che ormai è quasi scomparso altrove: orchidee che in Germania crescono solo
    qui, le tre aquile regionali e un fiume popolato da lontre e castori.
  pt: >-
    Um vale onde cresce o que quase já não sobrevive em parte alguma: orquídeas que só existem na Alemanha
    aqui, as três águias da região e um rio povoado de lontras e castores por todo o lado.
observaciones:
  es: >-
    En las reservas naturales no hay que salirse de los caminos, a pie, en bici o a caballo. El espacio aéreo
    es de las aves: los drones y aeronaves están prohibidos. En las reservas siempre hay que contar con caída
    de árboles y ramas; se entra bajo la propia responsabilidad.
texto:
  es:
    intro: >-
      Un río que no sabe en qué dirección ir. El Peene corre a menudo tan despacio que apenas se mueve, y a
      veces incluso fluye hacia el oeste. La razón está en su origen: nació hace unos 10.000 años, al final de
      la glaciación del Weichsel, como canal de agua de deshielo, y cuando el hielo perdió peso, el terreno se
      levantó y se hundió y el río invirtió su dirección hasta correr hacia el este. De ese cauce casi parado
      nació un valle de turbera: el parque natural Flusslandschaft Peenetal, en Mecklemburgo-Pomerania
      Occidental, a lo largo del Peene entre Dargun, Demmin, Loitz, Jarmen, Gützkow y Anklam. Es el valle
      fluvial más original de todo el norte de Alemania, y uno de los mayores territorios continuos de turbera
      baja de Europa central y occidental.
    landscape: >-
      Un río casi parado deja que se acumule la vida. Con el agua quieta, el valle se fue colmatando, y así se
      formó una turbera típica de valle fluvial, con turberas de manantial en los bordes, turberas de flujo y
      turberas inundables junto al río o la costa. El río recorre cerca de cien kilómetros desde el lago
      Kummerow hasta el Peenestrom, por un valle de uno a dos kilómetros de ancho.


      A los lados, el valle cambia. Las laderas secas de los bordes son ricas y coloridas sobre todo a finales
      de primavera y principios de verano, y en ellas crecen elementos de estepa ligados al sistema del Óder,
      como la pulsatila de prado. Abajo, en las turberas, hay tantas plantas raras que dos orquídeas, el
      Ostsee-Knabenkraut y el Baltische Knabenkraut, solo se encuentran en Alemania en el Peenetal. En total
      se han registrado unas 750 plantas con flor y helechos.
    wildlife: >-
      Las aves son la gran razón para venir. Crían las tres águilas de Mecklemburgo-Pomerania Occidental: el
      [águila pescadora](/especie/pandion_haliaetus/), el [pigargo](/especie/haliaeetus_albicilla/) y el
      escaso [águila pomerana](/especie/aquila_pomarina/). Desde la restauración han aumentado la polluela
      pintoja, el [guión de codornices](/especie/crex_crex/), la agachadiza, la avefría, la [aguja
      colinegra](/especie/limosa_limosa/), el [combatiente](/especie/philomachus_pugnax/), el [zarapito
      real](/especie/numenius_arquata/), el [avetoro](/especie/botaurus_stellaris/), los fumareles y
      charranes, la gaviota reidora y el cisne vulgar. Desde que se abrieron los pólderes, la vega ha ganado
      mucho como área de paso y descanso de patos, gansos, cisnes, avefrías, chorlitos dorados, rálidos y
      somormujos.


      En el agua, el valle es famoso por la [nutria](/especie/lutra_lutra/) y el
      [castor](/especie/castor_fiber/): grandes poblaciones repartidas por todo el territorio. Si quieres ver
      un castor, búscalo en el Peene en verano, al anochecer. Unas 40 especies de mamíferos viven en el valle,
      y entre las de protección europea está la escasa barbastela. De las 51 especies de peces de agua dulce y
      migradoras autóctonas de Mecklemburgo-Pomerania Occidental, 37 viven con regularidad en el sistema del
      Peene, y entre ellas destacan la lamprea de río, la lamprehuela, el pez lodo, el amarguillo y el
      [salmón](/especie/salmo_salar/). La vega alberga además unos dos tercios de las especies de mariposas
      diurnas de la región, y es el único lugar de la llanura alemana con el escarabajo Menetries-Laufkäfer.
    visit: >-
      Empieza en la casa del parque de Stolpe an der Peene. Su exposición, con elementos interactivos,
      maquetas y paneles, explica los animales, las plantas y la historia del parque, y allí el personal ayuda
      a planificar rutas a pie, en bici o en piragua. Para los piragüistas, un mapa del Nordland-Verlag recoge
      todos los lugares de descanso, los kilómetros del río, los miradores y las torres de observación.


      Tres torres y plataformas de observación fueron reparadas; dan acceso a un lugar de descanso muy querido
      junto al Peene, en Dersewitz, y a un sendero muy concurrido en Menzlin. La navegación por el Peene está
      permitida, pero en el espacio protegido solo se puede amarrar en puntos oficiales de descanso. Dentro
      del área protegida, el anclaje solo se permite fuera de las plantas acuáticas flotantes y no se puede
      acampar. Además, el área puede recorrerse por senderos señalizados desde varios puntos.
    history: >-
      Hasta mediados del siglo XIX el uso agrario fue escaso, y hasta 1900 la extracción de turba para quemar
      llegó a pesar más que la agricultura. Entre 1992 y 2009 se llevó a cabo en el valle uno de los mayores
      proyectos de conservación de Alemania: buscaba recuperar la turbera de valle como un cuerpo de turba
      vivo, mejorando la hidrología y desmantelando los pólderes, que habían sido el principal obstáculo para
      declarar reservas naturales sin cortes. Las turberas básicas calcáreas están hoy muy amenazadas y su
      principal refugio está en el Peenetal.
    before: >-
      En las reservas naturales no hay que salirse de los caminos, a pie, en bici o a caballo. El espacio
      aéreo es de las aves: los drones y aeronaves están prohibidos. En las reservas siempre hay que contar
      con caída de árboles y ramas; se entra bajo la propia responsabilidad.
    around: >-
      A veintiséis kilómetros está el [Parque Nacional de Wolin y Delta del Río
      Świna](/lugar/wolinski-park-narodowy---delta-swiny/).
  en:
    intro: >-
      A river that hardly knows which way to go. The Peene often flows so slowly that it barely seems to move
      at all, and at times it even flows westward. The reason lies in its origins: it formed around 10,000
      years ago at the end of the Weichselian glaciation as a meltwater channel, and when the ice sheet
      receded, the ground rebounded and subsided, causing the river to reverse course and flow eastward. From
      that almost motionless channel arose a fen peatland valley: the Flusslandschaft Peenetal Nature Park in
      Mecklenburg-Western Pomerania, along the Peene between Dargun, Demmin, Loitz, Jarmen, Gützkow, and
      Anklam. It is the most pristine river valley in all of northern Germany and one of the largest
      contiguous lowland fen peatlands in Central and Western Europe.
    landscape: >-
      An almost stagnant river lets life accumulate. With calm waters, the valley gradually silted up, forming
      a textbook river valley peatland with spring mires along the edges, percolating fens, and flood fens
      along the river and coast. The river winds for nearly one hundred kilometers from Lake Kummerow to the
      Peenestrom, through a valley one to two kilometers wide.


      Along the flanks, the valley changes character. The dry slopes at the valley edges are rich and
      colorful, especially in late spring and early summer, supporting steppe elements tied to the Oder system
      such as the meadow pasqueflower. Down in the fens, rare plants abound to the point that two orchids, the
      Ostsee-Knabenkraut and the Baltische Knabenkraut, are found in Germany only within the Peenetal. In
      total, around 750 flowering plants and ferns have been recorded.
    wildlife: >-
      Birds are the primary reason to visit. All three eagle species of Mecklenburg-Western Pomerania breed
      here: the [osprey](/especie/pandion_haliaetus/), the [white-tailed
      eagle](/especie/haliaeetus_albicilla/), and the scarce [lesser spotted
      eagle](/especie/aquila_pomarina/). Since ecological restoration, numbers have risen for spotted crake,
      [corn crake](/especie/crex_crex/), common snipe, northern lapwing, [black-tailed
      godwit](/especie/limosa_limosa/), [ruff](/especie/philomachus_pugnax/), [Eurasian
      curlew](/especie/numenius_arquata/), [Eurasian bittern](/especie/botaurus_stellaris/), marsh and black
      terns, black-headed gull, and mute swan. Since the polders were opened, the floodplain has become a
      vital stopover and resting area for ducks, geese, swans, lapwings, golden plovers, rails, and grebes.


      In the water, the valley is famed for the [Eurasian otter](/especie/lutra_lutra/) and the [Eurasian
      beaver](/especie/castor_fiber/): large populations thrive throughout the territory. If you want to spot
      a beaver, look along the Peene on summer evenings at dusk. Around 40 mammal species inhabit the valley,
      including the barbastelle bat, protected under European law. Of the 51 native freshwater and migratory
      fish species in Mecklenburg-Western Pomerania, 37 regularly live in the Peene system, notable among them
      river lamprey, spined loach, mudminnow, bitterling, and [Atlantic salmon](/especie/salmo_salar/). The
      floodplain also hosts roughly two-thirds of the region's diurnal butterfly species and is the only
      location in the North German Plain with the Menetries ground beetle.
    visit: >-
      Start at the park center in Stolpe an der Peene. Its exhibition, featuring interactive displays, scale
      models, and informational panels, details the park's wildlife, plants, and history, with staff on hand
      to help plan hiking, cycling, or canoeing routes. For canoeists, a specialized Nordland-Verlag map
      details all rest areas, river kilometers, scenic viewpoints, and bird observation towers.


      Three observation towers and platforms have been restored; they provide access to a beloved rest area
      along the Peene in Dersewitz and a popular trail in Menzlin. Boating on the Peene is permitted, but
      inside the protected area mooring is allowed only at official resting spots. Within the reserve,
      anchoring is permitted only clear of floating aquatic vegetation, and camping is forbidden. The valley
      can also be explored along marked hiking trails from multiple access points.
    history: >-
      Until the mid-nineteenth century, agricultural use was sparse, and until 1900 peat cutting for fuel was
      more significant than farming. Between 1992 and 2009, one of Germany's largest nature conservation
      projects was carried out in the valley: it sought to restore the fen valley into a living peat body by
      enhancing hydrology and dismantling polders, which had been the main obstacle to establishing
      uninterrupted nature reserves. Alkaline fens are critically endangered today, and their primary refuge
      is the Peenetal.
    before: >-
      In nature reserves you must stay on designated paths whether on foot, bicycle, or horseback. The
      airspace belongs to birds: drones and aircraft are prohibited. In nature reserves you must always expect
      falling trees and branches; entry is at your own risk.
    around: >-
      Twenty-six kilometers away lies [Wolin National Park and the Świna River
      Delta](/lugar/wolinski-park-narodowy---delta-swiny/).
  fr:
    intro: >-
      Une rivière qui hésite sur la direction à prendre. La Peene coule souvent si lentement qu'elle semble
      immobile, et s'écoule parfois même vers l'ouest. Cette particularité s'explique par son origine : elle
      est née il y a environ 10 000 ans, à la fin de la glaciation vistulienne, comme chenal d'eau de fonte
      glaciaire ; lorsque la calotte a fondu, le sol s'est soulevé et affaissé, inversant le cours d'eau pour
      le diriger vers l'est. De ce lit presque stagnant est née une vallée de tourbière basse : le parc
      naturel Flusslandschaft Peenetal, en Mecklembourg-Poméranie-Occidentale, le long de la Peene entre
      Dargun, Demmin, Loitz, Jarmen, Gützkow et Anklam. C'est la vallée fluviale la plus sauvage de tout le
      nord de l'Allemagne et l'une des plus vastes tourbières basses continues d'Europe centrale et
      occidentale.
    landscape: >-
      Une rivière presque immobile permet à la vie de s'épanouir en abondance. Les eaux calmes ont comblé la
      vallée au fil des millénaires, formant une tourbière de vallée fluviale typique, avec tourbières de
      source sur les marges, tourbières d'écoulement et zones inondables le long du fleuve et du littoral. La
      rivière serpente sur près de cent kilomètres depuis le lac Kummerow jusqu'au Peenestrom, dans une vallée
      large de un à deux kilomètres.


      Sur les flancs, le paysage se transforme. Les coteaux secs des bordures sont riches et colorés, surtout
      à la fin du printemps et au début de l'été, abritant des éléments steppiques liés au bassin de l'Oder
      comme la pulsatille des prés. En bas, dans les tourbières, les plantes rares abondent à tel point que
      deux orchidées, l'Ostsee-Knabenkraut et le Baltische Knabenkraut, ne poussent en Allemagne que dans le
      Peenetal. Au total, environ 750 espèces de plantes à fleurs et de fougères y ont été recensées.
    wildlife: >-
      L'avifaune constitue le motif premier d'une visite. Les trois aigles de
      Mecklembourg-Poméranie-Occidentale y nichent : le [balbuzard pêcheur](/especie/pandion_haliaetus/), le
      [pygargue à queue blanche](/especie/haliaeetus_albicilla/) et le rare [aigle
      pomarin](/especie/aquila_pomarina/). Depuis les restaurations écologiques, les effectifs ont progressé
      pour la marouette ponctuée, le [râle des genêts](/especie/crex_crex/), la bécassine des marais, le
      vanneau huppé, la [barge à queue noire](/especie/limosa_limosa/), le [combattant
      varié](/especie/philomachus_pugnax/), le [courlis cendré](/especie/numenius_arquata/), le [butor
      étoilé](/especie/botaurus_stellaris/), les guifettes et sternes, la mouette rieuse et le cygne
      tuberculé. Depuis la déconnexion des polders, la plaine inondable est devenue une halte de repos majeure
      pour canards, oies, cygnes, vanneaux, pluviers dorés, râles et grèbes.


      Dans l'eau, la vallée est réputée pour la [loutre d'Europe](/especie/lutra_lutra/) et le [castor
      d'Europe](/especie/castor_fiber/), présents en populations denses sur tout le cours d'eau. Si vous
      espérez apercevoir un castor, cherchez-le sur la Peene en été au crépuscule. Environ 40 espèces de
      mammifères peuplent la vallée, parmi lesquelles la barbastelle commune, protégée au niveau européen. Sur
      les 51 espèces de poissons d'eau douce et migrateurs indigènes de la région, 37 fréquentent
      régulièrement le bassin de la Peene, notamment la lamproie de rivière, la loche épineuse, l'umbre
      d'Europe, la bouvière et le [saumon atlantique](/especie/salmo_salar/). La plaine alluviale héberge en
      outre deux tiers des papillons de jour de la région et constitue l'unique station en plaine allemande du
      carabe Menetries-Laufkäfer.
    visit: >-
      Commencez par la maison du parc à Stolpe an der Peene. Son exposition, enrichie de maquettes, d'éléments
      interactifs et de panneaux pédagogiques, détaille la faune, la flore et l'histoire locale, et le
      personnel vous aide à concevoir vos parcours à pied, à vélo ou en canoë. Pour les pagayeurs, une carte
      éditée par Nordland-Verlag répertorie tous les points de bivouac, les kilomètres fluviaux, les
      belvédères et les tours d'observation.


      Trois tours et plates-formes d'observation ont été rénovées ; elles permettent d'accéder à une halte
      nautique prisée à Dersewitz et à un sentier très fréquenté à Menzlin. La navigation sur la Peene est
      autorisée, mais l'amarrage n'est permis que sur les aires de halte officielles. Au sein de la zone
      protégée, le mouillage n'est permis qu'à distance des herbiers aquatiques flottants, et le camping
      sauvage est prohibé. La vallée se découvre également grâce à des sentiers balisés au départ de plusieurs
      localités.
    history: >-
      Jusqu'au milieu du XIXe siècle, l'exploitation agricole fut très limitée, et jusqu'en 1900 l'extraction
      de tourbe pour le chauffage surpassait l'agriculture. Entre 1992 et 2009, la vallée a accueilli l'un des
      plus grands projets de conservation de la nature en Allemagne : il visait à restaurer la tourbière comme
      un écosystème vivant en améliorant l'hydrologie et en démantelant les digues de polders qui empêchaient
      la création de réserves continues. Les tourbières alcalines sont aujourd'hui très menacées et trouvent
      dans le Peenetal leur sanctuaire principal.
    before: >-
      Dans les réserves naturelles, il est interdit de quitter les sentiers balisés, que ce soit à pied, à
      vélo ou à cheval. L'espace aérien est réservé aux oiseaux : les drones et aéronefs sont formellement
      proscrits. En réserve naturelle, il faut toujours anticiper les chutes de branches ou d'arbres ; l'accès
      s'effectue sous votre propre responsabilité.
    around: >-
      À vingt-six kilomètres se trouve le [parc national de Wolin et le delta de la
      Świna](/lugar/wolinski-park-narodowy---delta-swiny/).
  de:
    intro: >-
      Ein Fluss, der nicht weiß, in welche Richtung er fließen soll. Die Peene strömt oft so träge, dass sie
      kaum fließt, und zuweilen kehrt sich die Strömung sogar nach Westen um. Die Ursache liegt in ihrer
      Entstehung: Sie bildete sich vor etwa 10.000 Jahren am Ende der Weichsel-Kaltzeit als
      Schmelzwasserrinne; als die Eislast schwand, hob und senkte sich der Untergrund, sodass der Fluss seine
      Richtung nach Osten umkehrte. Aus diesem fast stehenden Gewässerlauf entstand ein Niedermoortal: der
      Naturpark Flusslandschaft Peenetal in Mecklenburg-Vorpommern, entlang der Peene zwischen Dargun, Demmin,
      Loitz, Jarmen, Gützkow und Anklam. Es ist das ursprünglichste Flusstal ganz Norddeutschlands und eines
      der größten zusammenhängenden Niedermoorgebiete Mittel- und Westeuropas.
    landscape: >-
      Ein fast stehender Fluss lässt das Leben aufleben. Durch die geringe Strömung verlandete das Tal nach
      und nach und formte ein typisches Flusstalmoor mit Quellmooren an den Rändern, Durchströmungsmooren und
      Überflutungsmooren entlang des Flusslaufs und der Küste. Der Fluss legt vom Kummerower See bis zum
      Peenestrom fast einhundert Kilometer zurück, in einem ein bis zwei Kilometer breiten Tal.


      An den Talflanken wechselt die Landschaft. Die trockenen Hänge der Talränder sind vor allem im
      Spätfrühling und Frühsommer bunt und artenreich, bewachsen mit Steppenelementen des Odersystems wie der
      Wiesen-Küchenschelle. Unten in den Mooren gibt es derart viele seltene Pflanzen, dass zwei
      Orchideenarten – das Ostsee-Knabenkraut und das Baltische Knabenkraut – bundesweit nur im Peenetal
      vorkommen. Insgesamt wurden rund 750 Farn- und Blütenpflanzen nachgewiesen.
    wildlife: >-
      Die Vogelwelt ist der herausragende Besuchsgrund. Alle drei Adlerarten Mecklenburg-Vorpommerns brüten
      hier: [Fischadler](/especie/pandion_haliaetus/), [Seeadler](/especie/haliaeetus_albicilla/) und der
      seltene [Schreiadler](/especie/aquila_pomarina/). Seit der Renaturierung haben Tüpfelsumpfhuhn,
      [Wachtelkönig](/especie/crex_crex/), Bekassine, Kiebitz, [Uferschnepfe](/especie/limosa_limosa/),
      [Kampfläufer](/especie/philomachus_pugnax/), [Großer Brachvogel](/especie/numenius_arquata/),
      [Rohrdommel](/especie/botaurus_stellaris/), Seeschwalben, Lachmöwen und Höckerschwäne zugenommen. Seit
      der Polderöffnung dient die Aue Enten, Gänsen, Schwänen, Kiebitzen, Goldregenpfeifern, Rallen und
      Lappentauchern als erstklassiges Rast- und Mausergebiet.


      Im Wasser ist das Tal berühmt für [Eurasischen Fischotter](/especie/lutra_lutra/) und [Europäischen
      Biber](/especie/castor_fiber/), die mit dichten Beständen überall im Gebiet heimisch sind. Wenn du einen
      Biber sehen möchtest, halte im Sommer in der Abenddämmerung an der Peene Ausschau. Rund 40
      Säugetierarten leben im Tal, darunter die europaweit geschützte Mopsfledermaus. Von den 51 heimischen
      Süßwasser- und Wanderfischarten Mecklenburg-Vorpommerns leben 37 regelmäßig im Peenesystem, darunter
      Flussneunauge, Steinbeißer, Schlammpeitzger, Bitterling und [Atlantischer Lachs](/especie/salmo_salar/).
      Die Aue beheimatet zudem etwa zwei Drittel aller Tagfalterarten des Bundeslandes und ist der einzige
      Fundort des Menetries-Laufkäfers im norddeutschen Tiefland.
    visit: >-
      Beginne deinen Besuch im Naturparkzentrum in Stolpe an der Peene. Die Ausstellung mit interaktiven
      Elementen, Modellen und Schautafeln veranschaulicht Flora, Fauna und Parkgeschichte; das Team vor Ort
      berät bei Wander-, Rad- oder Kanutouren. Für Wasserwanderer verzeichnet eine Spezialkarte des
      Nordland-Verlags sämtliche Rastplätze, Flusskilometer, Aussichtspunkte und Beobachtungstürme.


      Drei Aussichtstürme und Plattformen wurden erneuert; sie erschließen einen beliebten Rastplatz an der
      Peene in Dersewitz und einen gut frequentierten Wanderweg in Menzlin. Das Befahren der Peene mit Booten
      ist erlaubt, im Schutzgebiet darf jedoch nur an ausgewiesenen Wasserwanderrastplätzen angelegt werden.
      Im Schutzgebiet ist das Ankern nur außerhalb von Schwimmblattzonen zulässig, Zelten ist untersagt. Das
      Tal lässt sich außerdem über markierte Wanderwege von verschiedenen Orten aus erkunden.
    history: >-
      Bis zur Mitte des neunzehnten Jahrhunderts war die landwirtschaftliche Nutzung gering, und bis 1900 wog
      der Torfabbau als Brennstoff schwerer als der Ackerbau. Zwischen 1992 und 2009 wurde im Tal eines der
      größten Naturschutzgroßprojekte Deutschlands umgesetzt: Ziel war die Wiederherstellung des
      Flusstalmoores als lebendiger Moorkörper durch hydrodynamische Optimierung und Polderrückbau, da
      Polderdeiche unzerschnittenen Naturschutzgebieten im Weg gestanden hatten. Basenreiche Kalk-Niedermoore
      sind heute akut gefährdet und finden im Peenetal ihr bundesweit wichtigstes Refugium.
    before: >-
      In den Naturschutzgebieten darfst du die Wege zu Fuß, per Rad oder zu Pferd nicht verlassen. Der
      Luftraum gehört den Vögeln: Drohnen und Luftfahrzeuge sind verboten. In den Schutzgebieten muss stets
      mit herabfallenden Ästen und umstürzenden Bäumen gerechnet werden; das Betreten erfolgt auf eigene
      Gefahr.
    around: >-
      Sechsundzwanzig Kilometer entfernt liegt der [Nationalpark Wolin und das
      Swinedelta](/lugar/wolinski-park-narodowy---delta-swiny/).
  it:
    intro: >-
      Un fiume che fatica a scegliere la propria direzione. La Peene scorre spesso così piano da sembrare
      immobile, e talvolta inverte persino la corrente fluendo verso ovest. Il motivo risiede nella sua
      origine: si è formata circa 10.000 anni fa, al termine della glaciazione vistoliana, come canale di
      deflusso delle acque di disgelo; quando il peso della coltre glaciale è svanito, il suolo si è sollevato
      e assestato, inducendo il corso d'acqua a invertire la direzione verso est. Da quell'alveo quasi
      stagnante ha preso vita una valle di torbiera bassa: il parco naturale Flusslandschaft Peenetal, nel
      Meclemburgo-Pomerania Anteriore, lungo la Peene tra Dargun, Demmin, Loitz, Jarmen, Gützkow e Anklam. È
      la valle fluviale più incontaminata di tutta la Germania settentrionale e una delle maggiori torbiere
      basse continue dell'Europa centrale e occidentale.
    landscape: >-
      Un corso d'acqua quasi immobile consente alla vita di accumularsi indisturbata. Con acque così calme, la
      valle si è progressivamente colmata nel tempo, originando una torbiera valliva tipica con sorgenti
      torbose ai margini, torbiere di deflusso e piane alluvionali lungo il fiume e la costa. Il corso d'acqua
      si snoda per quasi cento chilometri dal lago di Kummerow fino al Peenestrom, scorrendo in una valle
      larga da uno a due chilometri.


      Sui fianchi, l'ambiente muta d'aspetto. I versanti aridi sui bordi vallivi sono rigogliosi e variopinti
      soprattutto a fine primavera e inizio estate, ospitando elementi steppici legati al bacino dell'Oder
      come la pulsantilla comune. Più in basso, nelle torbiere, abbondano a tal punto le specie rare che due
      orchidee, l'Ostsee-Knabenkraut e il Baltische Knabenkraut, in Germania crescono unicamente nella
      Peenetal. Nel complesso sono state censite circa 750 specie di piante vascolari e felci.
    wildlife: >-
      L'avifauna costituisce la motivazione principale per una visita. Vi nidificano tutte e tre le aquile del
      Meclemburgo-Pomerania Anteriore: il [falco pescatore](/especie/pandion_haliaetus/), l'[aquila di
      mare](/especie/haliaeetus_albicilla/) e la rara [aquila anatraia minore](/especie/aquila_pomarina/).
      Dopo gli interventi di ripristino ambientale sono aumentati il voltolino, il [re di
      quaglie](/especie/crex_crex/), il beccaccino, la pavoncella, la [pittima
      reale](/especie/limosa_limosa/), il [combattente](/especie/philomachus_pugnax/), il [chiurlo
      maggiore](/especie/numenius_arquata/), il [tarabuso](/especie/botaurus_stellaris/), mignattini, sterne,
      il gabbiano comune e il cigno reale. Da quando sono stati aperti i polder, la piana alluvionale ha
      assunto un ruolo cruciale come sito di sosta e foraggiamento per anatre, oche, cigni, pavoncelle,
      piviere dorati, ralli e svassi.


      Nelle acque vallive primeggiano la [lontra europea](/especie/lutra_lutra/) e il [castoro
      europeo](/especie/castor_fiber/), presenti con popolazioni cospicue in tutto il territorio. Se vuoi
      avvistare un castoro, cercalo lungo la Peene d'estate all'imbrunire. Circa 40 specie di mammiferi
      popolano la valle, tra cui il raro vespertilio di Barbastelle tutelato a livello europeo. Delle 51
      specie di pesci d'acqua dolce e migratori autoctoni del Meclemburgo-Pomerania Anteriore, 37 vivono
      stabilmente nel reticolo idrografico della Peene, tra cui la lampreda di fiume, il cobite barbatello, il
      pesce fango europeo, il rodio amaro e il [salmone atlantico](/especie/salmo_salar/). La pianura
      alluvionale ospita inoltre circa due terzi delle farfalle diurne della regione ed è l'unico sito del
      bassopiano tedesco in cui vive il coleottero Menetries-Laufkäfer.
    visit: >-
      Inizia l'itinerario dal centro visite del parco a Stolpe an der Peene. La sua esposizione, arricchita da
      postazioni interattive, plastici e pannelli divulgativi, illustra la fauna, la flora e le vicende
      storiche del parco, con il personale pronto ad assisterti nella pianificazione di itinerari a piedi, in
      bicicletta o in canoa. Per i canoisti, una mappa della Nordland-Verlag segnala tutti i punti di sosta,
      le distanze chilometriche, i belvedere e le torri di avvistamento.


      Tre torri e piattaforme panoramiche sono state rimesse a nuovo; consentono l'accesso a un'apprezzata
      area di sosta lungo la Peene a Dersewitz e a un sentiero assai frequentato a Menzlin. La navigazione
      sulla Peene è consentita, ma nell'area protetta è possibile ormeggiare soltanto presso i punti di
      approdo ufficiali. Nella riserva l'ancoraggio è permesso solo fuori dalle formazioni vegetali
      galleggianti ed è vietato campeggiare. La valle si può percorrere anche tramite sentieri escursionistici
      segnalati da svariati punti.
    history: >-
      Fino a metà del diciannovesimo secolo l'impiego agricolo fu assai modesto, e fino al 1900 l'estrazione
      di torba come combustibile ebbe un peso maggiore rispetto alla coltivazione. Tra il 1992 e il 2009 è
      stato attuato nella valle uno dei maggiori progetti di conservazione della natura della Germania: mirava
      a ripristinare la torbiera alluvionale come corpo torboso attivo, migliorandone il regime idrologico e
      smantellando i polder che avevano fin lì impedito la continuità delle riserve naturali. Le torbiere
      basiche calcaree risultano oggi fortemente minacciate e trovano nella Peenetal il loro principale
      santuario.
    before: >-
      Nelle riserve naturali è severamente vietato allontanarsi dai percorsi segnati, a piedi, in bicicletta o
      a cavallo. Lo spazio aereo è riservato agli uccelli: droni e velivoli sono vietati. Nelle riserve
      occorre mettere sempre in conto la caduta improvvisa di rami o alberi; l'accesso avviene sotto la
      propria responsabilità.
    around: >-
      A ventisei chilometri sorge il [Parco nazionale di Wolin e delta della
      Świna](/lugar/wolinski-park-narodowy---delta-swiny/).
  pt:
    intro: >-
      Um rio que hesita sobre o rumo a tomar. O Peene corre tantas vezes devagar que parece imóvel, e por
      vezes inverte o sentido correndo para oeste. O motivo prende-se com a sua génese: formou-se há cerca de
      10.000 anos, no final da glaciação de Weichsel, como canal de águas de degelo; quando o manto de gelo se
      retirou, o solo elevou-se e abateu-se, fazendo o rio inverter a corrente para este. Desse leito quase
      parado brotou um vale de turfeira baixa: o parque natural Flusslandschaft Peenetal, em
      Mecklemburgo-Pomerânia Ocidental, ao longo do Peene entre Dargun, Demmin, Loitz, Jarmen, Gützkow e
      Anklam. É o vale fluvial mais intacto de todo o norte da Alemanha e uma das maiores turfeiras baixas
      contínuas da Europa Central e Ocidental.
    landscape: >-
      Um rio de águas quase paradas permite que a vida se concentre com abundância. Com águas serenas, o vale
      foi sendo colmatado ao longo dos milénios, originando uma turfeira de vale fluvial típica com turfeiras
      de nascente nos bordos, turfeiras de percolação e áreas inundáveis junto ao rio ou à costa. O rio
      percorre perto de cem quilómetros desde o lago Kummerow até ao Peenestrom, através de um vale com um a
      dois quilómetros de largura.


      Nas encostas, a paisagem ganha novos contornos. As encostas secas periféricas revelam-se viçosas e
      coloridas no final da primavera e início do verão, albergando espécies de estepe associadas à bacia do
      Óder como a anémona-dos-prados. Em baixo, nas turfeiras, ocorrem tantas plantas raras que duas
      orquídeas, o Ostsee-Knabenkraut e o Baltische Knabenkraut, apenas se encontram na Alemanha no Peenetal.
      No cômputo geral foram inventariadas cerca de 750 espécies de plantas com flor e fetos.
    wildlife: >-
      A avifauna é o grande atrativo para uma visita. Aqui nidificam as três espécies de águia de
      Mecklemburgo-Pomerânia Ocidental: a [águia pescadora](/especie/pandion_haliaetus/), a
      [águia-rabalva](/especie/haliaeetus_albicilla/) e a rara [águia-pomarina](/especie/aquila_pomarina/).
      Desde as intervenções de restauro florestal aumentaram a franga-d'água-bastarda, o
      [codornizão](/especie/crex_crex/), a narceja-comum, o abibe-comum, o
      [maçarico-de-bico-direito](/especie/limosa_limosa/), o [combatente](/especie/philomachus_pugnax/), o
      [maçarico-real](/especie/numenius_arquata/), o [abetouro-comum](/especie/botaurus_stellaris/), gaivinas
      e andorinhas-do-mar, o guincho-comum e o cisne-vulgar. A partir da reabertura dos pôlderes, a várzea
      converteu-se num local de paragem e descanso de relevo para patos, gansos, cisnes, abibes,
      tarambolas-douradas, ralídeos e mergulhões.


      Na água, o vale destaca-se pela [lontra-europeia](/especie/lutra_lutra/) e pelo
      [castor-europeu](/especie/castor_fiber/): populações robustas repartidas por todo o território. Se
      quiseres observar um castor, procura-o no Peene no verão ao cair da noite. Cerca de 40 espécies de
      mamíferos povoam o vale, destacando-se entre as protegidas a nível europeu o morcego-morcoveiro. Das 51
      espécies de peixes autóctones de água doce e migradores da região, 37 ocorrem regularmente no Peene,
      entre as quais a lampreia-de-rio, o verdemanho, o peixe-lama, o bodião-amargo e o [salmão
      atlântico](/especie/salmo_salar/). A planície aluvial sustenta ainda dois terços das borboletas diurnas
      da região e é a única estação na planície alemã do escaravelho Menetries-Laufkäfer.
    visit: >-
      Começa a visita pelo centro do parque em Stolpe an der Peene. A sua exposição, equipada com elementos
      interativos, maquetas e painéis interpretativos, detalha a fauna, as plantas e o percurso histórico do
      parque, contando com técnicos aptos a ajudar a delinear percursos a pé, de bicicleta ou de canoa. Para
      os canoístas, uma carta da editora Nordland-Verlag assinala todas as áreas de descanso, a quilometragem
      fluvial, os miradouros e as torres de vigia.


      Três torres e plataformas de observação foram recuperadas; facultam acesso a uma apreciada zona de
      descanso junto ao Peene em Dersewitz e a um trilho muito concorrido em Menzlin. A navegação no Peene é
      autorizada, mas na zona de proteção só é permitido atracar nos ancoradouros oficiais. No espaço
      protegido, a ancoragem só é consentida afastada da vegetação aquática flutuante e é proibido acampar. O
      vale pode igualmente ser percorrido por caminhos sinalizados a partir de diversos pontos.
    history: >-
      Até meados do século XIX a ocupação agrícola foi escassa, e até 1900 a extração de turfa para queima
      superava a atividade agrícola. Entre 1992 e 2009 concretizou-se no vale um dos maiores projetos de
      conservação da natureza da Alemanha: pretendia recuperar a turfeira aluvial como corpo vivo,
      aperfeiçoando a hidrologia e desmantelando os pôlderes que constituíam o principal entrave à criação de
      reservas sem fragmentação. As turfeiras calcárias alcalinas encontram-se hoje criticamente ameaçadas e
      têm no Peenetal o seu refúgio central.
    before: >-
      Nas reservas naturais não podes sair dos trilhos balizados, seja a pé, de bicicleta ou a cavalo. O
      espaço aéreo pertence às aves: os drones e aeronaves são estritamente interditos. Nas reservas deves
      sempre acautelar a queda imprevista de árvores e ramos; a entrada decorre sob a tua própria
      responsabilidade.
    around: >-
      A vinte e seis quilómetros localiza-se o [Parque Nacional de Wolin e Delta do Rio
      Świna](/lugar/wolinski-park-narodowy---delta-swiny/).
