resumen:
  es: >-
    Meseta granítica de 5 km de longitud en el Canal de Bristol, la primera Zona de Conservación Marina
    declarada en el Reino Unido.
  en: >-
    Granite plateau 5 km in length in the Bristol Channel, the first designated Marine Conservation Zone in
    the United Kingdom.
  fr: >-
    Plateau granitique de 5 km de long dans le canal de Bristol, première zone de conservation marine désignée
    au Royaume-Uni.
  de: >-
    Ein 5 km langes Granitplateau im Bristolkanal und die erste ausgewiesene Meeresschutzzone des Vereinigten
    Königreichs.
  it: >-
    Altopiano granitico lungo 5 km nel Canale di Bristol, la prima Zona di Conservazione Marina istituita nel
    Regno Unito.
  pt: >-
    Planalto granítico de 5 km de comprimento no Canal de Bristol, a primeira Zona de Conservação Marinha
    declarada no Reino Unido.
unico:
  es: >-
    Una isla de 5 km donde conviven la única planta endémica, la col de Lundy, con aves marinas que anidan por
    miles y una reserva marina que fue la primera de Inglaterra.
  en: >-
    An island 5 km long where its sole endemic plant, the Lundy cabbage, coexists with seabirds nesting by the
    thousands and a marine reserve that was England’s first.
  fr: >-
    Une île de 5 km où cohabitent son unique plante endémique, le chou de Lundy, des milliers d’oiseaux marins
    nicheurs et une réserve marine qui fut la première d’Angleterre.
  de: >-
    Eine 5 km lange Insel, auf der ihre einzige endemische Pflanze, der Lundy-Kohl, neben tausenden nistenden
    Seevögeln und Englands erstem Meeresschutzgebiet gedeiht.
  it: >-
    Un’isola di 5 km dove convivono la sua unica pianta endemica, il cavolo di Lundy, uccelli marini che
    nidificano a migliaia e una riserva marina che fu la prima d’Inghilterra.
  pt: >-
    Uma ilha de 5 km onde coexistem a sua única planta endémica, a couve-de-Lundy, milhares de aves marinhas
    nidificantes e uma reserva marinha que foi a primeira de Inglaterra.
observaciones:
  es: >-
    Los frailecillos, araos, gaviotas tridáctilas, pardelas pichonetas y alcas están protegidos en la isla. No
