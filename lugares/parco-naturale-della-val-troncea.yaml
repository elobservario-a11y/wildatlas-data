texto:
  es:
    intro: >-
      En 1826 mataron en Pragelato al último lince. Hacia 1840 cayeron los últimos lobos, que volvieron solos
      a finales de los años noventa. La Val Troncea es un lugar donde la fauna ha ido y venido al compás de la
      gente, y donde hoy, de nuevo, el íbice, el rebeco y el quebrantahuesos tienen cielo y roca.


      Es un valle lateral del Chisone, rodeado casi por completo de cumbres de más de 3000 metros, y un parque
      que la Región del Piamonte creó en 1980. Protege 3280 hectáreas en la cabecera de la cuenca del Chisone,
      y 3280 metros mide también la Rognosa del Sestriere, la montaña más alta del valle. El parque ocupa el
      89% del municipio de Pragelato.
    landscape: >-
      El valle tiene dos caras. La vertiente derecha, la alpestre, es de densos bosques de alerce y pino
      cembro que se alternan con extensos pastos de altura. La opuesta es severa: ásperas paredes rocosas que
      caen cientos de metros sobre el cauce del Chisone. Donde el torrente no ha remodelado la forma original,
      se reconoce con claridad el perfil en U que excavaron los glaciares de las épocas Riss y Würm.


      La mano humana hizo el resto. La tala masiva de madera para el Fuerte de Fenestrelle y la mina del Beth
      dejó el aspecto de bosquetes y praderas ideales para el pasto de verano. Al subir, el paisaje se llena
      de flores, de ahí el apodo de Valle de las Flores. La altitud, de 1670 a 3280 metros, favorece bosques
      de alerce, a veces junto al pino cembro, y sobre Seytes crece un bosque casi puro de pino uncinado, el
      pino negro de montaña. El sotobosque tiene enebro, rododendro, arándano y aliso verde. Junto al Chisone
      hay sauces de ribera, y en los cantos rodados coloniza el epilobio de Fleischer.
    wildlife: >-
      Es un parque de mamíferos de montaña: [rebeco](/especie/rupicapra_rupicapra/),
      [íbice](/especie/capra_ibex/), reintroducido en los años ochenta,
      [corzo](/especie/capreolus_capreolus/), [ciervo](/especie/cervus_elaphus/), jabalí,
      [marmota](/especie/marmota_marmota/), garduña, marta, tejón, lirón careto, comadreja, liebres común y
      variable, zorro y armiño. Hay más de sesenta especies de aves. Entre enero y abril el [búho
      real](/especie/bubo_bubo/) y el mochuelo boreal hacen resonar su canto territorial. El
      [quebrantahuesos](/especie/gypaetus_barbatus/) sobrevuela el valle y una pareja nidificante de [águila
      real](/especie/aquila_chrysaetos/) lo usa como territorio de caza. Se pueden descubrir además el gallo
      lira, la perdiz griega, la [perdiz nival](/especie/lagopus_muta/), el pico picapinos, el pito real, el
      [pito negro](/especie/dryocopus_martius/), el cascanueces, la lavandera blanca y el piquituerto.


      En las paredes rocosas anidan la chova piquigualda y la [chova
      piquirroja](/especie/pyrrhocorax_pyrrhocorax/), y junto al torrente es fácil ver el [mirlo
      acuático](/especie/cinclus_cinclus/). En la ruta del Alpe del Meys, un paseo fácil por la pista de fondo
      de valle, se pueden ver marmotas, rebecos, íbices y águilas, sobre todo al atardecer y de mañana. El
      parque recomienda recorrer ese itinerario de mayo a noviembre.
    visit: >-
      El parque se visita libremente en cualquier estación y tiene veintidós itinerarios trazados y
      señalizados que cruzan ambientes muy distintos, del alerzal a las cumbres y del pasto al canchal. Los
      senderos solo se recorren a pie o a caballo: no se admiten vehículos todoterreno ni bicicletas.


      La ruta fácil del Alpe del Meys sale del cruce cerca de Troncea y se hace en unas dos horas y media. El
      Sentiero del Beth sale de la aldea de Troncea: tres horas de subida y dos de bajada, con flora, fauna,
      panorama y fotografía. El Colle del Beth, ruta excursionista, está a 5,3 km de Troncea, y a unas tres
      horas largas desde Troncea queda el Colle Arcano, jornada completa. En la fuente de la Lendeniera,
      cojines de musgo provocan vistosos fenómenos de travertinización.


      La sede del parque, en La Ruà (Pragelato), alberga el centro de visitantes y museo, dedicado a los
      aspectos naturalistas e históricos del territorio, y queda a unos kilómetros del área protegida. En
      Pragelato, la Casa degli Escartons, casa museo del parque, cuenta el pasado fronterizo con Francia.
    history: >-
      Pragelato nació como entidad administrativa en 1343, cuando el delfín Humberto II firmó la Gran Carta de
      las Libertades que dio origen a los Escartons. A finales del siglo XIX la zona se animó con los pastos
      de altura y con la explotación de un yacimiento de calcopirita junto al collado del Beth. En 1904 un
      alud arrastró a 81 mineros y, pocos años después, las minas cerraron. Hoy los antiguos asentamientos se
      usan como pastos de verano.


      El personal del parque estudia la fauna con varias universidades. Para proteger al rebeco existe la
      reserva integral de Banchetta-Vallonetto, y la del Beth cuida especies de flora. En ambas está prohibido
      salirse del sendero e introducir perros; en el resto del parque, los perros van con correa.
    before: >-
      Desde Bivio Seytes, el acceso en vehículo a motor requiere autorización del gestor, porque el número de
      excursionistas es muy alto.
    around: >-
      A seis kilómetros está el [Parque Natural Regional del
      Queyras](/lugar/parc-naturel-regional-du-queyras/) y a siete el [Parque Natural del Gran Bosco de
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/). El [Parque Natural
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) queda a diez kilómetros y el [Parque
      Natural del Monviso](/lugar/parco-naturale-del-monviso/) a veintidós.
  en:
    intro: >-
      In 1826 the last historical lynx was killed in Pragelato. Around 1840 the final wolves were eradicated,
      returning naturally only in the late nineties. Val Troncea is a high mountain sanctuary where wildlife
      has ebbed and flowed alongside human presence, and where today alpine ibex, chamois, and bearded
      vultures once again rule the crags and skies.


      It is an alpine lateral tributary of the Chisone river, almost entirely enclosed by peaks exceeding 3000
      metres. The regional natural park was established by Piedmont in 1980, protecting 3280 hectares across
      the Chisone headwaters. The valley’s culminating crest, Rognosa del Sestriere, also rises to 3280
      metres, and the protected area covers 89% of Pragelato municipality.
    landscape: >-
      The valley presents two starkly contrasting flanks. The right slope is sunny and subalpine, draped in
      dense European larch and Swiss stone pine woods interweaving with expansive high pastures. The opposite
      slope is austere: forbidding rock ramparts plunging hundreds of metres down to the Chisone torrent.
      Where postglacial erosion has not altered the bedrock, the classic U-shaped profile gouged by Riss and
      Würm glaciers remains clearly visible.


      Historical human intervention shaped the open landscape. Heavy timber felling to supply the Fenestrelle
      fortress and the Beth copper mines created mosaic groves and sweeping pastures ideal for summer grazing.
      As you ascend, the meadows fill with vibrant blooms, giving rise to its traditional title: the Valley of
      Flowers. Ranging from 1670 to 3280 metres in altitude, the terrain favours pure larch stands, sometimes
      intermingled with stone pine, while above Seytes grows a dense, almost pure forest of mountain pine
      (*Pinus uncinata*). The understorey features common juniper, rusty-leaved alpenrose, bilberry, and green
      alder. Along the riverbed flourish riparian willows, and glacial moraines are colonized by Fleischer’s
      willowherb.
    wildlife: >-
      The park is a haven for montane mammals: [chamois](/especie/rupicapra_rupicapra/), [alpine
      ibex](/especie/capra_ibex/)—reintroduced during the eighties—alongside [roe
      deer](/especie/capreolus_capreolus/), [red deer](/especie/cervus_elaphus/), wild boars, [alpine
      marmots](/especie/marmota_marmota/), stone martens, pine martens, European badgers, garden dormice,
      least weasels, mountain hares, red foxes, and stoats. Over sixty avian species inhabit the valley. From
      January to April, territorial calls of the [Eurasian eagle-owl](/especie/bubo_bubo/) and boreal owl echo
      through the valley. The soaring [bearded vulture](/especie/gypaetus_barbatus/) roams overhead, while a
      resident breeding pair of [golden eagles](/especie/aquila_chrysaetos/) hunts the upper ridges. Black
      grouse, rock partridges, [rock ptarmigans](/especie/lagopus_muta/), great spotted woodpeckers, European
      green woodpeckers, [black woodpeckers](/especie/dryocopus_martius/), spotted nutcrackers, white
      wagtails, and red crossbills are all recorded.


      Alpine choughs and [red-billed choughs](/especie/pyrrhocorax_pyrrhocorax/) nest in sheer limestone
      cliffs, while the [white-throated dipper](/especie/cinclus_cinclus/) frequents the rushing torrent.
      Along the gentle Alpe del Meys path traversing the valley bottom, hikers easily spot marmots, chamois,
      ibex, and eagles, particularly at sunrise and dusk. Park rangers recommend exploring this trail between
      May and November.
    visit: >-
      The park can be visited freely in any season, offering twenty-two waymarked hiking itineraries
      traversing diverse alpine zones, from larch forests to screes and high-altitude cirques. Trails are
      strictly reserved for foot travel and horseback riding: motor vehicles and mountain bikes are
      prohibited.


      The easy Alpe del Meys path sets out from the junction near Troncea and takes about two and a half
      hours. The historic Sentiero del Beth departs Troncea village: three hours up and two down, renowned for
      alpine flora, panoramic photography, and historic mining remains. Colle del Beth is a classic excursion
      5.3 km from Troncea, while Colle Arcano requires roughly three long hours from Troncea for an all-day
      trek. At the Lendeniera spring, lush bryophyte pillows drive striking petrifying spring phenomena.


      Park headquarters in La Ruà (Pragelato) hosts the visitor centre and museum, located a few kilometres
      outside the reserve. In Pragelato, the Casa degli Escartons museum recounts historic cross-border
      autonomy alongside France.
    history: >-
      Pragelato emerged as an administrative entity in 1343, when Dauphin Humbert II ratified the historic
      Charter of Freedoms creating the Republic of the Escartons. In the late XIX century the valley boomed
      with summer pasturing and chalcopyrite copper extraction near Colle del Beth. In 1904 a catastrophic
      winter avalanche killed 81 miners, leading to the closure of the mining operations a few years later.
      Today, historic mining hamlets serve solely as summer cattle katuns.


      Park biologists conduct ecological research with regional universities. Strict botanical and zoological
      reserves at Banchetta-Vallonetto and Beth protect chamois and endemic plants. Within these reserves,
      leaving the marked trail and bringing dogs is prohibited; across the rest of the park, dogs must be kept
      on a leash.
    before: >-
      Past Bivio Seytes, motorised vehicular access requires prior authorization from park management, as high
      visitor volumes prompt strict summer traffic controls.
    around: >-
      Six kilometres away lies the [Queyras Regional Natural Park](/lugar/parc-naturel-regional-du-queyras/)
      and seven kilometres distant is the [Gran Bosco di Salbertrand Natural
      Park](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/). [Orsiera-Rocciavrè Natural
      Park](/lugar/parco-naturale-orsiera-rocciavre/) is ten kilometres away and [Monviso Natural
      Park](/lugar/parco-naturale-del-monviso/) lies twenty-two kilometres away.
  fr:
    intro: >-
      En 1826, le dernier lynx historique fut abattu à Pragelato. Vers 1840 disparurent les derniers loups,
      revenus naturellement à la fin des années quatre-vingt-dix. Le Val Troncea est un sanctuaire où la
      grande faune a fluctué au rythme des activités pastorales, et où aujourd’hui bouquetins, chamois et
      gypaètes barbus règnent à nouveau sur les crêtes.


      C’est un vallon latéral du Chisone, ceinturé de sommets dépassant 3000 mètres. Le parc naturel fut créé
      par le Piémont en 1980 et protège 3280 hectares aux sources du Chisone ; la Rognosa del Sestriere, point
      culminant du massif, s’élève également à 3280 mètres d’altitude. Le parc occupe 89 % de la commune de
      Pragelato.
    landscape: >-
      La vallée présente deux versants très dissemblables. L’adret offre un paysage alpestre de denses
      mélézins et de pins cembros alternant avec de vastes prairies d’altitude. L’ubac est abrupt et austère,
      formé de falaises vertigineuses plongeant vers le lit du Chisone. Là où l’érosion torrentielle n’a pas
      remanié les versants, le profil en U hérité des glaciers de Riss et de Würm apparaît avec netteté.


      L’histoire humaine a modelé ce paysage ouvert. Les coupes intensives de bois destinées au fort de
      Fenestrelle et aux mines du Beth ont dégagé clairières et alpages d’estive. En prenant de l’altitude, la
      flore explose en une mosaïque de couleurs, d’où le surnom de Vallée des Fleurs. Entre 1670 et 3280
      mètres, l’étagement végétal favorise le mélèze et le pin cembro, tandis qu’au-dessus de Seytes s’étend
      une forêt presque pure de pin à crochets. Le sous-bois abrite genévrier, rhododendron ferrugineux,
      myrtille et aune vert. En bordure du Chisone se développent des saules riverains et l’épilobe de
      Fleischer sur les alluvions.
    wildlife: >-
      Le parc abrite une grande faune montagnarde : le [chamois](/especie/rupicapra_rupicapra/), le [bouquetin
      des Alpes](/especie/capra_ibex/)—réintroduit dans les années quatre-vingt—, le
      [chevreuil](/especie/capreolus_capreolus/), le [cerf élaphe](/especie/cervus_elaphus/), le sanglier, la
      [marmotte des Alpes](/especie/marmota_marmota/), la fouine, la martre, le blaireau, le lérot, la
      belette, le lièvre variable, le renard roux et l’hermine. Plus de soixante espèces d’oiseaux y sont
      observées. Entre janvier et avril, le chant du [grand-duc d’Europe](/especie/bubo_bubo/) et de la
      chouette de Tengmalm résonne dans la vallée. Le [gypaète barbu](/especie/gypaetus_barbatus/) patrouille
      les falaises, et un couple d’[aigles royaux](/especie/aquila_chrysaetos/) y a établi son territoire de
      chasse. Tétras lyre, bartavelle, [lagopède alpin](/especie/lagopus_muta/), pic épeiche, pic vert, [pic
      noir](/especie/dryocopus_martius/), cassenoix moucheté, bergeronnette grise et bec-croisé sont
      régulièrement répertoriés.


      Chocard à bec jaune et [crave à bec rouge](/especie/pyrrhocorax_pyrrhocorax/) nichent sur les parois,
      tandis que le [cincle plongeur](/especie/cinclus_cinclus/) fréquente le torrent. Sur la piste facile de
      l’Alpe del Meys, marmottes, chamois, bouquetins et aigles s’observent aisément à l’aube ou au
      crépuscule. Le parc préconise ce parcours de mai à novembre.
    visit: >-
      Le parc se découvre en toute saison grâce à vingt-deux itinéraires balisés reliant forêts de mélèzes,
      pelouses alpines et éboulis d’altitude. Les chemins sont réservés aux piétons et aux cavaliers : engins
      motorisés et VTT y sont interdits.


      Le parcours familial de l’Alpe del Meys part du croisement près de Troncea et demande deux heures et
      demie. Le Sentiero del Beth s’élève depuis le hameau de Troncea en trois heures de montée et deux de
      descente, remarquable pour sa flore et son histoire minière. Le Colle del Beth se situe à 5,3 km de
      Troncea, tandis que l’ascension du Colle Arcano requiert trois bonnes heures de marche soutenue. À la
      fontaine de la Lendeniera, des coussins de mousses engendrent des formations spectaculaires de tuf
      calcaire.


      Le siège administratif à La Ruà (Pragelato) abrite la maison du parc et un musée naturaliste, à quelques
      kilomètres des limites de la réserve. À Pragelato, la Casa degli Escartons retrace l’histoire des
      libertés montagnardes d’Ancien Régime.
    history: >-
      Pragelato naquit comme communauté administrative en 1343, lors de la signature par le dauphin Humbert II
      de la Grande Charte des Libertés fondant la république des Escartons. À la fin du XIXe siècle,
      l’exploitation minière du cuivre au col du Beth compléta l’économie pastorale. En 1904, une gigantesque
      avalanche engloutit 81 mineurs, entraînant la fermeture définitive des galeries peu après. Les anciens
      bâtiments ne servent plus qu’aux estives.


      Les gardes mènent des recherches avec les universités régionales. Des réserves intégrales préservent la
      faune à Banchetta-Vallonetto et la flore au Beth, interdisant de quitter les sentiers et d’amener des
      chiens ; sur le reste du territoire, les chiens doivent être tenus en laisse.
    before: >-
      Au-delà du Bivio Seytes, l’accès en véhicule motorisé est soumis à autorisation préalable en raison de
      la forte affluence estivale de randonneurs.
    around: >-
      À six kilomètres se trouve le [parc naturel régional du
      Queyras](/lugar/parc-naturel-regional-du-queyras/) et à sept kilomètres le [parc naturel du Grand-Bois
      de Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/). Le [parc naturel
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) se situe à dix kilomètres et le [parc
      naturel du Mont-Viso](/lugar/parco-naturale-del-monviso/) à vingt-deux kilomètres.
  de:
    intro: >-
      Im Jahr 1826 wurde bei Pragelato der letzte Luchs erlegt. Um 1840 fielen die letzten Wölfe, die erst
      Ende der neunziger Jahre aus eigener Kraft zurückkehrten. Das Val Troncea ist ein Hochtal, in dem die
      Tierwelt dem Wandel der Besiedlung folgte und wo heute Steinbock, Gämse und Bartgeier wieder Fels und
      Himmel beherrschen.


      Es handelt sich um ein Seitental des Chisone, fast vollständig von Gipfeln über 3000 Metern umringt. Die
      Region Piemont wies den Naturpark 1980 aus; er schützt 3280 Hektar im Quellgebiet des Chisone. Ebenfalls
      3280 Meter hoch ist die Rognosa del Sestriere, der höchste Berg des Tals. Der Naturpark bedeckt 89 % der
      Gemeindefläche von Pragelato.
    landscape: >-
      Das Tal besitzt zwei gegensätzliche Flanken. Die orografisch rechte Seite ist sonnig und subalpin
      geprägt, bestanden mit dichten Lärchen- und Zirbenwäldern im Wechsel mit weiten Hochalmen. Die
      gegenüberliegende Schattenseite fällt mit schroffen Felswänden Hunderte Meter tief in das Bachbett des
      Chisone ab. Wo postglaziale Bäche das Relief nicht überformt haben, zeigt sich das markante U-förmige
      Trogtalprofil der Riss- und Würm-Kaltzeiten.


      Historische Nutzungen prägten die Landschaft nachhaltig. Umfassende Holzschläge für die Festung
      Fenestrelle und das Beth-Bergwerk schufen lichte Forste und ideale Sommerweiden. Mit zunehmender Höhe
      verwandeln sich die Hänge in ein Blütenmeer, was dem Tal den Beinamen Blumental einbrachte. Zwischen
      1670 und 3280 Metern Höhe gedeihen Lärchen und Zirben, während oberhalb von Seytes ein nahezu
      geschlossener Bestand der Bergkiefer (*Pinus uncinata*) wächst. Wacholder, Rostblättrige Alpenrose,
      Heidelbeere und Grünerle bilden den Unterwuchs. Entlang des Chisone siedeln Uferweiden und Fleischers
      Weidenröschen auf Schotterbänken.
    wildlife: >-
      Der Park ist ein Refugium alpiner Säugetiere: [Gämse](/especie/rupicapra_rupicapra/),
      [Alpensteinbock](/especie/capra_ibex/)—in den achtziger Jahren wiederangesiedelt—,
      [Reh](/especie/capreolus_capreolus/), [Rothirsch](/especie/cervus_elaphus/), Wildschwein,
      [Alpenmurmeltier](/especie/marmota_marmota/), Steinmarder, Baummarder, Dachs, Gartenschläfer,
      Mauswiesel, Schneehase, Rotfuchs und Hermelin. Über sechzig Vogelarten brüten im Tal. Von Januar bis
      April rufen [Uhu](/especie/bubo_bubo/) und Raufußkauz. Der [Bartgeier](/especie/gypaetus_barbatus/)
      kreist über den Graten, und ein Brutpaar des [Steinadlers](/especie/aquila_chrysaetos/) nutzt das Tal
      als Jagdrevier. Birkhuhn, Steinhuhn, [Alpenschneehuhn](/especie/lagopus_muta/), Buntspecht, Grünspecht,
      [Schwarzspecht](/especie/dryocopus_martius/), Tannenhäher, Bachstelze und Fichtenkreuzschnabel sind
      heimisch.


      Alpendohle und [Alpenkrähe](/especie/pyrrhocorax_pyrrhocorax/) nisten in den Steilwänden, während die
      [Wasseramsel](/especie/cinclus_cinclus/) an den Stromschnellen jagt. Entlang des einfachen Talwegs zur
      Alpe del Meys lassen sich Murmeltiere, Gämsen, Steinböcke und Adler vor allem am Morgen und Abend
      beobachten. Die Parkverwaltung empfiehlt diese Route von Mai bis November.
    visit: >-
      Der Park steht Besuchern zu jeder Jahreszeit offen und verfügt über zweiundzwanzig markierte
      Wanderrouten, die Lärchenwälder, Almwiesen und Blockhalden erschließen. Die Wege sind ausschließlich
      Fußgängern und Reitern vorbehalten: Kraftfahrzeuge und Mountainbikes sind verboten.


      Die leichte Talwanderung zur Alpe del Meys beginnt am Abzweig nahe Troncea und dauert etwa zweieinhalb
      Stunden. Der Sentiero del Beth startet im Weiler Troncea: drei Stunden Aufstieg und zwei Stunden Abstieg
      bieten Botanik, Panorama und Bergbaugeschichte. Zum Colle del Beth führt ein 5,3 km langer Bergpfad ab
      Troncea; für den Colle Arcano sind rund drei lange Stunden einfacher Weg einzuplanen. An der
      Lendeniera-Quelle bilden Moospolster beeindruckende Kalktuff-Formationen.


      Die Parkverwaltung in La Ruà (Pragelato) betreibt ein Besucherzentrum mit naturkundlichem Museum wenige
      Kilometer vor dem Schutzgebiet. In Pragelato dokumentiert das Museum Casa degli Escartons die Geschichte
      der einstigen autonomen Talgemeinschaft.
    history: >-
      Pragelato konstituierte sich 1343 als Verwaltungsgemeinschaft, als Dauphin Humbert II. den
      Freiheitsbrief der Republik der Escartons besiegelte. Im späten XIX. Jahrhundert erlebte das Tal durch
      Almbewirtschaftung und den Abbau von Kupferkies am Colle del Beth einen Aufschwung. Im Jahr 1904
      forderte eine gewaltige Lawine 81 Bergleute das Leben, woraufhin die Bergwerke bald stillgelegt wurden.
      Die Ruinen dienen heute nur noch der Almwirtschaft.


      Die Parkwacht erforscht die Gebirgsfauna gemeinsam mit Universitäten. Totalreservate in
      Banchetta-Vallonetto und am Beth schützen Gämsen und seltene Bergpflanzen; dort ist das Verlassen der
      Wege sowie das Mitführen von Hunden verboten. Im restlichen Parkgebiet herrscht Leinenpflicht.
    before: >-
      Ab Bivio Seytes ist die Zufahrt mit Motorfahrzeugen genehmigungspflichtig, da der Parkverwaltung im
      Sommer ein starker Besucherandrang begegnet.
    around: >-
      Sechs Kilometer entfernt liegt der [Regionale Naturpark
      Queyras](/lugar/parc-naturel-regional-du-queyras/) und sieben Kilometer entfernt der [Naturpark Gran
      Bosco di Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/). Der [Naturpark
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) liegt zehn Kilometer und der [Naturpark
      Monviso](/lugar/parco-naturale-del-monviso/) zweiundzwanzig Kilometer entfernt.
  it:
    intro: >-
      Nel 1826 venne abbattuta a Pragelato l’ultima lince storica. Verso il 1840 scomparvero gli ultimi lupi,
      ritornati spontaneamente solo alla fine degli anni novanta. La Val Troncea è un santuario alpino in cui
      la fauna ha seguito le vicende umane e dove oggi stambecchi, camosci e gipeti dominano nuovamente pareti
      e cieli.


      È una valle tributaria laterale del Chisone, cinta quasi per intero da vette che superano i 3000 metri.
      Il parco naturale è stato istituito dalla Regione Piemonte nel 1980 e tutela 3280 ettari nella testata
      del bacino del Chisone; a quota 3280 metri svetta pure la Rognosa del Sestriere, la cima più elevata
      della valle. L’area protetta interessa l’89% del comune di Pragelato.
    landscape: >-
      La valle rivela due versanti contrapposti. Il versante destro, aprico e subalpino, è ammantato da fitti
      boschi di larice e pino cembro che si alternano a pascoli d’alta quota. Quello opposto è severo:
      dirupate pareti rocciose precipitano per centinaia di metri sul torrente Chisone. Nei settori in cui
      l’erosione torrentizia non ha rimodellato i versanti, spicca il limpido profilo a U inciso dai ghiacciai
      delle ere Riss e Würm.


      L’attività dell’uomo ha plasmato il mosaico vegetale. I massicci disboscamenti storici per il Forte di
      Fenestrelle e le miniere del Beth hanno favorito radure e pascoli estivi. Salendo di quota, i pendii si
      coprono di fioriture variopinte, valendo alla valle l’appellativo di Valle dei Fiori. Tra 1670 e 3280
      metri l’altitudine favorisce i lariceti misti a pino cembro, mentre sopra Seytes cresce una foresta
      quasi pura di pino uncinato. Il sottobosco è ricco di ginepro, rododendro, mirtillo e ontano verde.
      Lungo il Chisone vegetano salici ripariali ed epilobio di Fleischer sui depositi alluvionali.
    wildlife: >-
      Il parco accoglie una ricca fauna alpina: [camoscio](/especie/rupicapra_rupicapra/),
      [stambecco](/especie/capra_ibex/)—reintrodotto negli anni ottanta—,
      [capriolo](/especie/capreolus_capreolus/), [cervo](/especie/cervus_elaphus/), cinghiale,
      [marmotta](/especie/marmota_marmota/), faina, martora, tasso, ghiro, donnola, lepre variabile, volpe ed
      ermellino. Si contano oltre sessanta specie di uccelli. Tra gennaio e aprile risuona il canto
      territoriale del [gufo reale](/especie/bubo_bubo/) e della civetta capogrosso. Il
      [gipeto](/especie/gypaetus_barbatus/) sorvola i crinali e una coppia nidificante di [aquila
      reale](/especie/aquila_chrysaetos/) caccia nelle praterie sommitali. Si incontrano gallo forcello,
      coturnice, [pernice bianca](/especie/lagopus_muta/), picchio rosso maggiore, picchio verde, [picchio
      nero](/especie/dryocopus_martius/), nocciolaia, ballerina bianca e crociere.


      Grajot e [gracchio corallino](/especie/pyrrhocorax_pyrrhocorax/) nidificano sulle pareti rocciose,
      mentre lungo il torrente è frequente il [merlo acquaiolo](/especie/cinclus_cinclus/). Lungo la pista
      pianeggiante per l’Alpe del Meys, marmotte, camosci, stambecchi e aquile si avvistano con facilità
      all’alba e al crepuscolo. L’ente gestore consiglia la visita di questo tracciato da maggio a novembre.
    visit: >-
      Il parco è accessibile in ogni stagione attraverso ventidue itinerari segnalati che attraversano
      ambienti diversificati, dai lariceti ai circhi glaciali e pietraie. I percorsi sono riservati
      esclusivamente al cammino a piedi e al cavallo: sono vietati mezzi a motore e mountain bike.


      La passeggiata agevole verso l’Alpe del Meys parte dal bivio presso Troncea e richiede due ore e mezza.
      Il Sentiero del Beth risale dall’abitato di Troncea: tre ore di salita e due di discesa tra botanica,
      panorami e memorie minerarie. Il Colle del Beth dista 5,3 km da Troncea, mentre per il Colle Arcano
      occorrono circa tre lunghe ore per un trekking giornaliero. Presso la fontana della Lendeniera
      cuscinetti di muschio innescano scenografici depositi di travertino.


      La sede del parco a La Ruà (Pragelato) ospita il centro visite e museo naturalistico a pochi chilometri
      dai confini dell’area. A Pragelato la Casa degli Escartons illustra la secolare autonomia repubblicana
      delle valli alpine.
    history: >-
      Pragelato nacque come entità autonoma nel 1343 con la firma della Grande Carta delle Libertà concessa
      dal delfino Umberto II, dando vita alla confederazione degli Escartons. A fine Ottocento la vita del
      vallone fu scandita dai pascoli e dall’estrazione di calcopirite al Colle del Beth. Nel 1904 una
      drammatica valanga travolse 81 minatori, determinando la chiusura delle miniere pochi anni dopo. I
      vecchi fabbricati fungono oggi da ricoveri per gli alpeggi.


      I guardaparco collaborano a progetti di monitoraggio con gli atenei piemontesi. Le riserve integrali di
      Banchetta-Vallonetto e del Beth tutelano camosci e specie botaniche sensibili; in queste aree è vietato
      abbandonare i tracciati e condurre cani, mentre nel resto del parco vige l’obbligo di guinzaglio.
    before: >-
      Oltre il Bivio Seytes il transito di veicoli a motore è regolato da permessi speciali a causa della
      forte presenza di escursionisti durante i mesi estivi.
    around: >-
      A sei chilometri si trova il [Parco Naturale Regionale del
      Queyras](/lugar/parc-naturel-regional-du-queyras/) e a sette il [Parco Naturale del Gran Bosco di
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/). Il [Parco Naturale
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) dista dieci chilometri e il [Parco Naturale
      del Monviso](/lugar/parco-naturale-del-monviso/) ventidue.
  pt:
    intro: >-
      Em 1826 foi abatido em Pragelato o último lince histórico. Por volta de 1840 desapareceram os últimos
      lobos, que regressaram de forma espontânea nos finais dos anos noventa. O Val Troncea é um refúgio de
      montanha onde a vida selvagem acompanhou a presença humana, e onde hoje o íbex, a camurça e o
      quebra-ossos recuperaram rochas e céus.


      Trata-se de um vale afluente do Chisone, circundado quase na íntegra por cumes acima dos 3000 metros. O
      parque natural foi criado pela Região do Piemonte em 1980, protegendo 3280 hectares nas nascentes da
      bacia do Chisone; com 3280 metros de altitude culmina a Rognosa del Sestriere, o cume mais alto do vale.
      O parque cobre 89% do município de Pragelato.
    landscape: >-
      O vale ostenta duas vertentes contrastantes. A encosta direita, soalheira e alpestre, é revestida por
      densos povoamentos de lariço e pinheiro-suíço alternando com amplas pastagens de montanha. A encosta
      oposta é agreste: escarpas rochosas que tombam centenas de metros sobre o leito do Chisone. Onde a
      erosão fluvial não alterou o relevo original, destaca-se com nitidez o perfil em U escavado pelas
      glaciações de Riss e Würm.


      A intervenção humana moldou a paisagem vegetal. Os cortes massivos de madeira para o Forte de
      Fenestrelle e as minas de cobre do Beth abriram clareiras e pastagens de verão. À medida que se sobe, os
      prados cobrem-se de flores, justificando a designação tradicional de Vale das Flores. Entre os 1670 e os
      3280 metros de altitude a vegetação acolhe lariços e pinheiros-suíços, enquanto acima de Seytes vegeta
      uma mancha quase pura de pinheiro-uncinado. O sub-bosque possui zimbro, rododendro, mirtilo e
      amieiro-verde. Junto ao Chisone surgem salgueiros ripícolas e o epilóbio-de-fleischer coloniza os
      cascalhais.
    wildlife: >-
      O parque é um refúgio excecional de mamíferos alpinos: [camurça](/especie/rupicapra_rupicapra/),
      [íbex-alpino](/especie/capra_ibex/)—reintroduzido nos anos oitenta—,
      [corço](/especie/capreolus_capreolus/), [veado-vermelho](/especie/cervus_elaphus/), javali,
      [marmota-alpina](/especie/marmota_marmota/), fuinha, marta, texugo, leirão, doninha, lebre-variável,
      raposa e arminho. Registam-se mais de sessenta espécies de aves. Entre janeiro e abril ecoa o chamamento
      territorial do [bufo-real](/especie/bubo_bubo/) e do mocho-funéreo. O
      [quebra-ossos](/especie/gypaetus_barbatus/) patrulha os cumes e um casal reprodutor de
      [águia-real](/especie/aquila_chrysaetos/) utiliza o vale como couto de caça. Assinalam-se ainda o
      galo-lira, a perdiz-mourisca, a [perdiz-nival](/especie/lagopus_muta/), o pica-pau-malhado-grande, o
      pica-pau-verde, o [pica-pau-preto](/especie/dryocopus_martius/), o quebra-nozes, a alvéola-branca e o
      cruza-bico.


      Gralhas-de-bico-amarelo e [gralhas-de-bico-vermelho](/especie/pyrrhocorax_pyrrhocorax/) nidificam nas
      arribas rochosas, enquanto o [melro-d’água](/especie/cinclus_cinclus/) percorre as correntes. No trilho
      fácil para Alpe del Meys, marmotas, camurças, íbex e águias observam-se confortavelmente ao amanhecer e
      ao fim da tarde. O parque aconselha este itinerário de maio a novembro.
    visit: >-
      O parque visita-se livremente em qualquer estação através de vinte e dois itinerários sinalizados que
      cruzam lariçais, prados e circos glaciares. Os trilhos destinam-se exclusivamente a caminhadas e
      percursos equestres: veículos motorizados e bicicletas são proibidos.


      O trilho acessível de Alpe del Meys parte do entroncamento junto a Troncea e dura duas horas e meia. O
      Sentiero del Beth inicia-se na aldeia de Troncea: três horas de subida e duas de descida entre botânica,
      paisagem e arqueologia industrial. O Colle del Beth situa-se a 5,3 km de Troncea, enquanto o Colle
      Arcano exige três longas horas para um percurso de dia inteiro. Na fonte da Lendeniera densas almofadas
      de musgos originam depósitos travertínicos.


      A sede do parque em La Ruà (Pragelato) alberga o centro de acolhimento e museu naturalista a escassos
      quilómetros da reserva. Em Pragelato, a Casa degli Escartons documenta a autonomia comunitária secular
      das repúblicas alpinas.
    history: >-
      Pragelato constituiu-se como entidade territorial em 1343 com a outorga da Carta das Liberdades pelo
      delfim Humberto II, inaugurando a federação dos Escartons. No final do século XIX o vale conheceu
      prosperidade com o pastoreio e as minas de calcopirite no colo do Beth. Em 1904 uma violenta avalanche
      ceifou a vida a 81 mineiros, precipitando o encerramento das minas. Os edifícios servem atualmente de
      apoio às pastagens.


      Os vigilantes da natureza cooperam em estudos ecológicos com universidades. As reservas integrais de
      Banchetta-Vallonetto e Beth resguardam camurças e espécies botânicas; nestas zonas é expressamente
      proibido sair dos caminhos e levar cães, enquanto no resto do parque é obrigatório o uso de trela.
    before: >-
      A partir do Bivio Seytes o acesso de veículos a motor requer autorização da administração face à intensa
      afluência de caminheiros no verão.
    around: >-
      A seis quilómetros fica o [Parque Natural Regional do Queyras](/lugar/parc-naturel-regional-du-queyras/)
      e a sete o [Parque Natural do Gran Bosco de
      Salbertrand](/lugar/parco-naturale-del-gran-bosco-di-salbertrand/). O [Parque Natural
      Orsiera-Rocciavrè](/lugar/parco-naturale-orsiera-rocciavre/) dista dez quilómetros e o [Parque Natural
      do Monviso](/lugar/parco-naturale-del-monviso/) vinte e dois.
