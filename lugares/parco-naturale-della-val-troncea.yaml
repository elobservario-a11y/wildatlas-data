resumen:
  es: Valle glaciar del Chisone con bosques de alerce, praderas de altura y pino negro sobre Seytes.
  en: Chisone glacial valley with larch forests, alpine meadows, and mountain pine above Seytes.
  fr: >-
    Vallée glaciaire du Chisone avec forêts de mélèzes, alpages d’altitude et pin à crochets au-dessus de
    Seytes.
  de: Glaziales Chisonetal mit Lärchenwäldern, alpinen Bergwiesen und Bergkiefern oberhalb von Seytes.
  it: Valle glaciale del Chisone con boschi di larice, praterie d’alta quota e pino uncinato sopra Seytes.
  pt: Vale glaciar do Chisone com florestas de lariço, pastagens de altitude e pinheiro-negro sobre Seytes.
unico:
  es: >-
    Un valle glaciar de flores, bosques de alerce y praderas de altura, sobre el que crece un bosque casi puro
    de pino negro de montaña.
  en: >-
    A glacial valley of wild flowers, larch forests, and high pastures, crowned by an almost pure stand of
    mountain pine.
  fr: >-
    Une vallée glaciaire de fleurs, de mélèzes et d’alpages, dominée par un peuplement quasi pur de pin à
    crochets.
  de: >-
    Ein eiszeitliches Trogtal voller Bergblumen, Lärchenwälder und Hochweiden, gekrönt von einem fast reinen
    Bergkiefernwald.
  it: >-
    Una valle glaciale di fioriture, boschi di larice e pascoli d’alta quota, su cui prospera un popolamento
    quasi puro di pino uncinato.
  pt: >-
    Um vale glaciar de flores, matas de lariço e prados alpinos, dominado por um bosque quase puro de
    pinheiro-uncinado.
