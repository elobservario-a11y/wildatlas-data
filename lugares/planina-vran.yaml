  es: Cúpula montañosa kárstica que cierra por el oeste el valle del Parque Natural Blidinje.
  en: Karst mountain dome enclosing the western flank of the Blidinje Nature Park valley.
  fr: Dôme karstique fermant par l'ouest la dépression du parc naturel de Blidinje.
  de: Karstiger Bergdom, der das Tal des Naturparks Blidinje nach Westen hin abschließt.
  it: Cupola montuosa carsica che sbarra a occidente la conca del Parco Naturale Blidinje.
