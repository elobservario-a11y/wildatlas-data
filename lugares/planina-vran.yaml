unico:
  es: >-
    Una montaña cónica y sin aristas desde cuya cima se ven tres lagos y en cuyas laderas hay cuevas de
    hajduci.
  en: >-
    A rounded, conical mountain without jagged edges from whose peak three lakes are visible, with historic
    hajduk caves on its slopes.
  fr: >-
    Une montagne conique et adoucie d'où l'on aperçoit trois lacs, abritant dans ses versants des grottes de
    haïdouks.
  de: >-
    Ein ebenmäßiger, kegelförmiger Berg, von dessen Gipfel drei Seen zu sehen sind und an dessen Hängen
    Heiduckenhöhlen liegen.
  it: >-
    Una montagna conica e regolare dalla cui cima si scorgono tre laghi, con grotte di aiduchi lungo i
    versanti.
  pt: >-
    Uma montanha cónica e suave a partir de cujo cimo se avistam três lagos, acolhendo grutas de salteadores
    nas suas encostas.
observaciones:
  es: >-
    El agua del manantial Hajdučko no es recomendable para beber, y en ninguna de las dos rutas a Veliki Vran
    hay agua potable: lleva la tuya. Los senderos están señalizados y mantenidos.
texto:
  es:
    intro: >-
      Vran no tiene la silueta que uno espera de una montaña de Herzegovina. Sin grandes paredes ni picos
      afilados, es un cono ancho y suave que el Parque Natural de Blidinje considera su espina dorsal. Su
      cima, Veliki Vran, llega a 2.074 metros, y desde ella se ven tres lagos a la vez: Buško, Blidinje y
      Ramsko. Por sus laderas, cuenta el parque, llevaban los pastores el ganado, se escondían los hajduci de
      los turcos y, siglos antes que ellos, lobos y osos defendían su territorio.
    landscape: >-
      Como no hay grandes contrastes de relieve, Vran parece uniforme. Por eso hay que mirarla de cerca: se
      alternan bosques, pastizales de montaña, pastos y pedregales. Dugo polje y Rudo polje delimitan el
      macizo por el sureste y el este y por el norte, respectivamente. Dugo polje, una depresión de falla
      entre Vran y Čvrsnica, mide 14 kilómetros de largo y unos 3 de ancho. Al oeste, Vran limita con Ljubuša
      y Slani dolac, y al sur con Svinjača, que lo separa de Lip planina y Štitar planina.


      El macizo se divide en dos conjuntos: el de Veliki Vran con la meseta de Metaljka y el de Mali Vran con
      el valle de Svinjača. El agua es otro contraste. Los cursos temporales se concentran sobre todo en el
      sur; el norte casi no tiene agua.
    wildlife: >-
      Más de la mitad de la precipitación del parque cae en forma de nieve, cuyo deshielo mantiene en parte
      las aguas subterráneas en el verano seco. Es una montaña de pastores: en Prskalov dolac hay un viejo
      abrevadero circular de piedra tallada, de 5 metros de diámetro, que usaban los pastores. Y en la ruta
      que sale de Kedžara se entra pronto en una sombra espesa de hayas con varios siglos de edad.


      Los senderos que parten de Masna Luka cruzan un pinar que es el mayor hábitat europeo de la
      [munika](/especie/pinus_heldreichii/), un pino endémico. En julio llegan a Kedžara muchos peregrinos,
      sobre todo chicas jóvenes, a la tumba de Diva Grabovčeva.
    visit: >-
      Hay dos maneras de subir a Veliki Vran, ambas de dificultad moderada y bien marcadas y desbrozadas. La
      de Hajdučke Vrleti empieza a 1250 metros, mide 8 kilómetros, salva 850 de desnivel y lleva siete horas;
      arranca con el bosque de pino y haya y, desde los prados altos, se ve Blidinje hacia Risovac y Čvrsnica.
      La que sale de Kedžara empieza a 1300 metros, mide 9 kilómetros, salva 800 de desnivel y lleva siete
      horas y media: sube en diagonal, por eso es más larga. Ninguna de las dos tiene agua potable.


      Al principio de la primera, junto al camino, está la cueva baja de Mijat Tomić. Una tercera ruta, a Mali
      Vran, sale de un camino de tierra con la señal de Via Dinarica, a unos 2 kilómetros del lago de
      Blidinje, y sube por un bosque ralo de pino y haya que gana altura rápido. A unos 20 minutos de la cima
      de Mali Vran está la cueva superior de Mijat Tomić, con una entrada de unos 3 metros de altura. La cueva
      lleva el nombre de un héroe popular y hajduk.


      Desde Veliki Vran, Čvrsnica se ve grandiosa, con todas sus cumbres y el parque en torno a Risovac, Dugo
      polje y el lago de Blidinje. Masna Luka es el punto del que parten más senderos de todo el parque, entre
      ellos los que van hacia Vran.
    history: >-
      Pastores que llevaban el ganado a pastar por las laderas, y hajduci que, cuenta el parque, dormían bajo
      estos árboles en los calores del verano, escondidos de los turcos: esa es la memoria de Vran. El macizo
      es, con Čvrsnica, la base del Parque Natural de Blidinje.
    before: >-
      El agua del manantial Hajdučko no es recomendable para beber, y en ninguna de las dos rutas a Veliki
      Vran hay agua potable: lleva la tuya. Los senderos están señalizados y mantenidos.
    around: >-
      Pegadas a Vran, a distancia casi nula, están las [Montañas de Čabulja](/lugar/planina-cabulja/) y las
      [Montañas de Prenj](/lugar/planina-prenj/). A unos veinticinco kilómetros se alza el macizo de las
      [Montañas de Kamešnica](/lugar/kamesnica-mountains/).
  en:
    intro: >-
      Vran departs from the profile typical of Herzegovina mountains. Free of sheer cliffs or jagged needles,
      it rises as a broad, gentle cone regarded by Blidinje Nature Park as its backbone. Its summit, Veliki
      Vran, reaches 2,074 metres, offering simultaneous views of three lakes: Buško, Blidinje, and Ramsko.
      Across its flanks, park lore recalls shepherds leading seasonal flocks, hajduks hiding from Ottoman
      patrols, and centuries earlier, wolves and bears defending their wilderness.
    landscape: >-
      Lacking violent relief breaks, Vran appears uniform from afar. Up close, it reveals alternating patches
      of beech woods, high-altitude meadows, pastures, and scree slopes. Dugo polje and Rudo polje define the
      massif to the southeast and east, and to the north, respectively. Dugo polje, a fault depression
      separating Vran from Čvrsnica, measures 14 kilometres long and about 3 wide. To the west, Vran borders
      Ljubuša and Slani dolac, and to the south Svinjača, dividing it from Lip planina and Štitar planina.


      The massif divides into two sectors: Veliki Vran with the Metaljka plateau, and Mali Vran encompassing
      the Svinjača valley. Water availability provides another sharp contrast. Ephemeral streams occur
      predominantly across the south; the northern sector is almost waterless.
    wildlife: >-
      More than half of the park's precipitation falls as snow, whose meltwater replenishes groundwater
      reserves through the arid summer. This is an ancient pastoral mountain: at Prskalov dolac sits a
      historic circular watering trough carved from stone, 5 metres in diameter, once used by herders. Along
      the path from Kedžara, hikers soon enter the dense shade of centuries-old beech trees.


      Trails departing from Masna Luka traverse a pine forest sheltering Europe's largest habitat of [Bosnian
      pine](/especie/pinus_heldreichii/), a Balkan endemic conifer. Each July, many pilgrims, particularly
      young women, gather at Kedžara to visit the tomb of Diva Grabovčeva.
    visit: >-
      Two well-cleared and waymarked trails of moderate difficulty climb Veliki Vran. The trail from Hajdučke
      Vrleti begins at 1250 metres, spans 8 kilometres, surmounts 850 metres of elevation gain, and takes
      seven hours; it starts through pine and beech forest and opens onto alpine meadows overlooking Blidinje
      towards Risovac and Čvrsnica. The trail from Kedžara begins at 1300 metres, covers 9 kilometres, climbs
      800 metres of elevation, and requires seven and a half hours, ascending on a longer diagonal traverse.
      Neither route provides drinking water.


      Near the start of the first route beside the path lies the lower cave of Mijat Tomić. A third trail to
      Mali Vran departs from a dirt road signed for the Via Dinarica, about 2 kilometres from Lake Blidinje,
      ascending through open pine and beech woodland that gains height rapidly. About 20 minutes below the
      summit of Mali Vran sits the upper cave of Mijat Tomić, featuring an entrance some 3 metres high. The
      cave honours a celebrated local hajduk hero.


      From Veliki Vran, Čvrsnica presents a majestic panorama of crags, overlooking Risovac, Dugo polje, and
      Lake Blidinje. Masna Luka serves as the park's main trail hub, including routes to Vran.
    history: >-
      Shepherds driving livestock across high pastures and hajduks sleeping under forest canopies during
      summer heat to evade Ottoman forces: such is the living heritage of Vran. Alongside Čvrsnica, the massif
      forms the foundation of Blidinje Nature Park.
    before: >-
      Water from the Hajdučko spring is not potable, and neither route up Veliki Vran has drinking water:
      carry all water needed. Paths are marked and maintained.
    around: >-
      Bordering Vran almost directly rise the [Čabulja Mountains](/lugar/planina-cabulja/) and the [Prenj
      Mountains](/lugar/planina-prenj/). Some twenty-five kilometres away stands the [Kamešnica
      Mountains](/lugar/kamesnica-mountains/) massif.
  fr:
    intro: >-
      Le Vran s'écarte de la silhouette abrupte des montagnes d'Herzégovine. Dépourvu de parois verticales et
      d'arêtes déchiquetées, ce large dôme conique est considéré par le parc naturel de Blidinje comme son
      épine dorsale. Son sommet, Veliki Vran, culmine à 2 074 mètres et dévoile trois lacs d'un seul regard :
      Buško, Blidinje et Ramsko. Sur ses pentes, les bergers menaient leurs troupeaux, les haïdouks
      échappaient aux Ottomans et, des siècles plus tôt, ours et loups régnaient.
    landscape: >-
      En l'absence de reliefs déchiquetés, le Vran paraît régulier. En s'approchant, on découvre une mosaïque
      de hêtraies, de pelouses alpines et de pierriers. Dugo polje et Rudo polje encadrent le massif au
      sud-est, à l'est et au nord. Dugo polje, fossé d'effondrement entre le Vran et la Čvrsnica, s'étire sur
      14 kilomètres de long pour environ 3 de large. À l'ouest, le Vran côtoie Ljubuša et Slani dolac, et au
      sud Svinjača, qui le sépare de Lip planina et Štitar planina.


      Le massif se scinde en deux ensembles : Veliki Vran avec le plateau de Metaljka, et Mali Vran comprenant
      la vallée de Svinjača. Le réseau hydrographique est contrasté : les écoulements temporaires se
      concentrent au sud, tandis que le nord est presque totalement privé d'eau.
    wildlife: >-
      Plus de la moitié des précipitations du parc tombe sous forme de neige, dont la fonte soutient les
      nappes souterraines durant l'été aride. C'est une montagne pastorale séculaire : à Prskalov dolac
      subsiste un ancien abreuvoir circulaire en pierre taillée de 5 mètres de diamètre. Depuis le sentier de
      Kedžara, on pénètre rapidement sous la canopée de hêtres multicentenaires.


      Les chemins issus de Masna Luka traversent une pinède constituant le plus vaste peuplement européen de
      [pin de Bosnie](/especie/pinus_heldreichii/), conifère endémique des Balkans. En juillet, de nombreux
      pèlerins se rendent à Kedžara sur la tombe de Diva Grabovčeva.
    visit: >-
      Deux itinéraires bien entretenus permettent de gravir Veliki Vran. Celui de Hajdučke Vrleti débute à
      1250 mètres, s'étend sur 8 kilomètres pour 850 mètres de dénivelé et demande sept heures ; il commence
      en forêt de pins et de hêtres avant d'atteindre les alpages face à Risovac et la Čvrsnica. Le tracé de
      Kedžara part de 1300 mètres, fait 9 kilomètres, rachète 800 mètres de dénivelé et exige sept heures et
      demie en montant en diagonale. Aucun ne dispose d'eau potable.


      Au départ du premier itinéraire s'ouvre la grotte basse de Mijat Tomić. Un troisième itinéraire vers
      Mali Vran s'élève depuis une piste fléchée Via Dinarica, à environ 2 kilomètres du lac de Blidinje,
      grimpant dans un bois clairsemé. À 20 minutes du sommet de Mali Vran se cache la grotte haute de Mijat
      Tomić, dont l'entrée mesure 3 mètres de haut. Elle porte le nom d'un célèbre héros haïdouk.


      Du Veliki Vran, la Čvrsnica apparaît grandiose, dominant Risovac, Dugo polje et le lac de Blidinje.
      Masna Luka est le carrefour de randonnée central du parc.
    history: >-
      Bergers guidant leurs troupeaux sur les hauts pâturages et haïdouks dormant sous les ramures l'été pour
      échapper aux Ottomans : telle est la mémoire du Vran. Avec la Čvrsnica, ce relief fonde le parc naturel
      de Blidinje.
    before: >-
      L'eau de la source Hajdučko n'est pas recommandée pour la boisson, et aucun des sentiers menant à Veliki
      Vran ne possède d'eau potable : emportez vos réserves. Les chemins sont balisés.
    around: >-
      Contiguës au Vran s'étendent les [montagnes de Čabulja](/lugar/planina-cabulja/) et les [montagnes de
      Prenj](/lugar/planina-prenj/). À environ vingt-cinq kilomètres s'élève le massif des [montagnes de
      Kamešnica](/lugar/kamesnica-mountains/).
  de:
    intro: >-
      Der Vran weicht vom typischen Erscheinungsbild der Berge der Herzegowina ab. Ohne schroffe Felsabstürze
      oder Zackengrate bildet er einen breiten, sanften Kegel, den der Naturpark Blidinje als sein Rückgrat
      betrachtet. Sein Hauptgipfel, der Veliki Vran, erreicht 2.074 Meter und eröffnet den Blick auf drei Seen
      zugleich: Buško, Blidinje und Ramsko. An seinen Hängen trieben einst Hirten das Vieh, verbargen sich
      Heiducken vor den Osmanen und verteidigten Wölfe und Bären ihr Revier.
    landscape: >-
      Da ausgeprägte Steilstufen fehlen, wirkt der Vran aus der Ferne einförmig. Aus der Nähe wechseln sich
      Buchenwälder, Bergwiesen, Hochweiden und Schutthalden ab. Dugo polje und Rudo polje fassen das Massiv im
      Südosten, Osten und Norden ein. Dugo polje, eine Senke zwischen Vran und Čvrsnica, ist 14 Kilometer lang
      und etwa 3 Kilometer breit. Im Westen grenzt der Vran an Ljubuša und Slani dolac, im Süden an Svinjača,
      das ihn von Lip planina und Štitar planina trennt.


      Das Massiv teilt sich in zwei Bereiche: den Veliki Vran mit dem Metaljka-Plateau und den Mali Vran mit
      dem Svinjača-Tal. Auch beim Wasser zeigen sich Gegensätze: Periodische Bäche fließen vor allem im Süden,
      während der Norden fast wasserlos ist.
    wildlife: >-
      Mehr als die Hälfte des Jahresniederschlags fällt als Schnee, dessen Schmelzwasser die unterirdischen
      Quellen im trockenen Sommer speist. Es ist ein alter Hirtenberg: In Prskalov dolac existiert eine
      historische runde Steintränke von 5 Metern Durchmesser. Auf der Route ab Kedžara taucht man rasch in den
      dichten Schatten jahrhundertealter Buchen ein.


      Die Steige ab Masna Luka queren einen Kiefernwald, der das größte europäische Vorkommen der
      [Schlangenhaut-Kiefer](/especie/pinus_heldreichii/) schützt, einer endemischen Kiefer der
      Balkanhalbinsel. Im Juli pilgern viele Gläubige nach Kedžara zum Grab der Diva Grabovčeva.
    visit: >-
      Zwei gut markierte und gepflegte Routen von mäßiger Schwierigkeit führen auf den Veliki Vran. Der Weg ab
      Hajdučke Vrleti beginnt auf 1250 Metern, ist 8 Kilometer lang, überwindet 850 Höhenmeter und dauert
      sieben Stunden; er beginnt im Kiefern- und Buchenwald und führt zu den Hochweiden mit Blick auf
      Blidinje, Risovac und die Čvrsnica. Der Steig ab Kedžara startet auf 1300 Metern, misst 9 Kilometer,
      überwindet 800 Höhenmeter und erfordert siebeneinhalb Stunden in diagonaler Steigung. Beide Routen haben
      kein Trinkwasser.


      Am Beginn des ersten Steigs liegt die untere Höhle von Mijat Tomić. Eine dritte Route zum Mali Vran
      zweigt von einer Schotterpiste mit Via-Dinarica-Zeichen ab, etwa 2 Kilometer vom Blidinje-See entfernt,
      und steigt steil durch lichten Wald an. Etwa 20 Minuten unter dem Gipfel des Mali Vran liegt die obere
      Höhle von Mijat Tomić mit einem 3 Meter hohen Eingang. Sie erinnert an den legendären Heiduckenführer.


      Vom Veliki Vran zeigt sich die Čvrsnica in voller Pracht über Risovac, Dugo polje und dem Blidinje-See.
      Masna Luka ist der zentrale Ausgangspunkt für Touren im Naturpark.
    history: >-
      Hirten, die ihr Vieh über die Hochalmen trieben, und Heiducken, die im Sommer im Schatten alter Bäume
      vor osmanischen Truppen Zuflucht suchten: Das ist die Überlieferung des Vran. Zusammen mit der Čvrsnica
      bildet das Gebirge das Herz des Naturparks Blidinje.
    before: >-
      Das Wasser der Hajdučko-Quelle ist nicht als Trinkwasser geeignet, und auf den Anstiegen zum Veliki Vran
      gibt es kein Trinkwasser: Nimm ausreichend Vorräte mit. Die Wege sind markiert.
    around: >-
      Direkt an den Vran grenzen das [Čabulja-Gebirge](/lugar/planina-cabulja/) und das
      [Prenj-Gebirge](/lugar/planina-prenj/). Rund fünfundzwanzig Kilometer entfernt ragt das
      [Kamešnica-Gebirge](/lugar/kamesnica-mountains/) auf.
  it:
    intro: >-
      Il Vran si distacca dalle linee aspre consuete dei monti dell'Erzegovina. Privo di pareti verticali e
      guglie frastagliate, è un cono ampio e dolce che il Parco Naturale di Blidinje considera la propria
      colonna portante. La sua cima, Veliki Vran, raggiunge 2.074 metri e consente di ammirare tre laghi
      contemporaneamente: Buško, Blidinje e Ramsko. Lungo i suoi pendii i pastori conducevano il bestiame, gli
      aiduchi si rifugiavano per sfuggire ai turchi e orsi e lupi dominavano la selva.
    landscape: >-
      In assenza di bruschi dislivelli rocciosi, il Vran appare uniforme da lontano. Avvicinandosi si svela un
      mosaico di faggete, pascoli montani e pietraie. Dugo polje e Rudo polje delimitano il massiccio a
      sud-est, a est e a nord. Dugo polje, una fossa tettonica tra il Vran e la Čvrsnica, misura 14 chilometri
      di lunghezza per circa 3 di larghezza. A ovest il Vran confina con Ljubuša e Slani dolac, e a sud con
      Svinjača, che lo separa da Lip planina e Štitar planina.


      Il gruppo montuoso si articola in due settori: il Veliki Vran con l'altopiano di Metaljka e il Mali Vran
      con la valle di Svinjača. Anche la presenza d'acqua segna un contrasto: i corsi temporanei si
      concentrano a sud, mentre il versante nord ne è pressoché privo.
    wildlife: >-
      Oltre la metà delle precipitazioni del parco cade in forma nevosa, alimentando le falde carsiche nella
      stagione estiva secca. È una montagna dalla vocazione pastorale antica: a Prskalov dolac sorge un
      abbeveratoio circolare in pietra scolpita di 5 metri di diametro. Lungo il sentiero da Kedžara si entra
      nell'ombra fitta di faggi secolari.


      I tracciati che muovono da Masna Luka attraversano una pineta che costituisce il maggiore popolamento
      europeo di [pino loricato](/especie/pinus_heldreichii/), conifera endemica balcanica. A luglio molti
      devoti giungono a Kedžara per pregare sulla tomba di Diva Grabovčeva.
    visit: >-
      Due percorsi ben tracciati e di media difficoltà salgono al Veliki Vran. Quello da Hajdučke Vrleti parte
      a 1250 metri, misura 8 chilometri, supera 850 metri di dislivello e impegna sette ore; attraversa pinete
      e faggete per raggiungere i pascoli alti con vista su Blidinje, Risovac e la Čvrsnica. La via da Kedžara
      inizia a 1300 metri, conta 9 chilometri, sale per 800 metri di dislivello e richiede sette ore e mezza
      con salita diagonale. Nessun itinerario ha sorgenti d'acqua potabile.


      Presso l'inizio del primo tracciato si trova la grotta bassa di Mijat Tomić. Una terza via verso Mali
      Vran stacca da una carrareccia segnata Via Dinarica, a circa 2 chilometri dal lago di Blidinje, salendo
      ripida tra pini e faggi. A circa 20 minuti dalla vetta di Mali Vran si trova la grotta superiore di
      Mijat Tomić, con un ingresso alto 3 metri, intitolata al celebre eroe popolare aiduco.


      Dal Veliki Vran la Čvrsnica appare grandiosa sopra Risovac, Dugo polje e il lago di Blidinje. Masna Luka
      è il principale snodo dei sentieri del parco.
    history: >-
      Pastori che salivano all'alpeggio e aiduchi che dormivano all'ombra dei boschi durante le calure estive
      per sfuggire agli ottomani: questa è la memoria del Vran. Insieme alla Čvrsnica, il massiccio
      costituisce l'ossatura del Parco Naturale Blidinje.
    before: >-
      L'acqua della sorgente Hajdučko non è potabile, e lungo le due salite al Veliki Vran non vi è acqua:
      porta con te le scorte idriche. I tracciati sono segnalati.
    around: >-
      Aderenti al Vran sorgono i [Monti di Čabulja](/lugar/planina-cabulja/) e i [Monti di
      Prenj](/lugar/planina-prenj/). A circa venticinque chilometri si leva il massiccio dei [Monti di
      Kamešnica](/lugar/kamesnica-mountains/).
  pt:
    intro: >-
      O Vran afasta-se do perfil agreste habitual nas montanhas da Herzegovina. Sem fragas verticais nem
      cristas afiadas, apresenta-se como um cone largo e suave que o Parque Natural de Blidinje considera a
      sua espinha dorsal. O seu cume, Veliki Vran, atinge 2.074 metros e descortina três lagos em simultâneo:
      Buško, Blidinje e Ramsko. Pelas suas encostas os pastores conduziam o gado, os hajduci refugiavam-se dos
      otomanos e lobos e ursos dominavam a floresta.
    landscape: >-
      Na ausência de grandes desníveis escarpados, o Vran parece uniforme à distância. De perto, revela uma
      alternância de faiais, prados de montanha, pastagens e cascalheiras. Dugo polje e Rudo polje enquadram o
      maciço a sudeste, este e norte. Dugo polje, uma depressão tectónica entre o Vran e a Čvrsnica, mede 14
      quilómetros de comprimento por cerca de 3 de largura. A oeste, o Vran confina com Ljubuša e Slani dolac,
      e a sul com Svinjača, que o separa de Lip planina e Štitar planina.


      O maciço subdivide-se em dois setores: Veliki Vran com o planalto de Metaljka e Mali Vran abrangendo o
      vale de Svinjača. A água constitui outro contraste marcante: as linhas de água efémeras concentram-se a
      sul, enquanto o norte é quase desprovido de cursos de água.
    wildlife: >-
      Mais de metade da precipitação anual do parque surge sob a forma de neve, cujo degelo alimenta os
      aquíferos durante o estio. É uma montanha de tradição pastoril: em Prskalov dolac existe um antigo
      bebedouro circular em pedra talhada com 5 metros de diâmetro. No trilho que parte de Kedžara entra-se de
      imediato sob a copa de faias seculares.


      Os percursos a partir de Masna Luka cruzam um pinhal que representa o maior povoamento europeu de
      [pinheiro-da-Bósnia](/especie/pinus_heldreichii/), conífera endémica dos Balcãs. Em julho ocorrem a
      Kedžara numerosas peregrinações junto ao túmulo de Diva Grabovčeva.
    visit: >-
      Existem duas vias bem abertas e balizadas até ao Veliki Vran, ambas de dificuldade moderada. A rota de
      Hajdučke Vrleti começa a 1250 metros, tem 8 quilómetros de extensão, vence 850 metros de desnível e
      exige sete horas; inicia-se entre pinhais e faiais até alcançar os prados de altitude com vista para
      Blidinje, Risovac e Čvrsnica. A subida a partir de Kedžara parte de 1300 metros, cobre 9 quilómetros,
      supera 800 metros de desnível e demora sete horas e meia em traçado diagonal. Nenhum trilho possui água
      potável.


      Junto ao início do primeiro trilho situa-se a gruta baixa de Mijat Tomić. Um terceiro trajeto para o
      Mali Vran parte de um caminho com marcas da Via Dinarica, a cerca de 2 quilómetros da lagoa de Blidinje,
      subindo por arvoredo disperso. A cerca de 20 minutos do cume do Mali Vran encontra-se a gruta superior
      de Mijat Tomić, com uma entrada de 3 metros de altura, dedicada ao célebre hajduk.


      Do Veliki Vran, a Čvrsnica revela-se monumental sobre Risovac, Dugo polje e a lagoa de Blidinje. Masna
      Luka é o ponto de encontro de trilhos do parque.
    history: >-
      Pastores conduzindo rebanhos nos pastos alpinos e hajduci dormindo à sombra das árvores para escapar às
      patrulhas otomanas: esta é a tradição do Vran. Juntamente com a Čvrsnica, o maciço é a trave mestra do
      Parque Natural de Blidinje.
    before: >-
      A água da nascente Hajdučko não é potável e em nenhuma das rotas para Veliki Vran existe água para
      beber: leva as tuas reservas. Os trilhos estão assinalados.
    around: >-
      Junto ao Vran erguem-se as [Montanhas de Čabulja](/lugar/planina-cabulja/) e as [Montanhas de
      Prenj](/lugar/planina-prenj/). A cerca de vinte e cinco quilómetros ergue-se o maciço das [Montanhas de
      Kamešnica](/lugar/kamesnica-mountains/).
