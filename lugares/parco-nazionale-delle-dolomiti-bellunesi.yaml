resumen:
  es: >-
    El sector más indómito y meridional de los Dolomitas (Patrimonio Mundial UNESCO), con desfiladeros
    kársticos profundos como el Cadini del Brenton.
  en: >-
    The wildest and southernmost sector of the Dolomites (UNESCO World Heritage), carved by deep karst ravines
    such as the Cadini del Brenton.
  fr: >-
    Le secteur le plus sauvage et méridional des Dolomites (Patrimoine mondial UNESCO), entaillé de défilés
    karstiques profonds comme les Cadini del Brenton.
  de: >-
    Der ursprünglichste und südlichste Teil der Dolomiten (UNESCO-Weltnaturerbe), durchfurcht von tiefen
    Karstschluchten wie den Cadini del Brenton.
  it: >-
    Il settore più indomito e meridionale delle Dolomiti (Patrimonio Mondiale UNESCO), inciso da forre
    carsiche profonde come i Cadini del Brenton.
  pt: >-
    O setor mais bravio e meridional das Dolomitas (Património Mundial da UNESCO), rasgado por gargantas
    cársicas profundas como os Cadini del Brenton.
unico:
  es: >-
    Es el rincón de las Dolomitas donde el agua, el karst y los valles solitarios mandan más que las cumbres
    de postal.
  en: >-
    A quiet realm of the Dolomites where rushing waters, karst phenomena, and secluded valleys take precedence
    over postcard peaks.
  fr: >-
    Un recoin secret des Dolomites où les eaux vives, le relief karstique et les vallées solitaires
    l'emportent sur les aiguilles de carte postale.
  de: >-
    Ein stiller Winkel der Dolomiten, in dem Wildwasser, Karstformen und einsame Täler regieren statt
    touristischer Postkartengipfel.
  it: >-
    Un angolo appartato delle Dolomiti dove l'acqua, il carsismo e le valli solitarie contano più delle
    celebri guglie da cartolina.
  pt: >-
    Um recanto esquecido das Dolomitas onde os cursos de água, o carso e os vales recônditos se sobrepõem às
    agulhas de postal.
observaciones:
  es: >-
    Comprueba el estado de los senderos y la apertura del centro «La Santina» antes de ir. Los itinerarios de
    la Val di Canzoi y de la Val Falcina se describen en la web del parque.
texto:
  es:
    intro: >-
      Hay Dolomitas de cumbres con nombre propio y Dolomitas de agua. Las Belluneses son de las segundas:
      valles empinados y poco frecuentados por el turismo de masas, torrentes que corren por gargantas
      profundas, lagos de presa y senderos que remontan arroyos. El Parque Nacional de las Dolomitas
      Belluneses cubre 31.512 hectáreas en la provincia de Belluno, entre el río Cismon al oeste y el Piave al
      este, y es el sector más meridional de unas montañas que la UNESCO declaró Patrimonio Mundial en 2009.
    landscape: >-
      El parque reúne varios macizos: los Alpes Feltrinos (Vette di Feltre, Cimonega, Pizzocco, Brendol,
      Agnelezze), los Monti del Sole, la Schiara, el Talvéna, el Prampèr y el Piz di Mezzodì. Hay zonas
      kársticas de alta montaña, paredes y pedregales, y en medio un territorio de agua: manantiales, pantanos
      y torrentes como el Cordevole, el Mis, el Caorame, el Stién, el Falcìna, el Ardo, el Vescovà y el
      Prampèra. Algunos corren por gargantas profundas. En la Val di Canzoi afloran la Dolomía Principal y
      huellas de cursos de agua, glaciares cuaternarios y fenómenos kársticos, y la Val Falcina es una
      incisión torrencial en forma de V, excavada en la misma roca y condicionada por una falla.


      Las Vette Feltrine son el grupo más meridional de las Dolomitas y la sección más occidental del parque.
      Su cima principal es el Monte Pavione, de forma piramidal vista desde el Primiero, y entre el refugio
      Dal Piaz y el Pavione se abre una amplia cubeta de alta montaña, la Busa delle Vette, usada como pasto.
      Los Monti del Sole, en cambio, se caracterizan por valles empinados y poco frecuentados; sus cimas
      rondan los 2000 metros. El Talvéna alcanza 2542 metros y la Schiara, 2565.
    wildlife: >-
      La flora incluye rododendros, cardos y edelweiss, con bosques de frondosas y coníferas, pastos y prados.
      En la Val di Canzoi puedes buscar plantas como la Silene di Veselskyi, el Asplenio delle Dolomiti y el
      giglio dorato.


      Entre los mamíferos hay [marmota](/especie/marmota_marmota/), armiño, marta, lirón, ardilla, corzo,
      [rebeco](/especie/rupicapra_rupicapra/), ciervo, muflón, [íbice](/especie/capra_ibex/), jabalí,
      [lobo](/especie/canis_lupus/) y [lince](/especie/lynx_lynx/). En primavera, los prados de la Val di
      Canzoi reciben visitas de corzos y muflones. Para los aficionados a las aves, la lista incluye el [pico
      negro](/especie/dryocopus_martius/), el treparriscos, el azor, el [águila
      real](/especie/aquila_chrysaetos/), el mochuelo boreal, el [búho real](/especie/bubo_bubo/), el
      [urogallo](/especie/tetrao_urogallus/) y el [gallo lira](/especie/tetrao_tetrix/), además de la perdiz
      nival; el francolín figura como especie en riesgo de extinción. Junto al lago della Stua y el torrente
      Caorame vive la lavandera cascadeña y el mirlo acuático. También hay cinco especies de murciélagos y
      anfibios como el tritón alpino, la salamandra negra y el sapillo de vientre amarillo.
    visit: >-
      Dos puertas de entrada principales son la Val Canzoi y la Valle del Mis. La Val Canzoi tiene unos 7,5 km
      y termina en el lago della Stua, un embalse con presa de 1952-1953 recorrido por el torrente Caorame. En
      el camino está el Centro de educación ambiental «La Santina», del parque, de donde sale un recorrido
      circular accesible de unos dos kilómetros con tramos elevados por el bosque. Desde el lago parte un
      camino de mulas hasta los Piani Eterni, en el corazón del parque. El valle es famoso además por sus
      calcheras, antiguos hornos de cal viva repartidos por todo el valle.


      El sendero natural de la Val di Canzoi es un anillo de 8,4 km alrededor del lago della Stua que lleva
      unas cuatro horas; el parque lo recomienda de marzo a octubre y lo jalona con diez paneles de geología,
      botánica y fauna. Más breve es el circuito de la Val Falcina: cuatro kilómetros, unas dos horas, ida y
      vuelta a Pian della Falcina; para llegar se sigue la SS 203 hasta Mas y después las indicaciones del
      Valle del Mis.


      Si quieres subir a un refugio, el Dal Piaz está a unas dos horas del Passo Croce d'Aune por un camino de
      mulas fácil, con 900 a 1000 metros de desnivel; el Bruno Boz queda a 2,5 o 3 horas de la Val Canzoi, por
      el Passo Alvis. Por las Vette Feltrine pasa además el tramo final de la Alta Via n. 2 delle Leggende,
      que une Bressanone con Feltre.
    history: >-
      Los valles del Mis cuentan una historia de abandono. La presa del lago del Mis, entre 1957 y 1962,
      sumergió los núcleos bajos y las tierras de cultivo; la riada de 1966 aceleró la huida y el valle está
      deshabitado desde 1972. En Gena Bassa solo se reconstruyó la iglesia de San Remedio, que hoy está a
      orillas del lago. Vallalta fue un pueblo minero, con minas de mercurio entre las sextas del mundo, y hoy
      solo quedan ruinas cubiertas de vegetación.


      El parque se previó en 1988 por impulso de asociaciones ecologistas locales y se concretó en 1990. Con
      la nueva delimitación, sus límites siguen fronteras naturales: crestas, ríos y carreteras. Entre sus
      fines figura promover la ciencia y la educación ambiental.
    before: >-
      Comprueba el estado de los senderos y la apertura del centro «La Santina» antes de ir. Los itinerarios
      de la Val di Canzoi y de la Val Falcina se describen en la web del parque.
    around: >-
      A solo 5 km queda el [Parque Natural Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/), y a menos de treinta kilómetros el
      [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  en:
    intro: >-
      There are Dolomites famous for iconic summits, and Dolomites ruled by water. The Belluno Dolomites
      belong firmly to the second: steep valleys shielded from mass tourism, torrents racing through deep
      limestone gorges, reservoir lakes, and trails tracing wild mountain streams. The Belluno Dolomites
      National Park covers 31,512 hectares in the province of Belluno, between the Cismon River to the west
      and the Piave to the east, forming the southernmost bastion of the mountains inscribed as a UNESCO World
      Heritage Site in 2009.
    landscape: >-
      The park unites several distinct mountain massifs: the Feltrine Alps (Vette di Feltre, Cimonega,
      Pizzocco, Brendol, Agnelezze), the Monti del Sole, the Schiara, the Talvéna, the Prampèr, and Piz di
      Mezzodì. High-altitude karst plateau surfaces, sheer limestone walls, and scree slopes surround an
      aquatic heartland: gushing springs, peat bogs, and torrents including the Cordevole, Mis, Caorame,
      Stién, Falcìna, Ardo, Vescovà, and Prampèra. Several plunge through tight chasms. In Val di Canzoi
      outcropping Principal Dolomite bears the marks of paleorivers, Quaternary glaciers, and karst erosion,
      while Val Falcina forms a sharp V-shaped ravine carved along a tectonic fault.


      The Vette Feltrine form the southernmost group of the Dolomites and the westernmost section of the park.
      Their highest crest is Monte Pavione, presenting a striking pyramidal silhouette when viewed from the
      Primiero; between Rifugio Dal Piaz and Pavione spreads a glacial cirque basin, the Busa delle Vette,
      traditionally grazed by sheep. The Monti del Sole, in contrast, feature steep, untracked, and rarely
      visited valleys, with summits around 2000 metres. Monte Talvéna rises to 2542 metres and the Schiara to
      2565.
    wildlife: >-
      The rich flora displays alpenrose, alpine thistles, and edelweiss, nestled among broadleaved woods,
      coniferous forests, subalpine pastures, and mountain meadows. In Val di Canzoi botanists seek out rare
      endemics such as Veselsky's catchfly, Dolomite spleenwort, and orange lily.


      Mammals include [alpine marmot](/especie/marmota_marmota/), stoat, pine marten, edible dormouse, red
      squirrel, roe deer, [chamois](/especie/rupicapra_rupicapra/), red deer, mouflon, [alpine
      ibex](/especie/capra_ibex/), wild boar, [grey wolf](/especie/canis_lupus/), and [Eurasian
      lynx](/especie/lynx_lynx/). In spring, roe deer and mouflon graze quietly in the meadows of Val di
      Canzoi. The diverse birdlife features the [black woodpecker](/especie/dryocopus_martius/), wallcreeper,
      northern goshawk, [golden eagle](/especie/aquila_chrysaetos/), boreal owl, [Eurasian
      eagle-owl](/especie/bubo_bubo/), [western capercaillie](/especie/tetrao_urogallus/), [black
      grouse](/especie/tetrao_tetrix/), and rock ptarmigan, alongside hazel grouse; riparian stretches along
      Lake della Stua and the Caorame stream host grey wagtail and white-throated dipper. Bats number five
      species, and amphibians include alpine newt, alpine salamander, and yellow-bellied toad.
    visit: >-
      Two primary gateways open into the park: Val Canzoi and Valle del Mis. Val Canzoi stretches for about
      7.5 km, terminating at Lake della Stua, an artificial reservoir formed by a dam built in 1952-1953
      through which flows the Caorame torrent. Along the road sits the park's «La Santina» environmental
      education centre, the starting point for an accessible circular walk of about two kilometres with
      elevated boardwalks through the forest. From the lake, a historic mule track climbs to Piani Eterni in
      the heart of the wilderness. The valley is also renowned for its calchère, historic quicklime kilns
      scattered along the valley floor.


      The Val di Canzoi nature trail is an 8.4 km circuit around Lake della Stua taking about four hours,
      recommended from March to October and guided by ten interpretive panels on geology, botany, and fauna.
      Shorter is the Val Falcina loop: four kilometres, taking about two hours round-trip from Pian della
      Falcina; to reach it, follow highway SS 203 to Mas and follow signs for Valle del Mis.


      For refuge hikes, Rifugio Dal Piaz is roughly two hours from Passo Croce d'Aune along an easy military
      mule track with 900 to 1000 metres of elevation gain; Rifugio Bruno Boz lies 2.5 to 3 hours from Val
      Canzoi via Passo Alvis. Across the Vette Feltrine runs the concluding stage of the Alta Via no. 2 delle
      Leggende from Bressanone to Feltre.
    history: >-
      The Valle del Mis tells a poignant tale of depopulation. The construction of the Mis reservoir between
      1957 and 1962 inundated hamlet dwellings and fertile bottomland; the catastrophic flood of 1966
      accelerated abandonment, leaving the valley uninhabited by 1972. At Gena Bassa only the small chapel of
      San Remedio was reconstructed, now resting by the lakeshore. Vallalta was once a bustling mining town
      with mercury mines ranking among the sixth largest globally, reduced today to overgrown ruins.


      The national park was conceived in 1988 through local environmentalist campaigns and officially
      designated in 1990. Following boundary refinements, its borders align with natural topographic lines:
      sharp crests, rivers, and roads. Its statutory mission prioritizes scientific research and environmental
      education.
    before: >-
      Check trail conditions and opening schedules for «La Santina» visitor centre before your trip. Detailed
      itineraries for Val di Canzoi and Val Falcina are available on the official park website.
    around: >-
      Just 5 km away lies [Parque Natural Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/), and less than thirty kilometres away
      sits [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  fr:
    intro: >-
      Il est des Dolomites célèbres pour leurs clochers élancés et des Dolomites façonnées par l'eau. Les
      Bellunaises incarnent ces dernières : des combes escarpées préservées du tourisme de masse, des torrents
      bondissant dans des gorges calcaires, des retenues de barrages et des sentiers longeant des cascades. Le
      parc national des Dolomites Bellunaises protège 31 512 hectares dans la province de Belluno, entre le
      Cismon à l'ouest et le Piave à l'est, constituant le secteur le plus méridional de ces montagnes
      reconnues au Patrimoine mondial par l'UNESCO en 2009.
    landscape: >-
      Le parc regroupe plusieurs massifs : les Alpes Feltrines (Vette di Feltre, Cimonega, Pizzocco, Brendol,
      Agnelezze), les Monti del Sole, la Schiara, le Talvéna, le Prampèr et le Piz di Mezzodì. S'y côtoient
      hauts plateaux karstiques, falaises et pierriers, irrigués par un réseau aquatique dense : sources,
      tourbières et torrents tels le Cordevole, le Mis, le Caorame, le Stién, la Falcìna, l'Ardo, le Vescovà
      et la Prampèra. Certains plongent dans de véritables gouffres. Dans le val di Canzoi affleure la Dolomie
      Principale portant les marques d'anciens glaciers et de dolines, tandis que le val Falcina forme une
      entaille en V sculptée le long d'une faille tectonique.


      Les Vette Feltrine constituent le groupe le plus méridional des Dolomites et l'extrémité occidentale du
      parc. Leur sommet majeur est le Monte Pavione, dressé en pyramide au-dessus du Primiero ; entre le
      refuge Dal Piaz et le Pavione s'ouvre un grand cirque glaciaire d'altitude, la Busa delle Vette,
      traditionnellement pâturé. Les Monti del Sole forment quant à eux un bastion sauvage et peu fréquenté,
      avec des cimes avoisinant 2000 mètres. Le Talvéna s'élève à 2542 mètres et la Schiara à 2565.
    wildlife: >-
      La flore associe rhododendrons, chardons et edelweiss aux forêts montagnardes, pelouses et alpages. Dans
      le val di Canzoi, on observe des raretés comme la silène de Veselsky, la doradille des Dolomites et le
      lis orangé.


      La faune mammalienne rassemble [marmotte des Alpes](/especie/marmota_marmota/), hermine, martre des
      pins, loir, écureuil, chevreuil, [chamois](/especie/rupicapra_rupicapra/), cerf élaphe, mouflon,
      [bouquetin des Alpes](/especie/capra_ibex/), sanglier, [loup](/especie/canis_lupus/) et [lynx
      boréal](/especie/lynx_lynx/). Au printemps, les clairières du val di Canzoi attirent chevreuils et
      mouflons. Pour les oiseaux, la liste recense [pic noir](/especie/dryocopus_martius/), tichodrome
      échelette, autour des palombes, [aigle royal](/especie/aquila_chrysaetos/), chouette de Tengmalm, [hibou
      grand-duc](/especie/bubo_bubo/), [grand tétras](/especie/tetrao_urogallus/) et [tétras
      lyre](/especie/tetrao_tetrix/), avec la perdrix des neiges et la gélinotte des bois. Au bord du lac
      della Stua et du Caorame nichent bergeronnette des ruisseaux et cincle plongeur. On dénombre cinq
      espèces de chauves-souris ainsi que triton alpestre, salamandre noire et sonneur à ventre jaune.
    visit: >-
      Deux portes d'entrée majeures desservent le parc : le val Canzoi et la vallée du Mis. Le val Canzoi
      s'étire sur environ 7,5 km pour aboutir au lac della Stua, un réservoir créé par un barrage édifié en
      1952-1953 alimenté par le torrent Caorame. Sur le trajet, le centre d'éducation environnementale « La
      Santina » propose une boucle accessible d'environ deux kilomètres avec passerelles surélevées dans le
      sous-bois. Depuis le lac part un sentier muletier vers les Piani Eterni, au cœur de la réserve. La
      vallée est réputée pour ses calcheras, anciens fours à chaux traditionnels.


      Le sentier didactique du val di Canzoi forme une boucle de 8,4 km autour du lac della Stua qui se
      parcourt en environ quatre heures, conseillée de mars à octobre avec dix stations d'interprétation. Plus
      court, le circuit du val Falcina offre quatre kilomètres et environ deux heures aller-retour depuis Pian
      della Falcina ; pour y accéder, empruntez la route SS 203 jusqu'à Mas puis suivez la direction du val
      del Mis.


      Côté refuges, le refuge Dal Piaz s'atteint en deux heures environ depuis le col Croce d'Aune par une
      ancienne piste militaire, avec 900 à 1000 mètres de dénivelé ; le refuge Bruno Boz se situe à 2,5 ou 3
      heures du val Canzoi via le col Alvis. Les Vette Feltrine sont également traversées par l'ultime étape
      de la Haute Route n° 2 reliant Bressanone à Feltre.
    history: >-
      Les vallées du Mis retracent une douloureuse histoire d'exode. La retenue du lac du Mis, entre 1957 et
      1962, noya hameaux et prés fertiles ; la crue dévastatrice de 1966 précipita le départ des habitants et
      la vallée est inhabitée depuis 1972. À Gena Bassa, seule l'église San Remedio a été reconstruite sur les
      berges du lac. Vallalta abrita autrefois un important village minier dont les gisements de mercure
      figuraient parmi les sixièmes au monde, aujourd'hui envahi par la végétation.


      Le parc national a été programmé en 1988 par les associations environnementales et institué en 1990. Ses
      limites épousent les crêtes rocheuses, rivières et routes, avec pour vocation la recherche scientifique
      et la pédagogie.
    before: >-
      Vérifiez la praticabilité des sentiers et les périodes d'ouverture du centre « La Santina » avant votre
      départ. Les parcours du val di Canzoi et du val Falcina sont décrits en détail sur le site officiel du
      parc.
    around: >-
      À seulement 5 km s'étend le [Parque Natural Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/), et à moins de trente kilomètres le
      [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  de:
    intro: >-
      Es gibt berühmte Dolomiten der Felszacken und stille Dolomiten des Wassers. Die Belluneser Berge gehören
      zur zweiten Kategorie: steile, vom Massentourismus verschonte Täler, Wildbäche in tiefen Schluchten,
      Stauseen und einsame Bergpfade. Der Nationalpark Belluneser Dolomiten umfasst 31.512 Hektar in der
      Provinz Belluno zwischen dem Fluss Cismon im Westen und dem Piave im Osten als südlichster Pfeiler des
      2009 von der UNESCO anerkannten Welterbes.
    landscape: >-
      Der Park vereinigt mehrere Gebirgsgruppen: die Feltriner Alpen (Vette di Feltre, Cimonega, Pizzocco,
      Brendol, Agnelezze), die Monti del Sole, die Schiara, die Talvéna, den Prampèr und den Piz di Mezzodì.
      Hochkarstflächen, Wände und Schutthalden umschließen ein weit verzweigtes Gewässernetz: Quellen, Moore
      und Wildbäche wie Cordevole, Mis, Caorame, Stién, Falcìna, Ardo, Vescovà und Prampèra. Einige graben
      sich tief in den Fels. Im Val di Canzoi tritt der Hauptdolomit mit Gletscherschliffen und Karstspalten
      zutage, während das Val Falcina eine V-förmige, an einer Verwerfungslinie entstandene Schlucht bildet.


      Die Vette Feltrine stellen die südlichste Dolomitengruppe und den Westteil des Parks dar. Höchste
      Erhebung ist der pyramidenförmige Monte Pavione; zwischen der Schutzhütte Dal Piaz und dem Pavione
      breitet sich das einstige Weidekar der Busa delle Vette aus. Die Monti del Sole zeichnen sich durch
      unwegsame, steile Täler aus; ihre Kämme erreichen rund 2000 Meter. Der Talvéna erreicht 2542 Meter und
      die Schiara 2565.
    wildlife: >-
      Die Flora vereint Alpenrosen, Disteln und Edelweiß mit Mischwäldern, Nadelgehölzen und Almwiesen. Im Val
      di Canzoi lassen sich botanische Seltenheiten wie Veselsky-Leimkraut, Dolomiten-Streifenfarn und
      Feuerlilie entdecken.


      Unter den Säugetieren leben [Alpenmurmeltier](/especie/marmota_marmota/), Hermelin, Baummarder,
      Siebenschläfer, Eichhörnchen, Reh, [Gämse](/especie/rupicapra_rupicapra/), Rothirsch, Mufflon,
      [Alpensteinbock](/especie/capra_ibex/), Wildschwein, [Wolf](/especie/canis_lupus/) und [Eurasischer
      Luchs](/especie/lynx_lynx/). Im Frühjahr äsen Rehe und Mufflons auf den Talwiesen des Val di Canzoi. Die
      Vogelwelt umfasst [Schwarzspecht](/especie/dryocopus_martius/), Mauerläufer, Habicht,
      [Steinadler](/especie/aquila_chrysaetos/), Raufußkauz, [Uhu](/especie/bubo_bubo/),
      [Auerhuhn](/especie/tetrao_urogallus/), [Birkhuhn](/especie/tetrao_tetrix/) und Alpenschneehuhn; das
      Haselhuhn ist vom Aussterben bedroht. An Stausee und Bächen jagen Gebirgsstelze und Wasseramsel. Fünf
      Fledermausarten sowie Bergmolch, Alpensalamander und Gelbbauchunke ergänzen das Artenspektrum.
    visit: >-
      Zwei Hauptzugänge erschließen das Schutzgebiet: das Val Canzoi und das Valle del Mis. Das Val Canzoi
      zieht sich über rund 7,5 km bis zum Stua-See, einem Stausee mit Staumauer aus den Jahren 1952-1953,
      durchflossen vom Caorame-Bach. Am Talweg liegt das Umweltbildungszentrum «La Santina» mit einem
      barrierefreien Rundweg von etwa zwei Kilometern über Holzstege im Bergwald. Vom See führt ein Saumpfad
      zu den Piani Eterni im Parkzentrum. Berühmt ist das Tal auch für historische Kalköfen (calchère).


      Der Naturlehrpfad im Val di Canzoi umrundet auf 8,4 km den Stua-See in etwa vier Stunden, empfohlen von
      März bis Oktober mit zehn Informationstafeln zu Geologie und Tierwelt. Kürzer ist der Rundweg im Val
      Falcina: vier Kilometer in rund zwei Stunden ab Pian della Falcina; man folgt der SS 203 bis Mas und den
      Schildern ins Valle del Mis.


      Für Hüttenwanderer liegt das Rifugio Dal Piaz etwa zwei Stunden vom Passo Croce d'Aune entfernt auf
      einem leichten Saumweg mit 900 bis 1000 Höhenmetern; das Rifugio Bruno Boz ist in 2,5 bis 3 Stunden vom
      Val Canzoi über den Passo Alvis erreichbar. Über die Vette Feltrine führt zudem der Schlussabschnitt des
      Dolomiten-Höhenwegs Nr. 2 von Brixen nach Feltre.
    history: >-
      Die Mis-Täler erzählen von erzwungener Abwanderung: Der Bau des Mis-Staudamms zwischen 1957 und 1962
      überflutete Weiler und Ackerböden; die Jahrhundertflut von 1966 beschleunigte die Flucht, sodass das Tal
      seit 1972 menschenleer ist. In Gena Bassa wurde nur die Kapelle San Remedio am Seeufer wieder aufgebaut.
      Vallalta war ein Bergwerksdorf, dessen Quecksilberminen zu den sechstgrößten der Welt zählten; heute
      überdauern nur überwucherte Ruinen.


      Der Nationalpark wurde 1988 projektiert und 1990 offiziell eingerichtet. Seine Grenzen folgen
      natürlichen Graten, Flüssen und Straßen. Zu den Hauptaufgaben zählen Umweltforschung und
      Naturschutzbildung.
    before: >-
      Erkundige dich vor Touren über den Zustand der Pfade und Öffnungszeiten des Zentrums «La Santina». Die
      Routen im Val di Canzoi und Val Falcina sind auf der Park-Website beschrieben.
    around: >-
      Nur 5 km entfernt liegt der [Parque Natural Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/) und weniger als dreißig Kilometer der
      [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  it:
    intro: >-
      Vi sono Dolomiti celebri per le vette ardite e Dolomiti plasmate dall'acqua. Le Bellunesi appartengono a
      queste ultime: vallate scoscese e lontane dal turismo di massa, torrenti che corrono in forre profonde,
      laghi artificiali e sentieri lungo corsi d'acqua montani. Il Parco Nazionale delle Dolomiti Bellunesi
      tutela 31.512 ettari nella provincia di Belluno, tra il Cismon a occidente e il Piave a oriente,
      costituendo il baluardo meridionale delle montagne riconosciute Patrimonio Mondiale UNESCO nel 2009.
    landscape: >-
      Il parco accorpa diversi massicci: le Alpi Feltrine (Vette di Feltre, Cimonega, Pizzocco, Brendol,
      Agnelezze), i Monti del Sole, la Schiara, il Talvéna, il Prampèr e il Piz di Mezzodì. Ambienti carsici
      d'alta quota, pareti e ghiaioni convivono con un ricchissimo regno d'acque: sorgenti, torbiere e
      torrenti quali Cordevole, Mis, Caorame, Stién, Falcìna, Ardo, Vescovà e Prampèra. Alcuni scorrono in
      forre serrate. Nella Val di Canzoi affiorano la Dolomia Principale e forme modellate da antichi
      ghiacciai quaternari, mentre la Val Falcina è una forra a V originata lungo una faglia tettonica.


      Le Vette Feltrine costituiscono il gruppo più meridionale delle Dolomiti e il settore occidentale del
      parco. La cima maggiore è il Monte Pavione, dalla marcata sagoma piramidale; tra il rifugio Dal Piaz e
      il Pavione si apre la Busa delle Vette, conca d'altitudine storicamente pascolata. I Monti del Sole
      mostrano valli dirupate e poco frequentate, con quote attorno ai 2000 metri. Il Talvéna tocca i 2542
      metri e la Schiara i 2565.
    wildlife: >-
      La flora associa rododendri, cardi e stelle alpine a boschi di latifoglie, abetaie e pascoli
      d'altitudine. Nella Val di Canzoi si rinvengono endemismi quali la silene di Veselsky, l'asplenio delle
      Dolomiti e il giglio rosso.


      Tra i mammiferi compaiono [marmotta](/especie/marmota_marmota/), ermellino, martora, ghiro, scoiattolo,
      capriolo, [camoscio alpino](/especie/rupicapra_rupicapra/), cervo, muflone,
      [stambecco](/especie/capra_ibex/), cinghiale, [lupo grigio](/especie/canis_lupus/) e
      [lince](/especie/lynx_lynx/). A primavera le radure della Val di Canzoi accolgono caprioli e mufloni al
      pascolo. L'avifauna annovera [picchio nero](/especie/dryocopus_martius/), picchio muraiolo, astore,
      [aquila reale](/especie/aquila_chrysaetos/), civetta capogrosso, [gufo reale](/especie/bubo_bubo/),
      [urogallo](/especie/tetrao_urogallus/), [fagiano di monte](/especie/tetrao_tetrix/), pernice bianca e
      francolino di monte. Lungo il lago della Stua nidificano ballerina gialla e merlo acquaiolo. Si contano
      cinque specie di pipistrelli oltre a tritone alpestre, salamandra alpina e ululone dal ventre giallo.
    visit: >-
      Due accessi privilegiati introducono all'area protetta: la Val Canzoi e la Valle del Mis. La Val Canzoi
      misura circa 7,5 km e termina al lago della Stua, bacino artificiale con diga del 1952-1953 percorso dal
      torrente Caorame. Lungo la valle sorge il centro didattico «La Santina», punto di partenza di un anello
      accessibile di circa due chilometri con passerelle sopraelevate nel bosco. Dal lago risale una
      mulattiera diretta ai Piani Eterni nel cuore del parco. La valle conserva inoltre antiche fornaci da
      calce (calchere).


      Il sentiero natura della Val di Canzoi compie un anello di 8,4 km attorno al lago della Stua in circa
      quattro ore, consigliato da marzo a ottobre con dieci bacheche esplicative. Più breve è il circuito
      della Val Falcina: quattro chilometri percorsi in circa due ore ad anello da Pian della Falcina,
      raggiungibile seguendo la SS 203 fino a Mas e proseguendo per la Valle del Mis.


      Tra i rifugi alpini, il Dal Piaz dista circa due ore dal Passo Croce d'Aune lungo una mulattiera
      militare con 900-1000 metri di dislivello; il rifugio Bruno Boz si raggiunge in 2,5 o 3 ore dalla Val
      Canzoi attraverso il Passo Alvis. Le Vette Feltrine ospitano inoltre il tratto terminale dell'Alta Via
      n. 2 delle Leggende da Bressanone a Feltre.
    history: >-
      Le valli del Mis testimoniano una dolorosa storia di abbandono: la creazione dell'invaso del Mis tra il
      1957 e il 1962 sommerse borghi e campi coltivati; la tragica alluvione del 1966 accelerò l'esodo,
      rendendo la vallata disabitata dal 1972. A Gena Bassa è stata ricostruita solo la chiesetta di San
      Remedio in riva al lago. Vallalta fu un operoso villaggio minerario con giacimenti di mercurio tra i
      sesti al mondo, oggi ridotto a silenziose rovine.


      Il parco nazionale fu previsto nel 1988 e formalizzato nel 1990. I confini ricalcano linee orografiche
      naturali: creste, corsi d'acqua e strade di fondovalle, promuovendo ricerca scientifica ed educazione
      ambientale.
    before: >-
      Controlla la percorribilità dei sentieri e l'apertura del centro «La Santina» prima di intraprendere
      l'escursione. Le schede dettagliate della Val di Canzoi e della Val Falcina sono consultabili sul sito
      del parco.
    around: >-
      A soli 5 km si trova il [Parque Natural Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/), e a meno di trenta chilometri il
      [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
  pt:
    intro: >-
      Há Dolomitas famosas pelas cristas afiladas e Dolomitas moldadas pela água. As Belluneses pertencem a
      estas últimas: vales alcantilados imunes ao turismo massificado, torrentes que rugem em desfiladeiros
      fundos, albufeiras de montanha e trilhos que acompanham correntes bravias. O Parque Nacional das
      Dolomitas Belluneses resguarda 31.512 hectares na província de Belluno, entre o rio Cismon a ocidente e
      o Piave a oriente, constituindo o extremo meridional destas montanhas declaradas Património Mundial pela
      UNESCO em 2009.
    landscape: >-
      O parque associa vários maciços: os Alpes Feltrinos (Vette di Feltre, Cimonega, Pizzocco, Brendol,
      Agnelezze), os Monti del Sole, a Schiara, o Talvéna, o Prampèr e o Piz di Mezzodì. Planaltos cársicos de
      altitude, muralhas e cascalheiras convivem com um reino de águas vivas: nascentes, turfeiras e torrentes
      como o Cordevole, o Mis, o Caorame, o Stién, a Falcìna, o Ardo, o Vescovà e a Prampèra. Vários rasgam
      gargantas profundas. Na Val di Canzoi aflora a Dolomia Principal com vestígios de cursos fluviais,
      glaciares quaternários e erosão cársica, enquanto a Val Falcina esculpe uma ravina em V condicionada por
      uma falha tectónica.


      As Vette Feltrine formam o grupo mais meridional das Dolomitas e o setor poente do parque. A sua cúpula
      principal é o Monte Pavione, de feição piramidal vista do Primiero; entre o refúgio Dal Piaz e o Pavione
      abre-se a Busa delle Vette, bacia glaciar pastoreada desde tempos ancestrais. Já os Monti del Sole
      caracterizam-se por vales abruptos e desabitados, rondando as cristas os 2000 metros. O Talvéna alcança
      2542 metros e a Schiara 2565.
    wildlife: >-
      A flora associa rododendros, cardos e edelvaisse a matas de folhosas, coníferas e prados alpinos. Na Val
      di Canzoi podem procurar-se raridades botânicas como a silene-de-veselsky, o feto-das-dolomitas e o
      lírio-laranja.


      Entre a mastofauna figuram [marmota](/especie/marmota_marmota/), arminho, marta, arganaz, esquilo,
      corço, [camurça](/especie/rupicapra_rupicapra/), veado, muflão, [íbex](/especie/capra_ibex/), javali,
      [lobo-cinzento](/especie/canis_lupus/) e [lince-euroasiático](/especie/lynx_lynx/). Na primavera, as
      pastagens da Val di Canzoi acolhem corços e muflões. Nas aves destacam-se o
      [pica-pau-preto](/especie/dryocopus_martius/), o trepadeira-dos-muros, o açor, a
      [águia-real](/especie/aquila_chrysaetos/), o mocho-funéreo, o [bufo-real](/especie/bubo_bubo/), o
      [tetraz-grande](/especie/tetrao_urogallus/) e o [tetraz-lira](/especie/tetrao_tetrix/), além da
      lagópode-branca e da galinha-do-mato. Junto à albufeira della Stua e à torrente Caorame nidificam a
      alvéola-cinzenta e o melro-d'água. Há ainda cinco espécies de morcegos e anfíbios como o tritão-alpino,
      a salamandra-alpina e o sapo-de-ventre-amarelo.
    visit: >-
      Duas portas de entrada primordiais conduzem ao parque: a Val Canzoi e o Valle del Mis. A Val Canzoi
      desenvolve-se ao longo de cerca de 7,5 km até à lagoa della Stua, albufeira represada em 1952-1953
      alimentada pela torrente Caorame. No trajeto situa-se o centro educativo «La Santina», de onde parte um
      anel acessível de cerca de dois quilómetros com passadiços sob a copa do bosque. Da albufeira sobe um
      caminho de mulas até aos Piani Eterni no coração do parque. O vale conserva fornos de cal viva
      históricos (calchere).


      O trilho ecológico da Val di Canzoi descreve um anel de 8,4 km em redor da lagoa della Stua percorrível
      em cerca de quatro horas, recomendado de março a outubro e pontuado por dez painéis informativos. Mais
      curto é o circuito da Val Falcina: quatro quilómetros cumpridos em cerca de duas horas a partir de Pian
      della Falcina; acede-se seguindo a estrada SS 203 até Mas e infletindo rumo ao Valle del Mis.


      Para caminhadas de refúgio, o Dal Piaz fica a cerca de duas horas do Passo Croce d'Aune por um caminho
      militar de declive suave, com 900 a 1000 metros de desnível; o Bruno Boz situa-se a 2,5 ou 3 horas da
      Val Canzoi pelo Passo Alvis. Pelas Vette Feltrine passa ainda o troço final da Alta Via n.º 2 das Lendas
      entre Bressanone e Feltre.
    history: >-
      Os vales do Mis guardam memórias de despovoamento forçado: a barragem do lago do Mis, entre 1957 e 1962,
      submergiu aldeias e campos férteis; as cheias trágicas de 1966 precipitaram o êxodo e o vale ficou
      despovoado desde 1972. Em Gena Bassa apenas a capela de San Remedio foi reconstruída à margem da água.
      Vallalta foi um povoado mineiro cujas minas de mercúrio figuraram entre as sextas maiores do mundo, hoje
      reduzidas a ruínas cobertas de vegetação.


      O parque foi projetado em 1988 e instituído em 1990. Os seus limites acompanham divisórias orográficas
      naturais: cristas rochosas, leitos de rios e estradas, com a missão de incentivar a investigação e a
      educação ambiental.
    before: >-
      Informa-te sobre o estado dos trilhos e o funcionamento do centro «La Santina» antes da partida. As
      rotas da Val di Canzoi e da Val Falcina encontram-se descritas no portal oficial do parque.
    around: >-
      A escassos 5 km localiza-se o [Parque Natural Paneveggio - Pale di San
      Martino](/lugar/parco-naturale-paneveggio---pale-di-san-martino/), e a menos de trinta quilómetros o
      [Parque Natural Fanes-Sennes-Braies](/lugar/parco-naturale-fanes-sennes-braies/).
